l_polish:
 tribute_mission_header: "Tributní mise:"
 tribute_mission_suzerain_legitimacy_gain_title: "Legitimita získaná díky tributu"
 tribute_mission_tributary_subject_standing_gain_title: "Zisk [ConcatIfNeitherEmpty(GetPlayer.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')|l]"
 tribute_mission_tributary_subject_standing_gain_tt_minor: "[CZProDrop(tributary_scope,'získala','získal')|U] menší množství [ConcatIfNeitherEmpty(tributary_scope.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')|l]"
 tribute_mission_tributary_subject_standing_gain_tt_major: "[CZProDrop(tributary_scope,'získala','získal')|U] #EMP značné#! množství [ConcatIfNeitherEmpty(tributary_scope.Custom('SubjectStandingIcon'),' ')][tributary_scope.Custom('SubjectStanding')|l]"
 tribute_mission.1000.t: "$tribute_mission_header$ Odevzdání tributu"
 tribute_mission.1000.intro: "Vstupujeme do velké síně sídla [overlord_scope.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Vítá nás"
 tribute_mission.1000.intro.overlord: "[overlord_scope.GetTitledFirstName] a vznešeným gestem nás vybízí, abychom přistoupili."
 tribute_mission.1000.intro.diarch: "[receiving_character.GetTitledFirstName], [receiving_character.GetDiarchTitle|l] ve službách [overlord_scope.Custom('CZ_TitledFirstName_G')]. Gestem nás vybízí, abychom přistoupili."
 tribute_mission.1000.intro.councillor: "[receiving_character.GetTitledFirstName], [receiving_character.Custom('CouncilPosition')|l] ve službách [overlord_scope.Custom('CZ_TitledFirstName_G')]. Kývne hlavou a vybídne nás, abychom přistoupili."
 tribute_mission.1000.intro.attendant: "jeden z vysoce postavených služebníků [overlord_scope.Custom('CZ_TitledFirstName_G')]. Omluvně se usměje a vybídne nás, abychom přistoupili."
 tribute_mission.1000.desc.segway: "\n\nBez otálení prohlásím:"
 tribute_mission.1000.desc.bunga_mas: " „Pohleďte na tu nádheru! Sada stromků bunga mas té nejvyšší kvality, vytvořená výhradně pro někoho tak velkolepého, jako je [overlord_scope.GetTitledFirstNameNoTooltip]!“ Lidé vytřeští oči a síní se rozlehne šum."
 tribute_mission.1000.desc.small_gold: " „Dovolte mi předložit skromný tribut. Nevelký rozsahem, zato velký duchem!“ Ukloním se a sloužící přinášejí truhličky s obchodním zbožím."
 tribute_mission.1000.desc.adequate_gold: " „Přinášíme skvostný tribut na důkaz naší úcty k [Select_CString(overlord_scope.IsFemale,'naší paní','našemu pánu')|l]!“ S úsměvem přikývnu, zatímco před shromáždění přinášejí plné koše a nádoby."
 tribute_mission.1000.desc.excessive_gold: " „Pokochejte se tou nádherou!“ Hrdě se usmívám, zatímco síní zní obdivné #EMP óóó#! a #EMP ááá#! nad nezměrným přepychem tributu. Truhlice, nádoby, koše, sochy. #EMP Hojnost.#!"
 tribute_mission.1000.desc.small_herd: " „Přivedli jsme nejlepší kusy z našich stád, připravené sloužit [Select_CString(overlord_scope.IsFemale,'mé paní','mému pánu')|l]!“"
 tribute_mission.1000.desc.adequate_herd: " „Stáje přetékají našimi zvířaty, velkými i malými. Všechna jsou pro [Select_CString(overlord_scope.IsFemale,'naši paní','našeho pána')|l]!“"
 tribute_mission.1000.desc.excessive_herd: " „Pro [Select_CString(overlord_scope.IsFemale,'naši paní','našeho pána')|l] jsme přivedli nesčetná zvířata. Velká, malá, silná i rychlá! Dvoru sídla [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] budou dobře sloužit!“"
 tribute_mission.1000.desc.concubine: " „... představuji další půvabný květ pro zahrady sídla [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]. Je to [human_tribute.GetTitledFirstName]!“ [human_tribute.GetTitledFirstNameNoTooltip|U] pak s půvabem předstoupí. Pod pohledy celé síně se začervená."
 tribute_mission.1000.desc.eunuch: " „... pohleďte na váženého eunucha! [human_tribute.GetTitledFirstName|U] bude hrdě sloužit dvoru sídla [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]!“ [human_tribute.GetTitledFirstNameNoTooltip|U] předstoupí a síň zaplaví moře šepotu."
 tribute_mission.1000.desc.artifact: " „[artifact_to_tribute.Custom('ArtifactType')|U] patří mezi mé nejcennější statky. Nyní tento dar věnuji [overlord_scope.Custom('CZ_TitleAsNameNoTooltip_D')] na znamení naší vzájemné úcty.“ "
 tribute_mission.1000.outro.attendant: "\n\nSlužebník chvíli přemítá. Než dojde k rozhodnutí, využiji příležitosti a promluvím:"
 tribute_mission.1000.outro: "\n\n[receiving_character.GetTitledFirstNameNoTooltip|U] chvíli přemítá. Než dojde k rozhodnutí, využiji příležitosti a promluvím:"
 tribute_mission.1000.treasury: "„A teď ty látky ze sídla [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]... taková nádhera...“"
 tribute_mission.1000.success.t: "Úspěch"
 tribute_mission.1000.success.desc: "Podaří se ti [Select_CString(receiving_character.IsFemale,'ji','jej')|l] přesvědčit"
 tribute_mission.1000.failure.t: "Neúspěšný pokus"
 tribute_mission.1000.failure.desc: "Tvůj pokus zůstane bez povšimnutí"
 tribute_mission.1000.failure.tt: "[receiving_character.GetShortUIName|U] [Select_CString(receiving_character.IsLocalPlayer,'rozhodneš','rozhodne')|l] o daru"
 tribute_mission.1000.artifact: "„[overlord_scope.GetCulture.GetCollectiveNounNoTooltip|U] a jejich řemeslo, to je teprve něco...“"
 tribute_mission.1000.artifact.tt: "Získáš [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy')|l] [Concept('artifact','artefakt')|E]"
 tribute_mission.1000.innovation: "„Sdílení vědomostí — existuje snad vznešenější cíl...“"
 tribute_mission.1000.innovation.tt: "Objevíš novou [Concept('innovation','inovaci')|E] k výzkumu, nebo získáš pokrok [Concept('fascination','fascinace')|E]"
 tribute_mission.1000.development: "„Pokud jde o ty nevyužité trhy v [tributary_scope.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')]...“"
 tribute_mission.1000.monk.tt: "[receiving_character.GetShortUIName|U] ti [Select_CString(receiving_character.IsLocalPlayer,'daruješ','daruje')|l] [Concept('courtier','dvořana')|E], mnicha [CZFaithAdjDecline(overlord_scope.GetFaith,'é')] víry"
 tribute_mission.1000.abstain: "„Kéž nám [tributary_scope.GetFaith.HighGodName] přinese hojnost a blahobyt.“"
 tribute_mission.1000.abstain.treasury.desc: "Darem přichází vzácné obchodní zboží"
 tribute_mission.1000.abstain.artifact.desc: "Vzniká skvostný artefakt"
 tribute_mission.1000.abstain.innovation.desc: "Sdílí se technologický pokrok"
 tribute_mission.1000.abstain.development.desc: "Do tvého hlavního sídla míří [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_sti')|l] kupci"
 tribute_mission.1000.abstain.monk.desc: "Získáš mnicha [CZFaithAdjDecline(overlord_scope.GetFaith,'é')] víry, který bude šířit moudrost"
 tribute_mission.1000.abstain.legitimacy.desc: "Získáš dodatečné požehnání posilující legitimitu"
 tribute_mission.1002.t: "$tribute_mission_header$ Jaký osud čeká"
 tribute_mission.1002.segway: "[tributary_scope.GetTitledFirstName|U] vstupuje se svým doprovodem do velké síně a dychtí po předložení tributu."
 tribute_mission.1002.desc.concubine: "Soudě podle všeho půvabná konkubína. Představuje se jako [human_tribute.GetTitledFirstName]."
 tribute_mission.1002.desc.new_eunuch: "Soudě podle všeho eunuch, kterému není vůbec dobře.\n\n[Select_CString(human_tribute.IsFemale,'Žena','Muž')|U] se představuje jako [human_tribute.GetTitledFirstName]. Při nejistých krůčcích blíž ke mně, abych si [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')|l] vše prohlédnout zblízka, se v obličeji zračí bolest."
 tribute_mission.1002.desc.eunuch: "Soudě podle všeho zkušený eunuch.\n\n[Select_CString(human_tribute.IsFemale,'Žena','Muž')|U] se představuje jako [human_tribute.GetTitledFirstName]. Vyzařuje z [Select_CString(human_tribute.IsFemale,'ní','něj')|l] pokoj a klid neúměrný věku. Zatímco si [Select_CString(human_tribute.IsFemale,'ji','jej')|l] prohlížím, tiše si mě měří."
 tribute_mission.1002.beauty.concubine.good: "\n\nLesklé vlasy, světlá pleť, zářivé oči a lahodné tvary... Kochám se tou postavou a pořád nemám dost."
 tribute_mission.1002.beauty.concubine.bad: "\n\nZacuchané vlasy, skvrnitá pleť... a ta čelist. Na tomhle vzhledu toho mnoho k chválení není. Trochu našpulím rty."
 tribute_mission.1002.physique.concubine.good: "\n\nPůsobivá postava téhle osoby působí tak zdravě, že se i já cítím lépe už při pohledu na [Select_CString(human_tribute.IsFemale,'ni','něj')|l]. Docela se mi to zamlouvá."
 tribute_mission.1002.physique.concubine.bad: "\n\nNeustálé odkašlávání, vyzáblé paže... Na té tělesné schránce něco nesedí, jen těžko říct co. Poněkud mě to zneklidňuje."
 tribute_mission.1002.exterior.plain: "\n\nVzhled možná není ničím výjimečný, ale ta jiskra v oku mě přesto přitahuje."
 tribute_mission.1002.personality.shy: "\n\nKdyž příliš blízko projde dvojice strážných, [human_tribute.GetFirstNameNoTooltip] sebou trhne. Trochu svěsí ramena, snaží se zabírat co nejméně místa a sotva vydá hlásku."
 tribute_mission.1002.personality.bold: "\n\nZe sebejistého postoje je zřejmé, že si [Select_CString(human_tribute.IsFemale,'tahle žena','tenhle muž')|l] dokáže stát za svým. V dobrém i ve zlém."
 tribute_mission.1002.personality.cynical: "\n\nKdyž se paže zvednou do obranného postoje, v koutku oka se objeví záškub. [Select_CString(human_tribute.IsFemale,'Tahle žena','Tenhle muž')|U] má na svět zjevně velice vyhraněný názor."
 tribute_mission.1002.personality.angry: "\n\nStále hlubší vráska mezi obočím prozrazuje, že si [Select_CString(human_tribute.IsFemale,'tahle žena','tenhle muž')|l] na své názory sáhnout nenechá."
 tribute_mission.1002.personality.fallback: "\n\n[human_tribute.GetFirstNameNoTooltip|U] střelí pohledem ke mně, rozhlédne se po místnosti a znovu se zadívá na mě. Jako by tu [Select_CString(human_tribute.IsFemale,'hledala','hledal')|l] klíč k nějaké hádance."
 tribute_mission.1002.a: "„U dvora se pro [Select_CString(human_tribute.IsFemale,'ni','něj')|l] jistě nějaké využití najde.“"
 tribute_mission.1002.b: "„Nuže, mohli bychom tě jmenovat #EMP rovnou...#!“"
 tribute_mission.1002.b.flavor: "To je ale #EMP znamenitý exemplář#!..."
 tribute_mission.1002.c: "„Budeš pracovat přímo pro mě.“"
 tribute_mission.1002.d: "„Hm, zdá se, že teď už máme všude plno.“"
 tribute_mission.1002.d.tt: "[human_tribute.GetShortUIName|U] se [Select_CString(human_tribute.IsLocalPlayer,'vracíš','vrací')|l] pod dohledem do [tributary_scope.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTier_G')]"
 tribute_mission.1005.t: "$tribute_mission_header$ Tribut"
 tribute_mission.1005.t.ai.bunga_mas: "$tribute_mission_header$ [newly_created_bunga_mas.GetNameNoTooltip]"
 tribute_mission.1005.t.bunga_mas: "$tribute_mission_header$ Zlaté květy [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 tribute_mission.1005.t.gold: "$tribute_mission_header$ Zlato [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 tribute_mission.1005.t.herd: "$tribute_mission_header$ Stádo [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 tribute_mission.1005.t.concubine: "$tribute_mission_header$ Květy [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 tribute_mission.1005.t.eunuch: "$tribute_mission_header$ Důvtip [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 tribute_mission.1005.t.artifact: "$tribute_mission_header$ Artefakty [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 tribute_mission.1005.intro.human_tribute: "[tributary_scope.GetTitledFirstName|U] přešlapuje z nohy na nohu a čeká na mé rozhodnutí. Občas úkosem pohlédne na [human_tribute.Custom('CZ_TitledFirstName_A')]."
 tribute_mission.1005.intro: "[tributary_scope.GetTitledFirstName|U] rázně vstoupí do velké síně, nenuceně přistoupí a s podlézavým úsměvem předloží tribut:"
 tribute_mission.1005.desc.bunga_mas: "\n\nStromek se zlatými květy! Ten znamenitý artefakt se tyčí nad zbytkem tributu, který vedle něj působí bezvýznamně. Drobné lístky zachycují světlo a jako by zářily jasem, jemuž se vyrovná jedině můj vlastní.\n\nRychle se ovládnu, abych [Select_CString(ROOT.Char.IsFemale,'nedala','nedal')|l] najevo přílišné nadšení. Jakou přízeň jen oplatit tak nádherný dar..."
 tribute_mission.1005.desc.small_gold: "\n\nPozvednu obočí, zatímco sloužící zkoumají hrst mincí a ozdob tvořících tento skromný tribut.\n\nPokladnici nám to nenaplní. Ale [tributary_scope.GetTitledFirstNameNoTooltip] alespoň [Select_CString(tributary_scope.IsFemale,'splnila','splnil')|l] své tributární povinnosti. Jakou přízeň projevit na oplátku..."
 tribute_mission.1005.desc.adequate_gold: "\n\nNad slušným tributem lehce přikývnu. Drahé kovy a látky tu a tam zachytí světlo a jemně se zalesknou.\n\nTeď k další záležitosti. Jakou přízeň projevit na oplátku..."
 tribute_mission.1005.desc.excessive_gold: "\n\nZlato, látky, drahokamy. Vítá mě okázalá, ale #EMP rozkošná#! přehlídka nadbytku. Pečlivě hlídám svůj výraz, aby mé nadšení nebylo příliš znát.\n\n Tohle se hodí. Jak jen odměnit takovou štědrost..."
 tribute_mission.1005.desc.small_herd: "\n\nTa hrstka zvířat mečí a nervózně se rozhlíží, zatímco je sloužící prohlížejí.\n\nMnoho toho není. Ale [tributary_scope.GetTitledFirstNameNoTooltip] alespoň [Select_CString(tributary_scope.IsFemale,'splnila','splnil')|l] své tributární povinnosti. Jakou přízeň projevit na oplátku..."
 tribute_mission.1005.desc.adequate_herd: "\n\nZvířata slušné kvality se zvědavě rozhlížejí po síni, zatímco je moji sloužící prohlížejí.\n\nBudou pěkným přírůstkem. Jak to jen odměnit..."
 tribute_mission.1005.desc.excessive_herd: "\n\nPředkládaný tribut tvoří jedny z nejlepších kusů dobytka, jaké znám. Lesklá srst, zářivé oči — a další čekají venku. Opravdu působivý tribut.\n\nJak jen odměnit takovou štědrost..."
 tribute_mission.1005.desc.rejected_concubine: "\n\nOdpudivý exemplář. Při dalším pohledu na ten takzvaný tribut našpulím rty. A [tributary_scope.GetTitledFirstNameNoTooltip] [Select_CString(human_tribute.IsFemale,'ji','jej')|l] [Select_CString(tributary_scope.IsFemale,'považovala','považoval')|l] za něco hodného naší pozornosti. #EMP Hmpf.#!\n\nCo teď [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_D')] udělit..."
 tribute_mission.1005.desc.appointed_concubine: "\n\nMá mysl na chvíli zabloudí. S ostýchavým potěšením se kochám křivkami a #EMP přednostmi#! svého nového přírůstku.\n\nCítím, jak mi do tváří stoupá krev, a přinutím se soustředit na aktuální záležitost. Co mám [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_D')] udělit za tak #EMP lahodný#! tribut?"
 tribute_mission.1005.desc.concubine: "\n\nU dvora přibyla další tvář. Jistě se pro [Select_CString(human_tribute.IsFemale,'ni','něj')|l] najde nějaké využití.\n\nJe tedy třeba rozhodnout, co [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_D')] udělím..."
 tribute_mission.1005.desc.rejected_eunuch: "$tribute_mission.1005.desc.rejected_concubine$"
 tribute_mission.1005.desc.appointed_eunuch: "\n\nJako nový vrchní eunuch mi jistě dobře poslouží.\n\nLehce se ušklíbnu a pečlivě zvažuji, co [tributary_scope.Custom('CZ_TitledFirstNameNoTooltip_D')] udělím..."
 tribute_mission.1005.desc.eunuch: "$tribute_mission.1005.desc.concubine$"
 tribute_mission.1005.desc.artifact: "\n\n[artifact_to_tribute.GetName|U] je znamenitý tribut. Opatrně přejedu rukou podél hrany. Bezpochyby poctivá práce.\n\nJak jen na takový dar odpovědět..."
 tribute_mission.1005.desc: "\n\nPečlivě zvažuji předložený tribut.\n\nJak jen na takový dar odpovědět..."
 tribute_mission.1005.treasury: "„Odměníme tvůj tribut vzácným obchodním zbožím.“"
 tribute_mission.1005.artifact: "„Obdařím tě [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_yymi')|l] rodovými památkami.“"
 tribute_mission.1005.artifact.tt: "Odměníš [tributary_scope.Custom('CZ_ShortUINameNoTooltip_A')] [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_yym')|l] [Concept('artifact','artefaktem')|E]"
 tribute_mission.1005.innovation: "„O některé technologické pokroky se můžeme podělit...“"
 tribute_mission.1005.innovation.tt: "Podělíš se s [tributary_scope.Custom('CZ_ShortUINameNoTooltip_I')] o technologický pokrok"
 tribute_mission.1005.development: "„Ve tvém hlavním sídle zřídíme velkolepou obchodní stanici.“"
 tribute_mission.1005.monk: "„Povede tě jeden z mých nejmoudřejších mnichů.“"
 tribute_mission.1005.legitimacy: "„Tímto znovu potvrzuji tvé právo vládnout zemi [tributary_scope.GetCapitalLocation.GetCounty.GetName].“"
 fervor_gain_suzerain_missionaries: "Misionáři suzeréna"
 fervor_loss_suzerain_missionaries: "Odmítnutí misionáři"
 tribute_mission.1010.t: "$tribute_mission_header$ Odjezd"
 tribute_mission.1010.t.treasury: "$tribute_mission_header$ [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|U] obchodní zboží"
 tribute_mission.1010.t.artifact: "$tribute_mission_header$ To nejlepší ze sídla [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 tribute_mission.1010.t.innovation: "$tribute_mission_header$ [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|U] fascinace"
 tribute_mission.1010.t.development: "$tribute_mission_header$ Kupci ze sídla [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 tribute_mission.1010.t.monk: "$tribute_mission_header$ Moudrost víry [overlord_scope.GetFaith.GetNameNoTooltip]"
 tribute_mission.1010.t.legitimacy: "$tribute_mission_header$ Legitimita víry [overlord_scope.GetFaith.GetNameNoTooltip]"
 tribute_mission.1010.intro.attendant: "Služebník ještě chvíli přemítá, než zřejmě dospěje k rozhodnutí."
 tribute_mission.1010.intro: "[receiving_character.GetTitledFirstName|U] si můj tribut prohlíží ze všech stran, než zřejmě dospěje k rozhodnutí."
 tribute_mission.1010.intro.postseal: "Jakmile skončí slavnostní obřad, při němž se uděluje $game_concept_seal_of_investiture$ a stvrzují právní závazky, na odiv přijde nezměrné bohatství země [overlord_scope.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip]."
 tribute_mission.1010.segway: "\n\nNa pokyn směrem k zadní části síně"
 tribute_mission.1010.desc.treasury: "$tribute_mission.1010.segway$ přivážejí množství nádob naplněných drahými látkami, slitky a kořením [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_eeho')|l] původu. Je to nádherná podívaná."
 tribute_mission.1010.desc.artifact: "$tribute_mission.1010.segway$ přinášejí vzácný [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_yy')|l] artefakt. [tribute_reward_type_artifact.GetName|U] spočívá na sametovém polštáři, který jen umocňuje jeho lesk."
 tribute_mission.1010.desc.innovation: "$tribute_mission.1010.segway$ přistupuje skupina mnichů a předává nám několik svitků s novými poznatky a objevy souvisejícími s jejich inovacemi."
 tribute_mission.1010.desc.development: "$tribute_mission.1010.segway$ přistupuje učený služebník a předkládá mi smlouvu.\nStojí v ní obchodní dohoda o zřízení [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_yych')|l] obchodních stanic v [tributary_scope.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_L')], které podpoří rozvoj i celkové bohatství oblasti."
 tribute_mission.1010.desc.monk: "$tribute_mission.1010.segway$ předstoupí [new_monk.Custom('GetArticledAgeDescriptionGender')|l] a představí se. Je to [new_monk.GetTitledFirstName], mnich [overlord_scope.GetFaith.Custom('CZ_AdjectiveNoTooltip_ee')|l] víry. Čile mi sděluje, že se mnou hodlá odcestovat do [tributary_scope.GetCapitalLocation.GetTitle.Custom('CZ_LandedNameNoTierNoTooltip_G')] a nabídnout mi své služby."
 tribute_mission.1010.desc.legitimacy: "\n\nGestem mě vybídne, abych [Select_CString(ROOT.Char.IsFemale,'přistoupila','přistoupil')|l], a pak s majestátní důstojností pomalu sestoupí přede mě. Skloním hlavu. [overlord_scope.GetTitleAsNameNoTooltip|U] provádí obřadní gesta rukama podle [overlord_scope.GetCulture.Custom('CZ_AdjectiveNoTooltip_ee')|l] tradice.\n\nNakonec zazní působivým hlasem: „Tímto znovu potvrzuji tvé právo vládnout zemi [tributary_scope.GetCapitalLocation.GetCounty.GetName]. Jdi v pokoji.“"
 tribute_mission.1010.outro: "\n\n„Mé požehnání tě provázej, [tributary_scope.Custom('CZ_TitleAsNameNoTooltip_V')|l]. Věz, že sídlo [overlord_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] tě zahrnuje svou přízní. Šťastnou cestu.“"
 tribute_mission.1010.a: "„Požehnání i tobě!“"
