 tribute_mission.9000.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char )|U]"
 tribute_mission.9000.desc: "Bohužel si nyní nemohu dovolit zavázat se k předložení tributu.\n\nUpřímně doufám, že [actor.GetTitleAsNameNoTooltip] bude mít pochopení."
 tribute_mission.9000.a: "Skutečně?"
 tribute_mission.9010.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char )|U]"
 tribute_mission.9010.desc: "Samozřejmě poskytneme [actor.Custom('CZ_TitleAsNameNoTooltip_D')] ten nejskvostnější tribut!\n\nVyrážíme na cestu. Naším cílem je [actor.GetCapitalLocation.GetName]."
 tribute_mission.9010.a: "Výtečně."
 tribute_mission.9500.opening: "[overlord.Custom2('AppropriateGreeting', ROOT.Char )|U]"
 tribute_mission.9500.desc: "Mé přesvědčení, že své slovo dodržíš, bylo zřejmě mylné. Jak vidím, na tributáře není spolehnutí.\n\nTvého nedávného selhání při vyslání tributní mise k mému dvoru si nebylo možné nevšimnout."
 tribute_mission.9500.a: "Rozumím."
 tribute_mission.9750.t: "$tribute_mission_header$ Tribut je pryč"
 tribute_mission.9750.desc: "Souhrou nešťastných okolností už náš tribut není mezi námi! [human_tribute.GetTitledFirstName|EU] je pryč...\n\nZamračím se. Neměli bychom se raději otočit, vrátit se a všechno znovu naplánovat?"
 tribute_mission.9750.a: "Ne, musíme tribut dovést do konce!"
 tribute_mission.adequate_reserved_gold: "Vyhraď @gold_icon!#V [THIS.Char.MakeScope.ScriptValue('adequate_gold_tribute_value')]#! na [Concept('tribute','tribut')|E]"
 tribute_mission.9750.b: "Raději se vraťme domů."
 tribute_mission.9750.tt: "$CANCEL_TRAVEL_PLAN_EFFECT$"
 tribute_mission.9760.t: "$tribute_mission_header$ Útěk"
 tribute_mission.9760.desc.vengeful: "Venkovní zmatek mě konečně vytrhne z hlubokého spánku. Napůl při vědomí neochotně naslouchám. Z útržků výkřiků rozeznám #EMP „... tribut je pryč! Najděte [Select_CString(escapee_eunuch.IsFemale,'ji','ho')|l]!“#! Vtom se ve vchodu objeví temná silueta.\n\n„#EMP Kéž mi [escapee_eunuch.GetFaith.HighGodName] odpustí můj hřích!“#! zařve náš lidský tribut, [escapee_eunuch.GetTitledFirstName], a vrhne se na mě.\n\nVyvalím se z lůžka a první ráně uniknu jen o vlásek. Vzápětí už stojíme a kroužíme proti sobě."
 tribute_mission.9760.desc: "Zničehonic se na okamžik probudím. Rozespale se rozhlédnu po stanu a spatřím stín míjející vstupní plachtu. Při doteku chladného nočního vzduchu sebou trhnu, vyhrabu se z lůžka a těžkopádně se dojdu podívat ven.\n\nK mému překvapení tam nestojí nikdo jiný než náš lidský tribut. [escapee_eunuch.GetTitledFirstName|U] se nějak [Select_CString(escapee_eunuch.IsFemale,'dokázala','dokázal')|l] vymknout svému doprovodu.\n\nPři pohledu na mě se v očích objeví strach. „Prosím... vždyť jsi [Select_CString(ROOT.Char.IsFemale,'má','můj')|l] [escapee_eunuch.Custom2('RelationToMe', ROOT.Char )|l]. Tohle nedokážu podstoupit. Prosím,“ žadoní a každou chvíli hrozí útěkem do noci."
 tribute_mission.9760.a: "„#EMP Tak pojď!#!“"
 tribute_mission.9760.a.success: "[escapee_eunuch.GetShortUIName|U] [Select_CString(escapee_eunuch.IsLocalPlayer,'podléháš','podléhá')|l] přesile"
 tribute_mission.9760.a.success.tt: "[escapee_eunuch.GetShortUIName|U] [Select_CString(escapee_eunuch.IsLocalPlayer,'podléháš','podléhá')|l] přesile a [Concept('tribute_mission','tributní mise')|E] pokračuje"
 tribute_mission.9760.a.failure: "[escapee_eunuch.GetShortUIName|U] [Select_CString(escapee_eunuch.IsLocalPlayer,'unikáš a pokoušíš','uniká a pokouší')|l] se vykonat pomstu"
 tribute_mission.9760.b: "„#EMP Stráže!#!“"
 tribute_mission.9760.b.success: "$tribute_mission.9760.a.success$"
 tribute_mission.9760.b.failure: "[escapee_eunuch.GetShortUIName|U] [Select_CString(escapee_eunuch.IsLocalPlayer,'unikáš','uniká')|l]"
 tribute_mission.9760.b.critical_failure: "[escapee_eunuch.GetShortUIName|U] při tom [Select_CString(escapee_eunuch.IsLocalPlayer,'přicházíš','přichází')|l] o život"
 tribute_mission.9760.c: "„Můžeš jít. Jen už #EMP odejdi!#!“"
 tribute_mission.9800.t: "$tribute_mission_header$ Změna plánů"
 tribute_mission.9800.desc.suzerain_turned_liege: "Zdá se, že se mé tributární povinnosti změnily. Nyní jsem totiž vazalem [ROOT.Char.GetLiege.Custom('CZ_TitledFirstName_G')].\n\nDoma je proto spousta jiných věcí k vyřízení a placení tributu už mezi ně nepatří. To je ale zvrat!"
 tribute_mission.9800.desc.no_longer_tributary: "To je ale zvrat! Donesla se ke mně zpráva, že nás už nepoutají okovy tributu!\n\nDoma na mě čeká tolik záležitostí a otázek. Nejdůležitější je teď vypořádat se s nově nabytou nezávislostí."
 tribute_mission.9800.desc.different_end_location: "Se změnou suzeréna se zřejmě změnilo i hlavní sídlo. [current_overlord.GetTitledFirstName|U] sídlí jinde.\n\nNaše cesta i tribut byly určeny pro [old_overlord.Custom('CZ_TitledFirstName_A')]. Rádci proto trvají na tom, že bude nejmoudřejší vrátit se do [CZProvName(ROOT.Char.GetCapitalLocation,'G')] a vše znovu naplánovat."
 tribute_mission.9800.desc.unable_to_accept_tribute: "Ze zvěstí na cestách se dozvídám, že nový suzerén zřejmě o chystaný druh tributu nemá zájem.\n\nNehodlám riskovat hněv Jeho Výsosti. Rozumnější bude vrátit se do [CZProvName(ROOT.Char.GetCapitalLocation,'G')] a vše znovu naplánovat."
 tribute_mission.9800.a: "Prozatím se vraťme domů."
 tribute_mission_notification.new_overlord.title: "Změna suzeréna tributní mise"
 tribute_mission_notification.new_overlord.desc: "Novým suzerénem tvé [Concept('tribute_mission','tributní mise')|E] je [new_overlord.GetShortUIName]"
 slated_for_castration_opinion: "Určení ke kastraci"
 suzerain_trade_post_modifier: "Obchodní stanice suzeréna"
 suzerain_trade_post_modifier_desc: "Do tohoto hrabství neustále proudí kupci z obchodních stanic suzeréna."
 tribute_mission_common_bunga_mas_desc: "[Glossary( 'Bunga mas', 'BUNGA_MAS_GLOSS' )], darované [overlord_scope.Custom('CZ_TitledFirstName_D')] jako tribut. Dárce je [tributary_scope.GetTitledFirstName]."
 tribute_mission_masterwork_bunga_mas_desc: "Tuto znamenitou sadu [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] původně [Select_CString(tributary_scope.IsFemale,'darovala','daroval')|l] [tributary_scope.GetTitledFirstName] jako tribut [overlord_scope.Custom('CZ_TitledFirstName_D')]. Světlo se na ní odráží v úchvatných záblescích."
 tribute_mission_famed_bunga_mas_desc: "Dva nádherné stromky ze zlata a stříbra. Tyto [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] [overlord_scope.Custom('CZ_TitledFirstName_D')] [Select_CString(tributary_scope.IsFemale,'darovala','daroval')|l] [tributary_scope.GetTitledFirstName] jako tribut. Kovotepecká práce i rytiny svědčí o znamenitém řemeslném umu."
 tribute_mission_illustrious_bunga_mas_desc: "Tuto velkolepou sadu [Glossary( 'bunga mas', 'BUNGA_MAS_GLOSS' )] [overlord_scope.Custom('CZ_TitledFirstName_D')] [Select_CString(tributary_scope.IsFemale,'darovala','daroval')|l] [tributary_scope.GetTitledFirstName] jako tribut. Zlaté a stříbrné stromky jsou pečlivě vykovány a vyryty z nejlepších kovů. Jejich květy nikdy nezvadnou."
