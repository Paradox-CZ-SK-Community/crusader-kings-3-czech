 proving_grounds_the_stump_domicile_building: "Pařez"
 proving_grounds_the_stump_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nVidíš tamhleto? Vidíš ten terč? To je dnešní cíl. Luky připravit!"
 proving_grounds_personal_bouts_domicile_building: "Cvičné souboje"
 proving_grounds_personal_bouts_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nJe docela možné vypěstovat si odolnost vůči ranám do hlavy především tím, že jich člověk předtím schytá dost."
 proving_grounds_training_circle_domicile_building: "Výcvikový kruh"
 proving_grounds_training_circle_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nNecvičíš proto, abys se #EMP stal#! zdatným. Cvičíš proto, abys #EMP zdatným zůstal#!."
 proving_grounds_mock_battle_drills_domicile_building: "Nácvik cvičných bitev"
 proving_grounds_mock_battle_drills_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nStěna kopí je pořád stěna. Buď drží pevně pohromadě, nebo se zhroutí celá."
 proving_grounds_lockwagon_domicile_building: "Uzamykatelný vůz"
 proving_grounds_lockwagon_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nJsme družina, která společně táhne, bojuje a #EMP kořistí#!. Výstroj jde na jednu hromadu a odtud ji rozdělujeme. A běda tomu, kdo to nedodrží."
 proving_grounds_martial_study_domicile_building: "Studium vojenství"
 proving_grounds_martial_study_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nKaždá bitva už byla někdy vybojována a každá válka nějak navazuje na jinou. Proč se tedy nepoučit z výsledků?"
 proving_grounds_the_stick_game_domicile_building: "Hra s holí"
 proving_grounds_the_stick_game_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nKdo ji první ukořistí a nezlomí, vyhrává bank. Jen lehká zranění, nože tupé, a koho někdo zahlédne, končí."
 proving_grounds_bodyguard_drills_domicile_building: "Výcvik osobní stráže"
 proving_grounds_bodyguard_drills_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nNaše současná... #EMP situace#! přináší člověku, kterého chráníme, neobvyklé hrozby a výzvy. Berte je smrtelně vážně."
 camp_perimeter_01_domicile_building: "Obvod tábora"
 camp_perimeter_01_domicile_building_desc: "Stráže, patroly, předsunuté hlídky a hesla. Bezpečnost funguje nejlépe, když se stane návykem, ne dodatečnou starostí."
