 barber_tent_surgeons_tools_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('barber_tent_01').GetName])#!\nPřesnost sice není #EMP nezbytnou#! součástí léčby, ale rozhodně pomáhá."
 barber_tent_dentists_tools_domicile_building: "Zubařské nástroje"
 barber_tent_dentists_tools_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('barber_tent_01').GetName])#!\nDobré na zkažené dásně, dobré na hroty šípů a v nouzi #EMP výtečný#! způsob, jak ukončit hádku."
 barber_tent_torturers_tools_domicile_building: "Mučicí nástroje"
 barber_tent_torturers_tools_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('barber_tent_01').GetName])#!\nV těsných prostorách tábora člověk rychle zjistí, jak daleko se může nést lidský křik."
 barber_tent_reference_corpus_domicile_building: "Příruční knihovna"
 barber_tent_reference_corpus_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('barber_tent_01').GetName])#!\nNa většinu situací se najde vhodná kniha, příručka nebo svitek. Často i s užitečnými obrázky."
 barber_tent_morticians_tools_domicile_building: "Nástroje hrobníka"
 barber_tent_morticians_tools_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('barber_tent_01').GetName])#!\nVykopat, oprášit, vyrazit zuby a odřezat všechny cennosti dřív, než tělo příliš nabobtná."
