 camp_perimeter_extra_watch_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nV cizích krajích daleko od domova si nejvíc uvědomujeme, jak jsme zranitelní — a co proti tomu můžeme udělat."
 camp_perimeter_palisade_domicile_building: "Stavitelé palisád"
 camp_perimeter_palisade_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nNejjednodušší je myslet na obranu tehdy, když se z ní stane takový návyk, že ji připravujeme bez přemýšlení."
 camp_perimeter_ditch_domicile_building: "Kopání příkopů"
 camp_perimeter_ditch_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_perimeter_01').GetName])#!\n#EMP Nic#! neudržuje vojáky v kázni tak spolehlivě jako nutit je každý den na konci pochodu vykopat další zemní opevnění. Den co den. Navždy."
