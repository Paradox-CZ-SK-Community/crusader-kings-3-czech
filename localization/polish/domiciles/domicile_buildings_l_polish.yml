 supply_tent_reserve_water_domicile_building: "Zásoba vody"
 supply_tent_reserve_water_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('supply_tent_01').GetName])#![Select_CString(GetPlayer.IsFemale, 'Žena', 'Muž')], která nedokáže ocenit cenu vody, nikdy nepoznala, jaké je to trpět její nedostatkem."
 supply_tent_climbing_gear_domicile_building: "Lezecká výstroj"
 supply_tent_climbing_gear_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('supply_tent_01').GetName])#!Je překvapivé, jak výrazně může situaci změnit jen několik dobře vybavených — a dobře ozbrojených — lezců."
 supply_tent_subdued_gear_domicile_building: "Nenápadná výstroj"
