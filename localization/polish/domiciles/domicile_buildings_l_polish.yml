 baggage_train_ample_steeds_domicile_building: "Dostatek koní"
 baggage_train_ample_steeds_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nKoně se stejně jako lidé unaví. Dostatek náhradních zvířat jim umožní odpočinout si právě tehdy, když je to nejvíc potřeba."
 baggage_train_porters_domicile_building: "Zdatní nosiči"
 baggage_train_porters_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nCo nelze odnést, musí zůstat na místě, a proto je nezbytné, abychom dokázali pobrat co nejvíc."
 baggage_train_trackers_domicile_building: "Zkušení stopaři"
 baggage_train_trackers_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nNa cestách je vždy potřeba něco vystopovat, ať už kance, nebo lapky."
 baggage_train_kennel_domicile_building: "Psinec"
 baggage_train_kennel_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nPsi nás stejně všude následují, tak proč je nevyužít?"
 baggage_train_siege_engineers_domicile_building: "Obléhací inženýři"
 baggage_train_siege_engineers_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nUdržovat na cestách prostředky a odborníky potřebné pro řádné obléhání je mimořádně nepraktické. Ledaže se tomu člověk opravdu oddá."
 baggage_train_shrine_domicile_building: "Přenosná svatyně"
 baggage_train_shrine_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nVíra nás provází, kamkoli jdeme, ale mít pro ni vlastní posvátné místo rozhodně neuškodí."
 baggage_train_scribes_domicile_building: "Věrní písaři"
 baggage_train_scribes_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nPergamen může být přepychem, ale se schopnými pomocníky se z něj pro někoho stává velmi užitečný nástroj."
 baggage_train_bartering_grounds_domicile_building: "Směnné tržiště"
 baggage_train_bartering_grounds_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nV táboře se stejně čile obchoduje. Když směně vyhradíme vlastní místo, můžeme jí alespoň dát nějaký řád."
 baggage_train_proof_of_claims_domicile_building: "Doklady nároků"
 baggage_train_proof_of_claims_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nSlova nic nestojí, ale existují způsoby, jak jim dodat na přesvědčivosti."
 baggage_train_ransom_cages_domicile_building: "Klece pro zajatce"
 baggage_train_ransom_cages_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nBezpečná přeprava a náležité předvedení zajatců jsou nezbytné, chceme-li za ně získat co nejlepší výkupné."
 baggage_train_negotiators_domicile_building: "Zkušení vyjednavači"
 baggage_train_negotiators_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nPověst je tvárná věc — zvlášť když člověk vynaloží dost úsilí."
 baggage_train_ascetics_domicile_building: "Putující asketové"
 baggage_train_ascetics_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nTito duchovní poutníci přinášejí důstojnost a moudrost, které jsou v kočovné družině neobvyklé, nikoli však nepatřičné."
 baggage_train_pleasure_tents_domicile_building: "Soukromé stany"
 baggage_train_pleasure_tents_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('baggage_train_01').GetName])#!\nTábor je snad ještě víc než většina příbytků společným prostorem — a pro soukromé chvíle se příliš nehodí. Většina následovníků proto ocení místo, kde mohou být spolu jednoduše... #EMP sami#!."
 mess_tent_01_domicile_building: "Jídelní stan"
 mess_tent_01_domicile_building_desc: "Vůně ohnišť, důvěrně známé pochechtávání kuchařů a horký hnědý vývar nalévaný do oprýskaných dřevěných misek — co může člověka na cestách povzbudit víc?"
