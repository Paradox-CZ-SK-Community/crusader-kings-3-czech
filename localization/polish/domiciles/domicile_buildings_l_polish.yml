 camp_fire_trailing_musicians_domicile_building: "Doprovodní hudebníci"
 camp_fire_trailing_musicians_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_fire_01').GetName])#!\nJe až s podivem, o kolik povzbudivější je poslouchat někoho, kdo skutečně #EMP umí hrát#!, než někoho, kdo to rozhodně neumí."
 camp_fire_wandering_poets_domicile_building: "Potulní básníci"
 camp_fire_wandering_poets_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_fire_01').GetName])#!\nDůstojnost, slovní obratnost, cit pro hluboké myšlenky, sprostotu i lechtivý humor — dobrý básník potřebuje tohle všechno a ještě mnohem víc."
 camp_fire_capering_fools_domicile_building: "Dovádějící šašci"
 camp_fire_capering_fools_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_fire_01').GetName])#!\nGroteskní kejkle možná nejsou vysoké umění, ale zatraceně, když se ten prcek praští hlavou o poleno, je to k popukání."
 camp_fire_libations_for_the_lost_domicile_building: "Úlitby ztraceným"
 camp_fire_libations_for_the_lost_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_fire_01').GetName])#!\nScházíme se na památku těch, které už nikdy neuvidíme, a připomínáme si tváře těch, o které teprve můžeme přijít."
 camp_fire_local_hangers_on_domicile_building: "Místní příživníci"
 camp_fire_local_hangers_on_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_fire_01').GetName])#!\nŽivot připoutaný k jedinému místu může být natolik jednotvárný, že člověka přiměje vyklopit kdejaký drb."
 camp_fire_future_dreams_domicile_building: "Velké ambice"
 camp_fire_future_dreams_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_fire_01').GetName])#!\nDlouhodobý cíl se snadno ztratí z dohledu, pokud jej člověk nevetkne do každého činu, každého rozhovoru a každého opileckého chvástání."
 camp_fire_nightly_debates_domicile_building: "Noční debaty"
 camp_fire_nightly_debates_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_fire_01').GetName])#!\nZeptej se dvou učenců na jedinou věc a dostaneš pět vzájemně si odporujících názorů. Poučné, byť hlučné."
 camp_fire_juicy_rumors_domicile_building: "Šťavnaté klepy"
 camp_fire_juicy_rumors_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_fire_01').GetName])#!\nVenku je spousta snadno dostupného #EMP materiálu#!, se kterým se dá pracovat, pokud je člověk ochotný hrát ty správné hry."
 proving_grounds_01_domicile_building: "Cvičiště"
 proving_grounds_01_domicile_building_desc: "Profesionální voják, který zrovna necvičí, obvykle působí potíže, takže je nejlepší zaměstnat ho i večer."
