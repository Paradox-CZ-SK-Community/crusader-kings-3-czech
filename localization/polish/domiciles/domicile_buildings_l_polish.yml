 camp_perimeter_good_siting_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nJen hlupák rozbije tábor právě tam, kde ho zastihne soumrak. Pokračuješ dál, dokud nenajdeš to #EMP správné#! místo."
 camp_perimeter_fixed_layout_domicile_building: "Pevné uspořádání"
 camp_perimeter_fixed_layout_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('camp_perimeter_01').GetName])#!\nPevné a neměnné rozvržení toho, co kam v táboře patří, pěstuje disciplínu a pocit známého prostředí bez ohledu na to, kde právě jsme."
