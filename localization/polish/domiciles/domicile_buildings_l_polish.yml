 mess_tent_herbalists_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('mess_tent_01').GetName])#!\nPoznat rozdíl mezi tím, co lze bezpečně sníst, a tím, co způsobí prudké krvácení a smrt, se hodí vždy."
 mess_tent_brewers_domicile_building: "Putovní sládci"
 mess_tent_brewers_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('mess_tent_01').GetName])#!\nUvařit dobré pivo a ještě je přepravovat je hotové umění. Mít navíc vlastní zásobu je skutečný přepych."
 mess_tent_curers_domicile_building: "Zkušení uzenáři"
 mess_tent_curers_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('mess_tent_01').GetName])#!\nNasolit maso dokáže každý hlupák, ale zpracovat ho ve velkém tak, aby bylo po několika měsících stále k jídlu, už vyžaduje odborníka."
 mess_tent_bakers_domicile_building: "Putovní pekaři"
 mess_tent_bakers_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('mess_tent_01').GetName])#!\nČerstvý chléb je báječný způsob, jak začít den a nabrat nové síly."
 mess_tent_cooks_domicile_building: "Zruční kuchaři"
 mess_tent_cooks_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('mess_tent_01').GetName])#!\nVytěžit z mála co nejvíc je pěkné heslo, ale málokdo je umí uvést do praxe tak jako kuchaři na cestách."
 camp_fire_01_domicile_building: "Plápolající táborák"
