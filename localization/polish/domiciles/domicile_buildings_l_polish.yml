 proving_grounds_horse_run_domicile_building: "Koňská dráha"
 proving_grounds_horse_run_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nKoně stejně jako lidé potřebují pravidelný pohyb a výcvik. Pouhé klusání z místa na místo nestačí."
 proving_grounds_camel_run_domicile_building: "Velbloudí dráha"
 proving_grounds_camel_run_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nMohou to být tvrdohlavá a neklidná zvířata, ale právě proto je třeba velbloudí jezdectvo pravidelně cvičit."
 proving_grounds_elephantry_reserve_domicile_building: "Rezervní sloni"
 proving_grounds_elephantry_reserve_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nZásoba náhradních slonů, největších ze všech [GetPlayer.GetFaith.CreatorNamePossessive] tvorů, je něco, čím se nemůže pochlubit ani většina #EMP králů#!."
 proving_grounds_nightly_barding_drills_domicile_building: "Noční výcvik v koňské zbroji"
 proving_grounds_nightly_barding_drills_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nKroužky se ohýbají, kůže praská, pláty rezaví a cvik se vytrácí. U elitního těžkého jezdectva stejně jako u kohokoli jiného."
 proving_grounds_life_in_the_saddle_domicile_building: "Život v sedle"
 proving_grounds_life_in_the_saddle_domicile_building_desc: "#weak (Vyžaduje [GetDomicileBuilding('proving_grounds_01').GetName])#!\nNěkteří se pro život v sedle narodí, jiní k němu přivyknou až později."
