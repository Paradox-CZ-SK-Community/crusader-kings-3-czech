 change_house_relation_fraction_global: "$change_house_relation_fraction_third$"
 change_house_relation_fraction_third_past: "$change_house_relation_fraction_third$"
 change_house_relation_fraction_global_past: "$change_house_relation_fraction_third_past$"
 change_house_relation_third: "[Concept('house_relation','Vztah rodů')|E] [HOUSE_RELATION.GetName] se [Select_CString( GreaterThan_CFixedPoint( '(CFixedPoint)$STEPS|q$', '(CFixedPoint)0.0'), '#P zlepšuje#!', '#N zhoršuje#!' )] z úrovně [HouseRelation.GetLevel.GetName] na úroveň [HOUSE_RELATION_LEVEL.GetName] ($STEPS|+=%^$)"
