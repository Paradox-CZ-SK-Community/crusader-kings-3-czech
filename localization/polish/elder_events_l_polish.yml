 elder_events.1500.t: "Pád, za který stojí zemřít" # todo: NEW TRANSLATION
 elder_events.1500.desc: "„Kdysi mě nazývali '[lover.Custom('GetRaunchyPrefix')] [lover.Custom('RaunchyComplimentNoun')]',“ můj [lover.GetWifeHusband] [lover.GetFirstName] vzdychá, na rtech má slabý úsměv. „Teď sotva vylezu po schodech, aniž bych lapal po dechu...“\n\nSe svou mladistvou silou bych mohl(a) [lover.GetHerHim] pomoci si vzpomenout, jaké to je být žádán.\n\nAle... vydrží [lover.GetHerHis] [GetTrait('faltering_heart').GetName( GetNullCharacter )] to?" # todo: NEW TRANSLATION
 elder_events.1500.a: "Dám [lover.GetHerHim] kotrmelec života!" # todo: NEW TRANSLATION
 elder_events.1500.b: "Raději ne." # todo: NEW TRANSLATION
 elder_events.1600.t: "Času nepřelstíš" # todo: NEW TRANSLATION
 elder_events.1600.desc: "Běžím. Musím přestat. Už lapám po dechu.\nDřív jsem běhával(a) kolečka kolem [ROOT.Char.Custom('ResidenceBuilding')]...\n\nZnovu začnu. Téměř spadnu. Zastavím se znovu.\n\nZatracené tohle křehké tělo." # todo: NEW TRANSLATION
 elder_events.1600.a: "Moje běžecké dny jsou u konce." # todo: NEW TRANSLATION
 elder_events.1600.b: "Já #EMP musím#! překonat bolest." # todo: NEW TRANSLATION
