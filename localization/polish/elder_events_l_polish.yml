l_polish:
 elder_events.1000.t: "Dříve jsi mě znal(a)" # todo: NEW TRANSLATION
 elder_events.1000.desc: "„[confusion_target.GetFirstName], můj drahý [elder.Custom2('RelationToMeShort', SCOPE.sC('confusion_target'))] — je dobré tě vidět!“ můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))] [elder.GetFirstName] se dívá mi do očí, za [elder.GetHerHis] úsměvem se mihne náznak nejistoty. „Vždy jsi byl(a) ten [confusion_target.Custom('ComplimentAdjective')]. Právě proto tě mám nejraději.“\n\nVe [elder.GetHerHis] [GetTrait('withering_mind').GetName( GetNullCharacter )] jsem dnes svou [confusion_target.Custom('SisterBrother')]...\n\nZítra mohu být cizincem." # todo: NEW TRANSLATION
 elder_events.1000.a: "Prosím, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))] — já jsem [ROOT.Char.GetFirstNameNoTooltip]!" # todo: NEW TRANSLATION
 elder_events.1000.b: "Co... ano, je také dobré tě vidět..." # todo: NEW TRANSLATION
 elder_events.1100.t: "Schodiště do..." # todo: NEW TRANSLATION
 elder_events.1100.desc: "Tolikrát jsem už tyto schody zdolal(a). Proč se tedy dnešek cítí jako zdolávání hor [mountain_reference.GetName]?\n\nMoje nohy se třesou. Kolena mě zradí. Není nic, co by zachytilo můj pád.\n\nPadám dolů." # todo: NEW TRANSLATION
 elder_events.1100.a: "Aaargh!" # todo: NEW TRANSLATION
 elder_events.1100.bodyguard: "Pomozte! Zachraňte mě!" # todo: NEW TRANSLATION
 EVENT_WINDOW_OPTION_AVAILABLE_BODYGUARD: "Tato volba je dostupná, protože máte [GetCourtPositionType('bodyguard_court_position').GetName()]" # todo: NEW TRANSLATION
 EVENT_WINDOW_OPTION_AVAILABLE_TUTOR: "Tato volba je dostupná, protože máte [GetCourtPositionType('court_tutor_court_position').GetName()]" # todo: NEW TRANSLATION
 partially_mute_modifier: "Částečně němý" # todo: NEW TRANSLATION
 partially_mute_modifier_desc: "Tato postava má kvůli věkem souvisejícím neduhům velké potíže s mluvením." # todo: NEW TRANSLATION
 elder_events.1200.t: "Necitlivost" # todo: NEW TRANSLATION
 elder_events.1200.desc: "Útočí bez varování. Levá strana mého těla znecitliví. Snažím se usmát, ale mé rty se nepohnou.\n\nSnažím se mluvit. Nemohu.\n\nNakonec se mi hlas vrátí. Ale strach z [ROOT.Char.GetFaith.NegativeAfterLife] zůstává." # todo: NEW TRANSLATION
 elder_events.1200.a: "..." # todo: NEW TRANSLATION
 elder_events.1300.t: "Zapomenuté lekce" # todo: NEW TRANSLATION
 elder_events.1300.desc: "Četl(a) jsem tyto svitky o [ROOT.Char.Custom('education_scroll_subject')]? Já... nepamatuji si. Možná ano?\n\nJistě byly součástí mých studií, součástí mého vzdělání...\n\nAno. Mé... vzdělání..." # todo: NEW TRANSLATION
 elder_events.1300.a: "To přece nemohlo být tak důležité..." # todo: NEW TRANSLATION
 elder_events.1300.tutor: "Potřebuji pomoc, abych si vzpomněl(a)." # todo: NEW TRANSLATION
 elder_events.1400.t: "Hezké milování" # todo: NEW TRANSLATION
 elder_events.1400.desc: "„Pojď do postele, můj [ROOT.Char.Custom('RomanticComplimentAdjective')] [ROOT.Char.Custom('RaunchyComplimentNoun')],“ můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lover'))] [lover.GetFirstName] [lover.Custom('PurrGrowl')], [lover.GetHerHis] oči planou chtíčí. „Nejsi ani trochu zvědavý/á, co se tvůj [lover.Custom('GetRaunchyPrefix')] [lover.Custom('RaunchyComplimentNoun')] naučil?“\n\nS ďábelským úsměvem [lover.GetSheHe] kousne do [lover.GetHerHis] rtu a sklouzne na prostěradlo.\n\n„Vezmi mě. Teď.“" # todo: NEW TRANSLATION
 elder_events.1400.a: "Tisíc koní by mě nezastavilo!" # todo: NEW TRANSLATION
 elder_events.1400.b: "[ROOT.Char.GetFaith.HighGodName] mě ochraňuj před tímto [lover.GetWomanMan]." # todo: NEW TRANSLATION
