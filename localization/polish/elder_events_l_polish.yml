l_polish:
 elder_events.1000.t: "Kdysi jsme se znali"
 elder_events.1000.desc: "„[confusion_target.GetFirstName], [Select_CString(confusion_target.IsFemale, 'má drahá', 'můj drahý')] [elder.Custom2('RelationToMeShort', SCOPE.sC('confusion_target'))] — to je radost tě vidět!“ [Select_CString(elder.IsFemale, 'Moje', 'Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))] [elder.GetFirstName] se mi dívá do očí a v úsměvu se mihne nejistota. „Vždycky jsi [Select_CString(confusion_target.IsFemale, 'byla', 'byl')] [confusion_target.Custom('ComplimentAdjective')]. Proto tě mám ze všech nejraději.“\n\n[GetTrait('withering_mind').GetName( GetNullCharacter )] způsobuje, že si [elder.GetFirstName] dnes myslí, že jsem [confusion_target.GetFirstName]...\n\nZítra možná budu někdo úplně cizí."
 elder_events.1000.a: "Prosím tě, vždyť jsi [Select_CString(elder.IsFemale, 'moje', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elder'))] — já jsem [ROOT.Char.GetFirstNameNoTooltip]!"
 elder_events.1000.b: "Cože... ano, je dobré tě zase vidět..."
 elder_events.1100.t: "Schody do..."
 elder_events.1100.desc: "Tolikrát už jsem po těchto schodech [Select_CString(ROOT.Char.IsFemale, 'stoupala', 'stoupal')]. Proč mi tedy dnes připadá, jako bych zdolával celé pohoří? [mountain_reference.GetName] se mi vybavuje s každým schodem.\n\nNohy se mi třesou. Kolena vypovídají službu. Není se čeho zachytit.\n\nŘítím se dolů."
 elder_events.1100.a: "Ááá!"
 elder_events.1100.bodyguard: "Pomoc! Zachraň mě!"
 EVENT_WINDOW_OPTION_AVAILABLE_BODYGUARD: "Tato možnost je dostupná, protože je obsazen dvorský úřad [GetCourtPositionType('bodyguard_court_position').GetName()]"
 EVENT_WINDOW_OPTION_AVAILABLE_TUTOR: "Tato možnost je dostupná, protože je obsazen dvorský úřad [GetCourtPositionType('court_tutor_court_position').GetName()]"
 partially_mute_modifier: "Částečná němota"
 partially_mute_modifier_desc: "Tato postava má kvůli potížím spojeným se stářím velké problémy s mluvením."
 elder_events.1200.t: "Necitlivost"
 elder_events.1200.desc: "Přijde to bez varování. Levá polovina těla mi znecitliví. Pokusím se usmát, ale rty se ani nepohnou.\n\nSnažím se promluvit. Nedokážu to.\n\nNakonec se mi hlas vrátí. Ale strach z toho, že mě čeká [ROOT.Char.GetFaith.NegativeAfterLife], zůstává."
 elder_events.1200.a: "..."
 elder_events.1300.t: "Zapomenuté učivo"
 elder_events.1300.desc: "[ROOT.Char.Custom('education_scroll_subject')]... Četl jsem tyhle svitky už někdy? Já... nevzpomínám si. Možná ano?\n\nUrčitě patřily k mému studiu, k mému vzdělání...\n\nAno. Mé... vzdělání..."
 elder_events.1300.a: "Asi to nebylo nic tak důležitého..."
 elder_events.1300.tutor: "Potřebuji pomoc, chci si vzpomenout."
 elder_events.1400.t: "Pořádné milování"
 elder_events.1400.desc: "„Pojď do postele, [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [ROOT.Char.Custom('RomanticComplimentAdjective')] [ROOT.Char.Custom('RaunchyComplimentNoun')],“ [lover.Custom('PurrGrowl')] [lover.GetFirstName], [Select_CString(lover.IsFemale, 'moje', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lover'))], a v očích plane chtíč. „Ani trochu tě nezajímá, co se [Select_CString(lover.IsFemale, 'tvá', 'tvůj')] [lover.Custom('GetRaunchyPrefix')] [lover.Custom('RaunchyComplimentNoun')] [Select_CString(lover.IsFemale, 'naučila', 'naučil')]?“\n\nS hříšným úsměvem si [lover.GetFirstName] kousne do rtu a klesne na prostěradla.\n\n„Vezmi si mě. Hned.“"
 elder_events.1400.a: "Ani tisíc koní mě nezastaví!"
 elder_events.1400.b: "Kéž mě [ROOT.Char.GetFaith.HighGodName] ochraňuje před [Select_CString(lover.IsFemale, 'touhle ženou', 'tímhle mužem')]!"
 death_best_sex_of_their_life: "[Select_CString(CHARACTER.IsFemale, 'utrpěla', 'utrpěl')] infarkt v náruči největší rozkoše svého života"
 purrs: "přede"
 growls: "vrčí"
 raunchy_little: "malá"
 raunchy_sweet: "sladká"
 raunchy_pretty: "hezounká"
 raunchy_bold: "smělý"
 raunchy_wild: "divoký"
 raunchy_fiery: "ohnivý"
 raunchy_young: "svěží"
 raunchy_eager: "dychtící"
 elder_events.1500.t: "Milování k smrti"
 elder_events.1500.desc: "„Kdysi mi říkali ‚[lover.Custom('GetRaunchyPrefix')] [lover.Custom('RaunchyComplimentNoun')]‘,“ povzdechne si [Select_CString(lover.IsFemale, 'má manželka', 'můj manžel')] [lover.GetFirstName] se slabým úsměvem na rtech. „Teď sotva vyjdu schody, aniž bych [Select_CString(lover.IsFemale, 'lapala', 'lapal')] po dechu...“\n\nDíky své mladické síle bych [Select_CString(lover.IsFemale, 'jí', 'mu')] [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] připomenout, jaké to je být žádoucí.\n\nAle... vydrží [Select_CString(lover.IsFemale, 'její', 'jeho')] [GetTrait('faltering_heart').GetName( GetNullCharacter )|L] takovou námahu?"
 elder_events.1500.a: "Tohle bude nejlepší milování [Select_CString(lover.IsFemale, 'jejího', 'jeho')] života!"
 elder_events.1500.b: "Raději ne."
 elder_events.1600.t: "Času neutečeš"
 elder_events.1600.desc: "Běžím. Musím zastavit. Už teď nemohu popadnout dech.\n[ROOT.Char.Custom('ResidenceBuilding')]... Kolem toho jsem kdysi [Select_CString(ROOT.Char.IsFemale, 'běhávala', 'běhával')] jedno kolečko za druhým...\n\nRozběhnu se znovu. Málem upadnu. Zase se zastavím.\n\nProklaté chatrné tělo."
 elder_events.1600.a: "Mé běžecké dny jsou pryč."
 elder_events.1600.b: "#EMP Musím#! tu bolest překonat."
