 setting_empire_faith_gate_off: "Vypnuto"
 setting_empire_faith_gate_on_desc: "K vytvoření [Concept('titles','titulů')|E] na úrovni [Concept('empire','říše')|E] je vyžadována [Concept('organized','organizovaná')|E] [Concept('faith','víra')|E] a souhlas [Concept('head_of_faith','hlavy víry')|E]. Týká se [Concept('feudal','feudálních')|E], [Concept('clan','klanových')|E] a [Concept('tribal','kmenových')|E] [Concept('rulers','vládců')|E]."
 setting_empire_faith_gate_no_hof_exempt_desc: "K vytvoření [Concept('titles','titulů')|E] na úrovni [Concept('empire','říše')|E] je vyžadována [Concept('organized','organizovaná')|E] [Concept('faith','víra')|E] a souhlas [Concept('head_of_faith','hlavy víry')|E], ale [Concept('faiths','víry')|E] bez [Concept('head_of_faith','hlavy víry')|E] mají z požadavku na souhlas výjimku. Týká se [Concept('feudal','feudálních')|E], [Concept('clan','klanových')|E] a [Concept('tribal','kmenových')|E] [Concept('rulers','vládců')|E]."
 setting_empire_faith_gate_off_desc: "Kdokoli může při splnění běžných požadavků vytvářet [Concept('titles','tituly')|E] na úrovni [Concept('empire','říše')|E]."
 empire_faith_gate_organized_faith_required: "K vytvoření [Concept('empire','říše')|E] musí být tvá [Concept('faith','víra')|E] [Concept('organized','organizovaná')|E]"
