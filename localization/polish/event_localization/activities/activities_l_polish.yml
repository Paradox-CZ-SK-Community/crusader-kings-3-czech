 activity_feast_selection_tooltip: "Uspořádej velkolepou hostinu a upevni své vztahy\n\nOčekávané odměny:\n$BULLET_WITH_TAB$[opinion_i] [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$[stress_loss_i] [Concept('stress_loss','úbytek stresu')|E]"
