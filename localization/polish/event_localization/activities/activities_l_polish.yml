 activity_feast_province_desc: "Hostinu pořádáš v [ROOT.Province.GetName]\nProvincie s vhodnými budovami poskytují slevu na [gold_i][Concept('gold','zlato')|E]\n"
 activity_hunt: "Lov"
 hunt_phase_desc: "Pronásleduj kořist a rozhodni, jak ji skolíš"
 activity_hunt_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] lov"
 activity_hunt_desc: "[GetPlayer.Custom('GetHuntDesc')|U]"
 activity_hunt_desc_regular: "Štvanice přináší vzrušení i nebezpečí v hojné míře a zároveň je skvělou průpravou v jízdě na koni a lukostřelbě.\n\nNa lovy dohlíží [GetCourtPositionType('master_of_hunt_court_position').GetName()] a hlásí [Concept('hunt_sightings_no_prefix','zpozorování')|E] běžné, vzácné i nebezpečné zvěře."
 activity_hunt_desc_adventurer: "Štvanice přináší vzrušení i nebezpečí v hojné míře a zároveň je skvělou průpravou v jízdě na koni a lukostřelbě.\n\nPokud máš formu vlády [GetGovernment('landless_adventurer_government').GetName], lov ti přináší méně [prestige_i][Concept('prestige','prestiže')|E], zato poskytuje [provisions_i][Concept('provisions','proviant')|E]. Na lovy dohlíží [GetCourtPositionType('huntperson_camp_officer').GetName()].\n\nNa začátku lovu dostaneš možnost zakoupit si lovecké právo za [gold_i][Concept('gold','zlato')|E]. Pokud tak neučiníš, získáš [Concept('trait_level_track_xp','zkušenosti rysu')|E] pro cestu [GetTrait( 'gallowsbait' ).GetTraitTrackByKey( 'poacher' ).GetName] v rámci rysu [GetTrait('gallowsbait').GetName( GetNullCharacter )]."
 activity_hunt_owner: "Lovec"
 activity_meditation: "Meditace v ústraní"
 activity_meditation_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] meditace v ústraní"
 activity_meditation_desc: "[ACTIVITY.GetOwner.GetTitledFirstName] [Select_CString(ACTIVITY.GetOwner.IsFemale,'se uchýlila','se uchýlil')] do ústraní, aby [Select_CString(ACTIVITY.GetOwner.IsFemale,'mohla','mohl')] v klidu meditovat."
 activity_meditation_owner: "Meditující"
 activity_hold_court: "Pořádání audience"
 activity_hold_court_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] dvorská audience"
 activity_hold_court_desc: "[ACTIVITY.GetOwner.GetTitledFirstName] [Select_CString(ACTIVITY.GetOwner.IsFemale,'pozvala všechny své poddané, aby před ni přednesli','pozval všechny své poddané, aby před něj přednesli')] veškeré záležitosti, které vyžadují pozornost."
 activity_petition_liege: "Požádat lenního pána"
 activity_petition_liege_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] žádost"
 activity_petition_liege_desc: "[ACTIVITY.GetOwner.GetTitledFirstName] se [Select_CString(ACTIVITY.GetOwner.IsFemale,'obrátila','obrátil')] na svou vrchnost [ACTIVITY.GetOwner.GetLiege.GetTitledFirstName] s žádostí o pomoc v určitých záležitostech."
 visit_seer: "Navštívit věštce"
 visit_seer_desc: "Možná bude mít pár dobrých tipů a triků, jak přežít ve středověku."
 activity_adventure_name: "Dobrodružství"
 activity_adventure_desc: "[ACTIVITY.GetOwner.GetTitledFirstName] podniká dobrodružnou výpravu v této oblasti."
 activity_adventure_owner: "Dobrodruh"
 activity_gruesome_festival: "$tenet_gruesome_festivals_blot_name$"
 activity_gruesome_festival_selection_tooltip: "Pozvi své poddané k účasti na posvátném a nákladném obřadu"
 activity_gruesome_festival_desc: "Je nejvyšší čas, aby se všichni mí poddaní sešli ke společné oběti pro [GetPlayer.GetFaith.PantheonTerm]. Tyto obřady nejen stmelují věřící, ale také potvrzují mé postavení coby [GetPlayer.GetTitleAsNameNoTooltip] celé země."
 activity_gruesome_festival_owner: "Hostitel"
 activity_gruesome_festival_host_desc: "\nUspořádáš $gruesomefestivalname_blot$, jehož součástí je:\n#indent_newline:0 $EFFECT_LIST_BULLET$ Určení rozsahu slavnosti\n#indent_newline:0 $EFFECT_LIST_BULLET$ Výběr toho, co bude obětováno, včetně možnosti zvolit jednoho ze svých [Concept('prisoners','vězňů')|E] jako [Concept('designate_chief_sacrifice_chief_sacrifice','hlavní oběť')|E]\n#indent_newline:0 $EFFECT_LIST_BULLET$ Získávání či ztrácení [Concept('county_opinion','lidového mínění')|E] a [Concept('opinion','mínění')|E] [Concept('character','postav')|E] podle [Concept('core_tenets','zásad')|E] [Concept('faith','víry')|E] tvých poddaných"
 activity_gruesome_festival_guest_help_text: "Pozvaní [Concept('guests','hosté')|E] se zúčastní oběti a následné hostiny. Jejich [Concept('opinion','mínění')|E] o tobě se zlepší nebo zhorší podle [Concept('core_tenets','zásad')|E] jejich [Concept('faith','víry')|E]."
 activity_gruesome_festival_province_desc: "$gruesome_festival_size_small_desc$"
 activity_gruesome_festival_fallback_name: "Rituální oběť"
 activity_gruesome_festival_desc.non_gf_practioner: "Mezi mými poddanými jsou tací, kteří praktikují velkolepé obětní obřady, jimž dává požehnání [GetPlayer.GetTitleAsNameNoTooltip]. Uspořádání byť jen omezené podoby takového obřadu by mi nepochybně získalo jejich přízeň, avšak přijetí jejich poněkud... barbarských zvyků by mi mohlo vysloužit opovržení těch, kteří jejich způsoby odsuzují."
 ACTIVITY_WAITING: "Čeká na zahájení"
 ACTIVITY_ATTENDING: "Účast potvrzena"
