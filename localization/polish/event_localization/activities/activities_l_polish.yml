 activity_feast_host_desc: "$BULLET_WITH_TAB$Můžeš získat [Concept('opinion','mínění')|E] [Concept('vassal','vazalů')|E] s postojem [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$BULLET_WITH_TAB$Můžeš získat [prestige_i][Concept('prestige','prestiž')|E]\n$BULLET_WITH_TAB$Můžeš získat [legitimacy_i] [Concept('legitimacy','legitimitu')|E]\n$BULLET_WITH_TAB$Účastníci si mohou zlepšit [Concept('opinion','mínění')|E] přítomných postav\n$BULLET_WITH_TAB$Účastníci si mohou snížit [stress_loss_i][Concept('stress','stres')|E]\n$BULLET_WITH_TAB$Účastníci mohou získat [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [Concept('trait','rys')|E]\n[SelectLocalization( HasDlcFeature( 'royal_court' ), 'activity_feast_amenity_effect', 'blank_line' )]"
