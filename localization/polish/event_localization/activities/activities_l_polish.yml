 honorary_guest_desc: "[GetActivityType('activity_feast').GetName] může mít $honorary_guest$ a celá oslava se koná právě na počest této osoby. Ústřední část hostiny, přípitek, této osobě díky výsadnímu postavení přinese [Concept('prestige','prestiž')|E]. Ale pozor — může to být také past... $feast_type_murder$ totiž často končí tím, že $honorary_guest$ přijde o život."
 honorary_guest_desc_for_host: "$feast_type_murder$ se bez oběti neobejde a právě proto je tu $honorary_guest_for_host$. Hostitel si může oběť pečlivě vybrat a pokud chce, připravit o život ji i celý její doprovod. Je však třeba zůstat ve střehu — pokud si někdo všimne, že oběť chybí, může to mít další následky."
