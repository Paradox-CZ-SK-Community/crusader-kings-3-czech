 activity_feast_desc: "Upevni pouta věrnosti tím, že pozveš vazaly a sousedy do svých síní, aby jedli, pili a veselili se!\n\nHostiny pořádané ve správnou chvíli pomohou udržet tvé panství stabilní, uklidní poddané a otevřou cestu k novým přátelstvím."
