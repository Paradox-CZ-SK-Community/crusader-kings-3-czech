 activity_feast_guest_help_text: "Všichni pozvaní [Concept('activity_guests','hosté aktivity')|E] budou mít příležitost zapojit se do dění s ostatními účastníky a zlepšit si jejich [Concept('opinion','mínění')|E].\n\nHostiny jsou také ideální příležitostí jednoduše si odpočinout a zbavit se části [Concept('stress','stresu')|E]."
