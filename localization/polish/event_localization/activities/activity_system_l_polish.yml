l_polish:
 ACTIVITY_LOG_ENTRY_EFFECT: "#S Důsledky#!\n$EFFECT$"
 activity_tournament_province_desc: "Místo konání turnaje: [ROOT.Province.GetName]\nVhodné budovy v provincii snižují cenu ([gold_i][Concept('gold','zlato')|E])"
 activity_feast_guest_desc: "$BULLET_WITH_TAB$Účastníci si mohou zlepšit [Concept('opinion','mínění')|E] přítomných postav\n$BULLET_WITH_TAB$Účastníci si mohou snížit [stress_loss_i][Concept('stress','stres')|E]\n$BULLET_WITH_TAB$Účastníci mohou získat [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [Concept('trait','rys')|E]"
 activity_tournament_guest_desc: "#weak Pokud splňuješ podmínky, účast na turnaji ti dává šanci zvítězit v soutěžích a získat ceny, ale také si odpočinout a užít si vše, co turnaj nabízí. Zároveň je to příležitost zdokonalit své bojové dovednosti.#!"
 guest_friendship_title: "$activity_pulse_action_guest_friendship$"
 activity_pulse_action_guest_friendship: "[second.GetShortUINameNoTooltip|U] pronáší pochvalu; [first.GetShortUINameNoTooltip|U] [Select_CString(first.IsFemale,'je její adresátkou','je jejím adresátem')]"
 guest_insulted_title: "$activity_pulse_action_guest_insulted$"
 activity_pulse_action_guest_insulted: "[second.GetShortUINameNoTooltip|U] pronáší urážku; [first.GetShortUINameNoTooltip|U] [Select_CString(first.IsFemale,'je její adresátkou','je jejím adresátem')]"
 activity_system.0040.t: "Konec turnaje"
 activity_system.0040.desc: "Běda! Okolnosti kolem turnaje se změnily a krátký rozhovor s pořadateli potvrzuje tvé obavy. Turnaj musí být zrušen.\n\nKolem proudí zástupy skleslých lidí, zklamané děti popotahují a svírají ruce svých rodičů. Snad se v blízké budoucnosti naskytne další příležitost tyto slavnosti uspořádat."
 activity_system.0040.a: "Jaká škoda."
 activity_system.0080.t: "Nový hostitel"
 activity_system.0080.desc: "Po smrti osoby, která slavnosti pořádala, se mezi organizátory začíná šířit stále naléhavější šepot. Všichni ostatní se spokojeně baví a nemají ani tušení o téměř panickém zmatku v zákulisí.\n\nNakonec se podaří dosáhnout dohody."
 activity_system.0080.desc_other: "Slavnosti budou pokračovat a jejich vedení nyní přebírá [host.GetTitledFirstName]!"
 activity_system.0080.desc_me: "Slavnosti budou pokračovat a jejich vedení teď přebírám já!"
 activity_system.0080.a: "Tak zpátky k věci."
 activity_system.0081.t: "Poslední cesta"
 activity_system.0081.desc.relation_family_liked: "Bohužel [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_host'))] [old_host.GetTitledFirstName], [Select_CString(old_host.IsFemale,'která mi byla velmi blízká, odešla','který mi byl velmi blízký, odešel')] z tohoto světa a"
 activity_system.0081.desc.relation_liked: "Bohužel [old_host.GetTitledFirstName], [Select_CString(old_host.IsFemale,'která mi byla velmi blízká, odešla','který mi byl velmi blízký, odešel')] z tohoto světa a"
 activity_system.0081.desc.relation_family: "Bohužel [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_host'))] [old_host.GetTitledFirstName] [Select_CString(old_host.IsFemale,'odešla','odešel')] z tohoto světa a"
 activity_system.0081.desc.relation_neutral: "Bohužel [old_pilgrimage_host.GetTitledFirstName] [Select_CString(old_pilgrimage_host.IsFemale,'odešla','odešel')] z tohoto světa a"
 activity_system.0081.desc.outro: "jako [Select_CString(ROOT.Char.IsFemale,'dědička','dědic')] nyní přebírám vedení.\n\nBez ohledu na vlastní pocity proto musím rozhodnout, jak naložíme s tělesnými ostatky a posledními obřady."
 activity_system.0081.a: "Tam, kde leží [ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip], [old_host.GetTitledFirstName] [Select_CString(old_host.IsFemale,'žila','žil')] doma."
 activity_system.0081.a.tt: "[old_host.GetShortUIName] spočine tam, kde leží [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]"
 activity_system.0081.b: "[old_host.GetTitledFirstName] si zaslouží spočinout na posvátné půdě tam, kde leží [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 activity_system.0081.b.tt: "[old_host.GetShortUIName] spočine tam, kde leží [THIS.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]"
 activity_system.0081.c: "Nejprve zamíříme tam, kde leží [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]. [old_host.GetTitledFirstName] bude s námi, a pak se vydáme domů."
 activity_system.0081.c.tt: "[THIS.Char.GetInvolvedActivity.GetName] bude pokračovat a [old_host.GetShortUIName] spočine tam, kde leží [THIS.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]"
 activity_system.0090.t: "Neplatný záměr"
 activity_system.0090.desc: "Po změně okolností je jasné, že můj dosavadní záměr už nelze uskutečnit. Ostatní kolem mě spokojeně procházejí, zatímco přemítám nad svou situací, a mého mírného rozladění si vůbec nevšímají.\n\nPo čem jiném mé srdce touží? Možná bych si měl prostě trochu odpočinout?"
 activity_system.0090.a: "Je čas zaměřit se jinam."
 activity_system.0091.t: "Neplatný cíl záměru"
 activity_system.0091.desc: "Po změně okolností je jasné, že dosavadní cíl mého záměru už pro mé plány není důležitý. Ostatní kolem mě spokojeně procházejí, zatímco přemítám nad svou situací, a mého mírného rozladění si vůbec nevšímají.\n\nKomu jinému věnovat pozornost? Možná jednoduše sobě?"
 activity_system.0091.a: "Nuže, je čas najít si novou múzu..."
 activity_system.0100.t: "Nepovedená oslava"
 activity_system.0100.desc: "To snad není možné! Navzdory všem mým pozvánkám a přípravám se neukázala ani jediná osoba. Možná je cesta do [location.GetName] mnohem nebezpečnější, než jsem čekal.\n\n"
 activity_system.0100.outro_away: "Nezbývá než se vydat na cestu domů do [ROOT.Char.GetCapitalLocation.GetName]."
 activity_system.0100.outro_home: "Alespoň jsem si ušetřil cestu z domova."
 activity_system.0100.a: "Ale proč... proč nikdo nepřišel?"
 activity_system.1010.t: "Předčasný konec cesty"
 activity_system.1010.desc: "[Select_CString(host.IsFemale,'Má předchůdkyně','Můj předchůdce')] [host.GetNameRegnal] [Select_CString(host.IsFemale,'opustila','opustil')] tento svět během turné po panství. Tragédie. [host.GetDeathReason].\n\n"
 activity_system.1010.desc.entourage: "Pozůstalý doprovod se jistě vydá na smutnou cestu domů a ponese tělo zesnulého k poslednímu odpočinku."
 activity_system.1010.desc.ruler: "Tak daleko od domova si [host.GetTitleAsName] nezaslouží zemřít."
 activity_system.1010.a: "Odpočívej v pokoji."
 activity_system.1010.tt: "[host.GetShortUINameNoTooltip]: [Concept('activity','aktivita')|E] byla zrušena"
 activity_system.1011.desc: "Má vrchnost [host.GetNameRegnal] opustila tento svět během turné po panství. Tragédie. [host.GetDeathReason].\n\nZbytek turné byl zrušen. Pozůstalý doprovod se vydává na smutnou cestu domů a odváží tělo k poslednímu odpočinku."
 activity_system.0300.t: "Válka na nikoho nečeká"
 activity_system.0300.desc.intro.traveling: "Válečné rohy ke mně doléhají i sem do [target_activity_location.GetName], kam právě mířím kvůli plánované aktivitě. "
 activity_system.0300.desc.intro.activity: "Válečné rohy ke mně doléhají i sem do [target_activity_location.GetName], právě uprostřed všeho dění. "
 activity_system.0300.desc.attacker: "Zapojil jsem se do boje proti [war_opponent.GetNameRegnal|U]."
 activity_system.0300.desc.defender: "[war_opponent.Custom2('InsultNoun', ROOT.Char)] [war_opponent.GetNameRegnal|U] mi dokonce vyhlašuje válku!\n\n"
 activity_system.0300.desc.outro: "Přípravy si vyžádaly spoustu úsilí a posílat hosty domů se mi opravdu nechce. Význam tohoto konfliktu však nelze podceňovat.\n\nMožná by bylo nejlepší soustředit veškeré úsilí na přípravu války..."
 activity_system.0300.a: "Zvládnu to řídit odsud."
 activity_system.0300.a.tt: "[target_activity_type.GetNameNoTooltip] bude pokračovat"
 activity_system.0300.b: "Tahle válka vyžaduje mou plnou pozornost."
 activity_system.0300.b.tt: "[target_activity_type.GetNameNoTooltip] skončí předčasně a všichni účastníci se vydají domů"
 activity_system.0300.b.tt.cost: "Část nákladů se může vrátit"
 activity_system.0301.t: "Předčasný konec"
 activity_system.0301.desc: "#EMP „Do války! Do války!“#! volají [Concept('knights','rytíři')|l] [target_activity_host.GetTitledFirstName], když kolem mě s hřměním projíždějí, rohy duní a korouhve se jasně třpytí proti obloze.\n\n[war_opponent.Custom2('InsultNoun', ROOT.Char)] [war_opponent.GetNameRegnal] zjevně nemá pro naše slavnosti ani špetku pochopení! Všechno musí skončit, protože [target_activity_host.GetTitleAsNameNoTooltip] svolává své odvedence a modlí se za vítězství. [target_activity_host.GetFaith.WarGodName] snad prosby vyslyší.\n\nTaková zábava je sice vznešená a chvályhodná, ale volání do zbraně přehluší všechno ostatní."
 activity_system.0301.a: "To je pohroma..."
 activity_system.0310.desc.intro: "Válečné rohy ke mně doléhají i sem do [target_activity_location.GetName]. [target_activity_type.GetNameNoTooltip] právě probíhá a pořádá ji [target_activity_host.GetNamePossessive|U].\n\n"
 activity_system.0310.desc.primary_defender: "[attacker.GetTitledFirstName|U] mi bezostyšně vyhlašuje válku!"
 activity_system.0310.desc.random_defender: "Musím pomoci ve válce mezi [attacker.GetTitledFirstName|U] a [defender.GetTitledFirstName|U]."
 activity_system.0310.a.tt: "Nadále se účastníš aktivity [target_activity_type.GetNameNoTooltip]"
 activity_system.0310.b.tt: "Opustíš aktivitu [target_activity_type.GetNameNoTooltip] a vydáš se domů"
 activity_system.0320.t: "Nečekaný konec"
 activity_system.0320.desc: "[Select_CString(host.IsFemale,'Naše hostitelka','Náš hostitel')] [host.GetName] [Select_CString(host.IsFemale,'přišla','přišel')] o veškeré pozemkové državy a [activity_type.GetNameNoTooltip()] proto končí předčasně.\n\nPo všech těch pozvánkách, přípravách a fanfárách jsem si konec rozhodně nepředstavoval takhle. Nezbývá než se s doprovodem vrátit domů do [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]..."
 activity_system.0320.a: "Co se stalo, stalo se."
 activity_system.0330.t: "Neschopnost"
 activity_system.0330.desc.intro: "[Select_CString(ROOT.Char.IsFemale,'Byla jsem prohlášena za neschopnou a naprosto nezpůsobilou','Byl jsem prohlášen za neschopného a naprosto nezpůsobilého')] spravovat vlastní záležitosti. A [activity_type.GetNameNoTooltip()] je teď rovněž nad mé síly!\n\n"
 activity_system.0330.desc.memory: "Běda, [incapable_memory.GetDescription].\n\n"
 activity_system.0330.desc.outro: "Nezbývá než se vrátit domů do [home.GetName]."
 activity_system.0330.a: "Snad se mí hosté dostanou bezpečně domů."
 activity_system.0331.t: "Neschopnost"
 activity_system.0331.desc: "[Select_CString(host.IsFemale,'Naše hostitelka','Náš hostitel')] [host.GetName] [Select_CString(host.IsFemale,'byla lidmi kolem sebe prohlášena za neschopnou a naprosto nezpůsobilou','byl lidmi kolem sebe prohlášen za neschopného a naprosto nezpůsobilého')] spravovat vlastní záležitosti. [activity_type.GetNameNoTooltip()] tak nemůže pokračovat!\n\nBěda, všichni se musíme vrátit domů s prázdnou. "
 activity_system.0331.a: "Jaká škoda."
 activity_system.0400.t: "Máme zpoždění"
 activity_system.0400.desc_leader: "Ke mně přichází [travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)] a ve tváři se zračí směs studu a obav. Hned je mi jasné, že zprávy nebudou dobré.\n\n„Musím vám bohužel oznámit, že máme zpoždění asi [GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)], můj [ROOT.Char.GetTitleAsNameNoTooltip], a možná nedorazíme do cíle včas.“"
 activity_system.0400.desc_no_leader: "Znovu a znovu zkoumám oblohu i všechny mapy, které mám k dispozici, ale počty zkrátka nevycházejí.\n\nMáme zpoždění asi [GetTimeBetweenDates(ROOT.Char.GetInvolvedActivity.GetActiveStartDate.Self, ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetEstimatedArrivalDate)] a pokud budeme pokračovat stejným tempem po současné trase, do cíle včas nedorazíme."
 activity_system.0400.a: "Musíme si pospíšit."
 activity_system.0400.a.tt: "Doufáš, že se vám cestou podaří zrychlit"
 activity_system.0400.b: "Za tu námahu to nestojí."
 activity_system.0401.t: "Příliš pozdě"
 activity_system.0401.desc_leader: "Ke mně přichází [travel_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se zachmuřeným výrazem.\n\n„S lítostí musím oznámit, že jsme to nestihli, můj [ROOT.Char.GetTitleAsNameNoTooltip]. Aktivita dnes začala a my tam zkrátka nejsme.“"
 activity_system.0401.desc_no_leader: "Ten den je tady. Aktivita dnes začala, ale navzdory veškerému mému úsilí jsme tam zkrátka nedorazili.\n\nNezbývá než se obrátit a vydat se zpátky domů."
 activity_system.0401.a: "To je zklamání."
 SELECT_ACTIVITY_DECISION_TITLE: "#D Vyber typ aktivity#!"
 SELECT_ACTIVITY_DECISION_NEXT_STEP_BUTTON: "$SELECT_ACTIVITY_DECISION_TITLE$"
