 hold_grand_activity_option_tournament_desc: "$activity_tournament$"
 hold_grand_activity_option_wedding: "$activity_wedding$"
 hold_grand_activity_option_wedding_desc: "$activity_wedding$"
 hold_grand_activity_option_tour: "$activity_tour$"
 hold_grand_activity_option_tour_desc: "$activity_tour$"
 hold_standard_activity_option_feast: "$activity_feast$"
 hold_standard_activity_option_feast_desc: "$activity_feast$"
 hold_standard_activity_option_hunt: "$activity_hunt$"
 hold_standard_activity_option_hunt_desc: "$activity_hunt$"
 hold_standard_activity_option_pilgrimage: "$activity_pilgrimage$"
 hold_standard_activity_option_pilgrimage_desc: "$activity_pilgrimage$"
 hold_standard_activity_option_play_date: "$activity_playdate$"
 hold_standard_activity_option_play_date_desc: "$activity_playdate$"
 hold_standard_activity_option_witch_ritual: "$activity_witch_ritual$"
 hold_standard_activity_option_witch_ritual_desc: "$activity_witch_ritual$"
 activity_system.0500.t: "Chmurný konec"
 activity_system.0500.desc: "Dorazila ke mně zpráva, že [Select_CString(host.IsFemale,'naše hostitelka','náš hostitel')] [host.GetNameNoTooltip] [Select_CString(host.IsFemale,'zemřela','zemřel')]. Kvůli těmto nečekaným okolnostem byla pořádaná aktivita zrušena."
 activity_system.0500.a: "Skutečná tragédie."
 activity_system.0501.t: "Duše odešla"
 activity_system.0501.desc: "Celou zkušební síní se rozléhá rozruch. Učenci i mniši pobíhají sem a tam. Na nádvoří se shromažďuje dav a ozývá se z něj pláč.\n\n[ROOT.Char.GetTopLiege.Custom('GetDaughterSon')] nebes [Select_CString(ROOT.Char.GetTopLiege.IsFemale,'zemřela','zemřel')]."
 activity_system.0501.a: "Nemůžu tomu uvěřit..."
 activity_system.0550.t: "Zmařené plány"
 activity_system.0550.desc: "Kvůli náhlému a nečekanému uvěznění už nemohu pokračovat ve své aktivitě a ta musí být zrušena.\n\nTolik času stráveného plánováním..."
 activity_system.0550.a: "Tohle v mém plánu nebylo..."
 activity_system.0551.t: "Uvěznění hostitele"
 activity_system.0551.desc: "[Select_CString(host.IsFemale,'Má hostitelka','Můj hostitel')] [host.GetNameNoTooltip] [Select_CString(host.IsFemale,'byla náhle a nečekaně uvězněna','byl náhle a nečekaně uvězněn')], takže aktivita, které jsem se účastnil, byla zrušena."
 activity_system.0551.a: "Je čas vydat se domů."
 activity_system.0552.t: "Výzva bez odezvy"
 activity_system.0552.desc: "Co to má znamenat? Zdá se, že žádné jiné hnutí není ochotné přijmout naši výzvu. [GetPlayer.Custom('GetMyMovementNoTooltip')] tak zůstává bez soupeře.\n\nBez protivníka, se kterým bychom mohli debatovat, byla debata zrušena."
 activity_system.0552.a: "Tak zase příště..."
 activity_system.0554.opening: "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 activity_system.0554.a: "Tuto výzvu musím přijmout."
 activity_system.0554.b: "Vymyslím si nějakou vhodnou výmluvu."
