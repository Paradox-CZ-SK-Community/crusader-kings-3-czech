l_polish:
 admiring_birds.1001.t: "Ó! Pták!"
 admiring_birds.1001.common_raven.desc: "Melodii doléhající k mým uším si nelze splést. Je to zpěv krkavce. Pták sedící na větvi jako by něco pronásledoval."
 admiring_birds.1001.common_merganser.desc: "Tahle chocholka je snadno rozpoznatelná. Morčák velký hnízdí v dutině stromu a pečlivě střeží svá vejce. Jeho druh není nikde v dohledu, možná loví ryby."
 admiring_birds.1001.common_loon.desc: "Černobílé peří, plovací blány mezi prsty, neohrabaný vzlet. Hmm... Určit ho není vůbec snadné, ale měla by to být potáplice severní."
 admiring_birds.1001.golden_eagle.desc: "Jak majestátní tvor! [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] jsem štěstí a [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] sledovat lovecký manévr tohoto orla skalního. Ubohý hlodavec ani netušil, že se blíží jeho konec. Převážně tmavě hnědé peří mu nejspíš poskytuje dobré maskování."
 admiring_birds.1001.red_crossbill.desc: "K mým uším doléhá tichá a pokojná melodie. Zpočátku nedokážu určit její zdroj, protože se zvuky rozléhají mezi stromy. Náhle však spatřím několik oranžově zbarvených siluet usazených v koruně stromu. Několik křivek obecných se krmí mezi borovicemi."
 admiring_birds.1001.northern_harrier.desc: "Ačkoli by si jej někdo mohl splést se sovou, hrdý moták pilich se od ní odlišuje tím, že loví za bílého dne."
 admiring_birds.1001.great_egret.desc: "Nad jezerem se jako oblak vznáší zářivě bílé peří. Dlouhé tenké nohy volavky bílé se ve světle téměř ztrácejí, takže její tělo vypadá, jako by se vznášelo ve vzduchu."
 admiring_birds.1001.black_tern.desc: "Při procházce po okraji louky zahlédnu skupinu rybáků černých, kteří se navzájem pronásledují, prudce stoupají s přehnanými údery křídel a vzrušeně se ozývají. Že by právě nastalo období páření?"
 admiring_birds.1001.osprey.desc: "Když procházím kolem jezera, z vody náhle vyrazí pták s rybou v černém zobáku. Orlovec říční rychle odlétá pryč."
 admiring_birds.1001.northern_shoveler.desc: "Toť skála!... vrchol!... mys! Ba co dím, mys! Toť poloostrov! Lžičák pestrý má skutečně jedinečný zobák."
 admiring_birds.1001.atlantic_puffin.desc: "Jak legrační podívaná! Papuchalk severní je radost pozorovat. Svým pestrým vzhledem mi tak trochu připomíná šaška."
 admiring_birds.1001.mallard.desc: "Při toulkách upoutají mou pozornost duhově fialovomodrá zrcátka na křídlech letících ptáků. Kachna divoká přistane o kus dál na nedaleké louce."
 admiring_birds.1001.horned_lark.desc: "Obrovské hejno skřivanů ouškatých prohledává zem, hledá červy a neustále spolu štěbetá. Okamžitě se zastavím, abych je [Select_CString(ROOT.Char.IsFemale,'nevyplašila','nevyplašil')]."
 admiring_birds.1001.barrow_goldeneye.desc: "Zlatavé oko mě pozoruje ze středu jezera. Hoholka islandská pokojně pluje po hladině a bezpochyby hledá potravu."
 admiring_birds.1001.gold_gain.desc: "Jaké mám štěstí! Takové setkání je dobrým znamením a mé příjmy z něj jistě budou těžit."
 admiring_birds.1001.prowess_gain.desc: "Pozorovat, jak pronásleduje kořist, je skutečně inspirující! Něco z toho využiji i na bojišti."
 admiring_birds.1001.piety_gain.desc: "[Select_CString(ROOT.Char.IsFemale,'Jsem požehnaná','Jsem požehnaný')]! Probudilo to ve mně něco hluboko ukrytého."
 admiring_birds.1001.prestige_gain.desc: "Jak vzácné setkání! Všichni mi budou závidět."
 admiring_birds.1001.dynasty_prestige_gain.desc: "Setkání s tímto ptákem dokazuje, že má dynastie je předurčena k velikosti!"
 admiring_birds.1001.stress_loss_gain.desc: "Nic není příjemnějšího než pozorovat tohoto ptáka v letu."
 admiring_birds.1001.a: "Kéž bych toho o ptácích [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')] víc..."
 admiring_birds.1001.b: "Jak prospěšné setkání!"
 admiring_birds.1001.c: "Pěkný přírůstek do mé sbírky trofejí."
