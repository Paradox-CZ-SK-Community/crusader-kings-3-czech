l_polish:
 az_tour.0001.t: "Přednes učence"
 az_tour.0001.desc: "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] pozvedne ruku a žádá o ticho, zatímco služebnictvo odnáší poslední nádobí. [Select_CString(stop_host_scope.IsFemale,'Po jejím boku','Po jeho boku')] stojí [scholar.Custom2('MyCharacterIntroduction', ROOT.Char)], vykročí vpřed a vyrovnaným hlasem začne přednášet verše, elegantní řádky o plynutí času a tíze ctnosti.\n\nKdyž potlesk utichne, [stop_host_scope.GetTitledFirstNameNoTooltip] se ke mně s úsměvem obrátí. „A jaká slova by nabídlo tvé srdce, [ROOT.Char.GetTitledFirstNameNoTooltip]?“"
 az_tour.0001.a.diplomacy: "Promluvím o tom, jak soulad udržuje panství pohromadě."
 az_tour.0001.a.martial: "Ctnost je třeba bránit silou."
 az_tour.0001.a.stewardship: "Zamyslím se nad břemenem spravedlivé vlády."
 az_tour.0001.a.intrigue: "Naznačím, že [stop_host_scope.GetTitleAsName] dobře zná sílu tichého vlivu."
 az_tour.0001.a.learning: "Nabídnu výklad opřený o klasická díla."
 az_tour.0001.a.fallback: "Odpovím promyšleným výkladem."
 az_tour.0001.b: "Přednesu krátký verš o pomíjivosti."
 az_tour.0001.c: "Promluvím o touze povznést se výš."
 az_tour.0002.t: "Cena vytříbenosti"
 az_tour.0002.desc: "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] s úsměvem předstoupí a podá mi lakovanou skříňku převázanou stuhou. Jemnost použité látky nelze přehlédnout, je to [stop_host_scope.Custom('RegionalFabric')].\n\n„Byla by pro mě hanba, [ROOT.Char.Custom('FormOfAddressForLiege')], nechat vás odjet bez malé známky mé úcty,“ pronese. „Uvnitř je jen několik skromných pokladů, leštěné lakované předměty, dávný verš psaný elegantní rukou a kadidlo, které bývalo oblíbené v síních vysokých úředníků.“\n\nJe to půvabné gesto. Jenže stříbrné podnosy se blyští a vzácná kresba dřevěných panelů okamžitě upoutá můj zrak. [ROOT.Province.Custom('GetRandomRegionalWood')|U] v takové kvalitě rozhodně není levnou záležitostí. Takový přepych vypovídá o prostředcích, které by si někdo v tomto postavení sotva měl dovolit. Znovu pohlédnu na dar. Je... přehnaně štědrý."
 az_tour.0002.a: "„Tak vytříbený dar... jsem [Select_CString(ROOT.Char.IsFemale,'poctěna','poctěn')].“"
 az_tour.0002.b: "„Tvůj vkus je vytříbený... až podezřele.“"
 az_tour.0002.c: "„S čistým svědomím to nemohu přijmout.“"
 az_tour.0003.t: "Šepot v poháru"
 az_tour.0003.desc: "Zatímco [stop_host_scope.Custom('RegionalDrink')] proudí a kolem mě plynou rozhovory, [servant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přistoupí, aby mi dolil pohár. Místo pouhého nalévání mi však prsty vtisknou do dlaně složený lístek a stejně rychle, jako se [Select_CString(servant.IsFemale,'objevila','objevil')], zase zmizí.\n\nPod stolem jej rozevřu. Jméno. Čin. Skandál. A všechno se to týká mého hostitele: [stop_host_scope.GetTitledHouseNameOrFirstName]. Vzkaz je stručný, ale jeho význam nelze přehlédnout.\n\nNa druhé straně stolu se [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] bezstarostně usmívá."
 az_tour.0003.a: "Tohle si zatím nechám pro sebe..."
 az_tour.0003.b: "O tomhle se musí promluvit."
 az_tour.0003.b.tt: "[stop_host_scope.GetTitledHouseNameOrFirstName] zareaguje podle své povahy."
 az_tour.0003.c: "Do některých věcí je lepší se neplést."
 az_tour.0003.d: "S tímhle půjdu rovnou na nejvyšší místa!"
 az_tour.1003.t: "Šepot v poháru"
 az_tour.1003.desc: "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi lehce pokyne, ať jdu za [Select_CString(visiting_liege.IsFemale,'ní','ním')] k postranní komnatě, právě když služebnictvo začíná měnit chody.\n\n„[ROOT.Char.GetFirstName],“ zazní hlas jemný jako hedvábí, ale skrývající ostří ocele. „Do rukou se mi dostal dopis, inkoust na něm ještě ani nezaschl. Píše se v něm o jistých... poklescích. Takové řeči by člověk snadno odmítl, kdyby je nešeptala více než jedna ústa.“\n\nVenku dál cinká nádobí a zní tlumený smích, zatímco zástěna vrhá na vyleštěnou podlahu mihotavé stíny."
 az_tour.1003.a: "„Lži a pomluvy. Už o tom nechci slyšet ani slovo!“"
 az_tour.1003.b: "„Máš mé mlčení... i vše, co s ním přichází.“"
 az_tour.1003.c: "Jmění za tvé mlčení."
 az_tour.1003.d: "„Vzdám se svého nároku.“"
 az_tour.1003.e: "„Tvé mlčení vykoupím vlastním.“"
 az_tour.0004.t: "Otázka správy"
 az_tour.0004.desc.intro: "[stop_host_scope.Custom('RegionalDrink')|U] koluje kolem stolu a mezi sousty i zdvořilými doušky začne rozhovor nabírat na ostrosti. [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přivede řeč na naléhavou otázku správy, ne přímo se mnou, ale zjevně tak, aby mi nic neuniklo.\n\n"
 az_tour.0004.desc.stewardship: "„Nemůžeme si dovolit promarnit další minci na pošetilosti,“ trvá na svém [stop_host_scope.GetTitledHouseNameOrFirstName]. „Prostředky na rozvoj musí směřovat tam, kde přinesou největší užitek.“\n\n„A přesto cesty praskají a příkopy vysychají, zatímco pokladnice leží ladem,“ namítne [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 az_tour.0004.desc.martial: "„Mé posádce chybějí koně, a ty mluvíš o zbroji na přehlídky?“ pronese chladně [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Kázeň začíná hrdostí na vlastní postavení,“ odsekne [stop_host_scope.GetTitledHouseNameOrFirstName] se zdviženým obočím."
 az_tour.0004.desc.learning: "„Tuto novou metodu vyměřování půdy podporují uznávané spisy,“ hájí svůj názor [stop_host_scope.GetTitledHouseNameOrFirstName].\n\n„A přesto se za její spolehlivost nezaručil jediný zdejší učenec,“ odpoví [opposing_counsel.Custom2('MyCharacterIntroduction', ROOT.Char)] chladně a ostře."
 az_tour.0004.a: "Musím dát našemu hostiteli za pravdu."
 az_tour.0004.b.stewardship: "Vyvážené hospodaření prospívá všem. Nabídnu kompromis."
 az_tour.0004.b.stewardship.tt: "Část přebytku přesměruj na nejnaléhavější opravy a zbytek na dlouhodobé investice. Šetrnost nemusí znamenat zanedbání."
 az_tour.0004.b.martial: "Bezpečnost musí být účelná, ne okázalá. Promluvím do toho."
 az_tour.0004.b.martial.tt: "Vybav posádku pro skutečný boj, ne na parádu. Potřebuje zbroj vhodnou do pole a dostatek koní pro hlídky. Sláva následuje kázeň, nikoli pozlátko."
 az_tour.0004.b.learning: "Ať rozhodne rozum. Navrhnu racionální řešení."
 az_tour.0004.b.learning.tt: "Vyzkoušej novou metodu v jediném okrsku a pečlivě sleduj výsledky. Osvědčí-li se, rozšiř ji. Pokud ne, zavrhni ji, jak musí připouštět každá dobrá teorie."
 az_tour.0004.c: "Tohle je hostina, ne debatní síň."
 az_tour.0005.t: "Falešný tón"
 az_tour.0005.desc: "Sálem se rozhostí ticho, když hudebník udeří do strun příliš prudce. Ostré zaznění protne šum hovoru jako políček a melodie rázem utichne.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] strne.\n\n„Ach... omlouvám se,“ vykoktá hudebník a hluboce se ukloní, zatímco nástroj v jeho rukou se ještě chvěje. Několik hostů zůstane s poháry nápoje [stop_host_scope.Custom('RegionalDrink')] na půli cesty k ústům a nejistě se rozhlíží.\n\n[stop_host_scope.GetTitledHouseNameOrFirstName] vykouzlí na tváři nucený úsměv, ale rozpaky v rudnoucích tvářích nelze přehlédnout. „Jen malá nehoda,“ zazní lehkým, byť napjatým hlasem. „Nenechme si tím zkazit radost z dnešního večera.“"
 az_tour.0005.a: "„Navzdory té nehodě to bylo skvělé vystoupení!“"
 az_tour.0005.b: "„Vždyť jsme sotva začali. Přineste mi [ROOT.Char.Custom('GetMusicalInstrument')]!“"
 az_tour.0005.c: "„Popravdě jsem tomu beztak sotva [Select_CString(ROOT.Char.IsFemale,'věnovala pozornost','věnoval pozornost')].“"
 az_tour.1005.t: "Vznešenější melodie"
 az_tour.1005.desc: "Ostré prasknutí... a pak ticho. [ROOT.GetCharacter.Custom('GetMusicalInstrument')|U] se uprostřed tónu zlomí a ohromené ticho, které následuje, řeže do uší víc než samotná hudba. Druhý hudebník zmešká nástup. Třetí nervózně zakašle. Vystoupení se rozpadá tón po tónu.\n\nNež stačím vstát nebo přivolat náhradu, [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vykročí vpřed a vyjme z pouzdra [visiting_liege.Custom('GetMusicalInstrument')]. Žádné fanfáry, žádné oznámení, jen tichá jistota někoho, kdo je zvyklý, že mu ostatní naslouchají.\n\nPrvní tóny se rozvinou jako dým kadidla, pomalé a hledající. Rozhovory umlkají. Poháry klesají. Dokonce i služebnictvo se zastaví. [visiting_liege.GetTitleAsNameNoTooltip|U], ještě před chvílí můj host, nyní ovládá celý sál jako hudebník.\n\nA když se poslední akord rozechvěje a pohasne v tichu, nezbývá mi než sedět a vstřebávat sílu toho okamžiku."
 az_tour.1005.a: "Takovou nádheru nic nepřekoná. Vskutku velkolepé!"
 az_tour.1005.b: "Takové mistrovství! Nutí mě toužit po vlastním zdokonalení."
 az_tour.1005.c: "„[visiting_liege.GetTitledFirstNameNoTooltip] má na takové vystoupení příliš vysoké postavení.“"
 az_tour.1005.c.toast: "[stop_host_scope.GetTitledHouseNameOrFirstName] kritizuje tvé vystoupení"
 az_tour.0006.t: "Drzé vyrušení"
 az_tour.0006.desc: "Smích a hudbu slavnosti náhle přeruší výkřik. Davem se prodere [angry_farmer.GetWomanMan] v obnošeném oděvu, s tváří rudou rozhořčením. Pevně se postaví a hlasem přehluší celé shromáždění.\n\n„Dřeme na polích od rána do večera, ale všechny peníze padnou na hedvábí a hostiny! Vy sedíte pod lucernami a popíjíte [stop_host_scope.Custom('RegionalDrink')], ale kdo se postará o nás, když máme prázdné misky?“\n\nSlavnost utichne. [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] po mně střelí opatrným a očividně nespokojeným pohledem."
 az_tour.0006.a: "„Nechám to prošetřit. Máš mé slovo.“"
 az_tour.0006.b: "„Slavnost není místem pro stížnosti.“"
 az_tour.0006.c: "„Dej si [stop_host_scope.Custom('RegionalDrink')] a uklidni se.“"
 tgp_heard_complaints_modifier: "Vyslyšené stížnosti"
 tgp_heard_complaints_modifier_desc: "Vládce tohoto hrabství vyslyšel stížnosti svých poddaných"
 tgp_dismissed_complaints_modifier: "Odbyté stížnosti"
 tgp_dismissed_complaints_modifier_desc: "Vládce tohoto hrabství odbyl stížnosti svých poddaných"
 az_tour.1006.t: "Drzé vyrušení"
 az_tour.1006.desc.intro: "Tržiště žije hudbou a hlaholem oslav, ale ne všechny hlasy znějí radostí. Místní rolník s tváří rudou rozčilením se prodere davem a zabodne pohled do [stop_host_scope.GetTitledHouseNameOrFirstName]."
 az_tour.1006.desc.a: "„Dřeme na polích od rána do večera, ale všechny peníze padnou na hedvábí a hostiny! Vy sedíte pod lucernami a popíjíte [stop_host_scope.Custom('RegionalDrink')], ale kdo se postará o nás, když máme prázdné misky?“\n\n[stop_host_scope.GetTitledHouseNameOrFirstName] se zatváří přísně, přesto odpoví klidně, slíbí náhradu škod a pověří správce, aby se o vše postaral."
 az_tour.1006.desc.b: "„Dřeme na polích od rána do večera, ale všechny peníze padnou na hedvábí a hostiny! Vy sedíte pod lucernami a popíjíte [stop_host_scope.Custom('RegionalDrink')], ale kdo se postará o nás, když máme prázdné misky?“\n\n[stop_host_scope.GetTitledHouseNameOrFirstName] se pomalu a shovívavě usměje. „Tvé prázdné misky nejsou moje starost. Stráže, chopte se [Select_CString(angry_farmer.IsFemale,'téhle','tohohle')] [angry_farmer.Custom2('InsultNoun', ROOT.Char)]!“ Davem se rozlehne zděšené zalapání po dechu. Stráže [Select_CString(angry_farmer.IsFemale,'rolnici zatknou a odvlečou','rolníka zatknou a odvlečou')] pryč a [Select_CString(angry_farmer.IsFemale,'její kletby','jeho kletby')] postupně zaniknou v hudbě."
 az_tour.1006.desc.c: "„Dřeme na polích od rána do večera, ale všechny peníze padnou na hedvábí a hostiny! Vy sedíte pod lucernami a popíjíte [stop_host_scope.Custom('RegionalDrink')], ale kdo se postará o nás, když máme prázdné misky?“\n\n[stop_host_scope.GetTitledHouseNameOrFirstName] lehce pozvedne ruku a klidným, ale pevným hlasem odpoví: „Sešli jsme se tu v míru. Nechme vášně vychladnout a poháry znovu naplnit. Jistě si dokážeme vyslechnout tvou stížnost bez dalšího rozruchu.“ Rolník nejistě přešlápne. Rozhořčení z očí nezmizí, ale pod tíhou vší té obřadnosti hlas přece jen změkne."
 az_tour.1006.a: "„Takový přístup je hodný skutečně [stop_host_scope.Custom('ComplimentAdjective')] [stop_host_scope.GetTitleAsNameNoTooltip]!“"
 az_tour.1006.a.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] podpořil[Select_CString(visiting_liege.IsFemale,'podpořila tvůj postup','podpořil tvůj postup')]"
 az_tour.1006.b: "„[Select_CString(ROOT.Char.IsFemale,'Já bych to řešila jinak.','Já bych to řešil jinak.')]“"
 az_tour.1006.b.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] nesouhlasil[Select_CString(visiting_liege.IsFemale,'nesouhlasila s tvou reakcí na rolníka','nesouhlasil s tvou reakcí na rolníka')]"
 az_tour.1006.c: "„[Select_CString(ROOT.Char.IsFemale,'Promiňte, nechala jsem se unést tím pestrobarevným tancem.','Promiňte, nechal jsem se unést tím pestrobarevným tancem.')]“"
 az_tour.1006.c.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] rozruch ignoruje a dál si hledí svého"
 az_tour.0007.t: "Rozkvetlé lichotky"
 az_tour.0007.desc: "Pod baldachýnem rozkvetlých větví zalitým světlem luceren ohlásí služebník příchod [elegant_noble.Custom2('MyCharacterIntroduction', ROOT.Char)]. Vznešený host vykročí vpřed a v rukou svírá svitek pokrytý jemnými tahy štětce. Z hedvábí vystupují malované hory, jejichž vrcholky korunují kvetoucí stromy, a vedle nich se vine plynulé písmo, spojení harmonie a síly.\n\n„Hory se mohou rozpadnout,“ pronese [elegant_noble.GetTitledFirstNameNoTooltip] se skromným úsměvem, „ale jaro se vždy vrátí, byť třeba jen na okamžik. A toto,“ pokračuje a nespouští ze mě oči, „je odrazem vaší vlády, [ROOT.Char.Custom('FormOfAddressForLiege')].“\n\nUmění je nepopiratelné a lichotka odzbrojující. [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] na znamení tichého souhlasu lehce přikývne a čeká na mou odpověď."
 az_tour.0007.a: "„Jaká harmonie! Už samotná práce se štětcem si zaslouží úřad.“"
 az_tour.0007.b: "„Až pomine jaro, pominou i tvé chlouby.“"
 az_tour.0007.c: "„Skutečné umění tu spočívá v lichotkách, ne v květinách.“"
 tgp_mocked_elites_modifier: "Zesměšněné elity"
 az_tour.1007.t: "Květ uvadá"
 az_tour.1007.desc: "Vzduch je prosycen vůní parfémů a poezie. Každé slovo je pečlivě zvolené, každé gesto předem nacvičené. Dvořané se naklánějí blíž, když [elegant_noble.Custom2('MyCharacterIntroduction', ROOT.Char)] dokončí poslední verš a jeho hlas ještě chvíli doznívá, sladký jako dým kadidla.\n\n[visiting_liege.Custom2('MyCharacterIntroduction', SCOPE.sCharacter('stop_host_scope'))] se pomalu a rozvážně usměje. „Jak půvabné,“ zazní hlas hladký jako lak. „Taková provinční upřímnost má jisté kouzlo.“ Sotva se stačím nadechnout, už se lavicemi šíří šepot a vějíře se zvedají, aby skryly pobavené úšklebky. [visiting_liege.Custom2('MyCharacterIntroduction', SCOPE.sCharacter('stop_host_scope'))] lehce skloní hlavu a dál se pomalu usmívá, jako by si mé rozpaky [Select_CString(visiting_liege.IsFemale,'vychutnávala','vychutnával')]."
 az_tour.1007.a: "Ať se směje, když jinak nemůže."
 az_tour.1007.b: "Takhle ponižovat můj lid!"
 az_tour.0008.t: "Štětec a soud"
 az_tour.0008.desc: "Na mou žádost usedne [revered_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] pod hedvábný baldachýn a kolem se shromáždí přihlížející. Se štětcem v ruce začne pečlivě přepisovat úryvek z klasických děl. Každý znak vzniká s trpělivou přesností, až se zdá, že pergamen sám ožívá významem.\n\nMnohé by napovědělo, kdyby právě [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] toto dílo [Select_CString(visiting_liege.IsFemale,'posoudila','posoudil')]. Stačil by jediný verdikt pronesený před tolika zraky a hned by se ukázalo, jak vytříbený má úsudek."
 az_tour.0008.a: "Vyzvat [visiting_liege.GetTitledHouseNameOrFirstName], aby ukázku posoudil."
 az_tour.0008.a.tt: "Odměna bude záviset na tom, jak tvůj panovník ukázku ohodnotí"
 az_tour.0008.b: "Nechat [visiting_liege.GetTitledHouseNameOrFirstName], ať si ukázku v klidu vychutná."
 az_tour.1008.t: "Štětec promlouvá"
 az_tour.1008.desc.intro: "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] mě zavede pod hedvábný baldachýn, kolem něhož se už shromáždil dav. „[revered_scholar.GetTitledHouseNameOrFirstName] nám předvede krásu klasických děl.“ [revered_scholar.GetTitledHouseNameOrFirstName] se nám oběma slavnostně ukloní, zaujme místo uprostřed a rozvine jemný pergamen. Štětec se v pravidelném rytmu dotkne papíru a jeden tah plynule přechází v další, dokud se slova neposkládají do půvabných tvarů. [stop_host_scope.GetTitleAsNameNoTooltip|U] na mě upřeně pohlédne. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], tvůj úsudek má velkou váhu. Poctíš nás tím, že toto dílo přede všemi zhodnotíš?“\n\n"
 az_tour.1008.desc.praise_subtle: "Všímám si pečlivé rovnováhy a plynulosti každého tahu. Písmo působí promyšleně a vyváženě, dovednost se tu snoubí s jasným záměrem."
 az_tour.1008.desc.arrogant_judgment: "Mé oči zachytí přesnost jednotlivých znaků, ale celé dílo působí až příliš sevřeně, téměř vypočítavě. Chybí mu vřelost a spontánnost."
 az_tour.1008.desc.shy_discomfort: "Svitek je nádherný, ale ve vzduchu visí tiché napětí. Volím jen několik opatrných slov a váhám, kolik toho vlastně odhalit."
 az_tour.1008.desc.generic_comment: "Řádky jsou čisté a rovnoměrně rozestoupené. Omezím se na zdrženlivou poznámku a dávám si pozor, abych nezabíhal do věcí, kterým nerozumím."
 az_tour.1008.a: "„Mistrovské dílo. Jemné, vyvážené a plné života.“"
 az_tour.1008.a.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] ukázku velmi [Select_CString(visiting_liege.IsFemale,'pochválila','pochválil')]"
 az_tour.1008.b: "„Úhledná práce, byť trochu... provinční.“"
 az_tour.1008.b.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] se ukázce [Select_CString(visiting_liege.IsFemale,'vysmála','vysmál')]"
 az_tour.1008.c: "„Forma je obdivuhodná, ale musím přihlédnout i k duchu díla.“"
 az_tour.1008.c.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] ukázku [Select_CString(visiting_liege.IsFemale,'pochválila','pochválil')]"
 az_tour.1008.d: "„Odpusťte mi. Musím se věnovat jiným záležitostem.“"
 az_tour.1008.d.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] [Select_CString(visiting_liege.IsFemale,'odmítla','odmítl')] ukázku posoudit"
 az_tour.0009.t: "Zatančíme si?"
 az_tour.0009.desc: "Nastal čas místní tradice. Tanečníci v maskách a třpytivých kostýmech z látky a papíru před pradávnými oltáři předvádějí tanec starý celé věky. Je prostý, hlučný, pestrý a divoký, ale lidé jej milují.\n\n[chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tiše přistoupí. „[visiting_liege.Custom2('MyCharacterIntroduction', chancellor)|U] brzy dorazí. Možná by tato podívaná mohla potěšit i [Select_CString(visiting_liege.IsFemale,'ji','ho')]. Je skromná, ale upřímná, je to pohled do samotné duše zdejšího lidu.“\n\nMá pravdu, jenže času máme málo a každá chvíle je drahocenná..."
 az_tour.0009.a: "Ať tanec připraví."
 az_tour.0009.a.tt: "Odměna bude záviset na tom, jak tvůj panovník tanec ohodnotí"
 az_tour.0009.b: "Čas bude lépe využit při hovoru o našich povinnostech."
 az_tour.1009.t: "Lidový tanec"
 az_tour.1009.desc: "Bubny duní jako kopyta a davem se přelévá smích. Pod vlajícími praporci a v oblacích kadidla poskakují a víří vesničané odění do pestrého hedvábí a kostýmů papírových koní. Předvádějí prastarý lidový tanec.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě [Select_CString(stop_host_scope.IsFemale,'pozvala','pozval')], [Select_CString(ROOT.Char.IsFemale,'abych byla svědkyní','abych byl svědkem')] této živé oslavy tradic [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury. Stojí opodál a v úsměvu se zračí hrdost. Když se přede mnou jeden z tanečníků hluboce ukloní, přijímám úctu prokázanou mému postavení i důvěru, kterou vkládají do mého úsudku."
 az_tour.1009.a: "Přistoupím k tanečníkům a vzdám jim čest."
 az_tour.1009.a.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] [Select_CString(visiting_liege.IsFemale,'ocenila','ocenil')] tanec"
 az_tour.1009.b: "Malý dar na počest jejich umění."
 az_tour.1009.b.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] [Select_CString(visiting_liege.IsFemale,'obdarovala','obdaroval')] tanečníky"
 az_tour.1009.c: "Raději se budu věnovat modlitbám."
 az_tour.1009.c.toast: "[visiting_liege.GetTitleAsNameNoTooltip|U] se [Select_CString(visiting_liege.IsFemale,'soustředila','soustředil')] na modlitby"
 tgp_popular_festival_performance_modifier: "Prestižní slavnostní vystoupení"
 tgp_popular_festival_performance_modifier_desc: "Tradiční tanec tohoto hrabství během slavnosti získal uznání váženého panovníka."
