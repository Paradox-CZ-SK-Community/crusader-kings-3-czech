l_polish:
 activity_festival: "Slavnost"
 activity_festival_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] slavnost"
 activity_festival_owner: "Hostitel"
 activity_festival_desc: "Slavnost je chvílí, kdy se lidé mohou znovu přimknout ke svým tradicím i k božskému řádu. Pro panovníka je zároveň příležitostí ukázat štědrost, získat si přízeň lidu a připomenout všem, odkud pramení jeho autorita."
 activity_festival_host_desc: "$BULLET_WITH_TAB$Můžeš získat [prestige_i][Concept('prestige','prestiž')|E]\n$BULLET_WITH_TAB$Můžeš získat [piety_i][Concept('piety','zbožnost')|E]\n$BULLET_WITH_TAB$Účastníci mohou získat [Concept('opinion','mínění')|E] přítomných postav\n$BULLET_WITH_TAB$Účastníci mohou ztratit [stress_loss_i][Concept('stress','stres')|E]\n$BULLET_WITH_TAB$Můžeš zlepšit @control_icon![Concept('control','kontrolu')|E] v [Concept('county','hrabství')|E]\n$BULLET_WITH_TAB$Můžeš zlepšit @development_icon![Concept('development','rozvoj')|E] v [Concept('county','hrabství')|E]\n$BULLET_WITH_TAB$Můžeš zlepšit @domain_icon![Concept('county_opinion','lidové mínění')|E]\n"
 activity_festival_guest_help_text: "Slavnost nabízí skvělou příležitost upevnit vztahy uvnitř svého [Concept('bloc','bloku')|E], posílit jeho [Concept('cohesion','soudržnost')|E] a získat na svou stranu nové členy."
 activity_festival_province_desc: "Pořádáš slavnost v [ROOT.Province.GetName]"
 activity_festival_guest_desc: "$BULLET_WITH_TAB$ Účastníci mohou získat [Concept('piety','zbožnost')|E]\n$BULLET_WITH_TAB$ Účastníci mohou získat [Concept('prestige','prestiž')|E]\n$BULLET_WITH_TAB$ Účastníci mohou získat [Concept('opinion','mínění')|E] ostatních účastníků\n$BULLET_WITH_TAB$ Účastníci mohou ztratit [stress_loss_i][Concept('stress','stres')|E]"
 activity_festival_conclusion_desc: "[GetActivityType('activity_festival').GetName] se chýlí ke konci"
