 ach_coronation.0015.t: "Velká tlačenice roku [GetCurrentDate.GetYear]"
 ach_coronation.0015.desc: "Katastrofa! Dav sledující družinu právě dorazivšího [first.GetTitledFirstName] se z neznámého důvodu propadl do naprostého chaosu. Dorazím právě včas, abych [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')] masu místních valící se sem a tam. Stráže [first.GetTitleAsNameNoTooltip] buď bijí lidi, kteří upadli, nebo jsou samy strhávány k zemi a zadupávány spolu s nimi.\n\nStráže sotva dokážou dav zadržet a násilí jen prohlubuje paniku. Brzy propukne skutečná tlačenice!"
 ach_coronation.0015.has_happened: "Tohle způsobil proradný [Concept('coronation_detractor','odpůrce korunovace')|E]!"
 ach_coronation.0015.a: "Musím dav uklidnit!"
 ach_coronation.0015.a.august: "Lidé! Váš [ROOT.Char.GetTitleAsNameNoTooltip] žádá klid!"
 ach_coronation.0015.a.august.tt: "Tvá nezpochybnitelná autorita dav uklidní."
 ach_coronation.0015.a.tt.success: "Úspěch!"
 ach_coronation.0015.a.tt.success.desc: "Podaří se ti zabránit dalšímu krveprolití. Skvělé znamení pro tvou vládu!"
 ach_coronation.0015.a.tt.critical_success: "Legendární proslov"
 ach_coronation.0015.a.tt.critical_success.desc: "Dav v úžasu ztichne. Mnozí dokonce pláčou dojetím nad krásou tvých slov."
 ach_coronation.0015.a.tt.failure.title: "Neúspěch"
 ach_coronation.0015.a.tt.failure: "Křik přehluší tvůj hlas"
 ach_coronation.0015.a.tt.initiator.critical_failure: "Katastrofa!"
 ach_coronation.0015.a.tt.initiator.critical_failure.desc: "[host.GetShortUIName] chaos zastaví, a co hůř, [Select_CString(host.IsFemale,'je za to oslavována','je za to oslavován')]!"
 ach_coronation.0015.a.tt.initiator.failure: "Neúspěch!"
 ach_coronation.0015.a.tt.initiator.failure.desc: "[host.GetShortUIName] zabrání katastrofě. K čertu!"
 ach_coronation.0015.a.tt.initiator.failure.crackdown.desc: "Vojáci [host.GetShortUIName] úspěšně ukončí chaos a [host.GetShortUIName] budí ještě větší strach než dřív"
 ach_coronation.0015.a.tt.initiator.failure.physician.desc: "[host.GetShortUIName] využije své lékařské schopnosti k ošetření raněných a [Select_CString(host.IsFemale,'je oslavována jako „hrdinka“','je oslavován jako „hrdina“')]!"
 ach_coronation.0015.a.tt.initiator.success: "Úspěch!"
 ach_coronation.0015.a.tt.initiator.success.desc: "[host.GetShortUIName] bude [Select_CString(host.IsFemale,'ponížena','ponížen')] a korunovace skončí fiaskem!"
 ach_coronation.0015.a.tt.initiator.critical_success: "Masakr!"
 ach_coronation.0015.a.tt.initiator.critical_success.desc: "Vojáci [host.GetShortUIName] zareagují přehnaně a mnoho lidí zabijí. Skutečný skandál!"
 ach_coronation.0015.b: "K raněným! Rychle!"
 ach_coronation.0015.b.flavor: "Teď se musíme soustředit jen na záchranu životů!"
 ach_coronation.0015.c: "Ti přehnaně rozvášnění hlupáci!"
 ach_coronation.0015.d: "Stráže! Obnovte pořádek!"
 ach_coronation.0015.d.byzantines: "Vypusťte Varjagy!"
 ach_coronation.0015.e: "Ach ne, pár rolníků možná zemře. No nic..."
