 ach_coronation.0014.t: "Na pokraji chaosu"
 ach_coronation.0014.desc: "Ze zadní části davu sleduji příjezd delegace [first.GetPrimaryTitle.GetNameNoTier], v jejímž čele stojí [first.GetTitleAsName]. Přijíždějí na korunovaci [host.GetTitledFirstName]."
 ach_coronation.0014.desc.weather.rain: "Dnes vydatně prší a"
 ach_coronation.0014.desc.weather.clear: "Přestože je dnes docela příjemně,"
 ach_coronation.0014.desc.weather.indoors: "[ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] je přeplněný,"
 ach_coronation.0014.desc.reason.rain: "prostý lid je špinavější a podrážděnější než obvykle. Jeden z místních uklouzne v blátě a spadne do cesty. Vzápětí se příliš horliví vojáci [first.GetTitleAsNameNoTooltip] vrhnou proti davu, bijí prosté lidi a odstrkují je od svého pána."
 ach_coronation.0014.desc.reason.local_discontent: "napětí v [coronation_site.GetHolding.GetHoldingType.GetName] je vysoké a několik shromážděných prostých lidí pokřikuje na procházejícího [first.GetTitleAsNameNoTooltip]. Někteří dokonce začnou provolávat kletby na adresu [host.GetPrimaryTitle.GetTitleAsNameNoTooltip]!"
 ach_coronation.0014.desc.reason.low_control: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] se už nějakou dobu vzpírá [ROOT.Char.GetCurrentLocation.GetHolder.GetPrimaryTitle.GetAdjective] nadvládě a dav sledující delegaci rozhodně nevypadá přátelsky."
 ach_coronation.0014.desc.reason.generic_indoors: "a dvořané s hosty se brzy začnou tlačit, aby vůbec udělali místo nově příchozím. Dav je čím dál neklidnější, v síni panuje nesnesitelné vedro a několik lidí se už pouští do křiku a strkanic."
 ach_coronation.0014.desc.reason.generic_outdoors: "dav působí neklidně. Na delegaci se přišlo podívat jednoduše příliš mnoho lidí. Všichni jsou namačkáni příliš těsně na sebe a stráže [first.GetTitleAsNameNoTooltip] vypadají nervózně."
 ach_coronation.0014.desc.ending: "\n\nNajednou mi to dojde. Dav by mohl celou korunovaci zničit. Stačil by jediný"
 ach_coronation.0014.desc.ending.byzantine: "\n\nNajednou mi to dojde. Shromážděný [Glossary('hoi polloi','HOI_POLLOI_GLOSS')] by bylo možné poštvat ke zničení celé korunovace. Stačil by jediný"
 ach_coronation.0014.desc.ending.outdoors: "kámen..."
 ach_coronation.0014.desc.ending.indoors: "výkřik..."
 ach_coronation.0014.a.outdoors: "#EMP Miřte na [first.GetTitleAsNameNoTooltip]!#!"
 ach_coronation.0014.a.indoors: "#BER „HOŘÍ!“#!"
 ach_coronation.0014.a.tt.success: "Vyvoláš panickou tlačenici"
 ach_coronation.0014.a.tt.failure: "Mineš"
 ach_coronation.0014.a.tt.host.success: "Mohlo by to nechtěně posílit pověst [host.GetTitledFirstName]. Tvůj neúspěch ti může způsobit [Concept('stress','stres')|E]"
 ach_coronation.0014.a.tt.host.failure.magnificence: "[Concept('coronation_magnificence','Pompéznost')|E] korunovace [host.GetTitledFirstName] může výrazně utrpět"
 ach_coronation.0014.a.tt.host.failure.host: "[host.GetTitledFirstName] může ztratit [Concept('legitimacy','legitimitu')|E] nebo [Concept('prestige','prestiž')|E]"
 ach_coronation.0014.a.tt.host.failure.crackdown: "[host.GetTitledFirstName] může reagovat přehnaně, zabít mnohem více lidí a zvýšit svou [Concept('dread','obávanost')|E] i [Concept('tyranny','tyranii')|E]"
 ach_coronation.0014.a.tt.failure.indoors: "V hluku tě nikdo neuslyší"
 ach_coronation.0014.a.rock: "[first.GetShortUIName] dostane kamenem do obličeje a získá [Concept('trait','rys')|E] [GetTrait('wounded_1').GetName( GetNullCharacter )|LV]"
 ach_coronation.0014.b: "Možná by se dal dav využít i jinak..."
 ach_coronation.0014.b.flavor: "Mí spolčenci se nepozorovaně pohybují po [coronation_site.GetHolding.GetHoldingType.GetName]."
 ach_coronation.0014.b.tt: "Buď máš rys [GetTrait('schemer').GetName( GetNullCharacter )], [GetTrait('deceitful').GetName( GetNullCharacter )], nebo alespoň [SCOPE.ScriptValue('very_high_skill_rating')|0V] bodů [Concept('intrigue','Intrik')|E]"
 ach_coronation.0014.c: "Poctu vzdám jako první."
