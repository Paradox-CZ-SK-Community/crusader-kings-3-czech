 ach_coronation.0017.desc: "Během ranní modlitby v [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] do mě šťouchne [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] a ukáže na místo, kde [host.Custom2('MyCharacterIntroduction', ROOT.Char)] klečí při obřadu.\n\n„Nevadí ti, že [host.GetTitledFirstNameNoTooltip] nikdy [Select_CString(host.IsFemale,'nebojovala','nebojoval')] za víru"
