 ach_coronation.0016.a.intrigue: "Mé špehy bude mít [host.GetTitledFirstNameNoTooltip] k dispozici."
 ach_coronation.0016.a.learning: "Promluvím s duchovenstvem ve prospěch [host.GetTitledFirstNameNoTooltip]."
 ach_coronation.0016.a.loyal: "Přísahám věčnou podporu."
