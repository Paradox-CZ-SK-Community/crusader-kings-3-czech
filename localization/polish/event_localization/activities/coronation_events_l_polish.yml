 ach_coronation.0016.t: "Dar, jaký si [host.GetTitleAsNameNoTooltip] zaslouží"
 ach_coronation.0016.desc: "Na korunovaci [Select_CString(host.IsFemale,'mé','mého')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))] [host.GetTitledFirstNameRegnal] se sjíždějí hosté. Každý pronáší drobné sliby, děkuje za pozvání a přísahá věrnost či podporu. Brzy přijdu na řadu i já.\n\nMusím nějak vystoupit z davu? Mám během své krátké audience přesvědčit [host.GetTitleAsNameNoTooltip], že si zasloužím uznání?"
 ach_coronation.0016.a.martial: "[Select_CString(ROOT.Char.IsFemale,'Darovala bych vojenský oddíl','Daroval bych vojenský oddíl')]!"
 ach_coronation.0016.a.stewardship: "Zařídím, aby ostatní hosté zaplatili desátek!"
 ach_coronation.0016.a.stewardship.greedy.tt: "Ty samozřejmě nepřispěješ"
