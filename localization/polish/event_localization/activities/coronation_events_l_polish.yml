 ach_coronation.0013.t: "[ROOT.Char.GetTitleAsNameNoTooltip] a prostý lid"
 ach_coronation.0013.intro: "Den trávím plněním povinností v relativním klidu [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly]. Právě tam,"
 ach_coronation.0013.desc_opening.rainy_day: "když se ukrývám před deštěm,"
 ach_coronation.0013.desc_opening.dry_day: "během krátkého odpočinku,"
 ach_coronation.0013.desc_opening: "na místě zvaném [ROOT.Char.Custom('GetMainsquareCommons')], zaslechnu někoho vykřiknout #EMP „[host.GetTitleAsNameNoTooltip]!“#!\n\nZa rohem se ukáže, odkud hlas přišel. [ROOT.Char.Custom('GetTaverngoersTribespeople')] tam s nápojem zvaným [ROOT.Char.Custom('RegionalAlcoholicDrink')] probírají nejnovější drby."
 ach_coronation.0013.desc_conversation.mean.1: "„Jedním slovem: [host.Custom('InsultAdjectiveGeneric')]! Horšího člověka s titulem [host.GetTitleAsNameNoTooltip] snad svět neviděl!“ odplivne si [peasant.Custom2('dummy_peasant_profession', peasant)] a celý stůl souhlasně zamručí."
 ach_coronation.0013.desc_conversation.mean.2: "„K čertu s tím samozvaným ‚[host.GetTitleAsNameNoTooltip]‘! Jestli to tak půjde dál, [host.GetTitledFirstNameNoTooltip] přivede [host.GetPrimaryTitle.GetTierAsName] do záhuby!“ prohlásí [peasant.Custom2('dummy_peasant_profession', peasant)] svým druhům."
 ach_coronation.0013.desc_conversation.mean.3: "„[dummy_gender.Custom('GetRandomRelation')] z mé rodiny slouží jako [dummy_gender.Custom('lowly_servant_type')] na místě korunovace zvaném [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSiteShort')] a říká, že [host.GetTitledFirstNameNoTooltip] má pořád zkažený dech!“"
 ach_coronation.0013.desc_conversation.mean.4: "„Slyšeli jste, že [host.GetTitledFirstNameNoTooltip] spává s někým ze služebnictva? Údajně je to [dummy_gender.Custom('lowly_servant_type')]!“ zasměje se [peasant.Custom2('dummy_peasant_profession', peasant)]. „A pak přijde na řadu [host.Custom('DeviantObjectArticle')] a [host.GetTitledFirstNameNoTooltip]-“"
 ach_coronation.0013.desc_conversation.mean.4.chaste: "Proboha! Zakryji si uši, než uslyším ještě něco dalšího."
 ach_coronation.0013.desc_conversation.mean.4.lustful.host: "Proboha! Tak málo mě znají!"
 ach_coronation.0013.desc_conversation.mean.4.lustful.guest: "Proboha! Tak málo [host.GetTitledFirstNameNoTooltip] znají!"
 ach_coronation.0013.desc_conversation.mean.4.not_lustful: "Proboha! Proč by si vůbec někdo něco takového vymýšlel?"
 ach_coronation.0013.desc_conversation.mean.5: "„Prý je to pěkný parchant. A ještě se říká: [host.Custom('InsultAdjectiveGeneric')]! Slyšeli jste, co všechno má [host.GetTitledFirstNameNoTooltip] na svědomí? Hotové monstrum.“"
 ach_coronation.0013.desc_conversation.nice.1: "„Ať žije [host.GetTitleAsNameNoTooltip]!“ zahuhlá [peasant.Custom2('dummy_peasant_profession', peasant)] a ostatní odpovědí opileckým jásotem."
 ach_coronation.0013.desc_conversation.nice.2: "„Říká se, že [host.GetTitleAsNameNoTooltip] nemá na celém světě konkurenci! [host.Custom('GetPrettyAdjective')] a [host.Custom('GetPiousAdj')]!“ vykládá jeden druhému."
 ach_coronation.0013.desc_conversation.nice.3: "„[dummy_gender.Custom('GetRandomRelation')] z mé rodiny má v příbuzenstvu někoho, kdo je [ROOT.Char.Custom('GetRandomRelation')], a právě odtud se prý ví, že [host.GetTitledFirstNameNoTooltip] umí [host.Custom('GetMedievalDance')] tak dobře, až člověku vyhrknou slzy!“ prohlásí [peasant.Custom2('dummy_peasant_profession', peasant)]."
 ach_coronation.0013.desc_conversation.nice.4: "„Jednou se mi poštěstilo spatřit [host.GetTitleAsNameNoTooltip],“ řekne [peasant.Custom2('dummy_peasant_profession', peasant)]. „Dobro bylo patrné hned, jakmile jsem se podíval na [host.Custom('GetErIm')]!“"
 ach_coronation.0013.desc_conversation.nice.5: "„[claimant.Custom('InsultAdjectiveGeneric')]! Smrt uchazeči [claimant.GetTitledFirstName]!“ prohlásí [peasant.Custom2('dummy_peasant_profession', peasant)] za všeobecného jásotu. „Ať žije právoplatný [host.GetTitleAsNameNoTooltip]!“"
 ach_coronation.0013.ending.agrees: "\n\nHa! Myslím, že tihle dobří lidé na to kápli!"
 ach_coronation.0013.ending.disagrees: "\n\nJak se tihle prostoduchí #EMP rolníci#! opovažují takhle urážet svou vrchnost!"
 ach_coronation.0013.ending.neutral: "\n\nZdá se, že dnes má na politiku čas i prostý lid."
 ach_coronation.0013.a.weaken_detractors: "Poslouchejte! Mám pro vás návrh."
 ach_coronation.0013.a.weaken_detractors.flavor: "Napadá mě pár mnohem lepších zvěstí, které by mohli šířit!"
 ach_coronation.0013.a.weaken_detractors.tt: "Tví nepřátelé se stanou terčem posměchu davu"
 ach_coronation.0013.b: "No jo, všem se člověk nezavděčí. #EMP STRÁŽE!#!"
 ach_coronation.0013.c: "Naučím je bát se koruny!"
 ach_coronation.0013.c.tt.success: "Rolníci s hrůzou v očích prosí o milost"
 ach_coronation.0013.c.tt.failure: "Zvěsti se šíří dál..."
 ach_coronation.0013.flavor: "Pořádné vyčinění by těm hlupákům mělo připomenout, že mají držet jazyk za zuby."
 ach_coronation.0013.d: "Ty tam! Nalij mi něco!"
 ach_coronation.0013.d.flavor: "Mám se stát [host.GetTitleAsNameNoTooltip] a chci se napít, zatraceně!"
 ach_coronation.0013.e: "No nic, zpátky k povinnostem."
 ach_coronation.0013.e.disagrees: "Stojím vysoko nad těmito hlupáky."
 ach_coronation.0013.e.flavor.mean: "Proč by mě proboha mělo zajímat žvanění prostého lidu?"
 ach_coronation.0013.e.flavor.nice: "A kdo tvrdí, že prostý lid je nevzdělaný!?"
 two_detractors_get_negative_rumors_tt: "Dva [Concept('coronation_detractors','odpůrci')|E] získají [Concept('modifier','modifikátor')|E] #N [GetModifier('ach_negative_rumors_modifier').GetNameWithTooltip]#!"
 because_you_have_overseer_tt: "#P Díky zkušenostem spojeným s rysem [GetTrait('overseer').GetName( GetNullCharacter )] se vyhneš negativním dopadům na [Concept('coronation_magnificence','pompéznost')|E] své korunovace#!"
