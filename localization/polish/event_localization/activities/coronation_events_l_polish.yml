l_polish:
 ach_coronation.0001.t: "Příjezd"
 ach_coronation.0001.travel: "Konečně jsem [Select_CString(ROOT.Char.IsFemale,'dorazila','dorazil')] do [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] na korunovaci."
 ach_coronation.0001.notravel: "Z [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] už byli kvůli korunovaci rozesláni poslové i služebnictvo."
 ach_coronation.0001.intro.hre: "Korunovat [host.GetTitleAsName] nebude žádná maličkost. Zdá se, že do [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] proudí snad všichni, kdo v [host.GetPrimaryTitle.GetTierAsName] něco znamenají, a už zde vlají praporce kurfiřtů i stovky místních šlechticů."
 ach_coronation.0001.intro.hre_host: "Brzy usednu na trůn Karla Velikého, nasadím si Ottovu korunu a budu promlouvat hlasem Augusta. Kurfiřti už svého [ROOT.Char.GetTitleAsNameNoTooltip] vybrali, teď je čas, aby je následovali všichni ostatní."
 ach_coronation.0001.intro.byzantine: "Tyto události zařadí [host.GetTitledFirstName] po bok Herakleia a Justiniána. Vládnout [Glossary('Romaioi','ROMAIOS_GLOSS')] znamená vládnout světu a nezbývá než doufat, že [host.GetTitledFirstNameNoTooltip] této chvíli dostojí."
 ach_coronation.0001.intro.byzantine_host: "Brzy zaujmu své právoplatné místo po boku Konstantina a Theodosia. Stanu se [Glossary('Autokrator','AUTOKRATOR_GLOSS')], vládcem vesmíru, pánem celého Říma, skutečným [ROOT.Char.GetTitleAsName]!"
 ach_coronation.0001.intro.host: "Vzduch je nabitý očekáváním a mně konečně dochází, že budu [Select_CString(ROOT.Char.IsFemale,'korunována','korunován')] jako [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 ach_coronation.0001.intro.notravel_host: "Teprve když odejde poslední pozvánka a dvůr zahájí přípravy, mi to konečně dojde. Budu [Select_CString(ROOT.Char.IsFemale,'korunována','korunován')] jako [ROOT.Char.GetTitleAsName] [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 ach_coronation.0001.guest: "[host.GetTitledFirstName] zde v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] čeká korunovace a já mohu jen doufat, že [host.GetFirstNameNoTooltip] prokáže, že si korunu zaslouží."
 ach_coronation.0001.ending.host_arbitrary: "\n\nBrzy budu [ROOT.Char.GetTitleAsNameNoTooltip] a nikdo nebude moci tvrdit opak! Konečně budu moci vládnout tak, jak #emp já#! chci."
 ach_coronation.0001.ending.host_cynical: "\n\nTeď se musím před celým panstvím poklonit [priest.GetFirstName] jako nějaký zbožný hlupák, ale jakmile se znovu narovnám, už nikdy nebudu muset poslouchat to nekonečné žvanění!"
 ach_coronation.0001.ending.host_cynical_hof: "\n\nUž se opravdu nemohu dočkat, až se [priest.GetTitledFirstName] začne naparovat [Select_CString(priest.IsFemale,'obklopena','obklopen')] tou nejnudnější společností, jakou si lze představit..."
 ach_coronation.0001.ending.host_impatient: "\n\nUž aby to bylo za mnou! To čekání je nesnesitelné. [ROOT.Char.Custom('GetBusynessOpinion')] budu mít příliš mnoho práce, než abych na to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] myslet..."
 ach_coronation.0001.ending.host_just: "\n\nAž dosud byla má vláda nelegitimní a [Select_CString(ROOT.Char.IsFemale,'nebyla','nebyl')] jsem ničím víc než uchazečem o trůn. Jakmile však obřad skončí, konečně budu skutečně [ROOT.Char.GetTitleAsNameNoTooltip]!"
 ach_coronation.0001.ending.host_ambitious: "\n\nPomyšlení, že mi brzy na hlavu položí korunu, mě naplňuje radostí. Je to však jen první krok ke #EMP skutečné#! slávě."
 ach_coronation.0001.ending.host_compassionate: "\n\nSláva, která mě čeká, bude veliká, ale nesmím zapomínat, že svou cenu musím dokázat především lidem svého [ROOT.Char.GetPrimaryTitle.GetTierAsName]."
 ach_coronation.0001.ending.host_trusting: "\n\nBrzy tu budou všichni mí vazalové a každý z nich bude jistě provolávat mé jméno!"
 ach_coronation.0001.ending.host_paranoid: "\n\nBrzy tu budou všichni mí vazalové a [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] se promění ve zmijí hnízdo. Budu si muset krýt záda..."
 ach_coronation.0001.ending.host_zealous: "\n\nMusím se modlit, neboť jen [ROOT.Char.GetFaith.HighGodName] může skutečně rozhodnout, zda jsem [Select_CString(ROOT.Char.IsFemale,'hodna','hoden')]."
 ach_coronation.0001.ending.host_content: "\n\nPopravdě bych se bez toho všeho docela [Select_CString(ROOT.Char.IsFemale,'obešla','obešel')], ale některé věci zkrátka [ROOT.Char.GetTitleAsNameNoTooltip] udělat musí."
 ach_coronation.0001.ending.host_gregarious: "\n\nBudu muset promluvit s tolika lidmi... to by vlastně mohla být docela zábava!"
 ach_coronation.0001.ending.host_craven: "\n\nSnad všechno dopadne dobře, pokud se mí vazalové podřídí... p-podřídí se, že ano?"
 ach_coronation.0001.ending.host_shy: "\n\nBrzy bude celé panství v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]... čím dřív to skončí, tím lépe."
 ach_coronation.0001.ending.host_arrogant: "\n\nBrzy se přede mnou budou klanět všichni, prostí lidé i páni... dobře."
 ach_coronation.0001.ending.host_calm: "\n\nKorunovace by měla být radostným dnem pro všechny, ale musím zůstat [Select_CString(ROOT.Char.IsFemale,'obezřetná','obezřetný')]. Dny, které přijdou, mohou být nebezpečné..."
 ach_coronation.0001.ending.host_gluttonous: "\n\nUž se nemohu dočkat korunovace! Bude nádherné hodovat s celým panstvím jako skutečný [ROOT.Char.GetTitleAsNameNoTooltip]!"
 ach_coronation.0001.ending.host_eccentric: "\n\nBrzy mě korunují a potom budu vládnout #EMP navěky#!."
 ach_coronation.0001.ending.host_neutral: "\n\nUž sice vládnu, ale teprve tato korunovace ze mě učiní skutečného [ROOT.Char.GetTitleAsNameNoTooltip]. Jsem [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')]."
 ach_coronation.0001.ending.hostile_host: "\n\n[host.GetTitledFirstNameNoTooltip] rozhodně není můj přítel, ale já i panství to přečkáme."
 ach_coronation.0001.ending.friendly_host: "\n\nJe známo, že mě má [host.GetTitledFirstNameNoTooltip] v oblibě. Ať je tedy tato vláda prospěšná nám oběma! Nebo alespoň mně..."
 ach_coronation.0001.ending.neutral_host: "\n\nAť už má člověk [host.GetTitleAsNameNoTooltip] rád, nebo ne, nikdo nemůže popřít vážnost chvíle, jíž budeme svědky."
 ach_coronation.0001.a: "Brzy začne má vláda!"
 ach_coronation.0001.a.eccentric: "Navěky..."
 ach_coronation.0001.a.bad: "Je čas zjistit, do jakých potíží se můžu dostat..."
 ach_coronation.0001.a.good: "Dnes začíná nová kapitola."
 ach_coronation.0001.tt.hof_visit.title: "Svatá návštěva"
 ach_coronation.0001.tt.hof_visit: "[hof.GetCurrentLocation.GetBaronyNameExplicitly] získá [GetModifier('ach_hof_visit_modifier').GetNameWithTooltip] díky příjezdu [hof.GetTitledFirstName]"
 ach_coronation.0010.t: "[hof.GetTitledFirstNameNoTooltip] přijíždí"
 ach_coronation.0010.desc.desc_opening: "Zvony se rozezní po celém [coronation_site.GetCounty.GetFaith.HouseOfWorship] a lidé jásají v ulicích [coronation_site.GetHolding.GetName], když se na obzoru objeví praporce [hof.GetTitledFirstName]."
 ach_coronation.0010.desc.desc_greeting.first_person: "Spolu s [greeter_2.GetFirstName], [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], vyrážíme jako první přivítat [hof.GetTitleAsNameNoTooltip]. Po [greeter.Custom2('GetHoFGreeterExchangeFirstPerson', SCOPE.sC('hof'))] pak vstoupíme do [coronation_site.GetHolding.GetNameNoTooltip].\n\n"
 ach_coronation.0010.desc.desc_greeting.host: "[greeter.GetTitledFirstName] a [greeter_2.GetFirstName], [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], jako první přivítají [hof.GetPrimaryTitle.GetAdjective] delegaci a teprve po [greeter.Custom2('GetHoFGreeterExchange', SCOPE.sC('hof'))] vstoupí do [coronation_site.GetHolding.GetNameNoTooltip].\n\n"
 ach_coronation.0010.desc.desc_greeting.baron: "[greeter.GetTitledFirstName] a místní [greeter.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [greeter_2.GetTitledFirstName] jako první přivítají [hof.GetPrimaryTitle.GetAdjective] delegaci a teprve po [greeter.Custom2('GetHoFGreeterExchange', SCOPE.sC('hof'))] vstoupí do [coronation_site.GetHolding.GetNameNoTooltip].\n\n"
 ach_coronation.0010.desc.desc_first.greedy: "Místní chudina by neměla očekávat příliš mnoho almužen. [hof.GetTitledFirstNameNoTooltip] je totiž [Select_CString(hof.IsFemale,'pověstná','pověstný')] svou lakotou. Rozhodně však budou svědky"
 ach_coronation.0010.desc.desc_first.generous: "[hof.GetTitledFirstName] je [Select_CString(hof.IsFemale,'známá','znám')] svou štědrostí. Místní se bezpochyby dočkají hojných almužen a zároveň budou svědky"
 ach_coronation.0010.desc.desc_first.compassionate: "Soucit [hof.GetTitleAsNameNoTooltip] je legendární a vzduch naplňují modlitby za laskavé srdce spolu s vyprávěním o"
 ach_coronation.0010.desc.desc_first.cynical: "[hof.GetTitledFirstName] je nechvalně [Select_CString(hof.IsFemale,'známá','znám')] ani ne tak svou vírou jako spíše"
 ach_coronation.0010.desc.desc_first: "Věřící se hrnou spatřit [hof.GetTitledFirstNameNoTooltip] a následují je všichni městští obchodníci i žebráci, stejně jako ti, kteří chtějí na vlastní oči vidět"
 ach_coronation.0010.desc.desc_second.zealous: "proslulá ohnivá kázání a mimořádnou horlivost."
 ach_coronation.0010.desc.desc_second.wrathful: "pověstnou prudkost a výbušnou povahu."
 ach_coronation.0010.desc.desc_second.lustful: "nechvalně proslulé... záliby."
 ach_coronation.0010.desc.desc_second.strong: "legendární postavu a tělesnou sílu, které bezpochyby požehnal [hof.GetFaith.HighGodName]."
 ach_coronation.0010.desc.desc_second.gluttonous: "nechvalně proslulý apetit, který je prý zkázou každého [hof.Custom('GetExpensiveDessert')] v [hof.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 ach_coronation.0010.desc.desc_second: "mimořádný význam a prestiž."
 ach_coronation.0010.desc.desc_ending.excommunicated_first_person: "Překvapuje mě, že [hof.GetTitledFirstNameNoTooltip] vůbec [Select_CString(hof.IsFemale,'dorazila','dorazil')], když jsem stále [Select_CString(ROOT.Char.IsFemale,'exkomunikována','exkomunikován')]. Cena za požehnání bude bezpochyby vysoká..."
 ach_coronation.0010.desc.desc_ending.excommunicated: "Mnohé překvapuje, že [hof.GetTitledFirstName] vůbec [Select_CString(hof.IsFemale,'dorazila','dorazil')], když je [host.GetFirstNameNoTooltip] stále [Select_CString(host.IsFemale,'exkomunikována','exkomunikován')]. [host.GetTitleAsNameNoTooltip] za svou korunu bezpochyby draze zaplatí..."
 ach_coronation.0010.desc.desc_ending.opinion_very_good_first_person: "S [hof.GetFirstNameNoTooltip] jsme skvělí přátelé a tato korunovace bude bezpochyby radostnou událostí pro nás oba."
 ach_coronation.0010.desc.desc_ending.opinion_very_good: "O [hof.GetTitleAsNameNoTooltip] a [host.GetTitleAsNameNoTooltip] se říká, že jsou velcí přátelé, a tato korunovace pro ně bezpochyby bude radostnou událostí."
 ach_coronation.0010.desc.desc_ending.opinion_bad: "Napětí mezi [hof.GetTitleAsNameNoTooltip] a [host.GetTitleAsNameNoTooltip] však [host.Custom2('GetRandomConflictDescriptor', SCOPE.sC('hof'))] a atmosféra při korunovaci bude bezpochyby vypjatá."
 ach_coronation.0010.desc.desc_ending.opinion_bad_first_person: "Napětí mezi [hof.GetTitleAsNameNoTooltip] a mnou však [host.Custom2('GetRandomConflictDescriptor', SCOPE.sC('hof'))] a atmosféra při korunovaci bude bezpochyby vypjatá."
 ach_coronation.0010.desc.desc_ending.low_fervor: "[hof.GetFaith.GetName] už zažila lepší časy. Ještě nikdy nehořel plamen víry tak slabě a skuteční věřící nebyli tak vzácní. Věřící i [hof.GetTitleAsNameNoTooltip] bezpochyby doufají, že korunovace [host.GetTitledFirstNameNoTooltip] znovu rozdmýchá víru v [host.GetPrimaryTitle.GetTierAsName]."
 ach_coronation.0010.desc.desc_ending.opinion_good_first_person: "Vztahy mezi [hof.GetTitleAsNameNoTooltip] a mnou jsou vřelé a lidé v [coronation_site.GetHolding.GetNameNoTooltip] na nás budou bezpochyby připíjet ještě celé týdny."
 ach_coronation.0010.desc.desc_ending.opinion_good: "Vztahy mezi [hof.GetTitleAsNameNoTooltip] a [host.GetTitleAsNameNoTooltip] jsou vřelé a lidé v [coronation_site.GetHolding.GetNameNoTooltip] na ně budou bezpochyby připíjet ještě celé týdny."
 ach_coronation.0010.desc.desc_ending.neutral: "Už samotná skutečnost, že [host.GetTitleAsNameNoTooltip] bude [Select_CString(host.IsFemale,'korunována','korunován')] osobně [hof.GetTitledFirstNameNoTooltip], je působivá. Požadovaná cena však bude bezpochyby vysoká."
 ach_coronation.0010.desc.desc_ending.neutral_first_person: "Má legitimita bude nezpochybnitelná, jakmile mě [hof.GetTitledFirstName] korunuje."
 ach_coronation.0010.b: "Působivá podívaná!"
 ach_coronation.0010.b.rival: "Pche! Mor na toho samozvaného „[hof.GetTitleAsNameNoTooltip]“."
 ach_coronation.0010.b.friend: "[hof.GetFirstNameNoTooltip] je tady? Hurá!"
 ach_coronation.0010.b.lover: "Hmm, snad si na nás [hof.GetFirstNameNoTooltip] najde trochu času..."
 ach_coronation.0010.b.heretic: "Pro mě to žádný [hof.GetTitleAsNameNoTooltip] není!"
 ach_coronation.0010.b.heathen: "Koho to zajímá?"
 ach_coronation.0010.b.witch: "Možná je načase držet se při zemi..."
 ach_coronation.0010.b.cynical: "Pche! Tolik povyku pro nic."
 ach_coronation.0010.b.zealous: "Jsme skutečně požehnáni!"
 ach_coronation.0010.a: "Počkat! Musím s [hof.GetTitledFirstNameNoTooltip] promluvit!"
 ach_coronation.0010.a.tt.success: "[hof.GetTitledFirstNameNoTooltip] vyslyší tvé prosby! [ROOT.Char.GetFaith.HighGodName] stojí při tobě!"
 ach_coronation.0010.a.tt.failure: "[hof.GetTitledFirstNameNoTooltip] se s tebou odmítne setkat"
 ach_coronation.0010.a.tt.anger: "[hof.GetTitledFirstNameNoTooltip] urazí už samotná tvá žádost"
 ach_coronation_0010_hof_desc_host.tt: "Souhlas [hof.GetTitledFirstNameNoTooltip] zvýší tvou [Concept('legitimacy','legitimitu')|E] a [Concept('fervor','horlivost')|E] [Concept('faith',hof.GetFaith.GetName)|E]"
 ach_coronation_0010_hof_desc_guest.tt: "Požehnání [hof.GetTitledFirstNameNoTooltip] zvýší [Concept('legitimacy','legitimitu')|E] [host.GetTitledFirstNameNoTooltip] a [Concept('fervor','horlivost')|E] [Concept('faith',hof.GetFaith.GetName)|E]"
 activity_hof_arrival_log: "[TARGET_CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetPrimaryTitle.GetAdjective] delegace [Select_CString(TARGET_CHARACTER.IsFemale,'dorazily','dorazili')] na korunovaci [CHARACTER.GetTitledFirstNameNoTooltip], což mezi prostým lidem vyvolalo velké oslavy."
 activity_hof_arrival_log_title: "$ep2_wedding.1170.t$"
 ach_coronation.0011.t: "Stíny před trůnem"
 ach_coronation.0011.desc: "Ve stínech [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSitePrefix')][ROOT.Char.GetCurrentLocation.Custom('GetCoronationSite')] se plazí zmije. Mezi služebnictvem a dvořany připravujícími [ROOT.Char.GetCurrentLocation.Custom('GetCoronationSiteShort')] si [plotter.GetTitledFirstName] šeptá s hloučkem právě dorazivších hostů.\n\nJakmile se přiblížím, všichni okamžitě ztichnou a [plotter.GetFirstNameNoTooltip] se hluboce ukloní.\n\n„[host.GetFirstNameNoTooltip], [plotter.Custom2('RelationToMeShort', SCOPE.sC('host'))],“ začne [plotter.GetTitledFirstNameNoTooltip], „omlouvám se, jen jsme hovořili o... záležitostech osobní povahy.“"
 ach_coronation.0011.a: "Pravdu z [plotter.GetTitledFirstNameNoTooltip] ještě dostanu..."
 ach_coronation.0011.a.success: "[plotter.GetTitledFirstName] je [Select_CString(plotter.IsFemale,'přistižena','přistižen')] při lži"
 ach_coronation.0011.a.success.tt: "Intrika je odhalena! Tedy pokud vůbec nějaká existuje"
 ach_coronation.0011.a.failure: "[plotter.GetTitledFirstName] je [Select_CString(plotter.IsFemale,'příliš nepolapitelná','příliš nepolapitelný')]"
 ach_coronation.0011.b: "[coward.GetTitledFirstNameNoTooltip], ven s tím. #BER Hned.#!"
 ach_coronation.0011.b.flavor: "[coward.GetTitledFirstNameNoTooltip] už má slzy na krajíčku. Stačilo by trochu přitlačit a [Select_CString(coward.IsFemale,'zlomila by se','zlomil by se')]"
 ach_coronation.0011.b.tt: "[coward.GetTitledFirstName] odhalí [Concept('scheme','intriku')|E], a pokud žádná neexistuje, pak [Concept('secret','tajemství')|E]"
 ach_coronation.0011.c: "To mě máte za hlupáka!? #EMP Stráže!#!"
 ach_coronation.0011.c.paranoid: "#EMP JÁ TO VĚDĚL#!! Zatkněte ty zrádce!"
 ach_coronation.0011.c.wrathful: "Jak se opovažujete!? Myslíte si, že jsem hlupák? Stráže!"
 ach_coronation.0011.d: "Budu si muset [plotter.GetTitledFirstNameNoTooltip] hlídat..."
 ach_coronation.0011.scheme.plotter.toast: "[Concept('scheme',hostile_scheme.GetSchemeType.GetTypeNameNoTooltip)|E] [plotter.GetTitledFirstNameNoTooltip] proti [hostile_scheme.GetTargetCharacter.GetFirstName] byla odhalena!"
 ach_coronation.0011.scheme.coward.toast: "[Concept('scheme',coward_scheme.GetSchemeType.GetTypeNameNoTooltip)|E] [coward.GetTitledFirstNameNoTooltip] proti [coward_scheme.GetTargetCharacter.GetFirstName] byla odhalena!"
 ach_coronation.0011.secret.coward.toast: "Dozvíš se o [Concept('secret',revealed_secret.GetName)|E], které skrývá [coward.GetTitledFirstNameNoTooltip]"
 ach_coronation.0011.coward.success: "[coward.GetTitledFirstNameNoTooltip] se zlomí během několika vteřin"
 ach_coronation.0011.hook.toast: "[coward.GetTitledFirstNameNoTooltip] se rozpláče a začne blábolit, přičemž tě ujišťuje, že udělá cokoli, aby [Select_CString(coward.IsFemale,'dokázala','dokázal')] svou věrnost"
 ach_coronation.0011.false.toast: "[plotter.GetTitledFirstNameNoTooltip] [Select_CString(plotter.IsFemale,'plánovala','plánoval')] příjemný dárek"
 ach_coronation.0012.t: "Otázky obřadu a práva"
 ach_coronation.0012.desc: "Během příprav na korunovaci ustaraný sluha oznámí příchod [first.GetTitledFirstName] a [second.GetTitledFirstName] jen okamžik předtím, než oba vtrhnou do místnosti. Nějakým nedopatřením byla oběma přislíbena prestižní úloha nést během obřadu [ROOT.Char.Custom('GetRandomCoronationObject')].\n\nJejich vzájemné sváry jsou všeobecně známé a přenechat tuto úlohu tomu druhému by znamenalo ponížení vlastního rodu, bez ohledu na to, jak bezvýznamná se sama úloha může zdát."
 ach_coronation.0012.a: "Té cti se dostane [first.GetTitledFirstNameNoTooltip]."
 ach_coronation.0012.b: "Připadne [second.GetTitledFirstNameNoTooltip]."
 ach_coronation.0012.c: "Tohle dokážeme vyřešit!"
 ach_coronation.0012.c.flavor: "Třeba by to mohli nést uličkou společně?"
 ach_coronation.0012.c.tt.success: "Máš skvělý plán"
 ach_coronation.0012.c.tt.failure: "Už se zase hádají"
 ach_coronation.0012.d: "Ha! Dívejte se, jak se to dělá."
 ach_coronation.0012.d.flavor: "Jako by tihle amatéři nikdy předtím nezažili dvorský obřad!"
 ach_coronation.0012.e: "[ROOT.Char.Custom('GetRandomCoronationObject')|U]? A má to nést někdo z #EMP vás#!?"
 coronation_elaborate_ceremony_log_title: "Propracovaný obřad"
 coronation_elaborate_ceremony_log: "Podařilo se přesvědčit [CHARACTER.GetUIName|U] a [TARGET_CHARACTER.GetUIName|U] ke společnému přijetí propracované korunovační úlohy pro dvě osoby navzdory jejich dlouholeté vzájemné nevraživosti."
