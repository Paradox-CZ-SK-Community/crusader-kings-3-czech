 ach_coronation.0017.a: "Jako někdo s rysem [GetTrait('faith_warrior').GetName( GetNullCharacter )] dávám [host.GetTitledFirstNameNoTooltip] svou podporu!"
 ach_coronation.0017.a.christian: "Jako [Select_CString(ROOT.Char.IsFemale,'křižačka','křižák')] dávám [host.GetTitledFirstNameNoTooltip] svou podporu!"
 ach_coronation.0017.b: "Veřejně toho zbabělce zostudím!"
 ach_coronation.0017.c: "Pche! Soustřeď se na modlitby."
 ach_coronation.0017.d: "Víra není žádná soutěž!"
 ach_coronation.0017.d.cynical: "Cože? Koho takové věci zajímají?"
 crusader_endorsement_opinion: "Podpora svatého válečníka"
 crusader_sellout_opinion: "Znevážení svaté služby"
 ach_coronation.0018.t: "Dynastické povinnosti"
 ach_coronation.0018.desc: "Přípravy na korunovaci [host.GetTitledFirstNamePossessive] jsou v naprostém chaosu!"
 ach_coronation.0018.desc.seneschal: "Jako [GetCourtPositionType('seneschal_court_position').GetName] by [Select_CString(servant_boss.IsFemale,'měla','měl')] mít dohled nad služebnictvem [servant_boss.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 ach_coronation.0018.desc.steward: "Když tu není [GetCourtPositionType('seneschal_court_position').GetName], [Select_CString(servant_boss.IsFemale,'měla','měl')] by služebnictvo řídit [servant_boss.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] coby [servant_boss.GetCouncilTitle|l]."
 ach_coronation.0018.desc.fallback: "Zdá se, že nikdo není připraven služebnictvo řídit."
 ach_coronation.0018.desc.ending.servant_boss: "[servant_boss.GetTitledFirstNameNoTooltip] je však [Select_CString(servant_boss.IsFemale,'zcela zahlcena','zcela zahlcen')]. Služebnictvo si mezitím bez řádného dohledu spokojeně klábosí a zahálí.\n\n[host.GetTitledFirstNameNoTooltip] by se [Select_CString(host.IsFemale,'měla','měl')] soustředit na nadcházející obřad, ale místo toho musí neustále řešit jednu malichernost za druhou."
 ach_coronation.0018.desc.ending.no_servant_boss: "Nedostatek vedení je očividný a ti, kteří zrovna nepanikaří, si spokojeně klábosí a zahálejí.\n\n[host.GetTitledFirstNamePossessiveNoTooltip] pozornost by se měla upínat k nadcházejícímu obřadu, ale místo toho musí [host.GetTitledFirstNameNoTooltip] neustále řešit jednu malichernost za druhou."
 ach_coronation.0018.a.intent: "Tohle je moje příležitost!"
 ach_coronation.0018.a: "Pomohu [servant_boss.GetTitledFirstNameNoTooltip] s přípravami."
 ach_coronation.0018.a.tt_success: "[host.GetTitledFirstName] si všimne tvé pomoci"
 ach_coronation.0018.a.tt_failure: "Tvé úsilí zůstane bez povšimnutí"
 ach_coronation.0018.b: "Proč je vést, když se k nim můžu přidat?"
 ach_coronation.0018.b.tt.gossip_with_servants: "Při klábosení se skvěle pobavíš"
 ach_coronation.0018.b.tt.secret_unknown_desc: "Tak #EMP tohle#! je šťavnaté"
 ach_coronation.0018.b.tt.secret_unknown: "Odhalíš [Concept('secret','tajemství')|E]"
 ach_coronation.0018.b.tt.secret: "Odhalíš [Concept('secret','tajemství')|E] [SECRET.GetName] postavy [secret_holder.GetFirstName]"
 ach_coronation.0018.c: "Tohle je skvělá příležitost něco se naučit!"
 ach_coronation.0018.c.flavor: "Z chyb služebnictva se toho dá hodně naučit."
 ach_coronation.0018.d: "Naštěstí je to problém [host.GetTitledFirstNameNoTooltip], ne můj."
 ach_coronation.0018.diplomacy_trait.tt: "Protože máš [Concept('traits','rysy')|E] [GetTrait('diplomat').GetName( GetNullCharacter )] nebo [GetTrait('gregarious').GetName( GetNullCharacter )], [servant_boss.GetTitledFirstNameNoTooltip] se neurazí"
 ach_coronation.0018.servant_boss_opinion.tt: "[servant_boss.GetTitledFirstNameNoTooltip] to může považovat za pokus připravit se o své místo"
 ach_coronation.0018.d.pleased_servant_boss: "[servant_boss.GetFirstNameNoTooltip] je [Select_CString(servant_boss.IsFemale,'vděčná','vděčný')] za tvou pomoc"
 ach_coronation.0018.d.annoyed_servant_boss: "[servant_boss.GetFirstNameNoTooltip] má pocit, že se snažíš připravit ho o místo"
 ach_coronation.0018.a.seneschal: "[host.GetTitledFirstNameNoTooltip] tě jmenuje do funkce [GetCourtPositionType('seneschal_court_position').GetName]"
 ach_coronation.0018.a.vassal: "[host.GetTitledFirstNameNoTooltip] ti nabídne [Concept('title','titul')|E]!"
 ach_coronation.0018.a.tt.vassal: "Bude ti nabídnut titul podle výběru [host.GetTitledFirstNamePossessive]"
 ach_can_refuse_reward: "Následující odměnu budeš moci odmítnout výměnou za [gold_i][host.MakeScope.ScriptValue('minor_gold_value')|0V] [Concept('gold','zlata')|E] nebo lepší vztahy s [host.GetShortUIName]:"
 ach_coronation.0019.opening: "[host.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ach_coronation.0019.desc: "Tvá pomoc zde v [host.GetCurrentLocation.Custom('GetCoronationSitePrefix')][host.GetCurrentLocation.Custom('GetCoronationSite')] nezůstala bez povšimnutí."
 ach_coronation.0019.desc.title: "Potřebuji vazaly, kterým mohu důvěřovat, a myslím, že [grantable_title.GetName] potřebuje nového vládce. Co říkáš?"
 ach_coronation.0019.desc.court_position: "[Select_CString(ROOT.Char.IsFemale,'Prokázala','Prokázal')] jsi, že jsi více než [Select_CString(ROOT.Char.IsFemale,'schopná','schopný')] [GetCourtPositionType('seneschal_court_position').GetName]. Co říkáš?"
 ach_coronation.0019.desc.praise: "[Select_CString(host.IsFemale,'Rozhodla','Rozhodl')] jsem se, že tě oficiálně pochválím před celým dvorem! Všichni se dozvědí o tvé píli!"
 ach_coronation.0019.a: "Přijímám!"
 ach_coronation.0019.b: "[Select_CString(ROOT.Char.IsFemale,'Doufala','Doufal')] jsem v něco trochu... hmotnějšího."
 ach_coronation.0019.c: "Stačí mi přátelství s [host.GetTitledFirstNameNoTooltip]!"
 your_title_cannot_be_revoked_10_tt: "Tvůj titul nebude možné po dobu 10 let odejmout."
 ach_coronation.0020.t: "Korunní [host.Custom2('RelationToMeShort', SCOPE.sC('helpful_family'))|U]"
 ach_coronation.0020.desc: "Zatímco mě plně zaměstnávají přípravy na mou korunovaci, [helpful_family.Custom2('MyCharacterIntroduction', ROOT.Char)] se skutečně [Select_CString(helpful_family.IsFemale,'chopila','chopil')] otěží! Už několik dní mě žádný sluha neobtěžoval malichernostmi a konečně se mohu soustředit na nadcházející obřad."
 ach_coronation.0020.a: "Právě [helpful_family.GetTitledFirstNameNoTooltip] by [Select_CString(helpful_family.IsFemale,'byla','byl')] vazalem, kterému mohu důvěřovat!"
 ach_coronation.0020.b: "#EMP Takhle#! se dělají věci v dynastii [host.GetDynastyNameNoTooltip]!"
 ach_coronation.0020.c: "[helpful_family.GetTitledFirstNameNoTooltip] se jako [host.Custom2('RelationToMeShort', SCOPE.sC('helpful_family'))] skutečně vyznamenává."
 ach_coronation.0020.d: "[helpful_family.GetTitledFirstNameNoTooltip] je vzorem pro všechny mé poddané."
 ach_coronation.0022.t: "Kašlající koruna"
 ach_coronation.0022.desc: "Obávaná [epidemic_scope.GetName] je poslední dobou na rtech všech, nejvíce však [zealot.GetFaith.AltPriestTermPlural] z [host.GetPrimaryTitle.GetTierAsName|l]. „Proč [zealot.GetFaith.GoodGodNames] tak trestá [host.GetPrimaryTitle.GetTierAsNameNoTooltip]?“ bědují někteří."
 ach_coronation.0022.desc.whisper.byzantine: "„Jak může [host.GetTitledFirstNameNoTooltip] tvrdit, že je [Glossary('pistos en Christôi Basileus','PISTOS_EN_CHRISTOI_BASILEUS_GLOSS')], když [host.GetFaith.HighGodName] sesílá takový trest?“"
 PISTOS_EN_CHRISTOI_BASILEUS_GLOSS: "Výraz znamenající „věrný Kristu, panovník“, který v Byzantské říši nahradil latinský titul „Augustus“."
 ach_coronation.0022.desc.whisper.hre: "„Jak se může [host.GetTitledFirstNameNoTooltip] v časech, jako jsou tyto, dovolávat [Glossary('sacra majestas','SACRA_MAJESTAS_GLOSS')]?“"
 SACRA_MAJESTAS_GLOSS: "Latinsky #BOL „posvátný majestát“#!, božské pověření, jehož se dovolávali císaři Svaté říše římské, aby ospravedlnili vládu nad svými poddanými nejen jako světští, ale také jako duchovní panovníci."
 ach_coronation.0022.desc.whisper.divine_right: "„Jak se může [host.GetTitledFirstNameNoTooltip] tváří v tvář takovým znamením dovolávat božského práva?“"
 ach_coronation.0022.desc.whisper.sinner: "„Je to snad důsledek zkaženosti [host.GetTitledFirstNameNoTooltip]?“"
 ach_coronation.0022.desc.whisper.fallback: "„Je [host.GetTitleAsNameNoTooltip] [Select_CString(host.IsFemale,'prokletá','prokletý')]?“"
 ach_coronation.0022.desc.ending: "ptají se další.\n\nZdá se však, že tyto obavy nejvíce doléhají na [zealot.GetTitledFirstName]. Celý den tráví v hluboce ustaraných modlitbách."
 ach_coronation.0022.a.coronation_disrupt_loyalists: "[zealot.GetShortUINameNoTooltip] přece musí vidět, kdo za to může?"
 ach_coronation.0022.a.coronation_disrupt_loyalists.flavor: "[zealot.GetShortUIName] má pravdu! [host.GetShortUIName] za to #EMP může#!!"
 ach_coronation.0022.a.coronation_disrupt_loyalists.failure: "[zealot.GetShortUIName] považuje tento rozhovor téměř za rouhání"
 ach_coronation.0022.a.coronation_disrupt_loyalists.success: "[zealot.GetTitledFirstNameNoTooltip] nabude přesvědčení, že za to může [host.GetShortUIName]"
 ach_coronation.0022.a.offer_support: "Okamžitě si s [zealot.GetTitledFirstNameNoTooltip] promluvím."
 ach_coronation.0022.a.offer_support.flavor: "[host.GetTitleAsName] by jistě [Select_CString(host.IsFemale,'ocenila','ocenil')] připomínku svého božského práva vládnout."
 ach_coronation.0022.a.offer_support.success: "[zealot.GetShortUIName] ti poděkuje za připomenutí povinnosti zachovat věrnost"
 ach_coronation.0022.a.offer_support.failure: "Víra [zealot.GetShortUIName] se zdá otřesenější než kdy dřív"
 ach_coronation.0022.b: "Pomodlím se s [zealot.GetTitledFirstNameNoTooltip]. Vždyť [zealot.GetFaith.GoodGodNames] nás oba přijímají jako [ROOT.Char.Custom('SisterBrother')]."
 ach_coronation.0022.c: "Stačilo by trochu postrčit a mnozí by souhlasili..."
 ach_coronation.0022.c.failure: "Tvé šťourání a naléhání začne lidi pořádně rozčilovat"
 ach_coronation.0022.c.success: "[GetVassalStance('zealot').GetTextIcon][GetVassalStance('zealot').GetName] frakce se obrátí proti [host.GetTitledFirstNameNoTooltip]"
 ach_coronation.0022.d: "Držet si odstup se zdá... rozumné."
 ach_coronation.0022.d.flavor: "V časech nákazy se vyplatí držet nepřátele daleko a přátele ještě dál"
 ach_coronation.0023.t: "[ROOT.Char.GetTitleAsNamePossessiveNoTooltip] [foreign_warrior.Custom('KnightCultureNoTooltip')]"
 ach_coronation.0023.desc: "Právě vítám řadu nově příchozích, když přede mě předstoupí cizinec s exotickou čepelí po boku. [foreign_warrior.GetTitledFirstNameNoTooltip] okamžitě klesne na kolena a okázalým gestem mi nabídne svůj meč.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip|U]! Dlouho jsem [Select_CString(foreign_warrior.IsFemale,'putovala','putoval')] cestami daleko od [foreign_ruler.GetCapitalLocation.GetName] a [Select_CString(foreign_warrior.IsFemale,'doslechla','doslechl')] jsem se, že hledáš věrné služebníky. Dovol mi získat slávu a sloužit ti stejně oddaně jako své víře. [foreign_warrior.GetFaith.HighGodName] je mi svědkem!“"
 ach_coronation.0023.desc.clergy.angry: "\n\n[clergy.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vrhne při zmínce o božstvu, které je [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)], spalující pohled."
 ach_coronation.0023.desc.clergy: "\n\nVidím, jak [clergy.Custom2('MyCharacterIntroduction', ROOT.Char)] při zmínce o božstvu, které je [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)], zvědavě pohlédne."
 ach_coronation.0023.a: "Tak #EMP tohle#! je [GetCourtPositionType('bodyguard_court_position').GetNameNoTooltip]!"
 ach_coronation.0023.b: "[foreign_warrior.GetTitledFirstNameNoTooltip] bude můj [GetCourtPositionType('champion_court_position').GetNameNoTooltip]!"
 ach_coronation.0023.c: "Vítej na mém dvoře!"
 ach_coronation.0023.d: "Okamžitě odveďte tu [foreign_warrior.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('GetUnbelieverTermAdjective', foreign_warrior)]!"
 cultural_acceptance_gain_accepted_foreign_warrior: "Přijetí cizího válečníka"
 ach_coronation.0025.t: "Pít a veselit se"
 ach_coronation.0025.desc: "Venku před hodovní síní si užívám čerstvého vzduchu a výhledu na [feast_location.GetBaronyNameExplicitly]. Z nedalekého křoví se ozývají milenci a nebezpečně blízko nich zvrací místní [ROOT.Char.Custom('KnightCultureNoTooltip')|l]. Nad tím vším se nesou zvuky oslav z [feast_location.GetTitle.Custom('BaronyTownType')].\n\nVtom mě něco napadne!"
 ach_coronation.0025.desc.host: "Stačilo by pár nocí pití zdarma a celé [feast_location.GetBaronyNameExplicitlyNoTooltip] by připíjelo na mé jméno. Jen musím najít obchodníka ochotného prodávat v tak pozdní hodinu..."
 ach_coronation.0025.desc.guest: "[host.GetTitledFirstName] by jistě [Select_CString(host.IsFemale,'ocenila','ocenil')], kdyby lidé provolávali jeho jméno, a obyvatelé [feast_location.GetTitle.Custom('BaronyTownType')] zase noc plnou pití zdarma."
 ach_coronation.0025.a: "[baron.Custom('RegionalAlcoholicDrink')] zaplatím ze svého!"
 ach_coronation.0025.b: "Co kdyby [Select_CString(baron.IsFemale,'přispěla','přispěl')] i [baron.GetTitledFirstName]?"
 ach_coronation.0025.b.flavor: "S pitím, které bychom společně obstarali, pozná [feast_location.GetName], co znamená #EMP pořádné#! veselí!"
 ach_coronation.0025.b.tt.success: "[baron.GetTitledFirstName] souhlasí. Ať proudí pití!"
 ach_coronation.0025.b.tt.failure: "[baron.GetTitledFirstName] nedokáže ocenit genialitu tvého nápadu"
 ach_coronation.0025.b.tt: "Buď máš rys [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] nebo [GetTrait('drunkard').GetName( GetNullCharacter )] a zároveň alespoň [gold_i][GetPlayer.MakeScope.ScriptValue('minor_gold_value')|0V] [Concept('gold','zlata')|E]"
 ach_coronation.0025.c: "Možná raději ne... aspoň zbude víc pro mě!"
 ach_coronation.0025.c.temperate: "K zábavě není třeba pít!"
 ach_coronation.0025.c.flavor: "Uvnitř čeká ještě spousta jiné zábavy"
 ach_coronation.0026.t: "Zlá znamení"
 ach_coronation.0026.desc: "Hostina pokračuje. Každý úder bubnů mi vysílá mráz po zádech a už jen pomyšlení na další [ROOT.Char.Custom('GetExpensiveDrink')] mi obrací žaludek. Kdyby se mi právě teď udělalo zle, náčelníci by to bezpochyby považovali za špatné znamení!\n\nJako na zavolanou ke mně přikráčí [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] s talířem jídla a pohárem čehosi odporného."
 ach_coronation.0026.a: "Musím vydržet!"
 ach_coronation.0026.a.tt: "Zatneš zuby a pokusíš se přečkat noc"
 ach_coronation.0026.a.tt.sick: "Cítíš, jak na tebe přichází horečka"
 ach_coronation.0026.a.tt.sick.failure: "Nedokážeš to skrýt"
 ach_coronation.0026.a.tt.sick.success: "Vydržíš"
 ach_coronation.0026.a.tt.critical_success: "[ROOT.Char.GetFaith.HighGodName] stojí při tobě! Nevolnost pomine"
 ach_coronation.0026.b: "[vassal.GetTitledFirstNameNoTooltip]! Pomoz mi!"
 ach_coronation.0026.b.tt: "[vassal.GetTitledFirstName] stráví zbytek hostiny tím, že ti pomůže skrývat nemoc"
 ach_coronation.0026.c: "Dost! Musím odejít a odpočinout si."
 ach_coronation.0026.c.flavor: "Opuštění vlastní hostiny nejspíš nebude přijato dobře"
 ach_coronation.0027.t: "Lahodná pochoutka"
 ach_coronation.0027.desc: "„[ROOT.Char.Custom2('RelationToMeAddress', partaker)|U]!“ začne [partaker.Custom2('MyCharacterIntroduction', ROOT.Char)], přičemž až k mému stolu jej provází nezaměnitelný pach. „Musíš poznat [stoner.GetFirstName], to je vskutku zajímavá společnost. [Select_CString(stoner.IsFemale,'Přivezla','Přivezl')]"
 ach_coronation.0027.desc.char.crusader: "z křížové výpravy lahodné exotické saracénské koláčky!“"
 ach_coronation.0027.desc.char.varangian: "ze svých výprav mezi [emperor_culture.GetCollectiveNoun] tyhle podivné koláčky!“"
 ach_coronation.0027.desc.char.other: "nádherně voňavé hašišové koláčky!“"
 ach_coronation.0027.a: "Vykoupím [stoner.GetTitledFirstNameNoTooltip] všechny zásoby!"
 ach_coronation.0027.b: "No, co by se mohlo stát?"
 ach_coronation.0027.b.hashishiyah: "[stoner.GetTitledFirstNameNoTooltip] zní jako někdo, kdo má vkus!"
 ach_coronation.0027.c: "Na #EMP mé#! korunovaci!? Ven!"
 ach_coronation.0027.d: "„Užij si to beze mě, [partaker.GetFirstNameNoTooltip].“"
 ach_coronation.0027.d.host: "Kdo umí hostit, nechá dost i pro své hosty!"
 purchased_hashish_opinion: "Zakoupení hašiše"
 ach_coronation.0028.t: "Legitimní opojení"
 ach_coronation.0028.desc: "„[ROOT.Char.GetFirstName]!“ vykřikne přes celou síň [drinker.Custom2('MyCharacterIntroduction', ROOT.Char)] tak hlasitě, že hlas pronikne i hlukem korunovačních oslav. „Myslíš, že s novou korunou jsi tak [Select_CString(ROOT.Char.IsFemale,'mocná','mocný')]!? [drinker.GetFaith.HighGodName] je mi svědkem, pij! Dokaž, že jsi [Select_CString(ROOT.Char.IsFemale,'hodna','hoden')] titulu [ROOT.Char.GetTitleAsNameNoTooltip]!“\n\nMnoho očekávajících pohledů se obrátí ke mně a dychtivě čeká na odpověď."
 ach_coronation.0028.a: "[drinker.GetTitledFirstNameNoTooltip] konečně [Select_CString(drinker.IsFemale,'narazila','narazil')] na sobě rovného soupeře!"
 ach_coronation.0028.a.win: "[drinker.GetFirstNameNoTooltip] odpadne pod stůl dřív než ty!"
 ach_coronation.0028.a.lose: "Nestačíš držet krok"
 ach_coronation.0028.b.win: "[drinker.GetFirstNameNoTooltip] [Select_CString(drinker.IsFemale,'neměla','neměl')] nejmenší šanci"
 ach_coronation.0028.b.lose: "Tvůj podvod je odhalen!"
 ach_coronation.0028.b: "Kdyby se mi podařilo něco přimíchat do poháru [drinker.GetTitledFirstNameNoTooltip]..."
 ach_coronation.0028.c: "To sotva."
 ach_coronation.0029.t: "[ROOT.Char.GetTitleAsNameNoTooltip] vyráží na hon"
 ach_coronation.0029.desc: "[ROOT.Char.Custom('FunFoodPrefix')|U] pečená [ROOT.Char.Custom('GetFoodBird')] je znamenitá, ale příběhy, které si vyprávíme, jsou ještě lepší! [first.Custom2('MyCharacterIntroduction', ROOT.Char)|U], [second.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second'))], a já už celé hodiny soupeříme v líčení našich nejlepších lovů.\n\n„Dost!“ vykřikne [first.GetTitledFirstNameNoTooltip]. „Teď už máš korunu, takže po hostině můžeš uspořádat hon! Ať všichni vidí, jak loví [Select_CString(ROOT.Char.IsFemale,'nová','nový')] [ROOT.Char.GetTitleAsNameNoTooltip|l]!“\n\n„Ano!“ [second.GetFirstNameNoTooltip] dychtivě přikývne. „[ROOT.Char.GetTitleAsNameNoTooltip|U] vyráží na hon... z toho bude událost!“"
 ach_coronation.0029.a: "Ano! [ROOT.Char.GetTitleAsNameNoTooltip|U] vyráží na hon!"
 ach_coronation.0029.a.flavor.impress_attendees: "A vy zajistíte, aby se o něm doslechlo celé [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 ach_coronation.0029.a.flavor.embrace_supporters: "Stmelí mě s mými podporovateli!"
