l_polish:
 feast_default_alex.100.t: "Společné vzpomínky"
 feast_default_alex.100.desc: "[guest.GetTitledFirstName], [root_scope.Custom2('RelationToMeShort', SCOPE.sC('guest'))], [guest.Custom('quirk_pos_present')] a přisune se ke mně.\n\n„[guest.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|U]! [root_scope.Custom('ComplimentAdjective')]! Tolik jsme toho spolu zažili! Tolik vzpomínek!“ [guest.GetTitledFirstNameNoTooltip] se zasměje. „Jako vždy je radost být po tvém boku.“\n\n„Ach, ano!“ nadšeně se vloží do hovoru opodál stojící [other_guest.GetTitledFirstName]. „Lidé si dodnes vyprávějí, jak [guest_memory.GetThirdPerspectiveDescription]!“"
 feast_default_alex.100.aa: "„Nevzpomínám si na nic významného.“"
 feast_default_alex.100.a: "„Ať nás čeká ještě mnoho krásných vzpomínek, [guest.GetFirstNameNoTooltip].“"
 feast_default_alex.100.b: "„Ach, to byl vskutku #EMP nádherný#! den!“"
 feast_default_alex.200.t: "Mor zvěstí"
 feast_default_alex.200.desc: "„[guest.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|U], doslechly se ke mně zvěsti o nákaze zvané [epidemic.GetName]...“ říká ustaraně [guest.GetTitledFirstName].\n\n„Prý řádí v [afflicted_top_liege.GetPrimaryTitle.GetBaseName] a její oběti [sick_peasant.Custom('disease_desc_short')]... ani [root_scope.Custom('GetExpensiveMeal')] mi ji nedokáže vyhnat z hlavy.“"
 feast_default_alex.200.a: "Hm, měli bychom připravit [root_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]..."
 feast_default_alex.200.b: "Pojď sem, uklidni se."
 feast_default_alex.200.c: "Pomodleme se za [afflicted_top_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 feast_default_alex.200.d: "Neboj se, sem se nikdy nedostane!"
 plague_preparations_modifier: "Přípravy na nákazu"
 plague_preparations_modifier_desc: "Toto místo je dobře připraveno na případnou nákazu."
