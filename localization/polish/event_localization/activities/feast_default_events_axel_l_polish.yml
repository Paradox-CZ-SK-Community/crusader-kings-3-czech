l_polish:
 feast_default_axel.1001.t: "Pošetilost mládí"
 feast_default_axel.1001.desc: "„Já... #EMP ŠKYT#!... přísahám, že právě tady má náš dobrý [ROOT.Char.GetTitleAsNameNoTooltip] schované nejlepší pití,“ zaslechnu [youngster_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('youngster_1'))], jak říká [youngster_2.GetTitledFirstName], zatímco mi plení vinný sklep.\n\nJe zřejmé, že tihle dva v sobě našli spřízněné duše a společně zneužívají mé pohostinnosti."
 feast_default_axel.1001.a: "K jejich smůle už jsou zásoby prázdné."
 feast_default_axel.1001.b: "Pojďte, něco vám ukážu..."
 feast_default_axel.1001.c: "Vypadněte, nebo vás nechám zbičovat!"
 drunk_high_spirits: "Opilecké rozjaření"
 drunk_high_spirits_desc: "Tato postava to přehání s pitím a vyprazdňuje každou zásobu alkoholu, kterou najde."
 bad_influence_modifier: "Špatný vliv"
 bad_influence_modifier_desc: "Tato postava je známá jako prohnaný ničema, který často svádí ostatní na scestí."
