l_polish:
 feast_default_jason.100.t: "Válečné radovánky"
 feast_default_jason.100.desc: "„Máme si dělat starosti,“ ptá se můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('soldier'))], [soldier.GetFirstName], „o [ROOT.Char.GetPrimaryTitle.GetAdjective] stranu ve válce [war.GetName]...? Kolem tohoto stolu vidím samé zasmušilé tváře, jako by armády [foe.GetTitledFirstNamePossessive] z [foe.GetPrimaryTitle.GetAdjective] zemí už stály přede dveřmi!“\n\n„Na své vojsko v [army_location.GetTerrain.GetNameNoTooltip|l] u [army_location.GetName] nemysli tolik, vždyť jsi [ROOT.Char.GetTitleAsName],“ usměje se [other_ruler.GetFirstName], [other_ruler.GetTitleAsNameNoTooltip] z [other_ruler.GetPrimaryTitle.GetNameNoTier]. „Štěstí si k němu jistě najde cestu.“"
 feast_default_jason.100.a: "„A jaké větší štěstí by mě mohlo potkat... než tvá pomoc?“"
 feast_default_jason.100.b: "„Pamatujte si má slova, mé vítězství je jisté!“"
 feast_default_jason.100.c: "Pijme, dokud se svět nerozplyne..."
 feast_default_jason.100.c_hungee: "Ty ustarané huby by se měly raději nacpat jídlem."
 boasted_of_victories_modifier: "Vychloubání se jistým vítězstvím"
 victories_reduce_stress_add_prestige_desc: "Vítězství v [Concept('battles','bitvách')|E] snižují @stress_icon![Concept('stress','stres')|E] a poskytují @prestige_icon![Concept('prestige','prestiž')|E], zatímco porážky zvyšují @stress_icon![Concept('stress','stres')|E] a stojí @prestige_icon![Concept('prestige','prestiž')|E]"
 victories_reduce_stress_add_prestige_tt: "Dokud je tento [Concept('modifier','modifikátor')|E] aktivní, za vítězství v [Concept('battles','bitvách')|E] získáš @prestige_icon![Concept('prestige','prestiž')|E] a ztratíš @stress_icon![Concept('stress','stres')|E], zatímco porážky tě budou stát @prestige_icon![Concept('prestige','prestiž')|E] a zvýší @stress_icon![Concept('stress','stres')|E]"
 feast_default_jason.100.b_exalt_the_crown: "#low Doba trvání [Concept('modifier','modifikátoru')|E] je prodloužena díky tvému [Concept('intent','záměru')|e] [THIS.Char.GetInvolvedActivityIntent.GetName]#!"