l_polish:
 feast_default_joe.1010.t: "Splétání sítí"
 feast_default_joe.1010.desc: "Když se na jednom místě sejde tolik mocných lidí, i pár nenápadně pronesených slov může mít dalekosáhlé důsledky...\n\nMezi nimi je i [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('agent'))], a zdá se, že pro mé záměry má obzvláštní pochopení."
 feast_default_joe.1010.a: "Z mnoha semen může vzejít bohatá úroda, pokud se o ně správně pečuje..."
 feast_default_joe.1010.a.trigger: "Máš rys [GetTrait('schemer').GetName( GetNullCharacter )] nebo alespoň [SCOPE.ScriptValue('decent_skill_rating')|0V] [Concept('intrigue','pletichářství')|E]"
 feast_default_joe.1010.b: "Zdá se, že [agent.GetTitledFirstNameNoTooltip] se přidá bez velkého přesvědčování."
 feast_default_joe.1010.c: "Kde se sejdou lidé, tam se vždy najde spousta příležitostí."
 feast_default_joe.1010.d: "Mé plány do sebe zapadají. Stačí jen trpělivost."
 agent_more_likely_join_scheme_tt: "Po dobu 6 měsíců se [agent.GetShortUINamePossessive|E] ochota připojit k tvé [Concept('scheme','intrice')|E] [scheme.GetName|V], jejímž cílem je [scheme.GetTargetCharacter.GetShortUIName], zvýší: #P +25#!"
 all_guests_agent_more_likely_join_scheme_tt: "Po dobu 6 měsíců se ochota všech způsobilých účastníků [activity.GetName] připojit k tvé [Concept('scheme','intrice')|E] [scheme.GetName|V], jejímž cílem je [scheme.GetTargetCharacter.GetShortUIName], zvýší: #P +25#!"
 agent_more_likely_join_scheme_reason: "Události: $VALUE|=+0$"
