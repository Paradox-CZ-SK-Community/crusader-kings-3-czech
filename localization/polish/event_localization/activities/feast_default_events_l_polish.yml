l_polish:
 feast_header: "Hostina:"
 feast_default.1001.t: "V úžasu"
 feast_default.1001.very_high_learning: "Po dlouhém rozhovoru nad lahodnými pokrmy mi [impressed_guest.GetTitledFirstName] [Select_CString(impressed_guest.IsFemale,'sdělí','sdělí')], že mě považuje za mimořádně [Select_CString(ROOT.Char.IsFemale,'učenou a moudrou','učeného a moudrého')] a že má slova mají pro méně sečtělé lidi nedocenitelnou hodnotu."
 feast_default.1001.high_learning: "Po dlouhém rozhovoru během jídla mi [impressed_guest.GetTitledFirstName] řekne, jak obdivuje mou schopnost dlouze rozmlouvat prakticky o čemkoli."
 feast_default.1001.average_learning: "Po chvíli hovoru u večeře se ke mně [impressed_guest.GetTitledFirstName] nakloní a řekne mi, jak působivé je, kolik toho vím o tolika různých věcech."
 feast_default.1001.low_learning: "Zatímco si při večeři povídám s ostatními, [impressed_guest.GetTitledFirstName] se ke mně nakloní. „Kéž bych [Select_CString(impressed_guest.IsFemale,'uměla','uměl')] znít tak chytře jako ty, [ROOT.Char.GetTitledFirstName]!“\n\nOtřu si polévku z brady a nasadím inteligentně vyhlížející úsměv."
 feast_default.1001.a: "Vidím, že pravý intelekt dokáže ocenit."
 feast_default.1002.t: "Nesnesitelné čekání"
 feast_default.1002.desc: "Nemohu uvěřit, jak dlouho už čekáme na jídlo! Jsme tu snad proto, abychom jedli, nebo obdivovali kresbu dřeva na stole? Na co tak zíráš, [other_guest.GetTitledFirstName]? Mám prostě strašný hlad!"
 feast_default.1002.a: "Dokonce už ho cítím z kuchyně!"
 feast_default.1002.gluttons_and_impatients: "Všichni netrpěliví a obžerní hosté"
 feast_default.1003.t: "V úžasu"
 feast_default.1003.desc: "Po nějaké době společného hodování jsem [Select_CString(ROOT.Char.IsFemale,'musela říct','musel říct')] něco mimořádně chytrého, protože mě [other_guest.GetTitledFirstName] [Select_CString(other_guest.IsFemale,'pochválila','pochválil')], jak jsem [Select_CString(ROOT.Char.IsFemale,'chytrá','chytrý')]!\n\nNa oplátku se na svého učeného druha inteligentně usměji, než mou pozornost znovu upoutá mastnota stékající mi po bradě."
 feast_default.1003.a: "Občas ze mě opravdu vypadne něco chytrého."
 feast_default.1003.b: "Netušil[Select_CString(ROOT.Char.IsFemale,'a jsem',' jsem')], že to [other_guest.GetFirstNameNoTooltip] vidí právě takhle!"
 feast_default.1004.t: "Nebeské pochoutky"
 feast_default.1004.desc_exotic: "Ach, co je tohle za jídlo, že má tak bohatou chuť? Nikdy předtím jsem nic tak neuvěřitelně exotického neviděl[Select_CString(ROOT.Char.IsFemale,'a ani neochutnala',' ani neochutnal')]! A ty nádherně opulentní sladkosti!\n\nNa téhle hostině jsou neuvěřitelné pokrmy, jaké jsem ještě nikdy neochutnal[Select_CString(ROOT.Char.IsFemale,'a','')], a obávám se, že už ani nikdy neochutnám. Musím zjistit, odkud pocházejí!"
 feast_default.1004.desc_lavish: "To je ale nekonečná záplava jídel a moučníků! Nabízí snad [ROOT.Char.GetFaith.PositiveAfterLife] právě takové hostiny? A ten ohromný výběr sladkostí!\n\nNikdy jsem neviděl[Select_CString(ROOT.Char.IsFemale,'a','')] tolik jídla pohromadě!"
 feast_default.1004.desc_meager: "Co to má být? Je na té kosti vůbec nějaké maso? Jedí lidé běžně takhle malou zeleninu? Nabízí snad [ROOT.Char.GetFaith.NegativeAfterLife] právě takové pokrmy? A kde jsou sladkosti?\n\nTakhle snad jedí jen sedláci!"
 feast_default.1004.desc: "Ach, co je tohle za maso, že má tak bohatou chuť? A co je to za zeleninu, skoro až sladkou? A ty nádherné malé moučníky!\n\nNa téhle hostině je jedno z nejlepších jídel, jaké jsem kdy ochutnal[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 feast_default.1004.a: "Nádhera!"
 feast_default.1004.a_meager: "Ubohé!"
 feast_default.1004.b: "To je úžasné! Ještě jednu porci!"
 feast_default.1004.b_meager: "To je všechno? Bude nášup?"
 feast_default.1005.t: "Osamění"
 feast_default.1005.desc: "Je toho na mě příliš. Neustálé žvanění lidí kolem, všechny ty tváře, které ode mě očekávají rozhovor... #EMP Lidé#!...\n\n[Select_CString(ROOT.Char.IsFemale,'Věděla jsem','Věděl jsem')], že tahle hostina bude utrpení, ale netušil[Select_CString(ROOT.Char.IsFemale,'a jsem',' jsem')], jak velké."
 feast_default.1005.desc_friendly_guest: "\n\nAlespoň mám štěstí, že je tu [friendly_guest.Custom2('MyCharacterIntroduction', ROOT.Char )]."
 feast_default.1005.a: "Někde přece musí být místo, kde budu o samotě."
 feast_default.1005.b: "[friendly_guest.GetFirstNameNoTooltip], nenechávej mě s těmi bestiemi samotn[Select_CString(ROOT.Char.IsFemale,'ou','ého')]!"
 feast_default.1005.c: "„Eh, já... já... Máme ale strašné počasí, že?“"
 feast_default.1006.table_companions: "Všichni, kdo sedí poblíž mě"
 feast_default.1006.t: "Jako doma"
 feast_default.1006.desc: "Ach, hostině se nic nevyrovná! Připomíná nám všechno dobré, co život nabízí, a ani společnost není vůbec špatná! Alespoň ti, kdo sedí poblíž mě, si to očividně myslí také.\n\n„Ty jsi opravdu něco zvláštního, [ROOT.Char.GetFirstNameNoTooltip],“ řekne mi [guest_1.GetTitledFirstName]. [guest_2.GetTitledFirstName] a [guest_3.GetTitledFirstName] souhlasně přikývnou."
 feast_default.1006.a: "Prostě dělám to, co mi připadá správné!"
 feast_default.1006.b: "Ještě jednu rundu pro všechny!"
 feast_default.1006.c: "Jinak se skutečně žít nedá, přátelé!"
 feast_default.1007.t: "Nenasytní"
 feast_default.1007.desc: "Pokrmy přicházejí jeden za druhým a většina hostů už pro dnešek vzdala další jídlo a pouze si užívá zábavu. S radostí vidím, že [other_glutton.GetTitledFirstName] má víc rozumu!\n\nDokud bude na stole jídlo, oba ho budeme dychtivě ochutnávat!"
 feast_default.1007.a: "Společně bychom snědli celého koně!"
 feast_default.1007.b: "Vsadím se, že [other_glutton.GetFirstNameNoTooltip] přejím."
 feast_default.1008.t: "Zamlžený úsudek"
 feast_default.1008.desc: "Když se [secret_recipient.GetTitledFirstName] při mých slovech rozšíří oči, dojde mi, co jsem právě [Select_CString(ROOT.Char.IsFemale,'přiznala','přiznal')]. S námahou odstrčím svůj pohár.\n\n„Přehnal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem to s pitím.“ Pokusím se vstát a trochu se přitom zakymácím. „Nevěř ani slovu z toho, co říkám!“"
 feast_default.1008.a: "[Select_CString(ROOT.Char.IsFemale,'Co jsem to provedla...','Co jsem to provedl...')]"
 feast_default.1008.a.flavor: "#F [secret_recipient.GetFirstNameNoTooltip] mým výmluvám nevěří...#!"
 feast_default.1009.t: "Zamlžený úsudek"
 feast_default.1009.desc: "Když se [secret_recipient.GetTitledFirstName] při mých slovech rozšíří oči, dojde mi, co jsem právě [Select_CString(ROOT.Char.IsFemale,'prozradila','prozradil')] o [secret_owner.GetTitledFirstName]. S námahou odstrčím svůj pohár.\n\n„Přehnal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem to s pitím.“ Pokusím se vstát a trochu se přitom zakymácím. „Nevěř ani slovu z toho, co říkám!“"
 feast_default.1009.a: "[Select_CString(ROOT.Char.IsFemale,'Co jsem to provedla...','Co jsem to provedl...')]"
 feast_default.1010.t: "Nečekaná přísaha"
 feast_default.1010.desc: "Co jsem to včera večer [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')]? Už si nevzpomínám, co tomu předcházelo, ale pamatuji si, jak jsem [favor_recipient.Custom2('MyCharacterIntroduction', ROOT.Char )] plácl[Select_CString(ROOT.Char.IsFemale,'a','')] po zádech a [Select_CString(favor_recipient.IsFemale,'řekla jí','řekl mu')], že udělám cokoli, o co mě požádá.\n\nTeď se všude šíří zvěsti o „přísaze“, kterou jsem údajně [Select_CString(ROOT.Char.IsFemale,'složila','složil')]!"
 feast_default.1010.a: "Slib je slib, ať se děje cokoli."
 feast_default.1010.b: "Byly to jen opilecké řeči!"
 feast_default.1010.every_participant_with_high_opinion: "Každý další účastník, který si [favor_recipient.GetFirstNameNoTooltip] váží"
 feast_default.1011.t: "Na válečné stezce"
 feast_default.1011.desc: "Je to opojné. Alkohol v krvi a hněv v žilách.\n\nMůj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] [guest_to_murder.GetTitledFirstName] do mě venku před sálem vrazí a já si [Select_CString(guest_to_murder.IsFemale,'ji','ho')] spletu s [disliked_guest.Custom2('InsultAdjective', ROOT.Char)] [disliked_guest.GetTitledFirstName]. V jediném okamžiku už krev [guest_to_murder.GetTitledFirstNameNoTooltip] stéká po mé čepeli. Když se tělo [guest_to_murder.GetTitledFirstNameNoTooltip] sesune k zemi, rázem vystřízlivím."
 feast_default.1011.a: "[Select_CString(guest_to_murder.IsFemale,'Sama naběhla','Sám naběhl')] na můj nůž! Přísahám!"
 feast_default.1011.a.success: "Lidé uvěří, že šlo o nehodu"
 feast_default.1011.a.failure: "Lidé tvé lži neuvěří"
 feast_default.1011.b: "Já... já musím očistit čepel...!"
 feast_default.1011.b.success: "Vražda zůstane záhadou"
 feast_default.1011.b.failure: "[Select_CString(ROOT.Char.IsFemale,'Jsi odhalena jako vražedkyně','Jsi odhalen jako vrah')]"
 feast_default.1011.c: "[disliked_guest.GetTitledFirstNameNoTooltip], jak jsi mohl[Select_CString(disliked_guest.IsFemale,'a','')]?!"
 feast_default.1012.t: "Smrtící mok"
 feast_default.1012.desc_opening: "Můj [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest_to_murder'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] [guest_to_murder.GetTitledFirstName] s radostí přijímá další pohár, takže šplouchnutí mého vlastního nápoje, který vylévám na podlahu, zanikne bez povšimnutí.\n\nJak se [guest_to_murder.GetTitledFirstNameNoTooltip] začíná namáhavě dýchat a z tváře [Select_CString(guest_to_murder.IsFemale,'jí','mu')] mizí všechna barva, cítím, jak se mi na tváři rozlévá úsměv. Když tělo [guest_to_murder.GetTitledFirstNameNoTooltip] dopadne na stůl, unikne mi tichý smích."
 feast_default.1012.a: "Přípitek na [guest_to_murder.GetTitleTierName|U] a [Select_CString(guest_to_murder.IsFemale,'její','jeho')] žízeň po životě!"
 feast_default.1013.t: "Ochránce"
 feast_default.1013.desc: "Když se můj [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('guest_to_kill'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_kill'))] [guest_to_kill.GetTitledFirstName] s hněvem v očích a nožem v ruce žene k mému [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_save'))] [guest_to_save.GetTitledFirstName], ani na okamžik nezaváhám.\n\nPopadnu nejbližší věc, kterou lze použít jako zbraň, a vrhnu se vpřed."
 feast_default.1013.a: "Kdo by řekl, že příbor může být tak ostrý?"
 feast_default.1013.a_1: "Doufám, že [ROOT.Char.GetFaith.NegativeAfterLife] přivítá toho [guest_to_kill.Custom2('InsultAdjective', ROOT.Char)] [guest_to_kill.Custom2('InsultNoun', ROOT.Char)] s otevřenou náručí."
 feast_default.1013.b: "Ten nůž odrazím!"
 feast_default.1013.b.success: "Nikdo nebude zraněn"
 feast_default.1013.b.failure: "#EMP Téměř#! se mi to podaří"
 feast_default.1013.b.big_failure: "Selžu"
 feast_default.1013.c: "...a rovnou se vrhnu do bezpečí."
 feast_default.1013.d: "„[Select_CString(ROOT.Char.IsFemale,'Jednala','Jednal')] jsem na obranu [guest_to_save.GetFirstNameNoTooltip], všichni jste to viděli.“"
 feast_default.1014.t: "Svědek"
 feast_default.1014.desc: "Můj [guest_to_murder.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_murder'))] [guest_to_murder.GetTitledFirstName] se ušklíbne, když se vypotácím ven hledat místo, kde bych si mohl[Select_CString(ROOT.Char.IsFemale,'a','')] odskočit. Hněv, který už ve mně vře, nabere ničivou sílu, když se ke mně [guest_to_murder.GetTitledFirstNameNoTooltip] přiblíží. „Podívejme, kdo to je! Ten [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('guest_to_murder'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('guest_to_murder'))] [ROOT.Char.GetFirstNameNoTooltip]! Vsadím se, že...“\n\nPrávě když zabodnu čepel do rozčilující tváře [guest_to_murder.GetFirstNameNoTooltip], zaslechnu za sebou tiché zalapání po dechu."
 feast_default.1014.a: "Prosím, [witness.GetTitledFirstNameNoTooltip], nikomu to neříkej!"
 feast_default.1014.a_2: "O tom, cos viděl[Select_CString(witness.IsFemale,'a','')], nikomu neřekneš."
 feast_default.1014.b: "Ve špatný čas na špatném místě!"
 feast_default.1016.t: "Lesklé cetky"
 feast_default.1016.desc_intro: "Rozhlédnu se po živém sále. Ohně plápolají, pití proudí proudem. Do každé volné ruky se tlačí lahodné pochoutky a nálada je výborná.\n\nV temném koutě zachytí mihotavé světlo [trinket_to_steal.GetName]. Leží opuštěně na jednom z postranních stolků a přímo mě volá."
 feast_default.1016.desc_greedy: "\n\nByl by skoro zločin #EMP nezbavit#! tu cetku její samoty! Rychle se rozhlédnu po sále, zda mě nikdo nesleduje."
 feast_default.1016.desc_hesitant: "\n\nPevně sevřu pěst a snažím se ovládnout své nutkání v naději, že si toho nikdo nevšimne."
 feast_default.1016.desc_default: "\n\n[activity.GetOwner.GetTitledFirstNameNoTooltip] se očividně má dobře. Taková drobná cetka přece nemůže chybět..."
 feast_default.1016.a_greedy: "Tak když nabízíš..."
 feast_default.1016.a_hesitant: "Nemohu si pomoct..."
 feast_default.1016.a: "Tohle je #EMP opravdu#! pěkná cetka."
 feast_default.1016.b: "Ne. Tohle není správné."
 feast_default_1016_stealth.desc: "Tvé zlodějství zůstalo nepovšimnuto"
 feast_default_1016_observed.desc: "Někdo tě viděl"
 feast_default.1016.tt: "Cetka ukradena"
 feast_default.1017.t: "Co se skrývá ve stínu"
 feast_default.1017.desc_intro: "Pomalu se přibližuji k postrannímu stolku a cestou dál nenuceně rozmlouvám s hosty, které míjím.\nJakmile se dostanu k [new_trinket.GetName], jediným rychlým, ale opatrným pohybem posunu předmět k okraji stolu a nechám jej sklouznout do připraveného ubrousku. Úspěch!"
 feast_default.1017.desc_discovered: "\n\nAdrenalin mi proudí žilami, ale... nemohu se zbavit nepříjemného pocitu, že jsem nebyl[Select_CString(ROOT.Char.IsFemale,'a jediná, kdo mou krádež viděl',' jediný, kdo mou krádež viděl')].\n\nČas ukáže..."
 feast_default.1017.desc_stealth: "\n\nTen příval adrenalinu, tlukot srdce v hrudi a sladká chuť vítězství po úspěšné krádeži.\n\nV tuhle chvíli skutečně na ničem jiném nezáleží."
 feast_default.1017.a: "Tohle není dobré."
 feast_default.1017.b: "To je skvělé!"
 feast_default.1017.b_honest: "Doufám, že se to nikdo nedozví..."
 feast_default.1018.t: "...vyjde najevo"
 feast_default.1018.desc_intro: "Zničehonic se u mých dveří objeví [Select_CString(witness_proxy.IsFemale,'vyslankyně','vyslanec')] [witness.GetTitledFirstName], [witness_proxy.GetTitledFirstName]. „Zdravím, [ROOT.Char.Custom('FormOfAddressForLiege')]! Přináším zprávu od [witness.GetTitledFirstNameNoTooltip].“\n\n[witness_proxy.GetTitledFirstNameNoTooltip] působí poněkud nesvůj. „[witness.GetTitledFirstNameNoTooltip] se doslechl[Select_CString(witness.IsFemale,'a','')], že [feast_host.GetTitledFirstName] hledá [trinket_to_steal.GetName] a...“ [witness_proxy.GetTitledFirstNameNoTooltip] se na okamžik odmlčí. „Zdá se, že [witness.GetTitledFirstNameNoTooltip] má za to, že jsi ten předmět mohl[Select_CString(ROOT.Char.IsFemale,'a','')] během hostiny zahlédnout?“ [witness_proxy.GetTitledFirstNameNoTooltip] si mě přeměří od hlavy k patě."
 feast_default.1018.desc_greedy: "\n\nJak se [witness.GetTitledFirstNameNoTooltip] opovažuje! Nehty se mi zarývají do dlaní a já se tváří v tvář těmto obviněním ze všech sil snažím zachovat klid a chladnou hlavu."
 feast_default.1018.desc_default: "\n\nSrdce mi buší až v uších a po zádech mi stéká pramínek potu. Taková je cena za ten sladký, sladký okamžik, kdy se mi něco podaří získat."
 feast_default.1018.a: "Mám tu měšec, který by možná mohl pomoci."
 feast_default.1018.a_contempt: "Vezmi si tenhle měšec a zmiz!"
 feast_default.1018.a_tt: "[witness.GetTitledFirstNameNoTooltip] by si to měl[Select_CString(witness.IsFemale,'a nechat',' nechat')] pro sebe!"
 feast_default.1018.b: "Ta stará věc? Nikdy jsem ji neviděl[Select_CString(ROOT.Char.IsFemale,'a','')]."
 feast_default.1018.b_contempt: "Ta stará věc? Nikdy. Jsem. Ji. Neviděl[Select_CString(ROOT.Char.IsFemale,'a','')]."
 feast_default_1018_success.desc: "[witness.GetTitledFirstNameNoTooltip] je [Select_CString(witness.IsFemale,'přesvědčena','přesvědčen')]"
 feast_default_1018_failure.desc: "[witness.GetTitledFirstNameNoTooltip] není [Select_CString(witness.IsFemale,'přesvědčena','přesvědčen')]"
 feast_default_1018_success.t: "Úspěšné přesvědčování"
 feast_default_1018_failure.t: "Neúspěšné přesvědčování"
 feast_default.1018.c: "Zahlédl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem ho... #EMP a taky se ho dotkl[Select_CString(ROOT.Char.IsFemale,'a','')]#!"
 feast_default.1019.t: "Omluva"
 feast_default.1019_start: "Když vstoupím do komnat [feast_host.GetTitledFirstNameNoTooltip], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))] se na mě podívá"
 feast_default.1019.desc_intro_redeemed: "$feast_default.1019_start$ zklamaně.\n\n„Přiznávám, že tohle jsem nečekal[Select_CString(feast_host.IsFemale,'a','')]. Že právě můj [feast_host.Custom2('RelationToMe', ROOT.Char)] podlehne tak hanebnému chování... To tě jistě tíží. Cením si tvého přiznání. Je to první krok k nápravě.“"
 feast_default.1019.desc_intro_condemned: "$feast_default.1019_start$ nesouhlasně.\n\n„My dva jsme si nikdy příliš nerozuměli. Ale že právě můj [feast_host.Custom2('RelationToMe', ROOT.Char)] klesne k takové věci, jako je obyčejná krádež... To je #EMP nanejvýš#! trapné a zároveň zavrženíhodné. Musíš se polepšit.“"
 feast_default.1019.desc_redemption_greedy: "\n\nPřistoupím na celé tohle divadlo, protože moc dobře vím, že druhá možnost by byla mnohem horší. Alespoň jsem tentokrát z potíží venku."
 feast_default.1019.desc_condemnation_greedy: "\n\nS vypětím všech sil se ovládnu, sklopím před [feast_host.GetTitledFirstName] zrak k zemi a přikývnu. Ano. #EMP Příště se polepším.#!"
 feast_default.1019.desc_redemption: "\n\nNad vlastním chováním se propadám hanbou a za shovívavou reakci [feast_host.GetTitledFirstName] na mou prosbu cítím skutečnou vděčnost. Jako by mi ze srdce spadl kámen."
 feast_default.1019.desc_condemnation: "\n\nTváře mi hoří hanbou a vlastní chování se mi hnusí. Ať už mě to popadlo z jakéhokoli důvodu, teď za to nesu následky."
 feast_default.1019.a: "...možná bych si měl[Select_CString(ROOT.Char.IsFemale,'a ponechat',' ponechat')] ten předmět jako připomínku svých chyb?"
 feast_default.1019.a_tt: "Pokusíš se ponechat si [trinket_to_steal.GetName]"
 feast_default.1019.b: "Nežádám o nic jiného než o odpuštění, můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))]."
 feast_default_1019_success.desc: "[feast_host.GetTitledFirstNameNoTooltip] je [Select_CString(feast_host.IsFemale,'přesvědčena','přesvědčen')]"
 feast_default_1019_failure.desc: "[feast_host.GetTitledFirstNameNoTooltip] není [Select_CString(feast_host.IsFemale,'přesvědčena','přesvědčen')]"
