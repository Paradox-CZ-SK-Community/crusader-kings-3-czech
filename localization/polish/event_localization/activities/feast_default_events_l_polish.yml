 feast_default_1019_condemned.t: "Odsouzení"
 feast_default.1020.t: "Nehoda"
 feast_default.1020.desc: "Když se procházím síněmi svého opovrženíhodného [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_host'))], [feast_host.GetTitledFirstNameNoTooltip], prohlížím si vystavenou sbírku artefaktů. Taková okázalost... možná by [feast_host.GetTitledFirstNameNoTooltip] potřeboval[Select_CString(feast_host.IsFemale,'a','')] trochu srazit hřebínek.\n\nMůj pohled ulpí na [feast_target_artifact.GetName]."
 feast_default.1020.a_knock_over: "Možná ho #EMP náhodou#! převrhnu..."
 feast_default.1020.a_scratch: "Pořádně ho poškrábu..."
 feast_default.1020.a_drunkard: "Mohl[Select_CString(ROOT.Char.IsFemale,'a','')] bych ho polít svým [ROOT.Char.Custom('RegionalDrink')]..."
 feast_default.1020.a_lustful: "#EMP Strašně#! toužím ho úplně zohavit..."
 feast_default.1020.a.tt_success: "Nezpozorovaně poškodíš artefakt"
 feast_default.1020.a.tt_fined: "[feast_host.GetTitledFirstNameNoTooltip] ti za tvůj čin uloží pokutu"
 feast_default.1020.a.tt_imprisoned: "[feast_host.GetTitledFirstNameNoTooltip] se ti pomstí"
 feast_default.1020.b: "Ne, raději to nebudu riskovat."
 feast_default.1020.tt: "Artefakt poškozen"
 GUESTS_LIKED_DEFACING: "Tuto akci [Select_CString(And(GreaterThan_CFixedPoint(CHARACTER.MakeScope.Var('num_unhappy_guests').GetValue,'(CFixedPoint)1'),LessThan_CFixedPoint(CHARACTER.MakeScope.Var('num_unhappy_guests').GetValue,'(CFixedPoint)5')),'oceňují','oceňuje')] #z [CHARACTER.MakeScope.Var('num_unhappy_guests').GetValue|0]#! z hostů:"
 feast_default.1020.tt_guests: "Tuto akci [Select_CString(And(GreaterThan_CFixedPoint(THIS.Var('num_unhappy_guests').GetValue,'(CFixedPoint)1'),LessThan_CFixedPoint(THIS.Var('num_unhappy_guests').GetValue,'(CFixedPoint)5')),'oceňují','oceňuje')] #z [THIS.Var('num_unhappy_guests').GetValue|0]#! z hostů a zlepší si o tobě mínění"
 feast_default.1030.t: "Hrdinové naší doby"
 feast_default.1030.desc: "První zanícený přednes [minstrel.GetFirstName] končí okázalým gestem. Hosté si utírají oči a buší do stolů.\n\n„Další příběh!“ zvolá [minstrel.GetFirstNameNoTooltip]. „Mám zazpívat o tom, jak velký $knight_culture_player_no_tooltip_lowercase$ [knight_1.GetFirstName]"
 feast_default.1030.ethical: "[Select_CString(knight_1.IsFemale,'ušlechtile chránila','ušlechtile chránil')] slabé?"
 feast_default.1030.amoral: "[Select_CString(knight_1.IsFemale,'nemilosrdně kosila','nemilosrdně kosil')] nepřátele všeho druhu?"
 feast_default.1030.leader: "[Select_CString(knight_1.IsFemale,'vedla','vedl')] své druhy skrze smrtelné nebezpečí?"
 feast_default.1030.morally_neutral: "poprvé [Select_CString(knight_1.IsFemale,'prokázala','prokázal')] svou zdatnost?"
 feast_default.1030.aggressive: "A co [knight_2.GetFirstName], [Select_CString(knight_2.IsFemale,'která nezadržitelně udeřila','který nezadržitelně udeřil')]?"
 feast_default.1030.defensive: "A co [knight_2.GetFirstName], [Select_CString(knight_2.IsFemale,'která stála pevně jako hora','který stál pevně jako hora')]?"
 feast_default.1030.champion: "A co [knight_2.GetFirstName], [Select_CString(knight_2.IsFemale,'která sama vybojovala vítězství','který sám vybojoval vítězství')]?"
 feast_default.1030.stance_neutral: "A co [knight_2.GetFirstName], [Select_CString(knight_2.IsFemale,'která očistila své pošramocené jméno','který očistil své pošramocené jméno')]?"
 feast_default.1030.subtle: "A co [knight_3.GetFirstName], [Select_CString(knight_3.IsFemale,'nejprohnanější ze všech','nejprohnanější ze všech')] [knight_3.GetCulture.GetCollectiveNounNoTooltip]?"
 feast_default.1030.forceful: "A co [knight_3.GetFirstName], [Select_CString(knight_3.IsFemale,'nejmocnější ze všech','nejmocnější ze všech')] [knight_3.GetCulture.GetCollectiveNounNoTooltip]?"
 feast_default.1030.equestrian: "A co [knight_3.GetFirstName], [Select_CString(knight_3.IsFemale,'jezdkyně','jezdec')] lidu [knight_3.GetCulture.GetCollectiveNounNoTooltip]?"
 feast_default.1030.intensity_neutral: "A co [knight_3.GetFirstName], [Select_CString(knight_3.IsFemale,'nejlepší ze všech','nejlepší ze všech')] [knight_3.GetCulture.GetCollectiveNounNoTooltip]?"
 feast_default.1030.courtly: "A co [knight_4.GetFirstName] a [Select_CString(knight_4.IsFemale,'její','jeho')] věrná přátelství?"
 feast_default.1030.militant: "A co [knight_4.GetFirstName] a [Select_CString(knight_4.IsFemale,'její','jeho')] vyhrané bitvy?"
 feast_default.1030.fighty_neutral: "A co [knight_4.GetFirstName] a [Select_CString(knight_4.IsFemale,'její','jeho')] čestně dodržené přísahy?"
 feast_default.1030.wrap_up: "Tito válečníci se vyrovnají hrdinům dávných časů!“\n\nAž se účinkující z této hostiny rozejdou k dalším dvorům, můj oblíbený příběh bude bezpochyby vyprávěn znovu a znovu."
 feast_default.1030.a: "[knight_1.GetFirstNameNoTooltip], [accolade_1.GetNameNoTooltip]!"
 feast_default.1030.a.tt: "Ať převyprávění tohoto příběhu inspiruje všechny od nejprostších sluhů až po největší $knight_culture_player_plural_no_tooltip_lowercase$."
 feast_default.1030.b: "[knight_2.GetFirstNameNoTooltip], [accolade_2.GetNameNoTooltip]!"
 feast_default.1030.b.tt: "Budou říkat, že [knight_2.GetFirstNameNoTooltip] je [Select_CString(knight_2.IsFemale,'neporazitelná','neporazitelný')]!"
 feast_default.1030.c: "[knight_3.GetFirstNameNoTooltip], [accolade_3.GetNameNoTooltip]!"
 feast_default.1030.c.tt: "Všichni budou [knight_3.GetFirstNameNoTooltip] znát jako [Select_CString(knight_3.IsFemale,'rovnocennou kterémukoli hrdinovi','rovnocenného kterémukoli hrdinovi')] dávných časů."
 feast_default.1030.d: "[knight_4.GetFirstNameNoTooltip], [accolade_4.GetNameNoTooltip]!"
 feast_default.1030.d.tt: "Stále oblíbenější [Select_CString(knight_4.IsFemale,'hrdinka','hrdina')] výprav a činů... skutečných i smyšlených."
 knightly_tales_modifier: "Rytíři opěvovaní v písních"
 knightly_tales_modifier_desc: "Rytíři této postavy inspirují oblíbené příběhy, které pozvedají postavení celé jejich vrstvy."
 riders_of_song_modifier: "Jezdci opěvovaní v písních"
 riders_of_song_modifier_desc: "Mladí nováčci i ostřílení jezdci touží vyrazit do boje po boku rytířů této postavy."
 tales_of_knightly_valor_modifier: "Příběhy o rytířské udatnosti"
 tales_of_knightly_valor_modifier_desc: "Smělí uchazeči, z nichž někteří nejsou o nic lepší než tuláci, prosí o možnost sloužit po boku rytířů této postavy."
 tales_of_knightly_leadership_modifier: "Příběhy o rytířském velení"
 tales_of_knightly_leadership_modifier_desc: "Sloužit pod moudrým velením rytířů této postavy je považováno za čest."
 feast_default.2001.t: "Trapná netrpělivost"
 feast_default.2001.desc: "[host.GetTitledFirstName] [Select_CString(host.IsFemale,'oznámila','oznámil')] menší zpoždění při podávání jídla a [glutton.GetTitledFirstName] vypadá, že každou chvíli pukne rozčilením!\n\nMezi kručením [Select_CString(glutton.IsFemale,'jejího','jeho')] žaludku slyším už jen nespokojené brblání."
 feast_default.2001.a: "[Select_CString(glutton.IsFemale,'Dělá ze sebe hlupačku.','Dělá ze sebe hlupáka.')]"
 feast_default.2001.b: "[glutton.GetFirstNameNoTooltip] má pravdu! Kde je naše jídlo?!"
 feast_default.2002.t: "Tajný obdiv"
 feast_default.2002.desc: "Během hostiny mi kdosi nepozorovaně podstrčil lístek:\n\n„[letterAuthor.Custom2('love_letter', SCOPE.sC('letterRecipient'))]“\n\nOd koho jen může být tenhle něžný dopis? Něco bylo na tom, jak se na mě [crush_1.GetTitledFirstName] [Select_CString(crush_1.IsFemale,'ostýchavě dívala','ostýchavě díval')]. Nebo na úsměvu [crush_2.GetTitledFirstName], když jsme se setkali. Na druhou stranu, [crush_3.GetTitledFirstName] se [Select_CString(crush_3.IsFemale,'velmi snažila','velmi snažil')] sedět co nejblíž ke mně..."
 feast_default.2002.a: "Musel to být [crush_1.GetFirstNameNoTooltip]!"
 feast_default.2002.b: "Mohl to být [crush_2.GetFirstNameNoTooltip]?"
 feast_default.2002.c: "Tohle má na svědomí [crush_3.GetFirstNameNoTooltip]."
 feast_default.2002.potential_lover_tt: "Pokud máš pravdu, bude mnohem snazší získat tuto osobu za [Concept('lover',Select_CString(letterAuthor.IsFemale,'milenku','milence'))|E]"
 feast_default.2003.t: "Na stejné vlně"
 feast_default.2003.desc: "Co začalo jako obyčejná hostina, se díky přítomnosti [other_guest.GetTitledFirstName] změnilo v něco výjimečného!\n\nCelý večer jsme si povídali o všem možném a ukázalo se, že toho máme spoustu společného! Opravdu jsem si ten večer [Select_CString(ROOT.Char.IsFemale,'užila','užil')]."
 feast_default.2003.a: "To byl ale příjemný večer!"
 feast_default.2005.t: "[ROOT.Char.Custom('GetClothingArticle')|U] a zvratky"
 feast_default.2005.desc: "Všem nám bylo jasné, že [drunk.GetTitledFirstName] toho vypil[Select_CString(drunk.IsFemale,'a','')] příliš mnoho. [Select_CString(drunk.IsFemale,'Přesto se nám snažila předvést, jak je střízlivá.','Přesto se nám snažil předvést, jak je střízlivý.')]\n\n[Select_CString(drunk.IsFemale,'Už samotný pokus vstát ze židle byl nad její síly','Už samotný pokus vstát ze židle byl nad jeho síly')] a teď jsem celý potřísněný[Select_CString(ROOT.Char.IsFemale,'á','')] páchnoucími zvratky!"
 feast_default.2005.a: "„[Select_CString(drunk.IsFemale,'Měla by ses za sebe stydět','Měl by ses za sebe stydět')], [drunk.GetFirstNameNoTooltip]!“"
 feast_default.2005.b: "„Ha! To bylo ale představení!“"
 feast_default.2006.t: "[Select_CString(befriending_guest.IsFemale,'Horlivá','Horlivý')] [befriending_guest.GetTitleTierName|U]"
 feast_default.2006.desc: "Když [befriending_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] znovu přeruší rozhovor hlasitým smíchem, už nemohu popírat, že se chová podivně.\n\nNikdy se ode mě příliš nevzdálí, připojí se ke každému mému rozhovoru a nadšeně oceňuje všechno, co řeknu..."
 feast_default.2006.a: "Je to zvláštní způsob, jak si získat mou přízeň, ale musím uznat, že funguje."
 feast_default.2006.b: "Na tohle bych si mohl[Select_CString(ROOT.Char.IsFemale,'a zvyknout',' zvyknout')]!"
 feast_default.2006.c: "Nesnáším, když mě někdo takhle všude následuje!"
 feast_default.2006.d: "Prosím, nech mě na pokoji!"
 feast_default.2007.t: "Odhalený poměr!"
 feast_default.2007.desc: "Sálem se rozlehne hlasitá rána, když povolí jedny dveře do místností služebnictva.\n\nMůj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover_guest_1') )] [lover_guest_1.GetTitledFirstName] a můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover_guest_2') )] [lover_guest_2.GetTitledFirstName] se v polonahém klubku vyvalí na podlahu přímo před zraky všech."
 feast_default.2007.a_chaste: "Na to se nedokážu dívat!"
 feast_default.2007.a_lustful: "Jen si #EMP představit#!, co tam asi dělali..."
 feast_default.2007.a_sadistic: "Ha! To je nádhera!"
 feast_default.2007.a_compassionate: "Nikdo si nezaslouží takovou potupu..."
 feast_default.2007.b: "Kdo by řekl, že skrývali takové tajemství!"
 feast_default.2008.t: "Za zamčenými dveřmi"
 feast_default.2008.desc: "Když se [homosexual_character.Custom2('MyCharacterIntroduction', ROOT.Char )] [Select_CString(homosexual_character.IsFemale,'pokusila','pokusil')] nepozorovaně vytratit z hostiny, [Select_CString(ROOT.Char.IsFemale,'měla jsem pocit, že jsem zahlédla','měl jsem pocit, že jsem zahlédl')], jak bere za ruku [Select_CString(homosexual_character.IsFemale,'jinou služebnou','jiného služebného')]!\n\nMé podezření se potvrdilo, když jsem je [Select_CString(ROOT.Char.IsFemale,'přistihla','přistihl')] v odlehlé místnosti napůl svlečené!"
 feast_default.2008.a: "Takže je v tom další [homosexual_character.GetWomanMan]?! O tom se musí dozvědět celé panství!"
 feast_default.2008.b: "Tvé tajemství je u mě v bezpečí, [homosexual_character.GetFirstNameNoTooltip]. Prozatím."
 feast_default.2008.c: "Svádět #EMP mé#! služebnictvo bez mého svolení?!"
 feast_default.2008.d: "Ach, [homosexual_character.GetFirstNameNoTooltip], kéž bych to byl[Select_CString(ROOT.Char.IsFemale,'a věděla',' věděl')]."
 feast_default.2008.d.unlock_text: "Tato možnost je dostupná díky tvé [Concept('sexuality','sexuální orientaci')|E]"
 feast_default.2009.t: "Jen pokračuj"
 feast_default.2009.desc: "Pozorně naslouchám [secret_holder.GetTitledFirstName], zatímco bezstarostně vykládá jednu věc za druhou. Ve snaze vydolovat z poháru poslední kapku si [secret_holder.GetTitledFirstNameNoTooltip] vůbec nevšímá, s jakým zájmem poslouchám.\n\nJakmile si toho všimne, začne vstávat. „Jen tak plácám! Stejně to není pravda, vůbec nic z toho!“"
 feast_default.2009.a: "Ach, jenže tohle plácání je #EMP velmi#! zajímavé."
 feast_default.2011.t: "Slib je slib"
 feast_default.2011.desc: "Bez sebemenšího ohledu na etiketu mě [favor_character.Custom2('MyCharacterIntroduction', ROOT.Char )] plácne po zádech. „Myslím to vážně!“ zvolá. „Udělám cokoli, o co mě požádáš. Úplně cokoli. Stačí říct a je to!“\n\nZ dechu [favor_character.GetFirstNameNoTooltip] cítím alkohol, ale ten slib slyšel každý přítomný host."
 feast_default.2011.a: "Ty přece držíš slovo, ne?"
 feast_default.2011.b: "„Ha, [favor_character.GetTitledFirstNameNoTooltip] [Select_CString(favor_character.IsFemale,'je příliš opilá, než aby věděla','je příliš opilý, než aby věděl')], co říká!“"
 feast_default.2012.t: "Svědek"
 feast_default.2012.desc: "Když se vypotácím ven hledat místo, kde bych si odskočil[Select_CString(ROOT.Char.IsFemale,'a','')], zaslechnu za rohem křik. Jakmile za něj zahnu, spatřím svého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer'))], [murderer.GetTitledFirstName], jak se šklebí a zabodává čepel do tváře krčící se [murdered_guest.GetTitledFirstName].\n\nAť už mi unikl jakýkoli zvuk, stačil. [murderer.GetFirstName] se ke mně otočí s překvapením ve tváři."
 feast_default.2012.a: "Co jsi to #EMP provedl[Select_CString(murderer.IsFemale,'a','')]#!?!"
 feast_default.2012.b: "O tvém zločinu se dozvědí všichni!"
 feast_default.2012.c: "Mé mlčení má svou cenu."
 feast_default.2013.t: "Patolízal"
 feast_default.2013.desc: "Zvěsti o tom, že se [bootlicker.GetTitledFirstName] snaží vetřít do přízně [shared_liege.GetTitledFirstName], se potvrdí ve chvíli, kdy [shared_liege.GetTitledFirstNameNoTooltip] dostane dar.\n\n„Můj nejdražší [bootlicker.Custom2('RelationToMeShort', SCOPE.sC('shared_liege'))], jak rád[Select_CString(bootlicker.IsFemale,'a','')] tě vidím! Věděl[Select_CString(bootlicker.IsFemale,'a','')] jsem, že se tu setkáme, a tak jsem ti na znamení své úcty přinesl[Select_CString(bootlicker.IsFemale,'a','')] tuto nádhernou kožešinu.“\n\n[shared_liege.GetTitledFirstName] se při prohlížení kožešiny spokojeně usmívá. Když vidím, jakou radost dar udělal, dojde mi, že bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] propásnout příležitost zlepšit si u [shared_liege.GetTitledFirstNameNoTooltip] své postavení!"
 feast_default.2013.a: "„Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('shared_liege'))]! Také pro tebe mám dar!“"
 feast_default.2013.a.success: "Tvůj spontánní dar na [shared_liege.GetTitledFirstName] zapůsobí"
 feast_default.2013.a.failure: "Tvůj spontánní dar na [shared_liege.GetTitledFirstName] nezapůsobí"
 feast_default.2013.b: "„#EMP Ehm!#! Připíjím na [shared_liege.GetTitledFirstNameNoTooltip]!“"
 feast_default.2013.b.success: "Tvůj spontánní přípitek na [shared_liege.GetTitledFirstName] zapůsobí"
 feast_default.2013.b.failure: "Tvůj spontánní přípitek na [shared_liege.GetTitledFirstName] nezapůsobí"
 feast_default.2013.c: "Polij darovanou kožešinu a tvrď, že to byla nehoda."
 feast_default.2013.c.success: "Všichni uvěří, že polití byla nehoda"
 feast_default.2013.c.failure: "Nikdo neuvěří, že polití byla nehoda"
 feast_default.2013.d: "Není kam spěchat. Něco vymyslím jindy."
 feast_default.3001.t: "Hostina s přítelem"
 feast_default.3001.desc: "Vidět [friend.Custom2('MyCharacterIntroductionNoComma', ROOT.Char )] mi dělá ohromnou radost! Znovu spolu jíme, pijeme a zpíváme, jako by od našeho posledního rozloučení neuplynul ani den.\n\nMohli bychom stolovat třeba ve stodole, a přesto by to byla jedna z nejlepších hostin, jakých jsem se kdy účastnil[Select_CString(ROOT.Char.IsFemale,'a','')]."
 feast_default.3001.a: "Ach, co by byl život bez [friend.GetFirstNameNoTooltip]?"
 feast_default.3002.t: "Ukradené polibky"
 feast_default.3002.desc: "[lover.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )]. Usmějeme se na sebe a pozdravíme se, jako bychom se už dávno důvěrně neznali. Jako bychom se nikdy nesvírali v náručí v návalu vášně. Jako bychom netoužili být si znovu nablízku.\n\nKdyž se později míjíme v jinak opuštěné chodbě, znovu ucítím rty [lover.GetTitledFirstNameNoTooltip] na svých. Pak [lover.GetTitledFirstNameNoTooltip] ukáže na neosvětlené dveře..."
 feast_default.3002.a: "Pojď! Nemáme ani chvíli nazbyt!"
 feast_default.3002.discovery_tt: "#F Služebnictvo vidí mnohé a mohlo by začít mluvit...#!"
 feast_default.3002.b: "Ne, mohli by nás odhalit."
 feast_default.3003.t: "Nepříjemná společnost"
 feast_default.3003.desc: "Byla to tak příjemná hostina, jenže pak se objeví #EMP [rival.GetTitledFirstName]#!. Copak nemohu strávit jediný večer, aniž by ho zamořil vtíravý pach [rival.GetTitledFirstNameNoTooltip]?\n\nNejhorší ze všeho je nosové skřípění hlasu [rival.GetTitledFirstNameNoTooltip], když se ke mně připlíží. „Proč se tak mračíš, [ROOT.Char.GetFirstNameNoTooltip]?“"
 feast_default.3003.a: "[rival.GetTitledFirstNameNoTooltip] ve mně probouzí chuť jednu [Select_CString(rival.IsFemale,'jí vrazit','mu vrazit')]!"
 feast_default.3004.t: "Urážlivá hádka"
 feast_default.3004.desc: "Po vydatném množství jídla a pití zastihnu [rival_guest.Custom2('MyCharacterIntroduction', ROOT.Char )] uprostřed hlasitého hovoru. Jakmile si [rival_guest.GetTitledFirstNameNoTooltip] všimne mé přítomnosti, otočí se ke mně.\n\n„A #EMP ty#!... Už jen tvoje přítomnost kazí celý večer!“"
 feast_default.3004.a: "Myslím, že pro dnešek už toho bylo dost."
 feast_default.3004.b: "Nejsi nic než [rival_guest.Custom2('InsultAdjective', ROOT.Char)] [rival_guest.Custom2('InsultNoun', ROOT.Char)]!"
 feast_default.3004.b.success: "Vyhraješ rvačku"
 feast_default.3004.b.failure: "[rival_guest.GetFirstNameNoTooltip] vyhraje rvačku"
 feast_default.3004.c: "Někteří rozdávají radost, kamkoli přijdou. Jiní, kdykoli odejdou."
 feast_default.3004.c.tt: "#F Je načase, aby [rival_guest.GetFirstNameNoTooltip] šířil[Select_CString(rival_guest.IsFemale,'a radost někde jinde',' radost někde jinde')]#!"
 feast_default.3004.d: "Pěstí do obličeje je stejně dobrá odpověď jako každá jiná!"
 feast_default.3005.t: "Výzva"
 feast_default.3005.desc: "Síní se rozléhá smích mého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_to_duel'))], [rival_to_duel.GetTitledFirstName], spolu s posměšky a urážkami. Když mě [rival_to_duel.GetTitledFirstNameNoTooltip] nazve [ROOT.Char.Custom2('InsultAdjectiveArticle', SCOPE.sC('rival_to_duel'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_to_duel'))], tasím čepel."
 feast_default.3005.desc_won: "\n\nProberu se, až když stojím nad [rival_to_duel.GetTitledFirstName] s botou na hrudi svého protivníka a oba těžce oddechujeme."
 feast_default.3005.desc_lost: "\n\nProberu se, až když se nade mnou sklání [rival_to_duel.GetTitledFirstName] s botou na mé hrudi. Do ucha mi zasyčí: „Chci slyšet, jak prosíš o milost.“"
 feast_default.3005.a: "„Za všechno, cos provedl[Select_CString(rival_to_duel.IsFemale,'a','')], zaplatíš.“"
 feast_default.3005.b: "„Někomu jako #EMP ty#! se nikdy nevzdám!“"
 feast_default.3005.c: "„Prosím, neubližuj mi!“"
 feast_default.3005.d: "„Chci slyšet, jak prosíš o milost.“"
 feast_default.3005.e: "Natáhnu se a jediným plynulým pohybem [rival_to_duel.GetTitledFirstNameNoTooltip] přeříznu Achillovu šlachu."
 feast_default.3096.t: "Nová možnost"
 feast_default.3096.desc: "Jak oslavy pokračují, nemohu si nevšimnout, že si s [partner.GetName] stále vyměňujeme pohledy.\n\nJsem [Select_CString(ROOT.Char.IsFemale,'čestná žena','čestný muž')], ale jen málokdy jsem [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')] tak silné pokušení poznat někoho nového trochu blíž..."
 feast_default.3096.a: "Uvidíme, kam nás večer zavede."
 fest_default.3906.a.tt: "Vyspíš se s [partner.GetName]"
 feast_default.3096.b: "Mám na víc."
 feast_default.3006.t: "Jediná noc"
 feast_default.3006.opening_1: "Opojeni alkoholem a chtíčem zůstaneme s [partner.Custom2('MyCharacterIntroduction', ROOT.Char )] o samotě. [partner.GetTitledFirstNameNoTooltip] mě objímá, rty mi přejíždějí po krku a společně hasíme oheň, který nám plane v srdcích i bedrech."
 feast_default.3006.opening_2: "Probudím se v cizí posteli vedle někoho, koho jsem tam rozhodně nečekal[Select_CString(ROOT.Char.IsFemale,'a','')]. Z bolestivé mlhy v hlavě se pomalu vynořují vzpomínky na minulou noc. [partner.Custom2('MyCharacterIntroduction', ROOT.Char )|U] a já, spojeni touhou."
 feast_default.3006.opening_3: "Tak tvrdošíjně jsem trval[Select_CString(ROOT.Char.IsFemale,'a','')] na tom, že právě tohle nikdy neudělám. Jenže po několika pohárech jsem tak snadno podlehl[Select_CString(ROOT.Char.IsFemale,'a','')] svodům [partner.Custom2('MyCharacterIntroduction', ROOT.Char )]. Netrvalo dlouho a [Select_CString(ROOT.Char.IsFemale,'ocitla jsem se','ocitl jsem se')] v posteli [partner.GetTitledFirstNameNoTooltip]."
 feast_default.3006.both_married_love: "\n\nNedokážu snést pomyšlení, že bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] žít bez [partner.GetTitledFirstNameNoTooltip], ale [partner.Custom2('RelationToMe', SCOPE.sC('partner'))] se to nikdy nesmí dozvědět. A stejně tak můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))]!"
 feast_default.3006.married_love: "\n\nNedokážu snést pomyšlení, že bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] žít bez [partner.GetTitledFirstNameNoTooltip], ale můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] se nesmí dozvědět, co se tu stalo."
 feast_default.3006.partner_married_love: "\n\nNedokážu snést pomyšlení, že bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] žít bez [partner.GetTitledFirstNameNoTooltip], ale co můžu dělat, když je tu ještě [partner.Custom2('RelationToMe', SCOPE.sC('partner'))]?"
 feast_default.3006.unmarried_love: "\n\nTohle překračuje meze manželství i slušnosti, a tak se svět nesmí dozvědět, co se tu stalo. Přesto nedokážu snést pomyšlení, že bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] strávit jediný den bez [partner.GetTitledFirstNameNoTooltip]."
 feast_default.3006.both_married: "\n\n[partner.Custom2('RelationToMe', SCOPE.sC('partner'))] se to nesmí dozvědět. A to ani nemluvím o mém vlastním [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))]!"
 feast_default.3006.married: "\n\nMůj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('partner'))] se o mé zradě nesmí dozvědět."
 feast_default.3006.partner_married: "\n\n[partner.Custom2('RelationToMe', SCOPE.sC('partner'))] se nesmí dozvědět, co se tu stalo."
 feast_default.3006.unmarried: "\n\nTohle překračuje meze manželství i slušnosti, a tak se svět nesmí dozvědět, co se tu stalo."
 feast_default.3006.a: "Musím tě znovu vidět!"
 feast_default.3006.b: "Využijme tuhle chvíli, dokud můžeme..."
 feast_default.3006.b.mistake_tt: "#F [partner.GetFirstNameNoTooltip] nemá zájem#!"
 feast_default.3006.c: "Už o tom nikdy nemluvme."
 feast_default.3006.c.tt: "#F Budeš se [partner.GetFirstNameNoTooltip] vyhýbat#!"
 feast_default.3007.t: "Přistiženi při činu"
 feast_default.3007.love: "Zatímco ostatní hosté přicházejí kvůli pohárům o rozum, najdeme si s mým [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))] komnatu, kde můžeme strávit noc o samotě. Právě zasypávám nahá záda [lover.GetFirstNameNoTooltip] polibky, když mě čísi hlas přiměje rychle se zahalit."
 feast_default.3007.not_love: "Odvedu svého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))], [lover.GetTitledFirstName], do opuštěné komnaty, abychom unikli davu. Právě uprostřed uspokojování své touhy zaslechnu známý hlas a krev mi ztuhne v žilách."
 feast_default.3007.ambiguous: "V naději, že strávím nějaký čas se svým [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))], odvedu [lover.GetTitledFirstName] pryč z hostiny. Právě když se chystám vrátit, známý hlas mě přimrazí na místě."
 feast_default.3007.end: "\n\n„[ROOT.Char.GetFirstNameNoTooltip]?!“ [Select_CString(spouse.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], [spouse.GetTitledFirstName], na nás nevěřícně zírá. „Jak ses [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] vyspat s tím [lover.Custom2('InsultAdjective', SCOPE.sC('spouse'))] [lover.Custom2('InsultNounSexual', SCOPE.sC('spouse'))]?“"
 feast_default.3007.a: "Nic to neznamenalo, drahoušku!"
 feast_default.3007.b: "Miluji [Select_CString(lover.IsFemale,'ji','ho')]!"
 feast_default.3007.c: "Dělám si, co chci."
 feast_default.5001.t: "Křivý úsměv"
 feast_default.5001.friend_reminder: "Myslím, že [friend.GetTitledFirstName] to [Select_CString(friend.IsFemale,'myslela','myslel')] jen jako varování, ale od chvíle, kdy mi [Select_CString(friend.IsFemale,'připomněla','připomněl')] děsivou pověst [host.GetTitledFirstNameNoTooltip], nedokážu myslet téměř na nic jiného."
 feast_default.5001.rival_reminder: "Vím, že [rival.GetTitledFirstName] to [Select_CString(rival.IsFemale,'řekla','řekl')] jen proto, aby mě [Select_CString(rival.IsFemale,'znepokojila','znepokojil')], ale od chvíle, kdy mi [Select_CString(rival.IsFemale,'připomněla','připomněl')] děsivou pověst [host.GetTitledFirstNameNoTooltip], nedokážu myslet téměř na nic jiného."
 feast_default.5001.spouse_reminder: "[spouse.GetTitledFirstName] se dotkne mé paže, aby upoutal[Select_CString(spouse.IsFemale,'a','')] mou pozornost, a tiše, se znepokojením v hlase pronese: „[host.GetTitledFirstName] tě dnes večer nějak moc pozoruje...“\nKdyž pomyslím na pověst, jakou [spouse.GetTitledFirstNameNoTooltip] má, skoro si přeji, aby raději nic neříkal[Select_CString(spouse.IsFemale,'a','')]."
 feast_default.5001.sadist_reminder: "[sadist.GetTitledFirstName] mi se znepokojivým úsměvem [Select_CString(sadist.IsFemale,'vyprávěla','vyprávěl')] několik děsivějších příběhů o způsobech... diplomacie, jimiž je [host.GetTitledFirstName] proslul[Select_CString(host.IsFemale,'á','ý')]. Neměl[Select_CString(ROOT.Char.IsFemale,'a','')] bych si to tak připouštět, ale teď už sotva dokážu myslet na něco jiného."
 feast_default.5001.reminder: "I když je hostina příležitostí k oslavám a veselí, na děsivou pověst, která [host.GetTitledFirstNameNoTooltip] předchází, se zapomíná jen těžko..."
 feast_default.5001.worry: "\n\nKaždý úsměv [host.GetTitledFirstNameNoTooltip] mi teď připadá až příliš široký a při každém náhlém výbuchu smíchu sebou trhnu v obavě, že si někdo nějakou drobnou urážkou přivolal hněv našeho hostitele. Nebo ještě hůř, že tím někým jsem já."
 feast_default.5001.a: "Zvládnu to. Je to jen hostina."
 feast_default.5002.t: "Bludy"
 feast_default.5002.desc_chair: "[lunatic_host.GetTitledFirstName], pořadatel této hostiny, se skloní, aby mohl[Select_CString(lunatic_host.IsFemale,'a','')] lépe rozmlouvat s vedlejší židlí. Ostatní rozhovory při tom pohledu rychle utichnou.\n\n„Cože jsi říkal, [Select_CString(ROOT.Char.IsFemale,'má dobrá','můj dobrý')] [ROOT.Char.Custom('RandomLadyLord')]? Ano, samozřejmě, věřím ti víc než komukoli tady!“"
 feast_default.5002.desc_chicken: "[lunatic_host.GetTitledFirstName], pořadatel této hostiny, si něžně přitiskne k hrudi oškubané — a upečené — kuře a šeptá mu něžná slovíčka. Když pak začne hlasitě vyznávat drůbeži svou náklonnost, nálada ve velké síni rychle zvážní."
 feast_default.5002.desc_drapes: "[lunatic_host.GetTitledFirstName], pořadatel této hostiny, vpluje na taneční parket s jedním z praporů zdobících stěny v náručí.\n\nHosté mohou jen zírat, zatímco s kusem látky předvádí propracovaný tanec a zcela se do něj ponoří."
 feast_default.5002.a: "[Select_CString(lunatic_host.IsFemale,'Má paní','Můj pane')], nepůjdeme se ven trochu nadýchat čerstvého vzduchu?"
 feast_default.5002.b: "Musím tohle šílenství zastavit!"
 feast_default.5002.c: "[lunatic_host.GetFirstNameNoTooltip]! Přidejte mě do tance!"
 feast_default.5003.t: "Bolestivá zábava"
 feast_default.5003.desc: "Kousky ostrého kovu v některých pokrmech, třísky na židlích, drobné #EMP nehody#! slibující modřiny...\n\nV čele stolu sedí [sadistic_host.GetTitledFirstName] a nedokáže skrýt chladný úsměv, když další host, [guest.GetTitledFirstName], vyplivne na svůj talíř krev."
 feast_default.5003.a: "„Tohle je nepřijatelné!“"
 feast_default.5003.b: "O [guest.GetFirstNameNoTooltip] se zatím postarám."
 feast_default.5003.c: "To je ale nádherná hostina!"
 feast_default.5004.t: "Dno poháru"
 feast_default.5004.desc: "„To byl zvuk prázdného poháru, který jsi právě položil[Select_CString(ROOT.Char.IsFemale,'a','')] na stůl?“ Aby [host.GetTitledFirstName] něco takového v tomhle hluku zaslechl[Select_CString(host.IsFemale,'a','')], musí mít snad začarované uši. Můj laskavý hostitel pokyne služebníkovi. „Sem další víno! Nikdo nebude žíznit!“"
 feast_default.5004.a: "Děkuji, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]!"
 feast_default.5004.b: "Myslím, že už jsem toho měl[Select_CString(ROOT.Char.IsFemale,'a','')] dost."
 feast_default.5004.c: "Omluvím se a nepozorovaně zmizím v davu."
 feast_default.5005.t: "Garum!"
 feast_default.5005.desc: "Ach, ta božská chuť! Výrazná, lehce slaná, připomínající moře...\n\nTohle je možná nejlepší garum, jaké jsem kdy ochutnal[Select_CString(ROOT.Char.IsFemale,'a','')], a v kuchyni [host.GetTitledFirstNameNoTooltip] s ním zacházejí opravdu mistrovsky!"
 feast_default.5005.a: "Tohle musím jíst pravidelně!"
 feast_default.5005.b: "„Tohle jídlo je úžasné, [host.GetFirstNameNoTooltip]!“"
 feast_default.5005.c: "„Věděl[Select_CString(ROOT.Char.IsFemale,'a','')] jsi, že murri vzniklo podle garumu?“"
 feast_default.5005.c.flavor: "Zdá se, že to mnoho ostatních hostů neví!"
 feast_default.5005.d: "Kdyby to šlo, garum bych snad i #EMP dýchal[Select_CString(ROOT.Char.IsFemale,'a','')]#!!"
 feast_default.6001.t: "[Select_CString(spouse.IsFemale,'Správná žena','Správný muž')] pro tuto práci"
 feast_default.6001.dislike_spouse: "Ačkoli si s [spouse.GetFirstName] v mnoha ohledech nerozumíme, musím uznat, že se o mou hostinu [Select_CString(spouse.IsFemale,'postarala','postaral')] opravdu dobře. Jídlo přichází včas, všichni hosté sedí na správných místech a všichni vypadají spokojeně.\n\nKdyž vedle mě u hlavního stolu sedí [spouse.GetFirstName] a oslavy mají každou chvíli začít, dám najevo, jak moc si vážím veškeré práce odvedené při přípravě hostiny."
 feast_default.6001.like_spouse: "[spouse.GetFirstName] se usilovně stará o to, aby na hostině všechno probíhalo hladce. Jídlo přichází včas, všichni hosté sedí na správných místech a všichni vypadají spokojeně.\n\nKdyž vedle mě u hlavního stolu sedí [spouse.GetFirstName], je všechno připraveno. Naše ruce se na okamžik pevně sevřou, usměji se a pak vstanu, abych oznámil[Select_CString(ROOT.Char.IsFemale,'a','')] zahájení oslav."
 feast_default.6001.a: "[Select_CString(ROOT.Char.IsFemale,'Co bych si počala','Co bych si počal')], kdyby tu [spouse.GetFirstNameNoTooltip] [Select_CString(spouse.IsFemale,'nebyla','nebyl')]?"
 feast_default.6002.t: "Chvályhodné úsilí"
 feast_default.6002.desc: "Když je hostina v plném proudu a naši hosté vesele jedí a pijí, [guest.GetTitledFirstName] k nám u hlavního stolu přistoupí.\n„To je nádherná hostina! Všechna čest pořadatelům.“"
 feast_default.6002.a: "„Ano, odvedl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem skvělou práci, že?“"
 feast_default.6002.b: "„Veškerou zásluhu má [spouse.GetFirstNameNoTooltip].“"
 feast_default.6003.t: "V mém domě"
 feast_default.6003.opening: "Snažím se ze všech sil zajistit, aby mezi [fighter_1.GetTitledFirstName] a [fighter_2.GetTitledFirstName] zůstával co největší odstup. Nestačí to a teď se uprostřed mé hostiny málem pustili do sebe!"
 feast_default.6003.bodyguard: "\n[bodyguard.GetTitledFirstName] stojí nedaleko rvačky a čeká na můj pokyn, zda má zasáhnout."
 feast_default.6003.guard: "\nNedaleko rvačky stojí jeden z mých strážných a čeká na můj pokyn, zda má zasáhnout."
 feast_default.6003.a: "Vyhoď [fighter_2.GetFirstNameNoTooltip] ven, ať zchladne."
 feast_default.6003.b: "Zadrž [fighter_1.GetFirstNameNoTooltip], dokud se situace neuklidní."
 feast_default.6003.c: "„Dost! Promluvíme si o tom později.“"
 feast_default.6101.t: "Když má [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))|U] trápení"
 feast_default.6101.desc_opening: "[troubled_guest.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))], na mě upírá stále zoufalejší prosebný pohled. Skupina hostů se blíží ke koutku, kde se [troubled_guest.GetFirstNameNoTooltip] celý večer skrývá, a stěny brání v úniku.\n\n"
 feast_default.6101.desc_liked: "[Select_CString(troubled_guest.IsFemale,'Chudinka se mezi lidmi nikdy necítila dobře!','Chudák se mezi lidmi nikdy necítil dobře!')]"
 feast_default.6101.desc_disliked: "A [troubled_guest.GetTitleTierName] se chová takhle..."
 feast_default.6101.desc_disliked_unlanded: "A [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('troubled_guest'))] se chová takhle..."
 feast_default.6101.a: "Odvedu pozornost blížících se hostů."
 feast_default.6101.b: "No tak, [troubled_guest.GetFirstNameNoTooltip]. Pověz nám nějaký příběh!"
 feast_default.6101.c: "[troubled_guest.GetFirstNameNoTooltip]! Potřebuji s tebou mluvit. O samotě."
 feast_default.6101.c.tt: "Oběma by nám prospěla přestávka..."
 feast_default.6111.t: "Společnost k hovoru"
 feast_default.6111.desc: "Zatímco jeden chod střídá druhý, [guest_to_talk_to.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest_to_talk_to'))], nepřestává vyprávět o [guest_to_talk_to.Custom('subject_of_interest')].\n\n„...a tak jsme se z toho maléru dostali! Určitě tě nenudím, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 feast_default.6111.a: "Ne, ne, jen pokračuj!"
 feast_default.6111.b: "Co kdybychom místo toho mluvili víc o tobě?"
 feast_default.6111.c: "Jak by mě mohlo nudit, když ze sebe děláš hlupáka?"
 feast_default.6111.d: "Vyprávěl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem ti už o [ROOT.Char.GetPromotedLegend.GetName]?"
 feast_default.6111.d.success: "Tvá legenda je poutavá"
 feast_default.6111.d.failure: "Nudíš"
 feast_default.6111.e: "Fascinující, jistě, ale co kdybychom si promluvili o mně?"
 every_evil_guest_scope_tt: "Každý bezcitný host"
 feast_default.6121.t: "Vkusná urážka"
 feast_default.6121.desc: "Když do síně přinášejí jeden chod za druhým, dolehně ke mně nezaměnitelná vůně a já se usměji. Že je [hated_guest.GetTitledFirstName] citliv[Select_CString(hated_guest.IsFemale,'á','ý')] na [ROOT.GetCharacter.Custom('GetFoodDetail')], jsem kuchaři #EMP bohužel#! zapomněl[Select_CString(ROOT.Char.IsFemale,'a','')] říct.\n\n„Vítám vás všechny a doufám, že vám bude chutnat.“"
 feast_default.6121.a: "Obzvlášť tobě, [hated_guest.GetFirstNameNoTooltip]. #EMP Dobrou chuť#!!"
 feast_default.6121.b: "Výraz [hated_guest.GetFirstNameNoTooltip], když [Select_CString(ROOT.Char.IsFemale,'předstírám, že ji zachraňuji','předstírám, že ho zachraňuji')] před jídlem, mi rozhodně chutná!"
 feast_default.6231.t: "Pohroma"
 feast_default.6231.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]. Víno... Narazili jsme další sud a je zkažené. Je zkažené #EMP všechno#!!“\n\nHostina je stále v plném proudu, ale bez pití nálada jistě rychle opadne."
 feast_default.6231.a: "Obchodník s vínem by měl být ještě ve městě!"
 every_drunkard_guest_scope_tt: "Každý přítomný opilec"
 feast_default.6231.b: "Musíme se složit všichni. Tak do toho."
 feast_default.6231.c: "Je čas otevřít mé tajné zásoby."
 feast_default.6231.d: "Přinesme má lepší vína."
 feast_default.6251.t: "Dilema"
 feast_default.6251.desc: "Hostina se pomalu chýlí ke konci a já se zabírám do hovoru s [guest.GetTitledFirstName].\n\n[guest.GetTitledFirstNameNoTooltip] se mě zeptá na můj názor na [guest.Custom('subject_of_interest')] – téma, které [Select_CString(guest.IsFemale,'ji hluboce zajímá','ho hluboce zajímá')]."
 feast_default.6251.a: "Tohle téma mě také fascinuje!"
 feast_default.6251.b: "Nemůže mi to být lhostejnější."
 feast_default.6251.c: "Mnohem víc mě zajímáš #EMP ty#!...!"
 feast_default.6261.t: "Jak podávat člověka"
 feast_default.6261.desc_lunatic: "„Osobně jsem přiložil[Select_CString(ROOT.Char.IsFemale,'a','')] ruku k přípravě tohoto jídla a doufám, že výsledek potěší!“"
 feast_default.6261.desc_not_lunatic: "„Kuchařův pomocník dal do přípravy tohoto jídla tělo i duši a doufám, že výsledek potěší!“"
 feast_default.6261.desc_cannibal_guest: "\n\nKdyž se posadíme k jídlu, nemohu si nevšimnout, že [cannibal_guest.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('cannibal_guest'))], si na pokrmu obzvlášť pochutnává."
 feast_default.6261.desc_concerned_guest: "\n\nKdyž se však posadíme k jídlu, [concerned_guest.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('concerned_guest'))], do pokrmu před sebou jen nedůvěřivě šťouchá a podezíravě si mě prohlíží."
 feast_default.6261.a_exposed: "Skoro jako by mi [concerned_guest.GetFirstNameNoTooltip] nevěřil[Select_CString(concerned_guest.IsFemale,'a','')]!"
 feast_default.6261.a: "[concerned_guest.GetFirstNameNoTooltip] si může myslet, co chce."
 feast_default.6261.b: "Přineste [concerned_guest.GetTitleTierName] něco jiného k jídlu."
 feast_default.6261.c: "Myslím, že bychom si mohli mít hodně co říct o jídle!"
 feast_default.6301.t: "Potíže s artefaktem"
 feast_default.6301.desc: "Uprostřed oslav ke mně přispěchá velitel stráže.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], zdá se, že někdo [feast_target_artifact.Custom('DamageArtifactAction')] [feast_target_artifact.GetName]! Důkazy ukazují na [feast_artifact_culprit.GetTitledFirstNameNoTooltip], tedy [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('feast_artifact_culprit'))], který se dnes večer chová podivně.“ Velitel stráže pohlédne směrem k [feast_artifact_culprit.GetTitledFirstNameNoTooltip].\n\n„Co si přejete, abych udělal?“"
 feast_default.6301.desc_learning_guard: "\n\n[feast_target_artifact.Custom('DamageArtifactActionFollowup')]"
 feast_default.6301.desc_learning: "\n\nKdyž se podívám na [feast_artifact_culprit.GetTitledFirstNameNoTooltip], skutečně působí poněkud neklidně."
 feast_default.6301.a: "Okamžitě [feast_artifact_culprit.GetTitledFirstNameNoTooltip] zadržte!"
 feast_default.6301.b: "Přiveďte [feast_artifact_culprit.GetTitledFirstNameNoTooltip] ke mně."
 feast_default.6301.b.tt: "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] by měl[Select_CString(feast_artifact_culprit.IsFemale,'a za škodu zaplatit',' za škodu zaplatit')]."
 feast_default.6301.b.tt_innocent: "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] je [Select_CString(feast_artifact_culprit.IsFemale,'nevinná','nevinný')]"
 feast_default.6301.b.tt_guilty: "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] je [Select_CString(feast_artifact_culprit.IsFemale,'vinná','vinný')]"
 feast_default.6301.c_learning: "Myslím, že víte víc, než dáváte najevo, veliteli..."
 feast_default.6301.c.tt: "Zbavíš se svého proradného velitele."
 feast_default.6301.d: "Stejně jsem ten kus nikdy neměl[Select_CString(ROOT.Char.IsFemale,'a rád',' rád')]."
 feast_default.6302.t: "Nevina promluví"
 feast_default.6302.t_lover: "Nevina spočívá zde"
 feast_default.6302.desc_intro: "[feast_trusted_friend.GetTitledFirstNameNoTooltip] za mnou přijde do pracovny. „[feast_trusted_friend.Custom2('RelationToMe', ROOT.Char)], teprve nedávno jsem se dozvěděl[Select_CString(feast_trusted_friend.IsFemale,'a','')], že [feast_artifact_culprit.GetFirstNameNoTooltip] skončil[Select_CString(feast_artifact_culprit.IsFemale,'a ve vězení',' ve vězení')].“"
 feast_default.6302.desc_secret_lover: "\n\n[feast_trusted_friend.GetTitledFirstNameNoTooltip] na mě nervózně pohlédne. „Možná to byla chyba. V době toho incidentu jsem totiž... sledoval[Select_CString(feast_trusted_friend.IsFemale,'a','')] [feast_artifact_culprit.GetTitledFirstNameNoTooltip] a rozhodně to nemohl[Select_CString(feast_artifact_culprit.IsFemale,'a být ona',' být on')].“\nTváře [feast_trusted_friend.GetTitledFirstNameNoTooltip] zřetelně zrudnou."
 feast_default.6302.desc_spirited_debate: "\n\n[feast_trusted_friend.GetTitledFirstNameNoTooltip] se na mě podívá klidně, ale ustaraně. „Jasně si pamatuji, že [feast_artifact_culprit.GetTitledFirstNameNoTooltip] v době incidentu vedl[Select_CString(feast_artifact_culprit.IsFemale,'a živou debatu',' živou debatu')] s [feast_debatee_character.GetTitledFirstNameNoTooltip], takže pachatelem být nemohl[Select_CString(feast_artifact_culprit.IsFemale,'a','')].“"
 feast_default.6302.a: "Každý dělá chyby."
 feast_default.6302.a.tt: "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] si to bude pamatovat."
 feast_default.6302.a_lover: "#EMP [feast_trusted_friend.GetTitledFirstNameNoTooltip]!#!"
 feast_default.6302.b: "Nechme si to pro sebe."
 feast_default.6302.b.tt: "Určitě je [feast_artifact_culprit.GetTitledFirstNameNoTooltip] [Select_CString(feast_artifact_culprit.IsFemale,'vinná','vinný')] alespoň #EMP něčím#!."
 feast_default.6302.b.tt_callous: "[feast_artifact_culprit.GetTitledFirstNameNoTooltip] se mezi mé vězně docela hodí."
 feast_default.6351.t: "Vedlejší škody"
 feast_default.6351.desc_intro: "Sotva se stihnu posadit, ozve se výkřik [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]. Zdá se, že se [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip] a [feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip] do sebe opravdu pustili, protože [feast_default_6351_fighter_1.GetFirstNameNoTooltip] právě dává [feast_default_6351_fighter_2.GetFirstNameNoTooltip] pořádnou nakládačku. Příliš pozdě si uvědomím, že jejich rvačka si prorazila cestu přímo přes [feast_target_artifact.GetName]!"
 feast_default.6351.desc_calm: "\n\nPokynu svým strážným, aby od sebe oba rozzuřené rváče odtrhli."
 feast_default.6351.desc_wrathful: "\n\nZařvu na ně přes celý sál: „#EMP Co to má znamenat?!#!“"
 feast_default.6351.desc_outro: "\n\nOba jsou předvedeni přede mě a celou dobu jeden druhého obviňují z toho, že rvačku začal právě ten druhý."
 feast_default.6351.a: "[feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip], jak jsi mohl[Select_CString(feast_default_6351_fighter_1.IsFemale,'a','')]?"
 feast_default.6351.a_wrathful: "[feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip], #EMP jak se opovažuješ!#!"
 feast_default.6351.a.tt: "Nech [feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip] zaplatit za škodu."
 feast_default.6351.b: "Proč ses nechal[Select_CString(feast_default_6351_fighter_2.IsFemale,'a vyprovokovat',' vyprovokovat')] [feast_default_6351_fighter_1.GetTitledFirstNameNoTooltip], [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]?"
 feast_default.6351.b_wrathful: "Dochází mi trpělivost, [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip]..."
 feast_default.6351.b.tt: "Nech [feast_default_6351_fighter_2.GetTitledFirstNameNoTooltip] zaplatit za škodu."
 feast_default.6351.c: "Nezáleží na tom, kdo začal. Odpovědnost nesete oba."
 feast_default.6351.c_wrathful: "#EMP Dost!#! Za škodu zaplatíte oba."
 feast_default.6351.c.tt: "Nech oba zaplatit za škodu."
 feast_default.6351.d: "[ROOT.Char.GetFaith.HighGodName] by si přál, abych nastavil i druhou tvář."
 feast_default.6351.d.tt: "Ať [ROOT.Char.GetFaith.HighGodName] rozhodne, co s nimi."
 feast_default.6351.e: "To se stává. Stejně to nebyl můj oblíbený kus."
 feast_default.6351.e_wrathful: "#EMP Máte štěstí, vy tupci#!, že jsem ten kus stejně nikdy neměl[Select_CString(ROOT.Char.IsFemale,'a rád',' rád')]..."
 feast_default.6351.e.tt: "Ušetřete je."
 feast_default.6501.t: "Dvojsmysl"
 feast_default.6501.desc.opening: "„[Select_CString(innocent_guest.IsFemale,'Vím, co jsem řekla','Vím, co jsem řekl')], jen nechápu, proč ti to připadá tak vtipné?“\n\n[innocent_guest.GetTitledFirstName] nakloní hlavu na stranu, zatímco já potlačuji smích. Ještě jsem neprozradil[Select_CString(ROOT.Char.IsFemale,'a','')], že to, co [innocent_guest.GetTitledFirstNameNoTooltip] řekl[Select_CString(innocent_guest.IsFemale,'a','')], lze vyložit poněkud oplzle.\n\n"
 feast_default.6501.joke_a: "„Když zmáčkneš hlavičku, vyteče z ní hustá tekutina!“"
 feast_default.6501.joke_b: "„S tímhle nářečím mám potíže a slyšel[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že máš velmi obratný jazýček!“"
 feast_default.6501.joke_c: "„V soudní síni vystavovala na odiv opravdu nádhernou hruď!“"
 feast_default.6501.desc.ending_solo: "\n\nPřipadá to vtipné jen mně? Dokud něco neřeknu, nezjistím to. Má cenu riskovat, že se [innocent_guest.GetFirstNameNoTooltip] kvůli jednomu vtipu ztrapní?"
 feast_default.6501.desc.ending_duo: "\n\nMožná nejsem jediný[Select_CString(ROOT.Char.IsFemale,'á','')] komu to připadá vtipné. [fellow_pervert.GetTitledFirstName] se málem zakucká pitím, když [innocent_guest.GetTitledFirstNameNoTooltip] svou poznámku zopakuje. Možná mají oba stejně oplzlý smysl pro humor jako já, ale také je to může urazit. Dokud něco neřeknu, nezjistím, co si kdo z nich myslí."
 feast_default.6501.a: "Já, ehm... To je jedno..."
 feast_default.6501.b: "Zopakuj, cos řekl[Select_CString(innocent_guest.IsFemale,'a','')], ale pomalu. A pořádně se nad tím zamysli."
 feast_default.6501.b.tt: "#F Riskuješ, že [innocent_guest.GetTitledFirstNameNoTooltip] uvedeš do rozpaků, v naději, že máte stejný smysl pro humor"
 feast_default.6501.b.success: "Dvojsmysl [innocent_guest.GetTitledFirstNameNoTooltip] pobaví"
 feast_default.6501.b.failure: "Tvůj zvrhlý humor [innocent_guest.GetTitledFirstNameNoTooltip] vyděsí"
 feast_default.6510.t: "Pod stolem"
 feast_default.6510.desc.intro: "Ke stolu míří další chod a jediné, co vidím, je podezřelá kaše na talíři, která se svíjí, jako by byla živá. Žaludek mě varovně zatahá a další chod bych s radostí vynechal[Select_CString(ROOT.Char.IsFemale,'a','')]... [ROOT.Char.GetPrimarySpouse.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('primary_spouse'))], si všimne mého znechucení, nakloní se dopředu, přísně si mě změří a nesouhlasně zavrtí hlavou.\n\n[ROOT.Char.GetFaith.PositiveAfterLife|U] mi zřejmě přeje — náhodou zahlédnu"
 feast_default.6510.desc.cat: "kočku jménem [ROOT.Char.Custom('CatStoryName')] na podlaze"
 feast_default.6510.desc.dog: "psa jménem [ROOT.Char.Custom('DogStoryName')] na podlaze"
 feast_default.6510.desc_cat_and_dog: "své mazlíčky [ROOT.Char.Custom('CatStoryName')] a [ROOT.Char.Custom('DogStoryName')] na podlaze"
 feast_default.6510.desc.outro: "při hledání zbytků. Tohle je moje šance vyhnout se tomu nepoživatelnému jídlu!"
 feast_default.6510.a: "„#EMP Pojď sem...#!“"
 feast_default.6510.a.tt.success: "Zdá se, že si toho nikdo nevšimne"
 feast_default.6510.a.tt.failure: "Zdá se, že si toho všimnou všichni"
 feast_default.6510.b: "Tak se raději obrním..."
 feast_default.6510.b.tt.success: "Cítím se lépe, než jsem čekal[Select_CString(ROOT.Char.IsFemale,'a','')]"
 feast_default.6510.b.tt.failure: "Není mi vůbec dobře"
 feast_default.6510.c: "Já rozhoduji, co budu jíst!"
 feast_default.8001.t.fire: "Z doutnání v plameny"
 feast_default.8001.t.knights: "Nejlépe chutná za studena"
 feast_default.8001.desc.sadistic: "Plameny olizují střechu a nocí se rozléhá křik. Opřu se zády o zavřené dveře, nevšímám si zděšených tváří svých obětí a usměji se. Nechat doutnající zášť vzplanout je skutečně nejlepší způsob, jak se vypořádat s odporem!\n\nKdyž údery z druhé strany postupně slábnou, konečně si dovolím zasmát se."
 feast_default.8001.desc.compassionate: "Nedokážu odtrhnout oči od talíře. [ROOT.Char.Custom('RegionalEdibleMeat')] zůstává téměř nedotčené. Můj [ROOT.Char.Custom('GetExpensiveDrink_Singular')] také. Vyhýbám se [honorary_guest.GetTitledFirstName], když přijde řeč na [honorary_guest.Custom('herhis_subject_of_interest')]. Hanba.\n\n„Promiň,“ omluvím se a rychle opustím místnost. Těžce oddechuji. Je to něco, co se #EMP musí#! udělat. Pokynu jednomu ze služebníků a zavřu oči.\n\nNejdřív plameny. Pak křik."
 feast_default.8001.desc.just: "Všichni ostatní už odešli. Všichni kromě [honorary_guest.GetTitledFirstName] a velkolepého doprovodu. Napiji se z poháru, zatímco [ROOT.GetCharacter.Custom('GetIncidentalDetailPresent')]. Nesmějí nic tušit. „Omluvte mě.“ Než odejdu, střetnu se pohledem s [honorary_guest.GetTitledFirstName]. Nikdo se to nesmí dozvědět. Nikdo se to nedozví.\n\nKdyž vydám rozkaz zavřít dveře, na okamžik se zastavím a nadechnu. Co je správné, nemusí být vždy laskavé.\n\nBrzy se objeví plameny a po nich přijde křik."
 feast_default.8001.desc.random_1: "Rozhovor s [honorary_guest.GetTitledFirstName] nemůže být srdečnější. Zatímco pokračuje dlouhá přednáška o [honorary_guest.Custom('herhis_subject_of_interest')], můj pohled sklouzne k [host.Custom('GetExpensiveDrink_Singular')]. Všichni ostatní hosté už odešli. Samozřejmě, nikdo by přece nechtěl rušit důležité záležitosti, o nichž chce čestný host hovořit.\n\nJed nemá žádnou chuť. Nelze ho odhalit."
 feast_default.8001.desc.random_2: "Hudba a tanec zesílily natolik, že se téměř nedá mluvit. Číšník znovu naplní pohár a naše pohledy se na jediný okamžik setkají.\n\n„[ROOT.Char.GetHouse.GetMotto],“ zamumlám, zatímco se [honorary_guest.GetFirstNameNoTooltip] začne dusit jedem."
 feast_default.8001.a: "Konečně... Jsou pryč."
 medieval_dance_carole: "karola"
 medieval_dance_round: "kruhový tanec"
 medieval_dance_ring: "kolový tanec"
 medieval_dance_estampie: "estampie"
 medieval_dance_couple: "párový tanec"
 medieval_dance_syrtos: "syrtos"
 medieval_dance_kerchief: "tanec se šátkem"
 murder_feast_entourage_murder_log_title: "Masakr"
 murder_feast_entourage_murder_log: "[CHARACTER.GetShortUIName|U] a celý doprovod záhadně zahynuli"
 murder_feast_solo_murder_log: "[CHARACTER.GetShortUIName|U] záhadně [Select_CString(CHARACTER.IsFemale,'zemřela','zemřel')]"
 murder_feast_solo_murder_log_title: "Nešťastná příhoda"
 feast_default.8002.t: "Nůž ve tmě"
 feast_default.8002.t.poison: "Ještě jeden pohár"
 feast_default.8002.desc.random_2: "Konečně. Jen já a [honorary_guest.GetTitledFirstName]. Úplně sami. „Pár slov.“ Všichni ostatní hosté se už dali do tance a hudba k nám přes kamenné zdi doléhá jen tlumeně. Ozvěna. Možná se ozvěna po [honorary_guest.GetTitledFirstNameNoTooltip] ponese stejně daleko.\n\n[honorary_guest.GetFirstNameNoTooltip] pozvedne obočí. Jeden z mých $knight_culture_player_plural_no_tooltip_lowercase$ dolévá další pití. „Je něco důležitého?“ zazní otázka. Pohár se téměř dotkne rtů. Téměř. Tlumený zvuk za kamennými zdmi. [honorary_guest.GetFirstNameNoTooltip] padá s podříznutým hrdlem. Ozvěna."
 feast_default.8002.desc.sadistic: "„Pojď sem, [honorary_guest.GetFirstName], ukážu ti novou brož, kterou jsem nechal[Select_CString(ROOT.Char.IsFemale,'a','')] vyrobit. Nádherný dar pro tak vzácnou návštěvu.“\n\nJdu napřed a [honorary_guest.GetTitledFirstNameNoTooltip] mě následuje, zatímco [ROOT.GetCharacter.Custom('GetIncidentalDetailPresent')]. „Tady je,“ oznámím a otevřu dveře do malé, spoře osvětlené místnosti. V očích [honorary_guest.GetTitledFirstNameNoTooltip] zahlédnu zmatek, ale jen na okamžik. Pochopení přichází rychle. „Ne... to nemůžeš.“\n\n„Ale ano. Ujišťuji tě, že můžu.“"
 feast_default.8002.desc.just: "Ta chvíle nadešla. Sleduji [honorary_guest.GetTitledFirstName], zatímco [honorary_guest.Custom('quirk_pos_present')]. Je to škoda, ale musí se to udělat. „Mohu tě požádat o krátkou procházku?“ Na otázku přijde ochotná odpověď doprovázená zvídavým úsměvem. „Jaké záležitosti vlády chce [ROOT.Char.GetTitleAsNameNoTooltip] probrat?“\n\nMnohé. Brzy o jednu méně.\n\nVedou nás kroky do jedné z nejmenších komnat. Dveře se zavřou. Oheň vzplane. Čistá práce."
 feast_default.8002.a: "Je hotovo."
 feast_default.8003.t: "Nešťastná náhoda"
 feast_default.8003.desc.poison: "Zdá se, že všichni hosté věnují pozornost zpěvu a tanci. Jen málokdo ještě sedí. Naštěstí můj rozhovor s [honorary_guest.GetTitledFirstName] stačí k tomu, aby [honorary_guest.GetTitledFirstNameNoTooltip] zůstal[Select_CString(honorary_guest.IsFemale,'a poblíž',' poblíž')]. „Výborná hostina,“ pronese a odloží pohár, aby si mohl[Select_CString(honorary_guest.IsFemale,'a','')] vzít další sousto.\n\n„Ach, to mě hřeje u srdce,“ odpovím a dám znamení číšníkovi. Tohle bude poslední hostina [honorary_guest.GetTitledFirstNameNoTooltip]. Naše pohledy se setkají. Na okamžik zaváhám."
 feast_default.8003.desc.compassionate: "Rychle si otřu kapky potu stékající z čela a svírám kapesník silněji, než je třeba. [honorary_guest.GetTitledFirstName] hovoří o [honorary_guest.Custom('subject_of_interest')] a já nedokážu udržet pozornost. „Na okamžik...“ omluvím se, když vidím, jak [honorary_guest.GetTitledFirstNameNoTooltip] zvedá pohár ke rtům.\n\nVím, co v něm je."
 feast_default.8003.desc.sadistic: "„Prosím, dovol mi dolít ti pohár. [Select_CString(honorary_guest.IsFemale,'Jsi mou nejmilejší hostkou','Jsi mým nejmilejším hostem')],“ nabídnu se s tím nejvřelejším úsměvem. [honorary_guest.GetTitledFirstName] přikývne a podá mi pohár. Hosté začali tančit [ROOT.Char.Custom('GetMedievalDance')] a jejich hlahol poskytuje dostatečné rozptýlení.\n\nS nejvyšší opatrností naliji do poháru jed ze svého prstenu. „Doufám, že máš žízeň.“"
 feast_default.8003.a: "#EMP Přípitek.#!"
 feast_default.8003.a.success: "[honorary_guest.GetShortUIName] se napije z poháru"
 feast_default.8003.a.failure: "[honorary_guest.GetShortUIName] se nenapije"
 feast_default.8004.t: "Měj oči otevřené"
 feast_default.8004.desc.intro: "Napiji se svého [host.Custom('RegionalDrink')], zatímco se večer chýlí ke konci. Oči mám unavené, ale"
 feast_default.8004.desc.goh_intro: "[host.GetTitledFirstName] trvá na tom, abych zůstal[Select_CString(ROOT.Char.IsFemale,'a','')] a probral[Select_CString(ROOT.Char.IsFemale,'a','')] záležitosti panství. „Jak jsem říkal[Select_CString(host.IsFemale,'a','')],“ pokračuje [host.GetTitledFirstNameNoTooltip] a nevšímá si mého potlačovaného zívání.\n\n"
 feast_default.8004.desc.goh_solo: "$feast_default.8004.desc.goh_intro$když znovu otevřu oči, spatřím stříbrný záblesk. „Tady hostina končí.“"
 feast_default.8004.desc.goh_group: "$feast_default.8004.desc.goh_intro$„Pomoc!“ Rozhovor přeruší výkřik. „#EMP Pomoc!#!“ A další. Když se rozhlédnu, spatřím stříbrné záblesky mečů. A jeden z nich míří přímo na mě.\n\n„Je konec, [murder_victim.GetTitleAsNameNoTooltip].“"
 feast_default.8004.desc.fallback: "[host.GetTitledFirstName] trvá na tom, aby [honorary_guest.GetTitledFirstName] zůstal[Select_CString(honorary_guest.IsFemale,'a','')] na jeden velice, velice důležitý rozhovor. A samozřejmě musí zůstat i celý doprovod."
 feast_default.8004.a: "Počkat... co se děje?"
 feast_default.8004.a.tt.success: "Zemřeš"
 feast_default.8004.a.tt.success.host: "[murder_victim.GetShortUIName] [Select_CString(murder_victim.IsFemale,'zemřela','zemřel')]"
 feast_default.8004.a.tt.failure: "Přežiješ"
 feast_default.8004.a.tt.failure.host: "[murder_victim.GetShortUIName] [Select_CString(murder_victim.IsFemale,'přežila','přežil')]"
 feast_default.8004.a.goh_murder.tt: "[honorary_guest.GetShortUIName] [Select_CString(honorary_guest.IsFemale,'zemře','zemře')]"
 every_attending_travel_companion_goh: "Každý člen doprovodu"
 feast_default.8052.t: "Náhlý konec"
 feast_default.8052.desc: "„Hoří!“\n\nZatímco mezi hosty propuká panika, rozhlížím se po [host.Custom2('MyCharacterIntroduction', ROOT.Char)], ale židle zeje prázdnotou.\n\nOheň se šíří rychle. Látky nasáklé [ROOT.Char.Custom('RegionalDrink')] a hosté ověšení šaty hoří snadno. Kůže mi puchýřovatí, #EMP odlupuje se#! a já křičím, ale brzy už ani to nejde, protože valící se kouř dusí mé výkřiky."
 feast_default.8052.a: "Vždycky jsem chtěl[Select_CString(ROOT.Char.IsFemale,'a odejít',' odejít')] ve velkém stylu..."
 feast_default.8061.t.fire: "Hoří! Hoří...?"
 feast_default.8061.t: "$feast.7151.t$"
 feast_default.8061.desc.fire: "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě a několik dalších vyvede z hodovní síně a pak se pokusí zavřít dveře.\n\nNež se to však podaří, zevnitř se ozve křik a všichni účastníci se vyhrnou ven do noci, zatímco síň začínají pohlcovat plameny."
 feast_default.8061.desc.fail: "$feast.7151.desc$"
 feast_default.8061.desc.fail_me: "Po včerejším incidentu se mi stále třesou ruce a žoldnéři, kteří mě měli zabít, skončili ve vězení zásluhou [host.GetTitledFirstName].\n\nTen nepříjemný pocit však jen tak nezmizí."
 feast_default.8061.desc.death_alone: "Když se chystáme opustit hostinu [host.GetTitledFirstNameNoTooltip], nálada je pochmurnější, než jsem doufal[Select_CString(ROOT.Char.IsFemale,'a','')]. Na podlaze bylo nalezeno ještě teplé tělo [murder_guest.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('murder_guest'))].\n\nTěmito zdmi prošla smrt a víno nám v ústech zkyslo."
 feast_default.8061.a: "Tak to vypadá, že hostina skončila."
 feast_default.8061.a.good: "[murder_guest.GetFirstNameNoTooltip]... takhle pryč."
 feast_default.9001.t: "Když mí hosté odcházejí"
 feast_default.9001.desc_exotic: "Všichni míří domů s břichy plnými exotických pochoutek a já mohu hrdě říct, že hostina byla úspěšná!"
 feast_default.9001.desc_lavish: "Všichni hosté odcházejí s břichy nacpanými obsahem mé rozsáhlé spižírny a já mohu hrdě říct, že hostina byla úspěšná!"
 feast_default.9001.desc_meager: "Když hosté konečně skončí boj o poslední zbytky mého skromného pohoštění, s velkou úlevou sleduji, jak odcházejí s volným oblečením a kručícími žaludky."
 feast_default.9001.desc: "Všichni míří ke svým domovům a já mohu hrdě říct, že hostina byla úspěšná!"
 feast_default.9001.spouse: "\n\nZa velkou část úspěchu vděčím [spouse.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], a když [spouse.GetFirstNameNoTooltip] vyprovází posledních několik hostů, cítím jen vděčnost."
 feast_default.9001.no_spouse: "Přesto jsem rád[Select_CString(ROOT.Char.IsFemale,'a','')], že je to prozatím za mnou."
 feast_default.9001.a: "Do příště!"
 feast_default.9002.desc_roughed_up: "\n\nTo byla ale hostina! V mých brašnách končí nakradené příbory i [host.Custom('GetExpensiveMeal')]. Tak dopadne [host.GetFirstNameNoTooltip], když se chová jako [host.Custom2('InsultNoun', ROOT.Char)] a uráží mě!"
 feast_default.9002.desc_exotic: "To byla ale hostina! Před příchodem by mě ani nenapadlo, jaké exotické pochoutky tu ochutnám. Na tuhle hostinu nikdy nezapomenu!"
 feast_default.9002.desc_lavish: "To byla ale hostina! Před příchodem mi šaty volně visely na těle, ale teď se odsud vypotácím dvakrát tak plný[Select_CString(ROOT.Char.IsFemale,'á','')] jídla a veselí než při příchodu! Na tuhle hostinu jen tak nezapomenu!"
 feast_default.9002.desc_meager: "Tohle měla být hostina? Obvykle bych čekal[Select_CString(ROOT.Char.IsFemale,'a','')] mnohem víc jídla. Odcházím odsud s prázdným žaludkem, ale alespoň společnost byla dobrá. Na tuhle hostinu bych nejraději zapomněl[Select_CString(ROOT.Char.IsFemale,'a','')]."
 feast_default.9002.desc: "To byla ale hostina! Na dny strávené tady budu ještě dlouho vzpomínat."
 feast_default.9002.desc_ending: "\n\nTeď je čas smýt ze sebe stopy pití a veselí a znovu se vrátit ke svým povinnostem..."
 feast_default.9002.a: "Sbohem, [host.GetFirstNameNoTooltip]!"
 feast_default.5010.t: "Legendární ticho"
 feast_default.5010.desc: "Uprostřed všech oslav a veselí náhle utichne rozhovor mezi téměř všemi přítomnými. Jedině [rando_guest.GetName|U] ještě pokračuje v hovoru, ale jak se ke mně začínají obracet pohledy, i já mimoděk zmlknu.\n\nMožná je tahle tichá chvíle mou příležitostí promluvit o [ROOT.Char.GetPromotedLegend.GetName]."
 feast_default.5010.a: "[rando_guest.GetFirstName|U], povím ti jeden příběh."
 feast_default.5010.a.success: "[rando_guest.GetFirstName|U] příběh ocení"
 feast_default.5010.a.failure: "[rando_guest.GetFirstName|U] se nudí"
 feast_default.5010.b: "Tu legendu musí slyšet všichni."
 feast_default.5010.c: "Konečně chvíle ticha."
 feast_default.5020.t: "Ticho"
 feast_default.5020.desc: "Korbele o sebe narážejí, hovory duní a dlaně buší do stolů, všechno splývá v chaotickou kakofonii nesmyslného hluku. Cítím, jak mi zvuk pulzuje celým tělem, ale pak kolem mě všechno náhle začne utichat, až zbudou jen útržky slov a občasné uchechtnutí.\n\nV tom tichu se mi cosi rozvíří v srdci a v hlavě se zničehonic zrodí celý projev. Začíná jako šepot, sílí v křik a zoufale se dere ven! Projev o mé legitimitě coby [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 feast_default.5020.a: "Mám důvtip jako [ROOT.Char.GetFaith.TricksterGodName]!"
 feast_default.5020.a.success: "Tvůj projev hosty nadchne"
 feast_default.5020.a.failure: "Tvůj projev hosty příliš neinspiruje"
 feast_default.5020.b: "[ROOT.Char.GetFaith.KnowledgeGodName|U] promlouvá skrze mě!"
 feast_default.5020.c: "Mám srdce i žaludek jako [ROOT.Char.GetFaith.WarGodName]!"
 feast_default.5020.d: "Proč kazit takové ticho?"
 feast_default.3008.t: "Čím vyšší klobouk..."
 feast_default.3008.desc: "Během krátkého útlumu oslav mě zaujme záblesk světla tančící po černém laku [Glossary('Eboshi','EBOSHI_GLOSS')], který má [hat_man.GetFirstName] na hlavě. Není snad přirozené, že světlo vyhledá právě [hat_man.GetFirstNameNoTooltip] a ozáří [Select_CString(hat_man.IsFemale,'ji','ho')] víc než nás ostatní?\n\nCo by si lidé pomysleli, kdyby [hat_man.GetFirstNameNoTooltip] [Select_CString(hat_man.IsFemale,'náhle přišla o eboshi','náhle přišel o eboshi')]? Jak jasně by pak [Select_CString(hat_man.IsFemale,'zářila','zářil')]?! [Select_CString(hat_man.IsFemale,'Rázem by nebyla ničím','Rázem by nebyl ničím')]! Dítě. Snad ani ne člověk."
 feast_default.3008.a: "Ta pokrývka musí dolů!"
 feast_default.3008.b: "Taková závist se nesluší."
 feast_default.3008.c: "Kéž [hat_man.GetFirstNameNoTooltip] pro samé světlo mé úklady neprohlédne."
 feast_default.3008.c.tt: "Tvá [Concept('scheme','intrika')|E] získá [GetModifier('didnt_knock_hat_off_modifier').GetNameWithTooltip]"
 feast_default.3008.c.flavor: "Jméno [hat_man.GetFirstNameNoTooltip] musí být pošpiněno!"
 EBOSHI_GLOSS: "Vysoká lakovaná pokrývka hlavy z tuhého papíru. Šlechtici ji dostávali při dosažení dospělosti a symbolizovala jejich postavení, mužnost a společenskou svébytnost. Chrání 'motodori' neboli vlasový uzel a udržuje jej čistý, a tedy i neposkvrněný."
 feast_default.3009.t: "...tím tvrdší pád."
 feast_default.3009.desc: "Udeřím jako stočená zmije! [Glossary('Eboshi','EBOSHI_GLOSS')] se skutálí po podlaze. [hat_man.GetFirstName|U] se snaží zakrýt svou hanbu, ale všichni teď vidí [Glossary('Motodori','MOTODORI_GLOSS')] v naprostém nepořádku a duchovní zanedbanost je odhalena. Velikášské představy jsou konečně pryč. Nemohl by teď do světla vstoupit někdo jiný?"
 feast_default.3009.a: "Ať začne má chvíle na výsluní!"
 MOTODORI_GLOSS: "Účes s vlasovým uzlem nošený v období Heian. Na rozdíl od pozdějších účesů, jako je 'chonmage', se temeno hlavy nevyholovalo."
 feast_default.3010.t: "Moje eboshi!"
 feast_default.3010.desc: "Oslavy na chvíli utichnou. Na okamžik jako by se zpomalil čas a starosti světa i tíha přítomnosti odezněly.\n\nPak ze stínů vyrazí jako zmije ruka [hat_knocker.GetName] a srazí mi [Glossary('Eboshi','EBOSHI_GLOSS')] z hlavy. Nevěřícně sleduji, jak se kutálí po podlaze. Snažím se zakrýt svou hanbu, ale všichni vidí mé [Glossary('Motodori','MOTODORI_GLOSS')] v naprostém nepořádku a má duchovní zanedbanost je odhalena."
 feast_default.3010.a: "[hat_knocker.GetFirstNameNoTooltip] toho bude litovat!"
 feast_default.3010.a.flavor: "Ještě [hat_knocker.GetFirstNameNoTooltip] pozná, co znamená být zmijí!"
 feast_default.3010.a.tt: "Tvá [Concept('scheme','intrika')|E] získá [GetModifier('scheme_apa_positive_2101_modifier').GetNameWithTooltip]"
 feast_default.3010.b: "[Select_CString(hat_knocker.IsFemale,'Možná jsi toho vypila příliš','Možná jsi toho vypil příliš')], [hat_knocker.GetFirstNameNoTooltip]."
 feast_default.3010.b.flavor: "Nenechám si narušit svůj klid."
