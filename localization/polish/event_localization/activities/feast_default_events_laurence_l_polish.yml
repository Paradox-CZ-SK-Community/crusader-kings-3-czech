l_polish:
 feast_default_laurence.100.t: "Společná věc"
 feast_default_laurence.100.desc: "Když se vracím po krátkém odskočení, přistoupí ke mně [conspiratorial_fellow.GetName] s ocelovým pohledem. [conspiratorial_fellow.GetTitledFirstNameNoTooltip] mi vypráví o válce [war_memory.MakeScope.Var('war_cb').GetFlagName], kterou [Select_CString(conspiratorial_fellow.IsFemale,'vedla','vedl')] proti [intent_target.GetName]. Skrze zaťaté zuby lituje, že [Select_CString(conspiratorial_fellow.IsFemale,'nevyužila','nevyužil')] příležitosti rozpárat [intent_target.GetTitledFirstNameNoTooltip] od pupku až po čelist. Pak se nakloní blíž a upře na mě oči.\n\n„Ať [ROOT.Char.Custom('RegionalEdibleAnimal')], které vaši kuchaři tak pěkně připravili, není jediným zvířetem, které dnes na hostině skončí na rožni! Stačí, když svým strážím nařídíte, aby nic neviděly a nic neslyšely. O zbytek se postarám.“"
 feast_default_laurence.100.a: "Ať se tvá čepel napije dosyta!"
 feast_default_laurence.100.a.tt.success: "[intent_target.GetTitledFirstName] [Select_CString(intent_target.IsFemale,'krvácela','krvácel')] jako oběť"
 feast_default_laurence.100.a.tt.failure: "[intent_target.GetTitledFirstName] [Select_CString(intent_target.IsFemale,'byla příliš mazaná','byl příliš mazaný')]"
 feast_default_laurence.100.b: "Pomyšlení, že [intent_target.GetTitledFirstNameNoTooltip] zemře, ve mně cosi probouzí, ale zatím budeme jen přihlížet a čekat."
 feast_default_laurence.100.c: "Na ta pošetilá slova zapomeň. Ale pamatuj, že já nezapomenu."
 feast_default_laurence.101.desc: "Můj hostitel se ze všech sil snažil připravit znamenité pohoštění. Ve srovnání s přepychem, jaký nabízí [intent_target.GetCapitalLocation.GetName], je sice skromné, ale zdejší péči o hosty dokážu ocenit.\n\nNajednou si všimnu, že je v síni nějak méně lidí. Ano, zdá se, že stráže odešly.\n\nNěco mě píchne v boku! Blecha? Svědění náhle vystřídá podivné teplo. Pohlédnu dolů a mezi žebry mi vyrostl jílec čepele. Co tam dělá..."
 feast_default_laurence.101.a: "Smrt si mě našla."
 feast_default_laurence.102.desc: "[Select_CString(ROOT.Char.IsFemale,'Chtěla','Chtěl')] jsem [intent_target.GetName] předat znamení své věrnosti. Tak veliké, že je museli nést všichni mí strážní. Když však odešli z místnosti, aby je přinesli, mému hostu jako naschvál vyrostla mezi žebry čepel.\n\n[conspiratorial_fellow.GetName] se na mě usmívá a oči mu planou odraženým světlem právě zhaslého života."
 feast_default_laurence.102.a: "Ať je tato spolupráce počátkem velkého přátelství."
 feast_default_laurence.102.b: "Proléváním krve zrazuješ mou pohostinnost!"
 feast_default_laurence.102.b.flavor: "Pokusíš se [conspiratorial_fellow.GetTitledFirstNameNoTooltip] uvěznit."
 feast_default_laurence.102.b.tt.success: "Tví strážní [Select_CString(conspiratorial_fellow.IsFemale,'zrádkyni','zrádce')] přemohou."
 feast_default_laurence.102.b.tt.fail: "Tvým strážným se nepodaří [conspiratorial_fellow.GetName] chytit."
