l_polish:
 feasts_mischievous_t1_modifier: "Šibalský úsměv"
 feasts_mischievous_t1_modifier_desc: "Tato postava působí podivně klidně, když se lidem kolem ní přihodí nečekané a trapné nehody."
 feasts_mischievous_t2_modifier: "Šprýmař"
 feasts_mischievous_t2_modifier_desc: "Lidi v okolí této postavy pravidelně stíhají drobné nehody a trapná odhalení."
 feasts_mischievous_t3_modifier: "Potížista"
 feasts_mischievous_t3_modifier_desc: "Dokázat se to nedá, ale je veřejným tajemstvím, že tato postava neustále plánuje svůj další „žertík“."
 feast_learnt_habits_modifier: "Odpozorované návyky"
 feast_learnt_habits_modifier_desc: "Spiklenci znají osobní návyky cíle ve chvílích, kdy je o samotě"
 feast_learnt_habits_modifier.tt: "$feast_learnt_habits_modifier$: $VALUE|+0=-+$"
 didnt_knock_hat_off_modifier: "Oslněn nádherou"
 didnt_knock_hat_off_modifier_desc: "Okázalost cíle se mu stane osudnou!\n[GetScheme('slander').GetTypeName] [Concept('scheme','intrika')|E] [Concept('success_chance','šance na úspěch')|E] #P +20#!"
 didnt_knock_hat_off_modifier.tt: "$didnt_knock_hat_off_modifier$: $VALUE|+0=-+$"
 feast_events_ewan.0001.t: "Vyčistit si hlavu"
 feast_events_ewan.0001.desc.intro: "Málokdo vydrží celou hostinu, aniž by alespoň na chvíli vyšel ven, pryč od všeho toho ruchu, třeba jen proto, aby si odskočil.\n\nNaštěstí pro mě není [intent_target.GetTitledFirstName] výjimkou. Z nedalekého výklenku pozoruji, jak"
 feast_events_ewan.0001.desc.high_place: "[Select_CString(intent_target.IsFemale,'hledí','hledí')] z okna této vysoké osamělé věže. Očividně obdivuje výhled, pro který by člověk zemřel. Jedno pořádné, prudké strčení a všechny mé problémy budou pryč. Navíc to bude vypadat jako nehoda."
 feast_events_ewan.0001.desc.water: "[Select_CString(intent_target.IsFemale,'kráčí','kráčí')] podél břehu [activity.GetHost.Custom('IndefiniteBodyOfWater')] poblíž hradeb. V ruce svírám obušek a stačí [Select_CString(intent_target.IsFemale,'ji','ho')] udeřit dost silně, aby [Select_CString(intent_target.IsFemale,'omdlela','omdlel')]. O zbytek se postará voda a navíc to bude vypadat jako nehoda."
 feast_events_ewan.0001.desc.critter: "[Select_CString(intent_target.IsFemale,'prochází','prochází')] po stezkách nádvoří. V ruce svírám, doufejme dobře zajištěného, jedovatého tvora [SCOPE.Custom('VenomousCreature')]. Je zuřivý a smrtící. Stačí ho hodit na kousek obnažené kůže a nechat ho vykonat svou ničivou práci."
 feast_events_ewan.0001.desc.rock: "[Select_CString(intent_target.IsFemale,'prochází','prochází')] mezi výzdobou nádvoří. Kámen v mé ruce má příjemnou váhu a navíc zlověstně ostrý hrot. Jediný čistý zásah do lebky by měl stačit, aby vykonal své temné dílo."
 feast_events_ewan.0001.desc.outro: "\n\nMám výhodu překvapení, takže pokud se plán zvrtne, útěk by neměl být problém. Bohužel asi nebude třeba dlouhého vyptávání, aby si [intent_target.GetFirstNameNoTooltip] [Select_CString(intent_target.IsFemale,'všimla','všiml')] mé podezřelé nepřítomnosti."
 feast_events_ewan.0001.a: "Dobrá, jedno pořádné strčení a..."
 feast_events_ewan.0001.a.tt.success: "[Select_CString(intent_target.IsFemale,'Letí','Letí')] dolů!"
 feast_events_ewan.0001.a.tt.failure: "[intent_target.GetFirstNameNoTooltip] se vrhne stranou"
 feast_events_ewan.0001.b: "Pořádná rána, pevné strčení a..."
 feast_events_ewan.0001.b.tt.success: "Omráčen[Select_CString(intent_target.IsFemale,'á','ý')], [intent_target.GetFirstNameNoTooltip] se hroutí pod hladinu"
 feast_events_ewan.0001.b.tt.failure: "[intent_target.GetFirstNameNoTooltip] se svalí, ale zůstává při vědomí"
 feast_events_ewan.0001.c: "Hod musí mít #EMP přesně#! tu správnou sílu..."
 feast_events_ewan.0001.c.tt.success: "[SCOPE.Custom('VenomousCreature')] zaútočí"
 feast_events_ewan.0001.c.tt.failure: "Tvor se odrazí a uteče"
 feast_events_ewan.0001.d: "Dobrá, musím [Select_CString(intent_target.IsFemale,'ji','ho')] trefit přímo do hlavy..."
 feast_events_ewan.0001.d.tt.success: "Zasáhneš [Select_CString(intent_target.IsFemale,'ji','ho')] do spánku"
 feast_events_ewan.0001.d.tt.failure: "Mineš"
 feast_events_ewan.0001.e: "Možná bude lepší jen pozorovat?"
 feast_events_ewan.0001.e.tt.bonus_to_murder_scheme.overwrite: "Tím přepíšeš svůj případný bonus k [GetScheme('murder').GetTypeName] [ROOT.Char.Var('feast_events_ewan_0001_bonus_value').GetTitledFirstName]"
 feast_events_ewan.0001.e.tt.bonus_to_murder_scheme: "Po dobu následujících [EmptyScope.ScriptValue('feast_events_ewan_0001_murder_scheme_bonus_time_to_use_value')|0] let získáš #P [EmptyScope.ScriptValue('feast_events_ewan_0001_murder_scheme_bonus_added_base_success_value')|=+0]%#! k šanci na úspěch každé [Concept('scheme','intriky')|E] [GetScheme('murder').GetTypeName], kterou zahájíš proti [intent_target.GetTitledFirstName]"
 feast_events_ewan.0001.f: "Tohle byl pošetilý nápad."
 feast_events_ewan.0201.t: "Večeře s představením"
 feast_events_ewan.0201.desc.intro: "Přímo naproti mně sedí [intent_target.Custom2('MyCharacterIntroduction', ROOT.Char)], což mi nabízí nepřeberné množství způsobů, jak [intent_target.GetFirstNameNoTooltip] dráždit, aniž bych překročil[Select_CString(ROOT.Char.IsFemale,'a hranice slušnosti',' hranice slušnosti')].\n\n"
 feast_events_ewan.0201.desc.meat.dramatic_snap: "„... samozřejmě, všechno je o tom být,“ obratně přelomím v prstech malou kost z [activity.GetHost.Custom('RegionalEdibleAnimal')], „#EMP pevný#!. Nemyslíš?“"
 feast_events_ewan.0201.desc.meat.sink_teeth: "Pomalu a záměrně zabořím zuby do #EMP lahodného#! sousta [activity.GetHost.Custom('RegionalEdibleMeat')]. Jemně, ale pevně maso odtrhnu."
 feast_events_ewan.0201.desc.meat.lick: "Vydatným, ale pomalým olíznutím naberu pořádnou porci omáčky z mého kousku [activity.GetHost.Custom('RegionalEdibleAnimal')]. Celou dobu přitom nespouštím oči z [intent_target.GetFirstNameNoTooltip]."
 feast_events_ewan.0201.desc.veggie.suggestive_gesture: "Pomalu a dráždivě přejíždím prstem po křivkách dvojice [activity.GetHost.Custom('RegionalRootVegetablePlural')] a něžným dotykem zeleninu provokuji. Nakonec po jejím povrchu lehounce přejedu nehtem a zanechám sotva znatelný škrábanec."
 feast_events_ewan.0201.desc.veggie.sink_teeth: "S chutí se pevně zakousnu do obrovského, šťavnatého a #EMP pevného#! kusu [activity.GetHost.Custom('RegionalRootVegetable')]. Trocha šťávy mi vyteče na bradu a já si spokojeně olíznu rty."
 feast_events_ewan.0201.desc.veggie.deep_bite: "S teatrálním gestem si zvednutou rukou vhodím do úst malý kousek [activity.GetHost.Custom('RegionalRootVegetable')] a s #EMP hlasitým#! potěšením polknu. Pro větší účinek dokonce trochu zakoulím očima."
 feast_events_ewan.0201.desc.outro: "\n\nPodle výrazu ve tváři [intent_target.GetFirstNameNoTooltip] vidím, že mé poselství bylo pochopeno. Co však nedokážu rozeznat, je význam toho výrazu. Je to žádostivý zájem, nebo převracející se žaludek? Znepokojivě těžko říct."
 feast_events_ewan.0201.a: "Možná ještě jedno sousto, ať je to naprosto jasné."
 feast_events_ewan.0201.a.tt.success: "Ale, [ROOT.Char.GetFirstNameNoTooltip]..."
 feast_events_ewan.0201.a.tt.failure: "Co to #EMP děláš#!?"
 feast_events_ewan.0201.b: "Tohle nefunguje. Možná [intent_target.GetFirstNameNoTooltip] dává přednost upřímnému rozhovoru?"
 feast_events_ewan.0201.b.tt.success: "Tvůj rozhovor je nakonec zajímavější"
 feast_events_ewan.0201.b.tt.failure: "Při [intent_target.GetFaith.KnowledgeGodName], s tebou je nuda!"
 feast_events_ewan.0201.c: "Tohle je méně... žhavé, než jsem doufal[Select_CString(ROOT.Char.IsFemale,'a','')]."
 feast_events_ewan.0401.t: "Kručení v žaludku"
 feast_events_ewan.0401.desc.intro: "Trvalo mi skoro celý večer dostat se přirozeně do blízkosti [intent_target.GetTitledFirstName], aniž by to působilo nuceně. Ta nejlepší přátelství přece vznikají sama od sebe a chci, aby si [intent_target.GetFirstNameNoTooltip] myslel[Select_CString(intent_target.IsFemale,'a','')], že právě tohle se děje.\n\n"
 feast_events_ewan.0401.desc.target_personality.flamboyant: "„Ať mě [intent_target.GetFaith.WealthGodName] chrání,“ pronese [intent_target.GetFirstNameNoTooltip] a jen stěží potlačí říhnutí. „Tohle byl #EMP těžký#! chod. A tak brzy po tom předchozím! V žaludku to sedí jako kámen. Nechápu, jak služebnictvo očekává, že bude dál sloužit [activity.GetHost.Custom('MistressMaster')], když pracuje tak mizerně.“"
 feast_events_ewan.0401.desc.target_personality.sedate: "[intent_target.GetWomanMan] se jen nimrá v jídle a přesouvá několik drobných soust po mastném dřevěném talíři.\n\n„Je to všechno trochu... těžké, nemyslíš? Tenhle chod, předchozí chod, ten před #EMP ním#! a,“ [intent_target.GetFirstNameNoTooltip] nervózně sleduje sluhu přinášejícího další várku pokrmů, „i ten další. Tolik vydatného jídla za sebou, když bychom ve skutečnosti potřebovali nějaké nápadité osvěžení patra.“"
 feast_events_ewan.0401.desc.target_personality.fallback: "[intent_target.GetWomanMan] si rohem ušpiněného ubrusu jemně otírá koutky úst od drobků křehkého pečiva.\n\n„Jen doufám, že další chod bude trochu lehčí,“ poznamená [intent_target.GetFirstNameNoTooltip]. „Smyslem hostiny je nabídnout bohatý a pestrý kulinářský zážitek, ale zatím mám spíš pocit, že se nás snaží nacpat k prasknutí, než něčím nadchnout.“"
 feast_events_ewan.0401.a: "Ano... myslím, že to prostě nebyla šťastná volba."
 feast_events_ewan.0401.a.tt.success: "[intent_target.GetFirstNameNoTooltip] je tebou naprosto okouzlen[Select_CString(intent_target.IsFemale,'a','')]"
 feast_events_ewan.0401.a.tt.partial_success: "[intent_target.GetFirstNameNoTooltip] si s tebou chce ještě popovídat"
 feast_events_ewan.0401.a.tt.failure: "Jsi zábavný[Select_CString(ROOT.Char.IsFemale,'á','')], ale ne zas tolik"
 feast_events_ewan.0401.b: "„Ty... #EMP víš#!, že tohle je moje hostina, že ano?“"
 feast_events_ewan.0401.c: "Hlasitě vychvalovat zdejší jídlo."
 feast_events_ewan.0401.d: "Stočit rozhovor k něčemu méně spornému."
 feast_events_ewan.0601.t: "Jen nevinný žertík"
 feast_events_ewan.0601.desc.intro: "Kuchyně je podle mě vždy tím nejlepším místem pro trochu #EMP rošťáctví#!. Tedy pokud tě při tom nechytí služebnictvo.\n\nTolik možných cílů a tak málo času. Mám se pustit do tácu s [activity.GetHost.Custom('GetExpensiveDrink')], do honosného hlavního chodu, nebo do malého stolku s drobnými pokrmy mezi jednotlivými chody?\n\nAť už si vyberu cokoli, mám připravenou přesně tu věc, která někomu zaručeně zkazí večer..."
 feast_events_ewan.0601.desc.dead_rat: "obzvlášť páchnoucí mrtvou krysu, která už je skoro připravená prasknout."
 feast_events_ewan.0601.desc.humongous_beetle: "obrovského, momentálně vyčerpaného brouka. Po pořádném odpočinku by se ale měl zase pěkně vrtět."
 feast_events_ewan.0601.desc.raw_eyeball: "jediné obrovské syrové oko."
 feast_events_ewan.0601.desc.used_sponge: "houbu, která byla velmi... zřetelně #EMP použitá#!."
 feast_events_ewan.0601.desc.rotten_vegetable: "zapáchající [activity.GetHost.Custom('RegionalRootVegetable')], tak prolezlou plísní, že mě samotného překvapuje, že se mi ji podařilo ukrýt."
 feast_events_ewan.0601.desc.dodgy_mushroom: "houbu, o níž jsem téměř přesvědčen[Select_CString(ROOT.Char.IsFemale,'a','')], že každého pošle tryskem na latrínu. Nejspíš na celý zbytek večera."
 feast_events_ewan.0601.desc.hank_of_hair: "malý chomáč chlupů z jednoho zvířete na nádvoří. Z hlavy rozhodně nejsou."
 feast_events_ewan.0601.a: "Znečistit nápoje."
 feast_events_ewan.0601.a.tt.success: "Vklouzneš dovnitř a ven jako démonův šepot"
 feast_events_ewan.0601.a.tt.failure: "Na nenápadnost ti schází potřebná obratnost"
 feast_events_ewan.0601.b: "Zkazit honosný hlavní chod."
 feast_events_ewan.0601.b.tt.success: "$feast_events_ewan.0601.a.tt.success$"
 feast_events_ewan.0601.b.tt.failure: "$feast_events_ewan.0601.a.tt.failure$"
 feast_events_ewan.0601.c: "Pokazit mezichod."
 feast_events_ewan.0601.c.tt.success: "$feast_events_ewan.0601.a.tt.success$"
 feast_events_ewan.0601.c.tt.failure: "$feast_events_ewan.0601.a.tt.failure$"
 feast_events_ewan.0601.d: "Tohle je pod mou úroveň."
 feast_events_ewan.0801.t: "Příjemná atmosféra"
 feast_events_ewan.0801.desc.intro: "Ach, existuje snad něco veselejšího než pořádná hostina?\n\nHosté proudí sem a tam, jedí a rozmlouvají, zatímco mihotavé světlo pochodní tančí po stěnách a odráží se sálem jako smích."
 feast_events_ewan.0801.desc.lustful: "Tolik lákavých... #EMP pokrmů#! k [ROOT.Char.Custom('SenseObserve_EyeTaste')], tolik příležitostí ke kradmým pohledům, možná i k tajnému dostaveníčku.\n\nNebo dvěma."
 feast_events_ewan.0801.desc.chaste: "Je prostě příjemné vidět tolik lidí, jak se baví, aniž by se museli oddávat tělesným rozkoším."
 feast_events_ewan.0801.desc.gluttonous: "A to jídlo! Ach, to jídlo... [ROOT.Char.GetFaith.HealthGodName] je mi svědkem, #EMP miluji#! pořádnou vydatnou hostinu. Nebo rovnou pět."
 feast_events_ewan.0801.desc.temperate: "\n\nSamozřejmě mě ty přezdobené pokrmy příliš nelákají, ale mohu si užívat příjemné společnosti a dobré nálady, zatímco pomalu uždibuji ze svého kusu chleba."
 feast_events_ewan.0801.desc.greedy: "\n\nNa hostině je každý po něčem trochu lačný. Je vlastně uklidňující vidět svět pro změnu tak #EMP upřímný#!."
 feast_events_ewan.0801.desc.generous: "\n\nNa tom, když člověk nasytí druhé, společně s nimi láme chléb a sdílí pohár pod jednou střechou, je něco prostě nádherného."
 feast_events_ewan.0801.desc.lazy: "A já? Nemusím ani hnout prstem. Lidé, jídlo, pití, polštáře i sluhové přicházejí za mnou, aniž bych se musel[Select_CString(ROOT.Char.IsFemale,'a zvednout',' zvednout')]. #EMP Dokonalost#!."
 feast_events_ewan.0801.desc.diligent: "Sladit tolik lidí a služebnictva je nedoceněná práce plná nenápadných obtíží, a je radost vidět, když ji někdo zvládá dobře."
 feast_events_ewan.0801.desc.wrathful: "Občas #EMP dokážu#!... trochu vybuchnout. Ale tady a teď jsem [Select_CString(ROOT.Char.IsFemale,'klidná','klidný')], možná až rozvážně [Select_CString(ROOT.Char.IsFemale,'pokojná','pokojný')].\n\nTa změna tempa je příjemná."
 feast_events_ewan.0801.desc.calm: "\n\nNěkteří lidé považují hostinu za chaotické místo, ale pro mě je ostrůvkem klidu a společenské harmonie. S plným břichem a pohárem po ruce se přece každý uvolní snáz."
 feast_events_ewan.0801.desc.patient: "\n\nDokonce si užívám čekání mezi jednotlivými chody. Není to jen příležitost k smíchu a hovoru, ale i čas zamyslet se nad tím, co jsme právě snědli a kolik úsilí do toho někdo vložil."
 feast_events_ewan.0801.desc.impatient: "\n\nPořádná hostina je jedním z mála míst, kde člověk skoro na nic nemusí čekat. Chceš jídlo? Už je tu. Potřebuješ napít? Nalijí ti. Chceš si popovídat? Dobrá společnost je všude kolem. Blaženost."
 feast_events_ewan.0801.desc.arrogant: "\n\nProspívá mi čas od času se takhle stýkat s některými níže postavenými, s [ROOT.Char.Custom('FootFeet')] pohodlně opřenými o stoličku a s blahosklonností rozdávanou davům bezvýznamné šlechty."
 feast_events_ewan.0801.desc.humble: "Tolik lidí přijelo ze všech koutů panství jen proto, aby tu mohli být. Člověk si díky tomu opravdu uvědomí, jak obrovský je svět."
 feast_events_ewan.0801.desc.deceitful: "\n\nUž jsem mezi hosty vypustil[Select_CString(ROOT.Char.IsFemale,'a několik klepů',' několik klepů')], jen tak pro zábavu. Je docela vzrušující sledovat, jak rychle se dokáže šířit lež, i když za ní nestojí nic jiného než chuť způsobit trochu chaosu."
 feast_events_ewan.0801.desc.honest: "Jen máloco vystihuje lidský život pravdivěji než toto. Tak otevřené, tak upřímné. Prostě lidé, kteří si užívají společnost ostatních."
 feast_events_ewan.0801.desc.craven: "Na tom, když je člověk obklopen tolika lidmi, je něco uklidňujícího. Jako by se snad vůbec nic nemohlo pokazit.\n\nSnad."
 feast_events_ewan.0801.desc.brave: "Jsme pestrá sebranka, to ano, ale právě teď mám pocit, že by tahle společnost mohla vyrazit proti celému světu a zvítězit."
 feast_events_ewan.0801.desc.shy: "Spokojeně sedím v koutě a povídám si s několika zajímavými lidmi.\n\nJe příjemné mít jednou možnost být mezi lidmi, aniž by mě to celé zahltilo."
 feast_events_ewan.0801.desc.gregarious: "\n\nŠkoda, že jsme nemohli pozvat ještě víc hostů, třeba aspoň o jeden nebo dva stoly. Ne každý má ale společenského ducha. Možná ne každý, ale #EMP já#! ano, a sám[Select_CString(ROOT.Char.IsFemale,'a vydám',' vydám')] za jeden či dva plné stoly!"
 feast_events_ewan.0801.desc.ambitious: "Tolik příležitostí mluvit, seznamovat se, diskutovat a plánovat. Každý nový rozhovor je semenem dalšího cíle a každý chod záminkou k získání dalšího kontaktu."
 feast_events_ewan.0801.desc.content: "Nenapadá mě jediná věc, kterou bych změnil[Select_CString(ROOT.Char.IsFemale,'a','')]. Je to prostě... dokonalé."
 feast_events_ewan.0801.desc.arbitrary: "\n\nSamozřejmě není úplně všechno podle mého gusta, ale tak už to na podobných setkáních chodí. Příště bude všechno zase jiné a právě ta proměnlivost dává člověku něco, na co se může těšit."
 feast_events_ewan.0801.desc.just: "\n\nVždy mě těšilo pozorovat přirozený řád hostiny. Stoly úhledně rozestavěné, společenské postavení tiše dodržované, všichni spokojení, smějící se a přesně tam, kam patří. Přesně tam, kde mají být."
 feast_events_ewan.0801.desc.cynical: "Samozřejmě, většina z nich je tu jen proto, aby se najedla a napila na cizí účet, ale kdo jsem, abych je soudil[Select_CString(ROOT.Char.IsFemale,'a','')]? Těžko jim takovou volbu zazlívat a to jídlo je #EMP vynikající#!."
 feast_events_ewan.0801.desc.zealous: "\n\nTiše pronesu krátkou modlitbu a [ROOT.Char.GetFaith.HealthGodName] vyslovím jako poděkování za další úžasný chod, který je právě na cestě. Toto Stvoření, jehož původcem je [ROOT.Char.GetFaith.CreatorName], je skutečně plné divů a dobré jídlo rozhodně nepatří k těm nejmenším."
 feast_events_ewan.0801.desc.paranoid: "\n\nNeustále vyhlížím sebemenší náznak nebezpečí, úmyslného či náhodného, plánovaného či spontánního. Je ho přesně tolik, kolik očekávám. Ne tolik, aby byla intrika očividná, ale ani tak málo, aby bylo zřejmé, že ji někdo skrývá. Přesně tak to mám rád[Select_CString(ROOT.Char.IsFemale,'a','')]."
 feast_events_ewan.0801.desc.trusting: "\n\nKdyž jsou všichni v tak dobré náladě a kolem je tolik skvělého jídla k ochutnání, kdo by sem mohl přinést zlý úmysl? Ne, tohle je radostná událost a já se raduji s ní."
 feast_events_ewan.0801.desc.compassionate: "Je nádherné sledovat, jak mezi lidmi tak volně proudí obyčejná lidská laskavost."
 feast_events_ewan.0801.desc.callous: "\n\nNe že by mě #EMP příliš#! trápilo, kdyby se ostatní bavili mizerně, ale příjemnou atmosféru dokážu ocenit. S mírou."
 feast_events_ewan.0801.desc.sadistic: "Křik a vzlyky si užívám stejně jako každý jiný správně naladěný [ROOT.Char.GetTitleAsNameNoTooltip], ale radostný jásot je čas od času také příjemnou změnou."
 feast_events_ewan.0801.desc.stubborn: "Uvažoval[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že vstanu a půjdu se procházet jako tolik ostatních, ale to by znamenalo vzdát se svého místa, a to ať jsem [Select_CString(ROOT.Char.IsFemale,'prokletá','prokletý')], jestli udělám."
 feast_events_ewan.0801.desc.fickle: "Myslím, že na hostinách mám nejraději #EMP jídlo#!. Ne, lidi. Vlastně možná pití? Nebo zábavu, nebo..."
 feast_events_ewan.0801.desc.vengeful: "\n\nNemalá část veselí samozřejmě míří na sluhu, kterému jsem právě [Select_CString(ROOT.Char.IsFemale,'podrazila','podrazil')] nohy a který teď leží celý obalený kluzkými předkrmy. Dobře mu tak, parchantovi, když mi u minulého chodu zapomněl dolít pohár."
 feast_events_ewan.0801.desc.forgiving: "\n\nTrochu mě mrzí, že služebnictvo při poslední obchůzce minulo můj pohár, ale vždycky přijde další chod. Vlastně právě to je na hostině tak krásné. #EMP Vždycky#! přijde další chod."
 feast_events_ewan.0801.desc.outro: "\n\nNěkdy je příjemné prostě se pohodlně usadit a užívat si drobných radostí života."
 feast_events_ewan.0801.a: "Přesně tady chci být."
 feast_events_ewan.0801.b: "Je tu spousta příjemných lidí, s nimiž se dá pobavit."
 feast_events_ewan.0801.c: "Příležitost ukázat se ve společnosti těch nejváženějších!"
