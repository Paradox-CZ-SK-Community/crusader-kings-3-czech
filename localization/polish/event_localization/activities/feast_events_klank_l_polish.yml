l_polish:
 feast_events_klank.1001.t: "Způsoby mučení"
 feast_events_klank.1001.desc: "„Kde je nejlepší začít řezat?“ ptá se můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('fellow_torturer'))] [fellow_torturer.GetName] s dýkou v ruce a s upřímným zaujetím v hlase. Opravdu [fellow_torturer.GetWomanMan] podle mého gusta. Hostina může být setkáním spřízněných myslí a příležitostí zdokonalit své řemeslo, nejen nudnou záminkou k obžerství. \n\n„Podle mých zkušeností křičí nejhlasitěji, když jako první přijde na řadu [ROOT.Char.Custom('GetRandomBodyPart')]. Jsem o tom [Select_CString(ROOT.Char.IsFemale,'přesvědčena','přesvědčen')]... Takhle je nejlepší začít.“\n\n[terrified_onlooker.GetName] mlčky zírá z kouta."
 feast_events_klank.1001.a: "Nejdřív jim před očima zamávat něčím... [ROOT.Char.Custom('DeviantObjectArticle')]"
 feast_events_klank.1001.b: "Máš naprostou pravdu!"
 feast_events_klank.1001.c: "Kniha jako #EMP [SCOPE.Custom('RandomEntertainmentTextName')]#! dokáže inspirovat."
