l_polish:
 feast_option_type: "Důvod hostiny"
 feast_type_generic: "Hostina"
 feast_type_generic_desc: "$EFFECT_LIST_BULLET$ Události nabídnou příležitosti ke zvýšení [Concept('opinion','mínění')|E]\n$EFFECT_LIST_BULLET$ Některé možnosti umožní snížit [Concept('stress','stres')|E]\n\n#weak Potřebuje snad hostina #EMP nějaký#! důvod?#!"
 feast_type_murder: "Vražedná hostina"
 feast_type_murder_desc: "$EFFECT_LIST_BULLET$ Zvolíš způsob, jak zavraždit čestného hosta a jeho doprovod\n\n#weak Nezveš hosty. Lákáš oběti.#!\n\n@warning_icon! #X Po dobu 15 let nebudeš moci uspořádat vražednou [GetActivityType('activity_feast').GetName]#!\n@warning_icon! #X Pokud se zaměříš na svého [Concept('liege','lenního pána')|E] nebo [Concept('head_of_faith','hlavu víry')|E], postihy budou vyšší#!\n\n@alert_icon! #alert_trial Postavy s traity [GetTrait('just').GetName( GetNullCharacter )], [GetTrait('compassionate').GetName( GetNullCharacter )] a [GetTrait('calm').GetName( GetNullCharacter )] získají [Concept('stress','stres')|E]#!"
 feast_option_food: "Náročnost pokrmů"
 feast_food_bad: "Prosté chlebové mísy"
 feast_food_bad_desc: "$EFFECT_LIST_BULLET$ Nižší zisk [Concept('prestige','prestiže')|E]\n\n#weak Každý šlechtic jistě ocení pořádnou porci dobrého prostého jídla víc než všechny ty vyumělkované nesmysly. Že ano?#!"
 feast_food_normal: "Exotické pochoutky"
 feast_food_normal_desc: "$EFFECT_LIST_BULLET$ Střední zisk [Concept('prestige','prestiže')|E]\n\n#weak Každá hostina, která za něco stojí, přece kromě obvyklého přepychu očekávaného šlechtou nabídne i něco neobvyklejšího a vydatnějšího.#!"
 feast_food_good: "Kulinářská umělecká díla"
 feast_food_good_desc: "$EFFECT_LIST_BULLET$ Výrazně vyšší zisk [Concept('prestige','prestiže')|E]\n\n#weak Nacpi #EMP tohle#! do #EMP tamtoho#! a připevni to zpátky tak, aby to vypadalo jako sokol ve vzletu! Pokrm bez příběhu není o mnoho víc než #EMP břečka#!.#!"
 feast_option_courses: "Počet chodů"
 feast_courses_bad: "Dostačující"
 feast_courses_bad_desc: "$EFFECT_LIST_BULLET$ Malé zvýšení [Concept('opinion','mínění')|E]\n$EFFECT_LIST_BULLET$ Velmi malé zvýšení [Concept('opinion','mínění')|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName] [Concept('vassal','vazalů')|E]\n\n#weak Po půl tuctu chodů nebo méně budou hosté jistě sytí. I když zvlášť ohromeni asi nebudou.#!"
 feast_courses_normal: "Přiměřený"
 feast_courses_normal_desc: "$EFFECT_LIST_BULLET$ Střední zvýšení [Concept('opinion','mínění')|E]\n$EFFECT_LIST_BULLET$ Střední zvýšení [Concept('opinion','mínění')|E] [GetVassalStance( 'courtly' ).GetTextIcon] [GetVassalStance( 'courtly' ).GetName] [Concept('vassal','vazalů')|E]\n\n#weak Hostina si žádá jistou míru přehnané hojnosti a tohle očekávání splní.#!"
 feast_courses_good: "Přemrštěný"
 feast_courses_good_desc: "$EFFECT_LIST_BULLET$ Velké zvýšení [Concept('opinion','mínění')|E]\n$EFFECT_LIST_BULLET$ Větší zvýšení [Concept('opinion','mínění')|E] [GetVassalStance( 'courtly' ).GetTextIcon] [GetVassalStance( 'courtly' ).GetName] [Concept('vassal','vazalů')|E]\n\n#weak Přes dva tucty chodů z blízkých i vzdálených zemí! Tradiční pokrmy! Novinky! Polévky! Chody na pročištění chuti! Moučníky, hlavní chody a ještě mnohem víc!#!"
 feast_phase_meal: "Hodování"
 feast_phase_toast: "Závěrečný přípitek"
 every_guest_scope_tt: "Každý host"
 feast.0010.desc: "Proč jsi přijal[Select_CString(ROOT.Char.IsFemale,'a','')] mé pozvání, jen abys místo toho zamířil[Select_CString(ROOT.Char.IsFemale,'a','')] na hostinu [other_host.GetTitledFirstNameNoTooltip], netuším. Ale věz, že na to nezapomenu."
 feast.0010.a: "To je nemilé."
 feast.1501.opening: "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 feast.1501.opening_desc: "Srdečně tě zvu na svou hostinu v [barony.GetNameNoTier]!"
 feast.1501.host_likes_me: "Doufám, že přijdeš. Tvá nepřítomnost by byla bolestně znát."
 feast.1501.host_gets_along_with_me: "Tvá účast by pro mě jakožto významného [ROOT.Char.GetTitleTierName] byla ctí."
 feast.1501.host_dislikes_me: "Očekávám, že dorazí každý, kdo něco znamená, což bohužel zahrnuje i tebe."
 feast.1501.a: "Samozřejmě přijdu."
 feast.1501.b: "Přijdu. Nerad[Select_CString(ROOT.Char.IsFemale,'a','')]."
 feast.1501.c: "S lítostí musím říct, že mám jiné povinnosti."
 feast.1501.d: "Ne, odmítám!"
 feast.1502.desc: "Tímto tě zvu na svou hostinu v [barony.GetNameNoTier]! Bude to velkolepá událost hodná tvé ctěné přítomnosti."
 feast.1502.a: "Bude mi potěšením."
 feast.1502.b: "Musím se věnovat důležitějším záležitostem."
 feast.1503.desc: "Tímto tě zvu na svou hostinu v [barony.GetNameNoTier]! Bude to velkolepá událost plná výtečného jídla a zábavy."
 feast.1503.a: "Bude mi potěšením."
 feast.1503.b: "Musím se věnovat důležitějším záležitostem."
 feast.2001.t: "Veselé shromáždění"
 feast.2001.t_murder: "Ohavné shromáždění"
 feast.2001.desc_intro: "V síni se shromáždili hosté, páni a dámy ze všech koutů panství."
 feast.2001.desc_fallback: "$feast.2001.desc_intro$$feast.2001.desc_outro$"
 feast.2001.desc_gregarious: "$feast.2001.desc_intro$ Po podobné příležitosti jsem už #EMP toužil#!.$feast.2001.desc_outro$"
 feast.2001.desc_shy: "$feast.2001.desc_intro$ Upravím si oděv. Takhle si #EMP zrovna#! dokonalý večer nepředstavuji, ale nedá se nic dělat.$feast.2001.desc_outro$"
 feast.2001.desc_ambitious: "$feast.2001.desc_intro$ Ach, není nad to sledovat, jak se lidé opíjejí... a pak prozradí mnohem víc, než by měli.$feast.2001.desc_outro$"
 feast.2001.desc_nerd: "$feast.2001.desc_intro$ Obvykle dávám před lidmi přednost společnosti knih, ale povinnost je povinnost.$feast.2001.desc_outro$"
 feast.2001.desc_martial: "$feast.2001.desc_intro$ Musím přiznat, že zákaz zbraní oslavám poněkud ubírá na půvabu.$feast.2001.desc_outro$"
 feast.2001.desc_lustful: "$feast.2001.desc_intro$ Tolik... #EMP soust#! na výběr.$feast.2001.desc_outro$"
 feast.2001.desc_outro: "\n\nNálada je skvělá, všichni jsou rozjaření a hostina začíná!"
 feast.2001.desc_murder_feast: "Jak hosté jeden po druhém vstupují do síně, postupně si je prohlížím. [honorary_guest.GetTitledFirstName]... jak se vůbec opovažuje vstoupit do mého domu? A celý ten doprovod... samí mí nepřátelé, nepřátelé panství!\n\nKdyž služebnictvo zapálí oheň ve velkém krbu, náhle mě něco napadne. Co kdyby se téhle pohromy dalo zbavit jednou provždy?"
 feast.2001.a: "Vítejte, přátelé!"
 feast.2001.a.tt: "Hostina začíná"
 feast.2001.b: "[honorary_guest.GetFirstNameNoTooltip] i celý doprovod. Chci je všechny pryč."
 feast.2001.c: "Chci smrt jen [honorary_guest.GetFirstNameNoTooltip]."
 feast.2001.d: "[honorary_guest.GetFirstNameNoTooltip] musí zemřít, ale #EMP nikdo#! mě nesmí podezírat."
 feast.2001.d.tt: "Pokus o atentát může selhat"
 feast.2001.e: "Všichni jsou hosty v mém domě. Nikomu se nic nestane."
 feast.2001.c.people_to_spare: "Všichni, na kterých mi záleží, budou varováni"
 feast.2001.e.tt: "Hostina začíná — a nikomu nebude ublíženo"
 feast.2002.t: "$feast_header$ Opuštěné povinnosti"
 feast.2002.desc: "To je pohroma!\n\nPo všech těch přípravách dorazili hosté na hostinu bez hostitele! Už se vrátili domů a udělal jsem na ně příšerný dojem."
 feast.2002.a: "Toho možná budu litovat."
 feast.2003.t: "$feast_header$ Ubohá oslava"
 feast.2003.desc: "Nemohu tomu uvěřit. Přes všechna pozvání a přípravy na mou hostinu nedorazil jediný host.\n\nNevadí! Všechno to jídlo a víno si užiji sám a ozvěna kroků ve velké síni mi bude jedinou společností!"
 feast.2003.a: "Opravdu tu se mnou nikdo není?"
 feast.2003.b: "Trochu se mi ulevilo."
 feast.2010.t: "$feast_header$ Šťastná náhoda?"
 feast.2010.desc: "[Select_CString(ROOT.Char.IsFemale,'Dozvěděla','Dozvěděl')] jsem se, že můj #EMP velmi zvláštní#! host, [ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName], [Select_CString(ROOT.Var('murder_guest_host_var').GetCharacter.IsFemale,'zemřela','zemřel')] o něco dříve, než se očekávalo. Všichni budeme tuto smrt oplakávat a z úcty k této ztrátě hostinu odvoláme.\n\n#EMP Jen škoda, že to nebylo mou rukou.#!"
 feast.2010.a: "Skutečná škoda."
 feast.2010.a.tt: "Vražedná hostina je zrušena"
 feast.2011.t: "$feast_header$ Nečekaná smrt"
 feast.2011.desc: "Náhlá smrt [host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] nás všechny překvapila a [host.GetTitledFirstName] se rozhodl hostinu z úcty k památce zesnulého odvolat. Koneckonců byla pořádána právě na počest této osoby."
 feast.2011.a: "$feast.2010.a$"
 feast.2011.a.tt: "Hostina je zrušena"
 feast.2020.t: "$feast_header$ Odmítnuté pozvání"
 feast.2020.desc: "Tomu nemohu uvěřit! [ROOT.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] odmítl mé naprosto nepodezřelé pozvání na hostinu! A to dokonce jako můj #EMP velmi zvláštní host#!! Naprosto nepřijatelné!"
 feast.2020.a: "Dříve nebo později tě dostanu, [ROOT.Var('murder_guest_host_var').GetCharacter.GetFirstNameNoTooltip]..."
 feast.2020.a.tt: "$feast.2010.a.tt$"
 feast.2021.t: "$feast.2020.t$"
 feast.2021.desc: "[host.Var('murder_guest_host_var').GetCharacter.GetTitledFirstName] [Select_CString(host.Var('murder_guest_host_var').GetCharacter.IsFemale,'odmítla','odmítl')] pozvání [host.GetTitledFirstName] na hostinu, a ještě k tomu jako zvláštní host! A teď nás [host.GetTitledFirstNameNoTooltip] všechny posílá domů! Být na tom místě já, #EMP nikdy#! bych se z něčeho takového [Select_CString(ROOT.Char.IsFemale,'nevzpamatovala','nevzpamatoval')]."
 feast.2021.a: "$feast.2010.a$"
 feast.2021.a.tt: "$feast.2011.a.tt$"
 feast.2501.t: "Vřelé přivítání"
 feast.2501.likes_host: "Všichni hosté se shromáždili v síni a [host.GetTitledFirstName], [Select_CString(host.IsFemale,'naše laskavá hostitelka','náš laskavý hostitel')], nás všechny [Select_CString(host.IsFemale,'přivítala','přivítal')] na hostině!"
 feast.2501.dislikes_host: "Všichni hosté se shromáždili v síni a [host.GetTitledFirstName], náš [host.Custom2('InsultAdjective', ROOT.Char)] hostitel, nás konečně přivítal na hostině."
 feast.2501.a.gluttonous: "Kuchyni cítím až sem!"
 feast.2501.a.drunkard: "Kde je [ROOT.Char.Custom('RegionalAlcoholicDrink')]?!"
 feast.2501.a.gregarious: "Už se nemohu dočkat, až si se všemi popovídám!"
 feast.2501.a.shy: "Je tu nějak moc lidí..."
 feast.2501.a: "Na tohle se těším!"
 feast.2501.b: "Snad to bude stát za můj čas."
 feast.5003.t: "Konec oslav"
 feast.3601.desc: "Smrtí [host.Custom2('MyCharacterIntroduction', ROOT.Char)] hostina končí.\n\nKdyž sklíčení hosté odcházejí, modlím se, ať [ROOT.Char.GetFaith.HighGodNameAlternate] přijme [host.GetFirstName] v [ROOT.Char.GetFaith.PositiveAfterLife] stejně vřele, jako nás [host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale,'přivítala','přivítal')] ve svých síních."
 feast.3601.a: "Byla to tak zábavná hostina!"
 feast.3601.a.tt: "#F Tedy... dokud [host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale,'nezemřela','nezemřel')].#!"
 feast.5004.desc: "Když teď trčím za mřížemi, má velkolepá hostina musí být zrušena. Ach, všechny ty hodiny příprav... Promarněné!"
 feast.5002.a: "Bez hostitele není hostina."
 feast.5005.desc: "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(host.IsFemale,'skončila','skončil')] ve vězení a velkolepá hostina je u konce. Taková smůla!"
 feast.0050.t: "Umění veselí"
 feast.0050.desc: "Víno, pivo a dobré jídlo! Co může být lepším únikem od starostí světa než noc plná veselí?\n\nS koncem každé hostiny už začínám plánovat další!"
 feast.0050.a: "Kdopak asi přijde?"
 feast.0050.b: "Mám však i jiné zájmy..."
 feast.7002.t: "Krácení chvíle"
 feast.7002.desc_intro: "Služebnictvo pobíhá po síni a dokončuje poslední výzdobu. Někteří hosté ještě nedorazili, a tak si u ohně dopřávám lahodný nápoj."
 feast.7002.dislikes_host: "Už se nemohu dočkat, až ze sebe ten [host.Custom2('InsultNoun', ROOT.Char)] udělá hlupáka."
 feast.7002.likes_host: "Nikde jinde bych teď [Select_CString(ROOT.Char.IsFemale,'nebyla','nebyl')] raději."
 feast.7002.neutral: "#EMP Ach.#! Zdá se, že už jsem [Select_CString(ROOT.Char.IsFemale,'zahlédla','zahlédl')], že se chystá [ROOT.Char.Custom('GetExpensiveMeal')]..."
 feast.7002.intent_arrived: "\n\nV davu zahlédnu [ROOT.Char.GetIntentTarget.GetTitledFirstName]. Ani netuší, jaké s [Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'ní','ním')] mám úmysly."
 feast.7002.intent: "\n\n[ROOT.Char.GetIntentTarget.GetTitledFirstName] zatím není nikde k nalezení. Už se nemohu dočkat, až dorazí a já konečně budu moci uskutečnit své úmysly."
 feast.7002.a.good: "Čeká nás nádherný večer!"
 feast.7002.a.bad: "Už se nemohu dočkat, až pojedu domů."
 feast.7101.t: "Konec oslav"
 feast.7101.desc: "Po odchodu posledního hosta už hoří jen několik svíček. Jakmile se zavřou dveře, zaslechnu dva služebníky, jak si úlevně povzdechnou. Jídlo na talířích je ještě teplé.\n\nBrzy se zpráva donese do všech koutů panství a každý šlechtic, který za něco stojí, bude vědět, že mé velkoleposti se nikdo nevyrovná."
 feast.7101.a: "A tím je vše hotovo."
 feast.7110.t: "Šťastný konec"
 feast.7110.desc.entourage: "Ve světle svíček vypadá krev rozlitá po podlaze jako sametová tapisérie. Konečně se znovu nadechnu, když vidím posledního z mých $knight_culture_player_plural_no_tooltip$, jak si čistí meč. [my_knight.GetFirstNameNoTooltip] mi tiše přikývne.\n\nPokynu [Select_CString(my_knight.IsFemale,'jedné z žen','jednomu z mužů')], aby zavřel[Select_CString(my_knight.IsFemale,'a','')] dveře. Loučím se s hosty. „Skutečná škoda...“"
 feast.7110.a: "Dobrá práce."
 feast.7110.a.failure: "Příště [honorary_guest.GetFirstNameNoTooltip] dostanu..."
 feast.7110.desc.target_intro: "„Jaká nešťastná příhoda!“ hlasitě běduji při loučení s hosty. „Skutečná škoda,“ přitaká další hostka, když odchází. „Opravdu nešťastné,“ zaslechnu, než ji krátce nato následuje i její manžel.\n\n"
 feast.7110.desc.target: "$feast.7110.desc.target_intro$„Kdo to mohl udělat? Takhle zkazit hostinu... spiklenci jsou všude,“ zamumlá jeden z dvořanů a já se prudce otočím ke služebnictvu. „Je čas zavřít dveře.“"
 feast.7110.desc.sneaky: "$feast.7110.desc.target_intro$ „Tak strašný způsob smrti!“ pronese poslední z hostů a přivolá služebnictvo. „Udušení!“ „Ani první, ani poslední, koho to takhle potkalo,“ zamumlá služebník, zatímco dvořané odcházejí. Dveře se za nimi zavřou."
 feast.7110.desc.failed: "„Děkujeme za velkolepou hostinu!“ Několik hostů se kolem mě shromáždilo, aby mi před odchodem vyjádřili svou vděčnost. „Bylo to naprosto skvělé!“ Ani nedokážu rozeznat, kdo právě mluví, protože mé myšlenky zaměstnává jediné.\n\nU východu spatřím [honorary_guest.GetTitledFirstName]. Když se [honorary_guest.GetFirstNameNoTooltip] s úsměvem loučí, jen mě to ještě víc rozzuří."
 murder_feast_family_opinion: "Zabil rodinu během hostiny"
 bloody_wedding_family_opinion: "Rodina zemřela během Krvavé svatby"
 murder_feast_murderer_modifier: "Pletichářský hostitel"
 murder_feast_great_murderer_modifier: "Ponurá večeře"
 murder_feast_murderer_modifier_desc: "Tato postava nedokázala na své hostině ochránit $honorary_guest$."
 murder_feast_great_murderer_modifier_desc: "$murder_feast_murderer_modifier_desc$"
 feast_every_guest: "Každý host"
 feast.7102.opening: "[avenging_family.Custom2('AppropriateGreeting', ROOT.Char)]"
 feast.7102.desc: "Vím, co jsi [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]."
 feast.7102.a: "Máš štěstí, že jsi tam [Select_CString(ROOT.Char.IsFemale,'nebyla','nebyl')]."
 feast.7102.a.tt: "Každý blízký člen rodiny [murder_guest.GetShortUIName]"
 feast.7151.t: "Čas odejít"
 feast.7151.desc: "Denní světlo proudí okny a během jediného okamžiku ozáří celou síň. Většina míst už je prázdná. Několik služebníků se s úsměvem rozloučí a odejde.\n\n[host.GetTitledFirstName] se na mě usměje."
 feast.7151.desc.desc_roughed_up: "Denní světlo proudí okny a během jediného okamžiku ozáří celou síň. Většina míst už je prázdná. Vzhledem k tomu, co jsem tu [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')], se ani není čemu divit!\n\n„Z duše tě nenávidím! Podívej se, co jsi [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] s mým domovem!“ [host.GetTitledFirstName] se na mě zamračí."
 feast.7151.a: "Teď už ale odejdu."
 feast.7201.t: "Přípitek na..."
 feast.7201.desc: "Hostina se pomalu chýlí ke konci a návštěvníci jistě očekávají, že věnuji trochu pozornosti [goh.GetTitledFirstName], našemu váženému čestnému hostu.\n\nTradičně postačí lichotivý přípitek a pořádný doušek [host.Custom('RegionalDrink')]. Jenže když nad tím tak přemýšlím, [goh.GetFirstNameNoTooltip] vlastně jen [Select_CString(goh.IsFemale,'dorazila','dorazil')]. Hostina byl můj nápad, všechno jsem [Select_CString(ROOT.Char.IsFemale,'zaplatila','zaplatil')] a o všechny jsem se [Select_CString(ROOT.Char.IsFemale,'postarala','postaral')] já. Hmm."
 feast.7201.a: "A teď přípitek! Na [goh.GetTitledFirstNameNoTooltip]!"
 feast.7201.b: "Promluvme si o #EMP [goh.Custom2('InsultNoun', ROOT.Char)]#!, kvůli kterému jsme se tu sešli..."
 feast.7201.b.tt: "Místo pocty [goh.GetFirstNameNoTooltip] urazíš"
 feast.7201.c: "A za mou pohostinnost mi můžete být #EMP opravdu#! vděční."
 feast.7201.d: "Přípitek na mou vládu!"
 feast.7202.t: "$feast.7201.t$"
 feast.7202.desc.intro: "Jak se hostina nevyhnutelně chýlí ke konci, zbývá už jen jedna událost, kterou všichni očekávají, a tou je přípitek [host.GetTitledFirstName] na počest čestného hosta:"
 feast.7202.desc.honoured: "mě.\n\nJe to krásná chvíle, na kterou jsem se vlastně celý večer [Select_CString(ROOT.Char.IsFemale,'těšila','těšil')], a uteče až příliš rychle."
 feast.7202.desc.slagged_off: "mě.\n\nJenže místo chvály, kterou [host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale,'slíbila','slíbil')] v pozvánce, se spustí jedovatá tiráda zpochybňující mou povahu, inteligenci i osobní hygienu."
 feast.7202.desc.bragged: "mě.\n\nBohužel se [host.GetFirstNameNoTooltip] jako [Select_CString(host.IsFemale,'správná chvastounka','správný chvastoun')] přes mě rovnou přenese a místo toho začne #EMP sám sebe#! zahrnovat chválou za uspořádání té zatracené hostiny. [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] jsem to čekat."
 feast.7202.a: "Je příjemné, když si mě někdo váží."
 feast.7202.b: "Jak jsi mi to [Select_CString(host.IsFemale,'mohla','mohl')] udělat?"
 feast.7202.c: "Tohle si budu pamatovat."
 feast.7202.adventurer_loot: "Co to...? #EMP Dejte [host.GetFirstNameNoTooltip] co proto a ukradněte [host.Custom('GetExpensiveMeal')]!#!"
 feast.7202.c.tt: "[goh.GetFirstNameNoTooltip] si to vezme osobně"
 feast.7203.t: "$feast.7201.t$"
 feast.7203.desc.intro: "$feast.7202.desc.intro$"
 feast.7203.desc.honoured: "[goh.GetTitledFirstName]\n\nJe to slušný proslov, i když trochu rozvláčný, ale tak už to při podobných příležitostech bývá. Když skončí, shromáždění hosté zdvořile tleskají a jásají, někteří nadšeněji než jiní."
 feast.7203.desc.slagged_off: "[goh.GetTitledFirstName]\n\nK našemu úžasu se [host.GetFirstNameNoTooltip] obrátí k čestnému hostu, ale místo chvály se okamžitě pustí do hlasitého a popravdě docela nápaditého projevu zpochybňujícího inteligenci [goh.GetFirstNameNoTooltip], morální charakter i celkový tělesný pach. My ostatní zůstáváme téměř beze slov."
 feast.7203.desc.bragged: "[goh.GetTitledFirstName]\n\nPřekvapivě, ale vlastně ne až tak překvapivě, se [host.GetFirstNameNoTooltip] přes čestného hosta téměř přenese a místo toho začne vychvalovat vlastní zásluhy na kvalitě uspořádané hostiny. Přinejmenším trochu nezdvořilé a množství potlesku tomu odpovídá."
 feast.7203.a: "Sláva! Sláva!"
 feast.7203.b.goh_honoured: "Popravdě jsem [goh.GetFirstNameNoTooltip] nikdy [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] příliš v oblibě."
 feast.7203.b.goh_dishonoured: "To bylo nevhodné."
 feast.0800.t: "$feast_header$ Předčasně ukončená hostina"
 feast.0800.desc: "Můj předchůdce [host.GetNameRegnal] [Select_CString(host.IsFemale,'opustila','opustil')] tento svět během příprav hostiny. Tragicky [host.GetDeathReason].\n\n"
 feast.0800.desc.entourage: "$activity_system.1010.desc.entourage$"
 feast.0800.desc.ruler: "[host.GetTitleAsName] si takovou smrt nezasloužil[Select_CString(host.IsFemale,'a','')]."
 feast.0800.a: "$activity_system.1010.a$"
 feast.0800.tt: "[GetActivityType('activity_feast').GetName] pořádaná [host.GetShortUINameNoTooltip] byla zrušena"
 feast_events_flavor.0001.t: "Slyšel jsem o tobě"
 feast_events_flavor.0001.desc.intro: "„[ROOT.Char.GetTitledFirstName]!“ zavolá na mě [guest.GetTitledFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guest'))].\n\n"
 feast_events_flavor.0001.desc.good: "„[relation_target.GetFirstName], [guest.Custom2('RelationToMeShort', SCOPE.sC('relation_target'))], o tobě mluví jen v dobrém,“ pronese [guest.GetTitledFirstNameNoTooltip] hrdě a usrkne [guest.Custom('RegionalDrink')]. „Na společnou hostinu s tebou jsem se opravdu těšil[Select_CString(guest.IsFemale,'a','')].“"
 feast_events_flavor.0001.desc.bad: "„[relation_target.GetFirstName], [guest.Custom2('RelationToMeShort', SCOPE.sC('relation_target'))], mi o tobě vypráví opravdu nelichotivé věci. Prý se k tobě dokonale hodí označení #EMP [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('relation_target'))]#!. Pevně doufám, že jsou ty zvěsti nepravdivé a jde jen o nedorozumění.“"
 feast_events_flavor.0001.aa: "„Ať rody [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] a [guest.GetDynasty.GetBaseNameNoTooltip] spojí své síly!“"
 feast_alliance_effect_tooltip: "S [guest.GetTitledFirstName] uzavřeme vzájemnou [Concept('alliance','alianci')|E]"
 feast_events_flavor.0001.a: "„Připijme na [relation_target.GetFirstNameNoTooltip]! A na rod [guest.GetDynasty.GetBaseNameNoTooltip]!“"
 feast_events_flavor.0001.b: "„A já o [relation_target.GetFirstNameNoTooltip] mohu říct totéž dobré.“"
 feast_events_flavor.0001.c: "„Nikdy nebudu věřit nikomu z rodu [guest.GetDynasty.GetBaseNameNoTooltip].“"
 feast_events_flavor.0001.d: "„Omlouvám se za své minulé chyby.“"
 feast_events_flavor.0001.e: "„Nejsem tu proto, abych mluvil[Select_CString(ROOT.Char.IsFemale,'a','')] o [relation_target.GetFirstNameNoTooltip]!“"
 feast_events_flavor.0002.t: "Odpouštět je božské"
 feast_events_flavor.0002.desc: "[former_rival.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_rival'))] a můj [Concept('rival',Select_CString(former_rival.IsFemale,'někdejší sokyně','někdejší sok'))|E], přichází k mému stolu se dvěma poháry v rukou, [former_rival.Custom('quirk_pos_pp')], a pak [former_rival.Custom('quirk_pos_adverb')] usedne na prázdnou židli vedle mě. Zanedlouho jsme zabraní do hovoru a vzpomínáme na naše dávné sváry."
 feast_events_flavor.0002.a: "Tvé rýpání mi zrovna nechybělo, [former_rival.GetTitledFirstName]..."
 feast_events_flavor.0002.b: "Kdysi jsme stáli proti sobě, teď si buďme bližší než kdy dřív!"
 feast_events_flavor.0002.c: "Díky za připomenutí. Táhni, [former_rival.Custom2('InsultAdjective', ROOT.Char)] [former_rival.Custom2('InsultNoun', ROOT.Char)]!"
 feast_events_flavor.0002.c.vengeful_sinful.tt: "Ztratíš [Concept('piety','zbožnost')|E], protože [Concept('faith',THIS.GetCharacter.GetFaith.GetName)|E] považuje rys [GetTrait('forgiving').GetName( GetNullCharacter )] za [Concept('virtuous','ctnostný')|E] nebo rys [GetTrait('vengeful').GetName( GetNullCharacter )] za [Concept('sinful','hříšný')|E]"
 feast_events_flavor.0002.c.forgiving_sinful.tt: "Získáš [Concept('piety','zbožnost')|E], protože [Concept('faith',THIS.GetCharacter.GetFaith.GetName)|E] považuje rys [GetTrait('vengeful').GetName( GetNullCharacter )] za [Concept('virtuous','ctnostný')|E] nebo rys [GetTrait('forgiving').GetName( GetNullCharacter )] za [Concept('sinful','hříšný')|E]"
 feast_events_flavor.0002.d: "Ještě [former_rival.Custom('RegionalAlcoholicDrink')]! [former_rival.Custom('ComplimentAdjective')] [former_rival.Custom2('InsultNoun', ROOT.Char)] si zaslouží přídavek!"
 feast_events_flavor.0002.d.virtuous: "Tohle je opravdu [ROOT.Char.GetFaith.GetReligion.GetAdjective] způsob, jak nastavit druhou tvář!"
 feast_events_flavor.0002.d.virtuous.tt: "Tato možnost je dostupná, protože [Concept('faith',THIS.GetCharacter.GetFaith.GetName)|E] považuje rys [GetTrait('forgiving').GetName( GetNullCharacter )] za [Concept('virtuous','ctnostný')|E] nebo rys [GetTrait('vengeful').GetName( GetNullCharacter )] za [Concept('sinful','hříšný')|E]"
 feast_turning_the_other_cheek_modifier: "Nastavení druhého líce"
 feast_turning_the_other_cheek_modifier_desc: "Tato postava je proslulá tím, že dokáže nechat staré křivdy minulosti."
