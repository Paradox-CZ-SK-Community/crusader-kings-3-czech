l_polish:
 feast_mkc.0001.t: "O samotě se vzpomínkou"
 feast_mkc.0001.desc: "Navzdory veselí a bujaré zábavě v sále zahlédnu jednoho ze svých hostů, [guest_lost_loved_pet.GetShortUIName], jak sedí o samotě v koutě s [ROOT.Char.Custom('CatStoryName')]. [ROOT.Char.Custom('CatStoryName')] se spokojeně choulí na klíně [guest_lost_loved_pet.GetShortUINamePossessiveNoTooltipNoFormat], přede a nechává si od [guest_lost_loved_pet.GetFirstNameNoTooltip] jemně hladit [ROOT.Char.Custom('CatFurColor')] srst.\n\n„Tolik mi připomíná mou starou kočku,“ [Select_CString(guest_lost_loved_pet.IsFemale,'zamumlá','zamumlá')] [guest_lost_loved_pet.GetFirstNameNoTooltip]. V očích se [Select_CString(guest_lost_loved_pet.IsFemale,'jí','mu')] lesknou slzy."
 feast_mkc.0001.a: "Společně zavzpomínat na kočku [guest_lost_loved_pet.GetFirstNameNoTooltip]"
 feast_mkc.0001.b: "Času s [ROOT.Char.Custom('CatStoryName')] si musím vážit o to víc"
 feast_helped_overcome_loss_opinion: "Pomoc při truchlení nad ztrátou mazlíčka"
 feast_sympathy_over_loss_opinion: "Pomoc s překonáním ztráty mazlíčka"
 bonus_to_petting_pet_tt: "Když pohladíš svou kočku, ztratíš více [Concept('stress','stresu')|E]"
