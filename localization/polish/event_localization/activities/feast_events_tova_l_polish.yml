l_polish:
 feast_events_tova.0001.t: "Div hodný věků"
 feast_events_tova.0001.desc: "Moji hosté se pohybují jako ve snách, okouzleni sluncem zalitou kupolí mého paláce a velkolepou fontánou. Vzduch v zahradě je prosycen bohatou vůní kadidla, která příjemně působí na srdce i duši každého, koho se dotkne. \n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tímto místem jsi [Select_CString(ROOT.Char.IsFemale,'sama sebe překonala','sám sebe překonal')]! Umění tvých architektů září v každém detailu,“ pronese [honorary_guest.GetTitledFirstName] a davem kolem [Select_CString(honorary_guest.IsFemale,'ní','něj')] se rozlehne souhlasné mumlání. \n\nVšichni přítomní hosté se ke mně obrátí s očekáváním, jako by čekali, že o paláci pronesu několik slov."
 feast_events_tova.0001.a: "Místo hodné nás, mocných válečníků!"
 feast_events_tova.0001.b: "Provedu tě tady, [honorary_guest.GetTitledFirstNameNoTooltip]."
 feast_events_tova.0001.b.success: "Tvá okázalá nádhera na [honorary_guest.GetTitledFirstNameNoTooltip] hluboce zapůsobí"
 feast_events_tova.0001.b.failure: "Tvůj palác na [honorary_guest.GetTitledFirstNameNoTooltip] zapůsobí, ale tvé vychloubání se nesetká s odezvou"
 feast_events_tova.0001.c: "Tohle je vskutku velkolepé svědectví mé vlády."
