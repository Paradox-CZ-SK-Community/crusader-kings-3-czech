l_polish:
 feast_lifestyle.1001.t: "Řeči o válce"
 feast_lifestyle.1001.desc: "Jakým právem si [strategy_opponent.GetTitledFirstName] dovoluje tvrdit, že mé představy o vedení války jsou pomýlené?\n\nPrý by se mé plány zhroutily v okamžiku, kdy by došlo na skutečný boj. Co o tom [strategy_opponent.GetTitledFirstNameNoTooltip] vůbec ví?"
 feast_lifestyle.1001.a: "[Select_CString(ROOT.Char.IsFemale,'Ráda bych dostala','Rád bych dostal')] příležitost rozhodnout to na bojišti."
 feast_lifestyle.1001.a.tt: "Alespoň ti [strategy_opponent.GetFirstName] [Select_CString(strategy_opponent.IsFemale,'ukázala','ukázal')], že dokážeš obhájit své chápání [Concept('martial_lifestyle','válečnického životního stylu')|E]."
 feast_lifestyle.1002.t: "Skrytý význam"
 feast_lifestyle.1002.opening: "Ostatní hosté se v hlučném sále smějí a překřikují, takže je těžké soustředit se na kaši přede mnou. Do mastné břečky kreslím linie a střety a přemýšlím, jak čelit nejrůznějším bitevním plánům."
 feast_lifestyle.1002.cavalry: "\n\n#EMP Kdyby jízda zaútočila po tomto křídle...#!"
 feast_lifestyle.1002.heavy_infantry: "\n\n#EMP Kdyby těžká pěchota udržela pozici přesně tady...#!"
 feast_lifestyle.1002.archers: "\n\n#EMP A zatímco se na střed snáší déšť šípů...#!"
 feast_lifestyle.1002.skirmishers: "\n\n#EMP Kdyby moji harcovníci dotírali na mrkvové křídlo...#!"
 feast_lifestyle.1002.pikemen: "\n\n#EMP Samozřejmě, mí pikenýři mohou vzdorovat na této straně...#!"
 feast_lifestyle.1002.a: "Tohle by mohlo fungovat i na skutečném bojišti!"
 feast_lifestyle.1002.a.tt: "Kdo by řekl, že miska kaše může prohloubit tvé chápání [Concept('martial_lifestyle','válečnického životního stylu')|E]."
 feast_lifestyle.1003.t: "Pro případ nebezpečí"
 feast_lifestyle.1003.desc: "Uprostřed oslav mě více než cokoli jiného zajímá, jak dobře by se tento sál dal bránit. Kdyby právě teď přišel útok zvenčí, v bezprostředním nebezpečí by se ocitla nižší šlechta. Z velkých stolů by se pak dala vytvořit malá bašta poskytující alespoň trochu ochrany.\n\nA teď... jak bychom měli vést protiútok?"
 feast_lifestyle.1003.a: "Opatrnosti není nikdy dost."
 feast_lifestyle.1003.a.tt: "Raději o takových věcech přemýšlíš, než abys žil v blažené nevědomosti a jednoho dne kvůli tomu zemřel. [Concept('martial_lifestyle','Válečnickému životnímu stylu')|E] rozumíš lépe."
 feast_lifestyle.1003.b: "A co když útok přijde zevnitř?!"
 feast_lifestyle.1003.b.tt: "Bylo by pošetilé předpokládat, že každý zdejší host bude tvým spolubojovníkem. [Concept('martial_lifestyle','Válečnickému životnímu stylu')|e] rozumíš lépe."
 feast_lifestyle.1004.t: "Výměna zkušeností"
 feast_lifestyle.1004.desc: "Hostiny jsou skvělou příležitostí promluvit si s lidmi, jejichž názoru si vážím. [consultant_3.GetTitledFirstName] [Select_CString(consultant_3.IsFemale,'přišla','přišel')] se zajímavými postřehy o pohyblivosti vojska, zatímco [consultant_2.GetTitledFirstName] [Select_CString(consultant_2.IsFemale,'představila','představil')] několik nových obranných strategií.\n\nSkutečně geniální nápad však [Select_CString(consultant_1.IsFemale,'měla','měl')] [consultant_1.GetTitledFirstName]. Po několika pohárech mi [consultant_1.GetTitledFirstNameNoTooltip] důvěrně [Select_CString(consultant_1.IsFemale,'prozradila','prozradil')], jak si představuje ideální způsob útoku na hrad!"
 feast_lifestyle.1004.a: "Na těchto hostinách se toho tolik dozvídám."
 feast_lifestyle.1004.a.tt: "Rozhovory se zkušenými veliteli rozhodně prohlubují tvé chápání [Concept('martial_lifestyle','válečnického životního stylu')|E]."
 feast_lifestyle.2001.t: "Věz, kde je tvé místo"
 feast_lifestyle.2001.mean: "Rychle uhýbám stranou a jen těsně se vyhnu vínu, které můj [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] [guest_victim.GetTitledFirstName] při cestě kolem mě #EMP náhodou#! rozlije.\n\nDalší z urážek [guest_victim.GetTitledFirstNameNoTooltip] nechávám bez odezvy, protože právě v tu chvíli ten [guest_victim.Custom2('InsultNoun', ROOT.Char)] zbledne a strne."
 feast_lifestyle.2001.loud: "„A když už jsme u trapasů, vyprávěl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem vám někdy, jak [ROOT.Char.GetTitledFirstNameNoTooltip]...“\n\nMůj [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] [guest_victim.GetTitledFirstName] náhle zmlkne a zbledne."
 feast_lifestyle.2001.quiet: "Pohledy, kterými mě můj [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_victim'))] [guest_victim.GetTitledFirstName] probodává, zatímco šeptá lidem kolem sebe, by snad mohly pálit.\n\nNáhle ten [guest_victim.Custom2('InsultNoun', ROOT.Char)] strne a zbledne."
 feast_lifestyle.2001.desc_ending: "Když [guest_victim.GetTitledFirstName] rozpačitým krokem prchá z místnosti, musím se usmát a ukrývám přitom v měšci malou lahvičku projímadla."
 feast_lifestyle.2001.a: "To toho [guest_victim.Custom2('InsultAdjective', ROOT.Char)] [guest_victim.Custom2('InsultNoun', ROOT.Char)] naučí!"
 feast_lifestyle.2002.t: "Proříznutý jazyk"
 feast_lifestyle.2002.desc_lover: "„A s takovýma očima... Chci říct, kdo by odolal?“"
 feast_lifestyle.2002.desc_cannibal: "„Podle struktury masa dokonce poznáš, jestli byli zaživa statní. Vzpomínám si na jednoho vojáka, kterého jsem kdysi snědl[Select_CString(ROOT.Char.IsFemale,'a','')]...“"
 feast_lifestyle.2002.desc_homosexual_male: "„A pak jsem ho viděl se usmát! A po tomhle se ode mě čeká, že se spokojím se ženou...“"
 feast_lifestyle.2002.desc_homosexual_female: "„A pak jsem ji viděla se usmát! A po tomhle se ode mě čeká, že se spokojím s mužem...“"
 feast_lifestyle.2002.desc_ending: "\n\nPo pořádné dávce pití se můj [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('guest_with_secret'))] [guest_with_secret.GetTitledFirstName] opírá o náš stůl a přede mnou si vylévá srdce i pohár.\n\n„Pořád mi nosíš další pití a posloucháš, jak tu žvaním a žvaním... Děkuji ti, [ROOT.Char.GetFirstNameNoTooltip]!“"
 feast_lifestyle.2002.a: "Tohle je příliš dobré, než abych si to nechal[Select_CString(ROOT.Char.IsFemale,'a','')] pro sebe!"
 feast_lifestyle.2002.b: "Ne, to já děkuji #EMP tobě#! za tohle odhalení!"
 feast_lifestyle.2002.c: "Víš, mé mlčení má svou cenu."
 feast_lifestyle.2002.d: "Na zdraví! Na příjemný večer a nové kumpány u poháru!"
 feast_lifestyle.2003.t: "Moc ovlivňovat"
 feast_lifestyle.2003.desc: "Plynule přecházím od jednoho rozhovoru k druhému a vedu debatu přesně tam, kam chci.\n\nStačí pár pečlivě volených slov a o milostném životě mého [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('courtier_to_persuade'))] [courtier_to_persuade.GetTitledFirstName] mám jasnější představu, než by si přál[Select_CString(courtier_to_persuade.IsFemale,'a','')] dokonce i [courtier_to_persuade.Custom('WifeHusbandOpp')]."
 feast_lifestyle.2003.a: "Hostina je mým cvičištěm..."
 feast_lifestyle.2003.a.tt: "#F ...a slova jsou mými zbraněmi!#!"
 feast_lifestyle.2003.b: "Raději si prostě užijme rozhovor."
 feast_lifestyle.2004.t: "Příběh v detailech"
 feast_lifestyle.2004.desc1_a: "Tamten [ROOT.Char.Custom('RandomLadyLord')] se přes celý sál důvěrně usmívá na služku. Možná milostný poměr."
 feast_lifestyle.2004.desc1_b: "Tamten [ROOT.Char.Custom('RandomLadyLord')] už potřetí dolévá pevně svíraný pohár od chvíle, kdy se připojil manželský protějšek. Vztah na pokraji zhroucení."
 feast_lifestyle.2004.desc2_a: "Tamten [ROOT.Char.Custom('RandomLadyLord')] na druhé straně sálu má stejné boty jako loni. Finanční potíže."
 feast_lifestyle.2004.desc2_b: "Tamten [ROOT.Char.Custom('RandomLadyLord')] na druhé straně sálu se drží u stěn a vyhýbá se rozhovorům i pohledům do očí. Tajemství, které je třeba skrývat?"
 feast_lifestyle.2004.desc_ending: "\n\nKaždý něco skrývá a zkušenému oku stačí i ten nejmenší detail, aby spatřilo celý obraz."
 feast_lifestyle.2004.a: "Svou hanbu dávají tak očividně najevo!"
 feast_lifestyle.2004.b: "Nic mi nesmí uniknout!"
 feast_lifestyle.3001.t: "Sídlo moci"
 feast_lifestyle.3001.desc: "To je ale hostina! Skvělá příležitost, abychom se s mým [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_1'))] [important_guest_1.GetTitledFirstName] dozvěděli více o lidech, kteří nám slouží.\n\nMůj [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_2'))] [important_guest_2.GetTitledFirstName] ani můj [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('important_guest_3'))] [important_guest_3.GetTitledFirstName] ještě nesedí, a tak rychle přivolávám sluhu, aby upravil zasedací pořádek."
 feast_lifestyle.3001.a: "[important_guest_1.GetFirstNameNoTooltip] by měl[Select_CString(important_guest_1.IsFemale,'a','')] sedět vedle [important_guest_2.GetTitledFirstNameNoTooltip]."
 feast_lifestyle.3001.b: "[important_guest_1.GetFirstNameNoTooltip] by si určitě užil[Select_CString(important_guest_1.IsFemale,'a','')] společnost [important_guest_3.GetTitledFirstNamePossessiveNoTooltip]."
 feast_lifestyle.3001.c: "Oba budou hodovat se mnou."
