l_polish:
 feast_main_befriend.1001.t: "Vysoký stůl praskne"
 feast_main_befriend.1001.opening: "Velký stůl, na kterém seděla vyšší šlechta na tribuně, hlasitě praskl a o chvíli později se zhroutil pod tíhou jídla a pozlacených ozdob!\n\n"
 feast_main_befriend.1001.getting_close: "Jelikož moji nejvýznamnější hosté i já jsme se museli vměstnat mezi nižší šlechtu, [Select_CString(ROOT.Char.IsFemale,'ocitla','ocitl')] jsem se blízko mého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_friend'))], [potential_friend.GetTitledFirstName]!"
 feast_main_befriend.1001.arrogant_guest: "[arrogant_guest.GetTitledFirstName] to špatně [Select_CString(arrogant_guest.IsFemale,'nesla','nesl')] a [Select_CString(arrogant_guest.IsFemale,'řekla','řekl')] všem, že je to vážná křivda být [Select_CString(arrogant_guest.IsFemale,'posazena','posazen')] mezi pány a dámami sotva lepšími než prostý lid."
 feast_main_befriend.1001.arrogant_kind_link: "Jednaje zcela opačně,"
 feast_main_befriend.1001.kind_to_lower_nobility: "[kind_to_lower_nobility.GetTitledFirstName] [Select_CString(kind_to_lower_nobility.IsFemale,'projevovala','projevoval')] milost a pokoru mezi svými podřízenými."
 feast_main_befriend.1001.really_hungry: "Stále [Select_CString(kind_to_lower_nobility.IsFemale,'říkala','říkal')] nejhladovějším hostům, že by co nejdříve měli navštívit [kind_to_lower_nobility.GetHerHis] domov."
 feast_main_befriend.1001.no_kind_target: "Když se vysocí šlechtici mísili se svými podřízenými, vyměňovala se mezi lidmi, kteří se málokdy stýkají, jak přátelství, tak i nepřátelství."
 feast_main_befriend.1001.friendship: "\n\n[potential_friend.GetFirstNameNoTooltip] a já jsme spolu strávili celý večer hovorem a dohodli jsme se, že to nebude naposledy, co spolu budeme společně hodovat a smát se!"
 feast_main_befriend.1001.a: "To byla skvělá noc!"
 feast_main_befriend.2001.t: "Vysoký stůl praskne"
 feast_main_befriend.2001.opening: "$feast_main_befriend.1001.opening$"
 feast_main_befriend.2001.getting_close: "To, co se mohlo stát pohromou, se nakonec ukázalo jako požehnání v neštěstí, když jsem se [Select_CString(ROOT.Char.IsFemale,'ocitla','ocitl')] blízko našeho hostitele, [activity.GetOwner.GetTitledFirstName]!"
 feast_main_befriend.2001.arrogant_guest: "[arrogant_guest.GetTitledFirstName] to však špatně [Select_CString(arrogant_guest.IsFemale,'nesla','nesl')] a [Select_CString(arrogant_guest.IsFemale,'řekla','řekl')] všem, že je to vážná křivda být [Select_CString(arrogant_guest.IsFemale,'posazena','posazen')] mezi lidi sotva lepší než obyčejní lidé."
 feast_main_befriend.2001.arrogant_kind_link: "Jednaje zcela opačně,"
 feast_main_befriend.2001.kind_to_lower_nobility: "[kind_to_lower_nobility.GetTitledFirstName] [Select_CString(kind_to_lower_nobility.IsFemale,'projevovala','projevoval')] milost a pokoru mezi svými podřízenými."
 feast_main_befriend.2001.really_hungry: "[kind_to_lower_nobility.GetFirstName] hostům neustále [Select_CString(kind_to_lower_nobility.IsFemale,'opakovala','opakoval')], že se snaží být vždy [Select_CString(kind_to_lower_nobility.IsFemale,'laskava','laskav')] k lidem, kteří jsou téměř stejně hladoví jako [kind_to_lower_nobility.GetSheHe]."
 feast_main_befriend.2001.no_kind_target: "\n\nKdyž se vysocí šlechtici mísili se svými podřízenými, mezi lidmi, kteří se málokdy stýkají, se vyměňovala jak přátelství, tak nepřátelství."
 feast_main_befriend.2001.friendship: "\n\nZe svého místa u nízkých stolů jsem [Select_CString(ROOT.Char.IsFemale,'považovala','považoval')] hostinu za úspěch, nejen proto, že [activity.GetOwner.GetFirstNameNoTooltip] [Select_CString(activity.GetOwner.IsFemale,'souhlasila','souhlasil')], že to nemůže být naposledy, co jsme si společně poseděli, hodovali, povídali a smáli se."
 feast_main_befriend.2001.a: "To [Select_CString(ROOT.Char.IsFemale,'byla','byl')] skvělý večer!"
 feast_main_befriend.2002.t: "Vysoký stůl praskne"
 feast_main_befriend.2002.arrogant_guest: "[Select_CString(ROOT.Char.IsFemale,'Nemohla','Nemohl')] jsem tomu uvěřit, když byla celá vyšší šlechta přesunuta z tribun na podlahu mezi barony a $knight_culture_player_plural_no_tooltip_lowercase$. Co si [activity.GetOwner.GetTitledFirstName] o mně myslí? Jsem snad pouhý obyčejný člověk?! [Select_CString(ROOT.Char.IsFemale,'Dávala','Dával')] jsem to co nejvíce lidem najevo, zejména těm falešným šlechticům kolem mě!"
 feast_main_befriend.2002.disgusted_by_kindness: "\n\nJako by mi do rány někdo sypal sůl — lidé celou noc chválili [kind_to_lower_nobility.GetTitledFirstName] za lidskost a pokoru mezi těmito lidmi. Nemá [kind_to_lower_nobility.GetSheHe] žádnou sebeúctu?"
 feast_main_befriend.2002.a: "Můžete mě rovnou přirovnat k rolníkovi."
 feast_main_befriend.2002.because_of_hospitality_tenet: "Protože tvá [faith|E] má ctít hosty:"
 feast_main_befriend.2003.t: "Vysoký stůl praskne"
 feast_main_befriend.2003.opening: "Vysoký stůl, na němž seděla vyšší šlechta na tribuně, hlasitě praskl a o chvíli později se zhroutil pod tíhou jídla a pozlacených ozdob! Museli jsme být všichni přesunuti dolů mezi nižší šlechtu na podlahu Velké síně."
 feast_main_befriend.2003.arrogant_guest: "\n\n[arrogant_guest.GetTitledFirstName] špatně [Select_CString(arrogant_guest.IsFemale,'snesla','snesl')] své nové místo a všem [Select_CString(arrogant_guest.IsFemale,'sdělila','sdělil')], že je to vážná křivda být [Select_CString(arrogant_guest.IsFemale,'posazena','posazen')] mezi pány a paní sotva lepšími než prostí lidé."
 feast_main_befriend.2003.kind_to_glutton: "\n\nJá jsem se naopak [Select_CString(ROOT.Char.IsFemale,'věnovala','věnoval')] [glutton_target.GetTitledFirstName] a [glutton_target.GetHerHis] hltavé chuti k jídlu. Lačně [Select_CString(glutton_target.IsFemale,'trhala','trhal')] kousky masa, šťávy mu/ji tekly po [glutton_target.GetHerHis] tváři, zatímco v mém břiše zavrněl nenasytný hlad, který dobře znám, a já jsem [Select_CString(ROOT.Char.IsFemale,'pokračovala','pokračoval')] v podsouvání jídla [glutton_target.GetHerHim]."
 feast_main_befriend.2003.cannibal_kindness: "\n\nZ nového místa jsem [Select_CString(ROOT.Char.IsFemale,'pozorovala','pozoroval')], jak baroni a $knight_culture_player_plural_no_tooltip_lowercase$ nacpávají svá otevřená ústa stále víc, a jak ve mně rostl hlad, [Select_CString(ROOT.Char.IsFemale,'nabídla','nabídl')] jsem se, že někomu setřu sádlo z brady, jen abych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] dotknout toho měkkého, baculatého krku..."
 feast_main_befriend.2003.kind_to_lower_nobility: "\n\nK pánům, dámám a $knight_culture_player_plural_no_tooltip_lowercase$ jsem [Select_CString(ROOT.Char.IsFemale,'přistoupila','přistoupil')] bez pohardy. Při rozhovoru jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], že sdílejí mnoho stejných starostí, problémů a radostí jako já na svém postavení. Jak večer plynul, [Select_CString(ROOT.Char.IsFemale,'rozdělila','rozdělil')] jsem se o své jídlo a [Select_CString(ROOT.Char.IsFemale,'nabídla','nabídl')] jim i své příběhy."
 feast_main_befriend.2003.ending: "\n\nPozději mi [activity.GetOwner.GetTitledFirstName] [Select_CString(activity.GetOwner.IsFemale,'řekla','řekl')], že všichni hosté si všimli pokory a laskavosti, kterou jsem [Select_CString(activity.GetOwner.IsFemale,'projevovala','projevoval')] mezi svými nižšími."
 feast_main_befriend.2003.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že jsem [Select_CString(ROOT.Char.IsFemale,'měla','měl')] možnost tyto lidi poznat."
 feast_main_befriend.2004.t: "Vysoký stůl praskne"
 feast_main_befriend.2004.arrogant_guest: "\n\n[arrogant_guest.GetTitledFirstName] špatně [Select_CString(arrogant_guest.IsFemale,'snesla','snesl')] své nové místo a [Select_CString(arrogant_guest.IsFemale,'řekla','řekl')] všem, že je to vážná křivda být [Select_CString(arrogant_guest.IsFemale,'posazena','posazen')] mezi pány a paní sotva lepšími než prostí lidé."
 feast_main_befriend.2004.kindness_from_other: "\n\n[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] jsem však štěstí, že jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [Select_CString(ROOT.Char.IsFemale,'posazena','posazen')] vedle [kind_to_lower_nobility.GetTitledFirstName]; hodiny jsme si povídali o radostech jídla. Samozřejmě pokud zrovna [Select_CString(ROOT.Char.IsFemale,'necpala','necpal')] jsem do sebe maso! Poznalo se, že [kind_to_lower_nobility.GetFirstName] jen z pohledu na mě [Select_CString(kind_to_lower_nobility.IsFemale,'dostávala','dostával')] větší hlad."
 feast_main_befriend.2004.a: "Nakonec to dopadlo dobře."
 feast_main_befriend.3001.t: "Vysoký stůl praskne"
 feast_main_befriend.3001.arrogant_guest: "\n\n[arrogant_guest.GetTitledFirstName] špatně [Select_CString(arrogant_guest.IsFemale,'snesla','snesl')] své nové místo a [Select_CString(arrogant_guest.IsFemale,'řekla','řekl')] všem, že je to vážná křivda být [Select_CString(arrogant_guest.IsFemale,'posazena','posazen')] mezi pány a paní sotva lepšími než prostí lidé."
 feast_main_befriend.3001.kind_to_lower_nobility: "\n\n[kind_to_lower_nobility.GetTitledFirstName] [Select_CString(kind_to_lower_nobility.IsFemale,'projevila','projevil')] milost a pokoru mezi svými podřízenými. [kind_to_lower_nobility.GetHerHis|U] chování bylo něčím, k čemu bychom všichni mohli usilovat."
 feast_main_befriend.3001.really_hungry: "Také [Select_CString(kind_to_lower_nobility.IsFemale,'nabízela','nabízel')] ostatním [kind_to_lower_nobility.GetHerHis] jídlo, přejíce jim zdravou, pevnou postavu."
 feast_main_befriend.3001.ending: "\n\nKdyž se vysocí šlechtici mísili se svými podřízenými, mezi lidmi, kteří se málokdy stýkají, se vyměňovala slova přátelství i nesvárů."
 feast_main_befriend.3001.a: "Mám pocit, že jsem se něco [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')]."
 feast_main_befriend.5002.t: "Přátelství"
 feast_main_befriend.5002.desc: "Když moji hosté odcházejí, zdají se odcházet v dobré náladě. Jsem také [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že [potential_friend.GetTitledFirstName] neodchází, aniž by se [Select_CString(potential_friend.IsFemale,'rozloučila','rozloučil')].\n\nOba víme, že se brzy znovu uvidíme."
 feast_main_befriend.5002.a: "To je ale [potential_friend.GetWomanMan]."
 feast_main_befriend.5003.t: "Přátelství"
 feast_main_befriend.5003.desc: "Než jsem [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')] hostinu, [Select_CString(ROOT.Char.IsFemale,'musela','musel')] jsem dát vědět [host_saying_goodbye.GetTitledFirstName], jak jsem se dobře [Select_CString(host_saying_goodbye.IsFemale,'bavila','bavil')]. Mi [Select_CString(host_saying_goodbye.IsFemale,'řekla','řekl')], abych [Select_CString(ROOT.Char.IsFemale,'vstála','vstál')] z pokleku a [Select_CString(ROOT.Char.IsFemale,'položila','položil')] pevnou ruku na mé rameno.\n\nNemyslím, že uplyne dlouho, než se opět uvidíme."
 feast_main_befriend.5003.a: "To bylo něco výjimečného."
 feast_main_befriend.5004.t: "Nezapomenutelná nehoda"
 feast_main_befriend.5004.desc: "Když odcházím s ostatními hosty, nemohu si pomoct a s úsměvem se ohlédnout za uplynulými dny.\n\nUkázalo se, že to byla výborná hostina a to, že jsem se [Select_CString(ROOT.Char.IsFemale,'stýkala','stýkal')] s hosty jiné hodnosti, mi dokonce dalo nové pohledy."
 feast_main_befriend.5004.a: "Do příště, můj [ROOT.Char.Custom2('RelationToMe', activity.GetOwner)]!"
