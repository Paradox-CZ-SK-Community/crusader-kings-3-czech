l_polish:
 feast_main_befriend.1001.t: "Když praskne čestný stůl"
 feast_main_befriend.1001.opening: "Velký stůl na vyvýšeném pódiu, u něhož seděla nejvyšší šlechta, hlasitě zapraskal a vzápětí se pod tíhou jídla a pozlacené výzdoby zhroutil!\n\n"
 feast_main_befriend.1001.getting_close: "Když jsme se s nejváženějšími hosty museli vměstnat mezi nižší šlechtu, [Select_CString(ROOT.Char.IsFemale,'ocitla','ocitl')] jsem se poblíž [potential_friend.GetTitledFirstName], což je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_friend'))]!"
 feast_main_befriend.1001.arrogant_guest: "[arrogant_guest.GetTitledFirstName] to však [Select_CString(arrogant_guest.IsFemale,'nesla','nesl')] těžce a všem [Select_CString(arrogant_guest.IsFemale,'vykládala','vykládal')], jaká je to strašlivá potupa sedět s pány a dámami, kteří mají sotva daleko k obyčejným lidem."
 feast_main_befriend.1001.arrogant_kind_link: "Zcela opačně se zachoval někdo jiný."
 feast_main_befriend.1001.kind_to_lower_nobility: "[kind_to_lower_nobility.GetTitledFirstName] [Select_CString(kind_to_lower_nobility.IsFemale,'projevila','projevil')] mezi níže postavenými noblesu a pokoru."
 feast_main_befriend.1001.really_hungry: "[kind_to_lower_nobility.GetFirstName] ty nejhladovější hosty neustále [Select_CString(kind_to_lower_nobility.IsFemale,'zvala','zval')], aby co nejdříve zavítali k [Select_CString(kind_to_lower_nobility.IsFemale,'ní','němu')] domů."
 feast_main_befriend.1001.no_kind_target: "Když se vysoká šlechta promísila s níže postavenými, mezi lidmi, kteří se jinak téměř nestýkají, zazněla slova přátelství i nevraživosti."
 feast_main_befriend.1001.friendship: "\n\nS [potential_friend.GetFirstNameNoTooltip] jsme nakonec prohovořili celý večer a shodli se, že to rozhodně nesmí být naposledy, co spolu hodujeme a smějeme se!"
 feast_main_befriend.1001.a: "To byla skvělá noc!"
 feast_main_befriend.2001.t: "Když praskne čestný stůl"
 feast_main_befriend.2001.opening: "$feast_main_befriend.1001.opening$"
 feast_main_befriend.2001.getting_close: "Co mohlo skončit pohromou, se nakonec ukázalo jako štěstí v neštěstí, protože jsem se [Select_CString(ROOT.Char.IsFemale,'ocitla','ocitl')] poblíž našeho hostitele, [activity.GetOwner.GetTitledFirstName]!"
 feast_main_befriend.2001.arrogant_guest: "[arrogant_guest.GetTitledFirstName] však své nové místo [Select_CString(arrogant_guest.IsFemale,'nesla','nesl')] těžce a všem [Select_CString(arrogant_guest.IsFemale,'vykládala','vykládal')], jaká je to strašlivá potupa sedět mezi lidmi, kteří mají sotva daleko k obyčejným lidem."
 feast_main_befriend.2001.arrogant_kind_link: "Zcela opačně se zachoval někdo jiný."
 feast_main_befriend.2001.kind_to_lower_nobility: "[kind_to_lower_nobility.GetTitledFirstName] [Select_CString(kind_to_lower_nobility.IsFemale,'projevila','projevil')] mezi níže postavenými noblesu a pokoru."
 feast_main_befriend.2001.really_hungry: "[kind_to_lower_nobility.GetFirstName] hostům neustále [Select_CString(kind_to_lower_nobility.IsFemale,'říkala','říkal')], že se vždy snaží být [Select_CString(kind_to_lower_nobility.IsFemale,'laskavá','laskavý')] k lidem, kteří mají skoro takový hlad jako [Select_CString(kind_to_lower_nobility.IsFemale,'ona sama','on sám')]."
 feast_main_befriend.2001.no_kind_target: "\n\nKdyž se vysoká šlechta promísila s níže postavenými, mezi lidmi, kteří se jinak téměř nestýkají, zazněla slova přátelství i nevraživosti."
 feast_main_befriend.2001.friendship: "\n\nZ mého místa u nižších stolů se hostina nakonec ukázala jako úspěch, v neposlední řadě proto, že [activity.GetOwner.GetFirstNameNoTooltip] [Select_CString(activity.GetOwner.IsFemale,'souhlasila','souhlasil')], že to rozhodně nesmí být naposledy, co spolu usedneme, pohostíme se, popovídáme si a zasmějeme se."
 feast_main_befriend.2001.a: "To byl skvělý večer!"
 feast_main_befriend.2002.t: "Když praskne čestný stůl"
 feast_main_befriend.2002.arrogant_guest: "[Select_CString(ROOT.Char.IsFemale,'Nemohla','Nemohl')] jsem uvěřit vlastním očím, když celou vysokou šlechtu přesunuli z pódia dolů mezi barony a $knight_culture_player_plural_no_tooltip_lowercase$. Za co mě [activity.GetOwner.GetTitledFirstName] považuje? Za nějakého obyčejného člověka?! Každému, kdo byl ochoten poslouchat, jsem [Select_CString(ROOT.Char.IsFemale,'dala','dal')] jasně najevo, co si o tom myslím, a především těm rádoby šlechticům kolem mě!"
 feast_main_befriend.2002.disgusted_by_kindness: "\n\nA jako by mi chtěli ještě přisypat sůl do rány, [kind_to_lower_nobility.GetTitledFirstName] [Select_CString(kind_to_lower_nobility.IsFemale,'sklízela','sklízel')] celý večer chválu za to, jak je mezi těmito lidmi „[Select_CString(kind_to_lower_nobility.IsFemale,'laskavá','laskavý')]“ a „[Select_CString(kind_to_lower_nobility.IsFemale,'pokorná','pokorný')]“. Copak nemá žádnou sebeúctu?"
 feast_main_befriend.2002.a: "To už mě rovnou mohou přirovnat k sedlákovi."
 feast_main_befriend.2002.because_of_hospitality_tenet: "Protože tvá [Concept('faith','víra')|E] má ctít hosty:"
 feast_main_befriend.2003.t: "Když praskne čestný stůl"
 feast_main_befriend.2003.opening: "Čestný stůl na vyvýšeném pódiu, u něhož seděla vysoká šlechta, hlasitě zapraskal a vzápětí se pod tíhou jídla a pozlacené výzdoby zhroutil! Všichni jsme se museli přesunout dolů mezi nižší šlechtu v hlavním sále."
 feast_main_befriend.2003.arrogant_guest: "\n\n[arrogant_guest.GetTitledFirstName] však své nové místo [Select_CString(arrogant_guest.IsFemale,'nesla','nesl')] těžce a všem [Select_CString(arrogant_guest.IsFemale,'vykládala','vykládal')], jaká je to strašlivá potupa sedět s pány a dámami, kteří mají sotva daleko k obyčejným lidem."
 feast_main_befriend.2003.kind_to_glutton: "\n\nJá jsem naopak [Select_CString(ROOT.Char.IsFemale,'věnovala','věnoval')] zvláštní pozornost [glutton_target.GetTitledFirstName] a [Select_CString(glutton_target.IsFemale,'její','jeho')] nenasytné chuti k jídlu. [glutton_target.GetTitledFirstName] [Select_CString(glutton_target.IsFemale,'hltavě trhala','hltavě trhal')] kusy masa a po tváři [Select_CString(glutton_target.IsFemale,'jí','mu')] stékala šťáva. V břiše se mi přitom začal ozývat ten nenasytný hlad, který až příliš dobře znám, a já [Select_CString(ROOT.Char.IsFemale,'podávala','podával')] [glutton_target.GetTitledFirstNameNoTooltip] další a další jídlo."
 feast_main_befriend.2003.cannibal_kindness: "\n\nZ nového místa jsem [Select_CString(ROOT.Char.IsFemale,'pozorovala','pozoroval')], jak do sebe baroni a $knight_culture_player_plural_no_tooltip_lowercase$ cpou stále další sousta. Jak ve mně sílil hlad, [Select_CString(ROOT.Char.IsFemale,'nabídla','nabídl')] jsem se, že někomu otřu mastnotu z brady, jen abych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] dotknout toho měkkého, baculatého krku..."
 feast_main_befriend.2003.kind_to_lower_nobility: "\n\nNa pány, dámy a $knight_culture_player_plural_no_tooltip_lowercase$ jsem [Select_CString(ROOT.Char.IsFemale,'nepohlížela','nepohlížel')] s opovržením. Při hovoru s nimi jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], že sdílejí mnohé z těch obav, strastí i radostí, které znám ze svého vznešeného postavení. Jak večer plynul, [Select_CString(ROOT.Char.IsFemale,'dělila','dělil')] jsem se s nimi o jídlo ze svého talíře a na oplátku [Select_CString(ROOT.Char.IsFemale,'přidávala','přidával')] vlastní příběhy."
 feast_main_befriend.2003.ending: "\n\nPozději mi [activity.GetOwner.GetTitledFirstName] [Select_CString(activity.GetOwner.IsFemale,'řekla','řekl')], že si všichni hosté všimli pokory a laskavosti, kterou jsem mezi níže postavenými [Select_CString(ROOT.Char.IsFemale,'projevila','projevil')]."
 feast_main_befriend.2003.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že jsem ty lidi [Select_CString(ROOT.Char.IsFemale,'poznala','poznal')]."
 feast_main_befriend.2004.t: "Když praskne čestný stůl"
 feast_main_befriend.2004.arrogant_guest: "\n\n[arrogant_guest.GetTitledFirstName] však své nové místo [Select_CString(arrogant_guest.IsFemale,'nesla','nesl')] těžce a všem [Select_CString(arrogant_guest.IsFemale,'vykládala','vykládal')], jaká je to strašlivá potupa sedět s pány a dámami, kteří mají sotva daleko k obyčejným lidem."
 feast_main_befriend.2004.kindness_from_other: "\n\nNaštěstí jsem se [Select_CString(ROOT.Char.IsFemale,'ocitla','ocitl')] vedle [kind_to_lower_nobility.GetTitledFirstName] a celé hodiny jsme si povídali o radostech jídla a hodování. Tedy alespoň ve chvílích, kdy jsem si zrovna [Select_CString(ROOT.Char.IsFemale,'necpala','necpal')] maso do chřtánu! Bylo na [kind_to_lower_nobility.GetFirstName] vidět, že už jen při pohledu na mě dostává čím dál větší hlad!"
 feast_main_befriend.2004.a: "Nakonec všechno dopadlo nejlépe, jak mohlo."
 feast_main_befriend.3001.t: "Když praskne čestný stůl"
 feast_main_befriend.3001.arrogant_guest: "\n\n[arrogant_guest.GetTitledFirstName] však své nové místo [Select_CString(arrogant_guest.IsFemale,'nesla','nesl')] těžce a všem [Select_CString(arrogant_guest.IsFemale,'vykládala','vykládal')], jaká je to strašlivá potupa sedět s pány a dámami, kteří mají sotva daleko k obyčejným lidem."
 feast_main_befriend.3001.kind_to_lower_nobility: "\n\n[kind_to_lower_nobility.GetTitledFirstName] [Select_CString(kind_to_lower_nobility.IsFemale,'projevila','projevil')] mezi níže postavenými noblesu a pokoru. Takové chování by nám všem mohlo být příkladem."
 feast_main_befriend.3001.really_hungry: "[kind_to_lower_nobility.GetTitledFirstName] se navíc [Select_CString(kind_to_lower_nobility.IsFemale,'dělila','dělil')] o své jídlo s ostatními a [Select_CString(kind_to_lower_nobility.IsFemale,'přála','přál')] jim pevné zdraví a statnou postavu."
 feast_main_befriend.3001.ending: "\n\nKdyž se vysoká šlechta promísila s níže postavenými, mezi lidmi, kteří se jinak téměř nestýkají, zazněla slova přátelství i nevraživosti."
 feast_main_befriend.3001.a: "Mám pocit, že jsem se něco [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')]."
 feast_main_befriend.5002.t: "Přátelství"
 feast_main_befriend.5002.desc: "Když se hosté rozcházejí, zdá se, že odcházejí v dobrém rozpoložení. Ulevilo se mi také, když vidím, že [potential_friend.GetTitledFirstName] neodchází bez rozloučení.\n\nOba víme, že se brzy znovu uvidíme."
 feast_main_befriend.5002.a: "To je ale [potential_friend.GetWomanMan]!"
 feast_main_befriend.5003.t: "Přátelství"
 feast_main_befriend.5003.desc: "Než jsem hostinu [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')], [Select_CString(ROOT.Char.IsFemale,'musela','musel')] jsem [host_saying_goodbye.GetTitledFirstName] říct, jak skvěle jsem se [Select_CString(ROOT.Char.IsFemale,'bavila','bavil')]. [host_saying_goodbye.GetTitledFirstName] mi [Select_CString(host_saying_goodbye.IsFemale,'řekla','řekl')], ať vstanu z pokleku, a [Select_CString(host_saying_goodbye.IsFemale,'položila','položil')] mi pevnou ruku na rameno.\n\nNemyslím si, že potrvá dlouho, než se znovu uvidíme."
 feast_main_befriend.5003.a: "Tohle bylo něco výjimečného."
 feast_main_befriend.5004.t: "Nezapomenutelná nehoda"
 feast_main_befriend.5004.desc: "Když se spolu s ostatními hosty chystám k odjezdu, nemohu se ubránit úsměvu při vzpomínce na uplynulé dny.\n\nNakonec z toho byla skvělá hostina a setkávání s hosty jiného společenského postavení mi dokonce nabídlo několik nových pohledů na svět."
 feast_main_befriend.5004.a: "Do příště, můj [ROOT.Char.Custom2('RelationToMe', activity.GetOwner)]!"
