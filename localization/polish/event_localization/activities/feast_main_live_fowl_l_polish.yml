l_polish:
 feast_main_live_fowl.0002.t: "[fowl_dinner_target.GetFirstName] a ptačí lapálie"
 feast_main_live_fowl.0002.entremets_served: "Sluhové přinášejí působivě zdobené mezichody. Mezi nimi je i několik exotických ptáků druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')], stažených, upečených a nadívaných a poté znovu oděných do nádherného peří. Když však [fowl_dinner_target.GetTitledFirstName] [Select_CString(fowl_dinner_target.IsFemale,'přiblížila','přiblížil')] nůž k jednomu z nich, pták s křikem ožil! Tenhle vůbec nebyl upečený! Klovl [fowl_dinner_target.GetFirstName] do nosu a pak se vrhl mezi ječící a smějící se hosty."
 feast_main_live_fowl.0002.bird_killed: "\n\nÚtěk ptáka druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')] však brzy skončil. [fowl_bird_killer.GetTitledFirstName] [Select_CString(fowl_bird_killer.IsFemale,'vstala','vstal')] od stolu a s chladnou účelností jej [Select_CString(fowl_bird_killer.IsFemale,'popadla','popadl')] za krk. Jediné škubnutí rukama a hlasité křupnutí umlčelo celý sál. Ticho přerušilo až bolestné sténání [fowl_dinner_target.GetFirstName], [Select_CString(fowl_dinner_target.IsFemale,'která si svírala','který si svíral')] krvácející nos."
 feast_main_live_fowl.0002.bird_chased_by_character: "\n\nKdyž se pták splašeně rozběhl po sále, [fowl_bird_chaser.GetTitledFirstName] se [Select_CString(fowl_bird_chaser.IsFemale,'odhodlala','odhodlal')] zasáhnout. Pohled na to, jak zoufale pronásleduje běsnícího tvora přes stoly, poskytl hostům skvělou zábavu. Nakonec se [fowl_bird_chaser.GetTitledFirstNameNoTooltip] podařilo zahnat ptáka druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')] ke dveřím velkého sálu, odkud unikl na čerstvý vzduch pod jasnými hvězdami."
 feast_main_live_fowl.0002.bird_chased_away: "\n\nKdyž se pták druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')] splašeně rozběhl po sále, zástup sluhů se mu snažil zabránit v převracení ostatních pokrmů. Největší zábavu však poskytl kuchař, který jej pronásledoval s naběračkou, až ptáka nakonec vyhnal dveřmi velkého sálu do noci."
 feast_main_live_fowl.0002.a: "To byla mela!"
 feast_main_live_fowl.0003.t: "[fowl_dinner_target.GetFirstName] a ptačí lapálie"
 feast_main_live_fowl.0003.entremets_served: "Sluhové přinášeli působivě zdobené mezichody. Mezi nimi bylo i několik pyšně vyhlížejících exotických ptáků druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')], stažených, upečených a nadívaných a poté znovu oděných do nádherného peří. Když však [fowl_dinner_target.GetTitledFirstName] [Select_CString(fowl_dinner_target.IsFemale,'přiblížila','přiblížil')] nůž k jednomu z nich, pták s křikem ožil! Tenhle vůbec nebyl upečený! Klovl [fowl_dinner_target.GetFirstName] do nosu a pak se vrhl mezi ječící a smějící se hosty."
 feast_main_live_fowl.0003.bird_killed: "\n\nÚtěk ptáka druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')] však brzy skončil. [fowl_bird_killer.GetTitledFirstName] [Select_CString(fowl_bird_killer.IsFemale,'vstala','vstal')] od stolu a s chladnou účelností jej [Select_CString(fowl_bird_killer.IsFemale,'popadla','popadl')] za krk. Jediné škubnutí rukama a hlasité křupnutí umlčelo celý sál.\n\nTicho přerušilo až bolestné sténání [fowl_dinner_target.GetFirstName], [Select_CString(fowl_dinner_target.IsFemale,'která si svírala','který si svíral')] krvácející nos."
 feast_main_live_fowl.0003.bird_chased_by_character: "\n\nKdyž se pták splašeně rozběhl po sále, [fowl_bird_chaser.GetTitledFirstName] se [Select_CString(fowl_bird_chaser.IsFemale,'odhodlala','odhodlal')] zasáhnout. Pohled na to, jak zoufale pronásleduje běsnícího tvora přes stoly, poskytl hostům skvělou zábavu. Nakonec se [fowl_bird_chaser.GetTitledFirstNameNoTooltip] podařilo zahnat ptáka druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')] ke dveřím velkého sálu, odkud unikl do noci."
 feast_main_live_fowl.0003.bird_chased_away: "Když se pták druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')] splašeně rozběhl po sále, zástup sluhů se mu snažil zabránit v převracení ostatních pokrmů a zničení hostiny. Největší zábavu však poskytl kuchař, který jej pronásledoval s naběračkou, až ptáka nakonec vyhnal dveřmi velkého sálu do noci."
 feast_main_live_fowl.0003.a: "Ach, bez nějakého žertu by to ani nebyla pořádná hostina."
 feast_main_live_fowl.0004.t: "[fowl_dinner_target.GetFirstName] a ptačí lapálie"
 feast_main_live_fowl.0004.entremets_served: "Mezi jednotlivými chody přinášejí sluhové působivě zdobené mezichody, na nichž se může předvést umění hostitelových kuchařů. Jedním z nejokázalejších výtvorů je několik exotických ptáků druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')], stažených, upečených a nadívaných a poté znovu oděných do nádherného peří.\nKdyž přiblížím nůž, jeden z ptáků s křikem ožije! Jeden z [ROOT.GetCharacter.Custom('exotic_fowl_type')] vůbec nebyl upečený! Klovne mě do nosu a pak se vrhne mezi ječící a smějící se hosty."
 feast_main_live_fowl.0004.bird_killed: "\n\nÚtěk ptáka druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')] však brzy skončil. [fowl_bird_killer.GetTitledFirstName] [Select_CString(fowl_bird_killer.IsFemale,'vstala','vstal')] od stolu a s chladnou účelností jej [Select_CString(fowl_bird_killer.IsFemale,'popadla','popadl')] za krk. Jediné škubnutí rukama a hlasité křupnutí umlčelo celý sál.\n\nSedím, sténám bolestí, svírám si krvácející nos a proklínám našeho hostitele."
 feast_main_live_fowl.0004.bird_chased_by_character: "\n\nKdyž se pták splašeně rozběhl po sále, [fowl_bird_chaser.GetTitledFirstName] se [Select_CString(fowl_bird_chaser.IsFemale,'odhodlala','odhodlal')] zasáhnout a zoufale pronásleduje běsnícího tvora. Nakonec se [fowl_bird_chaser.GetTitledFirstNameNoTooltip] podaří zahnat ptáka druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')] ke dveřím velkého sálu, odkud unikne.\n\nSedím, sténám bolestí, svírám si krvácející nos a proklínám našeho hostitele."
 feast_main_live_fowl.0004.bird_chased_away: "\n\nKdyž se pták druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')] splašeně rozběhl po sále, zástup sluhů se mu snažil zabránit v převracení ostatních pokrmů. Největší zábavu však poskytl kuchař, který jej pronásledoval s naběračkou, až ptáka nakonec vyhnal dveřmi velkého sálu do noci.\nSedím, sténám bolestí, svírám si krvácející nos a proklínám našeho hostitele."
 feast_main_live_fowl.0004.a: "Ptáci jsou mnohem silnější, než by člověk čekal..."
 feast_main_live_fowl.0005.t: "[fowl_dinner_target.GetFirstName] a ptačí lapálie"
 feast_main_live_fowl.0005.entremets_served: "Sluhové přinášeli působivě zdobené mezichody. Mezi nimi bylo i několik exotických ptáků druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')], stažených, upečených a nadívaných a poté znovu oděných do nádherného peří. Když však [fowl_dinner_target.GetTitledFirstName] [Select_CString(fowl_dinner_target.IsFemale,'přiblížila','přiblížil')] nůž k jednomu z nich, pták s křikem ožil! Klovl [fowl_dinner_target.GetFirstName] do nosu a pak se vrhl mezi ječící a smějící se hosty."
 feast_main_live_fowl.0005.bird_killed: "\n\nNakonec jsem toho [Select_CString(ROOT.Char.IsFemale,'měla','měl')] dost, a když se pták přiblížil, [Select_CString(ROOT.Char.IsFemale,'popadla','popadl')] jsem ho za krk. Sál ztichl, když jsem mu [Select_CString(ROOT.Char.IsFemale,'kroutila','kroutil')] krkem, dokud hlasitě nepraskl. Zmačkaná hromádka peří pak zůstala ležet na podlaze až do konce hostiny."
 feast_main_live_fowl.0005.a: "Ach, ten pocit, když ti v rukou vyhasne život..."
 feast_main_live_fowl.0006.t: "[fowl_dinner_target.GetFirstName] a ptačí lapálie"
 feast_main_live_fowl.0006.entremets_served: "Sluhové přinášeli působivě zdobené mezichody. Mezi nimi bylo i několik exotických ptáků druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')], stažených, upečených a nadívaných a poté znovu oděných do nádherného peří. Když však [fowl_dinner_target.GetTitledFirstName] [Select_CString(fowl_dinner_target.IsFemale,'přiblížila','přiblížil')] nůž k jednomu z nich, pták s křikem ožil! Klovl [fowl_dinner_target.GetFirstName] do nosu a pak se vrhl mezi ječící a smějící se hosty."
 feast_main_live_fowl.0006.bird_chased_by_character: "\n\nOkamžitě jsem [Select_CString(ROOT.Char.IsFemale,'využila','využil')] příležitosti udělat na ostatní hosty dojem. Těmi nejrozhodnějšími gesty jsem se [Select_CString(ROOT.Char.IsFemale,'snažila','snažil')] zahnat ptáka k východu. Sice si zvolil cestu přes několik stolů a já ho možná [Select_CString(ROOT.Char.IsFemale,'pronásledovala','pronásledoval')] s až přílišným zápalem, ale rozhodně jsem [Select_CString(ROOT.Char.IsFemale,'předvedla','předvedl')] působivé vystoupení. Když ten malý drak zmizel v čerstvém nočním vzduchu, [Select_CString(ROOT.Char.IsFemale,'měla','měl')] jsem pocit, jako bychom mezi sebou navázali jakési pouto."
 feast_main_live_fowl.0006.a: "Počkat... oni se mi smějí?"
 feast_main_live_fowl.1001.t: "Ptačí hostina: Bolestná památka"
 feast_main_live_fowl.1001.desc: "Ten zatracený pták na hostině!\n\n[Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že rána, kterou mi způsobil, se pěkně zahojí, ale místo toho mi přes tvář zůstala ošklivá jizva!"
 feast_main_live_fowl.1001.a: "Navždy mi bude připomínat mého skutečného úhlavního nepřítele..."
 fowl_dinner_peacock: "páv"
 fowl_dinner_child: "pestrobarevný pták"
 feast_main_live_fowl.9001.t: "Ptačí konec"
 feast_main_live_fowl.9001.bird_killer: "Hostina pořádaná [host_saying_goodbye.GetTitledFirstName] se pomalu chýlí ke konci.\n\nTéměř všichni hosté vypadají spokojeně, snad až na [fowl_dinner_target.GetFirstName], [Select_CString(fowl_dinner_target.IsFemale,'která si stále svírá','který si stále svírá')] nos v místě, kde [Select_CString(fowl_dinner_target.IsFemale,'ji','ho')] poznamenal pták druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')].\n\nTaké se zdá, že po brutálním skoncování s ptákem nechce nikdo sedět poblíž [fowl_bird_killer.GetFirstName]."
 feast_main_live_fowl.9001.no_bird_killer: "Hostina pořádaná [host_saying_goodbye.GetTitledFirstName] se pomalu chýlí ke konci.\n\nTéměř všichni hosté vypadají spokojeně, snad až na [fowl_dinner_target.GetFirstName], [Select_CString(fowl_dinner_target.IsFemale,'která si stále svírá','který si stále svírá')] nos v místě, kde [Select_CString(fowl_dinner_target.IsFemale,'ji','ho')] poznamenal pták druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')]."
 feast_main_live_fowl.9001.a: "Tohle bychom měli dělat častěji, můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host_saying_goodbye'))]!"
 feast_main_live_fowl.9002.t: "Ptačí konec"
 feast_main_live_fowl.9002.bird_killer: "Po dnech a nocích veselé společnosti se má hostina pomalu chýlí ke konci!\n\nTéměř všichni hosté vypadají spokojeně, snad až na [fowl_dinner_target.GetFirstName], [Select_CString(fowl_dinner_target.IsFemale,'která si stále svírá','který si stále svírá')] nos v místě, kde [Select_CString(fowl_dinner_target.IsFemale,'ji','ho')] poznamenal pták druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')].\n\nTaké se zdá, že po brutálním skoncování s ptákem nechce nikdo sedět poblíž [fowl_bird_killer.GetFirstName]."
 feast_main_live_fowl.9002.no_bird_killer: "Po dnech a nocích veselé společnosti se má hostina pomalu chýlí ke konci!\n\nTéměř všichni hosté vypadají spokojeně, snad až na [fowl_dinner_target.GetFirstName], [Select_CString(fowl_dinner_target.IsFemale,'která si stále svírá','který si stále svírá')] nos v místě, kde [Select_CString(fowl_dinner_target.IsFemale,'ji','ho')] poznamenal pták druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')]."
 feast_main_live_fowl.9002.a: "Tohle bychom měli dělat častěji!"
 feast_main_live_fowl.9003.bird_killer: "Hostina se konečně chýlí ke konci!\n\nVšichni ostatní si ji očividně užili, zatímco já se musím vzpamatovávat z bolesti, kterou mi způsobil ten zatracený pták druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')]!\n\nAsi bych [fowl_bird_killer.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'měla','měl')] poděkovat za to, jak účinně se té zákeřné pekelné stvůry [Select_CString(fowl_bird_killer.IsFemale,'zbavila','zbavil')]. Jen mám trochu obavy přiblížit se k [Select_CString(fowl_bird_killer.IsFemale,'ní','němu')] příliš blízko."
 feast_main_live_fowl.9003.no_bird_killer: "Hostina se konečně chýlí ke konci!\n\nVšichni ostatní si ji očividně užili, zatímco já se musím vzpamatovávat z bolesti, kterou mi způsobil ten zatracený pták druhu [ROOT.GetCharacter.Custom('exotic_fowl_type')]! Od [host_saying_goodbye.GetTitledFirstName] jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')] lepší zacházení.\n\nNevadí, na příští hostině jim všem ukážu!"
 feast_main_live_fowl.9003.a: "Ano, ano, už to brzy skončí."
 feast_main_live_fowl.9004.desc: "Hostina pořádaná [host_saying_goodbye.GetTitledFirstName] se pomalu chýlí ke konci. Lidé se smějí, dokud mě neuvidí, a pak náhle ztichnou. Vím, že se jim do paměti vryl obraz toho, jak jsem tomu ptákovi [Select_CString(ROOT.Char.IsFemale,'zakroutila','zakroutil')] krkem. A já si rozhodně velmi dobře pamatuji pocit, když z bezmocného těla vyprchal život.\n\nJe příjemné vědět, že ze mě mají všichni alespoň trochu strach."
 feast_main_live_fowl.9004.a: "Nakonec to nebyla tak hrozná hostina."
 feast_main_live_fowl.9005.desc: "Hostina pořádaná [host_saying_goodbye.GetTitledFirstName] se pomalu chýlí ke konci. Zdá se, že si ji většina hostů užila, i když bych [Select_CString(ROOT.Char.IsFemale,'byla','byl')] raději, kdyby o něco méně vzpomínali na to, jak jsem [Select_CString(ROOT.Char.IsFemale,'běhala','běhal')] po stolech.\nAlespoň mi [fowl_dinner_target.GetFirstName] [Select_CString(fowl_dinner_target.IsFemale,'poděkovala','poděkoval')], že jsem [Select_CString(ROOT.Char.IsFemale,'zahnala','zahnal')] ptáka poté, co [Select_CString(fowl_dinner_target.IsFemale,'ji','ho')] napadl."
 feast_main_live_fowl.9005.a: "Na příští hostině se budu chovat trochu důstojněji."
 feast_live_fowl_log_title: "Útok ptáka"
 feast_live_fowl_log: "[TARGET_CHARACTER.GetTitledFirstName] [Select_CString(TARGET_CHARACTER.IsFemale,'byla napadena','byl napaden')] živým ptákem u jídelního stolu."
