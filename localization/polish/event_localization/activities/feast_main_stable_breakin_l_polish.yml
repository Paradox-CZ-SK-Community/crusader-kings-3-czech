l_polish:
 feast_main_stable_breakin.0002.t: "Divoká jízda"
 feast_main_stable_breakin.0002.breakin_with_helper: "Jídlo a pití už byly v plném proudu, když [breakin_stager.GetTitledFirstName] [Select_CString(breakin_stager.IsFemale,'usoudila','usoudil')], že nastal čas projet se na koni. Stáje byly pevně zamčené, ale s pomocí [breakin_helper.GetTitledFirstName] [breakin_stager.GetFirstName] brzy [Select_CString(breakin_stager.IsFemale,'dovedla','dovedl')] dovnitř skupinu nadšených jezdců.\n\nNikdo však zvířata nedokázal pořádně ovládat, takže se sálem nesly nadávky i smích a nechyběly ani zlomené kosti, když muži i ženy padali z koní potulujících se po síni!"
 feast_main_stable_breakin.0002.breakin_with_deviant: "Jídlo už bylo v plném proudu a pití pokročilo možná až příliš, když [breakin_stager.GetTitledFirstName] [Select_CString(breakin_stager.IsFemale,'usoudila','usoudil')], že nastal čas projet se na koni. Stáje byly pevně zamčené, ale s pomocí [breakin_deviant.GetTitledFirstName] [breakin_stager.GetFirstName] brzy [Select_CString(breakin_stager.IsFemale,'dovedla','dovedl')] dovnitř skupinu nadšených jezdců.\n\nNikdo však zvířata nedokázal ani trochu ovládat, takže se sálem nesly nadávky i smích a nechyběly ani zlomené kosti, když muži i ženy padali z koní potulujících se po síni!"
 feast_main_stable_breakin.0002.breakin_with_noone: "Jídlo už bylo v plném proudu a pití pokročilo možná až příliš, když [breakin_stager.GetTitledFirstName] [Select_CString(breakin_stager.IsFemale,'usoudila','usoudil')], že nastal čas projet se na koni. Stáje byly pevně zamčené, ale [breakin_stager.GetFirstName] nějak [Select_CString(breakin_stager.IsFemale,'dokázala','dokázal')] dostat dovnitř skupinu nadšených jezdců.\n\nNikdo však zvířata nedokázal ani trochu ovládat, takže se sálem nesly nadávky i smích a nechyběly ani zlomené kosti, když muži i ženy padali z koní potulujících se po síni!"
 feast_main_stable_breakin.0002.bystander_riding: "\n\nAni ostatní zvířata ve stájích nevyvázla o mnoho lépe a jedna koza se málem zhroutila pod vahou [breakin_bystander.GetTitledFirstName]."
 feast_main_stable_breakin.0002.deviant_discovered: "\n\nVečer však nabral nečekaný směr, když [breakin_deviant.GetTitledFirstName] [Select_CString(breakin_deviant.IsFemale,'byla přistižena','byl přistižen')] vzadu ve stájích při nevyslovitelném počínání s volem! Skvrna téhle hanby už nikdy neopustí [Select_CString(breakin_deviant.IsFemale,'její duši','jeho duši')]."
 feast_main_stable_breakin.0002.what_a_silly_bunch: "\n\nNakonec se čeledínům podařilo vyděšená zvířata zkrotit a alespoň ti rozumnější z nás měli o pořádnou podívanou postaráno!"
 feast_main_stable_breakin.0002.a: "To je ale zábavná banda bláznů."
 feast_main_stable_breakin.0002.b: "Ach ne, chudák zvíře!"
 feast_main_stable_breakin.0002.secret_of_my_own: "To je příšerné... naprosto příšerné..."
 feast_main_stable_breakin.0003.t: "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0003.breakin_with_helper: "Jídlo už bylo v plném proudu a pití pokročilo možná až příliš, když [breakin_stager.GetTitledFirstName] [Select_CString(breakin_stager.IsFemale,'usoudila','usoudil')], že nastal čas projet se na koni. Mé stáje byly pevně zamčené, ale s pomocí [breakin_helper.GetTitledFirstName] [breakin_stager.GetFirstName] brzy [Select_CString(breakin_stager.IsFemale,'dovedla','dovedl')] dovnitř skupinu nadšených jezdců.\n\nNikdo však má zvířata nedokázal ani trochu ovládat, takže se sálem nesly nadávky i smích a nechyběly ani zlomené kosti, když muži i ženy padali z koní potulujících se po síni!"
 feast_main_stable_breakin.0003.breakin_with_deviant: "Jídlo už bylo v plném proudu a pití pokročilo možná až příliš, když [breakin_stager.GetTitledFirstName] [Select_CString(breakin_stager.IsFemale,'usoudila','usoudil')], že nastal čas projet se na koni. Mé stáje byly pevně zamčené, ale s pomocí [breakin_deviant.GetTitledFirstName] [breakin_stager.GetFirstName] brzy [Select_CString(breakin_stager.IsFemale,'dovedla','dovedl')] dovnitř skupinu nadšených jezdců.\n\nNikdo však má zvířata nedokázal ani trochu ovládat, takže se sálem nesly nadávky i smích a nechyběly ani zlomené kosti, když muži i ženy padali z koní potulujících se po síni!"
 feast_main_stable_breakin.0003.breakin_with_noone: "Jídlo už bylo v plném proudu a pití pokročilo možná až příliš, když [breakin_stager.GetTitledFirstName] [Select_CString(breakin_stager.IsFemale,'usoudila','usoudil')], že nastal čas projet se na koni. Mé stáje byly pevně zamčené, ale [breakin_stager.GetFirstName] nějak [Select_CString(breakin_stager.IsFemale,'dokázala','dokázal')] dostat dovnitř skupinu nadšených jezdců.\n\nNikdo však má zvířata nedokázal ani trochu ovládat, takže se sálem nesly nadávky i smích a nechyběly ani zlomené kosti, když muži i ženy padali z koní potulujících se po síni!"
 feast_main_stable_breakin.0003.bystander_riding: "\n\nAni ostatní zvířata ve stájích nevyvázla o mnoho lépe a jedna koza se málem zhroutila pod vahou [breakin_bystander.GetTitledFirstName]."
 feast_main_stable_breakin.0003.deviant_discovered: "\nVečer však nabral nečekaný směr, když [breakin_deviant.GetTitledFirstName] [Select_CString(breakin_deviant.IsFemale,'byla přistižena','byl přistižen')] vzadu ve stájích při nevyslovitelném počínání s jedním z mých volů!\nSkvrna téhle hanby už nikdy neopustí [Select_CString(breakin_deviant.IsFemale,'její duši','jeho duši')]."
 feast_main_stable_breakin.0003.what_a_silly_bunch: "\n\nNakonec se čeledínům podařilo vyděšená zvířata zkrotit a alespoň ti rozumnější z nás měli o pořádnou podívanou postaráno!"
 feast_main_stable_breakin.0003.a: "Čeledíni, zachraňte ty lidi před nimi samotnými!"
 feast_main_stable_breakin.0003.b: "Kazíte mravy mým zvířatům!"
 feast_main_stable_breakin.0003.secret_of_my_own: "Můj drahý Samsone! S [breakin_deviant.GetFirstName]?!"
 feast_main_stable_breakin.0004.t: "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0004.breakin_with_helper: "Jídlo a pití jsou sice fajn, ale já [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] trochu zábavy!\n[breakin_helper.GetTitledFirstName] [Select_CString(breakin_helper.IsFemale,'přišla','přišel')] s geniálním plánem ohledně stájí a zanedlouho jsem vedl skupinu nadšených jezdců skrz ty žalostné brány a zámky.\nKdyž jsme přivedli koně do síně, ozval se křik i smích a já ostatním hostům [Select_CString(ROOT.Char.IsFemale,'předvedla','předvedl')] úžasnou ukázku jezdeckého umění!"
 feast_main_stable_breakin.0004.breakin_with_deviant: "Jídlo a pití jsou sice fajn, ale já [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] trochu zábavy!\n[breakin_deviant.GetTitledFirstName] [Select_CString(breakin_deviant.IsFemale,'přišla','přišel')] s geniálním plánem ohledně stájí a zanedlouho jsem vedl skupinu nadšených jezdců skrz ty žalostné brány a zámky.\nKdyž jsme přivedli koně do síně, ozval se křik i smích a já ostatním hostům [Select_CString(ROOT.Char.IsFemale,'předvedla','předvedl')] úžasnou ukázku jezdeckého umění!"
 feast_main_stable_breakin.0004.breakin_with_noone: "Jídlo a pití jsou sice fajn, ale já [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] trochu zábavy!\n\n[Select_CString(ROOT.Char.IsFemale,'Vzala','Vzal')] jsem tedy věci do vlastních rukou a [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')] skupinu nadšených jezdců skrz ty žalostné brány a zámky střežící stáje.\n\nBrzy se ozval křik a smích, když nás hosté sledovali, jak se na zvířatech proháníme po síni!"
 feast_main_stable_breakin.0004.bystander_riding: "\nVe stájích nebyli zavření jen koně a [breakin_bystander.GetTitledFirstName] se [Select_CString(breakin_bystander.IsFemale,'přiřítila','přiřítil')] na koze! Byla to ohromná zábava, dokud se pod [Select_CString(breakin_bystander.IsFemale,'ní','ním')] nezhroutila. A pak vlastně také."
 feast_main_stable_breakin.0004.deviant_discovered: "\nSmích a veselí však rázem utichly, když [breakin_deviant.GetTitledFirstName] [Select_CString(breakin_deviant.IsFemale,'byla přistižena','byl přistižen')] vzadu ve stájích při nevyslovitelném hříchu s volem! To je ale [Select_CString(breakin_deviant.IsFemale,'darebnice','darebák')]!"
 feast_main_stable_breakin.0004.signoff: "\n\nByla to skvělá noc, i když podrobnosti mám v paměti poněkud zamlžené."
 feast_main_stable_breakin.0004.a: "Už se nemůžu dočkat, až si to zopakujeme."
 feast_main_stable_breakin.0005.t: "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0005.breakin: "Byli jsme už pěkně namol, [breakin_stager.GetTitledFirstName] [Select_CString(breakin_stager.IsFemale,'chtěla','chtěl')] trochu zábavy a já [Select_CString(ROOT.Char.IsFemale,'vnukla','vnukl')] nápad, že by do ní možná měla být zapojena zvířata našeho hostitele...\n\nNetrvalo dlouho a cesta nás zavedla do stájí, odkud začali další opilí hosté vodit koně přímo do hodovní síně!"
 feast_main_stable_breakin.0005.bystander_riding: "\n\nNebyla tam jen koňská zvířata a [breakin_bystander.GetTitledFirstName] se [Select_CString(breakin_bystander.IsFemale,'přiřítila','přiřítil')] na koze, dokud se pod [Select_CString(breakin_bystander.IsFemale,'její','jeho')] vahou nezhroutila."
 feast_main_stable_breakin.0005.deviant_discovered: "\n\nBylo mi jasné, jak moc je to špatně, ale uprostřed všeho toho zmatku mě nic nedokázalo udržet dál od vola vzadu ve stájích. \n\nKdyž se ozvaly zděšené výkřiky mého jména, bylo mi jasné, že má pověst je zničená, ale v tu chvíli mi jakákoli hanba byla lhostejná. "
 feast_main_stable_breakin.0005.got_away_with_it: "\n\nTen rozruch byl přesně tím, co jsem potřeboval, a už mě nic nedokázalo udržet dál od vola vzadu ve stájích. \nTo, co se tam dělo, bylo opravdu špatné, ale právě nebezpečí odhalení tomu dodávalo ještě větší vzrušení!"
 feast_main_stable_breakin.0005.a: "Na tu noc nedokážu přestat myslet."
 feast_main_stable_breakin.0006.t: "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0006.breakin_with_helper: "Byli jsme už pěkně namol, [breakin_stager.GetTitledFirstName] [Select_CString(breakin_stager.IsFemale,'chtěla','chtěl')] trochu zábavy a [Select_CString(breakin_stager.IsFemale,'dostala','dostal')] nápad, že by do ní možná měla být zapojena zvířata našeho hostitele... \n\nNetrvalo dlouho a společně jsme se dobývali do stájí, odkud jsme my i další opilí hosté začali vodit koně přímo do hodovní síně!"
 feast_main_stable_breakin.0006.bystander_riding: "\n\nNebyla tam jen koňská zvířata a [breakin_bystander.GetTitledFirstName] se [Select_CString(breakin_bystander.IsFemale,'přiřítila','přiřítil')] na koze, dokud se pod [Select_CString(breakin_bystander.IsFemale,'její','jeho')] vahou nezhroutila."
 feast_main_stable_breakin.0006.deviant_discovered: "\n\nSmích a veselí však byly rázem pryč, když [breakin_deviant.GetTitledFirstName] [Select_CString(breakin_deviant.IsFemale,'byla přistižena','byl přistižen')] vzadu ve stájích při nevyslovitelném hříchu s volem!"
 feast_main_stable_breakin.0006.all_in_good_fun: "\n\nPodle všeho to byla dobrá podívaná, takže [activity.GetOwner.GetTitledFirstName] [Select_CString(activity.GetOwner.IsFemale,'dala','dal')] jasně najevo, že za naše počínání nebudeme potrestáni."
 feast_main_stable_breakin.0006.a: "Pro dobrou hostinu cokoli!"
 feast_main_stable_breakin.0007.t: "$feast_main_stable_breakin.0002.t$"
 feast_main_stable_breakin.0007.breakin: "Byli jsme už pěkně namol, [breakin_stager.GetTitledFirstName] [Select_CString(breakin_stager.IsFemale,'chtěla','chtěl')] trochu zábavy a [Select_CString(breakin_stager.IsFemale,'dostala','dostal')] nápad, že by do ní možná měla být zapojena zvířata našeho hostitele...\n\nNetrvalo dlouho a společně jsme se dobývali do stájí, odkud jsme my i další opilí hosté začali vjíždět na koních přímo do hodovní síně!"
 feast_main_stable_breakin.0007.bystander_riding: "\n\nZa dopravní prostředek mi posloužilo první zvíře, které bylo po ruce. Později mi řekli, že to byla koza, a její zhroucení pod mou vahou také vysvětluje některé mé modřiny."
 feast_main_stable_breakin.0007.deviant_discovered: "\n\nVšechno však náhle skončilo, když [breakin_deviant.GetTitledFirstName] [Select_CString(breakin_deviant.IsFemale,'byla přistižena','byl přistižen')] vzadu ve stájích při docela jiném druhu zábavy s volem! Šok a zděšení by jistě přišly, kdyby mě v tu chvíli neopustilo vědomí."
 feast_main_stable_breakin.0007.what_a_silly_bunch: "\n\nPodle všeho z toho byl pořádný poprask. Naštěstí se ostatní hosté bavili natolik, že nás hostitel za naše prohřešky zřejmě ani nechce potrestat."
 feast_main_stable_breakin.0007.a: "Budu prostě předstírat, že si to všechno pamatuju."
 feast_main_stable_breakin.9001.t: "Méně koňských skopičin"
 feast_main_stable_breakin.9001.deviant_caught: "Hostina, kterou pořádá [host_saying_goodbye.GetTitledFirstName], se brzy chýlí ke konci. Je smutné pomyslet na to, že se budeme muset rozloučit, i když mi zase nebude tolik vadit, že už nebudu muset pobývat ve společnosti [breakin_deviant.GetTitledFirstName] a toho vola..."
 feast_main_stable_breakin.9001.in_good_fun: "Hostina, kterou pořádá [host_saying_goodbye.GetTitledFirstName], se brzy chýlí ke konci.\n\nJe smutné pomyslet na to, že se budeme muset rozloučit, ale alespoň se ještě dlouhá léta budeme moci ohlížet zpět a smát se kouskům, které [breakin_stager.GetFirstName] [Select_CString(breakin_stager.IsFemale,'vyváděla','vyváděl')] se svou opilou bandou."
 feast_main_stable_breakin.9001.a: "To si ale užíváme!"
 feast_main_stable_breakin.9002.deviant_caught: "Pomyslet, že už brzy budu muset všechny své hosty vyprovodit! \n\nBude mi líto, až odejdou, tedy až na [breakin_deviant.GetTitledFirstName].\nNa [Select_CString(breakin_deviant.IsFemale,'ni','něj')] totiž nedokážu zapomenout pokaždé, když se podívám na svého nejlepšího vola."
 feast_main_stable_breakin.9002.in_good_fun_or_what: "Všichni mí hosté mají tak skvělou náladu!\n\nTahle hostina nás sblížila a ještě dlouhá léta se budeme moci ohlížet zpět a smát se kouskům, které [breakin_stager.GetFirstName] [Select_CString(breakin_stager.IsFemale,'vyváděla','vyváděl')] se svou opilou bandou.\n\n[breakin_deviant.GetTitledFirstName] mě dokonce žertem [Select_CString(breakin_deviant.IsFemale,'pochválila','pochválil')] za to, v jak dobrém stavu jsou má zvířata!"
 feast_main_stable_breakin.9002.in_good_fun: "Všichni mí hosté mají skvělou náladu!\n\nTahle hostina nás sblížila a ještě dlouhá léta se budeme moci ohlížet zpět a smát se kouskům, které [breakin_stager.GetFirstName] [Select_CString(breakin_stager.IsFemale,'vyváděla','vyváděl')] se svou opilou bandou."
 feast_main_stable_breakin.9002.a: "Uchovejte si mě v srdcích, vazalové!"
 feast_main_stable_breakin.9003.deviant_caught: "Hostina, kterou pořádá [host_saying_goodbye.GetTitledFirstName], se konečně chýlí ke konci.\n\nNa [breakin_deviant.GetTitledFirstName] už se mi těžko dívá stejně jako dřív, ale skoro by si [Select_CString(breakin_deviant.IsFemale,'zasloužila','zasloužil')] mé poděkování za to, že odvedla pozornost od nás ostatních, kteří jsme se do stájí vloupali jako první."
 feast_main_stable_breakin.9003.in_good_fun: "To si ale užíváme! \n\n[host_saying_goodbye.GetTitledFirstName] nám naše malé vloupání zřejmě [Select_CString(host_saying_goodbye.IsFemale,'odpustila','odpustil')], když [Select_CString(host_saying_goodbye.IsFemale,'viděla','viděl')], jak moc se ostatní hosté bavili při pohledu na naši jízdu."
 feast_main_stable_breakin.9003.a: "Nakonec to, co jsme udělali, nebylo tak hrozné."
 feast_main_stable_breakin.9004.deviant_caught: "Vím, že žádný pán ani dáma v panství už se na mě nebude dívat stejně. [host_saying_goodbye.GetTitledFirstName] [Select_CString(host_saying_goodbye.IsFemale,'odsoudila','odsoudil')] mé jméno a [breakin_stager.GetFirstName], s [Select_CString(breakin_stager.IsFemale,'níž','nímž')] jsem se ještě nedávno smál a pil, se na mě už nedokáže ani podívat."
 feast_main_stable_breakin.9004.in_good_fun: "Nemůžu uvěřit, že mi to prošlo!\nKdyž byla zvířata vrácena do stájí, [host_saying_goodbye.GetTitledFirstName] se ode mě dokonce [Select_CString(host_saying_goodbye.IsFemale,'dočkala','dočkal')] pochvaly za to, v jak dobrém stavu jsou tamní zvířata.\n\nKdyby tak [Select_CString(host_saying_goodbye.IsFemale,'věděla','věděl')]!"
 feast_main_stable_breakin.9004.a: "Příště se budu krotit! Snad."
 feast_stable_breakin_log_title: "Vloupání do stájí"
 feast_stable_breakin_log: "[TARGET_CHARACTER.GetTitledFirstName] [Select_CString(TARGET_CHARACTER.IsFemale,'se vloupala do stájí a vypustila zvířata do hodovní síně','se vloupal do stájí a vypustil zvířata do hodovní síně')]."
