l_polish:
 feast_main_stew_flood.0002.t: "Moře guláše"
 feast_main_stew_flood.0002.stew_introduction_blamed: "Měl jsem už trochu příliš upito, když jsem zavrávoral a vrazil do obrovského kotle zavěšeného nad ohništěm v hodovní síni. Uvolnil se ze závěsu a jeho voňavý obsah se vyvalil ven, až podlahu zaplavilo celé moře guláše!"
 feast_main_stew_flood.0002.stew_introduction_blame: "V opileckém zavrávorání se [stew_sea_blamed.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stew_sea_blamed'))], [Select_CString(stew_sea_blamed.IsFemale,'opřela','opřel')] do obrovského kotle zavěšeného nad ohništěm uprostřed hodovní síně a [Select_CString(stew_sea_blamed.IsFemale,'uvolnila','uvolnil')] jej ze závěsu! Voňavý obsah se vyvalil ven, až podlahu zaplavilo celé moře guláše!"
 feast_main_stew_flood.0002.stew_introduction: "V hodovním shonu jeden ze služebníků [activity.GetOwner.GetTitledFirstName] nešťastnou náhodou uvolnil obrovský kotel zavěšený nad ohništěm uprostřed hodovní síně! Voňavý obsah se vyvalil ven, až polovinu místnosti zaplavilo celé moře guláše!"
 feast_main_stew_flood.0002.someone_got_covered: "\n\n[stew_sea_gets_covered.Custom('stew_flood_covered_adjective')] [stew_sea_gets_covered.GetTitledFirstName] [Select_CString(stew_sea_gets_covered.IsFemale,'se ocitla','se ocitl')] přímo v cestě valící se záplavě a hlasitě [Select_CString(stew_sea_gets_covered.IsFemale,'proklínala','proklínal')] svůj zničený vzhled, zatímco po tváři stékal tuk."
 feast_main_stew_flood.0002.splash_desc_standard: "\n\nHosté prchali na druhou stranu síně, zatímco se hustá masa rozlévala po podlaze a její mastné výběžky se plazily mezi uskakujícími chodidly."
 feast_main_stew_flood.0002.every_target: "\n[stew_sea_glutton.GetTitledFirstName] [Select_CString(stew_sea_glutton.IsFemale,'podlehla','podlehl')] své neukojitelné žravosti, [Select_CString(stew_sea_glutton.IsFemale,'vrhla se','vrhl se')] na zem a [Select_CString(stew_sea_glutton.IsFemale,'hltala','hltal')] z masité břečky, co jen [Select_CString(stew_sea_glutton.IsFemale,'mohla','mohl')], zatímco [stew_sea_horrified_character.GetTitledFirstName] to vše [Select_CString(stew_sea_horrified_character.IsFemale,'sledovala','sledoval')] s naprostým zděšením."
 feast_main_stew_flood.0002.only_glutton: "\n\n[stew_sea_glutton.GetTitledFirstName] [Select_CString(stew_sea_glutton.IsFemale,'podlehla','podlehl')] své neukojitelné žravosti, [Select_CString(stew_sea_glutton.IsFemale,'vrhla se','vrhl se')] na zem a [Select_CString(stew_sea_glutton.IsFemale,'hltala','hltal')] z masité břečky, co jen [Select_CString(stew_sea_glutton.IsFemale,'mohla','mohl')]."
 feast_main_stew_flood.0002.only_horror: "\n\n[stew_sea_horrified_character.GetTitledFirstName] [Select_CString(stew_sea_horrified_character.IsFemale,'stála','stál')] uprostřed toho všeho jako přimrazený, v naprostém šoku a zděšení nad tak rozmařilým plýtváním."
 feast_main_stew_flood.0002.a: "Tolik guláše jsem v životě neviděl."
 feast_main_stew_flood.0003.t: "Moře guláše"
 feast_main_stew_flood.0003.stew_introduction_blame: "V opileckém zavrávorání [stew_sea_blamed.GetTitledFirstName] [Select_CString(stew_sea_blamed.IsFemale,'uvolnila','uvolnil')] obrovský kotel zavěšený nad ohništěm uprostřed hodovní síně! Voňavý obsah se vyvalil ven, až polovinu místnosti zaplavilo celé moře guláše!"
 feast_main_stew_flood.0003.stew_introduction: "V hodovním shonu se jednomu hloupému sluhovi podařilo uvolnit obrovský kotel zavěšený nad ohništěm v hodovní síni! Voňavý obsah se vyvalil ven, až polovinu podlahy zaplavilo celé moře guláše!"
 feast_main_stew_flood.0003.someone_got_covered: "\n\n[stew_sea_gets_covered.Custom('stew_flood_covered_adjective')] [stew_sea_gets_covered.GetTitledFirstName], [Select_CString(stew_sea_gets_covered.IsFemale,'sedící','sedící')] hned vedle kotle, [Select_CString(stew_sea_gets_covered.IsFemale,'se ocitla','se ocitl')] přímo v cestě valící se záplavě a hlasitě [Select_CString(stew_sea_gets_covered.IsFemale,'proklínala','proklínal')] svůj zničený vzhled, zatímco po tváři stékal tuk."
 feast_main_stew_flood.0003.splash_desc_standard: "Hosté prchali na druhou stranu síně, zatímco se hustá masa rozlévala po podlaze a její mastné výběžky se plazily mezi uskakujícími chodidly."
 feast_main_stew_flood.0003.every_target: "\n\n[stew_sea_glutton.GetTitledFirstName] [Select_CString(stew_sea_glutton.IsFemale,'podlehla','podlehl')] své neukojitelné žravosti, [Select_CString(stew_sea_glutton.IsFemale,'vrhla se','vrhl se')] na zem a [Select_CString(stew_sea_glutton.IsFemale,'hltala','hltal')] z masité břečky, co jen [Select_CString(stew_sea_glutton.IsFemale,'mohla','mohl')], zatímco [stew_sea_horrified_character.GetTitledFirstName] to vše [Select_CString(stew_sea_horrified_character.IsFemale,'sledovala','sledoval')] s naprostým zděšením."
 feast_main_stew_flood.0003.only_glutton: "\n\n[stew_sea_glutton.GetTitledFirstName] [Select_CString(stew_sea_glutton.IsFemale,'podlehla','podlehl')] své neukojitelné žravosti, [Select_CString(stew_sea_glutton.IsFemale,'vrhla se','vrhl se')] na zem a [Select_CString(stew_sea_glutton.IsFemale,'hltala','hltal')] z masité břečky, co jen [Select_CString(stew_sea_glutton.IsFemale,'mohla','mohl')]."
 feast_main_stew_flood.0003.only_horror: "\n\n[stew_sea_horrified_character.GetTitledFirstName] [Select_CString(stew_sea_horrified_character.IsFemale,'stála','stál')] uprostřed toho všeho jako přimrazený, v naprostém šoku a zděšení nad tak rozmařilým plýtváním."
 feast_main_stew_flood.0003.a: "Proklatý nepořádek!"
 feast_main_stew_flood.0004.t: "Moře guláše"
 feast_main_stew_flood.0004.stew_introduction_blame: "V opileckém zavrávorání [stew_sea_blamed.GetTitledFirstName] [Select_CString(stew_sea_blamed.IsFemale,'uvolnila','uvolnil')] obrovský kotel zavěšený nad ohništěm uprostřed hodovní síně! Voňavý obsah se vyvalil ven, až polovinu podlahy zaplavilo celé moře guláše!"
 feast_main_stew_flood.0004.stew_introduction: "V hodovním shonu jeden ze služebníků [activity.GetOwner.GetTitledFirstName] nešťastnou náhodou uvolnil obrovský kotel zavěšený nad ohništěm uprostřed hodovní síně! Voňavý obsah se vyvalil ven, až polovinu místnosti zaplavilo celé moře guláše!"
 feast_main_stew_flood.0004.getting_covered: "\nSeděl jsem příliš blízko a mastný obsah kotle mě zalil jako příliv zrozený v hlubinách [ROOT.Char.GetFaith.NegativeAfterLife]. Mé šaty se možná podaří vyčistit, ale palčivou hanbu z výsměchu celé síně ze sebe nikdy nesmyju."
 feast_main_stew_flood.0004.a: "Proč se tohle muselo stát zrovna mně?!"
 feast_main_stew_flood.0005.t: "Moře guláše"
 feast_main_stew_flood.0005.stew_introduction_blame: "V opileckém zavrávorání [stew_sea_blamed.GetTitledFirstName] [Select_CString(stew_sea_blamed.IsFemale,'uvolnila','uvolnil')] obrovský kotel zavěšený nad ohništěm uprostřed hodovní síně! Voňavý obsah se vyvalil ven, až polovinu podlahy zaplavilo celé moře guláše!"
 feast_main_stew_flood.0005.stew_introduction: "V hodovním shonu jeden ze služebníků [activity.GetOwner.GetTitledFirstName] nešťastnou náhodou uvolnil obrovský kotel zavěšený nad ohništěm uprostřed hodovní síně! Voňavý obsah se vyvalil ven, až polovinu místnosti zaplavilo celé moře guláše!"
 feast_main_stew_flood.0005.cannot_resist: "\nVšude kolem se rozlévalo tolik lahodného jídla, že jsem se prostě neovládl. Než mi vůbec došlo, co se děje, byl jsem na všech čtyřech a chlemtal guláš jako nějaký obyčejný pes! Vůbec mě nenapadlo, co si o tom pomyslí ostatní hosté, natož hostitel!"
 feast_main_stew_flood.0005.being_watched: "\nCelou dobu jsem jen matně vnímal, jak mě [stew_sea_horrified_character.GetTitledFirstName] [Select_CString(stew_sea_horrified_character.IsFemale,'sleduje','sleduje')] s tváří zkřivenou odporem."
 feast_main_stew_flood.0005.a: "Bylo to prostě příliš dobré!"
 feast_main_stew_flood.0006.t: "Moře guláše"
 feast_main_stew_flood.0006.stew_introduction_blame: "V opileckém zavrávorání [stew_sea_blamed.GetTitledFirstName] [Select_CString(stew_sea_blamed.IsFemale,'uvolnila','uvolnil')] obrovský kotel zavěšený nad ohništěm uprostřed hodovní síně! Voňavý obsah se vyvalil ven, až polovinu podlahy zaplavilo celé moře guláše!"
 feast_main_stew_flood.0006.stew_introduction: "V hodovním shonu jeden ze služebníků [activity.GetOwner.GetTitledFirstName] nešťastnou náhodou uvolnil obrovský kotel zavěšený nad ohništěm uprostřed hodovní síně! Voňavý obsah se vyvalil ven, až polovinu místnosti zaplavilo celé moře guláše!"
 feast_main_stew_flood.0006.shocking_experience: "Bylo toho na mě příliš. Tolik jídla připraveného pro hosty, a teď mělo všechno přijít nazmar."
 feast_main_stew_flood.0006.a: "Musím odvrátit zrak."
 feast_main_stew_flood.0041.t: "Plné břicho"
 feast_main_stew_flood.0041.blame_placed: "Všichni se spokojeně usmíváme a náš hostitel má být na co hrdý. Jen [stew_sea_blamed.GetTitledFirstName] si po převržení kotle nejspíš odnáší víc hanby než uspokojení!"
 feast_main_stew_flood.0041.no_blame_placed: "Všichni se spokojeně usmíváme a náš hostitel má být na co hrdý. Tedy až na služebníka, který převrhl kotel s gulášem. To byla opravdu ostuda."
 feast_main_stew_flood.0041.a: "To byla dobrá hostina."
 feast_main_stew_flood.0042.t: "Plná břicha"
 feast_main_stew_flood.0042.blame_placed: "Když se rozhlédnu po svých hostech, všichni se nad talíři spokojeně usmívají a pohled na ně ve mně probouzí hrdost nad mou štědrostí. Jen [stew_sea_blamed.GetTitledFirstName] si po převržení kotle nejspíš odnáší víc hanby než uspokojení! A úklid rozhodně nebude levný."
 feast_main_stew_flood.0042.no_blame_placed: "Když se rozhlédnu po svých hostech, všichni se nad talíři spokojeně usmívají a pohled na ně ve mně probouzí hrdost nad mou štědrostí. Jen s tím zatraceným služebníkem, který převrhl kotel s gulášem, budu asi muset něco udělat. A úklid rozhodně nebude levný."
 feast_main_stew_flood.0042.a: "Tohle bychom měli dělat častěji!"
 feast_main_stew_flood.0043.blame_placed: "Hostina brzy skončí a já konečně budu moci odejít a vzpamatovat se z té ostudy.\nTen zatracený guláš se dostal úplně všude a vůbec nevím, jestli někdy dostanu ten pach z vlasů! Ještě hodně dlouho nezapomenu, co mi [stew_sea_blamed.GetTitledFirstName] [Select_CString(stew_sea_blamed.IsFemale,'provedla','provedl')]."
 feast_main_stew_flood.0043.no_blame_placed: "Hostina brzy skončí a já konečně budu moci odejít a vzpamatovat se z té ostudy.\nTen zatracený guláš se dostal úplně všude a vůbec nevím, jestli někdy dostanu ten pach z vlasů! Ještě hodně dlouho nezapomenu, co mi ten služebník provedl."
 feast_main_stew_flood.0043.a: "Guláš už nikdy nevezmu do úst."
 feast_main_stew_flood.0044.desc: "Hostina brzy skončí a po celou dobu se nad ní jako přízrak vznášel pach guláše. Nemůžu uvěřit, že zrovna já musel mít takovou smůlu, a jen... si přeju, aby se to nikdy nestalo!"
 feast_main_stew_flood.0044.a: "Snad byli všichni příliš opilí, než aby si to pamatovali."
 stew_flood_covered_adjective_wrathful: "podrážděně se tvářící"
 stew_flood_covered_adjective_proud: "pyšně se tvářící"
 stew_flood_covered_adjective_beautiful: "krásně vypadající"
 stew_flood_fallback_adjective: "nic netušící"
 feast_stew_flood_log_title: "Záplava guláše"
 feast_stew_flood_log: "[TARGET_CHARACTER.GetTitledFirstName] [Select_CString(TARGET_CHARACTER.IsFemale,'byla zalita','byl zalit')] horkým gulášem při nehodě s obrovským kotlem."
