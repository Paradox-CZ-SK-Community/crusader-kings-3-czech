 festival.114.t: "[Select_CString(target_character.IsFemale,'Opuštěná na břehu','Opuštěný na břehu')]"
 festival.114.desc: "Když se se svými společníky procházíme nočním vzduchem, narazíme na [target_character.GetTitledFirstName], jak toužebně hledí na vodu.\n\nNejdřív si myslím, že [target_character.GetFirstNameNoTooltip] jen obdivuje krásu měsíčního odrazu, ale pak mou pozornost upoutá hluk od skupinky rozjařených lidí. Zdá se, že vyrazili na člunu a chudák [target_character.GetTitledFirstName] [Select_CString(target_character.IsFemale,'zůstala','zůstal')] na břehu!"
 festival.114.a: "„Zapomeň na ně a přidej se k nám!“"
 festival.114.b: "„Jak žalostné! Jaké to je, když tě odhodí jako rozbitou hračku?“"
 festival.114.c: "#EMP My#! bychom nikoho ze svých nikdy neopustili."
