 festival.106.t: "Liščí svatba"
 festival.106.desc: "Měl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem štěstí, že jsem se ukryl[Select_CString(ROOT.Char.IsFemale,'a','')] ve stínu pavilonu, když se ze sluncem zalité oblohy spustil liják – liščí svatba, jak se říká.\n\nChudák [target_character.GetTitledFirstName] však schytá déšť naplno a do úkrytu se přišourá jako promoklá kočka.\n\n„Prosím, potřebuji jiné šaty!“ naléhá [target_character.GetFirstNameNoTooltip]. „[target_character2.GetTitledFirstName] míří sem, a jestli mě uvidí v takovém stavu, je po mně.“"
 festival.106.a: "Moji služebníci něco přinesou."
 festival.106.b: "Zabavím [target_character2.GetTitledFirstNameNoTooltip], tak utíkej!"
 festival.106.c: "[target_character2.GetFirstNameNoTooltip] se tímhle #EMP náramně#! pobaví."
 festival.106.b.success: "Úspěšně zabavíš [target_character2.GetTitledFirstName]"
 festival.106.b.success.toast: "Příjemně si popovídáš s [target_character2.GetTitledFirstName]"
 festival.106.b.failure: "[target_character2.GetTitledFirstName] si všimne, že něco není v pořádku"
 festival.106.b.failure.toast: "[target_character2.GetTitledFirstNameNoTooltip] tě podezírá"
