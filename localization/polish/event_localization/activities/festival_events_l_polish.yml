 festival.1000.t: "Vážená společnost"
 festival.1000.desc: "V poklidu si užíváme pozvolný průběh oslav a ve stínu si nakonec vyměňujeme zdvořilosti i sladkosti já, [bloc_member_head_1.GetTitledFirstName] z rodu [bloc_member_head_1.GetHouse.GetBaseName] a [bloc_member_head_2.GetTitledFirstName] z rodu [bloc_member_head_2.GetHouse.GetBaseName]."
 festival.1000.outro: "\n\nMy tři patříme k nejvýznamnějším šlechticům panství a příležitostí setkat se takhle přirozeně se nenaskýtá mnoho."
 festival.1000.a: "„Má rodina má štěstí, že se těší tak vzácné společnosti.“"
 festival.1000.b: "„Rod [bloc_member_head_1.GetHouse.GetBaseNameNoTooltip] počítám mezi své vážené přátele.“"
 festival.1000.c: "[bloc_member_head_1.GetFirstNameNoTooltip], baví tě klanět se rodu [bloc_member_head_1.GetHouse.GetConfederation.GetLeadingHouse.GetBaseNameNoTooltip]?"
 festival.1000.e: "„Sídlo rodu [bloc_member_head_1.GetHouse.GetBaseNameNoTooltip] stojí za vidění.“"
 festival.1000.f: "„Rod [bloc_member_head_2.GetHouse.GetBaseNameNoTooltip] se letos opravdu předvedl.“"
 festival.1000.g: "Takové chvíle je nejlepší prostě ocenit."
 festival.2000.t: "Loučení"
 festival.2000.intro_desc: "Noční veselí pomalu utichá a ustupuje prvním zlatým paprskům úsvitu. Účastníci si vychutnávají poslední okamžiky, než se vrátí k všedním každodenním povinnostem.\n\n"
 festival.2000.intro_part_two: "[friendly_attendee.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', friendly_attendee)], ke mně přichází. „Tvá společnost mi v posledních dnech byla velmi milá,“ pronese a na okamžik se odmlčí s vřelým úsměvem.\n\n"
 festival.2000.bloc_invitation: "„Natolik, že bychom ti já a mí druhové rádi nabídli místo mezi námi. Ty se budeš moci počítat k našim řadám a my ti na oplátku budeme vždy krýt záda.“"
 festival.2000.befriending: "„Bylo by pro mě nesmírnou ctí, kdybys mě napříště počítal[Select_CString(ROOT.Char.IsFemale,'a','')] mezi své důvěrníky.“"
 festival.2000.nobody_likes_you: "Proud ospalých a nasycených hostů od ubytování směrem k cestě postupně slábne, až nakonec ustane docela. Brzy zůstanu jen já a můj doprovod."
 festival.2000.a_accept: "Můžeš se spolehnout na mou podporu, stejně jako já na tu vaši."
 festival.2000.a_decline: "Děkuji, ale vyhovuje mi, jak se věci mají."
 festival.2000.b_accept: "Taková pouta jsou vzácná a je třeba si jich vážit."
 festival.2000.b_decline: "Velmi si tvé přízně vážím, ale musím odmítnout."
 festival.2000.c: "Tyto prchavé radosti si uchováme ve vzpomínkách."
