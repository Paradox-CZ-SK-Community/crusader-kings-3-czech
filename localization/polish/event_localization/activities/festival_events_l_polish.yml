 festival.105.t: "Zkouška důvtipu"
 festival.105.desc: "Z větve se lehce pohupuje lístek popsaný elegantním rukopisem. „[target_character.GetTitledFirstName] nám [Select_CString(target_character.IsFemale,'připravila','připravil')] hádanku!“ zvolá [target_character2.GetTitledFirstName].\n\n„Spíš výzvu,“ namítne [target_character3.GetTitledFirstName]. „[target_character.GetFirstNameNoTooltip] si myslí, že je z nás [Select_CString(target_character.IsFemale,'nejchytřejší','nejchytřejší')]. Tomu, kdo ji vyřeší jako první, [Select_CString(target_character.IsFemale,'slíbila','slíbil')] splnit jakékoli přání; #EMP očividně#! neočekává, že by někdo z nás uspěl.“"
 festival.105.a: "Tu hádanku rozluštím a s ní i pýchu [target_character.GetTitledFirstNameNoTooltip]!"
 festival.105.b: "Tak zapeklitá hádanka! Důvtip [target_character.GetTitledFirstNameNoTooltip] skutečně nemá obdoby."
 festival.105.c: "Tohle je začátek soutěže důvtipu!"
 festival.105.a.success: "Hádanku vyřešíš s působivou lehkostí"
 festival.105.a.success.toast: "Hádanku hravě rozluštíš"
 festival.105.a.failure: "Hádanka tě zcela zaskočí"
 festival.105.a.failure.toast: "Hádanku se ti nepodaří vyřešit"
 festival.105.c.success: "Stejně dobře řešíš hádanky jako mateš ostatní hádankáře"
