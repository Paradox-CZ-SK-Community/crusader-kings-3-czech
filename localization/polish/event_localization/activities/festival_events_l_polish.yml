l_polish:
 festival.001.t: "Ztracen v davu"
 festival.001.desc: "Když pozoruji dav, který se přišel veselit, těší mě dětský smích i spokojené úsměvy jejich rodičů. Pak mi ale padne do oka cosi, co se mezi lidmi pohybuje nepravidelně. Na dítě je to příliš malé a příliš... #EMP chlupaté#!?\n\nVypadá to jako štěně. Kulhá mezi kroky obrů, ztracené a úplně samo."
 festival.001.a.tt: "#weak Najděme tomu štěněti nový domov#!"
 festival.001.a: "Pojď sem, drobečku. U mě se o tebe dobře postarají."
 festival.001.b: "Jeho osud mě nezajímá."
 festival.001.b.tt: "Štěně si určitě najde nový domov...?"
 festival.001.b.custom.tooltip: "Necháš štěně napospas osudu"
 festival.002.t: "Zvídavá mysl"
 festival.002.desc: "Lehké zatažení za rukáv odvede mou pozornost od festivalového veselí. Pohlédnu dolů a setkám se s očima malého dítěte, doširoka rozevřenýma úžasem.\n\n„Proč je tu tolik lidí?“ zeptá se [curious_child.GetFirstNameNoTooltip] s bezelstnou dětskou zvědavostí. „Co se děje?“"
 festival.002.a: "Tak dobře, povím ti jeden příběh..."
 festival.002.a.inspired_child: "[curious_child.GetFirstNameNoTooltip] dychtivě naslouchá"
 festival.002.a.bored_child: "Dítě vyprávění příběhů nebaví"
 festival.002.b: "Rodiče tě neučili, že nemáš mluvit s cizími lidmi?"
 festival.002.b.flavor: "#weak Tenhle drzý spratek si za svou nestydatost zaslouží pořádnou „odměnu“.#!"
 festival.002.c: "Ať někdo odvede [curious_child.GetFirstNameNoTooltip] zpátky k rodičům. #EMP Hned#!."
 child_is_excited: "Dítě je z tvých příběhů nadšené"
 child_is_bored: "Dítě během tvého vyprávění zívne a odejde"
 child_is_kicked: "Po rychlém pohlavku dítě uteče zpátky do davu"
 festival.003.t: "Lahodné laskominy"
 festival.003.desc: "Od stánků prodejců se line vůně [ROOT.Char.Custom('GetLocalStreetFoodPlural')] a mému kručícímu žaludku našeptává sladké i slané přísliby.\n\nDlouhá fronta je jasným důkazem, jaký je o tyto pochoutky zájem, ale hostitel dnešních oslav má přece nárok na #EMP nějaké#! výsady?!"
 festival.003.a: "Udělejte místo pro [ROOT.Char.GetTitleAsNameNoTooltip]!"
 festival.003.b: "Ať si lidé užijí své drobné radosti."
 festival.004.t: "Šeptaná přání"
 festival.004.desc: "Hosté se shromažďují kolem bambusu, na jehož větvích visí papírky s jejich přáními.\n\nV jemné záři hvězd svěřuje můj lid své sny milencům na nebesích a napadá mě, že i já bych si mohl[Select_CString(ROOT.Char.IsFemale,'a něco přát',' něco přát')]."
 festival.004.a: "Kéž bohové dopřejí všem bohatství a hojnost."
 festival.004.b: "Přeji si lásku věčnou jako samotné hvězdy."
 festival.004.c: "Dopřejte mi sílu uskutečnit mé ambice."
 festival.004.d: "Přeji si brzy nalézt lásku."
 prosperity_festival_in_province_modifier: "Přání prosperity"
 prosperity_festival_in_province_modifier_desc: "Zdá se, že tomuto hrabství jsou hvězdy nakloněny a jeho vládce si přál prosperitu pro všechny"
 prosperity_festival_find_love_modifier: "Přání lásky"
 prosperity_festival_find_love_modifier_desc: "Tato postava si přála nalézt lásku"
 prosperity_festival_health_modifier: "Přání zdraví"
 prosperity_festival_health_modifier_desc: "Tato postava si přála zdraví"
 festival.005.t: "Publikum v hrsti"
 festival.005.desc: "Když se festival blíží k vrcholu, můj [target.chaplain.Custom('MyPriestTitle')] vystoupí na pódium a hlas [target_chaplain.GetFirstNameNoTooltip] se rozlehne nad davem. [target_chaplain.GetFirstNameNoTooltip] začne velebit mravní nápravu a duchovní kázeň a pokouší se proměnit radostnou atmosféru mého festivalu v kázání. Některé jeho[Select_CString(target_chaplain.IsFemale,' její','')] výroky inspirují, jiní však reptají, že na festivalu není pro takovou vážnost místo."
 festival.005.a: "[target_chaplain.GetFirstNameNoTooltip] mluví jménem božského."
 festival.005.b: "Sám[Select_CString(ROOT.Char.IsFemale,'a','')] mu[Select_CString(target_chaplain.IsFemale,' jí','')] domluvím."
 festival.005.c: "Toho kázání už mám dost. Sundejte [target_chaplain.GetFirstNameNoTooltip] z pódia!"
 festival.005.b.success: "Podaří se ti přesvědčit [target_chaplain.GetFirstNameNoTooltip], aby odešel[Select_CString(target_chaplain.IsFemale,'a','')] z pódia"
 festival.005.b.tt.success: "Přesvědčíš [target_chaplain.GetFirstNameNoTooltip]"
 festival.005.b.failure: "Božským zápalem [Select_CString(target_chaplain.IsFemale,'hnaná','hnaný')] horlivost [target_chaplain.GetFirstNameNoTooltip] nepolevuje"
 festival.005.b.tt.failure: "Nepodaří se ti přesvědčit [target_chaplain.GetFirstNameNoTooltip]"
 festival.006.t: "Obřad očisty"
 festival.006.desc: "Když slavnostní modlitby skončí, [ROOT.Char.GetFaith.PriestNeuterPlural] zahájí očistný obřad, jenž má smýt veškerou duchovní nečistotu a zajistit harmonii v nadcházejícím roce. Součástí obřadu je i má posvátná povinnost nabrat čistou vodu ze svaté studny."
 festival.006.a: "Dnes poslouží pokora lépe než pýcha."
 festival.006.b: "Okázalá podívaná by mohla pozvednout mou prestiž."
 festival.006.c: "Ať se toho ujme někdo méně významný. Mému postavení to nepřísluší."
 festival.007.t: "Souboj za svitu měsíce"
 festival.007.desc: "Měsíc vystoupal vysoko a ohlašuje půlnoc. S ní začíná i lidem odedávna oblíbená zkouška síly. [ROOT.Char.GetFaith.PriestMale] vhodí mezi dav tyče a tradice praví, že ty, kdo se z nastalé vřavy vynoří s jednou z nich v ruce, čeká v příštím roce velké štěstí."
 festival.007.a: "To štěstí bude moje!"
 festival.007.b: "Nechám ostatní unavit a pak si nenápadně dojdu pro vítězství."
 festival.007.c: "Některé soutěže je lepší sledovat z publika."
 festival.007.a.success: "Přemůžeš své soupeře"
 festival.007.a.failure: "Soupeři přemohou tebe"
 festival.007.b.success: "Přelstíš své soupeře"
 festival.007.b.failure: "Soupeři se oklamat nenechají"
 festival.007.a.tt.success: "Zvítězil[Select_CString(ROOT.Char.IsFemale,'a','')] jsi"
 festival.007.a.tt.failure: "Prohrál[Select_CString(ROOT.Char.IsFemale,'a','')] jsi"
 festival.008.t: "Tanec hojnosti"
 festival.008.desc: "Samotný vzduch se chvěje pískáním fléten a duněním bubnů, zatímco [Select_CString(dancer.IsFemale,'mladé ženy','mladí muži')] ladně tančí ve svých pestrobarevných, splývavých rouchách.\n\nJejich elegantní vystoupení, lahodící smrtelníkům i bohům, má požehnat zemi pod našima nohama bohatou úrodou."
 festival.008.a: "Jak nádherný tanec."
 festival.008.b: "Při pohledu na ně cítím skutečný klid."
 respected_tradition_modifier: "Respektovaná tradice"
 festival.009.t: "Přání zavěšené na stromě"
 festival.009.desc: "V [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitlyNoTooltip] mají místní tradici svěřovat svá nejniternější přání papírovým lístkům a zavěšovat je na strom.\n\nKdyž si je prohlédnu zblízka, vidím většinou to, co by člověk čekal – bohatství, lásku, prosperitu. Mezi nimi se však najdou i přání naplněná mnohem temnějšími touhami."
 festival.009.a: "Znát nejniternější myšlenky druhých není malá výhoda."
 festival.009.b: "Zloba mezi těmito větvemi nemá co dělat."
 festival.010.t: "Papírová požehnání"
 festival.010.desc: "Ulice hýří životem a barvami, ve vánku se třepotají nesčetné pestré ozdoby. Vzduch naplňuje jásot a smích, zatímco lidé obdivují výrobky řemeslníků. Možná bych si mohl[Select_CString(ROOT.Char.IsFemale,'a','')] některou z těchto ozdob pořídit i pro sebe?"
 festival.010.a: "Sadu barevných papírových jeřábů jako připomínku významu rodiny."
 festival.010.b: "Nádherně skládané papírové kimono jako symbol zdraví."
 festival.010.c: "Ať se takto zdobí ostatní. Mně sluší prostota."
 good_health_modifier: "Zdravý život"
 good_health_modifier_desc: "Tato postava si pořídila ozdobu v podobě papírového kimona."
 strong_family_modifier: "Rodinná pouta"
 strong_family_modifier_desc: "Tato postava si pořídila ozdobu v podobě papírového jeřába."
 festival.012.t: "Bouřlivé oslavy"
 festival.012.desc: "Lampiony osvětlují večerní veselí, zatímco vzduch pulzuje hudbou a výbuchy smíchu. Pohled na tu scénu mě nenechává chladným."
 festival.012.a: "Jejich prostá radost konejší duši."
 festival.012.b: "Tahle živost je nesmírně osvěžující."
 festival.012.c: "Ten rámus je nesnesitelný. Toužím po klidu."
 festival_spirit_modifier: "Festivalový duch"
 festival_spirit_modifier_desc: "Festivalová atmosféra vlila této postavě novou energii."
 festival.014.t: "Dny tančících rukávů"
 festival.014.desc: "Dnešek je příležitostí k oslavám, ale také k zajištění přízně bohů. Naše chování i obětiny budou sledovat oči smrtelníků i božstev, a proto musíme dbát, aby bylo vše v pořádku."
 festival.014.a: "Kéž na nás bohové shlížejí s přízní."
 festival.016.t: "Poskvrněná čest"
 festival.016.desc: "Vedle mě v naprosté hrůze stojí [clumsy_oaf.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('clumsy_oaf'))], a oba hledíme na saké stékající po mém rouchu. Luxusní látka už tmavne pod rychle se šířící skvrnou.\n\nLidé kolem nás strnuli zvědavostí a skrývají své reakce za malovanými vějíři. Čekají – ne, přímo očekávají – výbuch hněvu."
 festival.016.a: "Nemehlo! Za tohle zaplatí!"
 festival.016.b: "Roucho se dá nahradit."
 festival.017.t: "Vzpurné loutky"
 festival.017.desc: "Potulný loutkář se rozhodl udělat z festivalu své jeviště a kolem něj se shromáždily desítky pochechtávajících se diváků.\n\nKdyž sleduji tančící loutky, představení začíná nabírat nepříjemný směr. Postava panovačného vládce mi připadá až příliš povědomá a dav se jeho neobratností baví mnohem víc, než je mi milé."
 festival.017.a: "Budu se smát hlasitěji než všichni ostatní!"
 festival.017.b: "Spalte ty drzé loutky."
 festival.017.c: "Moji spolčenci by měli sledovat reakce publika."
 festival.018.t: "Trans a obětina"
 festival.018.desc: "Kněžka svatyně se prudce třese, jako by ji něco posedlo, a nepřirozeným hlasem pronáší příkazy božstva.\n\nZdá se, že toto konkrétní božstvo má slabost pro saké, a to ve značném množství. Odmítnutím bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] urazit mocnou bytost, ale nemohu se zbavit pochybností, zda nejde spíš o bezbožné divadlo než skutečné vzývání."
 festival.018.a: "Přineste saké a připijme si společně!"
 festival.018.b: "Co takhle skromný pohár a pozvání..."
 festival.018.c: "Tohle představení končí."
 friend_invited_priestess: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'pozvala','pozval')] [TARGET_CHARACTER.GetShortUIName] na svůj dvůr poté, co [Select_CString(CHARACTER.IsFemale,'viděla','viděl')] působivé vystoupení [TARGET_CHARACTER.GetShortUIName] na festivalu."
 friend_invited_priestess_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'byla pozvána','byl pozván')] na dvůr [TARGET_CHARACTER.GetShortUIName] poté, co [TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsFemale,'viděla','viděl')] působivé vystoupení [CHARACTER.GetShortUIName] na festivalu."
 festival.019.t: "Drama na rozkaz"
 festival.019.desc: "Můj správce [play_planner.GetFirstName] se přede mnou uctivě ukloní. „Bude se hrát divadelní představení, [ROOT.Char.Custom('FormOfAddressForLiege')],“ pronese. „Ale volba příběhu náleží vám.“ Má pobavit lid, nebo mu připomenout jeho místo?"
 festival.019.a: "Ať vypráví ságu o slávě mého rodu."
 festival.019.b: "Mravoučná hra lid naučí ctnosti poslušnosti."
 festival.019.c: "Zasvěťte ji bohům a získejme jejich požehnání."
 festival.020.t: "Cválající sláva"
 festival.020.desc: "Řeka se třpytí pod poledním sluncem, zatímco lučištníci nasedají na koně a na protějším břehu pomocníci vztyčují terč – papírový vějíř.\n\nKdesi zaduní buben a na okamžik přehluší šum sázek na to, který z lučištníků zvítězí."
 festival.020.a: "Připravte mého koně – cena bude moje!"
 festival.020.b: "Také si vsadím!"
 festival.020.c: "Ať střílejí, ale přineste mi kousek vějíře pro štěstí."
 festival.021.t: "Pekelné reje"
 festival.021.desc: "Předvídatelný rytmus oslav náhle naruší příchod maskovaných „obrů“ mávajících hořícími pochodněmi, kteří zasypávají prchající dav jiskrami. Nedaleko se kněží připravují k protiútoku, jenž má podle rituálu nevyhnutelně skončit vítězstvím nad zlovolnými duchy."
 festival.021.a: "Tenhle „protiútok“ povedu osobně!"
 festival.021.b: "Zajistěte, aby měla každá domácnost připravený kbelík vody."
 festival.021.c: "Tradice netradice, riziko požáru je příliš velké."
 festival.022.t: "Festivalová řež"
 festival.022.desc: "Dvě skupiny [rumbler_one.GetWomenMen] ze sousedních vesnic se sešly na festivalu, aby podle tradice urovnaly své spory – zvednou nosítka nad hlavu a vrážejí jimi do sebe ve snaze srazit nosítka protivníka k zemi.\n\nPři každém nárazu létají třísky! Bouřlivé povzbuzování davu žene soupeře do stále prudších střetů."
 festival.022.a: "Násilí nedovolím, ať už je tradice jakákoli!"
 festival.022.b: "Vítězové budou štědře odměněni!"
 festival.022.c: "Jestli chce dav podívanou, ať si za ni zaplatí."
 festival.023.t: "Průvod v ohrožení"
 festival.023.desc: "Bubny potažené jelení kůží burácejí a ohlašují začátek slavnostního průvodu. V čele pyšně kráčejí praporečníci v nádherném festivalovém oděvu a za nimi se majestátně tyčí nosítka nesená na ramenou pomocníků.\n\n„Pozor!“ Malebný průvod náhle propadne zmatku, když jeden z nosičů vykřikne a povolí sevření. Nosítka se nebezpečně nakloní."
 festival.023.a: "Držte to, už jdu!"
 festival.023.b: "Toho hlupáka zbijte a jeho vesnice zaplatí pokutu."
 festival.024.t: "Válečný tanec s holemi"
 festival.024.desc: "#EMP PRÁSK!#! #EMP PRÁSK!#! Takový rámus by měl zahnat všechny zlé duchy! Vesničtí mladíci přede mnou dál dupou nohama a s vervou zuřivých válečníků třískají dřevěnými holemi.\n\nTato strhující tradice by se mohla osvědčit i jinak, kdyby jejich hole nahradila kopí."
 festival.024.a: "Označte ty nejsilnější – takové muže bychom mohli využít."
 festival.024.b: "Jejich přesnost je obdivuhodná!"
 festival.024.c: "To je ale ukázka síly."
