 festival.100.t: "Za měsíční noci"
 festival.100.desc: "Posel s pozváním na večer pozorování měsíce pořádaný [target_character.GetTitledFirstName] sotva domluví, když přichází další a přináší dopis, v němž mě zve pro změnu [target_character2.GetTitledFirstName]!\n\nTakové načasování #EMP sotva#! může být náhodné. Obě strany si mě zjevně chtějí otestovat a přijetí jedné pozvánky bude chápáno jako projev sympatií k jejímu odesílateli a zároveň jako pohrdání druhou stranou."
 festival.100.a: "Poctím [target_character.GetTitledFirstNameNoTooltip] svou přítomností."
 festival.100.b: "Společnost [target_character2.GetTitledFirstNameNoTooltip] mi bude milejší."
 festival.100.c: "Pošlete oběma mou omluvu spolu s dary na znamení úcty."
 festival.100.d: "Uspořádáme vlastní setkání a zastíníme jejich oslavy!"
