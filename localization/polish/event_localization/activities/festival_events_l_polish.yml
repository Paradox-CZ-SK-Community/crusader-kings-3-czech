 festival.102.t: "Pozvednuté číše"
 festival.102.desc: "Po dni plném festivalového veselí se snese soumrak a konečně začíná #EMP skutečná#! oslava. Víno našeho hostitele teče proudem jako nekonečná řeka.\n\nKaždý pohár láká k dalšímu a pak k ještě jednomu. [target_character2.GetTitledFirstName] utrousí vtip, z něhož zachytím jen konec, ale [target_character.GetTitledFirstName] se mu směje, jako by to byla ta nejvtipnější věc na světě. Možná mi další doušek pomůže pochopit, co je na tom tak legrační..."
 festival.102.a: "Víno ve mně něco probouzí. Cítím, že přichází óda!"
 festival.102.b: "Tento pohár pozvedám na počest [target_character.GetTitledFirstNameNoTooltip]!"
 festival.102.c: "Myslím, že pro dnešní večer už jsem [Select_CString(ROOT.Char.IsFemale,'vypila','vypil')] dost."
