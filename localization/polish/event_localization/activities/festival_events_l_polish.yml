 festival.103.t: "Chvástavé řeči"
 festival.103.desc: "Když se se svými společníky proplétám davem, zaslechnu hlasité vychloubání.\n\n„Moje $language_chinese_name$ je #EMP vytříbená#!! Vždyť teprve před dvěma týdny [target_character2.GetTitledFirstName] [Select_CString(target_character2.IsFemale,'podrobila','podrobil')] mé básnické umění zkoušce a před mým mistrovstvím [Select_CString(target_character2.IsFemale,'musela','musel')] sklonit hlavu!“ chvástá se [target_character.GetTitledFirstName].\n\nNevzpomínám si na jedinou zvěst o tom, že by [target_character.GetTitledFirstNameNoTooltip] [Select_CString(target_character.IsFemale,'oplývala','oplýval')] básnickým talentem, ale podpořit její[Select_CString(target_character.IsFemale,' tvrzení',' tvrzení')] by se mi mohlo vyplatit. Na druhou stranu je těžké odolat příležitosti srazit takového chvastouna[Select_CString(target_character.IsFemale,' z hřebínku',' z hřebínku')]."
 festival.103.a: "„[target_character.GetFirstNameNoTooltip] mluví pravdu.“"
 festival.103.b: "„Poctěte nás ukázkou svého talentu, [target_character.GetTitledFirstNameNoTooltip].“"
 festival.103.c: "Talent #EMP mých#! přátel je mnohem větší."
