 festival.104.t: "Osamocen v davu"
 festival.104.desc: "Každé setkání má svůj příliv a odliv a člověk si musí dávat pozor na proudy, aby nakonec nezůstal sám na mělčině.\n\nKdyž se [target_character3.GetTitledFirstName] otočí, aby [Select_CString(target_character3.IsFemale,'pozdravila','pozdravil')] [target_character4.GetTitledFirstName], náhle zůstanu v davu bez jediného partnera k hovoru.\n\nO kus dál vidím [target_character.GetTitledFirstName] a [target_character2.GetTitledFirstName], jak se významně dívají mým směrem a cosi si šeptají za vějíři."
 festival.104.a: "Směle se k nim přidám."
 festival.104.b: "Pár mých vlastních šepotů zaseje několik #EMP zajímavých#! myšlenek."
 festival.104.c: "Raději se vrátím ke svým společníkům."
 festival.104.a.success: "Svým odvážným přístupem na ně zapůsobíš"
