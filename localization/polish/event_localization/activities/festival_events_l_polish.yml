 festival_shamed_me: "Zahanbení"
 festival.107.t: "Milostná dobrodružství"
 festival.107.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip]!“ zavolá na mě [target_character2.GetTitledFirstName], když procházím kolem, a pokyne mi, ať se přidám k jeho[Select_CString(target_character2.IsFemale,' její','')] skupince.\n\n„Už jsi slyšel[Select_CString(ROOT.Char.IsFemale,'a','')], co se přihodilo mezi [target_character.GetTitledFirstName] a [character_of_rumor.GetTitledFirstName]?“ zašeptá [target_character2.GetFirstNameNoTooltip]. „Vždyť [character_of_rumor.GetFirstNameNoTooltip] je [courtier_host.Custom2('RelationToMeShort', SCOPE.sC('character_of_rumor'))] [courtier_host.GetTitledFirstName]. Mám důvod se domnívat, že [target_character.GetFirstNameNoTooltip] se dostal[Select_CString(target_character.IsFemale,'a','')] až do soukromých komnat [character_of_rumor.GetFirstNameNoTooltip], ale z podplaceného služebnictva už jsem nic dalšího [Select_CString(target_character2.IsFemale,'nevytáhla','nevytáhl')].“\n\nSlužebnictvo je samozřejmě #EMP pověstně#! spolehlivým zdrojem klepů, ale bez ohledu na pravdivost těchto tvrzení je to skvělá příležitost ovlivnit pověst [target_character.GetTitledFirstNameNoTooltip]."
 festival.107.a: "No, #EMP já#! jsem slyšel[Select_CString(ROOT.Char.IsFemale,'a','')], že [character_of_rumor.GetFirstNameNoTooltip] nechal[Select_CString(character_of_rumor.IsFemale,'a','')] [target_character.GetTitledFirstNameNoTooltip] celou noc přede dveřmi!"
 festival.107.b: "Moc toho neviděli, ale rozhodně toho #EMP spoustu slyšeli#!!"
 festival.107.c: "Jestli obdivujete milostné úspěchy, mí společníci mají mnohem víc co nabídnout."
 festival_embarrassed_me: "Ztrapnění"
 festival_reinforced_group_cohesion: "Posílená pouta"
 festival_enhanced_amorous_reputation: "Vylepšená milostná pověst"
 festival.108.t: "Čtení mezi záhyby"
 festival.108.desc: "Vidím, jak ke mně přichází [target_character2.GetTitledFirstName] se škodolibým zábleskem v očích. „Našel[Select_CString(target_character2.IsFemale,'a','')] jsem to ležet ve stínu pavilonu,“ začne. „Zcela jasně si pamatuji, že to ještě před pár hodinami držel[Select_CString(target_character.IsFemale,'a','')] [target_character.GetTitledFirstName]. A je na tom napsaná zpráva, která je přinejmenším... #EMP lechtivá#!.“\n\n„#EMP Mohli bychom#! to vrátit [target_character.GetTitledFirstNameNoTooltip]... #EMP nebo#! bych mohl[Select_CString(target_character2.IsFemale,'a','')] zařídit, aby to bylo nápadně ‚doručeno‘ někomu jinému jménem [target_character.GetTitledFirstNameNoTooltip]. Třeba [target_character4.GetTitledFirstName]? Vždyť [target_character4.GetFirstNameNoTooltip] je [target_character3.Custom2('RelationToMeShort', SCOPE.sC('target_character4'))] [target_character3.GetTitledFirstName], [target_character3.Custom('MistressMaster')] [target_character.GetTitledFirstNameNoTooltip].“"
 festival.108.a: "Výborný nápad! Udělejme to."
 festival.108.b: "Dej mi to. Vrátím to #EMP osobně#!."
 festival.108.c: "Prozatím to nechme jen mezi námi dvěma."
 festival.109.t: "Poezie pod nátlakem"
 festival.109.desc: "Vlna pobaveného smíchu mě přitáhne k hloučku shromážděnému kolem dvojice z naší společnosti. „Přednes nám nějakou báseň, [target_character2.GetTitledFirstName]!“ pobízí [target_character.GetTitledFirstName] hlasem překypujícím sotva skrývaným posměchem. „Aspoň #EMP jednu#! snad zvládneš?“\n\n[target_character2.GetFirstNameNoTooltip], [Select_CString(target_character2.IsFemale,'proslulá','proslulý')] básnickým cítěním kamene, na mě pohlédne prosebnýma očima zahnaného zvířete."
 festival.109.a: "Budeme se střídat ve verších. Začnu já a #EMP ty#! navážeš, [target_character.GetFirstNameNoTooltip]."
 festival.109.b: "Ohrom nás svým důvtipem, [target_character2.GetFirstNameNoTooltip]."
 festival.109.c: "Jestli hledáte skutečné umění, najdete ho mezi #EMP námi#!."
