 festival.101.t: "Provoněné rukávy"
 festival.101.desc: "Dávno předtím, než člověk spatří [target_character.GetTitledFirstName], jej rozhodně #EMP ucítí#!. Je sice zvykem napouštět roucha vůní aromatického kadidla, ale málokdy se očekává, že bude její účinek znát na sto kroků od nositele.\n\nMožná by se hodilo diskrétní upozornění. Anebo stačí pošeptat pár slov do správného ucha a tahle výstřednost se bude připomínat ještě dlouho poté, co vůně vyprchá."
 festival.101.a: "Pošlete někoho taktního... a pokud možno se špatným čichem."
 festival.101.b: "O tomhle se #EMP musí#! dozvědět všichni."
