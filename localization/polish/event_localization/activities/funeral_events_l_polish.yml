l_polish:
 activity_funeral: "Pohřeb"
 activity_funeral_desc: "Shromáždi truchlící panství k $activity_funeral$ a dopřej váženému příslušníkovi šlechty důstojné poslední rozloučení."
 activity_funeral_province_desc: "Pořádáš pohřeb v [ROOT.Province.GetName]\nProvincie s vysokým hodnocením poskytují více [piety_i][Concept('piety','zbožnosti')|E], [stress_loss_i][Concept('stress_loss','úbytku stresu')|E] a [Concept('legitimacy','legitimity')|E]\n"
 activity_funeral_guest_help_text: "Všichni pozvaní [Concept('activity_guests','hosté aktivity')|E] budou mít příležitost zlepšit své [Concept('opinion','mínění')|E] o tobě.\nPohřeb je také příležitostí ulevit svým emocím, zbavit se části [Concept('stress','stresu')|E] a získat [Concept('piety','zbožnost')|E]."
 activity_funeral_selection_tooltip: "Uspořádej pohřeb a ulož zesnulého příbuzného k poslednímu odpočinku\n\nOčekávané odměny:\n$BULLET_WITH_TAB$[opinion_i] [Concept('opinion','Mínění')|E]\n$BULLET_WITH_TAB$[legitimacy_i] Zisk [Concept('legitimacy','legitimity')|E]\n$BULLET_WITH_TAB$[stress_loss_i] [Concept('stress_loss','Úbytek stresu')|E]\n$BULLET_WITH_TAB$[piety_i] Zisk [Concept('piety','zbožnosti')|E]"
 activity_funeral_destination_selection: "Tělo musí být pohřbeno někde v tvém vlastním panství. Svatá místa a náboženské budovy zvýší kvalitu obřadu."
 activity_funeral_major_religious_building: "#P +++ Významná náboženská budova#!\n"
 activity_funeral_tos: "#P ++ $building_type_tower_of_silence_01$#!\n"
 activity_funeral_wavel: "#P ++ $building_type_wawel_cathedral_01$#!\n"
 activity_funeral_holy_site: "#P ++ Svaté místo#!\n"
 activity_funeral_mountain: "#P ++ Hornatý terén#!\n"
 activity_funeral_temple: "#P ++ Chrám#!\n"
 activity_window_character_body: "$body_to_bury_for_host$"
 deceased_selection_widget_header: "Vyber tělo k pohřbení"
 has_someone_to_bury_tt: "Musíš nedávno přijít o někoho blízkého"
 has_someone_selected_to_bury: "Nevybral jsi tělo k pohřbení"
 body_to_bury_for_host: "Tělo k pohřbení"
 body_to_bury_desc_for_host: "Tělo, které bude odevzdáno na onen svět"
 body_to_bury_desc_for_host_required_tt: "#T Vyžadovaný zvláštní host\n#!@warning_icon! #X Tato aktivita vyžaduje $body_to_bury_for_host|l$#!"
 body_to_bury_selection_info: "Vyber nedávno zesnulou osobu, která bude odevzdána na onen svět"
 activity_funeral_host_desc: "$BULLET_WITH_TAB$[opinion_i] [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$[stress_loss_i] [Concept('stress_loss','úbytek stresu')|E]\n$BULLET_WITH_TAB$[piety_i] Zisk [Concept('piety','zbožnosti')|E]\n$BULLET_WITH_TAB$[legitimacy_i] Zisk [Concept('legitimacy','legitimity')|E]"
 activity_funeral_guest_desc: "$BULLET_WITH_TAB$ Účastníci si mohou zlepšit [Concept('opinion','mínění')|E] přítomných postav\n$BULLET_WITH_TAB$ Účastníci mohou přijít o část [stress_loss_i][Concept('stress','stresu')|E]"
 activity_funeral_conclusion_desc: "[GetActivityType('activity_funeral').GetName] je u konce"
 funeral_phase_wake: "[GetPlayer.Custom('WakeName')]"
 funeral_phase_wake_desc: "[GetPlayer.Custom('WakeDesc')]"
 funeral_phase_ceremony: "[GetPlayer.Custom('CeremonyName')]"
 funeral_phase_ceremony_desc: "[GetPlayer.Custom('CeremonyDesc')]"
 funeral_option_ceremony: "Obřad"
 funeral_ceremony_bad: "Skromný obřad"
 funeral_ceremony_bad_desc: "$EFFECT_LIST_BULLET$ Menší zisk [Concept('piety','zbožnosti')|E]\n$EFFECT_LIST_BULLET$ Menší zisk [Concept('legitimacy','legitimity')|E]\n$EFFECT_LIST_BULLET$ Menší úbytek [Concept('stress','stresu')|E]\n\n#weak Smrt není chvílí pro okázalost a pompéznost. Je čas se sejít a skromně vzdát zesnulému poslední poctu.#!"
 funeral_ceremony_normal: "Důstojný obřad"
 funeral_ceremony_normal_desc: "$EFFECT_LIST_BULLET$ Zisk [Concept('piety','zbožnosti')|E]\n$EFFECT_LIST_BULLET$ Zisk [Concept('legitimacy','legitimity')|E]\n$EFFECT_LIST_BULLET$ Úbytek [Concept('stress','stresu')|E]\n\n#weak Do těchto síní zavítala smrt a nastal čas uspořádat zesnulému důstojný a velkolepý obřad.#!"
 funeral_ceremony_good: "Okázalý obřad"
 funeral_ceremony_good_desc: "$EFFECT_LIST_BULLET$ Výrazný zisk [Concept('piety','zbožnosti')|E]\n$EFFECT_LIST_BULLET$ Výrazný zisk [Concept('legitimacy','legitimity')|E]\n$EFFECT_LIST_BULLET$ Výrazný úbytek [Concept('stress','stresu')|E]\n\n#weak Smrt si vzala významnou osobnost panství. Nezaslouží si snad vše, co jí můžeme dopřát? Na pohřebním obřadu se nebude šetřit a všichni se dozvědí o velké tragédii, která panství postihla.#!"
 mourn_intent: "Truchlit"
 mourn_intent_desc: "Nastal čas truchlit za mrtvé a projevit svou [Concept('piety','zbožnost')|E]."
 wakename_offering_of_libations: "Přinášení úliteb"
 wakedesc_offering_of_libations: "Nastal čas přinést mrtvému obětiny v podobě jídla a vody. Tělo bude omyto a nabalzamováno, aby se s ním v nadcházejících dnech mohli pozůstalí rozloučit."
 wakename_sky_burial: "Uctění mrtvého"
 wakedesc_sky_burial: "Teď není čas na výbuchy emocí, ale na tichý a zdrženlivý smutek. Hosté mohou nabídnout útěchu pozůstalé rodině."
 wakename_mummification: "Mumifikace"
 wakedesc_mummification: "Truchlící se v očekávání shromažďují kolem těla, které je balzamováno a mumifikováno, aby zůstalo zachováno navěky."
 wakename_wake: "Bdění"
 wakedesc_wake: "Nastal čas bdít u těla zesnulého. Je to poslední příležitost svěřit mrtvému své myšlenky a pocity, než bude odevzdán na onen svět."
 wakename_bathing: "Omytí těla"
 wakedesc_bathing: "Truchlící se shromažďují, aby omyli tělo zesnulého a celé je zahalili do plátna."
 ceremonyname_public_bewailment: "Veřejné oplakávání"
 ceremonydesc_public_bewailment: "Při veřejném oplakávání mohou emoce naplno propuknout. Kolem těla zesnulého se ozývá pláč, nářek a bědování, než je tělo svěřeno zemi."
 ceremonyname_sky_burial: "Nebeský pohřeb"
 ceremonydesc_sky_burial: "Tělo bude odevzdáno na onen svět v útrobách ptáků, aby zesnulý po smrti živil svět tak, jako svět kdysi živil jeho."
 ceremonyname_ground_burial: "Pohřbení"
 ceremonydesc_ground_burial: "Tělo je svěřeno zemi a truchlící se společně modlí. Ačkoli věčná duše žije dál, tělo je uloženo k poslednímu odpočinku."
 ceremonyname_cremation: "Kremace"
 ceremonydesc_cremation: "Tělo je spáleno na velké pohřební hranici."
 ceremonyname_mummification: "Uložení do hrobky"
 ceremonydesc_mummification: "Mumifikované tělo je uloženo do hrobky, kde může spočinout."
 ceremonyname_ceremony: "Obřad"
 ceremonydesc_ceremony: "Tělo bude odevzdáno na onen svět během tradičního a [Concept('pious','zbožného')|E] obřadu."
 activity_funeral_predicted_cost: "Náklady na pohřeb ovlivňují zvolené [Concept('activity_options','možnosti aktivity')|E] a [Concept('doctrine','doktrína')|E] pohřebních zvyklostí tvé [Concept('faith','víry')|E]."
 funeral_cost_increase_great_temple: "Nachází se zde Velký chrám"
 funeral_cost_increase_mummification: "Mumifikace"
 funeral_cost_discount_cremation: "Kremace"
 funeral_activity_cost_desc: "Základní náklady"
 building_funeral_effect_desc: "$unlocks_building_desc$Zvyšuje zisk [Concept('legitimacy','legitimity')|E] a [Concept('piety','zbožnosti')|E] z [GetActivityType('activity_funeral').GetTextIcon][GetActivityType('activity_funeral').GetName] [Concept('activities','aktivit')|E] pořádaných v této [Concept('holding','državě')|E]"
 building_funeral_wavel_effect_desc: "$unlocks_building_desc$Výrazně zvyšuje zisk [Concept('legitimacy','legitimity')|E] a [Concept('piety','zbožnosti')|E] z [GetActivityType('activity_funeral').GetTextIcon][GetActivityType('activity_funeral').GetName] [Concept('activities','aktivit')|E] pořádaných v této [Concept('holding','državě')|E]"
 funeral.0001.t: "Smrt na pohřbu"
 funeral.0001.desc: "Dnešek nám přinesl další důvod ke smutku. [Select_CString(host.IsFemale,'Naše hostitelka','Náš hostitel')] [host.GetName] [Select_CString(host.IsFemale,'vystoupala','vystoupal')] do [host.GetFaith.PositiveAfterLife].\n\nSoučasný obřad tím sice předčasně končí, zároveň to však znamená, že další pohřeb se možná uskuteční mnohem dříve, než kdokoli čekal."
 funeral.0001.a: "Jaké neštěstí."
 funeral.0001.a.tt: "[host.GetName] [Select_CString(host.IsFemale,'zemřela','zemřel')]."
 funeral.0002.t: "Smrt na pohřbu"
 funeral.0002.desc: "Dnešek nám přinesl další důvod ke smutku. [Select_CString(host.IsFemale,'Naše hostitelka','Náš hostitel')] [host.GetName] [Select_CString(host.IsFemale,'vystoupala','vystoupal')] do [host.GetFaith.PositiveAfterLife]. Jako [Select_CString(ROOT.Char.IsFemale,'dědička','dědic')] nyní přebírám i povinnosti spojené s pořádáním pohřbu.\n\nNáš skromný obřad tím sice nekončí, znamená to však, že další pohřeb se možná uskuteční mnohem dříve, než jsme čekali."
 funeral.0002.a: "Udělám, co musím."
 funeral.0002.a.tt: "Povinnosti pořadatele pohřbu přešly na tebe."
 funeral.0010.t: "Příjezd"
 funeral.0010.desc_intro: "[ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] se má stát místem, kde [deceased.GetFirstName] spočine naposledy, a po příjezdu"
 funeral.0010.self: " zůstávám o samotě, abych si [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] uspořádat myšlenky a připravit se na příchod vážených truchlících."
 funeral.0010.dislikes_host: " mě vítá [host.GetName], [host.Custom2('InsultAdjective', ROOT.Char)] [host.Custom2('InsultNoun', ROOT.Char)]. [Select_CString(host.IsFemale,'Její','Jeho')] společnost je mi protivná, ale kvůli [Select_CString(host.IsFemale,'ní','němu')] tu nejsem. Přivedla mě sem vzpomínka na [Select_CString(deceased.IsFemale,'zesnulou','zesnulého')] a mám příležitost"
 funeral.0010.likes_host: " mě vítá [host.GetName], [Select_CString(host.IsFemale,'velkorysá jako vždy','velkorysý jako vždy')]. [Select_CString(host.IsFemale,'Její','Jeho')] příjemná společnost mě těší, ale především jsem tu kvůli [Select_CString(deceased.IsFemale,'zesnulé','zesnulému')]. Je to má poslední příležitost"
 funeral.0010.neutral: " mě vítá [host.GetName]. Na [Select_CString(host.IsFemale,'její','jeho')] společnosti mi však dnes příliš nezáleží. Tento den patří [Select_CString(deceased.IsFemale,'zesnulé','zesnulému')] a já mám příležitost"
 funeral.0010.disrespect: " naposledy se zasmát [Select_CString(deceased.IsFemale,'té opovrženíhodné ničemnici','tomu opovrženíhodnému ničemovi')]."
 funeral.0010.respect: " naposledy se [Select_CString(deceased.IsFemale,'s ní','s ním')] rozloučit.\n\n"
 funeral.0010.intent_arrived: "\n\nMezi truchlícími zahlédnu [ROOT.Char.GetIntentTarget.GetTitledFirstName]. Vůbec netuší, že mám v plánu [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'ji','ho')]."
 funeral.0010.intent: "\n\n[ROOT.Char.GetIntentTarget.GetTitledFirstName] tu zatím nikde není. Netrpělivě očekávám [Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'její příjezd','jeho příjezd')], aby můj plán [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'ji','ho')] mohl konečně začít."
 funeral.0010.a.bad: "Podle mě je to důvod k oslavě."
 funeral.0010.a.good: "[Select_CString(deceased.IsFemale,'Nikdy na ni nezapomenu.','Nikdy na něj nezapomenu.')]"
 funeral.0100.t: "Prach jsi a v prach se obrátíš"
 funeral.0100.desc.intro: "Nastal čas, aby [deceased.GetFirstName] [Select_CString(deceased.IsFemale,'podstoupila','podstoupil')] poslední obřady před závěrečnou cestou na onen svět.\n\n"
 funeral.0100.desc.intro2.burial: "[deceased.GetFirstNamePossessive|U] zahalené tělo spočívá nad otevřeným hrobem, obklopené nejbližšími přáteli a rodinou. U hlavy stojí [host.GetNameOrMe] na čestném místě, které při posledním rozloučení náleží jen [Select_CString(host.IsFemale,'velkorysé hostitelce','velkorysému hostiteli')]."
 funeral.0100.desc.intro2.sky_burial: "[deceased.GetFirstNamePossessive|U] tělo vynesl průvod truchlících na nejvyšší místo v [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly]. Těsně pod vrcholem se průvod zastaví a [host.GetNameOrMe] [Select_CString(host.IsFemale,'zůstává sama','zůstává sám')] s tělem, aby [Select_CString(host.IsFemale,'dokončila','dokončil')] poslední úsek cesty."
 funeral.0100.desc.intro2.mummification: "[deceased.GetFirstNamePossessive|U] dokonale zachované tělo leží vystavené před zraky všech. Balzamovači odvedli tak úžasnou práci, že [deceased.GetFirstName] vypadá, jako by [Select_CString(deceased.IsFemale,'mohla','mohl')] každou chvíli vstát a znovu se projít. Než bude tělo jednou provždy uloženo do hrobky, zůstane s ním [host.GetNameOrMe] na krátký okamžik o samotě."
 funeral.0100.desc.intro2.cremation: "[deceased.GetFirstName] leží [Select_CString(deceased.IsFemale,'zahalena','zahalen')] v jemných látkách na vrcholu vysoké pohřební hranice. Vedle [host.GetNameOrMe] stojí [host.GetFaith.PriestNeuter] s pochodní, jejíž plamen se chvěje ve větru."
 funeral.0100.desc.mid.hate: "\n\nTváří v tvář bezvládnému tělu se pro sebe tiše uchechtnu. Budu to já, kdo jednou provždy uloží [Select_CString(deceased.IsFemale,'její bídné ostatky','jeho bídné ostatky')]."
 funeral.0100.desc.mid.love: "\n\nSotva se dokážu na [Select_CString(deceased.IsFemale,'ni','něj')] podívat a ani teď nemohu uvěřit, že toto je skutečně naše poslední společná chvíle."
 funeral.0100.desc.mid.spouse: "\n\nNaposledy hledím na [Select_CString(deceased.IsFemale,'svou zesnulou manželku','svého zesnulého manžela')] a nedokážu přestat myslet na všechen čas, o který jsme přišli. Na všechna vnoučata, která jsme nikdy nevychovali, i na všechny romantické noci, které jsme spolu nikdy neprožili."
 funeral.0100.desc.mid.child: "\n\nHledím na bezvládné tělo [Select_CString(deceased.IsFemale,'své dcery','svého syna')] a svírá mě žal. [Select_CString(ROOT.Char.IsFemale,'Žádná matka by se neměla dožít','Žádný otec by se neměl dožít')] tak krutého konce vlastního dítěte."
 funeral.0100.desc.mid.predecessor: "\n\nKdyž vidím tolik truchlících a vím, že [deceased.GetFirstName] dostane řádný [ROOT.Char.GetFaith.GetAdjective] pohřeb, dává mi to naději, že až jednou odejdu jako [ROOT.Char.GetTitleAsNameNoTooltip|U], budou na mě vzpomínat se stejnou láskou."
 funeral.0100.desc.mid.young: "\n\nJaká tragédie! [deceased.GetFirstName] [Select_CString(deceased.IsFemale,'byla ještě tak mladá','byl ještě tak mladý')], a přesto [Select_CString(deceased.IsFemale,'jí','mu')] byl život vzat přímo před mýma očima."
 funeral.0100.desc.mid.old: "\n\nÚtěchou mi je alespoň to, že [deceased.GetFirstName] [Select_CString(deceased.IsFemale,'prožila','prožil')] tak dlouhý a zářný život. Takového věku mnozí nedosáhnou a být na jeho konci obklopen tolika truchlícími je vše, v co může [Select_CString(ROOT.Char.IsFemale,'žena','muž')] doufat."
 funeral.0100.desc.mid.fallback: "\n\nPoslední obřad nad tělem [Select_CString(deceased.IsFemale,'zesnulé','zesnulého')] připadl mně a tíha této odpovědnosti mi těžce doléhá na mysl."
 funeral.0100.desc.outro.burial: "Nakonec je [Select_CString(deceased.IsFemale,'její tělo','jeho tělo')] spuštěno do země a modlitba pohřeb oficiálně uzavírá."
 funeral.0100.desc.outro.sky_burial: "Obřadní řezy usnadní mrchožravým ptákům přístup k masu a prozatím je obřad u konce. Zbývá jen za několik dní se vrátit pro kosti."
 funeral.0100.desc.outro.mummification: "Mumifikované ostatky zůstávají v mé péči spolu s několika nádobami s orgány. Obojí může spočinout v hrobce, ale můj dvůr poslouží jako hrobka stejně dobře jako kterákoli jiná."
 funeral.0100.desc.outro.cremation: "Skloním pochodeň k podpalům a sleduji, jak vysoká hranice vzplane. Teď už zbývá jen počkat, až se [deceased.GetFirstNameNoTooltip] obrátí v popel."
 funeral.0100.a: "Nádhera."
 funeral.0100.b: "Teď [deceased.GetFirstNameNoTooltip] žije navždy u dvora."
 funeral.0100.c: "Budu [Select_CString(deceased.IsFemale,'ji','ho')] mít vždy u sebe."
 funeral.0100.d: "Všechno patří do hrobky."
 funeral.0101.t: "$funeral.0100.t$"
 funeral.0101.desc.intro: "$funeral.0100.desc.intro$"
 funeral.0101.desc.intro2.burial: "$funeral.0100.desc.intro2.burial$"
 funeral.0101.desc.intro2.sky_burial: "$funeral.0100.desc.intro2.sky_burial$"
 funeral.0101.desc.intro2.mummification: "$funeral.0100.desc.intro2.mummification$"
 funeral.0101.desc.intro2.cremation: "$funeral.0100.desc.intro2.cremation$"
 funeral.0101.desc.outro.burial: "\n\nPo několika tradičních modlitbách za [Select_CString(deceased.IsFemale,'zesnulou','zesnulého')] je [Select_CString(deceased.IsFemale,'její','jeho')] tělo pomalu spuštěno do hrobu, kde [deceased.GetFirstName] může navěky spočinout v ráji."
 funeral.0101.desc.outro.sky_burial: "\n\nDo těla jsou provedeny tradiční obřadní řezy a nad hlavami už krouží hladoví ptáci připravení pustit se do masa. Teď už je jen třeba nechat je dokončit jejich dílo. [host.GetFaith.PriestNeuterPlural] se za několik dní vrátí pro kosti."
 funeral.0101.desc.outro.mummification: "\n\n[host.GetName] nyní odnáší ostatky spolu s nádobami obsahujícími orgány [Select_CString(deceased.IsFemale,'zesnulé','zesnulého')], aby byly uchovány navěky."
 funeral.0101.desc.outro.cremation: "Pochodeň klesá k podpalům a já sleduji, jak vysoká hranice vzplane. Teď už zbývá jen počkat, až se [deceased.GetFirstNameNoTooltip] obrátí v popel."
 funeral.0101.a: "$funeral.0100.a$"
 funeral.1000.t: "[Select_CString(deceased.IsFemale,'Vzpomínám na ni','Vzpomínám na něj')]"
 funeral.1000.desc: "V tichém koutě [host.GetFaith.HouseOfWorship] zaslechnu [random_attendee.GetName], jak si povídá se skupinkou truchlících. Se smutným výrazem mi [random_attendee.GetFirstNameNoTooltip] pokyne, abych se [Select_CString(ROOT.Char.IsFemale,'přidala','přidal')].\n\n„Všichni máme na [deceased.GetName] krásné vzpomínky. Zrovna jsem vyprávěl[Select_CString(random_attendee.IsFemale,'a','')], jak [attendee_memory.GetDescription]. Řekni, máš také nějakou vzpomínku, o kterou by ses [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] podělit?“"
 funeral.1000.a: "Ty vzpomínky příliš bolí."
 funeral.1000.b: "A-ano, [Select_CString(ROOT.Char.IsFemale,'znala jsem','znal jsem')] [Select_CString(deceased.IsFemale,'ji','ho')] dobře."
 funeral.1000.b.success: "Lež ti projde"
 funeral.1000.b.failure: "Nikdo ti nevěří"
 funeral.1000.c: "Přiznávám, že nemám co říct."
 funeral.1000.d: "Jak bych [Select_CString(deceased.IsFemale,'na ni','na něj')] mohl[Select_CString(ROOT.Char.IsFemale,'a','')] zapomenout?"
 funeral.1000.d.success: "Tvá vzpomínka dojímá k slzám"
 funeral.1000.d.failure: "Nedaří se ti vzpomínku dobře podat"
 funeral.1000.e: "Tohle přece není soutěž."
 funeral.1010.t: "Milodary do hrobu"
 funeral.1010.desc: "Vážení hosté jeden po druhém procházejí kolem zahaleného těla [deceased.GetName] a vzdávají [Select_CString(deceased.IsFemale,'zesnulé','zesnulému')] sotva víc než letmou úklonu či pokývnutí, jako by takové povrchní gesto mohlo být důstojnou poctou celému životu. Srdce mám stejně těžké jako kapsy, které jsou plné drobností a vzpomínek na [deceased.GetFirstNameNoTooltip].\n\nNemohu se ubránit otázce, proč bych si měl[Select_CString(ROOT.Char.IsFemale,'a','')] nechávat předměty, které právem patří [Select_CString(deceased.IsFemale,'jí','jemu')]."
 funeral.1010.a: "[common_grave_good.GetNameNoTooltip] mi nepatří."
 funeral.1010.b: "[masterwork_grave_good.GetNameNoTooltip] patří do [ROOT.Char.GetFaith.PositiveAfterLife]."
 funeral.1010.c: "[famed_grave_good.GetNameNoTooltip] bude uložen[Select_CString(ROOT.Char.IsFemale,'','')]."
 funeral.1010.d: "Nic horšího než [illustrious_grave_good.GetNameNoTooltip] není hodno tohoto místa."
 funeral.1010.e: "Ani pomyšlení."
 funeral.1020.t: "Falešný [Select_CString(host.IsFemale,'[host.GetTitleAsNameNoTooltip|U]','[host.GetTitleAsNameNoTooltip|U]')]"
 funeral.1020.desc: "Truchlící obklopují [host.GetName] a zahrnují údajného [Select_CString(host.IsFemale,'„[host.GetTitleAsNameNoTooltip|U]“','„[host.GetTitleAsNameNoTooltip|U]“')] zdvořilostmi a přáním všeho dobrého. Mně přitom stejnou úctu neprojeví ani jediný, navzdory mému zjevnému postavení.\n\nOpravdu by si [deceased.GetName] [Select_CString(deceased.IsFemale,'přála','přál')], aby se [host.GetFirstNameNoTooltip] [Select_CString(host.IsFemale,'stala její nástupkyní','stal jeho nástupcem')]?"
 funeral.1020.c: "[deceased.GetFirstNameNoTooltip] by [Select_CString(deceased.IsFemale,'chtěla','chtěl')], abych [host.GetName] [Select_CString(host.IsFemale,'podpořila','podpořil')]."
 funeral.1020.a: "Všichni se musí dozvědět o mém právoplatném nároku!"
 funeral.1020.b: "Teď na to není vhodná chvíle."
 funeral.1021.t: "$funeral.1020.t$"
 funeral.1021.desc: "V tichém zamyšlení hledím na [deceased.GetName] a jen občas mě vyruší někdo, kdo mi přijde vyjádřit soustrast.\n\n„[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('claimant'))|U]! Jak se opovažuješ nazývat [Select_CString(ROOT.Char.IsFemale,'sama sebe','sám sebe')] [ROOT.Char.GetTitleAsNameNoTooltip|U]?“ [claimant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ke mně [Select_CString(claimant.IsFemale,'vrhá','vrhá')] a zuřivě mi mává prstem jen pár centimetrů před obličejem. „[deceased.GetNameNoTooltip|U] [Select_CString(deceased.IsFemale,'chtěla','chtěl')], abych na [Select_CString(deceased.IsFemale,'jejím','jeho')] místě [Select_CString(claimant.IsFemale,'vládla já','vládl já')]! Ničemo!“"
 funeral.1021.a: "„Vypadni!“"
 funeral.1021.a.toast: "Byl[Select_CString(ROOT.Char.IsFemale,'a','')] jsi z pohřbu vykázán[Select_CString(ROOT.Char.IsFemale,'a','')]."
 funeral.1021.b: "„Je mi to jedno.“"
 funeral.1021.b.toast: "Tvůj výstup byl ignorován"
 funeral.1030.t: "I kdyby to trvalo věčnost"
 funeral.1030.desc: "Sleduji, jak jeden host za druhým přichází a zase odchází, aby si odbyl svou pochmurnou povinnost. Jeden návštěvník však zůstává nehybně ležet vedle zesnulého [deceased.GetFirstName].\n\nCelé hodiny se ani nehne, jako by tam chtěl zůstat navěky. Věrný pes [deceased.GetFirstName] kňučí a naříká nad [Select_CString(deceased.IsFemale,'ženou','mužem')], [Select_CString(deceased.IsFemale,'kterou','kterého')] [ROOT.Char.GetFaith.HighGodName] určil za jeho [Select_CString(deceased.IsFemale,'paní','pána')]. Jen leží a čeká. Pokud nezasáhnu, možná bude chtít následovat tělo až na onen svět."
 funeral.1030.a: "„Tak pojď, budeme truchlit spolu.“"
 funeral_1030_adopt_tt: "Adoptuješ psa [deceased.GetFirstNamePossessiveNoTooltip]."
 funeral.1030.b: "[Select_CString(deceased.IsFemale,'„Pryč od své nehybné paní!“','„Pryč od svého nehybného pána!“')]"
 funeral.1030.c: "Oplač svůj čenich, brzy pozná mou botu!"
 funeral.1040.t: "Neporušené tělo"
 funeral.1040.desc: "Tělo [deceased.GetName] je už několik dní bez života, a přesto v očích stále zůstává cosi živého, téměř božský pohled. Moc [ROOT.Char.GetFaith.HighGodNamePossessive|U] chrání tělo před hnilobou a rozkladem, jako by [deceased.GetFirstName] [Select_CString(deceased.IsFemale,'setrvávala','setrvával')] ve snu na pomezí života a smrti.\n\nVzrušený dav prohlašuje tělo za neporušené a [deceased.GetFirstName] za [Select_CString(deceased.IsFemale,'vyvolenou, která má být povznesena mezi','vyvoleného, který má být povznesen mezi')] [GetTrait('saint').GetName(deceased)]."
 funeral.1040.a: "Přímo před mýma očima se stal zázrak."
 funeral.1040.b: "Musím se postavit na stranu [ROOT.Char.GetFaith.DevilNamePossessive]."
 funeral.1040.b.success: "Tvá obhajoba je úspěšná"
 funeral.1040.b.failure: "Tvou obhajobu nikdo neposlouchá"
 funeral.1040.c: "Mě nepochybně čeká totéž."
 funeral.1050.t: "Naše společná chvíle"
 funeral.1050.desc: "Ze všech uctívaných i zatracovaných osobností nepřitahoval nikdo tolik pozornosti jako zesnulý [deceased.GetName]. Když si dav plačících a zvědavců konečně najde jiné rozptýlení, zůstáváme na chvíli sami, já a [deceased.GetFirstName]."
 funeral.1050.witch: "Vezmu si trochu vlasů."
 funeral.1050.a: "Čas na tichou modlitbu."
 funeral.1050.b: "Dopřeji si chvíli zármutku."
 funeral.1050.c: "Nechám všechen žal propuknout."
 funeral.1050.d: "[Select_CString(ROOT.Char.IsFemale,'Slibuji, že budu lepší','Slibuji, že budu lepší')] [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 funeral.1060.t: "Hvězda smutku"
 funeral.1060.desc: "Všechny oči se obracejí k [other_mourner.GetName], když se [Select_CString(other_mourner.IsFemale,'zhroutí','zhroutí')] k zemi v návalu žalu a rukama si zakrývá zarudlé oči. [other_mourner.GetNamePossessiveNoTooltip|U] žalostné vzlyky a lapání po dechu dojímají ostatní truchlící a mnozí [Select_CString(other_mourner.IsFemale,'jí','mu')] nabízejí útěchu a projevují úctu, jako by to [Select_CString(other_mourner.IsFemale,'právě ona měla být odevzdána','právě on měl být odevzdán')] na onen svět."
 funeral.1060.a: "Všechny oči se musí upírat jen na mě."
 funeral.1060.a.success: "Všechny oči se obracejí k tobě"
 funeral.1060.a.failure: "Uděláš ze sebe hlupáka"
 funeral.1060.b: "Já dokážu truchlit jen po svém."
 funeral.1060.c: "Pokusím se nabídnout útěchu."
 funeral.1070.t: "Co je smrt?"
 funeral.1070.desc: "Smrt. Všude kolem mě se mluví o smrti, [ROOT.Char.GetFaith.PositiveAfterLife] a [ROOT.Char.GetFaith.NegativeAfterLife]. Hlavou se mi honí [deceased.GetFirstNamePossessive] tvář a myšlenka, že ji už nikdy neuvidím, a přesto mi smrt a její význam unikají jako písek mezi roztaženými prsty.\n\nTento osud, ať už krutý, nebo milosrdný, vhání slzy do očí i těm nejotrlejším dospělým. Někteří pláčou tiše, jiní hlasitě naříkají. Co tedy smrt vlastně je? Možná mi [other_mourner.GetName] dokáže dát jednoduchou odpověď."
 funeral.1070.a: "Proč jsou všichni tak smutní?"
 funeral.1070.b: "[Select_CString(ROOT.Char.IsFemale,'Měla bych','Měl bych')] prostě dělat to co ostatní..."
 funeral.1071.t: "Smrtelné mládí"
 funeral.1071.desc: "Když se rozhlížím po místnosti plné truchlících, zmocňuje se mě zvláštní klid. Někteří mají oči zarudlé od pláče, jiní se tváří, jako by šlo o docela obyčejné setkání. Jen jedna nejistá dětská tvář ke mně vzhlíží a [confused_child.GetFirstNameNoTooltip] mě zatahá za rukáv.\n\n[confused_child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] otevřeně nepláče, ale ani nepůsobí tak lhostejně jako mnoho ostatních přítomných dětí. „[ROOT.Char.GetNameNoTooltip], co se stalo [deceased.GetFirstName]? Proč jsou všichni smutní?“"
 funeral.1071.a: "„Neboj se, dítě.“"
 funeral.1071.a.tt: "[other_mourner.GetFirstName] ti nabízí útěchu."
 funeral.1071.b: "„[deceased.GetFirstName|U] je teď v [ROOT.Char.GetFaith.PositiveAfterLife].“"
 funeral.1071.b.reincarnation: "„[deceased.GetFirstName|U] pokračuje na své cestě reinkarnací.“"
 funeral.1071.b.taoism: "„[deceased.GetFirstName|U] se [Select_CString(deceased.IsFemale,'vrátila','vrátil')] do vesmíru.“"
 funeral.1071.a.success: "Dítě nachází útěchu"
 funeral.1071.a.success.child: "Myšlenky na onen svět ti přinášejí útěchu"
 funeral.1071.a.failure: "Dítě je traumatizováno"
 funeral.1071.a.failure.child: "Uvědomíš si vlastní smrtelnost"
 funeral.1080.t: "Neutišitelný žal"
 funeral.1080.desc: "[Select_CString(other_mourner.IsFemale,'Shrbená','Shrbený')] vedle mě, bez jakékoli snahy zachovat dekorum, [Select_CString(other_mourner.IsFemale,'neutišitelná','neutišitelný')] [other_mourner.GetFirstName] hledí do prázdna před sebou. Z [Select_CString(other_mourner.IsFemale,'jejích','jeho')] očí neukápne jediná slza, ze rtů nevyjde jediné slovo, dokud se ke mně konečně neotočí.\n\n„[other_mourner.GetFaith.HighGodName|U] dokáže být opravdu krutý. Proč vítr stále vane? Proč se moře dál valí ke břehu? Proč mé tělo touží po jídle a žízní po vodě? [other_mourner.Custom('apocalypse_name')|U] je tady. [deceased.GetFirstName] [Select_CString(deceased.IsFemale,'je mrtvá','je mrtvý')].“"
 funeral.1080.a: "„Cítím to úplně stejně.“"
 funeral.1080.b: "„Pamatuj, nesmíme dovolit, aby nás žal zcela pohltil.“"
 funeral.1080.c: "„Dokud je život, je i naděje.“"
 funeral.1080.c.success: "[other_mourner.GetFirstName] je [Select_CString(other_mourner.IsFemale,'utěšena','utěšen')]"
 funeral.1080.c.failure: "[other_mourner.GetFirstName] je [Select_CString(other_mourner.IsFemale,'uražena','uražen')]"
 funeral.1080.d: "Tiše přikývnu."
 funeral.1090.t: "Poslední příležitost"
 funeral.1090.desc: "Smutný zástup pomalu postupuje kupředu. Každý čeká na svou poslední chvíli s [deceased.GetName]. Poslední zašeptaná slova, poslední dlouhé sbohem, poslední ticho na místě, kde [Select_CString(deceased.IsFemale,'ji','ho')] kdokoli spatří naposledy. Je skutečně výsadou tu být.\n\nŘada přede mnou se pomalu krátí, až nakonec poslední postava ustoupí stranou a mezi mnou a [Select_CString(deceased.IsFemale,'zesnulou','zesnulým')] zůstává už jen závoj."
 funeral.1090.a: "Ať všichni slyší můj žal."
 funeral.1090.b: "Tiše se ukloním a odejdu."
 funeral.1090.c: "„Nakonec jsem zvítězil[Select_CString(ROOT.Char.IsFemale,'a','')].“"
 funeral.1090.d: "Pronesu řeč a slíbím, že budu pokračovat v [Select_CString(deceased.IsFemale,'jejím','jeho')] odkazu."
 funeral.1090.d.success: "Dav je dojat"
 funeral.1090.d.failure: "Uděláš ze sebe hlupáka"
 funeral.1090.e: "Promluvím o [Select_CString(deceased.IsFemale,'jejích','jeho')] ctnostech."
 funeral.1100.t: "[Select_CString(deceased.IsFemale,'Jedna z největších','Jeden z největších')]"
 funeral.1100.desc: "Přede mnou stojí hodovní stůl obtěžkaný všemožným jídlem a pitím, jako by nám [deceased.GetName] chtěl[Select_CString(deceased.IsFemale,'a','')] před odchodem dopřát ještě poslední projev štědrosti.\n\n[other_mourner.GetName|U] se však hostiny zatím ani nedotkl[Select_CString(other_mourner.IsFemale,'a','')]. Jen bezmyšlenkovitě krouží pohárem a utápí se ve vlastním zármutku. Nakonec na mě [Select_CString(other_mourner.IsFemale,'unaveně pohlédne','unaveně pohlédne')], tiše přikývne a pozvedne pohár.\n\n„Na [deceased.GetNameNoTooltip], [Select_CString(deceased.IsFemale,'skutečně jednu z největších','skutečně jednoho z největších')].“"
 funeral.1100.a: "„[Select_CString(deceased.IsFemale,'Velká bezpochyby','Velký bezpochyby')], ale já budu ještě větší.“"
 funeral.1100.a.success: "Dav je dojat"
 funeral.1100.a.failure: "Tvá poznámka všechny hluboce urazí"
 funeral.1100.b: "„Na [deceased.GetNameNoTooltip]!“"
 funeral.1100.c: "„Řekni nám, co pro tebe [deceased.GetFirstNameNoTooltip] skutečně [Select_CString(deceased.IsFemale,'znamenala','znamenal')].“"
 funeral.1100.d: "Tiše se pomodlím."
 funeral.1110.t: "Čas truchlit"
 funeral.1110.desc: "Stíny truchlících nade mnou konečně přestaly viset a já mám chvíli jen pro sebe. Jaká tichá útěcha se skrývá v okamžiku, kdy mi v uších nezní nekonečné tlachání ostatních hostů. Jen já a mé vzpomínky na [deceased.GetName]."
 funeral.1110.a: "Je to... příjemné."
 funeral.1120.t: "Obětování úliteb"
 funeral.1120.desc: "Spolu s ostatními truchlícími si na chvíli odpočineme od zármutku a usedneme k bohatě prostřenému stolu. [other_mourner.GetName|U], [Select_CString(other_mourner.IsFemale,'která bývá duší každé hostiny','který bývá duší každé hostiny')], teď sedí naproti mně se slzami v očích a nedotčeným pohárem po boku.\n\n„Jak se můžeme cpát a veselit v takové chvíli? Máme si snad užívat, zatímco [deceased.GetFirstName] nemá nic? Přidejte se ke mně! Vylijte své poháry jako úlitbu!“\n\nZdá se, že hosté souhlasí. I v [other_mourner.GetFirstNamePossessiveNoTooltip] neotesaném nářku je jistá moudrost."
 funeral.1120.aniconist: "„Ty modlářský troubo!“"
 funeral.1120.a: "Připojím se k obětování."
 funeral.1120.b: "Kolo pití pro všechny!"
 funeral.1120.c: "Na [Select_CString(deceased.IsFemale,'ni','něj')] budu vzpomínat po svém."
 funeral.1130.t: "Chvíle k truchlení"
 funeral.1130.desc.intro: "Truchlící procházejí síní s pláčem v jakémsi hrůzném tanci, to vše pro [deceased.GetName]."
 funeral.1130.desc.bewailment: "Síň je prosycena nářkem truchlících, kakofonií čirého neštěstí. Sedím uprostřed toho všeho, v uších mi zvoní a duše mě bolí."
 funeral.1130.desc.stoic: "Znepokojivé ticho lidí, kteří v sobě dusí to, co zoufale touží vypustit ven. Němé výkřiky, jež nikdy neopustí jejich rty, urputné boje se slzami, které jeden po druhém prohrávají, a přesto se za vlastní žal stydí."
 funeral.1130.desc.outro: "\n\nVstanu a nechám se spolu s ostatními truchlícími pohltit tímto tancem."
 funeral.1130.a: "Chci, aby celý svět pocítil můj žal."
 funeral.1130.b: "Musím zůstat silný[Select_CString(ROOT.Char.IsFemale,'á','')]."
 funeral.1140.t: "Spolu, nebo vůbec"
 funeral.1140.desc: "Na chvíli unikám zármutku i všem těm duším, které přišly vzdát poctu [deceased.GetName]. Za hranicí pochmurného šumu zaslechnu chodbami znít téměř nelidský nářek.\n\nJeho zdroj najdu v potemnělé místnosti. [soulmate.GetName] tu sedí [Select_CString(soulmate.IsFemale,'sama','sám')] a pláč pomalu utichá, když ke mně [Select_CString(soulmate.IsFemale,'vzhlédne prázdným pohledem','vzhlédne prázdným pohledem')]. V ruce svírá jakousi děsivou neoznačenou lahvičku.\n\n„Už nebude dlouho trvat a nadejde den naší svatby.“"
 funeral.1140.a: "„Opravdu by si tohle [deceased.GetFirstName] [Select_CString(deceased.IsFemale,'přála','přál')]?“"
 funeral.1140.a.success: "Podařilo se ti zachránit [soulmate.GetName]"
 funeral.1140.a.failure: "Nepodařilo se ti zachránit [soulmate.GetName]"
 funeral.1140.b: "Rozbiju lahvičku."
 funeral.1140.c: "Tiše zavřu dveře."
 funeral_conclusion_log_title: "Pohřební obřad"
 funeral_conclusion_log: "Zesnulý byl odevzdán na onen svět a pohřeb skončil."
 mourner_gives_advice_tt: "[other_mourner.GetName] ti dá několik rad..."
 friend_bonded_over_grief: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] se sblížili nad společnou ztrátou milované osoby"
 friend_comforted_at_funeral: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'utěšila','utěšil')] [TARGET_CHARACTER.GetShortUIName] na pohřbu"
 friend_comforted_at_funeral_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'utěšila','utěšil')] [CHARACTER.GetShortUIName] na pohřbu"
 friend_cried_at_funeral_together: "[CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] spolu plakali na pohřbu"
 rival_competitive_mourning: "[CHARACTER.GetShortUIName|U] se [Select_CString(CHARACTER.IsFemale,'pokusila','pokusil')] při pohřbu strhnout pozornost na sebe, zatímco [TARGET_CHARACTER.GetShortUIName] [Select_CString(TARGET_CHARACTER.IsFemale,'truchlila','truchlil')]"
 rival_competitive_mourning_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] se [Select_CString(TARGET_CHARACTER.IsFemale,'pokusila','pokusil')] při pohřbu strhnout pozornost na sebe, zatímco [CHARACTER.GetShortUIName] [Select_CString(CHARACTER.IsFemale,'truchlila','truchlil')]"
 rival_insulted_at_funeral: "[CHARACTER.GetShortUIName|U] během pohřbu krutě [Select_CString(CHARACTER.IsFemale,'urazila','urazil')] [TARGET_CHARACTER.GetShortUIName]"
 rival_insulted_at_funeral_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] během pohřbu krutě [Select_CString(TARGET_CHARACTER.IsFemale,'urazila','urazil')] [CHARACTER.GetShortUIName]"
 friend_renounced_claim: "[CHARACTER.GetShortUIName|U] se [Select_CString(CHARACTER.IsFemale,'vzdala','vzdal')] nároku na titul držený postavou [TARGET_CHARACTER.GetShortUIName]"
 friend_renounced_claim_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] se [Select_CString(TARGET_CHARACTER.IsFemale,'vzdala','vzdal')] nároku na titul držený postavou [CHARACTER.GetShortUIName]"
 rival_pushed_claim_at_funeral: "[CHARACTER.GetShortUIName|U] během pohřbu veřejně [Select_CString(CHARACTER.IsFemale,'oznámila','oznámil')] svůj nárok na titul držený postavou [TARGET_CHARACTER.GetShortUIName]"
 rival_pushed_claim_at_funeral_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] během pohřbu veřejně [Select_CString(TARGET_CHARACTER.IsFemale,'oznámila','oznámil')] svůj nárok na titul držený postavou [CHARACTER.GetShortUIName]"
 every_funeral_participant: "Každý host na pohřbu"
 mummy_artifact: "Mumie [deceased.GetTitledFirstNameNoTooltip]"
 mummy_artifact_desc: "Tělo [deceased.GetTitledFirstName] bylo nabalzamováno a proměněno v dokonale zachovanou mumii."
 mummy_jar_artifact: "Srdce [deceased.GetTitledFirstNamePossessiveNoTooltip|U]"
