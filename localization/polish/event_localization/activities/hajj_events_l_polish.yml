 hajj.0011.t: "Uvnitř zářivých hradeb"
 hajj.0011.desc: "Mým novým hlavním městem je nyní slavná država [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], a tak jsem [Select_CString(ROOT.Char.IsFemale,'využila','využil')] příležitosti vykonat příslušné obřady a přijmout požehnání hadždže."
 hajj.0011.a: "[ROOT.Char.GetFaith.HighGodName] je mi už teď blíž."
 hajj.0011.a_cynical: "Bylo třeba to udělat."
 hajj.0500.t: "Zářivé hradby"
 hajj.0500.desc: "„#EMP Zářivé hradby, zářivé hradby...#!“ mumlá [hajj_dying_relative.GetTitledFirstName], když vstupuji do [hajj_dying_relative.GetFirstNamePossessiveNoTooltip] [ROOT.Char.Custom('GetChamber')]. Dýchá těžce, jako by se samotný vzduch zdráhal vstoupit do nemocných plic kdysi [Select_CString(hajj_dying_relative.IsFemale,'velké ženy','velkého muže')].\n\nOdkašlu si a [hajj_dying_relative.GetFirstNamePossessiveNoTooltip] zakalené oči se na mě s námahou zaostří. „[ROOT.Char.GetFirstNameNoTooltip]? ... jsi to ty?“ zašeptá. Pak se pohled na okamžik vyjasní. „Zářivé hradby. Mekka.“\n\n„Musíš vykonat hadždž, [hajj_dying_relative.Custom2('RelationToMe', ROOT.Char)]. #EMP Musíš#! spatřit zářivé hradby!“ [hajj_dying_relative.GetFirstNameNoTooltip] se po náhlém vypětí rozkašle a tiše zakňučí. Jak politováníhodné."
 hajj.0500.a: "Splním to."
 hajj.0500.a.flavor: "Poslední přání je poslední přání."
 hajj.0500.a.tt_hajj: "Tvá příští [Concept('pilgrimage','pouť')|E] v rámci [Concept('hajj','hadždže')|E] bude levnější"
 hajj.0500.b: "„Já... nic slíbit nemůžu, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hajj_dying_relative'))].“"
 hajj.0500.b.flavor: "Opravdu bych raději ne."
 hajj.3010.t: "Abrahamovo místo"
 hajj.3010.desc: "Po vstupu do Mekky mě jako první čeká návštěva Abrahamova místa. Tento posvátný kámen je považován za stupínek, na němž před mnoha staletími stál Abraham při stavbě Kaaby za pomoci Ismáíla.\n\nPoutníci kolem mě přistupují ke svatyni a sklánějí hlavy v rozjímavé modlitbě. [Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych učinit totéž."
 hajj.3010.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych se modlit za něco hmatatelnějšího..."
 hajj.3010.a.wealth.t: "Bohatství"
 hajj.3010.a.wealth.desc: "Napadá tě, jak rozmnožit své bohatství"
 hajj.3010.a.opinion.t: "Společenské umění"
 hajj.3010.a.opinion.desc: "Dochází ti, jak si získat větší oblibu"
 hajj.3010.a.prestige.t: "Prestiž"
 hajj.3010.a.prestige.desc: "Dochází ti, jak získat větší prestiž"
 hajj.3010.a.bad.t: "Pověrčivost"
 hajj.3010.a.bad.desc: "Podporuješ svou pověrčivost"
 hajj.3010.b: "Pokleknu a ponořím se do rozjímání."
 hajj.3010.b.flavor_cynical: "Ať už to mám za sebou."
 hajj.3020.t: "Safa a Marwa"
 hajj.3020.desc: "Mým dalším úkolem je sedmkrát projít mezi dvěma posvátnými místy Safa a Marwa na památku Hadžar, jejího zoufalství a úsilí nalézt vodu pro syna Ismáíla.\n\nIsmáíla, který se později stal praotcem požehnaného Proroka.\n\nKdyž se připravuji na obřad, rozhlédnu se po Safě a Marwě a všimnu si množství poutníků ze všech vrstev společnosti, kteří už mezi oběma pahorky putují."
 hajj.3020.a: "Proč se spokojit se sedmi!"
 hajj.3020.b: "Poctivých sedm okruhů postačí."
 hajj.3020.c: "Všimne si někdo, když jich udělám méně?"
 hajj.3020.c.success.t: "Lenost se vyplatila"
 hajj.3020.c.success.desc: "Úspěšně zvládneš odbýt několik okruhů"
 hajj.3020.c.failure.desc: "Přistihnou tě a dostaneš trest"
 hajj.3021.t: "[Select_CString(ROOT.Char.IsFemale,'Přistižena','Přistižen')]!"
 hajj.3021.desc: "Když se vydávám zpět od obou pahorků, jedna z místních duchovních osob si mě změří přísným pohledem. „#EMP Domnívám se#!, že jsi obřad Safy a Marwy [Select_CString(ROOT.Char.IsFemale,'nevykonala','nevykonal')] řádně, hadždží.“\n\n[penalizer.GetFirstNameNoTooltip] pokračuje: „Trestem za takové jednání je buď damm, nebo sadaqah al-Fitr. Samozřejmě můžeš okruhy prostě vykonat správně.“ [Select_CString(penalizer.IsFemale,'Její','Jeho')] tvář na okamžik změkne.\n\n„Pokud odmítneš, hadždž zůstane nedokončený. Tak co to bude, hadždží?“"
 hajj.3021.a: "Tak tedy zvířecí oběť."
 hajj.3021.a.flavor: "Damm. $hajj.3040.c.flavor$"
 hajj.3021.b: "Přispěji darem."
 hajj.3021.b.flavor: "Sadaqah al-Fitr. Obětovat obilí a datle chudým zní záslužně."
 hajj.3021.c: "Tentokrát prostě poctivě absolvuji všech sedm okruhů."
 hajj.3021.c.flavor_zealous: "#EMP [Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')]#! jsem, že jsem to [Select_CString(ROOT.Char.IsFemale,'měla','měl')] brát vážně..."
 hajj.3021.c.flavor: "Ach jo."
 hajj.3030.t: "Studna Zamzam"
 hajj.3030.desc: "Stojím před tajemnou studnou Zamzam, objevenou díky snům o věčném prameni v poušti. Napít se její vody je jedním z dávných obřadů hadždže a nyní je řada na mně.\n\nStudnu, vystupující z důmyslného kamenného zdiva, ze všech stran obklopují poutníci. Musím se protlačit davem, abych se [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')] k posvěcené vodě, o niž se dělí tolik lidí."
 hajj.3030.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych nechat ostatní jít první."
 hajj.3030.a.flavor: "Nikam nespěchám."
 hajj.3030.b: "Uhasím žízeň své duše!"
 hajj.3030.b.flavor: "Výtečné. A prý také činí zázraky!"
 hajj.3030.c: "Možná si jen trochu namočím ruce."
 hajj.3030.c.flavor: "Tohle #EMP opravdu#! nevypadá hygienicky!"
 hajj.3040.t: "Oběť Alláhovi"
 hajj.3040.desc: "Nastal čas na další obřad: přinést oběť, kterou přijme [ROOT.Char.GetFaith.HighGodName]. Pro tuto příležitost byla vyhrazena zvláštní část obřadního prostoru a čím více se blížím ke stánkům s nejrůznějšími zvířaty, tím silnější je jejich pižmový pach.\n\nPečlivě zvažuji možnosti. Obětovat velké zvíře, například velblouda, by jistě bylo zbožnějším činem, ale k dokončení hadždže bohatě postačí i menší zvíře nebo ovce.\n\nV jednom koutě se také několik poutníků zřejmě složilo na velkou krávu a podělilo se o náklady."
 hajj.3040.a: "Šedesát tři velbloudů!"
 hajj.3040.a.flavor: "Nebudu přece horší než velký Prorok!"
 hajj.3040.b: "Jeden velbloud bohatě postačí."
 hajj.3040.b.flavor: "Velbloudi znají jedno tajemství..."
 hajj.3040.c: "Vezmu ovci."
 hajj.3040.c.flavor: "Stejně se mi nikdy nelíbily ty jejich korálkové oči."
 hajj.3040.d: "Přidám se támhle k té oběti krávy."
 hajj.3040.d.flavor: "Proč brát víc životů, než je nutné?"
 hajj.3001.t: "Halq"
 hajj.3001.desc: "[Select_CString(ROOT.Char.IsFemale,'Pomodlila','Pomodlil')] jsem se u Abrahamova místa, [Select_CString(ROOT.Char.IsFemale,'prošla','prošel')] mezi Safou a Marwou, [Select_CString(ROOT.Char.IsFemale,'napila','napil')] se vody ze studny Zamzam a [Select_CString(ROOT.Char.IsFemale,'přinesla','přinesl')] oběť, kterou přijme [ROOT.Char.GetFaith.HighGodName]. Nyní jsem [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')] dokončit hadždž. Dalším obřadem je ostříhání vlasů.\n\n"
 hajj.3001.desc.male_dominated: "Muži si tradičně holí celou hlavu, i když někdy dostanou svolení ostříhat pouze část vlasů. Ženy si smějí ustřihnout jen pramen."
 hajj.3001.desc.female_dominated: "Ženy si tradičně holí celou hlavu, i když někdy dostanou svolení ostříhat pouze část vlasů. Muži si smějí ustřihnout jen pramen."
 hajj.3001.desc.equal: "Tradičně se holí celá hlava, ale někdy je uděleno svolení ostříhat pouze část vlasů."
 hajj.3001.a: "Oholit všechno!"
 hajj.3001.b: "Ustřihnout jen pramen vlasů."
