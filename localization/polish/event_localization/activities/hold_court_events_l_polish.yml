l_polish:
 hold_court_placeholder_gain_cgv: "Získáš #P 10#! velkoleposti dvora"
 hold_court_placeholder_lose_cgv: "Ztratíš #N 10#! velkoleposti dvora"
 hold_court_start_activity: "Vyslechneš prvního žadatele"
 hold_court_header: "Pořádání audience:"
 hold_court.0001.t: "$hold_court_header$ Zahájení"
 hold_court.0001.desc: "Sedím na trůně a pokynu strážím, aby otevřely dveře síně. Dovnitř proudí lidé, někteří se řadí před mým trůnem, zatímco ostatní ustupují stranou, aby mohli průběh audience pouze sledovat.\n\nPo několika okamžicích ruch v síni utichne a všechny tváře se s očekáváním obrátí ke mně. Před sebou napočítám [ROOT.Var('num_petitioners').GetValue|V0] žadatelů seřazených v úhledné řadě, kteří čekají, až je vyzvu, aby předstoupili."
 hold_court.0001.a: "Pokynu prvnímu v řadě, ať předstoupí."
 hold_court.0001.b: "Když tak o tom přemýšlím, venku je krásný den..."
 hold_court.0001.b.tooltip: "Tvá audience končí a žadatele pošleš domů"
 hold_court.1001.t: "Nepřímá špionáž"
 hold_court.1001.desc: "Můj host [rumormonger.GetTitledFirstName] přistoupí k trůnu s úšklebkem na tváři a hluboce se ukloní.\n\n„Zdravím, Vaše Veličenstvo. Během své nedávné cesty do [neighboring_realm.GetName] jsem se [Select_CString(rumormonger.IsFemale,'dozvěděla','dozvěděl')] několik #EMP fascinujících#! drobností o poddaných, kterým vládne [neighboring_ruler.GetTitledFirstName]. Mohu se s vámi o ně podělit... za jistou cenu.“"
 hold_court.1001.a: "Je to vysoká cena, ale nemohu si dovolit zůstat v nevědomosti."
 hold_court.1001.a.seducer: "Možná bychom se mohli dohodnout jinak?"
 hold_court.1001.a.success: "Informace od [rumormonger.GetTitledFirstName] obsahují cenný materiál k vydírání"
 hold_court.1001.a.success.tt: "[rumormonger.GetTitledFirstName] ti odhalí každé relevantní [Concept('secret','tajemství')|E], které zná"
 hold_court.1001.a.failure: "Informace od [rumormonger.GetTitledFirstName] nejsou ničím víc než planými klepy"
 hold_court.1001.a.failure.tt: "[rumormonger.GetTitledFirstName] ve skutečnosti nezná žádná relevantní [Concept('secrets','tajemství')|E]"
 hold_court.1001.b: "Nikdo mě nebude vydírat před mým vlastním dvorem! Stráže, zatkněte [rumormonger.GetTitledFirstName]!"
 hold_court.1001.c: "[Select_CString(rumormonger.IsFemale,'Zmiz, klevetnice!','Zmiz, klevetníku!')] Na mém dvoře pro tebe není místo!"
 hold_court.1011.t: "Válka za nárok"
 hold_court.1011.desc: "„Ó [Select_CString(ROOT.Char.IsFemale,'štědrá','štědrý')] [ROOT.Char.GetTitledFirstNameNoTooltip], jsem [claimant_guest.GetFirstName] a [Select_CString(claimant_guest.IsFemale,'přišla jsem','přišel jsem')] zdaleka, abych vás [Select_CString(claimant_guest.IsFemale,'požádala','požádal')] o pomoc při nápravě veliké křivdy!“\n\n[claimant_guest.GetFirstNameNoTooltip] se přede mnou hluboce ukloní a pokračuje v dobře nacvičené prosbě. „[target_character.Custom2('MyCharacterIntroduction', claimant_guest)|U] nyní sedí na trůnu [target_title.GetNameNoTier], ale [Select_CString(claimant_guest.IsFemale,'já jsem skutečnou a právoplatnou vládkyní těch zemí','já jsem skutečným a právoplatným vládcem těch zemí')]!“\n\n„Pokud mi pomůžete prosadit můj nárok, přísahám vám věrnost a budu vám oddaně sloužit až do konce svých dnů.“"
 hold_court.1011.a: "Do roka vytáhnu do války za tvůj nárok!"
 hold_court.1011.b: "Prosím, ihned odejdi — nemohu riskovat, že urazím [target_character.GetTitleAsNameNoTooltip]."
 hold_court.1011.c: "Nemohu ti pomoci, ale užij si alespoň mé pohostinnosti."
 hold_court.1021.t: "Prach v prach"
 hold_court.1021.desc: "[Select_CString(peasant.IsFemale,'Vyhublá otrhaná venkovanka','Vyhublý otrhaný sedlák')] stojí přede mnou a s otevřenými ústy zírá na přepych mého trůnního sálu. Okolí očividně odvádí pozornost od audience, a tak na [peasant.GetFirstNameNoTooltip] zavolám.\n\n„Ach, omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')]. Já, ehm... Naši vesnici v [county.GetNameNoTier] letos postihla neúroda. Přišli jsme nejen o úrodu, ale i o osivo. Nic nám nezbylo, bez pomoci zemřeme hlady!“\n\n[peasant.GetFirstNameNoTooltip] se znovu rozhlédne po mém trůnním sále a dodá: „Jistě máte bohatství nazbyt?“"
 hold_court.1021.a: "Dostaneš prostředky, které potřebuješ k obnově."
 hold_court.1021.a.stewardship: "Zaveďme systém sdílení úrody se sousedními vesnicemi."
 hold_court.1021.b: "Tvá služba splatí tvůj dluh."
 hold_court.1021.c: "Jsou-li pole neúrodná, chopíš se meče."
 county_or_15_dev: "[county.GetName] a každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E] s [Concept('development','rozvojem')|E] 15 nebo nižším"
 hold_court.0021.t: "$hold_court_header$ Závěr"
 hold_court.0021.desc: "Když odejde poslední z příchozích se žádostí, několik dvořanů zamíří také ven za svými povinnostmi. Ostatní zůstávají a mezi sebou probírají právě skončenou audienci.\n\nBrzy se veškerá obřadní formálnost zcela vytratí a nahradí ji obvyklý ruch a shon dvorského života."
 hold_court.0021.a: "Má práce zde skončila."
 hold_court.0021.arrogant: "Je dobré nechat poddané žasnout nad mou přítomností."
 hold_court.0021.shy: "Nemohu se dočkat, až se vrátím do svých komnat..."
 hold_court.0021.gregarious: "Tohle je dobrá příležitost vmísit se mezi své dvořany."
 hold_court.0021.every_guest_and_courtier: "Každý host a dvořan:"
 hold_court_1001_pool_tt: "[rumormonger.GetShortUIName] opustí tvůj [Concept('court','dvůr')|E]"
