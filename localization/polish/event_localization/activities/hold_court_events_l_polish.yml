l_polish:
 hold_court_placeholder_gain_cgv: "Získáte #P 10#! Velkolepost dvora"
 hold_court_placeholder_lose_cgv: "Ztratíte #N 10#! Velkolepost dvora"
 hold_court_start_activity: "Vyslechnete prvního žadatele"
 hold_court_header: "Uskutečnit audienci:"
 hold_court.0001.t: "$hold_court_header$ Zahájení"
 hold_court.0001.desc: "Sedím na svém trůnu a pokynu strážím, aby otevřeli dveře síně. Proud lidí vchází dovnitř; někteří se postaví do fronty před mým trůnem, jiní ustoupí, aby mohli jen sledovat průběh.\n\nPo chvíli se v komoře hnutí zastaví, všechny tváře jsou obráceny k mně s očekáváním. Před sebou napočítám [ROOT.Var('num_petitioners').GetValue|V0] žadatelů postavených v řadě, čekajících, až je povolám."
 hold_court.0001.a: "Pokynu prvnímu ve frontě, aby přistoupil."
 hold_court.0001.b: "Na druhou stranu, venku je krásný den..."
 hold_court.0001.b.tooltip: "Vaše audience končí a posíláte žadatele domů"
 hold_court.1001.t: "Nepřímá špionáž"
 hold_court.1001.desc: "Můj host [rumormonger.GetTitledFirstName] přistupuje k mému trůnu s úšklebkem na [rumormonger.GetHerHis] tváři a hluboce se uklání.\n\n„Vaše Veličenstvo. Během mé nedávné cesty do [neighboring_realm.GetName] jsem se dozvěděl několik #EMP fascinujících#! informací o některých [neighboring_ruler.GetTitledFirstNamePossessive] poddaných. Rád bych se s vámi o ně podělil... za odměnu.“"
 hold_court.1001.a: "Je to vysoká částka, ale nemohu si dovolit zůstat nevědomý."
 hold_court.1001.a.seducer: "Možná se můžeme dohodnout jinak?"
 hold_court.1001.a.success: "[rumormonger.GetTitledFirstNamePossessive] informace obsahují cenný materiál k vydírání"
 hold_court.1001.a.success.tt: "[rumormonger.GetTitledFirstName] vám odhalí všechna relevantní [secret|E], která [rumormonger.GetSheHe] zná"
 hold_court.1001.a.failure: "[rumormonger.GetTitledFirstNamePossessive] informace nejsou nic jiného než pouhé klepy"
 hold_court.1001.a.failure.tt: "[rumormonger.GetTitledFirstName] ve skutečnosti nezná žádné relevantní [secrets|E]"
 hold_court.1001.b: "Nikdo mě nebude vydírat před mým vlastním dvorem! Stráže, zatkněte [rumormonger.GetHerHim]!"
 hold_court.1001.c: "Pryč, šířiči drbů! Můj dvůr nemá místo pro tvé podobné!"
 hold_court.1011.t: "Nárok k válce"
 hold_court.1011.desc: "„Ó štědrý [ROOT.Char.GetTitledFirstNameNoTooltip], jsem [claimant_guest.GetFirstName], a přicestoval jsem zdaleka, abych vás požádal o pomoc při napravování velké křivdy!“„\n\n[claimant_guest.GetWomanMan] přede mnou se hluboce uklání a pokračuje [claimant_guest.GetHerHis] dobře nacvičenou prosbou. „[target_character.Custom2('MyCharacterIntroduction', claimant_guest)|U] v současnosti sedí na trůnu [target_title.GetNameNoTier], ale já jsem pravým a oprávněným vládcem těchto zemí!“\n\n„Pokud mi pomůžete uplatnit můj nárok, složím vám věrnost a budu vám oddaně sloužit až do konce svých dnů." # todo: RETRANSLATED ENGLISH
 hold_court.1011.a: "Do roka prosadím váš nárok!"
 hold_court.1011.b: "Okamžitě odejděte — nemohu si dovolit urazit [target_character.GetTitleAsNameNoTooltip]."
 hold_court.1011.c: "Nemohu vám pomoci, ale užijte si mou pohostinnost."
 hold_court.1021.t: "Prach k prachu"
 hold_court.1021.desc: "Před mnou stojí hubený, roztrhaný rolník a zírá na přepych mého trůnního sálu. Zjevně roztržitý, zavolám [peasant.GetHerHim], abych upoutal [peasant.GetHerHis] pozornost.\n\n„Och, promiňte, pane. Eh... Moje vesnice v [county.GetNameNoTier] byla letos postižena morem úrody. Ztratili jsme nejen sklizeň, ale i semeno. Nemáme nic, zahyneme hlady bez pomoci!“\n\nZnovu se porozhlédne po mém trůnném sále a dodá: „Určitě máte nějaké prostředky, které můžete obětovat?“"
 hold_court.1021.a: "Dostanete prostředky, které potřebujete k obnově."
 hold_court.1021.a.stewardship: "Zavedeme systém sdílení úrody se sousedními vesnicemi."
 hold_court.1021.b: "Vaše služba splatí váš dluh."
 hold_court.1021.c: "Když budou pole neúrodná, chopíte se meče."
 county_or_15_dev: "[county.GetName] a každý [realm|E] [county|E] s 15 nebo méně [development|E]"
 hold_court.0021.t: "$hold_court_header$ Závěr"
 hold_court.0021.desc: "Jak poslední žadatel odchází, různorodí dvořané ho následují z místnosti, mají jiné povinnosti. Někteří zůstávají a šeptají si mezi sebou o právě proběhlém jednání.\n\nBrzy se ceremoniální formality úplně rozplynou a místo nich se rozhostí ruch a shon běžného dvorního života."
 hold_court.0021.a: "Má práce zde je hotova."
 hold_court.0021.arrogant: "Je dobré nechat své poddané kochat se úžasem nad mou přítomností."
 hold_court.0021.shy: "Nemohu se dočkat, až se vrátím do svých komnat..."
 hold_court.0021.gregarious: "To vypadá jako dobrá příležitost se pobavit s dvořany."
 hold_court.0021.every_guest_and_courtier: "Každý host a dvořan:"
 hold_court_1001_pool_tt: "[rumormonger.GetShortUIName] opouští váš [court|E]"
