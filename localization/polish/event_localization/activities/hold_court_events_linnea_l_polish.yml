l_polish:
 hold_court.5010.t: "[county.GetNameNoTierNoTooltip|U] se vymyká kontrole"
 hold_court.5010.desc_marshal: "[marshal.GetCouncilTitle] [marshal.GetTitledFirstName] přistoupí k trůnu.\n\n"
 hold_court.5010.desc: "[Select_CString(peasant.IsFemale,'Venkovanka','Sedlák')] nesměle přistoupí k mému trůnu a nervózně svírá svou pokrývku hlavy.\n\n"
 hold_court.5010.desc.outro: "„[county.GetName|U] sužují nepokoje a lapkové, [ROOT.Char.Custom('FormOfAddressForLiege')]. Stačí věnovat kraji trochu peněz a pořádek může být obnoven.“"
 hold_court.5010.a: "Zajímavý nápad, zkusme to."
 hold_court.5010.b: "Máš pravdu, potřebujeme #EMP pořádné#! krveprolití!"
 hold_court.5010.c: "Na tohle nemám čas."
 hold_court.5030.t: "Psaný jazyk"
 hold_court.5030.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi ukazuje stránku plnou neznámých znaků a trvá na tom, že se dají přečíst.\n\n„Vytvořil[Select_CString(courtier.IsFemale,'a','')] jsem zvláštní psaný jazyk pro [Select_CString(courtier.IsFemale,'ženy','muže')] u dvora, protože číst a psát se většinou učí [Select_CString(courtier.IsFemale,'muži','ženy')]. Pokud mi to dovolíte, začnu jej okamžitě vyučovat [Select_CString(courtier.IsFemale,'dámám','pánům')]!“\n\nNemohu si nepředstavovat, jakou svobodu by takový jazyk mohl přinést!"
 hold_court.5030.a: "To je skvělý nápad!"
 hold_court.5030.courtiers: "[Select_CString(courtier.IsFemale,'Všechny dvořanky','Všichni dvořané')]"
 hold_court.5030.b: "Dvorní učitel [court_tutor.GetFirstNameNoTooltip] ti s výukou pomůže."
 hold_court.5030.c: "Tvůj talent můžeme využít lépe!"
