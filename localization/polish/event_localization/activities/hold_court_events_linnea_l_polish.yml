l_polish:
 hold_court.5010.t: "[county.GetNameNoTierNoTooltip|U] Mimo kontrolu"
 hold_court.5010.desc_marshal: "[marshal.GetCouncilTitle] [marshal.GetTitledFirstName] přichází k trůnu.\n\n"
 hold_court.5010.desc: "Jeden sedlák [peasant.GetWomanMan] se nesměle přiblíží k mému trůnu, svíraje [peasant.GetHerHis] klobouk.\n\n"
 hold_court.5010.desc.outro: "„[county.GetName|U] sužuje neklid a banditství, má [ROOT.Char.GetLadyLord]. Věnujte trochu mincí regionu a pořádek může být obnoven.“"
 hold_court.5010.a: "Zajímavý nápad, vyzkoušejme to."
 hold_court.5010.b: "Máš pravdu, co potřebujeme, je #EMP nadměrné#! krveprolití!"
 hold_court.5010.c: "Nemám na to čas."
 hold_court.5030.t: "Psaný jazyk"
 hold_court.5030.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi ukáže stránku plnou neznámých symbolů a trvá na tom, že je čitelná.\n\n„Vytvořil jsem psaný jazyk speciálně pro [courtier.GetWomenMen] na dvoře, protože písmena jsou většinou vyučována [courtier.Custom('WomenMenOpp')]. Pokud to dovolíte, začnu jej hned vyučovat [courtier.Custom('LadiesLords')]!“\n\nNemohu se ubránit představě svobody, kterou by takový jazyk mohl přinést!"
 hold_court.5030.a: "Skvělý nápad!"
 hold_court.5030.courtiers: "Všichni [courtier.Custom('FemaleMale')|U] dvořané"
 hold_court.5030.b: "Dvorský učitel [court_tutor.GetFirstNameNoTooltip] vám pomůže ho vyučovat."
 hold_court.5030.c: "Můžeme lépe využít vašich talentů!"
