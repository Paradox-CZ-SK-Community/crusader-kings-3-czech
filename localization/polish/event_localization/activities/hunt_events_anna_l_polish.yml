l_polish:
 hunt_events_anna.0001.t: "Hluboké kořeny" # todo: NEW TRANSLATION
 hunt_events_anna.0001.desc: "Představuje se mi mohutný dub se svým majestátním koruním, sahajícím daleko do stran — zahalujícím vše pod sebou do tmy. Pohled vzhůru k jeho větvím mi připomíná různé dynastie, které přicházejí a odcházejí. Všichni ti, kdo tu byli přede mnou, a ti, kdo předají mé dědictví dál, až zemřu.\n\nKdyž se přiblížím, všimnu si několika vyrytých iniciál na jeho kůře, jemné připomínky, že lidé přicházejí a odcházejí v průběhu věků. A osobou, s níž chci své dědictví sdílet, je mé všechno, [love_interest.GetFirstName]." # todo: NEW TRANSLATION
 hunt_events_anna.0001.a: "Vyřežu iniciály [love_interest.GetFirstNameNoTooltip] do kůry" # todo: NEW TRANSLATION
 hunt_events_anna.0001.b: "Na takové hlouposti není čas!" # todo: NEW TRANSLATION
 hunt_events_anna.0001.b.t_toast: "Lov je mou hlavní prioritou." # todo: NEW TRANSLATION
 hunt_events_anna.0005.t: "Pod mou kůží" # todo: NEW TRANSLATION
 hunt_events_anna.0005.desc: "Moje krátké odpočívání přeruší posměšný smích směřující ke mně. Podívám se vzhůru a k ne příliš velkému překvapení mě vítá široký úsměv [mocking_participant.GetFirstName], který drží v [mocking_participant.GetHerHis] sevření to, co vypadá jako mrtvý [ROOT.Char.Custom('SmallAnimal')].\n\n„Na tebe jsem nikdy nesázel, že bys dokázal přežít sám v divočině, takže jsem si myslel, že bys mohl potřebovat trochu praxe,“ říká [mocking_participant.GetSheHe|U] posměšným tónem a hází kus mršiny před moje nohy." # todo: NEW TRANSLATION
 hunt_events_anna.0005.a: "Pokusím se zvíře oškubat." # todo: NEW TRANSLATION
 hunt_events_anna.0005.a.toast.good: "Úspěšně ze zvířete stáhnu kůži" # todo: NEW TRANSLATION
 hunt_events_anna.0005.a.toast.nothing: "Co zbylo, je nerozpoznatelné" # todo: NEW TRANSLATION
 hunt_events_anna.0005.b: "Procvičování? Proč ne..." # todo: NEW TRANSLATION
 hunt_events_anna.0005.c: "Není mojí povinností dělat takovou podřadnou práci." # todo: NEW TRANSLATION
 hunt_events_anna.0010.t: "Uvězněná dole" # todo: NEW TRANSLATION
 hunt_events_anna.0010.desc: "S těžkými a nestabilními kroky stopuji svou kořist přes [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')], soustředěná na to, abych držela tempo. Ostré prasknutí se rozléhá mými ušima. Pocítím náhlou beztíživost a hluboké poletování v podbřišku. Pád ustane a prudká bolest projede tělem od nárazu.\n\nKdyž se bolestivě rozhlédnu, vidím jen čtyři zdi kolem sebe. Spadla jsem do pasti a musím najít způsob, jak se dostat ven." # todo: NEW TRANSLATION
 hunt_events_anna.0010.a: "Vyšplhej ven z jámy." # todo: NEW TRANSLATION
 hunt_events_anna.0010.a.desc.good: "Úspěšně se vyšplhám ven" # todo: NEW TRANSLATION
 hunt_events_anna.0010.a.toast.good: "Překonám bolest a dostanu se ven" # todo: NEW TRANSLATION
 hunt_events_anna.0010.a.toast.bad: "Znovu zakopnu a při tom se zraním" # todo: NEW TRANSLATION
 hunt_events_anna.0010.a.desc.bad: "Uklouznu a spadnu zpět do jámy" # todo: NEW TRANSLATION
 hunt_events_anna.0010.b: "„Je tam někdo?!“" # todo: NEW TRANSLATION
 hunt_events_anna.0010.b.flavor: "Lovci přeruší hon a místo toho mi pomohou." # todo: NEW TRANSLATION
 hunt_events_anna.0015.t: "Nadechni... Vydechni..." # todo: NEW TRANSLATION
 hunt_events_anna.0015.desc: "Podivné dunění, tiché mumlání a občasné povzdechnutí se odráží hájem. Postava s lukem chodí sem a tam a zdá se být z něčeho frustrovaná.\n\nAbych se podívala blíž, ukryju se za stromem a nenápadně nahlédnu. Vidím svého [child_with_bow.Custom('GetDaughterSon')] [child_with_bow.GetFirstName], s několika šípy rozházenými po zemi, které sotva zasahují terč, který si [child_with_bow.GetSheHe] postavil. Zdá se, že by [child_with_bow.GetSheHe] trochu prospělo vedení." # todo: NEW TRANSLATION
 hunt_events_anna.0015.a: "„Tady, nech mě ti ukázat...“" # todo: NEW TRANSLATION
 hunt_events_anna.0015.a.flavor: "Jako zdatná lovkyně bych měla být schopná použít své vlastní zkušenosti a naučit [child_with_bow.GetHerHim] lepší postoj a přesnost." # todo: NEW TRANSLATION
 hunt_events_anna.0015.a.toast.good: "[child_with_bow.GetFirstNameNoTooltip] se řídí mými pokyny" # todo: NEW TRANSLATION
 hunt_events_anna.0015.a.toast.bad: "[child_with_bow.GetFirstNameNoTooltip] nerozumí mým pokynům" # todo: NEW TRANSLATION
 hunt_events_anna.0015.b: "Povzbuď [child_with_bow.GetHerHim] povzbuzováním." # todo: NEW TRANSLATION
 hunt_events_anna.0015.c: "Nech [child_with_bow.GetFirstNameNoTooltip], ať si poradí." # todo: NEW TRANSLATION
 hunt_events_anna.0015.c.toast: "[child_with_bow.GetFirstNameNoTooltip] si poradí s lukem" # todo: NEW TRANSLATION
