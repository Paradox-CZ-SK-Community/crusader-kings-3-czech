l_polish:
 hunt_events_anna.0001.t: "Hluboké kořeny"
 hunt_events_anna.0001.desc: "Přede mnou se tyčí mohutný dub s majestátní korunou, která se rozprostírá široko daleko a vše pod sebou halí do stínu. Když vzhlédnu k jeho větvím, připomínají mi dynastie, které přicházejí a odcházejí. Všechny ty, kteří tu byli přede mnou, i ty, kteří ponesou můj odkaz dál, až tu nebudu.\n\nKdyž přijdu blíž, všimnu si několika iniciál vyrytých do kůry, tiché připomínky toho, jak lidé v průběhu věků přicházejí a odcházejí. A člověkem, s nímž bych [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] svůj odkaz předat dál, je pro mě vším [love_interest.GetFirstName]."
 hunt_events_anna.0001.a: "Vyryji iniciály [love_interest.GetFirstNameNoTooltip] do kůry"
 hunt_events_anna.0001.b: "Na takové hlouposti není čas!"
 hunt_events_anna.0001.b.t_toast: "Lov je mou hlavní prioritou."
 hunt_events_anna.0005.t: "Pod kůží"
 hunt_events_anna.0005.desc: "Můj krátký odpočinek přeruší posměšný smích, který se blíží mým směrem. Vzhlédnu a k mému nevelkému překvapení mě přivítá široký úšklebek [mocking_participant.GetFirstName], [Select_CString(mocking_participant.IsFemale,'která','který')] v ruce svírá cosi, co vypadá jako mrtvý [ROOT.Char.Custom('SmallAnimal')].\n\n„Nikdy jsem si [Select_CString(mocking_participant.IsFemale,'nemyslela','nemyslel')], že bys v divočině [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] přežít bez pomoci, tak mě napadlo, že by se ti trocha cviku hodila,“ pronese [mocking_participant.GetFirstNameNoTooltip] posměšným tónem a hodí mršinu k mým nohám."
 hunt_events_anna.0005.a: "Pokusím se zvíře stáhnout z kůže."
 hunt_events_anna.0005.a.toast.good: "Úspěšně zvíře stáhnu z kůže"
 hunt_events_anna.0005.a.toast.nothing: "Z toho, co zbylo, už nelze poznat, co to původně bylo"
 hunt_events_anna.0005.b: "Cvik? Proč ne..."
 hunt_events_anna.0005.c: "Tak podřadnou práci přece nebudu dělat já."
 hunt_events_anna.0010.t: "[Select_CString(ROOT.Char.IsFemale,'Uvězněna','Uvězněn')] v jámě"
 hunt_events_anna.0010.desc: "Těžkými a nejistými kroky sleduji kořist skrz [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] a soustředím se, abych [Select_CString(ROOT.Char.IsFemale,'neztratila','neztratil')] tempo. Náhle se ozve ostré prasknutí. Na okamžik jako bych nic [Select_CString(ROOT.Char.IsFemale,'nevážila','nevážil')], až se mi sevře žaludek. Pád se prudce zastaví a náraz mi tělem vyšle spalující bolest.\n\nS bolestí se rozhlédnu kolem sebe a všude vidím jen čtyři stěny. [Select_CString(ROOT.Char.IsFemale,'Spadla','Spadl')] jsem do pasti a musím najít způsob, jak se dostat zpátky nahoru."
 hunt_events_anna.0010.a: "Vyšplhám z jámy ven."
 hunt_events_anna.0010.a.desc.good: "Úspěšně vyšplhám ven"
 hunt_events_anna.0010.a.toast.good: "Překonám bolest a dostanu se ven"
 hunt_events_anna.0010.a.toast.bad: "Znovu klopýtnu a při tom se zraním"
 hunt_events_anna.0010.a.desc.bad: "Uklouznu a spadnu zpátky do jámy"
 hunt_events_anna.0010.b: "„Je tam někdo?!“"
 hunt_events_anna.0010.b.flavor: "Lovecká družina přeruší lov a místo toho mi pomůže."
 hunt_events_anna.0015.t: "Nádech... výdech"
 hunt_events_anna.0015.desc: "Mýtinou se rozléhají podivné tupé údery, tiché mumlání a občasný povzdech. Postava s lukem přechází sem a tam a očividně ji něco rozčiluje.\n\nAbych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] podívat zblízka, schovám se za strom a nenápadně vykouknu. Vidím své dítě [child_with_bow.GetFirstName], kolem nějž leží na zemi několik rozházených šípů. Jen málokterý se vůbec přiblížil k terči, který si [child_with_bow.GetFirstNameNoTooltip] [Select_CString(child_with_bow.IsFemale,'postavila','postavil')]. Zdá se, že by se trocha vedení hodila."
 hunt_events_anna.0015.a: "„Tady, ukážu ti, jak na to...“"
 hunt_events_anna.0015.a.flavor: "Mé lovecké zkušenosti by mi měly pomoci naučit [child_with_bow.GetFirstNameNoTooltip] správnému postoji a přesnější střelbě."
 hunt_events_anna.0015.a.toast.good: "[child_with_bow.GetFirstNameNoTooltip] se řídí mými pokyny"
 hunt_events_anna.0015.a.toast.bad: "[child_with_bow.GetFirstNameNoTooltip] mým pokynům nerozumí"
 hunt_events_anna.0015.b: "Povzbudím [child_with_bow.GetFirstNameNoTooltip] hlasitým fanděním."
 hunt_events_anna.0015.c: "Nechám [child_with_bow.GetFirstNameNoTooltip], ať na to přijde [Select_CString(child_with_bow.IsFemale,'sama','sám')]."
 hunt_events_anna.0015.c.toast: "[child_with_bow.GetFirstNameNoTooltip] přijde na to, jak s lukem zacházet"
