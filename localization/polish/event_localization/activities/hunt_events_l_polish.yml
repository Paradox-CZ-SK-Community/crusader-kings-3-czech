 hunt_admires_buddhist_principles: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'vyložila','vyložil')] událost jako božský zásah"
 tgp_hunt.0010.t: "Jeřáb mandžuský"
 tgp_hunt.0010.desc_common: "\n\nKdyž spěcháme na místo, kde byl [activity.Custom('GetAnimalType')] naposledy spatřen, zahlédneme něco mnohem úchvatnějšího: hejno jeřábů mandžuských.\n\nTito symbolové dlouhověkosti a nesmrtelnosti mě přimějí k zamyšlení..."
 tgp_hunt.0010.desc_master_of_the_hunt: "Když odpočívám v táboře, přiběhne za mnou správce lovu se zprávou, že na východě byl spatřen [activity.Custom('GetAnimalType')]. $tgp_hunt.0010.desc_common$"
 tgp_hunt.0010.desc_fallback: "Když odpočívám v táboře, přiběhne za mnou [target_character.GetFirstName], jeden z ostatních lovců, se zprávou, že na východě byl spatřen [activity.Custom('GetAnimalType')]. $tgp_hunt.0010.desc_common$"
 tgp_hunt.0010.a: "Vychutnám si tu podívanou."
 tgp_hunt.0010.b: "Pche! Musím dál hledat [activity.Custom('GetAnimalType')]."
 tgp_hunt.0010.c: "Podíváme se, jak moc jsou doopravdy nesmrtelní."
 tgp_hunt.0010.c.success: "Tvůj šíp zasáhne jeřába"
 tgp_hunt.0010.c.failure: "Tvůj šíp jen těsně mine"
 tgp_hunt.0010.d: "Tohle mi vnuklo inspiraci."
