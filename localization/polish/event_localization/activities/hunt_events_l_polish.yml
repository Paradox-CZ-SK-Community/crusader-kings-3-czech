 hunt.1202.self: "Pozvednu kopí a opatrně se přiblížím k vyčerpanému zvířeti."
 hunt.1202: "[animal_slayer.GetTitledFirstName] pozvedne kopí a opatrně se přiblíží k vyčerpanému zvířeti."
 hunt.1202.slayer: "[host.GetTitledFirstName] se k nám obrátí a vykřikne: „Vpřed! Dorazte ho!“"
 hunt.1202.slayer_self: "Skupina vyrazí vpřed a rozestoupí se kolem vyděšeného zvířete."
 hunt.1202.capture: "[host.GetTitledFirstName] se k nám obrátí a vykřikne: „Přineste provazy, vezmeme ho živého!“"
 hunt.1202.capture_self: "Ostatní přinesou provazy a společně vymýšlíme, jak bestii zpacifikovat."
 hunt.1202.craven: "[host.GetTitledFirstName] se k nám obrátí a vykřikne: „Běžte! Na co čekáte?! Dorazte ho!“"
 hunt.1202.craven_self: "Ostatní vyrazí vpřed, zatímco já zůstávám vzadu a pevně svírám svou zbraň."
 hunt.1202.capture_success: "Po dlouhém zápasu a [activity.Custom('GetAnimalSoundParticiple')] se nám [activity.Custom('GetAnimalType')] konečně podaří zpacifikovat a bezmocně svázat."
 hunt.1202.capture_injury: "Po dlouhém zápasu a [activity.Custom('GetAnimalSoundParticiple')] se nám [activity.Custom('GetAnimalType')] podaří zpacifikovat, ale během toho utrpím vážné zranění."
 hunt.1202.capture_failure: "Po dlouhém zápasu a [activity.Custom('GetAnimalSoundParticiple')] se nám [activity.Custom('GetAnimalType')] podaří zpacifikovat, ale [injury_target.GetFirstName] během toho utrpí těžký zásah [activity.Custom('GetAnimalStrike')]."
 hunt.1202.capture_critical: "Po dlouhém zápasu a [activity.Custom('GetAnimalSoundParticiple')] se nám [activity.Custom('GetAnimalType')] podaří zpacifikovat, ale ještě předtím [injury_target.GetFirstName] po zásahu [activity.Custom('GetAnimalStrike')] skončí na zemi."
 hunt.1202.success_self: "\n\nPomalu bestii obklíčíme se vztyčenými kopími a ukončíme trápení [activity.Custom('GetAnimalSoundParticiple')] zvířete."
 hunt.1202.success: "\n\nLovci pomalu bestii obklíčí se vztyčenými kopími a ukončí trápení [activity.Custom('GetAnimalSoundParticiple')] zvířete."
 hunt.1202.failure_injury: "\n\nPomalu bestii obklíčíme se vztyčenými kopími, ale než ukončíme trápení [activity.Custom('GetAnimalSoundParticiple')] zvířete, schytám zásah [activity.Custom('GetAnimalStrike')]."
 hunt.1202.failure_self: "\n\nPomalu bestii obklíčíme se vztyčenými kopími, ale než ukončíme trápení [activity.Custom('GetAnimalSoundParticiple')] zvířete, [injury_target.GetFirstName] schytá zásah [activity.Custom('GetAnimalStrike')]."
 hunt.1202.failure: "\n\nLovci pomalu bestii obklíčí se vztyčenými kopími, ale než ukončí trápení [activity.Custom('GetAnimalSoundParticiple')] zvířete, [injury_target.GetFirstName] schytá zásah [activity.Custom('GetAnimalStrike')]."
 hunt.1202.critical_self: "\n\nPomalu bestii obklíčíme se vztyčenými kopími, ale než ukončíme trápení [activity.Custom('GetAnimalSoundParticiple')] zvířete, [injury_target.GetFirstName] utrpí strašlivý zásah [activity.Custom('GetAnimalStrike')]!"
 hunt.1202.critical: "\n\nLovci pomalu bestii obklíčí se vztyčenými kopími, ale než ukončí trápení [activity.Custom('GetAnimalSoundParticiple')] zvířete, [injury_target.GetFirstName] utrpí strašlivý zásah [activity.Custom('GetAnimalStrike')]!"
 hunt.1202.a.self: "Na, bestie!"
 hunt.1202.a: "Pěkný úlovek!"
 hunt.1202.b.self: "#EMP Argh!#! Zatracená potvora..."
 hunt.1202.b: "Rychle, [injury_target.GetFirstNameNoTooltip] potřebuje pomoc!"
 hunt.1202.c: "Tragédie..."
 hunt.2000.t: "[Select_CString(dog_salesman.IsFemale,'Obchodnice','Obchodník')] se psy"
 hunt.2000.opening_master: "[m_hunt.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], mi přivádí [Select_CString(dog_salesman.IsFemale,'obchodnici','obchodníka')], [Select_CString(dog_salesman.IsFemale,'která tvrdí, že prodává prvotřídní lovecké psy','který tvrdí, že prodává prvotřídní lovecké psy')].\n\n"
 hunt.2000.opening_hunter: "[m_hunt.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', m_hunt)], se vášnivě věnuje lovu a přivádí mi [Select_CString(dog_salesman.IsFemale,'obchodnici s prvotřídními loveckými psy','obchodníka s prvotřídními loveckými psy')].\n\n"
 hunt.2000.opening: "Do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] přichází [Select_CString(dog_salesman.IsFemale,'obchodnice s prvotřídními loveckými psy','obchodník s prvotřídními loveckými psy')] a očividně doufá, že zde najde nového zákazníka.\n\n"
 hunt.2000.desc: "„Prodávám jen ty nejlepší psy, již vycvičené a připravené bez potíží se přidat k jakékoli lovecké družině. Nikde v [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip] nenajdete lepší, [ROOT.Char.GetTitleAsNameNoTooltip]!“\n\nPřede mnou sedí v klidu řada psů různých velikostí a staveb těla, všichni na vodítkách a připraveni k mé prohlídce."
 hunt.2000.a: "Dobrý stopař má cenu zlata."
 hunt.2000.b: "Tenhle by dokázal skolit kance úplně sám!"
 hunt.2000.b.tt: "Nebudeš dostávat události [Concept('hunt_sighting_no_prefix','zpozorování')|E], dokud neuspořádáš [GetActivityType('activity_hunt').GetName]"
 hunt.2000.c: "Působivé. [dog_salesman.GetFirstNameNoTooltip], nevezmeš správu mých psinců?"
 hunt.2000.d: "Další psy nepotřebuji."
 hunt.2001.t: "[Select_CString(falcon_salesman.IsFemale,'Obchodnice','Obchodník')] s dravci"
 hunt.2001.opening_master: "[m_hunt.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], mi přivádí [Select_CString(falcon_salesman.IsFemale,'obchodnici','obchodníka')], [Select_CString(falcon_salesman.IsFemale,'která tvrdí, že prodává vycvičené lovecké dravce','který tvrdí, že prodává vycvičené lovecké dravce')].\n\n"
 hunt.2001.opening_hunter: "[m_hunt.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', m_hunt)], se vášnivě věnuje lovu a přivádí mi [Select_CString(falcon_salesman.IsFemale,'obchodnici s vycvičenými loveckými dravci','obchodníka s vycvičenými loveckými dravci')].\n\n"
 hunt.2001.opening: "Do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] přichází [Select_CString(falcon_salesman.IsFemale,'obchodnice s vycvičenými loveckými dravci','obchodník s vycvičenými loveckými dravci')] a očividně doufá, že zde najde nového zákazníka.\n\n"
 hunt.2001.desc: "„Tohle jsou ti nejlepší ptáci. Odchoval[Select_CString(falcon_salesman.IsFemale,'a jsem je',' jsem je')] od mláďat vlastníma rukama a nezklamou vás, [ROOT.Char.GetTitleAsNameNoTooltip]!“\n\nPřede mnou klidně sedí na bidle rozmanití jestřábi a sokoli různých velikostí."
 hunt.2001.a: "Tohle je vskutku nádherný kus!"
 hunt.2001.a.flavor: "Toho beru!"
 hunt.2001.c: "Konečně, [falcon_salesman.GetFirstNameNoTooltip]! Někdo, kdo se postará o mou sokolnici!"
 hunt.2001.d: "Velmi dobré, ale nemám zájem..."
 hunt.2500.t: "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalPlural')|U] v [sighting_province.GetNameNoTooltip]"
 hunt.2500.opening_master: "[sighting_character.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], mi přináší zprávy o zvěři spatřené v mém panství.\n\n"
 hunt.2500.opening_hunter: "[sighting_character.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sighting_character)], známý[Select_CString(sighting_character.IsFemale,'á svou zálibou v lovu',' svou zálibou v lovu')], mi přináší zvěsti o zvěři spatřené v mém panství.\n\n"
 hunt.2500.opening_fallback: "Na širých cestách [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip] člověk zaslechne všelijaké zvěsti a dnes mi jeden obzvlášť hovorný lovec nedá pokoj.\n\n"
 hunt.2500.opening: "[sighting_character.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sighting_character)], mi nadšeně přináší zprávy o zvěři spatřené v mém panství.\n\n"
 hunt.2500.desc: "„Z [sighting_county.GetName] přichází spousta zpráv. Prý jsou tam výborné vyhlídky na lov a po [sighting_province.Custom('GetTerrainTypePlural')] se potuluje nejeden [sighting_county.Custom('GetAnimalType')] hodný lovu!“"
 hunt.2500.a: "Zajímavé..."
 hunt.2500.b: "S tím mě neobtěžuj."
 hunt.2500.c: "Dobrý lovec by se mi hodil."
 hunt.2510.t: "[sighting_county.Custom('GetLegendaryColor')|U] [sighting_county.Custom('GetAnimalType')|U]"
 hunt.2510.opening_master: "[sighting_character.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], vstoupí do mých komnat plný[Select_CString(sighting_character.IsFemale,'á nadšení',' nadšení')].\n\n"
 hunt.2510.opening_hunter: "[sighting_character.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sighting_character)], známý[Select_CString(sighting_character.IsFemale,'á svou zálibou v lovu',' svou zálibou v lovu')], vstoupí do mých komnat plný[Select_CString(sighting_character.IsFemale,'á nadšení',' nadšení')].\n\n"
 hunt.2510.opening: "[sighting_character.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sighting_character)], vstoupí do mých komnat plný[Select_CString(sighting_character.IsFemale,'á nadšení',' nadšení')].\n\n"
 hunt.2510.desc: "„Od hajných z [sighting_county.GetNameNoTier] ke mně doléhají podivné zprávy. Prý zahlédli [sighting_county.Custom('GetAnimalType')] s"
 hunt.2510.desc.knight_errant: "„Od hajných z [sighting_county.GetName] ke mně doléhají podivné zprávy. Prý zahlédli [sighting_county.Custom('GetAnimalType')] s"
 hunt.2510.story: "„Hajní z [sighting_county.GetNameNoTier] poslali přesvědčivé zprávy. Zdá se, že tam byl spatřen váš [sighting_county.Custom('GetAnimalType')], bestie s"
 hunt.2510.black: "černou srstí jako uhel.“"
 hunt.2510.white: "sněhobílou srstí.“"
 hunt.2510.closing: "\n\n„Prý se potuluje po [sighting_province.Custom('GetTerrainTypePlural')], ale nikomu se k ní zatím nepodařilo přiblížit. O takových bestiích skutečně vyprávějí legendy...“"
 hunt.2510.knight_errant_closing: "\n\n„Zkrotit ji může jen tak proslulý $knight_culture_player_no_tooltip$, jako jste vy, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 hunt.2510.a: "#EMP [sighting_county.Custom('GetLegendaryColor')|U]#!, říkáš?"
 hunt.2510.a.existing: "Jednou ho #EMP najdu#!!"
 hunt.2510.b: "Neobtěžuj mě těmito dětskými výmysly."
 hunt.2510.c: "Přesuňte tábor do [sighting_county.GetNameNoTierNoTooltip] – okamžitě."
 hunt.2520.t: "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalAdjective')|U] [sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalType')|U] z [sighting_county.GetNameNoTierNoTooltip]"
 hunt.2520.desc: "„Z [sighting_county.GetNameNoTier] přichází spousta zpráv. Prý tamní vesnice terorizuje odporný [sighting_county.Custom('GetAnimalType')], který odnáší dobytek a pak mizí v [sighting_province.Custom('GetTerrainTypePlural')]!“"
 hunt.2530.t: "[sighting_province.GetTitle.GetDeJureLiege.Custom('GetAnimalPlural')|U] z [sighting_county.GetNameNoTierNoTooltip]"
 hunt.2530.opening_master: "Můj vrchní sokolník [sighting_character.GetTitledFirstName] vstoupí do mých komnat plný[Select_CString(sighting_character.IsFemale,'á nadšení',' nadšení')].\n\n"
 hunt.2530.opening_falconer: "[sighting_character.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', sighting_character)], známý[Select_CString(sighting_character.IsFemale,'á svou zálibou v sokolnictví',' svou zálibou v sokolnictví')], vstoupí do mých komnat plný[Select_CString(sighting_character.IsFemale,'á nadšení',' nadšení')].\n\n"
 hunt.2530.desc: "„Z [sighting_county.GetNameNoTier] přichází spousta zpráv. Prý jsou tam výborné vyhlídky na lov a po [sighting_province.Custom('GetTerrainTypePlural')] se potuluje nejeden [sighting_county.Custom('GetAnimalType')] hodný lovu!“"
 hunt.2540.t: "Odtud tam"
 hunt.2540.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], vaši správci lovu hlásí, že početní [sighting_county.Custom('GetAnimalPlural')] z [old_sighting_county.GetBaseNameNoTier] zřejmě opustili tamní kraj a přesunuli se do [sighting_county.GetName]!“"
 hunt.2540.legendary: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], vaši správci lovu hlásí, že [sighting_county.Custom('GetLegendaryColor')] [sighting_county.Custom('GetAnimalType')] z [old_sighting_county.GetBaseNameNoTier] na čas zmizel, než byl spatřen v nedalekém [sighting_county.GetBaseNameNoTier]!"
 hunt.2540.closing: "\n\n„Možná byste měl[Select_CString(ROOT.Char.IsFemale,'a uspořádat',' uspořádat')] lov, než bude příliš pozdě.“"
 hunt.2540.white: "Prý v ranní mlze září jako božské světlo...“"
 hunt.2540.black: "Prý se zjevuje jako posel večera, černá prázdnota v krajině...“"
 hunt.2540.a: "Mohou utíkat, ale neschovají se."
 hunt.2540.a.legendary: "Snaží se mě zmást!"
 hunt.2540.b: "Tyhle zprávy už mě unavují, [sighting_character.GetFirstNameNoTooltip]..."
 hunt.3020.t: "Lstivá zvěř"
 hunt.3020.t.deer: "Ani ponětí"
 hunt.3020.opening: "Stejně jako každá zvěř má i mazaný [activity.Custom('GetAnimalType')] mnoho triků, kliček a úskoků, kterými dokáže zmást i zkušené lovce.\n\n"
 hunt.3020.doubling: "mazaný [activity.Custom('GetAnimalType')] se vrací sem a tam po vlastní stopě a kličkuje, aby nás zmátl a setřásl."
 hunt.3020.beating: "[activity.Custom('GetAnimalMale')] pobíhá proti proudu i po proudu potoků v [host.GetCurrentLocation.Custom('GetTerrainType')] a snaží se zahladit svůj pach."
 hunt.3020.squatting: "[activity.Custom('GetAnimalMale')] nehybně postává v [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] a bez jediného zaváhání nás nechává projít kolem, dokonce přímo pod nosy psů"
 hunt.3020.rusing: "[activity.Custom('GetAnimalMale')] střídavě kličkuje sem a tam v divokých vzorcích, aby zmátl svou pachovou stopu a znemožnil nám jej sledovat"
 hunt.3020.desc_courtier: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', hunt_participant)], zastaví družinu:"
 hunt.3020.desc_fallback: "Mí [ROOT.Char.Custom('GetGameKeepers')] se vpředu zastaví:"
 hunt.3020.desc: "Stopy se začínají plést. Mazaný [activity.Custom('GetAnimalType')] se vracel sem a tam po vlastní stopě, aby nás zmátl."
 hunt.3020.closing: "\n\nNikdo se nedokáže shodnout, kudy pokračovat, a každým okamžikem váhání se naše kořist vzdaluje."
 hunt.3020.a: "Trpělivost, tohle by mělo jít snadno rozluštit."
 hunt.3020.a.perfect: "Rychle znovu najdeš stopu"
 hunt.3020.a.success: "Brzy znovu najdeš stopu"
 hunt.3020.a.failure: "Myslíš si, že jsi znovu našel stopu"
 hunt.3020.b: "Aha, o tomhle úskoku už jsem slyšel[Select_CString(ROOT.Char.IsFemale,'a','')]."
 hunt.3020.b.success: "Tvá rada se vyplatí"
 hunt.3020.b.failure: "Tvá rada je k ničemu"
 hunt.3020.c: "V tomhle věřím [hunt_participant.GetFirstNameNoTooltip]."
 hunt.3020.c.perfect: "[hunt_participant.GetFirstNameNoTooltip] rychle znovu najde stopu"
 hunt.3020.c.success: "[hunt_participant.GetFirstNameNoTooltip] brzy znovu najde stopu"
 hunt.3020.c.failure: "[hunt_participant.GetFirstNameNoTooltip] nás zavede špatným směrem"
 hunt.3020.d: "Být na jeho místě, vydal[Select_CString(ROOT.Char.IsFemale,'a','')] bych se tudy..."
 hunt.3020.e: "Tudy. Ne! Tamtudy!"
 hunt.3020.e.success: "Vydáš se správným směrem"
 hunt.3020.e.failure: "Vydáš se špatným směrem"
 hunt.3020.f: "Co si myslí místní hajný?"
 hunt.3020.f.flavor: "#EMP Poraďme se s odborníkem...#!"
 hunt.4001.t: "Výstřel"
 hunt.4001.opening: "Na tom, jak [activity.Custom('GetAnimalType')] hledí přes krajinu, je cosi majestátního. Ukrytý[Select_CString(ROOT.Char.IsFemale,'á','')] v [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] pozvednu luk.\n\n"
 hunt.4001.desc_1: "Mlčky pohlédnu na [hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', hunt_participant)], [Select_CString(hunt_participant.IsFemale,'která se krčí','který se krčí')] v [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')], a náš pohled se střetne."
 hunt.4001.desc_2: "Pečlivě odhaduji vzdálenost k [activity.Custom('GetAnimalType')] a oštěp mám dokonale vyvážený v ruce...\n\nVedle mě se krčí [hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', hunt_participant)], a svírá vlastní kopí."
 hunt.4001.desc_3: "Nádech... zamířit..."
 hunt.4001.a: "#EMP Ne! Je můj!#!"
 hunt.4001.a.kill: "Skolíš [activity.Custom('GetAnimalType')]"
 hunt.4001.a.stolen: "[hunt_participant.GetFirstNameNoTooltip] skolí [activity.Custom('GetAnimalType')]"
 hunt.4001.a.both: "Vyplašíte [activity.Custom('GetAnimalType')]"
 hunt.4001.b: "Ať je tvá rána přesná, [hunt_participant.GetFirstNameNoTooltip]."
 hunt.4001.c: "Teď, [hunt_participant.GetFirstNameNoTooltip], než si nás [activity.Custom('GetAnimalType')] všimne!"
 hunt.4001.c.tt: "Kdybych [Select_CString(ROOT.Char.IsFemale,'šlápla','šlápl')] na tuhle větvičku, určitě by to upozornilo [activity.Custom('GetAnimalType')]..."
 hunt.4001.d: "Sleduj."
 hunt.4002.t: "Zvěsti"
 hunt.4002.desc: "Hluk ostatních postupně utichá, zatímco se společně s [secret_sharer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', secret_sharer)], plížíme k [activity.Custom('GetAnimalType')].\n\nUž jsme téměř na dosah, když [secret_sharer.GetFirstNameNoTooltip] zašeptá: „Teď, když jsme konečně sami, ti musím něco říct – o [secret_owner.GetTitledFirstName]...“"
 hunt.4002.a: "Promluvíme si později, [ROOT.Char.Custom2('RelationToMe', secret_sharer)]!"
 hunt.4002.a.flavor: "Ten [activity.Custom('GetAnimalType')] je můj!"
 hunt.4002.b: "Cože? Povídej..."
 hunt.4002.b.tt: "[activity.Custom('GetAnimalType')|U] uteče"
 hunt.4002.b.reveal: "Dozvíš se tajemství, které skrývá [secret_owner.GetFirstNameNoTooltip]"
 hunt.4003.t: "Zakázaná kořist"
 hunt.4003.desc: "Pytláci? Tady v [host.GetCurrentLocation.Custom('GetTerrainType')], přímo na území, jemuž vládne [land_owner.GetTitleTierName]? Když k nim přijedu se strážemi, semknou se k sobě a marně se snaží ukrýt mrtvého [host.Custom('GetRegionalDeerType')] za svými zády.\n\n„My jsme to neudělali! Prosíme, smilujte se, slavný [ROOT.Char.GetTitleAsNameNoTooltip]!“ Jejich čepele a luky však mluví jinak."
 hunt.4003.adventurer: "Přidejte se k mému táboru. [land_owner.GetTitleTierName] vás nikdy nenajde."
 hunt.4003.a: "Budou viset a jejich rodiny zaplatí."
 hunt.4003.b: "„Vypadáte jako znamenití lučištníci...“"
 hunt.4003.c: "Zvíře si nechám a za jejich životy zaplatí pokutu."
 hunt.4003.c.tt_success: "Místní úředníci ustoupí"
 hunt.4003.c.tt_failure: "Pobouření lidu"
 hunt.4003.d: "„Co je mi po zvěři [land_owner.GetTitledFirstNameNoTooltip]?“"
 hunt.4003.d.own: "Vypadněte z mého [host.GetCurrentLocation.Custom('GetTerrainType')]!"
 hunt.4003.d.vassal: "Vypadněte z [host.GetCurrentLocation.Custom('GetTerrainType')], který náleží [land_owner.GetTitledFirstNameNoTooltip]!"
 hunt.4003.d.rival: "Vezměte si od [land_owner.GetTitledFirstNameNoTooltip], kolik chcete."
 hunt.4003.e: "Konečně schopný lovec!"
 hunt.4004.t: "Skolení bestie"
 hunt.4004.desc: "Člověk by si pomyslel, že je to tvor z bájí, snad bůh ukrytý ve zvířecí podobě. Byl to největší [activity.Custom('GetAnimalType')], jakého jsem kdy spatřil[Select_CString(ROOT.Char.IsFemale,'a','')].\n\nI poté, co byla bestie zraněna, trvala štvanice půl dne.\n\nDokonce i teď, když přede mnou leží mrtvá, je to impozantní pohled."
 hunt.4004.credit_receiver: "[credit_taker.GetTitledFirstName] hledí na úlovek se stejným úžasem. „Nikdy jsem nic takového neviděl[Select_CString(credit_taker.IsFemale,'a','')], [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 hunt.4004.a: "Jeho hlava bude v mé síni vypadat nádherně!"
 hunt.4004.b: "Bude z něj trofej pro [trophy_recipient.GetTitledFirstNameNoTooltip]."
 hunt.4004.c: "Bude z něj nádherný kožich!"
 hunt.4004.c.tt: "Ne, rozhodně #EMP NENÍ#! křiklavý!"
 hunt.4004.every_arrogant_vassal: "Každý arogantní vazal"
 hunt.4004.every_restrained_vassal: "Každý vazal s velmi omezenými pravomocemi"
 hunt.4004.every_other_vassal: "Vazalové, kteří nejsou arogantní ani výrazně omezovaní"
 hunt.4004.d: "Myslím, že zásluhy za tohle si zaslouží [credit_taker.GetTitledFirstNameNoTooltip]."
 hunt.4004.e: "Sníme ho tady a teď!"
 hunt.4004.f: "Z jeho lebky bude skvělá koruna."
 hunt.4005.t: "Skolení bestie"
 hunt.4005.a: "Za tohohle dostanu pěknou sumu."
 hunt.4005.b: "Nechám z něj vyrobit nádhernou trofej pro [trophy_recipient.GetTitledFirstNameNoTooltip]."
 hunt.4005.c: "Vycpeme ho a pošleme [ROOT.Char.GetFaith.ReligiousHeadName]!"
 hunt.4006.t: "Sběrači"
 hunt.4006.desc: "[host.GetCurrentLocation.Custom('GetTerrainTree')|U] je skutečně „pláštěm chudých“, ale když [activity.Custom('GetAnimalType')] v panice prchá před venkovany sbírajícími potravu, začíná mi docházet trpělivost.\n\nCopak dnes v [host.GetCurrentLocation.GetNameNoTooltip] opravdu není nic lepšího na práci než sbírat kořínky a houby?!"
 hunt.4006.adventurer: "Sbírat kořínky a houby... to vlastně není špatný nápad."
 hunt.4006.a: "Vyžeňte tu chátru z #EMP mých#! lovišť!"
 hunt.4006.b: "Přišli jsme sem lovit, ne?"
 hunt.4006.special_interest: "Kvůli neobvyklým zájmům [county_owner.GetFirstNameNoTooltip]:"
 hunt.4006.c: "Ale ano, tahle kořist mi poslouží docela dobře..."
 hunt.4006.d: "Štědrý příspěvek je snad udrží dost dlouho stranou."
 hunt.4006.e: "Předpokládám, že na tohle #EMP mají#! odedávna právo..."
 hunt.4007.t: "Řádící [host.Custom('GetAnimalType')|U]"
 hunt.4007.desc_befriend: "Pofukuje mírný vánek a společně s [similar_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', similar_participant)], podřimujeme na tiché mýtině, když to uslyšíme."
 hunt.4007.desc_lazy: "Pofukuje mírný vánek a společně s [similar_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', similar_participant)], podřimujeme na tiché mýtině, když to uslyšíme."
 hunt.4007.desc_lustful: "V loveckém oděvu vypadá [similar_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', similar_participant)], opravdu působivě a já proklínám vyrušení, které odvede mou pozornost jinam."
 hunt.4007.desc_fallback: "Když společně s [similar_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', similar_participant)], vystoupáme na vrchol kopce, uslyšíme to."
 hunt.4007.desc_ending: "\n\nPraskání větviček, šustění větví a vyděšený křik ptáků ohlašují příchod zuřivého [host.Custom('GetAnimalType')|l], který míří přímo na nás!\n\n[similar_participant.GetFirstNameNoTooltip] zalapá po dechu. „Podívejte se, jak obrovské jsou ty #EMP [host.Custom('GetAnimalDanger')]#!!“"
 hunt.4007.a: "Tady jeho cesta skončí. Mou rukou."
 hunt.4007.a.non_martial: "Rychle, [similar_participant.GetFirstNameNoTooltip]! Schovej se za mě!"
 hunt.4007.a.non_martial_self: "Dej mi svůj nůž! Zvládnu to sám[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 hunt.4007.a.success: "Bestii zabiju"
 hunt.4007.a.failure: "Utrpím zranění"
 hunt.4007.a.critical_failure: "Zemřu"
 hunt.4007.b: "[similar_participant.GetFirstNameNoTooltip], udělej něco!"
 hunt.4007.b.non_martial: "Pomoc! Někdo!"
 hunt.4007.b.success: "[THIS.Char.GetTitledFirstNameNoTooltip] bestii skolí"
 hunt.4007.b.failure: "[THIS.Char.GetTitledFirstNameNoTooltip] utrpí zranění"
 hunt.4007.b.critical_failure: "[THIS.Char.GetTitledFirstNameNoTooltip] zemře"
 hunt.4007.c: "Není o nic těžší ho zvládnout než odmítnutého dvořana!"
 hunt.4007.d: "[bodyguard.GetFirstNameNoTooltip]! Ke mně!"
 hunt.4007.e: "#EMP TÁHNI, ODPORNÁ BESTIE!#!"
 hunt.4007.f: "#EMP Utíkej!#!"
 hunt.4900.t: "Řádící [activity.Custom('GetAnimalTypeKill')|U]"
 hunt.4900.desc: "Mohutná bestie se zastaví těsně před námi, divoce [activity.Custom('GetAnimalSoundParticipleKill')] a [activity.Custom('GetAnimalStrikeParticipleKill')]."
 hunt.4900.hunter: "\n\nTasím nůž od pasu a postavím se mezi [activity.Custom('GetAnimalTypeKill')] a [similar_participant.GetFirstName] právě ve chvíli, kdy zvíře náhle [activity.Custom('GetAnimalChargePresentKill')] vpřed.\n\nMá čepel najde jeho srdce,"
 hunt.4900.hunter_wound: "ale ještě předtím mě srazí stranou a já jen těsně uniknu jeho [activity.Custom('GetAnimalDangerKill')]..."
 hunt.4900.hunter_dead: "ale když sklopím zrak, zjistím, že jeho [activity.Custom('GetAnimalDangerKill')] našly mě.\n\nSvětlo pohasíná, zatímco ležím ve změti srsti, teplého masa a krve a [similar_participant.GetFirstNameNoTooltip] volá mé jméno..."
 hunt.4900.hunter_kill: "jeho [activity.Custom('GetAnimalDangerKill')] mě jen těsně minou a bestie se zhroutí k zemi..."
 hunt.4900.assist: "\n\n[similar_participant.GetFirstName] tasí nůž od pasu a vrhne se mezi mě a [activity.Custom('GetAnimalTypeKill')]. „Ustupte, [ROOT.Char.GetTitleAsNameNoTooltip]!“ vykřikne právě ve chvíli, kdy zvíře náhle [activity.Custom('GetAnimalChargePresentKill')] vpřed.\n\nČas jako by se téměř zastavil, když [similar_participant.GetFirstNameNoTooltip] zachytí rozmazaný výpad [activity.Custom('GetAnimalFeatureKill')].\n\nKdyž se prach usadí, [activity.Custom('GetAnimalTypeKill')] leží mrtvý,"
 hunt.4900.assist_wound: "ale [similar_participant.GetFirstNameNoTooltip] je očividně [Select_CString(similar_participant.IsFemale,'zraněná','zraněný')]..."
 hunt.4900.assist_dead: "ale vedle něj leží i [similar_participant.GetFirstNameNoTooltip]..."
 hunt.4900.assist_kill: "a [similar_participant.GetFirstNameNoTooltip] nad ním vítězoslavně stojí a otírá si čepel..."
 hunt.4900.befriend: "\n\nKlidně natáhnu ruku. [activity.Custom('GetAnimalTypeKill')|U] se uvolní, zmateně zaváhá a nakonec se obezřetně zastaví těsně mimo dosah, zatímco podezíravě očichává mé prsty."
 hunt.4900.befriend_success: "\n\nZdá se být spokojený, široce zívne a pak si lehne k mým nohám, jako by se chystal spát."
 hunt.4900.befriend_wound: "\n\nBez varování se znovu vrhne vpřed, tvrdě mě srazí k zemi a pak zmizí z dohledu."
 hunt.4900.befriend_dead: "\n\nBestie náhle ztuhne a skoro to vypadá, jako by se zašklebila. Zůstanu nehybně stát a zavřu oči, když se na mě vrhne a strašlivě [activity.Custom('GetAnimalSoundParticipleKill')]."
 hunt.4900.bodyguard: "\n\nMůj tělesný strážce [bodyguard.GetFirstName] se vrhne do akce s taseným mečem a druhou rukou mě pobízí, abych se [Select_CString(bodyguard.IsFemale,'schoval za ni','schoval za něj')]. „Ustupte, [ROOT.Char.Custom('FormOfAddressForLiege')]!“\n\nZvíře se vrhne vpřed,"
 hunt.4900.bodyguard_wound: "a já se sotva dokážu dívat, jak bestie [bodyguard.GetFirstNameNoTooltip] rozsápe, přestože ji [bodyguard.GetFirstNameNoTooltip] nakonec skolí..."
 hunt.4900.bodyguard_dead: "a já se sotva dokážu dívat, jak bestie odhodí [bodyguard.GetFirstNameNoTooltip] jako hadrovou panenku, přestože ji strážce zraní. Raněné zvíře zmizí z dohledu a [bodyguard.GetFirstNameNoTooltip] se zhroutí do [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')]!"
 hunt.4900.bodyguard_saved: "a já se sotva dokážu dívat, jak se zvíře samo nabodne na čepel, kterou [bodyguard.GetFirstNameNoTooltip] obratně nastaví!"
 hunt.4900.scare: "\n\nRychle si to rozmyslí a začne ustupovat, zatímco já pomalu kráčím vpřed, mávám rukama a řvu na něj. Nakonec se otočí a zmizí z dohledu."
 hunt.4900.flee: "\n\nOtočím se a běžím, co mi síly stačí, zatímco těsně za sebou slyším přerývaný dech [similar_participant.GetFirstNameNoTooltip].\n\nBrzy doběhneme k ostatním a mezi lapáním po dechu ze sebe dostaneme jen „#EMP [ROOT.Char.Custom('GetAnimalType')]#!“ a „#EMP [ROOT.Char.Custom('GetAnimalDanger')]#!“ Bestie není nikde v dohledu."
 hunt.4900.a.hunter: "#EMP Takhle#! se zabíjí [ROOT.Char.Custom('GetAnimalType')]."
 hunt.4900.a.dead: "#EMP [portrait.GetFirstNameNoTooltip]...#! [Select_CString(portrait.IsFemale,'Zemřela jsi statečně','Zemřel jsi statečně')]..."
 hunt.4900.a.scare: "A už se nevracej!"
 hunt.4900.a.flee: "Ty jsi tam #EMP nebyl#!! Bylo to #EMP OBROVSKÉ#!!"
 hunt.4900.b: "Něco si z toho nechám na památku."
 hunt.4900.c: "#weak Mazaná... bestie...#!"
 hunt.4900.d: "Dost, jedeme domů!"
 hunt.4008.t: "Zbloudilý dědic"
 hunt.4008.t_2: "Upřímná chyba"
 hunt.4008.desc: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], se vydá před družinu a sám[Select_CString(hunt_participant.IsFemale,'a','')] pronásleduje [activity.Custom('GetAnimalType')]. Když ho doženu, spatřím, jak stojí nad [Select_CString(peasant.IsFemale,'venkovankou','sedlákem')] a vytahuje šíp z hrudi nebohé oběti.\n\nJakmile mě [hunt_participant.GetFirstNameNoTooltip] spatří, schová šíp za záda. „[ROOT.Char.GetTitleAsNameNoTooltip]! Já... ono...“"
 hunt.4008.animal: "„t-to [activity.Custom('GetAnimalMale')]! Přísahám!“\n\n"
 hunt.4008.fallback: "„n-nebyla to moje vina! Přísahám!“\n\n"
 hunt.4008.closing: "Zbytek družiny nás brzy dožene a bude chtít vysvětlení."
 hunt.4008.a: "[hunt_participant.GetFirstNameNoTooltip] se [Select_CString(hunt_participant.IsFemale,'statečně snažila','statečně snažil')] zachránit [peasant.GetFirstNameNoTooltip], viděl[Select_CString(ROOT.Char.IsFemale,'a jsem to',' jsem to')]!"
 hunt.4008.a.success: "Všichni ti uvěří"
 hunt.4008.a.failure: "Lidé té lži neuvěří"
 hunt.4008.b: "Rychle, pomoz mi ukrýt tělo!"
 hunt.4008.b.failure_tt: "[Concept('secret','tajemství')|E] [secret.GetName] postavy [hunt_participant.GetTitledFirstName] je odhaleno"
 hunt.4008.b.success: "Podaří se nám ukrýt tělo"
 hunt.4008.b.failure: "Tělo je nalezeno"
 hunt.4008.b.success_tt: "Tělo zůstane ukryto"
 hunt.4008.c: "Za tohle se #EMP musíš#! zodpovídat, [hunt_participant.GetFirstNameNoTooltip]!"
 hunt.4008.c.flavor: "I když to byl jen venkovan..."
 hunt.4008.d: "Škoda, že ta „bestie“ dostala #EMP i tebe#!..."
 hunt.4009.t: "Lovná zvěř"
 hunt.4009.desc: "#EMP Křup—!#!\nKdyž [activity.Custom('GetAnimalAdjective')] [activity.Custom('GetAnimalType')], ke kterému se právě přibližuji, zmizí v [host.GetCurrentLocation.Custom('GetTerrainType')], otočím se za tím zvukem.\n\nZa mnou stojí [schemer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', schemer)], s taseným nožem a vražedným odhodláním v očích."
 hunt.4009.a: "Proti mně nemáš šanci!"
 hunt.4009.a.success: "Unikneš [schemer.GetTitledFirstNameNoTooltip]"
 hunt.4009.a.failure: "Jsi zraněn[Select_CString(ROOT.Char.IsFemale,'a','')] a unikneš [schemer.GetTitledFirstNameNoTooltip]"
 hunt.4009.a.critical_failure: "[schemer.GetTitledFirstNameNoTooltip] tě porazí"
 hunt.4009.b: "Pomoc! Pomoc! [saving_participant.GetFirstNameNoTooltip]!"
 hunt.4009.b.critical_success: "[saving_participant.GetTitledFirstNameNoTooltip] zraní [schemer.GetTitledFirstNameNoTooltip] a společně uniknete"
 hunt.4009.b.failure: "[saving_participant.GetTitledFirstNameNoTooltip] je zraněn[Select_CString(saving_participant.IsFemale,'a','')], ale společně uniknete [schemer.GetTitledFirstNameNoTooltip]"
 hunt.4009.b.critial_failure: "[saving_participant.GetTitledFirstNameNoTooltip] tě nedokáže ubránit"
 hunt.4009.c: "Kdybych se tak dokázal[Select_CString(ROOT.Char.IsFemale,'a dostat',' dostat')] zpátky do tábora!"
 hunt.4009.c.failure: "[schemer.GetTitledFirstNameNoTooltip] tě dostihne"
 hunt.4010.desc: "#EMP Křup—!#!\nKdyž [activity.Custom('GetAnimalAdjective')] [activity.Custom('GetAnimalType')], ke kterému se společně s [targeted_participant.GetTitledFirstName] blížíme, zmizí v [host.GetCurrentLocation.Custom('GetTerrainType')], oba se otočíme za tím zvukem.\n\nZa námi stojí [schemer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', schemer)], s taseným nožem namířeným na [targeted_participant.GetFirstName]."
 hunt.4010.a: "Neboj se, [targeted_participant.GetFirstNameNoTooltip]!"
 hunt.4010.a.critical_success: "Zraníš [schemer.GetFirstNameNoTooltip] a odrazíš útok"
 hunt.4010.a.failure: "Utrpíš zranění, ale oba uniknete"
 hunt.4010.a.critical_failure: "Nedokážeš [targeted_participant.GetFirstNameNoTooltip] ubránit"
 hunt.4010.b: "Hodně štěstí, [targeted_participant.GetFirstNameNoTooltip]."
 hunt.4010.b.critical_success: "[targeted_participant.GetFirstNameNoTooltip] zraní [schemer.GetFirstNameNoTooltip] a odrazí útok"
 hunt.4010.b.failure: "[targeted_participant.GetFirstNameNoTooltip] utrpí zranění, ale unikne"
 hunt.4010.b.critical_failure: "[schemer.GetFirstNameNoTooltip] porazí [targeted_participant.GetFirstNameNoTooltip] a zbaví se všech svědků"
 hunt.4010.failure.murder_secret_tooltip: "Dozvíš se tajemství vraždy"
 hunt.4010.c: "Pomoc! [schemer.GetFirstNameNoTooltip] napadl [targeted_participant.GetFirstNameNoTooltip]!"
 hunt.4010.d: "#EMP Nééé—!#!"
 hunt.4010.d.tt: "Tato možnost je dostupná díky tvé čestnosti"
 hunt.4010.d.flavor: "#EMP Vezmi si místo toho mě!#!"
 hunt.4011.t: "Chvíle o samotě"
 hunt.4011.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tamhle je [activity.Custom('GetAnimalType')]!“ [lover_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', lover_participant)], mi pokyne, ať zamířím do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]. Jakmile se ukryjeme v [host.GetCurrentLocation.Custom('GetTerrainType')], otočí se ke mně a přetáhne mi [ROOT.Char.Custom('GetUpperClothingArticle')] přes hlavu.\n\n„Konečně chvíle o samotě, můj [ROOT.Char.Custom('LoverPetName')]!“"
 hunt.4011.a: "Ach, [lover_participant.GetFirstNameNoTooltip]!"
 hunt.4011.a.tt: "Udělejme to jako v Bestiarum Vocabulum!"
 hunt.4011.b: "Ale co [activity.Custom('GetAnimalType')]...?"
 hunt.4012.t: "[host.Custom('GetLegendaryColor')|U] [host.Custom('GetAnimalType')|U]"
 hunt.4012.desc: "Jedeme před družinou, když [host.GetCurrentLocation.Custom('GetTerrainType')] náhle zcela ztichne.\n\nTicho je téměř hmatatelné, dokonce i klapot kopyt mého koně jako by se vytratil.\n\nPrávě když se chystám obrátit a vyhledat ostatní, zahlédnu před sebou něco rozmazaného jako ve snu – [host.Custom('GetAnimalType')|l]"
 hunt.4012.black: "černého jako uhel."
 hunt.4012.white: "bílého jako sníh."
 hunt.4012.a: "Jako něco z příběhů..."
 hunt.4012.a.tt: "#EMP Musím toho [host.Custom('GetAnimalType')] získat!#!"
 hunt.4012.a.sighting: "Ty zvěsti #EMP byly#! pravdivé...!"
 hunt.4012.b: "Je to jen [host.Custom('GetAnimalType')]."
 hunt.4013.desc: "Jako v transu sleduji stopy bestie do [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], zatímco nad světem visí téměř nepřirozené ticho.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip]! Tady jste!“ Náhlý výkřik mě vytrhne ze zamyšlení.\n\n"
 hunt.4013.guest: "[host.GetTitledFirstName] jako v transu sleduje stopy bestie do [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], zatímco nad světem visí téměř nepřirozené ticho.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip]! Tady jste!“ Náhlý výkřik přeruší podivné okouzlení.\n\n"
 hunt.4013.participant: "[hunt_participant.GetFirstName] a zbytek mé družiny mě konečně dostihnou. "
 hunt.4013.closing: "Když se ohlédnu, [activity.Custom('GetAnimalType')|l] je pryč."
 hunt.4013.a: "Unikl mi, #EMP tentokrát#!."
 hunt.4013.a.tt: "Každý rok, kdy ti bestie uniká, získáš [Concept('stress','stres')|E]"
 hunt.4013.a_modifier: "Obyvatelé [activity_place.GetNameNoTier] jsou znepokojeni"
 hunt.4013.b: "Jen jsem... prozkoumával[Select_CString(ROOT.Char.IsFemale,'okolí před námi','okolí před námi')]."
 hunt.4013.c: "Hlupáci! Už jsem ho skoro měl!"
 hunt.4013.d: "Nebudu na tuhle pošetilost ztrácet čas."
 hunt.4014.t: "Zrádný terén"
 hunt.4014.desc: "Řítíme se skrz [activity.GetCurrentPhase.GetLocation.Custom('GetProvinceFoliageDesc')] a už téměř doháníme vyčerpanou kořist. [activity.Custom('GetAnimalType')] pronásledujeme celé hodiny!\n\n"
 hunt.4014.fall: "Vedle mě náhle podklouzne kůň, na kterém jede [hunt_participant.GetTitledFirstName], a [hunt_participant.GetFirstNameNoTooltip] s výkřikem letí k zemi.\n\n"
 hunt.4014.branch: "[hunt_participant.GetTitledFirstName] se otočí, aby na mě zavolal, a vůbec si nevšimne nízko visící větve [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] přímo před sebou!\n\n"
 hunt.4014.cry: "Nedokážu se ovládnout a bezděčně vykřiknu: „[hunt_participant.GetFirstNameNoTooltip]!“\n\n"
 hunt.4014.dead_care: "Sesednu a spěchám k nehybnému tělu, ale mé nejhorší obavy se rychle potvrdí..."
 hunt.4014.dead: "[hunt_participant.GetTitledFirstName] leží zcela nehybně, tělo zkroucené v nepřirozené poloze, ale tvář působí podivně klidně."
 hunt.4014.wounded: "[hunt_participant.GetFirstNameNoTooltip] se svíjí bolestí, ale naštěstí nejde o smrtelné zranění."
 hunt.4014.fall_host: "Jediným varováním je nepatrné napětí v těle mého koně a vzápětí už letím vzduchem, zatímco se ke mně řítí zem."
 hunt.4014.branch_host: "Otočím se, abych něco zavolal na [hunt_participant.GetFirstName], ale v jeho tváři spatřím zděšení. Příliš pozdě pochopím proč. Přímo před očima mám mohutnou větev [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')]."
 hunt.4014.dead_host: "Náraz do země vůbec necítím. Čas jako by se zpomalil. Obloha nade mnou tmavne, kolem se míhají nezřetelné postavy a jejich tlumené výkřiky ke mně doléhají skrz zmatenou mlhu."
 hunt.4014.wounded_host: "\n\nProberu se v [activity.GetCurrentPhase.GetLocation.Custom('GetProvinceGroundDesc')], zhroucený[Select_CString(ROOT.Char.IsFemale,'na zemi',' na zemi')], zatímco mi tělem projíždí bolest."
 hunt.4014.dead_host_courtier: "Přede mnou vidím [hunt_participant.GetTitledFirstName]. Tvář má bílou jako duch a něco na mě bezhlesně volá. Pak si vzpomenu na koně..."
 hunt.4014.wounded_host_courtier: "„[Select_CString(host.IsFemale,'Má','Můj')] [host.GetTitleAsNameNoTooltip]! Jste zraněn[Select_CString(host.IsFemale,'á','')]?!“ vykřikne [hunt_participant.GetTitledFirstName] a seskočí z koně."
 hunt.4014.a: "Postarám se o [hunt_participant.GetFirstNameNoTooltip]."
 hunt.4014.a.physician: "Klid, vyznám se v lékařství!"
 hunt.4014.a.learning: "Vydrž, vím, co dělat!"
 hunt.4014.a.success: "Ránu se ti podaří ošetřit"
 hunt.4014.a.failure: "Ošetření pokazíš"
 hunt.4014.b: "[hunt_participant.GetFirstNameNoTooltip] potřebuje chvíli..."
 hunt.4014.b.physician: "Řekni mi, jak to ošetřit, [physician.GetFirstNameNoTooltip]."
 hunt.4014.c: "[physician.GetFirstNameNoTooltip]! #EMP Kde je [physician.GetFirstNameNoTooltip]?!#!"
 hunt.4014.c.host: "No tak, [physician.GetFirstNameNoTooltip]! Jen tam nestůj!"
 hunt.4014.c.success: "[physician.GetFirstNameNoTooltip] ránu ošetří"
 hunt.4014.c.failure: "[physician.GetFirstNameNoTooltip] ošetření pokazí"
 hunt.4014.d: "Musím pokračovat! [activity.Custom('GetAnimalType')|U] uniká!"
 hunt.4014.e: "Pro dnešek už toho bylo dost..."
 hunt.4014.f: "Jsem v po- *ach!* #EMP Jsem v pořádku!#! Uniká nám!"
 hunt.4014.f.flavor: "#EMP Rychle! Mého koně!#!"
 hunt.4014.g: "V-vezměte mě zpátky do tábora..."
 hunt.4014.g.flavor: "#EMP Musím si lehnout...#!"
 hunt.4014.h.physician: "#weak Kde je [physician.GetFirstNameNoTooltip]... P-pomoc...!#!"
 hunt.4014.h: "#weak T-t-t... [activity.Custom('GetAnimalType')]...!#!"
 hunt.4015.t: "Milenci"
 hunt.4015.desc: "Sledujeme kořist do [host.GetCurrentLocation.Custom('GetTerrainType')] a pomalu, ale jistě doháníme [activity.Custom('GetAnimalAdjective')] [activity.Custom('GetAnimalType')].\n\nNáhle se poleká a [activity.Custom('GetAnimalChargeParticiple')] jiným směrem. Když se vydám zjistit, co ji vyplašilo, sotva věřím vlastním očím – [lover_participant.GetTitledFirstName] a [second_lover_participant.GetTitledFirstName] leží propleteni na zemi ve vášnivém objetí!"
 hunt.4015.a: "Pomalu ustoupím... Nic jsem neviděl[Select_CString(ROOT.Char.IsFemale,'a','')]."
 hunt.4015.b: "„Tohle je ostuda! Okamžitě toho nechte!“"
 hunt.4015.c_4: "„[lover_participant.GetFirstNameNoTooltip]! [second_lover_participant.GetFirstNameNoTooltip]! A co #EMP já#!?“"
 hunt.4015.c_1: "„[lover_participant.GetFirstNameNoTooltip], tohle jsi přede mnou tajil[Select_CString(lover_participant.IsFemale,'a','')]!“"
 hunt.4015.c_2: "„[second_lover_participant.GetFirstNameNoTooltip], tohle jsi přede mnou tajil[Select_CString(second_lover_participant.IsFemale,'a','')]!“"
 hunt.4015.c_3: "„Ohoho, k téhle zábavě bych se klidně přidal[Select_CString(ROOT.Char.IsFemale,'a','')]!“"
 hunt.4015.d: "„[second_lover_participant.GetTitledFirstNameNoTooltip], jak jsi mohl[Select_CString(second_lover_participant.IsFemale,'a','')]?!“"
 hunt.4015.d_2: "„[lover_participant.GetTitledFirstNameNoTooltip], jak jsi mohl[Select_CString(lover_participant.IsFemale,'a','')]?!“"
 hunt.4015.e: "„Vstávejte, cítím, že bestie je nablízku!“"
 hunt.4016.t: "Trofej"
 hunt.4016.desc: "Museli jsme už dvakrát projet celý [ROOT.Char.Custom('TerrainType')] a stále nejsme o nic blíž k tomu, abychom [activity.Custom('GetAnimalType')] zahnali do kouta...\n\nVšichni očekávají, že se vrátím vítězně s trofejí, ale jak to tak vypadá, domů si přivezu jen ostudu."
 hunt.4016.a: "Na nejbližším trhu by mohli mít [activity.Custom('GetAnimalType')]..."
 hunt.4016.b.success: "Lidé mému podvodu uvěří"
 hunt.4016.b.failure: "Můj podvod je odhalen"
 hunt.4016.b.tt: "[activity.GetShortName] skončí úspěchem – svým způsobem"
 hunt.4016.c: "Tak hluboko neklesnu, raději se vrátím s prázdnou!"
 hunt.4017.desc: "Nechám svůj doprovod za sebou a pročesávám [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] ve snaze najít [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')], který mě pronásleduje v myšlenkách.\n\nNáhle je to, jako bych se ocitl[Select_CString(ROOT.Char.IsFemale,'a','')] pod vodou – zvuky ztichnou a světlo získá nadpozemský nádech. Tamhle!\n\nStojí přede mnou a [host.GetCurrentLocation.Custom('GetTerrainType')] kolem něj jako by zamrzl – jako by mi hleděl přímo do #EMP duše#!."
 hunt.4017.a: "Tohle je má chvíle!"
 hunt.4017.a.tt: "#EMP Ani se nepokouší utéct...#!"
 hunt.4018.desc: "Nad [host.GetCurrentLocation.Custom('GetTerrainType')] se náhle rozhostí naprosté ticho. Otočím se v sedle a spatřím ho jasně jako ve dne – [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')].\n\nNež stačím zavolat ostatní, zmizí v [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] jako přízrak..."
 hunt.4018.a: "Prohledejte okolí! #EMP Najděte toho [activity.Custom('GetAnimalType')]!#!"
 hunt.4018.a.tt: "#EMP Musí být někde tady! Někde...#!"
 hunt.4018.b: "Nechte toho. Je pryč..."
 hunt.4018.a.success: "Najdeš [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')]"
 hunt.4018.a.animal: "Najdeš jiné zvíře"
 hunt.4018.a.failure: "[activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')] unikne"
 hunt.4019.courtier: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ zasyčí [hunt_participant.GetFirstName], [ROOT.Char.Custom2('RelationToMe', hunt_participant)], a mávnutím mě přivolá k sobě, zatímco ukazuje přes [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]."
 hunt.4019.fallback: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ zasyčí správce lovu, mávnutím mě přivolá k sobě a ukáže přes [host.GetCurrentLocation.Custom('GetTerrainType')]."
 hunt.4019.desc: "\n\n„Tamhle! Vidíte [activity.Custom('GetAnimalType')]? Je to ten, kterého hledáte?“\n\nPřed námi stojí naprosto obyčejný [activity.Custom('GetAnimalType')], bez jediného chomáčku [activity.Custom('GetLegendaryColor')] srsti."
 hunt.4019.a: "...ano, dobrý postřeh."
 hunt.4019.a.tt: "Bude muset stačit... #EMP prozatím#!."
 hunt.4019.b: "Vypadá snad podle tebe #EMP [activity.Custom('GetLegendaryColor')]#!?!"
 hunt.5001.t: "Divoké květiny"
 hunt.5001.desc: "Je nádherný den na lov, a tedy i na pobyt venku. Když se zhluboka nadechnu čerstvého vzduchu divočiny, "
 hunt.5001.desc.witch: "zahlédnu hotový poklad darů matky přírody."
 hunt.5001.desc.religious: "v dálce zahlédnu něco, co může být jedině darem od [ROOT.Char.GetFaith.HealthGodName], nebo poctou, kterou mu vzdává sama příroda."
 hunt.5001.desc.ending: "\n\nTolik užitečných bylin a nádherných květin! Hodí se k léčení i k nekalým záměrům – jenže já jsem tu kvůli lovu! Kdybych začal[Select_CString(ROOT.Char.IsFemale,'a','')] sbírat [host.GetCurrentLocation.Custom('get_region_flower_type_plural')], mohlo by to vzbudit pozornost..."
 hunt.5001.a: "Musím zachovat zdání."
 hunt.5001.b: "Proč by mě mělo zajímat, co si myslí ostatní?"
 hunt.5001.c: "„Hej, co je tamhle?!“"
 hunt.5001.c.success: "[hunt_participant.GetTitledFirstNameNoTooltip] naletí na ten nejstarší trik"
 hunt.5001.d: "Na květiny zapomeňte, podívejte se na tyhle byliny!"
 hunt.5001.d.poisonous: "#EMP Tohle mi sesílá [ROOT.Char.GetFaith.DeathDeityName]...#!"
 hunt.5001.d.medicinal: "#EMP Tohle mi sesílá [ROOT.Char.GetFaith.HealthGodName]...#!"
 hunt.5002.opening_position: "[hunt_participant.GetFirstName], [hunt_participant.GetHeldCourtPositionsString], sesedne z koně a přikrčí se v [hunt_participant.GetCurrentLocation.Custom('GetProvinceGroundDesc')], kde si pozorně prohlíží květ [host.GetCurrentLocation.Custom('get_region_flower_type')]."
 hunt.5002.opening: "[hunt_participant.GetFirstName], [ROOT.Char.Custom2('RelationToMe', hunt_participant)], se krčí na zemi, vesele si pobrukuje a sbírá [host.GetCurrentLocation.Custom('get_region_flower_type_plural')]."
 hunt.5002.second_position: "Vedle [hunt_participant.GetFirstNameNoTooltip] stojí [hunt_participant_2.GetFirstName], [hunt_participant_2.GetHeldCourtPositionsString], nadšeně povídá a ukazuje na okvětní lístky."
 hunt.5002.second: "[hunt_participant_2.GetFirstName], [ROOT.Char.Custom2('RelationToMe', hunt_participant_2)], nakukuje přes rameno [hunt_participant.GetFirstNameNoTooltip] a pozorně naslouchá.\n\n"
 hunt.5002.alone: "Zdá se, že lov už [hunt_participant.GetFirstNameNoTooltip] vůbec nezajímá.\n\n"
 hunt.5002.gardener: "„Ach, [ROOT.Char.GetTitleAsNameNoTooltip], tyhle nádherné květy mi vnukly několik nápadů na novou výzdobu – právě #EMP tyhle#! by se dokonale vyjímaly podél palácových cest...“"
 hunt.5002.physician: "„[ROOT.Char.GetTitleAsNameNoTooltip], podívejte na všechny ty užitečné byliny a květiny! Tahle mírní bolesti! Tahle pomáhá při zlomenině [hunt_participant.Custom('RandomSaintBone')|l]! A tahle zahání [hunt_participant.Custom('RandomDisease')|l]...“"
 hunt.5002.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip], to je ale hojnost přírody! Podívejte se na ty rostliny! Bohatství země skutečně nezná mezí – těchto prostých pokladů si zdaleka nevážíme tolik, jak bychom měli.“"
 hunt.5002.a: "#EMP Zpátky#! na koně!"
 hunt.5002.a.second: "#EMP Zpátky#! na koně!"
 hunt.5002.a.flavor: "#EMP Jsme tu kvůli [activity.Custom('GetAnimalType')]!#!"
 hunt.5002.b: "Fascinující! Co je #EMP tamhle#! za květinu?"
 hunt.5002.c: "N-neprovozuješ snad #EMP čarodějnictví#!...?"
 hunt.5002.c.known: "Okamžitě přestaň s tím čarodějnictvím, odporný mágu!"
 hunt.5002.c.flavor: "#EMP Černá magie! Jed!#!"
 hunt.5002.d: "...přitahuješ pozornost, [hunt_participant.GetFirstNameNoTooltip]."
 hunt.5002.d.flavor: "#EMP [ROOT.Char.GetFaith.WitchGodName] nás učí, že svou cestu musíme chránit...#!"
 hunt.5002.e: "Máš vskutku dobré oko!"
 hunt.5002.e.flavor: "#EMP Pověz mi o nich všechno...#!"
 hunt.5002.e.gardener: "Právě #EMP tyhle#! jsem hledal[Select_CString(ROOT.Char.IsFemale,'Hledala jsem právě tyhle','Právě tyhle jsem hledal')]!"
 hunt.5002.e.herbalist: "Ano, a #EMP tahle#! bylina je možná ze všech nejužitečnější!"
 hunt.5002.g: "Předpokládám, že nové květiny #EMP by#! byly pěkné..."
 hunt.5002.g.present: "[gardener.GetFirstNameNoTooltip], pojď sem!"
 hunt.5002.g.elsewhere: "[gardener.GetFirstNameNoTooltip] #EMP by#! tyto květiny ocenil[Select_CString(gardener.IsFemale,'a','')]..."
 hunt.5002.h: "Můj lékař bude mít vše, co potřebuje."
 hunt.5002.h.present: "[physician.GetFirstNameNoTooltip], pojď sem!"
 hunt.5002.h.elsewhere: "[physician.GetFirstNameNoTooltip] by tyto byliny jistě využil[Select_CString(physician.IsFemale,'a','')]..."
 hunt.5002.cp_flavor: "#EMP ...ale my budeme pokračovat!#!"
 hunt.5002.cp_present_flavor: "#EMP [hunt_participant.GetFirstNameNoTooltip] má pro tebe práci, léčiteli!#!"
 hunt.5002.cp_elsewhere_flavor: "#EMP Nevadí ti zůstat a nasbírat je, že ne?#!"
 hunt.5003.opening: "Ve vzácné chvíli klidu strávím nějaký čas v tichosti a vychutnávám si krásu přírody."
 hunt.5003.desc_woo: "Náhle mě vyruší [hunt_participant.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], a se smíchem pronese: „Dárek pro [ROOT.Char.GetTitleAsNameNoTooltip].“\n\n"
 hunt.5003.desc: "Jak ze mě opadává napětí, zaslechnu tichý smích [hunt_participant.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)]. „#EMP Má lásko.#!“\n\n"
 hunt.5003.desc.flower: "[hunt_participant.GetFirstNameNoTooltip] mi něco zastrčí za ucho. „K vaší kráse má sice daleko, ale [newly_created_artifact.Custom('ArtifactVariableFlowerSpecies')] mi vás připomněla.“"
 hunt.5003.desc.animal: "[hunt_participant.GetFirstNameNoTooltip] pozvedne krvavé ostatky zajíce. „Ulovil[Select_CString(hunt_participant.IsFemale,'Ulovila jsem ho na vaši počest','Ulovil jsem ho na vaši počest')], jako důkaz svého odhodlání navždy bojovat po vašem boku.“"
 hunt.5003.ending: "\n\n[hunt_participant.GetFirstNameNoTooltip] se usměje a obdivuje své dílo."
 hunt.5003.ending_lover: "„Vypadáš tak pokojně. To mě těší.“ [hunt_participant.GetFirstNameNoTooltip] mi rychle vtiskne cudný polibek na tvář, jako bychom byli jediní lidé na světě."
 hunt.5003.ending_woo: "„Jsem rád[Select_CString(hunt_participant.IsFemale,'Ráda jsem tě zastihla o samotě','Jsem rád, že jsem tě zastihl o samotě')].“ [hunt_participant.GetFirstNameNoTooltip] se lehce začervená a pohledem naznačí něco... nevyřčeného."
 hunt.5003.a: "Ty se #EMP snažíš#!, aby nás někdo přistihl?!"
 hunt.5003.b: "Budu si toho #EMP vážit#!, drahoušku."
 hunt.5003.b.woo: "Děkuji, je to moc pěkné."
 hunt.5003.b.tt: "Někdo se může dozvědět o vašem [Concept('secret','tajném')|E] vztahu"
 hunt.5003.c: "K ničemu mi to není."
 hunt.5003.d: "Pojď ke mně, má lásko."
 hunt.5003.d.woo: "Pojď sem, jsme tu úplně sami..."
 hunt.5010.t: "Laň s kolouchem"
 hunt.5010.desc: "Když se prodíráme skrz [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] těsně v patách [activity.Custom('GetAnimalType')], vpadneme na slepou mýtinu pod nízkým útesem.\n\nDružinou se ozve hlasité zasténání zklamání a rozmrzelosti. V [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] se krčí vyděšená laň se svým kolouchem – ve spěchu jsme se zřejmě chytili jejich stopy...\n\nNemá smysl je lovit. Musíme se vrátit a znovu vystopovat [activity.Custom('GetAnimalMale')], než bude příliš pozdě."
 hunt.5010.a: "Kořist jako kořist. Skončeme to."
 hunt.5010.b: "Chyťte [activity.Custom('GetAnimalChild')], ochočíme ho!"
 hunt.5010.c: "Najděte [activity.Custom('GetAnimalMale')]!"
 hunt.5050.t: "Stržen z oblohy"
 hunt.5050.desc: "Můj [activity.Custom('GetRaptorType')] nádherně vzlétne ze svého stanoviště a zamíří přímo na [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalType')], ukrytého v [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')].\n\nKdyž vystoupá nejvýše, nad našimi hlavami se ozve pronikavý křik, příliš hlasitý a ostrý na to, aby patřil některému z #EMP našich#! ptáků.\n\nPrávě když se můj [activity.Custom('GetRaptorType')] začne střemhlav vrhat dolů, sám se stane terčem obrovského [host.Custom('GetRegionalEagleType')] – ten jej v prudkém víru peří vytrhne přímo ze vzduchu!"
 hunt.5050.a: "Zatracený ničemo! Za ním!"
 hunt.5050.a.success: "Pomstíš svého [activity.Custom('GetRaptorType')]"
 hunt.5050.a.failure: "Pták unikne"
 hunt.5050.b: "Vypadá to, že budu potřebovat #EMP tvého#! [activity.Custom('GetRaptorType')], [hunt_participant.GetFirstNameNoTooltip]."
 hunt.5050.c: "Aha, jedno z jeho per."
 hunt.5050.c.tt: "Získáš [Concept('artifact','artefakt')|E] v podobě ozdoby z pera"
 hunt.5050.d: "Příroda je krutá..."
 hunt.5060.t: "Pod mými křídly"
 hunt.5060.desc: "Společně s družinou se plížíme hájkem a bedlivě pátráme po jakékoli známce [activity.Custom('GetAnimalType')]. Z korun stromů nad námi se ozývá tiché švitoření, které s každým krokem sílí.\n\nJe to mládě, které křičí po matce!\n\nObratný lovec snese z [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] chundelaté neopeřené mládě dravce! Jaké štěstí! K lovu lze pořádně vycvičit pouze mladé ptáky odchycené v divočině."
 hunt.5060.a: "Odnesete ho do mé sokolnice."
 hunt.5060.b: "Tady, [hunt_participant.GetFirstNameNoTooltip], dárek!"
 hunt.5060.c: "Vraťte ho zpátky."
 hunt.7001.t: "Setkání v bažinách"
 hunt.7001.desc: "Čím hlouběji pronikáme do divočiny [host.GetCurrentLocation.GetNameNoTooltip], tím je země mokřejší a vzduch těžší.\n\nNáhle se ze zeleně kolem nás vynoří obr mezi muži, mohutná postava zahalená do nesčetných vrstev špinavého oblečení.\n\n„Vysvětlete se!“ zahřmí. „Co děláte v #EMP mých#! bažinách?“"
 hunt.7001.adventurer: "Nechtěl bys raději poznat svět s námi?"
 hunt.7001.a: "#EMP Tvé#! bažiny, říkáš? Tak nás proveď."
 hunt.7001.b: "Promluvme si o tom."
 hunt.7001.b_success: "Muž mé argumenty pochopí... myslím"
 hunt.7001.b_failure: "K tomu šílenci rozumem nepronikneš"
 hunt.7001.c: "Konečně! Něco, co můžeme lovit!"
 hunt.7001.d: "Uhni mi z cesty, odporný balíku!"
 hunt.7011.t: "V pasti"
 hunt.7011.desc: "Když se společně s [hunt_participant.GetTitledFirstName] pěšky prodíráme obtížným terénem, mohutný výkřik mě málem vyděsí k smrti.\n\n"
 hunt.7011.snare: "Otočím se a spatřím [hunt_participant.GetFirstNameNoTooltip] rozvaleně na zemi. Lýtko pevně svírá nastražená smyčka."
 hunt.7011.bear: "Otočím se a spatřím, jak nohu [hunt_participant.GetFirstNameNoTooltip] svírají čelisti železné pasti, která výhružně ční z trní."
 hunt.7011.pit: "Otočím se a spatřím [hunt_participant.GetFirstNameNoTooltip] v zamaskované jámě, která pevně svírá jednu nohu."
 hunt.7011.alive: "\n\n[hunt_participant.GetFirstNameNoTooltip] vyje bolestí,"
 hunt.7011.noble: "„Argh! Ti zatracení poddaní! Proč nemohou lovit jako skuteční [hunt_participant.GetWomenMen]?!“"
 hunt.7011.lowborn: "„Moje noha! Argh! Té zatracené pasti jsem si vůbec nevšiml[Select_CString(hunt_participant.IsFemale,'Nevšimla jsem si té zatracené pasti','Té zatracené pasti jsem si vůbec nevšiml')]! #EMP Argh!#!“"
 hunt.7011.dead: "\n\nMusíme pokračovat, jinak nám [activity.Custom('GetAnimalType')] unikne!"
 hunt.7011.a: "Musím pokračovat, jinak nám [activity.Custom('GetAnimalType')] unikne!"
 hunt.7011.b: "[physician.GetFirstNameNoTooltip]! Kde je [physician.GetFirstNameNoTooltip]?"
 hunt.7011.c: "Mí lidé tě odnesou zpátky."
 hunt.7011.d: "Ten pád byl bohužel opravdu ošklivý..."
 hunt.7011.d.success: "Nikdo si ničeho nevšimne"
 hunt.7011.d.failure: "Někdo pojme podezření"
 hunt.7011.d.flavor: "#EMP ...a hlavou jsi narazil[Select_CString(hunt_participant.IsFemale,'A hlavou jsi narazila do tohohle kamene','...a hlavou jsi narazil do tohohle kamene')]...#!"
 hunt.7011.e: "Najděte ty pytláky a usekněte jim ruce."
 hunt.7011.e.flavor: "#EMP Nikdo nebude krást [ROOT.Char.GetTitleAsNameNoTooltip]!#!"
 hunt.7011.e.hunting_grounds: "Tuto možnost zpřístupňuje $building_type_hunting_grounds_01$ [Concept('building','budova')|E] v [host.GetCurrentLocation.GetTitle.GetBaseNameNoTierPossessive]"
 hunt.7011.e.royal_forests: "Tuto možnost zpřístupňuje $building_type_royal_forest_01$ [Concept('building','budova')|E] v [host.GetCurrentLocation.GetTitle.GetBaseNameNoTierPossessive]"
 hunt.7020.t: "Vzdor tíži"
 hunt.7020.desc: "Družina se zastavila, protože její pozornost upoutal výchoz oblých balvanů na vrcholu svahu. [onlooker.GetTitledFirstName] strčí do jednoho uvolněného kamene.\n\nVšichni fascinovaně sledují, jak se balvan valí dolů, nabírá rychlost a nakonec s uspokojivým zaduněním dopadne pod kopcem.\n\n"
 hunt.7020.murder: "Hmm... nechá se [pertinent.GetFirstNameNoTooltip] kvůli své pýše nachytat...?"
 hunt.7020.woo: "Jak lépe dokázat [pertinent.GetFirstNameNoTooltip] svou hodnotu než skokem přes balvan?"
 hunt.7020.befriend: "Tohle by mohla být příležitost sblížit se s [pertinent.GetFirstNameNoTooltip], na kterou jsem čekal[Select_CString(ROOT.Char.IsFemale,'Tohle by mohla být příležitost sblížit se s [pertinent.GetFirstNameNoTooltip], na kterou jsem čekala','Tohle by mohla být příležitost sblížit se s [pertinent.GetFirstNameNoTooltip], na kterou jsem čekal')]."
 hunt.7020.bravado: "Hmm, tohle by mohla být příležitost všechny ohromit..."
 hunt.7020.a.intent: "Sleduj, [pertinent.GetFirstNameNoTooltip]!"
 hunt.7020.a: "Všichni, pomozte [onlooker.GetFirstNameNoTooltip] skutálet pro mě ten velký!"
 hunt.7020.a.flavor: "#EMP Vždyť je to jen kamínek!#!"
 hunt.7020.b: "Shoďte další, přeskočím ho!"
 hunt.7020.b.flavor: "#EMP Přeskočím ho s lehkostí!#!"
 hunt.7020.c.rival: "Netroufáš si přes něj skočit, [pertinent.GetFirstNameNoTooltip]?"
 hunt.7020.c: "[pertinent.GetFirstNameNoTooltip], zvládneš jeden přeskočit?"
 hunt.7020.c.flavor: "#EMP Co by se tak mohlo pokazit?#!"
 hunt.7020.d: "Pojď, [pertinent.GetFirstNameNoTooltip], uvidíme, kdo jich přeskočí víc!"
 hunt.7020.d.flavor: "#EMP Opatrně!#!"
 hunt_boulder_jump_success_both: "Oběma se podaří přeskočit své balvany"
 hunt_boulder_jump_success_self: "Přeskočíš balvan"
 hunt_boulder_jump_success_pertinent: "[pertinent.GetFirstNameNoTooltip] přeskočí balvan"
 hunt_boulder_jump_failure_self: "Utrpíš #negative_value zranění#!"
 hunt_boulder_jump_failure_pertinent: "[pertinent.GetFirstNameNoTooltip] utrpí #negative_value zranění#!"
 hunt_boulder_jump_failure_both: "Každý z vás utrpí #negative_value zranění#!"
 hunt_boulder_jump_refusal: "[pertinent.GetFirstNameNoTooltip] odmítne tvou výzvu"
 hunt_boulder_impressed_title: "Působivý skok"
 hunt.7020.e: "Výborně, pokračujme."
 hunt.7020.e.flavor: "#EMP Dělat něco jiného by byla hloupost...#!"
 hunt.7100.t: "Chvíle na rozhovor"
 hunt.7100.opening: "Zatímco čekáme, až psi zachytí stopu, družina odpočívá ve stínu. Nedaleko odpočívá i [woo_target.GetFirstName]. Tohle by byla ideální chvíle na nevinný rozhovor."
 hunt.7100.married: "Využiji chvíle, kdy [woo_target.GetPrimarySpouse.GetTitledFirstName], [woo_target.GetPrimarySpouse.GetWifeHusband] [woo_target.GetFirstNameNoTooltip], nevěnuje pozornost."
 hunt.7100.married_absent: "[woo_target.GetPrimarySpouse.GetTitledFirstName], [woo_target.GetPrimarySpouse.GetWifeHusband] [woo_target.GetFirstNameNoTooltip], je daleko..."
 hunt.7100.currentspouse: "Možná si dnes [woo_target.GetFirstNameNoTooltip] konečně získám!"
 hunt.7100.desc: "\n\n„Ach, [woo_target.GetTitledFirstName], dnes je na lov vskutku krásný den. Doufám, že si ho užíváš?“ začnu nenuceně.\n\nJsem si téměř jistý, že úsměv [woo_target.GetFirstNameNoTooltip] není jen zdvořilostní."
 hunt.7100.a: "Není nad pořádný lov!"
 hunt.7100.a.tt: "#F Zapůsobíš na aktivní stránku osobnosti [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7100.b: "Zkrotit [activity.Custom('GetRaptorType')] a létat s ním, to je skutečný život."
 hunt.7100.b.tt: "#F Zapůsobíš na společenskou stránku osobnosti [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7100.c: "Občas je mi těch nebohých zvířat přece jen líto."
 hunt.7100.c.tt: "#F Zapůsobíš na soucitnou stránku osobnosti [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7100.d: "Samozřejmě bych raději dělal[Select_CString(ROOT.Char.IsFemale,'něco užitečného','něco užitečného')]."
 hunt.7100.d.tt: "#F Zapůsobíš na pilnou stránku osobnosti [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7100.e: "Dobře spravovaný les překypuje dary [ROOT.Char.GetFaith.HighGodNamePossessive]."
 hunt.7100.e.tt: "#F Zapůsobíš na hospodárnou stránku osobnosti [woo_target.GetFirstNameNoTooltip].#!"
 hunt.7101.reply_hunter: "„$hunt.7100.a$“\n\n"
 hunt.7101.reply_falconer: "„$hunt.7100.b$“\n\n"
 hunt.7101.reply_pity: "„$hunt.7100.c$“\n\n"
 hunt.7101.reply_wastrel: "„$hunt.7100.d$“\n\n"
 hunt.7101.reply_steward: "„$hunt.7100.e$“\n\n"
 hunt.7101.opening: "[woo_actor.GetTitledFirstName] ke mně přistoupí, zatímco družina odpočívá ve stínu a čeká, až psi zachytí stopu.\n\nChvíli přemýšlí a pak pronese:"
 hunt.7101.hunter: "$hunt.7101.reply_hunter$Nemohu popřít, že právě vzrušení a ruch lovu mají své kouzlo."
 hunt.7101.falconer: "$hunt.7101.reply_falconer$Dobře chápu, jaký význam se za těmi slovy skrývá."
 hunt.7101.pity: "$hunt.7101.reply_pity$Možná je [woo_actor.GetFirstNameNoTooltip] přece jen [Select_CString(woo_actor.IsFemale,'jiná než ostatní','jiný než ostatní')]."
 hunt.7101.wastrel: "$hunt.7101.reply_wastrel$Tohle je někdo, kdo to někam dotáhne."
 hunt.7101.steward: "$hunt.7101.reply_steward$V uspořádané přírodě je skutečně cosi krásného."
 hunt.7101.fallback: "Jen těžko hledám vhodnou odpověď."
 hunt.7101.a: "Musím uznat, že [woo_actor.GetFirstNameNoTooltip] má jisté kouzlo..."
 hunt.7102.hunter: "$hunt.7101.reply_hunter$\n\nV duchu se neubráním úšklebku..."
 hunt.7102.falconer: "$hunt.7101.reply_falconer$\n\nTaková arogance..."
 hunt.7102.pity: "$hunt.7101.reply_pity$\n\nProboha, nauč se přijmout kompliment!"
 hunt.7102.wastrel: "$hunt.7101.reply_wastrel$\n\n"
 hunt.7102.steward: "$hunt.7101.reply_steward$\n\n"
 hunt.7102.fallback: "[woo_actor.GetFirstNameNoTooltip] se na mě jen vědoucně usměje, což mi je #EMP krajně#! nepříjemné."
 hunt.7102.a: "To je ale směšný člověk."
 hunt.7103.reply: "[woo_target.GetTitledFirstName] na můj pokus reaguje příznivě"
 hunt.7103.hunter: "$hunt.7103.reply$, oči září nadšením a hlava horlivě přikyvuje."
 hunt.7103.falconer: "$hunt.7103.reply$, skoro jako by si mě najednou [Select_CString(woo_target.IsFemale,'prohlížela novýma očima','prohlížel novýma očima')]."
 hunt.7103.pity: "$hunt.7103.reply$ a lituje násilných kratochvílí naší doby a společenské vrstvy."
 hunt.7103.wastrel: "$hunt.7103.reply$ a očividně jej překvapuje, že našel spřízněnou duši."
 hunt.7103.steward: "$hunt.7103.reply$ a těší jej, že našel někoho, koho podobné věci rovněž naplňují radostí."
 hunt.7103.fallback: "$hunt.7103.reply$ a dlouze mi hledí do očí."
 hunt.7103.desc: "\n\nKdyž [woo_target.GetFirstNameNoTooltip] odchází, napětí je cítit z každé zdvořilostní fráze. [Select_CString(ROOT.Char.IsFemale,'Věděla jsem, že najdu ta správná slova','Věděl jsem, že najdu ta správná slova')], kterými si [woo_target.GetFirstNameNoTooltip] získám!"
 hunt.7103.a: "Myslím, že [woo_target.GetFirstNameNoTooltip] už [Select_CString(woo_target.IsFemale,'zabrala','zabral')]..."
 hunt.7104.reply: "Má odpověď na [woo_target.GetTitledFirstName] zřejmě nezapůsobila"
 hunt.7104.hunter: "$hunt.7104.reply$; při poděkování se vyhýbá mému pohledu a rychle se poroučí."
 hunt.7104.falconer: "$hunt.7104.reply$ a [woo_target.GetFirstNameNoTooltip] jen pohrdavě protočí oči."
 hunt.7104.pity: "$hunt.7104.reply$; má slova rychle zahubí veškerý zájem."
 hunt.7104.wastrel: "$hunt.7104.reply$; pohled se brzy zastře a poslouchá mě jen napůl."
 hunt.7104.steward: "$hunt.7104.reply$; pohled se brzy zastře a poslouchá mě jen napůl."
 hunt.7104.fallback: "$hunt.7104.reply$ a [woo_target.GetFirstNameNoTooltip] se nemůže dočkat, až mou společnost opustí."
 hunt.7104.desc: "\n\nKdyž po rozloučení [woo_target.GetFirstNameNoTooltip] zůstanu stát o samotě, nemohu se ubránit pocitu, že jsem tímhle naprostým přešlapem [Select_CString(ROOT.Char.IsFemale,'ze sebe udělala úplnou hlupačku','ze sebe udělal úplného hlupáka')]..."
 hunt.7104.a: "Co jsem si to jen [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]...?"
 hunt.7200.t: "Skutečná kořist"
 hunt.7200.desc: "Když opouštíme tábor a míříme hlouběji do [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], sleduji [murder_target.GetTitledFirstName], [ROOT.Char.Custom2('DescriptorNegative', murder_target)], jak se loudá vpřed a vůbec netuší, že ji pozoruji.\n\n"
 hunt.7200.agent: "[murder_schemer.GetTitledFirstName] tu nemůže být, ale možná právě na tuto příležitost jsme čekali.\n\n"
 hunt.7200.accomplice_2: "[accomplice.GetTitledFirstName] i [accomplice_2.GetTitledFirstName] sledují [murder_target.GetFirstNameNoTooltip] stejně bedlivě... Lepší příležitost už možná nedostaneme..."
 hunt.7200.accomplice: "S pomocí [accomplice.GetTitledFirstName] se možná konečně zbavím toho odporného člověka."
 hunt.7200.alone: "Mezi účastníky lovu sice nemám žádné spojence, ale pokud najdu správnou chvíli, nic neposkytne činu lepší krytí než právě lov."
 hunt.7200.a: "Dnes je ten den."
 hunt.7200.b: "[accomplice.GetFirstNameNoTooltip] se o to postará."
 hunt.7200.c: "V této choulostivé záležitosti důvěřuji [accomplice_2.GetFirstNameNoTooltip]."
 hunt.7200.d: "Musím být trpělivý[Select_CString(ROOT.Char.IsFemale,'Musím být trpělivá','Musím být trpělivý')]."
 hunt_murder_accomplice_tt: "[THIS.Char.GetShortUIName|U] se pokusí zavraždit [murder_target.GetShortUIName]"
 hunt.7210.opening: "[murder_target.GetTitledFirstName] cválá skrz [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] za zvukem rohů a vytím psů, až se konečně oddělí od zbytku družiny.\n\n"
 hunt.7210.desc: "[murder_target.GetFirstNameNoTooltip] se na chvíli zastaví a přemýšlí, kudy pokračovat."
 hunt.7210.accomplice: "Pohlédnu na [accomplice.GetFirstName], [Select_CString(accomplice.IsFemale,'která zachmuřeně přikývne','který zachmuřeně přikývne')]. Odhodlaně svraštělé obočí prozrazuje, že čeká na můj krok."
 hunt.7210.a: "A bude z toho tragická nehoda."
 hunt.7210.a.tt: "#EMP Hyjé!#!"
 hunt.7210.b: "Ne, musím ještě vyčkat..."
 hunt.7211.desc: "Vyrazím co nejrychleji a z boku se vrhnu na [murder_target.GetTitledFirstName] ve snaze srazit [murder_target.GetFirstNameNoTooltip] z koně."
 hunt.7211.agent: "Nechci zklamat [abduct_schemer.GetFirstName]..."
 hunt.7211.accomplice: "[accomplice_2.GetFirstName] a [accomplice.GetFirstName] se okamžitě přidají."
 hunt.7211.accomplice_2: "[accomplice.GetFirstName] se rychle vrhne z druhé strany."
 hunt.7211.success: "\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip]?! Argh! Co to dělá-“ [murder_target.GetFirstNameNoTooltip] se zřítí z koně do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] a já rychle sesednu.\n\nNež se [murder_target.GetFirstNameNoTooltip] stačí vzpamatovat, je po všem. Případný svědek by jen těžko dokázal určit, co tuto spoušť způsobilo."
 hunt.7211.failure: "\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip]?! Co to sakra-“ [murder_target.GetFirstNameNoTooltip] tvrdě spadne z koně, ale rychle se vyškrábe na nohy. Zatímco se snažím znovu ovládnout svého koně, [murder_target.GetFirstNameNoTooltip] se rozběhne ke zbytku družiny, vyděšeně se ohlíží přes rameno a křičí z plných plic. Včas ji už nedostihnu."
 hunt.7212.desc: "Na chvíli se zastavím, abych si upravil[Select_CString(ROOT.Char.IsFemale,'výstroj','výstroj')]. Náhlé prasknutí větvičky prolomí ticho a spatřím, jak se ke mně [abduct_actor.GetTitledFirstName] rychle blíží."
 hunt.7212.accomplice_2: "[accomplice_2.GetFirstName] a [accomplice.GetFirstName] jsou hned za ním"
 hunt.7212.accomplice: "[accomplice.GetFirstName] je [abduct_actor.GetFirstNameNoTooltip] těsně v patách."
 hunt.7212.success: "\n\nOdhodlání v očích [murder_actor.GetFirstNameNoTooltip] si všimnu příliš pozdě. Nedokážu uhnout výpadu a s žuchnutím padám do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')].\n\nKdyž se vzpamatuji a otočím se, [murder_actor.GetFirstNameNoTooltip] stojí nade mnou a drží nad hlavou velký kámen! „Sbohem, [ROOT.Char.GetFirstNameNoTooltip].“"
 hunt.7212.failure: "\n\nNěco tu rozhodně není v pořádku. [murder_actor.GetFirstNameNoTooltip] se na mě náhle vrhne a já neohrabaně padnu k zemi, ale podaří se mi vyškrábat na nohy, zatímco [murder_actor.GetFirstNameNoTooltip] v [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] ztratí rovnováhu a zakleje.\n\nRozběhnu se do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] a křičím o pomoc. Družina nemůže být daleko!"
 hunt.7212.a: "„C-cože-! N-“"
 hunt.7212.b: "Jen běž dál!"
 hunt.7300.t: "Chvíle na rozhovor"
 hunt.7300.desc: "Zatímco čekáme na zprávy od stopařských psů, družina odpočívá ve stinném hájku. [befriend_target.GetFirstName] stojí nedaleko. Tohle je má příležitost zapůsobit.\n\n„[befriend_target.GetTitledFirstNameNoTooltip]! Jak se máš? Málokdy máme příležitost si promluvit,“ začnu nenuceně.\n\n[befriend_target.GetFirstNameNoTooltip] působí mým rozhovorem překvapeně, ale nikoli nepřátelsky."
 hunt.7301.reply_hunter: "„$hunt.7100.a$“\n\n"
 hunt.7301.reply_falconer: "„$hunt.7100.b$“\n\n"
 hunt.7301.reply_pity: "„$hunt.7100.c$“\n\n"
 hunt.7301.reply_wastrel: "„$hunt.7100.d$“\n\n"
 hunt.7301.reply_steward: "„$hunt.7100.e$“\n\n"
 hunt.7301.opening: "[befriend_actor.GetTitledFirstName] se ke mně nenápadně přiblíží, zatímco družina čeká na zprávy od stopařských psů.\n\nVřele se usměje a začne:"
 hunt.7301.hunter: "$hunt.7301.reply_hunter$Proti tomu nelze nic namítat."
 hunt.7301.falconer: "$hunt.7301.reply_falconer$Přímo k věci. Přesně chápu, co tím [befriend_actor.GetFirstNameNoTooltip] myslí."
 hunt.7301.pity: "$hunt.7301.reply_pity$Nemohu popřít pravdivost těch slov. Je to krutá kratochvíle."
 hunt.7301.wastrel: "$hunt.7301.reply_wastrel$Na tom něco je. Kolik užitečných věcí bych mohl[Select_CString(ROOT.Char.IsFemale,'Kolik užitečných věcí bych mohla dělat místo toho','Kolik užitečných věcí bych mohl dělat místo toho')]..."
 hunt.7301.steward: "$hunt.7301.reply_steward$Radost z usměrňování přírody dokážu velmi dobře pochopit."
 hunt.7301.fallback: "Nevím jistě, co na to říct."
 hunt.7301.a: "Možná toho máme společného víc, než jsem si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]."
 hunt.7302.hunter: "$hunt.7301.reply_hunter$\n\nS tím nemohu vůbec souhlasit..."
 hunt.7302.falconer: "$hunt.7301.reply_falconer$\n\nJen bezvýznamné rozptýlení, nic víc..."
 hunt.7302.pity: "$hunt.7301.reply_pity$\n\nTaková slabost. Svět je krutý."
 hunt.7302.wastrel: "$hunt.7301.reply_wastrel$\n\nKaždý si musí najít čas i na rozptýlení."
 hunt.7302.steward: "$hunt.7301.reply_steward$\n\nJaká nuda..."
 hunt.7302.fallback: "[befriend_actor.GetFirstNameNoTooltip] se na mě nadějně usměje a očividně očekává, že naše sympatie budou vzájemné."
 hunt.7302.a: "Hele, co je tamhle?"
 hunt.7303.reply: "Zdá se, že s [befriend_target.GetTitledFirstName] máme mnoho společného"
 hunt.7303.hunter: "$hunt.7303.reply$ a nadšeně se pouštíme do podrobností o tětivách a pastích."
 hunt.7303.falconer: "$hunt.7303.reply$ a nadšení pro sokolnictví se jen stěží daří skrývat."
 hunt.7303.pity: "$hunt.7303.reply$."
 hunt.7303.wastrel: "$hunt.7303.reply$ a společně lamentujeme nad nutností bavit dvůr malichernostmi."
 hunt.7303.steward: "$hunt.7303.reply$ a ochotně si vyměňujeme zkušenosti se správou lesů a zvěře."
 hunt.7303.fallback: "$hunt.7303.reply$ a v mé společnosti se viditelně uvolní."
 hunt.7303.desc: "\n\nKdyž pokračujeme dál, téměř se od sebe nehneme. Přesně taková slova byla potřeba, abych si [befriend_target.GetFirstNameNoTooltip] získal[Select_CString(ROOT.Char.IsFemale,'Přesně taková slova byla potřeba, abych si [befriend_target.GetFirstNameNoTooltip] získala','Přesně taková slova byla potřeba, abych si [befriend_target.GetFirstNameNoTooltip] získal')]!"
 hunt.7303.a: "Myslím, že se mi podařilo [befriend_target.GetFirstNameNoTooltip] získat..."
 hunt.7304.reply: "Má slova na [befriend_target.GetTitledFirstName] zřejmě příliš nezapůsobila"
 hunt.7304.hunter: "$hunt.7304.reply$; přijde jen zdvořilý úsměv a odkašlání, zatímco pozornost už míří zpět k divočině."
 hunt.7304.falconer: "$hunt.7304.reply$; [befriend_target.GetFirstNameNoTooltip] jen zdvořile přikývne a pokračuje dál."
 hunt.7304.pity: "$hunt.7304.reply$; [befriend_target.GetFirstNameNoTooltip] se na mě podivně podívá a poškrábe se na hlavě."
 hunt.7304.wastrel: "$hunt.7304.reply$; [befriend_target.GetFirstNameNoTooltip] vypadá mými slovy naprosto zděšeně."
 hunt.7304.steward: "$hunt.7304.reply$; [befriend_target.GetFirstNameNoTooltip] rychle ztratí zájem a správa očividně není nic pro něj."
 hunt.7304.fallback: "$hunt.7304.reply$; [befriend_target.GetFirstNameNoTooltip] neřekne ani slovo."
 hunt.7304.desc: "\n\nKdyž [befriend_target.GetFirstNameNoTooltip] odejde za ostatními a já zůstanu stát o samotě, připadám si hloupě..."
 hunt.7304.a: "Výborně, [ROOT.Char.GetFirstNameNoTooltip]."
 hunt.7400.t: "[ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')|U] příležitostí"
 hunt.7400.desc: "Opustíme tábor a v zástupu zamíříme do [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]. Bedlivě sleduji [abduct_target.GetTitledFirstName], [ROOT.Char.Custom2('DescriptorNegative', abduct_target)]. Lov zcela odvádí pozornost od mých skutečných úmyslů.\n\n"
 hunt.7400.agent: "[abduct_schemer.GetTitledFirstName] tu s námi není, ale pokud chceme dosáhnout svého cíle, možná musím této příležitosti využít.\n\n"
 hunt.7400.accomplice_2: "[accomplice.GetTitledFirstName] a [accomplice_2.GetTitledFirstName] nás následují a mlčky nás oba pozorují s vědomím toho, co se chystá..."
 hunt.7400.accomplice: "Mám pomoc [accomplice.GetTitledFirstName]. Teď jen najít tu správnou příležitost..."
 hunt.7400.alone: "Budu jednat bez pomoci, ale s dobrou přípravou a momentem překvapení dokáže jediný člověk mnoho."
 hunt.7400.a: "Čas jednat je právě teď."
 hunt.7400.b: "Nechám to na [accomplice.GetFirstNameNoTooltip]."
 hunt.7400.c: "V tomhle mohu důvěřovat [accomplice_2.GetFirstNameNoTooltip]."
 hunt.7400.d: "Teď není vhodná chvíle."
 hunt_abduct_accomplice_tt: "[THIS.Char.GetShortUIName|U] se pokusí unést [abduct_target.GetShortUIName]"
 hunt.7410.desc: "Konečně nastane chvíle, kdy jsme s [abduct_target.GetTitledFirstName] téměř sami! Teď už jen provést plán!\n\n"
 hunt.7410.accomplice_2: "[accomplice.GetTitledFirstName] a [accomplice_2.GetTitledFirstName] mě sledují a čekají, až udělám první krok..."
 hunt.7410.accomplice: "[accomplice.GetTitledFirstName] stojí připraveně a nervózně mě sleduje..."
 hunt.7410.alone: "Zvládnu to..."
 hunt.7410.a: "Je čas!"
 hunt.7410.a.success: "Uneseš [abduct_target.GetFirstNameNoTooltip]"
 hunt.7410.a.failure: "[abduct_target.GetFirstNameNoTooltip] unikne"
 hunt.7410.b: "#EMP Ach...#! Nedokážu to..."
 hunt.7411.desc: "Pomalu se zezadu přibližuji k [abduct_target.GetTitledFirstName] a pečlivě čekám na správný okamžik k útoku."
 hunt.7411.agent: "$hunt.7211.agent$"
 hunt.7411.accomplice_2: "Ve stejnou chvíli se [accomplice_2.GetFirstName] a [accomplice.GetFirstName] přibližují každý z jedné strany."
 hunt.7411.accomplice: "[accomplice.GetFirstName] se snaží dostat k [abduct_target.GetFirstNameNoTooltip] z jiného úhlu."
 hunt.7411.success: "\n\nPřekvapím [abduct_target.GetFirstNameNoTooltip] a prudce srazím k [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]. Zatímco [abduct_target.GetFirstNameNoTooltip] omráčeně leží, svážu mu[Select_CString(abduct_target.IsFemale,'svážu jí ruce provazem','svážu mu ruce provazem')] ruce provazem.\n\n[abduct_target.GetFirstNameNoTooltip] se převalí na bok a v očích má strach a zmatek."
 hunt.7411.failure: "\n\nMálem se mi podaří [abduct_target.GetFirstNameNoTooltip] překvapit, ale je mnohem odolnější, než vypadá! Jakmile zahlédne provaz v mé ruce, okamžitě pochopí, co se děje, a uteče do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], přičemž volá ostatní..."
 hunt.7411.a: "Mám tě, červíčku!"
 hunt.7411.b: "Zatracený kluzký červ!"
 hunt.7412.success: "\n\nNež se stačím na cokoli zeptat, [abduct_actor.GetFirstNameNoTooltip] do mě vrazí vší silou a pošle mě k zemi do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')].\n\nKdyž tam omráčeně ležím, ucítím, jak mi někdo svazuje ruce provazem! Únos?!"
 hunt.7412.failure: "\n\nNěco tu nehraje. V očích [abduct_actor.GetFirstNameNoTooltip] se zaleskne znepokojivé odhodlání. Pokusí se do mě vrazit, ale jen mě zavadí, ztratí rovnováhu a zřítí se na zem. Vedle [abduct_actor.GetFirstNameNoTooltip] leží v [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] smotaný provaz!\n\nRozběhnu se do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] a volám na ostatní, zatímco [abduct_actor.GetFirstNameNoTooltip] zůstává ležet a sténá..."
 hunt.7412.a: "„[abduct_actor.GetFirstNameNoTooltip]! C-co-“"
 hunt.7800.t: "Odnikud"
 hunt.7800.desc: "Na chvíli se zastavím, abych se napil z měchu s vodou a dopřál si trochu chladivé úlevy od potu a shonu štvanice. Když měch znovu připevním k boku, zaslechnu tiché zasvištění.\n\n"
 hunt.7800.tree: "Šíp se s ohlušujícím #EMP PRÁSKNUTÍM#! zabodne do [ROOT.Char.GetCurrentLocation.Custom('GetRandomRegionalWood')] těsně vedle mě!"
 hunt.7800.ground: "Šíp se zabodne do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] přímo u mých nohou a hluboko zajede do země."
 hunt.7800.closing: "\n\nSpolečně s nejbližšími se prudce otočíme, ale nikde nikdo. Jen vítr šustí v [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]..."
 hunt.7800.a: "#EMP Hej!#! Dávej větší pozor!"
 hunt.7800.b: "Ten šíp musí #EMP někomu#! patřit..."
 hunt.7800.b.success: "Najdeš jeho majitele"
 hunt.7800.b.failure: "Nenajdeš žádnou stopu"
 hunt.7800.b.tt: "Postavíš střelce před odpovědnost"
 hunt.7800.c: "#EMP Vrazi!#! Rychle! Dostaňte mě odsud!"
 hunt.7801.t: "Odnikud"
 hunt.7801.desc: "Když si šíp pozorně prohlédnu, zjistím, že opeření má nezvyklé provedení, podle kterého jej půjde snadno odlišit od šípů ostatních účastníků.\n\nNenápadně si prohlédnu toulce ostatních lovců a brzy najdu viníka...\n\n„Ne, prosím! Můj [ROOT.Char.GetLadyLord]! Možná jsem byl[Select_CString(culprit.IsFemale,'Ne, prosím! Má paní! Možná jsem byla až příliš horlivá a střílela do houští, ale nemyslela jsem tím nic zlého! Prosím!','Ne, prosím! Můj pane! Možná jsem byl až příliš horlivý a střílel do houští, ale nemyslel jsem tím nic zlého! Prosím!')]“"
 hunt.7801.a: "#EMP Tentokrát#! tě nechám jít."
 hunt.7801.b: "Nesmysl. Spoutejte [culprit.GetFirstNameNoTooltip], odjíždíme."
 hunt.8001.t: "Nádherný kus"
 hunt.8001.desc: "Když se vracíme z [host.GetCurrentLocation.GetName] a táhneme s sebou skoleného [activity.Custom('GetAnimalType')], nemohu ho neobdivovat ani po smrti. Tak nádherný kus – jeho kůže nebo lebka by se na stěnách mého dvora vyjímala skvěle! Jen co zvolit?"
 hunt.8001.a: "Jeho nádherná kožešina bude skvělým námětem k hovoru."
 hunt.8001.b: "Vystavte jeho hlavu, ať hosté spatří jeho majestátnost!"
 hunt.8001.c: "Raději se soustřeďme na lahodnou hostinu než na trofej z mršiny!"
 hunt.8200.t: "Sokolnický výcvik"
 hunt.8200.desc: "Hledím k obzoru a vycházející slunce ohlašuje den plný příslibů. [master_hunter.GetName], [ROOT.Char.Custom('GetHuntMasterDesc')], se ke mně přiblíží s mým [ROOT.Char.Custom('GetRaptorType')] na ruce a jiskrou v očích.\n\n„Vím, že nás čeká lov, ale podívejte na to jasné ráno! Když má váš pták hlad a zem ještě chladí rosa, kořist bude jako na podnose.“\n\nDrápy mého [ROOT.Char.Custom('GetRaptorTypePossessive')] by se před nadcházejícím lovem mohly ještě trochu procvičit..."
 hunt.8200.a: "Ani do bitvy bych nešel[Select_CString(ROOT.Char.IsFemale,'Ani do bitvy bych nešla s tupou čepelí','Ani do bitvy bych nešel s tupou čepelí')] s tupou čepelí."
 hunt.8200.a.flavor: "Před velkým dnem si rád[Select_CString(ROOT.Char.IsFemale,'Ráda si před velkým dnem trochu procvičím','Před velkým dnem si rád trochu procvičím')] trochu procvičím."
 hunt.8200.b: "Ale kdo tu bude svědkem mého triumfu?!"
 hunt.8200.b.flavor: "Trvám na tom, abychom si na lov pospíšili."
 hunt.8210.t: "Lovcem i kořistí"
 hunt.8210.desc: "V očekávání nadcházejícího lovu se za svitu měsíce vykoupu a očistím sebe i svého [hunted_hawker.Custom('GetRaptorType')].\n\nNáhle za sebou zaslechnu zašustění a vzápětí ucítím něčí dech na šíji.\n\n„Možná budete dnes večer mou kořistí vy? Kvůli svým povinnostem si tak málokdy mohu dopřát nějaké sousto.“\n\nOmamná vůně kadidla z nedalekého [local_temple.Custom('GetLocationFaithTemple')] v [local_temple.GetBaronyNameExplicitlyNoTooltip] mi zatemní mysl. Mohla by to být místní [shrine_maiden.Custom('PriestTitle')]?"
 hunt.8210.a: "Kdo jsem, abych odpíral[Select_CString(ROOT.Char.IsFemale,'Kdo jsem, abych odpírala božské chuti?','Kdo jsem, abych odpíral božské chuti?')] božské chuti?"
 hunt.8210.a.flavor: "Noc plná vášně posílí tvůj básnický talent."
 hunt.8210.b: "Pusť mě! Svou mužnost si musím šetřit na lov!"
 hunt.8210.b.flavor: "Odmítneš múzu."
 hunt.8211.opening: "[shrine_maiden.Custom2('AppropriateGreeting', ROOT.Char)]"
 hunt.8211.desc: "$love_artifact_poetry_name$\n\n#EMP „Přišel jsi za mnou včera v noci ty, nebo jsem já vyhledala tebe?\n\nNevzpomínám si.\n\nNevím ani, zda mě zalévala blaženost náležející pouze říši snů,\n\nnebo zda takové potěšení mohlo být skutečné.“#!"
 hunt.8211.a: "[ROOT.Char.Custom('GetCourt')|U] se dozví o naší společné rozkoši!"
 hunt.8211.b: "Tuto zvěčněnou vzpomínku na naši vášeň si budu opatrovat."
 love_artifact_poetry_name: "Přešel jsem most rozkoše"
 love_artifact_poetry_description: "Básnické dílo věnované [ROOT.Char.GetTitledFirstName] na oslavu chvíle, kdy [sex_memory.GetDescription], z pera [shrine_maiden.GetTitledFirstName].\n\n#EMP $hunt.8211.desc$#!"
 love_poetry_artifact_appended_desc: "Básnické dílo věnované [ROOT.Char.GetTitledFirstName] na oslavu chvíle, kdy [sex_memory.GetDescription], z pera [shrine_maiden.GetTitledFirstName].\n\nStojí v něm:\n#EMP $hunt.8211.desc$#!"
 hunt.8211.a_effect: "[newly_created_artifact.GetName] se stane [Concept('court_artifact','dvorským artefaktem')|E] a získá modifikátor [Concept('grandeur','velkoleposti')|E]"
 hunt.8211.b_effect: "Získáš [Concept('artifact','artefakt')|E] [newly_created_artifact.GetName]"
 hunt.9001.t: "Dary divočiny"
 hunt.9001.opening_falconry_self: "Shromáždím dvojici ptáků, které skolili naši [activity.Custom('GetRaptorPlural')],"
 hunt.9001.opening_falconry_master_of_hunt: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], shromáždí dvojici ptáků, které skolili naši [activity.Custom('GetRaptorPlural')],"
 hunt.9001.opening_falconry_courtier: "[hunt_participant.GetTitledFirstName] shromáždí dvojici ptáků, které skolili naši [activity.Custom('GetRaptorPlural')],"
 hunt.9001.opening_captive_master_of_hunt: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], zkontroluje pouta zvířete,"
 hunt.9001.opening_captive_courtier: "[hunt_participant.GetShortUINameNoFormat] zkontroluje pouta zvířete,"
 hunt.9001.opening_captive_self: "Zkontroluji pouta zvířete,"
 hunt.9001.opening_master_of_hunt: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], dohlíží na porcování,"
 hunt.9001.opening_courtier: "[hunt_participant.GetShortUINameNoFormat] dohlíží na porcování,"
 hunt.9001.opening_self: "Dohlížím na porcování,"
 hunt.9001.opening_captive: " hlídá svázaného [host.Custom('GetAnimalTypeCaptive')] a udílí pokyny sluhům, kteří jej opatrně odnášejí."
 hunt.9001.opening_master: " mistrovsky stahuje mršinu z kůže, aniž by se [Select_CString(hunt_participant.IsFemale,'potřísnila','potřísnil')] jedinou kapkou krve."
 hunt.9001.opening_skilled: " obratně a rychle stahuje mršinu z kůže."
 hunt.9001.opening_beginner: " opatrně stahuje mršinu z kůže podle pokynů správců lovu."
 hunt.9001.opening_novice: " neobratně se pouští do stahování mršiny z kůže, než práci raději přenechá správcům lovu."
 hunt.9001.opening: "Dohlížím na porcování a odměňuji psy jejich podílem z kořisti."
 hunt.9001.opening_falconry: " hojná kořist a zároveň důkaz dobrého výcviku našich ptáků."
 hunt.9001.credit_self: "Není to žádná velká bestie, ale [Select_CString(ROOT.Char.IsFemale,'skolila jsem ji vlastní rukou','skolil jsem ji vlastní rukou')].\n\n"
 hunt.9001.credit_self_big: "Když tu teď stojím, jen těžko věřím, že [Select_CString(ROOT.Char.IsFemale,'jsem tu bestii skolila sama','jsem tu bestii skolil sám')].\n\n"
 hunt.9001.credit_other: "[credit_taker.GetFirstName] má ze svého úlovku obzvlášť velkou radost.\n\n"
 hunt.9001.credit_other_big: "[credit_taker.GetFirstName] odvedl[Select_CString(credit_taker.IsFemale,'skvělou práci při skolení tak mohutné bestie','skvělou práci při skolení tak mohutné bestie')].\n\n"
 hunt.9001.credit_shared: "Kořist sice nebyla velká, ale družinu přesto naplňuje uspokojení z dobrého lovu.\n\n"
 hunt.9001.credit_shared_big: "Jen máloco se vyrovná vzrušení ze skolení mohutné bestie.\n\n"
 hunt.9001.opening_compassionate: "Nemohu se ubránit obdivu k [activity.Custom('GetAnimalType')], dokonce ani po smrti.\n\n"
 hunt.9001.opening_callous: "Ubohý [activity.Custom('GetAnimalType')] proti nám neměl žádnou šanci...\n\n"
 hunt.9001.opening_ambitious: "Už si představuji další hrdé bestie, které jen čekají, až budou uloveny...\n\n"
 hunt.9001.opening_content: "Tohle jsou chvíle, kterých je třeba si vážit: dobrá společnost a pořádný [activity.Custom('GetAnimalType')].\n\n"
 hunt.9001.opening_martial: "Povedená výprava. [activity.Custom('GetAnimalType')|U] nám poskytl malou ochutnávku nepředvídatelnosti bojiště.\n\n"
 hunt.9001.opening_learning: "Prohlížím si mršinu [activity.Custom('GetAnimalType')] a přemítám nad její anatomií a překvapivou inteligencí...\n\n"
 hunt.9001.desc_court_artifact: "Představuji si jeho kůži nebo lebku na stěnách svého dvora.\n\n"
 hunt.9001.desc_trinket: "Památka na dnešní den by uchovala vzpomínky při životě.\n\n"
 hunt.9001.desc_hunter_1: "Mám za sebou už pěknou řádku lovů a lidé kolem mě si toho začínají všímat – zprávy o mých loveckých výpravách se šíří!"
 hunt.9001.desc_hunter_2: "[ROOT.Char.Custom('TerrainType')|U] jsou jako můj druhý domov – vítr ve vlasech, čas strávený s dvořany, vzrušení, když se blížím ke kořisti... Modlím se, aby to nikdy neskončilo!"
 hunt.9001.desc_hunter_3: "Ať je kořist jakkoli rychlá, silná či mazaná, proti mně nemá šanci! O mém loveckém umění se mluví po celém panství. Skutečnou odměnou je však svoboda, kterou mi [ROOT.Char.Custom('TerrainType')] poskytují."
 hunt.9001.falconry: "Je škoda vracet se tak brzy, dokázal[Select_CString(ROOT.Char.IsFemale,'Dokázala bych v tom pokračovat celý den','Dokázal bych v tom pokračovat celý den')] bych v tom pokračovat celý den! Ptáci si však musí odpočinout."
 hunt.9001.desc_good_bad: "Navzdory několika obtížím po cestě dopadl lov velmi dobře!"
 hunt.9001.desc_good: "Takové lovy jsou čirá radost. Už se nemohu dočkat příštího roku!"
 hunt.9001.desc_bad_good: "Zdálo se, že se pokazilo všechno, co se pokazit mohlo, ale přece jen se našlo i něco dobrého."
 hunt.9001.desc_bad: "Naši družinu jako by stíhalo jedno neštěstí za druhým a téměř s úlevou nechávám [ROOT.Char.Custom('TerrainType')] za sebou."
 hunt.9001.desc_same: "Vyslyšet volání divočiny znamená vydat se za dobrodružstvím a tahle výprava nám nadělila dobrého i zlého vrchovatě!"
 hunt.9001.desc_fallback: "Vyslyšet volání divočiny bývá dobrodružství, ale musím přiznat, že tahle výprava byla poněkud nezapomenutelná."
 hunt.9001.spoils_captive: "\n\nSkolit divokou bestii je jedna věc, ale zajmout ji živou a nezraněnou je docela jiný výkon!"
 hunt.9001.spoils: "\n\nPodíl nedočkavých psů z kořisti položíme na roztaženou kůži a poté se vydáme zpět do tábora a domů."
 hunt.9001.spoils_falconry: "\n\nMůj [activity.Custom('GetRaptorType')] spokojeně požírá kousky masa jako odměnu za dnešní skvělý výkon, než se vydáme zpět do tábora a domů."
 hunt.9001.murder_secret: "[ROOT.Char.GetIntentTarget.GetFirstName] leží mrtvý[Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'mrtvá','mrtvý')] a nikdo netuší, že za tím stojím já...\n\n"
 hunt.9001.murder_public: "[ROOT.Char.GetIntentTarget.GetFirstName] leží mrtvý[Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'mrtvá','mrtvý')], přestože všichni vědí, že za to nesu odpovědnost...\n\n"
 hunt.9001.murder_dead: "[ROOT.Char.GetIntentTarget.GetFirstName] leží mrtvý[Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'mrtvá','mrtvý')], i když mou rukou nezemřel[Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'nezemřela','nezemřel')]...\n\n"
 hunt.9001.murder_fail: "Je rozhodně škoda, že [ROOT.Char.GetIntentTarget.GetFirstName] stále žije...\n\n"
 hunt.9001.woo_soulmate: "Mezi mnou a [ROOT.Char.GetIntentTarget.GetFirstName] vzniklo zvláštní pouto, jehož síla překvapila i mě...\n\n"
 hunt.9001.woo_lover: "[ROOT.Char.GetIntentTarget.GetFirstName] neměl[Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'proti mému svádění žádnou šanci','proti mému svádění žádnou šanci')]...\n\n"
 hunt.9001.woo_potential: "Podařilo se mi získat pozornost [ROOT.Char.GetIntentTarget.GetFirstName], ale jestli si chci získat srdce [woo_target.GetFirstNameNoTooltip], čeká mě ještě hodně práce...\n\n"
 hunt.9001.woo_fail: "Mé pokusy na [ROOT.Char.GetIntentTarget.GetFirstName] nezapůsobily... Budu muset zkusit jiný přístup...\n\n"
 hunt.9001.befriend_best: "S [ROOT.Char.GetIntentTarget.GetFirstName] jsme se rychle stali pevnými přáteli, což předčilo všechna má očekávání...\n\n"
 hunt.9001.befriend_friend: "[ROOT.Char.GetIntentTarget.GetFirstName] mou společnost přijímal[Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'velmi přívětivě','velmi přívětivě')]. Myslím, že se na [befriend_target.GetFirstNameNoTooltip] mohu spolehnout...\n\n"
 hunt.9001.befriend_potential: "Mezi mnou a [ROOT.Char.GetIntentTarget.GetFirstName] sice stále panuje jistá formálnost, ale přece jen jsme si o něco bližší než dříve...\n\n"
 hunt.9001.befriend_fail: "K získání důvěry [ROOT.Char.GetIntentTarget.GetFirstName] nemám o nic blíž. Něco zřejmě dělám špatně...\n\n"
 hunt.9001.a: "Vracíme se plni nových sil!"
 hunt.9001.b: "Udělali jsme, co jsme mohli..."
 hunt.9001.c: "Prozatím nechme toto dobrodružství za sebou."
 hunt.9001.d.choice: "Nechám si jen malou památku."
 hunt.9001.d: "Nechám si památku."
 hunt.9001.e: "Nechám si pero."
 hunt.9001.f: "[trophy_recipient.GetTitledFirstNameNoTooltip] tuhle trofej jistě ocení."
 hunt.9001.f.present: "[trophy_recipient.GetTitledFirstNameNoTooltip], tahle trofej je tvoje!"
 hunt.9001.g: "[animal_slayer.GetTitledFirstName] ji skolil[Select_CString(animal_slayer.IsFemale,'skolila','skolil')], takže patří [animal_slayer.GetFirstNameNoTooltip]."
 hunt.9002.t: "S prázdnou"
 hunt.9002.opening_master_of_hunt: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')], shromáždí zklamanou družinu a vyčerpané psy k cestě domů."
 hunt.9002.opening_courtier: "[hunt_participant.GetTitledFirstName] shromáždí zklamanou družinu a vyčerpané psy k cestě domů."
 hunt.9002.opening: "Shromáždím zklamanou družinu a vyčerpané psy k cestě domů."
 hunt.9002.opening_animal: "\n\n[activity.Custom('GetAnimalType')|U] nám skutečně unikl, #EMP tentokrát#!..."
 hunt.0540.t: "Správce lovu"
 hunt.0540.desc.intro: "Můj lov má každou chvíli začít a já stále nejmenoval[Select_CString(ROOT.Char.IsFemale,'nejmenovala','nejmenoval')] [ROOT.Char.Custom('GetHuntMasterDesc')]. Tyto povinnosti bych samozřejmě mohl[Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] převzít sám[Select_CString(ROOT.Char.IsFemale,'sama','sám')], ale každý dobrý [ROOT.Char.GetTitleAsNameNoTooltip|U] musí vědět, kdy je lepší svěřit úkol někomu jinému."
 hunt.0540.desc.hates_candidate_a: "Jakkoli to [Select_CString(ROOT.Char.IsFemale,'nerada','nerad')] přiznávám, [host.Custom2('InsultAdjective', ROOT.Char)] [moh_candidate_1.GetFirstName] má pro tuto pozici nejlepší předpoklady.\n\n"
 hunt.0540.desc.candidate_a: "Zdaleka nejvhodnějším kandidátem na tuto pozici je [moh_candidate_1.GetName] a očividně touží dokázat své schopnosti.\n\n"
 hunt.0540.desc.nepotism: "[moh_candidate_2.Custom2('MyCharacterIntroduction', ROOT.Char)|U] by však byl[Select_CString(moh_candidate_2.IsFemale,'byla stejně vhodnou a spolehlivou volbou','byl stejně vhodnou a spolehlivou volbou')], jakou si jen mohu přát.\n\n"
 hunt.0540.desc.enthusiasm: "[moh_candidate_3.Custom2('MyCharacterIntroduction', ROOT.Char)|U] má o tuto pozici obrovský zájem, přestože pro ni nemá tak dobré předpoklady jako [moh_candidate_1.GetFirstNameNoTooltip].\n\n"
 hunt.0540.desc.outro: "Nakonec ale nikoho jmenovat nemusím."
 hunt.0540.a: "[moh_candidate_1.GetFirstNameNoTooltip|U] je nejlepší kandidát."
 hunt.0540.b: "[moh_candidate_2.GetFirstNameNoTooltip|U] mohu důvěřovat."
 hunt.0540.c: "[moh_candidate_3.GetFirstNameNoTooltip|U] má nadšení."
 hunt.0540.d: "Nikoho nepotřebuji."
 friend_made_me_moh: "[CHARACTER.GetShortUIName|U] si [Select_CString(CHARACTER.IsFemale,'vysloužila','vysloužil')] věčnou vděčnost [TARGET_CHARACTER.GetShortUINamePossessive] udělením pozice $master_of_hunt_court_position$"
 friend_made_me_moh_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] si [Select_CString(TARGET_CHARACTER.IsFemale,'vysloužila','vysloužil')] věčnou vděčnost [CHARACTER.GetShortUINamePossessive] udělením pozice $master_of_hunt_court_position$"
 hunt.0550.t: "Budování tábora"
 hunt.0550.host: "Zatímco čekáme na příjezd ostatních hostů, mí [ROOT.Char.Custom('GetServants')] se pustí do příprav. [ROOT.Char.Custom('GetGameKeepers')|U] každý den prohledávají [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] a pátrají po známkách zvěře, zatímco blíže k lovišti vzniká tábor.\n\n"
 hunt.0550.guest: "Zatímco čekáme na příjezd ostatních hostů, [host.GetTitledFirstName] už zahájil[Select_CString(host.IsFemale,'zahájila','zahájil')] přípravy. [host.Custom('GetGameKeepers')|U] každý den prohledávají [activity.GetCurrentPhase.GetLocation.Custom('GetTerrainLandPlural')] a pátrají po známkách zvěře, zatímco blíže k lovišti budují tábor.\n\n"
 hunt.0550.nerge.host.desc: "Zatímco čekáme na příjezd ostatních hostů, mí [ROOT.Char.Custom('GetServants')] se pustí do příprav. [ROOT.Char.Custom('GetGameKeepers')|U] vybírají oblast, do níž účastníci při velkém Nerge shromáždí veškerou zvěř. Znalost krajiny je prvním z mnoha kroků k úspěchu.\n\n"
 hunt.0550.nerge.guest.desc: "Zatímco čekáme na příjezd ostatních hostů, [host.GetTitledFirstName] už zahájil[Select_CString(host.IsFemale,'zahájila','zahájil')] přípravy. [host.Custom('GetGameKeepers')|U] vybírají oblast, do níž účastníci při velkém Nerge shromáždí veškerou zvěř. Znalost krajiny je prvním z mnoha kroků k úspěchu.\n\n"
 hunt.0550.sighting: "Ti [activity.Custom('GetAnimalPlural')] jsou blízko... Cítím to..."
 hunt.0550.falconry: "Můj pták je z čekání stále neklidnější, jako by věděl, že jej brzy vypustím..."
 hunt.0550.legendary: "Někde tam venku čeká a pozoruje [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')]..."
 hunt.0550.nerge: "Můj kůň se na vyhlídky lovu těší stejně jako já. Ví, že nás v příštích dnech čekají velké výzvy."
 hunt.0550.standard: "Výstroj i koně jsem zkontroloval[Select_CString(ROOT.Char.IsFemale,'Výstroj i koně jsem zkontrolovala už mnohokrát','Výstroj i koně jsem zkontroloval už mnohokrát')] už mnohokrát. Už to nebude dlouho trvat..."
 hunt.0550.intent_arrived: "\n\n[ROOT.Char.GetIntentTarget.GetTitledFirstName] stále vůbec netuší, že mám v plánu [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetFirstNameNoTooltip]."
 hunt.0550.intent: "\n\n[ROOT.Char.GetIntentTarget.GetTitledFirstName] ještě [Select_CString(ROOT.Char.GetIntentTarget.IsFemale,'nedorazila','nedorazil')]. Brzy však budu moci uvést svůj plán [ROOT.Char.GetInvolvedActivityIntent.GetName|l] [ROOT.Char.GetIntentTarget.GetFirstNameNoTooltip] do pohybu."
 hunt.0550.a: "Brzy."
