l_polish:
 hunt.0050.t: "Volání divočiny"
 hunt.0050.desc: "Naháňky, špičáci, nory! Lov nabízí tolik věcí, které se lze naučit a užít si je – ovládnutí přírody, kamarádství, rituály a samozřejmě vzrušení!\n\nTéto vznešené, byť krvavé kratochvíli se přede mnou oddávalo už mnoho lidí. Začínám chápat proč..."
 hunt.0050.a: "Už se nemohu dočkat dalšího!"
 hunt.0050.b: "Jen bezvýznamné rozptýlení..."
 hunt.0080.t: "Předčasný konec"
 hunt.0080.t.inheritor: "Oběť divočiny"
 hunt.0080.imprisoned_self: "Teď když mě [ROOT.Char.GetImprisonedBy.GetTitledFirstName] bezpečně drží pod zámkem, můj lov zřejmě skončil..."
 hunt.0080.imprisoned: "Teď když [ROOT.Char.GetImprisonedBy.GetTitledFirstName] bezpečně drží [host.GetTitledFirstName] pod zámkem, budeme se zřejmě muset vrátit domů s prázdnou..."
 hunt.0080.wounded_self: "Kvůli mým zraněním bylo rozhodnuto lov ukončit a celá družina se vrátí domů."
 hunt.0080.wounded: "Kvůli zraněním, která [Select_CString(invalidated_flavor.IsFemale,'utrpěla','utrpěl')] [invalidated_flavor.GetTitledFirstName], bylo rozhodnuto lov ukončit a celá družina se vrátí domů."
 hunt.0080.assassination: "Den probíhá dobře, dokud [invalidated_flavor.GetTitledFirstName] náhle nezačne naléhat, abychom lov ukončili. Po těsném úniku má strach o svůj život. Mezi lidmi se už šíří zvěsti o pokusu o atentát."
 hunt.0080.abduction_attempt: "Když se družina blíží ke zvěři, dokonce i neustálé štěkání psů přehluší pronikavý křik.\n\n[Select_CString(invalidated_flavor.IsFemale,'Rozcuchaná','Rozcuchaný')] [invalidated_flavor.GetTitledFirstName] se prodere skrz [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], volá o pomoc a křičí, že se [Select_CString(invalidated_flavor.IsFemale,'ji','ho')] někdo pokusil unést!\n\n"
 hunt.0080.abduction: "Lov se zdál probíhat dobře, dokud si někdo nevšiml, že [invalidated_flavor.GetTitledFirstName] už není s družinou a nikde se [Select_CString(invalidated_flavor.IsFemale,'ji','ho')] nedaří najít.\n\nPři prohledávání [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] narazíme v [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] na známky zápasu."
 hunt.0080.assassination_culprit: "Už jsme téměř u kořisti, když se před námi náhle objeví [invalidated_flavor.GetTitledFirstName] v děsivém stavu – až dosud si nikdo ani nevšiml, že s námi není.\n\nMezi lapáním po dechu tvrdí, že jen o vlásek [Select_CString(invalidated_flavor.IsFemale,'unikla','unikl')] pokusu o atentát! Ještě šokující je však jméno, které zazní jako obvinění: [invalidated_culprit.GetTitledFirstName]!\n\n[invalidated_culprit.GetTitledFirstName] není nikde k nalezení a podle všeho z místa [Select_CString(invalidated_culprit.IsFemale,'uprchla','uprchl')]..."
 hunt.0080.abduction_attempt_culprit: "\n\n[invalidated_flavor.GetFirstNameNoTooltip] vzbudí pozdvižení, když z únosu obviní [invalidated_culprit.GetTitledFirstName], ale náhlé zmizení [invalidated_culprit.GetFirstNameNoTooltip] dodává obvinění na váze..."
 hunt.0080.abduction_culprit: "\n\nKdyž navíc záhadně chybí i [invalidated_culprit.GetTitledFirstName], jisté závěry se přímo nabízejí..."
 hunt.0080.death_inheritor: "Právě mi oznámili, že [host.GetTitledFirstName] [Select_CString(host.IsFemale,'zemřela','zemřel')]! Zdá se, že při lovu [host.GetDeathReason]."
 hunt.0080.death_inheritor_killer: "Konečně je ten mizerný [host.Custom2('InsultNoun', ROOT.Char)], [host.GetTitledFirstName], z cesty – a mou vlastní rukou."
 hunt.0080.death: "Po tragické smrti [invalidated_flavor.GetTitledFirstName], [Select_CString(invalidated_flavor.IsFemale,'která','který')] [invalidated_flavor.GetDeathReasonHideKiller], bylo rozhodnuto lov ukončit a celá družina se vrátí domů."
 hunt.0080.desc_inheritor: "\n\nJako [Select_CString(ROOT.Char.IsFemale,'nová','nový')] [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTier] mám po tomto nečekaném zvratu mnoho věcí, které je třeba zařídit..."
 hunt.0080.desc: "\n\nBudeme si zkrátka muset počkat na další lov..."
 hunt.0080.a: "Je to nebezpečná kratochvíle."
 hunt.0080.b: "Chci hlavu té bestie na své zdi!"
 hunt.0081.t: "Změna plánů"
 hunt.0081.sick: "V mém současném stavu by možná bylo nejlepší vrátit se domů, ke krbu a do teplé postele."
 hunt.0081.wounded: "Bolest mi ztěžuje jízdu a další námaha v tomto stavu by si určitě vybrala svou daň."
 hunt.0081.host: "\n\nNechci všechny zklamat, ale člověk musí dbát na své zdraví..."
 hunt.0081.guest: "\n\nByla by škoda přijít o zbytek lovu [host.GetTitledFirstName], ale stojí to za to riziko?"
 hunt.0081.a: "Myslím, že pro mě už lov skončil."
 hunt.0081.b: "Budu v pořádku..."
 hunt.0082.t: "Předčasně ukončeno"
 hunt.0082.a: "Hrůza!"
 hunt_wounded_guest_leaves_toast: "Zraněný host"
 hunt.0100.opening_desc: "Tímto tě zvu na velkolepý lov v [barony.GetNameNoTier]!"
 hunt.0101.desc: "Tímto tě zvu na lov v [barony.GetNameNoTier]! Bude to velkolepá událost hodná tvé ctěné přítomnosti."
 hunt.0102.desc: "Tímto tě zvu na lov v [barony.GetNameNoTier]! Čeká nás velkolepá podívaná, skvělý lov a dobrá společnost."
 hunt.0110.t: "Chabá účast"
 hunt.0110.desc: "Nemohu tomu uvěřit. Přes všechna má pozvání a přípravy na můj lov nedorazil ani jediný host.\n\nNevadí! Užiji si lov [Select_CString(ROOT.Char.IsFemale,'sama','sám')] – o to více slávy zbude pro mě!"
 hunt.0120.desc: "Nevím, proč jsi [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] mé pozvání, když jsi nakonec raději [Select_CString(ROOT.Char.IsFemale,'zamířila','zamířil')] na lov [other_host.GetTitledFirstName]. Ale věz, že na to nezapomenu."
 hunt.0500.t.sighting: "Stopování [activity.Custom('GetAnimalType')|U]"
 hunt.0500.t.boar: "Mohutný kanec"
 hunt.0500.t.hart: "Ušlechtilá kořist"
 hunt.0500.t.large: "Dobré vyhlídky"
 hunt.0500.t.small: "Chudá kořist"
 hunt_start_tt: "[host.GetShortUIName|U] bude pátrat po #V [activity.Custom('GetAnimalType')]#!"
 hunt_opening_master_of_hunt: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom('GetHuntMasterDesc')] [host.GetShortUINamePossessiveNoFormat], svolává družinu za úsvitu u"
 hunt_opening_hunt_leader: "[hunt_participant.GetTitledFirstName] svolává družinu za úsvitu u"
 hunt_opening: "Družina je za úsvitu svolána u"
 hunt_opening_rural: "tábora v [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] poblíž [host.GetCurrentLocation.GetNameNoTooltip]."
 hunt_opening_hunting_grounds: "loveckého revíru v [activity.GetCurrentPhase.GetLocation.GetTitle.GetBaseNameNoTierPossessiveNoTooltip] [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]."
 hunt_opening_royal_reserves: "královské obory v [activity.GetCurrentPhase.GetLocation.GetTitle.GetBaseNameNoTierPossessiveNoTooltip] [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]."
 hunt_opening_entourage_few: "Po sesbírání kusých zpráv od několika místních hajných se začíná mluvit o nedalekých stopách a pachu zvěře."
 hunt_opening_entourage_normal: "Místní hajní důkladně prohledali okolí a pátrali po čerstvých stopách a pachu zvěře."
 hunt_opening_entourage_many: "Mí početní hajní a honci důkladně pročesali okolí a pátrali po stopách a pachu zvěře."
 hunt.0500.boar: "V okolí se očividně pohybuje statný kanec – nebezpečná, ale hodnotná kořist."
 hunt.0500.hart: "Zdá se, že se v okolí pohybuje mohutný jelen – kořist hodná lovu!"
 hunt.0500.roe: "Nedaleko se očividně pohybuje mladý srnec [activity.Custom('GetAnimalType')], ale po větší zvěři nejsou žádné čerstvé stopy."
 hunt.0500.buck: "V okolí se určitě pohybuje statný srnec a podmínky pro jeho lov snad ani nemohou být lepší!"
 hunt.0500.bison: "Nedaleko je stádo [activity.Custom('GetAnimalType')] a mezi nimi i mohutný býk!"
 hunt.0500.no_bison: "Prý nejsou v okolí žádné stopy po samci ani stádu bizonů, ačkoli zdejší krajina #EMP je#! pro lov [activity.Custom('GetAnimalType')] vhodná."
 hunt.0500.no_deer: "Ačkoli se v okolí bohužel neobjevily žádné stopy po samci, [activity.Custom('GetAnimalPlural')] je tu očividně dostatek."
 hunt.0500.desc_prestigious: "\n\n[hunt_participant.GetFirstNameNoTooltip] se rozzáří. „Čeká nás pořádný lov!“"
 hunt.0500.desc_large: "\n\n[hunt_participant.GetFirstNameNoTooltip] se zazubí. „Tohle bude pořádná zábava!“"
 hunt.0500.desc_small: "\n\n[hunt_participant.GetFirstNameNoTooltip] pokrčí rameny. „Nevadí, i [activity.Custom('GetAnimalAdjective')] [activity.Custom('GetAnimalType')] může poskytnout skvělý lov!“"
 hunt_opening_sighting: "\n\nUvidíme, zda byly zvěsti pravdivé..."
 hunt.0500.guest: "\n\nNakonec se [host.GetTitledFirstName] [Select_CString(host.IsFemale,'rozhodla','rozhodl')], že dnes bude lovit [activity.Custom('GetAnimalType')]."
 hunt.0500.a: "Vyrazme!"
 hunt.0500.b: "Raději bych [Select_CString(ROOT.Char.IsFemale,'vyplašila','vyplašil')] lišku."
 hunt.0500.c: "Místo toho zaženeme do kouta mazaného zajíce."
 hunt.0500.d: "Mou kořistí bude [host.Custom('GetRegionalDeerType')]!"
 hunt.0500.f: "Chci lovit něco pořádně divokého!"
 hunt.0510.t: "[activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U]"
 hunt.0510.desc: "\n\nNic nenašli, ale já to cítím – ten nepolapitelný tvor je někde tam venku, docela blízko..."
 hunt.0510.a: "Ta bestie bude moje!"
 hunt.0520.t.sighting: "Obtížný [activity.Custom('GetAnimalType')|U]"
 hunt.0520.t.tiger: "Felis Horribilis"
 hunt.0520.t.lion: "Zlatá hříva"
 hunt.0520.t.leopard: "Skvrnitá kořist"
 hunt.0520.t.lynx: "Elegantní kořist"
 hunt.0520.t.bear: "Medvěd na obzoru"
 hunt.0520.t.hyena: "Kdo se směje teď?"
 hunt.0520.t.wolf: "Smečka škůdců"
 hunt.0520.b: "Přiveďte mého [ROOT.Char.Custom('GetAnimalTypeCaptive')]! Jdeme lovit!"
 hunt.0520.c: "Někde tady přece musí být nějací [ROOT.Char.Custom('GetRegionalWolfPlural')]."
 hunt.0530.t.sighting: "Na lovu [activity.Custom('GetAnimalPlural')|U]"
 hunt.0530.t.rare: "Exotičtí ptáci"
 hunt.0530.t.common: "Na křídlech"
 hunt.0530.b: "[activity.Custom('GetAnimalTypeWaterfowl')|U] mi bude stačit."
 hunt.0530.c: "Vždycky se najde nějaký [activity.Custom('GetAnimalTypeGamebird')], kterého lze ulovit."
 hunt.0530.d: "Chci vidět, jak můj [activity.Custom('GetRaptorType')] skolí zajíce."
 hunt_opening_falconry_sighting: "\n\nDoufejme, že zprávy byly spolehlivé."
 hunt_opening_falconry: "S trochou štěstí najdeme [activity.Custom('GetAnimalGroup')] [activity.Custom('GetAnimalPlural')] a naši [activity.Custom('GetRaptorPlural')] si skvěle zaloví."
 hunt_opening_entourage_few_falconry: "\n\nTěch několik honců, které jsme přivedli, je připraveno se psy a už našli vhodnou trasu."
 hunt_opening_entourage_normal_falconry: "\n\nSkupiny honců jsou připraveny se psy a bylo vybráno vhodné místo."
 hunt_opening_entourage_many_falconry: "\n\nMí honci by neměli mít problém vyplašit ptáky z úkrytů a vytipovali několik slibných míst."
 hunt_opening_standard_sighting: "\n\nMí lidé shromažďovali zprávy o výskytu [activity.Custom('GetAnimalType')] v okolí."
 hunt_opening_dangerous_sighting: "\n\nMí lidé shromažďovali zprávy o výskytu [activity.Custom('GetAnimalType')], který v poslední době terorizuje okolí."
 hunt_opening_dangerous: "\n\nV poslední době se po okolí potuluje drzý [activity.Custom('GetAnimalType')] a terorizuje místní."
 hunt.0520.cat: "Ta bestie už připravila o život několik místních a každým dnem, kdy se může volně potulovat, je troufalejší."
 hunt.0520.bear: "Slídí mezi [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')], odnáší dobytek z okolních vesnic a děsí sběrače."
 hunt.0520.wolf: "[activity.Custom('GetAnimalGroup')|U] působí potíže, plení statky a pak se stahuje hluboko mezi [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTreePlural')]."
 hunt_opening_entourage_few_dangerous: "S tak malým počtem lidí to může být obtížné, ale s trochou štěstí bestii najdeme a ukončíme její řádění."
 hunt_opening_entourage_normal_dangerous: "Mělo by nás být #EMP dost#!, abychom bestii bez větších potíží našli a zahnali do kouta."
 hunt_opening_entourage_many_dangerous: "Máme dost očí a ještě více kopí – dneškem řádění té bestie skončí!"
 hunt.0520.a: "Není času nazbyt."
 hunt_header: "[ROOT.Char.Custom('HuntHeader')]:"
 hunt.1001.t: "Zahnaný [activity.Custom('GetAnimalType')|U]"
 hunt.1001.desc_opening_courtier: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], si jako první všimne [activity.Custom('GetAnimalFeature')]."
 hunt.1001.desc_opening: "Rozhlížím se po krajině, když se náhle zarazím. Tamhle je, i s [activity.Custom('GetAnimalFeature')]!"
 hunt.1001.desc_opening_courtier_plural: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], si jako první všimne [activity.Custom('GetAnimalGroup')]."
 hunt.1001.desc_opening_plural: "Rozhlížím se po krajině, když se náhle zarazím. Tamhle je [activity.Custom('GetAnimalGroup')]!"
 hunt.1001.bison: "\n\nOpatrně rozmístíme družinu a vrhneme se na [activity.Custom('GetAnimalSoundParticiple')] zvířata, přičemž od vyděšené skupiny oddělíme statného [activity.Custom('GetAnimalMale')].\n\n"
 hunt.1001.desc: "\n\n[activity.Custom('GetAnimalAdjective')] [activity.Custom('GetAnimalMale')] se špatně rozeznává, ale není pochyb, že tam je a pozoruje nás skrz [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')].\n\n"
 hunt.1001.closing_chase: "[host.GetTitledFirstName] vyrazí za bestií a vykřikne: „Za ní, uniká nám!“"
 hunt.1001.closing_ambush: "[host.GetTitledFirstName] se na okamžik zamyslí a pak ukáže doleva. „Tudy, odřízneme jí cestu!“"
 hunt.1001.closing_herd: "Shromáždíme se mezi osamělým [activity.Custom('GetAnimalType')] a prchajícím [activity.Custom('GetAnimalGroup')]. Teď začíná skutečná štvanice!"
 hunt.1001.closing: "Naše pohledy se střetnou a zvíře, jako by vycítilo můj úmysl, náhle vyrazí a v mžiku zmizí v záplavě [activity.Custom('GetAnimalColor')] srsti!"
 hunt.1001.desc_opening_courtier_dangerous: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], zahlédne [activity.Custom('GetAnimalType')], jak nás z dálky pozoruje s napjatým tělem, připravený vyrazit."
 hunt.1001.desc_opening_dangerous: "Prohlížím si [host.GetCurrentLocation.Custom('GetTerrainType')] a náhle ji spatřím, jako by tam byla celou dobu – [activity.Custom('GetAnimalType')]!"
 hunt.1001.desc_opening_courtier_plural_dangerous: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], ukáže přes [host.GetCurrentLocation.Custom('GetTerrainType')] – v nedaleké prohlubni se krčí celý [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalGroup')]."
 hunt.1001.desc_opening_plural_dangerous: "Prohlížím si [host.GetCurrentLocation.Custom('GetTerrainType')] a náhle je spatřím, jako by tam byla celou dobu – [activity.Custom('GetAnimalGroup')]!"
 hunt.1001.wolf: "\n\nJakmile se přiblížíme, bestie vyskočí, [activity.Custom('GetAnimalSoundParticiple')] na poplach a ustupují do [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], přičemž [activity.Custom('GetAnimalDanger')] vrčí.\n\n"
 hunt.1001.desc_dangerous: "\n\n[activity.Custom('GetAnimalAdjective')] bestie je úchvatný pohled. Koně začnou být neklidní, jakmile mezi [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] zahlédnou její [activity.Custom('GetAnimalFeature')].\n\n"
 hunt.1001.closing_plural_dangerous: "Vyrazíme za prchající [activity.Custom('GetAnimalColor')] havětí a zaměříme se na největší kus ze skupiny. Teď začíná skutečná štvanice!"
 hunt.1001.closing_dangerous: "Bez varování [activity.Custom('GetAnimalChargePresent')] pryč a v záblesku [activity.Custom('GetAnimalColor')] srsti zmizí za vyvýšeninou!"
 hunt.1001.a: "Za ní! Jedeme!"
 hunt.1001.a.flavor_1: "#EMP Halali!#!"
 hunt.1001.a.flavor_2: "#EMP Za kořistí!#!"
 hunt.1001.a.flavor_3: "#EMP Hola!#!"
 hunt.1001.a.flavor_4: "#EMP Kupředu!#!"
 hunt.1001.a.tt: "Pravděpodobnost nehody se zvýší"
 hunt.1001.b: "Opatrně! Pozor na [host.GetCurrentLocation.Custom('GetRandomRegionalDanger')]!"
 hunt.1001.b.flavor: "#EMP Bezpečnost především!#!"
 hunt.1001.c: "Tudy, odřízneme jí cestu!"
 hunt.1001.c.flavor: "#EMP Lovci, zažeňte ji k naší linii lukostřelců!#!"
 hunt.1001.d: "Jdeme!"
 hunt.1002.desc: "Můj svět se smrskne na divočinu kolem nás, když nás psi vedou přes nerovný terén po stopě prchajícího [activity.Custom('GetAnimalType')].\n\n"
 hunt.1002.courtier: "Jedeme bok po boku s [hunt_participant.GetTitledFirstName] a slyším jen hřmění kopyt, štěkot psů a pokřikování mužů...\n\nVzrušení ve mně narůstá, jak se pomalu přibližujeme ke kořisti!"
 hunt.1002.alone: "Řítím se po stopě a slyším jen hřmění kopyt, štěkot psů a pokřikování mužů...\n\nVzrušení ve mně narůstá, jak se pomalu přibližujeme ke kořisti!"
 hunt.1002.a: "No tak, [hunt_participant.GetFirstNameNoTooltip], rychleji!"
 hunt.1002.a.alone: "Už jsi tak blízko, skoro tě mám!"
 hunt.1003.desc: "Po hodinách jízdy konečně zaháníme mazanou bestii do úzkých – naše štvanice nebyla marná!\n\n"
 hunt.1003.bay: "Vyčerpané a vyděšené zvíře se konečně zastavilo a obrátilo proti nám, sotva stojí na nohou a v panice [activity.Custom('GetAnimalSoundParticiple')]."
 hunt.1003.dogs: "Unavený [activity.Custom('GetAnimalMale')] už nemůže dál. Jeden ze psů jej už pokousal a teď se strachy krčí, zatímco se k němu přibližují další psi, které jejich psovodi drží na uzdě."
 hunt.1003.dangerous: "Ať už vyčerpáním, nebo vzdorem, [activity.Custom('GetAnimalType')] se konečně zastaví, obrátí se k nám a vydá mohutné [activity.Custom('GetAnimalSound')]."
 hunt.1003.injured: "\n\n[wounded_courtier.GetTitledFirstName] bude pěkně zuřit, až zjistí, o co [Select_CString(wounded_courtier.IsFemale,'přišla','přišel')]!"
 hunt.1003.bison: "\n\nPohled na mohutného [activity.Custom('GetAnimalType')] z takové blízkosti, zvlášť když [activity.Custom('GetAnimalStrikeParticiple')] s takovou zuřivostí, nahání hrůzu i těm nejodvážnějším, ale psi a lovci ho řádně obklíčí."
 hunt.1003.boar: "\n\nHrdý [activity.Custom('GetAnimalType')] příšerně kvičí, nabroušené kly připravené rozpárat každého, kdo se přiblíží, zatímco jej váhavě obkličují psi a lovci."
 hunt.1003.hart: "\n\nMohutný [activity.Custom('GetAnimalType')] s hrozivě vztyčenými parohy má stále dost sil k boji a [activity.Custom('GetAnimalSoundParticiple')], zatímco jej obkličují psi a kopí."
 hunt.1003.deer: "\n\nVzduchem znějí lovecké rohy, štěkot psů a pokřik družiny, zatímco se kruh kolem vzdorujícího [activity.Custom('GetAnimalMale')] uzavírá."
 hunt.1003.fox: "\n\nVyděšený [activity.Custom('GetAnimalType')] si začíná uvědomovat, že už není úniku, zatímco se kolem něj rozestavují psi a lovci."
 hunt.1003.hare: "\n\nPořádně nás prohnal, a psy obzvlášť, když se hnal, kličkoval a ukrýval v každé prohlubni i křoví v [host.GetCurrentLocation.Custom('GetTerrainType')] – ale nakonec jsme ho dostali!"
 hunt.1003.claws: "\n\nLovci jej opatrně obkličují s napřaženými kopími, zatímco kolem sebe seká smrtícími drápy."
 hunt.1003.fangs: "\n\nLovci rychle obklíčí vrčící zvíře, které na mě zlostně hledí. Z odhalených tesáků mu kape zpěněná slina."
 hunt.1003.a: "Zastřelím ho."
 hunt.1003.a.small: "Počkejte! Chci si procvičit mušku."
 hunt.1003.a.flavor: "$hunt.1012.a.tt$"
 hunt.1003.b: "Skolím ho vlastní rukou!"
 hunt.1003.b.small: "Dorazím ho."
 hunt.1003.b.flavor: "#EMP Na, bestie!#!"
 hunt.1003.c: "[hunt_participant.GetFirstNameNoTooltip], tahle rána je tvoje."
 hunt.1003.d: "[ROOT.Char.Custom2('RelationToMeShort', hunt_participant)|U], ukaž nám, jak ho skolíš!"
 hunt.1003.d.good: "Dopřeji [intentee.GetFirstNameNoTooltip] tu čest."
 hunt.1003.d.bad: "[intentee.GetFirstNameNoTooltip]! Kořist je tvoje!"
 hunt.1003.d.small: "Opatrně s tímhle, [ROOT.Char.Custom2('RelationToMe', hunt_participant)]!"
 hunt.1003.e: "Připravit kopí! Vpřed!"
 hunt.1003.e.flavor: "#EMP Dva zleva, dva zprava!#!"
 hunt.1003.f: "Vypusťte psy!"
 hunt.1003.f.flavor: "#EMP Zasloužili si to!#!"
 hunt.1003.f.success: "Psi bestii skolí"
 hunt.1003.f.killed: "...ale bestie je zřídí"
 hunt.1003.g: "Dost! Nechte to ubohé zvíře jít."
 hunt.1003.g.flavor: "#EMP Ulovili jsme ho, není třeba prolévat jeho krev...#!"
 hunt.1003.h: "Lovci, vpřed, zabijte ho!"
 hunt.1003.h.flavor: "#EMP Já... se postarám, aby vám neunikl...#!"
 hunt.1003.i: "Rychle, [murder_target.GetFirstNameNoTooltip], se mnou, než nám uteče!"
 hunt.1003.i.flavor: "#EMP Byla by škoda, kdyby mi kopí uklouzlo...#!"
 hunt.1003.j: "Chci ho #EMP živého#!!"
 hunt.1004.desc: "Sotva té zatracené bestii stačíme, jak se proplétá a kličkuje skrz [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] a divoce [activity.Custom('GetAnimalSoundParticiple')].\n\nVyšplhá na vyvýšeninu a zmizí v hustém houští. [activity.Custom('GetAnimalType')|U] je pryč stejně rychle, jako se objevil, a po štvanici nám zbyli jen udýchaní psi a zpocení koně."
 hunt.1004.wounded: "\n\n„Možná nebylo moudré čekat na [hunt_participant.GetTitledFirstName]..."
 hunt.1004.wounded_host: "\n\nJaká zatracená sm- *ach* smůla... Možná jsem se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] vrátit do tábora..."
 hunt.1004.a: "Ta zatracená bestie je pryč!"
 hunt.1004.a.tt: "Jen počkej!"
 hunt.1004.b: "[Select_CString(wounded_guest.IsFemale,'Ta hlupačka','Ten hlupák')] [wounded_guest.GetFirstNameNoTooltip] nás [Select_CString(wounded_guest.IsFemale,'zdržela','zdržel')]!"
 hunt.1005.t: "Kopí pro [murder_target.GetFirstNameNoTooltip]"
 hunt.1005.opening: "Obklíčíme [activity.Custom('GetAnimalSoundParticiple')] [activity.Custom('GetAnimalType')] se vztyčenými kopími, ale já sleduji [murder_target.GetFirstName], [ROOT.Char.Custom2('RelationToMe', murder_target)], a čekám na vhodnou příležitost...\n\n"
 hunt.1005.opportunity: "Když vyděšený [activity.Custom('GetAnimalMale')] náhle [activity.Custom('GetAnimalStrikePresent')],"
 hunt.1005.desc: "Obratně se svalím na [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')] a mé „neovladatelné“ kopí přitom švihne do strany přes hrdlo [murder_target.GetFirstNamePossessiveNoTooltip] tak rychle, že není čas uhnout – skoro ani postřehnout, co se stalo.\n\nŠokovaná družina se zarazí, zatímco [hunt_participant.GetFirstNameNoTooltip] si nevěřícně svírá ránu. „Pomoc!“ vykřiknu. „[murder_target.GetFirstNameNoTooltip] je [Select_CString(murder_target.IsFemale,'zraněná','zraněný')]!“ Pak se postavím mezi [murder_target.GetFirstNameNoTooltip] a [activity.Custom('GetAnimalType')].\n\nKdyž se prach usadí, všichni jsou přesvědčeni, že šlo jen o tragickou nehodu..."
 hunt.1005.a: "#EMP Jak#! se to jen mohlo stát...?"
 hunt.1006.desc: "Přesvědčivě zavrávorám stranou, abych [Select_CString(ROOT.Char.IsFemale,'uhnula','uhnul')], a mé kopí se zabodne přímo do boku ječícího [murder_target.GetFirstNamePossessive]!\n\nNení to sice tak smrtící zásah, jak jsem [Select_CString(ROOT.Char.IsFemale,'doufala','doufal')], ale s trochou štěstí si rána vybere svou daň. [activity.Custom('GetAnimalMale')] dorazíme, zatímco [murder_target.GetFirstNameNoTooltip] odnášejí pryč..."
 hunt.1006.a: "Klikaři! [Select_CString(murder_target.IsFemale,'Měla','Měl')] jsi být [Select_CString(murder_target.IsFemale,'mrtvá','mrtvý')]!"
 hunt.1006.b: "Promiň! [participant_to_blame.GetFirstNameNoTooltip] do mě [Select_CString(participant_to_blame.IsFemale,'strčila','strčil')]!"
 hunt.1006.c: "Příště se mi nepleť do cesty, hlupáku!"
 hunt.1007.desc: "Předstírám ztrátu rovnováhy a mé kopí přejede [murder_target.GetFirstNameNoTooltip] po boku. [murder_target.GetFirstNameNoTooltip] bolestivě ucukne.\n\nOkamžitě je jasné, že šlo jen o škrábnutí, ale šokovaný pohled [murder_target.GetFirstNameNoTooltip] a pozdvižená obočí ostatních lovců si žádají vysvětlení, jakmile dorazíme [activity.Custom('GetAnimalMale')]..."
 hunt.1007.a: "Jejda! #weak *pokrčení ramen*#!"
 hunt.1007.a.success: "[murder_target.GetFirstNameNoTooltip] má podezření"
 hunt.1007.a.failure: "[murder_target.GetFirstNameNoTooltip] ti důvěřuje"
 hunt.1007.b: "Můžeš být [Select_CString(murder_target.IsFemale,'ráda','rád')], že to nebylo horší."
 hunt.1007.c: "K čertu s tím, teď zkus uhnout #EMP tomuhle#!, ničemo!"
 hunt.1007.d: "Moc mě to mrzí, [murder_target.GetFirstNameNoTooltip]!"
 hunt.1007.e: "[Select_CString(ROOT.Char.IsFemale,'Řekla','Řekl')] bych, že už mi nic nedlužíš."
 hunt.1008.desc: "Snažím se dostat do pozice, odkud bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] „náhodou“ rychle bodnout, ale [murder_target.GetFirstNameNoTooltip] ani chvíli nepostojí na místě...\n\nNež se naději, družina už [activity.Custom('GetAnimalMale')] smrtelně zranila a další „nehoda“ by byla příliš směšná, než aby jí někdo uvěřil..."
 hunt.1008.a: "Sakra..."
 hunt.1009.desc: "Když [activity.Custom('GetAnimalType')] zmizí v [host.GetCurrentLocation.Custom('GetTerrainType')], je mi jasné, že kořist je ztracena."
 hunt.1009.desc_injured: "\n\nJe politováníhodné, že se [hunt_participant.GetTitledFirstName] kvůli uniklému [activity.Custom('GetAnimalType')] [Select_CString(hunt_participant.IsFemale,'zranila','zranil')], ale právě taková rizika patří ke vzrušení z lovu."
 hunt.1009.desc_uninjured: "\n\nSesedneme, abychom nechali koně odpočinout, a [hunt_participant.GetTitledFirstName] soucitně pokývne hlavou."
 hunt.1011.t: "Drzý vazal"
 hunt.1011.desc_horse: "Právě když [nice_courtier.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', nice_courtier)], začíná sesedat a nohy ještě visí ze sedla, [murder_target.GetTitledFirstName], [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [ROOT.Char.Custom2('RelationToMe', murder_target)], úmyslně vrazí do koně [nice_courtier.GetFirstNameNoTooltip] a pošle [nice_courtier.GetFirstNameNoTooltip] k zemi."
 hunt.1011.desc_talk: "Když společně pomalu jedeme, zaslechnu za sebou [murder_target.GetTitledFirstName], jak ze sedla loveckého koně zasyčí:\n\n„Podívejte se na toho [nice_courtier.Custom2('InsultAdjective', SCOPE.sC('murder_target'))] [nice_courtier.Custom2('InsultNoun', SCOPE.sC('murder_target'))]!“\n\n[murder_target.GetTitledFirstName] ukáže na [nice_courtier.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', nice_courtier)]. Na [nice_courtier.GetFirstNameNoTooltip] je vidět, že urážky nese těžce."
 hunt.1011.a: "Chováš se jako dítě, a tak budeš také [Select_CString(murder_target.IsFemale,'potrestána','potrestán')]."
 hunt.1011.b: "Takhle se [murder_target.GetTitleTierName] chovat nemá."
 hunt.1011.c: "Ha! [nice_courtier.GetFirstNameNoTooltip] zrudl[Select_CString(nice_courtier.IsFemale,'a','')] jako řepa!"
 hunt.1012.t: "Šíp pro [murder_target.GetFirstNameNoTooltip]"
 hunt.1012.opening: "Luk v ruce, tiché kroky, oči upřené na [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], zatímco čekám na [activity.Custom('GetAnimalType')]... Zhluboka se nadechnu a – není to [murder_target.GetTitledFirstName]?\n\n"
 hunt.1012.desc: "[murder_target.GetTitledFirstName], [ROOT.Char.Custom2('DescriptorNegative', murder_target)] [ROOT.Char.Custom2('RelationToMe', murder_target)], se krčí přede mnou v [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] a plně se soustředí na blížícího se [activity.Custom('GetAnimalMale')].\n\n"
 hunt.1012.accomplice: "Pohlédnu na [accomplice.GetFirstName], [Select_CString(accomplice.IsFemale,'která téměř neznatelně přikývne','který téměř neznatelně přikývne')]. S odhodlaně svraštělým obočím čeká na můj signál."
 hunt.1012.alone: "Nenápadně se rozhlédnu – lepší příležitost už možná nedostanu..."
 hunt.1012.closing: "[activity.Custom('GetAnimalMale')|U] se blíží, už je téměř u nás..."
 hunt.1012.a: "Taková škoda, že jsem [murder_target.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]..."
 hunt.1012.a.accomplice: "Taková škoda, že jsme [murder_target.GetFirstNameNoTooltip] neviděli..."
 hunt.1012.a.tt: "#EMP Cvak!#!"
 hunt.1012.b: "Ne, teď není vhodná chvíle..."
 hunt.1012.b.flavor: "#EMP Čas [murder_target.GetFirstNameNoTooltip] ještě přijde...#!"
 hunt.1013.desc: "„[Select_CString(ROOT.Char.IsFemale,'Snažila jsem se','Snažil jsem se')] zasáhnout, ale než se naděju, [activity.Custom('GetAnimalType')] [murder_target.GetFirstNameNoTooltip] ušlape! Alespoň [murder_target.GetFirstNameNoTooltip] [Select_CString(murder_target.IsFemale,'nemusela','nemusel')] zemřít [Select_CString(murder_target.IsFemale,'sama','sám')]...“\n\nOstatní jsou naštěstí k mému líčení tragického skonu [murder_target.GetTitledFirstNamePossessive] pozoruhodně nevšímaví.\n\n„[Select_CString(ROOT.Char.IsFemale,'Kéž bych bývala mohla udělat víc','Kéž bych býval mohl udělat víc')]...“"
 hunt.1013.a: "To je nemyslitelné! Lov končí!"
 hunt.1013.b: "Tragédie. A teď, kde je ten [activity.Custom('GetAnimalType')]?"
 hunt.1014.desc: "Když se [murder_target.GetTitledFirstName] vypotácí z [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] a svírá si krvácející paži, vzhlédnu od měchu s vodou a velmi přesvědčivě zalapám po dechu.\n\n„#EMP Kdo#! se pořád ještě nenaučil, že máme střílet #EMP po bestii#!?!“ rozzuřeně vykřikne [murder_target.GetTitledFirstName], když se přiblíží."
 hunt.1014.a: "V tom případě to byla dokonalá trefa, ne?"
 hunt.1014.all_honorable_hunt_participants: "Čestní účastníci [activity.GetShortName]:"
 hunt.1014.all_who_dislike_or_are_evil: "Účastníci [activity.GetShortName], kteří nemají rádi [murder_target.GetShortUIName] nebo mají potěšení z utrpení:"
 hunt.1014.b: "[Select_CString(participant_to_blame.IsFemale,'Nebyla','Nebyl')] [participant_to_blame.GetFirstNameNoTooltip] hned za tebou...?"
 hunt.1014.c: "Chceš snad svou vlastní nešikovnost svést na nás?"
 hunt.1015.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip]?! Argh! Jste to vy, [ROOT.Char.Custom('FormOfAddressForLiege')]?“\n\n[murder_target.GetTitledFirstName] vytřeští oči a střídavě hledí na luk v mé ruce a šíp zabodnutý ve své paži.\n\n„Na co jste [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]?!“"
 hunt.1015.a: "Proboha, musíme se na tu paži podívat!"
 hunt.1015.b: "Uděláš nejlépe, když na tohle všechno #EMP zapomeneš#!."
 hunt.1015.c: "Dvakrát neminu."
 hunt.1015.d: "Byla to... nešťastná náhoda."
 hunt.1015.e: "Mám způsoby, jak zařídit, aby [murder_target.GetFirstNameNoTooltip] [Select_CString(murder_target.IsFemale,'zapomněla','zapomněl')]."
 hunt.1016.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip], jste to #EMP vy#!?!“\n\n[murder_target.GetTitledFirstName] pohlédne na můj luk, pak na šíp zabodnutý do země u svých nohou a zase zpátky.\n\n„Ha! Jako obvykle máte potíže s muškou, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 hunt.1016.a: "Jen počkej, [murder_target.GetFirstNameNoTooltip]..."
 hunt.1021.t: "Daleko od lidí"
 hunt.1021.desc: "Daleko od ostatních narazím na chalupu, v níž žije jeden z nejkrásnějších lidí, jaké jsem kdy spatřil[Select_CString(ROOT.Char.IsFemale,'a','')].\n\n[beautiful_peasant.GetFirstNameNoTooltip] mě pozve dovnitř, abych si odpočinul[Select_CString(ROOT.Char.IsFemale,'a','')], a překvapuje mě, kolik toho mám s obyčejným venkovanem společného.\n\n„Musíte se k lovu vracet tak brzy, [ROOT.Char.Custom('FormOfAddressForLiege')]? Nikdy jsem nepotkal[Select_CString(beautiful_peasant.IsFemale,'a','')] nikoho, jako jste vy...“"
 hunt.1021.a: "Možná bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] zůstat ještě #EMP chvilku#!..."
 hunt.1021.b.thrill: "Čeká na mě mnohem vzrušující kořist!"
 hunt.1021.b.purpose: "Jsem tu kvůli lovu, ničemu jinému."
 hunt.1021.b.appropriate: "To by bylo naprosto nevhodné!"
 hunt.1021.b.cruel: "Zůstat s tebou, špinavým sedlákem?!"
 hunt.1021.c: "Prosím, [beautiful_peasant.GetFirstNameNoTooltip], dovol mi zajistit ti místo u [ROOT.Char.Custom('GetCourt')]."
 hunt.1021.c.success: "Život u [ROOT.Char.Custom('GetCourt')|U]"
 hunt.1021.c.failure: "Prostý život"
 hunt.1021.c.failure_tt: "[beautiful_peasant.GetFirstNameNoTooltip] zůstane v lese"
 hunt.1021.d: "Prosím, [beautiful_peasant.GetFirstNameNoTooltip], dovol mi zajistit ti místo u [ROOT.Char.Custom('GetCourt')]."
 every_consort_tt: "Každá [Concept('spouse','choť')|E] a každý [Concept('lover','milenec')|E]"
 hunt.1022.t: "Úsvit v ústraní"
 hunt.1022.desc: "Když se chystám k odchodu, v mysli mi stále zůstává vzpomínka na krásnou tvář [beautiful_peasant.GetFirstNameNoTooltip] zkřivenou vášní. [beautiful_peasant.GetFirstNameNoTooltip] hladí kožešinu, na níž jsme leželi, a sleduje mě.\n\n„Nemusí to být jediná noc, kterou spolu strávíme,“ pronese svůdně."
 hunt.1022.a: "Obávám se, že ano..."
 hunt.1022.a.tt: "#EMP Už se s [beautiful_peasant.GetFirstNameNoTooltip] nejspíš nikdy neuvidím...#!"
 hunt.1022.b: "Pojď se mnou a zůstaň u [ROOT.Char.Custom('GetCourt')]."
 hunt.1023.t: "Lovecký pes"
 hunt.1023.desc: "[ROOT.Char.Custom('DogStoryName')] klusá vedle mě a očividně si užívá čas strávený venku.\n\nNáhle se zastaví a začne štěkat. O několik okamžiků později zaslechnu, jak se něco prodírá podrostem. Něco velkého.\n\nŠtěkot [ROOT.Char.Custom('DogStoryName')] přejde ve vrčení právě ve chvíli, kdy nám [host.Custom('GetAnimalType')|l] vtrhne do cesty!"
 hunt.1023.a: "Do něj, [ROOT.Char.Custom('DogStoryName')]!"
 hunt.1023.a.good: "[ROOT.Char.Custom('DogStoryName')] skolí [host.Custom('GetAnimalType')|l]"
 hunt.1023.a.bad: "[ROOT.Char.Custom('DogStoryName')] v boji zahyne"
 hunt.1023.b: "Skolím ho osobně."
 hunt.1030.t: "V záloze"
 hunt.1030.desc: "Mí lovci objevili odlehlou mýtinu po větru od úkrytu bestie. Je to dokonalé místo, kde můžeme vytvořit linii lukostřelců a vyčkat na [activity.Custom('GetAnimalType')], kterého sem zaženou skupiny psů.\n\nByla by to skvělá příležitost procvičit si lukostřelbu na skutečném pohyblivém cíli."
 hunt.1030.guest: "Lovci ve službách [host.GetTitledFirstName] objevili odlehlou mýtinu po větru od úkrytu bestie. Je to dokonalé místo, kde můžeme vytvořit linii lukostřelců a vyčkat na [activity.Custom('GetAnimalType')], kterého sem zaženou skupiny psů.\n\n"
 hunt.1030.ambush: "Náš host se na okamžik zamyslí a pak přikývne. „Ano, připravíme malou léčku!“"
 hunt.1030.a: "Skvělý návrh."
 hunt.1030.b: "Ne, chci ho zahnat do kouta!"
 hunt.1030.c: "Jdeme!"
 hunt.1032.opening: "Ze skryté linie lukostřelců vyhlížíme [activity.Custom('GetAnimalType')] a napětí roste, jak se přibližuje pokřik honců a vytí psů.\n\n"
 hunt.1032.desc: "[activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalMale')] náhle vyskočí na mýtinu před námi, divoce mává [activity.Custom('GetAnimalDanger')] a v panice [activity.Custom('GetAnimalChargeParticiple')] přímo proti nám."
 hunt.1032.a: "Počkejte! Je #EMP můj#!!"
 hunt.1032.b: "Stát, ten patří [hunt_participant.GetFirstNamePossessiveNoTooltip]!"
 hunt.1032.e: "Teď! Všichni! #EMP PALTE!!#!"
 hunt.1032.e.tt: "[activity.Custom('GetAnimalType')|U] padne pod krupobitím šípů"
 hunt.1032.f: "#EMP Utíkejteee!!!#!"
 hunt.1033.desc: "Naše plány přišly vniveč. Bestie naši léčku vycítila po větru či nějakým šestým smyslem a honcům se ji nepodařilo zahnat do naší zálohy.\n\nNakonec jim unikla úplně a zmizela v [host.GetCurrentLocation.Custom('GetTerrainTypePlural')]..."
 hunt.1033.a: "Chytrá potvora..."
 hunt.1033.b: "Za všechno může [hunt_participant.GetFirstNameNoTooltip]!"
 hunt.1040.t: "Tiše, jen tiše"
 hunt.1040.desc: "Mí lovci tvrdí, že znají místo, kde se bestie ukrývá, i nedaleká napajedla a pastviny, které [activity.Custom('GetAnimalType')] navštěvuje.\n\nNebude to vůbec snadné, ale pokud se k [activity.Custom('GetAnimalMale')] opatrně přikrademe, možná jej dokážeme překvapit luky."
 hunt.1040.guest: "Lovci ve službách [host.GetTitledFirstName] tvrdí, že znají místo, kde se bestie ukrývá, i nedaleká napajedla a pastviny, které [activity.Custom('GetAnimalType')] navštěvuje.\n\n"
 hunt.1040.stealth: "Náš host chvíli přemýšlí a nakonec souhlasí, že se k nic netušícím bestiím přikrademe."
 hunt.1040.chase: "Náš host chvíli přemýšlí a pak se ušklíbne. „Přijel jsem na skutečný lov! Budeme lovit silou, ne plížením!“"
 hunt.1040.a: "Přikrademe se k nim!"
 hunt.1040.a.flavor: "#EMP Ztište psy! Pst!#!"
 hunt.1040.b: "Pche, skuteční lovci zaženou kořist do kouta!"
 hunt.1040.b.flavor: "#EMP Kdo tam bude poslední, čistí psinec!#!"
 hunt.1040.c: "Budiž."
 hunt.1043.desc: "Přes veškerou snahu se nám nepodařilo dostat dostatečně blízko k [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalGroup')]. Pokaždé nás vycítili, dali se na útěk a ukryli se.\n\nUž je téměř příliš velká tma, než abychom mohli pokračovat. Budeme muset přiznat, že mě porazili [activity.Custom('GetAnimalPlural')]..."
 hunt.1043.a: "Nelze vyhrát pokaždé..."
 hunt.1043.b: "Tohle je pěkný debakl, [hunt_participant.GetFirstNameNoTooltip]!"
 hunt.1060.t: "Vzhůru do vzduchu"
 hunt.1060.desc_opening_courtier: "[hunt_participant.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', hunt_participant)], pokyne družině, aby ztichla. Dorazili jsme na místo, které správci lovu určili k vypuštění dravců."
 hunt.1060.desc_opening: "Mí správci lovu pokynou družině, aby ztichla. Dorazili jsme na místo určené k vypuštění dravců."
 hunt.1060.desc_guest: "Správci lovu ve službách [host.GetTitledFirstName] pokynou družině, aby ztichla. Dorazili jsme na místo určené k vypuštění dravců."
 hunt.1060.exotic: "\n\nNedaleko od nás prolétá oblohou [activity.Custom('GetAnimalGroup')] [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')] a jejich vzdálené [activity.Custom('GetAnimalSoundParticiple')] ohlašuje začátek našeho lovu!"
 hunt.1060.water: "\n\nMáme ničím nerušený výhled na [activity.Custom('GetAnimalGroup')] [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')], kteří se napájejí v nedalekém rybníku."
 hunt.1060.ground: "\n\nZ našeho stanoviště vidíme před sebou několik [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')], jak se procházejí v [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]."
 hunt.1060.hare: "\n\nZ našeho stanoviště vidíme před sebou několik [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')] v [host.GetCurrentLocation.Custom('GetTerrainType')]."
 hunt.1060.closing: "\n\nDružina se zastaví a my se chystáme sejmout našim dravcům čapky a jednoho po druhém je vypustit na lov!"
 hunt.1060.beaters: "Honci budou brzy na místě, připraveni vyplašit zvěř a donutit ji vzlétnout."
 hunt.1060.a: "Leť přesně, maličký."
 hunt.1060.b: "Chci se jen dívat."
 hunt.1060.b.flavor: "#EMP Bezpečnost především!#!"
 hunt.1060.d: "Je čas!"
 hunt.1062.t.hare: "Zajíc v hrsti"
 hunt.1062.t: "Pták v hrsti"
 hunt.1062.desc: "S nadšením sleduji, jak si můj [activity.Custom('GetRaptorType')] vybere cíl, vzlétne ze svého stanoviště a vyšplhá vysoko k obloze."
 hunt.1062.guest: "[host.GetTitledFirstName] s nadšením sleduje, jak [activity.Custom('GetRaptorType')] vybere cíl, vzlétne ze svého stanoviště a vyšplhá vysoko k obloze."
 hunt.1062.exotic: "\n\n[activity.Custom('GetRaptorType')|U] stoupá do správné výšky a pronásleduje [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalGroup')]. Všechno probíhá dokonale! Vyděšená kořist se rozprchne a [activity.Custom('GetAnimalSoundParticiple')] na poplach, ale už je pozdě!"
 hunt.1062.water: "\n\nHonci rozehnali [activity.Custom('GetAnimalSoundParticiple')] [activity.Custom('GetAnimalColor')] [activity.Custom('GetAnimalPlural')], kteří teď naplňují vzduch zběsilým máváním křídel."
 hunt.1062.ground: "\n\n[activity.Custom('GetAnimalPlural')|U] nic netuší, zatímco můj [activity.Custom('GetRaptorType')] vysoko nad nimi pročesává pohledem zem."
 hunt.1062.sky: "\n\nVrhně se dolů jako blesk. O chvíli později k nám dolehne hlasitý náraz a kořist se zřítí z oblohy!"
 hunt.1062.floor: "\n\nVrhně se dolů jako blesk. Kořist se snaží ukrýt, ale už je příliš pozdě!!"
 hunt.1062.a: "#EMP ANO!!#!"
 hunt.1062.a.flavor: "Můj [activity.Custom('GetRaptorType')] se dnes dosyta nažere!"
 hunt.1062.b: "Výborně!"
 hunt.1063.t: "Dva v hrsti"
 hunt.1063.desc: "Můj [activity.Custom('GetRaptorType')] se znovu a znovu vrhá na kořist, ale pokaždé mine, stáhne se nebo svůj cíl jen lehce zasáhne."
 hunt.1063.desc_guest: "[activity.Custom('GetRaptorType')|U] [host.GetTitledFirstName] se znovu a znovu vrhá na kořist, ale pokaždé mine, stáhne se nebo svůj cíl jen lehce zasáhne."
 hunt.1063.closing: "\n\nPo hodinách marných pokusů zvěř téměř zmizela, [activity.Custom('GetRaptorType')] je na pokraji vyčerpání a světla ubývá..."
 hunt.1063.a: "Vždycky je tu příště."
 hunt.1063.a.flavor: "Zatracený pták..."
 hunt.1063.d: "Škoda."
 hunt.1080.t.bodyguard: "Ne tak docela o samotě"
 hunt.1080.t: "Docela o samotě"
 hunt.1080.opening_lone: "[murderer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', murderer)], a já jsme před ostatními,"
 hunt.1080.opening_accomplice: "[murderer.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', murderer)], [accomplice.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', accomplice)], a já jsme před ostatními,"
 hunt.1080.chase: "poháněni neustálým voláním a pobízením [murderer.GetFirstNameNoTooltip], abychom zrychlili a dostihli prchající [activity.Custom('GetAnimalType')].\n\nTeprve teď si uvědomuji, jak tichá a opuštěná stezka je. Hlasy zbytku družiny postupně utichly a ostatní nikde nevidím.\n\n"
 hunt.1080.bow: "poháněni neustálým voláním [murderer.GetFirstNameNoTooltip], abychom zrychlili a dostihli prchající [activity.Custom('GetAnimalType')].\n\nStezka je tichá a opuštěná a náhle mi dochází, že hlasy zbytku družiny postupně utichly. Ostatní nikde nevidím.\n\n"
 hunt.1080.falconry: "když nás [murderer.GetFirstNameNoTooltip] hlasitě a neodbytně odvádí ze stezky za svými pochybnými pozorováními [activity.Custom('GetAnimalPlural')].\n\nTeprve teď si uvědomuji, jak tichá a opuštěná stezka je. Hlasy zbytku družiny postupně utichly a ostatní nikde nevidím.\n\n"
 hunt.1080.closing_lone: "Ohlédnu se a spatřím, jak se [murderer.GetFirstNameNoTooltip] rychle blíží s taseným nožem a děsivým leskem v očích."
 hunt.1080.closing_accomplice: "Ohlédnu se a spatřím, jak se [murderer.GetFirstNameNoTooltip] a [accomplice.GetFirstNameNoTooltip] rychle blíží s tasenými noži a nebezpečným leskem v očích."
 hunt.1080.closing_bow: "Obrátím se zpět ke stezce a spatřím [murderer.GetFirstNameNoTooltip], jak se rychle blíží s taseným nožem a děsivým leskem v očích."
 hunt.1080.closing_bow_accomplice: "Obrátím se zpět ke stezce a spatřím, jak se [murderer.GetFirstNameNoTooltip] a [accomplice.GetFirstNameNoTooltip] rychle blíží s tasenými noži a děsivým leskem v očích."
 hunt.1080.desc: "Alespoň jsem si to [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]. Když se otočím, zbytek mé družiny není nikde v dohledu."
 hunt.1080.bodyguard_betray: "\n\n[bodyguard_betray.GetFirstNameNoTooltip], co to děláš?! Přestaň!"
 hunt.1080.bodyguard_appears: "\n\nZa sebou zaslechnu výkřik. Po stezce ke mně běží [bodyguard.GetFirstName] a volá: „#EMP [ROOT.Char.GetTitleAsNameNoTooltip], pozor!#!“"
 hunt.1080.bodyguard: "\n\nKde je [bodyguard.GetFirstName], když [Select_CString(ROOT.Char.IsFemale,'ji','ho')] potřebuji? [Select_CString(bodyguard.Char.IsFemale,'Hlupačka','Hlupák')]!"
 hunt.1080.dog_appears: "\n\nOzve se hlasitý štěkot. Otočím se a spatřím svého milovaného psa [ROOT.Char.Custom('DogStoryName')], jak se ke mně řítí na pomoc a hlasitě ohlašuje svůj příchod."
 hunt.1080.a.bodyguard: "[bodyguard.GetFirstNameNoTooltip]! Rychle!"
 hunt.1080.a.dog: "[ROOT.Char.Custom('DogStoryName')]! Ano, [ROOT.Char.Custom('DogStoryGirlBoy')]!"
 hunt.1080.a.accomplice: "Ehm, [murderer.GetFirstNameNoTooltip]? [accomplice.GetFirstNameNoTooltip]?!"
 hunt.1080.a: "Ehm, [murderer.GetFirstNameNoTooltip]?"
 hunt.1080.a.duel_success_accomplice: "Přemůžeš [murderer.GetFirstNameNoTooltip] a [accomplice.GetFirstNameNoTooltip]"
 hunt.1080.a.duel_failure_accomplice: "[murderer.GetFirstNameNoTooltip] a [accomplice.GetFirstNameNoTooltip] tě přemohou"
 hunt.1080.a.duel_success: "Přemůžeš [murderer.GetFirstNameNoTooltip]"
 hunt.1080.a.duel_failure: "[murderer.GetFirstNameNoTooltip] tě přemůže"
 hunt.1080.a.success_tt: "[murderer.GetShortUIName|U] bude [Select_CString(murderer.Char.IsFemale,'zabita nebo přemožena','zabit nebo přemožen')]"
 hunt.1080.a.success_accomplice_tt: "[accomplice.GetShortUIName|U] bude [Select_CString(murderer.Char.IsFemale,'zabita nebo přemožena','zabit nebo přemožen')]"
 hunt.1081.desc: "Tasím lovecký nůž a volám o pomoc, zatímco [murderer.GetFirstName] zrychluje krok s děsivě odhodlaným výrazem. Následující okamžiky mi splývají v jedinou změť...\n\n"
 hunt.1081.desc_accomplice: "Tasím lovecký nůž a volám o pomoc, zatímco se na mě [murderer.GetFirstName] a [accomplice.GetFirstName] vrhají s děsivě odhodlanými výrazy. Následující okamžiky mi splývají v jedinou změť...\n\n"
 hunt.1081.killed: "Náhle padám zády do [host.GetCurrentLocation.Custom('GetProvinceGroundDesc')] a svírám si hruď. Z tmavé skvrny na mém oděvu vyčnívá jílec dýky.\n\n"
 hunt.1081.failure_accomplice: "Když se vzpamatuji, srdce mi buší a mí útočníci se svíjejí na zemi, zatímco jejich dýky leží bezpečně mimo dosah"
 hunt.1081.failure: "Když se vzpamatuji, srdce mi buší a [murderer.GetFirstNameNoTooltip] se svíjí na zemi, zatímco dýka leží bezpečně mimo dosah"
 hunt.1081.wounded_accomplice: "$hunt.1081.failure_accomplice$, z paže [accomplice.GetFirstNameNoTooltip] stéká rudá krev.\n\n"
 hunt.1081.wounded: "$hunt.1081.failure$, z paže [murderer.GetFirstNameNoTooltip] stéká rudá krev.\n\n"
 hunt.1081.escaped_accomplice: "$hunt.1081.failure_accomplice$.\n\n"
 hunt.1081.escaped: "$hunt.1081.failure$.\n\n"
 hunt.1081.murderer_killed: "[murderer.GetFirstNameNoTooltip] vypadá, jako by mě chtěl[Select_CString(murderer.IsFemale,'proklít','proklít')], než mu pohasne světlo v očích."
 hunt.1081.murderer_wounded: "[murderer.GetFirstNameNoTooltip] sebou trhne, zasténá bolestí a sevře si otevřenou ránu."
 hunt.1081.murderer_arrested: "Přitisknu dýku k hrdlu omráčeného [murderer.GetFirstNameNoTooltip]."
 hunt.1081.murderer: "[murderer.GetFirstNameNoTooltip] se vítězoslavně zatváří a odběhne do [host.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]."
 hunt.1081.accomplice_killed: "[accomplice.GetFirstNameNoTooltip] leží bez hnutí a strašlivá rána jasně vypovídá o jeho osudu.\n\n"
 hunt.1081.accomplice_wounded: "[accomplice.GetFirstNameNoTooltip] utrpěl[Select_CString(accomplice.IsFemale,'jen lehké škrábnutí','jen lehké škrábnutí')], ale přesto bolestivě vyje a v očích má paniku.\n\n"
 hunt.1081.accomplice_arrested: "[accomplice.GetFirstNameNoTooltip] vyvázl[Select_CString(accomplice.IsFemale,'bez jediného zranění','bez jediného zranění')] a s vytřeštěnýma očima mě prosí o milost.\n\n"
 hunt.1081.accomplice: "[accomplice.GetFirstNameNoTooltip] už prchá pryč a jeho škodolibý smích se ztrácí v dálce.\n\n"
 hunt.1081.bodyguard_wounded: "[bodyguard.GetFirstName] klečí opodál a pevně si svírá silně krvácející ránu."
 hunt.1081.bodyguard_killed: "[bodyguard.GetFirstName] leží rozvaleně mezi námi a podle všeho je po smrti."
 hunt.1081.bodyguard_saved: "[bodyguard.GetFirstName] drží čepel střídavě u jednoho i druhého a přitom sleduje stromy, zda se neobjeví další hrozba."
 hunt.1081.dog_killed: "\n\nMůj statečný pes [ROOT.Char.Custom('DogStoryName')] leží schoulený u mých nohou, zcela nehybně, jako by spal..."
 hunt.1081.dog: "\n\nMůj statečný pes [ROOT.Char.Custom('DogStoryName')] stojí po mém boku..."
 hunt.1081.closing_massacre: "To je ale spoušť..."
 hunt.1081.closing_success_bodyguard_dead: "Sloužil[Select_CString(bodyguard.IsFemale,'a','')] jsi mi dobře... [bodyguard.GetFirstNameNoTooltip]..."
 hunt.1081.closing_success_bodyguard_apology: "Slyším [bodyguard.GetFirstNameNoTooltip]: „Omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')]..."
 hunt.1081.closing_success: "\n\nZůstávám sám[Select_CString(ROOT.Char.IsFemale,'a','')], naslouchám ptákům a slabě volám o pomoc..."
 hunt.1081.a: "S havětí nemám slitování!"
 hunt.1081.b: "Stráže! #EMP STRÁŽE!#! Chopte se [murderer.GetFirstNameNoTooltip]!"
 hunt.1081.b.pair: "Stráže! #EMP STRÁŽE!#! Chopte se jich!"
 hunt.1081.b.accomplice: "Stráže! #EMP STRÁŽE!#! Chopte se [accomplice.GetFirstNameNoTooltip]!"
 hunt.1081.c.rival: "Ten... [murderer.Custom2('InsultNoun', ROOT.Char)]..."
