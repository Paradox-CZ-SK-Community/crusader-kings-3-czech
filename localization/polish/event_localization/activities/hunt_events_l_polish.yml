 hunt.1337.t: "Právo lovit"
 hunt.1337.desc: "Nemám právo lovit zde v [host.GetCurrentLocation.Custom('GetTerrainTypePlural')], které náleží [barony_holder.GetTitledFirstName]. Pokud nechci být [Select_CString(ROOT.Char.IsFemale,'považována za psankyni a pytlačku','považován za psance a pytláka')], musím si toto právo zakoupit.\n\nAni kdybych si však právo [Select_CString(ROOT.Char.IsFemale,'zajistila','zajistil')], [Select_CString(ROOT.Char.IsFemale,'nemohla bych skolit libovolné zvíře','nemohl bych skolit libovolné zvíře')]..."
 hunt.1337.a: "[favor_to_call_in.GetTitledFirstNameNoTooltip] mi jistě dovolí lovit!"
 hunt.1337.b: "Kašlu na tahle #EMP „práva“#!, lovím, kde se mi zachce!"
 hunt.1337.c: "Právo si zakoupím."
 hunt.1337.d: "Pche, vraťme se do tábora..."
 hunt.1337.e: "Ještě že jsem za právo už [Select_CString(ROOT.Char.IsFemale,'zaplatila','zaplatil')]!"
 mpo_hunt.0001.t: "Od kolébky"
 mpo_hunt.0001.desc: "Postupujeme skrz [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] a hledáme kořist. Mé dítě [child.GetFirstName] mě překvapuje svou odolností a pevně svírá luk.\n\n„Stůj,“ zamumlám, když si všimnu pohybu v trávě. Malý [ROOT.Char.Custom('SmallAnimal')] se živí kořínky a o naší přítomnosti nemá tušení."
 mpo_hunt.0001.a: "Tenhle je můj!"
 mpo_hunt.0001.b: "Zvládneš to, [child.GetFirstNameNoTooltip]!"
 mpo_hunt.0001.c: "Chytíš ho takhle a potom..."
 mpo_hunt.0001.c.tt.crit_success: "[child.GetFirstNameNoTooltip] na všechny zapůsobí"
 mpo_hunt.0001.b.tt.success: "[child.GetFirstNameNoTooltip] zvíře chytí"
 mpo_hunt.0001.b.tt.failure: "[child.GetFirstNameNoTooltip] neuspěje"
 mpo_hunt.0001.d: "Nech ho být."
 mpo_hunt.0010.t: "Útok shora"
 mpo_hunt.0010.desc: "„...tuhle část [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] jsem měl[Select_CString(target.IsFemale,'vždycky ráda','vždycky rád')],“ poznamená [target.GetTitledFirstName], když společně kráčíme. „Otec nás sem vodíval na lov.“\n\nNež vůbec stačím odpovědět, střemhlav se na [target.GetFirstNameNoTooltip] vrhne [ROOT.Char.Custom('GetRegionalEagleType')] a ječí jako novorozeně.\n\n„Pomoc!“ vykřikne [target.GetFirstNameNoTooltip]."
 mpo_hunt.0010.a: "Vím, jak si s nimi poradit."
 mpo_hunt.0010.b: "Teď je má chvíle!"
 mpo_hunt.0010.b.tt.success: "Ptáka zastřelíš"
 mpo_hunt.0010.b.tt.failure: "Ztrapníš se"
 mpo_hunt.0010.b.tt.crit_failure: "Pták tě zraní"
 mpo_hunt.0010.c: "„Za mě, [target.GetFirstNameNoTooltip]!“"
 mpo_hunt.0010.c.tt.success: "Na [target.GetFirstNameNoTooltip] zapůsobíš"
 mpo_hunt.0010.d: "Nestojí to za to."
 mpo_hunt.0020.t: "Mateřská láska"
 mpo_hunt.0020.desc.intro: "„Začíná se stmívat,“ [companion.GetTitledFirstName] [companion.Custom('quirk_pos_present')]. „Měli bychom si najít místo, kde...“\n\nVětu však náhle přeruší:"
 mpo_hunt.0020.desc.zud: "ve sněhu leží mrtvá vlčice a mládě tiskne hlavu k jejímu bezvládnému břichu."
 mpo_hunt.0020.desc.normal: "vlčice na nás výhružně zavrčí a vlastním tělem chrání malé mládě."
 mpo_hunt.0020.a: "Matku musel zabít chlad..."
 mpo_hunt.0020.b: "Musíme matku zabít!"
 mpo_hunt.0020.b.tt.success: "Vlčici zabiješ"
 mpo_hunt.0020.b.tt.failure: "Matka tě napadne"
 mpo_hunt.0020.c: "Můžeme se kolem ní proplížit..."
 mpo_hunt.0020.c.tt.success: "Proplížíš se kolem matky"
 mpo_hunt.0020.d: "Nezastavujte."
 artifact_wolf_pelt_name: "Vlčí kožešina"
 artifact_wolf_pelt_desc: "Stažená z umírající matky."
 mpo_hunt.0030.t: "Vyhnanec"
 mpo_hunt.0030.desc: "Když pokračujeme v cestě, upoutá naši pozornost bolestivé sténání. Na skále odpočívá zraněný válečník v potrhaném oděvu a s oteklou čelistí.\n\n„Zdravím vás, obávaný pane. Můj lenní pán [other_ruler.GetTitledFirstName] mi nařídil opustit své panství. Nepřátelé na mě nastražili léčku a teď musím bezcílně bloudit.“"
 mpo_hunt.0030.a: "„Jistě k tomu byl důvod.“"
 mpo_hunt.0030.b: "„Schopný válečník se vždy hodí!“"
 mpo_hunt.0030.c: "„Má štědrost je všeobecně známá.“"
 mpo_hunt.0030.d: "„Přežijí jen silní.“"
 mpo_hunt.0040.t: "Koně hubení jako jeleni"
 mpo_hunt.0040.desc: "V nelítostném [root_location.GetTerrain.GetNameNoTooltip|l] v [root_location.GetName] trvá štvanice už dlouho. Jedeme dál a necháváme za sebou horší jezdce i slabší koně... Teď však začínají hubnout dokonce i silní valaši.\n\nNaše ušlechtilá zvířata nás tímto lovem ještě provedou. Pokud však budeme pokračovat stejným tempem, vrátí se koně domů vyhublí a neschopní boje."
 mpo_hunt.0040.a: "Kořist, kterou stopujeme pomalu, tak snadno neuteče."
 mpo_hunt.0040.b: "Za pár cetek nám místní přenechají čerstvé koně."
 mpo_hunt.0040.c: "Ať koně třeba hladovějí! Nesmíme selhat."
 mpo_hunt.0040.d: "Zpomalte."
 mpo_hunt.0050.t: "Lovci z [root_location.GetNameNoTooltip]"
 mpo_hunt.0050.desc: "Když klušeme za našimi stopaři, přiblíží se k nám skupina neznámých jezdců. Místní. Přes zpocené hřbety jejich koní jsou přehozené čerstvé kožešiny.\n\n„[hunter.GetFaith.FertilityGodName] vdechuje život [root_location.GetTerrain.GetNameNoTooltip|l],“ pronese jejich vůdce [hunter.GetName]. „Svůj úlovek už máme, ale pokud chcete obchodovat, můžeme vám pomoci i s vaším lovem.“"
 mpo_hunt.0050.a: "Tenhle lovec patří k mým [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNounNoTooltip]."
 mpo_hunt.0050.b: "Vyměním koně za stopu své kořisti."
 mpo_hunt.0050.c: "„Jsme na lovu, cizinče. A vy vezete pěkné kožešiny!“"
 mpo_hunt.0050.c.flavor: "Tvé šípy zamíří na místní lovce a jejich družina palbu opětuje!"
 mpo_hunt.0050.c.tt.success: "Získáš jejich kořist"
 mpo_hunt.0050.c.tt.failure: "Cizinci mají přesnější mušku"
 mpo_hunt.0050.d: "„Jestli chceš žít, lovče... odejdi.“"
 mpo_lean_horses_hunt_modifier: "Vyhublí valaši"
 mpo_lean_horses_hunt_modifier_desc: "Dlouhý a náročný lov vyčerpal mnoho koní tohoto nomáda, takže se už příliš nehodí do boje."
 mpo_hunt.0060.t: "Kožešiny v trávě"
 mpo_hunt.0060.desc: "V křoví něco mihne, pak další rychlý tvor – a další! Malá, baculatá těla s hnědou srstí, jako kameny potažené měkkou kožešinou, prchají trávou.\n\nMí lovečtí druhové sedí v sedlech s nasazenými šípy a čekají jen na povel. Mám ho ale vydat? Sviští kožešiny jsou ceněným obchodním artiklem, jenže čas strávený jejich stahováním je čas, kdy zanedbáváme štvanici..."
 mpo_hunt.0060.a: "Znám #EMP přesně#! toho obchodníka, který ty kožešiny prodá..."
 mpo_hunt.0060.b: "„#EMP Palte! Palte!#! Za bohatství, které nám ty kožešiny přinesou!“"
 mpo_hunt.0060.c: "„Nevšímejte si jich! #EMP Za kořistí!#!“"
 tgp_hunt.0002.t: "Nejsme tak odlišní"
 tgp_hunt.0002.desc: "Při pronásledování [activity.Custom('GetAnimalType')] narazím na malou říčku. Za rákosím však nečeká má kořist, nýbrž elegantní pár kachen, které se s propletenými krky něžně objímají.\n\nOkouzleně na zamilovaný pár hledím, když se náhle střemhlav vrhne můj sokol! Zůstane jen jediná kachna, po jejím protějšku krev a peří. Osiřelý pták bolestně křičí a zoufale mává křídly, jako by snad mohl vrátit čas."
 tgp_hunt.0002.a: "Vskutku úchvatná podívaná."
 tgp_hunt.0002.a.flavor: "Dostaň i tu druhou!"
 tgp_hunt.0002.b: "Možná se od nás zvířata tolik neliší."
 tgp_hunt.0002.b.flavor: "Takový je život."
 tgp_hunt.0002.c: "Tak žalostnou podívanou ve svém panství nestrpím."
 tgp_hunt.0002.c.flavor: "Má-li přijít změna, začnu ji vlastními činy."
 hunt_invalidated_warning_ban_tt: "@warning_icon! #X Dokud bude [host.GetName] naživu, nebudeš moci pořádat další [GetActivityType( 'activity_hunt' ).GetName] [Concept('activity','aktivitu')|E].#!"
