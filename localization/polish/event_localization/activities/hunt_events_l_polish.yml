 tgp_hunt.0004.b.success: "Sošku znesvětíš, aniž by tě někdo spatřil"
 tgp_hunt.0004.b.failure: "Místní tě přistihnou při znesvěcování sošky"
 jizo_statue: "Socha Džizó"
 religious_statuette: "Náboženská soška"
 tgp_hunt.0005.t: "Mezi rýžovými poli"
 tgp_hunt.0005.desc: "Při pronásledování [activity.Custom('GetAnimalType')] nám kořist unikne do hustého rýžového pole. Zbytek lovecké družiny nás dožene a společně pátráme po jakémkoli pohybu, ale po [activity.Custom('GetAnimalType')] ani stopy!\n\nPřece nás nepřelstí rýžové pole!"
 tgp_hunt.0005.success: "[activity.Custom('GetAnimalType')|U] je zpozorován"
 tgp_hunt.0005.failure: "[activity.Custom('GetAnimalType')|U] není nikde k vidění"
 tgp_hunt.0005.a: "Možná vím, jak na to."
 tgp_hunt.0005.b: "Zapalte pole a vyžeňte zvíře ven!"
 tgp_hunt.0005.c: "Třeba [target_character.GetFirstNameNoTooltip] dostane nějaký nápad?"
 tgp_hunt.0005.d: "Všichni na místa! Počkáme a uvidíme."
 tgp_hunt.0006.t: "Lovecká báseň"
 tgp_hunt.0006.desc: "Když se vracím do tábora, spatřím [poet.GetName], jak zamyšleně hledí do dálky. Můj příchod vytrhne [poet.GetFirstNameNoTooltip] ze zamyšlení.\n\n„[Select_CString(poet.IsFemale,'Ráda vás vidím','Rád vás vidím')], [poet.Custom2('RelationToMe', SCOPE.sC('host'))]! Chtěl[Select_CString(poet.IsFemale,'Chtěla jsem o tomto strhujícím lovu napsat báseň','Chtěl jsem o tomto strhujícím lovu napsat báseň')], ale vůbec se nemohu rozhodnout pro téma!“"
 tgp_hunt.0006.a: "„Zkus zachytit uklidňující krásu zdejší přírody.“"
 tgp_hunt.0006.b: "„No přece o mé udatnosti!“"
 tgp_hunt.0006.c: "„Věnuj ji [seduction_target.GetNameNoTooltip].“"
 tgp_hunt.0006.d: "„Napiš o loveckém umění [befriend_target.GetShortUINamePossessiveNoTooltip]!“"
 tgp_hunt.0006.e: "„Půjčím ti svůj [ROOT.Char.Custom('WritingInstrument')]!“"
 hunt_depends_on_aptitude: "Účinnost závisí na [Concept('aptitude','způsobilosti')|e] [poet.GetShortUIName]"
 hunt_helped_with_poem: "Společná práce na básni"
