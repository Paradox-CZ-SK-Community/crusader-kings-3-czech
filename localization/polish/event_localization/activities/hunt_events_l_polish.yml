 hunt.1081.c: "P-proč...?"
 hunt.1081.d: "C-co to proboha..."
 hunt.1090.desc: "Po hodinách jízdy a pročesávání každého koutu [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] musím před ubývajícím světlem přiznat porážku.\n\n[activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] zmizel jako duch v okamžiku, kdy jsme jej spatřili, a jako by po sobě nezanechal jedinou pachovou stopu ani otisk...\n\nKdyž se obracím zpět k táboru, z temnoucí krajiny ke mně doléhá vzdálené volání [activity.Custom('GetAnimalType')], jako by se mi vysmívalo."
 hunt.1090.guest: "Po hodinách jízdy a pročesávání každého koutu [host.GetCurrentLocation.Custom('GetTerrainTypePlural')] musí [host.GetTitledFirstName] před ubývajícím světlem přiznat porážku.\n\n[activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] zmizel jako duch v okamžiku, kdy jsme jej spatřili, a jako by po sobě nezanechal jedinou pachovou stopu ani otisk...\n\nKdyž se obracíme zpět k táboru, z temnoucí krajiny doléhá k [host.GetFirstNameNoTooltip] vzdálené volání [activity.Custom('GetAnimalType')], jako by se vysmívalo."
 hunt.1090.a: "#EMP Najdu#! tě, bestie..."
 hunt.1090.a.tt: "Jen počkej!"
 hunt.1090.b: "To tedy bylo něco."
 hunt.1200.t: "Zabití"
 hunt.1200.chase_self: "Zamířím, zatímco družina drží vyčerpané zvíře na místě, vydechnu a vypustím šíp!"
 hunt.1200.chase: "[animal_slayer.GetTitledFirstName] zamíří, zatímco družina drží vyčerpaný [activity.Custom('GetAnimalType')] na místě, vydechne a vypustí šíp!"
 hunt.1200.ambush_self: "Opatrně zamířím, zatímco se k nám [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalChargePresent')] a [activity.Custom('GetAnimalTrackPlural')] buší do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]."
 hunt.1200.ambush: "[animal_slayer.GetTitledFirstName] opatrně zamíří, zatímco se k nám [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalChargePresent')] a [activity.Custom('GetAnimalTrackPlural')] buší do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]."
 hunt.1200.stealth_self: "Pomalu zamířím a [activity.Custom('GetAnimalType')] nakloní hlavu, jako by něco tušil."
 hunt.1200.stealth: "[animal_slayer.GetTitledFirstName] pomalu zamíří a [activity.Custom('GetAnimalType')] nakloní hlavu, jako by něco tušil."
 hunt.1200.slayer_fled: "[host.GetTitledFirstName] náhle vykřikne a prchá od zvířete."
 hunt.1200.slayer_group: "[host.GetTitledFirstName] vykřikne: „#EMP PALTE!#! Skolte ho!“"
 hunt.1200.slayer_self_stealth: "[host.GetTitledFirstName] mi pokyne, abych vystřelil[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 hunt.1200.slayer_self: "[host.GetTitledFirstName] mi pokyne, abych vystřelil[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 hunt.1200.slayer_stealth: "Slyším, jak [host.GetTitledFirstName] volá: „Rychle, [ROOT.Char.GetFirstNameNoTooltip], vystřel!“"
 hunt.1200.slayer: "[host.GetTitledFirstName] vykřikne: „Rychle, [animal_slayer.GetTitledFirstName], vystřel!“"
 hunt.1200.success: "\n\nŠíp zasáhne přesně a zaboří se bestii přímo do srdce!"
 hunt.1200.failure: "\n\nŠíp proletí kolem a zmizí v [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')], zatímco [activity.Custom('GetAnimalType')] zaútočí [activity.Custom('GetAnimalStrike')] na [injury_target.GetFirstName]!"
 hunt.1200.critical: "\n\nŠíp proletí kolem a [activity.Custom('GetAnimalType')] se bleskově otočí a zmizí v [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]!"
 hunt.1200.fled: "\n\nZbytek z nás jen bezradně přihlíží, zatímco bestii ustupujeme z cesty."
 hunt.1200.group: "\n\nTětivy zadrnčí a tucet šípů zasviští ke zvířeti. To se k nám sesune [activity.Custom('GetAnimalSoundPresent')], celé poseté šípy."
 hunt.1200.a.self: "Takhle se to dělá!"
 hunt.1200.a: "Dobrá rána!"
 hunt.1200.b.self: "Ach, promiň! Pozor!"
 hunt.1200.b: "Pomozte [injury_target.GetFirstNameNoTooltip]!"
 hunt.1200.c.self: "Ta zatracená potvora se pohnula..."
 hunt.1200.c: "Smůla."
 hunt.1200.d: "Neměl žádnou šanci."
 hunt.1200.e: "To je ale lovec!"
 hunt.1201.self: "Pozvednu kopí a opatrně se přiblížím k vyčerpanému zvířeti."
 hunt.1201: "[animal_slayer.GetTitledFirstName] pozvedne kopí a opatrně se přiblíží k vyčerpanému zvířeti."
 hunt.1201.slayer_dogs: "[host.GetTitledFirstName] se obrátí k psovodům a vykřikne: „Vypusťte psy!“"
 hunt.1201.slayer_self: "[host.GetTitledFirstName] se ke mně obrátí. „[ROOT.Char.GetTitledFirstName], závěrečný úder patří tobě!“"
 hunt.1201.slayer: "[host.GetTitledFirstName] se k nám obrátí a vykřikne: „[animal_slayer.GetTitledFirstName], závěrečný úder patří tobě!“"
 hunt.1201.success_self: "\n\nPečlivě si vyberu okamžik a vrazím čepel hluboko do jeho srdce!"
 hunt.1201.success: "\n\n[animal_slayer.GetTitledFirstNameNoTooltip] si pečlivě vybere okamžik a vrazí čepel hluboko do jeho srdce!"
 hunt.1201.failure_self: "\n\nKdyž do něj vrazím čepel, bestie mě zasáhne [activity.Custom('GetAnimalStrike')]. Odtáhnou mě pryč, zatímco [activity.Custom('GetAnimalSoundPresent')] ve smrtelných křečích."
 hunt.1201.failure: "\n\nKdyž [animal_slayer.GetTitledFirstNameNoTooltip] vrazí do bestie čepel, ta [animal_slayer.GetFirstNameNoTooltip] zasáhne [activity.Custom('GetAnimalStrike')]. Ostatní [Select_CString(animal_slayer.IsFemale,'ji','ho')] odtáhnou pryč, zatímco bestie [activity.Custom('GetAnimalSoundPresent')] ve smrtelných křečích."
 hunt.1201.critical: "\n\nKdyž [animal_slayer.GetTitledFirstNameNoTooltip] vrazí do bestie čepel, ta prudce zaútočí [activity.Custom('GetAnimalStrike')] a zanechá [animal_slayer.GetFirstNameNoTooltip] svíjet se se strašlivým zraněním!"
 hunt.1201.dogs_success: "\n\nPsi se vrhnou do akce, štěkají a obkličují bestii, zatímco ji jeden po druhém pomalu trhají zuby..."
 hunt.1201.dogs_failure: "\n\nPsi se vrhnou do akce, štěkají a obkličují bestii, ale ta je jednoho po druhém likviduje za kňučení a vytí..."
 hunt.1201.animal_spared_dharmic: "\n\n[host.GetTitledFirstName] odvolá lovce. „Lov je u konce. Působit zbytečnou bolest není dharma.“"
 hunt.1201.animal_spared: "\n\n[host.GetTitledFirstName] odvolá lovce. „To stačí. Pojďme a nechme tu ubohou bestii na pokoji.“"
 hunt.1201.a.self: "Na, bestie!"
