 hunt_convinced_fellow_hunter_to_stay: "Přesvědčení spolulovce, aby zůstal"
 tgp_hunt.0007.t: "Zajíc na dosah"
 tgp_hunt.0007.desc: "Při návratu do tábora zaslechnu z křoví bolestivé zakvílení.\n\nZvuk mě dovede k zajíci chycenému v pytlácké smyčce. [target_character.GetFirstName] přistoupí blíž, zvedne lapené zvíře a olízne si rty..."
 tgp_hunt.0007.a: "Co ztratí pytlák, získáme my."
 tgp_hunt.0007.a.flavor: "Tenhle lov jde vskutku skvěle!"
 tgp_hunt.0007.b: "Tohle jsme si nezasloužili! Navrhuji ho pustit."
 tgp_hunt.0007.b.flavor: "Má [target_character.GetFirstNameNoTooltip] vůbec smysl pro čest?"
 tgp_hunt.0007.b.success: "[target_character.GetFirstName] s tebou souhlasí"
 tgp_hunt.0007.b.failure: "[target_character.GetFirstName] je [Select_CString(target_character.IsFemale,'zklamaná','zklamaný')]"
 hunt_found_rabbit_in_a_trap_log_title: "$tgp_hunt.0007.t$"
 hunt_found_rabbit_in_a_trap_log: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'našla','našel')] zajíce v pasti"
 hunt_released_rabbit_from_trap_log_title: "$tgp_hunt.0007.t$"
 hunt_released_rabbit_from_trap_log: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'pustila','pustil')] zajíce"
 hunt_active_participation: "Aktivní účast"
 hunt_released_someones_catch: "Propuštění úlovku"
 tgp_hunt.0008.t: "Změna životní cesty"
 tgp_hunt.0008.desc: "Při stopování kořisti narazím na rozrušeného [target_character.GetName], jehož lovecký luk je přelomený vedví.\n\nNabídnu jeden ze svých luků, ale [target_character.GetFirstNameNoTooltip] prohlásí:\n\n„Zříkám se krvavé zábavy zvané lov. Právě díky ní se mi však ukázalo mé poslání v klášteře. Od nynějška už nebudu prolévat krev. [target_character.GetFaith.HighGodName] bude středem mého života.“"
 tgp_hunt.0008.a: "Pokusím se [target_character.GetFirstNameNoTooltip] přesvědčit o opaku."
 tgp_hunt.0008.a.flavor: "Pár slov to jistě spraví."
 tgp_hunt.0008.a.success: "Přesvědčíš [target_character.GetFirstName], aby se vrátil[Select_CString(target_character.IsFemale,'vrátila','vrátil')] k dřívějšímu způsobu života"
 tgp_hunt.0008.a.failure: "[target_character.GetFirstName] zůstává neoblomný[Select_CString(target_character.IsFemale,'neoblomná','neoblomný')]"
 tgp_hunt.0008.b: "Ať se rozhodne, jak chce."
 tgp_hunt.0008.b.flavor: "Nemá cenu přesvědčovat někoho, kdo už se rozhodl."
 hunt_character_became_a_buddhist_monk_log_title: "$tgp_hunt.0008.t$"
 hunt_character_became_a_buddhist_monk_log: "[target_character.GetShortUIName] [Select_CString(target_character.IsFemale,'přijala mnišský život','přijal mnišský život')]"
 hunt_character_got_talked_out_of_becoming_monk_log_title: "$tgp_hunt.0008.t$"
 hunt_character_got_talked_out_of_becoming_monk_log: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'přesvědčila','přesvědčil')] [target_character.GetShortUIName], aby se nevydával[Select_CString(target_character.IsFemale,'nevydávala','nevydával')] na mnišskou dráhu"
 tgp_hunt.0009.t: "[target_faith.GetReligion.GetAdjectiveNoTooltip] poustevník"
 tgp_hunt.0009.desc: "Při pronásledování kořisti narazím na asketu, který chová sokoly.\n\n„Pohleďte na krásu mých ptáků!“\n\n„Musíte být znamenitý lovec,“ odpovím a dychtivě čekám na příběhy o jeho výpravách.\n\n„Ne, ani zdaleka. Tyto ptáky nikdy nevypouštím, aby zabíjeli. [buddhist_hermit.GetFaith.HighGodName] nás učí, že něco takového je nepřípustné.“ Je ale správné bránit přirozenému běhu věcí?"
 tgp_hunt.0009.a: "Oklamu poustevníka."
 tgp_hunt.0009.a.flavor: "Sokola nevypustím, prostě mi věř."
 tgp_hunt.0009.b: "Nabídnu výhodný obchod."
 tgp_hunt.0009.b.flavor: "Dostatek zlata přesvědčí každého."
 tgp_hunt.0009.c: "Pche! Raději budu lovit s ostatními."
 tgp_hunt.0009.c.flavor: "Proč ztrácet čas s takovým vyvrhelem?"
 tgp_hunt.0009.d: "Tyto zásady obdivuji."
 tgp_hunt.0009.d.flavor: "Takové přesvědčení si zaslouží uznání."
 hunt_deceives_a_monk_title: "$tgp_hunt.0009.t$"
 hunt_deceives_a_monk: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'se pokusila oklamat','se pokusil oklamat')] [buddhist_hermit.GetShortUIName]"
 tgp_hunt.0009.a.success: "[buddhist_hermit.GetFirstName] se nechá přesvědčit"
 tgp_hunt.0009.a.failure: "[buddhist_hermit.GetFirstName] prohlédne můj bluf"
 tgp_hunt.0009.b.success: "Zlato stačí, aby [buddhist_hermit.GetFirstName] [Select_CString(buddhist_hermit.IsFemale,'ustoupila od svých zásad','ustoupil od svých zásad')]"
 tgp_hunt.0009.b.failure: "[buddhist_hermit.GetFirstName] se svých zásad nevzdá"
 hunt_buys_a_falcon_title: "$tgp_hunt.0009.t$"
 hunt_buys_a_falcon: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'koupila','koupil')] sokola"
