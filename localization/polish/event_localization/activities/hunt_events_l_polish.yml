 tgp_hunt.0003.t: "Nečekaný konec"
 tgp_hunt.0003.desc: "Po návratu do tábora mě zastihne velmi překvapivá zpráva. [host.GetName] zrušil[Select_CString(host.IsFemale,'zrušila lov a nařídila všem, aby se okamžitě rozešli','zrušil lov a nařídil všem, aby se okamžitě rozešli')]!\n\nŘíká se, že poté, co sokol zabil kachnu, pocítil[Select_CString(host.IsFemale,'náhlý příval','náhlý příval')] [GetReligionByKey('buddhism_religion').GetAdjective] soucitu."
 tgp_hunt.0003.a: "Ale já jsem teprve začínal[Select_CString(ROOT.Char.IsFemale,'Ale já jsem teprve začínala','Ale já jsem teprve začínal')]!"
 tgp_hunt.0003.a.flavor: "Ale... proč?"
 tgp_hunt.0004.t: "[activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')|U] na cestě"
 tgp_hunt.0004.desc_common: "Při pátrání po [activity.Custom('GetAnimalType')] narazím na [activity.GetCurrentPhase.GetLocation.Custom('GetReligiousFigurineName')], stojící na kameni vedle stezky.\n\n"
 tgp_hunt.0004.desc_true: "$tgp_hunt.0004.desc_common$Skvělá příležitost k modlitbě. [ROOT.Char.Custom('GetAppropriateGodname')|U] si zaslouží mou úctu."
 tgp_hunt.0004.desc_astray: "$tgp_hunt.0004.desc_common$[local_faith.HighGodName] je zřejmě božstvem, které místní uctívají!"
 tgp_hunt.0004.desc_evil_hostile: "$tgp_hunt.0004.desc_common$Tento odporný symbol místního [local_faith.GetName] se mi otevřeně vysmívá."
 tgp_hunt.0004.a: "Jsou důležitější věci, kterým je třeba se věnovat."
 tgp_hunt.0004.a.flavor: "Snad někdy jindy."
 tgp_hunt.0004.b: "Pomodlím se u sošky."
 tgp_hunt.0004.b.flavor: "Klid duše."
 tgp_hunt.0004.c: "Přesvědčení [local_faith.GetAdherentNamePluralNoTooltip] jsou v souladu s námi, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]."
 tgp_hunt.0004.c.flavor: "$tgp_hunt.0004.b.flavor$"
 tgp_hunt.0004.d: "[local_faith.GetName] je stále na scestí."
 tgp_hunt.0004.d.flavor: "Musím ji strhnout!"
 tgp_hunt.0004.e: "Jejich úctu si zaslouží [ROOT.Char.GetFaith.HighGodName]!"
 tgp_hunt.0004.e.flavor: "$tgp_hunt.0004.d.flavor$"
