l_polish:
 hunt.8000.t: "Předvádění se"
 hunt.8000.desc: "[swooning_attendee.GetName] obdivuje mého dravce od chvíle, kdy jsme vyrazili na lov, a ani se tomu nedivím. Je to nádherné a majestátní zvíře.\n\nBlížíme se k malé řece plné čilých, pořádně velkých ryb a já cítím, že právě teď je dokonalá příležitost ukázat, co [activity.Custom('GetRaptorType')] dokáže!"
 hunt.8000.a: "Mé sokolnické umění udělá dojem!"
 hunt.8000.falcon_success: "[activity.Custom('GetRaptorType')|U] ulovil rybu"
 hunt.8000.falcon_failure: "[activity.Custom('GetRaptorType')|U] neuspěl"
 hunt.8000.b: "Rybu chytím vlastníma rukama!"
 hunt.8000.fist_success: "Holýma rukama chytíš rybu"
 hunt.8000.fist_failure: "Uděláš ze sebe hlupáka"
 hunt.8010.t: "[activity.Custom('GetRaptorType')|U] hoduje"
 hunt.8010.desc: "[activity.Custom('GetRaptorType')|U] mi na zápěstí začíná být očividně neklidný, přešlapuje a netrpělivě do mě klove. Nepochybně se už nemůže dočkat, až znovu vzlétne k obloze a přinese mi čerstvý úlovek!\n\nTrocha letu by mu prospěla, jenže zatím jsem nezahlédl[Select_CString(ROOT.Char.IsFemale,'a','')] ani stopu po něčem, co by stálo za lov, takže by se [activity.Custom('GetRaptorType')] nejspíš vrátil s prázdnými pařáty."
 hunt.8010.a: "Leť, [activity.Custom('GetRaptorType')]!"
 hunt.8010.falcon_success: "[activity.Custom('GetRaptorType')|U] přinesl úlovek"
 hunt.8010.falcon_failure: "$hunt.8000.falcon_failure$"
 hunt.8010.b: "Soustředím se na stopování."
 hunt.8020.t: "Dárce"
 hunt.8020.desc: "[activity.Custom('GetRaptorType')|U] usedne na vyvýšené místo a pozorně přehlíží krajinu. Vzápětí se na něco střemhlav vrhne a po dopadu se pustí do zuřivého zápasu. Klove a drásá cosi na zemi, ale odsud nevidím co.\n\nSpěchám za jeho zběsilým skřekem a nacházím jej nikoli nad mrtvou kořistí, ale nad malou hromádkou mincí a cetek! Jejich hodnota zřejmě není nijak závratná a původního majitele bych nejspíš nenašel[Select_CString(ROOT.Char.IsFemale,'a','')], ani kdybych chtěl[Select_CString(ROOT.Char.IsFemale,'a','')]."
 hunt.8020.a: "„Pěkný nález, můj opeřený příteli!“"
 hunt.8020.b: "„Toto bohatství patří [ROOT.Char.WealthGodName].“"
 hunt.8030.t: "Po stopách [activity.Custom('GetRaptorType')|U]"
 hunt.8030.desc: "[activity.Custom('GetRaptorType')|U] mi úplně zmizel z očí a ať se rozhlížím po krajině sebevíc, nikde ho nevidím. Pak zaslechnu jeho křik a najdu ho sedět s krví odkapávající z pařátů, ale po žádném jiném zvířeti není ani stopy.\n\nJe zřejmé, že se [activity.Custom('GetRaptorType')] nedávno pustil do boje s něčím, co na něj bylo příliš velké. A to něco musí být někde poblíž!"
 hunt.8030.a: "Najdeme tu bestii!"
 hunt.8030.success: "Uděláš obrovský pokrok"
 hunt.8030.failure: "Uděláš menší pokrok"
 hunt.8030.b: "„Vystopujte ji, já vás po chvilce odpočinku doženu.“"
 hunt.8040.t: "Rukavice pro štěstí"
 hunt.8040.desc: "[glove_salesman.GetName] je zatím hvězdou celého lovu. Z pařátů jeho [activity.Custom('GetRaptorType')] neustále stéká čerstvá krev a rukavice [glove_salesman.GetFirstNameNoTooltip] už vypadá, jako by byla natrvalo zbarvená do karmínova. Nedá mi to a ptám se, jak dokázal[Select_CString(glove_salesman.IsFemale,'a','')] vycvičit tak poslušného a skvělého loveckého ptáka. [glove_salesman.GetFirstNameNoTooltip] se jen zasměje.\n\n„Kéž bych mohl[Select_CString(glove_salesman.IsFemale,'a','')] tvrdit, že je to zásluha mého výcviku, ale popravdě je moje rukavice požehnaná [glove_salesman.GetFaith.FateGodName]. Za správnou cenu bych se jí mohl[Select_CString(glove_salesman.IsFemale,'a','')] vzdát.“"
 lucky_falconry_glove: "Sokolnická rukavice pro štěstí"
 lucky_falconry_glove_desc: "Věří se, že tato sokolnická rukavice přináší svému nositeli štěstí při lovu a dalších válečnických činnostech."
 hunt.8040.a: "Musím ji mít!"
 hunt.8040.b: "Štěstí nepotřebuji."
 hunt.8040.c: "„Dokážu nabídnout #EMP správnou cenu#!.“"
 hunt.8050.t: "Stopy!"
 hunt.8050.desc: "Znovu se ocitám v divočině a pátrám po [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U], ale stále jsem [Select_CString(ROOT.Char.IsFemale,'nenašla','nenašel')] jedinou stopu. Až teď. Z cesty totiž vede do dálky řada zvířecích stop.\n\n[m_hunt.GetName] mě vzrušeně popadne za paži a táhne mě pryč. [m_hunt.GetFirstNameNoTooltip] mě ujišťuje, že to nejsou stopy legendární bestie, nýbrž obyčejného [activity.Custom('GetAnimalType')]."
 hunt.8050.a: "Stejně budu stopy sledovat."
 legendary_animal_close_tt: "Stopy tě přivedou blíže k cíli"
 legendary_animal_no_trace_tt: "Stopy nikam nevedou"
 hunt.8050.b: "„Asi máš pravdu.“"
 hunt.8060.t: "Pozor!"
 hunt.8060.desc: "Daří se nám postupovat po stopách [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U], když nás vyruší zbědovaný[Select_CString(eccentric_hunter_scope.IsFemale,'á','')] a nevyspalý[Select_CString(eccentric_hunter_scope.IsFemale,'á','')] [Select_CString(eccentric_hunter_scope.IsFemale,'žena','muž')].\n\n„Pozor! Dejte si na tu bestii pozor! Už mnoho let pátrám po [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U], křížem krážem po [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]! Je krvelačná a touží jen po lidském mase! Odejděte, tohle břímě musím nést já!“"
 hunt.8060.a: "„Řekni mi všechno, co víš.“"
 hunt.8060.success: "[eccentric_hunter_scope.GetFirstNameNoTooltip] ti řekne všechno"
 hunt.8060.failure: "[eccentric_hunter_scope.GetFirstNameNoTooltip] ti neřekne nic"
 hunt.8060.b: "„Znáš [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l], přidej se ke mně!“"
 hunt.8060.c: "„Šílenče! Drž se ode mě dál!“"
 hunt.8070.t: "Založit, zamířit..."
 hunt.8070.desc.intro: "Už celé hodiny bloudím po [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]. [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U] mě pronásleduje i ve snech, ale vždy zůstává mimo můj dosah.\n\nA pak ho spatřím! Stojí nahoře na náspu, [activity.Custom('GetAnimalSoundParticiple')] a vystavuje se na slunci, jako by se mi vysmíval!"
 hunt.8070.desc.mid.lunatic: "Slyším tlumené šepotání své lovecké družiny. Myslí si, že tu bestii nedokážu skolit!"
 hunt.8070.desc.mid.paranoid: "Nevypadá to skutečně. Možná někdo z mého doprovodu vyrobil napodobeninu, aby mě obelstil!"
 hunt.8070.desc.mid.fallback: "Tahle moje posedlost mi v každém bdělém okamžiku přináší jen vztek."
 hunt.8070.desc.outro: "Nemohu se zbavit pocitu, že je to jen další sen, a přitom jsem úplně vzhůru."
 hunt.8070.a: "Vystřelit!"
 hunt.8070.b: "Ne, tohle nemůže být skutečné."
 hunt.8071.t: "... Vystřelit!"
 hunt.8071.desc.intro: "Vypustím šíp a sleduji, jak letí k náspu. [Select_CString(ROOT.Char.IsFemale,'Přísahala','Přísahal')] bych, že slyším bolestný výkřik, ale [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')] si nejsem.\n\nRozběhnu se k místu, odkud se ozval"
 hunt.8071.desc.outro: "a spatřím, jak bestie prchá hlouběji do [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]! Za sebou nechává krvavou stopu, ale zdá se, že ji můj zásah nijak vážně nezranil."
 hunt.8071.a: "Po krvavé stopě!"
 hunt.8072.desc.outro: "a najdu bezvládné tělo [murder_target.GetName] s šípem zabodnutým v lebce. Cítím, jak mi tuhne krev v žilách a slábnou končetiny. Jak jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] něco takového udělat? [murder_target.GetFirstNameNoTooltip] se vůbec nepodobá [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U]!"
 hunt.8072.a: "Přicházím o rozum."
 hunt.8073.desc.outro: "a jediné, co tam zůstalo, je šíp hluboko zabodnutý v zemi. Žádné stopy, žádný trus, vůbec žádné znamení po [activity.Custom('GetAnimalType')]. Bylo to tam vůbec, nebo si to všechno jen namlouvám? Existuje vůbec něco jako [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')]?"
 hunt.8073.a: "Nejsem žádný šílenec!"
 hunt.8074.desc.outro: "a najdu mrtvolu obyčejného [activity.Custom('GetAnimalType')], bez jediné stopy po čemkoli [activity.Custom('GetLegendaryColor')]. Možná si se mnou jen pohrálo světlo, ale alespoň je to čistý zásah."
 hunt.8074.a: "Úlovek jako úlovek."
 hunt.8500.t: "Na vrcholu světa"
 hunt.8500.desc: "Vypustím svého [activity.Custom('GetRaptorType')], ale místo aby letěl rovně za kořistí, ten hloupý tvor jen zamává křídly, doletí k nejbližšímu [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTree')] a usadí se tam.\n\nOhlédne se na mě těma prázdnýma, bezcitnýma očima, jako by mě právě nezesměšnil před celou loveckou družinou. Volám na něj, ať sleze dolů, ale odpovědí mi je jen tlumený smích ostatních lovců."
 hunt.8500.a: "Vylezu si pro něj sám[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 hunt.8500.success: "Získáš svého [activity.Custom('GetRaptorType')] zpět"
 hunt.8500.failure: "Spadneš"
 hunt.8500.b: "Věřím ve výcvik svého [activity.Custom('GetRaptorType')]."
 hunt.8500.falcon_success: "[activity.Custom('GetRaptorType')|U] se k tobě vrátí"
 hunt.8500.falcon_failure: "[activity.Custom('GetRaptorType')|U] zůstane nahoře"
 hunt.8510.t: "Pod útokem"
 hunt.8510.desc: "Krátce poté, co můj [activity.Custom('GetRaptorType')] zmizí v divočině, zaslechnu jeho zoufalý křik a skřeky. Rozběhnu se za zvukem a zjistím, že mého vznešeného loveckého ptáka drží za nohu odporný [ROOT.Char.Custom('GetAnimalType')]!\n\nMému drahému [activity.Custom('GetRaptorType')] se boj vůbec nevyvíjí dobře a tlamu [ROOT.Char.Custom('GetAnimalType')] pokrývá krev. Pokud zasáhnu, může [ROOT.Char.Custom('GetAnimalType')] napadnout i mě, ale nový [activity.Custom('GetRaptorType')] není zrovna levný..."
 hunt.8510.a: "S tou bestií se vypořádám [Select_CString(ROOT.Char.IsFemale,'sama','sám')]!"
 hunt.8510.a.success: "Zaženeš [ROOT.Char.Custom('GetAnimalType')]"
 hunt.8510.a.failure: "[ROOT.Char.Custom('GetAnimalType')|U] tě zřídí"
 hunt.8510.b: "Raději se do toho nebudu plést."
 hunt.8510.b.success: "[activity.Custom('GetRaptorType')|U] vyvázne bez zranění"
 hunt.8510.b.failure: "Budeš muset koupit náhradu"
 hunt.8510.c: "Od někoho z loveckých společníků si koupím lepšího [activity.Custom('GetRaptorType')]."
 hunt.8510.d: "Přesně vím, jak na [ROOT.Char.Custom('GetAnimalPlural')]!"
 hunt.8520.t: "Rozdělené cesty"
 hunt.8520.desc.intro: "Už nějakou dobu sledujeme stopy [activity.Custom('GetAnimalType')] skrz [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l], když si všimnu, že se záhadně rozdělují na dvě větve! Vydám se po stopách doleva, ale [m_hunt.GetName] mě táhne doprava.\n\n„Ale no tak, můj [ROOT.Char.GetTitleAsNameNoTooltip|U], tyhle stopy jsou očividně staré. Musíme sledovat ty čerstvější.“\n\n"
 hunt.8520.desc.outro.obsessed: "Myslí si snad [m_hunt.GetFirstNameNoTooltip], že jsem [Select_CString(ROOT.Char.IsFemale,'hlupačka','hlupák')]? Je jasné, že mě chce svést ze správné cesty."
 hunt.8520.desc.outro.fallback: "Když se podívám pozorněji, stopy vlevo skutečně vypadají o něco vybledlejší než ty vpravo."
 hunt.8520.a: "Půjdu doleva."
 hunt.8520.a.success: "Stopa tě přivede blíže k cíli"
 hunt.8520.a.failure: "Stopa tě nikam nedovede"
 hunt.8520.b: "Půjdu po stopách vpravo."
 hunt.8520.b.success: "$hunt.8520.a.success$"
 hunt.8520.b.failure: "$hunt.8520.a.failure$"
 hunt.8530.t: "V pasti"
 hunt.8530.desc.intro: "Tamhle! Na obzoru ji vidím! [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U]! Propadnu šílenému zápalu a rozběhnu se za ní, než mi zase zmizí před očima jako pára!\n\n#EMP KŘUP!#!\n\nAni necítím, jak mi noha uvízne mezi kameny. Jen vidím, jak se svět přede mnou propadne, když se až po boky zřítím do obyčejné pytlácké pasti! Zmítám se, ale ať dělám cokoli, nohu nedokážu vyprostit."
 hunt.8530.desc.outro.obsessed: "Nemohu dopustit, aby mi ta prokletá bestie zase unikla! Možná budu muset sáhnout ke krajnímu řešení..."
 hunt.8530.desc.outro.fallback: "Další příležitost tu bestii chytit už možná nedostanu, ale nezdá se, že by odsud vedla cesta ven."
 hunt.8530.a: "Když najdu správný úhel, určitě to půjde..."
 hunt.8530.a.success: "Osvobodíš se"
 hunt.8530.a.failure: "Situaci ještě zhoršíš"
 hunt.8530.b: "„Pomoc! Pomozte mi!“"
 hunt.8530.c: "Musím se té zatracené nohy zbavit!"
 hunt.8540.t: "[activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U]: Znamení"
 hunt.8540.desc.intro: "Znovu se mi zdá o [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] a o tom, jak se mi vysmívá. Upřeně na mě hledí a pak se ozve burácivé [activity.Custom('GetAnimalSoundParticiple')], které mě s křikem vytrhne ze snu zpět do bdělého světa loveckého tábora.\n\n"
 hunt.8540.desc.mid.witch: "[ROOT.Char.GetFaith.WitchGodName|U] se mnou musí promlouvat skrze sny a říkat mi, že ta bestie je někde tam venku a je určena mně. Vyhlédnu z okna a spatřím nejrůznější zvířata, která všechna hledí stejným směrem."
 hunt.8540.desc.mid.orion: "Vyhlédnu z okna a souhvězdí Lovce září jasněji, než jsem kdy viděl[Select_CString(ROOT.Char.IsFemale,'a','')], jako by mě volalo k sobě."
 hunt.8540.desc.mid.ursa_major: "Vyhlédnu z okna a na čisté noční obloze se jasně třpytí souhvězdí [activity.Custom('GetAnimalType')], které mě volá do divočiny."
 hunt.8540.desc.mid.lights: "Vyhlédnu z okna a jasně jako ve dne spatřím řadu třpytivých bílých světel táhnoucích se do divočiny. Možná mě vedou přímo ke kořisti."
 hunt.8540.desc.mid.comet: "Vyhlédnu z okna a s úžasem sleduji kometu putující oblohou. Možná mi ukazuje konkrétní místo v [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]."
 hunt.8540.desc.outro: "\n\nNemohu popřít, že to, co vidím, je skutečné, ale tělo mám úplně vyčerpané."
 hunt.8540.a: "Tohle #EMP musí#! být znamení pro zítřek!"
 hunt.8540.a.success: "Znamení vyložíš správně"
 hunt.8540.a.failure: "Znamení tě nikam nedovedou"
 hunt.8540.b: "Teď už neusnu, musím vyrazit co nejdřív!"
 hunt.8540.b.success: "Uděláš pokrok"
 hunt.8540.b.failure: "Nenajdeš po bestii ani stopu"
 hunt.8540.c: "Tento dar seslal [ROOT.Char.GetFaith.CreatorName|U]."
 hunt.8540.d: "To je nádhera, musím to ukázat [intent_target_character.GetFirstNameNoTooltip]!"
 hunt.8550.t: "[activity.Custom('GetLegendaryColor')|U] trus"
 hunt.8550.desc: "V pátrání po legendárním [activity.Custom('GetLegendaryColor')|U] [activity.Custom('GetAnimalType')|U] dělám pokroky. Jeho stopy mě odvádějí z vyšlapané cesty, než se nakonec úplně vytratí. Začíná mě přemáhat zoufalství, když tu náhle spatřím něco, co mi vyrazí dech.\n\nTrus v nejčistší [activity.Custom('GetLegendaryColor')] barvě, jaký jsem ještě nikdy neviděl[Select_CString(ROOT.Char.IsFemale,'a','')]! Jestli je sama bestie [activity.Custom('GetLegendaryColor')], pak přece dává smysl, aby měl podobnou barvu i její trus."
 hunt.8550.a: "Tohle #EMP musí#! být pravda!"
 hunt.8550.a.success: "Trus tě přivede blíže k cíli"
 hunt.8550.a.failure: "Ztratíš po bestii veškeré stopy"
 hunt.8550.b: "Možná bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] zjistit, čí je."
 hunt.8550.b.success: "Správně určíš původ trusu"
 hunt.8550.b.failure: "Nedokážeš určit původ trusu"
 hunt.8550.c: "Tohle je falešná stopa, musíme hledat jinde."
 hunt.8550.d: "Tohle je #EMP legendární#! trus!"
 legendary_fumes: "Legendární výpary"
 legendary_fumes_desc: "Tvrdí se, že tento trus pochází od bájného [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')]."
 hunt.8560.t: "Velká šelma, malé mládě"
 hunt.8560.desc: "Když se touláme divočinou a pátráme po smrtícím [activity.Custom('GetAnimalType')], zaslechnu opodál tiché, žalostné mňoukání. Vydám se za zvukem a najdu drobné mládě [activity.Custom('GetAnimalType')], menší než obyčejná toulavá kočka. Třese se a stojí úplně nehybně na otevřeném prostranství.\n\n[hunt_participant.GetName|U] k němu přispěchá a vezme si vrnící mládě do náruče.\n\n„Chudáčkovi nejspíš zemřeli rodiče nebo se ztratili. Je přece naší povinností chránit zranitelná stvoření [hunt_participant.GetFaith.CreatorNamePossessive], ne?“"
 hunt.8560.a: "Jeho křikem můžeme přilákat skutečného [activity.Custom('GetAnimalType')]!"
 hunt.8560.b: "Postarám se o něj."
 hunt.8560.c: "„Hoď tu věc zpátky tam, kde jsi ji našel[Select_CString(hunt_participant.IsFemale,'a','')]!“"
 hunt.8570.t: "Stampedo!"
 hunt.8570.desc: "Začalo to pouhým duněním, ale záhy se rozechvěl celý svět, jako by se [ROOT.Char.GetFaith.DevilName] pokoušel rozervat [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] na kusy!\n\nVzápětí celou mýtinu zaplaví moře [activity.Custom('GetAnimalPlural')] a [stampede_victim.Custom2('MyCharacterIntroduction', ROOT.Char)] uvízne přímo uprostřed!\n\nZatím se [Select_CString(stampede_victim.IsFemale,'jí','mu')] ty bestie vyhýbají, ale pokud nic neudělám, [stampede_victim.GetFirstNameNoTooltip] určitě zemře."
 hunt.8570.a: "„Už jdu!“"
 hunt.8570.a.success: "Zachráníš [stampede_victim.GetFirstNameNoTooltip] bez jediného zranění"
 hunt.8570.a.failure: "Zachráníš [stampede_victim.GetFirstNameNoTooltip], ale se zraněními"
 hunt.8570.a.failure_2: "Nepodaří se ti zachránit [stampede_victim.GetFirstNameNoTooltip]"
 hunt.8570.a.crit_failure: "Při pokusu o záchranu zemřeš"
 hunt.8570.b: "Možná dokážu stampedo odklonit."
 hunt.8570.b.success: "Odkloníš stampedo"
 hunt.8570.b.failure: "Nepodaří se ti stampedo odklonit"
 hunt.8570.c: "Dobrá příležitost skolit pár opozdilců!"
 hunt.8570.c.success: "Několikrát dobře zasáhneš"
 hunt.8570.c.failure: "Nepodaří se ti skolit ani jediného [activity.Custom('GetAnimalType')]"
 hunt.8570.c.death: "[stampede_victim.GetName] je [Select_CString(stampede_victim.IsFemale,'ušlapána','ušlapán')]"
 hunt.8570.c.survives: "[stampede_victim.GetName] přežije"
 hunt.8570.d: "[stampede_victim.GetFirstNameNoTooltip] si musí poradit [Select_CString(stampede_victim.IsFemale,'sama','sám')]."
 hunt.8580.t: "Tváří v tvář"
 hunt.8580.desc: "Od lovecké družiny se odloučím jen na okamžik, ale i ten stačí, aby se na vysokém balvanu objevil [activity.Custom('GetAnimalType')]. Zastaví se a upřeně na mě hledí, jako bych měl[Select_CString(ROOT.Char.IsFemale,'a být jeho další kořistí',' být jeho další kořistí')]. Vyschne mi v hrdle a pevněji sevřu luk.\n\nVšechny mé lovecké zkušenosti mi říkají, že v blízkosti [activity.Custom('GetAnimalType')] je nejlepší zůstat nehybně stát, chce-li člověk přežít. Jenže v tuto chvíli jsem otrokem vlastních instinktů."
 hunt.8580.a: "Musím se pokusit zůstat nehybně."
 hunt.8580.a.success: "[activity.Custom('GetAnimalType')|U] ustoupí"
 hunt.8580.a.failure: "[activity.Custom('GetAnimalType')|U] tě zřídí"
 hunt.8580.b: "Můžu vystřelit."
 hunt.8580.b.success: "Zasáhneš [activity.Custom('GetAnimalType')]"
 hunt.8580.b.failure: "$hunt.8580.a.failure$"
 hunt.8580.c: "Utéct a přivolat pomoc!"
 hunt.8580.c.success: "Unikneš"
 hunt.8580.c.failure: "$hunt.8580.a.failure$"
 hunt.8590.t: "[activity.Custom('GetAnimalPlural')|U] v doupěti"
 hunt.8590.desc: "Když vystoupáme na vrchol kopce, naše lovecká družina narazí na temnou jeskyni, která jako by neměla konce. Kolem jejího vchodu jsou jasné známky toho, že se tu zdržuje [activity.Custom('GetAnimalType')]!\n\nNení pochyb, že zde žije [activity.Custom('GetAnimalType')], nebo dokonce celá skupina [activity.Custom('GetAnimalPlural')]. Pokud tu počkáme do setmění, téměř jistě se dočkáme kořisti."
 hunt.8590.a: "Tak tedy počkáme!"
 hunt.8590.a.success: "[activity.Custom('GetAnimalType')|U] se vrátí domů"
 hunt.8590.a.failure: "[activity.Custom('GetAnimalType')|U] se neobjeví"
 hunt.8590.b: "Podle těchto stop jej můžeme vystopovat."
 hunt.8590.b.success: "V pátrání po [activity.Custom('GetAnimalType')] uděláš pokrok"
 hunt.8590.b.failure: "Nepodaří se ti [activity.Custom('GetAnimalType')] vystopovat"
