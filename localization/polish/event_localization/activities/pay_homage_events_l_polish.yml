l_polish:
 pay_homage_header: "Pocta:"
 pay_homage.0001.opening: "[homage_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 pay_homage.0001.desc: "[Select_CString(homage_vassal.IsFemale,'Dorazila','Dorazil')] jsem do [homage_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], abych ti, [homage_liege.GetTitleAsNameNoTooltip], na důkaz své věrnosti [Select_CString(homage_vassal.IsFemale,'vzdala','vzdal')] poctu.\n\n"
 pay_homage.0001.desc.submission: "Doufám, že už samotný slib poddanosti bude dostatečným důkazem mé cti."
 pay_homage.0001.desc.gold: "Přináším ti bohaté dary hodné tvého majestátu jako znamení své dobré vůle a oddanosti."
 pay_homage.0001.desc.hook: "Dávám ti své slovo, že splním vše, co si ode mě budeš přát."
 pay_homage.0001.desc.contract: "Na znamení tvé svrchovanosti a své věrnosti přijmu jako tvůj vazal větší závazky."
 pay_homage.0001.a: "Uveďte [homage_vassal.GetTitledFirstNameNoTooltip] okamžitě dovnitř."
 pay_homage.0001.a.tt: "Přijmeš [homage_vassal.GetTitledFirstName]"
 pay_homage.0001.b: "Takové patolízalství pro mě nic neznamená."
 pay_homage.0001.b.tt: "Pošleš [homage_vassal.GetTitledFirstName] pryč"
 pay_homage.0009.opening: "[homage_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
 pay_homage.0009.desc: "Tvým [homage_vassal.Custom2('InsultAdjective', SCOPE.sC('homage_liege'))] divadlem se oklamat nenechám. Tvá přísaha věrnosti pro mě nic neznamená."
 pay_homage.0009.a: "To je nehorázné!"
 pay_homage.0101.t: "$pay_homage_header$ Pokleknutí"
 pay_homage.0101.t.language: "$pay_homage_header$ Dvojsmysl"
 pay_homage.0101.t.clumsy: "$pay_homage_header$ Zahanbení"
 pay_homage.0101.t.infatuation: "$pay_homage_header$ Objekt touhy"
 pay_homage.0101.t.delivery: "$pay_homage_header$ Jazyk se zapletl"
 pay_homage.0101.desc: "Trpělivě čekám na trůnu na příchod [homage_vassal.GetTitledFirstName]. Brzy zazní oznámení a [homage_vassal.GetFirstNameNoTooltip] je [Select_CString(homage_vassal.IsFemale,'uvedena','uveden')] přede mě.\n\n"
 pay_homage.0101.desc.submission: "[homage_vassal.GetFirstNameNoTooltip|U] přede mnou poklekne a nabídne pouze svou přísahu, že bude věrně sloužit jako vazal [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0101.desc.gold: "[homage_vassal.GetFirstNameNoTooltip|U] přede mnou poklekne, zatímco sluhové přinášejí dary v podobě mincí a cenností. Přísaha je složena a písaři zaznamenávají závazek věrně sloužit [homage_liege.GetPrimaryTitle.GetNameNoTooltip].\n\n"
 pay_homage.0101.desc.hook: "[homage_vassal.GetFirstNameNoTooltip|U] přede mnou poklekne a kromě dalších přísah služby [homage_liege.GetPrimaryTitle.GetNameNoTooltip] se mi zcela vydává na milost a zavazuje se mi dluhem.\n\n"
 pay_homage.0101.desc.contract: "[homage_vassal.GetFirstNameNoTooltip|U] přede mnou poklekne a kromě dalších přísah služby [homage_liege.GetPrimaryTitle.GetNameNoTooltip] mi jako vazal [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] nabídne větší odvody.\n\n"
 pay_homage.0101.desc.language: "Ačkoli si [homage_vassal.GetTitleAsNameNoTooltip] přísahu v [homage_liege.GetCourtLanguage.GetNameNoTooltip] očividně [Select_CString(homage_vassal.IsFemale,'nacvičila','nacvičil')], několik částí vysloví špatně, čímž jejich význam komicky překroutí a mé dvořany donutí potlačovat smích."
 pay_homage.0101.desc.clumsy: "Když [homage_vassal.GetTitledFirstNameNoTooltip] vstává, nešikovně klopýtne. Dvůr svorně zalapá po dechu, když [Select_CString(homage_vassal.IsFemale,'upadne a skončí rozvalená','upadne a skončí rozvalený')] u mých nohou, tváře rozpálené studem."
 pay_homage.0101.desc.infatuation: "[homage_vassal.GetTitledFirstNameNoTooltip] vstává poněkud rozpačitě. Koutkem oka si všimnu, jak se [homage_infatuation.GetFullName], [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))], nad [homage_vassal.GetTitleAsNameNoTooltip] doslova rozplývá!"
 pay_homage.0101.desc.delivery: "Od samého začátku se nic nedaří. [homage_vassal.Custom('GetHomageDeliveryDescLiege')]"
 pay_homage.0101.desc.success: "Nakonec vyzvu [homage_vassal.GetTitleAsNameNoTooltip], aby [Select_CString(homage_vassal.IsFemale,'povstala','povstal')], dávám najevo svou spokojenost a potvrzuji právo [homage_vassal.GetFirstNameNoTooltip] vládnout zemím, které spravuje mým jménem."
 pay_homage.0101.smooth.submission: "„Dobře mi služ, [homage_vassal.GetTitledFirstNameNoTooltip].“"
 pay_homage.0101.smooth.gold: "„Přijímám tvé štědré dary, [homage_vassal.GetTitledFirstNameNoTooltip].“"
 pay_homage.0101.smooth.hook: "„Těší mě, že vím, že se na tebe mohu obrátit, [homage_vassal.GetTitledFirstNameNoTooltip].“"
 pay_homage.0101.smooth.contract: "„Tvé služby jsou neocenitelné, [homage_vassal.GetTitledFirstNameNoTooltip].“"
 pay_homage.0101.faux_pas.language: "„Dobrá snaha, [homage_vassal.GetFirstNameNoTooltip]. Není to snadný jazyk.“"
 pay_homage.0101.faux_pas.clumsy: "„Pro mě jsou důležité tvé přísahy.“"
 pay_homage.0101.faux_pas.infatuation: "„Ehm... myslím, že jsme tady skončili.“"
 pay_homage.0101.faux_pas.delivery: "„Důležitá je tvá věrnost, ne tvůj jazyk.“"
 pay_homage.0101.insult.language: "„Máš #EMP vůbec#! ponětí, co jsi právě řekl[Select_CString(homage_vassal.IsFemale,'a','')]?“"
 pay_homage.0101.insult.clumsy: "„To byla naprostá ostuda.“"
 pay_homage.0101.insult.infatuation: "„Jak se #EMP opovažuješ#!? Ven!“"
 pay_homage.0101.insult.delivery: "„Co to #EMP mělo#! být?“"
 pay_homage.0201.desc: "Sluhové mě uvedou do velkého sálu v [homage_liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], kde [homage_liege.GetTitledFirstNamePossessiveRegnal] sedí na trůnu a čeká na mou přísahu.\n\n"
 pay_homage.0201.desc.language: "Pokleknu před [homage_liege.GetTitledFirstNameNoTooltip] a začnu odříkávat nacvičené přísahy v [homage_liege.GetCourtLanguage.GetNameNoTooltip]. Tlumené pochechtávání dvořanů však dává jasně najevo, že jazyk zdejšího dvora ještě zdaleka neovládám...\n\n"
 pay_homage.0201.desc.clumsy: "Chystám se pokleknout před [homage_liege.GetTitledFirstNameNoTooltip], ale ve spěchu nešikovně klopýtnu a skončím v hromádce u trůnu. Vyškrábu se zpět na nohy a přísahy přesto pronesu, zatímco mi před celým shromážděným dvorem hoří tváře studem...\n\n"
 pay_homage.0201.desc.infatuation: "Pokleknu před [homage_liege.GetTitledFirstNameNoTooltip] a začnu odříkávat přísahy. Přitom se střetnu pohledem s [homage_infatuation.GetFullName], [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))], kdo se na mě lákavě usměje a záměrně mrkne. Když pohled vrátím k [homage_liege.GetFirstNameNoTooltip], setkám se s ostrým pohledem! Rychle dokončím řeč a klopím oči, zatímco se dvorem šíří šeptané klepy...\n\n"
 pay_homage.0201.desc.delivery: "Pokleknu před [homage_liege.GetTitledFirstNameNoTooltip] a začnu pronášet přísahy, jenže všechno se rychle zvrtne. [homage_vassal.Custom('GetHomageDeliveryDescVassal')]\n\n"
 pay_homage.0201.desc.success: "Pokleknu u nohou [homage_liege.GetTitledFirstNameNoTooltip] a skládám jednu přísahu věrnosti za druhou, zatímco písaři vše zaznamenávají.\n\n"
 pay_homage.0201.desc.submission: "Tím je obřad završen. [homage_liege.GetTitleAsNameNoTooltip] nemohu nabídnout nic kromě slibu, že budu [Select_CString(ROOT.Char.IsFemale,'věrně sloužit jako vazalka','věrně sloužit jako vazal')] [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0201.desc.gold: "Poté předstoupí mí služebníci a před celým shromážděným dvorem odevzdají [homage_liege.GetTitleAsNameNoTooltip] mé bohaté dary.\n\n"
 pay_homage.0201.desc.hook: "Pak přichází můj další slib. [homage_liege.GetFirstNameNoTooltip] se na mě může obrátit s jakoukoli žádostí a já budu při všech záměrech [homage_liege.GetTitleAsNameNoTooltip] stát věrně po boku.\n\n"
 pay_homage.0201.desc.contract: "Nakonec přichází můj dar. Na znamení věrnosti a pro dobro koruny se zavazuji zvýšit své odvody [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0201.desc.insult_language: "[homage_liege.GetFirstNameNoTooltip] se na mě přísně zadívá, pak vyprskne smíchy a začne opakovat mé zkomolené přísahy s příšerným přízvukem v [homage_vassal.GetCulture.GetLanguage.GetNameNoTooltip]..."
 pay_homage.0201.desc.insult_clumsy: "[homage_liege.GetFirstNameNoTooltip] skrývá za rukou široký úsměv, zatímco se dvorem pomalu šíří smích. Takhle si mě budou pamatovat..."
 pay_homage.0201.desc.insult_infatuation: "[homage_liege.GetFirstNameNoTooltip] vrhne rozzlobený pohled na [homage_infatuation.GetFullName], [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))], a bez jediného slova uznání mě vykáže ze síně."
 pay_homage.0201.desc.insult_delivery: "[homage_liege.GetFirstNameNoTooltip] se ohne smíchy a mezi výbuchy chechotu začne dopodrobna opakovat části mé řeči..."
 pay_homage.0201.desc.brush_off: "K mému překvapení se [homage_liege.GetFirstNameNoTooltip] chová téměř, jako by se nic nestalo, a mou poctu přijme s grácií.\n\n"
 pay_homage.0201.desc.outro: "[homage_liege.GetFirstNameNoTooltip] mě vyzve, abych [Select_CString(ROOT.Char.IsFemale,'povstala','povstal')], vyjádří svou spokojenost a potvrdí mé právo na země, kterým vládnu jménem svého lenního pána."
 pay_homage.0201.smooth.submission: "Ať žije [homage_liege.GetTitleAsNameNoTooltip]."
 pay_homage.0201.smooth.gold: "Cena za věrnost..."
 pay_homage.0201.smooth.hook: "Doufejme, že půjde o malou laskavost..."
 pay_homage.0201.smooth.contract: "Břemeno služby..."
 pay_homage.0201.faux_pas: "Nakonec přece jen spravedlivý vládce."
 pay_homage.0201.insult: "[Select_CString(ROOT.Char.IsFemale,'Nikdy jsem sem neměla chodit.','Nikdy jsem sem neměl chodit.')]"
 homage_delivery_stutter_liege: "[ROOT.Char.GetTitledFirstNameNoTooltip] se sotva dostane do poloviny první věty, než další slova zadusí koktání. Mí dvořané s bolestnými výrazy sledují statečný boj s vlastním hlasem."
 homage_delivery_lisp_liege: "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] řeč je... nezapomenutelná. Vada výslovnosti sykavek poněkud ubírá přísaze na vážnosti, zvlášť když se řečník musí prokousávat jednou sykavkou za druhou a předstírat, že neslyší pochechtávání méně ohleduplných dvořanů."
 homage_delivery_wheeze_liege: "[ROOT.Char.GetTitledFirstNameNoTooltip] mě skutečně zaujme. Tréma z celé podívané spolu s uspěchaným příchodem si vybírá svou daň a během řeči se mezi jednotlivými větami ozývá sípání a zoufalé lapání po dechu."
 homage_delivery_slow_liege: "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] řeč je... špatná. Několikrát ztratí nit, odbíhá k nesouvisejícím tématům a některá z nejdůležitějších slov špatně pochopí nebo vysloví."
 homage_delivery_inconceivable_liege: "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] řeč je... zajímavá. Je plná archaických obratů a vznešených slov, jejichž skutečnému významu řečník očividně vůbec nerozumí. Výsledkem je dvojnásobně dlouhý projev a vzdělanější dvořané, kteří se sotva drží smíchy."
 homage_delivery_stutter_vassal: "Sotva začnu pronášet první přísahu, koktání mě přeruší. Nakonec se přinutím pokračovat, zatímco mě dvůr sleduje se směsicí pobavení a rozpaků, ale celý den už zůstane poznamenán mou vadou."
 homage_delivery_lisp_vassal: "Mou řeč provází potlačované pochechtávání, zatímco se ze všech sil snažím správně vyslovovat navzdory své vadě řeči. Slavnostnost obřadu i váha mé přísahy tím značně trpí."
 homage_delivery_wheeze_vassal: "Srdce mi buší stále rychleji a já jen obtížně popadám dech. Když se pokusím řeč uspěchat, všechno se ještě zhorší. Na tenhle projev nebude nikdo vzpomínat v dobrém."
 homage_delivery_slow_vassal: "Snažím se ze všech sil, ale pozvednutá obočí a pohledy mého lenního pána i celého dvora mi jasně říkají, že můj výkon byl spíš zábavný než působivý."
 homage_delivery_inconceivable_vassal: "Vytáhnu všechny trumfy a snažím se dostát významu okamžiku oslnivou slovní zásobou, jenže... reakce dvora není zrovna taková, v jakou jsem [Select_CString(ROOT.Char.IsFemale,'doufala','doufal')]."
 pay_homage.0601.t: "$pay_homage_header$ Zrušeno"
 pay_homage.0601.desc.court: "Po dokončení korunovace na [ROOT.Char.GetTitleAsNameNoTooltip] už mé přípravy na vzdání pocty nejsou zapotřebí..."
 pay_homage.0601.desc.imprisoned_me: "$pay_homage.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] mě [Select_CString(ROOT.Char.GetImprisonedBy.IsFemale,'uvrhla','uvrhl')] do vězení."
 pay_homage.0601.desc.imprisoned: "$pay_homage.0601_shared_intro$ [Select_CString(ROOT.Char.IsFemale,'Padla jsem do zajetí.','Padl jsem do zajetí.')]"
 pay_homage.0601.desc.liege_dead_me: "$pay_homage.0601_shared_intro$ Nakonec jsem [homage_liege.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')]...\n\n"
 pay_homage.0601.desc.liege_dead: "$pay_homage.0601_shared_intro$ [homage_liege.GetTitledFirstName] [homage_liege.GetDeathReasonHideKiller]...\n\n"
 pay_homage.0601.desc.liege_imprisoned_me: "$pay_homage.0601_shared_intro$ Nakonec se mi podařilo zajmout [homage_liege.GetTitledFirstName]!"
 pay_homage.0601.desc.liege_imprisoned: "$pay_homage.0601_shared_intro$ [homage_liege.GetImprisonedBy.GetTitledFirstName] [Select_CString(homage_liege.GetImprisonedBy.IsFemale,'zajala','zajal')] [homage_liege.GetTitledFirstName]."
 pay_homage.0601.desc.new_liege: "Pokud mám složit přísahu, musí nyní patřit [Select_CString(ROOT.Char.GetLiege.IsFemale,'mé nové lenní paní','mému novému lennímu pánovi')], [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 pay_homage.0601_shared_intro: "[Select_CString(ROOT.Char.IsFemale,'Právě když jsem dokončovala poslední úpravy své přísahy věrnosti,','Právě když jsem dokončoval poslední úpravy své přísahy věrnosti,')]"
 pay_homage.0601.desc: "\n\nTohle rozhodně mění situaci."
 pay_homage.0601.a_court: "Kupředu, k větším věcem."
 pay_homage.0601.a_prison: "Zatraceně."
 pay_homage.0601.a_liege: "Nanejvýš nepříjemné..."
 pay_homage.0601.a: "Je čas všechno přehodnotit..."
 pay_homage_costs_refunded: "Náklady na $pay_homage_decision$ vráceny"
