l_polish:
 pay_homage_header: "Hold:"
 pay_homage.0001.opening: "[homage_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 pay_homage.0001.desc: "Přišel jsem do [homage_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], abych vám, slavný [homage_liege.GetTitleAsNameNoTooltip], vzdal hold jako projev své věrnosti. \n\n"
 pay_homage.0001.desc.submission: "Doufám, že samotné mé ujištění o podřízení je dostatečným důkazem mé cti."
 pay_homage.0001.desc.gold: "Přináším vám bohaté dary hodné vaší veličenosti, jako projev mé dobré vůle a poslušnosti."
 pay_homage.0001.desc.hook: "Máte mé slovo, že udělám cokoli, co po mně budete chtít, má [homage_liege.GetLadyLord]."
 pay_homage.0001.desc.contract: "Na znamení vašeho panství a mé věrnosti vám přislíbím větší povinnosti jako váš vazal."
 pay_homage.0001.a: "Pusťte dovnitř [homage_vassal.GetTitledFirstNameNoTooltip] ihned."
 pay_homage.0001.a.tt: "Přijímáte [homage_vassal.GetTitledFirstName]"
 pay_homage.0001.b: "[Select_CString(homage_vassal.IsFemale,'Její','Jeho')] podlézání pro mě nic neznamená."
 pay_homage.0001.b.tt: "Posíláte pryč [homage_vassal.GetTitledFirstName]"
 pay_homage.0009.opening: "[homage_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
 pay_homage.0009.desc: "Nenechám se oklamat vaším [homage_vassal.Custom('InsultAdjective')] vystoupením; přísaha holdu od vás by pro mě nic neznamenala."
 pay_homage.0009.a: "Neslýchané!"
 pay_homage.0101.t: "$pay_homage_header$ Pokleknutí"
 pay_homage.0101.t.language: "$pay_homage_header$ Dvojsmysl"
 pay_homage.0101.t.clumsy: "$pay_homage_header$ Zahanbený"
 pay_homage.0101.t.infatuation: "$pay_homage_header$ Zpředmětněn"
 pay_homage.0101.t.delivery: "$pay_homage_header$ Zmlklý"
 pay_homage.0101.desc: "Trpělivě čekám na svém trůně na příchod [homage_vassal.GetTitledFirstName], který je brzy oznámen a přiveden přede mě. \n\n"
 pay_homage.0101.desc.submission: "[homage_vassal.GetSheHe|U] pokleká v úctě a nenabízí nic jiného než [Select_CString(homage_vassal.IsFemale,'její','jeho')] přísahu věrně sloužit jako vazal [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0101.desc.gold: "[homage_vassal.GetSheHe|U] pokleká v úctě, zatímco sluhové přinášejí [Select_CString(homage_vassal.IsFemale,'její','jeho')] dary mince a cenných předmětů. Přísaha je složena a písaři zaznamenávají [Select_CString(homage_vassal.IsFemale,'její','jeho')] závazky sloužit [homage_liege.GetPrimaryTitle.GetNameNoTooltip].\n\n"
 pay_homage.0101.desc.hook: "[homage_vassal.GetSheHe|U] pokleká v úctě a, mezi [Select_CString(homage_vassal.IsFemale,'jejími','jeho')] ostatními sliby sloužit [homage_liege.GetPrimaryTitle.GetNameNoTooltip], staví [homage_vassal.GetHerselfHimself] do mé dispozice a v dluhu ke mně.\n\n"
 pay_homage.0101.desc.contract: "[homage_vassal.GetSheHe|U] pokleká v úctě a, mezi [Select_CString(homage_vassal.IsFemale,'jejími','jeho')] ostatními sliby sloužit [homage_liege.GetPrimaryTitle.GetNameNoTooltip], nabízí mi větší příspěvky jako vazalský pán [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0101.desc.language: "Ačkoli [homage_vassal.GetTitleAsNameNoTooltip] zjevně cvičil přísahy v [homage_liege.GetCourtLanguage.GetNameNoTooltip], [homage_vassal.GetSheHe] několikrát špatně vysloví některé části, což humorně změní jejich význam a způsobí, že moji dvořané se dusí potlačovanými chichoty."
 pay_homage.0101.desc.clumsy: "Když [homage_vassal.GetTitledFirstNameNoTooltip] vstane, [homage_vassal.GetSheHe] se neohrabaně zakymácí. Dvůr se synchronně zachvěje údivem, když [homage_vassal.GetSheHe] padá a končí rozvalený u mých nohou, tváře má zčervenalé studem."
 pay_homage.0101.desc.infatuation: "[homage_vassal.GetTitledFirstNameNoTooltip] vstane a vypadá neohrabaně. Koutkem oka si všimnu, že můj [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] [homage_infatuation.GetFullName] omdlévá, zjevně poblázněn [homage_vassal.GetTitleAsNameNoTooltip]!"
 pay_homage.0101.desc.delivery: "Od začátku to nejde dobře. [homage_vassal.Custom('GetHomageDeliveryDescLiege')]"
 pay_homage.0101.desc.success: "Nakonec přikážu [homage_vassal.GetTitleAsNameNoTooltip] vstát, čímž potvrdím svou spokojenost, a [homage_vassal.GetFirstNamePossessiveNoTooltip] práva na země, kterými [homage_vassal.GetSheHe] spravuje v mém zastoupení."
 pay_homage.0101.smooth.submission: "„Služ mi dobře, [homage_vassal.GetTitledFirstNameNoTooltip].“"
 pay_homage.0101.smooth.gold: "„Přijímám tvé štědré dary, [homage_vassal.GetTitledFirstNameNoTooltip].“"
 pay_homage.0101.smooth.hook: "„Jsem rád, že se na tebe mohu obrátit, [homage_vassal.GetTitledFirstNameNoTooltip].“"
 pay_homage.0101.smooth.contract: "„Tvé služby jsou neocenitelné, [homage_vassal.GetTitledFirstNameNoTooltip].“"
 pay_homage.0101.faux_pas.language: "„Dobrá snaha, [homage_vassal.GetFirstNameNoTooltip]; není to snadný jazyk.“"
 pay_homage.0101.faux_pas.clumsy: "„Pro mě jsou důležité jen tvé přísahy.“"
 pay_homage.0101.faux_pas.infatuation: "„Ehm... myslím, že jsme hotovi.“"
 pay_homage.0101.faux_pas.delivery: "„Co na tom záleží, je tvá věrnost, ne tvůj jazyk.“"
 pay_homage.0101.insult.language: "„Máš #EMP vůbec nějakou#! představu, co jsi právě řekl?“"
 pay_homage.0101.insult.clumsy: "„To je ostuda.“"
 pay_homage.0101.insult.infatuation: "„Jak se #EMP opovažuješ#!? Pryč!“"
 pay_homage.0101.insult.delivery: "„Co to #EMP bylo#!?“"
 pay_homage.0201.desc: "Služebníci mě dovedou do velké síně [homage_liege.GetTitledFirstNamePossessiveRegnal] v [homage_liege.GetCapitalLocation.GetNameNoTooltip], kde [homage_liege.GetSheHe] sedí na svém trůně a čeká, až složím svou přísahu.\n\n"
 pay_homage.0201.desc.language: "Poklekám před [homage_liege.GetHerHim] a recituji přísahy v [homage_liege.GetCourtLanguage.GetNameNoTooltip], které jsem cvičil, ale polozakryté chichotání dvora jasně ukazuje, že můj jazyk v jazyce dvora mého pána potřebuje více praxe...\n\n"
 pay_homage.0201.desc.clumsy: "Jdu pokleknout před [homage_liege.GetHerHim], ale v spěchu se neohrabaně zakymácím a skončím v hromadě u [Select_CString(homage_liege.IsFemale,'její','jeho')] nohou. Vzchopím se a přísahy i tak složím, tváře mi hoří před shromážděným dvorem...\n\n"
 pay_homage.0201.desc.infatuation: "Poklekám před [homage_liege.GetHerHim] a začnu. Při recitaci přísah zachytím pohled [homage_infatuation.GetFullName], [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] k [homage_liege.GetFirstNameNoTooltip], který se vyzývavě usměje a záměrně mi mrkne. Když se podívám zpět na svého pána, setkám se s [Select_CString(homage_liege.IsFemale,'jejím','jeho')] pohledem! Ukončím proslov a odvrátím oči, zatímco dvůr šeptá své drby...\n\n"
 pay_homage.0201.desc.delivery: "Poklekám před [homage_liege.GetHerHim] a začnu pronášet přísahy, ale věci se rychle rozpadnou. [homage_vassal.Custom('GetHomageDeliveryDescVassal')]\n\n"
 pay_homage.0201.desc.success: "Poklekám u nohou mého [homage_liege.GetLadyLord] a skládám mnoho přísah holdu, zatímco [Select_CString(homage_liege.IsFemale,'její','jeho')] písaři zaznamenávají událost.\n\n"
 pay_homage.0201.desc.submission: "Tím je obřad dokončen; nemám nic, čím bych mohl svému [homage_liege.GetTitleAsNameNoTooltip] nabídnout kromě svého slibu věrně sloužit jako vazal [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pay_homage.0201.desc.gold: "Moji sluhové pak přijdou a před shromážděným dvorem předají mé bohaté dary [homage_liege.GetTitleAsNameNoTooltip].\n\n"
 pay_homage.0201.desc.hook: "Pak přichází můj slib, že se na mě může [homage_liege.GetSheHe] kdykoli obrátit o přízeň, jako loajální podporovatel [homage_liege.GetTitleAsNameNoTooltip] ve všech [Select_CString(homage_liege.IsFemale,'jejích','jeho')] snahách.\n\n"
 pay_homage.0201.desc.contract: "Pak přijde můj dar; potvrzuji, že zvýším své příspěvky [homage_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] jako znamení mé věrnosti a pro blaho koruny.\n\n"
 pay_homage.0201.desc.insult_language: "[homage_liege.GetFirstNameNoTooltip] se na mě přísně podívá, pak propukne v smích a papouškuje mé špatně vyslovené přísahy v chabém [homage_vassal.GetCulture.GetLanguage.GetNameNoTooltip] přízvuku..."
 pay_homage.0201.desc.insult_clumsy: "[homage_liege.GetFirstNameNoTooltip] se za [Select_CString(homage_liege.IsFemale,'její','jeho')] rukou široce usměje, zatímco dvůr se pomalu naplňuje smíchem. Takto si mě budou pamatovat..."
 pay_homage.0201.desc.insult_infatuation: "[homage_liege.GetFirstNameNoTooltip] se rozčileně podívá na svého [SCOPE.sC('homage_liege').Custom2('RelationToMeShort', SCOPE.sC('homage_infatuation'))] a vyprovodí mě z komnaty bez uznání."
 pay_homage.0201.desc.insult_delivery: "[homage_liege.GetFirstNameNoTooltip] se rozesměje až k slzám, chichoce se a podrobně popisuje části mé řeči..."
 pay_homage.0201.desc.brush_off: "Ke svému překvapení [homage_liege.GetFirstNameNoTooltip] jedná téměř, jako by se nic nestalo, a přijímá můj hold s grácií.\n\n"
 pay_homage.0201.desc.outro: "[homage_liege.GetFirstNameNoTooltip] mi rozkáže vstát a potvrzuje [Select_CString(homage_liege.IsFemale,'její','jeho')] spokojenost, stejně jako mé právo k zemím, jimiž spravuji v [Select_CString(homage_liege.IsFemale,'její','jeho')] zastoupení."
 pay_homage.0201.smooth.submission: "Sláva [homage_liege.GetTitleAsNameNoTooltip]."
 pay_homage.0201.smooth.gold: "Cena věrnosti..."
 pay_homage.0201.smooth.hook: "Doufejme, že to bude malá přízeň..."
 pay_homage.0201.smooth.contract: "Břemena služby..."
 pay_homage.0201.faux_pas: "Přeci jen spravedlivý pán."
 pay_homage.0201.insult: "Neměl jsem sem nikdy přijít."
 homage_delivery_stutter_liege: "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] sotva dokáže dokončit polovinu věty, než [Select_CString(ROOT.Char.IsFemale,'její','jeho')] koktání přeruší [ROOT.Char.GetHerHim]. Moji zarmoucení dvořané sledují [Select_CString(ROOT.Char.IsFemale,'její','jeho')] statečné pokusy přemoci svůj hlas."
 homage_delivery_lisp_liege: "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] projev je... zapamatovatelný. [Select_CString(ROOT.Char.IsFemale,'její','jeho')] sigmatismus ubírá projevu na vážnosti, když [ROOT.Char.GetSheHe] proplouvá množstvím sibilantních zvuků a snaží se ignorovat chichot mých méně vlídných dvořanů."
 homage_delivery_wheeze_liege: "[ROOT.Char.GetTitledFirstNameNoTooltip] je zajímavý případ. Zřetelně nervózní z toho představení a rozrušený spěchem svého příchodu, [ROOT.Char.GetSheHe] má zjevně problém i s dechem, chraplavě pronášejíc projev mezi přestávkami na vzduch."
 homage_delivery_slow_liege: "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] projev je... není dobrý. [ROOT.Char.GetSheHe] ztrácí [Select_CString(ROOT.Char.IsFemale,'její','jeho')] myšlenkový sled na několika místech, odbíhá do odboček a špatně chápe nebo špatně vyslovuje některá z nejdůležitějších slov."
 homage_delivery_inconceivable_liege: "[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] projev je... zajímavý. [ROOT.Char.GetSheHe|U] vkládá archaický jazyk a vážná slova, jejichž skutečný význam [ROOT.Char.GetSheHe] zjevně nezná, a přivádí tím mé vzdělanější dvořany k údivu."
 homage_delivery_stutter_vassal: "Právě jsem sotva začal první přísahu, když mě koktání přerušilo. Nakonec přece jen pokračuji, zatímco dvůr sleduje s veselím i rozpaky, ale den je poznamenán mou vadou."
 homage_delivery_lisp_vassal: "Můj projev je přerušován potlačovanými chichoty, když se snažím co nejlépe artikulovat přes svůj sigmatismus, což ubírá na vážnosti obřadu i mé přísaze."
 homage_delivery_wheeze_vassal: "Mám problém získat dech, srdce mi buší rychleji, a spěch při domlouvání projevu to jen zhoršuje. To není projev, na který by se vzpomínalo."
 homage_delivery_slow_vassal: "Dělám, co můžu, ale zvýšené obočí a pohledy mého pána a dvora mi dávají najevo, že moje snahy byly spíš zábavné než významné."
 homage_delivery_inconceivable_vassal: "Dám do toho všechno, naplním okamžik a ohromím dvůr svým bohatým slovníkem, ale... reakce není přesně taková, jakou jsem očekával."
 pay_homage.0601.t: "$pay_homage_header$ Zrušeno"
 pay_homage.0601.desc.court: "Korunovace na [ROOT.Char.GetTitleAsNameNoTooltip] je dokončena, mé přípravy k složení holdů už nejsou nutné..."
 pay_homage.0601.desc.imprisoned_me: "$pay_homage.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] mě uvěznil."
 pay_homage.0601.desc.imprisoned: "$pay_homage.0601_shared_intro$ Byl jsem zajat [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
 pay_homage.0601.desc.liege_dead_me: "$pay_homage.0601_shared_intro$ Nakonec jsem [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')] [homage_liege.GetTitledFirstName]... \n\n"
 pay_homage.0601.desc.liege_dead: "$pay_homage.0601_shared_intro$ [homage_liege.GetTitledFirstName] [homage_liege.GetDeathReasonHideKiller]... \n\n"
 pay_homage.0601.desc.liege_imprisoned_me: "$pay_homage.0601_shared_intro$ Nakonec jsem zajal [homage_liege.GetTitledFirstName]!"
 pay_homage.0601.desc.liege_imprisoned: "$pay_homage.0601_shared_intro$ [homage_liege.GetTitledFirstName] byl zajat [homage_liege.GetImprisonedBy.GetTitledFirstName]."
 pay_homage.0601.desc.new_liege: "Pokud mám složit přísahu, musí být směrována mému novému pánovi, [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 pay_homage.0601_shared_intro: "Právě když jsem dokončoval poslední úpravy své přísahy holdu,"
 pay_homage.0601.desc: "\n\nTo rozhodně mění situaci."
 pay_homage.0601.a_court: "Vpřed, za většími cíli."
 pay_homage.0601.a_prison: "Sakra."
 pay_homage.0601.a_liege: "Jak otravné..."
 pay_homage.0601.a: "Čas to přehodnotit..."
 pay_homage_costs_refunded: "$pay_homage_decision$ náklady vráceny"
