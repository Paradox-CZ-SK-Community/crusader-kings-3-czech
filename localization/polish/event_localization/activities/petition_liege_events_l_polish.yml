 petition_ceremonial_liege_costs_refunded: "$petition_ceremonial_liege_decision$ náklady vráceny" # todo: NEW TRANSLATION
 petition_liege.0001.a.tt_non_royal: "Přijmete [petition_vassal.GetTitledFirstName] v [royal_court|E] vašeho [liege|E]" # todo: NEW TRANSLATION
 petition_liege.0101.desc_non_royal: "[petition_vassal.GetTitledFirstName] je konečně přiveden do mé [liege_possessive|E] velké síně a neplýtvá časem, než vykročí k trůnu a hluboce se ukloní. \n\n"Thank you for seeing me, [petition_liege.GetTitledFirstNamePossessive]. I come to you today with an urgent request —" # todo: NEW TRANSLATION
 petition_liege.0101.desc.title_liege_non_royal: "s úctou, můj [petition_liege.GetTitleAsNameNoTooltip], [petition_claim.GetName] mi právem náleží!" \n\n"Dohlížíte na mocný [petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip], můj [petition_liege.GetLadyLord], nemůžete mi udělit pouhý jeden [petition_claim.GetTierAsNameNoTooltip], upřímně požadovaný?"" # todo: NEW TRANSLATION
 petition_liege.0201.a_non_royal: "Děkuji, můj [petition_liege.GetLadyLord]!" # todo: NEW TRANSLATION
 petition_liege.0221.a: "Moje věčná vděčnost, veliký [petition_liege.GetTitleAsNameNoTooltip]!" # todo: NEW TRANSLATION
 petition_liege_skillcheck_counter_tt_non_royal: "Pokus přesvědčit [petition_liege.GetHerHim] jinými prostředky" # todo: NEW TRANSLATION
 petition_liege.0021.opening: "Pozdravy, dobrý [petition_liege.GetTitleAsNameNoTooltip]," # todo: NEW TRANSLATION
 petition_liege.0021.desc.no_travel: "Byl bych nesmírně poctěn, kdyby byla má audience přijata a byl vyslechnut můj skromný a upřímný projev o záležitosti blízké mému srdci.\n\nTrpělivě čekám na volání paláce v nejbližším vhodném čase Vaší veličenstva." # todo: NEW TRANSLATION
 petition_liege.0029.opening: "Mé nejpokornější pozdravy, veliký [petition_liege.GetTitleAsNameNoTooltip]," # todo: NEW TRANSLATION
 petition_liege.0121.t.regent: "Podpora do úřadu" # todo: NEW TRANSLATION
 petition_liege.0121.t.appointment: "Povýšení rodu" # todo: NEW TRANSLATION
 petition_liege.0121.t.wedding: "Královský sňatek" # todo: NEW TRANSLATION
 petition_liege.0121.t.privilege: "Uznání důstojnosti" # todo: NEW TRANSLATION
 petition_liege.0121.desc: "[petition_vassal.GetTitledFirstName] je konečně přiveden do mé velké síně a neplýtvá časem, než se vydá k mému trůnu a hluboce se ukloní. \n\n"Thank you for seeing me, great [petition_liege.GetTitleAsNameNoTooltip]. I come to you today to discuss an important matter —" # todo: NEW TRANSLATION
 petition_liege.0121.desc.regent: "otázka, kdo bude [petition_vassal.GetTopLiege.GetTitledFirstNamePossessive] nástupcem jako správce vaší říše zůstává nevyřešena."\n\n"Doufám, že souhlasíte, že pokud bych se skromně přihlásil o tuto poctu, nejlépe bych sloužil trůnu."" # todo: NEW TRANSLATION
 petition_liege.0121.desc.appointment: "můj rod, stejně jako mnohé z nejvznešenějších rodin v [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], usiluje o pocty služby trůnu, sloužíc jako guvernéři a byrokraté."\n\n"Prokázali jsme se jako loajální a zruční služebníci říše a vítali bychom vaši podporu při výběru úředníků."" # todo: NEW TRANSLATION
 petition_liege.0121.desc.wedding: "jen nejvznešenější rody by si kdy mohly troufat dosáhnout zlomku milosti vaší královské linie."\n\n"S největší pokorou bych řadil svůj rod mezi ně a žádal vaši podporu pro královský sňatek."" # todo: NEW TRANSLATION
 petition_liege.0121.desc.privilege: "mnohé hádající se rody říše zapomněly na milost a důstojnost, kterou kdysi jejich nositelé znali. Málo rodů zbývá, přesto svůj mezi ně řadím, jež si zachovávají skutečnou kvalitu."\n"S veškerou pokorou doufám, že Vaše veličenstvo rozpozná naše zásluhy jako jedno z předních rodů říše." # todo: NEW TRANSLATION
 petition_liege.0121.accept.regent: "Dlouho jsem doufal, že na sebe vezmete tuto odpovědnost." # todo: NEW TRANSLATION
 petition_liege.0121.accept.appointment: "Málokteré rody slouží tak pilně nebo věrně." # todo: NEW TRANSLATION
 petition_liege.0121.accept.wedding: "Prokázali jste postavení vašeho rodu." # todo: NEW TRANSLATION
 petition_liege.0121.accept.privilege: "Pověst vašeho rodu je bez pochyby." # todo: NEW TRANSLATION
 petition_liege.0121.bribe_gold: "Trůn je štědrý k těm, kteří jsou štědří k trůnu." # todo: NEW TRANSLATION
 petition_liege.0121.bribe_bloc: "Trůn odměňuje ty, kteří prokážou svou podporu." # todo: NEW TRANSLATION
 petition_liege.0121.bribe_favor: "Přízeň trůnu by neměla být brzy zapomenuta." # todo: NEW TRANSLATION
 petition_liege.0121.bribe_vows: "Trůnová přízeň patří těm, kteří prokáží svou zbožnost." # todo: NEW TRANSLATION
 petition_liege.0121.bribe_knight: "Trůnová přízeň patří jeho nejvěrnějším služebníkům." # todo: NEW TRANSLATION
 petition_liege.0121.refusal: "Tato žádost je pod důstojností koruny." # todo: NEW TRANSLATION
 petition_liege.0221.desc.regent: "\n\nPokorně žádám [petition_liege.GetHerHis] podporu pro mou kandidaturu na nejvyšší úřad, uváděje své předchozí úspěchy a každý příklad mé neochvějné loajality." # todo: NEW TRANSLATION
 petition_liege.0221.desc.appointment: "\n\nNaléhavě prosím svého [petition_liege.GetLadyLord], aby uznal mé kvality jako služebníka a podpořil mé povýšení v [petition_liege.GetHerHis] a ve službě říši." # todo: NEW TRANSLATION
 petition_liege.0221.desc.wedding: "\n\nVyjadřuji poctu, kterou by můj rod obdržel spojením s císařským domem, objasňujíc důstojnost krve [ROOT.Char.GetHouse.GetNameNoTooltip] a vhodnost našich panen a svobodných." # todo: NEW TRANSLATION
 petition_liege.0221.desc.privilege: "Naléhavě žádám [petition_liege.GetTitleAsNameNoTooltip], aby formálně přistoupil k uznání urozeného původu mého rodu mezi aristokracií [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]." # todo: NEW TRANSLATION
 petition_liege.0225.b: "Obávám se, že to není možné." # todo: NEW TRANSLATION
 petition_liege.0229.counter: "Vaše veličenstvo, prosím, jen chvilku!" # todo: NEW TRANSLATION
 petition_liege.0221.desc.bridge: "\n\nPo vyslechnutí projevu [petition_liege.GetSheHe] chvíli čeká, než se teple usměje a řekne, "Předkládáte moudré argumenty! Dobře, postarám se o to ihned."" # todo: NEW TRANSLATION
