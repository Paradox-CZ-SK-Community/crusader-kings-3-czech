 petition_liege.9001.development: "Přesídlit některé jejich poddané do mého panství."
 petition_liege.9001.house_fief: "Ustanovování nových způsobů vlády už není zločinem." # todo: NEW TRANSLATION
 petition_liege.9001.fallback: "Prostě naplňte mou pokladnici."
