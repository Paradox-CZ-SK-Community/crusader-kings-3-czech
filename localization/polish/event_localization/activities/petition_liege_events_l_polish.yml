 petition_liege.0001.a.tt_non_royal: "Přijmeš [petition_vassal.GetTitledFirstName] v [Concept('royal_court','Královském dvoře')|E] svého [Concept('liege','lenního pána')|E]"
 petition_liege.0101.desc_non_royal: "[petition_vassal.GetTitledFirstName] je konečně uveden[Select_CString(petition_vassal.IsFemale,'a do velkého sálu mého lenního pána',' do velkého sálu mého lenního pána')] a bez otálení přistoupí k trůnu a hluboce se ukloní.\n\n„Děkuji, že jsi mě přijal[Select_CString(petition_liege.IsFemale,'a','')], [petition_liege.GetTitledFirstNamePossessive]. Přicházím dnes s naléhavou žádostí —"
 petition_liege.0101.desc.title_liege_non_royal: "při vší úctě, [petition_liege.GetTitleAsNameNoTooltip], [petition_claim.GetName] mi právem náleží!“\n\n„Dohlížíš na mocný [petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip], [petition_liege.GetLadyLord]. Nemůžeš mi snad udělit jediný [petition_claim.GetTierAsNameNoTooltip], na který mám oprávněný nárok?“"
 petition_liege.0201.a_non_royal: "Děkuji, [petition_liege.GetLadyLord]!"
