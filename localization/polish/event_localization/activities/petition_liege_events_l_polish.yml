 petition_liege.0021.desc.no_travel: "Bylo by mi velkou ctí, kdybys mi poskytl audienci a vyslechl mou pokornou a upřímnou prosbu v záležitosti, která mi leží na srdci.\n\nTrpělivě vyčkávám, až mě palác na pokyn tvého Veličenstva povolá."
 petition_liege.0029.opening: "Mé nejpokornější pozdravy, vznešený [petition_liege.GetTitleAsNameNoTooltip],"
 petition_liege.0121.t.regent: "Podpora úřadu"
 petition_liege.0121.t.appointment: "Vzestup rodu"
 petition_liege.0121.t.wedding: "Panovnický sňatek"
 petition_liege.0121.t.privilege: "Uznání důstojnosti"
 petition_liege.0121.desc: "[petition_vassal.GetTitledFirstName] je konečně uveden[Select_CString(petition_vassal.IsFemale,'a do mého velkého sálu',' do mého velkého sálu')] a bez otálení přistoupí k mému trůnu a hluboce se ukloní.\n\n„Děkuji, že jsi mě přijal[Select_CString(petition_liege.IsFemale,'a','')], vznešený [petition_liege.GetTitleAsNameNoTooltip]. Přicházím dnes projednat důležitou záležitost —"
 petition_liege.0121.desc.regent: "otázka, kdo se stane nástupcem [petition_vassal.GetTopLiege.GetTitledFirstName] ve správě tvého Panství, dosud nebyla rozhodnuta.“\n\n„Doufám, že budeš souhlasit, že kdybych se o tuto čest pokorně ucházel[Select_CString(petition_vassal.IsFemale,'a, trůnu bych sloužila nejlépe.','a, trůnu bych sloužil nejlépe.')]“"
 petition_liege.0121.desc.appointment: "můj rod, stejně jako mnohé z nejvznešenějších rodin v [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], usiluje o čest sloužit trůnu jako správci a úředníci.“\n\n„Prokázali jsme, že jsme věrnými a schopnými služebníky Panství, a tvá podpora při výběru úředníků by nás velmi povzbudila.“"
 petition_liege.0121.desc.wedding: "jen ty nejvznešenější rody mohou doufat, že se alespoň přiblíží půvabu tvé panovnické dynastie.“\n\n„S nejhlubší pokorou bych mezi ně zařadil[Select_CString(petition_vassal.IsFemale,'a i svůj rod a požádala',' i svůj rod a požádal')] tě o podporu panovnického sňatku.“"
 petition_liege.0121.desc.privilege: "mnohé hašteřivé rody Panství zapomínají na půvab a důstojnost, které kdysi jejich postavení provázely. Jen málo rodů si stále uchovává skutečnou vznešenost a troufám si mezi ně počítat i ten svůj.“\n„Se vší pokorou doufám, že tvé Veličenstvo uzná naše zásluhy a postavení jednoho z předních rodů Panství.“"
 petition_liege.0121.accept.regent: "Dlouho jsem doufal[Select_CString(ROOT.Char.IsFemale,'a, že jednou dorosteš této odpovědnosti.',' že jednou dorosteš této odpovědnosti.')]"
 petition_liege.0121.accept.appointment: "Jen málokterý rod slouží tak svědomitě a věrně."
 petition_liege.0121.accept.wedding: "Prokázal[Select_CString(petition_vassal.IsFemale,'a jsi vznešenost svého rodu.',' jsi vznešenost svého rodu.')]"
 petition_liege.0121.accept.privilege: "Pověst tvého rodu je nepochybná."
 petition_liege.0121.bribe_gold: "Trůn je štědrý k těm, kteří jsou štědří k trůnu."
 petition_liege.0121.bribe_bloc: "Trůn odměňuje ty, kteří prokážou svou podporu."
 petition_liege.0121.bribe_favor: "Na přízeň trůnu se nemá jen tak zapomínat."
 petition_liege.0121.bribe_vows: "Přízeň trůnu náleží těm, kteří prokážou svou zbožnost."
 petition_liege.0121.bribe_knight: "Přízeň trůnu náleží jeho nejvěrnějším služebníkům."
 petition_liege.0121.refusal: "Tato žádost je pod důstojnost koruny."
 petition_liege.0221.desc.regent: "\n\nPokorně žádám o podporu [petition_liege.GetTitledFirstName] při své kandidatuře na nejvyšší úřad a vyjmenuji své dosavadní úspěchy i všechny příklady neochvějné věrnosti."
 petition_liege.0221.desc.appointment: "\n\nNaléhavě žádám [petition_liege.GetLadyLord], aby uznal[Select_CString(petition_liege.IsFemale,'a mé schopnosti a podpořila',' mé schopnosti a podpořil')] můj vzestup ve službách trůnu a Panství."
 petition_liege.0221.desc.wedding: "\n\nVysvětlím, jakou poctou by pro můj rod bylo spojení s císařským rodem skrze sňatek, zdůrazním vznešenost krve rodu [ROOT.Char.GetHouse.GetNameNoTooltip] i vhodnost našich svobodných žen a mužů."
 petition_liege.0221.desc.privilege: "Naléhám na [petition_liege.GetTitleAsNameNoTooltip], aby formálně uznal[Select_CString(petition_liege.IsFemale,'a vznešený původ mého rodu',' vznešený původ mého rodu')] mezi aristokracií [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 petition_liege.0225.b: "Obávám se, že to není možné."
 petition_liege.0229.counter: "Veličenstvo, prosím, jen okamžik!"
 petition_liege.0221.desc.bridge: "\n\nPo vyslechnutí mé řeči [petition_liege.GetTitledFirstName] chvíli mlčí, pak se vřele usměje a pronese: „Tvé argumenty jsou moudré! Dobrá, postarám se, aby byla tato záležitost okamžitě vyřízena.“"
 petition_liege.9021.regent: "Podporu mé kandidatury na nejvyšší úřad."
 petition_liege.9021.appointment: "Podporu kariéry členů mého rodu."
 petition_liege.9021.wedding: "Souhlas s panovnickým sňatkem."
 petition_liege.9021.privilege: "Uznání důstojnosti mého rodu."
 petition_ceremonial_liege_skillcheck_counter_tt: "Pokusíš se [petition_liege.GetTitleAsNameNoTooltip] přesvědčit jiným způsobem"
