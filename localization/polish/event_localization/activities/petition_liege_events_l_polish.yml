 petition_liege.9001.pay_debt: "Uhraďte mé dluhy."
 petition_liege.9001.war_aid: "Poskytněte vojenskou pomoc."
 petition_liege.9001.vassal_war: "Prosadit mír mezi mými vazaly."
 petition_liege.9001.faction_war: "Rozbít mocnou frakci."
 petition_liege.9001.county_control: "Poslat šerify, aby pomohli obnovit pořádek ve vzdorovitých hrabstvích."
 petition_liege.9001.county_convert: "Sponzorovat kněze, aby pomohli obrátit hrabství v mém panství."
