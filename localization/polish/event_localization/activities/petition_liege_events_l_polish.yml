l_polish:
 petition_liege_header: "Žádost:"
 petition_liege.0001.opening: "[petition_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 petition_liege.0001.desc: "Po únavné cestě jsme s mým doprovodem právě dorazili do [petition_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], abychom se s tebou setkali.\n\nŽádám o audienci, jakmile ti to bude možné."
 petition_liege.0001.a: "Přiveďte [petition_vassal.GetTitledFirstNameNoTooltip] ke mně!"
 petition_liege.0001.a.tt: "Přijmeš [petition_vassal.GetTitledFirstName] ve svém [Concept('royal_court','Královském dvoře')|E]"
 petition_liege.0001.b: "Teď nemám čas se [petition_vassal.GetFirstNameNoTooltip] zabývat."
 petition_liege.0001.b.arrogant: "Pche, nemám čas bavit se s pouhým [petition_vassal.GetTitleAsNameNoTooltip]!"
 petition_liege.0001.b.humble: "Vyřiďte [petition_vassal.GetTitledFirstNameNoTooltip] mou nejhlubší lítost, že audienci nemohu poskytnout."
 petition_liege.0001.b.tt: "Pošleš [petition_vassal.GetTitledFirstName] pryč"
 petition_liege.0009.opening: "[petition_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
 petition_liege.0009.desc: "Bohužel přicházíš v nevhodnou dobu a musím ti oznámit, že tebe ani tvůj doprovod nemohu ve svých síních přijmout."
 petition_liege.0009.a: "Ani mě #EMP nevyslechne#!? Jaká drzost!"
 petition_liege.0101.t.gold: "$petition_liege_header$ Zlato"
 petition_liege.0101.t.council_seat: "$petition_liege_header$ Jmenování do rady"
 petition_liege.0101.t.pay_debt: "$petition_liege_header$ Splacení dluhů"
 petition_liege.0101.t.war_aid: "$petition_liege_header$ Vojenská pomoc"
 petition_liege.0101.t.end_war: "$petition_liege_header$ Ukončení válek vazalů"
 petition_liege.0101.t.faction_war: "$petition_liege_header$ Rozpuštění frakce"
 petition_liege.0101.t.county_control: "$petition_liege_header$ Žádost o správce"
 petition_liege.0101.t.county_convert: "$petition_liege_header$ Podpora kněží"
 petition_liege.0101.t.county_opinion: "$petition_liege_header$ Panovnická návštěva"
 petition_liege.0101.t.fortify_border: "$petition_liege_header$ Opevnění hranice"
 petition_liege.0101.t.title_liege: "$petition_liege_header$ Nárok na titul"
 petition_liege.0101.t.title_vassal: "$petition_liege_header$ Nárok vůči vazalovi"
 petition_liege.0101.t.construct_city: "$petition_liege_header$ Rozvoj města"
 petition_liege.0101.t.construct_temple: "$petition_liege_header$ Financování [petition_vassal.GetFaith.HouseOfWorship|U]"
 petition_liege.0101.t.development: "$petition_liege_header$ Rozvoj hlavního města"
 petition_liege.0101.t.house_fief: "$petition_liege_header$ Léno $japan_feudal_government$"
 petition_liege.0101.desc: "[petition_vassal.GetTitledFirstName] je konečně uveden[Select_CString(petition_vassal.IsFemale,'a','')] do mého velkého sálu a bez otálení přistoupí k trůnu a hluboce se ukloní.\n\n„Děkuji, že jsi mě přijal[Select_CString(petition_liege.IsFemale,'a','')], můj lenní pane. Přicházím dnes s naléhavou žádostí —"
 petition_liege.0101.desc.council_seat: "prosím, [petition_liege.GetLadyLord], dovol mi zasednout ve své radě.“\n\n„Mé schopnosti zůstávají přehlíženy, zatímco méně schopní dvořané dostávají slovo na nejvyšších místech. Jako [petition_vassal.Custom('GetCouncilPositionRequest')] bych s tebou rád[Select_CString(petition_vassal.IsFemale,'a','')] sdílel[Select_CString(petition_vassal.IsFemale,'a','')] břemena Panství.“"
 petition_liege.0101.desc.gold: "napadlo mě, zda bys pro věrného poddaného nemohl[Select_CString(petition_liege.IsFemale,'a','')] postrádat trochu zlata jako odměnu za mé dosavadní služby a věrnost.“\n\n„Ujišťuji tě, že bude použito ve prospěch Panství.“"
 petition_liege.0101.desc.pay_debt: "kvůli okolnostem zcela mimo mou kontrolu jsem se ocitl[Select_CString(petition_vassal.IsFemale,'a ve finančních nesnázích',' ve finančních nesnázích')].“\n\n„Pomůžeš mi v zájmu Panství vyrovnat mé účty?“"
 petition_liege.0101.desc.war_aid: "válka [petition_war.GetName] se nevyvíjí dobře a [second_party.GetTitledFirstNameNoTooltip] má navrch.\n\n[petition_liege.GetLadyLord], mé porážky jsou i tvými porážkami. V zájmu Panství mi poskytni svou podporu.“"
 petition_liege.0101.desc.end_war: "[second_party.GetTitledFirstNameNoTooltip] vede válku proti mně a tvým věrným poddaným v [petition_vassal.GetPrimaryTitle.GetName]!“\n\n„Takové boje mezi námi jistě jen oslabují nás všechny. Neměly by být okamžitě zastaveny?“"
 petition_liege.0101.desc.faction_war: "[second_party.GetTitledFirstName] se svou frakcí [vassal_faction.GetNameNoTooltip|l] na mě dotírá ze všech stran!\n\n„Prosím, musíš ty drzé spratky usadit, pro dobro Panství!“"
 petition_liege.0101.desc.county_control: "[petition_county_example.GetNameNoTooltip] sužují buřiči, kvůli nimž není možné vybírat daně!“\n\n„Prosím, [petition_liege.GetLadyLord], pomoz mi ty zmije zkrotit, pro dobro Panství.“"
 petition_liege.0101.desc.county_convert: "[petition_county_example.GetNameNoTooltip] sužují zarputilí a bezbožní [petition_county_example.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip]!“\n\n„Moji kněží dělají, co mohou, ale obávám se, že bez pomoci se Panství tohoto zla nezbaví.“"
 petition_liege.0101.desc.county_opinion: "mé země zachvátila nespokojenost.“\n\n„[petition_liege.GetLadyLord], jsem si jist[Select_CString(petition_vassal.IsFemale,'á','ý')], že návštěva [petition_liege.Custom('GetRoyalCourtRank')] by náladu lidu změnila a přivedla jej zpět na správnou cestu.“"
 petition_liege.0101.desc.fortify_border: "mé země stojí mezi [petition_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] a tvými nepřáteli!“\n\n„[petition_county_example.GetNameNoTooltip] patří k pohraničním oblastem Panství a za jeho obranu odpovídáš stejně jako já.“"
 petition_liege.0101.desc.title_liege: "při vší úctě, Veličenstvo, [petition_claim.GetName] mi právem náleží!“\n\n„Vládneš mocnému [petition_liege.GetPrimaryTitle.GetTierAsNameNoTooltip], [petition_liege.GetLadyLord]. Nemůžeš mi snad udělit jediný [petition_claim.GetTierAsNameNoTooltip], na který mám oprávněný nárok?“"
 petition_liege.0101.desc.title_vassal: "[petition_claim.GetName], který drží [second_party.GetTitledFirstName], mi právem náleží!“\n\n„[petition_liege.GetLadyLord], jistě chápeš, jak důležité jsou nároky na země, které držíme. Přikaž [second_party.GetTitleAsNameNoTooltip], aby se vzdal[Select_CString(second_party.IsFemale,'a','')] toho, co mu nepatří.“"
 petition_liege.0101.desc.construct_city: "[petition_construct_county.GetName] má velký potenciál, ale postrádá potřebnou infrastrukturu.“\n\n„[petition_liege.GetLadyLord], podpora nového města v [petition_construct.GetName] by prospěla celému Panství už jen díky rozvoji obchodu.“"
 petition_liege.0101.desc.construct_temple: "věřící v [petition_construct_county.GetName] potřebují místo k uctívání.“\n\n„Bylo by mi ctí, kdybys pomohl[Select_CString(petition_liege.IsFemale,'a','')] financovat nový [petition_liege.GetFaith.HouseOfWorship] v [petition_construct.GetName] pro [petition_liege.GetFaith.GetAdjectiveNoTooltip] věřící.“"
 petition_liege.0101.desc.development: "mé země blednou ve srovnání s tvým mocným hlavním městem.“\n\n„Prosím, věnuj část bohatství [petition_liege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierPossessive] skromnému [petition_county_example.GetName] a prospěj tak celému Panství.“"
 petition_liege.0101.desc.house_fief: "uděl mi dědičná práva a možnost vládnout vlastnímu lénu, aby celé Panství mohlo vzkvétat.“"
 petition_liege.0101.desc.council_first_councillor: "\n\nTakže [petition_vassal.GetFirstNameNoTooltip] si myslí, že by práci zvládl[Select_CString(petition_vassal.IsFemale,'a lépe než',' lépe než')] [second_party.GetTitledFirstName]..."
 petition_liege.0101.desc.council_second_councillor: "Možná bych měl[Select_CString(ROOT.Char.IsFemale,'a místo toho nahradit',' místo toho nahradit')] [second_councillor.GetTitledFirstName]."
 petition_liege.0101.accept.gold: "Nějaké mince mohu postrádat."
 petition_liege.0101.accept.council_seat: "Dobrá, dostaneš své místo."
 petition_liege.0101.accept.council_seat_occupied: "Nahradíš [second_party.GetTitledFirstNameNoTooltip] na postu [second_party.GetCouncilTitle]."
 petition_liege.0101.accept.pay_debt: "Dobrá, tvé dluhy budou splaceny."
 petition_liege.0101.accept.war_aid: "Nějaké vojáky mohu postrádat."
 petition_liege.0101.accept: "Chápu tvé důvody. Dobrá, donutím je války ukončit."
 petition_liege.0101.accept.faction_war: "Tito zrádci se budou zodpovídat mně."
 petition_liege.0101.accept.county_control: "Pořádek bude obnoven."
 petition_liege.0101.accept.county_convert: "Tyto děti zla musí být vyhnány. [ROOT.Char.GetFaith.DevilName] už zde nebude mít své místo."
 petition_liege.0101.accept.county_opinion: "Lid spatří svého [petition_liege.GetTitleAsNameNoTooltip]."
 petition_liege.0101.accept.fortify_border: "Tvé hranice jsou i mými hranicemi."
 petition_liege.0101.accept.title_liege: "Dobrá, [petition_claim.GetTierAsNameNoTooltip|l] je tvůj."
 petition_liege.0101.accept.title_vassal: "Tvůj nárok podpořím."
 petition_liege.0101.accept.construct_city: "Proč ne? [petition_construct_county.GetDeJureLiege.GetNameNoTierNoTooltip] by nové město prospělo."
 petition_liege.0101.accept.construct_temple: "[petition_construct_county.GetNameNoTierNoTooltip] chybí [petition_liege.GetFaith.BishopNeuter] už příliš dlouho."
 petition_liege.0101.accept.development: "Ano, [petition_liege.GetCapitalLocation.GetNameNoTooltip] je až příliš rušné."
 petition_liege.0101.accept.house_fief: "Tvůj způsob vlády už nebude považován za zločin."
 petition_liege.0101.bribe_gold.council_seat: "Členové mého nejužšího kruhu musí prokázat, že umějí hospodařit..."
 petition_liege.0101.bribe_gold.war_aid: "Výcvik, výzbroj... nic z toho není levné."
 petition_liege.0101.bribe_gold: "Mohu zařídit mír, ale bude třeba zaplatit jisté #EMP reparace#!..."
 petition_liege.0101.bribe_gold.faction_war: "I mír má svou cenu."
 petition_liege.0101.bribe_gold.county_control: "Taková práce je těžká a drahá."
 petition_liege.0101.bribe_gold.county_convert: "Ani taková práce není zadarmo. [ROOT.Char.GetFaith.WealthGodName] nám to připomíná."
 petition_liege.0101.bribe_gold.county_opinion: "Takové návštěvy přinášejí mnoho výdajů."
 petition_liege.0101.bribe_gold.fortify_border: "Ale no tak, dobře víš, že taková opatření nejsou levná."
 petition_liege.0101.bribe_gold.title_liege: "Jakou cenu má pro tebe tvůj nárok?"
 petition_liege.0101.bribe_gold.title_vassal: "Kolik ti za to stojí, [petition_vassal.GetFirstNameNoTooltip]?"
 petition_liege.0101.bribe_gold.construct_city: "Jistě víš, jak drahé takové věci jsou..."
 petition_liege.0101.bribe_gold.construct_temple: "Jistě přispěješ na přístavbu?"
 petition_liege.0101.bribe_gold.development: "Samozřejmě, ale bude nutná drobná náhrada."
 petition_liege.0101.bribe_gold.house_fief: "Pouze pokud jsi ochoten zaplatit příslušnou cenu."
 petition_liege.0101.bribe_favor.council_seat: "Taková prokázaná přízeň musí být oplacena."
 petition_liege.0101.bribe_favor.pay_debt: "Jednoho dne tě požádám, abys mi to oplatil."
 petition_liege.0101.bribe_favor.war_aid: "Až budu potřebovat pomoc já, očekávám ji od tebe."
 petition_liege.0101.bribe_favor: "[second_party.GetFirstNameNoTooltip] z toho nebude mít radost. Budeš mi něco dlužit..."
 petition_liege.0101.bribe_favor.faction_war: "Na mé laskavosti se nezapomíná."
 petition_liege.0101.bribe_favor.county_control: "Pomohu ti, ale ty pak pomůžeš mně."
 petition_liege.0101.bribe_favor.county_convert: "Pokud si zapamatuješ tento den a pomoc, kterou jsem ti poskytl."
 petition_liege.0101.bribe_favor.county_opinion: "Laskavost za laskavost."
 petition_liege.0101.bribe_favor.fortify_border: "Pokud to udělám, musíš vyslyšet mé volání."
 petition_liege.0101.bribe_favor.title_liege: "Na dluh vůči mně bych jen tak nezapomněl."
 petition_liege.0101.bribe_favor.title_vassal: "Tato laskavost musí být splacena v plné míře."
 petition_liege.0101.bribe_favor.construct_city: "Dobrá, ale na oplátku mi budeš něco dlužit."
 petition_liege.0101.bribe_favor.construct_temple: "Tvému závazku bude svědkem [petition_liege.GetFaith.HighGodName]."
 petition_liege.0101.bribe_favor.development: "[petition_vassal.GetCapitalLocation.GetNameNoTooltip] poroste, ale #EMP ty#! mi zůstaneš dlužen."
 petition_liege.0101.bribe_favor.house_fief: "Výměnou za laskavost."
 petition_liege.0101.repay_favor: "Můj dluh vůči tobě zde končí."
 petition_liege.0101.bribe_factions.council_seat: "Členové mé rady musí být bezúhonní."
 petition_liege.0101.bribe_factions.pay_debt: "Jsi mým dlužníkem, tak se podle toho chovej."
 petition_liege.0101.bribe_factions.war_aid: "Přísahej mi věrnost a dostaneš mé muže."
 petition_liege.0101.bribe_factions: "Nebudu tolerovat #EMP žádné#! vnitřní rozbroje. #EMP Tečka#!."
 petition_liege.0101.bribe_factions.faction_war: "Dobře se dívej, protože totéž budu očekávat od tebe."
 petition_liege.0101.bribe_factions.county_control: "Na oplátku předpokládám, že se na tebe budu moci spolehnout?"
 petition_liege.0101.bribe_factions.county_convert: "Prokaž svou věrnost a vyšlu [ROOT.Char.GetFaith.AltPriestTermPlural]."
 petition_liege.0101.bribe_factions.county_opinion: "Mohu se ukázat, ale ty se musíš stáhnout z politiky."
 petition_liege.0101.bribe_factions.fortify_border: "Tvá věrnost výměnou za tvůj klid."
 petition_liege.0101.bribe_factions.title_liege: "Mohl[Select_CString(ROOT.Char.IsFemale,'a bych se toho vzdát, ale očekávám tvou věrnost.',' bych se toho vzdát, ale očekávám tvou věrnost.')]"
 petition_liege.0101.bribe_factions.title_vassal: "Za tento titul chci tvou neochvějnou věrnost."
 petition_liege.0101.bribe_factions.construct_city: "Toto město bude důkazem tvé věrnosti."
 petition_liege.0101.bribe_factions.construct_temple: "Vzdej se frakčních pletich a dostaneš svůj [petition_liege.GetFaith.HouseOfWorship]."
 petition_liege.0101.bribe_factions.development: "Tvá věrnost je za tuto laskavost spravedlivá cena."
 petition_liege.0101.bribe_factions.house_fief: "Buď věrný[Select_CString(petition_vassal.IsFemale,'á','')] a tvůj nový způsob vlády bude přijat."
 petition_liege.0101.bribe_contract.council_seat: "Štědrý příspěvek ti zajistí místo v radě."
 petition_liege.0101.bribe_contract.pay_debt: "Jako splátku zvýším tvé povinnosti."
 petition_liege.0101.bribe_contract.war_aid: "Dary musí proudit oběma směry."
 petition_liege.0101.bribe_contract.vassal_war: "Co jsi ochoten[Select_CString(petition_vassal.IsFemale,'a nabídnout za mír?',' nabídnout za mír?')]"
 petition_liege.0101.bribe_contract.faction_war: "Prokaž svou vděčnost a já ti pomohu."
 petition_liege.0101.bribe_contract.county_control: "Pořádek má svou cenu a tu bude třeba splatit."
 petition_liege.0101.bribe_contract.county_convert: "Tuto pomoc vyváží větší povinnosti."
 petition_liege.0101.bribe_contract.county_opinion: "Předpokládám, že se o plody spokojenosti podělíme?"
 petition_liege.0101.bribe_contract.fortify_border: "Tvé povinnosti se zvýší, aby pokryly mé výdaje."
 petition_liege.0101.bribe_contract.title_liege: "S těmito zeměmi přicházejí i vyšší povinnosti."
 petition_liege.0101.bribe_contract.title_vassal: "Pokud budeš odvádět více než [second_party.GetFirstNameNoTooltip]."
 petition_liege.0101.bribe_contract.construct_city: "Vyšší povinnosti vyváží tyto náklady."
 petition_liege.0101.bribe_contract.construct_temple: "Podělím se o tvá břemena, pokud se ty podělíš o ta má."
 petition_liege.0101.bribe_contract.development: "Očekávám podíl z tvých zisků."
 petition_liege.0101.bribe_contract.house_fief: "Taková žádost vyžaduje jisté oběti."
 petition_liege.0101.refusal.council_seat: "Musím brát v úvahu i jiné okolnosti."
 petition_liege.0101.refusal.pay_debt: "Účty mých vazalů jsou pouze jejich starostí."
 petition_liege.0101.refusal.war_aid: "Vítězství si musíš zajistit vlastními silami."
 petition_liege.0101.refusal: "Pokud jsi příliš slabý[Select_CString(petition_vassal.IsFemale,'á na vládu, možná bys vůbec vládnout neměla.',' na vládu, možná bys vůbec vládnout neměl.')]"
 petition_liege.0101.refusal.faction_war: "Nebudu za tebe svádět tvé bitvy."
 petition_liege.0101.refusal.county_control: "S tvými zeměmi přicházejí i povinnosti, [petition_vassal.GetTitleAsNameNoTooltip]."
 petition_liege.0101.refusal.county_convert: "Tyto duše jsou tvými poddanými, a tedy #EMP tvým#! problémem."
 petition_liege.0101.refusal.county_opinion: "Bohužel mám na takové malichernosti příliš mnoho práce."
 petition_liege.0101.refusal.fortify_border: "Mám vlastní hrady, o které se musím starat."
 petition_liege.0101.refusal.title_liege: "Na [petition_claim.GetNameNoTierNoTooltip] mám nárok i já."
 petition_liege.0101.refusal.title_vassal: "Tvůj nárok je jen tak silný jako paže, která drží tvůj meč."
 petition_liege.0101.refusal.construct_city: "Za své země odpovídáš ty."
 petition_liege.0101.refusal.construct_temple: "Zbožní si své svatostánky obvykle financují sami."
 petition_liege.0101.refusal.development: "Bohužel některým zemím bylo požehnáno více než jiným."
 petition_liege.0101.refusal.house_fief: "Žádáš příliš mnoho. Tohle #EMP musí#! zůstat zločinem."
 petition_liege.0101.council_second_occupied: "[second_councillor.GetTitledFirstNameNoTooltip] uvolní místo [second_councillor.GetCouncilTitle]."
 petition_liege.0101.council_second: "Něco mám v úmyslu."
 petition_liege.0101.war_aid_join: "Společně [second_party.GetFirstNameNoTooltip] porazíme."
 petition_liege.0101.additional_effects: "Přijetí se změní následujícími způsoby:"
 petition_liege.0101.bribe_given: "Pokud [petition_vassal.GetFirstNameNoTooltip] přijme tvou protinabídku"
 petition_liege.0101.bribe_refused: "Pokud [petition_vassal.GetFirstNameNoTooltip] odmítne tvou protinabídku"
 petition_liege.0201.t: "$petition_liege_header$ Přijato"
 petition_liege.0201.desc.intro: "Doprovodí mě do trůnního sálu [petition_liege.GetTitledFirstName], kde dostanu pokyn přistoupit blíž a přednést svou žádost."
 petition_liege.0201.desc.council_seat: "\n\nVylíčím své prokázané i dosud nevyužité schopnosti, díky nimž jsem vhodným kandidátem na post [petition_vassal.Custom('GetCouncilPositionRequest')], a požádám o místo mezi rádci [petition_liege.GetTitledFirstName]."
 petition_liege.0201.desc.war_aid: "\n\nNaléhavě žádám [petition_liege.GetLadyLord], aby mou oprávněnou věc podpořil[Select_CString(petition_liege.IsFemale,'a všemi dostupnými silami',' všemi dostupnými silami')], než bude věrný vazal Panství poražen."
 petition_liege.0201.desc.pay_debt: "\n\nProsím [petition_liege.GetTitleAsNameNoTooltip], aby vzal[Select_CString(petition_liege.IsFemale,'a v úvahu',' v úvahu')] těžké zkoušky, kterými mé léno prošlo a které vyprázdnily mou pokladnu, a pomohl[Select_CString(petition_liege.IsFemale,'a mi',' mi')] splatit mé dluhy..."
 petition_liege.0201.desc.vassal_war: "\n\nPodrobně popíšu příčiny i průběh svého pokračujícího konfliktu s [second_party.GetTitledFirstName] a požádám [petition_liege.GetTitleAsNameNoTooltip], aby v Panství vynutil[Select_CString(petition_liege.IsFemale,'a mír a ukončila',' mír a ukončil')] další krveprolití."
 petition_liege.0201.desc.faction_war: "\n\nShrnu události, které vedly k otevřené zradě [second_party.GetTitledFirstName] a frakce [vassal_faction.GetName|l], a požádám [petition_liege.GetTitleAsNameNoTooltip], aby je donutil[Select_CString(petition_liege.IsFemale,'a ke kapitulaci',' ke kapitulaci')]."
 petition_liege.0201.desc.county_control: "\n\nPečlivě popíšu problémy svého léna, kde se lidé vzpírají mé autoritě a krajem se potulují lapkové, a požádám o pomoc s obnovením pořádku."
 petition_liege.0201.desc.county_convert: "\n\nHorlivě vylíčím situaci ve svém lénu a potřebu podpory, aby zástupy hříšníků mohly poznat světlo [petition_liege.GetFaith.GetNameNoTooltip]."
 petition_liege.0201.desc.county_opinion: "\n\nVysvětlím nespokojenost ve svých zemích a jak výrazně by pouhá návštěva [petition_liege.GetTitleAsNameNoTooltip] povzbudila prostý lid."
 petition_liege.0201.desc.fortify_border: "\n\nVěcně popíšu hrozbu, kterou představují sousedé Panství, a zvlášť upozorním na [second_party.GetPrimaryTitle.GetName] a nebezpečí hrozící mým zemím."
 petition_liege.0201.desc.title_liege: "\n\nS úctou uplatním svůj oprávněný nárok na [petition_claim.GetName], předložím obsáhlé listiny, které jej dokládají, a čekám na odpověď [petition_liege.GetTitleAsNameNoTooltip]."
 petition_liege.0201.desc.title_vassal: "\n\nObratně předložím důkazy svého nároku na [petition_claim.GetName] a zdůrazním, proč je silnější než nárok [second_party.GetTitledFirstName]."
 petition_liege.0201.desc.construct_city: "\n\nPředložím své argumenty pro rozvoj osady [petition_construct.GetName] v [petition_construct_county.GetName] a přesně podle přípravy vyjmenuji všechny výhody."
 petition_liege.0201.desc.construct_temple: "\n\nPokorně přednesu důvody pro výstavbu nového [petition_liege.GetFaith.HouseOfWorship] v [petition_construct_county.GetName], který by měl vzniknout v osadě [petition_construct.GetName]."
 petition_liege.0201.desc.development: "\n\nPečlivě vysvětlím rozdílnou situaci [petition_county_example.GetName] a [petition_liege.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] a navrhnu, co by mohlo tuto nerovnováhu napravit."
 petition_liege.0201.desc.house_fief: "\n\nVysvětlím, proč by udělení dědičných práv v mém případě prospělo celému kraji."
 petition_liege.0201.desc.bridge: "\n\nPo vyslechnutí mé řeči [petition_liege.GetTitledFirstName] stručně přikývne a prohlásí: „Okamžitě vyšlu své lidi, aby se o tuto záležitost postarali.“"
 petition_liege.0201.desc.council_second_party: "Hůř než [second_party.GetFullName] si snad vést nemohu..."
 petition_liege.0201.a: "Děkuji, Vaše výsosti!"
 petition_liege_accept_tt: "Tvá žádost je přijata"
 petition_liege.0205.t: "$petition_liege_header$ Protinabídka"
 petition_liege.0205.desc.intro: "$petition_liege.0201.desc.intro$"
 petition_liege.0205.desc.bridge: "\n\n[petition_liege.GetTitledFirstName] několik okamžiků mlčky zvažuje mou žádost.\n\nNakonec se ke mně obrátí. „Mluvíš dobře, ale pokud mám tvé žádosti vyhovět, budu za to něco chtít. Jistě vidíš, že dohoda by prospěla nám oběma?“"
 petition_liege.0205.counter: "[petition_liege.GetTitleAsNameNoTooltip], možná jsem to špatně vysvětlil[Select_CString(ROOT.Char.IsFemale,'a','')]..."
 petition_liege.0205.a: "To je férová nabídka. Přijímám."
 petition_liege.0205.b: "To snad nemyslíš vážně? Už teď jsem na hranici svých možností!"
 petition_liege_skillcheck_counter_tt: "Pokusíš se svého lenního pána přesvědčit jiným způsobem"
 petition_liege.0209.t: "$petition_liege_header$ Odmítnuto"
 petition_liege.0209.desc.intro: "$petition_liege.0201.desc.intro$"
 petition_liege.0209.desc.bridge: "\n\nPo vyslechnutí mé řeči se [petition_liege.GetTitledFirstName] zamračí a mou žádost odmítne."
 petition_liege.0209.desc.bridge.apologetic: "$petition_liege.0209.desc.bridge$ „Omlouvám se, ale v zájmu [petition_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] musím tvou žádost odmítnout.“"
 petition_liege.0209.desc.bridge.unapologetic: "$petition_liege.0209.desc.bridge$ „#EMP Tohle#! je ta naléhavá záležitost, kvůli které jsi se mnou potřeboval[Select_CString(ROOT.Char.IsFemale,'a mluvit',' mluvit')]? Ne. Rozhodně ne. A teď mě omluv, musím se věnovat #EMP skutečně důležitým#! záležitostem.“"
 petition_liege.0209.desc.bridge.favor: "$petition_liege.0209.desc.bridge$ „Je mi to opravdu líto, ale této žádosti nemohu vyhovět. Kdyby to bylo možné, dal[Select_CString(petition_liege.IsFemale,'a bych ti, co žádáš',' bych ti, co žádáš')], ale snad ti postačí příslib budoucí laskavosti.“"
 petition_liege.0209.counter: "Počkej, [petition_liege.GetLadyLord]! Vyslechni mě!"
 petition_liege.0209.a: "Bohužel."
 petition_liege.0209.favor: "Dobrá."
 petition_liege.0301.t: "Protinabídka přijata"
 petition_liege.0309.t: "Protinabídka odmítnuta"
 petition_liege.0401.t: "$petition_liege_header$ Druhý názor"
 petition_liege.0401.desc.intro: "[petition_liege.GetTitledFirstName] se na okamžik zamyslí a pak zvolá: „[first_portrait.GetFirstName], potřebuji v této záležitosti tvou radu!“ [first_portrait.Custom('GetNotableCharacteristic')] [first_portrait.Custom('GetPetitionLiegeTitle')] dychtivě předstoupí a pevně svírá [first_portrait.Custom('councillor_flavor_prop')]. „Ano, velmi choulostivá záležitost, [petition_liege.GetLadyLord]...“\n\n"
 petition_liege.0401.desc.second: "[second_portrait.GetTitledFirstName], [second_portrait.Custom('GetPetitionLiegeTitle')] [petition_liege.GetTitleAsNameNoTooltip], vše tiše sleduje opodál"
 petition_liege.0401.desc.second_diplomacy: "$petition_liege.0401.desc.second$ — možná bych mohl[Select_CString(ROOT.Char.IsFemale,'a zapůsobit na diplomatickou stránku',' zapůsobit na diplomatickou stránku')] [second_portrait.GetFirstNameNoTooltip]?\n\n"
 petition_liege.0401.desc.second_martial: "$petition_liege.0401.desc.second$ — možná by praktický argument získal podporu [second_portrait.GetFirstNameNoTooltip]?\n\n"
 petition_liege.0401.desc.second_stewardship: "$petition_liege.0401.desc.second$ — možná by správná čísla přesvědčila [second_portrait.GetFirstNameNoTooltip], že mou pomoc skutečně potřebuji?\n\n"
 petition_liege.0401.desc.second_intrigue: "$petition_liege.0401.desc.second$ — co kdybych [second_portrait.GetFirstNameNoTooltip] veřejně přelstil[Select_CString(ROOT.Char.IsFemale,'a','')]?\n\n"
 petition_liege.0401.desc.second_learning: "$petition_liege.0401.desc.second$ — nikdo by nemohl zpochybnit argument, který nedokáže vyvrátit ani #EMP [second_portrait.GetFirstNameNoTooltip]#!.\n\n"
 petition_liege.0401.desc.third_soulmate: "Na druhou stranu není daleko ani má milovaná duše [third_portrait.GetTitledFirstName]"
 petition_liege.0401.desc.third_lover: "[third_portrait.GetTitledFirstName] na mě nenápadně mrkne"
 petition_liege.0401.desc.third_best_friend: "Je zde i můj nejbližší důvěrník [third_portrait.GetTitledFirstName]"
 petition_liege.0401.desc.third_friend: "Ačkoli... můj dobrý přítel [third_portrait.GetTitledFirstName] by také mohl mít určitý vliv"
 petition_liege.0401.desc.third_fallback: "Když už o tom přemýšlím, [third_portrait.GetTitledFirstName] mě měl[Select_CString(third_portrait.IsFemale,'a vždycky v oblibě',' vždycky v oblibě')]"
 petition_liege.0401.desc.third: " — možná by se mě [third_portrait.GetFirstNameNoTooltip] mohl[Select_CString(third_portrait.IsFemale,'a zastat',' zastat')]?\n\n"
 petition_liege.0401.desc.outro: "[petition_liege.GetTitleAsNameNoTooltip] se znovu obrátí ke mně, ale pozornost už očividně míří jinam. Musím #EMP něco udělat#!!"
 petition_liege.0401.first: "Přesně vím, čím [first_portrait.GetFirstNameNoTooltip] zaskočím..."
 petition_liege.0401.second: "„[second_portrait.GetFirstNameNoTooltip]!"
 petition_liege.0401.second_diplomacy: "$petition_liege.0401.second$ Jistě se tu dá najít prostor pro kompromis?“"
 petition_liege.0401.second_martial: "$petition_liege.0401.second$ #EMP Ty#! přece musíš chápat, co tím myslím?“"
 petition_liege.0401.second_stewardship: "$petition_liege.0401.second$ #EMP Tobě#! přece musí být ta logika jasná?“"
 petition_liege.0401.second_intrigue: "$petition_liege.0401.second$ #EMP Ty#! v tom přece musíš vidět smysl?“"
 petition_liege.0401.second_learning: "$petition_liege.0401.second$ #EMP Ty#! přece musíš chápat moudrost tohoto řešení?“"
 petition_liege.0401.wildcard: "[third_portrait.GetTitledFirstNameNoTooltip] jim to vysvětlí!"
 petition_liege.0401.success: "[petition_liege.GetTitledFirstNameNoTooltip] změní názor"
 petition_liege.0401.failure: "[petition_liege.GetTitledFirstNameNoTooltip] se nenechá přesvědčit"
 petition_liege.0501.opening: "[second_party.Custom2('AppropriateGreeting', ROOT.Char )]"
 petition_liege.0501.desc: "[second_party.GetTitledFirstName], velmi mě mrzí, že tě musím stavět do této situace.\n\nŽádám tě, aby ses vzdal[Select_CString(second_party.IsFemale,'a titulu',' titulu')] [petition_claim.GetName] ve prospěch [petition_vassal.GetTitledFirstName], kdo si na něj rovněž činí nárok. Věřím, že mé přání v této záležitosti budeš respektovat."
 petition_liege.0501.a: "Jakou mám vůbec možnost...?"
 petition_liege.0501.b: "Tohle nemohu přijmout!"
 petition_liege.0501.refuse_tt: "[second_party.GetTitledFirstName] [Select_CString(second_party.IsFemale,'odmítla vzdát se titulu','odmítl vzdát se titulu')] [petition_claim.GetName]"
 petition_liege.0601.t: "$petition_liege_header$ Neplatné"
 petition_liege.0601.desc.court: "Po dokončení mé korunovace na [ROOT.Char.GetTitleAsNameNoTooltip] už má žádost není zapotřebí..."
 petition_liege.0601.desc.imprisoned_me: "$petition_liege.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] mě [Select_CString(ROOT.Char.GetImprisonedBy.IsFemale,'uvrhla do vězení','uvrhl do vězení')]."
 petition_liege.0601.desc.imprisoned: "$petition_liege.0601_shared_intro$ [Select_CString(ROOT.Char.IsFemale,'Byla jsem zajata','Byl jsem zajat')] [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
 petition_liege.0601.desc.liege_dead_me: "$petition_liege.0601_shared_intro$ Nakonec jsem [petition_liege.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')]...\n\n"
 petition_liege.0601.desc.liege_dead: "$petition_liege.0601_shared_intro$ [petition_liege.GetTitledFirstName] [petition_liege.GetDeathReasonHideKiller]...\n\n"
 petition_liege.0601.desc.liege_imprisoned_me: "$petition_liege.0601_shared_intro$ Nakonec se mi podařilo zajmout [petition_liege.GetTitledFirstName]!"
 petition_liege.0601.desc.liege_imprisoned: "$petition_liege.0601_shared_intro$ [petition_liege.GetTitledFirstName] [Select_CString(petition_liege.IsFemale,'byla zajata','byl zajat')] [petition_liege.GetImprisonedBy.GetTitledFirstName]."
 petition_liege.0601.desc.new_liege: "Svou žádost teď budu muset přednést novému lennímu pánovi [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 petition_liege.0601_shared_intro: "Právě když se má žádost dala do pohybu a už už měla přinést ovoce,"
 petition_liege.0601.desc: "\n\nTohle rozhodně mění situaci."
 petition_liege.0601.a_court: "Vzhůru za většími věcmi."
 petition_liege.0601.a_prison: "Sakra."
 petition_liege.0601.a_liege: "Jen počkej..."
 petition_liege.0601.a: "Je načase všechno přehodnotit..."
 petition_liege.9999.t: "$petition_liege_header$ Závěr"
 petition_liege.9999.desc: "Když odejde poslední žadatel, několik dvořanů jej následuje ze sálu za povinnostmi, které je čekají jinde. Ostatní zůstávají a mezi sebou probírají nedávné žádosti.\n\nBrzy se veškerá obřadní formálnost vytratí a nahradí ji obvyklý ruch dvorského života."
 petition_liege.9999.a: "Má práce zde skončila."
 petition_liege.9999.arrogant: "Je dobré nechat poddané žasnout nad mou přítomností."
 petition_liege.9999.shy: "Už se nemohu dočkat, až se vrátím do svých komnat..."
 petition_liege.9999.gregarious: "Tohle je dobrá příležitost pobýt se svým dvorem."
 petition_liege.9999.every_guest_and_courtier: "Každý host a dvořan:"
 petition_liege.9001.t: "$petition_liege_header$ Změna taktiky"
 petition_liege.9001.desc: "Už nemohu žádat [petition_liege.GetTitledFirstName] o [ROOT.Char.Custom( 'GetPetitionType' )|l]. Přesto jsem cestoval[Select_CString(ROOT.Char.IsFemale,'a až sem do',' až sem do')] [petition_liege.GetCapitalLocation.GetName], abych získal[Select_CString(ROOT.Char.IsFemale,'a možnost promluvit si',' možnost promluvit si')] s [petition_liege.GetFirstNameNoTooltip], a takovou příležitost nepromarním. Mohl[Select_CString(ROOT.Char.IsFemale,'a bych tedy požádat třeba o',' bych tedy požádat třeba o')]..."
