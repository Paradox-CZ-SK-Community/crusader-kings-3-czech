 pilgrimage.0040.t: "$pilgrimage_header$ Konec cesty"
 pilgrimage.0040.desc: "A tak má duchovní cesta náhle končí. Stejně jako list unášený rozbouřenou řekou však nezbývá než sledovat, kam mě nové okolnosti zanesou."
 pilgrimage.0040.desc_moved_capital: "Když je teď mým hlavním městem právě nádherné místo [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], aktivita [GetActivityType('activity_pilgrimage').GetNameNoTooltip] už pro mě nemá příliš smysl.\n\nMěl[Select_CString(ROOT.Char.IsFemale,'Měla bych','Měl bych')] bych svou cestu zde ukončit a zkusit štěstí u jiného svatého místa."
 pilgrimage.0040.a: "Jsem list unášený řekou."
 pilgrimage.0040.a_moved_capital: "Pusťme se do toho."
 pilgrimage.0041.t: "$pilgrimage.0040.t$?"
 pilgrimage.0041.desc: "Běda, mé tělo mě zrazuje. Duch však zůstává silný. Mám věřit, že [ROOT.Char.GetFaith.HealthGodName] ochrání můj život, a pokračovat v cestě do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]?"
 pilgrimage.0041.a: "#EMP [ROOT.Char.GetFaith.HighGodName]#! mi žehná."
 pilgrimage.0041.a.tt: "Tvá [THIS.Char.GetInvolvedActivity.GetName] bude pokračovat"
 pilgrimage.0041.b: "Ne, je to příliš nebezpečné."
 pilgrimage.0042.t: "$pilgrimage_header$ Pohřeb doma"
 pilgrimage.0042.desc: "Naše cesta byla předčasně ukončena a nyní se vydáme zpět do [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], abychom [old_pilgrimage_host.GetTitledFirstName] uložili k poslednímu odpočinku."
 pilgrimage.0042.a: "[old_pilgrimage_host.GetFirstNameNoTooltip] by si to [Select_CString(old_pilgrimage_host.IsFemale,'přála','přál')]."
 pilgrimage.0500.t: "Smrt poutníka"
 pilgrimage.0500.desc: "„[first_holy_site.GetProvince.GetNameNoTooltip]. [second_holy_site.GetProvince.GetNameNoTooltip]. Ach, [second_holy_site.GetProvince.GetNameNoTooltip]...“ Na posteli leží [pilgrimage_dying_relative.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('pilgrimage_dying_relative'))], už jen křehký stín [Select_CString(pilgrimage_dying_relative.IsFemale,'ženy, kterou bývala','muže, kterým býval')]. Když se pomalu přibližuji k posteli, [pilgrimage_dying_relative.GetFirstNameNoTooltip] se pokouší zaostřit zakalený zrak na mě.\n\n„[pilgrimage_dying_relative.Custom2('RelationToMe' , ROOT.Char)|U]... člověk nelituje toho, co udělal, ale toho, co neudělal.“ Nakloním se blíž a v dechu cítím pach rozkladu. [pilgrimage_dying_relative.GetFirstNameNoTooltip] pokračuje: „Nedovol, aby tě každodenní nástrahy odvedly z pravé cesty. Na jejím konci stojí [ROOT.Char.GetFaith.HighGodName].“\n\nTvář [pilgrimage_dying_relative.GetFirstNameNoTooltip] zkřiví bolest a já pochopím, že náš rozhovor skončil."
 pilgrimage.0500.a: "Ano, samozřejmě."
 pilgrimage.0500.a.flavor: "Jestli díky tomu bude [Select_CString(pilgrimage_dying_relative.IsFemale,'odpočívat klidněji','odpočívat klidněji')]."
 pilgrimage.0500.a.tt_pilgrimage: "Tvá příští [Concept('pilgrimage','pouť')|E] bude levnější"
 pilgrimage.0500.b: "V poslední době mám opravdu mnoho povinností, [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('pilgrimage_dying_relative'))]."
 pilgrimage.0500.b.flavor: "Opravdu bych raději ne."
 pilgrimage.1100.t.greek: "$pilgrimage_header$ Planoucí Helena"
 pilgrimage.1100.t.christian: "$pilgrimage_header$ Oheň svatého Eliáše"
 pilgrimage.1100.t.pagan: "$pilgrimage_header$ Plameny [ROOT.Char.GetFaith.DivineRealm]"
 pilgrimage.1100.t: "$pilgrimage_header$ Božský plamen"
 pilgrimage.1100.desc: "Bouře na moři nás zastihne zcela nepřipravené. Z oblohy rozervané blesky se spustí liják a vzápětí se za ohlušujícího zahřmění na vrcholcích stěžňů rozhoří modré plameny, které zahalí loď do nadpozemského světla.\n\n"
 pilgrimage.1100.companion: "„To je znamení!“ vykřikne můj [ROOT.Char.Custom2('RelationToMeShort', panicked_pilgrim)] [panicked_pilgrim.GetTitledFirstName] a v panice se křečovitě drží lanoví. Přes burácení plachet je sotva slyšet. „#EMP Musíme#! se vrátit! Než bude příliš pozdě!“\n\n"
 pilgrimage.1100.alone: "Zdá se, jako by se loď vznášela nad běsnícími vlnami, nedotčená jejich zuřivostí a bezpečně vedená bouří jakousi božskou silou."
 pilgrimage.1100.a: "Vede nás [ROOT.Char.GetFaith.HighGodNameAlternate|U]!"
 pilgrimage.1100.a.flavor: "Drž kurz, kormidelníku!"
 pilgrimage.1100.b: "Vystoupám vzhůru! [ROOT.Char.GetFaith.HighGodName] mě očekává!"
 pilgrimage.1100.b.success.t: "Božský oheň"
 pilgrimage.1100.b.wounded.t: "Zranění"
 pilgrimage.1100.b.flavor: "Ať pocítím náruč [ROOT.Char.GetFaith.random_DivineRealm]!"
 pilgrimage.1100.c: "Oběť požaduje [ROOT.Char.GetFaith.WaterGodName]!"
 pilgrimage.1100.c.flavor: "Musíme tu bouři přečkat!"
 pilgrimage.1100.d: "Otočte loď, vy blázni!"
 pilgrimage.1100.d.flavor: "$pilgrimage.1100.c.flavor$"
 every_family_member_tt: "Každý člen rodiny"
 pilgrimage.1100.success: "Bezpečně pokračuješ v cestě"
 pilgrimage.1100.failure: "Bouře tě zanese mimo kurz"
 pilgrimage_random_pilgrim_tt: "Náhodný poutník zemře, což rozruší všechny členy jeho [Concept('family','rodiny')|E]"
 pilgrimage_fell_overboard_tt: "[victim_pilgrim.GetFirstName] [Select_CString(victim_pilgrim.IsFemale,'spadla','spadl')] přes palubu"
 pilgrimage.1110.t: "$pilgrimage_header$ Loupežnictví [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)|U]"
 pilgrimage.1110.desc: "Při cestě přes [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] v [heathen_raider_county.GetNameNoTierNoTooltip] zahlédneme praporce malé ozbrojené družiny, ozdobené [heathen_raider.GetFaith.GetAdjective] symbolem [heathen_raider.GetFaith.ReligiousSymbol]. Jsou to otrhaní tuláci, kteří přepadávají poutníky mířící do [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName].\n\nJejich vůdce nám rychle zastoupí cestu, vzepne koně a představí se jako [heathen_raider.GetFirstName]."
 pilgrimage.1110.shared_target_heathen_hajj: "„Stůj, [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)]! [ROOT.Char.GetFaith.HighGodName] přikazuje, že [ROOT.Char.GetFaith.GetAdherentNamePlural] musí zaplatit poplatek za Kaabu.“"
 pilgrimage.1110.shared_target_controlled_hajj: "„Žádám jen malý poplatek za spatření Kaaby od jejích [heathen_raider.Custom2('GetUnbelieverTermAdjective', ROOT.Char)] [ROOT.Char.GetFaith.GetAdjective] správců.“"
 pilgrimage.1110.shared_target_heathen_jerusalem: "„Nebojte se, [heathen_raider.Custom2('GetUnbelieverTermPlural', ROOT.Char)], divy našeho svatého města na vás čekají... za malý poplatek.“"
 pilgrimage.1110.shared_target_controlled_jerusalem: "„Pokud opravdu toužíš spatřit své vytoužené svaté město, můj nepatrný poplatek tě snad neurazí.“"
 pilgrimage.1110.shared_target_heathen: "„Copak vy [ROOT.Char.GetFaith.GetAdjective] psi nevíte? [ROOT.Char.Custom2('GetUnbelieverTermPlural', heathen_raider)|U] musí zaplatit tribut, chtějí-li spatřit posvátné [heathen_raider.GetFaith.HouseOfWorshipPlural].“"
 pilgrimage.1110.shared_target_controlled: "„Vaše [ROOT.Char.GetFaith.HouseOfWorshipPlural] nikam nezmizí. Nejdřív ale zaplaťte náš skromný poplatek.“"
 pilgrimage.1110.shared_heathen_controlled: "„Naše [heathen_raider.GetFaith.HouseOfWorshipPlural] stojí za vidění. Přesvědčíte se sami, jakmile zaplatíte, co nám náleží.“"
 pilgrimage.1110.fallback: "„Stůj, [ROOT.Char.Custom2('GetUnbelieverTerm', heathen_raider)]. Na těchto cestách udržuji pořádek a zaplatíš stejně jako všichni ostatní.“"
 pilgrimage.1110.a: "Jestli chceš mé zlato, pojď si pro něj."
 pilgrimage.1110.a.fled: "Bandité si to rozmyslí"
 pilgrimage.1110.a.skirmish: "Odrazíš první vlnu"
 pilgrimage.1110.a.beaten: "Za tvou drzost ti vezmou všechno"
 pilgrimage.1110.b.religion: "„No tak, [heathen_raider.Custom('SisterBrother')]. Oba nás vede [ROOT.Char.GetFaith.HighGodName].“"
 pilgrimage.1110.b.unreformed: "„No tak, na [ROOT.Char.GetFaith.ReligiousText] není nikdy pozdě.“"
 pilgrimage.1110.b: "„Není třeba násilí. Promluvme si.“"
 pilgrimage.1110.c: "„Žiješ v omylu. Vyslechni [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] pravdy.“"
 pilgrimage.1110.c.success: "Tvá slova znějí přesvědčivě"
 pilgrimage.1110.c.failure: "Banditu tvá slova nepobaví"
 pilgrimage.1110.d: "„Vezmi si to zlato, bandito.“"
 two_entourage_members_wounded_tt: "Až dva členové doprovodu mohou získat [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 one_entourage_members_wounded_tt: "Jeden člen doprovodu může získat [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 two_entourage_members_die_tt: "Až dva členové doprovodu mohou zemřít"
 one_entourage_members_die_tt: "Jeden člen doprovodu může zemřít"
 pilgrimage.1120.t: "$pilgrimage_header$ [temple_province.GetCounty.GetFaith.GetReligion.GetAdjectiveNoTooltip] architektura"
 pilgrimage.1120.desc: "Při cestě přes [temple_province.GetTitle.GetDeJureLiege.GetNameNoTooltip] využijeme příležitosti navštívit [ROOT.Char.GetFaith.HouseOfWorship] v [temple_province.GetName], [temple_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] centrum [temple_province.GetCounty.GetFaith.GetAdjective] náboženské autority a uctívání.\n\n[temple_person.GetName], místní [temple_person.GetFaith.PriestNeuter] nižšího postavení, nás provede po areálu a budovách. [Select_CString(temple_person.IsFemale,'Vypráví','Vypráví')] nám o jejich historii a ukazuje umělecká díla vytvořená místními [temple_province.GetCounty.GetFaith.DevoteeNeuterPlural], kteří se právě shromáždili k poledním modlitbám."
 pilgrimage.1120.a: "To mi vnuklo nápad..."
 pilgrimage.1120.b: "Tak #EMP tohle#! přesně potřebujeme v [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 pilgrimage.1120.c: "Jak ubohá napodobenina [ROOT.Char.GetFaith.HouseOfWorship]."
 pilgrimage.1120.d: "Ano, ano, to už stačí, děkuji."
 pilgrimage.1120.e: "Připojím se k modlitbě. [ROOT.Char.GetFaith.HighGodName] si zaslouží mou úctu."
 pilgrimage.1120.f: "Tak #EMP tohle#! přesně potřebujeme v [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 pilgrimage.1130.t: "$pilgrimage_header$ Svatyně u cesty"
 pilgrimage.1130.desc: "Na rozcestí těsně za [shrine_province.GetName] stojí mezi [shrine_province.Custom('GetProvinceGroundDesc')] opuštěná [shrine_province.GetCounty.GetFaith.GetAdjective] svatyně označená symbolem [shrine_province.GetCounty.GetFaith.ReligiousSymbol].\n\nVe výklenku jsou ukryty skromné obětiny zanechané poutníky a místními, obklopené zbytky bezpočtu dávno vyhaslých svíček."
 pilgrimage.1130.both: "\n\n[shrine_faithist.GetName], [ROOT.Char.Custom2('RelationToMeShort', shrine_faithist)], se před svatyní [Select_CString(shrine_faithist.IsFemale,'ukloní','ukloní')], zatímco [shrine_mocker.GetName], [ROOT.Char.Custom2('RelationToMeShort', shrine_mocker)], obrátí oči v sloup a hlasitě si odfrkne."
 pilgrimage.1130.faithist: "\n\n[shrine_faithist.GetName], [ROOT.Char.Custom2('RelationToMeShort', shrine_faithist)], se zastaví, [Select_CString(shrine_faithist.IsFemale,'ukloní se','ukloní se')] před svatyní a přidá k ostatním obětinám vlastní drobný dar."
 pilgrimage.1130.mocker: "\n\n[shrine_mocker.GetName], [ROOT.Char.Custom2('RelationToMeShort', shrine_mocker)], se při pohledu na svatyni ušklíbne a cosi zamumlá o [shrine_mocker.GetFaith.NegativeAfterLife]."
 pilgrimage.1130.a: "Něco málo mohu postrádat."
 pilgrimage.1130.b: "Když už to tu leží..."
 pilgrimage.1130.b.flavor: "Mně to stejně poslouží lépe!"
 every_root_faith_entourage_member_tt: "Každý [shrine_visitor.GetFaith.GetAdjective] člen doprovodu"
 every_province_faith_entourage_member_tt: "Každý [shrine_province.GetCounty.GetFaith.GetAdjective] člen doprovodu"
 every_zealous_root_faith_entourage_member_tt: "Každý [GetTrait('zealous').GetName( GetNullCharacter )] [shrine_visitor.GetFaith.GetAdjective] člen doprovodu"
 pilgrimage.1130.c: "Strhněte tuhle [shrine_province.GetCounty.GetFaith.GetAdjectiveNoTooltip] pošetilost!"
 pilgrimage.1130.c.flavor: "To jim ukáže!"
 pilgrimage.1130.d: "„[shrine_faithist.GetFaith.HighGodName] z toho nic mít nebude, to přece víš.“"
 pilgrimage.1130.d.flavor: "Protože [shrine_faithist.GetFaith.HighGodName] vůbec neexistuje!"
 pilgrimage.1130.e: "Drž jazyk za zuby, [ROOT.Char.Custom2('GetUnbelieverTerm', shrine_mocker)]."
 pilgrimage.1130.f: "Pojďme, nezdržujme se."
 pilgrimage.1130.f.other: "[ROOT.Char.GetFaith.HighGodName] nebude čekat na žádného [shrine_province.GetCounty.GetFaith.GetAdherentNameNoTooltip]."
 pilgrimage.1140.t: "$pilgrimage_header$ V bezpečí davu"
 pilgrimage.1140.desc: "Když procházíme [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier], přistoupí k nám prostý člověk z [group_leader.GetCulture.GetName] kultury a představí se jako vůdce skupiny [ROOT.Char.GetFaith.GetAdjective] poutníků.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip], už několik týdnů jsme na cestě do [destination.GetName], ale cesty jsou příliš nebezpečné a zásoby nám docházejí.“\n\n„Za tvou pomoc bychom byli navěky vděční.“"
 pilgrimage.1140.a: "Čím víc, tím líp!"
 pilgrimage.1140.a.tt: "[group_leader.GetFirstName] a až tři další se připojí k tvé aktivitě [ROOT.Char.GetInvolvedActivity.GetName]"
 pilgrimage.1140.b: "[group_leader.GetCulture.GetNameNoTooltip] kultura? V žádném případě."
 pilgrimage.1140.b.flavor: "Nikdy nevěř nikomu z [group_leader.GetCulture.GetNameNoTooltip] kultury."
 pilgrimage.1140.c: "Tady máte pár mincí za vaše útrapy."
 pilgrimage.1140.d: "Ani náhodou, sedláku."
 pilgrimage.1140.d.flavor: "Tak už běž! Zmiz!"
 grateful_pilgrims_title: "Vděční poutníci"
 cultural_acceptance_rejected_pilgrims: "Odmítnutí poutníci"
 pilgrimage.2002.t: "$pilgrimage_header$ Miluj bližního svého"
 pilgrimage.2002.desc: "Mezi ostatními poutníky je i [heathen_hater.GetFirstNameNoTooltip], kdo neustále káže o soucitu a sounáležitosti... tedy alespoň dokud nepřijde řeč na [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')].\n\nJednoho večera u táborového ohně je hlasitě prohlásí za „ohavná monstra! Ať je soudí [ROOT.Char.GetFaith.PantheonTerm]! Samí zvrhlíci a vrazi dětí!“ Kdykoli se [heathen_hater.GetFirstNameNoTooltip] po někom podívá, většina lidí rychle sklopí zrak. Dnes večer svůj pohled neodvrátím dost rychle. „Nesouhlasíš snad, ó [ROOT.Char.GetTitleAsNameNoTooltip]?“"
 pilgrimage.2002.a: "#EMP Všichni#! přece nejsou tak špatní."
 pilgrimage.2002.b: "Souhlasím a nevěřil[Select_CString(ROOT.Char.IsFemale,'a bych nikomu, kdo by se jich zastával','bych nikomu, kdo by se jich zastával')]!"
 pilgrimage.2002.c: "Přesně! [ROOT.Char.GetFaith.HighGodName] vidí jejich rouhání!"
 pilgrimage.2003.t: "$pilgrimage_header$ Otázka bezpečnosti"
 pilgrimage.2003.desc: "Už nějakou dobu mě pronásleduje nepříjemný pocit. Má pouť je mnohem nebezpečnější, než jsem čekal[Select_CString(ROOT.Char.IsFemale,'a','')]. Nebo jsem snad ještě [Select_CString(ROOT.Char.IsFemale,'neprošla dost zkouškami, abych si zasloužila ochranu','neprošel dost zkouškami, abych si zasloužil ochranu')]. [ROOT.Char.GetFaith.HighGodNameAlternate] mě zřejmě zatím nechce chránit.\n\nV místní osadě [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] jsem si však [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')] několika působivých jedinců, kteří by bezpečnost pouti jistě dokázali zlepšit... velmi praktickým způsobem."
 pilgrimage.2003.a: "[Select_CString(ROOT.Char.IsFemale,'Měla bych','Měl bych')] pár z nich najmout na svou pouť."
 pilgrimage.2003.b: "[2002_local_warrior.GetTitledFirstNameNoTooltip] vypadá jako skvělá volba."
 pilgrimage.2003.c: "Ne. [ROOT.Char.GetFaith.PantheonTerm] mě ochrání."
 pilgrimage.2004.t: "$pilgrimage_header$ Nečekané setkání"
 pilgrimage.2004.desc: "Čím více se blížím k [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], tím více potkávám dalších poutníků ze všech koutů světa.\n\nJeden z nich mě pozná už z dálky. „[ROOT.Char.GetTitledFirstNameNoTooltip]?! Jsi to opravdu ty?“\n\nNení to nikdo jiný než [potential_friend.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 pilgrimage.2004.a: "Takové setkání nemůže být náhoda. [ROOT.Char.GetFaith.PantheonTerm] nad námi bdí!"
 pilgrimage.2004.b: "Příznivé setkání, ale modlit se musím o samotě."
 pilgrimage.2005.t: "$pilgrimage_header$ Nestydatá historka"
 pilgrimage.2005.desc: "Když procházím kolem táborového ohně, zaslechnu poutníka z jiného doprovodu vyprávět historku, v níž hlavní roli hraje [ROOT.Char.GetTitleAsNameNoTooltip]"
 pilgrimage.2005.desc_close: " z těchto krajů,"
 pilgrimage.2005.desc_far: " z jakéhosi vzdáleného místa jménem [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 pilgrimage.2005.outro: " a všichni kolem propukají v bouřlivý smích.\n\nKdyž si [rude_pilgrim.GetFirstNameNoTooltip] všimne mého zaváhání, konejšivě se na mě podívá. „Neboj se, [ROOT.Char.Custom('FormOfAddressForLiege')]... určitě jde o [Select_CString(ROOT.Char.IsFemale,'nějakou #EMP jinou#! nafoukanou šlechtičnu','nějakého #EMP jiného#! nafoukaného šlechtice')]!“"
 pilgrimage.2005.a: "„Opravdu? Tak pokračuj. [ROOT.Char.GetTitleAsNameNoTooltip] mě začíná zajímat.“"
 pilgrimage.2005.a.flavor: "Posadím se k ohni."
 pilgrimage.2005.b: "„Stráže! Přineste můj bič.“"
 pilgrimage.2005.c: "Možná je načase najít si jiné společníky na cestu."
 pilgrimage.2006.t: "$pilgrimage_header$ Vyhlídková trasa"
 pilgrimage.2006.intro: "Má duchovní cesta se doslova zastavila na místě."
 pilgrimage.2006.desc_alone: "Pozorně se rozhlížím a snažím se poznat správnou cestu, ale vůbec nic mi nepřipadá povědomé. Začínám mít trochu obavy. Bylo to přece...\n\ntudy, nebo ne...? Nejistě pohlédnu k místnímu sedlákovi, který se o kus dál věnuje své práci."
 pilgrimage.2006.desc_travel_leader: "Můj $travel_leader_court_position$ [caravan_master.GetTitledFirstName] se horečně rozhlíží a snaží se najít správnou cestu. Ostatní si toho začínají všímat.\n\n[caravan_master.GetTitledFirstNamePossessiveNoTooltip] tvář postupně bledne, až se pohled nakonec obrátí ke mně a zoufale hledá odpověď na otázku, co máme dělat dál."
 pilgrimage.2006.a: "Cestu do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] znám jako své boty!"
 pilgrimage.2006.a_pious: "Cestu nám ukáže [ROOT.Char.GetFaith.HighGodNameAlternate]."
 pilgrimage.2006.b: "Ještě chvíli obdivujme stvořený svět. [ROOT.Char.GetFaith.CreatorName] nám jej jistě nedal nadarmo."
 pilgrimage.2006.b_cynical: "Konec světa to snad není."
 pilgrimage.2006.c: "Asi bych se mohl[Select_CString(ROOT.Char.IsFemale,'a','')] zeptat místních na cestu..."
 pilgrimage.2006.c_caravan_master: "Tak a teď se na cestu půjdeš zeptat #EMP ty#!."
 pilgrimage.2008.t: "$pilgrimage_header$ Nemoc"
 pilgrimage.2008.desc: "Zdá se, že mi všechno to cestování nesvědčí. Možná za to mohou cizí kraje plné nezvyklého vzduchu, možná mi jednoduše nedělá dobře zdejší počasí.\n\nKašel mě však trápí už několik týdnů a dnes ráno jsem sotva našel[Select_CString(ROOT.Char.IsFemale,'a','')] sílu vstát z postele."
 pilgrimage.2008.a: "Ať tedy rozhodne [ROOT.Char.GetFaith.HighGodNameAlternate]."
 pilgrimage.2008.a.tt: "Cestování s rysem [GetTrait('ill').GetName( GetPlayer )] představuje větší zdravotní riziko"
 pilgrimage.2008.whole_of_body: "Ale prosím, tenhle kašlík brzy přejde."
 pilgrimage.2008.court_physician: "[traveling_court_physician.GetTitledFirstNameNoTooltip|U], namíchej mi něco."
 pilgrimage.2009.t: "$pilgrimage_header$ Chrčivý kašel"
 pilgrimage.2009.desc: "Cesta mi vůbec nesvědčí. Mé zdraví se během pouti za milostí ani trochu nezlepšilo, přestože nade mnou bdí [ROOT.Char.GetFaith.PantheonTerm]. Naopak, je mnohem, mnohem horší. Už si ani nepamatuji, jaké to je nadechnout se bez námahy."
 pilgrimage.2009.a: "Ať se [ROOT.Char.GetFaith.HighGodNameAlternate] smiluje."
 pilgrimage.2009.a.tt: "Cestování s rysem [GetTrait('pneumonic').GetName( GetPlayer )] představuje vážné zdravotní riziko"
 pilgrimage.2010.t: "$pilgrimage_header$ Mystik"
 pilgrimage.2010.desc: "[2010_mystic.GetTitledFirstName] patří k nejpodivnějším lidem, které jsem na této cestě potkal[Select_CString(ROOT.Char.IsFemale,'a','')]. Víru bere očividně velmi vážně, ale zároveň dlouze rozjímá nad skutečnou podstatou božství, nad tím, jaké místo v ní zaujímá [ROOT.Char.GetFaith.HighGodName], a co to všechno vlastně znamená. V noci ze stanu [2010_mystic.GetFirstNameNoTooltip] září světlo svíček a čas od času se z něj ozývá podivný zpěv a line nezvyklé kadidlo.\n\nVůbec nejsem připraven[Select_CString(ROOT.Char.IsFemale,'á','')], když mě [2010_mystic.GetFirstNameNoTooltip] vyzve, ať vstoupím."
 pilgrimage.2010.a: "Jsem docela zvědav[Select_CString(ROOT.Char.IsFemale,'á','ý')]..."
 pilgrimage.2010.a.tt: "Vstoupíš do stanu"
 pilgrimage.2010.b: "Ne, děkuji. Tohle všechno mi zavání kacířstvím!"
 pilgrimage.2011.desc: "Uvnitř stanu [2010_mystic.GetTitledFirstNamePossessive] mě přivítají silné vůně a nesnesitelně horký, těžký vzduch. „Je důležité obrátit pohled do vlastního nitra,“ vysvětluje [2010_mystic.GetFirstNameNoTooltip] a posadí se.\n\n„Chci, abys zavřel[Select_CString(ROOT.Char.IsFemale,'a oči a soustředila se',' oči a soustředil se')], stejně jako já. Nech skrze sebe proudit [ROOT.Char.GetFaith.PantheonTerm]. Dosáhni božského vytržení!“"
 pilgrimage.2011.a: "Ano! Cítím to spojení! [ROOT.Char.GetFaith.HighGodNameAlternate] je mi nablízku!"
 pilgrimage.2011.a.tt: "Prožiješ božské vytržení"
 pilgrimage.2011.b: "Je tu tak příjemně, že bych snad mohl[Select_CString(ROOT.Char.IsFemale,'a usnout',' usnout')]..."
 pilgrimage.2011.b.tt: "Příjemně si zdřímneš"
 pilgrimage.2011.c: "Řekni mi, co s tím vším má společného [ROOT.Char.GetFaith.HighGodName]?"
 pilgrimage.2011.c.tt: "Pustíš se s mystikem do debaty"
 pilgrimage.2012.desc: "Nedokážu si pořádně vybavit, co se stalo poté, co jsem vstoupil[Select_CString(ROOT.Char.IsFemale,'a do mystikova stanu',' do mystikova stanu')]. Pamatuji si jen neurčité obrazy a pocit omámení.\n\nTeď si kladu otázku, zda tu [2010_mystic.GetFirstNameNoTooltip] vůbec kdy [Select_CString(2010_mystic.IsFemale,'byla','byl')]..."
 pilgrimage.2012.a: "[2010_mystic.GetFirstNameNoTooltip|U] [Select_CString(2010_mystic.IsFemale,'měla opravdu spoustu podivných myšlenek','měl opravdu spoustu podivných myšlenek')]."
 pilgrimage.2013.desc: "Poté, co se řídím pokyny [2010_mystic.GetTitledFirstNamePossessive], najednou všechno vidím mnohem jasněji. Dokážu to #EMP cítit#!. [ROOT.Char.GetFaith.PantheonTerm|U], celý svět... vše proudí mým tělem. Mou duší.\n\nKdyž po několika hodinách vyjdu ze stanu, rozumím sobě i životu úplně jinak než dřív."
 pilgrimage.2013.a: "[Select_CString(ROOT.Char.IsFemale,'Byla jsem slepá, ale teď vidím.','Byl jsem slepý, ale teď vidím.')]"
 pilgrimage.2014.desc: "Když se probudím poté, co jsem usnul[Select_CString(ROOT.Char.IsFemale,'a ve stanu',' ve stanu')] [2010_mystic.GetTitledFirstNamePossessive], samotný stan je pryč. Sluhové mě budí na rohoži, na které jsem usnul[Select_CString(ROOT.Char.IsFemale,'a','')], ale po mystikovi není ani stopy.\n\nAlespoň mě ten spánek pořádně osvěžil!"
 pilgrimage.2014.a: "Proč je můj měšec nějak podezřele lehký?"
 pilgrimage.2014.pilfered.t: "Okradení"
 pilgrimage.2014.pilfered.desc: "Někdo se přehrabuje v tvých věcech"
 pilgrimage.2014.restful.t: "Dobře odpočatý"
 pilgrimage.2014.restful.desc: "Spíš klidně a nerušeně"
 pilgrimage.2014.a_restful: "To jsem si dobře odpočinul[Select_CString(ROOT.Char.IsFemale,'a','')]."
 pilgrimage.2015.desc: "Přiznávám, že jsem vůbec nečekal[Select_CString(ROOT.Char.IsFemale,'a','')], že [2010_mystic.GetTitledFirstName] dokáže své podivné praktiky obhájit tak dobře.\n\nStále mám pochybnosti o tom... co vlastně [2010_mystic.GetFirstNameNoTooltip] provádí, ale rozhodně jsem získal[Select_CString(ROOT.Char.IsFemale,'a','')] několik nových pohledů k zamyšlení!"
 pilgrimage.2015.a: "Jak se #EMP vůbec#! může člověk přiblížit k [ROOT.Char.GetFaith.PantheonTerm]?"
 pilgrimage.2015.learning.t: "Zvýšená učenost"
 pilgrimage.2015.learning.desc: "Při debatě s mystikem se něco naučíš"
 pilgrimage.2015.piety.t: "Zisk zbožnosti"
 pilgrimage.2015.piety.desc: "Za debatu o svém přesvědčení získáš zbožnost"
 pilgrimage.2020.t: "$pilgrimage_header$ Zloději"
 pilgrimage.2020.desc: "Ze spánku mě vytrhne rachot železné pánve, kterou někdo v táboře převrhne. Když se rozhlédnu, zjistím, že se dva lidé převlečení za poutníky přehrabují v našich zásobách a hledají něco cenného k ukradení."
 pilgrimage.2020.desc_adult: "\n\nJeden z nich si všimne, že se probouzím, a strne na místě, zatímco druhý zloděj se dá na útěk."
 pilgrimage.2020.desc_child: "\n\nMenší z dvojice, podle všeho vyděšené dítě, si všimne, že se probouzím, a strne na místě, zatímco druhý zloděj se dá na útěk."
 pilgrimage.2020.a: "Měl[Select_CString(ROOT.Char.IsFemale,'a by ses k nám přidat',' by ses k nám přidat')] na cestu do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 pilgrimage.2020.a_child: "Posaď se k ohni, maličký."
 pilgrimage.2020.a.flavor: "[thief_to_convert.GetFirstNameNoTooltip|U] je očividně nešťastná duše."
 pilgrimage.2020.b: "Takový život pro tebe [ROOT.Char.GetFaith.HighGodName] nechce."
 pilgrimage.2020.b.success.desc: "Přesvědčíš mladého zloděje"
 pilgrimage.2020.b.success.tt: "Mladý zloděj bude potřebovat další vedení"
 pilgrimage.2020.b.failure.t: "Zloději utíkají"
 pilgrimage.2020.b.failure.desc: "Mladého zloděje se ti přesvědčit nepodaří"
 pilgrimage.2020.c: "Každý děláme, co musíme."
 pilgrimage.2020.c_cynical: "Takže #EMP tohle#! je údajně vůle božstva? [ROOT.Char.GetFaith.HighGodName] to tak chce, ano?"
 pilgrimage.2020.c.flavor: "Kdo jsem, abych zasahoval[Select_CString(ROOT.Char.IsFemale,'a','')] do božských plánů? [ROOT.Char.GetFaith.HighGodName] jistě ví, co dělá."
 pilgrimage.2021.t: "$pilgrimage_header$ Pokání"
 pilgrimage.2021.desc: "Podařilo se mi přesvědčit [thief_to_convert.GetTitledFirstName], aby změnil[Select_CString(thief_to_convert.IsFemale,'a svůj způsob života',' svůj způsob života')]. [thief_to_convert.GetFirstNameNoTooltip|U] stojí přede mnou se svěšenými rameny pod tíhou studu a vyhýbá se mému pohledu.\n\n„Takový život jsem si nevybral[Select_CString(thief_to_convert.IsFemale,'a','')],“ pronese [thief_to_convert.GetFirstNameNoTooltip] pomalu. „Co mám udělat, abych odčinil[Select_CString(thief_to_convert.IsFemale,'a své hříchy',' své hříchy')]?“"
 pilgrimage.2021.a: "Šiř učení [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]."
 pilgrimage.2021.b: "Když potrestám sám[Select_CString(ROOT.Char.IsFemale,'a sebe',' sebe')], vždycky se pak cítím lépe..."
 pilgrimage.2021.c: "Tvrdá práce vyřeší všechno."
 pilgrimage.2021.c.flavor: "[thief_to_convert.GetFirstNameNoTooltip|U] si své hříchy #EMP pro mě#! [Select_CString(thief_to_convert.IsFemale,'odpracuje','odpracuje')]."
 pilgrimage.2030.t: "$pilgrimage_header$ Rozmary počasí"
 pilgrimage.2030.desc: "Když se po moři plavíme k našemu cíli v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], nepřestává mě udivovat jeho nesmírnost a [ROOT.Char.Custom('GetWickedDangerous')] nálady.\n\nTeprve včera v noci jsme přečkali bouři a dnes ráno nás vítá nádherná duha táhnoucí se od jednoho obzoru k druhému.\n\nZaslechnu, jak někteří poutníci také rozjímají nad její velkolepostí a nazývají ten pohled #EMP božským#! a #EMP znamením#!. [ROOT.Char.GetFaith.HighGodName] nám ho prý seslal."
 pilgrimage.2030.a: "#EMP Vlastně...#!"
 pilgrimage.2030.a.flavor: "Božstvo možná stvořilo déšť, ale duha je především přírodní jev."
 pilgrimage.2030.b: "Ano! [ROOT.Char.GetFaith.HighGodName] je zde s námi!"
 pilgrimage.2030.b.flavor: "Něco tak nádherného přece #EMP musí#! být božské!"
 pilgrimage.2030.c: "Fascinující, jak příroda a božství působí společně."
 pilgrimage.2030.d: "Musím uznat, že #EMP je#! to působivé."
 pilgrimage.2040.t: "$pilgrimage_header$ Na ryby"
 pilgrimage.2040.desc: "Dny a noci na této lodi si krátím zajímavými rozhovory, modlitbami, rozjímáním nad cestou nebo prostě plánováním dalšího putování.\n\nV poslední době jsem si však všiml[Select_CString(ROOT.Char.IsFemale,'a','')], že někteří poutníci z mého doprovodu tráví čas mnohem obyčejnější činností... rybařením.\n\nVšichni vypadají bezstarostně a samotné rybaření působí překvapivě uklidňujícím dojmem."
 pilgrimage.2040.a: "Přidám se!"
 pilgrimage.2040.a.flavor: "[Select_CString(ROOT.Char.IsFemale,'Rybářka','Rybář')] je koneckonců poctivé a prosté řemeslo."
 pilgrimage.2040.a.success.t: "Velká ryba"
 pilgrimage.2040.a.success.desc: "Chytíš velkou rybu"
 pilgrimage.2040.a.less_success.t: "Malá ryba"
 pilgrimage.2040.a.less_success.desc: "Chytíš malou rybu"
 pilgrimage.2040.b: "#EMP Přízemní duše.#! Raději budu svůj čas věnovat modlitbě."
 pilgrimage.2040.c: "Co takhle si zdřímnout?"
 pilgrimage.2040.d: "Ne, raději podniknu něco jiného."
 pilgrimage.2050.t: "$pilgrimage_header$ Trosečníci"
 pilgrimage.2050.desc: "Těsně před setměním zaslechneme volání o pomoc. Když se vykloním přes zábradlí a zadívám se na širé moře, zahlédnu malý člun se třemi lidskými postavami.\n\nBez cíle se nechávají unášet mořem tam, kam je zanesou vlny.\n\nSnažím se rozeznat, kdo by to mohl být, a podle toho mála, co dokážu poznat, jde zřejmě o ztroskotané... [first_pilgrim.GetCulture.GetCollectiveNounNoTooltip]? Co proboha dělají až tady?"
 pilgrimage.2050.a: "Vylezte na palubu!"
 pilgrimage.2050.a.tt: "Vysadíš poutníky na nejbližším pobřeží"
 pilgrimage.2050.b: "Slyšeli jste už, jakou milost nabízí [ROOT.Char.GetFaith.HighGodName]?"
 pilgrimage.2050.b.success.t: "Konverze"
 pilgrimage.2050.b.success.desc: "Obrátíš poutníky na [ROOT.Char.GetFaith.GetNameNoTooltip]"
 pilgrimage.2050.b.failure.t: "Nepřesvědčeni"
 pilgrimage.2050.b.failure.desc: "Poutníky nepřesvědčíš, ale pomůžeš jim dostat se na břeh"
 pilgrimage.2050.c: "Prostě... pokračujme."
 pilgrimage.6001.t: "Čím víc, tím líp"
 pilgrimage.6001.desc: "Plahočím se v dlouhém průvodu směrem k [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] a vzpomínám na pohodlí, které jsem nechal[Select_CString(ROOT.Char.IsFemale,'a','')] v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], když zezadu zaslechnu volat své jméno.\n\nMůj přítel [friend.GetFirstNameNoTooltip] ke mně přiběhne a zvolá: „[ROOT.Char.GetTitledFirstNameNoTooltip]! Jaké štěstí, že oba putujeme ke stejnému svatému místu! Nehodila by se ti na té dlouhé a osamělé cestě do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] společnost?“"
 pilgrimage.6001.a: "Pro přítele mám vždycky ucho."
 pilgrimage.6001.b: "Myslím, že budu raději o samotě, díky."
 pilgrimage.6001.c: "Styď se. Jsme tu, abychom se věnovali své víře!"
 pilgrimage.6002.desc: "Po zbytek dne si s [friend.GetFirstNameNoTooltip] povídáme o všem možném, o intrikách a žertech, bitvách a milencích, starých přátelích i nových. Právě jsme zabraní do obzvlášť poutavého rozhovoru, když se z čela průvodu ozve unavený výkřik: „Tady rozbijeme tábor!“\n\n[friend.GetFirstNameNoTooltip|U] se na mě šibalsky usměje. „Konečně! Ale co si před stavěním tábora udělat malou zacházku? Po celodenní cestě dostane [Select_CString(friend.IsFemale,'žena','muž')] pořádnou žízeň...“"
 pilgrimage.6002.a: "Tekuté osvěžení zní božsky!"
 pilgrimage.6002.a_tt: "Navštívíš místní krčmu"
 pilgrimage.6002.b: "Jdi napřed..."
 pilgrimage.6002.b_tt: "Pokračuješ v cestě"
 pilgrimage.6002.c: "Co za [ROOT.Char.Custom('GetHeathenMiscreant')] by během pouti chodilo do krčmy?"
 pilgrimage.6003.desc: "Protlačíme se do přeplněné krčmy a [friend.GetFirstNameNoTooltip] nám okamžitě objedná dva poháry nápoje [ROOT.Char.Custom('RegionalDrink')]. Usadíme se, posloucháme příběh potulného pěvce, popíjíme a tu a tam probereme strasti i radosti života.\n\nPo dlouhém dni plném potu a dřiny na cestě je to skutečné požehnání. [ROOT.Char.GetFaith.HighGodName] budiž pochválen! Pozvednu pohár a zvolám: „Připíjím na zdraví svého přítele [friend.GetFirstNameNoTooltip], který nám po dnešní cestě navrhl tak skvělé posezení!“\n\nCelá krčma pozvedne poháry na počest mého přítele a všichni se zhluboka napijí."
 pilgrimage.6003.a: "„Další rundu platím já!“"
 pilgrimage.6003.a_tt: "Pokračuješ v oslavě s [friend.GetShortUIName]"
 pilgrimage.6003.b: "Měli bychom se vrátit do tábora, než si někdo všimne, že chybíme."
 pilgrimage.6003.b.tt: "S [friend.GetFirstNameNoTooltip] ukončíte večer a vrátíte se do tábora"
 pilgrimage.6004.desc: "Po možná až příliš mnoha rundách nápoje [ROOT.Char.Custom('RegionalDrink')] se s [friend.GetFirstNameNoTooltip] pustíme do pijáckých písní a strhneme s sebou celou krčmu, zatímco do rytmu bušíme do stolů.\n\nS hlasitým #EMP prásknutím#! a záplavou třísek se propadneme podlahou přímo do vinného sklepa a statečně se vydáváme tam, kam se před námi odvážil jen málokdo.\n\nVšichni ostatní kumpáni na nás shora hledí se směsicí obav a škodolibé radosti. Očividně čekají na hlášení ze sklepa."
 pilgrimage.6004.a: "„[ROOT.Char.Custom('RegionalDrink')|U] pro všechny!“"
 pilgrimage.6004.a.tt: "Narazíš nově objevené sudy a podělíš se o kořist s celou krčmou"
 pilgrimage.6004.b: "„Myslím, že jsme tu už přetáhli strunu...“"
 pilgrimage.6005.desc: "Ne zrovna tiše se vracíme do tábora a vroucně doufáme, že už všichni dávno spí. Když dorazíme ke stanům, vidíme, že oheň stále hoří "
 pilgrimage.6005.desc.bad: "a celý poutní průvod se otočí a zadívá se na nás.\n\nS takovým množstvím nápoje [ROOT.Char.Custom('RegionalDrink')] v útrobách jen stěží zachováváme vážnou tvář.\n\nKdyž každému, kdo je ochoten poslouchat, líčíme naše večerní dobrodružství, jeden obzvlášť horlivý poutník mě probodne přísným pohledem a trvá na tom, že musíme zaplatit škody v nedaleké krčmě."
 pilgrimage.6005.desc.good: "ale jinak se v táboře ani nic nehne.\n\nOheň někdo zřejmě těsně před spaním přiložil, aby nám přes noc nebyla zima."
 pilgrimage.6005.a: "Máme ale laskavé a ohleduplné společníky!"
 pilgrimage.6005.b: "„Za své neštěstí bychom měli zaplatit!“"
 pilgrimage.6005.c: "„Copak je zločin se trochu pobavit?“"
 pilgrimage.6006.desc: "S [friend.GetFirstName] se blížíme ke konci dnešní cesty a pomalu míříme k určenému místu odpočinku, když se náhle zepředu ozve výkřik: „Podívejte! Jaký #EMP nádherný#! západ slunce!“\n\nVšichni z posledních sil vyrazí vpřed, aby spatřili tu velkolepou podívanou. „Jaké divy je nám v tomto smrtelném životě dopřáno vidět! Dokonalá chvíle k rozjímání nad naší vírou,“ řeknu [friend.GetFirstNameNoTooltip], ale [friend.GetFirstNameNoTooltip] zjevně žádné nadšení nesdílí a pohrdavě si odfrkne.\n\n„Je to jen západ slunce!“ vykřikne. „Musí se snad všechno na téhle cestě točit kolem božství? Já chci prostě cestovat a poznávat svět... vždyť ani nevěřím, že [ROOT.Char.GetFaith.HighGodName] #EMP vůbec existuje!#!“"
 pilgrimage.6006.a: "„Tvé tajemství je u mě v bezpečí, příteli.“"
 pilgrimage.6006.b: "„Přítele bez víry vedle sebe nestrpím.“"
 pilgrimage.6006.c: "„V něčem možná máš pravdu...“"
 pilgrimage.6007.t: "Život na modlitbě"
 pilgrimage.6007.desc: "[friend.GetFirstName], [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('friend'))], [Select_CString(friend.IsFemale,'sužovaná svou chorobou','sužovaný svou chorobou')], jen těžko drží krok s naším poutním průvodem. Jdu tedy po [Select_CString(friend.IsFemale,'jejím','jeho')] boku a dělám [Select_CString(friend.IsFemale,'jí','mu')] společnost. Už nějakou dobu s námi putuje potulný [ROOT.Char.GetFaith.PriestNeuter], který si trápení [friend.GetFirstNamePossessiveNoTooltip] všimne.\n\n„Ubohá duše. [ROOT.Char.GetFaith.HighGodName] jistě nechce vidět své dítě takto strádat cestou do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]. Možná mi [ROOT.Char.GetFaith.HealthGodName] propůjčí moc zbavit tě tohoto neduhu. Dovolíš mi to zkusit?“\n\n[friend.GetFirstNameNoTooltip] se ke mně obrátí a hledá u mě radu. „Co myslíš, [ROOT.Char.GetFirstName]?“"
 pilgrimage.6007.a: "[ROOT.Char.GetFaith.HighGodName] nad námi skutečně bdí."
 pilgrimage.6007.a.success: "[friend.GetFirstNameNoTooltip] je [Select_CString(friend.IsFemale,'uzdravena','uzdraven')]"
 pilgrimage.6007.a.failure: "Stav [friend.GetFirstNamePossessiveNoTooltip] se zhorší"
 pilgrimage.6007.b: "[6007_healer.GetFirstNameNoTooltip] si naši důvěru nezaslouží."
 pilgrimage.2101.t: "$pilgrimage_header$ Intimní touhy"
 pilgrimage.2101.desc: "Jak dlouho už je to od chvíle, kdy jsem naposledy cítil[Select_CString(ROOT.Char.IsFemale,'a na své kůži teplo jiného člověka',' na své kůži teplo jiného člověka')]? Tato pouť mě odvedla daleko od domova i od všeho pohodlí.\n\nAch, jak zoufale toužím po tělesných rozkoších..."
 pilgrimage.2101.desc.lust_vice: "\n\nVím, že [ROOT.Char.GetFaith.HighGodName] považuje tuto touhu za hřích! Proč jsem však vystaven[Select_CString(ROOT.Char.IsFemale,'a tak těžké zkoušce',' tak těžké zkoušce')]? Copak má pouť nestačí jako důkaz oddanosti?"
 pilgrimage.2101.desc.lust_virtue: "\n\nTohle musí být další zkouška a [ROOT.Char.GetFaith.HighGodName] sleduje, zda obstojím! Dokážu během pouti zůstat [Select_CString(ROOT.Char.IsFemale,'ctnostná','ctnostný')] a nepadnout za oběť možným nepřátelům víry?"
 pilgrimage.2101.desc.lust_neutral: "Tohle neodbytné nutkání mě začíná rozčilovat a musím se ho zbavit! Samozřejmě to ale není bez rizika. Jsem v cizí zemi a někdo by mohl mé chvilkové slabosti využít."
 pilgrimage.2101.a: "Jen jediná noc útěchy..."
 pilgrimage.2101.b: "Proč se omezovat na #EMP jeden#! nevěstinec?"
 pilgrimage.2101.c: "Musím se soustředit na pouť!"
 pilgrimage.2501.t: "$pilgrimage_header$ Ubohý žebrák"
 pilgrimage.2501.desc.opening: "Když můj doprovod prochází malým městem, ucítím zatažení za lem oděvu. Otočím se a spatřím [Select_CString(beggar.IsFemale,'hubenou, otrhanou ženu','hubeného, otrhaného muže')], jak ke mně vzhlíží.\n\n„Prosím, [ROOT.Char.GetLadyLord], nemáš pár mincí pro ubohého žebráka? Umírám hlady a nikdo z místních mi nechce pomoci.“"
 pilgrimage.2501.desc.virtue.generous: "\n\nŠtědrost mi sice není vlastní, ale pouť mi připomíná, že od všech zbožných [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] se očekává dobročinnost..."
 pilgrimage.2501.desc.virtue.compassionate: "\n\nOsud tohoto žebráka mě sice nechává chladným, ale pouť mi připomíná, že od všech zbožných [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] se očekává soucit s méně šťastnými..."
 pilgrimage.2501.desc.sin.generous: "\n\nAť už ten nebožák vypadá sebeubožeji, připomenu si, že [ROOT.Char.GetFaith.PantheonTerm] považuje dobročinnost za těžký [ROOT.Char.Custom('GetSinMisdeed')]..."
 pilgrimage.2501.a.virtue: "Ať je [ROOT.Char.GetFaith.HighGodName] svědkem mého milosrdenství. Vezmi si ty mince..."
 pilgrimage.2501.a.sin: "Nedokážu říct ne!"
 pilgrimage.2501.b: "Pche! Najdi si pořádnou práci a vydělej si na živobytí!"
 pilgrimage.2501.c.arrogant: "Jak se opovažuješ sahat na mé šaty, sedláku!?"
 pilgrimage.2502.t: "$pilgrimage.2501.t$"
 pilgrimage.2502.desc.gave: "„Ano! Ano, děkuji, [ROOT.Char.Custom('LadyLordWomanMan')], děkuji... a také... [ROOT.Char.GetFaith.HighGodName], že ano? Tak děkuji i za to! Ale, ó štědrý [ROOT.Char.Custom('LadyLordWomanMan')], mohl bych tě požádat ještě o jednu laskavost?“"
 pilgrimage.2502.desc.refused: "„Ne! Ne, [ROOT.Char.Custom('LadyLordWomanMan')], prosím, slituj se!“"
 pilgrimage.2502.desc.end: "Má sestra je nemocná a zoufale potřebuje léky! Tvé peníze by jí mohly zachránit život, prosím! Byli bychom ti nesmírně vděční!“"
 pilgrimage.2502.a: "Ehm... ano. Dobře. Na ty léky."
 pilgrimage.2502.b: "Ne, nemůžu! Tohle přece #EMP není správné#!!"
 pilgrimage.2502.c.gave: "Ne, svůj díl už jsem udělal[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 pilgrimage.2502.c.refused: "Řekl[Select_CString(ROOT.Char.IsFemale,'a jsem',' jsem')] #EMP ne#!! A teď zmiz!"
 pilgrimage.2503.t: "$pilgrimage.2501.t$"
 pilgrimage.2503.desc: "„Nádhera! Kéž se ze své nemoci brzy zotaví. Ale mohl bych tě požádat ještě o jedinou laskavost? Má sestra má děti a... však víš, jaké děti jsou. Tolik toho snědí! Nemohl[Select_CString(ROOT.Char.IsFemale,'a bys',' bys')] jim obstarat i trochu jídla...?“"
 pilgrimage.2503.a: "Dobře. Ano. Žádné dítě by nemělo hladovět."
 pilgrimage.2503.b: "Myslím, že už jsem dal[Select_CString(ROOT.Char.IsFemale,'a dost',' dost')]."
 pilgrimage.2504.t: "$pilgrimage.2501.t$"
 pilgrimage.2504.desc: "Mnohokrát, mnohokrát ti děkuji, [ROOT.Char.Custom('LadyLordWomanMan')]! Budu ti navždy vděčný, protože ti dlužím něco, co nikdy nedokážu splatit!\n\nBožská štědrost je vskutku veliká! [ROOT.Char.GetFaith.HighGodName] bude předmětem mých chval až do konce mých dnů!"
 pilgrimage.2504.a: "Zapomněl[Select_CString(ROOT.Char.IsFemale,'a','')] jsi, že jsem dal[Select_CString(ROOT.Char.IsFemale,'a i tohle',' i tohle')]."
 pilgrimage.2504.a.flavor: "To nejlepší tu přece nenecháš?"
 pilgrimage.2504.b: "Říkáš, že mi něco dlužíš? Hmm..."
 pilgrimage.2504.c.virtue: "Není zač. Teď běž. [ROOT.Char.GetFaith.HighGodName] ti žehná."
 pilgrimage.2504.c.sin: "Ano, ano, jen už prosím... běž."
 pilgrimage.2511.t: "$pilgrimage_header$ Drzé panstvo"
 pilgrimage.2511.desc.start: "[ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] přitahuje poutníky z celého [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] světa, takže není nijak nepravděpodobné, že na cestě narazím na [lordling.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n#EMP Neuvěřitelné#! je však to, s jakou drzostí se ke mně [lordling.GetFirstNameNoTooltip] zachoval[Select_CString(lordling.IsFemale,'a','')]. [Select_CString(lordling.IsFemale,'Na koni mi vjela před doprovod a nazvala mě','Na koni mi vjel před doprovod a nazval mě')] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('lordling'))]... a ještě #EMP přímo do očí#!!"
 pilgrimage.2511.desc.wrathful: "\n\nKrev se ve mně vaří a na uzdě mě drží jen vědomí, že [ROOT.Char.GetFaith.PriestNeuterPlural] nás učí zdrženlivosti a varují před tím, abychom se nechali ovládnout emocemi."
 pilgrimage.2511.desc.vengeful: "\n\nV takových chvílích si připomínám, že [ROOT.Char.GetFaith.PantheonTerm] nám přikazuje odpouštět těm, kteří nám ublížili."
 pilgrimage.2511.desc.vengeful.christian: "\n\nV takových chvílích si připomínám Ježíšův příkaz nastavit druhou tvář..."
 pilgrimage.2511.a: "K čertu se vším, tomu spratkovi dám lekci!"
 pilgrimage.2511.b: "Nádech... výdech..."
 pilgrimage.2511.c: "Musí přece existovat #EMP lepší#! způsob, jak se s tím hněvem vypořádat."
 pilgrimage.3001.t: "$pilgrimage_header$ [ROOT.Char.GetFaith.WaterGodName] pláče"
 pilgrimage.3001.desc: "Ani během pouti kněží nevynechávají nedělní mši. Když není poblíž žádný kostel, koná se pod širým nebem, ale dnes časně ráno se přihnala bouře a od té chvíle nepolevila.\n\nHorlivý [ROOT.Char.Custom('DefaultPriestTitle')] se nenechá odradit a stojí v lijáku, kde káže o vytrvalosti tváří v tvář nepřízni osudu. Navzdory tomu se však zástup posluchačů [zealous_priest.GetFirstNameNoTooltip] rychle tenčí, protože promoklí věřící hledají úkryt před přívalovým deštěm."
 pilgrimage.3001.a: "Co je trocha deště pro věrného [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]?"
 pilgrimage.3001.a.tt: "$pilgrimage.2008.a.tt$"
 pilgrimage.3001.b: "Na tohle šílenství zapomeňte, budu ve svém stanu."
 pilgrimage.3002.t: "$pilgrimage_header$ Adamova nevinnost"
 pilgrimage.3002.desc: "Když se můj doprovod připravuje ke zrušení tábora, všimnu si nedaleko obrovského rozruchu. Na veliký kámen vystoupil[Select_CString(naked_preacher.IsFemale,'a nahá žena',' nahý muž')] a káže shromážděnému davu.\n\n„Prvotní hřích stále poskvrňuje naše duše, přátelé, ale nemusí tomu tak být! Odložíme-li své šaty, můžeme znovu získat ztracenou nevinnost Adama a Evy... a pak, #EMP jedině pak#!, se nás Duch svatý dotkne a ukáže nám pravou Boží lásku!“"
 pilgrimage.3002.a: "[naked_preacher.GetFirstNameNoTooltip|U] má pravdu! Nikdy jsem se necítil[Select_CString(ROOT.Char.IsFemale,'a tak blízko božství',' tak blízko božství')]. [ROOT.Char.GetFaith.HighGodName] je mi nablízku!"
 pilgrimage.3002.b: "Kacíř[Select_CString(naked_preacher.IsFemale,'ko','i')]! Sundejte [Select_CString(naked_preacher.IsFemale,'ji','ho')] dolů!"
 pilgrimage.3002.c: "Vyzvu [naked_preacher.GetFirstNameNoTooltip] k teologické disputaci."
 pilgrimage.3002.c.success: "Přesvědčíš kazatele o pošetilosti jeho učení"
 pilgrimage.3002.c.success.tt: "Rozhodneš, co bude následovat"
 pilgrimage.3002.c.failure: "Nedokážeš vyvrátit kazatelovy argumenty"
 pilgrimage.3002.d: "Ignoruji [naked_preacher.GetFirstNameNoTooltip] a pokračuji v cestě."
 pilgrimage.3003.t: "$pilgrimage_header$ Adamova vina"
 pilgrimage.3003.desc: "Po porážce v teologické disputaci [naked_preacher.GetFirstNameNoTooltip] sleze z kamene a teď přede mnou stojí [Select_CString(naked_preacher.IsFemale,'nahá a zaskočená','nahý a zaskočený')] tím, jak se situace vyvinula.\n\n„... Opravdu jsem [Select_CString(naked_preacher.IsFemale,'věřila, že klíčem jsou šaty','věřil, že klíčem jsou šaty')],“ zašeptá sklíčeně. „Tvůj pohled mi však skutečně otevřel oči.“\n\n[naked_preacher.GetFirstNameNoTooltip|U] zamrká a náhle si znovu uvědomí přihlížející dav i vlastní nahotu, ale snaží se zachovat důstojnost. „Co mám tedy dělat teď...?“"
 pilgrimage.3003.a: "Tohle si obleč a přidej se k nám na cestu do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 pilgrimage.3003.a.flavor: "Podáš [naked_preacher.GetFirstNameNoTooltip] nějaké oblečení."
 pilgrimage.3003.b: "Jdi a šiř #EMP správné#! učení."
 pilgrimage.3004.t: "$pilgrimage_header$ Konec se blíží"
 pilgrimage.3004.desc: "Když můj doprovod prochází malým městem, všimnu si davu lidí zaplňujícího tržiště. Uprostřed stojí na převráceném vozíku s rybami [Select_CString(doomsayer.IsFemale,'jakási žena','jakýsi muž')] a zběsile křičí na každého, kdo je ochoten naslouchat.\n\n„Soudný den se blíží! Čiňte pokání! Čiňte pokání, říkám, jinak budete navěky zatraceni!“\n\nZnepokojení měšťané si mezi sebou nervózně šeptají, vyděšení slovy tohoto proroka zkázy."
 pilgrimage.3004.a: "„De die autem illa et hora nemo scit!“"
 pilgrimage.3004.a.flavor: "Bible hovoří jasně: nikdo neví, kdy ten den přijde!"
 pilgrimage.3004.b: "Ještě že je součástí této pouti i odpustek!"
 pilgrimage.3004.c: "[doomsayer.GetFirstNameNoTooltip] #EMP není#! žádný kněz! Strhněte [Select_CString(doomsayer.IsFemale,'ji','ho')] dolů!"
 pilgrimage.3102.t: "$pilgrimage_header$ Zijára"
 pilgrimage.3102.desc: "Zatímco hadždž je povinností každého muslima, poutě na jiná místa jsou mnohem méně obvyklé. Islámská nauka tyto zijáry nevyžaduje, a muslimové, kteří se pro ně rozhodnou, tak mohou činit z nejrůznějších důvodů.\n\nKdyž putujeme po cestě do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], přistihnu se při úvahách nad tím, co mě vlastně přimělo vydat se právě na tuto cestu..."
 pilgrimage.3102.a: "Chci spatřit celé nádherné Alláhovo stvoření."
 pilgrimage.3102.b: "Má horlivost plane tak silně, že mi samotná hadždž nestačí."
 pilgrimage.3102.c: "Pochybnosti, které ve mně hlodají, mě nutí hledat odpovědi ve vzdálených zemích."
 pilgrimage.3201.t: "$pilgrimage_header$ Rituální očista"
 pilgrimage.3201.desc: "Rituální očista je zásadní součástí cesty každého hinduistického poutníka. Jednou z běžných podob je omytí ve vodách posvátné řeky.\n\nJedno takové místo leží přímo před námi, ale nemohu si nevšimnout, že je #EMP plné#! prostých lidí, kteří se také vydali na pouť..."
 pilgrimage.3201.a: "Připojím se k ostatním věřícím v posvátných vodách."
 pilgrimage.3201.b: "S #EMP poddanými#! se koupat nebudu!"
 pilgrimage.3202.t: "$pilgrimage_header$ Posvátnost lesa"
 pilgrimage.3202.desc.hinduism: "Sedm svatých měst sice patří mezi nejposvátnější místa, ale i samotná divočina má svůj vlastní druh posvátnosti. "
 pilgrimage.3202.desc.buddhism: "Gautama Buddha nás učil, že všechen život je posvátný. Vnímající bytosti jsou sice nejvyšší formou života, ale i to nejmenší stéblo trávy si zaslouží úctu."
 pilgrimage.3202.desc.jainism: "Ahiṃsā neboli nenásilí je jedním ze základních přikázání džinismu. Zakázáno je dokonce i násilí vůči rostlinám, s výjimkou nezbytného minima nutného k zachování života."
 pilgrimage.3202.desc.nature: "Lidská pýcha přivedla mnohé k přesvědčení, že stojí nad přírodou, ale mýlí se. Přírodní svět existuje v té nejpravdivější a nejčistší podobě bytí."
 pilgrimage.3202.desc.end: "\n\nKdyž procházíme obyčejnou lesní mýtinou, náhle mě zasáhne její klid a ticho. Žádný boj, žádný svár... jen prostý mír, který sdílejí stromy a keře."
 pilgrimage.3202.a: "Zůstaňme tu chvíli a rozjímejme nad vesmírem."
 pilgrimage.3202.a.tt: "Tvá [THIS.Char.GetInvolvedActivity.GetName] bude #N zpožděna o několik měsíců#!"
 pilgrimage.3202.b: "Pospěšte si, pokračujme!"
 pilgrimage.3202.b.tt: "Do cíle dorazíš #P o několik týdnů dříve#!"
 pilgrimage.3301.t: "$pilgrimage_header$ Kritický bhikkhu"
 pilgrimage.3301.desc: "Podél poutní cesty potkávám mnoho asketických poutníků, kteří opustili světský život a oprostili se od všech pozemských pout.\n\nDnes si můj doprovod měří pohledem postarší poutník, který kráčí vedle mě. „Bereš si s sebou příliš mnoho. Chceš-li dosáhnout osvícení, musíš odhodit světský majetek stejně jako já a cestovat jen v prostém rouchu.“"
 pilgrimage.3301.a: "To alespoň po dobu této cesty zvládnu."
 pilgrimage.3301.b: "Ale můj stan, mé přikrývky? To je příliš. Nejsem připraven[Select_CString(ROOT.Char.IsFemale,'á','')]!"
 pilgrimage.3301.c: "Ach, ale aby [ROOT.Char.GetTitleAsNameNoTooltip] cestoval[Select_CString(ROOT.Char.IsFemale,'a','')] v takové odříkavosti, to by odporovalo Ṛtě."
 pilgrimage.3302.t: "$pilgrimage_header$ Kozí moudrost"
 pilgrimage.3302.desc: "Když jsme poprvé vstoupili do divokého [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] v [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier], myslel[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si, že průchod průsmykem bude snadný. Po hodinách namáhavého stoupání si však připomínám, že zkoušky své játry bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] vítat.\n\nZastavím se, abych si otřel[Select_CString(ROOT.Char.IsFemale,'a','')] pot z čela, a upoutá mě pohled na divoké kozy stojící na téměř svislém svahu [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')].\n\nMístní [Select_CString(mountain_local.IsFemale,'stařena','stařec')] se ke mně otočí.\n\n„Ty chamtivé kozy šplhají nahoru jen proto, aby mohly lízat sůl.“"
 pilgrimage.3302.a: "Měly by se vzdát honby za uspokojením!"
 pilgrimage.3302.b: "Kéž bych ve svém výstupu dokázal[Select_CString(ROOT.Char.IsFemale,'a','')] být stejně neochvějný[Select_CString(ROOT.Char.IsFemale,'á','')]..."
 pilgrimage.3302.c: "Ta sůl by měla být moje!"
 pilgrimage.3302.c.flavor: "Nasbíráš sůl určenou k prodeji."
 pilgrimage.3303.t: "$pilgrimage_header$ Sútra z [place_to_teach.GetBaronyNameExplicitlyNoTooltip]"
 pilgrimage.3303.desc: "Když procházíme [place_to_teach.GetBaronyNameExplicitlyNoTooltip], přistoupí ke mně několik zmateně vyhlížejících místních vedených [wisdom_seeker.GetName].\n\n„Ctihodný [ROOT.Char.GetTitleAsName], [place_to_teach.GetBaronyNameExplicitlyNoTooltip] navštěvují [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural]. Vychvalují ctnosti svého učení, zatímco na přesvědčení ostatních se vrhají jako [ROOT.Char.Custom('RegionalOnlyFerociousAnimalPlural')] a trhají je na kusy. Pak přijdou jiní [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] a ti zase opovrhují učením předchozí skupiny a hanobí je.\n\nZmítá námi nejistota a pochybnosti nám každý den klepou na dveře. Kteří z těchto ctihodných [place_to_teach.GetCounty.GetFaith.PriestNeuterPlural] mluvili pravdu a kteří lhali?“"
 pilgrimage.3303.a: "Následujte nikoli klamné úvahy, ale pravou cestu. [ROOT.Char.GetFaith.HighGodName] vám ji ukáže!"
 pilgrimage.3303.b: "Ze všech pramenů, z nichž pijete, který vám dodává sílu?"
 pilgrimage.3303.b.flavor: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] časem nalezne správný způsob uvažování."
 pilgrimage.3401.t: "$pilgrimage_header$ Zkouška brahmačarji"
 pilgrimage.3401.desc: "Naše játra nás zavedla ke břehu [body_of_water.GetName]. V pozdním odpoledním slunci se hladina třpytí jako úlomky zlatých lístků a láká nás ke koupeli.\n\nMůj pohled sklouzne k jednomu ze spolupoutníků, [bather.GetName]. [Select_CString(bather.IsFemale,'Její nahé tělo halí jen mihotavá záře vody.','Jeho nahé tělo halí jen mihotavá záře vody.')]\n\nBěhem [ROOT.Char.GetInvolvedActivity.GetShortName] by měl člověk přijmout téměř mnišskou [Glossary('brahmačarju', 'BRAHMACHARAYA_GLOSS')] a zdržet se chtivých myšlenek a tužeb..."
 pilgrimage.3401.a: "Nechám se vést touhou a ponořím se do krásy [bather.GetFirstNamePossessiveNoTooltip]."
 pilgrimage.3401.b: "Vstoupím do chladné vody a nechám své vášně vyhasnout."
 pilgrimage.3401.b.flavor: "O krok blíže k nirváně."
 BRAHMACHARAYA_GLOSS: "Sanskritský výraz znamenající „následování Brahmanova způsobu života“ neboli způsob života podporující hledání posvátného poznání a duchovního osvobození. Součástí této praxe je úsilí dosáhnout stavu oproštěného od tužeb."
 pilgrimage.3101.t: "Ihrám"
 pilgrimage.3101.desc: "Když se blížím k Mekce, ocitám se před míkátem, hranicí oddělující posvátný prostor Mekky od okolního světa.\n\nOd této chvíle musím vstoupit do stavu ihrámu, podstoupit rituální očistu a obléci pouze předepsaný oděv. Musím se také zdržet sexuálních styků, nadávek a pyšných či hrubých myšlenek."
 pilgrimage.3101.a: "Přijmu ihrám s naprostou oddaností."
 pilgrimage.3101.b: "Ehm... když trochu polevím, nikdo se to přece nedozví."
 pilgrimage.4001.t: "Příchod"
 pilgrimage.4001.desc: "Konečně jsem zde, tělem i duší, u velkolepého [ROOT.Char.GetFaith.HouseOfWorship] v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nKdyž mi [ROOT.Char.GetFaith.BishopNeuter] uděluje požehnání, přemýšlím o všem, co se muselo stát, aby mě [ROOT.Char.GetFaith.PantheonTerm] přivedl právě sem, do tohoto okamžiku."
 pilgrimage.4001.cynical_end: "\n\nA tolik chůze."
 pilgrimage.4001.a: "[Select_CString(ROOT.Char.IsFemale,'Prošla jsem posvátnou cestu.','Prošel jsem posvátnou cestu.')]"
 pilgrimage.4001.a_dead: "[Select_CString(ROOT.Char.IsFemale,'Prošly jsme posvátnou cestu.','Prošli jsme posvátnou cestu.')]"
 pilgrimage.4001.a_cynical: "Hlavní je, že mě tu vidí a slyší."
 pilgrimage.4002.desc: "Konečně jsem zde, tělem i duší, na konci své velké pouti. A kdo mě tu nečeká? [2010_mystic.GetTitledFirstName], [Select_CString(2010_mystic.IsFemale,'hledačka','hledač')] pravého poznání božství!\n\n„Rozhlédni se kolem sebe, [ROOT.Char.GetFirstNameNoTooltip]!“ řekne [2010_mystic.GetFirstNameNoTooltip]. „Není tahle nádhera přesně taková, jak jsem říkal[Select_CString(2010_mystic.IsFemale,'a','')]?“"
 pilgrimage.4002.a: "Vskutku, příteli!"
 pilgrimage.4002.a_cynical: "Je to... rozhodně něco."
 pilgrimage.4002.b: "Ach ano, tohle se mi opravdu líbí."
 pilgrimage.4010.t: "Už jsem tu byl"
 pilgrimage.4010.desc: "Po všem tom spěchu a pobízení doprovodu jsme konečně dorazili do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\nNechci se tu zbytečně zdržovat, a tak mě místní služebnictvo ihned po splnění posvátných povinností v rámci [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] informuje, že vše je připraveno k cestě zpět."
 pilgrimage.4010.a: "Já... změnil[Select_CString(ROOT.Char.IsFemale,'a jsem názor. Tohle není správné.',' jsem názor. Tohle není správné.')]"
 pilgrimage.4010.a.flavor: "Teď se otočit zpět by bylo svatokrádežné!"
 pilgrimage.4010.a.tt: "Prozkoumáš cíl a zůstaneš v [THIS.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] obvyklou dobu\n$EFFECT_LIST_BULLET$Závěr a odměny tvé aktivity [THIS.Char.GetInvolvedActivity.GetName] budou stále negativně ovlivněny"
 pilgrimage.4010.b: "Ano. Vydejme se do [ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetNameNoTooltip]."
 pilgrimage.4010.b.flavor: "Tak už pojďme..."
 pilgrimage.4010.b.tt: "Tvá [THIS.Char.GetInvolvedActivity.GetName] skončí a okamžitě se vydáš na cestu zpět"
 pilgrimage.4020.t: "Memento mori"
 pilgrimage.4020.desc.intro: "Jakmile dorazíme do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], začnu zařizovat pohřební obřad pro"
 pilgrimage.4020.desc.relation_family_liked: " [Select_CString(old_pilgrimage_host.IsFemale,'mou drahou zesnulou','mého drahého zesnulého')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))].\n\n"
 pilgrimage.4020.desc.relation_liked: " [Select_CString(old_pilgrimage_host.IsFemale,'mou drahou','mého drahého')] [old_pilgrimage_host.GetFirstName].\n\n"
 pilgrimage.4020.desc.relation_family: " [Select_CString(old_pilgrimage_host.IsFemale,'mou zesnulou','mého zesnulého')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))].\n\n"
 pilgrimage.4020.desc.relation_neutral: " [old_pilgrimage_host.GetTitledFirstName].\n\n"
 pilgrimage.4020.desc.liked: "Jen stěží zachovávám klid, když hledám někoho z [ROOT.Char.GetFaith.AltPriestTermPlural], kdo nám pomůže s tímto posledním rozloučením.\n\nNakonec nacházím trochu útěchy ve vědomí, že jsme dorazili do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] a [old_pilgrimage_host.GetFirstName] zde bude navždy odpočívat na tomto posvátném místě. [ROOT.Char.GetFaith.HighGodNameAlternate] je nyní blíž."
 pilgrimage.4020.desc.neutral: "Průvod je klidný a důstojný a místní [ROOT.Char.GetFaith.AltPriestTermPlural] mě ujišťují, že [old_pilgrimage_host.GetFirstName] je nyní na lepším místě, když [Select_CString(old_pilgrimage_host.IsFemale,'byla uložena','byl uložen')] k odpočinku zde v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. [ROOT.Char.GetFaith.HighGodName] je nyní blíž."
 pilgrimage.4020.a: "Bylo to správné rozhodnutí."
 pilgrimage.4020.a.flavor: "Ať nyní [old_pilgrimage_host.GetFirstName] odpočívá v pokoji."
 pilgrimage.5001.t: "Všechny cesty vedou do Říma"
 pilgrimage.5001.desc: "Do Říma proudí poutníci z celého křesťanského světa. Někteří následují Via Francigena, jiní se vydávají méně známými cestami. Nakonec se však všichni setkáváme zde, v bazilice svatého Petra, kde byl tento velký muž sám uložen k odpočinku.\n\nKdyž tu stojím mezi ostatními poutníky, cítím slavnostní jednotu a sounáležitost všech shromážděných, kteří během své cesty překonali nejrůznější zkoušky a strasti."
 pilgrimage.5011.t: "Ó Jeruzaléme, Jeruzaléme!"
 pilgrimage.5011.desc.beginning: "Žádné jiné město na světě nemá takovou historii jako Jeruzalém. Kromě mnoha dalších svatých míst se zde nachází "
 pilgrimage.5011.desc.christian: "Chrám Božího hrobu, vystavěný nad místy, kde byl Ježíš ukřižován, pohřben a vzkříšen."
 pilgrimage.5011.desc.muslim: "Haram aš-Šaríf, místo, odkud Mohamed po svém pozemském životě vystoupil do nebe."
 pilgrimage.5011.desc.jewish: "Chrámová hora, místo někdejší Svatyně svatých, kde má podle proroctví jednoho dne povstat Třetí chrám."
 pilgrimage.5011.desc.end: "\n\nKdyž stojím před Chrámovou horou s rukou položenou na Západní zdi, přemýšlím o všem, co mě na cestě do tohoto legendárního města potkalo."
 pilgrimage.5021.t: "Město touhy světa!"
 pilgrimage.5021.desc: "Konečně stojím na pahorcích před Konstantinopolí, zářivým klenotem civilizace, v němž stále zní ozvěna slávy Římské říše. Je to vskutku úchvatný pohled!\n\nNedaleko středu města spatřím Hagiu Sofii, velkolepé centrum bohoslužeb, často považované za vrchol byzantské architektury.\n\nZdaleka však není jediným zdejším divem. Když hledím na celé město, žasnu nad nádherou stvořeného světa. [ROOT.Char.GetFaith.CreatorName] vytvořil něco vskutku velkolepého."
 pilgrimage.5031.t: "Alexandrie!"
 pilgrimage.5031.desc: "Konečně jsem dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do Alexandrie, kolébky křesťanského mnišství. První mniši a poustevníci se vydávali na své duchovní cesty v pouštních jeskyních kolem města, které jsou využívány dodnes.\n\nAlexandrie sice není tak proslulá jako Jeruzalém či Řím, přesto má dlouhou historii jako centrum teologie a vzdělanosti. Ani po staletích islámské vlády zdejší křesťanské komunity svou víru neztratily."
 pilgrimage.5101.t: "Sinaj a Choréb"
 pilgrimage.5101.desc: "[ROOT.Char.GetFaith.HighGodName] poprvé promluvil k Mojžíšovi na hoře Sinaj v podobě hořícího keře. Později mu na téže hoře předal Desatero přikázání, které se stalo základem veškerého abrahámovského učení.\n\nNení pochyb, že [ROOT.Char.GetFaith.HighGodName] má toto místo v oblibě. Když stojím na těchto posvátných svazích, přemýšlím, zda se na mě právě teď dívá..."
 pilgrimage.5201.t: "Hidžra"
 pilgrimage.5201.desc: "Mohamed nebyl vždy milován a v nejranějších dobách islámu jej i jeho učení mnozí odmítali.\n\nKdyž byl varován před plánovaným atentátem, opustil Mekku a vydal se do Jathribu, kde jej s otevřenou náručí přivítala rostoucí muslimská komunita. Tato cesta se stala známou jako hidžra a Mohamed ve svém novém domově dokázal sjednotit znepřátelené kmeny v podřízenosti Alláhovi.\n\nJathrib byl na počest této události později přejmenován na Medínu, město Prorokovo. A nyní jsem zde i já, připraven[Select_CString(ROOT.Char.IsFemale,'a','')] vzdát jeho cestě úctu."
 pilgrimage.5301.t: "Váránasí"
 pilgrimage.5301.desc: "Konečně jsem dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do Váránasí. Toto velkolepé město, které podle tradice založil v dávných časech bůh Šiva, přitahuje poutníky zblízka i zdaleka.\n\nNeputují sem však jen hinduisté. Nedaleko města se totiž nachází místo, kde Gautama Buddha poprvé učil své žáky.\n\nKdyž na vlastní oči vidím toto setkávání věřících a poznání i diskuse, které z něj pramení, znovu si uvědomuji, že tento svět sdílíme všichni společně."
 pilgrimage.5311.t: "Ajódhja"
 pilgrimage.5311.desc: "Po dlouhé cestě jsem konečně dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do Ajódhji, rodiště boha Rámy a dějiště velkého eposu Rámájana. Ráma je vtělením Višnua a jeho narození i život jsou považovány za zářný příklad dharmy uvedené v praxi.\n\nRámájana inspirovala celé generace hinduistů a při návštěvě místa jejího děje přemýšlím, jakou stopu jednou zanechá v dějinách můj vlastní odkaz..."
 pilgrimage.5321.t: "Mathura"
 pilgrimage.5321.desc: "Konečně jsem dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do svého cíle, Mathury. Právě zde se narodil bůh Kršna, božstvo soucitu, lásky a něhy.\n\nKdyž se rozhlédnu kolem sebe, všechny tyto vlastnosti vidím v poutnících, kteří sem proudí, aby uctívali v chrámovém komplexu Kršna Džanmásthán, jednom z nejvelkolepějších děl náboženské architektury, jaká kdy byla vystavěna."
 pilgrimage.5331.t: "Haridvár"
 pilgrimage.5331.desc: "Po dlouhé cestě jsem konečně dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do Haridváru u posvátné řeky Gangy.\n\nMěsto vzniklo na místě, kde podle tradice samotná bohyně Ganga sestoupila na zem poté, co Pán Šiva vypustil mohutnou řeku ze svých vlasů.\n\nJejí vody jsou proslulé schopností smývat hříchy a poutníci z celého světa sem přicházejí, aby se v nich vykoupali. Nyní se k nim přidám i já."
 pilgrimage.5341.t: "Káňčipuram"
 pilgrimage.5341.desc: "Po dlouhé cestě jsem konečně dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do Káňčipuramu, domova chrámu Kámákší Amman.\n\nTento chrám zasvěcený bohyni Matce je znám jako místo míru a prosperity a zůstává jedním ze sedmi nejsvětějších míst hinduismu. "
 pilgrimage.5351.t: "Udždžain"
 pilgrimage.5351.desc: "Po příchodu do starobylého města Udždžain se vydávám k Mahákáléšvar džjótirlinze.\n\nMěsto je zasvěceno Pánu Šivovi v jeho podobě Mahákáléšvary a po dlouhá staletí slouží jako poutní i správní centrum. Vyrostla zde proto rušná metropole pulzující životem věřících.\n\nKdyž dorazím k velkému chrámu, požádám [ROOT.Char.GetFaith.BishopNeuter] o požehnání a očistím svou duši od hříchů."
 pilgrimage.5361.t: "Dvárka"
 pilgrimage.5361.desc: "Konečně stojím na prahu Brány, Dvárky, jednoho z nejvýznamnějších míst hinduismu.\n\nPodle legendy Kršna, vtělení Višnua, vyrval samotnému moři rozsáhlé území, aby zde mohlo být město vystavěno. Od té doby se Dvárka značně rozrostla a stala se náboženským i hospodářským centrem, které přitahuje poutníky ze všech koutů světa... a nyní i mě."
 pilgrimage.5401.t: "Bódhgaja"
 pilgrimage.5401.desc: "Dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem do Bódhgaji, nejsvětějšího místa buddhistického světa. Právě zde pod stromem bódhi dosáhl osvícení [ROOT.Char.GetFaith.HighGodName].\n\nKolem posvátného stromu byl později vystavěn velkolepý chrám Mahábódhi a poutníci z celého světa sem přicházejí, aby poznali příběh této cesty a oslavili život, který [ROOT.Char.GetFaith.HighGodName] vedl."
 pilgrimage.5411.t: "Kušinagar"
 pilgrimage.5411.desc: "Konečně jsem dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do Kušinagaru, kde podle tradice [ROOT.Char.GetFaith.HighGodName] opustil tento smrtelný svět.\n\nOsvícení bylo dosaženo již za života, a proto není tato smrt důvodem k pouhému smutku. [ROOT.Char.GetFaith.HighGodName] po smrti dosáhl parinirvány a vymanil se z pout znovuzrození. Tato mókša neboli osvobození je konečným cílem každého zbožného buddhisty."
 pilgrimage.5421.t: "Sárnáth"
 pilgrimage.5421.desc: "Má cesta mě konečně přivedla do Sárnáthu, kde [ROOT.Char.GetFaith.HighGodName] poprvé vyložil svým následovníkům čtyři vznešené pravdy a učení, které z nich vychází.\n\nPrávě zde vznikla první buddhistická škola a toto místo dodnes přitahuje poutníky z celého světa."
 pilgrimage.5445.t: "Parikrama"
 pilgrimage.5445.desc: "Obdivuji majestátní krajinu [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] v [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier] a přecházím k další části své [Glossary('játry', 'YATRA_GLOSS')]. Prostřednictvím [Glossary('púdži', 'PUJA_GLOSS')] vyjadřuji svou oddanou úctu a [ROOT.Char.GetFaith.HighGodName] přijímá mé uctívání. Poté se připojím k davu na cestě [Glossary('pradakšiny', 'PRADAKSHINA_GLOSS')] a obcházím svatyni po směru hodinových ručiček."
 pilgrimage.5445.a: "$pilgrimage.4001.a$"
 pilgrimage.5445.a_dead: "$pilgrimage.4001.a_dead$"
 pilgrimage.5445.a_cynical: "$pilgrimage.4001.a_cynical$"
 PUJA_GLOSS: "Púdža je projev úcty, uctívání a oddané pozornosti praktikovaný hinduisty a buddhisty."
 PRADAKSHINA_GLOSS: "Sanskrtský výraz znamenající „napravo“ označuje cestu, při níž se v hinduistických a buddhistických tradicích obchází svatyně po směru slunce. Tento obřad má zajistit příznivé znovuzrození."
 pilgrimage.5501.t: "Šikharží"
 pilgrimage.5501.desc: "Podle Nirvána Kándy dosáhlo na hoře Šikharží mókši dvacet ze čtyřiadvaceti džinistických tírthankarů. Díky tak slavné minulosti se toto místo stalo nejvýznamnějším poutním místem džinistické obce. Když můj pohled putuje od nejvyšších vrcholů až k nejnižším úbočím, přemýšlím nad vlastní cestou sem a nad tím, co znamená pro můj život."
 pilgrimage.5601.t: "Božské vědomí"
 pilgrimage.5601.desc: "Když stojím na svazích hory Uši-darena, rozprostírá se přede mnou výhled na krajinu hluboko pode mnou. Tváří v tvář této úchvatné scenérii nemohu nemyslet na to, jak zde Zarathuštra dosáhl osvícení a přijal poznání Ahura Mazdy, aby je šířil do světa pod horou. Stejně jako většina zdejších poutníků necítím žádnou božskou jiskru proroctví, a přesto nepřestávám žasnout nad tím, co se přede mnou rozprostírá."
 pilgrimage.5901.t: "Paderborn!"
 pilgrimage.5901.desc: "Hluboko v paderbornských lesích kdysi stával Irminsul, Velký sloup. Památník vztyčený na počest Ódina zničil Karel Veliký během saských válek, ale náš lid dodnes proudí na místo, kde kdysi stál, aby uctil jeho památku. Nyní mohu říci, že i já jsem vykonal[Select_CString(ROOT.Char.IsFemale,'a pouť k tomuto posvátnému místu',' pouť k tomuto posvátnému místu')]."
 pilgrimage.5911.t: "Pod širým modrým nebem"
 pilgrimage.5911.desc: "Celý svět je chrámem a [ROOT.Char.GetFaith.HighGodName] nad ním rozprostírá veliké modré nebe, nádhernější než strop jakékoli mešity či kostela. Zde na širých stepích [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] cítím obzvláštní blízkost [ROOT.Char.GetFaith.PantheonTerm] a přemýšlím nad cestou, která mě přivedla na toto posvátné místo."
 pilgrimage.5921.t: "Posvátné háje"
 pilgrimage.5921.desc: "Konečně jsem dorazil[Select_CString(ROOT.Char.IsFemale,'a','')] do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Někteří lidé uctívají v kostelech či mešitách, já však vím, že nejposvátnější místa leží pod širým nebem v lese, kde se bosých chodidel dotýká měkká, životodárná půda.\n\nZdejší starobylé háje vzbuzují mimořádnou úctu a mezi mohutnými stromy přemýšlím nad svým místem v přírodním světě."
 pilgrimage.6500.t: "Obdiv"
 pilgrimage.6500.desc: "[pilgrimage_member.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', pilgrimage_member)], se při cestě davem rozhlíží po rozlehlém svatém místě v [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier].\n\n„[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] je skutečně úchvatné místo! Setkávají se tu kultury a různé víry přicházejí společně uctívat své svátosti. Není požehnáním, že tu můžeme zakusit takovou blízkost a sounáležitost?“\n\n[pilgrimage_member.GetFirstNameNoTooltip|U] na mě očekávaně pohlédne."
 pilgrimage.6500.a: "#EMP Já vím!#! Užijme si to!"
 pilgrimage.6500.a.tt: "Tvá kultura nemá tradici [GetCultureTradition('tradition_xenophilic').GetName]"
 pilgrimage.6500.b: "Čeho všeho může duchovnost dosáhnout!"
 pilgrimage.6500.c: "Tohle místo vybudovali lidé, ne božstva."
 pilgrimage.6510.t: "Ztraceno v překladu"
 pilgrimage.6510.desc: "Když se procházím ulicemi [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], zastavím se před malým [ROOT.Char.GetFaith.HouseOfWorship]. Budova je ve srovnání s okolím prostá a nenápadná, ale před ní se shromáždila malá skupinka poutníků.\n\nKdyž přistoupím blíž, zjistím, že si lámou hlavu nad nápisem na desce vedle jedné ze strážních soch. Je totiž napsán cizím jazykem.\n\nTohle by mohla být příležitost prokázat ostatním poutníkům službu!"
 pilgrimage.6510.a: "#EMP Já#! vám to všem přeložím!"
 pilgrimage.6510.a.flavor: "Nemůžu uvěřit, že je na té desce #EMP pravopisná chyba!#!"
 pilgrimage.6510.b: "Co se na té desce vlastně píše...?"
 pilgrimage.6510.b_success.t: "Deska rozluštěna"
 pilgrimage.6510.b_success.desc: "Rozluštíš nápis na desce"
 pilgrimage.6510.b_failure.t: "Nesrozumitelná deska"
 pilgrimage.6510.b_failure.desc: "Nápis na desce zůstane záhadou"
 pilgrimage.6510.c: "Ech, za tu námahu to sotva stojí."
 pilgrimage.6520.t: "Brzy už domů?"
 pilgrimage.6520.desc: "[impatient_pilgrim.GetTitledFirstName] se loudá s naším poutním průvodem, hlasitě vzdychá a vleče nohy. „Připadá mi, že jsme tu celou věčnost. Není už načase vydat se zpátky domů?“ zamumlá netrpělivě.\n\nÚkosem pohlédnu na [impatient_pilgrim.GetFirstNameNoTooltip] a"
 pilgrimage.6520.desc_forgiving: " cítím trochu soucitu. Není žádná radost nechat se vláčet někam proti své vůli."
 pilgrimage.6520.desc_nonforgiving: " nemohu uvěřit té #EMP drzosti#!. Zatnu pěsti."
 pilgrimage.6520.a: "Jak #EMP se opovažuješ#! být tak drzý[Select_CString(impatient_pilgrim.IsFemale,'á','')]!"
 pilgrimage.6520.b: "Pojď, ukážu ti tamtu nádhernou sochu."
 pilgrimage.6520.c: "Chápu, co tím myslíš."
 pilgrimage.6530.t: "Nové zážitky"
 pilgrimage.6530.desc_intro: "Když se loudáme kolem stánků na tržišti v [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], někdo k nám přistoupí. "
 pilgrimage.6530.desc_adult: "Je to [Select_CString(local_guide.IsFemale,'podivná žena','podivný muž')]. Bez ostychu nás osloví:\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], vypadáš jako [Select_CString(ROOT.Char.IsFemale,'vznešená dáma','vznešený pán')]! Nedaleko [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] znám jeden naprosto #EMP božský#! zážitek, který by jistě zaujal každého oddaného poutníka!“"
 pilgrimage.6530.desc_child: "Je to malé dítě s velikýma, jasnýma očima. Vzhlédne k nám a vykřikne:\n\n„Znám tajné místo, kde žije [ROOT.Char.GetFaith.HighGodName]!“ [local_guide.GetFirstNameNoTooltip] se zatváří odhodlaně a pokračuje: „Můžu ti ho ukázat, jestli chceš?“"
 pilgrimage.6530.desc_warning: "\n\n[warning_character.GetTitledFirstName] po mé pravici se zamračí a nenápadně zavrtí hlavou. Varování?"
 pilgrimage.6530.desc_learned: "\n\nMapy mám prostudované a dobře vím, že na té straně [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] není nic než nebezpečná pustina."
 pilgrimage.6530.a: "To zní zajímavě."
 pilgrimage.6530.a_child.tt: "Následuješ dítě"
 pilgrimage.6530.divinity.desc: "[local_guide.GetShortUIName] ti ukáže skutečně božský zážitek"
 pilgrimage.6530.dangerous.desc: "Necháš se vlákat do nebezpečné situace"
 pilgrimage.6530.b: "[ROOT.Char.GetFaith.HighGodName] se jistě usměje i nad podvodníky."
 pilgrimage.6530.b_child: "Lhaní ti nesluší, dítě."
 pilgrimage.6530.b.flavor: "[local_guide.GetShortUIName] rychle zmizí."
 pilgrimage.6530.c: "Dej mi jediný důvod, proč tě nemám udat."
 pilgrimage.6530.c.flavor: "Za své hříchy platíme všichni."
 pilgrimage.6530.d: "Ty se snažíš podvést #EMP mě#!, sedláku?!"
 pilgrimage.6530.d.flavor: "Vybičuji z [local_guide.GetFirstNameNoTooltip] trochu upřímnosti!"
 pilgrimage.6530.e: "Ne, díky."
 pilgrimage.6531.t: "Skryté božství"
 pilgrimage.6531.desc_wellspring: "Daleko za [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] se náhle zastavíme. Náš průvodce [local_guide.GetTitledFirstName] nám ukáže skrytý průchod a ocitneme se v malé jeskyni, osvětlené denním světlem pronikajícím otvorem ve stropě.\n\nTýmž otvorem poklidně proudí skutečně pozoruhodný pramen. Tekoucí voda září božskou nádherou a vzduch kolem ní zbarvují jemné duhové odlesky v mlžném oparu."
 pilgrimage.6531.desc_crystal_cavern: "Právě když začínám pochybovat, zda vůbec někdy dorazíme, náš průvodce [local_guide.GetTitledFirstName] náhle prudce odbočí doleva a než se nadějeme, vstupujeme do jeskyně ukryté v krajině.\n\nNa naší výstroji se začne odrážet slabá záře, která postupně sílí, až vkročíme do rozlehlé jeskyně pokryté stovkami krystalů. Zachycují světlo pronikající otvorem ve stropě a celý doprovod, včetně mě, při tom pohledu oněmí úžasem."
 pilgrimage.6531.desc_non_cynical: "\n\nNikdy jsem necítil[Select_CString(ROOT.Char.IsFemale,'a','')] božskou přítomnost tak silně jako právě zde. [ROOT.Char.GetFaith.HighGodName] je mi nablízku."
 pilgrimage.6531.desc_cynical: "\n\nMusím uznat, že je to opravdu působivý výtvor přírody."
 pilgrimage.6531.a: "Jak neobyčejné!"
 pilgrimage.6532.t: "Kořist z poutníků!"
 pilgrimage.6532.desc: "Bezstarostné pískání našeho průvodce [local_guide.GetTitledFirstName] je poslední věc, kterou zaslechneme, než se zdánlivě odnikud objeví hrdlořezové. Jsme daleko za [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]. Byla to past a teď jsme odříznuti od jakékoli pomoci.\n\nSrdce mi buší, zatímco se snažím vymyslet, co udělat dál. Jak se opovažují přepadávat poutníky?"
 pilgrimage.6532.a: "[6532_protector.GetTitledFirstNameNoTooltip]! Postarej se o ně!"
 pilgrimage.6532.a_success.t: "Lotři zahnáni"
 pilgrimage.6532.a_success.desc: "[6532_protector.GetShortUIName] úspěšně zažene lotry"
 pilgrimage.6532.a_failure.t: "Zranění"
 pilgrimage.6532.a_failure.desc: "[6532_protector.GetShortUIName] utrpí v boji zranění"
 pilgrimage.6532.b: "#EMP [ROOT.Char.GetFaith.HighGodNameAlternate] vám přikazuje ustoupit!#!"
 pilgrimage.6532.c: "Tohle je posvátné místo! Copak se nebojíte božího soudu?!"
 pilgrimage.6532.c_success.t: "Lotři zahnáni"
 pilgrimage.6532.c_success.desc: "Úspěšně zaženeš lotry"
 pilgrimage.6532.c_failure.t: "Okradení"
 pilgrimage.6532.c_failure.desc: "Jsi okraden[Select_CString(ROOT.Char.IsFemale,'a','')]"
 pilgrimage.6533.t: "Zoufalá doba"
 pilgrimage.6533.desc: "Kdesi za [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] zabočíme za další roh a náš dětský průvodce [local_guide.GetTitledFirstName] se náhle zastaví. Drobné tělo se začne třást a zaslechnu potlačované popotahování, když se [local_guide.GetFirstNameNoTooltip] snaží skrýt pláč.\n\n„Já... omlouvám se, [ROOT.Char.GetLadyLord], donutili mě k tomu. Moje malá sestřička je nemocná a už několik dní jsme nic nejedli...“ [local_guide.GetFirstNameNoTooltip] se podívá stranou a velké jasné oči náhle naplní strach. „Měli bychom se vrátit,“ zašeptá opatrně."
 pilgrimage.6533.a: "Drahé dítě, tvá upřímnost mě hřeje u srdce."
 pilgrimage.6533.a.flavor: "Pomozme tomu ubohému dítěti."
 pilgrimage.6533.b: "Jak #EMP odporné#! jednání."
 pilgrimage.6533.b.flavor: "Spoluvina je také vina!"
 pilgrimage.6540.t: "Mohu ti nabídnout..."
 pilgrimage.6540.desc: "Když procházím ulicemi [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTier], upoutá mou pozornost zboží na místním trhu.\n\nJeden obchodník se na mě zazubí a prohlásí: „Já mám zboží, pokud má [ROOT.Char.GetLadyLord] mince!“\n\nTyto exotické předměty by doma mohly vynést pěkný zisk... nebo by možná stály za uchování jako dar."
 pilgrimage.6540.a: "Tohle vypadá jako rozumná investice!"
 pilgrimage.6540.a.flavor: "Tohle bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] snadno prodat za dvojnásobek."
 pilgrimage.6540.a.tt: "Koupíš exotické zboží"
 pilgrimage.6540.b: "Tohle zase vypadá zajímavě."
 pilgrimage.6540.b.flavor: "Tohle bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] snadno prodat za trojnásobek."
 pilgrimage.6540.c: "Světský majetek? Jak přízemní."
 pilgrimage.6750.t: "Pokání v [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 pilgrimage.6750.desc.intro: "Když vstoupím do [ROOT.Char.GetFaith.HouseOfWorship], přepadne mě zdrcující pocit viny. Světlo zalévající oltář jako za jasného letního dne je tak hutné, že mám pocit, jako bych se ho mohl[Select_CString(ROOT.Char.IsFemale,'a dotknout',' dotknout')].\n\nJaký život to vlastně vedu? Jaký [ROOT.Char.GetTitleAsNameNoTooltip] ze mě může být? Nebo [ROOT.Char.GetMotherFather]? Nebo [ROOT.Char.Custom('GetDaughterSon')]?\n\nPokud se nezměním a nepřestanu být tím, čím jsem — "
 pilgrimage.6750.desc.secret: "[repent_trait.GetNameNoTooltip]"
 pilgrimage.6750.desc.drunkard: "[GetTrait('drunkard').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.hashishiyah: "[GetTrait('hashishiyah').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.rakish: "[GetTrait('rakish').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.irritable: "[GetTrait('irritable').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.flagellant: "[GetTrait('flagellant').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.contrite: "[GetTrait('contrite').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.profligate: "[GetTrait('profligate').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.comfort_eater: "[GetTrait('comfort_eater').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.inappetetic: "[GetTrait('inappetetic').GetName( ROOT.Char )]"
 pilgrimage.6750.desc.outro: " — jediným světlem, které ještě spatřím, budou plameny [ROOT.Char.GetFaith.NegativeAfterLife]."
 pilgrimage.6750.a: "„Zde se zrodím jako [Select_CString(ROOT.Char.IsFemale,'nová žena','nový muž')].“"
 pilgrimage.6750.b: "„Tak si to tedy prozatím alespoň užiji.“"
 pilgrimage.6760.t: "Disputace v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 pilgrimage.6760.desc.intro: "Při poslechu ranních modliteb se s [bishop_pilgrim.GetTitledFirstName] pustíme do živé rozpravy, která se brzy stočí k teologii.\n\n"
 pilgrimage.6760.desc.christian: "„Bylo by pošetilé tvrdit, že slova ‚stal se tělem‘ znamenají, že se Kristus nevysvětlitelně a nepochopitelně stal člověkem ze Slova skrze hypostatické sjednocení.“\n\n„Ale jak řekl sám Nestorius,“ namítne [bishop_pilgrim.GetTitledFirstName], „člověk Kristus mohl být také učiněn božským, Synem z milosti, nikoli z přirozenosti.“"
 pilgrimage.6760.a: "„Tyhle rouhavé nesmysly poslouchat nebudu!“"
 pilgrimage.6760.b: "„A dobře víš, jak #EMP pro něj#! dopadl koncil v Efesu.“"
 pilgrimage.6760.b.success: "[bishop_pilgrim.GetShortUIName] se nechá přesvědčit"
 pilgrimage.6760.b.failure: "[bishop_pilgrim.GetShortUIName] trvá na svém stanovisku"
 pilgrimage.6760.c: "„Dobře řečeno, příteli. Teď se pojďme projít.“"
 pilgrimage.6770.t: "Pravá relikvie"
 pilgrimage.6770.desc.intro: "Když se procházím mezi tržištními stánky a vyhýbám se co největšímu množství místních pokrmů, všimnu si většího davu kolem jednoho obchodníka.\n\n„Pojďte si koupit pravou relikvii za cenu, nad kterou se [ROOT.Char.GetFaith.WealthGodName] bude smát ještě celá desetiletí. "
 pilgrimage.6770.desc.christian: "[SCOPE.Custom('ChristianRelicName')|U]!"
 pilgrimage.6770.desc.islam: "[SCOPE.Custom('IslamRelic')|U]!"
 pilgrimage.6770.desc.buddhist: "[SCOPE.Custom('BuddhismRelicName')|U]!"
 pilgrimage.6770.desc.judaism: "[SCOPE.Custom('JudaismRelicName')|U]!"
 pilgrimage.6770.desc.fallback: "[merchant_relic.GetName|U]!"
 pilgrimage.6770.desc.outro: "Nalezena právě v této svaté svatyni, teprve před několika dny!“"
 pilgrimage.6770.a: "#EMP Musí#! být moje."
 pilgrimage.6770.b: "„Jistě bys nechtěl prodávat relikvii za tak chamtivou cenu...“"
 pilgrimage.6770.b.success: "[relic_merchant.GetShortUIName] sníží cenu"
 pilgrimage.6770.b.failure: "[relic_merchant.GetShortUIName] tvá nabídka urazí"
 pilgrimage.6770.c: "„Mám lepší možnosti, za co utratit zlato.“"
 pilgrimage.6770.d: "„Tohle nevypadá zrovna pravě...“"
 pilgrimage.6780.t: "Schopný dvořan"
 pilgrimage.6780.desc: "Člověk se může modlit jen určitou dobu, než začne hledat jiné, neméně důležité způsoby, jak trávit čas. A [current_employer.GetTitledFirstName] má nádherné sídlo, které mi tak laskavě dovoluje navštěvovat.\n\nZ jedné z místností zaslechnu hlasy. „...a tímto způsobem dosáhnete té nejlepší techniky.“ Nakouknu dovnitř a spatřím [stolen_courtier.GetTitledFirstName], jak skupině zaujatých dvořanů vysvětluje své řemeslo. Všichni dychtivě naslouchají každému slovu."
 pilgrimage.6780.a: "Jaký mistr svého řemesla. Možná bych měl[Select_CString(ROOT.Char.IsFemale,'a zvážit nabídku místa u svého dvora.',' zvážit nabídku místa u svého dvora.')]"
 pilgrimage.6780.b: "„Takový odborník se u tohoto dvora jen mrhá...“"
 pilgrimage.6780.b.success.t: "Dvořan naverbován"
 pilgrimage.6780.b.success.desc: "[stolen_courtier.GetShortUIName] se připojí k tvému dvoru"
 pilgrimage.6780.b.failure.t: "Nabídka odmítnuta"
 pilgrimage.6780.b.failure.desc: "[stolen_courtier.GetShortUIName] odmítne tvou nabídku"
 pilgrimage.6780.c: "Kvůli jedinému člověku nestojí za to riskovat hněv [current_employer.GetTitledFirstNameNoTooltip]."
 obligation_hook_salary: "Plat z povinnosti"
 obligation_hook_tt: "#EMP Páky z povinnosti#! [Concept('hooks','snižují')|E] platy [Concept('court_position','dvorských úřadů')|E] o [gold_i]#P -50%#!"
 generic_cp_discount: "Smluvní snížení"
 pilgrimage.6790.t: "Duchovní procitnutí v [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]"
 pilgrimage.6790.desc: "„[spiritual_mentor.GetFirstNameNoTooltip] je nejvýjimečnější člověk široko daleko. Každý den bdí nad svatým místem a každou noc se vrací do tábora za městem, kde se modlí až do úsvitu, dokud měsíc nezmizí.“\n\nPo všech příbězích o těchto zázracích se zhluboka nadechnu a přistoupím k ohni, u něhož [spiritual_mentor.GetFirstNameNoTooltip] odpočívá.\n\n„Čekám na tebe,“ pronese [spiritual_mentor.GetFirstNameNoTooltip] a upře na mě pohled. „A [spiritual_mentor.GetFaith.HighGodName] také. Jsi připraven[Select_CString(ROOT.Char.IsFemale,'a opustit své',' opustit své')] [ROOT.Char.Custom('SinfulTrait')|l] způsoby?“"
 pilgrimage.6790.a: "„Ano. #EMP Jsem#!.“"
 pilgrimage.6790.b: "„Více mě zajímá tvé učení.“"
 pilgrimage.6790.c: "„Na sobě nemusím měnit #EMP vůbec nic#!.“"
 pilgrimage.6800.t: "Volání"
 pilgrimage.6800.desc: "Když vstoupím na posvátnou půdu, spatřím [called_member.GetTitledFirstName], jak nepřítomně hledí na oltář.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ pronese [called_member.GetFirstNameNoTooltip] bez zaváhání, „musím ti něco říct. [called_member.GetFaith.HighGodName] mě povolává. Ten hlas je jasný, přísný a přesný.“\n\n„Pokud mi dovolíš zůstat, chci zasvětit svůj život [called_member.GetFaith.GetName] a stát se [GetTrait('devoted').GetName( called_member )].“"
 pilgrimage.6800.a: "„Rozumím. Musíš udělat to, k čemu tě volá svědomí.“"
 pilgrimage.6800.b: "„Copak doma nemáme [ROOT.Char.GetFaith.HouseOfWorshipPlural]?“"
 pilgrimage.6800.c: "„Okamžitě nech těch nesmyslů.“"
 pilgrimage.6800.d: "„Zůstat tady? Abys proti mně mohl[Select_CString(called_member.IsFemale,'a kout pikle',' kout pikle')]? Ani náhodou!“"
 pilgrimage.6800.e: "„Výborně! Také přispěji darem!“"
 pilgrimage.6800.e.tt: "Místní duchovenstvo toto gesto velmi ocení"
 pilgrimage.6810.t: "Odpustky"
 pilgrimage.6810.desc: "„...teď můžeš jít, dítě.“ Když vstoupím do [ROOT.Char.GetFaith.HouseOfWorship], zaslechnu [bishop_pilgrim.GetTitledFirstName] tiše pronést tato slova. Poutník se před odchodem ukloní a v ruce [bishop_pilgrim.GetFirstNameNoTooltip] zahlédnu lesk zlata.\n\n„Ach, drahý [ROOT.Char.GetTitleAsNameNoTooltip], chceš snad také dosáhnout odpuštění svých hříchů? [religious_head_scope.GetTitledFirstName] nařídil udělovat odpustky všem poutníkům, kteří navštíví [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]... samozřejmě za patřičnou cenu.“"
 pilgrimage.6810.a: "„Prosím, přimluv se za mě. [ROOT.Char.GetFaith.HighGodName] snad vyslyší tvou prosbu.“"
 pilgrimage.6810.b: "Jeden by se hodil i pro [my_heir.GetFirstNameNoTooltip]."
 pilgrimage.6810.c: "„Jak si vůbec může člověk koupit vstup do [ROOT.Char.GetFaith.DivineRealm]?“"
 pilgrimage.6820.t: "Poutníkova příručka"
 pilgrimage.6820.desc: "Tržiště v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] překypují obchodníky, kteří pokřikují jazyky, jež jsem nikdy neslyšel[Select_CString(ROOT.Char.IsFemale,'a','')], a prodávají koření, které jsem nikdy neochutnal[Select_CString(ROOT.Char.IsFemale,'a','')].\n\n„Poutníkova příručka! Poznejte nejbezpečnější cesty, objevte divy [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!“ vykřikuje jeden z nich a mává mým směrem malou knihou."
 pilgrimage.6820.a: "„Jednu si vezmu!“"
 pilgrimage.6820.b: "„Ukažte mi ji... aha! A když se vydáte tudy...“"
 pilgrim.6820.b.flavor: "Přísahal[Select_CString(ROOT.Char.IsFemale,'a bych, že jsem tuhle knihu už někde viděla...',' bych, že jsem tuhle knihu už někde viděl...')]"
 pilgrimage.6820.c: "[ROOT.Char.GetFaith.HighGodName] mě povede."
 pilgrim_guide_artifact: "Poutníkova příručka"
 pilgrim_guide_artifact_desc: "Kniha popisující nejbezpečnější poutní cesty a také zajímavá místa v okolí svatého místa."
 pilgrimage.6830.t: "Ticho"
 pilgrimage.6830.desc: "Ozvěna mých vlastních kroků je jediným zvukem v [ROOT.Char.GetFaith.HouseOfWorship]. Jsem tu sám[Select_CString(ROOT.Char.IsFemale,'a','')]. Poslední, co si pamatuji z okolního světa, jsou tváře žebráků u bran a modrá, nekonečně modrá obloha. Teď se zdá tak vzdálená.\n\nKráčím k oltáři s vědomím, že tu nikdo jiný není, a přesto cítím neúprosný pohled. [ROOT.Char.GetFaith.HighGodName] nikdy nezavírá oči."
 pilgrimage.6830.a: "Čas na modlitbu."
 pilgrimage.6830.b: "Jen se podívej na ty oblouky... nádhera."
 pilgrimage.6830.c: "Měl[Select_CString(ROOT.Char.IsFemale,'a bych přinést obětinu.',' bych přinést obětinu.')]"
 pilgrimage.6830.c.tt: "Přijdeš o [votive_artifact.GetName]"
 pilgrimage.6840.t: "Hmotná požehnání"
 pilgrimage.6840.desc: "Poutnice položí před oltář votivní figurku a skloní hlavu. Vidím, jak jí [blessed_bishop.GetTitledFirstName] uděluje požehnání a tiše něco šeptá do ucha. Zachytím jen jediné slovo: „...svaté.“\n\n[blessed_bishop.GetFaith.BishopNeuter] ke mně pokyne. „Přinášíš také něco k požehnání, drahý [ROOT.Char.GetTitleAsNameNoTooltip]?“"
 pilgrimage.6840.a: "„Prosím, ať [blessed_artifact.GetNameNoTooltip] získá více posvátnosti!“"
 pilgrimage.6840.b: "„Ať každý pozná slávu, kterou nese [blessed_artifact.GetNameNoTooltip]!“"
 pilgrimage.6840.c: "Pro své zlato mám lepší využití."
 pilgrimage.6840.a.tt: "Získá [piety_i|E]#positive_value +2%#! měsíční [Concept('piety','zbožnosti')|E]"
 pilgrimage.6840.b.tt: "Získá [prestige_i|E]#positive_value +0.5%#! měsíční [Concept('prestige','prestiže')|E]"
 blessed_artifact_desc: "[blessed_artifact.GetDesc]\n\nPo požehnání na svatém místě [holy_site_scope.GetNameNoTooltip] z něj vyzařuje neposkvrněná aura."
 pilgrimage.6850.t: "Mistr zloděj"
 pilgrimage.6850.desc: "Probudím se z neklidného spánku a ve tmě přede mnou se tyčí jakási postava. Zatímco už v duchu přemýšlím o příštím životě, ze stínů vystoupí [wise_priest.GetName] s potutelným úsměvem na tváři.\n\n„Vznešený [ROOT.Char.GetTitleAsNameNoTooltip], odpusť naše vniknutí, ale některé lekce je třeba zažít, aby jim člověk porozuměl.\n\nZloděj při svém zločinu využívá stínů, slepých míst a zkorumpovaných úředníků. Stejně tak se zkažený [ROOT.Char.GetFaith.PriestNeuter] ve stínech oddává nemravnostem, ve tvých slepých místech káže falešné učení a díky zkorumpovaným úředníkům stoupá do vysokého postavení.“"
 pilgrimage.6850.a: "Posvítím všude tam, kde se skrývá stín."
 pilgrimage.6850.b: "Pokud jsem slepý[Select_CString(ROOT.Char.IsFemale,'á','')], můj [ROOT.Char.GetCouncillorPosition( 'councillor_spymaster' ).GetPositionName] bude mýma očima."
 pilgrimage.6850.c: "Znám jednoho zkorumpovaného úředníka, který je zároveň zkaženým [ROOT.Char.GetFaith.PriestNeuter]."
 pilgrimage.6850.c.flavor: "Uvězníš svého [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]"
 pilgrimage.7000.t: "Závěr"
 pilgrimage.7000.t_hajj: "$pilgrimage_header$ Tawáf al-wadá"
 pilgrimage.7000.t_obligatory: "[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]: ... Splněno"
 pilgrimage.7000.desc_obligatory: "Návštěvu tohoto místa jsme odbyli ve spěchu a teď mě zajímá především návrat domů, abych se mohl[Select_CString(ROOT.Char.IsFemale,'a vrátit',' vrátit')] ke svým obvyklým záležitostem.\n\nSnad [ROOT.Char.GetFaith.HighGodNameAlternate] pochopí, že mě tlačí čas, a přesto přijme mé úsilí v rámci [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName].\n\nMoji [ROOT.Char.GetFaith.AltPriestTermPlural] si každopádně nemají na co stěžovat."
 pilgrimage.7000.intro: "Když se náš čas na tomto posvátném místě chýlí ke konci,"
 pilgrimage.7000.intro_hajj: "Letošní hadždž se chýlí ke konci. Po dvou dnech ramí al-džamarát neboli „kamenování ďábla“ jsem připraven[Select_CString(ROOT.Char.IsFemale,'a','')] vykonat závěrečný obřad tawáf al-wadá a rozloučit se s Mekkou.\n\n"
 pilgrimage.7000.desc_perfect_pious: "Jsem nadšen[Select_CString(ROOT.Char.IsFemale,'á','ý')], že tato pouť patřila k nejoddanějším v dějinách, ne-li byla #EMP tou#! nejoddanější ze všech. [ROOT.Char.GetFaith.HighGodNameAlternate] se na mě usmívá."
 pilgrimage.7000.desc_high_pious: "Těší mě vědomí, že většina, ne-li všechna má rozhodnutí během naší [activity.Custom('PilgrimageLength')] cesty dokazovala mou oddanost. [ROOT.Char.GetFaith.HighGodNameAlternate] i [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] pro mě mnoho znamenají."
 pilgrimage.7000.desc_mid_pious: "Uklidňuje mě vědomí, že i když jsem možná nebyl[Select_CString(ROOT.Char.IsFemale,'a nejzbožnější poutnicí ze všech, svou oddanost jsem dokázala',' nejzbožnějším poutníkem ze všech, svou oddanost jsem dokázal')] mnoha způsoby. [ROOT.Char.GetFaith.HighGodNameAlternate] o ní jistě ví."
 pilgrimage.7000.desc_low_pious: "Trochu mě znepokojuje, že jsem svou oddanost nedokázal[Select_CString(ROOT.Char.IsFemale,'a projevit tolik, kolik bych si přála.',' projevit tolik, kolik bych si přál.')] [ROOT.Char.GetFaith.HighGodName] snad mé úmysly přesto zná."
 pilgrimage.7000.desc_perfect_worldly: "Jsem nadšen[Select_CString(ROOT.Char.IsFemale,'á','ý')] z toho, jak tato pouť dopadla. Tolik míst jsem viděl[Select_CString(ROOT.Char.IsFemale,'a','')], tolik zážitků získal[Select_CString(ROOT.Char.IsFemale,'a','')]... byl to skutečný úspěch!"
 pilgrimage.7000.desc_high_worldly: "Těší mě vědomí, že naše [activity.Custom('PilgrimageLength')] cesta naplnila světskou stránku [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] a tím i mě samotného."
 pilgrimage.7000.desc_mid_worldly: "Několik světských příležitostí mi možná uniklo, ale celkově jsem s touto zkušeností spokojen[Select_CString(ROOT.Char.IsFemale,'á','ý')]."
 pilgrimage.7000.desc_low_worldly: "Trochu mě mrzí, že jsem neměl[Select_CString(ROOT.Char.IsFemale,'a možnost poznat tolik jiných kultur a míst, kolik bych si přála.',' možnost poznat tolik jiných kultur a míst, kolik bych si přál.')]"
 pilgrimage.7000.outro_buried_predecessor_here: "\n\nNavzdory nešťastným událostem, které vedly ke smrti mého předchůdce [old_pilgrimage_host.GetTitledFirstName], a zjevnému smutku, jenž tuto cestu poznamenal, se samotná pouť ukázala jako zajímavá zkušenost, na kterou budu rád[Select_CString(ROOT.Char.IsFemale,'a','')] vzpomínat."
 pilgrimage.7000.outro_bury_predecessor_home: "\n\nKdyž jsme nyní učinili čestnou věc a dokončujeme pouť [old_pilgrimage_host.GetTitledFirstName] na toto místo, zbývá už jen bezpečně se vrátit domů a uložit [old_pilgrimage_host.GetFirstNameNoTooltip] k poslednímu odpočinku."
 pilgrimage.7000.outro_first: "\n\nByla to má první pouť a přestože žádné dvě poutě nejsou stejné, mám pocit, že už mnohem lépe vím, co od podobné duchovní cesty v budoucnu očekávat."
 pilgrimage.7000.outro_second: "\n\nByla to má druhá pouť a nemohu si pomoci, abych ji nesrovnával[Select_CString(ROOT.Char.IsFemale,'a','')] se svou předchozí návštěvou [first_pilgrimage_memory.MakeScope.Var('pilgrimage_destination').GetProvince.GetNameNoTooltip] a tamní posvátností."
 pilgrimage.7000.outro_second_revisit: "\n\nByla to má druhá pouť a zároveň druhá návštěva svatého místa [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Ani trochu nelituji, že jsem se sem vrátil[Select_CString(ROOT.Char.IsFemale,'a','')] a mohl[Select_CString(ROOT.Char.IsFemale,'a znovu obdivovat',' znovu obdivovat')] jeho posvátnost a nádheru."
 pilgrimage.7000.outro_multi: "\n\nZe všech mých [ROOT.Char.Custom('PilgrimageAmount')] poutí byla tato zatím nejvíce obohacující."
 pilgrimage.7000.outro_first_hajj: "\n\nByla to má první hadždž a jsem rád[Select_CString(ROOT.Char.IsFemale,'a, že jsem se na tuto cestu vydala, účastnila se obřadů a setkala se se spřízněnými dušemi. Cítím, že můj duch je povznesený jako nikdy předtím. [ROOT.Char.GetFaith.HighGodName] je mi nyní bližší než kdy dřív.',', že jsem se na tuto cestu vydal, účastnil se obřadů a setkal se se spřízněnými dušemi. Cítím, že můj duch je povznesený jako nikdy předtím. [ROOT.Char.GetFaith.HighGodName] je mi nyní bližší než kdy dřív.')]"
 pilgrimage.7000.outro_second_hajj: "\n\nByla to má druhá hadždž. Poznal[Select_CString(ROOT.Char.IsFemale,'a jsem nové přátele a znovu se setkala se známými tvářemi z minulé návštěvy.',' jsem nové přátele a znovu se setkal se známými tvářemi z minulé návštěvy.')]"
 pilgrimage.7000.outro_multi_hajj: "\n\nByl[Select_CString(ROOT.Char.IsFemale,'a jsem tu už mnohokrát a hadždž je pro mě pokaždé opravdovou radostí. Víra nás sjednocuje a [ROOT.Char.GetFaith.HighGodName] nás všechny spojuje jako jeden lid.',' jsem tu už mnohokrát a hadždž je pro mě pokaždé opravdovou radostí. Víra nás sjednocuje a [ROOT.Char.GetFaith.HighGodName] nás všechny spojuje jako jeden lid.')]"
 pilgrimage.7000.outro_new_holy_site: "\n\nNadto mě těší, že jsem navštívil[Select_CString(ROOT.Char.IsFemale,'a nové svaté místo',' nové svaté místo')]!"
 pilgrimage.7000.a: "[ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], bylo mi ctí."
 pilgrimage.7000.a_cynical: "Bylo to zajímavé, ale už se těším do vlastní postele."
 pilgrimage.7000.a_hajj: "Kéž znovu spatřím tvé hradby!"
 pilgrimage.7000.a_hajj_cynical: "Pochybnosti mám stále, ale #EMP velkolepé#! to bylo."
 pilgrimage.7000.a.tt: "Je čas vydat se na cestu domů"
 cultural_acceptance_gain_worldly_pilgrimage: "Světská pouť změnila kulturní přijetí."
 pilgrimage.7000.b: "Činím pokání!"
 pilgrimage.9001.t: "$pilgrimage_header$ Návrat"
 pilgrimage.9001.desc_intro: "Má cesta byla dlouhá, ale konečně jsem zase doma. "
 pilgrimage.9001.desc_invalidated: "\n\nNešťastný zvrat událostí mou pouť předčasně ukončil a [missed_holy_site.GetNameNoTooltip] jsem bohužel navštívit nestihl[Select_CString(ROOT.Char.IsFemale,'a','')]. Mrzí mě to, ale každým dnem o něco méně.\n\nNezbývá mi než věřit, že [ROOT.Char.GetFaith.HighGodNameAlternate] to takto zamýšlel."
 pilgrimage.9001.desc_buried_there: "Díky odhodlání dokončit pouť [old_pilgrimage_host.GetTitledFirstName] nyní mohu klidně spát s vědomím, že [old_pilgrimage_host.GetFirstNameNoTooltip] nalezl[Select_CString(old_pilgrimage_host.IsFemale,'a místo posledního odpočinku',' místo posledního odpočinku')] v posvátném [burial_location.GetNameNoTierNoTooltip].\n\nA přestože mnohé zůstalo stejné, moji [ROOT.Char.GetFaith.AltPriestTermPlural] tvrdí, že mě tato svatá cesta nějak změnila, ať už to sám[Select_CString(ROOT.Char.IsFemale,'a dokážu poznat, nebo ne',' dokážu poznat, nebo ne')]."
 pilgrimage.9001.desc: "Mnohé zůstalo stejné, ale způsob, jakým se ke mně [ROOT.Char.GetFaith.PriestNeuterPlural] chovají, se přece jen změnil.\n\nPodstoupil[Select_CString(ROOT.Char.IsFemale,'a jsem cestu jako svatá žena a oni tvrdí, že mě nějak změnila, ať už to sama dokážu poznat, nebo ne.',' jsem cestu jako svatý muž a oni tvrdí, že mě nějak změnila, ať už to sám dokážu poznat, nebo ne.')]"
 pilgrimage.9001.a: "Je dobré být zase doma."
 pilgrimage.9001.a_invalidated: "Ať se děje, co se děje."
 pilgrimage.9001.a.tt: "Tvá cesta skončila"
 pilgrimage.9010.t: "$pilgrimage_header$ Návrat domů"
 pilgrimage.9010.desc.relation_family: "Do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] dorazíme pozdě odpoledne a služebnictvo, #EMP mé#! služebnictvo, se okamžitě pustí do nezbytných příprav na pohřeb [old_pilgrimage_host.GetFirstName]. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_pilgrimage_host'))|U] tak konečně spočine doma.\n\n"
 pilgrimage.9010.desc.relation_liked: "Do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] dorazíme pozdě odpoledne a služebnictvo, #EMP mé#! služebnictvo, se okamžitě pustí do nezbytných příprav, aby drahý[Select_CString(old_pilgrimage_host.IsFemale,'á','')] [old_pilgrimage_host.GetFirstName] konečně spočinul[Select_CString(old_pilgrimage_host.IsFemale,'a','')] k poslednímu odpočinku.\n\n"
 pilgrimage.9010.desc.relation_neutral: "Do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] dorazíme pozdě odpoledne a služebnictvo, #EMP mé#! služebnictvo, se okamžitě pustí do nezbytných příprav, aby [old_pilgrimage_host.GetTitledFirstName] konečně spočinul[Select_CString(old_pilgrimage_host.IsFemale,'a','')] k poslednímu odpočinku.\n\n"
 pilgrimage.9010.desc.turned_back_liked: "S těžkým srdcem dohlížím na obřady a snažím se nalézt útěchu v představě, že když [old_pilgrimage_host.GetFirstName] zemřel[Select_CString(old_pilgrimage_host.IsFemale,'a cestou',' cestou')] ke svatému místu [previous_holy_site.GetNameNoTierNoTooltip], [ROOT.Char.GetFaith.HighGodName] byl[Select_CString(old_pilgrimage_host.IsFemale,'a s ní',' s ním')].\n\nVždyť nad kým jiným by měl [ROOT.Char.GetFaith.HighGodNameAlternate] bdít než nad poutníky?"
 pilgrimage.9010.desc.turned_back_neutral: "Stále si zvykám na své nové [ROOT.Char.Custom('GetRealmOrDomicile')|l] a [ROOT.Char.Custom('GetCourtierPlural')|l] se ke mně hrnou ze všech stran ve snaze získat si mou přízeň. Návrat s tělem [old_pilgrimage_host.GetTitledFirstName] mi však definitivně připomíná, že [old_pilgrimage_host.GetFirstNameNoTooltip] se už nevrátí a že novým [ROOT.Char.GetTitleAsNameNoTooltip] jsem teď #EMP já#!."
 pilgrimage.9010.desc.there_and_back_liked: "Přestože truchlím nad smrtí [old_pilgrimage_host.GetFirstNameNoTooltip], nacházím útěchu ve vědomí, že jsem splnil[Select_CString(ROOT.Char.IsFemale,'a poslední přání a dokončila',' poslední přání a dokončil')] naši pouť do [previous_holy_site.GetNameNoTierNoTooltip].\n\nAť už je [old_pilgrimage_host.GetFirstNameNoTooltip] nyní kdekoli, jistě nalezl[Select_CString(old_pilgrimage_host.IsFemale,'a klid',' klid')]. Při té myšlence se mi na tváři objeví nesmělý úsměv."
 pilgrimage.9010.desc.there_and_back_neutral: "Cesta do [previous_holy_site.GetNameNoTierNoTooltip] a zpět, kterou jsem podnikl[Select_CString(ROOT.Char.IsFemale,'a na počest přání',' na počest přání')] [old_pilgrimage_host.GetTitledFirstName], mi dodala důvěryhodnost v očích [ROOT.Char.Custom('GetCourtierPlural')|l], kteří kdysi sloužili [old_pilgrimage_host.GetFirstNameNoTooltip] a nyní jsou to #EMP moji#! [ROOT.Char.Custom('GetCourtierPlural')|l]. Pomalu si začínám zvykat, že zde nyní vládnu jako [ROOT.Char.GetTitleAsNameNoTooltip]."
 pilgrimage.9010.desc.invalidated_pilgrimage_liked: "Truchlím nad smrtí [old_pilgrimage_host.GetFirstNameNoTooltip] a hluboce mě mrzí, že jsem [Select_CString(old_pilgrimage_host.IsFemale,'ji nemohl uložit','ho nemohl uložit')] k odpočinku v [previous_holy_site.GetNameNoTierNoTooltip]."
 pilgrimage.9010.desc.invalidated_pilgrimage_neutral: "Trochu mě mrzí, že jsem neměl[Select_CString(ROOT.Char.IsFemale,'a možnost uložit',' možnost uložit')] [old_pilgrimage_host.GetFirstNameNoTooltip] k odpočinku v [previous_holy_site.GetNameNoTierNoTooltip], ale v každém případě už je konečně pohřben[Select_CString(old_pilgrimage_host.IsFemale,'a','')]."
 pilgrimage.9010.a: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip], jedno srdce, jeden domov."
 pilgrimage.9010.a_interrupted: "Alespoň jsme doma a v jednom kuse."
 pilgrimage.9010.a_adventurer: "Alespoň jsme zpátky v jednom kuse."
 pilgrimage.9010.a.flavor: "$pilgrimage.4020.a.flavor$"
 pilgrimage.9100.t: "$pilgrimage_header$ Exotické zboží"
 pilgrimage.9100.desc_intro: "Když už jsem své exotické zboží dopravil[Select_CString(ROOT.Char.IsFemale,'a až z',' až z')] [ROOT.Var('6540_exotic_wares_location').GetProvince.GetName],"
 pilgrimage.9100.desc: " musím se rozhodnout, co s ním udělám.\n\nMám ho prodat se ziskem, nebo si ho raději schovat jako dar pro svou příští osobní intriku...?"
 pilgrimage.9100.desc_has_gift: " nastal čas sklidit odměnu a prodat je se ziskem."
 pilgrimage.9100.a: "Mince ke mně promlouvají."
 pilgrimage.9100.a_double.tt: "Prodáš zboží za dvojnásobek původní částky"
 pilgrimage.9100.a_triple.tt: "Prodáš zboží za trojnásobek původní částky"
 pilgrimage.9100.a_has_gift: "Tomu se bránit nebudu!"
 pilgrimage.9100.b: "Bude moudřejší si je schovat."
 pilgrimage.9100.b.tt: "Získáš příležitost použít zboží ke zvýšení síly a šance na úspěch své příští [Concept('personal_scheme','osobní intriky')|E]"
 pilgrimage_seasia.100.t: "$pilgrimage_header$ Lovec perel"
 pilgrimage_seasia.100.desc: "Když náš [Glossary( 'džong', 'DJONG_GLOSS' )] pluje podél okraje [background_terrain_scope.GetName], rozhodneme se na chvíli zastavit v [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] pobřežní [background_terrain_scope.Custom('TerrainTypeProvince')].\n\nZ vody se vynoří osamělá postava. Je to dítě.\n\n„Duch obří škeble mi řekl, abych její poklad daroval[Select_CString(pearl_diver_child.IsFemale,'a','')] [ROOT.Char.GetTitleAsName], který[Select_CString(ROOT.Char.IsFemale,'á čeká',' čeká')] nahoře.“ Dítě natáhne ruku a na dlani se mu leskne perla."
 pilgrimage_seasia.100.a: "S tímto dítětem rozmlouvají duchové. Musím se o něj postarat."
 pilgrimage_seasia.100.b: "Tohle je znamení! [ROOT.Char.GetFaith.HighGodName] mi je seslal."
 pilgrimage_seasia.100.c: "Nádherná cetka. Děkuji ti, dítě."
 DJONG_GLOSS: "Jávská námořní loď středověku, stavěná z teakového dřeva a spojovaná bez použití železa."
 pilgrimage_seasia.200.t: "$pilgrimage_header$ Duchové mangrovů"
 pilgrimage_seasia.200.desc: "Když se rozhlížím po [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] krajině [background_terrain_scope.GetName], pobřeží náhle přeruší hustý mangrovový porost.\n\nNáš [Glossary( 'džong', 'DJONG_GLOSS' )] pomalu vpluje mezi skupinu malých člunů, z nichž rybáři rozhazují hrsti rýže do bažinaté vody.\n\n„Obětina duchům, [ROOT.Char.GetTitleAsName],“ vysvětlí [Select_CString(local_character.IsFemale,'jedna z rybářek','jeden z rybářů')]. „Chrání nás před neštěstím.“"
 pilgrimage_seasia.200.a: "Požádej rybáře, aby se přidali jako průvodci."
 pilgrimage_seasia.200.b: "Hodím přes zábradlí trochu rýže."
 pilgrimage_seasia.200.c: "Tohle je znepokojivé... pospěšme si."
 local_fishermen_modifier: "Místní rybáři"
 local_fishermen_modifier_desc: "Tuto cestovní skupinu doprovází skupina místních rybářů."
 pilgrimage_seasia.300.t: "$pilgrimage_header$ Dobré proroctví"
 pilgrimage_seasia.300.desc: "Vlny [background_terrain_scope.GetName] se jemně tříští o trup lodi a nad stěžněm krouží [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')], zatímco vítr je čím dál příznivější.\n\nDobré proroctví, které jsem obdržel[Select_CString(ROOT.Char.IsFemale,'a','')], se naplňuje. Do [destination.GetName] dorazíme co nevidět!"
 pilgrimage_seasia.300.a: "Kéž nám tyto větry vydrží!"
 good_prophecy_travel_modifier: "Dobré proroctví"
 good_prophecy_travel_modifier_desc: "Proroctví, které tato postava obdržela, se naplnilo a urychlilo její cestu."
 pilgrimage_seasia.400.t: "$pilgrimage_header$ Plovoucí svatyně"
 pilgrimage_seasia.400.desc: "Když se před námi objeví pobřeží [background_terrain_scope.GetName], spatříme také velkou loď, která na palubě nese [local_character.GetFaith.GetAdjective] svatyni. Jakmile se přiblížíme, přivítají nás postavy na palubě, slepí [GetTrait('devoted').GetName( local_character )] s rukama vroucně sepjatýma k modlitbě.\n\n„Jsi zde vítán[Select_CString(ROOT.Char.IsFemale,'a','')], [ROOT.Char.GetTitleAsName],“ pronese jejich vůdce. „Můžeme vám nějak pomoci, znavení námořníci?“"
 pilgrimage_seasia.400.a: "Pověz mi pravdu o [local_character.GetFaith.GetNameNoTooltip]."
 pilgrimage_seasia.400.b: "Moudrý člověče, co nás čeká na další cestě?"
 pilgrimage_seasia.400.c: "Prosím, požehnej nám."
 a_good_prophecy_tt: "Obdržíš příznivé proroctví pro další cestu... nebo jsou to možná jen prázdná slova?"
 pilgrimage_seasia.500.t: "$pilgrimage_header$ Rybáři z [background_terrain_scope.GetNameNoTooltip]"
 pilgrimage_seasia.500.desc: "Pobřežní vody [background_terrain_scope.GetName] se hemží rybáři, kteří vrhají [Glossary('jaly', 'JALA_GLOSS')] a vytahují [Glossary('bubu', 'BUBU_GLOSS')]. Pak náhle vypukne všeobecný zmatek!\n\n„To je [ROOT.Char.GetTitleAsNameNoTooltip]!“ ozve se hlas [Select_CString(local_character.IsFemale,'jedné ženy','jednoho muže')]. „Rychle, všichni, musíme se vyhřívat v té božské přítomnosti!“ Během několika okamžiků náš [Glossary( 'džong', 'DJONG_GLOSS' )] obklopí dychtivé rybářské čluny."
 pilgrimage_seasia.500.a: "Pojďte všichni a pohleďte na mou dobrotivost!"
 pilgrimage_seasia.500.b: "Rozejděte se, moji poddaní, a vyprávějte všem o [local_character.GetFaith.GetNameNoTooltip]."
 pilgrimage_seasia.500.c: "Připojte se ke mně, ó moji nejvíce [local_character.Custom('RandomPositiveShallowAdjective')] poddaní!"
 pilgrimage_seasia.500.d: "Rychle odtud pryč..."
 coastal_ruler_visit_travel_modifier: "Návštěva pobřežního vládce"
 coastal_ruler_visit_travel_modifier_desc: "Vládce tohoto hrabství projevil dobrotivost vůči pobřežnímu obyvatelstvu."
 JALA_GLOSS: "Kruhové vrhací sítě zatížené po okraji olovem, které se obratně házejí ručně z lodí nebo ze břehu."
 BUBU_GLOSS: "Důmyslné bambusové pasti na ryby, často rozmísťované v ústích řek a mangrovových deltách."
 pilgrimage_seasia.600.t: "$pilgrimage_header$ Obětina z rýže"
 pilgrimage_seasia.600.desc: "Hledím na [background_terrain_scope.GetName], zatímco se vedle mě opírá můj [ROOT.Char.Custom2('RelationToMeShort', entourage_character)], [entourage_character.GetFirstNameNicknamed]. [entourage_character.GetFirstNameNoTooltip|U] vhodí hrst rýže do moře.\n\n„[entourage_character.Custom2('RelationToMeShort', root_scope)|U], ta rýže není pro ryby. Má duchům připomenout, že jsme zde jen hosté.“ [entourage_character.GetFirstNameNoTooltip|U] mi nabídne váček. „Pro bezpečnou cestu.“"
 pilgrimage_seasia.600.a: "Ta barva oblohy... znamení?"
 pilgrimage_seasia.600.b: "Usmiřme duchy společně, příteli."
 pilgrimage_seasia.600.c: "Myslím, že si rýži nechám k večeři."
 pilgrimage_seasia.700.t: "$pilgrimage_header$ Oběť nágy"
 pilgrimage_seasia.700.desc: "Přestože mi déšť zastírá výhled, zahlédnu [Select_CString(local_character.IsFemale,'ženu','muže')], jak se křečovitě drží kusu naplaveného dřeva. Moji muži [local_character.GetFirstNameNoTooltip] okamžitě vytáhnou na palubu.\n\n„[ROOT.Char.Custom('ComplimentAdjective')|U] [Select_CString(ROOT.Char.IsFemale,'zachránkyně','zachránce')], vděčím ti za život!“ vydechne [local_character.GetFirstNameNoTooltip]. „Můj [Glossary('sampan', 'SAMPAN_GLOSS')] stáhla pod hladinu zlá [Glossary('nága', 'NAGA_GLOSS')]. [Select_CString(local_character.IsFemale,'Měla jsem vědět, že nemám vyplouvat','Měl jsem vědět, že nemám vyplouvat')] v nešťastný den...“"
 pilgrimage_seasia.700.a: "Tvé štěstí se právě změnilo. Teď jsi se mnou."
 pilgrimage_seasia.700.b: "Jsi prokletý[Select_CString(local_character.IsFemale,'á','')]. Brzy musíš odejít."
 SAMPAN_GLOSS: "Malá loď s plochým dnem, běžná na řekách a v pobřežních vodách jihovýchodní Asie. Obvykle je dřevěná a pohání se vesly nebo bidlem. Sampany se používají k rybolovu, cestování a říčnímu obchodu."
 NAGA_GLOSS: "Hadí duch uctívaný v jižní a jihovýchodní Asii, často vnímaný jako strážce vody, plodnosti a podsvětí. Nágy nejsou zcela božské ani smrtelné a vzbuzují zároveň strach i úctu."
 pilgrimage_seasia.800.t: "$pilgrimage_header$ Stíny pod hladinou"
 pilgrimage_seasia.800.desc: "Průzračné vody [background_terrain_scope.GetNameNoTooltip] se rozbouří, když pod hladinou prosviští mohutný stín. Pak další a další, až mám pocit, že se náš [Glossary( 'džong', 'DJONG_GLOSS' )] při jejich průjezdu rozkývává.\n\nSevřu harpunu, zatímco posádka začne křičet. V nastalém zmatku rozeznám jediné vyděšené slovo: #EMP „[Glossary('nágy!', 'NAGA_GLOSS')]“#!"
 pilgrimage_seasia.800.a: "Dobré znamení... vedou nás snad?"
 pilgrimage_seasia.800.b: "Rychle, musíme přinést obětiny!"
 pilgrimage_seasia.800.c: "Jsou to jen ryby... chopte se harpun."
 a_good_omen_tt: "Možná je to dobré znamení pro budoucnost..."
 pilgrimage_seasia.900.t: "$pilgrimage_header$ Piráti na sampanech"
 pilgrimage_seasia.900.desc: "Když se přiblížíme k mangrovovému pobřeží [background_terrain_scope.GetNameNoTooltip], z úkrytů náhle vyrazí [Glossary('sampany', 'SAMPAN_GLOSS')] plné pirátů, kteří křičí a mávají přitahovacími háky. Rychle vyšplhají na náš [Glossary( 'džong', 'DJONG_GLOSS' )] a já se ocitnu tváří v tvář jejich vůdci.\n\n„Vydejte zlato, vy prašiví psi, nebo vás...“ [local_character.GetFirstNameNoTooltip] náhle ztuhne a upustí svůj [Glossary('pedang', 'PEDANG_GLOSS')]. „Odpusť nám, božský [ROOT.Char.GetTitleAsNameNoTooltip]! Nechtěli jsme ti ublížit!“"
 pilgrimage_seasia.900.a: "Nebojte se, má shovívavost je veliká."
 pilgrimage_seasia.900.b: "Jste schopní bojovníci. Přidejte se ke mně."
 pilgrimage_seasia.900.c: "[ROOT.Char.GetTitleAsNameNoTooltip] požaduje bezpečný průchod!"
 PEDANG_GLOSS: "Rovná jednosečná čepel používaná malajskými a jávskými válečníky."
 pilgrimage_seasia.1000.t: "$pilgrimage_header$ Obchodníci z Tanah Makkah"
 pilgrimage_seasia.1000.desc: "Když se plavíme po [background_terrain_scope.GetNameNoTooltip], mezi [Glossary('sampany', 'SAMPAN_GLOSS')] propluje mohutná obchodní loď a přirazí k nám. Na palubu vystoupí bohatě oděný[Select_CString(local_character.IsFemale,'á žena',' muž')], zřejmě pocházející z [Glossary('Tanah Makkah', 'TANAH_MAKKAH_GLOSS')].\n\n„Zdravím tě, [ROOT.Char.GetTitleAsNameNoTooltip]. Jsem [local_character.GetFirstNameNicknamed] a pocházím z [merchant_home.GetNameNoTier],“ pronese [local_character.GetFirstNameNoTooltip] s úklonou. „Jsme [local_character.GetFaith.GetReligion.GetAdherentName] obchodníci a hledáme přístav, kde bychom mohli postavit [local_character.GetFaith.HouseOfWorship].“\n\n„Samozřejmě bychom štědře zaplatili.“"
 pilgrimage_seasia.1000.a: "Přijal by nás [local_character.GetFaith.HighGodName]?"
 pilgrimage_seasia.1000.b: "[local_character.GetFaith.HighGodName]? Dovol mi vysvětlit, jaké je skutečné božství. [ROOT.Char.GetFaith.HighGodName] ti otevře oči."
 pilgrimage_seasia.1000.c: "V [mosque_location.GetNameNoTooltip] můžete postavit [local_character.GetFaith.HouseOfWorship]."
 pilgrimage_seasia.1000.d: "Uzavřeme pár obchodů a pokračujme dál."
 TANAH_MAKKAH_GLOSS: "V jihovýchodní Asii se Mekka (Makkah) stala označením pro Arábii jako celek. „Tanah Makkah“ znamená „Země Mekky“ a tento výraz se objevuje v raných islámských rukopisech z této oblasti."
 zealotry_intent_tt: "Nemáš záměr Horlivost"
 pilgrimage_seasia.1100.t: "$pilgrimage_header$ Ratanová smyčka"
 pilgrimage_seasia.1100.desc: "Když kráčíme po úzké stezce skrz [background_terrain_scope.Custom('TerrainTypeProvincePrefix')] [background_terrain_scope.Custom('TerrainTypeProvince')] v [background_terrain_scope.GetNameNoTooltip], ozve se shora hlas. [local_character.GetFirstNameNoTooltip] visí hlavou dolů, zachycen[Select_CString(local_character.IsFemale,'á v',' ve')] [Glossary('ratanové', 'RATTAN_GLOSS')] smyčce.\n\n„Pomoc! Šlápl[Select_CString(local_character.IsFemale,'a jsem do pasti na divočáky a potřebuji',' jsem do pasti na divočáky a potřebuji')] [ROOT.Char.Custom('FormalComplimentAdjective')] [Select_CString(ROOT.Char.IsFemale,'zachránkyni','zachránce')]!“ vykřikne [local_character.GetFirstNameNoTooltip]. „Přísahám, že jsem skvělý průvodce. Osvoboď mě a přidám se k vám!“"
 pilgrimage_seasia.1100.a: "Můžeš se k nám přidat."
 pilgrimage_seasia.1100.b: "Vyprávěj ve své vesnici o mé zbožnosti."
 pilgrimage_seasia.1100.c: "Heh. Ať si tam [local_character.GetFirstNameNoTooltip] visí."
 RATTAN_GLOSS: "Popínavá palma ceněná pro svou pevnost a pružnost. Ratan se splétá do košů, vazeb a pastí a je běžnou součástí života v džungli, kterou využívají lovci, obchodníci i vesničané."
 pilgrimage_seasia.1200.t: "$pilgrimage_header$ Poutník z Nálandy"
 pilgrimage_seasia.1200.desc: "Když sestupujeme po klikaté stezce, spatříme [GetTrait('devoted').GetName( local_character )], jak táboří vedle [background_terrain_scope.Custom('GetRandomRegionalDangerSingular')] v [background_terrain_scope.Custom('TerrainTypeProvince')].\n\n„Zdravím vás, poutníci,“ tiše pronese [local_character.GetFirstNameNoTooltip]. „Jsem učenec [local_character.GetFaith.GetAdjective] víry z [GetBuilding('nalanda_university').GetName] a hledám v [exploration_target.GetBaseNameNoTier] ta nejklidnější místa k meditaci. Podělíte se se mnou o své znalosti této země?“"
 pilgrimage_seasia.1200.a: "Pokud mi na oplátku povíš o své [local_character.GetFaith.GetAdjectiveNoTooltip] víře!"
 pilgrimage_seasia.1200.b: "Ano, pokud požehnáš můj [blessed_artifact.GetNameNoTooltip]."
 pilgrimage_seasia.1200.c: "[other_barony.GetBaseNameNoTierNoTooltip] je pro meditaci nejklidnější."
 improved_artifact_tt: "[blessed_artifact.GetName] získá náhodný modifikátor"
 pilgrimage_seasia.1300.t: "$pilgrimage_header$ Kuňkající tůň"
 pilgrimage_seasia.1300.desc: "Poté, co se namáhavě prodíráme přes [background_terrain_scope.Custom('GetRandomRegionalDangerSingular')], narazíme na neobvyklý výjev... dokonale kruhovou tůň zalitou světlem. Na březích sedí žáby jako drobní mniši a v pravidelném rytmu kuňkají, jako by zpívaly chvalozpěv.\n\nNa hladině plují rýže, květy a [Glossary('betelové listy', 'BETEL_LEAVES_GLOSS')], zjevné pozůstatky obětiny."
 pilgrimage_seasia.1300.a: "Chvíli tu zůstaňme a rozjímejme."
 pilgrimage_seasia.1300.b: "Obětujme trochu rýže."
 pilgrimage_seasia.1300.c: "Je to nádherné, ale musíme pokračovat."
 BETEL_LEAVES_GLOSS: "Lesklé listy pepřovníku betelového, které se spolu s arekovým ořechem a vápnem žvýkají napříč jižní a jihovýchodní Asií. Často se používají při obřadech nebo jako obchodní zboží."
 pilgrimage_seasia.1400.t: "$pilgrimage_header$ Tvář boha"
 pilgrimage_seasia.1400.desc: "Když pochodujeme mlhavou [background_terrain_scope.Custom('TerrainTypeProvince')] v [background_terrain_scope.GetName], vynoří se před námi obrovský kamenný útvar zahalený v potrhaných látkách a zarostlý liánami. Stojím tváří v tvář hlavě boha uctívaného [character_faith.GetReligion.GetAdherentName], jehož pradávný pohled jako by pronikal až do mé duše.\n\nKterý bůh to je... a #EMP měl jsem#! ho vůbec najít?"
 pilgrimage_seasia.1400.a: "Je to [character_faith.CreatorName], stvořitel."
 pilgrimage_seasia.1400.b: "Je to [character_faith.WealthGodName], hamižný."
 pilgrimage_seasia.1400.c: "Je to [character_faith.WarGodName], dobyvatel."
 pilgrimage_seasia.1400.d: "Je to [character_faith.HighGodName]! [character_faith.GetNameNoTooltip] mě volá!"
 pilgrimage_seasia.1400.e: "Je to bezpochyby bůh cestování."
 pilgrimage_seasia.1500.t: "$pilgrimage_header$ Pawang"
 pilgrimage_seasia.1500.desc: "Když se prodíráme [background_terrain_scope.Custom('TerrainTypeProvince')] v [background_terrain_scope.GetName], vítr a déšť nám bičují tváře jako tisíc šípů. Náhle však bouře ustane. Vítr se utiší, déšť zeslábne a mezi mraky vykoukne slunce.\n\n„Když jste se blížili, utišil jsem bouři,“ pronese [local_character.GetFirstNameNoTooltip] s tichou autoritou. „Jsem [local_character.GetFirstNameNicknamed], [Glossary('pawang', 'PAWANG_GLOSS')]. V těchto krajích ze mě mají respekt.“"
 pilgrimage_seasia.1500.a: "Někdo jako ty by se mi hodil."
 pilgrimage_seasia.1500.b: "Mohl bys požehnat počasí?"
 pilgrimage_seasia.1500.c: "Nesmysl, počasí je prostě vrtkavé."
 PAWANG_GLOSS: "Ritualista, o němž se věří, že dokáže ovládat počasí, divoká zvířata a duchy. Lidé se ho obávají a zároveň si ho váží."
 good_weather_modifier: "Dobré počasí"
 good_weather_modifier_desc: "Tento doprovod provází příznivé počasí."
