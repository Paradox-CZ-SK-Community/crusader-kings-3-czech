 pilgrimage_phase_solo: "Pouť"
 pilgrimage_phase_solo_desc: "Pouť je duchovní cestou do hlubin vlastního přesvědčení. Její úspěch závisí stejně na rozhodnutích učiněných během cesty jako na těch učiněných v cíli."
 activity_pilgrimage_guest_desc: "$BULLET_WITH_TAB$Účastníci mohou získat [Concept('piety','zbožnost')|E]\n$BULLET_WITH_TAB$Účastníci mohou získat [legitimacy_i] [Concept('legitimacy','legitimitu')|E]\n$BULLET_WITH_TAB$Účastníci mohou přijít o [stress_loss_i][Concept('stress','stres')|E]\n$BULLET_WITH_TAB$Účastníci mohou získat [Concept('trait','rys')|E] [GetTrait('pilgrim').GetName( GetNullCharacter )]"
 pilgrimage_type_pious: "Zbožná pouť"
 pilgrimage_type_pious_desc: "$EFFECT_LIST_BULLET$ Některé volby v událostech umožní obzvláště zbožné činy\n$EFFECT_LIST_BULLET$ Jejich volbou získáš po dokončení více [Concept('piety','zbožnosti')|E]\n\n#weak Smyslem pouti je vzdát úctu božskému a skutečně se spojit s vlastní duchovní podstatou.#!"
 pilgrimage_type_worldly: "Světská pouť"
 pilgrimage_type_worldly_desc: "$EFFECT_LIST_BULLET$ Některé volby v událostech umožní poznávat místní zajímavosti\n$EFFECT_LIST_BULLET$ Jejich volbou získáš po dokončení odstupňovaný multikulturní modifikátor\n\n#weak Vdechovat sladkou cizokrajnost vzdáleného vzduchu, rozplétat podivuhodné zvláštnosti neznámých jazyků... může být něco lepšího?#!"
 pilgrimage_type_hajj: "Hadždž"
 pilgrimage_type_hajj_desc: "$EFFECT_LIST_BULLET$ Každý způsobilý muslim musí alespoň jednou vykonat hadždž\n$EFFECT_LIST_BULLET$ Ostatní typy se zpřístupní po získání [Concept('trait','rysu')|E] [GetTrait('hajjaj').GetName(GetNullCharacter)]\n\n#weak Pamatuj... hadždž není povinnost, ale příležitost. K odevzdání se, pokoře a odpuštění. Inšáalláh!#!"
 pilgrimage_option_fidelity: "Oddanost"
 pilgrimage_fidelity_obligatory: "Z povinnosti"
 pilgrimage_fidelity_obligatory_desc: "$EFFECT_LIST_BULLET$ Rychlost [Concept('travel','cestování')|E] se zvýší o #positive_value 50%#!\n$EFFECT_LIST_BULLET$ Po dokončení získáš #EMP méně#! [Concept('piety','zbožnosti')|E]\n\n#weak Ano, ano, duchovní naplnění, morální povinnost, osud mé nesmrtelné podstaty a tak dále. Nemůžeme už konečně vyrazit?#!"
 pilgrimage_fidelity_pilgrim: "Poutník"
 pilgrimage_fidelity_pilgrim_desc: "$EFFECT_LIST_BULLET$ Rychlost [Concept('travel','cestování')|E] se nemění\n$EFFECT_LIST_BULLET$ Odměny v podobě [Concept('piety','zbožnosti')|E] se po dokončení nemění\n\n#weak S radostí v srdci a dobrou vůlí vyrážíme spatřit posvátná místa tohoto světa.#!"
 pilgrimage_fidelity_contemplative: "Rozjímavá"
 pilgrimage_fidelity_contemplative_desc: "$EFFECT_LIST_BULLET$ Rychlost [Concept('travel','cestování')|E] se sníží o #negative_value 50%#!\n$EFFECT_LIST_BULLET$ Po dokončení získáš více [Concept('piety','zbožnosti')|E]\n\n#weak Pokud je smyslem pouti rozjímání, proč někam spěchat? Vždyť samotná cesta je přinejmenším polovinou jejího smyslu.#!"
 pilgrimage_option_pomp: "Okázalost"
 pilgrimage_pomp_humble: "Skromná"
 pilgrimage_pomp_humble_desc: "$EFFECT_LIST_BULLET$ Z tvého [Concept('court','dvora')|E] s tebou nikdo nepocestuje, takže [Concept('travel','cestování')|E] bude nebezpečné\n$EFFECT_LIST_BULLET$ Připojíš se k průvodu [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_humble_max_value')] náhodných poutníků\n$EFFECT_LIST_BULLET$ Po dokončení získáš více [Concept('piety','zbožnosti')|E]\n\n#weak Pouť je časem tichého rozjímání. Obyčejný poutnický průvod plný cizinců je pro něj tím nejlepším místem.#!"
 pilgrimage_pomp_appropriate: "Přiměřená"
 pilgrimage_pomp_appropriate_desc: "$EFFECT_LIST_BULLET$ Vezmeš s sebou osobní strážce nebo schopné rytíře a možná i přítele\n$EFFECT_LIST_BULLET$ K tvému průvodu se připojí až [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_appropriate_max_value')] náhodných poutníků\n$EFFECT_LIST_BULLET$ Odměny v podobě [Concept('piety','zbožnosti')|E] se po dokončení nemění\n\n#weak Cesty jsou nebezpečné a putování dlouhé. Duchovní čistota je jedna věc, bezhlavá pošetilost druhá.#!"
 pilgrimage_pomp_ceremonial: "Obřadná"
 pilgrimage_pomp_ceremonial_desc: "$EFFECT_LIST_BULLET$ #EMP Navíc#! s sebou vezmeš služebnictvo a zbožné příživníky\n$EFFECT_LIST_BULLET$ K tvému průvodu se připojí až [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_ceremonial_max_value')] náhodných poutníků\n$EFFECT_LIST_BULLET$ Po dokončení získáš více [Concept('piety','zbožnosti')|E]\n\n#weak Víra vyžaduje náležitou obřadnost i daleko od domova. A jak bychom mohli být obřadní bez následovníků?#!"
 pilgrimage_pomp_throng: "Početný zástup"
 pilgrimage_pomp_throng_desc: "$EFFECT_LIST_BULLET$ Připojí se k tobě každá [Concept('character','postava')|E] na [Concept('court','dvoře')|E], která má zájem\n$EFFECT_LIST_BULLET$ K tvému průvodu se připojí až [EmptyScope.ScriptValue('pilgrimage_entourage_pomp_throng_max_value')] náhodných poutníků\n$EFFECT_LIST_BULLET$ Po dokončení získáš mnohem více [Concept('piety','zbožnosti')|E]\n\n#weak Všichni věřící by měli spatřit naše posvátná místa... a já jim v tom hodlám pomoci.#!"
