l_polish:
 pilgrimage_intent.1000.t: "$zealotry_intent_header$ Krize víry"
 pilgrimage_intent.1000.desc: "Jak pokračuji ve své svaté pouti, narazím u cesty na [Select_CString(sad_peasant.IsFemale,'ženu','muže')], celou od špíny a se tváří smáčenou slzami.\n\n„Tak už máš radost? Nezbylo mi vůbec nic! Jak mám dál žít ve světě, kterému vládne tak krutá bytost jako [sad_peasant.GetFaith.HighGodName|U]?“\n\nJe zřejmé, že [Select_CString(sad_peasant.IsFemale,'je zoufalá a prožívá krizi víry','je zoufalý a prožívá krizi víry')]."
 pilgrimage_intent.1000.a: "„Odpověď ti dá pouze [ROOT.Char.GetFaith.HealthGodName|U].“"
 pilgrimage_intent.1000.a.alternate: "„Mohu ti nabídnout jiný pohled?“"
 pilgrimage_intent.1000.a.conversion_succesful.t: "Úspěšné obrácení"
 pilgrimage_intent.1000.a.conversion_succesful.desc: "Podaří se ti [Select_CString(sad_peasant.IsFemale,'ji','ho')] obrátit"
 pilgrimage_intent.1000.a.conversion_failed.t: "Obrácení selhalo"
 pilgrimage_intent.1000.a.conversion_failed.desc: "Nepodaří se ti [Select_CString(sad_peasant.IsFemale,'ji','ho')] obrátit"
 pilgrimage_intent.1000.b: "„Jsme na svaté pouti. Přidej se k nám.“"
 pilgrimage_intent.1000.b.joined.t: "Přidává se k pouti"
 pilgrimage_intent.1000.b.joined.desc: "Přidává se k tvé pouti"
 pilgrimage_intent.1000.b.not_joined.t: "Pozvání odmítnuto"
 pilgrimage_intent.1000.b.not_joined.desc: "[Select_CString(sad_peasant.IsFemale,'Nenechala se přesvědčit','Nenechal se přesvědčit')]"
 pilgrimage_intent.1000.c: "Za těmi slzami stojí [ROOT.Char.GetFaith.TricksterGodName|U]."
 pilgrimage_intent.1001.t: "$zealotry_intent_header$ Vnímavé mládí"
 pilgrimage_intent.1001.desc: "Na cestě do Svaté země jsme už narazili na nejedno podivné vyznání, a když procházíme [ROOT.Char.GetCurrentLocation.GetName], zahlédnu u cesty skupinku dovádějících dětí.\n\nVšechny se okamžitě zastaví a s úžasem v očích na nás zírají, jako bychom byli nějaká podívaná. Copak ještě nikdy neviděly [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] poutníky? Jedno z dětí navíc působí vznešeným dojmem! Možná by si rádo poslechlo nějaké příběhy z [ROOT.Char.GetFaith.ReligiousText]."
 pilgrimage_intent.1001.a: "„Něčemu tě přiučím.“"
 pilgrimage_intent.1001.a.conversion_succesful.t: "$pilgrimage_intent.1000.b.joined.t$"
 pilgrimage_intent.1001.a.conversion_succesful.desc: "Obrátíš dítě"
 pilgrimage_intent.1001.a.conversion_failed.t: "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1001.a.conversion_failed.desc: "Nepodaří se ti obrátit dítě"
 pilgrimage_intent.1001.b: "Pokračujme dál."
 pilgrimage_intent.1010.t: "$zealotry_intent_header$ Pocestní"
 pilgrimage_intent.1010.desc: "Pokračujeme v cestě přes [ROOT.Char.GetCurrentLocation.GetName] a nohy máme čím dál unavenější a rozbolavělejší.\n\nO kus dál zahlédneme šlechtice z místního dvora, který k nám přijíždí, aby se s naší skupinou setkal.\n\n„Zjevně jsi zabloudil, příteli. Co přivádí obyčejného [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] až sem do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]?“"
 pilgrimage_intent.1010.a: "„Jsme na posvátné pouti. Přidej se k nám.“"
 pilgrimage_intent.1010.a.conversion_succesful.t: "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1010.a.conversion_succesful.desc: "Podaří se ti [Select_CString(convertable_courtier.IsFemale,'ji','ho')] obrátit"
 pilgrimage_intent.1010.a.conversion_failed.t: "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1010.a.conversion_failed.desc: "Nepodaří se ti [Select_CString(convertable_courtier.IsFemale,'ji','ho')] obrátit"
 pilgrimage_intent.1010.b: "„Do toho ti nic není!“"
 pilgrimage_intent.1020.t: "$zealotry_intent_header$ Neznámí poutníci"
 pilgrimage_intent.1020.desc: "Na své cestě jsme dosud potkali mnoho poutníků, všichni byli zbožní [ROOT.Char.GetFaith.GetAdherentNamePlural|l] a oddaní vůli, kterou hlásá [ROOT.Char.GetFaith.HighGodName|U].\n\nBrzy se však ocitneme ve společnosti skupiny podivných pocestných z dalekých krajů. Představí se jako [pilgrim_character.GetFaith.GetAdherentNamePlural] a povědí nám, že i pro jejich lid je tato cesta posvátná."
 pilgrimage_intent.1020.a: "„Tuto cestu smí podniknout jen [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].“"
 pilgrimage_intent.1020.a.conversion_succesful.t: "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1020.a.conversion_succesful.desc: "Obrátíš poutníky"
 pilgrimage_intent.1020.a.conversion_failed.t: "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1020.a.conversion_failed.desc: "Nepodaří se ti obrátit poutníky"
 pilgrimage_intent.1020.b: "„Povězte mi, jaké pocty přijímá [pilgrim_character.GetFaith.HighGodName|U].“"
 pilgrimage_intent.1020.c: "Jsme si tolik podobní, měli by jít s námi!"
 cheaper_to_convert_to_pilgrim_faith_tt: "Získáš #P 50%#! slevu na konverzi k [THIS.Char.GetFaith.GetName]"
 pilgrimage_intent.1030.t: "$reflections_intent_header$ Klidná mýtina"
 pilgrimage_intent.1030.desc: "Tady v tichu u cesty skrze [ROOT.Char.GetCurrentLocation.GetName] mě zaplaví tak hluboký pocit míru a klidu, jaký jsem dosud nezažil.\n\nZa nízkým hřebenem spatřím stranou od stezky mýtinu, kam podle všeho už celá desetiletí nevkročil člověk ani zvíře. Cítím tu přítomnost, kterou vyzařuje [ROOT.Char.GetFaith.HighGodName|U], a možná bych zde [Select_CString(ROOT.Char.IsFemale,'měla','měl')] chvíli setrvat v tichém rozjímání."
 pilgrimage_intent.1030.desc_sea: "Tady na moři, když je počasí klidné a na obzoru není jediná loď, působí okolní mír a ticho téměř omamně. Zvlášť silně tu cítím přítomnost, kterou vyzařuje [ROOT.Char.GetFaith.HighGodName|U], a zcela mě naplňuje.\n\nMožná bychom měli využít příležitosti k tichému rozjímání a v této zátoce ještě chvíli setrvat?"
 pilgrimage_intent.1030.a: "Taková je vůle, kterou hlásá [ROOT.Char.GetFaith.HighGodName|U]."
 pilgrimage_intent.1030.b: "Nesmíme se zdržovat!"
 pilgrimage_intent.1040.t: "$reflections_intent_header$ Zvířecí znamení"
 pilgrimage_intent.1040.desc.intro: "Když kráčíme po této posvátné cestě, náhle se musíme zastavit. Přímo doprostřed stezky před námi vstoupí zvíře.\n\n"
 pilgrimage_intent.1040.desc.mid.pred: "Mezi mnou a Svatou zemí stojí mohutný [ROOT.Char.Custom('GetAnimalType')]."
 pilgrimage_intent.1040.desc.mid.prey: "Skromný [ROOT.Char.Custom('GetAnimalType')] upřeně hledí na naši posvátnou karavanu."
 pilgrimage_intent.1040.desc.outro: "\n\nVe tváři toho zvířete je cosi zvláštně chápavého. Jako by se za těmi divokými očima skrývala mysl [Select_CString(ROOT.Char.IsFemale,'moudré stařeny','moudrého starce')]. Zvíře zamrká a pak pokračuje svou cestou."
 pilgrimage_intent.1040.a: "Ten [ROOT.Char.Custom('GetAnimalType')] je posel, kterého seslal [ROOT.Char.GetFaith.HighGodName]! Za ním!"
 pilgrimage.you_lose_the_animal.t: "Zvíře ztraceno"
 pilgrimage.you_lose_the_animal.desc: "Ztratil jsi [ROOT.Char.Custom('GetAnimalType')]"
 pilgrimage_intent.1040.b: "Nesmíme se nechat rozptylovat."
 pilgrimage_intent.1041.t: "Znamení: Úspěšný lov"
 pilgrimage_intent.1041.desc.intro: "Vytrvale sleduji [ROOT.Char.Custom('GetAnimalType')] a dávám si pozor, aby si mě zvíře nevšimlo.\n\nNakonec narazí na svou kořist: malého ptáčka."
 pilgrimage_intent.1041.desc.mid: "[ROOT.Char.Custom('GetAnimalType')] vyrazí k útoku, a když se ptáček chabě pokusí uniknout, během okamžiku z něj zůstane jen změť peří a krve."
 pilgrimage_intent.1041.desc.outro: "\n\nCo mi tím chtěl [ROOT.Char.GetFaith.HighGodName|U] říct?"
 pilgrimage_intent.1041.a: "Mé války budou úspěšné!"
 pilgrimage_intent.1041.b: "Až zaútočím, mí nepřátelé padnou!"
 pilgrimage_intent.1042.t: "Znamení: Neúspěšný lov"
 pilgrimage_intent.1042.desc.mid: "[ROOT.Char.Custom('GetAnimalType')] trpělivě čeká na vhodný okamžik, až se nakonec vrhne na ptáka. Ten mu však unikne a odletí do širého nebe."
 pilgrimage_intent.1042.a: "Jsem [ROOT.Char.Custom('GetAnimalType')] a mí nepřátelé mě přemohou."
 pilgrimage_intent.1042.b: "Jsem ten pták a uniknu zlému osudu!"
 pilgrimage_intent.1043.t: "Znamení: Šťastná rodina"
 pilgrimage_intent.1043.desc.intro: "Sleduji [ROOT.Char.Custom('GetAnimalType')] a držím se dostatečně daleko, aby se zvíře nevyplašilo. Nakonec na mýtině potká další [ROOT.Char.Custom('GetAnimalType')]. Je to snad jeho protějšek?\n\n"
 pilgrimage_intent.1043.desc.mid: "Nejdřív do sebe trochu strkají hlavami, ale brzy se k sobě něžně přitulí a společně zmizí v divočině."
 pilgrimage_intent.1043.a: "Brzy budu mít dítě!"
 pilgrimage_intent.1043.b: "Musím si z nepřátel udělat přátele."
 pilgrimage_intent.1043.c: "Rodina musí být na prvním místě."
 pilgrimage_intent.1044.t: "Znamení: Hrůzný výjev"
 pilgrimage_intent.1044.desc.mid: "Obě zvířata se k sobě přibližují, ale ještě než se setkají, zničehonic se vyřítí rozmazaný stín a jedno z nich roztrhá na krvavou skvrnu přímo před očima toho druhého."
 pilgrimage_intent.1044.a: "Něco si pro mě jde!"
 pilgrimage_intent.1044.b: "Zničím své nepřátele, aniž si mě kdo všimne!"
 you_follow_the_animal_tt: "Následuješ zvíře dál do divočiny..."
 pilgrimage_intent.1050.t: "$reflections_intent_header$ Pozemské rozjímání"
 pilgrimage_intent.1050.desc.intro: "Na cestě do Svaté země potkávám nejrůznější poutníky, mladé i staré. Jako bych před sebou sledoval celý svůj život utkaný do jediné tapisérie.\n\n"
 pilgrimage_intent.1050.desc.mid.old: "Stříbrné vlasy a vrásčitá kůže mi vždy připadaly tak vzdálené, dokud se nestaly i mou součástí. Nemohu se zbavit pocitu, že tato pouť možná bude mou poslední, než se vydám na závěrečnou cestu do [ROOT.Char.GetFaith.PositiveAfterLife|U]."
 pilgrimage_intent.1050.desc.mid.young_and_dying: "Kvůli chatrnému zdraví bude můj život nejspíš kratší než život většiny ostatních. Když hledím na usměvavé tváře těch, kteří měli to štěstí dožít se vysokého věku, nedokážu jim jejich dlouhý život nezávidět."
 pilgrimage_intent.1050.desc.mid.young: "Stále mám před sebou velkou část života, a přesto se tváří v tvář věčnosti zdá tak nesmírně krátký."
 pilgrimage_intent.1050.desc.outro: "\n\nMožná bych se měl na chvíli zastavit a zamyslet nad pomíjivostí života."
 pilgrimage_intent.1050.a: "Využiji svůj čas naplno."
 pilgrimage_intent.1050.b: "Ještě mám před sebou tolik života!"
 pilgrimage_intent.1050.c: "Z těchto myšlenek mě bolí u srdce."
 pilgrimage_intent.1060.t: "$reflections_intent_header$ Říše dávných časů"
 pilgrimage_intent.1060.desc.intro: "Při putování po této cestě narážím na nesčetné připomínky těch, kteří tu byli přede mnou.\n\nTady v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 pilgrimage_intent.1060.desc.mid.rome: "narazím na rozpadající se pozůstatky svatyně zasvěcené starověkému římskému panteonu. [GetFaithByKey('hellenic_pagan').FertilityGodName|U] se na mě v celé své kráse usmívá napůl popraskanými rty, zatímco [GetFaithByKey('hellenic_pagan').HighGodName|U] má tvář erozí téměř vymazanou k nepoznání."
 pilgrimage_intent.1060.desc.mid.israel: "vidím nesčetné připomínky dávných Hebrejců, kteří kdysi putovali do této země zaslíbené jejich lidu. Starobylé chrámy, v nichž byl kdysi uctíván [GetFaithByKey('rabbinism').HighGodName|U], nyní chátrají poté, co byli Hebrejci opět vyhnáni do exilu."
 pilgrimage_intent.1060.desc.mid.egypt: "spatřím monumentální stavby dávných faraonů. Celé životy věnovali budování těchto obrovských poct svým bohům z alabastru a zlata, jen aby je dnes pokrýval písek a věk je pomalu obracel v prach."
 pilgrimage_intent.1060.desc.mid.persia: "narážím na stopy dávných Sásánovců, Parthů a Seleukovců. V Persii povstalo a zaniklo bezpočet říší, samotná Persie však přetrvala. Staré zoroastriánské chrámy chátrají po celé zemi a možná se jednou v prach obrátí i naše svatá města."
 pilgrimage_intent.1060.desc.mid.ashokas_pillars: "narazím na další z Ašókových sloupů, vztyčených před tak dávnou dobou. Do každého z nich jsou vytesány výnosy, které císař Ašóka vydal před staletími. Tyto dharmické památníky dodnes stojí po celém území někdejší Maurjovské říše, samotná říše je však už jen prachem."
 pilgrimage_intent.1060.desc.mid.kush: "vidím připomínky mnoha říší, které podél Nilu povstaly a padly. Kúšské pyramidy, aksúmské chrámy... Sotva lze někam dojít, aniž by člověk spatřil rozpadající se památku minulosti."
 pilgrimage_intent.1060.desc.mid.fallback: "vidím připomínky těch, kteří tuto zemi obývali dávno před námi. Staré chrámy, polámané zbraně, úlomky předmětů, jejichž původ už nelze rozpoznat. Čas si nakonec vezme nás všechny a božstva, která uctíváme, stejně jako způsoby jejich uctívání, se neustále mění."
 pilgrimage_intent.1060.desc.outro: "\n\nMožná se jednou po této cestě vydá někdo jiný a bude rozjímat nad pádem [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] i nad [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] vírou, kterou [ROOT.Char.GetTitleAsNameNoTooltip|U] [Select_CString(ROOT.Char.IsFemale,'vyznávala','vyznával')]."
 pilgrimage_intent.1060.a: "Měl bych rozjímat o dávných říších."
 pilgrimage_intent.1060.b: "Měl bych rozjímat o dávných vírách."
 pilgrimage_intent.1060.c: "Nesmysl, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] přetrvá navěky!"
 pilgrimage.drive_to_succeed.t: "Odhodlání uspět"
 pilgrimage.existential_dread.t: "Existenciální úzkost"
 pilgrimage.existential_dread.desc: "Zaplaví tě existenciální úzkost"
 pilgrimage.drive_to_survive.t: "Odhodlání přežít"
 pilgrimage.drive_to_survive.desc: "Jsi odhodlán přežít"
 pilgrimage.imperial_contemplation.t: "Rozjímání o říších"
 pilgrimage.imperial_contemplation.desc: "Rozjímáš nad pomíjivostí říší"
 pilgrimage.godly_meditation.t: "Rozjímání o božství"
 pilgrimage.godly_meditation.desc: "Rozjímáš nad podstatou božství"
 pilgrimage.failed_contemplation.t: "Neúspěšné rozjímání"
 pilgrimage.failed_contemplation.desc: "Ve svém rozjímání se nikam neposuneš"
 pilgrimage_intent.1100.t: "$reflections_intent_header$ Hvězdná obloha"
 pilgrimage_intent.1100.desc: "Když jsem takhle pozdě v noci venku, občas pohlédnu ke hvězdám a přemýšlím. Jaký je vlastně smysl našeho života?\n\nDokáže mě [ROOT.Char.GetFaith.PantheonTerm] vůbec vidět tak daleko od domova? Proč to všechno vlastně dělám?"
 pilgrimage_intent.1100.a: "Je to přece má posvátná povinnost!"
 pilgrimage_intent.1100.b: "Ve skutečnosti chci poznávat jiné kultury a užívat si jejich rozmanitost."
 pilgrimage_intent.1100.c: "Dělám jen to, co ode mě mé postavení vyžaduje."
 pilgrimage_intent.1110.t: "Mořské nohy"
 pilgrimage_intent.1110.t_altruism: "$altruism_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_reflection: "$reflections_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_zealot: "$zealotry_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.desc: "Když se během plavby do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] procházím po lodi, zahlédnu jednoho ze spolupoutníků, kterému očividně není vůbec dobře. Na pohybující se palubu si zkrátka nikdy nezvykl.\n\nSedí v podřepu u zábradlí, tiše naříká a křečovitě se ho drží, zatímco jeho tvář střídá jeden bledý odstín za druhým."
 pilgrimage_intent.1110.desc.outro_altruism: "\n\nMěl bych tomu ubožákovi nějak pomoci. Možná nabídnout trochu své vody?"
 pilgrimage_intent.1110.desc.outro_reflection: "\n\nNezbývá mi než s tím ubožákem soucítit. Proč se #EMP vůbec#! vystavujeme takovým, někdy i životu nebezpečným útrapám?"
 pilgrimage_intent.1110.desc.outro_zealot: "\n\nJsem si jistý, že nám [ROOT.Char.GetFaith.PantheonTerm] pomůže. Možná bychom se měli pomodlit a trochu tomu napomoci?"
 pilgrimage_intent.1110.a: "Všechno bude v pořádku, jen se drž."
 pilgrimage_intent.1110.b: "Zkoušky a strasti #EMP k pouti prostě patří#!..."
 pilgrimage_intent.1110.c: "Pomodleme se za tvé uzdravení."
 pilgrimage_intent.1110.d: "Na to bych měl mít nějaké byliny."
 pilgrimage_intent.1110.e: "Ještě že to nejsem já."
 pilgrimage_intent.9000.t: "$zealotry_intent_header$ Zamilovaný [ROOT.Char.Custom('GetDerogatoryNonbeliever')|U]"
 pilgrimage_intent.9000.desc: "Na tržišti v [background_market_scope.GetName] se znovu objeví známá tvář. Ten člověk nás jako věrné štěně následuje už celé dny.\n\nS prosebným pohledem ke mně promluví: „[ROOT.Char.GetLadyLord|U], váš [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_to_marry_2'))], [entourage_to_marry_2.GetFirstName]... bude mě vůbec někdy milovat? [entourage_to_marry_2.GetFirstNameNoTooltip] vyznává [entourage_to_marry_2.GetFaith.GetAdherentName], zatímco já patřím k [smitten_heathen.GetFaith.GetAdjective] víře... ale mám vůbec nějakou naději?“\n\nZamilovanost je očividná, ale [entourage_to_marry_2.GetFirstNameNoTooltip] působí mnohem nejistěji. Schválil by [ROOT.Char.GetFaith.HighGodName] takový svazek?"
 pilgrimage_intent.9000.seducer: "Ukážu ti, jak se to dělá!"
 pilgrimage_intent.9000.seducer.flavor: "Nauč toho zamilovaného člověka pár triků, jak si omotat [entourage_to_marry_2.GetFirstName] kolem prstu."
 pilgrimage_intent.9000.a.flavor: "V jejich svazku získá [ROOT.Char.GetFaith.HighGodName] nového služebníka!"
 pilgrimage_intent.9000.b.flavor: "[smitten_heathen.GetFaith.GetAdherentNamePlural] jistě mají zajímavé námluvní zvyky. Musím je pozorovat."
 pilgrimage_intent.9000.a: "Přijmi [ROOT.Char.GetFaith.HighGodName] a [entourage_to_marry_2.GetFirstName] bude tvůj."
 pilgrimage_intent.9000.b: "Drahý člověče, měl bys mluvit s #EMP [entourage_to_marry_2.GetFirstName]#!, ne se mnou!"
 pilgrimage_intent.9000.c: "Na tohle nemáme čas..."
 hit_it_off_tt: "Padnou si do oka"
 they_fight_publicly_tt: "Udělají scénu"
