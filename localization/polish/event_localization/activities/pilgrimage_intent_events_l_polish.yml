l_polish:
 pilgrimage_intent.1000.t: "$zealotry_intent_header$ Krize víry"
 pilgrimage_intent.1000.desc: "Když pokračuji ve svém posvátném putování, narazím u krajnice na [sad_peasant.GetWomanMan], od hlavy po paty umazaného a promočeného [Select_CString(sad_peasant.IsFemale,'jejími','jeho')] slzami.\n\n„Jste teď šťastný? Vzali jste mi všechno! Jak mám pokračovat ve světě, kterému vládne bytost tak krutá jako [sad_peasant.GetFaith.HighGodName|U]?“\n\nJe zřejmé, že [sad_peasant.GetSheHe] zoufá a prožívá krizi víry."
 pilgrimage_intent.1000.a: "„Odpověď je v [ROOT.Char.GetFaith.HealthGodName|U].“"
 pilgrimage_intent.1000.a.alternate: "„Mohu nabídnout jiný pohled?“"
 pilgrimage_intent.1000.a.conversion_succesful.t: "Obrácení úspěšné"
 pilgrimage_intent.1000.a.conversion_succesful.desc: "Obrátíte [sad_peasant.GetHerHim]"
 pilgrimage_intent.1000.a.conversion_failed.t: "Obrácení se nezdařilo"
 pilgrimage_intent.1000.a.conversion_failed.desc: "Nepodaří se vám obrátit [sad_peasant.GetHerHim]"
 pilgrimage_intent.1000.b: "„Jsme na posvátném putování. Přidejte se k nám.“"
 pilgrimage_intent.1000.b.joined.t: "Připojí se k pouti"
 pilgrimage_intent.1000.b.joined.desc: "[sad_peasant.GetSheHe|U] se přidává k vaší pouti"
 pilgrimage_intent.1000.b.not_joined.t: "Pozvání odmítnuto"
 pilgrimage_intent.1000.b.not_joined.desc: "[sad_peasant.GetSheHe|U] se nenechá přesvědčit"
 pilgrimage_intent.1000.c: "To jsou slzy [ROOT.Char.GetFaith.TricksterGodNamePossessive|U]."
 pilgrimage_intent.1001.t: "$zealotry_intent_header$ Náchylná mládež"
 pilgrimage_intent.1001.desc: "Na naší pouti do Svaté země jsme už viděli mnohá zvláštní vyznání, a když procházíme [ROOT.Char.GetCurrentLocation.GetName], zahlédnu skupinku dětí, jak se u krajnice hlučně hrají.\n\nVšechny okamžitě přestanou a s údivem nás zírají, jako bychom byli pouhými kuriozitami. Nikdy předtím neviděly [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] poutníky? Jedno dítě navíc vypadá šlechtického původu! Možná by dítě potěšily nějaké příběhy z [ROOT.Char.GetFaith.ReligiousText]."
 pilgrimage_intent.1001.a: "„Naučím tě.“"
 pilgrimage_intent.1001.a.conversion_succesful.t: "$pilgrimage_intent.1000.b.joined.t$"
 pilgrimage_intent.1001.a.conversion_succesful.desc: "Obrátíte dítě"
 pilgrimage_intent.1001.a.conversion_failed.t: "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1001.a.conversion_failed.desc: "Nepodaří se vám obrátit dítě"
 pilgrimage_intent.1001.b: "Pojďme dál."
 pilgrimage_intent.1010.t: "$zealotry_intent_header$ Projíždějící cestující"
 pilgrimage_intent.1010.desc: "Pokračujeme v cestě skrze [ROOT.Char.GetCurrentLocation.GetName], naše nohy jsou unavené a bolavé.\n\nO kousek dál spatříme šlechtice z místního dvora a [convertable_courtier.GetSheHe] k nám dojede, aby se setkal s naší skupinou.\n\n„Zjevně jste ztracený, příteli. Co přivádí nízkého [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] na [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]?“"
 pilgrimage_intent.1010.a: "„Jsme na posvátném putování. Přidejte se k nám.“"
 pilgrimage_intent.1010.a.conversion_succesful.t: "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1010.a.conversion_succesful.desc: "Obrátíte [convertable_courtier.GetHerHim]"
 pilgrimage_intent.1010.a.conversion_failed.t: "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1010.a.conversion_failed.desc: "Nepodaří se vám obrátit [convertable_courtier.GetHerHim]"
 pilgrimage_intent.1010.b: "„To není vaše věc!“"
 pilgrimage_intent.1020.t: "$zealotry_intent_header$ Neznámí poutníci"
 pilgrimage_intent.1020.desc: "Doposud jsme na své trase potkali mnoho [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] poutníků, a všichni byli zbožní a oddaní vůli [ROOT.Char.GetFaith.HighGodNamePossessive|U].\n\nBrzy se ale ocitáme v doprovodu skupiny podivných cestovatelů z dalekých krajů. Představí se jako [pilgrim_character.GetFaith.GetAdherentNamePlural] a říkají nám, že i pro jejich lid je tato trasa posvátná."
 pilgrimage_intent.1020.a: "„Tuto cestu smí podnikat pouze [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].“"
 pilgrimage_intent.1020.a.conversion_succesful.t: "$pilgrimage_intent.1000.a.conversion_succesful.t$"
 pilgrimage_intent.1020.a.conversion_succesful.desc: "Obrátíte poutníky"
 pilgrimage_intent.1020.a.conversion_failed.t: "$pilgrimage_intent.1000.a.conversion_failed.t$"
 pilgrimage_intent.1020.a.conversion_failed.desc: "Nepodaří se vám obrátit poutníky"
 pilgrimage_intent.1020.b: "„Povězte mi, jak uctíváte [pilgrim_character.GetFaith.HighGodName|U].“"
 pilgrimage_intent.1020.c: "Jsme si tak podobní, měli by se k nám přidat!"
 cheaper_to_convert_to_pilgrim_faith_tt: "Získáte #P 50%#! slevu při konverzi na [THIS.Char.GetFaith.GetName]"
 pilgrimage_intent.1030.t: "$reflections_intent_header$ Klidná mýtina"
 pilgrimage_intent.1030.desc: "Zde v tichu u krajnice [ROOT.Char.GetCurrentLocation.GetName] mě zaplavuje ohromný pocit míru a klidu, jaký jsem dosud nezažil.\n\nHned za malým hřebenem spatřím mýtinu u cesty, kam se zdá, že už desetiletí nevkročil člověk ani zvíře. Cítím zde přítomnost [ROOT.Char.GetFaith.HighGodNamePossessive|U], a možná bych zde [Select_CString(ROOT.Char.IsFemale,'měla','měl')] chvíli setrvat v tichém rozjímání."
 pilgrimage_intent.1030.desc_sea: "Tady na moři, když je počasí klidné a na obzoru není vidět žádná loď, je mír a ticho ohromující. Přítomnost [ROOT.Char.GetFaith.HighGodNamePossessive|U] je tu obzvlášť silná a naplňuje mě až po okraj.\n\nMožná bychom měli využít příležitosti k tichému rozjímání a chvíli setrvat v této zátoce?"
 pilgrimage_intent.1030.a: "To je vůle [ROOT.Char.GetFaith.HighGodNamePossessive|U]."
 pilgrimage_intent.1030.b: "Nesmíme otálet!"
 pilgrimage_intent.1040.t: "$reflections_intent_header$ Zvířecí znamení"
 pilgrimage_intent.1040.desc.intro: "Jak kráčíme po této posvátné cestě, náhle se musíme zastavit, protože zvíře vykročí přímo doprostřed naší cesty.\n\n"
 pilgrimage_intent.1040.desc.mid.pred: "Mezi mnou a Svatou zemí stojí mohutný [ROOT.Char.Custom('GetAnimalType')]."
 pilgrimage_intent.1040.desc.mid.prey: "Pokorný [ROOT.Char.Custom('GetAnimalType')] zírá na náš posvátný karavan."
 pilgrimage_intent.1040.desc.outro: "\n\nNa tváři zvířete je cosi povědomého. Jako by za těmi divokými očima sídlila mysl moudrého [ROOT.Char.GetWomanMan]. [ROOT.Char.GetSheHe|U] mrkne a pak pokračuje [Select_CString(ROOT.Char.IsFemale,'její','jeho')] cestou."
 pilgrimage_intent.1040.a: "Ten [ROOT.Char.Custom('GetAnimalType')] je posel [ROOT.Char.GetFaith.HighGodName]! Následujte [ROOT.Char.GetHerHim]!"
 pilgrimage.you_lose_the_animal.t: "Zvíře ztraceno"
 pilgrimage.you_lose_the_animal.desc: "Ztratili jste [ROOT.Char.Custom('GetAnimalType')]"
 pilgrimage_intent.1040.b: "Nemůžeme se nechat rozptýlit."
 pilgrimage_intent.1041.t: "Znamení: úspěšný lov"
 pilgrimage_intent.1041.desc.intro: "Pilně následuji [ROOT.Char.Custom('GetAnimalType')], dbaje na to, aby si [Select_CString(ROOT.Char.IsFemale,'nevšimla','nevšiml')] mé přítomnosti.\n\nNakonec [ROOT.Char.GetSheHe] narazí na svou kořist: malého ptáčka."
 pilgrimage_intent.1041.desc.mid: "[ROOT.Char.Custom('GetAnimalType')] provede svůj útok, a když se pták slabě snaží uniknout, je rychle roztrhán a zanechá po sobě peří a krev."
 pilgrimage_intent.1041.desc.outro: "\n\nCo tím mohl myslet [ROOT.Char.GetFaith.HighGodName|U]?"
 pilgrimage_intent.1041.a: "Moje války budou úspěšné!"
 pilgrimage_intent.1041.b: "Moji nepřátelé padnou, až zaútočím!"
 pilgrimage_intent.1042.t: "Znamení: neúspěšný lov"
 pilgrimage_intent.1042.desc.mid: "Ten [ROOT.Char.Custom('GetAnimalType')] čeká a čeká na svou příležitost, nakonec zaútočí na ptáka, který mu ale proklouzne a odletí do otevřeného nebe."
 pilgrimage_intent.1042.a: "Jsem [ROOT.Char.Custom('GetAnimalType')], a moji nepřátelé mě porazí."
 pilgrimage_intent.1042.b: "Jsem pták a uniknu špatnému osudu!"
 pilgrimage_intent.1043.t: "Znamení: šťastná rodina"
 pilgrimage_intent.1043.desc.intro: "Následuji [ROOT.Char.Custom('GetAnimalType')], zůstávám daleko vzadu, abych [ROOT.Char.GetHerHim] [Select_CString(ROOT.Char.IsFemale,'nevyděsila','nevyděsil')]. Nakonec se [ROOT.Char.GetSheHe] na mýtině setká s jiným [ROOT.Char.Custom('GetAnimalType')], možná je to [Select_CString(ROOT.Char.IsFemale,'její','jeho')] partner?\n\n"
 pilgrimage_intent.1043.desc.mid: "Oba si trochu poťukají hlavami, ale brzy se přitisknou a pak spolu rychle zmizí v divočině."
 pilgrimage_intent.1043.a: "Brzy budu mít dítě!"
 pilgrimage_intent.1043.b: "Musím si z nepřátel udělat přátele."
 pilgrimage_intent.1043.c: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych dát rodině přednost."
 pilgrimage_intent.1044.t: "Znamení: děsivý výjev"
 pilgrimage_intent.1044.desc.mid: "Přiblíží se k sobě, ale než se mohou setkat, z ničeho nic vyskočí rozmazaná stínová postava a promění toho chudáka v krvavou skvrnu přímo před očima jeho druha."
 pilgrimage_intent.1044.a: "Něco jde po mně!"
 pilgrimage_intent.1044.b: "Zničím své nepřátele, aniž by si mne kdo všiml!"
 you_follow_the_animal_tt: "Následujete zvíře hlouběji..."
 pilgrimage_intent.1050.t: "$reflections_intent_header$ Pozemské rozjímání"
 pilgrimage_intent.1050.desc.intro: "Na cestě do Svaté země jsem potkal všelijaké poutníky, mladé i staré. Je to, jako bych byl svědkem tapisérie svého vlastního života, jak se přede mnou odvíjí.\n\n"
 pilgrimage_intent.1050.desc.mid.old: "Stříbrné vlasy a svraštělá kůže se mi vždy zdály tak vzdálené, dokud ke mně nepřišly. Nemohu se ubránit pocitu, že tato pouť může být mou poslední, než podniknu konečnou cestu do [ROOT.Char.GetFaith.PositiveAfterLife|U]."
 pilgrimage_intent.1050.desc.mid.young_and_dying: "Ve své nemocnosti pravděpodobně nebudu žít tak dlouho jako ostatní. Když vidím usměvavé tváře těch, kteří měli to štěstí zestárnout, nemohu si pomoci a závidím jim jejich dlouhé životy."
 pilgrimage_intent.1050.desc.mid.young: "Stále mám před sebou mnoho života, a přesto se vše zdá tak krátké tváří v tvář myšlence věčnosti."
 pilgrimage_intent.1050.desc.outro: "\n\nMožná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] na chvíli zastavit a zamyslet se nad pomíjivostí života."
 pilgrimage_intent.1050.a: "Využiji svůj čas naplno."
 pilgrimage_intent.1050.b: "Ještě mám před sebou tolik života!"
 pilgrimage_intent.1050.c: "Tyto myšlenky mi bolí srdce."
 pilgrimage_intent.1060.t: "$reflections_intent_header$ Říše dávných časů"
 pilgrimage_intent.1060.desc.intro: "Putujíc touto cestou jsem narazil na mnohá připomenutí těch, kteří mi předcházeli.\n\nZde v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip],"
 pilgrimage_intent.1060.desc.mid.rome: "Narazil jsem na rozpadlé pozůstatky svatyně starověkého římského pantheonu. [GetFaithByKey('hellenic_pagan').FertilityGodName|U] ve své [GetFaithByKey('hellenic_pagan').FertilityGodHerHis] kráse se na mě usmívá s poloprasklými ústy, a [GetFaithByKey('hellenic_pagan').HighGodNamePossessive] tvář byla erodována téměř k nepoznání."
 pilgrimage_intent.1060.desc.mid.israel: "Viděl jsem nespočet připomínek starověkých Hebrejců, kteří sem kdysi putovali jako do zaslíbené země. Staré chrámy, které kdysi sloužily k uctívání [GetFaithByKey('rabbinism').HighGodName|U], jsou nyní ponechány zkáze, zatímco Hebrejové byli opět zahnáni do exodu."
 pilgrimage_intent.1060.desc.mid.egypt: "Vidím vztyčené monumenty starověkých faraónů. Strávili celé životy tvorbou těchto obrovských poct svým bohům z alabastru a zlata, a přesto nyní zarůstají pískem a křehnou stářím."
 pilgrimage_intent.1060.desc.mid.persia: "Pořád nacházím připomínky starověkých Sásánovců, Partů a Seleukovců. Nesčetně říší zde v Persii povstalo a padlo, a přesto sama Persie přetrvala. Staré zoroastrijské chrámy zůstávají po celé zemi v rozkladu, a možná jednoho dne i naše svatá města se rozpadnou v prach."
 pilgrimage_intent.1060.desc.mid.ashokas_pillars: "Narazil jsem zase na jeden z Ašókových sloupů, postavený před tak dávnými časy. Každý z nich je opatřen nápisy — edikty císaře Ašóky ze staletí. Tyto dharmické památníky nyní zdobí země, jež kdysi tvořily Mauryjskou říši, ale sama říše je už jen prachem."
 pilgrimage_intent.1060.desc.mid.kush: "Vidím připomínky mnoha říší, které zde povstaly a padly podél Nilu. Pyramidy Kuše, aksiumské chrámy — těžko se kamkoli vydat, aniž byste nezahlédli rozpadlý památník z minulosti."
 pilgrimage_intent.1060.desc.mid.fallback: "Vidím pozůstatky těch, kteří obývali tuto zemi dávno před námi. Staré chrámy, rozbité zbraně, rozlomené předměty beze stopy po původním tvaru. Čas si nás všechny nárokuje a božstva, která uctíváme, i způsoby jejich uctívání se neustále mění."
 pilgrimage_intent.1060.desc.outro: "\n\nMožná se jednoho dne nějaký jiný [ROOT.Char.GetWomanMan] vydá touto cestou a zamyslí se nad padlým [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] a nad [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] vírou praktikovanou jeho [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 pilgrimage_intent.1060.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych rozjímat o starých říších."
 pilgrimage_intent.1060.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych rozjímat o starověkých vírách."
 pilgrimage_intent.1060.c: "To je nesmysl, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] přetrvá navždy!"
 pilgrimage.drive_to_succeed.t: "Hnán touhou po úspěchu"
 pilgrimage.existential_dread.t: "Existenciální úzkost"
 pilgrimage.existential_dread.desc: "Jste naplněn existenciální úzkostí"
 pilgrimage.drive_to_survive.t: "Hnán snahou přežít"
 pilgrimage.drive_to_survive.desc: "Jste hnán snahou přežít"
 pilgrimage.imperial_contemplation.t: "Imperiální rozjímání"
 pilgrimage.imperial_contemplation.desc: "Rozjímáte o pomíjivosti říší"
 pilgrimage.godly_meditation.t: "Božské rozjímání"
 pilgrimage.godly_meditation.desc: "Rozjímáte o povaze božského"
 pilgrimage.failed_contemplation.t: "Neúspěšné rozjímání"
 pilgrimage.failed_contemplation.desc: "Nečiníte žádný pokrok"
 pilgrimage_intent.1100.t: "$reflections_intent_header$ Hvězdné nebe"
 pilgrimage_intent.1100.desc: "Tady venku, pozdě v noci, občas hledím na hvězdy a přemýšlím. Jaký je náš smysl života?\n\nMůže mě [ROOT.Char.GetFaith.PantheonTerm] vůbec spatřit, tak daleko od domova? Proč to všechno dělám?"
 pilgrimage_intent.1100.a: "Samozřejmě, je to má posvátná povinnost!"
 pilgrimage_intent.1100.b: "Co si skutečně přeji, je poznávat a užívat si jiné kultury."
 pilgrimage_intent.1100.c: "Dělám jen to, co moje postavení vyžaduje."
 pilgrimage_intent.1110.t: "Mořské nohy"
 pilgrimage_intent.1110.t_altruism: "$altruism_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_reflection: "$reflections_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.t_zealot: "$zealotry_intent_header$ $pilgrimage_intent.1110.t$"
 pilgrimage_intent.1110.desc: "Při procházce po lodi na naší cestě do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] si všimnu dalšího poutníka, který se nezdá být ve formě. Zjevně [affected_pilgrim.GetSheHe|U] trpí mořskou nemocí.\n\n[affected_pilgrim.GetSheHe|U] tiše kňučí, sedí u zábradlí a drží se ho jako o život, s tváří, která přechází v bledé odstíny."
 pilgrimage_intent.1110.desc.outro_altruism: "\n\nMěl bych se pokusit [affected_pilgrim.GetHerHim] nějak utěšit. Možná bych [affected_pilgrim.GetHerHim] [Select_CString(ROOT.Char.IsFemale,'měla','měl')] nabídnout trochu své vody?"
 pilgrimage_intent.1110.desc.outro_reflection: "\n\nMohu jen soucítit s [affected_pilgrim.GetHerHim]. Proč #EMP do#! si to sobě děláme a vystavujeme se těmto, někdy životu nebezpečným, nástrahám?"
 pilgrimage_intent.1110.desc.outro_zealot: "\n\nJsem si jistý, že [ROOT.Char.GetFaith.PantheonTerm] nám pomůže. Možná bychom měli pronést pár modliteb, aby se to urychlilo?"
 pilgrimage_intent.1110.a: "Všechno bude v pořádku, jen vydrž."
 pilgrimage_intent.1110.b: "Zkoušky a útrapy #EMP jsou#! součást cesty..."
 pilgrimage_intent.1110.c: "Pomodleme se za tvé uzdravení."
 pilgrimage_intent.1110.d: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych na to nějaké byliny."
 pilgrimage_intent.1110.e: "Jsem rád, že to nejsem já."
 pilgrimage_intent.9000.t: "$zealotry_intent_header$ Zamilovaný pohan"
 pilgrimage_intent.9000.desc: "Na trzích v [background_market_scope.GetName] se objevuje známý [smitten_heathen.GetWomanMan]. Jako štěně nás [smitten_heathen.GetSheHe] sleduje už několik dní.\n\nS prosícími očima [smitten_heathen.GetSheHe] vykřikne: „Má [ROOT.Char.GetLadyLord|U] — vaše [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_to_marry_2'))], [entourage_to_marry_2.GetFirstName], bude mě [entourage_to_marry_2.GetSheHe] někdy milovat? Neboť [entourage_to_marry_2.GetSheHe] je [entourage_to_marry_2.GetFaith.GetAdherentName], a já jsem z [smitten_heathen.GetFaith.GetAdjective] víry... ale, je tu šance?“\n\n[smitten_heathen.GetSheHe|U] vypadá zamilovaně, ale [entourage_to_marry_2.GetFirstNameNoTooltip] vypadá méně přesvědčeně. Schválil by [ROOT.Char.GetFaith.HighGodName] toto spojení?"
 pilgrimage_intent.9000.seducer: "Nechte mě vám ukázat, jak se to dělá!"
 pilgrimage_intent.9000.seducer.flavor: "Naučte [smitten_heathen.GetWomanMan] pár fíglů, jak si omotat [entourage_to_marry_2.GetFirstName] kolem prstu."
 pilgrimage_intent.9000.a.flavor: "V jejich svazku nalezne [ROOT.Char.GetFaith.HighGodName] nového služebníka!"
 pilgrimage_intent.9000.b.flavor: "[smitten_heathen.GetFaith.GetAdherentNamePlural] jistě mají zajímavé námluvní rituály, musím je pozorovat."
 pilgrimage_intent.9000.a: "Přijmeš [ROOT.Char.GetFaith.HighGodName], a [entourage_to_marry_2.GetSheHe] bude tvůj."
 pilgrimage_intent.9000.b: "Ó, [Select_CString(ROOT.Char.IsFemale,'drahá','drahý')], měla bys mluvit s #EMP [entourage_to_marry_2.GetHerHim]#!, ne se mnou!"
 pilgrimage_intent.9000.c: "Na to nemáme čas..."
 hit_it_off_tt: "Padli si do noty"
 they_fight_publicly_tt: "Dělají scénu"
