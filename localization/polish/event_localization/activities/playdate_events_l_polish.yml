 playdate.5009.b.critfailure: "Zranění, která [small_kid.GetFirstNameNoTooltip] utrpí, jsou opravdu děsivá"
 playdate_5009_every_child: "Všichni účastníci bez vlastností Bezohlednost nebo Sadismus #negative_value získají stres#!"
 playdate.5009.b: "Na tohle se nemůžu dívat..."
 playdate.5009.c: "„Všichni #EMP PŘESTAŇTE!#!“"
 playdate.5009.c.success: "Rozdivočelé děti okamžitě zpozorní"
 playdate.5009.c.failure: "Tvá slova nikdo neposlouchá"
 playdate.5010.t: "[Select_CString(embarrassed_child.IsFemale,'To je moje holka!','To je můj kluk!')]"
 playdate.5010.desc: "„Dostaň [Select_CString(embarrassed_child.IsFemale,'ji','ho')]! Natlač [Select_CString(embarrassed_child.IsFemale,'ji','ho')] na zeď! Přesně tak!“ Hlas [obnoxious_parent.GetFirstName] burácí přes celé nádvoří. [obnoxious_parent.GetFirstNameNoTooltip] se usadil[Select_CString(obnoxious_parent.IsFemale,'a','')] v rohu, odkud sleduje [embarrassed_child.GetFirstName] při hře s míčem, a vůbec se netají tím, komu fandí.\n\nStačí říct, že [obnoxious_parent.GetFirstNameNoTooltip] bere celou hru #EMP trochu#! příliš vážně.\n\n„Hej! Do [Select_CString(embarrassed_child.IsFemale,'ní','něj')] se nestrká, to je podvádění!“ Výstupy [obnoxious_parent.GetFirstName] mi už opravdu začínají lézt na nervy."
 playdate.5010.a: "[obnoxious_parent.GetFirstNameNoTooltip] těmi pažemi máchá opravdu hodně..."
 playdate.5010.a_flavor: "Budu předstírat, že mě [obnoxious_parent.GetFirstNameNoTooltip] [Select_CString(obnoxious_parent.IsFemale,'uhodila','uhodil')]!"
 playdate.5010.a.tt: "Kdybych předstíral[Select_CString(ROOT.Char.IsFemale,'a','')], že mě při tom máchání rukama [obnoxious_parent.GetFirstNameNoTooltip] zasáhl[Select_CString(obnoxious_parent.IsFemale,'a','')], možná by konečně odešel[Select_CString(obnoxious_parent.IsFemale,'a','')]?"
 playdate.5010.a.tt.success: "Tvé herecké představení vyvolá pořádnou reakci..."
 playdate.5010.a.success: "Všichni se kolem tebe v šoku seběhnou"
 playdate.5010.a.failure: "Nikdo ti nevěří"
 playdate.5010.b: "„Můžeš už prosím tě držet zobák?!“"
 playdate.5010.c: "Prostě to nějak vydržím."
