l_polish:
 playdate_phase: "Setkání"
 child_return_from_playdate_title: "Dítě se vrátilo"
 child_return_from_playdate_desc: "[child_scope.GetShortUIName] se [Select_CString(child_scope.IsFemale,'vrátila','vrátil')] ze setkání vrstevníků na [host.GetShortUINamePossessive] dvoře"
 playdate_header: "Setkání vrstevníků:"
 playdate.0010.desc: "Proč vůbec přijímat mé pozvání, když pak jdeš na setkání vrstevníků k [other_host.GetTitledFirstNamePossessive] dvoru?! Tohle si budu pamatovat."
 playdate.0010.a: "Jejda."
 playdate.1001.opening_desc: "Přijď se setkat se svými vrstevníky na můj dvůr v [barony.GetNameNoTier]!"
 playdate.1001.host_likes_me: "Doufám, že přijdeš, už dlouho totiž čekám na příležitost tě zase vidět!"
 playdate.1001.host_dislikes_me: "Zvu každého, kdo něco znamená, což bohužel zahrnuje i tebe."
 playdate.1001.host_gets_along_with_me: "Doufám, že přijdeš. Kdybys nepřišel, moc bys mi chyběl!"
 playdate.1001.a: "Jasně, přijdu."
 playdate.1001.b: "Ne, odmítám!"
 playdate.1002.opening_desc: "Velmi by mě potěšilo, kdyby [child_scope.Custom2('YourCharacterIntroduction', ROOT.Char)] [Select_CString(child_scope.IsFemale,'zavítala','zavítal')] na můj dvůr v [barony.GetNameNoTier] a [Select_CString(child_scope.IsFemale,'setkala','setkal')] se tu se svými vrstevníky!"
 playdate.1002.host_likes_child: "Doufám, že dorazí, už dlouho totiž čekám na příležitost znovu se setkat!"
 playdate.1002.host_dislikes_child: "Zvu každého, kdo něco znamená, takže bohužel nemohu vynechat ani vaše dítě."
 playdate.1002.host_gets_along_with_child: "Doufám, že dorazí. Kdyby nepřišlo, moc by mi chybělo!"
 playdate.1002.a: "Samozřejmě, přijde."
 playdate.1002.b: "Musím odmítnout."
 playdate.2001.t: "Setkání"
 playdate.2001.desc_opening: "Všichni jsou tady!\n\nKdyž do místnosti přicházejí všichni ti malí páni a dámy, jsem čím dál nedočkavější."
 playdate.2001.desc_guest_of_interest_1_2_3: "Mám obrovskou radost, že dorazili jak [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)], tak [guest_of_interest_2.Custom2('MyCharacterIntroduction', ROOT.Char)]. A to ani nemluvím o [guest_of_interest_3.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 playdate.2001.desc_guest_of_interest_1_and_2: "Mám obrovskou radost, že dorazili jak [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)], tak [guest_of_interest_2.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 playdate.2001.desc_guest_of_interest_1: "Mám obrovskou radost, že [guest_of_interest_1.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(guest_of_interest_1.IsFemale,'dorazila','dorazil')]!"
 playdate.2001.desc: "Mám radost, že strávím nějaký čas s ostatními dětmi!"
 playdate.2001.desc_guest_of_interest_4: "Méně už mě těší, že [guest_of_interest_4.Custom2('MyCharacterIntroduction', ROOT.Char)] také [Select_CString(guest_of_interest_4.IsFemale,'dorazila','dorazil')]. No nic, budu dělat, že tu není."
 playdate.2001.a: "Vítejte!"
 playdate.2001.a.tt: "Setkání vrstevníků začíná"
 playdate.2003.t: "$playdate_header$ Mizerná oslava"
 playdate.2003.desc: "Nemůžu tomu uvěřit! Přes všechna má pozvání a přípravy na setkání vrstevníků nikdo nepřišel.\n\nAle mně je to jedno. Všechny ty sladkosti budu mít pro sebe. A ty hračky. A... A... Proč nikdo nepřišel?"
 playdate.2003.a: "Proč nikdo nepřišel?"
 playdate.2501.t: "Vřelé přivítání"
 playdate.2501.likes_host: "Všichni se shromáždili v síni a [host.GetTitledFirstNameNoTooltip] nás vítá na setkání vrstevníků!"
 playdate.2501.dislikes_host: "Všichni se shromáždili v síni a [host.GetTitledFirstNameNoTooltip] nás vítá na setkání vrstevníků. [host.Custom2('InsultAdjective', ROOT.Char)]..."
 playdate.2501.a: "Těším se!"
 playdate.2501.a_dislike: "Ať už to máme za sebou."
 playdate.0020.t: "$playdate_header$ Konec her"
 playdate.0020.desc: "Říkají, že [host.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(host.IsFemale,'zemřela','zemřel')], ale nikdo mi nedokáže vysvětlit, co to vlastně znamená. Vím jen, že setkání vrstevníků tím končí."
 playdate.0020.a: "Ale vždyť jsme si to tak užívali!"
 playdate.0020.a.tt: "#F Víš... tedy dokud [Select_CString(host.IsFemale,'nezmizela','nezmizel')].#!"
 playdate.0021.desc: "Teď když trčím za mřížemi, moje setkání vrstevníků se ruší. Ach, tolik hodin očekávání... A všechno k ničemu!"
 playdate.0021.a: "Kolik zábavy jsme mohli zažít..."
 playdate.0022.desc: "[host.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(host.IsFemale,'skončila ve vězení','skončil ve vězení')] a setkání vrstevníků je u konce. Jaká smůla!"
 playdate.3001.t: "Drsná hra"
 playdate.3001.desc: "Myslím si, že [guest.Custom2('MyCharacterIntroduction', ROOT.Char)] a [peasant_child.Custom('GirlBoy')] z vesnice jen předstírají rvačku, ale najednou je na zemi krev.\n\n[guest.GetFirstNameNoTooltip] s bolestným zasténáním padá k zemi a dítě z vesnice stojící opodál se chystá zaútočit znovu."
 playdate.3001.a: "Musím [Select_CString(guest.IsFemale,'ji','ho')] zachránit!"
 playdate.3001.a_injured: "Jsi [Select_CString(ROOT.Char.IsFemale,'zraněná','zraněný')]"
 playdate.3001.b: "„Prosím, ať mi někdo pomůže!“"
 playdate.3001.c: "To vypadá zábavně, taky si chci zkusit zabojovat!"
 playdate.3002.t: "Tajemství"
 playdate.3002.desc: "[secret_holder.Custom2('MyCharacterIntroduction', ROOT.Char)|U] očividně něco skrývá.\n\nJenže právě když už se mi to [secret_holder.GetFirstNameNoTooltip] chystá prozradit, přichází [close_participant.Custom2('MyCharacterIntroduction', ROOT.Char)] a naléhá, abych si šel zahrát šachy."
 playdate.3002.a: "Jasně. Hloupá tajemství mě nezajímají."
 playdate.3002.b: "Pššt, chci to tajemství slyšet!"
 playdate.3003.t: "[ROOT.Char.Custom('CatStoryName')]"
 playdate.3003.desc_opening: "Přivádím s sebou svou kočku [ROOT.Char.Custom('CatStoryName')], aby všichni viděli, jak úžasnou kočičku mám.\n\n"
 playdate.3003.desc_bonding_cat_opening: "„Ty máš ale roztomilou kočku! Chceš vidět tu moji?“"
 playdate.3003.desc_bonding_cat: "[guest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi ukazuje [guest.Custom('CatFurColor')] kočku. „Jmenuje se [guest.Custom('CatStoryName')]!“"
 playdate.3003.desc_bonding_dog_opening: "„Ty máš ale roztomilou kočku! Chceš vidět mého psa?“"
 playdate.3003.desc_bonding_dog: "[guest.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi ukazuje [guest.Custom('DogFurColor')] psa. „Jmenuje se [guest.Custom('DogStoryName')]!“"
 playdate.3003.a_cat: "Tvoje kočka je tak roztomilá!"
 playdate.3003.a_dog: "Tvůj pes je tak roztomilý!"
 playdate.3003.b: "Jé, děkuji! Pojď sem, [guest.Custom('DogStoryName')]!"
 playdate.3003.c: "Fuj, to je ale blešák. Na mou kočku nemá!"
 playdate.3004.t: "[ROOT.Char.Custom('DogStoryName')]"
 playdate.3004.desc_opening: "Přivádím s sebou svého psa [ROOT.Char.Custom('DogStoryName')], aby všichni viděli, jak úžasné štěně mám.\n\n"
 playdate.3004.desc_bonding_cat_opening: "„Ty máš ale roztomilého psa! Chceš vidět mou kočku?“"
 playdate.3004.desc_bonding_dog_opening: "„Ty máš ale roztomilého psa! Chceš vidět toho mého?“"
 playdate.3004.b: "Jé, děkuji! Pojď sem, [guest.Custom('CatStoryName')]!"
 playdate.3004.c: "Fuj, to je ale blešák. Na mého psa nemá!"
 playdate.3005.t: "Tajemství"
 playdate.3005.desc: "[guest.Custom2('MyCharacterIntroduction', ROOT.Char)] se mnou probírá život u dvora a nejnovější klepy.\n\n„A taky jsem slyšel[Select_CString(ROOT.Char.IsFemale,'a','')], že [secret_owner.GetTitledFirstName] [secret.Custom('SecretDescriptionThirdPerson')]–“\n\nZarazím se, ale už je pozdě. [guest.GetFirstNameNoTooltip] slyšel[Select_CString(guest.IsFemale,'a','')] všechno."
 playdate.3005.a: "Ehm... jejda."
 playdate.3005.b: "Prosím, zapomeň na to, co jsem řekl[Select_CString(ROOT.Char.IsFemale,'a','')]! Udělám cokoli!"
 playdate.3005.c: "Zaplatím ti! Jen mlč!"
 playdate.3005.d: "Jestli to někomu řekneš, tak... tak ti ublížím!"
 playdate.3005.d.success: "[guest.GetFirstNameNoTooltip] slibuje, že bude mlčet"
 playdate.3005.d.failure: "[guest.GetFirstNameNoTooltip] se tě nebojí"
 promise_to_keep_secret: "[guest.GetFirstNameNoTooltip] slibuje, že [Concept('secret','tajemství')|E] neprozradí"
 playdate.3006.t: "Společník ke čtení"
 playdate.3006.desc: "Přinesl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si s sebou malou knížku, jak to obvykle dělám, a právě když se chystám přečíst si pár stránek, přichází [fellow_nerd.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Jé, to je #EMP [SCOPE.Custom('RandomInformativeTextName')|U]#!? Nedávno jsem to četl[Select_CString(fellow_nerd.IsFemale,'a','')]. Co říkáš na styl?“"
 playdate.3006.a: "To bude skvělá debata!"
 playdate.3006.b: "Jdi pryč, čtu si."
 playdate.3007.t: "Šplhání"
 playdate.3007.desc: "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vyšplhal[Select_CString(participant.IsFemale,'a','')] na nejvyšší [ROOT.Char.Custom('ObjectToClimb')] široko daleko a nadšeně na mě gestikuluje, ať lezu také.\n\nNebyl by to první [ROOT.Char.Custom('ObjectToClimb')], na který jsem vyšplhal[Select_CString(ROOT.Char.IsFemale,'a','')], ale nahoru je to pořádný kus..."
 playdate.3007.a: "Necouvnu!"
 playdate.3007.a.success: "Výstup zvládneš"
 playdate.3007.a.failure: "Ošklivě spadneš"
 playdate.3007.b: "Ne, raději zůstanu tady dole."
 playdate.3008.t: "Jdeme se koupat"
 playdate.3008.desc: "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zamířil[Select_CString(participant.IsFemale,'a','')] rovnou k [ROOT.Char.Custom('IndefiniteBodyOfWater')] a bez váhání skočil[Select_CString(participant.IsFemale,'a','')] do vody.\n\nZpočátku jde jen o veselé cákání, ale brzy se pohyby stávají čím dál zoufalejšími a najednou [participant.GetFirstNameNoTooltip] mizí pod hladinou. Jak ubíhají další okamžiky, dochází mi, že se bez pomoci už nevynoří."
 playdate.3008.a: "Vydrž, už jdu!"
 playdate.3008.a.success: "Zachráníš [participant.GetFirstNameNoTooltip]"
 playdate.3008.a.failure: "Nestihneš to včas"
 playdate.3008.a.critical_failure: "Sám[Select_CString(ROOT.Char.IsFemale,'a','')] se málem utopíš"
 playdate.3008.b: "Prosím, pomozte někdo!"
 playdate.3008.b.success: "Někdo tě uslyší a přispěchá na pomoc"
 playdate.3008.b.failure: "Nikdo nepřijde na pomoc"
 playdate.3008.c: "[participant.GetFirstNameNoTooltip] asi odešel[Select_CString(participant.IsFemale,'a','')] domů..."
 playdate.3009.t: "Den ve sněhu"
 playdate.3009.desc_two: "S plnými hrstmi sněhu se plížím za [participant.Custom2('MyCharacterIntroduction', ROOT.Char)] a [to_blame.Custom2('MyCharacterIntroduction', ROOT.Char)]. Právě když se [participant.GetFirstNameNoTooltip] chystá otočit, vrhnu se do útoku!"
 playdate.3009.desc_opening: "S plnými hrstmi sněhu se plížím za [participant.Custom2('MyCharacterIntroduction', ROOT.Char)]. Právě když se [participant.GetFirstNameNoTooltip] chystá otočit, vrhnu se do útoku!"
 playdate.3009.desc: "\n\n[participant.GetFirstNameNoTooltip] vykřikne, ale rychle úder oplatí. Za chvíli už ustupuji a proti mně se plnou rychlostí řítí s obrovskou sněhovou koulí v ruce!"
 playdate.3009.a: "Necouvnu!"
 playdate.3009.a.success: "Vyhraješ sněhovou bitvu"
 playdate.3009.a.failure: "Do hlavy tě zasáhne sněhová koule obalená ledem"
 playdate.3009.b: "Prosím, slitování!"
 playdate.3009.c: "To byl[Select_CString(to_blame.IsFemale,'a','')] [to_blame.GetFirstNameNoTooltip], ne já!"
 playdate.3009.c.success: "[participant.GetFirstNameNoTooltip] ti uvěří"
 playdate.3009.c.failure: "[participant.GetFirstNameNoTooltip] pozná, že lžeš"
 playdate.3010.t: "Tržní den"
 playdate.3010.desc: "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] a já se shodneme, že umění obchodu je pro šlechtice důležitá dovednost, a tak se rozhodneme navštívit místní tržiště v [ROOT.Char.GetCurrentLocation.GetName].\n\nJako peníze máme jen pár oblázků, ale jsou #EMP opravdu#! lesklé!"
 playdate.3010.a: "Ehm, prosil[Select_CString(ROOT.Char.IsFemale,'a bych',' bych')] bych si nějaké zboží."
 playdate.3010.a.success: "Přesvědčíš obchodníka, aby s tebou směňoval"
 playdate.3010.a.failure: "Obchodník tě vyžene"
 playdate.3010.b: "Musíš mi dát, co chci! Jsem přece #EMP [ROOT.Char.GetLadyLord]#!!"
 playdate.3010.c: "Postavme si vlastní stánek!"
 playdate.3010.c.tt: "Někteří obchodníci přistoupí na vaši hru a „koupí“ vaše oblázky za listí"
 playdate.3011.t: "Hra na domácnost"
 playdate.3011.desc: "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází s hromadou látky v náručí. Když ji přede mnou vysype na zem, zjišťuji, že je to hromada oblečení – pro dospělé!\n\n„Pojďme si hrát na domácnost!“"
 playdate.3011.a: "Jedině když budeme rodiče!"
 playdate.3011.b: "Dobře. A [disliked_participant.GetFirstNameNoTooltip] bude pes!"
 playdate.3011.c: "Ne, to je hloupost. Pojďme hrát šachy."
 playdate.3011.c.tt: "Dále se zdokonaluješ v oboru [THIS.Char.Custom('education_focus_child')]"
 playdate.3012.t: "Stateční $knight_culture_player_plural_no_tooltip$"
 playdate.3012.desc_knight: "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] a já sledujeme, jak $knight_culture_player_plural_no_tooltip_lowercase$ cvičí na nádvoří, když k nám s úsměvem přichází [knight.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 playdate.3012.desc_no_knight: "[participant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] a já sledujeme, jak cvičí několik sedláků, když k nám jeden z nich s úsměvem přichází."
 playdate.3012.desc: "\n\n„Tak co, [participant.Custom('GirlsBoysChildren')], myslíte, že zvládnete základy?“"
 playdate.3012.a: "#EMP Ano!#!"
 playdate.3012.a.success: "Pochopíš základy"
 playdate.3012.a.neutral: "Ať se snažíš sebevíc, pořád ti to nejde"
 playdate.3012.a.failure: "Dostaneš pořádnou ránu do hlavy – #EMP opravdu pořádnou#!"
 playdate.3012.b: "Raději se budu dívat, jak cvičíte."
 playdate.3013.t: "[Select_CString(witch.IsFemale,'Moudrá žena','Moudrý muž')]"
 playdate.3013.desc: "Hrajeme si v lese, když najednou zjistím, že jsem úplně sám[Select_CString(ROOT.Char.IsFemale,'a','')]. Přísahal[Select_CString(ROOT.Char.IsFemale,'a','')] bych, že ostatní byli ještě před chvílí hned za mnou!\n\nPrávě se chystám začít křičet – aby mě našli, ne proto, že bych se #EMP bál[Select_CString(ROOT.Char.IsFemale,'a','')]#! – když narazím na [witch.Custom2('MyCharacterIntroduction', ROOT.Char)] v černém plášti. [witch.GetFirstNameNoTooltip] dřepí na zemi a zkoumá nějakou podivnou rostlinu, kterou porovnává s vyobrazením ve velké černé knize rozevřené vedle sebe.\n\n„Zdravím tě, [Select_CString(ROOT.Char.IsFemale,'mladá','mladý')] [ROOT.Char.GetLadyLord]. Přivedla tě ke mně touha po vědění?“"
 playdate.3013.a: "Chci jen vědět něco o té rostlině, kterou držíš."
 playdate.3013.a.success: "Dozvíš se mnoho o bylinách a rostlinách"
 playdate.3013.a.failure: "Vůbec netušíš, o čem [witch.GetFirstNameNoTooltip] mluví"
 playdate.3013.b: "Ano, nauč mě všechno, co umíš!"
 playdate.3013.c: "Ty... Ty jsi čarodějnice! Jsi zlý člověk."
 playdate.3014.t: "[priest.GetCouncilTitle|U]"
 playdate.3014.desc_participant: "Prozkoumáváme místní [ROOT.Char.GetFaith.HouseOfWorship], když [participant.Custom2('MyCharacterIntroduction', ROOT.Char)] a já narazíme na [priest.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(priest.IsFemale,'obklopenou','obklopeného')] svitky.\n\n„Jsou to deníky z dávných časů. Zajímají vás takové věci?“"
 playdate.3014.desc: "Prozkoumávám místní [ROOT.Char.GetFaith.HouseOfWorship], když narazím na [priest.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(priest.IsFemale,'obklopenou','obklopeného')] svitky.\n\n„Jsou to deníky z dávných časů. Zajímají tě takové věci?“"
 playdate.3014.a: "Ano! Nauč mě o nich něco."
 playdate.3014.a.success: "Psaní deníků ti jde od ruky"
 playdate.3014.a.neutral: "Něco málo pochytíš"
 playdate.3014.a.tt: "Dále se zdokonaluješ v oboru [ROOT.Char.Custom('education_focus_child')]"
 playdate.3014.a.tt_participant: "Ty a [participant.GetFirstNameNoTooltip] se dále zdokonalujete v oboru [ROOT.Char.Custom('education_focus_child')]"
 playdate.3014.a.failure: "Nenaučíš se nic"
 playdate.3014.b: "Ne, raději nám vyprávěj o nějakém dobrodružství!"
 playdate.4000.t: "Slzy jako déšť"
 playdate.4000.desc: "Posel přináší chmurné zprávy a malou černou truhlu.\n\n[drowned_participant.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('drowned_participant'))], se [Select_CString(drowned_participant.IsFemale,'utopila','utopil')] při hře s [host.GetTitledFirstName].\n\nPřes oči plné slz sotva dokážu nahlédnout do truhly – ale jediný pohled stačí, abych poznal[Select_CString(ROOT.Char.IsFemale,'a','')], že je to skutečně tělo mého milovaného dítěte."
 playdate.4000.a: "Doufám, že si [participant.GetFirstNameNoTooltip] bude hrát v [ROOT.Char.GetFaith.PositiveAfterLife]."
 playdate.4000.b: "Nevinnost je smrtící jed."
 playdate.4000.c: "Přeji [host.GetTitledFirstNameNoTooltip] stejný osud."
 playdate.4001.t: "Jazyková bariéra"
 playdate.4001.desc.rowdy: "„Řekl[Select_CString(participant.IsFemale,'a','')] jsem #EMP ‚panenka‘#!, ne #EMP ‚pánev‘#!! No tak!“ [participant.GetTitledFirstName] je naší jazykovou bariérou očividně [Select_CString(participant.IsFemale,'rozčilená','rozčilený')]. Rozhazování rukama už vypadá jako začátek pořádného záchvatu vzteku."
 playdate.4001.desc.pensive: "„Promiň... #EMP Příbytek#!. Vrací se do svého skromného příbytku, ne se skromným příbytkem.“ Přes veškerou zdvořilost se [participant.GetTitledFirstNameNoTooltip] frustrovaně mračí."
 playdate.4001.desc: "\n\nJazyky [ROOT.Char.GetCulture.GetLanguage.GetName] a [participant.GetCulture.GetLanguage.GetName] mají zřejmě víc rozdílů než společného, a proto se spolu tak těžko domlouváme.\n\nMožná bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] něco udělat, abychom si mohli hrát bez rozčilování. Nebo mám prostě doufat, že se to nějak vyřeší samo?"
 playdate.4001.a: "Budu mluvit pomalu a nahlas! To určitě pomůže!"
 playdate.4001.b: "Možná bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] požádat [participant.GetFirstNameNoTooltip], aby mě naučil[Select_CString(participant.IsFemale,'a','')] trochu [participant.GetCulture.GetLanguage.GetNameNoTooltip]?"
 playdate.4001.c: "Pche, proč bych se měl[Select_CString(ROOT.Char.IsFemale,'a','')] snažit? Chci se jen bavit!"
 playdate.5001.t: "Půjdeš si hrát?"
 playdate.5001.desc: "Kolem mě proskočí míč a [participant.GetFirstName] ho hned chytá do připravené náruče.\n\n„Nechceš se přidat? Máme míč a pár dalších hráčů by se nám hodilo.“\n\nMalá skupinka dětí se kolem nás shromáždí a s očekáváním čeká na mou odpověď."
 playdate.5001.a: "Přidám se!"
 playdate.5001.a.tt: "Hra začíná!"
 playdate.5001.b: "Moc se mi nechce..."
 playdate.5002.t: "Nepřesná muška"
 playdate.5002.desc: "Míč kolem mě nepravidelně poskakuje, odrazí se od zdi... a vletí do nedaleké zahrady! O zlomek vteřiny později se ozve praskot a rozzuřený výkřik, který nevěstí nic dobrého.\n\n[neighbour.GetFirstName] vyrazí ze dveří a v náručí svírá poškozený [broken_artifact.GetName]. Pohledem přejede celý hlouček a za viníka si vybere mě.\n\n„Co mi k tomu řekneš, ty usmrkaný spratku?“ zavrčí [neighbour.GetFirstNameNoTooltip]. Rozhlédnu se po ostatních, jestli se mě někdo zastane. Nikdo se k tomu nemá."
 playdate.5002.a: "„Opravu zaplatí [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('parent'))]!“"
 playdate.5002.a.tt: "Nebo... vlastně to asi zaplatím #EMP já#!, ale ty peníze mi dlouho chybět nebudou..."
 playdate.5002.b: "„Nařizuji ti vrátit míč. [neighbour.Custom2('InsultNoun', ROOT.Char)]!“"
 playdate.5002.b.tt: "To už [neighbour.GetFirstNameNoTooltip] [Select_CString(neighbour.IsFemale,'zapomněla','zapomněl')], že jsem [ROOT.Char.GetTitleAsNameNoTooltip]?"
 playdate.5002.b.success: "[neighbour.GetFirstNameNoTooltip] poslušně vrátí míč"
 playdate.5002.b.failure: "[neighbour.GetFirstNameNoTooltip] při vracení míče zamračeně hledí"
 playdate.5002.c: "„Promiň. Můžeme dostat míč zpátky?“"
 playdate.5002.c.success: "[neighbour.GetFirstNameNoTooltip] s úsměvem vrátí míč"
 playdate.5002.c.failure: "[neighbour.GetFirstNameNoTooltip] s hlubokým povzdechem vrátí míč"
 playdate.5003.t: "Z jiného těsta"
 playdate.5003.desc: "[other_child.GetFirstName] je prostě příliš rychlý[Select_CString(other_child.IsFemale,'á','')] a silný[Select_CString(other_child.IsFemale,'á','')]! Kdykoli se snažím držet krok, narazím do [other_child.GetFirstNameNoTooltip] a jen se odrazím. I když nakonec ustoupím stranou a sleduji, jak [other_child.GetFirstNameNoTooltip] kope míč přes nádvoří, musím chvíli popadat dech po všem tom běhání.\n\nPřece musí existovat nějaký způsob, jak se vyrovnat takovému soupeři!"
 playdate.5003.a: "[other_child.GetFirstNameNoTooltip] nemá žádnou ochranu holení..."
 playdate.5003.b: "Musím se jen víc snažit!"
 playdate.5003.b.success: "Dokážeš držet krok"
 playdate.5003.b.failure: "[other_child.GetFirstNameNoTooltip] je zkrátka příliš silný[Select_CString(other_child.IsFemale,'á','')]"
 playdate.5003.c: "Když se budu dál dívat, možná něco pochytím."
 playdate.5004.t: "Jiný pohled"
 playdate.5004.desc: "S rachotem se ženeme kolem, smějeme se, pokřikujeme a honíme míč, když mou pozornost upoutá osamělá postava.\n\n[other_child.GetFirstName] sedí opodál a nesměle sleduje naši hru. Na okamžik se naše pohledy střetnou, ale [other_child.GetFirstNameNoTooltip] ihned uhne očima a předstírá zájem o nějaké květiny.\n\nVypadá to, že by [Select_CString(other_child.IsFemale,'uvítala','uvítal')] trochu společnosti."
 playdate.5004.a: "„Nevadí, když si přisednu?“"
 playdate_5004_sports_removal: "Už se nebudeš účastnit probíhající hry s míčem"
 playdate.5004.b: "„Pojď, přidej se k nám!“"
 playdate.5004.b.success: "[other_child.GetFirstNameNoTooltip] se váhavě přidá"
 playdate.5004.b.failure: "Tvé snažení nechává [other_child.GetFirstNameNoTooltip] chladným"
 playdate.5004.c: "Raději nechám [other_child.GetFirstNameNoTooltip] na pokoji."
 playdate.5005.t: "Velká zeď"
 playdate.5005.desc: "Tamhle je míč! Když prolétá kolem mě, rozmáchu se a vší silou do něj kopnu. Až #EMP příliš#! velkou silou.\n\nMíč se prudce roztočí a prosviští vzduchem. Vysoko nad hlavami ostatních přeletí celý hlouček a zmizí za nedalekou zdí. Ozve se pořádné žuchnutí.\n\nVzhlédnu ke zdi. Je docela vysoká, víc než dvakrát vyšší než já."
 playdate.5005.ending: "Vlastně je na můj vkus až moc vysoká. Když přemýšlím, co teď, všimnu si, že opodál stojí [bullied_kid.GetFirstName] a ze všech sil se snaží dívat kamkoli, jen ne na zeď."
 playdate.5005.a: "Pro míč by měl[Select_CString(bullied_kid.IsFemale,'a','')] dojít [bullied_kid.GetFirstNameNoTooltip]!"
 playdate.5005.b: "Tak dobře, #EMP zdi#!, jdu na to..."
 playdate.5005.b.success: "Zeď překonáš s naprostou elegancí"
 playdate.5005.b.success.tt: "Všichni účastníci k tobě získají #positive_value 15#! názoru"
 playdate.5005.b.failure: "Přelezeš zeď a získáš míč zpět"
 playdate.5005.b.failure.tt: "Všichni účastníci na tebe ztratí #negative_value 5#! názoru"
 playdate.5005.b.failure.gameends: "Hra s míčem končí"
 playdate.5005.b.critfailure: "Přelézání zpackáš a spadneš"
 playdate.5005.c: "Raději si najdeme něco jiného, co říkáte?"
 playdate.5005.more_balls: "Koupím další míč!"
 playdate.5006.t: "Jdu domů!"
 playdate.5006.desc: "Hra s míčem začíná být až příliš soutěživá. Sotva mě to napadne, dojde k další potyčce. [bully_kid.GetFirstName] rozdá pořádnou ránu a [ball_kid.GetFirstName] po ní končí v nedalekém keři. [bully_kid.GetFirstNameNoTooltip] se tomu samozřejmě začne smát.\n\n„T-to stačí!“ vyhrkne rozzlobeně [ball_kid.GetFirstNameNoTooltip] a dere se z keře. Přitom popadne míč. „Jdu domů a beru si svůj míč!“\n\nRozhostí se trapné ticho."
 playdate.5006.a: "„Promiň, [ball_kid.GetFirstNameNoTooltip].“"
 playdate.5006.a.tt: "Nebyla to tvoje vina, ale [bully_kid.GetFirstNameNoTooltip] se zjevně omlouvat nehodlá..."
 playdate.5006.b: "„Počkej, [ball_kid.GetFirstNameNoTooltip]! Prosím, zůstaň.“"
 playdate.5006.b.success: "Přesvědčíš [ball_kid.GetFirstNameNoTooltip], aby zůstal[Select_CString(ball_kid.IsFemale,'a','')]"
 playdate.5006.b.failure: "[ball_kid.GetFirstNameNoTooltip] stejně odejde"
 playdate.5006.c: "Raději budu mlčet."
 playdate.5006.d: "„Míč tu necháš. Teď je náš.“"
 playdate.5007.t: "Terč posměchu"
 playdate.5007.desc: "Nádvořím se rozléhá hlasitý smích. Kousek ode mě se [sad_kid.GetFirstName] krčí před [bully_kid.GetFirstName], [Select_CString(bully_kid.IsFemale,'která','který')] na [Select_CString(sad_kid.IsFemale,'ni','něj')] posměšně ukazuje.\n\n„Vždyť [Select_CString(sad_kid.IsFemale,'ani pořádně neumí kopnout','ani pořádně neumí kopnout')] do míče! Kdo by se chtěl kamarádit s takovým [sad_kid.Custom2('InsultNoun', SCOPE.sC('bully_kid'))]!“\n\n[sad_kid.GetFirstNameNoTooltip] popotahuje a rozhlíží se, jestli se [Select_CString(sad_kid.IsFemale,'jí','ho')] někdo zastane, ale nikdo se k tomu příliš nemá."
 playdate.5007.a: "„Nech [Select_CString(sad_kid.IsFemale,'ji','ho')] na pokoji!“"
 playdate.5007.a.tt: "Postavíš se tyranovi..."
 playdate.5007.a.success: "Zastrašíš tyrana natolik, že ustoupí"
 playdate.5007.a.failure: "[bully_kid.GetFirstNameNoTooltip] tvou výhrůžku prokoukne a zmlátí tě"
 playdate.5007.b: "„#EMP Já#! bych se s [Select_CString(sad_kid.IsFemale,'ní','ním')] kamarádil[Select_CString(ROOT.Char.IsFemale,'a','')]!“"
 playdate.5007.c: "Raději se do toho nebudu plést."
 playdate.5008.t: "Stařecká chvilka"
 playdate.5008.desc: "„Buďte už #EMP zticha#!, pro [old_timer.GetFaith.HighGodName]!“ [old_timer.GetFirstName] se nad námi vyklání z okna s dělenými tabulkami, brunátný[Select_CString(old_timer.IsFemale,'á','')] vzteky, a hrozí nám pěstí. „Vy zatracené děti děláte takový rámus! Vždyť skoro neslyším vlastní #EMP myšlenky!#!“\n\nZvednu míč, který se ke mně dokutálel, a pozoruji [Select_CString(old_timer.IsFemale,'stařenu','starce')], jak na nás dál bručí. [old_timer.GetFirstNameNoTooltip] je vážně #EMP prastarý[Select_CString(old_timer.IsFemale,'á','')]#!. Možná mu[Select_CString(old_timer.IsFemale,'jí','')] je dokonce třicet nebo čtyřicet let!\n\nNení divu, že se zlobí."
 playdate.5008.a: "„Buď zticha, ty starý[Select_CString(old_timer.IsFemale,'á','')] blázne!“"
 playdate.5008.b: "„Promiňte. Budeme tišší.“"
 playdate.5009.t: "Dupot nohou"
 playdate.5009.desc: "I když jsme ještě děti, hra s míčem dokáže být pěkně drsná. Co začalo jako nevinná hra, se najednou změnilo v pořádnou mele a chvíli mi trvá, než se zase zorientuji.\n\nPak z chumlu zápasících dětí zaslechnu pronikavý výkřik plný bolesti a strachu. Úplně vespod zahlédnu [small_kid.GetFirstName], po [Select_CString(small_kid.IsFemale,'které','kterém')] šlapou desítky nohou. [small_kid.GetFirstNameNoTooltip] žalostně křičí, jenže kolem je příliš velký hluk a ostatní jsou příliš zabraní do hry."
 playdate.5009.a: "„[small_kid.GetFirstNameNoTooltip]! Vydrž, už jdu!“"
 playdate.5009.a.critical_success: "Hrdinsky zachráníš [small_kid.GetFirstNameNoTooltip]"
 playdate.5009.a.success: "Zachráníš [small_kid.GetFirstNameNoTooltip]"
 playdate.5009.a.failure: "Musíš [small_kid.GetFirstNameNoTooltip] chránit vlastním tělem"
