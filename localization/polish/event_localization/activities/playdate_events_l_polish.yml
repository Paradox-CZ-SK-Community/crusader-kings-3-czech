 playdate.5011.t: "Zasloužená odplata"
 playdate.5011.desc: "Zatímco před hloučkem ustaraných dětí předvádím své nejlepší herecké umění, [obnoxious_parent.GetFirstName] na mě hledí s očima málem vylézajícíma z důlků.\n\n„Ty malý... #EMP podvodníku!#!“ zavrčí a rozhořčeně na mě ukáže prstem. „Já ti ukážu—“\n\n„[obnoxious_parent.GetFirstNameNoTooltip]!“ Z dálky se ozve rozzlobený výkřik, který se rychle blíží. [obnoxious_parent.GetFirstNameNoTooltip] zbledne, když na nádvoří vtrhne [responsible_adult.GetFirstName]. „Co to má znamenat?“\n\nNaštěstí mám skvělé rozptýlení, takže můj samolibý, vítězoslavný úšklebek zahlédne jen [obnoxious_parent.GetFirstNameNoTooltip]."
 playdate.5011.a: "„Au, to tak strašně bolí! Auuuuu!“"
 playdate.5011.b: "Asi bych měl[Select_CString(ROOT.Char.IsFemale,'a','')] přiznat pravdu..."
 playdate.9001.t: "Konec zábavy"
 playdate.9001.desc: "Bylo příjemné na chvíli zapomenout na všechny povinnosti a trávit čas s ostatními dětmi, ale prý je načase se k nim zase vrátit...\n\nTolik jsme si toho spolu užili! Snad si to brzy zopakujeme."
 playdate.9001.a: "Tak zase příště!"
 playdate.9002.t: "Návrat domů"
 playdate.9002.desc: "To jsme si ale užili! [host.GetTitledFirstName] a naše společné hry mi ještě dlouho zůstanou v paměti.\n\nTeď mi ale říkají, že je čas sbalit si věci, vrátit se domů a zase se věnovat povinnostem. Snad si to brzy zopakujeme."
 playdate.9002.a: "Sbohem, [host.GetFirstNameNoTooltip]!"
