l_polish:
 tour_grounds_events.6000.t: "Náhodné setkání"
 tour_grounds_events.6000.desc: "Pobyt u vazalů a změna prostředí jsou příjemné, ale neustále jiné uspořádání sídel je čím dál zmatenější. Když jsem odkázán jen sám na sebe, málokdy vím, kde hledat i docela obyčejné věci... třeba něco malého k zakousnutí uprostřed noci.\n\nPři bezcílném bloudění [stop_host_scope.Custom('FortifiedBuilding')] [stop_host_scope.GetTitledFirstNameNoTooltip] náhodou otevřu jedny dveře a za nimi spatřím "
 tour_grounds_events.6000.desc.three_consorts: "[stop_host_scope.GetFirstNameNoTooltip] spolu s [orgy_consort_1.GetFirstNameNoTooltip], [orgy_consort_2.GetFirstNameNoTooltip] a [orgy_consort_3.GetFirstNameNoTooltip], jak stojí nebezpečně blízko u sebe a očividně jsou na pokraji něčeho #EMP intimního.#!\n\n"
 tour_grounds_events.6000.desc.one_consort: "[stop_host_scope.GetFirstNameNoTooltip] spolu s [stop_host_scope.Custom2('RelationToMeShort',orgy_consort_1)] [orgy_consort_1.GetFirstNameNoTooltip], jak stojí nebezpečně blízko u sebe a očividně jsou na pokraji něčeho #EMP intimního.#! Místnost jemně osvětlují svíčky a vzduch naplňuje sladká vůně levandule.\n\n"
 tour_grounds_events.6000.desc.outro: "[stop_host_scope.GetFirstNameNoTooltip] se potutelně usměje a pokyne mi, abych [Select_CString(ROOT.Char.IsFemale,'přistoupila','přistoupil')] blíž."
 tour_grounds_events.6000.a: "To pokušení je příliš silné..."
 tour_grounds_events.6000.b: "„Už jsem [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')], že se nikdy nezeptáš!“"
 tour_grounds_events.6000.c: "Takovou špínou se neposkvrním!"
 tour_grounds_events.6100.t: "[tour_grounds_event_location.Custom('GetSpecialBuildingNameFromProvince')]"
 tour_grounds_events.6100.desc.intro: "„A toto je [tour_grounds_event_location.Custom('GetSpecialBuildingNameFromProvince')]!“ zvolá [stop_host_scope.GetTitledFirstName], když se před námi objeví působivý [stop_host_scope.Custom('GetFaithGrandTemple')].\n\n"
 tour_grounds_events.6100.desc.cynical: "Celý pobyt v [tour_grounds_event_location.GetName] se téhle plánované návštěvy děsím. Můj vztah k božstvu [ROOT.Char.GetFaith.HighGodName] nikdy nebyl blízký a nemám v úmyslu na tom teď něco měnit. Musím však uznat, že to vypadá #EMP působivě#!.\n\nMožná se tu přece jen něco dozvím, ale musím vymyslet, co říct..."
 tour_grounds_events.6100.desc.zealous: "V úžasu hledím na [ROOT.Char.faith.HighGodNamePossessive] dílo v tomto světě. Tato stavba je ztělesněným božstvím."
 tour_grounds_events.6100.desc: "V úžasu hledím na tak zázračnou stavbu. Nádherné detaily propracované v každém koutě krásně kontrastují s pokojem, který člověk cítí v srdci. Toto je skutečně výjimečné místo zasvěcené božstvu [ROOT.Char.GetFaith.HighGodName]."
 tour_grounds_events.6100.a: "Zapálím svíci za [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)]."
 tour_grounds_events.6100.a.tt: "Zapálením svíce zbožně uctíš památku [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip]."
 tour_grounds_events.6100.b: "Pomodlím se za [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe', tour_grounds_6100_beloved_char)]."
 tour_grounds_events.6100.b.tt: "Modlitbou uctíš památku [tour_grounds_6100_beloved_char.GetFirstNameNoTooltip]."
 tour_grounds_events.6100.c: "„Jak byl tento div postaven?“"
 tour_grounds_events.6100.d: "Musím předstírat zájem co nejdéle."
 tour_grounds_events.6100.d.success: "[stop_host_scope.GetFirstNameNoTooltip] tvůj cynismus neodhalí"
 tour_grounds_events.6100.d.failure: "[stop_host_scope.GetFirstNameNoTooltip] tvůj cynismus neschvaluje"
 tour_grounds_events.6200.t: "Bohatá úroda"
 tour_grounds_events.6200.desc: "[stop_host_scope.GetTitledFirstName] mě doprovází na prohlídku pečlivě udržovaných "
 tour_grounds_events.6200.desc.pastures: "pastvin. Po zdejší krajině se potuluje nespočet kusů dobytka. „Tahle zvířata nám dávají víc, než vůbec dokážeme využít! "
 tour_grounds_events.6200.desc.orchard: "sadů. „Naše stromy každou sezónu rodí celé koše šťavnatého ovoce."
 tour_grounds_events.6200.desc.cereal_fields: "polí. „Naši lidé už dávno nemusí mít strach z hladu ani neúrody."
 tour_grounds_events.6200.desc.hill_farms: "horských políček. „Snažíme se co nejlépe využít omezený prostor, který nám tyto kopce nabízejí k obdělávání půdy, a řekl bych, že s velkým úspěchem."
 tour_grounds_events.6200.desc.plantations: "plantáží. „Datle, které zde pěstujeme, jsou naší pýchou. A mezi obchodníky je o ně #EMP obrovský#! zájem."
 tour_grounds_events.6200.outro: "Tady v [tour_grounds_event_location.GetName] máme skutečné požehnání,“ dodá [stop_host_scope.GetFirstNameNoTooltip] se spokojeným úsměvem.\n\nZdá se, že [stop_host_scope.GetFirstNameNoTooltip] přede mnou tají recept na svůj úspěch."
 tour_grounds_events.6200.a: "Panství z toho musí mít větší prospěch!"
 tour_grounds_events.6200.a.tt: "Pokusíš se zvýšit příspěvek, který [stop_host_scope.GetTitledFirstNameNoTooltip] odvádí panství"
 tour_grounds_events.6200.b: "„Tyto znalosti musím přivézt zpět do [root_capital_scope.GetNameNoTooltip].“"
 tour_grounds_events.6200.c: "„Hřeje mě u srdce, když vidím, jak se mému lidu daří.“"
 tour_grounds_events.6201.t: "$tour_grounds_events.6200.t$"
 tour_grounds_events.6201.desc: "Když provázím [visiting_liege.GetTitledFirstName] po [tour_grounds_event_location.GetName] a ukazuji všechnu hojnost, kterou zde s hrdostí vytváříme, začne se návštěva chovat odtažitě. Po několika minutách ticha konečně zazní:\n\n„Vidím, že se ti zde daří a o [tour_grounds_event_location.GetNameNoTooltip] se staráš dobře. Myslím, že nastal čas znovu projednat naše dohody. Část zisku z tvého hospodaření právem náleží koruně.“"
 tour_grounds_events.6201.a: "Vyšší daň zní ještě přijatelně..."
 tour_grounds_events.6201.a.tt: "Vazal souhlasí se zvýšením daně"
 tour_grounds_events.6201.b: "Jednorázový podíl na zisku by měl stačit."
 tour_grounds_events.6201.b.tt: "Vazal se podělí o zisk"
 tour_grounds_events.6201.c: "Zisk z mé práce patří jen mně!"
 tour_grounds_events.6201.c.tt: "Vazal se odmítne podělit o zisk"
 tour_grounds_events.6202.t: "Kapsař"
 tour_grounds_events.6202.desc: "Se [stop_host_scope.GetTitledFirstName] se poklidně procházíme obchodním přístavem v [event_location.GetName]. [stop_host_scope.GetTitledFirstNameNoTooltip] mi ukazuje nejrůznější obchodníky, které se podařilo přilákat do přístavu, i kvalitní zboží, které se zde prodává. Zatímco zaujatě rozmlouváme o námořním obchodu, otře se o mě dítě a zmizí v davu nakupujících a námořníků.\n\nNejdřív si říkám, že je to jen nevychované dítě, ale vzápětí si uvědomím, že můj měšec se zlatem... #EMP je pryč!#!"
 tour_grounds_events.6202.a: "„[stop_host_scope.GetFirstNameNoTooltip]! #EMP Udělej něco!#!“"
 tour_grounds_events.6202.a.tt: "Pověříš svého vazala dopadením zloděje"
 tour_grounds_events.6202.a.success: "[stop_host_scope.GetFirstNameNoTooltip] uspěje"
 tour_grounds_events.6202.a.failure: "[stop_host_scope.GetFirstNameNoTooltip] neuspěje"
 tour_grounds_events.6202.b: "Mě nikdo okrádat nebude!"
 tour_grounds_events.6202.b.success: "Dětský zloděj je dopaden"
 tour_grounds_events.6202.b.failure: "Dětský zloděj zmizí v davu"
 tour_grounds_events.6202.c: "To dítě ty peníze nejspíš potřebuje víc než já..."
 tour_grounds_events.6203.t: "$tour_grounds_events.6202.t$"
 tour_grounds_events.6203.desc: "S [visiting_liege.GetTitledFirstName] se poklidně procházíme obchodním přístavem v [event_location.GetName]. Ukazuji nejrůznější obchodníky, které se mi podařilo přilákat do přístavu, i kvalitní zboží, které se zde prodává. Zatímco zaujatě rozmlouváme o námořním obchodu, otře se o mého lenního pána dítě a zmizí v davu nakupujících a námořníků.\n\n[visiting_liege.GetTitledFirstNameNoTooltip] tomu zpočátku nevěnuje pozornost, ale brzy zjistí, že dítě ukradlo zlato!\n\n„#EMP Okamžitě#! s tím něco udělej, [ROOT.Char.GetFirstNameNoTooltip]!“ zazní vzteklý výkřik..."
 tour_grounds_events.6203.a: "Nejsnazší bude nahradit ukradené zlato."
 tour_grounds_events.6203.toast: "[stop_host_scope.GetShortUINameNoTooltip] nahradí ukradené zlato"
 tour_grounds_events.6203.b: "„Za tím malým zlodějem!“"
 tour_grounds_events.6203.c: "Tohle není můj problém."
 tour_grounds_events.6204.t: "$tour_grounds_events.6202.t$: Dopaden"
 tour_grounds_events.6204.desc.caught_by_liege: "Okamžitě se rozběhnu za malým zlodějem, převracím vozíky a odstrkuji každého, kdo se mi připlete do cesty. Své ukradené zlato dostanu zpět, ať to stojí cokoli.\n\nDítě mám stále na očích a rychle zkracuji náskok, i když se dokáže mrštně protahovat pod stoly obchodníků a kličkovat davem.\n\nNakonec malého zloděje zaženu až k okraji přístavního mola. Honička skončila."
 tour_grounds_events.6204.desc.caught_by_vassal: "Jakmile na [stop_host_scope.GetFirstName] zavolám, aby s tím malým ničemou, který mi ukradl zlato, něco udělal, [stop_host_scope.GetFirstNameNoTooltip] se okamžitě rozběhne za dítětem.\n\nPo chvíli se [stop_host_scope.GetFirstNameNoTooltip] vítězoslavně vrací a v pevném sevření vleče malého zloděje.\n\n„Omlouvám se, můj lenní pane. Je mi hanba, že se něco takového stalo právě zde pod mou ochranou. Našel jsem dítě i vaše zlato. Obojí vám předávám a naložte s tím podle svého uvážení.“"
 tour_grounds_events.6204.a: "„Vezmu si své zlato a půjdu dál.“"
 tour_grounds_events.6204.b: "„Pro tvé #EMP schopnosti#! mám velké plány...“"
 tour_grounds_events.6205.t: "$tour_grounds_events.6202.t$: Ztracen"
 tour_grounds_events.6205.desc: "Jakmile na [stop_host_scope.GetFirstName] zavolám, aby s tím malým ničemou, který mi ukradl zlato, něco udělal, [stop_host_scope.GetFirstNameNoTooltip] se okamžitě rozběhne za dítětem.\n\nPo chvíli se [stop_host_scope.GetFirstNameNoTooltip] sklíčeně vrací, ale po malém zloději není ani stopy. V očích je patrný strach, ruce se třesou a nakonec ze sebe vykoktá:\n\n„Velice se omlouvám, můj lenní pane, ale dítě nám uniklo. Ani já, ani moji strážní ho nedokážeme najít. Obávám se, že vaše zlato je pryč.“"
 tour_grounds_events.6205.a: "Bez svého zlata odsud neodejdu."
 tour_grounds_events.6205.a.success: "[stop_host_scope.GetShortUINameNoTooltip|U] nahradí ukradené zlato"
 tour_grounds_events.6205.a.failure: "Ukradené zlato je navždy ztraceno"
 tour_grounds_events.6205.b: "Někdo za to musí zaplatit..."
 tour_grounds_events.6205.b.flavor: "Zbiješ [stop_host_scope.GetFirstNameNoTooltip] za takovou opovážlivost."
 tour_grounds_events.6205.c: "Máš štěstí, že umím odpouštět."
 tour_grounds_events.6300.t: "Příležitost předvést se"
 tour_grounds_events.6300.desc: "Když mě [stop_host_scope.GetTitledFirstName] provádí po [event_location.GetName], dorazíme na vojenské cvičiště. Všichni zdejší ozbrojenci jsou nastoupeni a ve vzduchu visí napjaté očekávání. [stop_host_scope.GetFirstNameNoTooltip] se široce zazubí.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], slyšeli jsme tolik příběhů o vaší mimořádné udatnosti. Byla by škoda nevyužít příležitosti ukázat těmto vojákům, jak vypadá #EMP skutečný#! cvičný souboj! Utkanete se s [target_knight.GetFirstName] pro dobro panství?“"
 tour_grounds_events.6300.a: "Ukážu jim, jak se to dělá."
 tour_grounds_events.6300.a.success: "Vyhraješ cvičný souboj"
 tour_grounds_events.6300.a.failure: "Prohraješ cvičný souboj"
 tour_grounds_events.6300.flavor: "Utkeš se s [target_knight.GetFirstNameNoTooltip] v souboji jeden na jednoho."
 tour_grounds_events.6300.b: "[tg_6300_stand_in.GetFirstNameNoTooltip] jim jistě předvede víc!"
 tour_grounds_events.6300.b.success: "[tg_6300_stand_in.GetShortUINameNoTooltip|U] vyhraje cvičný souboj"
 tour_grounds_events.6300.b.failure: "[tg_6300_stand_in.GetShortUINameNoTooltip|U] prohraje cvičný souboj"
 tour_grounds_events.6300.c: "Musím zdvořile odmítnout."
