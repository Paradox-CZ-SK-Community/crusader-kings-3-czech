l_polish:
 tour_travel.3000.t: "Žádné [ROOT.Char.GetFaith.HouseOfWorshipPlural|U]?"
 tour_travel.3000.desc: "Při cestě přes [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] navštívím jednu vesnici a nějaký čas rozmlouvám o zdejších bohoslužbách s obzvlášť zbožným rolníkem jménem [pious_peasant.GetName].\n\n„Nemáme tu ani [ROOT.Char.GetFaith.HouseOfWorship]. Když chceme vstoupit do domu zasvěceného božstvu [ROOT.Char.GetFaith.HighGodName|U], musíme cestovat celé dny.“"
 tour_travel.3000.a: "Mohli bychom tu postavit prostý [ROOT.Char.GetFaith.HouseOfWorship]."
 tour_travel.3000.b: "Postavím tu velkolepý [ROOT.Char.GetFaith.HouseOfWorship]."
 tour_travel.3000.c: "„Pak vám nezbývá než jít.“"
 tour_travel.3001.t: "Nečekaný obřad"
 tour_travel.3001.desc: "Zastavili jsme v malé vesnici v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Zvládnu prosedět téměř celou hostinu, než mi dojde, že tu něco nehraje.\n\n[marriage_mother.GetName] neustále mluví o [marriage_candidate.GetName], svém dítěti, ale najednou mi dochází, že se nechlubí, nýbrž #EMP nabízí zboží#!.\n\n„Až se vy dva vezmete, všechno bude naprosto dokonalé!“ prohlásí [marriage_mother.GetNameNoTooltip] s očima zářícíma pýchou."
 tour_travel.3001.desc.drunkard: "Probudím se v mrákotách. Hlava mi třeští, v uších zvoní a světlo se mi zarývá do mysli jako dýky. V ústech mám jako na poušti a než stačím zachraptět o vodu, spatřím u postele cizí selku se džbánem.\n\n„Tady máte, [ROOT.Char.Custom('FormOfAddressForLiege')], po té noci to budete potřebovat!“\n\nOtočím se na posteli a vedle sebe spatřím neznámou osobu pokojně spící.\n\n„Koneckonců se nestává každý den, aby si [Select_CString(marriage_candidate.IsFemale,'má dcera','můj syn')] vzal[Select_CString(ROOT.Char.IsFemale,'a','')] [ROOT.Char.GetTitleAsNameNoTooltip|U]!“"
 tour_travel.3001.a: "To je báječný nápad."
 tour_travel.3001.a.drunkard: "#EMP Co jsem to provedl[Select_CString(ROOT.Char.IsFemale,'a','')]?#!"
 tour_travel.3001.b: "Ne, se špinavou odpornou chátrou se nežení."
 tour_travel.3002.t: "Cena dobyvačné války"
 tour_travel.3002.desc: "„V #EMP tvé válce#! zemřeli všichni tři: [widow_peasant.Custom2( 'RelationToMeShort', widow_father )], [widow_peasant.Custom2( 'RelationToMeShort', widow_husband )] i [widow_peasant.Custom2( 'RelationToMeShort', widow_son )]!“ křičí na mě rolník přes náves.\n\n„Když [battle_memory.GetSecondPerspectiveDescription], pro tebe to bylo vítězství, ale pro mě den, kdy zemřely tři generace mé rodiny.“\n\nHněv vystřídají slzy a další slova už ke mně sotva dolehnou.\n\n„Ty nejsi žádný [ROOT.Char.GetTitleAsNameNoTooltip|l], kterého bych uznával[Select_CString(widow_peasant.IsFemale,'a','')].“"
 tour_travel.3002.a: "„Vrátit je nedokážu, ale snad pomůže alespoň nějaké zlato.“"
 tour_travel.3002.b: "„Byla to oběť, kterou jsem byl[Select_CString(ROOT.Char.IsFemale,'a','')] ochoten[Select_CString(ROOT.Char.IsFemale,'a','')] přinést.“"
 tour_travel.3003.t: "Odporná stvoření"
 tour_travel.3003.desc: "V [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] se zastavujeme, abychom promluvili snad se stým rolníkem za dnešek, a už jen pohled na ty ubohé tvory mi obrací žaludek.\n\nZažloutlé a zohavené zuby, tupé prázdné oči, za nimiž se skrývá negramotný hnijící mozek. Každý z nich si nese bezejmenné choroby, které jim hyzdí tváře nesčetnými vředy a skvrnami.\n\nNedokážu se přimět, aby mě zajímalo jediné jejich slovo."
 tour_travel.3003.a: "Předstírat zájem o ně je mou povinností."
 tour_travel.3003.b: "Řeknu jim, co si o nich myslím."
 tour_travel.3004.t: "Ošklivá socha"
 tour_travel.3004.desc: "Předem mě varovali, že se vesničané v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] složili a vztyčili mou sochu.\n\nKdyž však dorazím a spatřím ji, chvíli vůbec nedokážu pochopit, na co se dívám. Nejenže je to ta nejošklivější socha, jakou jsem kdy viděl[Select_CString(ROOT.Char.IsFemale,'a','')], ale navíc mi není ani trochu podobná!\n\nKdyž se však rozhlédnu kolem sebe, vidím jen hrdé tváře zářící nadšením. To nikdo jiný nevidí, jak příšerné to je?"
 tour_travel.3004.a: "To je... nádhera."
 tour_travel.3004.b: "To má být #EMP vtip#!? Strhněte to!"
 tour_travel.3004.c: "Vlastně je docela věrná."
 tour_travel.3005.t: "Důvěrně známý zločin"
 tour_travel.3005.desc: "Při průjezdu [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] míjím zbědovaného vězně připoutaného ke kůlu jako psa. [criminal_peasant.GetTitledFirstNameNoTooltip] na mě zavolá a prosí o milost.\n\n„Z čeho tě obvinili?“ zeptám se s panovačností hodnou [ROOT.Char.GetTitleAsNameNoTooltip].\n\n„Obviňují mě z toho, že jsem [criminal_secret.GetNameNoTooltip]. Bohužel to nedokážu popřít.“\n\nNa čele se mi objeví několik kapek potu. Koneckonců stejné označení platí i pro #EMP mě#!."
 tour_travel.3005.a: "Propusťte [criminal_peasant.GetTitledFirstNameNoTooltip]!"
 tour_travel.3005.b: "Jak strašlivý, odporný zločin..."
 tour_travel.3006.t: "Život vládce"
 tour_travel.3006.desc: "Shromáždí se kolem mě několik rolníků a žádají, abych jim vyprávěl něco ze svého života. Přemýšlím, co bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] povědět, a na mysl mi přijdou dva příběhy. Vzpomínka na to, jak [positive_memory.GetDescription], je krásná.\n\nNa druhou stranu to, jak [war_memory.GetDescription], je mnohem působivější příběh, který nejspíš probudí věrnost a nadšení."
 tour_travel.3006.a: "Povím jim první příběh."
 tour_travel.3006.b: "Válečné příběhy má rád každý."
 tour_travel.3007.t: "Dům rozkoše"
 tour_travel.3007.desc: "Když se dnes večer zastavíme k odpočinku, jeden z místních nabídne, že nás provede městem.\n\nCo tím přesně myslel, pochopím až ve chvíli, kdy se ocitnu hluboko uvnitř doupěte rozkoše.\n\nPo levici se lidé oddávají jeden druhému, jako by měl nastat konec světa. Po pravici se jakýsi účinkující pokouší o něco, co vypadá jako #EMP [ROOT.Char.Custom('GetDescriptorManeuver')] [random_event_culture.GetNameNoTooltip|l] [ROOT.Char.Custom('GetManeuver')].#!"
 tour_travel.3007.a: "Musím odsud okamžitě pryč."
 tour_travel.3007.b: "Když už jsem tady, můžu se přidat."
 tour_travel.3010.t: "Místní světec"
 tour_travel.3010.desc: "Když putujeme přes [shrine_province.Custom('GetTerrainTypePlural')] a namáhavě se prodíráme [shrine_province.Custom('GetProvinceGroundDesc')], narazíme na skromnou osamělou svatyni. Je hrubě vyřezaná, nahoře ji zdobí [shrine_province.GetCounty.GetFaith.ReligiousSymbol] a pod ním stojí zvětralý nápis:\n\n#EMP „Zde odpočívá svatý [saint_name.GetFirstNameNoTooltip] z [shrine_province.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip], požehnaný potomek kraje [shrine_province.GetNameNoTooltip].“#!\n\nSvatý [saint_name.GetFirstNameNoTooltip]? Z [shrine_province.GetCounty.GetTitle.GetDeJureLiege.GetNameNoTierNoTooltip]? Zdá se, že zdejší lid uctívá místní duchovní postavu, kterou [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetFaith.AltPriestTermPlural] neuznávají..."
 tour_travel.3010.a: "Pryč s touhle heterodoxií!"
 tour_travel.3010.b: "„Svatý [saint_name.GetFirstNameNoTooltip]“... to nezní vůbec špatně."
 tour_travel.3010.c: "Raději bychom měli pokračovat."
 cultural_acceptance_local_saint: "Místní světec"
 tour_travel.3020.t: "O samotě ve tmě"
 tour_travel.3020.desc: "Před večerním [ROOT.Char.GetCurrentLocation.Custom('GetBadWeatherDesc')] se ukryjeme v příhodném, byť stísněném hostinci a u pití posloucháme vytí větru za zdmi. Jeden po druhém se členové výpravy odebírají na lože.\n\nZ myšlenek mě vytrhne až zjištění, že svíčka už téměř dohořela a já tu zůstal[Select_CString(ROOT.Char.IsFemale,'a','')] jen s [love_professor.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', love_professor)]. V očích [love_professor.GetFirstNameNoTooltip] je něco zvláštního.\n\nChvíli mezi námi panuje ticho, než se [love_professor.GetFirstNameNoTooltip] zamračí a pečlivě volí slova. „Víš, [ROOT.Char.GetFirstNameNoTooltip], opravdu #EMP velmi#! tě obdivuji... tedy, [ROOT.Char.GetTitleAsNameNoTooltip]...“ Na rtech se objeví úsměv."
 tour_travel.3020.a: "Pojď, ostatní už všichni spí."
 tour_travel.3020.c: "Ha! Za koho se vůbec považuješ?!"
 tour_travel.3020.d: "Měl[Select_CString(ROOT.Char.IsFemale,'a','')] bych si odpočinout..."
 tour_travel.3030.t: "Jak se věci mají"
 tour_travel.3030.desc: "Blížíme se k osadě, kde u šibenice stojí v okovech zoufalá postava a kolem se shromažďuje dav.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip]! To je [ROOT.Char.GetTitleAsNameNoTooltip]!“ Davem se prodere rolník a zoufale vykřikne: „Prosím! [Select_CString(wrongfully_accused.IsFemale,'Má manželka','Můj manžel')] je [Select_CString(wrongfully_accused.IsFemale,'nevinná','nevinný')]!"
 tour_travel.3030.framed: "Nic [Select_CString(wrongfully_accused.IsFemale,'neudělala','neudělal')], [ROOT.Char.Custom('FormOfAddressForLiege')]! Já to vím!“"
 tour_travel.3030.pinned: "Ti ničemové svalují vlastní hříchy na druhé!“"
 tour_travel.3030.wrongful: "Je to lež! Nikdo to ani neviděl!“"
 tour_travel.3030.outro: "Odvlečou [accused_partner.GetFirstNameNoTooltip] pryč a ulicí se rozléhá zoufalý nářek: „Ne! #EMP [wrongfully_accused.GetFirstName]...!#!“\n\nÚředník se rozpačitě ukloní. „Omlouvám se, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]! Nevšímejte si toho. [wrongfully_accused.GetFirstNameNoTooltip] #EMP je#! [Select_CString(wrongfully_accused.IsFemale,'vinná','vinný')], o tom nemusíte pochybovat...“"
 tour_travel.3030.a: "Rád[Select_CString(ROOT.Char.IsFemale,'a','')] bych si vyslechl[Select_CString(ROOT.Char.IsFemale,'a','')] obvinění..."
 tour_travel.3030.b.sadistic: "Ach, není nad pořádné oběšení!"
 tour_travel.3030.b: "Pokračujte."
 tour_travel.3030.c: "Máte štěstí, máme tu nejlepšího kata z [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip]!"
 tour_travel.3030.d: "Já jsem... přišel[Select_CString(ROOT.Char.IsFemale,'a','')] omilostnit [wrongfully_accused.GetFirstNameNoTooltip]! A [accused_partner.GetFirstNameNoTooltip] také!"
 tour_travel.3040.t: "Nešťastná vesnice"
 tour_travel.3040.desc: "Když klusáme kolem malé vesničky na křižovatce cest, přistoupí k nám vystrašený prostý člověk s očima rozšířenýma úlevou.\n\n„Díky bohům! Musíte nám pomoci, [Select_CString(ROOT.Char.IsFemale,'dobrá paní','dobrý pane')]!“ Se členy své výpravy si vyměníme pochybovačné pohledy. „Zběhové, kteří se dali na loupežnictví, už několik dní drancují naši vesnici. Vzali nám skoro všechno!“\n\n"
 tour_travel.3040.own: "Je to jen nepatrná osada, ale bezpráví na mém území nelze tolerovat."
 tour_travel.3040.liege: "Takže [ROOT.Char.GetTopLiege.GetTitledFirstName] nedokáže udržet pořádek v..."
 tour_travel.3040.realm: "Zdá se, že na území [ROOT.Char.GetLiege.GetTitledFirstName] vládne téměř bezpráví..."
 tour_travel.3040.foreign: "Zdá se, že pořádek na území [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] pokulhává ve srovnání s [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip]..."
 tour_travel.3040.a.martial: "Stráže, za mnou! Přepadneme ty ničemy, než nás čekají!"
 tour_travel.3040.a: "Stráže, běžte a překvapte ty ničemy!"
 tour_travel.3040.b: "#EMP Skoro#! všechno?"
 tour_travel.3040.c: "Obávám se, že mám na práci důležitější věci."
 tour_travel.3040.c.foreign: "Tohle je věc vašeho [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetTitleAsNameNoTooltip], ne moje."
