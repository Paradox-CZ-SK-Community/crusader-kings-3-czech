l_polish:
 tour_travel.1001.title: "[Select_CString(angry_peasant.IsFemale,'Nevolnice a její','Nevolník a jeho')] [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_travel.1001.desc.intro: "[Select_CString(ROOT.Char.IsFemale,'Unavená cestou a žíznivá','Unavený cestou a žíznivý')] po [ROOT.Char.Custom('RegionalDrink')] vstoupím do místní krčmy v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], abych si trochu odpočinul.\n\nMé tiché rozjímání přeruší rána pěsti do popraskaného dřeva následovaná opovržlivým odplivnutím. „Ten [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))]!"
 tour_travel.1001.desc.mid.wrong_language: "Ani neumí [angry_peasant.GetCulture.GetLanguage.GetName], a přesto se [Select_CString(ROOT.Char.IsFemale,'považuje za naši právoplatnou panovnici','považuje za našeho právoplatného panovníka')]!“"
 tour_travel.1001.desc.mid.wrong_culture: "Je to [Select_CString(ROOT.Char.IsFemale,'úplně cizí ženská','úplně cizí chlap')]! Jak nám může vládnout někdo, kdo ani nepochází z [angry_peasant.GetCulture.GetName] kultury?“"
 tour_travel.1001.desc.mid.wrong_faith: "Je to [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] bezvěrec! Každá další vteřina, kdy [Select_CString(ROOT.Char.IsFemale,'zůstává na trůně','zůstává na trůně')], je urážkou toho, co žádá [angry_peasant.GetFaith.HighGodName].“"
 tour_travel.1001.desc.mid.pretender: "Rod [ROOT.Char.GetHouse.GetName]? Na všechny z nich plivu! Každý přece ví, že skutečnými vládci [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] jsou členové rodu [claimant_character_scope.GetHouse.GetName].“"
 tour_travel.1001.desc.mid.powerful_diarch: "Náš takzvaný [ROOT.Char.GetTitleAsNameNoTooltip|U] je [Select_CString(ROOT.Char.IsFemale,'slabá','slabý')]! Skutečným vládcem [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] je ten [ROOT.Char.GetDiarch.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] [ROOT.Char.GetDiarch.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))], [ROOT.Char.GetDiarch.GetFirstName]!“"
 tour_travel.1001.desc.mid.just_plain_dislike_em: "Tomu [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('angry_peasant'))] bychom ani neměli říkat [ROOT.Char.GetTitleAsNameNoTooltip]. Měli bychom [Select_CString(ROOT.Char.IsFemale,'jí','mu')] říkat [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('angry_peasant'))] hlupák!“"
 tour_travel.1001.desc.outro.nudist: "\n\nSnažím se nevzbuzovat pozornost, ale mé panovnické vystupování a nezaměnitelná dokonalost pěstěného těla rodu [ROOT.Char.GetHouse.GetName] mě očividně prozradily. Musím něco vymyslet, než se situace vyhrotí."
 tour_travel.1001.desc.outro: "\n\nSnažím se nevzbuzovat pozornost, ale mé panovnické vystupování a znak rodu [ROOT.Char.GetHouse.GetName] na mém oděvu mě očividně prozradily. Musím něco vymyslet, než se situace vyhrotí."
 tour_travel.1001.a: "Řekni mi to do očí, ty [angry_peasant.Custom2('InsultNoun', ROOT.Char)]!"
 tour_travel.1001.b: "Možná by ti daňová úleva změnila názor."
 tour_travel.1001.c: "Ale kdepak, jen se [ROOT.Char.GetNameNoTooltip] podobám!"
 tour_travel.1002.title: "[ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')|U] mezi plevelem"
 tour_travel.1002.desc: "Když projíždíme [pretty_peasant_county_scope.GetName], čím dál víc mě okouzluje zdejší krajina. [pretty_peasant_county_scope.GetProvince.Custom('TerrainTypeProvince')] v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] je jistě nejkrásnější v celém [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], a ještě krásnější jsou zdejší [Select_CString(pretty_peasant.IsFemale,'ženy','muži')].\n\nKdyž mě můj doprovod provází další bezvýznamnou vesnicí, zahlédnu obzvlášť půvabnou [Select_CString(pretty_peasant.IsFemale,'mladou ženu','mladého muže')], jak se věnuje všedním povinnostem, a srdce se mi náhle rozbuší. Při pohledu, jak [pretty_peasant.Custom('LoverPetName')] vykonává tak obyčejnou práci, jako bych sledoval poezii proměněnou v živé tělo. Než stačím vůbec přemýšlet, srdce už mi poroučí zastavit celý doprovod."
 tour_travel.1002.a: "Musím dát své city najevo."
 tour_travel.1002.b: "Ale nic... asi se mi něco zdálo. Pokračujeme."
 tour_travel.1003.title: "Jak oslovovat [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 tour_travel.1003.desc: "Jak mé turné pokračuje přes [angry_county_scope.GetName], dozvídám se, že bylo domluveno setkání se zástupcem nespokojeného rolnictva.\n\nPřede mnou se plazí [Select_CString(rude_peasant.IsFemale,'politováníhodná kreatura','politováníhodná kreatura')] a cosi vykládá o údajné důstojnosti [angry_county_scope.GetAdjective] prostého lidu. Brzy však vyjde najevo, že za celou dobu ani jednou nezaznělo oslovení „[ROOT.Char.Custom('FormOfAddressForLiege')|U]“. Takovou urážku mohu potrestat, jak se mi zlíbí."
 tour_travel.1003.a: "Ať tu kreaturu bičují celých pět mil."
 tour_travel.1003.b: "[Select_CString(rude_peasant.IsFemale,'Její','Jeho')] vnitřnosti ozdobí [angry_county_scope.GetProvince.Custom('TerrainTypeProvince')]."
 tour_travel.1003.c: "Odpouštím [Select_CString(rude_peasant.IsFemale,'její','jeho')] nevědomost."
 tour_travel.1004.title: "$altruism_intent_header$ Léčivý dotek"
 tour_travel.1004.desc.intro: "Vstupuji do [diseased_county_scope.GetName] [Select_CString(ROOT.Char.IsFemale,'připravená','připravený')] udělit místním rolníkům svůj královský dotek. Okamžitě přede mnou [Select_CString(diseased_peasant.IsFemale,'stane bezpochyby nejubožejší žena, jakou jsem kdy spatřila','stane bezpochyby nejubožejší muž, jakého jsem kdy spatřil')]. Bez většího pobízení mi strčí mozolnatá chodidla sotva pár centimetrů od mých neposkvrněných rukou.\n\n"
 tour_travel.1004.desc.outro.christian: "Stejně jako Kristus omýval nohy svým učedníkům, i mě [ROOT.Char.GetFaith.HighGodName] nabádá, abych omyl nohy svým věrným poddaným."
 tour_travel.1004.desc.outro: "Jakkoli se mi příčí už jen stát poblíž tohoto páchnoucího a nemocného chudáka, říká se, že můj dotek dokáže vyléčit i ty nejodpudivější neduhy."
 tour_travel.1004.a.tarantino: "Musím přiznat, že je na tom cosi erotického."
 tour_travel.1004.a: "Pro tebe požehnání, pro mě nepříjemná vzpomínka."
 tour_travel.1004.b: "Tahle chorobná chodidla bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] třít celé věky."
 tour_travel.1004.c: "Snad postačí lehký dotek na čelo."
 tour_travel.1004.d.meat: "Ty špinavé párky ode mě pryč!"
 tour_travel.1004.d.two_veg: "Pryč ode mě s těmi [ROOT.Char.Custom('get_region_root_vegetable_plural')]!"
 tour_travel.1005.title: "$altruism_intent_header$ Královský dotek"
 tour_travel.1005.desc: "Zpráva o mém příjezdu se zřejmě donesla až do [county_to_bless_scope.GetName], protože náš doprovod brzy obklopí nespočet nevolníků žadonících o požehnání královským dotekem.\n\nMohl bych je samozřejmě jen pokropit trochou vody, kterou sám požehnám, a jistě by jim to stačilo. Kdybych jim však rozdal požehnané mince, kterými si mohou přikládat nemocná místa, zůstali by spokojení a požehnaní mnohem déle."
 tour_travel.1005.a: "Rozdám jim požehnané mince."
 tour_travel.1005.b: "Trocha svěcené vody jim musí stačit."
 tour_travel.1005.c: "Nedostanou nic!"
 tour_travel.1006.title: "$altruism_intent_header$ Almužna pro chudé"
 tour_travel.1006.desc: "Když se před námi v [church_barony_scope.GetNameNoTooltip] objeví [county_holder_to_bless_scope.GetFaith.HouseOfWorship], nařídím průvodu zastavit, abych mohl obdivovat toto posvátné místo, které pečuje o duchovní potřeby tolika lidí v [county_to_bless_scope.GetNameNoTooltip].\n\nOkolí svatostánku je přeplněné chudáky, kteří se přišli modlit za zlepšení svého údělu. Možná je to příležitost ukázat lidem z [county_to_bless_scope.GetNameNoTooltip], jak [Select_CString(ROOT.Char.IsFemale,'velkorysá a laskavá','velkorysý a laskavý')] dokážu být."
 tour_travel.1006.a: "Almužnu chudým!"
 tour_travel.1006.b: "Kdyby chtěli peníze, neměli se narodit chudí."
 tour_travel.1006.c: "Odstraňte tu havěť ze schodů!"
 tour_travel.1007.title: "[Select_CString(wise_woman_scope.IsFemale,'Moudrá žena','Moudrý muž')] z [wise_woman_barony_scope.GetNameNoTierNoTooltip]"
 tour_travel.1007.desc.intro: "Jak můj průvod pokračuje v cestě napříč panstvím, zavítáme až do odlehlého a nenápadného kraje [wise_woman_barony_scope.GetNameNoTier]. [Select_CString(ROOT.Char.IsFemale,'Nevěnovala bych tomu žádnou pozornost','Nevěnoval bych tomu žádnou pozornost')], kdyby si mě [superstituous_courtier_scope.GetName] nevzal stranou a nezačal nadšeně vychvalovat schopnosti takzvané [Select_CString(wise_woman_scope.IsFemale,'„Moudré ženy','„Moudrého muže')] z [wise_woman_barony_scope.GetNameNoTierNoTooltip]“.\n\n"
 tour_travel.1007.desc.mid.ill: "„Promiňte, [ROOT.Char.GetLadyLord], ale je na vás vidět, jak těžce vás choroba sužuje. [Select_CString(wise_woman_scope.IsFemale,'Moudrá žena','Moudrý muž')] z [wise_woman_barony_scope.GetNameNoTierNoTooltip] je jen kousek od naší cesty a určitě má přesně to, co vám může vrátit zdraví!“"
 tour_travel.1007.desc.mid.pregnant: "„[ROOT.Char.GetTitleAsNameNoTooltip|U], jako vždy přímo záříte, jak se na někoho, kdo čeká dítě, sluší. Je však vidět, že námaha spojená s těhotenstvím vám působí velké nepohodlí. Nedaleko žije [Select_CString(wise_woman_scope.IsFemale,'Moudrá žena','Moudrý muž')], která má jistě přesně ten lék, jenž vám uleví.“"
 tour_travel.1007.desc.mid.psychological: "„Vím, že vás sužují trýznivé myšlenky, [ROOT.Char.Custom('FormOfAddressForLiege')], a působí vám velké utrpení. Vaše vůle je sice silná, ale snad by vám od těchto muk mohlo pomoci kadidlo či nějaký lék od slavné [Select_CString(wise_woman_scope.IsFemale,'Moudré ženy','Moudrého muže')] z [wise_woman_barony_scope.GetNameNoTierNoTooltip]!“"
 tour_travel.1007.desc.mid.weakened: "„Kvůli vašim zraněním, [ROOT.Char.Custom('FormOfAddressForLiege')], mám obavy o vaše zdraví a bezpečí během tohoto turné. Nedaleko však znám schopného léčitele, který by vám mohl rány ošetřit. [Select_CString(wise_woman_scope.IsFemale,'Moudrá žena','Moudrý muž')] z [wise_woman_barony_scope.GetNameNoTierNoTooltip] prý dokáže vyléčit úplně všechno!“"
 tour_travel.1007.desc.mid.ugly: "„Dovolím-li si být tak smělý, [ROOT.Char.Custom('FormOfAddressForLiege')], někteří členové vašeho průvodu mají poznámky k vašemu... vzhledu. Ale žádné obavy! Nedaleko žije [Select_CString(wise_woman_scope.IsFemale,'Moudrá žena','Moudrý muž')], která prý dokáže vyléčit každý neduh.“"
 tour_travel.1007.desc.outro: "\n\nMám své pochybnosti, ale [superstituous_courtier_scope.GetNameNoTooltip] je o schopnostech tohoto tajemného léčitele [Select_CString(superstituous_courtier_scope.IsFemale,'tak přesvědčená','tak přesvědčený')], že mě návštěva začíná lákat."
 tour_travel.1007.a: "Malá zajížďka ničemu neuškodí."
 tour_travel.1007.b: "Naprostý nesmysl!"
 go_see_wise_woman_tt: "Navštívíš [Select_CString(wise_woman_scope.IsFemale,'Moudrou ženu','Moudrého muže')]. Může to dopadnout dobře i špatně."
 tour_travel.1008.title: "$tour_travel.1007.title$"
 tour_travel.1008.desc.intro: "Za soumraku vstoupím do spoře osvětlené chatrče [Select_CString(wise_woman_scope.IsFemale,'Moudré ženy','Moudrého muže')], zatímco můj průvod zůstane venku. Není pochyb, že právě ten [Select_CString(wise_woman_scope.IsFemale,'výstřední člověk, který se belhá','výstřední člověk, který se belhá')] po místnosti, je tím, koho hledám.\n\n„Ach, už jsem vás čekal. Pojďte dál! Posaďte se k mému ohni, [ROOT.Char.GetTitleAsNameNoTooltip|U].“ Než stačím cokoli říct, sevřou mé dlaně ledově chladné ruce."
 tour_travel.1008.desc.mid.ill: "Celou noc do sebe s odporem soukám odporné černé tekutiny a vdechuji omamné kadidlo. Když ráno vyjdu ven, cítím se [Select_CString(ROOT.Char.IsFemale,'jako znovuzrozená','jako znovuzrozený')]."
 tour_travel.1008.desc.mid.pregnant: "Celou noc mě krmí všemožnými podivnými pokrmy: očními bulvami, bylinami i ovocem, jaké jsem nikdy předtím neviděl. Tento podivný léčitel se přitom stará o každou mou potřebu. Ráno vyjdu ven [Select_CString(ROOT.Char.IsFemale,'plná nové energie','plný nové energie')]!"
 tour_travel.1008.desc.mid.psychological: "Ruce mi sevřou hlavu jako pařáty mohutné šelmy kořist. Celou noc společně odříkáváme slova, kterým nerozumím, a když ráno vyjdu ven, připadá mi má mysl mnohem lehčí."
 tour_travel.1008.desc.mid.weakened: "Ránu mi potřou všemožnými lepkavými tekutinami a štiplavými bylinami. Léčba je bolestivá, ale ráno se zdá, že se rána znatelně zacelila."
 tour_travel.1008.desc.mid.ugly: "Celou noc mi potírá tvář pestrobarevnými pastami a krémy, které zakrývají všechny skvrny a nerovnosti. Ráno pohlédnu do zrcadla a jako by na mě hleděl někdo úplně nový, kdo by dokázal svést i toho nejcudnějšího!"
 tour_travel.1008.desc.outro: "\n\nVšechny mé pochybnosti jsou pryč a mé neduhy vyléčeny."
 tour_travel.1008.a: "Jako kouzlem!"
 tour_travel.1008.b: "[Select_CString(wise_woman_scope.IsFemale,'Měla by být mou lékařkou','Měl by být mým lékařem')]!"
 tour_travel.1009.title: "[Select_CString(wise_woman_scope.IsFemale,'Šarlatánka','Šarlatán')] z [wise_woman_barony_scope.GetNameNoTierNoTooltip]"
 tour_travel.1009.desc.intro: "$tour_travel.1008.desc.intro$"
 tour_travel.1009.desc.mid.ill: "Celou noc vdechuji naprosto nesnesitelný zápach, piji odporné vazké tekutiny a tělo mi potírají pálivým býlím! Celá zkušenost jen zhorší nevolnost a bolest, které už mě sužovaly, a noc končím v horším stavu, než v jakém jsem ji začal."
 tour_travel.1009.desc.mid.ugly: "Celou noc mi potírá tvář pestrobarevnými pastami a krémy, které mají zakrýt všechny skvrny a nerovnosti. Ráno se podívám do zrcadla a hrůzou vykřiknu při pohledu na příšeru, v niž mě [Select_CString(wise_woman_scope.IsFemale,'proměnila','proměnil')]!"
 tour_travel.1009.desc.mid.nothing: "Udělám všechno, co se po mně chce: piji bylinné čaje, nechávám si masírovat končetiny, stojím nad plameny a spolykám tolik bylin, že by skolily i vola. Nic z toho však podle všeho nemá žádný účinek a necítím se o nic lépe než při příchodu."
 tour_travel.1009.desc.outro: "\n\nNevím, co se [superstituous_courtier_scope.GetNameNoTooltip] [Select_CString(superstituous_courtier_scope.IsFemale,'doslechla','doslechl')] o tomto [Select_CString(wise_woman_scope.IsFemale,'„moudrém“ léčiteli','„moudrém“ léčiteli')], ale teď už je jasné, že nejde o nic víc než o obyčejného potulného [Select_CString(wise_woman_scope.IsFemale,'šarlatána','šarlatána')]."
 tour_travel.1009.a: "Taková ztráta času."
 tour_travel.1009.b: "Oklamat [ROOT.Char.GetTitleAsNameNoTooltip|U] je zločin hodný smrti."
 tour_travel.9010.t: "Pozor na lapky!"
 tour_travel.9010.desc: "Můj průvod pokračuje po plánované trase do [next_destination.GetName], když [travel_leader.GetName] náhle přikáže zastavit!\n\n„Stůjte, vy hlupáci! Říká se, že tuhle cestu zamořili lapkové a všelijaká ničemná chátra. Musíme jet jinudy!“\n\nNavrhovaná trasa je delší, ale [travel_leader.GetNameNoTooltip] mě ujišťuje, že je bezpečnější."
 tour_travel.9010.a: "Pojedeme bezpečnější cestou."
 tour_travel.9010.b: "Musíme těm ničemům zjednat spravedlnost!"
 tour_travel.9010.success: "Lapkové jsou poraženi"
 tour_travel.9010.failure: "Lapkové tě zaženou na útěk"
 tour_travel.9020.t: "Místní spravedlnost"
 tour_travel.9020.desc.intro: "Dorazíme do malé vesnice v [ROOT.Char.GetCurrentLocation.GetName], kde na návsi panuje pořádný rozruch. Rozzuření vesničané obklopují [Select_CString(accused_character.IsFemale,'nešťastnici','nešťastníka')]. Beznaděj v očích náhle vystřídá jiskra naděje, když si všimne příchodu mého průvodu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')], prosím! Neposlouchejte je, všechno jsou to lži, [Select_CString(accused_character.IsFemale,'jsem nevinná','jsem nevinný')]! Copak mi [ROOT.Char.GetTitleAsNameNoTooltip|U] nezjedná spravedlnost?“\n\n"
 tour_travel.9020.desc.outro.guilty: "Pravda, důkazy jsou pouze nepřímé, ale někdo z prostého lidu by nikdy neměl bez vyzvání oslovovat [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 tour_travel.9020.desc.outro: "Důkazy působí dost usvědčujícím dojmem a navíc [Select_CString(accused_character.IsFemale,'promluvila','promluvil')] bez vyzvání."
 tour_travel.9020.a: "Poprava je spravedlivá."
 tour_travel.9020.b: "Ty důkazy jsou směšné. [Select_CString(accused_character.IsFemale,'Propusťte ji','Propusťte ho')]."
 tour_travel.9020.c: "Trestem bude služba mně."
 tour_travel.9030.t: "Doupě hříchu"
 tour_travel.9030.desc.intro: "Z půlnočního spánku mě probudí jásot bujarého veselí, který se zezadu pomalu přibližuje. Objeví se [drunky_entourage.GetName|U], [Select_CString(drunky_entourage.IsFemale,'jejíž','jehož')]"
 tour_travel.9030.desc.mid.hashish: "oči jsou po hašiši temně rudé."
 tour_travel.9030.desc.mid: "dech páchne po [ROOT.Char.Custom('RegionalAlcoholicDrink')]."
 tour_travel.9030.desc.outro: "\n\n„Ať mi [drunky_entourage.GetFaith.HighGodName] odpustí! Jen pár minut odsud je báječné doupě hříchu, [ROOT.Char.GetTitleAsNameNoTooltip|U]. Musíme tu chvíli zůstat a veselím se úplně zpitomět!“"
 tour_travel.9030.a: "Vzhůru za pitím a veselím!"
 tour_travel.9030.b: "Nesmíme se nechat rozptylovat."
 tour_travel.9040.t: "Největší hrdina"
 tour_travel.9040.desc: "Má družina se na chvíli zastaví k odpočinku a já zamířím do jednoho z místních pochybných podniků, abych se trochu blíže seznámil s místními. Aniž bych prozradil svou totožnost, naslouchám hlučným hovorům prostého lidu.\n\n[Select_CString(peasant.IsFemale,'Jedna z místních žen','Jeden z místních mužů')] se baví se svými druhy a navzájem si vyprávějí příběhy o oblíbených legendárních hrdinech. „...a co ten [ROOT.Char.GetPromotedLegend.GetProtagonist.GetName]? Kdo ví, jestli vůbec někdy existoval někdo takový, natož všechny ty nesmysly kolem ‚[ROOT.Char.GetPromotedLegend.GetName]‘!“"
 tour_travel.9040.a: "Musím se své legendy zastat!"
 tour_travel.9040.a.success: "Rolníci opěvují tvůj příběh"
 tour_travel.9040.a.failure: "Staneš se terčem posměchu"
 tour_travel.9040.b: "[Select_CString(peasant.IsFemale,'Zjevně na ten příběh nestačila','Zjevně na ten příběh nestačil')]."
 tour_general.0001.title: "[visiting_liege.GetTitledFirstNameNoTooltip] přijíždí!"
 tour_general.0001.desc.intro: "K mým branám konečně dorazí [visiting_liege.GetTitledFirstNameNoTooltip] se svým doprovodem, aby během svého turné po [visiting_liege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] navštívil [ROOT.Char.GetCapitalLocation.GetName]."
 tour_general.0001.desc.type.majesty: "Nádherné oděvy a okázalé vystupování celé družiny dávají jasně najevo snahu ohromit mě.\n\n"
 tour_general.0001.desc.type.intimidation: "Řady přísných a ukázněných stráží jasně ukazují, že dnes má vládnout strach.\n\n"
 tour_general.0001.desc.type.taxation: "Vůz s truhlami a zástup výběrčích daní naznačují, že po této návštěvě budu o něco chudší.\n\n"
 tour_general.0001.desc.mid.hates_liege: "Už bylo načase, aby ten [visiting_liege.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] vylezl ze svých pochmurných síní a konečně spatřil skutečnou zemi."
 tour_general.0001.desc.mid.lover: "Už je to příliš dlouho, co jsem naposledy [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')] jeho objetí... snad zbude chvíle, abychom dohnali, co jsme zameškali."
 tour_general.0001.desc.mid.friend: "Přestože nás čekají všechny ty formality, návštěva tak dobrého přítele mě velice těší."
 tour_general.0001.desc.mid.close_family: "Vzácná, ale vítaná příležitost znovu spatřit [ROOT.Char.Custom2('RelationToMeShort', visiting_liege)]. Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že přijel."
 tour_general.0001.desc.mid.house: "[ROOT.Char.Custom2('RelationToMeShort', visiting_liege)] přijel upevnit nejen vazalská pouta, ale i svazky rodu [ROOT.Char.GetHouse.GetBaseName]."
 tour_general.0001.desc.mid.powerful_vassal: "Jako jeden z nejmocnějších vazalů panství se sotva mohu divit, že návštěva zamířila právě k mým dveřím."
 tour_general.0001.desc.mid.default: "Přivítat [visiting_liege.GetTitleAsNameNoTooltip] celého panství ve vlastních síních by pro mě byla veliká čest."
 tour_general.0001.desc.phase.tour_grounds: "\n\nMám [visiting_liege.GetTitleAsNameNoTooltip] provést po svém [ROOT.Char.Custom('FortifiedBuilding')] a ukázat mu [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] krajinu,"
 tour_general.0001.desc.phase.dinner: "\n\nMám uspořádat honosnou hostinu hodnou [visiting_liege.GetTitleAsNameNoTooltip] a předvést tak [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] pohostinnost,"
 tour_general.0001.desc.phase.cultural_festival: "\n\nMám [visiting_liege.GetTitleAsNameNoTooltip] předvést slavnost plnou toho nejlepšího, co [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] kultura nabízí v oblasti zábavy a umění,"
 tour_general.0001.desc.outro: "a zajistit celému doprovodu lůžka i zábavu.\n\nZbývá jediná otázka: otevřu brány a vpustím návštěvu dovnitř?"
 tour_general.0001.a: "Vítej, [visiting_liege.GetTitleAsNameNoTooltip]! Vítej!"
 tour_general.0001.b: "Budeme předstírat, že nikdo není doma..."
 tour_general.0500.title: "Nikdo není doma"
 tour_general.0500.desc.intro: "Donesla se ke mně zpráva, že mé plány byly narušeny a královská návštěva [tour_location.GetName] už není možná.\n\n"
 tour_general.0500.desc.self: "[Select_CString(ROOT.Char.IsFemale,'Stala jsem se novou panovnicí','Stal jsem se novým panovníkem')] [tour_location.GetName], takže můj pobyt nemá kdo hostit kromě mě samotné."
 tour_general.0500.desc.already_visited: "[stop_host_scope.GetName] jsem během svého velkého turné již navštívil a nemohu mu prokazovat zvláštní přízeň. Jedna návštěva mu musí stačit."
 tour_general.0500.desc.no_longer_liege: "[stop_host_scope.GetTitleAsNameNoTooltip|U] z [tour_location.GetNameNoTooltip] už není mým přímým podřízeným."
 tour_general.0500.desc.lowly_baron: "[tour_location.GetNameNoTooltip|U] nyní podléhá pouhému [stop_host_scope.GetTitleAsNameNoTooltip|U] a návštěva někoho tak nízkého postavení je pod mou úroveň."
 tour_general.0500.desc.leading_army: "[stop_host_scope.GetName|U] vytáhl do boje a nemůže mě již hostit."
 tour_general.0500.desc.gone_travelling: "[stop_host_scope.GetName|U] opustil svůj domov a vydal se do neznámých krajů."
 tour_general.0500.desc.imprisoned_by_me: "[stop_host_scope.GetName|U] byl [Select_CString(stop_host_scope.IsFemale,'zadržen a nyní hnije','zadržen a nyní hnije')] v mém žaláři."
 tour_general.0500.desc.imprisoned: "[stop_host_scope.GetName|U] už není na svobodě a nyní hnije v cizím žaláři."
 tour_general.0500.desc.deadly_illness: "[stop_host_scope.GetName|U] onemocněl smrtelnou chorobou a já nemohu riskovat návštěvu ani vdechování jedovatého morového vzduchu."
 tour_general.0500.desc.incapable: "[stop_host_scope.GetName|U] už nemá plně pod kontrolou své duševní schopnosti a jako hostitel by byl k ničemu."
 tour_general.0500.desc.gone_adventuring: "[stop_host_scope.GetName|U] se vydal za dobrodružstvím do krajin, kam se mi nechce cestovat."
 tour_general.0500.desc.at_war: "Na [tour_location.GetNameNoTooltip] padl stín války a [stop_host_scope.GetName] mě varoval, abych se tam nevydával."
 tour_general.0500.desc.outro: "\n\nMé turné tím sice nekončí, ale i tak je to veliké zklamání."
 current_phase_skipped_tt: "Přeskočíš následující fázi."
 tour_general.0500.a: "Na tohle jsem se opravdu [Select_CString(ROOT.Char.IsFemale,'těšila','těšil')]..."
 tour_general.0501.title: "Před zavřenými branami"
 tour_general.0501.desc: "Když se můj doprovod zastaví před branami [stop_host_scope.GetCapitalLocation.GetTitle.GetBaseNameNoTier], zazní výzva, aby mě [stop_host_scope.GetName] přijal. Čekáme více než dost dlouho, ale neobjeví se ani ten nejposlednější sluha, aby nás přivítal. Volání se ještě několikrát opakuje, avšak odpovědí nám je jen cvrlikání ptáků a svištění mírného větru.\n\nTeď už je jasné, že mě před branami odmítli. Ten [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.GetTitleAsNameNoTooltip] tím urazil samotnou korunu!"
 tour_general.0501.a: "Prostě pojedeme dál."
 tour_general.0501.b: "Na tuhle urážku jen tak nezapomenu."
 tour_general.0501.c: "Vyrazte ty zatracené brány!"
 tour_general.0501.liege_merciful: "[visiting_liege.GetFirstName] ti [Select_CString(visiting_liege.IsFemale,'odpustila','odpustil')]"
 tour_general.0501.liege_angry: "[visiting_liege.GetFirstName] se [Select_CString(visiting_liege.IsFemale,'cítí uražena','cítí uražen')]"
 tour_general.0501.raid: "[visiting_liege.GetFirstName] [Select_CString(visiting_liege.IsFemale,'vyplenila','vyplenil')] tvou državu"
 tour_general.1001.title: "$activity_tour$: Zdvořilá žádost"
 tour_general.1001.title_theft: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Zdvořilý nárok"
 tour_general.1001.intro: "[Select_CString(ROOT.Char.IsFemale,'Dostala','Dostal')] jsem zprávu, že [visiting_liege.GetTitledFirstName] si [Select_CString(visiting_liege.IsFemale,'vytipovala','vytipoval')] [tour_general_3001_target_courtier.GetTitledFirstName], [Select_CString(tour_general_3001_target_courtier.IsFemale,'která je v okolí proslulá','který je v okolí proslulý')] [tour_general_3001_target_courtier.Custom('GetCourtierTrait')]."
 tour_general.1001.desc: "\n\nStručně řečeno, [visiting_liege.GetTitleAsNameNoTooltip] si přeje, aby [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] přešel ke dvoru, kde [Select_CString(visiting_liege.IsFemale,'vládne ona','vládne on')]."
 tour_general.1001.desc_theft_liege: "\n\nAniž by se příliš ohlížel na mé námitky, [visiting_liege.GetTitleAsNameNoTooltip] se navíc během noci pokusil [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] násilím odvést ke svému dvoru."
 tour_general.1001.outro: "\n\nTo je jistě příležitost ukázat, jak [Select_CString(ROOT.Char.IsFemale,'velkorysá','velkorysý')] dokážu být!"
 tour_general.1001.outro_unusual_courtier: "\n\nSice příliš nechápu důvody [ROOT.Char.Custom2('RelationToMePossessive', visiting_liege )], ale ztráta [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] mě příliš netrápí."
 tour_general.1001.outro_unusual_host_unusual_courtier: "\n\nNapadá mě #EMP hned několik důvodů#!, proč bych si [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] nechat nablízku. Nicméně..."
 tour_general.1001.outro_theft_liege: "\n\nNetřeba dodávat, že mě to rozčiluje hned z několika důvodů."
 tour_general.1001.outro_theft_liege_unusual_courtier: "\n\nPřiznávám, že nechápu, proč [visiting_liege.GetTitledFirstName] tolik stojí o [tour_general_3001_target_courtier.GetTitledFirstNameNoTooltip], ale k čertu, [tour_general_3001_target_courtier.GetFirstNameNoTooltip] je #EMP můj#! [ROOT.Char.Custom2('RelationToMeShort', tour_general_3001_target_courtier )]."
 tour_general.1001.a: "Doufám, že [tour_general_3001_target_courtier.GetFirstNameNoTooltip] bude [visiting_liege.GetTitledFirstNameNoTooltip] dobře sloužit."
 tour_general.1001.a_theft_liege: "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] mi stejně nikdy nebyl příliš k užitku."
 tour_general.1001.b: "Něco za něco, [visiting_liege.GetTitledFirstNameNoTooltip]."
 tour_general.1001.b.tt: "Za to, že se [tour_general_3001_target_courtier.GetFirstName] připojí ke dvoru [visiting_liege.GetTitledFirstNameNoTooltip], požaduješ protislužbu"
 tour_general.1001.c: "Jistě mi to [visiting_liege.GetTitleAsNameNoTooltip] dokáže patřičně vynahradit..."
 tour_general.1001.c.tt: "Za to, že se [tour_general_3001_target_courtier.GetFirstName] připojí ke dvoru [visiting_liege.GetTitledFirstNameNoTooltip], požaduješ zlato"
 tour_general.1001.d: "Napadá mě jen #EMP jediný#! důvod, proč [visiting_liege.GetTitledFirstNameNoTooltip] chce [tour_general_3001_target_courtier.GetFirstNameNoTooltip]..."
 tour_general.1001.d.flavor: "Dopřejme si."
 tour_general.1001.d.tt: "Navrhneš [visiting_liege.GetShortUIName], abyste společně pojedli #EMP exotické#! jídlo"
 tour_general.1001.d.tt_extra: "[visiting_liege.GetShortUIName] pozvání buď přijme, nebo odsoudí tvůj kanibalismus"
 tour_general.1001.e: "#EMP Teď zemřeš!#!"
 tour_general.1001.e.flavor: "U [ROOT.Char.GetFaith.DevilName]!"
 tour_general.1001.e.tt: "Vrhnutím se pokusíš napadnout [visiting_liege.GetShortUIName]"
 tour_general.1001.e.success: "Tvůj útok je úspěšný"
 tour_general.1001.e.success.tt: "Přežil jsi"
 tour_general.1001.e.success.desc: "Přežil jsi souboj."
 tour_general.1001.e.bodyguard.desc: "Tvůj osobní strážce zasáhl a zachránil tě."
 tour_general.1001.e.slain.tt: "Byl jsi zabit"
 tour_general.1001.e.slain.desc: "Souboj jsi prohrál."
 tour_general.1001.e.failure: "Tvůj útok selže"
 tour_general.1001.e.bodyguard: "[tour_general_1001_bodyguard.GetTitledFirstNameNoTooltip] zasahuje"
 tour_general.1001.f: "Tohle nevypadá jako dobrý nápad."
 tour_general.1001.f_theft_liege: "Teď už s tou žádostí #EMP sotva#! mohu souhlasit."
 tour_general.1001.f.tt: "Nechceš se svého dvořana vzdát"
 tour_general.1002.title: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Hrůzně velkolepá hostina"
 tour_general.1002.title_vassal: "$activity_tour$: Hrůzně velkolepá hostina"
 tour_general.1002.desc_host: "Ještě jednou si prohlížím uspořádání pokrmů na stole. Můj kuchař se opravdu činil, aby pro naše potěšení připravil každičký kousek [tour_general_3001_target_courtier.GetFirstName]. Výzdoba je znamenitá.\n\nOtočím se právě ve chvíli, kdy do místnosti vstoupí [visiting_liege.GetTitledFirstName], [Select_CString(visiting_liege.IsFemale,'sama','sám')], jak jsme se dohodli. Sleduji, jak si vše prohlíží, a v koutku úst se objeví nepatrný úsměv. Poté zamíří ke stolu a posadí se. Přisednu si."
 tour_general.1002.desc_liege: "Jakmile vstoupím do místnosti, není pochyb o tom, že hlavní hvězdou večera je [tour_general_3001_target_courtier.GetFirstName].\n\n[stop_host_scope.GetTitledFirstName] na ničem nešetřil a stůl se doslova prohýbá pod nádhernými pokrmy. V duchu zásady, že se nemá ničím plýtvat, využil kuchař každý chutný kousek, kterým mohl [tour_general_3001_target_courtier.GetFirstNameNoTooltip] přispět.\n\nDokonce i hlava [tour_general_3001_target_courtier.GetFirstNameNoTooltip] byla po vyprázdnění a zbavení krve pečlivě umístěna na konec stolu a ozdobena místní zelení. Na chvíli se zastavím a nechám na sebe celý výjev působit."
 tour_general.1002.a: "To je #EMP božské#!!"
 tour_general.1002.b: "...možná jen úplně maličké sousto."
 tour_general.1002.c: "Na našeho dobrodince, [tour_general_3001_target_courtier.GetFirstNameNoTooltip]!"
 tour_general.1002.a.flavor: "S chutí se pustíš do jídla."
 tour_general.3001.title: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Krása je v očích pozorovatele"
 tour_general.3001.desc_gluttonous_cannibal: "Jako znalec #EMP kvalitního masa#! si nemohu nevšimnout, jak [tour_general_3001_target_courtier.GetFirstName] vyčnívá z davu. [Select_CString(tour_general_3001_target_courtier.IsFemale,'Její','Jeho')] impozantní tělesná masa mi podlamuje kolena. Ruce se mi třesou, když sleduji, jak hltá jídlo a na baculatých tvářích se lesknou krůpěje mastnoty.\n\n#EMP Tak [Select_CString(tour_general_3001_target_courtier.IsFemale,'buclatá','buclatý')].#! Zatnu čelist. Tohle je osud."
 tour_general.3001.desc_gluttonous: "[tour_general_3001_target_courtier.GetFirstName] skutečně vypadá jako [Select_CString(tour_general_3001_target_courtier.IsFemale,'žena','muž')], která ví, co je v životě dobré. Když hledím na tu statnou postavu a ryzí požitek, který očividně nachází v jídle, pocítím záchvěv závisti.\n\n[stop_host_scope.GetTitledFirstName] se ostatně nemohl vynachválit kuchařského umění, kterým [tour_general_3001_target_courtier.GetFirstNameNoTooltip] oplývá."
 tour_general.3001.desc_insanity_courtier: "Na [tour_general_3001_target_courtier.GetFirstName] je cosi fascinujícího. Nedokážu přesně říct co. Vyzařuje z něj však směs tajemnosti a přímočarosti, s jakou se dnes člověk setká jen málokdy.\n\nPřipadá mi, jako by [Select_CString(tour_general_3001_target_courtier.IsFemale,'hleděla','hleděl')] přímo do místa, kde by měla být má duše, kdyby se jí jako první nezmocnil [ROOT.Char.GetFaith.DevilName].\n\n[tour_general_3001_target_courtier.GetFirstNameNoTooltip] to chápe."
 tour_general.3001.desc_beauty: "Jakmile spatřím [tour_general_3001_target_courtier.GetFirstName], zatají se mi dech. Ty jemné rysy jako by v sobě nesly krásu tisíce [ROOT.Char.Custom('get_region_flower_type_plural')] a snad pro ně ani neexistuje jiné vysvětlení než [ROOT.Char.GetFaith.HighGodName]. Čas se zastaví, zatímco se tou nádherou kochám.\n\nTaková krása přijde mezi touhle rolnickou chátrou vniveč."
 tour_general.3001.desc_intellect: "[tour_general_3001_target_courtier.GetFirstName] mě svým intelektem nepřestává udivovat. Je to [Select_CString(tour_general_3001_target_courtier.IsFemale,'skutečná myslitelka','skutečný myslitel')] naší doby a v jejích schopnostech a nadání se skrývá obrovský potenciál. U mého dvora bych pro ně jistě našel využití, místo abych sledoval, jak zde chřadnou jako rostlina bez slunce."
 tour_general.3001.desc_physique: "Když se [tour_general_3001_target_courtier.GetFirstName] sehne pro cetku ležící na podlaze chodby, nakloním se také, abych si pořádně prohlédl vyrýsované svaly hrající pod kůží. Takovou postavu si za peníze nekoupíš. Ale kdybych se obklopil více podobně zdatnými lidmi...\n\n"
 tour_general.3001.desc_martial: "Bojové schopnosti, kterými [tour_general_3001_target_courtier.GetFirstName] oplývá, jsou u dvora [stop_host_scope.GetTitledFirstName] dobře známé. Pokud chce někdo probrat plán útoku nebo nejlepší způsob, jak nabrousit zbraň i důvtip, obrátí se právě na [tour_general_3001_target_courtier.GetFirstNameNoTooltip]. Takové schopnosti jsou velmi žádané a rozhodně vzbuzují můj zájem.\n\n"
 tour_general.3001.desc_diplomacy: "Diplomatické schopnosti, kterými [tour_general_3001_target_courtier.GetFirstName] oplývá, mě nepřestávají udivovat. [Select_CString(tour_general_3001_target_courtier.IsFemale,'Dokázala by','Dokázal by')] [ROOT.Char.GetFaith.ReligiousHeadName] oznámit, že mu vykukuje spodní prádlo, a ještě za to dostat pár zlaťáků, úsměv a poděkování."
 tour_general.3001.desc_stewardship: "[tour_general_3001_target_courtier.GetFirstName] je bezednou studnicí vědomostí o... bohatství. Má spoustu nápadů ohledně správy panství a neustále si stěžuje, že u dvora [stop_host_scope.GetTitledFirstName] je nelze uskutečnit.\n\nByla by škoda nechat takový talent přijít nazmar."
 tour_general.3001.desc_intrigue: "[tour_general_3001_target_courtier.GetFirstName] jsem si sotva [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')], dokud se mi neocitl přímo před očima, aby vzdal náležitou úctu svému [tour_general_3001_target_courtier.Char.Custom2('RelationToMePossessive', stop_host_scope )] [stop_host_scope.Char.Custom2('RelationToMeShort', visiting_liege )]. Teď, když už o něm vím, sleduji, jak se bez nejmenší námahy pohybuje mezi skupinkami lidí u dvora. [Select_CString(tour_general_3001_target_courtier.IsFemale,'Její','Jeho')] oči jsou neustále ve střehu, sledují všechno a zároveň zdánlivě nic.\n\nTo mě zajímá."
 tour_general.3001.desc_learning: "[tour_general_3001_target_courtier.GetFirstName] je [Select_CString(tour_general_3001_target_courtier.IsFemale,'učená žena','učený muž')]. [Select_CString(tour_general_3001_target_courtier.IsFemale,'Její','Jeho')] bystré oči pročesávají místnost a hledají někoho, kdo by zpochybnil učené tvrzení, které právě [Select_CString(tour_general_3001_target_courtier.IsFemale,'pronesla','pronesl')]. Nikdo se však výzvy nechopí, k [Select_CString(tour_general_3001_target_courtier.IsFemale,'jejímu','jeho')] zklamání.\n\nNení divu, vzhledem k úrovni intelektu, kterou by taková rozprava vyžadovala. Jsem [Select_CString(ROOT.Char.IsFemale,'ohromena','ohromen')].\n\nS takovým důvtipem se člověk setká jen málokdy."
 tour_general.3001.desc_prowess: "Mrštně se místností pohybuje jako [ROOT.Char.Custom('GetAnimalType')] na lovu a [tour_general_3001_target_courtier.GetFirstName] mě nepřestává udivovat. Sleduji každý pohyb, hotovou symfonii pro oči, dokud nezmizí v chodbě.\n\nTaková udatnost!"
 tour_general.3001.desc_outro: "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] prostě #EMP musí#! být u mého dvora."
 tour_general.3001.a: "Odteď patříš k mému dvoru. Raduj se."
 tour_general.3001.a.flavor: "[Select_CString(tour_general_3001_target_courtier.IsFemale,'Jednou získaná, navždy má','Jednou získaný, navždy můj')]."
 tour_general.3001.a.tt: "Přesunutý dvořan"
 tour_general.3001.a_cannibal: "Tak lahodný přírůstek!"
 tour_general.3001.a_cannibal.flavor: "Postarám se, aby [tour_general_3001_target_courtier.GetFirstNameNoTooltip] [Select_CString(tour_general_3001_target_courtier.IsFemale,'byla dobře živená','byl dobře živený')]..."
 tour_general.3001.a_insanity: "Tak to musí být."
 tour_general.3001.a_insanity.flavor: "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] #EMP to ví!#!"
 tour_general.3001.b: "Jistě proti tomu [stop_host_scope.GetTitledFirstNameNoTooltip] nebude nic namítat."
 tour_general.3001.b_host_decides.tt: "[stop_host_scope.GetShortUIName] rozhodne, co bude dál"
 tour_general.3001.b.harmful_sideeffects.tt: "Kvůli povaze, kterou má [stop_host_scope.GetShortUIName], to může mít smrtelné následky"
 tour_general.3001.b_liege_decides.tt: "[visiting_liege.GetShortUIName] rozhodne, co bude dál"
 tour_general.3001.c: "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] by se [Select_CString(tour_general_3001_target_courtier.IsFemale,'#EMP mohla#!',' #EMP mohl#!')] v noci prostě vytratit..."
 tour_general.3001.c.tt_success: "Tajně odveden"
 tour_general.3001.c.tt_failure: "Neúspěšný pokus"
 tour_general.3001.c.tt_failure.desc: "Tvůj neúspěch nezůstal bez povšimnutí."
 tour_general_3001_stolen_courtier: "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] se nepozorovaně připojí k mému dvoru"
 tour_general_3001_failed_steal: "[stop_host_scope.GetTitledFirstNameNoTooltip] se o tom dozví"
 tour_general.3001.d: "Tohle je hloupost."
 tour_general.3001.d_cannibal: "Ne. Musím začít držet dietu."
 tour_general.3001.d_cannibal.flavor: "Pche!"
 tour_general.3001.d_insanity: "Ne. [ROOT.Char.GetFaith.random_EvilGodNames] jsou můj problém a musím se jim [Select_CString(ROOT.Char.IsFemale,'postavit sama','postavit sám')]."
 tour_general.3001.d_insanity.flavor: "Teď je to na mně!"
 tour_general.3001.tt_positive: "[visiting_liege.GetShortUIName] přijímá tvůj návrh"
 tour_general.3001.tt_negative: "[visiting_liege.GetShortUIName] odmítá tvůj návrh"
 tour_general.3001.desc_negative: "[visiting_liege.GetShortUIName] ztrácí zájem o tvého dvořana."
 tour_general.3002.title: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Žádosti vyhověno"
 tour_general.3002.title_denied: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Žádost zamítnuta"
 tour_general.3002.intro: "[stop_host_scope.GetTitledFirstName] se obrátí přímo na mě.\n\n„[stop_host_scope.Custom2('RelationToMeShort', ROOT.Char )], celou věc jsem si [Select_CString(stop_host_scope.IsFemale,'promyslela','promyslel')] a [Select_CString(stop_host_scope.IsFemale,'dospěla','dospěl')] jsem k závěru, že "
 tour_general.3002.desc_free: "[tour_general_3001_target_courtier.GetFirstName] se k vašemu vznešenému dvoru [Select_CString(tour_general_3001_target_courtier.IsFemale,'ráda připojí','rád připojí')].“"
 tour_general.3002.desc_hook: "za jednu laskavost bych snad [Select_CString(stop_host_scope.IsFemale,'mohla','mohl')] někdy v budoucnu očekávat jinou...?“"
 tour_general.3002.desc_gold: "trocha zlata by mohla zmírnit bolest ze ztráty drahého [tour_general_3001_target_courtier.GetFirstName].“"
 tour_general.3002.desc_cannibal: "mám ještě lepší nápad. Jestli se vám [tour_general_3001_target_courtier.GetFirstName] líbí, pak tohle budete přímo #EMP milovat#!, [ROOT.Char.Custom('FormOfAddressForLiege')]. Je to k #EMP sežrání#!.“\n\n[stop_host_scope.GetTitledFirstNameNoTooltip] pohlédne směrem k [tour_general_3001_target_courtier.GetFirstNameNoTooltip] a pak přímo na mě, jako by mi chtěl něco naznačit."
 tour_general.3002.desc_declined: "s touto žádostí nemohu souhlasit. [tour_general_3001_target_courtier.GetFirstName] je pro mě i můj dvůr příliš [Select_CString(tour_general_3001_target_courtier.IsFemale,'cenná','cenný')].“\n\nPohled [stop_host_scope.GetTitledFirstNameNoTooltip] začne rozpačitě bloudit po místnosti."
 tour_general.3002.a: "Velmi si toho vážím!"
 tour_general.3002.b: "Proč smlouvat o něčem, co si mohu #EMP vzít#!?"
 tour_general.3002.b_declined: "[tour_general_3001_target_courtier.GetFirstNameNoTooltip] je #EMP můj#!."
 tour_general.3002.c: "Laskavost za laskavost? To zní spravedlivě."
 tour_general.3002.d: "Pár zlaťáků? Spravedlivý obchod."
 tour_general.3002.e: "Když o tom tak přemýšlím..."
 tour_general.3002.f: "#EMP Ach můj...#!"
 tour_general.3002.g: "Tohle odporné chování musí skončit!"
 tour_general.3002.h: "To je politováníhodné."
 tour_general.3002.h.tt: "[visiting_liege.GetShortUIName] je nespokojený"
 tour_general.3002.h.tt.desc: "[visiting_liege.GetShortUIName] není s tvým rozhodnutím spokojený."
 tour_general.0510.title: "Požadavek na rozloučenou"
 tour_general.0510.desc: "Má návštěva [ROOT.Char.GetCurrentLocation.GetName] je u konce a můj průvod se chystá k odjezdu.\n\n[stop_host_scope.GetName] i celý dvůr se spořádaně seřadili, aby mě vyprovodili. Když jsou tu všichni, nastal čas vybrat tribut za poctu, které se jim dostalo mou přítomností."
 tour_general.0510.a: "Je čas na tribut."
 tour_general.0510.b: "Nic požadovat nebudu."
 tour_general.0511.title: "Dar na rozloučenou"
 tour_general.0511.desc: "Nastal čas, aby [visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'odjela','odjel')], a musím říct, že jsem [Select_CString(ROOT.Char.IsFemale,'byla velkorysou hostitelkou','byl velkorysým hostitelem')].\n\nZdá se však, že [visiting_liege.GetNameNoTooltip] nepovažuje mou pohostinnost za dostatečnou a vznáší vůči mně požadavek.\n\n"
 tour_general.0511.desc.kneel: "[visiting_liege.GetNameNoTooltip] požaduje, abych před celým svým dvorem [Select_CString(ROOT.Char.IsFemale,'poklekla','poklekl')] před [visiting_liege.GetTitleAsNameNoTooltip|U] a tím dal najevo svou podřízenost koruně."
 tour_general.0511.desc.money: "[visiting_liege.GetNameNoTooltip] mi předkládá účet za veškeré výdaje během své cesty. Mnohé položky vypadají zcela smyšleně, přesto jsem povinen je zaplatit."
 tour_general.0511.desc.factions: "[visiting_liege.GetNameNoTooltip] ke mně napřáhne ruku a požaduje, abych [Select_CString(ROOT.Char.IsFemale,'přísahala','přísahal')] věrnost [visiting_liege.GetNameNoTooltip] a [visiting_liege.GetPrimaryTitle.GetName] a [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')], že se nikdy nepostavím proti vůli koruny."
 tour_general.0511.a: "Podvolím se."
 tour_general.0511.gave_demand: "[stop_host_scope.GetName] [Select_CString(stop_host_scope.IsFemale,'ustoupila','ustoupil')]"
 tour_general.0511.b: "Nic takového neudělám!"
 tour_general.0512.title: "Zamávání na rozloučenou"
 tour_general.0512.desc: "Nastal čas, aby [visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'odjela','odjel')], a musím říct, že jsem [Select_CString(ROOT.Char.IsFemale,'byla velkorysou hostitelkou','byl velkorysým hostitelem')].\n\n[visiting_liege.GetNameNoTooltip] je s mou pohostinností očividně naprosto [Select_CString(visiting_liege.IsFemale,'spokojená','spokojený')] a nežádá ode mě nic kromě slibu, že se opět setkáme."
 tour_general.0512.a: "Výborně."
 tour_general.0513.title: "Požadavek odmítnut"
 tour_general.0513.desc: "[stop_host_scope.GetName] se vzdorovitě [Select_CString(stop_host_scope.IsFemale,'odmítla','odmítl')] podvolit mým požadavkům. Teď s tím mohu sotva něco udělat, ale taková urážka není zločinem jen proti mně, nýbrž proti celému panství!"
 tour_general.0513.a: "Na tohle jen tak nezapomenu."
 tour_grounds_events.1001.title: "Lovecké umění"
 tour_grounds_events.1001.desc.intro: "Zatímco [visiting_liege.GetName] stále obchází okolí mého sídla, mám před sebou ještě spoustu příležitostí udělat dojem."
 tour_grounds_events.1001.desc.mid: "\n\nJednou z nich by mohlo být předvést loviště v [touring_grounds_scope.GetNameNoTooltip] a možná svého lenního pána ohromit vlastními loveckými schopnostmi!"
 tour_grounds_events.1001.desc.outro: "Úspěch při lovu by jistě upevnil mé postavení [Select_CString(ROOT.Char.IsFemale,'jako vážené','jako váženého')] [ROOT.Char.GetTitleAsNameNoTooltip] v panství, ale neúspěch by byl stejně tak hlubokým ponížením."
 tour_grounds_events.1001.a: "Nikdy neminu!"
 tour_grounds_events.1001.b: "Možná bych [visiting_liege.GetNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] ohromit něčím jiným..."
 tour_grounds_events.1002.title: "Léčka"
 tour_grounds_events.1002.desc: "Když sleduji, jak se můj [visiting_liege.GetTitleAsNameNoTooltip|U] prochází po pozemcích [touring_grounds_scope.GetNameNoTooltip], napadne mě jedna pěkně záludná taškařice. Jako by mě snad posedl samotný [ROOT.Char.GetFaith.TricksterGodName], představím si naaranžovaný pokus o vraždu, který by naše hosty jistě pobavil!\n\n[visiting_liege.GetNameNoTooltip] bude v příběhu za hrdinu, překazí útok na naši družinu a „vraha“ zažene na útěk! Jako povedená parodie nepřátel [visiting_liege.GetPrimaryTitle.GetNameNoTooltip] to [visiting_liege.GetNameNoTooltip] jistě polichotí a pobaví!"
 tour_grounds_events.1002.a: "Zařiďte to!"
 tour_grounds_events.1002.b: "Raději ne."
 tour_grounds_events.1003.title: "$murder_outcome.5001.t$"
 tour_grounds_events.1003.desc.intro: "Když pokračuji v prohlídce pozemků [touring_grounds_scope.GetNameNoTooltip], zaslechnu kolem nás neznámé hlasy. Náhle mou družinu ze všech stran obklopí [Select_CString(fake_assassin_scope.IsFemale,'ženy','muži')] v kápích a namíří přímo na mě nože a luky!\n\nJeden z útočníků ke mně přistoupí a pevně mi přitiskne nůž k boku. „Tak co, [ROOT.Char.Custom('FormOfAddressForLiege')], daří se lov? My jsme přišli lovit [ROOT.Char.GetTitleAsNameNoTooltip]!“"
 tour_grounds_events.1003.desc.paranoid: "\n\nSrdce se mi rozbuší a celé tělo mi zalije studený pot, zatímco zůstávám jako [Select_CString(ROOT.Char.IsFemale,'ochromená','ochromený')]. Útočník na mě významně mrkne, ukáže na svou zbraň a samolibě si vychutnává své vítězství. Na mém příštím kroku teď závisí můj život. Co mám dělat?"
 tour_grounds_events.1003.desc.not_paranoid: "\n\nNejprve mě to vyleká, ale brzy pochopím, že je to jen divadlo. „Vrah“ na mě mrkne a všimnu si, že jeho zbraň je celá ze dřeva a nemá jedinou ostrou hranu. Očekává se ode mě, že přistoupím na hru a pokus o svůj život hrdinsky překazím."
 tour_grounds_events.1003.a.paranoid: "$murder_outcome.5001.not_my_time$"
 tour_grounds_events.1003.a: "Na mě si nepřijdeš, ty [fake_assassin_scope.Custom2('InsultNoun', ROOT.Char)]!"
 tour_grounds_1002.assassination_was_fake: "Pokus o vraždu byl fingovaný"
 tour_grounds_1002.liege_believed_it_was_real: "[visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'uvěřila','uvěřil')], že pokus o vraždu byl skutečný"
 tour_grounds_1002.liege_played_along: "[visiting_liege.GetName] se skvěle [Select_CString(visiting_liege.IsFemale,'bavila','bavil')]"
 tour_grounds_1002_likes_tt: "Pokud se to [visiting_liege.GetName] bude líbit"
 tour_grounds_1002_dislikes_tt: "Pokud se to [visiting_liege.GetName] nebude líbit"
 tour_grounds_1002_murder_tt: "Pokud [visiting_liege.GetName] uvěří, že je útok skutečný"
 tour_grounds_events.1003.b: "Nejsem žádný trubadúr! Nechte mě být!"
 tour_grounds_1002.liege_begrudgingly_played_along: "[visiting_liege.GetName] se příliš [Select_CString(visiting_liege.IsFemale,'nebavila','nebavil')]"
 tour_grounds_events.1003.c: "Beze rvačky mě nedostanou!"
 tour_grounds_events.1004.title: "Chvíle v divočině"
 tour_grounds_events.1004.desc.intro: "Na okamžik se ocitnu [Select_CString(ROOT.Char.IsFemale,'sama','sám')] v divokých lovištích [touring_grounds_scope.GetNameNoTooltip] s [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)]. Tak vzácná chvíle mi nabízí příležitost dát průchod citům, které k [visiting_liege.GetNameNoTooltip] chovám."
 tour_grounds_events.1004.desc.already_shagging: "\n\nNaše srdce i těla už dávno patří jeden druhému, ale jako panovníci máme na svou vášeň žalostně málo času. Teď však máme příležitost oddat se jí jako zvířata v divočině."
 tour_grounds_events.1004.desc.trying_to_shag: "\n\nMožná je to konečně má příležitost dát své city najevo. A pokud je [visiting_liege.GetNameNoTooltip] opětuje, nemusíme už být jen „[visiting_liege.GetTitleAsNameNoTooltip]“ a „[ROOT.Char.GetTitleAsNameNoTooltip]“, ale milenci zmítaní vášní."
 tour_grounds_events.1004.desc.outro: "\n\nŽivot se skládá z okamžiků a jen málokdy se naskytne takový jako tento. Odvážím se dát svým citům průchod?"
 tour_grounds_events.1004.a: "Vezmi si mě teď!"
 tour_grounds_events.1004.b: "Nechám to být."
 tour_grounds_events.1005.title: "$tour_grounds_events.1004.title$"
 tour_grounds_events.1005.desc.intro: "Ocitnu se [Select_CString(ROOT.Char.IsFemale,'sama','sám')] v lovištích [touring_grounds_scope.GetNameNoTooltip] s [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] a vychutnávám si okolní ticho, které jen občas přeruší volání nějakého zvířete."
 tour_grounds_events.1005.desc.already_shagging: "Náhle se na mě [stop_host_scope.GetNameNoTooltip] vrhne jako divoký [stop_host_scope.Custom('GetAnimalType')] a přitiskne mě ke skále s ohněm v očích.\n\n„Tak málokdy tě mohu mít jen pro sebe, [ROOT.Char.Custom('LoverPetName')], a teď jsme tu úplně sami, jen ptáci a zvěř nám budou svědky. Konečně dejme průchod naší vášni!“"
 tour_grounds_events.1005.desc.trying_to_shag: "Vidím, jak si mě [stop_host_scope.GetNameNoTooltip] prohlíží jako [stop_host_scope.Custom('GetAnimalType')] chystající se vrhnout na svou příští kořist.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip|U], musím říct, že dnes vypadáte božštěji než kterýkoli tvor, kterého jsem kdy spatřil v [touring_grounds_scope.Custom('TerrainTypeProvince')].“\n[stop_host_scope.GetNameNoTooltip] ke mně vykročí s dravým pohledem v očích a cítím, jak mé zdrženlivé odhodlání mizí."
 tour_grounds_events.1005.desc.outro: "\n\nZůstávám beze slov a hledím do touhou planoucích očí [stop_host_scope.GetTitleAsNameNoTooltip]. Sluší se vůbec, aby si [ROOT.Char.GetTitleAsNameNoTooltip] na turné dopřál chvíli vášně právě na takovém místě?"
 tour_grounds_events.1005.a: "Vezmi si mě!"
 tour_grounds.moment_in_the_woods: "Dopřál jsi [visiting_liege.GetName] nezapomenutelnou chvíli"
 tour_grounds_events.1005.b: "Dej ode mě ruce pryč, ty chlípníku!"
 tour_grounds.rebuffed_in_the_woods: "[visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'odmítla','odmítl')] tvé návrhy"
 tour_grounds_events.1006.title: "Nevhodné vměšování"
 tour_grounds_events.1006.desc.intro: "Během prohlídky [touring_grounds_scope.GetNameNoTooltip] se s [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] zapředeme do rozhovoru o"
 tour_grounds_events.1006.desc.mid.martial: "slávě války a boje,"
 tour_grounds_events.1006.desc.mid.learning: "božském plánu, který má [ROOT.Char.GetFaith.HighGodName] s lidstvem,"
 tour_grounds_events.1006.desc.mid.stewardship: "složitostech správy panství a vedení účtů,"
 tour_grounds_events.1006.desc.mid.diplomacy: "jemném umění diplomacie a usmiřování,"
 tour_grounds_events.1006.desc.mid.intrigue: "významu informací a klamu,"
 tour_grounds_events.1006.desc.outro: "když nás přeruší [landless_courtier_scope.Custom2('MyCharacterIntroduction', ROOT.Char)], podle všeho [Select_CString(landless_courtier_scope.IsFemale,'přesvědčená','přesvědčený')], že o tématu ví víc než já.\n\nAť už je to jakkoli, od pouhého dvořana je nanejvýš nevhodné přerušovat rozhovor mezi [visiting_liege.GetTitleAsNameNoTooltip|U] z [visiting_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] a [ROOT.Char.GetTitleAsNameNoTooltip|U], který mu slouží."
 tour_grounds_events.1006.a: "Mlč, ty [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.Custom2('InsultNoun', ROOT.Char)]."
 tour_grounds_events.1006.b: "Nebudu si toho všímat a půjdu dál."
 tour_grounds_events.1007.desc.intro: "Během prohlídky [touring_grounds_scope.GetNameNoTooltip] se s [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] zapředeme do rozhovoru o"
 tour_grounds_events.1007.desc.outro: "když nás přeruší jeden z dvořanů [stop_host_scope.GetNameNoTooltip].\n\n[Select_CString(landless_courtier_scope.IsFemale,'Dvořanka však sotva stačí něco říct, než ji její lenní pán umlčí','Dvořan však sotva stačí něco říct, než ho jeho lenní pán umlčí')]. I těch pár slov ale okamžitě prozradí, že [landless_courtier_scope.GetNameNoTooltip] ví o tématu mnohem víc, než by se [stop_host_scope.GetNameNoTooltip] kdy mohlo zdát.\n\nJestli [stop_host_scope.GetTitledFirstNameNoTooltip] nechce naslouchat takovým postřehům, možná by [landless_courtier_scope.GetNameNoTooltip] [Select_CString(landless_courtier_scope.IsFemale,'byla ochotná','byl ochotný')] připojit se raději k mému dvoru."
 tour_grounds_events.1007.a: "Přidej se k mému dvoru!"
 tour_grounds_events.1007.b: "Člověk nikdy nemá mluvit bez vyzvání."
 tour_grounds_events.1007.c: "Tohle je naprosto jasný zločin!"
 tour_grounds.recruited_my_courtier: "[landless_courtier_scope.GetName] [Select_CString(landless_courtier_scope.IsFemale,'byla zlákána k odchodu','byl zlákán k odchodu')]"
 tour_grounds_events.1017.desc.outro: "když nás přeruší jeden z dvořanů [stop_host_scope.GetNameNoTooltip].\n\nPřestože se ten bezvýznamný dvořan ozval naprosto bez vyzvání, [stop_host_scope.GetNameNoTooltip] ho kupodivu nepokárá a dovolí mu mluvit přímo se mnou.\n\nTo, co [landless_courtier_scope.GetNameNoTooltip] říká, je docela zajímavé, ale takové porušení společenských pravidel mě přesto zaskočí."
 tour_grounds_events.1017.a: "Vyslechnu si to."
 tour_grounds_events.1008.title: "Strašidelné příběhy"
 tour_grounds_events.1008.desc.intro: "Když si během prohlídky uděláme přestávku, můj mladý lenní pán stále překypuje energií a dožaduje se zábavy, zatímco zbytek průvodu nabírá síly.\n\nNaštěstí se úkolu s nadšením ujme [storyteller_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] a začne vyprávět místní pověsti. „V těchto [touring_grounds_scope.Custom('TerrainTypeProvince')] se skrývá víc, než se na první pohled zdá, [visiting_liege.Custom('GetLassLad')]."
 tour_grounds_events.1008.desc.mid.banshee: "V divočině kolem [touring_grounds_scope.GetNameNoTooltip] straší děsivě naříkající bánší. A měj se na pozoru: pokud uslyšíš její kvílení, někdo z tvých blízkých jistě zemře.“"
 tour_grounds_events.1008.desc.mid.ghul: "Po pohřebištích v [touring_grounds_scope.GetNameNoTooltip] se potuluje obludný ghúl a požírá lidské maso. Jestli tě zahlédne, možná usoudí, že dnes bude k večeři [visiting_liege.GetTitleAsNameNoTooltip|U]!“"
 tour_grounds_events.1008.desc.mid.azdaha: "Přímo pod našima nohama se zavrtává obrovská a děsivá Aždaha a čeká. Jakmile dostane příležitost, vyrazí ze země, rozevře své strašlivé zuby a spolkne tě celého!“"
 tour_grounds_events.1008.desc.mid.sasabonsam: "V těchto končinách žije obávaný Sasabonsam. Možná nás právě teď sleduje, schovaný jen kousek za hranicí našeho zraku. Polev na okamžik v ostražitosti a snese se shora, aby ti svými hroznými železnými zuby vysál krev, dokud nebudeš stejně růžový a zakrvácený jako on!“"
 tour_grounds_events.1008.desc.mid.ankou: "Samotný Ankou projíždí těmito kraji na svém voze mrtvých, sbírá ztracené duše a odváží je někam, kam ví snad jen [ROOT.Char.GetFaith.HighGodName]. Dávej pozor, [visiting_liege.Custom('GetLassLad')], jinak si odveze i tebe.“"
 tour_grounds_events.1008.desc.mid.witt_wieven: "Žijí tu mezi námi bílé ženy a hledají malé [visiting_liege.GetLadyLord] jako ty, aby je svedly z cesty. Jsou to duchové dávno mrtvých čarodějnic. Odvedou tě pryč a [ROOT.Char.GetFaith.DevilName] už se postará o zbytek.“"
 tour_grounds_events.1008.desc.mid.baba_yaga: "V těchto končinách provozuje svá kouzla strašlivá čarodějnice Baba Jaga. Dávej si pozor na chalupy, které vypadají, jako by sem nepatřily, jinak tě sežere a tvými kostmi si vyzdobí obydlí.“"
 tour_grounds_events.1008.desc.mid: "V těchto končinách se potuluje spousta děsivých a nepřirozených věcí. Nestvůry mnohem strašlivější než obyčejná zvěř, které by si ze všeho nejraději zpestřily jídelníček malým [visiting_liege.GetTitleAsNameNoTooltip|U].“"
 tour_grounds_events.1008.desc.outro: "\n\nPochybné historky, které [storyteller_scope.GetFirstNameNoTooltip] vypráví, na [Select_CString(visiting_liege.IsFemale,'malou','malého')] [visiting_liege.GetFirstNameNoTooltip] očividně působí. Možná bych měl zasáhnout."
 tour_grounds_events.1008.a: "A co se stalo potom?"
 tour_grounds_events.1008.b: "Ticho, [storyteller_scope.GetFirstNameNoTooltip]!"
 tour_grounds_events.1009.title: "$tour_grounds_events.1008.title$"
 tour_grounds_events.1009.desc.intro: "Starší členové našeho průvodu se zastaví, aby si od prohlídky odpočinuli, ale já stále překypuji energií a tihle znavení starci mi rychle začínají lézt na nervy.\n\nNaštěstí se zdá, že [storyteller_scope.GetName] mě rád pobaví strašidelnými příběhy z tohoto kraje. „V těchto [touring_grounds_scope.Custom('TerrainTypeProvince')] se skrývá víc, než se na první pohled zdá, [visiting_liege.Custom('GetLassLad')]."
 tour_grounds_events.1009.desc.mid.finished: "\n\nBrzy se k vyprávění přidá i [stop_host_scope.GetName] a oba mě zcela pohltí příběhy, po kterých mám nahnáno víc než jen trochu."
 tour_grounds_events.1009.desc.outro.interrupted: "\n\nPrávě když příběh začne být opravdu zajímavý, [stop_host_scope.GetName] vyprávění přeruší, trvá na tom, aby [storyteller_scope.GetNameNoTooltip] nepokračoval, a ujišťuje mě, že je to celé jen snůška nesmyslů."
 tour_grounds_events.1009.a: "To byl skvělý příběh!"
 tour_grounds_events.1009.b: "To bylo děsivé."
 tour_grounds_events.1009.c: "Zastavili jste to v tom nejlepším!"
 tour_grounds_events.1009.d: "Ještě že jste to zastavili."
 tour_grounds_events.1010.title: "[rival_courtier.GetFirstNameNoTooltip]: Věrný oř"
 tour_grounds_events.1010.desc: "Celý den projíždíme okolní krajinou každý na svém zvířeti, když mě náhle napadne geniální nápad!\n\nKaždý ví o rivalitě mezi [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] a [rival_courtier.GetName]. Kdyby se mi podařilo [Select_CString(rival_courtier.IsFemale,'sokyni zajmout, osedlat ji','soka zajmout, osedlat ho')] jako koně a nechat [visiting_liege.GetNameNoTooltip] projet se na [Select_CString(rival_courtier.IsFemale,'ní','něm')], jistě bych si získal přízeň [visiting_liege.GetTitleAsNameNoTooltip].\n\nJediný problém je samozřejmě dostat [rival_courtier.GetNameNoTooltip] sem. Ale na to mám své způsoby..."
 tour_grounds_events.1010.a: "Jdeme na to!"
 tour_grounds_events.1010.b: "Je to příliš riskantní."
 tour_grounds_events.1011.title: "$tour_grounds_events.1010.title$"
 tour_grounds_events.1011.desc: "Když projíždím krajinou [touring_grounds_scope.GetNameNoTooltip], náhle mě uprostřed cesty zastaví můj hostitel [stop_host_scope.GetName].\n\nZdá se, že se [stop_host_scope.GetNameNoTooltip] podařilo zajmout [rival_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] a [Select_CString(rival_courtier.IsFemale,'osedlat ji','osedlat ho')] jako koně. Teď už jen čeká, až nasednu a projedu se krajinou!\n\nJe to skvělá příležitost ukázat svou vrozenou nadřazenost, ale opravdu se snížím k něčemu takovému?"
 tour_grounds_events.1011.a: "Samozřejmě že ano!"
 tour_grounds_events.1011.b: "Ani [rival_courtier.GetFirstNameNoTooltip] si takové ponížení nezaslouží."
 tour_grounds_events.1012.title: "[stop_host_scope.Custom('get_region_root_vegetable')|U] jako [visiting_liege.GetTitleAsNameNoTooltip|U]"
 tour_grounds_events.1012.desc: "Náš skromný domov sice postrádá pohodlí a nádheru, na jaké je [visiting_liege.GetName] bezpochyby [Select_CString(visiting_liege.IsFemale,'zvyklá','zvyklý')], ale nedostatek okázalosti můžeme bohatě vynahradit pohostinností a štědrostí.\n\n[Select_CString(ROOT.Char.IsFemale,'Obávala jsem se','Obával jsem se')], že budu muset [visiting_liege.GetTitleAsNameNoTooltip] provést po okolí bez jediného daru, když tu náhle spatřím nádherně vzrostlý [ROOT.Char.Custom('get_region_root_vegetable')], který jako zázrakem vypadá přesně jako [visiting_liege.GetNameNoTooltip]! Takový rostlinný dvojník by jistě zajistil, že [visiting_liege.GetNameNoTooltip] na návštěvu [touring_grounds_scope.GetNameNoTooltip] nikdy nezapomene! Na druhou stranu by se mohl urazit, že ho přirovnávám k [ROOT.Char.Custom('get_region_root_vegetable')]."
 tour_grounds_events.1012.a: "A já si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')], že dokonalý dar neexistuje."
 tour_grounds_events.1012.b: "Nenápadně se toho [ROOT.Char.Custom('get_region_root_vegetable')] zbavte."
 tour_grounds_events.1012.c: "Tohle musí mít cenu celého jmění!"
 tour_grounds_events.1012.d: "Nechám si ho pro... osobní potřebu."
 turnip_that_looks_like_liege: "[ROOT.Char.Custom('get_region_root_vegetable')|U] připomínající [visiting_liege.GetTitleAsNameNoTooltip|U]"
 turnip_that_looks_like_liege_description: "Obyčejný [ROOT.Char.Custom('get_region_root_vegetable')], který se nápadně podobá [visiting_liege.GetName]."
 tour_grounds_events.1013.title: "$tour_grounds_events.1012.title$"
 tour_grounds_events.1013.desc: "[touring_grounds_scope.GetNameNoTooltip] má k tomu, co bych nazval civilizovaným krajem, hodně daleko. Žije tu sotva pár lidí a zdejší pohodlí nechává mnoho co přát.\n\nDnes se mě [stop_host_scope.GetTitleAsNameNoTooltip] pokusil ohromit tím, že mi předložil obyčejný [stop_host_scope.Custom('get_region_root_vegetable')], který se mi prý podobá.\n\nNejdřív protočím oči, ale po chvíli tu podobu začínám také vidět..."
 tour_grounds_events.1013.a: "To je nádherná věc!"
 tour_grounds.liege_impressed: "[visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'byla ohromena','byl ohromen')]"
 tour_grounds_events.1013.b: "Odporné. Zbavte se toho."
 tour_grounds.liege_insulted: "[visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'byla uražena','byl uražen')]"
 tour_grounds_events.1014.title: "[visiting_liege.GetNameNoTooltip]: Malý lovec"
 tour_grounds_events.1014.desc: "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] se očividně nemůže dočkat lovu v [touring_grounds_scope.GetNameNoTooltip] a touží po kořisti a slávě jako někdo dospělý.\n\nS čistým svědomím ale nemohu dovolit tak [Select_CString(visiting_liege.IsFemale,'mladé dívce','mladému chlapci')] pobíhat někde, kde by ji mohl zaživa rozsápat [ROOT.Char.Custom('GetAnimalType')].\n\nMohl bych však malému [visiting_liege.GetLadyLord] polichotit a připravit fingovaný lov bez nebezpečí skutečných zvířat."
 tour_grounds_events.1014.a: "Určitě se [Select_CString(visiting_liege.IsFemale,'jí','mu')] to bude líbit!"
 tour_grounds_events.1014.b: "Taková ztráta času."
 tour_grounds_events.1015.title: "Lov naoko"
 tour_grounds_events.1015.desc: "Už dlouho toužím vyrazit do divočiny a ulovit si čerstvou kořist, jak se na [ROOT.Char.GetTitleAsNameNoTooltip] sluší, ale dospělí a opatrovníci mi to zatím vždycky zakázali.\n\nDnes za mnou ale přijde [stop_host_scope.GetName] a nabídne mi možnost vyzkoušet loviště v [touring_grounds_scope.GetNameNoTooltip] jako skutečný lovec!\n\nKdyž však dorazím na místo, nečeká tam na mě žádný zuřivý [stop_host_scope.Custom('GetAnimalType')], ale jen kus dřeva pomalovaný tak, aby ho připomínal."
 tour_grounds_events.1015.a: "Tu bestii skolím!"
 tour_grounds_events.1015.b: "To má být nějaký vtip?"
 tour_grounds_events.1015.c: "Chci skutečného [stop_host_scope.Custom('GetAnimalType')]!"
 tour_grounds_events.1016.title: "Skutečný lov"
 tour_grounds_events.1016.desc: "Mému požadavku je vyhověno a brzy přede mnou stojí skutečné zvíře určené k lovu. Na můj povel ho zbaví pout a já zůstanu [Select_CString(ROOT.Char.IsFemale,'sama','sám')], abych tu bestii přemohl lukem.\n\nZhluboka se nadechnu a vypustím šíp. Teď už jen doufám, že poletí přesně k cíli."
 tour_grounds_events.1016.a: "Mířím přesně!"
 tour_grounds.killed_boar: "Zvíře skolím"
 tour_grounds.mauled_by_boar: "Minu"
 tour_grounds_events.3001.title: "Prohlídka pozemků [stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 tour_grounds_events.3001.desc.intro: "Můj příjezd k [stop_host_scope.Custom('FortifiedBuilding')] [stop_host_scope.GetTitledFirstNameNoTooltip] v [touring_grounds_scope.GetProvince.GetName] provází fanfáry hodné [ROOT.Char.GetTitleAsNameNoTooltip] celého panství,"
 tour_grounds_events.3001.desc.type.majesty: "a místní jsou okázalostí a nádherou mého doprovodu očividně ohromeni.\n\n"
 tour_grounds_events.3001.desc.type.taxation: "a vůz s truhlami i mí výběrčí daní okamžitě přitáhnou pozornost.\n\n"
 tour_grounds_events.3001.desc.type.intimidation: "zatímco přísná kázeň mých početných stráží vzbuzuje mezi poddanými zjevné obavy.\n\n"
 tour_grounds_events.3001.desc.mid.hates_vassal: "Sdílet komnaty s tím [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] je odporná nutnost. Snad to bude rychle za mnou."
 tour_grounds_events.3001.desc.mid.lover: "Bolí mě, že se svou láskou musím na veřejnosti zachovávat všechny ty formality... kdyby jen zbýval čas být spolu o samotě."
 tour_grounds_events.3001.desc.mid.friend: "Přestože nás svazují všechny ty formality, návštěva dobrého přítele je vždy vítaným zpestřením."
 tour_grounds_events.3001.desc.mid.close_family: "S [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] se obejmeme, ale pečlivě přitom zachováme důstojnost a formálnost této příležitosti."
 tour_grounds_events.3001.desc.mid.house: "Příležitost znovu spatřit [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)] a přesvědčit se, zda zdejší poměry odpovídají vznešenosti rodu [ROOT.Char.GetHouse.GetBaseName]."
 tour_grounds_events.3001.desc.mid.powerful_vassal: "Prokážu náležité uznání postavení, které [stop_host_scope.GetNameNoTooltip] zaujímá mezi [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] vazaly... alespoň do jisté míry."
 tour_grounds_events.3001.desc.mid.default: "Můj vazal mě svědomitě přijme se všemi náležitými projevy úcty."
 tour_grounds_events.3001.desc.mid: "\n\n[stop_host_scope.GetFirstNameNoTooltip] mi představí plánovanou prohlídku a ujišťuje mě, že [stop_host_scope.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] je tak krásná a půvabná země, že pouhý pohled na její města a pole bude zábavou sám o sobě."
 tour_grounds_events.3001.desc.outro: "\n\nTo ukáže až čas."
 tour_grounds_events.3001.a: "Tak do toho!"
 tour_grounds_events.3002.title: "Lovecké umění"
 tour_grounds_events.3002.desc.intro: "Když pokračuji v prohlídce pozemků [touring_grounds_scope.GetNameNoTooltip], můj hostitel se rozhodne pochlubit svým loveckým uměním. Zatímco se k němu upírají všechny zraky,"
 tour_grounds_events.3002.desc.mid.crit: "[stop_host_scope.GetNameNoTooltip] jediným výstřelem prostřelí lebku vzdáleného [stop_host_scope.Custom('GetAnimalType')].\n\nVšichni vypadají ohromeně, ale pro mě by to mohla být"
 tour_grounds_events.3002.desc.mid.succ: "[stop_host_scope.GetNameNoTooltip] s očividnou lehkostí skolí nedalekého [stop_host_scope.Custom('GetAnimalType')].\n\nVšichni vypadají ohromeně, ale pro mě by to mohla být"
 tour_grounds_events.3002.desc.mid.fail: "[stop_host_scope.GetNameNoTooltip] svůj cíl ani neškrábne a můj průvod se tím náramně baví.\n\nZatímco se všichni smějí, vidím v tom"
 tour_grounds_events.3002.desc.outro: "příležitost překonat svého hostitele a ukázat všem, jak střílí z luku [ROOT.Char.GetTitleAsNameNoTooltip]!"
 tour_grounds_events.3002.a: "Lepší lovec jsem já!"
 tour_grounds_events.3002.b: "Blahopřeji, [stop_host_scope.GetNameNoTooltip]."
 tour_grounds_events.3003.title: "Riskantní kořist"
 tour_grounds_events.3003.desc.intro: "S loveckým lukem po boku mě jeden z členů družiny upozorní na [stop_host_scope.Custom('GetAnimalType')], který se pohybuje pod svahem nedaleko od nás. Z okraje srázu bych mu měl dokázat prostřelit srdce.\n\n"
 tour_grounds_events.3003.desc.mid.high_skill: "Pro [Select_CString(ROOT.Char.IsFemale,'zkušenou lovkyni, jako jsem já','zkušeného lovce, jako jsem já')] by to nemělo být těžké, i když bez rizika to nebude."
 tour_grounds_events.3003.desc.mid.low_skill: "Vypadá to na obtížný výstřel, ale pokud se trefím, bezpochyby ohromím celý svůj průvod."
 tour_grounds_events.3003.desc.outro: "Půda pod nohama nevypadá zrovna pevně, ale když budu opatrně našlapovat, měl bych zvíře bez problémů skolit."
 tour_grounds_events.3003.a: "Tohle by mělo být snadné."
 tour_grounds_events.3003.b: "Ať výstřel zkusí někdo jiný."
 tour_grounds_events.3004.title: "Můj [visiting_liege.GetTitleAsNameNoTooltip|U], lovec"
 tour_grounds_events.3004.desc.intro: "Během prohlídky pozemků se [visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'odhodlala','odhodlal')] k riskantnímu výstřelu z vrcholu srázu na [stop_host_scope.Custom('GetAnimalType')] pod sebou."
 tour_grounds_events.3004.desc: "Na okamžik to vypadalo, že [Select_CString(visiting_liege.IsFemale,'spadne','spadne')], ale rychle znovu získá pevnou půdu pod nohama a zvíře jediným zásahem skolí.\n\nCelá družina je loveckým uměním [visiting_liege.GetTitleAsNameNoTooltip] očividně uchvácena. [visiting_liege.GetNameNoTooltip] ke mně přichází s krví čerstvě ulovené zvěře na rukou a zjevně očekává pochvalu."
 tour_grounds_events.3004.a: "Výborný zásah, [visiting_liege.GetTitleAsNameNoTooltip]."
 tour_grounds_events.3004.b: "To mě má jako ohromit?"
 tour_grounds_events.3005.title: "Riziko se vyplatilo"
 tour_grounds_events.3005.desc.intro: "Nohy mě nezradí a má muška už vůbec ne. Jediným šípem skolím zvíře, aniž bych na zrádném okraji srázu byť jen zavrávoral. Lovecká družina je očividně ohromena a okolím se rozléhá potlesk mých společníků.\n\n"
 tour_grounds_events.3005.desc.mid.congrats: "Můj hostitel, [stop_host_scope.GetName], mi osobně přijde pogratulovat k úlovku. Když je hotovo, přidám kořist k ostatním a pokračuji v prohlídce pozemků."
 tour_grounds_events.3005.desc.mid.insult: "Můj hostitel, [stop_host_scope.GetName], však působí mnohem méně ohromeně. S tváří plnou pohrdání a závisti tvrdí, že na mém výstřelu nebylo vůbec nic působivého."
 tour_grounds_events.3005.a: "Výborně."
 tour_grounds_events.3005.a.bad: "Jaký malicherný [stop_host_scope.Custom2('InsultNoun', ROOT.Char)]."
 tour_grounds_events.3006.title: "Pád [visiting_liege.GetTitleAsNameNoTooltip|U]"
 tour_grounds_events.3006.desc: "Na okamžik to vypadá, že se [visiting_liege.GetNameNoTooltip] možná skutečně trefí, ale jakmile začne ztrácet půdu pod nohama, je jasné, že brzy přijde zranění i ponížení.\n\nSamozřejmě bych mohl svého lenního pána zachytit, ale tím bych riskoval vlastní zranění."
 tour_grounds_events.3006.a: "Musím svého [visiting_liege.GetTitleAsNameNoTooltip|U] ochránit!"
 tour_grounds_events.3006.b: "Ať spadne."
 tour_grounds_events.3006.c: "Strčím [Select_CString(visiting_liege.IsFemale,'ji','ho')] stranou a vystřelím sám!"
 tour_grounds_events.3007.title: "$tour_grounds_events.3006.title$"
 tour_grounds_events.3007.desc.intro: "Bohužel mě nohy tentokrát zradí. Náhle ztratím pevnou půdu pod nohama a mé tělo se ocitne ve vzduchu, vydané na milost světu, který stvořil [ROOT.Char.GetFaith.CreatorName].\n\n"
 tour_grounds_events.3007.desc.mid.protected: "Vzápětí mě však zachytí [stop_host_scope.GetName] a strhne zpět na nohy. Při tom hrdinském zákroku se můj zachránce sám zřítí tváří k zemi."
 tour_grounds_events.3007.desc.mid.fell: "Během pádu se otočím a spatřím [stop_host_scope.GetName], jak jen nečinně přihlíží pádu svého [ROOT.Char.GetTitleAsNameNoTooltip]. Když mé tělo znovu narazí na zem, cítím, jak se mi trhá kůže a má božská krev smáčí půdu."
 tour_grounds_events.3007.desc.mid.took_the_shot: "Během pádu se otočím a spatřím [stop_host_scope.GetName], jak zaujímá mé místo. Nejenže se mě ani nepokusí zachránit, ale ještě sám vystřelí! Mé tělo s prasknutím dopadne na zem a já zaslechnu potlesk. [stop_host_scope.GetNameNoTooltip] očividně [Select_CString(stop_host_scope.IsFemale,'uspěla','uspěl')] tam, kde jsem já [Select_CString(ROOT.Char.IsFemale,'selhala','selhal')], zatímco se svíjím bolestí a ponížením."
 tour_grounds_events.3007.a: "Pro dnešek už toho mám dost."
 tour_grounds_events.3008.title: "Jezdecká nehoda"
 tour_grounds_events.3008.desc: "Projíždím pozemky [touring_grounds_scope.GetNameNoTooltip] a v hlavě nemám jedinou starost.\n\nNáhle mě vytrhne ze zamyšlení dítě, které vběhne přímo před mého koně a nadšeně mává rukama, když spatří svého [ROOT.Char.GetTitleAsNameNoTooltip]. Objeví se tak náhle, že sotva stihnu zareagovat, natož si uvědomit, jestli ho vůbec znám. Otěže mi kloužou ve zpocených dlaních. Musím jednat!"
 tour_grounds_events.3008.a: "Pokusím se dítěti vyhnout."
 tour_grounds_events.3008.b: "Mé jízdě nebude nic stát v cestě."
 tour_grounds_events.3009.title: "Ušlapáno panovníkem"
 tour_grounds_events.3009.desc.intro: "Je tu další den návštěvy [visiting_liege.GetName] a vše zpočátku probíhá dobře. Pak ale [trampled_child_scope.GetName], ponechané bez dozoru, vběhne přímo před koně [visiting_liege.GetFirstNameNoTooltip] a ten ho bez milosti ušlape k smrti!\n\nNejšokující na tom je, že [visiting_liege.GetNameNoTooltip] se tomu ani viditelně nepokusí zabránit."
 tour_grounds_events.3009.desc.mid.my_kid: "Nezbývá mi než přihlížet, jak mou vlastní krev a maso drtí kopyta té koňské bestie."
 tour_grounds_events.3009.desc.mid.not_my_kid: "Nestihnu ani odvrátit zrak a ubohé dítě už drtí kopyta té bestie."
 tour_grounds_events.3009.desc.outro.my_kid_dead: "Když ten hrůzný výjev skončí, spatřím nehybné tělo svého [ROOT.Char.Custom2('RelationToMeShort',trampled_child_scope)], proměněné na zemi v krvavou změť."
 tour_grounds_events.3009.desc.outro.not_my_kid_dead: "Když ten hrůzný výjev skončí, ubohé dítě zůstane nehybně ležet v kaluži vlastní krve."
 tour_grounds_events.3009.desc.outro.alive: "Naštěstí [trampled_child_scope.GetNameNoTooltip] celé neštěstí přežije, i když bez zranění se to neobejde."
 tour_grounds_events.3009.a.callous: "Se mnou to nemá nic společného."
 tour_grounds_events.3009.a: "Jak odporné!"
 tour_grounds_events.3009.b: "[visiting_liege.GetNameNoTooltip] je zrůda."
 tour_grounds.trampled_child_nemesis: "[stop_host_scope.GetNameNoTooltip] [Select_CString(stop_host_scope.IsFemale,'přísahala','přísahal')] pomstu"
 tour_grounds_events.3010.title: "Nespolehlivý oř"
 tour_grounds_events.3010.desc.intro: "Má projížďka po pozemcích [touring_grounds_scope.GetNameNoTooltip] skončí náhlým škubnutím, když můj ceněný kůň klopýtne o kámen. Rychle se sice vzpamatuje a já ztratím rovnováhu jen na okamžik, ale za zády už slyším, jak se členové mého průvodu pochechtávají.\n\n"
 tour_grounds_events.3010.desc.mid.irritable: "Můj údajně skvělý oř mě zklamal a v útrobách se mi začíná vařit směs ponížení a vzteku."
 tour_grounds_events.3010.desc.mid.calm: "Je mi to trochu trapné, ale vím, že zvíře za to ve skutečnosti nemůže."
 tour_grounds_events.3010.desc.outro: "[ROOT.Char.GetTitleAsNameNoTooltip|U] má působit nedotknutelně vznešeně a vzbuzovat úctu všech svých poddaných. Tahle příhoda však mou dokonalou image poněkud narušila."
 tour_grounds_events.3010.a: "Zabte tu bestii a přiveďte mi jinou!"
 tour_grounds_events.3010.b: "Každý někdy udělá chybu."
 tour_grounds_events.3011.title: "$tour_grounds_events.3010.title$"
 tour_grounds_events.3011.desc.intro: "Když projíždím pozemky s [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)], jeho kůň klopýtne o kámen a na okamžik svého jezdce vyvede z rovnováhy. Jakmile se někteří členové průvodu začnou pochechtávat, [visiting_liege.GetNameNoTooltip] sesedne"
 tour_grounds_events.3011.desc.mid.irritable: "a v záchvatu vzteku bezcitně podřízne ubohému zvířeti hrdlo. Pak jen sleduje, jak z něj pomalu vyprchává život."
 tour_grounds_events.3011.desc.mid.calm: "a pečlivě vyšle šíp přímo mezi oči ubohého zvířete."
 tour_grounds_events.3011.desc.outro: "\n\n„Nemám využití pro zvířata ani poddané, kteří mě zklamou. Vždycky si mohu opatřit jiné.“"
 tour_grounds_events.3011.a: "Seženu vám jiného koně, [visiting_liege.GetLadyLord]!"
 tour_grounds_3011.vassal_paid_for_new_horse: "[stop_host_scope.GetNameNoTooltip] [Select_CString(stop_host_scope.IsFemale,'nabídla','nabídl')], že koupí nového koně"
 tour_grounds_events.3011.b: "Rozumím."
 tour_grounds_3011.vassal_did_not_pay: "[Select_CString(ROOT.Char.IsFemale,'Koupila','Koupil')] jsem nového koně"
 tour_grounds_events.3012.title: "Pytláci!"
 tour_grounds_events.3012.desc.intro: "Když se svým doprovodem projíždím krajinou, zaslechnu, jak se okolím nesou tlumené hlasy. Pošlu jednoho chlapce napřed, aby se podíval, co se děje, a po návratu mi oznámí, že kousek před námi řádí tlupa pytláků.\n\n"
 tour_grounds_events.3012.desc.mid.sadistic: "Tohle je ideální příležitost způsobit několika nic netušícím duším trochu zaslouženého utrpení a zároveň se zavděčit [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 tour_grounds_events.3012.desc.mid: "Mě se to sice netýká, ale kdybych zdejší kraj zbavil této nezákonné činnosti, u [stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] bych si tím nepochybně [Select_CString(ROOT.Char.IsFemale,'šplhla','šplhl')]."
 tour_grounds_events.3012.desc.outro: "\n\nTy ničemy bych mohl bez větších potíží pochytat a [stop_host_scope.GetNameNoTooltip] předložit jejich hlavy a ruce."
 tour_grounds_events.3012.a: "Je čas vyrazit na lov."
 tour_grounds_events.3012.b: "Za poplatek je nechám být."
 tour_grounds_events.3012.c: "Vyhneme se jim."
 tour_grounds_events.3013.title: "Pytle plné kusů"
 tour_grounds_events.3013.desc: "Od [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] jsem se na nějakou dobu [Select_CString(ROOT.Char.IsFemale,'oddělila','oddělil')], a když se znovu setkáme, spatřím [visiting_liege.GetNameNoTooltip] na koni s několika rudými, prosakujícími pytli zavěšenými po boku.\n\n[visiting_liege.GetNameNoTooltip] mi vysype jejich obsah k nohám a s hrůzou sleduji, jak se ven sypou useknuté ruce a hlavy několika nešťastníků, jejichž tváře navždy zůstaly zkřivené děsem.\n\n„Dovolil jsem si zbavit vaše země pytláků a zlodějů. Není zač, příteli.“"
 tour_grounds_events.3013.a: "Děkuji, [visiting_liege.GetLadyLord]."
 tour_grounds.vassal_impressed: "[stop_host_scope.GetFirstNameNoTooltip] je [Select_CString(stop_host_scope.IsFemale,'ohromena','ohromen')]"
 tour_grounds_events.3013.b: "Jaká hrůza!"
 tour_grounds.vassal_horrified: "[stop_host_scope.GetFirstNameNoTooltip] je [Select_CString(stop_host_scope.IsFemale,'zděšena','zděšen')]"
 tour_grounds_events.3014.title: "Zdanitelný přepych"
 tour_grounds_events.3014.desc: "Když mi ukazují všechny pamětihodnosti v [touring_grounds_scope.GetNameNoTooltip], začínám si všímat zdejšího naprostého přepychu.\n\nPřestože je [stop_host_scope.GetFirstNameNoTooltip] pouhý [stop_host_scope.GetTitleAsNameNoTooltip], žije v poměrném luxusu a peněz má očividně víc než dost.\n\nKdyž vidím, kolik oken má zdejší sídlo, napadne mě zavést daň z oken a přebytečné bohatství z [stop_host_scope.GetTitleAsNameNoTooltip|U] pěkně vytáhnout."
 tour_grounds_events.3014.a: "Zavedeme daň z oken."
 tour_grounds_events.3014.b: "Tentokrát to nechám být."
 tour_grounds_events.3015.title: "Daň z oken"
 tour_grounds_events.3015.desc: "Pečlivě jsem [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(ROOT.Char.IsFemale,'ukázala','ukázal')] všechny nádherné pamětihodnosti v [touring_grounds_scope.GetNameNoTooltip] a [Select_CString(ROOT.Char.IsFemale,'považovala se','považoval se')] za skvělého hostitele.\n\nPak si však všimnu, že [visiting_liege.GetNameNoTooltip] obrací pozornost k mému obydlí, ukazuje na něj a cosi si pro sebe mumlá. Zeptám se, co se děje, a [visiting_liege.GetNameNoTooltip] se zazubí.\n\n„Ale nic, jen jsem počítal okna. O povinné dani z oken přece víte, že? Pochází už ze samotných počátků [visiting_liege.GetPrimaryTitle.GetNameNoTooltip] a tak nerozumné množství oken přece nemohu nechat řádně nezdaněné.“"
 tour_grounds_events.3015.a: "Dobrá, tu vaši daň z oken zaplatím."
 tour_grounds.vassal_paid_tax: "[stop_host_scope.GetName] daň [Select_CString(stop_host_scope.IsFemale,'zaplatila','zaplatil')]"
 tour_grounds_events.3015.b: "Daň z čeho že?"
 tour_grounds.vassal_refused_to_pay_tax: "[stop_host_scope.GetName] daň [Select_CString(stop_host_scope.IsFemale,'odmítla','odmítl')] zaplatit"
 tour_grounds.vassal_won_tax_duel: "[stop_host_scope.GetName] se placení daně [Select_CString(stop_host_scope.IsFemale,'vyhnula','vyhnul')]"
 tour_grounds_events.3016.title: "Památka"
 tour_grounds_events.3016.desc: "Konečně se mi podaří ocitnout se [Select_CString(ROOT.Char.IsFemale,'o samotě','o samotě')] v divočině [touring_grounds_scope.GetNameNoTooltip] a mé myšlenky zabloudí k [liege_lover_scope.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nNemohu popřít, že [touring_grounds_scope.GetNameNoTooltip] je skutečně nádherné místo, téměř dost krásné, aby se vyrovnalo [Select_CString(liege_lover_scope.IsFemale,'mé milované','mému milovanému')] [liege_lover_scope.GetNameNoTooltip]. Cítím nutkání zanechat tu stopu, aby každý, kdo projde [touring_grounds_scope.GetNameNoTooltip], poznal mou lásku k [liege_lover_scope.GetNameNoTooltip]. Třeba bych mohl vyřezat jeho jméno do [touring_grounds_scope.Custom('get_carvable_surface')]!"
 tour_grounds_events.3016.a: "Tak se stane."
 tour_grounds_events.3016.b: "Ne, tohle místo je dokonalé takové, jaké je."
 tour_grounds_events.3017.title: "Znesvěceno"
 tour_grounds_events.3017.desc: "Konečně doženu svého [visiting_liege.GetTitleAsNameNoTooltip|U] a ke své hrůze zjistím, že vyrývá své jméno do [touring_grounds_scope.Custom('get_carvable_surface')].\n\n[visiting_liege.GetNameNoTooltip] samozřejmě nemohl vědět, že právě tento [touring_grounds_scope.Custom('get_carvable_surface')] má pro místní velký duchovní význam. Kdyby se dozvěděli, že jejich [visiting_liege.GetTitleAsNameNoTooltip|U] takové posvátné místo [Select_CString(visiting_liege.IsFemale,'znesvětila','znesvětil')], proklínali by jméno [visiting_liege.GetName] ještě po celé generace!"
 tour_grounds_events.3017.a: "Jaká škoda."
 tour_grounds_events.3017.b: "Vezmu vinu na sebe!"
 tour_grounds_events.3018.title: "$tour_grounds_events.3017.title$"
 tour_grounds_events.3018.desc: "Spokojeně pokračuji v rytí svého nápisu do [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')], když vedle sebe náhle zaslechnu zděšené zalapání po dechu.\n\n[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] při pohledu na mé dílo vypadá naprosto [Select_CString(stop_host_scope.IsFemale,'zděšeně','zděšeně')] a vzápětí ke mně přistoupí s vysvětlením.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jistě jste nevěděl, že tento [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] považují místní v [touring_grounds_scope.GetNameNoTooltip] za posvátný!“"
 tour_grounds_events.3018.desc.outro.took_the_blame: "„Nebojte se, vezmu vinu na sebe. Jen už se o tom nikdy nezmiňujte.“"
 tour_grounds_events.3018.desc.outro.blamed_liege: "„Rolníci a duchovní z [touring_grounds_scope.GetNameNoTooltip] budou za toto znesvěcení proklínat vaše jméno až na věčnost!“"
 tour_grounds_events.3018.a.took_blame: "Děkuji."
 tour_grounds_events.3018.a.was_blamed: "Proč nikdy nemůže být [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')] prostě jen [touring_grounds_scope.GetProvince.Custom('get_carvable_surface')]?"
 tour_grounds_events.3019.title: "Zdanitelný přepych"
 tour_grounds_events.3019.desc: "[touring_grounds_scope.GetNameNoTooltip] působí jako skutečně přepychové a rozhazovačné místo, kterému vládne přebujelý [stop_host_scope.GetTitleAsNameNoTooltip].\n\nKamkoli se podívám, všude vidím známky jediné věci: nepřiznaného zdanitelného luxusu. Počet dobytka je zjevně mnohem vyšší, než se uvádí, a sídlo [stop_host_scope.GetTitleAsNameNoTooltip] je skoro dost honosné i pro [ROOT.Char.GetTitleAsNameNoTooltip|U]!\n\n[greedy_entourage_member.GetName] navrhuje, abych tento přebytek zdanil, protože [stop_host_scope.GetName] očividně neodvádí, co má."
 tour_grounds_events.3019.a: "Zdaňte [stop_host_scope.GetTitleAsNameNoTooltip]!"
 tour_grounds_events.3019.b: "Protentokrát to přehlédnu."
 tour_grounds_events.3020.title: "$tour_grounds_events.3019.title$"
 tour_grounds_events.3020.desc: "[visiting_liege.GetName] působí poslední dobou trochu odtažitě a roztržitě, občas si něco mumlá pro sebe a šeptá si s [greedy_entourage_member.GetName]. Nakonec ke mně přistoupí a bez okolků řekne, co má na srdci.\n\n„Jako [stop_host_scope.GetTitleAsNameNoTooltip] si jistě uvědomujete své finanční povinnosti vůči mně coby svému lennímu pánovi. Když se rozhlížím po všem tom přepychu vašeho sídla, nemohu se zbavit dojmu, že jste na daních trochu šidili. Asi bychom to měli napravit.“"
 tour_grounds_events.3020.a: "Zaplatil jsem všechno, co dlužím!"
 tour_grounds_events.3020.b: "Budiž."
 tour_grounds_events.3040.title: "Neloajální poddaní"
 tour_grounds_events.3040.desc.intro: "Začne mě zajímat, jak žije spodina v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], a tak navštívím podnik, kde se místní začínají pořádně rozvášňovat. Jeden muž stojí na stole a strhává na sebe pozornost všech v doslechu.\n\n„K čemu vůbec potřebujeme [stop_host_scope.GetTitleAsNameNoTooltip|U]? [stop_host_scope.GetFirstName]"
 tour_grounds_events.3040.desc.mid.wrong_language: "ani neumí náš jazyk,"
 tour_grounds_events.3040.desc.mid.wrong_culture: "je zatracený cizák,"
 tour_grounds_events.3040.desc.mid.wrong_faith: "je zatracený [stop_host_scope.GetFaith.GetAdherentName], který skončí v [angry_peasant.GetFaith.NegativeAfterLife],"
 tour_grounds_events.3040.desc.mid.shit_beer: "krmí nás tímhle hnusným [angry_peasant.Custom('RegionalAlcoholicDrink')],"
 tour_grounds_events.3040.desc.mid.shit_weed: "cpe do nás levný hašiš a čeká, že budeme držet hubu,"
 tour_grounds_events.3040.desc.mid.conscription: "nutí nás bojovat své bitvy, zatímco [Select_CString(stop_host_scope.IsFemale,'sama odpočívá','sám odpočívá')] na vavřínech,"
 tour_grounds_events.3040.desc.mid.high_taxes: "ždímá z nás krev těmi zatracenými daněmi,"
 tour_grounds_events.3040.desc.mid.just_plain_dislike_em: "je ten nejhorší [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [stop_host_scope.Custom2('InsultNoun', ROOT.Char)], jakého jsem kdy viděl,"
 tour_grounds_events.3040.desc.outro: "a přesto od nás čeká bezmeznou věrnost!“\n\nCelý lokál propukne v dupání a potlesk. Je očividné, že můj [stop_host_scope.GetTitleAsNameNoTooltip|U] není mezi vlastními lidmi příliš oblíbený."
 tour_grounds_events.3040.a: "Zatkněte ty zrádce!"
 tour_grounds_events.3040.b: "Neopovažujte se hanět [stop_host_scope.GetTitleAsNameNoTooltip|U]! Na ně!"
 tour_grounds_events.3040.c: "Tihle rolníci na to kápli."
 tour_grounds_events.3050.title: "Pořádná nakládačka"
 tour_grounds_events.3050.desc: "„Dej mi moje zatracené peníze!“\n\nZvuk cákající krve a praskajících kostí mě přiměje obrátit pozornost k zapadlé strouze, kde místní rváč drží zbídačeného [Select_CString(beaten_peasant.IsFemale,'chudáka za límec','chudáka za límec')].\n\nObvykle by něco takového bylo hluboko pod mou úroveň, ale opravdu mohu dovolit, aby se mi takhle očividný zločin odehrával přímo před očima?"
 tour_grounds_events.3050.a: "Stráže! Zatkněte toho hlupáka!"
 tour_grounds_events.3050.b: "Dobrý [ROOT.Char.GetTitleAsNameNoTooltip|U] chrání své poddané!"
 tour_grounds_events.3050.b.success: "Vyhraješ souboj"
 tour_grounds_events.3050.b.failure: "Prohraješ souboj"
 tour_grounds_events.3050.c: "„Hej, nechte mě mu taky trochu naložit!“"
 tour_grounds_events.3060.title: "To nejlepší z [ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U]"
 tour_grounds_events.3060.desc.intro: "[stop_host_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se dnes rozhodne ukázat mi svá kasárna.\n\n"
 tour_grounds_events.3060.desc.light_infantry: "Řada za řadou lehké pěchoty stojí v pozoru ve své zbroji a čeká na mou inspekci."
 tour_grounds_events.3060.desc.archers: "Řada za řadou lučištníků stojí připravena s luky v rukou."
 tour_grounds_events.3060.desc.heavy_infantry: "Přede mnou stojí moře blyštivé zbroje a zdá se, že žádnému z vojáků její tíha ani trochu nevadí."
 tour_grounds_events.3060.desc.cavalry: "Koně frkají a přešlapují, jako by se nemohli dočkat, až je jezdci vyšlou do útoku."
 tour_grounds_events.3060.desc.camel_cavalry: "Velbloudi sténají a kopou, jako by se nemohli dočkat, až vyděsí nepřátelskou jízdu."
 tour_grounds_events.3060.desc.elephant_cavalry: "Ohromuje mě samotná velikost sloní jízdy a děsí mě pomyšlení na poslední okamžiky těch, které rozdrtí pod nohama."
 tour_grounds_events.3060.desc.outro: "Jsou to znamenití vojáci, ale je škoda, aby celý den jen nečinně postávali."
 tour_grounds_events.3060.a: "Mohli by vymýtit zločin!"
 tour_grounds_events.3060.b: "Možná by se dali využít efektivněji."
 tour_grounds_events.3060.b.success: "Kasárna byla vylepšena"
 tour_grounds_events.3060.b.failure: "Tvé rady nefungovaly"
 tour_grounds_events.3060.b.vassal: "[visiting_liege.GetFirstName] zasahuje do tvé armády"
 tour_grounds_events.3060.c: "Takové vojáky bych [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] využít."
 tour_grounds_events.3060.d: "Možná bych se tu [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] něčemu přiučit."
 tour_grounds_events.3070.title: "Chvíle ticha"
 tour_grounds_events.3070.desc.intro: "Se svým doprovodem se toulám po nádherném okolí [ROOT.Char.GetCurrentLocation.GetName] a nakonec zavítáme"
 tour_grounds_events.3070.desc.royal_garden: "do velkolepé královské zahrady, která patří [stop_host_scope.GetName].\n\nZa jejími zdmi jsme jen já, několik méně významných šlechticů a dokonale promyšlená, pečlivě uspořádaná zeleň. Když se na chvíli zastavím a jen vnímám okolí, zaplaví mě klid, jaký mám možnost zažít jen málokdy."
 tour_grounds_events.3070.desc.royal_forest: "do kouzelného královského lesa, který patří [stop_host_scope.GetName].\n\nV lese není jediný rolník ani méně významný šlechtic. Jsme tu jen já, mí nejbližší důvěrníci a dílo, které stvořil [ROOT.Char.GetFaith.CreatorName|U]. Připadám si přenesen do světa naprostého klidu, do časů, než bouřlivá lidská srdce poskvrnila zemi neřestí a slabostí."
 tour_grounds_events.3070.desc.leisure_palace: "do letohrádku, který patří [stop_host_scope.GetName].\n\nVnější stěny paláce zdobí nádherné sochy a místní květena uspořádaná s nesmírnou pečlivostí a interiér je stejně velkolepý a přepychový. Každý pohled i vjem v tomto paláci jako by byl stvořen k utišení unavené duše."
 tour_grounds_events.3070.desc.outro: "\n\nDokázal bych tu zůstat navěky."
 tour_grounds_events.3070.a: "Tady se toho mohu tolik naučit."
 tour_grounds_events.3070.b: "Poklidná procházka je sama o sobě darem."
 tour_grounds_events.3070.c: "Rozmístěte vojáky. Tento klid musíme chránit!"
 tour_grounds_events.3080.title: "Místní vojsko"
 tour_grounds_events.3080.desc.intro: "Při prohlídce vojenských zařízení v [ROOT.Char.GetCurrentLocation.GetName] narazím na další chloubu [stop_host_scope.GetName]:"
 tour_grounds_events.3080.desc.military_academy: "vojenskou akademii.\n\nVšude kolem vidím urozeně působící $knight_culture_player_plural_no_tooltip_lowercase$, jak cvičí a zdokonalují své schopnosti s vědomím, že válka nikdy není daleko."
 tour_grounds_events.3080.desc.march: "pohraniční marky.\n\nPo celé hranici se s obdivuhodnou efektivitou připravují na každého vetřelce či narušitele zákona, který se jim dostane do cesty."
 tour_grounds_events.3080.desc.siege_works: "obléhací dílny.\n\nO stroje se zde bez ustání pečuje. Některé se opravují, jiné se teprve poprvé sestavují. Raději ani nepomýšlím na příštího ničemu, jehož hradby budou muset těmto strojům čelit."
 tour_grounds_events.3080.desc.royal_armories: "královské zbrojnice.\n\nLesk naleštěných zbrojí lemujících královské zbrojnice propůjčuje místnosti téměř nadpozemskou záři. Ze všech stran visí řady přileb a kroužkových zbrojí a vzduchem se nese lehký pach oleje."
 tour_grounds_events.3080.desc.jousting_lists: "rytířské kolbiště.\n\nRžání a frkání koní přerušuje náhlé tříštění kopí. Dunění kopyt vytlouká úsečný rytmus a všude kolem se rozléhají povzbuzující výkřiky."
 tour_grounds_events.3080.desc.archery_ranges: "lukostřelecké střelnice.\n\nPravidelné #EMP buch-buch-buch#! šípů dopadajících do terčů doprovází brnkání tětiv. Mírný vánek se občas opře silněji a začne cvičícím lučištníkům pořádně komplikovat život."
 tour_grounds_events.3080.desc.outro: "\n\n[ROOT.Char.GetCurrentLocation.GetName] je znamenité vojenské centrum a zdejší postupy mě mohou mnohému naučit."
 tour_grounds_events.3080.a: "A já se také učit budu."
 tour_grounds_events.3080.b: "Tihle zahálející muži by mohli pátrat po zločincích!"
 tour_grounds_events.3080.c: "Možná bych si měl nechat něco předvést."
 tour_grounds_events.3090.title: "Farmářská pýcha"
 tour_grounds_events.3090.desc.intro: "Při toulkách krajinou [ROOT.Char.GetCurrentLocation.GetName] narazím v malé osadě na jakési shromáždění rolníků.\n\nZa hrdého přihlížení svých pěstitelů a chovatelů"
 tour_grounds_events.3090.desc.vegetables: "plní povozy a tržištní stánky [farmer.Custom('RegionalRootVegetablePlural')] obřích rozměrů."
 tour_grounds_events.3090.desc.livestock: "se tu pase vypasený a zdravý dobytek, který vypadá tak dobře, že by se do něj člověk nejraději zakousl rovnou!"
 tour_grounds_events.3090.desc.outro: "Rolníci čas od času přivedou či přinesou své výpěstky a zvířata k posouzení jejich velikosti a zdraví. Zjevně tu pořádají jakousi slavnost a jakmile si mě všimnou, dychtivě mi chtějí ukázat plody své práce."
 tour_grounds_events.3090.a: "Měli bychom tyto země prozkoumat."
 tour_grounds_events.3090.b: "„Tohle je ztráta času! Zpátky na pole!“"
 tour_grounds_events.3090.c: "Jak úžasné. Soutěž posoudím já."
 tour_grounds_events.3100.title: "Klidný den"
 tour_grounds_events.3100.desc.intro: "Během turné po [ROOT.Char.GetCurrentLocation.GetName] se mi naskytne vzácná chvíle, kdy mě můj hostitel nikam nevodí ani se ode mě neočekává, že se někde ukážu.\n\nVidím, jak se na celý den plní svatostánky,"
 tour_grounds_events.3100.desc.booze: "krčmy vítají první štamgasty,"
 tour_grounds_events.3100.desc.hash: "pochybné postavy míří do tajných hašišových zahrad,"
 tour_grounds_events.3100.desc.outro: "a žebráci polehávají v ulicích a prosí alespoň o sousto k jídlu."
 tour_grounds_events.3100.a: "V této osadě je třeba provést sčítání."
 tour_grounds_events.3100.b: "Dnešek bych měl strávit v blízkosti [ROOT.Char.GetFaith.HighGodName|U]."
 tour_grounds_events.3100.c: "Měl bych se podívat, jak uctívají bohy [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePlural]."
 tour_grounds_events.3100.d: "Výborná příležitost k dobročinnosti."
 tour_grounds_events.3100.e: "Chci si jen odpočinout."
 friend_helped_me: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'poskytla','poskytl')] [TARGET_CHARACTER.GetShortUIName] tolik potřebnou pomoc"
 friend_helped_me_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'poskytla','poskytl')] [CHARACTER.GetShortUIName] tolik potřebnou pomoc"
