 cultural_festival.9000.title: "Vstup do zákulisí"
 cultural_festival.9000.desc: "Všude kolem mě probíhají obvyklé divy a radovánky kulturní slavnosti a připadám si, jako bych se [Select_CString(ROOT.Char.IsFemale,'ocitla','ocitl')] v jiném světě.\n\nZpět na zem mě však přivede pohled na několik pochybných individuí, která se potloukají na okraji davu a nenápadně mizí za vrzajícím dřevěným pódiem.\n\nPřemůže mě zvědavost, protože nedokážu rozeznat, co tam ti ničemové vlastně provádějí. Pak spatřím [stop_host_scope.GetFirstName], jak vychází ze zákulisí v doprovodu bandy pochybných existencí."
 cultural_festival.9000.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych to prozkoumat."
 cultural_festival.9000.host_noticed: "[stop_host_scope.GetFirstName] tě [Select_CString(stop_host_scope.IsFemale,'přistihla','přistihl')] při slídění"
 cultural_festival.9000.b: "Ne, do toho bych se opravdu [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] plést."
 cultural_festival.9001.title: "Truhla pod pódiem"
 cultural_festival.9001.desc: "Za pódiem nenajdu nic než malou truhlu. Materiál působí bytelně, ale zpracování je podivně prosté a odfláknuté, rozhodně ne jako výstavní kus, jaký by člověk čekal na slavnosti takového rozsahu.\n\nTruhlu uzavírá cosi jako hlavolamový zámek pokrytý neumělými rytinami groteskních tvorů a všemožných zvířat.\n\nZvědavost mi nedá pokoj. Prostě #EMP musím#! zjistit, co je uvnitř!"
 cultural_festival.9001.a: "Ten zámek vyřeším levou zadní!"
 cultural_festival.9001.fail_to_get_it_open: "Zámek se ti nepodaří vyřešit"
 cultural_festival.9001.b: "Prostě ho rozbiju!"
 cultural_festival.9001.destroyed_what_was_inside: "Zničíš to, co bylo uvnitř"
 cultural_festival.9001.c: "Tohle nestojí za všechnu tu námahu."
 cultural_festival.9002.title: "Tajný deník"
 cultural_festival.9002.desc: "V truhle z tvrdého dřeva se skrývá jen starý zaprášený deník, mezi jehož stránky jsou ledabyle nacpané další listy papíru.\n\nOtevřu ho a spatřím jen nesmyslné bláboly, cizí symboly a matematické rovnice, které zdánlivě vůbec nesouvisejí se zbytkem knihy.\n\nTohle musí být klíč k vyřešení nějakého hlavolamu. Ale jakého?"
 artifact_secret_puzzle_description: "Kniha obsahující klíč k vyřešení neznámého hlavolamu."
 cultural_festival.9002.a: "Vezmu si ho."
 cultural_festival.9002.b: "$host_dinner_events.3132.b$"
 artifact_secret_puzzle_with_cipher_description: "Dva deníky. Jeden zřejmě obsahuje šifru a druhý klíč k vyřešení hlavolamu. Ani společně však žádné tajemství neodhalují. Musí existovat ještě třetí, který vše objasní."
 cultural_festival.9002.c: "$host_dinner_events.3132.c$"
 cultural_festival.9002.d: "Ne, měl bych to nechat tady."
 cultural_festival.9003.title: "Čepel"
 cultural_festival.9003.desc: "Uvnitř truhly leží bohatě zdobená dýka. Na rozdíl od hrubého zpracování zámku je propracovaná do takových detailů, že čím déle si ji prohlížím, tím více dalších drobností objevuji.\n\nVskutku nádherný předmět."
 artifact_ornate_dagger_name: "Zdobená dýka"
 artifact_ornate_dagger_desc: "Složitě zdobená dýka pokrytá vyobrazeními groteskních tvorů a všemožných zvířat."
 cultural_festival.9003.a: "A teď je moje!"
 cultural_festival.9003.b: "Nemohu ji jen tak ukrást!"
 cultural_festival.9004.title: "Desátek"
 cultural_festival.9004.desc: "Truhla je až po okraj naplněná zlatem! Nepochybně tajný poklad, který přede mnou [stop_host_scope.GetFirstName] ukrývá."
 cultural_festival.9004.a: "$cultural_festival.9003.a$"
 cultural_festival.9004.b: "$cultural_festival.9003.b$"
 cultural_festival.9005.title: "Zdobený náhrdelník"
 cultural_festival.9005.desc: "Uvnitř truhly leží bohatě zdobený náhrdelník. Na rozdíl od hrubého zpracování zámku je propracovaný do takových detailů, že čím déle si ho prohlížím, tím více dalších drobností objevuji.\n\nVskutku nádherný předmět."
 artifact_strange_necklace_name: "Podivný náhrdelník"
 artifact_strange_necklace_desc: "Složitě zdobený náhrdelník. Na konci řetízku visí postava groteskního tvora, který mezi podivnými výrůstky svírá drahokam."
 cultural_festival.9005.a: "$cultural_festival.9003.a$"
 cultural_festival.9005.b: "$cultural_festival.9003.b$"
 cultural_festival.9006.title: "Nestoudný předmět"
 cultural_festival.9006.desc: "Otevřu truhlu a to, co uvnitř spatřím, mě přiměje zrudnout.\n\nTenhle falický předmět z kvalitního dřeva se nepodobá ničemu, co jsem kdy viděl. Dokonce ani nepřipomíná lidský #EMP úd#!, spíš něco, co by snad mohlo patřit nějakému bájnému tvorovi.\n\nVskutku zvrhlý předmět."
 grotesque_wooden_phallus: "Bájný dřevěný falus"
 grotesque_wooden_phallus.desc: "Bohatě vyřezávaný předmět vytvořený tak, aby připomínal falus neznámého bájného tvora."
 cultural_festival.9006.a: "To je ale nevídaná věc!"
 cultural_festival.9006.b: "Spalte to."
 decision_solve_the_journals: "Odemknout deník"
 decision_solve_the_journals_desc: "Konečně mám všechny části hlavolamu pohromadě a nastal čas zjistit, co se na těchto stránkách skutečně píše!"
 decision_solve_the_journals_tooltip: "Pokusíš se rozluštit deníky"
 decision_solve_the_journals_confirm: "Jdeme na to."
 journal_events_prefix: "Porozumění deníku:"
 tour_general.5000.title: "$journal_events_prefix$ Neúspěch"
 tour_general.5000.desc: "Shromáždím deníky, důkladně pročtu knihu hlavolamů a její pokyny pak s přesností odpovídající mým myšlenkám použiji na zámek.\n\nKonečně mám pocit, že jsem na to přišel, a #EMP klap!#! Deník zůstává stejně pevně zamčený a neústupný jako předtím."
 tour_general.5000.a: "Sakra!"
 tour_general.5000.b: "Zkusím to znovu!"
 tour_general.5001.title: "$journal_events_prefix$ Další neúspěch"
 tour_general.5001.desc: "Tentokrát mám opravdu pocit, že jsem tomu [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] na kloub. Všechno do sebe zapadá, nemohu se přece mýlit.\n\nOtočit doleva a... #EMP klap!#! Deník zůstává stejně pevně zamčený a neústupný jako předtím."
 tour_general.5001.a: "Ať je to všechno prokleté!"
 tour_general.5001.b: "Ten zatracený zámek prostě rozbiju!"
 the_journal_is_destroyed_tt: "Rozbiješ víc než jen zámek"
 fail_to_open_journal_tt: "Deník se ti nepodaří otevřít"
 more_mysteries_inside_tt: "Odhalíš obsah deníku"
 tour_general.5010.title: "$journal_events_prefix$ Luštění"
 tour_general.5010.desc.intro: "Konečně přede mnou stránky deníku odhalily svá tajemství a mohu začít luštit! Úvodní šifra praví „Kamkoli jdu, pravda zůstává dva kroky pozadu“ a díky tomu dokážu rozluštit první hádanku.\n\n"
 tour_general.5010.desc.puzzle.a: "„Uvtcpigvjkpiueqwnfdg.“"
 tour_general.5010.desc.puzzle.b: "„Vjgurktkvuycvejwucnn.“"
 tour_general.5010.desc.puzzle.c: "„Qwtjkuvqtakuqpnacnkg.“"
 tour_general.5010.desc.puzzle.d: "„Hcnnudavjgktqypjcpfu.“"
 tour_general.5010.desc.outro: "\n\nJe to jen změť nesmyslů, ale skutečný význam se v tom určitě skrývá."
 tour_general.5010.a: "Podivné věci mohou existovat."
 tour_general.5010.b: "Duchové nás všechny sledují."
 tour_general.5010.c: "Naše dějiny jsou pouhá lež."
 tour_general.5010.d: "Padnou vlastní rukou."
 tour_general.5011.title: "$journal_events_prefix$ Groteskní tvorové"
 tour_general.5011.desc: "To je ono! Díky šifře konečně rozumím celé knize a ukazuje se, že jde o podivné pojednání o povaze nejrůznějších groteskních tvorů, jako jsou [ROOT.Char.Custom('GetGrotesquePlural')].\n\nPodrobně popisuje jejich povahu i místa, kde je lze nalézt. Pokud se někdy vydám do dalekých krajů, mohl by to být neocenitelný zdroj vědomostí."
 tour_general.5011.a: "Jak groteskní!"
 tour_general.5012.title: "$journal_events_prefix$ Pokročilá teologie"
 tour_general.5012.desc: "To je ono! Díky šifře konečně rozumím celé knize a ukazuje se, že jde o složité teologické dílo! Popisuje [ROOT.Char.GetFaith.PantheonTerm] a předkládá fascinující myšlenky o vztahu, který mezi sebou mají [ROOT.Char.GetFaith.PositiveAfterLife] a [ROOT.Char.GetFaith.NegativeAfterLife].\n\nMožná je to vůbec nejpokročilejší teologické dílo v celém [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] světě... a teď patří mně!"
 tour_general.5012.a: "Fascinující!"
 tour_general.5013.title: "$journal_events_prefix$ Tajné dějiny"
 tour_general.5013.desc: "To je ono! Díky šifře konečně rozumím celé knize a ukazuje se, že popisuje dějiny [ROOT.Char.GetPrimaryTitle.GetName] způsobem, o jakém jsem nikdy dřív neslyšel!\n\nPokud je to pravda, tento deník může převrátit naše chápání dějin i pohled na mnohé osobnosti, které pomohly vybudovat tento velký [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] tak, jak ho známe dnes!"
 tour_general.5013.a: "Neuvěřitelné!"
 tour_general.5014.title: "$journal_events_prefix$ Boj"
 tour_general.5014.desc: "To je ono! Díky šifře konečně rozumím celé knize a ukazuje se, že obsahuje tajné techniky pro nejrůznější bojové situace. Ať už jde o boj čepelí, holýma rukama, nebo dokonce ze sedla, deník přesně popisuje, jak čelit každému pohybu protivníka.\n\nPokud tento deník důkladně prostuduji a budu se řídit jeho pokyny, mohu se stát [Select_CString(ROOT.Char.IsFemale,'největší duelantkou','největším duelantem')] v dějinách [ROOT.Char.GetPrimaryTitle.GetName]!"
 tour_general.5014.a: "Neuvěřitelné!"
 tour_grounds_events.3030.title: "Tajemná mapa"
 tour_grounds_events.3030.desc: "Většinu dne trávím průzkumem centra [touring_grounds_scope.GetNameNoTooltip] a užívám si, jak mě místní obyvatelé obskakují.\n\nKousek ode mě zahlédnu postavu v kápi, která se proplétá davem v marné snaze splynout s okolím. Z kapsy jí vypadne list papíru a vítr ho líně zavane přímo ke mně, jako by mi byl předurčen.\n\nVypadá to jako nějaká mapa... mapa okolí [touring_grounds_scope.GetNameNoTooltip]!"
 tour_grounds_events.3030.a: "Podívám se, kam vede."
 tour_grounds_events.3030.got_lost: "Ztratíš se"
 tour_grounds_events.3030.b: "Pche, ztráta času."
 tour_grounds_events.3031.title: "Zakopaný poklad"
 tour_grounds_events.3031.desc: "Mapa mě nakonec zavede na bezvýznamnou mýtinu uprostřed [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip].\n\nKdyž se však rozhlédnu, všimnu si řady pahorků v zemi, jako by pod nimi bylo něco zakopáno. Jsou rozmístěny v poměrně pravidelných rozestupech, takže jejich uspořádání možná má nějaký smysl..."
 tour_grounds_events.3031.a: "Dokážu zjistit, který je ten pravý."
 tour_grounds_events.3031.fail_to_get_it_open: "Nepodaří se ti najít správné místo"
 tour_grounds_events.3031.b: "Překopu celou mýtinu!"
 tour_grounds_events.3031.c: "Tahle stopa mě zavedla už dost daleko."
 tour_grounds_events.3032.title: "Zakopaná kniha"
 tour_grounds_events.3032.desc: "Konečně to vypadá, že je to správný pahorek, a když ho rozkopu, objevím... podivnou knihu.\n\nDesky jsou otlučené a téměř se rozpadají, zatímco uvnitř se nacházejí jen zvláštní symboly a hádanky naznačující jakousi skrytou pravdu.\n\nPo chvíli mi dojde, že jde o knihu šifer. Co přesně však mají rozluštit, zůstává nejasné."
 artifact_secret_cipher_description: "Podivná kniha plná hádanek a šifer."
 tour_grounds_events.3032.a: "Vezmu si ji!"
 tour_grounds_events.3032.b: "$host_dinner_events.3132.b$"
 tour_grounds_events.3032.c: "$host_dinner_events.3132.c$"
 tour_grounds_events.3032.d: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych ji nechat tam, kde jsem ji [Select_CString(ROOT.Char.IsFemale,'našla','našel')]."
 open_the_journal_tt: "Otevřeš deník"
 attempt_to_solve_the_cipher_tt: "Pokusíš se rozluštit šifru"
 you_have_journal_1_tt: "Vlastníš Tajný deník"
 you_have_journal_2_tt: "Vlastníš Klíč k hlavolamu"
 you_have_journal_3_tt: "Vlastníš Šifru"
 artifact_journal_of_grotesques: "Deník groteskních tvorů"
 artifact_journal_of_grotesques_desc: "Tento zašifrovaný deník je plný poznatků o studiu groteskních tvorů a místech, kde je lze nalézt."
 artifact_journal_of_theology: "Deník pokročilé teologie"
 artifact_journal_of_theology_desc: "Tento zašifrovaný deník obsahuje převratná odhalení o [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] teologii."
 artifact_journal_secret_history: "Tajné dějiny [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 artifact_journal_secret_history_desc: "Tento zašifrovaný deník obsahuje podrobné informace o dějinách [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] a tamních vládcích."
 artifact_journal_of_martial_arts: "Deník umění boje"
 artifact_journal_of_martial_arts_desc: "Tento zašifrovaný deník obsahuje návody pro všemožné způsoby boje, od soubojů se zbraní přes boj holýma rukama až po boj ze sedla."
 cultural_festival.9010.title: "Až příliš nadšeně"
 cultural_festival.9010.desc: "Dnes si užívám slavnosti v [ROOT.Char.GetCurrentLocation.GetName], ale ani zdaleka ne tolik jako [weeb_child.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n[weeb_child.GetFirstNameNoTooltip] tančí a víří mezi místními s takovou radostí a vervou, jakou jsem u [weeb_child.GetFirstNameNoTooltip] ještě nikdy neviděl. Zcela [Select_CString(weeb_child.IsFemale,'ponořená','ponořený')] do cizích tradic [festival_culture_scope.GetName] kultury působí [weeb_child.GetFirstNameNoTooltip] jako doma a zdá se, že i místní si [weeb_child.GetFirstNameNoTooltip] zamilovali!"
 cultural_festival.9010.a: "To je milé."
 cultural_festival.9010.b: "„Zůstaň s nimi, [weeb_child.GetFirstNameNoTooltip]!“"
 cultural_festival.9020.title: "Velké vyvrcholení"
 cultural_festival.9020.desc: "Slunce zapadá nad dalším dnem v [ROOT.Char.GetCurrentLocation.GetName] a místní se zřejmě chystají na závěrečné představení. Vztyčili mohutný dřevěný kůl a já se nemohu dočkat, co přijde dál!\n\nPak však ke kůlu za kopání a křiku přivlečou [Select_CString(human_sacrifice.IsFemale,'zesláblou ženu','zesláblého muže')] a pevně [Select_CString(human_sacrifice.IsFemale,'ji připoutají','ho připoutají')]. K břichu [human_sacrifice.GetFirstNameNoTooltip] přiloží nůž. [human_sacrifice.GetFirstNameNoTooltip] zavře oči a připraví se na konec."
 cultural_festival.9020.b: "„Ve jménu vašeho [ROOT.Char.GetTitleAsNameNoTooltip|U] s tím šílenstvím přestaňte!“"
 cultural_festival.9030.title: "Tradice [ROOT.Char.GetFaith.GetName]"
 cultural_festival.9030.desc: "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je dnešní slavností očividně naprosto [Select_CString(visiting_liege.IsFemale,'uchvácena','uchvácen')]. Tanečníci, účinkující i komedianti se ze všech sil snaží potěšit mou vrchnost a zdá se, že se jim to daří dokonale.\n\nV tak dobré náladě a obklopené našimi tradicemi by se [visiting_liege.GetFirstName] možná [Select_CString(visiting_liege.IsFemale,'mohla','mohl')] začít zajímat o jejich zachování. Bez náležité právní ochrany před konverzí tyto tradice jistě časem zaniknou."
 cultural_festival.9030.a: "„Byla by škoda, kdyby tyto tradice zanikly, nemyslíš?“"
 cultural_festival.9030.success: "[visiting_liege.GetFirstName] se ti [Select_CString(visiting_liege.IsFemale,'podařilo přesvědčit','podařilo přesvědčit')]"
 cultural_festival.9030.failure: "[visiting_liege.GetFirstName] se ti nepodařilo přesvědčit"
 cultural_festival.9030.b: "Raději budu mlčet."
 cultural_festival.9040.t: "Mince za věštbu"
 cultural_festival.9040.desc: "V odlehlém koutě slavnosti narazím na bohatě zdobený stan. Materiály i vzory jsou mi cizí, naprosto odlišné od všeho, co znám z domova. Ještě podivnější je jeho majitel, který se na mě nad sepjatýma rukama vědoucně usmívá.\n\n„Á, [ROOT.Char.GetTitleAsNameNoTooltip|U]! Ve tvé budoucnosti toho vidím mnoho. Dej mi minci a všechno ti povím.“"
 cultural_festival.9040.a: "„Minci dostaneš.“"
 cultural_festival.9040.good_reading: "Věštba je příznivá"
 cultural_festival.9040.bad_reading: "Věštba předpovídá zkázu"
 cultural_festival.9040.b: "„Obyčejní šarlatáni mě nezajímají.“"
 cultural_festival.9040.c: "„Nauč mě svému umění, moudrý člověče!“"
 cultural_festival.9050.t: "Erotický tanec"
 cultural_festival.9050.desc: "Usadím se k dalšímu půvabnému vystoupení. Do očekávavého ticha zazní údery bicích, dunící jako tlukot srdce.\n\nZpoza závěsu vystoupí [Select_CString(sexy_dancer.IsFemale,'nádherná žena','nádherný muž')] a začne pohybovat tělem způsobem zároveň nestoudným i vzrušujícím. [sexy_dancer.GetFirstNameNoTooltip] se ke mně přiblíží pohoršlivě těsně a pak mě opustí jen s mrknutím, aby se vrátil k obdivujícímu publiku."
 cultural_festival.9050.a: "[Select_CString(sexy_dancer.IsFemale,'Musí být má!','Musí být můj!')]"
 cultural_festival.9050.b: "Jak rozverné!"
 cultural_festival.9060.t: "Legendární představení"
 cultural_festival.9060.desc: "V dobré náladě se procházím slavností, až nakonec narazím na skupinu účinkujících. Zřejmě něco nacvičují a už jen podle toho, jak se pohybují, poznám, že mě čeká skvělá podívaná.\n\nNapadne mě, že by souboru mohl prospět nový námět. A právě [ROOT.Char.GetPromotedLegend.GetName] by byl pro tak talentovanou skupinu herců ideální látkou."
 cultural_festival.9060.a: "Měli by ztvárnit mou legendu!"
 cultural_festival.9060.a.success: "Představení se donese až k [stop_host_scope.GetFirstName]"
 cultural_festival.9060.a.failure: "Představení dopadne velmi dobře"
 cultural_festival.9060.b: "Raději si jen užiji jejich představení."
 lover_enchanting_dancing: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'okouzlila','okouzlil')] [CHARACTER.GetShortUIName] erotickým tancem"
 lover_enchanting_dancing_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'okouzlila','okouzlil')] [TARGET_CHARACTER.GetShortUIName] erotickým tancem"
