 rival_incompetence_corresponding: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'už měla dost','už měl dost')] neschopnosti [TARGET_CHARACTER.GetShortUIName]"
 rival_insulted_me: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'urazila','urazil')] [TARGET_CHARACTER.GetShortUIName]"
 rival_insulted_me_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'urazila','urazil')] [CHARACTER.GetShortUIName]"
 host_dinner_events.1001.title: "Večeře na suchu"
 host_dinner_events.1001.desc: "S [visiting_liege.GetName] se už celý večer náramně bavíme a noc se zatím nese ve znamení opileckého veselí a žertů. Zdá se však, že jsem byl se svými zásobami alkoholu až příliš štědrý, protože mě sluha nenápadně upozorní, že poslední kapka [ROOT.Char.Custom('RegionalAlcoholicDrink')] je pryč!\n\nMůj lenní pán netrpělivě sedí na opačném konci stolu, rudý jako novorozeně, a tluče pohárem o desku.\n\n„No tak! Noc je ještě mladá! Kde je pití?“"
 host_dinner_events.1001.a: "„Doplňte zásoby!“"
 host_dinner_events.1001.replenished_stores: "[stop_host_scope.GetName] [Select_CString(stop_host_scope.IsFemale,'doplnila','doplnil')] zásoby alkoholu"
 host_dinner_events.1001.b: "Už jsi toho vypil dost!"
 host_dinner_events.1001.didnt_replenish_stores: "[stop_host_scope.GetName] [Select_CString(stop_host_scope.IsFemale,'pokárala','pokáral')] tvé pití"
 host_dinner_events.1001.c: "Možná je čas změnit podnik."
 host_dinner_events.1001.d: "Doplním zásoby... výměnou za laskavost."
 host_dinner_events.1002.title: "Jedno či dvě piva"
 host_dinner_events.1002.desc: "Můj hostitel [stop_host_scope.GetName] mě vytáhl ze svého sídla do místní krčmy. Všude kolem vidím zbídačené a slabé, jak se oddávají pití a neřesti, ale [stop_host_scope.GetTitledFirstNameNoTooltip] mě ujišťuje, že [ROOT.Char.Custom('RegionalAlcoholicDrink')] podávaný v tomto podniku stojí za hřích.\n\nJakmile mi první doušek sklouzne do hrdla, cítím, jak ožívám. Nápoj udeří silou beranidla a je mi jasné, že dnešní noc bude patřit nekonečnému veselí."
 host_dinner_events.1002.a: "Tohle se ti opravdu povedlo, [stop_host_scope.GetFirstNameNoTooltip]!"
 host_dinner_events.1002.b: "Trocha střídmosti neuškodí."
 host_dinner_events.1002.c: "Budu pít, dokud nepadnu."
 drank_too_much_toast: "Opil ses do bezvědomí"
 host_dinner_events.1003.title: "Spící [visiting_liege.GetTitleAsNameNoTooltip|U]"
 host_dinner_events.1003.desc: "[visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] se konečně [Select_CString(visiting_liege.IsFemale,'odebrala','odebral')] na noc do svých komnat a pokojně odpočívá. Nepochybně sní o tom, jak zítra dorazí zbytky mých zásob jídla a pití.\n\nMožná je to vhodná příležitost svého lenního pána překvapit. Nějaká noční zábava nebo něco příjemného, co bude čekat po probuzení..."
 host_dinner_events.1003.a: "Připravíme strašení!"
 host_dinner_events.1003.b: "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U] je vždycky skvělý dárek!"
 host_dinner_events.1003.c: "Hašišové koláčky si [visiting_liege.GetNameNoTooltip] jistě oblíbí."
 host_dinner_events.1003.d: "Dotek konkubíny je příjemný způsob probuzení."
 host_dinner_events.1003.e: "Má společnost [visiting_liege.GetNameNoTooltip] jistě potěší."
 host_dinner_events.1004.title: "Příšerné probuzení"
 host_dinner_events.1004.desc.intro: "Pokojně ležím v nejkrásnější ložnici, kterou mi [stop_host_scope.GetTitledFirstNameNoTooltip] poskytl, a hlavou mi nevíří jediná starost. Náhle mě však z bezesného spánku vytrhne hlasitý a zlověstný chechot z konce chodby.\n\nNeochotně vstanu, roztřesenou rukou držím v přítmí svíčku a hledím do dlouhé chodby."
 host_dinner_events.1004.desc.ghost: "Přísahal bych, že to, co stojí na konci temné chodby, je nějaký zlý duch. Šeptá mé jméno a možná mě chce odvést do [ROOT.Char.GetFaith.NegativeAfterLife]! Ať už chce cokoli, musím se zachránit!"
 host_dinner_events.1004.desc.cynic: "Strach okamžitě zmizí, jakmile zjistím, že přede mnou stojí jen sluha s kusem jemného plátna přehozeným přes hlavu. Vydává zvuky a volá mé jméno, ale i dítě by poznalo, že to žádný duch není.\n\nTohle je bezpochyby pokus [stop_host_scope.GetNameNoTooltip] o humor."
 host_dinner_events.1004.a: "Volat o pomoc!"
 host_dinner_events.1004.b: "Zabarikáduji dveře!"
 host_dinner_events.1004.c: "To je ale legrace!"
 host_dinner_events.1004.enjoyed_spooky_ghost: "[visiting_liege.GetName] si žert [Select_CString(visiting_liege.IsFemale,'užila','užil')]"
 host_dinner_events.1004.d: "[stop_host_scope.GetFirstNameNoTooltip] mě kvůli tomuhle budí ze spaní?"
 host_dinner_events.1005.title: "Duch z [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 host_dinner_events.1005.desc: "Zdá se, že můj žert zabral až příliš dobře, protože slyším [visiting_liege.GetName], jak ječí jako malé [Select_CString(visiting_liege.IsFemale,'děvče','chlapec')] a volá mě na pomoc.\n\nPoslušně běžím ke komnatě a najdu [visiting_liege.GetNameNoTooltip] bledého jako stěna, jak ukazuje na „ducha“ na konci chodby.\n\n„Díky bohům, že jsi tady! Nějaký zlý duch se mě snaží odvést do [visiting_liege.GetFaith.NegativeAfterLife]!“"
 host_dinner_events.1005.a: "Jaký hlupák!"
 host_dinner_events.1004.mocked_me: "Staneš se terčem posměchu"
 host_dinner_events.1005.b: "Dokážu toho ducha zahnat... za laskavost."
 host_dinner_events.1004.hooked_me: "[stop_host_scope.GetName] ducha [Select_CString(stop_host_scope.IsFemale,'zahnala','zahnal')]."
 host_dinner_events.1005.c: "Zmiz, duchu!"
 host_dinner_events.1006.title: "Nečekané probuzení"
 host_dinner_events.1006.desc.intro: "Po další klidné noci u [stop_host_scope.GetName] se pomalu probouzím. Když se mi vrací vědomí, ucítím vedle sebe cosi těžkého, co tam předtím nebylo.\n\n"
 host_dinner_events.1006.desc.alcohol: "Vedle mě jako milenec odpočívá celý sud [stop_host_scope.Custom('RegionalAlcoholicDrink')], který při každém mém pohybu šplouchá a vrže pod tíhou svého obsahu."
 host_dinner_events.1006.desc.weed: "Vedle mě leží tolik hašišových koláčků, že bych jich mohl sníst množství odpovídající vlastní váze, kdybych po tom zatoužil!"
 host_dinner_events.1006.desc.hedonist: "Ucítím známý dotek [Select_CString(concubine_scope.IsFemale,'ženy','muže')], který mi zvědavě přejíždí prstem po hrudi."
 host_dinner_events.1006.desc.vanity: "Otočím se a u konce postele spatřím [stop_host_scope.GetFirstNameNoTooltip], kompletně oblečeného.\n\n„Dobré ráno, [ROOT.Char.GetTitleAsNameNoTooltip]. Napadlo mě, že vám dám dárek. A co může být lepším darem než má společnost a rozhovor?“"
 host_dinner_events.1006.desc.outro: "\n\nTakový dárek jsem rozhodně nečekal, ale je opravdu příjemné se do něčeho takového probudit?"
 host_dinner_events.1006.a: "To je nádherný způsob probuzení."
 host_dinner_events.1006.liked_gift: "[visiting_liege.GetTitledFirstName] si dárek [Select_CString(visiting_liege.IsFemale,'užila','užil')]."
 host_dinner_events.1006.b: "Zmiz mi z očí!"
 host_dinner_events.1006.refused_gift: "[visiting_liege.GetTitledFirstName] se [Select_CString(visiting_liege.IsFemale,'urazila','urazil')]."
 host_dinner_events.3001.title: "Zajímavá nabídka"
 host_dinner_events.3001.desc.intro: "Užívám si poklidnou večeři s [stop_host_scope.GetName] a [stop_host_scope.Custom2('RelationToMeShort', lusty_spouse_scope)] [lusty_spouse_scope.GetName].\n\nSotva se [stop_host_scope.GetNameNoTooltip] na chvíli omluví a odejde, [lusty_spouse_scope.GetNameNoTooltip] se na mě vrhne jako vzteklý pes!"
 host_dinner_events.3001.desc.not_into_it: "Snažím se toho [lusty_spouse_scope.Custom2('InsultAdjective', ROOT.Char)] zvrhlíka odstrčit, ale [lusty_spouse_scope.GetNameNoTooltip] se mě vytrvale snaží svést k nečistým myšlenkám."
 host_dinner_events.3001.desc.into_it: "Jeho výpady mě překvapí, ale nedokážu zabránit tomu, aby mé ruce začaly bloudit po těle [lusty_spouse_scope.GetNameNoTooltip]."
 host_dinner_events.3001.desc.mid: "Zůstanu jako [Select_CString(ROOT.Char.IsFemale,'opařená','opařený')]. Stačí, aby [stop_host_scope.GetFirstNameNoTooltip] na chvíli odešel z místnosti, a [lusty_spouse_scope.GetFirstNameNoTooltip] už uvažuje o nevěře s prvním člověkem po ruce."
 host_dinner_events.3001.desc.outro: "\n\n„Prosím, zachraň mě před touhle nudou! [stop_host_scope.GetFirstNameNoTooltip] pro mě není žádný milenec, něhy má v sobě asi jako kus dřeva. Vezmi si mě a miluj mě tak, jak to [stop_host_scope.GetFirstNameNoTooltip] nikdy nedokázal.“"
 host_dinner_events.3001.a: "S potěšením!"
 host_dinner_events.3001.b: "Musím to [stop_host_scope.GetTitledFirstNameNoTooltip] okamžitě říct!"
 host_dinner_events.3001.c: "Nic neřeknu, ale něco mi za to dlužíš."
 host_dinner_events.3001.d: "Slez ze mě, nestydatá děvko!"
 host_dinner_events.3002.title: "[lusty_spouse_scope.GetFirstNameNoTooltip]: Cizoložník"
 host_dinner_events.3002.desc: "Po krátké přestávce se vrátím k večeři a najdu [lusty_spouse_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] sedět vedle [visiting_liege.GetName] ve značně rozpačitém tichu.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip], obávám se, že pro vás mám velmi nepříjemnou zprávu. Zatímco jste byl pryč, tenhle nestydatý chlípník se mě pokusil svést k cizoložství!“"
 host_dinner_events.3002.a: "Tohle je důvod k rozvodu."
 host_dinner_events.3002.b: "Nechme si to mezi sebou."
 host_dinner_events.3002.c: "Budu předstírat, že jsem nic neslyšel."
 host_dinner_events.3002.d: "Tohle [lusty_spouse_scope.GetNameNoTooltip] nikdy neodpustím."
 host_dinner_events.1007.title: "Nezapomenutelné představení"
 host_dinner_events.1007.desc: "[visiting_liege.GetName] se v mé společnosti poslední dobou čím dál víc nudí a často vypadá, jako by každou chvíli měl usnout.\n\nKdyž sleduji, jak si bezmyšlenkovitě pohrává s jídlem, napadne mě jedna věc. [visiting_liege.GetNameNoTooltip] už toho v životě mnoho zažil. Co kdybychom některý z jeho slavných činů ztvárnili jako divadelní hru? Jistě by mu to polichotilo!\n\nZbývá jen otázka, jaké představení by [visiting_liege.GetNameNoTooltip] pobavilo nejvíc?"
 host_dinner_events.1007.a: "Samozřejmě válečné drama!"
 host_dinner_events.1007.b: "Komedii o smrti jeho nenáviděného nepřítele!"
 host_dinner_events.1007.c: "Tragédie [visiting_liege.GetNameNoTooltip] jistě dojme."
 host_dinner_events.1007.d: "Něco o radostech manželství!"
 host_dinner_events.1007.e: "Tohle je příšerný nápad."
 host_dinner_events.1008.title: "$host_dinner_events.1007.title$"
 host_dinner_events.1008.desc.intro: "Zdá se, že se [stop_host_scope.GetName] rozhodl dnes večer připravit představení pro mé pobavení. Sedím u hodovního stolu a netrpělivě čekám, co se bude dít, když"
 host_dinner_events.1008.desc.mid.war_memory: "[stop_host_scope.GetNameNoTooltip] přede mě předstoupí ve zbroji.\n\n„Pohleď! Jsem mocný [loser.GetName] a toho bídného [visiting_liege.GetNameNoTooltip] osobně pošlu za jeho stvořitelem!“\n\nNež stačím odpovědět, někdo mi vtiskne do ruky dřevěný meč. Bezpochyby jde o ztvárnění události, kdy [memory_performance_scope.GetDescription]."
 host_dinner_events.1008.desc.mid.dead_rival_memory: "[stop_host_scope.GetNameNoTooltip] se objeví v nelichotivém líčení a otrhaném oděvu.\n\n„Běda mi! Už se nedokážu déle držet tohoto smrtelného světa. Proklínám svůj osud, už nikdy neponížím [visiting_liege.GetNameNoTooltip]!“\n\nPředstavení je plné zvuků vyprazdňování a posměšného sténání bolestí a ztvárňuje událost, kdy [memory_performance_scope.GetDescription]."
 host_dinner_events.1008.desc.mid.dead_positive_relation_memory: "[stop_host_scope.GetNameNoTooltip] se objeví převlečený za mého milovaného [dead_relation.GetName].\n\n„Běda, odcházím do [dead_positive_relation_memory_scope.dead_relation.GetFaith.PositiveAfterLife|U]. Myslím už jen na [visiting_liege.GetNameNoTooltip] a na všechny krásné chvíle, které jsme spolu prožili.“\n\nJe to procítěná tragédie ztvárňující událost, kdy [memory_performance_scope.GetDescription]."
 host_dinner_events.1008.desc.mid.marriage_memory: "[stop_host_scope.GetNameNoTooltip] se objeví v oděvu téměř přesně stejném, jaký měl [spouse.GetName] v den naší svatby.\n\n„Tohle je skutečně nejkrásnější den mého života! Vezmu si úžasného [visiting_liege.GetNameNoTooltip]!“\n\nJsem vyzván, abych vystoupil na scénu a podal [stop_host_scope.GetName] ruku, ale"
 host_dinner_events.1008.desc.outro: "mám na tuhle hru opravdu přistoupit?"
 host_dinner_events.1008.a: "Jak nádherné!"
 host_dinner_events.1008.b: "Tohle je urážka!"
 host_dinner_events.3003.title: "Místní pochoutka"
 host_dinner_events.3003.desc: "Dnešní večeře se poněkud liší od toho, na co jsem zvyklý. Kuchař přede mě bez zájmu položí misku a okamžitě mě zasáhne ten nejpodivnější zápach, jaký jsem kdy v životě cítil.\n\nTenhle pokrm z hlubin [ROOT.Char.GetFaith.NegativeAfterLife] uráží všechny smysly. V bledém zpěněném vývaru se povaluje jakási slizká šedá hmota jako v zanedbaném nočníku a navrch někdo marně položil jedinou snítku bylinky, aby to snad vypadalo lákavěji.\n\nKaždý instinkt mi velí vyhodit tu věc nejbližším oknem, ale [stop_host_scope.GetNameNoTooltip] mě ujišťuje, že jde o místní pochoutku hodnou [ROOT.Char.GetTitleAsNameNoTooltip]."
 host_dinner_events.3003.a: "Tak do mě s tím!"
 host_dinner_events.3003.disgusting: "Jídlo bylo odporné"
 host_dinner_events.3003.delicious: "Pochoutka byla vynikající"
 host_dinner_events.3003.b: "Nedovolím, aby se ten hnus dotkl mého jazyka."
 host_dinner_events.3003.c.my_dog: "Možná bych to mohl nenápadně podstrčit svému psovi..."
 host_dinner_events.3003.c.lieges_dog: "Možná bych to mohl nenápadně podstrčit psovi [stop_host_scope.GetFirstNameNoTooltip]..."
 host_dinner_events.3003.unnoticed: "[stop_host_scope.GetNameNoTooltip] si ničeho [Select_CString(stop_host_scope.IsFemale,'nevšimla','nevšiml')]"
 host_dinner_events.3003.host_noticed: "[stop_host_scope.GetNameNoTooltip] si toho [Select_CString(stop_host_scope.IsFemale,'všimla','všiml')]"
 host_dinner_events.3004.title: "Předčasný slib"
 host_dinner_events.3004.desc.intro: "Dnes dorazím k večeři dřív a zjistím, že jsem tu [Select_CString(ROOT.Char.IsFemale,'sama','sám')] s dědicem [stop_host_scope.GetName], [stop_host_heir.GetName]."
 host_dinner_events.3004.desc.mid.child: "[stop_host_heir.GetNameNoTooltip] je ještě [Select_CString(stop_host_heir.IsFemale,'mladá a viditelně nesvá','mladý a viditelně nesvůj')] z toho, že sdílí místnost se svým [ROOT.Char.GetTitleAsNameNoTooltip]."
 host_dinner_events.3004.desc.mid.adult: "Důvěřivost [stop_host_heir.GetNameNoTooltip] je pověstná. Jako dítě má hlavu prázdnou a tvárnou, takže přimět [stop_host_heir.GetNameNoTooltip], aby přijala mou vizi, by bylo až směšně snadné."
 host_dinner_events.3004.desc.outro: "\n\nBylo by až příliš snadné toho ubožáka zmanipulovat, aby mi už teď složil právně závazný slib věrnosti. [stop_host_scope.GetNameNoTooltip] by to ale rozhodně [Select_CString(stop_host_scope.IsFemale,'rozzuřilo','rozzuřilo')]."
 host_dinner_events.3004.a: "Jdeme na to!"
 host_dinner_events.3004.a.caught: "Tvého nečestného pokusu si někdo všimne"
 host_dinner_events.3004.a.not_caught: "Slova byla vyřčena a nelze je vzít zpět"
 host_dinner_events.3004.b: "Jen si trochu popovídáme."
 host_dinner_events.3004.friendly_convo: "Vedli jste přátelský rozhovor"
 host_dinner_events.3004.awkward_convo: "Rozhovor byl rozpačitý"
 host_dinner_events.3005.title: "$host_dinner_events.3004.title$"
 host_dinner_events.3005.desc: "Vstoupím do hodovní síně a spatřím [visiting_liege.GetName], jak s [stop_host_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] rozmlouvá o záležitostech vlády a povinností.\n\n[visiting_liege.GetNameNoTooltip] se očividně snaží [stop_host_heir.GetNameNoTooltip] v mé nepřítomnosti zmanipulovat ke složení slibu věrnosti koruně! Takový slib by [stop_host_heir.GetNameNoTooltip] pronásledoval po celý život a navždy by upevnil naši budoucnost v podřízenosti [visiting_liege.GetNameNoTooltip]!"
 host_dinner_events.3005.a: "Dovolím to, ale chci za to laskavost."
 host_dinner_events.3005.hook_for_hook: "[stop_host_scope.GetName] požaduje odškodnění"
 host_dinner_events.3005.b: "„Okamžitě s tím šílenstvím přestaňte!“"
 host_dinner_events.3005.disallowed_hook: "Byl jsi přistižen"
 host_dinner_events.3006.title: "Sny o lepším životě"
 host_dinner_events.3006.desc.intro: "Dnes večer sedím vedle [runaway_courtier.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)] a sleduji, jak toužebně vzdychá nad talířem.\n\n"
 host_dinner_events.3006.desc.mid.concubine: "„Ach, omlouvám se za svou sklíčenost, [ROOT.Char.GetTitleAsNameNoTooltip|U]. [stop_host_scope.GetNameNoTooltip] mě nejspíš posadil vedle vás, abyste se měl na co dívat. Takový už [Select_CString(stop_host_scope.IsFemale,'je','je')], vidí ve mně jen předmět, kterým se může kochat a hrát si s ním. Popravdě už dlouho sním o tom, že se s vámi vrátím do [ROOT.Char.GetCapitalLocation.GetName].“"
 host_dinner_events.3006.desc.mid.neutral: "„Popravdě už mám života v [stop_host_scope.GetCapitalLocation.GetName] dost a toužím se dostat výš. Můj talent tu přichází nazmar a poslední dobou stále častěji přemýšlím, že bych se s vámi vytratil do [ROOT.Char.GetCapitalLocation.GetName], kde bych konečně mohl ukázat, co ve mně je!“"
 host_dinner_events.3006.desc.outro: "\n\nStížnosti [runaway_courtier.GetNameNoTooltip] znějí upřímně, ale opravdu mohu přetáhnout někoho ze dvora [stop_host_scope.GetNameNoTooltip]?"
 host_dinner_events.3006.a: "Samozřejmě, pojď se mnou!"
 host_dinner_events.3006.b: "„Budu si cenit víc než jen tvé krásy.“"
 host_dinner_events.3006.c: "Alespoň ti mohu nabídnout rameno k vyplakání."
 host_dinner_events.3006.d: "„Znej své místo, ty [runaway_courtier.Custom2('InsultNoun', ROOT.Char)]!“"
 host_dinner_events.3007.title: "Ukradený dvořan"
 host_dinner_events.3007.desc.intro: "Napadlo mě posadit [visiting_liege.GetName] vedle [runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] a zdá se, že si spolu rozuměli. Až příliš dobře."
 host_dinner_events.3007.desc.mid.concubine: "\n\n[runaway_courtier.GetNameNoTooltip] při pohledu na mě [Select_CString(runaway_courtier.IsFemale,'ucukne a odvrátí oči','ucukne a odvrátí oči')]."
 host_dinner_events.3007.desc.mid.neutral: "\n\n[runaway_courtier.GetNameNoTooltip] při pohledu na mě protočí oči a vzápětí odvrátí zrak."
 host_dinner_events.3007.desc.outro: "[runaway_courtier.GetNameNoTooltip] je očividně [Select_CString(runaway_courtier.IsFemale,'rozhodnutá','rozhodnutý')] opustit můj dvůr a odejít za [visiting_liege.GetName]! Mohu tomu zabránit, ale náladě u večeře by to rozhodně neprospělo."
 host_dinner_events.3007.a: "Zakazuji to!"
 host_dinner_events.3007.refused_to_let_them_go: "[stop_host_scope.GetName] [Select_CString(stop_host_scope.IsFemale,'odmítla','odmítl')] dovolit [runaway_courtier.GetNameNoTooltip] odejít"
 host_dinner_events.3007.b: "Nech [runaway_courtier.GetNameNoTooltip] odejít."
 host_dinner_events.3008.title: "Trocha špehování"
 host_dinner_events.3008.desc: "Je ráno a já se neochotně probouzím do nového dne, když mě náhle oslní ranní slunce. Po pokoji se rozpačitě motá sluha a nejistýma rukama mi pokládá snídani k posteli. Zeptám se, co se děje, a sotva ho trochu pobídnu, vyhrkne ze sebe záplavu slov.\n\n„Ó, můj moudrý a laskavý [ROOT.Char.GetTitleAsNameNoTooltip], tyhle zdi mluví. A říkají strašné věci. Vím toho tolik, někdy až příliš. [stop_host_scope.GetName] by mi nikdy neodpustil, kdybych vám něco řekl, ale už ta tajemství nedokážu dál držet v hlavě!“"
 host_dinner_events.3008.a: "„Musíš mi to okamžitě říct!“"
 host_dinner_events.3008.secret_discovered: "[nervous_servant.GetNameNoTooltip] [Select_CString(nervous_servant.IsFemale,'prozradila','prozradil')] tajemství"
 host_dinner_events.3008.b: "„Pomohlo by pár mincí rozvázat jazyk?“"
 host_dinner_events.3008.acting_sussy: "[stop_host_scope.GetName] tě podezírá"
 host_dinner_events.3008.c: "„Raději drž jazyk za zuby.“"
 host_dinner_events.1009.title: "Vaše Výsosti"
 host_dinner_events.1009.desc: "Když dojíme hlavní chod, očekávám od [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] pochvalu a uznání, ale místo toho v jeho očích spatřím jen očekávání. To, co jsem připravil, mému váženému hostu očividně nestačí, jenže kuchaři už udělali všechno, co jsem po nich chtěl, a ani nevím, zda máme ještě co podávat.\n\nPak mi dojde, že ve spíži stále mám pořádnou zásobu hašišových koláčků, které jen čekají, až je někdo sní! Otázkou zůstává, zda jsem ochoten se o tuhle pochoutku podělit se svým [visiting_liege.GetTitleAsNameNoTooltip|U]."
 host_dinner_events.1009.a: "Přineste koláčky!"
 host_dinner_events.1009.b: "Jistě postačí [ROOT.Char.Custom('GetExpensiveDessert')]."
 host_dinner_events.1010.title: "Má Výsost"
 host_dinner_events.1010.desc: "Když dojím poslední chod, nemohu se zbavit pocitu, že mi v žaludku zůstalo prázdné místo, kam by se krásně vešel nějaký dezert. [stop_host_scope.GetName] mi snad čte myšlenky, protože ještě než si stihnu postěžovat, zavolá sluhu a poručí přinést své „speciální koláčky“.\n\n„Pro [visiting_liege.GetTitleAsNameNoTooltip|U] jen ty nejlepší hašišové koláčky!“ pronese, zatímco mi na talíři přistane hotová hora té dobroty."
 host_dinner_events.1010.a: "Sním je všechny!"
 host_dinner_events.1010.b: "To bych nikdy [Select_CString(ROOT.Char.IsFemale,'neudělala','neudělal')]!"
 host_dinner_events.1011.title: "Rozdílné stravovací návyky"
 host_dinner_events.1011.desc.intro: "Když se [visiting_liege.GetName] usadí k dalšímu večeru plnému skvělé [ROOT.Char.GetPrimaryTitle.GetAdjective] kuchyně, začínám si uvědomovat, že naše jídlo už musí být poněkud jednotvárné.\n\n"
 host_dinner_events.1011.desc.vegetarian: "Podáváme pouze rostliny, které nám poskytuje [ROOT.Char.GetFaith.CreatorName], a nikdy maso ptáků ani jiné zvěře. V [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] to však chodí trochu jinak. Mám kvůli pohostinnosti slevit ze svého přesvědčení? Mám zařadit na jídelníček maso?"
 host_dinner_events.1011.desc: "Maso jíme zcela běžně, ale v [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] je něco takového naprosto zakázané. [visiting_liege.GetName] zatím jí, co se podává, ale všechno maso odkládá stranou, takže dostává jen neúplné jídlo! Mohu to opravdu nechat pokračovat? Možná bychom všichni měli po dobu návštěvy [visiting_liege.GetNameNoTooltip] jíst bezmasou stravu."
 host_dinner_events.1011.a: "Tím si získám přízeň [visiting_liege.GetNameNoTooltip]."
 host_dinner_events.1011.b: "Na takovou laskavost [visiting_liege.GetNameNoTooltip] jen tak nezapomene..."
 host_dinner_events.1011.c: "Dokud je [visiting_liege.GetNameNoTooltip] tady, bude jíst po našem!"
 host_dinner_events.1020.title: "Dort, na který se nezapomíná"
 host_dinner_events.1020.desc: "Další večer, další dezert, a je na [visiting_liege.GetName] znát, že naše [ROOT.Char.Custom('GetExpensiveDessert')] už začínají být poněkud jednotvárné. Možná je dnes načase zkusit něco jiného.\n\nŘešením by mohlo být požádat kuchaře a pekaře, aby připravili dezert ve tvaru něčeho, co pro [visiting_liege.GetNameNoTooltip] hodně znamená. Třeba pevnost jako připomínku válečného umění, nebo něco, co by [visiting_liege.GetNameNoTooltip] vůbec [Select_CString(visiting_liege.IsFemale,'nečekala','nečekal')]."
 host_dinner_events.1020.a: "Samozřejmě pevnost!"
 host_dinner_events.1020.b: "[visiting_liege.GetFaith.ReligiousSymbol|U] by byl skvělým tvarem!"
 host_dinner_events.1020.c: "Možná jistá část lidského těla..."
 host_dinner_events.1020.d: "Tohle je příšerný nápad."
 host_dinner_events.1021.title: "$host_dinner_events.1020.title$"
 host_dinner_events.1021.desc.intro: "Sedím u stolu a čekám na dezert. Když konečně dorazí, jen stěží dokážu skrýt nadšení!\n\n"
 host_dinner_events.1021.desc.mid.castle: "Přede mě postaví nádherný dort ve tvaru [ROOT.Char.GetCulture.GetName] pevnosti. Vypadá tak věrohodně, že si snadno představím malé medové nájezdníky, jak se snaží prolomit hradby mého dezertu."
 host_dinner_events.1021.desc.mid.religious: "Na zdobeném podnose přede mě položí zbožné cukrářské dílo ve tvaru [ROOT.Char.GetFaith.ReligiousSymbol]. Je vyzdobené s takovou pečlivostí, jako by je jen pro mě vytvořil samotný [ROOT.Char.GetFaith.CreatorName]!"
 host_dinner_events.1021.desc.mid.lewd: "Už se nedokážu ovládnout a propuknu v nezadržitelný smích, když přede mě položí sloup z dortu v barvě lidské kůže. Ta obludně veliká věc má tolik oplzlých detailů, že by se snad začervenal i [ROOT.Char.GetFaith.DevilName]!"
 host_dinner_events.1021.desc.mid.lewd_woman: "Už se nedokážu ovládnout a propuknu v nezadržitelný smích, když přede mě položí dvě chvějící se koule dezertu ozdobené ovocnými „bradavkami“. Ten výtvor má tolik oplzlých detailů, že by se snad začervenal i [ROOT.Char.GetFaith.DevilName]!"
 host_dinner_events.1021.desc.outro: "\n\nSamozřejmě se mi to líbí. Zbývá jen otázka, jak nejlépe projevit svou vděčnost?"
 host_dinner_events.1021.a: "Na tohle nezapomenu!"
 host_dinner_events.1021.b: "„Něco ti dlužím!“"
 host_dinner_events.1022.title: "$host_dinner_events.1020.title$"
 host_dinner_events.1022.desc.intro: "Sedím u stolu a čekám na dezert. Když konečně dorazí, jen stěží dokážu potlačit vztek!\n\n"
 host_dinner_events.1022.desc.mid.castle: "S odporem hledím na něco, co má být dortem ve tvaru [ROOT.Char.GetCulture.GetName] pevnosti, ale na mém talíři se pod vlastní vahou žalostně bortí. To má být nějaká urážka mých schopností?"
 host_dinner_events.1022.desc.mid.religious: "Šokovaně hledím na cosi, co vypadá jako dort ve tvaru [ROOT.Char.GetFaith.ReligiousSymbol]! Tahle kulinářská ukázka rouhání se mi hnusí natolik, že se jí sotva dokážu dotknout."
 host_dinner_events.1022.desc.mid.lewd: "Na talíři přede mnou leží odporná hromada v barvě lidské kůže, očividně vytvarovaná jako nějaká oplzlá část těla. To snad [stop_host_scope.GetName] očekává, že mě tahle vulgarita nadchne?"
 host_dinner_events.1022.desc.outro: "\n\nPři pohledu na tu věc se cítím jedině uraženě, ale z psích očí [stop_host_scope.GetFirstNameNoTooltip] poznám, že to byl upřímný pokus mi zalichotit."
 host_dinner_events.1022.a: "Ach, to se mi moc líbí!"
 host_dinner_events.1020.likes_it: "[visiting_liege.GetFirstName] to miluje"
 host_dinner_events.1022.b: "„Jak se opovažuješ!“"
 host_dinner_events.1020.hates_it: "[visiting_liege.GetFirstName] ten dort nenávidí"
 host_dinner_events.1030.title: "Nevítaný host"
 host_dinner_events.1030.desc: "Během návštěvy mého lenního pána byla připravena další večeře a tentokrát vypadá opravdu skvěle! [visiting_liege.GetName] slintá už při pouhém pohledu na ni, ale právě když se chystá k prvnímu soustu, do hodovní síně vtrhne [rival_scope.Custom2('NamePossessiveCharacterIntroduction', visiting_liege)] a sebevědomě zamíří rovnou k talíři svého nepřítele.\n\n„To je ale hostina! Taková škoda, že přijde nazmar na prohnilém jazyku takového ničemného [visiting_liege.GetTitleAsNameNoTooltip]!“\n\nNálada [visiting_liege.GetNameNoTooltip] okamžitě zhořkne a pokud nic neudělám, může se má večeře brzy změnit v pěstní souboj."
 host_dinner_events.1030.a: "„Stráže! Okamžitě toho hlupáka vyveďte!“"
 host_dinner_events.1030.b: "Možná bych ho mohl vyvést výměnou za páku."
 host_dinner_events.1030.c: "[rival_scope.GetFirstNameNoTooltip] je k popukání! Musíme si promluvit!"
 host_dinner_events.1031.title: "$host_dinner_events.1030.title$"
 host_dinner_events.1031.desc.intro: "Během mého pobytu pro mě připravili další večeři a tentokrát vypadá opravdu skvěle! Už při pohledu na ten šťavnatý, kouřící pokrm se mi sbíhají sliny, ale právě když se chystám k prvnímu soustu, do uší mě udeří protivně známý hlas.\n\n[rival_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(rival_scope.IsFemale,'přišla','přišel')] zkazit mou chuť k jídlu a pouhá přítomnost [rival_scope.GetNameNoTooltip] mi vaří krev v žilách."
 host_dinner_events.1031.desc: "\n\n[stop_host_scope.GetName] nabízí, že se toho otravného [rival_scope.Custom2('InsultNoun', ROOT.Char)] zbaví, ale tuším za tím postranní úmysly."
 host_dinner_events.1031.a: "Ano, ano, cokoli!"
 host_dinner_events.1031.b: "Už jsem vydržel horší věci."
 host_dinner_events.1030.liege_refuses: "[visiting_liege.GetFirstName] odmítá páku"
 host_dinner_events.1032.title: "$host_dinner_events.1030.title$"
 host_dinner_events.1032.desc: "\n\nA aby toho nebylo málo, [stop_host_scope.GetName] se mou bídou očividně náramně baví a dokonce [Select_CString(stop_host_scope.IsFemale,'se začala smát a žertovat','se začal smát a žertovat')] s přísežným nepřítelem koruny!"
 host_dinner_events.1032.a: "[stop_host_scope.GetFirstNameNoTooltip] si zahrává s ohněm."
 host_dinner_events.1032.b: "Musím nastavit druhou tvář."
 host_dinner_events.3010.title: "Neznámá chuť"
 host_dinner_events.3010.desc: "Je tu další večer mého pobytu u [stop_host_scope.GetName] a přede mnou přistane další cizokrajný pokrm. Trochu do něj šťouchnu nožem a sleduji, jak se tmavá neznámá omáčka převaluje jako proudící bahno.\n\nCo bych [Select_CString(ROOT.Char.IsFemale,'dala','dal')] za trochu jídla z hlavního města. Stačilo by i obyčejné [ROOT.Char.Custom('GetExpensiveDessert')]. Samozřejmě bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] [stop_host_scope.GetTitledFirstNameNoTooltip] požádat o něco z domova, ale [Select_CString(ROOT.Char.IsFemale,'riskovala bych','riskoval bych')] tím urážku."
 host_dinner_events.3010.a: "Prostě se zeptám."
 host_dinner_events.3010.b: "Místní jídlo bude jistě v pořádku."
 host_dinner_events.3011.title: "$host_dinner_events.3010.title$"
 host_dinner_events.3011.desc: "S touhle večeří jsem se opravdu [Select_CString(ROOT.Char.IsFemale,'překonala','překonal')]! Mí kuchaři připravili oslnivou přehlídku lákavých pokrmů, ale [visiting_liege.GetName] se jich očividně zdráhá byť jen dotknout.\n\n„Tohle jídlo mi není po chuti. Nemohli byste mi přinést nějaké [ROOT.Char.Custom('GetExpensiveDessert')]? Ach, jak mi chybí jejich sladký dotek na jazyku.“\n\nJe to trochu urážlivé, ale na takové gesto by se jen tak nezapomnělo..."
 host_dinner_events.3011.a: "Samozřejmě!"
 host_dinner_events.3011.gave_local_food: "[stop_host_scope.GetName] [Select_CString(stop_host_scope.IsFemale,'souhlasila','souhlasil')]"
 host_dinner_events.3011.b: "Tohle je urážka!"
 host_dinner_events.3011.refused_local_food: "[stop_host_scope.GetName] se [Select_CString(stop_host_scope.IsFemale,'urazila','urazil')]"
 host_dinner_events.3020.title: "Souboj"
 host_dinner_events.3020.desc: "Máme za sebou dlouhý a báječný večer plný veselí a radovánek a mezi mnou a mým dobrým hostitelem [stop_host_scope.GetName] už padl nejeden pohár [stop_host_scope.Custom('RegionalAlcoholicDrink')].\n\nZdá se však, že se mě [stop_host_scope.GetTitledFirstNameNoTooltip] snaží přepít a pokaždé si nalévá o něco plnější pohár než já. Je to snad nějaká nevyslovená výzva? Možná bych měl přihodit nějakou sázku."
 host_dinner_events.3020.a: "Podceňuješ mé schopnosti!"
 host_dinner_events.3020.b: "Ani to nezkoušej."
 host_dinner_events.3021.title: "$host_dinner_events.3020.title$"
 host_dinner_events.3021.desc: "Máme za sebou dlouhý a báječný večer plný veselí a radovánek a mezi mnou a mým lenním pánem [visiting_liege.GetName] už padl nejeden pohár [stop_host_scope.Custom('RegionalAlcoholicDrink')].\n\nZdá se však, že jsem toho vypil trochu příliš a [visiting_liege.GetTitledFirstNameNoTooltip] to zřejmě [Select_CString(visiting_liege.IsFemale,'pochopila','pochopil')] jako výzvu!\n\n„Takže si myslíš, že přepiješ [visiting_liege.GetTitleAsNameNoTooltip|U]? Tak to pojďme vyzkoušet a napij se se mnou! Vítěz dostane... však my už nějakou vhodnou cenu vymyslíme, ne?“"
 host_dinner_events.3021.a: "Jdeme na to!"
 host_dinner_events.3021.b: "Opravdu bych měl přestat."
 host_dinner_events.3020.refused_to_drink: "[stop_host_scope.GetName] výzvu [Select_CString(stop_host_scope.IsFemale,'odmítla','odmítl')]"
 host_dinner_events.3030.title: "Nadějný svěřenec"
 host_dinner_events.3030.desc: "Dnes večer mě posadili vedle [promising_child.Custom2('NamePossessiveCharacterIntroduction', stop_host_scope)] a to dítě je skutečným potěšením. Čím déle spolu hovoříme, tím jasněji vidím, jak velký potenciál v sobě [promising_child.GetNameNoTooltip] skrývá a jak snadno bych mohl jeho schopnosti vytvarovat k obrazu svému.\n\nMám chuť vzít [promising_child.GetNameNoTooltip] s sebou domů a ujmout se jeho výchovy, ale bez souhlasu [stop_host_scope.GetName] by něco takového nešlo. A za ten souhlas může [stop_host_scope.GetNameNoTooltip] něco požadovat na oplátku."
 host_dinner_events.3030.a: "Musím se zeptat."
 host_dinner_events.3030.b: "Na to nemám čas."
 host_dinner_events.3031.title: "[promising_child.GetFirstNameNoTooltip]: [Select_CString(promising_child.IsFemale,'Svěřenkyně','Svěřenec')] [visiting_liege.GetTitleAsNameNoTooltip]"
 host_dinner_events.3031.desc: "Zdá se, že si [visiting_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] [promising_child.Custom2('MyCharacterIntroduction', ROOT.Char)] opravdu [Select_CString(visiting_liege.IsFemale,'oblíbila','oblíbil')]. Celý večer spolu bez přestání rozmlouvají, jako by byli [visiting_liege.GetMotherFather] a [promising_child.Custom('GetDaughterSon')]!\n\n[visiting_liege.GetNameNoTooltip] ke mně přistoupí s širokým úsměvem. „To [promising_child.Custom('GirlBoy')] je hotový poklad! Nic si nepřeji víc než vzít [promising_child.GetNameNoTooltip] s sebou domů a vychovat v hlavním městě. Tak nadějné dítě přece nemůže strávit celý život v [ROOT.Char.GetCurrentLocation.GetName], nemám pravdu?“"
 host_dinner_events.3031.a: "Máte pravdu."
 host_dinner_events.3031.b: "Nemáte!"
 host_dinner_events.3030.refused_to_allow_ward: "[stop_host_scope.GetFirstName] [Select_CString(stop_host_scope.IsFemale,'zakázala','zakázal')] [promising_child.GetFirstName] odejít"
 host_dinner_events.3040.title: "Kdo snědl všechno pečivo?"
 host_dinner_events.3040.desc: "I dnes večer se stoly prohýbají pod jídlem, jak už jsem si zvykl. Jen malé pečivo, které jsem si tolik oblíbil, nikde nevidím. S tázavým výrazem se obrátím na [stop_host_scope.GetNameNoTooltip].\n\n„Vím, že jste čekal další pečivo, [visiting_liege.GetTitleAsNameNoTooltip|U], ale kuchař přísahá, že poslední kousek zmizel těsně před podáváním. Zkoušeli jsme zloděje chytit, ale ten nenasytný ničema je až příliš mazaný.“"
 host_dinner_events.3040.a: "Na mě dost mazaný není!"
 host_dinner_events.3040.didnt_solve_mystery: "Nepodařilo se ti pachatele najít"
 host_dinner_events.3040.b: "Smutné."
 host_dinner_events.3040.disappointed_in_vassal: "Nezlobím se, jen jsem zklamaný"
 host_dinner_events.3041.title.deviant: "[pie_eater_scope.GetCulture.GetNameNoTooltip] koláč"
 host_dinner_events.3041.title: "[pie_eater_scope.GetFirstNameNoTooltip] [Select_CString(pie_eater_scope.IsFemale,'snědla','snědl')] všechno pečivo!"
 host_dinner_events.3041.desc.deviant: "Sleduji stopu drobků a skvrn od mastnoty a omáčky chodbou, až konečně najdu viníka. Na to, co spatřím, mě ale nemohlo nic připravit.\n\n[pie_eater_scope.GetName] stojí přede mnou úplně [Select_CString(pie_eater_scope.IsFemale,'nahá','nahý')] a zády ke mně. Jakmile vstoupím, prudce se otočí a odhalí celý tác koláčů navršených ve výši rozkroku, přičemž jediný kousek pečiva stále střeží poslední zbytky cudnosti.\n\n„Ach! Já... totiž... ono to není tak, jak to vypadá, [visiting_liege.GetTitleAsNameNoTooltip|U]! Prosím, nikomu o tom neříkejte!“"
 host_dinner_events.3041.desc: "Sleduji stopu drobků a skvrn od omáčky a mastnoty chodbou, až konečně najdu viníka!\n\nVstoupím do ložnice a spatřím [pie_eater_scope.GetName], jak sedí o samotě s celou hromadou pečiva po boku.\n\n„Ach! [visiting_liege.GetTitleAsNameNoTooltip|U], samozřejmě jsem vám to pečivo právě [Select_CString(pie_eater_scope.IsFemale,'chtěla','chtěl')] přinést, ale víte... než na mě přijde řada, vždycky všechno zmizí, a tak jsem si [Select_CString(pie_eater_scope.IsFemale,'chtěla','chtěl')] nejdřív nenápadně vzít jeden nebo dva kousky. Prosím, nikomu o tom neříkejte!“"
 host_dinner_events.3041.a: "Nechám tě být... za laskavost."
 host_dinner_events.3041.b: "Tohle zůstane mezi námi."
 host_dinner_events.3041.c: "Nikomu ani slovo."
 host_dinner_events.3041.d: "Ha! Teď se všichni dozvědí, co jsi zač, ty [pie_eater_scope.Custom2('InsultAdjective', ROOT.Char)] [pie_eater_scope.Custom2('InsultNoun', ROOT.Char)]."
 host_dinner_events.3041.e: "Mohu to zkusit?"
 host_dinner_events.3041.f: "Podělíme se!"
 host_dinner_events.3050.title: "Bez chuti k jídlu"
 host_dinner_events.3050.desc: "Dnešní večeře je přímo k sežrání, ale zatímco kuchaři dál vrší jídlo na stoly, všimnu si, že [non_eater_scope.Custom2('MyCharacterIntroduction', ROOT.Char)] sotva zobne i z toho mála, co si naloží na talíř.\n\nJindy by na nechutenství nebylo nic špatného, ale [stop_host_scope.GetName] začíná být očividně [Select_CString(stop_host_scope.IsFemale,'uražená','uražený')], že se člen mého doprovodu v jídle jen nimrá."
 host_dinner_events.3050.a: "„[ROOT.Char.GetFaith.HighGodName|U] mi pomáhej, něco už sněz!“"
 host_dinner_events.3050.convinced_to_eat: "Přesvědčíš [non_eater_scope.GetNameNoTooltip], aby [Select_CString(non_eater_scope.IsFemale,'něco snědla','něco snědl')]"
 host_dinner_events.3050.annoyed_courtier: "[non_eater_scope.GetNameNoTooltip] jsi [Select_CString(ROOT.Char.IsFemale,'podráždila','podráždil')]"
 host_dinner_events.3050.b: "Nějak to za [non_eater_scope.GetNameNoTooltip] omluvím."
 host_dinner_events.3060.title: "Lahodná pochoutka"
 host_dinner_events.3060.desc: "Dnešní večeře byla skutečně báječná. [Select_CString(ROOT.Char.IsFemale,'Hodovala','Hodoval')] jsem na všemožných slaných i sladkých pokrmech, ale nic neprobudilo mou chuť k jídlu tolik jako tyhle skvělé [stop_host_scope.Custom('GetExpensiveDessert')]!\n\nAť jich sním kolik chci a jejich chuť si vychutnávám sebevíc, stále mi to nestačí. S každým soustem se do nich propadám hlouběji, chuť mi exploduje na jazyku a přivádí mě o krok blíž k [ROOT.Char.GetFaith.PositiveAfterLife].\n\nPřestože mám žaludek nacpaný k prasknutí a šaty mě začínají škrtit, nedokážu odolat a sahám po dalších."
 host_dinner_events.3060.a: "Jsou příliš dobré, než abych [Select_CString(ROOT.Char.IsFemale,'přestala','přestal')]!"
 host_dinner_events.3060.satisfying_dessert: "Jsi [Select_CString(ROOT.Char.IsFemale,'spokojená','spokojený')]"
 host_dinner_events.3060.too_much_dessert: "[Select_CString(ROOT.Char.IsFemale,'Přejedla','Přejedl')] ses"
 host_dinner_events.3060.b: "Ne, musím přestat."
 host_dinner_events.3061.title: "Zrádné srdce"
 host_dinner_events.3061.desc: "Dojím poslední sousto večeře a jsem opravdu [Select_CString(ROOT.Char.IsFemale,'sytá','sytý')]. Ulehnu ke spánku [Select_CString(ROOT.Char.IsFemale,'spokojená','spokojený')], byť trochu nepohodlně.\n\nKdyž tam však ležím, ucítím, jak sladkost proniká až k mému srdci a to #EMP buch!#! udeří o něco silněji. S každým úderem se jeho tep stupňuje, je silnější a rychlejší. Mám pocit, že mi srdce každou chvíli vyrazí z hrudi. Celé tělo mi zalije studený pot, v hrdle vyschne a dech se zrychlí a zkrátí jako zahnanému [ROOT.Char.Custom('GetAnimalType')]!\n\nPak se všechno stejně náhle zastaví."
 host_dinner_events.3061.a: "Musel to být jed!"
 host_dinner_events.3070.title: "Příběh pro [potential_friend_scope.GetFirstNameNoTooltip]"
 host_dinner_events.3070.desc: "Další večer plný veselí se chýlí ke konci a ze všech lidí jsem se právě s [potential_friend_scope.GetName] [Select_CString(ROOT.Char.IsFemale,'zabrala','zabral')] do rozhovoru.\n\nAni nevím jak a v místnosti se rozhostí ticho, které přerušuje jen náš rozhovor, zatímco všichni čekají na mé další slovo. Je to trochu rozpačité, ale určitě dokážu vyprávět příběh, který všechny přítomné potěší!"
 host_dinner_events.3070.a: "Něco tragického."
 host_dinner_events.3070.boring_story: "Tvůj příběh byl nudný"
 host_dinner_events.3070.b: "Něco odlehčeného!"
 everyone_at_the_dinner: "Každá postava u večeře"
 host_dinner_events.3070.story_was_impressive: "Tvůj příběh byl působivý"
 host_dinner_events.3080.title: "Dušení!"
 host_dinner_events.3080.desc: "Všichni se u večeře dobře baví a já právě vyprávím další ze svých legendárních vtipů, který sklidí salvu smíchu a potlesku... a kašle.\n\nRozhlédnu se a spatřím [choking_character_scope.GetName], jak se pevně drží za krk, prudce kašle a rudne v obličeji. Zdá se, že můj vtip byl na [choking_character_scope.GetNameNoTooltip] až příliš dobrý!\n\nSamozřejmě bych mohl přiskočit na pomoc, ale je to opravdu moje starost?"
 host_dinner_events.3080.a: "[choking_character_scope.GetNameNoTooltip] zachráním!"
 host_dinner_events.3080.failed_to_save_them: "Nepodařilo se ti zachránit [choking_character_scope.GetFirstName]"
 host_dinner_events.3080.b: "Tohle opravdu není můj problém."
 host_dinner_events.3081.title: "Zachráněný život"
 host_dinner_events.3081.desc: "Vyskočím a znovu a znovu silně udeřím [choking_character_scope.GetName] do zad. Právě když začíná modrat v obličeji, vyletí z úst odporný chuchvalec toho, co ještě před chvílí bývalo vybraným jídlem, a s plesknutím dopadne do drahé bylinkové omáčky.\n\n„Ach, děkuji vám! Dnes jste mi zachránil život, [visiting_liege.GetTitleAsNameNoTooltip|U]! Navždy budu vaším dlužníkem.“"
 host_dinner_events.3081.a: "„Nedlužíš mi nic kromě své společnosti.“"
 host_dinner_events.3081.b: "„Ale ano, dlužíš mi svůj život.“"
 host_dinner_events.1040.title: "Hry z nudy"
 host_dinner_events.1040.desc: "Od příjezdu [visiting_liege.GetName] se hostiny střídají jedna za druhou a každý večer po jídle [visiting_liege.GetNameNoTooltip] zmizí do svých komnat a nechá mě samotného s mými myšlenkami.\n\nPoslední dobou mě však čím dál víc láká vytáhnout starou šachovnici a uzavřít se svým [visiting_liege.GetTitleAsNameNoTooltip|U] sázku. O co přesně budeme hrát, ještě nevím, ale jistě něco vymyslíme."
 host_dinner_events.1040.a: "Zahrajeme si!"
 host_dinner_events.1040.b: "Raději ne."
 host_dinner_events.1041.title: "Výzva"
 host_dinner_events.1041.desc: "Když dojím, přede mnou přistane další deska, tentokrát však místo jídla pokrytá malými herními figurkami.\n\n„Můj lenní pane, jistě víte, že jsem proslulý jako jeden z nejlepších šachistů v [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip]! Nechci ale hrát jen pro zábavu. Co kdybychom si hru trochu okořenili sázkou...“\n\n[stop_host_scope.GetName] se na mě šklebí a nedočkavě si mezi prsty pohrává s figurkou."
 host_dinner_events.1041.a: "Jsem na tahu, [stop_host_scope.GetFirstNameNoTooltip]."
 host_dinner_events.1041.b: "Kvůli tomuhle si večer kazit nebudu."
 host_dinner_events.1042.title: "Laskavost"
 host_dinner_events.1042.desc: "Král padne a vítěz je rozhodnut.\n\nU [bg_loser.GetName] jsem si [Select_CString(ROOT.Char.IsFemale,'vysloužila','vysloužil')] laskavost a svou neurčenou výhru si mohu kdykoli vybrat."
 host_dinner_events.1042.desc.loser: "Král padne a vítěz je rozhodnut.\n\n[bg_victor.GetName] mě naprosto [Select_CString(ROOT.Char.IsFemale,'porazila','porazil')] a svou neurčenou výhru si teď může kdykoli vybrat."
 host_dinner_events.1042.a: "Výborně."
 host_dinner_events.1042.a.bad: "Sakra!"
 host_dinner_events.1050.title: "Prázdné zásoby"
 host_dinner_events.1050.desc: "Kuchaři mě upozornili, že zásoby jídla jsou už povážlivě nízké a většina dražších a exotických surovin dávno došla.\n\nDoplnění zásob by stálo menší jmění a už při pomyšlení, že mám nakoupit byť jen chléb a máslo, se mi nervózně sevře srdce. [visiting_liege.GetName] možná bude dnešní skromnou nabídkou [Select_CString(visiting_liege.IsFemale,'zklamaná','zklamaný')], ale mohu si dovolit něco lepšího?"
 host_dinner_events.1050.a: "Tak tedy chléb a voda."
 host_dinner_events.1050.b: "Na něco lepšího máme."
 host_dinner_events.1050.c: "Mám známosti, které mohu využít!"
 host_dinner_events.3090.title: "Lebka"
 host_dinner_events.3090.desc: "Dobře jsem se tu [Select_CString(ROOT.Char.IsFemale,'pobavila','pobavil')], ale nesmím se nechat odvést od svého poslání stát se obávaným a respektovaným [ROOT.Char.GetTitleAsNameNoTooltip|U]!\n\nŽaláře [stop_host_scope.GetName] jsou plné ničemů a zrádců, kteří jen vysávají pokladnu koruny svými nekonečnými nároky na jídlo a vodu. Možná bych mohl svému laskavému hostiteli zároveň prokázat službu i nahnat strach tím, že jednoho vězně popravím a z jeho vydlabané lebky budu pít [stop_host_scope.Custom('RegionalAlcoholicDrink')]."
 host_dinner_events.3090.a: "Výborný nápad."
 host_dinner_events.3090.skobletted_my_prisoner: "[visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'vydlabala','vydlabal')] lebku [skoblet_target.GetFirstNameNoTooltip] a udělal z ní pohár"
 host_dinner_events.3090.b: "To je odporné."
 host_dinner_events.3100.title: "Podezřelý přepych"
 host_dinner_events.3100.desc: "Pobyt tady si užívám, ale nemohu si nevšimnout, že každý den hoduji v naprostém přepychu. Možná je [stop_host_scope.GetName] podstatně bohatší, než jsem si původně myslel.\n\nPokud mám pravdu, znamená to, že mi [stop_host_scope.GetTitleAsNameNoTooltip|U] dluží mnohem víc zlata, než dosud odvádí, a mohl bych požadovat doplacení."
 host_dinner_events.3100.a: "Nedoplatky musí být uhrazeny."
 host_dinner_events.3100.b: "Odteď musí platit víc."
 host_dinner_events.3100.c: "Nechám to být."
 host_dinner_events.3101.title: "Zdanitelný přepych"
 host_dinner_events.3101.desc.intro: "Svému lennímu pánovi jsem byl skutečně vynikajícím hostitelem, dopřál jsem [visiting_liege.GetNameNoTooltip] všechno, po čem mohl toužit, a podával jen to nejlepší jídlo ze svých zásob.\n\nZdá se však, že to byla chyba, protože [visiting_liege.GetNameNoTooltip] si teď mé znamenité hostitelské schopnosti vykládá jako důsledek krácení daní!"
 host_dinner_events.3101.desc: "$host_dinner_events.3101.desc.intro$\n\n[visiting_liege.GetNameNoTooltip] po mně požaduje, abych okamžitě jednorázově zaplatil „všechno, co dlužím“."
 host_dinner_events.3101.a: "Dobrá."
 host_dinner_events.3101.b: "To je nehoráznost!"
 host_dinner_events.3102.title: "$host_dinner_events.3101.title$"
 host_dinner_events.3102.desc: "$host_dinner_events.3101.desc.intro$\n\n[visiting_liege.GetName] teď požaduje, aby se mi od nynějška zvýšily daně!"
 host_dinner_events.3102.a: "Přijmu to."
 host_dinner_events.3102.b: "Jdi do [ROOT.Char.GetFaith.NegativeAfterLife]!"
 host_dinner_events.3110.title: "Nadaný tulák"
 host_dinner_events.3110.desc.intro: "Zdá se, že nejsem jediným váženým hostem u dvora [stop_host_scope.GetName]! Dnes večer mě posadili vedle fascinujícího [talented_pool_character.GetName] a náš rozhovor mě přímo nadchl.\n\n"
 host_dinner_events.3110.desc.mid.claim: "„Běda, i já bych měl patřit mezi zeměpány, vznešený [visiting_liege.GetTitleAsNameNoTooltip|U]. Kdyby byl svět spravedlivý, můj oprávněný nárok by byl uznán a i já bych měl velkou hodovní síň, ve které bych vás mohl hostit.“"
 host_dinner_events.3110.desc.mid.martial: "„Mé válečnické schopnosti jsou legendární, [visiting_liege.GetTitleAsNameNoTooltip|U]. Pokud byste mě přijal, rád bych vám je dal do služeb!“"
 host_dinner_events.3110.desc.mid.learning: "„Nikdo nerozumí světu a [talented_pool_character.GetFaith.ReligiousText] tak jako já, velkomyslný [visiting_liege.GetTitleAsNameNoTooltip|U]. Pokud byste mě přijal, bylo by mi ctí nabídnout své schopnosti vašemu dvoru.“"
 host_dinner_events.3110.desc.mid.statecraft: "„Ve státnických záležitostech se dobře vyznám, ale při věčném putování z místa na místo přicházejí mé schopnosti nazmar. Pokud byste mě přijal ke svému dvoru, bylo by mi ctí nazývat vás svým [visiting_liege.GetTitleAsNameNoTooltip|U].“"
 host_dinner_events.3110.desc.outro: "\n\nJen málokdy člověk potká někoho tak zajímavého, kdo nemá vlastní domov. Najde se ale u mého dvora místo pro [talented_pool_character.GetNameNoTooltip]?"
 host_dinner_events.3110.a: "Samozřejmě, že ano!"
 host_dinner_events.3110.b: "Zmiz."
 host_dinner_if_vassal_accepts_tt: "Pokud tvůj vazal přijme"
 tour_grounds_if_vassal_rejects_tt: "Pokud tvůj vazal odmítne"
 host_dinner_events.3100.vassal_accepts: "[stop_host_scope.GetFirstName] souhlasí"
 host_dinner_events.3100.vassal_refuses: "[stop_host_scope.GetFirstName] odmítá"
 host_dinner_events.1009.enjoyed_weed: "[visiting_liege.GetFirstName] si hašiš [Select_CString(visiting_liege.IsFemale,'užila','užil')]"
 host_dinner_events.1009.didnt_enjoy_weed: "[visiting_liege.GetFirstName] si hašiš [Select_CString(visiting_liege.IsFemale,'neužila','neužil')]"
 host_dinner_events.3020.won_drinking_duel: "Vyhrál jsi soutěž v pití"
 host_dinner_events.3020.lost_drinking_duel: "Prohrál jsi soutěž v pití"
 host_dinner_events.1007.enjoyed_performance: "[visiting_liege.GetFirstName] si představení [Select_CString(visiting_liege.IsFemale,'užila','užil')]"
 host_dinner_events.1007.disliked_performance: "[visiting_liege.GetFirstName] se představení nelíbilo"
 host_dinner_events.1060.title: "Vydatná chuť"
 host_dinner_events.1060.desc.intro: "Bylo mi oznámeno, že nedávno zemřel jeden z nejlepších vojáků mé družiny, ale jeho tělo zůstalo dokonale zachovalé, neposkvrněné zraněním ani nemocí.\n\n"
 host_dinner_events.1060.desc.cannibal_legal: "Jako [ROOT.Char.GetTitleAsNameNoTooltip|U], za kterého [dead_soldier.GetNameNoTooltip] bojoval a zemřel, mám samozřejmě právo sníst jeho srdce a přijmout do sebe jeho válečnického ducha,"
 host_dinner_events.1060.desc.secret_cannibal: "Ačkoli mé kanibalské sklony zůstávají před světem utajené, někteří z mých nejvěrnějších sluhů už pro mě srdce [dead_soldier.GetNameNoTooltip] vyňali,"
 host_dinner_events.1060.desc.outro: "ale když je tu na návštěvě můj [visiting_liege.GetTitleAsNameNoTooltip|U], možná bych měl právě jemu dopřát čest sníst srdce jednoho z nejlepších [ROOT.Char.GetPrimaryTitle.GetAdjective] válečníků!"
 host_dinner_events.1060.a: "Srdce hodné [visiting_liege.GetTitleAsNameNoTooltip|U]!"
 host_dinner_events.1060.b: "To srdce sním [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 you_ate_a_human_heart: "[Select_CString(ROOT.Char.IsFemale,'Snědla jsi','Snědl jsi')] lidské srdce"
 host_dinner_events.1061.title: "$host_dinner_events.1060.title$"
 host_dinner_events.1061.desc.intro: "Odhalí přede mnou můj další chod. Na krásném talíři leží pomalu pečené srdce v kaluži krvavé omáčky.\n\n„Srdce mocného válečníka, [visiting_liege.GetTitleAsNameNoTooltip|U]! Snězte je a získáte stejnou odvahu a bojovného ducha, jaké měl [dead_soldier.GetNameNoTooltip].“\n\n"
 host_dinner_events.1061.desc.cannibal_legal: "Vypadá naprosto znamenitě, dokonale propečené a tak křehké, že ani nemusím sahat po noži."
 host_dinner_events.1061.desc.secret_cannibal: "Nezbývá mi než předstírat šok a znechucení. Mohl snad [stop_host_scope.GetName] nějak odhalit mé tajemství?"
 host_dinner_events.1061.desc.mid: "Při pohledu na tu věc se mi málem zvedne žaludek! To snad [stop_host_scope.GetName] nechce říct, že je to #EMP lidské maso!#!"
 host_dinner_events.1061.desc.outro: "Můj hostitel na mě očekávaně hledí a jemně přisune talíř blíž."
 host_dinner_events.1061.a: "Vynikající!"
 host_dinner_events.1061.b: "Ne, děkuji."
 host_dinner_events.1061.liege_ate_heart: "[visiting_liege.GetFirstName] [Select_CString(visiting_liege.IsFemale,'snědla','snědl')] srdce"
 host_dinner_events.1061.liege_refused_heart: "[visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'odmítla','odmítl')]"
 host_dinner_events.1070.title: "Promarněný potenciál"
 host_dinner_events.1070.desc: "Když jsem zařídil, aby dnes večer [runaway_courtier.GetName] seděl po mém boku, nijak zvlášť jsem nad tím nepřemýšlel. Jak ale přicházejí a mizí další chody, tenhle zajímavý [Select_CString(runaway_courtier.IsFemale,'člověk','člověk')] mě přitahuje čím dál víc.\n\n„Ach, kéž by byl život v hlavním městě takhle zajímavý. Většinu dní se jen povaluji u dvora, nudím se a zahálím. Tady alespoň není nouze o dobrý rozhovor. Přijmete mě ke svému dvoru?“"
 host_dinner_events.1070.a: "„Samozřejmě, přidej se ke mně!“"
 host_dinner_events.1070.b: "„Ne.“"
 host_dinner_events.1071.title: "Dvorská výměna"
 host_dinner_events.1071.desc: "[runaway_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou přijde s tvrzením, že [stop_host_scope.GetName] dovolil, aby opustil můj dvůr a přidal se k jeho.\n\nKdybych to dovolil, nepochybně bych si polepšil u [stop_host_scope.GetTitleAsNameNoTooltip|U], ale dokážu opravdu přehlédnout urážku, jakou je přetahování členů mého dvora?"
 host_dinner_events.1071.a: "„[runaway_courtier.GetNameNoTooltip] patří ke mně!“"
 host_dinner_events.1071.refused_to_let_them_go: "[visiting_liege.GetName] [Select_CString(visiting_liege.IsFemale,'odmítla','odmítl')] nechat [runaway_courtier.GetName] odejít"
 host_dinner_events.1071.b: "„Jdi, kam tě srdce táhne.“"
 host_dinner_events.1080.title: "Představení o ničemovi"
 host_dinner_events.1080.desc: "Není žádným tajemstvím, že [visiting_liege.GetName] je podle mě [visiting_liege.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)], a přesto ten hlupák přijel znesvětit mé síně. Jen s odporem zůstávám v jeho společnosti a sleduji, jak do sebe cpe mé jídlo, když mě náhle něco napadne.\n\nMohl bych zařídit, aby [visiting_liege.GetNameNoTooltip] na tuhle návštěvu nikdy nezapomněl, a sehrát představení o jeho ničemnosti!"
 host_dinner_events.1080.a: "[visiting_liege.GetNameNoTooltip] si nic lepšího nezaslouží."
 host_dinner_events.1080.b: "K něčemu takovému se nesnížím."
 host_dinner_events.1081.title: "[ROOT.Char.GetFirstNameNoTooltip]: [Select_CString(ROOT.Char.IsFemale,'Padouška','Padouch')] z [stop_host_scope.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 host_dinner_events.1081.desc: "Jako obvykle doprovází mé jídlo nějaká zábava. Herci předvádějí úžasné akrobatické kousky a nejrůznější dovednosti, ale pak si něčeho všimnu. Celým představením prochází [Select_CString(ROOT.Char.IsFemale,'žena oblečená','muž oblečený')] stejně jako já, s něčím, co vypadá jako výkaly rozmazané po tváři, a zpívá písně o mé údajné ničemnosti!\n\nŠokovaně se otočím k [stop_host_scope.GetName], jen abych spatřil, jak se celé té vulgaritě chechtá! Nedokážu se ani dotknout jídla a jen sleduji a poslouchám, jak se celý dvůr směje téhle překroucené parodii na mou osobu."
 host_dinner_events.1081.a: "Pomstím se."
 host_dinner_events.1081.b: "Je to vlastně docela legrační..."
 host_dinner_events.1081.liked_performance: "[visiting_liege.GetName] se představení líbilo"
 host_dinner_events.3120.title: "Dar hodný [stop_host_scope.GetTitleAsNameNoTooltip]"
 host_dinner_events.3120.desc: "U večeře se mi naskytne příležitost ukázat svou velkolepost. Můj průvod oplývá cennostmi i nadanými lidmi a možná bych se mohl zavděčit [stop_host_scope.GetName], kdybych tu po sobě něco zanechal.\n\nZe své štědrosti mohu darovat leccos. Třeba..."
 host_dinner_events.3120.a: "[courtier_gift.GetNameNoTooltip] by tu mohl zůstat."
 host_dinner_events.3120.b: "[artifact_gift.GetNameNoTooltip] by mohl připadnout [stop_host_scope.GetNameNoTooltip]."
 host_dinner_events.3120.c: "Zlato je vždycky skvělý dar."
 host_dinner_events.3120.d: "Dar opravdového přátelství!"
 host_dinner_events.3120.e: "Žádný dar nedlužím."
 host_dinner_events.3121.title: "$host_dinner_events.3120.title$"
 host_dinner_events.3121.desc.intro: "Vstoupím do hodovní síně a spatřím [visiting_liege.GetName], jak sedí v čele stolu s nohama bezstarostně vyloženýma vedle svého jídla.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má dobrá vazalko','Můj dobrý vazale')]!"
 host_dinner_events.3121.desc.courtier: "Ujišťuji tě, že [courtier_gift.GetName] je dobrý a věrný dvořan, který ti bude v budoucnu dobře sloužit."
 host_dinner_events.3121.desc.artifact: "Má pokladnice přetéká cennými relikviemi a artefakty. Nemáš zájem o [artifact_gift.GetName]."
 host_dinner_events.3121.desc.gold_gift: "Mé nesmírné bohatství se mi stává břemenem a rád bych se o část z něj podělil se svými nejvěrnějšími poddanými."
 host_dinner_events.3121.desc.best_friend: "Už nějakou dobu jsme přátelé a možná nastal čas posunout naše přátelství ještě dál. Složíš se mnou přísahu #EMP opravdového#! přátelství?"
 host_dinner_events.3121.desc.outro: "Tohle je můj dar pro tebe a nic za něj nežádám.“"
 host_dinner_events.3121.a: "„Děkuji!“"
 host_dinner_3120_gift_taken: "[stop_host_scope.GetFirstName] dar [Select_CString(stop_host_scope.IsFemale,'přijala','přijal')]"
 host_dinner_3120_gift_refused: "[stop_host_scope.GetFirstName] dar [Select_CString(stop_host_scope.IsFemale,'odmítá','odmítá')]"
 host_dinner_events.3121.b: "„Naše přátelství bude věčné.“"
 host_dinner_events.3121.c: "Nepřijmu to."
 host_dinner_events.3130.title: "Není tím, kým se zdá"
 host_dinner_events.3130.desc: "Probudím se [Select_CString(ROOT.Char.IsFemale,'sužovaná','sužovaný')] nesnesitelným hladem a nedokážu znovu usnout.\n\nPotmě zamířím do kuchyně a zjistím, že místnost slabě osvětluje ještě něco jiného než má lampa. Police ve spíži září nadpozemským, a přesto lákavým zlatavým světlem.\n\nPřemůže mě zvědavost, ale zdroj záře nikde nevidím. Zhasnu lampu a začnu prohledávat okraje spíže."
 host_dinner_events.3130.a: "#EMP Musím#! tomu přijít na kloub!"
 host_dinner_events.3130.b: "Nemohu se tu jen tak slídit."
 host_dinner_events.3131.title: "Místnost za spíží"
 host_dinner_events.3131.desc: "Po chvíli si všimnu škrábanců na podlaze pod skříní a několika částí polic, na kterých je mnohem méně prachu než na ostatních. Stačí se jich dotknout a ukáže se, že jde o mechanické spínače. S trochou námahy odsunou celou spíž od zdi a odhalí skrytou místnost!\n\nUprostřed vlhkého kamenného prostoru stojí pevné dřevěné dveře s bohatě zdobeným visacím zámkem. Když si ho prohlédnu zblízka, zjistím, že jeho znaky nejsou čísla ani písmena, ale vyobrazení nejrůznějších zvířat a groteskních tvorů."
 host_dinner_events.3131.a: "Hádanka? To bude hračka."
 host_dinner_events.3131.fail_to_get_it_open: "Dveře se ti nepodaří otevřít"
 host_dinner_events.3131.b: "Pořádný kopanec do dveří to vyřeší!"
 host_dinner_events.3131.c: "Tohle nestojí za všechnu tu námahu."
 host_dinner_events.3132.title: "Skrytá knihovna"
 host_dinner_events.3132.desc: "V otvoru, kde ještě před chvílí stály dveře, spatřím důmyslnou pracovnu. Všude kolem na mírném ohni bublají nejrůznější neznámé látky a v malých klecích jsou zavřená drobná zvířata. Uprostřed místnosti stojí na podstavci jediná kniha. Její desky se lesknou kresbami zvířat a groteskních tvorů, naprosto stejnými jako na hádankovém zámku u vchodu.\n\nVezmu knihu do rukou a při přejíždění prstem po jejím koženém povrchu mě zcela pohltí zvědavost. Pak mezi bezbožnými symboly na deskách zahlédnu jediný srozumitelný znak: číslici jedna. Pokusím se knihu otevřít, ale je pevně uzamčena malým trojúhelníkovým hlavolamem."
 host_dinner_events.3132.a: "Co to může znamenat?"
 host_dinner_events.3132.b: "Další dílek záhady."
 artifact_secret_journal_with_cipher_description: "Dvojice deníků. Jeden je pevně uzamčen nesrozumitelným hlavolamem, druhý obsahuje šifrovací klíč k jakémusi kódovanému jazyku. Zdá se, že patří k sobě."
 artifact_secret_journal_with_puzzle_description: "Podivný deník v kožené vazbě uzamčený nesrozumitelným hlavolamem. Spolu s ním je tu další deník obsahující klíč k jeho rozluštění."
 host_dinner_events.3132.c: "Konečně je mám všechny."
 artifact_secret_journal_unsolved_description: "Tři deníky, z nichž každý ukrývá jinou část klíče k rozluštění záhad těch ostatních. Celé tajemství však zatím zůstává nevyřešeno."
 host_dinner_events.3132.d: "Měl bych to nechat tady."
 host_dinner_events.3133.title: "Skrytá mučírna"
 host_dinner_events.3133.desc: "Dveře povolí a odhalí mi... něco, co bych raději nikdy [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')].\n\nKaždou stěnu zdobí podivné předměty: biče, klády, dřevěné falusy a mnoho dalšího. Podlaha je mokrá čímsi, co je, jak #EMP doufám#!, jen voda. Vzhledem k vybavení této místnosti se však děsím pomyšlení, jaká směs tělesných tekutin by to mohla být."
 host_dinner_events.3133.a: "Teď už vím věci, které jsem vědět nechtěl."
 host_dinner_events.3134.title: "Skrytá porážka"
 host_dinner_events.3134.desc: "Jakmile se dveře pootevřou, udeří mě tak odporný štiplavý zápach, že skončím na zemi a zadek mi dopadne přímo do kaluže čerstvé krve.\n\nMístnost je plná lidských mrtvol, napůl rozřezaných a zavěšených na řeznických hácích. Na porcovacím stole leží lidská kůže vedle těla, které ještě nedávno pokrývala, a opodál špinavý sekáček. Zkřivené výrazy hrůzy na tvářích obětí jako by se staly trvalou součástí místnosti."
 host_dinner_events.3134.a: "Tohle už z paměti nikdy nevymažu."
 host_dinner_events.3135.title: "Úniková chodba"
 host_dinner_events.3135.desc: "Dveře se pootevřou a za nimi se objeví temný slizký tunel porostlý lišejníky a houbami. Brodím se jím až na konec a nakonec vylezu ven na poklidnou venkovskou cestu.\n\nJe zřejmé, že jde o únikovou chodbu [stop_host_scope.GetName] pro případ nouze."
 host_dinner_events.3135.a: "To je ale objev!"
 host_dinner_events.3136.title: "Tajná ložnice"
 host_dinner_events.3136.desc: "Dveře se otevřou a ozve se zděšené zalapání po dechu! Ve dveřích stojí [Select_CString(quasimodo_child.IsFemale,'znetvořená','znetvořený')] [quasimodo_child.Custom('GirlBoy')] a s naprostým šokem a hrůzou v očích na mě zírá.\n\n„Nedívejte se na mě!“ vykřikne [quasimodo_child.GetNameNoTooltip] a zakryje si tvář rukama. „Jestli [stop_host_scope.GetMotherFather] zjistí, že jste mě [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')], čeká vás něco strašného!“\n\nVtom si všimnu podobnosti. Tohle je očividně nemanželské dítě [stop_host_scope.GetNameNoTooltip]!"
 host_dinner_events.3136.a: "Všichni se to dozvědí."
 host_dinner_events.3136.b: "Nikdo se to nikdy nedozví."
 host_dinner_events.3140.title: "Neobvyklá kombinace chutí"
 host_dinner_events.3140.desc: "Život [ROOT.Char.GetTitleAsNameNoTooltip|U] přináší na můj stůl všemožná velkolepá a vybraná jídla, ale poslední dobou už mě stejné chutě a konzistence začínají nudit. Toužím po něčem skutečně výstředním, po něčem opravdu exotickém!\n\nPo jedné straně vidím [stop_host_scope.Custom('GetExpensiveDessert')] a po druhé vařenou zeleninu. Co kdybych ty dvě naprosto odlišné chutě [Select_CString(ROOT.Char.IsFemale,'ochutnala','ochutnal')] zároveň?"
 host_dinner_events.3140.a: "Za pokus to stojí."
 host_dinner_events.3140.satisfying_taste: "Chuť byla vynikající"
 host_dinner_events.3140.it_did_not_work: "Pokus skončil neúspěchem"
 host_dinner_events.3140.b: "Na něco tak odvážného nemám odvahu."
 host_dinner_events.1090.title: "Jed"
 host_dinner_events.1090.desc: "Zdá se, že s návštěvou [visiting_liege.GetName] v mých síních se mi naskytla jedinečná příležitost.\n\n[visiting_liege.GetNameNoTooltip] očekává večeři, na kterou jen tak nezapomene, a s trochou rozemleté rulíkové byliny mohu zaručit, že takovou večeři už nikdy nezažije!\n\nChvíle k úderu se blíží. Opravdu si mohu dovolit takhle riskovat?"
 host_dinner_events.1090.a: "Samozřejmě že ano!"
 host_dinner_events.1090.b: "Ještě nenastal správný čas."
 host_dinner_if_you_succeed_tt: "Pokud uspěješ"
 host_dinner_if_you_fail_tt: "Pokud neuspěješ"
 host_dinner_events.1091.title: "Jed!"
 host_dinner_events.1091.desc: "Bez jediné starosti se pustím do [stop_host_scope.Custom('GetExpensiveDessert')] a spokojeně si užívám další báječné jídlo.\n\nKdyž se však vydám po schodech do postele, začnu slábnout, jako by mi krev houstla a téměř se srážela v žilách. Ještě než dojdu na vrchol schodiště, zhroutím se a lapám po dechu. Zatímco svět kolem mě černá, poslední, co spatřím, je [stop_host_scope.GetName], jak se nade mnou sklání s vědoucím úsměvem."
 host_dinner_1091_murder_succesful: "[Select_CString(ROOT.Char.IsFemale,'Otrávila jsi','Otrávil jsi')] svého [visiting_liege.GetTitleAsNameNoTooltip|U]"
 host_dinner_events.1091.a: "Jak... jsi mohl..."
 host_dinner_events.1092.title: "Pokus o vraždu"
 host_dinner_events.1092.desc: "Obrátím pozornost k [stop_host_scope.Custom('GetExpensiveDessert')] a už se do něj chystám pustit, když mě náhle přepadne nepříjemný pocit a mé nenasytné ruce se zarazí.\n\nDo dezertu několikrát šťouchnu a důkladně k němu přičichnu. Není pochyb, že někdo mé jídlo otrávil! Jiné vysvětlení neexistuje. [stop_host_scope.GetName] se mě snaží zabít."
 host_dinner_events.1092.a: "Ten ničema!"
 host_dinner_1091_murder_failed: "Tvůj pokus o vraždu selhal"
 host_dinner_events.1093.title: "$host_dinner_events.1092.title$"
 host_dinner_events.1093.desc: "Můj věrný ochutnávač [food_taster_scope.GetName] se pustí do své povinnosti. Kontrolu zakončí ochutnáním mého [stop_host_scope.Custom('GetExpensiveDessert')] a krátkým kývnutím mi dá najevo, že je vše v pořádku.\n\nVzápětí se však ubohý [Select_CString(food_taster_scope.IsFemale,'ochutnávačka začne dusit a prskat','ochutnávač začne dusit a prskat')], lapá po dechu a buší pěstí do stolu. Během několika vteřin modré rty vydechnou naposledy a já zůstanu [Select_CString(ROOT.Char.IsFemale,'sama','sám')] s [stop_host_scope.GetName], kterému na tváři hraje neklidný úsměv."
 host_dinner_events.1093.a: "„Vrahu!“"
 host_dinner_events.3150.title: "Otázka cti"
 host_dinner_events.3150.desc: "Celý večer sedím vedle věrného rytíře [stop_host_scope.GetName], [joker_knight.GetName], a zatím je [Select_CString(joker_knight.IsFemale,'tahle žena naprosto okouzlující','tenhle muž naprosto okouzlující')], vždy připravený s nějakým žertem.\n\n„Říkám vám, ze všech [ROOT.Char.Custom2('InsultNoun', ROOT.Char)], které jsem kdy potkal, je [ROOT.Char.GetName] ten nejvíc [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)]! Ha!“\n\n„Co ses to opovážil říct o mém [ROOT.Char.GetLadyLord]?“ [humorless_knight.GetName] vstane ze svého místa. „Vyzývám tě, ničemo!“"
 host_dinner_events.3150.a: "To bude zábava!"
 host_dinner_events.3150.your_knight_wins: "[humorless_knight.GetName] [Select_CString(humorless_knight.IsFemale,'zvítězila','zvítězil')]!"
 host_dinner_events.3150.your_knight_loses: "[humorless_knight.GetName] [Select_CString(humorless_knight.IsFemale,'prohrála','prohrál')]"
 host_dinner_events.3150.b: "Ustup, hlupáku."
 host_dinner_events.3000.title: "Usazení k večeři"
 host_dinner_events.3000.desc.intro: "U brány [stop_host_scope.Custom('FortifiedBuilding')] [stop_host_scope.GetTitledFirstNameNoTooltip] v [ROOT.Char.GetCurrentLocation.GetName] se mi dostane uvítání, jaké náleží [ROOT.Char.GetTitleAsNameNoTooltip],"
 host_dinner_events.3000.desc.type.majesty: "a o tom, že nádhera mého průvodu udělala velký dojem, není nejmenších pochyb.\n\n"
 host_dinner_events.3000.desc.type.taxation: "zatímco můj vůz s truhlami a výběrčí daní dávají jasně najevo účel mé návštěvy.\n\n"
 host_dinner_events.3000.desc.type.intimidation: "a mé chladné přijetí v doprovodu těžce ozbrojených stráží okamžitě navodí požadovanou atmosféru.\n\n"
 host_dinner_events.3000.desc.mid.hates_vassal: "Přijímat pohostinnost od toho [stop_host_scope.Custom2('InsultAdjective', ROOT.Char)] [visiting_liege.Custom2('InsultNoun', ROOT.Char)] mi stačí ke zkažení chuti. Snad tu alespoň mají [ROOT.Char.Custom('FavoriteTreat')]..."
 host_dinner_events.3000.desc.mid.lover: "Dodržovat všechny ty formality se svým drahým [stop_host_scope.Custom('RomanticComplimentNoun')] je krutý úděl... možná se po večeři za [stop_host_scope.GetNameNoTooltip] zastavím."
 host_dinner_events.3000.desc.mid.friend: "Už je to příliš dlouho, co jsem naposledy povečeřel s tak dobrým přítelem! Jen málokdy se mi podaří v takové náladě zapomenout na břemena panství."
 host_dinner_events.3000.desc.mid.close_family: "Je dobré znovu vidět [ROOT.Char.Custom2('RelationToMeShort', stop_host_scope)]! Formálně se obejmeme a před zraky všech tak stvrdíme rodinné pouto."
 host_dinner_events.3000.desc.mid.house: "Je to vzácná příležitost si odpočinout v dobré společnosti, kterou mi dělá [stop_host_scope.Custom('GetDaughterSon')] z rodu [ROOT.Char.GetHouse.GetBaseName]."
 host_dinner_events.3000.desc.mid.powerful_vassal: "Samozřejmě musím také uznat význam, který [stop_host_scope.GetNameNoTooltip] má mezi vazaly [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]... alespoň na veřejnosti."
 host_dinner_events.3000.desc.mid.default: "Můj vazal mě svědomitě přijme se všemi náležitými projevy úcty."
 host_dinner_events.3000.desc.mid: "\n\n[stop_host_scope.GetFirstNameNoTooltip] mi představí plán večerní hostiny a slibuje, že připravená zábava i pokrmy se téměř vyrovnají večeřím u mého vlastního dvora."
 host_dinner_events.3000.desc.outro: "\n\n[stop_host_scope.GetName] mě ujišťuje, že přede mnou leží jen to nejlepší jídlo, jaké může nabídnout."
 host_dinner_events.3000.a: "Začněme!"
 tour_general.9999.opening: "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 tour_general.9999.desc: "Vydávám se na turné a brzy navštívíme [ROOT.Char.GetCapitalLocation.GetNameNoTooltip],"
 tour_general.9999.phase_tour_grounds: "abych si [Select_CString(host.IsFemale,'prohlédla','prohlédl')] tvůj [ROOT.Char.Custom('FortifiedBuilding')] a okolní země."
 tour_general.9999.phase_dinner: "abych ve tvém [ROOT.Char.Custom('FortifiedBuilding')] [Select_CString(host.IsFemale,'okusila','okusil')] znamenitou hostinu."
 tour_general.9999.phase_cultural_festival: "abych si [Select_CString(host.IsFemale,'užila','užil')] místní slavnost [ROOT.Char.GetCulture.GetNameNoTooltip] kultury."
 tour_general.9999.phase_fallback: "abych si [Select_CString(host.IsFemale,'prohlédla','prohlédl')] tvé državy a [Select_CString(host.IsFemale,'vyslechla','vyslechl')], co je u tebe nového."
 tour_general.9999.type_majesty: "\n\nNastal čas, aby [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] spatřilo nádheru a vznešenost svého právoplatného [host.GetLadyLord]."
 tour_general.9999.type_intimidation: "\n\nNastal čas připomenout [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], komu slouží a jaký trest čeká zrádce."
 tour_general.9999.type_taxation: "\n\nPáni a dámy z [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] mi odvedou náležité desátky."
 tour_general.9999.closing: "\n\nOčekávám uvítání hodné [host.GetTitleAsNameNoTooltip|U]."
 tour_general.9999.a: "Musím dohlédnout na přípravy!"
