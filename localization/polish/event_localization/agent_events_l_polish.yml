l_polish:
 scheme_type_contract: "zakázka"
 scheme_type_scheme: "intrika"
 scheme_type_contracts: "zakázky"
 scheme_type_schemes: "intriky"
 agent_events.0001.t: "Nerozluční kumpáni"
 agent_events.0001.desc: "[scheme.Custom('GetSchemeContract')|U], do níž se podařilo naverbovat jak [char_1.GetTitledFirstName], tak [char_2.GetTitledFirstName], je očividně sblížila.\n\nZdá se, že společné úkoly a starosti v nich probudily jiskru vzájemného porozumění.\n\nZatím z toho není nic vážného, ale malé postrčení by mohlo dát vzniknout opravdovému přátelství."
 agent_events.0001.a: "Motivace, říkáš..."
 agent_events.0001.b: "Možná by jejich souhra mohla přinést ovoce..."
 agent_events.0001.b.tt.success: "Pouta náklonnosti se utuží"
 agent_events.0001.b.tt.failure: "Nepodaří se ti je dále povzbudit"
 agent_events.0001.c: "Laskavě se soustřeďte na úkol."
 agent_events.0001.d: "To jim přeji."
 agent_events.0011.t: "Těsná spolupráce"
 agent_events.0011.desc: "[char_1.GetTitledFirstName] a [char_2.GetTitledFirstName] si svou skromnou úlohu v mých plánech očividně užívají trochu #EMP příliš#!.\n\nSpolečný cíl našeho malého plánu je jasný: [scheme.GetName]. Práce na něm však přerostla ve vzájemný respekt a ten se zjevně mění v pevné pouto.\n\nAť už je jeho původ jakkoli nepravděpodobný."
 agent_events.0011.a: "Přátelství zrozené mou zásluhou!"
 agent_events.0011.b: "[char_1.GetFirstNameNoTooltip] #EMP umí#! pobavit..."
 agent_events.0011.c: "[char_2.GetFirstNameNoTooltip] má na lepší společnost."
 agent_events.0011.d: "Ať nás všechny tři spojí přátelství."
 agent_events.0011.e: "Mám radost, že spolu všichni tak dobře vycházíme!"
 agent_events.0011.f: "Tohle není společenské setkání."
 agent_events.0012.t: "Ještě těsnější spolupráce"
 agent_events.0012.desc: "[char_1.GetTitledFirstName] a [char_2.GetTitledFirstName] si svou skromnou úlohu v mých plánech očividně užívají trochu #EMP příliš#!.\n\nKradené pohledy, tlumený šepot, dopisy předávané pod různými záminkami — při troše podezíravosti by se to dalo vyložit všelijak, ale známky začínajícího vztahu jsou nepřehlédnutelné.\n\nJenže náš plán má přece jiný cíl: [scheme.GetName]."
 agent_events.0012.a: "To mi za pomoc jistě budou vděční."
 agent_events.0012.b: "Jejich vášeň se jistě dá využít."
 agent_events.0012.c: "Možná by se jejich vášeň dala využít..."
 agent_events.0012.c.tt.success: "[scheme.GetNameNoTooltip] se pro hrdličky stane hrou"
 agent_events.0012.c.tt.failure: "Jiskra pohasne"
 agent_events.0012.d: "Kvůli tomuhle tu nejsme!"
 agent_events.0012.e: "Koho to zajímá?"
 agent_events.0012.e.tt.become_lovers: "Začátek něčeho většího"
 agent_events.0012.e.tt.not_lovers: "$agent_events.0012.c.tt.failure$"
 agent_events.0021.t: "Učení od nejlepších"
 agent_events.0021.desc.intro: "Dvojice mých spolčenců, [char_1.GetTitledFirstName] a [char_2.GetTitledFirstName], našla v našem plánu společný zájem, který přesahuje jeho základní cíl.\n\n[char_2.GetFirstNameNoTooltip] si očividně všímá, jak dobře [char_1.GetFirstNameNoTooltip] ovládá"
 agent_events.0021.desc.diplomacy: "dopisování, řečnictví a rétoriku obecně"
 agent_events.0021.desc.martial: "logistiku, pevnou vůli a velitelské vystupování"
 agent_events.0021.desc.stewardship: "počty, účetnictví a smysl pro detail"
 agent_events.0021.desc.intrigue: "prohnanost, lstivost a bezohledné úskoky"
 agent_events.0021.desc.learning: "moudrost, četbu a všeobecné znalosti"
 agent_events.0021.desc.prowess: "důvtip, sílu a tělesnou kondici"
 agent_events.0021.desc.outro: ", což se velmi hodí, má-li [scheme.GetName] uspět. [char_2.GetFirstNameNoTooltip] proto [Select_CString(char_2.IsFemale, 'začala', 'začal')] pozorně sledovat, co [char_1.GetFirstNameNoTooltip] dělá jinak, aby si [Select_CString(char_2.IsFemale, 'zlepšila', 'zlepšil')] vlastní schopnosti.\n\nTeoreticky je to neškodné, ale našemu společnému cíli to nijak nepomáhá."
 agent_events.0021.a: "Výborně!"
 agent_events.0021.b: "Tu energii věnuj plánu, ne hloupostem."
 agent_events.0021.c: "Možná se z toho také něco přiučím..."
 agent_events.0031.t: "Učení za pochodu"
 agent_events.0031.desc: "[scheme.Custom('GetSchemeContract')|U], na níž pracujeme, vyžaduje pomoc několika lidí. [char_1.GetTitledFirstName] mezi nimi nejspíš nepatří k těm úplně #EMP nejzdatnějším#!.\n\nPřesto je vidět, že se snaží ze všech sil, nechce promarnit mé úsilí a hodlá se zlepšit v tom, co [scheme.Custom('GetSchemeType')|l] vyžaduje.\n\nPracovat na sobě něco stojí, ale nakonec z toho těžíme všichni."
 agent_events.0031.a: "Můžeš zajít ještě dál!"
 agent_events.0031.a.tt.success: "Až na hranici možností"
 agent_events.0031.a.tt.failure: "Námaha bez výsledku"
 agent_events.0031.b: "Zásluhy samozřejmě patří tomu, kdo to celé vymyslel."
 agent_events.0031.c: "Všechno podle plánu..."
 agent_events.0041.t: "Studium intrik"
 agent_events.0041.desc: "[char_1.GetTitledFirstName] je pro mou [scheme.Custom('GetSchemeContract')] nepochybně velkým přínosem a při každé příležitosti přispívá svými schopnostmi, moudrostí a radami, jak nejlépe dovede.\n\nNaposledy dokonce přišla nabídka doučovat #EMP mě#!, a zvýšit tak naše celkové vyhlídky na úspěch.\n\nTa nabídka je... #EMP lákavá#!, byť poněkud troufalá."
 agent_events.0041.a: "Přijímám."
 agent_events.0041.a.tt.success: "Něčemu se přiučíš"
 agent_events.0041.a.tt.failure: "Ztráta času"
 agent_events.0041.a.tt.they_attempt_to_teach_you: "[char_1.GetFirstName] se tě pokusí učit pomocí své [Concept('skill','dovednosti')|E] #WEAK (čím více tě [char_1.GetFirstNameNoTooltip] převyšuje, tím snazší to bude)#!"
 agent_events.0041.b: "Jak roztomilé! Ne."
 agent_events.0041.c: "Soustřeď svou mysl na úkol, ne na mě."
 agent_events.1001.t: "Jeden druhému po krku"
 agent_events.1001.desc: "Málokdy jsem slyšel dva lidi hádat se tolik jako [char_1.GetTitledFirstName] a [char_2.GetTitledFirstName], dva #EMP formální#! spojence v naší [scheme.Custom('GetSchemeContract')]. Bohužel se zdá, že jeden druhému zkrátka nesnesitelně leze na nervy.\n\nZpočátku jsem se do toho raději nemíchal a spoléhal, že si své neshody vyřeší sami. Teď je však jasné, že pokud je někdo nezastaví, doplatíme na to všichni."
 agent_events.1001.a: "Domluv jim oběma."
 agent_events.1001.a.tt.success: "Vezmou si tvá slova k srdci"
 agent_events.1001.a.tt.failure: "Tvé argumenty padají na hluché uši"
 agent_events.1001.b: "Apeluj na rozum."
 agent_events.1001.b.tt.success: "$agent_events.1001.a.tt.success$"
 agent_events.1001.b.tt.failure: "$agent_events.1001.a.tt.failure$"
 agent_events.1001.c: "Nenávist není zas tak špatný nástroj..."
 agent_events.1001.d: "Přestanete. Hned."
 agent_events.1001.e: "Ať se klidně hádají, když je to baví."
 agent_events.1001.e.rivals_bicker: "Neustálé hádky"
 agent_events.1001.e.rivals_bicker_less: "Občasné hádky"
 agent_events.1011.t: "Rány hnisají"
 agent_events.1011.desc: "Možná ode mě bylo pošetilé vybrat si za pomocníky v této [scheme.Custom('GetSchemeContract')] dva lidi, kteří se podle všeho #EMP nenávidí#! — neustálé hádky a malicherné naschvály mezi [char_1.GetTitledFirstName] a [char_2.GetTitledFirstName] tomu rozhodně nasvědčují.\n\nAť už se však nenávidí sebevíc, na práci před sebou by se snad soustředit dokázat mohli."
 agent_events.1011.a: "Donuť je spolupracovat."
 agent_events.1011.b: "Pokus se je držet od sebe."
 agent_events.1011.c: "Raději do toho nezasahuj."
 agent_events.2001.t: "Radost spolupracovat"
 agent_events.2001.desc: "Je skutečné štěstí, že při plánování této [scheme.Custom('GetSchemeContract')] stojí po mém boku [relation.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n[Select_CString(relation.IsFemale, 'Lepší a všímavější pomocnici', 'Lepšího a všímavějšího pomocníka')] si snad ani nelze přát. Vždy ochotně udělá něco navíc, kdykoli je třeba, a nikdy neztrácí ze zřetele, jak nejlépe naši [scheme.Custom('GetSchemeContract')] posunout kupředu.\n\nNejnovějším výsledkem této práce je zkratka, která by nám měla ušetřit značné množství času."
 agent_events.2001.a: "Výborná zpráva!"
 agent_events.2011.t: "Vlastní zájmy"
 agent_events.2011.desc: "Co za šílenství mě to posedlo, že jsem [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] zapojil do své [scheme.Custom('GetSchemeContract')]?\n\nOd prvního dne mi jen působí potíže, protivný a neodbytný trn v patě.\n\nOtevřeně mě samozřejmě nikdy nesabotuje. Jenže když se bez zjevného důvodu pokazí všechno, čeho se dotkneš, a někdo se u toho pokaždé potutelně usmívá..."
 agent_events.2011.a: "[relation.Custom2('InsultNoun', ROOT.Char)|U] — a ještě k tomu [Select_CString(relation.IsFemale, 'proradná', 'proradný')]!"
 agent_events.2021.t: "Trocha soupeření"
 agent_events.2021.desc: "Zdá se, že se naše [scheme.Custom('GetSchemeContract')] stala pro [agent_1.GetTitledFirstName] a [agent_2.GetTitledFirstName] jakousi hrou.\n\nDříve si nebyli nijak zvlášť blízcí ani se příliš nehádali, teď je však baví přátelsky soupeřit o to, kdo si se svými úkoly poradí lépe, a neustále se snaží jeden druhého překonat.\n\nZatím je to jen drobnost, ale už v ní klíčí cosi ostřejšího."
 agent_events.2021.a: "Trocha přátelského soupeření neuškodí!"
 agent_events.2021.b: "Vážná rivalita by mohla mít své výhody..."
 agent_events.2021.c: "Nech je být."
 agent_events.3001.t: "Svíčka z obou konců"
 agent_events.3001.desc: "Je zřejmé, že [relation.Custom2('MyCharacterIntroduction', ROOT.Char)] dává do mé [scheme.GetName] [scheme.Custom('GetSchemeContract')] skutečně všechno a našim cílům obětuje bezesné noci i dlouhé dny.\n\nMožná... možná je ode mě kruté takto využívat někoho, kdo je mi blízký? Rozhodně by se mi nelíbilo, kdyby někdo podobně využíval mě.\n\nPřesto [relation.GetFirstNameNoTooltip] #EMP odvádí#! skvělou práci a koneckonců jde o dobrou věc."
 agent_events.3001.a: "Prosím, dej do toho #EMP všechno#!."
 agent_events.3001.b: "Dokážeš víc, mnohem víc!"
 agent_events.3001.c: "Raději strav trochu času se mnou, [relation.GetFirstNameNoTooltip]."
 agent_events.3001.d: "Odpočiň si, [relation.GetFirstNameNoTooltip], už toho bylo dost."
 agent_events.3011.t: "Kvůli mně"
 agent_events.3011.desc: "„#EMP Prosím#!, [ROOT.Char.GetFirstNameNoTooltip]. Pracuješ příliš, jako by tě tahle [scheme.Custom('GetSchemeContract')] úplně pohlcovala!“ naříká [relation.Custom2('MyCharacterIntroduction', ROOT.Char)], snad už posté.\n\nPoslední dobou #EMP opravdu#! pilně pracuji, to nelze popřít, ale jistě ne víc, než je nutné.\n\nStrhaný a ustaraný výraz [relation.Custom('MaskFace_BehindAcross')] [relation.GetFirstNamePossessiveNoTooltip] [relation.Custom('MaskFace')] mi však napovídá, že tomu tak možná není."
 agent_events.3011.a: "Kvůli tobě? Samozřejmě!"
 agent_events.3011.b: "[Select_CString(relation.IsFemale, 'Opravdová', 'Opravdový')] [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('relation'))] by po mně něco takového [Select_CString(relation.IsFemale, 'nechtěla', 'nechtěl')]."
 agent_events.3011.c: "Jediná cesta vede kupředu, [relation.GetFirstNameNoTooltip]..."
 agent_events.3021.t: "Rodina drží pohromadě"
 agent_events.3021.desc: "[relation.Custom2('MyCharacterIntroduction', ROOT.Char)] stojí při mně a je trochu zvláštní, jak moc nás tahle [scheme.Custom('GetSchemeContract')] s cílem [scheme.GetName] sblížila.\n\nI společný úkol však dokáže přinést radost, když bok po boku směřujeme ke stejnému cíli. Sdílená trápení jsou snesitelnější, společná vítězství sladší a vždycky je o čem mluvit.\n\nJsem rád, že se [relation.GetFirstNameNoTooltip] do tohoto podniku [Select_CString(relation.IsFemale, 'zapojila', 'zapojil')]."
 agent_events.3021.a: "Rodinná idylka..."
 agent_events.3031.t: "Rozděleni"
 agent_events.3031.desc: "„[relation.GetFaith.HealthGodName] mě slyší! Dá se ti ještě vůbec říkat [relation.Custom2('RelationToMeShort',ROOT.Char)]? Poslední dobou mě rozzuří už jen pohled na tebe!“ vyjede [relation.GetFirstName].\n\nTakové hádky jsou v poslední době pro naše vztahy příznačné. Neshodneme se na plánech ani na způsobu jejich provedení, každé slovo si vyložíme tím nejhorším možným způsobem a sebemenší spor se mění v několikahodinovou hádku.\n\nDoufal jsem, že když se [relation.GetFirstNameNoTooltip] zapojí do této [scheme.Custom('GetSchemeContract')], najdeme společnou řeč. Teď se zdá, že je všechno nenávratně ztraceno."
 agent_events.3031.a: "Prosím, [relation.GetFirstNameNoTooltip], takhle to přece není."
 agent_events.3031.a.tt.success: "Tvé žadonění působí dostatečně žalostně"
 agent_events.3031.a.tt.failure: "Tvá slova padají na hluché uši"
 agent_events.3031.b: "Ty zkrátka nechápeš mou vizi!"
 agent_events.3041.t: "Pochybnosti"
 agent_events.3041.desc: "„[Select_CString(target.IsFemale, 'Je to má', 'Je to můj')] [target_relation.Custom2('RelationToMeShort',SCOPE.sC('target'))|l], k čertu!“ vykřikne [target_relation.GetFirstName], [Select_CString(target_relation.IsFemale, 'celá', 'celý')] bez sebe frustrací a obavami z účasti na mé malé [scheme.Custom('GetSchemeContract')].\n\nVzhledem k tomu, že proti [target.GetFirstName] kujeme plán [scheme.GetName], se tomu vlastně ani nelze divit.\n\n„Možná bych mohl... trochu ustoupit. V tomhle stavu ti stejně nejsem k ničemu.“"
 agent_events.3041.tt.forced_to_stay: "[relation.GetFirstName] bude muset nadále pomáhat s [Concept('scheme','intrikou')|E] [scheme.GetName]"
 agent_events.3041.a: "Laskavě si #EMP vzpomeň#!, proč tu jsi."
 agent_events.3041.a.tt.forced_to_stay_longer: "$agent_events.3041.tt.forced_to_stay$ ještě déle"
 agent_events.3041.b: "Dovol mi změnit tvůj názor..."
 agent_events.3041.b.tt.success: "[relation.GetFirstNameNoTooltip] zůstane"
 agent_events.3041.b.tt.failure: "[relation.GetFirstNameNoTooltip] může odejít"
 agent_events.3041.c: "Dobře víš, že odejít nemůžeš."
 agent_events.3041.c.tt.success: "$agent_events.3041.b.tt.success$"
 agent_events.3041.c.tt.failure: "$agent_events.3041.b.tt.failure$"
 agent_events.3041.d: "Můžeš kdykoli odejít."
 agent_events.3051.t: "Společný nepřítel"
 agent_events.3051.desc: "Z našich posledních rozhovorů je zřejmé, že [target_rival.GetFirstName] ke mně začíná mít vřelejší vztah. [scheme.GetName] [scheme.Custom('GetSchemeContract')] má totiž jediný cíl: [target.GetTitledFirstName], nenáviděný protivník [target_rival.GetFirstNameNoTooltip], a způsob, jakým vše vedu, si očividně získal respekt.\n\nJe to zvláštní způsob, jak s někým najít společnou řeč, ale rozhodně upřímný.\n\nDokonce natolik, že [target_rival.GetFirstNameNoTooltip] mi chce mou snahu oplatit — a to ještě dřív, než vůbec skončí!"
 agent_events.3051.a: "Laskavost za laskavost."
 agent_events.3051.b: "Možná bychom se mohli spřátelit?"
 agent_events.3051.c: "Věnuj prosím svůj čas našim plánům."
 agent_events.3061.t: "Záchranná milost"
 agent_events.3061.desc: "Jednou z hlavních výhod je, že [target_spymaster.GetFirstName], špehmistr sloužící [target.GetTitledFirstName], pracuje na naší [scheme.GetName] [scheme.Custom('GetSchemeContract')]. Člověk, který by nás s největší pravděpodobností odhalil, tak naopak schopně dbá, aby naše tajemství zůstalo skryto.\n\nUdržovat nad naším úsilím roušku mlčení se daří vždy, ale v poslední době si [target_spymaster.GetFirstNameNoTooltip] vede #EMP obzvlášť#! dobře a získává nám tak několik měsíců jistoty, během nichž nás nic neprozradí."
 agent_events.3061.a: "Příjemné překvapení!"
 agent_events.3061.a.tt.extra_grace: "[Concept('scheme','Intrika')|E] [scheme.GetName] získá několik dalších měsíců [Concept('secrecy_grace','ochranné lhůty')|E]"
 agent_events.3071.t: "Smím-li něco navrhnout"
 agent_events.3071.desc.intro.nemesis: "[target.GetTitledFirstName] je předmětem hluboké nenávisti [agent.GetTitledFirstNamePossessive], která při vhodné příležitosti plodí #EMP skutečně#! ohromující nápady."
 agent_events.3071.desc.intro.spymaster: "[agent.GetTitledFirstName] slouží jako špehmistr [target.GetTitledFirstNamePossessive], a má tak mnoho příležitostí hledat neobvyklé způsoby, jak naši malou [scheme.Custom('GetSchemeContract')] podpořit."
 agent_events.3071.desc.intro.councillor: "[agent.GetTitledFirstName] patří mezi důvěryhodné rádce [target.GetTitledFirstNamePossessive], takže schopnosti a prozíravost tohoto spolčence naší věci dobře slouží."
 agent_events.3071.desc.outro: "\n\nDnes z toho vzešla řada možných spolčenců, které bychom mohli do našeho podniku zapojit. Více než jeden by mohl naše úsilí narušit, ale kterýkoli z nich by nám sám o sobě mohl výrazně pomoci."
 agent_events.3071.a: "Něco, co by zvýšilo naše šance, říkáš..."
 agent_events.3071.b: "Způsob, jak naše plány urychlit?"
 agent_events.3071.c: "Možnost lépe skrýt naše stopy mě zajímá."
 agent_events.3071.d: "Můj plán už je bezchybný, děkuji."
 agent_events.4001.t: "Příliš daleko"
 agent_events.4001.desc: "Ať už [distant_agent.GetTitledFirstName] naší [scheme.Custom('GetSchemeContract')] přináší cokoli dalšího, jedno nelze popřít: [distant_agent.GetTitledFirstName] a [scheme.GetTargetCharacter.GetTitledFirstName] se nacházejí zkrátka příliš daleko od sebe, což nám působí... potíže.\n\nVzdálený spolčenec zkrátka nemůže být tak užitečný jako někdo, kdo se může podle potřeby pohybovat na místě.\n\nA teď za tuto nevýhodu platíme."
 agent_events.4001.a: "Jsi nám na obtíž, [distant_agent.GetTitledFirstNameNoTooltip]. Zmiz!"
 agent_events.4001.b: "K čertu..."
 agent_events.4011.t: "Stín u dvora"
 agent_events.4011.desc: "Je skutečným požehnáním mít v naší [scheme.Custom('GetSchemeContract')] někoho jako [skilled_agent.GetTitledFirstName], kdo dokáže naše cíle podpořit bezpočtem způsobů a jen čeká na pokyny.\n\nZáviděníhodná kombinace schopností, přístupu a blízkosti k cíli naší intriky nám nabízí řadu možností, jak tohoto spolčence využít."
 agent_events.4011.a: "Nenápadné zisky jsou vždy nejlepší."
 agent_events.4011.b: "Budoucí potenciál se může hodit..."
 agent_events.4011.c: "Klíčem je nenápadnost!"
 agent_events.4011.d: "To nám otevírá nové možnosti."
 agent_events_0001_agents_focused_on_scheme_modifier: "Pracujte, nekláboste"
 agent_events_0001_agents_focused_on_scheme_modifier_desc: "Nejsme tu kvůli společenské zábavě, jsme tu proto, abychom něco #EMP dokázali#!."
