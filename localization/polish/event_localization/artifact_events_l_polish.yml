 msg_artifact_gained_acquired_desc_1: "Získáváš artefakt [PlayerMessageItem.GetRightArtifact.GetName]"
 msg_artifact_gained_acquired_desc_2: "Získáváš artefakty [PlayerMessageItem.GetRightArtifact.GetName] a [PlayerMessageItem.GetLeftArtifact.GetName]"
 msg_artifact_gained_acquired_desc: "Získáváš artefakty [PlayerMessageItem.GetRightArtifact.GetName], [PlayerMessageItem.GetLeftArtifact.GetName] a $msg_artifact_gained_desc_others$"
 msg_artifact_gained_desc_others: "#tooltip:message_consolidation_names #L další#!#!"
 artifact.0021.t: "[this_artifact.Custom('InventoryCourtArtifact')] zničen!"
 artifact.1001.t: "Prach v prach, rez v...?"
 artifact.1001.desc.antiquarian: "[Select_CString(antiquarian.IsFemale, 'Má antikvářka', 'Můj antikvář')] [antiquarian.GetTitledFirstName] ke mně přichází a v rukou drží artefakt [this_artifact.GetName]."
 artifact.1001.desc.servant: "[Select_CString(dummy_servant_gender.IsFemale, 'Jedna z mých služebných', 'Jeden z mých služebníků')] ke mně přichází a v rukou drží artefakt [this_artifact.GetName]."
 artifact.1001.desc.weapon: "\n\n„Vaše Milosti, při úklidu zbrojnice jsem zjistil, v jak žalostném stavu [SCOPE.Custom('ThisArtifactType')|l] je. Rez už téměř dokonala své dílo. Co s tím máme dělat?“\n\nZkoumám rozsah škod. Žádné překování už této zbrani bojeschopnost nevrátí, za nevelký obnos by ji však bylo možné očistit, zakonzervovat a uchovat na odiv."
 artifact.1001.desc.other: "\n\n„Vaše Milosti, při úklidu skladiště mi padlo do oka, v jak žalostném stavu [SCOPE.Custom('ThisArtifactType')|l] je. Stářím se už téměř rozpadá! Co s tím máme dělat?“\n\nZkoumám rozsah škod. Už jej nelze opravit natolik, aby se dal znovu nosit, za nevelký obnos by jej však bylo možné očistit, zakonzervovat a uchovat na odiv."
 artifact.1001.a: "To stojí za námahu."
 artifact.1001.a.tt.free: "#instruction Tento [Concept('artifact','artefakt')|E] lze převést zdarma!#!"
 artifact.1001.a.tt: "Artefakt [this_artifact.GetName] bude převeden na [Concept('court_artifact','dvorský artefakt')|E], který poskytuje pouze [Concept('grandeur','velkolepost')|E] a [Concept('prestige','prestiž')|E]"
 artifact.1001.b: "Ne, je to příliš drahé."
 manhunter: "#EMP „Lovec lidí“#!"
 heartseeker: "#EMP „Hledač srdcí“#!"
 artifact.1001.desc.kills_none: "[this_artifact.GetDesc]\n\nTato zbraň nikdy nebyla použita v boji a nyní může posloužit už jen jako ozdoba na stěně nějakého panáčka."
 artifact.1001.desc.kills_one: "[this_artifact.GetDesc]\n\nTato zbraň už jednou v bitvě připravila nepřítele o život a svou hodnotu tak prokázala natolik, že si zaslouží místo v síni vládce."
 artifact.1001.desc.kills_some: "[this_artifact.GetDesc]\n\nTato zbraň v bitvách zabila [ROOT.Var('num_kills').GetValue|V0] nepřátel a vysloužila si místo v síni velkého válečníka či jiného vládce."
 artifact.1001.desc.kills_many: "[this_artifact.GetDesc]\n\nPřestože už tato zbraň není způsobilá k boji, má na svědomí [ROOT.Var('num_kills').GetValue|V0] životů. Stala se tak symbolem válečnické zdatnosti hodným síně velkého válečníka."
 artifact.1001.desc.kills_tons: "[this_artifact.GetDesc]\n\nPřestože už tato zbraň není způsobilá k boji, má na svědomí [ROOT.Var('num_kills').GetValue|V0] životů. Stala se tak legendárním symbolem válečnické zdatnosti, který budí úžas či strach v každém, kdo jej spatří."
 artifact.3000.t: "Zchátralý artefakt: Opětovné využití"
 artifact.3000.desc.armorer_intro: "[antiquarian.GetTitledFirstName], [Select_CString(antiquarian.IsFemale, 'která', 'který')] u mě slouží jako $armorer_camp_officer$, ke mně přichází s ustaraným výrazem.\n\n„[Select_CString(ROOT.GetCharacter.IsFemale, 'Má paní', 'Můj pane')], poslední dobou mám stále větší obavy o váš artefakt [this_artifact.GetName]. Je v žalostném stavu a doslova se rozpadá!“"
 artifact.3000.desc.antiquarian_intro: "[antiquarian.GetTitledFirstName], [Select_CString(antiquarian.IsFemale, 'která', 'který')] u mě slouží jako $antiquarian_court_position$, ke mně přichází s ustaraným výrazem.\n\n„[Select_CString(ROOT.GetCharacter.IsFemale, 'Má paní', 'Můj pane')], poslední dobou mám stále větší obavy o váš artefakt [this_artifact.GetName]. Je v žalostném stavu a doslova se rozpadá!“"
 artifact.3000.desc.antiquarian: "\n\n„Na jeho obnovu už možná bude pozdě, ale ještě není všechno ztraceno. Pokud mi dovolíte, [Select_CString(antiquarian.IsFemale, 'mohla bych', 'mohl bych')] jej rozebrat a zachránit použitelné části, které později poslouží při výrobě nového artefaktu!“"
 artifact.3000.desc.servant_intro: "[Select_CString(dummy_servant_gender.IsFemale, 'Jedna z mých služebných ke mně přichází', 'Jeden z mých služebníků ke mně přichází')] s provinilým výrazem a něco skrývá za zády.\n\n„[Select_CString(ROOT.GetCharacter.IsFemale, 'Má paní', 'Můj pane')], jako obvykle jsem [Select_CString(dummy_servant_gender.IsFemale, 'čistila', 'čistil')] vaši sbírku artefaktů, když jsem si všiml, v jak žalostném stavu je [this_artifact.GetName].“"
 artifact.3000.desc.servant: "„Bez odborníka u dvora už asi nebude možné vrátit mu někdejší slávu, ale mohli bychom si alespoň ponechat jeho zbytky a později je využít při výrobě nového artefaktu...“"
 artifact.3000.a: "Bolí mě to, ale pusť se do toho."
 artifact.3000.b: "Ještě se dá zachránit!"
 artifact.3000.c: "Vsadím se, že jsi ho rozbil #EMP ty#!!"
 artifact.3001.t: "Inspirace: Opětovné využití"
 artifact.3001.desc: "[inspiration_owner.GetFirstName] ke mně dnes přichází s nezvykle čilým krokem.\n\n„[Select_CString(ROOT.GetCharacter.IsFemale, 'Má paní', 'Můj pane')]! Při hledání inspirace jsem se prohraboval mezi odloženými věcmi a rozbitými tretkami ve vašich skladištích a narazil jsem na nečekaný poklad. Zdá se, že jste si tu kdysi nechal nějaký materiál z rozebraného artefaktu pro budoucí využití... A ta budoucnost právě nastala!\n\nKdybych tyto zbytky použil na svůj projekt, na jeho kvalitě by to nijak neubralo, a dokonce bych vám mohl vrátit část zlata, které jste vyčlenil na nákup materiálu!“"
 artifact.3001.a: "To je výborná zpráva!"
 artifact.3010.t: "Zchátralý artefakt: Prodej"
 artifact.3010.desc.antiquarian: "\n\n„Možná by se našel obchodník se starým železem, který by za použitelné části zaplatil slušnou cenu...“"
 artifact.3010.desc.servant: "\n\n„Teď už je to úplně k ničemu a ani se nedá poznat, co to kdysi bylo! Můžete to rovnou prodat vetešníkovi a alespoň z toho vytřískat pár zlaťáků...“"
 artifact.3010.a: "Dobrá, stejně už to nepotřebuji."
 artifact.3010.a.tt: "Artefakt [this_artifact.GetNameNoTooltip|U] bude prodán obchodníkovi a navždy ztracen."
 artifact.3010.b: "Ten artefakt je #EMP MŮJ#!!"
 artifact.3020.t: "Zchátralý artefakt: Přetvoření"
 artifact.3020.desc: "\n\n„Ke svému původnímu účelu už možná nikdy neposlouží, ale pokud dovolíte, mohl bych z něj alespoň něco zachránit jako památku na jeho zašlou slávu. Koneckonců byl po nějakou dobu mocným symbolem vaší moci...“"
 artifact.3020.a: "Alespoň bude ještě k něčemu..."
 artifact.3020.b: "Prostě dělej svou práci a oprav ho!"
 keepsake_trinket_name: "Památka na [this_artifact.GetNameNoTooltip]"
 keepsake_trinket_description: "Ztracený artefakt [this_artifact.GetNameNoTooltip] přežil alespoň v podobě fragmentu, který byl pro [owner.GetTitledFirstNameNoTooltip] zachráněn jako památka péčí $antiquarian_court_position$."
 artifact.3030.t: "Zchátralý artefakt: Zachování"
 artifact.3030.desc: "\n\n„Mám návrh, jak ho zachránit. Nedávno se mi na jednom potulném jarmarku podařilo v kostkách vyhrát zaprášený svitek od značně pochybného člověka. Byla to šťastná náhoda, protože jeho obsah dokonale zapadl do mého rodícího se zájmu o alchymii! Starý svitek popisuje tajný lektvar, který prý dokáže učinit #EMP jakýkoli artefakt#! ještě lepším, než když byl nový. Prosím, dovolte mi ho vyzkoušet!“"
 artifact.3030.a: "Jistě, horší už to snad být nemůže..."
 artifact.3030.b: "S tím lektvarem se toho #EMP ani nedotkneš#!!"
 artifact.3030.a.bigsuccess: "Artefakt je čistší a odolnější než kdy dřív"
 artifact.3030.a.bigsuccess.t: "Artefakt obnoven a vylepšen"
 artifact.3030.a.success: "Artefakt je opraven"
 artifact.3030.a.success.t: "Artefakt opraven"
 artifact.3030.a.failure: "Ošetření se nezdařilo"
 artifact.3030.a.failure.t: "Zbytečné ošetření"
 artifact.3030.a.bigfailure: "Artefakt je zničen"
 artifact.3030.a.bigfailure.t: "Artefakt zničen!"
 artifact.3040.t: "Zchátralý artefakt: Nabídka"
 artifact.3040.desc.antiquarian: "Můj $antiquarian_court_position$ [antiquarian.GetTitledFirstName] ke mně přichází. [Select_CString(antiquarian.IsFemale, 'Doprovází ji', 'Doprovází ho')] [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„[Select_CString(ROOT.GetCharacter.IsFemale, 'Má paní', 'Můj pane')], doslechl jsem se, že váš artefakt [this_artifact.GetName] je v žalostném stavu... Přes veškerou mou snahu už bez dostatečných prostředků nedokážu udělat nic dalšího pro jeho záchranu!\n\nPřesto jsem našel možné řešení, které ušetří vaši pokladnici. [vassal.GetTitledFirstNameNoTooltip|U] [Select_CString(vassal.IsFemale, 'nabídla', 'nabídl')], že náklady převezme na sebe výměnou za pouhý projev vaší vděčnosti.“"
 artifact.3040.desc.no_antiquarian: "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází s tak falešně zkroušeným výrazem, že už předem tuším, co přijde.\n\n„[Select_CString(ROOT.GetCharacter.IsFemale, 'Má paní', 'Můj pane')], je přece naprostá #EMP ostuda#!, aby tak vzácné poklady, jako je váš artefakt [this_artifact.GetName], ležely zapomenuté a opuštěné pod vrstvou prachu! Dovolte mi zaplatit jeho obnovu výměnou za malou laskavost.“"
 artifact.3040.a: "Tušil jsem, že v tom bude háček... Ale dobrá!"
 artifact.3040.b: "Tím jsme si tedy kvit."
 artifact.3040.c: "Tvou pomoc nepotřebuji."
 artifact.3050.t: "Zchátralý artefakt!"
 artifact.3050.desc: "U kvalitního artefaktu [this_artifact.GetName], který vlastníš, se [Concept('durability','trvanlivost')|E] blíží k #N 0#! a hrozí jeho zničení!"
 artifact.4000.t: "Zvěsti o prokletí"
 artifact.4000.desc.antiquarian_intro: "Můj $antiquarian_court_position$ [antiquarian.GetTitledFirstName] se už několik dní tváří ustaraně, až za mnou konečně přichází.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], mám znepokojivé zprávy o jednom z vašich vzácných pokladů, artefaktu [this_artifact.GetName]. Chodbami se o něm šíří zvěsti a hosté i družiníci na něj hledí se strachem a podezřením... Věří, že je #EMP prokletý!#! Prý"
 artifact.4000.desc.servant_intro: "V posledních dnech si nemohu nevšimnout, že se mou domácností šíří více zvěstí než obvykle. Kdykoli však vstoupím do místnosti, všechny hlasy náhle utichnou.\n\nKdyž se mi konečně podaří zastavit jednoho ze služebnictva a dožadovat se vysvětlení, dozvídám se: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], vy to nevíte? Jde o váš artefakt [this_artifact.GetName]! Všichni vědí, že je #EMP prokletý!#! Je přece jasné, že"
 artifact.4000.desc.stolen: " jej nikdo nemůže skutečně vlastnit, protože je mu souzeno být stále znovu kraden a rozsévat nekonečné sváry!“"
 artifact.4000.desc.assassinated: " každému, kdo jej vlastní, přináší strašlivé neštěstí a násilnou smrt!“"
 artifact.4000.desc.ghost: " v něm přebývá rozhněvaný duch mrtvého!“"
 artifact.4000.desc.fallback: " za jeho zákeřnou mocí stojí sám [ROOT.Char.GetFaith.DevilName]!“"
 artifact.4000.desc.end: "\n\n„Možná by zásah svatého muže či ženy všechny uklidnil...“"
 artifact.4000.cursed_name: "Prokletý [this_artifact.GetNameNoTooltip]"
 artifact.4000.cursed_desc: "[this_artifact.GetDesc]\n\nUrození i prostí v přítomnosti tohoto předmětu umlkají nebo vzývají božskou ochranu. Předmět je totiž proslulý jako prokletý."
 artifact.4000.a: "Ať sem ta osoba přijde okamžitě!"
 artifact.4000.b: "Ať se před ním všichni třesou strachy!"
 artifact.4001.t: "Zvěsti o prokletí: Posvátný zásah"
 artifact.4001.desc.antiquarian_intro: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ oslovuje mě můj [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] a žádá o mou pozornost."
 artifact.4001.desc.servant_intro: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ přispěchá ke mně jeden ze služebnictva v doprovodu vážně vyhlížející postavy."
 artifact.4001.desc: "„Jak jste si přál, podařilo se najít [Select_CString(holy_man.IsFemale, 'svatou ženu', 'svatého muže')], která má požehnat vašemu artefaktu [this_artifact.GetName].\n\nJe to [holy_man.GetFirstName]. [Select_CString(holy_man.IsFemale, 'Její zásah', 'Jeho zásah')] jistě zlomí prokletí a všechny konečně uklidní.“"
 artifact.4001.a: "Ať [holy_man.GetFirstNameNoTooltip] udělá, co může..."
 artifact.4001.a.success: "Prokletí zlomeno"
 artifact.4001.a.failure: "Prokletí trvá"
 artifact.4001.a.success.desc: "Prokletí je zlomeno"
 artifact.4001.a.failure.desc: "Prokletí přetrvává"
 artifact.4002.t: "Zvěsti o prokletí: Temná pověst"
 artifact.4002.desc.antiquarian_intro: "Můj [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] mě oslovuje se zamyšleným výrazem."
 artifact.4002.desc.servant_intro: "Cestou do svých komnat mě zastavuje skupinka vyděšeného služebnictva. Jeden z nich se odhodlá promluvit."
 artifact.4002.desc: "\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jistě víte, že zlověstná pověst vašeho artefaktu [this_artifact.GetName] coby prokletého předmětu s každým rokem sílí... Vaši družiníci, služebnictvo, a dokonce i hosté se ho děsí!\n\nNeměli bychom povolat svatého muže či ženu, aby předmětu požehnali a konečně dopřáli vašim vystrašeným poddaným trochu klidu?“"
 artifact.4010.t: "Proslulá smrtící zbraň"
 artifact.4010.desc.antiquarian_intro: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], slyšel jste ty novinky?“ Můj [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] ke mně přichází."
 artifact.4010.desc.servant_intro: "Nemohu přeslechnout vzrušené hlasy malé skupinky služebnictva shromážděné v síni."
 artifact.4010.desc: "\n\n„[ROOT.Char.GetTitledFirstNamePossessiveNoTooltip] [this_artifact.GetName] je známý široko daleko a jeho sláva stále roste! [SCOPE.Custom('ThisArtifactType')|U] prý nepřátele kosí stejně snadno jako květy na louce a stejně obdivně se mluví i o [Select_CString(ROOT.Char.IsFemale, 'jeho slavné majitelce', 'jeho slavném majiteli')]!“"
 artifact.4010.a: "Výborná zpráva!"
 artifact_killer_1_name: "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomWeaponTitle1')]"
 artifact_killer_2_name: "[this_artifact.Custom('RandomWeaponTitle2')] [this_artifact.GetNameNoTooltip]"
 artifact_killer_3_name: "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomWeaponTitle3')]"
 artifact_killer_4_name: "[this_artifact.Custom('RandomWeaponTitle4')] [this_artifact.GetNameNoTooltip]"
 artifact_killer_1_desc: "[this_artifact.GetDesc]\n\nTato zbraň byla použita nejméně při 15 vítězstvích na bitevním poli a proslula tím, že dává vyniknout skutečné udatnosti svých majitelů."
 artifact_killer_2_desc: "[this_artifact.GetDesc]\n\nTato zbraň byla použita nejméně při 30 vítězstvích na bitevním poli a proslula utrpením, které přináší nepřátelům."
 artifact_killer_3_desc: "[this_artifact.GetDesc]\n\nTato zbraň byla použita nejméně při 50 vítězstvích na bitevním poli a proslula tím, že svému majiteli vždy přináší vítězství."
 artifact_killer_4_desc: "[this_artifact.GetDesc]\n\nTato zbraň byla použita nejméně při 100 vítězstvích na bitevním poli a vyprávějí se o ní legendy."
 artifact.4020.t: "Proslulá zbroj"
 artifact.4020.desc: "\n\n„Každý už pozná artefakt [this_artifact.GetName], který nosí [ROOT.Char.GetTitledFirstNameNoTooltip]. Na bojišti září jako žádný jiný a přátelé i nepřátelé při pohledu na něj vědí, že mezi nimi kráčí nesmrtelný hrdina!“"
 artifact.4020.a: "Výborná zpráva!"
 artifact_armor_1_name: "[this_artifact.Custom('RandomArmorTitle1')] [this_artifact.GetNameNoTooltip]"
 artifact_armor_2_name: "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomArmorTitle2')]"
 artifact_armor_3_name: "[this_artifact.Custom('RandomArmorTitle3')] [this_artifact.GetNameNoTooltip]"
 artifact_armor_4_name: "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomArmorTitle4')]"
 artifact_armor_1_desc: "[this_artifact.GetDesc]\n\nTato zbroj ochránila svého majitele nejméně v 15 bitvách a na bojišti si jí začínají všímat."
 artifact_armor_2_desc: "[this_artifact.GetDesc]\n\nTato zbroj ochránila svého majitele nejméně ve 30 bitvách a na bojišti si už získává jméno."
 artifact_armor_3_desc: "[this_artifact.GetDesc]\n\nTato zbroj ochránila svého majitele nejméně v 50 bitvách a přátelé i nepřátelé ji už poznávají a obávají se jí."
 artifact_armor_4_desc: "[this_artifact.GetDesc]\n\nTato zbroj ochránila svého majitele nejméně ve 100 bitvách a je považována za legendární."
 artifact.4030.t: "Koruna našeho lidu"
 artifact.4030.desc.antiquarian_intro: "Můj [ROOT.Char.Custom('GetAntiquarianOrArmorer')] [antiquarian.GetTitledFirstName] ke mně přichází se širokým úsměvem a v rukou drží můj artefakt [this_artifact.GetName]."
 artifact.4030.desc.servant_intro: "Služebník, který obvykle čistí mé nejvzácnější poklady, ke mně přichází a v rukou drží můj artefakt [this_artifact.GetName]."
 artifact.4030.desc_emperor: "\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], věděli jste, že po tolika generacích v rukou císařů je tato koruna dnes všeobecně považována za symbol císařské moci?“"
 artifact.4030.desc_kingdom: "\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], věděli jste, že po tolika generacích v rukou králů je tato koruna dnes považována za nedílnou součást identity země jménem [primary_title_scope.GetBaseNameNoTierNoTooltip]?“"
 artifact_emperors_crown_name: "Císařská [this_artifact.GetNameNoTooltip]"
 artifact_emperors_crown_desc: "[this_artifact.GetDesc]\n\nPo mnoho generací tato koruna náležela císařům, a získala tak mimořádnou autoritu."
 artifact_crown_special_name: "[this_artifact.GetNameNoTooltip] ([primary_title_scope.GetNameNoTierNoTooltip])"
 artifact_crown_special_desc: "[this_artifact.GetDesc]\n\nTato koruna se po několik generací předávala mezi vládci téhož titulu, až se stala symbolem jejich moci."
 artifact.4040.t: "Oko znalce"
 artifact.4040.desc: "[helpful.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází s jiskrou v očích.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], nemohl jsem si nevšimnout znamenitého řemeslného zpracování vašeho artefaktu [this_artifact.GetName]... Jen skutečný znalec bojiště, jako jsem já, si však dokáže všimnout drobných úprav, díky nimž by se z něj mohla stát ještě účinnější válečná zbraň!“\n\nKdyž začne [helpful.GetFirstNameNoTooltip] rozvláčně vykládat o #EMP souměrnosti#!, #EMP vyvážení#! a #EMP opotřebení ostří#!, přestávám poslouchat. Podstatu však chápu. Můj artefakt lze vylepšit výměnou za #EMP symbolický projev mé vděčnosti#!."
 artifact.4040.a: "Dobrá, pusť se do toho."
 artifact.4040.a.tt: "Artefakt [this_artifact.GetName|U] je vylepšen!"
 artifact.4040.b: "Tvou pomoc nepotřebuji."
 artifact.4050.t: "Výbuch hněvu"
 artifact.4050.desc: "Už nějakou dobu se na mě stres vrší jako hromada cihel. Cítím, jak ve mně vztek pomalu vře a čeká jen na sebemenší záminku, aby vybuchl naplno.\n\nVšechno se ve mně zlomí ve chvíli, kdy vstoupím do síně. Služebnictvo pomlouvá, dvořané žvaní, rádci se jeden přes druhého dožadují mé pozornosti a najednou je toho zkrátka příliš.\n\n„#EMP DOST!#!“ zařvu, popadnu první věc, na kterou mi padne ruka, a mrštím jí o nejbližší stěnu.\n\nSíň rázem ztichne. Když na podlaze spatřím poškozený, zkroucený a rozbitý artefakt [this_artifact.GetName], všechen hněv ze mě vyprchá a vystřídá jej hrůza..."
 artifact.4050.a: "K čertu!"
 artifact.4060.t: "Božské požehnání"
 artifact.4060.desc: "„dovolte mi představit vzácného hosta. Je tu [holy_man.GetFirstName], [Select_CString(holy_man.IsFemale, 'svatá žena proslulá', 'svatý muž proslulý')] po celém vašem panství.\n\n[holy_man.GetFirstName] [Select_CString(holy_man.IsFemale, 'byla hluboce dojata', 'byl hluboce dojat')] vaší pověstí zbožného a spravedlivého vládce a přeje si jednomu z vašich pokladů propůjčit božskou ochranu.“\n\n„Dovolíte to?“"
 artifact.4060.a: "Pokorně tuto nabídku přijímám."
 artifact.4060.b: "To nebude nutné."
 artifact_4060_blessed_artifact_name: "Požehnaný artefakt [this_artifact.GetNameNoTooltip]"
 artifact_4060_blessed_artifact_desc: "[this_artifact.GetDesc]\n\nPodle tradovaného příběhu tomuto předmětu požehnal svatý muž či žena, a poskytl mu tak božskou ochranu. Moudří lidé si se silami nadpřirozena nezahrávají, ať už v ně věří, nebo ne."
 artifact.4070.t: "Znesvěcená relikvie"
 artifact.4070.desc: "[ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')|U] měli náš drahocenný artefakt [this_artifact.GetName] ve své moci, ale podařilo se mi jim jej vyrvat. [ROOT.Char.GetFaith.HighGodName] si toho jistě povšiml a nyní na mě hledí příznivěji. Přesto ve mně zůstává nepříjemný pocit, který přiživují hlasy z mého dvora.\n\n#EMP „[ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')|U] naši relikvii poskvrnili!“ „Prokleli ji!“ „Kdo ví, jaké zvrácené obřady s ní prováděli!“#!\n\nNejspíš přehánějí, ale okázalé náboženské procesí, které by ji „očistilo“, přece nemůže ničemu uškodit."
 artifact.4070.a: "Uspořádejme ho okamžitě!"
 artifact.4070.b: "Ne, to je jen pověrčivost."
 artifact.4080.t: "Zbraň mistra soubojů"
 artifact.4080.desc: "\n\n„Všichni mluví o artefaktu [this_artifact.GetName], který nosí [ROOT.Char.GetTitledFirstNameNoTooltip]! Prý s ním nelze prohrát jediný souboj! Dokonce jsem slyšel, že si za majitele vybírá jen ty nejhodnější. A onehdy jsem mluvil s potulným kupcem. Sláva této nepřemožitelné zbraně už dorazila i do jeho vlasti!“"
 artifact_duel_weapon_1_name: "[this_artifact.Custom('RandomDuelTitle1')] [this_artifact.GetNameNoTooltip]"
 artifact_duel_weapon_2_name: "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomDuelTitle2')]"
 artifact_duel_weapon_3_name: "[this_artifact.Custom('RandomDuelTitle3')] [this_artifact.GetNameNoTooltip]"
 artifact_duel_weapon_4_name: "[this_artifact.GetNameNoTooltip] [this_artifact.Custom('RandomDuelTitle4')]"
 artifact_duel_weapon_1_desc: "[this_artifact.GetDesc]\n\nTato zbraň zvítězila nejméně nad 5 protivníky v soubojích a prokázala, že je spolehlivá a přináší štěstí."
 artifact_duel_weapon_2_desc: "[this_artifact.GetDesc]\n\nTato zbraň zvítězila nejméně nad 10 protivníky v soubojích a začíná si získávat věhlas."
 artifact_duel_weapon_3_desc: "[this_artifact.GetDesc]\n\nTato zbraň zvítězila nejméně nad 20 protivníky v soubojích a získala si obávanou pověst."
 artifact_duel_weapon_4_desc: "[this_artifact.GetDesc]\n\nTato zbraň zvítězila nejméně nad 30 protivníky v soubojích a zanechala po sobě legendární odkaz."
 artifact.6001.t: "Nepřátelská korouhev"
 artifact.6001.desc.commander: "Přehlížím bojiště a přemítám, jak se na tuto bitvu bude vzpomínat. Pohled mi sklouzne k mrtvým, kteří zůstali ležet na zemi. Vtom si všimnu skupiny svých vojáků, kteří ke mně přicházejí a uctivě se uklánějí.\n\n"
 artifact.6001.desc: "Bitva u [combat_location.GetName] skončila ohromujícím vítězstvím! Dychtivě naslouchám poslovi, který mi předčítá hlášení od mého velitele [friendly_commander.GetTitledFirstName], a poté se obracím k vojákům stojícím přede mnou.\n\n"
 artifact.6001.desc.looting: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Když jsme tak... ‚uklízeli‘ bojiště, narazili jsme na nepřátelskou korouhev! Byla by škoda ji tam nechat. Třeba byste si ji chtěli ponechat jako trofej?“"
 artifact.6001.desc.killed_defender: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Zahnali jsme zbylé nepřátele do kouta, kde se statečně bránili do posledního dechu. Za ochranu této korouhve položili život.“"
 artifact.6001.a: "Do mé sbírky se bude skvěle hodit!"
 artifact.6001.b: "Hoďte ji na slavnostní hranici. Takovou bezcennou cetku nepotřebujeme."
 artifact.6001.toast: "Korouhev ztracena u [combat_location.GetNameNoTooltip]"
 artifact.7000.a.boil_skull: "[skull_boiler.GetFirstName] vyvaří a očistí [skull_to_boil.GetFirstNamePossessive] lebku, čímž z ní vytvoří [Concept('court_artifact','dvorský artefakt')|E]"
 artifact_rival_skull: "[skull_to_boil.GetFirstNamePossessive] lebka. [skull_to_boil.GetTitledFirstName] [Select_CString(skull_to_boil.IsFemale, 'byla popravenou soupeřkou', 'byl popraveným soupeřem')] [ROOT.Char.GetTitledFirstName]. Lebku vyvařil a očistil [skull_boiler.GetFirstName]. Na čele jsou vyryta slova „[skull_to_boil.Custom2('InsultAdjective', ROOT.Char)|U] [skull_to_boil.Custom2('InsultNoun', ROOT.Char)]“."
 artifact.7000.t: "Soupeř navždy"
 artifact.7000.desc: "Ach, [ROOT.Char.GetFaith.HighGodName] budiž pochválen! [skull_to_boil.GetFirstName] je konečně [Select_CString(skull_to_boil.IsFemale, 'mrtvá', 'mrtvý')] a navíc [Select_CString(skull_to_boil.IsFemale, 'byla popravena', 'byl popraven')] na #EMP můj#! rozkaz!\n\nMusím přiznat, že mi bude chybět ten žalostný nářek ozývající se z mého žaláře... Možná bych si měl nechat nějakou památku, abych měl koho urážet, až budu odpočívat na trůnu?\n\n[skull_boiler.GetFirstName] stejně zrovna nedělá nic důležitého..."
 artifact.7000.a: "[skull_boiler.GetFirstNameNoTooltip], vyvař a očisti mi [skull_to_boil.GetFirstNamePossessiveNoTooltip] lebku. Hned."
 artifact.7000.b: "Ne. Už se #EMP nemohu dočkat#!, až na [skull_to_boil.GetFirstNameNoTooltip] úplně zapomenu!"
 artifact.4090.t: "Relikvie na dosah..."
 artifact.4090.desc.antiquarian: "Můj antikvář [antiquarian.GetTitledFirstName] za mnou přichází s nápadem. Kdybych relikvii [that_artifact.GetName] nechal uzavřít do rukojeti artefaktu [this_artifact.GetName], při každém jeho použití bych byl blíže tomu, koho nazýváme [ROOT.Char.GetFaith.HighGodName].\n\n„Kdykoli byste drželi [this_artifact.GetType], doslova byste se dotýkali částečky posmrtného světa,“ pronáší [antiquarian.GetTitledFirstNameNoTooltip] a v očích se [Select_CString(antiquarian.IsFemale, 'jí', 'mu')] zračí náboženské vytržení."
 artifact.4090.desc: "Jednoho dne hledím na relikvii [that_artifact.GetName], když mě náhle zasáhne vnuknutí. Kdybych ji zasadil do rukojeti artefaktu [this_artifact.GetName], při každém jeho použití bych byl blíže tomu, koho nazýváme [ROOT.Char.GetFaith.HighGodName]."
 artifact.4090.a: "Tak budu vždy nablízku tomu, koho nazýváme [ROOT.Char.GetFaith.HighGodName]."
 artifact.4090.b: "To by nebylo vhodné."
 artifact.4090.a.tt: "Relikvie a zbraň spojeny"
 artifact_weapon_relic_desc: "[this_artifact.GetDesc]\n\nV rukojeti je zasazena relikvie [that_artifact.GetNameNoTooltip] náležející k víře [ROOT.Char.GetFaith.GetName]."
 relic_weapon_name: "[this_artifact.GetType|U] [ROOT.Char.Custom('artifact_relic_desc')]"
 embedded_not_destroyed_tooltip: "Relikvie [that_artifact.GetName] je zasazena do mého artefaktu [this_artifact.GetName]"
 relic_name_afterlife: "[ROOT.Char.GetFaith.PositiveAfterLife|U]"
 relic_name_highgod: "[ROOT.Char.GetFaith.HighGodName]"
 relic_name_highgod_alternate: "[ROOT.Char.GetFaith.HighGodNameAlternate]"
 relic_name_health: "[ROOT.Char.GetFaith.HealthGodName]"
 relic_name_symbol: "[ROOT.Char.GetFaith.ReligiousSymbol|U]"
 relic_name_text: "[ROOT.Char.GetFaith.ReligiousText|U]"
