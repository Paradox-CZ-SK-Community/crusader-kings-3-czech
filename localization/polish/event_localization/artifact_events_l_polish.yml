 artifact_damaged_in_duel: "V souboji, v němž proti tobě [Select_CString(DAIBE_opponent.IsFemale, 'stála', 'stál')] [DAIBE_opponent.GetShortUINameNoTooltip], utrpěl artefakt [DAIBE_artifact.GetName] poškození [DAIBE_artifact.MakeScope.Var('DAIBE_damage').GetValue|V0]"
 artifact_claim_gained_notification: "Získán nárok na artefakt"
