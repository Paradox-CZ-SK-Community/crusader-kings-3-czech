l_polish:
 legitimize_bastard_interaction: "Legitimizovat levobočka #weak (rod)#!"
 legitimize_bastard_interaction_extra_icon: "$hook_extra_icon$"
 legitimize_bastard_interaction_desc_house_head: "$house_head_interaction_header$Prohlaš [secondary_recipient.GetShortUINameNoTooltip] za [Concept('legitimized_bastard',Select_CString(secondary_recipient.IsFemale, 'legitimizovanou levobočku', 'legitimizovaného levobočka'))|E]\n\n#weak Tato možnost je dostupná, protože [secondary_recipient.GetShortUINameNoTooltip] je [Concept('bastard',Select_CString(secondary_recipient.IsFemale, 'levobočkou', 'levobočkem'))|E] mého [Concept('house','rodu')|E]#!"
 legitimize_bastard_interaction_desc_not_house_head: "Požádej [recipient.GetShortUINameNoTooltip], aby uznal [Concept('bastard',Select_CString(secondary_recipient.IsFemale, 'tvou levobočku', 'tvého levobočka'))|E] za [Concept('legitimate',Select_CString(secondary_recipient.IsFemale, 'legitimní', 'legitimního'))|E]\n#weak ([recipient.GetShortUINameNoTooltip] je [Concept('house_head_head','hlavou')|E] tvého [Concept('house','rodu')|E])#!"
 legitimize_bastard_interaction_notification: "Levoboček legitimizován"
 legitimize_bastard_interaction_decline_notification: "Levoboček nebyl legitimizován"
 I_AM_HOUSE_HEAD_MODIFIER: "Jako hlava rodu mohu rozhodnout podle svého"
 PRESTIGOUS_IN_OUR_HOUSE: "Úroveň slávy: $VALUE|+0$"
 house_bastard_was_legitimized: "Levoboček rodu legitimizován"
 dynasty_bastard_was_legitimized: "Levoboček dynastie legitimizován"
 bastard_interaction.0001.t: "Rod [actor.GetHouse.GetBaseName]"
 bastard_interaction.0001.desc.standard: "Po tak dlouhé době se [Select_CString(actor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] konečně [Select_CString(actor.IsFemale, 'rozhodla', 'rozhodl')] dopřát mi přijetí, po kterém tak dlouho prahnu. Od dnešního dne jsem [Select_CString(actor.IsFemale, 'její', 'jeho')] legitimní [secondary_recipient.Custom('DaughterSon')|l]. Pouhými několika slovy [Select_CString(actor.IsFemale, 'zásadně změnila', 'zásadně změnil')] běh mého budoucího života."
 bastard_interaction.0001.desc.child: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U] mě prý [Select_CString(actor.IsFemale, 'legitimizovala', 'legitimizoval')] — teď jsem [Select_CString(actor.IsFemale, 'její', 'jeho')] skutečná [secondary_recipient.Custom('DaughterSon')|l]. Nejsem si úplně jistý, co to znamená, ale všiml jsem si, že se na mě někteří lidé dívají jinak. Většina je milejší, jiní zase o něco méně..."
 bastard_interaction.0001.a.standard: "Všechny mé sny se teď zdají mnohem blíž."
 bastard_interaction.0001.a.child: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|U] říká, že je to dobře."
 bastard_interaction.0002.t: "Vítej v rodině"
 bastard_interaction.0002.house_head: "[Select_CString(legitimized_bastard.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))|l] [legitimized_bastard.GetFirstName] je od této chvíle mým legitimním dítětem a členem rodu [actor.GetHouse.GetBaseName]. K tomuto rozhodnutí jsem dospěl po dlouhém uvažování, a přestože s ním někteří možná nebudou souhlasit, bylo správné."
 bastard_interaction.0002.dynast: "[Select_CString(legitimized_bastard.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))|l] [legitimized_bastard.GetFirstName] je od této chvíle [Select_CString(legitimized_bastard.IsFemale, 'legitimní potomkyní', 'legitimním potomkem')] dynastie [actor.GetDynasty.GetBaseName]."
 bastard_interaction.0002.approved: "[Select_CString(legitimized_bastard.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('legitimized_bastard'))|l] [legitimized_bastard.GetFirstName] je od této chvíle mým legitimním dítětem a členem rodu [actor.GetHouse.GetBaseName]. K tomuto rozhodnutí jsem dospěl po dlouhém uvažování, a přestože s ním někteří možná nebudou souhlasit, bylo správné."
 bastard_interaction.0002.a: "Čeká tě zářná budoucnost, [legitimized_bastard.GetFullNameNoTooltip]."
 bastard_interaction.0003.t: "Konec dobrý, všechno dobré"
 bastard_interaction.0003.desc: "[actor.GetTitledFirstName] k tomuto rozhodnutí [Select_CString(actor.IsFemale, 'potřebovala', 'potřeboval')] nějaký čas, ale nakonec se tak stalo. [Select_CString(secondary_recipient.IsFemale, 'Naše', 'Náš')] [secondary_recipient.Custom('DaughterSon')|l] [secondary_recipient.GetFirstName] [Select_CString(secondary_recipient.IsFemale, 'byla legitimizována', 'byl legitimizován')]. Jako [Select_CString(secondary_recipient.IsFemale, 'členka', 'člen')] rodu [actor.GetHouse.GetBaseName] má nyní zářnější budoucnost, než jsem se kdy odvážil doufat."
 bastard_interaction.0003.a: "Udělej nám radost!"
 bastard_interaction.0004.t: "Starý přízrak se vrací"
 bastard_interaction.0004.desc: "Pošetile jsem uvěřil, že [secondary_recipient.GetTitledFirstName] je problém minulosti a už se nikdy nevrátí, aby mě znovu pronásledoval. Jak jsem mohl nepředvídat, že [Select_CString(actor.IsFemale, 'má', 'můj')] [actor.Custom2('InsultAdjective', ROOT.Char)|l] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] nakonec rozhodne, že [secondary_recipient.GetTitledFirstName] [Select_CString(secondary_recipient.IsFemale, 'bude legitimizována', 'bude legitimizován')]? Myslel jsem, že už jsem vytrpěl dost..."
 bastard_interaction.0004.newborn_desc: "Nejenže [actor.GetFirstName] má [Select_CString(legitimized_bastard.IsFemale, 'levobočku', 'levobočka')], ale ještě se [Select_CString(actor.IsFemale, 'rozhodla', 'rozhodl')] [Select_CString(legitimized_bastard.IsFemale, 'ji', 'ho')] legitimizovat jako vlastní dítě!\n\n[Select_CString(legitimized_bastard.IsFemale, 'Malá', 'Malý')] [legitimized_bastard.GetTitledFirstName] mě bude pronásledovat celý život..."
 bastard_interaction.0004.a: "Na tuto zradu nezapomenu."
 bastard_interaction.0005.t: "[secondary_recipient.GetFirstNamePossessiveNoTooltip] velký den"
 bastard_interaction.0005.desc.bastard: "[Select_CString(actor.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] se [Select_CString(actor.IsFemale, 'rozhodla', 'rozhodl')], že [secondary_recipient.GetTitledFirstName], [Select_CString(secondary_recipient.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))|l], [Select_CString(secondary_recipient.IsFemale, 'bude legitimizována', 'bude legitimizován')]. Nemohu se ubránit jisté hořkosti... Dočkám se někdy stejného přijetí?"
 bastard_interaction.0005.desc.approve: "Pro [secondary_recipient.GetTitledFirstName] je to šťastný den! Konečně se [Select_CString(actor.IsFemale, 'naše', 'náš')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] [Select_CString(actor.IsFemale, 'vzpamatovala', 'vzpamatoval')] a [secondary_recipient.GetTitledFirstName] [Select_CString(secondary_recipient.IsFemale, 'byla legitimizována', 'byl legitimizován')]. Teď je skutečně součástí rodiny."
 bastard_interaction.0005.desc.disapprove: "Nemohu tomu uvěřit — [Select_CString(actor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] se [Select_CString(actor.IsFemale, 'rozhodla', 'rozhodl')] legitimizovat [secondary_recipient.GetTitledFirstName]! Postupem času jsem si na [Select_CString(secondary_recipient.IsFemale, 'její', 'jeho')] přítomnost zvykl, ale tohle už je příliš. Opravdu ode mě [Select_CString(actor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] očekává, že [Select_CString(secondary_recipient.IsFemale, 'tu bastardku', 'toho bastarda')] přivítám v rodině jako svého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))|l]?"
 bastard_interaction.0005.a.approve: "Hodně štěstí v novém životě."
 bastard_interaction.0005.a.disapprove: "[Select_CString(actor.IsFemale, 'Myslela', 'Myslel')] na mě [Select_CString(actor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))|l] vůbec?"
 every_child_adult_non_bastard_dislike: "Všechny mé dospělé děti, které nejsou levobočky a nemají levobočka v oblibě"
 every_child_adult_non_bastard_dislike_me: "Všechny [THIS.Char.GetFirstNamePossessive] dospělé děti, které nejsou levobočky a nemají mě v oblibě"
 bastard_interaction.0006.t: "[legitimized_bastard.GetFirstNameNoTooltip] [Select_CString(legitimized_bastard.IsFemale, 'legitimizována', 'legitimizován')]"
 bastard_interaction.0006.desc: "[legitimized_bastard.GetTitledFirstName] [Select_CString(legitimized_bastard.IsFemale, 'byla legitimizována', 'byl legitimizován')] hlavou [Select_CString(legitimized_bastard.IsFemale, 'jejího', 'jeho')] rodu, [actor.GetTitledFirstName]!"
 bastard_interaction.0006.a: "Konečně má rodinu."
 bastard_interaction.0007.desc: "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('parent'))|U] [Select_CString(legitimized_bastard.IsFemale, 'levobočka', 'levoboček')] [legitimized_bastard.GetTitledFirstName] [Select_CString(legitimized_bastard.IsFemale, 'byla legitimizována', 'byl legitimizován')] hlavou rodu [actor.GetTitledFirstName]."
 bastard_interaction.0007.newborn_desc: "[parent.GetTitledFirstName] [Select_CString(parent.IsFemale, 'přivedla', 'přivedl')] na svět [Select_CString(legitimized_bastard.IsFemale, 'levobočku', 'levobočka')], kterou [Select_CString(legitimized_bastard.IsFemale, 'legitimizovala', 'legitimizoval')] [actor.GetTitledFirstName], [Select_CString(legitimized_bastard.IsFemale, 'její', 'jeho')] [legitimized_bastard.Custom2('RelationToMe', SCOPE.sC('actor'))|l]."
 bastard_interaction.0007.a: "Kéž navždy zmizí z mého života."
 bastard_interaction.0008.desc: "[legitimized_bastard.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('parent'))|l] [Select_CString(legitimized_bastard.IsFemale, 'levobočka', 'levoboček')], [Select_CString(legitimized_bastard.IsFemale, 'byla legitimizována', 'byl legitimizován')] hlavou svého nového rodu!"
 bastard_interaction.0008.a: "Jako by snad někdy [Select_CString(legitimized_bastard.IsFemale, 'mohla', 'mohl')] být „legitimní“."
 bastard_interaction.0009.t: "[Select_CString(ROOT.Char.IsFemale, 'Dědička dynastie', 'Dědic dynastie')]"
 bastard_interaction.0009.desc: "[actor.GetTitledFirstName], hlava celé naší dynastie, mě [Select_CString(ROOT.Char.IsFemale, 'prohlásila za legitimní dědičku', 'prohlásil za legitimního dědice')] našeho jména!\n\nK dynastii [ROOT.Char.GetDynasty.GetBaseName] jsem [Select_CString(ROOT.Char.IsFemale, 'patřila', 'patřil')] odjakživa a nyní to musí uznat celý svět."
 bastard_interaction.0009.a: "Konečně!"
 bastard_interaction.0010.t: "[Select_CString(recipient.IsFemale, 'Další dědička dynastie', 'Další dědic dynastie')]"
 bastard_interaction.0010.desc: "[actor.GetTitledFirstName], hlava celé naší dynastie, rozhodl, že [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))] má legitimní právo nést naše jméno!\n\nNyní má na dědictví dynastie [ROOT.Char.GetDynasty.GetBaseName] stejné právo jako kterékoli manželské dítě."
 bastard_interaction.0010.a: "Další v pořadí."
 bastard_interaction.0010.a.tt: "[recipient.GetShortUIName|U] nyní může dědit"
 every_father_house_member: "[father.GetFirstNamePossessiveNoTooltip] [Concept('house','rod')|E]: všichni členové"
 every_mother_house_member: "[mother.GetFirstNamePossessiveNoTooltip] [Concept('house','rod')|E]: všichni členové"
 every_real_father_house_member: "[real_father.GetFirstNamePossessiveNoTooltip] [Concept('house','rod')|E]: všichni členové"
 every_child_house_member: "[child.GetFirstNamePossessiveNoTooltip] [Concept('house','rod')|E]: všichni členové"
