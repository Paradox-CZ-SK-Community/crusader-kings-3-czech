l_polish:
 birth.father_is_former_consort_toast: "Narození"
 birth.father_is_former_consort_toast_tt: "[mother.GetTitledFirstName] porodila dítě - [Select_CString(child.IsFemale, 'naše', 'náš')] [child.Custom('GetDaughterSon')] je na světě"
 birth.father_is_former_consort_toast_tt_twins: "[mother.GetTitledFirstName] porodila dvojčata"
 msg_grandchild_born_toast_title: "Narození vnoučete"
 msg_grandchild_born_toast_desc_twins: "[mother.GetTitledFirstName] porodila tvá vnoučata - dvojčata"
 msg_grandchild_born_toast_desc: "Narodilo se ti vnouče! [mother.GetTitledFirstName] porodila dítě: [child.Custom('GetDaughterSon')]"
 msg_royal_child_born_toast_title: "Královský potomek"
 msg_royal_child_born_toast_desc_twins: "[non_royal_parent.GetTitledFirstName] porodila dvojčata z [Concept('ceremonial_house','obřadního rodu')|E] ([child.GetHouse.GetBaseName])"
 msg_royal_child_born_toast_desc: "[non_royal_parent.GetTitledFirstName] porodila potomka [Concept('ceremonial_house','obřadního rodu')|E] ([child.GetHouse.GetBaseName]) - je to [child.Custom('GetDaughterSon')]"
 msg_royal_child_born_toast_desc_twins_father: "[non_royal_parent.GetTitledFirstName] zplodil dvojčata z [Concept('ceremonial_house','obřadního rodu')|E] ([child.GetHouse.GetBaseName])"
 msg_royal_child_born_toast_desc_father: "[non_royal_parent.GetTitledFirstName] zplodil potomka [Concept('ceremonial_house','obřadního rodu')|E] ([child.GetHouse.GetBaseName]) - je to [child.Custom('GetDaughterSon')]"
 birth.0002.t: "Všechny mé děti"
 birth.0002.desc: "S každým porodem jsou ke mně lidé srdečnější. Když držím v náručí své novorozené dítě, dostává se mi víc vřelosti a laskavosti než kdy dřív. Inu, má sbírka potomků už je skutečně působivá..."
 birth.0002.a: "Porodem zrozená laskavost!"
 birth.1001.t: "[Select_CString(child.IsFemale, 'Má', 'Můj')] [child.Custom('GetDaughterSon')|U]"
 birth.1001.heir.t: "[Select_CString(child.IsFemale, 'Má', 'Můj')] [child.Custom('GetDaughterSon')|U] a [Select_CString(child.IsFemale, 'dědička', 'dědic')]"
 birth.1001.daughters.t: "Mé dcery"
 birth.1001.sons.t: "Moji synové"
 birth.1001.children.t: "Mé děti"
 birth.1001.first_birth_good.desc: "Když přišla první kontrakce, zaplavil mě hluboký klid. Na dřívější obavy nezbylo místo - čekal mě jeden z největších zázraků života. Po dlouhém, ale nádherném zápase je konečně po všem."
 birth.1001.first_birth_scary.desc: "Mluvila jsem s nespočtem matek a porodních bab a jejich rady si vzala k srdci. Když však přišla má chvíle, pochopila jsem, že žádná příprava nemůže být dostatečná.\n\nBolest pohltila úplně všechno a bála jsem se o život. Přesto jsem to zvládla a teď je konečně po všem."
 birth.1001.many_births.desc: "S každým porodem je to o něco snazší - přesto mě nikdy nepřestává udivovat síla tohoto prožitku ani má vlastní odolnost. Znovu jsem přivedla na tento svět nový život."
 birth.1001.not_first_birth.desc: "Má úleva je veliká a radost ještě větší! Nový život je na světě."
 birth.1001.sondaughter.desc: "Je tu [child.Custom('GetDaughterSon')] - naprosto dokonalé malé děťátko!\n\n"
 birth.1001.daughters.desc: "Jsou tu dvě dokonalé holčičky!\n\n"
 birth.1001.sons.desc: "Jsou tu dva dokonalí chlapečci!\n\n"
 birth.1001.children.desc: "Jsou tu dvě dokonalé děti!\n\n"
 birth.1001.same_gender_heir.desc: "Jednoho dne, dítě, poneseš dál můj odkaz. [ROOT.Char.GetTitleAsNameNoTooltip] potřebuje jméno hodné svého postavení."
 birth.1001.other_gender_heir.desc: "Jednoho dne, dítě, poneseš dál můj odkaz. Jaké jméno se hodí pro někoho, kdo jednou bude [child.GetLadyLord]?"
 birth.1001.end_fallback.desc: "Kým se jednou staneš, mé dítě, a jak ti mám říkat?"
 birth.1001.twins_heir.desc: "Má sladká dítka. Jedno z vás vyroste a ponese dál můj odkaz, zatímco druhé bude vždy stát v jeho stínu. Doufám, že se budete milovat, ať se stane cokoli."
 birth.1001.twins.desc: "Kým se jednou stanete, má drahá dítka, a jak vám mám říkat?"
 birth.1001.taltos.desc: "Znamení [child.Custom('GetBirthOmen')], které nese můj [child.Custom('GetDaughterSon')], jasně ukazuje, že je [child.Custom('GetTaltosTerm')]. [child.GetFaith.PantheonTerm] stojí za zvláštním posláním mého dítěte. Zatím sice nevím, jaké poslání to je, ale vhodné jméno mu přesto dát musím."
 birth.1001.taltos_unfaithful.desc: "Můj [child.Custom('GetDaughterSon')] má znamení [child.Custom('GetBirthOmen')], o němž [child.GetFaith.GetAdjective] [child.Custom('DefaultPriestTitlePlural')] tvrdí, že mé dítě předurčuje k něčemu výjimečnému. Nerozumím tomu, ale stále musím rozhodnout, jak svého [child.Custom('GetDaughterSon')] pojmenovat..."
 birth.1001.desc: "[Select_CString(child.IsFemale, 'Narodila', 'Narodil')] se mi [Select_CString(child.IsFemale, 'krásná', 'krásný')] [child.Custom('GetDaughterSon')]!"
 birth.1001.desc.twin: "Porod je za mnou a na světě jsou [child.Custom('TwinDaughtersSonsChildren')]! Je na ně nádherný pohled!"
 birth.1001.desc.twin_dead_father: "Porod je za mnou a na světě jsou [child.Custom('TwinDaughtersSonsChildren')]! Je na ně nádherný pohled! [father.GetFirstName] by je zbožňoval..."
 birth.1001.desc_dead_father: "[Select_CString(child.IsFemale, 'Narodila', 'Narodil')] se mi [Select_CString(child.IsFemale, 'krásná', 'krásný')] [child.Custom('GetDaughterSon')]! [father.GetFirstName] by [Select_CString(child.IsFemale, 'ji', 'ho')] zbožňoval..."
 birth.1001.a: "Ať z tebe vyroste [Select_CString(child.IsFemale, 'silná a moudrá', 'silný a moudrý')] [child.Custom('GetDaughterSon')]."
 birth.1001.b: "Ať [child.Custom('TwinDaughtersSonsChildren')|l] rostou do síly a moudrosti."
 birth.1002.opening: "Porodila jsem [Select_CString(child.IsFemale, 'krásnou malou', 'krásného malého')] [child.Custom('GetDaughterSon')]. Mé dítě přichází na svět v blažené nevědomosti o tajemství, které musím střežit."
 birth.1002.opening.twin: "Porodila jsem [child.Custom('TwinDaughtersSonsChildren')] - dvě nádherná děťátka. Přicházejí na svět v blažené nevědomosti o tajemství, které musím střežit."
 birth.1002.true_father: "Děsí mě, co by se stalo, kdyby někdo zjistil, že [real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] je skutečným otcem."
 birth.1002.unmarried: "[Select_CString(child.IsFemale, 'že otcem mé dcery je ve skutečnosti', 'že otcem mého syna je ve skutečnosti')] [real_father.GetFullName]."
 birth.1002.unmarried.twin: "že jejich otcem je ve skutečnosti [real_father.GetFullName]."
 birth.1002.girl_name.desc: "\n\nAch, moje děťátko, jaké jméno ti mám dát?"
 birth.1002.boy_name.desc: "\n\nČást mého srdce by synovi nejraději dala jméno [real_father.GetFirstNameNoTooltip], ale obávám se, že by to nebylo moudré..."
 birth.1002.twin_name.desc: "\n\nAch, moje děti, jaká jména vám mám dát?"
 birth.1002.a: "Pššt, už klid. [child.Custom('GetDaughterSon')] spinká."
 birth.1002.b: "Pššt, už klid. [child.Custom('TwinDaughtersSonsChildren')] spinkají."
 birth.1002.a.tt: "Svět stále netuší pravdu o skutečném původu [child.GetFirstNamePossessiveNoTooltip]"
 birth.1002.b.tt: "Svět stále netuší pravdu o jejich skutečném původu."
 birth.1002.c: "Kde asi právě je [real_father.GetFirstNameNoTooltip]..."
 birth.1003.loves_mother.desc: "Ach, [mother.GetFirstName], byla jsi tak statečná! Tak silná! Slova nedokážou popsat, jak moc tě miluji, a teď máme"
 birth.1003.likes_mother.desc: "[mother.GetFirstName] se na mě unaveně, ale blaženě usměje a ukáže mi"
 birth.1003.dislikes_mother.desc: "[ROOT.Char.GetFaith.FertilityGodName] je při nás! [mother.GetFirstNameNoTooltip] porodila"
 birth.1003.sondaughter.desc: "[Select_CString(child.IsFemale, 'dokonalou malou', 'dokonalého malého')] [child.Custom('GetDaughterSon')]!\n\n"
 birth.1003.daughters.desc: "dvě dokonalé holčičky!\n\n"
 birth.1003.sons.desc: "dva dokonalé chlapečky!\n\n"
 birth.1003.children.desc: "dvě dokonalá děťátka!\n\n"
 birth.1003.a: "Ať z tebe vyroste [Select_CString(child.IsFemale, 'silná a moudrá', 'silný a moudrý')] [child.Custom('GetDaughterSon')]."
 birth.1003.b: "Ať vyrostete silní a moudří!"
 birth.1005.t: "Bez otce"
 birth.1005.desc.twin: "Mé krásné děti odpočívají, aniž by tušily, do jak těžkého života se narodily. Svět neví, kdo je jejich otcem, a ony samy se to možná nikdy nedozvědí."
 birth.1005.desc: "[Select_CString(child.IsFemale, 'Má krásná', 'Můj krásný')] [child.Custom('GetDaughterSon')] odpočívá, aniž by tušil, do jak těžkého života se narodil. Svět neví, kdo je otcem mého dítěte, a možná se to nikdy nedozví ani ono samo."
 birth.1005.a: "Je to břemeno, které musíme nést."
 birth.1006.t: "Narození levobočka"
 birth.1006.opening: "Už nemám ani nejmenší pochybnosti. [mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] porodila"
 birth.1006.desc.twin: "dvojčata a oba víme, že jejich otcem jsem já."
 birth.1006.desc: "dítě - [child.Custom('GetDaughterSon')] - a oba víme, že jsem jeho otcem."
 birth.1006.not_known: "\n\nNaštěstí [spouse_of_mother.Custom2('HerHisCharacterIntroduction', SCOPE.sC('mother'))] věří, že dítě je [Select_CString(spouse_of_mother.IsFemale, 'její', 'jeho')]."
 birth.1006.unmarried: "\n\nNaštěstí o mně [mother.GetFirstNameNoTooltip] mlčela a nikdo jiný zatím pravdu nezná..."
 birth.1006.a: "Musím si dávat velký pozor."
 birth.1006.a.tt: "Tajemství si necháš pro sebe"
 birth.1006.a.message_desc: "Skutečný otec zná pravdu"
 birth.1006.a.mother_message: "[real_father.GetTitledFirstName] zjistil, že je skutečným otcem"
 birth.1006.b: "Svět se o mém dítěti dozví!"
 birth.1006.bastard_explanation: "Dozvěděl ses, že se narodilo dítě jménem [child.GetFirstName]. Matka [mother.GetShortUIName] získává tajemství [secret.GetName]"
 birth.1010.t: "Dítě mé krve"
 birth.1010.t_twins: "Děti mé krve"
 birth.1010.desc.twin: "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] porodila dvojčata - [child.Custom('TwinDaughtersSonsChildren')]!\n\nObě děti náleží k dynastii, jejíž jméno zní [ROOT.Char.GetDynasty.GetName], a proto by měly dostat jména hodná svého původu."
 birth.1010.desc: "[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] porodila dítě - [child.Custom('GetDaughterSon')]!\n\nDítě náleží k dynastii, jejíž jméno zní [ROOT.Char.GetDynasty.GetName], a proto by mělo dostat jméno hodné svého původu."
 birth.1100.title: "[child.Custom('GetTaltosTerm')] je na světě"
 birth.1100.message: "[child.Custom('DefaultPriestTitlePlural')] tvrdí, že [child.Custom2('MyCharacterIntroduction', ROOT.Char)] je [child.Custom('GetTaltosTerm')].\n\nToto dítě bylo vybráno k tajemnému poslání - [child.GetFaith.PantheonTerm] za tím zjevně stojí. Co mu budoucnost přinese?"
 known_bastard_birth_event_tooltip: "[child.GetFirstNameNoTooltip] bude [Concept('bastard','levobočkem')|E]. Rod dítěte ponese jméno [child.GetHouse.GetBaseName]"
 legitimized_known_bastard_birth_event_tooltip: "[child.GetFirstNameNoTooltip] bude [Concept('legitimized_bastard','legitimizovaným levobočkem')|E]. Rod dítěte ponese jméno [child.GetHouse.GetBaseName]"
 birth.2001.t: "Požehnání nevědomosti"
 birth.2001.desc.mother.standard: "[Select_CString(child.IsFemale, 'Má novorozená', 'Můj novorozený')] [child.Custom('GetDaughterSon')|l] tak sladce spí a v blažené nevědomosti netuší o kletbě, která [Select_CString(child.IsFemale, 'ji', 'ho')] bude provázet po zbytek života. Život levobočka není v tomto světě snadný a stejně těžký je i úděl jeho matky.\n\nMé děťátko pokojně dřímá, ale mě drží vzhůru rozhodnutí, které musím učinit."
 birth.2001.desc.mother.twins: "Má novorozeňata tak sladce spí a v blažené nevědomosti netuší o kletbě, která je bude provázet po celý život. Život levobočků není v tomto světě snadný a stejně těžký je i úděl jejich matky.\n\nMá děťátka pokojně dřímají, ale mě drží vzhůru rozhodnutí, které musím učinit."
 birth.2001.desc.father.standard: "Mimo manželství [mother.GetTitledFirstName] porodila [Select_CString(child.IsFemale, 'naši', 'našeho')] [child.Custom('GetDaughterSon')|l]. Měl bych se radovat, ale mé srdce tíží pochybnosti a strach.\n\nA tak tomu bude, dokud se nerozhodnu."
 birth.2001.desc.father.twins: "Mimo manželství [mother.GetTitledFirstName] porodila naše děti. Měl bych se radovat, ale mé srdce tíží pochybnosti a strach.\n\nA tak tomu bude, dokud se nerozhodnu."
 birth.2001.a.standard: "Legitimizuji [Select_CString(child.IsFemale, 'ji', 'ho')] jako své vlastní dítě!"
 birth.2001.a.twins: "Legitimizuji je jako své vlastní děti!"
 birth.2001.b.standard: "Nemohu zneuctít svou rodinu legitimizací levobočka..."
 birth.2001.b.no_legitimization_in_faith: "Takový je úděl levobočka..."
 bastard_remains_bastard_tt: "[child.GetShortUIName|U] zůstává nelegitimizovaným [Concept('bastard','levobočkem')|E]"
 birth.2002.t: "Dvojí požehnání"
 birth.2002.start: "Tohle je vskutku den hodný oslav!"
 birth.2002.desc.standard: "Nejenže mi byl dopřán [Select_CString(child.IsFemale, 'novorozená', 'novorozený')] [child.Custom('GetDaughterSon')|l] - [legitimizer.GetMotherFather] dítěte, [legitimizer.GetTitledFirstName], se [Select_CString(legitimizer.IsFemale, 'rozhodla', 'rozhodl')] dítě legitimizovat!"
 birth.2002.desc.twins: "Nejenže mi byla dopřána novorozená dvojčata - jejich [legitimizer.GetMotherFather], [legitimizer.GetTitledFirstName], se [Select_CString(legitimizer.IsFemale, 'rozhodla', 'rozhodl')] je legitimizovat!"
 birth.2002.end: "\n\nPoslední měsíce byly plné pochybností a strachu, ale dnes je mé srdce lehké jako pírko."
 birth.2002.a: "Budoucnost přece jen skýtá naději."
 birth.2003.t: "Těžký začátek"
 birth.2003.desc.standard_start: "Chci se radovat z narození [Select_CString(child.IsFemale, 'naší', 'našeho')] [child.Custom('GetDaughterSon')|l], ale [legitimizer.GetTitledFirstName] [Select_CString(legitimizer.IsFemale, 'dala', 'dal')] jasně najevo, že dítě nebude považováno za skutečného člena [Select_CString(legitimizer.IsFemale, 'jejího', 'jeho')] rodu."
 birth.2003.desc.twin_start: "Chci se radovat z narození našich dětí, ale [legitimizer.GetTitledFirstName] [Select_CString(legitimizer.IsFemale, 'dala', 'dal')] jasně najevo, že děti nebudou považovány za skutečné členy [Select_CString(legitimizer.IsFemale, 'jejího', 'jeho')] rodu."
 birth.2003.desc.landed_end: "\n\nPoskvrna levobočství nikdy úplně nezmizí. Kdyby však dítě uznal někdo jako [legitimizer.GetTitleTierName], jistě by to pomohlo..."
 birth.2003.desc.unlanded_end: "\n\nPoskvrna levobočství nikdy úplně nezmizí. Kdyby však dítě uznal někdo jako [legitimizer.GetLadyLord], jistě by to pomohlo..."
 birth.2003.a: "Kéž by tomu bylo jinak, [child.GetFirstNameNoTooltip]!"
 birth.2004.t: "[Select_CString(secondary_legitimizer.IsFemale, 'Matčino', 'Otcovo')] milosrdenství"
 birth.2004.desc.standard: "Jak se ukazuje, mé novorozené dítě - [child.Custom('GetDaughterSon')|l] - možná přece jen čeká dobrá budoucnost. A [secondary_legitimizer.GetMotherFather] dítěte, [secondary_legitimizer.GetTitledFirstName], [Select_CString(secondary_legitimizer.IsFemale, 'přijala', 'přijal')] dítě do rodu [secondary_legitimizer.GetDynastyName]."
 birth.2004.desc.twins: "Jak se ukazuje, má novorozeňata možná přece jen čeká dobrá budoucnost. Jejich [secondary_legitimizer.GetMotherFather], [secondary_legitimizer.GetTitledFirstName], je [Select_CString(secondary_legitimizer.IsFemale, 'přijala', 'přijal')] do rodu [secondary_legitimizer.GetDynastyName]."
 birth.2004.a.standard: "Buď jim k chloubě, [child.Custom('GetDaughterSon')|l]."
 birth.2004.a.twins: "Buďte jim k chloubě, mé děti."
 birth.2011.t: "[Select_CString(child.IsFemale, 'Má', 'Můj')] [child.Custom('GetDaughterSon')|l]"
 birth.2011.desc: "Ačkoli bylo počato mimo svazek manželský, mé novorozené dítě - [child.Custom('GetDaughterSon')|l] - šťastně přišlo na svět.\n\nNarodilo se do rodu [legitimizer.GetHouse.GetBaseName] a právě v něm bude vyrůstat."
 birth.2102.t: "[real_father.GetTitledFirstNamePossessiveNoTooltip|U] sémě"
 birth.2102.desc: "Má [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))|l], [mother.GetTitledFirstName], porodila dítě, které zplodil jiný muž. Teď [mother.GetFirstName] kojí [real_father.GetTitledFirstNamePossessive] [child.Custom('GetDaughterSon')|l]. Říkají [Select_CString(child.IsFemale, 'jí', 'mu')] [child.GetFirstName]."
 birth.2102.desc.twin: "Má [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))|l], [mother.GetTitledFirstName], porodila [real_father.GetTitledFirstNamePossessive] [child.Custom('TwinDaughtersSonsChildren')|l]. Říkají jim [child.GetFirstName] a [child_2.GetFirstName]."
 birth.2102.a: "Co si s tím mám počít?"
 birth.2104.t: "Podivné dítě"
 birth.2104.desc: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))|l], [real_father.GetTitledFirstName], zplodil s [mother.GetTitledFirstName] dítě. Teď [mother.GetFirstName] kojí jeho potomka - dítě, jehož otcem je můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))|l]."
 birth.2104.desc.twin: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))|l], [real_father.GetTitledFirstName], zplodil s [mother.GetTitledFirstName] děti. Teď [mother.GetFirstName] kojí jeho potomky - děti, jejichž otcem je můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))|l]."
 birth.2104.a: "Co si s tím mám počít?"
 every_child_adult_non_bastard: "Všechny mé dospělé děti, které nejsou levobočky"
 birth.3001.t: "V náručí smrti"
 birth.3001.desc_other_child: "„Ještě jednou zatlačte, [ROOT.Char.Custom('FormOfAddressForLiege')|l]! Dítě už je skoro venku!“ Unikne mi výkřik, když naposledy zatlačím. Bolest je všude, příliš silná, nesnesitelná - a pak je konec. Já... zvládla jsem to.\n\n„Je dítě v pořádku?“ Vlastní hlas sotva poznávám. „Je to... Je to [dummy_gender.Custom('GirlBoy')|l]?“\n\nPorodní bába mi neodpovídá, ani se na mě nepodívá. Ne, hledí jen na nehybné děťátko ve svém náručí."
 birth.3001.a: "Proč... proč moje dítě nedýchá?! #EMP Udělejte něco!#!"
 birth.3001.a.tt: "@death_icon! [Select_CString(dummy_gender.IsFemale, 'Tvá', 'Tvůj')] [dummy_gender.Custom('DaughterSon')|l] se [Select_CString(dummy_gender.IsFemale, 'narodila mrtvá', 'narodil mrtvý')]"
 birth.3002.desc: "Když [ROOT.Char.Custom('GetDoor')|l] konečně povolí a porodní bába vyjde ven, [ROOT.Char.Custom('GetChamber')|l] zůstává za ní. Namísto usmívajících se porodních bab a dětského pláče mě však vítá srdcervoucí nářek [mother.GetTitledFirstNamePossessive].\n\n„Je mi to tak líto, [ROOT.Char.Custom('FormOfAddressForLiege')|l].“ Porodní bába se mi nedokáže podívat do očí. V náručí drží drobný zakrytý uzlíček. „[Select_CString(dummy_gender.IsFemale, 'Tvá', 'Tvůj')] [dummy_gender.Custom('DaughterSon')|l]... teď už je v [ROOT.Char.GetFaith.PositiveAfterLife].“"
 birth.3002.a: "[Select_CString(dummy_gender.IsFemale, 'Má', 'Můj')] [dummy_gender.Custom('DaughterSon')|l]? V... v [ROOT.Char.GetFaith.PositiveAfterLife]?"
 birth.3011.desc_twin: "Dvojčata jsou dokonalá. Jejich drobné tvářičky, jejich vůně... V téhle chvíli bych chtěla zůstat navždy, ale porodní bába mi dovolí držet je jen několik nádechů. Když mi je bere z náručí, snažím se protestovat, ale ruce mám slabé a slova se mi hledají těžko.\n\n„Neměj obavy, [ROOT.Char.GetTitleAsNameNoTooltip]. Tvé [child.Custom('TwinDaughtersSonsChildren')|l] jsou silné a zdravé. Teď se musíme starat o tebe.“\n\n"
 birth.3011.desc: "[Select_CString(child.IsFemale, 'Má', 'Můj')] [child.Custom('DaughterSon')|l] je [Select_CString(child.IsFemale, 'dokonalá', 'dokonalý')]. [Select_CString(child.IsFemale, 'Její', 'Jeho')] drobná tvářička, ta vůně... V téhle chvíli bych chtěla zůstat navždy, ale porodní bába mi dovolí držet své dítě jen několik nádechů. Když mi je bere z náručí, snažím se protestovat, ale ruce mám slabé a slova se mi hledají těžko.\n\n„Neměj obavy, [ROOT.Char.GetTitleAsNameNoTooltip]. [Select_CString(child.IsFemale, 'Tvá', 'Tvůj')] [child.Custom('DaughterSon')|l] je [Select_CString(child.IsFemale, 'silná a zdravá', 'silný a zdravý')]. Teď se musíme starat o tebe.“\n\n"
 birth.3011.adventurer: "Klesám zpět na lůžko a svět kolem mě tmavne..."
 birth.3011.landed: "Zatímco mé služebné horečně pobíhají sem a tam, svět kolem mě tmavne..."
 birth.3011.twin.a: "Prosím... Jejich jména..."
 birth.3011.a: "Prosím... [Select_CString(child.IsFemale, 'její', 'jeho')] jméno..."
 birth.3012.start.desc: "Když porodní bába konečně vyjde s tiše plačícím uzlíčkem v náručí, [ROOT.Char.Custom('GetChamber')|l] zůstává za jejími zády a mě zaplaví úleva.\n\nPak spatřím její výraz.\n\n„Je mi to líto, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. [mother.GetLadyLord|U] [mother.GetFirstNameNoTooltip]...“ Nedokáže větu dokončit, ale tón jejího hlasu říká vše.\n\nJeden život vyhasl, ale"
 birth.3012.desc_twin: "dva nové životy právě začaly. Musím zůstat silný. [child.Custom('TwinDaughtersSonsChildren')|U] mě teď potřebují."
 birth.3012.desc: "jeden nový právě začal. Musím zůstat silný. [child.Custom('DaughterSon')|U] mě teď potřebuje."
 birth.3012.a: "Tak tragický vstup do života..."
 birth.3021.desc: "Můj namáhavý dech je jediným zvukem, který protíná ticho. [ROOT.Char.Custom('GetChamber')|U] se noří do mlčení. Rozhlížím se kolem; [ROOT.Char.Custom('GetRoom')|l] mi nenabízí jediný povzbudivý úsměv, nic, co by mě přeneslo přes bolest. Vidím jen vlastní strach odrážející se v tvářích ostatních.\n\nKdyž dítě konečně přijde na svět, vytoužený pláč se neozve. „Proč to dítě nepláče?“ Slova mi těžknou na jazyku. Všechno je náhle těžké.\n\nPřinutím rty, aby ta slova vyslovily znovu."
 birth.3021.a: "Proč... to... dítě..."
 birth.3022.desc: "Zatímco čekám před porodní [ROOT.Char.Custom('GetChamber')|l], každá minuta mi připadá jako věčnost. Křik [mother.GetFirstNamePossessive] ustal, ale nenahradil ho pláč novorozeněte. Něco je špatně, cítím to až v kostech.\n\n[ROOT.Char.Custom('GetDoor')|U] se otevřou. Zmučený výraz porodní báby potvrdí všechny mé obavy.\n\n„Je mi to nesmírně líto, [ROOT.Char.Custom('FormOfAddressForLiege')|l]. [mother.GetLadyLord|U] [mother.GetFirstNameNoTooltip]... [Select_CString(dummy_gender.IsFemale, 'Tvá', 'Tvůj')] [dummy_gender.Custom('DaughterSon')|l]... [Select_CString(dummy_gender.IsFemale, 'Obě jsou', 'Oba jsou')] nyní v [ROOT.Char.GetFaith.PositiveAfterLife].“"
 birth.3022.a: "Proč?! Za tohle může [ROOT.Char.GetFaith.FertilityGodName|U]? Čím jsem si to [Select_CString(ROOT.Char.IsFemale, 'zasloužila', 'zasloužil')]?"
 birth.3022.a.buddhism: "Čím jsme si to zasloužili?!"
 birth.3031.t: "V náručí nemoci"
 birth.3031.start.desc: "Všechny děti pláčou, ale u [child.GetFirstName] slzy neberou konce. Zoufale doufám, že porodní bába mé obavy rozptýlí, jenže její svraštělé čelo všechno ještě zhoršuje.\n\n"
 birth.3031.princessprince.desc: "„[Select_CString(child.IsFemale, 'Malá', 'Malý')] [child.GetLadyLord|l]"
 birth.3031.daughterson.desc: "„[Select_CString(child.IsFemale, 'Vaše', 'Váš')] [child.Custom('DaughterSon')|l]"
 birth.3031.end.desc: "nepřibírá na váze tak, jak by [Select_CString(child.IsFemale, 'měla', 'měl')]. Budeme se o [Select_CString(child.IsFemale, 'ni', 'něj')] dobře starat, [ROOT.Char.Custom('FormOfAddressForLiege')|l], ale nakonec je [Select_CString(child.IsFemale, 'její', 'jeho')] život v rukou [ROOT.Char.GetFaith.FateGodNamePossessive].“"
 birth.3031.a: "Pššt, [child.GetFirstNameNoTooltip]! Prosím, neplač!"
 birth.3034.t: "Síla roste"
 birth.3034.desc: "Většina ostatních dětí je silnější než já. Když si hrajeme, musím si často sednout a odpočinout. Ale dnes jsme závodili ke stájím a vyhrál jsem!"
 birth.3034.a: "Kde je [ROOT.Char.Custom('child_favorite_toy')|l]? Pojďme si hrát!"
 birth.3035.desc: "Slabost, která mé dítě sužovala od narození, konečně povolila! [child.Custom('GetDaughterSon')|U] už nad ní zvítězil. Zaplaví mě úleva, když vidím [child.GetFirstName] pobíhat s ostatními dětmi."
 birth.3035.a: "Ať rosteš do síly, [child.GetFirstNameNoTooltip]."
 birth.3041.t: "Vyčerpaná"
 birth.3041.start.desc: "Od porodu už uplynulo několik týdnů."
 birth.3041.desc_twins: "[child.Custom('TwinDaughtersSonsChildren')|U] jsou na světě,"
 birth.3041.one_child.desc: "[child.GetFirstNameNoTooltip] je na světě,"
 birth.3041.end: "ale já jsem stále upoutaná na lůžko. Dny plynou bez výraznějšího zlepšení a mou radost postupně pohlcuje strašlivá únava."
 birth.3041.a: "Neměla by se mi už vracet síla?"
 birth.9002.t: "Co se skrývá ve jménu?"
 birth.9002.start.desc: "[suggester.GetTitledFirstName] drží dítě v náručí."
 birth.9002.worrying.desc: "Vzhlédne ke mně se znepokojivým leskem v očích."
 birth.9002.tears.desc: "Otře si slzy z tváří a promluví ke mně, přitom ani na okamžik nespustí oči z našeho dítěte."
 birth.9002.pride.desc: "Vzhlédne ke mně s hlavou hrdě vztyčenou a očima zářícíma pýchou."
 birth.9002.conviction.desc: "Vzhlédne ke mně s očima planoucíma neochvějným přesvědčením."
 birth.9002.surprisingly_calm.desc: "Vzhlédne ke mně s překvapivě klidnou tváří."
 birth.9002.calm.desc: "Vzhlédne ke mně s naprosto klidnou tváří."
 birth.9002.devotion.desc: "Střetneme se pohledem. V očích září láskyplná oddanost."
 newline.desc: "\n\n"
 birth.9002.love.desc: "„Lásko,"
 birth.9002.dear_spouse.desc: "„[Select_CString(ROOT.Char.IsFemale, 'Má nejdražší manželko', 'Můj nejdražší manželi')],"
 birth.9002.spouse.desc: "„[Select_CString(ROOT.Char.IsFemale, 'Manželko', 'Manželi')],"
 birth.9002.suggester_relative.desc: "co kdybychom dítě pojmenovali [namesake.GetFirstNameNoTooltip]? [namesake.Custom('ComplimentAdjective')|U] [suggester.Custom2('RelationToMeShort', SCOPE.sC('namesake'))] - právě na [Select_CString(namesake.IsFemale, 'její', 'jeho')] počest?“"
 birth.9002.namer_relative.desc: "možná bychom měli dítě pojmenovat [namesake.GetFirstNameNoTooltip]? [namesake.Custom('ComplimentAdjective')|U] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('namesake'))] - na [Select_CString(namesake.IsFemale, 'její', 'jeho')] počest?“"
 birth.9002.suggesters_name.desc: "myslím, že bychom dítě měli pojmenovat [suggester.GetFirstNameNoTooltip], po mně. Co říkáš?“"
 birth.9002.namers_name.desc: "dejme dítěti jméno [ROOT.Char.GetFirstNameNoTooltip], po tobě.“"
 birth.9002.nice_name.desc: "přemýšlím o tom už nějakou dobu. Chci, aby se naše dítě jmenovalo [namesake.GetFirstNameNoTooltip]. To jméno se mi vždycky líbilo.“"
 birth.9002.religious_god.desc: "měli bychom dítě pojmenovat [SCOPE.GetFlagName('name_suggestion')] na počest velkého boha!“"
 birth.9002.religious_godess.desc: "měli bychom dítě pojmenovat [SCOPE.GetFlagName('name_suggestion')] na počest velké bohyně!“"
 birth.9002.religious_apostle.desc: "měli bychom dítě pojmenovat [SCOPE.GetFlagName('name_suggestion')] na počest zbožného apoštola.“"
 birth.9002.religious_holy_virgin.desc: "měli bychom dítě pojmenovat [SCOPE.GetFlagName('name_suggestion')] na počest svaté panny.“"
 birth.9002.religious_fallback.desc: "měli bychom dítěti dát jméno [SCOPE.GetFlagName('name_suggestion')] na počest slavné osobnosti, která toto jméno nosila!“"
 birth.9002.lunatic.desc: "mám ten nejlepší nápad! Pojmenujme dítě [SCOPE.GetFlagName('name_suggestion')]! Copak nevypadá jako [Select_CString(child.IsFemale, 'malá', 'malý')] [SCOPE.GetFlagName('name_suggestion')]?“"
 birth.9002.creator.desc: "pojmenujme naše dítě [SCOPE.GetFlagName('name_suggestion')] na počest našeho Stvořitele!“"
 birth.9002.possessed.desc: "cítím [Select_CString(child.IsFemale, 'její', 'jeho')] přítomnost. Žádá, aby naše dítě dostalo jméno [SCOPE.GetFlagName('name_suggestion')].“"
 birth.9002.a1: "Krásný nápad. Bude to [namesake.GetFirstNameNoTooltip]."
 birth.9002.a2: "Krásný nápad. Bude to [SCOPE.GetFlagName('name_suggestion')]."
 birth.9002.a.tt.1: "Naše dítě pojmenujeme [namesake.GetFirstNameNoTooltip]"
 birth.9002.a.tt.2: "Naše dítě pojmenujeme [SCOPE.GetFlagName('name_suggestion')]"
 birth.9002.a.rename: "[SCOPE.GetFlagName('name_suggestion')]"
 birth.9002.b1: "Vlastně mám na mysli něco jiného..."
 birth.9002.b2: "Cože?! To je příšerný nápad!"
 birth.9002.b.tt: "Dáš dítěti vhodnější jméno"
 birth.9003.desc: "Jemně vezmu dítě z náručí [suggester.GetTitledFirstNamePossessive] a zadívám se do [Select_CString(child.IsFemale, 'jejích', 'jeho')] dokonalých malých očí. Kým se jednou staneš?"
 birth.9003.a: "Mnohem lepší."
 birth.9004.t: "Co se skrývá ve jménu?"
 birth.9004.desc.me: "[ROOT.Char.GetFirstNameNoTooltip].\n\nTakové fádní jméno, říkám si někdy a přemýšlím, jak asi bude znít budoucím historikům.\n\nJsem přece [ROOT.Char.GetTitleAsNameNoTooltip], a pokud si přeji, aby mi říkali jinak, stačí to snad světu oznámit?"
 birth.9004.desc: "[child.GetFirstNameNoTooltip].\n\nZpočátku se mi to jméno líbilo, ale teď mi zní podivně. Co si o svém jménu pomyslí [child.GetFirstNameNoTooltip], až vyroste?\n\nMožná bych ho měl změnit na nějaké lepší?"
 birth.9004.a: "Ach, to je #EMP mnohem#! lepší jméno!"
 birth.9004.b: "Když o tom tak přemýšlím, [ROOT.Char.GetFirstNameNoTooltip] je vlastně docela dobré..."
 birth.9004.b.other: "Nakonec je vlastně [child.GetFirstNameNoTooltip] docela dobré jméno..."
 birth.9004.b.tt: "Ponecháš si své staré jméno"
 birth.9004.b.tt.other: "[child.GetFirstNameNoTooltip] si ponechá své staré jméno"
