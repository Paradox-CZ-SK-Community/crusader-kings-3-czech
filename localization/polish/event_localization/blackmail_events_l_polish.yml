l_polish:
 blackmail.0001.t: "Vydírání odmítnuto!"
 blackmail.0001.desc: "Ať už za tím stojí pomýlená hrdost, nebo strach z ještě horších následků, [recipient.GetTitledFirstName] tvrdí, že nad [Select_CString(recipient.IsFemale, 'ní', 'ním')] nemám žádnou moc!"
 blackmail.0001.a: "Výhrůžka už padla a teď může přijít jen jediný výsledek..."
 blackmail.0001.b: "Nerad to přiznávám, ale toto tajemství odhalit nemohu."
 blackmail.1001.t: "Strach z neznáma"
 blackmail.1001.desc: "Moji vazalové o mém vydírání nic nevědí, ale všimli si, jak se v mé přítomnosti chová má oběť [blackmail_target.GetTitledFirstName]. Viděli ten záblesk strachu v [Select_CString(blackmail_target.IsFemale, 'jejích', 'jeho')] očích..."
 blackmail.1001.a: "Měli by se mě bát #EMP všichni#!..."
 blackmail.1001.b: "„Ujišťuji vás, že se neděje nic nekalého!“"
 blackmail.1002.t: "Hrozící stín"
 blackmail.1002.desc: "Hrozba odhalení mi neustále leží v hlavě. [blackmailer.GetTitledFirstName] toho o mně ví příliš mnoho a následky odmítnutí jakéhokoli požadavku jsou příliš hrozivé, než abych na ně vůbec chtěl pomyslet.\n\nAle budu v bezpečí, i když poslechnu?"
 blackmail.1002.a: "V noci kvůli obavám nemohu spát."
 blackmail.1002.b: "Všechno bude v pořádku. [blackmailer.GetFirstNameNoTooltip] mi to [Select_CString(blackmailer.IsFemale, 'slíbila', 'slíbil')]!"
 