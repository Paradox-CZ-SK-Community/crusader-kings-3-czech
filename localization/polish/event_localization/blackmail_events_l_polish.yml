l_polish:
 blackmail.0001.t: "Vydírání odmítnuto!"
 blackmail.0001.desc: "Ať už to je mylný pocit pýchy, nebo strach z nějaké větší odplaty, [recipient.GetTitledFirstName] tvrdí, že nemám žádný vliv na [recipient.GetHerHim]!"
 blackmail.0001.a: "Byla vyslovena hrozba a může být jen jedno vyústění..."
 blackmail.0001.b: "Nerad to přiznávám, ale nemohu toto tajemství prozradit."
 blackmail.1001.t: "Strach z neznáma"
 blackmail.1001.desc: "Moji vazalové nic neví o mém vydírání, ale všimli si, jak se má oběť, [blackmail_target.GetTitledFirstName], chová v mé přítomnosti. Viděli strach, který se mihne v [blackmail_target.GetHerHis] očích..."
 blackmail.1001.a: "Měli by se #EMP všichni#! bát mě..."
 blackmail.1001.b: ""Ujišťuji vás všechny, že se nic nevhodného neděje!""
 blackmail.1002.t: "Číhající stín"
 blackmail.1002.desc: "Hrozba odhalení je neustále v mé mysli. [blackmailer.GetTitledFirstName] ví o mně příliš mnoho a následky odmítnutí kteréhokoli z [blackmailer.GetHerHis] požadavků jsou příliš vážné, než abych o nich jen pomyslel.\n\nJsem v bezpečí, i kdybych to udělal?"
 blackmail.1002.a: "Kvůli starostem v noci nespím."
 blackmail.1002.b: "Všechno bude v pořádku, [blackmailer.GetFirstNameNoTooltip] mi to řekl!"
