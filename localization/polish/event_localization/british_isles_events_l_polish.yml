l_polish:
 british_isles.0001.t: "[reclaimer.GetCulture.GetNameNoTooltip|U] Británie"
 british_isles.0001.desc: "Příliš dlouho byl náš velký ostrov pod cizí nadvládou. Konečně se vrátil do keltských rukou! Hledím přes pole a připadá mi, jako by slunce poprvé po letech znovu zazářilo. Jako by se před námi znovu otevřel Tír na nÓg, země hojnosti a zdraví, a vítal nás doma. [ROOT.Char.GetCulture] kultura znovu zapouští kořeny v kopcích a údolích našich předků."
 british_isles.0001.custom: "Všechna [Concept('counties','hrabství')|E] v Británii"
 british_isles.0001.a: "Chvála našim předkům!"
 british_isles.0002.desc: "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('reclaimer'))] [reclaimer.GetName] oficiálně ohlašuje znovuzrození keltské Británie.\n\nPo staletích cizí nadvlády se Britské ostrovy znovu ocitly v rukou svých původních obyvatel."
 british_isles.0002.a: "[reclaimer.GetCulture.GetNameNoTooltip] pohroma těchto zemí..."
 british_isles.0002.b: "Británie je opět naše!"
 british_isles.1001.t: "Zákony obnoveny"
 british_isles.1001.desc: "Mým přičiněním Danelaw znovu povstal a [restorer.GetCulture.GetName] kultura zde bude opět určovat zákony!\n\nKráčím ve stopách legend, jako byli Guðrum a Erik Krvavá sekera, dávní hrdinové. [restorer.GetFaith.WarGodName] je mi svědkem, že už nikdy nedovolím, aby toto království znovu padlo do rukou Anglosasů!"
 british_isles.1001.a: "Svítá nový věk!"
 british_isles.1002.t: "Danelaw"
 british_isles.1002.desc_same_culture: "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('restorer'))] [restorer.GetName] [Select_CString(restorer.IsFemale, 'obnovila', 'obnovil')] Danelaw! Velkému ostrovu opět vládne [restorer.GetCulture.GetName] kultura."
 british_isles.1002.desc: "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('restorer'))] [restorer.GetName] se svými odpornými nájezdníky [Select_CString(restorer.IsFemale, 'vybojovala', 'vybojoval')] na ostrovech nové panství a [Select_CString(restorer.IsFemale, 'prohlásila', 'prohlásil')] je za znovuzrozené království Danelaw.\n\nTeprve se ukáže, zda v Anglii znovu převládne [restorer.GetCulture.GetName] kultura a zda tento pokus dopadne lépe než ten minulý..."
 british_isles.1002.a: "[restorer.GetCulture.GetNameNoTooltip] pohroma této země."
 british_isles.1002.b: "Ať žijí [restorer.GetCulture.GetCollectiveNounNoTooltip]!"
 british_isles.1002.c: "Hm, [restorer.GetCulture.GetNameNoTooltip] kultura, říkáš? Jdu do toho!"
 british_isles.2001.t: "[embracer_former_culture.GetNameNoTooltip|U] kultura je minulostí"
 british_isles.2001.desc: "Doba, kdy jsme [embracer.GetCulture.GetCollectiveNounNoTooltip] považovali Francii za svou vlast, je dávno pryč. Naše děti se rodí zde mezi Sasy a Normandie pro ně navždy zůstane jen rozmazanou čárou za mlhavými břehy Británie.\n\nStejně jako přijímáme některé místní zvyky za své, šíří se i odkaz naší kultury saskými zeměmi a dává vzniknout nové anglické identitě."
 british_isles.2001.a: "Ať žijí Angličané!"
 british_isles.2002.desc: "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('embracer'))] [embracer.GetName] spolu se svými vazaly a celou rodinou [Select_CString(embracer.IsFemale, 'vyslyšela', 'vyslyšel')] volání Albionu a [Select_CString(embracer.IsFemale, 'přijala', 'přijal')] anglickou kulturu."
 british_isles.2002.a: "Byla to jen otázka času."
 british_isles.2002.b: "Zrádci!"
 british_isles.3001.t: "Chvályhodně prohlašujeme"
 british_isles.3001.desc: "Tvá touha rozšířit posvátnou vládu všeobecné církve mezi barbarské kmeny Irska je zbožným a spravedlivým záměrem. Svatá římská církev ti proto přikazuje, abys tento ostrov vzal do svého držení a naplnil na něm Boží vůli.\n\nPokud by tě před završením tohoto svatého tažení stihlo neštěstí a odešel bys z tohoto světa, přechází toto posvátné pověření na tvé právoplatné nástupce. Ať rod [scoped_ruler.GetHouse.GetBaseNameNoTooltip] nese tento svatý úkol z pokolení na pokolení, dokud nebude naplněna Boží vůle a v celém sjednoceném Irsku nezavládne [scoped_ruler.GetCulture.GetNameNoTooltip] kultura."
 british_isles.3001.a: "Připravte naše loďstvo!"
 british_isles.3002.t: "Nárok na Irsko"
 british_isles.3002.desc.irish: "[scoped_pope.GetFirstName], Jeho Svatost, náměstek Kristův a dědic trůnu svatého Petra, tímto prohlašuje, že [scoped_ruler.GetFullName] má právo z Boží vůle vládnout nad Éire a všemi tamními kmeny.\n\nKaždý irský pán, který neuposlechne papežský výnos a odmítne se podrobit, pozná hněv všemohoucího Boha. [scoped_ruler.GetTitledFirstName] proti němu vytáhne v čele vojska svého lidu."
 british_isles.3002.a: "To se ještě uvidí!"
 british_isles.3002.b: "Chápu..."
 british_isles.4001.t: "[founder.GetPrimaryTitle.GetAdjectiveNoTooltip] království obnoveno"
 british_isles.4001.desc: "[founder.GetPrimaryTitle.GetNameNoTierNoTooltip] není místem, kde by vetřelce vítali s otevřenou náručí, ať přicházejí odkudkoli. Po staletí s nimi bojujeme a snažíme se získat svůj domov zpět. Díky lstivosti a obratnosti se mi konečně podařilo znovu získat země dávné Dumnonie a obnovit království [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nCizí hrozbě jsme odolali a přečkali i zánik staré Británie. Nyní mohu čelit všemu, co proti nám [founder.GetFaith.DevilName] může seslat. Ať přijde cokoli, [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] přetrvá."
 british_isles.4001.a: "Corineus jako by ve mně znovu ožil!"
 british_isles.4001.b: "Jediné království, na kterém záleží, je to mé."
 british_isles.4002.desc: "Po staletích bojů [founder.GetFullName] [Select_CString(founder.IsFemale, 'obnovila', 'obnovil')] dávné království Dumnonie a [Select_CString(founder.IsFemale, 'zahnala', 'zahnal')] cizí vetřelce z jejich ostrova. [founder.GetPrimaryTitle.GetNameNoTier] je jméno, které tomuto království dávají jeho obyvatelé.\n\nOstatní páni Britských ostrovů se sice nejspíš nesmíří s tím, že tato nová mocnost zasahuje do zemí, které považují za dědictví svých předků, avšak [founder.GetPrimaryTitle.GetAdjective] lid už přečkal horší vpády, než jaké dokáže přinést dnešní doba. Již nyní se připravuje na nevyhnutelnou tvrdou odvetu..."
 british_isles.4002.a: "Onen hag oll!"
 british_isles.4002.b: "Zaženeme je zpět až k mysu Land's End."
 british_isles.4002.c: "Malá království přicházejí a odcházejí."
 british_isles.1011.t: "Nemyslitelná dohoda"
 british_isles.1011.nord: "$k_england$ je nehostinná, ale štědrá země. Zimy jsou mírné a léta deštivá, takže osadníci i válečníci tu mohou vzkvétat.\n\nJenže soupeření s ostatními Seveřany a odpor zbývajících domorodých panství rok od roku sílí. Všichni se tu rveme o každý kousek půdy, urváváme si vlastní léna a malá království, ale skutečnou nadvládu nedokáže získat nikdo z nás."
 british_isles.1011.brit: "Každým rokem jsou severské nájezdy horší. Připlouvá stále více osadníků, drancují stále dál podél našich břehů a vraždí stále více našich duchovních.\n\nPřesto je těžké spojit se proti cizí hrozbě. Mezi severskými dobyvateli a zatrpklou pýchou $anglo_saxon$ pánů to vypadá, že $k_england$ nikdy nebude mít [Select_CString(ntd_actor.IsFemale, 'královnu', 'krále')]."
 british_isles.1011.outro: "\n\nMým nejvážnějším soupeřem o vládu nad zemí je [ntd_recipient.GetTitledFirstName]. Kdyby [Select_CString(ntd_recipient.IsFemale, 'souhlasila', 'souhlasil')] s tím, že si zemi #EMP rozdělíme#!, místo abychom o ni dál soupeřili, jen málokdo by se odvážil postavit naší spojené moci..."
 british_isles.1011.a: "Hmm. Pošlete dopis."
 british_isles.1011.a.tt: ""
 british_isles.1011.b: "Pošlete dopis a s ním i nabídku přátelství."
 british_isles.1011.b.above_applies.tt: "#BOL Platí všechny výše uvedené důsledky dohody.#!"
 british_isles.1011.b.offer_faith.tt: "Také nabídneš sdílení své [Concept('faith','víry')|E] a stanete se [Concept('friends','přáteli')|E]"
 british_isles.1011.c: "Diplomacie je cesta zbabělců!"
 british_isles.1011.c.tt: ""
 british_isles.1021.t: "$british_isles.1011.t$"
 british_isles.1021.intro: "[ntd_actor.GetTitledFirstName] je snad mým nejvážnějším soupeřem o vládu nad $k_england$.\n\nO to méně jsem čekal, že mi dnes dorazí dopis, který [ntd_actor.GetTitledFirstName] [Select_CString(ntd_actor.IsFemale, 'vlastnoručně sepsala a opatřila svou pečetí', 'vlastnoručně sepsal a opatřil svou pečetí')]. Nabízí mi v něm, že si panství rozdělíme.\n\n"
 british_isles.1021.nord: "Můj nepřítel mi nabízí uznání a podporu severské samosprávy i vlastní království rovnocenné tomu druhému. Země, kde vládnu já nebo moji soukmenovci, by spadaly pod #EMP mou#! svrchovanost."
 british_isles.1021.brit: "Můj nepřítel mě nabízí uznat za [Select_CString(ntd_recipient.IsFemale, 'královnu', 'krále')] $k_england$, pokud podpořím severskou samosprávu a uznám, že [ntd_actor.GetTitledFirstName] má na územích, která už ovládá, stejné panovnické postavení jako já."
 british_isles.1021.outro: "\n\nMusím přiznat, že představa královské koruny na mé hlavě je... lákavá."
 british_isles.1021.a: "Koruna, kterou mi nikdo nemůže upřít, říkáš?"
 british_isles.1021.a.accepted: "Dohoda přijata"
 british_isles.1021.a.accepted.tt: "Ty a [ntd_recipient.GetTitledFirstNameNoTooltip] si mezi sebou rozdělíte panství"
 british_isles.1021.b: "Možná... možná #EMP opravdu#! nastal čas na změnu..."
 british_isles.1021.b.above_applies.tt: "$british_isles.1011.b.above_applies.tt$"
 british_isles.1021.b.accepted.critical: "Dohoda i přátelství přijaty"
 british_isles.1021.b.accepted.critical.tt: "$british_isles.1021.a.accepted.tt$"
 british_isles.1021.c: "Takový nesmysl! Ať celý svět pozná, že [ntd_actor.GetTitledFirstName] [Select_CString(ntd_actor.IsFemale, 'je zbabělkyně', 'je zbabělec')]!"
 british_isles.1021.c.rejected: "Dohoda odmítnuta"
 british_isles.1021.c.rejected.tt: "Celý svět ví o tvé proradnosti"
 british_isles.1021.invalidation.t: "Tvá dohoda pozbyla platnosti"
 british_isles.1021.invalidation.tt: "Můžeš ji znovu navrhnout v panelu '$DECISIONS_VIEW_TITLE$'"
 negotiate_the_danelaw_each_way_effect.accepted: "Pokud bude dohoda přijata"
 negotiate_the_danelaw_each-way_effect.rejected: "Pokud bude dohoda odmítnuta"
 negotiate_the_danelaw_accept_effect.partition_active.tt: "$k_england$ a $k_danelaw_article$$k_danelaw$ budou [Concept('de_jure_partitioned','de iure rozděleny')|E]"
 negotiate_the_danelaw_accept_effect.de_jure_holdings_recognised.tt: "Všechna $k_england_adj$ [Concept('duchies','vévodství')|E], v nichž [ntd_nord.GetTitledFirstName] drží alespoň jedno [Concept('county','hrabství')|E], se stanou [Concept('de_jure','de iure')|E] vévodstvími $k_danelaw_article$$k_danelaw$"
 negotiate_the_danelaw_accept_effect.independent_holdings_recognised.tt: "Všechna nezávislá $k_england_adj$ [Concept('duchies','vévodství')|E], kterým vládne [Concept('ruler','vládce')|E] $north_germanic_group$-[Concept('culture','kultury')|E] nebo $germanic_religion$-[Concept('faith','víry')|E], se stanou [Concept('de_jure','de iure')|E] vévodstvími $k_danelaw_article$$k_danelaw$"
 negotiate_the_danelaw_accept_effect.riled_independents_list: "Všichni nezávislí vládci v $k_england$"
 TRUCE_SIGNED_PARTITION: "\nPříměří uzavřeno v rámci rozdělení království"
 resolve_danelaw_partition_effect.adjust_de_jures.tt: "Všechna [Concept('de_jure','de iure')|E] území $k_danelaw_article$$k_danelaw$ budou [Concept('de_jure_drift_drifted','posunuta')|E] do $k_england$"
 resolve_danelaw_partition_effect.coa_changed.tt: "$k_england$ bude používat erb $k_danelaw_article$$k_danelaw$"
 resolve_danelaw_partition_effect.all_claimants: "Všichni nárokovatelé"
 formalise_the_daneland_effect.partition_status.tt: "$k_england$ a $k_danelaw_article$$k_danelaw$ již nebudou považovány za [Concept('de_jure_partitioned','de iure rozdělené')|E]"
 formalise_the_daneland_effect.adjust_de_jures.tt: "Všechna [Concept('de_jure','de iure')|E] území $k_danelaw_article$$k_danelaw$ budou [Concept('de_jure_drift_drifted','posunuta')|E] do $k_daneland$"
 formalise_the_daneland_effect.all_claimants: "Všichni nárokovatelé"
 british_isles.1022.t: "$british_isles.1011.t$"
 british_isles.1022.desc: "Zdá se, že [ntd_actor.GetTitledFirstName] a [ntd_recipient.GetTitledFirstName] ve snaze upevnit vlastní moc uzavřeli ďábelskou smlouvu a rozdělili si mezi sebou $k_england$!\n\nÚzemí, která jsou nyní pod severskou nadvládou, budou od této chvíle náležet $k_danelaw_article$$k_danelaw$, zatímco zbývající domorodá panství budou uznána za $k_england_adj$ území."
 british_isles.1022.a: "Co je to za nestoudnou zradu vlastní země?"
 british_isles.1022.a.tt: "$k_england$ a $k_danelaw_article$$k_danelaw$ jsou [Concept('de_jure_partitioned','de iure rozděleny')|E]"
 british_isles.1051.t: "Sjednocené [partition_winner.GetTierAsNameNoTooltip]"
 british_isles.1051.desc: "Konečně už nikdo nemůže zpochybnit mou vládu. [england.GetNameNoTierNoTooltip] ve mně má svého [Select_CString(victor.IsFemale, '#EMP skutečného vládce#!', '#EMP skutečného vládce#!')] a stát samozvanců je minulostí. Má konečná nadvláda nad celou Británií je nyní téměř jistá."
 british_isles.1051.a: "Jedno panství, [Select_CString(victor.IsFemale, 'jedna', 'jeden')] [victor.GetTitleAsNameNoTooltip]!"
 british_isles.1051.a.tt: "[Concept('de_jure_partition','De iure rozdělení')|E] mezi $k_england$ a $k_danelaw_article$$k_danelaw$ končí"
 british_isles.1052.t: "$british_isles.1051.t$"
 british_isles.1052.desc: "Dnes se ukázalo, jak krutý umí osud být. [loser.GetFaith.FateGodName|U] zřejmě stojí při [victor.GetTitledFirstName], jemuž připadlo rozhodující vítězství v boji o $k_england$.\n\nUž sice nemohu tvrdit, že vládnu zemím, které mi kdysi patřily, ale dokud má krev koluje v žilách mých potomků, tato záležitost ještě není uzavřena."
 british_isles.1052.a: "Za tuto potupu #EMP přijde#! odplata."
 british_isles.1052.a.tt: "$british_isles.1051.a.tt$"
 british_isles.1053.t: "$british_isles.1051.t$"
 british_isles.1053.desc: "Události poslední doby zanechaly [victor.GetTitledFirstName] jako jediného vážného uchazeče o $k_england_adj$ trůn. Ne všichni se vítězi podrobují dobrovolně, ale přinejmenším lze říci, že $k_england$ je v duchu opět jednotná."
 british_isles.1053.a: "Dočká se $k_england$ konečně stability?"
 british_isles.1053.a.tt: "$british_isles.1051.a.tt$"
 british_isles.1061.t: "Zákon země"
 british_isles.1061.desc: "Od chvíle, kdy Skandinávci poprvé připluli k těmto úrodným břehům, uplynula dlouhá léta. Léta krveprolití, násilí a svárů, ale také vzájemného obohacování, rozvoje a splývání.\n\nPotomci prvních osadníků už nejsou skutečnými Seveřany a ani místní už nejsou týmiž $anglo_saxon_collective_noun$, jakými byli při příchodu Skandinávců.\n\nKdo jsme dnes, snad ani nelze snadno říci.\n\nJisté je pouze to, že v sobě neseme všechny, kdo tu byli před námi, dobré i zlé, a naše dějiny budou od nynějška $k_daneland_adj$."
 british_isles.1061.a: "Napíšeme je společně."
 british_isles.1062.t: "$british_isles.1061.t$"
 british_isles.1062.desc: "Ten ničema! Ten bídák! Ten [founder.Custom2('InsultAdjective', ROOT.Char)], [founder.Custom2('InsultAdjective', ROOT.Char)] #EMP [founder.Custom2('InsultNoun', ROOT.Char)]!#!\n\n$k_england$ a $k_danelaw_article$$k_danelaw$ jsou rozděleny už příliš dlouho, ale #EMP každý#! věděl, že jednoho dne budou znovu sjednoceny.\n\nAž do dneška.\n\n[founder.GetTitledFirstName] totiž ve velkolepém a nabubřelém prohlášení [Select_CString(founder.IsFemale, 'slavnostně oznámila', 'slavnostně oznámil')], že se vzdává jakéhokoli nároku na vládu nad $k_england$. Tím mi téměř vzala veškerou naději, že jednou snadno znovu spojím své panství se zeměmi $k_danelaw_article$$k_danelaw$!"
 british_isles.1062.a: "Země, kterým [founder.GetTitledFirstName] vládne, byly kdysi $k_england_adj$ a jednou budou #EMP znovu#! $k_england_adj$."
 british_isles.1063.t: "$british_isles.1061.t$"
 british_isles.1063.desc: "$k_england$ je už celé roky rozdělena mezi země, kterým vládnou [england.GetTitledFirstName] a [founder.GetTitledFirstName]. Ačkoli si jsou oba vládci formálně rovni, vždy se mlčky předpokládalo, že každé z obou panství touží zničit to druhé a dosadit svého panovníka jako jediného vládce sjednocené $k_england$.\n\nTomu je nyní konec.\n\n[founder.GetTitledFirstNameNoTooltip] ve velkolepém prohlášení oznamuje, že se vzdává veškerých nároků na vládu nad zbytkem země a od této chvíle bude vládnout nezávislému a svrchovanému panství."
 british_isles.1063.a: "Snad to alespoň trochu zchladí vášně..."
 british_isles.1063.a.tt: "$british_isles.1051.a.tt$"
