l_polish:
 central_asia.0001.t: "Svět přede mnou"
 central_asia.0001.desc: "Všichni vůdci rodů vědí, proč byli svoláni. Celou dlouhou noc trávíme v ústraní palácové jurty, kam si předvolávají šamany i vojevůdce, aby před nimi promluvili. O ničem se však nediskutuje. Když s prvními paprsky slunce vycházím z jurty, celé shromážděné vojsko už bdí a čeká.\n\nVítají mě s vědomím, že nejsem pouhým vládcem jejich zemí. Vládnu všehomíru — jsem Čingischán."
 central_asia.0001.a: "Právě zde mé dobývání skutečně začíná."
 central_asia.0001.mongol_invasion_cb: "Můžeš používat [Concept('mongol_invasion_casus_belli','casus belli mongolské invaze')|E]"
 central_asia.0002.t: "Čingischán"
 central_asia.0002.desc: "[Select_CString(genghis_khan.IsFemale, 'Má lenní paní', 'Můj lenní pán')] mě [Select_CString(genghis_khan.IsFemale, 'svolala', 'svolal')] na Velký kurultaj, shromáždění všech vůdců rodů a vazalů v panství. Všichni jsme věděli proč a během celonočního rokování v zakouřené jurtě nebylo o ničem pochyb. [genghis_khan.GetFullNameNoTooltip] vládne všehomíru — jako Čingischán.\n\nŽádná korunovace se nekonala, neboť kdo by si troufl vynášet soud nad vládcem všehomíra? Místo toho před shromážděnými vojsky zaznělo prohlášení.\n\n„Dnes vyrazíme a dobudeme vše, co leží pod Velkým nebem!“"
 central_asia.0002.a: "Svět se před námi bude třást!"
 central_asia.0003.desc: "Poslové nám přinášejí zprávy o novém vládci stepí, který si říká „Čingischán“ a sám se prohlašuje za vládce všehomíra. Sjednocená horda jezdců a válečníků se valí vpřed, aby si podrobila všechny, kdo odmítnou sklonit koleno.\n\nTaková tvrzení jsou samozřejmě směšná, jenže zároveň k nám doléhají zprávy o velkých městech, která už padla před nelítostným dobyvatelem..."
 central_asia.0003.a.distant: "Brzy to celé pomine."
 central_asia.0003.a.neighbor: "Musíme se připravit. Čekají nás těžké časy."
 central_asia.0011.t: "Kolébka stepí"
 central_asia.0011.desc: "Dědictví dávných časů není pouhým mocným symbolem, ale samo o sobě silou, která nám ukazuje cestu. Tak jako kdysi budou i nyní rozličné národy této země sjednoceny a vedeny pod korouhví Baktrie. Pod mou korouhví.\n\nZa dunění kopyt a pochodu vojsk všichni, kdo putují mezi Východem a Západem, poznají, že širé nebe patří nám."
 central_asia.0011.a: "Neseme v sobě sílu mnoha národů!"
 central_asia.0012.desc: "[Select_CString(bactrian_emperor.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bactrian_emperor'))|l] [bactrian_emperor.GetTitledFirstName] [Select_CString(bactrian_emperor.IsFemale, 'vznesla', 'vznesl')] nárok na dávné země Baktrie a hodlá je sjednotit pod svou vládou, jako tomu bývalo za dávných králů.\n\nTěm, kdo putují mezi Východem a Západem, může tato země připadat nehostinná, my však víme, že ve skutečnosti překypuje životem."
 central_asia.0012.a: "Neseme v sobě sílu mnoha národů!"
 central_asia.0013.desc: "[bactrian_emperor.GetFullName] [Select_CString(bactrian_emperor.IsFemale, 'vznesla', 'vznesl')] nárok na všechny země dávné Baktrie a [Select_CString(bactrian_emperor.IsFemale, 'prohlásila se za její jedinou právoplatnou vládkyni', 'prohlásil se za jejího jediného právoplatného vládce')]. Ten hlupák však zřejmě přehlédl jednu drobnost. Některé země, na které si činí nárok, patří mně!"
 central_asia.0013.a: "Ať si je přijde vzít z mých chladných mrtvých rukou!"
 