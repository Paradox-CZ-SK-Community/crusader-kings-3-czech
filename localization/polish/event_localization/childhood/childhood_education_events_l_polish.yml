l_polish:
 childhood_education.0004.t: "Proměnlivost mládí"
 childhood_education.0004.opening: "Můj svěřenec, [ward.GetTitledFirstName], změnil [Select_CString(ward.IsFemale,'její','jeho')] zaměření studia.\n\n"
 childhood_education.0004.desc1: "Pomyslet, že [ward.GetSheHe] nyní usiluje proniknout do umění [ward.Custom('education_focus_child')], oboru, v němž vynikám... Těší mě to!"
 childhood_education.0004.desc2: "Pomyslet, že by [Select_CString(ward.IsFemale,'opustila','opustil')] náš společný zájem ve prospěch umění [ROOT.Char.Custom('education_focus')]!"
 childhood_education.0004.desc_fallback: "[ward.GetSheHe|U] nyní hledá poznání v oboru [ward.Custom('education_focus_child')]."
 childhood_education.0004.a: "[ward.GetTitledFirstNameNoTooltip] teď studuje [ward.Custom('education_focus_child')]!"
 childhood_education.1011.t: "To jsem já"
 childhood_education.1011.desc: "[guardian.GetTitledFirstName] mě naučil tolik o způsobech [Select_CString(guardian.IsFemale,'jejímu','jeho')] lidu — o #EMP našem#! lidu, protože nejenže vyznávám [guardian.GetFaith.GetAdjective] víru, ale vnímám se také jako plně [guardian.GetCulture.GetName]."
 childhood_education.1011.a: "Je to jediný způsob, jak chci žít."
 childhood_education.1012.t: "Požehnaný den"
 childhood_education.1012.desc: "Díky pokračujícímu vzdělávání [Select_CString(ward.IsFemale,'její','jeho')] ve víře a zvycích mého lidu mi [ward.GetTitledFirstName] [Select_CString(ward.IsFemale,'řekla','řekl')], že se [ward.GetSheHe] cítí jako dobrý, [guardian.GetFaith.GetAdjective] [guardian.GetCulture.GetName]."
 childhood_education.1012.a: "Konečně [ward.GetSheHe] vidí světlo!"
 child_culture_and_faith_converted.parent.title: "[ward.Custom('GetDaughterSon')|U] Pod vlivem opatrovníka" # todo: NEW TRANSLATION
 child_culture_and_faith_converted.parent.message: "U vašeho [ward.Custom('GetDaughterSon')] [ward.GetTitledFirstNamePossessive] se víra a kultura změnily pod vedením [guardian.GetTitledFirstName]"
 childhood_education.1021.t: "Ve víře je pravda"
 childhood_education.1021.desc: "[guardian.GetTitledFirstNamePossessive] výchova mě tolik naučila a cítím, že chápu skutečnou povahu světa.\n\nJak jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] někdy pochybovat, že [guardian.GetFaith.GetName] má všechny odpovědi?"
 childhood_education.1021.a: "[Select_CString(ROOT.Char.IsFemale,'Našla','Našel')] jsem svou pravou víru."
 childhood_education.1022.t: "Ve víře je pravda"
 childhood_education.1022.desc: "Po všech mých přednáškách a veškeré sdílené moudrosti můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ward'))], [ward.GetTitledFirstName], konečně [Select_CString(ward.IsFemale,'přijala','přijal')] pravou víru.\n\nVždy jsem [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')], že jednoho dne z [ward.GetSheHe] bude dobrý malý [ROOT.Char.GetFaith.GetAdjective]."
 childhood_education.1022.a: "[ROOT.Char.GetFaith.KnowledgeGodName] vedl mou ruku."
 child_faith_converted.parent.message: "U vašeho [ward.Custom('GetDaughterSon')] [ward.GetTitledFirstNamePossessive] se víra změnila pod vedením [guardian.GetTitledFirstName]"
 childhood_education.1031.t: "Příroda a výchova"
 childhood_education.1031.desc: "Možná jsem se [Select_CString(ROOT.Char.IsFemale,'narodila','narodil')] [ward.GetCulture.GetName], ale nemohu popřít, že už ani nevím, co to vůbec znamená. Po [guardian.GetTitledFirstNamePossessive] výchově se cítím úplně [guardian.GetCulture.GetName]."
 childhood_education.1031.a: "To jsem já"
 childhood_education.1032.t: "Příroda a výchova"
 childhood_education.1032.desc: "Po mé dlouhé výchově mladého [ward.GetTitledFirstName] mě neskonale potěšilo, když mi [Select_CString(ward.IsFemale,'řekla','řekl')], že se [ward.GetHerselfHimself] považuje za [guardian.GetCulture.GetName]!"
 childhood_education.1032.a: "A skutečně [ward.GetSheHe] je!"
 child_culture_converted.parent.message: "U vašeho [ward.Custom('GetDaughterSon')] [ward.GetTitledFirstNamePossessive] se kultura změnila pod vedením [guardian.GetTitledFirstName]"
