l_polish:
 childhood_education.0004.t: "Přelétavost mládí"
 childhood_education.0004.opening: "[Select_CString(ward.IsFemale,'Má svěřenkyně','Můj svěřenec')] [ward.GetTitledFirstName] [Select_CString(ward.IsFemale,'změnila','změnil')] zaměření svého studia.\n\n"
 childhood_education.0004.desc1: "A pomyslet, že se teď chce ponořit do oboru [ward.Custom('education_focus_child')], ve kterém vynikám i já... To mě hřeje u srdce!"
 childhood_education.0004.desc2: "A pomyslet, že se vzdává našeho společného zájmu o obor [ROOT.Char.Custom('education_focus')]!"
 childhood_education.0004.desc_fallback: "Teď se věnuje oboru [ward.Custom('education_focus_child')]."
 childhood_education.0004.a: "[ward.GetTitledFirstNameNoTooltip] teď studuje obor [ward.Custom('education_focus_child')]!"
 childhood_education.1011.t: "[Select_CString(ROOT.Char.IsFemale,'Taková jsem','Takový jsem')]"
 childhood_education.1011.desc: "[guardian.GetTitledFirstName] mě toho tolik [Select_CString(guardian.IsFemale,'naučila','naučil')] o způsobu života svého lidu... vlastně #EMP našeho#! lidu. Nejenže vyznávám [guardian.GetFaith.GetName], ale i [guardian.GetCulture.GetName] kulturu už považuji za svou."
 childhood_education.1011.a: "Jinak už žít nechci."
 childhood_education.1012.t: "Požehnaný den"
 childhood_education.1012.desc: "Při dalším vzdělávání v náboženství a zvycích mého lidu mi [ward.GetTitledFirstName] [Select_CString(ward.IsFemale,'řekla','řekl')], že [guardian.GetFaith.GetName] už skutečně vyznává a [guardian.GetCulture.GetName] kulturu považuje za svou."
 childhood_education.1012.a: "Konečně [Select_CString(ward.IsFemale,'prozřela','prozřel')]!"
 child_culture_and_faith_converted.parent.title: "[Select_CString(ward.IsFemale,'Dcera','Syn')] pod vlivem [Select_CString(guardian.IsFemale,'opatrovnice','opatrovníka')]"
 child_culture_and_faith_converted.parent.message: "Tvé dítě [ward.GetTitledFirstName] pod vedením [guardian.GetTitledFirstName] přijalo jiné vyznání i kulturu"
 childhood_education.1021.t: "Ve víře je pravda"
 childhood_education.1021.desc: "[guardian.GetTitledFirstName] mě během výuky mnohému [Select_CString(guardian.IsFemale,'naučila','naučil')] a mám pocit, že konečně chápu pravou podstatu světa.\n\nJak jsem vůbec [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] pochybovat, že [guardian.GetFaith.GetName] má odpověď na všechno?"
 childhood_education.1021.a: "[Select_CString(ROOT.Char.IsFemale,'Našla','Našel')] jsem svou pravou víru."
 childhood_education.1022.t: "Ve víře je pravda"
 childhood_education.1022.desc: "Po všech mých přednáškách a veškeré moudrosti, o kterou jsem se [Select_CString(ROOT.Char.IsFemale,'podělila','podělil')], [ward.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ward'))], konečně [Select_CString(ward.IsFemale,'přijala','přijal')] pravou víru.\n\nVždy jsem [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')], že [ROOT.Char.GetFaith.GetName] jednou přijme za své."
 childhood_education.1022.a: "Kdo jiný mohl vést mou ruku než [ROOT.Char.GetFaith.KnowledgeGodName]?"
 child_faith_converted.parent.message: "Tvé dítě [ward.GetTitledFirstName] pod vedením [guardian.GetTitledFirstName] přijalo jiné vyznání"
 childhood_education.1031.t: "Přirozenost a výchova"
 childhood_education.1031.desc: "Možná mě od narození formovala [ward.GetCulture.GetName] kultura, ale už ani nevím, co pro mě vlastně znamená. Po výchově pod vedením [guardian.GetTitledFirstName] teď za svou považuji [guardian.GetCulture.GetName] kulturu."
 childhood_education.1031.a: "[Select_CString(ROOT.Char.IsFemale,'Taková prostě jsem','Takový prostě jsem')]."
 childhood_education.1032.t: "Přirozenost a výchova"
 childhood_education.1032.desc: "[ward.GetTitledFirstName] jsem [Select_CString(ROOT.Char.IsFemale,'vychovávala','vychovával')] dlouhá léta, a proto mě nesmírně potěšilo, když mi [Select_CString(ward.IsFemale,'řekla','řekl')], že [guardian.GetCulture.GetName] kulturu považuje za svou!"
 childhood_education.1032.a: "A má naprostou pravdu!"
 child_culture_converted.parent.message: "Tvé dítě [ward.GetTitledFirstName] pod vedením [guardian.GetTitledFirstName] přijalo jinou kulturu"
 childhood_education.9004.child_message: "[guardian.GetTitledFirstNamePossessiveNoTooltip] [GetPerk( 'pedagogy_perk' ).GetName( GetPlayer )]"
 childhood_education.9004.guardian_message: "[GetPerk( 'pedagogy_perk' ).GetName( GetPlayer )]"
