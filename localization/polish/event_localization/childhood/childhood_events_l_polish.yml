l_polish:
 childhood.0002.t: "Společné hraní"
 childhood.0002.opening: "S [crush.GetTitledFirstName] je vždycky taková zábava!\n\n"
 childhood.0002.loud: "[crush.GetFirstName] obvykle vyžaduje spoustu pozornosti, ale mně to nevadí. Kdykoli se vidíme, hned mám lepší den!"
 childhood.0002.quiet: "[crush.GetFirstName] je většinou trochu [Select_CString(crush.IsFemale,'stydlivá','stydlivý')], ale každé naše setkání je díky [Select_CString(crush.IsFemale,'ní','němu')] něčím výjimečné!"
 childhood.0002.fallback: "Kdykoli se vidíme, hned mám lepší den a nejraději bych si [Select_CString(crush.IsFemale,'s ní','s ním')] [Select_CString(ROOT.Char.IsFemale,'hrála','hrál')] pořád."
 childhood.0002.end: "\n\nKdykoli se naše pohledy střetnou, mám v břiše motýly... Ach, co kdybych [crush.GetFirstNameNoTooltip] něco [Select_CString(ROOT.Char.IsFemale,'darovala','daroval')]? Třeba [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]..."
 childhood.0002.a: "Tahle květina je pro tebe, [crush.GetFirstNameNoTooltip]!"
 childhood.0002.b: "Ne... měli bychom zůstat jen přáteli."
 crush_returned: "[crush.GetFirstNameNoTooltip] tě má taky [Select_CString(ROOT.Char.IsFemale,'ráda','rád')]!"
 crush_crushed: "[crush.GetFirstNameNoTooltip] chce být jen [Select_CString(crush.IsFemale,'kamarádka','kamarád')]..."
 childhood.0004.t: "Rozkvétající přátelství"
 childhood.0004.desc1: "Poslední dobou si s [friend.GetTitledFirstName] hraju opravdu často. Nedávno mi dokonce [friend.GetFirstName] [Select_CString(friend.IsFemale,'půjčila','půjčil')] svou nejoblíbenější hračku! Je to [friend.Custom('child_favorite_toy')]. Opravdu si rozumíme a je s námi taková zábava!"
 childhood.0004.desc2: "S [friend.GetTitledFirstName] jsme spolu poslední dobou strávili spoustu času povídáním a hraním. Je s námi taková zábava!"
 childhood.0004.desc3: "Poslední dobou trávím s [friend.GetFirstName] spoustu času."
 childhood_0004.desc3_rowdy: "[friend.GetFirstName] pořád něco vyvádí a společně se nikdy nenudíme!"
 childhood_0004.desc3_curious: "[friend.GetFirstName] ví o všem, co se děje u dvora, takže naše rozhovory nikdy nejsou nudné!"
 childhood_0004.desc3_charming: "Nikdo mě nedokáže rozesmát tak jako [friend.GetFirstName]!"
 childhood_0004.desc3_pensive: "[friend.GetFirstName] vždycky klade ty správné otázky a v každém rozhovoru se dokáže dobrat podstaty. Společně se nikdy nenudíme!"
 childhood_0004.desc3_bossy: "[friend.GetFirstName] vždycky přesně ví, co bychom měli podniknout, a společně se nikdy nenudíme!"
 childhood_0004.desc3_fallback: "Vždycky se spolu bavíme, ať už hrajeme některou z našich oblíbených her, nebo si jen povídáme!"
 childhood.0004.a: "[friend.GetFirstName] je [Select_CString(friend.IsFemale,'skvělá kamarádka','skvělý kamarád')]!"
 childhood.0004.b: "Hrozně [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] si s [friend.GetFirstName] hraju!"
 childhood.0004.c: "Tak dobrý [Select_CString(friend.IsFemale,'kamarád jako','kamarád jako')] [friend.GetFirstName] se hledá těžko!"
 childhood.0004.a_alt: "Přísahejme si, že budeme přátelé #EMP navždy!#!"
 childhood.0004.c_alt: "Jsi #EMP hlupák#!, když mi věříš, #EMP [child.Custom2('InsultNoun', ROOT.Char)]!#!"
 childhood.0004.d: "Takže [friend.Custom('child_favorite_toy')] je tvoje oblíbená hračka a chceš ji #EMP zpátky#!? Ani náhodou!"
 childhood.0006.t: "Nevítaná pozornost"
 childhood.0006.opening: "[bully.GetTitledFirstName] mi už dlouho nedává pokoj.\n\n"
 childhood.0006.mean: "[bully.GetFirstName] je [Select_CString(bully.IsFemale,'zlá','zlý')], pořád se mi vysmívá a strká do mě."
 childhood.0006.loud: "Spousta ostatních dětí [bully.GetFirstName] poslouchá a [bully.GetFirstName] svého vlivu využívá, aby je poštvala proti mně."
 childhood.0006.quiet: "[bully.GetFirstName] si dává pozor, aby si ničeho nikdo nevšiml, a trápí mě jen tehdy, když se nikdo nedívá."
 childhood.0006.nice: "[bully.GetFirstName] všem [Select_CString(bully.IsFemale,'namluvila','namluvil')], že je hotový svatoušek, ale mně se bez ustání vysmívá za každou sebemenší chybu."
 childhood.0006.fallback: "[bully.GetFirstName] využije každou příležitost, aby se na mě šklebil a posmíval se mi."
 childhood.0006.toy: "A nejen to... [bully.GetFirstName] mi [Select_CString(bully.IsFemale,'zničila','zničil')] mou oblíbenou hračku! [ROOT.Char.Custom('child_favorite_toy')] je teď úplně na kusy, ten #EMP [bully.Custom2('InsultNoun', ROOT.Char)]!#!"
 childhood.0006.end: "Ať dělám cokoli, [bully.GetFirstName] mi prostě nedá pokoj!"
 childhood.0006.a: "[bully.GetFirstName] je úplně nejhorší!"
 childhood.0006.b: "Grrr... zmlátím tě do bezvědomí!"
 childhood.0006.b.critical_success: "Ubiješ [bully.GetFirstNameNoTooltip] k smrti"
 childhood.0006.b.success: "Zbiješ [bully.GetFirstNameNoTooltip] a pak ti dá pokoj"
 childhood.0006.b.failure: "[bully.GetFirstNameNoTooltip] tě zbije"
 childhood.0006.b.critical_failure: "[bully.GetFirstNameNoTooltip] tě pořádně zbije"
 childhood.0006.b.death: "[bully.GetFirstNameNoTooltip] tě ubije #EMP k smrti#!"
 childhood.0006.c: "Hele, dám ti pět zlatých, když už mi dáš pokoj."
 childhood.0006.c_leave: "[bully.GetFirstNameNoTooltip] ti #EMP nedá#! pokoj"
 childhood.0008.t: "Ovládání hněvu"
 childhood.0008.desc: "[victim.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('victim'))], mi pořádně leze na nervy.\n\n"
 childhood.0008.mean: "[victim.GetFirstName] při každé příležitosti do mě rýpe a očividně si užívá podráždění a bolest, které mi působí."
 childhood.0008.loud: "[victim.GetFirstName] pořád mele a mele, ať už jde o cokoli a bez ohledu na to, jak jasně dávám najevo, že mě to nezajímá. Nikdy to nekončí!"
 childhood.0008.quiet: "Snažím se [Select_CString(victim.IsFemale,'ji','ho')] přimět mluvit, vyjádřit nějaký názor, říct #EMP cokoli#!...! Ať dělám cokoli, [victim.GetFirstName] se jen víc a víc uzavírá do sebe. Co s [Select_CString(victim.IsFemale,'ní','ním')] je?!"
 childhood.0008.nice: "[victim.GetFirstName] ze sebe pořád dělá #EMP vzor ctnosti#! a káže mi o jedné ctnosti za druhou. Ty nekonečné přednášky na mě ale mají přesně opačný účinek..."
 childhood.0008.fallback: "[victim.GetFirstName] mi pořád překáží, mluví o těch nejnudnějších věcech a v každém rozhovoru vždycky dokáže říct přesně to, co mě nejvíc naštve..."
 childhood.0008.a: "To [Select_CString(victim.IsFemale,'ji','ho')] naučí být tak otravný!"
 childhood.0008.b: "Až se příště potkáme, #EMP zkusím#! být hodný..."
 childhood.0008.c: "Ach, jak já [Select_CString(victim.IsFemale,'ji','ho')] #EMP nenávidím#!! Možná by bylo lepší, kdyby... [Select_CString(victim.IsFemale,'zemřela','zemřel')]."
 childhood.0009.t: "Nevinné kratochvíle"
 childhood.0009.opening: "Konečně můžu [victim.GetFirstName] ukázat, kde je [Select_CString(victim.IsFemale,'její','jeho')] místo, a hned mám mnohem lepší náladu.\n\n"
 childhood.0009.desc1: "Jedna z mých oblíbených her je zjistit, kolikrát můžu do [victim.GetFirstName] strčit, než toho bude mít dost!"
 childhood.0009.desc2: "[victim.GetFirstName] teď všude pronásleduju a co nejhlasitěji kritizuju každý [Select_CString(victim.IsFemale,'její','jeho')] krok."
 childhood.0009.desc3: "[victim.GetFirstName] má oblíbenou hračku - [victim.Custom('child_favorite_toy')]. Tu jsem si [Select_CString(ROOT.Char.IsFemale,'půjčila','půjčil')], takže teď musí dělat všechno, co řeknu!"
 childhood.0009.fallback: "Náhodou jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')] oblíbenou hračku [victim.GetFirstName]: [victim.Custom('child_favorite_toy')]. Schovat ji a dívat se, jak ji [victim.GetFirstName] zoufale hledá, bylo to nejlepší, co se mi za celý týden stalo!"
 childhood.0009.a: "Vždyť je to jen legrace!"
 childhood.0012.t: "Nečekaná pozornost"
 childhood.0012.desc: "Když jsem si nedávno [Select_CString(ROOT.Char.IsFemale,'hrála','hrál')] s [crush_holder.GetTitledFirstName], [crush_holder.GetFirstName] se ke mně [Select_CString(crush_holder.IsFemale,'chovala','choval')] nezvykle pozorně. Nikdy předtím jsem k [Select_CString(crush_holder.IsFemale,'ní','němu')] nic takového [Select_CString(ROOT.Char.IsFemale,'necítila','necítil')], ale možná v [Select_CString(crush_holder.IsFemale,'ní','něm')] začínám vidět víc než jen [Select_CString(crush_holder.IsFemale,'kamarádku','kamaráda')]."
 childhood.0012.a: "[crush_holder.GetTitledFirstNameNoTooltip], myslím, že se mi líbíš!"
 childhood.0012.b: "[crush_holder.GetTitledFirstNameNoTooltip] je jen [Select_CString(crush_holder.IsFemale,'kamarádka','kamarád')]."
 childhood.0013.t: "Přátelské chvíle"
 childhood.0013.desc: "Poslední dobou trávíme s [child.GetTitledFirstName] spoustu času spolu.\n\n"
 childhood.0013.desc1: "Nedávno jsem dokonce [child.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'půjčila','půjčil')] svou oblíbenou hračku: [child.Custom('child_favorite_toy')]! Opravdu si rozumíme a je s námi taková zábava!"
 childhood.0013.desc2: "Poslední dobou trávíme s [child.GetTitledFirstName] spoustu času povídáním a hraním. Je s námi taková zábava!"
 childhood.0013.desc3: ""
 childhood.0013.desc3_rowdy: "[child.GetFirstName] vždycky [Select_CString(child.IsFemale,'snáší','snáší')] všechny mé lumpárny a vyráží se mnou za každým dobrodružstvím. Společně se nikdy nenudíme!"
 childhood.0013.desc3_curious: "[child.GetFirstName] skvěle naslouchá všem drbům a šeptandě, které pochytím u dvora, a vždycky přidá zajímavý postřeh nebo nový pohled."
 childhood.0013.desc3_charming: "Nikdo se mým vtipům nesměje tolik jako [child.GetFirstName]!"
 childhood.0013.desc3_pensive: "[child.GetFirstName] má mou společnost vždycky [Select_CString(child.IsFemale,'ráda','rád')], poslouchá mé myšlenky a ochotně se mnou vede dlouhé rozhovory."
 childhood.0013.desc3_bossy: "[child.GetFirstName] se vždycky nechá vést mnou a společně se nikdy nenudíme!"
 childhood.0013.desc_fallback: "S [child.GetFirstName] je vždycky zábava, ať už si spolu hrajeme, nebo si potřebujeme o něčem promluvit!"
 childhood.0013.desc_end: "Společnost [child.GetFirstName] si opravdu užívám a myslím, že si budeme blízcí ještě hodně dlouho."
 childhood.0013.a: "Jsem tak [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že se známe!"
 childhood.0910.t: "Nekončící trápení"
 childhood.0910.opening: "To, čím mě [bully.GetTitledFirstName] v dětství [Select_CString(bully.IsFemale,'trápila','trápil')], mě stále tíží."
 childhood.0910.desc1: "Ty pohledy, smích, bolest... Kdykoli [bully.GetFirstName] spatřím, hned se mi zkazí nálada.\n\n[bully.GetFirstName] už možná [Select_CString(bully.IsFemale,'dospěla','dospěl')], ale vím, že z [Select_CString(bully.IsFemale,'ní','něj')] nikdy nebude slušný člověk!"
 childhood.0910.desc2: "\n\nNěkdy ještě slyším ten posměšný smích, když [bully.GetFirstName] [Select_CString(bully.IsFemale,'dupala','dupal')] po mé drahocenné hračce: [ROOT.Char.Custom('child_favorite_toy')]."
 childhood.0910.a: "[bully.GetFirstName] nikdy neodpustím!"
 childhood.0911.t: "Dětské kratochvíle"
 childhood.0911.desc_rival: "[victim.GetTitledFirstName] už možná [Select_CString(victim.IsFemale,'dospěla','dospěl')], ale to neznamená, že mi [Select_CString(victim.IsFemale,'odpustila','odpustil')] všechno, čím jsem [Select_CString(victim.IsFemale,'ji','ho')] v dětství [Select_CString(ROOT.Char.IsFemale,'trápila','trápil')].\n\nJen dobře, protože i má nenávist k [Select_CString(victim.IsFemale,'ní','němu')] mezitím vyrostla!"
 childhood.0911.opening: "Přemýšlím, jestli si [victim.GetTitledFirstName] pamatuje všechno, čím jsem [Select_CString(victim.IsFemale,'ji','ho')] v dětství [Select_CString(ROOT.Char.IsFemale,'trápila','trápil')]."
 childhood.0911.desc1: "\n\nTeď už ale [victim.GetFirstName] dospívá a já musím tyhle dětské kratochvíle nechat za sebou a věnovat se jiným věcem."
 childhood.0911.desc2: "Nikdy nezapomenu na zděšený výraz [victim.GetFirstName], když jsem [Select_CString(ROOT.Char.IsFemale,'zničila','zničil')] [Select_CString(victim.IsFemale,'její','jeho')] oblíbenou hračku: [victim.Custom('child_favorite_toy')]. Byla to taková legrace!\n\nTeď už ale [victim.GetFirstName] dospívá a já musím tyhle dětské kratochvíle nechat za sebou a věnovat se jiným věcem."
 childhood.0911.a: "Tak zase někdy, [victim.GetTitledFirstNameNoTooltip]."
 childhood.0998.t: "Dospívající city"
 childhood.0998.desc: "Rád vzpomínám na všechny krásné chvíle, které jsme s [crush.GetTitledFirstName] v dětství prožili.\n\n[crush.GetFirstName] mi bude vždycky [Select_CString(crush.IsFemale,'drahá','drahý')], i kdyby mezi námi s přibývajícími roky nakonec nic nebylo!"
 childhood.0998.a: "Mám štěstí, že jsem [crush.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'poznala','poznal')]."
 childhood.0999.t: "Dospívající city"
 childhood.0999.desc: "Rád vzpomínám na všechny krásné chvíle, které jsme s [root_crush.GetTitledFirstName] v mládí prožili.\n\nI když [root_crush.GetFirstName] už [Select_CString(root_crush.IsFemale,'vstoupila','vstoupil')] do světa dospělých, vždycky mi bude [Select_CString(root_crush.IsFemale,'drahá','drahý')]!"
 childhood.0999.desc_unrequited: "Přestože mé city nikdy [Select_CString(root_crush.IsFemale,'neopětovala','neopětoval')]..."
 childhood.0999.a: "Mám štěstí, že jsem [root_crush.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'poznala','poznal')]."
 childhood.1000.t: "Hluboké přátelství"
 childhood.1000.desc: "[friend_to_crush.GetTitledFirstName] je opravdu [Select_CString(friend_to_crush.IsFemale,'dobrá kamarádka','dobrý kamarád')]!\n\nKdykoli jsme spolu, vždycky si to užívám a [friend_to_crush.GetFirstName] mi rozumí jako nikdo jiný.\n\nJsme sice skvělí přátelé, ale někdy přemýšlím, jestli od našeho vztahu přece jen nechci něco víc..."
 childhood.1000.a: "Myslím, že se mi [friend_to_crush.GetFirstName] líbí víc než jen jako [Select_CString(friend_to_crush.IsFemale,'kamarádka','kamarád')]!"
 childhood.1000.c: "[friend_to_crush.GetFirstName] je [Select_CString(friend_to_crush.IsFemale,'kamarádka','kamarád')], nic víc!"
 childhood.1000.b: "[Select_CString(ROOT.Char.IsFemale,'Přinesla','Přinesl')] jsem ti [friend_to_crush.Custom('FavoriteTreatDemand')]... nechceš se držet za ruku?"
 sweet_opinion: "Velmi milé"
 crush_crushed_hard: "[crush.GetFirstNameNoTooltip] už nechce být ani [Select_CString(crush.IsFemale,'kamarádka','kamarád')]..."
 risks_childhood.1000: "Nedá se říct, jak [friend_to_crush.GetFirstNameNoTooltip] zareaguje..."
 childhood.1001.t: "Poslední vzdor"
 childhood.1001.opening: "Nekonečné trápení od [bully.GetTitledFirstName] už musí přestat! [bully.GetFirstName] se mi bez milosti posmívá, strká do mě a ponižuje mě.\n\n"
 childhood.1001.desc: "Takhle to dál nejde! Je načase ukázat [bully.GetFirstName], s kým si zahrává."
 childhood.1001.fallback: "I když mě to všechno sráží, nedokážu [bully.GetFirstName] zastavit!"
 childhood.1001.a: "K tomu tvému chování..."
 childhood.1001.a.success: "[bully.GetTitledFirstNameNoTooltip] dostane pořádnou lekci"
 childhood.1001.a.failure: "[bully.GetTitledFirstNameNoTooltip] tě zbije"
 childhood.1001.b: "Promluvme si o tom, jak se chováš..."
 childhood.1001.b.success: "Přesvědčíš [bully.GetTitledFirstNameNoTooltip], aby tě přestal šikanovat"
 childhood.1001.c: "Proklínám tě, [bully.GetTitledFirstNameNoTooltip]."
 childhood.1001.d: "[adult_friend.GetFirstNameNoTooltip], jsi [Select_CString(adult_friend.IsFemale,'dospělá','dospělý')] – prosím, pomoz mi!"
 childhood.1002.t: "[Select_CString(guardian_parent.IsFemale,'Podporující matka','Podporující otec')]"
 childhood.1002.desc1: "Au! Když jsem si na zahradě [Select_CString(ROOT.Char.IsFemale,'hrála','hrál')] s [friend.GetTitledFirstName], [Select_CString(ROOT.Char.IsFemale,'upadla a odřela','upadl a odřel')] jsem si koleno. [guardian_parent.GetFirstName] si zrovna na druhém konci zahrady [Select_CString(guardian_parent.IsFemale,'užívala','užíval')] pěkného počasí a [friend.GetTitledFirstName] mě [Select_CString(friend.IsFemale,'pobídla','pobídl')], ať za [Select_CString(guardian_parent.IsFemale,'ní','ním')] zajdu."
 childhood.1002.desc2: "Au! Když jsem si [Select_CString(ROOT.Char.IsFemale,'hrála','hrál')] se svou oblíbenou hračkou [ROOT.Char.Custom('child_favorite_toy')], [Select_CString(ROOT.Char.IsFemale,'upadla a odřela','upadl a odřel')] jsem si koleno. Sotva jsem se [Select_CString(ROOT.Char.IsFemale,'zvedla','zvedl')], šla kolem [guardian_parent.GetFirstName] a hned se zeptala, jestli jsem v pořádku."
 childhood.1002.desc2_add: "\n\n„Buď [Select_CString(ROOT.Char.IsFemale,'statečná','statečný')], [ROOT.Char.Custom('GetDaughterSon')].“ řekne [guardian_parent.GetFirstName]. „Bude to dobré, jsem tady a pomůžu ti. Jen mě poslouchej a naučíš se, jak se tomu příště vyhnout.“"
 childhood.1002.desc3: "Čím hlouběji se nořím do knihy, kterou se mám učit, tím víc si uvědomuji, že některým jemnějším souvislostem vůbec nerozumím.\n\nBrzy mám její obsah vysvětlit [guardian_parent.GetFirstName], ale jestli budu pokračovat [Select_CString(ROOT.Char.IsFemale,'sama','sám')], můžu nad tou knihou strávit celou noc."
 childhood.1002.a: "[guardian_parent.GetFirstName], prosím, pomoz mi!"
 childhood.1002.b: "Zvládnu to [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 childhood.1002.b_1: "Nedopadne to dobře"
 childhood.1002.b_2: "Daří se ti skvěle"
 childhood.1003.t: "Úskalí dospívání"
 childhood.1003.desc1: "Užívám si pěkného počasí a poslouchám smích [child.GetTitledFirstName] a [friend.GetTitledFirstName], když najednou [child.GetFirstName] [Select_CString(child.IsFemale,'upadne a poraní','upadne a poraní')] si koleno. Po naléhání [friend.GetFirstName] za mnou [Select_CString(child.IsFemale,'přijde','přijde')] a požádá mě, abych se na zranění podíval."
 childhood.1003.desc2: "Procházím se zahradou a užívám si pěkného počasí, když spatřím [child.GetTitledFirstName], jak si při hraní s [child.Custom('child_favorite_toy')] odře koleno. Přijdu blíž a zeptám se, jestli je všechno v pořádku. [child.GetFirstName] mě požádá, abych se o zranění postaral."
 childhood.1003.desc3: "[child.GetTitledFirstName] jsem [Select_CString(ROOT.Char.IsFemale,'zadala','zadal')] náročný úkol: během několika dní přečíst složitou knihu. Večer předtím, než mi měl být její obsah představen, za mnou [child.GetFirstName] [Select_CString(child.IsFemale,'přišla','přišel')] a požádala mě o pomoc."
 childhood.1003.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že se na mě může spolehnout!"
 childhood.1004.t: "Unavená mysl"
 childhood.1004.desc: "„Spíš vůbec dost?“\n\nStarostlivá otázka od [guardian_parent.GetFirstName] mi připomene, že poslední dobou opravdu špatně spím. Neustálý tlak, abych všechno zvládal co nejlépe, je silnější než touha po spánku.\n\n[guardian_parent.GetFirstName] mi řekne, ať si vezmu večer volno a jdu brzy spát. Takovou nabídku [Select_CString(ROOT.Char.IsFemale,'ráda přijmu','rád přijmu')]."
 childhood.1004.a: "Děkuju, [guardian_parent.GetFirstName]."
 childhood.1004.b: "Dokonalá příležitost číst si v posteli!"
 childhood.1004.c: "Zůstanu vzhůru a vyrobím [guardian_parent.GetFirstName] dárek!"
 childhood.1005.t: "Unavená mysl"
 childhood.1005.desc: "„Co vlastně celý den děláš?!“\n\nVýčitka od [guardian_parent.GetFirstName] mě tíží. Snažím se splnit každý úkol, který dostanu, ale [guardian_parent.GetFirstName] jako by nikdy [Select_CString(guardian_parent.IsFemale,'nebyla spokojená','nebyl spokojený')]."
 childhood.1005.a: "Budu se snažit víc!"
 childhood.1005.b: "Už teď se snažím, jak nejvíc můžu."
 childhood.1005.c: "#EMP Nebudeš mi říkat, co mám dělat, [guardian_parent.GetFirstName]!#!"
 childhood.1006.t: "Když se střetnou protiklady"
 childhood.1006.desc: "[guardian_parent.GetFirstName] mě už nikdy nenechá na pokoji. Od chvíle, kdy [Select_CString(guardian_parent.IsFemale,'usoudila','usoudil')], že nejsem dost [Select_CString(ROOT.Char.IsFemale,'pilná','pilný')], si [Select_CString(guardian_parent.IsFemale,'vzala','vzal')] za své, že už mi nikdy nedovolí odpočívat.\n\nDokonce začne remcat pokaždé, když se pokusím vytratit na krátkého šlofíka!"
 childhood.1006.a: "[guardian_parent.GetFirstName] není nikdy [Select_CString(guardian_parent.IsFemale,'spokojená','spokojený')]!"
 childhood.1006.b: "Tak jo, zkusím to..."
 childhood.1006.c: "ZZZzzz#DIE1 zzz#!#DIE2 zzz...#!"
 childhood.1007.t: "Rostoucí stín"
 childhood.1007.opening: "[bully.GetTitledFirstName] je tak otravný!\n\n"
 childhood.1007.young_malicious: "Hrál jsem si se svou milovanou hračkou [ROOT.Char.Custom('child_favorite_toy')], když [bully.GetFirstName] vtrhl do místnosti a vyrval mi ji z rukou."
 childhood.1007.young_extroverted: "[bully.GetFirstName] o mně ostatním dětem pořád vypráví lži, aby mě měly méně rády."
 childhood.1007.young_dominant: "Když jsem si na zahradě hrál s ostatními dětmi, [bully.GetFirstName] najednou přišel a přikázal všem, aby si se mnou přestaly hrát."
 childhood.1007.young_emotional: "Jen jsem kolem [bully.GetFirstName] procházel chodbou, když se najednou [bully.GetFirstName] rozbrečel a začal tvrdit, že jsem ho udeřil."
 childhood.1007.malicious: "Procházel jsem se zahradou, když [bully.GetFirstName] najednou vyskočil ze zeleně a strčil mě do bláta. Celou dobu se mi ještě smál."
 childhood.1007.dominant: "[bully.GetFirstName] zřejmě přikázal ostatním dětem, aby se mi vyhýbaly, a teď všechny ztichnou, kdykoli se přiblížím. Vím, že je to vina [bully.GetFirstName] a ostatní děti to nemyslí zle, ale stejně to bolí."
 childhood.1007.extroverted: "Kdykoli dostane příležitost, [bully.GetFirstName] se ze všech sil snaží přesvědčit ostatní děti, že jsem hrozný člověk. Lže, vymýšlí si příběhy a jen já vím, že nic z toho není pravda."
 childhood.1007.fallback: "Když jsem kolem [bully.GetFirstName] procházel, najednou mi nastavil nohu a podrazil mě!"
 childhood.1007.end: "\n\n[bully.GetFirstName] mi nedá pokoj a já nevím, co mám dělat."
 childhood.1007.a: "[bully.GetFirstName] je úplně nejhorší!"
 childhood.1007.b: "[bully.GetFirstNameNoTooltip|U] #EMP přece musí#! dostat rozum!"
 childhood.1007.b.success: "[bully.GetFirstNameNoTooltip] nakonec dostane rozum"
 childhood.1007.b.failure: "[bully.GetFirstNameNoTooltip] tě začne šikanovat ještě víc"
 childhood.1007.c: "*#DIE1 Bručení#! #DIE2 bručení*#! Vyliju si vztek na [victim.GetFirstNameNoTooltip]..."
 childhood.1007.d: "Ne. #EMP Teď budu šikanovat já.#!"
 childhood.1007.d.success: "Obrátíš situaci proti [bully.GetFirstNameNoTooltip]"
 childhood.1007.d.failure: "[bully.GetFirstNameNoTooltip] nepoleví"
 childhood.1007.c.toast: "[child.GetFirstNameNoTooltip] tě šikanuje"
 childhood.1008.t: "Netradiční způsob úlevy"
 childhood.1008.opening: "[victim.GetTitledFirstName] je konečně k něčemu [Select_CString(victim.IsFemale,'dobrá','dobrý')]!\n\nPoslední dobou je život docela stresující, ale díky [victim.GetFirstName] se mi podařilo trochu uvolnit.\n\n"
 childhood.1008.1: "Potkali jsme se na chodbě a právě když [victim.GetFirstName] procházel kolem mě, nastavil jsem [Select_CString(victim.IsFemale,'jí','mu')] nohu a [Select_CString(victim.IsFemale,'podrazila','podrazil')] ji. Ten výraz ve tváři byl k nezaplacení!"
 childhood.1008.2: "Kdykoli spolu mluvíme, schválně zpochybňuji všechno, co [victim.GetFirstName] řekne, a dělám si legraci z každého závěru, ke kterému dospěje."
 childhood.1008.3: "Právě když se [victim.GetFirstName] při snídani [Select_CString(victim.IsFemale,'chystala','chystal')] zakousnout do chleba, pořádně jsem [Select_CString(victim.IsFemale,'ji','ho')] plácl do zad. Ten nepořádek na stole byl docela odporný, ale zvuk, který [Select_CString(victim.IsFemale,'vydala','vydal')], byl k popukání!"
 childhood.1008.a: "Člověk si aspoň trochu upustí páru!"
 childhood.1008.b: "A teď ještě pořádný výprask!"
 childhood.1008.c: "[extra_bully.GetFirstNameNoTooltip]! Pojď mi pomoct trápit toho [victim.Custom2('InsultAdjective', ROOT.Char)] [victim.Custom2('InsultNoun', ROOT.Char)]!"
 childhood.1009.t: "Starost přítele"
 childhood.1009.opening: "[friend.GetTitledFirstName] je [Select_CString(friend.IsFemale,'dobrá kamarádka','dobrý kamarád')]. [Select_CString(friend.IsFemale,'Všimla','Všiml')] si, že mě něco trápí, a [Select_CString(friend.IsFemale,'přesvědčila','přesvědčil')] mě, abych se [Select_CString(friend.IsFemale,'jí','mu')] se svými myšlenkami [Select_CString(ROOT.Char.IsFemale,'svěřila','svěřil')].\n\n"
 childhood.1009.1: "„Proč tu vlastně jsme? Jaký s námi má [ROOT.Char.GetFaith.FateGodName] plán?“"
 childhood.1009.2: "„Čím mám vlastně být, až vyrostu?“"
 childhood.1009.3: "„Jak můžeš vůbec vědět, jestli tě má někdo opravdu rád?“"
 childhood.1009.end: "\n\nUž jen to, že si o tom můžu s [friend.GetFirstName] promluvit, mi pomáhá cítit se lépe!"
 childhood.1009.a: "Mám štěstí, že mám tak dobrého přítele."
 childhood.1009.b: "Jsi tak [Select_CString(friend.IsFemale,'hodná','hodný')], že ti dám svou oblíbenou hračku - [ROOT.Char.Custom('child_favorite_toy')]!"
 gave_toy_opinion: "Darovaná hračka"
 childhood.1009.c: "Jsi tak [Select_CString(friend.IsFemale,'moudrá','moudrý')], [friend.GetFirstNameNoTooltip]. Povídej dál!"
 childhood.1010.t: "Pořád na mysli"
 childhood.1010.opening: "Nemůžu přestat myslet na [crush.GetTitledFirstName], na ten úsměv i způsob, jakým mluví.\n\n"
 childhood.1010.returned: "Už jen vědomí, že jsou mé city opětované, mi přináší velkou radost a uklidňuje mé srdce."
 childhood.1010.not_returned: "To, že [crush.GetFirstName] mé city zřejmě neopětuje, mě tíží u srdce."
 childhood.1010.a: "[Select_CString(crush.IsFemale,'Má drahá','Můj drahý')] [crush.GetTitledFirstNameNoTooltip]!"
 childhood.1010.b: "Ach, běda!"
 childhood.1010.c: "Láska je lež... #EMP lež!#!"
 childhood.1010.d: "[crush.GetFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'přinesla','přinesl')] jsem ti [ROOT.Char.Custom('SeductionGiftTypeIndefiniteSimple')]!"
 childhood.1010.d.effect: "Další dárek možná obměkčí srdce [crush.GetFirstNameNoTooltip]... nebo znovu zlomí to tvé"
 childhood.1010.e: "Ach, při pohledu na tebe mi srdce poskakuje radostí!"
 hopeless_romantic_modifier: "Beznadějný romantik"
 hopeless_romantic_modifier_desc: "Tato postava pevně věří v romantiku a dvorskou lásku už od mládí.\n[GetScheme('courting').GetTypeName] – [Concept('success_chance','šance na úspěch')|E]: #P +10%#!"
 childhood.1011.t: "Cesta srdce"
 childhood.1011.opening: "V poslední době si všímám, že mi [crush_returned.GetTitledFirstName] věnuje víc pozornosti než obvykle a oceňuje mé vtipy i názory.\n\n"
 childhood.1011.returned: "Je příjemné, když si mě někdo takhle váží, a začínám si díky tomu uvědomovat, jak [Select_CString(crush_returned.IsFemale,'milá','milý')] [crush_returned.GetFirstNameNoTooltip] vlastně [Select_CString(crush_returned.IsFemale,'dokáže být','dokáže být')].\n\nVlastně si myslím, že o [Select_CString(crush_returned.IsFemale,'ni','něj')] mám stejný zájem jako [Select_CString(crush_returned.IsFemale,'ona','on')] o mě!"
 childhood.1011.not_returned: "Ta pozornost je sice příjemná, ale už mi začíná lézt na nervy. Proč mi [crush_returned.GetFirstName] nedá pokoj?"
 childhood.1011.a: "[crush_returned.GetFirstNameNoTooltip], myslím, že se mi líbíš."
 childhood.1011.b: "[crush_returned.GetFirstName] mi začíná lézt na nervy."
 childhood.1011.c: "Ne, mé srdce si [Select_CString(true_crush.IsFemale,'získala','získal')] [true_crush.GetFirstNameNoTooltip]!"
 heartbroken_opinion: "Zlomené srdce"
 childhood.1012.t: "Krutý trest"
 childhood.1012.desc: "Vím, že se mi poslední dobou při studiu nedaří, a vím, že je ze mě [guardian_parent.GetFirstName] [Select_CString(guardian_parent.IsFemale,'zklamaná','zklamaný')]. Nikdy by mě ale nenapadlo, že zajde tak daleko a vezme mi mou milovanou oblíbenou hračku [ROOT.Char.Custom('child_favorite_toy')]!\n\n"
 childhood.1012.desc_2: "„A teď půjde do ohně.“ řekne [guardian_parent.GetFirstName] a hodí ji do plamenů. „Třeba si konečně rozmyslíš, jestli chceš dál být tak [Select_CString(ROOT.Char.IsFemale,'neschopná dcera','neschopný syn')].“\n\n"
 childhood.1012.desc2: "Nejhorší je, že [guardian_parent.GetFirstName] zřejmě vůbec nezajímalo, jak moc mě to trápí."
 childhood.1012.desc3: "Nejhorší je, že [guardian_parent.GetFirstName] jako by si mé trápení dokonce užíval."
 childhood.1012.a: "[guardian_parent.GetFirstName] dokáže být tak [Select_CString(guardian_parent.IsFemale,'krutá','krutý')]!"
 childhood.1012.b: "Jak... jak jsi #EMP [Select_CString(guardian_parent.IsFemale,'mohla','mohl')]!#! Nenávidím tě!"
 cruel_upbringing_modifier: "Krutá výchova"
 cruel_upbringing_modifier_desc: "Tato postava byla vychovávána v nedůvěře a krutosti."
 childhood.1013.t: "Zničení hračky - [victim.Custom('child_favorite_toy')|U]"
 childhood.1013.desc: "Na zahradě jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')] [victim.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('victim'))], jak si se smíchem a výskáním hraje s [victim.Custom('child_favorite_toy')].\n\n[victim.GetFirstName] neměl právo být tak [Select_CString(victim.IsFemale,'šťastná','šťastný')]. A co vůbec bylo na té hloupé hračce tak zvláštního? Když jsem ji [Select_CString(victim.IsFemale,'jí','mu')] vytrhl z rukou a rozbil, praskla úplně stejně jako každá jiná."
 childhood.1013.a: "Měli jste vidět ten výraz ve tváři!"
 childhood.1013.b: "Já... nemůžu uvěřit tomu, co jsem [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]... [Select_CString(ROOT.Char.IsFemale,'Byla jsem zlá holka','Byl jsem zlý kluk')]!#!"
 childhood.1014.t: "Zničení hračky [ROOT.Char.Custom('child_favorite_toy')|U]"
 childhood.1014.desc: "[bully.GetTitledFirstName], kdo mě neustále trápí, [Select_CString(bully.IsFemale,'zničila','zničil')] mou drahocennou hračku [ROOT.Char.Custom('child_favorite_toy')]! Když jsem si s ní [Select_CString(ROOT.Char.IsFemale,'hrála','hrál')], [bully.GetFirstName] ke mně klidně [Select_CString(bully.IsFemale,'přišla','přišel')], vytrhl mi ji z rukou a rozdupal ji.\n\n„Kdo si dneska vůbec ještě hraje s něčím jako [ROOT.Char.Custom('child_favorite_toy')]?“"
 childhood.1014.a: "[bully.GetFirstName] je [Select_CString(bully.IsFemale,'příšerná','příšerný')]!"
 childhood.1015.t: "Diplomatické řešení"
 childhood.1015.desc: "Na naléhání [educator.GetTitledFirstName] sledujeme s [study_friend.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))], probíhající vyjednávání o zapojení koruny do místní správy oblasti [province.GetName].\n\nBěhem jednání si nemůžu nevšimnout, že [province_holder.GetTitledFirstName] vůbec netuší, jak takové úsilí koordinovat. Tématu se už nějakou dobu věnuji, takže bych asi měl zasáhnout."
 childhood.1015.a: "„Kdybyste mě na chvíli poslouchali...“"
 childhood.1015.b: "Ještě se toho musím hodně naučit. Raději budu poslouchat."
 childhood.1015.b.tt: "Tím pokročí studium [Concept('diplomacy','diplomacie')|E] tobě i [study_friend.GetFirstNameNoTooltip]"
 childhood.1015.a.flavor: "Proč se smějí? Moje nápady jsou #MP skvělé!#!"
 childhood.1016.t: "Vojenské záležitosti"
 childhood.1016.desc: "S [study_friend.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))], v rámci studia sledujeme vojáky, kteří za městem svádějí cvičnou bitvu.\n\n„Teď je obejděte a zaútočte jim do boku!“ zakřičí [commander.GetTitledFirstName]. Než se naděju, udělám krok vpřed a [commander.GetFirstName] si mě všimne."
 childhood.1016.a: "„Vlastně si myslím, že přímý útok by fungoval lépe.“"
 childhood.1016.b: "Mávnu na [commander.GetFirstName], ať pokračuje. Měl bych se jen dívat."
 childhood.1016.b.tt: "Tím pokročí studium [Concept('martial','válečnictví')|E] tobě i [study_friend.GetFirstNameNoTooltip]"
 childhood.1017.t: "Obilná záležitost"
 childhood.1017.desc: "Vyjednávání s [province_holder.GetTitledFirstName] o hospodaření s obilím v oblasti [province.GetName] se táhne už celé hodiny. [study_friend.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))], po mně poslední půlhodinu pokukuje, takže alespoň vím, že v tom utrpení nejsem [Select_CString(ROOT.Char.IsFemale,'sama','sám')].\n\nKdyž všichni odejdou z místnosti na přestávku, všimnu si otevřené účetní knihy na stole. Na stránce jsou poznámky o nakládání s pšenicí a několika drobnými změnami bych mohl výrazně ovlivnit místní produkci."
 childhood.1017.a: "Copak se asi stane, když tahle čísla změním?"
 childhood.1017.a.tt: "Někdy se člověk učí z vlastních chyb. Tím pokročí studium [Concept('stewardship','správcovství')|E] tobě i [study_friend.GetFirstNameNoTooltip]"
 childhood.1017.b: "Raději to nechám být."
 childhood.1018.t: "Podezřelá záležitost"
 childhood.1018.desc: "Jestli se mi [educator.GetTitledFirstName] snaží něco vštípit do hlavy, pak to, že někdy je lež nezbytná.\n\nSe [study_friend.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))], zaslechneme, jak [province_holder.GetTitledFirstName] z oblasti [province.GetName] mluví o úpravě čísel v daňovém hlášení, která by mohla oblasti pomoci prosperovat. Hned si vzpomenu na to, co mě [educator.GetFirstName] [Select_CString(educator.IsFemale,'učila','učil')]."
 childhood.1018.a: "Tohle se musí dozvědět [educator.GetFirstNameNoTooltip]!"
 childhood.1018.a.tt: "Tím pokročí studium [Concept('intrigue','intrik')|E] tobě i [study_friend.GetFirstNameNoTooltip]"
 childhood.1018.b: "Ty peníze by se jim #EMP opravdu#! hodily."
 childhood.1019.t: "Číst, či nečíst"
 childhood.1019.desc: "Se [study_friend.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('study_friend'))], máme za úkol doručit hromadu knih vyslancům z [province.GetName]. Nutkání věnovat pár minut, nebo klidně pár dní, jejich studiu je téměř neodolatelné.\n\nA skutečnost, že jejich rychlé doručení je prý velmi důležité pro další produktivitu oblasti, naši zvědavost jen podněcuje."
 childhood.1019.a: "Postaráme se, aby byly knihy #EMP důkladně#! prostudovány."
 childhood.1019.a.tt1: "Tím pokročí studium [Concept('learning','učenosti')|E] tobě i [study_friend.GetFirstNameNoTooltip]"
 childhood.1019.a.tt2: "Tím pokročí studium [Concept('stewardship','správcovství')|E] tobě i [study_friend.GetFirstNameNoTooltip]"
 childhood.1019.b: "Knihy dorazí na místo včas!"
 childhood.2001.t: "Kotě"
 childhood.2001.desc_educator: "Když si venku hraju a [educator.GetTitledFirstName] na mě dohlíží, najednou něco zaslechnu. Je to slabounký, tichý zvuk, ale určitě tam je!"
 childhood.2001.desc: "Když si venku hraju, nedaleko je [ROOT.Char.Custom('TerrainType')]. Najednou něco zaslechnu. Je to slabounký, tichý zvuk, ale určitě tam je!"
 childhood.2001.desc_ending: "\n\nProhlédnu každý keř, nakouknu pod každý kámen, rozhlížím se na všechny strany a... tam! Pod trnitým keřem sedí úplně samotné maličké kotě."
 childhood.2001.a: "Teď je to moje koťátko!"
 childhood.2001.b: "[educator.GetTitledFirstNameNoTooltip] někdy vypadá tak [Select_CString(educator.IsFemale,'osamělá','osamělý')]..."
 childhood.2001.c: "Copak se asi skrývá uvnitř...!"
 gift_of_cat_opinion: "Darované kotě"
 gift_of_dog_opinion: "Darované štěně"
 childhood.2002.desc: "Jsem venku s [ward.GetTitledFirstName], když mi najednou zmizí z očí. Než se ale stačím začít doopravdy bát, [ward.GetFirstName] přiběhne zpátky a v rukou svírá malé kotě!\n\n„[educator.GetFirstNameNoTooltip], [educator.GetFirstNameNoTooltip]! Podívej, co jsem [Select_CString(ward.IsFemale,'našla','našel')]. To je dárek pro tebe!“"
 childhood.2002.a: "Děkuju!"
 childhood.2002.b: "Fuj, vrať to tam, kde jsi to [Select_CString(ward.IsFemale,'našla','našel')]."
 childhood.2002.c: "Ale jé, vždyť jsi [Select_CString(ward.IsFemale,'našla','našel')] #EMP můj#! dárek pro #EMP tebe#!! A jakpak nakládáme s dluhy?"
 childhood.2002.d: "Konečně něco, co můžu trápit!"
 childhood.2003.t: "Štěně"
 childhood.2003.desc_educator: "Jdu venku s [educator.GetTitledFirstName], když ho zaslechnu. Slabounký, tichý zvuk, plný strachu."
 childhood.2003.desc_friend: "Hraju si venku s [friend.GetTitledFirstName], když ho zaslechnu. Slabounký, tichý zvuk, plný strachu."
 childhood.2003.desc: "Hraju si venku, když ho zaslechnu. Slabounký, tichý zvuk, plný strachu."
 childhood.2003.desc_ending: "\n\nHledám všude, pod každým kamenem, za každým rohem i za každým keřem, až ho konečně najdu! Mezi dvěma kameny sedí úplně samotné malé štěně."
 childhood.2003.a: "Teď je to moje štěňátko!"
 childhood.2003.b: "Tady, [friend.GetFirstNameNoTooltip], vezmi si ho."
 childhood.2003.c: "[educator.GetTitledFirstNameNoTooltip] někdy vypadá tak [Select_CString(educator.IsFemale,'osamělá','osamělý')]..."
 childhood.2003.d: "Copak se asi skrývá uvnitř...!"
 childhood.2004.desc: "Jsem venku s [ward.GetTitledFirstName], když mi najednou zmizí z očí. Než se ale stačím začít doopravdy bát, [ward.GetFirstName] přiběhne zpátky a v rukou svírá malé štěně!\n\n„[educator.GetFirstNameNoTooltip], [educator.GetFirstNameNoTooltip]! Podívej, co jsem [Select_CString(ward.IsFemale,'našla','našel')]. To je dárek pro tebe!“"
 childhood.2005.desc: "Hraju si venku s [ward.GetTitledFirstName], když mi [ward.GetFirstName] najednou zmizí z očí. Poblíž je [ROOT.Char.Custom('TerrainType')]. Kam se [Select_CString(ward.IsFemale,'poděla','poděl')]? Otáčím se kolem dokola a hledám, když se [ward.GetFirstName] náhle znovu objeví a natahuje ke mně malé štěně.\n\n„[friend.GetFirstNameNoTooltip]! Je pro tebe!“"
 childhood.2005.a: "Štěňátko!!!"
 childhood.2005.b: "Fuj, dej to pryč."
 childhood.2006.desc: "Hraju si venku s [ward.GetTitledFirstName], když mi [ward.GetFirstName] najednou zmizí z očí. Poblíž je [ROOT.Char.Custom('TerrainType')]. Kam se [Select_CString(ward.IsFemale,'poděla','poděl')]? Otáčím se kolem dokola a hledám, když se [ward.GetFirstName] náhle znovu objeví a natahuje ke mně malé kotě.\n\n„[friend.GetFirstNameNoTooltip]! Je pro tebe!“"
 childhood.2006.a: "Koťátko!!!"
 childhood.2006.b: "Fuj, dej to pryč."
 childhood.2010.t: "Očekávání"
 childhood.2010.desc_opening: "„Vždycky tu pro mě jsi a doufám, že víš, jak moc si toho vážím.“\n\n"
 childhood.2010.desc_shy: "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou přichází v nezvyklém záchvatu odvahy a otevřenosti."
 childhood.2010.desc_mean: "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou přichází v nezvykle upřímné chvíli."
 childhood.2010.desc_proud: "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou přichází a nezvykle otevřeně dává najevo své uznání."
 childhood.2010.desc_fallback: "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou přichází v nezvykle zamyšlené náladě."
 childhood.2010.a: "Až budu potřebovat pomoc já, očekávám, že tu pro mě budeš také."
 childhood.2010.b: "Od toho přece poručník je."
 childhood.2011.desc: "[guardian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se v poslední době věnuje mému vzdělání obzvlášť usilovně. Jsem za to [Select_CString(ROOT.Char.IsFemale,'vděčná','vděčný')], ale zároveň mi bylo jasně řečeno, že jednou budu muset všechnu tu námahu oplatit. Tak se to zkrátka dělá. A nejspíš je to tak správně."
 childhood.2011.tt: "Tvé vzdělání se mírně zlepší"
 childhood.2011.a: "Koneckonců je to můj učitel."
 childhood.2100.t: "J jako jazyk"
 childhood.2100.desc: "[educator.GetTitledFirstName] mě učí dobře. Občas zaslechnu, jak mluví jazykem [educator.GetCulture.GetLanguage.GetNameNoTooltip]. Myslím, že právě tím se mluví u [Select_CString(educator.IsFemale,'ní','něj')] doma.\n\nSe mnou sice většinou mluví jazykem [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], ale zároveň se mě snaží naučit i něco ze svého mateřského jazyka.\n\nUdržet v hlavě dva jazyky je těžké... ale možná to za tu námahu stojí?"
 childhood.2100.a: "Měl bych poslouchat a soustředit se. Třeba se něco naučím?"
 childhood.2100.b_hash: "Ne, radši si půjdu hrát!"
 learn_language_ongoing.2100.a.success: "Naučíš se jazyk, kterým mluví [educator.GetFirstNameNoTooltip]"
 learn_language_ongoing.2100.a.success_parent: "[ward.Custom('GetDaughterSon')|U] se naučí nový jazyk!"
 learn_language_ongoing.2100.a.success_parent_desc: "[educator.GetFirstNameNoTooltip] naučil [ward.GetFirstName] [Concept('language','jazyk')|E] [educator.GetCulture.GetLanguage.GetName]"
 learn_language_ongoing.2100.a.failure: "Nepodaří se ti naučit jazyk, kterým mluví [educator.GetFirstNameNoTooltip]"
 childhood.2200.t: "Mluvíš mou řečí?"
 childhood.2200.desc: "Když doprovázím [educator.GetNameNoTooltip], všímám si, jak kolem mě zaznívá jazyk našeho dvora, a kupodivu mu začínám rozumět. Když se budu snažit, mohl bych se v našem dvorním jazyce pořádně zdokonalit!"
 childhood.2200.a: "Umím mluvit jako dospělí!"
 childhood.2200.b: "To je nuda, prostě mluv jazykem [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!"
 childhood.2300.t: "Jazyky mé rodiny"
 childhood.2300.desc: "[parent.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('parent'))], občas do řeči prohodí nějaké slovo z jazyka [parent.GetCulture.GetLanguage.GetName] a já mu začínám čím dál lépe rozumět. Když se budu snažit, určitě se ho naučím natolik, abych si s [parent.GetFirstName] mohl povídat úplně novým způsobem!"
 childhood.2300.a: "Budu mluvit stejně jako [parent.Custom('GetMamaPapa')]!"
 childhood.2300.b: "To je nuda! K čemu se vůbec učit jazyk [parent.GetCulture.GetLanguage.GetNameNoTooltip]!?"
 childhood.2300.a.success_parent_desc: "[ward.GetFirstName] se pozorováním naučil [Concept('language','jazyk')|E] [parent.GetCulture.GetLanguage.GetName]."
 childhood.2400.t: "Věk rozumu"
 childhood.2400.desc: "Vzdělávat [questioning_ward.GetFirstName] je obohacující, ale ne vždy snadné. Ještě dnes chtěl jen „položit pár jednoduchých otázek o [ROOT.Char.GetFaith.GetName]“, ale z nevinných dotazů se rychle staly vážné pochybnosti o naší víře.\n\nZačíná snad [questioning_ward.GetFirstNameNoTooltip] #EMP pochybovat#! o [ROOT.Char.GetFaith.GetNameNoTooltip]?"
 childhood.2400.a.neutral: "Pokusím se tvé pochybnosti rozptýlit."
 childhood.2400.a.zealous: "Tyhle pochybnosti ti vyženu z hlavy."
 childhood.2400.a.toast.succ: "[questioning_ward.GetTitledFirstName] přijme tvé argumenty o víře"
 childhood.2400.a.toast.fail: "[questioning_ward.GetTitledFirstName] stále pochybuje"
 childhood.2400.b: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))|U] [realm_priest.GetFirstNameNoTooltip] dokáže na tyto otázky odpovědět lépe."
 childhood.2400.b.toast.succ: "[ROOT.Char.Custom('MyPriestTitle')|U] [realm_priest.GetFirstName] přesvědčí [questioning_ward.GetTitledFirstName]"
 childhood.2400.b.toast.fail: "[ROOT.Char.Custom('MyPriestTitle')|U] [realm_priest.GetFirstName] nedokáže přesvědčit [questioning_ward.GetTitledFirstName]"
 childhood.2400.c: "Vlastně #EMP máš#! pravdu..."
 childhood.2400.d: "Neměl jsi mi to říkat, [questioning_ward.GetFirstNameNoTooltip]."
 childhood.2410.desc.intro: "[questioning_ward.GetFirstNameNoTooltip] si úlevně oddechne a já také. Když se navzájem svěříme se svou nevírou, vztah mezi "
 childhood.2410.desc.parentchild: "[ROOT.Char.Custom('MotherFather')] a [questioning_ward.Custom('GetDaughterSon')]"
 childhood.2410.desc.guardianward: "poručníkem a svěřencem"
 childhood.2410.desc.outro: " se o něco upevní."
 childhood.2410.a: "Tohle zůstane naším tajemstvím."
