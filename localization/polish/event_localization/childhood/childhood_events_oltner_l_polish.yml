l_polish:
 childhood.7000.t: "[stolen_clothes.GetFirstNameNoTooltip] a malý žertík"
 childhood.7000.desc: "Pro mě je [stolen_clothes.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stolen_clothes'))], ale poslední dobou působí nějak... #EMP upjatě#!, řekl bych! Každý den bere všechno až příliš vážně a neustále řeší jednu dvorskou záležitost za druhou. Možná bych měl trochu #EMP odlehčit#! náladu?\n\n"
 childhood.7000.desc_child: "Vím, že [child_helper.GetFirstName] by do mého #EMP zákeřného plánu#! [Select_CString(child_helper.IsFemale,'šla','šel')] se mnou, stačí říct.\n\n"
 childhood.7000.desc_end: "Jak by asi [stolen_clothes.GetFirstNameNoTooltip] [Select_CString(stolen_clothes.IsFemale,'reagovala','reagoval')], kdyby všechny šaty najednou... „zmizely“? #EMP *chichot*#!"
 childhood.7000.a: "Vplížím se do komnat [stolen_clothes.GetFirstName] a ukradnu všechny šaty!"
 childhood.7000.b: "[child_helper.GetFirstNameNoTooltip], odlákáš [stolen_clothes.GetFirstName]. #EMP Jdeme na to!#!"
 childhood.7000.c: "Ne, měl bych být [Select_CString(ROOT.Char.IsFemale,'hodná','hodný')]. Dej si pauzu, [stolen_clothes.GetFirstNameNoTooltip]."
 childhood.7000.d: "Hm, teď není vhodná chvíle..."
 childhood.7000.a.success: "Ukradneš šaty"
 childhood.7000.a.failure: "[stolen_clothes.GetFirstName] tě přistihne při činu"
 childhood.7001.desc_helper: "Úspěch! [child_helper.GetFirstName] [Select_CString(child_helper.IsFemale,'odlákala','odlákal')] [stolen_clothes.GetFirstName]. Brzy ráno jsme vsadili na jednoduchý trik: [ROOT.Char.Custom('GetLivestockFowlIndef')] v ložnici! Zatímco se všechna pozornost upírala jinam, [Select_CString(ROOT.Char.IsFemale,'sebrala','sebral')] jsem každý kus oblečení, který jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')]!"
 childhood.7001.desc_nohelper: "Úspěch! Podařilo se mi vplížit do ložnice [stolen_clothes.GetFirstNamePossessiveNoTooltip] a sebrat všechny šaty dřív, než se [stolen_clothes.GetFirstNameNoTooltip] [Select_CString(stolen_clothes.IsFemale,'probudila','probudil')]! "
 childhood.7001.desc_angry: "[stolen_clothes.GetFirstNameNoTooltip] vyskočí z postele vzteky bez sebe a rozběhne se za mnou chodbou, aniž by měl na sobě jedinou nit!\n\n„Ty otravné děcko! Okamžitě mi vrať šaty, nebo ti zakroutím krkem!“ křičí [stolen_clothes.GetFirstNameNoTooltip] a [Select_CString(stolen_clothes.IsFemale,'soptí','soptí')] vzteky.\n\nMůj důvtipný žert možná [stolen_clothes.GetFirstNameNoTooltip] nepobavil, ale všichni ostatní ho považovali za #EMP k popukání!#!"
 childhood.7001.desc_funny: "[stolen_clothes.GetFirstNameNoTooltip] rychle vyskočí z postele a rozběhne se za mnou chodbou bez jediného kousku oblečení!\n\n„Dítě! Vrať mi ty šaty, na tohle nemám čas!“ křičí [stolen_clothes.GetFirstNameNoTooltip] a doběhne až do hlavního sálu, kde se teprve zastaví a uvědomí si, co právě [Select_CString(stolen_clothes.IsFemale,'udělala','udělal')]!\n\nVšichni, včetně [stolen_clothes.GetFirstNameNoTooltip], shledali celou situaci #EMP nesmírně#! zábavnou a smáli se, až jim zrudly tváře."
 childhood.7001.a: "A udělám to znovu! A znovu! A #EMP znovu!#!"
 childhood.7001.b: "Bez tebe bych to [Select_CString(ROOT.Char.IsFemale,'nezvládla','nezvládl')], [child_helper.GetFirstNameNoTooltip]!"
 childhood.7001.c: "Dobrý žert vždycky stojí za to!"
 childhood.7002.desc_helper: "Ale ne! Plán byl jednoduchý: [ROOT.Char.Custom('GetLivestockFowlIndef')] v ložnici [stolen_clothes.GetFirstNamePossessiveNoTooltip]. Jenže zrada! Jakmile jsme vešli, ozval se hlasitý skřek a [stolen_clothes.GetFirstNameNoTooltip] okamžitě [Select_CString(stolen_clothes.IsFemale,'vyskočila','vyskočil')] z postele a [Select_CString(stolen_clothes.IsFemale,'spatřila','spatřil')] nás.\n\n"
 childhood.7002.desc_nohelper: "K čertu! Sotva se vplížím dovnitř, [stolen_clothes.GetFirstNameNoTooltip] otevře oči dokořán a vyskočí z postele!\n\n"
 childhood.7002.desc_angry: "[stolen_clothes.GetFirstNameNoTooltip] bleskově popadne plný nočník a s neuvěřitelnou přesností ho po mně mrští. S hlasitým #flatulence žbluňknutím#! jsem od hlavy k patě [Select_CString(ROOT.Char.IsFemale,'pokrytá','pokrytý')] tím, co může být jedině #EMP několika nocemi#! nahromaděných výkalů!\n\n„To tě naučí mě rušit! Vypadni odsud, nebo dostaneš další dávku!“ křičí [stolen_clothes.GetFirstNameNoTooltip]."
 childhood.7002.desc_funny: "„Tak poslouchej!“ řekne [stolen_clothes.GetFirstNameNoTooltip] a pevně mě chytí za ucho. „Nemůžeš jen tak chodit a krást lidem šaty! Už dávno potřebuješ pořádnou lekci slušného chování...“\n\nAle ne, jen ne #EMP slušné chování!#!"
 childhood.7002.a: "#EMP Ne! Fujjjjj!#!"
 childhood.7002.b: "Už se to nikdy nestane, slibuju!"
 childhood.7002.c: "To nebyl můj nápad! To #EMP všechno#! [child_helper.GetFirstNameNoTooltip]!"
 bully_stops: "[bully.GetFirstName] tě přestane šikanovat"
 skill_increased: "Dovednost zvýšena"
 funny_opinion: "Vtipný"
 childhood.7100.t: "Otřesný výjev"
 childhood.7100.desc: "Když si hraju na nádvoří, všimnu si, jak si [child_to_annihilate.GetFirstName] hraje s několika dalšími dětmi.\n\n"
 childhood.7100.killed_by_sow: "Najednou [child_to_annihilate.GetFirstNameNoTooltip] proběhne kolem nedalekého chlívku a mohutná prasnice se zakousne do paže. Nepouští. Odvracím zrak, zatímco křik sílí a sílí, až nakonec utichne.\n\n"
 childhood.7100.kicked_by_horse: "Když se [child_to_annihilate.GetFirstNameNoTooltip] přiblíží ke koni, ten bez varování vykopne. [child_to_annihilate.GetFirstNameNoTooltip] odletí několik metrů a zůstane bez hnutí ležet na zemi v tratolišti krve.\n\n"
 childhood.7100.kicked_by_camel: "Když se [child_to_annihilate.GetFirstNameNoTooltip] přiblíží k velbloudovi, ten bez varování vykopne. [child_to_annihilate.GetFirstNameNoTooltip] odletí několik metrů a zůstane bez hnutí ležet na zemi v tratolišti krve.\n\n"
 childhood.7100.stomped_by_elephant: "Když [child_to_annihilate.GetFirstNameNoTooltip] míjí slona, zvíře se bez varování vzepne a divoce zatroubí. Jedna mohutná noha dopadne přímo na místo, kde [child_to_annihilate.GetFirstNameNoTooltip] stojí, a přirazí dítě k zemi.\n\n"
 childhood.7100.smashed_by_roof_tile: "Když [child_to_annihilate.GetFirstNameNoTooltip] prochází pod nedalekou budovou, náhle se uvolní těžká střešní taška. S hlasitým #EMP žuchnutím#! dopadne přímo na hlavu. [child_to_annihilate.GetFirstNameNoTooltip] se okamžitě zhroutí k zemi.\n\n"
 childhood.7100.desc_end: "Náhlé ticho brzy vystřídají zděšené výkřiky přihlížejících. Jak je něco takového vůbec možné!? [ROOT.Char.GetFaith.HighGodName]... proč?!"
 death_sow: "[Select_CString(CHARACTER.IsFemale,'zemřela','zemřel')] po pokousání prasnicí"
 death_horse: "[Select_CString(CHARACTER.IsFemale,'zemřela','zemřel')] po kopnutí koně"
 death_camel: "[Select_CString(CHARACTER.IsFemale,'zemřela','zemřel')] po kopnutí velblouda"
 death_roof_tile: "[Select_CString(CHARACTER.IsFemale,'zemřela','zemřel')] po zásahu padající střešní taškou"
 childhood.7100.a: "C... cože!? N... ne!"
 childhood.7100.b: "...#DIE1 ha#!haHA! Viděli jste to všichni?!"
 childhood.7100.c: "No a?"
 childhood.7100.d: "M... můžeš mě chvíli obejmout, [friend_to_comfort.GetFirstNameNoTooltip]?"
 childhood.7100.d.friend: "[friend_to_comfort.GetFirstNameNoTooltip] se tě snaží co nejlépe utěšit"
 childhood.7200.t: "Jazyková bariéra"
 childhood.7200.desc: "Hrozně mě baví hrát si s [language_friend.GetFirstName], ale někdy je těžké rozumět tomu, co říká...\n\nGesta a grimasy sice úplně stačí, ale byla by to mnohem větší zábava, kdybych se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] jazyk „[language_friend.GetCulture.GetLanguage.GetNameNoTooltip]“ a mohli jsme si spolu opravdu povídat!\n\nMožná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] pořádně učit kvůli [language_friend.GetFirstNamePossessiveNoTooltip]?"
 childhood.7200.a: "Budu studovat dnem i nocí!"
 childhood.7200.b: "Hm, nechám sluhu, aby nám předčítal báje v jazyce „[language_friend.GetCulture.GetLanguage.GetNameNoTooltip]“."
 childhood.7200.c: "Ne, to je moc práce. A navíc si musím #EMP hrát#!!"
 entertained_opinion: "Pobavení"
 childhood.7300.t: "„Příprava“ na budoucnost"
 childhood.7300.desc: "Brzy budu skutečně vládnout, bez dozoru vrtkavých opatrovníků a vševědoucích učitelů... a až ten den přijde, musím se postarat, abych měl své poddané pevně v hrsti.\n\n[beating_target_1.GetTitledFirstName] je [Select_CString(beating_target_1.IsFemale,'slabá a poddajná','slabý a poddajný')]. Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že má zastrašující přítomnost by zajistila, že mi v budoucnu bude... #EMP věrně#! sloužit.\n\n"
 childhood.7100.beating_target_2: "Nebo si snad mou pozornost zaslouží spíš [beating_target_2.GetTitledFirstName]? I [beating_target_1.GetTitledFirstName] je [Select_CString(beating_target_1.IsFemale,'slabá','slabý')].\n\n"
 childhood.7100.beating_target_3: "A pak je tu ještě [beating_target_3.GetTitledFirstName]. Stačí na [Select_CString(beating_target_3.IsFemale,'ni','něj')] pořádně #EMP zírat#! a [Select_CString(beating_target_3.IsFemale,'podvolí','podvolí')] se! "
 childhood.7300.desc_end: "Tolik možností..."
 childhood.7300.a: "[beating_target_1.GetFirstNameNoTooltip], seznam se s mými pěstmi!"
 childhood.7300.b: "Pojď sem, [beating_target_2.GetFirstNameNoTooltip]..."
 childhood.7300.c: "Nic osobního, [beating_target_3.GetFirstNameNoTooltip], je to jen obchod."
 childhood.7300.d: "Tohle je pod mou úroveň..."
 childhood.7300.a.success: "Zastrašíš [beating_target_1.GetFirstNameNoTooltip]"
 childhood.7300.a.failure: "Nepodaří se ti zastrašit [beating_target_1.GetFirstNameNoTooltip]"
 childhood.7300.b.success: "Zastrašíš [beating_target_2.GetFirstNameNoTooltip]"
 childhood.7300.b.failure: "Nepodaří se ti zastrašit [beating_target_2.GetFirstNameNoTooltip]"
 childhood.7300.c.success: "Zastrašíš [beating_target_3.GetFirstNameNoTooltip]"
 childhood.7300.c.failure: "Nepodaří se ti zastrašit [beating_target_3.GetFirstNameNoTooltip]"
 childhood.7400.t: "Ochrana před tyranem"
 childhood.7400.desc: "Ale ne... [bully.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bully'))], je zase tady. Chci si jen v klidu hrát, proč mi nedá pokoj!\n\n„Co to děláš, ty #EMP [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))]!?#!“ zařve mi [bully.GetFirstNameNoTooltip] přímo do tváře."
 childhood.7400.desc_2: "\n\nNajednou cítím poklepání na rameni. „[bully.GetFirstName] tě zase obtěžuje?“ zeptá se klidným hlasem [bodyguard.GetFirstName], můj tělesný strážce. „[Select_CString(bully.IsFemale,'Mám jí dát lekci slušného chování?','Mám mu dát lekci slušného chování?')]“"
 childhood.7400_father_dead: "„Ty jsi ale [ROOT.Char.Custom2('InsultAdjective'), bully] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))]! A mimochodem... tvůj otec je mrtvý! Ha ha!“"
 childhood.7400_mother_dead: "„Ty jsi ale odporný [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))]! A mimochodem... tvoje matka je mrtvá! Ha ha!“"
 childhood.7400_none_dead: "„Ty jsi ale prohnilý [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bully'))], nikdo si s tebou nechce hrát!“"
 childhood.7400.a: "Odteď uděláš všechno, co ti řeknu. Rozumíš?"
 childhood.7400.b: "[bodyguard.GetFirstNameNoTooltip], dej [Select_CString(bully.IsFemale,'jí','mu')] co proto!"
 childhood.7400.c: "Musíš se naučit chovat hezky."
 every_parent_of_bully: "Každý rodič postavy [bully.GetFirstName]"
 childhood.7500.t: "Příběh z minulosti"
 childhood.7500.desc: "„Pojď blíž, chci ti něco vyprávět.“ [guardian.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))], mi pokyne, abych se [Select_CString(ROOT.Char.IsFemale,'posadila','posadil')] blíž k ohni.\n\n"
 childhood.7500.participant: "„Je to příběh o tom, jak [guardian_memory.GetDescription]. Ano, [guardian.Custom2('RelationToMe', SCOPE.sC('memory_participant'))]...“"
 childhood.7500.participant_dead: "„Je to příběh o tom, jak [guardian_memory.GetDescription]. [memory_participant.GetFirstName], [guardian.Custom2('RelationToMe', SCOPE.sC('memory_participant'))]... [memory_participant.GetDeathReason]...“"
 childhood.7500.no_participant: "„Je to příběh o tom, jak [guardian_memory.GetDescription]...“"
 childhood.7500.midpoint: "[guardian.GetFirstNameNoTooltip] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('guardian'))] a pokračuje ve vyprávění, zatímco plameny táboráku olizují noční oblohu."
 childhood.7500.family: "\n\n„...pamatuj, jak důležitá je rodina, [ROOT.Char.GetFirstNameNoTooltip]. Jméno rodu [ROOT.Char.GetHouse.GetNameNoTooltip] nos s hrdostí. #EMP [ROOT.Char.GetHouse.GetMotto].#!“"
 childhood.7500.martial: "\n\n„...zdokonaluj své schopnosti, bojové umění i důvtip. [ROOT.Char.GetFirstNameNoTooltip], nepřátel budeš mít bezpočet, proto trénuj, abys je [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] porazit.“"
 childhood.7500.death: "\n\n„...drahé dítě, [ROOT.Char.GetFirstNameNoTooltip], pamatuj na ponaučení z mého příběhu. Smrt si přijde pro nás všechny... postarej se, aby si pro tvé nepřátele přišla dřív než pro tebe.“"
 childhood.7500.war: "\n\n„...válečné běsnění prověří odhodlání každého člověka. Pamatuj, [ROOT.Char.GetFirstNameNoTooltip], skutečná strategie vyžaduje lstivost.“"
 childhood.7500.relationships: "\n\n„...na lidech kolem tebe záleží. Na přátelích, rádcích, dokonce i na soupeřích. Drž si je nablízku, a své nepřátele obzvlášť.“"
 childhood.7500.childhood: "\n\n„...a to je příběh z mého vlastního dětství! Ach, připadám si tak [Select_CString(guardian.IsFemale,'stará','starý')].“"
 childhood.7500.a: "To byl příběh, [guardian.GetFirstNameNoTooltip]."
 childhood.7500.b: "#DIE2 ...z#!#DIE1 z#!zZ"
 culture_tradition_events.2100.t: "Příběh u ohně"
 culture_tradition_events.2100.b: "Tvé příběhy mi vždycky zvednou náladu. Opravdu."
