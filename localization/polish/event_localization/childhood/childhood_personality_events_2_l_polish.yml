l_polish:
 child_personality.7000.t: "Ukradený soudek"
 child_personality.7000.desc: "„Podívej, co jsem [Select_CString(other_child.IsFemale,'našla','našel')], [child.GetFirstNameNoTooltip]! Celý soudek! Je v něm [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')|l]! [Select_CString(other_child.IsFemale,'Vzala','Vzal')] jsem ho, když se kuchaři nedívali.“ [other_child.GetFirstName] se na mě šibalsky podívá.\n\n„Na co čekáš? Vypijme ho, než si někdo všimne, že zmizel!“ zvolá [other_child.GetFirstNameNoTooltip].\n\nLákavá nabídka... ale je to správné?"
 child_personality.7000.a: "Dej ho sem. Všechno vrátím na místo [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 child_personality.7000.b: "To je pravé přátelství, [other_child.GetFirstNameNoTooltip]. Do dna!"
 child_personality.7000.c: "Ne, tohle není pro mě. Ale ty se klidně napij."
 child_personality.7001.t: "$child_personality.7000.t$"
 child_personality.7001.desc: "„[Select_CString(cook.IsFemale,'Přistihla','Přistihl')] jsem je, jak se schovávají ve skladu potravin!“ rozkřikne se na mě rozzuřeně [cook.GetFirstName], zatímco před sebou žene [child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], a [other_child.GetFirstName].\n\n"
 child_personality.diligent.desc: "„[other_child.GetFirstNameNoTooltip] [Select_CString(other_child.IsFemale,'ukradla','ukradl')] #EMP celý#! soudek! Byl v něm [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]! [child.GetFirstNameNoTooltip] se ho [Select_CString(child.IsFemale,'pokusila','pokusil')] vrátit úplně [Select_CString(child.IsFemale,'sama','sám')], než si toho všimnu, ale žádné štěstí!“ rozčiluje se [cook.GetFirstNameNoTooltip].\n\nZdá se, že [Select_CString(child.IsFemale,'má svěřenkyně je malá potížistka, která ale nakonec dostala rozum','můj svěřenec je malý potížista, který ale nakonec dostal rozum')]!"
 child_personality.gregarious.desc: "„Ukradli #EMP celý#! soudek! Byl v něm [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] a většinu vypili. Jen se na ně podívejte! Sotva se drží na nohou!“ rozčiluje se [cook.GetFirstNameNoTooltip].\n\nZdá se, že se [child.GetFirstName] [Select_CString(child.IsFemale,'nechala','nechal')] strhnout společností, ale alespoň mezi [child.GetFirstNameNoTooltip] a [other_child.GetFirstNameNoTooltip] očividně vzniklo pevné přátelství."
 child_personality.temperate.desc: "„Ukradli #EMP celý#! soudek! Byl v něm [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')], a zatímco [other_child.GetFirstNameNoTooltip] se [Select_CString(other_child.IsFemale,'málem upila','málem upil')] do bezvědomí, [child.GetFirstNameNoTooltip] tam jen [Select_CString(child.IsFemale,'seděla','seděl')] a díval se!“ rozčiluje se [cook.GetFirstNameNoTooltip].\n\nZdá se, že [child.GetFirstName] [Select_CString(child.IsFemale,'kryla','kryl')] svého komplice a držel hlídku, ale alkoholu se [Select_CString(child.IsFemale,'sama ani nedotkla','sám ani nedotkl')]."
 child_personality.7001.diligent: "[Select_CString(child.IsFemale,'Sama','Sám')]? To je od tebe velmi svědomité! Tak se pozná [child.Custom('GirlBoy')|l] s dobrým vychováním."
 child_personality.7001.gregarious: "Ha! Ty sis to ale #EMP pořádně#! [Select_CString(child.IsFemale,'užila','užil')], co?"
 child_personality.7001.temperate: "Bylo od tebe velmi rozumné, že ses alkoholu [Select_CString(child.IsFemale,'nedotkla','nedotkl')]."
 child_personality.7001.change.diligent: "Někdo se tu musí naučit nést odpovědnost za své činy."
 child_personality.7001.change.gregarious: "Tak poslouchej, pití je klíčem k #EMP veselí#! a #EMP zábavě#!!"
 child_personality.7001.change.temperate: "Odteď se alkoholu vyhýbej, rozumíš?"
 spoilsport_opinion: "Kazisvět"
 child_personality.7010.t: "Kázání"
 child_personality.7010.desc: "„Poslouchejte, děti! Dnes vám povím o mnoha věcech. [ROOT.Char.GetFaith.HighGodName] je teprve začátek! Přijde na řadu [ROOT.Char.GetFaith.PositiveAfterLife], [ROOT.Char.GetFaith.NegativeAfterLife], a dokonce i #EMP [ROOT.Char.GetFaith.DevilName]#!!“ zvolá [sermon_priest.GetFirstName] s planoucím zápalem v očích.\n\nSpolu s ostatními dětmi hltám každé slovo. Kdo by byl řekl, že [ROOT.Char.GetFaith.ReligiousText] může být tak #EMP fascinující!#!\n\nKdyž kázání skončí, musím [sermon_priest.GetFirstNameNoTooltip] říct, co si o něm myslím."
 child_personality.7010.a: "„[ROOT.Char.GetFaith.HighGodName|U] bude #EMP navždy#! v mém srdci, [sermon_priest.GetFirstNameNoTooltip]!“"
 child_personality.7010.b: "„A jak to bylo s tím #EMP ‚[ROOT.Char.Custom('GetQueenKing')] vládne z boží vůle‘#!?“"
 child_personality.7010.c: "„[ROOT.Char.GetFaith.DevilName] zní #EMP docela inspirativně!#!“"
 child_personality.7011.t: "$child_personality.7010.t$"
 child_personality.7011.desc: "Dnes [sermon_priest.GetFirstName] [Select_CString(sermon_priest.IsFemale,'pronesla','pronesl')] před všemi dětmi u dvora ohnivé kázání. Podle všeho ani nedutaly, když [Select_CString(sermon_priest.IsFemale,'horlivě vykládala','horlivě vykládal')] a středem celého kázání byl [sermon_priest.GetFaith.ReligiousText].\n\n[child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], "
 child_personality.zealous.desc: "si to [Select_CString(child.IsFemale,'vzala','vzal')] k srdci, možná až #EMP příliš#!. Už celé hodiny pronásleduje služebnictvo a vysvětluje, jak má správně vypadat život těch, kdo jsou [child.GetFaith.GetAdherentNamePlural]..."
 child_personality.ambitious.desc: "je teď [Select_CString(child.IsFemale,'pevně přesvědčená','pevně přesvědčený')], že [Select_CString(child.IsFemale,'ji','ho')] čeká velikost, a tvrdí, že [child.GetFaith.HighGodName] stojí vždy na [Select_CString(child.IsFemale,'její','jeho')] straně."
 child_personality.sadistic.desc: "mi pořád vypráví, jak moc se [Select_CString(child.IsFemale,'jí','mu')] líbily pasáže o #EMP [child.GetFaith.DevilName]#! a že právě [child.GetFaith.DevilName] představuje ideál, kterým se chce řídit..."
 child_personality.7011.zealous: "Silná víra ti bude dobře sloužit. [child.Custom('GirlBoy')|U] s pevnou vírou vždy najde cestu."
 child_personality.7011.ambitious: "Přesně tak. Nikdy nezapomeň, že božské síly stojí na tvé straně!"
 child_personality.7011.sadistic: "Říkejte si co chcete, bez skrupulí se [child.GetFirstName] v životě neztratí."
 child_personality.7011.change.zealous: "Tvá #EMP víra#! stojí nade vším, drahé dítě."
 child_personality.7011.change.ambitious: "Víra je #EMP jen prostředek k dosažení cíle!#!"
 child_personality.7011.change.sadistic: "Dítě, tenhle svět je temný a plný hrůz. Buď zabiješ, nebo budeš [Select_CString(child.IsFemale,'zabita','zabit')]."
 clever_child_opinion: "Chytré dítě"
 delightfully_devilish_opinion: "Rozkošně ďábelské"
 worried_opinion: "Znepokojení"
 child_personality.7020.t: "Výprask"
 child_personality.7020.desc: "„Ty malý #EMP [child.Custom2('InsultNoun', SCOPE.sC('evil_person'))]#! Proč mi pořád překážíš!? Dám ti lekci...“ zvolá [evil_person.GetFirstName] a natáhne se po nedalekém kyji.\n\nCo jsem [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] špatně? Jen jsem [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] vidět, co [evil_person.GetFirstNameNoTooltip] dělá! [evil_person.GetFirstNameNoTooltip] se rychle blíží a zvedá kyj nad hlavu! Pomoc!\n\n„Jestli někomu řekneš, kdo ti to udělal, postarám se, aby ses toho už nedožil...“ [evil_person.GetFirstNameNoTooltip] se zlověstně usměje."
 child_personality.7020.a: "J... jak můžou být lidé tak krutí..."
 child_personality.7020.b: "Co když jsou takoví i další!? Musím být #EMP pořád#! ve střehu..!"
 child_personality.7020.c: "Prosím! Neubližuj mi, udělám cokoli!"
 child_personality.7021.t: "$child_personality.7020.t$"
 child_personality.7021.desc: "Co se to proboha stalo?! [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] je samá modřina a podlitina, ale odmítá říct, kdo [Select_CString(child.IsFemale,'jí','mu')] tohle udělal! Bylo to nějaké starší dítě? Nebo snad [child.GetFirstName] [Select_CString(child.IsFemale,'dohnala','dohnal')] nějakého šlechtice k nepříčetnosti?\n\n"
 child_personality.shy.desc: "Teď už [child.GetFirstName] skoro vůbec nemluví a pokaždé, když jsou nablízku lidé, někam se schová... [child.Custom('GirlBoy')|U] je očividně [Select_CString(child.IsFemale,'vyděšená','vyděšený')]..."
 child_personality.paranoid.desc: "Zdá se, že [child.GetFirstName] vyděsí i mihotavý stín. Možná [child.Custom('GirlBoy')] v každém z nich vidí svého útočníka? Neustále se ohlíží přes rameno a nikdy nepolevuje v ostražitosti..."
 child_personality.craven.desc: "Stačí, aby spadl špendlík, a [child.GetFirstNameNoTooltip] už [Select_CString(child.IsFemale,'utíká','utíká')] hledat bezpečí v prázdné skříni. [child.Custom('GirlBoy')|U] jako by [Select_CString(child.IsFemale,'žila','žil')] v neustálém strachu..."
 child_personality.7021.shy: "[child.Custom('GirlBoy')|U] někdy potřebuje klid. Nemusíš s nikým mluvit, pokud nechceš..."
 child_personality.7021.paranoid: "[child.Custom('GirlBoy')|U] musí být ve střehu. Nedávej jim další příležitost."
 child_personality.7021.craven: "Utíkej, schovej se a nikdy nedovol nepřátelům, aby ti mohli ublížit."
 child_personality.7021.change.shy: "Vyhýbej se lidem a budeš v bezpečí..."
 child_personality.7021.change.paranoid: "Nepřátelé jsou #EMP všude#!. To se musíš naučit."
 child_personality.7021.change.craven: "[Select_CString(child.IsFemale,'Měla','Měl')] jsi utéct, dítě!"
 child_personality.7030.t: "[Select_CString(ROOT.Char.IsFemale,'Sama','Sám')] v kuchyni"
 child_personality.7030.desc: "Konečně mám kuchyni #EMP celou#! pro sebe!\n\nPodařilo se mi přesvědčit [cook.GetFirstName], že umyju hrnce. Po tomhle slibu [cook.GetFirstName] [Select_CString(cook.IsFemale,'odešla','odešel')] obstarat [ROOT.Char.Custom('GetLivestockFowlIndef')] k dnešní večeři a kuchyně tak zůstala #EMP lákavě#! bez dozoru.\n\nJe tu med a [child.Custom('FavoriteTreatDemand')] a džem a [child.Custom('GetExpensiveDessert')] a jablka a... a... #EMP UŽ TO NEVYDRŽÍM!#!\n\nJe čas..."
 child_personality.7030.a: "...od všeho trochu ochutnat a pak si zdřímnout na pytli mouky!"
 child_personality.7030.b: "...sníst, co se do mě vejde. Nezůstane ani drobeček!"
 child_personality.7030.c: "...samozřejmě umýt hrnce!"
 child_personality.7031.t: "$child_personality.7030.t$"
 child_personality.7031.desc: "„Zdravím, [ROOT.Char.GetLadyLord].“ promluví [cook.GetFirstName], jeden z kuchařů. „Přivádím [child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]. Slíbilo mi to dítě, že v kuchyni umyje hrnce, víte...“\n\n[cook.GetFirstName] se prudce nadechne.\n\n"
 child_personality.lazy.desc: "„...jenže místo toho [child.GetFirstName] všechno možné uždiboval jako malá krysa a pak usnul na pytli mouky! Podle mě by si zasloužil pořádný výprask, ale nechám na vás, co s ním uděláte!“\n\nTo dítě je tak líné a bez života, že by si ho člověk mohl splést s mrtvolou!"
 child_personality.gluttonous.desc: "„...jenže [child.GetFirstName] spořádal všechny sladkosti, které našel, jako malé prasátko! Teď je celý zpocený a rudý z toho, jak se namáhal s jídlem...“\n\n[child.GetFirstNameNoTooltip] sladkostem nikdy nedokázal odolat, ale tohle už možná trochu přehání..."
 child_personality.compassionate.desc: "„...a umyl #EMP úplně všechny#! hrnce! Dokonce vydrhl i kotel, aniž bych o to vůbec žádal! Máte opravdu hodné dítě.“\n\nJe to bezpochyby velmi nezištné, ale hodí se taková práce k postavení [child.GetFirstNameNoTooltip]?"
 child_personality.7031.lazy: "Dobře. Nikdy neplýtvej energií, když nemusíš!"
 child_personality.7031.gluttonous: "Pamatuj, nikdo ti nemá co říkat, co smíš a nesmíš jíst."
 child_personality.7031.compassionate: "To bylo od tebe moc hezké! S takovým přístupem to v životě dotáhneš daleko."
 child_personality.7031.change.lazy: "Neplýtvej silami kvůli takovým lidem, [child.Custom('GirlBoy')]."
 child_personality.7031.change.gluttonous: "Měl jsi sníst všechny sladkosti. Je to přece #EMP tvoje právo!#!"
 child_personality.7031.change.compassionate: "K [cook.GetFirstNameNoTooltip] by ses měl chovat lépe!"
 lazy_child_opinion: "Líné dítě"
 little_pig_opinion: "Malé prasátko"
 sweet_child_opinion: "Hodné dítě"
 thankful_opinion: "Vděčnost"
 child_personality.7040.t: "Schovávaná s překvapením"
 child_personality.7040.desc: "Skříň v pokojích služebnictva je #EMP nejlepší#! schovka! Jsem génius na schovávanou! Když vykouknu malou škvírou mezi dveřmi, spatřím, jak dovnitř náhle vtrhnou [lover_1.GetFirstName] a [lover_2.GetFirstName].\n\n„Ach, [lover_2.Custom('RomanticComplimentAdjective')] [lover_2.Custom('RomanticComplimentNoun')], už jsem se #EMP nemohl dočkat#! chvíle, kdy budeme sami!“ vyhrkne [lover_1.GetFirstNameNoTooltip] a vrhne se [lover_2.GetFirstNameNoTooltip] do náruče.\n\n„Tak už pojď sem, ty [lover_1.Custom('RaunchyComplimentNoun')]!“ odpoví [lover_2.GetFirstNameNoTooltip] a oba se svalí na postel.\n\n"
 child_personality.7040.desc_motherfather: "Matko? Otče? C... co to #EMP dělají!?#!"
 child_personality.7040.desc_father: "O... otče? Co to #EMP děláš!?#!"
 child_personality.7040.desc_mother: "M... matko? Co to #EMP děláš!?#!"
 child_personality.7040.desc_default: "Co to... ach... tohle jsem #EMP [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')]#! vidět!"
 child_personality.7040.a.crush_version: "[child_crush_target.GetFirstNameNoTooltip] je... #EMP [Select_CString(child_crush_target.IsFemale,'nádherná','nádherný')]#! jako [child_crush_target.Custom('GetBeautifulMetaphor')]."
 child_personality.7040.a: "Tohle je rozhodně #EMP MNOHEM#! zajímavější než schovávaná!"
 child_personality.7040.b: "Mé nebohé nevinné oči! Ať to přestane! #EMP Ať to přestane!#!"
 child_personality.7041.t: "$child_personality.7040.t$"
 child_personality.7041.desc: "Co proboha [child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [Select_CString(child.IsFemale,'dělala','dělal')] v té skříni v pokojích služebnictva? Prý si jen [Select_CString(child.IsFemale,'hrála','hrál')] na schovávanou?\n\n"
 child_personality.lustful.desc: "[child.GetFirstName] vypadá úplně [Select_CString(child.IsFemale,'omámená','omámený')]. Pořád se usmívá, tvář má rozpálenou a sotva vnímá, co říkám...\n\nAle ne... už mi dochází, co se stalo. [child.GetFirstName] nejspíš [Select_CString(child.IsFemale,'zahlédla','zahlédl')] dva lidi ze služebnictva při nějaké velmi důvěrné chvilce. Zdá se, že v [Select_CString(child.IsFemale,'jejich','jeho')] očích to probudilo pořádnou zvědavost."
 child_personality.chaste.desc: "[child.GetFirstName] vypadá jako duch. Třese se, má oči dokořán a jen zírá do zdi...\n\nAle ne... už mi dochází, co se stalo. [child.GetFirstName] nejspíš [Select_CString(child.IsFemale,'zahlédla','zahlédl')] dva lidi ze služebnictva při nějaké velmi důvěrné chvilce.\n\n[child.GetFirstName] je z toho očividně [Select_CString(child.IsFemale,'otřesená','otřesený')]. Nepřekvapilo by mě, kdyby podobná blízkost jednou vyvolávala nepříjemné pocity..."
 child_personality.7041.lustful: "Ty malý zvědavče! Na takové věci máš ještě dost času!"
 child_personality.7041.chaste: "Trocha zdrženlivosti ti v životě rozhodně neuškodí."
 child_personality.7041.change.lustful: "Neboj se, [child.Custom('GirlBoy')]! Až budeš [Select_CString(child.IsFemale,'dospělá','dospělý')], pochopíš to!"
 child_personality.7041.change.chaste: "Ovládej se! Takhle se [child.GetLadyLord] nechová!"
 child_personality.7041.change.lustful: "Neboj se, [child.Custom('GirlBoy')]! Až budeš [Select_CString(child.IsFemale,'dospělá','dospělý')], pochopíš to!"
 child_personality.7041.change.chaste: "Ovládej se! Takhle se [child.GetLadyLord] nechová!"
 child_personality.7050.t: "Lekce o penězích"
 child_personality.7050.desc: "„Bez daní by královská pokladnice brzy vyschla. Věrní vazalové je však platí více než ochotně.“ vysvětluje [teacher.GetFirstName], můj učitel, a [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('teacher'))].\n\n„Proto je nesmírně důležité udržovat poddané spokojené. Nevybírej příliš mnoho, ale ani příliš málo, jinak tě začnou považovat za [Select_CString(ROOT.IsFemale,'neschopnou','neschopného')].“ [teacher.GetFirstNameNoTooltip] otočí stránku a pokračuje.\n\n„Jako [ROOT.Char.GetTitleTierName], tak i [ROOT.Char.Custom('lowly_servant_type')], každý má svou úlohu.“ [teacher.GetFirstName] zavře knihu. „Lekce skončila, můžeš jít.“"
 child_personality.7050.a: "Bez spravedlnosti se panství rozpadne!"
 child_personality.7050.b: "Pche! Až budu vládnout já, daně budou #EMP vysoké#! a bude jich #EMP spousta#!!"
 child_personality.7050.c: "Když chceš zlatou omeletu, musíš rozbít pár sedláků..."
 child_personality.7051.t: "$child_personality.7050.t$"
 child_personality.7051.desc: "[child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))],"
 child_personality.7051.desc_1: " právě [Select_CString(child.IsFemale,'dokončila','dokončil')] jednu z mých lekcí"
 child_personality.7051.desc_2: " právě [Select_CString(child.IsFemale,'dokončila','dokončil')] lekci, kterou [Select_CString(teacher.IsFemale,'vedla','vedl')] [teacher.GetFirstName]"
 child_personality.7051.desc_fin: " o správě pokladnice a mincí, které se v ní nacházejí.\n\n"
 child_personality.just.desc: "[child.GetFirstNameNoTooltip] si lekci očividně [Select_CString(child.IsFemale,'vzala','vzal')] k srdci a ještě více [Select_CString(child.IsFemale,'posílila','posílil')] svůj smysl pro spravedlnost.\n\nPořád mluví o tom, že každý, „od těch, kdo stojí nejvýše jako [ROOT.Char.GetTitleTierName], až po ty nejníže postavené, jako je [ROOT.Char.Custom('lowly_servant_type')]“, má v hospodářství panství svou úlohu."
 child_personality.greedy.desc: "Zdá se však, že v paměti utkvěly jen pasáže o #EMP zlatě#!...\n\nTeď [child.GetFirstName] vybírá malé daně od každého sluhy, kterého dokáže dohonit, k nelibosti celého služebnictva."
 child_personality.callous.desc: "[child.GetFirstNameNoTooltip] si z lekce očividně něco... tak trochu... [Select_CString(child.IsFemale,'odnesla','odnesl')].\n\nÚlohu nižších vrstev sice chápe, ale zároveň tvrdí, že „když sedlák přestane platit daně, už není k ničemu a měli bychom se ho zbavit“. Na lidský život je to velmi bezcitný pohled..."
 child_personality.7051.just: "Silný smysl pro spravedlnost ti v životě dobře poslouží!"
 child_personality.7051.greedy: "Přesně tak. Nic není důležitější než #EMP bohatství!#!"
 child_personality.7051.callous: "Dobře. Nenech se brzdit pouhými #EMP city#!."
 child_personality.7051.change.just: "Copak ses vůbec nic nenaučil!? Ta lekce byla o #EMP spravedlnosti!#!"
 child_personality.7051.change.greedy: "...muhehe! Ne, [child.Custom('GirlBoy')], musíš je #EMP vyždímat do poslední mince!#!"
 child_personality.7051.change.callous: "Emoce plodí slabost, dítě. Potlač je."
 child_personality.7060.t: "[child.GetFaith.ReligiousText|U] skrývá tajemství"
 child_personality.7060.desc: "„Podívej se na tuhle stránku, [child.GetFirstNameNoTooltip]! Myslím, že se tu mluví o tom, koho uctíváme: [child.GetFaith.random_GoodGodNames]. Je to vážně zajímavé.“ řekne [other_child.GetFirstName] a před sebou má na podlaze otevřený [child.GetFaith.ReligiousText].\n\n„Tolik toho ještě nevíme a tolik se toho můžeme naučit! Tolik tajemství, tolik vědomostí... Zkusme odhalit další pravdy. Jen si představ, co všechno bychom mohli poznat!“ řekne [other_child.GetFirstNameNoTooltip] a pomalu obrátí pohled vzhůru."
 child_personality.7060.a: "V té knize je tolik moudrosti!"
 child_personality.7060.b: "Fuj, nechceš si radši hrát s mou #EMP [child.Custom('child_favorite_toy')]!?#!"
 child_personality.7060.c: "Já jsem [Select_CString(ROOT.Char.IsFemale,'spokojená','spokojený')] s tím, co už vím."
 child_personality.7061.t: "$child_personality.7060.t$"
 child_personality.7061.desc: "[child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], a [Select_CString(child.IsFemale,'její','jeho')] malý přítel [other_child.GetFirstName] si z pracovny odnesli [child.GetFaith.ReligiousText] do herny...\n\n"
 child_personality.humble.desc: "Celé hodiny se snažili pochopit, co je na stránkách napsáno. Mluvili o tom, koho uctívají: [child.GetFaith.random_GoodGodNames], a o mnoha tajemstvích božského.\n\nZdá se, že [child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'získala','získal')] hlubokou úctu ke slovům, na nichž stojí [child.GetFaith.GetNameNoTooltip]."
 child_personality.cynical.desc: "...a úplně ho zničili! Vytrhané stránky, stopy na deskách... ani špetka úcty!\n\nZdá se, že [child.GetFirstNameNoTooltip] si z božského slova vůbec nic nedělá..."
 child_personality.content.desc: "[child.GetFirstNameNoTooltip] se [Select_CString(child.IsFemale,'pokusila','pokusil')] číst, ale rychle [Select_CString(child.IsFemale,'dospěla','dospěl')] k názoru, že podobná slova je nejlepší přenechat těm, kdo jsou [child.GetFaith.PriestNeuterPlural].\n\nZdá se, že [child.GetFirstName] je naprosto [Select_CString(child.IsFemale,'spokojená','spokojený')] s tím, že hlubšímu významu knihy zatím nerozumí..."
 child_personality.7061.humble: "Je správné přistupovat k posvátným slovům s úctou."
 child_personality.7061.cynical: "Ha! Stejně jsou to jen samé žvásty."
 child_personality.7061.content: "Říkám, že člověk má být spokojený i s tím, co neví."
 child_personality.7061.change.humble: "Měj k těm slovům úctu! Skrývají #EMP moudrost#! a #EMP význam!#!"
 child_personality.7061.change.cynical: "Jsou to všechno nesmysly, [child.Custom('GirlBoy')]. Nevšímej si toho."
 child_personality.7061.change.content: "Spokoj se s tím, co už víš, a budeš [Select_CString(child.IsFemale,'šťastná','šťastný')]."
 child_personality.7070.t: "Krev a sliny"
 child_personality.7070.desc: "Ach, [child.Custom('GetExpensiveMeal')], moje #EMP oblíbené jídlo!#! Už se do něj chystám pustit, když mou radost náhle překazí [other_child.GetFirstName]. Co zase chce?\n\n„Nazdar, ty #EMP [child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!#! Co to jíš? Vypadá to odporně. Trochu ti to #EMP dochutím!#!“ zvolá [other_child.GetFirstNameNoTooltip] a přistoupí blíž k mému talíři.\n\n#flatulence *Ptfuj!*#! Odporný chrchel slin přistane přímo v mém jídle.\n\n„Tak! Teď to bude mnohem lepší! Bwahaha!“ [other_child.GetFirstNameNoTooltip] se rozesměje a škodolibě zazubí."
 child_personality.7070.a: "Tak teď už jsi to [Select_CString(other_child.IsFemale,'přehnala','přehnal')], [other_child.Custom2('InsultNoun', ROOT.Char)]!"
 child_personality.7070.b: "Odteď bude [other_child.GetFirstName] dostávat do jídla mou tajnou přísadu... #EMP bon appétit.#!"
 child_personality.7070.c: "Prostě to přejdu."
 child_personality.7070.c.flavor: "Zatnu zuby a vydržím to."
 child_personality.7071.t: "$child_personality.7070.t$"
 child_personality.7071.desc: "Podle všeho [other_child.GetFirstName] před několika večery při večeři [Select_CString(other_child.IsFemale,'naplivala','naplival')] do jídla, které patřilo [child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))].\n\n"
 child_personality.vengeful.desc: "„Ty jsi [other_child.Custom2('InsultNoun', SCOPE.sC('child'))]!“ křičí [child.GetFirstNameNoTooltip]. „A ty jsi [child.Custom2('InsultNoun', SCOPE.sC('other_child'))]!“ křičí [other_child.GetFirstNameNoTooltip] zpátky.\n\n[child.GetFirstNameNoTooltip] se s [other_child.GetFirstNameNoTooltip] od té doby hádá a pere každý den! Není snad jediná chvíle, kdy by [child.GetFirstName] [Select_CString(child.IsFemale,'neplánovala','neplánoval')] nějakou drobnou pomstu..."
 child_personality.deceitful.desc: "Jeden z kuchařů přistihl [child.GetFirstNameNoTooltip], jak se tajně mstí pliváním do jídla [other_child.GetFirstNameNoTooltip]! To vysvětluje, proč [other_child.GetFirstNameNoTooltip] při večeři poslední dobou vypadá nějak... #EMP nazelenale#!. [child.GetFirstName] tam nejspíš plive už několik dní. Malý zákeřník..."
 child_personality.calm.desc: "Zdá se, že se [child.GetFirstNameNoTooltip] snaží [other_child.GetFirstNameNoTooltip] unavit tím, že na šikanu vůbec nereaguje. Nezáleží na tom, kolikrát [other_child.GetFirstNameNoTooltip] vykřikne nějakou urážku jako [child.Custom2('InsultNoun', SCOPE.sC('other_child'))] nebo [child.GetFirstName] uhodí přes tvář..."
 child_personality.7071.vengeful: "Pomsty se dočkáš. Až přijde čas."
 child_personality.7071.deceitful: "Přesně to si [other_child.GetFirstNameNoTooltip] zaslouží!"
 child_personality.7071.calm: "Prostě [other_child.GetFirstNameNoTooltip] ignoruj. Časem to [Select_CString(other_child.IsFemale,'přestane bavit','přestane bavit')]."
 child_personality.7071.change.vengeful: "Nebuď tak [Select_CString(child.IsFemale,'poddajná','poddajný')]! #EMP Pomsti se!#!"
 child_personality.7071.change.deceitful: "Pomsta chutná nejlépe... když nikdo neví, odkud přišla."
 child_personality.7071.change.calm: "Prostě nastav druhou tvář, [child.Custom('GirlBoy')]."
 child_personality.7080.t: "Lekce dobročinnosti"
 child_personality.7080.desc_1: "„Podívej se na chudé a zbídačené, [child.GetFirstNameNoTooltip]. Je jich mnoho a někteří pomoc skutečně potřebují. Jiní jsou jen podvodníci, kteří natahují ruku.“ "
 child_personality.7080.desc_name_1: "[teacher.GetTitledFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.desc_name_2: "[teacher.GetCouncilTitle] [teacher.GetFirstName] $child_personality.7080.desc_2$"
 child_personality.7080.desc_2: "mi vysvětluje a vytahuje malý měšec se zlatem.\n\n„Kdo z nich si dnes naši pomoc zaslouží nejvíc, drahé dítě?“ řekne [teacher.GetFirstNameNoTooltip] a podá mi měšec.\n\nZdá se, že [teacher.GetFirstNameNoTooltip] chce, abych zlato [Select_CString(ROOT.Char.IsFemale,'rozdala','rozdal')] těm, kteří ho potřebují nejvíc..."
 child_personality.7080.a: "Zaslouží si ho všichni! Určitě můžeme dát ještě víc?"
 child_personality.7080.b: "Tamten [ROOT.Char.Custom('lowly_servant_type')]! Ne... tenhle sedlák! Počkej, možná..."
 child_personality.7080.c: "Nikdo z nich. Všechno je to spodina!"
 child_personality.7081.t: "$child_personality.7080.t$"
 child_personality.7081.desc: "[teacher.GetTitledFirstName] dnes [Select_CString(teacher.IsFemale,'vzala','vzal')] [child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], na tržiště. [child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'měla','měl')] rozdávat almužny chudým a potřebným a naučit se něco o dobročinnosti i o povinnosti vládce vůči těm méně šťastným.\n\n"
 child_personality.generous.desc: "„To [child.Custom('ComplimentAdjective')] dítě dalo něco úplně každému,“ řekne [teacher.GetFirstNameNoTooltip]. „A když se měšec vyprázdnil, [child.GetFirstName] [Select_CString(child.IsFemale,'trvala','trval')] na tom, že přineseme další. Velmi nezištné, možná až příliš.“\n\nZdá se, že [child.GetFirstNameNoTooltip] má opravdu velké srdce."
 child_personality.fickle.desc: "„To roztěkané dítě se vůbec nedokázalo rozhodnout, komu zlato dát,“ řekne viditelně podrážděně [teacher.GetFirstNameNoTooltip]. „Nakonec dostal jednu minci jednonohý člověk, který je [ROOT.Char.Custom('lowly_servant_type')], druhou slepý uličník, za další si [child.GetFirstName] [Select_CString(child.IsFemale,'koupila','koupil')] [child.Custom('FavoriteTreatDemand')], jednu minci [Select_CString(child.IsFemale,'dala','dal')] dokonce #EMP mně#! a poslední ztratilo dítě v příkopu.“\n\nZdá se, že [child.GetFirstNameNoTooltip] se opravdu nedokáže rozhodnout..."
 child_personality.arrogant.desc: "„[child.GetFirstName] [Select_CString(child.IsFemale,'odmítla','odmítl')] dát jedinou minci #EMP komukoli!#!“ zvolá [teacher.GetFirstNameNoTooltip]. „Každý, koho jsme potkali, si ji buď ‚nezasloužil‘, nebo byl hluboko pod úrovní dítěte... a nakonec si [child.GetFirstName] zlato [Select_CString(child.IsFemale,'nechala','nechal')].“\n\nZdá se, že [child.GetFirstNameNoTooltip] začíná mít o sobě poněkud vysoké mínění..."
 child_personality.7081.generous: "Je naší povinností dávat tolik, kolik můžeme!"
 child_personality.7081.fickle: "Proč si vybírat jednu cestu, když můžeš zkusit #EMP všechny#!?"
 child_personality.7081.arrogant: "Přesně tak, [child.Custom('GirlBoy')]. Jsi #EMP lepší#! než oni."
 child_personality.7081.change.generous: "Ne, o chudé se #EMP musíš#! starat!"
 child_personality.7081.change.fickle: "Vždycky musíš zvažovat všechny možnosti. Pečlivě. Znovu a znovu."
 child_personality.7081.change.arrogant: "Pche! Ti ubožáci jsou hluboko pod tvou úroveň!"
 child_personality.7090.t: "Jemné umění diplomacie"
 child_personality.7090.desc: "„Vazalové občas překročí své meze,“ říká [teacher.GetFirstName], [Select_CString(teacher.IsFemale,'má učitelka','můj učitel')]. „Odpuštění posílí vaše vzájemné pouto.“\n\n„Někdy musíš poddanému důvěřovat navzdory jeho pověsti, jinak budeš [Select_CString(ROOT.Char.IsFemale,'přetížená','přetížený')].“ [teacher.GetFirstName] pokračuje v nekonečném výkladu.\n\n„Je důležité dát jim čas, aby mohli napravit své chyby.“ [teacher.GetFirstNameNoTooltip] svine pergamen.\n\n„Tak co ses dnes [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')]?“ zeptá se [teacher.GetFirstNameNoTooltip] a upřeně se na mě zadívá."
 child_personality.7090.a: "Každý dělá chyby, neměl bych hned soudit."
 child_personality.7090.b: "Že je velmi důležité důvěřovat svým poddaným!"
 child_personality.7090.c: "Trpělivost. Všechno potřebuje svůj čas."
 child_personality.7091.t: "$child_personality.7090.t$"
 child_personality.7091.desc: "Dnes [child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [Select_CString(child.IsFemale,'absolvovala','absolvoval')] lekci o správě vazalů pod vedením [teacher.GetFirstName]. Byla to poměrně složitá látka, nepochybně potřebná, ale možná ještě trochu nad [Select_CString(child.IsFemale,'její','jeho')] chápání?\n\n"
 child_personality.forgiving.desc: "„Každý dělá chyby!“ zvolá [child.GetFirstNameNoTooltip]. „Až budu vládnout, budu odpouštět a nechám ostatní žít, aby mé panství mohlo vzkvétat!“\n\nMožná by ale [child.GetFirstName] [Select_CString(child.IsFemale,'byla','byl')] až #EMP příliš#! shovívavým vládcem..?"
 child_personality.trusting.desc: "„Moji poddaní mi přece chtějí jen to nejlepší!“ zvolá [child.GetFirstNameNoTooltip]. „Budu jim bezmezně důvěřovat, abychom společně vybudovali naše panství!“\n\nAch, ty sladké důvěřivé dítě... taková důvěřivost může být nebezpečná..."
 child_personality.patient.desc: "„Musím nechat věcem jejich čas,“ řekne [child.GetFirstNameNoTooltip]. „Jen trpělivostí a tím, že nechám poddané pracovat vlastním tempem, mohu vládnout moudře.“\n\n[child.GetFirstNameNoTooltip] si očividně neuvědomuje, že někteří poddaní by [Select_CString(child.IsFemale,'jejím','jeho')] časem plýtvali zcela úmyslně..."
 child_personality.7091.forgiving: "Jen díky odpuštění se můžeme posunout dál."
 child_personality.7091.trusting: "Dobře, vyžeň ze své mysli veškeré podezření!"
 child_personality.7091.patient: "Trpělivost ti v životě dobře poslouží, dítě."
 child_personality.7091.change.forgiving: "Odpuštění je ctnost nade všechny ostatní!"
 child_personality.7091.change.trusting: "Důvěřuj svým poddaným. Nikdy by ti neublížili!"
 child_personality.7091.change.patient: "Buď [Select_CString(child.IsFemale,'trpělivá','trpělivý')], nech věcem čas a teprve potom vynes svůj soud."
 child_personality.7100.t: "Vloupání do zbrojnice"
 child_personality.7100.desc: "Konečně jsme uvnitř! Všechny zbraně ve zbrojnici máme na dosah, to bude zábava! Tak vidíte, vy páchnoucí hloupí dospělí, kteří jste nás sem nechtěli pustit!\n\n„Podívej! [Select_CString(other_child.IsFemale,'Našla','Našel')] jsem [other_child.Custom('SignatureWeaponArticle')] [other_child.Custom('signature_weapon')]!“ zvolá [other_child.GetFirstName] a začne zbraní [other_child.Custom('SignatureWeaponActionPresentParticiple')].\n\nKdyž se natahuji po [child.Custom('SignatureWeaponArticle')] [child.Custom('signature_weapon')], ozve se za mnou hlasité #EMP „Au!“#!. [other_child.GetFirstNameNoTooltip] se [Select_CString(other_child.IsFemale,'zranila','zranil')] a teče krev!\n\nCo mám dělat?!"
 child_personality.7100.a: "Musíme se #EMP hned teď#! přiznat!"
 child_personality.7100.b: "To je jedno, hlavně mi nezakrvácej šaty. *[child.Custom('SignatureWeaponFlourishThirdPersonPresentParticiple')|U] [child.Custom('signature_weapon')]*"
 child_personality.7100.c: "MUSÍM SEHNAT OBVAZ, HNÉÉÉD!"
 child_personality.7101.t: "$child_personality.7100.t$"
 child_personality.7101.desc: "[ROOT.Char.Custom('CulturalCurse')|U]! Ty prokleté děti! [child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], a [Select_CString(child.IsFemale,'její','jeho')] společník [other_child.GetFirstName,] byly přistiženy přímo při činu, když se vplížily do zbrojnice. Copak nevědí, že zbraně jsou nebezpečné?!\n\n"
 child_personality.honest.desc: "[other_child.GetFirstNameNoTooltip] se [Select_CString(other_child.IsFemale,'zranila','zranil')], ale naštěstí [child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'vyběhla','vyběhl')] ven, [Select_CString(child.IsFemale,'přivedla','přivedl')] nejbližšího dospělého a ke všemu se [Select_CString(child.IsFemale,'přiznala','přiznal')].\n\n[child.GetFirstNameNoTooltip] vypadá skutečně [Select_CString(child.IsFemale,'zdrcená','zdrcený')]. Nemyslím si, že by se po tomhle ještě někdy pokoušel něco zapírat."
 child_personality.arbitrary.desc: "Jeden ze sluhů je přistihl přímo při činu. [other_child.GetFirstNameNoTooltip] [Select_CString(other_child.IsFemale,'plakala','plakal')] a [Select_CString(other_child.IsFemale,'krvácela','krvácel')] na podlaze, zatímco [child.GetFirstNameNoTooltip] si dál [Select_CString(child.IsFemale,'hrála','hrál')] s ukradenou zbraní [child.Custom('signature_weapon')]...\n\n[child.GetFirstNameNoTooltip] prý nechtěl #EMP „přestat se bavit jen proto, že to [other_child.GetFirstNameNoTooltip] pokazilo“#!. Co z toho dítěte jen vyroste..."
 child_personality.impatient.desc: "Sluha přistihl [child.GetFirstNameNoTooltip] poté, co při hledání obvazu pro zraněného [other_child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'převrhla','převrhl')] stojan s brněním.\n\nZdá se, že [child.GetFirstNameNoTooltip] má slabost pro ukvapené plány bez pořádného rozmyslu..."
 child_personality.7101.honest: "Bylo správné, že ses [Select_CString(child.IsFemale,'přiznala','přiznal')]."
 child_personality.7101.arbitrary: "Pochopitelné. Koho vůbec zajímá [other_child.GetFirstNameNoTooltip]?"
 child_personality.7101.impatient: "Okamžitě vyrazit zachránit přítele? Obdivuhodné!"
 child_personality.7101.change.honest: "[Select_CString(child.IsFemale,'Měla','Měl')] ses ke svému prohřešku přiznat, ty spratku!"
 child_personality.7101.change.arbitrary: "[Select_CString(child.IsFemale,'Měla','Měl')] sis dál hrát. [other_child.GetFirstNameNoTooltip] je postradatelný."
 child_personality.7101.change.impatient: "Proč jsi [Select_CString(other_child.IsFemale,'jí','mu')] #EMP okamžitě#! [Select_CString(child.IsFemale,'nepomohla','nepomohl')]?"
 child_personality.7200.t: "Temná jeskyně"
 child_personality.7200.desc: "„Chceš svou [other_child.Custom('child_favorite_toy')]? Jo? #EMP Tak si pro ni dojdi!#!“ zakřičí [other_child.GetFirstName] a hodí [other_child.Custom('child_favorite_toy')] malého dítěte hluboko do temné, ponuré jeskyně. Malý [other_child.Custom('GirlBoy')] se nekontrolovatelně rozpláče.\n\n„Teď bude dělat společnost #EMP pavoukům#! a #EMP hadům#!! Už ji nikdy neuvidíš!“ zvolá [other_child.GetFirstNameNoTooltip] se smíchem.\n\nJak může být [other_child.GetFirstNameNoTooltip] na to ubohé dítě tak [Select_CString(other_child.IsFemale,'zlá','zlý')]!? Jeskyně je plná všelijaké havěti... ale #EMP musím#! něco udělat!"
 child_personality.7200.a: "Neboj se, přinesu ti [other_child.Custom('child_favorite_toy')] zpátky!"
 child_personality.7200.b: "Stráže! #EMP Donuťte#! [other_child.GetFirstNameNoTooltip], ať ji přinese zpátky."
 child_personality.7200.c: "Tohle mě ROZZUŘUJE! Zmlátím tě do krve!"
 child_personality.7201.t: "$child_personality.7200.t$"
 child_personality.7201.desc: "Jedno z dětí u dvora, [other_child.GetFirstName], vzalo mladšímu dítěti jeho [other_child.Custom('child_favorite_toy')] a hodilo ji do nedaleké jeskyně. [child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [Select_CString(child.IsFemale,'byla','byl')] u toho a všechno [Select_CString(child.IsFemale,'viděla','viděl')].\n\n"
 child_personality.brave.desc: "[child.GetFirstName] [Select_CString(child.IsFemale,'vběhla','vběhl')] do jeskyně a téměř půl hodiny se [Select_CString(child.IsFemale,'nevracela','nevracel')]! Nakonec se ale [Select_CString(child.IsFemale,'vynořila','vynořil')] i s hračkou, k velké nelibosti [other_child.GetFirstNameNoTooltip].\n\nVelmi statečné, i když možná trochu pošetilé."
 child_personality.stubborn.desc: "[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'sehnala','sehnal')] stráže a donutil [other_child.GetFirstNameNoTooltip] vlézt do jeskyně! Několik minut se odtamtud ozýval vyděšený křik, než se [other_child.GetFirstNameNoTooltip] konečně [Select_CString(other_child.IsFemale,'vynořila','vynořil')] s hračkou.\n\nZdá se, že když je [child.GetFirstName] [Select_CString(child.IsFemale,'přesvědčená','přesvědčený')], že je něco správné, nepřestane, dokud toho nedosáhne..."
 child_personality.wrathful.desc: "[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'vybuchla','vybuchl')] vzteky a [other_child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'zmlátila','zmlátil')] do krve! Mladšímu dítěti to nijak nepomohlo a rozplakalo se ještě víc...\n\nZdá se, že [child.GetFirstNameNoTooltip] má potíže ovládat svůj hněv..."
 child_personality.7201.brave: "Taková odvaha si zaslouží uznání!"
 child_personality.7201.stubborn: "Tvá vůle se stane skutkem, dítě."
 child_personality.7201.wrathful: "[other_child.GetFirstNameNoTooltip] musel za to, co [Select_CString(other_child.IsFemale,'udělala','udělal')], zaplatit!"
 child_personality.7201.change.brave: "[Select_CString(child.IsFemale,'Měla','Měl')] jsi tam bez obav vlézt [Select_CString(child.IsFemale,'sama','sám')]."
 child_personality.7201.change.stubborn: "[Select_CString(child.IsFemale,'Měla','Měl')] jsi donutit [other_child.GetFirstNameNoTooltip], aby hračku přinesl zpátky."
 child_personality.7201.change.wrathful: "Jak to, že jsi [other_child.GetFirstNameNoTooltip] rovnou na místě [Select_CString(child.IsFemale,'nepraštila','nepraštil')]!?"
