l_polish:
 child_personality.0001.t: "Hrozivá postava"
 child_personality.0001.opening: "Kdykoli potkám [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bully'))] [bully.GetTitledFirstName], [bully.GetSheHe] vymyslí nějaký nový způsob, jak mě trýznit."
 child_personality.0001.bullying_1: "\n\nTentokrát mi [bully.GetSheHe] hrozí, že mi protlačí hlavu dírou ve zdi kadibudky!"
 child_personality.0001.bullying_2: "\n\nTentokrát mě [bully.GetSheHe] pronásleduje celý den, dělá štěkavé zvuky a nazývá mě psíkem!"
 child_personality.0001.bullying_3: "\n\nTentokrát [bully.GetSheHe] převrhne svícen a svalí vinu na mě!"
 child_personality.0001.end: "\n\n[bully.GetSheHe|U] mě děsí, ale co s tím mohu dělat?"
 child_personality.0001.no_bully_fallback: "Dcera [ROOT.GetCharacter.Custom('lowly_servant_type')] je hrozná šikanátorka. Kdykoli ji vidím, vymyslí nový způsob, jak mě trýznit. Je tak velká a silná, co vůbec můžu dělat?"
 child_personality.0001.a: "Aspoň v ukrývání jsem čím dál tím lepší."
 child_personality.0001.b: "Tak či tak chci zůstat celý den ve svém pokoji."
 child_personality.0001.c: "Možná bych [bully.GetHerHim] za to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] nechat pověsit?"
 child_personality.0002.t: "Zločinec"
 child_personality.0002.guardian: "Když jsem [Select_CString(ROOT.Char.IsFemale,'procházela','procházel')] ulicemi se svým [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName], přišli jsme k pranýři. [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] tam přikován muž, prosící o vodu nebo cokoli, co by mu ulevilo od jeho osudu."
 child_personality.0002.no_guardian: "Když jsme procházeli ulicemi, narazili jsme na pranýř. [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] na něm přikován muž, prosící o vodu nebo cokoli, co by mu ulevilo od jeho osudu."
 child_personality.0002.a: "Ten zločinec by se mě ani [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] odvážit podívat!"
 child_personality.0002.b: "Přinesu mu vodu ze studny."
 child_personality.0002.c: "Voda? Doufám, že toto bláto postačí!"
 child_personality.0003.t: "Přistižen!"
 child_personality.0003.guardian: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName] mě [Select_CString(guardian.IsFemale,'přistihla','přistihl')], jak kradu z [robbed_guest.GetTitledFirstNamePossessive] cestovní truhly, když [Select_CString(robbed_guest.IsFemale,'navštěvovala','navštěvoval')] hrad. [guardian.GetFirstName] mi hrozil trestem a požadoval vysvětlení."
 child_personality.0003.no_guardian: "Přistihli mě, jak kradu z [robbed_guest.GetTitledFirstNamePossessive] cestovní truhly, když [Select_CString(robbed_guest.IsFemale,'navštěvovala','navštěvoval')] hrad. [robbed_guest.GetFirstName] mi hrozil trestem a žádal vysvětlení."
 child_personality.0003.a: "Jeden z ostatních dětí mě vyzval ke hře."
 child_personality.0003.b: "[Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že mi to projde, ale už to nikdy neudělám."
 child_personality.0003.c: "Nemám k ničemu větší právo než ostatní."
 child_personality.0004.t: "Dvorní povzbuzení"
 child_personality.0004.desc: "Jsem nesmírně [Select_CString(ROOT.Char.IsFemale,'ohromena','ohromen')] jedním z domácích $knight_culture_player_plural_no_tooltip_lowercase$. Konečně jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [Select_CString(ROOT.Char.IsFemale,'představena','představen')] tváří v tvář a stále jsem stejně [Select_CString(ROOT.Char.IsFemale,'ohromena','ohromen')]. Jeho slova si ponesu po zbytek svého života."
 child_personality.0004.desc_knight: "Jsem nesmírně [Select_CString(ROOT.Char.IsFemale,'ohromena','ohromen')] jedním z domácích $knight_culture_player_plural_no_tooltip_lowercase$. Konečně jsem se s [knight.GetHerHim] [Select_CString(ROOT.Char.IsFemale,'setkala','setkal')] tváří v tvář a stále jsem stejně [Select_CString(ROOT.Char.IsFemale,'ohromena','ohromen')]. Zapamatuji si [Select_CString(knight.IsFemale,'její','jeho')] slova na celý život."
 child_personality.0004.a: "„Dávej druhým, co jim náleží, a sám dostaneš své zpět.“"
 child_personality.0004.b: "„Pracuj pilně a dokážeš zvládnout cokoli.“"
 child_personality.0004.c: "„Velikost přichází časem. Buď připraven ji uchopit, až přijde.“"
 child_personality.0005.t: "Čas hraní"
 child_personality.0005.desc: "[Select_CString(ROOT.Char.IsFemale,'Hrála','Hrál')] jsem si s ostatními dětmi, když se [doing_push.GetFirstName] [Select_CString(doing_push.IsFemale,'pokusila','pokusil')] mě srazit!\n\n[doing_push.GetSheHe|U] mě neustále obtěžuje, snaží se mě při každé příležitosti strčit... Začíná mi to lézt na nervy, [Select_CString(ROOT.Char.IsFemale,'měla','měl')] bych s tím něco udělat."
 child_personality.0005.a: "Ukážu ti, co se stane tomu, kdo mě strčí!"
 child_personality.0005.b: "Proč mě strkáš? Jen si s tebou chci hrát."
 child_personality.0005.c: "Počkej, právě mě napadla jiná hra!"
 child_personality.0006.t: "Srdcervoucí odmítnutí"
 child_personality.0006.desc_crush: "Ach, denně i v noci myslím na [crush.GetTitledFirstName] a mé srdce poskakuje, kdykoli [crush.GetHerHim] vidím na chodbách hradu! \n\nKdyž jsem se však [Select_CString(ROOT.Char.IsFemale,'svěřila','svěřil')] s city, mě s výsměchem [Select_CString(crush.IsFemale,'odmítnula','odmítnul')], [Select_CString(ROOT.Char.IsFemale,'rozdrtila','rozdrtil')] mé srdce pod [Select_CString(crush.IsFemale,'její','jeho')] nohama, když [Select_CString(ROOT.Char.IsFemale,'odcházela','odcházel')]."
 child_personality.0006.desc: "Obyčejný [child.Custom('servant_for_romance')] mi ukradl srdce! Každý pohled mým směrem mi rozbuší srdce.\n\nKdyž jsem se ale [Select_CString(ROOT.Char.IsFemale,'svěřila','svěřil')] se svými city, [child.Custom('servant_for_romance')] mě s výsměchem [Select_CString(ROOT.Char.IsFemale,'odmítnula','odmítnul')]!"
 child_personality.0006.a_crush: "Ukážu [crush.GetHerHim], co to znamená mě tak ponížit!"
 child_personality.0006.a: "Ukážu jim, co to znamená mě tak ponížit!"
 child_personality.0006.b: "Pokud je tohle láska, nechci s tím mít nic společného."
 child_personality.0006.c_crush: "Opravdu si [crush.GetSheHe] myslí, že tak snadno vzdám?"
 child_personality.0006.c: "Opravdu si myslí, že tak snadno vzdám?"
 child_personality.0007.t: "Rozsudek"
 child_personality.0007.desc: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName] se se mnou bavil o trestu smrti, který [Select_CString(guardian.IsFemale,'byla','byl')] před dvěma dny uložen nízkému zloději.\n\nSe mě [Select_CString(guardian.IsFemale,'chtěla','chtěl')] zeptat, co si myslím o tak krutém trestu za tak malý zločin."
 child_personality.0007.a: "Bylo to příliš. Trest by [Select_CString(ROOT.Char.IsFemale,'měla','měl')] odpovídat zločinu."
 child_personality.0007.b: "To není zákon bohabojné říše."
 child_personality.0007.c: "Měli bychom být všichni spokojeni s tím, co už máme."
 child_personality.0008.t: "Hostina pro smysly"
 child_personality.0008.desc: "Účast na hostině je přívalem dojmů. Lidé mluví, vůně všech možných jídel mi zaplňuje hlavu. Hosté mají na sobě krásné šaty, sluhové nosí nekonečné hromady talířů, a—"
 child_personality.0008.serving_wench: "\nCo znamenalo to mrknutí té služky právě teď?"
 child_personality.0008.servant_boy: "\nCo tím právě [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] říct ten sluha, když mi mrknul?"
 child_personality.0008.desc_not_server: "\nNemohu přestat obdivovat, jak je to všechno působivé! Jak nádherná ukázka moci."
 child_personality.0008.a: "Všechno je tak lesklé!"
 child_personality.0008.b: "S dospělými je tak zábavné si povídat!"
 child_personality.0008.c: "Nemohu přestat myslet na ten záblesk v oku toho sluhy!"
 child_personality.0009.t: "Dětský kazatel"
 child_personality.0009.desc: "[Select_CString(ROOT.Char.IsFemale,'Pozorovala','Pozoroval')] jsem svého [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('child_preacher'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_preacher'))] [child_preacher.GetTitledFirstName], jak mluví s ostatními dětmi o [child_preacher.GetFaith.random_GoodGodNames]. Smáli se mu a posmívali se mu chvíli, než začalo strkání. Navzdory posměchu se [Select_CString(child_preacher.IsFemale,'snažila','snažil')] dál učit, dokud nepřišel první úder."
 child_personality.0009.desc_fallback: "[Select_CString(ROOT.Char.IsFemale,'Sledovala','Sledoval')] jsem, jak můj přítel [Select_CString(ROOT.Char.IsFemale,'mluvila','mluvil')] s ostatními dětmi o [ROOT.Char.GetFaith.random_GoodGodNames]. Smáli se mu a posmívali se mu chvíli, než začalo strkání. Navzdory posměchu se můj přítel [Select_CString(ROOT.Char.IsFemale,'snažila','snažil')] dál učit, dokud nepřišel první úder."
 child_personality.0009.a: "Ochraním tě!"
 child_personality.0009.a.tt: "Existuje šance, že budeš zraněný."
 child_personality.0009.b: "Přestaňme hned teď a promluvme si o tom."
 child_personality.0009.c: "Takto se chováte k někomu, kdo káže boží slovo!?"
 child_personality.0009.d: "To bude zábava!"
 child_personality.0010.t: "Život v mých rukou"
 child_personality.0010.desc: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName] mě [Select_CString(guardian.IsFemale,'vzala','vzal')] do lesa, abych si [Select_CString(guardian.IsFemale,'hrála','hrál')] s lukem. Když jsem se však [Select_CString(ROOT.Char.IsFemale,'zatoulala','zatoulal')], brzy jsem [Select_CString(ROOT.Char.IsFemale,'narazila','narazil')] na zraněnou laň, která se snažila ode mě odplížit."
 child_personality.0010.a: "Tohle bude největší zvíře, které jsem kdy [Select_CString(ROOT.Char.IsFemale,'ulovila','ulovil')]!"
 child_personality.0010.b: "Je tak pomalá, [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] bych ji bodnout a sledovat, jak umírá vykrvácením."
 child_personality.0010.c: "To je zkouška připravená [guardian.GetFirstNameNoTooltip], že?"
 child_personality.0011.t: "Předmět mé touhy"
 child_personality.0011.desc: "Dlouho toužím po [ROOT.GetCharacter.Custom('child_object_of_interest_indefinite')] a můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName] slibuje, že mi jeden pořídí za tři měsíce, pokud začnu přísněji studovat."
 child_personality.0011.a: "Už se mi vlastně líbí způsob, jakým teď studuji."
 child_personality.0011.b: "Och, už vlastně žádný nechci."
 child_personality.0011.c: "Budu pilně studovat!"
 child_personality.0012.t: "Chaotická hostina"
 child_personality.0012.desc: "Tato hostina je hlučná, dospělí jsou nudní a jídlo není moc dobré.\n\nMůj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetFirstName] se zdá, že si užívá [guardian.GetHerselfHimself], takže nemohu získat [Select_CString(guardian.IsFemale,'její','jeho')] pozornost, abych [Select_CString(guardian.IsFemale,'řekla','řekl')], že tu nechci být."
 child_personality.0012.a: "Vykouknu potichu. Možná tu jsou další děti."
 child_personality.0012.b: "Nevydržím tolik lidí! Jdu se schovat pod stůl."
 child_personality.0012.c: "Alespoň můžu dál jíst, dokud tu budu!"
 child_personality.0021.t: "Formující se osobnost"
 child_personality.0021.desc: "Jednou z mála útěch v mém zajetí je pozorovat lidi, i když jen zpoza mříží"
 child_personality.0021.serving_wench: "– každé ráno doufám, že mi bude dopřán aspoň jeden pohled na tu jednu krásnou služku."
 child_personality.0021.servant_boy: "– každé ráno doufám, že uvidím jen jednou toho hezkého služebného chlapce."
 child_personality.0021.desc_no_gender: "– každé ráno doufám, že uvidím jen jednou některého z těch hezkých služebníků."
 child_personality.0021.a: "Pak už si představivost dokáže poradit..."
 child_personality.0022.desc: "Zvykl jsem si na samotu. Nikdo, s kým bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] mluvit, nikdo, s kým bych si [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] hrát, nikdo, od koho bych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] učit. Pouhá myšlenka, že by mě teď někdo [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] dotknout..."
 child_personality.0022.a: "Po zádech mi běhá mráz!"
 child_personality.0023.desc: "Nikdy nevím, kdy dostanu další jídlo, takže když mi podají talíř, všechno na něm bez váhání zhltám, bez ohledu na množství.\n\nTeprve když jsem sytý, cítím se trochu v klidu."
 child_personality.0023.a: "Je to jedna z mála radostí, které mám!"
 child_personality.0024.desc: "Nikdy nevím, kdy dostanu další jídlo, takže když mi někdo podá talíř, nutím se jídlo rozdělit a být spokojený s tím, co dostanu.\n\nNa začátku to bylo těžké, ale teď je to druhá přirozenost."
 child_personality.0024.a: "Střídmost je zásadní."
 child_personality.0025.desc: "Odhoděná lžíce, lesklý kamínek, rozbitý talíř... Kdysi bych se těmito cetkami posmíval, ale došel jsem k poznání, že nic není skutečně bezcenné!"
 child_personality.0025.a: "Sbírám všechny poklady, které najdu."
 child_personality.0026.desc: "Když člověk nevlastní nic, akt laskavosti znamená všechno – [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] jsem se to po těžké zkušenosti. Je ohromující pomyslet na dopad, jaký mohu mít na lidi jednoduchým činem štědrosti!"
 child_personality.0026.a: "Co je moje, patří... všem!"
 child_personality.0027.desc: "Dny mi plynou v mlze za těmito mřížemi. Vstanu, chodím sem a tam, – snad – jím...\n\nJe jedno, jestli se snažím naplnit dny činnostmi nebo ne. Je jedno, jestli se vůbec snažím."
 child_personality.0027.a: "Prostě se vrátím ke spánku."
 child_personality.0028.desc: "Dny mi plynou v mlze za těmito mřížemi. Vstanu, chodím sem a tam, – snad – jím...\n\nAbych dny něčím naplnil, [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] jsem se dávat si úkoly a plnit je dobře."
 child_personality.0028.a: "Pilnost je klíčová!"
 child_personality.0029.desc: "Hloupě se usmívající stráže sledují každý můj krok, [imprisoner.Custom2('InsultAdjective', ROOT.Char)] [imprisoner.Custom2('InsultNoun', ROOT.Char)] [imprisoner.GetTitledFirstName] mě drží zavřeného, potkani šourající se v temných koutech... Uvnitř mě roste vztek a s každým dnem sílí!"
 child_personality.0029.a: "Já... prostě... ARGH!"
 child_personality.0030.desc: "Mohu jen stěží ovlivnit svou situaci, ani denně, ani v širším smyslu. Není mnoho co dělat ani říct."
 child_personality.0030.a: "[Select_CString(ROOT.Char.IsFemale,'Naučila','Naučil')] jsem se to brát s klidem."
 child_personality.0031.desc: "Mohu jen stěží ovlivnit svou situaci, ani denně, ani do budoucna. Musím jen počkat a uvidět, co se stane."
 child_personality.0031.a: "Trpělivost je klíčová."
 child_personality.0032.desc: "Když mě pobyt za mřížemi něco [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')], pak že věci nemohou čekat; nikdy nevíš, co se stane za den, za hodinu, za minutu! Budu vůbec ještě naživu?"
 child_personality.0032.a: "Nemohu plýtvat časem, který mám!"
 child_personality.0033.desc: "Když mě sem hodili, ptal jsem se proč by mě měli držet za mřížemi?\n\nJak dny plynou, došel jsem k závěru, že se mě bojí; bojí se toho, čím se stanu, a proto mě zavřeli."
 child_personality.0033.a: "Jsem prostě tak dobrý!"
 child_personality.0034.desc: "Když mě sem hodili, ptal jsem se proč by mě měli držet za mřížemi?\n\nPostupem času jsem si uvědomil, že jsem musel něco udělat, abych si to zasloužil, a že bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] být vděčný za vše, co mi život navzdory tomu rozhodne dát."
 child_personality.0034.a: "Nežádám mnoho."
 child_personality.0035.desc: "Když mě pobyt za mřížemi něco [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')], pak že nic v tomto životě není zadarmo; abyste dostali, co chcete, musíte podvádět a lhát. Mám štěstí, že moji strážní jsou tak snadno oklamáni!"
 child_personality.0035.a: "Pravdu říkají jen blázni."
 child_personality.0036.desc: "Když mě pobyt za mřížemi něco [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')], pak že lidé neváhají rozdávat tresty, a nejlepší, co mohu udělat, je nedat jim žádný důvod. Navíc mě #EMP always#! někdo sleduje."
 child_personality.0036.a: "Lhaní stejně vede jen k problémům."
 child_personality.0037.desc: "Stráže u mé cely jsou stejně silní jako zatrpklí a sledují každý můj pohyb.\n\nAle když se snažím skrýt, je jen otázka času, než se ke mně přiblíží krysy, nebo něco horšího!"
 child_personality.0037.a: "Každý den přináší nový strach..."
 child_personality.0038.desc: "Stráže u mé cely jsou stejně silní jako zatrpklí a sledují každý můj pohyb. V temnotě jsou krysy a každý den přináší nový děs.\n\n[imprisoner.GetTitledFirstName] bude muset zvýšit [Select_CString(imprisoner.IsFemale,'její','jeho')] snahu, pokud [imprisoner.GetSheHe] mě chce teď vyděsit!"
 child_personality.0038.a: "Ničeho se nebojím."
 child_personality.0039.desc: "Už je to dlouho, co jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] jiného člověka, a nevím, jestli jsem zničený, nebo ulehčený.\n\nNa jednu stranu prahnu po #EMP any#! druhu společenského kontaktu po tak dlouhém pobytu za mřížemi, ale na druhou stranu už nevím, co říct..."
 child_personality.0039.a: "Lidé jsou děsiví!"
 child_personality.0040.desc: "Trávit den co den za mřížemi je tak #EMP boring#!! Jedna z mála věcí, které mi dělají radost, jsou rozhovory, které dokážu navázat se strážemi; mohou být hrubiáni, ale někteří z nich jsou překvapivě zajímaví!"
 child_personality.0040.a: "Prosím, povězte mi víc!"
 child_personality.0041.desc: "Myšlenky na všechny věci, které mi unikají, zatímco tu zahynu za těmito mřížemi, mě udržují vzhůru v noci; všechny ty příležitosti, pryč...\n\nAž se konečně dostanu z této hnusné díry vězení, hodlám dohnat veškerý ztracený čas!"
 child_personality.0041.a: "Nic mě nezastaví!"
 child_personality.0042.desc: "Uvězněn v tomhle vězení jsem se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')], že k přežití nepotřebuji mnoho; přepych a bohatství nemají žádnou vnitřní hodnotu.\n\nAž odsud konečně vylezu, budu si vážit všech věcí, které mám!"
 child_personality.0042.a: "Bez ohledu na jejich hodnotu."
 child_personality.0043.desc: "Za těmito mřížemi jsem se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] cennou lekci: jediný, komu můžeš skutečně věřit, jsi ty sám. Co nakonec znamená názor jiných lidí? A vlastně, co ostatní lidé vůbec znamenají?"
 child_personality.0043.a: "Nezáleží na nich!"
 child_personality.0044.desc: "Nespravedlnost, kterou jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] v tomhle vězení – jak ze strany stráží, tak ostatních vězňů – stačí, aby mi přivodila noční můry.\n\nPokud se k sobě nemůžeme chovat spravedlivě, jaký to má smysl?!"
 child_personality.0044.a: "Bez zákonů nejsme o nic lepší než zvířata."
 child_personality.0045.desc: "Lidé jsou sobečtí; pokud mě pobyt za mřížemi něco [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')], pak právě to.\n\nNečekaně slušné jídlo? Vězni udělají vše, aby si navzájem kradli. Posmívající se strážný, který je žádá, aby se zřekli [ROOT.Char.GetFaith.HighGodName] výměnou za pamlsek? Ani neváhají."
 child_personality.0045.a: "Lidé myslí jen na sebe."
 child_personality.0046.desc: "Jedinou konstantou během mého času za mřížemi [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [ROOT.Char.GetFaith.HighGodNameAlternate]. Kdykoli jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] sklíčen, kdykoli jsem pochyboval, [ROOT.Char.GetFaith.HighGodNameSheHe] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] při mých modlitbách.\n\nS postupujícím časem mám čím dál větší jistotu, že nic opravdu nezáleží kromě mé víry."
 child_personality.0046.a: "Chvála [ROOT.Char.GetFaith.HighGodName]!"
 child_personality.0047.desc: "Kamkoliv jdu, stráže jsou tam a sledují. I když si myslím, že jsem sám, později udělají poznámku, která mi dává najevo, že všechno viděli; že na mě mají neustále oči."
 child_personality.0047.a: "Někdo mě stále sleduje..."
 child_personality.0048.desc: "[imprisoner.GetTitledFirstName] [Select_CString(imprisoner.IsFemale,'řekla','řekl')], že budu oblečen a najeden, a tak tomu bylo. Stráže slíbily, že neuvidím světlo dne, a neviděl jsem.\n\nJediné, v čem jsem si za těmito mřížemi jistý, je, že lidé obvykle říkají pravdu."
 child_personality.0048.a: "Věřím jim."
 child_personality.0049.desc: "Za těmito mřížemi je málo štěstí a i ten nejmenší projev laskavosti má velký význam. Vidět radost v očích druhých, vidět, jak jim stoupne duch... Nic mi nepřináší takový klid."
 child_personality.0049.a: "Laskavost je to jediné, co má význam."
 child_personality.0050.desc: "Nespravedlnost, kterou jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] v tomto vězení – od stráží i ostatních vězňů – stačila, abych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] noční můry. Nebo... dřív stačila. Teď mě už nic nepřekvapí."
 child_personality.0050.a: "Každý je schopen krutosti."
 child_personality.0051.desc: "Radost je za těmito mřížemi vzácná. Stráže jsou stejně nevrlí jako svalnatí, [imprisoner.GetTitledFirstName] je buď strohý nebo nepřátelský a spoluvězni jsou příliš zranění na to, aby mě zabavili. Nebo... tak jsem si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]. Kdykoli je někdo z nich v bolesti, cítím v duši, jak se zbytky radosti probouzejí."
 child_personality.0051.a: "Ten pocit... chci víc!"
 child_personality.0052.desc: "Ostatní lidé rozhodují, co jím, kdy a kde spím, kam jdu... Jediné, co mám za těmito mřížemi, je mé přesvědčení, a tomu nehodlám ustoupit."
 child_personality.0052.a: "Jsem tu jedinou konstantou."
 child_personality.0053.desc: "Už je to tak dlouho, co jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] svobodný(á), že si nepamatuji, jaké to bylo mít svůj život ve vlastních rukou; dělat vlastní rozhodnutí. Teď i ta nejjednodušší otázka mě může zaskočit.\n\nI když mám někdy potíže poznat své preference, zároveň se tím otevírá tolik možností!"
 child_personality.0053.a: "Kdo ví, co chci dělat?"
 child_personality.0054.desc: "Když vás někdo poníží, a vy mu hned odpustíte a zapomenete, určitě vás poníží znovu. Stráž a ostatní vězni mě to naučili.\n\nNaštěstí v tomhle vězení není mnoho jiného než vzpomínání."
 child_personality.0054.a: "[imprisoner.GetTitledFirstNameNoTooltip], pomstím se."
 child_personality.0055.desc: "Když jste dnem i nocí zavřeni se stejnými lidmi, uvědomíte si, že nic není černobílé; lidé mají vždy důvod jednat, jak jednají, a většina se snaží, jak nejlépe umí.\n\nV tomhle vězení bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] kolem sebe jen nepřátele, kdybych [Select_CString(ROOT.Char.IsFemale,'neodpouštěla','neodpouštěl')]."
 child_personality.0055.a: "Držet se záští přináší jen bolest."
 child_personality.0061.t: "Vliv opatrovníka"
 child_personality.0061.desc_opening: "Sámotu si neužívám, přesto mi dělá potíže užívat si společnost jiných. Vždycky se ozve obava, že se při společenských interakcích ztrapňuji."
 child_personality.0061.desc_shy: "Proto cítím silné pouto k [guardian.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)], který(á) se zdá být sužován(á) podobnými myšlenkami."
 child_personality.0061.desc_gregarious: "[guardian.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)], je v tomhle ohledu mým naprostým opakem."
 child_personality.0061.desc_fallback: "Nevím, jestli jsem s těmito myšlenkami sám/sama..."
 child_personality.0061.desc_ending: "Na jedné společenské události jsem [Select_CString(ROOT.Char.IsFemale,'zahlédla','zahlédl')] [guardian.GetTitledFirstNameNoTooltip], kde měli všichni v ruce pití a široké úsměvy. Možná je na tom přísloví, že víno pomáhá uvolnit se, trochu pravdy."
 child_personality.0061.a: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] by to být lék na mou plachost?"
 child_personality.0061.a.tt: "#EMP Je šance, že zlepšíte svou diplomacii a získáte sklony k pití.#!"
 child_personality.0061.b: "Ne, moje plachost je zkouška od [ROOT.Char.GetFaith.HighGodName]! To musí být [ROOT.Char.GetFaith.DevilName], který mě svádí!"
 my_ward_or_child: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] "
 child_personality.101.desc: "[child.GetTitledFirstName] [Select_CString(child.IsFemale,'přišela','přišel')] za mnou s tím, že [bully.GetTitledFirstName] šikanuje [child.GetHerHim]."
 child_personality.101.desc_no_bully: "[child.GetTitledFirstName] [Select_CString(child.IsFemale,'přišela','přišel')] za mnou stěžovat si na [child.Custom('GetDaughterSon')] [child.Custom('lowly_servant_type')], který šikanuje [child.GetHerHim]."
 child_personality.101.craven: "\n\n[child.GetSheHe|U] se po celém hradu skrývá, aby se nemusel/musela postavit tomu druhému dítěti."
 child_personality.101.lazy: "\n\n[child.GetSheHe|U] už několik dní zůstává v posteli, aby se nemusel/musela postavit tomu druhému dítěti."
 child_personality.101.arbitrary: "\n\n[Select_CString(child.IsFemale,'Začala','Začal')] se ptát, jak někoho pověsit, pokud by si to tak [Select_CString(ROOT.Char.IsFemale,'přála','přál')]."
 child_personality.1011.t: "[child.GetFirstNameNoTooltip] v úkrytu"
 child_personality.1012.t: "Zavřený v [Select_CString(child.IsFemale,'jejímu','jeho')] pokoji"
 child_personality.1013.t: "Otázky trestu"
 child_personality.101.confirm_craven: "Dobře. Nehledej zbytečně potíže."
 child_personality.101.confirm_lazy: "Nemusíš čelit světu, pokud nechceš."
 child_personality.1013.confirm_arbitrary: "Tvá vůle je jediný zákon, na kterém skutečně záleží."
 child_personality.101.lazy_change: "Proč se místo toho neschováš ve svém pokoji?"
 child_personality.101.arbitrary_change: "Šikanátor si zaslouží jakýkoli trest, na který si vzpomeneš."
 child_personality.101.craven_change: "Dávej pozor, a zůstaň [Select_CString(ROOT.Char.IsFemale,'skrytá','skrytý')], kamkoli půjdeš!"
 child_personality.1021.t: "Nehodní poddaní"
 child_personality.1022.t: "Uklidnění bolesti"
 child_personality.1023.t: "Sůl na ránu"
 child_personality.102.desc_court_location: "Když jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] v [court_location.Custom('BaronyTownType')] s [child.GetTitledFirstName], [Select_CString(child.IsFemale,'její','jeho')] pozornost upoutal zločinec připoutaný na pranýři."
 child_personality.102.desc: "Když jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] na trhu s [child.GetTitledFirstName], upoutal [Select_CString(child.IsFemale,'její','jeho')] pozornost zločinec připoutaný na pranýři."
 child_personality.102.arrogant: "\n\n[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'vztyčila','vztyčil')] hlavu a [Select_CString(child.IsFemale,'předváděla','předváděl')], jak ignoruje žadonění zločince o vodu."
 child_personality.102.compassionate: "\n\nKdyž muž [Select_CString(ROOT.Char.IsFemale,'prosila','prosil')] o vodu, [child.GetFirstNameNoTooltip] okamžitě [Select_CString(child.IsFemale,'slíbila','slíbil')], že ji přinese, brzy se [Select_CString(child.IsFemale,'vrátila','vrátil')] od nedaleké studny a [Select_CString(child.IsFemale,'nechala','nechal')] zločince pít ze svých dlaní."
 child_personality.102.callous: "\n\n[child.GetFirstNameNoTooltip] ho chvíli [Select_CString(child.IsFemale,'pozorovala','pozoroval')]. Když jen kašlal a [Select_CString(ROOT.Char.IsFemale,'prosila','prosil')] o vodu, [child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'protočila','protočil')] oči a dál [Select_CString(child.IsFemale,'šela','šel')]."
 child_personality.102.confirm_arrogant: "Dobře, dej mu najevo jeho místo."
 child_personality.102.confirm_compassionate: "Bez laskavosti se svět rozpadá."
 child_personality.102.confirm_callous: "Zločinec si od tebe zaslouží jen pohrdání."
 child_personality.102.arrogant_change: "Tento zločinec nestojí ani za tvou pozornost."
 child_personality.102.compassionate_change: "Ne, dítě, přines tomu chudákovi vodu, o kterou žádá."
 child_personality.102.callous_change: "Plivni na něj. Zmlát ho. Nezaslouží si nic víc."
 child_personality.103.desc: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem [Select_CString(ROOT.Char.IsFemale,'šokována','šokován')], když jsem [Select_CString(ROOT.Char.IsFemale,'přistihla','přistihl')] svého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetTitledFirstName], jak se snaží krást z cestovní truhly hosta [robbed_guest.GetTitledFirstName]."
 child_personality.103.deceitful: "\nTo [Select_CString(child.IsFemale,'svalila','svalil')] na hru, kterou vymyslelo jiné dítě, ale [Select_CString(ROOT.Char.IsFemale,'poznala','poznal')] jsem, že lže."
 child_personality.103.honest: "\n[Select_CString(child.IsFemale,'Přiznala','Přiznal')], že si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')], že se tomu vyhne, ale nyní ví, že to bylo špatné."
 child_personality.103.humble: "\nMi [Select_CString(child.IsFemale,'předvedla','předvedl')] působivou řeč o tom, jak nyní chápe, proč to, co [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')], bylo špatné."
 child_personality.1031.t: "Odplata lháře"
 child_personality.1032.t: "Služebník upřímnosti"
 child_personality.1033.t: "Blahoslavení tichí"
 child_personality.103.confirm_deceitful: "Musíš se naučit vyváznout ze svých lží."
 child_personality.103.confirm_honest: "Upřímnost ti v dlouhodobém horizontu prospěje, dítě."
 child_personality.103.confirm_humble: "Jsme jen malé součásti světa."
 child_personality.103.deceitful_change: "Ne, musíme zakrýt tvé provinění!"
 child_personality.103.honest_change: "Buď [Select_CString(ROOT.Char.IsFemale,'upřímná','upřímný')] a uvidíš, že se ti ostatní otevřou."
 child_personality.103.humble_change: "Všichni jsme vedeni pravidly většími než my sami, dítě."
 child_personality.1041.t: "Dar štědrosti"
 child_personality.1042.t: "Dřina a tvrdá práce"
 child_personality.1043.t: "Všechno přijde včas"
 child_personality.104.desc: "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je už dlouho [Select_CString(ROOT.Char.IsFemale,'ohromena','ohromen')] jedním z domácích $knight_culture_player_plural_no_tooltip$. Po konečném setkání osobně [child.GetSheHe] opakuje válečníkova slova sobě samému."
 child_personality.104.generous: "\n\n„Dejte ostatním to, co jim patří, a na oplátku obdržíte to své.“"
 child_personality.104.diligent: "\n\n„Pracuj tvrdě a můžeš v tom zvládnout cokoli.“"
 child_personality.104.patient: "\n\n„Velikost přichází s časem. Buď připraven ji uchopit, až přijde.“"
 child_personality.104.confirm_generous: "Jak budou ostatní růst kolem [child.GetHerHim], tak poroste i [child.GetSheHe]."
 child_personality.104.confirm_diligent: "Ano. Tvrdá práce dovede [child.GetHerHim] tam, kam [child.GetSheHe] chce."
 child_personality.104.confirm_patient: "Ano, příležitosti vždy přicházejí v pravý čas."
 child_personality.104.generous_change: "[child.GetSheHe|U] nesmí nikdy zapomenout na to, jakou roli ostatní hrají v [Select_CString(child.IsFemale,'její','jeho')] velikosti."
 child_personality.104.diligent_change: "Musí být [Select_CString(child.IsFemale,'naučena','naučen')], že tvrdá práce vždy přináší výsledky."
 child_personality.104.patient_change: "Všemu je třeba dát čas, drahý/drahá [child.GetFirstNameNoTooltip]."
 child_personality.1051.t: "Rychle vzteklý"
 child_personality.1052.t: "Vyrovnaný"
 child_personality.1053.t: "Proměnlivé zájmy"
 child_personality.105.desc: "[Select_CString(ROOT.Char.IsFemale,'Pozorovala','Pozoroval')] jsem, jak si [child.GetTitledFirstName] hraje s ostatními dětmi, když se [doing_push.GetTitledFirstName] [Select_CString(doing_push.IsFemale,'pokusila','pokusil')] [child.GetHerHim] shodit."
 child_personality.105.wrathful: "Brzy vypukla mezi dětmi rvačka!"
 child_personality.105.forgiving: "\n[child.GetFirstName] to [Select_CString(child.IsFemale,'vzala','vzal')] s nadhledem a místo toho si [Select_CString(child.IsFemale,'sedla','sedl')] a [Select_CString(child.IsFemale,'promluvila','promluvil')] s [doing_push.GetFirstName]."
 child_personality.105.fickle: "Chvíle netrvala dlouho, protože [child.GetFirstName] brzy z toho [Select_CString(child.IsFemale,'udělala','udělal')] zcela novou hru a tu předešlou úplně [Select_CString(child.IsFemale,'zapomněla','zapomněl')]."
 child_personality.105.confirm_wrathful: "[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'oplatila','oplatil')] stejně, jako [Select_CString(child.IsFemale,'dostala','dostal')]!"
 child_personality.105.confirm_forgiving: "[child.GetFirstNameNoTooltip] ví, kdy nabídnout druhou tvář."
 child_personality.105.confirm_fickle: "Pohnout se dál je často nejlepší přístup."
 child_personality.105.wrathful_change: "[child.GetSheHe|U] nesmí nikdy dovolit, aby s [child.GetHerHim] ostatní zacházeli jako s ničím!"
 child_personality.105.forgiving_change: "[child.GetFirstNameNoTooltip] musí být [Select_CString(child.IsFemale,'naučena','naučen')] nabídnout druhou tvář."
 child_personality.105.fickle_change: "[child.GetFirstNameNoTooltip] by se [Select_CString(child.IsFemale,'neměla','neměl')] zdržovat takovými záležitostmi."
 child_personality.1061.t: "Přetrvávající zášť"
 child_personality.1062.t: "Ztráta zájmu"
 child_personality.1063.t: "Trvání na svém"
 child_personality.106.desc: "[child.GetTitledFirstName] už nějakou dobu skrývá tajnou náklonnost k [crush.GetTitledFirstName]. Když se ale konečně [Select_CString(child.IsFemale,'vyznala','vyznal')] ze [Select_CString(child.IsFemale,'jejích','jeho')] citů, [crush.GetFirstName] na ně [Select_CString(crush.IsFemale,'odpověděla','odpověděl')] krutě."
 child_personality.106.vengeful: "\n\nTeď [child.GetFirstName] mumlá vždy, když [crush.GetSheHe] prochází kolem."
 child_personality.106.chaste: "\n\nOdmítnutí se zdá naučilo [child.GetFirstName] vyhýbat se jakékoli přitažlivosti."
 child_personality.106.stubborn: "\n\n[child.GetFirstName] se však stále stejně neústupně snaží získat [crush.GetHerHim]."
 child_personality.106.confirm_vengeful: "Ach, dětské neřesti."
 child_personality.106.confirm_chaste: "Do záležitostí chtíče by se vůbec nemělo zasahovat."
 child_personality.106.confirm_stubborn: "Když člověk při prvním pokusu selže, může jen zkusit to znovu."
 child_personality.106.vengeful_change: "[child.GetFirstNameNoTooltip] by si [Select_CString(child.IsFemale,'neměla','neměl')] nechat nikoho takto chovat k [child.GetHerHim]!"
 child_personality.106.chaste_change: "Možná láska není pro [child.GetFirstNameNoTooltip]..."
 child_personality.106.stubborn_change: "[child.GetFirstNameNoTooltip] by se [Select_CString(child.IsFemale,'neměla','neměl')] tak snadno vzdávat!"
 child_personality.1071.t: "Přísný rozsudek"
 child_personality.1072.t: "Ve jménu božím"
 child_personality.1073.t: "Inspirující střídmost"
 child_personality.107.desc: "Po smrti odsouzeného zloděje jsem se [Select_CString(ROOT.Char.IsFemale,'zeptala','zeptal')] [child.Custom2('MyCharacterIntroduction', ROOT.Char)], co si o tom [child.GetSheHe] myslí."
 child_personality.107.just: "\n\n[Select_CString(child.IsFemale,'Odpověděla','Odpověděl')], že trest [Select_CString(ROOT.Char.IsFemale,'byla','byl')] na tak malý zločin příliš přísný."
 child_personality.107.cynical: "\n\n[Select_CString(child.IsFemale,'Vyjádřila','Vyjádřil')] pochyby, zda by kterýkoli bůh skutečně [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')], aby říše byla vládnuta tak přísným zákonem."
 child_personality.107.temperate: "\n\n[Select_CString(child.IsFemale,'Tvrdila','Tvrdil')], že se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] ponaučení o tom, že si nemá brát víc, než unese."
 child_personality.107.confirm_just: "Trest skutečně neodpovídal zločinu."
 child_personality.107.confirm_cynical: "Neočekávej, že se projeví [child.GetFaith.HighGodNamePossessive] spravedlnost."
 child_personality.107.confirm_temperate: "Přecenění svých možností může být nesmírně nebezpečné."
 child_personality.107.just_change: "Musí být [Select_CString(child.IsFemale,'naučena','naučen')] správnému vykonávání zákona."
 child_personality.107.cynical_change: "Je čas ukázat [child.GetHerHim], jak málo se [ROOT.Char.GetFaith.HighGodName] stará."
 child_personality.107.temperate_change: "To je lekce střídmosti ve všem."
 child_personality.1081.t: "Bystré oko"
 child_personality.1082.t: "Navazování známostí"
 child_personality.1083.t: "Nevhodná výměna"
 child_personality.108.desc: "[child.GetTitledFirstName] si naši poslední hostinu očividně nesmírně [Select_CString(child.IsFemale,'užila','užil')]!"
 child_personality.108.greedy: "\nZe všeho nejvíc [Select_CString(child.IsFemale,'nemohla','nemohl')] přestat mluvit o bohatých šatech a lesklém zlatě, které tam [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]."
 child_personality.108.gregarious: "\nSi velmi dobře [Select_CString(child.IsFemale,'rozuměla','rozuměl')] se všemi, s nimiž [Select_CString(ROOT.Char.IsFemale,'mluvila','mluvil')], dokonce i s dospělými hosty."
 child_personality.108.lustful: "\nPo tom [Select_CString(child.IsFemale,'nemohla','nemohl')] přestat mluvit o pocitech, které v [child.GetHerHim] vyvolalo setkání očí s jedním z mladších služebníků."
 child_personality.108.confirm_greedy: "To jsou atributy moci, jimiž je náš svět řízen."
 child_personality.108.confirm_gregarious: "Nikdy neuškodí získat přátele."
 child_personality.108.confirm_lustful: "Ach, ten mladý rošťák už dospívá, že ano, [child.GetSheHe]?"
 child_personality.108.greedy_change: "Všimni si, jaká skutečná hodnota spočívá v drahých symbolech moci!"
 child_personality.108.gregarious_change: "Ukážu [child.GetHerHim], jak si na hostině získat přátele!"
 child_personality.108.lustful_change: "[Select_CString(ROOT.Char.IsFemale,'Viděla','Viděl')] jsem, jak ses [Select_CString(ROOT.Char.IsFemale,'dívala','díval')] na toho služebníka, [child.GetFirstNameNoTooltip]."
 child_personality.1091.t: "Pustit se do boje"
 child_personality.1092.t: "Mladý prostředník"
 child_personality.1093.t: "Obránce víry"
 child_personality.109.desc: "Dnes mezi dětmi vznikl rozruch. [child_preacher.GetTitledFirstName] se [Select_CString(child_preacher.IsFemale,'snažila','snažil')] kázat mezi svými vrstevníky a [Select_CString(child_preacher.IsFemale,'stala','stal')] se terčem malé potyčky."
 child_personality.109.desc_fallback: "Dnes mezi dětmi vznikl rozruch. Jedno dítě se pokoušelo kázat mezi vrstevníky a stalo se terčem malé potyčky."
 child_personality.109.brave: "\n\n[child.GetTitledFirstName] [Select_CString(child.IsFemale,'zasáhla','zasáhl')] a [Select_CString(child.IsFemale,'udělala','udělal')], co [Select_CString(child.IsFemale,'mohla','mohl')], aby [Select_CString(child.IsFemale,'ochránila','ochránil')] [child_preacher.GetHerHim]."
 child_personality.109.brave_fallback: "\n\n[child.GetTitledFirstName] [Select_CString(child.IsFemale,'zasáhla','zasáhl')] a [Select_CString(child.IsFemale,'udělala','udělal')], co [Select_CString(child.IsFemale,'mohla','mohl')], aby [Select_CString(child.IsFemale,'ochránila','ochránil')] malého kazatele."
 child_personality.109.calm: "\n\n[child.GetTitledFirstName] [Select_CString(child.IsFemale,'zasáhla','zasáhl')] a podařilo se mu/jí zastavit potyčku dřív, než se někdo [Select_CString(child.IsFemale,'zranila','zranil')]."
 child_personality.109.zealous: "\n\n[child.GetTitledFirstName] [Select_CString(child.IsFemale,'byla','byl')] [Select_CString(child.IsFemale,'rozzlobena','rozzloben')], že někdo [Select_CString(child.IsFemale,'mohla','mohl')] napadnout toho, kdo se snaží mluvit za [child.GetFaith.random_GoodGodNames], a [Select_CString(child.IsFemale,'vyhnala','vyhnal')] ostatní děti."
 child_personality.109.confirm_brave: "Nikdy se neskláněj před výzvou, [child.GetFirstNameNoTooltip]."
 child_personality.109.confirm_calm: "Zachovat klid tváří v tvář tlaku je nesmírně důležité."
 child_personality.109.confirm_zealous: "Budeš božstvu dobře sloužit, dítě!"
 child_personality.109.brave_change: "Neboj se. Vrhni se vpřed, když je třeba."
 child_personality.109.calm_change: "Dovol, abych ti [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')], jak jsi to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] zprostředkovat..."
 child_personality.109.zealous_change: "Nikdy nenech nikoho takhle urážet božstvo."
 child_personality.1101.t: "S jistotou"
 child_personality.1102.t: "S radostí"
 child_personality.1103.t: "S podezřením"
 child_personality.110.desc: "[Select_CString(ROOT.Char.IsFemale,'Vzala','Vzal')] jsem [child.GetFirstName] ven si hrát s lukem, a k mému překvapení [Select_CString(child.IsFemale,'narazila','narazil')] na zraněnou srnu."
 child_personality.110.ambitious: "\n\nAni trochu [Select_CString(child.IsFemale,'neváhala','neváhal')] a [Select_CString(child.IsFemale,'skolila','skolil')] ji."
 child_personality.110.sadistic: "\n\nKdyž mi zvíře [Select_CString(child.IsFemale,'ukázala','ukázal')], jeho zranění svědčila o pomalé a mučivé smrti. [child.GetFirstNameNoTooltip] se jen [Select_CString(child.IsFemale,'usmála','usmál')]."
 child_personality.110.paranoid: "\n\nPozději na mě [Select_CString(child.IsFemale,'Zaútočila','Zaútočil')], myslíc si, že jsem celé to setkání [Select_CString(ROOT.Char.IsFemale,'zinscenovala','zinscenoval')] jako nějaký test."
 child_personality.110.confirm_ambitious: "Velké věci tě čekají, [child.GetFirstNameNoTooltip]."
 child_personality.110.confirm_sadistic: "To je jen zvíře."
 child_personality.110.confirm_paranoid: "Ano, rozhodně to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] test. Dobrá práce, [child.GetFirstNameNoTooltip]."
 child_personality.110.ambitious_change: "Tak mi ukaž, že bys [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] zvíře sám/sama skolit!"
 child_personality.110.sadistic_change: "Někdo vždycky trpí. Postarej se, aby to [Select_CString(ROOT.Char.IsFemale,'nebyla','nebyl')] zrovna ty."
 child_personality.110.paranoid_change: "To [Select_CString(ROOT.Char.IsFemale,'byla','byl')] test. Doufám, že příště uspěješ lépe."
 child_personality.1111.t: "Docela spokojený"
 child_personality.1112.t: "Změna názoru"
 child_personality.1113.t: "Důvěřuje mi"
 child_personality.111.desc: "[child.GetTitledFirstName] mě už dlouho [Select_CString(child.IsFemale,'prosila','prosil')] o [child.Custom('child_object_of_interest_indefinite')], a já jsem [child.GetHerHim] [Select_CString(child.IsFemale,'řekla','řekl')], že [child.GetHerHim] jedno pořídím za tři měsíce, pokud se [child.GetSheHe] více soustředí na [Select_CString(child.IsFemale,'její','jeho')] studium."
 child_personality.111.content: "\n\n[Select_CString(child.IsFemale,'Odpověděla','Odpověděl')], že je [Select_CString(child.IsFemale,'spokojena','spokojen')] s [Select_CString(child.IsFemale,'jejím','jeho')] současným věnováním [Select_CString(child.IsFemale,'jejímu','jeho')] studiu, ať už bude odměna nebo ne."
 child_personality.111.fickle: "\n\nMou nabídku jednoduše [Select_CString(child.IsFemale,'odmávla','odmávl')], a [Select_CString(child.IsFemale,'řekla','řekl')], že [child.GetSheHe] už o to opravdu nestojí."
 child_personality.111.trusting: "\n\nOd té doby, co jsem [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')], [Select_CString(child.IsFemale,'zdvojnásobila','zdvojnásobil')] úsilí ve [Select_CString(child.IsFemale,'jejímu','jeho')] studiu."
 child_personality.111.confirm_content: "Všichni se naučíme žít se svým osudem."
 child_personality.111.confirm_fickle: "Změna názoru je zdravá."
 child_personality.111.confirm_trusting: "Nikdy bych tě [Select_CString(ROOT.Char.IsFemale,'nelhala','nelhal')], [child.GetFirstNameNoTooltip]."
 child_personality.111.content_change: "[child.GetSheHe|U] se musí soustředit na dobrodiní, které už [child.GetSheHe] má."
 child_personality.111.fickle_change: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych [child.GetHerHim] naučit pružnějšímu myšlení."
 child_personality.111.trusting_change: "[child.GetFirstNameNoTooltip] musí být [Select_CString(child.IsFemale,'naučena','naučen')] brát moje slovo vážně."
 child_personality.1121.t: "Tiše odcházet"
 child_personality.1122.t: "Samota v síni"
 child_personality.1123.t: "Malý gurmán"
 child_personality.112.desc: "[child.GetTitledFirstName] [Select_CString(child.IsFemale,'měla','měl')] zjevně těžký večer na naší poslední hostině."
 child_personality.112.impatient: "[Select_CString(child.IsFemale,'Vyklouzla','Vyklouzl')] dříve a po zbytek večera [Select_CString(ROOT.Char.IsFemale,'nebyla','nebyl')] [Select_CString(ROOT.Char.IsFemale,'viděna','viděn')]."
 child_personality.112.shy: "Se [Select_CString(child.IsFemale,'vplížila','vplížil')] pod jeden ze stolů a tam se po celou hostinu [Select_CString(ROOT.Char.IsFemale,'skrývala','skrýval')] před lidmi."
 child_personality.112.gluttonous: "[Select_CString(child.IsFemale,'Zabořila','Zabořil')] obličej do [Select_CString(child.IsFemale,'její','jeho')] jídla a jediné, o čem [Select_CString(child.IsFemale,'mluvila','mluvil')], bylo prosit o porci za porcí."
 child_personality.112.confirm_impatient: "Pokud máš lepší věci na práci, dělej je místo toho."
 child_personality.112.confirm_shy: "Důležité je, aby hosté věděli, že jsi tam [Select_CString(ROOT.Char.IsFemale,'byla','byl')]."
 child_personality.112.confirm_gluttonous: "Jídlo je vždy radost!"
 child_personality.112.impatient_change: "Když to bylo dřina, [Select_CString(ROOT.Char.IsFemale,'měla','měl')] ses prostě odebrat."
 child_personality.112.shy_change: "Je tvou povinností být vidět, ať chceš nebo ne!"
 child_personality.112.gluttonous_change: "Soustřeď se na jídlo, když ti společnost vadí."
 child_personality.2001.t: "Ztratit pojem"
 child_personality.2001.desc: "[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] si hraju s [child.GetTitledFirstName], dávám [child.GetHerHim] vědět, když se [child.GetSheHe] chová podivně, a občas ho/ji trochu postrčím."
 child_personality.2001.craven: "\n\nPřísahám, kdybych to nevěděl líp, [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')] bych, že se [child.GetSheHe] přede mnou schovává."
 child_personality.2001.a: "Co je to za [child.GetSheHe], zbabělec?"
 child_personality.2002.t: "Zavřený"
 child_personality.2002.lazy: "\n\nTeď [child.GetSheHe] tráví celý den zavřený v [Select_CString(child.IsFemale,'jejímu','jeho')] pokoji a nic nedělá."
 child_personality.2002.a: "[child.GetSheHe|U] není žádná zábava."
 child_personality.2003.t: "Nereálný požadavek"
 child_personality.2003.arbitrary: "\n\nTeď [child.GetSheHe] má dost a běžel za dospělými, že bych za to [Select_CString(ROOT.Char.IsFemale,'měla','měl')] být oběšen!"
 child_personality.2003.a: "To je kruté!"
 child_personality.2004.t: "Od boje k přátelství"
 child_personality.2004.desc: "[Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že se se mnou [child.GetTitledFirstName] půjde prát poté, co jsem [child.GetHerHim] při hraní omylem strčil, ale jeho hněv rychle pominul.\n\nMísto toho jsme začali mluvit a pak si znovu hrát. Bylo to hrozně zábavné a teď si hrajeme každý den!"
 child_personality.2004.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že mám kolem sebe takového přítele jako [child.GetFirstNameNoTooltip]."
 child_personality.2005.t: "Vytrvalost"
 child_personality.2005.desc: "[child.GetTitledFirstName] mě tak často [Select_CString(child.IsFemale,'prosila','prosil')], abych si s [child.GetHerHim] [Select_CString(child.IsFemale,'hrála','hrál')] a chodil na procházky, že jsem nakonec musel dát najevo, že prostě nechci.\n\nNejdřív sklíčený, ale brzy bylo jasné, že [child.GetSheHe] nehodlá přestat se snažit mě přesvědčit, abych [child.GetHerHim] [Select_CString(ROOT.Char.IsFemale,'měla','měl')] [Select_CString(ROOT.Char.IsFemale,'ráda','rád')]."
 child_personality.2005.a: "[child.GetSheHe|U] by [Select_CString(ROOT.Char.IsFemale,'měla','měl')] už s tím přestat!"
 child_personality.2005.b: "Je roztomilé, že se [child.GetSheHe] nevzdává."
 child_personality.2005.c: "[child.GetFirstNameNoTooltip]? Kdo to je?"
 child_personality.2006.t: "Můj zachránce"
 child_personality.2006.opening: "[Select_CString(ROOT.Char.IsFemale,'Snažila','Snažil')] jsem se učit ostatní děti, co vím o Bohu, když se mi začaly smát a zvedaly proti mně pěst."
 child_personality.2006.bully: "Navzdory tomu, jak se ke mně [child.GetSheHe] v minulosti choval, [Select_CString(ROOT.Char.IsFemale,'byla','byl')] to [child.GetTitledFirstName] jediný, kdo si troufl zasáhnout a postaral se, že jsem [Select_CString(child.IsFemale,'byla','byl')] v bezpečí."
 child_personality.2006.victim: "Navzdory tomu, jak jsem se k [child.GetHerHim] v minulosti choval, [Select_CString(ROOT.Char.IsFemale,'byla','byl')] to [child.GetTitledFirstName] jediný, kdo si troufl zasáhnout a postaral se, že jsem [Select_CString(child.IsFemale,'byla','byl')] v bezpečí."
 child_personality.2006.desc: "Jediný, kdo si troufl zasáhnout, [Select_CString(ROOT.Char.IsFemale,'byla','byl')] [child.GetTitledFirstName], který se postaral, že jsem [Select_CString(child.IsFemale,'byla','byl')] v bezpečí."
 child_personality.2006.a: "Od té doby jsme si blízcí."
 child_personality.2007.t: "Setkání"
 child_personality.2007.desc: "[child_preacher.GetTitledFirstName] [Select_CString(child_preacher.IsFemale,'mluvila','mluvil')] s mnoha dětmi o [child_preacher.GetFaith.HighGodName] a [Select_CString(child_preacher.IsFemale,'začala','začal')] mi lézt na nervy.\n\nJen jsem [child_preacher.GetHerHim] trochu strkal, když [child.GetTitledFirstName] nečekaně [Select_CString(child.IsFemale,'začala','začal')] na mě krutě bít a říkat mi, ať nechám [child_preacher.GetFirstName] na pokoji."
 child_personality.2007.a: "Jen jsem si trochu dělal srandu, hlupáku!"
 child_personality.3001.t: "Co? Proč? Jak?"
 child_personality.3001.desc: "Je toho tolik k vidění, k vůni, k doteku! Odkud přicházíš? Proč je obloha modrá? Co je za tím kopcem? Prosím, prosím, chci to jít zjistit!"
 child_personality.3001.a: "Je tolik otázek!"
 child_personality.3001.message: "Můj [ROOT.Char.Custom2('RelationToMe', personality_child)] [personality_child.GetTitledFirstName] je pořád plný otázek!"
 child_personality.3002.desc: "Není tu nikdy klid! Můj [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ] [personality_child.GetTitledFirstName] je tak plný otázek! Snažím se [Select_CString(personality_child.IsFemale,'její','jeho')] zvědavost podporovat, ale občas mě ten stálý proud myšlenek a otázek unaví."
 child_personality.3002.a: "Když se otec a matka mají velmi rádi..."
 child_personality.3003.t: "Vzplanutí"
 child_personality.3003.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] [guardian.GetFirstName] mi pořád říká, ať sedím klidně a zůstanu zticha, i když mu říkám, že to není možné! Je to, jako by se mi ruce a nohy hýbaly samy od sebe a když je neposlechnu, odpadnou a utečou beze mě!"
 child_personality.3003.a: "Dělám, co chci!"
 child_personality.3003.message: "Můj [ROOT.Char.Custom2('RelationToMe',personality_child)] [personality_child.GetTitledFirstName] si pořád něco vymýšlí!"
 child_personality.3004.t: "Rostoucí rošťák"
 child_personality.3004.desc: "I když už od mého [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ] [personality_child.GetTitledFirstName] očekávám šibalství, [Select_CString(personality_child.IsFemale,'její','jeho')] tvořivost mě udržuje v pozoru. Když to není žertík, je to rvačka, rozmrzelý vychovatel nebo odřená kolena po dobrodružství, které se zvrtlo."
 child_personality.3004.a: "Nuda tu nikdy není!"
 child_personality.3005.t: "Budoucí vládce"
 child_personality.3005.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] [guardian.GetFirstName] mě pořád přemlouvá, abych občas [Select_CString(guardian.IsFemale,'nechala','nechal')] ostatní děti vybrat hru, ale proč bych to dělal, když vždycky vím, která je nejlepší? Už mě štve, jak mi [guardian.GetHerHim] a všichni ostatní dospělí říkají, co mám dělat!"
 child_personality.3005.a: "Nejsou nade mnou!"
 child_personality.3005.message: "Můj [ROOT.Char.Custom2('RelationToMe',personality_child)] [personality_child.GetTitledFirstName] opravdu ví, co [personality_child.GetSheHe] chce!"
 child_personality.3006.desc: "Není konce názorům a přáním mého [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)], [personality_child.GetTitledFirstName]. Polovinu času se [personality_child.GetSheHe] snaží říkat, co mám dělat, místo abych to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] já."
 child_personality.3006.a: "Impozantní nebo otravný — těžko to rozlišit."
 child_personality.3007.t: "Pracuj chytře, ne tvrdě"
 child_personality.3007.desc: "„Buď hodný a pracuj tvrdě,“ pořád mi říká můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] [guardian.GetFirstName]. Dělám, co můžu, ale někdy je to příliš vyčerpávající! Není chytřejší trochu podvést a lhát, abych [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')], co chci?!"
 child_personality.3007.a: "A všichni se dají tak snadno oklamat!"
 child_personality.3007.message: "Můj [ROOT.Char.Custom2('RelationToMe',personality_child)] [personality_child.GetTitledFirstName] je klamavý a mazaný!"
 child_personality.3008.t: "Sladké úsměvy a malé lži"
 child_personality.3008.desc: "Stejně jako jiné děti v tom věku, můj [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)] [personality_child.GetTitledFirstName] občas lže a zkouší hranice. Nicméně se [personality_child.GetSheHe] často vyhne podezření díky svému milému chování a lidé mu vždy odpustí, když je přistižen.\n\nZajímá mě, kolik si [personality_child.GetSheHe] ještě může dovolit..."
 child_personality.3008.a: "Dám na něj pozor."
 child_personality.3009.t: "Zamyšlený"
 child_personality.3009.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] [guardian.GetFirstName] mi říká, že bych si [Select_CString(guardian.IsFemale,'měla','měl')] hrát s ostatními dětmi. Ale jsou tak hlučné! Musí být ticho, abych slyšel své myšlenky!"
 child_personality.3009.a: "Je tolik, o čem přemýšlet..."
 child_personality.3009.message: "Můj [ROOT.Char.Custom2('RelationToMe',personality_child)] [personality_child.GetTitledFirstName] je často zamyšlený!"
 child_personality.3010.t: "Zamyšlený"
 child_personality.3010.desc: "Můj [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)] [personality_child.GetTitledFirstName] je neobvykle klidné dítě. Když si ostatní hrají své divoké hry, [personality_child.GetFirstNameNoTooltip] se často stáhne do tichého kouta. [personality_child.GetSheHe|U] moc nemluví, ale vidím, že o něčem pořád přemýšlí."
 child_personality.3010.a: "Zajímá mě, na co [personality_child.GetHerHis] myslí."
 child_personality.keeps_lustful_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('lustful').GetName( child.Self )]"
 child_personality.keeps_chaste_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('chaste').GetName( child.Self )]"
 child_personality.keeps_gluttonous_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('gluttonous').GetName( child.Self )]"
 child_personality.keeps_temperate_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('temperate').GetName( child.Self )]"
 child_personality.keeps_greedy_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('greedy').GetName( child.Self )]"
 child_personality.keeps_generous_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('generous').GetName( child.Self )]"
 child_personality.keeps_lazy_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('lazy').GetName( child.Self )]"
 child_personality.keeps_diligent_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('diligent').GetName( child.Self )]"
 child_personality.keeps_envious_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('envious').GetName( child.Self )]"
 child_personality.keeps_wrathful_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('wrathful').GetName( child.Self )]"
 child_personality.keeps_patient_tt: "[child.GetFirstName] si zachovává vlastnost [GetTrait('patient').GetName( child.Self )]"
