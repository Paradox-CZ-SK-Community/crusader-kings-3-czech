l_polish:
 child_personality.0001.t: "Hrozivá postava"
 child_personality.0001.opening: "Kdykoli potkám [bully.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bully'))], pokaždé už [Select_CString(bully.IsFemale,'přišla','přišel')] na nový způsob, jak mě trápit."
 child_personality.0001.bullying_1: "\n\nTentokrát mi [Select_CString(bully.IsFemale,'vyhrožovala','vyhrožoval')], že mi nacpe hlavu do otvoru ve stěně latríny!"
 child_personality.0001.bullying_2: "\n\nTentokrát mě celý den [Select_CString(bully.IsFemale,'pronásledovala','pronásledoval')], [Select_CString(bully.IsFemale,'štěkala','štěkal')] na mě a [Select_CString(bully.IsFemale,'říkala','říkal')] mi vořechu!"
 child_personality.0001.bullying_3: "\n\nTentokrát [Select_CString(bully.IsFemale,'převrhla','převrhl')] svícen a svedla to na mě!"
 child_personality.0001.end: "\n\n[bully.GetTitledFirstName] mě děsí, ale co můžu dělat?"
 child_personality.0001.no_bully_fallback: "[ROOT.GetCharacter.Custom('lowly_servant_type')] má dceru, která je strašná tyranka. Pokaždé, když ji potkám, vymyslí si nový způsob, jak mě trápit. Je tak velká a silná, co proti ní vůbec zmůžu?"
 child_personality.0001.a: "Aspoň už se umím opravdu, opravdu dobře schovávat."
 child_personality.0001.b: "Stejně chci být celý den ve svém pokoji."
 child_personality.0001.c: "Možná by šlo [Select_CString(bully.IsFemale,'ji','ho')] za to nechat pověsit?"
 child_personality.0002.t: "Zločinec"
 child_personality.0002.guardian: "[guardian.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))], mě [Select_CString(guardian.IsFemale,'doprovázela','doprovázel')] ulicemi, když jsme narazili na pranýř. Byl v něm uvězněný muž, který žadonil o vodu nebo jakoukoli úlevu od svého osudu."
 child_personality.0002.no_guardian: "Když jsme procházeli ulicemi, narazili jsme na pranýř. Byl v něm uvězněný muž, který žadonil o vodu nebo jakoukoli úlevu od svého osudu."
 child_personality.0002.a: "Ten zločinec by se na mě neměl odvažovat ani podívat!"
 child_personality.0002.b: "Přinesu mu ze studny trochu vody."
 child_personality.0002.c: "Vodu? Snad mu bude stačit tohle bláto!"
 child_personality.0003.t: "[Select_CString(ROOT.Char.IsFemale,'Přistižena!','Přistižen!')]"
 child_personality.0003.guardian: "[guardian.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))], mě [Select_CString(guardian.IsFemale,'přistihla','přistihl')] při krádeži z cestovní truhly [robbed_guest.GetTitledFirstNamePossessive], zatímco [robbed_guest.GetTitledFirstName] [Select_CString(robbed_guest.IsFemale,'byla','byl')] na návštěvě hradu. [guardian.GetFirstName] mi [Select_CString(guardian.IsFemale,'pohrozila','pohrozil')] trestem a [Select_CString(guardian.IsFemale,'vyžádala','vyžádal')] si vysvětlení."
 child_personality.0003.no_guardian: "Když [robbed_guest.GetTitledFirstName] [Select_CString(robbed_guest.IsFemale,'navštívila','navštívil')] hrad, [Select_CString(robbed_guest.IsFemale,'přistihla','přistihl')] mě při krádeži z cestovní truhly [robbed_guest.GetTitledFirstNamePossessive]. [robbed_guest.GetFirstName] mi [Select_CString(robbed_guest.IsFemale,'pohrozila','pohrozil')] trestem a [Select_CString(robbed_guest.IsFemale,'vyžádala','vyžádal')] si vysvětlení."
 child_personality.0003.a: "Já... jedno z ostatních dětí mě vyzvalo ke hře."
 child_personality.0003.b: "[Select_CString(ROOT.Char.IsFemale,'Doufala','Doufal')] jsem, že mi to projde, ale už to nikdy neudělám."
 child_personality.0003.c: "Nemám na nic větší právo než ostatní."
 child_personality.0004.t: "Dvorská inspirace"
 child_personality.0004.desc: "Na dvoře slouží $knight_culture_player_plural_no_tooltip_lowercase$ a jedna z těchto osob na mě dělá neuvěřitelný dojem. Konečně došlo i na osobní setkání a můj obdiv se nijak nezmenšil. Ta slova si budu pamatovat celý život."
 child_personality.0004.desc_knight: "Na dvoře slouží $knight_culture_player_plural_no_tooltip_lowercase$ a [knight.GetFirstName] na mě dělá neuvěřitelný dojem. Konečně jsme se setkali tváří v tvář a můj obdiv se nijak nezmenšil. [Select_CString(knight.IsFemale,'Její','Jeho')] slova si budu pamatovat celý život."
 child_personality.0004.a: "„Dopřej druhým, co jim náleží, a totéž se vrátí tobě.“"
 child_personality.0004.b: "„Pracuj tvrdě a zvládneš cokoli.“"
 child_personality.0004.c: "„Velikost přichází s časem. Až přijde, chop se jí.“"
 child_personality.0005.t: "Čas na hraní"
 child_personality.0005.desc: "[Select_CString(ROOT.Char.IsFemale,'Hrála','Hrál')] jsem si s ostatními dětmi, když se mě [doing_push.GetFirstName] [Select_CString(doing_push.IsFemale,'pokusila','pokusil')] shodit!\n\n[doing_push.GetFirstName] mě neustále pronásleduje a při každé příležitosti do mě strká... Už mi to začíná lézt na nervy. Musím s tím něco udělat."
 child_personality.0005.a: "Ukážu ti, co se stane tomu, kdo do mě strká!"
 child_personality.0005.b: "Proč do mě strkáš? Já si s tebou chci jen hrát."
 child_personality.0005.c: "Počkej, právě mě napadla jiná hra!"
 child_personality.0006.t: "Srdcervoucí odmítnutí"
 child_personality.0006.desc_crush: "[crush.GetTitledFirstName] mi nejde z hlavy ve dne ani v noci a kdykoli se objeví v hradních chodbách, srdce se mi rozbuší! \n\nKdyž jsem se ale [Select_CString(ROOT.Char.IsFemale,'odhodlala','odhodlal')] přiznat své city, [crush.GetTitledFirstName] se mi [Select_CString(crush.IsFemale,'vysmála a odmítla mě','vysmál a odmítl mě')]. Při odchodu mi jako by [Select_CString(crush.IsFemale,'pošlapala','pošlapal')] srdce."
 child_personality.0006.desc: "Mé srdce teď patří někomu z obyčejného služebnictva. [child.Custom('servant_for_romance')]! Každý pohled mým směrem mi rozbuší srdce.\n\nKdyž jsem ale [Select_CString(ROOT.Char.IsFemale,'dala','dal')] své city najevo, přišlo jen odmítnutí se smíchem. A kdo to byl? [child.Custom('servant_for_romance')]!"
 child_personality.0006.a_crush: "Tohle si [crush.GetFirstName] ještě odskáče!"
 child_personality.0006.a: "Ještě uvidí, co znamená mě takhle odmítnout!"
 child_personality.0006.b: "Jestli je tohle láska, nechci s ní mít nic společného."
 child_personality.0006.c_crush: "[crush.GetFirstName] si vážně myslí, že se tak snadno vzdám?"
 child_personality.0006.c: "Copak si myslí, že se tak snadno vzdám?"
 child_personality.0007.t: "Rozsudek"
 child_personality.0007.desc: "[guardian.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))], se mnou [Select_CString(guardian.IsFemale,'promluvila','promluvil')] o trestu smrti, který před dvěma dny dostal obyčejný zloděj.\n\n[Select_CString(guardian.IsFemale,'Chtěla','Chtěl')] vědět, co si myslím o tak krutém trestu za tak malý zločin."
 child_personality.0007.a: "To bylo příliš. Trest by měl odpovídat zločinu."
 child_personality.0007.b: "Takový zákon do bohabojného panství nepatří."
 child_personality.0007.c: "Všichni bychom se měli spokojit s tím, co máme."
 child_personality.0008.t: "Hostina pro smysly"
 child_personality.0008.desc: "Hostina je záplavou nejrůznějších dojmů. Všude se mluví a hlavu mi plní vůně všemožných jídel. Hosté mají nádherné šaty, služebnictvo nosí jeden talíř za druhým a—\n"
 child_personality.0008.serving_wench: "\nCo mělo znamenat to mrknutí té služky?"
 child_personality.0008.servant_boy: "\nCo mělo znamenat to mrknutí toho sluhy?"
 child_personality.0008.desc_not_server: "\nPořád nemůžu uvěřit, jak působivé to všechno je! Jak nádherná ukázka moci."
 child_personality.0008.a: "Všechno se tak krásně leskne!"
 child_personality.0008.b: "S dospělými je někdy taková zábava si povídat!"
 child_personality.0008.c: "Nemůžu přestat myslet na ten záblesk v těch očích!"
 child_personality.0009.t: "Dětské kázání"
 child_personality.0009.desc: "Dívám se, jak [child_preacher.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('child_preacher'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_preacher'))], promlouvá k několika dalším dětem. Tématem je [child_preacher.GetFaith.random_GoodGodNames]. Chvíli se [Select_CString(child_preacher.IsFemale,'jí','mu')] smějí a pošklebují, pak začne strkání. Navzdory výsměchu se [child_preacher.GetFirstName] snaží pokračovat ve výkladu, dokud nepřijde první rána."
 child_personality.0009.desc_fallback: "Dívám se, jak někdo, s kým se přátelím, promlouvá k několika dalším dětem. Tématem je [ROOT.Char.GetFaith.random_GoodGodNames]. Chvíli se ozývá smích a posměšky, pak začne strkání. Navzdory výsměchu výklad pokračuje, dokud nepřijde první rána."
 child_personality.0009.a: "Ochráním tě!"
 child_personality.0009.a.tt: "Je šance, že utrpíš zranění."
 child_personality.0009.b: "Všichni toho hned nechte a pojďme si o tom promluvit."
 child_personality.0009.c: "Takhle se chováte k někomu, kdo káže boží slovo!?"
 child_personality.0009.d: "To bude zábava!"
 child_personality.0010.t: "Život v mých rukou"
 child_personality.0010.desc: "[guardian.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))], mě [Select_CString(guardian.IsFemale,'vzala','vzal')] do lesa na střelbu z luku. [Select_CString(ROOT.Char.IsFemale,'Když jsem pak odběhla sama','Když jsem pak odběhl sám')], zanedlouho jsem [Select_CString(ROOT.Char.IsFemale,'narazila','narazil')] na zraněnou laň, která se přede mnou snažila odkulhat."
 child_personality.0010.a: "Tohle bude největší zvíře, jaké jsem kdy [Select_CString(ROOT.Char.IsFemale,'skolila','skolil')]!"
 child_personality.0010.b: "Je tak pomalá, že ji můžu bodnout a dívat se, jak vykrvácí."
 child_personality.0010.c: "Tohle je zkouška, kterou pro mě [guardian.GetFirstNameNoTooltip] [Select_CString(guardian.IsFemale,'připravila','připravil')], že ano?"
 child_personality.0011.t: "Předmět mé touhy"
 child_personality.0011.desc: "Už dlouho toužím po jedné věci. [ROOT.GetCharacter.Custom('child_object_of_interest_indefinite')]! [guardian.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))], slibuje, že mi ji za tři měsíce opatří, pokud se začnu učit svědomitěji."
 child_personality.0011.a: "Mně vlastně vyhovuje, jak se učím teď."
 child_personality.0011.b: "Hm, už to vlastně ani nechci."
 child_personality.0011.c: "Budu se pořádně učit!"
 child_personality.0012.t: "Pokažená hostina"
 child_personality.0012.desc: "Tahle hostina je hlučná, dospělí jsou nudní a jídlo nestojí za nic.\n\n[guardian.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))], si hostinu očividně užívá, a tak se mi nedaří získat [Select_CString(guardian.IsFemale,'její','jeho')] pozornost a dát najevo, že tu nechci být."
 child_personality.0012.a: "Vyplížím se. Třeba jsou někde kolem jiné děti."
 child_personality.0012.b: "Tolik lidí nezvládám! Schovám se pod stůl."
 child_personality.0012.c: "Aspoň můžu jíst, dokud tu budu!"
 child_personality.0021.t: "Rodící se osobnost"
 child_personality.0021.desc: "Jednou z mála útěch ve vězení je pozorovat lidi, i když jen zpoza mříží"
 child_personality.0021.serving_wench: "– každé ráno doufám, že alespoň zahlédnu tu krásnou služku."
 child_personality.0021.servant_boy: "– každé ráno doufám, že alespoň zahlédnu toho pohledného sluhu."
 child_personality.0021.desc_no_gender: "– každé ráno doufám, že alespoň zahlédnu někoho pohledného ze služebnictva."
 child_personality.0021.a: "Pak už může zbytek obstarat má představivost..."
 child_personality.0022.desc: "Už jsem si [Select_CString(ROOT.Char.IsFemale,'zvykla','zvykl')] být [Select_CString(ROOT.Char.IsFemale,'sama','sám')]. Není s kým mluvit, s kým si hrát ani s kým se učit. Už jen pomyšlení, že by se mě někdo dotkl..."
 child_personality.0022.a: "Až mi z toho běhá mráz po zádech!"
 child_personality.0023.desc: "Nikdy nevím, kdy dostanu další jídlo, takže když přede mě položí talíř, bez váhání sním všechno, co na něm je, ať je toho sebevíc.\n\nTeprve když jsem [Select_CString(ROOT.Char.IsFemale,'sytá','sytý')], cítím se alespoň trochu v klidu."
 child_personality.0023.a: "Je to jedna z mála radostí, které mám!"
 child_personality.0024.desc: "Nikdy nevím, kdy dostanu další jídlo, takže když přede mě položí talíř, nutím se jídlo šetřit a spokojit se s tím, co dostanu.\n\nZpočátku to bylo těžké, ale teď už je to pro mě přirozené."
 child_personality.0024.a: "Základem je střídmost."
 child_personality.0025.desc: "Odhozená lžíce, lesklý kamínek, rozbitý talíř... Dřív bych se takovým cetkám [Select_CString(ROOT.Char.IsFemale,'vysmála','vysmál')], ale teď už vím, že nic není doopravdy bezcenné!"
 child_personality.0025.a: "Sbírám všechny poklady, které najdu."
 child_personality.0026.desc: "Když člověk nic nemá, znamená každý projev laskavosti všechno. To jsem se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] tvrdou cestou. Je až neuvěřitelné, jak moc mohu pouhým projevem štědrosti ovlivnit ostatní!"
 child_personality.0026.a: "Co je moje, je... všech!"
 child_personality.0027.desc: "Mé dny za těmito mřížemi plynou jeden jako druhý v otupělém oparu. Probudím se, přecházím sem a tam a snad dostanu něco k jídlu...\n\nJe úplně jedno, jestli se snažím své dny něčím vyplnit. Je úplně jedno, jestli se vůbec snažím."
 child_personality.0027.a: "Radši zase půjdu spát."
 child_personality.0028.desc: "Mé dny za těmito mřížemi plynou jeden jako druhý v otupělém oparu. Probudím se, přecházím sem a tam a snad dostanu něco k jídlu...\n\nAbych své dny něčím [Select_CString(ROOT.Char.IsFemale,'vyplnila','vyplnil')], [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] jsem se zadávat si úkoly a pořádně je dokončovat."
 child_personality.0028.a: "Základem je píle!"
 child_personality.0029.desc: "Podlézaví strážní sledující každý můj krok, [imprisoner.Custom2('InsultAdjective', ROOT.Char)] [imprisoner.Custom2('InsultNoun', ROOT.Char)] [imprisoner.GetTitledFirstName], kvůli komu tu hniju za mřížemi, krysy pobíhající v temných koutech... Uvnitř mě roste vztek a každým dnem sílí!"
 child_personality.0029.a: "Já... prostě... ARGH!"
 child_personality.0030.desc: "Se svou situací toho moc nezmůžu, ať už ze dne na den, nebo z dlouhodobého hlediska. Není tu moc co dělat ani co říkat."
 child_personality.0030.a: "[Select_CString(ROOT.Char.IsFemale,'Naučila','Naučil')] jsem se to brát tak, jak to přichází."
 child_personality.0031.desc: "Se svou situací toho moc nezmůžu, ať už ze dne na den, nebo z dlouhodobého hlediska. Nezbývá mi než čekat a sledovat, co se stane."
 child_personality.0031.a: "Základem je trpělivost."
 child_personality.0032.desc: "Jestli mě život za mřížemi něco naučil, pak to, že nic nesnese odkladu. Člověk nikdy neví, co se stane za den, za hodinu, za minutu! Budu vůbec ještě naživu?"
 child_personality.0032.a: "Nemůžu promarnit čas, který mi zbývá!"
 child_personality.0033.desc: "Když mě sem zavřeli, nechápal jsem proč. Proč mě drží za mřížemi?\n\nS každým dalším dnem mi to začíná docházet. Bojí se mě. Bojí se toho, co ze mě vyroste, a proto mě zavřeli."
 child_personality.0033.a: "Jsem prostě tak [Select_CString(ROOT.Char.IsFemale,'dobrá','dobrý')]!"
 child_personality.0034.desc: "Když mě sem zavřeli, nechápal jsem proč. Proč mě drží za mřížemi?\n\nS každým dalším dnem mi začíná docházet, že jsem si to nejspíš něčím [Select_CString(ROOT.Char.IsFemale,'zasloužila','zasloužil')] a [Select_CString(ROOT.Char.IsFemale,'měla bych být vděčná','měl bych být vděčný')] za všechno, co mi život navzdory tomu dopřeje."
 child_personality.0034.a: "Nežádám toho mnoho."
 child_personality.0035.desc: "Jestli mě život za mřížemi něco naučil, pak to, že nic v tomto životě není zadarmo. Chceš-li něco získat, musíš podvádět a lhát. Ještě že se strážní nechají tak snadno obelstít!"
 child_personality.0035.a: "Jen hlupáci říkají pravdu."
 child_personality.0036.desc: "Jestli mě život za mřížemi něco naučil, pak to, že lidé s trestem neváhají, a nejlepší je nedat jim k němu žádný důvod. Navíc se #EMP vždycky#! někdo dívá."
 child_personality.0036.a: "Lhaní stejně přináší jen potíže."
 child_personality.0037.desc: "Strážní před mou celou jsou stejně mohutní jako nevrlí a sledují každý můj pohyb.\n\nKdyž se ale pokusím schovat, je jen otázkou času, než se ke mně přikradou krysy... nebo něco horšího!"
 child_personality.0037.a: "Každý den přináší nový strach..."
 child_personality.0038.desc: "Strážní před mou celou jsou stejně mohutní jako nevrlí a sledují každý můj pohyb. Ve tmě číhají krysy a každý den přináší novou hrůzu.\n\nJestli mě chce [imprisoner.GetTitledFirstName] ještě vyděsit, bude se muset snažit mnohem víc!"
 child_personality.0038.a: "Ničeho se nebojím."
 child_personality.0039.desc: "Už je to dlouho, co jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] jiného člověka, a nevím, jestli mě to ničí, nebo se mi vlastně ulevilo.\n\nNa jednu stranu po tak dlouhé době za mřížemi toužím po #EMP jakémkoli#! kontaktu s lidmi, ale na druhou už ani nevím, co bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] říkat..."
 child_personality.0039.a: "Lidé jsou děsiví!"
 child_personality.0040.desc: "Trávit každý den celý den za mřížemi je taková #EMP nuda#!! Jednou z mála věcí, které mi přinášejí radost, jsou rozhovory se strážnými. Možná jsou to hromotluci, ale někteří jsou překvapivě zajímaví!"
 child_personality.0040.a: "Prosím, povídej dál!"
 child_personality.0041.desc: "Když myslím na všechno, co mi uniká, zatímco tady za mřížemi chřadnu, nemůžu v noci spát. Tolik příležitostí je pryč...\n\nAž se konečně dostanu z téhle prohnilé díry, vynahradím si všechen ztracený čas!"
 child_personality.0041.a: "Nic mě nezastaví!"
 child_personality.0042.desc: "V tomto vězení jsem se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')], že k životu toho mnoho nepotřebuji. Přepych ani bohatství nemají samy o sobě žádnou hodnotu.\n\nAž se odsud konečně dostanu, budu si vážit všeho, co mám!"
 child_personality.0042.a: "Ať to má jakoukoli cenu."
 child_personality.0043.desc: "Za těmito mřížemi jsem se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] jednu cennou lekci: jediný člověk, kterému lze skutečně věřit, jsem já. Co nakonec znamená názor ostatních? A když už jsme u toho, záleží vůbec na ostatních lidech?"
 child_personality.0043.a: "Nezáleží!"
 child_personality.0044.desc: "Nespravedlnost, kterou jsem v tomto vězení [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] jak ze strany strážných, tak ostatních vězňů, mi stačí na noční můry.\n\nJestli se k sobě nedokážeme chovat spravedlivě, jaký to všechno má smysl?!"
 child_personality.0044.a: "Bez zákonů nejsme o nic lepší než zvířata."
 child_personality.0045.desc: "Lidé jsou sobečtí. Jestli mě pobyt za mřížemi něco naučil, pak právě tohle.\n\nNečekaně slušné jídlo? Vězni udělají cokoli, aby si ho navzájem ukradli. Posměvačný strážný jim za nějakou dobrotu nabídne, aby se zřekli [ROOT.Char.GetFaith.HighGodName]? Ani na okamžik nezaváhají."
 child_personality.0045.a: "Lidem záleží jen na sobě."
 child_personality.0046.desc: "Po celou dobu za mřížemi zůstává jedinou jistotou [ROOT.Char.GetFaith.HighGodNameAlternate]. Kdykoli mi bylo těžko, kdykoli jsem [Select_CString(ROOT.Char.IsFemale,'pochybovala','pochyboval')], nacházím v modlitbách útěchu.\n\nS každým dalším dnem jsem si [Select_CString(ROOT.Char.IsFemale,'jistější','jistější')], že kromě mé víry na ničem skutečně nezáleží."
 child_personality.0046.a: "Chvála [ROOT.Char.GetFaith.HighGodName]!"
 child_personality.0047.desc: "Kamkoli jdu, strážní jsou tam a sledují mě. I když si myslím, že jsem [Select_CString(ROOT.Char.IsFemale,'sama','sám')], později utrousí poznámku, která mě ujistí, že všechno viděli. Neustále na mě někdo hledí."
 child_personality.0047.a: "Někdo se vždycky dívá..."
 child_personality.0048.desc: "[imprisoner.GetTitledFirstName] [Select_CString(imprisoner.IsFemale,'slíbila','slíbil')], že dostanu oblečení i jídlo, a dostávám je. Strážní slíbili, že neuvidím denní světlo, a nevidím ho.\n\nZa těmito mřížemi jsem si [Select_CString(ROOT.Char.IsFemale,'začala být jistá','začal být jistý')] jednou věcí: lidé většinou říkají pravdu."
 child_personality.0048.a: "Věřím jim."
 child_personality.0049.desc: "Za těmito mřížemi lze najít jen málo radosti a i sebemenší projev laskavosti znamená mnoho. Vidět radost v očích ostatních, sledovat, jak se jim vrací naděje... Nic mě neuklidňuje víc."
 child_personality.0049.a: "Na laskavosti záleží nejvíc."
 child_personality.0050.desc: "Nespravedlnost, kterou jsem v tomto vězení [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] jak ze strany strážných, tak ostatních vězňů, mi stačí na noční můry. Nebo... dřív stačila. Teď už mě nedokáže překvapit nic."
 child_personality.0050.a: "Krutosti je schopen každý."
 child_personality.0051.desc: "Za těmito mřížemi je radosti poskrovnu. Strážní jsou stejně nevrlí jako mohutní, [imprisoner.GetTitledFirstName] se ke mně chová odměřeně nebo nepřátelsky a ostatní vězni sami příliš trpí, než aby mě dokázali pobavit. Nebo... alespoň jsem si to [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]. Kdykoli některý z nich trpí, cítím, jak se mi v duši probouzí záblesk radosti."
 child_personality.0051.a: "Ten pocit... chci víc!"
 child_personality.0052.desc: "Ostatní rozhodují o tom, co jím, kdy a kde spím, kam smím jít... Jediné, co mi za těmito mřížemi zůstává, je mé přesvědčení, a z něj neustoupím."
 child_personality.0052.a: "Já jsem jediná jistota tohoto místa."
 child_personality.0053.desc: "Už je to tak dlouho, co jsem [Select_CString(ROOT.Char.IsFemale,'byla svobodná','byl svobodný')], že si ani nepamatuji, jaké to bylo mít vlastní život ve svých rukou a dělat vlastní rozhodnutí. Teď mě dokáže zaskočit i ta nejjednodušší otázka.\n\nNěkdy sice ani nevím, co vlastně chci, ale zároveň se přede mnou otevírá tolik možností!"
 child_personality.0053.a: "Kdo ví, co vlastně chci dělat?"
 child_personality.0054.desc: "Když ti někdo ublíží a ty mu ochotně odpustíš a zapomeneš, určitě ti ublíží znovu. To mě naučili strážní i ostatní vězni.\n\nNaštěstí tu kromě vzpomínání stejně není moc co dělat."
 child_personality.0054.a: "[imprisoner.GetTitledFirstNameNoTooltip], pomstím se."
 child_personality.0055.desc: "Když člověk tráví den co den se stejnými lidmi, pochopí, že nic není černobílé. Lidé mají vždy nějaký důvod, proč jednají tak, jak jednají, a téměř každý se snaží, jak nejlépe umí.\n\nKdybych nedokázal odpouštět, měl bych v tomto vězení kolem sebe jen nepřátele."
 child_personality.0055.a: "Lpět na starých křivdách přináší jen bolest."
 child_personality.0061.t: "Vliv výchovy"
 child_personality.0061.desc_opening: "Samota mi není příjemná, ale ani společnost druhých si nedokážu pořádně užít. Při každém rozhovoru mě pronásleduje obava, že se před ostatními ztrapním."
 child_personality.0061.desc_shy: "Zdá se, že [guardian.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)], trápí podobné myšlenky, a proto cítím silnou vzájemnou blízkost."
 child_personality.0061.desc_gregarious: "[guardian.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMe' , guardian)], je v tomto ohledu můj pravý opak."
 child_personality.0061.desc_fallback: "Nevím, jestli podobné myšlenky trápí jen mě..."
 child_personality.0061.desc_ending: "Při jedné společenské události jsem [Select_CString(ROOT.Char.IsFemale,'zahlédla','zahlédl')] [guardian.GetTitledFirstNameNoTooltip]. Všichni přítomní drželi v ruce pohár a široce se usmívali. Možná je něco pravdy na tom, že víno člověku pomáhá se uvolnit."
 child_personality.0061.a: "Že by to byl lék na mou plachost?"
 child_personality.0061.a.tt: "#EMP Je šance, že se zlepší tvá diplomacie a získáš sklon k pití.#!"
 child_personality.0061.b: "Ne, má plachost je zkouška! [ROOT.Char.GetFaith.HighGodName] mě zkouší a [ROOT.Char.GetFaith.DevilName] mě pokouší!"
 my_ward_or_child: "Je to [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]. "
 child_personality.101.desc: "[child.GetTitledFirstName] za mnou [Select_CString(child.IsFemale,'přišla a stěžovala','přišel a stěžoval')] si, že [Select_CString(child.IsFemale,'ji','ho')] [bully.GetTitledFirstName] šikanuje."
 child_personality.101.desc_no_bully: "[child.GetTitledFirstName] za mnou [Select_CString(child.IsFemale,'přišla a stěžovala','přišel a stěžoval')] si, že [Select_CString(child.IsFemale,'ji','ho')] šikanuje jiné dítě. To dítě je [child.Custom('GetDaughterSon')] někoho, kdo je [child.Custom('lowly_servant_type')]."
 child_personality.101.craven: "\n\nPo celém hradě se schovává, aby se tomu druhému dítěti nemusela postavit."
 child_personality.101.lazy: "\n\nUž celé dny zůstává v posteli, jen aby se tomu druhému dítěti nemusela postavit."
 child_personality.101.arbitrary: "\n\n[child.GetFirstNameNoTooltip] se [Select_CString(child.IsFemale,'začala','začal')] vyptávat, jak by šlo někoho nechat pověsit, [Select_CString(child.IsFemale,'pokud by si myslela, že si to zaslouží','pokud by si myslel, že si to zaslouží')]."
 child_personality.1011.t: "[child.GetFirstNameNoTooltip] se schovává"
 child_personality.1012.t: "[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'zamčená','zamčený')] ve svém pokoji"
 child_personality.1013.t: "Otázky trestu"
 child_personality.101.confirm_craven: "Dobře. Nevyhledávej potíže, když to není nutné."
 child_personality.101.confirm_lazy: "Nemusíš čelit světu, pokud nechceš."
 child_personality.1013.confirm_arbitrary: "Tvá vůle je jediný zákon, na kterém skutečně záleží."
 child_personality.101.lazy_change: "Proč se raději neschováš ve svém pokoji?"
 child_personality.101.arbitrary_change: "Kdo šikanuje druhé, zaslouží si jakýkoli trest, který tě napadne."
 child_personality.101.craven_change: "Ať jdeš kamkoli, hlavně zůstaň [Select_CString(child.IsFemale,'schovaná','schovaný')]!"
 child_personality.1021.t: "Nehodní poddaní"
 child_personality.1022.t: "Zmírnění utrpení"
 child_personality.1023.t: "Sůl do rány"
 child_personality.102.desc_court_location: "Když jsme navštívili místo označované jako [court_location.Custom('BaronyTownType')], [child.GetTitledFirstName] si [Select_CString(child.IsFemale,'všimla','všiml')] zločince připoutaného k pranýři."
 child_personality.102.desc: "Když jsme byli na trhu, [child.GetTitledFirstName] si [Select_CString(child.IsFemale,'všimla','všiml')] zločince připoutaného k pranýři."
 child_personality.102.arrogant: "\n\n[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'zvedla hlavu a okázale ignorovala','zvedl hlavu a okázale ignoroval')] zločincovo žadonění o vodu."
 child_personality.102.compassionate: "\n\nKdyž muž začal žadonit o vodu, [child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'mu okamžitě slíbila, že ji přinese, a brzy se vrátila','mu okamžitě slíbil, že ji přinese, a brzy se vrátil')] od nedaleké studny. Zločinec se pak mohl napít ze sepjatých dlaní."
 child_personality.102.callous: "\n\n[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'ho chvíli pozorovala. Když jen kašlal a žadonil o vodu, protočila oči a pokračovala dál','ho chvíli pozoroval. Když jen kašlal a žadonil o vodu, protočil oči a pokračoval dál')]."
 child_personality.102.confirm_arrogant: "Dobře. Ať pozná, kam patří."
 child_personality.102.confirm_compassionate: "Bez laskavosti se svět rozpadne."
 child_personality.102.confirm_callous: "Zločinec si od tebe nezaslouží nic než pohrdání."
 child_personality.102.arrogant_change: "Tenhle zločinec nestojí ani za tvou pozornost."
 child_personality.102.compassionate_change: "Ne, dítě, přines tomu nebožákovi vodu, o kterou prosí."
 child_personality.102.callous_change: "Plivni na něj. Udeř ho. Nic lepšího si nezaslouží."
 child_personality.103.desc: "K mému úžasu se [child.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [Select_CString(child.IsFemale,'snažila','snažil')] krást z cestovní truhly, kterou si při návštěvě [Select_CString(robbed_guest.IsFemale,'přivezla','přivezl')] [robbed_guest.GetTitledFirstName]."
 child_personality.103.deceitful: "\n[child.GetFirstNameNoTooltip] to [Select_CString(child.IsFemale,'svedla','svedl')] na hru, kterou vymyslelo jiné dítě, ale bylo mi jasné, že lže."
 child_personality.103.honest: "\n[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'přiznala, že si myslela','přiznal, že si myslel')], že to projde, ale teď už ví, že to bylo špatně."
 child_personality.103.humble: "\n[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'pronesla','pronesl')] působivou řeč o tom, že teď chápe, proč to, co [Select_CString(child.IsFemale,'udělala','udělal')], bylo špatné."
 child_personality.1031.t: "Cena za lež"
 child_personality.1032.t: "Ve službách pravdy"
 child_personality.1033.t: "Blaze pokorným"
 child_personality.103.confirm_deceitful: "Musíš se naučit, jak zajistit, aby ti lži prošly."
 child_personality.103.confirm_honest: "Z dlouhodobého hlediska ti nejlépe poslouží upřímnost, dítě."
 child_personality.103.confirm_humble: "Všichni jsme jen nepatrnými částmi tohoto světa."
 child_personality.103.deceitful_change: "Ne, musíme tvůj prohřešek utajit!"
 child_personality.103.honest_change: "Buď upřímně a uvidíš, že se ti ostatní otevřou."
 child_personality.103.humble_change: "Všichni se řídíme pravidly, která nás přesahují, dítě."
 child_personality.1041.t: "Dar štědrosti"
 child_personality.1042.t: "Dřina a tvrdá práce"
 child_personality.1043.t: "Všechno má svůj čas"
 child_personality.104.desc: "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] už velmi dlouho obdivuje jednu osobu z našeho dvora. Slouží tu $knight_culture_player_plural_no_tooltip$ a právě mezi nimi si [child.GetFirstName] [Select_CString(child.IsFemale,'našla','našel')] svůj vzor. Po osobním setkání si [child.GetFirstName] stále opakuje slova, která tehdy zazněla."
 child_personality.104.generous: "\n\n„Dopřej druhým, co jim náleží, a totéž se vrátí tobě.“"
 child_personality.104.diligent: "\n\n„Pracuj tvrdě a zvládneš cokoli.“"
 child_personality.104.patient: "\n\n„Velikost přichází s časem. Až přijde, chop se jí.“"
 child_personality.104.confirm_generous: "[child.GetFirstName] poroste spolu s těmi, kterým pomáhá."
 child_personality.104.confirm_diligent: "Přesně tak. Díky tvrdé práci se [child.GetFirstName] dostane tam, kam chce."
 child_personality.104.confirm_patient: "Ano, příležitosti vždycky časem přijdou."
 child_personality.104.generous_change: "[child.GetFirstName] nesmí nikdy zapomenout, že za velikostí stojí i ostatní."
 child_personality.104.diligent_change: "[child.GetFirstName] se musí naučit, že tvrdá práce vždy přináší výsledky."
 child_personality.104.patient_change: "Všechno chce čas, [child.GetFirstNameNoTooltip]."
 child_personality.1051.t: "Vznětlivost"
 child_personality.1052.t: "Klidná povaha"
 child_personality.1053.t: "Proměnlivé zájmy"
 child_personality.105.desc: "Pozoruji, jak si [child.GetTitledFirstName] hraje s ostatními dětmi, když se [doing_push.GetTitledFirstName] [Select_CString(child.IsFemale,'ji','ho')] pokusí shodit."
 child_personality.105.wrathful: "Za okamžik už se mezi dětmi strhne rvačka!"
 child_personality.105.forgiving: "\n[child.GetFirstName] to [Select_CString(child.IsFemale,'vzala','vzal')] s klidem a místo rvačky si [Select_CString(child.IsFemale,'sedla','sedl')] s [doing_push.GetFirstName] a [Select_CString(child.IsFemale,'promluvila','promluvil')] si."
 child_personality.105.fickle: "Celá příhoda ale rychle vyšuměla, protože [child.GetFirstName] z ní brzy [Select_CString(child.IsFemale,'udělala','udělal')] úplně novou hru a na tu předchozí docela [Select_CString(child.IsFemale,'zapomněla','zapomněl')]."
 child_personality.105.confirm_wrathful: "[child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'se nedala','se nedal')]!"
 child_personality.105.confirm_forgiving: "[child.GetFirstNameNoTooltip] ví, kdy je lepší nastavit druhou tvář."
 child_personality.105.confirm_fickle: "Často je nejlepší nechat věci za sebou."
 child_personality.105.wrathful_change: "[child.GetFirstName] si nesmí nikdy nechat všechno líbit!"
 child_personality.105.forgiving_change: "[child.GetFirstNameNoTooltip] se musí naučit nastavovat druhou tvář."
 child_personality.105.fickle_change: "[child.GetFirstNameNoTooltip] by se podobnými věcmi [Select_CString(child.IsFemale,'neměla','neměl')] příliš dlouho zabývat."
 child_personality.1061.t: "Přetrvávající zášť"
 child_personality.1062.t: "Ztráta zájmu"
 child_personality.1063.t: "Vytrvalost"
 child_personality.106.desc: "[child.GetTitledFirstName] už nějakou dobu tajně chová city k [crush.GetTitledFirstName]. Když se však konečně [Select_CString(child.IsFemale,'odhodlala','odhodlal')] své city přiznat, [crush.GetFirstName] [Select_CString(crush.IsFemale,'zareagovala','zareagoval')] velmi tvrdě."
 child_personality.106.vengeful: "\n\nTeď [child.GetFirstName] pokaždé něco rozhořčeně zamumlá, když [crush.GetFirstName] prochází kolem."
 child_personality.106.chaste: "\n\nZdá se, že po tom odmítnutí se [child.GetFirstName] [Select_CString(child.IsFemale,'začala','začal')] mít na pozoru před jakoukoli přitažlivostí."
 child_personality.106.stubborn: "\n\n[child.GetFirstName] však [crush.GetFirstName] stále stejně zarputile pronásleduje."
 child_personality.106.confirm_vengeful: "Ach, dětské neřesti."
 child_personality.106.confirm_chaste: "Do záležitostí chtíče by se člověk vůbec neměl pouštět."
 child_personality.106.confirm_stubborn: "Když se něco napoprvé nepodaří, nezbývá než to zkusit znovu."
 child_personality.106.vengeful_change: "[child.GetFirstNameNoTooltip] si nesmí nechat takové zacházení líbit!"
 child_personality.106.chaste_change: "Možná láska pro [child.GetFirstNameNoTooltip] jednoduše není..."
 child_personality.106.stubborn_change: "[child.GetFirstNameNoTooltip] by se [Select_CString(child.IsFemale,'neměla','neměl')] tak snadno vzdávat!"
 child_personality.1071.t: "Přísný rozsudek"
 child_personality.1072.t: "Ve jménu božského"
 child_personality.1073.t: "Poučení o střídmosti"
 child_personality.107.desc: "Po rozsudku smrti nad obyčejným zlodějem se ptám [child.Custom2('MyCharacterIntroduction', ROOT.Char)], co si o něm myslí."
 child_personality.107.just: "\n\n[child.GetFirstName] [Select_CString(child.IsFemale,'odpověděla','odpověděl')], že za tak malý zločin je trest až příliš krutý."
 child_personality.107.cynical: "\n\n[child.GetFirstName] [Select_CString(child.IsFemale,'vyjádřila','vyjádřil')] pochybnost, zda by si vůbec nějaký bůh mohl přát, aby panství řídily tak kruté zákony."
 child_personality.107.temperate: "\n\n[child.GetFirstName] [Select_CString(child.IsFemale,'prohlásila','prohlásil')], že si z toho [Select_CString(child.IsFemale,'odnesla','odnesl')] poučení, že člověk nemá sahat po něčem, co nedokáže zvládnout."
 child_personality.107.confirm_just: "Trest skutečně neodpovídal zločinu."
 child_personality.107.confirm_cynical: "Od [child.GetFaith.HighGodName] žádnou spravedlnost nečekej."
 child_personality.107.confirm_temperate: "Přehnané ambice mohou být strašlivě nebezpečné."
 child_personality.107.just_change: "[child.GetFirstName] se musí naučit, jak se má zákon správně vykonávat."
 child_personality.107.cynical_change: "Je načase ukázat, jak málo [ROOT.Char.GetFaith.HighGodName] dbá na lidské trápení."
 child_personality.107.temperate_change: "Tohle je lekce střídmosti ve všem."
 child_personality.1081.t: "Bystré oko"
 child_personality.1082.t: "Navazování známostí"
 child_personality.1083.t: "Nevhodné okouzlení"
 child_personality.108.desc: "[child.GetTitledFirstName] si naši poslední hostinu očividně [Select_CString(child.IsFemale,'užila','užil')]!"
 child_personality.108.greedy: "\nZe všeho nejvíc [child.GetFirstName] pořád mluví o drahých šatech a třpytivém zlatě, které tam [Select_CString(child.IsFemale,'viděla','viděl')]."
 child_personality.108.gregarious: "\n[child.GetFirstName] si skvěle [Select_CString(child.IsFemale,'rozuměla','rozuměl')] se všemi, s nimiž [Select_CString(child.IsFemale,'mluvila','mluvil')], dokonce i s dospělými hosty."
 child_personality.108.lustful: "\nPotom [child.GetFirstName] nedokázal přestat mluvit o pocitech, které vyvolal pohled do očí jednoho z mladších členů služebnictva."
 child_personality.108.confirm_greedy: "To jsou symboly moci, které vládnou našemu světu."
 child_personality.108.confirm_gregarious: "Nikdy neuškodí získat nové přátele."
 child_personality.108.confirm_lustful: "Ale, ale, [child.GetFirstName] už nám [Select_CString(child.IsFemale,'dospívá','dospívá')], co?"
 child_personality.108.greedy_change: "Všimni si, že skutečná hodnota spočívá v drahocenných symbolech moci!"
 child_personality.108.gregarious_change: "Ukážu ti, jak se na hostině navazují přátelství!"
 child_personality.108.lustful_change: "Viděl jsem, jak ses na toho člověka ze služebnictva [Select_CString(child.IsFemale,'dívala','díval')], [child.GetFirstNameNoTooltip]."
 child_personality.1091.t: "Po hlavě do rvačky"
 child_personality.1092.t: "Mladý prostředník"
 child_personality.1093.t: "Obránce víry"
 child_personality.109.desc: "Dnes mezi dětmi vypukl rozruch. [child_preacher.GetTitledFirstName] se [Select_CString(child_preacher.IsFemale,'pokoušela','pokoušel')] kázat ostatním dětem, ale nakonec se [Select_CString(child_preacher.IsFemale,'stala','stal')] terčem menší rvačky."
 child_personality.109.desc_fallback: "Dnes mezi dětmi vypukl rozruch. Jedno z nich se pokoušelo kázat ostatním, ale nakonec se stalo terčem menší rvačky."
 child_personality.109.brave: "\n\n[child.GetTitledFirstName] [Select_CString(child.IsFemale,'zasáhla a udělala','zasáhl a udělal')] vše, co bylo v [Select_CString(child.IsFemale,'jejích','jeho')] silách, aby [child_preacher.GetFirstName] [Select_CString(child_preacher.IsFemale,'nepřišla','nepřišel')] k úhoně."
 child_personality.109.brave_fallback: "\n\n[child.GetTitledFirstName] [Select_CString(child.IsFemale,'zasáhla a udělala','zasáhl a udělal')] vše, co bylo v [Select_CString(child.IsFemale,'jejích','jeho')] silách, aby malého kazatele [Select_CString(child.IsFemale,'ochránila','ochránil')]."
 child_personality.109.calm: "\n\n[child.GetTitledFirstName] [Select_CString(child.IsFemale,'zasáhla a dokázala','zasáhl a dokázal')] rvačku ukončit dřív, než se někomu něco stalo."
 child_personality.109.zealous: "\n\n[child.GetTitledFirstName] se [Select_CString(child.IsFemale,'rozzuřila','rozzuřil')], že ostatní napadli dítě, které chtělo jen ukázat, jaké místo má [child.GetFaith.random_GoodGodNames] v jeho srdci. Nakonec je [Select_CString(child.IsFemale,'všechny rozehnala','všechny rozehnal')]."
 child_personality.109.confirm_brave: "Nikdy před výzvou neustupuj, [child.GetFirstNameNoTooltip]."
 child_personality.109.confirm_calm: "Zachovat klid pod tlakem je nesmírně důležité."
 child_personality.109.confirm_zealous: "[child.GetFaith.HighGodName] v tobě získá [Select_CString(child.IsFemale,'věrnou služebnici','věrného služebníka')]."
 child_personality.109.brave_change: "Neboj se. Když je třeba, vrhni se do toho."
 child_personality.109.calm_change: "Povím ti, jak se takový spor dal urovnat..."
 child_personality.109.zealous_change: "Nikdy nikomu nedovol takhle se rouhat."
 child_personality.1101.t: "Bez zaváhání"
 child_personality.1102.t: "S potěšením"
 child_personality.1103.t: "S podezřením"
 child_personality.110.desc: "[child.GetFirstName] jsem [Select_CString(ROOT.Char.IsFemale,'vzala','vzal')] ven zastřílet si z luku a k mému překvapení [Select_CString(child.IsFemale,'narazila','narazil')] na zraněnou laň."
 child_personality.110.ambitious: "\n\nAni na okamžik [Select_CString(child.IsFemale,'nezaváhala','nezaváhal')] a laň [Select_CString(child.IsFemale,'skolila','skolil')]."
 child_personality.110.sadistic: "\n\nKdyž mi [child.GetFirstName] zvíře [Select_CString(child.IsFemale,'ukázala','ukázal')], jeho rány svědčily o pomalé a trýznivé smrti. [child.GetFirstNameNoTooltip] se jen [Select_CString(child.IsFemale,'usmála','usmál')]."
 child_personality.110.paranoid: "\n\nPozději se na mě [child.GetFirstName] [Select_CString(child.IsFemale,'obořila','obořil')], protože si [Select_CString(child.IsFemale,'myslela','myslel')], že jsem celé setkání [Select_CString(ROOT.Char.IsFemale,'zinscenovala','zinscenoval')] jako nějakou zkoušku."
 child_personality.110.confirm_ambitious: "Čeká tě velikost, [child.GetFirstNameNoTooltip]."
 child_personality.110.confirm_sadistic: "Je to jen zvíře."
 child_personality.110.confirm_paranoid: "Ano, samozřejmě to byla zkouška. Dobrá práce, [child.GetFirstNameNoTooltip]."
 child_personality.110.ambitious_change: "Tak mi ukaž, že bys [Select_CString(child.IsFemale,'dokázala','dokázal')] zvíře skolit i bez pomoci!"
 child_personality.110.sadistic_change: "Někdo vždycky trpí. Postarej se, abys to [Select_CString(child.IsFemale,'nebyla','nebyl')] ty."
 child_personality.110.paranoid_change: "Byla to zkouška. Doufám, že příště si povedeš lépe."
 child_personality.1111.t: "Docela [Select_CString(child.IsFemale,'spokojená','spokojený')]"
 child_personality.1112.t: "Změna názoru"
 child_personality.1113.t: "Důvěra ve mne"
 child_personality.111.desc: "[child.GetTitledFirstName] po mně už dlouho něco chce: [child.Custom('child_object_of_interest_indefinite')]. [Select_CString(ROOT.Char.IsFemale,'Slíbila','Slíbil')] jsem, že za tři měsíce přání splním, pokud se začne svému studiu věnovat soustředěněji."
 child_personality.111.content: "\n\n[child.GetFirstName] [Select_CString(child.IsFemale,'odpověděla','odpověděl')], že je se svým současným přístupem ke studiu [Select_CString(child.IsFemale,'spokojená','spokojený')], ať už za něj přijde odměna, nebo ne."
 child_personality.111.fickle: "\n\n[child.GetFirstName] mou nabídku jednoduše [Select_CString(child.IsFemale,'mávnutím odmítla','mávnutím odmítl')] s tím, že už o to vlastně nestojí."
 child_personality.111.trusting: "\n\nOd chvíle, kdy jsem ten slib [Select_CString(ROOT.Char.IsFemale,'dala','dal')], se [child.GetFirstName] svému studiu věnuje s dvojnásobným úsilím."
 child_personality.111.confirm_content: "Všichni se jednou naučíme žít s tím, co nám život nadělil."
 child_personality.111.confirm_fickle: "Měnit názory je zdravé."
 child_personality.111.confirm_trusting: "Nikdy bych tě [Select_CString(ROOT.Char.IsFemale,'nepodvedla','nepodvedl')], [child.GetFirstNameNoTooltip]."
 child_personality.111.content_change: "[child.GetFirstName] se musí soustředit na to dobré, co už má."
 child_personality.111.fickle_change: "[Select_CString(ROOT.Char.IsFemale,'Měla bych','Měl bych')] [child.GetFirstName] naučit větší pružnosti v uvažování."
 child_personality.111.trusting_change: "[child.GetFirstNameNoTooltip] se musí naučit věřit mému slovu."
 child_personality.1121.t: "Nenápadný útěk"
 child_personality.1122.t: "Samota v sále"
 child_personality.1123.t: "Malý labužník"
 child_personality.112.desc: "Zdá se, že [child.GetTitledFirstName] naši poslední hostinu [Select_CString(child.IsFemale,'snášela','snášel')] dost těžce."
 child_personality.112.impatient: "[child.GetFirstName] se [Select_CString(child.IsFemale,'vyplížila','vyplížil')] pryč předčasně a po zbytek večera už [Select_CString(child.IsFemale,'nebyla','nebyl')] k vidění."
 child_personality.112.shy: "[child.GetFirstName] se [Select_CString(child.IsFemale,'schovala','schoval')] pod jeden ze stolů a po celou hostinu se tam [Select_CString(child.IsFemale,'skrývala','skrýval')] před lidmi."
 child_personality.112.gluttonous: "[child.GetFirstName] se [Select_CString(child.IsFemale,'ponořila','ponořil')] do jídla tak důkladně, že promluvil jen tehdy, když žádal o další a další porci."
 child_personality.112.confirm_impatient: "Jestli máš něco lepšího na práci, věnuj se raději tomu."
 child_personality.112.confirm_shy: "Důležité je, že hosté vědí, že jsi tam [Select_CString(child.IsFemale,'byla','byl')]."
 child_personality.112.confirm_gluttonous: "Jídlo je vždycky radost!"
 child_personality.112.impatient_change: "Jestli ti to připadalo jako povinnost, [Select_CString(child.IsFemale,'měla','měl')] jsi prostě odejít."
 child_personality.112.shy_change: "Je tvou povinností ukázat se, ať chceš, nebo ne!"
 child_personality.112.gluttonous_change: "Jestli ti vadí společnost, soustřeď se na jídlo."
 child_personality.2001.t: "Ztracená stopa"
 child_personality.2001.desc: "[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] si s [child.GetTitledFirstName] hraju, dávám najevo, když se chová divně, a občas do [Select_CString(child.IsFemale,'ní','něj')] trochu strčím."
 child_personality.2001.craven: "\n\nPřísahám, kdybych [Select_CString(ROOT.Char.IsFemale,'nevěděla','nevěděl')] své, [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')] bych, že se přede mnou schovává."
 child_personality.2001.a: "Co je [child.GetFirstName], nějaký strašpytel?"
 child_personality.2002.t: "Za zavřenými dveřmi"
 child_personality.2002.lazy: "\n\nTeď [child.GetFirstName] tráví celé dny [Select_CString(child.IsFemale,'zavřená','zavřený')] ve svém pokoji a nic nedělá."
 child_personality.2002.a: "S [child.GetFirstName] už není žádná zábava."
 child_personality.2003.t: "Nesmyslný požadavek"
 child_personality.2003.arbitrary: "\n\nTeď už toho má [child.GetFirstName] dost a [Select_CString(child.IsFemale,'běžela','běžel')] za dospělými žalovat, že by mě za to měli pověsit!"
 child_personality.2003.a: "To je trochu přehnané!"
 child_personality.2004.t: "Od rvačky k přátelství"
 child_personality.2004.desc: "Když jsem při hře omylem [child.GetTitledFirstName] [Select_CString(child.IsFemale,'strčila','strčil')], [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')] jsem, že se do mě pustí. Jenže vztek [Select_CString(child.IsFemale,'ji','ho')] rychle přešel.\n\nMísto toho jsme si začali povídat a pak si zase hráli. Byla to taková zábava, že si teď hrajeme každý den!"
 child_personality.2004.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že mám [child.GetFirstNameNoTooltip] za přítele."
 child_personality.2005.t: "Vytrvalost"
 child_personality.2005.desc: "[child.GetTitledFirstName] mě už tolikrát [Select_CString(child.IsFemale,'prosila','prosil')], ať si jdu hrát nebo na procházku, že jsem nakonec [Select_CString(ROOT.Char.IsFemale,'musela','musel')] jasně říct, že prostě nechci.\n\nZpočátku to [child.GetFirstName] [Select_CString(child.IsFemale,'nesla','nesl')] těžce, ale brzy bylo jasné, že se jen tak nevzdá snahy získat si mou náklonnost."
 child_personality.2005.a: "Už by toho [Select_CString(child.IsFemale,'měla','měl')] nechat!"
 child_personality.2005.b: "Je roztomilé, jak se [child.GetFirstName] nechce vzdát."
 child_personality.2005.c: "[child.GetFirstNameNoTooltip]? Kdo to je?"
 child_personality.2006.t: "Můj zachránce"
 child_personality.2006.opening: "Snažím se ostatní děti učit tomu, co vím o Bohu, jenže ony se mi začaly posmívat a zvedat proti mně pěsti."
 child_personality.2006.bully: "Navzdory tomu, jak se ke mně [child.GetTitledFirstName] v minulosti [Select_CString(child.IsFemale,'chovala','choval')], jako [Select_CString(child.IsFemale,'jediná se odvážila','jediný se odvážil')] zasáhnout a postarala se o mé bezpečí."
 child_personality.2006.victim: "Navzdory tomu, jak jsem se k [child.GetTitledFirstName] v minulosti [Select_CString(ROOT.Char.IsFemale,'chovala','choval')], jako [Select_CString(child.IsFemale,'jediná se odvážila','jediný se odvážil')] zasáhnout a postarala se o mé bezpečí."
 child_personality.2006.desc: "Jako [Select_CString(child.IsFemale,'jediná se odvážila','jediný se odvážil')] zasáhnout [child.GetTitledFirstName] a postarala se o mé bezpečí."
 child_personality.2006.a: "Od té doby jsme si blízcí."
 child_personality.2007.t: "Střetnutí"
 child_personality.2007.desc: "[child_preacher.GetTitledFirstName] mluví k ostatním dětem a hlavním tématem je [child_preacher.GetFaith.HighGodName]. Začíná mi to pořádně lézt na nervy.\n\nJen jsem do [Select_CString(child_preacher.IsFemale,'ní','něj')] trochu [Select_CString(ROOT.Char.IsFemale,'strkala','strkal')], když se zničehonic objevila [child.GetTitledFirstName] a [Select_CString(child.IsFemale,'začala','začal')] mě surově mlátit a křičet, ať nechám [child_preacher.GetFirstName] na pokoji."
 child_personality.2007.a: "Jen jsem si trochu [Select_CString(ROOT.Char.IsFemale,'hrála','hrál')], idiote!"
 child_personality.3001.t: "Co? Proč? Jak?"
 child_personality.3001.desc: "Je toho tolik k vidění, očichání i osahání! Odkud pocházíš? Proč je nebe modré? Co je za tamtím kopcem? Prosím, prosím, chci to zjistit!"
 child_personality.3001.a: "Tolik otázek!"
 child_personality.3001.message: "[personality_child.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', personality_child)], má pořád nějaké otázky!"
 child_personality.3002.desc: "[personality_child.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)], je samá otázka! Není chvíle klidu. Snažím se [Select_CString(personality_child.IsFemale,'její','jeho')] zvídavost všemožně podporovat, ale někdy mě ten nekonečný proud nápadů a otázek zkrátka vyčerpává."
 child_personality.3002.a: "Když se tatínek a maminka mají moc rádi..."
 child_personality.3003.t: "Plápolající oheň"
 child_personality.3003.desc: "[guardian.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))], mi pořád přikazuje, ať sedím v klidu a mlčím, i když pořád říkám, že to nejde! Jako by se mi ruce a nohy hýbaly samy, a když za nimi nepůjdu, upadnou mi a utečou beze mě!"
 child_personality.3003.a: "Budu si dělat, co chci!"
 child_personality.3003.message: "[personality_child.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',personality_child)], pořád něco vyvádí!"
 child_personality.3004.t: "Rodící se potížista"
 child_personality.3004.desc: "Od [personality_child.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ], už nějaké to rošťáctví čekám, ale [Select_CString(personality_child.IsFemale,'její','jeho')] vynalézavost mě stále dokáže překvapit. Když zrovna nejde o nějaký žertík, přijde rvačka, rozzlobený učitel nebo odřená kolena po dobrodružství, které se zvrtlo."
 child_personality.3004.a: "S tímhle dítětem se člověk nikdy nenudí!"
 child_personality.3005.t: "Budoucí vládce"
 child_personality.3005.desc: "[guardian.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))], mi pořád říká, že bych někdy měl nechat ostatní děti vybrat, co si budeme hrát. Ale proč, když vždycky vím, která hra je nejlepší? Už mám dost toho, jak mi [guardian.GetFirstName] i všichni ostatní dospělí pořád říkají, co mám dělat!"
 child_personality.3005.a: "Oni mi poroučet nebudou!"
 child_personality.3005.message: "[personality_child.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',personality_child)], moc dobře ví, co chce!"
 child_personality.3006.desc: "[personality_child.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ], má na všechno vlastní názor a vždycky přesně ví, co chce. Polovinu času se mi dokonce snaží poroučet místo toho, aby to bylo naopak!"
 child_personality.3006.a: "Obdivuhodné, nebo otravné? Hranice je tenká."
 child_personality.3007.t: "Chytře, ne těžce"
 child_personality.3007.desc: "„Buď hodný a pořádně pracuj,“ říká mi pořád [guardian.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))]. Snažím se, ale někdy je to prostě příliš únavné! Není chytřejší trochu podvádět a lhát, abych dostal to, co chci?!"
 child_personality.3007.a: "A navíc se všichni tak snadno napálí!"
 child_personality.3007.message: "[personality_child.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',personality_child)], je [Select_CString(personality_child.IsFemale,'mazaná a prohnaná','mazaný a prohnaný')]!"
 child_personality.3008.t: "Sladké úsměvy a malé lži"
 child_personality.3008.desc: "Stejně jako jiné děti v tomhle věku i [personality_child.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child)], občas lže a zkouší, co všechno si může dovolit. Díky svému roztomilému vystupování však často unikne podezření, a když už je [Select_CString(personality_child.IsFemale,'přistižena','přistižen')], lidé [Select_CString(personality_child.IsFemale,'jí','mu')] vždycky odpustí.\n\nKolik toho asi [Select_CString(personality_child.IsFemale,'jí','mu')] ve skutečnosti prochází..."
 child_personality.3008.a: "Na tohle dítě si dám pozor."
 child_personality.3009.t: "Pohroužený do myšlenek"
 child_personality.3009.desc: "[guardian.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))], mi říká, že bych si měl hrát s ostatními dětmi. Jenže jsou tak hlučné! Potřebuji ticho, abych vůbec slyšel vlastní myšlenky!"
 child_personality.3009.a: "Je toho tolik k přemýšlení..."
 child_personality.3009.message: "[personality_child.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',personality_child)], se často ztrácí ve vlastních myšlenkách!"
 child_personality.3010.t: "Pohroužený do myšlenek"
 child_personality.3010.desc: "[personality_child.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , personality_child) ], je nezvykle klidné dítě. Když ostatní dovádějí při svých divokých hrách, [personality_child.GetFirstNameNoTooltip] se často stáhne do nějakého tichého kouta. Moc toho nenamluví, ale je vidět, že pořád nad něčím přemýšlí."
 child_personality.3010.a: "Nad čím asi [personality_child.GetFirstName] přemýšlí?"
