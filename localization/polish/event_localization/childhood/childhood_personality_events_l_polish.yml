 child_personality.9901.dull.desc: "tak trochu [Select_CString(child.IsFemale,'pomalejší','pomalejší')], řekněme,"
 child_personality.9901.end.desc: "přesně jako [Select_CString(child.IsFemale,'její','jeho')] [child.Custom2('RelationToMe', ancestor)] [ancestor.GetTitledFirstNameNoTooltip]. Možná se na tento svět skutečně [ancestor.GetTitledFirstNameNoTooltip] [Select_CString(ancestor.IsFemale,'vrátila','vrátil')]?"
 child_personality.9901.a: "Vesmír je plný posvátných tajemství."
