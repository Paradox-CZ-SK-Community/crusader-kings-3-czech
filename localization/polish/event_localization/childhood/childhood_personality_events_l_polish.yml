 child_personality.9900.start.sinful.desc: "Lidé mi pořád říkají, že vypadám přesně jako [ancestor.GetTitledFirstName], [Select_CString(ancestor.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMe', ancestor)]. Nikdy jsme se nesetkali, ale podle všeho to [Select_CString(ancestor.IsFemale,'byla zlá žena','byl zlý muž')].\n\n"
