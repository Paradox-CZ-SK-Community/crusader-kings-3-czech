 child_personality.4011.t: "Rodící se přitažlivost"
 child_personality.4011.desc_opening: "Zachumlám se v posteli pod kožešinou zvířete známého jako [ROOT.Char.Custom('GetAnimalType')] a v příjemném teple pomalu usínám.\n\n"
 child_personality.4011.desc_1: "Přede mnou stojí nádherné zvíře: [ROOT.Char.Custom('GetAnimalType')]. Pobízí mě, ať ho následuji. Před námi se rozprostírá [ROOT.Char.Custom('TerrainType')]. Když dorazíme na mýtinu, srdce se mi rozbuší, tělem mi proběhne zvláštní chvění a celá má duše začne #EMP toužit#!. Otočím se, ale [ROOT.Char.Custom('GetAnimalType')] je pryč. Místo něj přede mnou stojí nádherný..."
 child_personality.4011.desc_2: "Přede mnou stojí postava zahalená v mlze a gestem mě zve blíž. Přistoupím a dotknu se jí. Mlha se začíná rozplývat a naše tváře zalije horkost. Nakloním se k polibku. Když se znovu odtáhnu, přivítá mě vřelý úsměv. Je to nádherný..."
 child_personality.4011.desc_3: "Uprostřed noci sebou trhnu a probudím se, prudce oddechuji a po kůži mi běhá mráz. Nikdy jsem nic takového [Select_CString(ROOT.Char.IsFemale,'necítila','necítil')]. Jsem snad [Select_CString(ROOT.Char.IsFemale,'nemocná','nemocný')]? O čem se mi to zdálo? Jediné, co si vybavuji, je nádherný..."
 child_personality.4011.a: "...chlapec."
 child_personality.4011.b: "...dívka."
 child_personality.4011.c: "...dívka. Nebo to byl chlapec? Už si nejsem [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')]."
 child_personality.4011.d: "...člověk. Popravdě jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že to byl jen sen."
 child_personality.4012.desc: "Říkali mi, že je přirozené cítit k některým lidem přitažlivost a že je časem budu chtít poznat mnohem důvěrněji.\n\nSnažím se přijít na to, co to všechno znamená, ale zatím jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')] jen jedno: zkoumat tuhle záhadu je zábava pouze tehdy, když jsou kolem další [ROOT.Char.Custom('GirlBoyPlural')]."
 child_personality.4012.a: "[ROOT.Char.Custom('GirlBoyPlural')|U] jsou prostě nejlepší!"
 child_personality.4013.desc: "Při hrách s ostatními dětmi jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], že mi při našich důvěrnějších hrách vůbec nezáleží na tom, jestli mě dají dohromady s dívkou, nebo s chlapcem. Spousta ostatních dětí má jasné preference a některé kolem toho dokonce dělají velký povyk, ale nechápu proč."
 child_personality.4013.a: "Dívky i chlapci jsou tak zajímaví!"
 child_personality.4014.desc: "Zdá se, že si všichni kolem mě chtějí někoho vybrat. Usmívají se na sebe a hrají si na pusy a dotýkání. Když o nic z toho nejevím zájem, ostatní to nechápou a [dummy_opposite_gender.Custom('GirlBoyPlural')|l] mi tvrdí, že bych o ně [Select_CString(ROOT.Char.IsFemale,'měla','měl')] mít větší zájem."
 child_personality.4014.a: "Opravdu to nechápu..."
 child_personality.4015.desc: "Kolem mě projde [ROOT.Char.Custom('OppositeGenderedLowlyServantType')]. Po práci se na těle leskne pot a na [Select_CString(dummy_opposite_gender.IsFemale,'jejích','jeho')] tvářích se objeví ruměnec. Nemůžu odtrhnout oči. Co je to za pocit? Co je to za touhu?"
 child_personality.4015.a: "[dummy_opposite_gender.Custom('GirlBoyPlural')|U]... Nemůžu na ně přestat myslet!"
 child_personality.4015.b: "Vím, že [crush.GetFirstName] pochází jen z prostého lidu... ale ach, mé srdce!"
 child_personality.9900.t: "Podoba k nerozeznání"
