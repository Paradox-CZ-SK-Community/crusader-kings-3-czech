 child_personality.9900.sinful.postscript.desc: "Čím víc o tom lidé mluví, tím hůř se mnou zacházejí. Dokonce mě obviňují z věcí, které jsem [Select_CString(ROOT.Char.IsFemale,'neudělala','neudělal')]!"
