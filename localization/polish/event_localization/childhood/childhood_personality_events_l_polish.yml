 child_personality.4011.t: "Vznikající náklonnost"
 child_personality.4011.desc_opening: "Zalezlý v posteli pod kůží mé [ROOT.Char.Custom('GetAnimalType')] usínám v teplém polospánku.\n\n"
 child_personality.4011.desc_1: "Před sebou vidím nádhernou [ROOT.Char.Custom('GetAnimalType')], která mě pobízí, abych ji následoval do [ROOT.Char.Custom('TerrainType')]. Když dojdeme na mýtinu, začne mi bušit srdce, tělo mi brní a duše #EMP touží#!. Když se otočím, [ROOT.Char.Custom('GetAnimalType')] je pryč a na jejím místě je krásná..."
 child_personality.4011.desc_2: "Přede mnou stojí osoba, zahalená v mlze, která kývá k pozvání. Když se k ní přidám a dotknu se jí, mlha začne mizet a místo ní nám po kůži přejde teplý ruměnec. Nakloním se, abych ji políbil. Když se odtáhnu, vítá mě teplý úsměv krásné..."
 child_personality.4011.desc_3: "Vyskakuji uprostřed noci ze spaní — hrudník mi buší a kůže mi brní. Nikdy jsem se takhle necítil; jsem nemocný? O čem jsem snil? Jediné, co si pamatuji, je krásná..."
 child_personality.4011.a: "... chlapec."
 child_personality.4011.b: "... dívka."
 child_personality.4011.c: "... dívka. Nebo to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] chlapec? Nemohu si vzpomenout jasně."
 child_personality.4011.d: "... osoba. Upřímně, jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] jen sen."
 child_personality.4012.desc: "Říkali mi, že je přirozené cítit přitažlivost k určitým lidem — že časem budu chtít poznat někoho blíže.\n\nSnažil jsem se tomu přijít na kloub, ale jediný pokrok, kterého jsem dosáhl, je uvědomění si, že je to zábavné zkoumat, jen když jsou kolem další [ROOT.Char.Custom('GirlBoyPlural')] ."
 child_personality.4012.a: "[ROOT.Char.Custom('GirlBoyPlural')|U] jsou opravdu nejlepší!"
 child_personality.4013.desc: "Při hrách s ostatními dětmi jsem zjistil, že mi nevadí, zda jsem spárován s dívkou nebo chlapcem při našich intimnějších hrách. Mnohé ostatní děti mají zjevné preference a některé dělají z toho velkou vědu, ale já tomu nerozumím."
 child_personality.4013.a: "Dívky i chlapci jsou tak zajímaví!"
 child_personality.4014.desc: "Všichni kolem mě se zdají natěšení se párovat — usmívají se a hrají hry políbení a doteku s ostatními dětmi. Když neprojevím zájem, zdají se zmatení a [dummy_opposite_gender.Custom('GirlBoyPlural')] mi říkají, že bych je [Select_CString(ROOT.Char.IsFemale,'měla','měl')] mít raději."
 child_personality.4014.a: "To opravdu nechápu..."
 child_personality.4015.desc: "Když se dívám na mladého [ROOT.Char.Custom('OppositeGenderedLowlyServantType')], který prochází, zpocený z práce, ale s ruměncem na [Select_CString(dummy_opposite_gender.IsFemale,'její','jeho')] tváři, jsem uchvácen. Co je to za pocit? Ta touha?"
 child_personality.4015.a: "[dummy_opposite_gender.Custom('GirlBoyPlural')|U] jsou tak fascinující!"
 child_personality.4015.b: "Vím, že [crush.GetSheHe] je jen prostý člověk... ale ach, mé srdce!"
 child_personality.9900.t: "Dokonalá podobizna"
 child_personality.9900.start.desc: "Lidé mi pořád říkají, že jsem jako přes kopírák mého [ROOT.Char.Custom2('RelationToMe', ancestor)], [ancestor.GetTitledFirstName]. Nikdy jsem [ancestor.GetHerHim] nepotkal, ale když to říkají, usmívají se, takže to musí být něco dobrého.\n\n"
 child_personality.9900.start.sinful.desc: "Lidé mi pořád říkají, že jsem jako přes kopírák mého [ROOT.Char.Custom2('RelationToMe', ancestor)], [ancestor.GetTitledFirstName]. Nikdy jsem [ancestor.GetHerHim] nepotkal, ale [ancestor.GetSheHe] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] zřejmě zlý [ancestor.GetWomanMan].\n\n"
