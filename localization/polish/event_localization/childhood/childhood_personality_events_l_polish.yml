 child_personality.9901.t: "Znovuzrozený"
 child_personality.9901.start.desc: "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je jako přesná kopie [child.GetHerHis] [child.Custom2('RelationToMe', ancestor)], [ancestor.GetTitledFirstName]! Ale podobnost není jen povrchní — sahá mnohem hlouběji.\n\n[child.GetFirstNameNoTooltip] je"
 child_personality.9901.dull.desc: "trochu pomalejší, dá se říct,"
 child_personality.9901.end.desc: "Stejně jako [child.GetHerHis] [child.Custom2('RelationToMe', ancestor)] před [child.GetHerHim]. Možná je to opravdu [ancestor.GetTitledFirstNameNoTooltip], kdo se [Select_CString(ancestor.IsFemale,'vrátila','vrátil')], aby opět kráčel po této zemi?"
 child_personality.9901.a: "Vesmír je plný posvátných tajemství."
