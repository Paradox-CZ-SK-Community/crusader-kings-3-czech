l_polish:
 coming_of_age.0001.t: "Vstup do dospělosti"
 coming_of_age.0001.educator_university: "S pomocí [educator.GetTitledFirstName] a univerzity"
 coming_of_age.0001.educator_confucian_education: "S pomocí konfuciánského učení [educator.GetTitledFirstName]" # todo: NEW TRANSLATION
 coming_of_age.0001.educator: "S pomocí [educator.GetTitledFirstName]"
 coming_of_age.0001.desc1: "[Select_CString(ROOT.Char.IsFemale,'Ukončila','Ukončil')] jsem své vzdělání v oboru [ROOT.Char.Custom('education_focus_child')]."
 coming_of_age.0001.desc1_good_trait: "Navzdory vysokým očekáváním jsem toho mnoho [Select_CString(ROOT.Char.IsFemale,'nedokázala','nedokázal')] a mé výsledky zanechaly hodně přání."
 coming_of_age.0001.desc1_bad_trait: "I když mé výsledky zanechávaly hodně přání, nikoho to nepřekvapilo. Alespoň ta dřina je konečně za mnou!"
 coming_of_age.0001.desc1_fallback_trait: "I když jsem moc [Select_CString(ROOT.Char.IsFemale,'nedokázala','nedokázal')], je úlevou konečně vidět nějaké výsledky."
 coming_of_age.0001.desc2: "Konečně jsem [Select_CString(ROOT.Char.IsFemale,'ukončila','ukončil')] studium v oboru [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc2_good_trait: "Jsem [Select_CString(ROOT.Char.IsFemale,'zklamána','zklamán')] svými výsledky; opravdu si myslím, že jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] dosáhnout lepších."
 coming_of_age.0001.desc2_bad_trait: "Dařilo se mi docela dobře, zvlášť vzhledem k tomu, že mi tento předmět nikdy nepřišel přirozeně."
 coming_of_age.0001.desc2_fallback_trait: "Mé úspěchy nebyly skvělé, ale mohlo to dopadnout i hůř."
 coming_of_age.0001.desc3: "[Select_CString(ROOT.Char.IsFemale,'Ukončila','Ukončil')] jsem studium [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc3_good_trait: "I když mi vrcholné aspekty oboru unikají, [Select_CString(ROOT.Char.IsFemale,'splnila','splnil')] jsem očekávání a [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] jsem se víc než většina!"
 coming_of_age.0001.desc3_bad_trait: "I když mi vrcholné aspekty oboru unikají, [Select_CString(ROOT.Char.IsFemale,'vzdorovala','vzdoroval')] jsem nízkým očekáváním a [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] jsem se víc než většina!"
 coming_of_age.0001.desc3_fallback_trait: "I když mi vrcholné aspekty oboru unikají, [Select_CString(ROOT.Char.IsFemale,'vedla','vedl')] jsem si docela dobře."
 coming_of_age.0001.desc4: "[Select_CString(ROOT.Char.IsFemale,'Dosáhla','Dosáhl')] jsem porozumění [ROOT.Char.Custom('education_focus_child')], které daleko převyšuje porozumění mých vrstevníků."
 coming_of_age.0001.desc4_good_trait: "I když jsem k oboru [Select_CString(ROOT.Char.IsFemale,'měla','měl')] přirozené sklony, jeho zvládnutí je přesto úspěch!"
 coming_of_age.0001.desc4_bad_trait: "[Select_CString(ROOT.Char.IsFemale,'Vzdorovala','Vzdoroval')] jsem očekáváním a [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] toho, co bylo považováno za nemožné: mistrovství v [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc4_fallback_trait: "Dostat se tak daleko v tomto oboru bylo opravdu uspokojující."
 coming_of_age.0001.patronaged_spouse_plus_1.desc: "[patronage_spouse_tutor.GetTitledFirstName] [Select_CString(patronage_spouse_tutor.IsFemale,'dohlížela','dohlížel')] na mé vzdělání a významně [Select_CString(patronage_spouse_tutor.IsFemale,'přispěla','přispěl')] k mým znalostem [ROOT.Char.Custom('education_focus_child')]."
 coming_of_age.0001.patronaged_spouse_plus_2_or_more.desc: "[patronage_spouse_tutor.GetTitledFirstName] [Select_CString(patronage_spouse_tutor.IsFemale,'dohlížela','dohlížel')] na mé vzdělání a [Select_CString(patronage_spouse_tutor.IsFemale,'pomohla','pomohl')] mi dosáhnout úrovně znalostí, o které jsem si ani [Select_CString(patronage_spouse_tutor.IsFemale,'nesnila','nesnil')]."
 coming_of_age.0001.relationships: "\n\nKdyž vykročím do dospělosti, vzpomínám na lidi, kteří ovlivnili [ROOT.Char.GetWomanMan], kterým jsem se [Select_CString(ROOT.Char.IsFemale,'stala','stal')]..."
 coming_of_age.0001.friend: "\nPřátelství, které jsem [Select_CString(ROOT.Char.IsFemale,'sdílela','sdílel')] s [friend.GetFirstName], mi v mládí hodně znamenalo, a mít [friend.GetHerHim] stále po svém boku také mnoho znamená."
 coming_of_age.0001.crush: "\nS [crush.GetFirstName] jsem [Select_CString(crush.IsFemale,'zažila','zažil')] několik nezapomenutelných chvil, mi opravdu [Select_CString(crush.IsFemale,'pomohla','pomohl')] lépe pochopit sebe i lásku."
 coming_of_age.0001.bully1: "\nTo, čím mě [bully.GetTitledFirstName] jako dítě [Select_CString(bully.IsFemale,'potrápila','potrápil')], na mně stále leží, a kdykoli [bully.GetHerHim] uvidím, nálada se mi pokaždé zkazí."
 coming_of_age.0001.bully2: "\nTo, co mi [bully.GetTitledFirstName] jako dítě [Select_CString(bully.IsFemale,'provedla','provedl')], mi stále doléhá. Někdy pořád slyším [bully.GetHerHis] smích, když [Select_CString(bully.IsFemale,'rozšlapala','rozšlapal')] mou [ROOT.Char.Custom('child_favorite_toy')] na kusy."
 coming_of_age.0001.victim1: "\nZajímalo by mě, jestli si [victim.GetTitledFirstName] pamatuje, čím jsem [victim.GetHerHim] [Select_CString(victim.IsFemale,'provázela','provázel')], když jsme byli mladí."
 coming_of_age.0001.victim2: "\nStále si vybavuji [victim.GetTitledFirstNamePossessive] zděšený výraz, když jsem tehdy [Select_CString(victim.IsFemale,'zničila','zničil')] [victim.GetHerHis] [victim.Custom('child_favorite_toy')]."
 coming_of_age.0001.relationships_end: "\n\nTeď, když jsem [Select_CString(ROOT.Char.IsFemale,'dospěla','dospěl')], však musím tyto dětinské rozmary opustit a zaměřit se na to, co teprve přijde."
 coming_of_age.0001.no_relationships: "\n\nKdyž se ohlédnu za svým dětstvím, uvědomuji si, že jsem se s nikým opravdu [Select_CString(ROOT.Char.IsFemale,'nesblížila','nesblížil')]... I když jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] ostatní, jak si hrají s přáteli nebo si šeptají o lásce, [Select_CString(ROOT.Char.IsFemale,'sáma','sám')] jsem nic takového [Select_CString(ROOT.Char.IsFemale,'nezažila','nezažil')].\n\nJsem si jistý(á), že nadcházející roky přinesou nové přátele a nové příležitosti!"
 coming_of_age.0001.a: "[ROOT.Char.GetTitledFirstNameNoTooltip], teď jsi [ROOT.Char.GetWomanMan]!"
 coming_of_age.0001.tt.1: "V oboru [THIS.Char.Custom('education_focus_child')] máš ještě hodně co se naučit!\n"
 coming_of_age.0001.tt.2: "V oboru [THIS.Char.Custom('education_focus_child')] máš ještě několik věcí, které se musíš naučit\n"
 coming_of_age.0001.tt.3: "V oboru [THIS.Char.Custom('education_focus_child')] jsi [Select_CString(ROOT.Char.IsFemale,'obstála','obstál')] docela dobře!\n"
 coming_of_age.0001.tt.4: "V oboru [THIS.Char.Custom('education_focus_child')] jsi [Select_CString(ROOT.Char.IsFemale,'vynikla','vynikl')]!\n"
 coming_of_age.0001.tt.5: "Nezapomeneš na svou náklonnost k [crush.GetFirstNameNoTooltip]: #P +20 opinion#!"
 coming_of_age.0001.tt.7: "Jen tak na [victim.GetTitledFirstNameNoTooltip] nezapomeneš: #N -5 opinion#!"
 coming_of_age.0001.tt.9: "Na [bully.GetTitledFirstNameNoTooltip] jen tak rychle nezapomeneš: #N -10 opinion#!"
 coming_of_age.1001.t: "[educated_child.GetFirstNameNoTooltip] vstupuje do dospělosti"
 coming_of_age.1001.desc_university: "S příchodem dospělosti [educated_child.GetHerHis] končí období, které [educated_child.GetFirstName] [Select_CString(educated_child.IsFemale,'strávila','strávil')] na univerzitě.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.0001.desc_confucian_education: "S [educated_child.GetHerHis] příchodem do dospělosti je [educated_child.GetFirstName] [Select_CString(educated_child.IsFemale,'připravena','připraven')] šířit konfuciánské učení.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]" # todo: NEW TRANSLATION
 coming_of_age.1001.desc: "S nástupem dospělosti [educated_child.GetHerHis] končí mé vyučování [educated_child.GetFirstName].\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1001.patronaged_spouse_plus_1.desc: "\n\nPříspěvky [patronage_spouse_tutor.GetTitledFirstNamePossessive] k vzdělání [educated_child.GetFirstNamePossessive] nelze opomenout. [patronage_spouse_tutor.GetHerHis|U] vedení pomohlo dítěti dojít dál, než bych [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] [Select_CString(ROOT.Char.IsFemale,'sáma','sám')]."
 coming_of_age.1001.patronaged_spouse_plus_2_or_more.desc: "\n\n[patronage_spouse_tutor.GetTitledFirstName] také [Select_CString(patronage_spouse_tutor.IsFemale,'poskytla','poskytl')] dítěti neocenitelné vedení. [educated_child.GetFirstName] by se bez [patronage_spouse_tutor.GetHerHim] nikdy nedostalo tak daleko."
 coming_of_age.1001.a: "Rychle vyrostou."
 coming_of_age.1002.t: "[educated_child.GetFirstNameNoTooltip] vstupuje do dospělosti"
 coming_of_age.1002.desc: "Jsem hrdý(á), že můj [educated_child.Custom('GetDaughterSon')] už není dítě, ale dospělá osoba.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1002.patronaged_spouse_plus_1.desc: "\n\nPříspěvky [patronage_spouse_tutor.GetTitledFirstNamePossessive] k vzdělání [educated_child.GetFirstNamePossessive] nelze opomenout. [patronage_spouse_tutor.GetHerHis|U] lekce daly [educated_child.GetFirstName] cenné znalosti pro [educated_child.GetHerHis] budoucí život."
 coming_of_age.1002.patronaged_spouse_plus_2_or_more.desc: "\n\n[patronage_spouse_tutor.GetTitledFirstName] dal dítěti neocenitelné vedení. [educated_child.GetFirstName] by se bez [patronage_spouse_tutor.GetHerHim] nikdy nedostalo tak daleko."
 coming_of_age.1003.t: "Konec vzdělávání"
 coming_of_age.1003.standard: "Můj svěřenec [educated_child.GetTitledFirstName] [Select_CString(educated_child.IsFemale,'dosáhla','dosáhl')] věku, kdy musí opustit mou péči.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1003.rank_1: "\n\nJsem si jistý(á), že rodiče budou prostě rádi, že jeho či její vzdělání je dokončeno."
 coming_of_age.1003.rank_2: "\n\nI když nejsou výsledky vynikající, jsem si jistý(á), že rodiče [educated_child.GetHerHis] nebudou mít námitek."
 coming_of_age.1003.rank_3: "\n\nJsem si jistý(á), že rodiče [educated_child.GetHerHis] budou s mým vyučováním spokojeni."
 coming_of_age.1003.rank_4: "\n\n[educated_child.GetHerHis|U] rodiče budou jistě hrdí, že mohou nazývat [educated_child.GetHerHim] svým [educated_child.Custom('GetDaughterSon')]!"
 coming_of_age.1003.a: "Až se opět setkáme, [educated_child.GetFirstNameNoTooltip]."
 coming_of_age.0003.desc_child_start: " Můj $knight_culture_player_adjective_no_tooltip_lowercase$ výcvik spolu s tím "
 coming_of_age.0003.desc_child_1: "dopadl špatně, a od svých bojových instruktorů jsem se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] málo."
 coming_of_age.0003.desc_child_2: "probíhal uspokojivě, a s jistým úspěchem jsem [Select_CString(ROOT.Char.IsFemale,'bojovala','bojoval')] proti několika domýšlivým sedlákům."
 coming_of_age.0003.desc_child_3: "byl úspěšný, a navzdory svému věku jsem [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')] řadu banditů."
 coming_of_age.0003.desc_child_4: "byl vynikající, díky čemuž jsem se [Select_CString(ROOT.Char.IsFemale,'stala','stal')] jedním z předních $knight_culture_player_plural_no_tooltip_lowercase$."
 coming_of_age.1004.t: "Konec vzdělávání"
 coming_of_age.1004.desc: "Můj svěřenec [educated_child.GetTitledFirstName] [Select_CString(educated_child.IsFemale,'dosáhla','dosáhl')] věku, kdy musí opustit mou péči.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1004.a: "Až se opět setkáme, [educated_child.GetFirstNameNoTooltip]."
 coming_of_age.1005.t: "Konec vzdělávání"
 coming_of_age.1005.desc: "Můj svěřenec [educated_child.GetTitledFirstName] [Select_CString(educated_child.IsFemale,'dosáhla','dosáhl')] věku, kdy musí opustit mou péči.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')] [educated_child.Custom('DescribingEducationOutcomeProwess')]"
 coming_of_age.1005.a: "Až se znovu setkáme, [educated_child.GetFirstNameNoTooltip]."
 coming_of_age.3011.t: "Mnohem víc než jméno"
 coming_of_age.3011.desc: "Od té doby, co mě [junior_emp.MakeScope.Var('co_emp_appointer').Char.Custom2('MyCharacterIntroduction', junior_emp)] jmenoval [senior_emp.GetDiarchTitle], bylo mi jasné, že ten den jednou přijde.\n\nTeď jsem [junior_emp.GetWomanMan] a to znamená, že moc, kterou držím, už není pouhá formalita. Když promluvím, [senior_emp.GetPrimaryTitle.GetDefinitiveName] naslouchá, a když rozkazuji, poslechne.\n\nJe to můj první skutečný krok na cestě k trůnu."
 coming_of_age.3011.a: "To je můj osud!"
 coming_of_age.3011.b: "Celý #EMP život#!, na který se lze těšit..."
 coming_of_age.3011.c: "Doufám, že na to budu [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')]."
 coming_of_age.3011.tt.fake_diarchy_transition: "[senior_emp.GetShortUINamePossessive|U] [power_sharing|E] se přeměnilo na [duumvirate|E]"
 coming_of_age.3011.tt.various_new_powers: "[CharWereWas(junior_emp)|U] získal přístup k mnoha novým [diarch_powers|E]"
 coming_of_age.3011.tt.convert_sop_swing: "Uchoval ['50%'|P] z posunu [scales_of_power|E], který [CharYouSheHe(junior_emp)] získal během dětství"
 coming_of_age.3011.tt.not_enough_sop_swing_to_buffs: "Nebylo dost posunu [scales_of_power|E] na získání jakýchkoli dodatečných [skill|E] bodů"
 coming_of_age.3012.t: "$coming_of_age.3011.t$"
 coming_of_age.3012.desc.intro: "Konečně nadešel ten den: [junior_emp.Custom2('MyCharacterIntroduction', senior_emp)] je skutečně [junior_emp.GetWomanMan], [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')] zaujmout [junior_emp.GetHerHis] místo jako druhá nejsilnější osoba v celé [senior_emp.GetPrimaryTitle.GetDefinitiveName].\n\nSamozřejmě po mně.\n\nAčkoli mladý [senior_emp.GetDiarchTitle] má malý vliv na záležitosti říše, jakmile vyroste do své role, je málo věcí, o kterých by #EMP nemohli#! mluvit.\n\n"
 coming_of_age.3012.desc.senior_emp_appointed_junior_emp: "Mohu jen doufat, že jsem učinil moudré rozhodnutí "
 coming_of_age.3012.desc.junior_emp_appointed_elsewhere: "Mohu jen doufat, že [junior_emp.MakeScope.Var('co_emp_appointer').Char.GetFirstName] vybral dobře"
 coming_of_age.3012.desc.outro: "povýšení [junior_emp.GetHerHim] do tohoto vysokého postavení."
 coming_of_age.3012.a: "Purpura si od nás vyžaduje mnoho..."
