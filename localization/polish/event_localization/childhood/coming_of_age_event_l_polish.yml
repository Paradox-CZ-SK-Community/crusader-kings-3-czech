l_polish:
 coming_of_age.0001.t: "Dospělost"
 coming_of_age.0001.educator_university: "Při studiu mi [Select_CString(educator.IsFemale,'pomáhaly','pomáhali')] [educator.GetTitledFirstName] i univerzita."
 coming_of_age.0001.educator_confucian_education: "Při studiu mi pomohlo konfuciánské učení, které mi [Select_CString(educator.IsFemale,'předávala','předával')] [educator.GetTitledFirstName]."
 coming_of_age.0001.educator: "Při studiu mi [Select_CString(educator.IsFemale,'pomáhala','pomáhal')] [educator.GetTitledFirstName]."
 coming_of_age.0001.desc1: "[Select_CString(ROOT.Char.IsFemale,'Dokončila','Dokončil')] jsem studium oboru [ROOT.Char.Custom('education_focus_child')]."
 coming_of_age.0001.desc1_good_trait: "Navzdory velkým očekáváním všech jsem toho [Select_CString(ROOT.Char.IsFemale,'nedokázala','nedokázal')] mnoho a mé výsledky měly k dokonalosti daleko."
 coming_of_age.0001.desc1_bad_trait: "I když jsem [Select_CString(ROOT.Char.IsFemale,'nedosáhla','nedosáhl')] nijak oslnivých výsledků, nikoho to nepřekvapilo. Alespoň je ta dřina konečně za mnou!"
 coming_of_age.0001.desc1_fallback_trait: "I když jsem toho moc [Select_CString(ROOT.Char.IsFemale,'nedokázala','nedokázal')], je úleva konečně vidět alespoň nějaké výsledky."
 coming_of_age.0001.desc2: "Konečně jsem [Select_CString(ROOT.Char.IsFemale,'završila','završil')] studium oboru [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc2_good_trait: "Své výsledky vnímám jako zklamání, protože vím, že jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] dopadnout lépe."
 coming_of_age.0001.desc2_bad_trait: "[Select_CString(ROOT.Char.IsFemale,'Vedla','Vedl')] jsem si docela dobře, alespoň vzhledem k tomu, že mi tento obor zrovna neseděl."
 coming_of_age.0001.desc2_fallback_trait: "Mé výsledky nebyly nijak skvělé, ale mohlo to dopadnout i hůř."
 coming_of_age.0001.desc3: "[Select_CString(ROOT.Char.IsFemale,'Dokončila','Dokončil')] jsem studium oboru [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc3_good_trait: "I když mi ty nejnáročnější stránky oboru stále unikají, [Select_CString(ROOT.Char.IsFemale,'splnila','splnil')] jsem očekávání všech a [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] se víc než většina ostatních!"
 coming_of_age.0001.desc3_bad_trait: "I když mi ty nejnáročnější stránky oboru stále unikají, [Select_CString(ROOT.Char.IsFemale,'překonala','překonal')] jsem nízká očekávání všech a [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] se víc než většina ostatních!"
 coming_of_age.0001.desc3_fallback_trait: "I když mi ty nejnáročnější stránky oboru stále unikají, [Select_CString(ROOT.Char.IsFemale,'vedla','vedl')] jsem si opravdu dobře."
 coming_of_age.0001.desc4: "V oboru [ROOT.Char.Custom('education_focus_child')] jsem [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] porozumění, které dalece přesahuje porozumění kteréhokoli z mých vrstevníků."
 coming_of_age.0001.desc4_good_trait: "Přestože jsem pro tento obor [Select_CString(ROOT.Char.IsFemale,'měla','měl')] přirozené vlohy, jeho zvládnutí je stále skutečný úspěch!"
 coming_of_age.0001.desc4_bad_trait: "Navzdory očekáváním všech jsem [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] to, co se pro mě považovalo za nemožné, a [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] mistrovství v oboru [ROOT.Char.Custom('education_focus_child')]!"
 coming_of_age.0001.desc4_fallback_trait: "Je skvělý pocit dostat se v tomto oboru tak daleko."
 coming_of_age.0001.patronaged_spouse_plus_1.desc: "[patronage_spouse_tutor.GetTitledFirstName] [Select_CString(patronage_spouse_tutor.IsFemale,'dohlížela','dohlížel')] na mé vzdělání a výrazně [Select_CString(patronage_spouse_tutor.IsFemale,'prohloubila','prohloubil')] mé znalosti v oboru [ROOT.Char.Custom('education_focus_child')]."
 coming_of_age.0001.patronaged_spouse_plus_2_or_more.desc: "[patronage_spouse_tutor.GetTitledFirstName] [Select_CString(patronage_spouse_tutor.IsFemale,'dohlížela','dohlížel')] na mé vzdělání a [Select_CString(patronage_spouse_tutor.IsFemale,'pomohla','pomohl')] mi dosáhnout úrovně znalostí, o jaké se mi ani nesnilo."
 coming_of_age.0001.relationships: "\n\nKdyž dělám první kroky v dospělosti, vybavuji si některé lidi, kteří ovlivnili, [Select_CString(ROOT.Char.IsFemale,'jakou ženou jsem se stala','jakým mužem jsem se stal')]..."
 coming_of_age.0001.friend: "\nPřátelství s [friend.GetFirstName] pro mě v dětství hodně znamenalo a [Select_CString(ROOT.Char.IsFemale,'jsem ráda','jsem rád')], že stále zůstává po mém boku."
 coming_of_age.0001.crush: "\nS [crush.GetFirstName] jsem [Select_CString(ROOT.Char.IsFemale,'prožila','prožil')] několik nezapomenutelných chvil. Opravdu mi [Select_CString(crush.IsFemale,'pomohla','pomohl')] lépe pochopit sebe i lásku."
 coming_of_age.0001.bully1: "\nTo, čím mě [bully.GetTitledFirstName] v dětství [Select_CString(bully.IsFemale,'trápila','trápil')], mě stále tíží a pokaždé, když se znovu setkáme, se mi zkazí nálada."
 coming_of_age.0001.bully2: "\nTo, čím mě [bully.GetTitledFirstName] v dětství [Select_CString(bully.IsFemale,'trápila','trápil')], mě stále tíží. Někdy ještě slyším ten smích, když [Select_CString(bully.IsFemale,'rozdupávala','rozdupával')] [ROOT.Char.Custom('child_favorite_toy')] na kusy."
 coming_of_age.0001.victim1: "\nPřemýšlím, jestli [victim.GetTitledFirstName] vzpomíná na to, jak jsem [Select_CString(victim.IsFemale,'jí','mu')] v dětství [Select_CString(ROOT.Char.IsFemale,'ubližovala','ubližoval')]."
 coming_of_age.0001.victim2: "\nDodnes si vybavuji zděšený výraz ve tváři [victim.GetTitledFirstNamePossessive] z chvíle, kdy jsem [Select_CString(ROOT.Char.IsFemale,'zničila','zničil')] [victim.Custom('child_favorite_toy')]."
 coming_of_age.0001.relationships_end: "\n\nTeď už jsem [Select_CString(ROOT.Char.IsFemale,'dospělá','dospělý')], a tak musím tyhle dětské pošetilosti nechat za sebou a soustředit se na to, co přijde."
 coming_of_age.0001.no_relationships: "\n\nKdyž vzpomínám na dětství, dochází mi, že jsem si nikdy k nikomu [Select_CString(ROOT.Char.IsFemale,'nevytvořila','nevytvořil')] skutečné pouto... I když jsem [Select_CString(ROOT.Char.IsFemale,'vídala','vídal')] ostatní, jak si hrají s přáteli nebo si šeptají o lásce, nic takového jsem [Select_CString(ROOT.Char.IsFemale,'sama nezažila','sám nezažil')].\n\nJsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že příští roky přinesou nové přátele a nové příležitosti!"
 coming_of_age.0001.a: "[ROOT.Char.GetTitledFirstNameNoTooltip], teď už jsi [Select_CString(ROOT.Char.IsFemale,'žena','muž')]!"
 coming_of_age.0001.tt.1: "V oboru [THIS.Char.Custom('education_focus_child')] se toho máš ještě hodně co učit!\n"
 coming_of_age.0001.tt.2: "V oboru [THIS.Char.Custom('education_focus_child')] se máš ještě co učit\n"
 coming_of_age.0001.tt.3: "V oboru [THIS.Char.Custom('education_focus_child')] sis [Select_CString(THIS.Char.IsFemale,'vedla','vedl')] docela dobře!\n"
 coming_of_age.0001.tt.4: "V oboru [THIS.Char.Custom('education_focus_child')] sis [Select_CString(THIS.Char.IsFemale,'vedla','vedl')] skvěle!\n"
 coming_of_age.0001.tt.5: "Na svou náklonnost k [crush.GetFirstNameNoTooltip] nezapomeneš: #P +20 mínění#!"
 coming_of_age.0001.tt.7: "[victim.GetTitledFirstNameNoTooltip] ti jen tak z paměti nezmizí: #N -5 mínění#!"
 coming_of_age.0001.tt.9: "[bully.GetTitledFirstNameNoTooltip] ti jen tak z paměti nezmizí: #N -10 mínění#!"
 coming_of_age.1001.t: "[educated_child.GetFirstNameNoTooltip] [Select_CString(educated_child.IsFemale,'dospěla','dospěl')]"
 coming_of_age.1001.desc_university: "[educated_child.GetFirstName] [Select_CString(educated_child.IsFemale,'dospěla','dospěl')], a tím končí i čas strávený na univerzitě.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.0001.desc_confucian_education: "[educated_child.GetFirstName] [Select_CString(educated_child.IsFemale,'dospěla','dospěl')] a je [Select_CString(educated_child.IsFemale,'připravena','připraven')] šířit konfuciánské učení.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1001.desc: "[educated_child.GetFirstName] [Select_CString(educated_child.IsFemale,'dospěla','dospěl')], a mé vyučování je tím u konce.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1001.patronaged_spouse_plus_1.desc: "\n\nPřínos [patronage_spouse_tutor.GetTitledFirstNamePossessive] ke vzdělání [educated_child.GetFirstNamePossessive] nelze opomenout. [Select_CString(patronage_spouse_tutor.IsFemale,'Vedla','Vedl')] dítě tak dobře, že se dostalo dál, než bych [Select_CString(ROOT.Char.IsFemale,'dokázala sama','dokázal sám')]."
 coming_of_age.1001.patronaged_spouse_plus_2_or_more.desc: "\n\n[patronage_spouse_tutor.GetTitledFirstName] také [Select_CString(patronage_spouse_tutor.IsFemale,'poskytla','poskytl')] dítěti neocenitelné vedení. [educated_child.GetFirstName] by se nikdy [Select_CString(educated_child.IsFemale,'nedostala','nedostal')] tak daleko bez této pomoci."
 coming_of_age.1001.a: "Jak rychle dospívají."
 coming_of_age.1002.t: "[educated_child.GetFirstNameNoTooltip] [Select_CString(educated_child.IsFemale,'dospěla','dospěl')]"
 coming_of_age.1002.desc: "Jsem [Select_CString(ROOT.Char.IsFemale,'hrdá','hrdý')], když vidím, že [educated_child.GetFirstName] už není dítětem, ale [Select_CString(educated_child.IsFemale,'dospělou ženou','dospělým mužem')].\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1002.patronaged_spouse_plus_1.desc: "\n\nNelze opomenout, jak výrazně [patronage_spouse_tutor.GetTitledFirstName] [Select_CString(patronage_spouse_tutor.IsFemale,'přispěla','přispěl')] k výsledku vzdělávání. Z těchto lekcí si [educated_child.GetFirstName] [Select_CString(educated_child.IsFemale,'odnesla','odnesl')] cenné znalosti pro budoucí život."
 coming_of_age.1002.patronaged_spouse_plus_2_or_more.desc: "\n\n[patronage_spouse_tutor.GetTitledFirstName] [Select_CString(patronage_spouse_tutor.IsFemale,'poskytla','poskytl')] dítěti neocenitelné vedení. Bez této pomoci by se [educated_child.GetFirstName] nikdy [Select_CString(educated_child.IsFemale,'nedostala','nedostal')] tak daleko."
 coming_of_age.1003.t: "Konec vzdělávání"
 coming_of_age.1003.standard: "[Select_CString(educated_child.IsFemale,'Má svěřenkyně','Můj svěřenec')] [educated_child.GetTitledFirstName] [Select_CString(educated_child.IsFemale,'dospěla','dospěl')] a nastal čas, aby se [Select_CString(educated_child.IsFemale,'vydala','vydal')] vlastní cestou.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1003.rank_1: "\n\n[Select_CString(ROOT.Char.IsFemale,'Jsem si jistá','Jsem si jistý')], že rodiče budou rádi už jen za to, že vzdělávání je konečně u konce."
 coming_of_age.1003.rank_2: "\n\nVýsledky sice nejsou vynikající, ale [Select_CString(ROOT.Char.IsFemale,'jsem si jistá','jsem si jistý')], že rodiče nebudou mít důvod si stěžovat."
 coming_of_age.1003.rank_3: "\n\n[Select_CString(ROOT.Char.IsFemale,'Jsem si jistá','Jsem si jistý')], že rodiče budou s mým vedením spokojeni."
 coming_of_age.1003.rank_4: "\n\nRodiče budou jistě hrdí na to, jak [educated_child.GetFirstName] [Select_CString(educated_child.IsFemale,'vyrostla','vyrostl')]!"
 coming_of_age.1003.a: "Do dalšího setkání, [educated_child.GetFirstNameNoTooltip]."
 coming_of_age.0003.desc_child_start: " Můj $knight_culture_player_adjective_no_tooltip_lowercase$ výcvik zároveň "
 coming_of_age.0003.desc_child_1: "dopadl špatně a od svých bojových instruktorů jsem se [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] jen málo."
 coming_of_age.0003.desc_child_2: "probíhal obstojně a s jistým úspěchem jsem [Select_CString(ROOT.Char.IsFemale,'bojovala','bojoval')] proti několika zpupným sedlákům."
 coming_of_age.0003.desc_child_3: "byl úspěšný a navzdory svému mládí jsem [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')] řadu banditů."
 coming_of_age.0003.desc_child_4: "byl vynikající a přední $knight_culture_player_plural_no_tooltip_lowercase$ panství mě považují za sobě [Select_CString(ROOT.Char.IsFemale,'rovnou','rovného')]."
 coming_of_age.1004.t: "Konec vzdělávání"
 coming_of_age.1004.desc: "[Select_CString(educated_child.IsFemale,'Má svěřenkyně','Můj svěřenec')] [educated_child.GetTitledFirstName] [Select_CString(educated_child.IsFemale,'dospěla','dospěl')] a nastal čas, aby se [Select_CString(educated_child.IsFemale,'vydala','vydal')] vlastní cestou.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')]"
 coming_of_age.1004.a: "Do dalšího setkání, [educated_child.GetFirstNameNoTooltip]."
 coming_of_age.1005.t: "Konec vzdělávání"
 coming_of_age.1005.desc: "[Select_CString(educated_child.IsFemale,'Má svěřenkyně','Můj svěřenec')] [educated_child.GetTitledFirstName] [Select_CString(educated_child.IsFemale,'dospěla','dospěl')] a nastal čas, aby se [Select_CString(educated_child.IsFemale,'vydala','vydal')] vlastní cestou.\n\n[educated_child.Custom('GoodOrBadChildhoodTraitMatch')] [educated_child.Custom('DescribingEducationOutcome')] [educated_child.Custom('DescribingEducationOutcomeProwess')]"
 coming_of_age.1005.a: "Do dalšího setkání, [educated_child.GetFirstNameNoTooltip]."
 coming_of_age.3011.t: "Nejen podle jména"
 coming_of_age.3011.desc: "Už od chvíle, kdy mi [junior_emp.MakeScope.Var('co_emp_appointer').Char.Custom2('MyCharacterIntroduction', junior_emp)] [Select_CString(junior_emp.MakeScope.Var('co_emp_appointer').Char.IsFemale,'svěřila','svěřil')] roli [senior_emp.GetDiarchTitle], jsem [Select_CString(junior_emp.IsFemale,'věděla','věděl')], že tento den přijde.\n\nTeď už jsem [Select_CString(junior_emp.IsFemale,'žena','muž')] a moc, kterou držím v rukou, už není jen na papíře. Když promluvím, [senior_emp.GetPrimaryTitle.GetDefinitiveName] naslouchá, a když rozkážu, má vůle se stane zákonem.\n\nJe to můj první skutečný krok na cestě k trůnu."
 coming_of_age.3011.a: "Tohle je můj osud!"
 coming_of_age.3011.b: "A tohle mě čeká #EMP celý život#!..."
 coming_of_age.3011.c: "Doufám, že jsem na to [Select_CString(junior_emp.IsFemale,'připravená','připravený')]."
 coming_of_age.3011.tt.fake_diarchy_transition: "[senior_emp.GetShortUINamePossessive|U] [Concept('power_sharing','sdílení moci')|E] přešlo na [Concept('duumvirate','duumvirát')|E]"
 coming_of_age.3011.tt.various_new_powers: "Získáváš přístup k mnoha novým [Concept('diarch_powers','propůjčeným pravomocím')|E]"
 coming_of_age.3011.tt.convert_sop_swing: "Zachováš si ['50%'|P] vychýlení [Concept('scales_of_power','misek vah moci')|E], které jsi během dětství [Select_CString(junior_emp.IsFemale,'získala','získal')]"
 coming_of_age.3011.tt.not_enough_sop_swing_to_buffs: "Nemáš dostatečné vychýlení [Concept('scales_of_power','misek vah moci')|E] k získání dalších bodů [Concept('skill','dovedností')|E]"
 coming_of_age.3012.t: "$coming_of_age.3011.t$"
 coming_of_age.3012.desc.intro: "Ten den konečně nadešel. [junior_emp.Custom2('MyCharacterIntroduction', senior_emp)] je teď skutečně [Select_CString(junior_emp.IsFemale,'dospělá a připravená','dospělý a připravený')] zaujmout místo druhé nejmocnější osoby, jakou [senior_emp.GetPrimaryTitle.GetDefinitiveName] zná.\n\nHned po mně, samozřejmě.\n\n[junior_emp.GetFirstName] má jako [senior_emp.GetDiarchTitle] zpočátku jen malý vliv na chod panství, ale jakmile se ve své roli zabydlí, není téměř nic, k čemu by [Select_CString(junior_emp.IsFemale,'nemohla','nemohl')] #EMP promluvit#!.\n\n"
 coming_of_age.3012.desc.senior_emp_appointed_junior_emp: "Nezbývá mi než doufat, že jsem [Select_CString(senior_emp.IsFemale,'se rozhodla','se rozhodl')] moudře "
 coming_of_age.3012.desc.junior_emp_appointed_elsewhere: "Nezbývá mi než doufat, že [junior_emp.MakeScope.Var('co_emp_appointer').Char.GetFirstName] [Select_CString(junior_emp.MakeScope.Var('co_emp_appointer').Char.IsFemale,'se rozhodla','se rozhodl')] moudře "
 coming_of_age.3012.desc.outro: "a díky tomu se [junior_emp.GetFirstName] [Select_CString(junior_emp.IsFemale,'dostala','dostal')] do tak vysokého postavení."
 coming_of_age.3012.a: "Purpur od nás žádá mnoho..."
