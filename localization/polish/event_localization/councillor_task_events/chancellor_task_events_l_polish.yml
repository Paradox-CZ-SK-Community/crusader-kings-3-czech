l_polish:
 chancellor_task.0991_end_desc: "[target_character.GetTitledFirstNamePossessiveNoTooltip] mínění o tobě už nebude dále růst."
 chancellor_task.0991_increase_desc: "[target_character.GetTitledFirstNameNoTooltip] [Select_CString(target_character.IsFemale, 'byla poctěna a ohromena', 'byl poctěn a ohromen')] přízní, kterou jsi [Select_CString(target_character.IsFemale, 'jí', 'mu')] [Select_CString(ROOT.Char.IsFemale, 'prokázala', 'prokázal')]."
 chancellor_task.1001.t: "Nový pretendent"
 chancellor_task.1001.desc: "Ze všech pitomostí, které jsem kdy [Select_CString(ROOT.Char.IsFemale, 'viděla', 'viděl')]...\n\nVe své pošetilé snaze zlepšit mé vztahy se sousedy [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má neschopná', 'můj neschopný')] [councillor.GetCouncilTitle|l], oficiálně [Select_CString(councillor.IsFemale, 'uznala', 'uznal')] nárok, který [neighboring_ruler.GetTitledFirstName] vznáší na [target_county.GetName]!"
 chancellor_task.1001.a: "Máš mi získávat přátele, ne nepřátele!"
 chancellor_task.1001.title_message: "Přehmat vedl ke vzniku nároku"
 chancellor_task.1001.message: "[councillor.GetTitledFirstName] oficiálně [Select_CString(councillor.IsFemale, 'uznala', 'uznal')] tvůj nárok na [target_county.GetName]"
 chancellor_task.1002.t: "Konec míru"
 chancellor_task.1002.desc: "Ve snaze zlepšit mou pověst [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má neschopná', 'můj neschopný')] [councillor.GetCouncilTitle|l], [Select_CString(councillor.IsFemale, 'souhlasila', 'souhlasil')] se smlouvou, která #EMP ruší#! část mé staré dohody s [target.GetName]!\n\n[target.GetTitledFirstName] ji chápe tak, že mi nyní může vyhlásit válku, kdykoli se [Select_CString(target.IsFemale, 'jí', 'mu')] zachce."
 chancellor_task.1002.a: "Proč jsi na něco takového vůbec [Select_CString(councillor.IsFemale, 'přistoupila', 'přistoupil')], [councillor.GetFirstNameNoTooltip]?!"
 chancellor_task.1003.opening: "[neighbor.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 chancellor_task.1003.desc: "Vedeme spolu korespondenci, [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'tvá', 'tvůj')] [councillor.GetCouncilTitle|l] a já, a je to ostudná ukázka diplomacie. Nejsi [Select_CString(ROOT.Char.IsFemale, 'ženou', 'mužem')], za [Select_CString(ROOT.Char.IsFemale, 'jakou', 'jakého')] jsem tě [Select_CString(neighbor.IsFemale, 'považovala', 'považoval')]!"
 chancellor_task.1003.a: "Tohle musí být nějaké strašlivé nedorozumění..."
 chancellor_task.1003.message: "[councillor.GetCouncilTitle|U] rozhněval[Select_CString(councillor.IsFemale, 'a', '')] [neighbor.GetTitledFirstName]"
 chancellor_task.1102.t: "Obratná diplomacie"
 chancellor_task.1102.desc: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], tvrdě [Select_CString(councillor.IsFemale, 'pracovala', 'pracoval')] na tom, aby přesvědčil[Select_CString(councillor.IsFemale, 'a', '')] sousední panství i naše vazaly, že mírová smlouva, kterou jsem [Select_CString(ROOT.Char.IsFemale, 'uzavřela', 'uzavřel')] s [target.GetName], je vadná, nelegitimní a vůči mně nespravedlivá!\n\nNyní mohu [target.GetTitledFirstName] opět vyhlásit válku, kdykoli se mi zachce."
 chancellor_task.1102.a: "Neuvěřitelná práce, [councillor.GetFirstNameNoTooltip]!"
 chancellor_task.1103.opening: "[neighbor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 chancellor_task.1103.desc: "Vedeme spolu korespondenci, [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'tvá', 'tvůj')] [councillor.GetCouncilTitle|l] a já, a musím říct, že tě nyní vidím v úplně jiném světle.\n\nMožná jsi dokonce někdo, koho bych jednoho dne [Select_CString(neighbor.IsFemale, 'mohla', 'mohl')] s hrdostí nazývat [Select_CString(ROOT.Char.IsFemale, 'svou přítelkyní', 'svým přítelem')]."
 chancellor_task.1103.a: "Tvá výřečnost dnes opravdu září, [councillor.GetFirstNameNoTooltip]!"
 chancellor_task.1103.message: "[councillor.GetCouncilTitle|U] udělal[Select_CString(councillor.IsFemale, 'a', '')] na souseda dobrý dojem"
 chancellor_task.2001.t: "Místní odpor"
 chancellor_task.2001.desc: "Má úcta, [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [councillor.Custom2('RelationToMe', ROOT.Char)|l],\n má snaha o reorganizaci pokračuje rychlým tempem, ale ne každý je přesvědčen o jejích výhodách.\nZdá se, že jsem šlápl[Select_CString(councillor.IsFemale, 'a', '')] na kuří oko několika starostům a vesnickým stařešinům. Vlastně všem starostům a vesnickým stařešinům."
 chancellor_task.2001.a: "Co jsi to [Select_CString(councillor.IsFemale, 'provedla', 'provedl')], [councillor.GetFirstNameNoTooltip]..."
 chancellor_task.2001.notification: "Neschopnost, kterou projevuje [councillor.GetCouncilTitle|l], připravila mě o úctu obyvatel v [county.GetName]"
 chancellor_task.2002.desc: "Má úcta, [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [councillor.Custom2('RelationToMe', ROOT.Char)|l]...\n\nZdá se, že jsem se v několika věcech zmýlil[Select_CString(councillor.IsFemale, 'a', '')]. Reformy, které jsem [Select_CString(councillor.IsFemale, 'zavedla', 'zavedl')], měly upevnit tvou vládu nad krajem, ale místo toho místní pomalu ani nevědí, kdo je jejich [ROOT.Char.GetTitleTierName|l]..."
 chancellor_task.2002.a: "Ty jsi to #EMP ještě [Select_CString(councillor.IsFemale, 'zhoršila', 'zhoršil')]?!#!"
 chancellor_task.2002.notification: "[councillor.GetCouncilTitle|U] ztrácí kontrolu a [county.GetName] se vymyká z rukou!"
 chancellor_task.2003.t: "Zklamání"
 chancellor_task.2003.desc: "Zdravím tě, [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [baron.Custom2('RelationToMe', ROOT.Char)|l],\n musím si postěžovat na jednání [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'tvé', 'tvého')] [councillor.GetCouncilTitle|l]!\n[county.GetName] se [Select_CString(councillor.IsFemale, 'stala', 'stal')] terčem svévolných změn, které vůbec neberou ohled na naše tradice ani dávné zvyklosti!"
 chancellor_task.2003.a: "Nemůžeš postupovat trochu citlivěji, [councillor.GetFirstNameNoTooltip]?"
 chancellor_task.2003.notification: "[Select_CString(councillor.IsFemale, 'Má neschopná', 'Můj neschopný')] [councillor.GetCouncilTitle|l] [Select_CString(councillor.IsFemale, 'rozhněvala', 'rozhněval')] jednoho z mých vazalů!"
 chancellor_task_2001.message: "$baron_plural_upper_case$ se brání integraci"
 chancellor_task_2002.message: "[resisting_culture.GetCollectiveNoun] se brání integraci"
 chancellor_task_2101.message: "$baron_plural_upper_case$ podporují integraci"
 chancellor_task_2102.message: "[supporting_culture.GetCollectiveNoun] podporují integraci"
 chancellor_task_every_county_of_culture_in_title: "Každé hrabství [supporting_culture.GetName] kultury v rámci [title.GetNameNoTier]"
 chancellor_task.2103.opening: "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.2103.desc: "[title.GetName] se nám daří velmi dobře začleňovat. Dokonce bychom mohli zkusit v omezené míře zavést daňové postupy, které používá [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
 chancellor_task.2103.a: "Výborně. Zařiď to!"
 chancellor_task.2103.b: "Možná bychom se místo toho mohli z jejich postupů ještě něco naučit?"
 chancellor_task.2103.c: "Ne, takové věci potřebují čas. Dejme jim ho tolik, kolik bude třeba."
 chancellor_task.3001.opening: "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3001.desc: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'tvá', 'tvůj')] [councillor.GetCouncilTitle|l], je už nějakou dobu mým hostem. Neustále se mi doma roztahuje a přitom mě nabádá, abych se před tebou téměř plazil[Select_CString(vassal.IsFemale, 'a', '')]! Je mi z toho nanic!\n\nKdo by poslal tak strašného zástupce?"
 chancellor_task.3001.a: "[councillor.GetFirstNameNoTooltip]! Co jsi to [Select_CString(councillor.IsFemale, 'provedla', 'provedl')]?!"
 chancellor_task.3002.opening: "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3002.desc: "Zdá se, že jsem při jednání s [vassal.GetTitledFirstName] možná... nedopatřením [Select_CString(councillor.IsFemale, 'slíbila', 'slíbil')] určité úlevy z povinností, které vůči tobě má...\n\n[Select_CString(councillor.IsFemale, 'Snažila', 'Snažil')] jsem se to napravit, ale obávám se, že už z toho nejspíš není jiná cesta ven..."
 chancellor_task.3002.a: "Ty hlupáku!"
 chancellor_task.3002.c: "Ne, tohle ještě dokážu zachránit."
 chancellor_task.3002.d: "Ale kdepak."
 chancellor_task.3101.opening: "[active_councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 chancellor_task.3101.desc: "[attacker_vassal.GetTitledFirstName] a [defender_vassal.GetTitledFirstName] spolu stále válčí a já se neúnavně snažím přijít jejich sporu na kloub. Věřím, že se správným povzbuzením by mohlo dojít k dohodě."
 chancellor_task.3101.a: "Ať to stojí cokoli, přiměj je přestat bojovat."
 chancellor_task.3101.b: "Jako jejich [ROOT.Char.GetTitleTierName|l] jim poručím a oni poslechnou!"
 chancellor_task.3101.c: "Ať si své neshody vyřeší sami."
 chancellor_task.3101.c.tt: "Válka mezi [attacker_vassal.GetFirstNameNoTooltip] a [defender_vassal.GetFirstNameNoTooltip] pokračuje"
 chancellor_task.3102.desc: "Zjistil[Select_CString(councillor.IsFemale, 'a', '')] jsem, že smlouva, kterou má [vassal.GetTitledFirstName], ukládá více povinností, než kolik jsi dosud vymáhal[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 chancellor_task.3102.a: "Je čas tuhle křivdu napravit!"
 chancellor_task.3102.c: "Tentokrát to nechám být..."
 chancellor_task.3003.t: "Ztráta autority"
 chancellor_task.3003.desc: "Zdá se, že ať už [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], dělá cokoli — pokud vůbec něco! — nestačí to.\n\nPod [Select_CString(councillor.IsFemale, 'jejím', 'jeho')] dohledem si moji vazalové dělají, co chtějí, a jen málokdy si v čemkoli vyžádají můj souhlas."
 chancellor_task.3003.a: "Mám pocit, jako by mi moc proklouzávala mezi prsty."
 chancellor_task.3003.notification: "[councillor.GetCouncilTitle|U] nezvládá vazaly"
 chancellor_task.3103.desc: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'tvá', 'tvůj')] [councillor.GetCouncilTitle|l], je už několik týdnů mým hostem a [Select_CString(councillor.IsFemale, 'pomohla', 'pomohl')] mi skutečně poznat nádheru panství pod tvou vládou.\n\nJe mi ctí být tvým vazalem!"
 chancellor_task.3103.a: "Tak vděční služebníci jsou požehnáním."
 chancellor_task.3104.desc: "Objevil[Select_CString(councillor.IsFemale, 'a', '')] jsem staré smlouvy týkající se [primary_title.GetName]. Dalo by se na jejich základě tvrdit, že [vassal.GetTitledFirstName] musí své budoucí dědictví rozdělit spravedlivěji, než se dosud předpokládalo."
 chancellor_task.3104.a: "Musíme chránit práva dědiců [vassal.GetFirstNameNoTooltip]!"
 chancellor_task.3104.b: "Všechno může zůstat při starém. Za jistou cenu..."
 chancellor_task.3104.c: "Není třeba panství tříštit."
