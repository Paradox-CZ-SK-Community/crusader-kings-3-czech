l_polish:
 councillor_spouse_diplomacy.1001.desc: "Dobrá pověst rodiny"
 councillor_spouse_diplomacy.1002.desc: "Spor sourozenců urovnán"
 councillor_spouse_diplomacy.1003.desc: "Vztahy mezi sourozenci zlepšeny"
 councillor_spouse_diplomacy.1004.desc: "Výcvik v diplomacii"
 councillor_spouse_diplomacy.1004.desc_diplo_councillor: "[councillor.GetTitleAsName] [Select_CString(councillor.IsFemale, 'učitelkou', 'učitelem')]"
 councillor_spouse_diplomacy.1005.desc: "Diplomatická praxe"
 councillor_spouse_diplomacy.1006.desc: "Díky usilovné práci se [councillor.GetTitledFirstName] [Select_CString(councillor.IsFemale, 'zlepšila', 'zlepšil')] v jednání s lidmi."
 councillor_spouse_diplomacy.1007.desc: "Přátelské styky"
 councillor_spouse_diplomacy.2001.t_female: "[councillor.GetCouncilTitle]: Žádaná nevěsta"
 councillor_spouse_diplomacy.2001.t_male: "[councillor.GetCouncilTitle]: Žádaný ženich"
 councillor_spouse_diplomacy.2001.desc_mother: "[councillor.GetTitledFirstName] si prohlíží naše [ROOT.Char.Custom('ChildChildrenGender')|l]. Přitom se jako obvykle projeví [councillor.Custom('quirk_pos_noun')|l]. „Žádné z našich dětí by nemělo zůstat bez vhodného protějšku."
 councillor_spouse_diplomacy.2001.desc: "[councillor.GetTitledFirstName] si prohlíží mé [ROOT.Char.Custom('ChildChildrenGender')|l]. Přitom se jako obvykle projeví [councillor.Custom('quirk_pos_noun')|l]. „Žádné z tvých dětí by nemělo zůstat bez vhodného protějšku."
 councillor_spouse_diplomacy.2001.desc_end: "Když mi dovolíš, abych je trochu [Select_CString(councillor.IsFemale, 'poučila', 'poučil')], brzy se zájemci o sňatek budou řadit až na ulici!“"
 councillor_spouse_diplomacy.2001.a: "Tvé vedení nejvíc potřebuje [child_heir.GetTitledFirstNameNoTooltip]."
 councillor_spouse_diplomacy.2001.b: "Trocha výuky by prospěla všem."
 councillor_spouse_diplomacy.2001.b.all_kids: "Všechny mé nesezdané děti:"
 councillor_spouse_diplomacy.2001.c: "Raději #EMP mě#! nauč působit na lidi sympaticky!"
 councillor_spouse_diplomacy.2002.t: "[councillor.GetCouncilTitle]: Sbližování"
 councillor_spouse_diplomacy.2002.desc: "„Pěstovat vztahy mezi příští generací panovníků je povinnost, kterou bychom neměli zanedbávat,“ říká [councillor.GetTitledFirstName].\n\n„Někteří z tvých vlivnějších vazalů mají děti, které by podle mě [child_heir.GetTitledFirstName] [Select_CString(child_heir.IsFemale, 'měla', 'měl')] poznat.“"
 councillor_spouse_diplomacy.2002.a: "[vassal_heir_1.GetTitledFirstNameNoTooltip] vypadá jako [vassal_heir_1.Custom('WomanManGirlBoy')|l] s dobrou pověstí."
 councillor_spouse_diplomacy.2002.b: "[vassal_heir_2.GetTitledFirstNameNoTooltip] by [Select_CString(vassal_heir_2.IsFemale, 'nejspíš měla', 'nejspíš měl')] dobrý vliv!"
 councillor_spouse_diplomacy.2002.c: "O [vassal_heir_3.GetTitledFirstNameNoTooltip] jsem slyšel jen samou chválu."
 councillor_spouse_diplomacy.2002.d: "[Select_CString(child_heir.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_heir'))|l] si poradí [Select_CString(child_heir.IsFemale, 'sama', 'sám')]."
 councillor_spouse_diplomacy.2003.t: "[councillor.GetCouncilTitle]: Příležitost k usmíření"
 councillor_spouse_diplomacy.2003.desc: "Jakmile na druhé straně [ROOT.Char.GetFaith.HouseOfWorship] spatřím [rival.GetTitledFirstName], [Select_CString(rival.IsFemale, 'svou', 'svého')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival'))|l], už se otáčím k odchodu. K mému překvapení však [councillor.GetTitledFirstName] [councillor.Custom('quirk_pos_adverb')|l] mávne na druhou stranu. [rival.Custom2('InsultNoun', ROOT.Char)|U] skutečně zamíří k nám.\n\n„[Select_CString(rival.IsFemale, 'Souhlasila', 'Souhlasil')] se s tebou sejít na neutrální půdě. Máte toho tolik společného. [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')|U] — právě tak lze popsat [ROOT.Char.Custom2('WomenMenPeople', SCOPE.sC('rival'))|l] jako vy. A přesto se sváříte. Nemyslíš, že je čas se usmířit?“"
 councillor_spouse_diplomacy.2003.a: "Možná máš pravdu..."
 councillor_spouse_diplomacy.2003.b: "Já [Select_CString(rival.IsFemale, 'jí', 'mu')] ten obličej napravím!"
 councillor_spouse_diplomacy.2003.c: "„[SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')|U]“?! Tak takhle [Select_CString(rival.IsFemale, 'ji', 'ho')] vidíš? Povím ti, [Select_CString(rival.IsFemale, 'jaká', 'jaký')] [rival.GetFirstNameNoTooltip] doopravdy je..."
 councillor_spouse_diplomacy.2004.t: "[councillor.GetCouncilTitle]: Příhodný nárok"
 councillor_spouse_diplomacy.2004.desc: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|l], ke mně dychtivě přivádí [claimant.GetTitledFirstName].\n\n„Jako [ROOT.Char.GetTitleTierName|l] jistě oceníš, koho ti přivádím. [claimant.GetTitledFirstName] si činí nárok na [title_to_claim.GetName].“\n\n[claimant.GetFirstName] se přede mnou ukloní a říká: „Je mi ctí, [claimant.Custom2('RelationToMeAddress', ROOT.Char)|l]. Bohužel mi [title_to_claim.GetNameNoTier] nejspíš zůstane nedostupný bez... dobrodince na mé straně.“"
 councillor_spouse_diplomacy.2004.a: "S tím bych ti snad [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] pomoci."
 councillor_spouse_diplomacy.2004.a.tt: "#F Pokud [claimant.GetFirstNameNoTooltip] zůstane u mého dvora, budu moci ve správnou chvíli prosadit [Select_CString(claimant.IsFemale, 'její', 'jeho')] nárok.#!"
 councillor_spouse_diplomacy.2004.b: "Hodně štěstí."
 councillor_spouse_diplomacy.2004.c: "Vězení. Pergamen. Holub. [current_holder.GetTitledFirstNameNoTooltip] dostane zprávu. V tomto pořadí."
 councillor_spouse_diplomacy.2004.c.tt: "#F Zprávu ode mě obdrží [current_holder.GetTitleTierName] a dozví se, že [claimant.GetFirstNameNoTooltip] již nepředstavuje hrozbu.#!"
