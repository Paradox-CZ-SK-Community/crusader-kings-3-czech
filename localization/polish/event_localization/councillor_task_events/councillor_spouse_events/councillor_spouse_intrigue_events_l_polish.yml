l_polish:
 councillor_spouse_intrigue.0001.message: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] a [spymaster.GetCouncilTitle|l] spolupracují"
 councillor_spouse_intrigue.0002.message: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] odhaluje intriku"
 councillor_spouse_intrigue.0003.message: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] odhaluje tajemství"
 councillor_spouse_intrigue.0004.message: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] pomáhá s intrikou"
 councillor_spouse_intrigue.0005.message: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] ovlivňuje poddaného"
 councillor_spouse_intrigue.0006.message: "Konec naivity"
 councillor_spouse_intrigue.0007.message: "Nácvik klamu"
 councillor_spouse_intrigue.1001.t: "[councillor.GetCouncilTitle]:  Nikomu nevěř"
 councillor_spouse_intrigue.1001.desc: "„Musíš si dávat pozor na lidi, kterými se obklopuješ.“ [councillor.GetTitledFirstName] má v očích smrtelně vážný výraz. „[Select_CString(councillor.IsFemale, 'Zjistila', 'Zjistil')] jsem, že [spymaster.GetTitledFirstName] proti tobě právě teď kuje pykle!“\n\nJe to vůbec možné? Zrovna [spymaster.GetCouncilTitle|l]?!"
 councillor_spouse_intrigue.1001.a: "[Select_CString(ROOT.Char.IsFemale, 'Nechala', 'Nechal')] jsem se vodit za nos!"
 councillor_spouse_intrigue.1002.t: "[councillor.GetCouncilTitle]:  Pověsti a dohady"
 councillor_spouse_intrigue.1002.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|U] [councillor.Custom('quirk_pos_present')|l], jak to dělává vždy, když se chce o něco podělit. „Určitě už se k tobě donesly ty pověsti. [target.GetTitledFirstName] prý skrývá něco strašného.“ Nakloním se blíž, zatímco [councillor.GetTitledFirstName] ztiší hlas. „Všechny jsou pravdivé. Potřebujeme jen důkaz.“"
 councillor_spouse_intrigue.1002.a: "Je čas na trochu špionáže, [councillor.Custom('LoverPetName')|l]!"
 councillor_spouse_intrigue.1002.b: "Musím zjistit, co to je!"
 councillor_spouse_intrigue.1002.c: "Svá tajemství chráním lépe než [target.GetFirstNameNoTooltip]."
 councillor_spouse_intrigue.1003.t: "[councillor.GetCouncilTitle]:  Odhalení"
 councillor_spouse_intrigue.1003.desc: "[councillor.GetTitledFirstName] se ke mně blíží způsobem, z něhož hned poznám, že [Select_CString(councillor.IsFemale, 'narazila', 'narazil')] na další tajemství u dvora.\n\n„[agent.GetTitledFirstName] je [Select_CString(agent.IsFemale, 'zapletená', 'zapletený')] do spiknutí,“ říká [councillor.GetTitledFirstName]. „[agent.GetFirstNameNoTooltip] zatím netuší, že o tom vím, ale navrhuji nabídnout [Select_CString(agent.IsFemale, 'jí', 'mu')] milost výměnou za naprostou věrnost...“"
 councillor_spouse_intrigue.1003.a: "Dej [Select_CString(agent.IsFemale, 'jí', 'mu')] jasně najevo, o co všechno jde."
 councillor_spouse_intrigue.1003.b: "[Select_CString(agent.IsFemale, 'Využij ji', 'Využij ho')] k odhalení skutečného strůjce!"
 councillor_spouse_intrigue.1003.c: "Sleduj každý [Select_CString(agent.IsFemale, 'její', 'jeho')] krok a chraň mě před újmou!"
 councillor_spouse_intrigue.1004.t: "[councillor.GetCouncilTitle]:  Prověřování protivníků"
 councillor_spouse_intrigue.1004.desc: "[secret_holder.GetTitledFirstName] mi už dlouho pije krev a [faction.GetName] má přitom [Select_CString(secret_holder.IsFemale, 'její hlasitou podporu', 'jeho hlasitou podporu')]. Zdá se však, že konečně získávám navrch.\n\n[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|U] mi s vychytralým úsměvem sděluje, že [Select_CString(councillor.IsFemale, 'odhalila', 'odhalil')] tajemství, které [secret_holder.GetTitledFirstName] úzkostlivě střeží.\n\n„Napadlo mě, že by tě to mohlo zajímat, [Select_CString(ROOT.Char.IsFemale, 'má drahá', 'můj drahý')]...“"
 councillor_spouse_intrigue.1004.a: "Trocha vydírání [Select_CString(secret_holder.IsFemale, 'ji', 'ho')] udrží na uzdě."
 councillor_spouse_intrigue.1004.b: "To je skandální! Celé panství se to musí dozvědět!"
 councillor_spouse_intrigue.1004.c: "Někdy je s vítěznou kartou lepší vyčkat."
 councillor_spouse_intrigue.1004.c.tt: "[secret_holder.GetFirstNameNoTooltip] zatím může své tajemství dál skrývat"
 councillor_spouse_intrigue.1005.t: "[councillor.GetCouncilTitle]:  Rozděl a panuj"
 councillor_spouse_intrigue.1005.desc: "[faction_member.GetTitledFirstName] a [leader.GetTitledFirstName] stojí pevně při sobě a [faction.GetName] z jejich spojenectví těží. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|U] však má plán, jak to změnit.\n\n„Věř mi, stačí, abych [Select_CString(councillor.IsFemale, 'prozradila', 'prozradil')] pár věcí, a jejich spojenectví bude rázem minulostí.“"
 councillor_spouse_intrigue.1005.a: "Ať už [faction_member.GetFirstNameNoTooltip] a [leader.GetFirstNameNoTooltip] nikdy nestojí na stejné straně!"
 councillor_spouse_intrigue.1005.b: "Dokážeš zařídit, abych #EMP já#! [Select_CString(ROOT.Char.IsFemale, 'vypadala', 'vypadal')] jako lepší volba?"
 councillor_spouse_intrigue.1006.t: "[councillor.GetCouncilTitle]:  [Select_CString(plant.IsFemale, 'Vhodná zástupkyně', 'Vhodný zástupce')]"
 councillor_spouse_intrigue.1006.desc: "V mých plánech figuruje [target.GetTitledFirstName]. [councillor.GetFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|l], o nich dobře ví a přichází za mnou s návrhem.\n\n„Na dvoře, kterému vládne [court_owner.GetTitledFirstName], mám přátele. [Select_CString(councillor.IsFemale, 'Mohla', 'Mohl')] bych je požádat, aby na čas ubytovali hosta. S malým důkazem věrnosti a veškerou podporou, kterou dokážu nabídnout, by [plant.GetTitledFirstName] [Select_CString(plant.IsFemale, 'mohla', 'mohl')] ve tvém zájmu dokázat divy...“"
 councillor_spouse_intrigue.1006.a: "[Select_CString(councillor.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|l] má skvělý nápad!"
 councillor_spouse_intrigue.1006.b: "Myslím, že [plant.GetFirstNameNoTooltip] bude potřeba tady."
