 add_patronage_spouse_education_points_effect.t: "Dítě těží z vedení mé choti"
 add_patronage_spouse_education_points_effect.desc: "[patronage_student.GetTitledFirstName], [Select_CString(patronage_student.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('patronage_student'))|l], má díky [councillor.GetTitledFirstNamePossessive] vedení větší šanci získat dobré [Concept('education','vzdělání')|E]."
 add_patronage_spouse_education_points_child_effect.desc: "[patronage_student.GetTitledFirstName], [Select_CString(patronage_student.IsFemale, 'má', 'můj')] [patronage_student.Custom('GetDaughterSon')|l], má díky [councillor.GetTitledFirstNamePossessive] vedení větší šanci získat dobré [Concept('education','vzdělání')|E]."
 councillor_spouse_learning.2601.t: "[councillor.GetCouncilTitle]:  Další studium"
 councillor_spouse_learning.2601.not_scholarly.desc: "„Jednou za čas by ti neuškodilo přečíst si nějakou knihu,“ často mi říká [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|l], [Select_CString(councillor.IsFemale, 'která sama tráví', 'který sám tráví')] spoustu času nad knihami. [Select_CString(councillor.IsFemale, 'Nabídla', 'Nabídl')] se, že mě bude doučovat, pokud budu potřebovat pomoci se začátky."
 councillor_spouse_learning.2601.scholarly.desc: "Kdykoli mě [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|l], přistihne nad knihou, viditelně se nadchne.\n\n„Nechceš pomoc se studiem? Někoho na výměnu myšlenek, nebo snad nějaké nové svazky? [Select_CString(councillor.IsFemale, 'Nedávno jsem získala', 'Nedávno jsem získal')] svazek s vynikajícím rozborem na téma [ROOT.Char.Custom('education_conversation_subject')|l]!“"
 councillor_spouse_learning.2601.a: "Ano, tvé vedení uvítám."
 councillor_spouse_learning.2601.b: "[tutoring_student_1.GetTitledFirstNameNoTooltip] potřebuje tvou pomoc víc než já."
 councillor_spouse_learning.2601.c: "Tvou pomoc potřebuje spíš [tutoring_student_2.GetTitledFirstNameNoTooltip]."
 councillor_spouse_learning.2601.d: "[Select_CString(councillor.IsFemale, 'Měla', 'Měl')] by ses věnovat vlastnímu studiu."
 councillor_spouse_learning_2601_tutoring_effect.critical_success: "[THIS.Char.GetTitledFirstNamePossessiveOrMyNoTooltip|U] porozumění tématu „[THIS.Char.Custom('education_focus')|l]“ se výrazně prohloubí"
 councillor_spouse_learning_2601_tutoring_effect.success: "[THIS.Char.GetTitledFirstNamePossessiveOrMyNoTooltip|U] porozumění tématu „[THIS.Char.Custom('education_focus')|l]“ se prohloubí"
 councillor_spouse_learning.2001.faith.t: "[councillor.GetCouncilTitle]:  Odpůrci jiné víry ([councillor.GetFaith.GetNameNoTooltip])"
 councillor_spouse_learning.2001.culture.t: "[councillor.GetCouncilTitle]:  Odpůrci jiné kultury ([councillor.GetCulture.GetNameNoTooltip] kultura)"
 councillor_spouse_learning.2001.start.desc: "[faction_leader.GetTitledFirstName] stojí v čele spiklenců, které spojuje"
 councillor_spouse_learning.2001.faith.desc: "jiná víra ([councillor.GetFaith.GetNameNoTooltip])"
 councillor_spouse_learning.2001.culture.desc: "jiná kultura ([councillor.GetCulture.GetNameNoTooltip] kultura)"
 councillor_spouse_learning.2001.middle.desc: ". [different_culture_or_faith_faction.GetName] mi nedá ani chvíli klidu!"
 councillor_spouse_learning.2001.independence_faction.desc: "Měli by být věrnými poddanými, ale vím, že kují pikle, aby se proti mně obrátili."
 councillor_spouse_learning.2001.liberty_faction.desc: "Při každé příležitosti se snaží podkopat mou autoritu."
 councillor_spouse_learning.2001.claimant_faction.desc: "Ti nečestní zloději se chtějí zmocnit země, která právem náleží mně."
 councillor_spouse_learning.2001.end.desc: "\n\nNaštěstí [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|l], patří mezi „jejich vlastní“ a má na ně jistý vliv. [Select_CString(councillor.IsFemale, 'Nabídla', 'Nabídl')] se, že bude prostředníkem, a chce vědět, jak má postupovat."
 councillor_spouse_learning.2001.a.faith: "Usmiř členy frakce ([councillor.GetFaith.GetNameNoTooltip])."
 councillor_spouse_learning.2001.a.culture: "Usmiř členy frakce ([councillor.GetCulture.GetNameNoTooltip] kultura)."
 councillor_spouse_learning.2001.a.faction_members_faith: "Každý člen [different_culture_or_faith_faction.GetName] ([councillor.GetFaith.GetAdjective])"
 councillor_spouse_learning.2001.a.faction_members_culture: "Každý člen [different_culture_or_faith_faction.GetName] ([councillor.GetCulture.GetName] kultura)"
 councillor_spouse_learning.2001.b: "[faction_member_1.GetTitledFirstNameNoTooltip] musí frakci opustit."
 councillor_spouse_learning.2001.c: "[faction_member_2.GetTitledFirstNameNoTooltip] musí zůstat [Select_CString(faction_member_2.IsFemale, 'věrná', 'věrný')] mně."
 councillor_spouse_learning.2301.t: "[councillor.GetCouncilTitle]:  Vyšší moc"
 councillor_spouse_learning.2301.desc: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|l], se [Select_CString(councillor.IsFemale, 'stala', 'stal')] známou osobností náboženského světa. [councillor.GetTitledFirstName] podporuje učence a řády své víry ([councillor.GetFaith.GetAdjectiveNoTooltip]) i [councillor.GetFaith.HouseOfWorshipPlural]. [religious_head.GetTitledFirstName] si tohoto úsilí dokonce [Select_CString(religious_head.IsFemale, 'všimla', 'všiml')].\n\n[religious_head.GetTitleAsNamePossessiveNoTooltip|U] přízeň s sebou nese mocné výhody. [councillor.GetTitledFirstName] se [Select_CString(councillor.IsFemale, 'nabídla', 'nabídl')], že ji využije v můj prospěch."
 councillor_spouse_learning.2301.a: "Dokážeš nás seznámit?"
 councillor_spouse_learning.2301.a.success: "[religious_head.GetTitledFirstName] mě nyní považuje za [Select_CString(ROOT.Char.IsFemale, 'přítelkyni', 'přítele')]."
 councillor_spouse_learning.2301.b: "Co za to můžeme získat my?"
 councillor_spouse_learning.2301.c: "Tohle je má šance na návrat do společenství věřících!"
 councillor_spouse_learning.2301.d: "Ať [religious_head.GetTitledFirstName] ví, že [councillor.GetFaith.HighGodName] je důvodem všeho, co děláme."
 councillor_spouse_learning.2602.t: "[councillor.GetCouncilTitle]:  Rozšíření obzorů"
 councillor_spouse_learning.2602.not_root.desc: "[student.GetTitledFirstName], [Select_CString(student.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('student'))|l], má jednu nespornou přednost: [student.Custom('highest_skill_noun')|l]. [councillor.GetTitledFirstName] si však myslí, že je načase, aby [Select_CString(student.IsFemale, 'rozšířila', 'rozšířil')] své obzory.\n\n„[Select_CString(councillor.IsFemale, 'Mohla', 'Mohl')] bych opatřit nějaké nové svazky, připravit pár úkolů a věnovat se trochu doučování. Který předmět by podle tebe byl nejpřínosnější?“"
 councillor_spouse_learning.2602.root.desc: "„[student.Custom('highest_skill_noun')|U] ti očividně jde, ale jako [student.GetTitleTierName] ([student.GetPrimaryTitle.GetNameNoTierNoTooltip]) bys [Select_CString(student.IsFemale, 'měla', 'měl')] ovládat širokou škálu dovedností,“ říká [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|l], [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('councillor'))|l].\n\n„[Select_CString(councillor.IsFemale, 'Mohla', 'Mohl')] bych opatřit nějaké nové svazky, připravit pár úkolů a trochu tě doučovat. Který předmět tě zajímá nejvíc?“"
 councillor_spouse_learning.2602.a: "Diplomacie."
 councillor_spouse_learning.2602.b: "Vojenská teorie."
 councillor_spouse_learning.2602.c: "Hospodářství panství."
 councillor_spouse_learning.2602.d: "Správa špionážní sítě."
 councillor_spouse_learning.2602.e: "Teologie."
 councillor_spouse_learning.1304.desc: "[Select_CString(councillor.IsFemale, 'Manželka je patronkou', 'Manžel je patronem')]: [religious_vassal.GetFaith.AltPriestTermPlural]"
 councillor_spouse_learning.1305.desc: "[religious_head.GetTitleAsNameNoTooltip|U] obdivuje zbožnost mé choti"
 councillor_spouse_learning.2603.t: "[councillor.GetCouncilTitle]:  Na úrovni úkolu"
 councillor_spouse_learning.2603.desc: "Někteří z mých rádců se domnívají, že jim jejich úřad náleží už jen díky původu či vlivu. Jak hluboce se mýlí! Očekávám výsledky, ale příliš často přichází zklamání.\n\nPo dlouhém dni si na své rádce stěžuji, když mě [councillor.GetFirstName] přeruší. „Nech mě s tím něco udělat, [Select_CString(ROOT.Char.IsFemale, 'má drahá', 'můj drahý')]. Pár lekcí by jim mohlo zbystřit rozum.“"
 councillor_spouse_learning.2603.a: "[chancellor.GetCouncilTitle|U] [chancellor.GetFirstNameNoTooltip] by [Select_CString(chancellor.IsFemale, 'potřebovala', 'potřeboval')] učitele."
 councillor_spouse_learning.2603.b: "[marshal.GetCouncilTitle|U] [marshal.GetFirstNameNoTooltip] by [Select_CString(marshal.IsFemale, 'ocenila', 'ocenil')] tvou pomoc."
 councillor_spouse_learning.2603.c: "[steward.GetCouncilTitle] [steward.GetFirstNameNoTooltip] také potřebuje pár lekcí."
 councillor_spouse_learning.2603.d: "[spymaster.GetCouncilTitle] [spymaster.GetFirstNameNoTooltip] by možná [Select_CString(spymaster.IsFemale, 'ocenila', 'ocenil')] několik rad."
 councillor_spouse_learning.2603.e: "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] potřebuje trochu vedení."
 councillor_spouse_learning.2603.f: "Raději zůstaň tady se mnou..."
