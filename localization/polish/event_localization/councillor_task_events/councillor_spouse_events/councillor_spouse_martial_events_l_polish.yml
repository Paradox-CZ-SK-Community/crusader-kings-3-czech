l_polish:
 councillor_spouse_martial.0001.message: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] podporuje nábor"
 councillor_spouse_martial.0002.message: "Pomoc s organizací vojska"
 councillor_spouse_martial.0003.message: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] je inspirací"
 councillor_spouse_martial.0004.message: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] podporuje rytířské ctnosti"
 councillor_spouse_martial.0005.message: "Podpora při vyjednávání s žoldnéři"
 councillor_spouse_martial.0006.message: "Stará se o mě"
 councillor_spouse_martial.0007.message: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] ošetřuje zranění"
 councillor_spouse_martial.0008.message: "Zastrašující přítomnost"
 councillor_spouse_martial.0009.message: "Bojový výcvik"
 councillor_spouse_martial.1001.t: "[councillor.GetCouncilTitle]:  Turnajový den"
 councillor_spouse_martial.1001.desc: "Slunce svítí a kolem turnaje, který pořádá [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))], se hemží sedláci. Moji $knight_culture_player_plural_no_tooltip_lowercase$ všichni jásají, když [councillor.GetTitledFirstName] oznamuje, že se turnaj koná na jejich počest, a já se pro jednou mohu jen posadit a dívat se.\n\nCelý turnajový den ale na trůně rozhodně trčet nebudu!"
 councillor_spouse_martial.1001.a: "I já jásám! Moji $knight_culture_player_plural_no_tooltip_lowercase$ si to zaslouží!"
 councillor_spouse_martial.1001.commanders: "Každý $knight_culture_player_no_tooltip_lowercase$"
 councillor_spouse_martial.1001.b: "Tohle je skvělá příležitost! [child.GetFirstNameNoTooltip] dostane pár rad ode mě!"
 councillor_spouse_martial.1001.b.education_tt: "Díky mně [child.GetFirstNameNoTooltip] pokročí ve válečnickém vzdělání"
 councillor_spouse_martial.1001.c: "Dnešek patří #EMP nám oběma#!, [Select_CString(councillor.IsFemale, 'má drahá', 'můj drahý')]!"
 councillor_spouse_martial.1002.t: "[councillor.GetCouncilTitle]:  Jednání mým jménem"
 councillor_spouse_martial.1002.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|U] tráví značnou část času cestami po panství v doprovodu vlastní čestné stráže. Mnoho záležitostí lze takto vyřídit mým jménem a vojenský doprovod, s nímž [councillor.GetTitledFirstName] přijíždí, je ráznou připomínkou mého práva vládnout."
 councillor_spouse_martial.1002.a: "Ať přijde kdokoli, [councillor.GetTitleAsNameNoTooltip] i já budeme bránit panství!"
 councillor_spouse_martial.1002.b: "Dohlédni, aby se přede mnou lidé plazili, jak se patří, [Select_CString(councillor.IsFemale, 'má drahá', 'můj drahý')]."
 councillor_spouse_martial.1002.c: "Chci, aby [councillor.GetFirstNameNoTooltip] [Select_CString(councillor.IsFemale, 'zařídila', 'zařídil')], že se mě všichni budou bát a padat mi k nohám!"
 councillor_spouse_martial.1003.t: "[councillor.GetCouncilTitle]:  Otázka cti"
 councillor_spouse_martial.1003.desc: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|U] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('councillor'))]. Chce se mnou probrat válku, kterou vedou [attacker_vassal.GetTitledFirstName] a [defender_vassal.GetTitledFirstName].\n\n„Jejich boj postrádá čest a přináší hanbu tvému panství. Nech to na mně. Vím, že je dokážu přimět uzavřít mír.“"
 councillor_spouse_martial.1003.a: "Vyřeš to, ať to stojí cokoli."
 councillor_spouse_martial.1003.b: "Ne, chci vidět, kdo vyhraje!"
 councillor_spouse_martial.1003.b.tt: "[attacker_vassal.GetFirstNameNoTooltip] a [defender_vassal.GetFirstNameNoTooltip] pokračují ve válce"
 councillor_spouse_martial.1003.c: "Ach, věřím, že to dokážeš, [Select_CString(councillor.IsFemale, 'má drahá', 'můj drahý')]."
 councillor_spouse_martial.1003.c.unlock_tt: "Tuto možnost zpřístupňuje [councillor.GetFirstNameNoTooltip] díky své strategické genialitě"
 councillor_spouse_martial.1004.t: "[councillor.GetCouncilTitle]:  Stráž"
 councillor_spouse_martial.1004.desc: "Trochu mě mate, proč mi [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] chce na nádvoří předat „velkolepý dar“. Brzy však pochopím, když [councillor.GetTitledFirstName] poručí skupině vojáků nastoupit do řady. „Celý oddíl, povolaný z mých vlastních zemí, připravený ti sloužit.“\n\nTohle #EMP je#! velkolepý dar!"
 councillor_spouse_martial.1004.a: "Další vojáci posílí armádu!"
 councillor_spouse_martial.1004.b: "Budou sloužit jako má osobní stráž."
 councillor_spouse_martial.1005.t: "[councillor.GetCouncilTitle]:  Patřičný dojem"
 councillor_spouse_martial.1005.desc: "V [capital.GetNameNoTier] mě čeká návštěva. [vassal.GetTitledFirstName] přichází vzdát mi hold. [councillor.GetTitledFirstName] však navrhuje vojenskou přehlídku, která by mohla zajistit trvalou věrnost.\n\n„Kdo spatří tvou drtivou sílu, ten si zradu dvakrát rozmyslí, i kdyby ho někdy napadla,“ podotýká [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))]."
 councillor_spouse_martial.1005.a: "Ano, [vassal.GetFirstNameNoTooltip] uvidí vojáky všude, kam se podívá!"
 councillor_spouse_martial.1005.a.tt: "[vassal.GetFirstNameNoTooltip] bude více podléhat [Concept('dread','hrůze')|E]"
 councillor_spouse_martial.1005.b: "Běžná přehlídka by měla stačit."
