 councillor_spouse_stewardship.1010.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))|U] řeší dluh dvořana"
 councillor_spouse_stewardship.1011.desc.guilds: "Cechy poraženy"
