 councillor_spouse_stewardship.2001.t: "[councillor.GetCouncilTitle]:  Úvahy o investici"
 councillor_spouse_stewardship.2001.desc: "[councillor.GetTitledFirstName] svědomitě spravuje finance mé domácnosti, a tak na konci tohoto období zbývá více zlata, než se čekalo.\n\n„Jak bychom ho měli nejlépe využít, [Select_CString(ROOT.Char.IsFemale, 'má manželko', 'můj manželi')]?“"
 councillor_spouse_stewardship.2001.a: "Uspořádejme velkolepou hostinu pro potěšení všech!"
 councillor_spouse_stewardship_2001_every_powerful_vassal: "Každý mocný vazal"
 councillor_spouse_stewardship.2001.b: "Investujme peníze do zdejšího kraje."
 councillor_spouse_stewardship.2001.c: "Jestli si lze za peníze něco koupit, pak jsou to oči a uši!"
 councillor_spouse_stewardship.2001.d: "Zatím je ušetřeme."
 councillor_spouse_stewardship.2002.t: "[councillor.GetCouncilTitle]:  Zlatá příležitost"
 councillor_spouse_stewardship.2002.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U].“ [courtier_lender.GetTitledFirstName] se ke mně přišourá a usměje se [courtier_lender.Custom('quirk_pos_adverb')|l]. „[councillor.GetTitledFirstName] mi ve své moudrosti [Select_CString(councillor.IsFemale, 'navrhla', 'navrhl')], abychom se spolu dohodli. Tobě by se hodila finanční výpomoc a mně zase trocha společenské podpory...“"
 councillor_spouse_stewardship.2002.a: "Slibuji, že ti vše vrátím."
 councillor_spouse_stewardship.2002.money_loan_tooltip: "[courtier_lender.GetFirstNameNoTooltip] mi půjčí [gold_i] #bold [THIS.Var('amount_to_loan').GetValue]#! zlata."
 councillor_spouse_stewardship.2002.b: "Raději ať tvůj dar dostane [ROOT.Char.GetFaith.HouseOfWorship]."
 councillor_spouse_stewardship.2002.c: "Raději to daruj chudým."
 councillor_spouse_stewardship.2002.d: "Tento tribut s potěšením přijímám!"
 councillor_spouse_stewardship.2003.t: "[councillor.GetCouncilTitle]:  Obchodní příležitost"
 councillor_spouse_stewardship.2003.desc: "[councillor.GetTitledFirstName] ke mně přichází se třemi svitky pergamenu v náručí.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], mám zde obchodní návrhy pro sousední panovníky. Jsem si jist, že lze uzavřít dohodu výhodnou pro obě strany!“"
 councillor_spouse_stewardship.2003.a: "[ruler_1.GetTitledFirstNameNoTooltip] vypadá rozumně."
 councillor_spouse_stewardship.2003.b: "[ruler_2.GetTitledFirstNameNoTooltip] bude naším obchodním partnerem."
 councillor_spouse_stewardship.2003.c: "[ruler_3.GetTitledFirstNameNoTooltip] bude naším obchodním partnerem."
 councillor_spouse_stewardship.2003.d_greedy: "K mému zlatu se nikdo z nich ani nepřiblíží!"
 councillor_spouse_stewardship.2003.d_arrogant: "Nikdo z nich není hoden dohody se #EMP mnou#!!"
 councillor_spouse_stewardship.2003.d: "Nikdo z nich nenabízí dost lákavou příležitost..."
 councillor_spouse_stewardship.2004.t: "[councillor.GetCouncilTitle]:  Podaná ruka"
 councillor_spouse_stewardship.2004.desc: "„[Select_CString(on_my_hook.IsFemale, 'Tvá', 'Tvůj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('on_my_hook'))|l], [on_my_hook.GetTitledFirstName], [Select_CString(on_my_hook.IsFemale, 'se nedávno dostala', 'se nedávno dostal')] do menších potíží.“\n\n[councillor.GetTitledFirstName] se [councillor.Custom('quirk_pos_adverb')|l] usměje a pokračuje: „[Select_CString(councillor.IsFemale, 'Postarala', 'Postaral')] jsem se, aby se vše vyřešilo, a [Select_CString(councillor.IsFemale, 'nezapomněla', 'nezapomněl')] jsem zmínit, že zásluha patří tobě.“"
 councillor_spouse_stewardship.2004.a: "Výborná práce!"
 councillor_spouse_stewardship.2004.b: "Za dobrý skutek není třeba odměny."
 councillor_spouse_stewardship.2005.t: "[councillor.GetCouncilTitle]:  Investice: [county_to_boost.GetNameNoTierNoTooltip]"
 councillor_spouse_stewardship.2005.desc: "„[Select_CString(ROOT.Char.IsFemale, 'Má paní', 'Můj pane')]. [county_to_boost.GetName] nabízí vzácnou investiční příležitost.“\n\n[councillor.GetFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.Custom('WifeHusband')|l], mi předkládá podrobnosti obchodní investice a skutečně to vypadá, že pokud dohoda vyjde, [county_to_boost.GetNameNoTierNoTooltip] získá výrazný impuls k rozvoji."
 councillor_spouse_stewardship.2005.a: "Tohle riziko stojí za to!"
 councillor_spouse_stewardship.2005.a_1: "[county_to_boost.GetNameNoTierNoTooltip] z dohody výrazně těží"
 councillor_spouse_stewardship.2005.a_2: "Dohoda ztroskotá"
 councillor_spouse_stewardship.2005.b: "Místní ať tu příležitost využijí sami."
 councillor_spouse_stewardship.2005.c: "Tyhle řeči o místních záležitostech jsou pod mou úroveň!"
