l_polish:
 court_chaplain_task.0201.opening: "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 court_chaplain_task.0301.desc: "Prohledal[Select_CString(councillor.IsFemale, 'a', '')] jsem prastaré listiny i dokumenty... poněkud pochybnějšího původu. Konečně mám dost materiálu, abych mohl[Select_CString(councillor.IsFemale, 'a', '')] dokázat, že [county.GetName] právem náleží tobě!\n\nChybí už jen jeden malý úplatek..."
 court_chaplain_task.0301.a: "Zařiď to!"
 court_chaplain_task.0301.b: "Ne, to nemohu."
 court_chaplain_task.0301.b.tt: "Přijdeš o veškerý postup při fabrikování nároku"
 court_chaplain_task.0302.desc: "Prohledal[Select_CString(councillor.IsFemale, 'a', '')] jsem prastaré listiny i dokumenty... poněkud pochybnějšího původu. Konečně mám dost materiálu, abych mohl[Select_CString(councillor.IsFemale, 'a', '')] dokázat, že [county.GetName] právem náleží tobě.\n\nVlastně bych mohl[Select_CString(councillor.IsFemale, 'a', '')] tvrdit, že ti právem náleží i [duchy.GetName]!"
 court_chaplain_task.0302.desc_heretic_addition: "Prohledal[Select_CString(councillor.IsFemale, 'a', '')] jsem prastaré listiny i dokumenty... poněkud pochybnějšího původu. Konečně mám dost materiálu, abych mohl[Select_CString(councillor.IsFemale, 'a', '')] dokázat, že [county.GetName] právem náleží tobě.\n\nA protože [duchy_holder.GetFirstName] bohužel trvá na tom, že bude #EMP [duchy_holder.GetFaith.GetAdherentName|l]#!, mohl[Select_CString(councillor.IsFemale, 'a', '')] bych dokonce tvrdit, že ti božským právem náleží i [duchy.GetName]!"
 court_chaplain_task.0302.a: "Předlož můj nárok na [county.GetNameNoTierNoTooltip]."
 court_chaplain_task.0302.b: "Ano! Celé [duchy.GetNameNoTierNoTooltip] bude mé!"
 court_chaplain_task.0311.t: "Nárok na [county.GetNameNoTierNoTooltip]!"
 court_chaplain_task.0311.opening: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'její', 'jehož')] [councillor.GetCouncilTitle|l], už celé měsíce slouží [councillor_liege.GetTitledFirstName] a vytahuje pochybné smlouvy i smyšlené kroniky."
 court_chaplain_task.0311.end: "\n\nA teď se [councillor_liege.GetFirstName], [councillor_liege.GetTitleTierName|l], opovažuje tvrdit, že to všechno představuje legitimní nárok na [county.GetName]!"
 court_chaplain_task.0311.a: "Samé lži!"
 court_chaplain_task.0312.a: "[councillor_liege.GetFirstNameNoTooltip] snad nemá žádnou hanbu?!"
 court_chaplain_task.0313.t: "Nárok na [county.GetNameNoTierNoTooltip]!"
 court_chaplain_task.1001.notification: "Kázání neortodoxního učení"
 court_chaplain_task.1002.notification: "Slabá rétorika"
 court_chaplain_task.1101.notification: "Působivá rétorika"
 court_chaplain_task.2001.notification: "Odpor vůči konverzi"
 court_chaplain_task.2002.notification: "Lidový odpor vůči konverzi"
 court_chaplain_task.2101.notification: "Nadšené konverze"
 court_chaplain_task.2102.notification: "Zřízeny nové [councillor.GetFaith.HouseOfWorshipPlural|l]"
 court_chaplain_task.2103.notification: "Noví konvertité se hlásí dobrovolně"
 court_chaplain_task.3001.t: "Podkopávání řádu"
 court_chaplain_task.3001.desc: "[councillor.GetFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], přichází ke mně očividně velmi znepokojen[Select_CString(councillor.IsFemale, 'á', 'ý')].\n\n„Vyšlo najevo, že... prověřuji existenci spravedlivého a právoplatného nároku, který bys mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] vznést na [county.GetName]. Stačí říct, že mnoho tvých vazalů rozhořčilo, že jejich [ROOT.Char.GetTitleTierName|l] přehlíží jejich věrnost a takto jedná proti nim.“"
 court_chaplain_task.3001.a: "Jak ses mohl[Select_CString(councillor.IsFemale, 'a', '')] nechat chytit?!"
 court_chaplain_task.3002.notification: "Obvinění z fabrikování nároku"
 court_chaplain_task.3003.opening: "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 court_chaplain_task.3003.desc: "Dozvěděl[Select_CString(vassal.IsFemale, 'a', '')] jsem se, že [councillor.GetFirstName], [Select_CString(councillor.IsFemale, 'tvá', 'tvůj')] [councillor.GetCouncilTitle|l], pracuje na zfalšování pochybného nároku na [county.GetName]. Prosím tě, pamatuj, že jako [ROOT.Char.GetTitleTierName|l] vládneš z práva, ne z chamtivosti."
 court_chaplain_task.3003.a: "Vím, co dělám, [vassal.GetFirstNameNoTooltip]."
 court_chaplain_task.3003.b: "Uvědom si své místo, [vassal.GetTitledFirstNameNoTooltip]."
 court_chaplain_task.3004.opening: "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
 court_chaplain_task.3004.desc: "Je zřejmé, že [Select_CString(councillor.IsFemale, 'tvá', 'tvůj')] [councillor.GetCouncilTitle|l] pracuje na vytvoření falešného a pochybného nároku na [county.GetName]. Nemysli si, že takové nečestné jednání zůstane bez odezvy."
 court_chaplain_task.3004.a: "Ale tady #EMP skutečně#! existuje důvod k nároku."
