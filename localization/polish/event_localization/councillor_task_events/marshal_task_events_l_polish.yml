l_polish:
 marshal_task.0301.t: "Povýšení velitele"
 marshal_task.0301.desc: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], mi představuje nadějného nového bojovníka.\n\n„[commander.GetTitledFirstName] možná nepochází z tak urozeného rodu jako ty, [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [councillor.Custom2('RelationToMe', ROOT.Char)|l], ale na své jméno přísahám, že je to člověk, kterého chceš mít po svém boku.“"
 marshal_task.0301.a: "Dobrá tedy, [commander.GetFirstNameNoTooltip] mi bude sloužit."
 marshal_task.0301.b: "Tahle chátra musí ven! [ROOT.Char.Custom('ResidenceBuilding')|U] není útulek!"
 marshal_task.0302.opening: "[councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 marshal_task.0302.desc: "U [commander.GetTitledFirstName] jsem [Select_CString(councillor.IsFemale, 'vypozorovala', 'vypozoroval')] nadání pro [commander.Custom('CommanderTraitSkillDescription')|l]."
 marshal_task.0302.desc.known: "Je to jedna z mých specialit a [commander.GetTitledFirstName] by se ode mě [Select_CString(commander.IsFemale, 'mohla', 'mohl')] naučit, jak tyto schopnosti co nejlépe využít."
 marshal_task.0302.desc.unknown: "Sice v této oblasti nemám mnoho zkušeností, ale i tak bych [commander.GetTitledFirstName] [Select_CString(commander.IsFemale, 'mohla', 'mohl')] pomoci tyto schopnosti zdokonalit."
 marshal_task.0302.a: "Rozhodně. [commander.GetFirstNameNoTooltip] se od tebe může hodně naučit."
 marshal_task.0302.b: "Ne, [commander.GetFirstNameNoTooltip] by se [Select_CString(commander.IsFemale, 'měla', 'měl')] soustředit na osobní boj."
 marshal_task.0304.t: "Povýšit na velitele?"
 marshal_task.0304.desc: "[beneficiary_of_nepotism.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přichází ke mně a [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], [Select_CString(beneficiary_of_nepotism.IsFemale, 'ji', 'ho')] velmi váhavě představuje.\n\n„[advocate_of_nepotism.GetTitledFirstName|U] mě [Select_CString(advocate_of_nepotism.IsFemale, 'požádala', 'požádal')], aby se [beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] [Select_CString(beneficiary_of_nepotism.IsFemale, 'stala velitelkou', 'stal velitelem')]. Napadlo mě však, že bys k tomu možná [Select_CString(ROOT.Char.IsFemale, 'chtěla', 'chtěl')] nejprve něco říct...“\n\n[beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] [beneficiary_of_nepotism.Custom('quirk_neg_present')|l]."
 marshal_task.0304.a_clan: "Náš rod, [ROOT.Char.GetHouse.GetBaseNameNoTooltip], má v mém vojsku místo pro všechny své děti."
 marshal_task.0304.a_neutral: "[Select_CString(beneficiary_of_nepotism.IsFemale, 'Tvá', 'Tvůj')] [beneficiary_of_nepotism.Custom('GetDaughterSon')|l] je v mém vojsku [Select_CString(beneficiary_of_nepotism.IsFemale, 'vítána', 'vítán')]. "
 marshal_task_0304_a_tt: "@warning_icon! #X [CHARACTER.GetShortUINameNoTooltip|U] bude rozhořčen, pokud [TARGET_CHARACTER.GetShortUINameNoTooltip|U] během příštích 20 let přijde o své místo#!"
 marshal_task.0304.b: "Neměl by [beneficiary_of_nepotism.GetTitledFirstNameNoTooltip] raději sloužit jako dvořan?"
 marshal_task.0304.b.success: "[advocate_of_nepotism.GetTitledFirstNameNoTooltip] je s tvou nabídkou [Select_CString(advocate_of_nepotism.IsFemale, 'spokojená', 'spokojený')]"
 marshal_task.0304.b.failure: "[advocate_of_nepotism.GetTitledFirstNameNoTooltip] považuje tvou nabídku za urážku"
 marshal_task.0304.c: "Mé vojsko #EMP není#! školka!"
 marshal_task.0306.opening: "[advocate_of_nepotism.Custom2('AppropriateGreetingNegative', SCOPE.sC('councillor_liege'))]"
 marshal_task.0306.desc: "[Select_CString(advocate_of_nepotism.IsFemale, 'Vzala', 'Vzal')] jsem tě za slovo, když jsi [Select_CString(ROOT.Char.IsFemale, 'slíbila', 'slíbil')], že [beneficiary_of_nepotism.Custom2('MyCharacterIntroduction', advocate_of_nepotism)|l] bude u tebe sloužit jako [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]. Teď však vidím, že má důvěra byla nemístná. Promiň, že jsem tvým slovům [Select_CString(advocate_of_nepotism.IsFemale, 'věřila', 'věřil')] až příliš."
 marshal_task.0306.a: "Tohle je jen nedorozumění!"
 marshal_task.1001.t: "Dezerce odvedenců"
 marshal_task.1001.desc: "Tvrdé náborové postupy, které používá [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], mají podle všeho přesně opačný účinek, než bylo zamýšleno.\n\nZ měst a vesnic jsou odváděni další a další sedláci, ale mnozí prchají před oddíly, kterým velí [councillor.GetTitledFirstName], aby unikli povinné službě!"
 marshal_task.1001.a: "Potřebuji více vojáků, ne méně!"
 marshal_task.1001.notification: "Dezerce odvedenců"
 marshal_task.1002.t: "Neobdělávaná půda"
 marshal_task.1002.desc: "Rekordní počet odvedenců, které [councillor.GetTitledFirstName] [Select_CString(councillor.IsFemale, 'povolala', 'povolal')] do služby, má několik nečekaných následků.\n\n[county.GetName] kvůli bezohlednému náboru přichází o pracovní sílu a celé lány polí zůstávají ladem."
 marshal_task.1002.a: "Tohle se nesmí stávat."
 marshal_task.1002.notification: "Odvody nechávají pole ladem"
 marshal_task.1003.t: "Nedostatek stráží"
 marshal_task.1003.desc: "[county.GetName] se kvůli horlivému náboru, který vede [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|l], potýká s nedostatkem bojeschopných mužů.\n\nMístních strážců je stále méně a zločinnost roste."
 marshal_task.1003.a: "Co jsi to [Select_CString(councillor.IsFemale, 'provedla', 'provedl')], [councillor.GetFirstNameNoTooltip]..."
 marshal_task.1003.notification: "Stráže odvedeny do vojska"
 marshal_task.1101.t: "Dobře organizované odvody"
 marshal_task.1101.desc: "Díky pečlivému prověřování a výběru odvedenců [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], [Select_CString(councillor.IsFemale, 'zajistila', 'zajistil')], že [county.GetName] nepřichází o potřebnou pracovní sílu a ani jediný statek nezůstává bez péče.\n\nZáznamy, které [councillor.GetTitledFirstName] vede, se navíc budou náramně hodit, až přijde čas vybírat daně..."
 marshal_task.1101.a: "Skvělá práce, [councillor.GetFirstNameNoTooltip]."
 marshal_task.1101.notification: "Dobře organizované odvody"
 marshal_task.1102.t: "Posílená vojenská přítomnost"
 marshal_task.1102.desc: "[county.GetName] je nyní dalším místem, kde [councillor.GetTitledFirstName] reorganizuje mé odvedence, a zvýšená vojenská přítomnost tam dělá divy.\n\nLapkové byli vyhnáni a pašeráci i únosci se příliš bojí, než aby pokračovali ve své činnosti."
 marshal_task.1102.a: "Moji poddaní se mohou vždy cítit v bezpečí."
 marshal_task.1102.notification: "Posílená vojenská přítomnost"
 marshal_task.1103.notification: "Odvedenci připraveni k boji"
 marshal_task.2001.t: "[Select_CString(commander.IsFemale, 'Velitelka zraněna', 'Velitel zraněn')]"
 marshal_task.2001.opening: "[commander.GetTitledFirstName] během cvičného souboje [Select_CString(commander.IsFemale, 'utrpěla', 'utrpěl')] zásah!"
 marshal_task.2001.ending: "\n\n[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], [Select_CString(councillor.IsFemale, 'dokázala', 'dokázal')] zastavit krvácení, ale nějakou dobu potrvá, než se [commander.GetFirstName] zotaví."
 marshal_task.2001.a: "Oni používali skutečné zbraně?!"
 marshal_task.2001.notification: "Bojovník zraněn při výcviku"
 marshal_task.2101.notification: "Získána vlastnost: [commander.Custom('CommanderTraitBeingTaughtNoTooltip')]"
 marshal_task.2102.notification: "Rytíř se zlepšil"
 marshal_task.2103.notification: "Výcvik v turnajových kláních"
 marshal_task.0302.notification.a: "[Select_CString(commander.IsFemale, 'Velitelka se výrazně zlepšila', 'Velitel se výrazně zlepšil')]"
 marshal_task.0302.notification.b: "[Select_CString(commander.IsFemale, 'Velitelka se zlepšila', 'Velitel se zlepšil')]"
 marshal_task.0303.notification.a: "Rytíř se výrazně zlepšil"
 marshal_task.0303.notification.c: "Rytíř se stal mistrem čepele"
 marshal_task.2002.t: "[Select_CString(commander.IsFemale, 'Velitelka těžce zraněna', 'Velitel těžce zraněn')]"
 marshal_task.2002.eye: "\n\n[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], okamžitě [Select_CString(councillor.IsFemale, 'povolala', 'povolal')] léčitele, ale zrak už zachránit nešlo."
 marshal_task.2002.leg: "\n\n[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], okamžitě [Select_CString(councillor.IsFemale, 'povolala', 'povolal')] léčitele, ale zachránit se podařilo jen život. O nohu [commander.GetTitledFirstName] [Select_CString(commander.IsFemale, 'přišla', 'přišel')]."
 marshal_task.2002.hand: "\n\n[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], okamžitě [Select_CString(councillor.IsFemale, 'povolala', 'povolal')] léčitele, ale zachránit se podařilo jen život. O paži [commander.GetTitledFirstName] [Select_CString(commander.IsFemale, 'přišla', 'přišel')]."
 marshal_task.2002.a: "Alespoň mysl zůstala nedotčena."
 marshal_task.2002.b: "Do bitvy teď [commander.GetTitledFirstName] bude muset jezdit na koni."
 marshal_task.2002.c: "Jen mi řekni, že ruka na meč zůstala!"
 marshal_task.2002.generic_title: "Bojovník zraněn při výcviku"
 marshal_task.2002.notification_eye: "[commander.GetTitledFirstName] při výcviku vedeném [councillor.GetTitledFirstName] [Select_CString(commander.IsFemale, 'přišla', 'přišel')] o oko!"
 marshal_task.2002.notification_leg: "[commander.GetTitledFirstName] při výcviku vedeném [councillor.GetTitledFirstName] [Select_CString(commander.IsFemale, 'přišla', 'přišel')] o nohu!"
 marshal_task.2002.notification_hand: "[commander.GetTitledFirstName] [Select_CString(commander.IsFemale, 'byla při výcviku zmrzačena', 'byl při výcviku zmrzačen')]! Výcvik vedl [councillor.GetTitledFirstName]."
 marshal_task.2003.t: "[Select_CString(commander.IsFemale, 'Smrt velitelky', 'Smrt velitele')]"
 marshal_task.2003.ending: "\n\n[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], okamžitě [Select_CString(councillor.IsFemale, 'povolala', 'povolal')] léčitele, ale [commander.GetFirstName] během několika okamžiků [Select_CString(commander.IsFemale, 'vykrvácela', 'vykrvácel')]."
 marshal_task.2003.a: "Pro mé vojsko je to tragická ztráta."
 marshal_task.2101.desc: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], za mnou přichází s návrhem.\n\n„Všiml jsem si, že [commander.GetTitledFirstName] má pro [commander.Custom('CommanderTraitSkillDescription')|l] podobné nadání, jaké kdysi [Select_CString(teacher.IsFemale, 'měla', 'měl')] [teacher.GetTitledFirstName]. Myslím, že by se [commander.GetFirstName] pod vedením [teacher.GetFirstName] [Select_CString(commander.IsFemale, 'mohla', 'mohl')] hodně naučit.“"
 marshal_task.2101.a: "Zařiď to."
 marshal_task.2101.b: "[commander.GetFirstNameNoTooltip] by se [Select_CString(commander.IsFemale, 'měla', 'měl')] soustředit spíše na osobní boj!"
 marshal_task.3001.t: "Místní odpor"
 marshal_task.3001.desc: "Má úcta, [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [councillor.Custom2('RelationToMe', ROOT.Char)|l],\n má snaha o reorganizaci pokračuje rychlým tempem, ale ne každý je přesvědčen o jejích výhodách.\nZdá se, že jsem šlápl na kuří oko několika starostům a vesnickým stařešinům. Vlastně všem starostům a vesnickým stařešinům."
 marshal_task.3001.a: "Co jsi to [Select_CString(councillor.IsFemale, 'provedla', 'provedl')], [councillor.GetFirstNameNoTooltip]..."
 marshal_task.3001.notification: "Ztráta přízně obyvatel"
 marshal_task.3002.desc: "Má úcta, [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [councillor.Custom2('RelationToMe', ROOT.Char)|l]...\n\nZdá se, že jsem se v několika věcech zmýlil. Reformy, které jsem zavedl, měly upevnit tvou vládu nad krajem, ale místo toho místní pomalu ani nevědí, kdo je jejich [ROOT.Char.GetTitleTierName|l]..."
 marshal_task.3002.a: "Ty jsi to #EMP ještě zhoršil[Select_CString(councillor.IsFemale, 'a', '')]?!#!"
 marshal_task.3002.notification: "[councillor.GetCouncilTitle] ztrácí kontrolu"
 marshal_task.3003.t: "Zklamání"
 marshal_task.3003.desc: "Zdravím tě, [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [baron.Custom2('RelationToMe', ROOT.Char)|l],\n musím si postěžovat na jednání [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'tvé', 'tvého')] [councillor.GetCouncilTitle|l]!\n[county.GetName] se [Select_CString(councillor.IsFemale, 'stala', 'stal')] terčem svévolných změn, které vůbec neberou ohled na naše tradice ani dávné zvyklosti!"
 marshal_task.3003.a: "Nemůžeš postupovat trochu citlivěji, [councillor.GetFirstNameNoTooltip]?"
 marshal_task.3003.notification: "Rozhořčený baron"
 marshal_task.3101.t: "Prospěch pro místní"
 marshal_task.3101.desc: "Má úcta, [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [councillor.Custom2('RelationToMe', ROOT.Char)|l],\n s potěšením oznamuji, že má reorganizace probíhá dobře.\nA zlepšení neprospívají jen tobě. [county.GetNameNoTier] má samozřejmě obyvatele věrné svému [ROOT.Char.GetTitleTierName|l], ale málokdy byli tak vděční jako nyní."
 marshal_task.3101.a: "Výborně, [councillor.GetCouncilTitle|l]!"
 marshal_task.3101.notification: "[councillor.GetCouncilTitle] získává respekt"
 marshal_task.3102.t: "Projev vděčnosti"
 marshal_task.3102.desc: "[Select_CString(ROOT.Char.IsFemale, 'Má', 'Můj')] [baron.Custom2('RelationToMe', ROOT.Char)|l],\n[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'tvá', 'tvůj')] [councillor.GetCouncilTitle|l], neúnavně pracuje na reorganizaci a její výsledky už přinášejí užitek.\nChci ti osobně poděkovat, že jsi nám [Select_CString(ROOT.Char.IsFemale, 'poslala', 'poslal')] tak schopného člověka!"
 marshal_task.3102.a: "Jen tak dál, [councillor.GetFirstNameNoTooltip]."
 marshal_task.3102.notification: "[councillor.GetCouncilTitle] působí na vazala dobrým dojmem"
 marshal_task.3103.notification: "[acclaimed_knight] pacifikuje rolníky"
 marshal_task.4002.notification: "Neorganizované stráže"
 task_manage_guards_disorganized_modifier: "$marshal_task.4002.notification$"
