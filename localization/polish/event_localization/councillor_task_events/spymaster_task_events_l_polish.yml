l_polish:
 spymaster_task.0311.t: "Odhalené tajemství"
 spymaster_task.0311.councillor_liege_opening: "Při plnění povinností, které má jako můj [councillor.GetCouncilTitle|l], [councillor.GetTitledFirstName] odhalil[Select_CString(councillor.IsFemale, 'a', '')] tajemství, které skrývá [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 spymaster_task.0311.spymaster_opening: "Při pátrání pro [Select_CString(councillor_liege.IsFemale, 'svou', 'svého')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))|l], [councillor_liege.GetTitledFirstName], jsem odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] tajemství, které skrývá [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 spymaster_task.0311.notification: "[councillor.GetCouncilTitle]: Odhalené tajemství"
 spymaster_task.0341.t: "Špionáž: Zvrhlost"
 spymaster_task.0311.secret_deviant.shared: "\n\nNemohu uvěřit, jak zvrácenými způsoby [secret_holder.GetTitledFirstName] vyhledává rozkoš. Už jen ta představa by znechutila [Select_CString(secret_holder.IsFemale, 'každou slušnou ženu', 'každého slušného muže')], a přesto je [secret_holder.GetFirstName] nejen ochotn[Select_CString(secret_holder.IsFemale, 'á', 'ý')]... ale přímo dychtiv[Select_CString(secret_holder.IsFemale, 'á', 'ý')]!"
 spymaster_task.0311.secret_deviant: "\n\nZpůsoby, jakými [secret_holder.GetTitledFirstName] vyhledává rozkoš, jsou tak odporné, že by už samotná představa znechutila [Select_CString(secret_holder.IsFemale, 'každou slušnou ženu', 'každého slušného muže')]. [secret_holder.GetFirstName] je přesto nejen ochotn[Select_CString(secret_holder.IsFemale, 'á', 'ý')], ale přímo dychtiv[Select_CString(secret_holder.IsFemale, 'á', 'ý')]! Je to tak nepřirozené a odporné. Ne — ono to #emphasis je#! nepřirozené a odporné! Taková zvrácenost se příčí všemu, co káže [ROOT.Char.GetFaith.HighGodName]!"
 spymaster_task.0341.a: "Služebníku! Přines vědro, než— #EMP *buéééé*#!"
 spymaster_task.0341.a.deviant: "Popiš to znovu. A poprosím co nejpodrobněji..."
 spymaster_task.0341.a.detached: "Naprosto odporné, ale užitečné vědět."
 spymaster_task.0342.t: "Špionáž: Sodomie"
 spymaster_task.0311.sodomy.accepted: "\n\n[secret_holder.GetTitledFirstName] si užívá intimní společnost dalších [Select_CString(secret_holder.IsFemale, 'žen', 'mužů')]. Souvěrci to považují za těžký hřích, a přestože mi to nedává valný smysl, mohlo by mi to poskytnout potřebnou páku..."
 spymaster_task.0311.secret_sodomy.illegal_shared: "\n\n[secret_holder.GetTitledFirstName] si užívá intimní společnost dalších [Select_CString(secret_holder.IsFemale, 'žen', 'mužů')]. Na rozdíl ode mě však své hříchy [Select_CString(secret_holder.IsFemale, 'nedokázala', 'nedokázal')] dost dobře skrýt."
 spymaster_task.0311.secret_sodomy.illegal: "\n\n[secret_holder.GetTitledFirstName] si užívá intimní společnost dalších [Select_CString(secret_holder.IsFemale, 'žen', 'mužů')]. Jak pošetilé je myslet si, že [ROOT.Char.GetFaith.HighGodName] takový hřích neodhalí..."
 spymaster_task.0342.a: "[Select_CString(secret_holder.IsFemale, 'Budeš litovat, že jsi podlehla svým touhám', 'Budeš litovat, že jsi podlehl svým touhám')], [secret_holder.GetFirstNameNoTooltip]."
 spymaster_task.0343.t: "Špionáž: Pokus o vraždu"
 spymaster_task.0311.secret_murder_attempt.targeting_me: "\n\n[secret_holder.GetTitledFirstName] [Select_CString(secret_holder.IsFemale, 'stála', 'stál')] za neúspěšným pokusem o můj život! Konečně nadešel čas odplaty..."
 spymaster_task.0311.secret_murder_attempt.close_to_me: "\n\nCílem neúspěšného pokusu o vraždu [Select_CString(murder_target.IsFemale, 'byla', 'byl')] [murder_target.GetTitledFirstName], [Select_CString(murder_target.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))|l], a za vším [Select_CString(secret_holder.IsFemale, 'stála', 'stál')] [secret_holder.GetTitledFirstName]! Konečně nadešel čas odplaty..."
 spymaster_task.0311.secret_murder_attempt.other: "\n\nZa neúspěšným pokusem o vraždu, jehož cílem [Select_CString(murder_target.IsFemale, 'byla', 'byl')] [murder_target.GetTitledFirstName], [Select_CString(secret_holder.IsFemale, 'stála', 'stál')] [secret_holder.GetTitledFirstName]!"
 spymaster_task.0343.a: "Že by [secret_holder.GetFirstNameNoTooltip] [Select_CString(secret_holder.IsFemale, 'klesla', 'klesl')] až tak hluboko..."
 spymaster_task.0343.murder_back: "Vidíš? Mé jednání je naprosto ospravedlnitelné."
 spymaster_task.0344.t: "Špionáž: Vražda"
 spymaster_task.0311.secret_murder.sadistic: "\n\n[murder_target.GetTitledFirstName] [Select_CString(murder_target.IsFemale, 'zemřela', 'zemřel')] předčasně a zdá se, že za tím [Select_CString(secret_holder.IsFemale, 'stála', 'stál')] [secret_holder.GetTitledFirstName]."
 spymaster_task.0311.secret_murder.callous: "\n\n[secret_holder.GetTitledFirstName] [Select_CString(secret_holder.IsFemale, 'zosnovala', 'zosnoval')] vraždu a obětí [Select_CString(murder_target.IsFemale, 'byla', 'byl')] [murder_target.GetTitledFirstName]! Na tomto světě není místo pro někoho tak slabého a zbabělého, jako je [secret_holder.GetFirstName]."
 spymaster_task.0311.secret_murder.close_to_me.vengeful: "\n\n[murder_target.GetTitledFirstName], [Select_CString(murder_target.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))|l], je [Select_CString(murder_target.IsFemale, 'mrtvá', 'mrtvý')]! Za vraždou stojí [secret_holder.GetTitledFirstName]. [Select_CString(secret_holder.IsFemale, 'Musí zaplatit vlastním životem a vším, co je jí drahé', 'Musí zaplatit vlastním životem a vším, co je mu drahé')]!"
 spymaster_task.0311.secret_murder.close_to_me: "\n\nPravda konečně vyšla najevo. [secret_holder.GetTitledFirstName] [Select_CString(secret_holder.IsFemale, 'zosnovala', 'zosnoval')] vraždu a obětí [Select_CString(murder_target.IsFemale, 'byla', 'byl')] [murder_target.GetTitledFirstName], [Select_CString(murder_target.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))|l]."
 spymaster_task.0311.secret_murder.close_to_me_regret: "Dalo se tomu zabránit, kdybych se to [Select_CString(ROOT.Char.IsFemale, 'dozvěděla', 'dozvěděl')] dřív?"
 spymaster_task.0311.secret_murder.other: "\n\n[secret_holder.GetTitledFirstName] ze stínů [Select_CString(secret_holder.IsFemale, 'zosnovala', 'zosnoval')] vraždu. Obětí [Select_CString(murder_target.IsFemale, 'byla', 'byl')] [murder_target.GetTitledFirstName]!"
 spymaster_task.0344.a.sadistic: "Hmm. Dokážu vymyslet náležitě děsivou odplatu?"
 spymaster_task.0344.a.callous: "[Select_CString(ROOT.Char.IsFemale, 'Neměla', 'Neměl')] bych nechat vzteklé psy volně pobíhat."
 spymaster_task.0344.a: "[Select_CString(secret_holder.IsFemale, 'Nejen krutá a bezcitná, ale i nečestná!', 'Nejen krutý a bezcitný, ale i nečestný!')]"
 spymaster_task.0344.b: "Mé jednání je naprosto ospravedlnitelné. Nikdo mě nemůže soudit."
 spymaster_task.0345.t: "Špionáž: Kanibalismus"
 spymaster_task.0311.secret_cannibal.shared: "\n\n[secret_holder.GetTitledFirstName] si zjevně umí vychutnat ty lepší stránky života. Třeba [ROOT.Char.Custom('RegionalDrink')|l] v poháru a sousto rudého, křehkého masa."
 spymaster_task.0311.secret_cannibal: "\n\nZe všech možných odporností [secret_holder.GetTitledFirstName] zahání hlad zrovna lidským masem! Může být něco odpornějšího a šílenějšího?!"
 spymaster_task.0345.a.cannibal: "Doufám, že mě [secret_holder.GetTitledFirstName] brzy pozve na hostinu."
 spymaster_task.0345.a: "Ó, odporné lidstvo, copak mě nikdy nepřestaneš znechucovat?"
 spymaster_task.0346.t: "Špionáž: Milenci"
 spymaster_task.0311.secret_lover.consort: "\n\n[lover.Custom2('MyCharacterIntroduction', ROOT.Char)|U] a [Select_CString(secret_holder.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))|l] spolu mají poměr!"
 spymaster_task.0311.secret_lover.consort_is_lover: "\n\n[secret_holder.GetTitledFirstName] a [lover.GetTitledFirstName], [Select_CString(lover.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))|l], spolu mají poměr!"
 spymaster_task.0311.secret_lover.lover_close_to_me: "\n\n[secret_holder.GetTitledFirstName] a [lover.GetTitledFirstName], [Select_CString(lover.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))|l], spolu mají poměr. Kdo ví, jak k tomu došlo, ale jaká hanba by na oba padla, kdyby se to provalilo!"
 spymaster_task.0311.secret_lover.lustful: "\n\n[secret_holder.GetTitledFirstName] a [lover.GetTitledFirstName] se spolu oddávají tělesným rozkoším. [secret_holder.GetFirstName] přejíždí rukama po [Select_CString(lover.IsFemale, 'jejím', 'jeho')] těle, jejich rty se všemožně proplétají... Jaký skandál by vypukl, kdyby se to dostalo na veřejnost!"
 spymaster_task.0311.secret_lover: "\n\n[secret_holder.GetTitledFirstName] a [lover.Custom2('MyCharacterIntroduction', ROOT.Char)|l] spolu tajně navázali milostný poměr."
 spymaster_task.0346.a.consort: "Taková nehoráznost!"
 spymaster_task.0346.a.close: "Tohle bude ještě komplikované."
 spymaster_task.0346.a: "Tohle se může hodit..."
 spymaster_task.0347.t: "Špionáž: Nevěrectví"
 spymaster_task.0311.secret_non_believer.shared: "\n\nStejně jako já má i [secret_holder.GetTitledFirstName] pochybnosti o své oddanosti. [ROOT.Char.GetFaith.HighGodName] v [Select_CString(secret_holder.IsFemale, 'jejích', 'jeho')] očích zřejmě není tak nezpochybnitelný, jak by měl být. Na rozdíl ode mě však [secret_holder.GetFirstName] své pochybnosti neumí dost dobře skrývat."
 spymaster_task.0311.secret_non_believer.other_faith: "\n\nZdá se, že [secret_holder.GetTitledFirstName] začíná prohlížet falešnost boha, kterým je [secret_holder.GetFaith.HighGodName]. Ostatní [secret_holder.GetFaith.GetAdherentNamePlural] však nejspíš nebudou tak chápaví jako já."
 spymaster_task.0311.secret_non_believer.other_sect: "\n\nZdá se, že [secret_holder.GetTitledFirstName] začíná opouštět učení, které vyznává [ROOT.Char.GetFaith.GetName], a místo něj přijímá pomýlené nauky, které hlásají [secret_holder.GetFaith.GetAdherentNamePlural]. [secret_holder.GetFaith.HighGodName] musí při pohledu na takové překrucování vlastního učení plakat."
 spymaster_task.0311.secret_non_believer: "\n\n[secret_holder.GetTitledFirstName] podle všeho pochybuje o učení, které vyznává [secret_holder.GetFaith.GetName]. Ach, [secret_holder.GetFirstNameNoTooltip]... Co by na to řekli [secret_holder.GetFaith.AltPriestTermPlural]?"
 spymaster_task.0347.a: "Známka slabé duše."
 spymaster_task.0348.t: "Špionáž: Incest"
 spymaster_task.0311.secret_incest: "\n\n[secret_holder.GetTitledFirstName] [Select_CString(secret_holder.IsFemale, 'spáchala', 'spáchal')] jeden z nejohavnějších hříchů. [ROOT.Char.GetFaith.HighGodName] by takový čin jistě odsoudil! Jen skutečně chorá mysl se může oddávat tělesným vztahům s blízkými příbuznými."
 spymaster_task.0311.secret_incest.shared: "\n\nMně je samozřejmě jasné, že láska nezná hranic, ale svět by na způsob, jakým [secret_holder.GetFirstNameNoTooltip] [Select_CString(secret_holder.IsFemale, 'podlehla', 'podlehl')] své touze, reagoval zděšením a odsouzením..."
 spymaster_task.0348.a.shared: "Tak to prostě musí být."
 spymaster_task.0348.a.lustful: "S vlastní rodinou...? Ach, na to bych ani [Select_CString(ROOT.Char.IsFemale, 'neměla', 'neměl')] myslet. #EMP Neměl[Select_CString(ROOT.Char.IsFemale, 'a', '')]#!..."
 spymaster_task.0348.a: "Takové bezbožné spojení musím odsoudit!"
 spymaster_task.0349.t: "Špionáž: Čarodějnictví"
 spymaster_task.0311.secret_witch.shared: "\n\nZdá se, že i [secret_holder.GetTitledFirstName] hledá odpovědi za hranicemi tohoto světa. Ach, co všechno už asi [Select_CString(secret_holder.IsFemale, 'viděla', 'viděl')]... Kéž bychom mohli o svých znalostech mluvit otevřeně."
 spymaster_task.0311.secret_witch.zealous: "\n\nExistují důkazy, že se [secret_holder.GetTitledFirstName] účastní tajných obřadů, jistě proto, aby rozmlouval[Select_CString(secret_holder.IsFemale, 'a', '')] se zlými duchy! Nepochybně dokonce [Select_CString(secret_holder.IsFemale, 'tančí', 'tančí')] nah[Select_CString(secret_holder.IsFemale, 'á', 'ý')] se svůdnými démony, zatímco třpytivé světlo plamenů laská jejich těla a oni..."
 spymaster_task.0311.secret_witch.zealous_end: "Jak odporná představa!"
 spymaster_task.0311.secret_witch: "\n\nExistují důkazy, že se [secret_holder.GetTitledFirstName] účastní tajných obřadů. K čemu jinému by mohly sloužit než k rozmluvám se zlými duchy, nebo snad dokonce k paktování s démony?!"
 spymaster_task.0349.a.zealous: "Nesmím se nechat svést představami nadpozemské krásy!"
 spymaster_task.0349.a: "Jaké zlo asi [secret_holder.GetTitledFirstName] plánuje?"
 spymaster_task.0350.t: "Špionáž: Bastard"
 spymaster_task.0311.secret_bastard.i_am_real_father: "\n\n[Select_CString(bastard.IsFemale, 'Nejenže je', 'Nejenže je')] [bastard.GetTitledFirstName] ve skutečnosti [Select_CString(bastard.IsFemale, 'bastardkou', 'bastardem')], ale... jejím skutečným otcem jsem já!"
 spymaster_task.0311.secret_bastard.i_am_not_father: "\n\n[bastard.GetTitledFirstName] není mé skutečné dítě. Je to [bastard.Custom('DaughterSon')|l], [Select_CString(secret_holder.IsFemale, 'kterou zplodila', 'kterého zplodil')] [secret_holder.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 spymaster_task.0311.secret_bastard.i_am_not_real_father: "\n\n[bastard.GetTitledFirstName] není mé skutečné dítě. Je to [bastard.Custom('DaughterSon')|l], jehož skutečným otcem je [actual_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 spymaster_task.0311.secret_bastard.father_is_interesting: "\n\n[bastard.GetTitledFirstName] je ve skutečnosti nemanželské dítě. Matkou je [mother.GetTitledFirstName] a otcem [actual_father.GetTitledFirstName], [Select_CString(actual_father.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actual_father'))|l]!"
 spymaster_task.0311.secret_bastard: "\n\n[bastard.GetTitledFirstName] je ve skutečnosti nemanželské dítě. Matkou je [mother.GetTitledFirstName] a otcem [actual_father.GetTitledFirstName]!"
 spymaster_task.0350.a.related: "Jak jsi to přede mnou [Select_CString(mother.IsFemale, 'mohla', 'mohl')] tajit, [mother.GetFirstNameNoTooltip]?"
 spymaster_task.0350.a: "Neuvěřitelné!"
 spymaster_task.0353.t: "Špionáž: Tajná víra ([secret_holder.GetSecretFaith.GetAdherentNameNoTooltip])"
 spymaster_task.0311.secret_crypto_religionist.cynical_uncompassionate: "\n\nTakže [secret_holder.GetTitledFirstName] stále tajně vyznává [secret_holder.GetSecretFaith.GetName]. Jak pošetilé lpět na vlastní modle i tváří v tvář smrti! Copak se takoví hlupáci nikdy nepoučí?"
 spymaster_task.0311.secret_crypto_religionist.cynical_compassionate: "\n\nZdá se, že [secret_holder.GetTitledFirstName] stále tajně vyznává [secret_holder.GetSecretFaith.GetName]. Jak zvláštní, že někdo tak pevně lpí na jedné víře místo druhé. Copak [secret_holder.GetFirstName] nevidí, jaké nebezpečí tím [Select_CString(secret_holder.IsFemale, 'sama sobě', 'sám sobě')] způsobuje?"
 spymaster_task.0311.secret_crypto_religionist.shared_secret: "\n\nZdá se, že [secret_holder.GetTitledFirstName] musí svou oddanost víře [secret_holder.GetSecretFaith.GetName] skrývat před světem, stejně jako já skrývám [root_crypto_faith.GetName]. Proč však [Select_CString(secret_holder.IsFemale, 'riskuje', 'riskuje')] kvůli své falešné víře, zůstává záhadou."
 spymaster_task.0311.secret_crypto_religionist.shared_faith: "\n\nZdá se tedy, že [secret_holder.GetTitledFirstName] je stejně jako já [ROOT.Char.GetFaith.GetAdherentName|l], ale bezbožn[Select_CString(secret_holder.IsFemale, 'á', 'ý')], protože svou víru skrývá ve stínech. Co by na takový nedostatek víry řekl [ROOT.Char.GetFaith.HighGodName]?"
 spymaster_task.0311.secret_crypto_religionist.shared_faith_taqiya: "\n\nZdá se tedy, že [secret_holder.GetTitledFirstName] je stejně jako já [root_crypto_faith.GetAdherentName|l]. Na tajném praktikování není nic špatného, ale budou si totéž myslet i [secret_holder.GetFaith.GetAdherentNamePlural]?"
 spymaster_task.0311.secret_crypto_religionist.shared_faith_shared_secret: "\n\nZdá se tedy, že oba musíme [secret_holder.GetSecretFaith.GetName] vyznávat ve skrytu. Co si s touto informací počít?"
 spymaster_task.0311.secret_crypto_religionist: "\n\nZa denního světla je [secret_holder.GetTitledFirstName] [secret_holder.GetFaith.GetAdherentName|l], ale po setmění šeptem vyznává [secret_holder.GetSecretFaith.GetName]. Ach, co všechno bych s touto informací mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] udělat..."
 spymaster_task.0353.a.shared_faith_shared_secret: "Naše řady rostou."
 spymaster_task.0353.a.cynical: "[Select_CString(secret_holder.IsFemale, 'Její', 'Jeho')] pošetilost je mým ziskem."
 spymaster_task.0353.a: "[secret_holder.GetFaith.AltPriestTermPlural|U] tohle neodpustí."
 spymaster_task.0359.t: "Špionáž: Objev"
 spymaster_task.0359.a: "Velmi zajímavé..."
 spymaster_task.0381.opening: "[councillor.Custom2('AppropriateGreetingPositive', SCOPE.sC('councillor_liege'))]"
 spymaster_task.0381.desc_your_court: "Při své práci se mi nepodařilo odhalit žádné tajemství. [character_to_hook.Custom2('YourCharacterIntroduction', target_character)|U] podle všeho žádné nemá."
 spymaster_task.0381.desc_other_court: "Při vyšetřování [target_character.GetTitledFirstName] se [character_to_hook.Custom2('HerHisCharacterIntroduction', target_character)|l] jeví jako nejpravděpodobnější osoba, která by mohla skrývat temnou pravdu. Bohužel ať pátrám sebevíc, [character_to_hook.GetTitleAsNameNoTooltip|l] podle všeho nic neskrývá."
 spymaster_task.0381.desc: "\n\nPravda však nemusí stát v cestě úkolu, který přede mnou stojí. Dalo by se zařídit, aby [character_to_hook.GetFirstNameNoTooltip] najednou nějaké tajemství [Select_CString(character_to_hook.IsFemale, 'měla', 'měl')], a kdyby vyšlo najevo, zaručeně by [Select_CString(character_to_hook.IsFemale, 'ji', 'ho')] zničilo."
 spymaster_task.0381.a: "Zařiď to."
 spymaster_task.0381.a.truth_is_relative_unlock: "Tato možnost je dostupná díky perku [GetPerk('truth_is_relative_perk').GetName(GetPlayer)]"
 spymaster_task.0381.b: "Místo toho se přece můžeme spřátelit."
 spymaster_task.0381.b.flavor: "Pokud ovšem [character_to_hook.GetFirstNameNoTooltip] ví, jak snadno jsme mohli stát na opačných stranách"
 spymaster_task.0399.opening: "[councillor.Custom2('AppropriateGreeting', SCOPE.sC('councillor_liege'))]"
 spymaster_task.0399.desc: "Navzdory veškerému úsilí se mým lidem dosud nepodařilo odhalit žádná tajemství"
 spymaster_task.0399.home_court: "zde u dvora."
 spymaster_task.0399.other_court: "u dvora, kterému vládne [target_character.GetTitledFirstName]."
 spymaster_task.0399.nothing_to_find: "\n\nAni nevěřím, že tu vůbec někdy něco najdeme. Děje se tu toho méně než v poledne na hřbitově."
 spymaster_task.0399.something_here: "\n\nStále však věřím, že se ve stínech něco děje. Potřebuji jen trochu více času, abych zjistil[Select_CString(councillor.IsFemale, 'a', '')], co to je."
 spymaster_task.0399.a.recommended: "Dobrá, víš to nejlépe."
 spymaster_task.0399.a.counter: "Ne, už neztrácejme další čas."
 spymaster_task.0399.a.tt: "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] přechází k úkolu [GetCouncilTaskType('task_disrupt_schemes').GetName|V]"
 spymaster_task.0399.b.recommended: "Jestli tam #EMP něco#! je, najdeme to."
 spymaster_task.0399.b.counter: "Tím bych si nebyl[Select_CString(ROOT.Char.IsFemale, 'a', '')] tak jist[Select_CString(ROOT.Char.IsFemale, 'á', 'ý')]. Pokračuj!"
 spymaster_task.0399.b.tt: "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] pokračuje v úkolu [GetCouncilTaskType('task_find_secrets').GetName|V]"
 spymaster_task.1001.t: "„Nehoda“"
 spymaster_task.1001.desc: "Omluva, se kterou přichází [councillor.GetTitledFirstName], #EMP zní#! upřímně, ale ta chyba je skoro příliš absurdní na to, aby byla skutečná.\n\n„Víš, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ vysvětluje [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], „šlo jednoduše o to, že nesprávný dopis dostal nesprávný posel.“ [councillor.GetTitledFirstName] zadrží dech. „A tak se ty usvědčující dokumenty ztratily.“"
 spymaster_task.1001.a: "Ty jsi ale [councillor.Custom2('InsultNoun', ROOT.Char)|l]!"
 spymaster_task.1001.b: "Každý někdy udělá chybu, [councillor.GetFirstNameNoTooltip]."
 spymaster_task.1001.a.tt: "Někdo ve tvém panství odhalil jedno z tvých [Concept('secrets','tajemství')|E].\n\n"
 spymaster.1001.notification: "Ztraceny tajné dokumenty"
 spymaster_task.1002.greeting: "Komukoli, koho se to týká..."
 spymaster_task.1002.desc: "Přikládám usvědčující dokumenty. Znovu zdůrazňuji, že o tom nesmíš s nikým mluvit. Ani můj lenní pán [councillor_liege.GetTitledFirstName] neví, že existují, a tak to musí zůstat."
 spymaster_task.1002.a: "Nemyslím si, že tohle bylo určeno mně..."
 spymaster_task.1002.a.tt: "#F ...ale kdo by odmítl dar od [councillor.GetCouncilTitle|l]?#!"
 spymaster_task.1003.a.tt: "Někdo ve tvém panství odhalil jedno z [Concept('secrets','tajemství')|E], která skrývá [courtier.GetTitledFirstNameNoTooltip].\n\n"
 spymaster_task.1003.notification: "Ztracen tajný dopis"
 spymaster_task.1101.desc_opening: "Odhalil[Select_CString(councillor.IsFemale, 'a', '')] jsem zákeřnou intriku, za kterou stojí [owner.GetTitledFirstName]"
 spymaster_task.1101.murder: "a jejímž cílem je tvá vražda!"
 spymaster_task.1101.abduct: "a jejímž cílem je tvůj únos!"
 spymaster_task.1101.spy_on: "a jejímž cílem je odhalit všechna tvá tajemství!"
 spymaster_task.1101.fallback: "a která je namířena proti tobě!"
 spymaster_task.1101.ending: "\n\n[Select_CString(owner.IsFemale, 'Její', 'Jeho')] spolčenci jsou právě zatýkáni. Plány [owner.GetFirstName] jsme prozatím zmařili, ale hrozba tím nezmizela.\nPokud ovšem nezakročíme..."
 spymaster_task.1101.a: "Možná pro nás oba není na tomto světě dost místa."
 spymaster_task.1101.exposure_tt: "Intrika byla odhalena"
 spymaster_task.2001.t: "Prázdná obvinění"
 spymaster_task.2001.desc: "[accused_priest.GetFirstName], [ROOT.Char.Custom('DefaultPriestTitle')|l], [Select_CString(accused_priest.IsFemale, 'byla předvedena', 'byl předveden')] kvůli odhalení a soudu nad velkým spiknutím. Stál za tím [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|l]. Když se však [accused_priest.GetFirstName] [Select_CString(accused_priest.IsFemale, 'odmítla', 'odmítl')] přiznat, [councillor.GetTitledFirstName] neměl[Select_CString(councillor.IsFemale, 'a', '')] jediný důkaz, kterým by svá obvinění [Select_CString(councillor.IsFemale, 'podložila', 'podložil')]."
 spymaster_task.2001.a: "Přestaň mě ztrapňovat, [councillor.GetFirstNameNoTooltip]."
 spymaster_task.2001.b: "[ROOT.Char.Custom('DefaultPriestTitle')|U] [accused_priest.GetFirstNameNoTooltip] přece musí být #EMP něčím#! [Select_CString(accused_priest.IsFemale, 'vinna', 'vinen')]."
 spymaster_task.2001.c: "Přidej se k mému dvoru, [accused_priest.GetFirstNameNoTooltip]."
 spymaster_task.2002.notification: "Pověst úskočnosti"
 spymaster_task.2003.t: "Rozpadající se intrika"
 spymaster_task.2003.desc: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], ke mně u dvora přistupuje nezvykle formálně. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], napadlo tě někdy, že osnovat intriky ve stínech nemusí být nejlepší způsob, jak získat to, co chceš?“ Taková slova mě překvapí, ale [councillor.GetTitledFirstName] se nakonec dostane k věci.\n\n„Zdá se, že... no, [scheme.GetName] má jeden problém. Všichni spolčenci přestali odpovídat na mou korespondenci. Jako by se vůbec nic nestalo.“"
 spymaster_task.2003.a: "Ty ses v tom úplně [Select_CString(councillor.IsFemale, 'ztratila', 'ztratil')]?"
 spymaster_task.2102.t: "Skryté vědomosti"
 spymaster_task.2102.desc: "Udržovat jménem [councillor_liege.GetTitledFirstName] špionážní síť po celém panství má své výhody. Často narazím na něco, co jsem vůbec nehledal[Select_CString(councillor.IsFemale, 'a', '')]. Třeba na důkazy o tajemství, které skrývá [secret_owner.GetTitledFirstName]..."
 spymaster_task.2102.a: "Tohle by [councillor_liege.GetFirstNameNoTooltip] určitě chtěl[Select_CString(councillor_liege.IsFemale, 'a', '')] vědět."
 spymaster_task.2102.b: "Ta stará pověst? [councillor_liege.GetTitleTierName|U] by o ní asi chtěl[Select_CString(councillor_liege.IsFemale, 'a', '')] slyšet."
 spymaster_task.2102.c: "Není třeba se o to dělit."
 spymaster_task.2102.c.tt: "Musíš si dávat pozor na to, co si tvůj lenní pán může myslet, že před ním skrýváš"
 spymaster_task.2103.notification: "[councillor.GetCouncilTitle|U] odhaluje tajemství"
 spymaster_task.3001.opening: "[target_character.Custom2('AppropriateGreeting', ROOT.Char)]"
 spymaster_task.3001.desc: "Je bolestně zřejmé, že [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'tvá', 'tvůj')] [councillor.GetCouncilTitle|l], nasadil[Select_CString(councillor.IsFemale, 'a', '')] u mého dvora špehy. Nevím, co hledají, protože já ani moji služebníci nemáme co skrývat, ale prosím tě, přiměj je, ať toho nechají."
 spymaster_task.3001.a: "To se ti jen zdá!"
 spymaster_task.3001.continue_snooping: "[councillor.GetFirstNameNoTooltip] pokračuje ve slídivém pátrání"
 spymaster_task.3001.b: "Nešťastné nedorozumění. Okamžitě to skončí."
 spymaster_task.3002.t: "Spolčenci u dvora"
 spymaster_task.3002.opening: "U dvora se šeptem předávají tajné zprávy a je zřejmé, že spolčenci, které vyslal[Select_CString(councillor_liege.IsFemale, 'a', '')] [Select_CString(councillor_liege.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))|l], pátrají po tajemstvích."
 spymaster_task.3002.end: "Když jsem však [councillor_liege.GetTitledFirstName] kvůli tomu [Select_CString(ROOT.Char.IsFemale, 'oslovila', 'oslovil')], všechno [Select_CString(councillor_liege.IsFemale, 'popřela', 'popřel')]!"
 spymaster_task.3002.a: "Co asi [councillor_liege.GetTitledFirstName] chystá?"
 spymaster_task.3003.end: "Naštěstí [councillor_liege.GetTitledFirstName] [Select_CString(councillor_liege.IsFemale, 'slíbila', 'slíbil')], že [Select_CString(councillor.IsFemale, 'její', 'jeho')] [councillor.GetCouncilTitle|l] se svými machinacemi okamžitě přestane."
 spymaster_task.3003.a: "Ale proč tu vůbec byli?"
 spymaster_task.3004.desc: "Snad sis nemyslel[Select_CString(ROOT.Char.IsFemale, 'a', '')], že si u mého dvora nikdo navždy nevšimne spolčenců, které zaměstnává [Select_CString(councillor.IsFemale, 'tvá', 'tvůj')] [councillor.GetCouncilTitle|l]? Žádám, abys s tímto vzpurným jednáním okamžitě přestal[Select_CString(ROOT.Char.IsFemale, 'a', '')]!"
 spymaster_task.3004.a: "To se ti musí jen zdát..."
 spymaster_task.3004.b: "Pouhá chyba, můj lenní pane, nic víc!"
 spymaster_task.3005.opening: "U svého dvora jsem odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] spolčence, kteří očividně slouží [councillor_liege.GetTitledFirstName], [Select_CString(councillor_liege.IsFemale, 'mé', 'mému')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor_liege'))|l]!"
 spymaster_task.3005.end: "\n\nKdyž jsem však požadoval[Select_CString(ROOT.Char.IsFemale, 'a', '')] jejich stažení, [councillor_liege.GetTitleTierName|l] všechno [Select_CString(councillor_liege.IsFemale, 'popřela', 'popřel')]!"
 spymaster_task.3005.a: "Ten drzý ničema!"
 spymaster_task.3006.end: "\n\nKdyž jsem požadoval[Select_CString(ROOT.Char.IsFemale, 'a', '')] jejich stažení, [councillor_liege.GetTitleTierName|l] nakonec [Select_CString(councillor_liege.IsFemale, 'ustoupila', 'ustoupil')], ale raději zůstanu ve střehu..."
 spymaster_task.3006.a: "Temný šepot předchází temným činům."
 spymaster_task.3007.desc: "Můj dvůr už nějakou dobu sužují špehové pátrající po tajemstvích. A představ si mé překvapení, když jsem zjistil[Select_CString(ROOT.Char.IsFemale, 'a', '')], že slouží [Select_CString(councillor.IsFemale, 'tvé', 'tvému')] [councillor.GetCouncilTitle|l]! Prosím, okamžitě téhle frašce učiníš přítrž!"
 spymaster_task.3007.a: "O žádných špehech nic nevím, [target_character.GetFirstNameNoTooltip]."
 spymaster_task.3007.b: "Ach, nejspíš se cestou domů ztratili!"
 spymaster_task.3009.end: "Když jsem požadoval[Select_CString(ROOT.Char.IsFemale, 'a', '')] jejich stažení, [councillor_liege.GetTitleTierName|l] nakonec [Select_CString(councillor_liege.IsFemale, 'ustoupila', 'ustoupil')], ale raději zůstanu ve střehu..."
