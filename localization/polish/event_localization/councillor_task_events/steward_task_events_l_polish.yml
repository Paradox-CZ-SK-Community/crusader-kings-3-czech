l_polish:
 steward_task.0001.t: "De iure hrabství přesvědčeno"
 steward_task.0001.desc: "Dnes ke mně dorazily závažné zprávy. Obyvatelé v [county.GetNameNoTier] se znovu hlásí ke svému právoplatnému domovu, kterým je mnohem vznešenější a prestižnější [councillor_liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!\n\nOkouzleni libozvučnými sliby [councillor.GetTitledFirstName] a nádherou dvora, jemuž vládne [councillor_liege.GetTitledFirstName], teď očekávají, že hrabství jednoduše odevzdám [Select_CString(councillor_liege.IsFemale, 'své vlezlé sousedce', 'svému vlezlému sousedovi')]!\n\nMusím si dobře rozmyslet, co udělám. Přijít o půdu není nikdy příjemné, ale pokud je nenechám odejít, místní se mnou budou krajně nespokojeni."
 steward_task.0001.a: "Nemám na vybranou. Ustoupím."
 steward_task.0001.b: "To je nehoráznost! Nedovolím to!"
 steward_task.0001.liege_changed: "Předáno de iure lennímu pánovi"
 steward_task.0001.liege_changed.tt: "Tvůj lenní pán [ROOT.Char.GetTitledFirstName] ustoupil protestům tvých poddaných. [county.GetNameNoTooltip] nyní patří svému de iure vládci a tvým novým lenním pánem je [councillor_liege.GetTitledFirstName]."
 steward_task.0001.county_loss.tt: "Tvůj lenní pán [ROOT.Char.GetTitledFirstName] ustoupil protestům tvých poddaných. [county.GetNameNoTooltip] nyní patří svému de iure vládci [councillor_liege.GetTitledFirstName]. Hrabství už neovládáš!"
 steward_task.0002.t: "De iure hrabství předáno!"
 steward_task.0002.desc: "Zdá se, že úsilí, které [councillor.GetCouncilTitle|l] vyvíjí v [county.GetName], konečně přineslo ovoce!\n\nMístní přesvědčila výřečnost, s níž [councillor.GetTitledFirstName] promlouvá, i prestiž mého dvora. Tváří v tvář nespokojenosti celého hrabství [previous_owner.GetTitledFirstName] nakonec ustupuje a hrabství přenechává.\n\nHrabství nyní patří svému de iure lennímu pánovi, tedy mně!"
 steward_task.0002.a: "Výborně, [councillor.GetFirstNameNoTooltip]!"
 steward_task.0003.t: "Přesvědčování de iure území selhalo!"
 steward_task.0003.desc: "Zdá se, že úsilí, které [councillor.GetCouncilTitle|l] vyvíjí v [county.GetName], bylo marné.\n\nMístní přesvědčila výřečnost, s níž [councillor.GetTitledFirstName] promlouvá, i prestiž mého dvora. Hlasitě protestovali proti nelegitimní vládě, ale marně. [previous_owner.GetTitledFirstName] jejich odpor nepřiměl ustoupit.\n\nNespokojenost místních nám sice může usnadnit případné dobytí hrabství, ale můj diplomatický plán byl zmařen. Prozatím."
 steward_task.0003.a: "Proklínám tě, [previous_owner.GetFirstNameNoTooltip]!"
 steward_task.1101.t: "Lepší výběr daní"
 steward_task.1101.desc: "Když [Select_CString(councillor.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))|l] vypočítává jedno léno za druhým, jejich hodnotu a odvedené dávky, zarazím [Select_CString(councillor.IsFemale, 'ji', 'ho')], jakmile zaslechnu částku, která #EMP musí#! být omyl.\n„KOLIK že jsi [Select_CString(councillor.IsFemale, 'vybrala', 'vybral')] v [county.GetName]?!“\n\n[councillor.GetFirstName] se usměje. „[Select_CString(councillor.IsFemale, 'Myslela', 'Myslel')] jsem, že tě to potěší, [ROOT.Char.Custom('FormOfAddressForLiege')|l].“"
 steward_task.1101.a: "[ROOT.Char.GetFaith.WealthGodName] mi přeje! Samozřejmě že mám radost!"
 steward_task.1101.b: "Haha! Výplata!"
 steward_task.1101.notification: "Dodatečné daně"
 steward_task.1001.t: "Ulehčují si vlastní břemeno"
 steward_task.1001.opening: "Zdá se, že snaha, kterou [councillor.GetCouncilTitle|l] věnuje zlepšení výběru daní, měla několik neblahých vedlejších účinků."
 steward_task.1001.end: "\n\n[county.GetName] sužují lapkové, kteří tvrdí, že kvůli novým daním mohou své rodiny uživit jedině loupežemi."
 steward_task.1001.a: "Dříve či později budou žrát ocel!"
 steward_task.1001.notification: "Přemrštěné daně vedou k banditismu"
 steward_task.1002.end: "\n\nJakmile přijde [councillor.GetTitledFirstName] nebo některý z mých dalších odhadců, lidé v [county.GetName] před nimi začínají ukrývat členy rodiny i hospodářská zvířata!"
 steward_task.1002.a: "Když o nich nevíme, nemůžeme je zdanit, [councillor.GetFirstNameNoTooltip]!"
 steward_task.1002.notification: "Nepoužitelné sčítání"
 steward_task.1003.end: "\n\nPo zavedení nových poplatků stále více lidí v [county.GetName] odmítá svěřovat řešení sporů mým rozhodčím!"
 steward_task.1003.a: "Ztrácíš nad tím kontrolu, [councillor.GetFirstNameNoTooltip]?"
 steward_task.1003.notification: "Žádní šerifové nejmenováni"
 steward_task.1004.end: "\n\nPo zavedení nových cel v [county.GetName] se stále více lidí místo poctivého obchodu obrací k pašeráctví!"
 steward_task.1004.a: "Vždyť to jde prakticky přímo z mé kapsy!"
 steward_task.1004.notification: "Přemrštěná cla"
 steward_task.1005.t: "Dvojí zdanění"
 steward_task.1005.desc: "„To je nehoráznost!“ [steward.GetCouncilTitle|U] [steward.GetTitledFirstName] vtrhne do poradní síně. V patách [Select_CString(steward.IsFemale, 'jí', 'mu')] jde [tax_collector.GetTitledFirstName]. „Nejdřív mám vybírat vlastní daně, a pak je [tax_collector.GetTitledFirstNameNoTooltip] vybere ještě jednou? Musíš [Select_CString(tax_collector.IsFemale, 'jí', 'mu')] říct, ať se drží dál od mých zemí.“\n\n„[steward.GetTitledFirstNameNoTooltip] [Select_CString(steward.IsFemale, 'udělala', 'udělal')]... účetní chybu,“ vloží se do hovoru [tax_collector.GetTitledFirstNameNoTooltip]. „Pouze jsem ji [Select_CString(tax_collector.IsFemale, 'napravila', 'napravil')] tím, že jsem [Select_CString(tax_collector.IsFemale, 'vybrala', 'vybral')] rozdíl. Nic víc.“\n\n[steward.GetTitledFirstNameNoTooltip] odpoví jen vražedným pohledem."
 steward_task.1005.a: "Podívám se na ty účetní knihy trochu důkladněji..."
 steward_task.1005.a_success: "Zefektivníš systém výběru daní v panství"
 steward_task.1005.a_failure: "V účetnictví, které vede [tax_collector.GetTitledFirstNamePossessiveNoTooltip], nenajdeš žádnou chybu"
 steward_task.1005.b: "[tax_collector.GetTitledFirstNameNoTooltip] dostane volnou ruku při výběru daní v panství."
 steward_task.1005.c: "[steward.GetTitledFirstNameNoTooltip] dostane volnou ruku ve vlastní doméně."
 steward_task.2001.t: "Nedostatek dělníků"
 steward_task.2001.desc: "Sedláci si stěžují, že [councillor.GetTitledFirstName] zasahuje do dění v [county.GetName]! Protože [councillor.GetTitledFirstName] stahuje dělníky z celého [county.GetTitleTierName] na jediný úkol, ostatní již zahájené stavby se jen málokdy podaří dokončit."
 steward_task.2001.a: "Kvůli tomuto úkolu nemůžeš obětovat všechno, [councillor.GetFirstNameNoTooltip]!"
 steward_task.2001.notification: "Špatně řízený rozvoj"
 steward_task.2002.desc: "Vím, že jako [Select_CString(ROOT.Char.IsFemale, 'má drahá', 'můj drahý')] [councillor.Custom2('RelationToMe', ROOT.Char)|l] pochopíš, co ti teď napíšu.\nMá snaha pomoci v [county.GetName] a podpořit další rozvoj tamní země se setkala se značnou nevolí. Vlastně by se dalo říct, že sedláci volají po mé „hlavě na kůlu“, jak se říká. Část jejich hněvu se zřejmě obrací i proti tobě, přestože je všechen naprosto neopodstatněný."
 steward_task.2002.a: "[councillor.GetFirstNameNoTooltip]! Co jsi to [Select_CString(councillor.IsFemale, 'provedla', 'provedl')]?!"
 steward_task.2002.notification: "Špatná správa obyvatelstva"
 steward_task.2003.t: "Ztráta kontroly"
 steward_task.2003.desc: "Navzdory veškerému úsilí, které [councillor.GetTitledFirstName] věnuje zakládání nových lén, se situace začíná vymykat kontrole. [county.GetName] zažívá tak rozsáhlé přesuny obyvatelstva, že už ani [councillor.GetTitledFirstName] zřejmě neví, kde je půda osídlená a kde se teprve plánuje její vymýcení. Vlastně to podle všeho neví vůbec nikdo!"
 steward_task.2003.a: "Dostaň situaci pod kontrolu, [councillor.GetFirstNameNoTooltip]!"
 steward_task.2003.notification: "Ztráta kontroly"
 steward_task.2005.t: "Rodící se zisky"
 steward_task.2005.desc: "Právě se soustředím na nařízení svého lenního pána [liege.GetTitledFirstName] rozvíjet [county.GetName], když ke mně přichází [tax_collector.GetTitledFirstName], [Select_CString(tax_collector.IsFemale, 'která', 'který')] [liege.GetTitledFirstName] slouží jako $clan_tax_collector_court_position$. Přináší tlustou účetní knihu a další sluha ji musí nést.\n\n„[county.GetName] se rozrůstá,“ vysvětluje [tax_collector.GetTitledFirstName], „takže je jen spravedlivé, aby rostly i tamní daně. Několik nocí jsem [Select_CString(tax_collector.IsFemale, 'strávila', 'strávil')] výpočtem spravedlivé částky. V této knize si ji můžeš [Select_CString(ROOT.Char.IsFemale, 'sama', 'sám')] ověřit...“\n\nSluha se přibelhá blíž a pod tíhou knihy se mu podlamují kolena."
 steward_task.2005.a: "Pak vyberme daně, které nám právem náleží."
 steward_task.2005.a.tt: "Myslím, že [liege.GetTitledFirstNameNoTooltip] dává přednost penězům a okamžitému krátkodobému zisku."
 steward_task.2005.b: "Ne, [county.GetNameNoTierNoTooltip] se musí především rozvíjet."
 steward_task.2005.b.tt: "Myslím, že [liege.GetTitledFirstNameNoTooltip] dává přednost dlouhodobému prospěchu a po zlatě netouží."
 steward_task.2005.c: "[liege.GetTitledFirstNameNoTooltip] by [Select_CString(liege.IsFemale, 'měla rozhodnout sama', 'měl rozhodnout sám')]."
 steward_task.2005.c.tt: "[liege.GetTitledFirstNameNoTooltip] rozhodne, zda má [county.GetNameNoTierNoTooltip] přinášet především vyšší daně, nebo se dále rozvíjet."
 steward_task.2005.success: "[liege.GetTitledFirstNameNoTooltip|U] souhlasí s tvým rozhodnutím"
 steward_task.2005.failure: "[liege.GetTitledFirstNameNoTooltip|U] s tvým rozhodnutím nesouhlasí"
 steward_task.2006.opening: "[steward.Custom2('AppropriateGreeting', ROOT.Char)]"
 steward_task.2006.desc_intro: "Při obhlídce území, které nese jméno [county.GetName], mi [tax_collector.GetTitledFirstName] [Select_CString(tax_collector.IsFemale, 'poradila', 'poradil')], abych spolu s jeho rozvojem zvýšil i tamní daně.\n\n"
 steward_task.2006.desc_development: "Domníval jsem se však, že by to zabrzdilo další růst, a proto jsem radu [Select_CString(tax_collector.IsFemale, 'odmítl', 'odmítl')]."
 steward_task.2006.desc_taxation: "Touto radou jsem se řídil a věřím, že výsledek oceníš."
 steward_task.2006.a: "Dobrá práce, [steward.GetTitledFirstNameNoTooltip]."
 steward_task.2006.b: "Cože? Tohle jsem vůbec nechtěl!"
 steward_task.2006.b_notification: "Rozhodnutí zvráceno"
 steward_task.2007.desc: "[county.GetName] je předmětem sporu mezi mnou a [tax_collector.GetTitledFirstName]. Nedokázali jsme se shodnout, zda má mít přednost výběr daní, nebo další rozvoj, a proto rozhodnutí necháváme na tobě."
 steward_task.2007.a: "Více daní znamená dobré daně. To je mé heslo."
 steward_task.2008.desc_intro_friendly: "Ačkoli [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] a [tax_collector.Custom2('MyCharacterIntroduction', ROOT.Char)] spolu obvykle vycházejí dobře, tentokrát je zdrojem jejich sporu právě [county.GetNameNoTier]."
 steward_task.2008.desc_intro_unfriendly: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)] a [tax_collector.Custom2('MyCharacterIntroduction', ROOT.Char)] se hádají snad každý den. Tentokrát je zdrojem jejich sporu právě [county.GetNameNoTier]."
 steward_task.2008.desc_outro: "\n\n„[county.GetNameNoTooltip] bohatne, a proto by měly růst i tamní daně,“ prohlašuje [tax_collector.GetTitledFirstNameNoTooltip]. „Zvyšme je hned a nečekejme, až [steward.GetTitledFirstNameNoTooltip] svůj úkol oficiálně dokončí.“\n\n„To ale zpomalí místní rozvoj,“ namítá [steward.GetTitledFirstNameNoTooltip]. „A mým úkolem je rozvíjet, ne danit.“"
 steward_task.2008.a: "[tax_collector.GetTitledFirstNameNoTooltip] má v tomto pravdu."
 steward_task.2008.b: "[steward.GetTitledFirstNameNoTooltip] má dobrý argument."
 steward_task.2008.c: "To se nedokážete dohodnout sami?!"
 steward_task.2101.t: "Efektivní výběr daní"
 steward_task.2101.desc: "[councillor.GetTitledFirstName] řídí osidlování a mýcení půdy a [county.GetName] se díky tomu mění doslova před očima. [councillor.GetTitledFirstName] tak má dokonalý přehled nejen o nových lénech, ale i o těch, která zde byla už dříve.\n\nA [councillor.GetFirstName] tvrdí, že naše daňové záznamy ještě nikdy nebyly tak podrobné!"
 steward_task.2101.a: "Víš, co máš dělat, [councillor.GetFirstNameNoTooltip]!"
 steward_task.2101.notification: "Efektivní výběr daní v hrabství"
 steward_task.2102.t: "Zvýšená kontrola"
 steward_task.2102.desc: "Zakládání nových lén pokračuje a [county.GetName] se rychle mění. [councillor.GetTitledFirstName] proto musí prosazovat mnohem přísnější dohled, než na jaký byli místní dosud zvyklí.\n\nNaštěstí [councillor.GetTitledFirstName] vzbuzuje velký respekt a posílená správa mi přináší výhody hned v několika ohledech."
 steward_task.2102.a: "Připomeň jim všem, kdo je jejich [ROOT.Char.GetTitleTierName|l]."
 steward_task.2102.notification: "Zvýšená kontrola"
 steward_task.3001.t: "Odpor vůči osadníkům"
 steward_task.3001.desc: "Mnoho nových osadníků z [ROOT.Char.GetCulture.GetName] kultury se potýká s obtížemi. [county.GetNameNoTier] jim rozhodně nepřeje. Místní osadníky nejen přehlížejí, ale několik usedlostí se dokonce stalo terčem přímých útoků!"
 steward_task.3001.a: "Osadníci z [ROOT.Char.GetCulture.GetNameNoTooltip] kultury si zaslouží úctu!"
 steward_task.3001.notification: "Odpor vůči osadníkům"
 steward_task.3002.t: "Odpor vůči správě"
 steward_task.3002.desc: "[county.GetName] působí [councillor.GetTitledFirstName] nečekané potíže. Místní odmítají spolupracovat s novou správou založenou na zásadách, které prosazuje [ROOT.Char.GetCulture.GetName] kultura. Přicházejí stížnosti, že snahy, které [councillor.GetTitledFirstName] vyvíjí, působí mnohem více problémů než užitku."
 steward_task.3002.a: "Obávám se, že to všechno je nezbytné."
 steward_task.3002.notification: "Nová správa selhává ([ROOT.Char.GetCulture])"
 steward_task.3101.t: "Vítaná správa"
 steward_task.3101.desc: "[councillor.GetTitledFirstName] pracuje na zavedení nové správy založené na zásadách, které prosazuje [ROOT.Char.GetCulture.GetName] kultura. [county.GetName] tyto změny podle všeho přijímá dobře.\n\nMístním se díky této práci žije snáze a bezpečněji."
 steward_task.3101.a: "[councillor.GetTitledFirstNameNoTooltip] mou důvěru [Select_CString(councillor.IsFemale, 'nezklamala', 'nezklamal')]!"
 steward_task.3101.notification: "Nová správa vítána ([ROOT.Char.GetCulture])"
 steward_task.3102.t: "Oceňovaná správa"
 steward_task.3102.desc: "[councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale, 'má', 'můj')] [councillor.GetCouncilTitle|l], pracuje na zlepšení správy a zavádí myšlenky vycházející z tradic [ROOT.Char.GetCulture.GetName] kultury.\n\nDíky obratné správě, kterou [county.GetName] dostává, místním držitelům půdy podle všeho ani nevadí mírné zvýšení daní."
 steward_task.3102.a: "Více zlata v pokladnici je vždycky dobrá zpráva!"
 steward_task.3102.notification: "Správa podle [ROOT.Char.GetCulture] kultury"
 steward_task.3103.t: "Posílené pluky"
 steward_task.3103.desc: "Snaha, s níž [councillor.GetTitledFirstName] přivádí do [county.GetNameNoTier] osadníky z [ROOT.Char.GetCulture.GetName] kultury, přinesla něco nečekaného.\n\nMístní jako by nyní lépe chápali své místo v panství, a když přijde čas za něj bojovat, každá vesnice dělá, co může, aby do služby vyslala své nejlepší bojeschopné [ROOT.Char.Custom('LevyMenWomen')|l]. Někteří sedláci se dokonce hlásí do vojska dobrovolně!"
 steward_task.3103.a: "Teď už jsem viděl opravdu všechno."
 steward_task.3103.notification: "Dobrovolní odvedenci z [ROOT.Char.GetCulture] kultury"
 steward_task.3201.notification: "Zvýšená autonomie"
 steward_task.3202.notification: "Udělena kulturní daňová výjimka"
 steward_task.3203.notification: "Ochrana archaických tradic"
 steward_task.3301.notification: "Dosaženo kulturního porozumění"
 steward_task.3302.notification: "Diplomatická vstřícnost oceněna"
 steward_task.3303.notification: "Probuzen kulturní zájem"
 steward_task.4001.opening: "[county_liege.Custom2('AppropriateGreeting', ROOT.Char)]"
 steward_task.4001.desc: "Je zřejmé, že se [councillor.GetCouncilTitle|l] snaží získat [county.GetName] na tvou stranu a poštvat tamní obyvatele proti mně. Nemysli si, že takové nečestné jednání zůstane bez odezvy."
 steward_task.4001.a: "Ale mám na něj #EMP legitimní#! nárok!"
 steward_task.4002.t: "Ztráta prestiže"
 steward_task.4002.desc: "[county.GetName] působí [councillor.GetTitledFirstName] nečekané potíže. Naše snaha získat místní na svou stranu na ně vůbec nezapůsobila."
 steward_task.4002.a: "Dříve či později to pochopí."
 steward_task.4002.notification: "Ztráta prestiže"
 steward_task.4101.t: "Získána prestiž"
 steward_task.4101.desc: "Mise, kterou [councillor.GetTitledFirstName] plní, začíná přinášet výsledky. [county.GetName] naše úsilí podle všeho oceňuje a místní se na nás dívají příznivě."
 steward_task.4101.a: "Výborný výsledek!"
 steward_task.4101.notification: "Získána prestiž"
