 court.8200.t: "Pevné základy"
 court.8200.desc: "Schopnosti [position_holder.GetTitledFirstName], [GetCourtPositionType('royal_architect_court_position').GetName()], sklízí u dvora samou chválu; slovo „[position_holder.Custom('ComplimentAdjective')]“ na [position_holder.GetTitledFirstName] sedí dokonale. I ty nejprostší opravy provádí s péčí a přesností vzácnou i na poměry [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] – a vlastně kdekoli jinde.\n\nCelý poslední týden je [position_holder.GetTitledFirstName] [Select_CString(position_holder.IsFemale,'ponořená','ponořen')] do hlubokých úvah a nakonec se mi svěří se svým dilematem: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], při své práci jsem si [Select_CString(position_holder.IsFemale,'všimla','všiml')] několika způsobů, jak zefektivnit vaše stavební projekty, ale možná by mé úsilí bylo užitečnější při rozšiřování vesnic?“"
 court.8200.a: "Jsi [Select_CString(position_holder.IsFemale,'#EMP má#! architektka','#EMP můj#! architekt')]."
 court.8200.b: "Postarej se o potřeby lidu."
 court.8200.c: "[Select_CString(position_holder.IsFemale,'Schopná žena','Schopný muž')] zvládne obojí."
 court.8200.c.success: "Pomůžeš [position_holder.GetFirstNameNoTooltip]"
 court.8200.c.failure: "[position_holder.GetFirstNameNoTooltip] už toho má příliš"
 employer_booner_royal_architect_1_modifier: "Efektivní výstavba"
 employer_booner_royal_architect_1_modifier_desc: "Stavebním projektům této postavy věnuje zkušený královský architekt soustavnou pozornost."
 employer_booner_royal_architect_2_modifier: "Dohled nad obcemi"
 employer_booner_royal_architect_2_modifier_desc: "Vesnicím této postavy věnuje zkušený královský architekt soustavnou pozornost.\nPostup [Concept('councillor_task','úkolu rádce')|E] Zvýšit rozvoj v hrabství: #P +10%#!"
 employer_booner_royal_architect_3_modifier: "Efektivní dohled"
 employer_booner_royal_architect_3_modifier_desc: "Stavebním projektům i vesnicím této postavy věnuje zkušený královský architekt soustavnou pozornost.\nPostup [Concept('councillor_task','úkolu rádce')|E] Zvýšit rozvoj v hrabství: #P +10%#!"
 court.8201.t: "[Select_CString(position_holder.IsFemale,'Paní','Pán')] číše"
 court.8201.desc: "Slovo „[position_holder.Custom('ComplimentAdjective')]“ na [position_holder.GetTitledFirstName] sedí dokonale. [position_holder.GetTitledFirstName], [GetCourtPositionType('cupbearer_court_position').GetName()], je [Select_CString(position_holder.IsFemale,'spolehlivá žena','spolehlivý muž')] a své povinnosti plní s obdivuhodnou lehkostí.\n\nDbá, aby nikdy nezůstala prázdná má číše ani číše mých hostů a dvořanů, a vždy přitom s úsměvem.\n\nTakové nadšení a obratnost jsou vzácné. [position_holder.GetTitledFirstName] by mi [Select_CString(position_holder.IsFemale,'mohla být velmi užitečná','mohl být velmi užitečný')]..."
 court.8201.a: "Postarej se dobře o mé hosty, [position_holder.GetFirstNameNoTooltip]."
 court.8201.b: "Dohlédni, aby služebnictvo odvádělo svou práci."
 court.8201.c: "Očekávám prvotřídní obsluhu."
 court.8201.c.success: "Pomůžeš [position_holder.GetFirstNameNoTooltip]"
 court.8201.c.failure: "[position_holder.GetFirstNameNoTooltip] už toho má příliš"
 employer_booner_cupbearer_1_modifier: "Číše po okraj"
 employer_booner_cupbearer_1_modifier_desc: "Vazalům této postavy věnuje zkušený číšník zvláštní péči."
 employer_booner_cupbearer_2_modifier: "Zvláštní dohled"
 employer_booner_cupbearer_2_modifier_desc: "Služebnictvo této postavy je pod bedlivým dohledem zkušeného číšníka.\nNáklady na služebnictvo v rámci [Concept('court_amenity','dvorského komfortu')|E]: #P -25%#!"
 employer_booner_cupbearer_3_modifier: "Číše pod dohledem"
 employer_booner_cupbearer_3_modifier_desc: "Vazalům i služebnictvu této postavy věnuje zkušený číšník zvláštní péči.\nNáklady na služebnictvo v rámci [Concept('court_amenity','dvorského komfortu')|E]: #P -25%#!"
 court.8203.t: "Oči všude"
 court.8203.desc: "Slovo „[position_holder.Custom('ComplimentAdjective')]“ na [position_holder.GetTitledFirstName], [GetCourtPositionType('lady_in_waiting_court_position').GetName()], sedí dokonale. Své role se [Select_CString(position_holder.IsFemale,'zhostila','zhostil')] obdivuhodně a jako by [Select_CString(position_holder.IsFemale,'dokázala','dokázal')] předvídat každý můj rozmar.\n\nNavíc [Select_CString(position_holder.IsFemale,'jí','mu')] u dvora neunikne vůbec nic, od nejbezvýznamnějších klepů po nejzávažnější zprávy.\n\nTakový talent by se mi mohl náramně hodit. Stačí jen určit, kam ho zaměřit..."
 court.8203.a: "[position_holder.GetFirstNameNoTooltip], potřebuji tvou pomoc..."
 court.8203.b: "Ani ten nejtišší šepot ti nesmí uniknout."
 court.8203.c: "Tajemství a šarm, to budou tvé zbraně."
 court.8203.c.success: "Pomůžeš [position_holder.GetFirstNameNoTooltip]"
 court.8203.c.failure: "[position_holder.GetFirstNameNoTooltip] už toho má příliš"
 employer_booner_lady_in_waiting_1_modifier: "Morální podpora"
 employer_booner_lady_in_waiting_1_modifier_desc: "Zkušená dvorní dáma radí této postavě v otázkách společenské strategie."
 employer_booner_lady_in_waiting_2_modifier: "Šepot dvora"
 employer_booner_lady_in_waiting_2_modifier_desc: "Zkušená dvorní dáma radí této postavě při shromažďování klepů.\nPostup [Concept('councillor_task','úkolu rádce')|E] Hledání tajemství v panství: #P +10#!"
 employer_booner_lady_in_waiting_3_modifier: "Dvorská podpora"
 employer_booner_lady_in_waiting_3_modifier_desc: "Zkušená dvorní dáma radí této postavě v otázkách společenské strategie i při shromažďování klepů.\nPostup [Concept('councillor_task','úkolu rádce')|E] Hledání tajemství v panství: #P +10#!"
 court.8204.t: "Chuť dvora"
 court.8204.desc: "Soudě podle toho, jak [position_holder.GetTitledFirstName] roste úsměv i břicho, není slovo „[position_holder.Custom('ComplimentAdjective')]“ nijak přehnané. [position_holder.GetTitledFirstName], [GetCourtPositionType('food_taster_court_position').GetName()], se snad [Select_CString(position_holder.IsFemale,'narodila','narodil')] přímo pro hostiny, jaké si může dopřát [ROOT.Char.GetTitleAsNameNoTooltip].\n\nStále více času tráví v kuchyních, ochutnává připravené pokrmy a rozdává kuchařům rady.\n\nTak vzácné nadšení pro jinak poměrně nevděčný úřad by byla škoda nevyužít..."
 court.8204.a: "Ať ti neunikne vůbec nic, [position_holder.GetFirstNameNoTooltip]."
 court.8204.b: "Kuchyně jsou ve tvých rukou!"
 court.8204.c: "Chci dohled nad jídlem #EMP i#! služebnictvem."
 court.8204.c.success: "Pomůžeš [position_holder.GetFirstNameNoTooltip]"
 court.8204.c.failure: "[position_holder.GetFirstNameNoTooltip] už toho má příliš"
 employer_booner_food_taster_1_modifier: "Prověřování služebnictva"
 employer_booner_food_taster_1_modifier_desc: "Služebnictvo této postavy je pod bedlivým dohledem zkušeného ochutnávače."
 employer_booner_food_taster_2_modifier: "Schválený jídelníček"
 employer_booner_food_taster_2_modifier_desc: "Kuchyně této postavy je pod bedlivým dohledem zkušeného ochutnávače.\nNáklady na jídlo v rámci [Concept('court_amenity','dvorského komfortu')|E]: #P -25%#!"
 employer_booner_food_taster_3_modifier: "Prověřený jídelníček"
 employer_booner_food_taster_3_modifier_desc: "Služebnictvo i kuchyně této postavy jsou pod bedlivým dohledem zkušeného ochutnávače.\nNáklady na jídlo v rámci [Concept('court_amenity','dvorského komfortu')|E]: #P -25%#!"
 court.8301.t: "Nenaplněná očekávání"
 court.8301.intro: "Neschopnost [position_holder.GetFirstName] v roli [position_holder.GetHeldCourtPositionsString] se u dvora stává stále častějším terčem posměchu. Když se nad tím zamyslím, [Select_CString(position_holder.IsFemale,'její','jeho')] schopnosti opravdu nechávají mnoho co dohánět...\n\n"
 court.8301.detractor: "Nejhlasitější ze všech je [detractor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('detractor'))], a své pohrdání nijak neskrývá.\n\n"
 court.8301.desc: "„Ale no tak, [ROOT.Char.Custom('FormOfAddressForLiege')],“ vykoktá [position_holder.GetFirstName] přes chichotající se dvůr poté, co se všichni znovu vysmáli zmatenému výkladu na téma „[position_holder.Custom('GetCourtPositionSubject')]“. „Já #EMP svou práci umím#!... n-nebo snad ne?“"
 court.8301.a: "Promluvme si o tvém platu, [position_holder.GetFirstNameNoTooltip]..."
 court.8301.b: "Myslím, že je načase, abys [Select_CString(position_holder.IsFemale,'odstoupila','odstoupil')]."
 court.8301.c: "#weak *povzdech*#! #EMP Ano...#! Ehm, ano! Jsi [Select_CString(position_holder.IsFemale,'skvělá','skvělý')]!"
