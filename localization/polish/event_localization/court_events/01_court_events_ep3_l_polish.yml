l_polish:
 employer_booner_invalidated_tt: "#weak Modifikátor bude odebrán, pokud [position_holder.GetShortUIName|V] přijde o tento [Concept('court_position','dvorský úřad')|E] nebo nebude na stejném [Concept('court','dvoře')|E] jako [THIS.Char.GetShortUIName|V]#!"
 employer_boon_target_invalidated_title: "Dvořan přichází o výhodu"
 employer_booner_invalidated_title: "Výhoda dvorského úřadu ztracena"
 court.8190.t: "[Select_CString(position_holder.IsFemale,'Dobrá lékařka','Dobrý lékař')] [position_holder.GetFirstNameNoTooltip]"
 court.8190.desc: "[position_holder.GetTitledFirstName], [GetCourtPositionType('court_physician_court_position').GetName()], je [position_holder.Custom('ComplimentAdjective')] [Select_CString(position_holder.IsFemale,'léčitelka, vždy připravená','léčitel, vždy připraven')] sáhnout po vhodném léku či obkladu při prvním náznaku i té nejlehčí choroby některého dvořana.\n\n[Select_CString(position_holder.IsFemale,'Její','Jeho')] nadání skoro přichází vniveč, když musí ošetřovat každou drobnou bolístku náročných obyvatel celého [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] dvora."
 court.8190.a: "Hodila by se mi trochu důkladnější péče."
 court.8190.b: "Věnuj se [Select_CString(heir.IsFemale,'mé dědičce','mému dědici')], [heir.GetFirstNameNoTooltip]."
 court.8190.c: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstNameNoTooltip] potřebuje tvou plnou pozornost."
 court.8190.d: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] [spouse.GetFirstNameNoTooltip] by tvou péči [Select_CString(spouse.IsFemale,'ocenila','ocenil')]."
 court.8190.e: "Prozatím se věnuj [relation.GetFirstNameNoTooltip]."
 court.8190.f: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family'))] [family.GetFirstNameNoTooltip] bude [Select_CString(family.IsFemale,'tvá nejdůležitější pacientka','tvůj nejdůležitější pacient')]."
 court.8190.g: "[house.GetFirstNamePossessiveNoTooltip] potíže potřebují tvou péči. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house'))] má přednost."
 employer_booner_court_physician_modifier: "Důkladná péče"
 employer_booner_court_physician_modifier_desc: "Této postavě věnuje zkušený $court_physician_court_position$ soustavnou péči."
 court.8191.t: "Zvláštní výuka"
 court.8191.desc: "[position_holder.GetTitledFirstName], [GetCourtPositionType('court_tutor_court_position').GetName()], je [position_holder.Custom('ComplimentAdjective')] [Select_CString(position_holder.IsFemale,'učitelka, která','učitel, který')] obratně drží neposlušná děcka na uzdě a řídí jejich vzdělávání.\n\n[Select_CString(position_holder.IsFemale,'Její','Jeho')] pozornost se dělí mezi děti [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] dvora, ale pro jedno z nich se přece jen najde čas na důkladnější výuku pod [Select_CString(position_holder.IsFemale,'jejím','jeho')] bedlivým dohledem."
 court.8191.a: "#EMP Já#! se chci naučit víc!"
 court.8191.b: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))] [heir.GetFirstNameNoTooltip] jednou zdědí mé postavení a potřebuje být [Select_CString(heir.IsFemale,'moudrá','moudrý')]."
 court.8191.c: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('struggling'))] [struggling.GetFirstNameNoTooltip] podle mě potřebuje trochu pomoci."
 court.8191.d: "Co třeba [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstNameNoTooltip]?"
 court.8191.e: "Věnuj se [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('interesting'))] [interesting.GetFirstNameNoTooltip]."
 court.8191.f: "[oldest.GetFirstNamePossessiveNoTooltip] vzdělání teď dostane přednost. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('oldest'))] si zaslouží pozornost."
 court.8191.g: "Je načase, aby [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('youngest'))] [youngest.GetFirstNameNoTooltip] [Select_CString(youngest.IsFemale,'nabrousila','nabrousil')] brk."
 court.8191.h: "Zaměř se na [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extra'))] [extra.GetFirstNameNoTooltip]."
 court.8191.i: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bonus'))] [bonus.GetFirstNameNoTooltip] z toho vytěží nejvíc."
 employer_booner_court_tutor_modifier: "Zvláštní výuka"
 employer_booner_court_tutor_modifier_desc: "Tato postava je soustavným středem pozornosti zkušeného dvorního učitele.\nZlepšuje výsledky [Concept('education','vzdělání')|E] tohoto [Concept('child_possessive','dítěte')|E]"
 court.8192.t: "Pevný řád"
 court.8192.desc: "Od chvíle, kdy [position_holder.GetTitledFirstName] [Select_CString(position_holder.IsFemale,'nastoupila','nastoupil')] do služby jako [GetCourtPositionType('seneschal_court_position').GetName()], je stále [position_holder.Custom('ComplimentAdjective')] a stará se, aby můj dvůr i domácnost fungovaly bez zádrhelů.\n\nKdyž si v duchu pochvaluji své rozhodnutí, ozve se za mnou [position_holder.GetTitledFirstName]: „[position_holder.Custom2('RelationToMeShort', ROOT.Char)|U], [Select_CString(position_holder.IsFemale,'zjistila','zjistil')] jsem, že [ROOT.Char.Custom('ResidenceBuilding')|l] nabízí spoustu možností, jak ušetřit. Jen si nejsem [Select_CString(position_holder.IsFemale,'jistá','jistý')], kde by podle vás bylo nejlepší začít?“\n\n[position_holder.GetTitledFirstName] zvedne účetní knihu a tázavě povytáhne obočí."
 court.8192.a: "Na vybavení se dá trochu ušetřit."
 court.8192.b: "Vytěž ze služebnictva maximum."
 court.8192.c: "Proč dělat kompromisy?"
 court.8192.c.success: "Pomůžeš [position_holder.GetFirstNameNoTooltip]"
 court.8192.c.failure: "[position_holder.GetFirstNameNoTooltip] už toho má příliš"
 employer_booner_seneschal_1_modifier: "Úspory na ubytování"
 employer_booner_seneschal_1_modifier_desc: "Na vazaly této postavy dohlíží zkušený senešal."
 employer_booner_seneschal_2_modifier: "Přísný dozor"
 employer_booner_seneschal_2_modifier_desc: "Dvůr této postavy spravuje zkušený senešal pevnou rukou.\nNáklady na ubytování v rámci [Concept('court_amenity','dvorského komfortu')|E]: #P -25%#!"
 employer_booner_seneschal_3_modifier: "Úspory díky přísnému dozoru"
 employer_booner_seneschal_3_modifier_desc: "Dvůr i služebnictvo této postavy spravuje zkušený senešal pevnou rukou.\nNáklady na ubytování v rámci [Concept('court_amenity','dvorského komfortu')|E]: #P -25%#!"
 court.8193.t: "V dobrých rukou"
 court.8193.desc: "[position_holder.GetTitledFirstName], [GetCourtPositionType('wet_nurse_court_position').GetName()], je [position_holder.Custom('ComplimentAdjective')] a s dětmi si rozumí od přírody; o malé nezbedníky pečuje, jako by to byly [Select_CString(position_holder.IsFemale,'její','jeho')] vlastní děti.\n\nTrochu mě zaskočí, když mezi káráním jednoho z capartů prohodí: „A co [ROOT.Char.Custom('GetCourt')]? Myslíte, že některé z tamních dětí potřebují mou zvláštní pozornost, [ROOT.Char.GetTitleAsNameNoTooltip]?“"
 court.8193.a: "Všechen čas má patřit #EMP mně#!!"
 court.8193.b: "Přednost má [Select_CString(heir.IsFemale,'má mladá dědička','můj mladý dědic')], [heir.GetFirstNameNoTooltip]."
 court.8193.c: "Především se věnuj [baby.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('baby'))]. Je to novorozeně."
 court.8193.d: "Dobře se postarej o [hostage.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]."
 court.8193.e: "Zaměř se na [interesting.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('interesting'))]."
 court.8193.f: "[Select_CString(sickest.IsFemale,'Malá','Malý')] [sickest.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sickest'))], má přednost."
 court.8193.g: "Věnuj víc času [second_sickest.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_sickest'))]."
 court.8193.h: "Zvláštní péči věnuj [extra.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extra'))]."
 court.8193.i: "Chci, aby [bonus.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bonus'))], [Select_CString(bonus.IsFemale,'vyrostla silná','vyrostl silný')]."
 employer_booner_wet_nurse_modifier: "Zvláštní péče kojné"
 employer_booner_wet_nurse_modifier_desc: "Této postavě věnuje zkušená kojná soustavnou péči."
 court.8194.t: "Komu pomoci"
 court.8194.desc: "[position_holder.GetTitledFirstName], [GetCourtPositionType('high_almoner_court_position').GetName()], se svých povinností ujímá s velkou péčí a [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] dobročinnost díky tomu získává stále větší věhlas.\n\nO to víc mě překvapí, když ke mně přijde s váčkem mincí, které [Select_CString(position_holder.IsFemale,'jí','mu')] cinkají v dlani: „Svůj čas dělím mezi skutečně potřebné a zbožné pány a dámy, jejichž domovem je [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]. Potřebuji vaše vedení, [ROOT.Char.Custom('FormOfAddressForLiege')]...“"
 court.8194.a: "Dopřej chudým [ROOT.Char.GetFaith.WealthGodNamePossessive] milost."
 court.8194.b: "Zajisti, aby se tyto almužny dostaly tam, kam mají..."
 court.8194.c: "Vidím způsob, jak pomoci všem."
 court.8194.c.success: "Pomůžeš [position_holder.GetFirstNameNoTooltip]"
 court.8194.c.failure: "[position_holder.GetFirstNameNoTooltip] už toho má příliš"
 employer_booner_high_almoner_1_modifier: "Cílená pomoc"
 employer_booner_high_almoner_1_modifier_desc: "Pozornost svědomitého almužníka se soustředí na potřebné poddané této postavy."
 employer_booner_high_almoner_2_modifier: "Okázalá dobročinnost"
 employer_booner_high_almoner_2_modifier_desc: "Pozornost svědomitého almužníka se soustředí na svědomí zbožných vazalů této postavy."
 employer_booner_high_almoner_3_modifier: "Okázalá pomoc"
 employer_booner_high_almoner_3_modifier_desc: "Pozornost svědomitého almužníka se soustředí jak na potřebné poddané této postavy, tak na svědomí jejích zbožných vazalů."
 court.8195.t: "Umět se bránit"
 court.8195.desc: "[position_holder.GetTitledFirstName], [GetCourtPositionType('bodyguard_court_position').GetName()], je [position_holder.Custom('ComplimentAdjective')] [Select_CString(position_holder.IsFemale,'bojovnice, na kterou','bojovník, na kterého')] je na cvičišti radost pohledět, a [ROOT.Char.Custom('ResidenceBuilding')|l] je díky [Select_CString(position_holder.IsFemale,'její','jeho')] přítomnosti mnohem bezpečnější.\n\nJednoho dne za mnou přijde s cvičným mečem v ruce a [portrait.GetFirstName] [Select_CString(position_holder.IsFemale,'jí','mu')] jde v patách. „[Select_CString(position_holder.IsFemale,'Dostala','Dostal')] jsem několik žádostí o výcvik a s vaším svolením je přijmu, [ROOT.Char.Custom('FormOfAddressForLiege')]. Je někdo, koho si přejete, abych [Select_CString(position_holder.IsFemale,'učila','učil')]?“"
 court.8195.a: "Budeš cvičit se #EMP mnou#!!"
 court.8195.b: "[Select_CString(heir.IsFemale,'Má dědička','Můj dědic')] [heir.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))], musí být [Select_CString(heir.IsFemale,'silná','silný')]."
 court.8195.c: "Myslím, že [struggling.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('struggling'))], by tvé vedení prospělo."
 court.8195.d: "Zaměř se na [hostage.GetFirstNamePossessiveNoTooltip] výcvik, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] to potřebuje."
 court.8195.e: "Věnuj se [interesting.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('interesting'))]."
 court.8195.f: "Trénuj [oldest.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('oldest'))]."
 court.8195.g: "Je načase naučit [oldest.GetFirstNameNoTooltip] bojovat; [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('youngest'))] má přednost."
 court.8195.h: "Věnuj se [extra.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('extra'))]."
 court.8195.i: "[bonus.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bonus'))], z toho vytěží nejvíc."
 employer_booner_bodyguard_modifier: "Cvičné souboje"
 employer_booner_bodyguard_modifier_desc: "Tuto postavu osobně cvičí zkušený osobní strážce."
 court.8196.t: "V sedle"
 court.8196.desc: "[position_holder.GetTitledFirstName], [GetCourtPositionType('master_of_horse_court_position').GetName()], je [position_holder.Custom('ComplimentAdjective')] a o [Select_CString(position_holder.IsFemale,'jejích','jeho')] neocenitelných schopnostech nikdo nepochybuje.\n\nVýcvik koní i jejich kázeň se zlepšily mílovými kroky a [position_holder.GetTitledFirstName] má přirozený talent držet zkrátka jak zvířata, tak jejich velitele.\n\nDnes za mnou přijde do trůnního sálu a rovnou se zeptá: „[ROOT.Char.GetTitleAsNameNoTooltip], mám vypracovat řádná pravidla pro stáje, nebo se zaměřit na výcvik?“"
 court.8196.a: "Na koních šetři, kde se dá."
 court.8196.b: "Prázdné sedlo je k ničemu."
 court.8196.c: "Nezvládneš obojí?"
 court.8196.c.success: "Pomůžeš [position_holder.GetFirstNameNoTooltip]"
 court.8196.c.failure: "[position_holder.GetFirstNameNoTooltip] už toho má příliš"
 employer_booner_master_of_horse_1_modifier: "Úsporné ustájení"
 employer_booner_master_of_horse_1_modifier_desc: "Stájím této postavy věnuje zkušený mistr koní soustavnou pozornost."
 employer_booner_master_of_horse_2_modifier: "Podpora velitelů"
 employer_booner_master_of_horse_2_modifier_desc: "Důstojníkům jízdy této postavy věnuje zkušený mistr koní soustavnou pozornost.\n[Concept('councillor_task','Úkol rádce')|E] Výcvik velitelů je účinnější"
 employer_booner_master_of_horse_3_modifier: "Úsporná podpora"
 employer_booner_master_of_horse_3_modifier_desc: "Stájím i důstojníkům jízdy této postavy věnuje zkušený mistr koní soustavnou pozornost.\n[Concept('councillor_task','Úkol rádce')|E] Výcvik velitelů je účinnější"
 task_train_commanders_master_of_horse_2_bonus_desc: "\n$TAB$$employer_booner_master_of_horse_2_modifier$: #P +[SCOPE.ScriptValue('marshal_train_commanders_monthly_chance_value_base')|P]%#!"
 task_train_commanders_master_of_horse_3_bonus_desc: "\n$TAB$$employer_booner_master_of_horse_3_modifier$: #P +[SCOPE.ScriptValue('marshal_train_commanders_monthly_chance_value_base')|P]%#!"
 court.8197.t: "[position_holder.Custom('QueenKing')] cest"
 court.8197.desc: "[position_holder.GetTitledFirstName], [GetCourtPositionType('travel_leader_court_position').GetName()], je [position_holder.Custom('ComplimentAdjective')] [Select_CString(position_holder.IsFemale,'organizátorka','organizátor')]: od chvíle, kdy [Select_CString(position_holder.IsFemale,'vstoupila','vstoupil')] do mých služeb, proběhne i ta nejkratší cesta svižně a bez jediného zádrhelu!\n\nVe dne v noci nezahálí, doplňuje zásoby a aktualizuje [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] itineráře. O to víc mě překvapí, když se mě zcela vážně zeptá: „[ROOT.Char.GetTitleAsNameNoTooltip], čeho si ceníte víc: svého času, nebo zdraví?“"
 court.8197.a: "Hlavně chci dorazit do cíle v jednom kuse!"
 court.8197.b: "Nesmíme se nikde zdržovat, mám příliš mnoho práce."
 court.8197.c: "Mé bezpečí i čas mají stejnou cenu!"
 court.8197.c.success: "Pomůžeš [position_holder.GetFirstNameNoTooltip]"
 court.8197.c.failure: "[position_holder.GetFirstNameNoTooltip] už toho má příliš"
 employer_booner_travel_leader_1_modifier: "Bezpečné cesty"
 employer_booner_travel_leader_1_modifier_desc: "Této postavě věnuje zkušený vůdce karavany soustavnou pozornost."
 employer_booner_travel_leader_2_modifier: "Rychlé cesty"
 employer_booner_travel_leader_2_modifier_desc: "Této postavě věnuje zkušený vůdce karavany soustavnou pozornost."
 employer_booner_travel_leader_3_modifier: "Rychlé a bezpečné cesty"
 employer_booner_travel_leader_3_modifier_desc: "Této postavě věnuje zkušený vůdce karavany soustavnou pozornost."
 court.8198.t: "Pečlivý kurátor"
 court.8198.desc: "[position_holder.GetTitledFirstName], [GetCourtPositionType('antiquarian_court_position').GetName()], se o mou pokladnici stará znamenitě: všechny předměty jsou čisté a bez prachu a pro každého zvědavého, či méně zvědavého, hosta má vždy po ruce nějakou zajímavost.\n\nPéče o všechny poklady [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] dvora samozřejmě zabírá spoustu času. Když tedy pochválím odvedenou práci, [position_holder.GetTitledFirstName] se mě zeptá: „...je nějaký předmět, kterému bych [Select_CString(position_holder.IsFemale,'měla','měl')] věnovat zvláštní pozornost, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 court.8198.a: "Co třeba [weak_1.Custom('ArtifactType')]?"
 court.8198.b: "#EMP Něco#! by se přece jen našlo: [weak_2.Custom('ArtifactType')]."
 court.8198.c: "A co [weak_3.Custom('ArtifactType')]?"
 court.8198.d: "Opravu potřebuje [broken_1.Custom('ArtifactType')]."
 court.8198.e: "[broken_2.Custom('ArtifactType')] se mi rozpadá před očima."
 court.8198.f: "Pozornost potřebuje [broken_3.Custom('ArtifactType')]."
 court.8198.g: "A [weak_4.Custom('ArtifactType')]?"
 court.8198.h: "[broken_4.Custom('ArtifactType')] potřebuje opravit."
 court.8198.i: "Ne, jen tak dál!"
 employer_booner_antiquarian_modifier: "Pečlivý kurátor"
 employer_booner_antiquarian_modifier_desc: "Pokladnici této postavy věnuje zkušený antikvář soustavnou pozornost."
 court_8198_artifact_prowess_tooltip: "[THIS.Artifact.GetName] získává [Concept('prowess','udatnost')|E]: #P +2#!"
