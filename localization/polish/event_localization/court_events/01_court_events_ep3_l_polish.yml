 court.8321.t: "Po dobrém"
 court.8321.desc: "[position_holder.GetTitledFirstName], [position_holder.GetHeldCourtPositionsString], si už ve své roli docela [Select_CString(position_holder.IsFemale,'zvykla','zvykl')], i když začátky nebyly bez potíží.\n\nNijak se netají tím, že pokud se má do práce opravdu opřít, očekává za své úsilí lepší odměnu.\n\n„No tak, [ROOT.Char.Custom('FormOfAddressForLiege')], sloužím přece právě vám! [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ode mě očekává plné nasazení. [Select_CString(position_holder.IsFemale,'Neměla','Neměl')] bych tedy dostávat víc než jen drobky od stolu, pokud mám celé dny pro vás řešit téma „[position_holder.Custom('GetCourtPositionSubject')]“?“"
 court.8321.a: "Dobrá, ale musíš si to zasloužit."
 court.8321.b: "A co místo toho menší prémie?"
