 court.8311.t: "Učí se řemeslu"
 court.8311.desc: "Přestože [position_holder.GetTitledFirstName] při práci jako [position_holder.GetHeldCourtPositionsString] zpočátku sotva [Select_CString(position_holder.IsFemale,'chápala','chápal')] i ty nejzákladnější principy tématu „[position_holder.Custom('GetCourtPositionSubject')]“, konečně se ve své roli začíná zlepšovat.\n\nMnozí u dvora už zaznamenali rostoucí, byť stále poněkud omezené schopnosti. Přinejmenším se zdá, že se [position_holder.GetTitledFirstName] opravdu snaží zasloužit si svůj plat."
 court.8311.a: "To člověk vidí rád, [position_holder.GetFirstNameNoTooltip]!"
