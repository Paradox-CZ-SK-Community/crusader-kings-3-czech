 court.8199.t: "Pán zvěře"
 court.8199.desc: "[position_holder.GetTitledFirstName], [GetCourtPositionType('master_of_hunt_court_position').GetName()], si vede znamenitě a všichni se shodují, že [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] loviště nikdy neoplývala takovým množstvím zvěře.\n\nPotěší mě, když [position_holder.GetTitledFirstName], sotva se [Select_CString(position_holder.IsFemale,'vrátila','vrátil')] z divočiny, nakoukne do trůnního sálu s naléhavou otázkou: „[ROOT.Char.GetTitleAsNameNoTooltip], někteří z vašich vazalů mě žádají o pomoc se svými lovišti, ale zároveň mám plány, jak vylepšit ta vaše. Co mám dělat?“"
 court.8199.a: "Postarej se, aby byli mí poddaní spokojení."
 court.8199.b: "Říkáš vylepšení?"
 court.8199.c: "Proč ne obojí?"
 court.8199.c.success: "Pomůžeš [position_holder.GetFirstNameNoTooltip]"
 court.8199.c.failure: "[position_holder.GetFirstNameNoTooltip] už toho má příliš"
 employer_booner_master_of_hunt_1_modifier: "Lovecké rady"
 employer_booner_master_of_hunt_1_modifier_desc: "Lovištím vazalů této postavy věnuje zkušený vrchní lovčí soustavnou pozornost."
 employer_booner_master_of_hunt_2_modifier: "Novátorská péče o zvěř"
