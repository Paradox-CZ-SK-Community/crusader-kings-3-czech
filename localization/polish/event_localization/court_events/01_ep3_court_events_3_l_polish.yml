l_polish:
 court_events.3000.t: "Vrchol elegance"
 court_events.3000.desc: "[chancellor.Custom2('MyCharacterIntroduction',ROOT.Char)|U] a [steward.Custom2('MyCharacterIntroduction',ROOT.Char)] dnes působí nezvykle dobře naladěně.\n\n„Přidejte se k nám, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ zvolá [chancellor.GetFirstNameNoTooltip]. „Zrovna jsme mluvili o něčem, co vás jistě potěší. Vaše úsilí prosadit a udržet [ROOT.Char.GetCulture.GetNameNoTooltip] módu jako skutečný vrchol elegance nese ovoce!“\n\n„Cizí panovníci vás obdivují a závidí vám, ale [steward.GetFirstNameNoTooltip] a já se nemůžeme shodnout, jak nejlépe využít vaší pověsti.“"
 court_events.3000.a: "Všichni by měli vědět, že jsem vrcholem módy."
 court_events.3000.b: "[ROOT.Char.GetCulture.GetNameNoTooltip] móda by měla být vzorem pro všechny."
 court_events.3000.c: "Všichni by si měli kupovat naše klobouky!"
 court_events.3010.t: "Pořád ta samá polévka"
 court_events.3010.desc: "„Prosím vás, [ROOT.Char.Custom2('RelationToMeAddress', SCOPE.sC('courtier'))],“ [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] ke mně přistoupí s prosebným pohledem.\n\n„Musíte něco udělat s jídlem, které se podává u dvora! Všichni jíme jako sedláci, cizí vyslanci se u našeho stolu šklebí a sousední panovníci i umělci dávají naše tradiční pokrmy za příklad nevkusu a barbarských zvyků!“"
 court_events.3010.a: "Dobrá, najmu nějaké kuchaře z ciziny."
 court_events.3010.b: "Ale vždyť je to zdravé a bohulibé!"
 court_events.3010.c: "Je to pro mou bezpečnost."
 cheaper_food_for_15_years: "$court_food_quality_decent$: #P o 20 % levnější#! po dobu 15 let"
 court_events.3010.c.tt: "Když polévka každý den chutná i vypadá stejně, je mnohem těžší do ní nepozorovaně přimíchat jed!"
 court_events.3020.t: "Co dělá postel postelí?"
 court_events.3020.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] dnes vypadá obzvlášť zbědovaně.\n\n„U tohoto dvora žijeme jako zvířata! Nebo ještě hůř, jako #EMP sedláci!#! Komnaty jsou přeplněné, celé rodiny se mačkají v jedné posteli, nočníky se válejí všude kolem; brodíme se ve vlastní špíně a zápachu...“"
 court_events.3020.desc_physician: "\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se vloží do hovoru: „Špatné výpary navíc přispívají k šíření epidemií!“"
 court_events.3020.desc_architect: "\n\n„S tím se přece musí dát něco dělat,“ přidá se [architect.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 court_events.3020.a: "Zasloužíme si něco lepšího."
 court_events.3020.b: "To chce odborníka: [expert.GetFirstNameNoTooltip]!"
 court_events.3020.c: "[architect.GetFirstNameNoTooltip] a [physician.GetFirstNameNoTooltip], vyřešte to!"
 court_events.3020.d: "Určitě to není tak zlé."
 cheaper_lodgings_for_15_years: "$court_lodging_standards_middling$: #P o 15 % levnější#! po dobu 15 let"
 cheaper_lodgings_for_15_years_1: "$court_lodging_standards_middling$: #P o 25 % levnější#! po dobu 15 let"
 court_events.3030.t: "Přišlo to ve snu"
 court_events.3030.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip], vaše štědrost nezná mezí! Dovolte mi vyjádřit svou vděčnost a podělit se o skvělou zprávu!“ zvolá [inspiration_owner.GetTitledFirstName] a spěchá ke mně.\n\n„Ubytování od vás si nesmírně užívám. Je tak prostorné, že se při přemýšlení mohu procházet sem a tam a v klidu nerušeně pracovat; výhled do zahrady je neuvěřitelně inspirující; a ta postel... ach, ta postel! Je tak pohodlná, že mám pocit, jako bych [Select_CString(inspiration_owner.IsFemale,'spala','spal')] na obláčku! Vlastně právě ve spánku ke mně přišlo božské vnuknutí: [inspiration_owner.Custom('GetInspirationTypeObject')] může být ještě lepší! Musím rychle zpátky do práce!“"
 court_events.3030.a: "A co ještě lepší postel?"
 court_events.3030.b: "To opravdu rád slyším!"
 court_events.3040.t: "Prázdný dvůr"
 court_events.3040.desc: "Přepadne mě chuť na něco malého k snědku, ale nikde nemohu najít jediného sluhu, který by mi něco přinesl. Pak mi dojde, že se to vlastně stává až příliš často. U svého dvora nedokážu nic zařídit, protože tu nikdy není dost služebnictva!\n\nMé úvahy přeruší [steward.Custom2('MyCharacterIntroduction', ROOT.Char)]. „[ROOT.Char.GetTitleAsNameNoTooltip], co si myslíte o válce, která pustoší sousední panství [war_realm.GetName]? Právě teď přes naše hranice proudí bezpočet uprchlíků z okupovaného území [occupied_prov.GetName]!“\n\nNení to právě řešení, které hledám?"
 court_events.3040.a: "Brány našich měst se jim otevřou!"
 court_events.3040.b: "Dobrá, mohou pro nás pracovat."
 court_events.3040.c: "Nepotřebujeme je."
 cheaper_servants_for_15_years: "$court_servants_some$: #P o 20 % levnější#! po dobu 15 let"
 court_events.3050.t: "[ROOT.Char.GetTitleAsNameNoTooltip] za stolem"
 court_events.3050.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ začne [chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)], „[Select_CString(chancellor.IsFemale,'doslechla','doslechl')] jsem se, že přepychové pokrmy podávané u vašeho stolu už získaly pořádnou pověst!“\n\n„Tak exotické lahůdky, tak lákavé chutě... Vaši vazalové #EMP prahnou#! po pozvání na vaše hostiny!“\n\nTo mi vnuklo nápad..."
 court_events.3050.a: "Ať jen touží po stole, u kterého hoduje [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court_events.3050.b: "Pozveme je ke stolu, u kterého hoduje [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court_events.3050.a.tt: "Získáš #P $food_improves_opinion$#!: Účinnost [Concept('domestic_affairs','Domácích záležitostí')|E] se na #P 15#! let zvýší"
 court_events.3050.b.tt: "Získáš #P $food_improves_feasts$#!: #P +15#! k přijetí hosty a #P -15 %#! k nákladům ve zlatě na tvé hostiny po dobu #P 15#! let"
 food_improves_feasts: "Proslulá kuchyně"
 food_improves_opinion: "$food_improves_feasts$"
 food_improves_feasts_desc: "$food_improves_feasts$: $VALUE|=+0$"
 chancellor_domestic_affairs_opinion_food_bonus_desc: "\n$TAB$$food_improves_opinion$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_opinion_food_bonus')|2]#!"
 chancellor_domestic_affairs_tyranny_food_bonus_desc: "\n$TAB$$food_improves_opinion$: #P +[SCOPE.ScriptValue('chancellor_domestic_affairs_tyranny_food_bonus')|P0]%#!"
 court_events.3060.t: "Moře beze tváří"
 court_events.3060.desc: "Kam se podívám, všude vidím lidi v mých barvách: pobíhají sem a tam, klevetí, leští staré zbroje, nosí jídlo, roznášejí zprávy...\n\nKolik jich tu vlastně dnes je? Přicházejí a odcházejí jako příliv a odliv a já už vůbec nedokážu sledovat známé tváře! Komu mohu věřit?\n\nZ úvah mě vytrhne [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)]. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], vidím, že si prohlížíte služebnictvo. Je jich tolik! V takovém moři bezejmenných tváří nikdo nedokáže uhlídat, kdo je kdo. Bylo by tak snadné propašovat spolčence všude, kde jsou potřeba... Samozřejmě, vaši nepřátelé by toho mohli využít také, ale jen pomyslete na všechny ty možnosti...“"
 court_events.3060.a: "Tolik možností..."
 court_events.3060.a.tt: "...jak mi také vrazit nůž do zad!"
 court_events.3060.b: "Raději je zapřáhni do práce!"
 court_events.3070.t: "Hadry místo nádhery?"
 court_events.3070.desc: "Během svých cest [guest.GetTitledFirstName] [Select_CString(guest.IsFemale,'zavítala','zavítal')] i k mému dvoru. Zatím však nadšením zrovna neoplývá.\n\n„Ach tak, tomuhle tady říkáte ‚móda‘... Odpusťte mi, [ROOT.Char.Custom('FormOfAddressForLiege')], ale v tak skromném oděvu vás téměř nedokážu rozeznat od vašeho služebnictva! Snad bych vám [Select_CString(guest.IsFemale,'mohla','mohl')] dát pár rad, pokud dovolíte?“"
 court_events.3070.a: "Tak se předveď."
 court_events.3070.b: "[Select_CString(ROOT.Char.IsFemale,'Přijala','Přijal')] jsem za svou skromnost. [Select_CString(guest.IsFemale,'Měla','Měl')] bys to zkusit také."
 court_events.3070.c: "#EMP Jak se opovažuješ?!#!"
 cheaper_fashion_for_15_years: "$court_fashion_decent$ je po dobu 15 let #P o 20 % levnější#!"
 free_fashion_for_15_years: "$court_fashion_acceptable$ je po dobu 15 let #P zdarma#!"
 court_events.3080.t: "Stříbrný jazyk"
 court_events.3080.desc: "[Select_CString(poet.IsFemale,'Žena, která','Muž, který')] dnes přichází k mému dvoru, působí výstředně a z úsměvu [poet.GetFirstNameNicknamed] čiší šarm i sebejistota.\n\n„Slavná [Select_CString(ROOT.Char.IsFemale,'panovnice','panovnická veličino')], dovolte, abych se [Select_CString(poet.IsFemale,'představila','představil')]: jmenuji se [poet.GetFirstNameNicknamed] a jsem [Select_CString(poet.IsFemale,'básnířka','básník')] nejvyššího umění! Můj věhlas se nese celým světadílem, ale při této výjimečné příležitosti jsem se [Select_CString(poet.IsFemale,'rozhodla','rozhodl')], že mé toulavé dny skončily. [Select_CString(poet.IsFemale,'Ráda bych tedy nabídla','Rád bych tedy nabídl')] své nedocenitelné služby právě vám, nej#EMP laskavější#! a nej#EMP vznešenější#! [Select_CString(ROOT.Char.IsFemale,'panovnici','panovníkovi')] široko daleko.“"
 court_events.3080.a: "Budeš psát mé projevy."
 court_events.3080.b: "Tvé schopnosti by mohly prospět mým plánům..."
 court_events.3080.c: "Piš sladká slova pro mé milence!"
 court_events.3080.d: "Teď tvé schopnosti nepotřebujeme."
 court_events.3090.t: "Chci poníka!"
 court_events.3090.desc: "„[Select_CString(ROOT.Char.IsFemale,'Matko','Otče')], naučíš mě jezdit na koni? Chci být největším válečníkem všech dob!“\n\nNadšený hlas [child.GetFirstNamePossessive] mě zastihne v jedné ze vzácných chvil klidu mezi všemi mými povinnostmi. Takové ambice jsou možná trochu předčasné, ale [child.GetFirstNameNoTooltip] je koneckonců jen dítě... Co se může stát, když si chvíli budeme hrát?"
 court_events.3090.a: "Jistě, jdeme na to!"
 court_events.3090.b: "Nejdřív studium, poník potom!"
 court_events.3090.b.tt: "Když teď budeš pilně studovat, slibuji, že až vyrosteš, dostaneš toho nejlepšího válečného koně, jakého dokážu sehnat!"
 court_events.3090.b.tt_effect: "[child.GetShortUIName|U] dostane ke svým 16. narozeninám válečného koně"
 court_events.3090.c: "Na tohle nemám čas, [Select_CString(child.IsFemale,'dcero','synu')]."
 court_events.3091.desc_no_parent: "„Jako by to bylo včera: přepadnu tě, [Select_CString(parent.IsFemale,'matko','otče')], a hrdě prohlásím, že ze mě bude velký válečník... jen se nejdřív musím naučit jezdit na koni.“\n\n„Ve skutečnosti... mi šlo jen o to trávit s tebou víc času. Ty jsi ale moudře [Select_CString(parent.IsFemale,'myslela','myslel')] na mou budoucnost. Od toho dne bylo studium na prvním místě, přesně jak sis [Select_CString(parent.IsFemale,'přála','přál')]. Dnes je mi šestnáct, ale ty už tu nejsi.\n\nTeď mám válečného koně, přesně jak jsi mi tehdy [Select_CString(parent.IsFemale,'slíbila','slíbil')], na památku toho dne i na tebe.“"
 court_events.3091.desc: "Mé šestnácté narozeniny neznamenají jen vstup do dospělosti, ale také naplnění dávného slibu, který mi [Select_CString(parent.IsFemale,'dala','dal')] [Select_CString(parent.IsFemale,'má matka','můj otec')].\n\nCelé roky poctivě plním svou část dohody a pilně studuji. Vzpomene si [Select_CString(parent.IsFemale,'matka','otec')] na tu svou?\n\nJeště jsem [Select_CString(ROOT.Char.IsFemale,'pohroužena','pohroužen')] do myšlenek, když se ze zahrady objeví [parent.Custom('GetMamaPapa')|U] a za uzdu vede nádherného válečného koně. [Select_CString(parent.IsFemale,'Nezapomněla','Nezapomněl')]!"
 court_events.3091.a: "Budeš na mě [Select_CString(parent.IsFemale,'hrdá','hrdý')]!"
 court_events.3092.desc: "„Jako by to bylo včera, co jsi mě [Select_CString(child.IsFemale,'přepadla','přepadl')], [child.GetFirstName], coby [Select_CString(child.IsFemale,'malá dívenka','malý chlapec')] a hrdě [Select_CString(child.IsFemale,'prohlásila','prohlásil')], že se staneš velkým válečníkem!“\n\nS úsměvem vedu za uzdu nádherného válečného koně. „Tehdy jsem ti [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')] nejlepšího koně, jakého kdy [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] spatří, pokud budeš poctivě studovat. Pamatuješ?“\n\nÚsměv, který se [child.GetFirstNameNoTooltip] rozlije po tváři při prvním nasednutí, je veškerou odpovědí, kterou potřebuji."
 court_events.3092.a: "Není zač, [Select_CString(child.IsFemale,'dcero','synu')]!"
 court_events.3100.t: "Jazyk mého dvora"
 court_events.3100.desc: "„[Select_CString(ROOT.Char.IsFemale,'Obávaná','Obávaný')] [ROOT.Char.GetTitleAsNameNoTooltip], o vaší moci a slávě nikdo nepochybuje, ale váš dvůr má pocit, že mu nenasloucháte. Vždyť spolu ani nemluvíte stejným jazykem,“ začne nervózně [chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Možná by vám studium jazyka [ROOT.Char.GetCourtLanguage.GetName] pomohlo s vašimi lidmi najít společnou řeč? Pokud dovolíte, [Select_CString(chancellor.IsFemale,'ráda','rád')] vám s tím pomohu.“"
 court_events.3100.a: "Asi bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] pustit do studia."
 court_events.3100.b: "[linguist.GetFirstNameNoTooltip], uč mě!"
 court_events.3100.c: "Na takové nesmysly nemám čas."
 court_events.3100.a.tt: "Zahájíš [GetScheme('learn_language').GetTypeName] [Concept('scheme','intriku')|E], jejímž cílem bude [chancellor.GetShortUIName], s [GetModifier('pressured_to_learn_court_language_modifier').GetNameWithTooltip]"
 court_events.3110.t: "Nejlepší stavitel"
 court_events.3110.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] ke mně přichází s ustaraným výrazem. „Přináším znepokojivé zprávy.“\n\n„[vassal.GetTitledFirstName|U] z [vassal.GetPrimaryTitle.GetBaseNameNoTier] zvelebuje své hlavní sídlo tak působivě, že ho prostý lid začal srovnávat s [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly], a dokonce se opovažuje tvrdit, že vaše hlavní sídlo vedle něj bledne!“\n\n„Obávám se, že čest nám zachrání jedině rázná ukázka moci.“"
 court_events.3110.a: "Ukážu, kdo umí stavět lépe!"
 court_events.3110.architect: "Do práce se pouští [GetCourtPositionType('royal_architect_court_position').GetName()]"
 court_events.3110.b: "Vyměřím pořádnou pokutu."
 court_events.3110.b.tt: "Určitě se nějaké porušení zákona najde!"
 court_events.3110.c: "Tak ať si to užije."
 MODIFIER_DEFINITION_VALUE_ARCHITECT_SCALE: " \t#weak Zvýšení za každou úroveň [Concept('aptitude','způsobilosti')|E] postavy zastávající úřad [GetCourtPositionType('royal_architect_court_position').GetName()]#!"
 court_events.3110.a.success: "Tvůj stavební program začíná úspěšně"
 court_events.3110.a.failure: "Tvůj stavební program selže"
 court_events.3110.a.success.tt: "Stavební program zahájen"
 court_events.3110.a.failure.tt: "Stavební program selhal"
 court_events.3110.b.success: "Najdeš dokonalou záminku"
 court_events.3110.b.success.tt: "[vassal.GetShortUINameNoTooltip] zaplatí"
 court_events.3110.b.failure: "Nic závadného se nenajde"
 court_events.3110.b.failure.tt: "[vassal.GetShortUINameNoTooltip] nic neprovedl"
 court_events.3115.desc: "[relative.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází s ustaraným výrazem. „Přináším znepokojivé zprávy.“\n\n„[vassal.GetTitledFirstName] stojí v čele rodu [vassal.GetHouse.GetBaseName], který rozšiřuje své rodové sídlo s takovou okázalostí, že jeho moc a bohatství překonaly všechna naše očekávání. Naše vlastní sídlo vedle něj začíná blednout!“\n\n„Jestli si chceme zachovat tvář, musíme něco udělat. A rychle!“"
 court_events.3120.t: "Já bych to [Select_CString(inspired.IsFemale,'zvládla','zvládl')] lépe!"
 court_events.3120.desc: "[inspired.Custom2('MyCharacterIntroduction', ROOT.Char)|U] už nepříjemně dlouho zírá na [artifact.GetName]. Bolestný výraz ve tváři nevěstí nic dobrého.\n\n„Tak co, [inspired.GetFirstNameNoTooltip]?! Mluv!“ nakonec vybuchnu.\n\n„Omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')], [Select_CString(inspired.IsFemale,'nechtěla','nechtěl')] jsem vás obtěžovat. Jenže když se podívám na [artifact.GetType]... působí to tak... #EMP amatérsky?#! Bez lesku, bez vytříbenosti, zkrátka #EMP lacině!#! [ROOT.Char.GetTitleAsNameNoTooltip] vašeho postavení si zaslouží něco lepšího! #EMP Já bych [Select_CString(inspired.IsFemale,'dokázala','dokázal')]#! vytvořit něco lepšího...“"
 court_events.3120.a: "Tak to naprav hned teď, [inspired.GetFirstNameNoTooltip]. Věřím ti."
 court_events.3120.b: "Soustřeď se na vlastní dílo!"
 court_events.3120.c: "Ukaž mi, že to pořád zvládneš lépe!"
 court_events.3120.d: "Ani se neobtěžuj."
 artifact_improved_tt: "Artefakt vylepšen"
 court_events.3120.a.tt: "[artifact.GetName] získá #V 2#! náhodné #P bonusy#!"
 gains_weapon_inspiration_tt: "[inspired.GetShortUIName|U] získává [Concept('inspiration','inspiraci')|E] pro výrobu zbraně"
 gains_armor_inspiration_tt: "[inspired.GetShortUIName|U] získává [Concept('inspiration','inspiraci')|E] pro výrobu zbroje"
 gains_smith_inspiration_tt: "[inspired.GetShortUIName|U] získává kovářskou [Concept('inspiration','inspiraci')|E]"
 gains_weaver_inspiration_tt: "[inspired.GetShortUIName|U] získává tkalcovskou [Concept('inspiration','inspiraci')|E]"
 gains_artisan_inspiration_tt: "[inspired.GetShortUIName|U] získává řemeslnickou [Concept('inspiration','inspiraci')|E]"
