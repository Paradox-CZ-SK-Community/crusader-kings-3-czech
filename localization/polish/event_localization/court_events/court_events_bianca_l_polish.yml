l_polish:
 court.3000.t: "Nedůvěra k přátelství"
 court.3000.desc.opening: "Úzkost mi svírá žaludek, když ve mně vystrčí růžky žárlivost. Povzdechnu si a zamračím se na příčinu svého trápení.\n\n"
 court.3000.desc.opening.trustful: "Když pohlédnu ke zdroji smíchu, píchne mě u srdce žárlivost. Ten pocit dobře znám, ale není mi podobné mu takhle podléhat.\n\n"
 court.3000.desc: "Vím, že bych [Select_CString(ROOT.Char.IsFemale,'měla být ráda','měl být rád')], že si [Select_CString(foreign_guest.IsFemale,'naše hostka','náš host')] [foreign_guest.GetTitledFirstName] tak dobře rozumí s [family_member.GetName], jenže na tom, jak blízko si jsou, mě něco znepokojuje.\n\nUsmívají se na sebe jako dvě spřízněné duše – nebo jako zamilovaná dvojice. Bezostyšně se chovají, jako by v místnosti nikdo jiný nebyl, a mě bezstarostně vynechávají ze svých rozhovorů. Co mezi nimi vlastně je? A [Select_CString(ROOT.Char.IsFemale,'měla','měl')] bych s tím něco udělat?"
 court.3000.a: "#EMP Musím#! zarazit cokoli, co mezi nimi klíčí."
 court.3000.a.tt.success: "Vztah mezi [foreign_guest.GetFirstNameNoTooltip] a [family_member.GetFirstNameNoTooltip] zůstane beze změny"
 court.3000.a.tt.failure: "[foreign_guest.GetFirstNameNoTooltip] a [family_member.GetFirstNameNoTooltip] tvé přání ignorují a dál svůj vztah prohlubují"
 court.3000.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych jejich pouto podpořit, aby návštěva dobře dopadla."
 court.3000.b.tt.success: "Vztah mezi [foreign_guest.GetFirstNameNoTooltip] a [family_member.GetFirstNameNoTooltip] se prohloubí a oba ocení tvou podporu"
 court.3000.b.tt.failure: "[foreign_guest.GetFirstNameNoTooltip] a [family_member.GetFirstNameNoTooltip] tvé vměšování neocení"
 court.3000.c: "Ať už je mezi nimi cokoli, nebudu se do toho míchat."
 court.3000.c.tt.success: "Vztah mezi [foreign_guest.GetFirstNameNoTooltip] a [family_member.GetFirstNameNoTooltip] se prohloubí"
 court.3000.c.tt.neutral: "[foreign_guest.GetFirstNameNoTooltip] a [family_member.GetFirstNameNoTooltip] si budou bližší"
 court.3000.d: "[foreign_guest.GetFirstNameNoTooltip] už u mého dvora není vítán!"
 court.3000.neutral_outcome: "Náhlý zájem jednoho o druhého opadne a vše se vrátí do starých kolejí."
 court.3000.friendly_outcome: "Ti dva se možná stanou přáteli, nebo dokonce milenci..."
 court.3000.better_friends_outcome: "Ti dva se možná stanou nejlepšími přáteli – a třeba i něčím víc..."
 court.3010.t: "Inspirované dílo"
 court.3010.desc.opening: "„[ROOT.Char.Custom2('RelationToMeAddress', inspired_writer)|U]!“ [inspired_writer.GetTitledFirstName] ke mně přichází a pevně svírá rukopis. „Po přečtení literatury oblíbené u vašeho dvora jsem [Select_CString(inspired_writer.IsFemale,'napsala','napsal')] vlastní smyšlený příběh. Prosím, přijměte tu čest být prvním člověkem, který si přečte má slova!“ Přijmu rukopis a zběžně pročtu několik řádků.\n\n"
 court.3010.desc.low_learning: "Každý popis hlavního hrdiny zmiňuje jeho „velké, nádherné azurové oči“ a [inspired_writer.GetFirstNameNoTooltip] je nezapomene zdůraznit ani v těch nejméně vhodných chvílích."
 court.3010.desc.shy_or_chaste: "Očima spočinu na popisu večerní scény. Dva milenci si něžně propletou malíčky, protože se příliš stydí držet za ruce. Při procházce pod nekonečným mořem hvězd si šeptají sladká vyznání."
 court.3010.desc.lustful: "Každá věta popisující ženu je mučivě podrobná a vždy se v ní něco pohupuje nebo natřásá. Muži ovšem nepřijdou zkrátka; u nich se zase všechno točí kolem napjatých svalů a ostře řezaných brad."
 court.3010.desc.adventurer_or_pilgrim: "Dílo se soustředí na rozlehlé malebné krajiny a na to, jak se proměňují s rostoucí vzdáleností od domova. Nechybí ani pasáže o touze po dálkách a stesku po domově, očividně vycházející z vlastních zkušeností autora."
 court.3010.desc.sadistic: "Popsané násilí překračuje hranici toho, kolik krve a ohavností většina lidí snese. Vykresluje rudou krvavou scénu, v níž se rytíři brodí krví až po kolena."
 court.3010.desc.generic_fallback: "Prostředí mi připadá povědomé, stejně jako jméno hlavního hrdiny. Moment... Není to snad pokus [inspired_writer.GetFirstNamePossessiveNoTooltip] napsat pokračování či přepracování cizího díla?"
 court.3010.desc.ending: "\n\nOdkašlu si, vzhlédnu od rukopisu a setkám se s dychtivým pohledem [inspired_writer.GetFirstNameNoTooltip]."
 court.3010.a: "Propána! Tohle je... tohle je úžasné! Musíš napsat další!"
 court.3010.a.tt: "Povzbuzení tvou chválou přiměje [inspired_writer.GetFirstNameNoTooltip], aby tě v budoucnu [Select_CString(inspired_writer.IsFemale,'požádala','požádal')] o přečtení dalších děl."
 court.3010.b: "Jestli tohle stvořila tvá mysl, začínám mít obavy o tvé duševní zdraví."
 court.3010.c: "Rozhodně máš talent, ale v několika věcech je co zlepšovat."
 court.3010.c.neutral: "[inspired_writer.GetFirstNameNoTooltip], možná trochu neochotně, přijme tvé připomínky a v budoucnu může pokračovat v psaní"
 court.3010.c.stress: "[inspired_writer.GetFirstNameNoTooltip] [Select_CString(inspired_writer.IsFemale,'chtěla','chtěl')] spíš povzbuzení než kritiku – a možná ho i [Select_CString(inspired_writer.IsFemale,'potřebovala','potřeboval')]"
 court.3010.c.depression: "Tvá slova zasáhnou [inspired_writer.GetFirstNameNoTooltip] hluboko do duše"
 court.3011.desc.opening: "Zaslechnu za sebou blížící se kroky a otočím se. [inspired_writer.GetTitledFirstName] vypadá nadšením bez sebe. „[ROOT.Char.Custom2('RelationToMeAddress', inspired_writer)|U]!“ zavolá na mě dychtivě, rychle překoná vzdálenost mezi námi a zběžně skloní hlavu. „Je to hotové! První verze!“\n\nNež stačím cokoli říct, rukopis mi přistane v rukou. Letmý pohled odhalí"
 court.3011.desc.low_learning: " popisy „velkých, nádherných azurových očí“ hlavního hrdiny v těch nejméně vhodných chvílích."
 court.3011.desc.shy_or_chaste: " něžné, ale poněkud nerealistické romantické scény mezi dvěma milenci."
 court.3011.desc.lustful: " pohupující se, natřásající se a napjaté části těl propletené mezi prostěradly."
 court.3011.desc.adventurer_or_pilgrim: " rozlehlé malebné krajiny a pasáže o touze po dálkách."
 court.3011.desc.sadistic: " násilí, krev a ohavnosti."
 court.3011.desc.generic_fallback: " přepracování a pokračování jiných, slavnějších příběhů."
 court.3011.desc.ending: "\n\nJe jasné, že [inspired_writer.GetFirstNameNoTooltip] [Select_CString(inspired_writer.IsFemale,'našla','našel')] svou inspiraci."
 court.3011.a: "To je nádhera! Musíš psát dál!"
 court.3011.b.gregarious: "„[Select_CString(ROOT.Char.IsFemale,'Ráda bych tě viděla','Rád bych tě viděl')] pustit se do něčeho jiného!“"
 court.3011.b.blunt: "„Jestli budeš pořád psát totéž, nikam se neposuneš.“"
 court.3011.c: "Tvé rukopisy už číst nebudu."
 court.3011.c.tt.stop: "[inspired_writer.GetFirstNameNoTooltip] ti přestane ukazovat svá díla a zkusí něco nového"
 court.3011.c.tt.gain_inspiration: "[inspired_writer.GetFirstNameNoTooltip] získá inspiraci k napsání mistrovského díla!"
 court.3011.c.tt.hurt: "[inspired_writer.GetFirstNameNoTooltip] tvůj nedostatek podpory zraní"
 court.3020.t: "Příšerný zápach"
 court.3020.desc.opening: "„[ROOT.Char.Custom2('RelationToMeAddress', latrine_chancellor)|U]. Mohu s vámi na slovíčko?“\n\nBěhem krátké přestávky mezi dvorskými záležitostmi ke mně přistoupí [latrine_chancellor.GetTitledFirstName], můj [latrine_chancellor.GetCouncilTitle]. Pokyne směrem k méně zaplněnému koutku místnosti a já [Select_CString(latrine_chancellor.IsFemale,'ji','ho')] následuji.\n\n„Znepokojuje mě stav "
 court.3020.desc.castle: "hradu [capital.GetNameNoTooltip]. "
 court.3020.desc.city: "radnice města [capital.GetNameNoTooltip]. "
 court.3020.desc.temple: "svatostánku v [capital.GetNameNoTooltip]. "
 court.3020.desc.ending: "Při poradě v jedné z místností jsme všichni ucítili... příšerný zápach! Musel vycházet z latrín o patro níž. Prosím vás, zvažte, zda nezaplatit opravu zanedbaných částí budovy.“"
 court.3020.a: "Postarám se, aby se problém co nejdříve napravil."
 court.3020.b: "Tohle zvládne můj [latrine_steward.GetCouncilTitle]."
 court.3020.b.success: "[latrine_steward.GetFirstName] dobře smlouvá a ušetří ti peníze"
 court.3020.b.failure: "[latrine_steward.GetFirstName] nakonec utratí víc tvých peněz, než bylo nutné"
 court.3020.c: "Můj $royal_architect_court_position$ to jistě dokáže opravit bez utrácení peněz..."
 court.3020.c.success: "[royal_architect.GetFirstName] přijde s řešením, které nic nestojí"
 court.3020.c.failure: "[royal_architect.GetFirstName] nedokáže přijít na nic, co by nestálo peníze"
 court.3020.d: "Prostě ucpěte tu díru v podlaze!"
 court.3021.t: "Pozor tam dole!"
 court.3021.desc: "Má přítomnost je vyžádána kvůli urovnání hádky mezi [courtier1.GetTitledFirstName] a [courtier2.GetTitledFirstName]. Mí dvořané se dnes musí #EMP příšerně#! nudit, protože se jich přišlo dívat opravdu hodně.\n\nZatímco se ti dva přou o [courtier1.Custom('subject_of_interest')], přeruší je ohlušující rána. Všichni v místnosti kromě mě zavrávorají, když se dřevěná podlaha viditelně prohne! [ROOT.Char.GetFaith.HighGodName] nade mnou zřejmě drží ochrannou ruku, protože sedím ve výklenku, kterého se pohroma nedotkla.\n\nTi nejblíž ke dveřím vyrazí ven, zatímco ostatní mohou jen křičet, když se podlaha propadne. Pohledem těkám mezi dvěma lidmi, kteří stojí nejblíž ke mně."
 court.3021.a: "Instinktivně natáhnu ruku k [courtier1.GetFirstNameNoTooltip]."
 court.3021.b: "Vyděšenou postavu [courtier2.GetFirstNameNoTooltip] stáhnu do bezpečného výklenku."
 court.3021.c: "S hrůzou sleduji, jak se všichni propadají do latrín pod námi."
 court.3021.latrine_disaster: "Latrínová pohroma v [capital.GetNameNoTooltip]"
 court.3030.t: "Puntičkářka přes módu"
 court.3030.desc.intro: "Má vždy pozorná $lady_in_waiting_court_position$, [fussy_liw.GetFirstName], je mi neustále v patách a dbá, abych se u dvora náležitě choval i vypadal.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Prosím, jen na okamžik se nehýbejte, ať vám mohu upravit oděv!“\n\n"
 court.3030.desc.lovers: "Instinktivně se nakloním vstříc doteku [fussy_liw.GetFirstNameNoTooltip], ale zarazím se, když mi dojde, že jsme na veřejnosti. Taková péče o můj oděv není u [fussy_liw.GetFirstNameNoTooltip] ničím neobvyklým, jenže tentokrát,"
 court.3030.desc.generic: "[fussy_liw.GetFirstNameNoTooltip] zjevně vůbec nevadí, že jsme na veřejnosti, a zatímco mi upravuje oděv,"
 court.3030.desc.ending: " mám neodbytný pocit, že se mnou zachází jako s neposlušným dítětem!\n\nZatímco o tom mlčky přemítám, všimnu si přihlížejících, kteří si mezi sebou šeptají. Tohle už si žádá nějakou odpověď!"
 court.3030.a: "Udělám scénu: „Jak #EMP se opovažuješ#! sahat na #EMP mě#!!?“"
 court.3030.b: "„Takové úpravy máš dělat dřív a rychleji!“"
 court.3030.c: "Nic neřeknu. [fussy_liw.GetFirstNameNoTooltip] jen dělá svou práci."
 court.3030.d: "„Nic upravovat nemusíš.“"
 court.3031.t: "Urovnávání vztahů"
 court.3031.desc: "Během vzácné klidné chvíle u dvora jen mlčky pozoruji lidi kolem sebe, když ke mně přistoupí [liw.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('liw'))].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], mohu vás na okamžik vyrušit?“\n\n[liw.GetFirstNameNoTooltip] [liw.Custom('quirk_pos_present')] a čeká na mé svolení. Kývnu, aby [Select_CString(liw.IsFemale,'pokračovala','pokračoval')].\n\n„Při své práci si dokážu udělat docela dobrou představu o tom, co si lidé myslí a co na ně platí. Díky tomu bych [Select_CString(liw.IsFemale,'mohla','mohl')] zkusit urovnat vaše vztahy s některou skupinou, na které vám záleží. Co říkáte?“"
 court.3031.a: "Vylepši mé vztahy s vazaly z menšin."
 court.3031.b: "Přimluv se za mě mezi barony."
 court.3031.c: "Chci navázat lepší vztahy s [reference_county.GetProvince.GetCounty.GetCulture.GetCollectiveNounNoTooltip]."
 every_culture_county_3031: "Každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E] s [reference_county.GetCulture.GetName] [Concept('culture','kulturou')|E]"
 court.3031.d: "Nezajímá mě, co si ostatní myslí."
 court.3040.t: "[Select_CString(homesick_parent.IsFemale,'Mé matce','Mému otci')] se stýská po domově"
 court.3040.desc: "Když obcházím dvůr a věnuji se společenským povinnostem, znovu zaslechnu těžký povzdech. Patří [homesick_parent.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('homesick_parent'))]. Ať už je to úmyslné, nebo ne, [Select_CString(homesick_parent.IsFemale,'její','jeho')] zachmuřená přítomnost rozhodně nezůstala bez povšimnutí.\n\n„Ach, zdravím tě, dítě moje,“ pronese [homesick_parent.GetTitledFirstNameNoTooltip], jakmile opadne počáteční leknutí. Nedokážu poznat, zda jen přehrává, nebo mluví upřímně. „Prosím, nevšímej si mě. Jen se mi stýská po domově, nic víc...“\n\nAni nestačím odpovědět a ozve se další melancholický povzdech. Když beze slova odejdu, nic se nezmění, takže se rozhodnu promluvit."
 court.3040.a: "Chybí ti jen vymoženosti [homesick_parent.GetCulture.GetNameNoTooltip] kultury!"
 court.3040.a.tt: "Zvýší náhodný [Concept('court_amenity','dvorský komfort')|E] o jednu úroveň"
 court.3040.a.tt_2: "Úroveň dvorského komfortu zvýšena"
 court.3040.b: "Místo sebelítosti by ses měl něčím zaměstnat."
 court.3040.c: "Trocha dobrého humoru z [homesick_parent.GetCulture.GetNameNoTooltip] kultury ti pomůže!"
 court.3040.c.tt: "$court_jester_court_position$ z [homesick_parent.GetCulture.GetNameNoTooltip] kultury jistě dokáže [homesick_parent.GetFirstNameNoTooltip] rozesmát."
 court.3040.d: "Tvé pocity jsou tvůj problém. Netahej je k mému dvoru."
 court.3050.t: "Pomlouvačný dopis"
 court.3050.desc: "„Mám skvělý návrh pro [Select_CString(ROOT.Char.IsFemale,'svou paní','svého pána')],“ pronese spiklenecky můj $chief_eunuch_court_position$ [chief_eunuch.GetFirstName].\n\n„Jeden z vašich odpůrců, [target.GetTitledFirstName], je dnes přítomen u dvora. Pokud si to přejete, mohl bych sepsat kompromitující dopis a podstrčit ho [target.GetFirstNameNoTooltip], abychom ho pak mohli veřejně zesměšnit.“\n\n[chief_eunuch.GetFirstNameNoTooltip] se [chief_eunuch.Custom('quirk_neg_adjective')] usměje a potlačí smích. „Tak co mám do toho dopisu napsat?“"
 court.3050.a: "Připomeň [Select_CString(target.IsFemale,'té hlupačce, že znám její','tomu hlupákovi, že znám jeho')] tajemství. Ať se zapotí."
 court.3050.b: "Zfalšuj odmítavý dopis, který [target.GetTitledFirstNameNoTooltip] zesměšní jako naprosto nežádoucí partii."
 court.3050.c: "Podstrč důkaz, že [target.GetFirstNameNoTooltip] pomlouvá někoho jiného."
 court.3050.d: "Tentokrát raději nebudeme kalit vody."
 court.3060.t: "Kočičí lovec"
 court.3060.desc: "„Myslím, že už vím, proč je některé dny krys mnohem méně!“ radostně prohlásí [cat_finder.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('cat_finder'))], a ustoupí stranou. Za [Select_CString(cat_finder.IsFemale,'ní','ním')] stojí sluha a v náručí drží #EMP velmi#! nespokojenou kočku.\n\nZmítá se ve snaze uniknout z jeho poškrábaných paží a přitom docela roztomile mňouká.\n\n„[Select_CString(cat_finder.IsFemale,'Řekla','Řekl')] bych, že tahle lovkyně krys je opravdu úspěšná! Při nálezu zrovna zápasila s jednou pořádně tlustou! Co myslíte, ujmeme se jí?“"
 court.3060.a: "Kočičí společnost by se mi líbila!"
 court.3060.b: "Když jsi ji [Select_CString(cat_finder.IsFemale,'našla','našel')], vezmi si ji ty."
 court.3060.c: "Nemohli bychom raději vycvičit některého psa na lov krys?"
 court.3060.d: "Tentokrát žádnou kočku."
 court.3070.t: "[Select_CString(ROOT.Char.IsFemale,'Neznámá','Neznámý')] [ROOT.Char.GetTitleTierName|l]"
 court.3070.desc.opening: "„A tomu, co se stalo potom, snad ani nebudete věřit!“ [Select_CString(court_enjoyer.IsFemale,'Má hostka','Můj host')] [court_enjoyer.GetTitledFirstName] nepřestává vyprávět o sobě a o všem, co [Select_CString(court_enjoyer.IsFemale,'ji','ho')] v životě potkalo. Nekonečné žvanění je samo o sobě únavné, ale ještě nepříjemnější je familiárnost, s jakou se mnou [court_enjoyer.GetTitledFirstName] jedná.\n\nPokusím se omluvit s tím, že se musím věnovat jiným záležitostem a lidem, ale [court_enjoyer.GetTitledFirstName] mě přeruší a zeptá se, jakou tu mám práci, nebo jestli jsem [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] jen "
 court.3070.desc.opening_food: "pochutnat si na dobrém jídle jako každý jiný host."
 court.3070.desc.opening_lodging: "užít si přepychové postele jako každý jiný host."
 court.3070.desc.opening_fashion: "na jeden den se oblékat jako [ROOT.Char.GetTitleAsNameNoTooltip], stejně jako každý jiný host."
 court.3070.desc.opening_servants: "nechat se na jeden den obskakovat jako [ROOT.Char.GetTitleAsNameNoTooltip], stejně jako každý jiný host."
 court.3070.desc.middle: "\n\nV němém úžasu ze sebe nakonec dostanu: „Já #EMP jsem [ROOT.Char.GetTitleAsNameNoTooltip]#!...!“\n\n[court_enjoyer.GetTitledFirstName] zbledne jako stěna a začne koktat.\n\n„P-přijměte mou nejhlubší omluvu, [ROOT.Char.Custom('FormOfAddressForLiege')]! Přísahám, že jsem [Select_CString(court_enjoyer.IsFemale,'nepřišla','nepřišel')] jen proto, abych se [Select_CString(court_enjoyer.IsFemale,'přiživovala','přiživoval')] na vašem bohatství a "
 court.3070.desc.closing_food: "[Select_CString(court_enjoyer.IsFemale,'jedla','jedl')] jako [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court.3070.desc.closing_lodging: "[Select_CString(court_enjoyer.IsFemale,'bydlela','bydlel')] v tom nejlepším ubytování v celém panství!"
 court.3070.desc.closing_fashion: "[Select_CString(court_enjoyer.IsFemale,'obklopovala','obklopoval')] se těmi nejmódnějšími lidmi v celém panství!"
 court.3070.desc.closing_servants: "[Select_CString(court_enjoyer.IsFemale,'nechala','nechal')] služebnictvo během krátkého pobytu plnit každé své přání!"
 court.3070.desc.closing: "Přísahám! Jenže... o pověsti vašeho dvora se mluví mnohem víc než o tom, jak vlastně vypadáte, [ROOT.Char.Custom('FormOfAddressForLiege')]!“"
 court.3070.a: "Možná si mě zapamatují, když z tebe udělám odstrašující příklad!"
 court.3070.b: "Rozhlaš, že jsem pohostinný hostitel."
 court.3070.c: "Zavedu pro hosty povinnou zkoušku. Kdo ji nesloží, nezůstane..."
 court.3070.d: "Mně... vlastně nevadí, že ne každý ví, kdo jsem."
