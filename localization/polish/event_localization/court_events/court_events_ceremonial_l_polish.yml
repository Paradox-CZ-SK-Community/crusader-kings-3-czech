l_polish:
 ceremonial_petition_prefix: "Obřadní žádost:"
 court_ceremonial.1000.t: "$ceremonial_petition_prefix$ Podpora regenta"
 court_ceremonial.1000.opening: "[petition_vassal.GetTitledFirstName] předstoupí před shromážděný dvůr a hluboce se ukloní, zatímco mi služebnictvo předá vlastnoručně sepsanou žádost.\n\n[petition_vassal.GetTitledFirstName] promluví jasně a bez okolků: „[Select_CString(petition_liege.IsFemale,'Vznešená','Vznešený')] [petition_liege.GetTitleAsName], dnes před vás pokorně předstupuji s prosbou o přímluvu v důležité záležitosti.“\n\n"
 court_ceremonial.1000.desc: "„Jako hlava rodu, který je hrdý na to, že pokorně a věrně slouží [petition_vassal.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip], a jako [Select_CString(petition_vassal.IsFemale,'hrdá členka','hrdý člen')] dynastie [petition_vassal.GetDynasty.GetName] vás žádám o podporu, abych se [Select_CString(petition_vassal.IsFemale,'stala','stal')] [Concept('regent','regentem')|E] panství.“"
 court_ceremonial.1000.a: "Tvou upřímnou žádost milostivě přijímám."
 court_ceremonial.1000.b: "Možná kdybys na oplátku [Select_CString(petition_vassal.IsFemale,'podpořila','podpořil')] [ROOT.Char.GetConfederation.GetName]?"
 court_ceremonial.1000.c: "Na královskou přízeň se nezapomíná."
 court_ceremonial.1000.d: "Jistě máš na oplátku co štědře nabídnout."
 court_ceremonial.1000.e: "To nebude možné."
 court_ceremonial.1000.f: "Ano, výměnou za služby [knight.GetFirstNameNoTooltip]."
 court_ceremonial.1000.g: "Z [monk.GetFirstNameNoTooltip] by [Select_CString(monk.IsFemale,'byla','byl')] vynikající [GetTrait('devoted').GetName(monk)]."
 court_ceremonial.1000.h: "Nejprve vyrovnejme naše staré závazky."
 court_ceremonial.1100.t: "$ceremonial_petition_prefix$ Podpora [Concept('governorship','guvernérství')|E]"
 court_ceremonial.1100.desc: "„Jako hlava rodu, který je hrdý na to, že pokorně a věrně slouží [petition_vassal.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip], a jako [Select_CString(petition_vassal.IsFemale,'hrdá členka','hrdý člen')] dynastie [petition_vassal.GetDynasty.GetName] vás žádám o královskou podporu, aby členové mého rodu mohli sloužit jako [Concept('governors','guvernéři')|E].“"
 court_ceremonial.1200.t: "$ceremonial_petition_prefix$ Královský sňatek"
 court_ceremonial.1200.desc: "„Jako hlava jednoho z nejvýznamnějších rodů v [Concept('realm','panství')|E] a [Select_CString(petition_vassal.IsFemale,'hrdá členka','hrdý člen')] dynastie [petition_vassal.GetDynasty.GetName] vás žádám o formální souhlas se sňatkem s vaším nejvznešenějším a posvěceným [Concept('house','rodem')|E].“"
 court_ceremonial.1300.t: "$ceremonial_petition_prefix$ Důstojnost rodu [petition_vassal.GetHouse.GetBaseNameNoTooltip]"
 court_ceremonial.1300.desc: "„Jako hlava jednoho z nejvýznamnějších rodů v [Concept('realm','panství')|E] a [Select_CString(petition_vassal.IsFemale,'hrdá členka','hrdý člen')] dynastie [petition_vassal.GetDynasty.GetName] vás žádám o formální uznání vznešeného původu a rodokmenu mého [Concept('house','rodu')|E] mezi [petition_vassal.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] šlechtou.“"
