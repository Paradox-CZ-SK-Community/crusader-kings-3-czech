l_polish:
 court_6000_all_courtiers_and_guests: "Všichni tvoji [Concept('courtiers','dvořané')|E] a [Concept('guests','hosté')|E]"
 court.6000.t: "Tajné dějiny"
 court.6000.desc_opening: "Když vejdu do místnosti, [courtier.GetFirstName] překvapeně vyjekne a naprosto mě tím zaskočí. Až dosud [Select_CString(courtier.IsFemale,'byla zcela začtená','byl zcela začtený')] do rukopisu s názvem „Tajné dějiny: [ROOT.Char.GetPrimaryTitle.GetNameNoTier]“."
 court.6000.desc_liege: "\n\n„Ale... [SCOPE.sC('courtier').Custom2('RelationToMe', ROOT.GetCharacter)]!“"
 court.6000.desc_family: "\n\n„[SCOPE.sC('courtier').Custom2('RelationToMe', ROOT.GetCharacter)]!“"
 court.6000.desc_ending: "„Není na tom nic podezřelého! Vůbec nic!“ zní zoufalá obhajoba, zatímco se marně snaží ukrýt inkriminovanou věc pod oděv. \n\nKdyž se mi podaří vyrvat knihu z rukou, s úžasem nacházím stránku za stránkou podrobného líčení nejrůznějších nepravostí, které se údajně děly na dvoře [Select_CString(predecessor.IsFemale,'mé předchůdkyně','mého předchůdce')] a s [Select_CString(predecessor.IsFemale,'jejím','jeho')] požehnáním!"
 court.6000.a: "#EMP NEHORÁZNOST!#! Kdo mohl napsat tak nestydaté lži?"
 court.6000.a.tt: "Pošleš svého špehmistra, aby věc prošetřil"
 court.6000.b: "Óóó, šťavnaté drby!"
 court.6000.b.tt: "Možná odhalíš něčí #EMP pikantní#! minulost"
 court.6000.c: "Všichni si zaslouží znát pravdu! [predecessor.GetTitledFirstNameNoTooltip] přece nemůže uniknout soudu dějin!"
 court.6000.c.tt: "[Select_CString(predecessor.IsFemale,'Byla to odporná tyranka, nehodná','Byl to odporný tyran, nehodný')] mé dynastie! Řeknu vám #EMP přesně#!, co si myslím o [Select_CString(predecessor.IsFemale,'té zbabělé prašivce','tom zbabělém prašivci')]..."
 court.6000.d: "Jaká nuda. Je mi to úplně jedno."
 court.6000.e.tt: "Zahájíš vlastní vyšetřování"
 court.6000.f: "Je to všechno pravda. Přesto musíme odpustit a zapomenout."
 court.6002.desc: "Mám nos zabořený v korespondenci se zahraničím, když do místnosti vtrhne [spymaster.GetTitledFirstName] a za sebou vleče [author.GetTitledFirstName], [Select_CString(author.IsFemale,'která','který')] vypadá vyděšeně. \n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], konečně je tu [author.GetTitledFirstName]! Tohle je člověk, který napsal tu hanebnou knihu plnou lží. A jejím terčem je [predecessor.GetTitledFirstName]!“"
 court.6002.b.desc_opening: "Poslední měsíce věnuji každou volnou chvíli pátrání po nepolapitelné zmiji, která šíří knihu o prohřešcích předchozí vlády."
 court.6002.b.desc_ending: "Po mnoha bezesných nocích konečně vím, kdo za tím stojí: [author.GetTitledFirstName]! \n\nKdyž přede mnou stojí a třese se při čekání na rozsudek, pečlivě zvažuji, co říct dál."
 court.6002.a: "Styď se za své hanebné lži!"
 court.6002.a.tt: "Ať raději odvolá svá tvrzení a kaje se, jinak..."
 COURT_OF_NO_SECRETS_VALUE: "Pronásledovaná opozice"
 court.6002.a.tt2: "Účinnost $task_find_secrets$ tvého špehmistra se na 15 let zvýší."
 court.6002.b: "Stráže, zatknout!"
 court.6002.c: "Tohle už je opravdu za hranou, [author.GetFirstNameNoTooltip]..."
 court.6002.d: "Ten tvůj deníček přece neměl nikomu ublížit, viď?"
 court.6003.desc: "Už uplynuly měsíce, ale [spymaster.GetTitledFirstName] stále nepřináší žádnou významnou zprávu o pokroku ve zvláštní misi: vypátrat, kdo napsal ten prokletý hanebný rukopis podrobně líčící tajné nepravosti předchozí vlády! \n\nKdyž se [spymaster.GetFirstNameNoTooltip] konečně dostaví na mé předvolání, nervozita a pocit viny jsou zjevné. „[ROOT.GetLadyLord]! [Select_CString(spymaster.IsFemale,'Hledala','Hledal')] jsem všude možně, ale osoba, která tu knihu napsala, zmizela! Možná už na dvoře není, možná má něčí ochranu, nebo-“ \n\nMávnutím ruky ten proud výmluv zarazím."
 court.6003.b.desc_ending: "\n\nMé nejlepší úsilí bohužel přišlo vniveč. Odpovědná osoba jako by se vypařila a stopa úplně vychladla. Asi se nikdy nedozvím pravdu."
 court.6003.a: "Nevadí. Nebylo to tak důležité."
 court.6003.b: "Tohle je velké zklamání."
 court.6003.c: "Vy neschopné #EMP pijavice#! celou dobu někoho kryjete, že?"
 court.6003.c.tt: "Oboříš se na své dvořany"
 court.6003.d: "Víc se asi dělat nedalo, [spymaster.GetTitledFirstNameNoTooltip]..."
 court.6003.e: "Když pátrání selhalo, odneseš to ty!"
 court.6010.t: "Prorok v síních"
 court.6010.desc: "„#EMP KAJTE SE JEŠTĚ DNES!#! POZNEJTE TU NEJPRAVDIVĚJŠÍ PRAVDU! VSTUPTE DO SVĚTLA!“ \n\n[preacher.GetTitledFirstName] už nějakou dobu pobývá na mém dvoře a neúnavné pokusy obrátit všechny na cizácký kult se staly kulisou mého každodenního života.\n\nDnem i nocí obchází nádvoří, křižuje chodby a v temných koutech číhá na nic netušící kolemjdoucí, na něž pak spouští neodbytný jekot ve snaze je #EMP přesvědčit#!. \n\nMoji dvořané jsou vyčerpaní a poté, co mě [preacher.GetFirstNameNoTooltip] přepadne cestou k nočníku, začínám jejich nespokojenost chápat."
 court.6010.a: "Tohle a ještě víc dokážeme snést. [preacher.GetFirstNameNoTooltip] přece nikomu neublíží."
 court.6010.b: "Vyhoďte [Select_CString(preacher.IsFemale,'tu pomatenou kazatelku','toho pomateného kazatele')] z mého dvora!"
 court.6010.c: "Ať si klidně káže krysám, mně je to jedno..."
 court.6010.c.tt: "[preacher_liege.GeTitledFirstName] z toho nebude mít radost."
 court.6010.c.tt2: "[Concept('councillor_task','Úkol rádce')|E] $task_conversion$ [chaplain.GetCouncilTitlePossessive|U] je po dobu 20 let #P účinnější#! v hrabstvích, kde se vyznává [preacher.GetFaith.GetName]"
 court.6010.c.tt3: "[Concept('councillor_task','Úkol rádce')|E] $task_conversion$ [chaplain.GetCouncilTitlePossessive|U] je po dobu 20 let #N méně účinný#! v hrabstvích, kde se vyznává [preacher.GetFaith.GetName]"
 court.6010.a_every_county: "Každé [Concept('county','hrabství')|E] ve tvém [Concept('realm','panství')|E], kde se vyznává [preacher.GetFaith.GetName] ([preacher_faith_counties_size])"
 court_6010_harsh_conversions: "Přísné konverze"
 court_6010_tolerant_conversions: "Tolerantní přístup"
 court.6010.d: "DOST toho #EMP ROUHÁNÍ#!!"
 court_6010_all_courtiers_and_guests_faith: "Všichni tvoji [preacher.GetFaith.GetAdjectiveNoTooltip] [Concept('courtiers','dvořané')|E] a [Concept('guests','hosté')|E]"
 court.6011.desc_opening: "[preacher_liege.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 court.6011.desc_prisoner: "Doslechlo se ke mně, že jsi nedávno [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] uvěznit jednoho z mých poddaných jen za to, že na tvém dvoře kázal svou víru - #EMP mou vlastní víru#!. \n\nVěřím, že jde jen o nedorozumění a že situaci okamžitě napravíš, jinak bych si [Select_CString(preacher_liege.IsFemale,'mohla','mohl')] tvé úmysly vyložit nesprávně."
 court.6011.desc_executed: "S velkým zděšením jsem se [Select_CString(preacher_liege.IsFemale,'dozvěděla','dozvěděl')], že jsi nedávno [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] popravit osobu, která mi podléhala a pobývala na tvém dvoře, jako nebezpečného kacíře. \n\n[Select_CString(preacher_liege.IsFemale,'Ráda bych věřila','Rád bych věřil')], že šlo o nedorozumění a že ses mě #EMP opravdu#! [Select_CString(ROOT.Char.IsFemale,'nesnažila','nesnažil')] urazit a zpochybnit mou víru."
 court.6011.a: "Urážka nebyla mým úmyslem. Přijmi prosím tuto náhradu."
 court.6011.b: "Tví kazatelé v přestrojení nejsou na mém dvoře vítáni."
 court.6020.t: "Posedlost u dvora"
 court.6020.desc_opening: "Stav, v němž se [possessed_char.GetTitledFirstName] nachází, je stejně záhadný jako děsivý."
 court.6020.desc_chaplain: "\n\n[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetTitledFirstName] tvrdí, že"
 court.6020.desc_no_chaplain: "\n\nObecně se soudí, že"
 court.6020.desc_middle: "v těle [possessed_char.GetTitledFirstNameNoTooltip] sídlí temná bytost, která se čas od času projeví nezvladatelnou silou. Četnost a intenzita těchto záchvatů však mezi mými oddanými dvořany vyvolává stále větší obavy. Panuje strach, že zlá přítomnost nakonec převezme vládu a rozsévá mezi námi chaos a smrt."
 court.6020.desc_physician: "\n\n[court_physician.GetTitledFirstName] mě však ujišťuje, že"
 court.6020.desc_no_physician: "\n\n"
 court.6020.desc_ending: "od [possessed_char.GetFirstNameNoTooltip] dosud žádné nebezpečí #EMP samo o sobě#! nehrozilo, ale moji dvořané trvají na tom, že je třeba něco udělat."
 court.6020.a: "[court_chaplain.GetTitledFirstNameNoTooltip], vyžeň toho démona!"
 court.6020.a.success: "Exorcismus, který provede [court_chaplain.GetFirstNameNoTooltip], se zdaří"
 court.6020.a.success.tt: "Díky pravidelným exorcismům, které drží zlo v šachu, se stav [possessed_char.GetTitledFirstNameNoTooltip] zlepšuje a tvoji dvořané jsou spokojení"
 court.6020.a.failure: "Exorcismus, který provede [court_chaplain.GetFirstNameNoTooltip], selže"
 court.6020.a.failure.tt: "Stav [possessed_char.GetTitledFirstNameNoTooltip] se nezmění"
 court.6020.b: "Nebojte se! Je to znamení přízně bohů!"
 court.6020.c: "Moc tohoto svatého předmětu určitě pomůže!"
 court.6020.c.tt: "Říká se, že [6020_relic.GetNameNoTooltip] dokáže vyléčit každý neduh"
 court.6020.d: "[court_physician.GetTitledFirstNameNoTooltip], neznáš nějakou bylinu, která by mohla zabrat?"
 court.6020.d.tt: "[court_physician.GetFirstNameNoTooltip] využije své lékařské zkušenosti a stav [possessed_char.GetTitledFirstNameNoTooltip] se zlepší"
 court.6020.d.tt.2: "[court_physician.GetFirstNameNoTooltip] vyzkouší bylinnou směs"
 court.6020.e: "Je to jen nemoc mozku. Co myslíš, [court_physician.GetFirstNameNoTooltip]?"
 court.6020.f: "Nechme to být."
 court.6020.b.tt: "#EMP Prorocké vize#! jsou považovány za velkou výhodu pro $court_poet_court_position$, $court_musician_court_position$ nebo $cave_hermit_court_position$"
 court_6020_all_courtiers_and_guests_christian: "Všichni tvoji [Concept('courtiers','dvořané')|E] a [Concept('guests','hosté')|E] stejného náboženství"
 court_6020_all_courtiers_or_guests_polith: "Všichni ostatní tvoji (necyničtí) [Concept('courtiers','dvořané')|E] a [Concept('guests','hosté')|E]"
 court.6030.t: "Balada o [Select_CString(ROOT.Char.IsFemale,'česnekové královně','česnekovém králi')]"
 court.6030.desc: "„#EMP V našem městečku se historka povídá,\no [Select_CString(ROOT.Char.IsFemale,'královně','králi')] s česnekovou korunou,\nna oslu [Select_CString(ROOT.Char.IsFemale,'vyrazila','vyrazil')] do boje, kořistí měli být [ROOT.Char.Custom('GetUnbelieverNamePlural')],\nale jediným úspěchem byla malá opice...#!“\n\nTahle prokletá balada se stala nesmírně oblíbenou mezi potulnými pěvci i prostým lidem - na můj vkus #EMP až příliš oblíbenou#!, zvlášť od chvíle, kdy jsem si [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')] znepokojivého množství podobností mezi sebou a její hlavní postavou... Ale poslouchat, jak mi ji bezostyšně zpívá přímo do tváře [6030_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)], to už je příliš!"
 court.6030.a: "Ale vždyť #EMP je#! to tak legrační!"
 court.6030.b: "To je #EMP tak#! trapné..."
 court.6030.c: "#EMP PŘIPADÁ TI TO LEGRAČNÍ?!#!"
 court.6030.d: "Tohle je #EMP nepřijatelné#!."
 court.6030.d.tt: "Zakážeš baladu zpívat a každému, kdo zákaz poruší, pohrozíš uvězněním"
 court.6030.e: "Už. To. NEVYDRŽÍM!"
 court.6030.e.tt: "Až tě příště někdo vyprovokuje zpěvem té pitomé balady, schytá několik ran"
 court.6030.f: "Jednou s tím přece musí přestat... ne?"
 court.6040.t: "Život na cizí účet"
 court.6040.desc: "[scrounger.GetTitledFirstName|U] se stává stálou součástí mého dvora - a #EMP nákladnou#!. Vlastně i #EMP objemnou#!.\n\nNechybí na žádné hostině, zhltne všechno, co má na dosah, a přitom naříká nad prázdnou vlastní spíží. „Podáváš ty nejlepší nápoje, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ ozve se po dalším korbelu mého nejlepšího [ROOT.Char.Custom('GetExpensiveDrink')]. „Jsi ze všech nejvíc #EMP [SCOPE.Custom('PersonalityGetSharedTraitDescriptionFromFlag')]#!, ze všech nejvíc #EMP [ROOT.Char.Custom('ComplimentAdjective')]#!, zkrátka #EMP NEJLÉPE VYPADAJÍCÍ#! [ROOT.Char.GetLadyLord]!“ zazní nakonec a už se natahuje ruka po další půjčce, která se mi nikdy nevrátí.\n\nJe to otravná díra na peníze, ale ty přehnané výstupy jsou docela zábavné."
 court.6040.a: "Když už jsi pořád tady, můžeš být aspoň k něčemu!"
 court.6040.b: "Když to vezmu kolem a kolem, je s tebou docela legrace!"
 court.6040.c: "Odveďte mi tu pijavici z očí."
 court.6041.desc: "Uplynulo několik měsíců od chvíle, kdy jsem [Select_CString(ROOT.Char.IsFemale,'dovolila','dovolil')] [scrounger.GetTitledFirstName], aby se dál [Select_CString(scrounger.IsFemale,'přiživovala','přiživoval')] na mém dvoře.\n\nNedalo se čekat nic víc než obvyklé přehnané historky o bídě a směšně přebujelé lichotky, ale v poslední době si všímám, že příběhy jsou čím dál zábavnější, rýmy ostřejší a lichotky příjemnější.\n\nJak moji dvořané, tak hosté ze zahraničí se těmi obratně volenými slovy skvěle baví. Že by [scrounger.GetFirstNameNoTooltip] konečně [Select_CString(scrounger.IsFemale,'našla','našel')] nějaké užitečné poslání?"
 court.6041.a: "Tak přece jen k něčemu jsi!"
 court.6041.b: "... ale vsadím se, že zvládneš ještě víc!"
 court.6041.b.failure: "Ani přes veškerou snahu už [scrounger.GetFirstNameNoTooltip] zřejmě nedokáže překonat hranice svých schopností"
 court.6041.b.success: "[scrounger.GetFirstNameNoTooltip] získá inspiraci k velkému dílu"
 court.6041.b.failure.tt: "[scrounger.GetFirstNameNoTooltip] už se nedokáže dál zlepšit"
 court.6041.b.success.tt: "[scrounger.GetFirstNameNoTooltip] získá inspiraci!"
 court.6041.c: "Už jsem s tebou [Select_CString(ROOT.Char.IsFemale,'ztratila','ztratil')] dost času."
 court.6050.t: "Peprná četba"
 court.6050.desc_opening: "V poslední době si nemohu nevšímat hloučků chichotajících se dívek a jindy přísných válečníků, kteří se scházejí v temných zákoutích a jako uhranutí poslouchají předčítání z jakési knihy. \n\nDnes už ale není úniku: [courtier.GetTitledFirstName] stojí přede mnou s knihou v rukou."
 court.6050.desc_byz: "Ačkoli obálka předstírá, že jde o zbožnou modlitební knihu, ve skutečnosti je to prostopášný román, který před staletími sepsali naši pohanští předkové! Je v něm krásná dívka, piráti, pokušení a jedna stránka za druhou překypuje chlípností a bezbožnými touhami..."
 court.6050.desc_islam: "Při letmém prolistování nacházím piráty, spoře oděné dívky, krále posedlé přepychem, chlípné a proradné královny, a dokonce i pouličního otrapu, který díky džinovi zbohatne a ožení se s princeznou..."
 court.6050.desc_sonetti: "Stránka za stránkou je zaplněna poezií, půvabnou formou, ale chlípného obsahu. Andělská krása všemožných žen je opěvována něžnými slovy, která však sotva dokážou zakrýt básníkovy velmi pozemské touhy..."
 court.6050.desc_chaucer: "Všechno jsou to příběhy poutníků na cestě. O spáse jejich duší se však nemluví - zato o krvavých vraždách a nevěrných manželkách ano..."
 court.6050.desc_generic: "Je to očividně prostopášný text, až po okraj napěchovaný smyslným pokušením, pozemským sváděním a vláčnými ňadry..."
 court.6050.desc_ending: "\n\nMlčky přemýšlím, jak asi zareaguje [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName], zatímco [courtier.GetFirstNameNoTooltip] mě úzkostlivě pozoruje."
 court.6050.a: "Mé nebohé oči!"
 court.6050.b: "Očistěte je ohněm!"
 court.6050.b.tt: "Necháš spálit všechny výtisky skandálního textu a zakážeš jej na svém dvoře"
 court.6050.b.tt.2: "Děti vychovávané na tvém dvoře s větší pravděpodobností získají rys [GetTrait('pensive').GetName( GetNullCharacter )], [GetTrait('chaste').GetName( GetNullCharacter )] nebo [GetTrait('zealous').GetName( GetNullCharacter )]"
 court.6050.c: "Kultura má mnoho podob. Ať si čtou."
 court.6050.c.tt: "Děti vychovávané na tvém dvoře s větší pravděpodobností získají rys [GetTrait('curious').GetName( GetNullCharacter )], [GetTrait('lustful').GetName( GetNullCharacter )] nebo [GetTrait('cynical').GetName( GetNullCharacter )]"
 court.6050.c.unlock_text: "Tato možnost je dostupná díky vysoké [Concept('learning','Učenosti')|E]"
 court.6050.d: "Uhhh, to je peprné!"
 court.6050.e: "Proč zůstávat jen u čtení, [courtier.GetFirstNameNoTooltip]?"
 court.6050.e.tt: "Necháš se četbou inspirovat"
 court.6050.f: "Ať to zmizí a budu předstírat, že se nic nestalo."
 court_6050_courtiers_or_guests: "Všichni tvoji [Concept('courtiers','dvořané')|E] a [Concept('guests','hosté')|E], kteří nejsou cudní"
 court.6060.t: "Radosti vína"
 court.6060.desc_opening: "Do trůnního sálu náhle vpadnou [court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstName] a [court_physician.Custom2('MyCharacterIntroduction', ROOT.Char)] a hlasitě se přou.\n\n„[ROOT.Char.GetFaith.HighGodName] víno zavrhuje! #EMP Musíme#! se mu vyhýbat!“ ječí [court_chaplain.GetFirstNameNoTooltip].\n\n„Trocha vína tělu prospívá!“ opáčí [court_physician.GetFirstNameNoTooltip]."
 court.6060.desc_drunkard_courtier: "\n\nZ kouta místnosti se do debaty vloží [courtier_drunkard.GetTitledFirstName]: „Jediné množství vína, které člověku prospívá, je #EMP VŠECHNO#!!“"
 court.6060.desc_ending: "\n\nJaký postoj k vínu zaujmu já?"
 court.6060.a: "Víno otevírá dveře! [ROOT.Char.GetFaith.DevilName] jen čeká!"
 court.6060.b: "Trocha vína udržuje tělesné šťávy v rovnováze."
 court.6060.c: "[courtier_drunkard.GetFirstNameNoTooltip|U], připijme si!"
 court.6060.c.tt: "[courtier_drunkard.GetFirstNameNoTooltip|U] vytáhne své tajné zásoby!"
 court.6060.c.tt.2: "Díky zásobám vína od [courtier_drunkard.GetFirstNamePossessiveNoTooltip] jsou náklady na dvorské stravování po dalších 10 let o 50 % nižší."
 court.6060.d: "Odpověď je na dně tohohle poháru!"
 court.6070.t: "Význam písma"
 court.6070.desc: "Cítím na sobě odsuzující pohledy všech svých dvořanů, zatímco roztřeseným perem a nejistou rukou pomalu a opatrně podepisuji nový výnos. \n\nSamozřejmě, #EMP podepisuji#! je silné slovo. Ve skutečnosti jen obtahuji písmena vyrytá do dřevěné destičky - a i to se mi sotva daří. Dnes se na mě dokonce i [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)] dívá s výrazem, v němž se podle všeho mísí lítost se znechucením. \n\nNež stihnu pokárat [tutor_6070.GetTitledFirstNameNoTooltip] za nedostatek úcty, zazní nadějným tónem: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], možná už nastal čas naučit se pořádně číst a psát?“"
 court.6070.a: "Nauč mě to #EMP hned teď#!!"
 court.6070.a.success: "Úspěšně se naučím číst a psát"
 court.6070.a.failure: "Naučit mě číst a psát je marná snaha"
 court.6070.a.tt.1: "Už se mi nikdo nebude smát"
 court.6070.a.tt.2: "Budu muset najít jiné řešení"
 court.6070.b: "Čmárání perem je pro budižkničemy a slabochy!"
 court.6070.c: "Budu dál předstírat, že si jejich pohledů nevšímám."
 court.6070.d: "Já #EMP umím#! psát, děkuji pěkně!"
 court.6070.d.tt: "Když to řeknu dost přesvědčivě, možná mi uvěří..."
 court.6070.d.tt.success: "Tu nestydatou lež mi spolknou!"
 court.6070.d.tt.failure: "Okamžitě mou lež prohlédnou"
 every_courtier_or_guest_6070_learning: "Všichni tvoji gramotní [Concept('courtiers','dvořané')|E] a [Concept('guests','hosté')|E]"
 court.6071.desc: "#EMP M...i...l...ý p...ř...í...t...e...l...i,#!\n\n„Ano, to vypadá dobře!“\n\nPod přísným dohledem [tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)] jsem [Select_CString(ROOT.Char.IsFemale,'strávila','strávil')] bezpočet hodin procvičováním abecedy a zdá se, že veškerá námaha konečně přinesla ovoce! Zahraniční korespondence, zprávy rádců ani sliby vazalů přede mnou už nic neskrývají! \n\nPodejte mi pero - chci toho podepsat víc!"
 court.6071.a: "Jsem prostě příliš [Select_CString(ROOT.Char.IsFemale,'chytrá','chytrý')]."
 court.6071.b: "[tutor_6070.GetFirstNameNoTooltip] si zaslouží odměnu."
 court.6071.b.tt: "Způsobilost [tutor_6070.GetFirstNameNoTooltip] ve funkci $court_tutor_court_position$ se zvýší."
 court_language_teacher_desc: "Výuka psaní pro vládce"
 court.6072.desc: "#EMP M...a...l...ý p...í...ř...t...e...l...y,#!\n\n„Jen se podívej! Jde mi to skvěle, že?“\n\n[tutor_6070.Custom2('MyCharacterIntroduction', ROOT.Char)|U] si beznadějně povzdechne a zavrtí hlavou. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], nebylo by lepší místo podpisu používat tuhle krásnou, lesklou pečeť?“\n\nZdá se, že [tutor_6070.GetFirstNameNoTooltip] není [Select_CString(tutor_6070.IsFemale,'spokojená','spokojený')] s #EMP úžasnými#! pokroky, kterých při učení čtení a psaní dosahuji."
 court.6072.a: "Písmena jsou stejně k ničemu! A teď mi vrať [ROOT.Char.Custom('child_object_of_interest_random')]!"
 court.6072.a.tt: "Na nikoho to neudělá dojem"
 court.6072.b: "Dobrá, co #EMP přečtu#!, to honosně opatřím pečetí."
 court.6072.b.tt: "Vypadá to sice působivě, ale nezakryje to skutečnost, že nečteš, co vlastně pečetíš"
 court.6072.c: "Za všechno můžeš ty, [tutor_6070.GetFirstNameNoTooltip]!"
 court.6080.t: "Štědrost [6080_visitor.GetFirstNameNoTooltip]"
 court.6080.desc: "V posledních několika dnech pobývá na mém dvoře [6080_visitor.GetTitledFirstName], [Select_CString(6080_visitor.IsFemale,'která se cestou zastavila','který se cestou zastavil')] kvůli nějaké záležitosti, možná návštěvě posvátného místa či něčemu podobnému."
 court.6080.desc_middle: "\n\nOd svého příchodu mě [6080_visitor.GetTitledFirstNameNoTooltip] zastiňuje štědrostí vůči mým vlastním dvořanům, kteří se bez špetky důstojnosti vrhají po každé nabízené minci! Když už poněkolikáté vidím [6080_visitor.GetTitledFirstNameNoTooltip] obklopeného davem obdivovatelů, neubráním se pohrdavému odfrknutí. #EMP Mých#! dvořanů.\n\n„Měšec pro tebe, [beneficiary_1.GetFirstName]!“"
 court.6080.desc_liege: "V posledních několika dnech pobývá na mém dvoře [Select_CString(6080_visitor.IsFemale,'má lenní paní','můj lenní pán')] [6080_visitor.GetTitledFirstName] v rámci svého [GetActivityType('activity_tour').GetName]."
 court.6080.desc_2: "„A pár mincí i pro tebe, [beneficiary_2.GetFirstName]!“"
 court.6080.desc_3: "„A pro tebe, [beneficiary_child.GetFirstName], sladké medové koláčky!“"
 court.6080.desc_end: "„Pamatujte, bohatství je od toho, aby se o něj člověk dělil!“"
 court.6080.a: "Dokážu být #EMP ještě#! štědřejší!"
 court.6080.b: "Té pošetilé štědrosti bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] využít také!"
 court.6080.b.success: "Přesvědčím [6080_visitor.GetFirstNameNoTooltip], aby něco káplo i mně"
 court.6080.b.success.tt: "[6080_visitor.GetFirstNameNoTooltip] se nechá přesvědčit!"
 court.6080.b.failure: "Mé pokusy na [6080_visitor.GetFirstNameNoTooltip] neudělají vůbec žádný dojem"
 court.6080.b.failure.tt: "[6080_visitor.GetFirstNameNoTooltip] se nenechá přesvědčit"
 court.6080.c: "Myslím, že [6080_visitor.GetFirstNameNoTooltip] už zneužívá mé pohostinnosti..."
 court.6080.d: "Lepší, když utrácí někdo jiný než já."
 court.6090.t: "Umění rétoriky"
 court.6090.desc: "„#EMP ALE JÁ SE TÁÁÁÁÁK NUDÍM!#!“ Naříkavý hlas [6090_child_a.Custom2('MyCharacterIntroduction', ROOT.Char)] poznávám okamžitě, ještě než se mi ten nezbeda vůbec ukáže.\n\nVýjev, který se mi pak naskytne, je opravdu žalostný:"
 court.6090.desc.cp: "[6090_poet.Custom2('MyCharacterIntroduction', ROOT.Char)] vypadá, že se každou chvíli rozpláče"
 court.6090.desc.teacher: "[6090_poet.GetFirstName], místní [Select_CString(6090_poet.IsFemale,'uznávaná učitelka','uznávaný učitel')], [Select_CString(6090_poet.IsFemale,'která právě navštívila','který právě navštívil')] náš dvůr, už je očividně na pokraji sil"
 court.6090.desc.middle: "zatímco [6090_child_a.GetFirstNameNoTooltip] a [6090_child_b.GetFirstName] hledí na [6090_poet.GetTitledFirstNameNoTooltip] s tím nejméně zaujatým výrazem, jaký jsem kdy na mladých tvářích [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]."
 court.6090.desc_other: "[6090_child_c.GetFirstName] mezitím odběhl k oknu a očividně jej mnohem víc zajímá #EMP cokoli#!, co se děje venku."
 court.6090.desc_end: "\n\nKdyž se naše pohledy střetnou, [6090_poet.GetFirstNameNoTooltip] mě prosebně osloví: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], #EMP prosím#!, jen se snažím vašim dětem vysvětlit vytříbené umění rétoriky, jak se na jejich urozený původ sluší...“"
 court.6090.a: "Dávejte pozor, děti! Tohle budete potřebovat."
 court.6090.b: "Zkusím vám to vysvětlit srozumitelněji."
 court.6090.b.success: "Na děti uděláš dojem"
 court.6090.b.failure: "Jsem ještě nudnější než [6090_poet.GetFirstNameNoTooltip]"
 court.6090.b.failure.tt: "Děti se nic nenaučí"
 court.6090.c: "Jsi prostě příliš [Select_CString(6090_poet.IsFemale,'nudná','nudný')], [6090_poet.GetFirstNameNoTooltip]!"
 court.6090.c.tt: "#EMP Válečnictví#! je pro mladé šlechtice mnohem hodnotnější činnost! Pojďte trénovat se mnou!"
