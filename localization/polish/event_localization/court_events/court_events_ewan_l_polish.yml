l_polish:
 court.2001.t: "Soutěž v podlézání"
 court.2001.desc: "[crony_a.GetFirstName] ani [crony_b.GetFirstName] si nevšimnou, jak se připlížím blíž k jejich hlučnému rozhovoru na chodbě.\n\n„Klíčem je #EMP tělesné#! ponížení! Každá modřina na koleni od věčného plazení znamená další minci v měšci! Když se vrhneš na zem, nemůžeš nic pokazit.“\n\n„Nesmysl, stačí před [ROOT.Char.GetTitleAsNameNoTooltip] vršit jeden lichotivý přívlastek za druhým a do smrti budeš za vodou. Jestli ti ještě zbývá dech, než se vůbec dostaneš k oslovení ‚[ROOT.Char.GetTitleAsNameNoTooltip]‘, děláš to špatně.“\n\nOdkašlu si a vyděšení patolízalové okamžitě zmlknou."
 court.2001.a: "Upřímně, oba byste se mohli snažit víc."
 court.2001.a.sadistic: "Kdo se ukloní nejníž, dostane tuhle #EMP lesklou#! minci. Do toho."
 court.2001.a.sadistic.crony_a_wins: "[crony_a.GetFirstNameNoTooltip] se ukloní nejníž"
 court.2001.a.sadistic.crony_b_wins: "[crony_b.GetFirstNameNoTooltip] se ukloní nejníž"
 court.2001.b: "Vaše manipulace na mě neplatí, poskoci!"
 court.2001.c: "Myslím, že vám uniká ta nejzřejmější cesta k mému srdci..."
 court.2001.d: "Tohle je pod mou úroveň."
 court.2201.t: "Kus koláče"
 court.2201.desc: "„...patří mně! Rozdělit [ROOT.Char.GetPrimaryTitle.GetNameNoTier] mezi několik dědiců nedává žádný smysl!“ vykřikne [eldest_heir.GetFirstName], zatímco se na druhém konci místnosti hlasitě hádá s [younger_heir.Custom2('HerHisCharacterIntroduction', eldest_heir)]. „Takhle odsuzujeme panství k vraždám a občanské válce. [Select_CString(ROOT.Char.IsFemale,'Matka by měla','Otec by měl')] odkázat všechny své země #EMP mně#!!“\n\n„Vraždy? Občanská válka? Co #EMP přesně#! plánuješ, až budeš [ROOT.Char.GetTitleAsNameNoTooltip]?“ odfrkne si [younger_heir.GetFirstNameNoTooltip]. „Jestli takhle smýšlíš o vlastní rodině ještě předtím, než se koruna vůbec #EMP dotkla#! té tvé ošklivé palice, bude z tebe naprostá zrůda na trůně.“\n\nTřeští mi hlava. Hádají se. Celé. Dopoledne."
 court.2201.a: "Máš nárok na #EMP víc#!, [eldest_heir.GetFirstNameNoTooltip]? Co třeba na #EMP nic#!!"
 court.2201.b: "Bohužel, taková jsou prostě pravidla hry, [younger_heir.GetFirstNameNoTooltip]..."
 court.2201.c: "Jsou rodina, beze mě spolu budou vycházet #EMP skvěle#!, že?"
 court.2201.d: "Děti, chcete poznat pravý význam rodiny?"
 court.2401.t: "Přepych z druhé ruky"
 court.2401.desc: "„Nejlepší šaty široko daleko, [ROOT.Char.GetTitleAsNameNoTooltip], hlavně proto, že #EMP nejsou#! odsud,“ uchechtne se [seller.GetFirstName], když procházím kolem otevřených dveří komnaty, kterou obývá. Z hlasu přímo čiší šarm a mazanost.\n\n„Skoro nové, jako nové, a přímo od těch, kdo udávají módu u dvora [grander_ruler.GetTitledFirstNamePossessive]! Příští sezónu bude tohle nosit #EMP každý#! v [grander_ruler.GetPrimaryTitle.GetName].“"
 court.2401.a: "Páni, ty #EMP vážně#! vypadají lákavě..."
 court.2401.b: "U mého dvora žádné cizácké nesmysly nepotřebujeme!"
 court.2401.c: "Koho zajímá, co mají lidé na sobě?"
 court.2411.t: "Labyrint chodeb"
 court.2411.desc: "Při procházce zabloudím do nepoužívaného křídla paláce a prohlížím si několik prostorných, byť zaprášených komnat, kam mé přetížené služebnictvo zavítá jen zřídka. Tu zaslechnu z postranní chodby zahleněné vzlykání.\n\nKdyž se vydám za zvukem, objevím [lost_guest.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(lost_guest.IsFemale,'zhroucenou','zhrouceného')] v naprostém zoufalství. Jakmile mě [lost_guest.GetTitledFirstName] spatří, okamžitě vyskočí, popadne mě za ramena a začne blekotat jako smyslů [Select_CString(lost_guest.IsFemale,'zbavená','zbavený')].\n\n„[ROOT.Char.GetTitleAsNameNoTooltip], v těchhle chodbách bloudím už #EMP tři dny#!! Nemůžu najít cestu ven, jen nekonečné smyčky propojených chodeb a chátrajících komnat, a nikde ani jediný sluha!“"
 court.2411.a: "Přísahám! [ROOT.Char.GetFaith.HighGodName] ví, že ti ukážu cestu ven!"
 court.2411.b: "Jak můžeš... Jak může být někdo #EMP tak hloupý#!?"
 court.2411.c: "*Hvízdání* To mám ale pěkné bludiště chodeb..."
