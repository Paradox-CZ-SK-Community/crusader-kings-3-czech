l_polish:
 court_events.1000.t: "Ze všech nejvelkolepější"
 court_events.1000.desc: "„Ó, [Select_CString(ROOT.Char.IsFemale,'veliká','veliký')] [ROOT.Char.GetTitleAsNameNoTooltip]! Společně známe celý známý svět,“ lísá se [guest.GetName], první z proslulé cestovatelské dvojice. „Známe sluncem zalité paláce rozkoší i jeskyně z ledu! Známe chuť mléka Palestiny i medové rosy.“\n\n„Známe tábory chánů, paláce sultánů, prastaré síně... ale žádný dvůr na světě se tomu vašemu nevyrovná. Nikde není tolik vznešenosti a přepychu!“\n\n[guest_2.GetName], [Select_CString(guest_2.IsFemale,'druhá','druhý')] z dvojice, přitom provádí podivné cizokrajné úklony a úpěnlivě prosí:\n\n„Zdejší pohodlí... překonává dokonce i [second_court.GetPrimaryTitle.GetAdjective] požitkářství... [Select_CString(ROOT.Char.IsFemale,'Moudrá','Moudrý')] [ROOT.Char.GetTitleAsNameNoTooltip], dovolte nám ještě chvíli zakoušet slasti, jaké nabízí [guest_2.GetFaith.PositiveAfterLife]!“"
 court_events.1000.a: "Pověst rozmařilce vyváží jedině dobročinnost..."
 court_events.1000.a.flavor: "A ještě obohatí můj lid!"
 court_events.1000.b: "„Zůstaňte zde, u nejvelkolepějšího ze všech dvorů.“"
 court_events.1000.b.flavor: "A veďte mé dvořany v oslavování mé osoby coby nejvelkolepějšího ze všech panovníků!"
 court_events.1000.c: "„Vyprávějte všem o divech, které jste zde spatřili.“"
 traveling_friends_court_position_aptitude: "Tito cestující přátelé mají vyšší [Concept('aptitude','způsobilost')|E], pokud oba zastávají [Concept('court_positions','dvorské úřady')|E]"
 visiting_gives_opinion: "Každý [Concept('ruler','panovník')|E], který hostí [guest.GetFirstName] nebo [guest_2.GetFirstName], získá #P 20#! [Concept('opinion','mínění')|E] o #high tobě#! #EMP (Pověst)#!"
 court_events.1010.t: "Z jiného mraveniště"
 court_events.1010.desc: "Dovnitř se přikrade [grander_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip] dvořan. [defector.GetName] se přede mnou ukloní a nervózně pokukuje po mých strážích.\n\n„Přicházím z místa plného nádhery,“ pronese ten patolízal, „od dvora [grander_ruler.GetName].“\n\n„Kdybych [Select_CString(defector.IsFemale,'opustila','opustil')] tamní služby, odešlo by se mnou mnoho úředníků. Jsme pouhý hmyz, ale právě naše svědomitá práce dodává dvoru jeho velkolepost! A už nechceme zůstávat ve službách toho [grander_ruler.Custom2('InsultAdjective', SCOPE.sC('defector'))] [grander_ruler.GetTitleAsNameNoTooltip]...“\n\n„Své služby bychom raději nabídli #EMP vám#!, ó [ROOT.Char.GetTitleAsName].“"
 court_events.1010.a: "„Když jsi tak [Select_CString(defector.IsFemale,'prohnaná','prohnaný')]... dokaž mi svou užitečnost.“"
 court_events.1010.a.flavor: "Můj antikvář mi vyprávěl o velkých pokladech [grander_ruler.GetTitleAsNamePossessiveNoTooltip]... a zvlášť o jednom, který by šikovné zlodějské ruce mohly získat pro mě."
 court_events.1010.a.success: "Přeběhlíci ukradnou artefakt svému lennímu pánovi"
 court_events.1010.a.failure: "Zrádci jsou dopadeni a popraveni"
 court_events.1010.b: "Tihle přeběhlíci dobře vědí, co znamená vytříbenost."
 court_events.1010.c: "Schopní duchovní by tento dvůr spravovali lépe."
 court_events.1010.c.flavor: "Jestli tento dvůr potřebuje více schopných rukou, můj [court_chaplain.GetCouncilTitle] by mohl najít několik bezhříšných pomocníků a dohlédnout na ně..."
 court_events.1010.d: "#EMP „Táhněte domů, vy proradní švábi!“#!"
 court_events.1011.opening: "Můj bývalý pane,"
 court_events.1011.desc: "já, [defector.GetName], a mnozí z vašich přehlížených služebníků jsme uprchli z vašich služeb. Bez našich zkušeností se váš dvůr brzy promění v trosky, jaké si zasloužíte.\n\nVždy jste byl spíš [grander_ruler.Custom2('InsultNoun', SCOPE.sC('defector'))] než lenní pán hodný úcty. A tak si pohodlí a slávu, které jste kdysi znal, nyní vychutná [root_scope.GetName]."
 court_events.1011.a: "#EMP Zrádce!#!"
