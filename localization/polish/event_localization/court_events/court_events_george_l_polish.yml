l_polish:
 court.7030.title: "Cizozemští obchodníci"
 court.7030.desc: "Když přehlížím svůj dvůr, všimnu si [steward.GetTitledFirstName] ([ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName]), jak živě rozmlouvá s jedním z mých zahraničních hostů, [foreign_merchant.GetName]. Ze zvědavosti k nim přistoupím.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip], zastupuji zájmy obchodnické skupiny tvořené mými soukmenovci z [foreign_merchant.GetCulture.GetName] kultury. Vidí velký potenciál v založení obchodnické komunity, kterou zde v [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] mohou využívat [foreign_merchant.GetCulture.GetCollectiveNounNoTooltip],“ prohlásí úslužně [foreign_merchant.GetNameNoTooltip].\n\n„[ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('steward'))|U], nesmíme zvýhodňovat #EMP cizince#! před vlastními lidmi!“ protestuje [steward.GetFirstNameNoTooltip]."
 court.7030.a: "[foreign_merchant.GetCulture.GetCollectiveNounNoTooltip] zde dostanou vlastní obchodnickou komunitu."
 court.7030.b: "Tady se můžeme dohodnout."
 court.7030.c: "Rozšíříme obchodní čtvrti pro všechny!"
 court.7030.d: "[foreign_merchant.GetCulture.GetCollectiveNounNoTooltip] nebudou vykořisťovat naše trhy!"
 court.7030.d.tt: "Vyženeš [foreign_merchant.GetFirstNameNoTooltip] z našeho panství a právem zabavíš zlato získané na úkor našich vlastních obchodníků!"
 court.7040.title: "Pilíř společenství"
 court.7040.desc: "Všimnu si, že [chaplain.GetName] nervózně přechází po místnosti.\n\n„[chaplain.GetName], co se děje?“ zeptám se.\n\n„Jde o [ascetic.GetName], můj lenní pane. Každé ráno vyšplhá na sloup na nádvoří paláce a celý den tam zůstává v tichém rozjímání. [ascetic.GetNameNoTooltip] odmítá jídlo i pití a na otázky odpovídá jen velmi stručně. Takové asketické praktiky nejsou neslýchané, ale některým lidem u vašeho dvora to vadí a žádají mě, abych s tím něco [Select_CString(chaplain.IsFemale,'udělala','udělal')].“"
 court.7040.a: "Prostě si [ascetic.GetNameNoTooltip] nevšímej, časem toho nechá."
 court.7040.b: "Pošlete [ascetic.GetNameNoTooltip] za [head_of_faith.GetTitledFirstNameNoTooltip] a uvidíme, jak to posoudí."
 court.7040.c: "Zbožnost, kterou projevuje [ascetic.GetNameNoTooltip], mě inspiruje. Budu následovat tento příklad!"
 court.7040.d: "Pokud chce [ascetic.GetNameNoTooltip] žít v odloučení, může tak činit někde jinde!"
 court.7050.title: "Dar od přítele"
 court.7050.desc: "Zatímco dvorské záležitosti pokračují, mezi desítkami intrikánů a patolízalů mě potěší pohled na tvář mého přítele [friend.GetName]. Srdečně se přivítáme a rozmlouváme spolu s otevřeností, jakou si mohu dovolit jen s málokým. Uprostřed rozhovoru [friend.GetNameNoTooltip] vytáhne zpod oděvu malý váček a vloží mi jej do ruky. \n\n„Dárek pro tebe, něco na památku našich dobrých časů. Je výjimečný pro mě i pro můj lid. [friend.GetCulture.GetCollectiveNoun] k němu mají zvláštní vztah. Doufám, že jej přijmeš.“"
 court.7050.a: "„Samozřejmě, budu jej mít stále u sebe!“"
 court.7050.a.tt: "To může mít nezamýšlené následky..."
 court.7050.b: "„To je od tebe příliš laskavé, dar přijímám!“"
 court.7050.c: "Jsem z [ROOT.Char.GetCulture.GetNameNoTooltip] kultury, ne z [friend.GetCulture.GetNameNoTooltip] kultury! Tvůj dar odmítám."
 court.7051.title: "Kacířské symboly?"
 court.7051.desc: "Od chvíle, kdy jsem od [friend.GetName] [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')] [court_7050_artifact.GetName] darem, nosím jej stále při sobě. Zřejmě si toho u dvora někdo všiml, protože za mnou nyní přichází [court_chaplain.GetCouncilTitle] [court_chaplain.GetName] a vyjadřuje obavy, že se odvracím od pravé víry!\n\n„Neuniklo mi, že jste [Select_CString(ROOT.Char.IsFemale,'začala','začal')] dávat najevo náklonnost ke kacířským symbolům a předmětům, věcem spojovaným s vírami, které vyznávají [court_chaplain.Custom('GetDerogatoryNonbeliever')]. Často se říká, že [court_chaplain.GetFaith.DevilName] k nám přichází v přestrojení za přítele, jen aby nás svedl z pravé cesty.“"
 court.7051.a: "[ROOT.Char.GetFaith.DevilName] za tím stojí!"
 court.7051.a.tt: "Upřednostníš názor, který zastávají [court_chaplain.GetFaith.GetAdherentNamePlural], před názorem svého přítele."
 court.7051.b: "Symboly? Ikony? O čem to proboha mluvíš?"
 court.7051.b.tt: "Předstíráš, že o artefaktu nic nevíš."
 court.7051.c: "Ty snad nerozeznáš kulturu od víry?"
 court.7051.c.success: "Přesvědčíš [court_chaplain.GetNameNoTooltip]"
 court.7051.c.failure: "Nedokážeš přesvědčit [court_chaplain.GetNameNoTooltip]"
 court.7051.d: "Zmiz, věřím, že [friend.GetNameNoTooltip] mě nesvede na scestí!"
 court.7070.title: "Potenciál paláce"
 court.7070.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], hovořím s vašimi dvořany, kteří pobývali ve vašem paláci v [palace_county.GetName], o jeho současném stavu. Jako váš $royal_architect_court_position$ mám povinnost vás upozornit, že palác v [palace_county.GetName] zoufale potřebuje rekonstrukci!“ prohlásí [architect.GetName].\n\n„Napadlo mě, [ROOT.Char.Custom2('RelationToMeAddress',architect)], zda bychom při této příležitosti nemohli od základů změnit také veškerou výzdobu a styl paláce a třeba se odklonit od klasické architektury [ROOT.Char.GetCulture.GetName] kultury. Potřebuji jen finance a trochu času na vypracování návrhů,“ dodá [architect.GetFirstNameNoTooltip]."
 court.7070.a: "Výborný návrh, připrav plány."
 court.7070.a.tt: "[architect.GetFirstNameNoTooltip] bude při plánování rekonstrukce paláce čerpat inspiraci z [Concept('cultures','jiných kultur')|E] a předloží ti možnosti, které mohou zvýšit [Concept('cultural_acceptance','kulturní přijetí')|E] vůči [Concept('cultures','jiným kulturám')|E]."
 court.7070.b: "Taková rozmařilost není nutná, postačí obyčejná rekonstrukce."
 court.7070.c: "Palác je v pořádku tak, jak je!"
 court.7071.title: "Imitatio architecturae"
 court.7071.desc: "Jak [Select_CString(architect.IsFemale,'slíbila','slíbil')], [architect.GetName] se vrací se třemi podrobnými plány navrhované rekonstrukce paláce v [palace_county.GetName].\n\n„První návrh čerpá inspiraci ze stylu [culture_option_1.GetProvince.GetCounty.GetCulture.GetName] kultury, druhý ze stylu [culture_option_2.GetProvince.GetCounty.GetCulture.GetName] kultury a v posledním plánu zůstává hlavním vlivem [ROOT.Char.GetCulture.GetName] kultura, [ROOT.Char.Custom2('RelationToMeAddress',architect)].“\n\nNa první pohled jsou všechny tři návrhy velmi nákladné a kromě rekonstrukce stávající stavby počítají i s novými přístavbami. Tohle rozhodně nebude rychlá ani levná práce."
 court.7071.a: "Zvolme návrh podle [culture_option_1.GetProvince.GetCounty.GetCulture.GetNameNoTooltip] kultury."
 court.7071.continue: "Projekt pokračuje..."
 court.7071.b: "Použijme návrh podle [culture_option_2.GetProvince.GetCounty.GetCulture.GetNameNoTooltip] kultury."
 court.7071.c: "Tento palác bude pomníkem nadřazenosti [ROOT.Char.GetCulture.GetNameNoTooltip] kultury!"
 court.7071.d: "Tohle je příliš. Projekt zrušte."
 court.7072.title: "Rekonstrukce paláce dokončena!"
 court.7072.desc.other_culture: "Po měsících práce dostávám zprávu, že stavební práce na paláci v [palace_county.GetName] jsou konečně dokončeny, a společně se svým $royal_architect_court_position$ [architect.GetName] se vydávám do [palace_county.GetNameNoTooltip], abych si výsledek osobně [Select_CString(ROOT.Char.IsFemale,'prohlédla','prohlédl')].\n\nKdyž hledím na nový palác a poté vstoupím dovnitř, [architect.GetFirstNameNoTooltip] se drží po mém boku a dychtivě očekává pochvalu a odměnu. Prohlédnu si palác s jeho nezvyklými styly a cizokrajnou výzdobou a můj verdikt zní..."
 court.7072.desc.own_culture: "Po měsících práce dostávám zprávu, že stavební práce na paláci v [palace_county.GetName] jsou konečně dokončeny, a společně se svým $royal_architect_court_position$ [architect.GetName] se vydávám do [palace_county.GetNameNoTooltip], abych si výsledek osobně [Select_CString(ROOT.Char.IsFemale,'prohlédla','prohlédl')]. Když hledím na nový palác a poté vstoupím dovnitř, [architect.GetFirstNameNoTooltip] se drží po mém boku a dychtivě očekává pochvalu a odměnu. Prohlédnu si palác s jeho důvěrně známými styly a uklidňující výzdobou a můj verdikt zní..."
 court.7072.a: "„Velkolepé, skutečně velkolepé!“"
 court.7072.b: "„Ohavnost, nenávidím to!“"
 court.7072.c: "„Přijatelné, ale stálo to za ty výdaje?“"
 court.7100.title: "Polapená šelma"
 court.7100.desc: "U mého dvora se už přihodila spousta podivných věcí, ale že $master_of_hunt_court_position$ [huntmaster.GetFirstName] přivede do trůnního sálu na řetězu jakési zvíře — #EMP [SCOPE.Custom('GetExoticPet')]#! — to bych popravdě [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], představuji vám tuto nádhernou šelmu jako dar, trofej z mého posledního lovu! #EMP Všichni#! panovníci dnes chovají exotická zvířata, aby zdobila jejich dvory a ukazovala jejich majestát!“\n\nJe naprosto zřejmé, že [huntmaster.GetFirstNameNoTooltip] chce, abych si tu věc [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')]!"
 court.7100.a: "[SCOPE.Custom('GetExoticPet')]? A co s tím mám dělat?"
 court.7100.a.tt: "Nařídíš [huntmaster.GetFirstName], aby se zvířete okamžitě [Select_CString(huntmaster.IsFemale,'zbavila','zbavil')]!"
 court.7100.b: "Tahle šelma bude můj milovaný mazlíček!"
 court.7100.c: "C-co kdybys sis ji raději [Select_CString(huntmaster.IsFemale,'nechala','nechal')] #EMP ty#!?"
 court.7200.title: "Hlasitě a hrdě"
 court.7200.intro.desc: "Zakládám si na přepychu svého dvora, ale už několik nocí má tento přepych podobu vytříbeného hudebního mučení."
 court.7200.drum.desc: "\n\nMůj $court_musician_court_position$ [loud_musician.GetFirstName] si nedávno pořídil nový nástroj, jakýsi buben, a od té doby do něj hlasitě tluče ve dne v noci."
 court.7200.trombone.desc: "\n\nMůj $court_musician_court_position$ [loud_musician.GetFirstName] si nedávno pořídil nový nástroj, jakousi žesťovou troubu, a od té doby na ni hlasitě troubí ve dne v noci."
 court.7200.pipes.desc: "\n\nMůj $court_musician_court_position$ [loud_musician.GetFirstName] si nedávno pořídil nový nástroj, jakousi soustavu píšťal, a od té doby na ni ve dne v noci příšerně skřípe."
 court.7200.guitar.desc: "\n\nMůj $court_musician_court_position$ [loud_musician.GetFirstName] si nedávno pořídil nový nástroj, myslím, že citolu, a od té doby na ni hlasitě drnká ve dne v noci."
 court.7200.outro.desc: "\n\nKdyž [loud_musician.GetFirstNameNoTooltip] konfrontuji, dostane se mi odpovědi: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], pouze cvičím své umění, abych [Select_CString(loud_musician.IsFemale,'mohla','mohl')] být $court_musician_court_position$, jakého si zasloužíte!“"
 court.7200.a: "Nemůžeš alespoň v noci trochu ztlumit?"
 court.7200.b: "Vezmi si své #EMP umění#! a táhni!"
 court.7200.c: "Kdyby tvá hudba byla lepší, nestěžovali bychom si!"
 court.7300.t: "Kde je jehněčí omáčka?"
 court.7300.desc: "Pokusy o můj život se dají čekat, a proto musí lidé, na které spoléhám při své ochraně, zůstat loajální a spokojení. Dnes však můj určený $food_taster_court_position$ [taster.GetFirstName] vypadá naprosto znechuceně a poněkud nazelenale, když se za ním zastavím.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], už to prostě nevydržím. Jídlo, které se podává u vašeho dvora, je naprosto #EMP odporné!#! Nechápu, jak můžete tuhle břečku jíst #EMP noc co noc co noc...#!\n\n...Vždyť tyhle splašky se sotva hodí na stůl sedláka!“"
 court.7300.a: "#EMP Na stůl sedláka?#! S tím musíme okamžitě něco udělat!"
 court.7300.b: "Jídlo je naprosto v pořádku, o čem to mluvíš?"
 court.7300.c: "Dobrá, najdu si někoho jiného, komu budu platit za to, že jí mé jídlo!"
 court.7400.title: "Nevítaně dlouhá návštěva?"
 court.7400.desc: "Můj dvůr proslul přepychovou pohostinností a zdejší hosté se často ukážou jako... užiteční.\n\nObčas se nám však u dvora objeví i #EMP přebyteční#! hosté, jejichž účel je nejasný a jejichž přítomnost jen zbytečně vysává mou pokladnici.\n\n[Select_CString(guest.IsFemale,'Jednou z takových příživnic','Jedním z takových příživníků')] je [guest.GetFirstName], [Select_CString(guest.IsFemale,'která','který')] zde už nějakou dobu pobývá jako [Select_CString(guest.IsFemale,'hostka','host')] [guest_liege.GetTitledFirstName] a zdá se, že sní za dvanáct lidí.\n\n[guest.GetFirstNameNoTooltip] mě svou nenasytností přivede na mizinu a #EMP něco#! se s tím musí udělat."
 court.7400.a: "Ať [guest.GetFirstNameNoTooltip] zůstane."
 court.7400.a.tt: "Jednou se přece musí nějak hodit, ne?"
 court.7400.b: "Pro [guest.GetFirstNameNoTooltip] znám dokonalou práci..."
 court.7400.b.tt: "Zaměstnáš [guest.GetFirstNameNoTooltip] v nějaké podřadné funkci u svého dvora."
 court.7400.c: "Ty [Select_CString(guest.IsFemale,'parazitko','parazite')], vrať se tam, odkud jsi [Select_CString(guest.IsFemale,'přišla','přišel')]!"
 court.7600.t: "Divoké srdce"
 court.7600.desc: "[child.Custom('GetDaughterSon')|U] [child.GetName] vstoupí do mého trůnního sálu s tváří pokrytou zaschlým blátem a krví. Zděšeně vstanu a chystám se [child.GetFirstNameNoTooltip] pokárat za tak nevhodný vzhled, když dovnitř rázně vkročí $master_of_hunt_court_position$ [huntmaster.GetFirstName], stejně zablácený a potřísněný krví, s úsměvem od ucha k uchu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [child.GetTitledFirstNameNoTooltip] během našeho lovu [Select_CString(child.IsFemale,'skolila','skolil')] mocného [child.Custom('GetAnimalType')], možná nejlepší úlovek, jaký jsem letos [Select_CString(huntmaster.IsFemale,'viděla','viděl')].“\n\nZdá se, že lovecké lekce [child.GetFirstNameNoTooltip] probíhají dobře, ale nemohu se ubránit myšlence, zda by se ten čas nedal využít i užitečněji..."
 court.7600.a: "Tyhle výpravy nahradí užitečnější studium."
 court.7600.b: "Hmm, [child.Custom('GetDaughterSon')] [child.GetNameNoTooltip] by [Select_CString(child.IsFemale,'měla','měl')] projít ještě náročnější zkouškou..."
 court.7600.b.tt: "Nařídíš [huntmaster.GetNameNoTooltip], aby při dalším lovu hnal [child.GetNameNoTooltip] až na hranice možností."
 court.7600.b.death: "[child.GetNameNoTooltip] zemře při lovu"
 court.7600.b.wounding: "[child.GetNameNoTooltip] utrpí při lovu zranění"
 court.7600.b.victory: "Úspěšný lov pro [child.GetNameNoTooltip]"
 court.7600.c: "[Select_CString(ROOT.Char.IsFemale,'Nemohla','Nemohl')] bych být pyšnější!"
 7600_taking_child_to_hunt: "Braní dětí na lov"
 7600_taking_child_to_hunt.tt: "Bezpečně vzít dítě na lov je zodpovědnost, která vyžaduje značné zkušenosti. [Concept('aptitude','Způsobilost')|E] tvého $master_of_hunt_court_position$ se zvýší."
 court.7610.title: "Žádost ze stáje"
 court.7610.desc: "[child.Custom('GetDaughterSon')|U] [child.GetName] dospívá a jednoho dne se bude muset ujmout významného postavení ve společnosti. Podle všeho se však [child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale,'rozhodla','rozhodl')], že tím dnem je dnešek.\n\n„[ROOT.Char.GetMotherFather|U], můžu dostat destriera?“\n\n#EMP Válečného koně?#! Pro #EMP dítě?!#! Zatímco nad tou žádostí přemítám, všimnu si, jak na mě z druhého konce trůnního sálu pokukuje $master_of_horse_court_position$ [horsemaster.GetName].\n\nAlespoň teď vím, s kým se v poslední době radí [child.Custom('GetDaughterSon')] [child.GetNameNoTooltip]...."
 court.7610.a: "Odvážná volba!"
 court.7610.b: "A co něco... menšího?"
 court.7610.c: "Nebuď [Select_CString(child.IsFemale,'směšná','směšný')]."
 court.7620.title: "Zlaté peří"
 court.7620.desc: "Na okraji trůnního sálu zaslechnu $master_of_hunt_court_position$ [huntmaster.GetName], jak vede vyčerpávající jednání s [falconer.GetName] o koupi nádherného sokola stěhovavého, ptáka, jehož vlastnictví je mimořádně prestižní.\n\n[huntmaster.GetFirstNameNoTooltip] se zjevně [Select_CString(huntmaster.IsFemale,'zasekla','zasekl')] při smlouvání o ceně, zatímco [Select_CString(falconer.IsFemale,'sokolnice','sokolník')] odmítá ustoupit. Podle podráždění v jejich hlasech se o tom přou už #EMP pěkně dlouho#!.\n\nMožná by jim přišlo vhod, kdyby [ROOT.Char.GetTitleAsNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'zasáhla','zasáhl')]... skoro stejně jako bych já [Select_CString(ROOT.Char.IsFemale,'ocenila','ocenil')] nového ptáka."
 court.7620.a: "[falconer.GetFirstNameNoTooltip], [Select_CString(falconer.IsFemale,'sama','sám')] dobře víš, že žádáš příliš mnoho!"
 court.7620.a.success: "Úspěšně vyjednáváš s [falconer.GetShortUINameNoTooltip]"
 court.7620.a.failure: "Při vyjednávání s [falconer.GetShortUINameNoTooltip] neuspěješ"
 court.7620.b: "Ale no tak, nabídnu ti víc."
 court.7620.c: "Jen to prosím drž dál od mého trůnního sálu, ano?"
 court.7630.title: "Dravci"
 court.7630.desc: "Zdá se, že lov v mých nejbližších dvořanech probouzí to nejhorší. Můj $master_of_horse_court_position$ [horsemaster.GetName] a můj $master_of_hunt_court_position$ [huntmaster.GetName] se nedávno společně vrátili z lovu a nyní se uprostřed mého trůnního sálu zuřivě hádají.\n\n„Můj pták kořist vyplašil, takže ji musel ulovit on!“ křičí [horsemaster.GetFirstNameNoTooltip].\n\n„Můj pták seděl na mrtvé kořisti, takže není pochyb, že sláva patří mně!“ vykřikne [huntmaster.GetFirstNameNoTooltip].\n\nPodle všeho se zuřivě přou o to, čí sokol má zásluhu na úlovku."
 court.7630.a: "Vítězství patří [horsemaster.GetFirstNameNoTooltip]."
 court.7630.b: "Tento úspěch patří [huntmaster.GetFirstNameNoTooltip]."
 court.7630.c: "Proč se o tenhle triumf nemůžete podělit?"
 court.7630.c.tt: "Pokusíš se přesvědčit [horsemaster.GetShortUIName] a [huntmaster.GetShortUIName], že vítězi jsou oba:"
 court.7630.c.success: "Úspěšně najdeš kompromis"
 court.7630.c.failure: "Situaci jen zhoršíš"
 court.7640.title: "Týrání ptáka"
 court.7640.desc: "„Chopte se [avian_abuser.GetNameNoTooltip]!“ zařve $master_of_hunt_court_position$ [huntmaster.GetFirstName] a ukáže na [avian_abuser.GetName]. Moje osobní stráž nejistě vykročí vpřed, protože si není jistá, zda má rozkazy [huntmaster.GetFirstNameNoTooltip] poslechnout. Zvednu ruku, abych ji [Select_CString(ROOT.Char.IsFemale,'zastavila','zastavil')], a zeptám se [huntmaster.GetFirstNameNoTooltip], co je důvodem toho povyku.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tahle #EMP zrůda#! při našem posledním lovu úmyslně ublížila vlastnímu sokolovi! Za něco takového musí přijít přísný trest, #EMP čest si to žádá#!.“"
 court.7640.a: "Je to jen pták. Nechte [avian_abuser.GetNameNoTooltip] jít."
 court.7640.b: "Do žaláře s tou #EMP zrůdou!#!"
 court.7640.c: "Za tenhle #EMP přečin#! zaplatí pokutu!"
 court.7640.d: "Zbičujte tu #EMP bestii!#!"
 court.7700.t: "Na vlastních křídlech"
 court.7700.desc: "Dnes sedí na rameni [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)] podivně vyhlížející havran. [spymaster.GetFirstNameNoTooltip] využije ruchu v trůnním sále, aby náš rozhovor skryl před zvědavými ušima, a začne mi vychvalovat pozoruhodné schopnosti toho ptáka.\n\n„Je to znamenitá zlodějka, můj lenní pane. Nekrade zlato ani drahokamy, nýbrž vzkazy, klíče a dopisy — všechny ty drobnosti, které v sobě skrývají nepříjemné pravdy, jež jejich majitelé touží utajit.“"
 court.7700.a: "Zlodějina! Stráže, zatkněte tu ničemu!"
 court.7700.b: "Dokázala by zjistit něco víc o [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip]?"
 court.7700.b.tt: "Využiješ toho k podpoře svého probíhajícího [scheme.GetName]"
 court.7700.c: "Jak rozkošně proradné..."
 court.7700.d: "Takové úskoky jsou pod mou úroveň."
