l_polish:
 court.4001.t: "Jen škrábnutí"
 court.4001.desc: "Pod nohama [bleeding_diplomat.GetName] se sráží kaluž krve. Jde o diplomata, kterého vyslal můj spojenec [bleeding_diplomat_liege.GetName]. Podle obrovského množství krve, které už nasákl můj nádherný koberec, mohu jen usuzovat, že [bleeding_diplomat.GetName] na tomto místě krvácí už celé hodiny, ne-li déle.\n\n„Omlouvám se za ten nepořádek. Cestou do [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] mě v hostinci vyhodil z okna trpaslík, který se mě pokusil okrást. Jelikož ale ten ničema ztlumil můj pád, může diplomatická návštěva pokračovat — ještě potrvá celé #EMP dny#!, než na ztrátu krve zemřu!“"
 court.4001.a: "Stráže, donuťte [Select_CString(bleeding_diplomat.IsFemale,'tu ženu','toho muže')] navštívit lékaře."
 court.4001.b: "V kalendáři mám volno až příští týden — vydržíš do té doby?"
 court.4001.c: "Můžeme si promluvit hned, ale koberec zaplatí tvůj lenní pán."
 court.4001.carpet: "Musíš vyčistit svůj koberec"
 court.4001.new_carpet: "[bleeding_diplomat.GetName] bude krvácet ještě víc — budeš muset koupit nový koberec."
 court.4001.toast: "[bleeding_diplomat.GetName] umírá"
 court.4001.toast_desc: "[bleeding_diplomat.GetName] [Select_CString(bleeding_diplomat.IsFemale,'vykrvácela','vykrvácel')] na tvém přepychovém koberci."
 court.4001.cure_toast: "Lékař diplomata vyléčí"
 court.4100.t: "Panoši pro [GetPlayer.Custom( 'KnightCulturePluralNoTooltip' )]"
 court.4100.desc: "[Select_CString(court_musician.IsFemale,'Má dvorní hudebnice','Můj dvorní hudebník')] ke mně přichází a téměř poskakuje do rytmu, který slyší jen [court_musician.GetName].\n\n„Ždibíček vaší pozornosti, [ROOT.Char.Custom('FormOfAddressForLiege')]. [Select_CString(court_musician.IsFemale,'Připravila','Připravil')] jsem bezkonkurenční čistě mužský sbor! Podle mé nové metody nejen zpívají, ale také nosí punčocháče, na lesknoucích se slabinách mají zdobené poklopce a tančí v dokonalém souladu! To vše samozřejmě doprovází chvála, kterou si [ROOT.GetCharacter.GetFaith.HighGodName] zaslouží. Jsem si [Select_CString(court_musician.IsFemale,'jistá','jistý')], že pokud zaplatíte velkolepé vystoupení, dvorní dámy budou nadšené.“"
 court.4100.a: "Zvedá se mi žaludek! S tímhle zvrhlíkem do žaláře!"
 court.4100.b: "Jejich punčocháče budou na dámy určitě příliš."
 court.4100.c: "Peníze máš. Už se nemůžu dočkat vystoupení!"
 court.4250.t: "Moje věž je větší než tvoje!"
 court.4250.desc: "„Ubrečení dvořané z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip],“ [tower_challenger_rival.GetTitledFirstName] vtrhne před můj trůn.\n\n„Zatímco se [ROOT.Char.GetTitledFirstNameNoTooltip] válí po zemi jako prase v bahně, já jsem v [tower_challenger_rival.GetCapitalLocation.GetTitle.GetNameNoTier] [Select_CString(tower_challenger_rival.IsFemale,'vztyčila','vztyčil')] nejvyšší věž, jakou kdy tato prokletá země spatřila. Ze svého [tower_challenger_rival.Custom('FortifiedBuilding')] už téměř dokážu trhat planety z oblohy. Kde jsou tvé hvězdy, [ROOT.Char.GetTitledFirstNameNoTooltip]?“\n\nMůj [concerned_steward.GetCouncilTitle|l] [concerned_steward.GetTitledFirstName] mi opatrně položí ruku na rameno. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], věž, kterou má [tower_challenger_rival.GetTitledFirstNameNoTooltip], je čtyři sta stop vysoká masa nestabilní hlíny a pojiva. Nevšímejte si těch provokací a počkejte, až se zřítí!“"
 court.4250.a: "Strč si tu svou nebeskou jehlu do vznešeného zadku!"
 court.4250.b: "Naši věž zvýšíme tak, aby byla o stopu vyšší než tvoje!"
 court.4250.c: "Požaduji věž o #EMP sto stop #!vyšší!"
 court.4250.b.tt: "Na svůj [THIS.GetCharacter.Custom('FortifiedBuilding')] připevníš velmi dlouhou vlajkovou žerď"
 court.4250.c.success.tt: "Postavíš obrovskou věž"
 court.4250.c.failure.tt: "Tvá věž se během stavby zřítí"
 court.4250.c.failure_toast_title: "Věž tvého [ROOT.Char.Custom('FortifiedBuilding')] se zřítila!"
 court.4250.c.accident.tt: "Dojde k hrozné nehodě"
 court.4250.c.accident.tt.flavour: "Kdo ví, co by se mohlo pokazit..."
 court.4251.desc: "Když se dozvím, že je má čnící věž konečně hotová, pozvu celý dvůr ven, aby se na ni podíval. Věž proráží oblohu, ale zároveň se ve větru kývá."
 court.4251.desc_child_accident: "\n\nZ davu zírajících dvořanů se mé dítě [crushed_child.GetName] zvědavě vydá k patě mohutné stavby a s očima dokořán k ní vzhlíží.\n\n[crushed_child.GetNameNoTooltip] ani nestačí vykřiknout, když se špička věže ulomí, zřítí se dolů a rozmáčkne [Select_CString(crushed_child.IsFemale,'ji','ho')] na kaši."
 court.4251.desc_rival_accident: "\n\nPozvu [tower_challenger_rival.GetTitledFirstNameNoTooltip], aby se mnou [Select_CString(tower_challenger_rival.IsFemale,'vystoupala','vystoupal')] nahoru. Výhled [tower_challenger_rival.GetNameNoTooltip] doslova vyrazí dech — anebo možná schody. Když dorazíme na vrchol a já zamávám dvořanům dole, [tower_challenger_rival.GetNameNoTooltip] se opře o zábradlí. To okamžitě povolí a pošle [Select_CString(tower_challenger_rival.IsFemale,'ji','ho')] střemhlav rovnou do nebe."
 court.4251.desc_success: "\n\nZírající dvořané přivítají věž bouřlivým potleskem, ale z nějakého důvodu se všichni vyhýbají jejímu stínu.\n\n[tower_challenger_rival.GetTitledFirstNameNoTooltip] mi šeptá: „Ty pse, přísahám, že se vrátím s věží #EMP dvakrát#! tak vysokou.“"
 court.4251.a: "Ach, [crushed_child.GetNameNoTooltip], [Select_CString(crushed_child.IsFemale,'byla jsi sladká','byl jsi sladký')] jako lívaneček!"
 court.4251.b: "Nakonec se ti přece jen podařilo vzlétnout, [tower_challenger_rival.GetTitledFirstNameNoTooltip]."
 court.4251.c: "Tak kdo se teď válí v bahně, [tower_challenger_rival.GetTitledFirstNameNoTooltip]?"
 court.4300.t: "Quantum Praedecessores"
 court.4300.preaching_tour_bernard_of_clairvaux_intro: "Bernard z Clairvaux se zde zastavil během své kazatelské cesty napříč kontinentem, aby rozdmýchal zápal pro probíhající svatou válku. Můj [bishop.GetCouncilTitle] mi sděluje, že [right_portrait_character.GetName] sehrál zásadní roli při formulování pravidel prvního svatého řádu templářských rytířů.\n\n"
 court.4300.preaching_tour_bernard_of_clairvaux_theology: "„Jsem nadšen, že mohu pobývat ve společnosti někoho, kdo proslul hlubokým porozuměním božským otázkám. Pracuji na novém pojednání o našich vojenských řádech: ‚Chvála nového rytířstva‘. Pokud je zběžně pročtete, určitě pošlu zprávu [ghw_sponsor.GetTitledFirstName], že by [Select_CString(ghw_sponsor.IsFemale,'měla','měl')] vydat bulu na podporu vašeho vlastního řádu.“"
 court.4300.preaching_tour_bernard_of_clairvaux_flea_excommunication: "„Děkuji za vaši pohostinnost. Abych vám laskavost oplatil, všiml jsem si, že několik vašich dvořanů si neustále škrábe nesčetná kousnutí. Jednou jsem exkomunikoval tisícihlavé hejno much, načež všechny okamžitě zahynuly. Zdá se, že i zde máte několik prohnilých blech, které potřebují církevní odsouzení!“"
 court.4300.preaching_tour_bernard_of_clairvaux_standard: "„Musím vás požádat o jednu závažnou laskavost. [ROOT.GetCharacter.GetFaith.HighGodName] sice požehnal mé mysli, ale mým útrobám nikoli. V mém nynějším stavu nedokážu kázat, pokud pode mnou není vykopaná latrína. Nenašel by se někdo, kdo by mě na cestě doprovázel coby křesťanský kopáč jam?“"
 court.4300.preaching_tour_default: "Vchod do mého trůnního sálu zablokoval kněz, který každému příchozímu rozdává červené odznaky ve tvaru kříže, aby si je připjal na oděv.\n\n„[ROOT.GetCharacter.GetFaith.HighGodName] nás provází! Putuji po panstvích našich spojenců zavázaných ke svaté válce a svými kázáními podporuji nábor i získávání prostředků.“"
 court.4300.a: "„Máte mé pero i můj meč!“"
 court.4300.b: "„Exkomunikujme ten odbojný hmyz!“"
 court.4300.c: "„Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že [possible_latrine_digger.GetTitledFirstNameNoTooltip] zoufale touží pomoci!“"
 court.4300.d: "„Mé pokladnice jsou otevřené dokořán jako obloha!“"
 court.4300.e: "„Na této výpravě tě doprovodí má osobní stráž.“"
 court.4300.e.tt: "[bernard_guard_1.GetTitledFirstName] a [bernard_guard_2.GetTitledFirstName] budou doprovázet [right_portrait_character.GetTitledFirstName] po tvém panství."
 court.4300.f: "Nejsem [Select_CString(ROOT.Char.IsFemale,'hodna','hoden')] promluvit s takovým člověkem, a tak v tichosti pokleknu."
 court.4300.g: "Ten křížový odznak, který má [right_portrait_character.GetNameNoTooltip], vypadá poněkud nevkusně, nemyslíš?"
 court.4300.a.tt: "Náklady na [Concept('piety','zbožnost')|E] a [Concept('gold','zlato')|E] potřebné k založení svatého řádu se výrazně sníží"
 court.4350.t: "Šafrán v plamenech"
 court.4350.desc: "Můj [concerned_marshal.GetCouncilTitle] právě [Select_CString(concerned_marshal.IsFemale,'domluvila','domluvil')] s dvojicí ohořelých obchodníků, kteří se dokulhali do mého trůnního sálu. „Řada našich obchodních karavan převážejících šafrán z [caravan_attacker_liege.GetCapitalLocation.GetTitle.GetNameNoTier] do [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] byla přepadena. Ti ničemové nebyli žádní bandité, ale smečka křesťanských zeměpánů v plné plátové zbroji.“\n\n[concerned_marshal.GetNameNoTooltip] si hluboce povzdechne. „Hlupáci, kterým se stýská po masakrování našich lidí, se nás pokoušejí vyprovokovat k válce za zády svého lenního pána. Pokud odpovíme silou, riskujeme dohody s [caravan_attacker_liege.GetName] o dovozu luxusního zboží, které naši dvořané tolik milují.“"
 court.4350.a: "Takovou šaškárnu je těžké přehlížet, ale obchod má přednost."
 court.4350.b: "Podnikněme pár nájezdů také!"
 court.4350.c: "Uvidíme, jak budou ti spratci kňučet, až jim přestaneme dodávat cukr!"
 court.4350.c.tt: "#F Ukončíš obchod s [caravan_attacker_liege.GetNameNoTooltip]#!"
 court.4355.t: "Kdo se odváží bojovat se Saracénem?"
 court.4355.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ ozve se [reporting_marshal.GetCouncilTitle], „[Select_CString(reporting_marshal.IsFemale,'zaslechla','zaslechl')] jsem, jak se [caravan_attacker.GetTitledFirstName] chlubí, že spolu s houfem šlechticů vyrážejí jako obyčejní lapkové a přepadávají karavany vezoucí cukr z [attacked_liege.GetCapitalLocation.GetTitle.GetNameNoTier]. Tihle psi slintají po svaté válce a snaží se vyprovokovat [attacked_liege.GetTitledFirstName]. Podle mě ale potřebujeme obchod mnohem víc než nějakou bitvu—“\n\n„Žádné jídlo nepotřebujeme, stačí nám krev nevěřících!“ zahřmí přes celý trůnní sál [caravan_attacker.GetTitledFirstNameNoTooltip]."
 court.4355.a: "Výborná práce! Plenit nevěřící je posvátný čin!"
 court.4355.a.tt: "Zařídíš další nájezdy na obchodní karavany"
 court.4355.b: "Stráže! Mlaťte [caravan_attacker.GetNameNoTooltip] cukřenkou, dokud nebude činit pokání."
 court.4355.c: "Mám pocit, že [caravan_attacker.GetNameNoTooltip] bude plenit dál bez ohledu na můj rozkaz."
 court.4355.c.tt: "#F A také že ano!#!"
 court.4400.t: "Hlava nehlava"
 court.4400.desc: "Do mého trůnního sálu vtrhne houf oděných [Select_CString(head_chasing_monk.IsFemale,'žen','mužů')], zběsile prohledávají podlahu a při horečném pátrání převracejí všechno od židlí až po sukně.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip]!“ vykřikne [Select_CString(head_chasing_monk.IsFemale,'jedna','jeden')] z nich. „Jsme následovníci [the_headless.GetTitledFirstNameNoTooltip] Bezhlavého, velké svaté [Select_CString(the_headless.IsFemale,'ženy, které','muže, kterému')] [ROOT.GetCharacter.GetFaith.HighGodName] při narození seslal proroctví, podle něhož má přijít o hlavu. Jak se u svatých osob občas stává, hlava se pak sama odkutálela. Pronásledujeme ji napříč krajem a jsme si #EMP naprosto jisti#!, že se vykutálela na pahorek a přímo do vašeho [ROOT.GetCharacter.Custom('FortifiedBuilding')]!“"
 court.4400.a: "Dovoluji vám prohledat [ROOT.GetCharacter.Custom('FortifiedBuilding')]."
 court.4400.b: "Přidám se k hledání!"
 court.4400.c: "Nedovolím nějakému kultu, aby mi převracel dvůr naruby!"
 court.4400.b.discovery: "Ve svém [THIS.GetCharacter.Custom('FortifiedBuilding')] najdeš dávno zapomenutou starožitnost"
 court.4400.b.failure: "Kultisté nadělají nepořádek"
 court.4400.b.severed_head: "Useknutá hlava je nalezena!"
 court.4400.c.backdown: "Kult se nechá zastrašit"
 court.4400.c.refusal: "Kult se vrátí"
 court.4401.desc: "Sklepení mého [ROOT.GetCharacter.Custom('FortifiedBuilding')] skrývají mnohem víc zbytečných cetek, než bych [Select_CString(ROOT.Char.IsFemale,'byla ochotná','byl ochotný')] přiznat."
 court.4401.desc_arbitrary: "[head_chasing_monk.GetName] se chlubím svým geniálním bezpečnostním systémem — pokud kromě mě nikdo nechápe, jak jsou ty hromady uspořádané, nikdo mě nikdy nemůže vykrást!"
 court.4401.desc_default: "Pokaždé, když [head_chasing_monk.GetName] otevře další dveře, čekám, že se na [head_chasing_monk.GetNameNoTooltip] sesype hromada kuriozit. Dokonce jsem [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')], že tu mám [ROOT.Char.Custom('RandomPrivateObject')]!"
 court.4401.desc_object: "\n\nPo přátelském přehrabování hlavu sice nenajdeme, ale [head_chasing_monk.GetName] je očividně [Select_CString(head_chasing_monk.IsFemale,'fascinována','fascinován')] vším kolem. Soudě podle opatrnosti, s jakou zkoumá opuštěný [ROOT.Char.Custom('RandomWeirdObject')], by z [head_chasing_monk.GetNameNoTooltip] [Select_CString(head_chasing_monk.IsFemale,'mohla být cenná antikvářka','mohl být cenný antikvář')]."
 court.4401.desc_head: "\n\nSnad po zápachu [head_chasing_monk.GetName] vytáhne z trosek lidskou hlavu jako prase vyrývající lanýže.\n\nBlízkost sklepení k žaláři však naznačuje, že nejspíš patřila nějaké dávno zapomenuté duši z mých mučíren."
 court.4401.a: "Ach ano! Ehm. To je [the_headless.GetTitledFirstNameNoTooltip]! Ať [ROOT.GetCharacter.GetFaith.HighGodName] přijme naši chválu... a tak dále."
 court.4401.b: "Podívej se, jak čistý je ten řez! To je očividně moje práce."
 court.4401.c: "„[Select_CString(head_chasing_monk.IsFemale,'Nechtěla','Nechtěl')] by ses živit přehrabováním v mém harampádí?“"
 court.4401.d: "Je tu přece jen trochu neútulno — [Select_CString(ROOT.Char.IsFemale,'měla','měl')] bych nařídit úklid."
 court.4402.desc: "Jedné noci otevřu oči a zjistím, že na mně někdo obkročmo sedí. Tohle není žádný slastný sen — vyšinutý mnich, který vtrhl do mého trůnního sálu, mi drží skalpel u krku!\n\n„Když nám bráníš hledat tu hlavu, možná se spokojíme s tou tvojí. Tak pěkně kulatá a lesklá — vsadím se, že se bude krásně kutálet!“"
 court.4402.a: "Co kdybychom ji šli hledat hned teď?"
 court.4402.a.tt: "Odvedeš [head_chasing_monk.GetName] do svého sklepení"
 court.4402.b: "Tu hlavu jsme neviděli! Nech mě být!"
 court.4402.b.success: "Přemůžeš mnicha a pošleš [head_chasing_monk.GetName] do žaláře"
 court.4202.b.success.tt: "Pošleš [head_chasing_monk.GetName] do žaláře"
 court.4402.b.failure: "Budeš zraněn nebo zabit"
 court.4402.c: "Vsadím se, že tou směšnou věcičkou bys mě ani [Select_CString(head_chasing_monk.IsFemale,'nedokázala','nedokázal')] setnout!"
 court.4402.c2.tt: "Budeš částečně sťat"
 court.4402.c3.tt: "Budeš úplně sťat"
 court.4500.t: "Články prstů [ROOT.Char.GetTitleAsNameNoTooltip]"
 court.4500.desc: "Přikodrcá ke mně podomní obchodník v plášti, na němž má našité desítky cetek a tret."
 court.4500.bleeder: "„Vyrábím artefakty, abych z bohatých hlupáků vytáhl zlato. Doslechl jsem se, že máte krve na rozdávání. Určitě se najde dost obdivovatelů, kteří s radostí koupí brož se skleněnou kuličkou obsahující kapku vaší krve.“\n\n[artifact_peddler.GetNameNoTooltip] se zadívá na žíly na mém krku. „Zaplatím štědře a nějaký chudák bude mít pocit, že vlastní špetku panovnické vznešenosti.“"
 court.4500.psalter: "„Mám nádherný žaltář — iluminovaný rukopis s vyřezávanými slonovinovými deskami zdobenými tyrkysovými korálky. Vypráví příběhy o lásce mezi [Select_CString(ROOT.GetCharacter.IsFemale,'ženou','mužem')] a [Select_CString(cheating_character.IsFemale,'ženou','mužem')]. Řezba na [cheating_character.GetTitledFirstNameNoTooltip] jistě zapůsobí natolik, že už nikdy ani nepomyslí na nevěru!“"
 court.4500.chastity_belt: "„V celém panství se ví, že tě sužují nenasytné touhy, které udeří silou katafrakta vystřeleného z trebuchetu. Mám artefakt, který ti od toho břemene uleví.“\n\n[artifact_peddler.GetNameNoTooltip] odhalí pás cudnosti pokrytý rezavými bodci."
 court.4500.holy_needle: "„Mám u sebe vzácnou zbraň hodnou jedině vašich rukou. Svaté kopí z Antiochie, samotné Kopí osudu! Na bojišti s ním nevěřící naprosto rozdrtíte!“\n\n[artifact_peddler.GetNameNoTooltip] vytáhne nepatrný úlomek kovu, který podezřele připomíná šicí jehlu."
 court.4500.finger_bones: "„Vypadáte jako zkušený sběratel.“ [artifact_peddler.GetNameNoTooltip] vytáhne otlučenou truhličku plnou kostí ze všech myslitelných částí končetin a otevře ji.\n\n„Mám jedny z nejvzácnějších článků prstů svatých, některé dokonce potažené zlatem. Prodávám je jednotlivě, ale za celou sadu deseti vám dám zvláštní cenu.“"
 court.4500.dead_chicken: "„Mám tu úžasnou cetku! Noste ji u sebe a každý nepřítel na bojišti si okamžitě pomyslí, že už jste mrtví! Jediné přičichnutí a vaše bezpečí je zaručeno!“\n\nZ hlubin svého pláště [artifact_peddler.GetNameNoTooltip] vytáhne celou mrtvou slepici."
 court.4500.worm: "„[ROOT.GetCharacter.GetLadyLord], mám artefakt vytvářející velkolepou iluzi, s níž můžete všechny přesvědčit, že ovládáte magii.\n\n[artifact_peddler.GetNameNoTooltip] zamává pestrobarevným látkovým červem na velmi tenkém provázku. „Zpočátku vypadá nehybně, ale pohybem nitě lze vyvolat iluzi, že červ ožil! Jen si představte, jak to zapůsobí na [dummy_gender.Custom('LadiesLords')] u dvora!“"
 court.4500.a: "Už teď mám sotva dost krve v těle — zmiz!"
 court.4500.b: "V téhle chvíli už zkusím cokoli."
 court.4500.c: "$court.4500.b$"
 court.4500.d: "Jen by mi to rozpálilo slabiny jiným způsobem..."
 court.4500.e: "Volání Osudu zní!"
 court.4500.f: "Prodávej své lži jinde!"
 court.4500.g: "Používat Kristovu relikvii k zašívání ponožek má něco do sebe..."
 court.4500.h: "Takže #EMP proto#! má dnes tolik sedláků jen devět prstů."
 court.4500.i: "Chci celé předloktí!"
 court.4500.j: "No dobrá, tak sem s tím."
 court.4500.k: "Hrát mrtvého mi už jde docela dobře."
 court.4500.l: "Nebudu si hrát na loutkáře!"
 court.4500.m: "Trocha svíjení se mi líbí!"
 court.4500.n: "$court.4500.j$"
 court.4600.t: "Nejlepší [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')|U], jaký lidstvo zná"
 court.4600.desc: "Zahlédnu svého číšníka [cupbearer.GetTitledFirstName] a [cupbearer_friend.GetTitledFirstName], jak se lehce potácejí, zatímco [cupbearer.GetTitledFirstNameNoTooltip] nalévá [cupbearer_friend.GetTitledFirstNameNoTooltip] z jedné z mých nejvzácnějších lahví.\n\n„Taková škoda, že [ROOT.GetCharacter.GetTitledFirstName] má všechny ty zásoby [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')] a střeží je jako drak."
 court.4600.desc_lover: "Jsi prostě k nakousnutí, [cupbearer.Custom('LoverPetName')], a zasloužíš si ochutnat něco stejně úžasného, jako jsi ty."
 court.4600.desc_friend: "Každý můj přítel si zaslouží pít jako [ROOT.Char.GetTitleAsNameNoTooltip]!“"
 court.4600.desc_ending: "\n\nKdyž mě spatří, ani nemrknou.\n\n„Á, [ROOT.GetCharacter.GetLadyLord]! Preventivně testujeme všechny vaše nápoje na jed. Až zatížím své útroby každou kapkou, budu zítřejší bolest hlavy považovat jen za válečné zranění utržené v boji na vaši počest!“"
 court.4600.a: "Můj sklep bývá zavřený až příliš často — láhev pro každého u dvora!"
 court.4600.b: "Mé drahocenné zásoby! Takový #EMP nehodný#! služebník."
 court.4600.b.tt: "Tvá příští hostina bude levnější, pokud zabráníš vypití svých zásob"
 court.4600.c: "„Zásoby jsou zamčené, protože tam skladuji otrávený [ROOT.GetCharacter.Custom('RegionalAlcoholicDrink')]!“"
 court.4600.c.tt: "Ti dva se musí ze své neúcty poučit, ale svět si začne dávat pozor na tvé jedy."
 court.4600.c.t: "Číšník otráven!"
 court.4600.d: "Rychle přineste druhou láhev, v ní je protijed."
 court.4600.d.tt: "Pokusíš se ty hlupáky nenápadně vyléčit a své jedy udržet v tajnosti"
 court.4600.d.cure.t: "Protijed přimíchán do nápoje"
 court.4600.d.cure.tt: "Tvé jedy zůstanou tajemstvím"
 court.4600.e: "Myslím, že ty proklaté sklepy na nějakou dobu zamknu."
 court.4700.t: "Trepanace duše"
 court.4700.desc_native_trepanning: "Přichází postava v lékařském oděvu s kufříkem nástrojů, ale když mezi nimi zahlédnu kladivo a bodec, sevře se mi žaludek.\n\n„[ROOT.GetCharacter.GetLadyLord], jsem zkušený trepanátor."
 court.4700.desc_foreign_medicine: "Přichází postava v černém z cizí země s kufříkem plným podivných kladívek připomínajících sochařské nástroje.\n\n„V mé zemi existuje rituál zvaný trepanace a zdá se, že právě vy jej potřebujete."
 court.4700.desc_possessed: "Během vašeho posednutí vám kolem mysli víří duchové, ale ve skutečnosti v ní zůstat nechtějí. $court.4700.desc_passage$ $court.4700.growth$“"
 court.4700.desc_witch: "Jako okultista možná vládnete značnou mocí, ale stále vám něco brání ji plně rozvinout. Vaše magie by mohla dobýt celý svět, kdyby duchové ze vzduchu mohli vstoupit do vaší lebky.“"
 court.4700.desc_melancholic: "Představte si, že by všechna vaše trápení mohla jednoduše odejít z těla a rozplynout se ve vzduchu. Ta muka nejsou vaše, jsou to živí duchové, které mohu osvobodit. $court.4700.growth$“"
 court.4700.desc_heavy_mind: "Vaše mysl je těžká jen proto, že ji něco zatěžuje. Hlava vám překypuje duchy, kteří vám sousto po soustu ukusují z rozumu. $court.4700.growth$ $court.4700.desc_passage$“"
 court.4700.desc_blind: "O zrak jste nepřišli, jen je zastřený. V dužině vašich očí plavou duchové. Mohu se do těch tůní ponořit a vytáhnout je ven.“"
 court.4700.desc_lunatic: "Za vás rozhoduje celý zástup nechtěných duchovních společníků, celé shromáždění šílenců. $court.4700.growth$ S pomocí několika bodců je můžeme dostat ven.“"
 court.4700.desc_headache: "Říká se, že trpíte nesnesitelnými bolestmi hlavy. Čím větší tlak vás v životě svírá, tím více duchů se shromažďuje ve vaší lebce a hoduje na vašich starostech. $court.4700.desc_passage$“"
 court.4700.desc_trepanning_vices: "Zločinné neřesti, z nichž jste obviňováni, nejsou ve skutečnosti vaše. Jen vás dočasně ovládají nějací duchové. $court.4700.desc_passage$“"
 court.4700.growth: "Možná se dokonce skrývají v nějakém výrůstku ve vašem mozku."
 court.4700.desc_passage: "Mohu jim vytvořit průchod na svobodu."
 court.4700.a: "To je výsměch! Mé trápení je mnohem víc než nějaká pověra!"
 court.4700.b: "Už to nevydržím, přineste dláta!"
 court.4700.b.tt: "Dojde k pokusu o operaci..."
 court.4700.c: "Nejsem žádný zločinec — zaostalé smýšlení má můj lid!"
 court.4700.d: "Odmítnu, ale můj lékař by se od vás možná mohl něco naučit."
 court.4700.success: "Trepanaci přežiješ bez úhony"
 court.4700.no_success: "Trepanace nemá žádný účinek"
 court.4700.removal: "Trepanace odstraní tvé trápení"
 court.4700.headache: "Všechny tvé starosti zmizí"
 court.4700.witch_power: "Trepanace posílí tvou čarodějnickou moc"
 court.4700.mental_faculties: "Trepanace poškodí tvé duševní schopnosti"
 court.4700.physical_faculties: "Trepanace poškodí tvé tělo"
 court.4701.physician_study: "Odvedou mě do pracovny mého lékaře [court_physician.GetTitledFirstName]. [trepanner.GetTitledFirstName] tvrdí, že právě [court_physician.GetTitledFirstNameNoTooltip] má schopnosti potřebné k tomu, aby při zákroku pomáhal. Zatímco mě [trepanner.GetTitledFirstNameNoTooltip] připoutává k židli, [court_physician.GetTitledFirstNameNoTooltip] postává opodál."
 court.4701.no_physician: "Odvedou mě do zadní místnosti mého [ROOT.Char.Custom('FortifiedBuilding')]. [trepanner.GetTitledFirstNameNoTooltip] mě ujišťuje, že kdyby dvůr slyšel můj křik, jen by to všechny znepokojilo, a připoutává mě k židli.\n\n"
 court.4701.physician_excited: "„Ach, jak já miluji pořádnou trepanaci!“\n\n"
 court.4701.physician_excited_2: "„Jak vzrušující! Nový zákrok!“\n\n"
 court.4701.physician_concerned: "„Opatrně!“\n\n"
 court.4701.physician_concerned_2: "„Pokud tahle barbarská praktika selže, zasáhnu.“\n\n"
 court.4701.mental_health_cannot_be_trepanned_away: "$court.4701.trepanning_vices_operation$ \n\n[Select_CString(ROOT.Char.IsFemale,'Přála','Přál')] bych si, aby léčba dokázala tu bolest zahnat, ale přece jen mě uklidňuje vědomí, že má mysl patří alespoň mně, a ne nějakému démonovi."
 court.4701.trepanning_success: "Úder kladiva zarazí bodec do mé lebky. Brány mého těla se rázem otevřou. Srdce mi buší, třesu se a chvěji, ale cítím, jak ze mě mé trýznivé plameny odcházejí. Uprostřed spršky jisker bolesti se nořím do nádherně klidného nového světa."
 court.4701.trepanning_witch_power: "Nebojím se, když se mi dláto začíná zavrtávat do lebky. Zatímco mi na mozek vtírají masti a oslepující vjemy zaplavují smysly, slyším, jak se [ROOT.Char.GetFaith.WitchGodName|U] směje a vysmívá se tomuto pošetilému rituálu.\n\n$court.4701.trepanning_no_result$"
 court.4701.trepanning_vices_operation: "Kladivo udeří do mé lebky, ale zatímco svírám židli, $court.4701.trepanning_no_result$"
 court.4701.trepanning_headache_operation: "$court.4701.trepanning_no_result$ Bolest v mé hlavě je pryč."
 court.4701.trepanning_mental_injury: "[trepanner.GetTitledFirstNameNoTooltip] mi jemně poklepává kladívkem na lebku, jako by rozbíjel vejce naměkko."
 court.4701.trepanning_incapable_injury: "Zalije mě zvláštní záře. Pocítím náhlý příval a před očima se mi naráz objeví výjevy ze dnů a let minulosti. Kde to jsem? Proč mě bolí hlava? Jak se jmenuji? Jakou náplň do koláče mám nejradši?"
 court.4701.trepanning_possessed_injury: "Slíbili mi, že z mé hlavy vypustí duchy, a najednou skutečně poprvé jednoho spatřím. Pohledný okřídlený přízrak tančí po místnosti ze stínu do stínu a šklebí se na mě."
 court.4701.trepanning_deviant_injury: "Jak se otvor prohlubuje, začínám si vychutnávat mlaskavé zvuky vlastních útrob. Po několika závratných okamžicích mě náhle zasáhnou záblesky geniality! Musím žít výhradně v noci a jíst jen chlebové kůrky! Proč jsem se nikdy [Select_CString(ROOT.Char.IsFemale,'nemilovala','nemiloval')] a přitom [Select_CString(ROOT.Char.IsFemale,'nepředstírala','nepředstíral')], že jsem kůň?"
 court.4701.trepanning_learning_penalty: "Skalpel krouží stále dokola a já zjišťuji, že ze sebe sotva dokážu vypravit #EMP dost!#! Když se pohyb konečně zastaví, má nebohá zmatená mysl se musí brodit bahnem, aby vůbec sestavila větu."
 court.4701.trepanning_physical_injury: "Zpočátku mi bodce odsekávající kousky lebky působí takovou bolest, jako by mi někdo rozřezával páteř vejpůl. Jak se však výkop prohlubuje,"
 court.4701.trepanning_no_result: "vzpamatuji se. Když je bodec konečně vytažen, necítím žádnou změnu kromě lehkého průvanu vanoucího na můj obnažený mozek."
 court.4701.trepanning_coordination_penalty: "Začínám úplně ztrácet cit. Když je bodec konečně vytažen, ani to necítím. Pokusím se vstát, ale mé tělo mě sotva poslouchá."
 court.4701.trepanning_blind_injury: "můj zrak se náhle promění v moře mlhy. O vteřinu později truchlím i za tou mlhou, když vstupuji do říše věčného soumraku."
 court.4701.a: "Hihi! Ahoj!"
 court.4701.b: "Bastarde! Co jsi to [Select_CString(trepanner.IsFemale,'udělala','udělal')]?!"
 court.4701.c: "Moje nebohá lebka!"
 court.4701.d: "Kdo je hodný démon? Ano, ty!"
 court.4701.e: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych vyházet z okna všechno své spodní prádlo!"
 court.4701.f: "Fantastické! Nechceš se stát mým dvorním lékařem?"
 court.4701.g: "Důkaz, že mé údajné „neřesti“ nejsou dílem démonů"
 court.4701.h: "Jsem tvým dlužníkem... jakmile mi seženeš špunt do té díry..."
 court.4701.i: "Se svými sužujícími myšlenkami se musím vypořádat jen já."
 court.4750.t: "Potřebuji hrdinu"
 court.4750.desc: "Nedávno k mému dvoru [Select_CString(poet.IsFemale,'zavítala nová hostka, výřečná básnířka','zavítal nový host, výřečný básník')] s jistou místní pověstí.\n\n„[ROOT.GetCharacter.GetLadyLord], tak jako dávní vypravěči sedávali u nohou starých válečníků, i já, [poet.GetFirstName], doufám, že pod vaší ochranou naleznu uplatnění. Dovolte mi prosím předvést, co umím! Třeba bych vám [Select_CString(poet.IsFemale,'mohla','mohl')] věnovat své příští dílo!“\n\n„Velkolepé eposy jsou mou doménou, [ROOT.Char.GetTitleAsName]. O kterém hrdinovi si přejete slyšet?“"
 court.4750.a: "Vymysli nějaký příběh z dob papežky Jany!"
 court.4750.b: "Lady Godiva! Baladu o její jízdě!"
 court.4750.c: "Sindibád je tak odvážná postava!"
 court.4750.d: "Caligula... nedoceněný, ale zajímavý člověk."
 court.4750.e: "Příběhy o Nasreddinovi mi vždy vykouzlí úsměv na tváři."
 court.4750.f: "Vyprávěj mi o Válmíkím, prvním básníkovi!"
 court.4750.g: "Přece o mně, samozřejmě!"
 court.4750.h: "Nemám času ani zlata nazbyt."
 court.4751.intro: "Jak jsem si [Select_CString(ROOT.Char.IsFemale,'přála','přál')], [Select_CString(poet.IsFemale,'nová básnířka','nový básník')] [poet.GetFirstName] mi přináší dílo inspirované"
 court.4751.topic.pope_joan: "papežkou Janou,"
 court.4751.topic.lady_godiva: "Lady Godivou,"
 court.4751.topic.sinbad: "Sindibádem,"
 court.4751.topic.caligula: "Caligulou,"
 court.4751.topic.nasreddin: "Nasreddinem,"
 court.4751.topic.valmiki: "Válmíkím,"
 court.4751.topic.ruler_hero: "mým hrdinským životem,"
 court.4751.topic.unexpected: "ale výsledek není takový, jaký jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]."
 court.4751.ruler_character: "\n\nStačí krátce prolistovat iluminovaný rukopis a zjišťuji, že v příběhu vystupuji po boku hrdiny i já!\n\n"
 court.4701.pope_joan_desc: "\n\nKdyž se zadívám na ilustrace, uvědomím si, že iluminace Jany nesou mou vlastní tvář!\n\n[poet.GetTitledFirstNameNoTooltip|U] se ke mně nakloní. „Vaše půvaby daleko převyšují půvaby naší papežky. Stejně jako Janin milenec přesvědčil Janu, aby se převlékla za muže a odešla studovat do Athén, předávám vám tento text s přáním, abyste postavou, kterou mám #EMP údajně#! uctívat, [Select_CString(ROOT.Char.IsFemale,'byla','byl')] vy.“"
 court.4701.ruler_hero_desc: "\n\nBáseň pojednává o mých slavných skutcích. Některé jsou skutečnější než jiné, ale všechny jsou bez výjimky působivé."
 court.4751.topic.lady_godiva_desc: "V básni jedu po boku Lady Godivy. Stejně krásně — a stejně [Select_CString(ROOT.Char.IsFemale,'nahá','nahý')]!"
 court.4751.topic.sinbad_desc: "Jsem tajemnou postavou, na kterou Sindibád během svých dobrodružství naráží znovu a znovu. Jsem tvor líhnoucí se z obrovského vejce ptáka Rucha. Jsem Stařec moře, který se Sindibádovi celé roky drží na ramenou. Jsem zajatcem lidožravého obra."
 court.4751.topic.caligula_desc: "V textu vystupuji jako Caligulův unavený rádce, plný moudrosti, kterému však bohužel málokdy někdo naslouchá."
 court.4751.topic.nasreddin_desc: "Příběhy líčí Nasreddina, jak za mnou při mých dvorských povinnostech jezdí na oslu a ke každému mému kroku pronáší uštěpačné poznámky."
 court.4751.topic.valmiki_desc: "\n\nStejně jako v legendě lovec zastřelí nádherného ptáka a mně bezděčně vyklouzne z úst dvojverší.\n\nTak jako první básník složil svou první báseň náhodou, i já začínám tvořit spontánní verše pokaždé, když mě něco zaskočí."
 court.4751.a: "Ta bezbožnost tvého obdivu tomu kupodivu dodává ještě větší kouzlo..."
 court.4751.b: "Možná bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] zamířit výš... až k papežskému stolci."
 court.4751.c: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych se zlobit, ale tohle mi jistě získá obdivovatele..."
 court.4751.c.tt: "Ti, které přitahuješ, si toho jistě všimnou..."
 court.4751.d: "Tohle mi vnukává poněkud nečisté myšlenky."
 court.4751.e: "Za jeho žerty se vždy skrývá nějaké ponaučení."
 court.4751.f: "Tohle je zábavné. Dvůr si to určitě užije."
 court.4751.g: "Tak to má být!"
 court.4751.h: "Tohle vypadá jako prvotřídní podpal pro můj příští oheň."
 court.4800.t: "Roztáhni křídla"
 court.4800.desc: "„Ještě jednou udělej ten zvuk, šašku, a letíš dolů!“ Když narazím na svého osobního strážce [defenestrating_bodyguard.GetTitledFirstName], všimnu si, že společnost mu dělá zadní polovina [defenestrated_character.GetTitledFirstName], která visí z okna.\n\n[defenestrating_bodyguard.GetTitledFirstNameNoTooltip] zatne zuby. „[defenestrated_character.GetTitledFirstNameNoTooltip] se mi [Select_CString(defenestrated_character.IsFemale,'posmívala','posmíval')] kvůli tomu, že při službě zachovávám kamennou tvář. Neustále na mě [Select_CString(defenestrated_character.IsFemale,'kejhala','kejhal')] jako husa, aby mě [Select_CString(defenestrated_character.IsFemale,'vyvedla','vyvedl')] z míry. Považuji to za ohrožení vaší bezpečnosti.“\n\nNavzdory nebezpečí a marným pokusům vykroutit se [defenestrated_character.GetTitledFirstNameNoTooltip] zachichotá. „#EMP Kej#!.“"
 court.4800.a: "Tak se podívejme, jestli husy umějí létat!"
 court.4800.maimed_toast: "Nelétavý [defenestrated_character.GetTitledFirstName]"
 court.4800.death_toast: "[defenestrated_character.GetTitledFirstName] [Select_CString(defenestrated_character.IsFemale,'zahynula','zahynul')] při letu"
 court.4800.b: "Nepřehánějme to! Stačí [defenestrated_character.GetNameNoTooltip] trochu zdvořile ztlouct."
 court.4800.c: "[defenestrated_character.GetTitledFirstNameNoTooltip] má pravdu — dobrý strážce se nikdy nenechá vyprovokovat."
 court.4801.t: "K prasknutí"
 court.4801.desc: "Ještě dlouho předtím, než zahlédnu drobného [poopy_child.GetTitledFirstName] hrát si v mém trůnním sále, ucítím nezaměnitelný zápach.\n\n„Jé, [ROOT.GetCharacter.Custom('GetMamaPapa')|l]! Vždycky tě tak [Select_CString(poopy_child.IsFemale,'ráda','rád')] vidím!“ [poopy_child.GetName] se ke mně rozběhne obejmout mi nohu a já ucítím, jak se mi o lýtko přitiskne těžká, plná plena.\n\nKdyž její obsah začne prosakovat až ke kotníku, napadne mě: To máme opravdu tak málo služebnictva, že se musím ponižujícího přebalování ujmout osobně?"
 court.4801.a: "„Pojď ke mně, dáme tě do pořádku.“"
 court.4801.b: "Raději prohraji válku, než abych se té špíny [Select_CString(ROOT.Char.IsFemale,'dotkla','dotkl')]."
 court.4802.t: "Vzdělávání pod nátlakem"
 court.4802.desc: "Vidím svého dvorního učitele [court_tutor.GetTitledFirstName], obklopeného houfem žáků.\n\n„Učiteli, co je to rovnoběžník?“\n\n„Učiteli, co znamená... ‚milovat se‘?“\n\n„Učiteli, mám na flétnu hrát hlasitěji, nebo #EMP mnohem#! hlasitěji?“\n\n[court_tutor.GetTitledFirstNameNoTooltip] ke mně vzhlédne zapadlýma očima. „[ROOT.GetCharacter.GetLadyLord], už to dál nevydržím. Prosím, zbavte mě této funkce.“"
 court.4802.a: "Ach, nejsou k zulíbání?"
 court.4802.b: "Koupím ti trubku, [child_2.GetTitledFirstNameNoTooltip]. Ta bude #EMP ještě hlasitější#!!"
 court.4802.c: "Rozumím. Najdeme nového dvorního učitele."
 court.4803.t: "Pero za oponou"
 court.4803.desc: "[Select_CString(court_poet.IsFemale,'Má dvorní básnířka','Můj dvorní básník')], jakmile se ocitnu na doslech, začne jako vždy deklamovat. „Ó, [ROOT.GetCharacter.Custom('PetName')]! Jak těžké musí být žít jako někdo, koho múzy opustily.“\n\n„Velíš armádám, ale psanému slovu poručit nedokážeš. Spatřilo kdy lidstvo vytříbenější tragédii?“\n\n„Dovol mi pomoci. [Select_CString(court_poet.IsFemale,'Mohla','Mohl')] bych ti psát některé projevy. Řekni mi téma a já je oději do nádherných slov.“"
 court.4803.a: "Mým slovům by prospěla jistá... květnatá příměs."
 court.4803.b: "Někdy si připadám spíš jako básník než [ROOT.GetCharacter.GetTitleAsName]. Pomoc nepotřebuji."
 court.4803.c: "Raději bych, abys [Select_CString(court_poet.IsFemale,'napsala','napsal')] báseň ode mě pro mou lásku."
 court.4803.c.tt: "Pošleš báseň [lover.GetTitledFirstName]"
 court.4803.c.intrigue.tt: "Díky vysoké schopnosti [Concept('intrigue','intriky')|E] může [lover.GetFirstNameNoTooltip] poznat, že báseň napsal někdo jiný"
 court.4803.c.realize.tt: "[lover.GetFirstNameNoTooltip] odhalí skutečného autora"
 court.4803.c.fooled.tt: "[lover.GetFirstNameNoTooltip] je [Select_CString(lover.IsFemale,'polichocená','polichocený')] „tvou“ básní"
 court.4803.d: "Má slova možná nejsou vytříbená, ale vycházejí ze srdce."
 court.4804.t: "Nesnesitelní spolunocležníci"
 court.4804.desc: "Všimnu si dvou dvořanů, kteří sdílejí pokoj a právě se hádají. Oba mají pod očima hluboké tmavé kruhy.\n\n„[ROOT.GetCharacter.GetLadyLord], s [roomate_2.GetTitledFirstName] už nedokážu sdílet postel ani jedinou noc. Je to nenasytné prase, celou přikrývku si zabere pro sebe.“\n\n„A tento týden nebyla jediná noc, kdy by [roomate_1.GetTitledFirstName] [ROOT.Char.Custom('RandomBadRoomate')].“ [roomate_2.GetTitledFirstNameNoTooltip] se otřese. „Prosím vás, dejte nám lepší ubytování. O ničem nesním víc než o studené, prázdné posteli.“"
 court.4804.a: "Požádám služebnictvo, aby vám našlo nové spolunocležníky."
 court.4804.b: "Takové komnaty se k mému dvoru #EMP vůbec#! nehodí."
 court.4804.c: "Nemáme dost místa, aby měl každý vlastní pokoj."
 court.4805.t: "Šetření na nesprávném místě"
 court.4805.desc: "[Select_CString(royal_architect.IsFemale,'Má architektka','Můj architekt')] [royal_architect.GetTitledFirstName] vláčí obrovský pytel a celou dobu se šklebí od ucha k uchu. Když pytel dře a škrábe podlahu mého trůnního sálu, bolestně sebou cuknu.\n\n„[ROOT.GetCharacter.GetLadyLord], [Select_CString(royal_architect.IsFemale,'provedla','provedl')] jsem něco #EMP velmi#! nezbedného, ale mám pocit, že vás to potěší.“\n\nKdyž [royal_architect.GetTitledFirstNameNoTooltip] pytel otevře, očekávám nějakou oplzlost, ale uvnitř vidím jen velký obdélníkový kus kamene. „Tohle je základní kámen z [rival.Custom('FortifiedBuilding')], který patří [rival.GetTitledFirstName]. Veškerá symbolika jeho slavnostního položení je teď pryč!“"
 court.4805.a: "Postavme z něj prasečí chlívek!"
 court.4805.b: "Chci ho vystavit na čestném místě!"
 court.4805.c: "Už tak lituji svého sváru s [rival.GetNameNoTooltip]. Vrať ho."
 court.4805.d: "Proč mi nosíš tenhle odpad? Vyhoď ho!"
 court.4806.t: "Bezmezný obdiv"
 court.4806.intro: "Po mém trůnním sále se potuluje nová tvář. Kdykoli [adoring_fan.GetName] zahlédne nějaké umělecké dílo představující zvyky [ROOT.Char.GetCulture.GetNameNoTooltip] kultury, začne se chichotat a poskakovat na místě."
 court.4806.hre_desc: "\n\n„Mé srdce! [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTierNoTooltip] je prostě nejlepší! Přestože žiji v [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier], v srdci se skutečně cítím být součástí [ROOT.Char.GetCulture.GetName] kultury! Dokážu vyjmenovat každého knížete-biskupa. Na lýtku mám dokonce vytetovanou tvář [ROOT.GetCharacter.GetTitledFirstNameNoTooltip].“\n\n[adoring_fan.GetNameNoTooltip] sáhne do brašny a vytáhne cosi, co vypadá jako laciná bronzová napodobenina říšské koruny. „Nosím ji skoro každý den a kolemjdoucím říkám: ‚Doufám, že mám váš hlas, kurfiřte!‘“"
 court.4806.byzantine_desc: "Když se [Select_CString(adoring_fan.IsFemale,'nadšená návštěvnice','nadšený návštěvník')] přiblíží, stráže musí [adoring_fan.GetNameNoTooltip] zadržet, aby se [Select_CString(adoring_fan.IsFemale,'nedostala','nedostal')] příliš blízko.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip]! Pocházím sice z [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier], ale [ROOT.Char.GetCulture.GetCollectiveNoun] miluji víc, než mé srdce dokáže snést.“\n\n„Celý život se snažím žít jako jeden z vás a hluboce studuji [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip].“\n\n„Nosím výhradně purpurové spodní prádlo. Jsem [Select_CString(adoring_fan.IsFemale,'přesvědčená','přesvědčený')], že kdyby říše padla, zasáhlo by mě to víc než smrt vlastní matky — svět by nikdy nepřestal poslouchat mé žalostné nářky!“"
 court.4806.general_desc: "Na [Select_CString(adoring_fan.IsFemale,'této návštěvnici','tomto návštěvníkovi')] je něco zvláštního, a když předstoupí, je zřejmé, že s sebou nese napodobeninu mého oblíbeného [ROOT.Char.Custom('signature_weapon')].\n\n„Nemohu jinak než před vámi pokleknout — celý svůj život v [adoring_fan_liege.GetCapitalLocation.GetTitle.GetNameNoTier] jsem [Select_CString(adoring_fan.IsFemale,'zasvětila','zasvětil')] obdivu ke kultuře [ROOT.Char.GetCulture.GetCollectiveNoun]. Mluvím výhradně jazykem [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], jím [ROOT.Char.GetCulture.GetNameNoTooltip] [ROOT.GetCharacter.Custom('GetExpensiveMeal')] a boj s čepelí jsem [Select_CString(adoring_fan.IsFemale,'studovala','studoval')] ve stylu [ROOT.Char.GetCulture.GetName] kultury.“\n\n„Rodina mě vyhnala z domu s tím, že když nedokážu dělat nic jiného než být [Select_CString(adoring_fan.IsFemale,'posedlá','posedlý')] [ROOT.GetCharacter.GetPrimaryTitle.GetNameNoTooltip], [Select_CString(adoring_fan.IsFemale,'měla','měl')] bych tam rovnou žít.“"
 court.4806.a: "Lichotí mi to, i když je to trochu znepokojivé."
 court.4806.b: "Dej mi tu ošuntělou věc! Korunu nesmí nosit nikdo kromě mě."
 court.4806.c: "Takové nadšení si zaslouží místo u našeho dvora!"
 court.4806.c.byz: "Za takové vlastenectví ti dovolím nosit purpur."
 court.4806.d: "Purpur smí nosit jen [ROOT.Char.GetTitleAsNameNoTooltip]! Zavřete toho ubožáka!"
 court.4806.e: "Jak se opovažuješ napodobovat můj [ROOT.Char.Custom('signature_weapon')]! Seberte [Select_CString(adoring_fan.IsFemale,'ji','mu')] to!"
