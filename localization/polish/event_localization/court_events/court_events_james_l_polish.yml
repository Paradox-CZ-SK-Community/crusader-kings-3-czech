l_polish:
 court.0101.t: "Spodina u dvora"
 court.0101.desc.opening: "Před [executioner.GetName] předvedli [Select_CString(lowborn_criminal.IsFemale,'vězeňkyni','vězně')] jménem [lowborn_criminal.GetName] kvůli"
 court.0101.desc.murderer: "nevýslovné vraždě!\n\n"
 court.0101.desc.deviant: "zvířeckým skutkům a bezbožným neřestem!\n\n"
 court.0101.desc.witch: "zlotřilým skutkům a zločinům, které odsuzuje [lowborn_criminal.GetFaith.HighGodName]!\n\n"
 court.0101.desc.lazy: "neuposlechnutí příkazů mistra. U vesnického zedníka je [lowborn_criminal.GetName] v učení a [Select_CString(lowborn_criminal.IsFemale,'byla obviněna','byl obviněn')] z odmlouvání mistrovi, neuposlechnutí rozkazů, a dokonce ze zpochybňování mistrovy odbornosti."
 court.0101.desc.thief: "četným případům krádeží po celém panství.\n\n Tahle spodina už svým rozkrádáním korunního majetku, jako je chléb, zelenina, a dokonce i oblečení, vysála [ROOT.Char.GetPrimaryTitle.GetName] do sucha!"
 court.0101.desc.sumptuary: "porušování přepychových zákonů, které [ROOT.Char.GetTitleAsNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'vydala','vydal')].\n\n [lowborn_criminal.GetName] nosí nejrůznější křiklavé a nevkusné látky a spolu vůbec neladící oblečení. Není to jen urážka, kterou musí [ROOT.Char.GetTitleAsNameNoTooltip] strpět, ale i zločin proti obyčejné slušnosti."
 court.0101.desc.cannibal: "[lowborn_criminal.GetName] se svou rodinou žije v jeskyni nedaleko [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a láká pocestné na příslib jídla a přístřeší. Rodina takto údajně snědla přes tisíc pocestných a obyvatelé [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] požadují spravedlnost."
 court.0101.desc.sadistic: "[lowborn_criminal.GetName] [Select_CString(lowborn_criminal.IsFemale,'podřízla','podřízl')] mlynáři hrdlo a [Select_CString(lowborn_criminal.IsFemale,'vyrabovala','vyraboval')] jeho dům. Navíc [Select_CString(lowborn_criminal.IsFemale,'přinutila','přinutil')] mlynářovu ženu, aby připravila vejce, která pak [lowborn_criminal.GetName] [Select_CString(lowborn_criminal.IsFemale,'jedla','jedl')] z těla mrtvého mlynáře a nutila ji, aby se přidala."
 court.0101.desc.priest: "[lowborn_criminal.GetFaith.PriestNeuter] [lowborn_criminal.GetName] [Select_CString(lowborn_criminal.IsFemale,'zavraždila','zavraždil')] člena vlastní náboženské obce. Tahle zrůda se pokusila získat od [lowborn_criminal.GetFaith.GetAdjective] autorit milost za svůj zločin, ale stráže [lowborn_criminal.GetName] přistihly při návratu do [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a tohoto zlotřilého [lowborn_criminal.GetFaith.PriestNeuter] okamžitě zatkly."
 court.0101.desc.stableboy: "Přišlo se na to, že [lowborn_criminal.GetName] a [lowborn_criminal.Custom('servant_for_romance')] se oddávají choulostivým hrátkám. Nejde jen o nevěru, ale i o urážku cti rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!"
 court.0101.desc.kinky: "[lowborn_criminal.GetName] [Select_CString(lowborn_criminal.IsFemale,'byla nalezena připoutaná ke kůlu a od hlavy k patě pokrytá','byl nalezen připoutaný ke kůlu a od hlavy k patě pokrytý')] kaší, s ohavným zařízením připevněným k intimním partiím. Rány na těle svědčí o zraněních způsobených pro potěšení a [Select_CString(lowborn_criminal.IsFemale,'vězeňkyně se očividně vůbec nestydí','vězeň se očividně vůbec nestydí')] za své nepřirozené touhy."
 court.0101.desc.animals: "Přišlo se na to, že [lowborn_criminal.GetName] provozuje bezbožné hrátky s jedním kusem vlastního dobytka, koněm a pláství medu. Taková zvrhlost odporuje tomu, co přikazuje [lowborn_criminal.GetFaith.HighGodName], a je zločinem nejen proti přírodě, ale i proti slušnosti a zdravému rozumu!"
 court.0101.desc.baby_soup: "Obyvatelé [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] udali [lowborn_criminal.GetName] za nevýslovný čin: vaření vlastních novorozených dětí zaživa spolu s bylinkami a zeleninou. Tento zrůdný čin měl nepřirozeně prodloužit život!"
 court.0101.desc.suspicious_healer: "Jako [Select_CString(lowborn_criminal.IsFemale,'léčitelka','léčitel')] čelí [lowborn_criminal.GetName] obvinění, že pomocí nekalé magie přináší smrt nemocným a starým lidem z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Prohřešků má [lowborn_criminal.GetName] na svědomí tolik, že si [Select_CString(lowborn_criminal.IsFemale,'vysloužila','vysloužil')] přezdívku „Anděl [lowborn_criminal.GetFaith.DeathDeityNamePossessive]“."
 court.0101.desc.devil_worshiper: "[lowborn_criminal.GetName] [Select_CString(lowborn_criminal.IsFemale,'byla považována za zbožnou ženu','byl považován za zbožného muže')] a ve svém obydlí [Select_CString(lowborn_criminal.IsFemale,'měla','měl')] soukromou svatyni. Při její prohlídce však vyšlo najevo, že [Select_CString(lowborn_criminal.IsFemale,'její','jeho')] úctě se netěší [lowborn_criminal.GetFaith.HighGodName], nýbrž [lowborn_criminal.GetFaith.WitchGodName], a navíc přináší bezbožné oběti!"
 court.0101.desc.outro: "\n\n[executioner.GetName] ujišťuje, že znechucení nad tímto hříšníkem je stejně silné jako u kohokoli jiného, a ptá se tě, co se má s touto ubohou duší stát."
 court.0101.a.cannibal: "Rozsekejte celou rodinu a hoďte ji psům."
 court.0101.a.sadistic: "Pár otáček na lámacím kole to spraví."
 court.0101.a.priest.sky: "Ať supi hodují na těle... ještě zaživa."
 court.0101.a.priest: "Dopřejte náležitý pohřeb... zaživa."
 court.0101.a.stableboy: "Odřízněte přirození a hoďte ho koním."
 court.0101.a.kinky: "Veřejně zbičovat až k smrti."
 court.0101.a.animals: "Upálit zaživa i s dobytkem."
 court.0101.a.baby_soup: "Hodit do kotle s dehtem."
 court.0101.a.suspicious_healer: "Ať si taky ochutná trochu „medicíny“."
 court.0101.a.devil_worshiper: "Možná otevřený oheň pomůže pocítit blízkost. [lowborn_criminal.GetFaith.WitchGodMistressMaster] pak bude skoro na dosah."
 court.0101.a: "Jedinou odpovědí je mučení až k smrti."
 court.0101.b: "Nalož s tím, jak chceš."
 court.0101.c.deviant: "To zní, jako by někdo věděl, jak se pořádně bavit!"
 court.0101.c.beastiality: "... #EMP a#! kůň? Tvůrčí génius!"
 court.0101.c: "[lowborn_criminal.GetNameNoTooltip] se umí bavit!"
 court.0101.d: "Zavřít. Rozhodnu později..."
 court.0102.t: "Společenská poskvrna popravčího řemesla"
 court.0102.desc: "Vidím [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)], jak sedí s melancholickým výrazem ve tváři. Když se zeptám, co trápí tu temnou mysl, ozve se povzdech.\n\n „Víte, [ROOT.Char.GetLadyLord], každou noc se musím trmácet daleko za [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], jen kvůli spaní. Popravčí totiž nesmějí pobývat uvnitř města. Ne že by mě mučení nebavilo nebo tak něco, ale člověku začne být samotno, když slyší jen výkřiky zatracených.“"
 court.0102.a: "Dnes v noci přespíš na hradě. Na mé pozvání."
 court.0102.b: "Je to těžký život, ale někdo ho žít musí."
 court.0102.c: "Ha! Lítost si nezasloužíš o nic víc než krysy v mém kanále!"
 court.0103.t: "Příležitost až za hrob"
 court.0103.desc.opening: "[executioner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi poslední dobou často padá do oka: nosí čím dál dražší oděv a naparuje se jako páv.\n\nKdyž se zeptám, ukáže mi žluté zuby v širokém úšklebku a poví mi, že si přivlastňuje cennosti zatracených."
 court.0103.desc.hair_and_teeth: "Výdělečná činnost spočívá v prodeji pramenů vlasů vězňů výrobcům panenek, zubů těm, kterým chybějí, a dokonce očních bulv lidem provozujícím čarodějnictví."
 court.0103.desc.jewelry: "Přiznává se ke krádežím šatstva a šperků zatracených a jejich následnému prodeji, čímž z těch několika málo věcí, které lidem v žaláři ještě zůstaly, plyne pěkný zisk. Mizí dokonce i majetek z mrtvol nedávno zesnulých!"
 court.0103.desc.meat: "Mrtvoly nedávno zesnulých porcuje a kusy jejich masa prodává na trhu jako exotickou lahůdku! Tvrdí, že je to lepší než dopřát jim předepsané pohřební obřady, protože zatracení si taková poslední přání nezaslouží."
 court.0103.desc.saint_bones: "Z kostí neurozených vězňů odstraňuje zbytky vnitřností a prodává je jako padělané relikvie. Zahraniční návštěvníci a duchovní jsou tak klamáni a kupují je v domnění, že jde o kosti svatých!"
 court.0103.desc.outro: "\n\nJe zřejmé, že tahle živnost nese pěkné peníze, bez ohledu na to, co si kdo myslí o tom zrůdném obchodu."
 court.0103.a: "Přiber mě do toho a slibuji víc vězňů!"
 court.0103.b: "Tahle příšerná živnost končí!"
 court.0103.c: "Budu dělat, že ke mně nic nedolehlo."
 court.0104.t: "Nezdravá posedlost"
 court.0104.desc: "„Ó! Ó! A co jsi udělal[Select_CString(executioner.IsFemale,'a','')] potom?“ Veselý hlásek mého milovaného svěřence [morbid_child.GetName] se rozléhá chodbami [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. K mému úžasu vidím, jak [morbid_child.GetName] vzhlíží k [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] s jakýmsi bezelstným obdivem, jaký jsem u [Select_CString(morbid_child.IsFemale,'té dívky','toho chlapce')] ještě nikdy neviděl[Select_CString(ROOT.Char.IsFemale,'a','')]. „Zapálil[Select_CString(executioner.IsFemale,'a','')] jsem oheň a ta krysa se mu začala zavrtávat přímo do hrudi, aby unikla! Klasika, zpíval jako slavík!“ Popravčí posměšně zakvičí, což mého [morbid_child.Custom('PetName')] [morbid_child.GetName] náramně pobaví."
 court.0104.a: "K popukání! A co bylo dál?"
 court.0104.b: "Tahle morbidní fascinace teď skončí!"
 court.0104.c: "Budu dělat, že jsem nic neslyšel[Select_CString(ROOT.Char.IsFemale,'a','')]."
 court.0106.t: "Temné divadlo pro temné skutky"
 court.0106.desc: "Nad dvorem se smráká. Popravčí se vypotácí ze svého pochmurného příbytku a ve světle dvorních ohnišť se objeví v potrhaném oděvu potřísněném čerstvou krví a se špinavými kleštěmi, z nichž odkapává krev. „[ROOT.Char.GetLadyLord], poslední dobou nad něčím přemýšlím. Jak daleko můžu zajít, když je chci přimět křičet?“"
 court.0106.a: "Cokoli, jen když z nich dostaneš přiznání."
 court.0106.b: "S těmi ubohými nešťastníky zacházej jemně."
 court.0106.c: "Co děláš na tom děsivém místě, je tvoje věc."
 court.0107.t: "[unruly_child.GetNameNoTooltip] v zoufalství"
 court.0107.desc: "Z trůnu slyším zoufalý křik [unruly_child.Custom2('MyCharacterIntroduction', ROOT.Char)] a zvuky zápasu. Okamžitě vyskočím a rozběhnu se chodbou, ale zarazím se, když spatřím [tutor.Custom2('MyCharacterIntroduction', ROOT.Char)], jak jednou rukou drží nebohou [Select_CString(unruly_child.IsFemale,'dívku','chlapce')] a v druhé nemotorně svírá knihu.\n\nSotva stihnu vyštěknout žádost o vysvětlení, oba začnou jeden přes druhého chrlit svou verzi událostí.\n\n„[unruly_child.GetTitledFirstNameNoTooltip] mi nedovolí, abych [Select_CString(unruly_child.IsFemale,'jí','mu')] předčítal[Select_CString(tutor.IsFemale,'a','')] své mistrovské dílo o umění [tutor.Custom('GetTutorEducation')]!“ vykřikne [Select_CString(tutor.IsFemale,'učitelka','učitel')].\n\n„Tu příšernou knihu už jsem slyšel[Select_CString(unruly_child.IsFemale,'a','')] tisíckrát!“ protestuje [unruly_child.GetNameNoTooltip]. „Je tak #EMP nudná!#!“"
 court.0107.a: "[unruly_child.GetNameNoTooltip], věř, že [tutor.GetNameNoTooltip] ví, co je pro tebe nejlepší."
 court.0107.a.tt.1: "Je šance, že se vzdělání [unruly_child.GetShortUINamePossessiveNoTooltip] zlepší"
 court.0107.a.tt.2: "[tutor.GetShortUINameNoTooltip] se bude jako [GetCourtPositionType('court_tutor_court_position').GetName()] snažit ještě víc"
 court.0107.b: "Ta kniha zní fascinujícím způsobem. Co kdybych ji od tebe koupil[Select_CString(ROOT.Char.IsFemale,'a','')]?"
 court_position_liege_support: "Podpora lenního pána"
 court.0107.b.tt: "Získáš knižní artefakt"
 court.0107.c: "Možná by se [Select_CString(unruly_child.IsFemale,'dívka','chlapec')] měl[Select_CString(unruly_child.IsFemale,'a','')] učit něco jiného..."
 buy_book_artifact: "Získáš knižní [Concept('court_artifact','dvorní artefakt')|E]"
 court.0108.t: "Pozoruhodná návštěva"
 court.0108.desc: "[foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetName] se u dvora [Select_CString(foreign_prince.IsFemale,'objevila','objevil')] s tvrzením, že [Select_CString(foreign_prince.IsFemale,'byla vypovězena','byl vypovězen')] z daleké země, v doprovodu celého zástupu exotických zvířat, a v ulicích [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] už [Select_CString(foreign_prince.IsFemale,'vykonala','vykonal')] neuvěřitelné dobročinné skutky.\n\n[Select_CString(foreign_prince.IsFemale,'Nesmírně bohatá cizinka oznámila','Nesmírně bohatý cizinec oznámil')], že [available_child.Custom2('MyCharacterIntroduction', ROOT.Char)] se má stát [Select_CString(foreign_prince.IsFemale,'její','jeho')] chotí!\n\nAčkoli dvůr touto exotickou návštěvou přímo žije a [foreign_prince.Custom('GetPrincessPrince')] budí všeobecné nadšení, ne všichni jsou přesvědčeni. [sceptical_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tvrdí, že o vzdálené zemi, odkud má cizinec pocházet, nikdy [Select_CString(sceptical_courtier.IsFemale,'neslyšela','neslyšel')] a nenachází ji ani na jediné mapě.\n\n[sceptical_courtier.GetNameNoTooltip] spolu s několika dalšími podobně smýšlejícími lidmi prohlašuje, že [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetName] je [Select_CString(foreign_prince.IsFemale,'šarlatánka','šarlatán')], a trvá na tom, že [foreign_prince.GetName] musí být [Select_CString(foreign_prince.IsFemale,'potrestána','potrestán')] za pokus oklamat [available_child.GetName] a přimět [Select_CString(available_child.IsFemale,'ji','ho')] ke sňatku s #EMP neurozenou osobou#!."
 court.0108.a: "Nekaž zábavu, [sceptical_courtier.GetNameNoTooltip]. Ráno bude svatba!"
 court.0108.b: "[sceptical_courtier.GetNameNoTooltip] má pravdu! [foreign_prince.GetNameNoTooltip] půjde do žaláře!"
 court.0108.c: "Děkuji za návštěvu, [foreign_prince.Custom('GetPrincessPrince')] [foreign_prince.GetFirstNameNoTooltip], ale [Select_CString(foreign_prince.IsFemale,'měla bys','měl bys')] odejít."
 court.0109.t: "[Select_CString(executioner.IsFemale,'Anatomická expertka','Anatomický expert')]"
 court.0109.desc: "Když se procházím po dvoře, zaslechnu, jak [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] a [learned_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] vedou rozhovor o léčitelství a medicíně. Je zřejmé, že se [executioner.GetName] pozoruhodně vyzná v lidském těle.\n\n„Když člověk tráví celé dny řezáním do lidí, něco se naučí o tom, jak funguje výtvor [executioner.GetFaith.HighGodNamePossessive],“ dodává [executioner.GetNameNoTooltip] poté, co vysvětlí, jak pomocí pijavic vyčistit nakaženou ránu od zkaženosti.\n\nZdá se, že znalosti lidské anatomie, které má [executioner.GetNameNoTooltip], slouží k pomoci místním obyvatelům — jejich domovem je [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — a dokonce i spodině v mém žaláři."
 court.0109.a: "Na popravčí řemeslo je tě škoda! Staň se [Select_CString(executioner.IsFemale,'mou lékařkou','mým lékařem')]!"
 court.0109.b: "Neplýtvej časem léčením téhle spodiny!"
 court.0109.c: "Fascinující. Možná bys mě [Select_CString(executioner.IsFemale,'mohla','mohl')] naučit některé ze svých metod."
 court.0109.d: "Dobrá práce! Pokračuj v péči o nemocné a potřebné. Jejich domovem je [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 court.0110.t: "Kázání o chlípnosti"
 court.0110.desc.intro: "Po další noci plné chtíče a vášně se spokojeně procházím po dvoře, když mě do kouta zaženou [parent.Custom2('MyCharacterIntroduction', ROOT.Char)] a [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)]! Jejich pohledy jsou směsicí znechucení, dravosti a obav.\n„Co to má znamenat?“ dožaduji se odpovědi.\n\n"
 court.0110.desc.deviant: "„Jsi [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.Char.Custom('GetDaughterSon')] a já mám o tvou duši velký strach. Každou noc se oddáváš zvrhlostem, při nichž by se znechuceně odvrátilo i božstvo [ROOT.Char.GetFaith.FertilityGodName].“"
 court.0110.desc.pox: "„Máš víc milenců než divoký pes blech. Obávám se, že až nasytíš svůj chtíč, milenecká nákaza nebude jedinou poskvrnou na tvém těle.“"
 court.0110.desc.notspecial: "„Tvé tělo je chrám, ale zacházíš s ním jako s nevěstincem! Najde se vůbec dost milenců, aby zaplnili tu díru, kde by měla být tvoje duše?“"
 court.0110.desc.outro: "[parent.GetMotherFather] mě bez špetky lítosti kárá.\n\n„Každou noc, kdy se oddáváš těmto pozemským rozkoším, je [ROOT.Char.GetFaith.NegativeAfterLife] o krok blíž!“ dodává [chaplain.GetNameNoTooltip]. „Proto jsme si tě teď vzali stranou, abychom zachránili tvou duši, drahé dítě. Musíš složit slib celibátu. Nic menšího tě před věčností muk nezachrání.“"
 court.0110.a: "Taková drzost! Do žaláře!"
 court.0110.b: "Máte pravdu. Bojím se o svou nesmrtelnou duši."
 court.0110.c: "Nenechám se spoutat smyslným vězením!"
 court.0111.t: "Relikvie pomsty"
 court.0111.desc: "Při procházce dvorem narazím na prudkou hádku. [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] a [antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)] se přou o [rival.Custom2('MyCharacterIntroduction', ROOT.Char)]: hodila by se lebka této osoby jako artefakt pro můj dvůr?\n\n„Á, [ROOT.Char.GetLadyLord], napadlo mě, že bych vám mohl dát darem jednu lebku. [rival.GetTitledFirstNameNoTooltip] by ji po případné předčasné smrti už [Select_CString(rival.IsFemale,'nepotřebovala','nepotřeboval')].“ [executioner.GetName] si s dětskou radostí mne krví potřísněné ruce. „Nebo bych z těch zubů mohl udělat stylový náhrdelník!“\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], snad po mně nechcete, abych se [Select_CString(antiquarian.IsFemale,'pokusila','pokusil')] tak morbidní předmět vydávat za relikvii hodnou dvora!“ protestuje [antiquarian.GetTitledFirstNameNoTooltip]. „Možná by tahle stvůra měla zůstat v žaláři, kam patří, a relikvie a starožitnosti přenechat odborníkům.“"
 court.0111.a: "Právě [rival.GetNameNoTooltip] by nám [Select_CString(rival.IsFemale,'mohla','mohl')] zanechat lebku, která by byla skvělou kuriozitou k odhalení na hostinách!"
 court.0111.b: "Naprosto groteskní nápad."
 get_skull_artifact: "Získáš lebku jako [Concept('court_artifact','dvorní artefakt')|E]"
 court.0112.t: "Mrtvola ve skříni"
 court.0112.desc: "Zanořím se hluboko do svého honosného šatníku, zvědavě pátrám po nádherných látkách ukrytých až vzadu. Narazím na tartanový vak, mnohem těžší než všechny ostatní, a když ho rozříznu, zápach hnijící mrtvoly mě přiměje zapotácet se dozadu.\n\nTělo neznámého člověka, částečně rozložené a mumifikované, sedí v kaluži vlastních tělních tekutin a pomalu se přede mnou odhaluje.\n\nVykřiknu jako malé dítě a jako by mé volání někoho přivolalo, ve dveřích se objeví [guilty_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)], ve tváři směs viny a odporu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], musíte mi věřit, když říkám, že jsem se jen [Select_CString(guilty_courtier.IsFemale,'bránila','bránil')]! [corpse.GetName] [Select_CString(corpse.IsFemale,'vnikla','vnikl')] do vašich komnat a kdybych [Select_CString(guilty_courtier.IsFemale,'nezasáhla','nezasáhl')], [corpse.GetName] by mě [Select_CString(corpse.IsFemale,'zabila','zabil')], nebo [guilty_courtier.GetFaith.HighGodName] ví, co ještě!“\n\n[guilty_courtier.GetNameNoTooltip] očividně propadá takovému žalu, že se okamžitě přizná, aniž by bylo třeba jakékoli konfrontace. „Prosím vás, přimhuřte oko a já vám nechám ušít oděv, který by [Select_CString(ROOT.Char.IsFemale,'záviděla','záviděl')] i [ROOT.Char.GetTitleAsNameNoTooltip] s největším bohatstvím!“"
 court.0112.a: "Zelený jako tahle mrtvola? Platí."
 court.0112.a.tt: "Získáš artefakt Regálie"
 court.0112.b: "Brzy se to rozkřikne tak, že [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] nebude mluvit o ničem jiném než o tom, co jsi [Select_CString(guilty_courtier.IsFemale,'udělala','udělal')]!"
 court.0112.c: "Už o tom nikdy nepromluvíme."
 get_regalia_artifact: "Získáš regálie jako [Concept('artifact','artefakt')|E]"