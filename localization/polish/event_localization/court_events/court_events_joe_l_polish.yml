l_polish:
 court.8001.t: "Rozdupáno"
 court.8001.desc.intro: "„Kolikrát jsem ti říkal[Select_CString(gardener.IsFemale,'Kolikrát jsem ti říkala','Kolikrát jsem ti říkal')], ať se držíš #EMP dál#! od #EMP čerstvě vysazených [ROOT.Char.GetCapitalLocation.Custom('get_region_flower_type_plural')]?!#!“\n\nObjeví se [child_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U], celé od okvětních lístků a hlíny, a v patách má mého zahradníka [gardener.GetTitledFirstName].\n\n[child_1.GetFirstNameNoTooltip] vykřikne:"
 court.8001.desc.diplomacy: "„Honili mě! Ve hře na babu jsem ještě #EMP nikdy#! neprohrál[Select_CString(child_1.IsFemale,'Ve hře na babu jsem ještě nikdy neprohrála!','Ve hře na babu jsem ještě nikdy neprohrál!')]“"
 court.8001.desc.martial: "„Jen jsem se schovával[Select_CString(child_1.IsFemale,'Jen jsem se schovávala před vojáky... museli jsme je přepadnout ze zálohy, abychom bitvu vyhráli!','Jen jsem se schovával před vojáky... museli jsme je přepadnout ze zálohy, abychom bitvu vyhráli!')]“"
 court.8001.desc.stewardship: "„To není moje vina! [gardener.GetNameNoTooltip] je vysadil přímo přes náš malý hrad!“"
 court.8001.desc.intrigue: "„Hráli jsme si na schovávanou a nikdo by mě nenašel, nebýt #EMP [gardener.GetNameNoTooltip]#!!“"
 court.8001.desc.learning: "„Jen jsem se díval[Select_CString(child_1.IsFemale,'Jen jsem se dívala! Tentokrát mají jinou barvu!','Jen jsem se díval! Tentokrát mají jinou barvu!')]“"
 court.8001.desc.fallback: "„Nic jsem neudělal[Select_CString(child_1.IsFemale,'Nic jsem neudělala! Jen jsem si hrála!','Nic jsem neudělal! Jen jsem si hrál!')]“"
 court.8001.desc.closing: "\n\n[gardener.GetFirstNameNoTooltip] se zamračí. „To zatracené děcko rozdupalo #EMP všechnu#! mou práci, [ROOT.Char.Custom('FormOfAddressForLiege')]! Napravit tu škodu potrvá #EMP týdny#!...“"
 court.8001.a.diplomacy: "Někdy se vyplatí nechat se chytit, [child_1.GetFirstNameNoTooltip]."
 court.8001.a.martial: "Ach, ale musíš si vybírat své bitvy, [child_1.GetFirstNameNoTooltip]!"
 court.8001.a.stewardship: "Znám lepší místo pro tvůj velkolepý dvůr, [child_1.GetFirstNameNoTooltip]."
 court.8001.a.intrigue: "Trik spočívá v tom nenechat se chytit, [child_1.GetFirstNameNoTooltip]."
 court.8001.a.learning: "Učit se můžeš i z dálky, [child_1.GetFirstNameNoTooltip]."
 court.8001.a.lesson_tt: "[child_1.GetFirstNameNoTooltip] pochopí tvou radu"
 court.8001.b.gardener: "Ne! #EMP Jen ne#! květinové záhony..."
 court.8001.b.poet: "Křehká krása, navždy drcená nešikovnými hlupáky..."
 court.8001.c: "[child_1.GetFirstNameNoTooltip] je pomůže znovu vysadit. Úplně všechny."
 court.8001.c.gardener_tt: "[child_1.GetFirstNameNoTooltip] má talent pro zahradničení"
 court.8001.d: "Jak se #EMP opovažuješ#! takhle zacházet s [child_1.GetFirstNameNoTooltip]?!"
 court.8001.e: "Děti si mohou hrát, kde chtějí, [gardener.GetFirstNameNoTooltip]."
 court.8001.a.success: "Předáš trochu moudrosti"
 court.8001.a.failure: "Tvá rada příliš nepomůže"
 court.8010.t: "Bídná výzbroj"
 court.8010.desc.intro: "Užívám si vzácnou chvíli klidu mezi zasedáními rady, když si mě [underequipped.GetTitledFirstName] odvede stranou. \n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]...“ začne [underequipped.GetFirstNameNoTooltip] opatrně,"
 court.8010.desc.champion: "„[Select_CString(underequipped.IsFemale,'jako vaše šampionka vás hrdě zastupuji','jako váš šampion vás hrdě zastupuji')],"
 court.8010.desc.bodyguard: "„[Select_CString(underequipped.IsFemale,'jako vaše osobní strážkyně mám tu čest vás chránit','jako váš osobní strážce mám tu čest vás chránit')],"
 court.8010.desc.knight: "„Jako [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] mám svatou povinnost bojovat vaše bitvy,"
 court.8010.desc.bold: "ale tohle je směšné!“ \n\n[underequipped.GetFirstNameNoTooltip] povytáhne čepel z pochvy a odhalí množství záseků a důlků. „Nemůžete čekat, že budu svou práci dělat s tímhle neohrabaným kusem železa!“"
 court.8010.desc.meek: "ale...“ \n\n[underequipped.GetFirstNameNoTooltip] na okamžik zaváhá a pak pochvou bezmocně a podrážděně mávne. „Jak mám s touhle starou věcí dělat svou práci?“"
 court.8010.desc.body: "\n\n„Kvalita je přece vším, když jde o "
 court.8010.desc.champion_end: "jednání vaším jménem!“"
 court.8010.desc.bodyguard_end: "ochranu vašeho života!“"
 court.8010.a: "[Select_CString(underequipped.IsFemale,'Mé nejlepší ženy potřebují kvalitní zbraně!','Moji nejlepší muži potřebují kvalitní zbraně!')]"
 court.8010.a.tt: "Pro [underequipped.GetTitledFirstName] bude vykována kvalitní zbraň podle vlastního výběru"
 court.8010.a.equipped_tt: "[underequipped.GetTitledFirstName] dostane kvalitní zbraň"
 court.8010.c: "Asi bych mohl[Select_CString(ROOT.Char.IsFemale,'Asi bych mohla postrádat jednu ze svých vlastních zbraní...','Asi bych mohl postrádat jednu ze svých vlastních zbraní...')]"
 court.8010.c.equipped_tt: "[underequipped.GetTitledFirstNameNoTooltip] dostane darem zbraň"
 court.8010.d: "Běž do zbrojnice — jako všichni ostatní."
 court.8010.d.tt: "[underequipped.GetTitledFirstNameNoTooltip] si vyzvedne ve zbrojnici nekvalitní meč"
 court.8010.d.equipped_tt: "[underequipped.GetTitledFirstName] dostane meč ze zbrojnice"
 court.8010.e: "Zmiz mi z očí, ty drzý[Select_CString(underequipped.IsFemale,'Zmiz mi z očí, ty drzá','Zmiz mi z očí, ty drzý')] [underequipped.Custom2('InsultNoun', ROOT.Char)]!"
 court.8020.t: "Módní urážka"
 court.8020.desc: "Uprostřed dalšího rušného dne u dvora zaslechnu charakteristický podrážděný tón [Select_CString(couture_spouse.IsFemale,'své manželky','svého manžela')] [couture_spouse.GetTitledFirstName]. [couture_guest.GetTitledFirstName] zjevně dokázal[Select_CString(couture_guest.IsFemale,'zjevně dokázala','zjevně dokázal')] [couture_spouse.GetFirstNameNoTooltip] pořádně vytočit. \n\nKdyž přistoupím blíž, [couture_guest.GetFirstNameNoTooltip] se samolibě posmívá: „Tyhle údajné #EMP módní výstřelky#! jsou ostuda. U každého slušného dvora [couture_guest.GetCulture.GetNameNoTooltip] kultury by se hodily nanejvýš pro služebnictvo a děti.“\n\n[couture_spouse.GetFirstNameNoTooltip] zrudne a vyhrkne: „Už tě mám #EMP právě#! dost — je mi jedno, že jsi hostem našeho dvora!“ [couture_guest.GetFirstNameNoTooltip] to očividně zaskočí. \n\n[couture_spouse.GetFirstNameNoTooltip] si mě odvede stranou a hořce si postěžuje: „Ten nevděčný [couture_guest.Custom2('InsultNoun', SCOPE.sC('couture_spouse'))] se nám neustále posmívá. Včera mé služebnictvo zaslechlo, jak naše módní trendy označuje za #EMP passé!#!“"
 court.8020.a: "Ale no tak, [Select_CString(couture_spouse.IsFemale,'drahá','drahý')], jen si z nás utahuje."
 court.8020.b: "Asi je to skutečně dobrá příležitost k investici..."
 court.8020.d: "Passé? #EMP PASSÉ?!#!"
 poor_host_modifier: "Nevyhovující hostitel"
 poor_host_modifier_desc: "Tato postava porušila nepsaná pravidla pohostinnosti."
 hunting_pooches_modifier: "Prvotřídní ohaři"
 hunting_pooches_modifier_desc: "Dvůr této postavy se pyšní obzvláště působivými loveckými psy."
 court.8030.t: "Náruč plná štěňat"
 court.8030.desc.intro: "Když do místnosti vstoupí můj lovčí [huntmaster.GetTitledFirstName], okamžitě se na něj sesype houf rozplývajících se dvořanů. \n\nKdyž se [huntmaster.GetTitledFirstNameNoTooltip] konečně probojuje skrz, důvod všeho toho pozdvižení je zřejmý: v náručí svírá deku plnou svíjejících se štěňat, podle vzhledu nejspíš [ROOT.Char.Custom('get_region_dog_type')] — a opravdu nádherných! \n\nMůj $master_of_hunt_court_position$ se široce usměje: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], tenhle vrh jsem vám zkrátka musel[Select_CString(huntmaster.IsFemale,'tenhle vrh jsem vám zkrátka musela ukázat','tenhle vrh jsem vám zkrátka musel ukázat')]. Až tihle pejsci vyrostou a projdou výcvikem, troufám si říct, že nám je bude závidět každá [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] lovecká výprava!“ \n\n"
 court.8030.desc.one: "Nemohu si nevšimnout, jak se [child_1.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_1'))] [child_1.GetFirstNameNoTooltip] natahuje, aby na drobné pejsky pořádně viděl."
 court.8030.desc.two: "Koutkem oka zahlédnu dvě ze svých dětí, [child_1.GetFirstName] a [child_2.GetFirstName], které štěňata očividně uchvátila — a především to největší z celého vrhu."
 court.8030.desc.body: "\n\n[huntmaster.GetTitledFirstNameNoTooltip] vezme největší štěně do náruče a zamyšleně pronese: „Z tohohle možná vyroste nejlepší pes své generace!“"
 court.8030.a: "Nemohu se dočkat, až se předvedou!"
 court.8030.b: "To největší připadne [child_1.GetFirstNameNoTooltip]!"
 court.8030.c: "Takového fešáka si zaslouží jedině [child_2.GetFirstNameNoTooltip]."
 court.8030.d: "Ach, právě na tak nádherné štěně jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]!"
 court.8040.t: "Šlechtické choutky"
 court.8040.desc.intro: "Tři z mých dvořanů se v mém doslechu až nápadně baví o mém „velkém množství“ titulů a hlasitě bědují nad tím, jak vyčerpávající musí být pro [ROOT.Char.GetTitleAsNameNoTooltip] spravovat tolik držav bez cizí pomoci... \n\nJsou spolu jedna ruka:"
 court.8040.desc.position_holder: "věrný [position_holder.GetName] — služebník dvora;"
 court.8040.desc.knight: "udatný [knight.GetName] — můj znamenitý [ROOT.Char.Custom('MountedWarriorTerm')|U];"
 court.8040.desc.relative: "[relative.GetName] — člen mého rodu přesvědčený o vlastním nároku;"
 court.8040.desc.ambitious: "moci chtivý [ambitious.GetName] — stále číhá na příležitost;"
 court.8040.desc.arrogant: "povýšený [arrogant.GetName] — s nosem věčně nahoru;"
 court.8040.desc.lowborn: "[lowborn.GetName] — vlastními silami vzhůru a připravený využít každou příležitost;"
 court.8040.desc.gentry: "zpupný [gentry.GetName] — privilegovaný příslušník rodu [gentry.GetHouse.GetName];"
 court.8040.desc.generic_1: "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_1'))] [generic_1.GetName] — prostě rád, že může být u toho;"
 court.8040.desc.generic_2: "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_2'))] [generic_2.GetName] — alespoň tak mu říkají stráže;"
 court.8040.desc.generic_3: "[ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('generic_3'))] [generic_3.GetName] — dokonale zapomenutelný přisluhovač;"
 court.8040.desc.body: "a do očí bijící nedostatek byť jen špetky pokory. \n\nPřes všechen hluk dvořanů jasně rozeznám slova „[worst_title.GetTierAsNameNoTooltip]“ a „[worst_title.GetNameNoTier]“ — a ten podlézavý tón, to musí býť [button.GetFirstNameNoTooltip]. \n\nNestydatá trojice se otočí mým směrem a setká se s mým vražedným pohledem."
 court.8040.a: "Ano, ano, [courtier_1.GetTitledFirstNameNoTooltip]... [worst_title.GetNameNoTierNoTooltip] je tvoje."
 court.8040.b: "Tahle hra může skončit: [worst_title.GetNameNoTierNoTooltip] připadne [courtier_2.GetFirstNameNoTooltip]!"
 court.8040.c: "Ty tam! [courtier_3.GetTitledFirstNameNoTooltip]? Titul je tvůj!"
 court.8040.d: "Vím, o co vám jde! Je načase prokázat svou cenu!"
 court.8040.d.flavor_tt: "„Nejsilnějšímu“"
 court.8040.d.courtier_1_tt: "[courtier_1.GetFirstNameNoTooltip] po titulu touží nejvíc"
 court.8040.d.courtier_2_tt: "[courtier_2.GetFirstNameNoTooltip] zůstane jako poslední na nohou"
 court.8040.d.courtier_3_tt: "[courtier_3.GetFirstNameNoTooltip] zvítězí"
 court.8040.grant_tt: "[new_noble.GetTitledFirstNameNoTooltip] získá [worst_title.GetNameNoTierNoTooltip]"
 court.8040.e: "Každý z vás mi povězte, proč si titul zasloužíte."
 court.8040.e.courtier_1_tt: "[courtier_1.GetFirstNameNoTooltip] je nejpřesvědčivější"
 court.8040.e.courtier_2_tt: "[courtier_2.GetFirstNameNoTooltip] zapůsobí svou výřečností"
 court.8040.e.courtier_3_tt: "[courtier_3.GetFirstNameNoTooltip] mluví dobře"
 joining_faction_block_tt: "[new_noble.GetFirstNameNoTooltip] přísahá, že se 20 let nepřipojí k žádné frakci"
 court.8040.f: "Na co zíráte?"
 court.8050.t: "Ptáček zazpíval"
 court.8050.desc: "Zpočátku jsem si myslel[Select_CString(ROOT.Char.IsFemale,'Zpočátku jsem si myslela, že jde jen o podivné návyky, ale teď je zřejmé, že se mi jeden z mnoha služebníků u dvora pokouší tajně dávat znamení.','Zpočátku jsem si myslel, že jde jen o podivné návyky, ale teď je zřejmé, že se mi jeden z mnoha služebníků u dvora pokouší tajně dávat znamení.')]\n\nV klidné chvíli k [servant.GetNameNoTooltip] přistoupím se strážemi a [servant.GetNameNoTooltip] spiklenecky zašeptá: „Velký [ROOT.Char.GetTitleAsNameNoTooltip], jmenuji se [servant.GetFirstName]. Když obsluhujeme vaše hosty, vyslechneme toho hodně. Sotva si vůbec všimnou, že jsme přítomni...“ \n\nPochybovačně se na [servant.GetNameNoTooltip] zadívám a přemýšlím, zda opravdu chci slyšet, co přijde dál. [servant.GetNameNoTooltip] můj pohled opětuje a očividně si není jist[Select_CString(servant.IsFemale,'očividně si není jistá, zda nedělá chybu','očividně si není jistý, zda nedělá chybu')]. \n\nNakonec [servant.GetNameNoTooltip] polkne. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], jde o [vassal.GetTitledFirstName], [servant.Custom2('DescriptorNegative', SCOPE.sC('vassal'))] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))]. Za zavřenými dveřmi vašeho [ROOT.Char.Custom('FortifiedBuilding')] [vassal_secret.Custom('SecretDescriptionThirdPerson')] — přísahám při [servant.GetFaith.HighGodName], že mluvím pravdu!“"
 court.8050.a: "Děkuji za tvé služby."
 court.8050.a.tt: "[servant.GetFirstNameNoTooltip] se připojí k tvému [Concept('court','dvoru')|E]"
 court.8050.b: "Co dalšího jsi slyšel[Select_CString(servant.IsFemale,'Co dalšího jsi slyšela?','Co dalšího jsi slyšel?')]"
 court.8050.b.tt: "Dozvíš se tajemství někoho dalšího u dvora"
 court.8050.b.tt_secret: "Tajemství postavy [vassal_2.GetTitledFirstName]"
 court.8050.c: "Vezmi si tohle — odteď podáváš hlášení jen mně."
 court.8050.c.tt: "Tvůj [Concept('spymaster','špehmistr')|E] bude po dobu působení tohoto modifikátoru s větší pravděpodobností mařit schémata"
 court.8050.d: "Zatkněte toho slídícího ničemu!"
 court.8050.d.tt_imprison: "[servant.GetFirstNameNoTooltip] skončí v žaláři"
 servant_informants_modifier: "Informátoři mezi služebnictvem"
 servant_informants_modifier_desc: "Síť špehujícího služebnictva donáší klepy od dvora této postavy."
 court.8060.t: "Uštěpační patolízalové"
 court.8060.desc.intro: "Na okamžik se zastavím na prahu chodby a kochám se slunečním svitem, když zaslechnu posměšný smích zpoza rohu. \n\n„#EMP Já vím!#!“ slyším pochechtávat se [snooty_1.GetFirstName], [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('snooty_1'))] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snooty_1'))],"
 court.8060.desc.fashion: "„Když se tu procházím, přísahám, že mám někdy pocit, jako by [ROOT.Char.GetTitleAsNameNoTooltip] převzal módu z dvora, kde vládl [snooty_1.GetMotherFather] — všechno je tak omšelé a staromódní!“ \n\n"
 court.8060.desc.servants_1: "„Na sluhu čekáš #EMP celý den#!, a pak se objeví hned dva — a ani jeden nepřinese, cos chtěl!“ \n\n"
 court.8060.desc.food_1: "„#EMP Viděl jsi#!, jak vypadala včerejší hostina? Raději bych žvýkal jídelní podložku z chleba než jedl ty splašky!“ \n\n"
 court.8060.desc.body: "Do hovoru se vloží další hihňavý hlas: „Proboha, já myslel[Select_CString(snooty_2.IsFemale,'Proboha, já myslela, že jsem si toho všimla jen já! A to ani nemluvím o ','Proboha, já myslel, že jsem si toho všiml jen já! A to ani nemluvím o ')]"
 court.8060.desc.lodgings: "tom, jak #EMP velké#! máme komnaty! Sotva se tam vejde slamník pro sluhu!“"
 court.8060.desc.food_2: "tom, jak příšerně se tu vaří — a ty #EMP směšně malé#! porce!“"
 court.8060.desc.servants_2: "služebnictvu — už jsem vzdal[Select_CString(snooty_2.IsFemale,'už jsem vzdala snahu po nich cokoli chtít: buď vůbec netuší, co po nich člověk žádá, nebo už se nikdy nevrátí!','už jsem vzdal snahu po nich cokoli chtít: buď vůbec netuší, co po nich člověk žádá, nebo už se nikdy nevrátí!')]"
 court.8060.desc.outro: "\n\nTo se teď [snooty_2.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snooty_2'))], snaží potlačit výbuch smíchu? Ta drzost..."
 court.8060.a.fashion: "Zavedu nový standard oblékání jen kvůli tobě, [snooty_1.GetFirstNameNoTooltip]."
 court.8060.a.servants: "Možná bys mohl[Select_CString(snooty_1.IsFemale,'Možná bys mohla doporučit nějaké schopné služebnictvo,','Možná bys mohl doporučit nějaké schopné služebnictvo,')] [snooty_1.GetFirstNameNoTooltip]?"
 court.8060.a.food: "[snooty_1.GetFirstNameNoTooltip], na zítřek chystám něco speciálního k jídlu."
 court.8060.b.food: "Brzy nastoupí nový kuchař, [snooty_2.GetFirstNameNoTooltip]."
 court.8060.b.lodgings: "Ještě dnes večer se přestěhuji do větších komnat, [snooty_2.GetFirstNameNoTooltip]."
 court.8060.b.servants: "Asi by se nám pár dalších pomocných rukou hodilo."
 court.8060.c: "Z cesty, vy nevděční příživníci..."
 court.8060.d: "Když se vám tu nelíbí, najděte si někoho jiného, na kom budete parazitovat!"
 court.8060.e: "Světská rozptýlení nás jen vzdalují od [ROOT.Char.GetFaith.PositiveAfterLife]."
 court.8060.e.pious_tt: "Každý vazal nebo dvořan asketické víry, který není cynický"
 court.8060.f: "Krásný den, že?"
 court.8060.f.flavor: "Zdání se musí zachovat"
 court.8070.t: "Pocit užitečnosti"
 court.8070.desc: "[parent.GetTitledFirstName], [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('parent'))] [parent.GetMotherFather], se každý den bezcílně potlouká po dvoře. Je zjevné, jak moc touží po nějakém smysluplném poslání, na které nemám čas. \n\nDnes mě konečně zažene do kouta: „Á, tady jsi, [ROOT.Char.GetFirstNameNoTooltip]! Pro mě pořád zůstáváš moje malé [ROOT.Char.Custom('GirlBoy')], víš? Dovol mi sejmout ti trochu toho břemene z ramen — stále tě mohu tolik naučit.“ \n\nMůj doprovod se ze všech sil snaží najít něco jiného, na co by se mohl dívat, což mé rozpaky jen zhoršuje. \n\n„[ROOT.Char.Custom('GetDaughterSon')|U], copak se děje? Copak už nemáš rád[Select_CString(ROOT.Char.IsFemale,'Copak už nemáš ráda svého starého','Copak už nemáš rád svého starého')] [parent.Custom('GetMaPa')]? Po tom všem, co jsem pro tebe udělal[Select_CString(parent.IsFemale,'Po tom všem, co jsem pro tebe udělala?','Po tom všem, co jsem pro tebe udělal?')]“"
 court.8070.a: "Něco ti na práci najdu, [parent.Custom('GetMamaPapa')]."
 court.8070.a.tt: "[parent.GetFirstNameNoTooltip] bude v příštích několika měsících očekávat [Concept('court_position','dvorní funkci')|E]"
 court.8070.b: "Nenapadlo tě zasvětit svůj život [ROOT.Char.GetFaith.HighGodName]?"
 court.8070.c: "Prostě si vezmi jakoukoli práci..."
 court.8070.d: "Mám #EMP opravdu#! hodně práce, [parent.GetMotherFather]."
 court.8071.satisfied: "[parent.GetMotherFather|U] si svou roli oblíbí"
 court.8071.disappoint: "[parent.GetMotherFather|U] už nebaví čekat"
 promised_court_position_modifier: "Slíbená funkce"
 promised_court_position_modifier_desc: "Této postavě byla přislíbena dvorní funkce v blízké budoucnosti a vypráví o tom každému, kdo je ochoten naslouchat."
 court.8080.t: "[parent.Custom('GetMaternalPaternal')|U] výčitky"
 court.8080.desc.intro: "Můj [parent.GetMotherFather] [parent.GetTitledFirstName] je den ode dne podrážděnější. \n\nSedím na trůnu a přemítám nad možnými příčinami, když ke mně [parent.GetTitledFirstNameNoTooltip] rázně vyrazí, přesně jako za mého dětství při každém mém prohřešku.\n\n„[ROOT.Char.GetFirstNameNoTooltip], moje [ROOT.Char.Custom('GetDaughterSon')]! Musíš něco udělat s "
 court.8080.desc.fashion: "těmi žalostnými hadry, kterým říkáš oblečení!"
 court.8080.desc.servants: "svým neschopným a přetíženým služebnictvem!"
 court.8080.desc.lodgings: "tím nuzným ubytováním, které nabízíš hostům!"
 court.8080.desc.food: "těmi příšernostmi, které servíruješ na hostinách!"
 court.8080.desc.outro: "Copak ti nezáleží na tom, co si o tobě lidé myslí?!“\n\n„Takhle se přece [ROOT.Char.GetTitleAsNameNoTooltip] nemůže ukazovat lidem! Tímhle tempem se ti bude smát celé [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] — ba ne — všichni [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!“"
 court.8080.a: "Ano, [parent.Custom('GetMamaPapa')], napravím to..."
 court.8080.b: "Aha, takže si myslíš, že jsi lepší než mí dvořané?"
 court.8080.b.tt: "Každý [Concept('courtier','dvořan')|E]"
 court.8080.c.nun: "Možná by ti víc vyhovoval hábit, jaký nosí [ROOT.Char.GetFaith.DevoteeFemale]?"
 court.8080.c.monk: "Možná by ti víc vyhovoval hábit, jaký nosí [ROOT.Char.GetFaith.DevoteeMale]?"
 court.8080.c.fallback: "Nenapadlo tě zasvětit se [ROOT.Char.GetFaith.HighGodName]?"
 court.8080.d.fashion: "Myslím, že #EMP ty#! bys nám měl[Select_CString(parent.IsFemale,'Myslím, že #EMP ty#! bys nám měla ušít něco nového.','Myslím, že #EMP ty#! bys nám měl ušít něco nového.')]"
 court.8080.d.servants: "Tak proč služebnictvu nepomůžeš?"
 court.8080.d.lodgings: "Možná bys mohl[Select_CString(parent.IsFemale,'Možná bys mohla přenechat svůj pokoj někomu jinému?','Možná bys mohl přenechat svůj pokoj někomu jinému?')]"
 court.8080.d.food: "Dobrá, tak se běž najíst někam jinam..."
 court.8080.e: "Takhle se mnou už mluvit nebudeš!"
 court_8080_degraded_modifier: "Ponížení"
 court_8080_degraded_modifier_desc: "Tuto postavu veřejně ponížilo její dítě a zároveň lenní pán za to, že si stěžovala."
 court.8090.t: "Stavební kameny"
 court.8090.desc.intro: "[architect.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))], bere své povinnosti $royal_architect_court_position$ rozhodně vážně."
 court.8090.desc.intro_alt: "Dvůr navštívil známý architekt z [my_county.GetNameNoTier], [architect.GetTitledFirstName]."
 court.8090.desc.intro_end: "Vášnivá debata mezi [architect.GetTitledFirstName] a mým [steward.GetHeldCourtAndCouncilPositionsString] [steward.GetTitledFirstName] ovládne celou místnost. \n\n„Ano, přesně!“ zvolá [architect.GetFirstNameNoTooltip]. „Tamní ruiny jsou plné opracovaného kamene, který by se dal snadno převézt do "
 court.8090.desc.religious: "[ROOT.Char.GetFaith.HouseOfWorship] v [temple_barony.GetNameNoTier]!“"
 court.8090.desc.castle: "[ROOT.Char.Custom('FortifiedBuilding')] v [my_barony.GetNameNoTier]!“"
 court.8090.desc.outro: "\n\n[steward.GetFirstNameNoTooltip] se pochybovačně zamyslí. „Přesto to zní jako spousta práce a místním, kteří ten materiál využívají, se to líbit nebude.“ \n\n[architect.GetFirstNameNoTooltip] nad touto rozumnou námitkou protočí oči,"
 court.8090.desc.chaplain: "ale můj [chaplain.GetHeldCourtAndCouncilPositionsString] jej přeruší: „Nedaleký [ROOT.Char.GetFaith.HouseOfWorship] v [temple_barony.GetNameNoTier] zoufale potřebuje rozšířit,“ vypískne [chaplain.GetTitledFirstName]. „Tam by měla ta suť skončit!“"
 court.8090.desc.fallback: "a ušklíbne se: „Dokážeme ten kámen využít mnohem lépe než nějací prostí lidé, to přece víš!“"
 court.8090.a: "[my_barony.GetNameNoTierNoTooltip] by #EMP nějaké#! úpravy prospěly..."
 court.8090.b: "Půjde do domu [ROOT.Char.GetFaith.HighGodNamePossessive] v [temple_barony.GetNameNoTierNoTooltip]."
 court.8090.c: "Architekt tvého věhlasu dokáže něco lepšího, [architect.GetFirstNameNoTooltip]!"
 court.8090.c.tt: "Tato možnost je dostupná, protože [architect.GetFirstNameNoTooltip] je tvůj $royal_architect_court_position$"
 court.8090.d: "Nechte ty omšelé kvádry prostému lidu."
 court_8090_commoners_modifier: "Ruiny pro prostý lid"
 court_8090_commoners_modifier_desc: "Prostý lid v tomto hrabství získává stavební materiál rozebíráním starých ruin."
 court.8100.t: "Pochybný lektvar"
 court.8100.desc: "Cestou mezi audiencemi zaslechnu svého [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('physician'))] $court_physician_court_position$ [physician.GetTitledFirstName], jak hovoří o svém nejnovějším výstřelku. \n\n„...údajně je to nejsilnější lektvar, jaký existuje, a pochází až z nejvzdálenějších koutů světa — alespoň to tvrdí obchodníci a alchymisté, s nimiž jsem mluvil[Select_CString(physician.IsFemale,'alespoň to tvrdí obchodníci a alchymisté, s nimiž jsem mluvila','alespoň to tvrdí obchodníci a alchymisté, s nimiž jsem mluvil')].“ \n\n[physician.GetFirstNameNoTooltip] vytáhne lahvičku bledě žluté tekutiny a zakrouží s ní pod nakrčenými nosy mých dvořanů. \n\n„Říká se, že dodává sílu a prodlužuje život. Oblíbili si jej ti, kdo vyrážejí do bitvy, ale jeho moc zvládnou jen ti nejsilnější.“"
 court.8100.a: "Nejsilnější lektvar, říkáš? Dej ho sem."
 court.8100.b: "Vážně? Ať ho nejdřív ochutná můj $food_taster_court_position$."
 court.8100.b.tt_forgiving: "[food_taster.GetTitledFirstName] nemá $trait_forgiving$:"
 court.8100.c: "Sílu nám může dát jedině [ROOT.Char.GetFaith.HighGodName]."
 court.8100.d: "Ty splašky nejsou ani pro zvíře, natož pro člověka!"
 court.8100.tt.handle_potion: "Nejsilnější lektvar zvládneš"
 court.8100.tt.need_weaker: "Měl[Select_CString(ROOT.Char.IsFemale,'Měla sis najít slabší lektvar','Měl sis najít slabší lektvar')]"
 court.8100.tt.too_strong: "Lektvar je na tebe příliš silný"
 strong_potion_modifier: "Silný lektvar"
 strong_potion_modifier_desc: "Tato postava dokázala zvládnout i ty nejsilnější lektvary."
 feeling_unwell_modifier: "Nevolnost"
 feeling_unwell_modifier_desc: "Tato postava si měla najít nějaký slabší lektvar."
 court.8110.t: "Na špalku"
 court.8110.desc.intro: "Můj [my_executioner.Custom('quirk_neg_adjective')] $executioner_court_position$ [my_executioner.GetTitledFirstName] se potlouká po paláci [my_executioner.Custom('quirk_neg_pp')] a dává své rozmrzelosti najevo s veškerou nenápadností trucujícího dítěte.\n\nNakonec už tohle žalostné divadlo u svého dvora nevydržím a vyštěknu: „Co se #EMP děje#!?!“\n\n[my_executioner.GetFirstNameNoTooltip] sebou překvapeně trhne, ale rychle odpoví: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], odpusťte mi, jen už několik týdnů nebyla příležitost k pořádnému zabití...“ \n\n„Vždyť ten "
 court.8110.desc.leader_1: "odporný buřič [prisoner_1.GetTitledFirstName]"
 court.8110.desc.heretic: "nestoudný kacíř [prisoner_1.GetTitledFirstName]"
 court.8110.desc.heathen: "odporný pohan [prisoner_1.GetTitledFirstName]"
 court.8110.desc.infidel: "bezbožný nevěřící [prisoner_1.GetTitledFirstName]"
 court.8110.desc.noble: "zavrženíhodný ničema [prisoner_1.GetTitledFirstName]"
 court.8110.desc.fallback: "nenáviděný [prisoner_1.Custom('GetCrime')] [prisoner_1.GetTitledFirstName]"
 court.8110.desc.body: "tam jen #EMP hnije#! a čeká, až oznámíte datum popravy."
 court.8110.desc.religious: "[ROOT.Char.GetFaith.DeathDeityName] je přece jedno, kdy ta bezbožná duše dorazí do [ROOT.Char.GetFaith.NegativeAfterLife]...“"
 court.8110.desc.leader_2: "Dokud [prisoner_1.GetFirstNameNoTooltip] žije, může být symbolem pro další odpadlíky...“"
 court.8110.desc.criminal: "Dovolte mi ukončit trápení toho [prisoner_1.Custom('GetCrimeDesc')]...“"
 court.8110.a: "Dobrá, nadešel čas [prisoner_1.GetTitledFirstNameNoTooltip]."
 court.8110.b: "Ne, příště přijde na řadu [prisoner_2.GetTitledFirstNameNoTooltip]."
 court.8110.c: "Ano, a #EMP ty#! jsi [my_executioner.Custom('GetCrime')]!"
 court.8110.c.flavor: "Můj $executioner_court_position$ by měl znát své místo"
 court.8110.d: "Tohle si užíváš až příliš, [my_executioner.GetFirstNameNoTooltip]."
 court.8110.e: "Není kam spěchat."
 court.8120.t: "Nové pohledy"
 court.8120.desc.intro: "Tiše sedím a naslouchám zanícené teologické debatě mezi [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('accuser') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('accuser'))] [accuser.GetTitledFirstName] a [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('refuter'))] [refuter.GetTitledFirstName]. \n\n[refuter.GetTitledFirstNameNoTooltip] [refuter.Custom('quirk_pos_adverb')] naléhá:"
 court.8120.desc.same_religion: "„...ale [refuter.GetFaith.GetNameNoTooltip] #EMP má#! blíže k pravému slovu [refuter.GetFaith.HighGodName]. Je nejčistší podobou zjevení označovaných jako [refuter.GetFaith.GetReligion.GetAdjectiveNoTooltip].“\n\n[accuser.GetTitledFirstNameNoTooltip] se [accuser.Custom('quirk_neg_pp')] ušklíbne. „Přečti si [accuser.GetFaith.ReligiousText] a uvidíš, že "
 court.8120.desc.other_religion: "„...ale zaostalé učení [accuser.GetFaith.GetReligion.GetAdjectiveNoTooltip] se přece nemůže vážně srovnávat s učením našeho [refuter.GetFaith.GetReligion.GetNameNoTooltip]. Pravda [accuser.GetFaith.HighGodNamePossessive] je pouhým pokřivením pravdy [refuter.GetFaith.HighGodNamePossessive].“\n\n[accuser.GetTitledFirstNameNoTooltip] se [accuser.Custom('quirk_neg_pp')] ušklíbne. „Důkladně se nad tím zamysli a uvidíš, že "
 court.8120.desc.marriage: "posvátný svazek manželský má být sdílen pouze s jedinou další osobou. Právě tak se přibližujeme k [accuser.GetFaith.PositiveAfterLife].“"
 court.8120.desc.divorce: "rozvod je pro ty, kdo se nedokážou bezvýhradně oddat druhému člověku a usilovat o čistotu a [accuser.GetFaith.PositiveAfterLife]. \n\n"
 court.8120.desc.adultery: "[accuser.GetFaith.CreatorName] nás nestvořil proto, abychom smilnili mimo manželství a honili se za svými vášněmi. #EMP Právě proto#! máme manželská pouta!"
 court.8120.desc.witchcraft: "bezbožné rituály čarodějnic jsou v přímém rozporu s cestou k [accuser.GetFaith.PositiveAfterLife].“"
 court.8120.desc.equality: "[accuser.GetFaith.CreatorName] na počátku věků stvořil muže i ženy společně, aniž by jedni byli podřízeni druhým.“"
 court.8120.desc.cosanguity: "[accuser.GetFaith.CreatorName] nezamýšlel, aby se členové jedné rodiny mezi sebou brali a plodili děti. Je to pokušení odporující přírodě!“"
 court.8120.desc.outro: "\n\n„Proto se s těmi, kdo zbloudili, nebavím...“ [refuter.GetTitledFirstNameNoTooltip] frustrovaně povzdechne. „Když odmítáš naslouchat pravdě, mohu jen doufat, že budeš nějakým způsobem ušetřen[Select_CString(accuser.IsFemale,'Když odmítáš naslouchat pravdě, mohu jen doufat, že budeš nějakým způsobem ušetřena pekelného','Když odmítáš naslouchat pravdě, mohu jen doufat, že budeš nějakým způsobem ušetřen pekelného')] [accuser.GetFaith.NegativeAfterLife].“"
 court.8120.a.accuser: "[accuser.GetFirstNameNoTooltip] má ale pravdu, [refuter.GetFirstNameNoTooltip]."
 court.8120.a.refuter: "[refuter.GetFirstNameNoTooltip] má ale pravdu, [accuser.GetFirstNameNoTooltip]."
 court.8120.c: "Přátelé, Stvořitele lze uctívat mnoha způsoby."
 court.8120.d: "Podívejte! Tohle jsou [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] pravdy!"
 court.8120.d.tt: "Každý horlivý [THIS.Char.GetFaith.GetAdjectiveNoTooltip] [Concept('vassal','vazal')|E], [Concept('courtier','dvořan')|E] a [Concept('guest','host')|E]"
 court.8120.e: "Takové řeči už nechci slyšet, [accuser.GetFirstNameNoTooltip]."
 court.8120.f: "Nám nepřísluší přít se o božské záležitosti."
 my_holy_book: "[ROOT.Char.GetTitledFirstNameNoTooltip] — [ROOT.Char.GetFaith.ReligiousText|U]"
 my_holy_book_description: "Osobní svázaná sbírka [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] učení, která patří [ROOT.Char.GetTitledFirstNameNoTooltip] a je zdobena zlatým symbolem [ROOT.Char.GetFaith.ReligiousSymbol]."
 court.8130.t: "Vykonstruovaný spor"
 court.8130.desc.intro: "Sedím na trůnu a přemítám o všem možném, když náhle propukne poprask. \n\n[champion.GetFirstName], můj $champion_court_position$, zařve [vassal.GetTitledFirstName] přímo do tváře: „Moc dobře vím, jak jsi to myslel[Select_CString(vassal.IsFemale,'Moc dobře vím, jak jsi to myslela','Moc dobře vím, jak jsi to myslel')], ty [vassal.Custom2('InsultNoun', SCOPE.sC('champion'))]! Jak se #EMP opovažuješ#! urážet našeho [ROOT.Char.GetTitleAsNameNoTooltip]?!“ [mediator.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mezi ně rychle vpadne a odtrhne je od sebe, ale atmosféra už je nenapravitelně zkažená. \n\n"
 court.8130.desc.bold: "„Takové štvaní je pod úroveň tohoto dvora. Tvými hrami se zastrašit nenechám,“ odsekne [vassal.GetTitledFirstNameNoTooltip] [vassal.Custom('quirk_pos_adverb')]. $court.8130.desc.body$ [vassal.GetTitleAsNameNoTooltip] [vassal.Custom('quirk_pos_present')] a odpoví: „Dobrá, s radostí ukážu tomu [champion.Custom2('InsultAdjective', SCOPE.sC('vassal'))] hromotlukovi, kam patří.“"
 court.8130.desc.craven: "„A-ale já n-nic takového neřekl[Select_CString(vassal.IsFemale,'A-ale já n-nic takového neřekla!','A-ale já n-nic takového neřekl!')]“ vyhrkne nevěřícně [vassal.GetTitledFirstNameNoTooltip]. $court.8130.desc.body$ [vassal.GetTitleAsNameNoTooltip] [vassal.Custom('quirk_pos_present')] a zakoktá: „C-cože?! No tak, to snad n-nebude nutné?!“"
 court.8130.desc.body: "„Slyšel[Select_CString(champion.IsFemale,'Slyšela jsem tě na vlastní uši!','Slyšel jsem tě na vlastní uši!')]“ opáčí [champion.GetFirstNameNoTooltip]. „Za tuto urážku mého [ROOT.Char.GetLadyLord] žádám zadostiučinění!“"
 court.8130.desc.outro: "\n\nVšichni čekají na mé rozhodnutí, zatímco [mediator.GetFirstNameNoTooltip] drží oba od sebe."
 court.8130.a: "[champion.GetFirstNameNoTooltip] bude hájit mou čest."
 court.8130.a.tt_champion: "[champion.GetTitledFirstNameNoTooltip] zvítězí v souboji"
 court.8130.a.tt_vassal: "[vassal.GetTitledFirstNameNoTooltip] zvítězí v souboji"
 court.8130.a.tt: "[champion.GetTitledFirstName] a [vassal.GetTitledFirstName] svedou [Concept('single_combat_duel','souboj')|E]"
 court.8130.b: "Bylo to nedorozumění. [vassal.GetFirstNameNoTooltip] je věrný vazal."
 court.8130.b.tt_me: "Zvítězím v souboji"
 court.8130.c: "Potřebuji rozvážnější spolčence."
 court.8130.d: "[Select_CString(vassal.IsFemale,'Řekla #EMP co?!#!','Řekl #EMP co?!#!')] Přineste mi [ROOT.Char.Custom('signature_weapon')]!"
 court.8130.d.tt: "[vassal.GetTitledFirstName] a já svedeme [Concept('single_combat_duel','souboj')|E]"
 court.8130.e: "Uklidněte se, žádný souboj nebude."
 court.8140.t: "Panovnické zaváhání"
 court.8140.desc: "Dvorská okázalost pokračuje den za dnem, od úsvitu do soumraku. [vassal_2.GetTitledFirstName] bez přípravy básní o mé velikosti a chrlí jednu otřepanou chválu za druhou. Nedaleko se přidá [vassal_1.GetTitledFirstName], hraje pro publikum, pitomě se šklebí a za své šaškování očekává nějaký projev mé přízně. Jediná krůpěj potu mi nekonečně pomalu stéká po čele... \n\n[vassal_2.GetFirstNameNoTooltip] si všimne mé nepřítomnosti duchem a téměř upřímně se zeptá: „Jste v pořádku, [ROOT.Char.Custom('FormOfAddressForLiege')]?“\n\n„Potřebuji si odpočinout.“"
 court.8140.a: "Omlouvám se, co jste to říkal[Select_CString(vassal_2.IsFemale,'Omlouvám se, co jste to říkala?','Omlouvám se, co jste to říkal?')]"
 court.8140.a.flavor_tt: "Vzchop se, jsi [ROOT.Char.GetTitleAsNameNoTooltip]!"
 court.8140.b: "Promiňte, musím se věnovat jiným záležitostem."
 court.8140.b.flavor_tt: "Potřebuji [ROOT.Char.Custom('GetStressDesire')]. HNED."
 court.8140.c.1: "[vassal_1.GetTitledFirstNameNoTooltip], veď nás v modlitbě."
 court.8140.c.2: "[vassal_1.GetTitledFirstNameNoTooltip], uspořádej mi hostinu!"
 court.8140.c.3: "[vassal_1.GetTitledFirstNameNoTooltip], vyrazme na cestu."
 court.8140.c.flavor_tt: "To by mé rozbouřené mysli rozhodně ulevilo!"
 court.8140.d.1: "[vassal_2.GetTitledFirstNameNoTooltip], vyhlaš hon!"
 court.8140.d.2: "[vassal_2.GetTitledFirstNameNoTooltip], sežeň mi nového koně."
 court.8140.d.3: "[vassal_2.GetTitledFirstNameNoTooltip], co doporučuje tvá věda?"
 court.8140.d.flavor_tt: "To zní báječně!"
 court_event_discount_desc: "Dvorská událost"
 court.8140.c.tt: "Během příštích 5 let můžeš uspořádat [GetActivityType('activity_feast').GetName] za poloviční cenu."
 court.8140.d.tt: "Během příštích 5 let můžeš uspořádat [GetActivityType('activity_hunt').GetName] za poloviční cenu."
 healthy_strolls_modifier: "Zdravé procházky"
 healthy_strolls_modifier_desc: "Tato postava se naučila oceňovat význam každodenních procházek a čerstvého vzduchu."
 enjoy_the_travel_modifier: "Radost z cesty"
 enjoy_the_travel_modifier_desc: "Tato postava si užívá čas strávený na cestách a snaží se z něj vytěžit co nejvíc."
 court.8140.c.tt.2: "Během příštích 10 let můžeš uspořádat [GetActivityType('activity_pilgrimage').GetName] se slevou 25 %."
 court.8150.t: "Hodovní obžerství"
 court.8150.desc.intro: "Každým dnem se zdá, že celý můj dvůr žije řečmi o příští hostině, a mnozí se v poslední době začínají povážlivě zakulacovat..."
 court.8150.desc.taster: "\n\n[food_taster.GetTitledFirstName], můj $food_taster_court_position$, působí s každým zasedáním malátněji a potí se čím dál vydatněji s každou cizokrajnou pochoutkou, kterou pozvedá k ústům. \n\n"
 court.8150.desc.body: "Kulinářské šílenství živí neustálé soupeření mezi [vassal_1.GetTitledFirstName], [vassal_2.GetTitledFirstName] a [vassal_3.GetTitledFirstName] o to, kdo od mých přepracovaných kuchařů vyžádá nejpamátnější pokrm. \n\nDnes je to [demander.GetFirstNameNoTooltip], můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('demander'))], kdo slintá: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], dnes večer mi kuchyně připraví nejbohatší omáčku, jakou lidstvo zná, podávanou k pečeni z deseti ptáků,“ a hladově si olízne rty. \n\n"
 court.8150.desc.almoner_chaplain: "Můj $high_almoner_court_position$ [high_almoner.GetTitledFirstName] a [chaplain.GetCouncilTitleFirstName] nesouhlasně mlaskají a s neskrývaným opovržením vrtí hlavami."
 court.8150.desc.chaplain: "[chaplain.GetCouncilTitleFirstName] nesouhlasně povzdechne: „Tyto pomíjivé požitky nejsou ničím proti milosti, kterou nabízí [chaplain.GetFaith.HighGodName]...“"
 court.8150.desc.almoner: "[high_almoner.GetTitledFirstName], můj $high_almoner_court_position$, ohrne nos a cosi si mumlá o hladovějících chudácích..."
 court.8150.a: "Už se nemohu dočkat!"
 court.8150.b: "Pro #EMP můj#! dvůr jen to nejlepší."
 court.8150.c: "Tahle rozmařilost už zašla příliš daleko!"
 court.8150.d: "Copak vám nikdy nebude dost?"
 court.8150.a.tt: "Tisíc pokrmů prověřilo odolnost [food_taster.GetTitledFirstNameNoTooltip] a zkouška skončila vítězstvím: [Concept('aptitude','způsobilost')|E] se zvýšila."
 food_taster_mettle_tested_desc: "Prověřená odolnost"
 court.8150.b.tt: "Od chvíle, kdy se dvůr přestal přejídat, má [high_almoner.GetTitledFirstNameNoTooltip] téměř nevyčerpatelnou zásobu jídla pro chudé: [Concept('aptitude','způsobilost')|E] se zvýšila."
 plenty_to_donate_almoner_desc: "Dostatek k rozdávání"
 court.8160.t: "[ROOT.Char.Custom('MountedWarriorTerm')|U] číslo jedna"
 court.8160.desc.intro: "Zdravá rivalita mezi zdatnými bojovníky se dá očekávat, ale rostoucí nevraživost mezi [knight_1.GetFirstName] a [knight_2.GetFirstName] začíná kazit náladu u dvora. \n\n[knight_1.GetTitledFirstNameNoTooltip] je všeobecně považován[Select_CString(knight_1.IsFemale,'[knight_1.GetTitledFirstNameNoTooltip] je všeobecně považována za schopnějšího bojovníka, ale [knight_2.GetTitledFirstNameNoTooltip] s tímto názorem očividně nesouhlasí.','[knight_1.GetTitledFirstNameNoTooltip] je všeobecně považován za schopnějšího bojovníka, ale [knight_2.GetTitledFirstNameNoTooltip] s tímto názorem očividně nesouhlasí.')] \n\nUprostřed audience vtrhne [knight_2.GetTitledFirstNameNoTooltip] do mého trůnního sálu, sevře jílec meče a vykřikne: „[knight_1.GetFirstNameNoTooltip]! Jen jeden z nás může tvrdit, že jako [ROOT.Char.Custom('MountedWarriorTerm')] slouží [ROOT.Char.GetTitleAsNameNoTooltip] nejlépe. Pojď ven a rozhodneme to!“\n\n[knight_1.GetTitledFirstNameNoTooltip] odpoví [knight_2.Custom('quirk_neg_adverb')]: „Nebýt přítomnosti [ROOT.Char.GetTitleAsNameNoTooltip], rozsekám tě na kusy přímo tady, ty [knight_2.Custom('quirk_neg_adjective')] [knight_2.Custom2('InsultNoun', SCOPE.sC('knight_1'))]! Omluv se a možná tě nechám naživu!“ \n\nJestli chci tuhle eskalaci zastavit, musím jednat rychle..."
 court.8160.a: "Oba budete sloužit přímo mně."
 court.8160.a.tt: "Rivalita mezi [knight_1.GetFirstNameNoTooltip] a [knight_2.GetFirstNameNoTooltip] zajišťuje, že dokud budou ve službě společně, vynaloží ve svých funkcích maximum: [Concept('aptitude','způsobilost')|E] se zvýšila."
 competing_knight_position_desc: "Soupeřící rytíři"
 court.8160.a.tt_knight_1: "[knight_1.GetTitledFirstNameNoTooltip] zvítězí v souboji"
 court.8160.a.tt_knight_2: "[knight_2.GetTitledFirstNameNoTooltip] zvítězí v souboji"
 court.8160.b: "Seberte jim meče! Dejte jim cvičné zbraně."
 court.8160.c: "Srazím hřebínek vám oběma!"
 court.8160.c.tt: "Svedeš souboj s [Concept('knight','rytířem')|E] s vyšší [Concept('prowess','Udatností')|E] ([knight_1.GetTitledFirstName])"
 court.8160.c.tt_win: "Zvítězíš"
 court.8160.c.tt_lose: "Budeš poražen"
 court.8160.d: "Dokažte mi to na bojišti, ne u dvora!"
 court.8163.t: "Vítězíš v souboji"
 court_humiliation_modifier: "Ponížení u dvora"
 court_humiliation_modifier_desc: "Tato postava byla zostuzena před celým svým dvorem."
 court.8162.tt: "Bojové prvenství [sc_victor.GetFirstNameNoTooltip] je po férovém souboji nesporné: jako [ROOT.Char.Custom('MountedWarriorTerm')] má tato postava nejlepší předpoklady pro funkci $bodyguard_court_position$ nebo $champion_court_position$: [Concept('aptitude','způsobilost')|E] se zvýšila."
 best_knight_position_desc: "Nejlepší z rytířů"
 fostering_competitiveness_modifier: "Podpora soutěživosti"
 fostering_competitiveness_modifier_desc: "Tato postava podporuje mezi svými vojáky na bojišti soutěživost."
 court.8170.t: "V nemilosti dvora"
 court.8170.desc.intro_scary: "Jakmile se objeví [criminal.GetFirstName] — „[criminal.Custom('GetCrime')|U]“ — děti u dvora prchají a dokonce ani ti nejhorlivější [ROOT.Char.GetFaith.BishopNeuterPlural] nedokážou skrýt, jak nepříjemná je jim tato přítomnost."
 court.8170.desc.intro_sordid: "[criminal.GetFirstName] — „[criminal.Custom('GetCrime')|U]“ — budí u dvora opovržení, čelí společenskému vyobcování a stává se terčem kdejakého oplzlého žertu."
 court.8170.desc.intro_religious: "Za pohostinnost vůči [criminal.GetFirstName] — „[criminal.Custom('GetCrime')|U]“ — jsem tvrdě odsuzován[Select_CString(ROOT.Char.IsFemale,'Za pohostinnost vůči [criminal.GetFirstName] — „[criminal.Custom('GetCrime')|U]“ — jsem tvrdě odsuzována. Kvůli své zvrácené víře se této postavě téměř všichni vyhýbají.','Za pohostinnost vůči [criminal.GetFirstName] — „[criminal.Custom('GetCrime')|U]“ — jsem tvrdě odsuzován. Kvůli své zvrácené víře se této postavě téměř všichni vyhýbají.')]"
 court.8170.desc.intro_fallback: "Můj dvůr nemá pro mou pohostinnost vůči [criminal.GetFirstName] — „[criminal.Custom('GetCrime')|U]“ — žádné pochopení. V jinak váženém prostředí je tato postava považována za zvrácenou výjimku."
 court.8170.desc.body: "\n\nTo, že tento [criminal.Custom('GetCrimeDesc')] neodsuzuji a nadále trpím u svého dvora, je vnímáno jako otevřená tolerance a poškozuje pověst mého dvora v očích [ROOT.Char.GetFaith.AltPriestTermPlural] i věřících...\n\nDotlačili mě k rozhodnutí. Musím zvážit, zda zločiny [criminal.GetFirstNameNoTooltip] převáží nad mou náklonností — něco se s tím jistě musí udělat,"
 court.8170.desc.family: "i když [criminal.GetFirstNameNoTooltip] patří k rodu [criminal.GetDynasty.GetNameNoTooltip]..."
 court.8170.desc.guest: "koneckonců je to jen někdo na cestách."
 court.8170.desc.fallback: "dvořané se přece dají nahradit, ne?"
 court.8170.a.family: "Ne — rodina je přednější."
 court.8170.a.other: "Mně nepřísluší soudit."
 court.8170.b: "Musíš činit pokání, [criminal.GetFirstNameNoTooltip]!"
 court.8170.c1: "Kdo nedokázal spatřit spravedlnost, už nespatří nic!"
 court.8170.c2: "Prokletá krev [criminal.GetFirstNameNoTooltip] už dál nepoteče."
 court.8170.c3: "Jen smrt může očistit zločiny [criminal.GetFirstNameNoTooltip]."
 court.8170.d: "Už tě nemohu dál hostit, [criminal.GetFirstNameNoTooltip]..."
 harbors_criminals_modifier: "Ochránce pochybných existencí"
 harbors_criminals_modifier_desc: "Tato postava nedělá nic pro to, aby zločinci u jejího vlastního dvora čelili spravedlnosti. Koneckonců se mohou hodit."
 fast_hard_justice_modifier: "Rychlá a tvrdá spravedlnost"
 fast_hard_justice_modifier_desc: "Tato postava získala pověst někoho, kdo se zločinci jedná rychle a účinně."
 court.8180.t: "Tajemství a lži"
 court.8180.desc.intro: "Plynou celé dny, kdy mě to ani nenapadne, ale pokaždé, když u dvora zahlédnu [criminal.GetTitledFirstName], nedokážu myslet na nic jiného než na spáchané zločiny. \n\nKolik lidí u dvora o tom asi ví — nikdo? Všichni...? Pravda nakonec vyjde najevo a mé pověsti rozhodně neprospěje, pokud se mezi mými dvořany budou skrývat takové skandály... \n\nTenhle problém musím vyřešit, jinak mě k zodpovědnosti požene nejen dvůr — [ROOT.Char.GetFaith.HighGodName] také."
 court.8180.a: "Dost bylo dost. Svět se musí dozvědět pravdu."
 court.8180.b: "Jen hlupák by takovou znalost nevyužil ve svůj prospěch."
 court.8180.c: "Patří do žaláře."
 court.8180.d: "[Select_CString(criminal.IsFemale,'Je načase, aby odešla.','Je načase, aby odešel.')]"
 court.8180.e: "Zatím není třeba jednat..."
 liege_scrutiny_modifier: "Pod dohledem lenního pána"
 liege_scrutiny_modifier_desc: "Lenní pán tuto postavu velmi bedlivě sleduje — včetně jejích tajných aktivit."
 court_without_secrets_modifier: "Dvůr bez tajemství"
 court_without_secrets_modifier_desc: "Tato postava má pověst někoho, kdo neúnavně pátrá po tajemstvích a trestá zločiny."
