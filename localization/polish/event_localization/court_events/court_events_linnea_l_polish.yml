l_polish:
 court.5001.t: "Osamělé dny"
 court.5001.desc: "[friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se příšerně nudí. Vidím to ve tváři i podle toho, jak se neustále dožaduje mé pozornosti.\n\nVím, že mi povinnosti zabírají spoustu času a [friend.GetFirstNameNoTooltip] kvůli tomu někdy zůstává [Select_CString(friend.IsFemale,'osamělá','osamělý')]..."
 court.5001.a: "Najdu si na [friend.GetFirstNameNoTooltip] víc času."
 court.5001.b: "„Víš, co potřebuješ? [friend.Custom('WifeHusbandOpp')].“"
 court.5001.c_dog: "„Ty... můžeš si vzít [ROOT.Char.Custom('DogStoryName')].“"
 court.5001.c_cat: "„Ty... můžeš si vzít [ROOT.Char.Custom('CatStoryName')].“"
 court.5001.d: "[friend.GetFirstNameNoTooltip] potřebuje nějaký úkol, který [Select_CString(friend.IsFemale,'ji zaměstná','ho zaměstná')]."
 court.5010.t: "Strašení"
 court.5010.desc: "Vyhledává mě stále více vyděšených sluhů s vytřeštěnýma očima a tvrdí, že po chodbách viděli [family_member.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„[family_member.GetFirstNameNoTooltip] nemůže najít pokoje, [ROOT.Char.Custom('FormOfAddressForLiege')]. Proto se vrací na místo, kde [Select_CString(family_member.IsFemale,'zemřela','zemřel')]!“"
 court.5010.a: "Dost těch nesmyslů! [family_member.GetFirstNameNoTooltip] je mrtvý člověk a nevrátí se!"
 court.5010.b: "Je nám ctí, že nás [family_member.GetFirstNameNoTooltip] navštěvuje. Nechte ten přízrak na pokoji."
 court.5010.c: "Nechám to prošetřit."
 court.5020.t: "Spor o polštář"
 court.5020.desc: "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přiběhne celý bez sebe, s hlubokými kruhy pod očima.\n\n„Ta vaše zatracená kočka mi nedá v komnatách pokoj. Zřejmě je #EMP můj#! polštář tím nejlepším místem ke spaní v celém [ROOT.Char.Custom('ResidenceBuilding')]! Tu potvoru musíte zkrotit!“ [courtier.GetFirstNameNoTooltip] se zarazí a viditelně se uklidní. „Tedy pokud si to [ROOT.Char.GetLadyLord] přeje.“"
 court.5020.a: "Je očividné, že ten polštář už patří [ROOT.Char.Custom('CatStoryName')]."
 court.5020.b: "Postarám se, aby se [ROOT.Char.Custom('CatStoryName')] držel stranou."
 court.5021.desc: "Na druhém konci místnosti zahlédnu [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)]. V poslední době má [courtier.GetFirstNameNoTooltip] výbornou náladu a hluboké kruhy pod očima zmizely.\n\nZnepokojuje mě, že ve stejnou dobu zmizel i můj milovaný mazlíček [ROOT.Char.Custom('CatStoryName')]..."
 court.5021.desc_mittens: "\n\n[courtier.GetFirstNameNoTooltip] si všimne mého pohledu a zamává na mě. Nové palčáky v barvě [ROOT.Char.Custom('CatFurColor')] nelze přehlédnout."
 court.5021.a: "Kam se jen [ROOT.Char.Custom('CatStoryName')] poděl?"
 court.5021.a_mittens: "Jak krásné palčá– Ale ne, #EMP [ROOT.Char.Custom('CatStoryName')]#!!"
 court.5021.b: "[courtier.GetFirstNameNoTooltip] zmizí podobným způsobem."
 court.5021.c: "„Stihne tě stejný osud jako [ROOT.Char.Custom('CatStoryName')].“"
 court.5025.t: "Nabídka"
 court.5025.desc: "„Ta lesklá srst v barvě [ROOT.Char.Custom('CatFurColor')] a ty [ROOT.Char.Custom('CatEyeColor')] oči... Tak nádhernou kočku jsem ještě neviděl!“\n\n[buyer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zamyšleně pohladí [ROOT.Char.Custom('CatStoryName')] a pak se ke mně obrátí. „[ROOT.Var('price_for_pet').GetValue|0] zlatých by mělo bohatě stačit, nemyslíte?“"
 court.5025.a: "[ROOT.Char.Custom('CatStoryName')] je tvůj!"
 court.5025.b: "Jak se opovažuješ? [ROOT.Char.Custom('CatStoryName')] bych nikdy neprodal!"
 court.5026.desc: "„Tak lesklá srst v barvě [ROOT.Char.Custom('DogFurColor')], a navíc tak dobře vycvičený pes! Tak nádherné zvíře jsem ještě neviděl!“\n\n[buyer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zamyšleně pohladí [ROOT.Char.Custom('DogStoryName')] a pak se ke mně obrátí. „[ROOT.Var('price_for_pet').GetValue|0] zlatých by mělo bohatě stačit, nemyslíte?“"
 court.5026.a: "[ROOT.Char.Custom('DogStoryName')] je tvůj!"
 court.5026.b: "Jak se opovažuješ? [ROOT.Char.Custom('DogStoryName')] bych nikdy neprodal!"
 court.5030.t: "Čas na hraní"
 court.5030.desc_opening: "Na druhém konci místnosti vidím [child.Custom2('MyCharacterIntroduction', ROOT.Char)], jak si hraje se svou oblíbenou hračkou [child.Custom('child_favorite_toy')]."
 court.5030.desc_young: "Dospělí kolem mě jsou pořád nešťastní a chtějí, abych jim pomáhal, ale mnohem raději bych pomohl porazit toho strašlivého draka, se kterým [child.GetFirstNameNoTooltip] zřejmě bojuje!"
 court.5030.desc: "Celý den poslouchám jen nářky a stížnosti a už se #EMP tak nudím#!, že mou pozornost nevyhnutelně začne přitahovat hra, kterou si [child.GetFirstNameNoTooltip] hraje..."
 court.5030.desc_ending: "\n\n[child.GetFirstNameNoTooltip] si všimne mého pohledu a zamává na mě, ať se přidám."
 court.5030.a: "Přineste mi [ROOT.Char.Custom('child_favorite_toy')]!"
 court.5030.b_young: "Ne, musím se chovat vážně."
 court.5030.b: "Ne, musím studovat."
 court.5040.t: "Žertovné řádění"
 court.5040.desc: "Zase musím poslouchat samé stížnosti. [prank_alternative_1.Custom2('MyCharacterIntroduction', ROOT.Char)] se dožaduje pozornosti, [prank_alternative_2.Custom2('MyCharacterIntroduction', ROOT.Char)] tvrdí, že můj dvůr začíná být nudný, a [prank_alternative_3.Custom2('MyCharacterIntroduction', ROOT.Char)] si ze všeho nejvíc stěžuje, že se v poslední době podává příliš mnoho jídel se zvířecími měchýři.\n\n...Počkat, něco mě napadlo."
 court.5040.a: "Musím odolat a chovat se jako řádný [Select_CString(ROOT.Char.IsFemale,'panovnice','panovník')]."
 court.5040.b: "Nafouknutý měchýř na židli [prank_alternative_1.GetFirstNameNoTooltip] – #EMP tohle#! upoutá pozornost!"
 court.5040.c: "Když [prank_alternative_2.GetFirstNameNoTooltip] vypustí pořádný pšouk, nuda rozhodně nebude."
 court.5040.d: "[prank_alternative_3.GetFirstNameNoTooltip] najde měchýř místo na talíři na své židli!"
 court.5041.desc_option_1: "Když se [prank_target.GetTitledFirstName] při večeři nedívá, opatrně nasypu na talíř drobné kousky lyrové struny.\n\nSotva zadržím smích, když se [prank_target.GetTitledFirstName] otočí zpět a zjistí, že se talíř hemží červy. Jestli ale chci v téhle křížové výpravě pokračovat, nesmím vzbudit podezření!"
 court.5041.desc_option_2: "Usuším telecí krev, rozemelu ji na prášek a ve chvíli, kdy se [prank_target.GetTitledFirstName] nedívá, jím posypu steak. Prášek se okamžitě promění zpět v krev a já mám co dělat, abych nevyprskl smíchy, když [prank_target.GetFirstNameNoTooltip] s hrůzou sleduje, jak maso před [Select_CString(prank_target.IsFemale,'ní','ním')] začíná krvácet!"
 court.5041.desc_option_3: "Potají poručím několika sluhům, aby mi sehnali hady – co nejvíc. Když pak [prank_target.GetTitledFirstName] není ve svých komnatách, nechám je všechny vypustit dovnitř. Výkřiky, které se po návratu rozléhají chodbami, mě přivedou do záchvatu smíchu!"
 court.5041.desc_option_4: "Rozdrtím trochu kadidla na jemný prášek a schovám si ho do dlaně. Pak, když sedíme proti sobě u stolu se svící mezi námi, prudce máchnu rukou směrem k tváři [prank_target.GetTitledFirstName]. Jakmile prášek proletí plamenem, velkolepě vzplane!\n\n[prank_target.GetTitledFirstName] vykřikne v domnění, že [Select_CString(prank_target.IsFemale,'jí hoří tvář','mu hoří tvář')], ale já vím, že je to jen trik, a vesele se směji."
 court.5041.desc_option_5: "Opatrně pootevřu dveře do komnat [prank_target.GetTitledFirstName], vylezu na židli a pomaličku položím plný nočník na horní hranu dveří. Pak už jen rychlé zaklepání a ještě rychlejší úprk za roh.\n\n„Kdo je–“ #EMP Žbluňk!#!"
 court.5041.desc_opening: "#EMP Brrt!#!\n\nZvuk se rozlehne síní ve chvíli, kdy se [prank_target.Custom2('MyCharacterIntroduction', ROOT.Char)] posadí, a čím déle trvá ticho, tím rudější je [prank_target.GetFirstNameNoTooltip] ve tváři. Sotva zadržím smích, ale jestli si chci z [prank_target.GetFirstNameNoTooltip] vystřelit znovu, nesmím vzbudit podezření!"
 court.5041.a: "Přestanu a [prank_target.GetFirstNameNoTooltip] utěším."
 court.5041.option_1: "Příští jídlo [prank_target.GetFirstNameNoTooltip] se bude hemžit „červy“!"
 court.5041.option_2: "Příští steak [prank_target.GetFirstNameNoTooltip] bude vypadat, jako by krvácel!"
 court.5041.option_3: "Vypustím do komnat [prank_target.GetFirstNameNoTooltip] hady!"
 court.5041.option_4: "Vyděsím [prank_target.GetFirstNameNoTooltip] hořlavým práškem!"
 court.5041.option_5: "Nad dveřmi do komnat [prank_target.GetFirstNameNoTooltip] bude čekat překvapení!"
 court.5042.desc_chastiser: "\n\n[chastiser.Custom2('MyCharacterIntroduction', ROOT.Char)|U] v tom ale nic legračního nevidí.\n\n„Vím, že za těmi příšernými žerty u dvora stojíte vy."
 court.5042.desc_chastiser_snake: "Chudák [prank_target.GetTitledFirstName] sebou škubne při každém stínu, a to, co hadi udělali s [prank_target.GetFirstNamePossessiveNoTooltip] tváří... Je to ostuda. Vaše Milosti.“"
 court.5042.desc_chastiser_no_snake: "Chudák [prank_target.GetTitledFirstName] sebou škubne při každém stínu! Je to ostuda... Vaše Milosti.“"
 court.5042.desc_no_chastiser: "Mí dvořané v tom ale nic legračního nevidí a dávají naprosto jasně najevo, že jakékoli další žertíky odsoudí. A že se budou mít na pozoru."
 court.5042.a: "Vždyť to byl jen žert!"
 court.5050.t: "Uražený dvořan"
 court.5050.desc: "„Proč jste dvorským úřadem [Select_CString(courtier_given_title.IsFemale,'poctili tu','poctili toho')] [courtier_given_title.Custom2('InsultNoun', SCOPE.sC('courtier'))] [courtier_given_title.GetTitledFirstName], a ne mě?“\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zuří. Zjevně [Select_CString(courtier.IsFemale,'byla skálopevně přesvědčená','byl skálopevně přesvědčený')], že ta pocta připadne právě [Select_CString(courtier.IsFemale,'jí','jemu')] a nikomu jinému."
 court.5050.a: "Ale no tak!"
 court.5050.b: "Máš pravdu, dvorský úřad si zasloužíš."
 court.5050.c: "Jestli budeš dál takhle šaškovat, měl bych ti za to začít platit!"
 court.5055.t: "Barevný talent"
 court.5055.desc: "Už potřetí tento měsíc najdu [painter.Custom2('MyCharacterIntroduction', ROOT.Char)] sedět na podlaze obklopené rozlitými barvami a kusy plátna.\n\nMí dvořané si šeptají, že z [painter.GetFirstNameNoTooltip] roste umělecký génius, zatímco služebnictvo si stěžuje na drhnutí podlah po každém z [Select_CString(painter.IsFemale,'jejích #EMP záchvatů inspirace#!','jeho #EMP záchvatů inspirace#!')]."
 court.5055.a: "Musíš se zaměřit na #EMP užitečné#! studium, [painter.GetFirstNameNoTooltip]."
 court.5055.b: "[Select_CString(painter.IsFemale,'Její genialitu budu rozvíjet!','Jeho genialitu budu rozvíjet!')]"
 court.5055.b_tt: "[painter.GetFirstNameNoTooltip] pokračuje ve své umělecké tvorbě."
 court.5056.desc_opening: "Talent [painter.Custom2('MyCharacterIntroduction', ROOT.Char)] se štětcem roste každým rokem a spolu s ním i zájem a schopnosti v dalších oblastech.\n\n"
 court.5056.desc_family: "„Děkuji, že mi věříš, [painter.Custom2('RelationToMeShort', ROOT.Char)]."
 court.5056.desc: "„Děkuji, že věříte mně i mému talentu, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 court.5056.desc_ending: "Mám nový projekt, do kterého bych se [Select_CString(painter.IsFemale,'chtěla','chtěl')] pustit. Možná byste se znovu [Select_CString(ROOT.Char.IsFemale,'chtěla stát mou mecenáškou','chtěl stát mým mecenášem')]?“"
 court.5056.a: "Samozřejmě!"
 court.5056.b: "Teď už jsi dost [Select_CString(painter.IsFemale,'stará','starý')], abys [Select_CString(painter.IsFemale,'šla','šel')] vlastní cestou."
 court.5057.desc: "S přibývajícími lety začíná být bolestně zřejmé, že [painter.Custom2('MyCharacterIntroduction', ROOT.Char)] nemá ani talent, ani odhodlání namalovat mistrovské dílo, které mi [Select_CString(painter.IsFemale,'slíbila','slíbil')].\n\n„[Select_CString(painter.IsFemale,'Byla jsem jen dítě, které toužilo po pozornosti.','Byl jsem jen dítě, které toužilo po pozornosti.')] A vy jste těm mým nesmyslům opravdu [Select_CString(ROOT.Char.IsFemale,'věřila','věřil')]!“"
 court.5057.a: "Ach, pošetilost dětství..."
 court.5057.b: "Ze mě si nikdo blázna dělat nebude!"
 court.5060.t: "[Select_CString(knight.IsFemale,'Udatná','Udatný')] $knight_culture_player_no_tooltip$"
 court.5060.desc: "[knight.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se v našich nedávných bitvách mimořádně [Select_CString(knight.IsFemale,'osvědčila','osvědčil')] a celý můj dvůr tím žije. Jak [Select_CString(knight.IsFemale,'skvělá','skvělý')] $knight_culture_player_no_tooltip_lowercase$, jaký vzor, jaká #EMP [Select_CString(knight.IsFemale,'žena','muž')]#!!\n\nZe všech stran se na [knight.GetFirstNameNoTooltip] snáší chvála a je zřejmé, že se ode mě očekává nějaká oficiální odměna."
 court.5060.a: "Ehm... pronesu o [knight.GetFirstNameNoTooltip] pár pochvalných slov."
 court.5060.b: "[knight.GetFirstNameNoTooltip] se stane [Select_CString(knight.IsFemale,'novou paní','novým pánem')] [title_to_grant.GetNameNoTooltip]!"
 court.5060.c: "Rod takových $knight_culture_player_no_tooltip_lowercase$ si zaslouží nejvyšší chválu!"
 court.5060.d.champion: "[knight.GetFirstNameNoTooltip] bude zastávat úřad $champion_court_position$!"
 court.5060.d.bodyguard: "[knight.GetFirstNameNoTooltip] bude zastávat úřad $bodyguard_court_position$!"
 court.5060.d.akolouthos: "[knight.GetFirstNameNoTooltip] bude zastávat úřad $akolouthos_court_position$!"
 court.5070.t: "[Select_CString(court_tutor.IsFemale,'Obětavá učitelka','Obětavý učitel')]"
 court.5070.desc: "[court_tutor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou přichází s obavami o stav našich výukových pomůcek.\n\n„Vystačíme si s tím, co máme, ale jen si představte, kam až by naše děti mohly dojít s lepšími pomůckami... Nové voskové tabulky, pergamen, možná dokonce inkoust!“"
 court.5070.a: "Ale vždyť už teď odvádíš skvělou práci!"
 court.5070.b: "Samozřejmě, peníze dostaneš!"
 court.5070.b.tt: "Tím se zlepší vzdělávání všech tvých svěřenců"
 court.5075.t: "Dva mimochodníci"
 court.5075.desc_opening: "[neighbor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě poctí velkorysým darem: dvojicí ušlechtilých mimochodníků, klisnou a hřebcem!\n\n"
 court.5075.desc_horse_master: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ [master_of_the_horse.Custom2('MyCharacterIntroduction', ROOT.Char)] mě zavolá k [dummy_gender.Custom('HorseMareStallion')]."
 court.5075.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ ozve se na mě správce stájí a zavolá mě k [dummy_gender.Custom('HorseMareStallion')]."
 court.5075.desc_ending: "„Podívejte na ty svaly... A ty zadní nohy! Tenhle kůň by se ve válce skvěle osvědčil.“"
 court.5075.a: "Budou sloužit pánům a dámám mého dvora."
 court.5075.b: "A za oba dostanu pěknou sumu!"
 court.5075.c: "Toho [dummy_gender.Custom('HorseMareStallion')] vycvičím osobně."
 court.5075.c.success: "Podaří se ti koně řádně vycvičit"
 court.5075.c.failure: "Kůň tě shodí"
