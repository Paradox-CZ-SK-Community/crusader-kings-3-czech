l_polish:
 court.9000.t: "Rytířské vyznání"
 court.9000.desc: "Když kráčím ke svému trůnu, zaslechnu [flirty_knight.GetFirstName], jak něco pronáší k [flirty_spouse.GetFirstName], [Select_CString(flirty_spouse.IsFemale,'mé manželce','mému manželovi')].\n\n„[flirty_knight.Custom('GeneratePoem_Intro_Rhyming')]\n[flirty_knight.Custom('GeneratePoem_Outro_Rhyming')]“\n\nTo snad [flirty_knight.GetFirstNameNoTooltip] recituje milostnou poezii? #EMP [Select_CString(flirty_spouse.IsFemale,'Mé vlastní manželce','Mému vlastnímu manželovi')]#!?"
 court.9000.a: "[flirty_knight.GetFirstNameNoTooltip], ty [flirty_knight.Custom2('InsultNounSexual', ROOT.Char)]! Do žaláře s tebou!"
 court.9000.b: "[flirty_spouse.GetFirstNameNoTooltip]! Drž se od [flirty_knight.GetFirstNameNoTooltip] dál, ty [flirty_spouse.Custom2('InsultNounSexual', ROOT.Char)]!"
 court.9000.c: "Ach, dvorská láska! Ať ta nádherná poezie zní celým dvorem!"
 court_9000_a_tt: "Pokud se mezi [flirty_spouse.GetFirstName] a [flirty_knight.GetFirstName] něco děje, tady to skončí\n"
 court_9000_b_tt: "Pokud se mezi [flirty_spouse.GetFirstName] a [flirty_knight.GetFirstName] něco děje, pravděpodobně to skončí\n"
 court_9000_c_tt: "Pokud se mezi [flirty_spouse.GetFirstName] a [flirty_knight.GetFirstName] něco děje, může to pokračovat\n"
 court.9001.t: "Dvorský dar"
 court.9001.desc: "Zahlédnu [flirty_spouse.GetFirstName], [Select_CString(flirty_spouse.IsFemale,'svou manželku','svého manžela')], a [flirty_knight.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('flirty_knight'))], ve chvíli, která působí až příliš vášnivě – [flirty_knight.GetFirstNameNoTooltip] klečí před [flirty_spouse.GetFirstNameNoTooltip].\n\n„[flirty_spouse.Custom('RomanticComplimentNoun')]! Prosím, přijmi tento skromný dar.“ [flirty_knight.GetFirstNameNoTooltip] podá [flirty_spouse.Custom('SeductionGiftTypeIndefiniteSimple')].\n\n„Ach!“ vykoktá [flirty_spouse.GetFirstNameNoTooltip]. „To se mi moc líbí! Je to nádherné.“\n\nCo se tu pro všechno na světě děje?"
 court.9001.a: "[flirty_spouse.GetFirstNameNoTooltip] je #EMP [Select_CString(flirty_spouse.IsFemale,'má','můj')]#!. Tas meč!"
 court.9001.b: "Dej to sem! [flirty_knight.GetFirstNameNoTooltip] – vypovídám tě z panství!"
 court.9001.c: "Dvorská láska je tak čistá, tak nevinná!"
 court.9001.a.tt: "#V Vyzveš [flirty_knight.GetFirstName] na souboj#!, aby [Select_CString(flirty_knight.IsFemale,'dala','dal')] [flirty_spouse.GetFirstNameNoTooltip] pokoj!\n#weak Tento souboj NENÍ na život a na smrt.#!\nPokud vyhraješ, srdce [flirty_spouse.GetFirstNameNoTooltip] bude patřit jen tobě. Pokud prohraješ, kdo ví, co se stane?\n\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[Concept('prowess','Udatnost')|E] [flirty_knight.GetFirstNameNoTooltip]: [prowess_i]#V [flirty_knight.GetProwess]#!"
 how_could_you_opinion: "Jak jsi [Select_CString(CHARACTER.IsFemale,'mohla','mohl')]?"
 court.9002.trigger_failure: "Můj souboj s [flirty_knight.GetFirstNameNoTooltip] byl zrušen"
 court.9004.t: "$court.9001.t$: Vítězství"
 court.9004.desc: "„Skládám před vámi svou zbraň – vaše duše ve mně budí obdiv a srdce [flirty_spouse.GetFirstNameNoTooltip] si zasloužíte mnohem víc!“ pronese poraženě [flirty_knight.GetFirstName].\n„Od této chvíle vám budu bezvýhradně sloužit, [ROOT.Char.GetTitleTierName].“\n\n[flirty_spouse.GetFirstNameNoTooltip], [Select_CString(flirty_spouse.IsFemale,'má manželka','můj manžel')], se ke mně otočí s novým ohněm v očích.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má ženo','Můj muži')], [Select_CString(ROOT.Char.IsFemale,'riskovala','riskoval')] jsi život pro mou náklonnost! Ach, máš tak ušlechtilé srdce – od této chvíle patřím jen tobě!“"
 court.9004.a: "[flirty_spouse.GetFirstNameNoTooltip] patří jen mně."
 court.9005.t: "$court.9001.t$: Porážka"
 court.9005.desc: "„Nikdy sis lásku [flirty_spouse.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'nezasloužila','nezasloužil')]!“ zvolá [flirty_knight.GetFirstName].\n\n„Ach, [Select_CString(flirty_knight.IsFemale,'má','můj')] [flirty_knight.Custom('ComplimentAdjective')] [Select_CString(flirty_knight.IsFemale,'hrdinko','hrdino')], kéž se nám podaří z tohoto ponurého místa uprchnout! Naše láska si však vydobyla právo rozkvést navzdory všemu,“ pronese [flirty_spouse.GetFirstNameNoTooltip] s toužebným povzdechem.\n\n[flirty_knight.GetFirstNameNoTooltip] na mě hledí s kamennou tváří."
 court.9005.a: "[ROOT.Char.Custom('CulturalCurse')|U]!"
 court_9005_tt: "[flirty_spouse.GetFirstName] a [flirty_knight.GetFirstName] opustí tvůj dvůr, aby svou lásku naplnili jinde"
 court.9100.t: "Požitkářská zábava"
 court.9100.desc: "„Ach, výborně! [food_lover_1.Custom('GetExpensiveMeal')|U] — to mám ze všeho nejraději!“ zahřmí vesele [food_lover_1.GetFirstName] a láduje se, zatímco sluha zoufale přidržuje tác.\n\n„Ach, [food_lover_2.Custom('GetExpensiveDessert')]! Přesně na tohle mám chuť!“ zazpívá [food_lover_2.GetFirstName].\n\n„Tomuhle říkám život! Sluhové, další [food_lover_1.Custom('GetExpensiveDrink')], a hned!“ poručí [food_lover_3.GetFirstName].\n\nZdá se, že si mí dvořané opravdu užívají!"
 court.9100.a: "Méně cpaní a víc práce!"
 court.9100.b: "Všichni si zasloužíte jen to nejlepší!"
 court.9100.c: "Nech mi taky trochu pití, [food_lover_3.GetFirstNameNoTooltip] – nejlépe chutná s přáteli!"
 court.9100.d: "Nechám je být."
 court.9200.t: "Bakchanálie sbližují"
 court.9200.desc: "„Náš [ROOT.Char.GetTitleTierName] je opravdu štědrý, [food_lover_2.GetFirstNameNoTooltip]! Jen ochutnej tu #EMP úžasnou#! pochoutku [food_lover_1.Custom('GetExpensiveMeal')]!“ rozplývá se [food_lover_1.GetFirstName].\n\n„To rozhodně! [ROOT.Char.GetFirstNameNoTooltip] je [food_lover_1.Custom('ComplimentAdjective')] [Select_CString(ROOT.Char.IsFemale,'panovnice','panovník')] – skoro jako tahle pochoutka [food_lover_2.Custom('FavoriteTreat')]!“ odpoví nadšeně [food_lover_2.GetFirstName].\n\nZdá se, že mé výdaje za přepychová jídla daly vzniknout novému přátelství!"
 court.9200.a: "Nevadí, když se přidám na trochu [food_lover_1.Custom('GetExpensiveMeal')]?"
 court.9200.b: "Sluhové, nevidíte, že hladovějí? Ať je tu další porce — [food_lover_2.Custom('GetExpensiveDessert')]!"
 court.9200.c: "Bylo by neslušné rušit je při jídle!"
 court.9300.t: "Nestřídmé obžerství"
 court.9300.desc: "„[Select_CString(ROOT.Char.IsFemale,'M-má','M-můj')] [ROOT.Char.GetTitleTierName|l]... [overindulger_target.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('overindulger_target'))], prostě... #EMP pořád jen jí! A pokaždé je to [overindulger_target.Custom('GetExpensiveDessert')]!#!“ vykoktá [worried_courtier.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort',worried_courtier)].\n\nVtom zahlédnu [overindulger_target.GetFirstNameNoTooltip], jak vychází ze spíže s plnou náručí. Je v ní [overindulger_target.Custom('GetExpensiveDessert')].\n\n„Děje se něco, [ROOT.Char.Custom('FormOfAddressForLiege')]?“ pronese [overindulger_target.GetFirstNameNoTooltip] a [overindulger_target.Custom('quirk_neg_pp')]."
 court.9300.a: "#EMP Ty jsi [Select_CString(overindulger_target.IsFemale,'snědla','snědl')] panovnickou pochoutku!? A zrovna [overindulger_target.Custom('GetExpensiveDessert')]!#!"
 court.9300.b: "Přísahám! [ROOT.Char.GetFaith.HighGodName] tě vidí, [Select_CString(overindulger_target.IsFemale,'ženo','muži')]! Vzpamatuj se!"
 court.9300.c: "Ale tohle #EMP zaplatíš#!."
 court.9300.d: "Odteď máš do spíže zákaz..."
 court.9300.b.success: "Přesvědčíš [overindulger_target.GetFirstNameNoTooltip], aby [Select_CString(overindulger_target.IsFemale,'přestala','přestal')] s přejídáním a [Select_CString(overindulger_target.IsFemale,'zaplatila','zaplatil')] ti škodu. [overindulger_target.Custom('GetExpensiveDessert')] už nebude na jídelníčku."
 court.9300.b.failure: "[overindulger_target.GetFirstNameNoTooltip] se nenechá odradit a odmítne ti zaplatit škodu"
 court.9400.t: "Koláčová taškařice"
 court.9400.desc: "Co to má znamenat? #EMP Obrovský#! koláč přímo uprostřed mého trůnního sálu!?\n\n„Dáte si kousek koláče, [pie_presenting_courtier.Custom2('RelationToMeShort' , SCOPE.sC('you_target'))]?“ uchechtne se [pie_presenting_courtier.GetFirstName].\n„Uvnitř čeká překvapení! Tady máte nůž, prosím – klidně si ukrojte!“\n\nNeochotně vezmu nůž a opatrně říznu do kůrky. Vtom z koláče vyskočí můj šašek [court_jester.GetFirstName], směje se a mává rukama!"
 court.9400.a: "Víš co? Mám hlad. #EMP Vlez zpátky do koláče.#!"
 court.9400.b: "Ach, [court_jester.GetFirstNameNoTooltip], tolik tvořivosti! Tady máš něco za odměnu."
 court.9400.c: "#EMP Vrah! Stráže!#!"
 court.9400.d: "Ha ha! #EMP Tohle#! je zábava!"
 absolutely_horrified_opinion: "Naprosto zděšený"
 best_meal_of_my_life_modifier: "Nejlepší jídlo mého života"
 best_meal_of_my_life_modifier_desc: "Tato postava snědla něco naprosto úžasného!"
 suspicious_against_pies_modifier: "Podezřívavost vůči koláčům"
 suspicious_against_pies_modifier_desc: "Tato postava je mimořádně podezřívavá a ostražitá vůči všemu, co byť jen vzdáleně připomíná koláč. Ostatně to platí i pro jiné druhy jídla. A vlastně skoro pro všechno..."
 court.9500.t: "Trocha cizí řeči"
 court.9500.desc: "„Zdravím vás, [ROOT.Char.GetTitleTierName]. Vaše pověst se dá vystihnout slovem [ROOT.Char.Custom('ComplimentAdjective')],“ pronese [teacher_target.GetFirstName] a [teacher_target.Custom('quirk_pos_pp')].\n\n„Velmi mě zajímá výchova [child_to_learn_language.GetFirstName]. Ovládám totiž jazyk [culture_language_to_learn.GetLanguage.GetNameNoTooltip] a domnívám se, že by bylo velmi užitečné, kdyby se ho [child_to_learn_language.GetFirstNameNoTooltip] [Select_CString(child_to_learn_language.IsFemale,'naučila','naučil')].“ [teacher_target.GetFirstNameNoTooltip] pokračuje s upřímným výrazem.\n\n„Potřebuji jen peníze na brka, inkoust, pergamen... a samozřejmě i nějakou odměnu pro sebe.“"
 court.9500.a: "To zní velmi užitečně. Zaplatím #EMP cokoli#!, jen ať se to podaří."
 court.9500.b: "[child_to_learn_language.GetFirstNameNoTooltip], snaž se!"
 court.9500.c: "Pche! Kdo potřebuje mluvit jiným jazykem než [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!?"
 court.9500.b.success: "[child_to_learn_language.GetFirstNameNoTooltip] se úspěšně naučí jazyk [culture_language_to_learn.GetLanguage.GetNameNoTooltip]"
 court.9500.b.failure: "[child_to_learn_language.GetFirstNameNoTooltip] je z výuky ve stresu"
 court_maintenance.0010.t: "Prázdný trůn"
 court_maintenance.0010.desc: "[Select_CString(messenger.IsFemale,'Má dvořanka','Můj dvořan')] [messenger.GetName] trvá na tom, že se mnou musí mluvit, přestože jsem [Select_CString(ROOT.Char.IsFemale,'dala','dal')] jasně najevo, že bych raději [Select_CString(ROOT.Char.IsFemale,'zůstala','zůstal')] o samotě:\n\n„[ROOT.Char.GetTitleTierName], už je to velmi dlouho, co jste se naposledy [Select_CString(ROOT.Char.IsFemale,'ukázala','ukázal')] u dvora.\nVšichni se ve vaší nepřítomnosti snažíme zachovat zdání, že je vše v pořádku, ale [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] dvůr nemůže fungovat bez přítomnosti [ROOT.Char.GetTitleTierName].“\n\nMá dlouhá nepřítomnost u Královského dvora [Select_CString(messenger.IsFemale,'ji','ho')] připravila o vedení i směr."
 court_maintenance.0010.desc.seeking_gainful_employment: "Mí dvořané stále častěji srovnávají své poměry s prestižními dvory, jako je ten [great_cgv_court.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 court_maintenance.0010.desc.general_ending: "Mí dvořané stále častěji srovnávají své poměry s cizími dvory."
 court_maintenance.0010.a: "Je načase navštívit Královský dvůr."
 court_maintenance.0010.a.tooltip: "Vstoupíš do Královského dvora."
 court_maintenance.0010.b: "Svůj dvůr navštívím, až uznám za vhodné."
 court_maintenance.0010.b.tooltip: "Někteří dvořané mohou opustit tvůj dvůr a odejít ke dvoru v [great_cgv_court.GetPrimaryTitle.GetName]."
 court_maintenance.0010.b.brave: "Toužím po vzrušení, ne po prázdných obřadech!"
 court_maintenance.0010.b.depressed: "V tom všem prostě nevidím smysl..."
 court_maintenance.0010.b.paranoid: "Nemohu se takhle vystavovat nebezpečí. Musím být vždy v bezpečí!"
 court_maintenance.0010.c: "Hostina jim dá něco na práci!"
 court_maintenance.0010.c.tooltip: "Zahájíš hostinu v [SCOPE.GetRootScope.GetCharacter.GetCapitalLocation.GetTitle.GetNameNoTier]"
 court_maintenance.0011.t: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] dvůr"
 court_maintenance.0011.t.regent: "Dvůr [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 court_maintenance.0011.desc: "„Jako [ROOT.Char.GetTitleTierName] máte nové povinnosti a závazky. Očekává se od vás, že budete pravidelně pořádat audience, urovnávat spory v panství a necháte své dvořany podílet se na každodenním chodu dvora.“\n\n[messenger.GetName] se na mě dívá přísně a přímo, téměř jako by mě [Select_CString(messenger.IsFemale,'kárala','káral')]. Možná se v očích skrývá i trocha [ROOT.GetCharacter.Custom2('GetPrideEnvy' , SCOPE.sC('messenger'))]?\n\n[messenger.GetName] začne rozvíjet nádherný prapor se znakem rodu [ROOT.Char.GetHouse.GetName]. „Jedním ze způsobů, podle kterých bude svět od nynějška soudit vaši vládu, je to, jak svůj Královský dvůr zdobíte a jak o něj pečujete. [Select_CString(messenger.IsFemale,'Dovolila','Dovolil')] jsem si nechat tento prapor vyrobit jako dar na počest začátku vaší vlády.“"
 court_maintenance.0011.desc.regent: "„Jako [ROOT.Char.GetTitleTierName] máte nové povinnosti a závazky. Očekává se od vás, že budete pravidelně pořádat audience, urovnávat spory v panství a při každodenním chodu dvora [ceremonial_liege.GetTitleAsNamePossessiveNoTooltip] naslouchat radám ostatních dvořanů.“"
 court_maintenance.0011.desc.ach: "„Tento dar připomene začátek vaší vlády.“ [messenger.GetName] rozvine nádherný prapor se znakem rodu [ROOT.Char.GetHouse.GetName].\n\n„[ROOT.Char.GetTitleTierName|l] jste zatím jen podle jména, ale celé panství by se mělo sejít k velkolepé korunovaci! Tam můžete upevnit svou autoritu a zavázat se, že budete chránit a bránit [ROOT.Char.GetPrimaryTitle.GetNameNoTier], zatímco [ROOT.Char.GetFaith.HighGodName] bude vašemu slibu naslouchat.“"
 court_maintenance.0011.coronation: "Okamžitě začněme s přípravami."
 court_maintenance.0011.coronation.tooltip: "Začneš připravovat svou [Concept('coronation','korunovaci')|E]."
 court_maintenance.0011.crown_needed.tooltip: "Některé [Concept('activity_options','možnosti aktivity')|E] při [Concept('coronation','korunovaci')|E] vyžadují [Concept('artifact','artefakt')|E] #V Koruna#!"
 court_maintenance.0011.regalia_needed.tooltip: "Některé [Concept('activity_options','možnosti aktivity')|E] při [Concept('coronation','korunovaci')|E] vyžadují [Concept('artifact','artefakt')|E] #V Regálie#!"
 court_maintenance.0011.artificier_crown.tooltip: "$court_maintenance.0011.crown_needed.tooltip$ Tvůj [GetCourtPositionType('court_artificer_court_position').GetName()] ji začne okamžitě vyrábět"
 court_maintenance.0011.local_artisan_crown.tooltip: "$court_maintenance.0011.crown_needed.tooltip$ Místní řemeslník ji začne okamžitě vyrábět"
 court_maintenance.0011.artificier_regalia.tooltip: "$court_maintenance.0011.regalia_needed.tooltip$ Tvůj [GetCourtPositionType('court_artificer_court_position').GetName()] je začne okamžitě vyrábět"
 court_maintenance.0011.local_artisan_regalia.tooltip: "$court_maintenance.0011.regalia_needed.tooltip$ Místní řemeslník je začne okamžitě vyrábět"
 court_maintenance.0011.a: "Ať spatří [Select_CString(ROOT.Char.IsFemale,'svou novou','svého nového')] [ROOT.Char.GetTitleTierName]!"
 court_maintenance.0011.a.regent: "Prohlédněme si palác."
 court_maintenance.0011.a.tooltip: "Vstoupíš do [Concept('royal_court','Královského dvora')|E]"
 court_maintenance.0011.b: "Jiné záležitosti vyžadují mou pozornost."
 court_maintenance.0011.b.tooltip: "Do svého [Concept('royal_court','Královského dvora')|E] můžeš vstoupit později"
 court_maintenance.0011.b.tooltip.ach: "Později budeš moci uspořádat [Concept('coronation','korunovaci')|E]"
 court_maintenance.0011.banner_tooltip: "[messenger.GetName] ti předá dva nové prapory, jeden pro tvůj rod a druhý pro tvou dynastii"
 court_maintenance.0011.banner_house_tooltip: "[messenger.GetName] ti předá nový prapor se znakem tvého rodu"
 court_maintenance.0011.banner_dynasty_tooltip: "[messenger.GetName] ti předá nový prapor se znakem tvé dynastie"
 court_maintenance.0011.coronation_discount: "Cena příští [Concept('coronation','korunovace')|E]: #p [gold_i]-50%#!"
 surprise_reaction: "překvapení"
 envy_reaction: "závist"
 scorn_reaction: "pohrdání"
 pride_reaction: "pýcha"
 gained_royal_court_toast: "Získán Královský dvůr"
 gained_royal_court_toast_desc: "Nyní máš [Concept('royal_court','Královský dvůr')|E]"
 court_maintenance.0012.t: "Znamení výjimečnosti"
 court_maintenance.0012.desc: "Jak roste věhlas mé dynastie, šíří se i povědomí o slavném znaku [ROOT.Char.GetDynasty.GetName]. \n\n"
 court_maintenance.0012.desc_illustrious: "Znak mého rodu je nyní znám po celém světě. Kancléři si ho zaznamenávají, děti se o něm učí a obchodníci ho obdivují i v zemích, kam [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] nikdy nevkročili."
 court_maintenance.0012.desc_masterwork: "Znak mého rodu je nyní všeobecně známý a řadí se po bok znaků velkých královských rodů oblasti i nejvyšší šlechty [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]."
 court_maintenance.0012.desc_famed: "Znak mého rodu je nyní dobře známý mezi šlechtou v celém kraji a má čestné místo mezi významnými [ROOT.Char.GetCulture.GetNameNoTooltip] rody."
 court_maintenance.0012.a: "Tak to má být."
 court_maintenance.0013.t: "Dynastický poklad"
 court_maintenance.0013.desc: "Je mou povinností hájit čest rodu [ROOT.Char.GetDynasty.GetName] a nést jeho prapor."
 court_maintenance.0013.desc_creator: "Osobní prapor [banner_scope.MakeScope.Var('banner_commissioner').Char.GetNamePossessiveRegnal] bude sám o sobě připomínat velikost tohoto rodu."
 court_maintenance.0013.desc_fallback: "Můj osobní prapor se bude dědit z generace na generaci a připomínat slávu všech mých potomků."
 court_maintenance.0013.a: "Může být jen jeden."
 court_maintenance.0013.tt: "Vlastnit lze pouze jeden prapor [Concept('dynasty','dynastie')|E]"
