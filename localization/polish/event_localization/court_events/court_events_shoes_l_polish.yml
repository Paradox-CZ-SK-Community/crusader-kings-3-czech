l_polish:
 court.placeholder_court_grandeur_loss: "Ztratíš #V 10#! [Concept('court_grandeur','velkoleposti dvora')|E]"
 court.1000.t: "Bujará prostopášnost"
 court.1000.desc.opening: "V bezpečí [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], kde má [child.Custom2('MyCharacterIntroduction', ROOT.Char)] postaráno o všechny své potřeby, neprojevuje příliš sklon k ničemu jinému než"
 court.1000.desc.drunkard: " trávit dny v krčmě a utápět se v nekonečných zásobách nápoje zvaného [child.Custom('RegionalAlcoholicDrink')]."
 court.1000.desc.hashishiyah: " trávit dny zalezle v nějakém koutě a omamovat se nekonečnou zásobou hašišových koláčků."
 court.1000.desc.rakish: " trávit dny v nevěstinci a „bavit“ nekonečný zástup „hostů“."
 court.1000.desc.ending: "\n\nCizí vyslanci si už tohoto chování začali všímat a já si nemohu pomoct: jaké zvěsti se asi o [child.GetFirstNameNoTooltip] šeptají u vzdálených dvorů..."
 court.1000.a: "Takové chování je nepřijatelné... Musí být [Select_CString(child.IsFemale,'potrestána','potrestán')]. A možná i [Select_CString(child.IsFemale,'ponížena','ponížen')]."
 court.1000.a.tt: "Když z [child.GetFirstName] uděláš odstrašující příklad, může to ostatní dvořany od podobného chování odradit"
 court.1000.b: "[child.GetFirstNameNoTooltip] potřebuje jen trochu odpovědnosti, něco důležitého, o co se starat!"
 court.1000.b.success: "Nové povinnosti zaměstnají [child.GetFirstNameNoTooltip]"
 court.1000.b.failure: "[child.GetFirstNameNoTooltip] se po práci dál oddává svým neřestem"
 court.1000.c: "Ha! [child.GetFirstNameNoTooltip] si tedy umí užívat lepších stránek života!"
 court.1000.c.tt: "Tvá shovívavost vůči [child.GetFirstName] může povzbudit ostatní dvořany k podobnému chování"
 court.1001.title: "[child.GetFirstName] propadá prostopášnosti"
 court.1010.t: "Popíjení za bílého dne"
 court.1010.desc: "O opileckých výstřelcích [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] se klevetilo už dřív, ale v poslední době je [courtier.GetFirstNameNoTooltip] posouvá na úplně novou úroveň.\n\nOpít se ještě dopoledne, odpadnout na nádvoří [courtier.Custom('ResidenceBuilding')], odpoledne se dopotácet do krčmy a druhý den se probudit ve stájích s kocovinou... Tak zvrhlé chování [courtier.GetFirstNameNoTooltip] je ostudou pro všechny, kdo žijí v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 court.1010.a: "[courtier.GetFirstNameNoTooltip] se nehodí k ničemu – a nikdy se to nezmění."
 court.1010.b: "[courtier.GetFirstNameNoTooltip] může vystřízlivět v žaláři!"
 court.1010.c: "Důrazná domluva snad přivede [courtier.GetFirstNameNoTooltip] k rozumu."
 court.1010.c.success: "[courtier.GetFirstNameNoTooltip] přestane pít... přinejmenším přes míru"
 court.1010.c.failure: "[courtier.GetFirstNameNoTooltip] své chování nezmění"
 court.1010.d: "Když ze sebe chce [courtier.GetFirstNameNoTooltip] dělat šaška, tak ať je šaškem!"
 court.1010.e: "Ať se ostatní smějí... [ROOT.Char.GetFaith.NegativeAfterLife], já se přidám!"
 court.1020.opening: "[foreign_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 court.1020.desc: "[Select_CString(foreign_ruler.IsFemale,'Dozvěděla','Dozvěděl')] jsem se, že se u vašeho dvora ukrývá uprchlík před zákonem, [fugitive.GetTitledFirstName]. Vydejte mi [fugitive.GetFirstNameNoTooltip], aby mohl být vykonán můj rozsudek, "
 court.1020.desc.forgive_this: "a já vám tento prohřešek odpustím."
 court.1020.desc.forgive_all: "a já vám odpustím tento prohřešek i ty předchozí."
 court.1020.desc.gold: "a já vám vaše obtíže vynahradím."
 court.1020.desc.opinion: "a na vaši spolupráci budu ještě dlouhá léta pamatovat."
 court.1020.a: "Budiž."
 court.1020.b: "[fugitive.GetFirstNameNoTooltip] je mým hostem – a pod mou ochranou."
 court.1020.c: "[fugitive.GetFirstNameNoTooltip]? Nikdo takový tu nepobývá..."
 court.1030.t: "Nevychovanost"
 court.1030.desc: "#EMP ~KŘŘŘK~#!\n\nJídelní síní se rozlehne hlasité říhnutí a veškerý hovor rázem utichne. [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se poplácá po břiše a zazubí se. „Ááách, lepší ven než dovnitř, jak vždycky říkával můj táta!“\n\nNěkolik dvořanů si nevěřícně vymění pohledy, než se [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] obrátí přímo ke mně a zvolá: „[ROOT.Char.GetTitleAsNameNoTooltip], tohle bylo naprosto nevhodné! Jistě se mnou souhlasíte?“"
 court.1030.a: "[chaplain.GetFirstNameNoTooltip] žije tak, jak velí [chaplain.GetFaith.HighGodName]. Podle toho se k [chaplain.GetFirstNameNoTooltip] také chovejme."
 court.1030.b: "[chaplain.Custom('GetActualBishopTitle')] nebo ne, [chaplain.GetFirstNameNoTooltip] se #EMP naučí#! slušnému chování..."
 court.1030.b.flavor: "...jinak skončí u koryta s prasaty!"
 court.1030.b.custom: "Každý další dvořan"
 court.1030.c: "Ale no tak, jako by si každý z nás někdy neulevil?"
