l_polish:
 hold_court.6000.t: "Prázdné sýpky"
 hold_court.6000.desc_intro: "Přede mnou stojí [6000_poor.Custom2('MyCharacterIntroduction', ROOT.Char)] se sklopenou hlavou.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [6000_province.GetNameNoTooltip] těžce zasáhla nedávná "
 hold_court.6000.desc_occupation: "nepřátelská okupace."
 hold_court.6000.desc_raiding: "vlna nájezdů a plenění."
 hold_court.6000.desc_epidemics: "epidemie."
 hold_court.6000.desc_winter: "krutá zima."
 hold_court.6000.desc_middle: "Lidé hladovějí, pole se nevzpamatovávají a dobytka už nemáme dost, abychom přežili!"
 hold_court.6000.desc_count: "[6000_count.Custom2('MyCharacterIntroduction', 6000_poor)|U] nemá peníze, nebo vůli nám pomoci."
 hold_court.6000.desc_ending: "Prosíme vás, zasáhněte a svou velkorysostí zachraňte své oddané poddané!“\n\n[6000_poor.GetNameNoTooltip] se hluboce ukloní a zmlkne."
 hold_court.6000.a: "Trocha zlata zmírní vaše utrpení."
 hold_court.6000.b: "Ulevím vám na daních, abyste se mohli vzpamatovat."
 hold_court.6000.c: "Znám pro tento úkol tu pravou osobu."
 hold_court.6000.c.tt: "[inspector.GetTitledFirstName] obdrží pověření oficiálního dohledu nad obnovou hrabství"
 hold_court.6000.d: "Jistě si poradíte sami."
 hold_court.6030.t: "Zpoza hranic"
 hold_court.6030.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], přicházím z náboženské komunity [6030_church.GetName] v [6030_border.GetName].\n\nPo staletí tam [Select_CString(6030_monk.IsFemale,'moudré a zbožné ženy','moudří a zbožní muži')] shromažďují a uchovávají tradiční vědomosti [6030_monk.GetCulture.GetName] kultury. Na znamení dobré vůle vám nabízím tuto vzácnou antologii textů [6030_monk.GetCulture.GetNameNoTooltip] kultury přeložených do vašeho jazyka.\n\nDoufáme, že ji přijmete a získáte nový pohled na náš lid.“"
 hold_court.6030.a: "S potěšením přijímám."
 hold_court.6030.b: "Prosím, zůstaň a nauč mě víc!"
 hold_court.6030.b.tt.2: "Všichni panovníci [6030_monk.GetCulture.GetName] kultury"
 hold_court.6030.c: "Nezajímá mě to. Zmiz mi z očí."
 hold_court.6030.d: "Vaše podřadná kultura si nezaslouží, aby byla uchována!"
 hold_court.6030.d.tt: "Všichni tví vazalové [6030_monk.GetCulture.GetName] kultury"
 hold_court.6040.t: "Ztracený poklad"
 hold_court.6040.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], zastupuji náboženskou komunitu [6040_church.GetName].\n\nKdyž jsme se přehrabovali v našem skromném archivu, narazili jsme na podivuhodnou knihu. Desky jsou zaprášené, vazba chatrná a stránky zažloutlé stářím, ale ukrývá ty nejneobvyklejší kresby a samotné písmo je nám zcela neznámé.\n\nJsme si jisti, že je na světě jediná svého druhu, dávno ztracená pokladnice vědomostí, skutečný poklad! Proto vám ji nabízíme. Možná je to původní opis poslední vůle, kterou zanechal [6040_monk.GetFaith.HighGodName], nebo snad paměti z dob stvoření světa!“"
 hold_court.6040.a: "Díky, přidám ji do své sbírky."
 hold_court.6040.b: "#EMP Fascinující!#! Zavolejte mého antikváře!"
 hold_court.6040.b.tt: "Tvůj antikvář si neví rady"
 hold_court_6040_b_fake: "Kniha je mizerně vyrobený padělek — bezcenný a k ničemu"
 hold_court_6040_b_generic: "Kniha je skutečně stará, ale jde jen o [6040_monk.Custom('GetOldBook')]."
 hold_court_6040_b_clueless: "Ani tvůj antikvář nedokáže objasnit původ ani účel knihy"
 hold_court_6040_b_artifact: "Kniha je starobylým a vzácným opisem mistrovského díla!"
 hold_court.6040.c: "Ukažte mi ji, #EMP hned teď#!!"
 hold_court.6040.c.tt: "Je to mizerně vyrobený padělek!"
 hold_court.6040.c.tt.2: "Kniha pro tebe zůstává záhadou"
 hold_court.6040.c.tt.3: "Je to pěkný rukopis, ale nic výjimečného"
 hold_court.6040.c.tt.4: "Je to vzácný a cenný text"
 hold_court_6040_c_clueless: "Písmo ani obsah knihy nedokážeš pochopit"
 hold_court.6040.d: "[ROOT.Char.GetFaith.DevilName] za tím musí stát! SPALTE TO!"
 hold_court.6040.e: "Koho zajímají nějaké knihy?"
 hold_court.6050.t: "Svatý hrob"
 hold_court.6050.desc: "Osoba přede mnou vypadá, jako by měla každou chvíli vybuchnout nadšením.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Ty zázraky! Ta svatost! Dostalo se nám #EMP POŽEHNÁNÍ#!!“\n\nNadšené blábolení [6050_pop.GetNameNoTooltip] je zmatené, ale nakonec pochopím podstatu: jde o žádost, abych podpořil kult [Select_CString(6050_holy.IsFemale,'místní světice, která nedávno zemřela','místního světce, který nedávno zemřel')] v [6050_tomb.GetNameNoTooltip]. [6050_holy.GetFirstName] za života [Select_CString(6050_holy.IsFemale,'proslula','proslul')] zázraky, zejména [6050_holy.Custom('GetMiracle1')] a [6050_holy.Custom('GetMiracle2')]. Hrob, kde [6050_holy.GetFirstNameNoTooltip] odpočívá, láká oddané návštěvníky z celého panství."
 hold_court.6050.desc_hof: "\n\nJako [Concept('head_of_faith','hlava víry')|E] mám právo rozhodnout, zda tento kult odsoudím, nebo podpořím."
 hold_court.6050.a: "[6050_holy.GetFirstNameNoTooltip] se dočká úcty, kterou si zaslouží."
 hold_court.6050.b: "Už o tom vím. [Select_CString(6050_holy.IsFemale,'Světice ke mně přišla','Světec ke mně přišel')] ve snu."
 hold_court.6050.c: "Tu rouhačskou hloupost okamžitě vymýtím!"
 hold_court.6050.d: "Pověry sedláků mě nezajímají."
 tougher_to_convert: "Silná náboženská komunita"
 tougher_to_convert_desc: "Náboženská identita tohoto hrabství byla nedávno posílena, takže je obtížnější je konvertovat.\n\n#N -25%#! Rychlost konverze víry"
 easier_to_convert: "Oslabená náboženská komunita"
 easier_to_convert_desc: "Náboženská identita tohoto hrabství byla nedávno oslabena, takže je náchylnější k přijetí nových věr.\n\n#P +25%#! Rychlost konverze víry"
 easier_to_culture_convert: "Oslabená náboženská komunita"
 easier_to_culture_convert_desc: "Náboženská identita tohoto hrabství byla nedávno oslabena, takže je náchylnější k přijetí nových věr.\n\n#P +25%#! Rychlost kulturní konverze"
 hold_court.6060.t: "Výhodná nabídka"
 hold_court.6060.desc: "[6060_rich.Custom2('MyCharacterIntroduction', ROOT.Char)|U] stojí přede mnou s nadějným výrazem ve tváři.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],"
 hold_court.6060.desc_merchant: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], dovolte mi, abych se [Select_CString(6060_rich.IsFemale,'představila','představil')]: jmenuji se [6060_rich.GetTitledFirstName] a jsem [Select_CString(6060_rich.IsFemale,'bohatá obchodnice','bohatý obchodník')] z hlavního města.\n\n"
 hold_court.6060.desc_ending: "„[Select_CString(6060_rich.IsFemale,'Nemohla','Nemohl')] jsem si nevšimnout, že finance panství na tom v poslední době nejsou nejlépe. Samozřejmě je spravujete znamenitě, ale možná by se vám přesto hodilo nějaké zlato navíc.\n\nJsem [Select_CString(6060_rich.IsFemale,'ochotna','ochoten')] od vás odkoupit menší osadu výměnou za štědrou sumu zlata. Souhlasíte?“"
 hold_court.6060.a: "Dobrá. [6060_offer.GetNameNoTooltip] je tvoje."
 hold_court.6060.b: "Vezmi si tu půdu a postav na ní město."
 hold_court.6060.b.tt.success: "[6060_rich.GetFirstNameNoTooltip] souhlasí, že zaplatí víc"
 hold_court.6060.b.tt.failure: "[6060_rich.GetFirstNameNoTooltip] trvá na původní nabídce a ty vypadáš jako chamtivý hlupák"
 hold_court.6060.c: "Tvé zlato nepotřebuji."
 character_title_cannot_be_revoked_tt: "Tento titul nebudeš moci 25 let odejmout."
 protected_from_revocation.tt: "Tituly této postavy jsou chráněny před odejmutím"
 hold_court.6070.t: "Rodící se spojenectví"
 hold_court.6070.desc: "„[ROOT.Char.GetLadyLord], jmenuji se [6070_embassy.GetTitledFirstName] a jsem [Select_CString(6070_embassy.IsFemale,'vyslankyně','vyslanec')] vašeho spojence [6070_sender.GetTitledFirstName]. [6070_sender.GetTitledFirstNameNoTooltip] vám posílá srdečné pozdravy a nabídku.\n\n[6070_sender.GetTitledFirstNameNoTooltip] si vašeho přátelství cení nade vše, a proto vám na znamení dobré vůle posílá své dítě, [6070_child.Custom('GetDaughterSon')] [6070_child.GetFirstName], abyste je [Select_CString(ROOT.Char.IsFemale,'vychovala','vychoval')] podle svého uvážení.\n\n[6070_sender.GetTitledFirstNameNoTooltip] doufá, že toto gesto posílí vaše spojenectví, a věří, že [6070_child.GetFirstNameNoTooltip] bude v těch nejlepších rukou.“"
 hold_court.6070.a: "Tvou nabídku s radostí přijímám."
 hold_court.6070.b: "Samozřejmě! [6070_friend.GetFirstNameNoTooltip], proveď [6070_child.GetFirstNameNoTooltip] po dvoře!"
 hold_court.6070.c: "Přijímám — ale na oplátku očekávám zasnoubení."
 hold_court.6070.d: "Promiň, ale tuto odpovědnost teď nemohu přijmout."
 hold_court.6070.e: "To dítě je pověstná pohroma — na mě [6070_child.GetFirstNameNoTooltip] nehodíš!"
 hold_court.6080.t: "Usazení lidu [6080_culture.GetNameNoTooltip] kultury"
 hold_court.6080.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], zastupuji lid [6080_culture.GetNameNoTooltip] kultury z [6080_county.GetNameNoTooltip],“ prohlašuje [6080_count.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Jsme oddaní a věrní poddaní, ale naše země je chudá, zaostalá a řídce osídlená. Prosíme, dovolte nám ji znovu osídlit a spravovat podle našich tradic!\n\nPod vaší laskavou ochranou může naše země ještě vzkvétat a vy získáte nového věrného vazala!“"
 hold_court.6080.a: "Dobrá. Tvůj lid může [6080_county.GetNameNoTooltip] znovu osídlit."
 hold_court.6080.a.tt: "Tento titul nebudeš moci odejmout, dokud [6080_count.GetFirstNameNoTooltip] nezemře"
 hold_court.6080.b: "Já vím nejlépe, co je pro [6080_county.GetNameNoTooltip] dobré."
 hold_court.6080.c: "Tvůj lid bude mít v [6080_province.GetNameNoTooltip] vždy bezpečné útočiště."
 hold_court.6090.t: "Rozmáhající se kacířství"
 hold_court.6090.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], s lítostí vám musím oznámit, že náboženská situace v mých zemích se zcela vymkla kontrole...\n\n[Select_CString(6090_vassal.IsFemale,'Snažila','Snažil')] jsem se svým poddaným ukázat světlo naší pravé víry, ale příliš mnoho z nich stále lpí na svých mylných přesvědčeních! Prosím vás, využijte svou autoritu a moc a pomozte mi!“"
 hold_court.6090.desc.almoner: "\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U] — smím-li,“ vloží se do hovoru [high_almoner.Custom2('MyCharacterIntroduction', ROOT.Char)], „možná by je přesvědčila štědrá almužna rozdaná těm #EMP správným#! věřícím?“"
 hold_court.6090.desc.executioner: "\n\n„Vsadím se, že potřebují jen #EMP pevnou ruku!#!“ pronese [executioner.Custom2('MyCharacterIntroduction', ROOT.Char)] s temným úsměvem."
 hold_court.6090.a: "[court_chaplain.GetFirstNameNoTooltip], podívej se, co s tím dokážeš udělat."
 hold_court.6090.b: "[high_almoner.GetFirstNameNoTooltip], zorganizuj místní almužny."
 hold_court.6090.c: "Pokojné soužití je vždy nejlepší řešení."
 title_granted_to_local_leader_tt: "[6090_main_county.GetName] získá místní představitel [6090_main_county.GetCountyData.GetFaith.GetName]. Budeš na tuto postavu mít [Concept('hook','páku')|E]."
 hold_court.6090.d: "[executioner.GetFirstNameNoTooltip], udělej z několika nevěřících odstrašující příklad."
 hold_court.6090.e: "To zní jako tvůj problém, ne můj."
 hold_court.6100.t: "Země ve válce"
 hold_court.6100.desc: "Přede mnou stojí [6100_vassal_1.Custom2('MyCharacterIntroduction', ROOT.Char)] a [6100_vassal_2.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ začne [6100_vassal_1.GetFirstNameNoTooltip], „válka mezi mnou a [6100_vassal_2.GetTitledFirstNameNoTooltip] se vleče kvůli tvrdošíjnému odmítání rozumu z druhé strany, a proto přicházíme požádat vás o zprostředkování.“\n\n„Takže teď je to #EMP moje vina#!!?“ skočí do řeči [6100_vassal_2.GetFirstNameNoTooltip]. „Ty neuvěřitelný pse! [ROOT.Char.GetLadyLord], vysvětlete to [6100_vassal_1.GetFirstNameNoTooltip]!“"
 hold_court.6100.desc.jester: "\n\n[jester.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zbystří: „Óóó, já #EMP miluju#! malicherné hádky! Nejlépe se k nim hodí... VTIPNÉ RÝMY!“"
 hold_court.6100.a: "Každý přece vidí, že [6100_vassal_1.GetFirstNameNoTooltip] má pravdu."
 hold_court.6100.b: "Postoj, který zastává [6100_vassal_2.GetFirstNameNoTooltip], je oprávněný."
 hold_court.6100.c: "Okamžitě ukončete boje, nebo..."
 hold_court.6100.d: "Mám těch vašich nesmyslů dost. Oba do žaláře!"
 hold_court.6100.e: "Vyřešme to jako čestní válečníci."
 hold_court.6100.e.tt: "Oba soupeři rozhodnou válku soubojem"
 hold_court.6100.f: "Haha, dobrý nápad! Vy dva si vyměňte pár rýmovaných urážek!"
 hold_court.6100.f.1: "Jsi ničema od živého plotu,\npatříš leda tak do brlohu,\nnenávidím tě víc než dost,\\na tak zalez do... boudy pro kost...?"
 hold_court.6100.f.1.t: "Řehoníš se chabým pokusům, které předvádí [6100_vassal_1.GetShortUIName]"
 hold_court.6100.f.2: "Ty nevychovaný burane,\nani děvče z tebe strach nedostane,\npoženu tě odsud hned,\nprotože nejsi chytrý... med...?"
 hold_court.6100.f.2.t: "Burácíš smíchy nad příšernými verši, které předvádí [6100_vassal_2.GetShortUIName]"
 hold_court.6100.g: "Obtěžujete mě svými malichernými hádkami. Odejděte."
 hold_court.6100.g.tt: "Válka zuří dál"
 hold_court.6101.t: "[sc_victor.GetTitledFirstName|U] vítězí v souboji"
 hold_court.6101.tt: "[sc_victor.GetTitledFirstName|U] je [Select_CString(sc_victor.IsFemale,'prohlášena','prohlášen')] vítězem války"
 hold_court.6110.t: "Zpustošená země"
 hold_court.6110.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jsem jen prostý sedlák, ale prosím vás o pomoc! Zemi mého lidu zpustošila dlouhá a krvavá válka mezi vašimi vazaly [6110_vassal_1.GetTitledFirstName] a [6110_vassal_2.GetTitledFirstName]!\n\nPole hoří, dobytek je vybíjen a sedláci umírají! Prosím, zastavte to krveprolití!“"
 hold_court.6110.desc.almoner: "\n\n„Kéž [almoner.GetFaith.HighGodName] zmírní vaše utrpení svým milosrdenstvím a kéž vám pomůže štědrost [almoner.GetFaith.HighGodNamePossessive] dětí,“ tiše navrhne [almoner.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 hold_court.6110.a: "Válka skončila. Vítězem je [6110_vassal_1.GetTitledFirstNameNoTooltip]."
 hold_court.6110.b: "Obě strany musí být okamžitě zastaveny!"
 hold_court.6110.c: "Tahle válka je nesmysl. Vítězem je [6110_vassal_2.GetTitledFirstNameNoTooltip]."
 hold_court.6110.e: "Sedlák se nemá plést do záležitostí šlechty."
 6110_custom_every_realm_1: "Všechna hrabství v [6110_vassal_1.GetShortUINamePossessive] panství"
 6110_custom_every_realm_2: "Všechna hrabství v [6110_vassal_2.GetShortUINamePossessive] panství"
 hold_court.6120.t: "Den pravdy"
 hold_court.6120.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] se ujme slova. „Mám nápad, jak zlepšit výběr daní.“\n\n„Můžete vyslat zeměměřiče, aby se vašich poddaných vyptali na každý majetek: jak se jmenuje, komu patří, jak je rozlehlý a cenný a kolik na něm žije lidí a zvířat!“"
 hold_court.6120.desc.seneschal: "\n\n„Prosím, [ROOT.Char.Custom('FormOfAddressForLiege')], dovolte mi na celou záležitost dohlédnout,“ ozve se [seneschal.Custom2('YourCharacterIntroduction', ROOT.Char)|U]."
 hold_court.6120.desc.swans: "\n\n„A já dodám seznam všech labutí ve vašich zemích! Moje nejoblíbenější je [keeper_swans.Custom('GetSwanName')]! [Select_CString(keeper_swans.IsFemale,'Říkala','Říkal')] jsem vám už, jak hebké a nadýchané má bříško? Včera byla na řadě naše procházka a...“ Rozhodnu se [keeper_swans.Custom2('MyCharacterIntroduction', ROOT.Char)] ignorovat, zatímco dál blábolí o tom zatraceném ptákovi."
 hold_court.6120.desc.jester: "\n\n„Ale čísla jsou #EMP tááák nudná!#!“ stěžuje si [jester.Custom2('MyCharacterIntroduction', ROOT.Char)]. „Raději si zatancujme!“"
 hold_court.6120.a: "Dobrá, pokračujte v soupisu."
 hold_court.6120.a.tt: "Soupis začíná. Jeho dokončení potrvá několik měsíců"
 hold_court.6120.b: "[seneschal.GetFirstNameNoTooltip], postarej se o to."
 hold_court.6120.c: "Jestli chci zlepšit výběr daní, můžu prostě požadovat #EMP vyšší#! daně..."
 6120_every_vassal: "Každý z tvých vazalů"
 hold_court.6120.d: "Nestojí to za to."
 hold_court.6120.e: "Přesně tak, vytancujme ta zlá čísla z hlavy!"
 swan_name_illfated: "Nešťastnice"
 swan_name_rose: "Růže"
 swan_name_honky: "Kejh Kejh"
 swan_name_honker: "Kejhoun"
 swan_name_hugo: "Hugo"
 swan_name_leda: "Léda"
 swan_name_anklebiter: "Kotníkožrout"
 swan_name_angrynipper: "Vzteklozob"
 swan_name_odette: "Odette"
 hold_court.6121.t: "Den pravdy: Soupis dokončen"
 hold_court.6121.desc: "„Je hotovo, [ROOT.Char.Custom('FormOfAddressForLiege')],“ prohlásí [6121_responsible.Custom2('MyCharacterIntroduction', ROOT.Char)] a ukloní se přede mnou.\n\n„Před několika měsíci jste nařídili soupis všech svých zemí. Nyní je dokončen a údaje o vlastnictví a hodnotě půdy jsou shromážděny v této knize. Dokud bude tento popis odpovídat skutečnosti, bude výběr daní v celém vašem panství efektivnější!“"
 hold_court.6121.a: "Výborná práce, [6121_responsible.GetFirstNameNoTooltip]!"
 hold_court.6130.t: "Katastr"
 hold_court.6130.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ ujme se slova [6130_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)], „navrhuji provést katastrální průzkum všech hrabství, která vlastníte.\n\nLepší znalost a zmapování vašich zemí jistě zvýší jejich prosperitu!“"
 hold_court.6130.a: "Dobrá, [6130_proposer.GetFirstNameNoTooltip]. Můžeš začít."
 hold_court.6130.a.tt: "[6130_proposer.GetFirstNameNoTooltip] zahájí práce na katastrálním průzkumu. Dokončení potrvá několik měsíců a poté získáš následující odměny:"
 hold_court.6130.d: "Mapy se přeceňují."
 hold_court.6131.t: "Katastr: Dokončeno!"
 hold_court.6131.desc: "[6131_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se přede mnou krátce ukloní a se spokojeným úsměvem vysvětluje: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], možná si vzpomínáte, že jste před několika měsíci [Select_CString(ROOT.Char.IsFemale,'investovala','investoval')] značnou sumu zlata do katastru svých hrabství. \n\nOsobně jsem na vše [Select_CString(6131_proposer.IsFemale,'dohlížela','dohlížel')] a mohu hrdě prohlásit, že práce je hotová!“"
 hold_court.6131.desc_tutor: "Také mě těší podrobná zpráva o pokrocích [6130_tutored.GetTitledFirstName] ve vzdělávání pod vedením [6130_helper.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 hold_court.6131.desc_hunt: "\n\nTaké mě těší podrobná zpráva o významné pomoci, kterou [Select_CString(6130_helper.IsFemale,'poskytla','poskytl')] [6130_helper.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 hold_court.6131.desc_dead: "\n\nBohužel [6130_helper.GetTitledFirstName] [Select_CString(6130_helper.IsFemale,'zemřela dříve, než mohla spatřit dokončení katastru, na jehož vzniku se měla podílet','zemřel dříve, než mohl spatřit dokončení katastru, na jehož vzniku se měl podílet')]."
 hold_court.6131.a: "Dobře utracené zlato!"
 all_realm_county: "Každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E]"
 hold_court.6140.t: "Neskladný dar"
 hold_court.6140.desc: "Celý trůnní sál ztichne, když [6140_gifter.Custom2('MyCharacterIntroduction', ROOT.Char)] triumfálně vstoupí dovnitř. Za ním se lopotí dva služebníci, kteří vlečou #EMP spoutaného [ROOT.Char.Custom('GetAnimalType')]#!.\n\n[6140_gifter.GetFirstNameNoTooltip] se hrdě usměje a zvolá: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], přináším vám dar hodný nejmocnějšího panovníka na světě! Tato velkolepá šelma byla ulovena v [6140_province.GetTerrain.GetNameNoTooltip] v [6140_province.GetCounty.GetName] a nyní vám ji nabízím jako symbol své oddanosti a vaší nepřekonatelné moci!“"
 6140_bear: "medvěd"
 6140_tiger: "tygr"
 6140_lion: "lev"
 hold_court.6140.a: "Děkuji, nový koberec se mi opravdu hodil."
 hold_court.6140.a.tt: "Zvíře bude zabito kvůli kožešině."
 hold_court.6140.artifact_tt: "Získáš kožešinu jako [Concept('court_artifact','dvorní artefakt')|E]"
 hold_court.6140.artifact_toast: "Kožešina získána"
 hold_court.6140.b: "Vskutku: mocná šelma pro mocného panovníka!"
 hold_court.6140.c: "Můj šašek se na ní naučí jezdit! Viď, [jester.GetFirstNameNoTooltip]?"
 hold_court.6140.c.success: "Jde to!"
 hold_court.6140.c.success.tt: "[jester.GetFirstNameNoTooltip] se naučí jezdit na darované šelmě"
 hold_court.6140.c.soft_failure: "[jester.GetFirstNameNoTooltip] spadne na zadek"
 hold_court.6140.c.soft_failure.tt: "Všichni se smějí, protože pokus [jester.GetFirstNameNoTooltip] skončil fiaskem"
 hold_court.6140.c.middle_failure: "[jester.GetFirstNameNoTooltip] utrží zranění"
 hold_court.6140.c.middle_failure.tt: "[jester.GetFirstNameNoTooltip] neuspěje"
 hold_court.6140.c.hard_failure: "[jester.GetFirstNameNoTooltip] zemře!"
 hold_court.6140.c.hard_failure.tt: "[jester.GetFirstNameNoTooltip] žalostně selže..."
 hold_court.6140.d: "Jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že moji #EMP hosté#! v žaláři si ji #EMP zamilují#!..."
 hold_court.6140.e: "Vypadá to nebezpečně a smrdí to! Odveďte to pryč."
 6140_every_courtier_or_guest: "Každý dvořan nebo host u tvého dvora"
 6140_every_prisoner: "Každý vězeň v tvých celách"
 hold_court.6150.t: "Konec se blíží!"
 hold_court.6150.desc: "Jakmile na [6150_preacher.GetNameNoTooltip] přijde řada, [Select_CString(6150_preacher.IsFemale,'rozrušená žena','rozrušený muž')] přede mnou vykřikne: „#EMP KONEC SE BLÍŽÍ!#!\n\nZnamení jsou jasná a všude kolem nás:"
 hold_court.6150.desc_county: "lidé z [6150_county.GetName] to vědí až příliš dobře — "
 hold_court.6150.desc_unsafety: "nepokoje, bandité, zloději, násilí a mizející spravedlnost mezi lidmi!"
 hold_court.6150.desc_nature: "neúroda, kobylky zaplavující pole, nekonečná zima, povodně a Mor kráčející mezi námi!"
 hold_court.6150.desc_looting: "především barbaři před našimi branami, kteří plení naši úrodu, zabíjejí naše lidi, vypalují naše města a šíří nemoci a hlad!"
 hold_court.6150.desc_infidels: "nevěřící jsou všude a podrývají nás jak zpoza hranic, tak uvnitř našeho vlastního panství!"
 hold_court.6150.desc_lost_hgw: "co může být jasnějším znamením než porážka vojsk, které vedl sám [ROOT.GetCharacter.GetFaith.HighGodName], rukama nevěřících?"
 hold_court.6150.desc_visions: "blesky z čistého nebe, ptáci táhnoucí v nesprávnou roční dobu, zpěvavé hlasy v noci, mluvící hadi!"
 hold_court.6150.desc_monk: "všechna data i výpočty souhlasí!"
 hold_court.6150.desc_fallback: "násilí, zkaženost, neřesti — věřící zapomněli na to, jak velký je [ROOT.GetCharacter.GetFaith.HighGodName]!"
 hold_court.6150.desc_christianism: "\n\nSoudný den je tady!"
 hold_court.6150.desc_buddhism: "\n\nČas Maitréji nadešel!"
 hold_court.6150.desc_islam: "\n\nPoslední soud se blíží!"
 hold_court.6150.desc_judaism: "\n\nVálka Goga a Magoga je tady!"
 hold_court.6150.desc_germanic: "\n\nRagnarök je tady!"
 hold_court.6150.desc_hinduism: "\n\nKalki přichází!"
 hold_court.6150.desc_zoroastrianism: "\n\nFrashokereti začalo!"
 hold_court.6150.desc_religion_fallback: "\n\nSvět, jak jej známe, se chýlí ke konci!"
 hold_court.6150.desc_solution: "\n\nExistuje jediný způsob, jak se zachránit: "
 hold_court.6150.desc_celibacy: "cudnost a čistota! Zřekněte se pokušení těla!"
 hold_court.6150.desc_burn: "spalte #EMP všechny#! nevěřící!"
 hold_court.6150.desc_alcohol: "zřekněte se všech neřestí, počínaje nestřídmostí v pití a jídle!"
 hold_court.6150.desc_reclusive: "odvrhněte svět a jeho pokušení!"
 hold_court.6150.desc_flagellant: "umrtvujte tělo a prolévejte krev pro svou spásu!"
 hold_court.6150.desc_eating: "očistěte srdce tím, že očistíte tělo! S plným břichem spásy nedosáhnete!"
 hold_court.6150.desc_end: "\n\nČiňte pokání hned!! Neboť ten den se blíží!!“"
 hold_court.6150.a: "Pro spásu musíme udělat cokoli!"
 hold_court.6150.a.tt: "Tyto kajícné praktiky už dobře znáš."
 hold_court.6150.a.wrath: "Nařídíš úplnou očistu oblasti [6150_heretics_p.GetName] od všech hříšníků"
 hold_court.6150.b: "[Select_CString(6150_preacher.IsFemale,'Moudrá','Moudrý')] [6150_preacher.GetFirstNameNoTooltip], zůstaň a ukaž mi cestu!"
 hold_court.6150.c: "Nesmysl! Upalte toho blábolícího kacíře!"
 hold_court.6150.d: "Odveďte mi toho hlupáka z očí."
 hold_court.6160.t: "Prázdná pokladnice"
 hold_court.6160.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ začne zkroušeně [6160_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)], „poslední doba byla pro mé panství opravdu těžká. Na všech stranách vznikaly mimořádné výdaje a má pokladnice je bohužel prázdná...\n\nMrzí mě, že k tomu musím sáhnout, ale [Select_CString(6160_vassal.IsFemale,'rozhodla','rozhodl')] jsem se požádat o vaši štědrost a pomoc se splacením mých dluhů."
 hold_court.6160.desc_friend: "\n\nVe jménu pout, která nás spojují, prosím, pomozte mi!“"
 hold_court.6160.desc_hook: "\n\nPokud tak učiníte, budu laskavost, kterou mi dlužíte, považovat za splacenou.“"
 hold_court.6160.desc_fallback: "\n\nNa vaši štědrost v době mé nouze nezapomenu!“"
 hold_court.6160.a: "Dobrá — ale budeš mi něco dlužit!"
 hold_court.6160.b: "Dobrá — teď už ti nic nedlužím."
 hold_court.6160.c: "To je to nejmenší, co pro tebe mohu udělat!"
 hold_court.6160.d: "Jak učí můj vrchní almužník, dobročinnost je cestou zbožných."
 hold_court.6160.e: "Dluhy svědčí o špatné správě. [seneschal.GetFirstNameNoTooltip], pomoz s tím!"
 hold_court.6160.f: "Promiň, nemám žádné peníze nazbyt."
 hold_court.6170.t: "Potupné uvěznění"
 hold_court.6170.desc: "[6170_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] stojí přede mnou se znepokojeným výrazem. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], důvodem mého příchodu je [6170_relative.Custom2('MyCharacterIntroduction', 6170_vassal)].\n\n[6170_relative.GetFirstNameNoTooltip] [Select_CString(6170_relative.IsFemale,'byla potupně uvězněna','byl potupně uvězněn')] z nicotných a absurdních důvodů. Uvěznění nařídil [6170_rival.Custom2('YourCharacterIntroduction', 6170_vassal)]. Srdce mi krvácí při pomyšlení na bídné podmínky, které musí [6170_relative.GetFirstNameNoTooltip] snášet...\n\nProsím, prokažte milosrdenství a nařiďte propuštění!“"
 hold_court.6170.a: "Ať je [6170_relative.GetFirstNameNoTooltip] [Select_CString(6170_relative.IsFemale,'propuštěna','propuštěn')]!"
 hold_court.6170.b: "[6170_rival.GetFirstNameNoTooltip] jistě [Select_CString(6170_rival.IsFemale,'měla','měl')] dobrý důvod k uvěznění [6170_relative.GetFirstNameNoTooltip]."
 hold_court.6170.c: "Dopřeji [6170_relative.GetFirstNameNoTooltip] jen malou úlevu."
 hold_court.6170.d: "Pryč s hlavou, pryč s problémem!"
 hold_court.6170.e: "Vaše spory mě opravdu nezajímají."
 hold_court.6190.t: "Stín v noci"
 hold_court.6190.desc: "K mému trůnu přistoupí [Select_CString(6190_local.IsFemale,'žena','muž')], na první pohled prostého původu. „[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ začne [6190_local.GetNameNoTooltip], „zastupuji místní komunitu [capital.GetNameNoTooltip].\n\nV posledních několika měsících z našich hřbitovů záhadně mizí těla! Všechna byla vykopána a nezůstala po nich ani stopa. Zpočátku jsme se obávali divokých zvířat nebo působení temných sil, ale pak jsme vašeho $court_physician_court_position$ [physician.GetTitledFirstName] přistihli přímo při činu, jak odváží mrtvé pro své pokusy!\n\nProsím, učiňte tomuto rouhání přítrž!“"
 hold_court.6190.a: "Studium lidského těla je smutná nutnost."
 hold_court.6190.b: "Proč jsi mě [Select_CString(physician.IsFemale,'nepozvala','nepozval')], [physician.GetFirstNameNoTooltip]?!"
 hold_court.6190.c: "Čerstvá — #EMP živá#! — těla jsou pro pokusy mnohem lepší..."
 hold_court.6190.d: "#EMP STRÁŽE!#! Zatkněte [Select_CString(physician.IsFemale,'vykradačku hrobů','vykradače hrobů')]!"
 hold_court.6190.e: "[physician.GetFirstNameNoTooltip], prostě to odřízni."
 hold_court.6210.t: "Země cizinců"
 hold_court.6210.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], s lítostí vám musím oznámit, že už jsem na pokraji sil!“ [6210_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] je očividně zoufalý.\n\n„Lidem, kterým mám vládnout, vůbec nerozumím. Mají směšné zvyky a #EMP příšerný#! vkus, pokud jde o jídlo! Veškeré mé dosavadní úsilí bylo marné — zdá se, že z nich zkrátka nelze udělat pořádné nevolníky.\n\nObávám se, že teď už zbývá jediné řešení: rázný zásah shora.“"
 hold_court.6210.a: "[steward.GetFirstNameNoTooltip], ukaž jim naše způsoby."
 hold_court.6210.b: "Ukažme jim naši velikost, pak změní názor!"
 hold_court.6210.b.tt: "Pošleš svého $royal_architect_court_position$, aby rozvinul infrastrukturu hrabství."
 hold_court.6210.c: "Respektujeme tradice všech svých poddaných."
 hold_court.6210.d: "Dokud platí daně, je mi to jedno."
 hold_court.6230.t: "#EMP Obrovský#! problém"
 hold_court.6230.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], smím vás na chvíli vyrušit...?“ ozve se [6230_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. „[6230_province.GetName] v posledních týdnech trápí jeden poněkud #EMP těžkopádný#! problém...\n\nVíte, celé hrabství pustoší stádo #EMP naprosto nezvladatelných#! slonů, které za sebou zanechává zkázu a občas i mrtvé! Jejich děsivé troubení nám zní v uších ve dne v noci — slyším ho snad ještě teď!“ [6230_vassal.GetNameNoTooltip] začne vydávat nevhodné #EMP troubení#!. „Prosím, [ROOT.Char.Custom('FormOfAddressForLiege')], pošlete pomoc!“"
 hold_court.6230.a: "Vezmi si zlato a všechno obnov."
 hold_court.6230.b: "Pošlu někoho, aby ty bestie zastavil."
 hold_court.6230.b.success: "Tví lovci pochytají divoké slony"
 hold_court.6230.b.success.tt: "Sloni ochočeni"
 hold_court.6230.b.failure: "Sloni dál řádí"
 hold_court.6230.b.failure.tt: "Řádění slonů"
 hold_court.6230.c: "Slon, kůň, to je skoro totéž... [m_horse.GetFirstNameNoTooltip], postarej se o to!"
 hold_court.6230.c.success: "Tvůj $master_of_horse_court_position$ pochytá slony"
 hold_court.6230.d: "$hinduism_good_god_ganesh$ je vede."
 hold_court.6230.e: "Na takové nesmysly nemám čas."
 hold_court.6230.f: "Zabte všechny ty odporné bestie."
