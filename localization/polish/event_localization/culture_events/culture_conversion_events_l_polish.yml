l_polish:
 culture_conversion.0001.t: "Přijmout [new_culture.GetNameNoTooltip] kulturu"
 culture_conversion.0001.desc: "Když oděv i zvyky odpovídají [new_culture.GetName] kultuře a v hlavním městě žijí [new_culture.GetCollectiveNoun], není divu, že [converting_character.Custom2('MyCharacterIntroduction', ROOT.Char)] už nepovažuje [old_culture.GetName] kulturu za svou, ale [new_culture.GetName] kulturu ano!"
 culture_conversion.0001.a: "Věci se mění a lidé s nimi."
 culture_conversion.0001.b: "Opouštět naše staré tradice není dobrý nápad."
 culture_conversion.0001.c: "Všichni bychom měli jít s dobou!"
