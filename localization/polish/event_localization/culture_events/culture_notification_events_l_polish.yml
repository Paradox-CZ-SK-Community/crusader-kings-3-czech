l_polish:
 culture_notification.0010.t: "Opuštěná tradice"
 culture_notification.0010.desc: "[this_player.GetCulture.GetName] [Concept('culture','kultura')|E] upustila od [Concept('tradition','tradice')|E] [tradition.GetName]"
 culture_notification.0011.t: "Přijatá tradice"
 culture_notification.0011.desc: "[this_player.GetCulture.GetName] [Concept('culture','kultura')|E] přijala [Concept('tradition','tradici')|E] [tradition.GetName]"
 culture_notification.1001.t: "Vznikla [new_culture.GetNameNoTooltip|V] kultura"
 culture_notification.1001.desc: "Přičiněním [founder.GetTitledFirstName] se [parent_1.GetName|l] kultura a [parent_2.GetName|l] kultura spojily a daly vzniknout nové [Concept('hybrid_culture','hybridní kultuře')|E], která se označuje jako [new_culture.GetName|V]."
 culture_notification.1011.t: "Zrodila se [new_culture.GetNameNoTooltip|l] kultura"
 culture_notification.1011.intro: "Léta výměny stále víc sbližovala [parent_1.GetName] a [parent_2.GetName] kulturu — natolik, že zapustilo kořeny něco nového: lid, jehož kultura se nazývá [new_culture.GetName].\n\n"
 culture_notification.1011.blend: "Prolínání je patrné na první pohled. Zachovávají tradici [tradition_1.GetName] z [parent_1.Custom('CZ_Adjective_ee')] kultury spolu se zvykem [tradition_2.GetName] z [parent_2.Custom('CZ_Adjective_ee')] kultury. Společně vymezují tento nový lid."
 culture_notification.1011.blend_fallback: "Ani jedna původní kultura nepřevažuje – nový [new_culture.Custom('CZ_Adjective_yy')] způsob života oba světy hladce propojuje."
 culture_notification.1011.outro.other: "$culture_notification.1111.outro.other$"
 culture_notification.1011.outro.founder: "$culture_notification.1111.outro.founder$"
 culture_notification.1011.a.other: "$culture_notification.1111.a.other$"
 culture_notification.1011.a.founder: "$culture_notification.1111.a.founder$"
 culture_notification_hybrid_tooltip: "Dvě [Concept('cultures','kultury')|E] se spojily: [parent_1.GetName] a [parent_2.GetName]. Vznikla tak [new_culture.GetName] [Concept('hybrid_culture','hybridní kultura')|E]."
 culture_notification.1101.t: "Odštěpená kultura: [new_culture.GetNameNoTooltip|V]"
 culture_notification.1101.desc: "Přičiněním [founder.GetTitledFirstName] se [parent_1.GetName] kultura rozštěpila. Vznikla tak [new_culture.GetName|V] [Concept('divergent_culture','odštěpená kultura')|E]."
 culture_notification.1111.t: "Odštěpení: [new_culture.GetNameNoTooltip]"
 culture_notification.1111.intro: "Tu posunutý nářeční tvar, tam nový zvyk — zpočátku snadno přehlédnutelné. Už ne: [parent_1.GetCollectiveNoun] žijící v [founder.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] se nyní hlásí ke kultuře, která se označuje jako [new_culture.GetName].\n\n"
 culture_notification.1111.tradition.new: "Tradice jejich předků ustupují nové tradici [new_tradition.GetName]."
 culture_notification.1111.tradition.lost: "Zvyky spojené s tradicí [lost_tradition.GetName], které udržovali [parent_1.GetCollectiveNounNoTooltip], zavrhli."
 culture_notification.1111.ethos.bellicose: "Tváří v tvář sílícímu tlaku divočiny i svých soupeřů jsou [new_culture.GetCollectiveNounNoTooltip] stále bojovnější a své živobytí si chtějí vydobýt a chránit silou zbraní."
 culture_notification.1111.ethos.bureaucratic: "[new_culture.GetCollectiveNounNoTooltip] si vypěstovávají stále větší zálibu v rozvláčných zákonech, dlouhých kronikách a spletitých listinách a nacházejí jistotu ve společnosti řízené stále rozsáhlejšími formálními pravidly."
 culture_notification.1111.ethos.courtly: "[new_culture.GetCollectiveNounNoTooltip] kladou stále větší důraz na dobré mravy a etiketu a přijímají spořádaný, obřadný způsob života, který má přinést novou éru stability a prosperity."
 culture_notification.1111.ethos.communal: "Když pomáhají sousedům v neštěstí a společně oslavují jejich úspěchy, vytvářejí [new_culture.GetCollectiveNounNoTooltip] pevná pouta pospolitosti, která jim dávají pocit sounáležitosti a smyslu."
 culture_notification.1111.ethos.stoic: "Tváří v tvář nebezpečnému a nepředvídatelnému světu si [new_culture.GetCollectiveNounNoTooltip] začínají cenit houževnatosti a odhodlání více než kdy dříve."
 culture_notification.1111.ethos.spiritual: "Při hledání odpovědí v sobě samých i ve světě kolem sebe se [new_culture.GetCollectiveNounNoTooltip] stávají duchovnějšími a zbožnějšími než kdy dříve."
 culture_notification.1111.ethos.egalitatian: "[new_culture.GetCollectiveNounNoTooltip] si uvědomují, že okolnosti narození nemusí vypovídat o schopnostech člověka, a jejich společnost se proto stává rovnostářštější a otevřenější."
 culture_notification.1111.ethos.unchanged: "Jejich pohled na život se nezměnil, ale rozdíly v politice a hranicích proměnily jeden lid ve dva."
 culture_notification.1111.outro.other: "\n\nAť už vychytralostí, nebo přesvědčením, stojí nyní [founder.GetTitledFirstName] v čele tohoto kulturního probuzení."
 culture_notification.1111.outro.founder: "\n\nLidé, jejichž kultura se nyní označuje jako [new_culture.GetNameNoTooltip], teď hledí ke mně. Zde začíná naše budoucnost."
 culture_notification.1111.a.other: "Uvidíme, kam to povede."
 culture_notification.1111.a.founder: "Nová doba, nová éra, nový lid!"
 culture_notification_tooltip: "[parent_1.GetName] [Concept('culture','kultura')|E] se rozštěpila; výsledkem je [new_culture.GetName] [Concept('divergent_culture','odštěpená kultura')|E]."
 culture_notification.1011.hybrid_primary_1: "Nové kultuře dala základ [parent_1.GetNameNoTooltip] kultura svými tradicemi a hodnotami, zatímco [parent_2.GetNameNoTooltip] kultura přispěla řadou rysů, které byly upraveny a začleněny podle potřeb nové společnosti." # todo: NOT IN ENGLISH
 culture_notification.1011.hybrid_primary_2: "Nové kultuře dala základ [parent_2.GetNameNoTooltip] kultura svými tradicemi a hodnotami, zatímco [parent_1.GetNameNoTooltip] kultura přispěla řadou rysů, které byly upraveny a začleněny podle potřeb nové společnosti." # todo: NOT IN ENGLISH
 culture_notification.1011.hybrid_no_primary: "[new_culture.GetNameNoTooltip] kultura převzala vyváženou směs prvků z obou původních kultur a stala se skutečně hybridní kulturou, v níž se oba světy plynule prolínají." # todo: NOT IN ENGLISH
