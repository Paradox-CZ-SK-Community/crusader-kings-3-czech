l_polish:
 death_management.1000.killed.tt: "[killer.GetTitledFirstName] [Select_CString(killer.IsFemale,'zabila','zabil')] [dead_character.GetTitledFirstName]."
 death_management.1000.t: "Dokud nás smrt nerozdělí"
 death_management.1000.murder: "[dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'byla zavražděna','byl zavražděn')]!\n\n"
 death_management.1000.plaguestart: "Nemoci a nákazy pokračují ve svém děsivém tažení. [realm.GetNameNoTier] je jejich další kořistí a padají před nimi vznešení i prostí bez rozdílu. Tato krutá a slepá pravda se málokdy ukáže tak jasně jako právě v takových chvílích.\n\n"
 death_management.1000.plaguespouse: "Jen mlčky sleduji, jak lékaři odstupují od těla. Přede mnou nehybně leží [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))]. Přistoupím blíž a dotknu se ruky. Je stále teplá.\n\n"
 death_management.1000.like: "Jak může srdce vydržet takovou bolest a nezlomit se? To přece není možné! A přesto tu jsem, mé srdce stále bije, zatímco tvé umlklo. Ach, [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')]. Život bez tebe už nikdy nebude stejný."
 death_management.1000.neutral: "[Select_CString(dead_character.IsFemale,'Má drahá','Můj drahý')] [dead_character.GetFirstName]. [Select_CString(ROOT.Char.IsFemale,'Možná jsem tě nemilovala','Možná jsem tě nemiloval')], ale tvůj odchod mě zasáhl mnohem víc, než jsem kdy čekala[Select_CString(ROOT.Char.IsFemale,'','')]. Vždycky jsi tu [Select_CString(dead_character.IsFemale,'byla','byl')], stále po mém boku. Byla pro mě tvá přítomnost samozřejmostí? Tolik věcí zůstalo nevyřčeno..."
 death_management.1000.dislike: "[dead_character.GetFirstName|U], když jsi [Select_CString(dead_character.IsFemale,'naposledy vydechla','naposledy vydechl')], zaplavila mě úleva. Možná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] stydět, ale po pravdě mezi námi žádná láska nebyla. Konečně můžu začít nový život!"
 death_management.1000.murder_wedding: "Ach, jak naprosto nečekaná smrt. Vůbec neplánovaná. Tohle přece nikdo nemohl čekat!"
 death_management.1000.a: "Alespoň vzpomínky zůstávají."
 death_management.1000.b: "Snad nalezneš pokoj, [dead_character.GetFirstNameNoTooltip]."
 death_management.1000.c: "Už bylo načase!"
 death_management.1000.tt: "[Select_CString(dead_character.IsFemale,'Tvá manželka','Tvůj manžel')], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.1001.t: "Přežít vlastní dítě"
 death_management.1001.murder: "[dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'byla zavražděna','byl zavražděn')]!\n\n"
 death_management.1001.tt: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [THIS.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.1001.plaguechild: "Žaludek se mi svírá v tiché agónii, když kolem mě nesou tělo. Je to [Select_CString(dead_character.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_character'))] [dead_character.GetFirstName]. Lékaři a ranhojiči se od úsvitu do soumraku snažili zachránit život, ale jejich zachmuřené tváře všem řekly víc, než byli ochotni vyslovit.\n\n[Select_CString(dead_character.IsFemale,'Tak mladá, tak plná příslibů.','Tak mladý, tak plný příslibů.')] A tolik dalších ještě zemře stejně.\n\nKéž nás [ROOT.Char.GetFaith.HighGodName] ochrání."
 death_management.1001.child: "Tolik nadějí jsem do tebe [Select_CString(ROOT.Char.IsFemale,'vkládala','vkládal')], mé nejdražší dítě. Co všechno ses [Select_CString(dead_character.IsFemale,'měla','měl')] naučit, zažít a dokázat. Čekalo tě tolik možností, celý život před sebou. Třeba bys jednou [Select_CString(dead_character.IsFemale,'měla','měl')] vlastní děti. Ale teď už se nic z toho nikdy nestane..."
 death_management.1001.like: "Ach, [ROOT.Char.GetFaith.HighGodName], proč muselo [dead_character.GetFirstName] potkat právě tohle? Za mé hříchy měl přijít trest na mě, ne na [dead_character.GetFirstNameNoTooltip]! [Select_CString(dead_character.IsFemale,'Byla','Byl')] bez viny, [Select_CString(dead_character.IsFemale,'má dokonalá','můj dokonalý')] [dead_character.Custom('GetDaughterSon')]! Život toho měl ještě tolik nabídnout..."
 death_management.1001.neutral: "[Select_CString(ROOT.Char.IsFemale,'Myslela jsem','Myslel jsem')], že mě krutosti tohoto světa už nemohou překvapit, ale nikdy mě nenapadlo, že [dead_character.Custom('GetDaughterSon')] zemře dřív než já. Mou jedinou útěchou je naděje, že už nemusí snášet utrpení, které čeká mě..."
 death_management.1001.dislike: "Nemá snad [ROOT.Char.Custom('MotherFather')] milovat své děti? [dead_character.GetFirstName] je však pryč, a přesto nedokážu plakat. Někde jsem [Select_CString(ROOT.Char.IsFemale,'musela','musel')] udělat chybu a nasměrovat vlastní dítě na cestu, kterou jsem nikdy [Select_CString(ROOT.Char.IsFemale,'nemohla','nemohl')] schvalovat. Možná nesu vinu za to, jak [dead_character.GetFirstNameNoTooltip] nakonec [Select_CString(dead_character.IsFemale,'dopadla','dopadl')], ale teď už je to minulost. Konečně."
 death_management.1001.a: "[dead_character.GetFirstNameNoTooltip] si tohle [Select_CString(dead_character.IsFemale,'nezasloužila','nezasloužil')]."
 death_management.1001.c: "Na lítost je příliš pozdě."
 death_management.1001.d: "Odpočívej v pokoji, [dead_character.GetFirstNameNoTooltip]."
 death_management.1004.t: "Prázdnota, která zůstala"
 death_management.1004.desc: "V mé posteli je cosi přítomného, stejně hmatatelného jako kdysi tvé tělo, když ses ke mně [Select_CString(dead_character.IsFemale,'tiskla','tiskl')]. Jenže to nejsi ty, [dead_character.GetFirstName], ale všechna touha a úzkost, které jsi tu po sobě zanechal[Select_CString(dead_character.IsFemale,'a','')]. Přes den se dokážu zaměstnat, ale tady, kde jsou vzpomínky tak živé, není úniku."
 death_management.1004.a: "Přestane to někdy bolet?"
 death_management.1004.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá milenka','Tvůj milenec')], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.lover.desc: "[Select_CString(dead_character.IsFemale,'Tvá milenka','Tvůj milenec')], [dead_character.GetTitledFirstName], [Select_CString(dead_character.IsFemale,'zemřela','zemřel')]."
 death_management.1005.t: "Vzpomínky zůstávají"
 death_management.1005.desc: "Ach, [dead_character.GetFirstName]. Kdybys tu ještě se mnou [Select_CString(dead_character.IsFemale,'byla','byl')], vím, že bys mi [Select_CString(dead_character.IsFemale,'řekla','řekl')], ať vydržím. Že bude lépe. A [Select_CString(dead_character.IsFemale,'měla','měl')] bys pravdu, jako vždy. Ale nejdřív musím proklínat a plakat. Jak jinak, když už nejsi na tomto světě?"
 death_management.1005.desc.ritual_best_friend: "[dead_character.GetFirstName] je [Select_CString(dead_character.IsFemale,'mrtvá','mrtvý')]! [Select_CString(dead_character.IsFemale,'Má nejlepší a nejvěrnější přítelkyně','Můj nejlepší a nejvěrnější přítel')] je pryč. Chladná náruč smrti přišla příliš brzy a nyní [ROOT.Char.GetFaith.DeathDeityName] čeká na druhé straně. Pláču, běduji, rvu si vlasy i šaty, ale vím, že už žádné další setkání nepřijde.\n\nJak... jak mám teď pokračovat dál?\n\n[dead_character.GetFirstNameNoTooltip], [Select_CString(dead_character.IsFemale,'drahá, milá','drahý, milý')] [dead_character.GetFirstNameNoTooltip] by si [Select_CString(dead_character.IsFemale,'přála','přál')], aby můj život pokračoval. Musím doufat, že vzpomínky mi pomohou projít těmito temnými časy, ale bez tebe mi život připadá jako svíce bez plamene."
 death_management.1005.a: "Nikdy na tebe nezapomenu, [Select_CString(dead_character.IsFemale,'stará přítelkyně','starý příteli')]."
 death_management.1005.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá přítelkyně','Tvůj přítel')], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.friend.desc: "[Select_CString(dead_character.IsFemale,'Tvá přítelkyně','Tvůj přítel')], [dead_character.GetTitledFirstName], [Select_CString(dead_character.IsFemale,'zemřela','zemřel')]."
 death_management.1007.t: "Zvrat osudu"
 death_management.1007.start_murder: "[dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'byla zavražděna','byl zavražděn')]!"
 death_management.1007.start: "Dnes [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')]. [ROOT.Char.GetPrimaryTitle.GetNameNoTier] teď čeká jiná budoucnost."
 death_management.1007.same_or_higher_tier: "Nikdy se nedozvíme, zda by [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'dokázala','dokázal')] sjednotit naše země,"
 death_management.1007.mytitle: "Nikdy se nedozvíme, co by [dead_character.GetTitledFirstName] jako [ROOT.Char.GetTitleTierName] [Select_CString(dead_character.IsFemale,'dokázala','dokázal')],"
 death_management.1007.ruler: "Nikdy se nedozvíme, co by [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'dokázala jako vládkyně','dokázal jako vládce')],"
 death_management.1007.end: "ani zda tato smrt znamená pro [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] požehnání, nebo prokletí."
 death_management.1007.a: "Jeden příběh končí a jiný začíná."
 death_management.1007.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá dědička','Tvůj dědic')], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.1006.t: "Zlomená kletba"
 death_management.1006.desc: "Rozmary osudu mi ne vždy hrály do karet – [ROOT.Char.GetFaith.HighGodName] ví, že kletba na mě padla už v den, kdy mi [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zkřížila','zkřížil')] cestu.\n\nDnes však kletba pominula! Osud se na mě usmál. Konečně je pod zemí [Select_CString(dead_character.IsFemale,'ta','ten')] [dead_character.Custom2('InsultAdjective', ROOT.Char)] [dead_character.Custom2('InsultNoun', ROOT.Char)]!"
 death_management.1006.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [Concept('rival',Select_CString(dead_character.IsFemale,'sokyně','sok'))|E], [dead_character.GetFullName], [dead_character.GetDeathReasonHideKiller]."
 death_management.parent.desc: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [dead_character.Custom('MotherFather')], [dead_character.GetFullName], [dead_character.GetDeathReason]."
 death_management.sibling.desc: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [dead_character.Custom('SisterBrother')], [dead_character.GetFullName], [dead_character.GetDeathReason]."
 death_management.betrothed.desc: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [Concept('betrothed',Select_CString(dead_character.IsFemale,'snoubenka','snoubenec'))|E], [dead_character.GetFullName], [dead_character.GetDeathReason]."
 death_management.liege_councillor.desc: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [Concept('councillor',Select_CString(dead_character.IsFemale,'rádkyně','rádce'))|E], [dead_character.GetFullName], [dead_character.GetDeathReason]."
 death_management.liege.desc: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [Concept('vassal',Select_CString(dead_character.IsFemale,'vazalka','vazal'))|E], [dead_character.GetFullName], [dead_character.GetDeathReason]."
 death_management.pinned.desc: "Postava, kterou sleduješ, [dead_character.GetFullName], [dead_character.GetDeathReason]."
 death_management.elder.desc: "Tvůj [Concept('elder','starší')|E], [deceased_elder.GetFullName], [deceased_elder.GetDeathReason]."
 death_management.1008.desc: "[dead_character.GetTitledFirstName], choť [spouse_of_dead_character.GetFirstName], [Select_CString(dead_character.IsFemale,'zemřela','zemřel')]. Všechny ty pečlivě spřádané plány jsou rázem v troskách. [ROOT.Char.GetFaith.DeathDeityName] si opět pohrává s osudem, třebaže vedle bolesti pozůstalé rodiny působí mé stížnosti malicherně a bezvýznamně..."
 death_management.1008.a: "Odpočívej v pokoji."
 death_management.1008.a.tt: "Choť [spouse_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]."
 death_management.spouse_child.desc: "Choť [Select_CString(spouse_of_dead_character.IsFemale,'tvé dědičky','tvého dědice')] [spouse_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]."
 death_management.1009.t: "Nečekaná tragédie"
 death_management.1009.desc: "[dead_character.GetTitledFirstName], [Select_CString(dead_character.IsFemale,'snoubenka','snoubenec')] [betrothed_of_dead_character.GetFirstName], [Select_CString(dead_character.IsFemale,'zemřela','zemřel')]. Všechny ty pečlivě spřádané plány jsou rázem v troskách. [ROOT.Char.GetFaith.DeathDeityName] si opět pohrává s osudem, třebaže vedle bolesti pozůstalé rodiny působí mé stížnosti malicherně a bezvýznamně..."
 death_management.1009.a: "Odpočívej v pokoji, maličký."
 death_management.1009.a.tt: "[Select_CString(dead_character.IsFemale,'Snoubenka','Snoubenec')] [betrothed_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [THIS.Char.Custom('DiedHouse_arrest')] a sňatková dohoda pozbývá platnosti."
 death_management.betrothed_child.desc: "[Select_CString(dead_character.IsFemale,'Snoubenka','Snoubenec')] [betrothed_of_dead_character.GetFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReason]."
 death_management.1010.t: "Už žádné lekce"
 death_management.1010.murderer: "Když se chodbami rozšíří zpráva, že [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')], musím vynaložit veškeré úsilí, aby na mně nebylo nic znát.\n\nTeprve v kočáře cestou domů mi skutečně dochází, co se stalo... [dead_character.GetFirstNameNoTooltip] je pryč."
 death_management.1010.under_12: "Všechno mi trochu splývá – jednoho rána mě [dead_character.GetTitledFirstName] nezavolá k výuce a najednou sedím v kočáře mířícím domů.\n\nKdyž se ptám, proč se se mnou [dead_character.GetFirstName] nepřijde rozloučit, z tlumeného šeptání kolem mě pomalu pochopím, že už se nikdy neuvidíme."
 death_management.1010.12_or_over: "Zprávu mi přinesli právě ve chvíli, kdy jsem se chystal[Select_CString(ROOT.Char.IsFemale,'a','')] na výuku, a najednou jsem nevěděl[Select_CString(ROOT.Char.IsFemale,'a','')], co si počít. [Select_CString(dead_character.IsFemale,'Má učitelka','Můj učitel')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')].\n\nAni cestou domů se nemohu zbavit podivného pocitu z toho, že už se nikdy neuvidíme."
 death_management.1010.under_12_liked_educator: "Kéž by se se mnou [dead_character.GetFirstNameNoTooltip] alespoň [Select_CString(dead_character.IsFemale,'rozloučila','rozloučil')]."
 death_management.1010.under_12_disliked_educator: "Stejně chci někoho nového!"
 death_management.1010.over_12_liked_educator: "Tolik jsi mě toho [Select_CString(dead_character.IsFemale,'naučila','naučil')], [dead_character.GetFirstName]."
 death_management.1010.over_12_disliked_educator: "Aspoň je po všem."
 death_management.1010.a.tt: "Smrtí [dead_character.GetTitledFirstName] tvá výuka končí."
 death_management.educator.desc: "[Select_CString(dead_character.IsFemale,'Vychovatelka','Vychovatel')] [ward_of_dead_character.GetTitledFirstName], [dead_character.GetTitledFirstName], [dead_character.GetDeathReasonHideKiller]."
 death_management.2000.t: "Dokud nás [prison_holder.GetFirstNameNoTooltip] nerozdělí"
 death_management.2000.t.root_killer: "Dokud nás nerozdělím já"
 death_management.2000.t.no_killer: "Násilné odloučení"
 death_management.2000.murderer: "Ach, [dead_character.GetFirstName], mohli jsme spolu žít ještě tak dlouho, ale muselo to skončit právě takhle.\n\nNetěší mě, že mám na rukou tvou krev, ale vím, že kdybys mohl[Select_CString(dead_character.IsFemale,'a','')] promluvit, přál[Select_CString(dead_character.IsFemale,'a','')] by sis, abych šel[Select_CString(ROOT.Char.IsFemale,'a','')] dál a znovu našel[Select_CString(ROOT.Char.IsFemale,'a','')] štěstí."
 death_management.2000.like: "Jak může srdce vydržet takovou bolest a nezlomit se? To přece není možné! A přesto tu jsem, mé srdce stále bije, zatímco tvé umlklo.\n\nAch, [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')]."
 death_management.2000.like_end_killer: "Nemohu dostat z hlavy obraz, jak [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'ukončila','ukončil')] tvůj život."
 death_management.2000.like_end: "Nemohu dostat z hlavy představu, jak chřadneš v kobce, kam tě [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'nechala','nechal')] zavřít."
 death_management.2000.neutral: "[Select_CString(dead_character.IsFemale,'Má drahá','Můj drahý')] [dead_character.GetFirstName]. Možná mezi námi nebyla láska, ale tvá smrt mě zasáhla mnohem víc, než jsem kdy čekal[Select_CString(ROOT.Char.IsFemale,'a','')]. Vždycky jsi tu [Select_CString(dead_character.IsFemale,'byla','byl')], stále po mém boku."
 death_management.2000.neutral_end_killer: "Pomyšlení, že tě [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'připravila','připravil')] o život tak násilným způsobem..."
 death_management.2000.neutral_end: "Pomyšlení, že jsi [Select_CString(dead_character.IsFemale,'zahynula','zahynul')] v kobce, kam tě [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'nechala','nechal')] zavřít..."
 death_management.2000.dislike: "[Select_CString(dead_character.IsFemale,'Manželko','Manželi')], když jsi [Select_CString(dead_character.IsFemale,'naposledy vydechla','naposledy vydechl')], pocítil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem úlevu i hněv. Možná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] stydět, ale po pravdě mezi námi žádná láska nebyla."
 death_management.2000.dislike_end_killer: "A přesto mě uráží, že tě o život připravil někdo jako [prison_holder.GetTitledFirstName], [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)]..."
 death_management.2000.dislike_end_unknown_killer: "A přesto mě uráží, že tě někdo zavraždil..."
 death_management.2000.dislike_end_no_killer: "$death_management.2000.dislike_end$"
 death_management.2000.dislike_end: "A přesto mě uráží, že jsi [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v kobkách někoho jako [prison_holder.GetFirstName], [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)]..."
 death_management.2000.a: "Že mě o tebe připravil někdo jako [prison_holder.GetTitledFirstName], [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)]..."
 death_management.2000.b: "To je neodpustitelný zločin!"
 death_management.2000.c: "To je neodpustitelné!"
 death_management.2000.d: "A zemřít zrovna takhle..."
 death_management.2000.tt: "[Select_CString(dead_character.IsFemale,'Tvá manželka','Tvůj manžel')], [dead_character.GetTitledFirstName], [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] ve vězení. [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'ji tam držela','ho tam držel')]."
 death_management.2007.t: "Zvrat osudu"
 death_management.2007.start: "Dnes [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v žaláři, kam [Select_CString(dead_character.IsFemale,'ji','ho')] [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'nechala','nechal')] zavřít. [ROOT.Char.GetPrimaryTitle.GetNameNoTier] teď čeká jiná budoucnost. Nikdy se nedozvíme, jak by si [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'vedla','vedl')] jako"
 death_management.2007.mytitle: "[ROOT.Char.GetTitleTierName]"
 death_management.2007.ruler: "[Select_CString(dead_character.IsFemale,'vládkyně','vládce')]"
 death_management.2007.end: "ani zda tato smrt přináší požehnání, nebo prokletí — [ROOT.Char.GetPrimaryTitle.GetType.GetName] ponese její následky.\n\nJedno však vím jistě: [prison_holder.GetFirstName] za své zločiny zaplatí."
 death_management.2007.a: "[prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'spáchala','spáchal')] neodpustitelný čin."
 death_management.2007.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá dědička','Tvůj dědic')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v žaláři, kam [Select_CString(dead_character.IsFemale,'ji','ho')] [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'nechala','nechal')] zavřít."
 death_management.2007.a.new_heir.tt: "[new_heir.GetTitledFirstName] je [Select_CString(new_heir.IsFemale,'tvá nová dědička','tvůj nový dědic')]"
 death_management.2001.t: "Přežít vlastní dítě"
 death_management.2001.opening: "[dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')]! [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_character'))] je pryč.\n\n"
 death_management.2001.child: "Tolik nadějí jsem do tebe [Select_CString(ROOT.Char.IsFemale,'vkládala','vkládal')], mé drahé dítě. Co všechno ses [Select_CString(dead_character.IsFemale,'měla','měl')] naučit, zažít a dokázat. Čekalo tě tolik možností, celý život před sebou. Možná bys jednou [Select_CString(dead_character.IsFemale,'měla','měl')] vlastní děti. Ale teď už se nic z toho nikdy nestane, a to všechno kvůli [prison_holder.GetTitledFirstName]..."
 death_management.2001.like: "Ach, [ROOT.Char.GetFaith.HighGodName], jak jsi mohl dopustit, aby [prison_holder.GetTitledFirstName] provedl[Select_CString(prison_holder.IsFemale,'a','')] [dead_character.GetFirstName] něco takového?"
 death_management.2001.like_end_killer: "Modlím se, aby [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.GetFirstName] nepoznal[Select_CString(prison_holder.IsFemale,'a','')] odpočinek, pokoj ani #EMP lásku#! za to, že ukončil[Select_CString(prison_holder.IsFemale,'a','')] život mého dítěte. [dead_character.Custom('GetDaughterSon')|U] [dead_character.GetFirstName] si takový osud nezasloužil[Select_CString(dead_character.IsFemale,'a','')]."
 death_management.2001.like_end: "Modlím se, aby [prison_holder.Custom2('InsultAdjective', ROOT.Char)] [prison_holder.Custom2('InsultNoun', ROOT.Char)] [prison_holder.GetFirstName] nepoznal[Select_CString(prison_holder.IsFemale,'a','')] odpočinek, pokoj ani #EMP lásku#! za to, že nechal[Select_CString(prison_holder.IsFemale,'a','')] mé dítě chřadnout ve svém žaláři. [dead_character.Custom('GetDaughterSon')|U] [dead_character.GetFirstName] si takový osud nezasloužil[Select_CString(dead_character.IsFemale,'a','')]."
 death_management.2001.neutral: "Měl jsem za to, že už jsem příliš starý na to, aby mě krutosti tohoto světa dokázaly překvapit, ale nikdy by mě nenapadlo, že [dead_character.Custom('GetDaughterSon')] [dead_character.GetFirstName] zemře kvůli [prison_holder.GetTitledFirstName]. Mou jedinou útěchou je naděje, že už [dead_character.GetFirstNameNoTooltip] nemusí snášet utrpení, kterým si musel[Select_CString(dead_character.IsFemale,'a','')] projít..."
 death_management.2001.dislike: "Nemá snad [ROOT.Char.Custom('MotherFather')] povinnost milovat své děti? A přesto je [dead_character.GetFirstName] pryč a já nedokážu plakat."
 death_management.2001.dislike_end_killer: "Cítím jen hněv nad urážkou, které se mi dostalo: [prison_holder.GetTitleTierName] [Select_CString(prison_holder.IsFemale,'připravila','připravil')] mé dítě o život vlastní rukou."
 death_management.2001.dislike_end: "Cítím jen hněv nad urážkou, které se mi dostalo: [prison_holder.GetTitleTierName] [Select_CString(prison_holder.IsFemale,'nechala','nechal')] mé dítě zemřít ve svém žaláři."
 death_management.2001.a: "[dead_character.GetFirstNameNoTooltip] si tohle [Select_CString(dead_character.IsFemale,'nezasloužila','nezasloužil')]."
 death_management.2001.c: "Na lítost je příliš pozdě."
 death_management.2001.d: "Odpočívej v pokoji, [dead_character.GetFirstNameNoTooltip]."
 death_management.2001.tt: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [dead_character.Custom('GetDaughterSon')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v žaláři, kam [Select_CString(dead_character.IsFemale,'ji','ho')] [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'nechala','nechal')] zavřít."
 death_management.2002.t: "Dlouhý odpočinek"
 death_management.2002.child: "[dead_character.Custom('MotherFather')|U] je pryč? Proč jsi [Select_CString(dead_character.IsFemale,'odešla','odešel')]? Říkali, že za to nemůžeš, že [prison_holder.GetTitledFirstName] je důvod, proč jsi [Select_CString(dead_character.IsFemale,'musela','musel')] odejít. Ale proč mi tě [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'vzala','vzal')], [dead_character.Custom('MotherFather')]?"
 death_management.2002.like: "[dead_character.Custom('MotherFather')|U] tu už není. Možná jsem [Select_CString(ROOT.Char.IsFemale,'dospělá','dospělý')], ale pro tebe jsem vždycky [Select_CString(ROOT.Char.IsFemale,'byla','byl')] dítětem. Co si mám počít teď, když mi tě [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'vzala','vzal')] a [Select_CString(prison_holder.IsFemale,'odnesla','odnesl')] tě z tohoto světa? Kdo mě obejme, když přes slzy nevidím?"
 death_management.2002.neutral: "Možná jsme si nebyli blízcí, [dead_character.GetFirstName], ale nic nezmění, že jsi [dead_character.Custom('MotherFather')]. Pomyšlení, že mi tě [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'vzala','vzal')] tak krutým způsobem, ve mně zanechává tolik otázek. Co vedlo [prison_holder.GetTitleTierName] k tak ohavnému činu? Bral[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tě jako samozřejmost? [dead_character.Custom('MotherFather')|U]... Opravdu jsi mě [Select_CString(dead_character.IsFemale,'milovala','miloval')]?"
 death_management.2002.dislike: "V žilách mi možná koluje tvá krev, ale [Select_CString(dead_character.IsFemale,'opravdová','opravdový')] [dead_character.Custom('MotherFather')] jsi pro mě nikdy [Select_CString(dead_character.IsFemale,'nebyla','nebyl')]. Kdyby tvá smrt rukou [prison_holder.GetTitledFirstName] nebyla takovou urážkou, [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')] bych jen úlevu."
 death_management.2002.a: "Vždycky tě budu milovat. [Select_CString(dead_character.IsFemale,'Byla jsi má','Byl jsi můj')] [dead_character.Custom('MotherFather')]."
 death_management.2002.b: "Asi se to už nikdy nedozvím..."
 death_management.2002.c: "[prison_holder.GetTitledFirstName] za to zaplatí."
 death_management.2002.d: "Já... chci, aby se [dead_character.Custom('MotherFather')] [Select_CString(dead_character.IsFemale,'vrátila','vrátil')]!"
 death_management.2002.tt: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [dead_character.Custom('MotherFather')] [dead_character.GetTitledFirstName] [dead_character.GetDeathReason]."
 death_management.2008.t: "Všechno, co mohlo být"
 death_management.2008.desc.like: "V představách už jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] naši společnou budoucnost — [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'stála','stál')] po mém boku, společně jsme něco dokázali a založili rodinu."
 death_management.2008.like_end_killer: "Všechny ty sny se zhroutily kvůli [prison_holder.GetTitledFirstName], [Select_CString(prison_holder.IsFemale,'která zavraždila','který zavraždil')] [Select_CString(dead_character.IsFemale,'mou snoubenku','mého snoubence')] a ukončil[Select_CString(prison_holder.IsFemale,'a','')] je dřív, než vůbec mohly začít."
 death_management.2008.like_end: "Všechny ty sny se zhroutily kvůli [prison_holder.GetTitledFirstName], [Select_CString(prison_holder.IsFemale,'která nechala','který nechal')] [Select_CString(dead_character.IsFemale,'mou snoubenku','mého snoubence')] zemřít ve svém žaláři."
 death_management.2008.dislike_killer: "Když mi oznámili, že [Select_CString(dead_character.IsFemale,'má snoubenka','můj snoubenec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] rukou [prison_holder.GetTitledFirstName], nemohu popřít, že se mi ulevilo. Stále mě samozřejmě hněvá, že [prison_holder.GetTitleTierName] [Select_CString(prison_holder.IsFemale,'ukončila','ukončil')] život [Select_CString(dead_character.IsFemale,'mé nastávající','mého nastávajícího')] tak násilně, ale úleva z toho, že ke sňatku už nedojde, je silnější."
 death_management.2008.dislike: "Když mi oznámili, že [Select_CString(dead_character.IsFemale,'má snoubenka','můj snoubenec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v žaláři [prison_holder.GetTitledFirstName], nemohu popřít, že se mi ulevilo. Stále mě samozřejmě hněvá, že [prison_holder.GetTitleTierName] [Select_CString(prison_holder.IsFemale,'nechala','nechal')] [Select_CString(dead_character.IsFemale,'mou snoubenku','mého snoubence')] zemřít ve své péči, ale úleva z toho, že ke sňatku už nedojde, je silnější."
 death_management.2008.desc.neutral: "Od chvíle, kdy bylo mé zasnoubení s [dead_character.GetTitledFirstName] oficiálně oznámeno, ve mně představa blížícího se sňatku vyvolávala nadšení i obavy. Teď, když [prison_holder.GetTitledFirstName] způsobil[Select_CString(prison_holder.IsFemale,'a','')] smrt [Select_CString(dead_character.IsFemale,'mé snoubenky','mého snoubence')], mi [dead_character.GetFirstName] chybí, přestože jsme se vlastně nikdy pořádně nepoznali. Kdo ví, co všechno jsme spolu mohli mít?"
 death_management.2008.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá snoubenka','Tvůj snoubenec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v žaláři, kam [Select_CString(dead_character.IsFemale,'ji','ho')] [prison_holder.GetTitledFirstName] [Select_CString(prison_holder.IsFemale,'nechala','nechal')] zavřít, a sňatková dohoda pozbývá platnosti."
 death_management.2008.a: "Odpočívej v pokoji, [dead_character.GetFirstNameNoTooltip]."
 death_management.2008.b: "Přeskočili jsme rovnou k #EMP Dokud nás smrt nerozdělí#!"
 death_management.3000.t: "Dokud nás nerozdělím já"
 death_management.3000.like: "Ach, [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')]. Pomyslet, že tě smrt zastihla právě v mém žaláři... Zajímalo by mě, zda bys [Select_CString(dead_character.IsFemale,'uvěřila','uvěřil')], že tě stále miluji. Dokonce i teď."
 death_management.3000.neutral: "[Select_CString(dead_character.IsFemale,'Má drahá','Můj drahý')] [dead_character.GetFirstName]. Možná jsem tě nemiloval[Select_CString(ROOT.Char.IsFemale,'a','')] a možná nesu vinu za tvou smrt, přesto mě tvůj odchod zasáhl mnohem víc, než jsem kdy čekal[Select_CString(ROOT.Char.IsFemale,'a','')]. Vždycky jsi tu [Select_CString(dead_character.IsFemale,'byla','byl')], stále po mém boku. Pomyslet, že právě můj žalář se ti stal osudným..."
 death_management.3000.dislike: "[Select_CString(dead_character.IsFemale,'Drahá zesnulá manželko','Drahý zesnulý manželi')], když jsi v mém žaláři [Select_CString(dead_character.IsFemale,'naposledy vydechla','naposledy vydechl')], zaplavila mě úleva. Možná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] stydět, ale po pravdě mezi námi žádná láska nebyla."
 death_management.3000.a: "Ať odpočívá v pokoji."
 death_management.3000.b: "Kdo to mohl tušit?"
 death_management.3000.c: "Aspoň je po všem!"
 death_management.3000.tt: "[Select_CString(dead_character.IsFemale,'Tvá manželka','Tvůj manžel')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v tvém žaláři."
 death_management.3007.t: "Zvrat osudu"
 death_management.3007.start: "Dnes [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v mém žaláři a budoucnost [ROOT.Char.GetPrimaryTitle.GetNameNoTier] se tím změnila. Nikdy se nedozvíme, jak by si [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'vedla','vedl')] jako"
 death_management.3007.mytitle: "[ROOT.Char.GetTitleTierName]"
 death_management.3007.ruler: "[Select_CString(dead_character.IsFemale,'vládkyně','vládce')]"
 death_management.3007.end: "ani zda tato smrt přináší [ROOT.Char.GetPrimaryTitle.GetType.GetName] požehnání, nebo prokletí.\n\nJedno však vím jistě: co se stalo, nelze vzít zpět a příběh [dead_character.GetFirstName] je u konce."
 death_management.3007.a: "Jeden příběh končí a jiný začíná."
 death_management.3007.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá dědička','Tvůj dědic')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v tvém žaláři.\n[new_heir.GetTitledFirstName] je [Select_CString(new_heir.IsFemale,'tvá nová dědička','tvůj nový dědic')]."
 death_management.3001.t: "Přežít vlastní dítě"
 death_management.3001.tt: "[Select_CString(dead_character.IsFemale,'Tvá dcera','Tvůj syn')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v tvém žaláři."
 death_management.3001.child: "Tolik nadějí jsem do tebe [Select_CString(ROOT.Char.IsFemale,'vkládala','vkládal')], mé drahé dítě. Tolik ses toho měl[Select_CString(dead_character.IsFemale,'a','')] naučit, tolik zažít a dokázat. Čekal tě celý život plný možností. Možná bys jednou měl[Select_CString(dead_character.IsFemale,'a','')] vlastní děti. Ale teď už se nic z toho nikdy nestane, a to všechno kvůli mým činům..."
 death_management.3001.like: "Ach, [ROOT.Char.GetFaith.HighGodName], proč jsi dopustil, aby [dead_character.GetFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')]?\n\nModlím se, aby [dead_character.GetFirstNameNoTooltip] nalezl[Select_CString(dead_character.IsFemale,'a','')] pokoj na onom světě a aby mi [ROOT.Char.GetFaith.HighGodName] odpustil mé zločiny."
 death_management.3001.neutral: "[Select_CString(ROOT.Char.IsFemale,'Myslela jsem','Myslel jsem')], že už jsem příliš starý[Select_CString(ROOT.Char.IsFemale,'á','')] na to, aby mě krutosti tohoto světa dokázaly překvapit. Nikdy by mě však nenapadlo, jakou bolest mi způsobí smrt vlastního dítěte. Mou jedinou útěchou je naděje, že [dead_character.GetFirstNameNoTooltip] už nemusí snášet utrpení, které teď čeká mě..."
 death_management.3001.dislike: "[Select_CString(ROOT.Char.IsFemale,'Nemá snad matka povinnost milovat své děti?','Nemá snad otec povinnost milovat své děti?')] A přesto nedokážu plakat nad tím, že [dead_character.GetFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] mou vinou."
 death_management.3001.a: "[dead_character.GetFirstNameNoTooltip] si tohle [Select_CString(dead_character.IsFemale,'nezasloužila','nezasloužil')]."
 death_management.3001.c: "Na lítost je příliš pozdě."
 death_management.3001.d: "Odpočívej v pokoji, [dead_character.GetFirstNameNoTooltip]."
 death_management.3002.t: "Dlouhý odpočinek"
 death_management.3002.child: "[dead_character.Custom('MotherFather')|U] je pryč? Proč jsi [Select_CString(dead_character.IsFemale,'odešla','odešel')]? Říkali, že za to nemůžeš, že já jsem důvod, proč jsi [Select_CString(dead_character.IsFemale,'musela','musel')] odejít. Ale to přece nedává žádný smysl. Že ne, [dead_character.GetFirstName]?"
 death_management.3002.like: "Ach, [dead_character.GetFirstName]. I v dospělosti budu vždycky tvým dítětem. Co si mám počít teď, když jsem způsobil[Select_CString(ROOT.Char.IsFemale,'a','')] tvou smrt? Kdo mě obejme, když přes slzy nevidím?"
 death_management.3002.neutral: "Možná mezi námi nikdy nebyla velká blízkost a možná nesu vinu za tvou smrt, [dead_character.GetFirstName], ale vždycky jsi [Select_CString(dead_character.IsFemale,'má','můj')] [dead_character.Custom('MotherFather')].\n\nKdyž jsi opustil[Select_CString(dead_character.IsFemale,'a','')] tento svět, zaplavilo mě tisíc otázek. Bral[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tě jako samozřejmost? Byla tvá smrt chybou, které jsem mohl[Select_CString(ROOT.Char.IsFemale,'a','')] zabránit? [dead_character.GetFirstName]... Opravdu jsi mě [Select_CString(dead_character.IsFemale,'milovala','miloval')]?"
 death_management.3002.dislike: "V žilách mi možná koluje tvá krev, ale [Select_CString(dead_character.IsFemale,'opravdová','opravdový')] [dead_character.Custom('MotherFather')] jsi pro mě nikdy [Select_CString(dead_character.IsFemale,'nebyla','nebyl')]. Tvá smrt mi přinesla jen úlevu a necítím ani vinu za to, že jsem ji způsobil[Select_CString(ROOT.Char.IsFemale,'a','')]. Konečně nade mnou už nevisí tvůj stín."
 death_management.3002.a: "Vždycky tě budu milovat, [dead_character.GetFirstNameNoTooltip]."
 death_management.3002.b: "Asi se to už nikdy nedozvím..."
 death_management.3002.c: "Aspoň je po všem!"
 death_management.3002.d: "[Select_CString(dead_character.IsFemale,'Já... já chci svou matku!','Já... já chci svého otce!')]"
 death_management.3002.tt: "[Select_CString(dead_character.IsFemale,'Tvá matka','Tvůj otec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v tvém žaláři."
 death_management.3006.t: "Přežít svého soka"
 death_management.3006.desc: "Když mi žalářník přinesl tu radostnou zprávu, sotva jsem tomu mohl[Select_CString(ROOT.Char.IsFemale,'a','')] uvěřit! [Select_CString(dead_character.IsFemale,'Má sokyně','Můj sok')] [dead_character.GetTitledFirstName] konečně [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v mém žaláři.\n\nPomyslet, že [dead_character.Custom2('InsultNoun', ROOT.Char)] je konečně pryč a navíc mou zásluhou. Radostí bych snad tančil[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 death_management.3006.a: "Na [Select_CString(dead_character.IsFemale,'jejím','jeho')] mělkém hrobě!"
 death_management.3006.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá','Tvůj')] [Concept('rival',Select_CString(dead_character.IsFemale,'sokyně','sok'))|E] [dead_character.GetFirstNameNoTooltip] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')]!"
 death_management.3008.t: "Všechno, co mohlo být"
 death_management.3008.desc.like: "V představách už se rýsovala naše společná budoucnost — co všechno bychom spolu dokázali a jakou rodinu bychom založili. Všechny ty sny se zhroutily mou vinou, když jsem nechal[Select_CString(ROOT.Char.IsFemale,'a','')] [Select_CString(dead_character.IsFemale,'svou snoubenku','svého snoubence')] zemřít ve svém žaláři."
 death_management.3008.desc.dislike: "Když mi oznámili, že [Select_CString(dead_character.IsFemale,'má snoubenka','můj snoubenec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v mém žaláři, nemohu popřít, že se mi ulevilo. Jsem rád[Select_CString(ROOT.Char.IsFemale,'a','')], že ke sňatku už nedojde!"
 death_management.3008.desc.neutral: "Od chvíle, kdy bylo mé zasnoubení s [dead_character.GetTitledFirstName] oficiálně oznámeno, ve mně představa blížícího se sňatku vyvolávala nadšení i obavy. Teď, když [Select_CString(dead_character.IsFemale,'má snoubenka','můj snoubenec')] zemřel[Select_CString(dead_character.IsFemale,'a','')] v mém žaláři, mi [dead_character.GetFirstName] chybí, přestože jsme se vlastně nikdy pořádně nepoznali. Kdo ví, co všechno jsme spolu mohli mít?"
 death_management.3008.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá snoubenka','Tvůj snoubenec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v tvém žaláři a sňatková dohoda pozbývá platnosti."
 death_management.3008.a: "Odpočívej v pokoji, [dead_character.GetFirstNameNoTooltip]."
 death_management.3008.b: "Přeskočili jsme rovnou k #EMP Dokud nás smrt nerozdělí#!."
 death_management.prisoner.desc: "[Select_CString(dead_character.IsFemale,'Má vězeňkyně','Můj vězeň')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v mém žaláři."
 death_management.4000.t: "Dokud nás smrt nerozdělí"
 death_management.4000.like_opening: "Jak může srdce vydržet takovou bolest a nezlomit se? To přece není možné! A přesto tu jsem, mé srdce stále bije, zatímco tvé umlklo.\n\n"
 death_management.4000.like_my_prison: "Ach, [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')]. [Select_CString(dead_character.IsFemale,'Věřila bys mi','Věřil bys mi')], kdybych ti řekl[Select_CString(ROOT.Char.IsFemale,'a','')], že mi na tobě stále záleží? I po tom všem, co jsem ti provedl[Select_CString(ROOT.Char.IsFemale,'a','')]?"
 death_management.4000.like: "Ach, [dead_character.GetFirstName], [dead_character.Custom('LoverPetName')]. Nemohu dostat z hlavy představu, jak chřadneš v domácím vězení, kam tě [house_arrest_holder.GetTitledFirstName] [Select_CString(house_arrest_holder.IsFemale,'nechala','nechal')] zavřít."
 death_management.4000.neutral_opening: "[Select_CString(dead_character.IsFemale,'Má drahá','Můj drahý')] [dead_character.GetFirstName]. Možná jsem tě nemiloval[Select_CString(ROOT.Char.IsFemale,'a','')], přesto mě tvůj odchod zasáhl mnohem víc, než jsem kdy čekal[Select_CString(ROOT.Char.IsFemale,'a','')].\n\n"
 death_management.4000.neutral_my_prison: "Snad mi dokážeš odpustit mé hříchy. To, co jsem ti udělal[Select_CString(ROOT.Char.IsFemale,'a','')], i všechno, co jsem ti nikdy neřekl[Select_CString(ROOT.Char.IsFemale,'a','')]."
 death_management.4000.neutral: "Vždycky jsi tu [Select_CString(dead_character.IsFemale,'byla','byl')], stále po mém boku. Pomyslet, že jsi [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako vězeň [house_arrest_holder.GetTitledFirstName]... Tolik věcí zůstalo nevyřčeno!"
 death_management.4000.dislike_my_prison: "[Select_CString(dead_character.IsFemale,'Manželko','Manželi')], když jsi jako můj vězeň [Select_CString(dead_character.IsFemale,'naposledy vydechla','naposledy vydechl')], zaplavila mě úleva. Možná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] stydět, ale po pravdě mezi námi žádná láska nebyla. Konečně můžu začít nový život!"
 death_management.4000.dislike: "[Select_CString(dead_character.IsFemale,'Manželko','Manželi')], když jsi jako vězeň [house_arrest_holder.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'naposledy vydechla','naposledy vydechl')], zaplavila mě úleva. Možná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] stydět, ale po pravdě mezi námi žádná láska nebyla. Konečně můžu začít nový život!"
 death_management.4000.a: "Alespoň vzpomínky zůstávají."
 death_management.4000.b: "Snad nalezneš pokoj, [dead_character.GetFirstNameNoTooltip]."
 death_management.4000.c: "Už bylo načase!"
 death_management.4000.tt: "[Select_CString(dead_character.IsFemale,'Tvá manželka','Tvůj manžel')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v domácím vězení."
 death_management.4007.t: "Zvrat osudu"
 death_management.4007.start_my_prison: "Dnes můj vězeň [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] a budoucnost [ROOT.Char.GetPrimaryTitle.GetNameNoTier] se tím změnila. Nikdy se nedozvíme, jak by si [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'vedla','vedl')] jako"
 death_management.4007.start: "Dnes [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako vězeň [house_arrest_holder.GetTitledFirstName] a budoucnost [ROOT.Char.GetPrimaryTitle.GetNameNoTier] se tím změnila. Nikdy se nedozvíme, jak by si [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'vedla','vedl')] jako"
 death_management.4007.mytitle: "[ROOT.Char.GetTitleTierName]"
 death_management.4007.ruler: "[Select_CString(dead_character.IsFemale,'vládkyně','vládce')]"
 death_management.4007.end_adventurer: "ani zda tato smrt přináší [Select_CString(dead_character.IsFemale,'jejím','jeho')] následovníkům požehnání, nebo prokletí."
 death_management.4007.end: "ani zda tato smrt přináší [ROOT.Char.GetPrimaryTitle.GetType.GetName] požehnání, nebo prokletí."
 death_management.4007.end.heir: "\n\nMou jedinou nadějí je, že [Select_CString(new_heir.IsFemale,'má nová dědička','můj nový dědic')] [new_heir.GetTitledFirstName] tento úděl zvládne."
 death_management.4007.a: "Jeden příběh končí a jiný začíná."
 death_management.4007.b: "Snad jsem se rozhodl[Select_CString(ROOT.Char.IsFemale,'a','')] správně."
 death_management.4007.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá dědička','Tvůj dědic')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v domácím vězení."
 death_management.4007.a.tt.heir: "[new_heir.GetTitledFirstName] je [Select_CString(new_heir.IsFemale,'tvá nová dědička','tvůj nový dědic')]."
 death_management.4001.t: "Přežít vlastní dítě"
 death_management.4001.tt: "[Select_CString(dead_character.IsFemale,'Tvá dcera','Tvůj syn')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v domácím vězení."
 death_management.4001.child_my_prison: "Ach, [dead_character.GetTitledFirstName], mé drahé dítě! Snad jsem se rozhodl[Select_CString(ROOT.Char.IsFemale,'a','')] správně, když jsem tě donutil[Select_CString(ROOT.Char.IsFemale,'a','')] strávit poslední dny života v domácím vězení.\n\nCo všechno se už nikdy nenaučíš, nezažiješ ani nedokážeš... "
 death_management.4001.child: "Ach, [dead_character.GetTitledFirstName], mé drahé dítě! Tak nevinné a tak mladé, a přesto jsi musel[Select_CString(dead_character.IsFemale,'a','')] strávit poslední dny života v domácím vězení, kam tě [house_arrest_holder.GetTitledFirstName] [Select_CString(house_arrest_holder.IsFemale,'nechala','nechal')] zavřít?\n\nSvět je vskutku kruté místo... ale alespoň teď vím, že už nikdy nepoznáš jeho nejhorší hrůzy."
 death_management.4001.like: "Ach, [ROOT.Char.GetFaith.HighGodName], jak jsi mohl dopustit, aby mé drahé dítě [dead_character.GetFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v domácím vězení, kam [Select_CString(dead_character.IsFemale,'ji','ho')] [house_arrest_holder.GetTitledFirstName] [Select_CString(house_arrest_holder.IsFemale,'nechala','nechal')] zavřít? [dead_character.GetFirstNameNoTooltip] [Select_CString(dead_character.IsFemale,'byla bez viny, má dokonalá dcera','byl bez viny, můj dokonalý syn')]!\n\nModlím se, aby [dead_character.GetFirstNameNoTooltip] nalezl[Select_CString(dead_character.IsFemale,'a','')] na onom světě pokoj i svobodu."
 death_management.4001.like_my_prison: "Ach, [ROOT.Char.GetFaith.HighGodName], jak jsi mohl dopustit, aby mé drahé dítě [dead_character.GetFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')]? Modlím se, aby [dead_character.GetFirstNameNoTooltip] nalezl[Select_CString(dead_character.IsFemale,'a','')] na onom světě pokoj i sílu mi odpustit."
 death_management.4001.neutral_opening: "[Select_CString(ROOT.Char.IsFemale,'Myslela jsem','Myslel jsem')], že už jsem příliš starý[Select_CString(ROOT.Char.IsFemale,'á','')] na to, aby mě krutosti tohoto světa dokázaly překvapit. Nikdy by mě však nenapadlo, že budu muset přežít vlastní dítě.\n\n"
 death_management.4001.neutral_my_prison: "Přestože [dead_character.GetFirstName] [Select_CString(dead_character.IsFemale,'musela','musel')] strávit poslední chvíle na tomto světě jako můj vězeň, doufám, že teď už nalezl[Select_CString(dead_character.IsFemale,'a','')] pokoj."
 death_management.4001.neutral: "Bolí mě, že [dead_character.GetFirstName] [Select_CString(dead_character.IsFemale,'musela','musel')] strávit poslední chvíle na tomto světě jako vězeň [house_arrest_holder.GetTitledFirstName], ale doufám, že teď už nalezl[Select_CString(dead_character.IsFemale,'a','')] pokoj."
 death_management.4001.dislike_opening: "[Select_CString(ROOT.Char.IsFemale,'Nemá snad matka povinnost milovat své děti?','Nemá snad otec povinnost milovat své děti?')]"
 death_management.4001.dislike_my_prison: "A přesto nedokážu plakat nad tím, že [dead_character.GetFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako můj vězeň."
 death_management.4001.dislike: "A přesto nedokážu plakat nad tím, že [dead_character.GetFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako vězeň [house_arrest_holder.GetTitledFirstName]."
 death_management.4001.dislike_end: "\n\nNěkde jsem [Select_CString(ROOT.Char.IsFemale,'musela','musel')] udělat chybu a nasměrovat své dítě na cestu, kterou jsem nikdy [Select_CString(ROOT.Char.IsFemale,'nemohla','nemohl')] schvalovat. Možná nesu vinu za to, jak [dead_character.GetFirstNameNoTooltip] nakonec [Select_CString(dead_character.IsFemale,'dopadla','dopadl')], ale teď už je to minulost. Konečně."
 death_management.4001.a: "[dead_character.GetFirstNameNoTooltip] si tohle [Select_CString(dead_character.IsFemale,'nezasloužila','nezasloužil')]."
 death_management.4001.c: "Na lítost je příliš pozdě."
 death_management.4001.d: "Odpočívej v pokoji, [dead_character.GetFirstNameNoTooltip]."
 death_management.4002.t: "Dlouhý odpočinek"
 death_management.4002.child: "[Select_CString(dead_character.IsFemale,'Maminko','Tatínku')]? Proč jsi [Select_CString(dead_character.IsFemale,'odešla','odešel')]? Říkali, že za to nemůžeš a že nemám plakat, protože teď už jsi na lepším místě než v domácím vězení, kam tě [house_arrest_holder.GetTitledFirstName] [Select_CString(house_arrest_holder.IsFemale,'nechala','nechal')] zavřít. Ale proč nemůžu jít s tebou, [Select_CString(dead_character.IsFemale,'maminko','tatínku')]? Už mě nemiluješ? Říkal[Select_CString(dead_character.IsFemale,'a','')] jsi, že mě budeš milovat vždycky..."
 death_management.4002.like_opening: "Ach, [Select_CString(dead_character.IsFemale,'maminko','tatínku')]. I v dospělosti budu vždycky tvým dítětem."
 death_management.4002.like_my_prison: "Co si mám počít teď, když jsi [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako můj vězeň? Kdo mě obejme, když přes slzy nevidím? Dokážeš mi někdy odpustit?"
 death_management.4002.like: "Co si mám počít teď, když jsi [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako vězeň [house_arrest_holder.GetTitledFirstName]? Kdo mě obejme, když přes slzy nevidím?"
 death_management.4002.neutral_opening: "Možná jsme si nebyli blízcí, [dead_character.GetFirstName], ale vždycky budeš [Select_CString(dead_character.IsFemale,'má matka','můj otec')]."
 death_management.4002.neutral_my_prison: "Pomyslet, že jsi [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako můj vězeň a zanechal[Select_CString(dead_character.IsFemale,'a','')] ve mně tolik otázek... Bral[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tě jako samozřejmost? Byl[Select_CString(dead_character.IsFemale,'a','')] jsi na mě pyšný[Select_CString(dead_character.IsFemale,'á','')]? [Select_CString(dead_character.IsFemale,'Maminko','Tatínku')]... Opravdu jsi mě [Select_CString(dead_character.IsFemale,'milovala','miloval')]?"
 death_management.4002.neutral: "Pomyslet, že jsi [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako vězeň [house_arrest_holder.GetTitledFirstName] a zanechal[Select_CString(dead_character.IsFemale,'a','')] ve mně tolik otázek... Bral[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tě jako samozřejmost? Byl[Select_CString(dead_character.IsFemale,'a','')] jsi na mě pyšný[Select_CString(dead_character.IsFemale,'á','')]? [Select_CString(dead_character.IsFemale,'Maminko','Tatínku')]... Opravdu jsi mě [Select_CString(dead_character.IsFemale,'milovala','miloval')]?"
 death_management.4002.dislike_opening: "V žilách mi možná koluje tvá krev, ale [Select_CString(dead_character.IsFemale,'opravdovou matkou','opravdovým otcem')] jsi mi nikdy [Select_CString(dead_character.IsFemale,'nebyla','nebyl')]."
 death_management.4002.dislike_my_prison: "Když jsi jako můj vězeň [Select_CString(dead_character.IsFemale,'zemřela','zemřel')], pocítil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem jen úlevu. Konečně nade mnou už nevisí tvůj stín."
 death_management.4002.dislike: "Když jsi jako vězeň [house_arrest_holder.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')], pocítil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem jen úlevu. Konečně nade mnou už nevisí tvůj stín."
 death_management.4002.a: "[Select_CString(dead_character.IsFemale,'Vždycky tě budu milovat, maminko.','Vždycky tě budu milovat, tatínku.')]"
 death_management.4002.b: "Asi se to už nikdy nedozvím..."
 death_management.4002.c: "Odpočívej v pokoji, [Select_CString(dead_character.IsFemale,'maminko','tatínku')]."
 death_management.4002.d: "Já... já chci [Select_CString(dead_character.IsFemale,'svou maminku','svého tatínka')]!"
 death_management.4002.tt: "[Select_CString(dead_character.IsFemale,'Tvá matka','Tvůj otec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v domácím vězení."
 death_management.4008.t: "Všechno, co mohlo být"
 death_management.4008.desc.like_my_prison: "Navzdory svým činům jsem [dead_character.GetTitledFirstName] nikdy nenáviděl[Select_CString(ROOT.Char.IsFemale,'a','')]. Občas jsem si dokonce představoval[Select_CString(ROOT.Char.IsFemale,'a','')] naši společnou budoucnost — co všechno bychom dokázali a jakou rodinu bychom založili. Všechny ty sny se zhroutily, když mi oznámili, že [Select_CString(dead_character.IsFemale,'má snoubenka','můj snoubenec')] zemřel[Select_CString(dead_character.IsFemale,'a','')] jako můj vězeň. Takhle to přece nemělo skončit!"
 death_management.4008.desc.like: "Když mi oznámili, že [Select_CString(dead_character.IsFemale,'má snoubenka','můj snoubenec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako vězeň [house_arrest_holder.GetTitledFirstName], všechny mé sny o společném životě se zhroutily. Nic z toho, co jsem si představoval[Select_CString(ROOT.Char.IsFemale,'a','')], se už nestane. Naše naděje, sny i rodina, kterou bychom založili... Všechno je pryč."
 death_management.4008.desc.dislike: "Když mi oznámili, že [Select_CString(dead_character.IsFemale,'má snoubenka','můj snoubenec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako vězeň [house_arrest_holder.GetTitledFirstName], nemohu popřít, že se mi ulevilo. Samozřejmě mě netěší, že [dead_character.GetFirstNameNoTooltip] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')], ale jsem rád[Select_CString(ROOT.Char.IsFemale,'a','')], že ke sňatku už nedojde. Byl[Select_CString(ROOT.Char.IsFemale,'a','')] bych nešťastný[Select_CString(ROOT.Char.IsFemale,'á','')] a „dokud nás smrt nerozdělí“ je opravdu zatraceně dlouhá doba..."
 death_management.4008.desc.dislike_my_prison: "Když mi oznámili, že [Select_CString(dead_character.IsFemale,'má snoubenka','můj snoubenec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako můj vězeň, nemohu popřít, že se mi ulevilo. Samozřejmě mě netěší, že [dead_character.GetFirstNameNoTooltip] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')], ale jsem rád[Select_CString(ROOT.Char.IsFemale,'a','')], že ke sňatku už nedojde. Byl[Select_CString(ROOT.Char.IsFemale,'a','')] bych nešťastný[Select_CString(ROOT.Char.IsFemale,'á','')] a „dokud nás smrt nerozdělí“ se zdálo být ještě tak daleko..."
 death_management.4008.desc.neutral_my_prison: "Od chvíle, kdy bylo mé zasnoubení s [dead_character.GetTitledFirstName] oficiálně oznámeno, ve mně představa blížícího se sňatku vyvolávala nadšení i obavy. Teď, když [dead_character.GetFirstNameNoTooltip] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako můj vězeň, mi chybí, přestože jsme se vlastně nikdy pořádně nepoznali. Kdo ví, co všechno jsme spolu mohli mít?"
 death_management.4008.desc.neutral: "Od chvíle, kdy bylo mé zasnoubení s [dead_character.GetTitledFirstName] oficiálně oznámeno, ve mně představa blížícího se sňatku vyvolávala nadšení i obavy. Teď, když [dead_character.GetFirstNameNoTooltip] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] jako vězeň [house_arrest_holder.GetTitledFirstName], mi chybí, přestože jsme se vlastně nikdy pořádně nepoznali. Kdo ví, co všechno jsme spolu mohli mít?"
 death_management.4008.a.tt: "[Select_CString(dead_character.IsFemale,'Tvá snoubenka','Tvůj snoubenec')] [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zemřela','zemřel')] v domácím vězení a sňatková dohoda pozbývá platnosti."
 death_management.4008.a: "Odpočívej v pokoji, [dead_character.GetFirstNameNoTooltip]."
 death_management.4008.b: "Přeskočili jsme rovnou k #EMP Dokud nás smrt nerozdělí#!"
 death_management.9998.t: "Poznej sám sebe: Blíží se konec"
 death_management.9998.desc: "Cítím to až v kostech. [ROOT.Char.GetFaith.DeathDeityName] si pro mě brzy přijde. Trpělivě na mě čeká jako starý přítel, aby mě přijal[Select_CString(ROOT.Char.IsFemale,'a','')] na druhé straně."
 death_management.9998.a: "Do roka budu po smrti."
 death_management.9998.a.tt: "Měl bys dát své záležitosti do pořádku."
 death_management.intro.witnessed: "Uprostřed chaosu, který zachvátil bojiště u [battle_death_location.GetNameNoTooltip], se snažím zorientovat."
 death_management.intro.war: "Zprávy z bojiště u [battle_death_location.GetNameNoTooltip] konečně přináší vyčerpaný posel."
 death_management.intro: "Střet mezi [battle_death_enemy.GetPrimaryTitle.GetNameNoTierNoTooltip] a [battle_death_leader.GetPrimaryTitle.GetNameNoTierNoTooltip] mě příliš nezajímal, dokud se přede mnou neobjevila zpráva rady o bitvě u [battle_death_location.GetNameNoTooltip]."
 death_management.intro.enemy: "Přede mnou [dead_character.GetFirstName] vyráží vpřed proti nepříteli.\n\n"
 death_management.intro.friendly: "Na druhé straně bojiště zahlédnu [dead_character.GetFirstName], jak zoufale bojuje.\n\n"
 death_management.intro.letter.lover: "Sevře se mi žaludek strachem o [Select_CString(dead_character.IsFemale,'milenku','milence')], když beru svitek do rukou.\n\n$death_management.intro.letter$"
 death_management.intro.letter.spouse: "Vytrhnu útržek zprávy a horečně hledám zmínku o [Select_CString(dead_character.IsFemale,'své manželce','svém manželovi')].\n\n$death_management.intro.letter$"
 death_management.intro.letter.family: "Okamžitě vím, že [dead_character.GetFirstName] potkalo něco strašného. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_character'))] je na bojišti.\n\n$death_management.intro.letter$"
 death_management.intro.letter.friend: "Nemohu se ubránit obavám o osud [Select_CString(dead_character.IsFemale,'své nejbližší přítelkyně','svého nejbližšího přítele')].\n\n$death_management.intro.letter$"
 death_management.intro.letter.rival: "Ještě než zprávu otevřu, nějak vím, že přináší dobré zprávy.\n\n$death_management.intro.letter$"
 death_management.intro.letter.heir: "Zhluboka se nadechnu; na osudu [Select_CString(dead_character.IsFemale,'mé dědičky','mého dědice')] záleží příliš mnoho.\n\n$death_management.intro.letter$"
 death_management.intro.letter: "Tam, mezi ostatními hlášeními, stojí:\n"
 death_management.death.witnessed.enemy: "Naši [battle_death_leader.Custom('GetRandomEmployedMAA')] na [dead_character.GetFirstName] neúnavně dorážejí a je jasné, že už téměř nemá sil, zatímco kolem padají další bojovníci jako mouchy."
 death_management.death.witnessed.friendly: "[battle_death_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_enemy.Custom('GetRandomEmployedMAA')] pomalu svírají [dead_character.GetFirstName] a vyčerpání je na [Select_CString(dead_character.IsFemale,'ní','něm')] až příliš patrné."
 death_management.death.war.enemy: "„#EMP Potvrzujeme, že [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'padla','padl')] při houževnatém odporu proti [battle_death_leader.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_leader.Custom('GetRandomEmployedMAA')]."
 death_management.death.war.friendly: "„#EMP [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'padla','padl')] v čele útoku proti [battle_death_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_enemy.Custom('GetRandomEmployedMAA')]."
 death_management.death.uninvolved: "„#EMP Potvrzujeme, že [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'padla','padl')] při houževnatém odporu proti [battle_death_leader.GetPrimaryTitle.GetAdjectiveNoTooltip] [battle_death_leader.Custom('GetRandomEmployedMAA')]."
 death_management.killer.witnessed.enemy: "Během několika okamžiků se [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] [battle_death_killer.GetLiege.GetTitledFirstName], odhodlaně vrhá vpřed se zdviženou [battle_death_killer.Custom('signature_weapon')], snadno překonává poslední odpor [dead_character.GetFirstNameNoTooltip] a zasazuje smrtící ránu. "
 death_management.killer.witnessed.friendly: "Náhle mě zaujme záblesk [battle_death_killer.Custom('signature_weapon')] a já sleduji, jak [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] [battle_death_killer.GetLiege.GetTitledFirstName], zasazuje krutou smrtící ránu."
 death_management.killer: "„#EMP [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'padla','padl')] v prudkém střetu rukou [battle_death_killer.GetTitledFirstName], [battle_death_killer.GetLiege.Custom2('RelationToMe', SCOPE.sC('battle_death_killer'))] [battle_death_killer.GetLiege.GetTitledFirstName].#!“"
 death_management.no_killer: "„#EMP [dead_character.GetTitledFirstName] [Select_CString(dead_character.IsFemale,'zasáhla zbloudilá střela a padla','zasáhla zbloudilá střela a padl')] během prudké šarvátky.#!“"
 death_management.1200.t: "[Select_CString(dead_character.IsFemale,'Padlá manželka','Padlý manžel')]"
 death_management.1200.desc_sad: "\n\nNeměl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tě nechat odejít... ne takhle..."
 death_management.1200.desc_happy: "\n\nKonečně je [dead_character.Custom2('InsultNoun', ROOT.Char)] po smrti!"
 death_management.1200.a: "[battle_death_killer.GetFirstNameNoTooltip] [Select_CString(battle_death_killer.IsFemale,'je mrtvá! Mrtvá!','je mrtvý! Mrtvý!')]"
 death_management.1200.b: "Nikdy na tebe nezapomenu..."
 death_management.1200.c: "Prokázal[Select_CString(dead_character.IsFemale,'a','')] jsi svou chrabrost, lásko..."
 death_management.1200.d: "Konečně jsem volný[Select_CString(ROOT.Char.IsFemale,'á','')]!"
 death_management.1201.t: " [Select_CString(dead_character.IsFemale,'Padlá dcera','Padlý syn')]"
 death_management.1201.desc: "\n\nNemohl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tě zachránit... ale žádný rodič by neměl přežít své dítě..."
 death_management.1201.a: "[battle_death_killer.GetFirstNameNoTooltip] z toho nevyvázne!"
 death_management.1201.b: "#EMP [Select_CString(dead_character.IsFemale,'Má statečná dcero','Můj statečný synu')]...#!"
 death_management.1201.c: "Ještě neměl přijít tvůj čas, dítě moje..."
 death_management.1201.d: "Odpočívej v pokoji, dítě."
 death_management.1202.t: "Padlý rodič"
 death_management.1202.desc: "\n\nNa změnu je už příliš pozdě. Doufám jen, že [dead_character.GetFaith.PositiveAfterLife] přinese [dead_character.GetFirstNameNoTooltip] pokoj."
 death_management.1202.a: "#EMP [Select_CString(dead_character.IsFemale,'Proč právě ty, maminko?','Proč právě ty, tatínku?')]#!"
 death_management.1202.b: "[battle_death_killer.GetFirstNameNoTooltip] zaplatí."
 death_management.1204.t: "[Select_CString(dead_character.IsFemale,'Padlá milenka','Padlý milenec')]"
 death_management.1204.desc: "\n\nSrdce mi tuhne, když mi dochází, že už nikdy nepocítím teplo milovaného objetí..."
 death_management.1204.a: "#EMP Statečný[Select_CString(dead_character.IsFemale,'á','')] [dead_character.GetFirstNameNoTooltip]#!..."
 death_management.1204.b: "...budeš pomstěn[Select_CString(dead_character.IsFemale,'a','')]!"
 death_management.1205.t: "[Select_CString(dead_character.IsFemale,'Padlá přítelkyně','Padlý přítel')]"
 death_management.1205.desc: "\n\nUž nikdy spolu nestrávíme chvíle, kterých jsem si tolik cenil[Select_CString(ROOT.Char.IsFemale,'a','')]..."
 death_management.1205.a: "Jen ne [dead_character.GetFirstNameNoTooltip]!"
 death_management.1205.b: "[battle_death_killer.GetFirstNameNoTooltip] za to zaplatí!"
 death_management.1206.t: "[Select_CString(dead_character.IsFemale,'Padlá sokyně','Padlý sok')]"
 death_management.1206.desc: "\n\nNemohu se ubránit úšklebku při pomyšlení, že [dead_character.GetFirstNameNoTooltip] [Select_CString(dead_character.IsFemale,'padla','padl')] v #EMP mých#! válkách. Ještě několik dní mi to bude zvedat náladu!"
 death_management.1206.a: "Aspoň je po všem."
 death_management.1206.b: "[dead_character.GetFirstNameNoTooltip] [Select_CString(dead_character.IsFemale,'měla','měl')] připadnout mně!"
 death_management.1206.c: "Můj #EMP hrdina!#! Pošlu [battle_death_killer.GetFirstNameNoTooltip] květinu — [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')]!"
 death_management.1207.t: "[Select_CString(dead_character.IsFemale,'Padlá dědička','Padlý dědic')]"
 death_management.1207.desc: "\n\nNástupnictví [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] je třeba znovu vyřešit..."
 death_management.1207.a: "Ještě jsi nebyl[Select_CString(dead_character.IsFemale,'a','')] připraven[Select_CString(dead_character.IsFemale,'á','')]..."
 death_management.1207.b: "...ale [battle_death_killer.GetFirstNameNoTooltip] také ne!"
