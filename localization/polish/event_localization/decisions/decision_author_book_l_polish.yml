 author_book.1000.t: "[newly_created_artifact.GetNameNoTooltip]"
 author_book.1000.poem_intro.desc: "[Select_CString(trusted_influencer.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] [trusted_influencer.GetFirstName] poslouchá, jak recituji svou nově složenou báseň, a já se nemohu ubránit jisté hrdosti na to, čeho jsem dosáhl. Jejím tématem je [SCOPE.Custom('GetCiPoemTheme')] a mám pocit, že je ještě nikdo nezachytil právě tímto způsobem. S očekáváním pohlédnu na [trusted_influencer.GetFirstNameNoTooltip] a čekám na hodnocení svého díla.\n\n"
 author_book.1000.poem_weak.desc: "„Všechno má svou krásu, ale ne každý ji vidí,“ pronese [trusted_influencer.GetFirstNameNoTooltip] s něčím, co snad musí být uznání.\n\nMožná tato nová báseň přece jen není tak skvělá, jak jsem doufal."
 author_book.1000.poem_mid.desc: "„Dojemné dílo.“ [trusted_influencer.GetFirstNameNoTooltip] se na mě po tichu, které jako by trvalo celou věčnost, uznale podívá."
 author_book.1000.poem_great.desc: "„Osvoj si nové poznání při rozjímání nad starým a můžeš se stát učitelem ostatních.“ [trusted_influencer.GetFirstNameNoTooltip] mé nové dílo zjevně oceňuje."
 author_book.1000.prose_intro.desc: "Polemické psaní by mělo být každému učenci vlastní. Ve svém textu na téma [SCOPE.Custom('GetProseTheme')] jsem si mohl procvičit schopnost podpírat hlavní tvrzení vhodnými příklady.\n\n"
 author_book.1000.prose_weak.desc: "„Tvé úvahy jsou správné, ale na několika místech je ještě co zlepšovat,“ říká [trusted_influencer.GetFirstName], [Select_CString(trusted_influencer.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))]. Ve zjevné snaze mě povzbudit pak začne rozebírat některé postřehy v mém textu, které by podle něj mohli čtenáři přehlédnout."
 author_book.1000.prose_mid.desc: "„Je to zdařilý text, podstatu problému se ti podařilo vystihnout velmi dobře,“ říká [trusted_influencer.GetFirstName], [Select_CString(trusted_influencer.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))] a první čtenář mého díla."
 author_book.1000.prose_great.desc: "„Dokážeš se vyjadřovat s jasností, jakou v naší době ovládá jen málokdo!“ prohlásí [trusted_influencer.GetFirstName], [Select_CString(trusted_influencer.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))].\nJe zřejmé, že se mi svými slovy podařilo vzbudit skutečné emoce."
 author_book.1000.scholarship_intro.desc: "Nebyla to krátká práce, ale konečně jsem u cíle. Má nová monografie je hotová a jejím oborem je [SCOPE.Custom('GetMonographTopic')]. Čas strávený studiem související literatury mi poskytl hlubší znalosti tohoto tématu než kdy dříve.\n\n"
 author_book.1000.scholarship_weak.desc: "„Významný milník tvé dráhy!“ prohlásí [trusted_influencer.GetFirstName], [Select_CString(trusted_influencer.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))], a v očích vidím jistou hrdost. Přesto přemýšlím, zda by se mi při druhém pokusu nepodařilo odvést ještě lepší práci."
 author_book.1000.scholarship_mid.desc: "„Zdařilá a poučná kniha, kterou budu doporučovat ostatním!“ prohlásí po dočtení [trusted_influencer.GetFirstName], [Select_CString(trusted_influencer.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))].\nSe svou prací bych měl být spokojený, přesto se nemohu ubránit pocitu, že bych v budoucnu dokázal napsat ještě něco lepšího."
 author_book.1000.scholarship_great.desc: "„Přelomové dílo, které tvé jméno staví po bok největších autorů naší doby!“\nPo dočtení díla to prohlásí jeho první čtenář, [trusted_influencer.GetFirstName], [Select_CString(trusted_influencer.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))]. Na tento úspěch jen tak nezapomenu."
 author_book.1000.a: "Tato zkušenost mě mnohému naučila."
 author_book.1000.b: "Dobře odvedená práce."
 author_book.1000.c: "Je zřejmé, že na to mám."
 author_book.1000.d: "„Toto bude můj dar pro tebe!“"
