 prose_quality_great: "Prostý literární styl svědčí o mimořádném mistrovství jazyka. Argumenty jsou předloženy způsobem, který by zapůsobil na kteréhokoli současného autora."
 author_book.0005.t: "Popis světa"
 author_book.0005.desc: "S velkým úsilím může mysl proniknout k významu skrytému v samotné podstatě světa. Skutečně tyto poznatky popsat a uspořádat do textu, z něhož se mohou učit ostatní, je však ještě větší úkol, mnohem namáhavější a časově náročnější.\n\nKdyž usedám k přípravě nové monografie, musím se rozhodnout, na kterou oblast se zaměřím. Matematika i geografie jsou hodnotnými obory a zajímají také mnoho mých současníků."
 author_book.0005.a: "Geografie"
 author_book.0005.a.tt: "Kvalita této knihy bude silně záviset na tvých zkušenostech s [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
