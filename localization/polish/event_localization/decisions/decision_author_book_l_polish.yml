 author_book.0001.t: "Básnická ctnost"
 author_book.0001.desc: "Jen málokterý žánr je tak čistý a proměnlivý jako [Glossary( 'poezie cí', 'CI_GLOSS' )]. Jednotlivé sloky mohou zachycovat různá témata či emoce, což mým oblíbeným básníkům umožňuje vyjadřovat hluboké city stručně a krásně.\n\nTeď, když nadešel čas zasadit vlastní slova do melodie, musím pečlivě zvolit, kterou použiji."
 CI_GLOSS: "#bold Poezie cí#! — Forma poezie, která získávala stále větší oblibu za dynastií Tchang a Sung.\nBásně jsou určeny ke zpěvu a jejich témata se rozvíjejí ve slokách různé délky přizpůsobených příslušné melodii.\n\nJelikož básně cí často přebírají znaky ze starších básní, jejich doslovný význam může být bez dostatečného vzdělání nejasný."
 author_book.0001.a: "Zvolím tuto melodii: #italic [SCOPE.Custom('GetCiPoemName')]#!"
 author_book.0001.a.tt: "Název mé básně bude #italic [SCOPE.Custom('GetCiPoemName')]#!"
 author_book.0001.b: "Poradím se. [trusted_influencer.GetShortUINameNoTooltip] je můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('trusted_influencer'))]"
 author_book.0001.b.tt: "[trusted_influencer.GetShortUIName] vybere melodii pro báseň"
 paid_me_respect: "Projevil mi úctu"
 author_book.0004.t: "O ctnosti v naší době"
 author_book.0004.desc: "Když usedám ke stolu, abych promyslel dílo, které mě čeká, můj pohled padne na [Glossary( 'Čtyři poklady studovny', 'FOUR_TREASURES')]. Jsou to nástroje mého řemesla. S jejich pomocí mohu uplatnit rozum a předávat poznání ostatním.\n\nO čem bych však měl psát?\n\nMohl bych vrhnout nové světlo na události minulosti, nebo se pustit do něčeho současnějšího a na nedávné události rozebrat příklady ctnostného jednání."
