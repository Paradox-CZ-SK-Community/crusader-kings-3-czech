l_polish:
 hold_court_decision: "Pořádat audienci"
 hold_court_decision_desc: "Chci-li být úspěšným vládcem, musím skutečně rozhodovat o nejrůznějších sporech a záležitostech, které vyvstávají v oblasti mého vlivu.\n\nOficiálně pozvu všechny své poddané, aby přicestovali do mého [ROOT.Char.Custom('ResidenceBuilding')] a předložili mi své žádosti o pomoc. Budu tak mít přehled o dění, moci ovlivňovat rovnováhu sil a jasně ukážu světu, že zde vládnu já."
 hold_court_decision_tooltip: "Uplatni svou autoritu [Concept('holding_court','pořádáním audience')|E]"
 hold_court_decision_effects: "Pozveš své hosty a poddané, aby tě žádali o pomoc:\n$EFFECT_LIST_BULLET$ Můžeš se dozvědět o jedinečných příležitostech\n$EFFECT_LIST_BULLET$ Můžeš získat možnost ovlivnit dění v cizích panstvích\n$EFFECT_LIST_BULLET$ Můžeš získat další velkolepost dvora\n$EFFECT_LIST_BULLET$ Můžeš získat či ztratit mínění, prestiž, zlato a další"
 hold_court_decision_confirm: "Vyslechnout žadatele"
 hold_court_gain_grandeur_tooltip: "Zvýšíš svou [Concept('court_grandeur','velkolepost dvora')|E]"
 hold_court_gain_legitimacy_tooltip: "Zvýšíš svou [Concept('legitimacy','legitimitu')|E]"
