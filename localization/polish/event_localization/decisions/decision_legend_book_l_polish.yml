l_polish:
 ce1_decision_events.0001.t: "Zapsat pro budoucí věky"
 ce1_decision_events.0001.desc: "[chronicler.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))], mě vítá spokojeným úsměvem. Olej ve čtecí lampě už téměř došel.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ pronese a odloží nádherně zdobenou knihu, „postarali jsme se, aby nám neunikla jediná maličkost, jediný čin, jediná bitva, jediné dobrodružství ani jediná romance.“\n\n„Všechno,“ pokračuje, „je zaznamenáno pro budoucí věky.“"
 ce1_decision_events.0001.a: "Nádhera!"
 legend_book: "[ROOT.Var('finished_legend_var').Legend.GetName]"
 legend_book_desc: "#EMP [ROOT.Var('finished_legend_var').Legend.GetChapterDescriptionByName('opening')]#!\n\n#EMP Legenda, jejímž hrdinou je [ROOT.Var('finished_legend_var').Legend.GetProtagonist.GetTitledFirstNameNoTooltip], vrcholí podivuhodným dobrodružstvím. [ROOT.Var('finished_legend_var').Legend.GetProtagonist.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Var('finished_legend_var').Legend.GetProtagonist.IsFemale, 'vykonala', 'vykonal')] tak velkolepé válečné činy, že nad nimi žasli všichni králové a mnozí šlechtici i prostí lidé přicházeli na setkání, neboť chtěli spatřit živoucí legendu na vlastní oči.#!\n\n#EMP [ROOT.Var('finished_legend_var').Legend.GetChapterDescriptionByName('conclusion')]#!"
