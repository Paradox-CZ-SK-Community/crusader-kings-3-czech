l_polish:
 pledge_loyalty_to_liege_decision: "Přísaha věrnosti: [GetPlayer.GetLiege.GetTitleTierName|U]"
 pledge_loyalty_to_liege_decision_desc: "Musím u dvora [GetPlayer.GetLiege.GetTitleTierName|U] formálně a veřejně přísahat věrnost. Pokud tak neučiním, bude to považováno za urážku a zpochybnění vlády mého lenního pána."
 pledge_loyalty_to_liege_decision_tooltip: "Formálně #V Přísahat věrnost#! svému [Concept('liege','lennímu pánovi')|E] u jeho [Concept('court','dvora')|E]"
 pledge_loyalty_to_liege_decision_effects: "Vydáš se ke dvoru, kde [THIS.Char.GetLiege.GetTitledFirstName] přijme tvou formální poklonu"
 pledge_loyalty_to_liege_decision_confirm: "$pledge_loyalty_to_liege_decision$"
 pledge_loyalty_to_liege_decision_second_tooltip: "$DESC$\n$pledge_loyalty_to_liege_grace_tt$"
 pledge_loyalty_to_liege_grace_tt: "#weak Stejnému lennímu pánovi můžeš #V Přísahat věrnost#! pouze jednou#!"
 pledge_loyalty_to_liege_gift_warning_effect: "#weak Dary zvyšují odměny za #V Přísahu věrnosti#!#!\n$pledge_loyalty_to_liege_grace_tt$"
 pledge_loyalty_to_liege_grace_valid_tt: "[THIS.Char.GetLiege.GetTitledFirstName] jsi dosud nepřísahal věrnost"
 pledge_loyalty_to_liege_DECISION_NEXT_STEP_BUTTON: "Vybrat dar"
 pledge_loyalty_to_liege_available_adult_tt: "Dostupná dospělá postava"
 pledge_loyalty_to_liege_available_liege_tt: "[ROOT.Char.GetLiege.GetTitledFirstName] musí být dostupnou dospělou postavou"
 pledge_loyalty_to_liege_decision_option_submission: "Projevit podřízenost\n#low Nedat nic#!"
 pledge_loyalty_to_liege_submission_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] obdrží pouze projev tvé podřízenosti"
 pledge_loyalty_to_liege_submission_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_decision_option_gold: "...a přinést dary\n#low Dát [Concept('gold','zlato')|E]#!"
 pledge_loyalty_to_liege_gold_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] od tebe obdrží dar v podobě [Concept('gold','zlata')|E]"
 pledge_loyalty_to_liege_gold_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_decision_effects_gold: "Tvůj [Concept('liege','lenní pán')|E] od tebe obdrží dar v podobě [Concept('gold','zlata')|E]"
 pledge_loyalty_to_liege_gold_tt: "#X Nemáš dostatek [Concept('gold','zlata')|E]#!"
 pledge_loyalty_to_liege_decision_option_hook: "...a slíbit protislužbu\n#low Dát [Concept('hook','páku')|E]#!"
 pledge_loyalty_to_liege_hook_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] na tebe získá slabou [Concept('hook','páku')|E]"
 pledge_loyalty_to_liege_hook_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_decision_effects_hook: "Tvůj [Concept('liege','lenní pán')|E] na tebe získá silnou [Concept('hook','páku')|E]"
 pledge_loyalty_to_liege_hook_tt: "#X Tvůj [Concept('liege','lenní pán')|E] už na tebe má [Concept('hook','páku')|E]#!"
 pledge_loyalty_to_liege_decision_option_contract: "...a zvýšit povinnosti\n#low Zvýšit povinnosti z [Concept('vassal_contract','vazalské smlouvy')|E]#!"
 pledge_loyalty_to_liege_contract_desc: "[ROOT.Char.GetLiege.GetTitledFirstName] od tebe bude díky [Concept('vassal_contract','vazalské smlouvě')|E] dostávat vyšší daně nebo více odvedenců"
 pledge_loyalty_to_liege_contract_tooltip: "$pledge_loyalty_to_liege_decision_second_tooltip$"
 pledge_loyalty_to_liege_decision_effects_contract_gold: "Tvůj [Concept('liege','lenní pán')|E] od tebe bude dostávat více [Concept('taxes','daní')|E]"
 pledge_loyalty_to_liege_decision_effects_contract_levies: "Tvůj [Concept('liege','lenní pán')|E] od tebe bude dostávat více [Concept('levies','odvedenců')|E]"
 pledge_loyalty_to_liege_contract_modifiable_tt: "#X Tvá [Concept('vassal_contract','vazalská smlouva')|E] byla změněna příliš nedávno#!"
 pledge_loyalty_to_liege_contract_increasable_tt: "#X Tvé [Concept('taxes','daně')|E] ani [Concept('levies','odvedence')|E] nelze zvýšit#!"
 pledge_loyalty_to_liege_costs_refunded: "Náklady na $pledge_loyalty_to_liege_decision$ byly vráceny"
 pledge_loyalty_to_liege_header: "Přísaha věrnosti:"
 pledge_loyalty_to_liege.0001.opening: "[pledge_loyalty_to_liege_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 pledge_loyalty_to_liege.0001.desc: "Přicházím do [pledge_loyalty_to_liege_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], abych ti, slavný [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip], vzdal hold na důkaz své věrnosti. \n\n"
 pledge_loyalty_to_liege.0001.desc.submission: "Doufám, že samotná má přísaha poddanosti bude dostatečným důkazem mé cti."
 pledge_loyalty_to_liege.0001.desc.gold: "Přináším ti bohaté dary hodné tvého majestátu na znamení své dobré vůle a oddanosti."
 pledge_loyalty_to_liege.0001.desc.hook: "Dávám ti své slovo, že splním vše, co si ode mě budeš přát, můj [pledge_loyalty_to_liege_scope.GetLadyLord]."
 pledge_loyalty_to_liege.0001.desc.contract: "Na znamení tvé svrchovanosti a své věrnosti se jako tvůj vazal zavazuji k větším povinnostem."
 pledge_loyalty_to_liege.0001.a: "Oplať tuto poctu obvyklými projevy přízně."
 pledge_loyalty_to_liege.0001.b: "Nedávej [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip] nic na oplátku."
 pledge_loyalty_to_liege.0001.c: "Oplať dary [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip] ještě štědřejšími."
 pledge_loyalty_to_liege.0001.c.insulted: "#EMP [pledge_loyalty_to_liege_vassal.GetShortUIName] to bude považovat za urážku!#!"
 pledge_loyalty_to_liege.0001.c.honored: "#EMP [pledge_loyalty_to_liege_vassal.GetShortUIName] to bude považovat za poctu!#!"
 pledge_loyalty_to_liege.0101.t: "$pledge_loyalty_to_liege_header$ Pokleknutí"
 pledge_loyalty_to_liege.0101.desc: "Trpělivě čekám na svém trůnu na příchod [pledge_loyalty_to_liege_vassal.GetTitledFirstName], jehož příchod je záhy ohlášen a jenž je uveden přede mě. \n\n"
 pledge_loyalty_to_liege.0101.desc.submission: "[pledge_loyalty_to_liege_vassal.GetTitledFirstName] přede mnou uctivě pokleká a nenabízí nic než přísahu, že bude věrně sloužit jako vazal [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0101.desc.gold: "[pledge_loyalty_to_liege_vassal.GetTitledFirstName] přede mnou uctivě pokleká, zatímco služebnictvo přináší dary v podobě mincí a vzácných předmětů. Přísaha je složena a písaři zaznamenávají závazek sloužit [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0101.desc.hook: "[pledge_loyalty_to_liege_vassal.GetTitledFirstName] přede mnou uctivě pokleká a vedle dalších přísah, jimiž se zavazuje sloužit [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip], se mi dává plně k dispozici a zavazuje se mi protislužbou.\n\n"
 pledge_loyalty_to_liege.0101.desc.contract: "[pledge_loyalty_to_liege_vassal.GetTitledFirstName] přede mnou uctivě pokleká a vedle dalších přísah, jimiž se zavazuje sloužit [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetNameNoTooltip], mi jako vazal [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] nabízí vyšší odvody.\n\n"
 pledge_loyalty_to_liege.0101.desc.success: "Nakonec vyzvu [pledge_loyalty_to_liege_vassal.GetTitleAsNameNoTooltip], aby povstal, dávám najevo svou spokojenost a potvrzuji práva [pledge_loyalty_to_liege_vassal.GetFirstNameNoTooltip] k zemím, které spravuje mým jménem."
 pledge_loyalty_to_liege.0101.smooth.submission: "„Služ mi dobře, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].“"
 pledge_loyalty_to_liege.0101.smooth.gold: "„Přijímám tvé štědré dary, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].“"
 pledge_loyalty_to_liege.0101.smooth.hook: "„Jsem rád, že se na tebe mohu obrátit, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].“"
 pledge_loyalty_to_liege.0101.smooth.contract: "„Tvé služby jsou neocenitelné, [pledge_loyalty_to_liege_vassal.GetTitledFirstNameNoTooltip].“"
 pledge_loyalty_to_liege.0009.opening: "[pledge_loyalty_to_liege_scope.Custom2('AppropriateGreeting', ROOT.Char )]"
 pledge_loyalty_to_liege.0009.desc: "Tvým [pledge_loyalty_to_liege_vassal.Custom2('InsultAdjective', SCOPE.sC('pledge_loyalty_to_liege_scope'))] představením mě neoklameš; tvůj hold pro mě nic neznamená."
 pledge_loyalty_to_liege.0009.a: "To je nehorázné!"
 pledge_loyalty_to_liege.0201.t: "$pledge_loyalty_to_liege_header$ Pokleknutí"
 pledge_loyalty_to_liege.0201.desc: "Služebnictvo mě uvádí do velkého sálu v [pledge_loyalty_to_liege_scope.GetCapitalLocation.GetNameNoTooltip], kde [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] sedí na trůnu a čeká, až složím svou přísahu.\n\n"
 pledge_loyalty_to_liege.0201.desc.success: "Poklekám u nohou svého [pledge_loyalty_to_liege_scope.GetLadyLord] a skládám četné přísahy věrnosti, zatímco písaři zaznamenávají celý obřad.\n\n"
 pledge_loyalty_to_liege.0201.desc.submission: "Tím je obřad u konce; [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] nemohu nabídnout nic než svůj slib, že budu věrně sloužit jako vazal [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0201.desc.gold: "Poté přicházejí mí průvodci a před shromážděným dvorem předkládají [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] mé bohaté dary."
 pledge_loyalty_to_liege.0201.desc.gold.received_as_expected: " Jak je zvykem, na oplátku dostávám několik symbolických darů, které mají upevnit naše vztahy do budoucna.\n\n"
 pledge_loyalty_to_liege.0201.desc.gold.received_more: "\n\nJak jsem očekával, [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] mi nabízí dary na oplátku, ale stále přicházejí další a další! Po dlouhé chvíli zjišťuji, že mě obklopuje ještě větší bohatství, než jaké jsem sám přinesl. Dvořané kolem nás se snaží skrýt své zděšení nad tímto porušením náležitého protokolu a nevědí, zda mě [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] odměňuje, podplácí, nebo se jen okázale chlubí svou mocí a bohatstvím.\n\n"
 pledge_loyalty_to_liege.0201.desc.gold.received_nothing: "\n\nKlečím už nepříjemně dlouho, než mi dojde, že [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] mi žádné z obvyklých darů na oplátku nedá. Dvořané kolem nás působí rozpačitě a nevědí, zda se palácová pokladnice vyprazdňuje, nebo zda ze mě chce [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] udělat odstrašující příklad.\n\n"
 pledge_loyalty_to_liege.0201.desc.hook: "Poté přichází můj slib, že jako věrný stoupenec [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip] budu připraven splnit jakoukoli protislužbu, o kterou budu požádán.\n\n"
 pledge_loyalty_to_liege.0201.desc.contract: "Poté přichází můj dar; na znamení své věrnosti a pro dobro koruny se zavazuji zvýšit své odvody [pledge_loyalty_to_liege_scope.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n"
 pledge_loyalty_to_liege.0201.desc.brush_off: "K mému překvapení se [pledge_loyalty_to_liege_scope.GetFirstNameNoTooltip] chová téměř, jako by se nic nestalo, a můj hold přijímá s grácií.\n\n"
 pledge_loyalty_to_liege.0201.desc.outro: "[pledge_loyalty_to_liege_scope.GetFirstNameNoTooltip] mě vyzývá, abych povstal, dává najevo svou spokojenost a potvrzuje má práva k zemím, které spravuji jeho jménem."
 pledge_loyalty_to_liege.0201.smooth.submission: "Sláva [pledge_loyalty_to_liege_scope.GetTitleAsNameNoTooltip]."
 pledge_loyalty_to_liege.0201.smooth.gold: "Cena věrnosti..."
 pledge_loyalty_to_liege.0201.smooth.hook: "Snad půjde jen o drobnou protislužbu..."
 pledge_loyalty_to_liege.0201.smooth.contract: "Břemeno služby..."
 pledge_loyalty_to_liege.0201.faux_pas: "Nakonec je to přece jen spravedlivý lenní pán."
 pledge_loyalty_to_liege.0201.insult: "Neměl jsem sem vůbec chodit."
 pledge_loyalty_to_liege.0601.t: "$pledge_loyalty_to_liege_header$ Zrušeno"
 pledge_loyalty_to_liege.0601.desc.court: "Má korunovace na [ROOT.Char.GetTitleAsNameNoTooltip] je u konce, takže mé přípravy na vzdání holdu už nejsou potřeba..."
 pledge_loyalty_to_liege.0601.desc.imprisoned_me: "$pledge_loyalty_to_liege.0601_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] mě uvrhl do žaláře."
 pledge_loyalty_to_liege.0601.desc.imprisoned: "$pledge_loyalty_to_liege.0601_shared_intro$ zajal mě [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
 pledge_loyalty_to_liege.0601.desc.liege_dead_me: "$pledge_loyalty_to_liege.0601_shared_intro$ nakonec jsem zabil [pledge_loyalty_to_liege_scope.GetTitledFirstName]... \n\n"
 pledge_loyalty_to_liege.0601.desc.liege_dead: "$pledge_loyalty_to_liege.0601_shared_intro$ [pledge_loyalty_to_liege_scope.GetTitledFirstName] [pledge_loyalty_to_liege_scope.GetDeathReasonHideKiller]... \n\n"
 pledge_loyalty_to_liege.0601.desc.liege_imprisoned_me: "$pledge_loyalty_to_liege.0601_shared_intro$ nakonec jsem zajal [pledge_loyalty_to_liege_scope.GetTitledFirstName]!"
 pledge_loyalty_to_liege.0601.desc.liege_imprisoned: "$pledge_loyalty_to_liege.0601_shared_intro$ [pledge_loyalty_to_liege_scope.GetTitledFirstName] padl do zajetí [pledge_loyalty_to_liege_scope.GetImprisonedBy.GetTitledFirstName]."
 pledge_loyalty_to_liege.0601.desc.new_liege: "Mám-li přísahat věrnost, musím tak učinit svému novému lennímu pánovi, kterým je [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 pledge_loyalty_to_liege.0601_shared_intro: "Právě když jsem dokončoval poslední přípravy ke složení přísahy věrnosti,"
 pledge_loyalty_to_liege.0601.desc: "\n\nTohle rozhodně mění situaci."
 pledge_loyalty_to_liege.0601.a_court: "Vzhůru za většími věcmi."
 pledge_loyalty_to_liege.0601.a_prison: "K čertu."
 pledge_loyalty_to_liege.0601.a_liege: "To je k vzteku..."
 pledge_loyalty_to_liege.0601.a: "Je čas všechno přehodnotit..."
 pledge_loyalty_to_liege_overdue.1000.t: "Vazal beze cti"
 pledge_loyalty_to_liege_overdue.1000.desc.1: "Když procházím záznamy těch, kteří mi přišli přísahat věrnost, neboť jsem jejich [ROOT.Char.GetTitleAsName], nápadně v nich chybí jedno jméno, [SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] z dynastie [SCOPE.sC('pledge_loyalty_to_liege_offender').GetDynasty.GetName]. Uplynulo už více než [SCOPE.sC('pledge_loyalty_to_liege_offender').MakeScope.Var('pledge_loyalty_to_liege_found_overdue_years').GetValue|0] let "
 pledge_loyalty_to_liege_overdue.1000.desc.new_liege: "od mého nástupu na trůn, "
 pledge_loyalty_to_liege_overdue.1000.desc.new_title: "od chvíle, kdy se [SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] [Select_CString(SCOPE.sC('pledge_loyalty_to_liege_offender').IsFemale, 'stala mou vazalkou', 'stal mým vazalem')], "
 pledge_loyalty_to_liege_overdue.1000.desc.2: "a přesto z [Select_CString(SCOPE.sC('pledge_loyalty_to_liege_offender').IsFemale, 'jejích', 'jeho')] zemí nedorazila jediná zpráva ani poplatek.\n\nMí dvořané si vyměňují neklidné pohledy. Sály se plní šeptem. Je to pouhé opomenutí, nebo úmyslná urážka mého práva vládnout? Ve vzduchu těžce visí nevyslovený vzdor."
 pledge_loyalty_to_liege_overdue.1000.a: "Vyšli posla a požaduj okamžitý příchod."
 pledge_loyalty_to_liege_overdue.1000.a.tt: "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] obdrží dopis připomínající povinnosti vůči tobě. Podle odpovědi možná získáš možnost [Concept('usurp','uzurpovat')|E] [Select_CString(SCOPE.sC('pledge_loyalty_to_liege_offender').IsFemale, 'její', 'jeho')] [Concept('titles','tituly')|E]."
 pledge_loyalty_to_liege_overdue.1000.b: "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] má nejspíš jen moc práce."
 pledge_loyalty_to_liege_overdue.1000.b.tt: "[SCOPE.sC('pledge_loyalty_to_liege_offender').GetTitledFirstName] budou tyto povinnosti prominuty."
 pledge_loyalty_to_liege_overdue.1010.t: "Čest velí"
 pledge_loyalty_to_liege_overdue.1010.desc.new_liege: "[ROOT.Char.GetLiege.GetPrimaryTitle.GetName] nyní vládne [ROOT.Char.GetLiege.GetTitledFirstName], a "
 pledge_loyalty_to_liege_overdue.1010.desc.new_title: "Jako [ROOT.Char.GetTitleTierName|U] [ROOT.Char.GetPrimaryTitle.GetName] a vazal [ROOT.Char.GetLiege.GetPrimaryTitle.GetName] "
 pledge_loyalty_to_liege_overdue.1010.desc: "nadešel čas vydat se na cestu, vzdát náležitou úctu a znovu potvrdit svou věrnost a oddanost.\n\nPokud tak včas neučiním, může to být považováno za nečestné jednání, nebo ještě hůře za projev úmyslu vzbouřit se."
 pledge_loyalty_to_liege_overdue.1010.a: "Vyraz okamžitě a pospěš si!"
 pledge_loyalty_to_liege_overdue.1010.a.tt: "Otevře panel [Concept('decision','rozhodnutí')|v] #V Přísaha věrnosti: [GetPlayer.GetLiege.GetTitleTierName|U]#!"
 pledge_loyalty_to_liege_overdue.1010.b: "[ROOT.Char.GetLiege.GetTitleAsName] bude muset počkat."
 pledge_loyalty_to_liege_overdue.1010.b.tt: "Pokud budeš otálet příliš dlouho, tvé [Concept('titles','tituly')|E] ti mohou být [Concept('revoked','odebrány')|E]!"
 pledge_loyalty_to_liege_overdue.1020.t: "[spurned_liege.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 pledge_loyalty_to_liege_overdue.1020.desc: "Neuniklo mé pozornosti, že ses nedostavil k mému dvoru. Čest ti velí toto opomenutí neprodleně napravit.\n\nBudeš-li nadále zanedbávat svou povinnost, možná budu nucen zasáhnout, abych zachoval soulad a pořádek ve svém panství."
 pledge_loyalty_to_liege_overdue.1020.a: "Vyraz okamžitě a pospěš si!"
 pledge_loyalty_to_liege_overdue.1020.a.tt: "Otevře panel [Concept('decision','rozhodnutí')|v] #V Přísaha věrnosti: [GetPlayer.GetLiege.GetTitleTierName|U]#!\n$pledge_loyalty_to_liege_overdue.1020.b.tt$"
 pledge_loyalty_to_liege_overdue.1020.b: "Hrozby pomíjivé jako třešňové květy ve větru."
 pledge_loyalty_to_liege_overdue.1020.b.tt: "Pokud budeš otálet příliš dlouho, tvé [Concept('titles','tituly')|E] ti mohou být [Concept('revoked','odebrány')|E]!"
 pledge_loyalty_to_liege_overdue.1020.c: "Znehodnoť pečeť a pošli dopis zpět."
 pledge_loyalty_to_liege_overdue.1020.c.tt: "[SCOPE.sC('spurned_liege').GetName] se může pokusit [Concept('revoke','odebrat')|E] tvé [Concept('titles','tituly')|E]!"
