l_polish:
 middle_east_decisions.0001.t: "Nebeská říše"
 middle_east_decisions.0001.desc: "Od vzestupu Mohameda představuje islám na celém Východě mocnou sílu a trvalou hrozbu pro vyznavače Krista. Díky mému úsilí o zabezpečení Svaté země tomu však již tak není. \n\nVyhnal jsem nevěřící od středomořského pobřeží a pronásledoval je až za spalující pouště Arábie. Od moře k moři jsem vztyčil svatý kříž našeho Pána a nad roztříštěným půlměsícem falešného Proroka vybudoval skutečnou Nebeskou říši."
 middle_east_decisions.0001.a: "Kéž se nad nimi Bůh smiluje, protože já se nesmiluji."
 middle_east_decisions.0002.desc.christians: "Od vzestupu Mohameda představuje islám na celém Východě mocnou sílu a trvalou hrozbu pro vyznavače Krista. Díky úsilí [scoped_ruler.GetTitledFirstName] o zabezpečení Svaté země tomu však již tak není. \n\n[scoped_ruler.GetFaith.HighGodName] požehnal tomuto tažení a [scoped_ruler.GetFirstName] vyhnal[Select_CString(scoped_ruler.IsFemale, 'a', '')] nevěřící od středomořského pobřeží a pronásledoval[Select_CString(scoped_ruler.IsFemale, 'a', '')] je až za spalující pouště Arábie. Od moře k moři vztyčil[Select_CString(scoped_ruler.IsFemale, 'a', '')] svatý kříž našeho Pána a nad roztříštěným půlměsícem falešného Proroka vybudoval[Select_CString(scoped_ruler.IsFemale, 'a', '')] skutečnou Nebeskou říši."
 middle_east_decisions.0002.desc.muslims: "Barbarské hordy křižáka [scoped_ruler.GetTitledFirstName] přinesly následovníkům [ROOT.Char.GetFaith.HighGodName] nepředstavitelnou zkázu!\n\nTito odporní modloslužebníci obsadili všechna posvátná místa naší víry. Dokonce i svaté město Mekka je nyní v pařátech těchto rouhačských prasat. Pokud praví následovníci Proroka brzy nezískají Arábii zpět, může to být počátek konce islámu."
 middle_east_decisions.0002.desc.others: "Od vzestupu Mohameda představuje islám na celém Východě mocnou sílu. Díky úsilí [scoped_ruler.GetTitledFirstName] o zabezpečení Svaté země tomu však již tak není. \n\n[scoped_ruler.GetFaith.GetAdjective] [scoped_ruler.GetTitleTierName] vyhnal[Select_CString(scoped_ruler.IsFemale, 'a', '')] následovníky Alláha od středomořského pobřeží a pronásledoval[Select_CString(scoped_ruler.IsFemale, 'a', '')] je až za spalující pouště Arábie. Od moře k moři vztyčil[Select_CString(scoped_ruler.IsFemale, 'a', '')] svatý kříž a nad roztříštěným půlměsícem Proroka vybudoval[Select_CString(scoped_ruler.IsFemale, 'a', '')] to, čemu říká Nebeská říše."
 middle_east_decisions.0002.a: "Chvála našemu Pánu!"
 middle_east_decisions.0002.b: "Tisíc kleteb na rodinu [scoped_ruler.GetTitledFirstName]!"
 middle_east_decisions.0002.c: "Chápu..."
 middle_east_decisions.0003.t: "Nový chalífát"
 middle_east_decisions.0003.desc: "Od chvíle, kdy nevěřící obsadili Svatou zemi, jsou praví následovníci Proroka rozptýleni do všech světových stran a postrádají vůdce i vůli znovu zahájit svatý boj.\n\nDnes tomu učiním konec. [reformer.GetFaith.HighGodName] se nade mnou smiloval, a tak jsem znovu získal Mekku a Medínu a zastavil příliv nevěřících valících se do Arábie. S podporou několika vážených učenců Písma jsem byl uznán novým chalífou [reformer.GetFaith.GetName] a jsem připraven vést své následovníky proti hanebným modloslužebníkům, kteří stále poskvrňují naši domovinu!"
 middle_east_decisions.0003.a: "Alláhu akbar!"
 middle_east_decisions.0004.desc.ashari: "Od chvíle, kdy nevěřící obsadili Svatou zemi, jsou praví následovníci Proroka rozptýleni do všech světových stran a postrádají vůdce i vůli znovu zahájit svatý boj.\n\nDnes tomu však učinili konec. [reformer.GetFaith.HighGodName] projevil milosrdenství a [reformer.GetFirstName] znovu získal[Select_CString(reformer.IsFemale, 'a', '')] Mekku a Medínu a zastavil[Select_CString(reformer.IsFemale, 'a', '')] příliv nevěřících valících se do Arábie. S podporou několika vážených učenců Písma byl[Select_CString(reformer.IsFemale, 'a', '')] uznán[Select_CString(reformer.IsFemale, 'a', '')] novým chalífou [reformer.GetFaith.GetName] a je připraven[Select_CString(reformer.IsFemale, 'a', 'ý')] vést své následovníky proti hanebným modloslužebníkům, kteří stále poskvrňují naši domovinu."
 middle_east_decisions.0004.desc.other: "Od chvíle, kdy nevěřící obsadili Svatou zemi, jsou následovníci [reformer.GetFaith.GetName] rozptýleni do všech světových stran a postrádají vůdce i vůli znovu zahájit svatý boj.\n\nZdá se však, že se pod moudrým vedením [reformer.GetFirstName] konečně znovu sjednotili. Po znovudobytí svatých měst Mekky a Medíny a upevnění svého nároku na post nového chalífy je [reformer.GetFirstName] připraven[Select_CString(reformer.IsFemale, 'a', '')] obnovit velkou válku proti nevěřícím."
 middle_east_decisions.0004.a: "Alláhu akbar!"
 middle_east_decisions.0004.b: "Lepší známé zlo než neznámé..."
 middle_east_decisions.0005.t: "Země zaslíbená"
 middle_east_decisions.0005.desc: "Jeruzalém i Země zaslíbená jsou opět pod židovskou vládou a nadešel čas vytvořit nové sjednocené království jménem Izrael, po vzoru velkého království dávných časů za Davida a Šalomouna.\n\nDlouho strádající židovský lid má konečně znovu svůj osud ve vlastních rukou. Svatou zemi už nebudou rvát na kusy válčící křesťanští a muslimští páni. Kéž toto nové království přinese kraji věk míru a prosperity!"
 middle_east_decisions.0005.a: "Ať žije Izrael!"
 middle_east_decisions.0006.desc.others: "Poté, co [scoped_ruler.GetTitledFirstName] znovu získal[Select_CString(scoped_ruler.IsFemale, 'a', '')] Jeruzalém pod židovskou vládu, rozhodl[Select_CString(scoped_ruler.IsFemale, 'a', '')] se prohlásit za [scoped_ruler.GetTitleTierName] obnoveného Izraele.\n\nDlouhé vyhnanství židovského lidu možná konečně dospělo ke konci, neboť mnohé židovské obce se rozhodují vrátit do Země zaslíbené."
 middle_east_decisions.0006.a: "Čas uzrál!"
 middle_east_decisions.0006.b: "Chápu..."
 middle_east_decisions.0007.t: "Nové velekněžství [scoped_ruler.GetFaith.GetName]"
 middle_east_decisions.0007.desc.intro: "Od chvíle, kdy Římané před téměř tisíci lety zničili Druhý chrám, neměli Židé kohena, svého velekněze. Konečně byla tato funkce znovu obsazena a velekněžství obnoveno.\n\n"
 middle_east_decisions.0007.desc.me: "Jako vlivný a zbožný vůdce židovského lidu jsem byl kněžskou vrstvou samozřejmě shledán nejvhodnějším kandidátem, který povede židovské náboženství do nové éry. Ačkoli nemám tradiční Áronův původ vyžadovaný od kohena gadola, kněží i laici oslavují mé vysvěcení do čela velekněžství."
 middle_east_decisions.0007.desc.not_me: "Stejně jako u židovských kněží dávných časů se od kohena gadola tradičně vyžadovalo, aby byl potomkem Árona, staršího bratra Mojžíše. Kvůli nedostatku vhodných kandidátů bylo od tohoto požadavku upuštěno, ale nový velekněz se přesto těší úctě náboženských obcí [ROOT.Char.GetFaith.GetName]."
 middle_east_decisions.0007.a: "Kéž nás vedení [new_priest.GetTitledFirstName] inspiruje!"
 middle_east_decisions.0007.a.me: "Mé vedení nás všechny inspiruje!"
 middle_east_decisions.0008.desc.others: "Po obnovení významné židovské přítomnosti v Jeruzalémě [scoped_ruler.GetTitledFirstName] podpořil[Select_CString(scoped_ruler.IsFemale, 'a', '')] vznik nového velekněžství [new_priest.GetFaith.GetName], které má vést Izraelity.\n\nV čele tohoto kněžstva stojí [new_priest.GetTitledFirstName] a očekává se, že rostoucím obcím Izraele přinese jednotu a vedení."
 middle_east_decisions.0008.a: "Kéž nás vedení [new_priest.GetTitledFirstName] inspiruje!"
 middle_east_decisions.0008.b: "Chápu..."
 middle_east_decisions.0009.t: "Nové kněžstvo [scoped_ruler.GetFaith.GetName]"
 middle_east_decisions.0009.desc: "Po období vyhnanství a pronásledování, které následovalo po arabských výbojích, přijali obyvatelé Persie zoroastrismus jako jedinou pravou cestu ke spravedlnosti. [scoped_ruler.GetTitledFirstName] nařídil[Select_CString(scoped_ruler.IsFemale, 'a', '')] zřídit úřad [new_priest.GetTitleTierName], kněze kněží, který bude stát v čele obnovené duchovní hierarchie.\n\n[new_priest.GetTitleTierName] bude nejvyšší náboženskou autoritou ve světě [scoped_ruler.GetFaith.GetName] a jeho pravomoci budou sahat od žehnání budoucím vojenským výpravám až po udělování rozvodů manželským párům."
 middle_east_decisions.0009.a: "Věčný oheň znovu plane!"
 middle_east_decisions.0010.desc.muslims: "Prokletí následovníci [scoped_ruler.GetFaith.HighGodName] znovu získali dostatek země a vlivu, aby pod ochranou [scoped_ruler.GetTitledFirstName] obnovili své rouhačské kněžstvo.\n\nPokud je brzy nezastavíme, mohou tito pohanští uctívači démonů zvrátit postup islámu v Persii a otravovat mysl svých nic netušících poddaných lžemi a zvrácenostmi."
 middle_east_decisions.0010.desc.others: "Podivní uctívači ohně, následovníci [scoped_ruler.GetFaith.HighGodName], znovu získali dostatek svých dávných perských území, aby obnovili fungující kněžstvo.\n\nPokud je brzy nikdo nezastaví, mohou zvrátit postup islámu a znovu podřídit Asii ochraně svých starých bohů."
 middle_east_decisions.0010.a: "Sláva [scoped_ruler.GetFaith.HighGodName]!"
 middle_east_decisions.0010.b: "Jejich démoni je před mocí [ROOT.Char.GetFaith.HighGodName] neochrání!"
 middle_east_decisions.0010.c: "...Uctívači ohně?"
 middle_east_decisions.0011.t: "Vyvolený Zarathuštry"
 middle_east_decisions.0011.desc: "Od chvíle, kdy Sásánovská říše podlehla arabským nájezdům, trpěla Persie pod jhem mohamedánských vládců. Poslední zbytky starého zoroastrijského řádu ustoupily na sever do plání Střední Asie, ale nyní byla vláda zoroastriánů nad Persií konečně obnovena.\n\nTento zázračný návrat lze připsat jedině mému brilantnímu vedení a mnozí z duchovenstva mě prohlásili za Saošjanta, spasitele světa, o němž před tisíci lety hovořil sám Zarathuštra. Přijal jsem tuto úlohu a zoroastriáni všude na světě mě nyní uctívají jako svatou ikonu."
 middle_east_decisions.0011.a: "Přinesu dobro všem."
 all_held_counties: "Všechna hrabství nevěřících"
 middle_east_decisions.0013.desc: "Od chvíle, kdy Sásánovská říše podlehla arabským nájezdům, trpěla Persie pod jhem mohamedánských vládců. Poslední zbytky starého zoroastrijského řádu ustoupily na sever do plání Střední Asie, ale nyní byla vláda zoroastriánů nad Persií konečně obnovena.\n\nTento zázračný návrat lze připsat především brilantnímu vedení [scoped_ruler.GetTitledFirstName] a mnozí z duchovenstva prohlásili tuto postavu za Saošjanta, spasitele světa, o němž před tisíci lety hovořil sám Zarathuštra. Po přijetí této úlohy je [scoped_ruler.GetTitledFirstNameNoTooltip] nyní zoroastriány všude uctíván[Select_CString(scoped_ruler.IsFemale, 'a', '')] jako svatá ikona."
 middle_east_decisions.0013.desc.muslims: "Kněží ohně prokletého rouhače Zarathuštry, kdysi zahnaní do vyhnanství v poušti, povstali z popela a zmocnili se perského trůnu!\n\nJejich [scoped_ruler.GetTitleTierName], zaslepen[Select_CString(scoped_ruler.IsFemale, 'á', 'ý')] šílenou pýchou, se nyní rozhodl[Select_CString(scoped_ruler.IsFemale, 'a', '')] prohlásit za živého boha."
 middle_east_decisions.0013.desc.others: "Od chvíle, kdy Sásánovská říše podlehla arabským nájezdům, byli následovníci Zarathuštry na útěku. Jejich vyhnanství však v poslední době skončilo, neboť věřící [scoped_ruler.GetFaith.GetName] dokázali obnovit svou dávnou říši.\n\nJejich [scoped_ruler.GetTitleTierName] má na tomto nečekaném obratu nemalou zásluhu a nyní se rozhodl[Select_CString(scoped_ruler.IsFemale, 'a', '')] prohlásit za Saošjanta, prorokovaného spasitele své víry."
 middle_east_decisions.0013.a: "Kéž nám [scoped_ruler.GetTitledFirstName] všem přinese dobro!"
 middle_east_decisions.0013.b: "Šílenství a ďáblovo dílo!"
 middle_east_decisions.0013.c: "Chápu..."
 middle_east_decisions.0014.t: "Nový Řím"
 middle_east_decisions.0014.desc: "Dobytím bohatých zemí Malé Asie jsem nashromáždil dostatek moci k založení nového sultanátu, který svou velikostí jistě překoná i samotný Řím.\n\nStále zbývá mnoho práce, ale nepochybuji, že historikové tento okamžik zvěční jako jeden z velkých kroků při dobývání Evropy následovníky [scoped_ruler.GetFaith.HighGodName]."
 middle_east_decisions.0014.a: "Ať se Západ třese!"
 middle_east_decisions.0015.desc.liege: "Po sérii vítězství v Anatolii se [scoped_ruler.GetTitledFirstName] rozhodl[Select_CString(scoped_ruler.IsFemale, 'a', '')] korunovat jako [scoped_ruler.GetTitleTierName] Rúmu, prohlásit, že už ke mně necítí žádnou věrnost, a pokračovat v boji proti nevěřícím podle vlastních představ."
 middle_east_decisions.0015.desc.romans: "Divoký válečník [scoped_ruler.GetTitledFirstName] si prosekal[Select_CString(scoped_ruler.IsFemale, 'a', '')] cestu Anatolií a založil[Select_CString(scoped_ruler.IsFemale, 'a', '')] v této oblasti nový sultanát.\n\nJako by to samo nebylo dostatečnou urážkou, v odporném projevu zpupnosti si nyní přisvojil[Select_CString(scoped_ruler.IsFemale, 'a', '')] titul [scoped_ruler.GetTitleTierName] Říma."
 middle_east_decisions.0015.desc.others: "Bohatá Malá Asie, kdysi bašta křesťanství, nyní padla pod vládu [scoped_ruler.GetTitledFirstName], který zde založil nový sultanát."
 middle_east_decisions.0015.a: "Jak se opovažuje!"
 middle_east_decisions.0015.b: "Chápu..."
 middle_east_decisions.1001.t: "Povstává nový orel"
 middle_east_decisions.1001.desc: "Už celá staletí Arménie nevládla Levantě a Kavkazu takovou silou. Říše Východu a Západu nás znovu a znovu drtily. Západ někdy hovoří latinsky, jindy řecky, Východ jednou persky, podruhé arabsky, ale tyto říše spolu bojují vždy a naše dávné země se pokaždé stávají jejich bojištěm.\n\nOde dneška už ne. Znovu jsem vybojoval staré državy Tigrana Velikého a orlí prapor Velké Arménie opět vlaje!"
 middle_east_decisions.1001.a: "A dosáhnu ještě větších věcí!"
 middle_east_decisions.1001.b: "Ani opakování nesnižuje velikost tohoto úspěchu."
 middle_east_decisions.1002.desc: "V kavkazských horách už nějakou dobu vzniká pozoruhodná situace. Navzdory všem očekáváním dokázal[Select_CString(founder.IsFemale, 'a', '')] [founder.GetFullNameNoTooltip] vybudovat rozsáhlé panství sahající od Kaspického moře na východě až ke břehům Středozemního moře na západě. Ačkoli není dokonalou kopií, zhruba tak byla obnovena dávno zaniklá říše Tigrana Velikého, což hlasatelé [founder.GetFullNameNoTooltip] neopomíjejí hlasitě připomínat.\n\nOrlí prapor Velké Arménie opět vlaje, ale na jak dlouho?"
 middle_east_decisions.1002.a: "K císařské důstojnosti nestačí pouhá rozloha."
 middle_east_decisions.1002.b: "Tentokrát nás už nikdo neroztrhá."
 middle_east_decisions.1002.c: "Stejně bezvýznamná poznámka pod čarou jako její předchůdkyně."
 middle_east_major_decisions.1020.t: "Domov řek"
 middle_east_major_decisions.1020.desc: "Bylo by možné sjednotit království kolem řek Tigridu a Eufratu pod jediným praporem? Vytvořit říši tak rozlehlou, že by nám ji záviděli i králové a královny dávných časů!"
 middle_east_major_decisions.1020.tt: "Rozšiř a sjednoť syrskou [Concept('culture','kulturu')|E]"
 middle_east_major_decisions.1020.lack_nestorian: "Pokud již jako [GetFaithByKey('nestorian').GetAdherentName] vyznáváš tuto [Concept('faith','víru')|E], získáš možnost [GetTrait('crusader_king').GetName( GetNullCharacter )]"
 middle_east_major_decisions.1020.promote_culture.tt: "Schopnost mého [GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] plnit [Concept('councillor_task','úkol rádce')|E] $task_promote_culture|V$ bude účinnější v [Concept('counties','hrabstvích')|E], kde působí [GetModifier('promote_culture_beth_nahrain_modifier').GetNameWithTooltip]"
 promote_culture_beth_nahrain_modifier_custom_desc: "Každé hrabství v Bét Nahrínu, které nemá syrskou [Concept('culture','kulturu')|E]"
 promote_culture_beth_nahrain_modifier: "Příliv a odliv"
 promote_culture_beth_nahrain_modifier_desc: "Syrský vliv je nyní v této oblasti běžnou součástí života a její obyvatelé jsou ochotnější přijímat syrské zvyky a hodnoty."
 middle_east_major_decisions.1020.learning.desc: "Pokud zaměříš svou [Concept('empire','říši')|E] na [Concept('learning','učenost')|E]"
 learning_beth_nahrain_house_modifier: "Vědění je moc"
 learning_beth_nahrain_house_modifier_desc: "Dobytí Blízkého východu přineslo syrské kultuře nový rozkvět a umožnilo jejím příslušníkům šířit svou moudrost."
 middle_east_major_decisions.1020.martial.desc: "Pokud zaměříš svou [Concept('empire','říši')|E] na [Concept('martial','válečnictví')|E]"
 martial_beth_nahrain_house_modifier: "Disciplína a řád"
 martial_beth_nahrain_house_modifier_desc: "Dobytí Blízkého východu přineslo syrské kultuře nový rozkvět a umožnilo jejím příslušníkům rozšiřovat své hranice na bitevních polích."
 middle_east_major_decisions.1020.nestorian.desc: "Pokud zaměříš svou [Concept('empire','říši')|E] na [Concept('faith','víru')|E] [GetFaithByKey('nestorian').GetAdherentName]"
 middle_east_major_decisions.1020.no_faith.desc: "Pokud se rozhodneš konvertovat k [Concept('faith','víře')|E] [GetFaithByKey('nestorian').GetAdherentName]"
 completely_controls_jazira_mesopotamia_tt: "[Concept('completely_controls','Zcela ovládáš')|E] [GetTitleByKey('k_jazira').GetNameNoTier] a [GetTitleByKey('k_mesopotamia').GetNameNoTier]"
 has_titles_jazira_mesopotamia_tt: "Držíš [Concept('title','tituly')|E] [GetTitleByKey('k_jazira').GetNameNoTier] a [GetTitleByKey('k_mesopotamia').GetNameNoTier]"
 has_title_and_completely_control_jerusalem_tt: "[Concept('completely_control','Zcela ovládat')|E] a držet [GetTitleByKey('k_jerusalem').GetName]"
 has_title_and_completely_control_syria_tt: "[Concept('completely_control','Zcela ovládat')|E] a držet [GetTitleByKey('k_syria').GetName]"
 found_empire_of_beth_nahrain_decision_confirm: "Ať řeky plynou jako jedna!"
 middle_east_major_decisions.1020_fervor: "Založení Bét Nahrínu"
 middle_east_decisions.1020.t: "Říše Bét Nahrín"
 middle_east_decisions.1020.desc: "Stejně jako řeky neochvějně plynou vpřed, poroste i tato říše, která se přede mnou nyní rozprostírá.\n\nSpojení těchto zemí přetrvá zkoušku času. Stačí je jen trochu nasměrovat správným směrem, aby tomu tak zůstalo.\n\nNyní však musím zvolit cestu vpřed a provést svůj lid vlnami nesčetných změn, které nás čekají."
 middle_east_decisions.1020.a: "Pero je mocnější než meč"
 middle_east_decisions.1020.b: "Bojiště volá"
 middle_east_decisions.1020.c: "Věřím ve svou víru"
 middle_east_decisions.1020.d: "Ukažme jim #EMP pravou#! víru!"
 beth_nahrain_crusader_desc: "Soutok, který spojuje říši v jeden celek."
 middle_east_decisions.1100.t: "Dár al-islám"
 middle_east_decisions.1100.desc: "Od dob Rášidského chalífátu nestál islám sjednocen pod jediným praporem. S jediným cílem a jedinou vizí. Skutečný [Glossary( 'Dár al-islám', 'DAR_AL_ISLAM_GLOSS' )].\n\nZe všech koutů světa nyní [GetReligionByKey('islam_religion').GetAdherentNamePluralNoTooltip] míří do [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]. Poutníci i knížata, učenci i vojáci. Ze vzdálených pouští a přeplněných přístavů, ze všech škol a sekt se shromažďují přede mnou, aby sklonili hlavy a přísahali svou oddanost.\n\nJen čas ukáže, zda tato jednota přetrvá, nebo je odsouzena znovu zmizet v dějinách. Prozatím však zástupy poznají všeobjímající mír islámu."
 middle_east_decisions.1100.a: "Celý svět bude náležet domu islámu!"
 DAR_AL_ISLAM_GLOSS: "#bold Dár al-islám#!, v překladu „dům islámu“, je označení pro země pod muslimskou svrchovaností, jejichž obyvateli jsou muslimové i nemuslimové."
 middle_east_decisions.1101.intro: "Od dob Rášidského chalífátu nebyl islám sjednocenou silou. Zdá se však, že [dar_al_islam_ruler.GetShortUIName] dokázal[Select_CString(dar_al_islam_ruler.IsFemale, 'a', '')] nemožné a vytvořil[Select_CString(dar_al_islam_ruler.IsFemale, 'a', '')] skutečný [Glossary( 'Dár al-islám', 'DAR_AL_ISLAM_GLOSS' )]."
 middle_east_decisions.1101.islam_desc: "[GetReligionByKey('islam_religion').GetAdherentNamePluralNoTooltip] z celého světa se shromažďují pod praporem [dar_al_islam_ruler.GetShortUIName]. Přinášejí sílu, bezpečí a prosperitu, které má tato nová vláda přinést."
 middle_east_decisions.1101.other_desc: "Čas ukáže, jak bude nový [dar_al_islam_ruler.GetTitleAsNameNoTooltip] vládnout. Nelze se však nepozastavit nad otázkou, co to bude znamenat pro zbytek světa."
 middle_east_decisions.1101.a: "Sláva [dar_al_islam_ruler.GetTitleAsNameNoTooltip]!"
 middle_east_decisions.1101.b: "Možná bych se měl přidat k [dar_al_islam_ruler.GetShortUIName] i já?"
 middle_east_decisions.1101.c: "Nanejvýš znepokojivý obrat."
 middle_east_decisions.1102.desc: "To znamená, že už nejsem náboženskou autoritou [ROOT.Char.GetFaith.GetName]. Stejně jako každý jiný [GetReligionByKey('islam_religion').GetAdherentName] se budu muset podřídit novému [dar_al_islam_ruler.GetTitleAsNameNoTooltip]."
 middle_east_decisions.1102.a: "Čas ukáže, zda je [dar_al_islam_ruler.GetShortUIName] [Select_CString(dar_al_islam_ruler.IsFemale, 'hodna', 'hoden')]."
