l_polish:
 middle_europe_decisions.0001.t: "Švýcarská konfederace"
 middle_europe_decisions.0001.desc: "Města kolem centrálních Alp byla dlouho ohrožována jinými mocnostmi uvnitř říše. Nyní se sjednotila pod jediným praporem, uzavřela vzájemně výhodná spojenectví a získala výsadu říšské bezprostřednosti. \n\nZa zásluhy mé dynastie o švýcarské městské státy jsem byl zvolen do čela tohoto svazku, abych se stal představitelem všech kantonů naší nové Švýcarské konfederace. Už nás nebudou ohrožovat cizí mocnosti. Namísto toho povstaneme jako silná a nezávislá síla uvnitř říše."
 middle_europe_decisions.0001.a: "Stojíme při sobě!"
 middle_europe_decisions.0002.desc.emperor: "Po letech svárů a obtížných diplomatických jednání jsem byl nucen udělit švýcarským kantonům říšskou bezprostřednost.\n\nTato skupina alpských měst se sjednotila ve velkou konfederaci, aby se chránila před výboji Burgunďanů a německých pánů. Musím si dát pozor, abych je udržel na uzdě, jinak by jejich úspěch mohl zasít nespokojenost mezi měšťany v okolí."
 middle_europe_decisions.0002.desc.vassals: "V říši povstala nová mocnost známá jako Švýcarská konfederace. Tvoří ji města s říšskou bezprostředností rozesetá kolem centrálních Alp, která uzavřela obranné spojenectví na ochranu před okolními kurfiřty.\n\nJe to nezávislá síla, s níž je třeba počítat. Zbavila se všech dřívějších nároků na svá území, ať už pocházely od starých Burgunďanů na západě, nebo německých pánů na severu.\n\nMěl bych si na tuto novou potenciální hrozbu v říši dávat pozor."
 middle_europe_decisions.0002.a: "Jak zvláštní..."
 middle_europe_decisions.0003.t: "Arcivévodství rakouské"
 middle_europe_decisions.0003.desc: "Díky mým slavným úspěchům při sjednocování rakouských zemí a obrovskému vlivu, který má dynastie získala ve Svaté říši římské, [scoped_emperor.GetTitledFirstName] konečně uznal prvenství Rakouska nad mnoha bezvýznamnými německými vévody.\n\nOd tohoto dne ponesou všichni mí nástupci vznešený titul #EMP arcivévody#!, rovného kterémukoli králi, a tím se odliší od méně významných knížat a kněžen říše."
 middle_europe_decisions.0003.a: "Austria erit in orbe ultima!"
 middle_europe_decisions.0004.desc.emperor_archduke: "[scoped_ruler.GetTitledFirstName] využil[Select_CString(scoped_ruler.IsFemale, 'a', '')] své vlády nad císařským trůnem a zákonně si udělil[Select_CString(scoped_ruler.IsFemale, 'a', '')] titul [Select_CString(scoped_ruler.IsFemale, 'rakouské arcivévodkyně', 'rakouského arcivévody')], čímž postavil[Select_CString(scoped_ruler.IsFemale, 'a', '')] vévodství na roveň kterémukoli království."
 middle_europe_decisions.0004.desc.emperor: "Je jen správné, aby se vládci rakouských zemí, odkud pochází i má vlastní dynastie, odlišovali od ostatních knížat a kněžen říše. \n\nProto jsem nedávno vyhověl prosbám [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_ruler'))] a prohlásil [scoped_ruler.GetFirstName] za [scoped_ruler.GetTitleTierName] Rakouska."
 middle_europe_decisions.0004.desc.emperor_blackmailed: "Rakousko se vždy považovalo za něco víc než zbytek říše a dnes to [scoped_ruler.GetFirstName] potvrdil[Select_CString(scoped_ruler.IsFemale, 'a', '')]. Kvůli vazbám, které na mě [scoped_ruler.GetFirstName] má, mi nezbylo než potvrdit [Select_CString(scoped_ruler.IsFemale, 'její postavení arcivévodkyně', 'jeho postavení arcivévody')], rovné kterémukoli králi."
 middle_europe_decisions.0004.desc.vassals: "[scoped_ruler.GetFirstName] využil[Select_CString(scoped_ruler.IsFemale, 'a', '')] vlivu dynastie [scoped_ruler.GetDynastyName] na císařský trůn a přesvědčil[Select_CString(scoped_ruler.IsFemale, 'a', '')] [scoped_emperor.GetTitledFirstName], aby [Select_CString(scoped_ruler.IsFemale, 'jí', 'mu')] udělil zvláštní pocty.\n\nOd tohoto dne je Rakousko považováno za arcivévodství, první mezi knížectvími Svaté říše římské."
 middle_europe_decisions.0004.a: "Bylo to naprosto zasloužené."
 middle_europe_decisions.0004.b: "Jak příhodné..."
 middle_europe_decisions.0005.t: "Sen Karla Velikého"
 middle_europe_decisions.0005.desc: "Evropa je opět celistvá. Všichni potomci Franků byli sjednoceni pod jediným praporem a společně čelí nevěřícím na západě i pohanům na východě.\n\n[scoped_ruler.GetFaith.HighGodName] nám ve své milosti svěřil korunu obnovené Karolínské říše. A na rozdíl od těch, kteří přišli před námi, nedovolíme, aby dynastické sváry tuto velkou říši znovu roztrhaly."
 middle_europe_decisions.0005.a: "[scoped_ruler.GetFaith.HighGodName], tobě budiž chvála!"
 middle_europe_decisions.0006.desc: "[scoped_ruler.GetTitledFirstName] se svým franským vojskem pronikl[Select_CString(scoped_ruler.IsFemale, 'a', '')] tak hluboko do zemí říše, že se začal[Select_CString(scoped_ruler.IsFemale, 'a', '')] prohlašovat za pravého dědice Karla Velikého a Svatou říši římskou označuje za pouhý bledý odlesk karolínské slávy.\n\nKdyž nyní ovládá všechny původní provincie a velkou část západní Evropy, jen málokdo může takový nárok popírat."
 middle_europe_decisions.0006.a: "Jak se opovažuje!"
 middle_europe_decisions.0006.b: "Vydrží tahle říše déle, co myslíte?"
 middle_europe_decisions.0007.t: "Sjednocené Burgundsko"
 middle_europe_decisions.0007.desc: "Všechny burgundské země byly sjednoceny pod jedinou korunou. Naše dávné země už nejsou rozděleny mezi malá znepřátelená panství a znovu získaly důstojnost království.\n\nMoc, kterou nade mnou měl [former_liege.GetTitledFirstName], už nějakou dobu slábne natolik, že necítím žádnou věrnost k někomu, koho považuji spíše za sobě rovného než za svého lenního pána."
 middle_europe_decisions.0007.a: "Nepotřebujeme ničí ochranu!"
 middle_europe_decisions.0008.desc.liege: "Už nějakou dobu mě znepokojují snahy [scoped_ruler.GetTitledFirstName] sjednotit burgundské země pod jediným praporem a nyní se mé nejhorší obavy naplnily.\n\nTen nevděčný ničema se rozhodl[Select_CString(scoped_ruler.IsFemale, 'a', '')] prohlásit za [scoped_ruler.GetTitleTierName] Burgundska a porušil[Select_CString(scoped_ruler.IsFemale, 'a', '')] svou vazalskou přísahu!"
 middle_europe_decisions.0008.desc.others: "Po několika letech sjednocování burgundských zemí se [scoped_ruler.GetFirstName] rozhodl[Select_CString(scoped_ruler.IsFemale, 'a', '')] korunovat jako [scoped_ruler.GetTitleTierName] Burgundska a vyhlásit nezávislost na [former_liege.GetTitledFirstName].\n\nNa tento nestoudný akt zrady se jen tak nezapomene..."
 middle_europe_decisions.0008.a: "[scoped_ruler.GetTitledFirstName] není nic než zrádce!"
 middle_europe_decisions.0008.b: "Alespoň kartografové budou mít radost."
 middle_europe_decisions.0010.t: "Shromáždění stavů"
 middle_europe_decisions.0010.desc: "Infrastruktura, kterou Řekové zanechali v provinciích Sicílie a Apulie, poslouží jako základ, jenž urychlí přechod [scoped_ruler.GetPrimaryTitle.GetName] k osvícenější formě vlády. \n\nShromážděním zástupců tří stavů do jediného poradního sboru, který se bude řídit novými zákony založenými na starých římských tradicích, zajistím ve Středomoří stabilitu a prosperitu na celé generace. Teď už jen musím rozhodnout, kde bude tento parlament zasedat."
 middle_europe_decisions.0010.tt_napoli_warning: "@warning_icon! #warning Vybudování parlamentu v [GetTitleByKey('c_napoli').GetNameNoTier] ti znemožní postavit univerzitu!#!"
 middle_europe_decisions.0010.a: "V Palermu, jeho dávném sídle!"
 middle_europe_decisions.0010.b: "Bude v Neapoli."
 middle_europe_decisions.0010.c: "Měl bych toto rozhodnutí důkladně zvážit."
 middle_europe_decisions.0011.desc: "[scoped_ruler.GetTitledFirstName] jmenoval[Select_CString(scoped_ruler.IsFemale, 'a', '')] zástupce šlechty, duchovenstva a měšťanstva, aby vytvořili nový parlament Sicilského království.\n\nTento poradní sbor pomůže [scoped_ruler.GetTitleTierName] i jeho nástupcům vládnout moudře a účinně ku prospěchu všech poddaných."
 middle_europe_decisions.0011.a: "Chápu..."
 middle_europe_decisions.0012.t: "Opus Francigenum"
 middle_europe_decisions.0012.desc: "Nastává nový věk prosperity. [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] se vynořilo z temných časů jako zářivý maják umění a filozofie.\n\nNaše města se rozrůstají v rušná střediska obchodu, vyrůstají v nich podivuhodné nové katedrály soupeřící s dávnými památkami Římské říše a přitahují malíře, pěvce i filozofy všeho druhu. Pod osvícenou záštitou mé dynastie bude [scoped_ruler.GetCulture.GetName] lid předmětem závisti celé Evropy."
 middle_europe_decisions.0012.a: "Ať naše velké dílo pokračuje!"
 middle_europe_decisions.0013.t: "Gotické období"
 middle_europe_decisions.0013.desc.french: "[scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] prožívá období velké prosperity a rozkvětu ku prospěchu všeho našeho lidu. \n\nNaše města se rozrůstají v rušná střediska obchodu, vyrůstají v nich podivuhodné nové katedrály soupeřící s dávnými památkami Římské říše a přitahují malíře, pěvce i filozofy všeho druhu. Pod osvícenou záštitou [scoped_ruler.GetTitledFirstName] a dynastie [scoped_ruler.GetDynasty.GetBaseName] se staneme předmětem závisti celé Evropy."
 middle_europe_decisions.0013.desc.italian: "Zdá se, že [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] prožívá období velké prosperity a rozkvětu. \n\nBásníci, filozofové, architekti... Ke dvoru [scoped_ruler.GetTitledFirstName] se sjíždí množství vzdělanců, a přesto zatím dokázali vytvořit jen zdánlivě nekonečnou přehlídku hrubých barbarských monumentů."
 middle_europe_decisions.0013.desc.fallback: "[scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] prožívá období velké prosperity a rozkvětu ku prospěchu všeho [ROOT.Char.GetCulture.GetNameNoTooltip] lidu. \n\nNová města se rozrůstají v rušná střediska obchodu, vyrůstají v nich podivuhodné nové katedrály soupeřící s dávnými památkami Římské říše a přitahují malíře, pěvce i filozofy všeho druhu. Pod osvícenou záštitou [scoped_ruler.GetTitledFirstName] a dynastie [scoped_ruler.GetDynasty.GetBaseName] se tato země stane předmětem závisti celé Evropy."
 middle_europe_decisions.0013.a: "V jak úžasné době to žijeme!"
 middle_europe_decisions.0013.b: "Pche! Tohle nikdy nevydrží."
 middle_europe_decisions.0013.c: "Tak jim to přeji..."
 middle_europe_decisions.0015.t: "Říše Západu"
 middle_europe_decisions.0015.desc: "Příliš dlouho zůstával plášť římského císaře na Západě bez nositele. Dnes se to mění. Stojím tváří v tvář [founder_hof.GetTitledFirstName] v nejvelkolepějším [founder.GetFaith.HouseOfWorship] v celém [ceremony_locale.GetNameNoTooltip], obklopen svými vazaly a duchovenstvem.\n\nPodle obřadu pronášíme modlitby a činíme dary a prosíme, aby mi [founder.GetFaith.HighGodName] požehnal silou a milosrdenstvím, díky nimž budu moci vládnout své říši v souladu s boží vůlí. [founder_hof.GetTitledFirstNameNoTooltip] mi slavnostně předává korunu a meč a svěřuje mi péči o celé křesťanstvo.\n\nNastává ticho, které vzápětí vystřídá mohutný zpěv hymnů, přehlušený už jen bouřlivým jásotem mých šlechticů.\n\nKonečně. Jsem císařem Svaté říše římské."
 middle_europe_decisions.0015.a: "Od Augusta přes Karla Velikého až k [founder.GetFirstNameNoTooltip]!"
 middle_europe_decisions.0016.desc: "Římská říše na Západě již dlouho dřímala a odpověď [founder.GetFaith.GetAdjectiveNoTooltip] světa na otázku císařské důstojnosti tak zůstávala přinejlepším nejasná.\n\nTedy až dosud. [founder.GetTitledFirstName] se souhlasem [founder_hof.GetTitledFirstName] znovu obnovil[Select_CString(founder.IsFemale, 'a', '')] říši Karla Velikého při okázalém obřadu v nejvelkolepějším z [founder.GetFaith.HouseOfWorshipPlural] v [ceremony_locale.GetNameNoTooltip].\n\nPo celém světě [founder.GetFaith.GetAdjectiveNoTooltip] [founder.GetFaith.PriestNeuterPlural] jásají v přesvědčení, že Řím má konečně opět pravého a bohabojného dědice!"
 middle_europe_decisions.0016.a: "Pche, jen nabubřelá napodobenina říše."
 middle_europe_decisions.0016.b: "Barbarští Němci, #emphasis já#! jsem římský císař!"
 middle_europe_decisions.0016.c: "Doufejme, že tato říše přinese mír."
 middle_europe_decisions.0016.d: "Velkolepá podívaná!"
 establish_the_electorate_of_saxony_decision: "Zřídit Saské kurfiřtství"
 establish_the_electorate_of_saxony_decision_desc: "Východní pohraniční kraje zůstávaly příliš dlouho mimo dosah říše. Musíme tyto tituly sjednotit do nového Saska a upevnit tak svou vládu nad tímto územím."
 establish_the_electorate_of_saxony_decision_tooltip: "$establish_the_electorate_of_saxony_decision_desc$"
 establish_the_electorate_of_saxony_decision_confirm: "Vytvořit nové Sasko!"
 polabia_must_be_hre_culture_tt: "Alespoň 12 [Concept('counties','hrabství')|E] v [GetGeographicalRegion('custom_polabia').GetName] musí mít buď tvou kulturu, nebo kulturu tvého [Concept('liege','lenního pána')|E]."
 polabia_held_or_nonexistent.tt: "$k_sorbia$ neexistuje nebo jej držíš ty."
 middle_europe_decision.0017.tt: "Jako císař po vytvoření Saska předáš tento titul některému [Concept('vassal','vazalovi')|E] nebo [Concept('courtier','dvořanovi')|E]."
 middle_europe_decisions.0017.t: "Saské kurfiřtství"
 middle_europe_decisions.0017.desc: "Polabí je již dlouho vyrváno z rukou nepřátel [hre_emperor_scope.GetPrimaryTitle.GetTierAsNameNoTooltip] a jeho obyvatelé nyní považují $e_hre$ za svůj pravý domov.\n\nZřízením Saského kurfiřtství zůstane oblast Horního Saska nyní i navěky v rukou [hre_emperor_scope.GetTitleAsNameNoTooltip] a pod ochranou, již poskytuje [hre_emperor_scope.GetFaith.HighGodName]."
 middle_europe_decisions.0017.a: "Sláva Sasku!"
 middle_europe_decisions.0017.b: "[heir_scope.Custom2('MyCharacterIntroduction', ROOT.Char)|U] si tento titul zaslouží."
 middle_europe_decisions.0017.c: "[most_powerful_saxon.GetNameNoTooltip] si jej vskutku zaslouží."
 middle_europe_decisions.0017.d: "Toto je můj dar církvi."
 middle_europe_decisions.0017.e: "Blahopřeji, [rando_courtier_scope.GetNameNoTooltip]!"
 middle_europe_decisions.0018.desc: "$middle_europe_decisions.0017.desc$\n\n[hre_emperor_scope.GetNameNoTooltip] se rozhodl[Select_CString(hre_emperor_scope.IsFemale, 'a', '')] udělit tento nový titul [new_saxon_king.GetName] jako uznání služeb prokázaných trůnu."
 middle_europe_decisions.0018.a.new_king: "Sláva mně!"
 middle_europe_decisions.0018.a.slav: "Ať jsou prokleti!"
 middle_europe_decisions.0018.a: "Dobře jim tak."
