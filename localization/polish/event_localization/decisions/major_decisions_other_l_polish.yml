l_polish:
 major_decisions.0100.t: "Posvátná krevní linie"
 major_decisions.0100.desc.temporal: "Díky své ryzí oddanosti a neúnavnému úsilí jsem nerozlučně spojil nejposvátnější úřad [scoped_ruler.GetFaith.GetAdjective] víry s dynastií [scoped_ruler.GetDynasty.GetBaseName].\n\nStále více duchovních i věřících začíná mou rodinu považovat za vyvolené strážce svatých relikvií a zvěstovatele boží vůle."
 major_decisions.0100.desc.spiritual: "[scoped_ruler.GetFaith.HighGodName] má na Zemi své zástupce a má neochvějná oddanost vůči nim nezůstala bez povšimnutí. \n\n[scoped_pope.GetTitledFirstName] oficiálně uznal[Select_CString(scoped_pope.IsFemale, 'a', '')] zásluhy mé rodiny a posvětil[Select_CString(scoped_pope.IsFemale, 'a', '')] naše jméno jako věčných obránců [scoped_ruler.GetFaith.GetAdjective] víry."
 major_decisions.0100.a: "Jsme přece jen o něco víc než pouzí smrtelníci."
 major_decisions.0100.b: "Ctnost bez poskvrny!"
 major_decisions.0102.desc.temporal: "Díky svému bezúhonnému jednání a osvícené vládě vstoupí [scoped_ruler.GetTitledFirstName] do dějin jako jeden z pilířů [scoped_ruler.GetFaith.GetName].\n\nV nedávných dějinách se žádný [scoped_ruler.GetTitleTierName] netěšil takovému vlivu a úctě a někteří dokonce tvrdí, že v žilách [scoped_ruler.GetTitledFirstName] snad koluje i kapka božské krve."
 major_decisions.0102.desc.spiritual: "Úspěchy [scoped_ruler.GetTitledFirstName] jsou tak významné, že [scoped_pope.GetTitledFirstName] osobně oficiálně uznal[Select_CString(scoped_pope.IsFemale, 'a', '')] zásadní roli, kterou [scoped_ruler.GetTitledFirstName] sehrál[Select_CString(scoped_ruler.IsFemale, 'a', '')] při obraně a šíření [scoped_ruler.GetFaith.GetAdjective] ctností.\n\nDynastie [scoped_ruler.GetDynasty.GetBaseName] bude díky bezúhonnému jednání této velké osobnosti ještě dlouho připomínána pro svou zbožnost a horlivost."
 major_decisions.0102.a: "Žijeme v požehnaných časech."
 major_decisions.0102.b: "Je nám všem příkladem!"
 major_decisions.0103.desc.temporal: "[scoped_ruler.GetTitledFirstName] zasvětil[Select_CString(scoped_ruler.IsFemale, 'a', '')] svůj život tomu, aby naše rodinné jméno zahalil[Select_CString(scoped_ruler.IsFemale, 'a', '')] pláštěm božského vyvolení, a plody tohoto úsilí jsou konečně patrné. \n\nStále více duchovních i věřících začíná naši dynastii považovat za vyvolené strážce svatých relikvií a zvěstovatele boží vůle."
 major_decisions.0103.desc.spiritual: "[scoped_ruler.GetTitledFirstName] zasvětil[Select_CString(scoped_ruler.IsFemale, 'a', '')] svůj život získávání přízně [scoped_ruler.GetFaith.GetAdjective] duchovenstva a plody tohoto úsilí jsou konečně patrné. \n\n[scoped_pope.GetTitledFirstName] oficiálně uznal[Select_CString(scoped_pope.IsFemale, 'a', '')] zásluhy naší rodiny a posvětil[Select_CString(scoped_pope.IsFemale, 'a', '')] naše jméno jako věčných obránců víry."
 major_decisions.0103.a: "Všichni bychom měli být vděční za to, co [scoped_ruler.GetTitledFirstName] vykonal[Select_CString(scoped_ruler.IsFemale, 'a', '')]."
 major_decisions.0103.b: "Další rouhání od [scoped_ruler.GetFirstNameNoTooltip]..."
 major_decisions.0500.t: "Síla dynastie [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]"
 major_decisions.0500.desc: "Po celé generace je naše dynastie proslulá silou své krve. Síla, krása i bystrý rozum jsou s dynastií [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] neodmyslitelně spjaty.\n\nMá vlastní výjimečnost to jen potvrzuje. V jediné dokonalé osobě se snoubí všechny nejlepší vlastnosti naší dynastie. Mé jméno i mé dary budou prostřednictvím mých potomků žít ještě celá staletí."
 major_decisions.0500.a: "Čeká nás zářná budoucnost!"
 major_decisions.0501.desc: "Díky pečlivě plánovaným sňatkům, spojenectvím a výbojům zaujala dynastie [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] své právoplatné místo mezi skutečnými mocnostmi známého světa.\n\n[realm_1.GetNameNoTierNoTooltip|U], [realm_2.GetNameNoTierNoTooltip|U], [realm_3.GetNameNoTierNoTooltip|U], [realm_4.GetNameNoTierNoTooltip|U]... Naše državy sahají široko daleko. Na našich hlavách spočívá mnoho korun, ale krev nás všechny spojuje v jeden celek."
 major_decisions.0501.a: "Kéž naše dědictví přetrvá navěky!"
 major_decisions.0001.t: "Nová éra"
 major_decisions.0001.desc: "Staré způsoby nám dobře sloužily a vždy je budeme ctít. Jako [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] jsem však dospěl k závěru, že chceme-li i nadále vzkvétat, musíme přijmout feudalismus a jeho zásady. Je to nezbytný další krok na naší cestě k velikosti!"
 major_decisions.0001.a: "Ať žije [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 major_decisions.0002.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 major_decisions.0200.t: "Zpět ke kořenům"
 major_decisions.0200.desc: "Jsem zvyklý na přísnou hierarchii a rolníky, kteří při obdělávání polí nekladou otázky, ale nyní vládnu jen neukázněným kmenům. Tito lidé mě nerespektují. Respektují pouze sílu.\n\nTak jim sílu ukážu! Odvrhnu okázalé znaky vznešenosti, které mí poddaní nenávidí, a získám si jejich srdce pozvednutým mečem!"
 major_decisions.0200.a: "Dokážu jim svou cenu!"
 major_decisions.4000.t: "Vláda jižního císaře"
 major_decisions.4000.desc: "Od posvátných domovin mých předků až po věčně tekoucí řeky delty Mekongu zní ozvěna mého nepopiratelného vítězství.\n\nNáš lid po staletí zápasil se severními utlačovateli, aby mohl naplnit svůj skutečný potenciál, a nyní stojíme sjednoceni proti ještě větším hrozbám.\n\nAť všechna panství vědí, že já, [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], a má požehnaná krev budeme pravými strážci těchto zemí."
 major_decisions.4000.a: "Kéž nebesa žehnají mému rodu!"
 major_decisions.4000.b: "Toto je #italic náš#! prapor."
 major_decisions.4000.c: "Postavil jsem se proti slunci, abych svému lidu poskytl stín."
 major_decisions.4001.t: "Založení vietské říše"
 major_decisions.4001.desc: "Z dalekých zemí přicházejí zprávy o vyhlášení nové říše, v jejímž čele stojí [founder.GetFullNameNoTooltip]. Po náročném úsilí o zachování vlastní svrchované nezávislosti získal tento lid dostatek zkušeností, aby si vybudoval vlastní domovinu.\n\nUvidíme, jak dlouho tato stabilita vydrží, než ji začnou ohrožovat nebezpeční soupeři."
 major_decisions.4001.a: "Vítej mezi námi."
 major_decisions.4001.b: "Další?"
 major_decisions.5000.t: "Obřad povznesení"
 major_decisions.5000.desc: "Po založení mé říše mě [ritual_guide.GetTitledFirstName] za úsvitu doprovodil[Select_CString(ritual_guide.IsFemale, 'a', '')] do chrámu, aby mi objasnil[Select_CString(ritual_guide.IsFemale, 'a', '')] cestu, která nás čeká.\n\n„Božský kosmos se otáčí kolem tebe, můj [ROOT.Char.GetTitleAsNameNoTooltip]. Už nejsi tím, kdo hledá, ale tím, kdo utváří. Dosáhneš toho přijetím popela Merapi, nebo očistíš svou duši pod vodopády Sri?“ uzavřel[Select_CString(ritual_guide.IsFemale, 'a', '')] klidným hlasem.\n\nMusím vytyčit cestu sobě i svým poddaným."
 major_decisions.5000.a: "Musím splynout s horou Merapi, která chrlí oheň a popel!"
 major_decisions.5000.b: "Óm, Sri Sedano, spoj nás s duchem světa."
 major_decisions.5001.t: "Zrození Madžapahitu"
 major_decisions.5001.desc: "Mí rádci mě zpravili o vzniku ostrovní říše [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nTvrdí, že [founder.GetTitleAsNameNoTooltip] je svým lidem považován za spasitele jejich víry a kultury, ale zatím nevíme, jaké záměry bude tato nová mocnost sledovat.\n\nUvidím, zda se vůči mému panství rozhodnou vystupovat přátelsky."
 major_decisions.5001.a: "Prozatím máme dost vlastních problémů."
 major_decisions.5001.b: "Nakonec je to jen další uchazeč o moc."
 major_decisions.6000.t: "Dědictví Rjúkjú"
 major_decisions.6000.desc: "„Všichni ostrované pějí tvou chválu, můj [founder.GetTitleAsNameNoTooltip]. Všem vůdcům klanů, tvým pokorným poddaným, už byla rozeslána zpráva o vzniku našeho nového praporu. Trůn Rjúkjú netrpělivě čeká, až na něj usedneš,“ zvolá [antiquarian.GetTitledFirstName] po dlouhém proslovu.\n\nJe dobré být [founder.GetTitleAsNameNoTooltip], ale můj čas na tomto světě je omezený, stejně jako čas mých dětí. Musím naši vládu posílit a učinit nesmrtelnou pomocí dědictví, které přetrvá nesčetné generace."
 major_decisions.6000.a: "Vytvoř artefakt, který bude inspirovat můj lid."
 major_decisions.6000.b: "Přines mi relikvii, která bude symbolem naší císařské moci."
 ryukyu_artifact_regalia_craft_tt: "#italic Regálie#! jako [Concept('artifact','artefakt')|E] budou dodány #bold do jednoho roku#!:\n[GetModifier( 'ryukyu_empire_shaku_modifier' ).GetNameWithTooltip]"
 ryukyu_artifact_crown_craft_tt: "#italic Koruna#! jako [Concept('artifact','artefakt')|E] bude dodána #bold do jednoho roku#!:\n[GetModifier( 'ryukyu_empire_crown_modifier' ).GetNameWithTooltip]"
 ryukyu_empire_shaku_modifier: "Šaku Tří hor"
 ryukyu_empire_crown_modifier: "Dračí koruna"
 major_decisions.6001.t: "Císařské šaku"
 major_decisions.6001.desc: "Dlouho očekávané šaku, hodné skutečného [ROOT.Char.GetTitleAsNameNoTooltip], bylo zhotoveno přesně podle mých požadavků. Překonalo všechna očekávání a bezpochyby zdůrazní mou úlohu prostředníka mezi poddanými a božskými duchy.\n\nPři budování mé velkolepé říše nebude můj lid znát zahálku ani žal. Práce pro tak božský účel jistě odstraní všechny překážky."
 major_decisions.6001.a: "Společně pozvedneme Tři hory až k nebesům!"
 major_decisions.6002.t: "Dračí koruna"
 major_decisions.6002.desc: "Jak bylo dohodnuto, [antiquarian.GetTitledFirstName] mi představuje novou korunu, která symbolizuje odhodlání mé říše objevovat neznámé a čelit nebezpečím pramenícím z nečinnosti.\n\nCelý svět brzy pozná Rjúkjúany a bude je opěvovat a mé jméno bude připomínáno s úctou a obdivem. Mí potomci budou tento symbol odvahy nosit s hrdostí a vzdorovat svým nepřátelům."
 major_decisions.6002.a: "Naše moc bude znít věčností."
 major_decisions.6003.t: "Probuzení Rjúkjúanů"
 major_decisions.6003.desc: "Doneslo se ke mně, že na ostrovech Rjúkjú povstal císař, který si podmanil svěží pláně i bájné hory a sjednotil tamní klany pod jediným praporem.\n\nUdržet říši pohromadě není snadné, zvláště když jsou zdroje omezené. Uvidíme, co z toho vzejde."
 major_decisions.6003.a: "Na tak skromné začátky je to chvályhodné."
 major_decisions.6003.b: "Ani tak mě to neohromilo."
 major_decisions.7000.t: "Úsvit štěstí"
 major_decisions.7000.desc: "Když vstupuji do sálu, vzduch naplňuje vůně kadidla a prostorem se rozléhá zvuk bronzových gongů ohlašujících můj příchod. Členové mé rady a královští písaři mě zdraví ze svých nízkých lavic.\n\nPo výměně formálních zdvořilostí mi několik členů rady předkládá své názory na to, čemu by měla má vláda dát přednost: musím vybrat oblast, do níž budeme investovat a která určí odkaz Tchajů.\n\nKdyž se nedokážou shodnout, začínám si utřiďovat vlastní poslední úvahy."
 major_decisions.7000.a: "Měli bychom podpořit keramické dílny sangkhalok v [kingdom_capital.GetNameNoTier]."
 major_decisions.7000.b: "Chceme-li přežít své soupeře, naši válečníci si zaslouží lepší podmínky."
 major_decisions.7000.c: "Prosazování tchajských hodnot musí být mým trvalým úsilím."
 siam_kingdom_sangkhalok_workshops_county_modifier: "Podporované dílny sangkhalok"
 siam_kingdom_sangkhalok_workshops_province_modifier: "Vzkvétající obchod se sangkhalokem"
 siam_kingdom_military_modifier: "Financovaná vojenská cvičiště"
 siam_kingdom_culture_modifier: "Kulturní rozkvět"
 major_decisions.7001.t: "Vzestup Tchajů"
 major_decisions.7001.desc: "Hluboko v divočině, kterou někteří znají jako Zlatou zemi, se [founder.GetNameNoTierNoTooltip] chopil[Select_CString(founder.IsFemale, 'a', '')] moci jako [founder.GetTitleAsNameNoTooltip] [founder.GetPrimaryTitle.GetNameNoTierNoTooltip] a postavil[Select_CString(founder.IsFemale, 'a', '')] se osudu svého lidu.\n\nTchajové strávili dlouhá léta hledáním vlasti, hrdě putovali krajem jako kočovníci a postupně pronikali stále více na jih.\n\nPřetrvá jejich vliv zkoušku času?"
 major_decisions.7001.a: "Další vržený do víru dějin."
 major_decisions.7001.b: "Jsou pro nás hrozbou? Uvidíme."
 major_decisions.8000.t: "Příbytek míru"
 major_decisions.8000.desc: "[imam.GetTitledFirstName], který povede příští povinnou páteční modlitbu, mi připomíná tradici připravit chutbu jménem [founder.GetTitleAsNameNoTooltip]. Kromě povinných modliteb a veršů se mě ptá, jaká část má být přečtena věřícím, aby byla vyhlášena má svrchovanost a ochrana nad nimi."
 major_decisions.8000.a: "Ať poznají skutky svého [founder.GetTitleAsNameNoTooltip]."
 major_decisions.8000.b: "Veškerá chvála náleží jedině Alláhovi."
 brunei_kingdom_khutbah_prestige_option_modifier: "Ochránce ummy"
 brunei_kingdom_khutbah_piety_option_modifier: "Světlo ummy"
 major_decisions.9000.t: "Císařský dar při nástupu"
 major_decisions.9000.desc: "Naše islámská tradice velí, aby [founder.GetTitleAsNameNoTooltip] při svém nástupu obdaroval mé požehnané válečníky, poutníky procházející mými zeměmi i potřebné nově raženými mincemi nesoucími mé jméno."
 major_decisions.9000.desc_steward: "\n\nMůj [ROOT.Char.GetCouncillorPosition('councillor_steward').GetPositionName] [steward.GetTitledFirstName] se mě ptá, jak štědře jsem jako ochránce ochoten obdarovat své věrné poddané."
 major_decisions.9000.a: "Ať věřící poznají, jak [Select_CString(founder.IsFemale, 'štědrá', 'štědrý')] je jejich [founder.GetTitleAsNameNoTooltip]!"
 major_decisions.9000.b: "Kéž Alláh přijme naši sadaku."
 brunei_empire_high_sadaqah_modifier: "Štědře rozdávaná sadaka"
 brunei_empire_low_sadaqah_modifier: "Rozdávaná sadaka"
