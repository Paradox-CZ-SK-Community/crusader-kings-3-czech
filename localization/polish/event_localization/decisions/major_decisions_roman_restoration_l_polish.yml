l_polish:
 roman_restoration.0001.t: "Úsvit nové éry"
 roman_restoration.0001.desc.intro: "Přátelé, Římané, krajané, dopřejte mi sluchu!\n\nPo zázračném znovudobytí území ztracených před staletími se Římská říše znovuzrodila! Evropa od chvíle, kdy barbaři prolomili císařské hranice, prožívala temné časy, ale nyní celé civilizaci svítá nový zářný věk."
 roman_restoration.0001.desc.greeks: "\n\nŽárliví uchazeči na Západě už nebudou římský stát nazývat „Říší Řeků“, ale budou jej muset uznat za pravého dědice odkazu Říma."
 roman_restoration.0001.desc.other: "\n\nTam, kde bezpočet řeckých uchazečů selhal, uspěl jediný člověk z [scoped_emperor.GetCulture.GetName] kultury a obnovil zavrhovanou „Říši Řeků“."
 roman_restoration.0001.desc.christians: "Imperium Romanum opět stojí pevně, za mé osvícené vlády navráceno své dávné slávě a připraveno šířit civilizaci, bezpečí a svaté světlo našeho Pána do všech koutů známého světa. Za senát a lid římský!"
 roman_restoration.0001.desc.hellenics: "Imperium Romanum opět stojí pevně, za mé osvícené vlády navráceno své dávné slávě i náboženství. \n\nNové legie vytáhnou proti zbývajícím provinciím, které stále odmítají svrchovanost této nové říše, a z těchto temných časů vykovají novou Pax Romana. Za senát a lid římský!"
 roman_restoration.0001.desc.fallback: "Imperium Romanum opět stojí pevně, za mé osvícené vlády navráceno své dávné slávě a připraveno šířit civilizaci, bezpečí a lásku, již přináší [ROOT.Char.GetFaith.HighGodName], do všech koutů známého světa. Za senát a lid římský!"
 roman_restoration.0001.a: "Esto perpetua!"
 roman_restoration.0002.t: "Druhý věk Říma"
 roman_restoration.0002.desc: "Byzantská říše, kterou mnozí na Západě dosud označovali za „Říši Řeků“, dokázala jakýmsi způsobem znovu získat dostatek ztracených území, aby mohla prohlásit Římskou říši za obnovenou!"
 roman_restoration.0002.desc.christians: "\n\nUž nelze popírat, že jsou skutečnými dědici Říma a jeho slavného odkazu. Nastává nová éra."
 roman_restoration.0002.desc.hellenics: "\n\nJeště překvapivější je, že tato nová Římská říše zavrhla křesťanství ve prospěch dávných pohanských bohů! Pokud ji brzy nikdo nezastaví, může tato nová vlna pohanství ohrozit samotné přežití křesťanství!"
 roman_restoration.0002.a: "Může to být pravda?"
 roman_restoration.0002.b: "Ale... co moje říše?"
 roman_restoration.0002.c: "Konec se blíží!"
 roman_restoration.0002.d: "Zastavím je!"
 roman_restoration.0002.e: "Chápu..."
 roman_restoration.0003.t: "Svatá a římská"
 roman_restoration.0003.desc.greeks: "Jaká ironie, že říše, kterou Byzantinci kdysi haněli jako barbarského uchazeče, má být přivedena k věčné slávě pod řeckým vedením...\n\n"
 roman_restoration.0003.desc.other: ""
 roman_restoration.0003.desc: "Sen Karla Velikého se díky mým chrabrým činům naplnil. Svatá říše římská zaujala své právoplatné místo jako skutečná dědička Říma a nárokuje si vládu nad Východem i Západem. \n\nPro [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] na celém světě začíná nová éra míru a prosperity. Požehnané legie této říše rozšíří svaté poselství našeho Pána do všech koutů světa, dokud nebude ustanovena jediná skutečně všeobecná církev. Za [ROOT.Char.GetFaith.HighGodName|U] a [scoped_emperor.GetTitleTierName] Říma!"
 roman_restoration.0003.a: "Esto perpetua!"
 roman_restoration.0004.t: "Svatá a římská"
 roman_restoration.0004.desc.byzantines: "Stalo se nemyslitelné! Uchazeči ze Západu si krvavě proklestili cestu východními provinciemi a zmocnili se samotného srdce naší kdysi slavné říše.\n\nPoté, co [scoped_emperor.GetTitledFirstName] obnovil[Select_CString(scoped_emperor.IsFemale, 'a', '')] pod svou vládou většinu dávných provincií, prohlásil[Select_CString(scoped_emperor.IsFemale, 'a', '')] Římskou říši za obnovenou pod svým barbarským vedením."
 roman_restoration.0004.desc.others: "Od chvíle, kdy papež Lev III. korunoval Karla Velikého, hleděla „Říše Řeků“ s opovržením na říši, kterou považovala za pouhého uchazeče ze Západu. [scoped_emperor.GetTitledFirstName] však dokázal[Select_CString(scoped_emperor.IsFemale, 'a', '')] nemožné a obnovil[Select_CString(scoped_emperor.IsFemale, 'a', '')] dávné hranice na Východě i Západě.\n\nTato nová říše, zrozená pod svatým světlem, které šíří [scoped_emperor.GetFaith.HealthGodName], nyní stojí jako jediné pravé Imperium Romanum, připravené vnést řád do temného světa."
 roman_restoration.0004.a: "Je to vůbec možné...?"
 roman_restoration.0004.b: "Pořád jsou to jen uchazeči!"
 roman_restoration.0005.t: "Augustus"
 roman_restoration.0005.desc.regular: "Senát i vojsko mě provolaly právoplatným vládcem obnovené Římské říše. \n\nŽádnému člověku nemůže být svěřena větší čest ani odpovědnost. Chci-li se udržet u moci, musím dostát očekáváním svých poddaných."
 roman_restoration.0005.desc.holy: "Duchovenstvo [ROOT.Char.GetFaith.GetAdjective] víry i vojsko mě provolaly právoplatným vládcem obnovené Římské říše. \n\n[ROOT.Char.GetFaith.HighGodName] mi ve své milosti umožní vládnout spravedlivě a dlouho."
 roman_restoration.0005.a: "Ave Caesar!"
 roman_restoration.0006.t: "Nový císař"
 roman_restoration.0006.desc: "Po ztrátě veškeré legitimity už nemohu vznášet žádný nárok na titul Augusta. Říše nyní náleží [new_holder.GetTitledFirstName]."
 roman_restoration.0006.a: "Já se vrátím!"
 roman_restoration.0010.t: "Provincie Syria Palaestina"
 roman_restoration.0010.desc: "Celá starověká provincie Syria Palaestina byla konečně vyrvána z odporných spárů barbarů a navrácena Imperiu Romanum. Na počest statečných hrdinů, kteří tento čin vykonali, se bude konat velkolepý triumf. Kéž jejich jména znějí věčností!"
 roman_restoration.0010.a: "Ať žije říše!"
 roman_restoration.0011.t: "Provincie Aegyptus"
 roman_restoration.0011.desc: "Pro lid Aegypta skončily temné časy, neboť v provincii byla znovu nastolena římská vláda. Země faraonů kdysi dobře sloužila jako obilnice staré říše a nyní se opět stane životně důležitým pilířem další prosperity slavného římského státu."
 roman_restoration.0012.t: "Provincie Cyrenaica"
 roman_restoration.0012.desc: "Obyvatelé Kyrenaiky mohou jásat, neboť v této nehostinné zemi opět platí římské právo. Další starověká římská provincie se vrátila do náruče nejmocnější říše, jakou kdy civilizovaný svět spatřil. Kéž už nikdy nepozná krutý dotek barbarů."
 roman_restoration.0013.t: "Provincie Africa"
 roman_restoration.0013.desc: "Zlatí orli Říma opět září nad někdejší římskou provincií Africa stejně jako před tolika staletími. Císařská vojska pochodují Kartágem, dávným úhlavním nepřítelem Říma, jako nezvratný důkaz, že dějiny se skutečně opakují."
 roman_restoration.0014.t: "Provincie Illyricum"
 roman_restoration.0014.desc: "Někdejší římská provincie Illyricum byla znovu navrácena svým právoplatným vlastníkům v obrozeném Imperiu Romanum. Díky zabezpečení východního pobřeží Jadranu se tato významná oblast pro nábor vojska může ukázat jako klíčová při budoucích taženích za obnovení právoplatných římských hranic na západě."
 roman_restoration.0015.t: "Provincie Italia"
 roman_restoration.0015.desc: "Podruhé od pádu Západořímské říše byla Itálie osvobozena a navrácena pod řádnou římskou vládu, tentokrát snad už navždy. Samotné velké město Řím je nyní pod mou kontrolou a dokonce i ostřílení vojáci propukají v pláč, když z Trajánova sloupu ve větru vlaje císařská standarta."
 roman_restoration.0016.t: "Provincie Gallia"
 roman_restoration.0016.desc: "Galie, dlouho považovaná za navždy ztracenou pro římskou vládu, se podrobila Římu a byla znovu začleněna do říše. Od dob, kdy zde před více než tisíci lety vedl svá tažení Caesar, se provincie značně změnila, ale už nebude trpět pod vládou povýšeneckých králů ani falešných císařů."
 roman_restoration.0017.t: "Provincie Germania"
 roman_restoration.0017.desc: "Římská říše nyní překročila i hranice, které si nárokovala za vlády velkého [GetScriptedCharacterByHistoryID( '145279' ).GetFirstName]. Germánie, odvěká pohroma římských vojsk, byla konečně zpacifikována a začleněna do říše. Nyní jí bude vládnout skutečný pokračovatel římského státu, nikoli falešná říše, která si na něj pouze hraje."
 roman_restoration.0018.t: "Provincie Britannia"
 roman_restoration.0018.desc: "Britové, krutě ponechaní svému osudu poté, co římské posádky v 5. století opustily provincii Britannia, mohou konečně jásat. Po staletích temnoty byla na jejich malém ostrově konečně obnovena římská vláda a oni se opět mohou považovat za císařské poddané."
 roman_restoration.0019.t: "Provincie Hispania"
 roman_restoration.0019.desc: "Moc a vliv Římské říše nyní opět sahají až do někdejší provincie Hispania. Tato země těžce trpěla neustálými pohraničními šarvátkami mezi svárlivými muslimskými a katolickými pány, ale nyní snad konečně znovu pozná mír, když se nad poloostrovem rozprostírá Pax Romana."
 roman_restoration.0020.t: "Provincie Mauretania"
 roman_restoration.0020.desc: "Velký vojevůdce Belisarios v 6. století znovudobyl části Mauretanie od barbarských Vandalů, ale nakonec vše padlo do rukou Arabů při jejich nezadržitelném postupu severní Afrikou. Nyní, když byla tato země po staletích špatné vlády zcela navrácena pod římskou kontrolu, může znovu vzkvétat."
 roman_restoration.0021.t: "Provincie Mesopotamia"
 roman_restoration.0021.desc: "Císař Traján dobyl Mezopotámii na Parthské říši a uspořádal ji jako římskou provincii, ale jeho nástupce Hadrián ji o několik let později opustil. Nyní jsou Eufrat a Tigris opět pod římskou záštitou a tentokrát pod ní snad zůstanou."
 roman_restoration.0022.t: "Provincie Caledonia"
 roman_restoration.0022.desc: "Římské hranice nyní postoupily daleko za starověké trosky Hadriánova i Antoninova valu a konečně zahrnují celou Kaledonii. Tato drsná a neúprosná země je domovem svérázného lidu, ale i z něj ještě uděláme řádné římské občany."
 roman_restoration.0023.t: "Provincie Hibernia"
 roman_restoration.0023.desc: "Ostrov Hibernia je nejnovějším přírůstkem ke stále se rozšiřujícím državám Římské říše. Tuto zemi mírně zvlněných kopců a zelených polí stará říše nikdy nedobyla, ale pokud člověku nevadí déšť ani páchnoucí severští osadníci podél pobřeží, měla by se stát příjemným lénem ke správě."
 roman_restoration.0024.t: "Císařské hranice obnoveny"
 roman_restoration.0024.desc.intro: "Příběh slavného obrození Římské říše se bude vyprávět po celé věky. Ti nešťastníci, kteří prožili černé dny, kdy barbaři beztrestně plenili Řím nebo se z pouště valili arabští nájezdníci, by se tohoto dne neodvážili ani snít. Všechny staré provincie byly znovu získány a říše nyní sahá dál než kdykoli za téměř tisíc let."
 roman_restoration.0024.desc.christian: "\n\nPo celé Evropě znějí kostelní zvony na oslavu této přelomové události a muži i ženy v Římě i Konstantinopoli pláčou radostí. V zájmu celého lidstva musí nová Pax Romana přetrvat, jinak svět znovu upadne do temného věku nevědomosti a barbarství bez vůdčího světla Říma."
 roman_restoration.0024.desc.hellenic: "\n\nŘíše Caesara a Augusta setřásla břemeno mrtvého boha Galilejců, znovu přijala olympské bohy a povstala z popela. V zájmu celého lidstva musí nová Pax Romana přetrvat, jinak svět znovu upadne do temného věku nevědomosti a barbarství bez vůdčího světla Říma."
 roman_restoration.0024.desc.fallback: "\n\nNesčetní lidé všech národů a vyznání po celé Evropě oslavují tuto přelomovou událost a muži i ženy v Římě i Konstantinopoli pláčou radostí. V zájmu celého lidstva musí nová Pax Romana přetrvat, jinak svět znovu upadne do temného věku nevědomosti a barbarství bez vůdčího světla Říma."
 roman_restoration.0100.t: "Velké schizma zaceleno"
 roman_restoration.0100.desc.intro: "Velké schizma bylo konečně zaceleno."
 roman_restoration.0100.desc.orthodox: "\n\nArogantní biskupové v Římě si už nebudou osobovat nezaslouženou nadřazenost nad sobě rovnými a přehlížet či přímo porušovat kanonická nařízení. Po opětovném sjednocení pentarchie pod pravoslavnou císařskou vládou má katolická víra na evropský lid už jen malý vliv. \n\nJe jen otázkou času, než bude několik posledních věřících, kteří stále lpějí na zastaralých a kacířských obřadech, přivedeno do lůna pravé ekumenické církve."
 roman_restoration.0100.desc.catholic: "\n\nStaletý boj papežství za prosazení své nadřazenosti nad pentarchií konečně skončil. Po opětovném sjednocení původních stolců pod katolickou vládou bylo pravoslavné duchovenstvo donuceno sklonit se před nepopiratelnou autoritou stolce svatého Petra. \n\nTěch několik málo, kteří stále lpějí na svých zastaralých a kacířských obřadech, bude brzy přivedeno do lůna pravé ekumenické církve, tak či onak."
 roman_restoration.0100.desc.generic: "\n\nPentarchie je pevně pod kontrolou [mending_faith.GetName] a nečekaným obratem už papež v Římě ani patriarcha v Konstantinopoli nemohou popírat prvenství [mending_faith.GetName] nad všemi ostatními větvemi křesťanství."
 roman_restoration.0100.a: "Všeobecná církev byla obnovena!"
 roman_restoration.0101.desc.intro: "Velké schizma, které tak dlouho sužovalo křesťanství, konečně skončilo."
 roman_restoration.0101.desc.orthodox: "\n\nPoté, co [scoped_emperor.GetTitledFirstName] dobyl[Select_CString(scoped_emperor.IsFemale, 'a', '')] všechny ekumenické stolce původní pentarchie, dokázala pravoslavná církev přimět většinu katolického světa, aby uznala její autoritu jako jediné legitimní větve křesťanství. Zkorumpovaná vatikánská aristokracie byla vyhnána a jejích stoupenců každým dnem ubývá."
 roman_restoration.0101.desc.catholic: "\n\nPoté, co [scoped_emperor.GetTitledFirstName] dobyl[Select_CString(scoped_emperor.IsFemale, 'a', '')] všechny ekumenické stolce původní pentarchie, dosáhl Svatý stolec svého dávného cíle: vykořenit pravoslavnou církev a stát se jedinou legitimní větví křesťanství. Patriarcha byl donucen odejít do exilu a mnoho významných pravoslavných teologů se podrobilo autoritě stolce svatého Petra. Pravoslaví tak může brzy upadnout v zapomnění."
 roman_restoration.0101.desc.generic: "\n\nPoté, co [scoped_emperor.GetTitledFirstName] dobyl[Select_CString(scoped_emperor.IsFemale, 'a', '')] všechny ekumenické stolce původní pentarchie, prosadila se církev [mending_faith.GetName] v očích mnohých jako jediná legitimní větev křesťanství. Papežství i ekumenický patriarchát byly vykořeněny ze svých tradičních mocenských sídel a mnoho pravoslavných i katolických věřících se přidává k nové všeobecné církvi."
 roman_restoration.0101.a: "Jestli tímto směrem vane vítr..."
 roman_restoration.0101.b: "Kacíři! Všichni do jednoho!"
 roman_restoration.0102.a: "Znepokojivé zprávy..."
 roman_restoration.0104.t: "Antiochijský patriarchát"
 roman_restoration.0104.desc: "Po návratu města pod římskou vládu byl Antiochijský patriarchát řádně obnoven jako jeden z biskupských stolců pentarchie v pravoslavné církvi. Původně jej založil svatý Petr apoštol, kterého západní katolická církev považuje za prvního papeže."
 roman_restoration.0104.a: "Chvála Bohu!"
 roman_restoration.0105.t: "Jeruzalémský patriarchát"
 roman_restoration.0105.desc: "Po návratu města pod římskou vládu byl Jeruzalémský patriarchát řádně obnoven jako jeden z biskupských stolců pentarchie v pravoslavné církvi. Původně jej založil svatý Jakub Spravedlivý, který se krátce po Ježíšově smrti stal hlavou jeruzalémské církve."
 roman_restoration.0106.t: "Alexandrijský patriarchát"
 roman_restoration.0106.desc: "Po návratu města pod římskou vládu byl Alexandrijský patriarchát řádně obnoven jako jeden z biskupských stolců pentarchie v pravoslavné církvi. Původně jej založil svatý Marek Evangelista, který se stal prvním alexandrijským patriarchou."
 roman_restoration.0107.t: "Římský patriarchát"
 roman_restoration.0107.desc: "Po návratu města pod římskou vládu byl Římský patriarchát řádně obnoven jako jeden z biskupských stolců pentarchie v pravoslavné církvi. Pokud se všech pět historických patriarchátů vrátí do pentarchie, může být Velké schizma mezi východní a západní církví konečně zaceleno."
 roman_restoration.0120.t: "Ikonoklastický patriarchát"
 roman_restoration.0120.desc: "Velké město Konstantinopol je v rukou ikonoklastů a do čela východní církve byl dosazen nový patriarcha. [new_pope.GetFaith.HighGodName] bude stát při [new_pope.GetFirstName], který se ukáže být ctnostnějším a ohleduplnějším vůdcem než jeho ekumeničtí předchůdci. \n\nTento nový patriarchát se jistě postaví proti výstřelkům, korupci a modloslužebnictví svého předchůdce a zahájí novou slavnou éru pro všechny věrné ikonoklasty."
 roman_restoration.0120.a: "Pryč s těmito rouhačskými modlami!"
 roman_restoration.0121.desc.orthodox: "Velké město Konstantinopol padlo do rukou kacířů a odporný ikonoklasta [reformer.GetTitledFirstName] dosadil do ekumenické církve falešného patriarchu a zbavil úřadu všechny pravoslavné preláty.\n\nPokud nebude tento tyran brzy svržen a rouhání [reformer.GetTitledFirstName] napraveno, může to být počátek konce pravoslavné církve."
 roman_restoration.0121.desc.iconoclast: "Velké město Konstantinopol je v rukou ikonoklastů a [reformer.GetTitledFirstName] dosadil[Select_CString(reformer.IsFemale, 'a', '')] do čela východní církve nového patriarchu. [new_pope.GetFaith.HighGodName] bude stát při [new_pope.GetFirstName], který se ukáže být ctnostnějším a ohleduplnějším vůdcem než jeho ekumeničtí předchůdci. \n\nTento nový patriarchát se jistě postaví proti výstřelkům, korupci a modloslužebnictví svého předchůdce a zahájí novou slavnou éru pro všechny věrné ikonoklasty."
 roman_restoration.0121.desc.other: "Velké město Konstantinopol je v rukou ikonoklastů a [reformer.GetTitledFirstName] dosadil[Select_CString(reformer.IsFemale, 'a', '')] do čela východní církve nového patriarchu.\n\nVětšina staršího pravoslavného duchovenstva byla zbavena úřadů, uvězněna nebo donucena odejít do exilu a ekumenická víra tak byla odsunuta do postavení kacířství."
 roman_restoration.0121.a: "Divoši!"
 roman_restoration.0121.b: "Už bylo načase!"
 roman_restoration.0121.c: "Chápu..."
 roman_restoration.0122.t: "Ekumenický patriarchát"
 roman_restoration.0122.desc: "Nešťastné vyhnanství Ekumenického patriarchátu konečně skončilo.\n\nJediná pravá církev se vrátila do Konstantinopole a je připravena vést křesťanský svět pevnou, ale laskavou rukou."
 roman_restoration.0122.a: "Sláva!"
 roman_restoration.0123.desc.orthodox: "Nešťastné vyhnanství Ekumenického patriarchátu konečně skončilo.\n\nDíky zbožnému vedení [reformer.GetTitledFirstName] se jediná pravá církev vrátila do Konstantinopole a je připravena vést křesťanský svět pevnou, ale laskavou rukou."
 roman_restoration.0123.desc.iconoclast: "Spiknutí odporných modloslužebníků vedené [reformer.GetTitledFirstName] dokázalo ovládnout Konstantinopol a obnovit zkorumpovaný kacířský patriarchát minulosti. Pokud je brzy nikdo nezastaví, může ikonoklasmus zanedlouho upadnout v zapomnění!"
 roman_restoration.0123.desc.other: "Nešťastné vyhnanství Ekumenického patriarchátu konečně skončilo.\n\nDíky zbožnému vedení [reformer.GetTitledFirstName] se východní církev vrátila do svého právoplatného sídla v Konstantinopoli."
 roman_restoration.0123.a: "Konečně se do církve vrátil rozum!"
 roman_restoration.0123.b: "Odporní modloslužebníci, všichni do jednoho!"
 roman_restoration.0123.c: "Chápu..."
 roman_restoration.0124.t: "Svatý stolec"
 roman_restoration.0124.desc: "Věk zmatku a zoufalství katolického světa skončil. Nový papež se vrátil na historický stolec v Římě a jediná pravá církev se konečně může vzpamatovat z katastrofálních ran poslední doby.\n\n[new_pope.GetFaith.HighGodName] bude stát při [new_pope.GetTitledFirstName], který vnese řád a stabilitu mezi katolické duchovenstvo, jež bylo dosud rozptýleno po celé Evropě, a obnoví přísnou církevní hierarchii."
 roman_restoration.0124.a: "Svatý stolec povstal z popela!"
 roman_restoration.0125.desc.catholic: "Díky požehnanému zásahu [reformer.GetTitledFirstName] skončil věk zmatku a zoufalství katolického světa. Nový papež se vrátil na historický stolec v Římě a jediná pravá církev se konečně může vzpamatovat z katastrofálních ran poslední doby.\n\n[new_pope.GetFaith.HighGodName] bude stát při [new_pope.GetTitledFirstName], který vnese řád a stabilitu mezi katolické duchovenstvo, jež bylo dosud rozptýleno po celé Evropě, a obnoví přísnou církevní hierarchii."
 roman_restoration.0125.desc.other: "Po ztrátě svého dávného sídla a většiny stoupenců považovali mnozí katolickou církev za stojící na pokraji zániku. Díky zbožnému zásahu [reformer.GetTitledFirstName] však v Římě opět vládne nový papež.\n\nS obnoveným Svatým stolcem by katolíci mohli znovu získat své místo mezi hlavními větvemi křesťanství."
 roman_restoration.0125.a: "Naše Matka církev je opět celistvá!"
 roman_restoration.0125.b: "Zajímavé..."
 roman_restoration.0130.t: "Zrušení papežství"
 roman_restoration.0130.desc.muslim: "Vláda křesťanů nad Římem konečně skončila. \n\nDíky vytrvalému úsilí mnoha oddaných služebníků [scoped_destroyer.GetFaith.HighGodName] padla celá Itálie pod [scoped_destroyer.GetFaith.GetAdjective] vládu. Věřící neúnavně odstraňovali všechny rouhačské obrazy a přivedli před spravedlnost zkažené duchovenstvo, které těmto zemím vládlo."
 roman_restoration.0130.desc.hellenic: "Tyranie Galilejců nad Evropou konečně skončila.\n\nPo staletí měli tito přeceňovaní sektáři volnou ruku k hanobení a ničení starověkých památek našich božských ochránců, ale tomu je konec! Obnovením [scoped_destroyer.GetFaith.GetAdjective] vlády nad Římem a Apeninským poloostrovem jsme rozdrtili samotné srdce církve tesařského boha."
 roman_restoration.0130.desc.fallback: "Po staletích ponižování a klamů ze strany jejich misionářů se následovníci [scoped_destroyer.GetFaith.HighGodName] konečně pomstili vyznavačům boha Krista. \n\nS přízní našich bohů jsme dobyli srdce jejich víry, vyplenili jejich kostely a zbavili jejich kněží veškeré moci i důstojnosti. Díky svému slavnému tažení jsem svět zbavil tohoto zbabělého náboženství a pomstil potupu, kterou jejich úklady přivodily našim zemím a předkům."
 roman_restoration.0130.desc.pope.submission: "\n\nTváří v tvář naší nepopiratelné náboženské převaze se bývalý papež [scoped_pope.GetFullName] dokonce veřejně zřekl [catholic.GetAdjectiveNoTooltip] víry a přestoupil k [scoped_destroyer.GetFaith.GetNameNoTooltip]!"
 roman_restoration.0130.desc.pope.crucifixion: "\n\n[scoped_pope.GetFirstName], který se stále vzdorovitě držel nezaslouženého titulu Pontifex Maximus, byl ukřižován mezi hořícími troskami Vatikánu. Tak končí potupná řada křesťanských římských pontifiků."
 roman_restoration.0130.desc.pope.sacrificed: "\n\nVatikánská katedrála byla posvěcena a znovu zasvěcena [scoped_destroyer.GetFaith.HighGodName] krví [scoped_pope.GetTitledFirstName], obětovaného[Select_CString(scoped_pope.IsFemale, 'é', '')] na samotném oltáři, z něhož dříve kázal[Select_CString(scoped_pope.IsFemale, 'a', '')]."
 roman_restoration.0130.desc.no_pope: "\n\nNeorganizovaní [catholic.BishopNeuterPlural] se jednotlivě snaží povzbudit sklíčené [catholic.GetAdherentNamePluralNoTooltip], ale bez skutečného [catholic.ReligiousHeadName], který by je vedl, je zřejmé, že dny papežské autority skončily."
 roman_restoration.0130.a.a: "[scoped_destroyer.GetFaith.HighGodName] nám požehnal!"
 roman_restoration.0130.a.b: "Nastal čas našeho obrození!"
 roman_restoration.0130.a.c: "Jejich mrtvý bůh je nakonec nedokázal ochránit."
 roman_restoration.0131.desc.faithful: "Díky neúnavnému dobyvačnému tažení [scoped_destroyer.GetTitledFirstName] padl celý Apeninský poloostrov pod [scoped_destroyer.GetFaith.GetAdjective] vládu.\n\n[scoped_destroyer.GetFaith.HighGodName] pomohl [scoped_destroyer.GetTitledFirstName] vypátrat všechny zbývající skupiny katolíků, které se v Itálii stále scházely, a zbavit všechna významná biskupství majetku a vlivu, čímž byla autoritě falešné církve zasazena těžká rána."
 roman_restoration.0131.desc.christians: "Nestvůrné tažení teroru vedené [scoped_destroyer.GetTitledFirstName] přineslo srdci naší svaté Matky církve zkázu a temnotu!\n\nTento odporný pohan zbavil papežství veškerého majetku a důstojnosti, brutálně zavraždil nesčetné teology a nezastaví se, dokud nepokoří celé křesťanstvo. Vatikán je zničen, jeho hierarchie rozvrácena a katolická víra byla ponížena na neorganizovaný kult."
 roman_restoration.0131.desc.fallback: "Odvážné dobyvačné tažení [scoped_destroyer.GetTitledFirstName] přineslo srdci katolické církve zkázu a temnotu!\n\nPapežství již bylo zbaveno většiny majetku a důstojnosti a zdá se, že [scoped_destroyer.GetTitledFirstName] nebude spokojen[Select_CString(scoped_destroyer.IsFemale, 'á', 'ý')], dokud nepokoří celé křesťanstvo. Vatikán je zničen, jeho hierarchie rozvrácena a katolická víra byla ponížena na neorganizovaný kult."
 roman_restoration.0131.a.a: "Už bylo načase, aby to někdo udělal."
 roman_restoration.0131.a.b: "Konec se blíží!"
 roman_restoration.0131.a.c: "Chápu..."
 roman_restoration.0140.t: "Italská říše"
 roman_restoration.0140.desc: "Od pádu Západořímské říše byl Apeninský poloostrov rozdroben mezi vzpurné městské státy, chamtivé biskupy a barbarské dobyvatele.\n\nPod vládou mé dynastie však Itálie ukončila malicherné sváry, znovu se sjednotila a povstala jako dominantní mocnost Západu. Už nebudeme kořistí, o kterou soupeří Frankové s Řeky, ani nás nebudou sužovat piráti a barbarští uchazeči. Ode dneška znovu zaujímáme své místo skutečných dědiců Římské říše!"
 roman_restoration.0140.a: "Labor omnia vincit!"
 roman_restoration.0141.desc: "Od pádu Západořímské říše byl Apeninský poloostrov rozdroben mezi vzpurné městské státy, chamtivé biskupy a barbarské dobyvatele a jeho dávná sláva se ztrácela v malicherných svárech.\n\nPod vládou [scoped_ruler.GetTitledFirstName] se však Itálie znovu sjednotila a povstala jako dominantní mocnost Západu. Země, o kterou kdysi soupeřili Frankové s Řeky, se nyní stala samostatnou říší vládnoucí nad samotným jádrem někdejších římských zemí."
 roman_restoration.0141.a: "To je nešťastné."
 roman_restoration.0141.b: "Zajímavé..."
 roman_restoration.0150.t: "Od Říma k Římu"
 roman_restoration.0150.desc: "Nyní je jasné, že žádný pokus obnovit rozvrácenou říši dávných časů nemohl uspět, dokud jej podnikali barbarští Němci nebo zženštilí Řekové.\n\nJedině díky obětem italského lidu se Řím opět navrátil na své právoplatné místo Královny měst.\n\n"
 roman_restoration.0150.a: "Omnes viae Romam ducunt."
 roman_restoration.0151.t: "Druhý věk Říma"
 roman_restoration.0151.desc.byzantines: "Stalo se nemyslitelné! Malicherné městské státy Itálie se dokázaly sjednotit pod jediným praporem a krvavě si proklestit cestu do našich východních provincií ve snaze obnovit dávnou říši.\n\nPoté, co [scoped_emperor.GetTitledFirstName] obnovil[Select_CString(scoped_emperor.IsFemale, 'a', '')] pod svou vládou většinu starověkých provincií, prohlásil[Select_CString(scoped_emperor.IsFemale, 'a', '')] Římskou říši za obnovenou pod svým barbarským vedením. S tím málem legitimity, které nám ještě zbývá, už tento směšný nárok nemůžeme jednoduše odmítnout."
 roman_restoration.0151.desc.others: "Vzestupná Italská říše dokázala pod vedením [scoped_emperor.GetTitledFirstName] znovu získat dostatek starých provincií, aby se mohla prohlásit za znovuzrozenou Římskou říši.\n\nTento nový stát pohrdá pretendenty na severu i na východě a hodlá proti všem protivníkům obnovit své dávné hranice."
 roman_restoration.0160.t: "Pretendent"
 roman_restoration.0160.desc: "Příliš dlouho jsme trpěli, aby se barbarští pretendenti na severu halili do nezasloužené císařské důstojnosti. Řím je pevně v rukou pravé říše a ubohá federace německých válečníků, která se kdysi snažila ovládnout Západ, byla zahnána za Rýn do divokých lesů, kam patří.\n\nJe načase dát těmto barbarům poslední lekci a jednou provždy je zbavit jejich falešné říše."
 roman_restoration.0160.a: "Naše legie je rozdrtí!"
 roman_restoration.0161.t: "Římské zúčtování"
 roman_restoration.0161.desc: "[byz_emperor.GetTitledFirstName] mě veřejně označil[Select_CString(byz_emperor.IsFemale, 'a', '')] za falešného [hre_emperor.GetTitleTierName] a chystá se proti mému lidu rozpoutat děsivou moc [byz_emperor.GetPrimaryTitle.GetName].\n\nNestačilo, že mě lidé jako [byz_emperor.GetTitledFirstName] vytlačovali stále dál z našich zemí. Řím nebude spokojen, dokud neporazí všechny uchazeče o svou slávu."
 roman_restoration.0161.a: "Ještě jsme neřekli poslední slovo!"
 roman_restoration.0162.t: "Frankové za Rýnem"
 roman_restoration.0162.desc: "Je hotovo. Naše velké tažení rozdrtilo takzvanou Svatou říši římskou tak, že už ji nelze napravit. [hre_emperor.GetTitledFirstName] utrpěl[Select_CString(hre_emperor.IsFemale, 'a', '')] naprosté ponížení a přišel[Select_CString(hre_emperor.IsFemale, 'a', '')] o veškerou císařskou důstojnost. Už nemá autoritu ani prostředky ke sjednocení barbarských kmenů Německa pod jediným praporem."
 roman_restoration.0162.a: "A dobře tak!"
 roman_restoration.0163.t: "Římské zúčtování"
 roman_restoration.0163.desc: "Obrození Římané zmrzačili říši Němců k nepoznání. Po této zdrcující porážce od jejich legií má mé slovo mezi bývalými vazaly pramalou váhu. Sen Karla Velikého končí."
 roman_restoration.0163.a: "Jak se to mohlo stát?"
 roman_restoration.0164.t: "Frankové vracejí úder"
 roman_restoration.0164.desc: "Navzdory všem očekáváním dokázal[Select_CString(hre_emperor.IsFemale, 'a', '')] [hre_emperor.GetTitledFirstName] mé legie účinně odrazit! Tímto vítězstvím dodal[Select_CString(hre_emperor.IsFemale, 'a', '')] své rozpadající se říši novou legitimitu a mé jméno nenapravitelně pošpinil[Select_CString(hre_emperor.IsFemale, 'a', '')]."
 roman_restoration.0164.a: "A co mí orli?!"
 roman_restoration.0165.t: "Frankové vracejí úder"
 roman_restoration.0165.desc: "Pýcha Římanů se jim stala osudnou. Přes všechny řeči [byz_emperor.GetTitledFirstName] nedokázaly římské legie obstát proti mým věrným $knight_culture_player_plural_no_tooltip_lowercase$. Díky své neochvějné obraně jsem svému titulu navrátil důstojnost."
 roman_restoration.0165.a: "A už se nikdy nevracejte!"
 roman_restoration.0170.t: "Uchazeč"
 roman_restoration.0170.desc: "Příliš dlouho jsme dovolovali chabým pozůstatkům Justiniánovy říše lpět na důstojnosti titulu, který už dávno potřísnili nekonečnou řadou neschopných, malicherných a zkažených králů.\n\nItálie i Řecko jsou již pod naší kontrolou, zatímco oni se scvrkli na pouhou upadající východní despocii, příliš chamtivou a záštiplnou na to, aby uznala, že její čas už dávno minul."
 roman_restoration.0170.a: "Dodáme jim potřebné povzbuzení."
 roman_restoration.0171.t: "Římské zúčtování"
 roman_restoration.0171.desc: "[hre_emperor.GetTitledFirstName] mě veřejně označil[Select_CString(hre_emperor.IsFemale, 'a', '')] za falešného [byz_emperor.GetTitleTierName] a chystá se proti mému lidu rozpoutat děsivou moc [hre_emperor.GetPrimaryTitle.GetName].\n\nNestačilo, že mě lidé jako [hre_emperor.GetTitledFirstName] vytlačovali stále dál z našich zemí. Řím nebude spokojen, dokud neporazí všechny uchazeče o svou slávu."
 roman_restoration.0171.a: "My jsme jediní praví dědicové Říma!"
 roman_restoration.0172.t: "Byzanc se hroutí"
 roman_restoration.0172.desc: "Je hotovo. Zkažené pozůstatky Říše Řeků byly smeteny z pobřeží Řecka a Malé Asie. Jejich vůdci a úředníci byli zbaveni moci a jejich vojska ochromena, takže [byz_emperor.GetTitledFirstName] už nedokáže vydržovat svůj dekadentní dvůr pochlebovačů a zákeřníků ani prosazovat svou autoritu za zdmi vlastního paláce."
 roman_restoration.0172.a: "Už bylo načase."
 roman_restoration.0173.t: "Římské zúčtování"
 roman_restoration.0173.desc: "Naše říše leží v troskách. Po jejich agresivním tažení plném ponižování a ničení mi barbarské hordy [hre_emperor.GetTitledFirstName] nezanechaly nic než ruiny a válčící městské státy. Titul, který jsem kdysi nosil, už nemá žádnou císařskou důstojnost."
 roman_restoration.0173.a: "Vy zrůdy!"
 roman_restoration.0174.t: "Řekové vracejí úder"
 roman_restoration.0174.desc: "Navzdory všem očekáváním dokázal[Select_CString(byz_emperor.IsFemale, 'a', '')] [byz_emperor.GetTitledFirstName] mé síly účinně odrazit! Tímto vítězstvím dodal[Select_CString(byz_emperor.IsFemale, 'a', '')] své rozpadající se říši novou legitimitu a mé jméno nenapravitelně pošpinil[Select_CString(byz_emperor.IsFemale, 'a', '')]."
 roman_restoration.0174.a: "Jak se to mohlo stát?!"
 roman_restoration.0175.t: "Řekové vracejí úder"
 roman_restoration.0175.desc: "Učenci budou ještě dlouho rozebírat, jaké bláznovství přimělo [hre_emperor.GetTitledFirstName] vytáhnout do války proti pravým dědicům Říma. Ubohý pokus tohoto uchazeče připravit mě o mé božské právo vládnout Evropě skončil jen předvídatelnou a ponižující porážkou."
 roman_restoration.0175.a: "O výsledku nikdy nebylo pochyb."
 roman_restoration.1200.t: "Město touhy světa"
 roman_restoration.1200.desc: "Velké město Konstantinopol, zářivý maják východní říše, se k nám konečně vrátilo!\n\nJásající davy zaplavují prapory vyzdobenou [Glossary( 'Mesé', 'MESE_GLOSS' )] od Theodosiových bran až k Velkému paláci a jejich volání vítající návrat [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] vlády je slyšet až za Bospor.\n\nJeště za staletí se bude připomínat, že jsem to byl já, [ROOT.Char.GetFirstNameRegnal], kdo navrátil tento nejvzácnější římský klenot do náruče jeho říše."
 MESE_GLOSS: "#EMP Mesé#! neboli „Střední cesta“ byla hlavní třídou Konstantinopole a trasou procesí a triumfů. Její kolonádové jádro, #EMP Regia#! neboli „Císařská cesta“, vedlo západním směrem od Hagie Sofie přes každé z městských [Glossary( 'fór', 'FORUM_GLOSS' )], než se rozdělilo k branám v Theodosiových hradbách."
 FORUM_GLOSS: "Forum, v pořečtěné podobě #EMP fóros#!, byl římský výraz pro velké veřejné náměstí určené ke shromážděním a trhům, které bývalo často zdobeno válečnými trofejemi a sochami."
 roman_restoration.1200.a: "Právoplatné sídlo císařského trůnu je navráceno!"
 roman_restoration.1200.b.rome: "Roma victa!"
 roman_restoration.1200.b: "Konstantinovo město je opět v bezpečí."
 half_price_chariot_race_tooltip: "Můžeš uspořádat [Concept('activity','aktivitu')|E] #V $activity_chariot_race$#! za poloviční cenu"
 half_price_chariot_race_flag_desc: "Obnova"
 free_triumph_tooltip: "Můžeš zdarma použít [Concept('decision','rozhodnutí')|E] #V $hold_triumph_decision$#!"
 roman_restoration.1204.t: "[Select_CString(ROOT.Char.IsFemale, 'Ty bídná', 'Ty bídný')] [ROOT.Char.Custom('GirlBoy')],"
 roman_restoration.1204.desc_vassal: "Vytáhl jsem tě ze špíny a stejně snadno tě do ní můžu zase hodit! Snad sis #EMP doopravdy#! nemyslel[Select_CString(ROOT.Char.IsFemale, 'a', '')], že #EMP Konstantinopol#!, poslední bašta vzdělanosti na tomto žalostném světě, může skutečně patřit tobě! Ani tvůj nejmenší prst na noze není hoden dotknout se jejích třpytivých dlaždic! Vrať ji, jinak se Zlatý roh stane tvým hrobem pod vodou. Bude-li třeba, hodím tě tam vlastníma rukama."
 roman_restoration.1204.a: "Jen jsem ti ji zatím hlídal[Select_CString(ROOT.Char.IsFemale, 'a', '')]!"
 roman_restoration.1204.b: "Doufám, že si na trůnu zadřeš třísku do svého věčně remcajícího zadku."
