 diarchies.0000.diarch_mandate_fail.tt.train_self.self: "[diarch.GetFirstName] se místo výcviku tvých vojáků [Select_CString(diarch.IsFemale, 'zaměřila', 'zaměřil')] na vlastní výcvik"
 diarchy.0021.t: "[Select_CString(ROOT.Char.IsFemale, 'Povolána', 'Povolán')] jako [liege.GetDiarchTitle|l]"
 diarchy.0021.desc.appointment_nature.child: "[liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je ještě pouhé dítě. [liege.GetPrimaryTitle.GetName] tak zůstává bez účinné vlády. [liege.GetFirstNameNoTooltip] potřebuje pevnou a jistou ruku, která [Select_CString(liege.IsFemale, 'ji', 'ho')] povede alespoň do dosažení plnoletosti."
 diarchy.0021.desc.appointment_nature.incapable: "[liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je nyní jen roztřesená, neduživá #EMP troska#! a [liege.GetPrimaryTitle.GetName] balancuje na pokraji naprosté anarchie. A vzhledem k tomuto stavu kdo ví, jak dlouho zůstaneme bez skutečné autority?"
 diarchy.0021.desc.appointment_nature.imprisoned: "[liege.GetImprisonedBy.GetTitledFirstName] je věznitelem a [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] zůstává v zajetí. [liege.GetPrimaryTitle.GetName] je tak bez kormidla a unášen proudem. Zprávy přicházejí jen tak často, jak věznitel dovolí, a u každého dopisu se vedou nekonečné spory, zda jej skutečně [Select_CString(liege.IsFemale, 'napsala', 'napsal')] [liege.GetTitleAsNameNoTooltip]."
 diarchy.0021.desc.appointment_nature.travelling: "[liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] má nyní plné ruce práce v cizích zemích a [liege.GetPrimaryTitle.GetName] zůstává v nejistotě. Když [liege.GetTitleAsNameNoTooltip] nesedí na trůně, chybí závazná autorita, a #EMP to#! vazaly znervózňuje."
 diarchy.0021.desc.appointment_nature.war: "[liege.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je pryč a bojuje ve válce, zatímco mezi námi, kteří jsme zůstali doma, narůstá napětí. Zprávy z bojiště přicházejí nepravidelně a hromada nevyřešených sporů roste každým dnem."
 diarchy.0021.desc.appointment_nature.fallback: "Všem je naprosto zřejmé, že [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] nedokáže nést břemeno vlády bez pomoci. Jinak našim zemím hrozí nenapravitelné škody."
 diarchy.0021.desc.diarchy_type.regency_temporary: "\n\nAčkoli se neočekává, že tato povinnost potrvá dlouho, někdo musí dohlížet na panství, rozsuzovat spory, udržovat trůn v bezpečí a sloužit jako"
 diarchy.0021.desc.diarchy_type.regency_entrenched: "\n\nJelikož tato situace nejspíš nějakou dobu potrvá, musí panství vědět, na koho se obrátit, když [liege.GetTitledFirstNameNoTooltip] nemůže osobně vykonávat spravedlnost. Potřebujeme někoho, kdo bude natrvalo sloužit jako"
 diarchy.0021.desc.diarchy_type.fallback: "\n\nJe zřejmé, že takhle dál pokračovat nemůžeme. Jelikož [liege.GetTitledFirstNameNoTooltip] nemůže vládnout bez pomoci, někdo musí sloužit jako"
 diarchy.0021.desc.outro: "[liege.GetDiarchTitle|l].\n\nSamozřejmě tím někým budu já."
 diarchy.0021.reminder.diarch_powers: "Získáváš přístup k [Concept('diarch_powers','propůjčeným pravomocím')|E], které můžeš využít proti svému [Concept('liege','lennímu pánovi')|E] a ostatním [Concept('vassals','vazalům')|E]"
 diarchy.0021.reminder.scales_of_power: "Aktivovaly se [Concept('scales_of_power','misky vah moci')|E], které můžeš vychylovat a odemykat tak další [Concept('diarch_powers','propůjčené pravomoci')|E]"
 diarchy.0021.a: "Svou vlá-#EMP správu#! zahájím ihned!"
 diarchy.0021.a.sedate: "Už mám tolik nápadů pro panství!"
 diarchy.0021.b: "Ach, konečně uznání."
 diarchy.0021.c: "Obávám se, že už mám příliš mnoho neodkladných závazků..."
 mandate_induced_fines_to_liege_modifier: "Přemrštěné trestní pokuty"
 mandate_induced_fines_to_liege_modifier_desc: "Toto hrabství úpí pod jhem drakonických trestních pokut, vybíraných za účelem obohacení širšího panství."
 mandate_induced_fines_split_modifier: "Rozdělené přemrštěné trestní pokuty"
 mandate_induced_fines_split_modifier_desc: "Toto hrabství úpí pod jhem drakonických trestních pokut, z nichž značná část putuje přímo místnímu pánovi."
 mandate_fines_being_ignored_modifier: "Trestní pokuty ignorovány"
 mandate_fines_being_ignored_modifier_desc: "Toto hrabství ignoruje požadavky na přísnější pokuty pro zločince a stále se zlobí už jen kvůli tomu, že po něm něco takového bylo vůbec požadováno."
 mandate_hated_recruiter_modifier: "Nenáviděný verbíř"
 mandate_hated_recruiter_modifier_desc: "Tato postava je známá tím, že při posuzování způsobilosti k odvodu postupuje #EMP bezohledně#!."
 mandate_failed_to_drum_up_rural_recruits_modifier: "Neschopný verbíř"
 mandate_failed_to_drum_up_rural_recruits_modifier_desc: "Tato postava má špatnou pověst kvůli tomu, že se pokoušela svolat více odvedenců, než je považováno za spravedlivé, a ani v tom neuspěla."
 mandate_squeezing_recruiting_sources_modifier: "Násilné verbování"
 mandate_squeezing_recruiting_sources_modifier_desc: "Kdo je ve věku schopném boje, ten si svou službu odslouží. Jinak za to zaplatí."
 mandate_extra_recruiting_sources_modifier: "Mimozákonné verbování"
 mandate_extra_recruiting_sources_modifier_desc: "Ačkoli má toto hrabství do války vyslat jen určitý počet vojáků, dobře ví, že bude lepší přivést jich pár navíc. Jinak..."
 mandate_sellswords_bolster_ranks_modifier: "Žoldnéři doplňují řady"
 mandate_sellswords_bolster_ranks_modifier_desc: "Kdykoli některý z vojáků v domácnosti této postavy zemře nebo odejde ze služby, nikdy není nouze o dychtivé žoldnéře připravené zaujmout jeho místo."
 mandate_sellswords_bolster_recruitment_modifier: "Žoldnéři posilují nábor"
 mandate_sellswords_bolster_recruitment_modifier_desc: "Najatí bojovníci hledající #EMP trvalejší#! zdroj příjmů se vždy ochotně přidávají k domácnosti této postavy."
 mandate_hired_thugs_modifier: "Najatí hrdlořezové"
 mandate_hired_thugs_modifier_desc: "Odpůrcům této postavy se až podezřele často přihodí něco ošklivého."
 mandate_emptied_gaols_modifier: "Vyprázdněné žaláře"
 mandate_emptied_gaols_modifier_desc: "Hrdlořezové a lapkové se hrnou do tohoto hrabství, protože vědí, že zde jim budou zločiny odpuštěny výměnou za vojenskou službu."
 mandate_baronial_troops_trained_modifier: "Zocelené baronské vojsko"
 mandate_baronial_troops_trained_modifier_desc: "K nasazení v bitvě je způsobilých více vojáků této postavy, než by se dalo očekávat."
 mandate_baronial_troops_half_trained_modifier: "Napůl zocelené baronské vojsko"
 mandate_baronial_troops_half_trained_modifier_desc: "$mandate_baronial_troops_trained_modifier_desc$"
 mandate_focused_on_own_training_modifier: "Důraz na vlastní kondici"
 mandate_focused_on_own_training_modifier_desc: "Pravidelné procvičování základů udržuje tuto postavu v dobré bojové kondici."
 mandate_strained_self_training_modifier: "Přepjatý vlastní výcvik"
 mandate_strained_self_training_modifier_desc: "Tato postava se zranila při výcviku odvedenců a dosud se z toho úplně nevzpamatovala."
 shift_privileges_monopolies_sold_modifier: "Prodané monopoly"
 shift_privileges_monopolies_sold_modifier_desc: "Jakýsi pochybný člověk prodává výhradní práva na prodej či výrobu určitého zboží #EMP bez#! svolení místního vládce!"
 shift_privileges_scutage_exemptions_modifier: "Výjimky ze štítného"
 shift_privileges_scutage_exemptions_modifier_desc: "Listiny opatřené pečetí vyšší autority, než je místní vládce, dokládají, že značná část zdejšího rolnictva je osvobozena od vojenské služby."
 shift_privileges_conflicting_deeds_modifier: "Protichůdné listiny"
 shift_privileges_conflicting_deeds_modifier_desc: "Jakýsi ničemný darebák prodal různým místním velmožům drobná pozemková práva, která se navzájem překrývají nebo přebíjejí práva místního vládce."
 diarchy.1201.t: "Otevřená srdce, otevřené měšce"
 diarchy.1201.desc: "„Dlužné daně? Co myslíš těmi #EMP dlužnými daněmi#!?“ odfrkne si [exploitable_vassal.GetTitledFirstName]. „Své poplatky koruně odvádím včas a do posledního haléře jako všichni ostatní a rozhodně se nenechám vydírat, abych platil ještě víc.“\n\nMyšlence na zaplacení dodatečného desátku se brání... urputněji, než jsem doufal, ale můj mandát coby [liege.GetDiarchTitle] vyžaduje, abych podobnými prostředky sloužil zájmům svého lenního pána."
 diarchy.1201.a: "Z moci [liege.GetTitledFirstNameNoTooltip] #EMP zaplatíš#!."
 diarchy.1201.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1201.b: "To sice tvrdíš, ale tyto záznamy ukazují přinejlepším jen částečné odvody..."
 diarchy.1201.b.tt.success: "[exploitable_vassal.GetFirstNameNoTooltip] nakonec zaplatí"
 diarchy.1201.b.tt.failure: "[exploitable_vassal.GetTitleAsNameNoTooltip] zůstává neoblomný"
 diarchy.1201.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1201.c: "[liege.GetTitleAsNameNoTooltip] ani já se neptáme. Poroučíme."
 diarchy.1201.c.tt.success: "$diarchy.1201.b.tt.success$"
 diarchy.1201.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1201.c.tt.failure: "$diarchy.1201.b.tt.failure$"
 diarchy.1201.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1201.d: "Tohle nedokážu — samozřejmě máš daně v pořádku, nevšímej si mě."
 diarchy.1201.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1201.e: "Máš pravdu. Považuj tyto dluhy za zapomenuté."
 diarchy.1201.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1211.t: "Podmínky závazku"
 diarchy.1211.desc: "„...a hned několik svědků tvých přísah věrnosti potvrzuje, že ses zavázal své povinnosti #EMP překonat#!, nikoli je pouze splnit,“ dokončím. [exploitable_vassal.GetTitledFirstName] na mě přes stůl rady nevěřícně zírá.\n\n„Chceš snad tvrdit, že svědectví několika bezvýznamných nižších šlechticů ospravedlňuje, abych našemu lennímu pánovi dlužil ještě #EMP víc#!?“ vykoktá ze sebe, stále ohromen mou troufalostí.\n\nJe to odvážné tvrzení, ale můj mandát coby [liege.GetDiarchTitle] mi ukládá prosazovat zájmy [liege.GetTitledFirstName]."
 diarchy.1211.a: "Ano. A pokud se ti tito svědci nelíbí, mám i jiné."
 diarchy.1211.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1211.b: "Na svědcích záleží — tyto přísahy jsou posvátné."
 diarchy.1211.b.tt.success: "Svými argumenty přiměješ [exploitable_vassal.GetFirstNameNoTooltip] ustoupit"
 diarchy.1211.b.tt.failure: "Tvá argumentace se pod důkladným zkoumáním rozpadne"
 diarchy.1211.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1211.c: "Nebo můžeš složit novou přísahu věrnosti a přihodit malý desátek do #EMP pokladnice#!."
 diarchy.1211.c.tt.success: "[exploitable_vassal.GetFirstNameNoTooltip] zaplatí"
 diarchy.1211.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1211.c.tt.failure: "[exploitable_vassal.GetTitleAsNameNoTooltip] se odmítá nechat vydírat"
 diarchy.1211.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1211.d: "Bylo by kruté tě vláčet kvůli několika nešťastným formulacím..."
 diarchy.1211.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1211.e: "Možná... možná je to celé příliš neurčité..."
 diarchy.1211.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1221.t: "Tvůj nový domov"
 diarchy.1221.desc: "Podle mandátu od [liege.GetTitledFirstName] je mou hlavní povinností coby regenta naplnit pokladnici. Snadným způsobem je pomoci osídlit okrajové části [recipient_county.GetNameNoTier] přesídlením nevolníků a drobných hospodářů z mého [actor_county.GetName] na panství [liege.GetFirstNameNoTooltip].\n\nJenže rolníci se odmítají hnout. Přesunout násilím jedinou rodinu je jako trhat zub, jako by snad #EMP namítali#! něco proti tomu, že o jejich osudu rozhodují jejich páni."
 diarchy.1221.a: "Půjdou tam, kam je pošlu, a tehdy, kdy je pošlu."
 diarchy.1221.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1221.b: "Možná by pomohly vhodné pobídky?"
 diarchy.1221.b.tt.success: "Zlato uspěje tam, kde ocel selhala"
 diarchy.1221.b.tt.failure: "Místní se semknou na odpor"
 diarchy.1221.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1221.c: "Zámožnější rodiny by #EMP mohly#! posloužit i jinak..."
 diarchy.1221.c.tt.success: "Drobná daň naruší jednotu místních"
 diarchy.1221.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1221.c.tt.failure: "Šíří se zvěsti o tvých nepoctivých praktikách"
 diarchy.1221.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1221.d: "Tolik práce jen proto, abych naplnil měšec #EMP [liege.GetFirstNameNoTooltip]#!?"
 diarchy.1221.d.tt: "Místo toho si vezmeš odpoledne volno"
 diarchy.1221.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1221.e: "Ach, ať si tedy zůstanou na svých políčkách, když tu hlínu tolik milují!"
 diarchy.1221.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1231.t: "Groš ke groši"
 diarchy.1231.desc: "Mandát, který mi [liege.GetTitledFirstName] svěřil, mi ukládá hledat nové příjmy pro trůn. Jedním ze zdrojů, které můj lenní pán trestuhodně málo využívá, jsou soudy. Rychtáři a nižší šlechtici každý den pokutují drobné zločince, většinu vybraných peněz si však nechávají.\n\n[exploitable_county.GetNameNoTier] je takové chátry obzvlášť plné a zvýšit místním pokuty za jejich prohřešky by bylo náramně výnosné, byť také náramně nepopulární."
 diarchy.1231.a: "Koho zajímá, co si myslí? Zločinec je zločinec."
 diarchy.1231.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1231.b: "Jistě dokážeme najít přiměřenou výši pokut."
 diarchy.1231.b.tt.success: "Lidé nereptají o nic víc než dosud"
 diarchy.1231.b.tt.failure: "Místní odmítají poslechnout"
 diarchy.1231.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1231.c: "Všechna tahle práce si jistě zaslouží malou odměnu..."
 diarchy.1231.c.tt.success: "$diarchy.1231.b.tt.success$"
 diarchy.1231.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1231.c.tt.failure: "$diarchy.1231.b.tt.failure$"
 diarchy.1231.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1231.d: "Pokuty bychom měli #EMP snižovat#!, ne zvyšovat!"
 diarchy.1231.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1231.e: "Tohle už je příliš daleko za hranicemi mých pravomocí."
 diarchy.1231.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1241.t: "Ožehavá otázka daní"
 diarchy.1241.desc: "Jednou z mých povinností coby [liege.GetDiarchTitle] je plnit mandát, který mi [liege.GetTitledFirstName] svěřil a který právě teď vyžaduje jediné: zvonivé mince.\n\nLámu si hlavu nad novými zdroji příjmů pro korunu a stále se vracím k jednomu očividnému, byť neobvyklému řešení: [diarch.Custom('GetFaithTaxExemptInstitution')].\n\n[diarch.Custom('GetFaithTaxExemptInstitution')|U] bývají tradičně osvobozeny od většiny daní, takže zvláštní dávka by nejspíš vynesla pěknou sumu. Jen by to... nebylo zrovna zbožné."
 diarchy.1241.a: "[diarch.Custom('GetFaithTaxExemptInstitution')|U]? Už příliš dlouho si dělají, co chtějí!"
 diarchy.1241.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1241.b: "Zvláštní dávka na nezbytné výdaje přece nemůže způsobit nic zlého?"
 diarchy.1241.b.tt.success: "Navzdory reptání desátek zaplatí"
 diarchy.1241.b.tt.failure: "Tvé jméno proklínají a tvůj měšec zůstává prázdný"
 diarchy.1241.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1241.c: "Ti, kterým taková daň uškodí, si samozřejmě zaslouží náhradu..."
 diarchy.1241.c.tt.success: "$diarchy.1241.b.tt.success$"
 diarchy.1241.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1241.c.tt.failure: "$diarchy.1241.b.tt.failure$"
 diarchy.1241.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1241.d: "Tolik sváru jen kvůli pokladnici [liege.GetFirstNameNoTooltip]? Nikdy."
 diarchy.1241.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1241.e: "Tohle nemohu udělat. A #EMP neudělám#!."
 diarchy.1241.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1701.t: "Právo vládnout"
 diarchy.1701.desc: "Jako [liege.GetDiarchTitle] ve službách [liege.GetTitledFirstName] mám povinnost plnit mandát a posilovat ústřední moc v [liege.GetPrimaryTitle.GetNameNoTier].\n\nDnes mě tato povinnost zavedla do napjaté poradní síně, kde sedím mezi [councillor_1.GetTitledFirstName], [councillor_1.Custom('CouncilPosition')|l], a [councillor_2.GetTitledFirstName], [councillor_2.Custom('CouncilPosition')|l], zatímco na sebe křičí kvůli malichernému osobnímu sporu.\n\nDoufal jsem, že z nich vymámím souhlas s několika novými výsadami pro [liege.GetTitleAsNameNoTooltip], ale dokud jejich hádka neskončí, nikam se nedostanu."
 diarchy.1701.a: "Myslím, že každý mluvíte o něčem jiném — dovolte mi..."
 diarchy.1701.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1701.b: "Urození páni, odbíháme od věci..."
 diarchy.1701.b.tt.success: "Podaří se ti rozhovor usměrnit"
 diarchy.1701.b.tt.failure: "Rádci tě ignorují"
 diarchy.1701.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1701.c: "[councillor_1.GetFirstNameNoTooltip] #EMP má#! pravdu a koruna stojí na jeho straně."
 diarchy.1701.c.tt.success: "[councillor_1.GetFirstNameNoTooltip] samolibě přijímá tvou podporu"
 diarchy.1701.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1701.c.tt.failure: "Je zřejmé, že jejich sporu vůbec nerozumíš"
 diarchy.1701.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1701.d: "#EMP Pro všechno, co je [diarch.GetFaith.HighGodName] svaté, můžete už oba#! #BER zmlknout?!#!"
 diarchy.1701.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1701.d.custom.both_councillors: "Oba rádci:"
 diarchy.1701.e: "Zajímalo by mě, zda by si všimli, kdybych si zdříml..."
 diarchy.1701.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1711.t: "Doba platnosti"
 diarchy.1711.desc: "„Upřímně, myslel jsem, že tahle záležitost je vyřešená. Když jsme naposledy znovu sjednávali mé povinnosti, měla být má dohoda s [liege.GetTitledFirstName] konečná,“ zamumlá [exploitable_vassal.GetTitledFirstName]. „Nechápu, jak můžeš tvrdit, že se mi podařilo své přísahy tak důkladně zneplatnit. Copak jejich slova nemají platit navěky?“\n\nVlastně se úplně nemýlí. Tohle tvrzení tahám prakticky z ničeho, ale jsem [liege.GetDiarchTitle] a můj mandát je jasný jako letní den. Pokud jsou přísahy [exploitable_vassal.GetFirstNameNoTooltip] alespoň zčásti neplatné, [liege.GetTitleAsNameNoTooltip] dostane prostor je upravit a já splním svůj úkol."
 diarchy.1711.a: "Copak nejsem znám svou spravedlností a znalostí práva?"
 diarchy.1711.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1711.b: "Dobrá, projděme si ty argumenty ještě jednou..."
 diarchy.1711.b.tt.success: "Tvůj právní výklad je nezpochybnitelný"
 diarchy.1711.b.tt.failure: "Mezery ve tvé argumentaci jsou očividné"
 diarchy.1711.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1711.c: "Koruna by #EMP mohla#! přijmout místo toho náhradu."
 diarchy.1711.c.tt.success: "[exploitable_vassal.GetFirstNameNoTooltip] tě podplatí"
 diarchy.1711.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1711.c.tt.failure: "Panstvím se rozkřikne tvá nepoctivost"
 diarchy.1711.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1711.d: "Jak můžeš být tak natvrdlý? Vždyť je to prosté!"
 diarchy.1711.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1711.e: "Ach, zapomeň na to. Nestojí to za námahu."
 diarchy.1711.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1721.t: "Urovnání sporů"
 diarchy.1721.desc: "„Ani nechápu, proč se do toho tak ženeš, [diarch.GetFirstName],“ povzdechne si [exploitable_vassal.GetTitledFirstName]. „Naše výhrady přece nesměřují proti tobě.“\n\nNení žádným tajemstvím, že [exploitable_vassal.GetTitleAsNameNoTooltip] chová ambice, které se příčí vůli [liege.GetTitledFirstName]. Ambice, jež by mohly celé panství uvrhnout do ničivé občanské války, pokud jim nikdo neučiní přítrž.\n\nJako [liege.GetDiarchTitle] svého lenního pána mám podle mandátu za úkol pokusit se zmírnit napětí mezi nimi, ale zatím se zdá, že [exploitable_vassal.GetFirstNameNoTooltip] veškerému mému úsilí odolává."
 diarchy.1721.a: "Copak jsme oba nepřísahali věrnost [liege.GetTitledFirstNameNoTooltip]?"
 diarchy.1721.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1721.b: "Máš pravdu. Můj hrad určitě nebude obléhán jako první."
 diarchy.1721.b.tt.success: "[exploitable_vassal.GetTitleAsNameNoTooltip] uzná tvůj argument"
 diarchy.1721.b.tt.failure: "[exploitable_vassal.GetFirstNameNoTooltip] se tvými hrozbami nenechá zviklat"
 diarchy.1721.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1721.c: "Možná bych se dal přesvědčit, abych tvé... aktivity přehlédl..."
 diarchy.1721.c.tt.success: "Vymůžeš závazný slib a drobný projev oddanosti"
 diarchy.1721.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1721.c.tt.failure: "Možná proti tobě #EMP přece jen#! nějaké výhrady mají"
 diarchy.1721.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1721.d: "Nakonec to vlastně není #EMP můj#! problém."
 diarchy.1721.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1721.e: "Plést se do toho? Kdepak, jen mě to zajímalo! Přišel jsem jen na přátelskou návštěvu."
 diarchy.1721.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1731.t: "Vyrovnání účtů"
 diarchy.1731.desc: "Přede mnou se tlačí dav, pestrá směsice rozhněvaných zástupců z [county_1.GetNameNoTier], [county_2.GetNameNoTier] a [county_3.GetNameNoTier]. Rozličná města a vesnice spojuje jediné: odsouzení [liege.GetTitledFirstName]. Jako nešťastný [liege.GetDiarchTitle] svého lenního pána je mou povinností pokusit se je podle mandátu uchlácholit.\n\nDav nemá žádného zjevného vůdce, a tak na mě pokřikuje, vysmívá se mi a jeden přes druhého ječí své stížnosti i přehnaně podrobné historky "
 diarchy_1731.tt.affected_counties_removed: "[county_1.GetNameNoTier], [county_2.GetNameNoTier] a [county_3.GetNameNoTier] opustí [faction.GetName|V]"
 diarchy.1731.a: "Prosím, zachovejme klid! Vyslechnu vaše problémy jeden po druhém."
 diarchy.1731.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1731.b: "Ctihodní poddaní, copak nemůžeme najít společnou řeč?"
 diarchy.1731.b.tt.success: "Podaří se ti zklidnit jejich hněv"
 diarchy.1731.b.tt.failure: "Dav tě zasype shnilým ovocem a zeleninou"
 diarchy.1731.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1731.c: "To jsou závažné problémy! #EMP Já#! bych něco takového nikdy nedovolil."
 diarchy.1731.c.tt.success: "Lidé uvěří, že napravíš bezpráví, které utrpěli"
 diarchy.1731.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1731.c.tt.failure: "Tohle není o #EMP tobě#!"
 diarchy.1731.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1731.d: "Ať vás stihne hněv [diarch.GetFaith.HighGodName], můžete už vy zdegenerovaní burani #EMP přestat#!?!"
 diarchy.1731.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1731.e: "Ano, ano. Všechno to vyřešíme. Časem."
 diarchy.1731.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.1741.t: "Podívejme se na to jinak"
 diarchy.1741.desc: "„Nejsme proti přáním [liege.GetTitledFirstName],“ protáhne posměšně [councillor_1.GetTitledFirstName], „jen jim nejsme otrocky podřízeni. Není to tak těžké pochopit.“\n\nVětší část odpoledne jsem strávil snahou zlepšit vztahy mezi svým lenním pánem a jeho rádci, ale bezvýsledně, z nemalé části kvůli tvrdohlavosti tohoto nevzdělaného [Select_CString(councillor_1.IsFemale, 'ženského', 'mužského')] zabedněnce.\n\nV duchu si povzdechnu. Jsem [liege.GetDiarchTitle] a můj mandát mi tyto povinnosti ukládá."
 diarchy.1741.a: "Myslím, že vám uniká, co všechno pro vás [liege.GetTitleAsNameNoTooltip] dělá..."
 diarchy.1741.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.1741.custom.several_councillors: "Každý přítomný [Concept('councillor','rádce')|E]\t"
 diarchy.1741.b: "A ani byste neměli být, ale lepší služba vybízí ke štědrosti..."
 diarchy.1741.b.tt.success: "Objasníš svým kolegům svůj pohled"
 diarchy.1741.b.tt.failure: "Rada zůstává neústupná"
 diarchy.1741.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.1741.c: "Korunu #EMP netvoří jen#! [liege.GetTitleAsNameNoTooltip]."
 diarchy.1741.c.tt.success: "Rada uzná tvůj argument"
 diarchy.1741.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.1741.c.tt.failure: "Je očividné, že se jen předvádíš"
 diarchy.1741.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.1741.d: "Není to tak těžké? Co #EMP přesně#! tím naznačuješ, ty [councillor_1.Custom2('InsultNoun', ROOT.Char)]?"
 diarchy.1741.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.1741.e: "Společnou řeč nikdy nenajdeme."
 diarchy.1741.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2201.t: "Do zbraně, mládeži"
 diarchy.2201.desc: "Místní z [exploitable_county.GetNameNoTier] mají povinnost poskytnout [liege.GetTitledFirstName] určitý počet vojáků a kdykoli jsou vyzváni, také tak řádně učiní.\n\nTo však neznamená, že tím odvedou všechny bojeschopné muže v kraji. Mé nedávné šetření coby [liege.GetDiarchTitle] ukázalo, že jejich povinnosti jsou až #EMP zarážejícím způsobem#! mírné. Počet mužů, které bychom mohli odvést, naprosto zastiňuje ty žalostně malé oddíly, které skutečně povoláváme.\n\nMístní se vzpírají, ale můj mandát mě pobízí pokračovat bez ohledu na jejich odpor."
 diarchy.2201.a: "Kdo dokáže máchnout kopím, může na něj také zemřít!"
 diarchy.2201.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2201.b: "Ať se ti chudáci dozvědí, že je to jejich příležitost přijít k #EMP kořisti#!."
 diarchy.2201.b.tt.success: "V rolnících probudíš vidinu kořisti"
 diarchy.2201.b.tt.failure: "Stovky místních náhle začnou kulhat"
 diarchy.2201.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2201.c: "Ti zámožnější by jistě zaplatili, kdybych je přehlédl..."
 diarchy.2201.c.tt.success: "Trocha daní navíc, pár odvedenců navíc"
 diarchy.2201.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2201.c.tt.failure: "Následují trpké výčitky"
 diarchy.2201.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2201.d: "Tito lidé své povinnosti splnili. To stačí."
 diarchy.2201.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2201.e: "Špinavou práci za [liege.GetTitleAsNameNoTooltip] tady dělat nebudu."
 diarchy.2201.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2211.t: "Vzácný talent"
 diarchy.2211.desc: "Přes [hedge_knight_location.GetNameNoTier] právě putuje mimořádně schopný bojovník, jehož meč by v armádách [liege.GetTitledFirstName] nepochybně našel velké uplatnění.\n\nMůj mandát coby [liege.GetDiarchTitle] mi ukládá vyhlížet právě takové lidi, a tak jsem už [hedge_knight.GetFirstName] poslal nespočet proseb ve snaze získat tohoto bojovníka do služeb svého lenního pána.\n\nJenže potulného válečníka představa, že by přísahal svůj meč naší věci, zjevně nijak nenadchla a jednoho mého posla za druhým odmítá."
 diarchy.2211.a: "Pouhý $knight_culture_player_no_tooltip_lowercase$ #EMP nakonec#! ke službě svolí."
 diarchy.2211.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2211.b: "Možná [hedge_knight.GetFirstNameNoTooltip] přesvědčím osobně?"
 diarchy.2211.b.tt.success: "Tvá slova [hedge_knight.GetFirstNameNoTooltip] přesvědčí"
 diarchy.2211.b.tt.failure: "Tvé prosby padají na hluché uši"
 diarchy.2211.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2211.c: "Možná je problém v tom, komu by měl sloužit..."
 diarchy.2211.c.tt.success: "Zlákáš [hedge_knight.GetFirstNameNoTooltip] do svých služeb"
 diarchy.2211.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2211.c.tt.failure: "[hedge_knight.GetFirstNameNoTooltip] s tebou nechce mít nic společného"
 diarchy.2211.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2211.d: "Z celé téhle záležitosti jsem úplně nesvůj!"
 diarchy.2211.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2211.e: "Nechme [hedge_knight.GetFirstNameNoTooltip] být. Očividně nemá zájem."
 diarchy.2211.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2221.t: "Vojenské odměny"
 diarchy.2221.desc: "Ve větších sídlech [liege.GetPrimaryTitle.GetNameNoTier] není o místa, kde lze najmout žoldnéře, nouze. Tržiště, na němž právě stojím a házím měšec mincí mezi jejich hlučící dav, je jen jedním z mnoha.\n\nObvykle se tyto narychlo sestavené bojové tlupy připojí k větším žoldnéřským společnostem nebo je najímají nižší páni, aby ve válce posílily jejich vlastní odvedence. Je to však neefektivní uspořádání.\n\nMůj mandát coby [liege.GetDiarchTitle] mi ukládá rozšířit armády [liege.GetTitledFirstName], a tak se nyní pokouším část těchto mužů najmout přímo."
 diarchy.2221.a: "Tyhle mince nejsou nic proti kořisti, kterou si vyděláte!"
 diarchy.2221.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2221.b: "Toto stříbro je jen ochutnávka z pokladnice [liege.GetTitledFirstNameNoTooltip]!"
 diarchy.2221.b.tt.success: "Dobře utracené peníze"
 diarchy.2221.b.tt.failure: "Špatná investice"
 diarchy.2221.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2221.c: "Služte mně nebo [liege.GetTitleAsNameNoTooltip], tak jako tak dostanete #EMP zaplaceno#!."
 diarchy.2221.c.tt.success: "Pěkná úroda vojáků"
 diarchy.2221.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2221.c.tt.failure: "Do služby se přihlásí sotva hrstka mužů"
 diarchy.2221.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2221.d: "Prchnu jim z očí."
 diarchy.2221.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2221.e: "Samozřejmě si své zaměstnavatele jistě dokážete vybrat sami..."
 diarchy.2221.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2231.t: "Lepší využití"
 diarchy.2231.desc: "Žaláře a soudy v [exploitable_county.GetNameNoTier] se v poslední době potýkají s nešťastně vysokým počtem všemožných ničemů. Za běžných okolností by je spravedlnost rychle dostihla a pak by skončili buď vyhnáni do divočiny, nebo v hrobě.\n\nK jejich štěstí má řada z nich bohaté zkušenosti s mečem či lukem a můj mandát coby [liege.GetDiarchTitle] mi ukládá hledat nové vojáky. Nabízí se tedy nepříliš vábné řešení v podobě služby v armádách [liege.GetTitledFirstName]. A přestože tak získáváme spoustu otužilých lapků a ostřížím zrakem obdařených pytláků, rolníci jsou kvůli tomu na nohou."
 diarchy.2231.a: "Pokračujte. Časem jejich nářky utichnou."
 diarchy.2231.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2231.b: "Možná bychom měli brát jen ty úplně nejlepší?"
 diarchy.2231.b.tt.success: "Podaří se najít rovnováhu"
 diarchy.2231.b.tt.failure: "Většina zločinců prchne při první příležitosti"
 diarchy.2231.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2231.c: "Možná budou užitečnější mimo oficiální řady než v nich..."
 diarchy.2231.c.tt.success: "Vznikne násilnická úderná skupina"
 diarchy.2231.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2231.c.tt.failure: "$diarchy.2231.b.tt.failure$"
 diarchy.2231.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2231.d: "Tohle #EMP nemohu#!. Bylo by to zneuctění spravedlnosti!"
 diarchy.2231.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2231.e: "Tohle vyvolává příliš mnoho sporů."
 diarchy.2231.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.2241.t: "Oddělit zrno od plev"
 diarchy.2241.desc: "Mandát, který mi [liege.GetTitledFirstName] svěřil, vyžaduje, abych coby [liege.GetDiarchTitle] pravidelně hledal nové zdroje vojáků.\n\nA kde začít lépe než u mizerně přebraných odvedenců [exploitable_vassal.GetTitledFirstName]? Se svou družinou jsme shromáždili místní k posouzení, ale stále se nám nedaří dostat dostatečný počet z nich na úroveň, aby vůbec #EMP stálo za to#! je v budoucnu povolávat."
 diarchy.2241.a: "Za mnou, vojáci! Dívejte se!"
 diarchy.2241.a.t: "$diarchies.0000.diarch_fulfills_mandate.t$"
 diarchy.2241.b: "Tak pojďte, vy budižkničemové, já už vás srovnám!"
 diarchy.2241.b.tt.success: "Uděláš z nich muže rychlé jako dravá řeka"
 diarchy.2241.b.tt.failure: "Ukáže se, že je to opravdu žalostná banda budižkničemů"
 diarchy.2241.b.t: "$diarchies.0000.diarch_fails_at_mandate.t$"
 diarchy.2241.c: "Když už jsem tady, mohl bych potrénovat i sebe..."
 diarchy.2241.c.tt.success: "Trocha výcviku navíc dokáže divy"
 diarchy.2241.c.t.success: "$diarchies.0000.diarch_skims_mandate.t$"
 diarchy.2241.c.tt.failure: "V nepozornosti si bolestivě něco natáhneš"
 diarchy.2241.c.t.failure: "$diarchies.0000.diarch_fails_to_skim_mandate.t$"
 diarchy.2241.d: "Beze slova odejdu."
 diarchy.2241.d.t: "$diarchies.0000.diarch_rejects_mandate.t$"
 diarchy.2241.e: "Tohle je #EMP naprostá#! ztráta mého času."
 diarchy.2241.e.t: "$diarchies.0000.diarch_lax_with_mandate.t$"
 diarchy.0511.t: "$overthrow_regent$: Neúspěch"
 diarchy.0511.desc.intro: "Ať je [target.GetTitledFirstName] se svou hroší kůží prokletý, mým hrdlořezům unikl, "
 diarchy.0511.desc.discovered: "a co hůř, jednoho z těch hrubiánů zajali a při výslechu #EMP všechno vyžvanil#!. [target.GetFirstNameNoTooltip] i [liege.GetTitledFirstName] teď přesně vědí, o co jsem se pokusil!"
 diarchy.0511.desc.undiscovered: "ale žoldnéři měli alespoň tolik rozumu, že se nechali zabít, místo aby padli do zajetí.\n\nŽádná stopa nevede zpět ke mně, alespoň ne přímo, takže [target.GetFirstNameNoTooltip] ani [liege.GetTitledFirstName] proti mně nic nemají."
 diarchy.0511.desc.outro: "\n\nProzatím tedy [target.GetDiarchTitle] panství zůstává ve své funkci."
 diarchy.0511.a: "Pche, tohle nemá smysl."
 diarchy.0511.b: "Znovu. Příště [liege.GetFirstNameNoTooltip] dostaneme."
 diarchy.0521.t: "Vznešený [liege.GetTitledFirstName],"
 diarchy.0521.desc.discovered: "Ten ničema [owner.GetTitledFirstName] se mě pokusil nechat unést a spolu se mnou zabavit i odznaky mého úřadu!\n\nJe zřejmé, že mě chtěl zbavit funkce a sám se přitom stát tvým [liege.GetDiarchTitle]. Tak odporný zločin nesmí zůstat nepotrestán."
 diarchy.0521.desc.undiscovered: "Píši ti, abych tě zpravil o útoku na mou svobodu — skupina hrdlořezů se mě pokusila unést spolu s odznaky mého úřadu.\n\nKdo je zaplatil, není jasné, ale jejich záměr je dost očividný. Kdyby jejich chlebodárce získal mou osobu i insignie [liege.GetDiarchTitle], mohl by si snadno přisvojit mé právoplatné postavení."
 diarchy.0521.a: "Jsem zděšen!"
 diarchy.0521.b: "Znepokojivé..."
 diarchy.0531.t: "$overthrow_regent$: Neúspěšný pokus"
 diarchy.0531.desc.intro: "Smykem zahnu za roh chodby a v uších mi stále zní hluk probíhajícího boje. Ti zatracení žoldnéři jako by vyskočili přímo ze zdí! Byl jsem úplně beze zbraně a uniknout mi umožnil jen včasný zásah mých stráží.\n\n"
 diarchy.0531.desc.discovered: "Jeden ze zajatých hrdlořezů při výslechu prozradí, pro koho pracovali: pro nikoho jiného než [target.Custom2('MyCharacterIntroduction', owner)]!"
 diarchy.0531.desc.undiscovered: "Během několika minut jsou všichni mrtví a tajemství jejich chlebodárce umírá spolu s nimi."
 diarchy.0531.desc.outro: "\n\nJe zřejmé, že coby [target.GetDiarchTitle] mám na zádech namalovaný terč. Měl jsem to vědět..."
 diarchy.0531.a.paranoid: "Takže tu #EMP opravdu je#! spiknutí! Já to věděl!"
 diarchy.0531.a.trusting: "Jak... jak může někdo něco takového udělat?"
 diarchy.0531.a.scheme_discovered: "[owner.GetFirstNameNoTooltip], ten prašivý ničema!"
 diarchy.0531.a.scheme_secret: "Pokusí se o to znovu. Jsem si tím jistý."
 diarchy.0551.t: "$overthrow_regent$: Úspěch"
 diarchy.0551.desc: "Prostý a spolehlivý plán. Banda žoldnéřů v mých službách přepadla bývalého [owner.GetDiarchTitle] přímo v jeho úřadě, spoutala ho a propašovala z budovy oslepeného starým pytlem přes hlavu.\n\nS minimem krveprolití a za použití pečetí sebraných přímo ze stolu [target.GetTitledFirstName] jsem sepsal přiznání k celé řadě zločinů, které ospravedlňuje předání moci. Stačí to, aby vše vypadalo úředně, i když mi to v budoucnu možná přinese jisté potíže s [liege.GetTitledFirstName].\n\nSamozřejmě nezapomenu doručit koncept i [target.GetFirstNameNoTooltip]. Ať má ve svém vězení co pročítat."
 diarchy.0551.a: "Hladké jako hedvábí."
 diarchy.0561.t: "Vznešený [liege.GetTitledFirstName],"
 diarchy.0561.desc: "S potěšením ti oznamuji, že [target.GetTitledFirstName] po krátké, avšak živé rozpravě přenechal svůj úřad [liege.GetDiarchTitle] mně.\n\nJelikož na něj povinnosti tohoto úřadu příliš doléhaly, zůstane po dobu mého působení coby [liege.GetDiarchTitle] u mě. Pro své vlastní zdraví."
 diarchy.0561.a: "Prozatím to zkrátka nechám být..."
 diarchy.0571.t: "$overthrow_regent$: Uvěznění"
 diarchy.0571.desc.intro: "#EMP Moje hlava#!. Já... kde to jsem? [owner.GetTitledFirstName]?\n\n„Rád vidím, že jsi stále mezi námi, [target.GetFirstName],“ ušklíbne se [owner.GetFirstNameNoTooltip] a hodí mi k nohám svazek listin. „Pro tvé potěšení. Je to seznam zločinů, ke kterým ses coby [owner.GetDiarchTitle] přiznal, než jsi mi předal svůj úřad. Říkal jsem si, že bys chtěl vlastní výtisk.“\n\n"
 diarchy.0571.desc.outro.blind: "Nemusím ty načmárané lži ani vidět, abych poznal rozsah celého podvrhu a pochopil, že už byly rozeslány po celém [liege.GetPrimaryTitle.GetBaseNameNoTier]."
 diarchy.0571.desc.outro.sighted: "Zběsile listuji naškrábaným textem, stránku za stránkou plnou nestoudných výmyslů a úmyslného překrucování. Chci to popřít, popřít všechno, ale vím, že už se to muselo rozšířit po celém [liege.GetPrimaryTitle.GetBaseNameNoTier]."
 diarchy.0571.a: "[liege.GetTitledFirstNameNoTooltip] se o tom dozví! Dozví se o tom!"
 diarchy.8001.t: "[recipient.Custom2('AppropriateGreeting', actor )]"
 diarchy.8001.desc: "Tvá žádost, abys v našem společném jménu vedl výpravu, má své opodstatnění, a proto ti dávám svolení. Podle potřeby můžeš čerpat ze zdrojů našich guvernérů.\n\nAť se nepřítel před tvými řadami třese a prchá."
 diarchy.8001.a: "Ať žije [actor.Custom('GetBestEmpireWithAdjective')]!"
 getbestempirewithadjective.rome: "slavný Řím"
 getbestempirewithadjective.mongolia: "nekonečné Mongolsko"
 getbestempirewithadjective.outremer: "požehnané Zámoří"
 getbestempirewithadjective.slavia: "rozlehlá Slávie"
 getbestempirewithadjective.great_armenia: "Velká Arménie"
 getbestempirewithadjective.india: "bezmezná Indie"
 getbestempirewithadjective.the_empire: "mocná říše"
 diarchy.8002.t: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 diarchy.8002.desc: "Raději bych si [Select_CString(recipient.IsFemale, 'přiložila', 'přiložil')] nůž k vlastnímu hrdlu, než [Select_CString(recipient.IsFemale, 'svolila', 'svolil')], abys #EMP ty#! bez mého dohledu [Select_CString(actor.IsFemale, 'velela', 'velel')] takové armádě.\n\nTvou žádost zamítám — a tím je tato záležitost #EMP uzavřena#!."
 diarchy.8002.a: "Ty [Select_CString(recipient.IsFemale, 'zabedněná hlupačko', 'zabedněný hlupáku')]!"
 diarchy.8003.t: "[actor.Custom2('AppropriateGreeting', recipient )]"
 diarchy.8003.desc: "Ačkoli samozřejmě vládneme společně, jistě si vzpomínáš, že mi něco #EMP dlužíš#!. Nyní tuto laskavost využiji a ty mi na oplátku bezvýhradně podpoříš chystanou výpravu, při níž vyrveme kus území z rukou cizinců."
 diarchy.8003.a: "[Select_CString(actor.IsFemale, 'Ta opovážlivá hlupačka', 'Ten opovážlivý hlupák')]!"
 diarchy.8004.t.vetoed: "Císařská výprava zrušena"
 diarchy.8004.t.planned: "Císařská výprava naplánována"
 diarchy.8004.desc.vetoed: "Z císařského dvora se už celé měsíce šeptá, že [actor.GetFirstName], [Select_CString(actor.IsFemale, 'mladší spoluvládkyně', 'mladší spoluvládce')], prosazuje zahájení mohutného tažení armád [recipient.GetPrimaryTitle.GetDefinitiveName], které by na hranicích vyrvalo nepřátelům nové tituly.\n\nNyní tyto zvěsti náhle a definitivně utichly.\n\nZdá se, že [recipient.GetTitleAsNameNoTooltip] [recipient.GetFirstName], jako starší z obou, nedůvěřuje tomu, co [actor.GetFirstNameNoTooltip] zamýšlí."
 diarchy.8004.desc.planned: "Není žádným tajemstvím, že císařský dvůr žije řečmi o velkolepém vojenském tažení, při němž mají armády říše udeřit na nějaký nešťastný pohraniční stát a získat slávu i území.\n\nTakové řeči nejsou ničím neobvyklým a často z nich nic nevzejde — tentokrát však nikoli. [actor.GetFirstName], [Select_CString(actor.IsFemale, 'mladší spoluvládkyně', 'mladší spoluvládce')], podle všeho připravuje skutečně vážné tažení. [recipient.GetTitleAsNameNoTooltip] [recipient.GetFirstName], jako starší z obou, k němu [Select_CString(recipient.IsFemale, 'dala', 'dal')] svolení a hranice říše se tak možná brzy posunou.\n\n"
 diarchy.8004.desc.planned.forced: "Podle všeho [recipient.GetFirstNameNoTooltip] [Select_CString(recipient.IsFemale, 'ustoupila', 'ustoupil')] nátlaku, který [actor.GetFirstNameNoTooltip] [Select_CString(actor.IsFemale, 'vyvinula', 'vyvinul')]. Alespoň se to povídá."
 diarchy.8004.desc.planned.allowed: "To, že [recipient.GetFirstNameNoTooltip] [Select_CString(recipient.IsFemale, 'souhlasila', 'souhlasil')], aby [actor.GetFirstNameNoTooltip] [Select_CString(actor.IsFemale, 'velela', 'velel')] císařským vojskům, nepochybně svědčí o značné důvěře mezi nimi."
 diarchy.8004.a.vetoed: "Alespoň jsme se vyhnuli válce..."
 diarchy.8004.a.allowed: "Nové země, o které můžeme soupeřit..."
 diarchy.8005.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
 diarchy.8005.desc.boilerplate: "Jako tvůj [Select_CString(attacker.IsFemale, 'spolucísařovna', 'spolucísař')] shromažďuji vojsko k výpravě proti zbabělým psům z [defender.GetPrimaryTitle.GetDefinitiveName]."
 diarchy.8005.desc: "$diarchy.8005.desc.boilerplate$\n\nTvůj guvernorát sousedí se zeměmi, které hodláme dobýt, a proto máš povinnost nám pomoci. Vyzývám tě, abys okamžitě vyslal své vojáky na frontu!"
 diarchy.8005.a: "Ještě jednou do boje!"
 diarchy.8005.b: "Na pošetilosti [Select_CString(attacker.IsFemale, 'této #EMP spolu#!císařovny', 'tohoto #EMP spolu#!císaře')] se podílet nebudu."
 diarchy.8006.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
 diarchy.8006.desc: "$diarchy.8005.desc.boilerplate$ Tvůj guvernorát sice s frontou nesousedí, ale #EMP patříš#! mezi naše nejvýznamnější vojenské správce.\n\nPokud toužíš po vlastním dílu slávy, tvé síly jsou ve válce vítány."
 diarchy.8006.a: "$diarchy.8005.a$"
 diarchy.8006.b: "$diarchy.8005.b$"
 diarchy.8011.t: "Slavná výprava!"
 diarchy.8011.desc.all_titles_legally_yours: "Válka skončila a prach se usadil. Pohlédnu na země, které jsem pro říši dobyl... a zjistím, že každá z nich už #EMP shodou okolností#! zcela zjevně spadá pod mou správu.\n\nTakové úskočné manévry mi sice žádnou další slávu nevynesou, ale nikdo proti nim nemůže mít ani vážné námitky.\n\nKoneckonců je všechno naprosto v souladu se zákonem."
 diarchy.8011.desc.fallback: "Válka skončila, země, jimž vládne [defender.GetTitledFirstName], jsou rozervány a hranice říše se opět posunuly vpřed.\n\nZbývá už jen rozhodnout, jak naložit s dobytými územími.\n\nPodle práva by #EMP měla#! připadnout [attacker.GetLiege.GetTitledFirstName], mému staršímu spoluvládci, aby je rozdělil — což by #EMP jistě#! posílilo můj vliv u dvora, jehož sídlem je [attacker.GetLiege.GetCapitalLocation.GetTitle.GetBaseNameNoTier] — ale copak nejsem [Select_CString(attacker.IsFemale, 'spolucísařovna', 'spolucísař')]? Nemohu si je ponechat a rozdělit sám, případně ustanovit místní, kteří mi budou za tuto příležitost vděční?"
 diarchy.8011.a: "Tato území jsem dobyl já a také si je ponechám."
 diarchy.8011.tt.all_lands_remain_in_your_custody: "Ponecháš si všechny získané [Concept('vassals','vazaly')|E] a [Concept('titles','tituly')|E], ale nezískáš žádný [influence_i][Concept('influence','vliv')|E]"
 diarchy.8011.b: "Bojovali jsme za říši a jí také připadne kořist!"
 diarchy.8011.tt.distribution.lands_given_to_emperor: "Dobytá území budou předána [attacker.GetLiege.GetTitledFirstName]"
 diarchy.8011.c: "Možná bych si mohl ponechat #EMP jednu#! trofej..."
 diarchy.8011.tt.distribution.reserve_prize: "Dobytá území budou předána [attacker.GetLiege.GetTitledFirstName] — výjimkou je [prize_county.GetBaseNameNoTier] a vše, co náleží k jeho [Concept('duchy','vévodství')|E]"
 diarchy.8011.d: "Naše nové země budou spravovat prozatímní guvernéři."
 diarchy.8011.tt.distribution.interim_governors: "Dobytá území budou rozdělena vhodným místním [Concept('characters','postavám')|E]"
 diarchy.8011.tt.distribution.interim_governors.hook_and_opinion: "Na každého nového guvernéra získáš [Concept('hook','páku')|E] za laskavost"
 diarchy.8011.e: "Jaká příhodná náhoda."
 diarchy.8011.e.tt.keep_everything_but_legally: "Ponecháš si všechny dobyté země — a nikdo nemůže tvrdit, že na ně nemáš právo"
 diarchy_8011.turn_over_titles.tt.titles_to_transfer_all: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'získáš', 'získá')] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_full_value')|P0] [Concept('influence','vlivu')|E] za předaná [Concept('counties','hrabství')|E]"
 diarchy_8011.turn_over_titles.tt.vassals_to_transfer_all: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'získáš', 'získá')] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_full_value')|P0] [Concept('influence','vlivu')|E] za předané [Concept('vassals','vazaly')|E]"
 diarchy_8011.turn_over_titles.tt.titles_to_transfer_prize: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'získáš', 'získá')] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_prize_value')|P0] [Concept('influence','vlivu')|E] za předaná [Concept('counties','hrabství')|E]"
 diarchy_8011.turn_over_titles.tt.vassals_to_transfer_prize: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'získáš', 'získá')] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_prize_value')|P0] [Concept('influence','vlivu')|E] za předané [Concept('vassals','vazaly')|E]"
 diarchy_8011.turn_over_titles.tt.interim_governors.county: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'získáš', 'získá')] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_counties_reduced_value')|P0] [Concept('influence','vlivu')|E] za předaná [Concept('counties','hrabství')|E]"
 diarchy_8011.turn_over_titles.tt.interim_governors.vassal: "[attacker.GetShortUIName|U] [Select_CString(attacker.IsLocalPlayer, 'získáš', 'získá')] [influence_i][attacker.MakeScope.ScriptValue('request_imperial_expedition_influence_from_vassals_reduced_value')|P0] [Concept('influence','vlivu')|E] za předané [Concept('vassals','vazaly')|E]"
 diarchy.8012.t: "[attacker.Custom2('AppropriateGreeting', ROOT.Char )]"
 diarchy.8012.desc.keeping_all: "Jistě tě potěší, že má válka dopadla dobře — vlastně #EMP velmi#! dobře.\n\nDobytá území však ještě nějakou dobu budou potřebovat pevnou ruku, která je povede, a proto tam zůstanu, abych zajistil jejich řádnou správu."
 diarchy.8012.desc.turning_over_all: "Dnes [attacker.Custom('GetBestEmpireWithAdjective')] září válečnou slávou a my dva ze všech nejvíc! Naše výprava byla skutečným úspěchem a země, které jsem podrobil, jsou nyní plně k tvé dispozici.\n\nNa naši plodnou spolupráci!"
 diarchy.8012.desc.turning_over_most: "Dnes jsme okusili nejsladší vítězství! Válka je vyhraná a do většiny dobytých území jsem už vyslal správce přímo ve tvých službách.\n\nDoufám, že mi nebudeš zazlívat skromnou odměnu v podobě [prize_county.GetBaseNameNoTier] a přilehlých území. Malá náhrada za krev a zlato, které mě výprava stála."
 diarchy.8012.desc.interim_governors: "Chaos války vystřídalo sladké císařské vítězství a s radostí prohlašuji naši výpravu za úspěšnou!\n\nV zájmu rychlého obnovení pořádku jsem dobytá území svěřil vybraným místním guvernérům. Nepochybně Nám budou věrně sloužit, dokud se společně nerozhodneme je nahradit."
 diarchy.8012.desc.legal_shenanigans: "S radostí oznamuji, že naše válka skončila úspěchem! Osvobozená území, o nichž se oba jistě shodneme, že nepochybně náleží k zemím pod správou mých titulů, budou pod mým vedením zajisté vzkvétat.\n\nSamozřejmě, kdyby zbylo cokoli dalšího, jistě víš, že bych ti to předal, ale bohužel..."
 diarchy.8012.tt.keeping_all: "[attacker.GetFirstName] si ponechá vše #WEAK (prozatím)#!, ale nezíská žádný [Concept('influence','vliv')|E]"
 diarchy.8012.tt.turning_over_all: "[attacker.GetFirstName] ti předá všechny dobyté [Concept('titles','tituly')|E] a [Concept('vassals','vazaly')|E]"
 diarchy.8012.tt.turning_over_most: "[attacker.GetFirstName] ti předá většinu dobytých [Concept('titles','titulů')|E] a [Concept('vassals','vazalů')|E], jedno [Concept('duchy','vévodství')|E] si však ponechá"
 diarchy.8012.tt.interim_governors: "[attacker.GetFirstName] svěří dobytá území místním guvernérům #WEAK (prozatím)#!"
 diarchy.8012.tt.legal_shenanigans: "[attacker.GetFirstName] si ponechá vše — všechny [Concept('titles','tituly')|E] i [Concept('vassals','vazalové')|E] by stejně spadali pod správu [attacker.GetFirstNameNoTooltip]"
 diarchy.8012.desc.a.keeping_all: "#EMP Taková drzost! Takový nevděk!#!"
 diarchy.8012.desc.a.turning_over_all: "Ach, takhle má vypadat vláda."
 diarchy.8012.desc.a.turning_over_most: "Přijatelné."
 diarchy.8012.desc.a.interim_governors: "Hmm, asi v tom jistou logiku vidím."
 diarchy.8012.desc.a.legal_shenanigans: "Chytré, [attacker.GetFirstNameNoTooltip]. Velmi chytré."
 diarchy.8022.t: "Politické zmrzačení: Sesazení"
 diarchy.8022.t.dead: "Politická poprava"
 diarchy.8022.desc.intro: "Jakmile někdo usedne na císařský trůn, existují jen dva způsoby, jak jej z něj skutečně svrhnout: smrt nebo zmrzačení.\n\n"
 diarchy.8022.desc.dead: "Bohužel pro [recipient.GetFirstName], [Select_CString(recipient.IsFemale, 'spolucísařovnu', 'spolucísaře')], [actor.GetTitleAsNameNoTooltip] [actor.GetFirstName], starší z obou, [Select_CString(actor.IsFemale, 'zvolila', 'zvolil')] tu #EMP jistější#! z těchto dvou cest."
 diarchy.8022.desc.maimed: "Naštěstí pro [recipient.GetFirstName], [Select_CString(recipient.IsFemale, 'spolucísařovnu', 'spolucísaře')], [actor.GetTitleAsNameNoTooltip] [actor.GetFirstName], starší z obou, [Select_CString(actor.IsFemale, 'zvolila', 'zvolil')] milosrdnější z těchto dvou možností."
 diarchy.8022.desc.outro: "\n\nŠušká se o tom, která z jejich mnoha rozepří přiměla [actor.GetFirstNameNoTooltip] k tak krajnímu kroku, ale na tom už vlastně nezáleží. Co se stalo, stalo se.\n\nMožná to byl odjakživa nejpravděpodobnější konec — jedna koruna se koneckonců na dvě hlavy nehodí."
 diarchy.8022.tt.explanation: "[recipient.GetFirstName] už není [Concept('co_emperor',Select_CString(recipient.IsFemale, 'spolucísařovnou', 'spolucísařem'))|E]"
 diarchy.8022.a: "Nehorázný zločin!"
 diarchy.8022.b: "Lépe to skončit nemohlo."
 diarchy.8022.c: "Tak už to v [actor.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip] chodí."
 diarchy.8023.t: "Politické zmrzačení: Uzurpace!"
 diarchy.8023.t.dead: "$diarchy.8022.t.dead$"
 diarchy.8023.desc.intro: "Rozhodným aktem brutality [actor.GetFirstName] — někdejší [Select_CString(actor.IsFemale, 'spolucísařovna', 'spolucísař')] po boku císařského veličenstva [recipient.GetFirstName] — "
 diarchy.8023.desc.dead: "[Select_CString(actor.IsFemale, 'nechala', 'nechal')] [recipient.GetTitleAsNameNoTooltip] [recipient.GetFirstNameNoTooltip], staršího z dvojice, hrůzně popravit."
 diarchy.8023.desc.maimed: "[Select_CString(actor.IsFemale, 'zohavila', 'zohavil')] tělo [recipient.GetTitleAsNameNoTooltip] [recipient.GetFirstNameNoTooltip], staršího z dvojice."
 diarchy.8023.desc.outro: "\n\nSymbolika tohoto činu je stejně jasná jako naše tradice a zákony: [actor.GetPrimaryTitle.GetDefinitiveName] se nyní klaní jen [Select_CString(actor.IsFemale, 'jediné vládkyni', 'jedinému vládci')]."
 diarchy.8023.desc.outro.alive: "\n\n[recipient.GetFirstNameNoTooltip] se bude muset spokojit s holým životem a sotva čím dalším."
 diarchy.8023.tt.explanation: "[actor.GetFirstName] [Concept('deposed',Select_CString(actor.IsFemale, 'sesadila', 'sesadil'))|E] [recipient.GetFirstName] a nyní jako [actor.GetTitleAsName|U] [Select_CString(actor.IsFemale, 'vládne sama', 'vládne sám')]"
 diarchy.8023.a: "Rod [actor.GetHouse.GetBaseNameNoTooltip] konečně zaujímá své právoplatné místo!"
 diarchy.8023.b: "Tohle je uzurpace!"
 diarchy.8023.c: "$diarchy.8022.c$"
 diarchy.8031.t: "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 diarchy.8031.desc: "Tvá žádost je rozumná a opodstatněná. Vydám guvernérům, jejichž působištěm je [target.GetDefinitiveName], pokyn, aby od nynějška dbali především tvých příkazů.\n\nKéž jim vládneš stejně dobře, jako se já snažím vládnout zbytku říše."
 diarchy.8031.a: "Ach, má vlastní říše uvnitř říše."
 diarchy.8032.t: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 diarchy.8032.desc: "Jsi druhou nejmocnější osobou v celém [recipient.GetPrimaryTitle.GetDefinitiveName], a chceš #EMP ještě víc#!?\n\nNe. Už samotná dvojvláda nás rozděluje dost. Možná je i to příliš."
 diarchy.8032.a: "Tohle má být partnerství!"
 diarchy.8033.t: "[actor.Custom2('AppropriateGreeting', recipient )]"
 diarchy.8033.desc.intro: "Jako [recipient.GetTitleAsNameNoTooltip] jistě víš, že vládneme společně, a mrzí mě, kolik povinností kvůli našemu partnerství musíš nést. Od nynějška bude [target.GetName] pod mou přímou správou. Převezmu dohled nad tamními guvernéry i obyvatelstvem, a ulehčím tak břemeno spočívající na tvých vznešených bedrech.\n\n"
 diarchy.8033.desc.hook: "Považuj tím svůj dluh vůči mně za splacený."
 diarchy.8033.desc.insufficient_influence: "Samozřejmě si vážím tvého názoru na tuto i všechny ostatní záležitosti, ale obávám se, že už je vše zařízeno."
 diarchy.8033.tt.influence: "Chyběl ti [influence_i][Concept('influence','vliv')|E] potřebný k odporu proti svému [Concept('co_emperor','spolucísaři')|E]"
 diarchy.8033.a: "To je nehoráznost!"
 diarchy.8041.t: "[Select_CString(actor.IsFemale, 'Tvá panovnice', 'Tvůj panovník')] [actor.GetFirstName] tímto veřejně prohlašuje,"
 diarchy.8041.desc: "S těžkým srdcem přiznávám, že [actor.Custom('GetBestEmpireWithAdjective')] sužuje skutečná záplava pohrom: stoky se ucpávají, hranice se drolí a naše děti se rodí jako prosťáčci.\n\nZa každý jeden z těchto problémů nakonec může můj údajný [Select_CString(recipient.IsFemale, '#EMP spolu#!císařovna', '#EMP spolu#!císař')] [recipient.GetFirstName], hlupák a ničema, kvůli němuž se proti nám hněvá [actor.GetFaith.FateGodName]."
 diarchy.8041.a: "Ta drzost! [actor.Custom2('InsultNoun', ROOT.Char)]!"
 diarchy.8041.b: "Opravdu se ti dva musí hádat takhle veřejně?"
 diarchy.8042.t: "$diarchy.8041.t$"
 diarchy.8042.desc: "Nechť všichni vědí, že za tisíc pohrom sužujících panství — od cizinců přes bezbožnost až po vysoké daně — #EMP může#! můj údajně #EMP starší#! [recipient.GetTopLiege.GetTitleAsNameNoTooltip].\n\nNeschopná správa této osoby maří každý můj krok a s každým dalším dnem vám zhoršuje život."
 diarchy.8042.a: "Takový nevděk!"
 diarchy.8042.b: "$diarchy.8041.b$"
 betrayed_by_proxy: "Zrazen prostředníkem"
 diarch_attempt_to_overthrow_liege.event.t: "Dlouho očekávaný převrat:"
 diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate: "\n\n„[liege.GetFirstName]!“ vykřikne [usurper.GetFirstNameNoTooltip]. „Prohlašuji tě za samozvance nehodného trůnu! Přenech jej skutečnému [Select_CString(usurper.IsFemale, 'vládkyni', 'vládci')] panství. #EMP Mně.#!“\n\nNěkolik méně významných rytířů se jí pokusí postavit do cesty, ale vzápětí jsou jeden po druhém rozpáráni."
 diarchy.9001.t: "$diarch_attempt_to_overthrow_liege.event.t$ Výmluvné jazyky"
 diarchy.9001.desc.intro: "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(usurper.IsFemale, 'vtrhne', 'vtrhne')] do mého trůnního sálu. Za zády má zástup nejvlivnějších lidí ode dvora, každý z nich svírá zbraň s klidnou jistotou těch, kteří vědí, že samotná hrozba postačí. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
 diarchy.9001.desc.proxy.none: "$diarchy.9011.desc.proxy.none$"
 diarchy.9001.desc.proxy.betrayed: "$diarchy.9011.desc.proxy.betrayed$"
 diarchy.9001.desc.proxy.loyal: "$diarchy.9011.desc.proxy.loyal$"
 diarchy.9001.desc.outro: "\n\nJe to tady. Okamžik, kdy zrada konečně propuká naplno."
 diarchy.9001.a: "Myslíš, že by mě mí věrní vazalové opustili kvůli #EMP tobě?#!"
 diarchy.9001.a.tt.success: "Svou výřečností rozvrátíš spojenectví [usurper.GetFirstNameNoTooltip]"
 diarchy.9001.a.tt.failure: "Všechno už je hotová věc"
 diarchy.9001.b.young: "Ukážu na [proxy.GetFirstNameNoTooltip] a požádám o pomoc."
 diarchy.9001.b.fallback: "[proxy.GetFirstNameNoTooltip], vyřiď toho ničemu."
 diarchy.9001.b.tt.success: "Výřečnost [proxy.GetFirstNameNoTooltip] rozvrátí spojenectví [usurper.GetFirstNameNoTooltip]"
 diarchy.9001.b.tt.failure: "Všechno už je hotová věc"
 diarchy.9001.c: "Já... já nemohu nic udělat..."
 diarchy.9001.d: "#DIE2 Stráže.#! #DIE1 Stráže.#! #BER STRÁŽE!#!"
 diarchy.9001.d.tt.win: "Dorazí věrní vojáci a přemohou spiklence"
 diarchy.9001.d.tt.loss: "Tví poslední možní obránci jsou snadno pobiti"
 diarchy.9002.t: "$diarchy.9001.t$"
 diarchy.9002.desc.intro: "Je po mně. Naprosto, úplně po mně.\n\n"
 diarchy.9002.desc.proxy.proxy_fought: "[proxy.GetTitledFirstName] udělal vše, co bylo v jeho silách, ale argumenty [usurper.GetFirstName] byly uhlazené a dobře nacvičené. Přeběhlíci zůstali věrní svému chlebodárci a můj dvůr ustoupil stranou, aby [usurper.GetFirstNameNoTooltip] mohl bez překážek projít."
 diarchy.9002.desc.proxy.self_fought: "Veškeré mé úsilí přijde vniveč. [usurper.GetFirstName|U] plánoval tento okamžik příliš dlouho a s každou další slovní výměnou vidím, jak se několik známých tváří přesouvá na jeho stranu. Je konec. Přišel jsem o trůn."
 diarchy.9002.desc.surrendered: "Vím, jak tahle bitva dopadne. Budu-li bojovat slovy, jen dokážu, že nejsem hoden vlády. Budu-li bojovat ocelí, zajmou mě, nebo ještě hůř. Jediný způsob, jak teď vyhrát, je nehrát — #EMP prozatím#!.\n\nNemyl se, [usurper.GetFirstName]. Ještě se vrátím."
 diarchy.9002.desc.scuffled: "Volám o pomoc, ale těch pár vojáků, kteří dorazí, spiklenci [usurper.GetFirstName] snadno pobijí. Po chvíli proud případných zachránců vyschne a všichni vidí, jak naprosto a zoufale osamělý jsem."
 diarchy.9002.desc.outro: "\n\nUzurpátor pokyne rukou a má ještě před chvílí vlastní stráž mě se zjevnou neochotou odvádí pryč. Odkud vane vítr, je bohužel až příliš jasné."
 diarchy.9002.a: "Mám svobodu, ale sotva co jiného."
 diarchy.9002.b: "Můj osud. Zmařen."
 diarchy.9003.t: "$diarchy.9001.t$"
 diarchy.9003.desc.intro: "Je po všem. Teď vládnu naprosto a sám.\n\n"
 diarchy.9003.desc.proxy.proxy_fought: "Když jsme vstoupili do síně, [liege.GetFirstName], který ještě tehdy vládl, poslal svého přisluhovače [proxy.Custom2('MyCharacterIntroduction', ROOT.Char)], aby zlomil odhodlání mé družiny. Střetli jsme se slovy ostrými jako dýky, ale nakonec všichni viděli, že dvůr stojí při mně."
 diarchy.9003.desc.proxy.self_fought: "Když jsme s družinou vkročili do trůnního sálu, [liege.GetFirstName], který ještě tehdy vládl, se nám postavil osobně. To mu musím přiznat: ještě jednou se pokusil získat zpět věrnost svých kolísajících dvořanů. Jeho volání však dopadalo na hluché uši a jeho gesta zůstávala bez odezvy.\n\nBrzy všichni viděli, kdo je v této místnosti #EMP skutečným#! [usurper.Custom('MistressMaster')|l]."
 diarchy.9003.desc.surrendered: "Nakonec to bylo vlastně poněkud antiklimaktické. Když jsme s družinou vkročili do síně, všichni věděli, proč jsme přišli a co hodláme udělat. Nikdo se nebránil, ze všech nejméně [liege.GetFirstName], který ještě tehdy vládl, a ze svého připraveného projevu jsem sotva něco použil."
 diarchy.9003.desc.scuffled: "Jakmile jsme vstoupili do trůnního sálu, [liege.GetFirstName], který ještě tehdy vládl, začal před všemi ječet a dokazovat vlastní neschopnost vládnout, zatímco volal po komkoli, kdo by ho zachránil. Ani jsme ještě neměli tasené zbraně, přesto jsme těch pár stráží, které dorazily, rychle pobili. Nikdo další už nezbyl, kdo by se postavil na stranu [liege.GetFirstNameNoTooltip]."
 diarchy.9003.desc.outro: "\n\nStráže se rozplynuly a šlechtici poklekli. Už teď se zpráva šíří napříč [usurper.GetPrimaryTitle.GetTierAsName] a věrnost se přelévá jako kruhy po hladině."
 diarchy.9003.a: "A to všechno bez jediné kapky krve na #EMP mém#! trůnu!"
 diarchy.9003.a.some_blood: "A já se přitom snažil vyhnout krveprolití."
 diarchy.9004.t: "$diarchy.9001.t$"
 diarchy.9004.desc.proxy.proxy_fought: "Jakmile [proxy.GetTitledFirstName] začne mluvit, zrádci se začnou rozpadat.\n\nSpojuje je spíš touha po moci za každou cenu než skutečná věrnost, a tak netrvá dlouho, než se věc [usurper.GetTitledFirstName] přímo před jeho očima začne hroutit."
 diarchy.9004.desc.proxy.self_fought: "Má slova rychle nacházejí svůj cíl. Každý pečlivě mířený výpad rozrušuje pouta chamtivosti a ctižádosti, která jako jediná drží koalici [usurper.GetTitledFirstName] pohromadě.\n\nBez jednoty je jejich věc ztracena a přeběhlíci i žoldnéři začínají [usurper.GetFirstNameNoTooltip] houfně opouštět."
 diarchy.9004.desc.scuffled: "Na mé volání se do síně přiřítí každý nižší rytíř a rádoby voják, který je na doslech. Je jich mnohem víc, než si tlupa [usurper.GetTitledFirstName] může dovolit čelit.\n\nPropukne krátká a zuřivá šarvátka. Spiklenci jsou pobiti nebo zajati a jejich vůdce odzbrojen."
 diarchy.9004.desc.outro: "\n\nKdyž stráže [usurper.GetFirstNameNoTooltip] zadrží, dovolím si úšklebek a pokynu, ať toho parchanta odvedou."
 diarchy.9004.a: "Takový opovrženíhodný zrádce."
 diarchy.9005.t: "$diarchy.9001.t$"
 diarchy.9005.desc.intro: "Selhal jsem. Naprosto jsem selhal.\n\nZpočátku šlo všechno tak dobře — "
 diarchy.9005.desc.proxy.proxy_fought: "[liege.GetTitledFirstName] zoufale volal [proxy.GetTitledFirstName] na pomoc, zatímco má družina stála těsně za mnou, náš záměr jasný a krok odhodlaný.\n\nPak ten proklatý kancléř otevřel ústa a všechno se začalo hroutit. Jeden šlechtic po druhém od nás ustupoval, až jsem zůstal sám a má pracně budovaná autorita se mi rozpadala před očima.\n\nStráže mě pak rychle zadržely."
 diarchy.9005.desc.proxy.self_fought: "já i má družina jsme nepochybovali o svém vítězství. Trvalo to jen do chvíle, než [liege.GetFirstNameNoTooltip] otevřel ústa a začal nás rozebírat kus po kuse, odhalovat slabiny mého plánu a nepatrné trhliny v mé autoritě.\n\nMyslel jsem si, že mám vše naprosto pod kontrolou. Jak hluboce jsem se mýlil, mi došlo až ve chvíli, kdy mě popadly stráže."
 diarchy.9005.desc.scuffled: "[liege.GetTitledFirstName] při našem vstupu do trůnního sálu očividně propadl panice a začal křičet jako na lesy.\n\nJá... podcenil jsem, jak věrní dokážou být někteří žoldnéři a najaté stráže svému chlebodárci. Vrhl se na nás celý zástup. Má vytříbená slova byla proti úderu žoldnéřského palcátu k ničemu a teď jsem pod zámkem tak bezpečně, jak jen to jde."
 diarchy.9005.desc.outro: "\n\nIronií je, že mou jedinou nadějí zůstává milost lenního pána, kterého jsem se pokusil svrhnout. Kéž je [usurper.GetFaith.FateGodName] milosrdný."
 diarchy.9005.a: "Všechno to pečlivé plánování!"
 diarchy.9011.t: "$diarch_attempt_to_overthrow_liege.event.t$ Nabroušené nože"
 diarchy.9011.desc.intro: "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vtrhne do mého trůnního sálu. Za zády se mu tlačí dav nižších dvorských šlechticů, žoldnéřů a kapsářů, s tasenými dýkami a vražednými úmysly. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
 diarchy.9011.desc.proxy.none: "Rozhlédnu se po svých rádcích a hledám podporu. Žádní tu nejsou, nebo alespoň žádní, kteří by byli ochotni a schopni se mě zastat."
 diarchy.9011.desc.proxy.betrayed: "Rozhlédnu se po svých rádcích a hledám podporu. [proxy.GetTitledFirstName] zachytí můj pohled, oči chladné jako ocel, a postaví se za [usurper.GetFirstNameNoTooltip]. Další zrada."
 diarchy.9011.desc.proxy.loyal: "Obrátím se pro podporu k [proxy.GetTitledFirstName] a vidím, že už se chystá vystoupit na mou obranu."
 diarchy.9011.desc.outro: "$diarchy.9001.desc.outro$"
 diarchy.9011.a: "Opravdu si myslíš, že jsi mě dostal do pasti, ty malý hade?"
 diarchy.9011.a.tt.success: "Podkopeš jednotu spojenectví a celé se zhroutí"
 diarchy.9011.a.tt.failure: "Tvé výpady jsou ignorovány a ty končíš v zajetí"
 diarchy.9011.b.young: "$diarchy.9001.b.young$"
 diarchy.9011.b.fallback: "$diarchy.9001.b.fallback$"
 diarchy.9011.b.tt.success: "[proxy.GetFirstName] podkope jednotu spojenectví a celé se zhroutí"
 diarchy.9011.b.tt.failure: "Volání [proxy.GetFirstName] je ignorováno a ty končíš v zajetí"
 diarchy.9011.c: "$diarchy.9001.c$"
 diarchy.9011.d: "$diarchy.9001.d$"
 diarchy.9011.d.tt.win: "$diarchy.9001.d.tt.win$"
 diarchy.9011.d.tt.loss: "$diarchy.9001.d.tt.loss$"
 diarchy.9012.t: "$diarchy.9011.t$"
 diarchy.9012.desc.intro: "$diarchy.9002.desc.intro$"
 diarchy.9012.desc.proxy.proxy_fought: "[proxy.GetTitledFirstName] se mě zastane a s [usurper.GetFirstName] si chvíli vyměňuje jeden slovní výpad za druhým, ale marně. [Select_CString(usurper.IsFemale, 'Ta zatracená ničemnice', 'Ten zatracený ničema')] myslela na všechno, podplatila každého, koho bylo třeba, a využila každou páku, kterou měla. Nakonec se [proxy.GetFirstNameNoTooltip] vrhne na [usurper.GetFirstNameNoTooltip], ale družina uzurpátora útok zmaří a srazí mého zastánce k zemi."
 diarchy.9012.desc.proxy.self_fought: "[usurper.GetFirstName] a já se několik minut přeme, ale v této slovní bitvě nemám šanci. [Select_CString(usurper.IsFemale, 'Ta zatracená ničemnice', 'Ten zatracený ničema')] myslela na všechno, podplatila každého, koho bylo třeba, a využila každou páku, kterou měla.\n\nRuka mi sjede k jílci zbraně, připravena k obraně, ale zezadu se mi kolem krku protáhne čepel. Nějaký zatracený přeběhlík ze stráže."
 diarchy.9012.desc.surrendered: "[usurper.GetFirstName] mou neochotou klást odpor působí téměř zklamaně, ale dobře vím, že bojovat nemá smysl. Tak troufalý útok by nepřišel bez jistoty, že každá čepel v budově stojí na straně převratu a míří na každého, kdo ne."
 diarchy.9012.desc.scuffled: "Stráže, které jsem zavolal, skutečně dorazí, ale jakmile vstoupí do síně, druhá vlna rozseká první na kusy. Jedni dostanou ránu do zad, jiným podříznou hrdlo přímo na místě. [usurper.GetFirstName] si nedokáže setřít úšklebek [usurper.Custom('MaskFace_BehindAcross')] [usurper.Custom('MaskFace')]."
 diarchy.9012.desc.outro: "\n\nVykřiknu, když se ke mně zrádci blíží s připravenými dýkami a z ruky [usurper.GetFirstNameNoTooltip] visí okovy.\n\nNikdo neposlouchá. Nikoho to nezajímá. Spoutají mě a odvlečou pryč."
 diarchy.9012.a: "Tohle nemůžeš! Já jsem [usurper.GetTitleAsNameNoTooltip]! #EMP [usurper.GetTitleAsNameNoTooltip]#!!"
 diarchy.9012.b: "$diarchy.9002.b$"
 diarchy.9013.t: "$diarchy.9011.t$"
 diarchy.9013.desc.intro: "$diarchy.9003.desc.intro$"
 diarchy.9013.desc.proxy.proxy_fought: "[liege.GetFirstName] proti mně [Select_CString(liege.IsFemale, 'vyslala', 'vyslal')] svého přisluhovače [proxy.GetTitledFirstName], aby mé spiklence odradil od jejich záměru. Několik minut jsme se přeli, než se rozzuřený [proxy.GetFirstNameNoTooltip] pokusil vrhnout na mě, ale jeden z mých žoldnéřů ho srazil k zemi.\n\n[liege.GetFirstName] byl tím vším natolik zaskočen, že se už vážně nebránil, když jsme nasadili okovy."
 diarchy.9013.desc.proxy.self_fought: "[liege.GetFirstName] se mi [Select_CString(liege.IsFemale, 'pokusila', 'pokusil')] postavit a v rozhodující chvíli narušit podporu mé družiny, ale všechny chabé výpady jsem snadno odrazil. Převrat se zkrátka nesmí dělat napůl.\n\nKdyž se [liege.GetFirstNameNoTooltip] pokusil tasit zbraň, nepochybně v naději, že mi srazí hlavu z ramen, jeden z mých přeběhlíků zakročil zezadu. Nasadit okovy pak byla hračka."
 diarchy.9013.desc.surrendered: "Skoro mě zklamalo, když [liege.GetFirstName] nekladl žádný skutečný odpor, až na krátký výkřik vzteku ve chvíli, kdy jsme nasadili okovy.\n\nJistě to bylo #EMP rozumné#! rozhodnutí, ale kdy se [liege.GetFirstNameNoTooltip] naposledy zachoval rozumně?"
 diarchy.9013.desc.scuffled: "[liege.GetFirstName] zavolal o pomoc, ale s tím jsem samozřejmě počítal. Ty, kteří byli natolik pošetilí, že výzvu vyslyšeli, mí přeběhlíci téměř okamžitě pobili.\n\nNikdo další se ani nepokusil pomoci, když jsme postupovali k našemu bývalému lennímu pánovi."
 diarchy.9013.desc.outro: "\n\nOdpor je mrtvý nebo uvězněný a můj někdejší [usurper.GetTitleAsNameNoTooltip] sedí pod zámkem. Budoucnost vypadá zářivě."
 diarchy.9013.a: "Nový trůn a čerstvý rukojmí — už teď se cítím bezpečněji."
 diarchy.9014.t: "$diarchy.9011.t$"
 diarchy.9014.desc.proxy.proxy_fought: "Několik dobře mířených slov od [proxy.GetFirstName] a $diarchy.9014.desc.proxy.self_fought$"
 diarchy.9014.desc.proxy.self_fought: "Sebejistá družina, kterou vede [usurper.GetTitledFirstName], se rozpadne během několika okamžiků.\n\nJako v každém zmijím hnízdě touží její členové zatnout tesáky jeden do druhého téměř stejně jako do mě, a tak stačí jen trochu pobídnout, aby někteří zběhli a další se začali rvát mezi sebou.\n\n[usurper.GetFirstNameNoTooltip] přestane mít důvod k úsměvu, když je jasné, že pokus o převrat už ztroskotal."
 diarchy.9014.desc.scuffled: "Na mé volání dorazí tolik stráží, že to překvapí dokonce #EMP mě#!, a valí se k davu spiklenců, v jehož čele stojí [usurper.GetTitledFirstName].\n\nPřeběhlíkům netrvá dlouho pochopit, že jsou beznadějně přečísleni a nemají šanci, a jeden po druhém začnou odhazovat zbraně. [usurper.GetTitledFirstNameNoTooltip] je odhodí jako poslední."
 diarchy.9014.desc.outro: "\n\nKdyž mé stráže přistoupí k zatčení, [usurper.GetFirstNameNoTooltip] neklade odpor. Po zhroucení celého spiknutí by cokoli jiného byla sebevražda."
 diarchy.9014.a: "[Select_CString(usurper.IsFemale, 'O tom, co s #EMP tebou#! udělám, rozhodnu později.', 'O tom, co s #EMP tebou#! udělám, rozhodnu později.')]"
 diarchy.9015.t: "$diarchy.9011.t$"
 diarchy.9015.desc.intro: "$diarchy.9005.desc.intro$"
 diarchy.9015.desc.proxy.proxy_fought: "byli jsme silní, jednotní a připravení sklidit spravedlivou odměnu za své plánování. Pak ale vystoupil ten zatracený [proxy.GetTitledFirstName], aby hájil svého zabedněného lenního pána. Já... ty argumenty mě zaskočily, stejně jako trhliny, které odhalily v mých pečlivě připravených plánech. Opustili mě. Všichni mě opustili."
 diarchy.9015.desc.proxy.self_fought: "vtrhli jsme dovnitř jako jeden mocný celek, s dýkami v rukou a připravení dovést vše do konce. Byla chyba nechat [liege.GetFirstName] promluvit. Nikdy jsem neměl dopustit, aby vůbec otevřel ústa! Každá věta strhávala jednu z výmluv, které jsem tak pečlivě připravil, každý argument byl dýkou do srdce naší jednoty. Jeden po druhém ode mě mí druhové ustupovali."
 diarchy.9015.desc.scuffled: "vtrhli jsme do trůnního sálu připraveni udělat, co bylo třeba. Pak však křik [liege.GetTitledFirstName] přivolal zástupy možných obránců, mnohem víc, než by mě kdy napadlo. Mí přeběhlíci se sotva pokusili bojovat a jakmile zjistili, jak drtivě jsme přečísleni, začali odhazovat zbraně."
 diarchy.9015.desc.outro: "\n\nSpiknutí se kolem mě rozpadá a když ke mně přistoupí stráže s okovy, ani se nepokusím bránit. Mám štěstí, že mě nepopravili rovnou na místě."
 diarchy.9015.a: "Tolik #EMP práce#!. Všechno k ničemu."
 diarchy.9021.t: "$diarch_attempt_to_overthrow_liege.event.t$ Zářící meče"
 diarchy.9021.desc.intro: "[usurper.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vtrhne do mého trůnního sálu. Zároveň se dovnitř valí družina žoldnéřů, námezdních bojovníků a přeběhlíků. Zbraně mají tasené a jsou připraveni pobít tolik lidí, kolik bude třeba. Krvavý záměr jim září v očích. $diarch_attempt_to_overthrow_liege.desc.coup_start_boilerplate$"
 diarchy.9021.desc.proxy.none: "$diarchy.9011.desc.proxy.none$"
 diarchy.9021.desc.proxy.betrayed: "$diarchy.9011.desc.proxy.betrayed$"
 diarchy.9021.desc.proxy.loyal: "Obrátím se pro podporu k [proxy.GetTitledFirstName] a vidím, že už se chystá bojovat na mé straně."
 diarchy.9021.a: "[Select_CString(usurper.IsFemale, 'Ty prašivá ničemnice! Sama tě srazím!', 'Ty prašivý ničemo! Sám tě srazím!')]"
 diarchy.9021.a.tt.commence_duel.self: "[usurper.GetShortUIName] s tebou okamžitě svede [Concept('single_combat_duel','duel')|E]"
 diarchy.9021.a.tt.success: "Popravíš svého útočníka"
 diarchy.9021.a.tt.failure: "[usurper.GetFirstNameNoTooltip|U] tě skolí přímo na podlaze trůnního sálu"
 diarchy.9021.b.young: "$diarchy.9001.b.young$"
 diarchy.9021.b.fallback: "$diarchy.9001.b.fallback$"
 diarchy.9021.b.tt.commence_duel.proxy: "[proxy.GetShortUIName] a [usurper.GetShortUIName] spolu okamžitě svedou [Concept('single_combat_duel','duel')|E]"
 diarchy.9021.c: "$diarchy.9001.c$"
 diarchy.9021.d: "$diarchy.9001.d$"
 diarchy.9021.d.tt.win: "$diarchy.9001.d.tt.win$"
 diarchy.9021.d.tt.loss: "$diarchy.9001.d.tt.loss$"
 diarchy.9022.t: "$diarchy.9021.t$"
 diarchy.9022.desc.intro: "$diarchy.9002.desc.intro$"
 diarchy.9022.desc.proxy.proxy_fought: "[proxy.GetTitledFirstName] bojuje ze všech sil, ale [usurper.GetFirstName] nakonec přesto zvítězí. Já... sotva dokážu uvěřit, že někdo jako [proxy.GetFirstNameNoTooltip] za mě položil život pro... #EMP nic#!."
 diarchy.9022.desc.scuffled: "Mé stráže se hrnou do sálu, ale [usurper.GetFirstName] má bohužel po boku dobře vybrané spiklence a žoldnéři i námezdní bojovníci v jejich řadách pobijí mé obránce téměř ihned po příchodu. Oni... oni to nestihnou. #EMP Nemohou#!."
 diarchy.9022.desc.proxy.surrendered: "Navzdory mým protestům se několik strážných a žoldnéřů pokusí vzdorovat silám, které vede [usurper.GetFirstName], ale jsou jeden po druhém pobiti. Hluk přiláká do trůnního sálu mnoho členů mé osobní stráže, ti však při pohledu na dění zaváhají."
 diarchy.9022.desc.outro: "\n\nNež stačím cokoli dalšího podniknout, [usurper.GetFirstName] rázně vykročí ke mně a [usurper.Custom('signature_weapon')] se stále leskne krví. Tohle je konec."
 diarchy.9022.desc.outro.surrendered: "\n\nPoslední naděje pohasne ve chvíli, kdy [usurper.GetTitleAsName] [usurper.GetFirstNameNoTooltip] přijme pokleknutí prvního z mých přísežných vojáků.\n\nJe po všem."
 diarchy.9022.a: "Za tohle tě čeká [liege.GetFaith.random_NegativeAfterLife], [usurper.GetFirstNameNoTooltip]."
 diarchy.9022.b: "$diarchy.9002.b$"
 diarchy.9023.t: "$diarchy.9021.t$"
 diarchy.9023.desc.intro: "$diarchy.9003.desc.intro$"
 diarchy.9023.desc.proxy.proxy_fought: "Tělo [proxy.GetTitledFirstName] se bezvládně sesune stranou. Na násilí je třeba odpovědět násilím. [liege.GetFirstName] si zvolí svou cestu a zaplatí za ni.\n\nZatímco [liege.GetFirstNameNoTooltip] ještě strnule hledí na mrtvé tělo svého šampiona, vykročím vpřed a [usurper.Custom('SignatureWeaponWoundVerb5')] [usurper.Custom('signature_weapon')] do hrdla.\n\nSmrt není okamžitá, ale ani dlouhá. Dvůr i já mlčky sledujeme poslední chvíle a pak tělo svrhnu z trůnu."
 diarchy.9023.desc.proxy.self_fought: "Moc mám pevně v rukou a [liege.GetFirstNameNoTooltip], ještě před chvílí [usurper.GetTitleAsNameNoTooltip], je po smrti mou rukou. Mému usednutí na právoplatné místo už kromě několika rozpačitých zakašlání shromážděného dvora nic nebrání."
 diarchy.9023.desc.surrendered: "K mému překvapení se [liege.GetFirstName] vzdá. Čekám krvavý konec, ale zdá se, že [liege.GetFirstNameNoTooltip] si cení života víc než koruny.\n\nVětšina mé družiny se ušklíbá, když je [liege.GetFirstNameNoTooltip], ještě před chvílí [usurper.GetTitleAsNameNoTooltip], [Select_CString(liege.IsFemale, 'odvlečena', 'odvlečen')] kolem nich a [Select_CString(liege.IsFemale, 'vyhozena', 'vyhozen')] z trůnního sálu, aby uvolnil místo #EMP mně#!.\n\nAť už je to jakkoli nečekané, dobrovolná abdikace mi také vyhovuje. Je... legitimnější."
 diarchy.9023.desc.scuffled: "Jak se dalo čekat, [liege.GetFirstName] zavolá po našem vtrhnutí do trůnního sálu stráže. Naneštěstí pro ty nešťastníky ve službě já myslím dopředu a má družina se na příchozí snadno vrhne a pobije je.\n\nZatímco mí vojáci vítězí v šarvátce, postupuji ke stále křičícímu [liege.GetFirstNameNoTooltip] a [usurper.Custom('SignatureWeaponWoundVerb5')] [usurper.Custom('signature_weapon')] do hrdla.\n\nTato smrt rychle ukončí zbytek boje a vše završí rána těla mého bývalého lenního pána dopadajícího pod trůn."
 diarchy.9023.desc.outro: "\n\nTělo [liege.GetFirstNameNoTooltip] chladnoucí na podlaze trůnního sálu možná není nejdůstojnějším začátkem mé vlády, ale bylo to nutné. A nakonec je to mnohem méně krvavé než občanská válka.\n\nDoufám, že to panství pochopí stejně."
 diarchy.9023.a: "Pár mrtvých zde zachrání životy po celém [usurper.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]."
 diarchy.9023.a.liege_survives: "Svou vládu zahájím velkomyslně."
 diarchy.9024.t: "$diarchy.9021.t$"
 diarchy.9024.desc.proxy.proxy_fought: "Bohužel jsem od [usurper.GetTitledFirstName] příliš daleko, abych zaslechl poslední kletbu, ale mohu alespoň sledovat, jak [usurper.GetFirstNameNoTooltip] umírá.\n\nPřímo u paty mého trůnu [proxy.GetTitledFirstName] s až pohrdavou lehkostí pobije zrádce. Tento čin vlije mým strážím novou odvahu a rozvrátí družinu spiklenců. Následuje několik minut zoufalého krveprolití, během nichž jsou povstalci pobiti."
 diarchy.9024.desc.proxy.self_fought: "Tělo [usurper.GetTitledFirstName] leží přede mnou rozsekané. Je to dílo mých vlastních rukou.\n\nDružina spiklenců propadne slepé panice, rozpadne se a pokusí se uprchnout, ale mé stráže povzbuzené mým úspěchem vyrazí přímo mezi ně. Následuje několik minut zoufalého krveprolití a povstalci padají jeden po druhém."
 diarchy.9024.desc.scuffled: "Naštěstí mé naléhavé volání o pomoc přivede z okolních komnat skutečnou #EMP hordu#! věrných vojáků a námezdních bojovníků. Družina zrádců kolem [usurper.GetTitledFirstName] sice bojuje dobře, ale brzy je přemožena.\n\nSleduji, jak [usurper.GetFirstNameNoTooltip] umírá mezi posledními. V [usurper.Custom('EyeEyes')] se zračí panika, zatímco kolem sviští ocel. Pak se zatíná do těla. A nakonec jím prochází.\n\nTaková je cena zrady."
 diarchy.9024.desc.outro: "\n\nOčekávám, že zpráva se brzy rozšíří po celém [liege.GetPrimaryTitle.GetTierAsName], a doufám, že poslouží jako výstraha všem budoucím uzurpátorům."
 diarchy.9024.a: "[Select_CString(usurper.IsFemale, 'Skončila jako prašivá fena, kterou byla.', 'Skončil jako prašivý pes, kterým byl.')]"
 diarchy.9025.t: "$diarchy.9021.t$"
 diarchy.9025.desc: "Sotva pronikneme do trůnního sálu, panický výkřik [liege.GetTitledFirstName] přivolá dovnitř hotovou záplavu ozbrojených rytířů, kteří jsou ochotni zemřít za svého [liege.Custom('MistressMaster')].\n\nS družinou se prosekáváme tou směsicí budoucích mrtvol, jak nejlépe dokážeme, ale je jich příliš mnoho. Musíme ustoupit, musíme zpátky — a [usurper.GetFaith.FateGodName] je mi svědkem, jsou i za námi. Není... není kudy uniknout.\n\nNe, ne, #EMP ne!#! Tolik plánování, tolik úsilí, všechno k ničemu!"
 diarchy.9025.a: "Nemělo to skončit ta-#BER ÁÁÁÁÁ!#!"
 vizierate.1001.t: "[propositioner.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 vizierate.1001.desc.intro: "Musíš uznat, že [vizier.GetFirstName] je jako vezír naprostá pohroma — zcela zkorumpovaná ostuda tohoto úřadu. Já jsem však věnoval značné množství času i peněz přípravě plánu, jak"
 vizierate.1001.desc.diplomacy: "přetáhnout na svou stranu klíčové příznivce i nejlepší agenty, na které [vizier.GetFirstNameNoTooltip] spoléhá."
 vizierate.1001.desc.stewardship: "proniknout do obchodních zájmů, na nichž [vizier.GetFirstNameNoTooltip] staví, a podplatit stráže."
 vizierate.1001.desc.intrigue: "zneškodnit nejlepší stráže, které chrání [vizier.GetFirstNameNoTooltip], a pak [Select_CString(vizier.IsFemale, 'ji', 'ho')] zajmout a mučit."
 vizierate.1001.desc.outro: "Svěř úřad vezíra místo toho mně a dovol mi proměnit #EMP majetek, který nyní drží [vizier.GetFirstNameNoTooltip]#!, v #EMP tvé#! zlato."
 vizierate_1001_duel_for_vizierate_effect.tt.success: "[propositioner.GetFirstNameNoTooltip] uspěje se svým plánem"
 vizierate_1001_duel_for_vizierate_effect.tt.failure: "[propositioner.GetFirstNameNoTooltip] podlehne politické katastrofě"
 vizierate_1001_duel_for_vizierate_effect.tt.ex_vizier_remains_at_court: "[vizier.GetFirstName] zůstává na tvém [Concept('court','dvoře')|E]"
 vizierate.1001.a: "Ten plán by mohl vyjít..."
 vizierate.1001.b: "Ty finance vypadají složitě..."
 vizierate.1001.c: "Riskantní, velmi riskantní..."
 vizierate.1001.d: "Jak příhodné, že mám dopis, jehož obsah může vidět i [vizier.GetFirstNameNoTooltip]!"
 vizierate.1001.d.tt.filtered_out: "[propositioner.GetTitledFirstName] bude mít #EMP výrazně#! menší šanci zdědit postavení při [Concept('diarchy','sdílení moci')|E] po tvém boku"
 vizierate.1001.e: "Tvé malicherné mocenské pletichy jsou pod mou úroveň."
 vizierate_0001.reason.best_friend.saved_from_assassin: "Zásahem [TARGET_CHARACTER.GetShortUIName] byl zmařen pokus krvelačného bezvýznamného soupeře u dvora zavraždit [CHARACTER.GetShortUIName]"
 vizierate_0001.reason.best_friend.saved_from_assassin_corresponding: "Zásahem [CHARACTER.GetShortUIName] byl zmařen pokus krvelačného bezvýznamného soupeře u dvora zavraždit [TARGET_CHARACTER.GetShortUIName]"
 vizierate_0001.reason.best_friend.natural_working_arrangement: "Přirozená a nenucená souhra mezi [TARGET_CHARACTER.GetShortUIName] a [CHARACTER.GetShortUIName] vytváří pevné spojenectví i srdečné přátelství."
 vizierate_0001.reason.best_friend.mutually_assured_destruction: "Je veřejným tajemstvím, že [TARGET_CHARACTER.GetShortUIName] a [CHARACTER.GetShortUIName] o sobě navzájem vědí něco #EMP nepředstavitelného#! — kupodivu právě společné riziko [CharYouThem(CHARACTER)] ještě více sblížilo."
 vizierate_0001.reason.best_friend.mutually_assured_destruction_corresponding: "Je veřejným tajemstvím, že [TARGET_CHARACTER.GetShortUIName] a [CHARACTER.GetShortUIName] o sobě navzájem vědí něco #EMP nepředstavitelného#! — kupodivu právě společné riziko [CharYouThem(TARGET_CHARACTER)] ještě více sblížilo."
 vizierate_0001.reason.best_friend.natural_compliments: "Povahy [TARGET_CHARACTER.GetShortUIName] a [CHARACTER.GetShortUIName] se dokonale doplňují."
