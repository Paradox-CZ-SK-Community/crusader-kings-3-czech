 diarchies.0000.diarch_mandate_fail.tt.affect_faction.liege: "[diarch.GetFirstName] se [Select_CString(diarch.IsFemale, 'pokusila', 'pokusil')] zneškodnit [Concept('faction','frakci')|E]"
