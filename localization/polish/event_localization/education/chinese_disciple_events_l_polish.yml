 chinese_students.0021.t: "Výrok orákula"
 chinese_students.0021.desc: "[divination_student.GetShortUIName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('divination_student'))], vychází z věštecké komnaty s myslí ještě otřesenou zjeveními I-ťingu.\n\n„[divination_student.Custom2('RelationToMe',ROOT.Char)|U], ukázalo se mi, že"
 chinese_students.0021.desc.heaven.success: "šest nepřerušených čar odhaluje čistou tvořivou sílu Čchien. Tak jako Nebesa objímají vše pod sebou, musí i vládce ztělesňovat sílu zmírněnou moudrostí.“"
 chinese_students.0021.desc.heaven.failure: "šest nepřerušených čar znamená neomezenou moc! Císař musí vládnout železnou pěstí a drtit každý odpor stejně, jako Nebesa drtí ty, kdo se jim vzepřou!“"
 chinese_students.0021.desc.thunder.success: "rozhodný čin ve správný okamžik přináší úspěch, jak praví hexagram Čen. Stejně jako hrom na jaře probouzí spící život, skutečný vůdce podněcuje ostatní k činu.“"
 chinese_students.0021.desc.thunder.failure: "stejně jako hrom udeří rychle a hlasitě, musíme i my přimět všechny, aby se třásli! Váhání je slabost a orákulum žádá okamžité použití síly!“"
 chinese_students.0021.desc.water.success: "stejně jako voda obtéká překážky, učí nás Kchan, že skutečná moudrost spočívá v rozpoznání nebezpečí a nalezení cesty nejmenšího odporu.“"
 chinese_students.0021.desc.water.failure: "stejně jako voda ničí vše, co jí stojí v cestě, měli bychom své nepřátele zaplavit a utopit každý odpor!“"
 chinese_students.0021.desc.mountain.success: "nehybnost přináší jasnost. Když ztišíme mysl a dopřejeme tělu klid, Ken nám bez rušivých vlivů odhalí pravou cestu vpřed.“"
 chinese_students.0021.desc.mountain.failure: "hory drtí všechno pod sebou! I my bychom měli být neochvějní a tvrdohlaví a nikdy neustoupit, ať se děje cokoli!“"
 chinese_students.0021.desc.wind.success: "mírná vytrvalost překoná strnulou sílu. Stejně jako vítr postupně utváří krajinu, dokáže nenápadný vliv Sün to, co hrubá síla nedovede.“"
 chinese_students.0021.desc.wind.failure: "stejně jako bouře můžeme odpor přehlušit tím, že budeme mluvit víc a hlasitěji! Chceme-li prosadit, jaká má být [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] budoucnost, musíme být těmi, kdo promluví nejdůrazněji!“"
 chinese_students.0021.positive_heaven.best: "[divination_student.GetShortUIName] prokazuje skutečnou moudrost ve chápání nebeského řádu a vlády!"
 chinese_students.0021.positive_heaven.worst: "Navzdory obtížím je odhodlání [divination_student.GetShortUIName] porozumět vedení obdivuhodné."
 chinese_students.0021.positive_thunder.best: "[divination_student.GetShortUIName] dokonale chápe podstatu rozhodného jednání!"
 chinese_students.0021.positive_thunder.worst: "Odvaha, s níž [divination_student.GetShortUIName] čelí výzvě Hromu, si zaslouží obdiv."
 chinese_students.0021.positive_water.best: "Výklad [divination_student.GetShortUIName] plyne s přirozenou přizpůsobivostí!"
 chinese_students.0021.positive_water.worst: "Vytrvalost, s níž [divination_student.GetShortUIName] proniká do tajemství Vody, si zaslouží uznání."
 chinese_students.0021.positive_mountain.best: "Klid [divination_student.GetShortUIName] odhaluje hluboké porozumění!"
