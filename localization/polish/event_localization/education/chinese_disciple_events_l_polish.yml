 chinese_students.0021.negative_heaven: "[divination_student.GetShortUIName] nechápe principy vlády Nebes dostatečně do hloubky."
 chinese_students.0021.negative_thunder: "Rozhodná síla Hromu [divination_student.GetShortUIName] uniká. Je třeba jednat cílevědomě."
 chinese_students.0021.negative_water: "Přizpůsobivost [divination_student.GetShortUIName] uniká. Přitom je pro moudrost nezbytná."
 chinese_students.0021.negative_mountain: "Duch [divination_student.GetShortUIName] postrádá klid. Je třeba hledat ztišení."
