 chinese_students.0030.t: "Síla, nebo pokora"
 chinese_students.0030.desc: "Při každodenním cvičení na sobě cítím [Select_CString(mentor.IsFemale,'pohled své mentorky','pohled svého mentora')]. Mlčky pokračuji, zatímco mě [mentor.GetShortUIName] stejně mlčky hodnotí. Po chvíli, která působí jako věčnost, konečně promluví.\n\n„Nestačí znát své největší přednosti. Ještě důležitější je znát své nejhlubší meze. Ukaž mi, [Select_CString(ROOT.Char.IsFemale,'jak dobře znáš sama sebe, učednice','jak dobře znáš sám sebe, učedníku')].“"
 chinese_students.0030.a.diplomacy: "Přednesu výmluvnou řeč na podporu harmonie v panství."
 chinese_students.0030.a.martial: "Předvedu svou bezchybnou techniku s kopím."
 chinese_students.0030.a.stewardship: "Dokážu přesně ukázat, kde se prostředky panství vynakládají špatně."
 chinese_students.0030.a.intrigue: "[Select_CString(mentor.IsFemale,'Má důmyslná šifra snad vzbudí zájem mé mentorky.','Má důmyslná šifra snad vzbudí zájem mého mentora.')]"
 chinese_students.0030.a.learning: "Dokážu zpaměti odříkat Konfuciovy Hovory."
 chinese_students.0030.b.diplomacy: "[Select_CString(mentor.IsFemale,'Vyzvu svou mentorku #emp přímo#! k vášnivé debatě!','Vyzvu svého mentora #emp přímo#! k vášnivé debatě!')]"
 chinese_students.0030.b.martial: "[Select_CString(mentor.IsFemale,'Má mentorka se mé bezchybné technice s kopím #emp ani nevyrovná#!!','Můj mentor se mé bezchybné technice s kopím #emp ani nevyrovná#!!')]"
 chinese_students.0030.b.stewardship: "[Select_CString(mentor.IsFemale,'Ukážu své mentorované?','')]"
 chinese_students.0030.b.intrigue: "[Select_CString(mentor.IsFemale,'Znám pár věcí o #emp jejích#! tajemstvích, které bych mohl prozradit!','Znám pár věcí o #emp jeho#! tajemstvích, které bych mohl prozradit!')]"
 chinese_students.0030.b.learning: "#emp Nikdo#! se nemůže rovnat mému porozumění klasickým spisům!"
 chinese_students.0030.c.diplomacy: "Pracuji na jedné petici..."
 chinese_students.0030.c.martial: "Má technika s kopím má své chyby, ale mohl[Select_CString(ROOT.Char.IsFemale,'a','')] bych ji předvést..."
 chinese_students.0030.c.stewardship: "S několika položkami v účetních knihách si nevím rady..."
 chinese_students.0030.c.intrigue: "O palácových intrikách už něco málo vím..."
 chinese_students.0030.c.learning: "Mohl[Select_CString(ROOT.Char.IsFemale,'a','')] bych vyložit, co vím o Konfuciově učení..."
 chinese_students.0030.talent.success: "[Select_CString(ROOT.Char.IsFemale,'Vedla jsem si znamenitě','Vedl jsem si znamenitě')]"
