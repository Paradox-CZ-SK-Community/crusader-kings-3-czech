 chinese_students.0011.t: "Poučná chvíle"
 chinese_students.0011.desc.intro: "U mých dveří se objeví [scroll_student.GetShortUIName] a s úctou nese svitek popsaný vytříbenou kaligrafií. S rozechvělýma rukama mi jej podává a napjatě očekává můj verdikt.\n\nOpatrně svitek rozvinu a zkoumám jeho obsah. Ukáže se, že jde o "
 chinese_students.0011.desc.law: "návrh nového zákona zabývajícího se jemnějšími stránkami dobrého vládnutí."
 chinese_students.0011.desc.love_letter: "milostný dopis pro [beloved.GetShortUIName], plný něžných vyznání."
 chinese_students.0011.desc.emperor_ode: "ódu na slávu [ROOT.Char.GetTopLiege.GetShortUIName], která opěvuje [Select_CString(ROOT.Char.GetTopLiege.IsFemale,'její četné ctnosti','jeho četné ctnosti')]."
 chinese_students.0011.desc.treatise: "filozofické pojednání zkoumající vztahy mezi pěti prvky a čtyřmi pilíři."
 chinese_students.0011.desc.strategy: "pojednání o vojenské strategii navrhující několik neobvyklých manévrů, které by se daly využít při taženích [scroll_student.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] armády."
 chinese_students.0011.desc.blank: "naprosto prázdný svitek!"
 chinese_students.0011.desc.conclusion: "\n\nJe to pozoruhodný vhled do nitra i povahy autora."
 chinese_students.0011.desc.quality_success: "Takové dílo si zaslouží čestné místo v knihovně. [scroll_student.GetTopLiege.GetCapitalLocation.GetNameNoTooltip] je pro něj tím pravým místem!"
 chinese_students.0011.desc.quality_failure: "Bohužel, navzdory značnému úsilí je výsledek... nevalný."
 chinese_students.0011.desc.quality_success.blank: "Jak zajímavá a hluboká volba!"
 chinese_students.0011.desc.quality_failure.blank: "Co tím proboha [scroll_student.GetFirstNameNoTooltip] zamýšlel[Select_CString(scroll_student.IsFemale,'a','')]?!"
 chinese_students.0011.self_improvement: "Přijatelné, ale podle mě má [scroll_student.GetFirstNameNoTooltip] na víc."
 chinese_students.0011.positive_law: "Tento zákon svědčí o pozoruhodném důvtipu a moudrosti."
 chinese_students.0011.positive_love: "Tak něžná slova! Ty city jsou upřímné a dojemné."
 chinese_students.0011.positive_emperor: "Výmluvná pocta hodná Syna nebes."
 chinese_students.0011.positive_philosophy: "Tyto filozofické postřehy odhalují hluboký intelekt."
 chinese_students.0011.positive_strategy: "Tyto manévry svědčí o slibném taktickém myšlení."
 chinese_students.0011.positive_blank: "Pozoruhodné! Nejhlubší moudrost nelze nalézt v psaném slově."
 chinese_students.0011.positive_law.worst: "Porozumění právním otázkám se u [scroll_student.GetFirstNameNoTooltip] každým dnem zlepšuje!"
 chinese_students.0011.positive_love.worst: "Jak vidím, [scroll_student.GetFirstNameNoTooltip] už začíná pronikat do jemného umění svůdných slovních hříček!"
 chinese_students.0011.positive_emperor.worst: "[scroll_student.GetFirstNameNoTooltip] projevuje nečekané nadání pro umění vzdávat hold!"
 chinese_students.0011.positive_philosophy.worst: "[scroll_student.GetFirstNameNoTooltip] si osvojuje filozofické pojmy překvapivě rychle!"
 chinese_students.0011.positive_strategy.worst: "[scroll_student.GetFirstNameNoTooltip] začíná ve vojenských otázkách uvažovat s nebývalou jasností!"
 chinese_students.0011.negative_law: "Chabý pokus o vládnutí. [scroll_student.GetFirstNameNoTooltip] se má ještě hodně co učit."
 chinese_students.0011.negative_love: "Otřepané city zahalené do květnatých slov. Jaké zklamání."
 chinese_students.0011.negative_emperor: "Prázdné lichotky odhalují povrchní mysl."
 chinese_students.0011.negative_philosophy: "[scroll_student.GetFirstNameNoTooltip] pouze opakuje cizí myšlenky, aniž by jim rozuměl[Select_CString(scroll_student.IsFemale,'a','')]."
 chinese_students.0011.negative_strategy: "[scroll_student.GetFirstNameNoTooltip] kvůli vlastnímu prospěchu ohrožuje [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip]."
 chinese_students.0011.negative_blank: "Stejně prázdné jako mysl [scroll_student.GetFirstNameNoTooltip]."
