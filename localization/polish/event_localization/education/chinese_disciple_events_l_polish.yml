l_polish:
 chinese_students.0002.t: "Nedostatek kázně"
 chinese_students.0002.desc: "„[ROOT.Char.Custom('TeachingsAccordingToMovement')].“\n\nOdmlčím se, aby má slova měla čas zapůsobit, ale [second_student.GetName] okamžiku využije. Okázale pohlédne úkosem na [first_student.GetName], odkašle si a odpoví: „[ROOT.Char.Custom('TeachingResponsesAccordingToMovement')].“\n\nTi dva si jdou po krku celý týden."
 chinese_students.0002.a: "Trocha zdravého soupeření neuškodí!"
 chinese_students.0002.a.tooltip: "Obě postavy získají [Concept('merit','zásluhy')|E], začnou mezi sebou více soupeřit a ocení tvé vedení. Podle své povahy můžeš získat [Concept('stress','stres')|E]."
 chinese_students.0002.b: "Přízeň rodu [most_renowned_student.GetHouse.GetNameNoTooltip] by se mohla hodit."
 chinese_students.0002.b.tooltip: "Postava z dynastie s nejvyšším [Concept('dynasty_prestige','věhlasem')|E] získá [Concept('merit','zásluhy')|E] a ocení tvou přízeň, stejně jako hlava jejího rodu. Druhá ti bude mít tvou protekci za zlou."
 chinese_students.0002.c: "[underdog.GetShortUINameNoTooltip] se musí naučit znát své místo."
 chinese_students.0002.c.tooltip: "[underdog.GetShortUINameNoTooltip] ztratí [Concept('merit','zásluhy')|E] a získá [Concept('stress','stres')|E], zatímco [overdog.GetShortUINameNoTooltip] získá [Concept('merit','zásluhy')|E]. [underdog.GetShortUINameNoTooltip] ti bude mít tvou tvrdost za zlou."
 chinese_students.0002.d: "Tohle si [overdog.GetShortUINameNoTooltip] nesmí dovolovat!"
 chinese_students.0002.d.tooltip: "[overdog.GetShortUINameNoTooltip] ztratí [Concept('merit','zásluhy')|E] a získá [Concept('stress','stres')|E], zatímco [underdog.GetShortUINameNoTooltip] získá [Concept('merit','zásluhy')|E]. [overdog.GetShortUINameNoTooltip] ti bude mít tvou tvrdost za zlou."
 chinese_students.0002.e: "Oběma prospěje trocha pokory."
 chinese_students.0002.e.tooltip: "Obě postavy budou pokárány, což jim způsobí [Concept('stress','stres')|E] a vyvolá v nich zášť. Vyrušení způsobí trochu [Concept('stress','stresu')|E] i tobě, ale za prosazení kázně získáš [Concept('merit','zásluhy')|E]."
 chinese_students.0003.t: "$chinese_students.0002.t$"
 chinese_students.0003.desc.intro: "„[mentor.Custom('TeachingsAccordingToMovement')].“\n\nKdyž [mentor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))], předává své moudrosti, [second_student.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('second_student'))], si odkašle, pohlédne na mě úkosem a odpoví: „[ROOT.Char.Custom('TeachingResponsesAccordingToMovement')].“\n\n"
 chinese_students.0003.desc.encourage_both: "Naši rivalitu [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))] ještě přiživuje. S každou další lekcí bude naše soupeření ostřejší."
 chinese_students.0003.desc.punish_both: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))|U] nás oba nemilosrdně pokárá."
 chinese_students.0003.desc.favor: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))|U] [Select_CString(second_student.IsFemale,'ji','ho')] zarazí a pokračuje ve výkladu, jen [Select_CString(second_student.IsFemale,'jejím','jeho')] směrem vrhne ostrý pohled."
 chinese_students.0003.desc.disfavor: "[ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))|U] vlídně přijme [Select_CString(second_student.IsFemale,'její poznámku','jeho poznámku')] a na mě se na okamžik zamračí. Uši mi hoří studem."
 chinese_students.0003.a: "Dokážu, že se [second_student.GetTitledFirstNameNoTooltip] mýlí!"
 chinese_students.0003.b: "Na tom nezáleží; mou silou je vyrovnanost."
 chinese_students.0003.c: "Ať všichni vědí, že vítězství je mé!"
 chinese_students.0003.d: "Vítězství vyžaduje pokoru."
 chinese_students.0003.e: "Pomstím se!"
 chinese_students.0003.f: "Z této porážky se poučím."
 opinion_mentor_appreciation: "Ocenění vedení mentora"
 opinion_mentor_favoritism_positive: "Ocenění protekce"
 opinion_mentor_favoritism_negative: "Zášť kvůli protekci"
 opinion_mentor_strict_negative: "Zášť kvůli mentorově tvrdosti"
 TeachingsAccordingToMovementProHegemon_Teaching: "Osa Nebes, třebaže neviditelná, uvádí do pohybu vše pod Nebesy. Když ctnost neochvějně stojí ve středu říše, dostaví se soulad"
 TeachingsAccordingToMovementExpansion_Teaching: "Když se řeka vylije z břehů, někteří mohou zahynout, její vody však zúrodní nová pole, která nasytí mnohé. Tak se velikost projevuje v odvaze vykročit do zemí za našimi hranicemi"
 TeachingsAccordingToMovementAdvancement_Teaching: "Péče o zahradu uvnitř zdí naplní vzduch vůní, která přivábí ostatní. Pravá síla a sláva vyrůstají jen z kořenů zapuštěných hluboko v dobře obdělávané půdě"
 TeachingsAccordingToMovementConservative_Teaching: "Přestože v síních předků vládne ticho, naslouchej pozorně a uslyšíš trvalou ozvěnu, která povede každý tvůj krok. Měj v úctě vyšlapanou cestu, jež nás dovedla až sem"
 TeachingsAccordingToMovementUndecided_Teaching: "Když se obrátí vítr, moudrý nastaví plachty, aby využil jeho sílu. Tanec zdrženlivosti a ctižádosti, tradice a změny, věčně hledající rovnováhu, by tě měl vést ve vládnutí i v životě"
 TeachingsAccordingToMovementFallback_Teaching: "I jediná lucerna zahání noc; moudrost nepotřebuje prapor, aby ukazovala cestu"
 TeachingsAccordingToMovementProHegemon_Response: "Jsou tací, kdo osu chválí tak hlasitě, až zapomínají, že sami jsou jen paprskem, jehož úkolem je držet kolo pohromadě"
 TeachingsAccordingToMovementExpansion_Response: "Někteří se tak soustředí na nová pole, že zapomínají udržovat pokoj ve vlastní zahradě"
 TeachingsAccordingToMovementAdvancement_Response: "Někteří se ženou za vzdálenými květy a říkají tomu sláva, ale zapomínají na plody, které živí jejich vlastní dům"
 TeachingsAccordingToMovementConservative_Response: "Obávám se, že kdo příliš lpí na minulosti, nedokáže obdělávat novou půdu, ani když stará pole leží ladem"
 TeachingsAccordingToMovementUndecided_Response: "Je smutné, kolik lidí chválí rovnováhu jen jako výmluvu pro nečinnost, zatímco svět jde dál bez nich"
 TeachingsAccordingToMovementFallback_Response: "Někteří poletují od lucerny k lucerně jako můra za každým plamenem"
 chinese_students.0010.t: "Prázdný svitek"
 chinese_students.0010.desc: "[mentor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))], ke mně přichází s ozdobným svitkem v rukou. Neposkvrněný jedinou kapkou inkoustu přede mnou otevírá prázdný prostor plný možností.\n\n„Prázdný svitek je zkouškou tvé moudrosti a povahy,“ zazní slavnostně. „To, co na něj napíšeš, bude odrazem tvé duše. Vol svá slova obezřetně, mladý učedníku.“\n\nPoté zůstávám o samotě jen se štětci, inkoustem a vlastními myšlenkami."
 chinese_students.0010.a.strength: "Příležitost reformovat zastaralé zákony panství!"
 chinese_students.0010.b.strength: "Báseň překypující dvojsmysly a slovními hříčkami! [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('beloved'))] [beloved.GetFirstName] bude nadšena[Select_CString(beloved.IsFemale,'','')]!"
 chinese_students.0010.c.strength.china: "Jen samotný Syn nebes si zaslouží tahy mého štětce!"
 chinese_students.0010.c.strength.other: "Jen [ROOT.Char.GetTopLiege.GetShortUINameNoTooltip] si zaslouží tahy mého štětce!"
 chinese_students.0010.d.strength: "Filozofie proudí z mé mysli na svitek docela sama!"
 chinese_students.0010.e.strength: "Ve vojenské strategii můj talent září nejjasněji!"
 chinese_students.0010.a.weakness: "Zákonodárství mi dává zabrat, ale musím se o ně alespoň pokusit..."
 chinese_students.0010.b.weakness: "Má slova možná budou neobratná, ale své city k [beloved.GetFirstName] se přesto pokusím vyjádřit..."
 chinese_students.0010.c.weakness.china: "Pokusím se sepsat ódu na Syna nebes..."
 chinese_students.0010.c.weakness.other: "Pokusím se sepsat ódu na [ROOT.Char.GetTopLiege.GetShortUINameNoTooltip]..."
 chinese_students.0010.d.weakness: "Filozofie mě zkouší až na hranici mých schopností, ale toto pojednání mi snad rozšíří obzory..."
 chinese_students.0010.e.weakness: "Válečnictví mi příliš nejde, ale [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] armáda potřebuje nové myšlenky..."
 chinese_students.0010.f: "Nejhlubší pravda spočívá v tom, co zůstane nevyřčeno."
 chinese_students.0010.tt: "#weak Výsledek bude posouzen...#!"
