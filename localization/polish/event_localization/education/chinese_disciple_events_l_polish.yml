 chinese_students.0031.a.success.talent: "[mentee.GetFirstNameNoTooltip] si vede znamenitě."
 chinese_students.0031.a.success.show_off: "Mé učení už [mentee.GetFirstNameNoTooltip] nemá co nabídnout!"
 chinese_students.0031.a.success.improve: "Pokrok, který [mentee.GetFirstNameNoTooltip] dělá, mě těší!"
 chinese_students.0031.a.failure.talent: "[mentee.GetFirstNameNoTooltip] má o sobě příliš vysoké mínění, ale každý nějak začíná."
 chinese_students.0031.a.failure.show_off: "[Select_CString(ROOT.Char.IsFemale,'Jak jsem to mohla takhle pokazit?!','Jak jsem to mohl takhle pokazit?!')]"
 chinese_students.0031.a.failure.improve: "[mentee.GetFirstNameNoTooltip] se stále potýká se stejnými obtížemi."
 chinese_students.0031.b.success.talent: "Chvála nikoho ke zlepšení neposune!"
 chinese_students.0031.b.success.show_off: "Sebevědomí hraničí s arogancí, ale kritizovat toho mnoho nemohu."
 chinese_students.0031.b.success.improve: "$chinese_students.0031.b.success.talent$"
 chinese_students.0031.b.failure.talent: "[mentee.GetFirstNameNoTooltip] se musí především naučit pokoře."
 chinese_students.0031.b.failure.show_off: "Žádný talent a ještě méně pokory. Je čas zbavit se té přítěže."
 chinese_students.0031.b.failure.improve: "[mentee.GetFirstNameNoTooltip] má před sebou ještě dlouhou cestu."
 chinese_students.0031.desc.action.talent.diplomacy: "[mentee.GetFirstNameNoTooltip] předstoupí a pronese výmluvnou řeč na podporu harmonie v panství."
 chinese_students.0031.desc.action.talent.martial: "S klidným dechem [mentee.GetFirstNameNoTooltip] předvede bezchybnou techniku s kopím."
 chinese_students.0031.desc.action.talent.stewardship: "S účetní knihou v ruce [mentee.GetFirstNameNoTooltip] ukazuje, kde peníze panství zbytečně mizí."
 chinese_students.0031.desc.action.talent.intrigue: "[mentee.GetFirstNameNoTooltip] rozvine důmyslnou šifru a vybídne mě, abych ji prozkoumal[Select_CString(ROOT.Char.IsFemale,'a','')]."
 chinese_students.0031.desc.action.talent.learning: "[mentee.GetFirstNameNoTooltip] začne klidně zpaměti recitovat Konfuciovy Hovory."
 chinese_students.0031.desc.action.show_off.diplomacy: "[mentee.GetFirstNameNoTooltip] se sebevědomým gestem rozpoutá živou debatu a troufá si zpochybňovat dokonce i mou moudrost."
 chinese_students.0031.desc.action.show_off.martial: "[mentee.GetFirstNameNoTooltip] se chopí kopí a vyzve mě, abych se pokusil[Select_CString(ROOT.Char.IsFemale,'a','')] vyrovnat jeho bezchybné technice."
 chinese_students.0031.desc.action.show_off.stewardship: "[mentee.GetFirstNameNoTooltip] se samolibým úsměvem okázale kritizuje mé vlastní účty."
 chinese_students.0031.desc.action.show_off.intrigue: "[mentee.GetFirstNameNoTooltip] začne vyprávět o skrytých tajemstvích panství a nenápadně naznačuje, že ví i o úkladech, které mají zůstat pouze mým tajemstvím."
 chinese_students.0031.desc.action.show_off.learning: "[mentee.GetFirstNameNoTooltip] se prohlásí za nepřekonatelného znalce a začne sypat z rukávu zapadlé pasáže klasických spisů."
 chinese_students.0031.desc.action.improve.diplomacy: "[mentee.GetFirstNameNoTooltip] nesměle předloží skromnou petici a žádá o pomoc se zdokonalením své rétoriky."
 chinese_students.0031.desc.action.improve.martial: "[mentee.GetFirstNameNoTooltip] přizná nedostatky a předvede nejistou techniku s kopím, abych ji mohl[Select_CString(ROOT.Char.IsFemale,'a','')] opravit."
 chinese_students.0031.desc.action.improve.stewardship: "[mentee.GetFirstNameNoTooltip] přede mě rozloží zmatené výpočty a žádá o pomoc s jejich uspořádáním."
 chinese_students.0031.desc.action.improve.intrigue: "[mentee.GetFirstNameNoTooltip] se se mnou podělí o nesmělé úvahy o palácových intrikách a touží je zdokonalit."
 chinese_students.0031.desc.action.improve.learning: "[mentee.GetFirstNameNoTooltip] s jistým váháním převypráví útržky Konfuciova učení v naději, že jim lépe porozumí."
 chinese_students.0031.t: "Nefrit, nebo kámen"
 chinese_students.0031.desc.intro: "Při každodenním cvičení sleduji, jak [mentee.GetShortUIName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentee'))], předvádí své schopnosti.\n\n"
 chinese_students.0031.desc.talent.diplomacy.success: "Rozvážná slova a uctivý tón odhalují srdce diplomata, který obratně spřádá soulad z nesourodých hlasů."
 chinese_students.0031.desc.talent.diplomacy.failure: "Jazyk se plete a hlas postrádá jistotu. Místo kýženého souladu přichází jen zmatek."
 chinese_students.0031.desc.talent.martial.success: "Postoj zůstává pevný a každý úder je přesný. Je znát kázeň ukovaná nesčetnými hodinami na cvičišti."
 chinese_students.0031.desc.talent.martial.failure: "Kroky váznou a úderům chybí síla, což odhaluje mezery v technice."
 chinese_students.0031.desc.talent.stewardship.success: "Účetní kniha, kterou [mentee.GetFirstNameNoTooltip] předkládá, je vyvážená jako váhy Nebes a každá mince v ní má své promyšlené místo."
 chinese_students.0031.desc.talent.stewardship.failure: "Součty ve sloupcích nesedí a stránky hyzdí kaňky, které za sebevědomými tvrzeními odhalují nedbalost."
 chinese_students.0031.desc.talent.intrigue.success: "Jemná jako stín v měsíčním světle se důmyslná šifra [mentee.GetFirstNameNoTooltip] rozvíjí a odhaluje skryté pohnutky těch, kdo jí naslouchají."
 chinese_students.0031.desc.talent.intrigue.failure: "Vlákna klamu se zaplétají do nesmyslného uzlu a každý chybný krok odhaluje tajemství, která měla zůstat skrytá."
 chinese_students.0031.desc.talent.learning.success: "[mentee.GetFirstNameNoTooltip] bez zaváhání recituje klasické spisy, každý verš jako tah štětce svědčící o oddanosti studiu."
 chinese_students.0031.desc.talent.learning.failure: "Zapomenuté řádky a pomíchané významy odhalují, že za smělými tvrzeními se skrývá jen povrchní studium."
 chinese_students.0031.desc.show_off.diplomacy.success: "Okázalost se tu snoubí se skutečným umem: výmluvnost oslňuje, ale přesto vede srdce ke shodě."
 chinese_students.0031.desc.show_off.diplomacy.failure: "Jenže [mentee.GetFirstNameNoTooltip] usiluje spíš o potlesk než o soulad a výmluvnost tak mění v oslnivou marnivost."
 chinese_students.0031.desc.show_off.martial.success: "Okázalé výpady nezakrývají žádné nedostatky; každý bod protíná vzduch s opravdovým mistrovstvím."
 chinese_students.0031.desc.show_off.martial.failure: "Kopí sviští jen pro efekt a honba za obdivem nahrazuje snahu o dokonalou techniku."
 chinese_students.0031.desc.show_off.stewardship.success: "Chvástání stranou, účty jsou tak přesné, že ani okázalost nedokáže snížit jejich hodnotu."
 chinese_students.0031.desc.show_off.stewardship.failure: "[mentee.GetFirstNameNoTooltip] předvádí sloupce čísel jako rekvizity na jevišti a zapomíná, že skutečná moudrost spočívá v tiché rovnováze."
 chinese_students.0031.desc.show_off.intrigue.success: "Okázalost halí bezchybné úklady; každý šeptaný náznak nepozorovaně postrkuje posluchače žádoucím směrem."
 chinese_students.0031.desc.show_off.intrigue.failure: "Labyrint tajemství, který [mentee.GetFirstNameNoTooltip] splétá, jako by vznikl spíš pro efekt než z nutnosti. Chytrost otupuje pýcha."
 chinese_students.0031.desc.show_off.learning.success: "Blesková recitace zároveň oslňuje i poučuje a dokazuje, že za vnější okázalostí se skrývá skutečné porozumění."
 chinese_students.0031.desc.show_off.learning.failure: "[mentee.GetFirstNameNoTooltip] chrlí pasáže rychleji, než stačí popadnout dech, a hlubší význam slov mu zcela uniká."
 chinese_students.0031.desc.improve.diplomacy.success: "Hlas je pevný a argumenty přesvědčivé. [mentee.GetFirstNameNoTooltip] si na neznámé půdě vede nad očekávání dobře."
 chinese_students.0031.desc.improve.diplomacy.failure: "Váhavý projev prozrazuje nejistotu, ale pokora je prvním krokem na cestě diplomata."
 chinese_students.0031.desc.improve.martial.success: "Kdysi nejistý postoj je teď pevný a sebejistý, jasný důkaz svědomitého výcviku."
 chinese_students.0031.desc.improve.martial.failure: "Kopí se [mentee.GetFirstNameNoTooltip] chvěje v rukou a nejistě kmitá, ale i ten největší vojevůdce kdysi zápolil s dřevěným mečem."
 chinese_students.0031.desc.improve.stewardship.success: "Součty sedí a inkoust spočívá na stránce čistě; vytrvalost vnesla řád do zmatku."
 chinese_students.0031.desc.improve.stewardship.failure: "Součty [mentee.GetFirstNameNoTooltip] váznou a inkoust se rozmazává, ale pokorná snaha dosáhnout mistrovství si zaslouží mé vedení."
 chinese_students.0031.desc.improve.intrigue.success: "Lest se rozvíjí s překvapivou obratností a naznačuje nečekané porozumění skrytým proudům."
 chinese_students.0031.desc.improve.intrigue.failure: "Nemotorný klam je průhledný, ale upřímně si přiznat vlastní nedostatky je vzácnější než zlato."
 chinese_students.0031.desc.improve.learning.success: "Verše přicházejí váhavě, ale správně. Semena učenosti už zapouštějí pevné kořeny."
 chinese_students.0031.desc.improve.learning.failure: "[mentee.GetFirstNameNoTooltip] při recitaci Hovorů klopýtá, ale v očích stále jasně plane touha po poznání."
 chinese_students.0031.desc.conclusion: "\n\nOdkašlu si a nádvoří ztichne. Nastal čas vyslovit můj soud."
 chinese_students.0031.kind_evaluation.toast: "Laskavé hodnocení"
 chinese_students.0031.harsh_evaluation.toast: "Přísné hodnocení"
 chinese_students.0032.t: "Rozchod cest"
 chinese_students.0032.desc: "[mentor.GetShortUIName] ke mně přistoupí s rukama sepjatýma za zády. „Zde se naše cesty rozcházejí, učedníku,“ pronese vyrovnaným hlasem. „Teď už hledej moudrost vlastními silami. Mé lekce jsou u konce.“"
 chinese_students.0032.a: "Budu se muset snažit bez vedení."
