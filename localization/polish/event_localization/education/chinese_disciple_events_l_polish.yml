 chinese_students.0020.t: "Rozmluva s Cestou"
 chinese_students.0020.desc: "[mentor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('mentor'))], před námi rozprostře starobylé stonky řebříčku, jejichž omšelý povrch zachytává mihotavé světlo svíčky. „Věštba v sobě skrývá nekonečné poznání, [Select_CString(ROOT.Char.IsFemale,'mladá učednice','mladý učedníku')],“ pronese s úctou. „Promlouvá však jen k těm, kdo k ní přistupují s dovedností i upřímností. Co v nich čteš?“\n\nHexagramy I-ťingu "
 chinese_students.0020.desc.heaven: "[Glossary('Nebesa','I_CHING_HEAVEN_GLOSS')]"
 chinese_students.0020.desc.thunder: "[Glossary('Hrom','I_CHING_THUNDER_GLOSS')]"
 chinese_students.0020.desc.water: "[Glossary('Voda','I_CHING_WATER_GLOSS')]"
 chinese_students.0020.desc.mountain: "[Glossary('Hora','I_CHING_MOUNTAIN_GLOSS')]"
 chinese_students.0020.desc.wind: "[Glossary('Vítr','I_CHING_WIND_GLOSS')]"
 comma_space: "-"
 comma_space_and: "-"
 chinese_students.0020.desc.conclusion: "se přede mnou během slov [mentor.GetTitledFirstName] jasně vynořují. Jako by trpělivě čekaly, až odhalím vesmírné zákonitosti, které řídí svět."
 chinese_students.0020.a.strength: "Nebesa mi vždy ukazují cestu!"
 chinese_students.0020.a.weakness: "Snad mi dnes tajemství Nebes neuniknou..."
 chinese_students.0020.b.strength: "Hrom je mou doménou!"
 chinese_students.0020.b.weakness: "Možná právě teď pochopím sílu Hromu..."
 chinese_students.0020.c.strength: "Voda dokonale odráží mé porozumění!"
 chinese_students.0020.c.weakness: "Moudrost Vody je stejně neuchopitelná jako její podstata..."
 chinese_students.0020.d.strength: "Cestu na Horu znám dobře!"
 chinese_students.0020.d.weakness: "Hora se v mé mysli tyčí hrozivě vysoko..."
 chinese_students.0020.e.strength: "Vítr dobře znám!"
 chinese_students.0020.e.weakness: "Jemnost Větru mi uniká..."
 I_CHING_HEAVEN_GLOSS: "Hexagram Nebes představuje božský řád, vládu a vedení. Ztělesňuje principy autority a uspořádání a vede ty, kdo chtějí vládnout moudře a ctnostně."
 I_CHING_THUNDER_GLOSS: "Hexagram Hromu symbolizuje moc, autoritu a schopnost prosadit svou vůli. Učí, jak důležité jsou síla a rozhodnost tváří v tvář protivenství."
 I_CHING_WATER_GLOSS: "Hexagram Vody symbolizuje přizpůsobivost, plynutí a schopnost proplouvat životními nesnázemi. Učí, jak důležité jsou pružnost a odolnost tváří v tvář protivenství."
 I_CHING_MOUNTAIN_GLOSS: "Hexagram Hory symbolizuje stálost, sílu a schopnost snášet útrapy. Učí, jak důležité jsou vytrvalost a statečnost tváří v tvář protivenství."
 I_CHING_WIND_GLOSS: "Hexagram Větru symbolizuje změnu, pružnost a schopnost přizpůsobit se novým okolnostem. Učí, jak důležité jsou přizpůsobivost a odolnost tváří v tvář protivenství."
