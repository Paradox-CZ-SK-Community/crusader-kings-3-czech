l_polish:
 first_line_text_set_1_A: "Jsem něžná, křehká růžice"
 first_line_text_set_1_B: "Kéž mě pozveš do své světnice"
 first_line_text_set_2_A: "Jsi má vůdčí hvězda, můj jas"
 first_line_text_set_2_B: "Ze Švýcarska nejsem, to přísahám zas"
 second_line_text_set_1_A: "Ty mi připomínáš hradní věžice"
 second_line_text_set_1_B: "A má feudální moc snad nemá hranice"
 second_line_text_set_2_A: "Ty jsi příčinou všeho blaha v nás"
 second_line_text_set_2_B: "V něžném polibku se všechno rozplete včas"
 third_line_text_set_1_A: "Možná je čas na hlubší zamyšlení"
 third_line_text_set_1_B: "Snad existuje lék na tohle smrdění"
 third_line_text_set_2_A: "Po dráze letu malý ptáček míří vpřed"
 third_line_text_set_2_B: "Kdes mezi kozím sýrem a tvarohem leží střed"
 fourth_line_text_set_1_A: "Jenže klesat níž je moje potěšení"
 fourth_line_text_set_1_B: "Jen žertuji, vraťme se k pití bez prodlení"
 fourth_line_text_set_2_A: "Je to jediné slovo, jediná odpověď"
 fourth_line_text_set_2_B: "Promiň, už je to absurdní na pohled"
 poetry_line_break: "\n"
 poetry.0002.t: "Báseň!"
 0002.blank_verse_line_1_A: " Král Marsil sídlil v Zaragoze,"
 0002.blank_verse_line_1_B: " Blankandrin byl pohan velmi moudrý,"
 0002.blank_verse_line_1_C: " Karel král, náš pán a svrchovaný vládce,"
 0002.blank_verse_line_1_D: " Veselý a smělý je teď císař,"
 0002.blank_verse_line_2_A: " Odešel pak do chladivého sadu;"
 0002.blank_verse_line_2_B: " Ve vazalské službě byl rytířem statečným,"
 0002.blank_verse_line_2_C: " Již plných sedm let pobývá ve Španělsku,"
 0002.blank_verse_line_2_D: " Cordres drží, hradby leží v troskách,"
 0002.blank_verse_line_3_A: " Tam na trůnu z modrého mramoru usedl,"
 0002.blank_verse_line_3_B: " V udatnosti první stál po boku svého pána."
 0002.blank_verse_line_3_C: " Dobyl tu zemi i západní moře,"
 0002.blank_verse_line_3_D: " Jeho katapulty rozdrtily města i věže."
 0002.blank_verse_line_4_A: " Kolem něj stálo plných dvacet tisíc mužů."
 0002.blank_verse_line_4_B: " A tak pravil: „Nestrachujte se!“"
 0002.blank_verse_line_4_C: " Už proti němu nezůstala jediná pevnost,"
 0002.blank_verse_line_4_D: " Stříbro a zlato a nejeden šat drahokamy zdobený."
 poetry.0003.t: "Báseň o [ROOT.GetCharacter.Custom('theme_announcement')|UD]"
 0003.line_1_A: "[ROOT.GetCharacter.Custom('noun_specific_singular_one')|D] pustoší zemi, až nezbývá nic"
 0003.line_1_B: "[ROOT.GetCharacter.Custom('noun_abstract_plural_one')|D] — věk, který jako by neměl konce"
 0003.line_1_C: "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] — Karel král, náš pán a vládce,"
 0003.line_1_D: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] — veselý a smělý je teď císař,"
 0003.line_2_A: "Krutě jsme podlehli tomu, čemu se říká [ROOT.GetCharacter.Custom('noun_abstract_singular_one')|D]"
 0003.line_2_B: "[ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D] se nám teď zračí v očích"
 0003.line_2_C: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] — již plných sedm let pobývá ve Španělsku,"
 0003.line_2_D: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] — Cordres drží, hradby leží v troskách,"
 0003.line_3_A: "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] — cíl, k němuž možná nedokážu dojít"
 0003.line_3_B: "[ROOT.GetCharacter.Custom('two_syllable_number')|D] let — [ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D], kam oko dohlédne"
 0003.line_3_C: "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] — a země i západní moře jsou dobyty,"
 0003.line_3_D: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] — a katapulty drtí města i věže."
 0003.line_4_A: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] — to mi nikdy nevezmou"
 0003.line_4_B: "[ROOT.GetCharacter.Custom('noun_specific_plural_two')|D] — brzy po nich nezůstane ani vzpomínka"
 0003.line_4_C: "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] — a proti němu už nezůstala jediná pevnost,"
 0003.line_4_D: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] — stříbro, zlato a nejeden drahý šat."
