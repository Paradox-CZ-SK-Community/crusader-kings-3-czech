l_polish:
 first_line_text_set_1_A: "Jsem jemný, křehký květ"
 first_line_text_set_1_B: "Přeji si, abys mě pozval do svého altánu"
 first_line_text_set_2_A: "Jsi mi v tom vedoucí hvězda"
 first_line_text_set_2_B: "Jsem si docela jistý, že nejsem Švýcar"
 second_line_text_set_1_A: "Ty mi prostě připomínáš věž"
 second_line_text_set_1_B: "A mám tolik feudální moci"
 second_line_text_set_2_A: "Opravdu, to je příčina všeho mého štěstí"
 second_line_text_set_2_B: "Všechno se rozpadá v něžném polibku"
 third_line_text_set_1_A: "Možná bych měl věnovat víc času přemýšlení"
 third_line_text_set_1_B: "Možná bych s tou páchnoucí věcí mohl něco udělat"
 third_line_text_set_2_A: "Cestou letu malého ptáčka"
 third_line_text_set_2_B: "Někde mezi kozím sýrem a tvarohem"
 fourth_line_text_set_1_A: "Ale zamiloval jsem se do pocitu propadání"
 fourth_line_text_set_1_B: "Jen žertuji, pojďme víc pít"
 fourth_line_text_set_2_A: "Je to jen jedno slovo"
 fourth_line_text_set_2_B: "Promiň, že jsem byl absurdní"
 poetry_line_break: "\n"
 poetry.0002.t: "Báseň!"
 0002.blank_verse_line_1_A: " Král Marsilies ležel v Sarraguce,"
 0002.blank_verse_line_1_B: " Blancandrins byl velmi moudrý pohan,"
 0002.blank_verse_line_1_C: " Karel král, náš Pán a Vládce,"
 0002.blank_verse_line_1_D: " Veselý a odvážný nyní je onen císař,"
 0002.blank_verse_line_2_A: " Šel svou cestou do chladného sadu;"
 0002.blank_verse_line_2_B: " Ve vazalském postavení byl udatný rytíř,"
 0002.blank_verse_line_2_C: " Celých sedm let pobýval ve Španělsku,"
 0002.blank_verse_line_2_D: " Cordres drží, hradby jsou zbořeny,"
 0002.blank_verse_line_3_A: " Tam seděl na trůnu z modrého mramoru,"
 0002.blank_verse_line_3_B: " První v statečnosti, stál po boku svého pána."
 0002.blank_verse_line_3_C: " Dobyl zemi a získal západní moře,"
 0002.blank_verse_line_3_D: " Jeho katapulty rozbily města a věže."
 0002.blank_verse_line_4_A: " Kolem něj stálo jeho vojsko, plných dvacet tisíc."
 0002.blank_verse_line_4_B: " And thus he spoke: "Neboj se!""
 0002.blank_verse_line_4_C: " Nyní proti němu žádná pevnost nezůstává,"
 0002.blank_verse_line_4_D: " Stříbro a zlato a mnoho oděvů posázených drahokamy."
 poetry.0003.t: "Báseň o [ROOT.GetCharacter.Custom('theme_announcement')|UD]"
 0003.line_1_A: "Země zpustošená krutým [ROOT.GetCharacter.Custom('noun_specific_singular_one')|D]"
 0003.line_1_B: "V dlouhotrvajícím věku [ROOT.GetCharacter.Custom('noun_abstract_plural_one')|D]"
 0003.line_1_C: "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] Karel král, náš Pán a Vládce,"
 0003.line_1_D: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Veselý a odvážný nyní je onen císař,"
 0003.line_2_A: "Všichni jsme podlehli tak krutému [ROOT.GetCharacter.Custom('noun_abstract_singular_one')|D]"
 0003.line_2_B: "Nyní vidíme očima [ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D]"
 0003.line_2_C: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Celých sedm let pobýval ve Španělsku,"
 0003.line_2_D: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Cordres drží, hradby jsou zbořeny,"
 0003.line_3_A: "Kdybych tvého [ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] nedosáhl"
 0003.line_3_B: "Po [ROOT.GetCharacter.Custom('two_syllable_number')|D] letech [ROOT.GetCharacter.Custom('noun_abstract_plural_two')|D]"
 0003.line_3_C: "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] Dobyl zemi a získal západní moře,"
 0003.line_3_D: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Jeho katapulty rozbily města a věže."
 0003.line_4_A: "Nemohou mi nikdy vzít můj [ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D]"
 0003.line_4_B: "Brzy jsou všechny [ROOT.GetCharacter.Custom('noun_specific_plural_two')|D] zapomenuty"
 0003.line_4_C: "[ROOT.GetCharacter.Custom('noun_specific_singular_two')|D] Nyní proti němu žádná pevnost nezůstává,"
 0003.line_4_D: "[ROOT.GetCharacter.Custom('noun_abstract_singular_two')|D] Stříbro a zlato a mnoho oděvů posázených drahokamy."
