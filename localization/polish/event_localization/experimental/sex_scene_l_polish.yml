 sex_scene.0001.t: "Okamžik spolu"
 sex_scene.0001.opening_1: "Objímám [second.GetHerHim] – [scope.GetHerHis] tělo se naléhavě tiskne k mému, [second.GetHerHis] dech těžký u mého ucha."
 sex_scene.0001.opening_2: "Kůže na kůži – mezi našimi těly není žádná překážka, když se k sobě natáhneme."
 sex_scene.0001.opening_3: "[second.GetHerHis|U] oči hoří vášní, když zírají do mých, sjíždějí po mém těle, když mé oblečení padá."
 sex_scene.0001.opening_4: "„Ukaž mi, co cítíš,“ zašeptá [second.GetSheHe], dech těžký, zatímco [second.GetSheHe] rozváže můj [ROOT.GetCharacter.Custom('GetClothingArticle')]."
 sex_scene.0001.opening_5: "Jakmile je hladká kůže osvobozena od látky, vlna náhlé, silné touhy mnou projede."
 sex_scene.0001.opening_6: "[second.GetHerHis|U] ústa, ty měkké rty, ten toužebný jazyk. [second.GetHerHis|U] oči se na mě usmívají."
 sex_scene.0001.opening_7: "Když mám [second.GetHerHim] před sebou, touha je příliš silná na ovládnutí."
 sex_scene.0001.opening_8: "Žádný zvuk ve mně nikdy nevzbudil takovou hříšnou touhu jako slova, která mi nyní [second.GetSheHe] zašeptá do ucha."
 sex_scene.0001.second_1: "Cítím, jak na mé kůži hoří touha po dotyku [second.GetHerHis]."
 sex_scene.0001.second_2: "[second.GetHerHis|U] sténání mého jména brzy zesílí, jak se naše pohyby stanou zběsilejšími."
 sex_scene.0001.second_3: "Mezi vášnivými polibky, těžkým dechem a bušícími srdci není žádná hranice mezi [second.GetHerHis] potěšením a mým."
 sex_scene.0001.second_4: "[second.GetSheHe|U] nežně obtočí ruku kolem mého krku a přitáhne mé rty blíž. Na okamžik se bráním, ale jen na okamžik."
 sex_scene.0001.second_5: "Není tu žádné váhání, žádné zdržení, žádný čas na něžnost. Existuje jen moje touha."
 sex_scene.0001.second_6: "Prsty, které lehce kloužou po těle [second.GetHerHis], přimějí [second.GetHerHim] kroutit se a svíjet se pod mým dotykem, prohýbat se a žádat víc."
 sex_scene.0001.second_7: "Naše pálčivé touhy se spojí a jedním hladkým pohybem se staneme jedním."
 sex_scene.0001.second_8: "[second.GetSheHe|U] se o mě tře, [second.GetHerHis] tělo žadoní po nějakém uvolnění."
 sex_scene.0001.second_9: "[second.GetSheHe|U] vede mou ruku mezi své nohy, aby mi [Select_CString(ROOT.Char.IsFemale,'ukázala','ukázal')], jak [second.Custom('wet_hard')] [second.GetSheHe] je."
 sex_scene.0001.third_1: "Intenzita nás pohlcuje oba, svět se točí na ose soustředěné na tento okamžik."
 sex_scene.0001.third_2: "Vím, že v této chvíli mi [second.GetSheHe] patří — a jen mně..."
 sex_scene.0001.third_3: "Na kůži [second.GetHerHis] se zvedají husí kůže, když nechám své prsty lehce klouzat po [second.GetHerHis] těle. Brzy dotek ztvrdne, stane se pevnějším a hladovějším. Svírající."
 sex_scene.0001.third_4: "Pokračuji dál, přes jakoukoli mez vyčerpání či rozumu; není tu nic než my dva."
 sex_scene.0001.third_5: "Nikdo mě nikdy předtím nenechal se takhle cítit. [second.GetSheHe|U] se na mě usměje. [second.GetSheHe|U] ví."
 sex_scene.0001.third_6: "Myslel jsem, že vím, jak uhasit tento oheň, ale [second.GetSheHe] ho jen rozdmýchává ještě silněji, až je větší, než čemu kdo dokáže odolat."
 sex_scene_ending_location: "[ROOT.Char.Custom2('sex_scene_ending_location' , SCOPE.sC('second') )]"
 sex_scene_ending_random: "[ROOT.Char.Custom2('sex_scene_ending_random' , SCOPE.sC('second') )]"
 sex_scene.0001.last_1: "Poté pohnu rukou v něžném pohlazení po těle [second.GetHerHis]."
 sex_scene.0001.last_2: "Promoklý potem od nás obou, [second.GetSheHe] podlehne a zhroutí se na mě."
 sex_scene.0001.last_3: "Když se konečně rozcházíme, vidím, jak se vzpomínky na potěšení mihnou před očima [second.GetHerHis], zrcadlový obraz mých vlastních."
 sex_scene.0001.last_4: "S jedním posledním, vše pohlcujícím polibkem to končí. Tento okamžik se mi bude vracet v snech po zbytek života."
 sex_scene.0001.last_5: "[second.GetSheHe|U] se při rozchodu zdá téměř stydlivý; je to půvabný kontrast k vášni, kterou jsme právě sdíleli."
 sex_scene.0001.last_6: "Když [second.GetSheHe] odchází, ohlédne se ke mně. [second.GetSheHe|U] kousne [second.GetHerHis] ret v něžném úsměvu."
 sex_scene.0001.a: "Do příště, [second.GetFirstNameNoTooltip]."
 sex_scene.0003.opening_garden_1: "Můj [second.Custom2('RelationToMe', SCOPE.sC('second'))] ke mně přišel, když jsem bloudil zahradami. Vůně [second.GetHerHis] kůže se mísila se sladkostí květin."
 sex_scene.0003.conclusion_garden_1: "[second.GetSheHe|U] mě po sobě zanechal spokojeného a odpočinutého za živým plotem."
 sex_scene.0003.opening_private_chambers_1: "S bušícím srdcem jsem odemkl dveře, abych pustil [second.GetHerHim] do svých soukromých komnat."
 sex_scene.0003.conclusion_private_chambers_1: "O několik hodin později jsme stále sledovali vzory něžnými prsty, psali si zprávy lásky na kůži jeden druhému."
 sex_scene.0003.opening_stables_1: "To by vyvolalo skandál, kdybych byl přistižen se svým [second.Custom2('RelationToMe', SCOPE.sC('second'))], ale ten večer ve stájích nebyl nikdo jiný."
 sex_scene.0003.conclusion_stables_1: "Snad naše vzdechy vášně přehlušil dupot a řehtání koní."
 sex_scene.0003.opening_copse_1: "Setkal jsem se se svým [second.Custom2('RelationToMe', SCOPE.sC('second'))] v hájku nedaleko [second.Custom('ResidenceBuilding')]. Srdce mi bušilo, i když jsem věděl, že nás tam nikdo neuvidí..."
 sex_scene.0003.conclusion_copse_1: "Ještě chvíli poté, co [second.GetSheHe] odešel, tráva, v níž jsem ležel, si uchovala [second.GetHerHis] teplo."
 sex_scene.0003.opening_kitchen_1: "Služebník mohl kdykoli vejít do kuchyně! Skoro jsem protestoval, když mě [second.GetSheHe] přitáhl k pultu a trhal za můj [second.Custom('GetClothingArticle')]. Ale jen skoro."
 sex_scene.0003.conclusion_kitchen_2: "O hodiny později jsem stále cítil lepkavost krému, který mi [second.GetSheHe] nalil přes hruď."
 sex_scene.0003.conclusion_kitchen_3: "Byl to takový výbuch vzrušení, i když krátký. Možná ale vynechám zítřejší guláš."
