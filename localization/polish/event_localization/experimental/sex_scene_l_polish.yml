 sex_scene.0001.t: "Chvíle ve dvou"
 sex_scene.0001.opening_1: "Objímám [Select_CString(second.IsFemale,'ji','ho')] – [Select_CString(second.IsFemale,'její','jeho')] dychtivé tělo se tiskne k mému a těžký dech mi zní v uchu."
 sex_scene.0001.opening_2: "Kůže na kůži – mezi našimi těly už nestojí žádná překážka, když po sobě vztahujeme ruce."
 sex_scene.0001.opening_3: "[Select_CString(second.IsFemale,'Její','Jeho')] oči planou touhou, když se vpíjejí do mých a potom kloužou po mém těle, zatímco ze mě padá oděv."
 sex_scene.0001.opening_4: "„Ukaž mi, co cítíš,“ zašeptá mezi těžkými nádechy a pod [Select_CString(second.IsFemale,'jejími','jeho')] prsty mi z těla mizí [ROOT.GetCharacter.Custom('GetClothingArticle')]."
 sex_scene.0001.opening_5: "Jakmile látka odhalí hladkou kůži, zaplaví mě náhlá a prudká vlna touhy."
 sex_scene.0001.opening_6: "[Select_CString(second.IsFemale,'Její','Jeho')] ústa, ty měkké rty, ten pátravý jazyk. [Select_CString(second.IsFemale,'Její','Jeho')] oči se na mě usmívají."
 sex_scene.0001.opening_7: "Když [Select_CString(second.IsFemale,'ji','ho')] vidím před sebou, touha už nejde ovládnout."
 sex_scene.0001.opening_8: "Žádný zvuk ve mně ještě neprobudil takovou touhu jako slova, která mi teď šeptá do ucha."
 sex_scene.0001.second_1: "Cítím, jak mi kůže hoří touhou po [Select_CString(second.IsFemale,'jejím','jeho')] doteku."
 sex_scene.0001.second_2: "[Select_CString(second.IsFemale,'Její','Jeho')] sténání mého jména brzy sílí, stejně jako naše pohyby nabývají na divokosti."
 sex_scene.0001.second_3: "Mezi vášnivými polibky, zrychleným dechem a bušícími srdci mizí hranice mezi [Select_CString(second.IsFemale,'její','jeho')] rozkoší a mou."
 sex_scene.0001.second_4: "Jemná ruka mi obepne šíji a přitáhne mé rty blíž. Na okamžik vzdoruji, ale jen na okamžik."
 sex_scene.0001.second_5: "Není čas na váhání, otálení ani něhu. Zbývá jen má touha."
 sex_scene.0001.second_6: "Lehce přejíždím prsty po [Select_CString(second.IsFemale,'jejím','jeho')] těle a pod mými doteky se kroutí a svíjí, prohýbá se vstříc dalším."
 sex_scene.0001.second_7: "Naše spalující touhy se střetnou a jediným plynulým pohybem splyneme v jedno."
 sex_scene.0001.second_8: "Tiskne se ke mně a [Select_CString(second.IsFemale,'její','jeho')] tělo žadoní o vysvobození."
 sex_scene.0001.second_9: "Vede mou ruku dolů mezi své nohy, aby mi [Select_CString(second.IsFemale,'ukázala','ukázal')], jak [second.Custom('wet_hard')] už je."
 sex_scene.0001.third_1: "Ta intenzita nás oba pohltí a celý svět se otáčí kolem jediné osy – tohoto okamžiku."
 sex_scene.0001.third_2: "Vím, že v této chvíli mi patří. Jen mně..."
 sex_scene.0001.third_3: "Na [Select_CString(second.IsFemale,'její','jeho')] kůži naskakuje husí kůže, když prsty lehce přejíždím po [Select_CString(second.IsFemale,'jejím','jeho')] těle. Dotek brzy zesílí, je hladovější a dychtivější. Svěrám pevněji."
 sex_scene.0001.third_4: "Pokračuji dál, za hranicí únavy i rozumu. Neexistuje nic než my dva."
 sex_scene.0001.third_5: "Nikdo ve mně ještě nikdy nevyvolal takové pocity. Usměje se na mě. Ví to."
 sex_scene.0001.third_6: "Zdálo se mi, že vím, jak ten oheň uhasit, ale jen ho dál rozdmychává, až se rozhoří silou, které už nikdo nedokáže vzdorovat."
 sex_scene_ending_location: "[ROOT.Char.Custom2('sex_scene_ending_location' , SCOPE.sC('second') )]"
 sex_scene_ending_random: "[ROOT.Char.Custom2('sex_scene_ending_random' , SCOPE.sC('second') )]"
 sex_scene.0001.last_1: "Potom dlaní něžně hladím [Select_CString(second.IsFemale,'její','jeho')] tělo."
 sex_scene.0001.last_2: "Nakonec povolí a zhroutí se na mě; pot z nás jen lije."
 sex_scene.0001.last_3: "Když se konečně rozcházíme, vidím v [Select_CString(second.IsFemale,'jejích','jeho')] očích záblesky vzpomínek na prožitou rozkoš, které dokonale zrcadlí ty mé."
 sex_scene.0001.last_4: "Posledním vše pohlcujícím polibkem je konec. Tahle chvíle se mi bude vracet ve snech až do konce života."
 sex_scene.0001.last_5: "Když se loučíme, působí téměř nesměle. Okouzlující kontrast k vášni, kterou jsme právě sdíleli."
 sex_scene.0001.last_6: "Když odchází, ještě se po mně ohlédne a s něžným úsměvem se kousne do rtu."
 sex_scene.0001.a: "Do příště, [second.GetFirstNameNoTooltip]."
 sex_scene.0003.opening_garden_1: "Při toulce zahradami za mnou přijde [second.Custom2('RelationToMe', SCOPE.sC('second'))]. Vůně [Select_CString(second.IsFemale,'její','jeho')] pokožky se mísí se sladkou vůní květin."
 sex_scene.0003.conclusion_garden_1: "Odchází a já zůstávám za živým plotem [Select_CString(ROOT.Char.IsFemale,'spokojená a blaženě uvolněná','spokojený a blaženě uvolněný')]."
 sex_scene.0003.opening_private_chambers_1: "S bušícím srdcem odemykám dveře a pouštím [Select_CString(second.IsFemale,'ji','ho')] do svých soukromých komnat."
 sex_scene.0003.conclusion_private_chambers_1: "O několik hodin později stále konečky prstů kreslíme obrazce a píšeme si navzájem milostná poselství na kůži."
 sex_scene.0003.opening_stables_1: "Jaký skandál by vypukl, kdyby se rozkřiklo, že [second.Custom2('RelationToMe', SCOPE.sC('second'))] a já jsme si dali dostaveníčko ve stáji! Ten večer tam ale nikdo jiný nebyl."
 sex_scene.0003.conclusion_stables_1: "Jen doufám, že naše vášnivé sténání přehlušilo podupávání a řehtání koní."
 sex_scene.0003.opening_copse_1: "V hájku na mě čeká [second.Custom2('RelationToMe', SCOPE.sC('second'))]. [second.Custom('ResidenceBuilding')] není daleko. Srdce mi buší, přestože vím, že nás tam nikdo neuvidí..."
 sex_scene.0003.conclusion_copse_1: "Ještě chvíli po [Select_CString(second.IsFemale,'jejím','jeho')] odchodu si tráva, ve které ležím, uchovává [Select_CString(second.IsFemale,'její','jeho')] teplo."
 sex_scene.0003.opening_kitchen_1: "Do kuchyně může kdykoli vejít sluha! Málem protestuji, když mě přitáhne k pracovnímu stolu a pod [Select_CString(second.IsFemale,'jejími','jeho')] prsty mi z těla mizí [second.Custom('GetClothingArticle')]. Ale jen málem."
 sex_scene.0003.conclusion_kitchen_2: "O několik hodin později na hrudi stále cítím lepkavou smetanu, kterou na mě [Select_CString(second.IsFemale,'nalila','nalil')]."
 sex_scene.0003.conclusion_kitchen_3: "Byl to neuvěřitelný příval vzrušení, jakkoli krátký. Zítřejší dušené maso si ale možná raději odpustím."
