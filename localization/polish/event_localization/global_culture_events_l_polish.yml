l_polish:
 global_culture.custom.change_culture: "Všechna hrabství a všechny postavy [old_culture.GetName] kultury ve tvém panství přijmou [new_culture.GetName] kulturu"
 global_culture.custom.merge_culture: "Všechna hrabství a všechny postavy [old_culture_1.GetName] kultury a [old_culture_2.GetName] kultury ve tvém panství přijmou [new_culture.GetName] kulturu"
 global_culture.custom.keep_culture: "Hrabství a postavy [old_culture.GetName] kultury ve tvém panství si svou kulturu ponechají."
 global_culture.custom.trigger: "Neovládáš alespoň 80 % všech hrabství [CHARACTER.GetCulture.GetName] kultury"
 global_culture.0002.t: "Osud Vizigótů"
 global_culture.0002.desc: "Kdysi dávno naši předkové doputovali na Pyrenejský poloostrov a založili zde své první osady. Od té doby tu žijeme po celé generace a tato země utvářela nás stejně jako my ji.\n\nNastal čas položit si otázku, zda jsme stále Vizigóti, nebo už jsme se stali něčím docela novým."
 global_culture.0002.a: "Časy se mění a my se musíme měnit s nimi."
 global_culture.0002.b: "Tradice svých předků neopustíme!"
 global_culture.0005.t: "$global_culture.0002.t$"
 global_culture.0005.desc: "Když Vizigóti poprvé přišli na Pyrenejský poloostrov, byli cizinci v nové a neznámé zemi.\n\nBěhem mnoha generací se to však změnilo. Země utvářela je stejně jako oni ji a jednotlivá vizigótská společenství se od sebe postupně začala vzdalovat.\n\nNakonec z nich vznikly [castilian.GetName] kultura, [catalan.GetName] kultura, [occitan.GetName] kultura a [andalusian.GetName] kultura. Přes společný původ už se jejich příslušníci navzájem nepovažují za příbuzné."
 global_culture.0005.a: "Teprve čas ukáže, co to pro tuto oblast přinese."
 global_culture.0012.t: "Osud Seveřanů"
 global_culture.0012.desc: "Život v drsných zemích Skandinávie naučil náš lid zajišťovat si blahobyt a přežití obchodem, pleněním i službou s mečem v ruce za cizí žold.\n\nPostupem času jsme tak nashromáždili značné bohatství a stále více našich lidí začalo zapouštět kořeny a usazovat se v trvalých usedlostech.\n\nJednotlivé osady se však nyní začínají kulturně rozcházet. Jejich tradice, a dokonce i jazyky se proměňují podle potřeb nového způsobu života."
 global_culture.0012.a: "Především musíme zajistit vlastní blahobyt."
 global_culture.0012.b: "Nepřijatelné! Seveřané #EMP zůstanou#! jednotní."
 global_culture.0015.t: "$global_culture.0012.t$"
 global_culture.0015.desc: "Obchodníci, nájezdníci a žoldnéři... Seveřané po dlouhá léta vyráželi ze Skandinávie do celé Evropy i daleko za její hranice a všude po sobě zanechávali svou stopu.\n\nNyní se však zdá, že se tato éra chýlí ke konci. Kulturní rozdíly a soupeření mezi rody vedly ke vzniku nových identit a z nich se rodí [danish.GetName] kultura, [swedish.GetName] kultura a [norwegian.GetName] kultura."
 global_culture.0015.desc_norse: "Obchodníci, nájezdníci a žoldnéři... Naši severští předkové po dlouhá léta vyráželi ze Skandinávie do celé Evropy i daleko za její hranice a všude po sobě zanechávali svou stopu.\n\nNyní se však zdá, že se tato éra chýlí ke konci. Kulturní rozdíly a soupeření mezi rody tříští naši domovinu a rodí se z nich [danish.GetName] kultura, [swedish.GetName] kultura a [norwegian.GetName] kultura."
 global_culture.0015.a: "Co to bude znamenat pro budoucnost Evropy?"
 global_culture.0015.b: "Co to bude znamenat pro budoucnost našeho lidu?"
 global_culture.0032.t: "Vzestup Skotů"
 global_culture.0032.desc: "S ostatními Anglosasy sice sdílíme společný původ, ale naše rody žijící v nížinách severní Británie se jim kulturně i jazykově stále více vzdalují, jak se přizpůsobujeme životu v této drsné krajině.\n\nMnozí z našeho lidu nyní volají po vlastní kulturní identitě. Po něčem, co můžeme nazývat svým a na co můžeme být hrdí..."
 global_culture.0032.a: "Jsme Skotové, nyní a navždy!"
 global_culture.0032.b: "Ke svým krajanům se zády neobrátíme."
 global_culture.0035.t: "$global_culture.0032.t$"
 global_culture.0035.desc: "Rody žijící v nížinách severní Británie sice sdílejí společný původ s ostatními Anglosasy, ale život v drsné krajině je postupně změnil.\n\nKulturně i jazykově se rozešli se svými někdejšími krajany a s nadšením přijali novou identitu, kterou vyjadřuje [scottish.GetName] kultura."
 global_culture.0035.a: "Dokážou sami prosperovat?"
 global_culture.3002.t: "Vzestup Normanů"
 global_culture.3002.desc: "Země severní Francie poskytly našemu lidu úrodnou a bohatou půdu, na níž se můžeme usadit a dále růst.\n\nPřevezmeme-li některé zvyky místních obyvatel, dokážeme se tomuto kraji lépe přizpůsobit."
 global_culture.3002.a: "Na nové přátele a nové začátky!"
 global_culture.3003.t: "$global_culture.3002.t$"
 global_culture.3003.desc: "Jsme daleko od zemí, které naši severští předkové nazývali domovem. Naší vlastí jsou nyní země severní Francie. Jako vůdce svého lidu musím zajistit jeho budoucí blahobyt, a máme-li zde vzkvétat, musíme se novému prostředí přizpůsobit. Musíme se učit od lidí, jejichž předkové tuto úrodnou půdu obdělávali dávno před námi.\n\nTímto výnosem měníme svůj způsob života ku prospěchu celého našeho lidu. Od této chvíle budeme kráčet vlastní cestou."
 global_culture.3003.a: "Od tohoto dne jsme Normané!"
 global_culture.3005.t: "$global_culture.3002.t$"
 global_culture.3005.desc: "Skupina severských osadníků ze Skandinávie se usadila na pobřeží severní Francie a nalezla zde nový domov.\n\nJejich vůdce [norman_founder.GetTitledFirstName] [Select_CString(norman_founder.IsFemale, 'vydala', 'vydal')] výnos, podle něhož mají osadníci přijmout některé místní zvyky a tradice, aby se jim v nové zemi dobře dařilo."
 global_culture.3005.a: "Co to bude znamenat pro tuto oblast?"
 global_culture.3011.t: "[sicilian.GetNameNoTooltip] kultura se šíří"
 global_culture.3011.desc: "Pestrá směs národů jižní Itálie a Sicílie dala vzniknout jedinečné kultuře utvářené nesčetnými vlivy.\n\nNyní je zřejmé, že obyvatelé [county_to_change.GetName] už sami sebe nepovažují za příslušníky [old_culture.GetName] kultury. Místní nyní považují [sicilian.GetName] kulturu za svou!"
 global_culture.3011.a: "Zajímavý vývoj..."
 global_culture.3012.a: "Skvělé!"
 global_culture.4011.t: "[goryeo.GetNameNoTooltip] kultura se šíří"
 global_culture.4011.desc: "Po sjednocení tří království začaly jejich národy sdílet širší společnou identitu a z nesčetných vlivů tak vznikla jedinečná kultura.\n\nNyní je zřejmé, že obyvatelé [county_to_change.GetName] už sami sebe nepovažují za příslušníky [old_culture.GetName] kultury. Místní nyní považují [goryeo.GetName] kulturu za svou!"
 