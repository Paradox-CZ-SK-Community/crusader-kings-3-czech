l_polish:
 clan.1001.t: "Přislíbené dítě"
 clan.1001.desc: "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází. [vassal_child.GetTitledFirstName], [Select_CString(vassal.IsFemale,'její dítě','jeho dítě')], kráčí po [Select_CString(vassal.IsFemale,'jejím','jeho')] boku.\n\n„Je ostuda, že mezi námi není žádná aliance, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ať se [child.GetTitledFirstName] a [vassal_child.GetTitledFirstName] vezmou a napravme tím naše vztahy!“"
 clan.1001.a: "Máš pravdu – vezmou se!"
 clan.1001.b: "K tomu nedojde."
 clan.1002.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip], co to má znamenat?!“\n\n[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vtrhne do místnosti. [vassal_child.GetTitledFirstName], [Select_CString(vassal.IsFemale,'její dítě','jeho dítě')], kráčí hned za [Select_CString(vassal.IsFemale,'ní','ním')].\n\n„Proč jsi [Select_CString(ROOT.Char.IsFemale,'zrušila','zrušil')] jejich zasnoubení?“"
 clan.1002.a: "Byla to chyba, přísahám!"
 clan.1002.b: "Do toho ti nic není."
 clan.1011.t: "Bez aliance"
 clan.1011.desc_opening: "„[allied_vassal.Custom2('YourCharacterIntroduction', ROOT.Char)|U] se těší až přílišné přízni, [ROOT.Char.Custom('FormOfAddressForLiege')]. Tvého nepotismu si nelze nevšimnout.“\n\n[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě [Select_CString(vassal.IsFemale,'vyhledala','vyhledal')], aby napravil to, co považuje za urážku – skutečnost, že spolu nemáme alianci.\n\n„Nějaký ústupek z tvé strany by mě uklidnil. Řekněme..."
 clan.1011.desc_army: "kdyby mě několik let [Select_CString(councillor.IsFemale,'učila','učil')] [councillor.GetCouncilTitle] [councillor.GetTitledFirstName]!“"
 clan.1011.desc_prestige: "kdybys o mně na správných místech [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')] pár dobrých slov.“"
 clan.1011.desc_diplomacy: "kdybys mě [Select_CString(ROOT.Char.IsFemale,'zasvětila','zasvětil')] do umění diplomacie.“"
 clan.1011.desc_prowess: "kdybys mě [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] bojovat!“"
 clan.1011.desc_fallback: "nějaké zlato.“"
 clan.1011.army: "[councillor.GetCouncilTitle] [councillor.GetFirstNameNoTooltip] tě bude učit."
 clan.1011.tt: "#F Ber, nebo nech být#!"
 clan.1011.prestige: "Zmíním se o tobě v dobrém."
 clan.1011.diplomacy: "Tak si pořádně nabrus jazyk!"
 clan.1011.prowess: "Tak se utkáme. Něco tě naučím."
 clan.1011.fallback: "Vezmi si to a dej mi pokoj."
 clan.1011.b: "Nic takového nedostaneš."
 clan.1101.t: "Rovnováha moci"
 clan.1101.desc: "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou [Select_CString(vassal.IsFemale,'přišla','přišel')] se stížností. „[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] je prakticky v rukou členů tvé rodiny. Ať se snažím sebevíc, nikdy se jim ani nepřiblížím!\n\nNaléhavě tě žádám, naprav tuto nespravedlnost. Vždyť i pouhé zdání nepotismu může mezi tvými vazaly zasít zášť...“"
 clan.1101.a: "Slyším tvé obavy a vezmu je v úvahu."
 clan.1101.a.flavor: "Vykroutíš se z jakéhokoli skutečného řešení, a přesto [vassal.GetFirstNameNoTooltip] uklidníš"
 clan.1101.b: "Máš pravdu. Okamžitě podniknu kroky k nápravě!"
 clan.1101.b.custom: "Každý člen [Concept('dynasty','dynastie')|E], který je [Concept('vassal','vazalem')|E]"
 clan.1101.b.tt: "Získá [Concept('revoke_title_reason','důvod k odebrání titulu')|E]"
 clan.1101.c: "Ale já ti ukážu, co teprve vzbudí zášť..."
 clan.1101.d: "Není moje chyba, že ses [Select_CString(vassal.IsFemale,'nenarodila','nenarodil')] do mé rodiny!"
 clan.1101.d.custom: "Každý [Concept('vassal','vazal')|E], který není členem [Concept('dynasty','dynastie')|E]"
 clan.1201.t: "Bez zastoupení"
 clan.1201.desc: "[target_title.GetNameNoTier] je domovem [Select_CString(petitioner.IsFemale,'ženy','muže')], [Select_CString(petitioner.IsFemale,'která','který')] za mnou přichází žádat o větší zastoupení svého lidu v mé vládě. [culture.GetNameNoTooltip] kultura totiž v mé správě nemá jediného zástupce.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jsme tví věrní poddaní, a přesto nemáme žádné slovo v tom, jak jsou naše společenství spravována. Je snad příliš žádat, aby v tvé správě dostal místo někdo z našich lidí?“"
 clan.1201.a: "Dobrá. Od této chvíle bude [target_title.GetNameNoTierNoTooltip] pod tvou správou!"
 clan.1201.b: "[Select_CString(ROOT.Char.IsFemale,'Mohla bych trochu povolit otěže','Mohl bych trochu povolit otěže')] výměnou za tvé služby..."
 clan.1201.c: "Ani náhodou."
