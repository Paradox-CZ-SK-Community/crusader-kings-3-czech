l_polish:
 tribal.1001.t: "[Select_CString(challenger.Char.IsFemale,'Vyzyvatelka','Vyzyvatel')]"
 tribal.1001.desc_old: "„[Select_CString(ROOT.Char.IsFemale,'Zestárla a zeslábla','Zestárl a zeslábl')] jsi, [ROOT.Char.GetTitledFirstNameNoTooltip];"
 tribal.1001.desc_weak: "„Jsi #EMP [Select_CString(ROOT.Char.IsFemale,'slabá','slabý')]#!, [ROOT.Char.GetTitledFirstNameNoTooltip];"
 tribal.1001.desc_meak: "„Jsi bezpáteřní jako úhoř, [ROOT.Char.GetTitledFirstNameNoTooltip];"
 tribal.1001.desc_fallback: "„Nehodíš se k vládnutí, [ROOT.Char.GetTitledFirstNameNoTooltip];"
 tribal.1001.desc: "nastal čas, abys [Select_CString(ROOT.Char.IsFemale,'odstoupila','odstoupil')]!“\n\n[challenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přede mě předstoupí před zraky celého kmene a hlasitě mě vyzve, aby to všichni slyšeli.\n\n„Od dnešního dne budu vládnout [ROOT.Char.GetPrimaryTitle.GetName].“"
 tribal.1001.a_child: "Tak svá slova podpoř ocelí, [Select_CString(challenger.IsFemale,'děvče','chlapče')]!"
 tribal.1001.a: "Tak svá slova podpoř ocelí!"
 tribal.1001.a_champion: "[liege_champion.GetTitledFirstName] bude bojovat za mě\n"
 tribal.1001.a_success: "Vyhraješ souboj"
 tribal.1001.a_failure: "Prohraješ souboj"
 tribal.1001.a_champion_success: "[liege_champion.GetFirstNameNoTooltip] vyhraje souboj"
 tribal.1001.a_champion_failure: "[liege_champion.GetFirstNameNoTooltip] prohraje souboj"
 tribal.1001.b: "Jedině když mě porazíš v souboji urážek!"
 tribal.1001.b_success: "Tvé urážky jsou lepší"
 tribal.1001.b_failure: "[challenger.GetFirstNameNoTooltip] tě překoná"
 tribal.1001.c: "Kvůli tomu s tebou bojovat nebudu..."
 tribal.1002.desc: "„[Select_CString(liege_to_challenge.IsFemale,'Bála jsem se','Bál jsem se')], že tenhle den přijde. Jsi [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))], ale kvůli tomu s tebou bojovat nemohu.“\n\n[liege_to_challenge.GetFirstName] mi bez odporu přenechá vládu a po krátké chvíli zmateného ticha začne kmen oslavovat mé vítězství."
 tribal.1002.a: "Já... ehm... děkuji."
 tribal.1003.desc_opening: "„Takže zpochybňuješ mé právo vládnout?!“"
 tribal.1003.desc_old: "„Raději svá slova podpoř ocelí, [Select_CString(challenger.IsFemale,'děvče','chlapče')]!“"
 tribal.1003.desc_young: "„Raději svá slova podpoř ocelí!“"
 tribal.1003.desc: "\n\n[liege_to_challenge.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [liege_to_challenge.Custom('SignatureWeaponActionThirdPerson')] svou zbraň – [liege_to_challenge.Custom('signature_weapon')] – a udělá krok ke mně. Celý kmen se kolem nás shlukne, vzduch houstne vzrušením a strachem, zatímco zaujímám bojový postoj a..."
 tribal.1003.desc_liege_champion: "\n\n[liege_to_challenge.GetTitledFirstName], [Select_CString(liege_to_challenge.IsFemale,'která je pro mě','který je pro mě')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('liege_to_challenge'))], proti mně posílá [Select_CString(liege_champion.IsFemale,'svou vybranou šampionku','svého vybraného šampiona')], [liege_champion.GetTitledFirstName]. [liege_champion.GetTitledFirstNameNoTooltip] [liege_champion.Custom('SignatureWeaponActionThirdPerson')] svou zbraň – [liege_champion.Custom('signature_weapon')] – a udělá krok ke mně. Celý kmen se kolem nás shlukne, vzduch houstne vzrušením a strachem, zatímco zaujímám bojový postoj a..."
 tribal.1003.a: "...pozvednu svou zbraň – [ROOT.Char.Custom('signature_weapon')]."
 tribal.1003.b: "...zvednu ruce a rozpačitě se zasměji."
 tribal.1004.desc_opening: "[challenger.GetFirstName], [Select_CString(challenger.IsFemale,'která je pro mě','který je pro mě')] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))], [challenger.Custom('SignatureWeaponActionThirdPerson')] svou zbraň – [challenger.Custom('signature_weapon')] – a udělá krok ke mně. Celý kmen se kolem nás shromáždil a vzduch houstne vzrušením a strachem.\n\n"
 tribal.1004.desc: "Pozvednu svou zbraň – [ROOT.Char.Custom('signature_weapon')] – a zaútočím. #EMP Úskok, výpad, klamný útok— Uf!#! Pak přichází [challenger.Custom('SignatureWeaponActionReaction')]. [challenger.GetFirstNameNoTooltip] [challenger.Custom('SignatureWeaponCriticalPresent')] trupu a když zavrávorám, dochází mi, že je konec. Kmen už nefandí mně."
 tribal.1004.a: "Proklínám tě!"
 tribal.1005.desc: "Pozvednu svou zbraň – [ROOT.Char.Custom('signature_weapon')] – a zaútočím.\n\n#EMP Úskok, výpad, klamný útok...#! Pak přichází [ROOT.Char.Custom('SignatureWeaponActionReaction')]. Podaří se mi [ROOT.Char.Custom('SignatureWeaponCritical')] trupu [Select_CString(challenger.IsFemale,'vyzyvatelky','vyzyvatele')] a když [challenger.GetFirstNameNoTooltip] zavrávorá, vím, že je rozhodnuto."
 tribal.1005.a: "Doufám, že sis vzal[Select_CString(challenger.IsFemale,'a','')] ponaučení!"
 tribal.1014.desc_opening: "[challenger.GetFirstName], [Select_CString(challenger.IsFemale,'která je pro mě','který je pro mě')] [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))], [challenger.Custom('SignatureWeaponActionThirdPerson')] svou zbraň – [challenger.Custom('signature_weapon')] – a udělá krok k [liege_champion.GetTitledFirstName]. Celý kmen se kolem nás shromáždil a vzduch houstne vzrušením a strachem.\n\n"
 tribal.1014.desc: "[liege_champion.GetTitledFirstName] [liege_champion.Custom('SignatureWeaponActionThirdPerson')] svou zbraň – [liege_champion.Custom('signature_weapon')] – a zaútočí. #EMP Úskok, výpad, klamný útok— Uf!#! Pak přichází [challenger.Custom('SignatureWeaponActionReaction')]. [challenger.GetFirstNameNoTooltip] [challenger.Custom('SignatureWeaponCriticalPresent')] trupu [Select_CString(liege_champion.IsFemale,'šampionky','šampiona')] a když [liege_champion.GetFirstNameNoTooltip] zavrávorá, dochází mi, že je konec. Kmen už nefandí mně."
 tribal.1014.a: "Proklínám tě!"
 tribal.1015.desc: "[liege_champion.GetTitledFirstName] [liege_champion.Custom('SignatureWeaponActionThirdPerson')] svou zbraň – [liege_champion.Custom('signature_weapon')] – a zaútočí.\n\n#EMP Úskok, výpad, klamný útok...#! Pak přichází [liege_champion.Custom('SignatureWeaponActionReaction')]. [liege_champion.GetFirstNameNoTooltip] [liege_champion.Custom('SignatureWeaponCriticalPresent')] trupu [Select_CString(challenger.IsFemale,'vyzyvatelky','vyzyvatele')] a když [challenger.GetFirstNameNoTooltip] zavrávorá, vím, že je rozhodnuto."
 tribal.1015.a: "Doufám, že sis vzal[Select_CString(challenger.IsFemale,'a','')] ponaučení!"
 tribal.1006.desc_old: "„Raději dokaž, že na svůj nárok máš, [Select_CString(challenger.IsFemale,'děvče','chlapče')]!“"
 tribal.1006.desc_young: "„Raději dokaž, že na svůj nárok máš!“"
 tribal.1006.desc: "Jakmile [liege_to_challenge.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vyhlásí souboj urážek, celý kmen se semkne kolem nás, aby klání sledoval.\n\nNastane ticho. [liege_to_challenge.GetFirstNameNoTooltip] předstoupí a odkašle si.\n"
 tribal.1006.a: "Tomuhle říkáš urážka? Tak se dívej!"
 tribal.1006.a_success: "Vyhraješ souboj urážek"
 tribal.1006.a_failure: "Prohraješ souboj urážek"
 tribal.1006.b: "Tohle... Tohle byla chyba."
 tribal.1007.desc_ending: "\n\nNásledující řev je ohlušující a já vím, že jsem [Select_CString(ROOT.Char.IsFemale,'prohrála','prohrál')]."
 tribal.1007.a: "Proklínám tě!"
 tribal.1008.desc: "Kmen se shromáždil, aby sledoval souboj urážek, v němž proti mně stojí [challenger.GetFirstName] – [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))]. Davem zní vzrušený šepot, když [challenger.GetFirstNameNoTooltip] předstoupí a odkašle si.\n"
 tribal.1008.desc_ending: "\n\nNásleduje šokované a trapné ticho."
 tribal.1008.a: "Tomuhle říkáš urážka? Kliď se mi z očí."
 tribal.1010.desc: "Celý kmen se shromáždil, aby sledoval souboj, v němž proti mně stojí [challenger.GetFirstName] – [liege_to_challenge.Custom2('RelationToMeShort', SCOPE.sC('challenger'))]. Jakmile však dorazí, začne se vymlouvat.\n\n„To... To všechno byla chyba. Nikdy bych si netroufl[Select_CString(challenger.IsFemale,'a','')] tě vyzvat. Odpusť mi.“"
 tribal.1010.a: "Zbabělče."
 tribal.1022.trigger_failure.challenger: "Můj [Concept('single_combat_duel','souboj')|E] proti [liege_to_challenge.GetFirstNameNoTooltip] byl zneplatněn"
 tribal.1022.trigger_failure.liege_to_challenge: "Můj [Concept('single_combat_duel','souboj')|E] proti [challenger.GetFirstNameNoTooltip] byl zneplatněn"
 tribal.1101.t: "Holmgang"
 tribal.1101.desc: "Když vstoupím do síně, můj sok [rival.GetTitledFirstName] ke mně vzhlédne. U [Select_CString(rival.IsFemale,'jejích','jeho')] nohou leží [victim.GetTitledFirstName] – vždyť jde o #EMP [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))]#! – celý od krve.\n\n„Á, [ROOT.Char.GetFirstNameNoTooltip]. Zrovna jsem ti tu nechával[Select_CString(rival.IsFemale,'a','')] vzkaz!“\n\n[victim.GetFirstNameNoTooltip] je stále naživu, alespoň soudě podle bolestného sténání. Kdo však ví, kam až by [rival.GetFirstNameNoTooltip] [Select_CString(rival.IsFemale,'zašla','zašel')], kdybych [Select_CString(ROOT.Char.IsFemale,'nezasáhla','nezasáhl')]?"
 tribal.1101.a: "Ty odporný [rival.Custom2('InsultNoun', ROOT.Char)]! Vyzývám tě k holmgang!"
 tribal.1101.a_success: "Vyhraješ"
 tribal.1101.a_failure: "[rival.GetFirstNameNoTooltip] vyhraje"
 tribal.1101.b: "V holmgang se utkáš s [friend.GetFirstNameNoTooltip]!"
 tribal.1101.b_success: "[friend.GetFirstNameNoTooltip] vyhraje"
 tribal.1101.b_failure: "[rival.GetFirstNameNoTooltip] vyhraje"
 tribal.1101.c: "Prostě... nechme minulost minulostí, ano?"
 tribal.1102.desc_opening: "Kolem nás se tísní dav, aby spatřil holmgang mezi mnou a [rival.GetTitledFirstName]. Ze všech stran se valí změť hlasů a zdvižených pěstí.\n\nPevně sevřu zbraň – [ROOT.Char.Custom('signature_weapon')] – a vyrazím vpřed. Vzápětí nás pohltí vír oceli a krve.\n\n"
 tribal.1102.desc: "Ale tam! Mezírka v obraně [rival.GetTitledFirstNameNoTooltip]. [ROOT.Char.Custom('SignatureWeaponAction')] zbraň – [ROOT.Char.Custom('signature_weapon')] –, zatnu zuby a s [ROOT.Char.Custom('SignatureWeaponActionReaction')] se mi podaří [ROOT.Char.Custom('SignatureWeaponCritical')] [Select_CString(rival.IsFemale,'její','jeho')] hrudi. [rival.GetFirstNameNoTooltip] je [Select_CString(rival.IsFemale,'mrtvá','mrtvý')] ještě dřív, než dopadne na zem."
 tribal.1102.a: "Tohle čeká každého, kdo mě vyzve!"
 tribal.1103.desc_opening: "Dav se shromáždil, aby spatřil holmgang mezi [rival.GetTitledFirstName] a [friend.GetTitledFirstName]. Uprostřed záplavy hlasů a zdvižených pěstí řvu ze všech nejhlasitěji.\n\n[friend.GetTitledFirstNameNoTooltip] pevně sevře zbraň – [friend.Custom('signature_weapon')] – a vyrazí vpřed. Vzápětí je oba pohltí vír oceli a krve.\n\n"
 tribal.1103.desc: "Náhle [friend.GetFirstNameNoTooltip] [friend.Custom('SignatureWeaponActionThirdPerson')] svou zbraň – [friend.Custom('signature_weapon')] – a s [friend.Custom('SignatureWeaponActionReaction')] [friend.Custom('SignatureWeaponCriticalPresent')] [Select_CString(rival.IsFemale,'její','jeho')] hrudi. [rival.GetFirstNameNoTooltip] je [Select_CString(rival.IsFemale,'mrtvá','mrtvý')] ještě dřív, než dopadne na zem."
 tribal.1104.desc: "Náhle [rival.GetTitledFirstNameNoTooltip] [rival.Custom('SignatureWeaponActionThirdPerson')] svou zbraň – [rival.Custom('signature_weapon')] – a než stačím útok odrazit, [rival.Custom('SignatureWeaponCriticalPresent')] mé ramenní kosti. Ta bolest... Musel[Select_CString(ROOT.Char.IsFemale,'a','')] jsem ztratit vědomí, protože vzápětí nade mnou [rival.GetFirstNameNoTooltip] stojí.\n\n„Vzdej se.“"
 tribal.1104.a: "Já... vzdávám se."
 tribal.1105.desc: "Náhle [rival.GetTitledFirstNameNoTooltip] [rival.Custom('SignatureWeaponActionThirdPerson')] svou zbraň – [rival.Custom('signature_weapon')] – a než [friend.GetFirstNameNoTooltip] stačí útok odrazit, [rival.Custom('SignatureWeaponCriticalPresent')] [Select_CString(friend.IsFemale,'její','jeho')] ramenní kosti. [friend.GetFirstNameNoTooltip] padá s bolestným výkřikem k zemi a [rival.GetFirstNameNoTooltip] se mi zadívá přímo do očí.\n\n„Vzdejte se.“"
 tribal.1105.a: "My... vzdáváme se."
 tribal.1201.t: "Závod"
 tribal.1201.desc_opening: "Přípravy na velký závod probíhají už celé týdny a konečně nadešel čas změřit síly!\n\n"
 tribal.1201.desc_warhorse: "Přijíždím na [ROOT.Char.Custom('WarhorseStoryName')]; [ROOT.Char.Custom('HorseStoryMareStallion')] mi věrně slouží,"
 tribal.1201.desc: "Přijíždím na jednom ze svých nejrychlejších koní,"
 tribal.1201.desc_ending: "a zjišťuji, že závodu se zúčastní jak [racer.Custom2('MyCharacterIntroduction', ROOT.Char)], tak [villain_racer.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 tribal.1201.a: "Samozřejmě se přidám!"
 tribal.1201.a.tt: "Závod přináší prestiž, ale také rizika!"
 tribal.1201.b: "Raději si jen užiji podívanou."
 tribal.1202.desc: "Tanec, zpěv, jásot... Dav je ve vytržení, a závod přitom ještě ani nezačal!\n\nProdírám se mezi lidmi. Do chvíle, kdy máme nasednout, zbývá jen pár minut, když u koní zahlédnu [villain_racer.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))]. V ruce drží něco ostrého..."
 tribal.1202.a: "„Hej! Co to děláš?!“"
 tribal.1202.b: "Do toho mi nic není."
 tribal.1202.b.tt: "Ať se stane cokoli..."
 tribal.1202.c: "[villain_racer.GetFirstNameNoTooltip] tedy nechal[Select_CString(villain_racer.IsFemale,'a','')] svého koně bez dozoru..."
 tribal.1202.c.success: "Uzdu [Select_CString(villain_racer.IsFemale,'jejího','jeho')] koně nechám držet pohromadě jen tak tak"
 tribal.1202.c.tt: "Byla by škoda, kdyby během závodu něco #EMP prasklo#!..."
 tribal.1202.c.failure: "[villain_racer.GetFirstNameNoTooltip] si všimne, že někdo poškodil uzdu"
 tribal.1203.desc_opening: "Uháním stepí, držím krok s oblaky nad hlavou i s jezdci po svém boku.\n\n"
 tribal.1203.desc_sabotaged_you: "#EMP *Křup!*#!\n\nNajednou se všechno převrátí – země je nahoře a nebe dole. Ze všech sil se snažím udržet v sedle, když mi dochází, že se přetočilo pod koně! Nohy však ztrácejí oporu... Tvrdě dopadnu na zem – nemám ani dech na výkřik."
 tribal.1203.desc_sabotaged_racer: "Když se dotáhnu k [villain_racer.GetTitledFirstName], náhle mi vjede do cesty a v téže chvíli zaslechnu bolestný výkřik [racer.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('racer'))]. Ohlédnu se ze sedla a spatřím [Select_CString(racer.IsFemale,'ji','ho')] zkrvaveně ležet na zemi. [Select_CString(racer.IsFemale,'Její','Jeho')] kůň se zoufale zmítá proti sedlu, které už neleží na hřbetě, ale volně visí pod břichem."
 tribal.1203.desc_sabotaged_villain: "Náhle zaslechnu bolestný výkřik [villain_racer.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))]. Ohlédnu se ze sedla a spatřím [Select_CString(villain_racer.IsFemale,'ji','ho')] zkrvaveně ležet na zemi s rozbitými zbytky uzdy v ruce."
 tribal.1203.desc: "Nic se tomu nevyrovná! Vítr, dunění kopyt, ten– Když se dotáhnu k [villain_racer.GetTitledFirstName], náhle mi vjede do cesty a málem vyvede mého koně z rovnováhy!"
 tribal.1203.a: "Musím se vrátit a pomoct [Select_CString(villain_racer.IsFemale,'jí','mu')]!"
 tribal.1203.b_nothing_sabotaged: "Jen mě to rozptyluje."
 tribal.1203.b: "Výborně! O jednoho soupeře méně."
 tribal.1203.b.tt: "Soustředíš se na závod"
 tribal.1203.c: "Alespoň na mě ten kůň nespadl..."
 tribal.1203.d: "Tak teď už jde do tuhého, [villain_racer.GetFirstNameNoTooltip]!"
 tribal.1203.d.success: "#EMP Náhodou#! vrazím do koně [villain_racer.GetFirstNameNoTooltip] trochu příliš tvrdě"
 tribal.1203.d.failure: "Na chvíli zpomalím"
 tribal.1203.d.failure.tt: "V závodě se můžeš umístit hůře"
 tribal.1203.e: "Měl by být dost blízko, abych dokázal[Select_CString(ROOT.Char.IsFemale,'a','')] přeskočit..."
 tribal.1203.success: "Podaří se mi shodit [villain_racer.GetFirstNameNoTooltip] z koně"
 tribal.1203.failure: "Tentokrát letím vzduchem já"
 tribal.1204.desc_slow: "Trvá to dlouhé minuty, ale nakonec přece jen projedu cílem.\n\n"
 tribal.1204.desc_fast: "Když se přeženu přes cílovou čáru, přivítá mě ohlušující řev davu.\n\n"
 tribal.1204.desc_racer: "[racer.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('racer'))] – už slaví své vítězství, obklopen[Select_CString(racer.IsFemale,'a','')] lidmi a zahrnován[Select_CString(racer.IsFemale,'a','')] dary. Jakmile mě spatří, radostně mi zamává."
 tribal.1204.desc_villain: "[villain_racer.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('villain_racer'))] – už slaví své vítězství, obklopen[Select_CString(villain_racer.IsFemale,'a','')] lidmi a zahrnován[Select_CString(villain_racer.IsFemale,'a','')] dary. Jakmile mě spatří, samolibě se ušklíbne a zamává mi."
 tribal.1204.desc_you: "Vzápětí se ke mně hrnou lidé, gratulují mi, natahují ruce k mému koni a tančí... Téměř nikdo si ani nevšimne, že [racer.GetTitledFirstName] a [villain_racer.GetTitledFirstName] dorazili do cíle. Dav je příliš zaměstnaný oslavami se mnou!"
 tribal.1204.desc_you_jumped_horses: "Lidé se ke mně hrnou s gratulacemi, ale jakmile si všimnou, že jedu na koni [villain_racer.GetTitledFirstName] a svého vedu vedle sebe, zavládne zmatek. Přesto se tančí a slaví a téměř nikdo si ani nevšimne, že [racer.GetTitledFirstName] a [villain_racer.GetTitledFirstNameNoTooltip] dorazili do cíle – přičemž [villain_racer.GetFirstNameNoTooltip] po svých."
 tribal.1204.a: "Ano, skutečně jsem [Select_CString(ROOT.Char.IsFemale,'velmi rychlá','velmi rychlý')], děkuji!"
 tribal.1204.b: "Příště vyhraji!"
 tribal.1301.t: "Smrtící setkání"
 tribal.1301.desc: "Navštívím jeden z malých toků poblíž [capital.GetName]. Právě se chystám uhasit žízeň, když se mi do cesty k vodě rozhodně postaví místní [Select_CString(peasant.IsFemale,'žena','muž')] – ta drzost!\n\nUž se chystám poručit, aby [Select_CString(peasant.IsFemale,'ji','ho')] odvedli, když promluví: „Ve vodě je krokodýl, [ROOT.Char.Custom('FormOfAddressForLiege')].“\n\n[Select_CString(peasant.IsFemale,'Ona','On')]... [Select_CString(peasant.IsFemale,'Ona mě #EMP chránila#!','On mě #EMP chránil#!')]?"
 tribal.1301.a: "Děkuji! Tohle je pro tvou vesnici."
 tribal.1301.b: "[Select_CString(peasant.IsFemale,'Žena jako ty by se mi hodila','Muž jako ty by se mi hodil')]."
 tribal.1301.c: "Krokodýl? Pche! Žádného jsem neviděl[Select_CString(ROOT.Char.IsFemale,'a','')]."
 tribal.1301.d: "No... děkuji. A teď už běž."
 tribal.1301.d.tt: "Vezmeš varování [Select_CString(peasant.IsFemale,'ženy','muže')] na vědomí"
 tribal.1302.desc: "Ignoruji [Select_CString(peasant.IsFemale,'ženu','muže')] a přistoupím k vodě. Sehnu se a naberu si do dlaní chladivou vodu. Kromě hmyzu tu není ani známka života!\n\nKdyž se natahuji pro druhý doušek, zaslechnu, jak něco rozčeří hladinu, a pak... #EMP Bolest#!. Tak strašná bolest. Podívám se dolů a kolem mé nohy jsou sevřené obrovské čelisti. Mezi rozeklanými zuby vytéká krev."
 tribal.1302.a: "AAAAH!! SUNDĚJTE TO ZE MĚ!"
 tribal.1303.t: "Oáza"
 tribal.1303.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ osloví mě [councillor.Custom2('MyCharacterIntroduction', ROOT.Char)]. „Nedaleko [capital.GetName] byla objevena oáza. Co s ní mám udělat?“\n\nOáza! Zdroj vody a života... nebo peněz."
 tribal.1303.a: "Přinese prosperitu – zavlažujte!"
 tribal.1303.b: "Použijte ji k zavlažování, ale ne zadarmo."
 tribal.1303.c: "Ať ji sedláci využijí, jak nejlépe dovedou."
