l_polish:
 aging_gracefully_modifier: "Důstojné stárnutí"
 aging_gracefully_modifier_desc: "Tato postava začíná slábnout, ale zub času se do ní zakusuje o něco méně než do většiny ostatních."
 thick_skulled_modifier: "Tvrdá lebka"
 thick_skulled_modifier_desc: "Hlava této postavy toho podle všeho opravdu hodně vydrží."
 strong_willed_modifier: "Silná vůle"
 strong_willed_modifier_desc: "Tato postava je zvyklá překonávat i tu nejkrutější bolest."
 harm.0000.tt.spared_for_now: "Tentokrát jsi ušetřen. Prozatím."
 harm.0000.tt.no_permanent_damage: "Neutrpíš žádné trvalé následky."
 harm.0000.tt.physician: "#EMP [ROOT.Char.Custom('GetRandomCourtMedic')|U]! [medic.GetFirstNameNoTooltip]!#!"
 harm.0000.tt.incapable.success: "Neutrpíš žádné trvalé následky"
 harm.0000.tt.incapable.failure: "Tento zážitek tě zanechá zesláblého"
 harm.0000.tt.death.success: "Přežiješ"
 harm.0000.tt.death.failure: "Zemřeš"
 harm.0001.t.pre_title: "Neduhy stáří"
 harm.0001.t: "$harm.0001.t.pre_title$: Zesláblé tělo"
 harm.0001.desc: "Probouzím se s kašlem a dušením, mysl mám zastřenou a v hlavě mi třeští. Se zvedajícím se žaludkem se pokouším vytáhnout z postele, ale prsty svírající rám jsou slabé a bezmocné jako u novorozeněte.\n\nS nesmírným úsilím se roztřeseně postavím na nohy a dovrávorám k umyvadlu. [ROOT.Char.GetFaith.HealthGodName] mi pomáhej! Odkud se tahle slabost vzala? Je mi... je mi tak mizerně.\n\nChladná voda mě téměř neosvěží. Zamlženým zrakem hledím na pochmurný, neostrý odraz v naleštěném stříbrném zrcadle. [Select_CString(ROOT.Char.IsFemale, 'Žena, která na mě odtud hledí', 'Muž, který na mě odtud hledí')] vypadá tak strašlivě staře."
 harm.0001.a: "Ještě tu budu pěknou řádku let!"
 harm.0001.a.tt.success: "Tvé tělo je zdravé a mysl jasná"
 harm.0001.a.tt.failure: "Nejsi v takové kondici, jak sis myslel"
 harm.0001.b: "Možná bych měl žít trochu zdravěji..."
 harm.0001.b.tt.success: "Provedeš několik nezbytných změn"
 harm.0001.b.tt.failure: "Běh času nic nezastaví"
 harm.0001.c: "Odejdu, až budu chtít já, [ROOT.Char.GetFaith.DeathDeityName]. Ani o chvíli dřív."
 harm.0001.d: "Už nejsem tak mladý jako kdysi."
 harm.0001.d.tt.success: "Čas je k tobě milosrdný"
 harm.0001.d.tt.failure: "Tvé tělo podléhá stáří"
 harm.0002.t: "$harm.0001.t.pre_title$: Zmatená mysl"
 harm.0002.desc: "Kam jsem to šel? Proč jsem sem přišel? Mohl bych přísahat, že... ano, něco jsem hledal. Něco. Něco... nějakou věc.\n\nBylo to naléhavé? Musel jsem se vrátit za #EMP někým#!. Rychle! Příští týden? Ano, myslím, že ano.\n\nAha! Tady to je, přesně to jsem chtěl, potřeboval jsem to na... na..."
 harm.0002.a: "Na co jsem to myslel?"
 harm.0002.a.tt: "Tvá mysl už není tak bystrá jako kdysi..."
 harm.0003.t: "$harm.0001.t.pre_title$: Bolavé tělo"
 harm.0003.desc.intro: "[ROOT.Char.GetFaith.HealthGodName] mi pomáhej, proč mě všechno tak #EMP bolí#!? Spal jsem dobře, alespoň tak dobře jako obvykle, ale při každém protažení mám pocit, jako by o sebe mé kosti skřípaly a jiskřily.\n\n"
 harm.0003.desc.sighted: "Zadívám se na své [ROOT.Char.Custom('HandHands')|l] a pozorně si prohlížím nehty. Věkem žloutnou a kůže pod nimi je vrásčitější, než by mi bylo milé."
 harm.0003.desc.blind: "Přejíždím [ROOT.Char.Custom('HandHands')|l] po kůži, cítím její papírovou tenkost a hluboké záhyby vrásek, kterých je na mém těle až příliš."
 harm.0003.desc.outro: "Jen těžko si lze představit, že tímto tělem kdysi proudilo mládí, žhavé a plné života."
 harm.0003.a: "Gah, to snad všem klouby takhle #EMP vržou#!?"
 harm.0003.a.tt: "Tvé tělo začíná zpomalovat..."
 harm.0011.t: "Zlomen bitvou"
 harm.0011.desc.default_body: "Bitva u [battle_location.GetName] je u konce. Ranění a zmrzačení odkulhávají z bojiště, zatímco těla nejvýznamnějších padlých odnášejí přátelé a družiníci.\n\nJá sám jsem se ocitl v nejprudší řeži — na žádné finesy nebyl čas, jen sekání, křik a zabíjení. Z úderů a přívalu adrenalinu se mi stále točí hlava, střídají se ve mně vlny strachu, vzteku, opojení a...\n\nT-točí. Hlava se mi točí. Zrak se rozmazává, obraz se rozdvojuje a já se začínám kácet do [ROOT.Char.Custom('GritType')|l].\n\n„Přiveďte [ROOT.Char.Custom('GetRandomBattlefieldMedic')|l], [ROOT.Char.GetTitleAsNameNoTooltip] dostal zásah!“ ozve se výkřik,"
 harm.0011.desc.medic_present: " a poslední, co vidím, je [medic.GetTitledFirstName], jak se prodírá davem."
 harm.0011.desc.no_medic: " ale nikdo neodpovídá. Vůbec nikdo."
 harm.0011.a: "Nic mi není! J-jsem v pořádku..."
 harm.0011.a.tt.success: "Časem se zotavíš"
 harm.0011.a.tt.success.bone: "Zachrání tě tvrdá lebka"
 harm.0011.a.tt.success.brain: "Udrží tě při životě pouhá síla vůle"
 harm.0011.a.tt.failure: "V pořádku rozhodně nejsi"
 harm.0011.b: "[medic.GetFirstNameNoTooltip]. Prosím. Moje #EMP hlava.#!"
 harm.0011.b.tt.success: "Díky pomoci [medic.GetFirstNameNoTooltip] se z toho dostaneš"
 harm.0011.b.tt.failure: "[medic.GetFirstNameNoTooltip] udělá, co může, ale ani to nestačí"
 harm.0501.t.prefix: "Hříchy rodu"
 harm.0501.t: "$harm.0501.t.prefix$: Nejlepší z rodu"
 harm.0501.desc: "Celé mé bytí hoří — jako by se má duše vznítila a zevnitř pomalu shořívala. Kam to vlastně bylo... proč jsem tady? Proč to #EMP tolik bolí#!?\n\nNerv za nervem se palčivá muka rozlézají celým mým ubohým tělem, ve vlnách tu a tam vyšlehnou a zase ustoupí. Je mi příšerné horko, a přitom strašná zima, tělem mi vystřelují jiskřivé záchvěvy bolesti.\n\nV jediném spalujícím okamžiku jasnosti pochopím příčinu svého trápení. Mé tělo pyká za nedostatky mého rodu."
 harm.0501.a: "Kde... kde to jsem?"
 harm.0501.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0501.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0501.b: "Dokážu se #EMP ovládnout#!."
 harm.0501.c: "Má mysl je bystřejší než tohle."
 harm.0501.c.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0501.c.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0502.t: "$harm.0501.t.prefix$: Jiskry před očima"
 harm.0502.desc: "[ROOT.Char.Custom('GetCourtyard')|U] je dnes jen kulisou mé bezvýznamné pochůzky. Ve spěchu mě náhle sevře bolest v noze a vzápětí další v paži. Třese se mi... ruka? Proč mi tak třeští hlava? Odkud se...\n\nNa krátký okamžik zavrávorám a málem se skácím k zemi. Pak znovu získám rovnováhu a pokračuji dál.\n\nJá... vůbec nevím, co to bylo."
 harm.0502.a: "Co je to za podivný neduh?"
 harm.0502.a.tt: "#WEAK Bolest opět ustupuje...#!"
 harm.0511.t.prefix: "Jak chutná zem"
 harm.0511.t: "$harm.0511.t.prefix$: Malý pád"
 harm.0511.desc: "Nedaleko leží [ROOT.Char.GetCurrentLocation.GetName]. S doprovodem si užíváme dlouhou, poklidnou vyjížďku — dnešní povinnosti jsou za námi a pomalu se vracíme domů, abychom dorazili včas k večeři.\n\nSlunce právě začíná klesat pod obzor a jeho rudé paprsky se prodírají našimi řadami, když se můj oř náhle vzepne. Pohyb je příliš prudký a rychlý, než abych znovu získal kontrolu, a já letím ze sedla."
 harm.0511.a: "Počkat, n-!"
 harm.0511.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0511.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0511.b: "Skrčit se a překulit."
 harm.0511.c: "Dopadnout na rameno."
 harm.0511.c.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0511.c.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0512.t: "$harm.0511.t.prefix$: Málem"
 harm.0512.desc: "Nedaleko leží [ROOT.Char.GetCurrentLocation.GetName]. [ROOT.Char.GetPrimaryTitle.GetNameNoTier] je mým panstvím a jako [ROOT.Char.GetTitleAsNameNoTooltip] v něm nacházím prosté potěšení v projížďkách divočinou. Mohu si je užívat o samotě nebo s doprovodem, kdykoli je každodenní břímě vlády příliš těžké.\n\nZtracen ve vlastních myšlenkách málem přehlédnu, že můj oř zahlédl jakéhosi drobného plaza, polekal se a chystá se vzepnout. Rychle pevněji sevřu otěže a zvíře uklidním.\n\nVyjížďka pokračuje."
 harm.0512.a: "Heh, #EMP tohle#! už se opakovat nebude."
 harm.0512.a.tt: "#WEAK Tvůj kůň zůstává po zbytek vyjížďky neklidný...#!"
 harm.0521.t.prefix: "Vlna za vlnou"
 harm.0521.t: "$harm.0521.t.prefix$: Bublání a chňapání"
 harm.0521.desc.sea: "Pobyt na moři si vždycky užívám. I za bouřlivého dne, jako je ten dnešní, má moře drsnou krásu, připomíná křehkost života, jeho—"
 harm.0521.desc.river: "Nedaleko leží [ROOT.Char.GetCurrentLocation.GetName]. Zdejší řeka nebývá tak rozbouřená jako dnes, ale plavbu si přesto užívám. Je uklidňující, je—"
 harm.0521.desc.coastal: "Nedaleko leží [ROOT.Char.GetCurrentLocation.GetName]. Zdejší pobřeží bičované bouří dokáže být pro plavbu nebezpečné, přesto se mi po něm pluje dobře. Vyvolává ve mně pocit—"
 harm.0521.desc.outro: "\n\nPlavidlo se prudce nakloní na bok a já přepadnu do vody. Náraz mi vyrazí dech a náhlý chlad uvrhne celé tělo do šoku.\n\nKdyž se pod hladinou proberu, kašlu, dusím se a tělo i mysl mi zachvacuje palčivá bolest. Vědomí už znovu mizí, mozek se dusí a s každou vteřinou pohasíná."
 harm.0521.a: "Lano, síť, prkno, hoďte mi něco!"
 harm.0521.a.tt.success: "Tvé ruce se něčeho zachytí"
 harm.0521.a.tt.failure: "Zůstaneš pod vodou příliš dlouho"
 harm.0521.b: "Vzhůru k hladině!"
 harm.0521.b.tt.unlocked_by_cultrad: "Tuto možnost zpřístupňují [Concept('traditions','tradice')|E] tvé [Concept('culture_possessive','kultury')|E]"
 harm.0521.c: "Plav, #EMP plav#!!"
 harm.0521.c.tt.success: "Včas se dostaneš na hladinu"
 harm.0521.c.tt.failure: "Trvá ti to příliš dlouho"
 harm.0522.t: "$harm.0521.t.prefix$: Obraz klidu"
 harm.0522.desc.sea: "Je vůbec něco osvěžujícího jako moře? Vůně soli, občasné volání racků při plavbě kolem pevniny, tiché šplouchání vody o trup lodi."
 harm.0522.desc.river: "Nedaleko leží [ROOT.Char.GetCurrentLocation.GetName] a zdejší řeka nabízí pohodlný způsob cestování, který čas od času rád využiju — stejně jako dnes.\n\nJe to vlastně osvěžující. Poslouchám hekání a pokřiky veslařů, kteří nás unášejí s proudem, a sleduji krajinu míhající se kolem, přestože sám zůstávám docela nehybný."
 harm.0522.desc.coastal: "Málokterý rok se obejde bez toho, abych #EMP nemusel#! cestovat po moři. [ROOT.Char.GetCurrentLocation.GetName] leží tak blízko pobřeží, že by byla hloupost této možnosti nevyužít.\n\nDnešní cesta byla krátká — má přítomnost byla nutná jen kvůli rozs souzení bezvýznamného sporu — a teď si mohu užívat poklidnou plavbu domů, sledovat ubíhající pobřeží a nemít jedinou starost."
 harm.0522.desc.outro: "\n\nStojím na palubě, nakláním se přes bok lodi a cítím naprostý klid."
 harm.0522.a: "Ta voda je téměř hypnotická..."
 harm.0522.a.tt: "#WEAK Téměř... hypnotická...#!"
 harm.0531.t.prefix: "Potíže uvnitř"
 harm.0531.t: "$harm.0531.t.prefix$: Svět se vytrácí"
 harm.0531.desc: "Cítím se tak... otupěle. Co se... děje...\n\nNedokážu stát rovně. Nedokážu se soustředit. Nic necítím. Jen vystřelující bolest a—\n\nPomoc.\n\nNějak.\n\nNěkdo.\n\nProsím.\n\n#EMP Prosím#!."
 harm.0531.a: "Má mysl... #EMP hoří#!..."
 harm.0531.a.tt.success: "Prázdnota ustupuje"
 harm.0531.a.tt.failure: "Podlehneš těžké mrtvici"
 harm.0531.b: "Znám se. Tohle přejde."
 harm.0531.c: "Ať mi [ROOT.Char.GetFaith.HealthGodName] dodá sílu."
 harm.0531.c.tt.success: "$harm.0531.a.tt.success$"
 harm.0531.c.tt.failure: "$harm.0531.a.tt.failure$"
 harm.0532.t: "$harm.0531.t.prefix$: Nemůžu myslet"
 harm.0532.desc: "V poslední době mě sužují příšerné migrény. Drásají mi mysl a rvou tělo, zatímco se mi lebkou odrážejí ostré střepy bolesti.\n\nČasem každá z nich #EMP opravdu#! pomine, ale nikdy ne dost rychle."
 harm.0532.a: "Ty zatracené bolesti hlavy snad nikdy neskončí?"
 harm.0532.a.tt: "#WEAK Skončí... nejspíš...#!"
 harm.0541.t.prefix: "Neduhy uprostřed zimy"
 harm.0541.t: "$harm.0541.t.prefix$: Tiše a nehybně"
 harm.0541.desc.baby: "...\n\nŘíkám si. Jaký by asi život býval mohl být.\n\n..."
 harm.0541.desc.fallback: "Přitáhnout přikrývky těsněji. Schovat pod ně ruce i nohy. Zatnout promrzlé zuby proti chladu.\n\nTahle mrazivá zimní noční můra jako by z mého těla vysávala poslední zbytky zdraví a nechávala ze mě ubohou trosku, která sotva dokáže zakašlat. Nepodlehnu.\n\nNepodlehnu..."
 harm.0541.a: "..."
 harm.0541.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0541.a.tt.failure: "Chlad vykoná své kruté dílo"
 harm.0541.b: "Už jsem čelil horším věcem."
 harm.0541.c: "#EMP Mráz#! mě na kolena nesrazí!"
 harm.0541.c.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0541.c.tt.failure: "$harm.0541.a.tt.failure$"
 harm.0542.t: "$harm.0541.t.prefix$: Promrzlý na kost"
 harm.0542.desc.baby: "Můj malý svět je tak zvláštní. Co je to za pocit? Proč mi není teplo?\n\nDřív to tak nebylo, ale teď ano. Nerozumím tomu. Snažím se rozplakat, přivolat pečovatele na pomoc, ale z plic vyjde jen slabé zakašlání."
 harm.0542.desc.fallback: "Ať si noční přikrývky přitáhnu sebepevněji, pořád je mi tak strašlivá zima. Krutý zimní chlad se mě drží jako maso kosti a svírá mě ve svém mrazivém objetí.\n\nPevně zavřu oči — ráno přijde brzy a s ním světlo a život slunce i krbu."
 harm.0542.a: "Kéž by tu bylo tepleji..."
 harm.0542.a.tt: "#WEAK Oheň... potřebuješ další oheň...#!"
 harm.0551.t.prefix: "Hra na velkého"
 harm.0551.t: "$harm.0551.t.prefix$: Žuchnutí a křupnutí"
 harm.0551.desc: "[ROOT.Char.GetFaith.FateGodName] ví, jak moc miluju objevovat zdejší okolí! Kdybych neznal tajnou cestu za hradby, nikdy bych se nezbavil těch věčně starostlivých opatrovníků, natož abych si mohl takhle hrát úplně sám.\n\nJak bych jinak vůbec našel tak obrovský strom, natož na něj mohl vylézt? Ti všetečkové by mě nikdy nenechali... nikdy by mě nenechali...\n\nTen strom je vlastně docela vysoký, že?"
 harm.0551.a: "Jen... musím být opatrný..."
 harm.0551.a.tt.success: "Dokážeš slézt dolů"
 harm.0551.a.tt.failure: "Žuchnutí a křupnutí"
 harm.0551.b: "Pomoc. Pomoc! POMOC!"
 harm.0551.c: "Nevypadá #EMP zas tak#! vysoko..."
 harm.0551.c.tt.success: "$harm.0551.a.tt.success$"
 harm.0551.c.tt.failure: "$harm.0551.a.tt.failure$"
 harm.0552.t: "$harm.0551.t.prefix$: Tajná cesta"
 harm.0552.desc: "Jako [ROOT.Char.GetTitleAsNameNoTooltip] nemám mnoho času jen pro sebe. Opatrovníci a stráže jsou všude, chrání mě před nebezpečím — a také před jakoukoli zábavou.\n\nKonečně se mi ale podařilo všechny obelstít! Chtělo to trochu odvahy, ale cestu za hradby, kterou znám #EMP já#!, oni neznají.\n\nNemohu ji využívat příliš často, ale když se mi to podaří, otevře se přede mnou celý svět. Svoboda."
 harm.0552.a: "To je zábava!"
 harm.0552.a.tt: "#WEAK Tudy tě určitě nikdy nikdo nenajde...#!"
 harm.0561.t.prefix: "Už ne tak mladý"
 harm.0561.t: "$harm.0561.t.prefix$: Sestup"
 harm.0561.desc_adventurer: "Znovu hledím na změť bláta a stanových lan a přemýšlím, jestli už snad nepotřebuji někoho, kdo na mě bude dávat pozor.\n\nMělo by to být jednoduché. Jsem přece dospělý člověk a zatraceně dobře vím, jak projít táborem, aniž bych si zlomil vaz.\n\nMělo by to být tak strašně, #EMP strašně#! jednoduché.\n\nA přesto..."
 harm.0561.desc: "Znovu hledím na schody vedoucí dolů z mého pokoje a přemýšlím, jestli už snad nepotřebuji někoho, kdo na mě bude dávat pozor.\n\nMělo by to být jednoduché. Jsem přece dospělý člověk a zatraceně dobře vím, jak sejít po schodech, aniž bych si zlomil vaz.\n\nMělo by to být tak strašně, #EMP strašně#! jednoduché.\n\nA přesto..."
 harm.0561.a: "Ach — počkat — NÉÉ-"
 harm.0561.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0561.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0561.b: "Jednu nohu před druhou. Klid."
 harm.0561.c: "Jsou to jen #EMP schody#!."
 harm.0561.c.adventurer: "Jsou to jen #EMP stany#!."
 harm.0561.c.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0561.c.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0562.t: "$harm.0561.t.prefix$: Rostoucí křehkost"
 harm.0562.desc_adventurer: "Když vstanu z postele a vykročím do ruchu tábora, přistihnu se, že se téměř křečovitě držím stanové tyče.\n\nTohle... tohle by přece mělo být jednoduché. A přesto se změť bláta, stanových lan a zavazadel přede mnou zdá tak obtížně překonatelná, tak hrozivá, jako by se táhla až do nekonečna...\n\nNe, ne. Jen to zbytečně dramatizuji. Jsem přece #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! a svůj tábor dokážu přejít bez cizí pomoci."
 harm.0562.desc: "Když sestupuji po schodech ze své ložnice, přistihnu se, že se téměř křečovitě držím zdi.\n\nTohle... tohle by přece mělo být jednoduché. A přesto se úzké schodiště přede mnou zdá tak obtížně překonatelné, tak hrozivé, jako by se táhlo až do nekonečna...\n\nNe, ne. Jen to zbytečně dramatizuji. Jsem přece #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! a [ROOT.Char.Custom('GetRoom')|l] dokážu opustit bez cizí pomoci."
 harm.0562.rump: ""
 harm.0562.a: "Znepokojivé."
 harm.0562.a.tt: "#WEAK Kdy se z něčeho tak prostého stal takový problém?#!"
 harm.0571.t.prefix: "Nezbytný výcvik"
 harm.0571.t: "$harm.0571.t.prefix$: Nešťastný úder"
 harm.0571.desc: "Cvičit [sparring_partner.GetTitledFirstName], aby se zlepšil[Select_CString(sparring_partner.IsFemale, 'a', '')] v boji, patří k mým únavnějším povinnostem, ale k úloze [ROOT.Char.GetTitleAsName] to zkrátka patří.\n\nDnešní souboj je obzvlášť frustrující, protože [sparring_partner.GetFirstNameNoTooltip] si vede hůř než kdy předtím. Občas si říkám, jestli—\n\nLebkou mi projede bolest. To mě snad [sparring_partner.GetFirstNameNoTooltip] [Select_CString(sparring_partner.IsFemale, 'zasáhla', 'zasáhl')] #EMP do spánku#!? Co je to za #EMP pitomce#!..."
 harm.0571.a: "[ROOT.Char.GetFaith.TricksterGodName] je mi svědkem, ty hlupáku, to byla moje hlava!"
 harm.0571.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0571.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0571.b: "Sotva škrábnutí."
 harm.0571.c: "Klidně dýchej — mohlo být hůř."
 harm.0571.c.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0571.c.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0572.t: "$harm.0571.t.prefix$: Jen nehoda"
 harm.0572.desc: "Při cvičném souboji v [ROOT.Char.Custom('GetCourtyard')|l] zkřížíme s [sparring_partner.GetTitledFirstName] své cvičné čepele v tanci, který by na skutečném bojišti nejspíš skončil tisícerou smrtí [sparring_partner.GetFirstNameNoTooltip].\n\n[sparring_partner.GetFirstNameNoTooltip] zkrátka není takový bojovník jako já.\n\nJenže kdo mě má zastupovat v poli, výcvik potřebuje, a tak si na něj udělám čas a—\n\n[ROOT.Char.GetFaith.WarGodName] mě ochraňuj! Ten úder mě málem zasáhl do lebky!"
 harm.0572.a: "Dávej pozor, ty nemehlo!"
 harm.0572.a.tt: "#WEAK Mohlo to dopadnout mnohem hůř...#!"
 harm.0581.t.prefix: "Vzácná samota"
 harm.0581.t: "$harm.0581.t.prefix$: Neopatrný krok"
 harm.0581.desc: "Vzácná koupel o samotě, bez sluhů a věčně reptajících přisluhovačů, je pro mě skutečným potěšením. Chvíle, kdy mám čas opravdu jen a jen pro sebe, přicházejí tak zřídka, že si vychutnávám každou vteřinu.\n\nJenže všechno dobré jednou skončí a já se začnu zvedat z lázně.\n\nAle— sevření není tak pevné, jak jsem si myslel, noha mi uklouzne a já se náhle začnu nekontrolovaně smýkat."
 harm.0581.a: "[ROOT.Char.GetFaith.TricksterGodName], počkat, n—"
 harm.0581.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0581.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0581.b: "Pomalu. Hlavně opatrně."
 harm.0582.t: "$harm.0581.t.prefix$: Za mokra klouže"
 harm.0582.desc: "Koupel o samotě je pro mě vzácnou výsadou. Jako [ROOT.Char.GetTitleAsNameNoTooltip] jen těžko hledám okamžik, kdy mě nepronásledují sluhové nebo [ROOT.Char.Custom('GetCourtier')|l] toužící po nerušeném rozhovoru — ani něco tak intimního jako vlastní očista není výjimkou.\n\nPomalu se zvedám z lázně, přidržuji se jejího okraje a vykročím k připravené hromádce složených ručníků.\n\nJenže... ne tak docela.\n\nMokrá noha mi uklouzne a jen díky reflexům se neskácím na podlahu."
 harm.0582.a: "Asi bych si měl dávat větší pozor."
 harm.0582.a.tt: "#WEAK Bez doprovodu se přece nekoupeš často...#!"
 harm.0591.t.prefix: "Bez rozmyslu"
 harm.0591.t: "$harm.0591.t.prefix$: Smrt shůry"
 harm.0591.desc: "Drobná pochůzka ve městě mi zabrala víc času, než bych chtěl, ale konečně se s doprovodem vydáváme domů.\n\n[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] dnes překypuje ruchem. Obyvatelé největšího zdejšího města proudí ulicemi a každý se věnuje svému skromnému životu, aniž by příliš dbal na [ROOT.Char.GetTitleAsNameNoTooltip], který právě projíždí kolem.\n\nNáhlé, spalující poznání se mi vryje do mysli: #EMP nebezpečí#!. Přímo nade mnou je něco, co se rychle řítí dolů."
 harm.0591.a: "Vrhnout se stranou."
 harm.0591.a.tt.success: "Jsi v bezpečí"
 harm.0591.a.tt.failure: "Do spánku tě zasáhne měšťanův hrnec"
 harm.0591.b: "#EMP Copak nejsem v bezpečí vůbec nikde?!#!"
 harm.0591.b.tt: "Díky paranoii zareaguješ nadlidskou rychlostí"
 harm.0591.c: "Už uhýbám."
 harm.0591.c.tt.success: "$harm.0591.a.tt.success$"
 harm.0591.c.tt.failure: "$harm.0591.a.tt.failure$"
 harm.0592.t: "$harm.0591.t.prefix$: Vyhazování"
 harm.0592.desc: "[ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] mizí kolem nás, zatímco s doprovodem projíždíme ulicemi největšího zdejšího města po vyřízení jakési bezvýznamné pochůzky. Náhle zaslechneme hlasité tříštění.\n\nKrátké pátrání ukáže, že nějaký měšťan vyhodil z okna hliněný hrnec, aniž by se obtěžoval přemýšlet, zda někoho dole netrefí.\n\nBezohledné, jistě, ale co také čekat?\n\nKaždopádně to sotva stojí za další přemýšlení."
 harm.0592.a: "Ti #EMP burani#!."
 harm.0592.a.tt: "#WEAK Někdo mohl přijít k úrazu...#!"
 harm.0601.t.prefix: "Divoké hry"
 harm.0601.t: "$harm.0601.t.prefix$: Následky"
 harm.0601.desc: "Jako už tolikrát si s [playmate.GetFirstName] hrajeme v opuštěné části mého paláce.\n\nJsme dobří přátelé a #EMP vždycky#! dokážeme vymyslet nějakou zábavu. Pro změnu je příjemné mít vedle sebe někoho, kdo není strážný ani opatrovník.\n\nDnes daleko od upjatých dohlížitelů, kteří by nám obvykle hned zasáhli do hry, zápasíme jen tak pro zábavu. Byla to ohromná legrace! Jenže... jenže po tom posledním škrcení se mi trochu motá hlava a... #DIE1 a...#!"
 harm.0601.a: "Já... necítím se moc dobře..."
 harm.0601.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0601.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0602.t: "$harm.0601.t.prefix$: Co by se mohlo stát?"
 harm.0602.desc: "Hrozně rád si hraju s [playmate.GetFirstName]. [playmate.GetFirstNameNoTooltip] vždycky ví, co podniknout, aby byla zábava!\n\nLezení po budovách, plašení zvířat, tropení žertíků dvořanům... všechno je to jen legrace a u dvora je díky tomu mnohem živěji. Chci si s [playmate.GetFirstNameNoTooltip] hrát navždy."
 harm.0602.a: "Měli bychom si hrát každý den!"
 harm.0602.a.tt: "#WEAK Koneckonců jste oba jen děti...#!"
 harm.0611.t.prefix: "Příliš daleko, příliš rychle"
 harm.0611.t: "$harm.0611.t.prefix$: Závratná výše"
 harm.0611.desc.intro: "Po dalším rušném večeru stráveném vyřizováním korespondence se zvedám ze židle. Večeře volá a já bych— [ROOT.Char.GetFaith.HealthGodName] mi pomáhej, co je to za #EMP nával#!? Proč se mi tak motá hlava?\n\nKde je... Kde to jsem? Co se děje?\n\n"
 harm.0611.desc.blind: "Jako bych náhle vystoupal až do samotných oblak. Nic neslyším. Nic necítím. Jen vzdálenost, závratnou výši a tepání krve v žilách."
 harm.0611.desc.fallback: "Zorné pole se mi začíná zužovat, zrak i sluch pohlcuje valící se temnota a s ní přichází příslib rychlého konce."
 harm.0611.a: "Počkat... co... moje..."
 harm.0611.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0611.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0611.b: "Zatnout zuby a vydržet ten nával."
 harm.0611.c: "Soustředit se. Jasná mysl. #EMP Soustředit se#!."
 harm.0611.c.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0611.c.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0612.t: "$harm.0611.t.prefix$: Nával"
 harm.0612.desc: "Tak, to byl poslední. Sto a jeden dopis, alespoň tak mi to připadalo, od všech možných úředníků, díky nimž můj [ROOT.Char.Custom('GetRealmOrDomicile')|l] vůbec funguje — a celý večer padl na odpovídání jednomu po druhém.\n\nTeď už jen něco malého k snědku před spaním.\n\nOdsunu židli, prudce se postavím a... a... taková... závrať. Krev mi buší v žilách.\n\nSoustředit se.\n\n#EMP Soustředit se#!.\n\nUgh, co to #EMP bylo#!?"
 harm.0612.a: "Pořád se mi motá hlava."
 harm.0612.a.tt: "#WEAK Je tvé tělo opravdu tak slabé?#!"
 harm.0621.t.prefix: "Naložený v lihu"
 harm.0621.t: "$harm.0621.t.prefix$: Báječný večer"
 harm.0621.desc: "Další večer, další korbel, jak vždycky říkám! A další večer #EMP vždycky#! přijde!\n\nMalá krčma v [ROOT.Char.GetCurrentLocation.GetName] se kolem mě točí v rozmazané změti tváří a pohybů. Ještě jeden! Ještě... tenhle... tenhle stůl mě nějak nechce pustit. Jak se vlastně stojí?\n\nJak se... Jejda, padá— agh, [ROOT.Char.GetFaith.HealthGodName] mi pomáhej, moje hlava..."
 harm.0621.a: "*ŠKYT*... *škyt*... ..."
 harm.0621.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0621.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0621.b: "Hehe, tohle ráno ucítím."
 harm.0621.c: "Uf, moje hlava. To byla rána, co?"
 harm.0621.c.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0621.c.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0622.t: "$harm.0621.t.prefix$: Zlozvyky"
 harm.0622.desc: "„Hostinský, další rundu!“ vykřiknu za hlasitého jásotu a hulákání.\n\nKdyž se zbytek návštěvníků krč-*ŠKYT*-my přidá k veselí, usměju se. Teď už tu snad musí být půlka [ROOT.Char.GetCurrentLocation.GetName]. Všichni jásají a hulákají na mou počest.\n\nKoneckonců, kdo umí obrátit korbel do sebe jako #EMP já#!?"
 harm.0622.a: "Život je krásný."
 harm.0622.a.tt: "#WEAK A s dalším pitím ještě krásnější!#!"
 harm.0631.t.prefix: "Extáze"
 harm.0631.t: "$harm.0631.t.prefix$: Divoká rozkoš"
 harm.0631.desc: "S [bonker.GetFirstName] si připadám jako nejšťastnější člověk na světě. Za večerů, jako je tento, kdy naše láska dostává tělesnou podobu, není o [Select_CString(bonker.IsFemale, 'její', 'jeho')] vášni nejmenších pochyb.\n\nPrsty se mi zatínají, oči obracejí v sloup a já se vrhám vstříc nejvášnivějšímu milenci svého života.\n\nKrev mi buší tak silně, že se sotva dokážu soustředit. Krev. Krev... buší... Co je... tohle není..."
 harm.0631.a: "Počkat — nemůžu — moje hruď!"
 harm.0631.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0631.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0631.b: "N-ne, srdce, teď #EMP ne#!..."
 harm.0631.c: "Musím to jen vydržet."
 harm.0631.c.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0631.c.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0632.t: "$harm.0631.t.prefix$: Sladká hudba"
 harm.0632.desc: "Při všech hvězdách na nebi, [bonker.GetFirstName] ve mně probouzí ten nejprudší žár lásky. Nikdo jiný mi nedokáže dopřát tak divoký zážitek a tak rozkošnou noc jako [bonker.GetFirstNameNoTooltip]. A právě teď si nedokážu představit nikoho—\n\n...\n\n—s kým bych byl raději."
 harm.0632.a: "S [bonker.GetFirstNameNoTooltip] se cítím tak #EMP živý#!."
 harm.0632.a.tt: "#WEAK Tak strašně, strašně živý...#!"
 harm.0641.t.prefix: "Příjem tekutin"
 harm.0641.t: "$harm.0641.t.prefix$: Trocha otoku"
 harm.0641.desc: "K čertu s tou zatracenou vodnatelností, copak nemůžu mít ani chvíli klidu? Mé tělo... #EMP otéká#! touhle zkažeností, bledá tekutina se hromadí pod mdlou kůží a vzdouvá ji daleko za přirozenou míru.\n\nMé zduřelé, oteklé tělo svírá bolest a s ním i mě.\n\nNedokážu jasně myslet.\n\nDokážu jen trpět.\n\nTrpět, trpět a sténat..."
 harm.0641.a: "Co je... se mnou..."
 harm.0641.a.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0641.a.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0641.b: "Tohle přejde."
 harm.0641.c: "Tohle se přece musí dát léčit?"
 harm.0641.c.tt.success: "$harm.0000.tt.incapable.success$"
 harm.0641.c.tt.failure: "$harm.0000.tt.incapable.failure$"
 harm.0642.t: "$harm.0641.t.prefix$: Citlivost"
 harm.0642.desc: "V poslední době mě tolik bolí klouby.\n\nObjevilo se jakési... pohmoždění? Zánět? Přinejmenším se kolem pohyblivých částí končetin hromadí voda a působí mi značné trápení.\n\nNezbývá než doufat, že s časem a odpočinkem otok ustoupí."
 harm.0642.a: "Agh, to je nějak citlivé."
 harm.0642.a.tt: "#WEAK Určitě to přejde...#!"
 harm.1001.t.prefix: "Večerní hostina"
 harm.1001.t: "$harm.1001.t.prefix$: Zaskočí v krku"
 harm.1001.desc: "Dnešní večeře je směsicí několika mých oblíbených jídel — v poslední době je zdejší kuchyně nečekaně znamenitá a já do sebe všechno s chutí házím.\n\nJenže. Jenže něco není... moje hrdlo, něco mi uvízlo v hrdle!\n\nVzduch, nemůžu— #EMP vzduch#!."
 harm.1001.a: "Pokusit se to vykašlat."
 harm.1001.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1001.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1001.b: "Klid. Dýchej."
 harm.1001.c: "Bušit se do hrudi."
 harm.1001.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1001.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1002.t: "$harm.1001.t.prefix$: Málem zaskočilo"
 harm.1002.desc: "Zakašlu, zaprskám a instinktivně si uvolním dýchací cesty. Večeře je výtečná, možná až #EMP příliš#! výtečná, protože ji hltám trochu moc rychle.\n\nKlid, napomínám se.\n\nNení kam spěchat."
 harm.1002.a: "Jídlo mi poslední dobou prostě chutná."
 harm.1002.a.tt: "#WEAK Je to přece neškodné potěšení...#!"
 harm.1011.t.prefix: "Lekavý oř"
 harm.1011.t: "$harm.1011.t.prefix$: Jízda o život"
 harm.1011.desc: "S doprovodem se vracíme z pochůzky krajinou, kde leží [ROOT.Char.GetCurrentLocation.GetName], když zpod kamene vyběhne jakýsi drobný, zuřivý tvor a zasyčí na mého oře.\n\nKůň nečekaně zpanikaří, vyrazí do zběsilého, neuspořádaného cvalu a žene se vpřed závratnou rychlostí.\n\nZvíře je snad ještě vyděšenější vlastní reakcí než tím tvorem samotným. Za běhu se vzpíná a kope, až málem porazí samo sebe — natož mě."
 harm.1011.a: "Držet se jako o život."
 harm.1011.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1011.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1011.b: "Hlavu dolů a pevně se držet."
 harm.1011.c: "Není to první splašený kůň, kterého zvládám."
 harm.1011.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1011.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1012.t: "$harm.1011.t.prefix$: Na zpáteční cestě"
 harm.1012.desc: "Od každého vládce se očekává, že umí jezdit na koni, často a dobře. Jinak by přece sotva šlo spravovat [ROOT.Char.Custom('GetRealmOrDomicile')|l].\n\nDnešní pochůzka je jen bezvýznamná záležitost na venkově. [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] není daleko a s doprovodem bychom ji měli rychle vyřídit osobně a—\n\nBez varování se můj oř vzepne, polekaný drobným zvířetem na cestě. Málem mě prudce vyhodí ze sedla a kontrolu získám zpět až na poslední chvíli."
 harm.1012.a: "Hóó, děvče, klid..."
 harm.1012.a.tt: "#WEAK Tohle mohlo dopadnout ošklivě...#!"
 harm.1021.t.prefix: "Plné břicho"
 harm.1021.t: "$harm.1021.t.prefix$: Příliš mnoho"
 harm.1021.desc: "Večeře — nejlepší a nemluvě o tom také největší jídlo dne!\n\nAhhh, jak nádherná doba k životu: tolik různých struktur, tolik chutí, tolik bohatých vůní a— a—\n\nV břiše se mi něco svírá.\n\nBolest se rozrůstá jako nádor, stahuje mi žaludek a zároveň vysílá ledové prsty utrpení do ostatních útrob. Žádný zákeřný jed, jen příšerná směs vydatných jídel, která mi trhá vnitřnosti.\n\nCo jsem to jedl... #DIE1 já#!... #DIE2 eurgh#!..."
 harm.1021.a: "Já... necítím se dobře..."
 harm.1021.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1021.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1021.b: "Přineste studenou vodu — musím si lehnout. Hned."
 harm.1021.c: "Na tohle přece musíme mít nějaký lék!"
 harm.1021.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1021.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1022.t: "$harm.1021.t.prefix$: Ještě málo"
 harm.1022.desc: "[ROOT.Char.GetFaith.HouseholdGodName]! Už nemůžu ani sousto. Po večeři se rozvalím v křesle, poslouchám, jak si [ROOT.Char.Custom('GetCourtierPlural')|l] mezi sebou brebentí, a svět je pro jednou přesně takový, jaký má být.\n\nV poslední době se na večeři těším čím dál víc. Pohled, chutě, zvuky... a hlavně ten pocit, když mi po bradě stéká šťáva z masa a hustá omáčka.\n\nAlespoň dokud žaludek nezačne protestovat pod tíhou všeho toho vydatného jídla a lehké kručení nehrozí, že mi vyprázdní střeva.\n\nNaštěstí to odejde stejně rychle, jako to přijde. Většinou."
 harm.1022.a: "Ještě že to rychle přešlo."
 harm.1022.a.tt: "#WEAK Zpátky k večeři...#!"
 harm.1031.t.prefix: "Ucpané hrdlo"
 harm.1031.t: "$harm.1031.t.prefix$: Dušení"
 harm.1031.desc: "Rozpálený oheň v žilách mě vytrhne ze spánku, celé tělo palčivě křičí po vzduchu, po úlevě, po čemkoli.\n\nÚsta... hrdlo... ucpané? Nic v něm nevězí, ale cosi odporného se dere vzhůru zevnitř.\n\nVykašlávám husté žluté chuchvalce nasládle páchnoucího hnisu. Z každého vláknitého pramínku hlenu vane smrt a hnijící maso, ale stále se toho valí víc.\n\nPomoc. Potřebuji. #EMP Pomoc#!."
 harm.1031.a: "Nemůžu... dýchat..."
 harm.1031.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1031.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1031.b: "Jen to... dostat pod kontrolu. Dýchat. Než najdu... lékaře."
 harm.1031.c: "Klid. Krátké nádechy. K lékaři."
 harm.1031.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1031.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1032.t: "$harm.1031.t.prefix$: Potíže s dýcháním"
 harm.1032.desc: "[ROOT.Char.GetFaith.HealthGodName] mi pomáhej, tentokrát už ta bolest trvá celé #EMP dva dny#!.\n\nBolí mě čelist, hrdlo mám ochraptělé a podrážděné a vnitřek úst působí... otekle? Bolí jíst. Bolí polykat. Bolí dokonce i #EMP žvýkat#!.\n\nLékárník mě ujišťuje, že nejspíš není čeho se obávat, jen přirozená nerovnováha, která časem sama pomine.\n\nJá... doufám, že ano."
 harm.1032.a: "Takové věci obvykle přejdou."
 harm.1032.a.tt: "#WEAK Úleva přijde brzy...#!"
 harm.1041.t.prefix: "Poklidné vody"
 harm.1041.t: "$harm.1041.t.prefix$: Nevyhnutelná nehoda"
 harm.1041.desc: "Stráže jsem poslal z dohledu, ale zůstávají na doslech, a já si užívám chvíli samoty u [ROOT.Char.Custom('IndefiniteBodyOfWater_Static')|l], kolem které jsem už dříve projížděl.\n\nPonořím nohu do chladné vody a už samotný pocit, jak ze mě smývá prach celého dne, mě naplní blahem. Tohle bude koupel, na kterou se nezapomíná!\n\nBezmyšlenkovitě uklouznu, zakopnu a zřítím se tváří napřed do vody. Hlavou narazím do něčeho tvrdého a úder mě omráčí.\n\nTohle... tohle je hlubší, než jsem myslel. Něco mě táhne dolů, dolů do temnoty..."
 harm.1041.a: "Musím... se hýbat... nemůžu... dýchat..."
 harm.1041.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1041.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1041.b: "#EMP Musím přežít!#!"
 harm.1042.t: "$harm.1041.t.prefix$: Nejspíš bezpečné"
 harm.1042.desc: "Jen málokdy mám chvíli pro sebe, ale občas se to podaří. Tedy relativně pro sebe — opatrovníci zůstávají na doslech, ale dost daleko, aby mi při projížďce mými državami dopřáli trochu prostoru.\n\nNa chvíli zastavím u [ROOT.Char.Custom('IndefiniteBodyOfWater_Static')|l]. Je to odlehlé místo a nemyslím, že jsem tudy někdy projížděl... Je tu klid. Voda je očividně hluboká a drobné víry na hladině naznačují, že někam poblíž odtéká do většího toku.\n\nMožná se sem brzy vrátím."
 harm.1042.a: "Pěkné místo."
 harm.1042.a.tt: "#WEAK Rozhodně stojí za další návštěvu...#!"
 harm.1051.t.prefix: "Plápolající plameny"
 harm.1051.t: "$harm.1051.t.prefix$: Peklo"
 harm.1051.desc: "Ze spánku mě vytrhne výkřik „[ROOT.Char.GetTitledFirstNameNoTooltip]!“ zvenčí, zděšené varování jednoho ze sluhů.\n\nKdyž se prudce proberu, nejprve ucítím pot, který mi promočil celé tělo, a hned nato spalující žár. [ROOT.Char.Custom('GetRoom')|U] je v plamenech a kůže se mi už místy pokrývá puchýři!\n\nMusím se ods-*KAŠEL*-tud dostat, jak se to vůbec... #EMP zatracené svíčky#!!\n\nOheň blokuje vchod a plameny jen sílí."
 harm.1051.a: "Jediná cesta ven vede skrz!"
 harm.1051.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1051.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1051.b: "Okno! Tudy se dostanu ven nejrychleji!"
 harm.1052.t: "$harm.1051.t.prefix$: Při svíčce"
 harm.1052.desc: "Trhnu sebou a probudím se, přičemž okamžitě ucuknu rukou od hořící svíčky, na kterou mi sklouzla. [ROOT.Char.GetFaith.random_EvilGodNames] vědí, jak to pálí!\n\nRozespale se rozhlédnu po [ROOT.Char.Custom('GetRoom')|l]. Nejspíš jsem usnul, aniž bych svíčku zhasil — vlastně jsem měl štěstí, že na ni dopadla právě ruka.\n\nKdyby se převrhla na postel..."
 harm.1052.a: "S těmi svíčkami musím být opatrnější."
 harm.1052.a.tt: "#WEAK Tohle mohlo dopadnout mnohem hůř...#!"
 harm.1061.t.prefix: "To je výhled"
 harm.1061.t: "$harm.1061.t.prefix$: Pád dolů"
 harm.1061.desc: "Jako téměř každé ráno začínám den pohledem z okna své ložnice a nasávám obrazy i zvuky okolního světa.\n\nJak je tam venku všechno živé, plné světla a života, jak dokonale celé stvoření působí. Kdybych jen viděl o trochu víc z ptačí perspektivy, jen ještě kouse—\n\n#EMP Do prdele#!, moc daleko, #EMP kloužu!#!"
 harm.1061.a: "Chytit se rámu okna."
 harm.1061.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1061.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1061.b: "Chyť-#EMP chyť#!-CHYŤ!"
 harm.1061.c: "Vrhnout se dozadu."
 harm.1061.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1061.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1062.t: "$harm.1061.t.prefix$: Neškodný obdiv"
 harm.1062.desc: "To je ale nádherný den!\n\nStojím u okna svého pokoje, hledím na lidi pohybující se dole a na vzdálenou divočinu za nimi a zaplavuje mě radost z toho, že žiju. Osvěžený jsem připraven pustit se do dnešních povinností.\n\nAle... ještě trocha výhledu neuškodí. Dychtivě se nakloním z okna a vychutnávám si čerstvý vzduch proudící kolem vysoko položeného pokoje.\n\nA to už stačí."
 harm.1062.a: "Úchvatné!"
 harm.1062.a.tt: "#WEAK Krásný a naprosto neškodný začátek rána...#!"
 harm.1071.t.prefix: "Zločiny z vášně"
 harm.1071.t: "$harm.1071.t.prefix$: Čas jednat"
 harm.1071.desc: "[ROOT.Char.Custom('GetDoor')|U] se přede mnou málem rozletí na kusy. [other.GetTitledFirstName] jimi prchá, co nejrychleji dokáže, a srazí mě dozadu na zem.\n\nZa [other.GetFirstNameNoTooltip] zahlédnu záblesk stříbřité oceli a rozzuřenou tvář [killer.GetTitledFirstName], který se žene za svou obětí s nožem v ruce. Vztek na okamžik ochabne, když [killer.GetFirstNameNoTooltip] pochopí, že #EMP já nejsem#! zamýšleným cílem, ale výpad už nejde zastavit.\n\nHrot dýky se žene přímo k mému krku."
 harm.1071.a: "Uhnout noži."
 harm.1071.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1071.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1071.b: "Snadno se skrčit před čepelí."
 harm.1071.c: "Spolehnout se na reflexy."
 harm.1071.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1071.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1072.t: "$harm.1071.t.prefix$: Malá neshoda"
 harm.1072.desc: "„A ještě něco, ty [other.Custom2('InsultAdjective', SCOPE.sC('killer'))] [other.Custom2('InsultNoun', SCOPE.sC('killer'))]!“ ječí [killer.GetTitledFirstName] na [other.GetTitledFirstName] během snad už třetí hlasité hádky dnešního dne.\n\nNavzdory tomu rámusu jejich hašteření nevěnuji pozornost a pokračuji dál. Ti dva se hádají neustále, ale přes všechen křik je to nakonec neškodné.\n\nMám důležitější starosti než nějakou malichernou rozepři mezi lidmi u svého dvora."
 harm.1072.a: "Zkrátka další vzrušující den. [ROOT.Char.Custom('GetCourt')|U] nikdy nezklame, co?"
 harm.1072.a.tt: "#WEAK Je to jejich věc...#!"
 harm.1081.t.prefix: "Rozmarné počasí"
 harm.1081.t: "$harm.1081.t.prefix$: Hněv bouře"
 harm.1081.desc: "Ať je [ROOT.Char.GetFaith.WaterGodName] proklet! S mým doprovodem jsme vydáni napospas téhle příšerné bouři a může nás stát život!\n\nZ krátké pochůzky do nedaleké vesnice se během okamžiku stala strastiplná cesta. Jasný den potemněl, vichřice s námi cloumá, déšť do nás buší jako oblázky a oblohu protínají blesky za dunění hromu.\n\nJestli se brzy nedostaneme do úkrytu, chlad a mokro nás zabijí stejně jistě jako čepel."
 harm.1081.a: "Když pojedeme dost rychle, dostaneme se domů."
 harm.1081.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1081.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1081.b: "Tamta prohlubeň! Schováme se v ní!"
 harm.1081.c: "Já — myslím, že někde poblíž znám úkryt?"
 harm.1081.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1081.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1082.t: "$harm.1081.t.prefix$: Vzdálené dunění"
 harm.1082.desc: "Sleduji nezvykle prudké bouře valící se krajinou. Z pásu mraků vzdáleného sotva několik mil doléhá dunění hromu.\n\nNepříjemná průtrž — jsou ty deště znamením nějakého božského problému, který jsem nedokázal odvrátit, nebo jen nahodilým rozmarem větru?\n\nAť tak či onak, rozhodně v nich nechci uvíznout."
 harm.1082.a: "Snad [ROOT.Char.GetFaith.FateGodName] nevysílá nějaké znamení."
 harm.1082.a.tt: "#WEAK Teď není vhodná chvíle být venku...#!"
 harm.1091.t.prefix: "Bušící srdce"
 harm.1091.t: "$harm.1091.t.prefix$: Hořící mysl"
 harm.1091.desc: "#EMP [ROOT.Char.GetFaith.HighGodName], smiluj se nade mnou a zbav mě tohoto utrpení#!!\n\nCo je to za tepající muka, která mi drtí lebku na krvavé cáry, za spalující puls, který mi rozeznívá žíly do rytmu [ROOT.Char.GetFaith.DevilNamePossessive] bubnu...\n\nJeště před chvílí mi nic nebylo, pak jsem bez varování začal dávit a teď... #EMP aggggh#!, ať to přestane, ať to přestane, #BER AŤ TO PŘESTANE#!!\n\nP-prosím. #DIE1 Ať to#! #DIE2 přestane#!."
 harm.1091.a: "#EMP Má mysl?!#!"
 harm.1091.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1091.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1091.b: "Já. To. Vydržím."
 harm.1091.c: "Jasná mysl, jasná mysl, potřebuji #EMP jasnou mysl#!."
 harm.1091.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1091.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1092.t: "$harm.1091.t.prefix$: Bolavá mysl"
 harm.1092.desc.intro: "Poslední dva týdny mě sužují takové... #EMP tepající#! migrény.\n\n"
 harm.1092.desc.blind: "Nedokážu myslet, nedokážu se soustředit, sotva slyším — zvuky jako by úplně mizely, pokud nejsou velmi vysoké nebo hluboké.\n\n[ROOT.Char.GetFaith.HealthGodName|U] si ze mě snad krutě utahuje, když mě trestá bolestmi hlavy, které propustí jen dětský křik a koňské řehtání."
 harm.1092.desc.fallback: "Když záchvat udeří, zorné pole se mi začne zužovat. Obraz i světlo mizí, až mi zůstane jen malý kousek světa na samém okraji zaostření, podbarvený neutuchajícím pramenem bolesti.\n\n[ROOT.Char.GetFaith.HealthGodName|U] se mým utrpením očividně baví, protože záchvaty přicházejí se znepokojivou pravidelností."
 harm.1092.a: "Ugh, moje hlava..."
 harm.1092.a.tt: "#WEAK Možná by ses měl trochu šetřit...#!"
 harm.1101.t.prefix: "Rušné město"
 harm.1101.t: "$harm.1101.t.prefix$: Pozor!"
 harm.1101.desc: "Znovu projíždím ulicemi města. [ROOT.Char.GetCurrentLocation.GetName] kolem mě kypí životem a můj doprovod za mnou hrdě nese mou korouhev. Drobnost ve městě si vyžádala mou pozornost, a tak jsme tu strávili celý den, ale už toužím po pohodlí domova.\n\nKdyž dorazíme ke křižovatce, rozptýlí mě pochechtávání skupinky mladých obdivovatelů. Rachot rychle se blížícího vozu proto zaslechnu až ve chvíli, kdy jeho vozka zděšeně vykřikne."
 harm.1101.a: "Pokusit se uskočit."
 harm.1101.a.tt.success: "Za tebou zazní ohlušující rána a vyděšené zaržání"
 harm.1101.a.tt.failure: "Svět se promění v změť roztříštěného dřeva a zpřelámaných končetin"
 harm.1101.b: "Přitisknout koně ještě blíž ke zdi."
 harm.1101.c: "Vrhnout se vpřed a doufat."
 harm.1101.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1101.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1102.t: "$harm.1101.t.prefix$: Bezpečnost v ulicích"
 harm.1102.desc: "S doprovodem projíždím ulicemi města a zachovávám důstojnou tvář. [ROOT.Char.GetCurrentLocation.GetName] musí čas od času spatřit svého vládce, ale stejně důležité je působit autoritativně.\n\nNa rušné křižovatce zastavíme, zatímco kolem nás s rachotem prosviští vůz, až nebezpečně rychle.\n\nVozka má štěstí — zkřížit cestu [ROOT.Char.GetTitleAsNameNoTooltip] není moudré, ale jeho kůň se žene příliš rychle, než aby si vůbec něčeho všiml, natož zastavil."
 harm.1102.a: "Prostý lid musí svého [ROOT.Char.GetTitleAsNameNoTooltip] čas od času spatřit."
 harm.1102.a.tt: "#WEAK Třeba jen při projížďce kolem jejich příbytků...#!"
 harm.1111.t.prefix: "Vláda hrůzy"
 harm.1111.t: "$harm.1111.t.prefix$: Spravedlnost lidu"
 harm.1111.desc: "Když procházím svým dvorem, vždy mě kvůli bezpečnosti doprovázejí stráže. Další střeží vchod a samozřejmě také [ROOT.Char.Custom('GetChamber')|l]. Dost mužů na zastavení jakéhokoli vetřelce, ale očividně ne dost na to, aby zabránili zatracenému sluhovi vrazit do mě a—\n\nBolest. Ostrá, doslova bodavá bolest. Z břicha mi už tryská krev, zatímco vrávorám dozadu a z těla mi trčí sluhův nůž.\n\nMí strážci se na [killer.GetFirstNameNoTooltip] vrhnou během několika vteřin a rozsekají atentátníka na zemi. [killer.GetFirstNameNoTooltip] se samolibě šklebí i v posledních okamžicích života — není pochyb, že šlo o čistě osobní útok.\n\nKaždý chce zemřít jako hrdina."
 harm.1111.a: "Gah, je se mnou konec!"
 harm.1111.a.tt.success: "$harm.0000.tt.death.success$"
 harm.1111.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1111.b: "Na zabití #EMP mě#! bude třeba víc."
 harm.1111.c: "#EMP Další#! atentátník? Ubohé!"
 harm.1111.c.tt.dread: "Tuto možnost zpřístupňuje vysoká [Concept('dread','hrůza')|E]"
 harm.1111.c.tt.success: "$harm.0000.tt.death.success$"
 harm.1111.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.1112.t: "$harm.1111.t.prefix$: Vyděšená poslušnost"
 harm.1112.desc: "Když zabočím za roh a stráže mi věrně kráčejí v patách, málem do mě vrazí sluha nesoucí mísu.\n\nNa poslední chvíli uskočí stranou a jen tak tak mi nevylije opařující polévku přímo do tváře.\n\n„Dívej se, kam jdeš!“ zavrčí jeden z mého doprovodu.\n\nSluha horlivě přikyvuje, příliš vyděšený na to, aby promluvil, a pak rychle zmizí opačným směrem. Přesně taková reakce se po tak závažném pochybení sluší."
 harm.1112.a: "Mohlo to dopadnout hůř."
 harm.1112.a.tt: "#WEAK Dnes už člověk pořádné služebnictvo nesežene...#!"
 harm.2001.t: "Táborová horečka"
 harm.2001.desc: "K čertu s celým [ROOT.Char.GetCurrentLocation.GetName]! Jaká je to pekelná ironie, že obléhání má vyčerpat obránce, zatímco obléhací #EMP tábory#! jsou samy žumpami špíny a nemocí?\n\nDnes ráno mě probudily bouřící se útroby a tekutý oheň proudící břichem. Všechno ze mě uniká každým otvorem a už se nedokážu ani postavit.\n\nTakhle jsem zemřít nechtěl."
 harm.2001.a: "Moje — moje útroby... eurgh... "
 harm.2001.a.tt.success: "$harm.0000.tt.death.success$"
 harm.2001.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2001.b: "Tady můj konec nebude."
 harm.2001.c: "Vím, co potřebuji. Přineste mi... přineste..."
 harm.2001.c.tt.success: "$harm.0000.tt.death.success$"
 harm.2001.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2011.t: "Neduh na pochodu"
 harm.2011.desc: "Už téměř týden mě sužuje bolest — studený pot a spalující horečka, bouřící se útroby a třesoucí se ruce. Nevím, co jsem chytil, ale je zřejmé, že za tím stojí podmínky na pochodu a v našich nočních táborech.\n\nI teď se mi před očima všechno rozplývá, ale musím pokračovat.\n\nMusím. Jít dál. Musíme... dál..."
 harm.2011.a: "Proč se... co je..."
 harm.2011.a.tt.success: "$harm.0000.tt.death.success$"
 harm.2011.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2011.b: "Co snesou mí vojáci, snesu i já."
 harm.2011.c: "Už jsem překonal i horší věci... ne?"
 harm.2011.c.tt.success: "$harm.0000.tt.death.success$"
 harm.2011.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2021.t: "Taková... zima..."
 harm.2021.desc: "V takovém mrazu se nemá válčit. Nemá. Každý večer v táboře kopeme nové hroby pro ty, o které přijdeme do rána, pro ty, které musíme zanechat za sebou, ale jejichž těla nesmějí padnout napospas hejnům bezcitných vran.\n\nSkoro jim závidím. Jejich boj skončil. Už nemusejí čelit tomuhle nesmyslnému #EMP mrazu#!.\n\nZimní chlad mě proniká až do morku kostí, neustále mi přerušuje myšlenky otupujícími záchvěvy bolesti, nedopřává mi odpočinek ani soustředění.\n\nMožná... možná by bylo lepší, kdyby..."
 harm.2021.a: "..."
 harm.2021.a.tt.success: "$harm.0000.tt.death.success$"
 harm.2021.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2021.b: "Já. Mám. Vyšší poslání."
 harm.2021.c: "Takhle. Neskončím."
 harm.2021.c.tt.success: "$harm.0000.tt.death.success$"
 harm.2021.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2031.t: "Takové... horko..."
 harm.2031.desc: "Bylo slunce vždycky tak jasné? Tak žhavé? Tak nesnesitelné?\n\nUž ani nevím, jak dlouho putujeme touhle prokletou zemí. Dobrá voda je vzácná a přesto musíme dál.\n\nTažení nás nutí pokračovat, ale každý den z nás vysaje o trochu víc sil. O trochu víc vypotíme a necháme vsáknout do věčně žíznivé země. O trochu víc z nás navždy pohltí ten bezduchý žár.\n\nKaždý jeden den."
 harm.2031.a: "Tyranie světla a žízně nás ničí..."
 harm.2031.a.tt.success: "$harm.0000.tt.death.success$"
 harm.2031.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2031.b: "Já. Mám. Vyšší poslání."
 harm.2031.c: "Nejsem [ROOT.Char.GetFaith.DeathDeityNamePossessive] hlupák."
 harm.2031.c.tt.success: "$harm.0000.tt.death.success$"
 harm.2031.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2041.t: "Za panství"
 harm.2041.desc: "Dokonce i já už téměř ztrácím přehled o tom, kolik let vlastně válčíme. Tažení je náročné pro nás všechny, každý den si bere o něco víc a večerní tábor poskytuje jen nepatrnou úlevu.\n\nPo poradě se zásobovačem se vracím ke svému stanu a okolí mi připadá podivně opuštěné. Žádné unavené stráže, žádní zahořklí žoldnéři, žádní domov postrádající odvedenci. Opuštěné je však jen do chvíle, než ze stínů ze všech stran vystoupí půl tuctu ozbrojených vojáků v kroužkové zbroji.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip],“ procedí vůdce vzbouřenců, „za tvé pošetilé války jsme všichni zaplatili příliš vysokou cenu. Tentokrát ji zaplatíš #EMP ty#!.“"
 harm.2041.a: "Zrádci! ZRÁDCI!"
 harm.2041.a.tt.success: "$harm.0000.tt.death.success$"
 harm.2041.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2041.b: "Jen šest? Tak pojďte, vy bábovky!"
 harm.2041.c: "#BER ZA TOHLE ZAPLATÍTE KRVÍ!#!"
 harm.2041.c.tt.success: "$harm.0000.tt.death.success$"
 harm.2041.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2051.t: "Hladovění"
 harm.2051.desc: "Máloco dokáže zničit vojsko tak důkladně jako hlad — žádný štít jej nezadrží, žádná čepel jej neodrazí a žádná zbroj neztlumí jeho muka.\n\nBez jídla, bez vody, bez čehokoli, co by nás udrželo v chodu kromě soumarů, kteří nám ještě umožňují pokračovat, se mé vojsko pomalu zastavuje.\n\nDokonce... dokonce i já... bez potravy chřadnu..."
 harm.2051.a: "Má kůže... jako papír..."
 harm.2051.a.tt.success: "$harm.0000.tt.death.success$"
 harm.2051.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2051.b: "Situaci lze ještě zachránit."
 harm.2051.c: "Musíme mít zásoby, #EMP musíme#!!"
 harm.2051.c.tt.success: "$harm.0000.tt.death.success$"
 harm.2051.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2061.t: "Pronásledován na každém kroku"
 harm.2061.desc: "Mé vojsko prchá z bojiště a krajina kolem [ROOT.Char.GetCurrentLocation.GetName] je na celé míle plná skupinek vojáků, kteří bojují, utíkají nebo pronásledují nepřítele. Má družina se rozpadla, stráže jsou mrtvé nebo uprchly a já prchám spolu s nimi.\n\nKdybychom se jen dokázali znovu shromáždit, kdybychom jen—\n\nOběhnu velký balvan a přímo přede mnou stojí skupina vojáků v barvách nepřítele.\n\nVycení zuby a s řevem se na mě vrhnou."
 harm.2061.a: "Táhněte ode mě, parchanti!"
 harm.2061.a.tt.success: "$harm.0000.tt.death.success$"
 harm.2061.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2061.b: "PRYČ!"
 harm.2061.c: "Zatrubte na roh! [ROOT.Char.GetTitleAsNameNoTooltip] potřebuje pomoc!"
 harm.2061.c.tt.success: "$harm.0000.tt.death.success$"
 harm.2061.c.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2071.t: "Zhoubné vítězství"
 harm.2071.desc: "Mé vítězné vojsko ovládá bojiště. [ROOT.Char.GetCurrentLocation.GetName] se rozléhá triumfálním jásotem a pokřiky mých vojáků, zatímco dorážíme prchajícího nepřítele.\n\nI já se svou družinou se nechávám strhnout plodným krveprolitím a opájím se vítězstvím. Trochu nás to rozptýlí, jistě, ale nepřítel je poražený a nemůže—\n\nKde jsou mé stráže? Vojáci kolem mě... nesou korouhev [actor.GetPrimaryTitle.GetNameNoTier]! S nenávistí v očích a krví na zubech se poražený nepřítel vrhá přímo na mě, odhodlaný skoncovat se mnou."
 harm.2071.a: "[ROOT.Char.GetFaith.DeathDeityName] si na mě ještě počká!"
 harm.2071.a.tt.success: "$harm.0000.tt.death.success$"
 harm.2071.a.tt.failure: "$harm.0000.tt.death.failure$"
 harm.2071.b: "PRYČ!"
 harm.2071.c: "Sem! [ROOT.Char.GetTitleAsNameNoTooltip] potřebuje ochranu!"
 harm.2071.c.tt.success: "$harm.0000.tt.death.success$"
 harm.2071.c.tt.failure: "$harm.0000.tt.death.failure$"
