l_polish:
 fire_court_physician_effect.tt: "[THIS.Char.GetShortUIName] již nezastává funkci [GetCourtPositionType('court_physician_court_position').GetName()]"
 health.0001.desc: "Má rána se zahojila"
 health_wounded_title: "Zranění:"
 health.0002.t: "$health_wounded_title$ Hojení"
 health.0002.desc: "Má zranění se pomalu hojí a bolest už není mou neustálou společnicí. Ještě nemám plné síly, ale dnes už zvládnu mnohé, co bylo ještě před měsícem nemožné."
 health.0002.a: "Těším se, až se zcela zotavím."
 health.0003.t: "$health_wounded_title$ O vlásek uniknout smrti"
 health.0003.desc: "Zdá se, že to nejhorší už pominulo. Zející rány se mi začínají zacelovat a zlomené kosti pomalu srůstají."
 health.0003.a: "Možná to přece jen přežiju."
 health.0004.t: "$health_wounded_title$ Žár ustupuje"
 health.0004.desc: "Kůže kolem rány ztvrdla, ale palčivá bolest konečně ustoupila. Zdá se, že nákaza je pryč."
 health.0004.a: "[ROOT.Char.GetFaith.HealthGodName]! Tobě díky."
 health.wounded_1_success: "Úspěšné ošetření rány"
 health.wounded_1_failure: "Neúspěšné ošetření rány"
 health.0102.t: "$health_wounded_title$ Hluboká rána"
 health.0102.desc: "Při každém kroku mi tělem vystřeluje bolest a i ten nejmenší pohyb mě nutí lapat po dechu. Když si opatrně přiložím ruku k ráně, odtáhnu ji celou od krve a rozechvěle sleduji, jak mi krev stéká po boku."
 health.0102.court_physician.desc: "\n\n„Žádné obavy, [ROOT.Char.Custom('FormOfAddressForLiege')]. Vaše rána je hluboká, ale mé znalosti sahají ještě hlouběji.“"
 health.0102.a: "Jen si potřebuji na chvíli sednout..."
 health.0104.t: "$health_wounded_title$ Těžké zranění"
 health.0104.desc: "Je to kost, co vidím zabodnutou ve svém mase, nebo něco, co by mělo být ukryto ještě hlouběji? Kůže se rozevírá jako hladová tlama smrti a já jen strnule hledím na proud krve, který se z ní valí."
 health.0104.court_physician.desc: "\n\n„Vaše zranění je velmi vážné, [ROOT.Char.Custom('FormOfAddressForLiege')]. Musíme vás okamžitě ošetřit!“"
 health.0104.a: "[ROOT.Char.GetFaith.HealthGodName|U]! Zbav mě této bolesti!"
 health.0201.desc: "Zanícená rána"
 health.0202.t: "$health_wounded_title$ Nákaza zevnitř"
 health.0202.desc: "Mám pocit, jako by mi ránu protínalo sto nožů! Maso černá a krev bledne, takže je jasné, že se rána zanítila."
 health.0202.unintelligent: "Kdykoli se dotknu okolí rány, jako by mi kůži řezala spousta nožů. Maso je citlivé a myslím, že krev nemá správnou barvu."
 health.0202.court_physician.desc: "\n\n„Vaše rána se zanítila, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ale nebojte se, společně to zvládneme.“"
 health.0202.a: "Doufám, že to přežiju."
 health.0203.desc: "Rána zachvácená snětí"
 health.0204.t: "$health_wounded_title$ Chmurné zprávy"
 health.0204.desc: "Rána má bolet a ani otok není nic neobvyklého, a tak jsem se domníval, že se hojí. Teď se mi však na kůži objevily puchýře a zarudnutí začíná černat. Mé tělo mi hnije před očima!"
 health.0204.court_physician.desc: "\n\n„Dostala se vám do rány sněť, [ROOT.Char.Custom('FormOfAddressForLiege')]. To je velice vážné... Musíme vás okamžitě ošetřit!“"
 health.1001.t: "[SCOPE.Custom('EventTitleDisease')]: Mé smrtelné tělo"
 health.1001.desc: "Ať mi říkají [ROOT.Char.GetTitleAsNameNoTooltip] nebo mě řadí mezi prostý lid, na tom nezáleží. Nakonec jsme všichni smrtelní.\n\nPřipomnělo mi to dnešní časné ráno, kdy jsem se [Select_CString(ROOT.Char.IsFemale, 'probudila', 'probudil')] s kašlem a tupou bolestí tepající v hlavě a hrdle. Tělem mi zmítá třes a slabost a ze všech otvorů v hlavě mi něco teče.\n\n"
 health.1001.nophysician.desc: "Přece musí být někdo, kdo mě toho prokletého neduhu zbaví..."
 health.1001.court_physician.desc: "„To sípání je slyšet přes celý [ROOT.Char.Custom('GetCourt')], [ROOT.Char.Custom('FormOfAddressForLiege')]!“ [physician.GetFirstName], [Select_CString(physician.IsFemale, 'má lékařka', 'můj lékař')], strčí hlavu dovnitř; [ROOT.Char.Custom('GetChamber')] už mi neposkytuje ani trochu soukromí. „Pokud bude třeba, znám pěknou řádku vhodných léků.“"
 health.1001.a: "Chci jen zůstat v posteli..."
 health.1001.b: "Musím se #EMP okamžitě#! vrátit domů!"
 health.1002.t: "[SCOPE.Custom('EventTitleDisease')]: Ostré jako nůž"
 health.1002.desc: "Dýchání je tak snadná a úžasná věc — malý zázrak, nad kterým se člověk málokdy byť jen na okamžik zamyslí. Teď, když se snažím udržet dech klidný a po záchvatech kašle přichází bodavá bolest na hrudi, na nic jiného téměř nedokážu myslet."
 health.1002.court_physician.desc: "\n\n[Select_CString(physician.IsFemale, 'Má lékařka', 'Můj lékař')] [physician.GetFirstName] si mě prohlíží od hlavy k patě. „Je to zápal plic, [ROOT.Char.Custom('FormOfAddressForLiege')]. To není radno brát na lehkou váhu. Jak budeme postupovat?“"
 health.1002.a: "Prosím, ať tohle není můj konec!"
 health.1003.t: "[SCOPE.Custom('EventTitleDisease')]: Cena požitkářství"
 health.1003.court_amenities_gout.desc: "Můj stůl je proslulý přepychem a nekonečnými porcemi jídla. Když mi začínají otékat nohy, dochází mi, že mnozí z nás se možná budou muset připravit i na nekonečnou bolest."
 health.1003.desc: "Říkají tomu „nemoc králů“, jako by na mých oteklých a bolavých kloubech bylo něco přepychového či záviděníhodného.\n\nObzvlášť palec na noze mám bolestivě oteklý, takže při chůzi kulhám.\n\nKdyž bolest dosáhne vrcholu, nemohu si pomoci a přeji si být jen [Select_CString(ROOT.Char.IsFemale, 'prostou selkou', 'prostým sedlákem')]."
 health.1003.court_physician.desc: "\n\n[Select_CString(physician.IsFemale, 'Má lékařka', 'Můj lékař')] [physician.GetFirstName] položí vedle mě několik mastí. „Máte můj soucit, [ROOT.Char.Custom('FormOfAddressForLiege')]. Mám několik nápadů, které by mohly zmírnit příznaky vaší dny.“"
 health.1003.a: "Sem s mastmi! Rychle!"
 health.1004.t: "[SCOPE.Custom('EventTitleDisease')]: Odvrácené pohledy"
 health.1004.desc: "První příznaky byly nenápadné a [Select_CString(ROOT.Char.IsFemale, 'rychle jsem je pustila z hlavy', 'rychle jsem je pustil z hlavy')]. Možná za tím byl jen strach spatřit pravdu. Ale tuhle příšernou skvrnu na tváři, tu lézi... Tu už přehlížet nedokážu.\n\nMé rozkazy stále plní [ROOT.Char.Custom('GetCourtierPlural')|l], ale v jejich pohledech se něco změnilo. Je to strach? Lítost? Odpor?"
 health.1004.court_physician.desc: "\n\n„Je mi líto — malomocenství je trvalé onemocnění, [ROOT.Char.Custom('FormOfAddressForLiege')]. Znám však způsoby, jak zmírnit jeho příznaky.“"
 health.1004.a: "Čím jsem si tuhle kletbu zasloužil?"
 health.1005.t: "[SCOPE.Custom('EventTitleDisease')]: Táborová horečka"
 health.1005.desc: "Slýchám příběhy o statečných vojácích, kteří umírají jako mouchy ještě dřív, než vůbec vstoupí na bojiště. Ale já, [ROOT.Char.GetTitleAsNameNoTooltip]? Tahle bolestivá horečnatá noční můra přece nemůže být mým osudem.\n\nKdyž se mi další jídlo dere zpátky hrdlem, modlím se za spásu a v nozdrách mě pálí ostrý zápach žluči."
 health.1005.court_physician.desc: "\n\n„Nebojte se, [ROOT.Char.Custom('FormOfAddressForLiege')]! Skvrnitý tyfus se dá léčit, ujišťuji vás.“"
 health.1005.a: "Prosím, ať už to skončí!"
 health.1006.t: "[SCOPE.Custom('EventTitleDisease')]: Kousek po kousku"
 health.1006.desc: "Karmínová skvrna ostře vystupuje na bledé látce. Nevěřícně na ni zírám a potlačuji další záchvat kašle. To snad...? To jsem...?\n\nOtřu si prsty o rty a s třesoucí se rukou je odtáhnu. Cítím na nich teplou vlhkost, ale děsím se pohledu."
 health.1006.court_physician.desc: "\n\n„Obávám se, že jste [Select_CString(ROOT.Char.IsFemale, 'onemocněla', 'onemocněl')] souchotinami, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ihned vás začnu léčit.“"
 health.1006.a: "Je mým osudem pomalu chřadnout?"
 health.1007.t: "[SCOPE.Custom('EventTitleDisease')]: Cizinec uvnitř"
 health.1007.desc: "Uvnitř mě je něco, co ke mně nepatří. Prožírá se to mým masem a živí se mou životní silou. Zatímco já chřadnu, ono sílí.\n\nTlačím rukama na výrůstek pod kůží a prsty mě svrbí touhou vyrvat ho ven. Jen při pomyšlení, že dál roste, se mi zvedá žaludek."
 health.1007.court_physician.desc: "\n\n„Ano, bohužel je to rakovina. Znám pouze jednu účinnou léčbu...“"
 health.1007.a: "Proti tomuto nepříteli nelze zvítězit."
 health.1008.t: "[SCOPE.Custom('EventTitleDisease')]: Žár lásky"
 health.1008.desc: "Pálení v rozkroku bylo čím dál nesnesitelnější, až nezbylo než se omluvit a utéct do soukromí — [ROOT.Char.Custom('GetChamber')]. Konečně o samotě jsem se [Select_CString(ROOT.Char.IsFemale, 'začala', 'začal')] škrábat v naději na úlevu.\n\nŽádná úleva však nepřišla — prsty narazily na puchýře a rozdrásaly je!"
 health.1008.partner.a: "[infecting_partner.GetFirstNameNoTooltip]...!"
 health.1008.no_partner.a: "Jak? Kdo?!"
 health.1013.t: "[SCOPE.Custom('EventTitleDisease')]: Velká příjice"
 health.1013.desc: "[Select_CString(ROOT.Char.IsFemale, 'Myslela jsem', 'Myslel jsem')], že je to jen pár puchýřů. Bylo mi z nich špatně a proklínal jsem svou smůlu, ale nikdy mě nenapadlo, že se to ještě zhorší. Teď se mi po těle šíří rudá vyrážka.\n\nVím, co přijde dál. Vředy, horečka, všemožné bolesti a chátrání. A nakonec — pokud se toho vůbec dožiji — přijdu o rozum."
 health.1013.court_physician.desc: "\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]. Tohle... nevypadá dobře. Podívám se, co se s tím dá dělat.“"
 health.1013.partner.a: "[Select_CString(infecting_partner.IsFemale, 'Proklela', 'Proklel')] jsi mě, [infecting_partner.GetFirstNameNoTooltip]."
 health.1013.no_partner.a: "Spočívá na mně kletba. Skutečná a naprostá."
 health.1014.t: "[SCOPE.Custom('EventTitleDisease')]: Sestup"
 health.1014.desc: "Kde to jsem?\n\nZírám do prázdné chodby přede mnou, srdce mi buší a ruce se třesou. Jak jsem se sem [Select_CString(ROOT.Char.IsFemale, 'dostala', 'dostal')]? Má mysl je... roztříštěná. Vidím obrazy — schody, pád, stíny v rozích — ale nedokážu je spojit dohromady.\n\nNěkdo mě sleduje.\n\nPrudce se otočím, ale přede mnou je zase jen prázdno."
 health.1014.a: "Nebojím se tě. Slyšíš mě?! NEBOJÍM!"
 health.1010.t: "[SCOPE.Custom('EventTitleDisease')]: Rudý mor"
 health.1010.desc: "S první vlnou horečky a zvracení jsem zoufale [Select_CString(ROOT.Char.IsFemale, 'doufala', 'doufal')], že to není nic horšího než potivá nemoc. A skutečně se mi trochu ulevilo; [Select_CString(ROOT.Char.IsFemale, 'vstala jsem z postele a vrátila se ke svým povinnostem', 'vstal jsem z postele a vrátil se ke svým povinnostem')]. Celý týden bylo všechno v pořádku — dokud se mi v ústech neobjevily první rudé skvrny."
 health.1010.end.desc: "\n\nTo bylo před dvěma dny a teď se mi po kůži šíří nezaměnitelné léze..."
 health.1010.court_physician.desc: "\n\n„Ano, tyto léze jsou neklamným příznakem pravých neštovic. Bez léčby jsou velice nebezpečné.“"
 health.1010.a: "[ROOT.Char.GetFaith.HealthGodName]! Prosím tě, ještě ne! Ještě [Select_CString(ROOT.Char.IsFemale, 'nejsem připravená', 'nejsem připravený')]!"
 health.1011.t: "[SCOPE.Custom('EventTitleDisease')]: Dotek Smrti"
 health.1011.desc: "Strach z moru mě provází celý život. Chůva mi v dětství před spaním vyprávěla děsivé příběhy o zduřelých dýmějích a černajících končetinách.\n\nMor už ale není jen strašidelný příběh. Opatrně zatlačím prsty na bouli v podpaží. Temná a smrtící síla poskvrňuje mé maso a požírá mě zaživa."
 health.1011.court_physician.desc: "\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], udělám vše, co je v mých silách, ale možná by bylo moudré připravit se na nejhorší...“"
 health.1011.a: "Ó, [ROOT.Char.GetFaith.HealthGodName]! Zachraň mě před touhle noční můrou!"
 health.travel.t: "[SCOPE.Custom('EventTitleDisease')]: Konec cesty?"
 health.travel.option.home: "Doma se mi dostane té nejlepší péče."
 health.travel.option.home.flavor: "[ROOT.Char.GetInvolvedActivity.GetNameNoTooltip] pro tebe končí a vydáváš se na cestu domů"
 health.travel.option.continue: "Musíme pokračovat dál."
 health.1101.t: "[SCOPE.Custom('EventTitleDisease')]: Zase ve své kůži"
 health.1101.desc: "Dnes ráno mě přivítaly první sluneční paprsky a chvíli mi trvalo, než mi došlo, že jsem poprvé po několika týdnech opravdu klidně spal. Ani jednou mě neprobudil kašel!\n\nCesta zpět ke zdraví byla dlouhá, ale konečně se znovu hřeji v jeho hřejivém objetí."
 health.1101.a: "Jaká úleva, zase mi nic není."
 health.1102.t: "[SCOPE.Custom('EventTitleDisease')]: Síly se mi vracejí"
 health.1102.desc: "Musím přiznat, že jsem se chvílemi [Select_CString(ROOT.Char.IsFemale, 'bála', 'bál')] o život, ale teď už je ta úzkost jen bledou vzpomínkou. S vděčností se zhluboka nadechnu a připravím se na nadcházející den."
 health.1102.a: "Je čas dobýt svět!"
 health.1103.t: "[SCOPE.Custom('EventTitleDisease')]: Bez bolesti"
 health.1103.desc: "[Select_CString(ROOT.Char.IsFemale, 'Musela jsem', 'Musel jsem')] se omezovat a vzdát se mnoha životních požitků, ale takovou oběť bych [Select_CString(ROOT.Char.IsFemale, 'ochotně podstoupila', 'ochotně podstoupil')] znovu. Život přece nabízí i jiné radosti než jen jídlo a pití!\n\nTeď, když už mě bolest nesvazuje, se jim konečně mohu oddávat."
 health.1103.a: "Střídmost se vyplatila!"
 health.1105.t: "[SCOPE.Custom('EventTitleDisease')]: Vyhraná bitva"
 health.1105.desc: "Na rozdíl od mnoha přede mnou mi síly stačily, abych přežil řádění obávané táborové horečky. Byla to krutá zkouška, to nepopírám, ale [Select_CString(ROOT.Char.IsFemale, 'vydržela jsem', 'vydržel jsem')]!"
 health.1105.a: "Žiju a budu bojovat dál!"
 health.1106.t: "[SCOPE.Custom('EventTitleDisease')]: Druhá šance"
 health.1106.desc: "Tělo mi vyhublo, kašel neustával a krev tekla. Zdálo se, že ze mě nakonec nic nezbude. Dokonce i vstát z postele bylo téměř nad mé síly.\n\nMé zdraví a síla se však vracely, byť velmi pomalu. Konečně jsem [Select_CString(ROOT.Char.IsFemale, 'připravená', 'připravený')] postavit se světu a všem jeho nástrahám."
 health.1106.a: "Je čas dobýt svět!"
 health.1107.t: "[SCOPE.Custom('EventTitleDisease')]: Lékařský zázrak"
 health.1107.desc: "Říkají, že jsem hotový zázrak. Z něčeho takového se přece lidé neuzdravují.\n\nJenže já se cítím dobře a boule je pryč. Není pochyb — [Select_CString(ROOT.Char.IsFemale, 'vyléčila jsem se', 'vyléčil jsem se')] z rakoviny."
 health.1107.a: "Užiju si života naplno!"
 health.1109.t: "[SCOPE.Custom('EventTitleDisease')]: Velká úleva"
 health.1109.desc: "[Select_CString(ROOT.Char.IsFemale, 'Bála jsem se', 'Bál jsem se')], že mě velká příjice připraví o život, ale zdá se, že jsem tento boj [Select_CString(ROOT.Char.IsFemale, 'vyhrála', 'vyhrál')]. Už mnoho měsíců nemám žádné příznaky. Je načase přestat se neustále strachovat."
 health.1109.a: "Užiju si života naplno!"
 health.1110.t: "[SCOPE.Custom('EventTitleDisease')]: [ROOT.Char.GetFaith.DeathDeityName] odchází s prázdnou"
 health.1110.desc: "Jizvy možná zůstanou, na kůži i v mysli, ale zdá se, že nemoc mé tělo opustila. Přežiju. Ještě mám čas."
 health.1110.a: "[ROOT.Char.GetFaith.HealthGodName]! Tobě sláva! Jsem [Select_CString(ROOT.Char.IsFemale, 'zdravá', 'zdravý')]!"
 health.1110.a.tt: "Nyní získáváš imunitu a [GetTrait('smallpox').GetName( GetNullCharacter )] už na teba nemůže"
 health.1111.t: "[SCOPE.Custom('EventTitleDisease')]: Navzdory všemu"
 health.1111.desc: "Zdá se mi, jako by mou branou prošla sám [ROOT.Char.GetFaith.DeathDeityName]. Chvíli prodléval u mého lůžka, ale nakonec se rozhodl nechat mě žít. Nikdy nezapomenu na muka jejího doteku, přesto mi otevřel oči a ukázal zázrak života.\n\nMor si vyžádal mnoho duší, ale ta má mezi nimi nebude."
 health.1111.a: "[ROOT.Char.GetFaith.HealthGodName]! Tobě chvála za tento zázrak!"
 health.1111.a.tt: "Nyní získáváš imunitu a [GetTrait('bubonic_plague').GetName( GetNullCharacter )] už na teba nemůže"
 health.2001.t: "[SCOPE.Custom('EventTitleDisease')]: Ošklivé překvapení"
 health.2001.start.desc: "Vklouznu pod přikrývku, kde už čeká [std_partner.GetFirstName], a s hrůzou zjistím, že má na nejintimnějších místech mokvající puchýře!"
 health.2001.not_sick.desc: "Jak může [std_partner.GetFirstName] přinést do našeho lože něco tak odporného?"
 health.2001.sick.desc: "Je to snad moje vina?"
 health.2001.a.not_sick: "Vypadni z mé postele, ty [std_partner.Custom2('InsultNounSexual', ROOT.Char)]!"
 health.2001.a.sick: "Snad mi [std_partner.GetFirstNameNoTooltip] odpustí, ale takhle spolu lože sdílet nemůžeme."
 health.2001.c.not_sick: "Jen pomyšlení, že se tě mám dotknout... Nemůžu!"
 health.2001.c.sick: "Snad mi [std_partner.GetFirstNameNoTooltip] odpustí, ale takhle už dál nemůžeme."
 health.2001.d.not_sick: "[std_partner.GetFirstNameNoTooltip] si zaslouží mé odpuštění."
 health.2001.d.sick: "Má lásko, ani nedokážu vyjádřit, jak moc mě to mrzí!"
 health.2001.c.tt: "[std_partner.GetFirstNamePossessive] lože navštěvuji i nadále, přestože tím riskuji nákazu"
 health.2001.c.tt_sick: "[std_partner.GetFirstNamePossessive] lože navštěvuji i nadále"
 health.2002.t: "[SCOPE.Custom('EventTitleDisease')]: Ještě horší"
 health.2002.start.desc: "[std_partner.GetFirstName] stále tvrdí, že jde jen o puchýře, ale teď se konečně ukázala pravda. Po kůži se šíří rudá vyrážka — neklamná známka velké příjice."
 health.2002.early_great_pox.desc: "\n\nZnamená to snad...?"
 health.2002.a.not_sick: "Drž se ode mě dál!"
 health.2002.a.sick: "Já... já nemůžu. Tohle je příliš!"
 health.2002.b.not_sick: "[std_partner.GetFirstName] musí pochopit, že takhle spolu být nemůžeme!"
 health.2002.b.sick: "Má lásko, je mi to líto, ale nemůžu..."
 health.2002.c: "Budu při tobě stát i v tomhle, má lásko."
 health.2002.d.not_sick: "Tohle mohl být můj konec."
 health.2002.d.sick: "Jsme prokletí!"
 health.2003.t: "[SCOPE.Custom('EventTitleDisease')]: Zavržen"
 health.2003.start.desc: "Jakmile se o mém neduhu [Select_CString(other_partner.IsFemale, 'dozvěděla', 'dozvěděl')] [other_partner.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('other_partner'))], [Select_CString(ROOT.Char.IsFemale, 'doufala jsem', 'doufal jsem')] v útěchu, místo ní však přišlo odmítnutí. [other_partner.GetFirstName] se na mě [Select_CString(other_partner.IsFemale, 'podívala', 'podíval')] s neskrývaným odporem a"
 health.2003.consort.desc: " [Select_CString(other_partner.IsFemale, 'řekla', 'řekl')], ať se držím dál od postele."
 health.2003.lover.desc: " náš vztah [Select_CString(other_partner.IsFemale, 'ukončila', 'ukončil')]."
 health.2003.a: "Copak mi musí být vzato úplně všechno?"
 health.2101.t: "[SCOPE.Custom('EventTitleDisease')]: Zabiják mezi námi"
 health.2101.smallpox_outbreak.desc: "Na mou domácnost padla kletba smrti — objevily se pravé neštovice!"
 health.2101.smallpox_spreads.desc: "Další duše byla prokleta pravými neštovicemi."
 health.2101.bubonic_plague_outbreak.desc: "Nad mým panstvím pozvedá kosu [ROOT.Char.GetFaith.DeathDeityName|U] — objevil se obávaný dýmějový mor!"
 health.2101.bubonic_plague_spreads.desc: "Další duše stojí na prahu smrti. [sick_character.GetFirstName] má kůži zohyzděnou obávanými dýmějemi."
 health.2101.typhus_outbreak.desc: "Ke dvoru se vplížil nebezpečný případ táborové horečky. Nemocné sužují vyrážky, kašel a horečka."
 health.2101.typhus_spreads.desc: "Objevil se další případ skvrnitého tyfu."
 health.2101.consumption_outbreak.desc: "Dvorem se rozléhá úporný kašel. Chodbami se plíží souchotiny a vybírají si první oběť."
 health.2101.consumption_spreads.desc: "Další nešťastné duše se ocitají v sevření souchotin."
 health.2101.measles_outbreak.desc: "Vyrážka na kůži nemocných je nezaměnitelná: u dvora se objevily spalničky."
 health.2101.measles_spreads.desc: "Nemocných stále přibývá a na jejich kůži se objevují rudé vyrážky, které neklamně prozrazují přítomnost spalniček."
 health.2101.dysentery_outbreak.desc: "Zápach všude kolem mluví sám za sebe. U dvora se objevila úplavice."
 health.2101.dysentery_spreads.desc: "Objevují se další případy úplavice a latríny jsou obsazené ve dne v noci."
 health.2101.ergotism_outbreak.desc: "U dvora se objevil ergotismus a křečovité záškuby oběti nenechávají nikoho na pochybách."
 health.2101.ergotism_spreads.desc: "Ergotismus sráží další oběti a jejich končetiny jako by pod kůží spaloval oheň."
 health.2101.imporant.desc: "[sick_character.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))], bojuje o život."
 health.2101.prisoner.desc: "Nešťastnou obětí je [sick_character.GetTitledFirstName], [Select_CString(sick_character.IsFemale, 'jedna z mých vězeňkyň', 'jeden z mých vězňů')]."
 health.2101.courtier_or_guest.desc: "Nešťastnou obětí je [sick_character.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))]."
 health.2101.immune.desc: "\n\nJá sice proti řádění této zhoubné nákazy imunitu mám, ale [sick_character.GetFirstName] představuje nebezpečí pro všechny ostatní u mého dvora."
 health.2101.not_immune.desc: "\n\n[sick_character.GetFirstName] je [Select_CString(sick_character.IsFemale, 'zachvácena', 'zachvácen')] nákazou a představuje nebezpečí pro nás všechny. Dokud nemoc nepomine, není u dvora v bezpečí nikdo."
 health.2101.a: "Ať je [sick_character.GetTitledFirstNameNoTooltip] [Select_CString(sick_character.IsFemale, 'izolována', 'izolován')] a modleme se za spásu."
 health.2101.a.tt: "Nákaza se bude mým dvorem šířit bez překážek"
 health.2101.b: "[sick_character.GetTitledFirstNameNoTooltip] musí z mého dvora!"
 health.2101.c: "[sick_character.GetTitledFirstNameNoTooltip] musí pryč!"
 health.2201.t: "[SCOPE.Custom('EventTitleDisease')]: [Select_CString(sick_character.IsFemale, 'Má ubohá', 'Můj ubohý')] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U]"
 health.2201.start.desc: "Dostává se ke mně vážná zpráva. [sick_character.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))], [Select_CString(sick_character.IsFemale, 'onemocněla', 'onemocněl')]"
 disease_ill_article: ""
 disease_ill: "nachlazením."
 disease_pneumonic: "zápalem plic."
 disease_gout_ridden: "dnou."
 disease_leper: "malomocenstvím."
 disease_typhus: "tyfem."
 disease_consumption: "souchotinami."
 disease_cancer: "rakovinou."
 disease_lovers_pox: "mileneckou příjicí."
 disease_early_great_pox: "mileneckou příjicí."
 disease_great_pox: "velkou příjicí."
 disease_smallpox: "pravými neštovicemi."
 disease_bubonic_plague: "dýmějovým morem."
 disease_measles: "spalničkami."
 disease_ergotism: "ohněm svatého Antonína."
 disease_dysentery: "úplavicí."
 missing_illness: "#D Chybějící nemoc #!"
 health.2201.minor_disease.desc: "\n\nZa normálních okolností by tak lehké onemocnění nebylo důvodem k velkým obavám, jenže [sick_character.GetFirstName] má chatrné zdraví a taková zátěž už může být příliš velká."
 health.2201.leprosy.desc: "\n\nAčkoli může [sick_character.GetFirstName] žít ještě mnoho let, znetvoření bude budit odpor a nedůvěru okolí. Ani já nedokážu potlačit znechucení při pomyšlení na léze rozrůstající se po celé kůži..."
 health.2201.lethal_disease.desc: "\n\nTato nemoc zabíjí bez milosti, kosí mladé i staré, chudé i bohaté, muže i ženy. Obávám se, že tohle je konec. Zachránit může už jen zázrak."
 health.2201.major_disease.desc: "\n\nBudoucnost je nejistá. Smrt prodlévá těsně u lůžka, ale ještě není vše ztraceno. [sick_character.GetFirstNameNoTooltip] může přežít, bude-li štěstí přát.\n\nJen [ROOT.Char.GetFaith.FateGodName] zná [Select_CString(sick_character.IsFemale, 'její', 'jeho')] osud."
 health.2201.court_physician.desc: "\n\nMám rozhodnout, jakou léčbu má [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] podstoupit."
 health.2201.court_physician.desc_sick_physician: "\n\n[sick_character.GetFirstName] je sice [Select_CString(sick_character.IsFemale, 'má lékařka', 'můj lékař')], ale přesto se obrací pro radu na mě."
 health.2201.a: "Tohle je nepřítel, před kterým [Select_CString(sick_character.IsFemale, 'ji', 'ho')] nedokážu ochránit."
 health.2102.t: "[SCOPE.Custom('EventTitleDisease')]: Nový den"
 health.2102.start1.desc: "Epidemie"
 health.2102.smallpox.desc: "pravých neštovic,"
 health.2102.bubonic_plague.desc: "moru,"
 health.2102.start2.desc: "která zachvátila můj dvůr, je konečně u konce."
 health.2102.physician.desc: "Všechny oběti se buď uzdravily, nebo odešly z tohoto světa.\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě ujišťuje, že o všechna těla bylo řádně postaráno a nebezpečí zcela pominulo."
 health.2102.no_physician.desc: "Všechny oběti se buď uzdravily, nebo odešly z tohoto světa; po nemoci už není ani stopy."
 health.2102.2_victims.desc: "\n\nCesta k zotavení však bude dlouhá. Smrt si vzala mnohé. Patří mezi ně [victim_1.Custom2('MyCharacterIntroduction', ROOT.Char)] a [victim_2.Custom2('MyCharacterIntroduction', ROOT.Char)]. Život jde dál, ale jizvy zůstávají."
 health.2102.1_victim.desc: "\n\nCesta k zotavení však bude dlouhá. Smrt si vzala mnohé. Patří mezi ně [victim_1.Custom2('MyCharacterIntroduction', ROOT.Char)]. Život jde dál, ale jizvy zůstávají."
 health.2102.root_victim.desc: "\n\nNěkteré noci se stále probouzím ve studeném potu a strach mě zcela ochromuje. Nemoc mě sice nezlomila, ale jizvy — na kůži i v mysli — zůstanou ještě mnoho let."
 health.2102.a.victim: "Konečně si můžeme odpočinout. A truchlit."
 health.2102.a.no_victim: "Konečně jsme v bezpečí."
 health.2102.a.dead_and_survivors.tt: "Počet obětí u dvora: #N [THIS.Var('dead_victims_num').GetValue|0]#!; počet uzdravených: #P [THIS.Var('surviving_victims_num').GetValue|0]#!"
 health.2102.a.no_survivors.tt: "Počet obětí u dvora: #N [THIS.Var('dead_victims_num').GetValue|0]#!"
 health.2102.a.no_dead.tt: "Počet uzdravených u dvora: #P [THIS.Var('surviving_victims_num').GetValue|0]#!"
 health.2102.a.dead.tt: "[THIS.Char.GetShortUIName]: úmrtí během epidemie"
 health.2102.a.surviving.tt: "[THIS.Char.GetShortUIName]: onemocnění a následné uzdravení během epidemie"
 health.2202.t: "[SCOPE.Custom('EventTitleDisease')]: Tělesné šťávy v rovnováze"
 health.2202.desc: "Když procházím chodbami, zaslechnu tlumený smích. Ten hlas... už dlouho nezněl tak jasně a vesele.\n\nRozrazím pootevřené dveře. Přede mnou stojí [sick_character.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))], a podle všeho už netrpí"
 health.2202.desc.happy: "\n\n[Select_CString(sick_character.IsFemale, 'Má milovaná', 'Můj milovaný')] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))] je zase v pořádku! Jen stěží zadržím slzy radosti..."
 health.2202.desc.angry: "\n\nJak se to mohlo stát? Proč zrovna já, [ROOT.Char.GetFaith.HealthGodName]? #EMP Proč!?#!"
 health.2202.desc.relieved: "\n\nKdyž mě [sick_character.GetFirstName] pozdraví, spadne mi obrovský kámen ze srdce a jen stěží zadržím slzu úlevy."
 health.2202.desc.neutral: "\n\nOdpovím vážným přikývnutím."
 health.2202.a.happy: "Úžasná zpráva! Pochválen budiž [ROOT.Char.GetFaith.HealthGodName]!"
 health.2202.a.angry: "Jaká škoda..."
 health.2202.a.relieved: "Můj dvůr je zase o něco bezpečnější."
 health.2202.a.neutral: "Naštěstí."
 health.3001.disease.t: "[SCOPE.Custom('EventTitleDisease')]:"
 health.3001.t: "Lékař pro [ROOT.Char.Custom('GetCourt')|l]"
 health.3001.fallback_reason.desc: "Nebezpečí tohoto světa nešetří nikoho. [ROOT.Char.GetTitleTierName] ani [ROOT.Char.Custom('GetCourt')|l] nejsou výjimkou.\n\nPoptal jsem se po doporučeních a nyní mám na výběr z několika možností."
 health.3001.decision.desc: "Nebezpečí tohoto světa nešetří nikoho. [ROOT.Char.GetTitleTierName] ani [ROOT.Char.Custom('GetCourtierPlural')|l] nejsou výjimkou. Na můj pokyn se sluhové poptali po doporučeních a nyní přicházejí s několika možnostmi."
 health.3001.already_sick.desc: "Konečně mí sluhové našli několik lidí, kteří by se mohli hodit na místo mého lékaře. Vzhledem k okolnostem se však obávám, že si nemohu příliš vybírat."
 health.3001.a: "[high_skill_option.GetFirstNameNoTooltip] má podle všeho značné zkušenosti."
 health.3001.a.tt: "Funkce [GetCourtPositionType('court_physician_court_position').GetName()] je spojena také s měsíčním platem [gold_i][SCOPE.ScriptValue('court_position_physician_salary')]"
 health.3001.a.aptitude: "[high_skill_option.GetUINamePossessive|U] [Concept('aptitude','způsobilost')|E] je [high_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.b: "[low_skill_option.GetFirstNameNoTooltip] přinejmenším působí nadšeně."
 health.3001.b.aptitude: "[low_skill_option.GetUINamePossessive|U] [Concept('aptitude','způsobilost')|E] je [low_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.c: "[mystic_option.GetFirstNameNoTooltip] tvrdí, že se vyzná v „alternativní medicíně“."
 health.3001.c.aptitude: "[mystic_option.GetUINamePossessive|U] [Concept('aptitude','způsobilost')|E] je [mystic_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.d.two: "Ani jedna z těch dvou možností mě nepřesvědčila."
 health.3001.d.more: "Žádná z těch možností mě nepřesvědčila."
 health.3001.e: "[excellent_skill_option.GetFirstNameNoTooltip] má mezi učenci zvučné jméno."
 health.3001.e.aptitude: "[excellent_skill_option.GetUINamePossessive|U] [Concept('aptitude','způsobilost')|E] je [excellent_skill_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 health.3001.d.tt: "Funkce [GetCourtPositionType('court_physician_court_position').GetName()] zůstane neobsazena"
 health.3101.t: "[SCOPE.Custom('EventTitleDisease')]: Čas na léčbu"
 health.3101.start.desc: "Štiplavý zápach bublajících tinktur a drcených mastí útočí na mé smysly, když vstupuji do [physician.GetFirstNamePossessive] pracovny. [physician.GetFirstName] vzhlédne od masti, kterou právě připravuje.\n\n„Nastal čas, [ROOT.Char.Custom('FormOfAddressForLiege')]. Znám několik způsobů léčby, pokud trpíte"
 health.3101.safe_recommendation.desc: "Jednoduchá tinktura by podle mě měla stačit, ale"
 health.3101.risky_recommendation.desc: "Nejlepší by podle mě byla razantní opatření, ale"
 health.3101.mystic_recommendation.desc: "Dovolím si navrhnout... alternativní léčbu. Ale"
 health.3101.end.desc: "volba je na vás a jen na vás.“ [physician.GetFirstName] se zašklebí.\n\n„Nebude to příjemné.“"
 health.3101.a: "Neprováděj nic, co není nezbytné."
 health.3101.b: "Na opatrnost už je pozdě!"
 health.3101.c: "Jsem ochoten... zkusit něco nového."
 health.3101.d: "Nechte mě být!"
 health.3101.e: "Pošlete pro lékaře! Hned!"
 health.3101.e.already_looking: "Brzy! Pomoc je na cestě!"
 health.3101.e_sick_physician: "Potřebuji nového lékaře!"
 health.3101.e.tt: "Mí sluhové budou hledat možné kandidáty na funkci [GetCourtPositionType('court_physician_court_position').GetName()]"
 health.3101.tutorial.tt: "Volbou této možnosti se dozvíš, jak obsadit funkci [GetCourtPositionType('court_physician_court_position').GetName()]. Takto jmenovaná postava možná dokáže vyléčit tvůj neduh."
 health.3101.f: "[ROOT.Char.GetFaith.HighGodName] mě snad nenechá takhle zemřít...!?"
 health_3101_already_looking_tt: "Už hledáš někoho do funkce [GetCourtPositionType('court_physician_court_position').GetName()]"
 safe_diseaste_treatment.tt: "Bezpečná léčba může dočasně zmírnit příznaky a představuje jen malé riziko"
 risky_diseaste_treatment.tt: "Riskantní léčba může přinést skvělé výsledky, ale také zhoršit příznaky nebo způsobit trvalá zranění"
 mystic_diseaste_treatment.tt: "Mystická léčba je nepředvídatelná. Podivné rituály mohou přinést zázračné výsledky, ale také tě připravit o rozum..."
 safe_wound_treatment.tt: "Bezpečná léčba může dočasně zmírnit tvou bolest a představuje jen malé riziko"
 risky_wound_treatment.tt: "Riskantní léčba může přinést skvělé výsledky, ale také zhoršit příznaky nebo způsobit trvalá zranění"
 no_treatment_effect.tt: "Bez léčby necháš přírodu, aby se ubírala vlastní cestou"
 deny_treatment_effect.tt: "Žádná léčba neproběhne a příroda se bude ubírat vlastní cestou"
 pick_own_treatment_effect.adult.tt: "O druhu léčby rozhodne [sick_character.GetTitledFirstName] osobně."
 pick_own_treatment_effect.child.tt: "O tom, jak bude [sick_character.GetTitledFirstName] [Select_CString(sick_character.IsFemale, 'léčena', 'léčen')], rozhodne lékař"
 health.3102.t: "[SCOPE.Custom('EventTitleDisease')]: [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U] stoná"
 health.3102.preamble: "Přítmí v místnosti zahánějí jen mihotavé plameny. Na lékařském stole leží [sick_character.GetFirstName], tělo strnulé v úzkostném očekávání.\n\n"
 health.3102.start.desc: "[sick_character.GetFirstNamePossessive] léčba musí zohlednit, že trpí"
 health.3102.start.desc_sick_physician: "Je čas rozhodnout o léčbě [Select_CString(sick_character.IsFemale, 'mé lékařky', 'mého lékaře')], která musí zohlednit, že trpí"
 health.3102.treatment: "Nabízí se několik způsobů léčby, od obvyklých až po neortodoxní. Je na mně rozhodnout, který nejlépe odpovídá konkrétním potřebám [sick_character.GetFirstNamePossessiveNoTooltip]."
 health.3102.a: "Buď opatrný. Nedělej nic, co není nezbytné."
 health.3102.b: "Nastal čas na razantní opatření."
 health.3102.c: "Teď už pomůže jedině vyšší moc."
 health.3102.c_sick_physician: "Teď už ti pomůže jedině vyšší moc."
 health.3102.d: "Žádná léčba nebude."
 health.3102.e_adult: "[sick_character.GetFirstNameNoTooltip] může rozhodnout [Select_CString(sick_character.IsFemale, 'sama', 'sám')]."
 health.3102.e_child: "Důvěřuji ti."
 health.3103.t: "[SCOPE.Custom('EventTitleDisease')]: O něco jasněji"
 health.safe_treatment.1.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'usoudila', 'usoudil')], že nejlepší léčbou bude odpočinek. Brzy kolem mě ležely měkké polštáře a přes tělo mi přibylo několik vrstev přikrývek. Než [physician.GetFirstNameNoTooltip] [Select_CString(physician.IsFemale, 'odešla', 'odešel')] z [ROOT.Char.Custom('GetChambersOrTent')|l], zatáhla závěsy. Bylo pravé poledne.\n\nPo troše spánku"
 health.safe_treatment.2.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'přičetla', 'přičetl')] mé neduhy nezdravé stravě. Aby mé tělo znovu nabylo sil, [Select_CString(physician.IsFemale, 'trvala', 'trval')] na tom, že celý týden budu jíst jen syrovou zeleninu a pít bylinné čaje. Aby mě nic nelákalo, [Select_CString(physician.IsFemale, 'zabavila', 'zabavil')] mi zásobu pamlsků. Už mi ji nikdy [Select_CString(physician.IsFemale, 'nevrátila', 'nevrátil')].\n\nPo přísné dietě"
 health.safe_treatment.3.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'nařídila', 'nařídil')] lehnout si na postel a podat ruce. Pevně mi [Select_CString(physician.IsFemale, 'třela', 'třel')] a plácala do dlaní, dokud nezrudly, a pak totéž zopakovala na chodidlech. Nakonec mě ještě jemně štípala po celé délce končetin.\n\nPo té podivné proceduře"
 health.safe_treatment.4.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'nabídla', 'nabídl')] průzračný lektvar v pozlacené lahvičce. Po zkušenostech s předchozími léčivy ve mně zprvu hlodaly obavy, ale ukázalo se, že nápoj nemá žádnou vůni ani chuť. Na otázku po přísadách [physician.GetFirstNameNoTooltip] [Select_CString(physician.IsFemale, 'odpověděla', 'odpověděl')], že jde o tajný recept.\n\nPo záhadném lektvaru"
 health.safe_treatment.5.desc: "„Uvolněte dech,“ [Select_CString(physician.IsFemale, 'poradila', 'poradil')] mi [physician.GetTitledFirstName]. V ruce [Select_CString(physician.IsFemale, 'držela', 'držel')] téměř nadpozemsky působící pírko a začala mě jím jemně šimrat pod nosem. „Zlo, odejdi!“ [Select_CString(physician.IsFemale, 'vybízela', 'vybízel')], až se místností rozlehlo mé hlasité kýchnutí.\n\nPo tom zvláštním šimrání"
 health.safe_treatment.6.desc: "[physician.GetTitledFirstName] na mou počest [Select_CString(physician.IsFemale, 'uspořádala', 'uspořádal')] malý obřad. Jakmile se hlavní sál zaplnil mou rodinou a nejbližším doprovodem, kázání pronesla místní duchovní autorita: [ROOT.Char.Custom('DefaultPriestTitle')]. Kázání vyzdvihovalo mé ctnosti a dobročinnost. Obřad završila hodina tiché modlitby. V mysli všech přitom bylo jediné jméno: [ROOT.Char.GetFaith.HealthGodName].\n\nPo hodině tiché modlitby"
 health.safe_treatment.7.desc: "Mnoho večerů trávil[Select_CString(physician.IsFemale, 'a', '')] [physician.GetTitledFirstName] u mého lůžka a předčítal[Select_CString(physician.IsFemale, 'a', '')] mi posvátný text: [ROOT.Char.GetFaith.ReligiousText]. V jeho slovech se stále vracelo jediné jméno: [ROOT.Char.GetFaith.HealthGodName].\n\nPo těch večerních čteních"
 health.safe_treatment.8.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'rozhodla', 'rozhodl')], že mi má zpívat nejlepší hlas u dvora. Do hledání se zapojila i místní duchovní autorita: [ROOT.Char.Custom('DefaultPriestTitle')]. Nakonec se ukázalo, že nejlepší hlas patří mladému dítěti s jasným tenorem. Několik dní po sobě mě dítě zpěvem uspávalo.\n\nPo uklidňujícím zpěvu"
 health.safe_treatment.9.desc: "Z šálku stoupala pára, zatímco v něm [physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'míchala', 'míchal')] zelený prášek. Dlouze mi [Select_CString(physician.IsFemale, 'vysvětlovala', 'vysvětloval')] léčivé vlastnosti byliny a pak pokynula, ať nápoj vypiju. „Je v tom i kořen,“ [Select_CString(physician.IsFemale, 'prozradila', 'prozradil')] pyšně.\n\nPo té hořké bylině"
 health.safe_treatment.10.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'trvala', 'trval')] na tom, že mé tělesné šťávy nejsou v rovnováze a nejlépe je napraví pouštění žilou. Po poradě s astronomickými tabulkami [Select_CString(physician.IsFemale, 'rozhodla', 'rozhodl')], že mi má být puštěna krev z podpaží a spánků.\n\nPo pouštění žilou"
 health.safe_treatment.11.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'nařídila', 'nařídil')] svléknout se a kleknout si s vystrčeným zadkem. Už to bylo dost trapné, ale když jsem spatřil nástroj v rukou svého lékaře, málem jsem vzal nohy na ramena. [physician.GetFirstNameNoTooltip] si toho zřejmě [Select_CString(physician.IsFemale, 'všimla', 'všiml')], protože mě konejšivě poplácala po rameni a řekla mi, ať se uvolním.\n\nPo klystýru"
 health.safe_treatment.12.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'vstoupila', 'vstoupil')] do [ROOT.Char.Custom('GetChambersOrTent')|l] s hliněnou nádobou v náručí a [Select_CString(physician.IsFemale, 'posadila', 'posadil')] se k mému lůžku. Z nádoby [Select_CString(physician.IsFemale, 'vytáhla', 'vytáhl')] pijavici, něžně si ji prohlédla a opatrně mi ji přiložila na tvář. „Nehýbejte se, [ROOT.Char.Custom('FormOfAddressForLiege')]. Neradno je rušit při krmení.“\n\nPo přikládání pijavic"
 health.safe_treatment.13.desc: "Když [physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'vstoupila', 'vstoupil')] do [ROOT.Char.Custom('GetChambersOrTent')|l], vzduch okamžitě naplnil příšerný zápach. Jeho zdrojem byla nádoba v rukou mého lékaře — „Směs kravského trusu a bylin na váš obklad, [ROOT.Char.Custom('FormOfAddressForLiege')].“ Když mi [physician.GetFirstName] [Select_CString(physician.IsFemale, 'začala', 'začal')] směs roztírat po hrudi, málem se mi zvedl žaludek.\n\nPo tom obkladu"
 health.safe_treatment.14.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'přinesla', 'přinesl')] směs krušiny a senny. Zprvu se zdálo, že lektvar vůbec nezabírá, ale později téhož dne mě prudké kručení ve střevech vyhnalo na latrínu. Zatímco jsem tam úpěl, [physician.GetFirstName] mě [Select_CString(physician.IsFemale, 'ujišťovala', 'ujišťoval')], že nečistota odchází z těla spolu s výkaly.\n\nPo té očistě"
 health.safe_treatment.15.desc: "[physician.GetTitledFirstName] přede mě [Select_CString(physician.IsFemale, 'položila', 'položil')] ohořelou mrtvolu kočky a pobídla mě k jídlu. Během jídla mi [Select_CString(physician.IsFemale, 'vyprávěla', 'vyprávěl')], jak tu vypasenou kočku celé hodiny honila po mých državách. Zřejmě čekala pochvalu za všechnu tu námahu, ale odporná chuť pokrmu mě připravila o řeč.\n\nPo tom tučném pokrmu"
 health.safe_treatment.16.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'přinesla', 'přinesl')] do [ROOT.Char.Custom('GetChambersOrTent')|l] kvákající vědro a [Select_CString(physician.IsFemale, 'nařídila', 'nařídil')] mi obnažit horní polovinu těla. [Select_CString(physician.IsFemale, 'Popadla', 'Popadl')] ropuchu, zručně ji [Select_CString(physician.IsFemale, 'vykuchala', 'vykuchal')] a položila ještě škubající se mršinu na mou hruď. Pokračovala, dokud nebylo vědro prázdné a můj trup celý pokrytý ropuchami.\n\nPo léčbě ropuchami"
 health.safe_treatment.17.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'přišla', 'přišel')] do [ROOT.Char.Custom('GetChambersOrTent')|l] a [Select_CString(physician.IsFemale, 'nabídla', 'nabídl')] mi žlutavý nápoj. [Select_CString(physician.IsFemale, 'Poradila', 'Poradil')] mi, ať si při pití zacpu nos. Sotva se vlažná tekutina dotkla mých rtů, instinkt mě nutil ji vyplivnout. Na naléhavou otázku, co je v poháru, [physician.GetFirstNameNoTooltip] [Select_CString(physician.IsFemale, 'prozradila', 'prozradil')], že jde o čerstvou moč březí prasnice.\n\nPo té prasečí moči"
 health.safe_treatment.18.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'ponořila', 'ponořil')] ruku do vědra, které [Select_CString(physician.IsFemale, 'přinesla', 'přinesl')] do [ROOT.Char.Custom('GetChambersOrTent')|l]. Když ji znovu [Select_CString(physician.IsFemale, 'vytáhla', 'vytáhl')], mezi prsty se mrskala malá rybka. „Otevřete,“ [Select_CString(physician.IsFemale, 'řekla', 'řekl')] a [Select_CString(physician.IsFemale, 'hodila', 'hodil')] mi ji do úst. Lechtání v hrdle mi obracelo žaludek, ale podařilo se mi nepozvracet.\n\nPo té rybce"
 health.safe_treatment.19.desc: "Tekutina v poháru byla teplá a nakyslá. „Vyžene z těla ten druhý žár,“ [Select_CString(physician.IsFemale, 'vysvětlila', 'vysvětlil')] [physician.GetTitledFirstName].\n\nPo tom lektvaru"
 health.safe_treatment.20.desc: "Aby uvedl[Select_CString(physician.IsFemale, 'a', '')] mé tělesné šťávy zpět do rovnováhy, [physician.GetTitledFirstName] mě donutil[Select_CString(physician.IsFemale, 'a', '')] pít slanou vodu, která měla vyvolat zvracení. Zabralo to až příliš dobře.\n\nPo vyprázdnění žaludku"
 health.safe_treatment.21.desc: "Aby mě zbavil[Select_CString(physician.IsFemale, 'a', '')] neduhů, [physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'nařídila', 'nařídil')] několik dní spát hlavou dolů. „Vrátí vás to do rovnováhy,“ [Select_CString(physician.IsFemale, 'ujistila', 'ujistil')] mě.\n\n[Select_CString(ROOT.Char.IsFemale, 'Připadala jsem si', 'Připadal jsem si')] jako netopýr.\n\nPo tom podivném spaní hlavou dolů"
 health.3103.end.desc: " se můj stav konečně zlepšil. Prozatím nejhorší příznaky polevily a svět se zdá o něco jasnější."
 health.3103.a: "Skvělá práce, [physician.GetFirstNameNoTooltip]."
 health.3104.t: "[SCOPE.Custom('EventTitleDisease')]: Ještě hůř"
 health.3104.end.desc: " se můj stav vůbec nezlepšil. Popravdě mám pocit, že je mi ještě hůř!"
 health.3104.a: "Běž pryč. Chci si odpočinout..."
 health.3105.t: "[SCOPE.Custom('EventTitleDisease')]: Lékařský zázrak"
 health.risky_treatment_medicine.1.desc: "Nádoba, kterou [physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'přinesla', 'přinesl')] do [ROOT.Char.Custom('GetChambersOrTent')|l], vydávala podivné bzučení. Než se mi podařilo zasáhnout, [physician.GetFirstName] ji [Select_CString(physician.IsFemale, 'mrštila', 'mrštil')] o podlahu, kde vybuchla v oblaku keramických střepů a vypustila roj rozzuřených včel. Zatímco [physician.GetFirstName] [Select_CString(physician.IsFemale, 'prchala', 'prchal')] z místnosti, jejich jediným cílem jsem zůstal já."
 health.risky_treatment_medicine.2.desc: "Nemohl jsem uvěřit vlastním očím, když [physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'vytáhla', 'vytáhl')] z brašny useknutou ruku. Černé skvrny na jednom z jejích prstů mi nahnaly hrůzu a naléhavě jsem se dožadoval vysvětlení, odkud ji [Select_CString(physician.IsFemale, 'vzala', 'vzal')]. [physician.GetFirstName] mě však jen [Select_CString(physician.IsFemale, 'utišila', 'utišil')] a začala mi useknutou rukou třít hruď."
 health.risky_treatment_medicine.3.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'předložila', 'předložil')] vskutku zvláštní lektvar. Neměl vůni ani chuť a vypadal jako tekuté stříbro. Kovový nápoj se polykal docela snadno, přesto jsem nedokázal potlačit neklid."
 health.risky_treatment_medicine.4.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'trvala', 'trval')] na tom, že jediným lékem na můj stav je půlnoční běh bez jediného kusu oděvu. Za příštího úplňku mě [Select_CString(physician.IsFemale, 'donutila', 'donutil')] svléknout se a rozběhnout se divočinou. „Nezastavujte, dokud vám nohy nevypovědí službu!“ [Select_CString(physician.IsFemale, 'volala', 'volal')] za mnou. „Vypuďte zlo potem!“"
 health.risky_treatment_medicine.5.desc: "Žlutý prášek nádherně voněl. O to větší zděšení ve mně vyvolalo, když jej [physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'smíchala', 'smíchal')] se sírou a nasypala na dosud vlažný žlučník bobra. Zvíře našli vzteklé, s pěnou u tlamy a dalšími neklamnými známkami nemoci. „Proti zlu musíme bojovat zlem, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 health.risky_treatment_medicine.6.desc: "[physician.GetTitledFirstName] ke mně [Select_CString(physician.IsFemale, 'přistoupila', 'přistoupil')] s malým nožem. Pevně mi [Select_CString(physician.IsFemale, 'přidržela', 'přidržel')] paži a přesným řezem sotva porušila kůži. Poté mi na ránu [Select_CString(physician.IsFemale, 'přitiskla', 'přitiskl')] jakousi odpornou hmotu. Jediný letmý pohled mi úplně stačil."
 health.risky_treatment_medicine.7.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'podala', 'podal')] talíř s šedavou práškovitou hmotou. Údajně šlo o rozemleté strupy člověka v ještě horším stavu, než jsem já. [physician.GetTitledFirstName] nejevila ani náznak žertu, když mi [Select_CString(physician.IsFemale, 'nařídila', 'nařídil')] naklonit se nad talíř a vdechnout co nejvíce prášku."
 health.risky_treatment_medicine.8.desc: "Rudý prášek lákal už svou barvou. Jeden sluha udělal tu chybu, že jej ochutnal v čisté podobě — jazyk mu hrozivě otekl a [physician.GetTitledFirstName] ho za to důrazně [Select_CString(physician.IsFemale, 'pokárala', 'pokáral')]. [physician.GetTitledFirstName] pak [Select_CString(physician.IsFemale, 'nasypala', 'nasypal')] koření do poháru s vodou, pečlivě je rozmíchala a nakonec mi podala jednu lžíci."
 health.risky_treatment_medicine.9.desc: "Oči se mi rozšířily údivem, když [physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'přivedla', 'přivedl')] do [ROOT.Char.Custom('GetChambersOrTent')|l] kozu. Příšerný zápach jejích větrů mě přiměl zakrýt si nos, ale [physician.GetFirstName] mi ruku [Select_CString(physician.IsFemale, 'odtáhla', 'odtáhl')]. „Omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')], ale právě toto je léčba.“ Poté mi [Select_CString(physician.IsFemale, 'doporučila', 'doporučil')] zhluboka dýchat."
 health.risky_treatment_surgery.1.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'podala', 'podal')] nápoj podivné chuti. Tělo mi znecitlivělo a víčka začala těžknout. „Omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')], ale u toho, co bude následovat, opravdu nechcete být vzhůru,“ [Select_CString(physician.IsFemale, 'řekla', 'řekl')]. Zmocnila se mě panika. Zvednout se z operačního stolu však nebylo možné — končetiny mě neposlouchaly."
 health.risky_treatment_surgery.2.desc: "[physician.GetTitledFirstNamePossessive] asistent tvrdil, že mě lektvar uspal. [physician.GetTitledFirstName] tomu [Select_CString(physician.IsFemale, 'uvěřila', 'uvěřil')]. Jak hluboce se [Select_CString(physician.IsFemale, 'mýlila', 'mýlil')]! [Select_CString(ROOT.Char.IsFemale, 'Nemohla jsem', 'Nemohl jsem')] mluvit ani se hýbat, přesto jsem vnímal vše, co se mnou dělali. Snažil jsem se křičet a zmítat, ale byl jsem vězněm ve vlastním těle. Zdálo se, že zákrok nikdy neskončí..."
 health.risky_treatment_amputation.1.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'zapnula', 'zapnul')] poslední řemen a pevně mě připoutala k operačnímu stolu. „Nebudu vám lhát, [ROOT.Char.Custom('FormOfAddressForLiege')]. Bude to nesnesitelně bolet, ale musí se to udělat.“\n\nKdyž [physician.GetFirstName] [Select_CString(physician.IsFemale, 'vytáhla', 'vytáhl')] pilu, [Select_CString(ROOT.Char.IsFemale, 'chtěla jsem', 'chtěl jsem')] protestovat, ale uklidňující lektvar, který mi [Select_CString(physician.IsFemale, 'dala', 'dal')] vypít, proměnil má slova v nesrozumitelné mumlání."
 health.risky_treatment_disfigurement.1.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'oznámila', 'oznámil')], že [Select_CString(physician.IsFemale, 'odhalila', 'odhalil')] nakaženou tkáň, která je kořenem mé choroby, a jejím odstraněním mě s největší pravděpodobností vyléčí. Ta zpráva mě potěšila a se zákrokem jsem souhlasil.\n\nJen škoda, že mi [physician.GetFirstName] předem [Select_CString(physician.IsFemale, 'neřekla', 'neřekl')], že tou „tkání“ myslí můj obličej."
 health.risky_treatment_eye.1.desc: "[physician.GetTitledFirstName] mě [Select_CString(physician.IsFemale, 'přiměla', 'přiměl')] vypít makový odvar a pak mě připoutala k operačnímu stolu. Oči se mi už téměř zavíraly, zatímco si [physician.GetFirstName] [Select_CString(physician.IsFemale, 'připravovala', 'připravoval')] nástroje, ale jakmile se k mému oku přiblížil skalpel, rázem jsem byl zcela vzhůru. „Je mi líto, [ROOT.Char.Custom('FormOfAddressForLiege')], ale musíme odstranit kořen problému.“"
 health.3105.end.desc: "\n\nKupodivu už necítím žádné příznaky..."
 health.3105.a: "Je to zázrak!"
 health.3106.t: "[SCOPE.Custom('EventTitleDisease')]: Tělesné šťávy v rovnováze"
 health.3106.end.desc: "\n\nLéčba byla skoro stejně nepříjemná jako samotné příznaky, ale zdá se, že zabrala. Úplně [Select_CString(ROOT.Char.IsFemale, 'vyléčená', 'vyléčený')] ještě nejsem, ale cítím se mnohem lépe."
 health.3106.a: "Dožiju se dalšího dne."
 health.3107.t: "[SCOPE.Custom('EventTitleDisease')]: Katastrofální léčba"
 health.3107.death.desc: "\n\nPo probuzení mi bylo okamžitě jasné, že se něco pokazilo. Něco se pokazilo velmi, velmi zle."
 health.3107.end.desc: "\n\nMyslel jsem, že hůř už mi být nemůže, ale [physician.GetFirstNameNoTooltip] mi [Select_CString(physician.IsFemale, 'dokázala', 'dokázal')] pravý opak!"
 health.3107.a: "Cítím se... slabě..."
 health.3107.b: "Tohle už se nebude opakovat. Rozumíš mi?"
 health.3107.c: "Všichni jsme znali rizika. Odpouštím ti."
 health.3107.d: "Stráže! [physician.GetFirstNameNoTooltip] půjde do žaláře!"
 health.3107.d.tt: "Až bude [physician.GetTitledFirstName] v mém vězení, rozhodnu, co dál"
 health.3107.e: "[physician.GetFirstNameNoTooltip] si za tuhle zradu zaslouží smrt!"
 health.3107.f: "Ach, [physician.GetFirstNameNoTooltip], co jsi to se sebou udělal?"
 health.3108.t: "[SCOPE.Custom('EventTitleDisease')]: Vyšší moc"
 health.mystic_treatment_occult.cannibal.desc: "„Vypijte to,“ [Select_CString(physician.IsFemale, 'zašeptala', 'zašeptal')] [physician.GetTitledFirstName]. Sotva mi tekutina sklouzla přes rty, dostavily se podivné pocity. Končetiny mi znecitlivěly, ale uvnitř se probudil oheň...\n\n„A teď snězte tohle.“ Kusy byly teplé, mokré a tuhé na skus. Oheň to vítal. Chtěl víc. Když mi [physician.GetFirstName] [Select_CString(physician.IsFemale, 'podala', 'podal')] zbytek bledé paže, hltal jsem, dokud se mi nezvedl žaludek."
 health.mystic_treatment_occult.deviant.desc: "[physician.GetTitledFirstName] mě [Select_CString(physician.IsFemale, 'nechala', 'nechal')] svléknout a začala mi vtírat olej do kůže. Když se její ruka začala sunout k mým nejintimnějším místům a naše pohledy se setkaly, došlo mi, že to chci. Přikývl jsem.\n\nBrzy se k rukám [physician.GetFirstNamePossessive] přidaly další. Hladké, mozolnaté, vrásčité, štíhlé, silné. Když se mi podlomila kolena, zachytily mě a já se jejich dotekům zcela odevzdal."
 health.mystic_treatment_occult.1.desc: "Upoutaný na lůžko jsem se od sluhů dozvěděl, že kouř z hranice byl vidět na míle daleko. Během noci přišlo při velkolepé oběti o život více než dvě desítky krásných zvířat. Na příkaz [physician.GetTitledFirstName] si jejich popelem už čtrnáct dní potírám kůži."
 health.mystic_treatment_occult.2.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'nařídila', 'nařídil')] vstoupit do prázdné kádě a nechala mě o samotě, abych se svlékl. Návrat [physician.GetFirstNameNoTooltip] ohlásilo hlasité „mééé!“. Za [Select_CString(physician.IsFemale, 'ní', 'ním')] kráčel sluha a půl tuctu koz. [physician.GetFirstNameNoTooltip] pak jednu po druhé obratně chytala a podřezávala jim hrdla přímo nad kádí.\n\nSkvrny z podlahy nejdou odstranit."
 health.mystic_treatment_occult.3.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'řekla', 'řekl')], že [ROOT.Char.GetFaith.HealthGodName] žádá oběť. Později téhož večera jsem zaslechl křik.\n\nVydal jsem se za tím zvukem a našel [physician.GetFirstNameNoTooltip] [Select_CString(physician.IsFemale, 'schoulenou', 'schouleného')] nad tělem, s panikou v očích a krví na rukou. „Bylo to pro dobro panství...!“ [Select_CString(physician.IsFemale, 'vydechla', 'vydechl')]."
 health.mystic_treatment_occult.4.desc: "[physician.GetFirstName] mi [Select_CString(physician.IsFemale, 'dala', 'dal')] váček s bylinami a [Select_CString(physician.IsFemale, 'vyslala', 'vyslal')] mě na cestu za mým „duchovním průvodcem“. Celé dny jsem bloudil divočinou, jedl jen kořínky z váčku a spal pod hvězdami. Nakonec jsem ucítil něčí přítomnost. Přede mnou stálo mohutné rohaté zvíře. [Select_CString(ROOT.Char.IsFemale, 'Odvrátila jsem se a rozběhla pryč', 'Odvrátil jsem se a rozběhl pryč')].\n\nTeď jsem zase bezpečně doma ve své posteli, ale spánek nepřichází. Jsem tou bestií snad já?"
 health.mystic_treatment_occult.5.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'stála', 'stál')] u nohou mé postele, zatímco sluhové zapalovali svíce. Do rukou mi vložili nádobu — podle zvuků uvnitř ukrývala malé, vyděšené zvíře. „Tvor ponese vaše břemena místo vás,“ [Select_CString(physician.IsFemale, 'vysvětlila', 'vysvětlil')] [physician.GetFirstName]. Pak začalo odříkávání."
 health.mystic_treatment_questionable.1.desc: "[physician.GetFirstName] mě [Select_CString(physician.IsFemale, 'posadila', 'posadil')] před vysoké zrcadlo a kolem mě zapálila kruh svící. „Musíme navázat spojení s tím druhým vámi,“ [Select_CString(physician.IsFemale, 'prohlásila', 'prohlásil')] zcela bezstarostně. Když jsem na [physician.GetFirstNameNoTooltip] nevěřícně povytáhl obočí, položila mi ruku na rameno. „Tohle vás možná... změní.“"
 health.mystic_treatment_questionable.2.desc: "Místnost osvětloval jediný plamínek svíčky. Obrácený k oknu směřujícímu na západ jsem sledoval, jak mi [physician.GetTitledFirstName] kapkami oleje potírá nehty. Na kůži jsem ucítil žár, když mi [Select_CString(physician.IsFemale, 'posunula', 'posunul')] ruku blíž k plameni. „Nestrachujte se, [ROOT.Char.Custom('FormOfAddressForLiege')]. Díky moudrosti [ROOT.Char.GetFaith.HealthGodName] budete očištěni.“"
 health.mystic_treatment_questionable.3.desc: "„Měsíc si žádá vaši oddanost,“ [Select_CString(physician.IsFemale, 'řekla', 'řekl')] [physician.GetTitledFirstName] a [Select_CString(physician.IsFemale, 'podala', 'podal')] mi koláček pokrytý čímsi kořeněně vonícím. Pár minut poté, co jsem jej snědl, jsem vzhlédl k noční obloze a z mých úst vytryskla nejvelkolepější báseň, jakou kdy svět slyšel. Později si však na její slova nedokážu vzpomenout..."
 health.mystic_treatment_questionable.4.desc: "[physician.GetTitledFirstName] mě každý večer před spaním [Select_CString(physician.IsFemale, 'nutila', 'nutil')] pít mimořádně silný nápoj. „Uvolňuje předivo vašeho bytí a dovoluje duchům vstoupit do vašeho těla,“ [Select_CString(physician.IsFemale, 'ujišťovala', 'ujišťoval')] mě. „A také je docela... uklidňující,“ [Select_CString(physician.IsFemale, 'přiznala', 'přiznal')] s úsměvem."
 health.mystic_treatment_questionable.5.desc: "[physician.GetFirstName] mi [Select_CString(physician.IsFemale, 'vyprávěla', 'vyprávěl')], že vykládat [ROOT.Char.GetFaith.ReligiousText] je obtížná práce, ale očišťování ohněm je umění staré jako svět sám. Netušil jsem, že mě [Select_CString(physician.IsFemale, 'nechá', 'nechá')] kráčet po žhavém uhlí."
 health.mystic_treatment_questionable.6.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale, 'řekla', 'řekl')], že [ROOT.Char.GetFaith.HealthGodName] žádá zkoušku mé mysli. Společně jsme putovali, dokud jsme nedorazili k malému jezeru. Ruku v ruce jsme vstoupili do vody. Šokovalo mě, když mě [physician.GetFirstNameNoTooltip] [Select_CString(physician.IsFemale, 'popadla', 'popadl')] za rameno a strčila hlavu pod hladinu. Musel jsem ztratit vědomí, protože na to, co následovalo, si vůbec nevzpomínám..."
 health.3108.end.desc: "\n\nKdyž jsem se dnes ráno probudil, bolesti a nepříjemnosti, na které jsem si už téměř zvykl, byly pryč. Opravdu mě [physician.GetFirstNameNoTooltip] [Select_CString(physician.IsFemale, 'vyléčila', 'vyléčil')]...?"
 health.3108.a: "Nevím, co si o tom mám myslet... ani čemu věřit."
 health.3109.t: "[SCOPE.Custom('EventTitleDisease')]: Rozporuplné pocity"
 health.3109.end.desc: "\n\nStále nevím, co si mám o tom všem myslet, ale nemohu popřít, že od té doby většina příznaků zmizela."
 health.3109.a: "Nevím, co jsem čekal, ale tohle rozhodně ne."
 health.3110.t: "[SCOPE.Custom('EventTitleDisease')]: Do temnoty"
 health.3110.end.desc: "\n\nMá mysl musela být nějak pozměněna, pokřivena temným trikem. S něčím takovým bych nikdy dobrovolně nesouhlasil. Ty vzpomínky mě pronásledují..."
 health.3200.death.desc: "Tvář sice nepochybně patří [sick_character.GetTitledFirstName], ale přesto už ji téměř nepoznávám. [sick_character.GetFirstName] už tam zkrátka... není. Zbytek těla halí silný rubáš, který skrývá děsivé následky selhání [physician.GetTitledFirstName]."
 health.3200.failure.desc: "Chvíli mi trvá, než [sick_character.GetTitledFirstName] vůbec poznám. Tělo je samá modřina a otok, takže už sotva připomíná člověka. Sevřu [sick_character.GetFirstNamePossessive] ruku. [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))] se pokusí promluvit, ale ze rtů nevyjde ani hláska."
 health.3200.failure.desc_2: "Když se blížím k [ROOT.Char.Custom('GetChambersOrTent')|l], kde přebývá [sick_character.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))], zaslechnu děsivý výkřik — sotva lidský a plný bolesti. Vtrhnu do místnosti a spatřím [sick_character.GetFirstNameNoTooltip] zhroucenou na podlaze, #EMP celou#! od krve."
 health.3200.failure.desc_3: "Chvíli mi trvá, než vůbec pochopím rozsah škod, které si [sick_character.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(sick_character.IsFemale, 'způsobila', 'způsobil')]. Tělo je potřísněné příšerným množstvím krve a v ruce se stále divoce míhá nůž. Než stačím zasáhnout, [sick_character.GetFirstName] vrhne na ostrou čepel zklamaný pohled a vzápětí omdlí."
 health.3200.end.desc: "\n\n[physician.GetTitledFirstName], ten [physician.Custom2('InsultAdjective', ROOT.Char)] lékař, stojí v rohu místnosti a úzkostlivě si mne ruce..."
 health.3200.death.tt: "[sick_character.GetTitledFirstName] [Select_CString(sick_character.IsFemale, 'zemřela', 'zemřel')] během léčby."
 health.3201.desc: "V očích [sick_character.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))], je cosi divokého. Ptám se, co [Select_CString(sick_character.IsFemale, 'viděla', 'viděl')], ale ze rtů nevyjde jediné slovo.\n\n"
 health.3201.occult.desc: "Sluha mi vypráví, že [physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'provedla', 'provedl')] jakýsi zlověstný rituál a právě ten stojí za [sick_character.GetFirstNamePossessive] utrpením. Je to přinejmenším hrůzný příběh. "
 health.3201.occult.desc_sick_physician: "Sluha mi vypráví, že [physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'provedla', 'provedl')] jakýsi zlověstný rituál a právě ten stojí za vším tím utrpením. Je to přinejmenším hrůzný příběh. "
 health.3201.questionable.desc: "Zdá se, že jedna z „alternativních“ léčebných metod [physician.GetFirstName] dopadla katastrofálně."
 health.3201.c: "Ani slovo o tom, [physician.GetFirstNameNoTooltip]!"
 court_physician_treatment_success_message_title: "Úspěšná léčba"
 court_physician_treatment_failure_message_title: "Neúspěšná léčba"
 inform_relatives_about_disease_treatment_effect.safe_success.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'zmírnila', 'zmírnil')] příznaky, kterými trpí [sick_character.GetTitledFirstName]"
 inform_relatives_about_disease_treatment_effect.safe_failure.desc: "Léčba [sick_character.GetTitledFirstName], kterou [Select_CString(physician.IsFemale, 'vedla', 'vedl')] [physician.GetTitledFirstName], byla neúspěšná."
 inform_relatives_about_disease_treatment_effect.risky_critical_success.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'vyléčila', 'vyléčil')] [sick_character.GetTitledFirstName]"
 inform_relatives_about_disease_treatment_effect.risky_success.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'výrazně zmírnila', 'výrazně zmírnil')] příznaky, kterými trpí [sick_character.GetTitledFirstName]"
 inform_relatives_about_disease_treatment_effect.risky_failure.desc: "[physician.GetTitledFirstName] [Select_CString(physician.IsFemale, 'zpackala', 'zpackal')] léčbu [sick_character.GetTitledFirstName]."
 inform_relatives_about_disease_treatment_effect.mystic_failure.desc: "[sick_character.GetTitledFirstName] už po nezdařeném rituálu [physician.GetTitledFirstName] není jako dřív!"
 physician_level_up_chance_effect.t: "Znalosti dvorního lékaře rostou"
 health.4000.t: "$health_wounded_title$ [Select_CString(sick_character.IsFemale, 'Má zraněná', 'Můj zraněný')] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U]"
 health.4000.start.desc: "[sick_character.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('sick_character'))], [Select_CString(sick_character.IsFemale, 'utrpěla zranění', 'utrpěl zranění')],"
 health.4000.infected_wound.desc: " a do rány se dostala nákaza, která přinesla hnisání a otok.\n\nDostane-li se [sick_character.GetFirstName] správné léčby a [ROOT.Char.GetFaith.HealthGodName] projeví milosrdenství, měla by být naděje na přežití."
 health.4000.gangrene.desc: " a maso už zachvátila hniloba a smrt.\n\nČernota se šíří po kůži a jen [ROOT.Char.GetFaith.FateGodName] ví, zda [sick_character.GetFirstName] přežije."
 health.4000.close_to_death_wounded.desc: " a rána sahá velmi hluboko. Každý nádech je boj a obávám se, že zachránit může už jen zázrak."
 health.4000.very_wounded.desc: " a rána sahá hluboko. Obávám se, že tělo nemá dost sil, aby se s ní vypořádalo samo; smrt už jako by prodlévala u lůžka."
 health.4000.wounded.desc: " a bolest je na první pohled zřejmá. Zranění sice není vážné, ale tělesné neduhy se nesmějí podceňovat."
 health.4000.a: "Nedá se nic dělat."
 health.4001.start.desc: "„Nastal čas ošetřit vaše rány."
 health.4001.safe_recommendation.desc: "Jsem přesvědčený, že postačí jednoduché ošetření, ale"
 health.4001.gangrene.desc: "Protože se vaším masem už šíří smrt, obávám se, že musím doporučit... #EMP razantní#! opatření, ale"
 health.4001.infection.desc: "Protože se rána zanítila, musím doporučit razantní opatření, ale"
 health.4001.risky_recommendation.desc: "Doporučuji razantní opatření, ale"
 health.4002.start.desc: "„Nastal čas ošetřit vašeho [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))]."
 health.4002.start.desc_sick_physician: "„Nastal čas ošetřit mě."
 health.4101.t: "$health_wounded_title$ Hojení"
 health.4101.desc_infection: "Když [physician.GetFirstName] [Select_CString(physician.IsFemale, 'začala', 'začal')] opatrně drtit byliny a míchat je s medem, [Select_CString(ROOT.Char.IsFemale, 'myslela jsem si', 'myslel jsem si')], že si snad dělá legraci — trocha zeleně mi přece nemůže pomoci. Jakmile mi však [Select_CString(physician.IsFemale, 'rozetřela', 'rozetřel')] obklad po bolavé ráně, ta"
 health.4101.desc_1: "Když mi [physician.GetFirstName] [Select_CString(physician.IsFemale, 'vylila', 'vylil')] na ránu láhev vína, bolest překonala vše, co mi způsobilo samotné zranění.\n\n„Prosím, vydržte to, [ROOT.Char.GetTitleTierName]. Je to nezbytné, abychom z rány vypudili nečistotu.“\n\nA skutečně, poté co mi [physician.GetFirstName] ránu pevně ovázala, ta"
 health.4101.desc_2: "[physician.GetFirstName] rychle [Select_CString(physician.IsFemale, 'navlékla', 'navlékl')] nit do jehly a pustila se do mé rány, jako by šila u ohně. Pohled na stehy držící mé maso pohromadě byl děsivý! Postupem času však rána"
 health.4101.desc_end: " se brzy začala hojit."
 health.4101.a: "Skvělá práce, [physician.GetFirstNameNoTooltip]!"
 health.4102.t: "$health_wounded_title$ Bolest"
 health.4102.desc_infection: "Vak, který [physician.GetFirstName] [Select_CString(physician.IsFemale, 'přinesla', 'přinesl')] do [ROOT.Char.Custom('GetChambersOrTent')|l], se sám od sebe zmítal, jako by uvnitř něco žilo. Když z něj [physician.GetFirstNameNoTooltip] [Select_CString(physician.IsFemale, 'vytáhla', 'vytáhl')] svíjející se pijavici, cítil jsem, jak mi bledne tvář. „Teď se hlavně nehýbejte, [ROOT.Char.GetTitleTierName]...“\n\nAť už si [physician.GetFirstName] od pijavic slibovala cokoli, výsledek"
 health.4102.desc_end: " mé tělesné šťávy nijak nevyrovnal a bolest se jen zhoršila."
 health.4102.a: "Argh...! Nesahej na mě!"
 health.4103.t: "$health_wounded_title$ Léčivé ruce"
 health.4103.risky_treatment_medicine.1.desc: "Když [physician.GetFirstName] [Select_CString(physician.IsFemale, 'rozdělala', 'rozdělal')] v [ROOT.Char.Custom('GetChambersOrTent')|l] oheň, domníval jsem se, že jeho žár má pomoci uvést mé tělesné šťávy zpět do rovnováhy. Když mě však asistent [physician.GetFirstName] začal připoutávat k posteli, všiml jsem si železné tyče rozpálené v plamenech."
 health.4103.risky_treatment_disfigurement.1.desc: "[physician.GetFirstName] [Select_CString(physician.IsFemale, 'spatřila', 'spatřil')] mou hrůzu, když z brašny [Select_CString(physician.IsFemale, 'vytáhla', 'vytáhl')] dlouhý nůž a křivou jehlu. „Aby se vaše tělo zahojilo, musíme odstranit všechnu zasaženou tkáň a ránu uzavřít.“\n\nNevím, co bolelo víc — palčivá bolest trhaného masa a tah jehly procházející kůží, nebo pohled na sebe samotného potom."
 health.4103.end.desc: "\n\nK mému úžasu se mé tělo brzy začalo zotavovat!"
 health.4104.t: "$health_wounded_title$ Na cestě k uzdravení"
 health.4104.end.desc: "\n\nPo tom, čím jsem si během léčby prošel, jen těžko nacházím radost z toho, že se mé tělo zotavuje. Přesto se můj stav zlepšuje."
 health.4105.t: "$health_wounded_title$ Katastrofa"
 health.4105.end.desc: "\n\nNevěřil jsem, že by bolest mohla být ještě horší, ale brzy jsem zjistil svůj omyl."
 disease_contraction_feed_message.t: "[message_receiver.Custom2( 'RelationToMeShort', CHARACTER.Self )|U] onemocní"
 disease_contraction_feed_message.d_1: "[LEFT_CHARACTER.GetShortUIName|U] získává [Concept('trait','vlastnost')|E] [disease_trait.GetName( CHARACTER.Self )|LV]"
 disease_contraction_feed_message.d_2: "[LEFT_CHARACTER.GetShortUIName|U] a [RIGHT_CHARACTER.GetShortUIName|U] získávají [Concept('trait','vlastnost')|E] [disease_trait.GetName( CHARACTER.Self )|LV]"
 disease_contraction_feed_message.d: "[LEFT_CHARACTER.GetShortUIName|U], [RIGHT_CHARACTER.GetShortUIName|U] a $message_consolidation_others$ získávají [Concept('trait','vlastnost')|E] [disease_trait.GetName( LEFT_CHARACTER.Self )|LV]"
 disease_recovery_feed_message.t: "[message_receiver.Custom2('RelationToMeShort', SCOPE.sC('sick_character'))|U] se uzdravuje"
 health.6001.t: "Pokus"
 health.6001.desc_opening: "Ukončím svůj život. Při pomyšlení na vše, co tu po sobě zanechám, se mi srdce svírá žalem, ale mé rozhodnutí je pevné."
 health.6001.desc_depression: "Utrpení jako by nemělo konce."
 health.6001.desc_sickness: "Mé tělo se proměnilo ve vězení, které pomalu chřadne..."
 health.6001.desc_lunacy: "Stíny promluvily a já se k nim brzy připojím."
 health.6001.desc_loss: "Další ztrátu už nesnesu."
 health.6001.desc_stress: "Už to dál nezvládám."
 health.6001.desc_ending: "\n\nJeště se musím rozhodnout, jak to provedu..."
 health.6001.warning: "Vždy existuje možnost, že pokus selže"
 health.6001.a: "Najdu dostatečně vysokou budovu."
 health.6001.a_tribal: "Najdu dostatečně vysoký útes."
 health.6001.b: "Čaj ze smrtící rostliny... To skoro zní poživatelně."
 health.6001.c: "Teplá lázeň a ostrý nůž by měly stačit."
 health.6001.d: "Už si nejsem jistý, zda to opravdu chci."
 health.6001.d_tt: "O sebevraždu se nepokusíš"
 health.6002.desc_fall: "Když se přiblížím k okraji, vítr zachytí látku mého [ROOT.Char.Custom('GetClothingArticle')] a divoce jí kolem mě zmítá. Dolů je to pořádný kus."
 health.6002.desc_poison: "Jak se čaj vaří, vzduch naplní odporný zápach, jako by mi chtěl připomenout jeho účel. Naliju tekutinu do šálku. Rychle chladne a já jej zvedám ke rtům."
 health.6002.desc_knife: "Sedím v teplé lázni, zhluboka vdechuji páru a sahám po ostrém noži vedle sebe."
 health.6002.desc_ending: "\n\n„[ROOT.Char.GetFirstNameNoTooltip]! Nedělej to, [friendly_person.Custom2('RelationToMeShort', ROOT.Char)]!“\n\nOtočím se a spatřím [friendly_person.GetTitledFirstName], jak ke mně s vyděšeným výrazem natahuje ruku. „Prosím, takhle ne.“"
 health.6002.a: "Nezastavíš mě."
 health.6002.a_success: "Tvůj pokus uspěje"
 health.6002.a_failure: "Tvůj pokus selže"
 health.6002.b: "Máš pravdu. Třeba se ještě všechno zlepší."
 health.6004.desc: "Stačí jediný malý krok přes okraj. Vítr kolem mě kvílí, když zvednu nohu a vykročím vpřed.\n\nNa okamžik mám pocit, že visím ve vzduchu a svět se kolem mě otáčí. Pak se vše odehraje strašlivě rychle. Hukot větru v uších, pocit pádu, země řítící se mi vstříc..."
 health.6004.a: "Konečně svoboda."
 health.6005.desc: "Stačí jediný malý krok přes okraj. Vítr kolem mě kvílí, když zvednu nohu a—\n\nNáhle mě někdo strhne zpátky a strážný mě přitiskne k zemi. "
 health.6005.desc_ending: "„Omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')], ale nejste při smyslech!“"
 health.6005.a: "Mé plány jsou zmařeny..."
 health.6007.desc: "Vdechuji výpary stoupající z šálku čaje, který držím v rukou, a zavírám oči. Pomalu přiložím okraj ke rtům a dlouze se napiju. Polknu.\n\nSvět brzy začne šednout a ztrácet obrysy, zatímco se mi do zorného pole vkrádá temnota. Položím hlavu na stůl. Dech se mi stále zkracuje. Zavřu oči."
 health.6008.desc: "Vdechuji výpary stoupající z šálku čaje, který držím v rukou, a zavírám oči. Pomalu přiložím okraj ke rtům a—\n\nNěkdo mi šálek vytrhne z ruky a mrští jím o zem, kde se roztříští. Nade mnou stojí [Select_CString(dummy_gender.IsFemale, 'strážná', 'strážný')] s panikou v očích."
 health.6010.desc: "Kolem mě se převaluje pára z horké lázně. Zhluboka se nadechnu a vezmu do ruky nůž ležící vedle mě. Opatrně si jej přiložím k jedné paži a pak zatlačím. Silně.\n\nKdyž mám na obou pažích stejné řezné rány, nechám je znovu klesnout do rychle rudnoucí vody. Zakloním hlavu a povzdechnu si, zatímco se svět začíná točit. Už to nebude dlouho trvat..."
 health.6011.desc: "Právě když se chystám zaříznout nůž do paže a kolem mě se převaluje pára z horké lázně, vtrhnou dovnitř stráže a rychle mi nůž vyrvou z rukou.\n\n"
 health.6100.desc: "„Zdravím, [ROOT.Char.GetTitledFirstNameNoTooltip]. [Select_CString(friendly_person.IsFemale, 'Chtěla', 'Chtěl')] jsem vás jen navštívit a zeptat se, jak se vám daří od... té události před časem.“\n\n[friendly_person.GetTitledFirstName] se ptá s upřímnou vřelostí, kterou nedokáže zcela potlačit ani zmínka o mém pokusu o sebevraždu."
 health.6100.a: "Je mi lépe, děkuji."
 health.6100.b: "Do toho, jak mi je, ti nic není."
 health.6200.desc_opening: "Ve vzácné chvíli jasné mysli ucítím někoho u svého lůžka."
 health.6200.desc_close_person: "\n\nMusí to být [close_person.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('close_person'))] a jeden z mála lidí, kteří mě v poslední době ještě navštěvují. Pokusím se natáhnout ruku, ale prsty se ani nepohnou..."
 health.6200.desc: "V poslední době mě navštěvují už jen sluhové, ale potřebuji #EMP někoho#!, kdo mě vysvobodí..."
 health.6200.a: "„[close_person.GetFirstNameNoTooltip]... Prosím... Ukonči to...“"
 health.6200.a_success: "[close_person.GetFirstNameNoTooltip] souhlasí"
 health.6200.a_failure: "[close_person.GetFirstNameNoTooltip] odmítá"
 health.6200.a_failure_tt: "Nezemřeš"
 health.6200.b: "Tohle po [close_person.GetFirstNameNoTooltip] nemohu chtít. Musí to udělat sluha..."
 health.6200.b_2: "Musí to udělat sluha..."
 health.6200.b_success: "Sluha splní tvé přání"
 health.6200.b_failure: "Žádný sluha nesouhlasí"
 health.6203.desc: "Sedím u lůžka [incapable_person.GetTitledFirstName], když se oči náhle pohnou vzhůru a zdá se, že se vědomí na okamžik vrací. Od chvíle, kdy musí [incapable_person.GetFirstName] nehybně ležet na tomto lůžku, nepadlo téměř jediné slovo, ale ticho náhle prolomí sípavý hlas.\n\n„[ROOT.Char.GetFirstNameNoTooltip]? [ROOT.Char.GetFirstNameNoTooltip], prosím... Ukonči to. Smiluj se...“"
 health.6203.desc_murder: "\n\n[incapable_person.GetFirstName] vůbec netuší, jak dokonale mi tím hraje do karet!"
 health.6203.a: "Já... rozumím..."
 health.6203.b: "Ne! Jak po mně můžeš něco takového chtít?!"
 health.6204.desc_opening: "[close_person.GetTitledFirstName] něco odpovídá. Slovům nerozumím, ale od mého lůžka neodchází.\n\n"
 health.6204.desc_1: "Po chvíli vycítím pohyb a pak mi něco měkce přitiskne tvář. Tlak sílí. Nemohu dýchat a prostupuje mě jediný pocit... Vděčnost. Tak přece souhlasí. Opravdu..."
 health.6204.desc_2: "Po chvíli vycítím pohyb a pak na krku ucítím chladný, ostrý tlak. Řez téměř necítím. Slyším však prudké nadechnutí, řinčení nože dopadajícího na podlahu a kvílivý zvuk ve vlastních uších... A pak... Nic."
 health.6204.a: "Konečně svoboda..."
 health.6205.desc_1: "Po chvíli vycítím pohyb a pak mi něco měkce přitiskne tvář. Tlak sílí. Nemohu dýchat a prostupuje mě jediný pocit... Vděčnost. Právě když začínám odcházet, vzduch mi náhle znovu vtrhne do plic. Slyším pláč a hysterický hlas. Pak kroky vzdalující se z [ROOT.Char.Custom('GetRoom')|l]."
 health.6205.desc_2: "Po chvíli vycítím pohyb a pak na krku ucítím chladný, ostrý tlak. Tlak sílí a— pak slyším, jak nůž s řinčením dopadne na zem. Pláč, prosebný hlas, kroky vzdalující se z [ROOT.Char.Custom('GetRoom')|l]."
 health.6205.a: "Ne... Prosím... Vrať se..."
 health.6206.desc: "„[ROOT.Char.GetFirstNameNoTooltip]...“\n\nZ velké dálky jako by ke mně doléhal hlas. Je to [close_person.GetFirstName]. „[ROOT.Char.GetFirstNameNoTooltip], já... já nemůžu.“\n\nZaplaví mě zoufalství a mlhou v mé mysli proniká už jen pláč a zvuk vzdalujících se kroků."
 health.6207.desc: "Když příště vstoupí do [ROOT.Char.Custom('GetRoom')|l] sluha, ze všech sil se snažím prorazit mlhu ve své mysli a přemoci malátnost těla.\n\n„Ty... Kdo...?“\n\n„Já, [ROOT.Char.Custom('FormOfAddressForLiege')]?“ Kroky rychle zamíří k mému lůžku. „Jsem [servant.GetFirstName]. Mohu pro vás něco udělat?“"
 health.6207.a: "„[servant.GetFirstNameNoTooltip]... Prosím... Ukonči to...“"
 health.6207.a_success: "[servant.GetFirstNameNoTooltip] souhlasí"
 health.6207.a_failure: "[servant.GetFirstNameNoTooltip] odmítá"
 health.6209.desc_refusal: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Já...“\n\n"
 health.6209.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! To bych nikdy...! Jak po mně vůbec můžete něco takového...“\n\nZaplaví mě zoufalství a mlhou v mé mysli proniká už jen pláč a zvuk vzdalujících se kroků."
 health.6210.desc: "Čekám. I přes mlhu v mysli si pamatuji alespoň tohle — čekám na vysvobození, které mi může přinést [close_person.GetTitledFirstName], ale stále nepřichází. Proč...? Proč za mnou [close_person.GetFirstNameNoTooltip] nepřijde?"
 health.6210.a: "Copak mě i [close_person.GetFirstNameNoTooltip] opustil[Select_CString(close_person.IsFemale, 'a', '')]...?"
 health.7000.t: "Vězeň ve vlastním těle"
 health.7000.desc: "Bylo mi jasné, že stáří všechno zpomalí, ale nenapadlo mě, že se mé tělo začne zastavovat ještě před smrtí. V poslední době mě neustále sužuje malátnost a všechno stojí více sil než dřív. Mám strach, že když si lehnu, už se možná nedokážu znovu zvednout. Není pochyb, že můj čas se krátí."
 health.7000.desc_collapse: "Bylo mi jasné, že se přepínám — stačilo poslechnout, co mi tělo říká, ale jeho varování zůstalo bez povšimnutí. „Ještě tohle dokončím, než půjdu spát; jen pár věcí a pak si odpočinu.“ Najednou se mi zatočila hlava a při pokusu vstát se mi zatmělo před očima.\n\nDruhý den otevřu oči ve své posteli, ale vstát nedokážu. Tělo mě odmítá poslouchat. Možná za tím stojí [ROOT.Char.GetFaith.HighGodName] — trest za to, že jsem této tělesné schránce neprokazoval náležitou úctu. Vždyť jejím smyslem je služba a [ROOT.Char.GetFaith.HighGodNameAlternate] je tím, komu má být zasvěcena."
 health.7000.desc_closing: "\n\nMám pocit, že mi nezbývá nic než čekat, až si pro mě přijde sladké objetí smrti."
 health.7000.a: "Jak dlouho ještě budu čekat?"
 health.7000.a.lazy: "Alespoň můžu celý den ležet v posteli..."
 health.7100.desc: "Jaký je dnes den? Jak dlouho tentokrát odpočívám?\n\nV tvářích lidí, kteří mě pravidelně navštěvují, hledám jakoukoli známku — vrásku, jizvu, #bold cokoli#! — co by dokazovalo, že čas stále plyne. Když se mnou ostatní mluví, stále častěji mám pocit, jako by hovořili #bold o mně#!, nikoli #bold se mnou#!.\n\nJsem to pořád já, nebo už jen duše odloučená od vlastního těla? Žiju, nebo pouze existuji?"
 health.7100.a: "Má existence je utrpením."
 health.7200.t: "Kde to jsem?"
 health.7200.desc: "Počkat, proč jsem tady? Sem jsem přece nešel... nebo ano? Něco hledám?\n\nMožná o nic nešlo... počkat, na co jsem to vlastně myslel?\n\nBolí mě hlava..."
 health.7200.a: "Měl bych se vrátit do postele..."
 health.7300.t: "Slábnoucí zrak"
 health.7300.desc: "Bylo slunce vždycky tak oslnivé? Jeho paprsky mě bodají do očí jako hroty kopí, raději se ukryji ve stínu...\n\n...byly stíny vždycky tak temné?"
 health.7300.a: "Svět vypadá mdle a bezbarvě."
 health.7400.t: "Slábnoucí srdce"
 health.7400.desc: "Svírá se mi hruď — a dech mi dochází jako nikdy předtím, lapám po něm jako černý pes za parného dne. Do čelisti se mi vkrádá slabá bolest, pak sjede paží dolů a zase pomine...\n\nAle proč? Vždyť k tomu nebyl žádný důvod."
 health.7400.a: "Měl bych se šetřit."
 health.7500.t: "Bolavé kosti"
 health.7500.desc: "Au! Proč mě tak strašně bolí záda? Při vstávání z postele jsem jen trochu klopýtl, nic vážného...\n\nŽádná modřina, žádná rána, ale bolest mi vystřeluje celou páteří.\n\nUrčitě to přejde."
 health.7500.a: "Měl bych si dávat pozor, kam šlapu."
