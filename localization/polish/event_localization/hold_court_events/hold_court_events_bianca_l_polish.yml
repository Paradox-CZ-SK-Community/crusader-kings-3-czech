l_polish:
 hold_court.3000.t: "Hostina ve tvém jménu"
 hold_court.3000.desc.opening: "[feast_vassal.GetTitledFirstName] ke mně přistupuje se vzpřímenějším držením těla než obvykle a očividně se nemůže dočkat, až mi sdělí, co má na srdci.\n\n"
 hold_court.3000.desc.opening.blind: "Slyším, jak se ke mně blíží kroky [feast_vassal.GetTitledFirstName]. Když se zastaví, následuje zjevně nacvičené odkašlání, snad ve snaze upoutat mou pozornost. Z hlasu je znát, že má z toho, co se chystá říct, radost.\n\n"
 hold_court.3000.desc.likes: "„[ROOT.Char.Custom('FormOfAddressForLiege')], za vaší vlády je co slavit! Dovolte mi prosím uhradit náklady na vaši příští hostinu! Snad se mi za to v budoucnu dostane nějaké laskavosti?“"
 hold_court.3000.desc.dislikes: "„[ROOT.Char.Custom('FormOfAddressForLiege')]. Lidé ve vašem panství občas potřebují radostné setkání, při němž mohou zapomenout na své starosti. Náklady na hostinu ochotně vezmu na sebe, i kdyby se konala ve vašem jménu; [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] z toho bude jen těžit. Za to ovšem právem očekávám protislužbu.“"
 hold_court.3000.a: "Dobrá, přijímám."
 hold_court.3000.a.tt: "Pokud v blízké době uspořádáš hostinu, získáš odměnu v podobě [Concept('court_grandeur_value','velkoleposti dvora')|E]."
 hold_court.3000.b: "Bez protislužby! Tak zní můj rozkaz!"
 hold_court.3000.c: "Možná bychom se mohli domluvit na něčem přijatelnějším?"
 hold_court.3000.c.success: "[feast_vassal.GetTitledFirstNameNoTooltip] souhlasí, že upustí od požadavku na laskavost"
 hold_court.3000.c.failure: "[feast_vassal.GetTitledFirstNameNoTooltip] nesouhlasí a stahuje svou nabídku uhradit náklady"
 hold_court.3000.d: "Obávám se, že nemohu přijmout."
 hold_court.3001.desc: "To byla ale nádherná hostina! [feast_vassal.GetTitledFirstName] i všichni, kdo byli onoho dne přítomni, mají můj slib uspořádat hostinu stále v živé paměti a dnešní hosté mě nadšeně opěvují. Když mě lidé oslavovali a téměř mi padali k nohám, štěstím se mi točila hlava! A protože jsem svůj slib [Select_CString(ROOT.Char.IsFemale,'dodržela','dodržel')], všichni přítomní navíc mluví o mém dvoře jen v dobrém!"
 hold_court.3001.desc.dead: "Ach, to byla ale nádherná hostina! Jen škoda, že [feast_vassal.GetTitledFirstName] ji [Select_CString(feast_vassal.IsFemale,'nemohla','nemohl')] vidět. Někteří hosté si vzpomněli na můj dávný slib uspořádat hostinu a vřele mluvili o tom, jak dbám na zábavu u svého dvora. Někteří si dokonce mysleli, že [feast_vassal.GetFirstNameNoTooltip] má být touto oslavou také [Select_CString(feast_vassal.IsFemale,'uctěna','uctěn')]. Ať tak či tak, dodržení slibu přineslo své ovoce: všichni přítomní teď mluví o mém dvoře jen v dobrém!"
 hold_court.3001.a: "Příští hostina bude určitě ještě lepší!"
 hold_court.3001.b: "Ještě jednu rundu na [Select_CString(feast_vassal.IsFemale,'její','jeho')] počest!"
 hold_court.3010.t: "Nekonvenční [Select_CString(unconventional_preacher.IsFemale,'kazatelka','kazatel')]"
 hold_court.3010.desc.opening: "„[ROOT.Char.Custom2('RelationToMeAddress', religious_vassal)|U],“ [religious_vassal.GetTitledFirstNamePossessive] hlas zní přísně. „Žádám, abychom zahájili vyšetřování [Select_CString(unconventional_preacher.IsFemale,'jedné nechvalně proslulé kazatelky','jednoho nechvalně proslulého kazatele')] v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Víte, [Select_CString(unconventional_preacher.IsFemale,'tahle kazatelka','tenhle kazatel')] je... No... "
 hold_court.3010.desc.preacher_gender: "Vždyť je to #EMP [Select_CString(unconventional_preacher.IsFemale,'žena','muž')]!#! "
 hold_court.3010.desc.closing: "To je v rozporu s naší vírou!“\n\n[tolerant_vassal.GetTitledFirstName] zvedne ruku, vykročí vpřed a přeruší [religious_vassal.GetFirstNamePossessiveNoTooltip] řeč. „[ROOT.Char.Custom2('RelationToMeAddress', tolerant_vassal)|U], [religious_vassal.GetFirstNameNoTooltip] má ve svém hodnocení pravdu, ale tohle je #EMP jediná#! věc, kterou lze [Select_CString(unconventional_preacher.IsFemale,'kazatelce','kazateli')] vytknout. Všechno, co učí, je v souladu s naší vírou.“"
 hold_court.3010.a: "[Select_CString(unconventional_preacher.IsFemale,'Tahle kazatelka','Tenhle kazatel')] musí přijít na můj dvůr!"
 hold_court.3010.b: "Ať mi zmizí z očí!"
 hold_court.3010.c: "Chci [Select_CString(unconventional_preacher.IsFemale,'ji','ho')] zaměstnat jako $high_almoner_court_position$."
 hold_court.3010.d: "Když dokáže učit rolníky, určitě se osvědčí jako $court_tutor_court_position$..."
 hold_court.3020.t: "Pohoršující památník"
 hold_court.3020.desc: "[Select_CString(different_culture_peasant.IsFemale,'Rolnice','Rolník')] předstupuje s peticí. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], [village.GetCountyData.GetCulture.GetCollectiveNounNoTooltip] z [village.GetName] mě vyslali jako [Select_CString(different_culture_peasant.IsFemale,'svou zástupkyni','svého zástupce')].“ Na okamžik se odmlčí uprostřed očividně nacvičené řeči.\n\n„Naši prosbu o obnovu významného památníku naší kultury [holder_of_area.GetTitleTierName] odmítá vyslyšet. Dokonce nám v obnově aktivně brání!“\n\n„[ROOT.Char.Custom2('RelationToMeAddress', holder_of_area)|U], dovolte mi to vysvětlit!“ [holder_of_area.GetFirstNameNoTooltip] vyděšeně vpadne do řeči. „Ten památník zesměšňuje naši kulturu! [holder_of_area.GetCulture.GetCollectiveNounNoTooltip] jsou na něm vyobrazeni jako nestvůry! Jistě chápete, proč se obnově tak nenávistného památníku bráním!“"
 hold_court.3020.a: "„Strhněte ho!“"
 hold_court.3020.b: "Obnovu tímto schvaluji."
 hold_court.3020.c: "Místo něj postavte jiný, který bude představovat obě kultury."
 every_county_of_culture: "Každé [Concept('county','hrabství')|E] ve tvém [Concept('realm','panství')|E], kde převládá [village.GetCountyData.GetCulture.GetName] kultura"
 3020_MONUMENT_VALUE: "Obnovená socha"
 3020_multicultural_monument: "Multikulturní památník"
 3020_multicultural_monument_desc: "Významný kulturní památník byl nedávno zrenovován a doplněn o prvky jiné kultury, čímž se rozostřily hranice mezi oběma kulturami.\n\n#P +10%#! Rychlost kulturní konverze"
 3020_own_culture_monument: "Památník nadvlády"
 3020_own_culture_monument_desc: "Významný kulturní památník byl nedávno stržen a nahrazen památníkem jiné kultury. To pobouřilo místní a ohrozilo jejich kulturní identitu.\n\n#P +10%#! Rychlost kulturní konverze"
 hold_court.3030.t: "Obnova památníku"
 hold_court.3030.desc: "[Select_CString(different_culture_peasant.IsFemale,'Rolnice','Rolník')] stojí přede mnou a přednáší dvoru svou prosbu.\n\n„Jsme [different_culture_peasant.GetCulture.GetCollectiveNounNoTooltip] a [province.GetName] je náš domov. Nedávná válka těžce poznamenala okolní krajinu. Nevíme, kdo za tím stojí, ale kdosi vyplenil místo, které má pro naši kulturu velký význam. Prosíme vás, poskytněte nám trochu prostředků, abychom je mohli obnovit!“\n\nProsbu zakončí neohrabanou úklonou — jasným znamením nízkého původu."
 hold_court.3030.a: "„Dostanete prostředky potřebné k obnově.“"
 hold_court.3030.b: "Zbylý materiál použijte na jiné stavby."
 hold_court.3030.c: "„Nemůžeme si dovolit utrácet zlato za něco takového.“"
 hold_court.3040.t: "Žádost o trochu smíchu"
 hold_court.3040.desc: "Během krátké chvíle ticha si všimnu [jester_requester.GetTitledFirstName], [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('jester_requester'))], než mi dojde, že teď má promluvit. „[ROOT.Char.Custom2('RelationToMeAddress', jester_requester)|U]!“ pronese, čímž si získá několik drahocenných okamžiků na utřídění myšlenek, než pokračuje.\n\n„Úsměvy a smích jsou nejlepším znamením, že dvůr skutečně žije! A tak bych [Select_CString(jester_requester.IsFemale,'ráda navrhla','rád navrhl')] někoho, kdo by nás mohl navštívit a skvěle nás bavit jako šašek!“\n\n„[ROOT.Char.Custom2('RelationToMeAddress', kill_joy)|U], dovolíte-li.“ [kill_joy.GetTitledFirstName] se ozve ze strany. „Šašek zničí vytříbenou atmosféru tohoto dvora a jeho noblesu nahradí hrubým, dětinským humorem.“"
 hold_court.3040.a: "Toho tvého šaška zaměstnám!"
 hold_court.3040.b: "[jester_requester.GetTitledFirstNameNoTooltip] se na tu roli dokonale hodí, vždyť umí tak skvěle dělat [Select_CString(jester_requester.IsFemale,'hlupačku','hlupáka')]."
 hold_court.3040.c: "Když se [kill_joy.GetTitledFirstNameNoTooltip] [Select_CString(kill_joy.IsFemale,'nerada','nerad')] směje, ať je tentokrát terčem posměchu!"
 hold_court.3040.d: "Tohle NENÍ selský trh! Šašek na tomto dvoře nemá co dělat!"
 hold_court.3040.e: "Možná se tím budu zabývat někdy jindy."
 generic_cp_discount_tt: "Obsazení této [Concept('court_position','dvorní pozice')|E] bude o #P 50%#! levnější"
 hold_court.3060.t: "Boj s korupcí"
 hold_court.3060.desc.opening: "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('county_petitioner'))], [county_petitioner.GetTitledFirstName], [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('county_petitioner'))] a poté předstoupí, aby [Select_CString(county_petitioner.IsFemale,'přednesla','přednesl')] svou prosbu. „[ROOT.Char.Custom2('RelationToMeAddress', county_petitioner)|U], žádám tě o pomoc s jedním problémem. "
 hold_court.3060.desc.thieves: "Zloději okrádají hrabství [corrupt_county.GetNameNoTier] i jeho obyvatele!"
 hold_court.3060.desc.bandits: "Bandité sužují prostý lid hrabství [corrupt_county.GetNameNoTier]!"
 hold_court.3060.desc.tax: "Výběr daní v hrabství [corrupt_county.GetNameNoTier] nefunguje!"
 hold_court.3060.desc.sheriffs: "V hrabství [corrupt_county.GetNameNoTier] je nedostatek šerifů!"
 hold_court.3060.desc.guilds: "Cechy v hrabství [corrupt_county.GetNameNoTier] odmítají spolupracovat!"
 hold_court.3060.desc.levies: "Stavy odvedenců v hrabství [corrupt_county.GetNameNoTier] se nedoplňují dostatečně rychle!"
 hold_court.3060.desc.courts: "V hrabství [corrupt_county.GetNameNoTier] chybějí soudy!"
 hold_court.3060.desc.rulers: "Správa hrabství [corrupt_county.GetNameNoTier] je žalostná!"
 hold_court.3060.desc.closing: "\n\nPo chvíli ticha si [county_petitioner.GetFirstNameNoTooltip] povzdechne. „Mé državy jsou jen jedny z mnoha v panství, které trpí nedostatkem kontroly. Prosím o jakoukoli pomoc, kterou můžeš postrádat.“"
 hold_court.3060.a: "Do těchto neklidných oblastí musíme investovat."
 hold_court.3060.b: "Můj správce ti může poradit."
 hold_court.3060.c: "Bohužel, pokladnice zeje prázdnotou."
 hold_court.3060.d: "Tu práci by lépe [Select_CString(cp_steward_replacement.IsFemale,'zvládla','zvládl')] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('cp_steward_replacement'))], [cp_steward_replacement.GetFirstNameNoTooltip]."
 every_low_county_control: "Každé [Concept('county','hrabství')|E] v [Concept('realm','panství')|E] s hodnotou [Concept('control','kontroly')|E] 33 nebo méně"
 hold_court.3080.t: "Výstava sbírky [ROOT.GetCharacter.GetTitledFirstNamePossessive]"
 hold_court.3080.desc: "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('antiquarian'))], [antiquarian.GetTitledFirstName], ke mně přichází pružným krokem.\n\n„[ROOT.Char.Custom2('RelationToMeAddress', antiquarian)|U]!“ zvolá [antiquarian.GetFirstNameNoTooltip] plný nadšení. „Mám skvělý nápad, který ti může přinést peníze nebo slávu! [Select_CString(ROOT.Char.IsFemale,'Nashromáždila','Nashromáždil')] jsi už úctyhodnou sbírku artefaktů, [ROOT.Char.Custom('FormOfAddressForLiege')], tak proč ji nevystavit? Za její prohlídku můžeš vybírat vstupné, nebo ji zpřístupnit zdarma, aby ji vidělo více lidí.“\n\n[antiquarian.GetFirstNameNoTooltip] si odkašle a pokračuje: „Lidé mají sklon toužit po tom, co spatří, takže nevýhodou může být, že se více z nich pokusí vznést nárok na tvé artefakty.“"
 hold_court.3080.a: "Ať lidé zaplatí i za pouhý pohled na mou slávu!"
 hold_court.3080.a.tt: "Nepřátelské plány zaměřené na artefakty budou častější."
 hold_court.3080.b: "Někteří musí vidět, aby uvěřili, a to platí i pro ty méně majetné."
 hold_court.3080.c: "Takové riziko za to nestojí."
 hold_court.3090.t: "Oslava jiné kultury"
 hold_court.3090.desc: "[ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('different_culture_vassal'))], [different_culture_vassal.GetTitledFirstName], ke mně přichází, [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('different_culture_vassal'))], jak mívá ve zvyku.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], mám skvělý nápad! Co kdybychom uspořádali jarmark, nebo dokonce slavnost pro prostý lid, aby poznal některou z jiných kultur? Vždyť [ROOT.Char.Custom('RealmType')] je domovem tolika rozmanitých národů.“ [different_culture_vassal.GetFirstNameNoTooltip] svůj nápad rozvádí dál a dál, až se nebezpečně blíží přehnaně podrobnému výkladu.\n\n„Bude to něco stát, ale určitě to pomůže vybudovat lepší vztahy mezi našimi národy!“"
 hold_court.3090.a: "Uspořádáme velkou slavnost na počest obou našich kultur!"
 hold_court.3090.b: "Místem malého jarmarku věnovaného [different_culture_vassal.GetCulture.GetNameNoTooltip] kultuře bude [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 hold_court.3090.c: "Ať [different_culture_vassal.GetCulture.GetCollectiveNounNoTooltip] na vlastní oči spatří velikost [ROOT.GetCharacter.GetCulture.GetNameNoTooltip] kultury na výstavě!"
 hold_court.3090.d: "Na tohle nemohu vynakládat prostředky."
 hold_court.3091.t: "Splývání kulturních identit"
 hold_court.3091.desc: "Vzduch je prosycen očekáváním, když ke mně přichází [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('same_culture_vassal'))], [same_culture_vassal.GetTitledFirstName].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], přináším vážné zprávy, ale také řešení tohoto problému. Je stále zřejmější, že [different_culture_vassal.GetCulture.GetCollectiveNoun] a [same_culture_vassal.GetCulture.GetCollectiveNoun] si jsou čím dál, možná až #EMP příliš#! podobní. Je naprosto nezbytné ukázat, že právě my, [same_culture_vassal.GetCulture.GetCollectiveNounNoTooltip], stojíme v čele pokroku!“"
 hold_court.3091.a: "Uspořádejme slavnost na počest naší bohaté [same_culture_vassal.GetCulture.GetNameNoTooltip] kultury!"
 hold_court.3091.b: "Uspořádejme výstavu našich největších úspěchů."
 hold_court.3091.c: "Nemusíme dokazovat svou nadřazenost nad jinými kulturami."
