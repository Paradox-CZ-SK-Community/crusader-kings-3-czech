l_polish:
 hold_court.4001.t: "Pohroma"
 hold_court.4001.desc.intro: "[annoyed_vassal.GetTitledFirstName] vtrhne před můj trůn. „[ROOT.Char.Custom2('RelationToMeAddress', annoyed_vassal)|U], mnozí si myslí, že by se tvým nástupcem měl stát spíše [preferred_heir.GetTitledFirstName] než [annoying_heir.GetTitledFirstName]. Po celém [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] se ví, že [Select_CString(annoying_heir.IsFemale,'tvá dědička','tvůj dědic')] [annoying_heir.GetTitledFirstNameNoTooltip] dokáže urážet tak dokonale, až by se to dalo považovat za umění!"
 hold_court.4001.heir_street_fight: "[Select_CString(annoying_heir.IsFemale,'Ta zatracená ničemnice','Ten zatracený ničema')] se potlouká před krčmami a provokuje opilé sedláky ke rvačkám. Několik jich při těchto potyčkách už zemřelo, protože [annoying_heir.GetTitledFirstNameNoTooltip] zabíjí pro zábavu!“"
 hold_court.4001.heir_robbery: "Cestou sem mě [Select_CString(annoying_heir.IsFemale,'přepadla jezdkyně','přepadl jezdec')] na koni v křiklavém přepychovém oděvu. [Select_CString(annoying_heir.IsFemale,'Svlékla','Svlékl')] mě, [Select_CString(annoying_heir.IsFemale,'přivázala','přivázal')] ke stromu, pak si [Select_CString(annoying_heir.IsFemale,'sundala','sundal')] masku a škodolibě se [Select_CString(annoying_heir.IsFemale,'pochlubila','pochlubil')], že je ve skutečnosti [annoying_heir.GetTitledFirstNameNoTooltip]!“"
 hold_court.4001.heir_tavern: "[annoying_heir.GetTitledFirstNameNoTooltip] prakticky žije v krčmě, a jakmile utratí celé své kapesné, ostatní [Select_CString(annoying_heir.IsFemale,'jí','mu')] kupují pití výměnou za oplzlé napodobování tebe!“"
 hold_court.4001.heir_diplomacy_failure: "[annoying_heir.GetTitledFirstNameNoTooltip] odmítá chodit na jakákoli jednání, a když jsem se zeptal proč, dostalo se mi odpovědi: „Jsou příliš nudná. Mnohem víc zábavy bychom si užili, kdybychom se navzájem zabíjeli.“"
 hold_court.4001.heir_hated: "[annoying_heir.GetTitledFirstNameNoTooltip] je [Select_CString(annoying_heir.IsFemale,'nesnesitelná chvastounka','nesnesitelný chvastoun')] a dokonce se přede mnou [Select_CString(annoying_heir.IsFemale,'chlubila','chlubil')], že je [Select_CString(annoying_heir.IsFemale,'jí','mu')] úplně jedno, jestli [Select_CString(annoying_heir.IsFemale,'ji','ho')] má někdo z nás rád.“"
 hold_court.4001.protective_parent: "\n\n[protective_parent.GetTitledFirstNameNoTooltip] zděšeně mlaskne. „Moje [annoying_heir.Custom('PetName')] by nikdy nic takového neudělalo!“"
 hold_court.4001.accusation_default: "\n\n[annoyed_vassal.GetTitledFirstNameNoTooltip] si povzdechne. „Ale jsem si jist, že [annoying_heir.GetTitledFirstNameNoTooltip] všechno popře.“"
 hold_court.4001.heir_admission: "\n\nNa tváři [annoying_heir.GetTitledFirstNamePossessiveNoTooltip] se rozhostí vlčí úsměv. „Ale ano. Rozhodně jsem to udělal.“"
 hold_court.4001.a: "Jak roztomilé, [Select_CString(annoying_heir.IsFemale,'celá po své','celý po svém')] [ROOT.Char.GetMotherFather]!"
 hold_court.4001.b: "Tohle byla poslední kapka! [preferred_heir.GetTitledFirstNameNoTooltip] bude má volba."
 hold_court.4001.c: "Z vlastní zkušenosti vím, že [preferred_heir.GetTitledFirstNameNoTooltip] je stejně nesnesitelný!"
 hold_court.4001.d: "Právě díky jeho nedokonalostem ho vojáci považují za jednoho z nich!"
 disabled_fallback: "vypnuto"
 hold_court.4500.t: "Nekonečná poezie"
 hold_court.4500.desc: "Přistoupí ke mně nádherná postava, kolem níž jako by se vznášel záblesk vnuknutí. „[Select_CString(demanding_poet.IsFemale,'Jsem velká básnířka a urazila jsem','Jsem velký básník a urazil jsem')] dlouhou cestu jen proto, [Select_CString(demanding_poet.IsFemale,'abych vám mohla sloužit. Složila jsem','abych vám mohl sloužit. Složil jsem')] největší baladu, jakou kdy vesmír poznal, o vaší slávě a velkoleposti [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] dvora.“"
 hold_court.4500.a: "Básníka nepotřebuji."
 hold_court.4500.b: "Tvé verše mají své kouzlo. Přijď psát pro můj dvůr."
 hold_court.4600.t: "Kdo ze sebe učiní bestii..."
 hold_court.4600.desc: "Před můj trůn předstoupí hlouček špinavých sedláků. Jsou ozbrojeni těmi nejhrozivějšími hořícími zemědělskými nástroji, jaké jsem za celou svou kariéru potlačování povstání [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')].\n\n„Ta bytost, která nám vládne, je skutečný démon v lidské podobě. [Select_CString(ROOT.Char.IsFemale,'Žádná skutečná žena by nebyla schopna','Žádný skutečný muž by nebyl schopen')] takových násilných výstřelků a bezbožností. Žádáme konec tvé zrůdné tyranie!“"
 hold_court.4600.a: "Nejsem démon, jsem [ROOT.Char.GetTitleAsNameNoTooltip], což je mnohem, #EMP mnohem#! horší."
 hold_court.4600.b: "Rozkošná představa! [chancellor.GetCouncilTitle]! Rozhlaš, že jsem démon."
 hold_court.4600.c: "[Select_CString(ROOT.Char.IsFemale,'Opravdu jsem byla tak ohavná?','Opravdu jsem byl tak ohavný?')]"
 hold_court.4600.c.tt: "Na změnu ještě není pozdě."
 hold_court.4600.d: "Ať mi ta chátra zmizí z očí."
 hold_court.4601.t: "[Select_CString(ROOT.Char.IsFemale,'Má lahodná paní,','Můj lahodný pane,')]"
 hold_court.4601.d: "Mé srdce se od chvíle, kdy jsem začal slýchat měšťany vyprávět, že máš duši skutečného démona, téměř nepřestalo chvět. Věčně budu litovat, že jsem dosud neměl tu čest lépe poznat tvou děsivou osobu.\n\nNavštiv můj hrad a povečeříme ty nejsyrovější lahůdky, jaké [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] zná!"
 hold_court.4601.a: "To zní znamenitě!"
 hold_court.4601.b: "Doma pořádáme vytříbenější hostiny..."
 hold_court.4602.t: "[Select_CString(ROOT.Char.IsFemale,'Má lahodná paní','Můj lahodný pane')]"
 hold_court.4602.desc: "[cannibal_vassal.GetTitledFirstNamePossessiveNoTooltip] [cannibal_vassal.Custom('FortifiedBuilding')] osvětluje jen několik mihotavých svíček. [cannibal_vassal.GetTitledFirstNameNoTooltip] mě usadí k hodovnímu stolu, na němž nejsou žádné pokrmy kromě nesčetných kusů sotva tepelně upraveného masa.\n\n[cannibal_vassal.GetTitledFirstNameNoTooltip] se skrývá za mou židlí a čeká, až si něco vyberu. Po chvíli se mi nakloní k hlavě a vycení zuby.\n\n„Dnes večer před námi leží mnoho znamenitých [Select_CString(ROOT.Char.IsFemale,'žen','mužů')], ale nikdo není tak lahodný jako ty!“"
 hold_court.4602.a: "Koho bych si [Select_CString(ROOT.Char.IsFemale,'měla','měl')] dát jako předkrm?"
 hold_court.4602.b: "Dobrá, můžeš si jednou kousnout."
 hold_court.4602.c: "Já už raději půjdu! Tohle je opravdu nevkusné!"
 hold_court.4900.t: "Za dávných časů..."
 hold_court.4900.desc: "K mému trůnu se blíží prastará postava a každý její krok doprovází cvaknutí a ťuknutí hole.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jsem genealog a jistě víš, že pocházíš z urozeného rodu. Urozený původ však není totéž co původ božský či bájný. Toužím sepsat svitek, který vystopuje celý tvůj rod až k úsvitu dějin. Za pouhých pár zlaťáků mohu tobě i celému světu odhalit pravdu: jsi skutečným potomkem [ROOT.GetCharacter.Custom('GetMythicalFounder')]!“"
 hold_court.4900.a: "„K tomu nepotřebuji žádný kus papíru!“"
 hold_court.4900.b: "„Výborně! Ať je ten seznam pořádně dlouhý!“"
 hold_court.4900.c: "„[ROOT.GetCharacter.Custom('GetMythicalFounder')]? Proti mně nic neznamená!“"
 hold_court.4900.d: "„Má dynastie je možná zatím malá, ale hlupáci nejsme!“"
 hold_court.4900.e: "„Dokonalý základ pro upevnění mé legendární pověsti!“"
 hold_court.4901.desc.intro: "Po několika dnech se genealog [suspicious_genealogist.GetTitledFirstName] vrátí. Rozvine svitek tak dlouhý, že by mohl obkroužit jednu z mých provincií. Můj [chaplain.GetCouncilTitle] o něj málem zakopne, když se jeho konec dokutálí až k úpatí mého trůnu.\n\n„Zde mám pravdu o tvém původu, [ROOT.Char.Custom('FormOfAddressForLiege')],“ [suspicious_genealogist.GetTitledFirstNameNoTooltip] si odkašle a začne předčítat, „dnes odhalujeme velkolepé dějiny. Před námi stojí [ROOT.GetCharacter.GetTitledFirstNameNoTooltip],"
 hold_court.4901.mothers: "dcera [mother_1.GetFullNameNicknamedNoTooltip], zplozená obávanou [mother_2.GetFullNameNicknamedNoTooltip], plod beder [mother_3.GetFullNameNicknamedNoTooltip], vzešlá z lůna [mother_4.GetFullNameNicknamedNoTooltip], dítě půvabné [mother_5.GetFullNameNicknamedNoTooltip]..."
 hold_court.4901.fathers: "syn [father_1.GetFullNameNicknamedNoTooltip], zplozený obávaným [father_2.GetFullNameNicknamedNoTooltip], plod beder [father_3.GetFullNameNicknamedNoTooltip], syn pozoruhodného [father_4.GetFullNameNicknamedNoTooltip], dítě [father_5.GetFullNameNicknamedNoTooltip]...“"
 hold_court.4901.desc.outro: "\n\nNěkolika lidem u dvora začínají klesat víčka."
 hold_court.4901.a: "Je čas si zdřímnout. Budu snít o vlastní slávě."
 hold_court.4901.a.tt: "Zbytek dvora ponecháš soustředěnému poslechu"
 hold_court.4901.b: "To je napínavější než jakákoli balada! Sedím na samém kraji trůnu!"
 hold_court.4901.c: "„Dost! [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTooltip] ti za tvé služby dluží odměnu.“"
