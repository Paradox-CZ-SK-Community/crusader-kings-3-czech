l_polish:
 hold_court.7000.t: "Spravedlivý podíl"
 hold_court.7000.desc: "[local_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přichází ke dvoru a očima dychtivě hltá bohatství, jaké si lze v hlavním městě dopřát.\n\n„[ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U] budí závist celého světa, [ROOT.Char.Custom('FormOfAddressForLiege')], ale ne celé tvé panství má takové štěstí. [low_dev_county.GetNameNoTier] je například krajem, kde pole leží ladem a není téměř nikoho, kdo by se o ně staral. Nebylo by nádherné, kdyby celé panství mohlo být stejně velkolepé? Vždyť [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U] ukazuje, čeho lze dosáhnout.“"
 hold_court.7000.a: "„To by bylo.“"
 hold_court.7000.b: "„A co třeba [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U]? Tvoji poddaní by měli zkusit žít tam.“"
 hold_court.7000.c: "„Mělo by mě to zajímat? Nezajímá.“"
 hold_court.7010.t: "Dvě víry, jedna rodina"
 hold_court.7010.desc: "[friendly_neighbour.Custom2('MyCharacterIntroduction', ROOT.Char)|U] rázně vstoupí do síně s nepatřičnou sebejistotou, jako by snad [Select_CString(friendly_neighbour.IsFemale,'nebyla pouhou vetřelkyní','nebyl pouhým vetřelcem')] na mém blahosklonném [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] dvoře.\n\n„Zdravím tě, [ROOT.Char.GetTitleAsNameNoTooltip|U] [ROOT.Char.GetFirstName]. Není tajemstvím, že jsi [Select_CString(ROOT.Char.IsFemale,'žena','muž')] a na hranicích máš mnoho nepřátel, ale bude-li mi přát štěstí, mezi ně patřit nechci. Mnozí by nejraději viděli, jak [ROOT.Char.GetFaith.GetAdherentNamePlural] z této oblasti zmizí, ale já navrhuji, abychom mezi sebou nastolili mír. Věc je prostá: na jedné straně [potential_prince.Custom('GetDaughterSon')] z tvé rodiny, na druhé [foreign_princess.Custom('GetDaughterSon')] z mé. Ať se ti dva vezmou a bude po svárech.“"
 hold_court.7010.a.jewish: "„Mazel tov!“"
 hold_court.7010.a: "„Pak tedy bude svatba!“"
 hold_court.7010.b: "„Má čepel žízní po krvi! [friendly_neighbour.GetFaith.GetAdherentNameNoTooltip] bude první na řadě!“"
 hold_court.7010.c: "„Takový sňatek by byl kacířstvím.“"
 every_county_10_dev_below_capital: "Každé [Concept('county','hrabství')|E], které má alespoň o 10 úrovní nižší [Concept('development','rozvoj')|E] než tvé [Concept('capital','hlavní město')|E]"
 hc_7000_dev_boost: "Vzkvétající rozvoj"
 hc_7000_dev_boost_desc: "Do tohoto hrabství byly nedávno přesměrovány prostředky na podporu jeho rozvoje."
 hc_7000_dev_reduction: "Brzděný rozvoj"
 hc_7000_dev_reduction_desc: "Prostředky tohoto hrabství jsou odváděny do vzdálených částí panství, což zde zhoršuje životní podmínky."
 hc_7010_holy_war: "Přípravy na svatou válku"
 hc_7010_holy_war_desc: "Tato postava nedávno nařídila, aby byli všichni nevěřící v jejích zemích i jejich okolí vyhlazeni."
 hc_7010_tolerance: "Tolerantní sňatek"
 hc_7010_tolerance_desc: "Nedávný sňatek jednoho z příbuzných této postavy s osobou jiné víry šíří po jejích zemích tolerantnější postoje."
 hold_court.7020.t: "Štít [ROOT.Char.GetFaith.GetNameNoTooltip]"
 hold_court.7020.desc.intro: "[same_faith_friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] dnes vstupuje k mému dvoru. Příchod doprovází pochmurný průvod. [ROOT.Char.GetFaith.PriestNeuterPlural] cestou odříkávají tradiční [ROOT.Char.GetFaith.GetAdjective] modlitby.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip|U], ty i já dobře víme, že staré způsoby jsou ohroženy."
 hold_court.7020.desc.mid.oppression: "[threatening_ruler.GetName] [Select_CString(threatening_ruler.IsFemale,'podrobila','podrobil')] nespočet věřících, kteří uctívají [ROOT.Char.GetFaith.HighGodName|U], a každým dnem roste nebezpečí jejich násilného obrácení na jinou víru."
 hold_court.7020.desc.mid.recent_war: "Tvé země znesvětila [threatening_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip|U] vojska a [ROOT.Char.GetFaith.HighGodNamePossessive|U] chrámy lehly popelem."
 hold_court.7020.desc.mid.holy_site: "Naše svatá místa nám zůstávají nedostupná a obávám se, že věřící možná nikdy nebudou moci navštívit [ROOT.Char.GetFaith.HighGodNamePossessive|U] vyvolená místa na tomto světě."
 hold_court.7020.desc.outro: "Je mi jasné, že musíme naši víru uspořádat tak, aby staré způsoby přežily i to, co přináší [threatening_ruler.GetFaith.GetReligion.GetName].“"
 hold_court.7020.a: "„Přežití si žádá změnu.“"
 hold_court.7020.b: "„Vytrvejme. Svých způsobů se nesmíme vzdát.“"
 hold_court.7020.c: "„Společně dokážeme staré způsoby zachovat navždy.“"
 rival_planning_holy_war: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'odmítla','odmítl')] [TARGET_CHARACTER.GetShortUINamePossessive] prosbu o náboženský mír"
 rival_planning_holy_war_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'odmítla','odmítl')] [CHARACTER.GetShortUINamePossessive] prosbu o náboženský mír"
 friend_beyond_faith: "Náboženské rozdíly ustoupily rodině a spojenectví ([CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetShortUIName])"
 friend_united_by_faith: "Společná víra vytvořila pevné pouto ([CHARACTER.GetShortUIName|U], [TARGET_CHARACTER.GetShortUIName])"
 ignore_3_site_rule_tt: "Můžeš reformovat svou [Concept('faith','víru')|E] bez obvyklého požadavku ovládat [Concept('holy_sites','svatá místa')|E]"
 friend_will_convert_tt: "[same_faith_friend.GetFirstName|U] společně s tebou přijme reformovanou víru."
 truce_religious_tolerance: "Náboženská tolerance"
 hc_7020_guardian_of_the_old_ways: "Ochrana starých způsobů"
 hc_7020_guardian_of_the_old_ways_desc: "Tato postava zasvětila své úsilí ochraně a zachování své víry."
