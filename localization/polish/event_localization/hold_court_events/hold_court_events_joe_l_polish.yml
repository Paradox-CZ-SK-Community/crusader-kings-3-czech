l_polish:
 hold_court.8001.t: "Přiškrcený obchod"
 hold_court.8001.desc: "Vpřed předstoupí kupec z provincie, v nádheře mých síní očividně nesvůj. Pokynu mu: „Pojď blíž, [Select_CString(merchant.IsFemale,'ženo','muži')], nemáme celý den.“ \n\n„A-ano, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]!“ vykoktá [merchant.GetFirstName]. „Zastupuji nespokojené obchodníky a svobodné občany z [town.GetNameNoTier], největšího [town.GetTierAsNameNoTooltip] v [town.GetDeJureLiege.GetNameNoTierPossessive].“ \n\n„[mayor.GetFirstName], [mayor.GetTitleTierName] našeho města, [mayor.Custom('get_hold_court_8001_flaw')] – pokorně žádáme, aby tuto funkci převzal někdo jiný...“"
 hold_court.8001.a: "[town.GetBaseNameNoTierPossessiveNoTooltip] volby proběhnou předčasně."
 hold_court.8001.b: "Dobrá, #EMP TY#! budeš [mayor.GetTitleTierName]!"
 hold_court.8001.b.tt_success: "[merchant.GetFirstNameNoTooltip] dává [town.GetBaseNameNoTierNoTooltip] do pořádku"
 hold_court.8001.b.tt_failure: "[merchant.GetFirstNameNoTooltip] je ještě horší"
 hold_court.8001.c: "A co na to říká [mayor.GetFirstNameNoTooltip]?"
 hold_court.8001.c.tt_success: "Naleznou se důkazy o [mayor.GetFirstNamePossessiveNoTooltip] neschopnosti"
 hold_court.8001.c.tt_failure: "[mayor.GetFirstNamePossessiveNoTooltip] provinění se nepodaří prokázat"
 hold_court.8001.d: "Koruna odškodní městské obchodníky."
 hold_court.8001.e: "Ty se opovažuješ zpochybňovat #EMP [ROOT.Char.GetTitleTierNamePossessive] [mayor.GetTitleTierName]?!#!"
 hold_court_8001.desc_lazy: "vyhýbá se všem povinnostem a zákon prosazuje jen tehdy, když je k tomu přinucen"
 hold_court_8001.desc_greedy: "uvaluje absurdní cla a drtivé pokuty a vybrané peníze si nechává pro sebe"
 hold_court_8001.desc_arbitrary: "jedná nespravedlivě a svévolně si vymýšlí přestupky, jako by nám chtěl škodit"
 hold_court_8001.desc_deceitful: "obchoduje s tajemstvími a lže nám do očí i v těch nejprostších záležitostech"
 hold_court_8001.desc_young: "má příliš málo zkušeností na to, aby dostatečně rozuměl zákonům"
 hold_court_8001.desc_incompetent: "nedokáže vést ani ty nejzákladnější záznamy"
 hold_court_8001.desc_infirm: "sotva dokáže vstát z postele, natož aby se staral o problémy města"
 hold_court_8001.desc_incapable: "už celé týdny nepromluví ani slovo a práce se mezitím jen hromadí"
 hold_court_8001.desc_old: "má za sebou až příliš mnoho zim a na výkon úřadu už nezbývá dost sil"
 hold_court_8001.desc_fallback: "brání obchodu i zájmům města"
 hold_court_8001_deposed_modifier: "Vměšování do městských záležitostí"
 hold_court_8001_ignored_modifier: "Přiškrcený obchod"
 hold_court_8001_compensated_modifier: "Odškodnění obchodníci"
 hold_court_8001_merchant_boon_modifier: "Kupecký cit"
 hold_court_8001_merchant_bust_modifier: "$hold_court_8001_merchant_boon_modifier$"
 hold_court_8001_imprisoned_modifier: "Uvězněný zástupce"
 hold_court.8010.t: "[neighboring_enemy.GetPrimaryTitle.GetAdjectiveNoTooltip] pohraničí"
 hold_court.8010.desc: "Před tebou stojí [frontier_lord.GetTitledFirstName] s tváří zachmuřenou obavami. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], hrozba, kterou představuje [neighboring_enemy.GetPrimaryTitle.GetNameNoTier], mi nedá spát.“ \n\n„Za hranicí číhá [neighboring_enemy.GetTitledFirstName],“ ukáže [frontier_lord.GetTitledFirstNameNoTooltip], „jen několik dní cesty od bran [frontier_barony.GetNameNoTierNoTooltip] a [frontier_lord.Custom('get_hold_court_8010_stake')].“ \n\n„Musíš mi pomoci opevnit mé země – [frontier_lord.GetPrimaryTitle.GetAdjectiveNoTooltip] vojáci a opevnění jsou tím jediným, co stojí mezi [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] a zkázou!“"
 hold_court.8010.a: "Tvé povinnosti možná skutečně ospravedlňují jistá privilegia..."
 hold_court.8010.b: "Máš pravdu. [frontier_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] musí být opevněno."
 hold_court.8010.c: "#EMP Několik dní?!#! Musíme opevnit hlavní město!"
 hold_court.8010.d: "Nesmysl. [neighboring_enemy.GetPrimaryTitle.GetNameNoTierNoTooltip] nepředstavuje žádnou hrozbu."
 hold_court.8010.d.tt_success: "[frontier_lord.GetFirstNameNoTooltip] se nechá uklidnit"
 hold_court.8010.d.tt_failure: "[frontier_lord.GetFirstNameNoTooltip] předloží přesvědčivější argument"
 hold_court.8010.e: "Rizika války neseme všichni."
 hold_court_8010.desc_family: "krbů rodu [ROOT.Char.GetDynastyHouseNameNoTooltip]"
 hold_court_8010.desc_republic: "nevinných lidí uvnitř jeho hradeb"
 hold_court_8010.desc_theocratic: "pokorných následovníků [ROOT.Char.GetFaith.HighGodNamePossessive]"
 hold_court_8010_fortifications_modifier: "Pohraniční valy"
 hold_court_8010_vassal_modifier: "Sdílená břemena"
 hold_court.8020.t: "Posvátné nároky"
 hold_court.8020.desc.intro: "[bishop.GetCouncilTitle] [bishop.GetFirstName] slavnostně předstoupí. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.Custom('get_hold_court_8020_holiness_1')]“"
 hold_court.8020.desc.body_pope: "\n\n„[Select_CString(pope.IsFemale,'Její svatost','Jeho svatost')] [pope.GetTitledFirstNameRegnal] souhlasí"
 hold_court.8020.desc.body_fallback: "\n\n„Panuje shoda"
 hold_court.8020.desc.body_1: " s tím, že [ROOT.Char.Custom('get_hold_court_8020_holiness_2')] by měla být svěřena duchovenstvu. [ROOT.Char.GetFaith.AltPriestTermPlural] mají rozhodovat, nikoli laici.“"
 hold_court.8020.desc.body_personal: "\n\n„Toto území předej pod správu církve;"
 hold_court.8020.desc.body_vassal: "\n\n„[vassal.GetTitledFirstName] se musí tohoto území vzdát ve prospěch církve;"
 hold_court.8020.desc.body_2: " jeho správu ať převezme [ROOT.Char.GetFaith.BishopNeuter] [candidate.GetFirstName] pro dobro víry a k větší slávě, kterou si zaslouží [ROOT.Char.GetFaith.HighGodName]!“"
 hold_court.8020.a: "[ROOT.Char.Custom('get_hold_court_8020_holiness_3')]"
 hold_court.8020.b: "Vyžaduje to skutečně [ROOT.Char.GetFaith.ReligiousText]?"
 hold_court.8020.b.tt_success: "Prokážeš, že to víra nevyžaduje"
 hold_court.8020.b.tt_failure: "Tvé argumenty nejsou přesvědčivé"
 hold_court.8020.c: "Zajímavé. A přitom z toho prospěch máš jen ty?"
 hold_court.8020.d: "Nevidím důvod něco měnit."
 hold_court.8020.e: "[pope.GetTitledFirstNameNoTooltip] se přece nebude zabývat takovým vměšováním."
 holiness_cathedral_1: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] poutníci proudí do [ROOT.Char.Custom('GetFaithGrandTemple')] v [ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip], protože věří, že právě tam je jim [ROOT.Char.GetFaith.HighGodNameAlternate] nejblíže."
 holiness_holy_site_1: "[ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip] je významným centrem [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] poutí a bohoslužeb."
 holiness_fallback_1: "Věřící z [ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip] volají po duchovním vedení a spáse před zlem, které zosobňuje [ROOT.Var('holy_site_var').Title.GetCountyData.GetFaith.DevilName]."
 holiness_cathedral_2: "[ROOT.Char.Custom('GetFaithGrandTemple')] má pro naši víru takový význam, že jeho správa"
 holiness_holy_site_2: "toto posvátné místo má takový význam, že jeho správa"
 holiness_fallback_2: "[ROOT.Var('holy_site_var').Title.GetDeFactoTopLiege.GetNameNoTierNoTooltip] má další území, jejichž správa"
 holiness_cathedral_3: "[ROOT.Char.Custom('GetFaithGrandTemple')] má být pod správou duchovenstva. [ROOT.Char.GetFaith.HighGodName] je jeho nejvyšší autoritou."
 holiness_holy_site_3: "Rozhodující slovo musí mít [ROOT.Char.GetFaith.PriestNeuterPlural]. [ROOT.Var('holy_site_var').Title.GetNameNoTierNoTooltip] je přece posvátné místo."
 holiness_fallback_3: "[ROOT.Char.GetFaith.PriestNeuterPlural] žádají oprávněně. [ROOT.Char.GetFaith.HighGodNameAlternate] stojí na jejich straně, a proto je neodmítnu."
 hold_court.8031.t: "[sc_victor.GetTitledFirstNameNoTooltip] vítězí v souboji"
 hold_court.8221.imprison_alone: "[assassin.GetTitledFirstName] je [Select_CString(assassin.IsFemale,'uvězněna','uvězněn')]"
 hold_court.8040.t: "Zvláštní zacházení"
 hold_court.8040.desc: "Nekajícný [infidel_vassal.GetTitledFirstName] tě poctí svou přítomností. \n\nPo chvíli váhání začne: „[Select_CString(ROOT.Char.IsFemale,'Má','Můj')] [ROOT.Char.GetTitleTierName], jsem [Select_CString(infidel_vassal.IsFemale,'věrná a poslušná poddaná','věrný a poslušný poddaný')] a žádám jen o jediné: nech mě v pokoji vyznávat mou víru.“ \n\n"
 hold_court.8040.desc.intro_same_religion: "„My, [infidel_vassal.GetFaith.GetAdherentNamePlural], máme za stvořitele [infidel_vassal.GetFaith.CreatorName]. Totéž platí pro [ROOT.Char.GetFaith.GetAdherentNamePlural]. Nech své souvěrce uctívat podle jejich svědomí a raději se společně postavme proti zkaženým [ROOT.Char.Custom('GetUnbelieverNamePlural')], kteří následují falešné démony a dovolují, aby [infidel_vassal.GetFaith.DevilName] kazil jejich srdce.“"
 hold_court.8040.desc.intro_fallback: "„Proč bychom nemohli žít v míru? Tebe vede učení, za nímž stojí [ROOT.Char.GetFaith.HighGodName], mě učení, za nímž stojí [infidel_vassal.GetFaith.HighGodName], ale oba nás spojuje zbožnost. Následujme vedle sebe své posvátné texty: já [infidel_vassal.GetFaith.ReligiousText] a ty [ROOT.Char.GetFaith.ReligiousText].“"
 hold_court.8040.a: "Soudit smí jedině [ROOT.Char.GetFaith.HighGodName]."
 hold_court.8040.b: "Pojď, ukážu ti, co hlásá [ROOT.Char.GetFaith.KnowledgeGodName]."
 hold_court.8040.c.religion: "Je načase přiznat, že [infidel_vassal.GetFaith.CreatorName] není pravý stvořitel, a zavrhnout lži tvého náboženství!"
 hold_court.8040.c.faith: "Musíš se znovu vrátit k textu [ROOT.Char.GetFaith.ReligiousText]!"
 hold_court.8040.c.tt_accept: "[infidel_vassal.GetTitledFirstNameNoTooltip] přijímá tvou víru"
 hold_court.8040.c.tt_refuse: "[infidel_vassal.GetTitledFirstNameNoTooltip] odmítá přijmout tvou víru"
 hold_court.8040.d: "Tvé přesvědčení toleruji, ale neschvaluji."
 demand_conversion_tt: "[recipient.GetTitledFirstName] a nejbližší rodina přestoupí na tvé náboženství"
 hold_court.8050.t: "Služba koruně"
 hold_court.8050.desc: "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přichází k trůnu v doprovodu [knight.GetFullName]. \n\n„[ROOT.Char.Custom('FormOfAddressForLiege')]!“ vyhrkne [vassal.GetFirstNameNoTooltip]. „[knight.GetFullName] je mi [vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] a touží po cti sloužit v tvé družině, kde [ROOT.Char.Custom('MountedWarriorTermPlural')] bojují po tvém boku. Dej [Select_CString(knight.IsFemale,'jí','mu')] příležitost prokázat svou hodnotu!“ \n\n"
 hold_court.8050.desc_talented: "„[Select_CString(knight.IsFemale,'Už teď je jednou z mých nejproslulejších duelantek','Už teď je jedním z mých nejproslulejších duelantů')] a na bitevním poli ti přinese mnoho slávy!“ Je pravda, že o schopnostech [knight.GetFirstNameNoTooltip] už jsi slyšel."
 hold_court.8050.desc_suitable: "„Když přijde na zbraň, [knight.Custom('SignatureWeaponArticle')] [knight.Custom('signature_weapon')], [knight.GetFirstNameNoTooltip] přesně ví, co dělat, a v rozhodující chvíli tě nezklame!“"
 hold_court.8050.desc_passing: " [knight.GetFirstNameNoTooltip] se mdle usměje. „I když jsem jen [Select_CString(knight.IsFemale,'průměrná šermířka','průměrný šermíř')], doufám, že se ve tvých službách mnoho naučím.“"
 hold_court.8050.desc_unsuitable: "[vassal.GetFirstNameNoTooltip] si mě odvede stranou a zamumlá: „[knight.GetFirstNameNoTooltip] se s čepelí zrovna [Select_CString(knight.IsFemale,'neproslavila','neproslavil')], ale nadšení snad nedostatek schopností vyváží...“"
 hold_court.8050.a: "Dobrá, [knight.GetFirstNameNoTooltip], smíš mi sloužit."
 hold_court.8050.a.tt_knight: "[knight.GetFirstName] se přesune na tvůj dvůr a stane se [Concept('knight',Select_CString(knight.IsFemale,'rytířkou','rytířem'))|E]. \n[Select_CString(knight.IsFemale,'Její','Jeho')] odvolání může rozhněvat [vassal.GetTitledFirstName]."
 hold_court.8050.a.tt_toast: "[ROOT.Char.Custom('MountedWarriorTerm')|U] [knight.GetNameNoTooltip]"
 hold_court.8050.a.tt_hook: "Protože na tebe má [vassal.GetTitledFirstName] páku:"
 hold_court.8050.b: "Pokud mám přijmout právě #EMP [Select_CString(knight.IsFemale,'ji','ho')]#!, chci něco na oplátku."
 hold_court.8050.c: "U [grandmaster.GetTitledFirstNameNoTooltip] se [Select_CString(knight.IsFemale,'pro schopnou ženu','pro schopného muže')] vždy najde místo!"
 hold_court.8050.d: "[Select_CString(knight.IsFemale,'Budeš mou osobní strážkyní!','Budeš mým osobním strážcem!')]"
 hold_court.8050.d.tt_bodyguard: "[knight.GetFirstName] se přesune na tvůj dvůr jako [Select_CString(knight.IsFemale,'tvá osobní strážkyně','tvůj osobní strážce')]. \n[Select_CString(knight.IsFemale,'Její','Jeho')] odvolání může rozhněvat [vassal.GetTitledFirstName]"
 hold_court.8050.e.talented: "Takový talent si drž u sebe, [vassal.GetFirstNameNoTooltip]."
 hold_court.8050.e.suitable: "Schopnosti má. Potřebuji je? Ne."
 hold_court.8050.e.passing: "Hřbitovy jsou plné [Select_CString(knight.IsFemale,'průměrných šermířek','průměrných šermířů')]."
 hold_court.8050.e.unsuitable: "I obrněná mula by byla užitečnější..."
 hold_court.8051.t: "$hold_court.8050.t$: [ROOT.Char.Custom('MountedWarriorTerm')|U] bez přízně"
 hold_court.8051.desc: "Zdá se, že se k [vassal.GetTitledFirstName] konečně doneslo, že [vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] [knight.GetFirstName] už nemá místo mezi mými [ROOT.Char.Custom('MountedWarriorTermPlural')]. \n\n[vassal.GetTitledFirstNameNoTooltip] jen stěží krotí svůj vztek a požaduje, abych dodržel svůj slib a [Select_CString(knight.IsFemale,'vrátila','vrátil')] [knight.GetFirstNameNoTooltip] na původní místo!"
 hold_court.8051.a: "Klid, [vassal.GetFirstNameNoTooltip], [Select_CString(knight.IsFemale,'vrátím ji','vrátím ho')] zpátky!"
 hold_court.8051.a.tt_knight: "[knight.GetFirstName] se znovu stane [Concept('knight',Select_CString(knight.IsFemale,'rytířkou','rytířem'))|E]"
 hold_court.8051.b: "[Select_CString(knight.IsFemale,'Její ztráta nás příliš nebolí.','Jeho ztráta nás příliš nebolí.')]"
 hold_court.8051.b.tt_return: "[knight.GetFirstNameNoTooltip] se vrátí na dvůr [vassal.GetTitledFirstNamePossessiveNoTooltip]"
 hold_court.8052.t: "$hold_court.8050.t$: Poslední kapka"
 hold_court.8052.desc.intro: "Jakmile se [vassal.GetTitledFirstName] dozví, že [knight.GetFirstName] byl z mé [ROOT.Char.Custom('MountedWarriorAdjective')] družiny opět [Select_CString(knight.IsFemale,'vyřazena','vyřazen')], neztrácí čas a žádá o audienci. \n\n"
 hold_court.8052.desc.wrath: "[Select_CString(vassal.IsFemale,'Vztekem bez sebe vybuchne','Vztekem bez sebe vybuchne')]: „S [vassal.Custom2('RelationToMeShort', SCOPE.sC('knight'))] bylo zacházeno hanebně a tvým slibům už nevěřím!“ Pak se rozzuřeně obrátí a odejde."
 hold_court.8052.desc.fallback: "[vassal.GetTitledFirstNameNoTooltip] dává své zklamání jasně najevo a je očividně [Select_CString(vassal.IsFemale,'rozhořčená','rozhořčený')] ponížením, které jí mé jednání způsobilo..."
 hold_court.8052.a: "Ach, tolik povyku!"
 hold_court.8052.b: "Stráže, zatkněte toho [vassal.Custom2('InsultNoun', ROOT.Char)]!"
 hold_court.8053.t: "$hold_court.8050.t$: Nástrahy prestiže"
 hold_court.8053.desc.intro: "Přicházejí zprávy z [battle_location.Custom('TerrainTypeProvince')] u [battle_location.GetName], kde měl být [knight.GetFirstNameNicknamed] [Select_CString(knight.IsFemale,'sražena k zemi','sražen k zemi')]"
 hold_court.8053.killer: "[Select_CString(knight.GetKiller.IsFemale,'rukou','rukou')] [knight.GetKiller.GetName]"
 hold_court.8053.battle: "uprostřed chaotické bitevní vřavy"
 hold_court.8053.desc_talented: " v záři slávy, [Select_CString(knight.IsFemale,'obklopena','obklopen')] mrtvolami méně schopných [Select_CString(knight.IsFemale,'žen','mužů')]."
 hold_court.8053.desc_suitable: " po urputném boji, během něhož [Select_CString(knight.IsFemale,'srazila','srazil')] mnoho nepřátel a [Select_CString(knight.IsFemale,'utrpěla','utrpěl')] četná zranění."
 hold_court.8053.desc_passing: " po houževnatém souboji, při němž [Select_CString(knight.IsFemale,'hrdinsky chránila','hrdinsky chránil')] své druhy."
 hold_court.8053.desc_unsuitable: " při bezradném máchání mečem jako ryba na suchu."
 hold_court.8053.desc_coward: " při pokusu uprchnout z bojiště."
 hold_court.8053.desc.body: "\n\nTeď už jsi jistě zbaven všech závazků vůči [vassal.GetTitledFirstName]..."
 hold_court.8053.a: "Taková jsou rizika boje..."
 hold_court.8060.t: "[ROOT.Char.GetFaith.HouseOfWorship|U] pro [target_county.GetNameNoTierNoTooltip]"
 hold_court.8060.desc: "Můj [bishop.GetCouncilTitle], [bishop.GetFirstName], se přede mnou ukloní a dychtivě se chystá přednést svůj návrh.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],"
 hold_court.8060.desc.owned: "tvé [target_county.GetTierAsNameNoTooltip] [target_county.GetNameNoTier]"
 hold_court.8060.desc.vassal: "[vassal.GetTitledFirstNamePossessive] [target_county.GetTierAsNameNoTooltip] [target_county.GetNameNoTier]"
 hold_court.8060.desc.subvassal: "[target_county.GetTierAsNameNoTooltip] [target_county.GetNameNoTier], kterému vládne [vassal.GetTitledFirstNamePossessive] poddaný [subvassal.GetTitledFirstName],"
 hold_court.8060.desc.existing: " by mohlo uživit další významný [ROOT.Char.GetFaith.HouseOfWorship], který by byl svědectvím o moci [ROOT.Char.GetFaith.HighGodNameAlternatePossessive] a zbožnosti tvé [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip].“"
 hold_court.8060.desc.first: " postrádá významný [ROOT.Char.GetFaith.HouseOfWorship|U], kde by se místní mohli modlit a vzdávat úctu [ROOT.Char.GetFaith.HighGodNameAlternate].“"
 hold_court.8060.desc.end: "\n\n„Musíš přispět na nový svatostánek v [target_province.GetName], pro dobro [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] víry!“"
 hold_court.8060.a: "Pro slávu [ROOT.Char.GetFaith.HighGodName]!"
 hold_court.8060.a.tt: "Po dokončení [Concept('temple','chrámu')|E]:"
 hold_court.8060.b: "[vassal.GetTitledFirstNameNoTooltip] si může dovolit přispět."
 hold_court.8060.c: "Přispět musí mí poddaní."
 hold_court.8060.d: "Tohle je práce pro [royal_architect.GetTitledFirstNameNoTooltip]."
 hold_court.8060.d.tt_success: "[royal_architect.GetTitledFirstName] odvede skvělou práci"
 hold_court.8060.d.tt_normal: "[royal_architect.GetTitledFirstName] odvede dostačující práci"
 hold_court.8060.d.tt_failure: "[royal_architect.GetTitledFirstName] odvede příšernou práci"
 hold_court.8060.e.own: "S touto zemí mám jiné plány."
 hold_court.8060.e.vassal: "Vazalové se mají starat o vlastní země."
