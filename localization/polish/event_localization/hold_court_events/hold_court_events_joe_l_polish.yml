 hold_court.8061.t: "Posvěcení [target_province.GetNameNoTooltip]"
 hold_court.8061.desc.bishop: "[bishop.GetCouncilTitleFirstName] nadšeně vstoupí do tvých síní. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], přináším zprávu o dokončení nového [ROOT.Char.GetFaith.HouseOfWorship|U] v [target_province.GetTitle.GetNameNoTierNoTooltip]!“ \n\n"
 hold_court.8061.desc.fallback: "[ROOT.Char.GetFaith.HouseOfWorship], který jsem nechal vybudovat pro lid [target_province.GetTitle.GetNameNoTier], je po dlouhé práci konečně dokončen.\n\n"
 hold_court.8061.desc.owned: "„Věřící z [target_county.GetNameNoTier]"
 hold_court.8061.desc.vassal: "„[vassal.GetTitledFirstNamePossessive] poddaní v [target_county.GetNameNoTier]"
 hold_court.8061.desc.existing: " se radují ze zbožnosti tvého díla a pocty, které se dostalo [ROOT.Char.GetFaith.HighGodName]!“"
 hold_court.8061.desc.first: " nyní mohou vzdávat úctu [ROOT.Char.GetFaith.HighGodName] na místě hodném božské vznešenosti!“"
 hold_court.8061.a: "Kéž nám všem [ROOT.Char.GetFaith.HighGodNameAlternate] žehná!"
 hold_court.8070.t: "Růst [target_county.GetNameNoTierNoTooltip]"
 hold_court.8070.desc.intro: "[steward.GetCouncilTitleFirstName] je očividně [Select_CString(steward.IsFemale,'nadšená','nadšený')] nějakým velkolepým návrhem.\n\n„[ROOT.Char.GetTitleAsNameNoTooltip], v"
 hold_court.8070.desc.body: " se skrývá značný potenciál stát se regionálním centrem obchodu a řemesel.“ \n\n„S prostředky na výstavbu by sloučením vesnic v [target_province.GetName] bylo možné položit základy pro"
 hold_court.8070.desc.existing: " další"
 hold_court.8070.desc.first: " první zdejší"
 hold_court.8070.desc.end: " [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] město.“"
 hold_court.8070.a: "Obchod je třeba podporovat."
 hold_court.8070.a.tt: "Po dokončení [Concept('city','města')|E]:"
 hold_court.8070.b: "Pomoci mohu jen [vassal.GetTitledFirstNameNoTooltip]."
 hold_court.8070.c: "Ať část odpovědnosti převezmou místní páni."
 hold_court.8070.d: "Konečně nějaká práce pro [royal_architect.GetTitledFirstNameNoTooltip]."
 hold_court.8070.e: "Jsou tu důležitější záležitosti."
 hold_court.8071.t: "$hold_court.8070.t$: Vzkvétající [target_province.GetNameNoTooltip]"
 hold_court.8071.desc.steward: "[steward.GetCouncilTitleFirstName] mi hrdě oznamuje, že práce na proměně [target_province.GetName] v obchodní centrum se podle jeho slov „zdárně rozbíhají!“ \n\n"
 hold_court.8071.desc.fallback: "Rozvoj [target_province.GetName] přináší ovoce; brzy už bude město stát pevně na vlastních nohou. \n\n"
 hold_court.8071.desc.owned: "Prostý lid z [target_county.GetNameNoTier]"
 hold_court.8071.desc.vassal: "Poddaní [vassal.GetTitledFirstNamePossessive] v [target_county.GetNameNoTier]"
 hold_court.8071.desc.existing: " tyto investice vítají stejně jako blahobyt, který oblasti přinesou."
 hold_court.8071.desc.first: " nyní mohou v tomto regionálním centru snáze provozovat svá řemesla a obchodovat."
 hold_court.8071.a: "Jednoho dne bude [target_province.GetNameNoTooltip] velkým městem."
 hold_court_8070_built_modifier: "Financovaná výstavba města"
 hold_court.8080.t: "Republika [mayor.GetPrimaryTitle.GetDeJureLiege.GetNameNoTierNoTooltip]"
 hold_court.8080.desc.intro: "[mayor.GetTitledFirstName] opatrně předstoupí. \n\n„Vaše Milosti, mé [mayor.GetPrimaryTitle.GetTierAsNameNoTooltip] [mayor.GetPrimaryTitle.GetNameNoTier] bohatne díky obchodům našich měšťanů s"
 hold_court.8080.desc.body_sea: " obchodními loděmi, které brázdí přístavy podél pobřeží [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessiveNoTooltip].“"
 hold_court.8080.desc.body_fallback: " obchodníky a pocestnými, kteří každý den procházejí přes [target_county.GetDeJureLiege.GetNameNoTier] a naše brány.“"
 hold_court.8080.desc.body: "\n\n„Naše město přineslo blahobyt nám i tobě, a proto si zasloužíme větší vliv na správu [target_county.GetNameNoTier].“"
 hold_court.8080.a: "[target_county.GetNameNoTierNoTooltip] je od nynějška pod tvou správou."
 hold_court.8080.b: "Taková privilegia si musíš zasloužit."
 hold_court.8080.c: "Žádáš příliš mnoho. Musí existovat jiné řešení."
 hold_court.8080.c.tt_success: "Najdeš kompromis"
 hold_court.8080.c.tt_failure: "Nedokážeš dosáhnout pokroku"
 hold_court.8080.d: "Spokoj se se svými nynějšími svobodami, [mayor.GetTitleAsNameNoTooltip]."
 hold_court.8080.e: "Zdá se, že měšťané zapomněli, kam patří."
 hold_court_8080_granted_modifier: "Obchodní rozmach"
 hold_court_8080_compromise_modifier: "Kupecká listina"
 hold_court_8080_upset_modifier: "Odmítnutí měšťané"
 hold_court_8080_prison_modifier: "Špatně zacházený starosta"
 hold_court.8090.t: "Místo u dvora"
 hold_court.8090.desc.intro: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName] se před shromážděným dvorem chopí příležitosti, aby mi něco pošeptal do ucha. \n\n„Slavný [vassal.Custom2('RelationToMeShort', ROOT.Char)], dopřej mi čest [vassal.Custom('GetTargetCourtPositionDesc')]"
 hold_court.8090.desc.intro_advocate: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal_advocate'))], [vassal_advocate.GetTitledFirstName], přivádí před shromážděný dvůr [vassal.GetTitledFirstName], [vassal.Custom('GetYoungMiddleAgedOld')] [Select_CString(vassal.IsFemale,'ženu','muže')]. \n\n„Slavný [ROOT.Char.GetTitleAsNameNoTooltip], dopřej [Select_CString(vassal.IsFemale,'mé příbuzné','mému příbuznému')] [vassal_advocate.Custom2('RelationToMeShort', SCOPE.sC('vassal'))], [vassal.GetTitledFirstName], která je [vassal_advocate.Custom('ComplimentAdjective')], čest [vassal.Custom('GetTargetCourtPositionDesc')]"
 hold_court.8090.desc.rival: " – a zbav se [old_holder.GetTitledFirstName], toho [old_holder.Custom2('InsultAdjective', SCOPE.sC('vassal_advocate'))] [old_holder.Custom2('InsultNoun', SCOPE.sC('vassal_advocate'))]"
 hold_court.8090.desc.arrogant: " – role, která náleží někomu mého postavení"
 hold_court.8090.desc.ambitious: " – odpovědnosti hodné mého nadání"
 hold_court.8090.desc.superior: " – práce, na kterou [old_holder.GetTitledFirstName] nestačí"
 hold_court.8090.desc.other_advocate: " – pozice, kterou si [vassal.GetFirstName] zaslouží mnohem víc než [old_holder.GetTitledFirstName]"
 hold_court.8090.desc.other: " – pozice, na kterou se hodím mnohem lépe než [old_holder.GetTitledFirstName]"
 hold_court.8090.desc.empty_advocate: " – [Select_CString(vassal.IsFemale,'nezklame tě','nezklame tě')].“"
 hold_court.8090.desc.empty: " – nezklamu tě.“"
 hold_court.8090.a.lady_in_waiting_lover: "Ehm, ano, můžeš mi sloužit."
 hold_court.8090.a.lady_in_waiting_soulmate: "To nám to spolu bude slušet!"
 hold_court.8090.a.bodyguard_lover: "„Nikdy nesmíš opustit můj bok, [vassal.GetFirstName].“"
 hold_court.8090.a.bodyguard_soulmate: "#EMP Ach, můj chrabrý Patrokle...#!"
 hold_court.8090.a: "Místo je tvoje, [vassal.GetFirstNameNoTooltip]."
 hold_court.8090.b: "[old_holder.GetFirstNameNoTooltip] ustoupí stranou."
 hold_court.8090.c: "V tuto chvíli potřebujeme jiné schopnosti."
 move_and_grant_court_position_effect_tooltip: "[candidate.GetFirstNameNoTooltip] získá dvorní pozici"
 hold_court.8090.d.advocate: "Ne, pro [Select_CString(vassal.IsFemale,'ni','něj')] mám na mysli něco #EMP zvláštního#!..."
 hold_court.8090.d: "Ne, pro tebe mám na mysli něco #EMP zvláštního#!..."
 hold_court.8090.e.advocate: "Na tuto pozici se [vassal.GetTitledFirstNameNoTooltip] nehodí."
 hold_court.8090.e: "Na takovou pozici se nehodíš."
 court_position_desc_architect: "starat se o údržbu a rozšiřování tvých skvostných držav"
 court_position_desc_seneschal: "dohlížet na chod tvé vznešené domácnosti"
 court_position_desc_tutor: "dbát na to, aby se tvým potomkům dostalo vzdělání odpovídajícího jejich postavení"
 court_position_desc_almoner: "rozdělovat tvé štědré dary nuzným"
 court_position_desc_physician: "pečovat o zdraví tvé rodiny a podávat jí léčiva"
 court_position_desc_antiquarian: "pečovat o předměty z tvé pokladnice a zbrojnice"
 court_position_desc_horse: "pečovat o jízdu a tvé koně"
 court_position_desc_bodyguard: "chránit tě před nepřáteli a sloužit po tvém boku"
 court_position_desc_champion: "zastupovat tě v otázkách cti"
 court_position_desc_hunt: "pořádat hony a pečovat o zvěř"
 court_position_desc_poet: "skládat balady a sonety hodné tvého majestátu"
 court_position_desc_musician: "lahodit tvému sluchu a pořádat zábavy"
 court_position_desc_cupbearer: "nalévat ti nápoje a dbát na jejich nezávadnost"
 court_position_desc_lady: "osobně ti sloužit jako věrná společnice"
 court_position_desc_eunuch: "zajišťovat hladký chod tvého dvora"
 court_position_desc_gardener: "pečovat o zahrady a fontány"
 court_position_desc_artificer: "vytvářet velkolepé artefakty pro tebe a tvůj dvůr"
 court_position_desc_emissary: "zlepšovat vztahy mezi rozmanitými kulturami tvých zemí"
 court_position_desc_qadi: "dbát na to, aby se v tvém panství dodržovala božská rozhodnutí Alláha"
 court_position_desc_garuda: "věrně ti sloužit s čepelí v ruce, ať se děje cokoli"
 court_position_desc_keeper_of_swans: "pečovat o vodní ptactvo, krásné symboly tvé vznešenosti"
 court_position_desc_travel_leader: "provázet tě na všech tvých cestách"
 court_position_desc_akolouthos: "velet císařské gardě, zejména obávaným Varjagům"
 court_position_desc_chronicler: "zaznamenávat každý tvůj čin"
 court_position_desc_charioteer: "trénovat dnem i nocí a stát se nejlepším závodníkem ze všech"
 court_position_desc_bookmaker: "dohlížet na účetnictví veškerých sázek na závody vozatajů"
 court_position_desc_executioner: "vykonávat spravedlivé tresty nad zločinci a zrádci"
 court_position_desc_food_taster: "dbát na to, aby tvá jídla byla chutná a nikdo s nimi nemanipuloval"
 court_position_desc_court_jester: "bavit dvůr šprýmy hodnými tvého majestátu"
 court_position_desc_court_astrologer: "pozorovat nebeskou klenbu"
 court_position_desc_wet_nurse: "dbát na řádnou péči o tvé děti"
 court_position_desc_cave_hermit: "bavit tvůj dvůr příběhy a záhadami"
 court_position_desc_master_assassin: "šířit tvůj vliv ze stínů"
 court_position_desc_court_scholar: "rozvíjet vědění v tvém panství"
 court_position_desc_boyan: "vést tvá vojska do vítězných bitev"
 court_position_desc_siege_engineer: "dohlížet na stavbu obléhacích strojů"
 court_position_desc_yurtchi: "připravovat tvé vojáky na válku"
 court_position_desc_cherbi: "chránit tě vlastním životem"
 court_position_desc_yeke_jarquchi: "dbát na dodržování tvých zákonů"
 court_position_desc_foreign_emissary: "být tvým hlasem v cizích zemích"
 court_position_desc_keeper_of_the_horses: "udržovat tvé koně v prvotřídní kondici"
 hold_court_8090_interest_architect: "\n\n„Neměj obavy, výstavba velkolepých budov patří k mým vášním.“"
 hold_court_8090_interest_seneschal_administrator: "\n\n„Buď bez obav, nikdo se o správu tvých záležitostí nezajímá s větším nadšením než já.“"
 hold_court_8090_interest_seneschal_eunuch: "\n\n„Ujišťuji tě, že mě od správy tvých záležitostí nebude nic rozptylovat.“"
 hold_court_8090_interest_almoner: "\n\n„Jedině sdílením pozemských darů můžeme napravovat nerovnováhu, kterou ve světě působí zlo...“"
 hold_court_8090_interest_physician_experience: "\n\n„Můžeš mi věřit, že jsem už [Select_CString(vassal.IsFemale,'léčila','léčil')] mnoho nemocí i zranění – nejsem žádný šarlatán.“"
 hold_court_8090_interest_physician_mystic: "\n\n„Péče o zdraví vyžaduje spojení se silami přesahujícími všední svět. Dovol mi ukázat ti jak...“"
 hold_court_8090_interest_physician_herbalist: "\n\n„Mé znalosti elixírů a mastí jsou dobře známé. Dovol mi nabídnout své vědomosti a schopnosti.“"
 hold_court_8090_interest_antiquarian: "\n\n„Historie mě nesmírně zajímá a postarám se, aby odkaz tvých pokladů přetrval.“"
 hold_court_8090_interest_horse: "\n\n„Neměj obavy, mé pozornosti neunikne ani sebemenší kulhání tvého oblíbeného válečného oře!“"
 hold_court_8090_interest_bodyguard_soulmate: "\n\n[Select_CString(ROOT.Char.IsFemale,'Její oči prozrazují','Jeho oči prozrazují')] tak silné city, až se mi zachvěje srdce..."
 hold_court_8090_interest_bodyguard_lover: "\n\nPod [Select_CString(ROOT.Char.IsFemale,'jejím žhavým pohledem','jeho žhavým pohledem')] je těžké nepodlehnout slabosti..."
 hold_court_8090_interest_bodyguard_bestie: "\n\nJestli mohu tuto práci někomu svěřit, pak jedině [ROOT.Char.GetFirstNameNoTooltip]..."
 hold_court_8090_interest_bodyguard_friend: "\n\nTak blízký spojenec mi bude dobře sloužit a zároveň mi dělat společnost..."
 hold_court_8090_interest_champion: "\n\n„Buď bez obav, mé umění s čepelí znají po celém [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].“"
 hold_court_8090_interest_hunt: "\n\n„Není nic, co bych si užíval víc než dobrý lov – po celém [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] se to dobře ví.“"
 hold_court_8090_interest_poet: "\n\n„Jsem proslulý trubadúr; tvými síněmi se budou rozléhat příběhy o tvé nepřekonatelné vznešenosti!“"
 hold_court_8090_interest_musician_gregarious: "\n\n„Věř mi, tvé hostiny budou díky mně ještě nezapomenutelnější!“"
 hold_court_8090_interest_musician_culture: "\n\n„[ROOT.Char.GetCulture.GetNameNoTooltip] kultura může tvůj lid mnohému naučit o umění hudby.“"
 hold_court_8090_interest_cupbearer: "\n\n„Neměj obavy, můj pane, pod mou péčí nebude tvůj pohár nikdy prázdný!“"
 hold_court_8090_interest_lady_lover: "\n\nTa prohnaná svůdnice na mě mrkne a při pomyšlení na možnosti, které nám to otevře, jen stěží potlačuji ruměnec..."
 hold_court_8090_interest_lady_soulmate: "\n\nNikoho jiného bych po svém boku neměl raději..."
 hold_court_8090_interest_lady_bestie: "\n\nZdá se, že od svého nejbližšího přítele už nemusím být nikdy odloučen!"
 hold_court_8090_interest_lady_friend: "\n\nTak vítaná společnost by mohla zahnat jednotvárnost dvorského života..."
 hold_court_8090_interest_eunuch: "\n\n„Věř mi, od práce mě nebude nic rozptylovat.“"
 hold_court_8090_interest_gardener: "\n\n„Rostliny miluji; rád poznávám jejich využití a pečuji o to, aby prospívaly!“"
 hold_court_8090_interest_artificer: "\n\n„Má díla patří k nejuznávanějším v celém [ROOT.Char.GetLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].“"
 hold_court_8090_interest_emissary: "\n\n„Mé úspěchy při vyjednávání a hledání kompromisů jsou dobře známé.“"
 hold_court_8090_interest_qadi: "\n\n„Nemusíš mít obavy, ve všech příslušných otázkách se dobře vyznám.“"
 hold_court_8090_interest_garuda: "\n\n„Věřím, že má pověst [Select_CString(vassal.IsFemale,'duelantky','duelanta')] ti neunikla.“"
 hold_court_8090_interest_keeper_of_swans: "\n\n„S lovným ptactvem mám bohaté zkušenosti. Jsem jasná volba.“"
 hold_court_8090_interest_friend: "\n\nAle jak bych mohl odmítnout takového přítele, jako je [ROOT.Char.GetFirstNameNoTooltip]?"
 hold_court_8090_interest_bestie: "\n\n[ROOT.Char.GetFirstNameNoTooltip] mi vždy byl dobrým a věrným přítelem..."
 hold_court_8090_interest_lover: "\n\nPříležitosti mít [ROOT.Char.GetFirstNameNoTooltip] nablízku se odolává jen těžko..."
 hold_court_8090_interest_soulmate: "\n\n[ROOT.Char.GetFirstNameNoTooltip] se mi těžko cokoli odmítá i za těch nejlepších okolností..."
 hold_court_8090_interest_other: "\n\nMožná by se [vassal.GetTitledFirstNameNoTooltip] #EMP přece jen#! hodil lépe..."
 hold_court_8090_interest_fallback: "\n\nPředpokládám, že #EMP někdo#! tyhle práce dělat musí..."
 hold_court_8090_favorites_modifier: "Protěžování oblíbenců"
 hold_court.8100.t: "Dítě dvora"
 hold_court.8100.desc.intro: "Hledím do smutných očí [ward.GetFullNameNicknamedPossessive], které se zdají být stále větší a žalostnější, zatímco [ward.Custom2('RelationToMeShort', SCOPE.sC('advocate'))] [advocate.GetTitledFirstName] dítě jemně vede k mému trůnu. \n\n„[ROOT.Char.Custom('FormOfAddressForLiege')],“ pronese [advocate.GetTitledFirstNameNoTooltip] žalostně, „[Select_CString(ward.IsFemale,'ta dívka','ten chlapec')] pobývá na"
 hold_court.8100.desc.vassal: "[ward.GetLiege.GetFirstNamePossessive]"
 hold_court.8100.desc.court: "tvém"
 hold_court.8100.desc.body: " dvoře bez kohokoli, kdo by se o [Select_CString(ward.IsFemale,'ni','něj')] staral, už od chvíle, kdy [ward.Custom('get_hold_court_8100_situation')] [ward.Custom('get_hold_court_8100_parent')]. Prosím, postarej se o budoucnost toho dítěte.“ \n\n"
 hold_court.8100.desc.interest_family: "Koneckonců je to má vlastní krev..."
 hold_court.8100.desc.interest_marriage: "To dítě by se jednou mohlo dobře hodit k někomu z mých vlastních..."
 hold_court.8100.desc.interest_alliance: "Až vyroste, možná z něj bude užitečný spojenec..."
 hold_court.8100.desc.interest_fallback: "Co se dá s takovým dítětem dělat?"
 hold_court.8100.a: "Žádný strach, [Select_CString(ward.IsFemale,'tu dívku','toho chlapce')] vychovám sám."
 hold_court.8100.b: "Mám plné ruce práce, ale domov [Select_CString(ward.IsFemale,'jí','mu')] najdu."
 hold_court.8100.c: "[ward.GetFirstNameNoTooltip] bude patřit k rodu [ROOT.Char.GetDynastyHouseNameNoTooltip]!"
 hold_court.8100.c.tt_child: "Každé dítě"
 hold_court.8100.d: "Výchova dítěte není levná..."
 hold_court.8100.e: "Je to nešťastné, ale koruna to řešit nebude."
 hold_court.8100.hook.tt: "[ward.GetName] ti bude dlužit silnou [Concept('hook','páku')|E], pokud zůstane tvým [Concept('ward',Select_CString(ward.IsFemale,'svěřencem','svěřencem'))|E] až do dospělosti."
 hold_court_8100_adopted_modifier: "Přijetí mezi šlechtu"
 hold_court_8100_adopted_modifier_desc: "Tato postava byla navzdory prostému původu přijata mezi šlechtu"
 hold_court_8100_parent_general: "jeden z rodičů"
 hold_court_8100_situation_dead: "není mezi živými"
 hold_court_8100_situation_jailed: "je ve vězení"
 hold_court_8100_situation_unknown: "se pohřešuje"
 hold_court.8110.t: "Vážná věc"
 hold_court.8110.desc: "[Select_CString(peasant.IsFemale,'Děsivě vyhlížející venkovanka','Děsivě vyhlížející venkovan')] se ke mně přiblíží až příliš, než se mezi nás postaví strážný. „Jé!“ [peasant.GetFirstNameNoTooltip] s mrknutím ucukne a zasměje se skrz několik zbývajících zubů.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')], přicházím z [peasant_holding.GetNameNoTooltip] s věcí nesmírné důležitosti!“ Obočí [peasant.GetFirstNameNoTooltip] se rozpustile zavlní.\n\n„Víte, [ROOT.Char.Custom('FormOfAddressForLiege')],"
 hold_court.8110.desc.affair: "náš [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)] se už sedm úplňků tahá se sestřenicí sestry někoho známého jako [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)], a celá vesnice je vzhůru nohama! Nebo je to už osm...?“ [peasant.GetFirstNameNoTooltip] si zamyšleně promne bradu."
 hold_court.8110.desc.fence: "ještě za časů mého děda postavil náš [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)] plot podél pole, které patřilo otci někoho známého jako [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)]. Teď se ale plot rozpadá a vnuk s ním samozřejmě nechce mít nic společného!“"
 hold_court.8110.desc.goat: "všechno začalo při poslední sklizni. Náš [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)|U] má kozu a ta zabloudila do chýše neteře někoho známého jako [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] a nadělala tam strašný binec!“ [peasant.GetFirstNameNoTooltip] se plácne do stehna. „To jste [Select_CString(ROOT.Char.IsFemale,'měla','měl')] vidět, Vaše Obrovitosti!“"
 hold_court.8110.desc.veg: "prasnice někoho známého jako [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] jedné noci proklouzla plotem a o-ona... ona vlezla přímo do zeleninové zahrádky! A kdo že si tu zahrádku střeží jako oko v hlavě? Starý [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)]! Jeho pýcha a radost!“ Po tváři [peasant.GetFirstNameNoTooltip] stékají slzy smíchu."
 hold_court.8110.desc.drink: "sestra někoho známého jako [dummy_female.Custom2('dummy_peasant_profession', ROOT.Char)] se zapřisáhla, že pokud jde o [ROOT.Char.Custom('RegionalDrink')], nikdo se jí nevyrovná – ani manželka muže známého jako [dummy_male.Custom2('dummy_peasant_profession', ROOT.Char)]. Samozřejmě to dopadlo nerozhodně, a pak se do toho vložili jejich manželé!“"
 hold_court.8110.a: "Vážně? Prosím, pokračuj."
 hold_court.8110.b: "[steward.GetCouncilTitleFirstNameNoTooltip], běž. Vyřeš to. Prosím."
 hold_court.8110.c: "Smát se #EMP MNĚ?#! Na šibenici!"
 hold_court.8110.d: "Jsi šašek. #EMP Můj#! šašek."
 hold_court.8110.e: "[Select_CString(peasant.IsFemale,'Cože? Jak se sem vůbec dostala tahle','Cože? Jak se sem vůbec dostal tenhle')] [peasant.GetWomanMan]? Ví to někdo?"
 hold_court_8110_common_modifier: "Blízkost prostému lidu"
 hold_court_8110_haughty_modifier: "Panská nabubřelost"
 hold_court_8110_steward_modifier: "Urovnaný spor"
 hold_court_8110_execute_modifier: "Poprava místního svérázu"
 hold_court_8110_jester_modifier: "Výsměch prostému lidu"
 hold_court.8120.t: "Odpor proti obracení na víru"
 hold_court.8120.desc: "Přede mnou stojí [peasant.GetFaith.GetAdherentName] z prostého lidu, ztělesněná pokora a prosebnost.\n\n„Slavný [ROOT.Char.GetTitleAsNameNoTooltip], přicházím tě prosit, abys zastavil kněží, kteří sužují [conversion_target.GetNameNoTierPossessive] lid a tvrdí mu, že jedinou pravou cestou je [ROOT.Char.GetFaith.GetName].“\n\n"
 hold_court.8120.desc.same_religion: "„Všichni se držíme téhož učení a naším stvořitelem je [peasant.GetFaith.CreatorName]. Právě v této víře hledáme vedení a milosrdenství! [Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], dovol nám zachovat naše místní obřady a žít beze strachu z násilí či odsouzení.“"
 hold_court.8120.desc.same_culture: "„Ačkoli máme rozdílnou víru, všichni pocházíme z [peasant.GetCulture.GetName] kultury. Pro někoho je nejvyšším božstvem [peasant.GetFaith.HighGodName], pro jiného [ROOT.Char.GetFaith.HighGodName]. Nemůžeme přesto žít společně v míru?“"
 hold_court.8120.desc.other: "„Pocházíme z [peasant.GetCulture.GetName] kultury a naše tradice se liší od tradic mocné [ROOT.Char.GetCulture.GetName] kultury. Dovol nám zachovat zvyky našich předků a pokojně konat naše obřady. Naším stvořitelem je [peasant.GetFaith.CreatorName]. Slituj se, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 hold_court.8120.a: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] kněží nechají [peasant.GetFaith.GetAdherentNamePluralNoTooltip] na pokoji."
 hold_court.8120.a.tt_conversion: "[peasant.GetFaith.GetAdjective] hrabství nelze po dobu 15 let obracet na jinou víru"
 hold_court_8120_conversion_tt: "Tuto víru toleruješ"
 hold_court.8120.b: "[peasant.GetFaith.GetAdherentNamePluralNoTooltip] nás můžou naučit mnohému."
 hold_court.8120.b.tt_eastern: "[THIS.Char.GetFaith.GetName] má [Concept('core_tenet','zásadu')|E] $tenet_eastern_syncretism_name$"
 hold_court.8120.b.tt_pagan: "[THIS.Char.GetFaith.GetName] má $tenet_unreformed_syncretism_name$"
 hold_court.8120.b.tt_christianity: "[THIS.Char.GetFaith.GetName] má [Concept('core_tenet','zásadu')|E] $tenet_christian_syncretism_name$ [Concept('core_tenet','zásadu')|E]"
 hold_court.8120.b.tt_islam: "[THIS.Char.GetFaith.GetName] má [Concept('core_tenet','zásadu')|E] $tenet_islamic_syncretism_name$"
 hold_court.8120.b.tt_judaism: "[THIS.Char.GetFaith.GetName] má [Concept('core_tenet','zásadu')|E] $tenet_jewish_syncretism_name$"
 hold_court.8120.c: "[ROOT.Char.GetFaith.CreatorName] požaduje, aby nevěřící platili."
 hold_court.8120.c.tt_tenet: "[THIS.Char.GetFaith.GetName] nemá [Concept('core_tenet','zásadu')|E] $tenet_tax_nonbelievers_name$"
 hold_court.8120.d: "[ROOT.Char.GetFaith.DevilName] na tebe čeká, [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('peasant'))]."
 hold_court.8120.e: "Ne."
 hold_court_8120_stopped_modifier: "Zastavená integrace"
 hold_court_8120_stopped_modifier_desc: "Na žádost místních obyvatel zde bylo upuštěno od obracení na víru a integrace."
 hold_court_8120_tax_modifier: "Náboženské zdanění"
 hold_court_8120_tax_modifier_desc: "Na nevěřící, kteří zde žijí, je uvalen zvláštní desátek."
 hold_court_8120_terror_modifier: "Náboženská horlivost"
 hold_court_8120_terror_modifier_desc: "Síla víry této postavy ponechává jen málo prostoru pro pochybnosti."
 hold_court_8120_tolerance_modifier: "Náboženská tolerance"
 hold_court_8120_tolerance_modifier_desc: "Tolerance této postavy vůči jiným vírám otevírá mnoho dveří."
 hold_court_8120_refused_modifier: "Pokračující integrace"
 hold_court_8120_refused_modifier_desc: "Místní obyvatelé nesou nelibě, že jejich žádost o toleranci byla odmítnuta."
 hold_court.8130.t: "Kulturní hrdost"
 hold_court.8130.desc: "Přede mnou se uklání [Select_CString(peasant.IsFemale,'venkovanka','venkovan')] z [peasant.GetCulture.GetName] kultury a nervózně si mne ruce. \n\n„Vznešený [ROOT.Char.GetTitleAsNameNoTooltip], v mé krásné domovině [conversion_target.GetNameNoTier] nás nabádají, abychom opustili své zvyky a přijali způsob života [ROOT.Char.GetCulture.GetName] kultury.“ \n\n"
 hold_court.8130.desc.same_language: "„Naše národy už mají společnou krásnou mateřštinu – [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]. Dovol nám zachovat místní zvyky a zůstat věrni svým předkům.“"
 hold_court.8130.desc.same_heritage: "„Naše národy už mnohé spojuje díky [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip] tradici, ale naše místní zvyky jsou nám drahé. Prosím, dovol nám zůstat věrni svým předkům.“"
 hold_court.8130.desc.same_ethos: "„Naše národy si už jsou blízké. I nás vystihuje totéž – [ROOT.Char.GetCulture.GetEthos.GetNameNoTooltip|l]. Dovol nám zachovat naše tradice a žít vedle sebe v míru.“"
 hold_court.8130.desc.other: "„[ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip] zvyklosti jsou nám cizí a my chceme dál v míru žít podle tradic svých předků. Prosím, nech nás být, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')].“"
 hold_court.8130.a: "Taková hrdost si zaslouží obdiv."
 hold_court.8130.a.tt_conversion: "Hrabství s [peasant.GetCulture.GetName] kulturou nelze po dobu 15 let integrovat"
 hold_court_8130_conversion_tt: "Tuto kulturu toleruješ"
 hold_court.8130.b: "Naše národy mohou žít vedle sebe."
 hold_court.8130.c: "[conversion_target.GetNameNoTierNoTooltip] si musí toto privilegium zasloužit."
 hold_court.8130.c.tt_service: "Na tvůj [Concept('court','dvůr')|E] přichází [Concept('knight','rytíř')|E] z [peasant.GetCulture.GetName] kultury."
 hold_court.8130.c.tt_service_title: "[conversion_target.GetAdjectiveNoTooltip] [peasant.Custom('MountedWarriorTerm')|U]"
 hold_court.8130.d: "Budeš příkladem pro všechny zaostalé národy."
 hold_court.8130.e: "Lidé z [peasant.GetCulture.GetNameNoTooltip] kultury se přizpůsobí."
 hold_court_8130_terror_modifier: "Kulturní nadřazenost"
 hold_court_8130_tolerance_modifier: "Kulturní tolerance"
 hold_court_8130_service_modifier: "Kulturní závazek"
 hold_court.8140.t: "Psí patronát"
 hold_court.8140.desc: "[Select_CString(huntmaster.IsFemale,'Má lovčí','Můj lovčí')] [huntmaster.GetTitledFirstName] ke mně opatrně přistoupí s vlněným uzlíčkem v náručí. \n\nS úsměvem odhrne zavinutí a odhalí pár přimhouřených oček nad vyplazeným jazýčkem – štěně! Rozjařený chlupáč se [huntmaster.GetFirstNameNoTooltip] v náručí téměř nedá udržet. \n\n„Tohle je [ROOT.Char.Custom('get_region_dog_type')] z nejlepšího vrhu, jaký jsem za dlouhou dobu viděl!“ pronese [huntmaster.GetFirstNameNoTooltip] mezi olíznutími do tváře. „Musíš té příležitosti využít a rozšířit své psince, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]!“"
 hold_court.8140.a: "Našim psincům se žádné jiné nevyrovnají!"
 hold_court.8140.a.tt: "Všichni členové budou moci použít [Concept('decision','rozhodnutí')|E] Adoptovat štěně"
 hold_court.8140.b: "Kdo je hodné štěňátko? Ty jsi!"
 hold_court.8140.c: "Kočky jsou lepší společníci."
 hold_court.8140.d: "Zdržuješ vážné prosebníky, [huntmaster.GetFirstNameNoTooltip]."
 hold_court.8141.desc: "[pup_house_ruler.GetTitledFirstNameRegnal], [Select_CString(pup_house_ruler.IsFemale,'která je pro mě','který je pro mě')] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('pup_house_ruler'))], [Select_CString(pup_house_ruler.IsFemale,'rozšířila','rozšířil')] své psince pod vedením svého lovčího [huntmaster.GetTitledFirstNameRegnal]. \n\nNyní [Select_CString(pup_house_ruler.IsFemale,'pozvala','pozval')] všechny své příbuzné, aby z tohoto úsilí také něco měli!"
 hold_court.8141.a: "Štěňata, říkáš?"
 hold_court.8142.t: "$hold_court.8140.t$: Nový společník"
 hold_court.8142.desc: "Služebnictvo mi přinese novorozené štěně. Je to [ROOT.Char.Custom('get_region_dog_type')] z proslulých psinců rodu [ROOT.Char.GetHouse.GetNameNoTooltip]. Ty založil[pup_house_ruler.IsFemale?] [pup_house_ruler.GetTitledFirstNameRegnal], [Select_CString(pup_house_ruler.IsFemale,'která je pro mě','který je pro mě')] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('pup_house_ruler'))]. \n\nZ přikrývek vykukuje drobný čenich a zvědavě nasává pachy svého nového domova!"
 hold_court.8142.desc_alternative: "Služebnictvo mi přinese novorozené štěně z mých vlastních psinců. Je to [ROOT.Char.Custom('get_region_dog_type')]. \n\nZ přikrývek vykukuje drobný čenich a zvědavě nasává pachy svého nového domova!"
 hold_court.8142.a: "Budeš mi dobře sloužit, maličký!"
 hold_court.8142.b: "Rozmyslel jsem si to."
 hold_court_8140_house_modifier: "Milovníci psů"
 hold_court_8140_house_modifier_desc: "Náklonnost tohoto rodu k psím společníkům je příslovečná."
 adopt_puppy_decision_name: "Adoptovat štěně"
 adopt_puppy_decision_desc: "Můj rod je proslulý svým nadáním a nadšením pro chov psích společníků. Čeká na mě novorozené štěně, pokud se na tuto výzvu cítím!"
 adopt_puppy_decision_already_pet_tt: "Nemáš žádného domácího mazlíčka"
 adopt_puppy_decision_confirm: "Adoptovat štěně z psince"
 adopt_puppy_decision_tooltip: "$adopt_puppy_decision_confirm$"
 hold_court.8150.t: "Smluvní kompromis"
 hold_court.8150.desc.intro: "[target_faction.GetLeader.GetTitledFirstName] směle předstoupí a bez jakéhokoli vysvětlení tlumeným hlasem pronese: \n\n"
 hold_court.8150.desc.alone: "„Na své výhrady bych dokázal zapomenout, kdybys upravil mé smluvní závazky vůči koruně...“"
 hold_court.8150.desc.few: "„Dokážu přesvědčit nespokojence, aby ustoupili, pokud zmírníš naše smluvní povinnosti...“"
 hold_court.8150.desc.group: "„Ostatní nespokojenci mi naslouchají a jsem si jistý, že je dokážu přesvědčit, aby ustoupili výměnou za několik změn našich smluvních povinností...“"
 hold_court.8150.desc.body: "\n\nPřestože se proslýchá, že"
 hold_court.8150.desc.independence: " shromažďuje mé vazaly a hodlá je přimět, aby se odtrhli od [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 hold_court.8150.desc.liberty: " stojí v čele zrádných snah o větší autonomii v [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip],"
 hold_court.8150.desc.claimant_self: " hledá podporu pro svůj falešný nárok na [target_faction.GetSpecialTitle.GetNameNoTier],"
 hold_court.8150.desc.claimant: " podporuje falešný nárok, který na [target_faction.GetSpecialTitle.GetNameNoTier] vznáší [target_faction.GetSpecialCharacter.GetTitledFirstName],"
 hold_court.8150.desc.outro: " něco takového by [target_faction.GetLeader.GetFirstNameNoTooltip] na veřejnosti jistě nikdy [Select_CString(target_faction.GetLeader.IsFemale,'nepřiznala','nepřiznal')]..."
 hold_court.8150.a: "Souhlasím, i když mě to bolí."
 hold_court.8150.a.tt_shared: "daňové $hold_court.8150.a.tt_contract_reduction$ a zároveň nebude $hold_court.8150.a.tt_faction_cooldown$"
 hold_court.8150.a.tt_single_all: "[target_faction.GetLeader.GetTitledFirstNameNoTooltip]: daňové $hold_court.8150.a.tt_contract_reduction$ a zároveň nebude $hold_court.8150.a.tt_faction_cooldown$"
 hold_court.8150.a.tt_single_cooldown: "Nebude $hold_court.8150.a.tt_faction_cooldown$"
 hold_court.8150.a.tt_contract_reduction: "nebo odvodní povinnosti budou sníženy o jednu úroveň"
 hold_court.8150.a.tt_faction_cooldown: "moci po dobu 5 let vstoupit do žádné frakce"
 hold_court.8150.a.tt_multiple_feudal_intro: "Každý feudální člen [target_faction.GetName]:"
 hold_court.8150.a.tt_multiple_intro: "Každý člen [target_faction.GetName]:"
 hold_court.8150.b: "Takže proti mně #EMP OPRAVDU#! něco kuješ?! Stráže, chopte se [Select_CString(target_faction.GetLeader.IsFemale,'jí','ho')]!"
 hold_court.8150.c: "Pojď, [target_faction.GetLeader.GetFirstNameNoTooltip], na ostatní zapomeň."
 hold_court.8150.c.tt_success: "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] přijme úplatek"
 hold_court.8150.c.tt_failure: "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] odmítne úplatek"
 hold_court.8150.d: "Vzpamatuj se! Ničeho tímhle darebáctvím nedosáhneš."
 hold_court.8150.d.tt_accept: "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] se nechá přesvědčit"
 hold_court.8150.d.tt_reject: "[target_faction.GetLeader.GetTitledFirstNameNoTooltip] se rozzuří"
 hold_court.8150.e: "Hraješ nebezpečnou hru, [target_faction.GetLeader.GetTitleAsNameNoTooltip]."
 hold_court.8160.t: "Veřejné obvinění"
 hold_court.8160.desc.intro_child: "[concerned.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('concerned'))], přivádí ke mně [victim.GetTitledFirstNameRegnal], ještě dítě. [Select_CString(concerned.IsFemale,'Je očividně sevřená úzkostí','Je očividně sevřený úzkostí')]. \n\n"
 hold_court.8160.desc.intro_spouse: "[concerned.GetTitledFirstNameRegnal] a [victim.GetTitledFirstNameRegnal] opatrně předstoupí před shromážděný dvůr a obezřetně si prohlížejí všechny kolem. \n\n"
 hold_court.8160.desc.intro_alone: "[victim.GetTitledFirstNameRegnal], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))], spěchá k mému boku a zarudlýma očima přejíždí shromážděný dvůr. \n\n"
 hold_court.8160.desc.intro_me: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jsem si jistý, že někdo v [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] mi usiluje o život!"
 hold_court.8160.desc.intro_other: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jsem si jistý, že někdo v [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] chce ublížit [victim.GetTitledFirstNameRegnal]!"
 hold_court.8160.desc.exposed: " Podívej, mám důkaz, že je to [accused.GetTitledFirstName]"
 hold_court.8160.desc.suspicion: " Nemám žádný důkaz, ale podezírám [accused.GetTitledFirstName]"
 hold_court.8160.desc.nemesis: " – ten [accused.Custom2('InsultAdjective', SCOPE.sC('victim'))] [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] se nezastaví před ničím, ani před vraždou, jen aby ukončil [victim.Custom('GetVictimOrMy')] život!“"
 hold_court.8160.desc.rival: " – ten [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] chce osobní rivalitu ukončit tím, že vezme [victim.Custom('GetVictimOrMy')] život!“"
 hold_court.8160.desc.my_claimant: " – chce prosadit svůj nárok na [relevant_title.GetName] a [victim.Custom('GetVictimOrMy')] osud je mu přitom zcela lhostejný!“"
 hold_court.8160.desc.their_claimant: " – nesnáší konkurenční nároky na [relevant_title.GetName], včetně toho, který je [victim.Custom('GetVictimOrMy')]!“"
 hold_court.8160.desc.joint_claimant: " – nechce žádnou konkurenci ve svém nároku na [relevant_title.GetName], včetně toho, který je [victim.Custom('GetVictimOrMy')]!“"
 hold_court.8160.desc.their_dislike: " – [victim.Custom('GetVictimOrMy')] nepřítel je přece zřejmý: [accused.GetTitledFirstName]!“"
 hold_court.8160.desc.my_dislike: " – [victim.Custom('GetVictimOrMy')] odpor je dobře známý a [accused.GetTitledFirstName] se za něj chce pomstít!“"
 hold_court.8160.desc.intrigue: " – vzhledem k pověsti [accused.GetTitledFirstName] není pochyb, že chce podříznout [victim.Custom('GetVictimOrMy')] krk!“"
 hold_court.8160.desc.fallback: " – kdo jiný by mohl chtít [victim.Custom('GetVictimOrMy')] pád!“"
 hold_court.8160.desc.outro: "\n\n„Prosím tě! Uvězni [accused.GetFirstNameNoTooltip] a udělej tomuto šílenství přítrž!“"
 hold_court.8160.a: "Při [ROOT.Char.GetFaith.HighGodName]! [accused.GetTitledFirstNameNoTooltip] musí být [Select_CString(accused.IsFemale,'zastavena','zastaven')]!"
 hold_court.8160.b.torturer: "Přede #EMP MNOU#! pravdu neskryješ!"
 hold_court.8160.b.executioner: "[executioner.GetFirstNameNoTooltip] se pravdy dopátrá."
 hold_court.8160.b.tt_confession: "[accused.GetTitledFirstNameNoTooltip] přizná účast na spiknutí"
 hold_court.8160.b.tt_silence: "[accused.GetTitledFirstNameNoTooltip] se k ničemu nepřizná"
 hold_court.8160.c: "[accused.GetTitledFirstNameNoTooltip] bude muset odpovědět na mé otázky."
 hold_court.8160.c.tt_success: "[accused.GetTitledFirstNameNoTooltip] se zaplete do vlastní lži"
 hold_court.8160.c.tt_failure: "[accused.GetTitledFirstNameNoTooltip] popře jakoukoli účast"
 hold_court.8160.d.involved: "Uklidni se, není se čeho bát."
 hold_court.8160.d.proof: "Tenhle „důkaz“ působí dost chatrně."
 hold_court.8160.d.fallback: "Zášť sama o sobě není zločin, [victim.GetFirstNameNoTooltip]."
 get_victim: "[ROOT.Char.GetTitledFirstNamePossessive]"
 hold_court.8161.t: "Osobní záležitost"
 hold_court.8161.desc.intro: "[victim.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))], předstoupí přede mě v doprovodu [victim.GetPrimarySpouse.GetFirstName], [Select_CString(victim.GetPrimarySpouse.IsFemale,'své očividně rozmrzelé manželky','svého očividně rozmrzelého manžela')]. \n\n[victim.GetPrimarySpouse.GetFirstNameNoTooltip] vyhrkne: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], [accused.GetTitledFirstName] se snaží svést [Select_CString(victim.IsFemale,'mou manželku','mého manžela')] – je to urážka [victim.GetPrimarySpouse.GetFaith.HighGodName]!"
 hold_court.8161.desc.nemesis: "Ten [accused.Custom2('InsultAdjective', SCOPE.sC('victim'))] [accused.Custom2('InsultNoun', SCOPE.sC('victim'))] se nezastaví před ničím, jen aby mi zničil život!“"
 hold_court.8161.desc.rival: "[accused.GetTitledFirstName] si svou rivalitu vybíjí tím, že mě chce zostudit!“"
 hold_court.8161.desc.quarry: "Je naprosto zřejmé, že [accused.GetTitledFirstName] touží po [victim.GetFirstNameNoTooltip] a nedokáže se ovládnout!“"
 hold_court.8161.desc.their_dislike: "[accused.GetTitledFirstName] [Select_CString(accused.IsFemale,'mě nikdy neměla ráda','mě nikdy neměl rád')]! Musí to být [Select_CString(accused.IsFemale,'ona','on')]!“"
 hold_court.8161.desc.my_dislike: "[accused.GetTitledFirstName] mi nikdy nebyl[Select_CString(victim.GetPrimarySpouse.IsFemale,'a','')] [Select_CString(victim.GetPrimarySpouse.IsFemale,'sympatická','sympatický')] – a teď je jasné proč!“"
 hold_court.8161.desc.intrigue: "Každý ví, jaké intriky [accused.GetTitledFirstName] spřádá, jak tahá za nitky a pohrává si s lidskými životy!“"
 hold_court.8161.desc.fallback: "Nikdo jiný mě nenapadá!“"
 hold_court.8161.desc.body: "\n\n[victim.GetFirstName] je očividně v rozpacích, že se tohle všechno probírá tak veřejně, a sotva se dokáže přimět pohlédnout mi do očí."
 hold_court.8161.a.homosexual: "Takové pohoršení nebudu trpět!"
 hold_court.8161.a.adultery: "Cizoložství u svého dvora trpět nebudu!"
 hold_court.8161.c: "Uvidíme, zda je na tom něco pravdy."
 hold_court.8161.d.involved: "Ta podezření jsou jistě neopodstatněná."
 hold_court.8161.d.permitted: "A co má být, [victim.GetPrimarySpouse.GetFaith.GetAdherentNameNoTooltip]?"
 hold_court.8161.d.fallback: "A žádný důkaz nemáš?"
 hold_court.8180.t: "Šlechtická privilegia"
 hold_court.8180.desc.intro: "[contract_lord.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('contract_lord'))], rázně předstoupí a očividně netrpělivě očekává mou odpověď na svou žádost. \n\n„[contract_lord.Custom2('RelationToMeShort', ROOT.Char)|U],"
 hold_court.8180.desc.religious: " o věrnosti rodu [contract_lord.GetHouse.GetBaseName] nikdy nemusíš pochybovat, ale naše vztahy by byly pevnější, kdyby nad námi nevisela hrozba pronásledování za naši víru.“"
 hold_court.8180.desc.fortification: " má-li rod [contract_lord.GetHouse.GetBaseName] chránit sebe i [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], potřebujeme pro [contract_lord.GetPrimaryTitle.GetNameNoTier] povolení a podporu k posílení našich opevnění.“"
 hold_court.8180.desc.coinage: " nedostatek oběživa dusí obchod v zemích [contract_lord.GetPrimaryTitle.GetNameNoTier]. Dovol rodu [contract_lord.GetHouse.GetBaseName] se souhlasem koruny zřídit vlastní mincovny pro dobro [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].“"
 hold_court.8180.desc.war_declaration: " [contract_lord.GetHouse.GetBaseName] je slavný a vznešený rod. Dovol nám opět bránit [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] i vlastní země v boji.“"
 hold_court.8180.desc.council: " [contract_lord.GetHouse.GetBaseName] patří k nejvýznamnějším rodům [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. Radám z [contract_lord.GetPrimaryTitle.GetNameNoTier] by měl být u dvora vždy dopřán sluch!“"
 hold_court.8180.desc.title_revocation: " pro tak významný rod, jako je [contract_lord.GetHouse.GetBaseName], je ponižující, že nad námi visí hrozba odebrání titulů jako nad obyčejnými barony či nájemci.“"
 hold_court.8180.desc.scutage: " rod [contract_lord.GetHouse.GetBaseName] má zoufalý nedostatek vojáků. Dovol nám místo mužů odvádět [ROOT.Char.GetTitleAsNameNoTooltip] peníze na obranu [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].“"
 hold_court.8180.desc.march: " rod [contract_lord.GetHouse.GetBaseName] by mohl [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sloužit lépe, pokud [contract_lord.GetPrimaryTitle.GetNameNoTier] obdrží postavení a výsady marky.“"
 hold_court.8180.desc.palatinate: " vznešený rod [contract_lord.GetHouse.GetBaseName] spolu s [contract_lord.GetPrimaryTitle.GetName] věrně slouží [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. Zasloužíme si, aby našemu postavení byla přiznána větší váha."
 hold_court.8180.desc.family_entrepeneurship: " rozvoj [contract_lord.GetPrimaryTitle.GetNameNoTier] by mohl obohatit [ROOT.Char.GetDynasty.GetName]. Potřebujeme jen zachovat své lidi pro místní projekty a obranu.“"
 hold_court.8180.desc.centralized_power: " daňové požadavky [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] těžce doléhají na [contract_lord.GetPrimaryTitle.GetNameNoTier], přitom máme mužů nazbyt. Napravme tuto nerovnováhu ku prospěchu obou stran."
 hold_court.8180.desc.religious_heretic: "\n\n„Jen [contract_lord.GetFaith.HighGodName] smí rozhodnout, kdo z věřících kráčí správnou cestou.“"
 hold_court.8180.desc.religious_heathen: "\n\n„[contract_lord.GetFaith.HighGodName] ochrání mě i mé blízké a možná bude jednou bdít i nad tebou.“"
 hold_court.8180.desc.martial_defensive: "\n\n„Svěř nám obranu panství a z míru pak budeme těžit všichni.“"
 hold_court.8180.desc.martial_offensive: "\n\n„Naše výsady ochrání jedině meč – a ten musí zůstat ostrý.“"
 hold_court.8180.desc.stewardship: "\n\n„Nebraň svým poddaným v dosažení blahobytu a společně můžeme všichni zbohatnout!“"
 hold_court.8180.desc.status: "\n\n„Vylučovat své nejschopnější a nejvýznamnější poddané jen zasévá rozkol a nedůvěru.“"
 hold_court.8180.desc.family: "\n\n„Ať největších výhod užívají ti nejurozenější šlechtici z [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
 hold_court.8180.desc.fallback: "\n\n„Nedovolme, aby stabilitu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] ohrožovaly malicherné neshody."
 hold_court.8180.a.religious: "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] se už nemusí obávat mých [ROOT.Char.GetFaith.BishopNeuterPlural]."
 hold_court.8180.a.fortification: "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] bude oporou obrany panství."
 hold_court.8180.a.coinage: "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] smí razit vlastní mince."
 hold_court.8180.a.war_declaration: "[contract_lord.GetPrimaryTitle.GetNamePossessiveNoTooltip] nepřátelé se znovu zachvějí!"
 hold_court.8180.a.council: "Hlas [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] bude vždy vyslyšen."
 hold_court.8180.a.title_revocation: "Na [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] už nikdo nesmí sáhnout."
 hold_court.8180.a.scutage: "Válečníci [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] mohou zůstat doma."
 hold_court.8180.a.march: "Obrana panství bude stát na [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 hold_court.8180.a.palatinate: "O postavení [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] už nikdo nebude pochybovat."
 hold_court.8180.a.family_entrepeneurship: "[contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] bude dál růst."
 hold_court.8180.a.centralized_power: "Vojáci z [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] budou sloužit panství."
 hold_court.8180.b: "Prokaž mi, že znáš #EMP cenu#! svobody."
 hold_court.8180.b.tt.success: "[contract_lord.GetTitledFirstNameNoTooltip] souhlasí, že zaplatí"
 hold_court.8180.b.tt.failure: "Požadavek [contract_lord.GetTitledFirstNameNoTooltip] rozčílí"
 hold_court.8180.c: "Doslechlo se ke mně, že máš pěknou sbírku..."
 hold_court.8180.c.tt.success: "[contract_lord.GetTitledFirstNameNoTooltip] se vzdá [vassal_artifact.GetName]"
 hold_court.8180.d: "Takové výsady zase vyžadují oběti."
 hold_court.8180.d.tt.success: "[contract_lord.GetTitledFirstNameNoTooltip] se vzdá [vassal_title.GetNameNoTierNoTooltip]"
 hold_court.8180.e: "Jen pokud hranice [contract_lord.GetPrimaryTitle.GetNameNoTierNoTooltip] zůstanou navždy beze změny."
 hold_court.8180.e.tt.success: "[contract_lord.GetTitledFirstNameNoTooltip] souhlasí s rozdělením"
 hold_court.8180.f: "Samozřejmě výměnou za větší závazky."
 hold_court.8180.g: "Nestačí ti být [contract_lord.GetTitleAsNameNoTooltip]?"
 hold_court.8190.t: "Nepřítel uvnitř"
 hold_court.8190.desc.intro: "[aggressor_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aggressor_vassal'))], sotva ovládá svůj hněv.\n\n„S tím cizákem z [other_vassal.GetCulture.GetName] kultury se musí něco udělat!“ \n\nDivokými gesty pokračuje: „Kam přijde [other_vassal.GetTitledFirstName], tam jsou i ty směšné zvyky –"
 hold_court.8190.desc.ethos: "[other_vassal.Custom('get_hold_court_8190_ethos')]“"
 hold_court.8190.desc.heritage: " všechno na nich odporuje hodnotám, které představuje [aggressor_vassal.GetCulture.GetHeritage.GetNameNoTooltip]!“"
 hold_court.8190.desc.language: " a tomu jejich takzvanému jazyku – [other_vassal.GetCulture.GetLanguage.GetNameNoTooltip] – se nedá říkat jinak než drzý rámus!“"
 hold_court.8190.desc.fallback: " vždyť jsi snad viděl, jak ti barbaři #EMP jedí?!#!“"
 hold_court.8190.desc.body: "\n\n„Je načase, aby se tví cizí poddaní přizpůsobili #EMP mravům#! těch, kdo stojí nad nimi!“"
 hold_court.8190.a: "Naše šlechta musí přijmout [aggressor_vassal.GetCulture.GetNameNoTooltip] kulturu!"
 hold_court.8190.a.tt_accept: "[other_vassal.GetTitledFirstName] souhlasí"
 hold_court.8190.a.tt_refuse: "[other_vassal.GetTitledFirstName] odmítá"
 hold_court.8190.a.tt.vassals: "Každý vazal, který nepatří k [THIS.Char.GetCulture.GetName] kultuře"
 hold_court.8190.a.tt.promote: "[THIS.Char.GetPrimaryTitle.GetBaseNameNoTier]: Integrace každého hrabství s [other_vassal.GetCulture.GetName] kulturou ([SCOPE.ScriptValue('court_8190_county_value')|0X]) bude obtížnější"
 hold_court.8190.b: "Od jiných tradic se máš mnoho co učit."
 hold_court.8190.b.tt.vassals: "Každý další vazal z [other_vassal.GetCulture.GetName] kultury"
 hold_court.8190.b.tt_success: "Kulturní napětí poleví"
 hold_court.8190.b.tt_failure: "Tvé fráze nikoho nepřesvědčí"
 hold_court.8190.c: "Na [aggressor_vassal.GetCulture.GetNameNoTooltip] kultuře nezáleží. [other_vassal.GetFirstNameNoTooltip] mi slouží věrně."
 hold_court.8190.d: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] je zemí mnoha národů."
 hold_court_8190_vassal_modifier: "Nevítaná kultura"
 hold_court_8190_bellicose: " při každé příležitosti se pouštějí do rvačky, ti surovci!"
 hold_court_8190_stoic: " všechno „vznešeně“ snášejí bez mrknutí oka! Ale #EMP prosím tě!#!"
 hold_court_8190_bureaucratic: " ani špetka úcty k osvědčeným způsobům jejich předků."
 hold_court_8190_spiritual: " #EMP úplně posedlí#! tím, co si přeje [ROOT.Char.GetFaith.HighGodName], a [ROOT.Char.GetFaith.AltPriestTermPlural] mají u nich poslední slovo."
 hold_court_8190_courtly: " před svými vládci se pořád lísají jako kočky!"
 hold_court_8190_egalitarian: " s cizinci jednají jako se sobě rovnými! Pche!"
 hold_court_8190_communal: " nemají ani špetku vlastní iniciativy nebo soběstačnosti!"
 hold_court.8200.t: "[ROOT.Char.GetFaith.HighGodName] nade vše"
 hold_court.8200.desc.intro: "[aggressor_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aggressor_vassal'))], čeká na audienci a s každou chvílí působí rozhněvaněji. \n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],"
 hold_court.8200.desc.vassal: " [infidel_vassal.GetTitledFirstName] je [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('infidel_vassal'))], a ty to v panství trpíš – dokonce mezi šlechtou!“"
 hold_court.8200.desc.pope: " [infidel_vassal.GetTitledFirstName] je [ROOT.Char.Custom2('GetUnbelieverTerm', SCOPE.sC('infidel_vassal'))], a přesto se vydává za [ROOT.Char.GetFaith.BishopNeuter]! Ostatní se kolem této falešné autority shromažďují, a to všechno pod tvou ochranou!“"
 hold_court.8200.desc.body: "\n\n„Je jasné, co od nás žádá [ROOT.Char.GetFaith.HighGodName] – [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] má být zemí věřících! Pryč se psy, kteří vyznávají [infidel_vassal.GetFaith.GetName]!“"
 hold_court.8200.a: "Máš pravdu, [infidel_vassal.GetTitledFirstNameNoTooltip] musí přestoupit na naši víru!"
 hold_court.8200.a.tt_accept: "[infidel_vassal.GetTitledFirstName] souhlasí s přestupem"
 hold_court.8200.a.tt_refuse: "[infidel_vassal.GetTitledFirstName] odmítá přestoupit"
 hold_court.8200.a.tt.vassals: "Každý vazal jiné víry než [THIS.Char.GetFaith.GetName]"
 hold_court.8200.a.tt.convert: "[THIS.Char.GetPrimaryTitle.GetBaseNameNoTier]: Každé hrabství, kde se vyznává [infidel_vassal.GetFaith.GetName] ([SCOPE.ScriptValue('court_8200_county_value')|0X]), bude obtížnější obrátit na jinou víru"
 hold_court.8200.c: "Teď už vidím pravdu! Pravou cestu ukazuje [infidel_vassal.GetFaith.HighGodName]!"
 hold_court.8200.c.tt.vassals: "Každý vazal vyznávající [infidel_vassal.GetFaith.GetName]"
 hold_court.8200.d: "[infidel_vassal.GetWomanMan|U] se posuzuje podle kvalit, ne podle víry."
 hold_court.8200.e: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|U]: všechna vyznání jsou zde vítána."
 cultural_benevolence_tt: "Kulturní vstřícnost"
 cultural_intolerance_tt: "Kulturní nesnášenlivost"
 hold_court_8200_vassal_modifier: "Nevítaná víra"
 hold_court.8210.t: "Právoplatné země"
 hold_court.8210.desc.intro: "[aggressor_vassal.GetTitledFirstName], očividně [Select_CString(aggressor_vassal.IsFemale,'rozhořčená','rozhořčený')], spěchá k tvému trůnu... \n\n„[aggressor_vassal.Custom2('RelationToMeShort', ROOT.Char)|U], "
 hold_court.8210.desc.de_jure: "že [vassal_claim.GetName] mi po právu náleží, je dobře doloženo. Už dávno se má za to, že [vassal_claim.GetDeJureLiege.GetName] tato území zahrnuje.“"
 hold_court.8210.desc.strong: "že [vassal_claim.GetName] mi po právu náleží, je nade vší pochybnost. Uznávají to tví vlastní heroldi i [ROOT.Char.GetFaith.AltPriestTermPlural] tvé víry.“"
 hold_court.8210.desc.weak: "ať si ostatní říkají, co chtějí, [vassal_claim.GetName] mi patří!"
 hold_court.8210.desc.other: "\n\n„Podpoříš můj nárok a přiměješ [defender_vassal.GetTitledFirstName] vzdát se toho, co [Select_CString(defender_vassal.IsFemale,'jí','mu')] nepatří? Vždyť [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('defender_vassal'))] není nad právem.“"
 hold_court.8210.desc.self: "\n\n„Podpoříš můj nárok a vzdáš se toho, co ti nepatří?“"
 hold_court.8210.a: "Této nespravedlnosti je konec."
 hold_court.8210.b: "Takové spory se odjakživa řeší silou."
 hold_court.8210.b.tt_aggressor: "[aggressor_vassal.GetTitledFirstNameNoTooltip] vítězí v souboji"
 hold_court.8210.b.tt_defender: "Titul zůstane [defender_vassal.GetNameOrMeNoTooltip]"
 hold_court.8210.c.none: "Nemáš žádný nárok, [aggressor_vassal.Custom2('InsultNoun', ROOT.Char)]."
 hold_court.8210.c.other: "[defender_vassal.GetFirstNamePossessiveNoTooltip] nárok je oprávněnější."
 hold_court.8210.c.self: "Můj nárok je oprávněnější."
 hold_court.8210.d: "Do takových věcí se nevměšuji."
 hold_court.8210.e: "[defender_vassal.GetTitleAsNameNoTooltip] ti přísahá věrnost."
 hold_court.8210.f.other: "Vyřešíte to mezi sebou mečem."
 hold_court.8210.f.self: "Musíš si to vybojovat mečem."
 hold_court.8210.duel_tt: "Souboj o [vassal_claim.GetName]: [defender_vassal.GetNameOrMeNoTooltip|U] proti [aggressor_vassal.GetTitledFirstName]"
 hold_court.8260.t: "[ROOT.Char.GetTitleAsNamePossessiveNoTooltip] mír"
 hold_court.8260.desc.intro: "[vassal_faction_target.GetFullName] přichází s kyselým výrazem a bez otálení přednáší svou žádost. \n\n„[ROOT.Char.GetTitleAsNameNoTooltip], [vassal_faction_leader.GetTitledFirstName] je mi [vassal_faction_target.Custom2('RelationToMeShort', SCOPE.sC('vassal_faction_leader'))] a chce zpochybnit mé právoplatné postavení,“"
 hold_court.8220.desc.claimant: " a dosadit na mé místo [vassal_claimant.GetTitledFirstName], [Select_CString(vassal_claimant.IsFemale,'která je mi','který je mi')] [vassal_faction_target.Custom2('RelationToMeShort', SCOPE.sC('vassal_claimant'))], [Select_CString(vassal_claimant.IsFemale,'jako uzurpátorku','jako uzurpátora')] v [vassal_faction.GetSpecialTitle.GetNameNoTier]!“"
 hold_court.8220.desc.claimant_self: " a [Select_CString(vassal_faction.GetSpecialCharacter.IsFemale,'sama sebe','sám sebe')] dosadit jako [vassal_faction.GetSpecialCharacter.GetLadyLord] [vassal_faction.GetSpecialTitle.GetNameNoTier]!“"
 hold_court.8220.desc.liberty: " omezuje mou moc a odporuje mým zákonným rozhodnutím, jako by [Select_CString(vassal_faction.GetLeader.IsFemale,'zapomněla','zapomněl')], že jsem [vassal_faction_target.GetTitleAsNameNoTooltip]!“"
 hold_court.8260.desc.body: "\n\n„[vassal_faction.GetLeader.GetTitledFirstNameNoTooltip] právě teď burcuje další nespokojence. #EMP Ty#! jim musíš připomenout, kdo má v tomto panství skutečnou moc!“"
 hold_court.8260.a.peace: "[vassal_faction.GetLeader.GetTitledFirstNameNoTooltip] s těmito hrátkami přestane."
 hold_court.8260.a.war: "[vassal_faction.GetLeader.GetTitledFirstNameNoTooltip] musí okamžitě kapitulovat!"
 hold_court_8260_faction_member_tt: "Každý člen [vassal_faction.GetName] ([SCOPE.ScriptValue('court_8260_faction_value')|0]), která cílí na [vassal_faction_target.GetTitledFirstName]"
 hold_court.8260.b: "Buřiči nebudou trpěni."
 hold_court.8260.c: "V [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] zavládne mír!"
 hold_court.8260.d: "Mají ale pádné argumenty, ne?"
 hold_court.8260.e: "Ach, já #EMP musím#!? Vážně?"
 hold_court.8270.t: "Přísaha věrnosti"
 hold_court.8270.desc: "Mí heroldi ohlašují příchod sousedního drobného [Select_CString(neighbor.IsFemale,'vládkyně','vládce')], [neighbor.GetTitledFirstName]. [neighbor.GetPrimaryTitle.GetNameNoTier] leží hned za našimi hranicemi. \n\n[neighbor.GetTitledFirstNameNoTooltip] důstojně vstoupí do mých síní a hluboce se ukloní. „Vaše Milosti, přicházím ti pokorně svěřit své panství – pokud přijmeš mé podmínky.“ \n\n„Budu ti sloužit jako [Select_CString(neighbor.IsFemale,'věrná vazalka','věrný vazal')] [ROOT.Char.GetPrimaryTitle.GetNameNoTier] výměnou za tvou ochranu. Kéž z této dohody oba naše velké rody vzkvétají!“"
 hold_court.8270.a: "Přijímám, [neighbor.GetTitledFirstNameNoTooltip]."
 hold_court.8270.b: "Ty podmínky mi připadají poněkud jednostranné..."
 hold_court.8270.b.accept: "[neighbor.GetTitledFirstNameNoTooltip] přijímá tvé změny"
 hold_court.8270.b.refuse: "[neighbor.GetTitledFirstNameNoTooltip] odmítá"
 hold_court.8270.d: "To si nemyslím."
 hold_court.8280.t: "Kočovní sousedé"
 hold_court.8280.desc.foreign: "[feudal_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] čeká na audienci a myšlenkami je očividně u svých problémů.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ ozve se prosebně, „na mých hranicích se [nomad_culture.GetCollectiveNoun] bouří a každý den jich stále více přechází z [nomad.GetTopLiege.GetPrimaryTitle.GetNameNoTier] do [feudal_county.GetName].“ \n\n„Obávám se, že pokud je nikdo nevyžene, brzy osídlí celé [feudal_county.GetTierAsNameNoTooltip]!“"
 hold_court.8280.desc.local: "[feudal_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] si [Select_CString(feudal_vassal.IsFemale,'vyžádala','vyžádal')] audienci. [Select_CString(nomad.IsFemale,'Dorazila také','Dorazil také')] [nomad.Custom2('MyCharacterIntroduction', ROOT.Char)] – tohle bude zajímavé...\n\n„[ROOT.Char.GetTitleAsNameNoTooltip]!“ zakvílí [feudal_vassal.GetFirstNameNoTooltip]. „Do [feudal_county.GetName] se valí kočovní jezdci z [nomad.GetFirstNamePossessiveNoTooltip] zemí – musí se vrátit!“ \n\n[nomad.GetFirstNameNoTooltip] pokrčí rameny. „Můj lid kočuje. Chce jen najít dobré, dosud nevyužité pastviny pro svá stáda...“"
 hold_court.8280.a.foreign: "Musí se vrátit do [nomad.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 hold_court.8280.a.local: "[nomad.GetTitledFirstNameNoTooltip], drž své jezdce na uzdě!"
 hold_court.8280.b: "Schopní jezdci se mi vždy hodí."
 hold_court.8280.c: "Zjevně přeháníš, [feudal_vassal.GetFirstNameNoTooltip]."
 hold_court.8290.t: "Listina [city_province.GetTitle.GetAdjectiveNoTooltip]"
 hold_court.8290.desc: "Přede mnou stojí někdo neznámý – [city_mayor.GetWomanMan]. Zřejmě se jmenuje [city_mayor.GetFirstName] a je [city_mayor.GetTitleAsNameNoTooltip] v doméně [city_vassal.GetTitledFirstNamePossessive] – člověka, který je mi [ROOT.Char.Custom2('RelationToMeShort', city_vassal)].\n\n„[ROOT.Char.GetTitleAsNameNoTooltip], přicházím sem bez svolení své vrchnosti a žádám tě, abys mému městu [city_province.GetTitle.GetNameNoTier] svěřil okolní země, které bychom mohli sami spravovat.“\n\n„Mohli bychom si řídit vlastní záležitosti a přinést [ROOT.Char.GetPrimaryTitle.Custom('GetTierBase')] velký blahobyt, kdybychom se jen zbavili dusivých daní a povinností, které na nás uvaluje [city_vassal.GetTitleAsNameNoTooltip] [city_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip].“"
 hold_court.8290.a: "Věřím, že tvé město na mou přízeň nezapomene."
 hold_court.8290.b: "Ukázka budoucí prosperity by mě mohla přesvědčit."
 hold_court.8290.c: "To, co žádáš, je nepřijatelné."
 every_glory_hound_and_owner_actor: "[city_vassal.GetTitledFirstName] a všichni $glory_hound_vassals$ ([actor.MakeScope.ScriptValue('number_of_glory_hound_vassals')|V0])"
 hold_court_8290_grant_tooltip: "[city_vassal.GetTitledFirstName] přijde o [city_county.GetName]; vznikne zde [Concept('republic','republika')|E] pod správou [city_mayor.GetTitledFirstName]"
 hold_court.8300.t: "Vzdání se práv"
 hold_court.8300.desc: "Do mých síní přichází [city_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', city_vassal)], což mě potěší, třebaže není zřejmé, jak chce svou žádost přednést.\n\nNakonec promluví: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], mé postavení je skromné: [city_vassal.GetTitleAsNameNoTooltip], a mé malé državy mi bohatě stačí. Myslím jen na blaho svého lidu v [city_vassal.GetPrimaryTitle.GetNameNoTier], především na duše z [city_province.GetTitle.GetNameNoTier] – a samozřejmě na dobro #EMP celého#! [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].“\n\n„Žádám o svolení vzdát se dědičných práv svého rodu k těmto zemím a namísto toho je spravovat společně, jak to činí městští starostové.“"
 hold_court.8300.a: "Nanejvýš zajímavá myšlenka."
 hold_court.8300.b: "Pokud #EMP ty#! privilegia nechceš, dostane je někdo jiný."
 hold_court.8300.c: "Tvá práva jsou nedotknutelná, [city_vassal.GetFirstNameNoTooltip]!"
 hold_court.8310.t: "Upevnění panství"
 hold_court.8310.desc: "Překvapí mě, když dnes přede mnou poklekne [drifting_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', drifting_vassal)], [drifting_vassal.GetLadyLord] z [drifting_duchy.GetAdjectiveNoTooltip] oblasti. "
 hold_court.8310.faith_culture: "Pochází z lidu [drifting_vassal.GetCulture.GetCollectiveNoun] – a navíc se hlásí k označení [drifting_vassal.GetFaith.GetAdherentName]. "
 hold_court.8310.culture: "Pochází z lidu [drifting_vassal.GetCulture.GetCollectiveNoun]. "
 hold_court.8310.faith: "Patří mezi [drifting_vassal.GetFaith.GetAdherentNamePlural]. "
 hold_court.8310.fallback: "Vládne zdejším územím. "
 hold_court.8310.body: "\n\n[drifting_vassal.GetTitledFirstNameNoTooltip] začne: „[ROOT.Char.GetTitleAsNameNoTooltip], všichni víme, že časy se změnily. Staré [drifting_duchy.GetDeJureLiege.GetAdjectiveNoTooltip] zákony a zvyklosti musí ustoupit, má-li [drifting_duchy.GetNameNoTierNoTooltip] získat právoplatné uznání jako nedílná součást [drifting_kingdom.GetNameNoTierNoTooltip].“\n\n„Vymýtit mezi lidem poslední pozůstatky starých pořádků není snadný úkol, ale se správnou... #EMP motivací#!...“"
 hold_court.8310.a: "#EMP Motivací#!?! Takovou zradu je třeba vymýtit!"
 hold_court.8310.b: "Dobře chápu, kam míříš, [drifting_vassal.GetFirstNameNoTooltip]."
 hold_court.8310.c: "Vážně? Podívám se na [drifting_duchy.GetAdjectiveNoTooltip] zákony."
 hold_court.8310.c.success: "Tvé změny jsou přijaty s povděkem"
 hold_court.8310.c.failure: "Vneseš do věci ještě větší zmatek"
 hold_court.8310.d: "Takové věci prostě vyžadují čas."
 hold_court.8310.county_tooltip: "Všechna [Concept('de_jure','de iure')|E] [drifting_duchy.GetAdjective] [Concept('counties','hrabství')|E] ve tvém [Concept('realm','panství')|E]"
 hold_court.8320.t: "Sporná pozůstalost"
 hold_court.8320.self: "[probate_vassal.GetName], [ROOT.Char.Custom2('RelationToMeShort', probate_vassal)], přede mě předstoupí. Doprovází [Select_CString(probate_vassal.IsFemale,'ji','ho')]"
 hold_court.8320.regent: "[probate_rep.GetTitledFirstName], [probate_vassal.Custom2('RelationToMeShort', probate_rep)] [probate_vassal.GetTitleAsName] [probate_vassal.GetPrimaryTitle.GetNameNoTierPossessive], přede mě předstoupí. Doprovází [Select_CString(probate_rep.IsFemale,'ji','ho')]"
 hold_court.8320.monk: " [probate_priest.GetFaith.GetAdjectiveNoTooltip] [Select_CString(probate_priest.IsFemale,'řeholnice','mnich')]."
 hold_court.8320.priest: " [probate_priest.GetFaith.GetAdjectiveNoTooltip] [probate_priest.Custom('PriestTitle')]."
 hold_court.8320.desc: "Matně si na ten případ vzpomínám – šlo o nějaký spor kolem poslední vůle [probate_dead.GetTitledFirstNamePossessive]...\n\n[probate_vassal.GetFirstNameNoTooltip] vybuchne: „[ROOT.Char.GetTitleAsNameNoTooltip], ujišťuji tě, že ty sliby o darování půdy jsou čirý výmysl! [probate_dead.GetTitledFirstNameNoTooltip], [probate_vassal.Custom2('RelationToMeShort', probate_dead)], možná tu a tam [Select_CString(probate_dead.IsFemale,'rozdávala','rozdával')] almužny, ale darovat #EMP úplně všechno – [probate_county.GetName|l]#!?! To je přece naprosto absurdní!“\n\n"
 hold_court.8320.monk_2: "[Select_CString(probate_priest.IsFemale,'Řeholnice si odkašle','Mnich si odkašle')]:"
 hold_court.8320.priest_2: "[probate_priest.Custom('PriestTitle')|U] si odkašle:"
 hold_court.8320.body: " „Jmenuji se [probate_priest.GetFirstName], Vaše Milosti. Mým působištěm je [probate_dead.GetFaith.HouseOfWorship] v [probate_province.GetTitle.GetNameNoTier]. Mluvíme pravdu! [probate_dead.GetFirstNameNoTooltip] [Select_CString(probate_dead.IsFemale,'byla zbožná','byl zbožný')] [probate_dead.GetWomanMan]. [Select_CString(probate_dead.IsFemale,'Trávila','Trávil')] s námi mnoho času, než [Select_CString(probate_dead.IsFemale,'nalezla','nalezl')] pokoj [probate_dead.GetFaith.HighGodNameAlternate] v [probate_dead.GetFaith.PositiveAfterLife]...“\n\n[probate_vassal.GetTitledFirstNameNoTooltip] protočí oči a v obličeji zrudne hněvem."
 hold_court.8320.a: "Země náleží věrným služebníkům [probate_priest.GetFaith.HighGodNamePossessive]."
 hold_court.8320.b: "Titul si nech, [probate_vassal.GetFirstNameNoTooltip], ale náhradu dostanou [probate_priest.GetFaith.AltPriestTermPlural]."
 hold_court.8320.c: "Zapeklitá věc. Zdá se, že oba nároky mají stejnou váhu..."
 hold_court.8320.d: "Dědické právo [probate_dead.Custom2('RelationToMePossessive', probate_vassal)] má přednost před vším."
 every_close_family_hold_court_8320_tooltip: "[Concept('close_family','Blízká rodina')|E] postavy [probate_vassal.GetTitledFirstNameNoTooltip]"
 hold_court_8320_grant_tooltip: "[probate_vassal.GetTitledFirstName] přijde o [probate_county.GetName]; vznikne zde [Concept('theocracy','teokracie')|E] pod správou [probate_priest.GetTitledFirstName]"
 hold_court.8330.t: "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] zažívá rozkol"
 hold_court.8330.desc: "Přede mnou stojí mí vazalové [vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName]. Jejich slovo má na někdy až horečnatém dvoře [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip] značnou váhu. Dnes však jejich hlasy rozhodně neladí.\n\n[vassal_1.GetFirstNameNoTooltip] předstoupí: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], přicházím před zraky všech vznešených a vážených, abych [vassal_2.GetFirstNameNoTooltip] konečně uvedl na pravou míru!“\n\n"
 hold_court.8330.intro.courtly: "„Staré šlechtické rody [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] každým rokem stále více překračují meze svých privilegií,"
 hold_court.8330.intro.glory_hound: "„Váleční štváči se snaží zatáhnout [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] do konfliktů kvůli vlastním malicherným cílům,"
 hold_court.8330.intro.parochial: "„Líní páni bez špetky ctižádosti, kteří touží jen po klidném životě a hromadění bohatství, podkopávají naši sílu,"
 hold_court.8330.intro.zealot: "„Je zřejmé, že [ROOT.Char.GetFaith.AltPriestTermPlural] získali v [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] až příliš velký vliv,"
 hold_court.8330.intro.minority: "„[ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')|U] se vysmívají tvé štědrosti, zatímco kují pikle s tvými nepřáteli,"
 hold_court.8330.outro.courtly: " a tím ohrožují postavení velkých rodů panství: rodu [vassal_1.GetHouse.GetBaseNameNoTooltip], a dokonce #EMP rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!#!"
 hold_court.8330.outro.glory_hound: " zatímco my měkneme a stáváme se snadnou kořistí nepřátel, kteří proti panství nikdy nepřestávají kout pikle."
 hold_court.8330.outro.parochial: " a pokud chceme zachovat křehkou rovnováhu zájmů v panství, musíme se mít na pozoru."
 hold_court.8330.outro.zealot: " a přitom nedbají na zásady [ROOT.Char.GetFaith.ReligiousText] ani na vůli [ROOT.Char.GetFaith.HighGodName]."
 hold_court.8330.outro.minority: " a přehlížejí pokojné soužití našich společenství, na němž stojí naše síla."
 hold_court.8330.end: " Nepochybuji, že se mnou souhlasíš, [Select_CString(ROOT.Char.IsFemale,'má lenní paní','můj lenní pane')].“\n\n[vassal_2.GetFirstNameNoTooltip] jen zavrtí hlavou a spolu s celým dvorem na mě v očekávání hledí..."
 hold_court.8330.a.courtly: "Pradávná práva šlechty mají přednost před vším ostatním."
 hold_court.8330.a.glory_hound: "Ať uděláme cokoli, [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] z toho musí vyjít silnější."
 hold_court.8330.a.parochial: "Mým úkolem je zajistit pevnou a stabilní vládu."
 hold_court.8330.a.zealot: "Všichni – #EMP dokonce i já#! – jsme pouhými nástroji [ROOT.Char.GetFaith.HighGodName]."
 hold_court.8330.a.minority: "Pluralita nám může mnoho přinést."
 hold_court.8330.c: "Vaše služby jsou pro panství neocenitelné."
 hold_court.8330.c.success: "Oba si získáš svým šarmem"
 hold_court.8330.c.failure: "Jejich stoupenci zůstávají nespokojení"
 hold_court.8330.d: "Taková marnivost jen uráží ostatní vazaly."
 every_other_non_minor_vassal_actor: "Všichni ostatní kromě $barons_and_minor_landholders_vassal$ ([actor.MakeScope.ScriptValue('hold_court_8330_other_vassals_count')|V0])"
 hold_court.8340.t: "Hledám práci"
 hold_court.8340.desc: "Přede mě s tichou důstojností předstoupí někdo [candidate.Custom('GetYoungMiddleAgedOld')] – [candidate.GetWomanMan] – a hluboce se ukloní. „Zdravím tě, Veličenstvo. Jmenuji se [candidate.GetFirstName] a věrně ti sloužím. Dnes přicházím požádat o místo u tvého dvora.“\n\n"
 hold_court.8340.diplomacy: "„Znám mnoho dvorů. V mé domovině [birthplace.GetNameNoTierNoTooltip] bývalo mou povinností zajišťovat pohostinnost místním pánům a jejich četným hostům."
 hold_court.8340.stewardship: "„Se správou mám bohaté zkušenosti z práce pro mnoho místních pánů a dvorů v mé domovině [birthplace.GetNameNoTierNoTooltip]."
 hold_court.8340.intrigue: "„Mám za sebou nejrůznější... #EMP zkušenosti#! z měst mé domoviny [birthplace.GetNameNoTierNoTooltip]."
 hold_court.8340.learning: "„Jsem [candidate.GetWomanMan] a knihy ani pero mi nejsou cizí. Mou prací bylo psát pro místní pány a [birthplace.GetCountyData.GetFaith.AltPriestTermPlural] v mé domovině [birthplace.GetNameNoTierNoTooltip]."
 hold_court.8340.prowess: "„Mám za sebou mnoho bojů ve službách místních pánů a posádek mé domoviny [birthplace.GetNameNoTierNoTooltip]."
 hold_court.8340.outro: " Bylo by mi ctí využít své nadání pro vyšší cíle. [ROOT.Char.GetTitleAsNameNoTooltip] – právě takové vrchnosti chci sloužit. A [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] je panstvím, kterému chci prospět.“"
 hold_court.8340.a: "Mám pro tebe #EMP přesně#! tu pravou práci."
 hold_court.8340.b: "Dobrá, něco pro tebe mám."
 hold_court.8340.c: "Konečně [candidate.GetWomanMan], [Select_CString(candidate.IsFemale,'která se hodí','který se hodí')]!"
 hold_court.8340.d: "Momentálně nemám žádné volné místo..."
 hold_court_8280_nomadic_guard: "Nomádská garda"
 hold_court_8280_nomadic_guard_desc: "Tato postava najala stepní nomády do své osobní gardy."
