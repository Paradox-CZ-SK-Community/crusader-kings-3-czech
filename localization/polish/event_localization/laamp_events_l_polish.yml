 ep3_laamp_flavour_ewan.4061.t: "Oči v noci"
 ep3_laamp_flavour_ewan.4061.desc.intro: "Ráno přichází zpráva, že lidožravá bestie znovu udeřila:"
 ep3_laamp_flavour_ewan.4061.desc.size.titanic: "od včerejší noci chybějí tři lidé a nezůstalo po nich nic než krvavé šmouhy a blátivé stopy něčeho vskutku titánského."
 ep3_laamp_flavour_ewan.4061.desc.size.colossal: "od včerejší noci chybějí tři lidé a nezůstalo po nich nic než úlomky kostí a větší část jedné paže, zbytek pozřela jakási kolosální obluda."
 ep3_laamp_flavour_ewan.4061.desc.size.mammoth: "od včerejší noci chybějí dva lidé, jejich těla nějaký obrovský predátor roztrhal na kusy a roznesl po širokém okolí."
 ep3_laamp_flavour_ewan.4061.desc.size.huge: "od včerejší noci chybějí dva lidé a nedaleko za okrajem tábora byly nalezeny jen změti potrhaného masa, které po sobě zanechala jakási obrovská šelma."
 ep3_laamp_flavour_ewan.4061.desc.size.large: "další družiník byl rozsápán a většina jeho těla ležela poblíž [ROOT.Char.Custom('GetRandomCampBuilding')], kam je velká šelma pohodila."
 ep3_laamp_flavour_ewan.4061.desc.size.nimble: "další život zmizel beze stopy, až na mělké rýhy po vlečení a několik kapek krve v místě, kde mrštný tvor přemohl svou kořist."
 ep3_laamp_flavour_ewan.4061.desc.midtro: "\n\nStrážným se na tu prokletou věc nedaří ani pořádně pohlédnout. Ať je to cokoli, zachutnali jsme tomu a zjevně je to dost chytré, aby nás přes den či za časného večera sledovalo.\n\n"
 ep3_laamp_flavour_ewan.4061.desc.sight.blind: "V myšlenkách se obracím"
 ep3_laamp_flavour_ewan.4061.desc.sight.sighted: "Pohlédnu"
 ep3_laamp_flavour_ewan.4061.desc.terrain.major_river: "k řece, podél níž nás vede cesta. Tak obrovská masa vody může skrývat všemožné hrůzy číhající pod hladinou."
 ep3_laamp_flavour_ewan.4061.desc.terrain.farmlands: "k okolní zemědělské krajině, hustému moři živých plotů a polí protkanému drobnými hájky. Každých pár kroků může skrývat další hrůzu."
 ep3_laamp_flavour_ewan.4061.desc.terrain.hills: "k pásům kopců, mezi nimiž se vineme. Každý z nich zakrývá výhled na opačnou stranu, takže nás nějaká dravá hrůza může snadno nepozorovaně sledovat."
 ep3_laamp_flavour_ewan.4061.desc.terrain.mountains: "k rozeklaným vrcholům a hřebenům, které se nad námi tyčí v bledém světle úsvitu. Jeskynní tvor tu má bezpočet míst, kde se může ukrývat."
 ep3_laamp_flavour_ewan.4061.desc.terrain.desert: "k moři dun kolem nás. [ROOT.Char.Custom('SenseObserve_SeemLook')|U] tak otevřeně, ale lstivá noční šelma jím může proplouvat stejně snadno jako žralok vlnami."
 ep3_laamp_flavour_ewan.4061.desc.terrain.desert_mountains: "k prašným vrcholům a písečným hřebenům, které nás stíní před ostrým ranním světlem. Je tu až příliš mnoho míst, kde může hladová bestie přečkat denní žár."
 ep3_laamp_flavour_ewan.4061.desc.terrain.oasis: "$ep3_laamp_flavour_ewan.4061.desc.terrain.desert$"
 ep3_laamp_flavour_ewan.4061.desc.terrain.jungle: "k propletené změti stromů a husté klenbě obtěžkané liánami. Ta šelma může být právě teď jen pár kroků od nás a nikdy bychom o ní nevěděli."
 ep3_laamp_flavour_ewan.4061.desc.terrain.forest: "k příkrovu stromů táhnoucímu se všemi směry. Les je tak hustý, že od okraje tábora nedohlédneme příliš daleko, a šelma tak má bezpočet míst k úkrytu."
 ep3_laamp_flavour_ewan.4061.desc.terrain.taiga: "$ep3_laamp_flavour_ewan.4061.desc.terrain.forest$"
 ep3_laamp_flavour_ewan.4061.desc.terrain.wetlands: "k mlhavému obzoru a nízkým pahorkům rozesetým po mokřadech. Většina země je rovná, ale rozhodně ne natolik, aby se tu #EMP vůbec#! nemohla skrývat nějaká podivná hrůza."
 ep3_laamp_flavour_ewan.4061.desc.terrain.steppe: "k moři trávy kolem nás. Jen hlupák by si myslel, že rovná krajina nenabízí žádné úkryty — jsou tu hřebeny, údolí i jeskyně, v nichž se mohou skrývat podivné hrůzy."
 ep3_laamp_flavour_ewan.4061.desc.terrain.floodplains: "k bahnitým záplavovým oblastem lemovaným stromy, jimiž právě procházíme. Dokonalá krajina pro jakoukoli šelmu, která ráda útočí ze zálohy."
 ep3_laamp_flavour_ewan.4061.desc.terrain.drylands: "k suché, prašné zemi, po níž postupujeme. Kopce a osamělé stromy ji člení natolik, že nás tu může snadno stopovat jakákoli slintající bestie."
 ep3_laamp_flavour_ewan.4061.desc.terrain.plains: "k širokým zvlněným pláním, přes něž putujeme. Jsou rovné, ale ne #EMP dokonale#! rovné, a jejich vyvýšeniny a prohlubně mohou skrývat všemožné hrůzy."
 ep3_laamp_flavour_ewan.4061.desc.outro: "Pozoruje nás. Čeká. Hlad po večerní hostině pomalu narůstá."
 ep3_laamp_flavour_ewan.4061.a: "Zesilte hlídky."
 ep3_laamp_flavour_ewan.4061.a.tt.duel.safe: "V nejhorším případě bestie sežere několik tvých [Concept('followers','družiníků')|E]"
 ep3_laamp_flavour_ewan.4061.a.tt.success: "Bestie je zadržena a zabita"
 ep3_laamp_flavour_ewan.4061.a.tt.failure: "Několik dalších mrtvých"
 ep3_laamp_flavour_ewan.4061.b: "Její hlava bude moje!"
 ep3_laamp_flavour_ewan.4061.a.tt.duel.risky: "Osobně se vydáš bestii pronásledovat a výměnou za [Concept('prestige','prestiž')|E] riskuješ možnou [Concept('character_death_death','smrt')|E]"
 ep3_laamp_flavour_ewan.4061.a.tt.duel.risky.are_you_sure: "@alert_icon! #alert_trial Podle toho, co je to zač — a jak je to doopravdy velké — může být lov docela snadný, nebo také velmi, velmi obtížný. Jakmile se však vydáš na cestu, nebude už možné couvnout.#!"
 ep3_laamp_flavour_ewan.4061.c: "Dokud nesežere nikoho důležitého."
 ep3_laamp_flavour_ewan.4061.c.tt.success: "Nesežrala"
