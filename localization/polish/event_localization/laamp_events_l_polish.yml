 ep3_laamp_flavour_ewan.4031.b: "Než se zotaví, můžeme náklad přerozdělit."
 ep3_laamp_flavour_ewan.4031.b.tt.success: "Menší břemeno, menší trápení"
 ep3_laamp_flavour_ewan.4031.b.tt.failure: "$ep3_laamp_flavour_ewan.4031.a.tt.failure$"
