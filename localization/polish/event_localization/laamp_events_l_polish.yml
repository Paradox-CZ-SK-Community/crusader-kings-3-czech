 ep3_laamp_flavour_ewan.4051.t: "Ztracené zásoby"
 ep3_laamp_flavour_ewan.4051.tt.most_provisions_regained: "Většina $game_concept_provisions$ je získána zpět"
 ep3_laamp_flavour_ewan.4051.tt.some_provisions_regained: "Část $game_concept_provisions$ je získána zpět"
 ep3_laamp_flavour_ewan.4051.tt.provisions_lost: "Veškeré $game_concept_provisions$ zůstávají ztraceny"
 ep3_laamp_flavour_ewan.4051.desc: "Když pod jedním putovním praporem táhne tolik vojáků a musíme procházet tolika #EMP pochybnými#! kraji, dá se čekat, že čas od času nějaké zásoby zmizí.\n\nTohle ale není pár zásob.\n\nTohle je obrovské, #EMP skutečně obrovské#! množství zásob. Nějaký sobecký hlupák je buď prodal místním či ničemům z mých řad, ztratil vlastní neschopností, vůbec je nenakoupil, nebo je prostě promrhal. Takové porušení kázně nelze odpustit."
 ep3_laamp_flavour_ewan.4051.a: "Přineste mi bič a viníka už najdeme!"
