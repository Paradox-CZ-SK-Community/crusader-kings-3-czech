 ep3_laamp_flavour_ewan.3073.t: "$ep3_laamp_flavour_ewan.3071.t$: Vítězný souboj"
 ep3_laamp_flavour_ewan.3073.desc: "Když se [local_soldier.GetFirstName] po smrtících ranách zhroutí k zemi, z řad vojáků se ozve zděšený výkřik.\n\nPo smrti toho, kdo je vedl, se morálka místních zcela zhroutí a dávají se na neuspořádaný ústup, zatímco mí vojáci se jim drží v patách.\n\nPohlédnu na mrtvé tělo. Hmf.\n\nSmrt nebo sláva, vskutku."
 ep3_laamp_flavour_ewan.3073.a: "Ubohý hlupák."
 ep3_laamp_flavour_ewan.3081.t: "Poprat se o to"
 ep3_laamp_flavour_ewan.3081.desc: "[challenger.GetFirstName|U] právě [Select_CString(challenger.IsFemale, 'porazila', 'porazil')] dalšího soupeře, který se teď udýchaně a poraženě hroutí k zemi.\n\nZápas je z pochopitelných důvodů mezi žoldnéři docela oblíbený, ale [challenger.GetFirstNameNoTooltip] k němu přistupuje téměř jako k umění. Občas si říkám, zda by [Select_CString(challenger.IsFemale, 'nejraději nebojovala', 'nejraději nebojoval')] holýma rukama a žádnou jinou zbraň vůbec nepotřeboval[Select_CString(challenger.IsFemale, 'a', '')].\n\n[challenger.GetFirstNameNoTooltip|U] si všimne mého zamyšleného pohledu a v zdvořilém — byť posměšném — gestu pozvedne pěsti. „Tak co, [ROOT.Char.GetFirstNameNoTooltip], jdeš do toho?“"
 ep3_laamp_flavour_ewan.3081.a: "Odvážná slova od někoho, kdo za chvíli prohraje."
 ep3_laamp_flavour_ewan.3081.a.tt.success: "[challenger.GetFirstNameNoTooltip] se ti v zápase podvolí"
 ep3_laamp_flavour_ewan.3081.a.tt.failure: "Porážka"
 ep3_laamp_flavour_ewan.3081.b: "Za tu otázku dostane výprask."
 ep3_laamp_flavour_ewan.3081.c: "Ha, #EMP ne#!."
 ep3_laamp_flavour_ewan.4001.t: "Lapkové!"
 ep3_laamp_flavour_ewan.4001.desc: "Lapkové zaútočí ještě za pochodu, kdy jsou naši obránci i ti nejzranitelnější roztaženi v dlouhé klikatící se koloně.\n\nPočínají si sehraně. Dlouhým zatroubením na roh dají znamení a vyhrnou se z úkrytů, aby s děsivou zuřivostí udeřili současně na několika místech naší kolony.\n\nPřesto je okamžitě zřejmé, o co jim jde. Jejich vůdce, [Select_CString(bandit_leader.IsFemale, 'obávaná žena', 'obávaný muž')] z [bandit_leader.GetCulture.GetName] kultury, vede svou bandu přímo k vozům nejvíce naloženým zásobami."
 ep3_laamp_flavour_ewan.4001.a: "Odrazte je!"
 ep3_laamp_flavour_ewan.4001.a.tt.success: "Lapkové jsou rozprášeni"
 ep3_laamp_flavour_ewan.4001.a.tt.failure: "Přesto prchnou se svou kořistí"
 ep3_laamp_flavour_ewan.4001.b: "Ochutnáš mou ocel, lapko!"
 ep3_laamp_flavour_ewan.4001.c: "Kliď se, #EMP malá rybo#!."
 ep3_laamp_flavour_ewan.4001.c.tt.success: "Zastrašíš místní zločince"
 ep3_laamp_flavour_ewan.4001.c.tt.failure: "Tvá pověst na ně nezapůsobí"
 ep3_laamp_flavour_ewan.4001.d: "Vydejte jim zásoby."
 ep3_laamp_flavour_ewan.4003.t: "$ep3_laamp_flavour_ewan.4001.t$: Vítězný souboj"
 ep3_laamp_flavour_ewan.4003.desc: "Smrt jejich vůdce mezi lapky vnese zběsilou paniku.\n\nVýkřiky a nářek už nevycházejí z vyděšených bezbranných členů naší kolony, nýbrž z hrdlořezů, kteří před očima sledují, jak se jejich plán rozpadá tím nejhorším možným způsobem.\n\nTi nejzbabělejší se dají na útěk, bezohlednější dokonce zraňují vlastní druhy, aby si kryli ústup. Tak či onak, během několika minut je po útoku."
 ep3_laamp_flavour_ewan.4003.a: "Mě nikdo okrádat nebude."
 ep3_laamp_flavour_ewan.4011.t: "Země mléka a medu"
 ep3_laamp_flavour_ewan.4011.desc: "Na světě je mnoho drsných a nehostinných míst.\n\n[current_county.GetBaseNameNoTier] mezi ně nepatří.\n\nZdejší štědrá země naopak plodí štědré lidi a potravu lze najít téměř bez námahy. Napětí polevuje a jídlo pro celou družinu se alespoň na čas přestává zdát jako problém. Jak nečekaná #EMP blaženost#!."
 ep3_laamp_flavour_ewan.4011.a: "Vychutnám si plody hojnosti."
 ep3_laamp_flavour_ewan.4021.t: "Žízeň"
 ep3_laamp_flavour_ewan.4021.desc: "Už několik dní se táboru nedaří najít spolehlivý zdroj vody.\n\nBez jídla se člověk nějakou dobu obejde. Kručení v žaludku tě může zabíjet celé týdny.\n\nBez vody je to jiné. Nikde na dohled není nic, kde bychom mohli doplnit zásoby, a ty, které vezeme s sebou, rychle docházejí. Žízeň nám hrozí mnohem #EMP rychlejším#! koncem."
