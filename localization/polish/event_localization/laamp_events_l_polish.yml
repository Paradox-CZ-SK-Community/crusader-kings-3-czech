 ep3_laamp_flavour_ewan.4031.t: "Nemoc ve stádě"
 ep3_laamp_flavour_ewan.4031.desc: "Není pochyb: ať už za to může počasí, krajina, přetěžování nebo prostě jen smůla, mezi táborovými soumary se rozšířila nějaká choroba.\n\nSténají, hýkají a stále ještě kráčejí, ale s každou hodinou jsou pomalejší a malátnější, natož s každým dalším dnem.\n\nNěkteří koně mají očividnou horečku a jedna ze starších mul vypadá na umření. Pokud se nemoc rozšíří dál, bude zle."
 ep3_laamp_flavour_ewan.4031.a: "Přece je dokážeme vyléčit?"
 ep3_laamp_flavour_ewan.4031.a.tt.success: "Podaří se ti nemoc léčit"
