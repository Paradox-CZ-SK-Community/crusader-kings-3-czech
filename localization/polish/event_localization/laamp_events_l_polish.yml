l_polish:
 ep3_laamps.0001.t.female: "Bývalá [lost_primary_title.Custom('GetTierBaseTitleFemale')]"
 ep3_laamps.0001.t.male: "Bývalý [lost_primary_title.Custom('GetTierBaseTitleMale')]"
 ep3_laamps.0001.intro: "Hanebná, potupná porážka!"
 ep3_laamps.0001.memory: "Tahle zatracená válka — [war_memory.MakeScope.Var('war_cb').GetFlagName] — mě připravila o všechno!"
 ep3_laamps.0001.fallback: "Tahle zatracená válka mě připravila o všechno!"
 ep3_laamps.0001.desc: "Teď bloudím divočinou, zatímco [winner.GetTitledFirstName] se svými vojáky slaví vítězství!\n\nUž mi nepatří [lost_primary_title.GetAdjectiveNoTooltip] trůn... [lost_primary_title.GetTierAsNameNoTooltip] je teď v rukou nepřítele a [winner.GetTitledFirstName], [winner.Custom('PersonalityGetNegativeTraitDesc')] [winner.Custom2('InsultNoun', ROOT.Char)], se možná právě teď chlubí regáliemi, které patřily #EMP mně#!!"
 ep3_laamps.0001.a: "Jednoho dne své země #EMP získám#! zpět!"
 ep3_laamps.0001.b: "[alt_1.GetFirstNameNoTooltipRegnal] zdědí vše."
 target_character_government: "[Concept('government','Vláda')|E]: [TARGET_CHARACTER.GetGovernment.GetName]"
 target_character_independent: "[Concept('independent_ruler','Nezávislý vládce')|E]"
 target_character_liege: "[Select_CString(TARGET_CHARACTER.IsIndependentRuler, 'Bez lenního pána', 'Lenní pán: ')][Select_CString(TARGET_CHARACTER.IsIndependentRuler, "", TARGET_CHARACTER.GetLiege.GetName)]"
 ep3_laamps.0001.c: "[alt_2.GetFirstNameNoTooltipRegnal] musí utvářet budoucnost našeho rodu."
 ep3_laamps.0001.d: "[alt_3.GetFirstNameNoTooltipRegnal] je teď naší nadějí."
 ep3_laamps.0001.e: "Ten čas už minul..."
 ep3_laamps.0003.opening: "[adventurer.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_laamps.0003.desc: "Ty a tvé odporné hordy jste mě možná připravili o vládu. [lost_primary_title.GetTierAsNameNoTooltip|l] je teď ve vašich rukou, ale zapamatuj si: můj boj ještě neskončil! [lost_primary_title.GetBaseNameNoTierNoTooltip] mi ještě může znovu patřit!"
 ep3_laamps.0003.a: "Ha! Ten hlupák má kuráž!"
 ep3_laamps.0004.desc: "Ti zatracení zrádci mě připravili o vládu a vyhnali do divočiny, zatímco [winner.GetTitledFirstName] se svými vojáky slaví vítězství a mé místo zaujímá [heir.GetTitledFirstName]!\n\nOdpadlíci a lháři mě připravili o [conquered.GetAdjectiveNoTooltip] trůn... Opravdu si s námi [ROOT.Char.GetFaith.FateGodName] jen pohrává..."
 lose_all_prestige_tt: "Ponecháš si nejvýše #V 100#! [prestige_i][Concept('prestige','prestiže')|E]"
 lose_all_prestige_level_tt: "Ztratíš #value 3#! [Concept('prestige_levels','úrovně slávy')|E]"
 ep3_laamps.0010.t: "[potential_laamp.Custom('GetDaughterSon')|U] na vedlejší koleji: [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 ep3_laamps.0010.single: "[Select_CString(potential_laamp.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))] [potential_laamp.GetFirstName] se mnou"
 ep3_laamps.0010.multi: "Mí sourozenci se mnou"
 ep3_laamps.0010.desc: " truchlí. [deceased.GetTitledFirstNameRegnal], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('deceased'))], už není mezi námi, a tak se zaměstnáváme dělením pozůstalých zemí.\n\nDědictví se dělí takto: [inherited.GetBaseNameNoTierNoTooltip] budu mít já,"
 ep3_laamps.0010.inheritor_1: " [inherited_1.GetBaseNameNoTierNoTooltip] získává [inheritor_1.GetFirstName];"
 ep3_laamps.0010.inheritor_2: " [inherited_2.GetBaseNameNoTierNoTooltip] získává [inheritor_2.GetFirstName];"
 ep3_laamps.0010.inheritor_3: " [inherited_3.GetBaseNameNoTierNoTooltip] získává [inheritor_3.GetFirstName];"
 ep3_laamps.0010.connector: "a"
 ep3_laamps.0010.laamp: " ale co [potential_laamp.GetFirstName], [potential_laamp.Custom('PersonalityGetPositiveTraitDesc')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))]?\n\n[potential_laamp.GetFirstName] odchází s prázdnýma rukama a přechod moci sleduje z povzdálí: žádný obřad, žádné pocty, jen přísahy jiným. Urozená krev a meč po boku jsou jediným dědictvím, které zbývá."
 ep3_laamps.0010.a: "Běda, ne každému je souzeno vládnout..."
 ep3_laamps.0010.b: "...ale [potential_laamp.GetFirstNameNoTooltip] má svobodu, kterou [Select_CString(potential_laamp.IsFemale, 'jí', 'mu')] závidím."
 ep3_laamps.0020.t: "[revoked.GetAdjectiveNoTooltip] exil"
 ep3_laamps.0020.desc: "V jediném okamžiku je všechno pryč: [revoked.GetTierAsNameNoTooltip|l], mé tituly, má důstojnost...\n\nTen proradný pes [banisher.GetTitledFirstName] očekává, že budu vděčný za holý život a pouhé vyhnanství z [banisher.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! I hlupák ví, že vyhnanství může být osudem #EMP horším#! než smrt..."
 ep3_laamps.0020.a: "Svého práva se tak snadno nevzdám! [revoked.GetBaseNameNoTierNoTooltip] mi ještě může znovu patřit!"
 ep3_laamps.0022.desc: "Za mou svobodu jsi získal jedno: [revoked.GetTierAsNameNoTooltip|l]. Jenže ten titul — [revoked.GetBaseNameNoTier] — nebyl tvůj a na svůj nárok nedám zapomenout.\n\nMožná přijde den, kdy se naše role obrátí a tvůj život bude v #EMP mých#! rukou."
 ep3_laamps.0022.a: "Odvážně štěká, ale kousnout nedokáže."
 ep3_laamps.0030.t: "[old_primary_title.GetBaseNameNoTierNoTooltip] zůstává za mnou"
 ep3_laamps.0030.desc: "[old_capital_province.GetNameNoTooltip] a můj dosavadní život tam konečně zůstávají za mnou — všechny okázalosti, malicherné povinnosti i každodenní dřina. [old_capital_province.Custom('GetTerrainTypePlural')|U] se stanou místem, kde rozbiju svůj tábor!\n\nPřidávají se ke mně nejvěrnější sluhové a následovníci, každý s poněkud jinou mírou nadšení pro nový život v divočině.\n\n"
 ep3_laamps.0030.heir: "Mé tituly místo mě přebírá [laamp_inheritor.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('laamp_inheritor'))] a [Select_CString(laamp_inheritor.IsFemale, 'má dědička', 'můj dědic')]. Nově nese titul [laamp_inheritor.GetTitleAsNameNoTooltip] — [laamp_inheritor.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 ep3_laamps.0030.liege: "Mé někdejší panství přebírá [laamp_inheritor.GetTitledFirstName]. Mé rozhodnutí ukončit dosavadní službu přijímá bez námitek."
 ep3_laamps.0030.new: "Místo mě se vlády ujímá [laamp_inheritor.GetFirstName], volba místní šlechty."
 ep3_laamps.0030.a: "Tak na co ještě čekáme?"
 ep3_laamps.0032.opening: "[adventurer.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_laamps.0032.desc: "Volá mě vzrušující život na cestách po světě. Po dlouhém zvažování ti přenechávám své země, abys je mohl považovat za vlastní. [old_primary_title.GetBaseNameNoTierNoTooltip] brzy zůstane za mými zády a já vyrazím na širou cestu."
 ep3_laamps.0032.a: "Odvážný krok. Někdo by řekl, že pošetilý."
 ep3_laamps.0040.t: "Z bohatství do bídy"
 ep3_laamps.0040.family: "Jak se [Select_CString(actor.IsFemale, 'má', 'můj')] [actor.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))]"
 ep3_laamps.0040.other: "Jak se [Select_CString(actor.IsFemale, 'má', 'můj')] [actor.Custom2('InsultAdjective', ROOT.Char)] [Select_CString(actor.IsFemale, 'lenní paní', 'lenní pán')]"
 ep3_laamps.0040.desc: " opovažuje! Mé tituly propadly! Země jsou pryč! Postavení v troskách!\n\nChci-li ubránit a znovu získat, co mi právem patří — nemluvě o vlastní cti — nezbývá než začít úplně odspodu!\n\n[actor.GetTitledFirstName] za svou chamtivost zaplatí, ať je cesta jakkoli dlouhá..."
 ep3_laamps.0040.a: "[actor.GetFirstNameNoTooltip] za tohle zaplatí."
 ep3_laamps.0042.desc: "Kvůli tvému rozhodnutí mi nezbývá na vybranou. [landed_title.GetTierAsNameNoTooltip|l] je pryč a já musím přijmout život dobrodruha.\n\nMůj boj však nekončí a svůj oprávněný nárok nezapomenu. [landed_title.GetNameNoTierNoTooltip] mi ještě může znovu patřit!"
 ep3_laamps.0042.a: "[actor.GetFirstNameNoTooltip] vydrží nanejvýš dva týdny."
 ep3_laamps.0050.t: "Vlastní cestou"
 ep3_laamps.0050.desc: "[potential_laamp.GetFirstName] je [Select_CString(potential_laamp.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('potential_laamp'))] a v poslední době je stále neklidnější. Sotva mě proto překvapí, když si mě jednoho večera odchytí, zatímco společně hledíme do kraje kolem [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip].\n\n„[potential_laamp.Custom2('RelationToMeShort', ROOT.Char)|U],“ povzdechne si [potential_laamp.GetFirstName] zasněně při pohledu k obzoru, „už mám dost [ROOT.Char.Custom('ResidenceBuildingPlural')]. Chci vyrazit #EMP tam ven#! a spatřit svět! Chci v něm zanechat #EMP vlastní#! stopu.“\n\n[potential_laamp.GetFirstName] působí skutečně odhodlaně a překypuje nadšením, jaké tu už dlouho nebylo."
 ep3_laamps.0050.a: "Rod [ROOT.Char.GetHouse.GetBaseNameNoTooltip] na tebe může být hrdý!"
 ep3_laamps.0050.b: "Jestli musíš jít, nebudu tě tu držet."
 ep3_laamps.0050.c: "Nebuď směšný!"
 ep3_laamps.0051.desc: "Když příštího rána vstanu, včerejší hádka mi stále leží v hlavě. Pak se dozvím, že [potential_laamp.GetFirstName], [Select_CString(potential_laamp.IsFemale, 'ta', 'ten')] [potential_laamp.Custom('PersonalityGetNegativeTraitDesc')] [Select_CString(potential_laamp.IsFemale, 'potvora', 'spratek')], přes noc [Select_CString(potential_laamp.IsFemale, 'zmizela', 'zmizel')]!\n\nNavzdory mému výslovnému zákazu se [Select_CString(potential_laamp.IsFemale, 'vydala', 'vydal')] do divočiny, aby se přidala[Select_CString(potential_laamp.IsFemale, '', '')] k bandě ničemů!"
 ep3_laamps.0051.a: "To drzé děcko..."
 ep3_laamps.0051.b: "...má ale kuráž!"
 allowed_runaway_laamp_opinion: "Povolení k dobrodružství"
 forbidden_runaway_laamp_opinion: "Zákaz dobrodružství"
 ep3_laamps.0100.t: "Všechno má svou cenu"
 ep3_laamps.0100.desc: "Sotva jsem mohl uvěřit, že [recipient.GetTitledFirstName] mou nabídku přijal[Select_CString(recipient.IsFemale, 'a', '')]. Konečně budu mít vlastní [ROOT.Char.Custom('FortifiedBuilding')|l] — se střechou a čtyřmi pevnými zdmi!\n\nNově budu vládnout jako [ROOT.Char.GetTitleAsNameNoTooltip] a připadne mi [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
 ep3_laamps.0100.desc_nomadic: "Sotva jsem mohl uvěřit, že [recipient.GetTitledFirstName] mou nabídku přijal[Select_CString(recipient.IsFemale, 'a', '')]. Konečně budu mít vlastní země a místo, kde se mohou pást má stáda!\n\nNově budu vládnout jako [ROOT.Char.GetTitleAsNameNoTooltip] a připadne mi [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier],"
 ep3_laamps.0100.fellow_vassal: " přičemž stejně jako dosud budu vazalem [new_liege.GetName] a svému novému lennímu pánovi budu zavázán i podřízen."
 ep3_laamps.0100.liege: " přičemž se stanu vazalem svého nového lenního pána a budu mu zavázán i podřízen."
 ep3_laamps.0100.independent: " a nad touto někdejší zemí svého protějšku budu vládnout jako nad vlastním lénem!"
 ep3_laamps.0100.unpopular: "\n\nTak rychlý vzestup mezi mocné však jistě popudil nejednoho zdejšího pána i paní..."
 ep3_laamps.0100.fallback: "\n\nByla to dlouhá cesta, ale konečně mohu nechat táborové lehátko za sebou..."
 ep3_laamps.0100.a: " Ha — a pak že se „šlechtictví nedá koupit“!"
 ep3_laamps.0101.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 ep3_laamps.0101.desc: "Velmi mě potěšilo, že jsi mou nabídku přijal[Select_CString(recipient.IsFemale, 'a', '')]!\n\nZlato už je na cestě a já se chystám usadit v [new_primary_title.GetPreferredCapital.GetName]"
 ep3_laamps.0101.fellow_vassal: " jako další vazal [new_liege.GetName]."
 ep3_laamps.0101.liege: " jako tvůj pokorný vazal."
 ep3_laamps.0101.independent: " a vládnout odtud svému vlastnímu lénu."
 ep3_laamps.0101.a: "[actor.GetFirstNameNoTooltip] by měl[Select_CString(actor.IsFemale, 'a', '')] znát své místo."
 ep3_laamps.0101.b: "Snad to nebyla chyba."
 ep3_laamps.0101.c: "Snad jsme uzavřeli poctivý obchod."
 ep3_laamps.0101.liege_message.title: "Vazal prodal půdu"
 ep3_laamps.0102.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
 ep3_laamps.0102.desc: "To je ale směšná nabídka. Opravdu si myslíš, že bych prodal své tituly? A ještě někomu, jako jsi #EMP ty?!#!"
 ep3_laamps.0102.a: "Nemusíš být hrubý."
 ep3_laamps.0200.opening: "[recipient.Custom2('AppropriateGreeting', actor)]"
 ep3_laamps.0200.desc: "Dobrá tedy. Pomohu ti s invazí do [secondary_recipient.GetPrimaryTitle.GetNameNoTierNoTooltip], kterému vládne [secondary_recipient.GetTitledFirstName], pokud mi odpřisáhneš věrnost, zvítězíš-li."
 ep3_laamps.0200.a: "Výborně!"
 ep3_laamps.0201.opening: "[recipient.Custom2('AppropriateGreeting', actor)]"
 ep3_laamps.0201.desc: "Tvůj návrh jsem velmi pečlivě zvážil, ale dospěl jsem k závěru, že tvé věci nyní nemohu poskytnout svou pomoc."
 ep3_laamps.0201.a: "[recipient.GetFirstNameNoTooltip] mi stejně není k ničemu..."
 ep3_laamps.0300.t: "...a nepřátele ještě blíž"
 ep3_laamps.0300.desc: "Nervózně jsem čekal na odpověď [recipient.GetFirstName] na svou nabídku a nedokážu skrýt úlevu, když na listině spatřím souhlas.\n\nJe tedy rozhodnuto: [recipient.GetFirstName] bude nově vládnout jako [recipient.GetTitleAsNameNoTooltip] a připadne [Select_CString(recipient.IsFemale, 'jí', 'mu')] [recipient.GetPrimaryTitle.GetNameNoTier],"
 ep3_laamps.0300.fellow_vassal: " přičemž bude stejně jako já vazalem [new_liege.GetName]."
 ep3_laamps.0300.liege: " přičemž mi bude sloužit jako vazal — pokud ovšem zůstane poslušný[Select_CString(recipient.IsFemale, 'á', '')]."
 ep3_laamps.0300.independent: " a nad zeměmi, na které si činí právo, bude vládnout jako nad vlastním lénem!"
 ep3_laamps.0300.unpopular: "\n\nTak rychlý vzestup mezi místní šlechtu však jistě vzbudí nejedno pozdvižené obočí..."
 ep3_laamps.0300.fallback: "\n\nSnad se konečně mohu věnovat naléhavějším záležitostem..."
 ep3_laamps.0300.a: "Tímhle to snad konečně skončí."
 ep3_laamps.0301.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 ep3_laamps.0301.desc: "Jsem rád, že jsi dostal[Select_CString(recipient.IsFemale, 'a', '')] rozum, a věřím, že tím naše spory končí.\n\n[new_primary_title.GetPreferredCapital.GetNameNoTier] je připraveno na tvůj příjezd. Odtud budeš vládnout"
 ep3_laamps.0301.fellow_vassal: " jako další vazal [new_liege.GetName]."
 ep3_laamps.0301.liege: " jako můj vazal."
 ep3_laamps.0301.independent: " svému vlastnímu lénu."
 ep3_laamps.0301.a: "Jsem ti k službám."
 ep3_laamps.0301.b: "Jak vysoko se může povznést ten, kdo padl!"
 ep3_laamps.0301.c: "Konečně [ROOT.Char.GetTitleAsNameNoTooltip]."
 ep3_laamps.0301.liege_message.title: "Vazal usadil dobrodruha"
 ep3_laamps.0302.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor)]"
 ep3_laamps.0302.desc: "Myslíš, že mě tak snadno podplatíš těmi ubohými tituly? Pokud je mám získat, vezmu si je od tebe mečem."
 ep3_laamps.0302.a: "Ach! Ten zatracený nýmand!"
 ep3_laamps.0800.t: "Na rozcestí"
 ep3_laamps.0800.inherited: "Posel přinesl závažnou zprávu: mým dědictvím se stává [new_title.GetBaseNameNoTier] spolu s přilehlými územími. [Select_CString(previous_holder.IsFemale, 'Zanechala', 'Zanechal')] mi je [previous_holder.GetFullName]..."
 ep3_laamps.0800.abdication: "Posel přinesl závažnou zprávu: [previous_holder.GetFullName] [Select_CString(previous_holder.IsFemale, 'abdikovala', 'abdikoval')] a mým dědictvím se stává [new_title.GetBaseNameNoTier] spolu s přilehlými územími..."
 ep3_laamps.0800.granted: "Posel přinesl závažnou zprávu: nově mi náleží [new_title.GetBaseNameNoTier] i přilehlá území. Tak [Select_CString(new_liege.IsFemale, 'rozhodla', 'rozhodl')] [new_liege.GetTitledFirstName]..."
 ep3_laamps.0800.election: "Posel přinesl závažnou zprávu: šlechta mě zvolila k vládě a nyní mi náleží [new_title.GetBaseNameNoTier] i přilehlá území..."
 ep3_laamps.0800.faction: "Posel přinesl závažnou zprávu: šlechta rozhodla, že vláda nad [new_title.GetBaseNameNoTier] a přilehlými územími přechází na mě. [previous_holder.GetFullName] [Select_CString(previous_holder.IsFemale, 'přišla', 'přišel')] o moc..."
 ep3_laamps.0800.claim_war: "Konečně je [previous_holder.GetTitledFirstName] [Select_CString(previous_holder.IsFemale, 'poražena', 'poražen')] a mé právoplatné země jsou znovu mé. [new_title.GetBaseNameNoTier] je teď v mých rukou a jeho budoucnost závisí na mně..."
 ep3_laamps.0800.holy_war: "Konečně je [previous_holder.GetTitledFirstName] [Select_CString(previous_holder.IsFemale, 'poražena', 'poražen')]. Jméno [ROOT.Char.GetFaith.HighGodName] provázelo celé tažení a země nepřítele jsou nyní mé. [new_title.GetBaseNameNoTier] je teď v mých rukou a jeho budoucnost závisí na mně..."
 ep3_laamps.0800.conquest: "Konečně je [previous_holder.GetTitledFirstName] [Select_CString(previous_holder.IsFemale, 'poražena', 'poražen')] a dosavadní země nepřítele jsou mé. [new_title.GetBaseNameNoTier] je teď v mých rukou a jeho budoucnost závisí na mně..."
 ep3_laamps.0800.vassal: "\n\nJe mi tedy souzeno přijmout vládu a přesídlit tam, kde leží [new_capital.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], a jako [ROOT.Char.GetLadyLord] vstoupit do lenního svazku, v němž [new_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] trůn nade mnou drží [new_liege.GetTitledFirstNameRegnal]?"
 ep3_laamps.0800.independent: "\n\nJe mi tedy souzeno přijmout vládu a přesídlit tam, kde leží [new_capital.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip], a jako [ROOT.Char.GetLadyLord] vládnout z vlastního práva?"
 ep3_laamps.0800.desc: "\n\nŽivot na cestách je jistě plný strastí a nebezpečí, ale ta svoboda! Nemohu popřít, jak lákavé je žít bez nesčetných povinností, které s sebou vláda přináší.\n\n"
 ep3_laamps.0800.a: "Ano, je čas nechat tábor za sebou..."
 ep3_laamps.0800.a.tt: "#mixed_value #BER [THIS.Char.GetShortUIName|U] získá postavení [Concept('landed','zeměpána')|E], tedy [Concept('ruler','vládce')|E] s vlastní zemí#!#!"
 ep3_laamps.0800.b: "Cesta mě volá: vlády se ujme [alt_1.GetFirstNameNoTooltip], [Select_CString(alt_1.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_1'))]!"
 ep3_laamps.0800.b.claimant: "Cesta mě volá: ať [alt_1.GetFirstNameNoTooltip] uplatní svůj nárok!"
 ep3_laamps.0800.c: "Vládu převezme [alt_2.GetFirstNameNoTooltip], [Select_CString(alt_2.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_2'))]. [new_title.GetBaseNameNoTierNoTooltip] tak bude v dobrých rukou."
 ep3_laamps.0800.c.claimant: "Svěřím je tomu, komu právem náleží: [alt_2.GetFirstNameNoTooltip]!"
 ep3_laamps.0800.d: "[alt_3.GetFirstNameNoTooltip], [Select_CString(alt_3.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('alt_3'))], se ujme vlády — [new_title.Custom('GetTierBase')|l] bude v dobrých rukou!"
 ep3_laamps.0800.d.claimant: "[alt_3.GetFirstNamePossessiveNoTooltip] nárok má mou podporu!"
 ep3_laamps.0800.e: "Těchto zemí se vzdávám. Ať je získá někdo jiný!"
 ep3_laamps.0800.e.liege: "Těchto zemí se vzdávám. Ať je získá [new_liege.GetTitleAsNameNoTooltip]!"
 ep3_laamps.0800.claim.tt: "@warning_icon! #N Přijdeš o všechny [Concept('claims','nároky')|E] na [Concept('titles','tituly')|E], kterých ses vzdal#!"
 renounced_land_to_me_opinion: "Vzdal se titulů v můj prospěch"
 renounced_land_to_weaker_claim_opinion: "Vzdal se titulů ve prospěch slabšího pretendenta"
 renounced_land_to_other_opinion: "Vzdal se titulů ve prospěch někoho jiného"
 renounced_land_outside_family_opinion: "Vzdal se titulů mimo rodinu"
 adventurer_titles_renounced_title: "Vzdání se titulů"
 adventurer_titles_renounced_to_me_desc: "[adventurer.GetFirstName] se [Select_CString(adventurer.IsFemale, 'vzdala', 'vzdal')] svých nových [Concept('titles','titulů')|E], aby dál [Select_CString(adventurer.IsFemale, 'žila', 'žil')] jako [Concept('adventurer',Select_CString(adventurer.IsFemale, 'dobrodružka', 'dobrodruh'))|E]"
 adventurer_titles_renounced_by_me_desc: "Mé nové [Concept('titles','tituly')|E] získává [beneficiary.GetTitledFirstName]"
 ep3_laamps.1001.t: "Cesty, po nichž kráčíme"
 ep3_laamps.1001.desc.intro: "Cesta přede mnou se vine dál a dál jako osamělá nit směřující ke vzdálenému obzoru.\n\nMůj tábor je... tichý. Jen několik roztroušených stanů a soumaři líně zívající ve větru. Cizinci a různí příživníci vstávají s novým dnem a neochotně se chystají na ranní povinnosti.\n\nVětšina z nich je jen náhodná sebranka, která se k lidem na cestách přidává a zase je opouští s každou další osadou."
 ep3_laamps.1001.desc.blind: "Jen málokterý hlas poznávám natolik, aby mi patřil někdo víc než letmý známý."
 ep3_laamps.1001.desc.at_least_one_working_eye: "Jen málokterá tvář mi připadá skutečně známá, alespoň natolik, aby patřila někomu víc než letmému známému."
 ep3_laamps.1001.a: "Naštěstí ti, které znám, si umějí dobře povídat."
 ep3_laamps.1001.a.tt: "Začínáš se dvěma [Concept('followers','družiníky')|E] zběhlými v [Concept('diplomacy','diplomacii')|E]"
 ep3_laamps.1001.b: "Jednou z nás bude armáda."
 ep3_laamps.1001.b.tt: "Začínáš se dvěma [Concept('followers','družiníky')|E] zběhlými ve [Concept('martial','válečnictví')|E]"
 ep3_laamps.1001.c: "S těmito lidmi vybuduji říši."
 ep3_laamps.1001.c.tt: "Začínáš se dvěma [Concept('followers','družiníky')|E] zběhlými ve [Concept('stewardship','správcovství')|E]"
 ep3_laamps.1001.d: "Hm, a v noci se dokonce nic neztratilo."
 ep3_laamps.1001.d.tt: "Začínáš se dvěma [Concept('followers','družiníky')|E] zběhlými v [Concept('intrigue','pletichářství')|E]"
 ep3_laamps.1001.e: "Alespoň že máme pár učenců — jméno [ROOT.Char.GetFaith.KnowledgeGodName] budiž velebeno!"
 ep3_laamps.1001.e.tt: "Začínáš se dvěma [Concept('followers','družiníky')|E] zběhlými v [Concept('learning','učenosti')|E]"
 ep3_laamps.1001.f: "Alespoň pár z nich se umí pořádně ohánět."
 ep3_laamps.1001.f.tt: "Začínáš se dvěma [Concept('followers','družiníky')|E] zběhlými v [Concept('prowess','udatnosti')|E]"
 ep3_laamps.1001.g: "Zatím se ke mně nepřidal nikdo, koho by stálo za to mít po boku."
 ep3_laamps.1001.g.tt.followers: "Začínáš bez vygenerovaných [Concept('followers','družiníků')|E] — pouze s tou [Concept('family','rodinou')|E] a [Concept('friends','přáteli')|E], které už máš"
 ep3_laamps.1001.g.tt.difficulty: "@alert_icon! #alert_trial Dokud nezískáš [Concept('followers','družiníky')|E], mohou pro tebe být [Concept('task_contracts','zakázky')|E] obtížné, nebo dokonce nesplnitelné#!"
 ep3_laamps.1011.t: "Přísaha při meči"
 ep3_laamps.1011.desc.four_plus_titles: "„...a přísahám, že navždy budu hájit vaše práva na všechna panství, která vám právem náležejí: [title_1.GetNameNoTier], [title_2.GetNameNoTier], [title_3.GetNameNoTier] i jakékoli další,“ "
 ep3_laamps.1011.desc.three_titles: "„...a přísahám, že navždy budu hájit vaše právo vládnout přirozeným panstvím: [title_1.GetNameNoTier], [title_2.GetNameNoTier] a [title_3.GetNameNoTier],“ "
 ep3_laamps.1011.desc.two_titles: "„...a přísahám, že navždy budu hájit vaše práva na obě panství: [title_1.GetNameNoTier] i [title_2.GetNameNoTier],“ "
 ep3_laamps.1011.desc.one_title: "„...a přísahám, že navždy budu hájit vaše právo na jediné právoplatné panství: [title_1.GetNameNoTier],“ "
 ep3_laamps.1011.desc.midtro: "prohlašuje [recipient.Custom2('MyCharacterIntroduction', actor)].\n\nPo dokončení dlouhé a spletité přísahy zůstává [recipient.GetFirstNameNoTooltip] s hlavou uctivě skloněnou a čeká na mou odpověď.\n\n"
 ep3_laamps.1011.desc.prior_swords: "Další zdatná paže přísahala sloužit mé věci"
 ep3_laamps.1011.desc.first_sword: "První zdatná paže mi tak oddaně přísahala"
 ep3_laamps.1011.desc.outro: " — taková věrnost je nade vší pochybnost — a zbývá jediná otázka: kolik věrnosti chci na oplátku dát #EMP já#!?"
 ep3_laamps.1011.a: "Jako [recipient.Custom('SisterBrother')] budeš mít u mého stolu vždy místo."
 ep3_laamps.1011.b: "Kéž si mým vítězstvím získám tvou věrnost, [recipient.GetFirstNameNoTooltip]."
 ep3_laamps.5000.t: "Prázdné bedny"
 ep3_laamps.5000.desc: "Smutně hledím na své jídlo. Sotva zralé jablko je z celé té nabídky ještě to nejlákavější.\n\n"
 ep3_laamps.5000.provisionslow: "Naše zásoby se dál tenčí a začíná jít do tuhého. Celým táborem se ozývá kručení žaludků a na opascích nám už téměř nezbývají dírky, o které bychom je mohli utáhnout."
 ep3_laamps.5000.provisionsok: "Jídla je v táboře dost, ale rozmanitost mu zoufale chybí. Vadnoucí zeleniny máme spoustu, zato kus pořádného masa by mi přišel vhod."
 ep3_laamps.5000.ending: "\n\n[hunter.GetFirstName] vyskočí na nohy, luk v ruce, a sáhne po toulci.\n\n„Už toho mám dost. Tady sice vládne [local_lord.GetTitledFirstName], ale snad se obejde bez pár soust ze svého blahobytu.“"
 ep3_laamps.5000.a: "Bez dovolení se pytlačit nebude."
 ep3_laamps.5000.a.tt: "Pošlu dopis se žádostí o právo lovit."
 ep3_laamps.5000.a.success: "[local_lord.GetFirstNameNoTooltip] souhlasí"
 ep3_laamps.5000.a.failure: "[local_lord.GetFirstNameNoTooltip] požaduje platbu za právo lovit"
 ep3_laamps.5000.a.critfailure: "[local_lord.GetFirstNameNoTooltip] odmítá"
 ep3_laamps.5000.b: "Rychle a potichu."
 ep3_laamps.5000.b.success: "[hunter.GetFirstNameNoTooltip] loví bez povšimnutí"
 ep3_laamps.5000.b.failure: "Pytláctví neunikne pozornosti: [hunter.GetFirstNameNoTooltip] musí zaplatit pokutu a přijde o polovinu úlovku"
 ep3_laamps.5000.b.critfailure: "[hunter.GetFirstNameNoTooltip] skončí ve vězení"
 ep3_laamps.5000.c: "Nemůžeme to riskovat. Místo toho nasbírej nějaké bobule."
 ep3_laamps.5000.c.success: "[hunter.GetFirstNameNoTooltip] přinese trochu bobulí"
 ep3_laamps.5000.c.failure: "Keře jsou úplně otrhané"
 ep3_laamps.5005.t: "Zbožná návštěva"
 ep3_laamps.5005.desc: "Táborový oheň praská a jeho světlo ozáří kohosi, kdo vstupuje do našeho kruhu. Navzdory pozdní hodině kráčí návštěvník rázně a v ruce svírá poutnickou hůl. Stráže už vyrážejí naproti, ale gestem je zastavím.\n\n„Najde se u vás místo pro člověka, kterého sem vede [priest.GetFaith.HighGodName]?“ [priest.GetFirstNameNoTooltip] se na mě nadějně usměje a špinavé šaty zašustí v prudkém větru. Tak tedy [ROOT.Char.GetFaith.PriestNeuter|l] na cestách!\n\n"
 ep3_laamps.5005.samefaith: "[ROOT.Char.GetFaith.GetAdjective] svět takové poutníky dobře zná. Putující kazatelé nesou své učení do každého koutu světa a v jejich kázáních zní [priest.GetFaith.HighGodName] všude, kam přijdou."
 ep3_laamps.5005.difffaith: "[ROOT.Char.GetFaith.PriestNeuter|U] to možná je, ale [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.GetFaith.PriestNeuter|l] rozhodně ne. To poznám na první pohled. Několik mých souvěrců si při stejném zjištění začne rozpačitě přešlapovat."
 ep3_laamps.5005.a: "Někdo s takovým rozhledem by se nám hodil..."
 ep3_laamps.5005.a.success: "[priest.GetFirstNameNoTooltip] souhlasí, že nějakou dobu zůstane"
 ep3_laamps.5005.a.failure: "[priest.GetFirstNameNoTooltip] má plány daleko za hranicemi našeho tábora"
 ep3_laamps.5005.b: "„Posaď se, zůstaň přes noc a vyprávěj nám své příběhy!“"
 ep3_laamps.5005.c: "„Musím tě požádat, abys odešel.“"
 ep3_laamps.5005.c.tt: "Místa je zkrátka příliš málo: nikdy bych kvůli cizinci nepřipravil nikoho ze svých o lůžko!"
 ep3_laamps.5005.d: "„Táhni! Takové, jako jsi ty, tu nechceme!“"
 every_non_faith_follower: "Každý [Concept('follower','družiník')|E], který nevyznává [priest.GetFaith.GetName]"
 ep3_laamps.5010.t: "Bolesti a neduhy"
 ep3_laamps.5010.desc: "#EMP Uf!#!\n\nTakové zvuky ze mě poslední dobou vycházejí pokaždé, když si večer sedám k táborovému ohni. Starší lidé vždycky říkají, že to přichází s věkem, ale mně je teprve [ROOT.Char.GetAge]...\n\nNe. Tohle je daň za drsný život na cestách. Vidím, jak se podepisuje i na ostatních: [follower.GetName] sebou při usedání vedle mě trochu škubne bolestí."
 ep3_laamps.5010.a: "Ten hostinec, kolem kterého jsme prošli, měl spoustu volných lůžek..."
 ep3_laamps.5010.b: "Má ubohá záda si žádají trochu většího pohodlí."
 ep3_laamps.5010.b.tt: "Se slevou vylepšíš [Concept('building','budovu')|E] *$camp_main_01_domicile_building$*"
 ep3_laamps.5010.c: "Musíme pokračovat."
 ep3_laamps.5010.c.success: "Tvé tělo si zvykne"
 ep3_laamps.5010.c.failure: "Nadále trpíš"
 ep3_laamps.5015.t: "Hladovějící vojáci"
 ep3_laamps.5015.desc: "Do tábora se přivrávorá špinavá a unavená osoba, které by pořádné jídlo očividně přišlo vhod. „Jmenuji se [knight.GetFirstName],“ zazní po chvíli.\n\n„Je nás víc,“ [knight.GetFirstNameNoTooltip] ukáže do dálky, „po každé bezvýznamné válce nás nechají napospas osudu. Ruce nám stále dovedou vládnout mečem stejně dobře jako dřív, ale nezbývá nám než bloudit krajem a hladovět.“\n\n„Jsme poslední, kdo ještě neokrádá bezbranné o jídlo a cennosti.“ [knight.GetFirstNameNoTooltip] navzdory zbědovanému vzhledu pohlédne s odhodláním. „Raději zemřu.“"
 ep3_laamps.5015.a: "Máš lepší svědomí než já. A méně rozumu."
 ep3_laamps.5015.a.tt: "Vezmeš si každou poslední minci i cetku, kterou [knight.GetFirstNameNoTooltip] vlastní."
 ep3_laamps.5015.b: "Říkáš, že je vás víc?"
 ep3_laamps.5015.c: "Další čepel by se nám hodila..."
 ep3_laamps.5015.c.success: "Zpráva o tvé štědrosti se rozšíří"
 ep3_laamps.5015.d: "Pojď, posaď se a zotav se. Jez."
 ep3_laamps.5020.t: "Neznámá kuchyně"
 ep3_laamps.5020.desc: "[location.GetName] je pro mě cizí kraj a zdejší zvyky jsou mi stejně neznámé. Zvlášť názorně se to ukáže, když mě [cook.GetFirstName], který má dnes na starosti vaření, přivolá k bublajícímu kotlíku.\n\n„Je to místní recept,“ začne [cook.GetFirstNameNoTooltip], „prý ho tak #EMP skutečně#! připravuje [local_culture.GetName] kultura. Alespoň mě o tom ujistil jeden projíždějící kupec.“\n\nPodezřívavě si obsah kotlíku prohlížím. Je to snad... [cook.Custom('GetRandomRegionalSmallGame')]? A k tomu #EMP [cook.Custom('RegionalRootVegetablePlural')]?!#!"
 ep3_laamps.5020.tt: "Vyžaduje jeden z rysů: [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )], [GetTrait('eccentric').GetName( GetNullCharacter )] nebo [GetTrait('gluttonous').GetName( GetNullCharacter )]"
 ep3_laamps.5020.a: "...možná tomu chybí ještě něco trochu #EMP zvláštního#!."
 ep3_laamps.5020.a.tt: "A možná na tom [cook.GetFirstNameNoTooltip] také najde něco zvláštního."
 ep3_laamps.5020.b: "Přidat bylinky, které používá [culture.GetNameNoTooltip] kultura."
 ep3_laamps.5020.c: "Nuže, ochutnám to."
 ep3_laamps.5020.c.success: "Je to lahodné"
 ep3_laamps.5020.c.failure: "Je to odporné"
 cultural_acceptance_gain_food_acceptance: "Dvě kultury si vyměnily kuchařské postupy."
 ep3_laamps.5020.d: "Co je tohle za břečku?!"
 ep3_laamps.5020.d.tt: "Tvá vybíravost se stane pověstnou"
 ep3_laamps.5025.t: "Prostředek k cíli?"
 ep3_laamps.5025.desc: "Sedím poblíž místa, kde stojí [ROOT.Char.Custom('GetRandomCampBuilding')], a nechávám na sebe působit zvuky a pachy tábora. Je to docela jiný život než za bezpečnými zdmi paláce. Úplně jiný.\n\nTuhle svobodu si člověk snadno oblíbí. Žádné povinnosti, žádní štěkající rádci, žádní hodnostáři, které je třeba bavit, žádná z odvrácených stránek moci a její okázalosti.\n\nZa tuhle svobodu se však draze platí. Věčný boj o holé živobytí mě začíná unavovat. Každou noc stále víc toužím po pořádné posteli..."
 ep3_laamps.5025.a: "Jednou #EMP musím#! získat vlastní země."
 ep3_laamps.5025.b: "Tenhle život mi docela vyhovuje."
 ep3_laamps.5025.b.flavor: "Tak je načase si na něj zvyknout!"
 ep3_laamps.5025.b.tt: "Přidá #value 2#! nové [Concept('task_contracts','zakázky')|E]"
 ep3_laamps.5025.c: "Nejlepší bude nechat si otevřená vrátka."
 ep3_laamps.5025.c.flavor: "...a také se zásobit na všechno, co může přijít."
 ep3_laamps.5025.c.toast: "Poznáváš hodnotu přizpůsobivosti"
 lust_for_land_modifier_tt: "[Concept('modifier','Modifikátor')|E] [GetModifier( 'ep3_lust_for_land_modifier' ).GetNameWithTooltip]"
 ep3_laamps.5030.t: "Hostinské trampoty"
 ep3_laamps.5030.desc: "Jak se plahočíme po cestě, objeví se před námi budova. Na otlučeném štítu před ní stojí „[ROOT.Char.Custom('GetPubName')] - hostinec“.\n\n„Dnes večer máte smůlu. Sotva máme místo pro současné hosty, natož pro někoho dalšího.“ Uvnitř [Select_CString(innkeeper.IsFemale, 'hostinská', 'hostinský')] odmítavě zavrtí hlavou. „A #EMP už vůbec#! ne pro takovou sebranku, jako jste vy!“\n\n#EMP Sebranku?!#!"
 ep3_laamps.5030.a: "Ale co. Dejme si alespoň něco k pití."
 ep3_laamps.5030.a.tt: "Tuto možnost máš díky vysokému [Concept('dynasty_prestige','věhlasu')|E]\n"
 ep3_laamps.5030.b: "Nejsem tu žebrat. Mé jméno je [ROOT.Char.GetFirstNameNoTooltip] a [ROOT.Char.GetHouse.GetNameNoTooltip] je můj rod."
 ep3_laamps.5030.b.tt: "„A #EMP dožaduji se#! pohostinnosti!“"
 ep3_laamps.5030.c: "Obávám se, že na noclehu musím trvat."
 ep3_laamps.5030.c.success: "Tvou narážku pochopí a ještě dostaneš slevu"
 ep3_laamps.5030.c.failure: "Musíš svou výhrůžku vyslovit otevřeně"
 ep3_laamps.5030.c.critfailure: "Situace se vymkne z rukou"
 ep3_laamps.5030.d: "Určitě se můžeme nějak dohodnout?"
 ep3_laamps.5030.d.success: "Smlouvání se vydaří"
 ep3_laamps.5030.d.failure: "[innkeeper.GetFirstNameNoTooltip] neustoupí"
 ep3_laamps.5035.t: "Znalost kraje"
 ep3_laamps.5035.desc: "[location.GetName] je kraj, který nikdo v mém táboře důvěrně nezná, a takovou zem není radno podceňovat. Právě proto teď stojím před místním průvodcem a smlouvám o ceně jeho služeb.\n\n„Venku to není žádná legrace!“ varuje mě [guide.GetFirstNameNoTooltip] a teatrálně nasaje vzduch skrz zaťaté zuby. „Budeš potřebovat buď tyhle mapy, nebo moje služby, to ti povím zadarmo.“\n\n[guide.GetFirstNameNoTooltip] má pravdu, ale... na tom vystupování je cosi, co mě nutí váhat."
 ep3_laamps.5035.tt: "Vyžaduje jeden z rysů: [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )], [GetTrait('eccentric').GetName( GetNullCharacter )] nebo [GetTrait('gluttonous').GetName( GetNullCharacter )]"
 ep3_laamps.5035.a: "Někdo jako ty by se mi v táboře hodil."
 ep3_laamps.5035.b: "Kolik že jsi chtěl za ty mapy?"
 ep3_laamps.5035.c: "Potřebujeme pomoct projít #EMP tímhle#! krajem..."
 ep3_laamps.5035.c.success: "Rady se ukážou jako užitečné"
 ep3_laamps.5035.c.failure: "Průvodcovy informace jsou chybné"
 ep3_laamps.5035.c.critfailure: "Průvodcova cesta tě zavede přímo do pasti"
 ep3_laamps.5035.d: "Tvé služby nepotřebujeme."
 ep3_laamps.5035.d.tt: "Budeme jen muset doufat, že nezabloudíme..."
 ep3_laamps.5035.d.toast: "Zabloudíš"
 guide_map: "Podrobné mapy"
 guide_map_desc: "Tento svazek map zachycuje krajinu ve velkých podrobnostech napříč značnou částí známého světa. Obzvlášť užitečný je při cestování obtížným a zrádným terénem."
 ep3_laamps.5040.t: "Toulky po ruinách"
 ep3_laamps.5040.desc: "Když se vydám na průzkum před táborem, narazím na nuznou skupinku obchodníků. Usadili se kolem rozlehlých, ale starých a zpustlých budov a ty zachovalejší z nich si zabrali pro sebe.\n\nJejich zboží je docela obyčejné. Především jídlo, což na frekventované cestě, kudy nepochybně prochází spousta zákazníků, dává smysl. Můj pohled však neodolatelně přitahují šedé, důlky poseté zdi ruin.\n\nJak musely být velkolepé! Obchodníci zabrali jen okraj, ale zpustlé srdce rozvalin zůstává nedotčené."
 ep3_laamps.5040.a: "Nuže, zkusím v těch ruinách štěstí..."
 ep3_laamps.5040.a.bigsuccess: "Pátrání dopadne velmi dobře"
 ep3_laamps.5040.a.bigsuccess.tt: "Objevíš zaprášenou zbraň"
 ep3_laamps.5040.a.success: "Pátrání dopadne dobře"
 ep3_laamps.5040.a.success.tt: "Objevíš drobnou cetku"
 ep3_laamps.5040.a.failure: "Pátrání je k ničemu"
 ep3_laamps.5040.a.failure.tt: "Nic neobjevíš"
 ep3_laamps.5040.b: "Raději neriskovat a nakoupit zásoby."
 ep3_laamps.5040.c: "Možná by se ke mně někdo z nich přidal?"
 ep3_laamps.5040.c.critsuccess.tt: "Přidají se dva [Concept('followers','družiníci')|E]"
 ep3_laamps.5040.c.success.tt: "Přidá se jeden [Concept('follower','družiník')|E]"
 ep3_laamps.5040.c.failure.tt: "Nikdo se nepřidá"
 ep3_laamps.5040.c.critsuccess: "Dva z nich přijmou tvou nabídku"
 ep3_laamps.5040.c.success: "Někdo se rozhodne přidat"
 ep3_laamps.5040.c.failure: "Nikdo nevystoupí z davu"
 ep3_laamps.5045.t: "Kuloáry moci"
 ep3_laamps.5045.desc: "Jídlo je samozřejmě znamenité. [local_lord.GetFullName] mě hostí ve svém sídle a [location.GetName] mi dnes nabízí pohodlí, které má k obvyklé prosté stravě na cestách opravdu daleko.\n\n„Velmi mě těší, že mé pozvání nezůstalo bez odezvy.“ [local_lord.GetFirstNameNoTooltip] ke mně pokyne. „Zkusme zjistit, zda si nemůžeme být navzájem prospěšní.“\n\n„Koneckonců, při mém postavení se člověk zkrátka nemůže kvůli každé práci brodit #EMP bahnem osobně#!...“"
 ep3_laamps.5045.a: "Víš, toulavého života už mám docela dost..."
 ep3_laamps.5045.a.tt: "Tuto možnost máš díky [Concept('modifier','modifikátoru')|E] [GetModifier( 'ep3_lust_for_land_modifier' ).GetNameWithTooltip]"
 ep3_laamps.5045.a.success: "Tvá slova zapůsobí"
 ep3_laamps.5045.a.failure: "[local_lord.GetFirstNameNoTooltip] se tomu jen zasměje"
 ep3_laamps.5045.b: "Nuže, zlato se vždycky hodí..."
 ep3_laamps.5045.c: "Trocha toho jídla navíc by také přišla vhod."
 ep3_laamps.5045.d: "Stačí mi práce, kterou posloužím zdejším zemím."
 world_africa_sahara_provisions_usage_multiplier_modifier: "Saharská provincie"
 world_africa_sahara_provisions_usage_multiplier_modifier_desc: "Tato provincie je vystavena plnému hněvu mocné Sahary (nebo některého z pohoří na jejím okraji) — pokusit se jí projít by mohl jen naprostý hlupák nebo skutečný znalec kraje."
 duel_to_the_death.tt: "@death_icon! #X Okamžitě tě čeká [Concept('single_combat_duel','duel')|E] na [Concept('character_death_death','smrt')|E]#!"
 ep3_laamp_flavour_ewan.0001.t: "Narůžovělé odstíny"
 ep3_laamp_flavour_ewan.0001.desc.intro.preamble: "Podvečer bývá v táboře plný horečného ruchu. Lidé pobíhají sem a tam, zásoby mění místo a náš přenosný domov znovu vyrůstá ze země. Právě tehdy se také obvykle vydávám na procházku, abych si pročistil hlavu, a při ní se snažím"
 ep3_laamp_flavour_ewan.0001.desc.intro.lazy: " vyhnout všem drobným úkolům a otázkám svých družiníků.\n\n"
 ep3_laamp_flavour_ewan.0001.desc.intro.diligent: " v duchu uspořádat vše, co mě čeká zítra.\n\n"
 ep3_laamp_flavour_ewan.0001.desc.intro.fallback: " alespoň na chvíli uniknout okolnímu hluku.\n\n"
 ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate: "pozoruji, jak poslední narůžovělé paprsky zapadajícího slunce zalévají "
 ep3_laamp_flavour_ewan.0001.desc.midtro.small_hill: "Když vystoupám na vrchol nízkého kopce, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.tree_covered_hill: "Když vystoupám na vrchol zalesněného kopce, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.small_ridge: "Když vystoupám na nízký hřeben, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.small_dune: "Když vystoupám na malou dunu, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.dusty_ridge: "Když vystoupám na prašný hřeben, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.stubby_hillock: "Když vystoupám na nevysoký pahorek, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.midtro.dusty_hill: "Když vystoupám na prašný kopec, $ep3_laamp_flavour_ewan.0001.desc.midtro.sunlight_boilerplate$"
 ep3_laamp_flavour_ewan.0001.desc.plains: "planiny pode mnou, na hladinách tůní a potoků vykreslují třpytivé ostrůvky světla a zbytek krajiny zahalují do jemné záře."
 ep3_laamp_flavour_ewan.0001.desc.farmlands: "úrodnou krajinu pode mnou, zachytávají se na živých plotech a usedlostech a jejich obrysy změkčují první prohlubující se stíny. Tolik malých světů a drobných lidských životů pod jedinou zářící oblohou."
 ep3_laamp_flavour_ewan.0001.desc.hills: "kopce pode mnou a vytvářejí desítky drobných stínů, až krajina připomíná strakatou přikrývku protkanou růžovou září a temnými údolími."
 ep3_laamp_flavour_ewan.0001.desc.mountains: "nižší vrcholy pode mnou. Celá údolí rychle mizí ve stínu, zatímco horské štíty se stále koupou v růžové záři."
 ep3_laamp_flavour_ewan.0001.desc.desert: "poušť rozprostřenou přede mnou, oceán růžově zbarveného písku táhnoucí se až k obzoru a snad ještě dál. Pustá, ale rozhodně ne jednotvárná krajina se proměňuje pod závany večerního větru."
 ep3_laamp_flavour_ewan.0001.desc.desert_mountains: "nižší vrcholy pode mnou. Vyprahlé hory hltavě nasávají růžovou záři, dokud ji nevyčerpají, a celá údolí se mezitím noří do stínu."
 ep3_laamp_flavour_ewan.0001.desc.oasis: "poušť rozprostřenou přede mnou, přičemž nejjasněji se odrážejí ve vodách oázy. Vzácná vodní hladina září jako drahokam a na chvíli se stává majákem nejen v přeneseném smyslu."
 ep3_laamp_flavour_ewan.0001.desc.jungle: "koruny džungle rozprostřené pode mnou. Dávno prohloubené stíny vytvářejí pestrou mozaiku a mohutné stromy jako by se natahovaly vzhůru za posledním zábleskem soumraku."
 ep3_laamp_flavour_ewan.0001.desc.forest: "les pode mnou, změť sukovitých korun a drobných stezek s tolika stinnými zákoutími, že by se v nich mohla ukrýt celá armáda — byť vždy jen po dvou či třech vojácích."
 ep3_laamp_flavour_ewan.0001.desc.taiga: "les pode mnou, kde se mezi skalnatými kopci na celé míle táhnou borovice a smrky, skvrnité stíny a růžovou září."
 ep3_laamp_flavour_ewan.0001.desc.wetlands: "mokřady pode mnou. Páchnoucí vody bažin se rázem promění v narůžovělou přikrývku ze stříbrných šupin a světlo mění každou tůň v třpytivý drahokam."
 ep3_laamp_flavour_ewan.0001.desc.steppe: "step rozprostřenou přede mnou. Moře vlnící se žlutohnědé trávy se náhle zbarví do jemně růžova. Podivná rovinatost krajiny nedává stínům téměř žádnou šanci a vytváří uklidňující, jednolitý obraz."
 ep3_laamp_flavour_ewan.0001.desc.floodplains: "záplavové nížiny rozprostřené přede mnou. Vysoká bujná tráva i řady prospívajících stromů vrhají na všechny strany tenké proužky stínu. Celá země jako by tiše zářila."
 ep3_laamp_flavour_ewan.0001.desc.drylands: "vyprahlou krajinu pode mnou jemnou růžovou září. Od kopce ke kopci a od osady k osadě zahaluje četné vesnice do poklidného ticha."
 ep3_laamp_flavour_ewan.0001.desc.outro: "\n\nNádherný pohled — možná až příliš krásný na to, abych si ho nechal jen pro sebe?"
 ep3_laamp_flavour_ewan.0001.a: "Ještě chvíli zůstat a vychutnat si samotu."
 ep3_laamp_flavour_ewan.0001.b: "[watch_partner_1.GetFirstNameNoTooltip], pojď sem nahoru!"
 ep3_laamp_flavour_ewan.0001.c: "Raději zavolat [watch_partner_2.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.0001.d: "Krásná chvíle, ale práce volá."
 ep3_laamp_flavour_ewan_0001_the_little_things_modifier: "Drobné radosti"
 ep3_laamp_flavour_ewan_0001_the_little_things_modifier_desc: "Tato postava si vždy najde čas, aby ocenila drobné radosti života."
 ep3_laamp_flavour_ewan_0001_all_business_modifier: "Práce především"
 ep3_laamp_flavour_ewan_0001_all_business_modifier_desc: "Když je třeba pracovat, všechno ostatní může počkat."
 ep3_laamp_flavour_ewan.0011.t: "Oheň a přátelé"
 ep3_laamp_flavour_ewan.0011.desc.intro: "Každý večer se oheň stává #EMP skutečným#! středobodem společenského života v táboře. Lidé se kolem mě shlukují, klábosí a přátelsky se popichují. Dnešek není výjimkou.\n\n„Podívejte, já jen říkám,“ pochechtává se [mocker.GetFirstName], „že [mockee.GetFirstName]"
 ep3_laamp_flavour_ewan.0011.desc.lustful: " má za sebou víc pohlavních nemocí než prstů na rukou — a přesnější číslo se stejně nedozvíme, protože dál počítat neumí!“"
 ep3_laamp_flavour_ewan.0011.desc.chaste: " je skutečným apoštolem cudnosti — a ještě aby ne, protože s takovým obličejem by byla zatracená smůla, kdyby tomu bylo jinak!“"
 ep3_laamp_flavour_ewan.0011.desc.gluttonous: " je #EMP skutečným#! důvodem, proč se musíme tak často stěhovat. Pokaždé, když vyrazí na trh, vypukne hladomor!“"
 ep3_laamp_flavour_ewan.0011.desc.temperate: " vlastně nemůže za to, že omylem [Select_CString(mockee.IsFemale, 'vypila', 'vypil')] kozí chcanky a ani si nevšiml[Select_CString(mockee.IsFemale, 'a', '')] chuti. Jednou je to nehoda, ale #EMP podruhé#!? To už je zvyk!“"
 ep3_laamp_flavour_ewan.0011.desc.greedy: " #EMP technicky vzato#! neudělal[Select_CString(mockee.IsFemale, 'a', '')] nic špatného, když tomu žebrákovi [Select_CString(mockee.IsFemale, 'hodila', 'hodil')] minci — přece nemůže za to, že ji [Select_CString(mockee.IsFemale, 'chytila', 'chytil')] dřív než on!“"
 ep3_laamp_flavour_ewan.0011.desc.generous: " má tak dobré srdce, že by nám nejraději [Select_CString(mockee.IsFemale, 'dala', 'dal')] i košili ze zad — kdyby ji ovšem někdo vůbec chtěl!“"
 ep3_laamp_flavour_ewan.0011.desc.lazy: " nemůže za to, že mizí rychleji než vyplašený zajíc, kdykoli někdo začne větu slovem „můžeš“ — od jistého bodu už je lenost umění!“"
 ep3_laamp_flavour_ewan.0011.desc.diligent: " nemůže za své pomalé tempo na pochodu — s klackem vraženým tak hluboko do zadku se přece špatně chodí!“"
 ep3_laamp_flavour_ewan.0011.desc.wrathful: " vlastně ani nemůže za svou výbušnost — kdybych se každé ráno probouzel v kůži [mockee.GetFirstNameNoTooltip], byl bych taky zatraceně vzteklý!“"
 ep3_laamp_flavour_ewan.0011.desc.calm: " je možná [Select_CString(mockee.IsFemale, 'nudná', 'nudný')], [Select_CString(mockee.IsFemale, 'suchopárná', 'suchopárný')], chronicky bez vášně a nejlepší táborový lék na nespavost a... ach, promiň, [mockee.GetFirstNameNoTooltip], vůbec jsem si tě nevšiml!“"
 ep3_laamp_flavour_ewan.0011.desc.patient: " by ten kámen v soutěži zírání určitě [Select_CString(mockee.IsFemale, 'porazila', 'porazil')], kdybychom po týdnu či dvou nemuseli zvednout tábor!“"
 ep3_laamp_flavour_ewan.0011.desc.impatient: " má možná pozornost jepice, ale vynahrazuje to svou... přirozenou... ehm, dychtivostí po nových věcech, že ano, [mockee.GetFirstNameNoTooltip]?“"
 ep3_laamp_flavour_ewan.0011.desc.arrogant: " nemůže za své #EMP kolosální#! ego — koneckonců je to dnes už to největší, co ještě může nazývat vlastním!“"
 ep3_laamp_flavour_ewan.0011.desc.humble: " se shazuje tak často, že se vlastně ani nemusím snažit — ale stejně budu!“"
 ep3_laamp_flavour_ewan.0011.desc.deceitful: " je možná #EMP nejméně#! upřímný člověk, jakého jsem kdy poznal, ale rozhovor s [mockee.GetFirstNameNoTooltip] rozhodně nikdy není nudný! Že ano, [mockee.GetFirstNameNoTooltip]? Tedy pokud se tak vůbec opravdu jmenuješ!“"
 ep3_laamp_flavour_ewan.0011.desc.honest: " nedokáže zalhat, ani kdyby na tom závisel život — a mimochodem nedokáže ani vyprávět vtip!“"
 ep3_laamp_flavour_ewan.0011.desc.craven: " je tak křehká duše, že si všichni musíme dávat pozor, abychom ji nevylekali — srdce by ten šok nemuselo vydržet!“"
 ep3_laamp_flavour_ewan.0011.desc.brave: " je kdykoli [Select_CString(mockee.IsFemale, 'připravená', 'připravený')] na rvačku, což je jen dobře. Nejošklivější držky by měly bojovat první — mají nejmíň co ztratit!“"
 ep3_laamp_flavour_ewan.0011.desc.shy: " dnes [Select_CString(mockee.IsFemale, 'prokázala', 'prokázal')] velkou odvahu už tím, že si [Select_CString(mockee.IsFemale, 'přišla', 'přišel')] sednout k ohni — už teď se těším na další návštěvu příští rok!“"
 ep3_laamp_flavour_ewan.0011.desc.gregarious: " je všude [Select_CString(mockee.IsFemale, 'známá', 'známý')] jako společenská duše a bavič celých davů — což je dobře, protože o samotě ještě nikoho [Select_CString(mockee.IsFemale, 'nepotěšila', 'nepotěšil')]!“"
 ep3_laamp_flavour_ewan.0011.desc.ambitious: " má možná velkolepé představy o své budoucnosti, ale jedno se musí uznat: málokdo dokáže žvanit celou minutu bez jediného nadechnutí!“"
 ep3_laamp_flavour_ewan.0011.desc.content: " má dost rozumu, aby své ambice držel[Select_CString(mockee.IsFemale, 'a', '')] pěkně při zemi — přesně na úrovni svého nadání!“"
 ep3_laamp_flavour_ewan.0011.desc.arbitrary: " přece nemůže nést odpovědnost za to, že nerozumí všem těm #EMP pravidlům#! — vždyť ani neumí číst!“"
 ep3_laamp_flavour_ewan.0011.desc.just: " možná lpí na pravidlech až příliš, ale když je má očividně vražená tak hluboko v zadku, dá se to pochopit!“"
 ep3_laamp_flavour_ewan.0011.desc.cynical: " rozhodně nepatří mezi zbožné lidi, ale abych byl #EMP naprosto#! spravedlivý: s takovým obličejem bych taky pochyboval, že [mocker.GetFaith.CreatorName] ví, co dělá!“"
 ep3_laamp_flavour_ewan.0011.desc.zealous: " patří k nejzbožnějším a nejobětavějším lidem pod sluncem — [mockee.GetFaith.HighGodName] jistě ocení, že [mockee.GetFirstNameNoTooltip] [Select_CString(mockee.IsFemale, 'obětovala', 'obětoval')] dokonce celý svůj smysl pro humor!“"
 ep3_laamp_flavour_ewan.0011.desc.paranoid: " si za život [Select_CString(mockee.IsFemale, 'nadělala', 'nadělal')] pár nepřátel — možná jsou někteří právě teď tady, možná dokonce... #EMP za tebou#!, [mockee.GetFirstNameNoTooltip], POZOR!“"
 ep3_laamp_flavour_ewan.0011.desc.trusting: " možná [Select_CString(mockee.IsFemale, 'přišla', 'přišel')] o pár mincí kvůli jednomu či dvěma podvodníkům, ale jak [Select_CString(mockee.IsFemale, 'měla', 'měl')] vědět, že ten bezzubý žebrák #EMP ve skutečnosti#! není králem země zvané [current_county.GetBaseNameNoTier]?“"
 ep3_laamp_flavour_ewan.0011.desc.compassionate: " má prý trochu měkké srdce. Nebo hodně měkké. Vlastně úplně měkké. Jako nádherná peřina z husího prachového peří, která dostala lidskou podobu.“"
 ep3_laamp_flavour_ewan.0011.desc.callous: " má asi tolik společenského citu jako průměrná koza, ale na rozdíl od kozy... ehm... no, [mockee.GetFirstNameNoTooltip], tohle začíná být trapné.“"
 ep3_laamp_flavour_ewan.0011.desc.sadistic: " #EMP skutečně#! [Select_CString(mockee.IsFemale, 'skopla', 'skopl')] toho sirotka z kopce a #EMP skutečně#! se [Select_CString(mockee.IsFemale, 'vysmála', 'vysmál')] té žebračce do obličeje, ale určitě má i nějaké dobré vlastnosti... předpokládám. Někde. Asi.“"
 ep3_laamp_flavour_ewan.0011.desc.stubborn: " je možná nejtvrdohlavější tvor v celém táboře, což je docela výkon, když vezmete v úvahu všechny naše mezky!“"
 ep3_laamp_flavour_ewan.0011.desc.fickle: " mění názor častěji než vítr směr, ale jedno se musí uznat: při rozhovoru s [mockee.GetFirstNameNoTooltip] se člověk nikdy nenudí!“"
 ep3_laamp_flavour_ewan.0011.desc.vengeful: " možná [Select_CString(mockee.IsFemale, 'přísahala', 'přísahal')] věčnou krvavou pomstu celému tomu rodu, ale co jiného [Select_CString(mockee.IsFemale, 'měla', 'měl')] dělat? Předběhli nás ve frontě na žvanec!“"
 ep3_laamp_flavour_ewan.0011.desc.forgiving: " je možná až #EMP příliš#! [Select_CString(mockee.IsFemale, 'ochotná', 'ochotný')] nechat minulost minulostí, ale co je mezi přáteli jeden zabitý pes, že? Stává se to i těm nejlepším — a taky [mockee.GetFirstNameNoTooltip]!“"
 ep3_laamp_flavour_ewan.0011.desc.eccentric: " je možná [Select_CString(mockee.IsFemale, 'podivínka', 'podivín')], možná mluví divně a většinu času z nevysvětlitelného důvodu páchne jako něco vyvařeného, ale rozhodně se nedá říct, že by [Select_CString(mockee.IsFemale, 'byla předvídatelná', 'byl předvídatelný')]!“"
 ep3_laamp_flavour_ewan.0011.desc.outro: "\n\nOpilí přihlížející vybuchnou v hlasitý smích, ale [mockee.GetFirstNameNoTooltip] už toho má očividně dost."
 ep3_laamp_flavour_ewan.0011.a: "Přidat se k dobírání [mockee.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.0011.a.tt.success: "Duše společnosti"
 ep3_laamp_flavour_ewan.0011.a.tt.failure: "Za hranou"
 ep3_laamp_flavour_ewan.0011.b: "Obrátit žerty proti [mocker.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.0011.b.tt.success: "$ep3_laamp_flavour_ewan.0011.a.tt.success$"
 ep3_laamp_flavour_ewan.0011.b.tt.failure: "$ep3_laamp_flavour_ewan.0011.a.tt.failure$"
 ep3_laamp_flavour_ewan.0011.c: "Přihodit vlastní vtip."
 ep3_laamp_flavour_ewan.0011.c.tt.success: "$ep3_laamp_flavour_ewan.0011.a.tt.success$"
 ep3_laamp_flavour_ewan.0011.c.tt.failure: "Co to má vůbec #EMP znamenat#!?"
 ep3_laamp_flavour_ewan.0011.d: "Jen si tu chvíli vychutnat."
 ep3_laamp_flavour_ewan.0021.t: "Malý souputník"
 ep3_laamp_flavour_ewan.0021.desc.intro.cat: "Už několik dní vídám kolem svého pavilonu slídit malou kočku,"
 ep3_laamp_flavour_ewan.0021.desc.intro.dog: "Už několik dní tráví večery před mým pavilonem malý, ošuntělý pes,"
 ep3_laamp_flavour_ewan.0021.desc.cat.1: " loví zdejší myši a s povýšeným rozhořčením skutečného panovníka odhání každého méně významného návštěvníka.\n\nLze snad život šlechtice vystihnout lépe než právě těmito dvěma činnostmi?"
 ep3_laamp_flavour_ewan.0021.desc.cat.2: " za úsvitu vstává spolu s táborem, celodenní cestu prospí na #EMP mém#! voze a večer se ospale vydává za potravou v podobě zbytků od stolu a nakradených zásob.\n\nOpovážlivé zvíře, ale rozhodně ví, co chce."
 ep3_laamp_flavour_ewan.0021.desc.cat.3: " zmizí pokaždé, když se k ní někdo jen přiblíží, aby se o několik minut později potichu znovu objevila a pozorovala nás zpovzdálí.\n\nPlachá, a přitom věčně zvědavá. Nelehké spojení vlastností pro kohokoli, natož pro tak malou kočku."
 ep3_laamp_flavour_ewan.0021.desc.cat.4: " dychtivě se proplétá mezi nohama každého mého návštěvníka — a dokonce i mnoha kolemjdoucích — dokud z nich nevymámí pamlsek nebo podrbání pod bradou, načež nebohé prosťáčky bez jediného ohlédnutí opustí.\n\nNelítostné, možná, ale účinné."
 ep3_laamp_flavour_ewan.0021.desc.cat.5: " a hlasitější a zuřivější zvíře jsem snad nikdy nepotkal. Není to o mnoho víc než klubko zubů, drápů a vzteku a její drobné tělo jen stěží odpovídá množství #EMP nenávisti#!, které se v ní očividně skrývá.\n\nMožná je dobře, že se narodila jako kočka, a ne jako panter."
 ep3_laamp_flavour_ewan.0021.desc.dog.1: " vyje a kňučí pokaždé, když zmizím z dohledu. Kňučí jako... nu, jako pes po svém pánovi, přestože jsme se sotva poznali.\n\nMožná ke mně cítí jakousi spřízněnost, i když se během dne drží při chůzi v uctivé vzdálenosti za mnou."
 ep3_laamp_flavour_ewan.0021.desc.dog.2: " vrčí a chňape po každém, kdo se opováží přiblížit na krok k mému obydlí.\n\nV mnoha ohledech nepraktické, ale jen máloco člověka ochrání lépe než věrný pes."
 ep3_laamp_flavour_ewan.0021.desc.dog.3: " s bezmeznou energií pobíhá pořád dokola a dokola a #EMP dokola#!, jako by mohl běžet kamkoli, ale vlastně neměl kam jít.\n\nMožná jsme si v tom trochu podobní. Dva tuláci ponechaní napospas světu."
 ep3_laamp_flavour_ewan.0021.desc.dog.4: " a podle všeho se ze všech sil snaží #EMP sám#! naučit různé kousky, snad aby na mě udělal dojem. Je chytřejší než většina psů, což mi došlo ve chvíli, kdy mi jediným skokem za letu vytrhl z ruky dušenou ředkev.\n\nSeřval jsem ho, ale nemohu tvrdit, že to nebylo směšné. Na psa dokonce působivé."
 ep3_laamp_flavour_ewan.0021.desc.dog.5: " mě při každém odchodu následuje jen za téměř neslyšného funění a potom mě doprovází i zpátky. Nevím, proč mě hlídá, ale z nějakého důvodu mu to očividně vyhovuje.\n\nMožná mu připomínám někoho, komu dříve sloužil? Těžko říct, ale tahle rutina mu rozhodně připadá přirozená."
 ep3_laamp_flavour_ewan.0021.desc.outro: "\n\nKe mně se zvíře chová dost přátelsky. Spokojeně se mi otírá o ruku a celé minuty mi olizuje prsty, i když nikoho jiného přijmout odmítá."
 ep3_laamp_flavour_ewan.0021.a: "Pojď sem, drobku. No nejsi ty nádhera?"
 ep3_laamp_flavour_ewan.0021.b: "To je... jídlo..."
 ep3_laamp_flavour_ewan.0021.c: "Odkopnout tu potvoru vší silou."
 ep3_laamp_flavour_ewan.0021.d: "Je to jen další poutník. Nechat ho být."
 ep3_laamp_flavour_ewan_0021_respected_cat_modifier: "Úcta ke kočkám"
 ep3_laamp_flavour_ewan_0021_respected_cat_modifier_desc: "Tato postava dobře ví, kdo je skutečným nejlepším přítelem člověka."
 ep3_laamp_flavour_ewan_0021_respected_dog_modifier: "Úcta ke psům"
 ep3_laamp_flavour_ewan_0021_respected_dog_modifier_desc: "$ep3_laamp_flavour_ewan_0021_respected_cat_modifier_desc$"
 ep3_laamp_flavour_ewan.0031.t: "Kotrmelce z kopce"
 ep3_laamp_flavour_ewan.0031.desc.intro: "Při cestě krajem zvaným [current_county.GetBaseNameNoTier] nechávám myšlenky bezcílně bloudit, znuděný jednotvárností obyčejného přesunu, když se náhle ozve vyděšený #EMP výkřik#!.\n\nÚtok? Prudce se rozhlédnu — ne — to jen ten zatracený hlupák [stooge.GetTitledFirstName] [Select_CString(stooge.IsFemale, 'dokázala', 'dokázal')] spadnout z koně a"
 ep3_laamp_flavour_ewan.0031.desc.plains: " skutálet se po mírném svahu přímo do hrozivě vyhlížejícího houští,"
 ep3_laamp_flavour_ewan.0031.desc.farmlands: " prorazit hustým živým plotem a skončit v příkopu plném ostružiní,"
 ep3_laamp_flavour_ewan.0031.desc.hills: " skutálet se střemhlav po prudkém svahu, přes hlavu až dolů do rokle,"
 ep3_laamp_flavour_ewan.0031.desc.mountains: " smýkat se po svahu, vyrážet kamení a oblaka prachu a nakonec přepadnout přes skalní hranu,"
 ep3_laamp_flavour_ewan.0031.desc.desert: " kutálet se dolů po vysoké duně, bezmocně se převalovat ze strany na stranu, zatímco nabraná rychlost žene tělo stále dál,"
 ep3_laamp_flavour_ewan.0031.desc.desert_mountains: "$ep3_laamp_flavour_ewan.0031.desc.mountains$"
 ep3_laamp_flavour_ewan.0031.desc.oasis: "$ep3_laamp_flavour_ewan.0031.desc.desert$"
 ep3_laamp_flavour_ewan.0031.desc.jungle: " skutálet se po úbočí porostlém stromy, zachytávat se přitom o liány a podivné trny,"
 ep3_laamp_flavour_ewan.0031.desc.forest: " skutálet se po úbočí porostlém stromy, zachytávat se přitom o větve a ostružiní,"
 ep3_laamp_flavour_ewan.0031.desc.taiga: " skutálet se po úbočí porostlém stromy, zachytávat se přitom o větve a staré šišky,"
 ep3_laamp_flavour_ewan.0031.desc.wetlands: " sklouznout po nízkém pahorku a rozstřikovat kolem sebe bláto a mokrou trávu,"
 ep3_laamp_flavour_ewan.0031.desc.steppe: " najít široko daleko #EMP jediný#! kopec a samozřejmě se z něj skutálet,"
 ep3_laamp_flavour_ewan.0031.desc.floodplains: " skutálet se do čehosi, co vypadá jako příkop plný brakické vody,"
 ep3_laamp_flavour_ewan.0031.desc.drylands: " skutálet se po prašném kopci a zvednout za sebou hustý oblak písku a prachu,"
 ep3_laamp_flavour_ewan.0031.desc.midtro: " přičemž celou cestu ječí a naříká.\n\n"
 ep3_laamp_flavour_ewan.0031.desc.outro.dead: "Když se [stooge.GetFirstNameNoTooltip] ani po několika minutách neobjeví, jeden z nosičů se vydá dolů podívat. O chvíli později se ozve zděšený výkřik.\n\nZdá se, že [stooge.GetFirstNameNoTooltip] pád nepřežil[Select_CString(stooge.IsFemale, 'a', '')]."
 ep3_laamp_flavour_ewan.0031.desc.outro.fallback: "O chvíli později se [stooge.GetFirstNameNoTooltip] vynoří, hlasitě kleje a živý[Select_CString(stooge.IsFemale, 'á', '')], ale rozhodně ne bez úhony."
 ep3_laamp_flavour_ewan.0031.a: "Hlasitě se rozesmát."
 ep3_laamp_flavour_ewan.0031.b: "Jen se uchechtnout."
 ep3_laamp_flavour_ewan.0031.c: "Taková malicherná škodolibost je pode mou úroveň."
 ep3_laamp_flavour_ewan_0031_grisly_modifier: "Morbidní smysl pro humor"
 ep3_laamp_flavour_ewan_0031_grisly_modifier_desc: "Život se směje tobě, tak proč se nesmát spolu s ním?"
 ep3_laamp_flavour_ewan_0031_macabre_modifier: "Černý smysl pro humor"
 ep3_laamp_flavour_ewan_0031_macabre_modifier_desc: "Jen proto, že je něco temné, ještě neznamená, že to nemůže být směšné."
 ep3_laamp_flavour_ewan.0041.t: "Strasti táborového kuchaře"
 ep3_laamp_flavour_ewan.0041.desc.has_cook: "„Nemyslím, že chci něco přehnaného,“ odsekne [camp_cook.GetFirstName] — můj [GetCourtPositionType( 'camp_cook_camp_officer' ).GetName()] — a odmítavě mávne rukou nad okolní krajinou.\n\n"
 ep3_laamp_flavour_ewan.0041.desc.nameless_cook: "„Nemyslím, že chceme něco přehnaného,“ odsekne člověk, na kterého dnes zřejmě padl černý Petr, aby za kuchaře přišel se mnou promluvit, a odmítavě přitom mávne rukou nad okolní krajinou.\n\n"
 ep3_laamp_flavour_ewan.0041.desc.plains: "„Farem je tu dost, i když žádná není zrovna výstavní. Snad není tak těžké na chvíli zastavit a"
 ep3_laamp_flavour_ewan.0041.desc.farmlands: "„Všude kolem je tahle nádherná úrodná zem, a my si nedokážeme najít ani chvilku, abychom"
 ep3_laamp_flavour_ewan.0041.desc.hills: "„Na míle kolem jsou pastviny na svazích, a přesto si nedokážeme najít čas, abychom"
 ep3_laamp_flavour_ewan.0041.desc.mountains: "„Všude kolem je horská zvěř, a my si ani nenajdeme čas, abychom"
 ep3_laamp_flavour_ewan.0041.desc.desert: "„Jsme po lokty v téhle díře zvané poušť, nikde ani osada, a jsme na tom tak bídně, že si nemůžeme ani"
 ep3_laamp_flavour_ewan.0041.desc.desert_mountains: "„Trčíme skoro až v nebi, hrdla máme vyprahlá na troud, a přesto se ani nepokusíme"
 ep3_laamp_flavour_ewan.0041.desc.oasis: "„Dokonce i u skutečné oázy jako bychom nemohli vydržet ani chvíli a už se hnali zpátky do kruté pouště, místo abychom"
 ep3_laamp_flavour_ewan.0041.desc.jungle: "„Džungle nám nabízí tolik všelijakých cizokrajných pochoutek, a my přesto nemáme ani chuť"
 ep3_laamp_flavour_ewan.0041.desc.forest: "„Dokonce ani v tomhle bohatém lese si nenajdeme čas"
 ep3_laamp_flavour_ewan.0041.desc.taiga: "„Jsme tady v nějakém zapomenutém pekelném lese, tak daleko od civilizace, že si nemůžeme ani"
 ep3_laamp_flavour_ewan.0041.desc.wetlands: "„Jsme odsouzeni věčně bloudit touhle páchnoucí bažinou a nemůžeme si ani"
 ep3_laamp_flavour_ewan.0041.desc.steppe: "„Jsme ztraceni v tomhle nekonečném moři trávy, tak daleko od všeho, že si nemůžeme ani"
 ep3_laamp_flavour_ewan.0041.desc.floodplains: "„Trčíme tady v těch zahnívajících záplavových nížinách, vydáni napospas vodě a hrázím, a nemůžeme si ani"
 ep3_laamp_flavour_ewan.0041.desc.drylands: "„Jsme vyhnáni do tohohle prašného pekla, příliš daleko od čehokoli důležitého, než abychom si mohli"
 ep3_laamp_flavour_ewan.0041.desc.outro: " doplnit pár drobných pochutin, díky kterým se naše jídlo vůbec dá jíst?“\n\nPovzdechnu si, už teď unavený celým tím rozhovorem. Jsem zvědavý, kdo z nás povolí jako první."
 ep3_laamp_flavour_ewan.0041.desc.provisions.high: "\n\nTohle už zní jako blábolení šílence. Zásoby jsem kontroloval teprve dnes ráno a měly by nám bez problémů vydržet ještě celé měsíce."
 ep3_laamp_flavour_ewan.0041.desc.provisions.medium: "\n\nAno, zásob máme možná #EMP trochu#! méně, než by se mi líbilo, ale takový poplach je sotva na místě."
 ep3_laamp_flavour_ewan.0041.desc.provisions.low: "\n\nNaše zásoby jsou v žalostném stavu a tenhle trouba se se mnou hádá o to, jestli jejich poslední zbytky budou mít tu správnou chuť."
 ep3_laamp_flavour_ewan.0041.desc.provisions.sahara: "\n\nRozhlédnu se po téměř nekonečné poušti, která se všemi směry táhne až za obzor."
 ep3_laamp_flavour_ewan.0041.a: "Na co si vůbec stěžuješ?"
 ep3_laamp_flavour_ewan.0041.b: "Dobrá, můžeme doplnit zásoby."
 ep3_laamp_flavour_ewan.0041.b.tt.success: "Uzavřeš výhodné obchody"
 ep3_laamp_flavour_ewan.0041.b.tt.failure: "Místní se s tebou příliš dělit nehodlají"
 ep3_laamp_flavour_ewan.0041.c: "V žádném případě. Pracuj s tím, co máš."
 ep3_laamp_flavour_ewan.0041.d: "Určitě mezi sebou něco vymyslíte."
 ep3_laamp_flavour_ewan.0041.e: "Něco snad najdeme..."
 ep3_laamp_flavour_ewan.0041.e.tt.success: "Tvé úsilí přinese ovoce"
 ep3_laamp_flavour_ewan.0041.e.tt.failure: "Vrátíš se téměř s prázdnou"
 ep3_laamp_flavour_ewan.0041.f: "Doplnit zásoby by asi stejně nebylo od věci."
 ep3_laamp_flavour_ewan.0041.f.tt.success: "$ep3_laamp_flavour_ewan.0041.b.tt.success$"
 ep3_laamp_flavour_ewan.0041.f.tt.failure: "$ep3_laamp_flavour_ewan.0041.b.tt.failure$"
 ep3_laamp_flavour_ewan.0041.g: "Na to nemáme peníze."
 ep3_laamp_flavour_ewan.0041.h: "Prostě zdvojnásobte příděly piva a máme vyřešeno."
 ep3_laamp_flavour_ewan.0041.i: "Můžeme zastavit a nasbírat, co najdeme."
 ep3_laamp_flavour_ewan.0041.i.tt.success: "$ep3_laamp_flavour_ewan.0041.e.tt.success$"
 ep3_laamp_flavour_ewan.0041.i.tt.failure: "$ep3_laamp_flavour_ewan.0041.e.tt.failure$"
 ep3_laamp_flavour_ewan.0041.j: "Dokoupíme tolik zásob, kolik jen půjde..."
 ep3_laamp_flavour_ewan.0041.j.tt.success: "$ep3_laamp_flavour_ewan.0041.b.tt.success$"
 ep3_laamp_flavour_ewan.0041.j.tt.failure: "$ep3_laamp_flavour_ewan.0041.b.tt.failure$"
 ep3_laamp_flavour_ewan.0041.k: "#EMP Musíme#! pokračovat."
 ep3_laamp_flavour_ewan.0041.l: "Hmm, možná máme #EMP něco#! schovaného bokem."
 ep3_laamp_flavour_ewan.0041.m: "#EMP Vidíš#! snad někde místo, kde bychom mohli nakoupit zásoby, ty idiote?"
 ep3_laamp_flavour_ewan.0041.n: "Je mi jedno, jestli budeme až do konce jíst jen kaši."
 ep3_laamp_flavour_ewan_0041_well_provided_camp_modifier: "Dobře zásobený tábor"
 ep3_laamp_flavour_ewan_0041_well_provided_camp_modifier_desc: "Vzpomínky na hojnost dokážou vydržet velmi dlouho."
 ep3_laamp_flavour_ewan_0041_doubled_beer_rations_camp_modifier: "Dvojnásobné příděly piva"
 ep3_laamp_flavour_ewan_0041_doubled_beer_rations_camp_modifier_desc: "V táboře této postavy je #EMP opravdu#! veselo — soustředění na práci už je horší."
 ep3_laamp_flavour_ewan_0041_stern_camp_modifier: "Přísné hospodaření se zásobami"
 ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc: "Družiníci této postavy se naučili vystačit s tím, co mají — nebo se obejít bez toho."
 ep3_laamp_flavour_ewan_0041_quite_stern_camp_modifier: "Velmi přísné hospodaření se zásobami"
 ep3_laamp_flavour_ewan_0041_quite_stern_camp_modifier_desc: "$ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc$"
 ep3_laamp_flavour_ewan_0041_very_stern_camp_modifier: "Neúprosné hospodaření se zásobami"
 ep3_laamp_flavour_ewan_0041_very_stern_camp_modifier_desc: "$ep3_laamp_flavour_ewan_0041_stern_camp_modifier_desc$"
 ep3_laamp_flavour_ewan.0051.t: "Přátelský hlahol"
 ep3_laamp_flavour_ewan.0051.desc.intro: "Těžko popsat, co je tak důvěrně příjemného na tlumeném ruchu tábora, který se ukládá k večernímu odpočinku.\n\nMožná je to "
 ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.1: "přehlídka nových tváří dychtících uniknout usedlému životu,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.2: "sbor podvečerních hádek o plánech na zítřek,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.wanderers.3: "trochu tesklivé žertování o tom, kam se vydáme příště,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.1: "řinčení zbraní odhazovaných sem a tam,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.2: "srdečný řehot válečníků vyprávějících oplzlé vtipy,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.mercenaries.3: "nezaměnitelné bučení a jásot od vzdálených her v kostky,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.1: "uklidňující škrábání brků po stránkách večerních zápisků,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.2: "vzdálený zvuk těch samých sporů jako včera, které bez otálení pokračují přesně tam, kde skončily,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.scholars.3: "povýšené výkřiky rozhořčených učenců nucených žít v divočině,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.1: "hovory o vzdálených krajích vedené, jako bychom je všichni už dávno navštívili,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.2: "okázale dávané najevo touhy procestovat celý svět,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.3: "upřímná láska ke všem divům, které před námi svět možná ještě skrývá,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.1: "hlad po kořisti a lupičství vepsaný do tváře každého družiníka,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.2: "obvinění z podvádění a výhrůžky smrtí, které neodmyslitelně provázejí hazard,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.brigands.3: "výměna hrůzných historek před stany přátel,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.1: "vědomí, že kdybych je požádal, následovali by mě až [ROOT.Char.random_NegativeAfter],"
 ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.2: "tiché mumlání každodenně obnovovaných přísah ozývající se od jednoho stanu ke druhému,"
 ep3_laamp_flavour_ewan.0051.desc.purpose.legitimists.3: "příběhy o vítězstvích a hrdinských činech, které mí družiníci spřádají o mém návratu."
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_01: "přehrabování beden a sudů v zásobovacím stanu,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_sutler: "vyvolávání markytánů nabízejících své zboží,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_smithy: "ozvěna pronikavého řinčení oceli o ocel z kovárny,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.supply_tent_arsenal: "soustředěné přepočítávání všech zásob zbraní a výzbroje ve zbrojnici,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_01: "směsice výkřiků a nucené zdvořilosti ozývající se z holičského stanu,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_surgeons_tools: "sotva potlačované výkřiky doprovázející to, co se v holičském stanu vydává za chirurgii,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_dentists_tools: "hrdelní nářek družiníků, jejichž zkažené zuby právě poznávají kleště a pár pevných rukou,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.barber_tent_torturers_tools: "ochraptělé výkřiky vězňů, jejichž tábor stojí až příliš blízko holičského stanu,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_01: "chaos a zmatek doprovázející rozbalování trénu po celém dni na cestě,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_ample_steeds: "řehtání celého zástupu našich koní,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_porters: "žerty a hekání nosičů vláčejících své náklady z místa na místo,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_trackers: "tiché skupinky lovců pohybující se jako jeden muž mezi stany a táborovými cestami,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_kennel: "štěkot a kňučení z kotců,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_siege_engineers: "neustálé vrzání vozu ženistů, který sténá pod vahou vlastních zásob,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_shrine: "nekončící řada věřících vinoucí se kolem přenosné svatyně,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_scribes: "suchý humor a jízlivé postřehy četných písařů, kteří se jinak bez valného užitku potulují kolem,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_bartering_grounds: "pokřikování obchodníků i družiníků na tržišti,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_ransom_cages: "výkřiky a tiché sténání vězňů v kládách a klecích,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.baggage_train_pleasure_tents: "stálý proud lidí vracejících se od stanu rozkoší s přihlouplými úsměvy na tvářích,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_01: "hluk hladových družiníků linoucí se z jídelního stanu,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_herbalists: "vůně bylin schnoucích na stojanech před jídelním stanem,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_brewers: "hlahol rozjařených družiníků opíjejících se čerstvě uvařeným pivem,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_bakers: "vůně kynoucího chleba připravovaného k večeři,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.mess_tent_cooks: "obvyklé hádky kuchařů o každou malichernost, kterou se jeden snaží vnutit ostatním,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_01: "vůně právě zapalovaných táborových ohňů,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_trailing_musicians: "líbezná kakofonie našich doprovodných hudebníků, kteří právě začínají hrát,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_wandering_poets: "pohoršené zalapání po dechu družiníků poslouchajících lechtivou poezii,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_capering_fools: "bláznivé skotačení šašků přebíhajících od jednoho ohně ke druhému,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_local_hangers_on: "zvědavé místní, kteří přicházejí a s obavami i úžasem si prohlížejí tolik cizinců,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_fire_juicy_rumors: "pohoršené výkřiky nad klepy, které se už začínají šířit od ohně k ohni,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_01: "vzdálené výkřiky a frustrovaný řev z cvičiště,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_horse_run: "dusot kopyt lehké jízdy pilující své umění,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_camel_run: "hromové klapání kopyt a vzdálené chraplavé hýkání velbloudů,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_elephantry_reserve: "nespokojené troubení slonů,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_nightly_barding_drills: "bručení a řinčení těžké jízdy opravující a udržující koňské zbroje,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_the_stump: "občasná salva hlasitého #EMP žuch#!, když další dávka šípů zasáhne dnešní [ROOT.Char.Custom('GetStumpName')|l],"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_personal_bouts: "vítězný řev a posměšné pokřikování kolem soubojů muže proti muži,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_training_circle: "řinčení štítu o štít z výcvikových kruhů,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_mock_battle_drills: "tlumenější vřava cvičné bitvy, při níž kopiníci pilují společnou souhru,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_the_stick_game: "občasné skutečně #EMP sprosté#! nadávky, když někdo prohraje hru s holí,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.proving_grounds_bodyguard_drills: "hrdelní řev mých osobních strážců, kteří se při výcviku vydávají ze všech sil,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_01: "štěkané rozkazy a dusot unavených nohou provázející vytyčování obvodu našeho tábora,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_fixed_layout: "tiché spory a smířené povzdechy, když pevně dané uspořádání tábora rozhoduje hádky o místo stanů za mě,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_palisade: "klepání dřeva o dřevo, jak na noc vyrůstají provizorní strážní věže,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.camp_perimeter_ditch: "zvuk lopat zakusujících se do země, zatímco dnešní hlídka cvičně hloubí zemní opevnění,"
 ep3_laamp_flavour_ewan.0051.desc.buildings.fallback: "nadšení, které přináší táboření pod širým nebem,"
 ep3_laamp_flavour_ewan.0051.desc.followers.connector: "nebo dokonce "
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.friends: "dobromyslné popichování, kterým se [courtier_friend_1.GetFirstName] a [courtier_friend_2.GetFirstName] častují cestou kolem mého pavilonu."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.best_friends: "láskyplné špičkování mezi [courtier_best_friend_1.GetFirstName] a [courtier_best_friend_2.GetFirstName], kteří jako vždy tráví večer bok po boku."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.rivals: "jedovaté výpady mezi [courtier_rival_1.GetFirstName] a [courtier_rival_2.GetFirstName], kteří se jako vždy hašteří."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.nemeses: "sotva potlačované vrčení mezi [courtier_nemesis_1.GetFirstName] a [courtier_nemesis_2.GetFirstName], kteří využívají každé příležitosti po sobě vyjet."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.lovers: "chichotání a šeptání [courtier_lover_1.GetFirstName] a [courtier_lover_2.GetFirstName], kteří kolem procházejí zavěšení do sebe při jedné ze svých obvyklých procházek."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_relations.soulmates: "přeslazené lichotky, kterými se častují [courtier_soulmate_1.GetFirstName] a [courtier_soulmate_2.GetFirstName], zatímco kolem procházejí zamilovaní jako vždy."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_children: "výskání a smích tolika dětí při hře, zatímco [leading_child.GetFirstName] kolem mě s křikem proběhne v čele honičky."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_knights: "řev [leading_knight.GetFirstName], který se rozléhá kolem při každodenních soubojích $knight_culture_player_plural_no_tooltip$."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_languages: "mnoho jazyků znějících z úst kolemjdoucích, od [culture_1.GetLanguage.GetNameNoTooltip] přes [culture_2.GetLanguage.GetNameNoTooltip] až po [culture_3.GetLanguage.GetNameNoTooltip]."
 ep3_laamp_flavour_ewan.0051.desc.followers.courtier_count.many_faiths: "zvuky večerních modliteb různých vyznání, v nichž zaznívají [faith_1.HealthGodName], [faith_2.HouseholdGodName] i [faith_3.NightGodName]."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.intro: "nezaměnitelný hlas [notable_char.GetFirstName], který právě "
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.lustful: "flirtuje s nějakým nebohým družiníkem."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.gluttonous: "se láduje čerstvou místní pochoutkou."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.temperate: "někomu hlasitě káže o nebezpečí příliš vydatné večeře."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.greedy: "přepočítává své mince — už podruhé ze tří, aby měl jistotu, že cestou žádnou neztratil."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.generous: "se směje a rozhazuje mince mezi několik šťastných družiníků."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.lazy: "se opět bez sebemenších výčitek vyvléká ze stavění vlastního stanu."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.diligent: "organizuje několik méně významných družiníků při jejich večerních povinnostech."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.wrathful: "řve na nějakého nebohého družiníka."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.calm: "uklidňuje rvačku mezi dvěma méně významnými družiníky."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.patient: "přikyvuje a souhlasně pobrukuje, zatímco jeden z místních vypráví nekonečný příběh."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.impatient: "přerušuje něčí vyprávění a žádá, ať se zatraceně konečně dostane k věci."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.arrogant: "bez okolků nahání několik méně významných družiníků, aby za něj vyřídili nějakou malichernou práci."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.humble: "se zastavuje, aby někomu pomohl postavit stan."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.deceitful: "právě vypráví důvěřivému místnímu dlouhý a nanejvýš pochybný příběh."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.honest: "vysvětluje podrážděnému místnímu jakýsi nepříjemný problém."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.gregarious: "se směje a žertuje s několika méně významnými družiníky."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.arbitrary: "zase požaduje, aby si s ním někdo vyměnil stan."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.just: "někoho hlasitě poučuje s veškerou sebejistotou, jakou by u dvora předvedl [notable_char.GetLadyLord]."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.cynical: "se posmívá něčím večerním modlitbám."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.zealous: "vede malou skupinku věřících družiníků při bohoslužbě."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.paranoid: "si něco mumlá a bručí sám pro sebe."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.trusting: "důvěřivě naslouchá dlouhému a pochybnému příběhu nějakého hlupáka."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.compassionate: "horlivě káže o tom, že prý někdo kopl do psa."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.callous: "bez jediného hnutí poslouchá srdceryvný příběh nějakého místního."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.sadistic: "se zlomyslně směje srdceryvnému příběhu nějakého místního."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.stubborn: "tvrdohlavě stojí na svém proti hloučku rozzuřených místních."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.fickle: "vede zmatenou hádku a každou druhou větu mění svůj názor."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.vengeful: "přísahá další mezigenerační krvavou mstu kvůli... čemusi."
 ep3_laamp_flavour_ewan.0051.desc.followers.notable_char.fallback: "si pro sebe pobrukuje, zatímco prochází kolem."
 ep3_laamp_flavour_ewan.0051.desc.followers.fallback.1: "vzdálené hýkání tvrdohlavých mezků odváděných na noc do ohrady."
 ep3_laamp_flavour_ewan.0051.desc.followers.fallback.2: "štěbetání zdejších ptáků, když se začíná snášet noc."
 ep3_laamp_flavour_ewan.0051.desc.followers.fallback.3: "rytmické kovové údery kolíků zatloukaných do měkké půdy všude kolem mě."
 ep3_laamp_flavour_ewan.0051.desc.outro: "\n\nTo všechno vytváří tichou, uklidňující přikrývku důvěrně známého života. Tohle je mé panství a tohle jsou mí lidé — malé království, ale takové, v němž znám každý pohled, každý zvuk i každou duši."
 ep3_laamp_flavour_ewan.0051.a: "Uchýlit se do vlastního stanu a jen poslouchat."
 ep3_laamp_flavour_ewan.0051.b: "Zkontrolovat naše zásoby."
 ep3_laamp_flavour_ewan.0051.c.bald.female: "Možná si nechám zkontrolovat tělesné šťávy?"
 ep3_laamp_flavour_ewan.0051.c.bald.male: "Možná se nechám oholit?"
 ep3_laamp_flavour_ewan.0051.c.hairy.male: "Možná se nechám oholit a ostříhat?"
 ep3_laamp_flavour_ewan.0051.c.fallback: "Možná se nechám ostříhat?"
 ep3_laamp_flavour_ewan.0051.d: "Je načase zkrotit ten chaos v trénu..."
 ep3_laamp_flavour_ewan.0051.e: "Raději si dojdu pro jídlo, než bude jídelní stan přeplněný."
 ep3_laamp_flavour_ewan.0051.f: "Myslím, že zaujmu své obvyklé místo u ohně."
 ep3_laamp_flavour_ewan.0051.g: "Noční výcvik na nikoho nečeká."
 ep3_laamp_flavour_ewan.0051.h: "Procházka podél obvodu tábora zní příjemně."
 ep3_laamp_flavour_ewan_0051_check_building_supply_tent_modifier: "Zásoby v pořádku"
 ep3_laamp_flavour_ewan_0051_check_building_supply_tent_modifier_desc: "Osobní dohled dokáže s přesností evidence udělat divy."
 ep3_laamp_flavour_ewan_0051_check_building_barber_tent_modifier: "Bez poskvrnky"
 ep3_laamp_flavour_ewan_0051_check_building_barber_tent_modifier_desc: "Život na cestách není omluvou pro zanedbávání osobní péče."
 ep3_laamp_flavour_ewan_0051_check_building_baggage_train_modifier: "Ukázněný trén"
 ep3_laamp_flavour_ewan_0051_check_building_baggage_train_modifier_desc: "Trén bývá chaotickou směsicí lidí — pokud jej ovšem někdo nedrží pevně v rukou."
 ep3_laamp_flavour_ewan_0051_check_building_mess_tent_modifier: "Jí s táborem"
 ep3_laamp_flavour_ewan_0051_check_building_mess_tent_modifier_desc: "Vůdce nemusí lámat chléb se svými družiníky, ale rozhodně to pomáhá."
 ep3_laamp_flavour_ewan_0051_check_building_camp_fire_modifier: "V čele kruhu"
 ep3_laamp_flavour_ewan_0051_check_building_camp_fire_modifier_desc: "Velitelské postavení si žádá velitelské vystupování."
 ep3_laamp_flavour_ewan_0051_check_building_proving_grounds_modifier: "Vždy při výcviku"
 ep3_laamp_flavour_ewan_0051_check_building_proving_grounds_modifier_desc: "Pevný pohled shora dokáže s kázní dělat divy."
 ep3_laamp_flavour_ewan_0051_check_building_camp_perimeter_modifier: "Dohled nad hlídkami"
 ep3_laamp_flavour_ewan_0051_check_building_camp_perimeter_modifier_desc: "Každovečerní obchůzka podél obvodu tábora drží strážné neustále ve střehu."
 ep3_laamp_flavour_ewan.0061.t: "Nečekaný jarmark"
 ep3_laamp_flavour_ewan.0061.desc: "Ne každý kraj vítá tábor, jako je ten náš, ale [current_county.GetBaseNameNoTier] nás podle všeho přijímá s otevřenou náručí — nebo alespoň [local_merchant.GetFirstName] dokázal[Select_CString(local_merchant.IsFemale, 'a', '')] takový dojem #EMP vytvořit#!, když narychlo uspořádal[Select_CString(local_merchant.IsFemale, 'a', '')] jarmark, aby prodal[Select_CString(local_merchant.IsFemale, 'a', '')] své zboží a vytáhl[Select_CString(local_merchant.IsFemale, 'a', '')] z mých družiníků jejich mince.\n\nCynické? Možná. Jenže úsměvy na tolika tvářích se přehlížejí těžko a někdy to zkrátka stačí."
 ep3_laamp_flavour_ewan.0061.tt.everyone_loves_faires: "Jarmarky má rád každý"
 ep3_laamp_flavour_ewan.0061.a: "To je ale milé překvapení!"
 ep3_laamp_flavour_ewan.0061.b: "Možná by [local_merchant.GetFirstNameNoTooltip] [Select_CString(local_merchant.IsFemale, 'ocenila', 'ocenil')] práci..."
 ep3_laamp_flavour_ewan.0061.c: "Když už jsme tady, doplníme zásoby."
 ep3_laamp_flavour_ewan.0061.d: "Stejně raději zůstanu v táboře."
 ep3_laamp_flavour_ewan.0071.t: "Dusot kopyt"
 ep3_laamp_flavour_ewan.0071.desc: "„Ugggh, moje #EMP hlava#!!“ zasténá [hanger.GetFirstName], když jede vedle mě. Při tom výkřiku jen tázavě pozvednu obočí.\n\n[hanger.GetFirstNameNoTooltip] se místo odpovědi jen sesune na hřbet svého koně, zakňučí a sevře si spánky.\n\nNěkdo měl včera večer #EMP očividně#! veselo."
 ep3_laamp_flavour_ewan.0071.a: "Kvůli [hanger.GetFirstNameNoTooltip] zpomalit."
 ep3_laamp_flavour_ewan.0071.b: "Vysmát se trápení [hanger.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.0071.c: "Popohnat koně [hanger.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.0071.d: "Pokračovat klusem a nechat [hanger.GetFirstNameNoTooltip] napospas kocovině."
 ep3_laamp_flavour_ewan.1001.t: "Přátelé z nízkých poměrů"
 ep3_laamp_flavour_ewan.1001.desc: "„[ROOT.Char.GetMotherFather|U], [ROOT.Char.GetMotherFather]!“ křičí můj potomek [own_child.GetFirstName], když ke mně přiběhne. „Chci ti někoho představit!“\n\n[own_child.GetFirstNameNoTooltip] se otočí k dalšímu dítěti a široce rozpřáhne ruce, jako by věřícím představoval[Select_CString(own_child.IsFemale, 'a', '')] [ROOT.Char.GetFaith.HighGodNamePossessive] dar, a ne ošuntěle vypadající dítě nízkého původu.\n\n„Tohle je [other_child.GetFirstName], můj nový kamarád. #EMP Jednou#! mi pomůže řídit tenhle tábor.“"
 ep3_laamp_flavour_ewan.1001.set_best_friendship: "My dva proti světu"
 ep3_laamp_flavour_ewan.1001.set_friendship: "Rodí se přátelství"
 ep3_laamp_flavour_ewan.1001.set_hidden_potential_friendship: "Oblíbený kamarád"
 ep3_laamp_flavour_ewan.1001.friendship_fizzles: "Přátelství vyšumí"
 ep3_laamp_flavour_ewan.1001.a: "Ha, tak si běžte zase hrát."
 ep3_laamp_flavour_ewan.1001.b: "Zdá se, že sis našel[Select_CString(own_child.IsFemale, 'a', '')] přítele na celý život."
 ep3_laamp_flavour_ewan.1001.c: "[own_child.GetFirstNameNoTooltip], [other_child.GetFirstNameNoTooltip] ti není roven."
 ep3_laamp_flavour_ewan.1011.t: "Učení příkladem"
 ep3_laamp_flavour_ewan.1011.desc: "[child.GetFirstName|U] je právě ve věku, kdy dítě nasává všechno kolem sebe jako houba vodu.\n\nSoučasné poměry mi sice nedovolují zajistit nejlepší možné vzdělání, ale [child.GetFirstNameNoTooltip] proto neprojevuje o nic menší chuť učit se. Namísto učitelů a knih, které by někdo s poněkud... usedlejším majetkem považoval za samozřejmost, se potuluje po táboře, drží se v patách mých důstojníků a dychtivě jim pomáhá s jejich povinnostmi.\n\nStačilo by dítě trochu nasměrovat ke správnému člověku a jeho úsilí by mohlo přinést mnohem větší užitek."
 ep3_laamp_flavour_ewan.1011.a: "Nejlépe můj zástupce."
 ep3_laamp_flavour_ewan.1011.b: "Nejlépe $quartermaster_camp_officer$."
 ep3_laamp_flavour_ewan.1011.c: "Nejlépe $armorer_camp_officer$."
 ep3_laamp_flavour_ewan.1011.d: "Nejlépe $chief_forager_camp_officer$."
 ep3_laamp_flavour_ewan.1011.e: "Nejlépe $master_thief_camp_officer$."
 ep3_laamp_flavour_ewan.1011.f: "Nejlépe $head_porter_camp_officer$."
 ep3_laamp_flavour_ewan.1011.g: "Nejlépe $head_groom_camp_officer$."
 ep3_laamp_flavour_ewan.1011.h: "Nejlépe $huntperson_camp_officer$."
 ep3_laamp_flavour_ewan.1011.i: "Nejlépe $kennelperson_camp_officer$."
 ep3_laamp_flavour_ewan.1011.j: "Nejlépe $chief_engineer_camp_officer$."
 ep3_laamp_flavour_ewan.1011.k: "Nejlépe $witness_camp_officer$."
 ep3_laamp_flavour_ewan.1011.l: "Nejlépe $person_haggler_camp_officer$."
 ep3_laamp_flavour_ewan.1011.m: "Nejlépe $camp_cook_camp_officer$."
 ep3_laamp_flavour_ewan.1011.n: "Nejlépe $master_bard_camp_officer$."
 ep3_laamp_flavour_ewan.1011.o: "Nejlépe $master_of_arms_camp_officer$."
 ep3_laamp_flavour_ewan.1011.p: "Nejlépe $master_of_spoils_camp_officer$."
 ep3_laamp_flavour_ewan.1021.t: "Láska na první tábor"
 ep3_laamp_flavour_ewan.1021.desc: "„[Select_CString(ROOT.Char.IsFemale, 'M-matko', 'O-otče')], m-mám jednu prosbu,“ zakoktá se mé dítě [child.GetFirstName]. Za [child.GetFirstNameNoTooltip] se nesměle krčí vytáhlé dítě z [crush_child.GetCulture.GetName] kultury a pevně svírá jeho ruku.\n\n„Tohle je [crush_child.GetFirstName]. M-mám [Select_CString(crush_child.IsFemale, 'ji', 'ho')] opravdu moc rád[Select_CString(child.IsFemale, 'a', '')] a chtěl[Select_CString(child.IsFemale, 'a', '')] jsem se zeptat, jestli by [Select_CString(crush_child.IsFemale, 'mohla', 'mohl')] cestovat s námi? A [Select_CString(crush_child.IsFemale, 'její', 'jeho')] rodiče samozřejmě taky, přece je tu nemůže nechat!“"
 ep3_laamp_flavour_ewan.1021.a: "Jednu rodinu navíc snad dokážeme přijmout..."
 ep3_laamp_flavour_ewan.1021.b: "Od této chvíle se s [crush_child.GetFirstNameNoTooltip] přestaneš vídat!"
 ep3_laamp_flavour_ewan.1021.c: "Je to jistě jen krátké poblouznění. Přejde tě to."
 ep3_laamp_flavour_ewan.1021.c.crush_endures: "Cit [child.GetFirstNameNoTooltip] stále plane"
 ep3_laamp_flavour_ewan.1021.c.crush_fades: "Poblouznění vyprchá"
 ep3_laamp_flavour_ewan.1031.t: "Výchova"
 ep3_laamp_flavour_ewan.1031.desc.intro: "Říká se, že děti ze všech lidí nejvíce formuje prostředí, v němž vyrůstají.\n\nMé dítě [child.GetFirstName] má tedy štěstí, že se ocitlo ve společnosti těch nej"
 ep3_laamp_flavour_ewan.1031.desc.purpose.wanderers: "věrnějších společníků, nejzajímavějších známých a nejochotnějších pomocníků"
 ep3_laamp_flavour_ewan.1031.desc.purpose.mercenaries: "ostřílenějších $knight_culture_player_plural_no_tooltip$, nelítostných žoldnéřů a houževnatých vojáků"
 ep3_laamp_flavour_ewan.1031.desc.purpose.scholars: "vzdělanějších učenců, výmluvných diplomatů a znamenitých mudrců"
 ep3_laamp_flavour_ewan.1031.desc.purpose.explorers: "ctižádostivějších dobrodruhů, pozoruhodných místních a ostřílených cestovatelů"
 ep3_laamp_flavour_ewan.1031.desc.purpose.brigands: "mazanějších zlodějů, bezohledných lapků a krutých ničemů"
 ep3_laamp_flavour_ewan.1031.desc.purpose.legitimists: "odhodlanějších věrných stoupenců, elitních osobních strážců a schopných námezdníků"
 ep3_laamp_flavour_ewan.1031.desc.outro: ", jaké se mi podařilo shromáždit.\n\nPro mladé dítě je to znamenité prostředí k dospívání a [child.GetFirstNameNoTooltip] se očividně snaží vzít si k srdci všechny lekce, které nabízí."
 ep3_laamp_flavour_ewan.1031.tt.trait_adopted: "Získaný rys"
 ep3_laamp_flavour_ewan.1031.tt.skill_gain: "Získaná dovednost"
 ep3_laamp_flavour_ewan.1031.a: "Ahhh, už [Select_CString(child.IsFemale, 'ji', 'ho')] chytila toulavá."
 ep3_laamp_flavour_ewan.1031.b: "Jednou z tebe bude [Select_CString(child.IsFemale, 'bojovnice', 'bojovník')]."
 ep3_laamp_flavour_ewan.1031.c: "Tolik nadšení v tak mladém věku!"
 ep3_laamp_flavour_ewan.1031.d: "Jen kolik divů světa asi jednou spatří..."
 ep3_laamp_flavour_ewan.1031.e: "Takový přístup se v životě neztratí."
 ep3_laamp_flavour_ewan.1031.f: "Taková ctižádost je jen přirozená."
 ep3_laamp_flavour_ewan.1031.g: "Možná bychom mohli zvážit jinou cestu?"
 ep3_laamp_flavour_ewan.1031.g.tt.success: "Vštípíš dítěti trochu moudrosti"
 ep3_laamp_flavour_ewan.1031.g.tt.failure: "Tvá ponaučení zůstanou nevyslyšena"
 ep3_laamp_flavour_ewan.1031.h: "*povzdech* [child.GetFirstNameNoTooltip], přestaň s tím."
 geterim_er: "er"
 geterim_im: "im"
 ep3_laamp_flavour_ewan.1041.t: "Stará vlast"
 ep3_laamp_flavour_ewan.1041.desc: "„[Select_CString(ROOT.Char.IsFemale, 'Matko', 'Otče')], jaké to bylo doma?“ zeptá se mě při snídani mé dítě [child.GetFirstName].\n\nNáhlá otázka mě trochu zaskočí. Chvíli se přehrabuji v misce s kaší a v myšlenkách se vracím do doby, kdy [memory.GetDescription].\n\nUž je to tolik let... Je asi jen přirozené, že někdo tak mladý jako [child.GetFirstNameNoTooltip] chce vědět, jaké to #EMP kdysi#! bývalo."
 ep3_laamp_flavour_ewan.1041.a: "Bylo tam nádherně, maličký."
 ep3_laamp_flavour_ewan.1041.a.tt.diplomacy: "Příběhy ze staré vlasti"
 ep3_laamp_flavour_ewan.1041.a.tt.stewardship: "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
 ep3_laamp_flavour_ewan.1041.a.tt.learning: "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
 ep3_laamp_flavour_ewan.1041.b: "Bylo to hrozné místo, které nás zavrhlo."
 ep3_laamp_flavour_ewan.1041.b.tt.martial: "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
 ep3_laamp_flavour_ewan.1041.b.tt.intrigue: "$ep3_laamp_flavour_ewan.1041.a.tt.diplomacy$"
 ep3_laamp_flavour_ewan.1041.c: "Jednou tu zem poznáš na vlastní oči."
 ep3_laamp_flavour_ewan.1041.d: "Možná se jednou vrátíme. Zeptej se mě potom."
 ep3_laamp_flavour_ewan.1041.e: "Nebudu o tom mluvit."
 ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate: "Touha po ztracené vlasti"
 ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier.boilerplate: "Dávná ponaučení"
 ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate$: Diplomacie"
 ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier_desc: "Tato postava miluje příběhy o vlasti, na kterou si buď jen matně vzpomíná, nebo ji dokonce nikdy neviděla."
 ep3_laamp_flavour_ewan_1041_beautiful_home_stewardship_modifier: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate$: Správcovství"
 ep3_laamp_flavour_ewan_1041_beautiful_home_stewardship_modifier_desc: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier_desc$"
 ep3_laamp_flavour_ewan_1041_beautiful_home_learning_modifier: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate$: Učenost"
 ep3_laamp_flavour_ewan_1041_beautiful_home_learning_modifier_desc: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier_desc$"
 ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier: "$ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier.boilerplate$: Válečnictví"
 ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier_desc: "Tato postava možná ke ztracené vlasti necítí žádné pouto, ale její ponaučení si přesto pamatuje."
 ep3_laamp_flavour_ewan_1041_horrible_home_intrigue_modifier: "$ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier.boilerplate$: Pletichaření"
 ep3_laamp_flavour_ewan_1041_horrible_home_intrigue_modifier_desc: "$ep3_laamp_flavour_ewan_1041_horrible_home_martial_modifier_desc$"
 ep3_laamp_flavour_ewan_1041_rightful_home_modifier: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier.boilerplate$: "
 ep3_laamp_flavour_ewan_1041_rightful_home_modifier_desc: "$ep3_laamp_flavour_ewan_1041_beautiful_home_diplomacy_modifier_desc$"
 ep3_laamp_flavour_ewan.1051.t: "To není fér"
 ep3_laamp_flavour_ewan.1051.desc: "Uražený křik [child.GetFirstName] by probudil i mrtvého.\n\n„Říkám, že to #EMP není fér#! Vůbec! Proč #EMP my#! musíme žít takhle venku? Jako nějaká... zvířata, pořád se stěhovat z místa na místo, bez paláců, bez hradů, dokonce bez pořádných postelí. O tuhle #EMP chudobu#! jsem se neprosil[Select_CString(child.IsFemale, 'a', '')] a zasloužím si něco lepšího!“\n\nPřes všechen křik a rozhořčení dokážu [ROOT.Char.Custom('SenseObserve_SenseSee')], že trápení mého dítěte je skutečné. Po obou tvářích [child.GetFirstNameNoTooltip] stékají slzy vzteku i smutku."
 ep3_laamp_flavour_ewan.1051.tt.success: "[child.GetFirstNameNoTooltip] se uklidní"
 ep3_laamp_flavour_ewan.1051.tt.failure: "[child.GetFirstNameNoTooltip] se nedá utišit"
 ep3_laamp_flavour_ewan.1051.a: "Pojď sem, děťátko, všechno bude dobré."
 ep3_laamp_flavour_ewan.1051.b: "Fér? Jsi z rodu [child.GetHouse.GetNameNoTooltip]! Narovnej se!"
 ep3_laamp_flavour_ewan.1051.c: "Já vím, ale věci jsou zkrátka takové."
 ep3_laamp_flavour_ewan.1051.d: "Nechat [child.GetFirstNameNoTooltip], ať se vyvzteká."
 ep3_laamp_flavour_ewan.1051.d.tt.annoyance_fades: "Rozmrzelost [child.GetFirstNameNoTooltip] časem opadne"
 ep3_laamp_flavour_ewan.1051.d.tt.grudge_held: "[child.GetFirstNameNoTooltip] si uchová křivdu"
 ep3_laamp_flavour_ewan.1061.t: "Rychle se učí"
 ep3_laamp_flavour_ewan.1061.desc: "Zdá se, že pobyt v kraji zvaném [current_county.GetBaseNameNoTier] mému dítěti [child.GetFirstName] prospěl.\n\nNa zdejší kultuře [child.GetFirstNameNoTooltip] cosi jednoduše #EMP fascinuje#!, a to natolik, že se během našeho krátkého pobytu dokázal[Select_CString(child.IsFemale, 'a', '')] naučit obstojně [current_county.GetProvince.GetCulture.GetLanguage.GetName]. Tímto úspěchem se teď chlubí do nebes: po táboře tím jazykem mluví při každé příležitosti a dokonce trousí jednotlivá slova a obraty do rozhovorů s lidmi nižšího postavení.\n\nSamolibé chování, jistě, ale možná k němu má důvod."
 ep3_laamp_flavour_ewan.1061.a: "Hmm, chytré dítě."
 ep3_laamp_flavour_ewan.1061.b: "Možná by mě [child.GetFirstNameNoTooltip] mohl[Select_CString(child.IsFemale, 'a', '')] také něco naučit..."
 ep3_laamp_flavour_ewan.1061.b.tt.success: "Jazyk se naučíte společně"
 ep3_laamp_flavour_ewan.1061.b.tt.failure: "Pokusíš se, ale neuspěješ"
 ep3_laamp_flavour_ewan.1061.c: "Okamžitě přestaň s tou cizáckou hatmatilkou!"
 ep3_laamp_flavour_ewan.1071.t: "Na kraji tábora"
 ep3_laamp_flavour_ewan.1071.desc.intro: "Cesta zpět od [ROOT.Char.Custom('GetRandomCampBuilding')|l] mě zavede až k okraji tábora, kde mou pozornost upoutají výkřiky a jekot hrajících si dětí.\n\nMé dítě [own_child.GetFirstName] vede několik dalších dětí. Společně právě"
 ep3_laamp_flavour_ewan.1071.desc.plains: " podnikají cvičný jezdecký útok přes rovný kus země, mávají klacíky a větvemi po neviditelných nepřátelích a ženou pomyslného protivníka na zběsilý útěk."
 ep3_laamp_flavour_ewan.1071.desc.farmlands: " šplhají na osamělý sukovitý strom, který se křivě tyčí uprostřed rolníkova pole. Starší děti už vyšplhaly mnohem výš, zatímco mladší se motají kolem kmene."
 ep3_laamp_flavour_ewan.1071.desc.hills: " se divoce kutálejí přes hlavu dolů po travnatém kopci. Příliš dovednosti v tom očividně není, ale děti přesto soutěží, kdo se dolů dostane nejrychleji."
 ep3_laamp_flavour_ewan.1071.desc.mountains: " házejí z hřebene kamínky a zkoušejí, kdo je vrhne nejdál do údolí pod sebou. Když některý doletí dál než ostatní, ozve se jásot, zatímco těm, které se zastaví ještě na dohled, se všichni smějí."
 ep3_laamp_flavour_ewan.1071.desc.desert: " se vrhají dolů z vysoké duny a rozstřikují písek na všechny strany. Kdykoli ho některému vletí do úst — což se děje často — následuje smích a hlasité #EMP pft#!, #EMP pft#!."
 ep3_laamp_flavour_ewan.1071.desc.desert_mountains: "$ep3_laamp_flavour_ewan.1071.desc.mountains$"
 ep3_laamp_flavour_ewan.1071.desc.oasis: " vyrábějí... malé balíčky písku z listí a trávy? K čemu mají sloužit, není vůbec jasn— zpoza nedaleké duny se připlíží další dítě a vzápětí se vzduchem rozletí salva písečných váčků jako zápalné nádoby."
 ep3_laamp_flavour_ewan.1071.desc.jungle: " šťouchají větví do mrtvého hada. Zvíře je nepochybně po smrti, hlavu mu nějaký dravec hrůzně utrhl, ale děti se náramně baví tím, jak ochablé tělo zvedají klacky a nechávají ho znovu padat."
 ep3_laamp_flavour_ewan.1071.desc.forest: " brání horní větve stromu před několika dětmi, které se snaží vyšplhat zdola. Jakmile se útočníci začnou dostávat výš, obránci je zasypou větvičkami, listím a chuchvalci mízy."
 ep3_laamp_flavour_ewan.1071.desc.taiga: "$ep3_laamp_flavour_ewan.1071.desc.forest$"
 ep3_laamp_flavour_ewan.1071.desc.wetlands: " si budují provizorní ostrov. Našly úzký bahnitý výběžek obklopený brakickou vodou a špinavýma rukama a shnilými klacky jej postupně oddělují od zbytku močálu."
 ep3_laamp_flavour_ewan.1071.desc.steppe: " hrají podle všeho velmi napínavou hru v kůstky. Téměř po každém hodu někdo vyhlásí nové pravidlo a ostatní bučením či jásotem hlasují, zda ho přijmou."
 ep3_laamp_flavour_ewan.1071.desc.floodplains: " svádějí bitvu bahenními koulemi se stejným zápalem jako dospělí skutečný boj. Obě strany jsou očividně ochotné položit život za... ať už vlastně bojují za cokoli."
 ep3_laamp_flavour_ewan.1071.desc.drylands: " hrají rozjařenou honičku, víří prach a ječí radostí či rozhořčením pokaždé, když někdo někoho chytí."
 ep3_laamp_flavour_ewan.1071.desc.outro: "\n\nPo chvíli si mě [own_child.GetFirstNameNoTooltip] [own_child.Custom('Saying_3p_AwareSight')]. Zářivě se na mě usměje a očividně váhá, zda odvést své spoluhráče zpět k táboru, nebo se vydat ještě o kousek dál do divočiny."
 ep3_laamp_flavour_ewan.1071.tt.every_playing_child: "Každé hrající si dítě"
 ep3_laamp_flavour_ewan.1071.a: "Zůstaňte na dohled!"
 ep3_laamp_flavour_ewan.1071.b: "Jen běžte, prozkoumávejte."
 ep3_laamp_flavour_ewan.1071.c: "Děti... stačí jim k radosti tak málo."
 ep3_laamp_flavour_ewan.1081.t: "Dospívání"
 ep3_laamp_flavour_ewan.1081.desc: "„[Select_CString(ROOT.Char.IsFemale, 'Matko', 'Otče')],“ spustí mé dítě [child.GetFirstName], když ke mně rázně přikráčí, „rozhodl[Select_CString(child.IsFemale, 'a', '')] jsem se, že když už jsem [Select_CString(child.IsFemale, 'žena', 'muž')], budu mít vlastní stan. Už se o něj s nikým dělit nebudu!“\n\n[child.GetFirstNameNoTooltip] zůstane po této řeči stát na místě a z celého postoje čiší trucovitý vzdor. Nad tím nevyprovokovaným výstupem téměř bezděčně pozvednu obočí.\n\n„Neustoupím! Jsem dospělý[Select_CString(child.IsFemale, 'á', '')] a chci, abys se mnou jako s dospělým[Select_CString(child.IsFemale, 'ou', '')] také jednal[Select_CString(ROOT.Char.IsFemale, 'a', '')]!“"
 ep3_laamp_flavour_ewan.1081.a: "Hmm, dobrá. Už jsi [Select_CString(child.IsFemale, 'žena', 'muž')]."
 ep3_laamp_flavour_ewan.1081.b: "Chceš vlastní stan? Tak si ho zasluž."
 ep3_laamp_flavour_ewan.1081.b.f: "Dáš svému dítěti úkol odpovídající tvému [Concept('education_trait','rysu vzdělání')|E]."
 ep3_laamp_flavour_ewan.1081.b.tt.success: "[child.GetFirstNameNoTooltip] uspěje"
 ep3_laamp_flavour_ewan.1081.b.tt.failure: "[child.GetFirstNameNoTooltip] na tebe neudělá dojem"
 ep3_laamp_flavour_ewan.1081.c: "Pche, jsi dítě, dokud neřeknu jinak."
 ep3_laamp_flavour_ewan.1091.t: "Povinnost každého rodiče"
 ep3_laamp_flavour_ewan.1091.desc: "„A ono mě to prostě neshodí?“ ptá se mé dítě [child.GetFirstName] a marně se snaží skrýt chvění v hlase.\n\nPohlédnu na malého poníka, na kterém sedí: nejmírnějšího a nejklidnějšího koně pro začátečníka, jakého jsem v celém táboře dokázal najít. Bál jsem se snad stejně, když mě [Select_CString(ROOT.Char.GetMotherFather == 'Mother', 'matka', 'otec')] učil jezdit?\n\n„D-dobře, tak ji jen pobídnu do klusu a...“"
 ep3_laamp_flavour_ewan.1091.tt.success: "Já jedu, [ROOT.Char.Custom('GetMumDad')], já jedu!"
 ep3_laamp_flavour_ewan.1091.tt.failure: "Ne-ne-ne-ne-NE!"
 ep3_laamp_flavour_ewan.1091.a: "Pamatuj, buď pevný, ale ohleduplný."
 ep3_laamp_flavour_ewan.1091.b: "Neboj se použít bič!"
 ep3_laamp_flavour_ewan.1091.c: "Ovládni koně, nebo shodí on tebe."
 ep3_laamp_flavour_ewan.1091.d: "Neříkat nic."
 ep3_laamp_flavour_ewan.1091.d.tt.success: "[child.GetFirstNameNoTooltip] si vede docela dobře"
 ep3_laamp_flavour_ewan.1091.d.tt.failure: "[child.GetFirstNameNoTooltip] si bez vedení neporadí"
 ep3_laamp_flavour_ewan_1091_confidence_gained_modifier: "Nabyté sebevědomí"
 ep3_laamp_flavour_ewan_1091_confidence_gained_modifier_desc: "Je úžasné, jak se člověku otevře svět, když umí jezdit na koni."
 ep3_laamp_flavour_ewan.1101.t: "Pomocná ruka"
 ep3_laamp_flavour_ewan.1101.desc: "I když tábor mění své přesné místo každých pár nocí, některé cesty vyžadují delší přesun — a s ním také podstatně víc balení.\n\nVětšina mých nosičů má plné ruce práce s následky včerejšího večírku, takže si pro změnu musím většinu věcí sbalit sám. Žalostný stav věcí, nad kterým jsem už nejednou povzdechl.\n\nNáhlé zatažení za rukáv mě upozorní na mé malé dítě [child.GetFirstName], které přede mnou drží zmuchlanou tuniku v nepříliš zdařilém pokusu pomoci."
 ep3_laamp_flavour_ewan.1101.a: "Copak to tam děláš, drobku?"
 ep3_laamp_flavour_ewan.1101.b: "Kšá, ty pohromo!"
 ep3_laamp_flavour_ewan.1103.t: "$ep3_laamp_flavour_ewan.1101.t$: Osobní rituály"
 ep3_laamp_flavour_ewan.1103.desc.child_younger: "Před námi je zítra další přesun a mí nosiči mají opět plné ruce práce, takže když vstoupím do svých soukromých prostor, najdu tam své dítě [child.GetFirstName]. Po hraní venku má [ROOT.Char.Custom('GritType')|l] snad úplně všude a právě se mi pokouší sbalit věci.\n\n„[child.Custom('GetMaMaPaPa')|U]!“ zazubí se [child.GetFirstNameNoTooltip] a rozběhne se ke mně pro objetí. V jedné špinavé ruce svírá zmačkané a zničené trosky mého oblíbeného klobouku."
 ep3_laamp_flavour_ewan.1103.desc.child_older: "Když před zítřejším přesunem vstoupím do svého stanu, vůbec mě nepřekvapí, že mé dítě [child.GetFirstName] už je uvnitř.\n\nNa mé posteli vedle [child.GetFirstNameNoTooltip] leží hromádka složeného oblečení a poněkud ledabyle navršených osobních věcí. [child.GetFirstNameNoTooltip] se ke mně hrdě otočí, aby se [Select_CString(child.IsFemale, 'pochlubila', 'pochlubil')] svou prací.\n\n„Všechno je uspořádané přesně, jak to máš [Select_CString(ROOT.Char.IsFemale, 'ráda', 'rád')], [child.Custom('GetMumDad')]. Už jsme skoro v půlce!“"
 ep3_laamp_flavour_ewan.1103.desc.child_teen: "Přestože z [child.GetFirstName] už brzy bude [Select_CString(child.IsFemale, 'žena', 'muž')], delší cesta stále znamená obvyklou návštěvu mého dítěte, které mi přijde pomoci s balením.\n\nTentokrát jsem ale rychlejší a než dospívající [child.GetFirstNameNoTooltip] dorazí, už jsem [Select_CString(ROOT.Char.IsFemale, 'začala', 'začal')].\n\n„[Select_CString(ROOT.Char.IsFemale, 'Mohla', 'Mohl')] jsi na mě počkat!“ napůl zasténá a napůl zažertuje [child.GetFirstNameNoTooltip]. Můj posměšný smích vyvolá rozhořčený výkřik a další složený kus oblečení místo do koše přiletí přímo na mou hlavu."
 ep3_laamp_flavour_ewan.1103.desc.child_adult: "Mé dítě [child.GetFirstName] se večer protáhne do mého stanu a najde mě už při balení na zítřejší cestu, i když kvůli [child.GetFirstNameNoTooltip] očividně postupuji o něco pomaleji.\n\nBeze slova se pustí do třídění mé výbavy, jen se přitom jemně usmívá a pobrukuje si známou melodii.\n\n„Nejsi už na tohle trochu [Select_CString(child.IsFemale, 'stará', 'starý')]?“ zeptám se.\n\n„Na pomoc člověku v letech není člověk nikdy příliš starý,“ odfrkne si [child.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.1103.a: "Ehm, děkuji, [child.GetFirstNameNoTooltip]. A teď se běž umýt."
 ep3_laamp_flavour_ewan.1103.b: "Rozcuchat [child.GetFirstNameNoTooltip] vlasy."
 ep3_laamp_flavour_ewan.1103.c: "Jako vždy samá pomoc!"
 ep3_laamp_flavour_ewan.1103.d: "Zasmát se a obejmout [child.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.1103.e: "[Select_CString(child.IsFemale, 'Měla', 'Měl')] bys s tím přestat, [child.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.1104.t: "$ep3_laamp_flavour_ewan.1101.t$: Drobné absence"
 ep3_laamp_flavour_ewan.1104.desc.child_dead: "Dnešní ranní přesun působí nějak... pochmurněji. Ve vzduchu visí neurčitá tíha, jakási prázdnota, kterou při pomalém balení zprvu nedokážu pojmenovat.\n\nPak mě to zasáhne jako vědro ledové vody.\n\n[child.GetFirstName|U]. Není tady. Nepomáhá mi. A už nikdy nebude."
 ep3_laamp_flavour_ewan.1104.desc.child_rival: "Sbalit si vlastní věci před zítřejším přesunem není žádná dřina, přesto mi ze rtů unikne smutný povzdech.\n\nPřipomíná mi to mé dítě [child.GetFirstName] a šťastnější časy, kdy bylo ještě malé a nic si nepřálo víc než trávit čas se mnou.\n\nKdyž se mnou ještě mluvilo. Když se na mě ještě usmívalo.\n\nTen malý zubatý úsměv..."
 ep3_laamp_flavour_ewan.1104.a: "Co jsem to [Select_CString(ROOT.Char.IsFemale, 'udělala', 'udělal')]..."
 ep3_laamp_flavour_ewan.1104.b: "Pomstím se!"
 ep3_laamp_flavour_ewan.1104.c: "#EMP Eh.#!"
 ep3_laamp_flavour_ewan.1104.d: "Pokusit se jít dál."
 ep3_laamp_flavour_ewan.1111.t: "Čich na potíže"
 ep3_laamp_flavour_ewan.1111.desc.intro: "„[Select_CString(ROOT.Char.IsFemale, 'Matko', 'Otče')]!“ vykřikne mé dítě [child.GetFirstName], přiběhne ke mně tak rychle, až mě málem porazí, a vyhrkne: „Podívej, co jsem [Select_CString(child.IsFemale, 'našla', 'našel')]! ŠTĚNĚ!“\n\n[child.GetFirstNameNoTooltip] skutečně málem mává čerstvě narozeným štěnětem, které si [Select_CString(child.IsFemale, 'zaklesla', 'zaklesl')] do ohbí paže.\n\n"
 ep3_laamp_flavour_ewan.1111.desc.has_kennels: "Rozhodně to není žádný z našich psů z kotců a"
 ep3_laamp_flavour_ewan.1111.desc.no_kennels: "[ROOT.Char.GetFaith.KnowledgeGodName] jediný ví, kde ho [child.GetFirstNameNoTooltip] [Select_CString(child.IsFemale, 'sebrala', 'sebral')], ale"
 ep3_laamp_flavour_ewan.1111.desc.outro: " navzdory nešikovnému zacházení je zvířátko očividně nadšené, že je tady. [child.GetFirstNameNoTooltip] vypadá šťastněji, než jsem [Select_CString(child.IsFemale, 'ji', 'ho')] [Select_CString(ROOT.Char.IsFemale, 'viděla', 'viděl')] celé týdny."
 ep3_laamp_flavour_ewan.1111.a: "[Select_CString(child.IsFemale, 'Děvče', 'Chlapec')] a jeho pes."
 ep3_laamp_flavour_ewan.1111.b: "Utopit štěně."
 ep3_laamp_flavour_ewan.1111.c: "#EMP Teda#!, to je ale vypasený pes. Dobrý úlovek, [child.GetFirstNameNoTooltip]!"
 ep3_laamp_flavour_ewan.1111.d: "[child.GetFirstNameNoTooltip]! Přestaň si hrát s tím špinavým vořechem!"
 ep3_laamp_flavour_ewan.2001.t: "Mnoho společného"
 ep3_laamp_flavour_ewan.2001.desc.intro: "Život v těsné blízkosti druhých má ve zvyku zesilovat dobré i špatné vztahy.\n\nNaštěstí pro [follower_1.GetFirstName] a [follower_2.GetFirstName] se jejich společná záliba v"
 ep3_laamp_flavour_ewan.2001.desc.lustful: " oplzlých vtipech a lascivních poznámkách"
 ep3_laamp_flavour_ewan.2001.desc.chaste: " tělesné zdrženlivosti a veřejně dávané cudnosti"
 ep3_laamp_flavour_ewan.2001.desc.gluttonous: " dobrém jídle a ještě lepším pití"
 ep3_laamp_flavour_ewan.2001.desc.temperate: " střídmém jídelníčku a zdravém způsobu života"
 ep3_laamp_flavour_ewan.2001.desc.greedy: " zlatě, stříbře a hromadění majetku"
 ep3_laamp_flavour_ewan.2001.desc.generous: " přednostech štědrosti a nesobeckého života"
 ep3_laamp_flavour_ewan.2001.desc.lazy: " zhoubnosti tvrdé práce a blahodárnosti pořádného zdřímnutí"
 ep3_laamp_flavour_ewan.2001.desc.diligent: " časném vstávání a svědomité dřině"
 ep3_laamp_flavour_ewan.2001.desc.wrathful: " násilí a umění pořádně řvát"
 ep3_laamp_flavour_ewan.2001.desc.calm: " zachování vzpřímeného postoje a chladné hlavy tváří v tvář nepřízni"
 ep3_laamp_flavour_ewan.2001.desc.patient: " vzájemném naslouchání a čekání na pravou chvíli"
 ep3_laamp_flavour_ewan.2001.desc.impatient: " jednání, dokud je železo žhavé, za všech okolností"
 ep3_laamp_flavour_ewan.2001.desc.arrogant: " vlastní údajné nadřazenosti"
 ep3_laamp_flavour_ewan.2001.desc.humble: " přednostech skromného vystupování a pokorného pohledu na svět"
 ep3_laamp_flavour_ewan.2001.desc.deceitful: " vymýšlení stále velkolepějších lží"
 ep3_laamp_flavour_ewan.2001.desc.honest: " vyhýbání se nástrahám lhaní za každou cenu"
 ep3_laamp_flavour_ewan.2001.desc.craven: " přežití dneška, aby se dalo bojovat zase zítra, ať to stojí cokoli"
 ep3_laamp_flavour_ewan.2001.desc.brave: " čelení výzvám — i vyzyvatelům — zpříma bez ohledu na nebezpečí"
 ep3_laamp_flavour_ewan.2001.desc.shy: " vyhýbání se hlučným společnostem a vychutnávání ticha"
 ep3_laamp_flavour_ewan.2001.desc.gregarious: " neustálém hlaholu a smíchu beznadějně společenských lidí"
 ep3_laamp_flavour_ewan.2001.desc.ambitious: " budoucích ziscích a důmyslných plánech"
 ep3_laamp_flavour_ewan.2001.desc.content: " spokojenosti se svým skromným údělem"
 ep3_laamp_flavour_ewan.2001.desc.arbitrary: " přehlížení pravidel a nařízení, jakmile se stanou nepohodlnými"
 ep3_laamp_flavour_ewan.2001.desc.just: " dodržování řádně ustanovených zákonů země — vlastně kterékoli země"
 ep3_laamp_flavour_ewan.2001.desc.cynical: " rozhodně světském pohledu na život"
 ep3_laamp_flavour_ewan.2001.desc.zealous: " bezvýhradné oddanosti, kterou v nich vzbuzuje [follower_1.GetFaith.HighGodName]"
 ep3_laamp_flavour_ewan.2001.desc.paranoid: " maření bezpočtu úkladů svých nepřátel"
 ep3_laamp_flavour_ewan.2001.desc.trusting: " vyhýbání se všem spletitostem pletich a podezírání"
 ep3_laamp_flavour_ewan.2001.desc.compassionate: " zachování laskavosti a soucitu za všech okolností"
 ep3_laamp_flavour_ewan.2001.desc.callous: " tvrdém zacházení s ostatními, protože stejně tvrdě podle nich zachází život s nimi"
 ep3_laamp_flavour_ewan.2001.desc.sadistic: " zlomyslném humoru a temnější stránce života"
 ep3_laamp_flavour_ewan.2001.desc.stubborn: " neústupném hájení svého stanoviska za každou cenu"
 ep3_laamp_flavour_ewan.2001.desc.fickle: " názorech, které se divoce mění ze dne na den"
 ep3_laamp_flavour_ewan.2001.desc.vengeful: " uchovávání každé sebemenší křivdy, která je potká"
 ep3_laamp_flavour_ewan.2001.desc.forgiving: " oproštění se od nenávisti a odpouštění těm, kdo se proti nim provinili"
 ep3_laamp_flavour_ewan.2001.desc.eccentric: " všem podivném, zvláštním a vyloženě bizarním"
 ep3_laamp_flavour_ewan.2001.desc.outro: " ukázala být opravdu silným poutem.\n\nStále častěji je vídám, jak se spolu v táboře smějí a žertují nebo jedou bok po boku na cestě."
 ep3_laamp_flavour_ewan.2001.a: "Podpořit jejich přátelství."
 ep3_laamp_flavour_ewan.2001.a.tt.success: "Rozkvétá přátelství"
 ep3_laamp_flavour_ewan.2001.a.tt.failure: "Příliš vlezlý vůdce"
 ep3_laamp_flavour_ewan.2001.b: "Pokusit se je rozdělit."
 ep3_laamp_flavour_ewan.2001.b.tt.success: "Přátelství je pokaženo"
 ep3_laamp_flavour_ewan.2001.b.tt.failure: "$ep3_laamp_flavour_ewan.2001.a.tt.failure$"
 ep3_laamp_flavour_ewan.2001.c: "Jen jim to přeji!"
 ep3_laamp_flavour_ewan.2011.t: "Táborové klepy"
 ep3_laamp_flavour_ewan.2011.desc.intro: "Není nic neobvyklého, když se tímhle — nebo vlastně kterýmkoli — táborem šíří nejrůznější zvěsti. Pikantní dohady a šeptanda o skandálech dokážou ukrátit nejeden dlouhý večer. Občas jsou dokonce pravdivé.\n\nTento týden se"
 ep3_laamp_flavour_ewan.2011.desc.affair: " mluví o údajném milostném poměru, i když otázka, #EMP kdo#! přesně s kým zahýbá, je předmětem téměř učených debat a občasného hlasitého pošklebování."
 ep3_laamp_flavour_ewan.2011.desc.petty_theft: " povídá o [victim.GetFirstName], komu prý v poslední době několikrát zmizely menší obnosy. Nejméně pár lidí tvrdí, že poblíž stanu [victim.GetFirstNameNoTooltip] zahlédli podezřelou postavu, která si zjevně vyhlédla právě [victim.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2011.desc.cruel_pranks: " probírá obzvlášť ošklivá série smůly, která pronásleduje [victim.GetFirstName]. Nepříjemné, bolestivé či trapné nehody se [victim.GetFirstNameNoTooltip] zkrátka pořád #EMP dějí#! a táborová šeptanda tvrdí, že možná vůbec nejde o nehody."
 ep3_laamp_flavour_ewan.2011.desc.nasty_rumours: " vypráví jeden paradox: o nechutných zvycích [victim.GetFirstName] koluje spousta řečí, ale několik lidí v tom cítí podraz a tvrdí, že [victim.GetFirstNameNoTooltip] je pouze obětí cíleného očerňování."
 ep3_laamp_flavour_ewan.2011.desc.hidden_feud: " šeptá, že dva lidé v našem houfu spolu vedou soukromou válku, ale oba ji pečlivě tají, aby jejich nekázeň nebyla odhalena a potrestána."
 ep3_laamp_flavour_ewan.2011.desc.outro: "\n\nNení zrovna laskavé šířit takové řeči čistě pro pobavení, ale drby už takové bývají."
 ep3_laamp_flavour_ewan.2011.a: "Zjistit, co je na tom pravdy."
 ep3_laamp_flavour_ewan.2011.a.tt.explanation: "Pokud jsou zvěsti nepravdivé, nenajdeš nic, ani když bude tvé pátrání úspěšné"
 ep3_laamp_flavour_ewan.2011.a.tt.success: "Úspěšně se dopátráš pravdy"
 ep3_laamp_flavour_ewan.2011.a.tt.failure: "Kdo může vědět, co je pravda?"
 ep3_laamp_flavour_ewan.2011.b: "Bez důkazů dát obviněním za pravdu."
 ep3_laamp_flavour_ewan.2011.c: "Nechat to být."
 ep3_laamp_flavour_ewan_2011_source_of_truth_modifier: "Zdroj pravdy"
 ep3_laamp_flavour_ewan_2011_source_of_truth_modifier_desc: "Když to říká člověk, který velí, musí to být pravda."
 ep3_laamp_flavour_ewan_2011_truth_hound_modifier: "Po stopách pravdy"
 ep3_laamp_flavour_ewan_2011_truth_hound_modifier_desc: "Tato postava je známá tím, že sleduje každou zvěst až k jejímu skutečnému původu."
 ep3_laamp_flavour_ewan.2012.t: "$ep3_laamp_flavour_ewan.2011.t$: Tajní milenci"
 ep3_laamp_flavour_ewan.2012.desc: "Důkladné pátrání v rukou schopného slídila nakonec vždy přinese ovoce.\n\nZa [ROOT.Char.Custom('GetRandomCampBuilding')|l] narazím na [lover_1.GetFirstName] a [lover_2.GetFirstName] v #EMP důvěrném#! objetí. Ve stínu se zdržím sotva okamžik, než si mě oba všimnou a začnou si ve spěchu upravovat oděv.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip], prosím, zapřísahám tě,“ pronese [lover.GetFirstNameNoTooltip] šeptem na pokraji pláče, „neprozrazuj nás ostatním v táboře — oni by to nepochopili.“"
 ep3_laamp_flavour_ewan.2012.a: "Okamžitě je odhalit."
 ep3_laamp_flavour_ewan.2012.b: "Zachovat jejich tajemství — prozatím."
 ep3_laamp_flavour_ewan.2013.t: "$ep3_laamp_flavour_ewan.2011.t$: Drobné krádeže"
 ep3_laamp_flavour_ewan.2013.desc: "K dopadení [thief.GetFirstName] při činu stačí prostá past — [victim.GetFirstName] okázale odejde od svého stanu, nechá vchod otevřený a uvnitř na stoličce úhledně vyskládané mince.\n\nPo minutě, kdy už má jistotu, že se [victim.GetFirstNameNoTooltip] hned tak nevrátí, se [thief.GetFirstNameNoTooltip] [Select_CString(thief.IsFemale, 'vyplíží', 'vyplíží')] z nedalekého úkrytu. Jenže když se otočí, stojím tam já se [ROOT.Char.Custom('ArmArms')|l] založenými na hrudi.\n\n„J-já přísahám, že to není tak, jak to vypadá! Jen jsem si z [victim.GetFirstNameNoTooltip] chtěl[Select_CString(thief.IsFemale, 'a', '')] vystřelit!“ vykřikne [thief.GetFirstNameNoTooltip]. Hlasité odfrknutí právě se vracejícího [victim.GetFirstNameNoTooltip] dává jasně najevo, že ten vtip příliš vtipný nepřipadá."
 ep3_laamp_flavour_ewan.2013.a: "Potrestat [thief.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2013.b: "Krýt [thief.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2013.c: "Zveřejnit pravdu, ale tím věc uzavřít."
 ep3_laamp_flavour_ewan.2014.t: "$ep3_laamp_flavour_ewan.2011.t$: Kruté žerty"
 ep3_laamp_flavour_ewan.2014.desc: "Stačí pár otázek a [prankster.GetFirstName] se rychle ukáže jako nejzřejmější viník — téměř před každou pozoruhodnou #EMP nehodou#!, během ní nebo po ní byl[Select_CString(prankster.IsFemale, 'a', '')] spatřen[Select_CString(prankster.IsFemale, 'a', '')] poblíž, obvykle bez valného důvodu.\n\n„Ano, párkrát jsem si z [victim.GetFirstName] vystřelil[Select_CString(prankster.IsFemale, 'a', '')]. Je na tom snad něco tak hrozného? S [victim.GetFirstNameNoTooltip] se nedá vydržet a pokud vím, pár žertíků ještě z nikoho psance neudělalo.“"
 ep3_laamp_flavour_ewan.2014.a: "Potrestat [prankster.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2014.b: "Krýt [prankster.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2014.c: "Zveřejnit pravdu, ale tím věc uzavřít."
 ep3_laamp_flavour_ewan.2015.t: "$ep3_laamp_flavour_ewan.2011.t$: Klevetník"
 ep3_laamp_flavour_ewan.2015.desc: "Netrvá dlouho a bez větších obtíží ukážu prstem na [rumourmonger.GetFirstName]. Když [rumourmonger.GetFirstNameNoTooltip] s obviněním přímo konfrontuji, bez známky lítosti se ke všemu přizná.\n\n„No a co, že jsem o tom nabubřelém [victim.Custom2('InsultNoun', SCOPE.sC('rumourmonger'))] pár věcí přehnal[Select_CString(rumourmonger.IsFemale, 'a', '')]? [victim.GetFirstNameNoTooltip] je hlupák a ničema a žádná lež o [victim.GetFirstNameNoTooltip] nemůže být horší než pravda.“\n\nZa mnou [victim.GetFirstName] vzteky div nepraskne a už už se chystá [rumourmonger.GetFirstNameNoTooltip] uškrtit."
 ep3_laamp_flavour_ewan.2015.a: "Potrestat [rumourmonger.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2015.b: "Krýt [rumourmonger.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2015.c: "Zveřejnit pravdu, ale tím věc uzavřít."
 ep3_laamp_flavour_ewan.2016.t: "$ep3_laamp_flavour_ewan.2011.t$: Skrytý svár"
 ep3_laamp_flavour_ewan.2016.desc: "Při zpětném pohledu asi mělo být zřejmé, že si [rival_1.GetFirstName] a [rival_2.GetFirstName] jdou po krku.\n\nKdyž člověk ví, čeho si všímat, známky nepřátelství mezi nimi jsou jasné jako den. Když je však oba předvolám k výslechu, #EMP trvají#! na tom, že jejich spor nijak nezasahuje do života zbytku tábora.\n\nV tak stísněných podmínkách, v jakých žijeme, to zní #EMP nepravděpodobně#!."
 ep3_laamp_flavour_ewan.2016.a: "Pokusit se je usmířit."
 ep3_laamp_flavour_ewan.2016.a.tt.success: "Napětí poleví"
 ep3_laamp_flavour_ewan.2016.a.tt.failure: "Jen to zhoršíš"
 ep3_laamp_flavour_ewan.2016.b: "Tenhle spor se nesmí rozšířit. Rozumíte?"
 ep3_laamp_flavour_ewan.2017.t: "$ep3_laamp_flavour_ewan.2011.t$: Není tu nic k vidění"
 ep3_laamp_flavour_ewan.2017.desc.affair: "Přes všechny barvité historky o nevěrách, milostných dostaveníčkách za svitu měsíce za [ROOT.Char.Custom('GetRandomCampBuilding')|l] a kradmých pohledech přes společnou večeři se zdá, že láska v [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] je... překvapivě spořádaná."
 ep3_laamp_flavour_ewan.2017.desc.petty_theft: "Přes všechny nářky [victim.GetFirstName] nedokáže žádný věrohodný svědek popsat společné rysy záhadné postavy, která má [victim.GetFirstNameNoTooltip] údajně okrádat, a dokonce ani samotný[Select_CString(victim.IsFemale, 'á', '')] [victim.GetFirstNameNoTooltip] nedokáže přesně vyčíslit své ztráty."
 ep3_laamp_flavour_ewan.2017.desc.cruel_pranks: "Musím dojít k závěru, že [victim.GetFirstName] je zkrátka [Select_CString(victim.IsFemale, 'nešikovná', 'nešikovný')], [Select_CString(victim.IsFemale, 'smolařka', 'smolař')], nebo obojí. V těch drobných pohromách není žádný společný vzorec ani smysl a neexistuje ani jasný podezřelý, který by je mohl mít všechny na svědomí."
 ep3_laamp_flavour_ewan.2017.desc.nasty_rumours: "[victim.GetFirstName|U] možná nakonec skutečně představuje jádro problému. Každá stopa vedoucí k někomu, kdo by mohl chtít [victim.GetFirstNameNoTooltip] uškodit, se při bližším zkoumání rozplyne, zatímco historek o prohřešcích [victim.GetFirstNameNoTooltip] naopak stále přibývá."
 ep3_laamp_flavour_ewan.2017.desc.hidden_feud: "Tajný spor? Představa, že by dva lidé v tomhle táboře dokázali skrývat svou zášť při večeři, natož když si navzájem znepříjemňují život, je naprosto směšná. Ne s touhle přehlídkou komediantů, se kterou cestuji."
 ep3_laamp_flavour_ewan.2017.desc.duel.won: "\n\nMé důkladné pátrání nic neodhalilo, přesto jsem spokojený[Select_CString(ROOT.Char.IsFemale, 'á', '')]. Kdyby tu bylo co najít, už bych to našel[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 ep3_laamp_flavour_ewan.2017.desc.duel.lost: "\n\nSnažil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem se ze všech sil, ale nacházím jen další zvěsti a šeptandu.\n\nLidé si zřejmě všimnou, když se [ROOT.Char.GetTitleAsNameNoTooltip] začne ve všem šťourat, a to pak vyvolá jen další nepodložené řeči."
 ep3_laamp_flavour_ewan.2017.a: "Alespoň jsem [Select_CString(ROOT.Char.IsFemale, 'spokojená', 'spokojený')]."
 ep3_laamp_flavour_ewan.2017.b: "Stejně mě to vlastně nezajímalo..."
 ep3_laamp_flavour_ewan.2021.t: "Svazek dvou"
 ep3_laamp_flavour_ewan.2021.desc: "Jako [ROOT.Char.GetTitleAsNameNoTooltip] tohoto tábora mám právo posledního slova, když si dvojice mých významnějších družiníků přeje uzavřít sňatek. Ostatně žijí pod mou ochranou, putují na zvířatech, která jim poskytuji, a jedí můj chléb.\n\nDnešní nadějnou dvojici tvoří [follower_1.GetFirstName] a [follower_2.GetFirstName] a když už je vše ostatní připraveno, čekají jen na můj souhlas — nebo zákaz."
 ep3_laamp_flavour_ewan.2021.a: "Povolím jejich sňatek."
 ep3_laamp_flavour_ewan.2021.b: "Dovolím jejich svazek, ale bez obřadu."
 ep3_laamp_flavour_ewan.2021.c: "Zakážu jim to."
 ep3_laamp_flavour_ewan.2021.c.tt: "Pouhé nařízení milencům, aby se přestali vídat, bývá málokdy zcela účinné"
 ep3_laamp_flavour_ewan.2031.t: "Už toho mám dost"
 ep3_laamp_flavour_ewan.2031.desc.intro: "„... a ty tvoje ufňukané, podlézavé řeči, pochody smrti odnikud nikam a naprostou neschopnost postarat se o nás jako [ROOT.Char.GetTitleAsNameNoTooltip]! Slyšíš mě? #EMP Končím!#!“ křičí [firebrand.GetFirstName], [firebrand.Custom('ArmArms')|l] ve vzduchu, a před davem přihlížejících divoce gestikuluje.\n\n"
 ep3_laamp_flavour_ewan.2031.desc.waverers.some: "Mnozí z mých dalších družiníků se rovněž tváří nespokojeně a zřejmě jsou připraveni odejít spolu s [firebrand.GetFirstNameNoTooltip] — #EMP pokud#! [Select_CString(firebrand.IsFemale, 'jí', 'mu')] to dovolím."
 ep3_laamp_flavour_ewan.2031.desc.waverers.none: "Ostatní moji družiníci však pro takové řeči nemají pochopení. Přes všechny [Select_CString(firebrand.IsFemale, 'její', 'jeho')] tirády o mých špatnostech mě tak urputně nenávidí jen [firebrand.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2031.tt.success.wavering_courtiers: "Všichni váhající [Concept('followers','družiníci')|E]"
 ep3_laamp_flavour_ewan.2031.tt.failure.wavering_courtiers_move_to_pool: "*$ep3_laamp_flavour_ewan.2031.tt.success.wavering_courtiers$*"
 ep3_laamp_flavour_ewan.2031.a: "Možná tě dokážu přesvědčit..."
 ep3_laamp_flavour_ewan.2031.a.tt.success: "Utišíš nespokojenost"
 ep3_laamp_flavour_ewan.2031.a.tt.failure: "[Select_CString(ROOT.Char.IsFemale, 'Bezcenná slova bezcenné ženy', 'Bezcenná slova bezcenného muže')]"
 ep3_laamp_flavour_ewan.2031.b: "Ty nikam nepůjdeš. Spoutejte [Select_CString(firebrand.IsFemale, 'ji', 'ho')]!"
 ep3_laamp_flavour_ewan.2031.c: "Odejdi, chceš-li, ale nevezmeš si nic ani nikoho."
 ep3_laamp_flavour_ewan.2031.c.tt.success: "Zastrašíš [Select_CString(firebrand.IsFemale, 'ji', 'ho')] pouhým pohledem"
 ep3_laamp_flavour_ewan.2031.c.tt.failure: "Tvá arogance mnohé přesvědčí k odchodu"
 ep3_laamp_flavour_ewan.2031.d.multi: "Tak tedy běžte. Všichni."
 ep3_laamp_flavour_ewan.2031.d.solo: "Tak tedy běž."
 ep3_laamp_flavour_ewan.2041.t: "Těsné soužití"
 ep3_laamp_flavour_ewan.2041.desc: "Mezi chaosem neustálého stěhování tábora a novými tvářemi, které se objevují a mizí skoro v každém městě, je spousta příležitostí, aby družiníci zjistili, že si nečekaně porozuměli s někým novým.\n\nSoudě podle společných vtípků, šeptání a občasného okatého vytrácení se stranou jsou [follower_1.GetFirstName] a [follower_2.GetFirstName] zjevně přesně takový případ.\n\nTy dvě hrdličky si očividně myslí, že jsou nenápadné. Nejsou."
 ep3_laamp_flavour_ewan.2041.a: "Rozdělím je."
 ep3_laamp_flavour_ewan.2041.a.tt.success: "Láska uvadla"
 ep3_laamp_flavour_ewan.2041.a.tt.failure: "Srdci neporučíš"
 ep3_laamp_flavour_ewan.2041.b: "Vlastně mi do toho nic není."
 ep3_laamp_flavour_ewan.2051.t: "A k čemu?"
 ep3_laamp_flavour_ewan.2051.desc.intro: "[smelly.GetFirstName|U] [Select_CString(smelly.IsFemale, 'se přestala koupat', 'se přestal koupat')]. Dokonce už se ani nesnaží pořádně umýt — a tuhle skutečnost mi nemilosrdně připomene několik mých družiníků, kteří mě prosí, ať zasáhnu.\n\n„Vím, co si myslíš, [ROOT.Char.GetTitleAsName], ale leností to není."
 ep3_laamp_flavour_ewan.2051.desc.diligent_and_humble: "Právě naopak! Jsem [Select_CString(smelly.IsFemale, 'prostá žena', 'prostý muž')], [Select_CString(smelly.IsFemale, 'oddaná', 'oddaný')] svým povinnostem, a den má jen tolik hodin. Proč se mýt, když mě ráno stejně znovu pokryje prach další cesty?“"
 ep3_laamp_flavour_ewan.2051.desc.athletic: "Celé dny chodím, běhám nebo jezdím, vše pro dobro tábora, takže je jen přirozené, že po všem, co tu dělám, trochu #EMP zaváním#!. Je opravdu tak špatné přestat si na tu všechnu čistotnost hrát?“"
 ep3_laamp_flavour_ewan.2051.desc.gregarious: "Na každé oslavě jsem středem pozornosti a dobře vycházím se všemi, od nejbližšího kruhu až po posledního družiníka — alespoň myslím — takže jsem pro morálku naprosto zásadní. Záleží opravdu na troše bláta a potu, když všem přináším tolik radosti?“"
 ep3_laamp_flavour_ewan.2051.desc.lazy: "Je to, ehm... snaha o vyšší účinnost? Když budu trávit méně času smýváním potu z cest, můžu toho ve skutečnosti udělat #EMP víc#!. Takhle vypadá důsledné využívání času.“"
 ep3_laamp_flavour_ewan.2051.desc.outro: "\n\n[Select_CString(smelly.IsFemale, 'Je šílená. Nebo hloupá. Nebo obojí.', 'Je šílený. Nebo hloupý. Nebo obojí.')]"
 ep3_laamp_flavour_ewan.2051.a.diligent_and_humble: "Tohle není žádná drobnost, kterou lze zanedbat."
 ep3_laamp_flavour_ewan.2051.a.athletic: "Když se pravidelně potíš, musíš se sakra i pravidelně mýt."
 ep3_laamp_flavour_ewan.2051.a.gregarious: "Sakra, mysli taky na nás ostatní!"
 ep3_laamp_flavour_ewan.2051.a.lazy: "Tvoje lenost už zašla příliš daleko!"
 ep3_laamp_flavour_ewan.2051.b: "To dává smysl."
 ep3_laamp_flavour_ewan.2051.c: "Tak prostě jeď napřed — #EMP hodně#! napřed."
 ep3_laamp_flavour_ewan_2051_is_stinker_modifier: "Páchnoucí"
 ep3_laamp_flavour_ewan_2051_is_stinker_modifier_desc: "Tato postava se navzdory četným protestům koupe jen velmi nerada."
 ep3_laamp_flavour_ewan_2051_disciplined_stinker_modifier: "Přísný zastánce hygieny"
 ep3_laamp_flavour_ewan_2051_disciplined_stinker_modifier_desc: "Tato postava nemá pochopení pro ty, kdo se po namáhavé cestě odmítají umýt."
 ep3_laamp_flavour_ewan_2051_joined_stinker_modifier: "Také páchnoucí"
 ep3_laamp_flavour_ewan_2051_joined_stinker_modifier_desc: "Tato postava se po vzoru jednoho ze svých družiníků také přestala koupat."
 ep3_laamp_flavour_ewan.2061.t: "Moje místo"
 ep3_laamp_flavour_ewan.2061.desc: "„Přestěhuj ten svůj zatracený stan, [thief.GetFirstName]! Tohle je moje místo!“ křičí [victim.GetFirstName] a vyruší mě z večerní procházky. [thief.GetFirstNameNoTooltip|U] ani nehne brvou, [thief.Custom('ArmArms')|l] na hrudi.\n\n„Nemůže to být tvoje místo, když na něm stojí #EMP můj#! stan, no ne?“ odsekne [thief.GetFirstNameNoTooltip].\n\nV zoufalé snaze dovolat se vyšší autority se [victim.GetFirstNameNoTooltip] prudce otočí ke mně: „[ROOT.Char.GetTitledFirstName], prosím, zapřísahám tě, ztrestej [Select_CString(thief.IsFemale, 'tu #EMP bídnici#!', 'toho #EMP bídáka#!')].“"
 ep3_laamp_flavour_ewan.2061.a: "Postavím se na stranu [victim.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2061.b: "Postavím se na stranu [thief.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2061.c: "Pravidla máme z nějakého důvodu, [thief.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2061.d: "Vyřešte si to mezi sebou."
 ep3_laamp_flavour_ewan.2071.t: "Zástupce"
 ep3_laamp_flavour_ewan.2071.desc.sic_exists: "Není žádným tajemstvím, že [current_sic.GetFirstName] možná není pro mě zrovna nejlepší volbou na zástupce."
 ep3_laamp_flavour_ewan.2071.desc.sic_vacant: "Už nějakou dobu je místo mého zástupce neobsazené."
 ep3_laamp_flavour_ewan.2071.desc.outro: "Nespokojenost s tímto stavem nakonec vyvřela natolik, že se o místo začali ucházet tři lidé.\n\n[candidate_1.GetFirstName] mi slibuje věrnost až do posledního dechu.\n\n[candidate_2.GetFirstName] se pro mě zjevně hodlá upracovat až k padnutí.\n\nA samozřejmě [candidate_3.GetFirstName] — ze všech v táboře má pro tuto roli nepochybně nejlepší předpoklady."
 ep3_laamp_flavour_ewan.2071.a: "Přijmu věrnost, kterou mi nabízí [candidate_1.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2071.a.tt.candidate_aptitude: "[candidate_1.GetFirstName] — [Concept('aptitude','způsobilost')|E]: [candidate_1.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
 ep3_laamp_flavour_ewan.2071.b: "Využiju toho, jak pilně [candidate_2.GetFirstNameNoTooltip] pracuje."
 ep3_laamp_flavour_ewan.2071.b.tt.candidate_aptitude: "[candidate_2.GetFirstName] — [Concept('aptitude','způsobilost')|E]: [candidate_2.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
 ep3_laamp_flavour_ewan.2071.c: "Nejlepší schopnosti má [candidate_3.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.2071.c.tt.candidate_aptitude: "[candidate_3.GetFirstName] — [Concept('aptitude','způsobilost')|E]: [candidate_3.GetCourtPositionAptitude( GetCourtPositionType( 'second_camp_officer') )]"
 ep3_laamp_flavour_ewan.2071.d.post_filled: "[current_sic.GetFirstNameNoTooltip] si svůj úřad ponechá!"
 ep3_laamp_flavour_ewan.2071.d.post_empty: "Místo zůstane neobsazené."
 ep3_laamp_flavour_ewan_2071_b_work_self_to_death_modifier: "Upracování k smrti"
 ep3_laamp_flavour_ewan_2071_b_work_self_to_death_modifier_desc: "„Odpočinek“ je výmluva, kterou si jako přepych dopřávají jen nenapravitelní lenoši."
 ep3_laamp_flavour_ewan.2081.t: "Dobře promazaný stroj"
 ep3_laamp_flavour_ewan.2081.desc.intro: "V poslední době jsme se opravdu dokonale naučili každých pár večerů znovu stavět náš malý les stanů. Nejdřív jeden, pak další a další, zatímco lidé s nástroji postupují řadami a pomáhají sousedům s rychlostí a účinností hodnou obdivu.\n\n"
 ep3_laamp_flavour_ewan.2081.desc.dislike: "Dokonce i [follower_1.GetFirstName] a [follower_2.GetFirstName], kteří spolu v minulosti málokdy našli společnou řeč, si dnes večer pomáhají a smějí se přitom jako staří přátelé."
 ep3_laamp_flavour_ewan.2081.desc.like: "[follower_1.GetFirstName] a [follower_2.GetFirstName], kteří spolu vždy vycházeli docela dobře, se dnes při vzájemné pomoci sbližují ještě víc."
 ep3_laamp_flavour_ewan.2081.desc.neutral: "Dokonce i [follower_1.GetFirstName] a [follower_2.GetFirstName], kteří se obvykle nepohybují ve stejných kruzích, dnes při vzájemné pomoci sehraně pracují bok po boku."
 ep3_laamp_flavour_ewan.2081.desc.outro: "\n\nVšechno má své místo a všechno je na svém místě."
 ep3_laamp_flavour_ewan.2081.a: "Nepotřebujete ještě jednu ruku?"
 ep3_laamp_flavour_ewan.2081.b: "Až tady skončíte, běžte mi pomoct postavit pavilon."
 ep3_laamp_flavour_ewan.2081.c: "Hmm... tohle se mi nelíbí. Rozdělte je."
 ep3_laamp_flavour_ewan.2081.d: "Tak to má být."
 ep3_laamp_flavour_ewan.2081.e: "Je dobře, že ti dva spolu vycházejí!"
 ep3_laamp_flavour_ewan_2081_d_well_oiled_operation_modifier: "Hladký chod"
 ep3_laamp_flavour_ewan_2081_d_well_oiled_operation_modifier_desc: "Tábor této postavy se přesouvá hladce jako dobře promazaný mechanismus trebuchetu."
 ep3_laamp_flavour_ewan.2091.t: "Zločiny z vášně"
 ep3_laamp_flavour_ewan.2091.desc: "U táborového ohně spolu několik družiníků večeří.\n\nKupodivu mezi nimi sedí i [Select_CString(attacker.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('attacker'))] [attacker.GetFirstName] a [Select_CString(defender.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('defender'))] [defender.GetFirstName] — přestože se vzájemně nesnášejí.\n\n[defender.GetFirstNameNoTooltip|U] si něco zamumlá pro sebe. Ať je to cokoli, [attacker.GetFirstNameNoTooltip] to přivede k slepé zuřivosti. Ocel se zableskne. Každou chvíli poteče krev."
 ep3_laamp_flavour_ewan.2091.tt.duel_commences: "[attacker.GetFirstName] a [defender.GetFirstName] se okamžitě utkají v souboji na život a na smrt"
 ep3_laamp_flavour_ewan.2091.a: "Zasáhnu."
 ep3_laamp_flavour_ewan.2091.a.tt.success: "Zastavíš je"
 ep3_laamp_flavour_ewan.2091.a.tt.failure: "Několik ran přesto padne"
 ep3_laamp_flavour_ewan.2091.b: "Proč to nevyřešit pořádným duelem?"
 ep3_laamp_flavour_ewan.2091.c: "Zatkněte [attacker.GetFirstNameNoTooltip]! Do klády!"
 ep3_laamp_flavour_ewan.2091.d: "Nechám je, ať si to vyřídí."
 ep3_laamp_flavour_ewan.2092.tt.attacker_won: "[attacker.GetFirstNameNoTooltip] vítězí"
 ep3_laamp_flavour_ewan.2092.tt.attacker_won.tt: "[attacker.GetFirstNameNoTooltip|U] zabije [defender.GetFirstName]"
 ep3_laamp_flavour_ewan.2092.tt.defender_won: "[defender.GetFirstNameNoTooltip] vítězí"
 ep3_laamp_flavour_ewan.2092.tt.defender_won.tt: "[defender.GetFirstNameNoTooltip|U] zabije [attacker.GetFirstName] v sebeobraně"
 ep3_laamp_flavour_ewan.3001.t: "Slyšeli o tobě"
 ep3_laamp_flavour_ewan.3001.desc.intro: "Poblíž stojí [ROOT.Char.Custom('GetRandomCampBuilding')]. Za strážným vstupuji do matně osvětleného stanu, kde na mě čeká trojice otrhaných místních. Všichni tři [ROOT.Char.Custom('SenseObserve_SeemLook')] nervózní, jako by už samotná jejich přítomnost tady byla riskantní.\n\nJeden z nich vstane a předvede mi vskutku #EMP příšernou#! úklonu. „Zdravím vás! Vy jste [ROOT.Char.GetLadyLord], že jo? Já jsem [brains.GetFirstName]. [Select_CString(brawn.IsFemale, 'Ta velká', 'Ten velkej')] [brawn.Custom('GetLassLad')] je [brawn.GetFirstName] a támhleto je [fingers.GetFirstName]. Přišli jsme se přidat.“\n\n"
 ep3_laamp_flavour_ewan.3001.desc.legendary: "„V jádru jsme umělci — ať už s nožem, oprátkou nebo šípem na tětivě — a vy jste [ROOT.Char.Custom('MistressMaster')] přesně podle našeho gusta.“"
 ep3_laamp_flavour_ewan.3001.desc.exalted: "„Myslíme svou práci vážně, a to znamená nenechat si kvůli pýše ujít životní příležitost. Vezměte nás s sebou a ukradneme vám celý svět.“"
 ep3_laamp_flavour_ewan.3001.desc.illustrious: "„V tomhle rybníku jsme byli největší ryby — až do vašeho příchodu. Ne že by nám to vadilo. Kšeft je kšeft a nemá smysl soupeřit, když můžeme pracovat spolu.“"
 ep3_laamp_flavour_ewan.3001.desc.distinguished: "„Od chvíle vašeho příchodu o vás pořád slyšíme a myslíme, že bychom se vám při vašich podnicích mohli opravdu hodit.“"
 ep3_laamp_flavour_ewan.3001.desc.established: "„Jsme dříči — teda aspoň v našem #EMP oboru#! — a jak to vidíme my, pomoc s budováním jména a plněním měšce by se vám hodila.“"
 ep3_laamp_flavour_ewan.3001.desc.disgraced: "„My jsme, ehm... se zákonem už měli trochu moc potíží. [current_county.GetBaseNameNoTier] pro nás po všech těch opletačkách už není zrovna bezpečné místo a hledáme jakoukoli cestu pryč. Vaše banda nám přišla stejně dobrá jako kterákoli jiná.“"
 ep3_laamp_flavour_ewan.3001.a: "Jasně, vezmeme vás..."
 ep3_laamp_flavour_ewan.3001.b: "... ale nejdřív něco nasypete do #EMP společné kasy#!."
 ep3_laamp_flavour_ewan.3001.b.tt.success: "Vysypou ti celý svůj lup"
 ep3_laamp_flavour_ewan.3001.b.tt.failure: "Takže mezi zloději přece jen není čest!"
 ep3_laamp_flavour_ewan.3001.c: "Heh, táhněte odsud, prašivci."
 ep3_laamp_flavour_ewan.3011.t: "Přít se o všechno"
 ep3_laamp_flavour_ewan.3011.desc: "Kde jsou názory, tam jsou i spory.\n\nPro každé shromáždění více než dvou lidí učeného založení je to prostá životní pravda a [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] má takových lidí rozhodně víc než dva.\n\nTohoto krásného večera se současně vedou dvě — a značně hlasité — debaty. [eloquent_follower.GetFirstName] rozebírá rétoriku a vytříbenou politiku, zatímco [wise_follower.GetFirstName] se věnuje dějinám a filosofické moudrosti."
 ep3_laamp_flavour_ewan.3011.a: "[eloquent_follower.GetFirstNameNoTooltip] zní zajímavě..."
 ep3_laamp_flavour_ewan.3011.a.tt.success: "Debata, na kterou se nezapomíná"
 ep3_laamp_flavour_ewan.3011.a.tt.failure: "Vytříbená slova a uhlazené řeči"
 ep3_laamp_flavour_ewan.3011.b: "Duch [wise_follower.GetFirstNamePossessiveNoTooltip] mě jistě podnítí!"
 ep3_laamp_flavour_ewan.3011.b.tt.success: "Poučná rozprava"
 ep3_laamp_flavour_ewan.3011.b.tt.failure: "Zábavné bloumání od tématu k tématu"
 ep3_laamp_flavour_ewan.3011.c: "Vychutnám si ten učený chaos."
 ep3_laamp_flavour_ewan.3011.d: "Budu jen souhlasně přikyvovat."
 ep3_laamp_flavour_ewan_3011_d_presiding_over_lively_debates_modifier: "Předsedání živým debatám"
 ep3_laamp_flavour_ewan_3011_d_presiding_over_lively_debates_modifier_desc: "Je až překvapivé, jak hluční dokážou učenci být, když se do toho opravdu opřou."
 ep3_laamp_flavour_ewan_3011_d_presiding_over_debates_modifier: "Předsedání debatám"
 ep3_laamp_flavour_ewan_3011_d_presiding_over_debates_modifier_desc: "I trocha vědomostí dokáže mnoho."
 ep3_laamp_flavour_ewan.3021.t: "Za obzorem"
 ep3_laamp_flavour_ewan.3021.desc: "Sedím ve svém stanu a probírám se kronikami, mapami a rukopisy popisujícími exotická a vzdálená království. Jak lákavé příběhy vyprávějí, jak #EMP podivuhodná#! místa tento svět skrývá...\n\nZajímalo by mě, zda tamní lidé slýchají podobné příběhy o nás. Čtu pouhé pověsti, nebo pravdivá — a fantastická — líčení míst zdánlivě vzdálených zraku [ROOT.Char.GetFaith.HighGodNamePossessive]?"
 ep3_laamp_flavour_ewan.3021.tt.kingdom_1.contracts_appear: "[kingdom_1.GetDefinitiveName] nabídne několik velmi výnosných zakázek"
 ep3_laamp_flavour_ewan.3021.tt.kingdom_2.contracts_appear: "[kingdom_2.GetDefinitiveName] nabídne několik velmi výnosných zakázek"
 ep3_laamp_flavour_ewan.3021.tt.kingdom_3.contracts_appear: "[kingdom_3.GetDefinitiveName] nabídne několik velmi výnosných zakázek"
 ep3_laamp_flavour_ewan.3021.tt.success: "Jak vytříbená skladba vět"
 ep3_laamp_flavour_ewan.3021.tt.failure: "Těmhle slovům je těžké rozumět"
 ep3_laamp_flavour_ewan.3021.a: "[kingdom_1.GetBaseNameNoTierNoTooltip] mě zajímá."
 ep3_laamp_flavour_ewan.3021.b: "[kingdom_2.GetBaseNameNoTierNoTooltip] mě odjakživa láká!"
 ep3_laamp_flavour_ewan.3021.c: "[kingdom_3.GetBaseNameNoTierNoTooltip] mě fascinuje."
 ep3_laamp_flavour_ewan.3021.d: "Ještě je nad čím přemýšlet..."
 ep3_laamp_flavour_ewan.3031.t: "Právem moje"
 ep3_laamp_flavour_ewan.3031.desc.intro: "Mělo by mi to patřit.\n\nNení správné, že tu sedím v průvanu pod plachtou stanu namísto v teplé posteli svého paláce v hlavním městě. Touha získat zpět svůj majetek — své #EMP dědictví#! — ve mně každou noc plane o něco silněji a nutí mě pokračovat navzdory všem těmto... potupám.\n\nJe to ale všechno?"
 ep3_laamp_flavour_ewan.3031.desc.family_title: "[family_title.GetBaseNameNoTier] mi snad právem nenáleží?"
 ep3_laamp_flavour_ewan.3031.desc.adjacent_title: "[adjacent_title.GetBaseNameNoTier] přece logicky patří mně, ne?"
 ep3_laamp_flavour_ewan.3031.desc.memory_title: "A co to, co mi bylo ukradeno: [memory_title.GetBaseNameNoTier]?"
 ep3_laamp_flavour_ewan.3031.desc.outro: "\n\nS temnící oblohou se zachmuřuje i má mysl."
 ep3_laamp_flavour_ewan.3031.a: "[family_title.GetBaseNameNoTierNoTooltip] mi právem náleží!"
 ep3_laamp_flavour_ewan.3031.b: "[adjacent_title.GetBaseNameNoTierNoTooltip] přece přirozeně patří do mé moci..."
 ep3_laamp_flavour_ewan.3031.c: "V srdci stále platí jediné: [memory_title.GetBaseNameNoTierNoTooltip] mi náleží."
 ep3_laamp_flavour_ewan.3031.d: "Jednou získám tohle všechno a ještě víc..."
 ep3_laamp_flavour_ewan_3031_d_brooding_over_titles_modifier: "Hloubání nad tituly"
 ep3_laamp_flavour_ewan_3031_d_brooding_over_titles_modifier_desc: "Soustředěná mysl přináší mnoho výhod."
 ep3_laamp_flavour_ewan.3041.t: "Lidé z lepších časů"
 ep3_laamp_flavour_ewan.3041.desc.intro: "[Select_CString(commander.IsFemale, 'Příslušnice', 'Příslušník')] [commander.GetCulture.GetName] kultury stojí strnule v mém stanu s hlavou uctivě skloněnou.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip], jsem [commander.GetFirstName] a přivádím s sebou tolik vašich věrných stoupenců, kolik se mi podařilo shromáždit. [former_title.GetBaseNameNoTier] nyní ovládají uchvatitelé a my, vaši věrní služebníci, jsme to už nedokázali snášet —"
 ep3_laamp_flavour_ewan.3041.desc.compassionate: "vaše soucitná povaha a laskavé srdce nám vždy dokazovaly, že právě vám po právu náleží naše věrnost.“"
 ep3_laamp_flavour_ewan.3041.desc.sadistic: "bez vaší nemilosrdné spravedlnosti se zločincům daří a množí se.“"
 ep3_laamp_flavour_ewan.3041.desc.callous: "bez vaší pevné ruky a kázně upadly vaše země do rozkladu.“"
 ep3_laamp_flavour_ewan.3041.desc.wrathful: "bez vaší bojovnosti nám nepřátelé hrozí vyhlazením.“"
 ep3_laamp_flavour_ewan.3041.desc.calm: "bez vaší pevné a rozvážné ruky se vaše země řítí do záhuby.“"
 ep3_laamp_flavour_ewan.3041.desc.arrogant: "bez vaší přirozené autority zachvátil vaše země neutuchající chaos.“"
 ep3_laamp_flavour_ewan.3041.desc.humble: "bez vaší pokory se mezi námi bezuzdně šíří pýcha a krutost.“"
 ep3_laamp_flavour_ewan.3041.desc.ambitious: "bez vaší cílevědomosti a ambicí jsme jako ztracené ovce.“"
 ep3_laamp_flavour_ewan.3041.desc.content: "bez vaší moudrosti a nadhledu jsme jako divocí psi.“"
 ep3_laamp_flavour_ewan.3041.desc.arbitrary: "bez vašich rozmarů, které nás vedly, se zákon změnil v tyranii.“"
 ep3_laamp_flavour_ewan.3041.desc.just: "bez vaší spravedlnosti zemřela vláda zákona.“"
 ep3_laamp_flavour_ewan.3041.desc.fallback: "přísahali jsme vám věrnost a hodláme jí dostát, dokud si nás nevezme smrt.“"
 ep3_laamp_flavour_ewan.3041.desc.title_claimed: "\n\n„Váš nárok stále trvá: [former_title.GetBaseNameNoTierNoTooltip]. Přijměte tedy #EMP nás#! jako to, co vám po právu náleží!“"
 ep3_laamp_flavour_ewan.3041.desc.title_forsaken: "\n\n„Ať už se rozhodnete své někdejší země získat zpět, nebo ne, raději budeme sloužit vám než zůstávat tam. [former_title.GetBaseNameNoTierNoTooltip] už pro nás není domovem.“"
 ep3_laamp_flavour_ewan.3041.tt.up_to_ten_usurper_held_counties: "Až deset [Concept('counties','hrabství')|E] v držení uchvatitelů"
 ep3_laamp_flavour_ewan.3041.a.imperial: "Další vojáci pro císařskou armádu v exilu!"
 ep3_laamp_flavour_ewan.3041.a.royal: "Další vojáci pro královskou armádu v exilu!"
 ep3_laamp_flavour_ewan.3041.b: "Vaší věrnosti si cením, ale potřebuji rozvraceče."
 ep3_laamp_flavour_ewan.3041.c: "Vraťte se domů a nedopřejte uchvatitelům klid, ať jsou kdekoli."
 ep3_laamp_flavour_ewan.3041.d: "Děkuji vám, ale #EMP nepotřebuji#! vás."
 legitimist_loyalists: "Věrní legitimisté"
 ep3_laamp_flavour_ewan.3051.t: "Malování mapy"
 ep3_laamp_flavour_ewan.3051.desc: "Na kartografii je něco uklidňujícího.\n\nVzít pero a štětec, sledovat, jak pod nimi na plátně ožívají křivky a obrysy krajiny, a pohlížet na svět ze zcela nové perspektivy. Je to zkrátka příjemná činnost, které v poslední době věnuji nejeden volný večer.\n\nMé nejnovější dílo možná překonává všechna předchozí: úplná, ilustrovaná a opatřená poznámkami mapa země známé jako [kingdom.GetBaseNameNoTier]."
 ep3_laamp_flavour_ewan.3051.tt.success: "Nádherné dílo"
 ep3_laamp_flavour_ewan.3051.tt.failure: "Z tvých čmáranic mnoho nevzejde"
 ep3_laamp_flavour_ewan.3051.a: "Vytvořím věhlasné dílo!"
 ep3_laamp_flavour_ewan.3051.b: "Má mapa se proslaví po celém světě."
 ep3_laamp_flavour_ewan.3051.c: "Vždy usiluji o mistrovská díla..."
 ep3_laamp_flavour_ewan.3051.d: "Prostě si to užiju."
 handcrafted_map: "Iluminovaná mapa [kingdom.GetBaseNameNoTierNoTooltip]"
 handcrafted_map_desc.boilerplate: "Tato s láskou zhotovená mapa zachycuje celé území označované jako [kingdom.GetBaseNameNoTier], jeho pohraničí i nejvýznamnější sousedy.\n\nZvláštní pozornost je věnována"
 handcrafted_map_desc.mythic_beasts: "místním mýtům a legendám, přičemž všechna zákoutí, v nichž se podle pověstí skrývají nestvůry, šelmy a ještě podivnější tvorové, zdobí jejich vyobrazení."
 handcrafted_map_desc.geography: "zeměpisu, včetně jednotlivých oblastí, nejvýraznějších prvků zdejší krajiny a tam, kde je to možné, dokonce i přibližnému znázornění terénních výšek."
 handcrafted_map_desc.settlements: "sídlům rozesetým po krajině, od všech významných měst a městeček až po některé větší vesnice — samotné hlavní město je výrazně zvětšeno a jsou v něm vyznačeny jednotlivé čtvrti."
 handcrafted_map_desc.people.urban: "zvykům a pověsti obyvatel nejvýznamnějších měst: koho je vhodné pozvat na slavnostní večeři, kdo chová nejlepší koně, koho lze nejsnáze obrat a tak podobně."
 handcrafted_map_desc.fauna: "zdejší zvířeně, od nejmenší zvěře a nejdrobnějšího ptactva až po místní krále a královny zvířecí říše — vyobrazení mnoha z nich se tlačí na okrajích a dovádějí v každém volném kousku mapy."
 handcrafted_map_desc.flora: "zdejšímu rostlinstvu, od nejnepatrnějšího plevele až po největší košaté stromy — okraje mapy lemují husté pásy květin, z nichž každá je vykreslena do nejmenšího detailu."
 handcrafted_map_desc.government: "způsobu, jakým místní vládnou, jejich nejslavnějším panovníkům a tomu, jak ospravedlňují svou vládu. V každém rohu se krčí malý portrét některého proslulého monarchy."
 handcrafted_map_desc.tourism_sites: "zajímavým pamětihodnostem, které by mohli chtít navštívit poutníci, cestovatelé i dobrodruzi všeho druhu — významnější místa mají dokonce vlastní drobná vyobrazení."
 handcrafted_map_desc.routes: "nejkratším stezkám, nejlépe udržovaným cestám a nejbezpečnějším trasám — nejnebezpečnější oblasti jsou zřetelně označeny drobnými kresbami šelem, lapků a barbarů."
 handcrafted_map_desc.people.rural: "zvykům a pověsti obyvatel četných venkovských oblastí: kde sedláci nejtvrději smlouvají, kdo pěstuje nejlepší hrozny a kde mají lidé poněkud příliš často sklon k... důvěrným vztahům v rámci rodiny."
 ep3_laamp_flavour_ewan.3061.t: "Průvodce po..."
 ep3_laamp_flavour_ewan.3061.desc: "Ještě... pár... posledních... tahů brkem... áááá...\n\nHotovo! Úplný spisek o místních lidech a jejich zvláštnostech. Tedy dobře, úplný není, ale slova nerostou na stromech — každé se musí pracně opisovat písmeno po písmenu.\n\nA teď, jak tenhle malý zázrak učenosti pojmenovat?"
 ep3_laamp_flavour_ewan.3061.a: "„Lidé a místa.“"
 ep3_laamp_flavour_ewan.3061.b: "„Próza a poezie.“"
 ep3_laamp_flavour_ewan.3061.c: "„Rostliny a zvířata.“"
 ep3_laamp_flavour_ewan.3061.d: "Budu si dál jen čmárat své myšlenky."
 ep3_laamp_flavour_ewan_3061_peoples_and_places_modifier: "Lidé a místa"
 ep3_laamp_flavour_ewan_3061_peoples_and_places_modifier_desc: "Chceš-li lidmi manipulovat, musíš jim nejprve porozumět."
 ep3_laamp_flavour_ewan_3061_prose_and_poetry_modifier: "Próza a poezie"
 ep3_laamp_flavour_ewan_3061_prose_and_poetry_modifier_desc: "Pravý učenec je stejnou měrou dramatikem jako rétorem."
 ep3_laamp_flavour_ewan_3061_plants_and_animals_modifier: "Rostliny a zvířata"
 ep3_laamp_flavour_ewan_3061_plants_and_animals_modifier_desc: "Příroda je prvotním pramenem poznání."
 ep3_laamp_flavour_ewan.3071.t: "Místní zákon: [current_county.GetBaseNameNoTierNoTooltip]"
 ep3_laamp_flavour_ewan.3071.desc: "Přepadnou mě téměř okamžitě poté, co mám důvod vydat se do divočiny. [local_soldier.GetCulture.GetCollectiveNoun] se v houfech vyrojí z připravených úkrytů a ženou se přímo na mě a mou hrstku družiníků.\n\nJsou dobře vyzbrojení a obrnění, až příliš na nějaký náhodný útok. Nejspíš domobrana, možná vojáci něčí družiny, kteří mě přišli ztrestat za mé zločiny.\n\nÚtok vede [Select_CString(local_soldier.IsFemale, 'obrovitá žena', 'obrovitý muž')] a z plných plic na mě řve svou výzvu: „#EMP Smrt!#! #BER SMRT NEBO SLÁVA!#!“"
 ep3_laamp_flavour_ewan.3071.a: "Vyzvu jejich vůdce na souboj."
 ep3_laamp_flavour_ewan.3071.b: "Spusťte naši léčku!"
 ep3_laamp_flavour_ewan.3071.c: "Zatrubte na roh!"
 ep3_laamp_flavour_ewan.3071.c.tt.success: "Tví nedalekí vojáci se na ně vrhnou"
 ep3_laamp_flavour_ewan.3071.c.tt.failure: "Pohroma!"
 ep3_laamp_flavour_ewan.3071.d: "Snadno přejdu do protiútoku."
