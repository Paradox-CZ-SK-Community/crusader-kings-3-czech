 ep3_laamp_flavour_ewan.9531.t: "Pohřešovaný družiník: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9531.desc: "Uplynuly roky a nyní už je jasné, že se můj nepřítomný družiník [visitor.GetTitledFirstNameNicknamed] nevrátí.\n\nNevím přesně proč, ale dlouhé mlčení ve mně budí jistotu, že [visitor.GetFirstNameNoTooltip] během svého pobytu v cizině [Select_CString(visitor.IsFemale, 'zemřela', 'zemřel')].\n\nNezbývá než přestat vyhlížet návrat."
 ep3_laamp_flavour_ewan.9531.tt.follower_is_dead: "[visitor.GetTitledFirstName] [Select_CString(visitor.IsFemale, 'zemřela', 'zemřel')] během pobytu mimo [Concept('camp','tábor')|E]"
 ep3_laamp_flavour_ewan.9531.a: "Pomyšlení, že [visitor.GetFirstNameNoTooltip] už nikdy nebude mezi námi..."
 ep3_laamp_flavour_ewan.9531.b: "#EMP Ehh.#!"
 ep3_laamp_flavour_ewan.9532.t: "$ep3_laamp_flavour_ewan.9531.t$"
 ep3_laamp_flavour_ewan.9532.desc: "Ačkoli je můj družiník [visitor.GetTitledFirstNameNicknamed] pryč už celé roky, návrat jsme očekávali poměrně brzy.\n\nBohužel posel přináší zprávu, že k němu jen tak nedojde: proradný[Select_CString(imprisoner.IsFemale, 'á', '')] [imprisoner.GetTitledFirstName] drží [visitor.GetFirstNameNoTooltip] ve vězení! Chceme-li se znovu shledat, budeme muset zaplatit výkupné."
 ep3_laamp_flavour_ewan.9532.a: "Musíme [visitor.GetFirstNameNoTooltip] osvobodit!"
 ep3_laamp_flavour_ewan.9532.b: "Pokud jde o mě, [imprisoner.GetFirstNameNoTooltip] si může [visitor.GetFirstNameNoTooltip] klidně nechat."
 ep3_laamp_flavour_ewan.9533.t: "$ep3_laamp_flavour_ewan.9531.t$"
 ep3_laamp_flavour_ewan.9533.desc: "Po tolika letech odloučení jsme už začínali mít o [visitor.GetTitledFirstNameNicknamed] obavy. Návrat měl přijít už dávno.\n\nBohužel se ukázalo, že byly oprávněné. Dnes večer [visitor.GetFirstNameNoTooltip] [Select_CString(visitor.IsFemale, 'doklopýtala', 'doklopýtal')] zpět do tábora a [Select_CString(visitor.IsFemale, 'zhroutila', 'zhroutil')] se k zemi, jen žalostná troska někdejšího člověka. Co se stalo a jak se v takovém stavu vůbec podařilo najít cestu zpět k nám, nedokážu říct.\n\nA v tomto stavu mi to nedokáže říct ani [visitor.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.9533.tt.follower_is_incapable: "[visitor.GetTitledFirstName] během pobytu mimo [Concept('camp','tábor')|E] [Select_CString(visitor.IsFemale, 'získala', 'získal')] rys [GetTrait('incapable').GetName( GetNullCharacter )]"
 ep3_laamp_flavour_ewan.9533.a: "Co se proboha [visitor.GetFirstNameNoTooltip] stalo?"
 ep3_laamp_flavour_ewan.9533.b: "Neboj se, [visitor.GetFirstNameNoTooltip], postaráme se o tebe."
 ep3_laamp_flavour_ewan.9533.c: "Vyžeňte tu trosku, než ji někdo uvidí."
 ep3_laamp_flavour_ewan.9534.t: "$ep3_laamp_flavour_ewan.9531.t$"
 ep3_laamp_flavour_ewan.9534.desc: "[visitor.GetTitledFirstNameNicknamed] už měl[Select_CString(visitor.IsFemale, 'a', '')] být zpátky.\n\nTak dlouho měla[Select_CString(visitor.IsFemale, '', ' být')] cesta sotva trvat, a přesto se [visitor.GetFirstNameNoTooltip] ani [Select_CString(visitor.IsFemale, 'nevrátila', 'nevrátil')], ani neposlal[Select_CString(visitor.IsFemale, 'a', '')] jedinou zprávu. Možná ztratil[Select_CString(visitor.IsFemale, 'a', '')] naši stopu a už ji nedokáže znovu najít.\n\nAť už se stalo cokoli, zdá se být jisté, že se [visitor.GetFirstNameNoTooltip] už nikdy nevrátí."
 ep3_laamp_flavour_ewan.9534.tt.follower_is_lost: "[visitor.GetTitledFirstName] se kdesi a kdovíjak [Select_CString(visitor.IsFemale, 'ztratila', 'ztratil')] a do [Concept('camp','tábora')|E] se už nevrátí"
 ep3_laamp_flavour_ewan.9534.a: "Co se jen mohlo [visitor.GetFirstNameNoTooltip] stát..."
 ep3_laamp_flavour_ewan.9541.t.nickname_gained: "Nová přezdívka družiníka"
 ep3_laamp_flavour_ewan.9541.desc.nickname_gained: "Lidé v táboře dali [eponymee.GetFirstName] přízvisko vycházející z [Concept('personality','osobnosti')|E] a [Concept('traits','rysů')|E].\n$EFFECT_LIST_BULLET$[eponymee.GetFirstName|U] je nyní znám[Select_CString(eponymee.IsFemale, 'á', '')] jako #V [eponymee.GetFirstNameNicknamed]#!"
 ep3_laamp_flavour_ewan.9541.t.dog_gained: "Družiník získává psa"
