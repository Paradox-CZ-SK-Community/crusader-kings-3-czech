 ep3_laamp_flavour_ewan.4062.desc.intro: "Nemůžeme si dovolit čekat další noc a doufat, že té věci unikneme. Shromáždím loveckou družinu a hodlám s tím skoncovat ještě dnes ráno.\n\nStopy šelmy"
 ep3_laamp_flavour_ewan.4062.desc.tracks.canine: "jsou nezřetelné a špatně se sledují, ale nepochybně patří psovité šelmě."
 ep3_laamp_flavour_ewan.4062.desc.tracks.feline: "jsou sotva patrné, ale zdá se, že patří kočkovité šelmě."
 ep3_laamp_flavour_ewan.4062.desc.tracks.ursine: "jsou překvapivě lehké, ale zcela zjevně medvědí."
 ep3_laamp_flavour_ewan.4062.desc.tracks.hippopotomine: "jsou hluboké a... podivné. Nedokážu určit, čemu patří."
 ep3_laamp_flavour_ewan.4062.desc.tracks.crocodyline: "připomínají spíš... lidské ruce, které se vlečou po zemi pomocí prstů zakončených drápy."
 ep3_laamp_flavour_ewan.4062.desc.tracks.human: "jsou téměř neznatelné a nelze určit, čemu patří, jako by je někdo úmyslně maskoval."
 ep3_laamp_flavour_ewan.4062.desc.tracks.connector: "Po téměř hodině"
 ep3_laamp_flavour_ewan.4062.desc.terrain.major_river: "dorazíme k písečnému úseku břehu podél řeky"
 ep3_laamp_flavour_ewan.4062.desc.terrain.farmlands: "dorazíme k průrvě v dlouhém živém plotu"
 ep3_laamp_flavour_ewan.4062.desc.terrain.hills: "vystoupáme na vrchol vysokého kopce"
 ep3_laamp_flavour_ewan.4062.desc.terrain.mountains: "dorazíme na okraj strmého útesu"
 ep3_laamp_flavour_ewan.4062.desc.terrain.desert: "dorazíme k úpatí vysoké duny"
 ep3_laamp_flavour_ewan.4062.desc.terrain.desert_mountains: "$ep3_laamp_flavour_ewan.4062.desc.terrain.mountains$"
 ep3_laamp_flavour_ewan.4062.desc.terrain.oasis: "$ep3_laamp_flavour_ewan.4062.desc.terrain.desert$"
 ep3_laamp_flavour_ewan.4062.desc.terrain.jungle: "dorazíme na širokou mýtinu v džungli"
 ep3_laamp_flavour_ewan.4062.desc.terrain.forest: "dorazíme na rozlehlou lesní mýtinu"
 ep3_laamp_flavour_ewan.4062.desc.terrain.taiga: "$ep3_laamp_flavour_ewan.4062.desc.terrain.forest$"
 ep3_laamp_flavour_ewan.4062.desc.terrain.wetlands: "dorazíme na kus sušší země"
 ep3_laamp_flavour_ewan.4062.desc.terrain.steppe: "dorazíme do kamenité rokle"
 ep3_laamp_flavour_ewan.4062.desc.terrain.floodplains: "dorazíme na úzký poloostrov"
 ep3_laamp_flavour_ewan.4062.desc.terrain.drylands: "dorazíme do prašného údolí"
 ep3_laamp_flavour_ewan.4062.desc.terrain.plains: "překročíme nízký pahorek"
 ep3_laamp_flavour_ewan.4062.desc.terrain.connector: "kde stopy náhle jako by se rozplynuly.\n\n"
 ep3_laamp_flavour_ewan.4062.desc.animal.dog: "Tiché vrčení za zády mě přiměje prudce se otočit. Téměř na dosah stojí zdivočelý mastif [ROOT.Char.Custom('4061_size_adjective')], tlamu stále potřísněnou krví obětí z minulé noci. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.wolf: "Divoké vrčení za zády mě přiměje prudce se otočit. Proti nám stojí vlk [ROOT.Char.Custom('4061_size_adjective')], oči mu planou zvířecím hladem, cvaká zuby a z tlamy mu létají husté sliny. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.hyena: "Šílený chechot za zády mě přiměje prudce se otočit. Hyena [ROOT.Char.Custom('4061_size_adjective')] s tlamou potřísněnou krví a kousky lidského masa si nás hladově prohlíží. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.lion: "Za zády nám zaduní ohlušující řev a všichni se prudce otočíme. Stojí tam jediný lev [ROOT.Char.Custom('4061_size_adjective')], krátkou tlamu stále pokrytou vnitřnostmi z noční hostiny, a hladově oddechuje. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.tiger: "Mrazivý řev za zády nás všechny přiměje prudce se otočit. Tygr [ROOT.Char.Custom('4061_size_adjective')], stále páchnoucí po nočním krveprolití, na nás hladově zírá. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.leopard: "Hlasité zavrčení za zády mě přiměje otočit se na patě. Čeká tam vzteklý levhart [ROOT.Char.Custom('4061_size_adjective')], tvář i tlapy stále zalité krví. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.panther: "Hlasité zavrčení za zády mě přiměje otočit se na patě a při pohledu na černého pantera jako z onyxu téměř strnu. Po nočním lovu je stále plný adrenalinu a touhy po krvi. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.lynx: "Tiché zasyčení za zády mě přiměje otočit se na patě. Z úkrytu vystoupí rys [ROOT.Char.Custom('4061_size_adjective')], v jehož očích září téměř nepřirozená vychytralost. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.caracal: "Hlasité zavrčení za zády mě přiměje prudce se otočit. Čeká tam krví potřísněná tvář karakala [ROOT.Char.Custom('4061_size_adjective')]. Na svůj druh je až nepřirozeně vzrostlý, připomíná spíš malého lva než divokou kočku. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.bear: "Hrdelní zařvání za zády nás všechny přiměje prudce se otočit. Medvěd [ROOT.Char.Custom('4061_size_adjective')] s tlamou zalitou krví na nás hledí až příliš inteligentníma očima. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.hippo.largest: "Za zády se ozve nejhlasitější a nejzuřivější řev, jaký jsem kdy slyšel[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Prudce se otočíme a před námi stojí hroch [ROOT.Char.Custom('4061_size_adjective')]. Zuby má jako větve stromů a svalnaté tělo mohutné jako naložený vůz. Snad je to největší zvíře, s jakým se kdy kdo setkal. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.hippo.fallback: "Za zády se ozve hluboký, dunivý řev a všichni se prudce otočíme. Před námi zeje tlama hrocha [ROOT.Char.Custom('4061_size_adjective')], vyzbrojená zuby jako kyje. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.crocodile: "Hluboký hrdelní řev za zády nás všechny přiměje prudce se otočit. Čenich krokodýla [ROOT.Char.Custom('4061_size_adjective')] míří přímo na nás a stále na něm ulpívají vnitřnosti mých družiníků. $ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate$"
 ep3_laamp_flavour_ewan.4062.desc.animal.boilerplate: "Tvor, který nás vlákal do pasti, vyrazí k útoku."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_generated: "„Ty jsi [Select_CString(ROOT.Char.IsFemale, 'byla první', 'byl první')], víš?“ protáhne neznámý hlas za námi. Prudce se otočíme a spatříme [Select_CString(cannibal.IsFemale, 'ženu', 'muže')] s vlasy slepenými krví a kusy syrového masa mezi zuby. „Moje první sousto — a jaké to bylo sousto! Ale ty... ty budeš #EMP hostina!#!“ Se zbraní v ruce se na mě lidožrout[Select_CString(cannibal.IsFemale, 'ka', '')] vrhne."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.anna: "Naše téměř úplné ticho protrhne výkřik čirého vzteku. Oštěp vržený sotva z výšky kolen zasáhne jednoho člena mé družiny do spodní části páteře a okamžitě ho srazí k zemi. Prudce se otočím a spatřím krví zalitou tvář [Select_CString(cannibal.IsFemale, 'rozzuřené trpaslice', 'rozzuřeného trpaslíka')], jejíž ruce potřísněné krví svírají zbraň mířící přímo na můj rozkrok."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.secret: "„Musel[Select_CString(cannibal.IsFemale, 'a', '')] jsem. #EMP Musel[Select_CString(cannibal.IsFemale, 'a', '')]#! jsem,“ vykřikne za námi neznámý, zoufalý hlas. Prudce se otočíme a spatříme... [Select_CString(cannibal.IsFemale, 'ženu', 'muže')]? Prostě jen [Select_CString(cannibal.IsFemale, 'ženu', 'muže')] — tvář i zuby pokryté zaschlou rezavě rudou krví. „Vy neznáte ten #EMP hlad#!, neznáte — vy to #EMP nepochopíte#!!“ zaječí lidožrout[Select_CString(cannibal.IsFemale, 'ka', '')] a vrhne se na mě."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_existing.fallback: "„Ale, ale, ale,“ zachechtá se za námi neznámý hlas. Všichni se jako jeden otočíme a spatříme [Select_CString(cannibal.IsFemale, 'ženu', 'muže')], která[Select_CString(cannibal.IsFemale, '', 'ý')] svírá zbraň a šíleně se usmívá. „Koukám, že oběd se doručil sám!“ utrousí lidožrout[Select_CString(cannibal.IsFemale, 'ka', '')] a vrhne se přímo na mě."
 ep3_laamp_flavour_ewan.4062.desc.animal.cannibal_chad: "„Nechtěl jsem nikomu ublížit,“ zakňourá za námi roztřesený neznámý hlas. Prudce se otočíme a spatříme... muže? Dokonce vypadá jako nějaký knihomolský učenec. Sem a do této chvíle se vůbec nehodí. „Já jen... potřeboval jsem #EMP maso#!. A pořád ho potřebuju!“ vykřikne, náhle se mu v ruce objeví zbraň a vrhne se přímo na mě."
 ep3_laamp_flavour_ewan.4061.size_adjective.titanic: "#BER titánských rozměrů#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.colossal: "#EMP kolosálních rozměrů#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.mammoth: "#EMP mamutích rozměrů#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.huge: "#EMP obrovských rozměrů#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.large: "#EMP značných rozměrů#!"
 ep3_laamp_flavour_ewan.4061.size_adjective.sizeable: "#EMP úctyhodných rozměrů#!"
 ep3_laamp_flavour_ewan.4062.tt.success: "Bestie podlehne početní převaze"
 ep3_laamp_flavour_ewan.4062.tt.failure: "Bestie unikne"
 ep3_laamp_flavour_ewan.4062.a: "Obejděte ji a obkličte!"
 ep3_laamp_flavour_ewan.4062.b: "Do boje, bestie!"
 ep3_laamp_flavour_ewan.4062.c: "[huntsperson.GetFirstNameNoTooltip], střílej, STŘÍLEJ!"
 ep3_laamp_flavour_ewan.4062.c.tt.success: "Přímo skrz oko"
 ep3_laamp_flavour_ewan.4062.c.tt.failure: "Jen ji to ještě víc rozzuří"
 ep3_laamp_flavour_ewan.4062.d: "[kenneler.GetFirstNameNoTooltip], přiveď mi toho psa!"
 ep3_laamp_flavour_ewan.4062.d.tt.success: "Psa se podaří zkrotit"
 ep3_laamp_flavour_ewan.4062.d.tt.failure: "Hrůzná podívaná"
 ep3_laamp_flavour_ewan.4062.e: "Připrav se na smrt, obludo!"
 ep3_laamp_flavour_ewan.4064.t: "$ep3_laamp_flavour_ewan.4061.t$: Vítězný souboj"
 ep3_laamp_flavour_ewan.4064.desc: "Lidožrout[Select_CString(cannibal.IsFemale, 'ka', '')] se zhroutí na záda a ze smrtelných ran nejprve vystříkne a pak už jen vytéká krev.\n\nTakový výsledek jsem věru nečekal[Select_CString(ROOT.Char.IsFemale, 'a', '')], ale svět přesto nemůže tvrdit, že jsem neskolil[Select_CString(ROOT.Char.IsFemale, 'a', '')] lidožrouta.\n\nJak ze mě opadá napětí z boje, zbytek lovecké družiny propukne v jásot. Naposledy pohlédnu na [Select_CString(cannibal.IsFemale, 'mrtvou ženu', 'mrtvého muže')] ležící[Select_CString(cannibal.IsFemale, '', 'ho')] na zemi a vydám se domů."
 ep3_laamp_flavour_ewan.4064.a.is_cannibal: "No, teď mám #EMP já#! trochu hlad..."
 ep3_laamp_flavour_ewan.4064.a.not_cannibal: "Zvrácené šílenství."
 ep3_laamp_flavour_ewan.4071.t: "Otrokaři"
 ep3_laamp_flavour_ewan.4071.desc: "Léčka je provedena dokonale.\n\nZranitelné úzké místo v terénu umožní hordě otrokářů — s okovy a meči v rukou — vyhrnout se na nás ze dvou stran, zatímco třetí skupina zadržuje hlavní část kolony, aby nám nemohla přijít na pomoc. Jakmile neozbrojeným členům mé družiny dojde, co se děje, propuknou v křik.\n\nPokud ty zrůdy zvítězí, čeká mnohé z nás děsivý osud."
 ep3_laamp_flavour_ewan.4071.a: "Semkněte se! Semkněte se a pobijte tu verbež!"
 ep3_laamp_flavour_ewan.4071.a.tt.success: "Tví obránci vyrazí vpřed"
 ep3_laamp_flavour_ewan.4071.a.tt.failure: "Krutá řež"
 ep3_laamp_flavour_ewan.4071.b: "Vyzvu vůdce otrokářů na souboj."
 ep3_laamp_flavour_ewan.4071.c: "Usmlouvám cenu a prodám několik méně významných družiníků."
 ep3_laamp_flavour_ewan.4071.c.sale_explanation.profit: "Dostaneš [Concept('gold','zlato')|E] v množství odpovídajícím součtu [Concept('skills','dovedností')|E] pěti nejhorších [Concept('followers','družiníků')|E]"
 ep3_laamp_flavour_ewan.4071.c.sale_explanation.limitations: "Nikdo, kdo je pro tebe důležitý, mimořádně schopný, nemocný nebo zraněný, nebude prodán"
 ep3_laamp_flavour_ewan.4071.c.sale_explanation.death: "Prodej [Concept('character','postavy')|E] do otroctví ji odstraní ze hry, což se v podstatě počítá jako [Concept('character_death_death','smrt')|E]"
 ep3_laamp_flavour_ewan.4071.d: "Budu ignorovat křik a doufat v nejlepší."
 ep3_laamp_flavour_ewan.4071.d.tt.success: "[ROOT.Char.GetFaith.FateGodName] se na tebe usměje"
 ep3_laamp_flavour_ewan.4071.d.tt.failure: "Nářek mizí v noční dálce"
 ep3_laamp_flavour_ewan.4073.t: "$ep3_laamp_flavour_ewan.4071.t$: Vítězný souboj"
 ep3_laamp_flavour_ewan.4073.desc: "Smrt vůdce otrokářů vnese do nepřátelských řad vlnu panického zmatku.\n\nBitva kolem mě se obrací. Z řad nepřátel se ozývají výkřiky a vlhké chroptění, zatímco obchodníci s otroky padají po desítkách pod našimi meči. Během několika minut prorazí zadními řadami otrokářů posily z hlavní části kolony a je po všem.\n\nPohrdavým kopnutím srazím zbytky jejich vůdce tváří k zemi — přímo tam, kde leží [ROOT.Char.Custom('GritType')|l]."
 ep3_laamp_flavour_ewan.4073.a: "Takové je mé mínění o tobě, špíno."
 ep3_laamp_flavour_ewan.4081.t: "Zrozeno ze zoufalství"
 ep3_laamp_flavour_ewan.4081.desc.intro: "Zpočátku zahlédneme jen několik vyhublých rolníků z [current_county.GetCountyData.GetCulture.GetName] kultury. Objevují se v dálce nebo vykukují zpoza drobných nerovností terénu a prchají, jakmile si jich všimneme.\n\nUbíhají hodiny a plaší místní nás po celou dobu zpovzdálí sledují.\n\nPrávě když už to vypadá, že to konečně vzdali, ozve se výkřik a zpoza hřebene se na nás vyřítí zběsilý dav. S vytřeštěnýma očima a vyhublými těly"
 ep3_laamp_flavour_ewan.4081.desc.epidemic: "vypadají nemocně, bezpochyby nakažení nějakou strašlivou chorobou —"
 ep3_laamp_flavour_ewan.4081.desc.mundane: "vypadají zesláble, bezpochyby už začínají hladovět —"
 ep3_laamp_flavour_ewan.4081.desc.outro: "ne však natolik, aby nám před zahnaním nedokázali uloupit značnou část zásob."
 ep3_laamp_flavour_ewan.4081.a: "Pokusím se dav uklidnit."
 ep3_laamp_flavour_ewan.4081.a.tt.success: "Přesvědčíš dav, aby ustoupil"
 ep3_laamp_flavour_ewan.4081.a.tt.failure: "Na slovech jim pramálo záleží"
 ep3_laamp_flavour_ewan.4081.b: "Jestli chtějí zásoby, musí #EMP zaplatit!#!"
 ep3_laamp_flavour_ewan.4081.b.tt.success: "Tučný zisk"
 ep3_laamp_flavour_ewan.4081.b.tt.success.every_compassionate_or_generous_follower: "Každý [Concept('follower','družiník')|E] s rysem [GetTrait('compassionate').GetName( GetNullCharacter )] nebo [GetTrait('generous').GetName( GetNullCharacter )]"
 ep3_laamp_flavour_ewan.4081.b.tt.success.every_callous_greedy_or_sadistic_follower: "Každý [Concept('follower','družiník')|E] s rysem [GetTrait('greedy').GetName( GetNullCharacter )] nebo [GetTrait('sadistic').GetName( GetNullCharacter )]"
 ep3_laamp_flavour_ewan.4081.b.tt.failure: "Hladové šílenství"
 ep3_laamp_flavour_ewan.4081.c: "Zažeňte tu chátru zpátky."
 ep3_laamp_flavour_ewan.4081.c.tt.success: "Tví ozbrojení družiníci zlámou dost kostí"
 ep3_laamp_flavour_ewan.4081.c.tt.failure: "Všechny zastavit nedokážeš"
 ep3_laamp_flavour_ewan.4081.d: "Prostě jim dovolím vzít si trochu zásob."
 ep3_laamp_flavour_ewan.4091.t: "Noční útok"
 ep3_laamp_flavour_ewan.4091.desc: "Útočníci udeří na okraj našeho tábora uprostřed noci. Ve vzdálené záři ohňů se jen chaoticky míhají odlesky zbroje a zbraní.\n\nPokud vůbec nesou nějaké barvy, ve tmě je nelze rozeznat, ale jejich úmysl je přesto jasný. Chtějí zbavit území zvaného [current_county.GetBaseNameNoTier] naší přítomnosti, ať už živých, nebo mrtvých.\n\nTábor však není bez obránců a s rozhořčeným pokřikem se chystáme tuto místní pohromu odrazit."
 ep3_laamp_flavour_ewan.4091.a: "Do protiútoku! Za mnou!"
 ep3_laamp_flavour_ewan.4091.a.tt.success: "Taktické vítězství"
 ep3_laamp_flavour_ewan.4091.a.tt.failure: "Zkrvavení a zlomení"
 ep3_laamp_flavour_ewan.4091.b: "Vrhnout se do vřavy!"
 ep3_laamp_flavour_ewan.4091.b.tt.success: "Úspěšné řádění"
 ep3_laamp_flavour_ewan.4091.b.tt.failure: "$ep3_laamp_flavour_ewan.4091.a.tt.failure$"
 ep3_laamp_flavour_ewan.4091.c: "Schovám se před tím chaosem."
 ep3_laamp_flavour_ewan.4091.c.every_non_craven_follower: "Každý [Concept('follower','družiník')|E], který nemá rys [GetTrait('craven').GetName( GetNullCharacter )]"
 ep3_laamps.5999.t: "Zprávy z ostrova"
 ep3_laamps.5999.desc: "Můj otec byl přísný muž. S odstupem let už chápu, že mé... prohřešky vůči němu byly přijaty s humorem, jaký si zasloužily. Jeho prosba adresovaná [edward.GetTitledFirstName] byla vyslyšena, a tak jsem se ocitl[Select_CString(ROOT.Char.IsFemale, 'a', '')] zde: [location.GetName]. Špinavou práci tu dělám pro [flanders.GetTitledFirstName].\n\nUplynula však dlouhá léta a Anglie se ocitla ve víru změn. [edward.GetTitledFirstNameNoTooltip] je mrtev, [harold.GetTitledFirstName] se zmocnil trůnu a jeho nepřátelé [william.GetTitledFirstName] a [harald.GetTitledFirstName] kují plány na jeho svržení.\n\nJen doufám, že se veškeré bouře nadcházejících dnů vyhnou mé rodině a našim zemím."
 ep3_laamps.5999.a: "Musím sledovat, jak se situace vyvine."
 ep3_laamps.5999.b: "Můj osud neleží v Anglii."
 ep3_laamps.5999.b.tt: "Přidá novou [Concept('task_contract','zakázku')|E]"
 ep3_laamps.6000.t: "Osud"
 ep3_laamps.6000.intro: "Otáčím dopis v rukou a cítím jeho drsný povrch, voskovou pečeť i znak, který je do ní vtisknutý. Je to znak mého rodu: [ROOT.Char.GetHouse.GetBaseName]. Rozlomím pečeť a začnu číst.\n\nZprávy jsou vskutku chmurné."
 ep3_laamps.6000.body.alive: "Můj bratr [brother.GetFirstName] žije — a tento list skutečně napsal vlastní rukou — ale zvěsti přicházející z Normandie se ukázaly jako pravdivé."
 ep3_laamps.6000.body.dead: "Můj bratr [brother.GetFirstName] leží mrtev — prý [brother.GetDeathReasonHideKiller] — a zvěsti přicházející z Normandie se ukázaly jako pravdivé."
 ep3_laamps.6000.desc: "\n\n[harold.GetFirstName] z rodu [harold.GetHouse.GetBaseName] byl násilně sesazen a nyní je buď mrtev, nebo se skrývá. Vévoda [william.GetFirstName], levoboček ucházející se o anglický trůn, je nyní [william.GetTitledFirstNameNoTooltip] a [william.GetPrimaryTitle.GetNameNoTier] je v jeho rukou. [Select_CString(william.IsFemale, 'Už začala', 'Už začal')] rozdávat půdu svým stoupencům a vyrvávat ji z rukou poražených [ROOT.Char.GetCulture.GetCollectiveNoun].\n\n"
 ep3_laamps.6000.closing.alive: "Můj bratr mě prosí o pomoc..."
 ep3_laamps.6000.closing.dead: "Má rodina je v troskách..."
 ep3_laamps.6000.a: "V hodině nouze svou rodinu neopustím!"
 ep3_laamps.6000.a.dead: "Nevzdám se svého právoplatného dědictví!"
 ep3_laamps.6000.a.flavor: "Vydám se zpět do vlasti."
 ep3_laamps.6000.a.tt: "Vydáš se na cestu. Cíl: [ely.GetName]"
 ep3_laamps.6000.b: "Už dávno nejsem jedním z rodu [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 ep3_laamps.6000.b.tt: "@alert_icon! #alert_trial Jakmile si zvolíš tuto cestu, nebude už návratu...#!"
 ep3_laamps.6001.t: "Domove, sladký domove?"
 ep3_laamps.6001.desc: "Sotva vstoupím na někdejší pozemky své rodiny, vím, že je něco špatně. Z mlhy se vynoří beztvará hromada, nad níž ční tenká tyč. Udělám další krok a...\n\nMůj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('brother'))] [brother.GetFirstName] má hlavu nabodnutou na kůlu. Zbytek jeho těla leží pod ní v pokroucené hromadě potřísněné krví.\n\n„Kdo jsi?“ Hlas s přízvukem, který nepoznávám, mě vyleká. Otočím se a spatřím [Select_CString(frederick.IsFemale, 'ženu', 'muže')], jak ze své zbraně stírá krev a s pozvednutým obočím si mě prohlíží. „Jestli sis přišel[Select_CString(ROOT.Char.IsFemale, 'a', '')] pro tělo, za jeho odnesení ti platit nebudu.“\n\nZnovu sklopím zrak k bratrovu zohavenému, pokroucenému tělu."
 ep3_laamps.6001.a: "„Za to, co jsi tu udělal[Select_CString(frederick.IsFemale, 'a', '')], zemřeš.“"
 ep3_laamps.6001.b: "„Dávám ti jedinou možnost utéct, ty prašivý pse.“"
 ep3_laamps.6001.b.one: "[Select_CString(frederick.IsFemale, 'Žena uteče', 'Muž uteče')]"
 ep3_laamps.6001.b.one.tt: "Bez odporu získáš tělo svého bratra [brother.GetFirstNameNoTooltip]"
 ep3_laamps.6001.b.two: "[Select_CString(frederick.IsFemale, 'Žena se k tobě blíží', 'Muž se k tobě blíží')], zbraň pozvednutou k útoku"
 ep3_laamps.6001.b.two.tt: "Začne [Concept('single_combat_duel','duel')|E]"
 ep3_laamps.6003.t: "Pomsta chutná nejlépe..."
 ep3_laamps.6003.desc: "[frederick.GetFirstName] se ještě škube v posledních křečích, když mrtvolu pohrdavě překročím. [brother.GetFirstName] leží opodál a já se vrátím k jeho tělu. Časem bude vykopán hrob, odsloužena zádušní bohoslužba a uspořádán obřad na památku života, který mu byl tak krutě zkrácen. Prozatím se však večer mění v noc a já sedím a vzpomínám.\n\n[brother.GetFirstName|U] byl mírumilovný muž. Nebylo spravedlivé, aby někoho, kdo chtěl jen pokojně žít, stihl takový osud. Náhle mi hlavou probleskne neodbytné poznání.\n\n[frederick.GetCulture.GetCollectiveNoun]. [brother.GetFirstName|U] by stále žil, nebýt jich. Po celé zemi budou tisíce bratrů, tisíce sester, tisíce otců a matek, synů a dcer, #EMP všichni#! dnes v noci umírat, #EMP všichni#! kvůli těm...\n\n#EMP Prokletým. [frederick.GetCulture.GetCollectiveNounNoTooltip|U].#!"
 ep3_laamps.6003.a: "„Pomstím tě, bratře. To ti přísahám.“"
 ep3_laamps.6003.b: "Čeká na mě první z mnoha náhrad."
 ep3_laamps.6003.b.flavor: "Ta špína, co tu padla mou rukou, podle všeho nebyla úplně bez majetku..."
 ep3_laamps.6003.b.tt: "Získáš drobný [Concept('artifact','artefakt')|E]"
 ep3_laamps.6005.t: "Zpátky v močálech"
 ep3_laamps.6005.desc: "Od chvíle, kdy jsem naposledy vkročil[Select_CString(ROOT.Char.IsFemale, 'a', '')] na tuto půdu, uplynulo až příliš mnoho let. A nebylo bezdůvodné, že se mi odtud tehdy odcházelo lehce. I teď se mi bažinatá zem lepí na boty.\n\nTěmto krajům — mému domovu — se už po mnoho generací říká [Glossary('močály Fens', 'FENS_GLOSS')]. V některých místech sahá voda tak vysoko, že samotné Ely je vlastně ostrovem.\n\nNení času nazbyt. I teď [Select_CString(william.IsFemale, 'ta normanská fena svírá', 'ten normanský pes svírá')] dobrou anglosaskou půdu stále pevněji. Máme-li vůbec klást odpor, budeme potřebovat dvě životní mízy každé války: peníze a muže."
 ep3_laamps.6005.a: "Nejdřív musíme naplnit pokladnici, ať to stojí cokoli."
 ep3_laamps.6005.a.tt: "Mám dojem, že tamhle už teď vidím projíždět nějakého špatně chráněného šlechtice\..."
 ep3_laamps.6005.b: "Možná bych pro svou věc dokázal[Select_CString(ROOT.Char.IsFemale, 'a', '')] získat některého místního rytíře?"
 ep3_laamps.6005.b.tt: "A jako místní by navíc mohl velmi dobře vědět, jak se v tomto terénu nejlépe pohybovat..."
 every_fenland_holding: "Každá [Concept('holding','država')|E] v močálech Fens"
 FENS_GLOSS: "Úrodné mokřiny obklopující záliv The Wash jsou mezi místními běžně známy jako „Fens“. Leží v nich mnohé z nejvýznamnějších kostelů a katedrál v Anglii.\n\nZa součást Fenlandů jsou běžně považována následující [Concept('baronies','baronství')|E]:\n\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_lynn').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_cambridge').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_radfield').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_papworth').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_ely').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_hurstingstone').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_norman_cross').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_stamford').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_boston').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('b_peterborough').GetBaseName]"
 ep3_laamps.6010.t: "[powerful_vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_laamps.6010.desc: "Slyšel jsem o tvých činech a dobré práci, kterou odvádíš v močálech Fens.\n\nPřijď za mnou. Místem našeho setkání bude [powerful_vassal_capital.GetName]: máme mnoho k projednání."
 ep3_laamps.6010.a: "V příštích dnech mě můžeš očekávat."
 ep3_laamps.6010.a.flavor: "[powerful_vassal_capital.GetNameNoTooltip], říkáš? Raději se začnu chystat."
 ep3_laamps.6010.a.tt: "Vydáš se na cestu. Cíl: [powerful_vassal_capital.GetNameNoTooltip]."
 ep3_laamps.6010.b: "Kráčím vlastní cestou."
 ep3_laamps.6015.t: "Za Anglii"
 ep3_laamps.6015.desc: "[powerful_vassal.GetTitledFirstNameRegnal], nejmocnější ze zbývajících pánů [powerful_vassal.GetCulture.GetName] kultury, mě [Select_CString(powerful_vassal.IsFemale, 'přivítala', 'přivítal')] s otevřenou náručí. Během našich rozhovorů se řeč jen málokdy vzdálí od toho, co je nasnadě.\n\n„Tady na severu nejsme na vládu cizinců zrovna nezvyklí,“ pronese [powerful_vassal.GetFirstNameNoTooltip] a pobaveně se pousměje nad vlastní poznámkou, přičemž zamyšleně spojí konečky prstů. „Naši otcové koneckonců sloužili nejednomu Dánovi. Ale tohle... tohle je jiné.“\n\n„Hodlám se mu postavit. Tomu #EMP [william.GetFirstNameNoTooltip]#!,“ vyplivne to jméno s jedem v hlase. „Potřebuji však podporu. Věrnost téměř všech visí na vlásku.“ [powerful_vassal.GetFirstNameNoTooltip|U] ke mně pozvedne oči.\n\n„Mohu počítat s tvou pomocí?“"
 ep3_laamps.6015.a: "Máš mou podporu."
 every_direct_vassal_william: "Každý normanský [Concept('direct_vassal','přímý vazal')|E] postavy [william.GetFirstNameRegnal]"
 every_anglo_noble: "Každý anglosaský [Concept('noble','urozený')|E]"
 ep3_laamps.6015.b: "Potřebuji více času."
 ep3_laamps.6016.t: "Nešťastný konec"
 ep3_laamps.6016.frustrated: "„Právě čas nemáme!“ [powerful_vassal.GetFirstName|U] udeří do stolu, aby svým slovům dodal[Select_CString(powerful_vassal.IsFemale, 'a', '')] důraz, a tváří mu[Select_CString(powerful_vassal.IsFemale, ' jí', '')] probleskne hněv. „Už teď se šeptá o odvetě! Čím déle budeme otálet, tím více času bude mít [william.GetFirstNameNoTooltip] na shromáždění podpory.“\n\n„#EMP Musíme#! jednat rychle. Vezmi si tolik času, kolik potřebuješ, ale mohu tě jen naléhavě prosit, aby sis zvolil[Select_CString(ROOT.Char.IsFemale, 'a', '')] stranu, dokud ještě můžeš.“\n\n"
 ep3_laamps.6016.happy: "„Výborně! Přímo výborně!“ [powerful_vassal.GetFirstName] s úlevou plácne do stolu. „Sotva si dokážu představit [Select_CString(ROOT.Char.IsFemale, 'lepší spolubojovnici', 'lepšího spolubojovníka')].“ Natáhne se přes stůl a sevře mé ruce ve svých.\n\n„Společně snad ještě dokážeme tyto země vyrvat tomu normanskému hadovi. Teď však musíme jednat rychle-“\n\n"
 ep3_laamps.6016.ending: "[powerful_vassal.GetFirstNameNoTooltip|U] znovu otevře ústa, ale prudce rozražené dveře nedovolí pokračovat. Dovnitř vpadne promočený posel s vytřeštěnýma očima a dříve, než se [powerful_vassal.GetFirstNameNoTooltip] stačí rozhořčit, zamává před ním listem.\n\nČekám, zatímco [powerful_vassal.GetFirstNameNoTooltip] rozlomí pečeť a přelétne pergamen očima.\n\nZ tváře mu[Select_CString(powerful_vassal.IsFemale, ' jí', '')] pomalu mizí všechna barva."
 ep3_laamps.6016.a: "„Co se děje?“"
 ep3_laamps.6016.a.tt: "Vezmeš si nabízený list..."
 ep3_laamps.6020.t: "Pustošení severu"
 ep3_laamps.6020.desc: "Dosazení nového cizího krále — a navíc [william.GetCulture.GetName] levobočka — stačilo, aby se přetrhlo poslední roztřepené vlákno držící Anglii pohromadě. Místní povstání, podporovaná a podněcovaná poraženými a rozhořčenými anglosaskými [Glossary('Æthelingy', 'AETHELINGS_GLOSS')], se šíří zemí jako požár.\n\n[william.GetTitledFirstName] si zajistil mocenskou základnu na jihu a nyní obrací pozornost na sever, aby zpacifikoval ty, kdo jsou dost stateční a pošetilí na to, aby se mu postavili. Kam [william.GetFirstNameNoTooltip] obrátí zrak, tam přijde smrt a zkáza, a o zemi se rozpoutal zoufalý boj.\n\n[william.GetFirstNameNoTooltip] bude muset pečlivě vyvažovat mírnost a tvrdost. Přílišná shovívavost ho může stát království, ale příliš krutá odveta by mu mohla zanechat jen málo, čemu by ještě mohl vládnout.\n\nÆthelingy čeká jen smrt, nebo sláva."
 ep3_laamps.6020.a: "Osud Anglie visí na vlásku."
 AETHELINGS_GLOSS: "„Ætheling“ je anglosaský výraz označující kteréhokoli Anglosasa urozeného původu a předpona „Æthel“ se také často připojovala k jejich jménům."
 every_aetheling: "Každý $anglo_saxon$ [Concept('vassal','vazal')|E] postavy [william.GetTitledFirstName]"
 every_county: "Každé [Concept('county','hrabství')|E]"
 ep3_laamps.6021.desc: "Mé právoplatné usednutí na anglický trůn stačilo, aby se přetrhlo poslední roztřepené vlákno držící panství pohromadě. Místní povstání, podporovaná a podněcovaná poraženými a rozhořčenými anglosaskými [Glossary('Æthelingy', 'AETHELINGS_GLOSS')], se šíří zemí jako požár.\n\nKdyž jsem si zajistil[Select_CString(ROOT.Char.IsFemale, 'a', '')] mocenskou základnu na jihu, musím nyní obrátit pozornost na sever a zpacifikovat ty, kdo jsou dost stateční a pošetilí na to, aby se mi postavili. Kam obrátím zrak, tam přijde smrt a zkáza, jinak mi proradní místní mou pozici uzurpují.\n\nMusím pečlivě vyvažovat mírnost a tvrdost. Přílišná shovívavost mě může stát království, ale příliš krutá odveta by mi mohla zanechat jen málo, čemu bych ještě mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] vládnout. Pokud však jde o Æthelingy...\n\nKdo mi odmítne přísahat věrnost, nezaslouží slitování."
 ep3_laamps.7000.t: "Jiná cesta"
 ep3_laamps.7000.desc: "[england.GetName] zachvátil takový zmatek, že někdy přemýšlím, zda můj osud neleží někde jinde.\n\nOtřesy už začínají. [william.GetTitledFirstName] se zmocnil panství a mám podezření, že situace bude ještě mnohem ošklivější než teď. Život na cestách ve stopách mého otce má své kouzlo.\n\nMožná bych mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] zamířit na sever, do Skotska? Nebo snad na jih Itálie, do podhůří Apulie?"
 ep3_laamps.7000.a: "Skotsko zní jako dobrý plán."
 ep3_laamps.7000.b: "Už teď cítím chuť apulijského olivového oleje!"
 ep3_laamps.7000.c: "Nesmím zanedbat své povinnosti."
 ep3_laamps.7001.t: "Je tu ještě někdo"
 ep3_laamps.7001.desc: "„[ROOT.Char.GetFirstNameNoTooltip]? Tady žije [ROOT.Char.GetFirstNameNoTooltip]? Hej- pusťte mě, vy-“ Příchod návštěvy ohlásí burácející hlas, jehož majitele rychle obklopí mí strážní. Vyjdu ze stanu a spatřím [Select_CString(siward.IsFemale, 'statnou ženu', 'statného muže')] s mečem opřeným o rameno.\n\n„Ty! Ty jsi [ROOT.Char.GetFirstNameNoTooltip], že?“ Přikývnu a [siward.GetFirstNameNoTooltip] vykročí vpřed s nataženou volnou rukou.\n\n„Tvá pověst tě předchází! Jsem [siward.GetFirstName] z rodu [siward.GetHouse.GetBaseName]. Přišel[Select_CString(siward.IsFemale, 'a', '')] jsem se k tobě přidat.“"
 ep3_laamps.7001.a: "„[siward.GetFirstNameNoTooltip], říkáš? Vítej!“"
 ep3_laamps.7001.b: "„Obávám se, že už máme plno.“"
 ep3_laamps.7002.t: "Nová Anglie"
 ep3_laamps.7002.desc: "[siward.GetFirstName], [Select_CString(siward.IsFemale, 'má věrná', 'můj věrný')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siward'))], ke mně přistoupí s podivným zábleskem v očích.\n\n„Přišel[Select_CString(siward.IsFemale, 'a', '')] jsem se rozloučit.“ Než stačím protestovat, [siward.GetFirstNameNoTooltip] pozvedne ruku. „Už jsem se rozhodl[Select_CString(siward.IsFemale, 'a', '')], nezastavíš mě.“ Pokyne mi, abych se posadil[Select_CString(ROOT.Char.IsFemale, 'a', '')].\n\n„Z Konstantinopole přicházejí zvěsti. [emperor.GetTitledFirstName] nabízí bezpečný průchod všem uprchlíkům před hněvem [king_england.GetTitledFirstName] a příležitost začít znovu.“ [siward.GetFirstNameNoTooltip] se plácne do stehen a rozhlédne se kolem.\n\n„Bude mi to tu chybět. Sbohem, [Select_CString(ROOT.Char.IsFemale, 'sestro', 'bratře')].“"
 ep3_laamps.7002.a: "„Šťastnou cestu. Kéž najdeš klid.“"
 ep3_laamps.7002.b: "Tak to zní #EMP velmi#! zajímavě..."
 ep3_laamps.7002.c.success: "[siward.GetFirstNameNoTooltip] zůstane"
 ep3_laamps.7002.c.failure: "[siward.GetFirstNameNoTooltip] odejde"
 ep3_laamps.7003.t: "Panovnická audience"
 ep3_laamps.7003.desc: "Být přijat[Select_CString(ROOT.Char.IsFemale, 'a', '')] na audienci u postavy s titulem [emperor.GetTitleAsNameNoTooltip] není maličkost, ale můj příchod s nesourodou bandou cizinců očividně rozvázal nejeden jazyk.\n\n„Vítej, [ROOT.Char.GetFirstName] z rodu [ROOT.Char.GetHouse.GetBaseName]. Přicházíš hledat útočiště před neštěstím, které stihlo tvou vlast?“ Zmohu se jen na otupělé přikývnutí. [emperor.GetTitleAsNameNoTooltip|U] se ponuře a bez špetky humoru pousměje. „Tady budeš v bezpečí, ale na dosah máš mnohem větší věci.“\n\n„Na severovýchodě leží země, jimž vládne můj proradný vazal. Vydej se tam, zmocni se jich a výměnou za věrnost ti zůstanou.“\n\nTa slova vyvolají několik překvapených zalapání po dechu. Nové panství? Pro nás, uprchlíky?"
 ep3_laamps.7003.a: "„Tvůj návrh přijímám, [Select_CString(emperor.IsFemale, 'mocná', 'mocný')] [emperor.GetTitleAsNameNoTooltip].“"
 ep3_laamps.7003.a.tt: "Vydáš se do nových zemí..."
 ep3_laamps.7003.b: "„Raději bych zůstal[Select_CString(ROOT.Char.IsFemale, 'a', '')] tady v Konstantinopoli.“"
 ep3_laamps.7004.t: "Další panovnická audience"
 ep3_laamps.7004.desc: "„Tak tě sem [Select_CString(emperor.IsFemale, 'poslala', 'poslal')], jo? A [Select_CString(emperor.IsFemale, 'tvrdila', 'tvrdil')], že jsou to [Select_CString(emperor.IsFemale, 'její', 'jeho')] země?“ [title_holder.GetFirstName] se pohrdavě ušklíbne. „Nakrmili tě pohádkami, hlupáku.“\n\nZdá se, že říše, jíž vládne [emperor.GetTitleAsNameNoTooltip], nesahá ani zdaleka tak daleko, jak mi bylo namluveno. Země, které jsme po příchodu nalezli — hustě zalesněné, ale překvapivě úrodné — rozhodně nejsou v řeckých rukou. Vládne jim [title_holder.GetTitleAsNameNoTooltip] [title_holder.GetFirstNameNoTooltip].\n\n„[Select_CString(emperor.IsFemale, 'Ta prašivá fena', 'Ten prašivý pes')] na tom nádherném trůnu tě [Select_CString(emperor.IsFemale, 'oklamala', 'oklamal')]. Ale...“ [title_holder.GetFirstNameNoTooltip] se odmlčí a prohlédne si mě i mé zbídačené, ale odhodlané družiníky. „...možná #EMP máš#! co nabídnout. Máš-li dost peněz, můžeš si tyto země koupit. Samozřejmě jako můj vazal.“"
 ep3_laamps.7004.a: "„Bude mi ctí.“"
 ep3_laamps.7004.b: "„Tyto země mi byly slíbeny. Vezmu si je silou.“"
 ep3_laamp_flavour_ewan.9511.t: "Návrat do družiny: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9511.desc.intro: "Po letech strávených u [host.GetTitledFirstName] se [visitor.GetFirstNameNicknamed] konečně [Select_CString(visitor.IsFemale, 'vrátila', 'vrátil')] mezi nás.\n\n"
 ep3_laamp_flavour_ewan.9511.desc.spouse.got_married: "Ačkoli se [visitor.GetFirstNameNoTooltip] od odchodu z [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] příliš [Select_CString(visitor.IsFemale, 'nezměnila', 'nezměnil')], přece jen si během pobytu na místě zvaném [capital.GetBaseNameNoTier] [Select_CString(visitor.IsFemale, 'našla', 'našel')] místní [Select_CString(visitor_spouse.IsFemale, 'manželku', 'manžela')] — [visitor_spouse.GetFirstName], [Select_CString(visitor_spouse.IsFemale, 'která', 'který')] se s [Select_CString(visitor.IsFemale, 'manželkou', 'manželem')] [Select_CString(visitor_spouse.IsFemale, 'vrátila', 'vrátil')] zpět do tábora."
 ep3_laamp_flavour_ewan.9511.desc.spouse.nope: "[visitor.GetFirstNameNoTooltip|U] se od chvíle, kdy [Select_CString(visitor.IsFemale, 'odešla', 'odešel')] z [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], téměř [Select_CString(visitor.IsFemale, 'nezměnila', 'nezměnil')], ať už je to dobře, nebo špatně, a především má radost, že je opět mezi známými tvářemi."
 ep3_laamp_flavour_ewan.9511.desc.outro: "\n\nStaří přátelé i nové tváře se tlačí dopředu. Všichni chtějí vidět, kdo se vrátil, a všechny stejně těší trocha nečekaných dobrých zpráv."
 ep3_laamp_flavour_ewan.9511.a: "Vítej, vítej!"
 ep3_laamp_flavour_ewan.9511.b: "#EMP Sňatek?#! To tedy ne!"
 ep3_laamp_flavour_ewan.9511.c: "Už tě nepotřebujeme. Odejdi."
 ep3_laamp_flavour_ewan.9512.t: "Návrat s novými zkušenostmi: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9512.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip]!“ ozve se povědomý hlas [visitor.GetFirstName], když po několika letech mimo [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] nadšeně vstoupí do tábora. „Jsem zpátky a během vyhnanství jsem rozhodně [Select_CString(visitor.IsFemale, 'nezahálela', 'nezahálel')]!“\n\nA skutečně [Select_CString(visitor.IsFemale, 'nezahálela', 'nezahálel')]. Zdá se, že čas strávený u [host.GetTitledFirstName] poskytl [visitor.GetFirstNameNoTooltip] spoustu příležitostí procvičovat své schopnosti a teď, když je opět mezi námi, je očividně hodlá náležitě využít."
 ep3_laamp_flavour_ewan.9512.a: "Ty ses ale [Select_CString(visitor.IsFemale, 'zlepšila', 'zlepšil')], [visitor.GetFirstNameNoTooltip]!"
 ep3_laamp_flavour_ewan.9512.b: "[Select_CString(visitor.IsFemale, 'Zmiz, tulačko.', 'Zmiz, tuláku.')]"
 ep3_laamp_flavour_ewan.9521.t: "Tak si tě nepamatuji: [visitor.GetTitledFirstNameNicknamedNoTooltip]"
 ep3_laamp_flavour_ewan.9521.desc.intro: "Po několika letech odloučení se [visitor.GetTitledFirstNameNicknamed] konečně [Select_CString(visitor.IsFemale, 'vrátila', 'vrátil')] mezi nás.\n\nJenže... [Select_CString(visitor.IsFemale, 'nevrátila se úplně stejná, jako když odcházela', 'nevrátil se úplně stejný, jako když odcházel')]."
 ep3_laamp_flavour_ewan.9521.desc.source.host: "Zdá se, že čas strávený u [host.GetTitledFirstName] zanechal nesmazatelnou stopu na vystupování i povaze [visitor.GetFirstNameNoTooltip] — nyní má mnohem blíž k [new_culture.GetName] kultuře než k [old_culture.GetName] kultuře.\n\n"
 ep3_laamp_flavour_ewan.9521.desc.source.capital: "Dny strávené na místě zvaném [capital.GetBaseNameNoTier] zjevně [visitor.GetFirstNameNoTooltip] hluboce ovlivnily. Po někdejších zvycích [old_culture.GetName] kultury nezůstala ani stopa a nahradila je řeč a způsoby typické pro [new_culture.GetName] kulturu.\n\n"
 ep3_laamp_flavour_ewan.9521.desc.reaction.changed_away: "Jelikož i já pocházím z [old_culture.GetName] kultury, je tahle změna... znepokojivá."
 ep3_laamp_flavour_ewan.9521.desc.reaction.changed_to: "I já patřím k [new_culture.GetName] kultuře, takže bych [visitor.GetFirstNameNoTooltip] mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] totéž naučit #EMP bez#! toho, aby od nás musel[Select_CString(visitor.IsFemale, 'a', '')] na celé roky odejít."
 ep3_laamp_flavour_ewan.9521.desc.reaction.uninvolved: "Je zvláštní sledovat, jak se [visitor.GetFirstNameNoTooltip] za tu dobu [Select_CString(visitor.IsFemale, 'změnila', 'změnil')], ale koneckonců všichni procházíme obdobími změn."
 ep3_laamp_flavour_ewan.9521.desc.outro: "\n\nZdá se však, že [visitor.GetFirstNameNoTooltip] svou proměnu nijak neřeší a má prostě radost, že je zpět v táboře."
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.diplomacy: "Získá [skill_1.GetValue|V0] k [Concept('skill','dovednosti')|E] [Concept('diplomacy','diplomacie')|E] díky osvojení [Concept('ethos','étosu')|E] [new_culture.GetName] kultury"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.martial: "Získá [skill_1.GetValue|V0] k [Concept('skill','dovednosti')|E] [Concept('martial','válečnictví')|E] díky osvojení [Concept('ethos','étosu')|E] [new_culture.GetName] kultury"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.stewardship: "Získá [skill_1.GetValue|V0] k [Concept('skill','dovednosti')|E] [Concept('stewardship','správcovství')|E] díky osvojení [Concept('ethos','étosu')|E] [new_culture.GetName] kultury"
 ep3_laamp_flavour_ewan.9521.tt.primary_skill.learning: "Získá [skill_1.GetValue|V0] k [Concept('skill','dovednosti')|E] [Concept('learning','učenosti')|E] díky osvojení [Concept('ethos','étosu')|E] [new_culture.GetName] kultury"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.diplomacy: "Získá [skill_2.GetValue|V0] k [Concept('skill','dovednosti')|E] [Concept('diplomacy','diplomacie')|E] díky osvojení [Concept('ethos','étosu')|E] [new_culture.GetName] kultury"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.stewardship: "Získá [skill_2.GetValue|V0] k [Concept('skill','dovednosti')|E] [Concept('stewardship','správcovství')|E] díky osvojení [Concept('ethos','étosu')|E] [new_culture.GetName] kultury"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.intrigue: "Získá [skill_2.GetValue|V0] k [Concept('skill','dovednosti')|E] [Concept('intrigue','pletichářství')|E] díky osvojení [Concept('ethos','étosu')|E] [new_culture.GetName] kultury"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.learning: "Získá [skill_2.GetValue|V0] k [Concept('skill','dovednosti')|E] [Concept('learning','učenosti')|E] díky osvojení [Concept('ethos','étosu')|E] [new_culture.GetName] kultury"
 ep3_laamp_flavour_ewan.9521.tt.secondary_skill.prowess: "Získá [skill_2.GetValue|V0] k [Concept('skill','dovednosti')|E] [Concept('prowess','udatnosti')|E] díky osvojení [Concept('ethos','étosu')|E] [new_culture.GetName] kultury"
 ep3_laamp_flavour_ewan.9521.a.changed_away: "Zvláštní, ale pořád patříš k nám!"
 ep3_laamp_flavour_ewan.9521.a.changed_to: "Rozumné rozhodnutí!"
 ep3_laamp_flavour_ewan.9521.a.uninvolved: "Vítej zpátky!"
 ep3_laamp_flavour_ewan.9521.b: "[visitor.GetCulture.GetCollectiveNoun] zde nejsou vítáni. #EMP Tebe tu nepotřebujeme#!. Táhni!"
 ep3_laamp_flavour_ewan.9522.t: "$ep3_laamp_flavour_ewan.9521.t$"
 ep3_laamp_flavour_ewan.9522.desc.intro: "Ačkoli to trvalo dlouhá léta, můj někdejší družiník [visitor.GetTitledFirstNameNicknamed] nakonec přece jen [Select_CString(visitor.IsFemale, 'našla', 'našel')] cestu zpět do [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\n\nJenže... něco se změnilo —"
 ep3_laamp_flavour_ewan.9522.desc.source.host: "[visitor.GetFirstNameNoTooltip] s úctou mluví o [new_faith.GetName], kterou vyznává [host.GetTitledFirstName], a tvrdí, že právě v jejím učení [Select_CString(visitor.IsFemale, 'našla', 'našel')] skutečnou spásu"
 ep3_laamp_flavour_ewan.9522.desc.source.capital: "[visitor.GetFirstNameNoTooltip] s úctou mluví o světle [new_faith.GetName], kterou poznal[Select_CString(visitor.IsFemale, 'a', '')] během pobytu na místě zvaném [capital.GetBaseNameNoTier], a tvrdí, že právě v jejím učení [Select_CString(visitor.IsFemale, 'našla', 'našel')] skutečnou spásu"
 ep3_laamp_flavour_ewan.9522.desc.source.bridge: "namísto [old_faith.GetName], kterou jsme kdysi vyznávali.\n\n"
 ep3_laamp_flavour_ewan.9522.desc.reaction.give_a_shit: "Ne že by mi na tom záleželo tolik jako některým jiným, ale i tak je to překvapivé."
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_away: "Opustit [old_faith.GetName] a odhodit naše nejsvětější tradice jako plášť na podlahu je téměř nemyslitelné."
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_ours: "Přirozeně mě nesmírně těší, že se [visitor.GetFirstNameNoTooltip] [Select_CString(visitor.IsFemale, 'rozhodla', 'rozhodl')] správně, přijala[Select_CString(visitor.IsFemale, '', ' ')] spásu a nalezl[Select_CString(visitor.IsFemale, 'a', '')] pravý smysl bytí v [new_faith.GetName]."
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_lovable: "Ačkoli mě tato volba překvapila, nemohu tvrdit, že [new_faith.GetNameNoTooltip] je špatnou cestou životem. [ROOT.Char.GetFaith.GetName] ji koneckonců chová ve velké úctě."
 ep3_laamp_flavour_ewan.9522.desc.reaction.changed_to_acceptable: "Nevím, co [visitor.GetFirstNameNoTooltip] k této volbě vedlo, ale [new_faith.GetNameNoTooltip] je alespoň přijatelnější než mnohá jiná vyznání v tomto bezbožném světě."
 ep3_laamp_flavour_ewan.9522.desc.reaction.uninvolved: "Jelikož sám[Select_CString(ROOT.Char.IsFemale, 'a', '')] vyznávám [ROOT.Char.GetFaith.GetName], na obrácení [visitor.GetFirstNameNoTooltip] mi #EMP až tak#! nezáleží, ale rozhodně jsem ho nečekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 ep3_laamp_flavour_ewan.9522.desc.outro: "\n\n[visitor.GetFirstNameNoTooltip|U] si nevšímá rozruchu, který náhlý návrat a proměna vyvolaly, a prostě se věnuje svým záležitostem, jako by nikdy [Select_CString(visitor.IsFemale, 'neodešla', 'neodešel')]."
 ep3_laamp_flavour_ewan.9522.a: "Vítej, [Select_CString(visitor.IsFemale, 'sestro', 'bratře')]!"
 ep3_laamp_flavour_ewan.9522.b: "Ale proč ses obrátil[Select_CString(visitor.IsFemale, 'a', '')] právě k [new_faith.GetNameNoTooltip]..."
 ep3_laamp_flavour_ewan.9522.c: "Co jsi to provedl[Select_CString(visitor.IsFemale, 'a', '')], ty blázne?!"
 ep3_laamp_flavour_ewan.9522.d: "[old_faith.GetAdherentNameNoTooltip], [new_faith.GetAdherentNameNoTooltip]... pořád jsi [visitor.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.9522.e: "Je dobře, že jsi zpátky, [visitor.GetFirstNameNoTooltip]."
 ep3_laamp_flavour_ewan.9522.f: "Tady už nejsi vítán[Select_CString(visitor.IsFemale, 'a', '')]."
 ep3_laamp_flavour_ewan.9523.t: "$ep3_laamp_flavour_ewan.9521.t$"
 ep3_laamp_flavour_ewan.9523.desc.intro: "$ep3_laamp_flavour_ewan.9522.desc.intro$ [visitor.GetFirstNameNoTooltip] nyní mluví a obléká se spíš jako [new_culture.GetCollectiveNoun], mezi nimiž pobýval[Select_CString(visitor.IsFemale, 'a', '')], a tvrdí, že poznal[Select_CString(visitor.IsFemale, 'a', '')] světlo jediné pravé [new_faith.GetName]. K této proměně [Select_CString(visitor.IsFemale, 'ji', 'ho')] přivedl[Select_CString(visitor.IsFemale, 'a', '')]"
