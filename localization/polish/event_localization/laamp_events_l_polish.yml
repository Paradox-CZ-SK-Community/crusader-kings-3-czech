 ep3_laamp_flavour_ewan_4031_callous_and_plentiful_steeds_culled_herd_modifier: "$ep3_laamp_flavour_ewan_4031_callous_culled_herd_modifier$"
 ep3_laamp_flavour_ewan_4031_callous_and_plentiful_steeds_culled_herd_modifier_desc: "$ep3_laamp_flavour_ewan_4031_callous_culled_herd_modifier_desc$"
 ep3_laamp_flavour_ewan.4041.t: "[ROOT.Char.GetFaith.TricksterGodNamePossessive] desátek"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.thunder: "Nad hlavami zlověstně hřmí a dunění jen občas přehluší bičující vítr a prudký déšť, které se snaží naši kolonu rozmetat.\n\nZ jednoho konce kolony na druhý se nesou vzdálené výkřiky, zatímco vozy i zvířata se boří a [ROOT.Char.Custom('RainySoilType')|l] je pohlcuje. Bouře jako by se ze všech sil snažila spláchnout nás až tam, kde začíná [ROOT.Char.GetFaith.NegativeAfterLife]. Děti a staří lidé se v mokrém oblečení tiše třesou zimou, promočení až na kost a s obavou čekají, kdy se dostaví podchlazení.\n\nVzduch praská elektřinou i napětím a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.wind: "Kvílení větru téměř znemožňuje slyšet cokoli vzdálenějšího než pár kroků.\n\nTa prokletá bouře stále sílí. Déšť nás štípe do očí a těžké vozy i obtížená zvířata beznadějně vězí, zatímco [ROOT.Char.Custom('RainySoilType')|l] je svírá ze všech stran. Stejný bezútěšný výjev se táhne celou kolonou: silnější družiníci pomáhají vyprošťovat povozy, zatímco děti a staří lidé se krčí pod každým přístřeškem, který dokážou najít či vytvořit.\n\nZdá se, že se proti nám spikla sama příroda, a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.snow: "Necitlivost.\n\nAčkoli jsem zabalený[Select_CString(ROOT.Char.IsFemale, 'á', '')], jak nejtepleji to jde, mráz se mi zažírá do těla. Vítr žene vzduchem mohutné přívaly sněhu, které promočí každý kousek odhalené kůže a vysávají z ní teplo jako vosk z dohořívající svíce. Zbytek kolony je na tom ještě hůř — lidé, zvířata i vozy znovu a znovu uvázávají v tom vyběleném pekle, děti a staří lidé se třesou pod sněhem zavátými plachtami, zatímco dospělí horečně vyprošťují naše povozy.\n\nSněhová bouře navíc stále sílí a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.storm.sand: "Písek je #EMP všude#! — v očích, nose i krku. Ani zakrytí obličeje příliš nepomáhá, pekelná zrnka zuřivě bičují všechno, co jim stojí v cestě.\n\nPísečná bouře udeřila náhle, zdánlivě odnikud. Během několika minut pohltila celou kolonu a z ostatních už vnímám jen výkřiky, když vichr vyrvává zásoby a odnáší je pryč, a dávivý kašel dětí i starců, jejichž plíce nápor nezvládají.\n\nVšechny naše pečlivé přípravy jsou rázem k ničemu a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.intro: "I z této dálky cítíme nesnesitelné horko plamenů, které se k nám ženou.\n\n"
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.scrub: "Požár se suchým křovím žene rychleji, než se my dokážeme pohybovat otevřenou krajinou, a zrádný vítr ho žene přímo k nám. Každému, kdo nebude dost rychlý, hrozí, že se upeče zaživa — obtížené mule stejně jako opozdilému dítěti.\n\nDaleko před samotným požárem se valí mohutná mračna kouře, která dusí nemocné a staré, a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.slopes: "Přestože se ze všech sil ženeme do svahu, stálý vítr a vyschlá zem znamenají, že nás požár dohání. Každému, kdo nebude dost rychlý, hrozí, že se upeče zaživa — obtížené mule stejně jako opozdilému dítěti.\n\nNad hlavním pásem plamenů se vinou sloupy kouře, pronikají mezi nás a dusí i ty nejodolnější, a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.treeline: "Při takovém množství porostu, který může pohltit, nás požár dohání mílovými kroky — občasný výbuch mimořádně suchého stromu plného mízy je děsivou připomínkou příšerného osudu, který čeká vše a všechny, kdo neutečou dost rychle.\n\nMastné prsty podivně voňavého kouře nás pronásledují před postupujícími plameny a dusí ty slabší, takže není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.wild_fires.fallback: "Požár se šíří rychleji, než postupujeme my, a nachází právě #EMP tolik#! paliva, aby se nenasytně hnal směrem k naší koloně. Všechno a všichni, kdo neutečou dost rychle, shoří zaživa — obtížená mula stejně jako opozdilé dítě.\n\nJeště horší jsou obrovská mračna kouře, která se valí daleko před plameny a čas od času nás pohltí, aby z těch nejzranitelnějších vymačkala život, takže není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.avalanche: "Blížící se nebezpečí ohlašuje překvapivě tlumený zvuk: mohutné, měkké #EMP žuchnutí#! vysoko nad námi.\n\nDesítky očí v koloně se obrátí k vrcholkům tyčícím se nad našimi hlavami. Pak se po horách rozlehne rachot mohutnější než jakýkoli úder hromu.\n\n„#BER LAVINA!#!“ zařve kdosi. Všechno se rázem mění v chaos, lidé i zvířata prchají k sebemenšímu úkrytu před přívalem bílé smrti, který se na nás řítí, a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.flood: "Mlha jako by se snesla odnikud — ještě před chvílí byl vzduch jen vlhký, a teď je hustý skoro jako kaše.\n\nZ nebe začne padat několik kapek deště a nedaleký potok se rychle vylévá z břehů. Kolony se zmocní napětí a lidé i vozy postupně zastavují. Nikdo nedokáže říct, co přesně se děje, ale #EMP něco#! je špatně.\n\nBěhem jediné minuty se dosud pevná půda pod nohama promění v husté bahno a voda začne všude kolem vystupovat ze země. „Povodeň, #EMP přívalová povodeň#!!“ vykřikne kdosi a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.frozen_water: "Sníh tu vytrvale padá, ale není natolik prudký, aby nám působil potíže. Jen pokrývá svět tlustým bílým kobercem. Naše kolona vstoupí na mýtinu v lese a všichni si vychutnávají chvíli mimo sevření stromů i příležitost obdivovat okolní zimní krajinu.\n\n#BER Křup.#!\n\nDesítky očí se sklopí k zemi a s rostoucí hrůzou sledují, jak se pod námi otevírá obrovská trhlina v zem- ne, na povrchu #EMP zamrzlého jezera#!! Není čas váhat ani přemýšlet, všichni jako jeden prcháme a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.weather_type.earthquake: "Svět pod našima nohama se pohne. Lidé i muly klopýtají, děti se dají jednohlasně do pláče a několik kol vozů praskne, když je otřes vyhodí vzhůru a vzápětí jimi udeří zpět o zem nebo je smýkne stranou.\n\nPo celé koloně zavládne na půl vteřiny panika: co to bylo? Přijde další otřes, nebo to by-\n\n#EMP Samotná země se začne třást#!. Opodál se otevře puklina a klikatí se přímo k nám rychleji, než člověk dokáže běžet. Ten pohled okamžitě vyvolá paniku a není divu, že "
 ep3_laamp_flavour_ewan.4041.desc.outro: "mí družiníci jsou na pokraji zhroucení."
