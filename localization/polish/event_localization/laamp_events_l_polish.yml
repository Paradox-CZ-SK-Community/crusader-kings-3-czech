 ep3_laamp_flavour_ewan.4031.g.tt.sickness_spreads_wildly: "Nákaza se šíří jako požár"
 ep3_laamp_flavour_ewan_4031_sickness_affects_some_of_herd_modifier: "Částečně nakažené stádo"
 ep3_laamp_flavour_ewan_4031_sickness_affects_some_of_herd_modifier_desc: "Nemoc sužuje starší a slabší soumary tohoto tábora."
 ep3_laamp_flavour_ewan_4031_sickness_spreads_through_herd_modifier: "Nakažené stádo"
 ep3_laamp_flavour_ewan_4031_sickness_spreads_through_herd_modifier_desc: "Nejméně čtvrtina soumarů tohoto tábora je nemocná."
 ep3_laamp_flavour_ewan_4031_sickness_spreads_wildly_through_herd_modifier: "Těžce nakažené stádo"
 ep3_laamp_flavour_ewan_4031_sickness_spreads_wildly_through_herd_modifier_desc: "Více než polovinu soumarů tohoto tábora postihla nějaká strašlivá choroba."
 ep3_laamp_flavour_ewan_4031_callous_culled_herd_modifier: "Probrané stádo"
 ep3_laamp_flavour_ewan_4031_callous_culled_herd_modifier_desc: "Bez slabších zvířat můžeš cestovat rychleji, ale povezeš méně nákladu."
