l_polish:
 ep3_laamp_flavor_oltner.3001.t: "Srdce družiníka"
 ep3_laamp_flavor_oltner.3001.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale, 'má', 'můj')] [entourage_to_marry_2.Custom2('RelationToMeShort', SCOPE.sC('root_char'))|l], tady v [ROOT.Char.GetCurrentLocation.GetName] jsem [Select_CString(entourage_to_marry_2.IsFemale, 'potkala', 'potkal')] [Select_CString(marriage_material.IsFemale, 'ženu, která je', 'muže, který je')] naprosto [marriage_material.Custom('RandomPositiveShallowAdjective')|l]...“ [Select_CString(entourage_to_marry_2.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_to_marry_2'))|l] [entourage_to_marry_2.GetFirstNameNicknamed] se při těch slovech zakoktá.\n\n„[Select_CString(marriage_material.IsFemale, 'Její', 'Jeho')] rodina nám nedovolí uzavřít sňatek, pokud nezaplatím značné věno!“ smutně koktá [entourage_to_marry_2.GetFirstNameNoTooltip]. „Prosím, pomoz mi.“"
 ep3_laamp_flavor_oltner.0001.a: "...[ROOT.Char.GetFaith.HighGodName] to vidí, vždyť jsi [Select_CString(entourage_to_marry_2.IsFemale, 'bohatá', 'bohatý')] — zaplať si to [Select_CString(entourage_to_marry_2.IsFemale, 'sama', 'sám')]!"
 ep3_laamp_flavor_oltner.0001.b: "Samozřejmě ti pomohu!"
 ep3_laamp_flavor_oltner.0001.c: "Uvidíme, jestli [marriage_material.GetFirstNameNoTooltip] bude chtít s tebou utéct..."
 ep3_laamp_flavor_oltner.0001.c.success: "[marriage_material.GetFirstName] se k tobě přidá"
 ep3_laamp_flavor_oltner.0001.c.failure: "[marriage_material.GetFirstName] [Select_CString(marriage_material.IsFemale, 'není nijak nadšená', 'není nijak nadšený')]"
 ep3_laamp_flavor_oltner.0001.d: "To není můj problém."
