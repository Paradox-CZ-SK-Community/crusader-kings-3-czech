 commission_epic.0001.t: "Rodový epos"
 commission_epic.0001.desc: "Potřebuji klasické vyprávění o velkoleposti svého rodu. [ROOT.Char.Custom('CompositionType')|U] o počátcích dynastie [ROOT.Char.GetDynasty.GetBaseName] a o velikosti, která je nám souzena!\n\nPotřebuji jen někoho, kdo umí vyprávět příběhy..."
 commission_epic.0001.a: "Nikdo nevypráví lépe než [writer.GetTitledFirstNameNoTooltip]!"
 writer_writes_epic: "Rodový epos skládá [writer.GetTitledFirstName]"
 commission_epic.0001.b: "Ať přijou nejlepší [ROOT.Char.Custom('CommissionEpicScribes')]."
 scribes_write_epic: "Moji písaři skládají rodový epos"
 bards_write_epic: "Moji bardové skládají rodový epos"
 commission_epic.0001.c: "Na to přece stačí i [servant.Custom('GenderedLowlyServantType')], ne?"
 servant_writes_epic: "[servant.GetTitledFirstName] ze služebnictva skládá rodový epos"
 commission_epic.0001.d: "Když o tom tak přemýšlím..."
 commission_epic.writing_begins: "Tvorba rodového eposu začíná..."
 commission_epic.high_chance: "Vysoká šance na [Concept('exceptional_epic','mimořádný epos')|E]"
 commission_epic.medium_chance: "Nejistá šance na [Concept('exceptional_epic','mimořádný epos')|E]"
 commission_epic.low_chance: "Nízká šance na [Concept('exceptional_epic','mimořádný epos')|E]"
 commission_epic.opt_out: "Rodový epos si prozatím neobjednám"
 commission_epic.reduced_chance: "Snížená šance na vytvoření [Concept('exceptional_epic','mimořádného eposu')|E]"
 commission_epic.increased_chance: "Zvýšená šance na vytvoření [Concept('exceptional_epic','mimořádného eposu')|E]"
 commission_epic.0002.t: "Rodový epos: Úhel pohledu"
 commission_epic.0002.writer: "Můj rodový epos se vyvíjí dobře a některé pasáže už znějí, jako by se měly citovat ještě po desetiletích. [writer.GetTitledFirstName] má ale spoustu otázek ohledně toho, na co se má příběh zaměřit.\n\nOdpovídalo by se mi snáz, kdyby byl nejdřív celý epos hotový. Pak by stačilo ukázat, co se mi na něm nelíbí, ale [writer.GetTitledFirstNameNoTooltip] trvá na odpovědích hned."
 commission_epic.0002.servant: "[servant.GetFirstName] se při práci na dějinách mého rodu očividně trochu trápí. Už samotný pokrok je ale působivý. Jak se ukázalo, neumí ani číst, ani rýmovat.\n\nPřesto pracuje dnem i nocí a teď za mnou přichází s důležitou otázkou. „O čem přesně to má být, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 commission_epic.0002.scribes: "Moji [ROOT.Char.Custom('CommissionEpicScribes')] se pustili do práce na mém rodovém eposu, ale už narážejí na potíže. Nemohou se shodnout, na co se má příběh zaměřit, a každý [ROOT.Char.Custom('CommissionEpicScribe')] shodou okolností trvá na tom, že největší důraz si zaslouží právě jeho vlastní oblast.\n\n„Nechceme nic vnucovat, [ROOT.Char.Custom('FormOfAddressForLiege')], ale #EMP musíte#! to rozhodnout, než se navzájem roztrháme na kusy!“"
 commission_epic.0002.iberia_epic.a: "Ať epos vypráví o právu mé dynastie vládnout Iberii!"
 commission_epic.0002.a: "Hlavně příběhy o dědičných nárocích mé dynastie."
 commission_epic.propaganda: "Po dokončení eposu získáš [Concept('claims','nároky')|E] na sousední tituly"
 commission_epic.0002.b: "Samozřejmě o mně a mém osudu!"
 commission_epic.more_prestige: "Po dokončení eposu získáš více osobní [Concept('prestige','prestiže')|E]"
 commission_epic.0002.c: "Je to #EMP rodová#! historie, takže chválou nešetřit."
 commission_epic.more_dynasty_prestige: "Po dokončení eposu získáš více [Concept('dynasty_prestige','věhlasu')|E]"
 commission_epic.0002.d: "Příběh musí být co nejpravdivější."
 commission_epic.more_piety: "Po dokončení eposu získáš také trochu [Concept('piety','zbožnosti')|E]"
 commission_epic.1001.t: "Rodový epos: Otázka času"
 commission_epic.1001.opening: "Už celé týdny mi nikdo nepředložil nic nového z mého rodového eposu a celý proces se buď vleče příliš dlouho, nebo"
 commission_epic.1001.composer: "[composer.GetTitledFirstName] nakonec odvede mizernou práci! Je opravdu příliš chtít, aby výsledkem bylo mistrovské dílo, a navíc ho chtít hned?"
 commission_epic.1001.scribes: "moji [ROOT.Char.Custom('CommissionEpicScribes')] nakonec odvedou mizernou práci! Je opravdu příliš chtít, aby výsledkem bylo mistrovské dílo, a navíc ho chtít rychle?"
 commission_epic.1001.a: "Chci, aby to bylo dobré, a chci to #EMP hned!#!"
 commission_epic.1001.b: "Nechám [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] u sebe tak dlouho, jak bude třeba."
 commission_epic.1001.b_scribes: "Nechám [ROOT.Char.Custom('CommissionEpicComposerThem')] u sebe tak dlouho, jak bude třeba."
 commission_epic.1001.c: "Když to, co už je hotové, rozdělíme na první díl..."
 commission_epic.1002.t: "Rodový epos: Bohatý zdroj námětů"
 commission_epic.1002.composer: "[powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] naslouchá, jak [composer.GetTitledFirstName] vypráví o několika vzrušujících podrobnostech, které [Select_CString(composer.IsFemale,'objevila','objevil')] o mých předcích. „Myslím, že ta část, kde se objevuje [ROOT.Char.Custom('CompositionDetail')], by dokonce mohla být pravdivá, protože-“\n\nJe to bezpochyby fascinující, ale [Select_CString(composer.IsFemale,'neměla','neměl')] by spíš dokončovat velkolepou [ROOT.Char.Custom('CompositionType')]? Pokud jde o tuhle konkrétní historku..."
 commission_epic.1002.scribes: "[powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] naslouchá několika mým písařům, kteří vyprávějí o vzrušujících podrobnostech, jež objevili o mých předcích.\n\n„Myslíme, že ta část, kde se objevuje [ROOT.Char.Custom('CompositionDetail')], by dokonce mohla být pravdivá, protože-“\n\nJe to bezpochyby fascinující, ale neměli by spíš dokončovat velkolepou [ROOT.Char.Custom('CompositionType')]? Pokud jde o tuhle konkrétní historku..."
 commission_epic.1002.a: "Tohle musí slyšet všichni moji vazalové!"
 commission_epic.1002.a.tt: "Po dokončení obdržíš knižní [Concept('artifact','artefakt')|E] Rodový epos, který zlepšuje [Concept('opinion','mínění')|E] tvých [Concept('vassal','vazalů')|E]"
 commission_epic.1002.b: "Ať [ROOT.Char.Custom('CompositionType')] obsahuje i tohle, bude hotová dřív!"
 commission_epic.1002.b.tt: "A navíc si tak můžu vzít zpět část vyplacené mzdy!"
 commission_epic.1003.t: "Rodový epos: Spisovatelský odpočinek"
 commission_epic.1003.composer: "[composer.GetTitledFirstName] [Select_CString(composer.IsFemale,'byla přistižena při pokusu','byl přistižen při pokusu')] vytratit se od svých povinností! Naštěstí [Select_CString(composer.IsFemale,'ji','ho')] stráž při průchodu branou poznala.\n\n„Je to vyčerpávající práce,“ hájí se. „Dnem i nocí, můj dobrotivý [ROOT.Char.GetLadyLord]! Zoufale potřebuji pár dní odpočinku.“"
 commission_epic.1003.scribes: "Někteří z mých písařů byli přistiženi při pokusu vytratit se od práce na mém rodovém eposu! Naštěstí je stráž při průchodu branou poznala.\n\n„Je to vyčerpávající práce,“ vysvětlují. „Dnem i nocí, [ROOT.Char.Custom('FormOfAddressForLiege')]! Zoufale potřebujeme pár dní odpočinku.“"
 commission_epic.1003.a: "Dobrá, možná si přece jen zaslouží trochu odpočinku."
 commission_epic.1003.b: "Přikovejte [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] k pracovnímu stolu! Vždyť je [ROOT.Char.Custom2('CommissionEpicComposerTheir', composer)]!"
 commission_epic.1003.b_scribes: "Přikovejte [ROOT.Char.Custom('CommissionEpicComposerThem')] k pracovnímu stolu! Vždyť je [ROOT.Char.Custom('CommissionEpicComposerTheir')]!"
 commission_epic.1004.t: "Rodový epos: [Select_CString(illuminator.IsFemale,'Mistryně iluminátorka','Mistr iluminátor')]"
 commission_epic.1004.opening: "Doneslo se mi, že"
 commission_epic.1004.devotee_male: "[ROOT.Char.GetFaith.DevoteeMale]"
 commission_epic.1004.devotee_female: "[ROOT.Char.GetFaith.DevoteeFemale]"
 commission_epic.1004.ending: "[Select_CString(illuminator.IsFemale,'proslulá','proslulý')] svými iluminacemi pobývá ve městě v [barony.GetNameNoTier]. Práce na mém rodovém eposu pokračují, takže nastal ideální čas zamyslet se nad tím, jak by měly jeho stránky po dokončení vypadat."
 commission_epic.1004.a: "[Select_CString(illuminator.IsFemale,'Najmout iluminátorku','Najmout iluminátora')], ať to stojí cokoli!"
 commission_epic.1004.b: "[composer.GetTitledFirstNameNoTooltip] to zvládne [Select_CString(composer.IsFemale,'sama','sám')]."
 commission_epic.1004.b_scribes: "Moji [ROOT.Char.Custom('CommissionEpicScribes')] to zvládnou sami."
 commission_epic.1004.success: "Vynikající iluminace"
 commission_epic.1004.failure: "Ubohé iluminace"
 commission_epic.1004.c: "Vždycky jsem se tak trochu [Select_CString(ROOT.Char.IsFemale,'považovala','považoval')] za umělce..."
 commission_epic.1005.t: "Rodový epos: Píseň našeho lidu"
 commission_epic.1005.opening: "Přemítám nad několika posledními verši z rodového eposu, které mi"
 commission_epic.1005.composer: "[Select_CString(composer.IsFemale,'předložila','předložil')] [composer.GetFirstName]"
 commission_epic.1005.scribes: "předložili moji [ROOT.Char.Custom('CommissionEpicScribes')]"
 commission_epic.1005.ending: "a když si je začnu pobrukovat, dochází mi, že mají stejný rytmus jako jedna z oblíbených písní mých soukmenovců!\n\nKdyby se příběh mých předků zpíval na tak zapamatovatelnou melodii, určitě by nikdy neupadl v zapomnění!"
 commission_epic.1005.a: "Tohle mě mělo napadnout hned na začátku!"
 commission_epic.1005.b_composer: "Jsem si jistý, že [ROOT.Char.Custom2('CommissionEpicComposer', composer)] dokáže vymyslet něco stejně dobrého."
 commission_epic.1005.b: "Jsem si jistý, že [ROOT.Char.Custom('CommissionEpicComposer')] dokáže vymyslet něco stejně dobrého."
 commission_epic.1005.classic: "Složena klasická melodie"
 commission_epic.1005.enjoyable: "Složena příjemná melodie"
 commission_epic.1005.terrible: "Složena příšerná melodie"
 commission_epic.1006.opening: "[vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 commission_epic.1006.desc: "Několik částí tvého nového rodového eposu už mám [ROOT.Char.Custom('CompositionTypeActionPast')] a skutečná věrnost pramenící z hlubokého přátelství mezi těmito legendárními hrdiny mě inspiruje.\n\nBylo by mi ctí nazývat tě svým přítelem a věrně ti sloužit."
 commission_epic.1006.a: "Vždyť už dávno jsme přátelé, [vassal.GetFirstNameNoTooltip]!"
 commission_epic.1006.b: "Tvá věrnost by měla být samozřejmostí, ať se děje cokoli."
 commission_epic.1007.opening: "[vassal.Custom2('AppropriateGreetingNegative', ROOT.Char)|U]"
 commission_epic.1007.desc: "Už mám [ROOT.Char.Custom('CompositionTypeActionPast')] několik částí tvého nového rodového eposu a otřáslo mnou, jak přehlíží zásluhy mých vlastních předků!\n\nTahle potupa je poslední kapka. Je jasné, že vůči mně a mému rodu nechováš nic než zášť!"
 commission_epic.1007.a: "Jak se opovažuješ takhle mluvit se [Select_CString(ROOT.Char.IsFemale,'svou lenní paní','svým lenním pánem')]?!"
 commission_epic.1007.b: "Omlouvám se, tvůj rod bude samozřejmě zahrnut!"
 commission_epic.2001.t: "Rodový epos: Přednostní právo"
 commission_epic.2001.desc_composer: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou [Select_CString(steward.IsFemale,'přichází nadšená','přichází nadšený')] s novinkou. „Při [ROOT.Char.Custom('CompositionTypeActionPP')] nejnovější části tvého rodového eposu jsem [Select_CString(steward.IsFemale,'narazila','narazil')] na něco zajímavého a [ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer )] na kontě velmi zajímavý objev!“"
 commission_epic.2001.desc_scribes: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] za mnou [Select_CString(steward.IsFemale,'přichází nadšená','přichází nadšený')] s novinkou. „Při [ROOT.Char.Custom('CompositionTypeActionPP')] nejnovější části tvého rodového eposu jsem [Select_CString(steward.IsFemale,'narazila','narazil')] na něco zajímavého a [ROOT.Char.Custom('CommissionEpicComposer')] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] na kontě velmi zajímavý objev!“"
 commission_epic.2001.desc: "\n\nZdá se, že území [county.GetName] nikdy nemělo natrvalo připadnout rodu [vassal.GetHouse.GetName]. To mi dává dobrý důvod vznést nárok proti [vassal.GetTitledFirstName]!"
 commission_epic.2001.a: "Co mi právem náleží, to si vezmu."
 commission_epic.2001.b: "[vassal.GetFirstNameNoTooltip] si jistě bude chtít darování nechat řádně stvrdit."
 commission_epic.2001.c: "Tohle můžeme nechat být."
 commission_epic.2001.c.flavor: "Ale ať se to [vassal.GetTitleTierName] dozví."
 commission_epic.2002.t: "Rodový epos: Rodová pýcha"
 commission_epic.2002.desc: "Zdá se, že [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je další, kdo už má [ROOT.Char.Custom('CompositionTypeActionPast')] několik úryvků z mého rodového eposu.\n\n„[Select_CString(grandparent.IsFemale,'Tvoje praprababička byla pozoruhodná a vynalézavá žena','Tvůj prapradědeček byl pozoruhodný a vynalézavý muž')],“ dozvídám se. „Kdybychom rozšířili, že v tobě přežívá byť polovina té vychytralosti, lidé by si dvakrát rozmysleli, než by proti tobě něco podnikli.“"
 commission_epic.2002.a: "Krev té zmije mi koluje v žilách!"
 commission_epic.2002.a.tt: "Po dokončení obdržíš knižní [Concept('artifact','artefakt')|E] Rodový epos, který zvyšuje [Concept('hostile_scheme_resistance','odolnost vůči nepřátelským intrikám')|E]"
 commission_epic.2002.b: "Nebo budeme tvrdit, že [Select_CString(grandparent.IsFemale,'byla čestná a bezúhonná','byl čestný a bezúhonný')]..."
 commission_epic.2003.t: "Rodový epos: Věčné závazky"
 commission_epic.2003.desc: "Zdá se, že [court_chaplain.GetFirstName] při [ROOT.Char.Custom('CompositionTypeActionPP')] částí mého nového rodového eposu [Select_CString(court_chaplain.IsFemale,'narazila','narazil')] na „nesrovnalosti“ mezi dávnými sliby a dnešní skutečností.\n\nJe mi jasné, že se toho hned tak nevzdá. „Jistě chápeš, jak moudré a laskavé by bylo splnit slib svých předků, třeba i po tak dlouhé době?“"
 commission_epic.2003.a_same_dynasty: "Je nám přece jasné, že naše dynastie drží slovo."
 commission_epic.2003.a: "Pocházím z dlouhé řady lidí, kteří drželi slovo."
 commission_epic.2003.b: "Moji předkové byli [ROOT.Char.Custom('GetPiousBelievers')], ale moudrost jim to nezaručovalo."
 commission_epic.2004.t: "Rodový epos: Přichází inspirace"
 commission_epic.2004.desc_scribes: "[ROOT.Char.Custom('CommissionEpicComposer')|U] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] na svědomí celou řadu..."
 commission_epic.2004.desc_composer: "[ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer )] na svědomí celou řadu..."
 commission_epic.2004.desc: "odvážných úprav mého rodového eposu, pokud jde o války a bitvy. Vznikají z toho dramatické scény, ale mám obavu, že [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [Select_CString(marshal.IsFemale,'je uražená','je uražený')]; u jedné konkrétní scény totiž [Select_CString(marshal.IsFemale,'svraštila','svraštil')] obočí.\n\nSkoro se mi uleví, když konečně promluví. „Je to celé nesmysl, ale ta část, kde se objevuje [ROOT.Char.Custom('CompositionDetail')], mi vnukla pár nápadů...“"
 commission_epic.2004.a: "Inspiraci je třeba využít, ať přijde odkudkoli!"
 commission_epic.2004.a.tt: "Po dokončení obdržíš knižní [Concept('artifact','artefakt')|E] Rodový epos, který zvyšuje bojovou [Concept('advantage','výhodu')|E]"
 commission_epic.2004.b: "Vysvětli mi to podrobně..."
 commission_epic.2005.t: "Rodový epos: Pravda a zdání"
 commission_epic.2005.desc: "Při [ROOT.Char.Custom('CompositionTypeActionPP')] mého rodového eposu se [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chancellor'))], [chancellor.GetTitledFirstName], zamýšlí nad tím, jak se postupně rodí jeho konečná podoba.\n\n„Spousta toho není zrovna věrohodná, třeba část, kde se objevuje [ROOT.Char.Custom('CompositionDetail')],“ zaznívá. „Na druhou stranu, kdo může vědět, jaká minulost doopravdy byla? Když už si něco přikrášluješ, proč toho nevyužít naplno?“"
 commission_epic.2005.a: "Důležité je přece vyprávět dobrý příběh..."
 commission_epic.2005.b: "Ne, musí být co nejvěrnější skutečnosti."
 commission_epic.2005.b.tt: "Po dokončení obdržíš knižní [Concept('artifact','artefakt')|E] Rodový epos, který zvyšuje [Concept('success_chance','šanci na úspěch')|E] [Concept('personal_scheme','osobní intriky')|E]"
 commission_epic.2006.t: "Rodový epos: Pouto víry"
 commission_epic.2006.desc: "Nevím, zda mě má uklidňovat, nebo znepokojovat nadšení, které [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))], [court_chaplain.GetTitledFirstName], projevuje po [ROOT.Char.Custom('CompositionTypeActionPP')] dokončených částí mého rodového eposu.\n\n„Ten příběh v sobě skrývá nádherné mravní ponaučení!“ zaznívá nadšeně. „Když [ROOT.Char.GetFaith.AltPriestTermPlural] radí dynastii [ROOT.Char.GetDynasty.GetBaseName], čeká ji velikost; když jejich rady přehlíží, přicházejí temné časy! Doufám, že i ty si to vezmeš k srdci.“"
 commission_epic.2006.a: "Ano, tohle ponaučení znám až příliš dobře."
 commission_epic.2006.a.tt: "Po dokončení obdržíš knižní [Concept('artifact','artefakt')|E] Rodový epos, který zvyšuje [Concept('piety','zbožnost')|E] a příjem z daní od postav stejné [Concept('faith','víry')|E]"
 commission_epic.2006.b: "Ha! Je to přesně naopak."
 commission_epic.2006.b.flavor: "Vždy jsme udávali směr; [ROOT.Char.GetFaith.AltPriestTermPlural] se řídí námi."
 commission_epic.2006.c: "Oba víme, že rodina je vždy na prvním místě."
 commission_epic.2006.c.same_dynasty: "Tato možnost je dostupná, protože [court_chaplain.GetFirstNameNoTooltip] je ze stejné [Concept('dynasty','dynastie')|E] jako ty"
 commission_epic.6001.t: "Pár drobných příkras"
 commission_epic.6001.writerservant: "Po nějaké době práce na mé kronice za mnou [composer.GetName] přichází s přiznáním.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má paní','Můj pane')], musím přiznat, že ačkoli je vaše dynastie skutečně velkolepá, nároky vašich předků, které jste [Select_CString(ROOT.Char.IsFemale,'doufala','doufal')] najít, možná nebude... tak snadné doložit. Potřebuji více času a prostředků, abych se mohl ponořit hlouběji do starých textů. Jinak budu muset příběhy trochu #italic přikrášlit#! a vaše nároky nakonec nemusí působit tak přesvědčivě...“"
 commission_epic.6001.scribes: "Moji písaři pracovali dnem i nocí a probírali se starými rukopisy, aby našli územní nároky mých předků, které by mohli v kronice vyzdvihnout.\n\n„Bohužel,“ ozývají se, „pokud jde o... pravdu celé věci, skutky a panství vašich předků a podobné záležitosti, možná budeme muset sáhnout k drobným příkrasám. Jistě to chápete, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')]?“"
 commission_epic.6001.a: "Na příkrasách nezáleží, hlavně ať je to hotové!"
 commission_epic.6001.b: "Tady je zlato. Výzkum musí pokračovat."
 commission_epic.less_credible: "Kronika bude méně věrohodná"
 commission_epic.more_credible: "Kronika může být nakonec věrohodnější"
 commission_epic.6003.t: "Vychladlé nároky"
 commission_epic.6003.writer: "[composer.GetName] pilně pracuje na mé kronice, která je čím dál velkolepější a zároveň čím dál pochybnější.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ [Select_CString(composer.IsFemale,'říká','říká')], „[Select_CString(composer.IsFemale,'našla','našel')] jsem potrhaný starý text, podle něhož kdysi v [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] a [neighboring_county_3.GetNameNoTier] [Select_CString(ancestor_1.IsFemale,'vládla královna','vládl král')] jménem [ancestor_1.GetFirstNameNoTooltip]. [Select_CString(composer.IsFemale,'Mohla','Mohl')] bych se ponořit do rodokmenů a několika, řekněme, #italic tvořivými dodatky#! doložit, že [Select_CString(ancestor_1.IsFemale,'byla tvou předkyní','byl tvým předkem')]. Její příběh by pak mohl posloužit k vytvoření více či méně věrohodných nároků na některá z těch území... nebo dokonce na všechna.“"
 commission_epic.6003.servant: "[composer.GetName] pilně pracuje na mé stále pochybnější kronice.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ [Select_CString(composer.IsFemale,'říká','říká')], „[Select_CString(composer.IsFemale,'našla','našel')] jsem zašlý votivní nápis po [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'Lovkyni','Vysokém na loket')], [Select_CString(ancestor_1.IsFemale,'královně','králi')], [Select_CString(ancestor_1.IsFemale,'která kdysi vládla','který kdysi vládl')] v [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] a [neighboring_county_3.GetNameNoTier]. [Select_CString(composer.IsFemale,'Mohla','Mohl')] bych tvůj rodokmen trochu tvořivě doplnit a doložit, že [Select_CString(ancestor_1.IsFemale,'byla tvou předkyní','byl tvým předkem')]. Pak už by v kronice stačilo pár drobných příkras a podobných věcí, aby se pevně doložilo tvé právo na některá z těch území... nebo dokonce na všechna.“"
 commission_epic.6003.scribes: "Moji písaři pilně pracují na mé čím dál spletitější kronice.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ říkají, „našli jsme poznámku na okraji starobylého rukopisu, která zmiňuje [Select_CString(ancestor_1.IsFemale,'ženu','muže')] jménem [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'Štědrá','Jednooký')], [Select_CString(ancestor_1.IsFemale,'která měla','který měl')] za dávných časů jistý vliv v [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] a [neighboring_county_3.GetNameNoTier]. Mohli bychom se ponořit do rodokmenů a tvořivě #italic doložit#!, že [Select_CString(ancestor_1.IsFemale,'byla vaší předkyní','byl vaším předkem')]. V kronice bychom pak tuto skutečnost mohli využít k podpoře vašeho práva vládnout některým z těch území... nebo dokonce všem.“"
 commission_epic.6003.a: "Všechna!"
 commission_epic.6003.b: "[neighboring_county_1.GetNameNoTierNoTooltip] zní v tuto roční dobu lákavě!"
 commission_epic.6003.c: "Chci [neighboring_county_2.GetNameNoTierNoTooltip]!"
 commission_epic.6003.d: "[neighboring_county_3.GetNameNoTierNoTooltip] musí být moje."
 commission_epic.paranoid_neighbors: "Tvé sousedy velmi rozčílí, až se o této kronice dozvědí"
 commission_epic.6004.t: "Věrohodné nároky"
 commission_epic.6004.writerservant: "[composer.GetName] pilně pracuje na mé kronice, která se rozrůstá rozsahem i objemem.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ [Select_CString(composer.IsFemale,'říká','říká')], „[Select_CString(composer.IsFemale,'našla','našel')] jsem starý dokument o daních a pozemkových právech. Je to zoufale nudné čtení, ale zmiňuje [Select_CString(ancestor_1.IsFemale,'paní','pána')] jménem [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'Vysoká','Plešatý')], [Select_CString(ancestor_1.IsFemale,'která kdysi vládla','který kdysi vládl')] v [neighboring_county_1.GetNameNoTier] a [neighboring_county_2.GetNameNoTier]. [Select_CString(composer.IsFemale,'Podařilo se mi','Podařilo se mi')] vysledovat rodovou linii od pozdní antiky až k tobě! Mohu ti tedy opatřit nárok na kterékoli z těchto území, a natolik věrohodný, že ho nikdo nebude moci zpochybnit.“"
 commission_epic.6004.scribes: "Moji písaři pilně pracují na mé kronice, která je každým dnem delší a objemnější.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ říkají, „našli jsme královskou listinu velmi starobylého původu, která svěřuje vládu nad [neighboring_county_1.GetNameNoTier] a [neighboring_county_2.GetNameNoTier] [Select_CString(ancestor_1.IsFemale,'paní','pánu')] jménem [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'Dobrá','Šťastný')]. S pomocí [ROOT.GetCharacter.GetFaith.HighGodName] se nám podařilo vysledovat vaši rodovou linii až k této postavě a samozřejmě jsme to řádně zaznamenali do kroniky. Kterékoli z těchto území by vám právem náleželo.“"
 commission_epic.6004.a: "Proč ne rovnou obě?"
 commission_epic.6004.b: "[neighboring_county_1.GetNameNoTierNoTooltip] je nepochybně součástí mého dědictví."
 commission_epic.6004.c: "Vždycky jsem cítil, že mi [neighboring_county_2.GetNameNoTierNoTooltip] má patřit!"
 commission_epic.6005.t: "Nedokončený epos"
 commission_epic.6005.writerservant: "Už dlouho tuším, že s mou kronikou není něco v pořádku, a teď za mnou [composer.GetName] skutečně [Select_CString(composer.IsFemale,'přichází ustaraná','přichází ustaraný')].\n\n„Bohužel, [ROOT.Char.Custom('FormOfAddressForLiege')],“ říká, „ať jsem se snažil jakkoli, nepodařilo se mi najít žádné historické nároky, které by šlo dostatečně doložit. V této práci nemohu pokračovat. Přesto se mi podařilo vytvořit kroniku opěvující ctnosti vaší dynastie. Prosím, spokojte se s ní a netrestejte mě za mé selhání...“"
 commission_epic.6005.scribes: "Moji písaři se s mou kronikou očividně potýkají a teď za mnou skutečně přicházejí s ustaranými výrazy.\n\n„Bohužel,“ říkají, „nepodařilo se nám najít žádné historické nároky, které by šlo dostatečně doložit. Snažili jsme se, ale bylo to nad naše síly. Přesto jsme vytvořili kroniku opěvující ctnosti vaší dynastie. Prosím, spokojte se s ní a netrestejte nás za naše selhání...“"
 commission_epic.6005.a: "Do hladomorny s vámi!"
 commission_epic.6005.b: "Vy neschopní břídilové..."
 commission_epic.6005.c: "Trestá mě snad [ROOT.GetCharacter.GetFaith.HighGodName] za mou marnivost?"
 commission_epic.6005.d: "Alespoň mám kroniku..."
 commission_epic.6006.t: "Působivá propaganda"
 commission_epic.6006.writerservant: "„Je hotovo, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')],“ [Select_CString(composer.IsFemale,'říká','říká')] [composer.GetName] se zjevnou úlevou a podává mi mohutný svazek.\n\n„Toto je kronika rodu [ROOT.Char.GetDynastyHouseNameNoTooltip], která dopodrobna líčí jeho dějiny vlády nad všemi územími, po nichž toužíte. Teď už přece nikdo nemůže zpochybnit vaše oprávněné nároky!“"
 commission_epic.6006.scribes: "Moji písaři konečně dokončili propagandistickou kroniku. Když mi podávají nesmírně objemnou knihu, vypadají, že se jim ulevilo.\n\n„Tady je, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], velká kronika rodu [ROOT.Char.GetDynastyHouseNameNoTooltip], která podrobně rozvádí všechny vaše nároky. Kéž vám přinese mnoho štěstí.“"
 commission_epic.6006.a: "Dokonalé!"
 propaganda_chronicle_name: "Propagandistická kronika rodu [ROOT.Char.GetDynastyHouseNameNoTooltip]"
 propaganda_chronicle_desc: "Tento těžkopádný svazek do úmoru podrobně rozvádí slávu rodu [ROOT.Char.GetDynastyHouseNameNoTooltip] a jeho nejrůznější, více či méně bizarní územní nároky."
 half_baked_propaganda_chronicle_name: "Nedokončená propagandistická kronika"
 half_baked_propaganda_chronicle_desc: "Kdyby byla tato kniha dokončena, možná by nechvalně proslula. V současné podobě však nedokáže žádného čtenáře přesvědčit o územních nárocích, o něž její zadavatel usiloval, a místo toho se rozplývá nad údajnými ctnostmi dynastie [ROOT.Char.GetDynastyNameNoTooltip]."
 commission_epic.9001.t: "Rodový epos"
 commission_epic.9001.writer: "Velkolepá [ROOT.Char.Custom('CompositionType')] o mém rodu je konečně hotová a [composer.GetTitledFirstName] má být na co [Select_CString(composer.IsFemale,'hrdá','hrdý')]!"
 commission_epic.9001.servant: "Zdá se, že jsem [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] dobře, když jsem tvorbu [ROOT.Char.Custom('CompositionType')] o mém rodu [Select_CString(composer.IsFemale,'svěřila ženě, kterou je','svěřil muži, kterým je')] [composer.GetTitledFirstName]. Navzdory všem obtížím, s nimiž se [Select_CString(composer.IsFemale,'musela','musel')] potýkat, je hotové dílo skutečně působivé."
 commission_epic.9001.scribes: "Velkolepá [ROOT.Char.Custom('CompositionType')] o mém rodu je konečně hotová a moji [ROOT.Char.Custom('CommissionEpicScribes')] mají být na co hrdí!"
 commission_epic.9001.conclusion: "\n\nV jejím středu stojí mí předkové jako zářný příklad toho, co znamená být panovníkem naší doby. Místy se sice trochu vleče a část, kde se objevuje [ROOT.Char.Custom('CompositionDetail')], je naprosto směšná, přesto jsem [Select_CString(ROOT.Char.IsFemale,'hrdá','hrdý')], že ji mohu uchovat v rodové knihovně, aby z ní další generace čerpaly poučení i potěšení."
 commission_epic.9001.a: "Jaké příběhy dokáže historie vyprávět."
 commission_epic.9002.t: "Vynikající rodový epos"
 commission_epic.9002.writer: "[composer.GetTitledFirstName] [Select_CString(composer.IsFemale,'dokončila','dokončil')] můj rodový epos a výsledkem je vskutku nádherná [ROOT.Char.Custom('CompositionType')]!"
 commission_epic.9002.scribes: "Moji [ROOT.Char.Custom('CommissionEpicScribes')] dokončili můj rodový epos a výsledkem je vskutku nádherná [ROOT.Char.Custom('CompositionType')]!"
 commission_epic.9002.conclusion: "\n\nNechybí v ní velká dramata, morální dilemata ani napínavé souboje. Je v ní všechno, co utvářelo můj rod! Dokonce i zdánlivě přitažená za vlasy část, kde se objevuje [ROOT.Char.Custom('CompositionDetail')], se proměnila v dojemný okamžik, který vykresluje osud mého rodu!"
 commission_epic.9002.a: "Tohle je možná nejlepší [ROOT.Char.Custom('CompositionType')], jaká kdy vznikla!"
 commission_epic.9101.t: "Rodový epos: Hotové dílo"
 commission_epic.9101.desc: "Po všem tom čase, který [composer.GetTitledFirstName] [Select_CString(composer.IsFemale,'strávila','strávil')] u mého dvora, a po tom, jak dobře mě [Select_CString(composer.IsFemale,'poznala','poznal')], mi připadá zvláštní, že se chystá odejít.\n\n„Musím jít dál. Jsou i jiná místa a jiné příběhy, které je třeba vyprávět,“ snaží se mi vysvětlit."
 commission_epic.9101.a: "Asi nastal čas se rozloučit."
 commission_epic.9101.b: "Tady na tebe ještě čeká tolik možností!"
 commission_epic.9101.c: "I já tě potřebuji. Tady."
 commission_epic.9101.d: "Dokud mi budeš psát!"
 commission_epic.9101.d.tt: "[composer.GetTitledFirstName] odejde z tvého dvora"
 commission_epic.9102.t: "Rodový epos: Ve službách"
 commission_epic.9102.desc: "[composer.GetTitledFirstName] se [Select_CString(composer.IsFemale,'ukázala','ukázal')] mnohem schopnější, než bych od obyčejného služebnictva čekal. [Select_CString(ROOT.Char.IsFemale,'Kdybych neznala pravdu, skoro bych věřila','Kdybych neznal pravdu, skoro bych věřil')], že [composer.GetTitledFirstName] pochází z rodu básníků!\n\nPo všem čase, který jsme spolu strávili, mi připadá zvláštní, že se má [Select_CString(composer.IsFemale,'vrátit k přehazování hlíny lopatou nebo k čemukoli, co dělala dřív','vrátit k přehazování hlíny lopatou nebo k čemukoli, co dělal dřív')]."
 commission_epic.9102.a: "[Select_CString(composer.IsFemale,'Měla by vyrazit','Měl by vyrazit')] do světa."
 commission_epic.9102.a.flavor: "Ať zkusí, zda ve světě dokáže něčeho dosáhnout"
 commission_epic.9102.b: "Jistě pro [Select_CString(composer.IsFemale,'ni','něj')] najdu nějaké využití."
 commission_epic.9102.c: "Ač to zní podivně, chci, aby tu [Select_CString(composer.IsFemale,'zůstala','zůstal')]."
 commission_epic.9103.desc: "Po všem tom čase, který [composer.GetTitledFirstName] [Select_CString(composer.IsFemale,'strávila','strávil')] u mého dvora, a po tom, jak dobře mě [Select_CString(composer.IsFemale,'poznala','poznal')], mi připadá správné, že nikam daleko neodchází.\n\n[composer.GetFirstNameNoTooltip] souhlasí. „Ještě mám spoustu příběhů, které je třeba vyprávět, a připadá mi správné vyprávět je dál právě tady.“"
 commission_epic.9103.a: "Budeš mi dál čestně sloužit."
 commission_epic.9104.desc: "Po všem tom čase, který [composer.GetTitledFirstName] [Select_CString(composer.IsFemale,'strávila','strávil')] u mého dvora, a po tom, jak dobře mě [Select_CString(composer.IsFemale,'poznala','poznal')], mi připadá zvláštní, že tu není, aby [Select_CString(composer.IsFemale,'viděla','viděl')], jakého přijetí se jejímu dílu dostává.\n\nUčenci i děti se věnují [ROOT.Char.Custom('CompositionTypeActionPP')] tohoto díla a dokonce i pro mě je inspirací."
 commission_epic.9104.a: "Alespoň [Select_CString(composer.IsFemale,'neodešla','neodešel')] navždy!"
 commission_epic.9104.b: "Takový už někdy život je."
 commission_epic.9104.b.flavor: "Při [ROOT.Char.Custom('CompositionTypeActionPP')|U] tohoto příběhu mě napadá: [Select_CString(composer.IsFemale,'tušila','tušil')] [composer.GetFirstNameNoTooltip], že to skončí právě takhle?"
 commission_epic.9998.t: "Rodový epos: Nepříjemná komplikace"
 commission_epic.9998.imprisoned_by_me: "Protože je [composer.GetTitledFirstName] v mém žaláři,"
 commission_epic.9998.imprisoned: "Protože je [composer.GetTitledFirstName] ve vězení,"
 commission_epic.9998.incapacitated: "Vzhledem k tomu, v jakém je [composer.GetTitledFirstName] stavu,"
 commission_epic.9998.left_court: "Protože [composer.GetTitledFirstName] už není u mého dvora,"
 commission_epic.9998.ending: "jen těžko může pokračovat v práci na mém rodovém eposu.\n\nNaštěstí jsou moji [ROOT.Char.Custom('CommissionEpicScribes')] připraveni převzít její povinnosti."
 commission_epic.9998.a: "Určitě si povedou dost dobře."
 commission_epic.9998.tt: "Práce pokračují"
 commission_epic.9999.t: "Rodový epos: Konec"
 commission_epic.9999.murdered_by_me: "Vzhledem k drastickým opatřením, ke kterým jsem nakonec [Select_CString(ROOT.Char.IsFemale,'musela','musel')] sáhnout, je zřejmé, že [composer.GetTitledFirstName] se pro tvorbu mého rodového eposu nakonec vůbec [Select_CString(composer.IsFemale,'nehodila','nehodil')].\n\nNaštěstí jsou moji [ROOT.Char.Custom('CommissionEpicScribes')] dost schopní na to, aby jej dokončili sami."
 commission_epic.9999.died: "Poté, co [composer.GetTitledFirstName] [Select_CString(composer.IsFemale,'zemřela','zemřel')], zůstal můj rodový epos nedokončený.\n\nNebude to snadný úkol, ale moji [ROOT.Char.Custom('CommissionEpicScribes')] budou muset v práci pokračovat."
 commission_epic.9999.a: "[Select_CString(composer.IsFemale,'Její','Jeho')] dílo bude dokončeno."
