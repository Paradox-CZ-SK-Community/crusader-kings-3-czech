 commission_epic.0001.t: "Rodinná epopej"
 commission_epic.0001.desc: "Potřebuji klasický příběh o velkoleposti mé rodiny. [ROOT.Char.Custom('CompositionType')] o původu dynastie [ROOT.Char.GetDynasty.GetBaseName] a o tom, jak jsme předurčeni k velkosti!\n\nPotřebuji jen někoho, kdo umí vyprávět příběh..."
 commission_epic.0001.a: "[writer.GetTitledFirstNameNoTooltip], zručný vypravěč!"
 writer_writes_epic: "[writer.GetTitledFirstName] vypravěč skládá epopej"
 commission_epic.0001.b: "Shromáždím některé z mých nejlepších [ROOT.Char.Custom('CommissionEpicScribes')]."
 scribes_write_epic: "Moji písaři skládají epopej"
 bards_write_epic: "Moji bardové skládají epopej"
 commission_epic.0001.c: "Určitě by to zvládl i nějaký prostý [servant.Custom('GenderedLowlyServantType')]?"
 servant_writes_epic: "[servant.GetTitledFirstName] sluha skládá epopej"
 commission_epic.0001.d: "Po rozmyšlení..."
 commission_epic.writing_begins: "Skládání začíná..."
 commission_epic.high_chance: "Vysoká šance na [exceptional_epic|E]"
 commission_epic.medium_chance: "Nepředvídatelná šance na [exceptional_epic|E]"
 commission_epic.low_chance: "Nízká šance na [exceptional_epic|E]"
 commission_epic.opt_out: "Prozatím nebudu psát rodinnou epopej"
 commission_epic.reduced_chance: "Snížená šance na vytvoření [exceptional_epic|E]"
 commission_epic.increased_chance: "Zvýšená šance na vytvoření [exceptional_epic|E]"
 commission_epic.0002.t: "Rodinná epopej: Perspektiva"
 commission_epic.0002.writer: "Moje rodinná epopej se zdá postupovat dobře a některé pasáže už zní, jako by se citovaly desítky let, ale [writer.GetTitledFirstName] má spoustu otázek ohledně zaměření příběhu.\n\nBylo by snazší odpovědět, kdyby nejdříve [Select_CString(writer.IsFemale,'napsala','napsal')] všechno. Pak bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] [writer.GetHerHim] říct, co se mi nelíbí, ale [writer.GetSheHe] trvá na tom, že potřebuje odpovědi hned."
 commission_epic.0002.servant: "[servant.GetFirstName], sluha, kterého jsem přikázal pracovat na historii mé rodiny, se zdá být trochu v nesnázích. Že [servant.GetSheHe] vůbec dělá nějaký pokrok, je nicméně docela působivé. Ukazuje se, že [servant.GetSheHe] ani číst, ani rýmovat neumí.\n\nPřesto [servant.GetSheHe] pracuje dnem i nocí a nyní ke mně přišel s důležitou otázkou. „O čem by to vlastně mělo být, [ROOT.Char.Custom('FormOfAddressForLiege')]?" # todo: RETRANSLATED ENGLISH
 commission_epic.0002.scribes: "Moji [ROOT.Char.Custom('CommissionEpicScribes')] začali pracovat na mém rodinném eposu, ale už narážejí na potíže. Nemohou se shodnout, na čem by se příběh měl zaměřit – každý [ROOT.Char.Custom('CommissionEpicScribe')] náhodou trvá na tom, že právě jeho oblast by měla být nejvíce zdůrazněna.\n\n„Nechceme vnucovat, [ROOT.Char.Custom('FormOfAddressForLiege')], ale vy #EMP musíte#! to rozhodnout dřív, než se navzájem roztrháme!" # todo: RETRANSLATED ENGLISH
 commission_epic.0002.iberia_epic.a: "Napište o právu mé dynastie vládnout Iberii!"
 commission_epic.0002.a: "Zaměřte se na příběhy o nárocích mé dynastie"
 commission_epic.propaganda: "Po dokončení epopeje získám [claims|E] na sousedních titulech"
 commission_epic.0002.b: "Mělo by se samozřejmě zaměřit na mě a můj osud!"
 commission_epic.more_prestige: "Po dokončení získám více osobního [prestige|E]"
 commission_epic.0002.c: "Je to #EMP rodinná#! historie, tak buďte štědří."
 commission_epic.more_dynasty_prestige: "Získám více [dynasty_prestige|E] po dokončení"
 commission_epic.0002.d: "Vyprávějte příběh co nejpravdivěji."
 commission_epic.more_piety: "Po dokončení také získám nějaké [piety|E]"
 commission_epic.1001.t: "Rodinná epopej: Otázka času"
 commission_epic.1001.opening: "Už týdny mi nepředložili žádnou novou práci na mé rodinné epopeji a celý proces buď trvá příliš dlouho, nebo"
 commission_epic.1001.composer: "[composer.GetSheHe] nakonec odvádí špatnou práci! Je opravdu příliš mnoho požadovat, aby [Select_CString(composer.IsFemale,'předvedla','předvedl')] dokonalost a [Select_CString(composer.IsFemale,'udělala','udělal')] to hned?"
 commission_epic.1001.scribes: "Moji [ROOT.Char.Custom('CommissionEpicScribes')] nakonec odvedou špatnou práci! Je opravdu příliš mnoho požadovat, aby předvedli dokonalost a udělali to rychle?"
 commission_epic.1001.a: "Chci, aby to bylo dobré, a chci to #EMP hned!#!"
 commission_epic.1001.b: "Přinutím [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] zůstat tak dlouho, jak to bude potřeba."
 commission_epic.1001.b_scribes: "Přinutím [ROOT.Char.Custom('CommissionEpicComposerThem')] zůstat tak dlouho, jak to bude potřeba."
 commission_epic.1001.c: "Pokud rozdělíme to, co je již hotové, na část 1..."
 commission_epic.1002.t: "Rodinná epopej: Bohatý zdroj materiálu"
 commission_epic.1002.composer: "[composer.GetTitledFirstName] vypráví [powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] o několika vzrušujících detailech, které [Select_CString(composer.IsFemale,'objevila','objevil')] o mých předcích. „Teď si myslím, že část s [ROOT.Char.Custom('CompositionDetail')] může být skutečná, protože—“\n\nJe to jistě fascinující, ale nemá přece [composer.GetSheHe] za úkol dokončit rozsáhlou [ROOT.Char.Custom('CompositionType')]? Co se týče tohoto konkrétního příběhu..."
 commission_epic.1002.scribes: "Někteří z mých písařů vyprávějí [powerful_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] o několika vzrušujících detailech, které objevili o mých předcích. „Teď si myslíme, že část s [ROOT.Char.Custom('CompositionDetail')] může být skutečná, protože—“\n\nJe to jistě fascinující, ale nemají přece moji [ROOT.Char.Custom('CommissionEpicScribes')] za úkol dokončit rozsáhlou [ROOT.Char.Custom('CompositionType')]? Co se týče tohoto konkrétního příběhu..."
 commission_epic.1002.a: "Mělo by být sdíleno se všemi mými vazaly!"
 commission_epic.1002.a.tt: "Po dokončení obdržíte knihu Rodinné epopeje [artifact|E], která zlepší [vassal|E] [opinion|E]"
 commission_epic.1002.b: "Dejte to do [ROOT.Char.Custom('CompositionType')], aby to bylo hotovo dříve!"
 commission_epic.1002.b.tt: "Což také znamená, že si mohu vzít zpět část mzdy!"
 commission_epic.1003.t: "Rodinná epopej: Spisovatelský ústup"
 commission_epic.1003.composer: "[composer.GetTitledFirstName] [Select_CString(composer.IsFemale,'byla','byl')] [Select_CString(composer.IsFemale,'přistižena','přistižen')], když se [Select_CString(composer.IsFemale,'pokoušela','pokoušel')] vykrást z povinností! Naštěstí ho stráž poznala, když [Select_CString(composer.IsFemale,'procházela','procházel')] branami.\n\n„Je to vyčerpávající práce,“ hájí se [composer.GetSheHe]. „Den i noc, můj štědrý [ROOT.Char.GetLadyLord]! Zoufale potřebuji pár dní odpočinku.“"
 commission_epic.1003.scribes: "Některé z mých pisářů byly přistiženy při pokusu vykrást se od povinností u mého rodinného eposu! Naštěstí je hlídač [Select_CString(ROOT.Char.IsFemale,'poznala','poznal')], když procházeli branou.\n\n„Je to vyčerpávající práce,“ vysvětlují. „Den i noc, [ROOT.Char.Custom('FormOfAddressForLiege')]! Zoufale potřebujeme pár dnů odpočinku." # todo: RETRANSLATED ENGLISH
 commission_epic.1003.a: "Dobře, možná je na místě trochu odpočinku."
 commission_epic.1003.b: "Připoutejte [ROOT.Char.Custom2('CommissionEpicComposerThem', composer)] ke stolu [ROOT.Char.Custom2('CommissionEpicComposerTheir', composer)]!"
 commission_epic.1003.b_scribes: "Připoutejte [ROOT.Char.Custom('CommissionEpicComposerThem')] ke stolu [ROOT.Char.Custom('CommissionEpicComposerTheir')]!"
 commission_epic.1004.t: "Rodinná epopej: Mistr iluminátor"
 commission_epic.1004.opening: "Dostala se ke mně zpráva, že"
 commission_epic.1004.devotee_male: "[ROOT.Char.GetFaith.DevoteeMale]"
 commission_epic.1004.devotee_female: "[ROOT.Char.GetFaith.DevoteeFemale]"
 commission_epic.1004.ending: "který je proslulý svými iluminacemi, se zdrží ve městě v [barony.GetNameNoTier]. S postupem mé rodinné epopeje by to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být ideální čas přemýšlet, jak by měly stránky vypadat, až bude vše hotovo."
 commission_epic.1004.a: "Najmi iluminátora, za jakoukoli cenu!"
 commission_epic.1004.b: "[composer.GetTitledFirstNameNoTooltip] to může udělat [composer.GetHerselfHimself]."
 commission_epic.1004.b_scribes: "Moji [ROOT.Char.Custom('CommissionEpicScribes')] to zvládnou sami."
 commission_epic.1004.success: "Vynikající iluminace"
 commission_epic.1004.failure: "Špatné iluminace"
 commission_epic.1004.c: "Vždy jsem se [Select_CString(ROOT.Char.IsFemale,'považovala','považoval')] za jakéhosi umělce..."
 commission_epic.1005.t: "Rodinná epopej: Píseň našeho lidu"
 commission_epic.1005.opening: "Přemýšlím o posledních verších"
 commission_epic.1005.composer: "[composer.GetFirstName] má"
 commission_epic.1005.scribes: "moji [ROOT.Char.Custom('CommissionEpicScribes')] mají"
 commission_epic.1005.ending: "mi poskytl z mého rodinného eposu, a když začnu broukat, uvědomím si, že následuje stejný rytmus jako jedna z oblíbených písní jednoho z mých kmenovců!\n\nKdyby byla historie mých předků uvedena k tak nezapomenutelné melodii, jistě by nikdy nebyla zapomenuta!"
 commission_epic.1005.a: "Měl jsem o to požádat už od začátku!"
 commission_epic.1005.b_composer: "Jsem si jistý, že [ROOT.Char.Custom2('CommissionEpicComposer', composer)] může vymyslet něco stejně dobrého."
 commission_epic.1005.b: "Jsem si jistý, že [ROOT.Char.Custom('CommissionEpicComposer')] zvládne vymyslet něco stejně dobrého."
 commission_epic.1005.classic: "Složená klasická melodie"
 commission_epic.1005.enjoyable: "Složená příjemná melodie"
 commission_epic.1005.terrible: "Složená příšerná melodie"
 commission_epic.1006.opening: "[vassal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 commission_epic.1006.desc: "Mám [ROOT.Char.Custom('CompositionTypeActionPast')] části tvého nového rodinného eposu, a pravá věrnost vyvolaná hlubokým přátelstvím mezi těmito legendárními hrdiny mě inspiruje.\n\nBylo by mi ctí nazvat tě svým přítelem, zatímco ti věrně sloužím."
 commission_epic.1006.a: "Vždy jsi [Select_CString(ROOT.Char.IsFemale,'byla','byl')] mým přítelem, [vassal.GetFirstNameNoTooltip]!"
 commission_epic.1006.b: "Tvoje věrnost by měla být zaručena, ať se děje cokoli."
 commission_epic.1007.opening: "[vassal.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 commission_epic.1007.desc: "Mám [ROOT.Char.Custom('CompositionTypeActionPast')] části tvého nového rodinného eposu a jsem otřesen, jak přehlíží příspěvky mých vlastních předků!\n\nTento ostuda je poslední kapkou. Je jasné, že ke mně a mé rodině nechováš nic než zlou vůli!"
 commission_epic.1007.a: "Jak se opovažuješ takhle mluvit se svým pánem?!"
 commission_epic.1007.b: "Omlouvám se, tvá rodina bude samozřejmě zahrnuta!"
 commission_epic.2001.t: "Rodinný epos: Přednost"
 commission_epic.2001.desc_composer: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přichází ke mně nadšený zprávami. „Právě jsem [ROOT.Char.Custom('CompositionTypeActionPP')] poslední část tvého rodinného eposu, a [ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer )] [Select_CString(ROOT.Char.IsFemale,'objevila','objevil')] něco velmi zajímavého!“"
 commission_epic.2001.desc_scribes: "[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přichází ke mně nadšený zprávami. „Právě jsem [ROOT.Char.Custom('CompositionTypeActionPP')] poslední část tvého rodinného eposu, a [ROOT.Char.Custom('CommissionEpicComposer')] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] [Select_CString(ROOT.Char.IsFemale,'objevila','objevil')] něco velmi zajímavého!“"
 commission_epic.2001.desc: "\n\nZdá se, že [county.GetName] nikdy neměl být natrvalo v držení rodu [vassal.GetHouse.GetName]. [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych vznést rozumný nárok proti [vassal.GetTitledFirstName]!"
 commission_epic.2001.a: "Jestliže mi právem náleží, získám ho."
 commission_epic.2001.b: "[vassal.GetFirstNameNoTooltip] by si jistě přál formálně potvrdit ten převod."
 commission_epic.2001.c: "Tohle můžeme nechat být."
 commission_epic.2001.c.flavor: "Ale ujisti se, že [vassal.GetTitleTierName] o tom ví."
 commission_epic.2002.t: "Rodinný epos: Pýcha rodu"
 commission_epic.2002.desc: "[spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se zdá být poslední osobou, která měla [ROOT.Char.Custom('CompositionTypeActionPast')] úryvky z mého rodinného eposu.\n\n„Tvůj praprapředek [grandparent.GetMotherFather] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] fascinující a podnikavá postava,“ říká mi [spymaster.GetSheHe]. „Kdybychom dali najevo, že jsi aspoň z poloviny tak zákulisně mazaný jako [grandparent.GetSheHe], lidé by si dvakrát rozmysleli, než by proti tobě něco podnikli.“"
 commission_epic.2002.a: "Krev té zmije teče v mých žilách!"
 commission_epic.2002.a.tt: "Po dokončení obdržíte knihu rodinného eposu [artifact|E], která zvyšuje [hostile_scheme_resistance|E]"
 commission_epic.2002.b: "Nebo tvrdíme, že [grandparent.GetSheHe] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] ctihodný a čestný..."
 commission_epic.2003.t: "Rodinný epos: Věčné závazky"
 commission_epic.2003.desc: "Zdá se, že [court_chaplain.GetFirstName] [ROOT.Char.Custom('CompositionTypeActionPP')] části mého nového rodinného eposu. Samozřejmě, [court_chaplain.GetSheHe] [Select_CString(ROOT.Char.IsFemale,'objevila','objevil')] „rozpory“ mezi sliby danými v minulosti a naší současnou realitou.\n\nVidím, že [court_chaplain.GetSheHe] to brzy nenechá být. „Určitě vidíš, jak moudré a prozíravé by bylo splnit slib tvých předků i nyní?“"
 commission_epic.2003.a_same_dynasty: "Oba víme, že naše dynastie dodržuje své sliby."
 commission_epic.2003.a: "Patřím do dlouhé linie těch, kteří své sliby plní."
 commission_epic.2003.b: "Moji předkové byli [ROOT.Char.Custom('GetPiousBelievers')], ale nemuseli být moudří." # todo: RETRANSLATED ENGLISH
 commission_epic.2004.t: "Rodinný epos: Náhlá inspirace"
 commission_epic.2004.desc_scribes: "[ROOT.Char.Custom('CommissionEpicComposer')|U] [ROOT.Char.Custom('CommissionEpicComposerHasHave')] učinil řadu úprav..."
 commission_epic.2004.desc_composer: "[ROOT.Char.Custom2('CommissionEpicComposer', composer)] [ROOT.Char.Custom2('CommissionEpicComposerHasHave', composer )] učinil řadu úprav..."
 commission_epic.2004.desc: "úpravy v mém rodinném eposu v ohledu na války a bitvy. Dělá to dramatické scény, ale obávám se, že můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] uražen, když [marshal.GetSheHe] svraštil čelo při jedné scéně.\n\nSkoro se mi ulevilo, když [marshal.GetSheHe] konečně sdílel své myšlenky. „Je to všechno nesmysl, ale tahle část s [ROOT.Char.Custom('CompositionDetail')] mi dala nějaké nápady...“"
 commission_epic.2004.a: "Kdekoliv lze najít inspiraci, měli bychom ji využít!"
 commission_epic.2004.a.tt: "Po dokončení obdržíte knihu rodinného eposu [artifact|E], která zvyšuje bojové [advantage|E]"
 commission_epic.2004.b: "Vysvětli mi to podrobně..."
 commission_epic.2005.t: "Rodinný epos: Poctivost a vnímání"
 commission_epic.2005.desc: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chancellor'))], [chancellor.GetTitledFirstName], [ROOT.Char.Custom('CompositionTypeActionPP')] můj rodinný epos, jak se pomalu skládá.\n\n„Velká část není příliš pravděpodobná, například část s [ROOT.Char.Custom('CompositionDetail')],“ říká mi [chancellor.GetSheHe]. „Na druhou stranu, kdo ví, jak minulost skutečně vypadala? Pokud už děláš přibarvování, proč to neztáhnout co nejdál?“"
 commission_epic.2005.a: "Vždyť je důležité, abychom vyprávěli dobrý příběh..."
 commission_epic.2005.b: "Ne, mělo by to být co nejvíce věrné skutečnosti."
 commission_epic.2005.b.tt: "Po dokončení obdržíte knihu rodinného eposu [artifact|E], která zlepšuje [personal_scheme|E] [success_chance|E]"
 commission_epic.2006.t: "Rodinný epos: Vázáno vírou"
 commission_epic.2006.desc: "Nevím, zda mám být ulehčen nebo znepokojen nadšením, které můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_chaplain'))], [court_chaplain.GetTitledFirstName], projevuje poté, co [ROOT.Char.Custom('CompositionTypeActionPP')] dokončené části mého rodinného eposu.\n\n„Tohle je vyprávění krásné mravnosti!“ tvrdí [court_chaplain.GetSheHe]. „Dynastie [ROOT.Char.GetDynasty.GetBaseName] vždycky zažívala velikost, když jí radili [ROOT.Char.GetFaith.AltPriestTermPlural], a temné časy, když jejich rady opomíjela! Doufám, že je to lekce, které se i vy dobře naučíte." # todo: RETRANSLATED ENGLISH
 commission_epic.2006.a: "Ano, to moc dobře vím."
 commission_epic.2006.a.tt: "Po dokončení obdržíte knihu rodinného eposu [artifact|E], která zvyšuje [piety|E] a daň od stoupenců stejné [faith|E]"
 commission_epic.2006.b: "Ha! Je to naopak."
 commission_epic.2006.b.flavor: "Vždy jsme byli v čele [ROOT.Char.GetFaith.AltPriestTermPlural]."
 commission_epic.2006.c: "Oba víme, že rodina má ve všem přednost."
 commission_epic.2006.c.same_dynasty: "Tato volba je dostupná proto, že [court_chaplain.GetFirstNameNoTooltip] je ze stejné [dynasty|E] jako já"
 commission_epic.6001.t: "Drobná přibarvení"
 commission_epic.6001.writerservant: "Po nějaké době práce na kronice mě vyhledá [composer.GetName].\n\n„[Select_CString(ROOT.Char.IsFemale,'Milady','Sire')]“, říká [composer.GetSheHe], „musím přiznat, že ačkoli je tvá dynastie opravdu vznešená, nároky na dědictví, které jsi doufal najít, nemusí být...tak snadno doložitelné. Potřebuji více času a více prostředků, abych hlouběji prohledal staré texty. Jinak budu muset udělat několik malých #italic přibarvení#! do příběhů, a tvé nároky tak mohou vyznít méně přesvědčivě...“"
 commission_epic.6001.scribes: "Moji písaři pracovali dnem i nocí, prohrabávajíce se starými rukopisy, snažící se najít územní nároky mých předků, které bychom mohli v kronice vyzdvihnout.\n\n„Bohužel“, říkají, „budeme možná muset udělat několik drobných přibarvení, pokud jde o...pravdivost této záležitosti, činy a domény tvých předků a podobně. Určitě to chápete, [Select_CString(ROOT.Char.IsFemale,'milady','sire')]?“"
 commission_epic.6001.a: "Přibarvi to, jak chceš, hlavně to dokonči!"
 commission_epic.6001.b: "Vezmi si mé zlato a udělej další výzkum."
 commission_epic.less_credible: "Kronika bude méně důvěryhodná"
 commission_epic.more_credible: "Kronika může vyznít důvěryhodněji"
 commission_epic.6003.t: "Studené nároky"
 commission_epic.6003.writer: "[composer.GetName] pilně pracuje na mé kronice, která nabývá na velkoleposti i pochybném rozměru zároveň.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]“, říká [composer.GetSheHe], „našel jsem potrhaný starý text, kde se uvádí, že [Select_CString(ancestor_1.IsFemale,'queen','king')] zvaný [ancestor_1.GetFirstNameNoTooltip] kdysi vládl v [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] a [neighboring_county_3.GetNameNoTier]. [Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] bych se ponořit do genealogických tabulek a udělat – řekněme – #italic kreativní dodatky#!, abych doložil, že [ancestor_1.GetSheHe] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] vaším předkem. Pak bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] použít příběh [ancestor_1.GetHerHis], abych vám dal více či méně důvěryhodné nároky na některé z těchto zemí, nebo dokonce na všechny..." # todo: RETRANSLATED ENGLISH
 commission_epic.6003.servant: "[composer.GetName] pilně pracuje na mé stále pochybnější kronice.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]“, říká [composer.GetSheHe], „našel jsem zvadlou votivní nápis od [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'the Huntress','the Elbow-High')], [Select_CString(ancestor_1.IsFemale,'the queen','the king')] z [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] a [neighboring_county_3.GetNameNoTier] z dávných dob. Mohu do rodokmenu přidat několik kreativních příspěvků, abych dokázal, že [ancestor_1.GetSheHe] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] vaším předkem. Pak bych v kronice [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] učinit menší nadsázky a podobně, abych pevně ustanovil váš nárok na některé z těchto zemí – nebo i na všechny." # todo: RETRANSLATED ENGLISH
 commission_epic.6003.scribes: "Moji pisáři tvrdě pracují na mé stále spletitější kronice.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]“, říkají, „našli jsme drobnou poznámku na okraji starého rukopisu, která zmiňuje [ancestor_1.GetWomanMan] jménem [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'the Generous','the One-Eyed')], jenž kdysi měl vliv v [neighboring_county_1.GetNameNoTier], [neighboring_county_2.GetNameNoTier] a [neighboring_county_3.GetNameNoTier]. Můžeme prozkoumat genealogické tabulky a kreativně #italic doložit#!, že [ancestor_1.GetSheHe] [Select_CString(ROOT.Char.IsFemale,'byla','byl')] vaším předkem. Pak bychom toho v kronice mohli využít k podpoře vašeho práva vládnout některým z těchto území – nebo i všem..." # todo: RETRANSLATED ENGLISH
 commission_epic.6003.a: "All of them!"
 commission_epic.6003.b: "[neighboring_county_1.GetNameNoTierNoTooltip] se v tuto roční dobu zdá být příhodný!" # todo: RETRANSLATED ENGLISH
 commission_epic.6003.c: "[neighboring_county_2.GetNameNoTierNoTooltip] is what I want!"
 commission_epic.6003.d: "[neighboring_county_3.GetNameNoTierNoTooltip] musí mi patřit." # todo: RETRANSLATED ENGLISH
 commission_epic.paranoid_neighbors: "Vaši sousedé budou velmi rozhněvaní, až se o této kronice dozvědí" # todo: RETRANSLATED ENGLISH
 commission_epic.6004.t: "Credible Claims"
 commission_epic.6004.writerservant: "[composer.GetName] pilně pracuje na mé kronice, která nabývá na rozsahu i objemu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]“, říká [composer.GetSheHe], „našel jsem starý dokument o daních a pozemkových právech, dosti nudné čtení, ale zmiňoval [ancestor_1.GetLadyLord] jménem [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'the Tall','the Bald')], který vládnul [neighboring_county_1.GetNameNoTier] a [neighboring_county_2.GetNameNoTier] v dávných dobách. Podařilo se mi vystopovat [Select_CString(ancestor_1.IsFemale,'její','jeho')] původ až z doby pozdní antiky až k vám! Mohu vám tedy dát nároky na kterékoli z těchto území, tak přesvědčivé, že nikdo je nebude zpochybňovat." # todo: RETRANSLATED ENGLISH
 commission_epic.6004.scribes: "Moji pisáři tvrdě pracují na mé kronice, která s každým dnem roste na délce i rozsahu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]“, říkají, „našli jsme královskou listinu velmi starého původu, která dává vládu nad [neighboring_county_1.GetNameNoTier] a [neighboring_county_2.GetNameNoTier] [ancestor_1.GetLadyLord] jménem [ancestor_1.GetFirstNameNoTooltip] [Select_CString(ancestor_1.IsFemale,'the Good','the Fortunate')]. Skrze vedení [ROOT.GetCharacter.GetFaith.HighGodName] jsme dokázali vystopovat vaši linii až k [ancestor_1.GetHerHim] a pečlivě to zaznamenali v kronice. Kterékoli z těchto území by vám právem náleželo." # todo: RETRANSLATED ENGLISH
 commission_epic.6004.a: "Proč ne obojí?" # todo: RETRANSLATED ENGLISH
 commission_epic.6004.b: "[neighboring_county_1.GetNameNoTierNoTooltip] is certainly part of my inheritance."
 commission_epic.6004.c: "Vždy jsem měl pocit, že [neighboring_county_2.GetNameNoTierNoTooltip] by mi měl patřit!" # todo: RETRANSLATED ENGLISH
 commission_epic.6005.t: "An Epic Unfinished"
 commission_epic.6005.writerservant: "„Už dlouho tuším, že s mou kronikou něco není v pořádku, a opravdu, [composer.GetName] mě nyní hledá se znepokojeným výrazem.\n\n„Bohužel, [ROOT.Char.Custom('FormOfAddressForLiege')]“, říká [composer.GetSheHe], „jak jsem se snažil, nenašel jsem žádnou historii nároků dost silnou, abych ji podložil. Nemohu v této práci pokračovat. Přesto jsem vyhotovil kroniku, která vyzdvihuje ctnosti vaší dynastie. Prosím, buďte s tímto dílem spokojeni a netrestejte mě za mou neschopnost..." # todo: RETRANSLATED ENGLISH
 commission_epic.6005.scribes: "Mí pisáři se zdají mít potíže s mou kronikou a nyní mě skutečně hledají se znepokojeným výrazem.\n\n„Ach,“ říkají, „nenašli jsme žádnou historii nároků dost silnou, abychom ji podložili. Snažili jsme se, ale bylo to nad naše síly. Přesto jsme vytvořili kroniku, která vychvaluje ctnosti vaší dynastie. Prosíme, buďte s tím spokojeni a netrestejte nás za náš neúspěch..." # todo: RETRANSLATED ENGLISH
 commission_epic.6005.a: "Do šatlavy s tebou!" # todo: RETRANSLATED ENGLISH
 commission_epic.6005.b: "Vy neschopní hlupáci..." # todo: RETRANSLATED ENGLISH
 commission_epic.6005.c: "Trestá mě [ROOT.GetCharacter.GetFaith.HighGodName] za mou marnivost?" # todo: RETRANSLATED ENGLISH
 commission_epic.6005.d: "Aspoň mám kroniku..." # todo: RETRANSLATED ENGLISH
 commission_epic.6006.t: "Potent Propaganda"
 commission_epic.6006.writerservant: "„Je to hotové, má [ROOT.Char.GetLadyLord]“, říká [composer.GetName] s jistým ulehčením a podává mi velký svazek.\n\n„Toto je kronika rodu [ROOT.Char.GetDynastyHouseNameNoTooltip], popisující podrobně jeho historii vládnutí různým zemím, které jste si přál. Jistě vám nyní nikdo nemůže odepřít vaše spravedlivé nároky!" # todo: RETRANSLATED ENGLISH
 commission_epic.6006.scribes: "Konečně moji pisáři dokončili propagandistickou kroniku. Vypadají ulehčeně, když mi podávají obrovskou knihu.\n\n„Tady je, [Select_CString(ROOT.Char.IsFemale,'Milady','Sire')], velká kronika rodu [ROOT.Char.GetDynastyHouseNameNoTooltip], rozvádějící podrobně všechny vaše nároky. Nechť vám přinese velké štěstí." # todo: RETRANSLATED ENGLISH
 commission_epic.6006.a: "Perfect!"
 propaganda_chronicle_name: "[ROOT.Char.GetDynastyHouseNameNoTooltip] Propaganda Chronicle"
 propaganda_chronicle_desc: "Tento rozvláčný svazek rozvádí bolestně do detailu slávu rodu [ROOT.Char.GetDynastyHouseNameNoTooltip] a jeho různé, více či méně bizarní územní nároky." # todo: RETRANSLATED ENGLISH
 half_baked_propaganda_chronicle_name: "Unfinished Propaganda Chronicle"
 half_baked_propaganda_chronicle_desc: "Tato kniha by mohla zůstat ve hanbě, kdyby byla dokončena. Jak je to nyní, nedokáže čtenáře přesvědčit o územních nárocích svého mecenáše; místo toho se rozplývá nad údajným ctnostmi dynastie [ROOT.Char.GetDynastyNameNoTooltip]." # todo: RETRANSLATED ENGLISH
 commission_epic.9001.t: "A Family Epic"
 commission_epic.9001.writer: "Epické [ROOT.Char.Custom('CompositionType')] mé rodiny je konečně dokončeno, a [composer.GetTitledFirstName] má důvod k hrdosti!" # todo: RETRANSLATED ENGLISH
 commission_epic.9001.servant: "Ukazuje se, že jsem volil moudře, když jsem vybral [composer.GetTitledFirstName] k napsání [ROOT.Char.Custom('CompositionType')] mé rodiny. Navzdory [Select_CString(composer.IsFemale,'jejím','jeho')] obtížím je hotové dílo docela působivé." # todo: RETRANSLATED ENGLISH
 commission_epic.9001.scribes: "Epos [ROOT.Char.Custom('CompositionType')] mé rodiny je konečně dokončen a moji [ROOT.Char.Custom('CommissionEpicScribes')] mají důvod být hrdí!" # todo: RETRANSLATED ENGLISH
 commission_epic.9001.conclusion: "\n\nUprostřed toho stojí moji předci jako zářivý příklad toho, co znamená být vládcem své doby, i když to občas trochu táhne, a část s [ROOT.Char.Custom('CompositionDetail')] je naprosto směšná. Přesto jsem hrdý, že to mohu uchovat v rodinné knihovně, aby si z toho budoucí pokolení mohly brát ponaučení." # todo: RETRANSLATED ENGLISH
 commission_epic.9001.a: "Jaký příběh může historie vyprávět." # todo: RETRANSLATED ENGLISH
 commission_epic.9002.t: "Skvělý epos" # todo: RETRANSLATED ENGLISH
 commission_epic.9002.writer: "[composer.GetTitledFirstName] dokončil můj rodinný epos, a jaký nádherný [ROOT.Char.Custom('CompositionType')] [composer.GetSheHe] složil!" # todo: RETRANSLATED ENGLISH
 commission_epic.9002.scribes: "Moji [ROOT.Char.Custom('CommissionEpicScribes')] dokončili můj rodinný epos a jaký to [Select_CString(ROOT.Char.IsFemale,'byla','byl')] slavný [ROOT.Char.Custom('CompositionType')]!" # todo: RETRANSLATED ENGLISH
 commission_epic.9002.conclusion: "\n\nJe tam velké drama, mravní rozepře a napínavé duely. Všechno, z čeho byla moje rodina vykována, je tam! Dokonce i část s [ROOT.Char.Custom('CompositionDetail')], zdánlivě tak přitažená za vlasy, se změnila v dojemný moment vykreslující osud mého rodu!" # todo: RETRANSLATED ENGLISH
 commission_epic.9002.a: "Tohle může být nejlepší [ROOT.Char.Custom('CompositionType')], jaký kdy [Select_CString(ROOT.Char.IsFemale,'byla','byl')] napsán!" # todo: RETRANSLATED ENGLISH
 commission_epic.9101.t: "Rodinný epos: dílo dokončeno" # todo: RETRANSLATED ENGLISH
 commission_epic.9101.desc: "Po všech těch letech, co [composer.GetTitledFirstName] strávil u mého dvora, a po tom, jak mě dobře [Select_CString(composer.IsFemale,'poznala','poznal')], je to zvláštní, že se chystá odejít.\n\n„Musím jít jinam a jsou tu jiné příběhy, které je třeba vyprávět,“ snaží se [composer.GetSheHe] vysvětlit." # todo: RETRANSLATED ENGLISH
 commission_epic.9101.a: "Předpokládám, že toto je tedy sbohem." # todo: RETRANSLATED ENGLISH
 commission_epic.9101.b: "Je tu pro vás stále tolik věcí!" # todo: RETRANSLATED ENGLISH
 commission_epic.9101.c: "I já vás potřebuji. Tady." # todo: RETRANSLATED ENGLISH
 commission_epic.9101.d: "Dokud mi budeš psát!" # todo: RETRANSLATED ENGLISH
 commission_epic.9101.d.tt: "[composer.GetTitledFirstName] opustí váš dvůr" # todo: RETRANSLATED ENGLISH
 commission_epic.9102.t: "Family Epic: Servitude"
 commission_epic.9102.desc: "[composer.GetTitledFirstName] se ukázal být mnohem schopnější, než bych očekával od obyčejného služebníka. Kdybych to nevěděl, [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] bych si myslet, že [composer.GetHerHim] pochází z rodu básníků!\n\nPo všech těch letech, které jsme spolu strávili, je zvláštní, že by se [composer.GetSheHe] měl vrátit k lopatě, nebo k čemukoli, čemu se dříve věnoval."
 commission_epic.9102.a: "[composer.GetSheHe|U] by měl vyrazit do světa."
 commission_epic.9102.a.flavor: "Nechť [composer.GetSheHe] zjistí, jestli z [composer.GetHerselfHimself] dokáže něco udělat"
 commission_epic.9102.b: "Jsem si jistý, že pro [composer.GetHerHim] najdu využití."
 commission_epic.9102.c: "Ač to zní divně, chci mít [composer.GetHerHim] u sebe."
 commission_epic.9103.desc: "Po všech těch letech, které [composer.GetTitledFirstName] strávil na mém dvoře, a vzhledem k tomu, jak dobře mě [composer.GetSheHe] [Select_CString(composer.IsFemale,'poznala','poznal')], je zřejmé, že [composer.GetSheHe] nikam daleko neodchází.\n\n[composer.GetFirstNameNoTooltip] souhlasí. „Mám ještě mnoho příběhů, které chci vyprávět, a zdá se správné, že bych je měl dál vyprávět zde.“"
 commission_epic.9103.a: "Budeš mi i nadále sloužit poctivě."
 commission_epic.9104.desc: "Po všech těch letech, které [composer.GetTitledFirstName] strávil na mém dvoře, a vzhledem k tomu, jak dobře mě [composer.GetSheHe] [Select_CString(composer.IsFemale,'poznala','poznal')], je zvláštní, že [composer.GetSheHe] není tady, aby viděl přijetí [Select_CString(composer.IsFemale,'její','jeho')] díla.\n\nVzdělaní i děti [ROOT.Char.Custom('CompositionTypeActionPP')] to, a i já v tom nacházím inspiraci."
 commission_epic.9104.a: "Alespoň [composer.GetSheHe] není pryč nadobro!"
 commission_epic.9104.b: "Takový je někdy život."
 commission_epic.9104.b.flavor: "[ROOT.Char.Custom('CompositionTypeActionPP')|U] ten příběh, nemohu si pomoci: musím se ptát. Věděl [composer.GetFirstNameNoTooltip], že takto to skončí?"
 commission_epic.9998.t: "Rodinný epos: Nepříjemnost"
 commission_epic.9998.imprisoned_by_me: "Když je [composer.GetTitledFirstName] v mé kobce,"
 commission_epic.9998.imprisoned: "S [composer.GetTitledFirstName] ve vězení,"
 commission_epic.9998.incapacitated: "S [composer.GetTitledFirstName] v [Select_CString(composer.IsFemale,'jejím','jeho')] současném stavu,"
 commission_epic.9998.left_court: "S [composer.GetTitledFirstName], který už není na mém dvoře,"
 commission_epic.9998.ending: "je těžké pro [composer.GetHerHim] pokračovat ve [Select_CString(composer.IsFemale,'její','jeho')] práci na mém rodinném eposu.\n\nNaštěstí budou moji [ROOT.Char.Custom('CommissionEpicScribes')] připraveni tuto mezeru zaplnit."
 commission_epic.9998.a: "Jsem si jistý, že si poradí."
 commission_epic.9998.tt: "Práce pokračuje"
 commission_epic.9999.t: "Rodinný epos: Konec"
 commission_epic.9999.murdered_by_me: "Vzhledem k drastickým opatřením, která jsem musel učinit vůči [composer.GetTitledFirstName], se zdá, že [composer.GetSheHe] nikdy nebyl skutečně vhodný k tomu, aby složil můj rodinný epos.\n\nNaštěstí jsou moji [ROOT.Char.Custom('CommissionEpicScribes')] plně schopni dokončit to sami."
 commission_epic.9999.died: "Smrtí [composer.GetTitledFirstName] zůstává můj rodinný epos nedokončen.\n\nBude to obtížné, ale moji [ROOT.Char.Custom('CommissionEpicScribes')] budou muset pokračovat v práci."
 commission_epic.9999.a: "[Select_CString(composer.IsFemale,'Její','Jeho')] dílo bude dokončeno."
