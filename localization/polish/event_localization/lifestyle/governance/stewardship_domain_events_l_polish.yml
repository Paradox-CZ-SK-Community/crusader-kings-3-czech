l_polish:
 stewardship_domain.1041.t: "Cechovní spor"
 stewardship_domain.1041.desc: "V [guild_county.GetName] působí kovářský i kupecký cech a oba ke mně vyslaly své zástupce. Oba cechy uvízly ve sporu o obchod se surovým železem v hrabství a žádají mě o rozsudek.\n\nKaždý ze zástupců mi však potají nabídl lukrativní dohodu se svým cechem ve snaze získat mou přízeň pro svou stranu."
 stewardship_domain.1041.a: "Oběma cechům by prospělo, kdyby spolupracovaly."
 stewardship_domain.1041.a.success: "Přiměješ oba cechy ke spolupráci"
 stewardship_domain.1041.a.success.tt: "Cechy v [guild_county.GetNameNoTier] nyní spolupracují na zvýšení výroby zbraní"
 stewardship_domain.1041.a.failure: "Nepodaří se ti přimět oba cechy k dohodě"
 stewardship_domain.1041.a.failure.tt: "Cechy v [guild_county.GetNameNoTier] se nedokázaly dohodnout, jak naložit s výrobou železa"
 stewardship_domain.1041.b: "Jen kováři rozeznají dobré železo od špatného..."
 stewardship_domain.1041.b.flavor: "...a kovářský cech vybaví mé odvedence zbraněmi zdarma!"
 stewardship_domain.1041.c: "Obchod je přece záležitostí kupců..."
 stewardship_domain.1041.c.flavor: "...a kupecký cech mi bude odvádět podíl ze svého zisku!"
 stewardship_domain.1041.d: "[guild_county.GetNameNoTierNoTooltip] #EMP patří mně#!! Jen já rozhoduji o zdejším obchodu!"
 stewardship_domain.1042.t: "Rozpínavý cech"
 stewardship_domain.1042.desc: "[guild_county.Custom('Governance_1041_GuildType')|U] má v [guild_county.GetName] prodej železa pevně v rukou.\n\nSvou moc nyní využívá k účtování přemrštěných cen za své zboží. Cechovní mistři tak bohatnou, ale obchod v hrabství upadá."
 stewardship_domain.1042.a: "Pokusím se s nimi vyjednat nižší ceny."
 stewardship_domain.1042.a.success: "[guild_county.Custom('Governance_1041_GuildType')|U] přistoupí na snížení cen"
 stewardship_domain.1042.a.failure: "[guild_county.Custom('Governance_1041_GuildType')|U] odmítá snížit ceny"
 stewardship_domain.1042.b: "Dokud mi odvádějí náležité daně..."
 stewardship_domain.1042.c: "Pokud nechtějí obchodovat poctivě, nebudou obchodovat vůbec!"
 stewardship_domain.1052.t: "Škůdci v sýpkách"
 stewardship_domain.1052.desc: "Několik sýpek v [target_county.GetName] napadla havěť a zničila osivo, které v nich bylo uskladněno. Rolníci zde tak nemají co zasít pro příští rok a přišli mě požádat o pomoc.\n\nVzhledem k jejich zoufalé situaci budou nepochybně nuceni přijmout jakékoli podmínky, které jim nabídnu."
 stewardship_domain.1052.a: "Obilí mám dost, pokud mi za něj odpřisáhnou věrnost..."
 stewardship_domain.1052.b: "Slituji se nad nimi a otevřu své sýpky."
 stewardship_domain.1052.c: "Ať jim [ROOT.Char.Custom('DefaultPriestTitlePlural')] poskytnou almužnu."
 stewardship_domain.1052.d: "Obilí jim rozdá [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('almoner'))]."
 stewardship_domain.1053.t: "Zkorumpovaný výběrčí daní"
 stewardship_domain.1053.desc: "Daňové záznamy pro [target_county.GetNameNoTier] obsahují různé nesrovnalosti a opomenutí. Je zřejmé, že nemůže jít o pouhé chyby — dochází tu ke zpronevěře!\n\nBohužel jsou stopy po záhadném pachateli natolik nejasné, že je těžké určit, na koho z výběrčích padá vina."
 stewardship_domain.1053.a: "Prošetřím to diskrétně..."
 stewardship_domain.1053.a.success: "Odhalíš viníka a zjednáš spravedlnost"
 stewardship_domain.1053.a.failure: "Pachatel ti stále uniká"
 stewardship_domain.1053.c: "Převezmu přímou kontrolu nad výběrem daní v [target_county.GetNameNoTierNoTooltip]."
 stewardship_domain.1053.d: "Popravit je všechny a dosadit nové výběrčí!"
 stewardship_domain.1073.t: "Střet kultur"
 stewardship_domain.1073.desc: "Většina prostých obyvatel žijících v [target_county.GetName] pochází z [target_ruler.GetCulture.GetName] kultury. Jsou hrdí na své tradice a těžce nesou, že musí sloužit někomu cizímu, jako jsem já, zatímco [target_ruler.GetTitledFirstName] za hranicemi sdílí jejich kulturu i dějiny."
 stewardship_domain.1073.a: "Ukážu jim nadřazenost [me.GetCulture.GetNameNoTooltip] kultury!"
 stewardship_domain.1073.a.success: "Prostý lid přijme zvyky [me.GetCulture.GetNameNoTooltip] kultury"
 stewardship_domain.1073.a.failure: "Prostý lid se odmítá nechat zcivilizovat"
 stewardship_domain.1073.c: "Je mi jedno, jestli si ponechají své podivné tradice."
 stewardship_domain.1073.c.warning: "Rychlost prosazování kultury: #N -75%#!"
 stewardship_domain.1073.d: "Pocity sedláků jsou bezvýznamné — vládnu jim já."
 stewardship_domain.5031.t: "Hrabství v nouzi"
 stewardship_domain.5031.desc: "V [county.GetName] panují bouřlivé časy. Jedna zpráva za druhou líčí zoufalou situaci v oblasti a rolníci už si šeptají o #EMP jiných#! řešeních..."
 stewardship_domain.5031.a: "Vyřeším ty problémy osobně."
 stewardship_domain.5031.b: "Za trest zvýším daně."
 stewardship_domain.6001.t: "Odvodnění"
 stewardship_domain.6001.desc: "Před několika měsíci [baron.GetTitledFirstName] [Select_CString(baron.IsFemale,'zahájila','zahájil')] rozsáhlé odvodňování bažin v [barony.GetNameNoTier] s cílem připravit půdu k osídlení. Těžké pluhy a nové příkopy zpevňují půdu, práce však postupují pomalu.\n\nNyní přišel dopis od [baron.GetFirstName] s žádostí, aby [steward.GetCouncilTitle] [Select_CString(steward.IsFemale,'snížila','snížil')] [Select_CString(baron.IsFemale,'její','jeho')] povinnost dodávat odvedence. Ve snaze dokončit práce před příští sklizní [baron.GetFirstName] doufá, že vojáky bude moci místo toho využít jako pracovní sílu."
 stewardship_domain.6001.a: "Vezmi si tolik poddaných, kolik potřebuješ, [baron.GetFirstNameNoTooltip]!"
 stewardship_domain.6001.b: "Tohle by se hodilo v celém hrabství [county.GetNameNoTierNoTooltip]."
 stewardship_domain.6001.c: "Ne, letos bude na bojištích potřeba spousta lidí!"
 stewardship_domain.6002.t: "Mýcení"
 stewardship_domain.6002.desc: "Před několika měsíci [baron.GetTitledFirstName] [Select_CString(baron.IsFemale,'zahájila','zahájil')] mýcení lesů v [barony.GetNameNoTier] s cílem připravit půdu k osídlení. Stromy se vyvracejí, razí se cesty a vypaluje se podrost.\n\nNyní přišel dopis od [baron.GetFirstName] s žádostí, aby [steward.GetCouncilTitle] [steward.GetFirstName] [Select_CString(steward.IsFemale,'snížila','snížil')] [Select_CString(baron.IsFemale,'její','jeho')] povinnost dodávat odvedence. Ve snaze dokončit práce před příští sklizní [baron.GetFirstName] doufá, že vojáky bude moci místo toho využít jako pracovní sílu."
 stewardship_domain.6011.t: "Jednání s kameníky"
 stewardship_domain.6011.desc: "V [county.GetName] se usadil cech kameníků. Mít schopné řemeslníky přímo ve svých službách by mohlo prospět rozkvětu celého kraje."
 stewardship_domain.6011.a: "Dohodnu se s cechmistrem."
 stewardship_domain_6011_great_deal: "Výborná dohoda"
 stewardship_domain.6011.offer_tt: "Nabídka:"
 stewardship_domain_6011_fair_deal: "Přijatelná dohoda"
 stewardship_domain_6011_bad_deal: "Nevýhodná dohoda"
 stewardship_domain.6011.b: "[steward.GetTitledFirstNameNoTooltip], získej mi jejich věrnost!"
 stewardship_domain.6011.c: "K čemu jsou mi, když mám nevolníky?"
 stewardship_domain.6012.desc: "Cechmistr se zprvu zdráhal uzavřít jménem cechu jakoukoli dohodu, dokud jsem mu [Select_CString(ROOT.Char.IsFemale,'neukázala','neukázal')], jak moc by z ní těžily obě strany."
 stewardship_domain.6012.a: "Ani jsem [Select_CString(ROOT.Char.IsFemale,'nemusela','nemusel')] sahat k výhrůžkám násilím!"
 stewardship_domain.6013.desc: "Po dlouhém jednání už cechmistr odmítá dál ustupovat.\n\n„Za nižší cenu to udělat nelze.“"
 stewardship_domain.6013.a: "„Pak platí.“"
 stewardship_domain.6013.b: "Jistě někde najdu levnější kameníky."
 stewardship_domain.6014.desc: "„Urážíte mě i celé mé řemeslo, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ Cechmistrovi se mé nabídky vůbec nezamlouvají. „Ceny ostatně rostou. Náklady na práci, samozřejmě. To přece [ROOT.Char.GetTitleTierName] musí chápat.“"
 stewardship_domain.6014.a: "„Rozumím dokonale.“"
 stewardship_domain.6014.b: "Mně slouží celé [county.GetTierAsNameNoTooltip|l] a cechy budou také!"
 stewardship_domain.6015.desc: "Zdá se, že [steward.GetCouncilTitle] [steward.GetTitledFirstName] [Select_CString(steward.IsFemale,'cechmistra svou společností zjevně okouzlila, protože se vrátila','cechmistra svou společností zjevně okouzlil, protože se vrátil')] s nabídkou cechu kameníků, která dokonce překonává mé požadavky."
 stewardship_domain.6015.a: "[Select_CString(ROOT.Char.IsFemale,'Sama bych sotva vyjednala','Sám bych sotva vyjednal')] něco lepšího!"
 stewardship_domain.6016.desc: "[steward.GetTitledFirstName] se ke mně [Select_CString(steward.IsFemale,'vrátila','vrátil')] s nabídkou cechu kameníků.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jejich záznamy jsem [Select_CString(steward.IsFemale,'prošla','prošel')]. Nemyslím si, že lze vyjednat lepší dohodu.“"
 stewardship_domain.6016.a: "To zní velmi dobře."
 stewardship_domain.6016.b: "[Select_CString(ROOT.Char.IsFemale,'Pak jsem byla hloupá, že jsem tě poslala','Pak jsem byl hloupý, že jsem tě poslal')], [steward.GetFirstNameNoTooltip]!"
 stewardship_domain.6017.desc: "„Vyjednávání neproběhlo... úplně podle plánu, [ROOT.Char.Custom('FormOfAddressForLiege')].“ [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('steward'))|U] pokračuje omluvným tónem. „Přesto mám nabídku, i když se mnou už cech kameníků odmítá dál jednat.“"
 stewardship_domain.6017.a: "Musím se smířit s výsledky práce svých služebníků."
 stewardship_domain.6017.b: "Pak s nimi promluvím já! Nařídím jim to!"
 stewardship_domain_special.1001.t: "Sklizeň v [development_county.GetNameNoTier|U]"
 stewardship_domain_special.1001.desc: "Časy jsou zlé a [county_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] má v [development_county.GetNameNoTier] panství, které strádá víc než většina ostatních.\n\nDostávám jednu zprávu za druhou o neúrodě a začínám pochybovat, zda odtud letos vůbec dostanu svůj podíl na daních..."
 stewardship_domain_special.1001.a: "Prošetřím problémy hrabství."
 stewardship_domain_special.1001.a.tt: "Osud [development_county.GetNameNoTier] bude v tvých rukou..."
 stewardship_domain_special.1001.b: "Vymohu si silou, co mi právem náleží!"
 stewardship_domain_special.1001.c: "Tohle je odpovědnost [county_holder.GetFirstNamePossessiveNoTooltip], ne moje."
 stewardship_domain_special.1002.desc: "Za část potíží v [development_county.GetName] může očividně špatné hospodaření. Půda nebyla řádně vyklučena, osivo se vysévalo ve špatnou dobu a pastviny byly přepásány."
 stewardship_domain_special.1002.desc.repentant: "\n\n[county_holder.GetTitledFirstName] stojí přede mnou [Select_CString(county_holder.IsFemale,'zkroušená','zkroušený')] a nervózně si mne ruce. „Prosím, [ROOT.Char.Custom2('RelationToMeAddress', county_holder)], dej mi ještě jednu šanci! Dokážu to napravit, přísahám!“"
 stewardship_domain_special.1002.desc.uncaring: "\n\n[Select_CString(county_holder.IsFemale,'Znuděná','Znuděný')] [county_holder.GetTitledFirstName] stojí přede mnou a očividně si z toho nic nedělá. „Sedláci si s tím nakonec poradí. Vždycky si poradí. Od toho tu přece jsou, ne?“"
 stewardship_domain_special.1002.desc.blaming: "\n\n[Select_CString(county_holder.IsFemale,'Rozčilená','Rozčilený')] [county_holder.GetTitledFirstName] stojí přede mnou a očividně je pod velkým tlakem. „Jak to mohli ti sedláci takhle pokazit? Vždyť se celý život jen hrabou v hlíně! Nic jiného nedělají!“"
 stewardship_domain_special.1002.a: "Za tohle neseš odpovědnost ty, [county_holder.GetFirstNameNoTooltip]."
 stewardship_domain_special.1002.a.success: "[county_holder.GetTitledFirstName] i ty se poučíte z [Select_CString(county_holder.IsFemale,'jejích','jeho')] chyb"
 stewardship_domain_special.1002.a.failure: "[county_holder.GetTitledFirstName] nedokáže vyřešit problémy v [development_county.GetNameNoTier]"
 stewardship_domain_special.1002.b: "Napravím to osobně, ať to stojí cokoli!"
 stewardship_domain_special.1002.b.success: "Úspěšně vyřešíš problémy v [development_county.GetNameNoTier]"
 stewardship_domain_special.1002.b.failure: "Nepodaří se ti vyřešit problémy v [development_county.GetNameNoTier]"
 stewardship_domain_special.1002.c: "Na [development_county.GetNameNoTierNoTooltip] už nemáš žádný nárok!"
 stewardship_domain_special.1002.c.tt: "[county_holder.GetTitledFirstName] přijde o [development_county.GetName]"
 stewardship_domain_special.1003.desc: "„Děkuji, že mi věříte, [ROOT.Char.Custom2('RelationToMeAddress', county_holder)]!“\n\n[county_holder.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(county_holder.IsFemale,'dokázala vyřešit krizi, do které se dostala','dokázal vyřešit krizi, do které se dostal')]. Někdy je nejlepší důvěřovat schopnostem druhých a pak se od nich něco naučit!"
 stewardship_domain_special.1003.a: "Pověz mi všechno o tom, jak se ti to podařilo!"
 stewardship_domain_special.1004.desc: "Zprávy z [development_county.GetName] jsou čím dál katastrofálnější a brzy je zřejmé, že [county_holder.GetTitledFirstName] situaci jen [Select_CString(county_holder.IsFemale,'zhoršila','zhoršil')]."
 stewardship_domain_special.1004.a: "Tohle má být [county_holder.GetTitleTierName]?!"
 stewardship_domain_special.1005.desc: "Když sleduji, jak [development_county.GetName] pod mým vedením vzkvétá, nemohu necítit hrdost na to, čeho jsem [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')]. Čas od času se věnovat i drobnějším záležitostem správy je dobrý způsob, jak se učit!"
 stewardship_domain_special.1005.a: "Tyto znalosti se mi budou skutečně hodit!"
 stewardship_domain_special.1006.desc: "Ať zkouším cokoli, [development_county.GetName] stále nenachází úlevu. Situace už není tak zlá jako dřív, ale nevím si rady s tím, jak vyřešit zbývající problémy."
 stewardship_domain_special.1006.a: "Nu, nemohu uspět pokaždé..."
 stewardship_domain_special.1101.t: "Jarmark v [county.GetNameNoTierNoTooltip|U]"
 stewardship_domain_special.1101.desc: "V [county.GetName] leží pozemek, který by se dokonale hodil pro velký každoroční jarmark.\n\nO udělení tržního privilegia, které by umožnilo pořádat jarmark mým jménem, mě žádají [local_baron.GetTitledFirstName] a [second_local_baron.GetTitledFirstName]."
 stewardship_domain_special.1101.a: "Tržní privilegium získá [second_barony.Custom('BaronyTownType')] v [second_barony.GetNameNoTierNoTooltip]."
 stewardship_domain_special.1101.all_goes_well: "Pokud vše půjde dobře:"
 stewardship_domain_special.1101.b: "Tržní privilegium získá [local_baron.GetFaith.HouseOfWorship] v [barony.GetNameNoTierNoTooltip]."
 stewardship_domain_special.1101.c: "Pole raději využijeme k pastvě."
 stewardship_domain_special.1102.desc: "[second_local_baron.GetTitledFirstName] mi představuje zboží z celého světa: látky z nejvzdálenějších končin Hedvábné stezky, místní plodiny, technické divy z východu...\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jaké zboží máme na novém jarmarku upřednostnit?“"
 stewardship_domain_special.1102.a: "Dovezeme tolik hedvábí, kolik jen dokážeme!"
 stewardship_domain_special.1102.a.tt: "Lidé to spíše ocení, pokud je oblast stabilní a prosperuje"
 stewardship_domain_special.1102.b: "Zaměříme se na místní plodiny!"
 stewardship_domain_special.1102.b.tt: "Lidé to spíše ocení, pokud v oblasti panují nepokoje"
 stewardship_domain_special.1102.c: "Technické divy budou hlavním lákadlem!"
 stewardship_domain_special.1102.c.tt: "Lidé to spíše ocení, pokud je úroveň rozvoje oblasti nízká"
 stewardship_domain_special.1103.desc_silk: "Jemné hedvábí přilákalo na jarmark bohaté obyvatele [county.GetNameNoTier] a prostý lid je brzy následoval — byl to celý týden oslav a čilého obchodu!"
 stewardship_domain_special.1103.desc_crops: "Hojnost jídla přilákala na jarmark prostý lid a prvotřídní zboží ve všech stáncích jej lákalo k opakovaným návštěvám — byl to celý týden oslav a čilého obchodu!"
 stewardship_domain_special.1103.desc_technology: "Technické divy uchvátily návštěvníky a prvotřídní zboží zaplnilo všechny stánky — byl to celý týden oslav a čilého obchodu!"
 stewardship_domain_special.1103.a: "Od nynějška máte mé svolení pořádat jarmark každý rok."
 stewardship_domain_special.1104.desc_silk: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], co máme dělat se vším tím hedvábím?“\n\nZdá se, že v oblasti nebyla po hedvábí taková poptávka, jak jsme čekali, a [second_local_baron.GetTitledFirstName] zůstává s velkým množstvím drahé látky na skladě."
 stewardship_domain_special.1104.desc_crops: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], úroda začíná zahnívat a plesnivět. Co s tím vším máme dělat?“\n\nZdá se, že v oblasti nebyla po místních plodinách taková poptávka, jak jsme čekali, a [second_local_baron.GetTitledFirstName] jich má stále velké množství neprodaných."
 stewardship_domain_special.1104.desc_technology: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], co máme dělat se všemi těmi cetkami?“\n\nZdá se, že v oblasti nebyla o technické divy taková poptávka, jak jsme čekali, a [second_local_baron.GetTitledFirstName] jich má stále velké množství neprodaných."
 stewardship_domain_special.1104.a: "Začátek byl bouřlivý, ale teď už si místní jistě poradí!"
 stewardship_domain_special.1105.desc: "[local_baron.GetTitledFirstName] mi představuje zboží z celého světa: náboženské předměty ze svatých měst, jídlo vypěstované zdejšími [local_baron.GetFaith.DevoteeMalePlural] a [local_baron.GetFaith.DevoteeFemalePlural], podivuhodnosti cizích náboženství...\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jaké zboží máme na novém jarmarku upřednostnit?“"
 stewardship_domain_special.1105.a: "Uctíme místní světce a zaměříme se na náboženské předměty!"
 stewardship_domain_special.1105.a.tt: "Lidé to spíše ocení, pokud je jejich náboženské zanícení silné"
 stewardship_domain_special.1105.b: "Přivezte tolik jídla, kolik jen dokážete!"
 stewardship_domain_special.1105.b.tt: "Lidé to spíše ocení, pokud oblast potřebuje pomoc"
 stewardship_domain_special.1105.c: "Když ukážeme cizí náboženství, přestanou působit tak neobyčejně!"
 stewardship_domain_special.1105.c.tt: "Lidé to spíše ocení, pokud je jejich náboženské zanícení slabé"
 stewardship_domain_special.1106.desc_religious_objects: "Náboženské předměty ze svatých měst lid uchvátily a prvotřídní zboží zaplnilo všechny stánky — byl to celý týden zbožných oslav a čilého obchodu!"
 stewardship_domain_special.1106.desc_religious_food: "Jídlo, které poskytli zdejší [local_baron.GetFaith.DevoteeMalePlural] a [local_baron.GetFaith.DevoteeFemalePlural], se prodávalo téměř lépe než cokoli jiného na jarmarku — byl to celý týden zbožných oslav a čilého obchodu!"
 stewardship_domain_special.1106.desc_religious_other: "Setkání s cizími náboženstvími přimělo obyvatele [county.GetNameNoTier] k modlitbám a k většímu ocenění vlastního společenství — byl to celý týden zbožných oslav a čilého obchodu!"
 stewardship_domain_special.1106.a: "Od nynějška máte mé svolení pořádat jarmark každý rok."
 stewardship_domain_special.1107.desc_religious_objects: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], co máme dělat se všemi těmi svatými cetkami?“\n\nZdá se, že posvátné předměty nepřilákaly tolik zbožných lidí, jak jsem [Select_CString(ROOT.Char.IsFemale,'doufala','doufal')], a [local_baron.GetTitledFirstName] jich má stále spoustu neprodaných."
 stewardship_domain_special.1107.desc_religious_food: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], co máme dělat se vším tím jídlem?“\n\nZdá se, že pokrmy připravené zdejšími [local_baron.GetFaith.DevoteeMalePlural] a [local_baron.GetFaith.DevoteeFemalePlural] by potřebovaly božský zásah — neprodalo se téměř nic."
 stewardship_domain_special.1107.desc_religious_other: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], co máme dělat se všemi těmi rouhačskými cetkami?“\n\nCizokrajné předměty místní jen odpuzovaly a odrazovaly je od návštěvy jarmarku. [local_baron.GetTitledFirstName] brzy dostává příkaz všechno spálit, ale škoda už byla napáchána."
 stewardship_domain_special.1107.a: "Začátek byl bouřlivý, ale teď už si místní jistě poradí!"
 stewardship_domain_special.1301.increase_road_progress_1: "#V Postup stavby cesty#! se zvýší o #P 1#!"
 stewardship_domain_special.1301.increase_road_progress_2: "#V Postup stavby cesty#! se zvýší o #P 2#!"
 stewardship_domain_special.1301.increase_road_quality_1: "#V Kvalita cesty#! se zvýší o #P 1#!"
 stewardship_domain_special.1301.increase_road_quality_2: "#V Kvalita cesty#! se zvýší o #P 2#!"
 stewardship_domain_special.1301.decrease_road_quality_1: "#V Kvalita cesty#! se sníží o #N 1#!"
 stewardship_domain_special.1301.t: "Cesta"
 stewardship_domain_special.1301.steward_opening: "[ROOT.Char.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] [steward.GetTitledFirstName] mě informuje"
 stewardship_domain_special.1301.no_steward_opening: "Moji starostové mě informují"
 stewardship_domain_special.1301.desc: "o naléhavé potřebě nové cesty vedoucí přes [project_county.GetName]. Mnohé ze starých cest jsou ve špatném stavu, a některé jsou dokonce nebezpečné!\n\nZa přirozeného vůdce stavebních prací byl navržen člověk z prostého lidu jménem [peasant_leader.GetTitledFirstName]."
 stewardship_domain_special.1301.a: "Zařiďte to."
 stewardship_domain_special.1301.a.peasant_leader_tt: "Projekt začíná pod dohledem [peasant_leader.GetTitledFirstName]"
 stewardship_domain_special.1301.b: "Postará se o to můj správce."
 stewardship_domain_special.1301.a.steward_tt: "Projekt začíná pod dohledem [steward.GetTitledFirstName]"
 stewardship_domain_special.1301.c: "Našim předkům ty cesty stačily!"
 stewardship_domain_special.1301.c.tt: "Budou stačit i nám!"
 stewardship_domain_special.1311.t: "Cesta: Odlehlé léno"
 stewardship_domain_special.1311.desc: "Práce na cestě v [project_county.GetNameNoTier] pokračují, ale právě připravovaný úsek vede za kopcem, daleko od obou vesnic po jeho stranách.\n\nAni jedna vesnice nechce poskytnout dělníky a není dokonce ani jasné, komu léno za kopcem vlastně patří!"
 stewardship_domain_special.1311.a: "Pak vezmeme dělníky z obou vesnic."
 stewardship_domain_special.1311.b: "Práci tam zaplatím ze svého."
 stewardship_domain_special.1311.c: "Když není jasné, komu léno patří, připadne mně!"
 stewardship_domain_special.1312.t: "Cesta: Běžný provoz"
 stewardship_domain_special.1312.desc: "Ještě před dokončením začali novou cestu v [project_county.GetNameNoTier] využívat kupci.\n\n[project_leader.GetTitledFirstName] navrhuje, aby ti, kdo cestu používají, přispívali na její výstavbu."
 stewardship_domain_special.1312.a: "Nebo by mohli přispívat do mé pokladnice."
 stewardship_domain_special.1312.b: "Jak originální nápad... Líbí se mi!"
 stewardship_domain_special.1313.t: "Cesta: Lupiči"
 stewardship_domain_special.1313.desc: "Zdá se, že i nedokončená cesta přitahuje lapky. [project_leader.GetTitledFirstName] si stěžuje na zásoby, které nikdy nedorazí, a na dělníky, kteří se bojí opustit své vesnice. Tímhle tempem nebude cesta v [project_county.GetNameNoTier] nikdy dokončena."
 stewardship_domain_special.1313.a: "Rozmístěte podél cesty stráže."
 stewardship_domain_special.1313.b: "Je mi to jedno. #EMP Dokončete. Mou. Cestu.#!"
 stewardship_domain_special.1314.t: "Cesta: Dupot bot"
 stewardship_domain_special.1314.war: "Kvůli probíhající válce využívají odvedenci dokončené úseky cesty v [project_county.GetNameNoTier], aby urychlili svůj pochod."
 stewardship_domain_special.1314.end: "\n\nCesta už je opotřebovaná a poškozená a [project_leader.GetTitledFirstName] tvrdí, že dělníci se budou muset vrátit a zpevnit ji, než bude možné pokračovat."
 stewardship_domain_special.1314.a: "Nestojí to za tu námahu."
 stewardship_domain_special.1314.b: "Mrzuté, ale nezbytné."
 stewardship_domain_special.1315.t: "Cesta: Dupot bot"
 stewardship_domain_special.1315.end: "\n\nNaštěstí je právě takové zatížení přesně tím, co potřebujeme k řádnému udusání podloží! A s trochou štěstí se většina odvedenců vrátí po svých stejnou cestou."
 stewardship_domain_special.1315.a: "Ať vyrazí na frontu!"
 stewardship_domain_special.1315.b: "Budou pochodovat tak, jak jim [project_leader.GetTitledFirstNameNoTooltip] nařídí."
 stewardship_domain_special.1316.t: "Cesta: Financované vylepšení"
 stewardship_domain_special.1316.desc: "Kupecký cech v [project_county.GetNameNoTier] zjistil, jak nesmírně užitečné jsou již dokončené části nové cesty, a věnoval dar na její další rozšíření."
 stewardship_domain_special.1316.a: "To cestě prospěje."
 stewardship_domain_special.1316.b: "To prospěje mé kapse."
 stewardship_domain_special.1317.t: "Cesta: Krčma"
 stewardship_domain_special.1317.desc: "Výstavba cesty v [project_county.GetNameNoTier] se zpozdila. [project_leader.GetTitledFirstName] hlásí, že dělníky odlákal jakýsi budoucí hostinský. Aby potěšili své duše i duše ostatních pocestných, staví u cesty krčmu."
 stewardship_domain_special.1317.a: "Samozřejmě bude patřit koruně."
 stewardship_domain_special.1317.b: "Ať se okamžitě vrátí k cestě!"
 stewardship_domain_special.1318.t: "Cesta: Pokrok"
 stewardship_domain_special.1318.desc: "Podle [project_leader.GetTitledFirstName] práce na cestě v [project_county.GetNameNoTier] postupují dobře.\n\n„Půda je pevnější a jednotlivé úseky rovnější, než jsme doufali, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 stewardship_domain_special.1318.a: "Rozšiřte cestu dál!"
 stewardship_domain_special.1318.b: "Všechno jde přesně podle mých představ."
 stewardship_domain_special.1318.c: "Dokonalá příležitost snížit náklady!"
 stewardship_domain_special.1319.t: "Cesta: Pracovní morálka"
 stewardship_domain_special.1319.desc: "[Select_CString(steward.IsFemale,'Má správkyně','Můj správce')] působí téměř šokovaně. „[Select_CString(steward.IsFemale,'Prohlížela','Prohlížel')] jsem stavbu cesty v [project_county.GetNameNoTier] a ti rolníci pracují mnohem efektivněji, než jsem [Select_CString(steward.IsFemale,'čekala','čekal')]... Dokonce i já bych se od nich [Select_CString(steward.IsFemale,'mohla','mohl')] něco přiučit.“"
 stewardship_domain_special.1319.a: "Můžeme tyto poznatky využít i jinde?"
 stewardship_domain_special.1319.b: "Učit se od sedláků? Už ta představa je odporná."
 stewardship_domain_special.1320.t: "Cesta: [peasant_leader.GetTitledFirstNamePossessiveNoTooltip] odbornost"
 stewardship_domain_special.1320.desc: "Nestává se často, aby se na mě někdo z prostého lidu obrátil přímo, ale [peasant_leader.GetTitledFirstName] mi podává zprávu o stavbě v [project_county.GetNameNoTier].\n\n„Podle plánu má cesta vést přes tohle pole, vaše lennosti, ale já zdejší půdu dobře znám. [Select_CString(peasant_leader.IsFemale,'Mohla bych','Mohl bych')] si dovolit požádat, abychom... abychom cestu vedli raději přes nedaleký les?“"
 stewardship_domain_special.1320.a: "Věřím tvému úsudku."
 stewardship_domain_special.1320.b: "Je to příliš daleko a příliš drahé. Uděláme to podle mého plánu."
 stewardship_domain_special.1321.t: "Cesta: Nedostatek zkušeností"
 stewardship_domain_special.1321.desc: "„Pořád jim říkám, ať vedou cestu rovnou přes pole, ale [peasant_leader.GetTitledFirstName] trvá na tom, že ji máme vést přes nedaleký les!“ [steward.GetTitledFirstName] je pracemi na cestě v [project_county.GetNameNoTier] viditelně [Select_CString(steward.IsFemale,'rozrušená','rozrušený')].\n\n[peasant_leader.GetTitledFirstName] však dál trvá na svém postupu. „Půda na poli je nerovná a není dostatečně pevná, [ROOT.Char.Custom('FormOfAddressForLiege')]! Přes les povede cesta mnohem lépe.“"
 stewardship_domain_special.1321.a: "Poslouchej ty, kdo vědí víc než ty, sedláku!"
 stewardship_domain_special.1321.b: "[peasant_leader.GetTitledFirstNameNoTooltip] tomu přece jen zřejmě rozumí nejlépe..."
 stewardship_domain_special.1391.t: "Cesta: Chybějící vedení"
 stewardship_domain_special.1391.desc: "Po odchodu [project_leader.GetTitledFirstName] postrádají práce na cestě v [project_county.GetNameNoTier] jasné vedení. Má-li být cesta vůbec někdy dokončena, musí se jí ujmout někdo jiný."
 stewardship_domain_special.1391.a: "[peasant_leader.GetTitledFirstNameNoTooltip] vypadá jako schopná náhrada."
 stewardship_domain_special.1391.b: "Je čas, aby vedení [Select_CString(steward_alternative.IsFemale,'převzala','převzal')] [steward_alternative.GetTitledFirstNameNoTooltip]."
 stewardship_domain_special.1392.t: "Cesta: Omezení ztrát"
 stewardship_domain_special.1392.desc: "Po ztrátě [project_county.GetName] by pro mě dokončení tamní cesty už nemělo valný přínos. Alespoň daně vybrané na projekt zůstaly v mé pokladnici, místo aby se promarnily na cestě."
 stewardship_domain_special.1392.a: "Ne všechno je ztraceno."
 stewardship_domain_special.1396.t: "Konec cesty"
 stewardship_domain_special.1396.desc: "Cesta v [project_county.GetNameNoTier] je konečně hotová.\n\n„Je... velmi účelná,“ říká mi [project_leader.GetTitledFirstName]."
 stewardship_domain_special.1396.a: "Cesta nemusí být přepychová. Takhle postačí."
 stewardship_domain_special.1397.desc: "Síť cest vedoucích přes [project_county.GetNameNoTier] je konečně hotová.\n\n„Po těchto cestách se lidé dostanou tam, kam potřebují, ještě celá desetiletí,“ říká mi [project_leader.GetTitledFirstName]."
 stewardship_domain_special.1397.a: "Už se nemohu dočkat, až z toho budu těžit!"
 stewardship_domain_special.1397.b: "[peasant_leader.GetTitledFirstNameNoTooltip]! Mám pro tebe další práci!"
 stewardship_domain_special.1398.desc: "Síť cest vedoucích přes [project_county.GetNameNoTier] je konečně hotová.\n\n„Tyto cesty budou po celé generace tepnami hrabství!“ hrdě oznamuje [project_leader.GetTitledFirstName]."
 stewardship_domain_special.1398.a: "Už se nemohu dočkat, až z toho budu těžit!"
 stewardship_domain_special.1398.b: "[peasant_leader.GetTitledFirstNameNoTooltip]! Mám pro tebe další práci!"
 stewardship_domain_special.1399.desc: "Síť cest vedoucích přes [project_county.GetNameNoTier] je konečně hotová.\n\n„Tohle mohou být dost možná nejlepší cesty v celém panství, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ hrdě oznamuje [project_leader.GetTitledFirstName]."
 stewardship_domain_special.1399.a: "Už se nemohu dočkat, až z toho budu těžit!"
 stewardship_domain_special.1399.b: "[peasant_leader.GetTitledFirstNameNoTooltip]! Mám pro tebe další práci!"
 stewardship_domain_special.1401.t: "Zmizelá vesnice"
 stewardship_domain_special.1401.desc: "Při světle jediné svíčky se můj prst zastaví u jednoho záznamu v účetní knize. Něco tu nesedí... Brzy už procházím všechny záznamy z [county.GetName], které se mi podaří najít.\n\nNakonec je vše nad slunce jasné. Zdá se, že z daňových záznamů zmizela celá vesnice!"
 stewardship_domain_special.1401.a: "Výběrčí daní v [county.GetNameNoTierNoTooltip] to musí prošetřit!"
 stewardship_domain_special.1401.a.tt: "Vyšetřování povede výběrčí daní"
 stewardship_domain_special.1401.b: "Do vesnice se vydám osobně."
 stewardship_domain_special.1401.b.tt: "Vyšetřování povedeš osobně"
 stewardship_domain_special.1401.c: "Vesnice mizí pořád. Nevšímej si toho."
 stewardship_domain_special.1411.desc: "[collector.GetTitledFirstName], výběrčí daní v [county.GetName], [Select_CString(collector.IsFemale,'vynaložila nemalé úsilí, aby mě přesvědčila','vynaložil nemalé úsilí, aby mě přesvědčil')], jak důležité je, abych se na „zmizelou“ vesnici [Select_CString(ROOT.Char.IsFemale,'přijela','přijel')] podívat osobně.\n\nPo několika dnech cesty konečně vjíždím do vesnice. Vypadá jako každá jiná ubohá osada plná bláta. [collector.GetTitledFirstName] však trvá na svém. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], prosím, dovolte mi ukázat vám to tu. Tady jsem doma.“"
 stewardship_domain_special.1411.a: "Dobrá, ukaž mi to tu."
 stewardship_domain_special.1411.a.tt: "[collector.GetTitledFirstName] ti ukáže svou vesnici"
 stewardship_domain_special.1411.b: "Už jsi [Select_CString(collector.IsFemale,'promarnila','promarnil')] dost mého času!"
 stewardship_domain_special.1411.b.tt: "Proč jsem sem vůbec [Select_CString(ROOT.Char.IsFemale,'jezdila','jezdil')]?!"
 stewardship_domain_special.1412.desc: "Zatímco [collector.GetTitledFirstName] visí nad návsí s nohama ve vzduchu, chystám se se strážemi odjet. Sotva necháme první domy za sebou, přiběhne vedle mého koně dívka.\n\n„Ach, [ROOT.Char.GetLadyLord], co s námi bude? Nikdo z nás si nemůže dovolit zaplatit pokutu, kterou po nás požadujete.“"
 stewardship_domain_special.1412.a: "Příští výběrčí váš dluh vyrovná."
 stewardship_domain_special.1412.b: "Vymohu celý váš dluh. Hned."
 stewardship_domain_special.1412.b.flavor: "Zabavte všechno cenné a zbytek spalte!"
 stewardship_domain_special.1413.desc: "Když mě [collector.GetTitledFirstName] provádí vesnicí, vidím jen vyhublé krávy, slepice hrabající se v hlíně a sedláky vracející se z polí s nevelkým nákladem. Když se o tom zmíním, je mi jasné, kam tím míří.\n\n„Tihle lidé sotva uživí vlastní dobytek. Kdybych od nich [Select_CString(collector.IsFemale,'žádala','žádal')] víc, zemřeli by hlady.“"
 stewardship_domain_special.1413.a: "[Select_CString(ROOT.Char.IsFemale,'Mohla bych','Mohl bych')] jim udělit daňovou úlevu..."
 stewardship_domain_special.1413.b: "I za těchto okolností musí zaplatit."
 stewardship_domain_special.1413.c: "Tohle jsi mi [Select_CString(collector.IsFemale,'chtěla','chtěl')] ukázat? Zrada!"
 stewardship_domain_special.1413.c.tt: "Rozhodneš, jak s vesnicí naložit"
 stewardship_domain_special.1414.desc: "Když se se strážemi vzdalujeme, vesnice stále doutná.\n\nNěkdy je třeba odstranit staré, aby mohlo vzniknout něco nového."
 stewardship_domain_special.1414.a: "Vládnout lze mnoha způsoby."
 stewardship_domain_special.1421.collector_opening: "Osoba vyslaná prošetřit zmizelou vesnici se nikdy nevrátila. Rozhodnu se tam proto pod silnou ochranou vydat osobně a konečně zjišťuji proč..."
 stewardship_domain_special.1421.self_opening: "Když v doprovodu svých stráží dorazím do vesnice, konečně zjišťuji, proč místní přestali platit daně."
 stewardship_domain_special.1421.desc: "\n\nVšechny domy chátrají a jsou opuštěné. Po lidech není ani stopy, dokonce ani po mém výběrčím.\n\nZatímco mé stráže prohledávají tiché domy, pomalu se mě zmocňuje děs, který rychle přeroste v paniku, když se z jednoho domu náhle ozve výkřik."
 stewardship_domain_special.1421.a: "Co jste našli!?!"
 stewardship_domain_special.1421.a.tt: "Může tu být cokoli"
 stewardship_domain_special.1421.b: "Odcházíme. Hned."
 stewardship_domain_special.1422.desc: "Z trouchnivějících dveří vychází křičící strážný s dítětem pod paží. Vzadu v domě se před ním [Select_CString(foundling.IsFemale,'skrývala','skrýval')] [foundling.Custom('GirlBoy')].\n\nAčkoli se dožaduji odpovědí, dítě neřekne ani slovo o tom, co se s vesnicí stalo — vlastně neřekne vůbec nic."
 stewardship_domain_special.1422.a: "[foundling.Custom('GirlBoy')|U] už nemá domov... [Select_CString(foundling.IsFemale,'Adoptuji ji','Adoptuji ho')]!"
 stewardship_domain_special.1422.b: "Nechte dítě v nejbližší vesnici."
 stewardship_domain_special.1422.c: "Spalte vesnici i s tím prokletým dítětem."
 stewardship_domain_special.1423.foundling: "[Select_CString(foundling.IsFemale,'Malá','Malý')] [foundling.GetTitledFirstName] je teď v bezpečí u dvora, hraje si — a dokonce i mluví — s ostatními dětmi.\n\n"
 stewardship_domain_special.1423.no_foundling: "Ani hluk a štěbetání u dvora mě nedokážou odvést od toho, co jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]."
 stewardship_domain_special.1423.desc: "Vzpomínky na tichou vesnici mě stále pronásledují. Nakonec jsme nenašli jedinou stopu po komkoli, kdo tam kdy žil."
 stewardship_domain_special.1423.a: "Ta prokletá půda už nikdy nesmí být osídlena."
 stewardship_domain_special.1423.b: "Čas si tu vesnici vezme zpět, jako si bere všechno."
 stewardship_domain_special.1424.desc: "V opuštěném domě mě čeká odporný zápach a hromada mrtvol. Rozklad už znemožňuje určit, jak zemřeli,"
 stewardship_domain_special.1424.collector_end: "ale ani na nejčerstvější mrtvole opřené o zeď — [Select_CString(collector.IsFemale,'mé výběrčí daní','mém výběrčím daní')] — nejsou patrné žádné stopy násilí."
 stewardship_domain_special.1424.self_end: "ale ani na nejméně zetlelých tělech nejsou patrné žádné stopy násilí."
 stewardship_domain_special.1424.a: "Vypalte tuhle pekelnou díru do základů."
 stewardship_domain_special.1424.b: "Pohřběte mrtvé a nařiďte znovuosídlení."
 stewardship_domain_special.1425.desc: "Těl se zbavíme snadno. Mnohem těžší je najít rodiny ochotné usadit se ve vesnici mrtvých. Žádný sedlák však dlouho neodolá lákadlu úrodného kusu půdy. A koneckonců ani hrotu pobízejícího kopí.\n\nPři dohledu nad počátkem obnovy jsem se toho také hodně [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')]!"
 stewardship_domain_special.1425.a: "Teď už jen aby ten prokletý kašel přešel!"
 stewardship_domain_special.1426.desc: "Není to nijak obřadné, ale oheň udělá, co je třeba. Sleduji, jak plameny pohlcují dávno opuštěné domy, ale ne dlouho. [Select_CString(ROOT.Char.IsFemale,'Viděla jsem','Viděl jsem')] tu vše potřebné."
 stewardship_domain_special.1426.a: "Je čas vrátit se domů."
 stewardship_domain_special.1431.desc: "Po několika dnech cesty nacházím vesnici, která chybí v mých záznamech. Nejenže prosperuje — přímo vzkvétá! — ale vesničané trvají na tom, že daně #EMP skutečně#! platí.\n\n[collector.GetTitledFirstName], výběrčí daní v baronství, se mnou tedy [Select_CString(collector.IsFemale,'nehrála','nehrál')] úplně čistou hru."
 stewardship_domain_special.1431.a: "[collector.GetFirstNameNoTooltip] mi bude muset leccos vysvětlit..."
 stewardship_domain_special.1431.a.tt: "Postavíš [collector.GetFirstName] před hotovou věc"
 stewardship_domain_special.1431.b: "Shromážděte vesničany. Zaplatí znovu."
 stewardship_domain_special.1432.desc: "„Ty peníze byly nezbytné pro, ehm, obranu [county.GetNameNoTier]!“ [collector.GetTitledFirstName], výběrčí daní v [barony.GetNameNoTier], je [Select_CString(collector.IsFemale,'vyděšená','vyděšený')], a nemalou zásluhu na tom mají hromotluci, kteří mě doprovodili k sídlu, které [collector.GetTitledFirstName] obývá.\n\n„Prosím! Udělám cokoli, abych si [Select_CString(collector.IsFemale,'zasloužila','zasloužil')] odpuštění!“"
 stewardship_domain_special.1432.a: "V temnotě se na tebe zapomene."
 stewardship_domain_special.1432.b: "Někdo, kdo mi vděčí za život, by se mohl hodit."
 stewardship_domain_special.1432.b.collector_loyal: "Vděčnost a věrnost"
 stewardship_domain_special.1432.b.collector_bad: "Šance na útěk"
 stewardship_domain_special.1432.b.collector_bad.tt: "[collector.GetFirstNameNoTooltip] unikne!"
 stewardship_domain_special.1432.c: "Úplně cokoli? Co třeba počítat červy?!"
 stewardship_domain_special.1433.desc: "Ta zrádná krysa! Nabídnu odpuštění a vzápětí se na mě [collector.GetTitledFirstName] vrhne s čepelí v ruce a vražedným výrazem ve tváři.\n\nChvíli se zoufale bráním, než [Select_CString(collector.IsFemale,'ji','ho')] zpacifikuje strážný."
 stewardship_domain_special.1433.a: "Okamžitě [Select_CString(collector.IsFemale,'ji','ho')] uškrťte."
 stewardship_domain_special.1433.b: "Už nikdy nespatříš denní světlo, [collector.GetFirstNameNoTooltip]!"
 stewardship_domain_special.1441.desc: "Daně uvalené na mé rolníky mohou být někdy kruté. Nedávné události mi však ukázaly, že život #EMP je#! krutý. Žádná laskavost z mé strany na tom nic nezmění."
 stewardship_domain_special.1441.a: "Tolik jsem se toho [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')]."
 stewardship_domain_special.1442.desc: "Daně uvalené na rolníky v mém panství mohou být někdy tak tvrdé, že dusí i samotný život. Jejich zmírnění může často otevřít cestu ke stále větší prosperitě. [ROOT.Char.GetTitleTierName] musí jen umět být [Select_CString(ROOT.Char.IsFemale,'trpělivá','trpělivý')]."
 stewardship_domain_special.1443.t: "$stewardship_domain_special.1401.t$: Lepší zdanění"
 stewardship_domain_special.1443.opening: "Když procházím daňové záznamy, vrací se mi vzpomínky na záležitost se zmizelou vesnicí v [barony.GetNameNoTier]."
 stewardship_domain_special.1443.end: "\n\nOd té doby se situace výrazně zlepšila a příjmy z [barony.GetNameNoTier] jsou nyní vyšší než kdy dřív!"
 stewardship_domain_special.1443.a: "Skvělé!"
 stewardship_domain_special.1444.t: "$stewardship_domain_special.1401.t$: Rozsáhlé vyhýbání se daním"
 stewardship_domain_special.1444.end: "\n\nDnes už je situace jiná, ale [Select_CString(ROOT.Char.IsFemale,'naučila jsem se','naučil jsem se')], že milosrdenství a shovívavost někdy vedou jen k ještě větším ztrátám. Jakýkoli způsob, jak se vyhnout daním, se mezi sedláky rozšíří jako blechy."
 stewardship_domain_special.1444.a: "To je pohroma."
 stewardship_domain_special.1445.t: "$stewardship_domain_special.1401.t$: Pokračující vylidňování"
 stewardship_domain_special.1445.end: "\n\nNyní mizí další vesnice, ale moji výběrčí znají očividnou příčinu. Vysoké daně vedly k rozsáhlému opouštění jinak dobré půdy — lidé buď umírají hlady, nebo prchají do jiných hrabství."
 stewardship_domain_special.1445.a: "Nu, když si nemohou dovolit žít..."
 stewardship_domain_special.1451.t: "$stewardship_domain_special.1401.t$: Vypáleno do paměti"
 stewardship_domain_special.1451.desc: "Uprostřed noci se probouzím a stále mám před očima vyčítavý pohled dítěte, zatímco vesnice v [barony.GetNameNoTier] hoří do základů."
 stewardship_domain_special.1451.a: "Proč mě to tolik tíží?"
 stewardship_domain_special.1451.b: "Ach, málem jsem [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')]!"
 stewardship_domain_special.1500.t.a: "Velký soupis"
 stewardship_domain_special.1500.t.b: "Kniha posledního soudu"
 stewardship_domain_special.1500.desc: "S odvážným nápadem přichází [domesday_steward.GetCouncilTitle] [domesday_steward.GetTitledFirstName]: jediným obrovským soupisem zmapovat veškerý majetek v mém panství a vytvořit tak konečný přehled o tom, co mi náleží.\n\nShromáždění těchto znalostí by mi poskytlo lepší přehled o správě i výběru daní — počáteční náklady však nebudou malé."
 stewardship_domain_special.1500.a: "Budu znát každý akr půdy, každého nevolníka i každý kus dobytka."
 stewardship_domain_special.1500.a.tt: "#F Důkladný soupis je nákladný, ale bude kvalitnější.#!"
 stewardship_domain_special.1500.b: "Stručný soupis mého majetku postačí."
 stewardship_domain_special.1500.b.tt: "#F Zběžný soupis je levnější, ale nemusí být tak kvalitní.#!"
 stewardship_domain_special.1500.c: "Proč se obtěžovat? Moji poddaní vědí, co mi dluží."
 stewardship_domain_special.1500.c.tt: "Všichni mí ostatní vazalové"
 stewardship_domain_special.1500.quality_increase.tt: "Kvalita soupisu se #P zvýší#!"
 stewardship_domain_special.1500.quality_decrease.tt: "Kvalita soupisu se #N sníží#!"
 stewardship_domain_special.1500.quality_based_taxes: "Podle kvality dokončeného soupisu"
 stewardship_domain_special.1500.every_county_control: "[Concept('control','Kontrola')|E] se zvýší úměrně kvalitě soupisu"
 stewardship_domain_special.1500.every_county_summary: "Poskytuje úměrně vyšší daně z [Concept('holding','držav')|E] po dobu #V 5 let#!"
 stewardship_domain_special.1500.survey_not_completed: "Pokud soupis nebude dokončen"
 stewardship_domain_special.1501.desc: "[domesday_marshal.GetCouncilTitle] [domesday_marshal.GetTitledFirstName] se obává, že se odhadci stanou snadným cílem banditů a zlodějů. I neúplný soupis by mohl zločincům poskytnout cenné informace o vhodných cílech k přepadení!\n\nAby byli mí poddaní v bezpečí, [domesday_marshal.GetFirstNameNoTooltip] doporučuje přidělit každému odhadci ozbrojený doprovod."
 stewardship_domain_special.1501.a: "Můj zákon je pro mé poddané dostatečnou ochranou!"
 stewardship_domain_special.1501.a.tt: "Tví odhadci mohou být napadeni v hrabstvích s nízkou [Concept('control','kontrolou')|E]."
 stewardship_domain_special.1501.b: "Sestavte milici, která bude mé odhadce chránit."
 stewardship_domain_special.1501.b.success: "Tvé milice dokážou udržet odhadce v bezpečí"
 stewardship_domain_special.1501.b.failure: "Tvé milice nedokážou odhadce ochránit"
 stewardship_domain_special.1501.c: "Každou skupinu odhadců bude doprovázet [ROOT.Char.Custom('MountedWarriorTerm')]."
 stewardship_domain_special.1501.c.tt: "Tví odhadci budou chráněni před útoky na cestách."
 stewardship_domain_special.1510.opening: "[upset_priest.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 stewardship_domain_special.1510.desc_opening: "[Select_CString(upset_priest.IsFemale,'Byla jsem nemile překvapena','Byl jsem nemile překvapen')], když se dnes ráno na mou bohoslužbu dostavili jen vaši daňoví odhadci! Přísně vyhlížející úředníci čekající před mými dveřmi očividně odradili mnoho věřících [upset_priest.GetFaith.GetAdherentNamePluralNoTooltip] od účasti na bohoslužbě."
 stewardship_domain_special.1510.desc_ending: "\n\nPřestože vám [Select_CString(upset_priest.IsFemale,'ráda','rád')] odvádím, co vám náleží, záležitosti církve jsou ze své podstaty duchovní, nikoli světské. Vaši odhadci tu nemají co pohledávat a narušovat mé bohoslužby!"
 stewardship_domain_special.1510.desc_ending_not_endorsed: "\n\nZáležitosti církve jsou ze své podstaty duchovní, nikoli světské. Vaši poskoci tu nemají co pohledávat a narušovat mé bohoslužby!"
 stewardship_domain_special.1510.a: "Ani [upset_priest.GetFaith.HouseOfWorshipPlural] neuniknou soupisu, ať se to [upset_priest.GetTitledFirstName] líbí, nebo ne!"
 stewardship_domain_special.1510.b: "Má pravdu. [upset_priest.GetFaith.HouseOfWorshipPlural] patří do duchovní sféry — [upset_priest.GetFaith.HighGodName] stojí nad ní."
 stewardship_domain_special.1510.b.tt: "Ze soupisu vyjmeš [upset_priest.GetTitledFirstNamePossessive] državy"
 stewardship_domain_special.1510.c: "[upset_priest.GetFaith.ReligiousText] — tam najdu ospravedlnění soupisu."
 stewardship_domain_special.1510.c.success: "Přesvědčíš [upset_priest.GetTitledFirstName]"
 stewardship_domain_special.1510.c.success.tt: "Přesvědčíš [upset_priest.GetTitledFirstName], že soupis je oprávněný"
 stewardship_domain_special.1510.c.failure: "Nepodaří se ti přesvědčit [upset_priest.GetTitledFirstName]"
 stewardship_domain_special.1510.c.failure.tt: "Nepodaří se ti přesvědčit [upset_priest.GetTitledFirstName], že soupis je oprávněný"
 stewardship_domain_special.1520.opening: "[concerned_noble.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 stewardship_domain_special.1520.desc: "Každý rok věrně odvádím koruně, co jí náleží, a přesto se mi před několika dny u dveří objevili vaši daňoví odhadci a požadovali prohlídku mého majetku!\n\nTak málo mi důvěřujete, že musíte posílat své lidi, aby narušovali mé soukromí?"
 stewardship_domain_special.1520.a: "Samozřejmě ti věřím! Moji lidé okamžitě odejdou."
 stewardship_domain_special.1520.a.tt: "Ze soupisu vyjmeš [concerned_noble.GetTitledFirstNamePossessive] državy"
 stewardship_domain_special.1520.b: "Budu vědět, co se na mých pozemcích nachází. Bez výjimek."
 stewardship_domain_special.1520.c: "Že by [concerned_noble.GetTitledFirstName] něco [Select_CString(concerned_noble.IsFemale,'skrývala','skrýval')]? Nahraďte mé odhadce špehy!"
 stewardship_domain_special.1520.c.tt: "Odhalíš jedno z [Concept('secrets','tajemství')|E], které skrývá [concerned_noble.GetTitledFirstName]"
 stewardship_domain_special.1530.desc: "[city_mayor.GetTitledFirstName] za mnou přichází se zprávou, že tesařský cech z [guild_town.GetNameNoTierNoTooltip] v [guild_county.GetName] odmítá své zahrnutí do soupisu.\n\nTvrdí, že soupis porušuje výsady, které jim byly uděleny pro správu vlastních záležitostí, a požadují stažení mých odhadců z hrabství, aby mohli svobodně pokračovat ve své činnosti."
 stewardship_domain_special.1530.a: "Cechy budou zahrnuty do soupisu, výsady nevýsady!"
 stewardship_domain_special.1530.b: "[Select_CString(ROOT.Char.IsFemale,'Mohla bych','Mohl bych')] je výměnou za jejich služby osvobodit..."
 stewardship_domain_special.1530.c: "Odmítají mou autoritu!? Odeberte jim cechovní privilegia!"
 stewardship_domain_special.1540.desc.a: "Při cestě přes [domesday_robbed_county.GetName] přepadla skupina banditů mé odhadce. Několik jich bylo zabito a záznamy, které vezli, se ztratily."
 stewardship_domain_special.1540.desc.b: "Při cestě přes [domesday_robbed_county.GetName] přepadla skupina banditů mé odhadce. Vojáci, které jsem jim [Select_CString(ROOT.Char.IsFemale,'přidělila','přidělil')] na ochranu, naštěstí lupiče dokázali zlikvidovat."
 stewardship_domain_special.1540.a: "[domesday_robbed_county.GetNameNoTierNoTooltip] ignorujte. V soupisu nebude."
 stewardship_domain_special.1540.b: "Posilte tam hlídky na cestách a vyšlete další odhadce!"
 stewardship_domain_special.1540.c: "Ať je to ponaučení pro každého v [domesday_robbed_county.GetNameNoTierNoTooltip], kdo by se mi chtěl postavit!"
 stewardship_domain_special.1550.desc: "Při porovnávání loňských daní s údaji přicházejícími ze soupisu jsem si [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')] několika zásadních nesrovnalostí... Buď mi mí poddaní soustavně odváděli víc, než měli, nebo je s tímto soupisem něco vážně v nepořádku!\n\nPři dalším pátrání zjišťuji, že [domesday_steward.GetCouncilTitle] [domesday_steward.GetTitledFirstName] [Select_CString(domesday_steward.IsFemale,'podkopala','podkopal')] celý soupis přijímáním úplatků od držitelů půdy výměnou za vynechání jejich držav!"
 stewardship_domain_special.1550.a: "Soupis zruším a [domesday_steward.GetTitledFirstNameNoTooltip] mi uhradí jeho náklady."
 stewardship_domain_special.1550.b: "Za peníze z úplatků nechám ty državy řádně přezkoumat."
 stewardship_domain_special.1550.c: "Uvězním [domesday_steward.GetTitledFirstNameNoTooltip]. Jako [domesday_steward.GetCouncilTitle] končí."
 stewardship_domain_special.1560.desc: "[city_mayor.GetTitledFirstName] mi sděluje, že si cestující kupci stěžují na mé odhadce v [trade_county.GetName].\n\nKupci považují za nespravedlivé zahrnovat jejich zboží do soupisu, když nejsou obyvateli [ROOT.Char.GetPrimaryTitle.GetName], a několik z nich hrozí, že odejdou a už se nikdy nevrátí."
 stewardship_domain_special.1560.a: "Do soupisu budou zahrnuti všichni, místní i přespolní!"
 stewardship_domain_special.1560.b: "Když mi zaplatí poplatek, udělím jim výjimku."
 stewardship_domain_special.1560.c: "Kupci mají dobrý argument."
 stewardship_domain_special.1590.desc.start: "Po mnoha dlouhých měsících soupisu mých zemí je konečně hotovo."
 stewardship_domain_special.1590.perfect.desc: "Pod mým vedením sestavili mí odhadci naprosto dokonalý soupis mého majetku. Je v něm zaznamenáno vše do poslední slepice, takže každý rok vyberu přesně všechny daně, které mi náleží!"
 stewardship_domain_special.1590.excellent: "Tví odhadci sestaví přesný soupis tvého majetku"
 stewardship_domain_special.1590.excellent.desc: "Mí odhadci sestavili mimořádně přesný soupis mého majetku. Díky němu každý rok vyberu přesně všechny daně, které mi náleží!"
 stewardship_domain_special.1590.good: "Tví odhadci sestaví spolehlivý odhad tvého majetku"
 stewardship_domain_special.1590.good.desc: "Mí odhadci sestavili spolehlivý odhad mého majetku. Díky němu mí výběrčí daní při sčítání toho, co mi náleží, nepřehlédnou nic důležitého."
 stewardship_domain_special.1590.mediocre: "Tví odhadci sestaví jen přibližný odhad tvého majetku"
 stewardship_domain_special.1590.mediocre.desc: "Mí odhadci sestavili pouze přibližný odhad mého majetku. Stále je užitečný, ale mí výběrčí daní při sčítání toho, co mi náleží, téměř jistě něco přehlédnou."
 stewardship_domain_special.1590.poor: "Soupis je natolik nepřesný, že jej nelze použít"
 stewardship_domain_special.1590.poor.desc: "Mí odhadci bohužel sestavili natolik nepřesný soupis, že je naprosto nepoužitelný! Letos se mí výběrčí daní budou muset obejít bez něj..."
 stewardship_domain_special.1590.none.desc: "\n\nKupodivu se každé jednotlivé provincii v mém panství nějak podařilo získat výjimku ze soupisu. Hotové záznamy tak neobsahují doslova žádné informace o državách v mém panství."
 stewardship_domain_special.1590.every_county: "[THIS.Char.GetPrimaryTitle.GetName]: každé hrabství"
 stewardship_domain_special.1590.every_nonexcluded_county: "[THIS.Char.GetPrimaryTitle.GetName]: každé hrabství bez výjimky ze soupisu"
 stewardship_domain_special.1590.high_quality.desc: "\n\n[domesday_final_steward.GetCouncilTitle] [domesday_final_steward.GetFirstName] [Select_CString(domesday_final_steward.IsFemale,'celá','celý')] září hrdostí a ptá se, kam bychom měli hotové záznamy uložit."
 stewardship_domain_special.1590.low_quality.desc: "\n\n[domesday_final_steward.GetCouncilTitle] [domesday_final_steward.GetFirstName] je [Select_CString(domesday_final_steward.IsFemale,'zdrcená','zdrcený')] a říká, že takový výsledek [Select_CString(domesday_final_steward.IsFemale,'nečekala','nečekal')]."
 stewardship_domain_special.1590.no_steward.desc: "\n\nKéž bych stále [Select_CString(ROOT.Char.IsFemale,'měla','měl')] [ROOT.GetCouncillorPosition( 'councillor_steward' ).GetPositionName]. Soupis mohl dopadnout lépe."
 stewardship_domain_special.1590.high_quality.a: "Přístup k záznamům omezím pouze na své výběrčí daní."
 stewardship_domain_special.1590.high_quality.a.tt: "#F Omezení přístupu k těmto záznamům mi poskytne výhradní informace o mých zemích, kterých mohu využít.#!"
 stewardship_domain_special.1590.high_quality.b: "Záznamy zveřejním!"
 stewardship_domain_special.1590.high_quality.b.tt: "#F Veřejně dostupné záznamy ohromí a povzbudí obyvatelstvo, čímž zlepší rozvoj mých zemí.#!"
 stewardship_domain_special.1590.poor_quality.a: "Jaká ztráta času a peněz..."
 stewardship_domain_special.1590.poor_quality.b: "Za tuhle neschopnost [domesday_final_steward.GetFirstNameNoTooltip] odvolám!"
 stewardship_domain_special.1590.poor_quality.d.tt: "Odvolání z mé [Concept('council','rady')|E]"
 stewardship_domain_special.1590.poor_quality.c: "[domesday_final_steward.GetFirstNameNoTooltip] za tohle selhání zaplatí životem!"
 stewardship_domain_special.3010.t: "[stewardship_domain_special_3010_county.GetNameNoTier]: Nepokoje"
 stewardship_domain_special.3010.desc: "Obyvatelé hrabství [stewardship_domain_special_3010_county.GetNameNoTier] jsou zjevně nespokojeni s mou vládou.\n\nKdybych hrabství osobně [Select_CString(ROOT.Char.IsFemale,'navštívila','navštívil')], [Select_CString(ROOT.Char.IsFemale,'mohla bych','mohl bych')] jim připomenout... ehm, #EMP nezbytnost#! mé autority."
 stewardship_domain_special.3010.a: "Ukážu jim, co ve mně je!"
 stewardship_domain_special.3010.b: "Můj čas je příliš drahocenný, než abych ho [Select_CString(ROOT.Char.IsFemale,'marnila','marnil')] jejich názory."
 stewardship_domain_special.3012.t: "Návštěva: [stewardship_domain_special_3010_county.GetNameNoTier]"
 stewardship_domain_special.3012.desc.a: "[stewardship_domain_special_3010_baron.GetTitledFirstName] mi s omluvným výrazem vysvětluje, že místní jsou nezvladatelná chátra a musí pochopit, že o mé vládě se nepochybuje. Pouhá pasivní poslušnost nestačí. Potřebuji věrnost a oddanost.\n\nJak je přesvědčím, aby se podvolili?"
 stewardship_domain_special.3012.desc.b: "Místní jsou nezvladatelná chátra. Musí pochopit, že o mé vládě se nepochybuje. Pouhá pasivní poslušnost nestačí. Potřebuji věrnost a oddanost.\nJak je přesvědčím, aby se podvolili?"
 stewardship_domain_special.3012.a: "Zlatem jim ukážu svou štědrost."
 stewardship_domain_special.3012.b: "Ohromím je velkolepým projevem o své vládě."
 stewardship_domain_special.3012.b.success: "Svým projevem na lidi zapůsobíš"
 stewardship_domain_special.3012.b.failure: "Tvá slova vyzní naprázdno a lidé zůstanou neteční"
 stewardship_domain_special.3012.c: "Sedláci za svou drzost zaplatí!"
 stewardship_domain_special.3014.t.a: "[stewardship_domain_special_3010_county.GetNameNoTier]: Obnovený pořádek"
 stewardship_domain_special.3014.t.b: "[stewardship_domain_special_3010_county.GetNameNoTier]: Nepokoje"
 stewardship_domain_special.3014.spent_gold.desc: "Dobře utracené peníze. Má štědrost si koupila poslušnost místních vůči mé vládě."
 stewardship_domain_special.3014.popular_appeal_fail_learn_success.desc: "Hrabství [stewardship_domain_special_3010_county.GetNameNoTier] je stále stejně neklidné. Mé první projevy byly neobratné, ale myslím, že ke konci návštěvy už byly mnohem lepší."
 stewardship_domain_special.3014.popular_appeal_fail_learn_fail.desc: "Mé projevy padly na hluché uši. Nevím, co dělám špatně. Hrabství [stewardship_domain_special_3010_county.GetNameNoTier] je stále stejně neklidné."
 stewardship_domain_special.3014.popular_appeal_success.desc: "Mé projevy zasáhly správnou strunu a obyvatelé hrabství [stewardship_domain_special_3010_county.GetNameNoTier] jsou nyní vůči mé vládě mnohem poslušnější."
 stewardship_domain_special.3014.intimidate_success.desc: "Když jsem v hrabství [stewardship_domain_special_3010_county.GetNameNoTier] [Select_CString(ROOT.Char.IsFemale,'ukázala','ukázal')], kdo tu velí, zabralo to. Místní se přede mnou třásli a odteď budou poslušnějšími poddanými."
 stewardship_domain_special.3014.a: "Zlato si vždy najde prázdné dlaně."
 stewardship_domain_special.3014.b: "Aspoň jsem se něco [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')]."
 stewardship_domain_special.3014.c: "Má slova hýbou celým panstvím."
 stewardship_domain_special.3014.e: "Ať mě nenávidí, jen když se mě bojí."
 stewardship_domain_special.3014.f: "To je tak frustrující. Zlepším se vůbec někdy v diplomacii?"
 stewardship_domain_special.3014.f.tt: "O správě ses nic [Select_CString(ROOT.Char.IsFemale,'nenaučila','nenaučil')]."
 stewardship_domain_special.8031.t: "$stewardship_domain_special.8001.t$: Vdechnutí života"
 stewardship_domain_special.8031.aqueduct: "Jsem u toho, když jsou do mého nového akvaduktu v [county.GetName] zasazeny poslední kameny. [Select_CString(steward.IsFemale,'Má správkyně','Můj správce')] nastaví pohár a zachytí první kapky proudící vody, načež mi jej podá."
 stewardship_domain_special.8031.irrigation: "Jsem u toho v den, kdy budou strženy hráze a voda se konečně rozlije do mé nové sítě příkopů v [county.GetName]. Trvá celé hodiny, než se začne voda řádně rozlévat,"
 stewardship_domain_special.8031.interlude: "\n\nPůda je stále tvrdá a nehostinná a zbývá ještě mnoho práce,"
 stewardship_domain_special.8031.full_scope: "ale voda je svěží"
 stewardship_domain_special.8031.scoped_down: "zvlášť když můj projekt není zdaleka tak velkolepý, jak jsem si [Select_CString(ROOT.Char.IsFemale,'představovala','představoval')]. Přesto je voda svěží"
 stewardship_domain_special.8031.conclusion: "a časem této půdě přinese nový život. Když se pramínky slévají v proud, přemýšlím nad vším, co mě tato práce naučila."
 stewardship_domain_special.8031.a: "Ještě za desítky let budeme sklízet plody této práce."
 stewardship_domain_special.8001.progress_is_made: "Výrazný pokrok"
 stewardship_domain_special.8001.continued_problems: "Přetrvávající problémy"
 stewardship_domain_special.8001.troubled_construction: "Problematická výstavba"
 stewardship_domain_special.8001.slow_progress: "Pomalý postup"
 stewardship_domain_special.8001.high_death_count: "Vysoký počet obětí"
 stewardship_domain_special.8001.project_continues: "#V Projekt pokračuje#!"
 stewardship_domain_special.8001.project_completed: "#P Projekt je dokončen#!"
 stewardship_domain_special.8001.t: "Zavlažování"
 stewardship_domain_special.8001.desc: "[county.GetName] má nemalé plochy neosídlené půdy, za což obvykle může nevhodný terén.\n\n[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(steward.IsFemale,'navrhla','navrhl')], že by zavlažovací projekt mohl půdu zúrodnit, a tím ji učinit cennou."
 stewardship_domain_special.8001.a: "Navrhnu akvadukt!"
 stewardship_domain_special.8001.b: "Potřebujeme síť příkopů a zemních hrází."
 stewardship_domain_special.8001.c: "Ta půda není osídlená z dobrého důvodu."
 stewardship_domain_special.8001.if_successful: "V případě úspěchu:"
 stewardship_domain_special.8011.t: "$stewardship_domain_special.8001.t$: Překročený rozpočet"
 stewardship_domain_special.8011.desc: "Můj pomocný architekt za mnou přichází s žádostí, abych na svůj akvadukt v [county.GetName] vydal ještě více peněz.\n\n„Jistě vidíte, že za těchto podmínek musí být každá stavba drahá, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 stewardship_domain_special.8011.a: "[steward.GetFirstNameNoTooltip], najdi mi náhradu!"
 stewardship_domain_special.8011.a.tt: "#F [Select_CString(ROOT.Char.IsFemale,'Vkládala jsem','Vkládal jsem')] do něj takové naděje...#!"
 stewardship_domain_special.8011.b: "Máš pravdu. Vezmi si, co potřebuješ."
 stewardship_domain_special.8012.t: "$stewardship_domain_special.8001.t$: Přetrvávající problémy"
 stewardship_domain_special.8012.desc: "To v mém panství není jediný schopný architekt?! I můj nový pomocný architekt, který dohlíží na stavbu akvaduktu v [county.GetNameNoTier], překračuje rozpočet!\n\nUž mám dost nesmyslných výmluv jako „to nejde, [ROOT.Char.Custom('FormOfAddressForLiege')]“!"
 stewardship_domain_special.8012.a: "Vezmi si zlato, ale tentokrát už to dokonči!"
 stewardship_domain_special.8012.a.tt: "#F Jak může stavba obyčejného akvaduktu stát tolik?#!"
 stewardship_domain_special.8012.b: "Povolejte další sedláky na robotu."
 stewardship_domain_special.8013.t: "$stewardship_domain_special.8001.t$: Problematická výstavba"
 stewardship_domain_special.8013.desc: "Materiál doručený na špatné místo, stavby, které vůbec neodpovídají mým představám... Které části rozkazu „postavte akvadukt tak, jak ho chci“ je tak těžké porozumět?"
 stewardship_domain_special.8013.a: "Na práce dohlédnu osobně."
 stewardship_domain_special.8013.b: "Povolejte sedláky, ať doženou ztracený čas."
 stewardship_domain_special.8021.t: "$stewardship_domain_special.8001.t$: Nepředvídané potíže"
 stewardship_domain_special.8021.desc: "Můj zavlažovací projekt v [county.GetNameNoTier] postupuje, ale s většími obtížemi, než se očekávalo.\n\nPodle [steward.Custom2('MyCharacterIntroduction', ROOT.Char)] je půda „dvakrát kamenitější a dvakrát propustnější, než jsme si mysleli“."
 stewardship_domain_special.8021.a: "Pak budou sedláci pracovat dvakrát tolik!"
 stewardship_domain_special.8021.b: "Nespěchejme a udělejme to pořádně."
 stewardship_domain_special.8021.c: "Vždycky se dá někde něco ošidit, abychom dohnali zpoždění!"
 stewardship_domain_special.8022.t: "$stewardship_domain_special.8001.t$: Nešťastné podmínky"
 stewardship_domain_special.8022.desc: "„Zavlažovací projekt v [county.GetNameNoTier] pokračuje dobrým tempem, [ROOT.Char.Custom('FormOfAddressForLiege')],“ hlásí [Select_CString(steward.IsFemale,'má správkyně','můj správce')]. Má samolibost však brzy mizí. „Bohužel sedláci při práci umírají znepokojivým tempem.“"
 stewardship_domain_special.8022.a: "Asi na to budu muset odteď dohlížet trochu pozorněji."
 stewardship_domain_special.8022.b: "Copak nežijí proto, aby mi sloužili?"
 stewardship_domain_special.8022.c: "Ach... Podle potřeby povolejte náhrady."
 stewardship_domain_special.8022.c.tt: "#F Neříkejte jim, proč jsou potřeba.#!"
 stewardship_domain_special.8023.t: "$stewardship_domain_special.8001.t$: Uvízlý projekt"
 stewardship_domain_special.8023.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], zavlažovací projekt v [county.GetNameNoTier] má zpoždění,“ hlásí [steward.Custom2('MyCharacterIntroduction', ROOT.Char)]. „Velké zpoždění. Když jsem si práce [Select_CString(steward.IsFemale,'prohlédla, začala jsem','prohlédl, začal jsem')] pochybovat, zda budou vůbec dokončeny za mého života.“\n\nNedokážu poznat, zda to myslí vážně."
 stewardship_domain_special.8023.a: "Vyměňte dráby. A dejte jim nové biče."
 stewardship_domain_special.8023.b: "Najměte tolik dělníků, kolik bude potřeba!"
 stewardship_domain_special.8023.c: "Možná je načase trochu slevit z ambicí..."
 stewardship_domain_special.8023.c.tt: "Tím se sníží účinek mého projektu"
 stewardship_domain_special.9999.t: "Vše v mé účetní knize"
 stewardship_domain_special.9999.desc_opening: "Mám prsty ve všem, nic neunikne mému oku a ke každému rozhodnutí mám co říct. Správním záležitostem se věnuji už dlouho."
 stewardship_domain_special.9999.desc_education_4: "\n\nKdyž se ohlížím za svými úspěchy, uvědomuji si, že už se nemám co učit!"
 stewardship_domain_special.9999.desc_not_education: "\n\nKdyž se ohlížím za svými úspěchy, uvědomuji si, že se mnou v otázkách správy musí každý počítat!"
 stewardship_domain_special.9999.a: "Ve správě už přede mnou nezůstalo žádné tajemství!"
 stewardship_domain_special.9999.a.tt: "Mám pocit, že ve [Concept('stewardship_lifestyle','správcovském životním stylu')|E] už dál pokročit nemohu."
