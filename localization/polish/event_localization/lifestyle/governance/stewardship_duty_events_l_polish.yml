l_polish:
 stewardship_duty.0001.t: "Cvičení v usmiřování"
 stewardship_duty.0001.start.desc: "Když ke mně znovu dolehnou zvýšené hlasy, potlačím nutkání otočit se na patě. Neustálé hašteření"
 stewardship_duty.0001.vassals.desc: "mých vazalů [arguer_1.GetTitledFirstName] a [arguer_2.GetTitledFirstName]"
 stewardship_duty.0001.vassalandcourtier.desc: "mého vazala [arguer_1.GetTitledFirstName] a [arguer_2.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 stewardship_duty.0001.end.desc: "by dohnalo k šílenství kohokoli — s tím se musí něco udělat!\n\nMohu to pojmout jako cvičení v usmiřování, nebo tajně poslouchat a potom jednomu z nich vyjádřit podporu..."
 stewardship_duty.0001.a: "Pokusím se jim domluvit."
 stewardship_duty.0001.b: "„Uf, [arguer_2.GetFirstNameNoTooltip] je vážně [arguer_2.Custom2('InsultNoun', ROOT.Char)]!“"
 stewardship_duty.0001.c: "„Tomu říkám drzost, [arguer_1.GetFirstNameNoTooltip]!“"
 stewardship_duty.0001.a.success.tt: "Tvé usmiřování je úspěšné"
 stewardship_duty.0001.a.failure.tt: "Tvé vměšování působí necitlivě"
 stewardship_duty_0001_mediation_success.tt: "[arguer_1.GetShortUIName|U] a [arguer_2.GetShortUIName] si vzájemně zlepší [Concept('opinion','mínění')|e]"
 stewardship_duty.0017.t: "Hlas rozumu"
 stewardship_duty.0017.start.desc: "Další zasedání rady, další spor. [councillor_1.GetCouncilTitle] [councillor_1.GetFirstName] a [councillor_2.GetCouncilTitle] [councillor_2.GetFirstName] se prudce přou o"
 stewardship_duty.0017.war.desc: "probíhající válku."
 stewardship_duty.0017.election.desc: "volbu mého nástupce."
 stewardship_duty.0017.building_projects.desc: "nadcházející stavební projekty."
 stewardship_duty.0017.troop_training.desc: "způsob výcviku vojska."
 stewardship_duty.0017.charity_projects.desc: "můj příští dobročinný projekt."
 stewardship_duty.0017.religious_minorities.desc: "otázku náboženských menšin."
 stewardship_duty.0017.health_issues.desc: "šířící se nákazu."
 stewardship_duty.0017.end.desc: "\n\nJako [ROOT.GetCharacter.GetTitleAsNameNoTooltip] je mohu umlčet jediným slovem, ale mám lepší nápad. Mé diplomatické zkušenosti mi ukázaly, jak podobné situace řešit tak, aby byli všichni spokojeni."
 stewardship_duty.0017.a: "Postavím se za [councillor_1.GetFirstNameNoTooltip] a [councillor_2.GetFirstNameNoTooltip] tím nerozhněvám."
 stewardship_duty.0017.b: "Postavím se za [councillor_2.GetFirstNameNoTooltip] a [councillor_1.GetFirstNameNoTooltip] tím nerozhněvám."
 stewardship_duty.0017.c: "Najdu kompromis, který uspokojí všechny."
 stewardship_duty.0017.c.criticial_success.tt: "Dosáhneš skvělého kompromisu"
 stewardship_duty.0017.c.criticial_success.desc: "[Select_CString(ROOT.Char.IsFemale,'Dosáhla jsi','Dosáhl jsi')] skvělého kompromisu, který potěšil [councillor_1.GetFirstName] i [councillor_2.GetFirstName]."
 stewardship_duty.0017.c.success.tt: "Dosáhneš dobrého kompromisu"
 stewardship_duty.0017.c.success.desc: "[Select_CString(ROOT.Char.IsFemale,'Dosáhla jsi','Dosáhl jsi')] dobrého kompromisu, který uklidnil [councillor_1.GetFirstName] i [councillor_2.GetFirstName]."
 stewardship_duty.0017.c.failure.tt: "Nepodaří se ti najít kompromis"
 stewardship_duty.0017.c.failure.desc: "Nepodařilo se ti najít kompromis a [councillor_1.GetFirstName] i [councillor_2.GetFirstName] jsou zklamaní."
 stewardship_duty.1055.t: "Nechtěné těhotenství"
 stewardship_duty.1055.desc: "V mé audienční síni se odehrává dramatická scéna. [new_mothers_parent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] obviňuje [new_father.Custom2('MyCharacterIntroduction', ROOT.Char)], že je otcem dítěte, které čeká [new_mothers_parent.Custom2('RelationToMeShort', new_mother)][new_mother.Custom('Governance_1055_OutOfWedlock')].\n\n[new_fathers_parent.GetTitledFirstName] rozhořčeně tvrdí, že pro vinu [Select_CString(new_fathers_parent.IsFemale,'jejího syna','jeho syna')] neexistuje žádný důkaz. „A i kdyby to byl on, může si za to [new_mother.GetFirstName] sama, když je taková poběhlice!“\n\nHádka se vyostřuje a musím zasáhnout, než se všechno vymkne kontrole. "
 stewardship_duty.1055.a: "Dostane se ti spravedlnosti, [new_mothers_parent.GetFirstNameNoTooltip]."
 stewardship_duty.1055.b: "[new_father.GetFirstNameNoTooltip] za nic nemůže a [new_mothers_parent.GetFirstNameNoTooltip] nic nedluží!"
 stewardship_duty.1055.e: "Proč mě vy dva obtěžujete takovou malichernou hádkou!?"
 stewardship_duty.1062.t: "Bohatství nazbyt"
 stewardship_duty.1062.desc: "Má pokladnice přetéká zlatem a stříbrem a všechny výdaje jsou pokryté. Jako [ROOT.Char.GetLadyLord] s takovým bohatstvím [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'mohu nabídnout','se ode mě očekává, že nabídnu')] mecenášství nějakému umělci či učenci.\n\nJak tomu štěstí chtělo, právě do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] dorazili tři možní kandidáti... ale dokáže mě některý z nich zaujmout?"
 stewardship_duty.1062.a: "[client_1.GetTitledFirstNameNoTooltip] je známý pěstováním nádherných zahrad."
 stewardship_duty.1062.b: "Náboženská poezie, kterou tvoří [client_2.GetTitledFirstNameNoTooltip], pohnula mnoha dušemi."
 stewardship_duty.1062.c: "Objevy, které [Select_CString(client_3.IsFemale,'učinila','učinil')] [client_3.GetTitledFirstNameNoTooltip], vypadají slibně."
 stewardship_duty.1062.d: "Ne, s těmi penězi mám jiné plány..."
 stewardship_duty.1062.e: "Očekávání? Pche! Raději se budu kochat nádherou svého pokladu!"
 stewardship_duty.1063.t: "Obnovení mecenášství"
 stewardship_duty.1063.desc: "Po pěti letech se vyčerpaly prostředky vyčleněné na podporu [client.GetTitledFirstName] ([client.Custom('Governance_1062_Client')]). Nyní se mohu rozhodnout, zda mecenášství prodloužím o dalších pět let, nebo spolupráci ukončím."
 stewardship_duty.1063.a: "Prodloužím mecenášství o dalších pět let."
 stewardship_duty.1063.b: "[client.GetTitledFirstName] odvádí dobrou práci. Zaslouží si odměnu!"
 stewardship_duty.1063.c: "Služeb [client.GetTitledFirstName] už není zapotřebí."
 stewardship_duty.1064.desc: "[client.Custom('Governance_1062_Client_U')] [client.GetTitledFirstName] [Select_CString(client.IsFemale,'opustila','opustil')] můj dvůr"
 stewardship_duty.1065.desc: "[client.Custom('Governance_1062_Client_U')] [client.GetTitledFirstName] [Select_CString(client.IsFemale,'zemřela','zemřel')]"
 stewardship_duty.1065.guilty.desc: "[client.Custom('Governance_1062_Client_U')] [client.GetTitledFirstName] [Select_CString(client.IsFemale,'zemřela','zemřel')] mou rukou"
 stewardship_duty.1066.desc: "[client.Custom('Governance_1062_Client_U')] [client.GetTitledFirstName] [Select_CString(client.IsFemale,'skončila','skončil')] v mém žaláři"
 stewardship_duty.1068.desc.a: "Mé zahrady zapůsobily na jednoho z mých vazalů"
 stewardship_duty.1068.desc.b: "[ROOT.Char.GetFaith.AltPriestTermPlural|U] oceňují mého [client.Custom('Governance_1062_Client_U')]"
 stewardship_duty.1068.desc.c: "[client.Custom('Governance_1062_Client_U')] [client.GetTitledFirstName] [Select_CString(client.IsFemale,'učinila','učinil')] nový objev"
 stewardship_duty.1071.t: "Uprchlí nevolníci"
 stewardship_duty.1071.desc: "Do [target_county.GetName] dorazilo ze sousedního [origin_county.GetName] velké množství nevolníků. Tvrdí, že prchají před krutou vládou [origin_county_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] a raději chtějí žít pod mou vládou než pod [Select_CString(origin_county_owner.IsFemale,'její','jeho')].\n\nZ právního hlediska je však stále vlastní [origin_county_owner.GetFirstName]. Pokud jim dovolím usadit se na mých územích, bude téměř nemožné dokázat, že právě [origin_county_owner.GetFirstName] je [Select_CString(origin_county_owner.IsFemale,'jejich paní','jejich pánem')]."
 stewardship_duty.1071.a: "Ať si [origin_county_owner.GetFirstNameNoTooltip] své nevolníky velkoryse vezme zpět."
 stewardship_duty.1071.b: "Ať si [origin_county_owner.GetFirstNameNoTooltip] nevolníky vezme zpět — ale nejdřív si vyslechne ostré pokárání."
 stewardship_duty.1071.c: "Ukažte #EMP mým#! nevolníkům jejich nová hospodářství..."
 stewardship_duty.1071.c.compassionate: "U mě najdou útočiště. [origin_county_owner.GetFirstNameNoTooltip] už jim neublíží..."
 stewardship_duty.1071.c.flavor: "...a budu doufat, že se [origin_county_owner.GetFirstName] nedozví o mém podílu!"
 stewardship_duty.1072.opening: "[origin_county_owner.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 stewardship_duty.1072.desc.rival: "Vím, že jsi mi ukradl nevolníky. Možná nemám žádnou možnost získat je zpět, ale nemysli si, že na tuhle urážku zapomenu. Odteď mezi námi panuje nepřátelství — doufám, že to stálo za to."
 stewardship_duty.1072.desc.relationship: "Proč mi kradeš mé nevolníky!? Taková zrada mě šokovala a hluboce ranila... Nevím, jestli se na tebe ještě někdy dokážu dívat jako dřív."
 stewardship_duty.1072.desc.vassal: "Vím, že jsi mé nevolníky usadil na svých územích. Proč něco takového děláš někomu, kdo ti věrně slouží? Copak ode mě nedostáváš daně, které ti náleží?\n\nBez nevolníků nemá kdo obdělávat má pole a pěstovat úrodu. To už mi rovnou ukradni samotnou půdu! Na tuhle urážku jen tak nezapomenu."
 stewardship_duty.1072.desc.subvassal: "Vím, že jsi mé nevolníky usadil na svých územích. Takový čin podrývá samotné základy naší společnosti!\n\nTeď s tím sice nic nenadělám, ale [origin_county_owner_liege.GetTitledFirstName] se dozví, proč letos odvedu méně daní."
 stewardship_duty.1072.a: "To byli tvoji nevolníci? Omlouvám se, vrátím je."
 stewardship_duty.1072.b: "Brblej si, jak chceš. Nic to nezmění."
 stewardship_duty.1072.b.compassionate: "To je tvoje vina. [Select_CString(origin_county_owner.IsFemale,'Neměla jsi je týrat.','Neměl jsi je týrat.')]"
 stewardship_duty.4010.t: "Frakcionářství vazalů"
 stewardship_duty.4010.desc.start: "[faction_member.GetTitledFirstName] využívá svého vlivu k prosazování zájmů"
 stewardship_duty.4010.desc.independence: "frakce [targeting_faction.GetName]. Jejím cílem je vymanit se z mé vlády s tvrzením, že nemám právo jejím členům vládnout."
 stewardship_duty.4010.desc.liberty: "frakce [targeting_faction.GetName]. Jejím cílem je zrušit několik zákonů v [ROOT.Char.GetPrimaryTitle.GetName], které podle jejích členů zasahují do tradičních práv skupiny označované jako [faction_member.Custom('StatecraftGetVassalType')]."
 stewardship_duty.4010.desc.claimant: "frakce [targeting_faction.GetName]. Podle jejích členů by frakcí podporovaná osoba nakonec vládla lépe než já."
 stewardship_duty.4010.desc.peasant: "frakce [targeting_faction.GetName]. Její členové odmítají být mými poddanými, protože mě označují jako [ROOT.Char.Custom2('GetUnbelieverAndForeignerTerm', faction_member)], a raději chtějí, aby jim [faction_leader.GetTitledFirstName] [Select_CString(faction_leader.IsFemale,'vládla','vládl')], protože s nimi sdílí kulturu i víru."
 stewardship_duty.4010.desc.end: "\n\nO odhodlání [faction_member.GetFirstNameNoTooltip] nepochybuji, ale pořád je to jen člověk. Pokud mé přesvědčování zabere a [faction_member.GetTitledFirstNameNoTooltip] omezí své aktivity, bude pro mě snazší upevnit moc nad mými vazaly."
 stewardship_duty.4010.bribe: "Možná stačí štědrý dar a [faction_member.GetFirstNameNoTooltip] změní názor."
 stewardship_duty.4010.bribe.flavor: "Sobecké povahy spíše přijmou úplatek."
 stewardship_duty.4010.favor: "Když mi teď [faction_member.GetFirstNameNoTooltip] pomůže, laskavost oplatím."
 stewardship_duty.4010.favor.flavor: "Sobecké či soucitné povahy tuto nabídku spíše přijmou."
 stewardship_duty.4010.prestige: "Staré dobré lichotky dokážou vzbudit věrnost."
 stewardship_duty.4010.prestige.flavor: "Pyšní či čestní lidé se spíše nechají obměkčit lichotkami."
 stewardship_duty.4010.piety: "Ať si [faction_member.GetFirstNameNoTooltip] připomene, že mé zájmy slouží tomu, co žádá [faction_member.GetFaith.HighGodName]."
 stewardship_duty.4010.piety.flavor: "Zbožní lidé se spíše řídí svou vírou."
 stewardship_duty.4010.attempt.tt: "[faction_member.GetTitledFirstNameNoTooltip] se rozhodne podle své osobnosti"
 stewardship_duty.4010.success: "[faction_member.GetTitledFirstNameNoTooltip] přijme mou nabídku"
 stewardship_duty.4010.failure: "[faction_member.GetTitledFirstNameNoTooltip] odmítne mou nabídku"
 stewardship_duty.4010.decline: "[faction_member.GetTitledFirstNameNoTooltip] pouze uplatňuje svá práva."
 stewardship_duty.4010.decline.tt: "Každý ocení, když si může dělat, co chce."
 stewardship_duty.4011-4.desc.start: "[my_liege.GetTitledFirstName] mě oslovuje s tvrzením, že mé členství ve frakci [targeting_faction.GetName] působí značné potíže a musí skončit."
 stewardship_duty.4011-4.b: "Nenechám se zviklat!"
 stewardship_duty.4011-4.b.tt: "Zůstaneš ve frakci [targeting_faction.GetName]"
 stewardship_duty.4011.t: "Apel na chamtivost"
 stewardship_duty.4011.desc: "\n\n[my_liege.GetTitledFirstName] mi proto nabízí naditý měšec jako pobídku, abych frakci opustil a zaměřil svou pozornost jinam."
 stewardship_duty.4011.a: "Poctivý obchod."
 stewardship_duty.4012.t: "Apel na ctižádost"
 stewardship_duty.4012.desc: "\n\n[my_liege.GetTitledFirstName|U] mě prosí, ať se na věc zkusím podívat z druhé strany, a výměnou za ukončení podpory frakce mi nabízí laskavost."
 stewardship_duty.4012.a: "Ruka ruku myje!"
 stewardship_duty.4013.t: "Apel na pýchu"
 stewardship_duty.4013.desc: "\n\n[my_liege.GetTitledFirstName] mi proto nabízí, že veřejně vyzdvihne mé zásluhy v jiných oblastech, a posílí tak mou pověst v [my_liege.GetPrimaryTitle.GetName]."
 stewardship_duty.4013.a: "Ať [my_liege.GetTitledFirstNameNoTooltip] chválí, co chce. Hlavně když zazní [faction_member.Custom('quirk_pos_noun')]."
 stewardship_duty.4014.t: "Apel na zbožnost"
 stewardship_duty.4014.desc: "\n\n[my_liege.GetTitledFirstName|U] mi pak připomíná, že na trůně sedí z vůle, kterou ztělesňuje [faction_member.GetFaith.HighGodName], a postavit se proti této vládě znamená postavit se proti [faction_member.GetFaith.HighGodHerHis] božské vůli."
 stewardship_duty.4014.a: "[my_liege.GetTitledFirstNameNoTooltip] je můj vládce. Službou této vládě plním i vůli, kterou ztělesňuje [faction_member.GetFaith.HighGodName]."
 stewardship_duty.4015.t: "Vazal opouští frakci"
 stewardship_duty.4015.desc: "Stačilo jasně ukázat, co může [faction_member.GetTitledFirstName] získat za svou věrnost, a podařilo se mi dosáhnout toho, že přestane podporovat frakci [targeting_faction.GetName].\n\n[Select_CString(faction_member.IsFemale,'Její','Jeho')] výhrady byly zkrátka příliš malicherné ve srovnání s mou nabídkou!"
 stewardship_duty.4015.a: "Bylo mi jasné, že [faction_member.GetFirstNameNoTooltip] nakonec dostane rozum!"
 stewardship_duty.4019.t: "Vazal se drží frakce"
 stewardship_duty.4019.desc: "Přes veškerou mou snahu [faction_member.GetTitledFirstName] odmítá opustit frakci [targeting_faction.GetName] a dál staví její zájmy nad mé."
 stewardship_duty.4019.a: "Proč [faction_member.GetFirstNameNoTooltip] nevidí výhody toho, když se přidá na mou stranu?"
 stewardship_duty.4020.t: "Nabídka pozbyla platnosti"
 stewardship_duty.4020.desc: "[faction_member.GetTitledFirstName] už není v žádné frakci."
 stewardship_duty.4020.desc.switch: "[faction_member.GetTitledFirstName] je nyní v jiné frakci."
 stewardship_duty.4040.t: "Změna podmínek"
 stewardship_duty.4040.desc: "[ROOT.Char.Custom2('RelationToMe', my_vassal)|U] [my_vassal.GetTitledFirstName] má se mnou velmi mírnou vazalskou smlouvu, která jej zbavuje mnoha povinností, jež bych od svých vazalů obvykle očekával.\n\nPokud se mi podaří získat souhlas se zvýšením povinností, bude to pro mé panství z dlouhodobého hlediska velmi výhodné..."
 stewardship_duty.4040.a: "Stačí správná pobídka a [my_vassal.GetFirstNameNoTooltip] souhlasí."
 stewardship_duty.4040.b: "Vsadím se, že [my_vassal.GetFirstNameNoTooltip] na změny přistoupí, když dobře zapůsobím."
 stewardship_duty.4040.b.success: "[my_vassal.GetFirstNameNoTooltip] souhlasí se změnou vazalské smlouvy"
 stewardship_duty.4040.b.failure: "[my_vassal.GetFirstNameNoTooltip] nadále odmítá změnu vazalské smlouvy"
 stewardship_duty.4040.c: "Ať [my_vassal.GetFirstNameNoTooltip] mé změny přijme, nebo bude zle!"
 stewardship_duty.4040.c.success: "[my_vassal.GetFirstNameNoTooltip] pod nátlakem souhlasí se změnou vazalské smlouvy"
 stewardship_duty.4040.c.failure: "[my_vassal.GetFirstNameNoTooltip] odmítá změnu vazalské smlouvy"
 stewardship_duty.4040.d: "Věrnost má větší cenu než odvedenci."
 stewardship_duty.4040.d.tt: "#F [my_vassal.GetFirstNameNoTooltip] si s mým požehnáním ponechá stávající vazalskou smlouvu:#!"
 stewardship_duty.4040.contractchange: "Upravím vazalskou smlouvu ve svůj prospěch a [my_vassal.GetTitledFirstName] bude muset nové podmínky přijmout."
 stewardship_duty.4041.desc: "[my_vassal.GetTitledFirstName] má přijmout přísnější vazalskou smlouvu, a tak mezi námi proběhl dlouhý rozhovor o všech důvodech, proč je taková změna nutná. \n\n[my_vassal.GetTitledFirstName|U] se zpočátku zdráhá, ale po dlouhé diskusi nakonec uznává, že změna smlouvy je rozumná."
 stewardship_duty.4041.a: "Přesně vím, jak na [my_vassal.GetFirstNameNoTooltip]!"
 stewardship_duty.4042.desc: "[my_vassal.GetTitledFirstName] má podle své vazalské smlouvy určitá práva a už od začátku je mi jasné, že vzdát se jich nebude chtít.\n\nNavzdory všem mým snahám a prosbám [my_vassal.GetTitledFirstName] neustupuje a tvrdí, že pokud si neumím vystačit s tím, co nyní dostávám, je to moje vina, ne [Select_CString(my_vassal.IsFemale,'její','jeho')]."
 stewardship_duty.4042.a: "Budu muset zkusit jiný přístup..."
 stewardship_duty.4043.desc: "To nebylo vyjednávání — byl to požadavek. Je naprosto jasné, že [my_vassal.GetTitledFirstName] drží své tituly jen z mé vůle a pokud chce zůstat v mé přízni, musí ustoupit.\n\n[my_vassal.GetTitledFirstName|U] rychle souhlasí a můj odchod bez dalšího incidentu přijímá s úlevou."
 stewardship_duty.4043.a: "$stewardship_duty.4041.a$"
 stewardship_duty.4044.desc: "[my_vassal.GetTitledFirstName] se ohradí proti mému požadavku na přísnější vazalskou smlouvu.\n\n[my_vassal.GetTitledFirstName|U] mi připomíná, že ačkoli jsem [ROOT.Char.GetTitleAsNameNoTooltip] a vládnu této zemi, současná vazalská smlouva zaručuje určitá privilegia, která nemohu jen tak odebrat — alespoň ne po právu."
 stewardship_duty.4044.a: "$stewardship_duty.4042.a$"
 stewardship_duty.4060.t: "Organizace frakce"
 stewardship_duty.4060.desc.default: "I uprostřed války [faction_leader.GetTitledFirstName] i stoupenci frakce [targeting_faction.GetName] neváhají využít každé záminky k prosazování svých zájmů!"
 stewardship_duty.4060.desc.self_claim: "I uprostřed války [faction_leader.GetTitledFirstName] neváhá využít každé záminky k prosazování svého nároku na [targeting_faction.GetSpecialTitle.GetName]!"
 stewardship_duty.4060.desc.other_claim: "I uprostřed války [faction_leader.GetTitledFirstName] neváhá využít každé záminky k prosazování tvrzení, že [targeting_faction.GetSpecialCharacter.GetTitledFirstName] má nárok na [targeting_faction.GetSpecialTitle.GetName]!"
 stewardship_duty.4060.desc.end: "\n\nKdyž na bojišti mizí mé vojsko i zlato, musím důkladně zvážit, jakými prostředky mohu tuto hrozbu zmírnit..."
 stewardship_duty.4060.a: "#EMP Musím#! přesvědčit celé panství, aby drželo při sobě."
 stewardship_duty.4060.a.success: "Přesvědčím frakci, aby držela při sobě"
 stewardship_duty.4060.a.success.every_faction_member: "Každý člen frakce [targeting_faction.GetName|V]"
 stewardship_duty.4060.a.failure: "Má slova frakci nepřesvědčí"
 stewardship_duty.4060.b: "Tučný obnos a [faction_leader.GetFirstNameNoTooltip] možná ustoupí..."
 stewardship_duty.4060.c: "Ať [faction_leader.GetFirstNameNoTooltip] ani nepomyslí na uskutečnění svých plánů!"
 stewardship_duty.4060.d: "Teď si s tím nemohu dělat starosti."
 stewardship_duty.4060.attempt.tt: "[faction_leader.GetTitledFirstNameNoTooltip] se rozhodne podle své osobnosti"
 stewardship_duty.4060.decline.tt: "Prozatím frakci ignoruješ"
 stewardship_duty.4060.failure.tt: "[targeting_faction.GetName] nezaznamená žádný pokles nespokojenosti"
 stewardship_duty.5021.t: "Neloajální vazal"
 stewardship_duty.5021.desc: "Procházím účetní knihy s přehledem příjmů od vazalů. Tato čísla nesedí... [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('cheater_vassal'))|U] [cheater_vassal.GetTitledFirstName] si myslí, že mě může vodit za nos, a odvádí příliš málo!"
 stewardship_duty.5021.a: "Ať [cheater_vassal.GetTitleAsNameNoTooltip] zaplatí, co dluží."
 stewardship_duty.5021.a.message_1: "[cheater_vassal.GetFirstNameNoTooltip] platí, co mi dluží"
 stewardship_duty.5021.a.message_2: "Mám podezření, že [cheater_vassal.GetFirstNameNoTooltip] stále zadržuje část peněz"
 stewardship_duty.5021.b: "Odteď bude [cheater_vassal.GetFirstNameNoTooltip] pod mým drobnohledem!"
 stewardship_duty.5021.c: "Kdo by odolal pokušení trochu si namastit kapsu?"
 stewardship_duty.7001.t: "Válčící vazalové"
 stewardship_duty.7001.desc: "Dva z mých vazalů, [war_vassal.GetTitledFirstName] a [war_vassal_2.GetTitledFirstName], proti sobě vedou válku. [war_scope.GetName] může destabilizovat mé panství, a pokud chci zasáhnout, musím jednat rychle."
 stewardship_duty.7001.a: "Přesvědčím je, ať svůj spor odloží."
 stewardship_duty.7001.a.desc_1: "[war_vassal.GetFirstNameNoTooltip] uzná, že mír je moudřejší"
 stewardship_duty.7001.a.desc_2: "[war_vassal.GetFirstNameNoTooltip] mé argumenty nevyslyší"
 stewardship_duty.7001.b: "Je to mezi nimi — zasahovat nebudu."
 stewardship_duty.7001.c: "„S touhle pošetilostí přestanete. #EMP Hned!#!“"
 stewardship_duty.7002.toast.peace: "[war_vassal.GetFirstName] a [war_vassal_2.GetFirstName] souhlasí s bílým mírem"
 stewardship_duty.7002.toast.invalid: "[war_scope.GetName] skončila dřív, než jsem mohl zasáhnout"
 stewardship_duty.7023.t: "A co ta laskavost..."
 stewardship_duty.7023.desc: "Tíží mě vědomí, že [hook_holder.GetTitledFirstName] ode mě může žádat značnou laskavost.\n\nVelice by se mi ulevilo, kdybych tento dluh mohl vyrovnat hned a podle svých podmínek. Čekat, až jej [hook_holder.GetFirstNameNoTooltip] začne vymáhat, by mě později mohlo dostat do úzkých."
 stewardship_duty.7023.success: "Přesvědčím [hook_holder.GetFirstNameNoTooltip], aby mou dlužnou laskavost odpustil[Select_CString(hook_holder.IsFemale,'a','')]"
 stewardship_duty.7023.failure: "[hook_holder.GetFirstNameNoTooltip] trvá na splacení mé dlužné laskavosti"
 stewardship_duty.7023.a: "Nabídnu [hook_holder.GetFirstNameNoTooltip] tvrdou minci a dluh vyrovnám."
 stewardship_duty.7023.a.success: "[hook_holder.GetTitledFirstNameNoTooltip] přijme mé zlato místo dlužné laskavosti"
 stewardship_duty.7023.b: "Přesvědčím [hook_holder.GetFirstNameNoTooltip], ať nechá minulost minulostí."
 stewardship_duty.7023.c: "Ať na to [hook_holder.GetFirstNameNoTooltip] zapomene, nebo bude zle!"
 stewardship_duty.7023.d: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip] vždy splácí své dluhy!"
 stewardship_duty.7023.d.tt: "[hook_holder.GetTitledFirstName] ode mě stále může žádat laskavost."
 stewardship_duty.7023.player: "#weak Jiný hráč může vždy odmítnout, ale může za to získat [Concept('stress','stres')|e].#!"
 stewardship_duty.7023.invalidated.hooked_ruler: "Protože už [hook_holder.GetTitledFirstName] nic nedlužím, má žádost o odpuštění laskavosti už není platná."
 stewardship_duty.7023.invalidated.hook_holder: "Protože už mi [hooked_ruler.GetTitledFirstName] nic nedluží, žádost o odpuštění laskavosti už není platná."
 stewardship_duty.7025.opening: "[hooked_ruler.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 stewardship_duty.7025.desc.gold: "Kdysi jsi mi prokázal velkou službu a nezapomněl jsem na ni. Jako odměnu ti chci nabídnout část své pokladnice.\n\nJe pro tebe taková nabídka přijatelná?"
 stewardship_duty.7025.desc.diplomacy.success: "Píšu ti kvůli laskavosti, kterou jsem ti kdysi dlužil. Každý rozumný člověk jistě uzná, že mé pozdější činy tuto povinnost dostatečně vyrovnaly.\n\nProto mám za to, že ti už nic nedlužím."
 stewardship_duty.7025.desc.diplomacy.failure: "Dlužím ti laskavost, ale ten dluh mi není zrovna po chuti. Kdo by také chtěl někomu něco dlužit?\n\nCo kdybys na tu laskavost prostě... zapomněl? To by mi opravdu vyhovovalo."
 statectaft_ongoing.7025.desc.intimidation.success: "Možná jsi mi kdysi prokázal službu, ale nemysli si, že ti za ni něco dlužím. Dostatečnou odměnou je už to, že zůstáváš v mé přízni. Věř mi, nechceš si ze mě udělat nepřítele..."
 stewardship_duty.7025.desc.intimidation.failure: "Zdá se, že žiješ v domnění, že si zasloužíš mou laskavost. Někomu, kdo je tak [hook_holder.Custom2('InsultAdjective', SCOPE.sC('hooked_ruler'))] [hook_holder.Custom2('InsultNoun', SCOPE.sC('hooked_ruler'))] jako ty, nedlužím vůbec nic! Zapomeň na to, nebo bude zle."
 stewardship_duty.7025.gold.a: "Vezmu si zlato."
 stewardship_duty.7025.gold.b: "Laskavost má větší cenu než mince."
 stewardship_duty.7025.diplomacy.a: "Přesvědčivý argument."
 stewardship_duty.7025.diplomacy.b: "To myslí [hooked_ruler.GetTitledFirstName] vážně?! Ani náhodou!"
 stewardship_duty.7025.intimidation.a: "Nechci, aby se na mě [hooked_ruler.GetTitledFirstName] [Select_CString(hooked_ruler.IsFemale,'rozzlobila','rozzlobil')]..."
 stewardship_duty.7025.intimidation.b: "S prázdnými výhrůžkami [hooked_ruler.GetTitledFirstName] nepochodí!"
 stewardship_duty.7025.refuse.tt: "[hooked_ruler.GetTitledFirstName] mi stále dluží laskavost"
 stewardship_duty.7025.stress.tt: "Mám sklon laskavost odpustit, takže odmítnutí mi způsobí stres"
 stewardship_duty.7027.opening: "[hook_holder.Custom2('AppropriateGreeting', ROOT.Char)|U]"
 stewardship_duty.7027.desc.accepted.gold: "Děkuji za dar. Považuj svůj dluh za zcela splacený."
 stewardship_duty.7027.desc.refused.gold: "Tvůj závazek má větší cenu než zlato. Stále mi něco dlužíš."
 stewardship_duty.7027.desc.accepted.diplomacy: "Uznávám moudrost tvých slov. Na tu dávnou laskavost už nemysli."
 stewardship_duty.7027.desc.refused.diplomacy: "Tvé květnaté řeči jsou stejně prázdné jako tvé zdánlivé sliby. Stále tě považuji za svého dlužníka."
 stewardship_duty.7027.desc.accepted.intimidation: "Samozřejmě ti ten dluh odpustím. O tom přece nikdy nebylo pochyb! Jsem ti vydán na milost."
 stewardship_duty.7027.desc.refused.intimidation: "Nezastrašíš mě. Svůj závazek vůči mně splníš tak či onak."
 stewardship_duty.7027.a: "Konečně je to vyřešené."
 stewardship_duty.7027.b: "Mohlo to dopadnout lépe."
 stewardship_duty_special.1201.t: "Mapování zemí"
 stewardship_duty_special.1201.desc: "[steward.GetCouncilTitle] [steward.GetTitledFirstName] navrhuje výpravu. Prý z ní bude mít prospěch [ROOT.Char.Custom('RealmType')].\n\nSe svým doprovodem mám procestovat a zmapovat území, kterému vládne [painting_land_owner.GetTitledFirstName]. Cesta mi umožní lépe poznat vlastní panství a podle [steward.GetFirstNameNoTooltip] také lépe pochopit [painting_land_owner.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('painting_land_owner'))])."
 stewardship_duty_special.1201.a: "To stojí za námahu."
 stewardship_duty_special.1201.a.tt: "Okamžitě zahájíš přípravy!"
 stewardship_duty_special.1201.b: "Na takovou cestu teď není vhodná doba."
 stewardship_duty_special.1201.b.tt: "Na cestu se nevydáš"
 stewardship_duty_special.1201.continue_tooltip: "Můj průzkum pokračuje."
 stewardship_duty_special.1202.desc: "Jakmile vstoupíme na území, kterému vládne [painting_land_owner.GetTitledFirstName], přivítá nás [painting_land_owner.Custom('MountedWarriorTerm')] se svým doprovodem.\n\n„[painting_land_owner.GetTitledFirstName] vás vítá. [ROOT.Char.Custom('my_title')|U], v těchto zemích můžete zůstat tak dlouho, jak budete potřebovat.“"
 stewardship_duty_special.1202.a: "Doufám, že se toho hodně dozvím."
 stewardship_duty_special.1202.a.tt: "Začnu mapovat okolí."
 stewardship_duty_special.1203.desc: "Vypadala jako naprosto klidná cesta, jenže právě proto je ideální pro přepadení, ne?\n\nBandité se vyřítili zpoza kopce a vzduch rázem zaplnily šípy a výkřiky rozkazů."
 stewardship_duty_special.1203.a: "Nenechte jediného zločince naživu!"
 stewardship_duty_special.1203.b: "Stát! Za bezpečný průchod zaplatíme!"
 stewardship_duty_special.1204.desc: "Jedné noci táboříme u vody. Nedaleko leží [painting_land_owner.Custom('IndefiniteBodyOfWater')]. Ráno tábor probouzí ptačí zpěv a jemná mlha nad vodou."
 stewardship_duty_special.1204.a: "Tady bychom mohli na chvíli zůstat."
 stewardship_duty_special.1204.a.tt: "Tvá cesta se trochu zdrží."
 stewardship_duty_special.1204.b: "Pokračujeme bez prodlení."
 stewardship_duty_special.1205.desc: "Rolníci na poli u cesty patrně nikdy neviděli tak vznešený průvod, jako je ten můj.\n\n„Kdo je to?“ zaslechnu, jak se jeden ptá druhého."
 stewardship_duty_special.1205.a: "„[Select_CString(ROOT.Char.IsFemale,'Jsem vaše paní a vládkyně','Jsem váš pán a vládce')], tato země patří mně!“"
 stewardship_duty_special.1205.b: "Chci poznat, jak se tu žije rolníkům."
 stewardship_duty_special.1206.desc: "Během cesty míjím několik pevností na různých obranných místech v členité krajině. Jednoho rána se k jedné z nich blížíme a u bran na péči o koně dohlíží [local_baron.GetTitleAsNameNoTooltip]."
 stewardship_duty_special.1206.a: "Ať mi [local_baron.GetTitledFirstNameNoTooltip] ukáže [local_baron.Custom('FortifiedBuilding')]."
 stewardship_duty_special.1206.b: "[local_baron.GetTitledFirstNameNoTooltip] dnes povečeří se mnou."
 stewardship_duty_special.1207.desc: "Týdny na cestě unaví každého člověka a [ROOT.Char.GetWomanMan] není výjimkou. Proto je požehnáním, když konečně narazíme na hostinec, který snad nabízí takový luxus jako opravdovou postel. Možná má dokonce přístřeší i pro zvířata větší než krysy."
 stewardship_duty_special.1207.a: "Trvám na tom, že za ubytování i stravu zaplatím."
 stewardship_duty_special.1207.b: "Pro hostinského bude čest, když pod jeho střechou přenocuje [ROOT.Char.GetTitleAsNameNoTooltip]!"
 stewardship_duty_special.1208.desc: "Území, kterému vládne [painting_land_owner.GetTitledFirstName], je protkáno potoky a řekami; většinu přechodů přes ně tvoří provizorní mosty a brody. Tak klidné vody přece musí být užitečné i k něčemu jinému?"
 stewardship_duty_special.1208.a: "Budu kartografovi posílat vzkazy v malých miskách!"
 stewardship_duty_special.1208.b: "Kdyby se tyto bahnité břehy uhrabaly, možná by se daly obdělávat..."
 stewardship_duty_special.1281.opening: "Kopce a údolí, pláně a jezera, hlavní cesty i lesní stezky. Na území, kterému vládne [painting_land_owner.GetTitledFirstName], už mi nic z toho není cizí a moji kartografové si dychtivě zapisují poznámky a každou novou scenérii zachycují uhlem."
 stewardship_duty_special.1281.end: "\n\nTaké [ROOT.Char.Custom('RealmType')] zahrnuje města, vesnice i lidi, kteří tudy cestují; jejich průzkum byl neméně zajímavý."
 stewardship_duty_special.1281.a: "Tohle si raději nechám pro sebe."
 stewardship_duty_special.1281.b: "O výsledcích se musí dozvědět [painting_land_owner.GetTitledFirstNameNoTooltip]."
 stewardship_duty_special.1282.end: "\n\nKartografové si také poznamenali chátrající pevnosti a přírodní útvary, které se mimořádně dobře hodí k obraně."
 stewardship_duty_special.1282.a: "Člověk nikdy neví, kdy se to může hodit."
 stewardship_duty_special.1282.b: "[painting_land_owner.GetFirstNameNoTooltip] [Select_CString(painting_land_owner.IsFemale,'by měla','by měl')] obnovit svá opevnění... A já také!"
 stewardship_duty_special.1283.end: "\n\nMíra detailu, které moji kartografové na těchto mapách dosáhli, je ohromující. Zdá se, že jim neunikla jediná stezka, a mapy jsou plné podrobných poznámek o terénu."
 stewardship_duty_special.1283.a: "Teď nikdo nezná zdejší kraj lépe než já."
 stewardship_duty_special.1283.b: "Moji vojevůdci je dobře využijí."
 stewardship_duty_special.1284.end: "\n\nObzvlášť mě zaujalo množství řek a potoků v těchto zemích. [painting_land_owner.Custom('my_title')|U] jim vládne."
 stewardship_duty_special.1284.a: "Možná by je mohli využívat poslové?"
 stewardship_duty_special.1284.b: "Zvážím jejich vojenský význam."
 stewardship_duty_special.1285.end: "\n\nJe zřejmé, že je tu mnoho míst, kam lidé zavítají jen zřídka — pokud na ně vůbec kdy vkročila lidská noha."
 stewardship_duty_special.1285.a: "O samotné půdě, po které kráčíme, se toho ještě můžeme tolik naučit."
 stewardship_duty_special.1285.b: "Kdybychom tam podpořili osadníky a tady odvodnili půdu..."
 stewardship_duty_special.1286.end: "\n\nZačínám si více vážit rozmanitosti svého panství. Kdo by čekal, že zdejší kraj a [capital.GetNameNoTier] budou tak rozdílné?"
 stewardship_duty_special.1286.a: "Tyhle poznatky budou velmi užitečné."
 stewardship_duty_special.1286.b: "I v těchto zemích jsem [ROOT.Char.GetLadyLord]!"
