 stewardship_duty_special.2001.t: "Urovnání"
 stewardship_duty_special.2001.desc: "Nepřátelství mezi mými vazaly [vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName] je pověstné a zašlo tak daleko, že ostatní šlechtici v panství už požadují můj zásah.\n\nPohraniční spory, právo vybírat daně, rodinná minulost... Jejich seznam svárů nebere konce a dokonce ani zde u mého dvora se k sobě jen stěží dokážou chovat zdvořile."
 stewardship_duty_special.2001.a: "Usmířit je bude pořádná výzva!"
 stewardship_duty_special.2001.b: "Tohle je záležitost pro [ROOT.Char.GetCouncillor('councillor_chancellor').GetCouncilTitle]."
 stewardship_duty_special.2001.c: "„Troufáte si mě obtěžovat takovými malichernostmi?!“"
 stewardship_duty_special.2011.t: "Urovnání: Spor o půdu"
 stewardship_duty_special.2011.desc: "Diskuse byla prudká už #EMP předtím#!, než se na stole objevily mapy.\n\n[vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName] před sebou mají vyobrazení svých panství a na obou je stejný brod zakreslen jako součást jejich území. Ani jedna strana nechce ustoupit ani o píď.\n\nJeště nikdy jsem neviděl kus pergamenu vyvolat tolik hněvu. Je jasné, že musíme stanovit novou hranici."
 stewardship_duty_special.2011.a: "Těchto jednání se ujmu osobně."
 stewardship_duty_special.2011.b: "[vassal_1.GetFirstNameNoTooltip] dostane náhradu za případnou ztrátu."
 stewardship_duty_special.2011.c: "[vassal_2.GetFirstNameNoTooltip] #EMP velmi#! stojí o správné a spravedlivé rozhodnutí z mé strany..."
 statecraft_mediation_debug_improve_contract: "Vylepšit vazalskou smlouvu s [vassal_2.GetTitledFirstName]"
 stewardship_duty_special.2012.t: "Urovnání: Rodinné spory"
 stewardship_duty_special.2012.desc: "Dnešní jednání mezi [vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName] nezačalo dobře.\n\n„Od chvíle, kdy ti připadl dědův štít—“\n„Zase ten štít? Vážně? Tady, u dvora [ROOT.Char.GetTitlePossessive]?!“"
 stewardship_duty_special.2012.a: "Rodina nás musí spojovat, ne rozdělovat."
 stewardship_duty_special.2012.a.success: "Moudrá slova"
 stewardship_duty_special.2012.a.failure: "Prázdná fráze"
 stewardship_duty_special.2012.b: "Ve vaší rodině očividně dřímá velikost."
 stewardship_duty_special.2012.c: "Rodinné spory umím urovnávat!"
 statecraft_sc_mediation_debug_add_dynasty_prestige: "#D Přidat věhlas#!"
 stewardship_duty_special.2012.c.major_progress: "Výrazně sblížíš znesvářené strany a podstatně zvýšíš šanci na příznivý výsledek"
 stewardship_duty_special.2013.t: "Urovnání: Právo na výběr daní"
 stewardship_duty_special.2013.desc: "[vassal_1.GetTitledFirstName] tvrdí, že [vassal_2.GetTitledFirstName] [Select_CString(vassal_1.IsFemale,'jí upírá její právo','mu upírá jeho právo')] vybírat daně.\n\n„Vůbec ne!“ protestuje [vassal_1.GetFirstName]. „Dotyčná rodina žije na mé straně hranice už po celé generace. Jediné pole na druhé straně ti nedává právo na celý desátek!“"
 stewardship_duty_special.2013.a: "Pokud se nedokážete dohodnout, desátek budu vybírat já jako [ROOT.Char.GetTitleAsNameNoTooltip]."
 stewardship_duty_special.2013.b: "Tady má přednost tradice."
 stewardship_duty_special.2013.c: "Daň náleží vlastníkovi půdy bez ohledu na to, kdo na ní žije."
 stewardship_duty_special.2014.t: "Urovnání: Zasnoubení"
 stewardship_duty_special.2014.desc: "„[betrothal_candidate.GetTitledFirstName] ([betrothal_candidate_lord.Custom2('RelationToMe', SCOPE.sC('betrothal_candidate'))]) má už dávno uzavřít sňatek s [vassal_1_betrothal_candidate.GetTitledFirstName] ([vassal_1.Custom2('RelationToMe', SCOPE.sC('vassal_1_betrothal_candidate'))]) —“ začne [vassal_1.GetTitledFirstName], ale podle očekávání do řeči vstoupí [vassal_2.GetTitledFirstName].\n\n„Od samého začátku přece platilo, že [betrothal_candidate.GetTitledFirstName] uzavře sňatek s [vassal_2_betrothal_candidate.GetTitledFirstName] ([vassal_2.Custom2('RelationToMe', SCOPE.sC('vassal_2_betrothal_candidate'))])!“"
 stewardship_duty_special.2014.a: "[betrothal_candidate.GetTitledFirstNameNoTooltip] uzavře sňatek s [vassal_1_betrothal_candidate.GetTitledFirstNameNoTooltip] ([vassal_1.Custom2('RelationToMe', SCOPE.sC('vassal_1_betrothal_candidate'))])."
 stewardship_duty_special.2014.b: "[betrothal_candidate.GetTitledFirstNameNoTooltip] uzavře sňatek s [vassal_2_betrothal_candidate.GetTitledFirstNameNoTooltip] ([vassal_2.Custom2('RelationToMe', SCOPE.sC('vassal_2_betrothal_candidate'))])."
 stewardship_duty_special.2014.c: "Tímhle hašteřením ztrácíte právo o tom rozhodovat!"
 stewardship_duty_special.2015.t: "Urovnání: Rozsudek"
 stewardship_duty_special.2015.desc: "„A co když [vassal_2.GetTitledFirstName] ukrýval známého zloděje!“ obviňuje [vassal_1.GetTitledFirstName].\n\n„[vassal_2.GetFaith.HighGodName]!“ Je zřejmé, že [vassal_2.GetFirstName] to neslyší poprvé. „Nemáš právo soudit mé poddané v mém vlastním panství!“\n\n„Jen proto, že se mu minule podařilo uprchnout—“\n\nJakmile zvednu ruku a připomenu jim svou přítomnost, rychle ztichnou."
 stewardship_duty_special.2015.a: "Zloděj bude popraven a tím bude otázka uzavřena."
 stewardship_duty_special.2015.b: "Pokud má [vassal_2.GetFirstNameNoTooltip] právo soudit, na ničem jiném nezáleží."
 stewardship_duty_special.2015.c: "Můj [ROOT.Char.GetCouncillor('councillor_chancellor').GetCouncilTitle] uspořádá s tímhle mizerným zlodějem soud."
 stewardship_duty_special.2018.t: "Urovnání: Koně"
 stewardship_duty_special.2018.desc: "[vassal_1.GetTitledFirstName] má dnes samozřejmě další stížnost. „[barony_1.GetNameNoTier] — zdejší chov koní je proslulý odnepaměti, ale teď je obchodníci z [barony_2.GetNameNoTier] prodávají, jako by je sami vyšlechtili! A ještě přímo v [barony_2.GetNameNoTier]!“\n\n[vassal_2.GetTitledFirstName] se ohradí. „Vždyť se tam #EMP skutečně#! chovají! Mají snad obchodníci o svém zboží lhát?“"
 stewardship_duty_special.2018.a: "Původ se přece musí respektovat."
 stewardship_duty_special.2018.b: "Ani [barony_1.GetNameNoTier], ani [barony_2.GetNameNoTier]. Jejich původ se bude uvádět jako [new_name.GetNameNoTier]!"
 stewardship_duty_special.2018.c: "Zdá se, že potřebujeme oficiální poplatek za kontrolu koní."
 stewardship_duty_special.2019.t: "Urovnání: Lom"
 stewardship_duty_special.2019.desc: "[vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName] už snad celé hodiny vypočítávají jednu křivdu za druhou.\n\n„...a pak je tu správce lomu na hranici, který odmítl platit daně kvůli listině s úlevou, kterou jsi mu vystavil #EMP ty#!!“\n„Cože?! Vždyť právě ty už jsi mu všechno sebral, když moji výběrčí—“\n\nKonečně oba zmlknou, když jim dojde, že je správce lomu obelstil."
 stewardship_duty_special.2019.a: "Chybějící daň se vybere a rozdělí rovným dílem."
 stewardship_duty_special.2019.b: "Oba si zasloužíte, že z vás udělal hlupáky!"
 stewardship_duty_special.2019.c: "Správce lomu bude popraven a lom vypálen."
 stewardship_duty_special.2019.d: "Tohle je zločin proti [ROOT.Char.GetTitleAsNameNoTooltip] a [ROOT.Char.GetTitleAsNameNoTooltip] se s ním také vypořádá!"
 stewardship_duty_special.2021.t: "Urovnání: Hostina"
 stewardship_duty_special.2021.desc: "[vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName] proti sobě mají všemožné výhrady, od závažných až po malicherné.\n\n„[uninvited.GetFirstName] [Select_CString(uninvited.IsFemale,'zakázala','zakázal')] svým držitelům půdy přijít na mou podzimní hostinu!“ stěžuje si [host.GetFirstName].\n\n„Samozřejmě. Nechci, aby si moji vazalové přinesli domů ještě víc blech.“"
 stewardship_duty_special.2021.a: "Jsou to vazalové [uninvited.GetFirstNameNoTooltip]. Ať poslechnou rozkazy."
 stewardship_duty_special.2021.b: "Nikomu by nikdy neměla být odepřena hostina!"
 stewardship_duty_special.2021.c: "Odteď máte oba #EMP povinnost#! chodit jeden druhému na hostiny!"
 stewardship_duty_special.2022.t: "Urovnání: Urážka"
 stewardship_duty_special.2022.desc: "„[insulter.GetTitledFirstName] strašlivě urazil člověka, který je pro tebe [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]!“ vyhrkne [insultee.GetTitledFirstName]. „Dokonce naznačil, že [spouse.GetTitledFirstName] sdílí lože s prasaty!“\n\n[insulter.GetFirstName] zachová klid. „Pravda někdy není zrovna lichotivá, [insultee.GetFirstName].“"
 stewardship_duty_special.2022.a: "To si žádá veřejnou omluvu!"
 stewardship_duty_special.2022.b: "Takové malicherné hádky jsou pod úroveň vás obou."
 stewardship_duty_special.2022.c: "Když se nad tím zamyslíte, nebyla to vlastně pochvala?"
 stewardship_duty_special.2025.t: "Urovnání: Příležitost"
 stewardship_duty_special.2025.desc: "[hooked_vassal.GetTitledFirstName] je v mé moci díky páce, kterou mám k dispozici. Ať už spor s [other_vassal.GetTitledFirstName] dopadne jakkoli, mohu požadovat, aby [hooked_vassal.GetFirstNameNoTooltip] všem vykládal[Select_CString(hooked_vassal.IsFemale,'a','')], jak spravedlivé a nestranné byly mé rozsudky."
 stewardship_duty_special.2025.a: "[hooked_vassal.GetFirstNameNoTooltip], #EMP přece jen#! pro mě můžeš něco udělat..."
 stewardship_duty_special.2025.b: "Takhle se spory urovnávat nemají."
 statecraft_mediation_progress_fairness: "[hooked_vassal.GetFirstNameNoTooltip] zdůrazňuje, jak spravedlivě rozhoduji, čímž výrazně zvyšuje mou šanci na příznivý výsledek"
 stewardship_duty_special.2026.t: "Urovnání: Konec"
 stewardship_duty_special.2026.desc: "Přivítají mě výkřiky a ruce potřísněné krví. Pohár konečně přetekl a [killer.GetTitledFirstName] stojí nad tělem [victim.GetTitledFirstName]. V ruce stále zůstává [killer.Custom('signature_weapon')].\n\n„Tohle je jediné spravedlivé urovnání, kterého bych se kdy dočkal[Select_CString(killer.IsFemale,'a','')].“"
 stewardship_duty_special.2026.a: "Cos to provedl[Select_CString(killer.IsFemale,'a','')]... Tohle si žádá oko za oko."
 stewardship_duty_special.2026.b: "Sám ses odsoudil k životu v temnotě."
 stewardship_duty_special.2026.c: "Vidím, že spor je tedy urovnán!"
 stewardship_duty_special.2027.t: "Urovnání: Rodina"
 stewardship_duty_special.2027.desc: "[vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName] se přou bez konce a podle všeho to trvá už celé generace.\n\nRodiče, prarodiče, vzdálení předkové... všichni se hádali kvůli tomu či onomu. Dá se tenhle řetězec vůbec přerušit?"
 stewardship_duty_special.2027.a: "Věhlasnější dynastie má větší význam."
 stewardship_duty_special.2027.b: "[lower_prestige.Custom('WomenMen')|U] — slavné jméno samo o sobě velikost nezaručí."
 stewardship_duty_special.2027.c: "Naše panství stojí na mnoha velkých dynastiích."
 statecraft_mediation_favor_higher_prestige: "[higher_prestige.GetTitledFirstName] bude tímto rozhodnutím [Select_CString(higher_prestige.IsFemale,'zvýhodněna','zvýhodněn')]"
 statecraft_mediation_favor_lower_prestige: "[lower_prestige.GetTitledFirstName] bude tímto rozhodnutím [Select_CString(lower_prestige.IsFemale,'zvýhodněna','zvýhodněn')]"
 stewardship_duty_special.2071.t: "Urovnání: Nové začátky"
 stewardship_duty_special.2071.desc: "Byl to vyčerpávající proces, ale [vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName] už po sobě neustále nejdou.\n\nZe dvora nejen odcházejí s vyřešenými spory, ale dokonce jako noví přátelé."
 stewardship_duty_special.2071.a: "Jestli jsem kdy viděl zázrak, pak je to tenhle."
 stewardship_duty_special.2072.desc: "Když [vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName] konečně opouštějí můj dvůr, není už mezi nimi ani stopa po nenávisti a jedovatosti, s nimiž přišli. Uvidíme, jak dlouho to vydrží, ale díky mému úsilí k sobě nyní chovají nový respekt."
 stewardship_duty_special.2072.a: "To rozhodně nebyl malý úspěch!"
 stewardship_duty_special.2073.t: "Urovnání: Nadržování"
 stewardship_duty_special.2073.desc: "„Tohle přece nikdy nemělo být spravedlivé urovnání, že?!“ [accuser.GetTitledFirstName] rozčileně vyráží z audienční síně. „To nadržování je odporné!“\n\n[favorite.GetTitledFirstName] odpoví klidně. „S tím nesouhlasím, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 stewardship_duty_special.2073.a: "Ale ať si ten nevděčník jde."
 stewardship_duty_special.2074.t: "Urovnání: Stále nepřátelé"
 stewardship_duty_special.2074.desc: "Když [vassal_1.GetTitledFirstName] a [vassal_2.GetTitledFirstName] přišli, nevěřil jsem, že by mezi nimi mohlo být ještě víc nenávisti a zášti. Jejich odchod mě přesvědčil, jak moc jsem se mýlil."
 stewardship_duty_special.2074.a: "Mé usmiřování mohlo dopadnout lépe."
 stewardship_duty_special.2081.t: "Urovnání: Konec"
 stewardship_duty_special.2081.both_dead: "[vassal_1.GetTitledFirstName] i [vassal_2.GetTitledFirstName] jsou po smrti. Jejich malicherné spory teď působí vzdáleně, bezvýznamně a nicotně."
 stewardship_duty_special.2081.vassal_1: "[vassal_1.GetTitledFirstName] už nežije. Hádky a spory, které vedli [vassal_1.GetFirstNameNoTooltip] a [vassal_2.GetTitledFirstName], teď působí malicherně a bezvýznamně."
 stewardship_duty_special.2081.vassal_2: "[vassal_2.GetTitledFirstName] už nežije. Hádky a spory, které vedli [vassal_2.GetFirstNameNoTooltip] a [vassal_1.GetTitledFirstName], teď působí malicherně a bezvýznamně."
 stewardship_duty_special.2081.a: "Časem jdeme dál."
 stewardship_duty_special.2081.tt: "Mé úsilí o usmíření končí."
 stewardship_duty_special.2082.t: "Urovnání: Konec"
 stewardship_duty_special.2082.desc: "[prisoner.GetTitledFirstName] je teď za mřížemi a spor, který vedli [prisoner.GetFirstNameNoTooltip] a [other.GetTitledFirstName], najednou působí mnohem méně důležitě."
 stewardship_duty_special.2082.a: "Každý nakonec najde způsob, jak svůj spor urovnat."
