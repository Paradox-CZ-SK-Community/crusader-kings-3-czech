l_polish:
 stewardship_lifestyle_rank_up_indication: "Můžeš získat [Concept('perk','talent')|E] [Concept('stewardship_lifestyle','správcovského životního stylu')|E]"
 stewardship_general.1054.t: "Obvinění: [witch.Custom('MagicPracticeTerm')|U]"
 stewardship_general.1054.desc: "Krvavé kusy látky... havraní pera... podivně páchnoucí odvary. Takové důkazy mi předkládá skupina vesničanů z [target_county.GetNameNoTier]. Tvrdí, že [witch.GetFirstName] ve své chýši na okraji vsi provozuje podivné praktiky — [witch.Custom('MagicPracticeTerm')].\n\n[witch.Custom('MagicSuperstitionTerm')|U] je podle vesničanů důsledkem zlých činů [witch.GetFirstNameNoTooltip], a proto žádají trest smrti."
 stewardship_general.1054.a: "Tyhle „důkazy“ jsou jen nepřímé. Ať [witch.GetFirstNameNoTooltip] odejde na svobodu."
 stewardship_general.1054.b: "Ať [witch.GetFirstNameNoTooltip] shoří! Takové zločiny urážejí samotné božstvo — [ROOT.Char.GetFaith.HighGodName]!"
 stewardship_general.1054.c: "[witch.Custom('MagicUserTerm')|U], říkáte? Někdo takový by se mi jako poradce hodil."
 stewardship_general.1054.d: "Ať [witch.GetFirstNameNoTooltip] čeká okázalá poprava..."
 stewardship_general.1054.d.flavor: "...ale ve skutečnosti se [witch.GetFirstNameNoTooltip] tajně vrátí na můj dvůr!"
 stewardship_general.2001.t: "Čich na zisk"
 stewardship_general.2001.desc_intro: "Při poklidné procházce mě mezi obvyklým ruchem ulice zaujme volání jednoho obchodníka.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Mám tu znamenitý výběr zboží, pokud máte dost mincí...“"
 stewardship_general.2001.desc: "\n\nObchodníkův stánek doslova přetéká cetkami a všemožnými drobnostmi."
 stewardship_general.2001.desc_high_skill: "$stewardship_general.2001.desc$ Díky zkušenostem s kvalitním zbožím mi v té záplavě cetek padne do oka několik zajímavých kousků."
 stewardship_general.2001.desc_steward: "\n\nKdyž si prohlížím nepřeberné množství zboží na stánku, slyším [helpful_councillor.GetShortUIName], jak si mumlá: „Rytiny na tomhle kousku musí být pravé... a navíc docela cenné!“ Pak na mě pohlédne s vítězoslavným úsměvem."
 stewardship_general.2001.desc_chaplain: "\n\nVedle mě [helpful_councillor.GetShortUIName] náhle ztuhne, nakloní hlavu a upřeně hledí na cosi v obchodníkově stánku. Pak se ke mně nakloní a šeptem se svěří: „Tahle ‚cetka‘ támhle je očividně posvátná relikvie z dávných časů. Bylo by moudré ji získat.“"
 stewardship_general_2001_success_msg.t: "Úspěšné smlouvání"
 stewardship_general_2001_failure_msg.t: "Neúspěšné smlouvání"
 stewardship_general_2001_free_msg.desc: "Tvé smlouvání bylo vynikající"
 stewardship_general_2001_tiny_msg.desc: "Tvé smlouvání bylo obstojné"
 stewardship_general_2001_minor_msg.desc: "Tvé smlouvání bylo slabé"
 stewardship_general_2001_expensive_msg.desc: "Obchodník tě přelstil"
 stewardship_general.2001.free: "Vyjednáš skutečně výhodnou cenu"
 stewardship_general.2001.tiny_cost: "Vyjednáváš obstojně"
 stewardship_general.2001.minor_cost: "Tohle nebyl zrovna výhodný obchod"
 stewardship_general.2001.expensive_cost: "Obchodník tě přelstil"
 stewardship_haggle_cheap_trinket_tt: "Rozhodneš se pro levnou cetku"
 stewardship_haggle_expensive_trinket_tt: "Rozhodneš se pro drahou cetku"
 stewardship_haggle_helpful_trinket_tt: "Rozhodneš se pro doporučenou cetku"
 stewardship_general.2001.a: "Cítím, že mám štěstí."
 stewardship_general.2001.a.ignore_help: "Tenhle kousek by mohl být za hubičku."
 stewardship_general.2001.b: "Zpracování téhle cetky mě zaujalo."
 stewardship_general.2001.b.ignore_help: "Myslím, že tenhle kousek vynese víc."
 stewardship_general.2001.c.steward: "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('helpful_councillor'))|U] [helpful_councillor.GetFirstNameNoTooltip] se v tomhle vyzná lépe než já."
 stewardship_general.2001.c.chaplain: "[helpful_councillor.GetFirstNameNoTooltip] má v tomhle pravdu."
 stewardship_general.2001.d: "Pojďme dál."
 stewardship_general.2001.d.irritable: "Říkám #EMP ne#!. A teď zmiz, než tě #EMP nechám vyvést!#!"
 stewardship_general.2001.tt: "Získána cetka"
 stewardship_general.2002.t: "Působivá ukázka"
 stewardship_general.2002.t_insulting: "Urážlivá ukázka"
 stewardship_general.2002.desc.intro: "Jakmile mineme další dva stánky, "
 stewardship_general.2002.desc_impressed: "[helpful_councillor.GetTitledFirstNameNoTooltip] se na mě rozzáří.\n\n„Ano, to bylo opravdu povedené! Lépe by to snad ani nešlo.“\n\n[helpful_councillor.GetTitledFirstNameNoTooltip] ledabyle přejede pohledem cetky ve vedlejším stánku a pak po mně hodí očekávavým pohledem."
 stewardship_general.2002.desc_very_impressed: "[helpful_councillor.GetTitledFirstNameNoTooltip] mě nadšeně zatahá za rukáv.\n\n„[ROOT.Char.GetFaith.HighGodName]! To byla nádherná podívaná! Taková výřečnost! Člověk sotva stačil sledovat ten neustálý příval medových slov v tom #EMP tanci#! smlouvání.“\n\n[helpful_councillor.GetTitledFirstNameNoTooltip] na mě hledí s úžasem a obdivem."
 stewardship_general.2002.desc_insulted: "[helpful_councillor.GetTitledFirstNameNoTooltip] se na mě podívá nesouhlasně.\n\n„To byla... rozhodně zajímavá podívaná. Nejsem si úplně [Select_CString(helpful_councillor.IsFemale,'jistá','jistý')], čeho jsme chtěli dosáhnout, [ROOT.Char.Custom('FormOfAddressForLiege')], ale druhá strana si určitě přišla na své...“\n\n[helpful_councillor.GetTitledFirstNameNoTooltip] vykročí napřed a tím náš rozhovor končí."
 stewardship_general.2002.desc_very_insulted: "[helpful_councillor.GetTitledFirstNameNoTooltip] si pohrdavě odfrkne.\n\n„Někdo méně bystrý by mohl tvrdit, že [bought_trinket.GetName] si své označení sotva zaslouží. Ale #EMP já jsem si [Select_CString(helpful_councillor.IsFemale,'jistá','jistý')]#!, že jsme se rozhodli správně...“\n\nJe naprosto zřejmé, že [helpful_councillor.GetTitledFirstNameNoTooltip] není z mého předchozího vystoupení [Select_CString(helpful_councillor.IsFemale,'nadšená','nadšený')]."
 stewardship_general.2002.a.high_stewardship: "Možná bych tě [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] naučit pár triků."
 stewardship_general.2002.mentor_success: "Celou noc vzpomínáš na nejjemnější detaily smlouvání"
 stewardship_general.2002.mentor_failure: "[helpful_councillor.GetTitledFirstNameNoTooltip] se nenechá úplně přesvědčit"
 stewardship_general.2002.impressed: "To bylo povedené smlouvání, že?"
 stewardship_general.2002.b.high_stewardship: "Byla to jen zkouška. #EMP Já#! jsem [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')], co jsem [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')]."
 stewardship_general.2002.convince_success: "Ovšem, [bought_trinket.GetName] je mnohem lepší investice, protože..."
 stewardship_general.2002.convince_failure: "$stewardship_general.2002.mentor_failure$"
 stewardship_general.2002.t_success: "Úspěšné přesvědčování"
 stewardship_general.2002.t_failure: "Neúspěšné přesvědčování"
 stewardship_general.2002.insulted: "Co se stalo, stalo se."
 stewardship_general.5011.t: "Kapři"
 stewardship_general.5011.desc: "„Pokud máte zájem o kapří rybník, postavím vám nádherný, [ROOT.Char.Custom('FormOfAddressForLiege')]!“\n\nČlověk, který přede mnou stojí, má dobré reference a moji dvořané jsou tou představou očividně nadšení..."
 stewardship_general.5011.a: "Dostaneš všechny prostředky, které budeš potřebovat!"
 stewardship_general.5011.b: "Je to #EMP opravdu#! ta nejlepší nabídka, jakou mi můžeš dát?"
 stewardship_general.5011.b.message_1: "Vyjednáš skvělou cenu"
 stewardship_general.5011.b.message_2: "Stavitel tě přelstí"
 stewardship_general.5011.c: "Přestaň plýtvat mým časem!"
 stewardship_general.5011.every_courtier: "Každý [Concept('courtier','dvořan')|E]"
 stewardship_general.5013.t: "Bestie z hlubin"
 stewardship_general.5013.desc: "Při procházce zahradami si všimnu, že [carp_food.GetTitledFirstName] ([ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('carp_food'))]) sedí na kameni u kapřího rybníka. Nakloní se nad okraj a prsty čeří vodu. Pod hladinou se pohne stín..."
 stewardship_general.5013.a: "[carp_food.GetFirstNameNoTooltip], ustup! Pryč od... NÉÉÉ!"
 stewardship_general.5041.t: "[Select_CString(servant_character.IsFemale,'Ničemná služka','Ničemný sluha')]"
 stewardship_general.5041.desc: "[servant_character.Custom('lowly_servant_type')|U] krade z místa, které je [ROOT.Char.Custom('GetCourt')]!"
 stewardship_general.5041.desc_highgod: "[servant_character.GetWomanMan|U] se přede mnou krčí, fňuká cosi o hladovějících dětech a dovolává se milosrdenství ve jménu božstva [ROOT.Char.GetFaith.HouseholdGodName]."
 stewardship_general.5041.desc_other: "[servant_character.GetWomanMan|U] se přede mnou krčí, fňuká cosi o hladovějících dětech a prosí o milosrdenství."
 stewardship_general.5041.desc_ending: "\n\n„Prosím, [ROOT.Char.GetLadyLord], udělám cokoli, oč požádáte!“"
 stewardship_general.5041.a: "Ať [servant_character.GetFirstNameNoTooltip] pozná, co je skutečný hlad."
 stewardship_general.5041.b: "Ať [servant_character.GetFirstNameNoTooltip] skončí ve vězení."
 stewardship_general.5041.c: "Prokážu milosrdenství a získám věrnost [servant_character.GetFirstNameNoTooltip]."
