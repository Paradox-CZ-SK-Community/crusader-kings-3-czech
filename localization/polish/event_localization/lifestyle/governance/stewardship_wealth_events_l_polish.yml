l_polish:
 stewardship_wealth.1001.t: "Na mizině!"
 stewardship_wealth.1001.desc: "Má pokladnice je prázdná a spižírna zeje prázdnotou. Dokonce i krysy už byly prodány na pokrytí mých výdajů, a přesto stále nedokážu splatit všechny své dluhy!\n\nJak se z téhle situace vůbec dostanu?"
 stewardship_wealth.1001.a: "Důkladně projdu účetní knihy. Něco tam být musí!"
 stewardship_wealth.1001.a.success: "Objevím několik přehlédnutých dluhů, které mohu vymáhat"
 stewardship_wealth.1001.a.failure: "Nenajdu nic, co by mi mohlo pomoci"
 stewardship_wealth.1001.b.havehook: "Vyberu si laskavost, kterou mi [wealthy_vassal.GetTitledFirstNameNoTooltip] dluží."
 stewardship_wealth.1001.b.givehook: "Pokud mi [wealthy_vassal.GetTitledFirstNameNoTooltip] pomůže, budu na oplátku dlužit laskavost."
 stewardship_wealth.1001.c: "Budu od svých vazalů požadovat mimořádný tribut!"
 stewardship_wealth.1001.c.tt: "Každý vazal:"
 stewardship_wealth.1001.d: "Zabavím náboženský majetek a získám potřebné prostředky."
 stewardship_wealth.1001.e: "Utáhnu si opasek a ušetřím, co se dá."
 stewardship_wealth.1011.t: "Ražba nových mincí"
 stewardship_wealth.1011.desc: "Je mým právem i povinností určovat, jaké mince se budou používat v celém území [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nMá rozhodnutí určí, jak bude ve světě vnímána zdejší měna — a spolu s ní i mé panství."
 stewardship_wealth.1011.a: "Budu razit stříbrné mince na podporu obchodu."
 stewardship_wealth.1011.b: "Budu razit zlaté mince s vlastní podobiznou!"
 stewardship_wealth.1011.c: "Znehodnotím mince levným niklem."
 stewardship_wealth.1011.c.success: "Na ražbě znehodnocených mincí ušetřím celé jmění"
 stewardship_wealth.1011.c.failure: "Všichni zjistí, jak laciné nové mince ve skutečnosti jsou"
 stewardship_wealth.1011.custom: "Každé hrabství v [THIS.Char.GetPrimaryTitle.GetName]"
 stewardship_wealth.1021.t: "Placení války"
 stewardship_wealth.1021.desc: "Války jsou drahé a [current_war.GetName] není výjimkou.\n\nMá pokladnice se rychle vyprazdňuje a musím vymyslet, jak zaplatit vojsko, aby mohlo dál bojovat."
 stewardship_wealth.1021.a: "Vyberu od rolníků dodatečné daně."
 stewardship_wealth.1021.a.custom: "Každé [Concept('county','hrabství')|E] v mé [Concept('domain','doméně')|E]"
 stewardship_wealth.1021.b: "Omezím nepodstatné vojenské výdaje."
 stewardship_wealth.1021.b.success: "Zefektivním vojenský rozpočet"
 stewardship_wealth.1021.b.failure: "Omylem seškrtám nezbytné vojenské výdaje"
 stewardship_wealth.1021.c: "Nakonec se to nějak vyřeší. Vždycky se to nějak vyřeší."
 stewardship_wealth.1021.c.tt: "Válka přinese mnoho příležitostí..."
 stewardship_wealth.1022.t: "Posvátné plenění"
 stewardship_wealth.1022.desc: "[church_burner.GetName] mi slouží jako [GetPlayer.Custom( 'KnightCultureNoTooltipLowercase' )] a přichází s nadšenou zprávou od svého doprovodu:\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], po vašem moudrém rozhodnutí ponechat financování války na našem uvážení jsme se pustili do nejvýnosnějšího plenění všech dob — přímo v [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier]! Odehnali jsme desítky ovcí, nakradli stovky cetek a dokonce jsme vypálili celé posvátné místo: [ROOT.Char.GetFaith.HouseOfWorship]! Uvnitř zaživa uhořelo tisíc lidí!“"
 stewardship_wealth.1022.a: "Naše pokladnice tuhle vzpruhu potřebovala... ale příště se tomu raději vyhněte."
 stewardship_wealth.1022.b: "Nenechám ze sebe udělat řezníka! Tohle půjde na odškodnění."
 stewardship_wealth.1022.c: "Dobrá práce! Budeme si dál dělat, co se nám zlíbí."
 stewardship_wealth.1051.t: "Nečekané štěstí"
 stewardship_wealth.1051.desc: "[freeman.GetFirstName] patří mezi svobodné nájemce a pronajímá si část mé půdy v [target_county.GetNameNoTier]. Díky pečlivému plánování se letos podařila mimořádná úroda.\n\nNyní chce část zisku použít na odkoupení kusu mé půdy, aby [Select_CString(freeman.IsFemale,'mohla','mohl')] letošního úspěchu využít a příští rok vypěstovat ještě více plodin."
 stewardship_wealth.1051.a: "Na hospodaření zapomeň. Někdo jako ty patří na můj dvůr!"
 stewardship_wealth.1051.a.arrogant: "Vzdělanost mezi rolníky? Jak neobvyklé! #EMP Musíš#! vstoupit na můj dvůr!"
 stewardship_wealth.1051.b: "Když zaplatíš tvrdou mincí, půda je tvoje."
 stewardship_wealth.1051.d: "Půda v [target_county.GetNameNoTierNoTooltip] patří mně a nikomu jinému!"
 stewardship_wealth.1061.t: "Nové příležitosti"
 stewardship_wealth.1061.desc: "[ROOT.Char.Custom('GetRealmOrDomicile')|U] vyžaduje každodenní správu a při ní se přede mnou otevřelo hned několik různých příležitostí.\n\nKaždá z nich skrývá velký potenciál, ale reálně se mohu věnovat jen jedné — musím určit, která mi nakonec přinese největší užitek."
 stewardship_wealth.1061.a: "[Select_CString(ROOT.Char.IsFemale,'Doslechla jsem se','Doslechl jsem se')] o znovuobjeveném ztraceném svazku."
 stewardship_wealth.1061.a.success: "Ztracený svazek obsahuje nesmírné množství vědomostí"
 stewardship_wealth.1061.a.success.good: "Získáš velmi dobrý knižní [Concept('artifact','artefakt')|E]"
 stewardship_wealth.1061.a.failure: "Ztracený svazek byl jen starou účetní knihou"
 stewardship_wealth.1061.a.success.bad: "Získáš nezajímavý starý knižní [Concept('artifact','artefakt')|E]"
 stewardship_wealth.1061.b: "Pomoc se správou držav by se [vassal.GetTitledFirstNameNoTooltip] jistě hodila."
 stewardship_wealth.1061.c: "Zajištění těchto obchodních dohod naplní mou pokladnici."
 stewardship_wealth.5001.t: "Živý dobytek"
 stewardship_wealth.5001.desc: "Jako dodatečnou platbu z nedávného obchodu jsem [Select_CString(ROOT.Char.IsFemale,'získala','získal')] velké stádo dobytka.\n\n[Select_CString(ROOT.Char.IsFemale,'Byla jsem ujištěna','Byl jsem ujištěn')], že zvířata jsou prvotřídní kvality, ale otázkou zůstává, co s nimi udělat."
 stewardship_wealth.5001.a: "[capital.GetNameNoTierNoTooltip] bude díky stádu vzkvétat."
 stewardship_wealth.5001.b: "Je to krásné stádo, ale mohlo by být ještě větší..."
 stewardship_wealth.5001.b.message_1: "Můj chovný projekt je úspěšný"
 stewardship_wealth.5001.b.message_2: "Můj chovný projekt selže"
 stewardship_wealth.5001.c: "Kůže vynesou pěkný zisk. Přineste sekáček!"
 stewardship_wealth.5002.t: "Dobrá rada"
 stewardship_wealth.5002.start.desc: "Procházím se mezi tržištními stánky v [capital.GetNameNoTooltip] a u pasu mě tíží naditý měšec. Jak tyhle mince nejlépe zhodnotit?\n\nKdyž obdivuji zboží místního "
 stewardship_wealth.5002.safe_smithy.desc: "kováře — kvalitní ocel,"
 stewardship_wealth.5002.safe_mason.desc: "kameníka — dokonalé tvary,"
 stewardship_wealth.5002.safe_religious_sculptor.desc: "sochaře — [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] motivy,"
 stewardship_wealth.5002.safe_jeweler.desc: "klenotníka — nádherné filigrány,"
 stewardship_wealth.5002.middle.desc: "to vypadá jako rozumná investice — když se vedle mě náhle objeví [investor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)].\n\n„Smím poradit, [ROOT.Char.Custom2('RelationToMeAddress', investor)]? Podívej se na"
 stewardship_wealth.5002.risky_smithy.desc: "kovárnu"
 stewardship_wealth.5002.risky_mason.desc: "kamenickou dílnu"
 stewardship_wealth.5002.risky_religious_sculptor.desc: "sochařský stánek"
 stewardship_wealth.5002.risky_jeweler.desc: "klenotnický stánek"
 stewardship_wealth.5002.end.desc: " támhle. Jejich zboží možná vypadá prostě, ale skrývá velký potenciál.“"
 stewardship_wealth.5002.b.success: "S [investor.GetFirstNameNoTooltip] nás sblíží výborná investice"
 stewardship_wealth.5002.b.failure: "Má investice selže"
 stewardship_wealth.5002.b.failure.tt: "Přijdeš o investované peníze"
 stewardship_wealth.5002.a.smithy: "Investuji do kovárny."
 stewardship_wealth.5002.a.tavern: "Investuji do hostince."
 stewardship_wealth.5002.a.mason: "Investuji do kamenické dílny."
 stewardship_wealth.5002.a.religious_sculptor: "Investuji do sochařské dílny."
 stewardship_wealth.5002.a.jeweler: "Investuji do klenotnické dílny."
 stewardship_wealth.5002.c: "Chytrými obchody rychle vydělám."
 stewardship_wealth.6001.t: "Stánek u cesty"
 stewardship_wealth.6001.desc: "Putování mě zavede do kraje jménem [stall_county.GetName]. Zdejší krajinu tvoří [stall_county.Custom('TerrainTypeCountyScope')] a u cesty si všimnu nuzně vyhlížejícího stánku.\n\nJakmile se zastavím, [Select_CString(stall_owner.IsFemale,'rolnice jménem','rolník jménem')] [stall_owner.GetFirstName] hned ožije a začne mi nabízet drobné řezby znázorňující [stall_owner.GetFaith.ReligiousSymbol].\n\n„Vyrábím je vlastníma rukama, [ROOT.Char.Custom('FormOfAddressForLiege')], každá mi zabere celé hodiny práce.“"
 stewardship_wealth.6001.a: "Jednu si koupím."
 stewardship_wealth.6001.a.tt_high: "Získáš kvalitní řezbu"
 stewardship_wealth.6001.a.tt_low: "Získáš nekvalitní řezbu"
 stewardship_wealth.6001.b: "Pochybuji, že tenhle stánek platí daně. Rozbijte ho!"
 stewardship_wealth.6001.c: "Promluvím si s [stall_owner.GetFirstNameNoTooltip] a třeba se něco přiučím o prodeji."
 small_religious_carving: "Drobná náboženská řezba"
 small_religious_carving_desc: "Drobná, ale pečlivě vyřezaná cetka znázorňující [stall_owner.GetFaith.ReligiousSymbol], [stall_owner.GetFaith.GetReligion.GetAdjectiveNoTooltip|l] symbol. I přes své malé rozměry je plná jemných detailů."
 stewardship_wealth.7000.t: "Svévolná správa"
 stewardship_wealth.7000.desc: "[enforcer.GetTitledFirstName], $knight_culture_player_no_tooltip_lowercase$ v mých službách, přede mě s okázalým sebeuspokojením hodí naditý pytel.\n\n„Jen se podívejte.“\n\nVysypu obsah pytle: drahé kovy, rodinné cennosti, cetky.\n\n„Poddaní, kterým vládne [victim.GetTitledFirstName], se nechali #EMP přesvědčit#!,“ usměje se [enforcer.GetFirstNameNoTooltip]. „Jejich daně měly přece připadnout vám.“\n\nTohle je slušná kořist! A ještě lepší je představa, jak se [victim.GetTitleAsNameNoTooltip] zatváří, až se o tom dozví."
 stewardship_wealth.7000.a: "[victim.Custom2('InsultAdjective', ROOT.Char)|U] [victim.GetFirstNameNoTooltip], běda ti!"
 stewardship_wealth.7000.b: "Tenhle výběr dokážu obhájit."
 stewardship_wealth.7000.b.tt: "Svalit vinu na jiné, zamotat pravdu, něco málo vrátit: cokoli, co otupí obvinění z tyranie"
 stewardship_wealth.7000.c: "Vezmi si to bohatství. A sežeň mi další."
 stewardship_wealth.7000.c.tt: "[victim.GetFirstNameNoTooltip] bude další na řadě; na obě panství vypustíš ty nejlepší vymahače, jaké potřebuje [ROOT.Char.GetTitleAsNameNoTooltip]!"
 stewardship_wealth.7000.d: "Bohužel... kradené zboží by se mělo vrátit."
 stewardship_wealth.7000.d.tt: "Pomsta je špatná a tak dále..."
 stewardship_wealth.7001.t: "Přes všechny meze"
 stewardship_wealth.7001.desc: "K čertu! [thieving_rival.GetTitledFirstName] a zlodějští pohůnci zase úřadují! [messenger.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('messenger'))] — mi koktavě sděluje, že ti darebáci měli tu drzost donutit prostý lid v [ROOT.Char.GetCapitalLocation.GetName] odevzdat majetek, který měl připadnout mně!\n\n[messenger.GetFirstNameNoTooltip] už má mé úředníky připravené k výběru obvyklých dávek... ale před očima už vidím naříkající vdovy, hladovějící děti a chudé rodiny vyháněné z domovů.\n\nTisícky kleteb! [thieving_rival.GetTitledFirstNameNoTooltip] má duši prolezlou chamtivostí!"
 stewardship_wealth.7001.tt.crime_alert: "[victim.GetTitledFirstName] si to zapamatuje"
 stewardship_wealth.7001.justification: "[thieving_rival.GetTitledFirstName|U] šíří chabé lži o tom, že jako [Select_CString(thieving_rival.IsFemale,'má lenní paní','můj lenní pán')] má na ty peníze právo. Já ale dobře vím, komu patří..."
 stewardship_wealth.7001.unleashed_knights: "[thieving_rival.GetTitledFirstName|U] a zlodějští pohůnci získávají den ode dne horší pověst..."
 stewardship_wealth.7001.a: "Trvám na svém právu dostat zaplaceno."
 stewardship_wealth.7001.a.tt: "Pošli své vymahače do vesnic!"
 stewardship_wealth.7001.b: "Můj lid nebude pykat za mé osobní spory."
 stewardship_wealth.7001.b.tt: "Lidé, které [thieving_rival.GetFirstNameNoTooltip] [Select_CString(thieving_rival.IsFemale,'připravila','připravil')] o majetek, budou osvobozeni od daní"
 stewardship_wealth.2000.t: "Zvažování příležitostí"
 stewardship_wealth.2000.desc: "Procházím ulicemi [loc_capital_county.GetNameNoTier] a hledám způsob, jak napravit poněkud prázdnou pokladnici. Doprovází mě [loc_steward.GetFirstName] — [ROOT.GetCouncillorPosition( 'councillor_steward' ).GetPositionName]. Když dorazíme k tržní vážnici, [loc_steward.GetFirstName] ztiší hlas:\n\n„Příjmy by šlo nenápadně zvýšit trochou... #EMP vynalézavosti#! při vybírání daní ze zdejšího zboží. Mohu nechat připravit druhou sadu závaží. Budou vypadat úplně stejně, jen jejich hmotnost bude nepatrně jiná. Obchodníci pak za stejné zboží zaplatí víc! Nikdo nic nepozná!\n\nStačí říct a závaží vyměníme. Pak už jen budeme sledovat, jak vám mince proudí do pokladnice!“"
 stewardship_wealth.2000.a: "Ještě dnes v noci závaží vyměníme."
 stewardship_wealth.2000.a.tt.success: "Vyměníš závaží, aniž si toho někdo všimne"
 stewardship_wealth.2000.a.tt.failure: "Tvůj podvod je odhalen"
 stewardship_wealth.2000.b: "Potřebujeme skutečně lepší sadu závaží."
 stewardship_wealth.2000.b.tt: "Nebude snadné najít řešení, které prospěje tvé pokladnici i obchodníkům, ale rozhodně je to možné."
 stewardship_wealth.2000.b.tt.success: "Úspěšně zavedeš nový systém vážení"
 stewardship_wealth.2000.b.tt.failure: "Nový systém vážení má k ideálu daleko"
 stewardship_wealth.2000.c: "Vezmu si, co mi náleží, postaru!"
 stewardship_wealth.2000.c.tt: "Přímo přinutíš místní obchodníky platit víc za výsadu vozit své zboží přes toto hrabství."
