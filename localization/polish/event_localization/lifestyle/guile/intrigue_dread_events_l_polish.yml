 intrigue_position_is_safe_opinion: "Ujištění, že má pozice je v bezpečí"
 intrigue_dread.2301.t: "Ukaž jim, kdo jsi"
 intrigue_dread.2301.desc.a: "„Jaké máme štěstí! [ROOT.Char.Custom('GetCourtOwner')|U] má tak laskavé srdce, tolik mírnosti a nevinnosti!“ [smirking_courtier.GetNamePossessive] posměšná tvář mi vytane před očima. „Jsme požehnáni, že můžeme žít v [ROOT.Char.Custom('GetCourt')] beze strachu!“"
 intrigue_dread.2301.desc.b: "„Jaké máme štěstí! [ROOT.Char.Custom('GetCourtOwner')|U] oplývá takovou upřímností a ryzostí, že snad ani nedokáže klamat!“ [smirking_courtier.GetNamePossessive] posměšná tvář mi vytane před očima. „Jsme požehnáni, že můžeme žít v [ROOT.Char.Custom('GetCourt')] beze strachu!“"
 intrigue_dread.2301.desc.c: "„Jaké máme štěstí! [ROOT.Char.Custom('GetCourtOwner')|U] má tolik skromnosti a pokory a nic od nás nežádá!“ [smirking_courtier.GetNamePossessive] posměšná tvář mi vytane před očima. „Jsme požehnáni, že můžeme žít v [ROOT.Char.Custom('GetCourt')] beze strachu!“"
 intrigue_dread.2301.desc.d: "„Jaké máme štěstí! [ROOT.Char.Custom('GetCourtOwner')|U] tak svědomitě ctí zákony!“ [smirking_courtier.GetNamePossessive] posměšná tvář mi vytane před očima. „Jsme požehnáni, že můžeme žít v [ROOT.Char.Custom('GetCourt')] beze strachu!“"
 intrigue_dread.2301.desc.e: "„Jaké máme štěstí! [ROOT.Char.Custom('GetCourtOwner')|U] o nás tak dobře pečuje, že se nikdy nemusíme obávat špatného zacházení!“ [smirking_courtier.GetNamePossessive] posměšná tvář mi vytane před očima. „Jsme požehnáni, že můžeme žít v [ROOT.Char.Custom('GetCourt')] beze strachu!“"
 intrigue_dread.2301.desc.outro: "\n\nZa [smirking_courtier.GetFirstNameNoTooltip] se [ROOT.Char.Custom('GetCourt')] otřásá smíchem a jásotem. Tihle lidé se mě nebojí. Neváží si mě. Neznají mě. Ukážu jim, kdo skutečně jsem."
 intrigue_dread.2301.a: "Bodni [smirking_courtier.GetFirstNameNoTooltip] do krku."
 intrigue_dread.2301.b: "Nech [smirking_courtier.GetFirstNameNoTooltip] odv léct do [ROOT.Char.Custom('GetDungeon')]."
 intrigue_dread.2301.c: "Usměj se, zasměj se a naplánuj pomstu."
 intrigue_dread.2301.d: "[smirking_courtier.GetFirstNameNoTooltip] v noci zemře. Ať si lámou hlavu proč."
 intrigue_show_them_all_modifier: "Plánovaná ukázka síly"
 intrigue_dread.2401.t: "Popravy by mohly být lepší"
 intrigue_dread.2401.desc: "Odsouzený zloděj sebou na konci provazu škubne a pak znehybní. Dav poddaných souhlasně zamručí a začne se rozcházet.\n\nAle kde je jásot, sténání, hrůza? Veřejné popravy v [execution_county.GetName] bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] vylepšit jedinou prostou změnou..."
 intrigue_dread.2401.a: "Víc. Mnohem. Víc."
