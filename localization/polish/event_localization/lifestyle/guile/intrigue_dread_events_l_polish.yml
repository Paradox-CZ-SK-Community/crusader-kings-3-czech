l_polish:
 intrigue_dread_special.1101.t: "V hlavní roli"
 intrigue_dread_special.1101.desc: "Nejdřív dva koně s honosnými uzdami a péry, za nimi vůz naložený truhlami a lidmi.\n\nNetrvá dlouho a mně i mé družině zastoupí cestu kočovná divadelní společnost, samé pestré šaty a čilý ruch.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ zavolá z projíždějícího vozu postarší [ROOT.Char.Custom('RandomWomanMan')|l]. „Vidím ten zasněný pohled. Co kdybys s námi [Select_CString(ROOT.Char.IsFemale,'vystoupila','vystoupil')] v představení?“"
 intrigue_dread_special.1101.a.a: "Zahraju [Select_CString(ROOT.Char.IsFemale,'chamtivou děvečku','chamtivého čeledína')]!"
 intrigue_dread_special.1101.a.b: "Zahraju [Select_CString(ROOT.Char.IsFemale,'starou manželku','starého manžela')]!"
 intrigue_dread_special.1101.a.c: "Zahraju [Select_CString(ROOT.Char.IsFemale,'vychytralou služku','vychytralého sluhu')]!"
 intrigue_dread_special.1101.a.d: "Zahraju [Select_CString(ROOT.Char.IsFemale,'mladou milenku','mladého milence')]!"
 intrigue_dread_special.1101.a.e: "Zahraju [Select_CString(ROOT.Char.IsFemale,'melancholickou bláznivku','melancholického blázna')]!"
 intrigue_dread_special.1101.b: "Nechte mi místo v první řadě."
 intrigue_dread_special.1101.c: "Tohle je pod mou úroveň."
 intrigue_dread_special.1102.desc: "Prvním krokem každého představení, ať už se odehrává v mém [ROOT.Char.Custom('FortifiedBuilding')], nebo na jevišti, je příprava.\n\nUprostřed shonu divadelní společnosti a k nepoznání v půjčeném kostýmu mám před začátkem představení ještě trochu času."
 intrigue_dread_special.1102.a: "Ne, tu kulisu přesuňte támhle!"
 intrigue_dread_special.1102.a.duel_success: "Dobře využiješ své organizační schopnosti"
 tooltip.intrigue_dread_special.1102.a.duel_success: "Připravíš jeviště znamenitě"
 intrigue_dread_special.1102.a.duel_failure: "Svými pokyny herce jen zmateš"
 tooltip.intrigue_dread_special.1102.a.duel_failure: "Kulisy jsou v naprostém nepořádku"
 intrigue_dread_special.1102.b: "Pojďme si to společně nacvičit!"
 intrigue_dread_special.1102.b.duel_success: "Lépe se seznámíš s herci"
 tooltip.intrigue_dread_special.1102.b.duel_success: "Herci tvou pomoc ocenili"
 intrigue_dread_special.1102.b.duel_failure: "Svými pokyny herce jen zmateš"
 tooltip.intrigue_dread_special.1102.b.duel_failure: "Zdá se, že ti herci nedůvěřují"
 intrigue_dread_special.1102.c: "Scénář si projdu ještě #EMP jednou#!."
 intrigue_dread_special.1102.c.flavor: "Bezpečná volba, ale malé riziko přináší jen malou odměnu."
 intrigue_dread_special.1103.desc: "Když spolu s ostatními účinkujícími vykročím na jeviště, pozornost publika nepolevuje ani na okamžik.\n\nJedna scéna střídá druhou a já cítím rytmus vyprávěného příběhu, jako by mi pulzoval v žilách. Když přijde čas na mou první repliku, zdá se, jako by celé publikum zadrželo dech."
 intrigue_dread_special.1103.a: "Publikum to musí #EMP cítit#!!"
 intrigue_dread_special.1103.a.duel_success: "Do své role se vžiju dokonale"
 tooltip.intrigue_dread_special.1103.a.duel_success: "Tvůj výkon na publikum zapůsobil"
 intrigue_dread_special.1103.a.duel_failure: "Nedokážu se do své role vcítit"
 tooltip.intrigue_dread_special.1103.a.duel_failure: "Tvůj výkon publikum nezaujal"
 intrigue_dread_special.1103.b: "Soustředím se, ať každá replika zazní bez jediné chyby."
 intrigue_dread_special.1103.b.duel_success: "Můj přednes na publikum zapůsobí"
 intrigue_dread_special.1103.b.duel_failure: "Celé představení prokoktám"
 intrigue_dread_special.1103.c: "Drž se scénáře a zůstaň v pozadí."
 intrigue_dread_special.1199.desc_win_feeling: "Je to krátká role, ale dokážu z ní vytěžit maximum. Publikum visí na každém mém slově a nechává se strhnout příběhem, který mu předkládám."
 intrigue_dread_special.1199.desc_loose_feeling: "Je to krátká role, a přesto se mi podaří pokazit snad úplně všechno. U dvora umím lidi ovlivňovat docela dobře, ale stát před takovým davem... to je úplně jiná zkušenost."
 intrigue_dread_special.1199.desc_win_reading: "Své repliky přednesu bez jediné chyby, dokonale vystihnu okamžik a strhnu na sebe veškerou pozornost publika."
 intrigue_dread_special.1199.desc_loose_reading: "Když smích publika konečně utichne, snažím se vzpamatovat ze svého přešlapu. Obvykle dobře vím, co a kdy říct, ale na jevišti je to mnohem těžší, než se zdálo."
 intrigue_dread_special.1199.desc_fallback: "Držím se scénáře a scéna plyne hladce, byť bez čehokoli pozoruhodného."
 intrigue_dread_special.1199.desc_win: "\n\nPo poslední scéně nás z jeviště vyprovází bouřlivý potlesk. Tak dokonale oklamat celé publikum, udržet svou přetvářku a klam a napálit tolik lidí najednou... To je opojný pocit!"
 intrigue_dread_special.1199.desc_loose: "\n\nKdyž dokončíme poslední scénu a jeden po druhém se ukláníme publiku, při mém příchodu ticho mluví samo za sebe. Navzdory veškeré snaze se mi nepodařilo přimět publikum, aby mé smyšlence uvěřilo, a hořkost zklamání se těžko polyká."
 intrigue_dread_special.1199.z: "A ten pocit chci zažít znovu! A znovu!"
 intrigue_dread_special.1199.a: "Odchod vlevo."
 intrigue_dread_special.1199.b: "Ale příště... jen počkejte!"
 intrigue_dread_special.1199.c.a: "Vy #EMP budete#! tleskat! Stráže!"
 intrigue_dread_special.1199.c.b: "Tohle bylo určitě spiknutí, které mě mělo ponížit! Stráže!"
 intrigue_dread_special.1197.t: "Hrůzné představení"
 intrigue_dread_special.1197.desc: "Musím uznat, že mé první vystoupení mělo jisté nedostatky... Když ale celý soubor skončil na pranýři, poddaní reagovali mnohem příznivěji. Tedy, možná ne zrovna #EMP příznivě#!, ale rozhodně to bylo uspokojivé."
 intrigue_dread_special.1197.a: "Alespoň jsem se pobavil[Select_CString(ROOT.Char.IsFemale,'a','')]."
 intrigue_dread_special.1198.desc: "Představení opakujeme znovu a znovu a znovu, zatímco publikum pod bedlivým dohledem mých stráží pokaždé dál jásá. \n\nS každou další reprízou je můj výkon vytříbenější, zatímco ostatní herci jsou čím dál nedbalejší, deptaní strachem a frustrací. Nakonec jeden po druhém vyčerpáním odpadají a na jevišti zůstávám jen já, sám[Select_CString(ROOT.Char.IsFemale,'a','')] a vítězně."
 intrigue_dread_special.1198.a: "Vskutku úchvatný zážitek, nemyslíte?"
 intrigue_dread_special.1301.t: "[ROOT.Char.Custom('GetCourtierPlural')|U] v obavách"
 intrigue_dread_special.1301.desc: "„...a za jak dlouho se ty pikle obrátí proti #EMP nám#!? Tohle intrikaření už zašlo příliš daleko.“ [courtier_first.GetTitledFirstName] a [courtier_second.GetTitledFirstName] stojí s hlavami těsně u sebe a polekaně sebou trhnou, když zahnu za roh.\n\n„[ROOT.Char.GetTitleTierName]! Zrovna jsme mluvili o vašich... volnočasových aktivitách. Zdá se, že vám zabírají spoustu času.“"
 intrigue_dread_special.1301.a: "Takže vy proti mně kujete pikle! Stráže!"
 intrigue_dread_special.1301.b: "Pokud jste [ROOT.Char.Custom('GetServants')] a zachováváte mi #EMP věrnost#!, nemáte se čeho bát..."
 intrigue_dread_special.1301.c: "Ujišťuji vás, že není čeho se obávat."
 intrigue_dread_special.1301.c.duel_success: "[ROOT.Char.Custom('GetCourtierPlural')|U] mé ujištění přijmou"
 tooltip.intrigue_dread_special.1301.c.duel_success: "Mé ujištění bylo přesvědčivé"
 intrigue_dread_special.1301.c.duel_failure: "Moji poddaní jsou znepokojení"
 tooltip.intrigue_dread_special.1301.c.duel_failure: "Mé ujištění nebylo dostatečně přesvědčivé"
 intrigue_dread_special.1301.d: "Starejte se o sebe!"
 intrigue_dread.1501.t: "Večerní pokrm"
 intrigue_dread.1501.desc: "„Jak vám chutná dušené maso, [ROOT.Char.Custom('FormOfAddressForLiege')]?“\n\nMezi kousky zeleniny jsou promíchané tučné kusy masa, jehož vláknitou strukturu místy pokrývá cosi, co vypadá jako krátká, řídká srst. Když se zeptám na přísady, [Select_CString(cannibal_cook.IsFemale,'moje osobní kuchařka','můj osobní kuchař')] [cannibal_cook.GetTitledFirstName] se jen usměje a snaží se mě uklidnit.\n\n„Mým jediným přáním je sloužit #EMP vám#!, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 intrigue_dread.1501.a: "Na přesném složení mých jídel nezáleží."
 intrigue_dread.1501.b: "Myslí si snad, že přede #EMP mnou#! udrží tajemství?"
 intrigue_dread.1501.b.flavor: "Nevědomost může být sladká, ale já to #EMP musím#! vědět"
 intrigue_dread.1501.b.tt1: "Podaří se ti lstí a přemlouváním proniknout do kuchyně"
 intrigue_dread.1501.b.tt2: "[cannibal_cook.GetTitledFirstName] dokáže recept udržet v tajnosti"
 intrigue_dread.1501.c: "Rozmarýn k lidskému masu? Skvělá volba!"
 intrigue_dread.1502.desc: "Když vstoupím do kuchyně, je temná a prázdná a ve vzduchu visí hustý kouř. V koutě najdu [cannibal_cook.GetTitledFirstNamePossessive] kuchařku, celou pokrytou skvrnami.\n\n#EMP Při přípravě jater bylo zjištěno, že nadměrná konzumace [ROOT.Char.Custom('RegionalDrink')] může výrazně snížit kvalitu orgánu-#!\nPři obracení na další stránku mě zamrazí.\n#EMP ...ovšem při přípravě dětí mladších než-#!"
 intrigue_dread.1502.a: "Ať [cannibal_cook.GetTitledFirstName] přijde o hlavu!"
 intrigue_dread.1502.a.flavor: "Jen ne na podnose"
 intrigue_dread.1502.b: "Ať [cannibal_cook.GetTitledFirstName] skončí v [ROOT.Char.Custom('GetDungeon')]!"
 intrigue_dread.1502.c: "Ale bylo to tak dobré..."
 intrigue_dread.1503.desc: "Ani přes veškerou snahu se mi nepodařilo proniknout do kuchyně tak, abych nevzbudil[Select_CString(ROOT.Char.IsFemale,'a','')] [cannibal_cook.GetTitledFirstNamePossessive] podezření."
 intrigue_dread.1503.a: "Tohle tajemství mě bude užírat..."
 intrigue_dread.1801.t: "Pokusy"
 intrigue_dread.1801.mentor_desc: "„A jen o trochu víc tohohle by [Select_CString(test_subject.IsFemale,'ji','ho')] úplně odrovnalo,“ říká mi [intrigue_mentor.GetFirstName]. Náš „dobrovolník“, [test_subject.GetTitledFirstName], už je téměř úplně mimo.\n\n[intrigue_mentor.GetFirstName] začne uklízet lahvičky. „Bohužel se obávám, že dnes večer už naše pokusná osoba víc nezvládne.“"
 intrigue_dread.1801.desc: "Upřímně děkuji [test_subject.GetTitledFirstName], zatímco na mě přes alchymistický opar míří vzteklý pohled. Nebylo snadné najít někoho, kdo se „dobrovolně“ podrobí testování mé sbírky... látek. Pro naši pokusnou osobu to byl večer plný bolesti, pálení a občasného bezvědomí."
 intrigue_dread.1801.a: "To bylo velmi poučné."
 intrigue_dread.1801.b: "Ještě jsme neskončili."
 intrigue_dread.1801.c: "Něco takového už nikdy nedělejme."
 intrigue_dread.1901.t: "[disliked_courtier.Custom2('InsultAdjective', ROOT.Char)|U] [Select_CString(disliked_courtier.IsFemale,'hlupačka','hlupák')]"
 intrigue_dread.1901.desc: "Den co den je v mé blízkosti [disliked_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nPokaždé, když spolu mluvíme, [disliked_courtier.Custom('quirk_neg_present')]. Je to snad #EMP úmyslná#! urážka? Další drzost od někoho, jako je [disliked_courtier.Custom2('InsultNoun', ROOT.Char)], už trpět nebudu. Někdo tu musí udělit lekci!"
 intrigue_dread.1901.a: "Mám tu jed, který už dlouho toužím vyzkoušet..."
 intrigue_dread.1901.b: "Byla by škoda, kdyby se [disliked_courtier.GetTitledFirstName] u dvora [Select_CString(disliked_courtier.IsFemale,'zesměšnila','zesměšnil')]."
 intrigue_dread.1901.b.tt: "Tato možnost je dostupná díky [disliked_courtier.GetFirstNamePossessiveNoTooltip] vlastnosti [GetTrait('gregarious').GetName( GetPlayer )]"
 intrigue_dread.1901.c: "Když [disliked_courtier.GetTitledFirstName] přijde o pár mincí, mně se hned zlepší nálada!"
 intrigue_dread.1901.c.tt: "Tato možnost je dostupná díky [disliked_courtier.GetFirstNamePossessiveNoTooltip] vlastnosti [GetTrait('greedy').GetName( GetPlayer )]"
 intrigue_dread.1901.d: "„Slyšeli jste? [disliked_courtier.GetTitledFirstName] je v posteli stejně fádní jako mouka.“"
 intrigue_dread.1901.d.tt: "Tato možnost je dostupná díky tomu, že [disliked_courtier.GetFirstNamePossessiveNoTooltip] má vlastnost [GetTrait('lustful').GetName( GetPlayer )]"
 intrigue_dread.4001.t: "Vytříbené utrpení"
 intrigue_dread.4001.desc.start: "Obyčejné mučení už mi nestačí. Právě kvůli němu mezi vězni mé jméno vzbuzuje hrůzu, ale já toužím vytvořit mistrovské dílo — umělecký výtvor ztělesňující muka a utrpení, který překoná vše, co jsem dosud dokázal[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 intrigue_dread.4001.desc.single: "\n\nNemohu se však ubránit otázce, zda je [prisoner_1.GetTitledFirstName] vhodným plátnem pro mé velké dílo?"
 intrigue_dread.4001.desc.multiple: "\n\nOtázkou je, kdo se stane mým plátnem?"
 intrigue_dread.4001.a.single: "Ano, [prisoner_1.GetTitledFirstName] se bude skvěle hodit..."
 intrigue_dread.4001.a: "[prisoner_1.GetTitledFirstNameNoTooltip] je dokonalá volba!"
 intrigue_dread.4001.b: "Možná bude nejlepší [prisoner_2.GetTitledFirstNameNoTooltip]?"
 intrigue_dread.4001.c: "Raději ať je mým plátnem [prisoner_3.GetTitledFirstNameNoTooltip]."
 intrigue_dread.4001.a-c.tt: "[THIS.Char.GetTitledFirstName] se stane objektem tvého počinu."
 intrigue_dread.4001.kinslayer: "Pokud [THIS.Char.GetTitledFirstName] při tom zemře, můžeš se stát [GetTrait('kinslayer_3').GetName( GetPlayer )]."
 intrigue_dread.4001.d: "Ne, teď na to není vhodná doba."
 intrigue_dread.4001.d.flavor: "K této myšlence se vrátím za několik let, snad už s novými vězni"
 intrigue_dread.4002.desc: "Teď, když mám vybrané plátno, musím rozhodnout, jakou podobu mé mistrovské dílo získá.\n\nNapadá mě mnoho muk, kterým bych chtěl[Select_CString(ROOT.Char.IsFemale,'a','')] [victim.GetTitledFirstName] vystavit, ale pokud má vzniknout skutečné mistrovské dílo, musím se soustředit na jedinou věc a provést ji dokonale."
 intrigue_dread.4002.a: "[victim.GetTitledFirstName] se po stažení z kůže promění v nádhernou sochu."
 intrigue_dread.4002.a.flavor: "Vystavím ji, aby ji viděl celý [ROOT.Char.Custom('GetRealmOrDomicile')]!"
 intrigue_dread.4002.b: "[victim.GetTitledFirstName] mi zazpívá sladkou píseň utrpení..."
 intrigue_dread.4002.b.flavor: "Ještě celé roky si budu vybavovat, jak [victim.GetTitledFirstName] křičí."
 intrigue_dread.4002.c: "[victim.GetTitledFirstName] přijde o vlastní vůli a stane se mou loutkou!"
 intrigue_dread.4002.c.flavor: "Začnu dlouhý a úmorný proces ničení osobnosti. [victim.GetTitledFirstName] postupně přijde o vlastní individualitu a nakonec mi bude bezvýhradně sloužit."
 intrigue_dread.4002.c.compassionate.tt: "@warning_icon! #warning Kvůli své soucitné povaze si touto cestou výrazně zvýšíš [Concept('stress','stres')|E].#!"
 intrigue_dread.4002.c.success.desc: "Podaří se ti dosáhnout toho, že [victim.GetFirstNameNoTooltip] začne myslet přesně podle tvých záměrů"
 intrigue_dread.4002.c.failure.desc: "[victim.GetFirstNameNoTooltip] zemře dřív, než proces dokončíš"
 intrigue_dread.4002.d: "Rozmyslím si to. [victim.GetTitledFirstName] se k tomu nehodí..."
 intrigue_dread.4004.desc: "Než budu moci přetvořit mysl, musí [victim.GetTitledFirstName] nejprve čelit extrémnímu stresu.\n\nMusím pečlivě zvolit způsob mučení, při němž bude [victim.GetFirstNameNoTooltip] nejzranitelnější — tak zajistím, že způsobené trauma bude co nejhorší."
 intrigue_dread.4004.desc.followup: "[victim.GetTitledFirstName] si na současný způsob mučení začíná zvykat a ten už nemá stejný účinek jako dřív. Budu muset zvolit jiný přístup..."
 intrigue_dread.4004.o.flavor: "Účinnost této techniky se bude lišit podle [Concept('traits','rysů')|E], které má [victim.GetTitledFirstNameNoTooltip]."
 intrigue_dread.4004.a: "Tělesné mučení a bolest."
 intrigue_dread.4004.b: "Hladovění a odpírání spánku."
 intrigue_dread.4004.c: "Ponižování a degradace."
 intrigue_dread.4005.desc: "[victim.GetTitledFirstName] konečně ztrácí veškerou naději a v žaláři už se mi nebrání.\n\nJe tedy čas přejít k druhému kroku. Musím vyvolat dostatek pocitů viny a zmatku, aby se narušilo vnímání morálky, smyslu života, a dokonce i vlastní identity."
 intrigue_dread.4005.desc.followup: "[victim.GetTitledFirstName] stále lpí na potrhaných zbytcích vlastní identity. Je poškozená, ale ještě ne zcela zničená. Musím použít jinou taktiku a dílo dokončit..."
 intrigue_dread.4005.a: "Utěšovat... a přitom pokračovat v mučení!"
 intrigue_dread.4005.b: "Tvrdit, že [victim.GetTitledFirstName] tímhle pyká za [ROOT.Char.Custom('GetSinMisdeedPlural')]."
 intrigue_dread.4005.c: "[victim.GetTitledFirstName] dostane naději na úlevu — a já ji pak rozdrtím."
 intrigue_dread.4006.desc: "Konečně se mi podařilo odstranit poslední zbytky identity. [victim.GetTitledFirstName] je teď pouhou prázdnou schránkou bez schopnosti vnímat svět kolem sebe."
 intrigue_dread.4006.a: "[victim.GetTitledFirstName] teď získá podobu, která poslouží mým záměrům."
 intrigue_dread.4006.a.tt: "Začneš pracovat na tom, aby se [victim.GetTitledFirstName] [Select_CString(victim.IsFemale,'stala poslušnou služebnicí','stal poslušným služebníkem')]"
 intrigue_dread.4006.b: "Víc mě pobaví, když se [victim.GetTitledFirstName] vrátí jako prázdná schránka."
 intrigue_dread.4007.desc: "Je hotovo — [victim.GetTitledFirstName] stojí přede mnou v naprostém područí a udělá vše, co poručím."
 intrigue_dread.4007.a: "Ach, co všechno spolu dokážeme!"
 intrigue_dread.4008.desc: "Už několik let je [victim.GetTitledFirstName] zpátky ve světě a plní mé příkazy."
 intrigue_dread.4008.desc.success: "[victim.GetTitledFirstName] od té doby opět žije běžným životem a plní své obvyklé povinnosti — a přitom oddanost vůči mně nepolevila."
 intrigue_dread.4008.desc.lunatic: "\n\nBohužel se zdá, že rozpor mezi mým podmiňováním a realitou nového života byl příliš velký. Nakonec [victim.GetTitledFirstName] [Select_CString(victim.IsFemale,'zešílela','zešílel')]."
 intrigue_dread.4008.desc.failure: "\n\nBohužel se zdá, že zásahy přátel a rodiny zmařily značnou část mé pečlivé práce. [victim.GetTitledFirstName] [Select_CString(victim.IsFemale,'už mi není věrná','už mi není věrný')]."
 intrigue_dread.4008.a.success: "Výborně..."
 intrigue_dread.4008.a.lunatic: "Aspoň to nějakou dobu fungovalo."
 intrigue_dread.4008.a.failure: "Proklínám je za zničení mého umění!"
 intrigue_dread.4011.desc: "Když už [victim.GetTitledFirstName] není v [ROOT.Char.Custom('GetDungeonPlural')], nemohu pokračovat v práci na svém mistrovském díle. Mé plány musí počkat, dokud nezískám další dostatečně inspirativní plátno. A i kdyby [victim.GetTitledFirstName] [Select_CString(victim.IsFemale,'znovu padla do mých rukou','znovu padl do mých rukou')], už by to nebylo ono."
 intrigue_dread.4011.a: "Politováníhodná komplikace..."
 intrigue_dread.4013.desc: "Zdá se, že moje #EMP péče#! byla pro [victim.GetTitledFirstName] přece jen příliš náročná a v [ROOT.Char.Custom('GetDungeonPlural')] [Select_CString(victim.IsFemale,'zemřela','zemřel')].\n\nTeď své mistrovské dílo nedokončím, pokud nezískám další dostatečně inspirativní plátno, a [ROOT.Char.GetFaith.HighGodName] ví, jak dlouho to potrvá..."
 intrigue_dread.4013.a: "Příště musím být opatrnější."
 intrigue_dread.4100.t: "Nekonečná slyšení"
 intrigue_dread.4100.desc.intro: "Není dne, kdy by mi u dvora nepředložili nějakou novou bezvýznamnou záležitost. Dnes, jak se zdá, přišla řada na [petitioner_1.GetTitledFirstName] a [petitioner_2.GetTitledFirstName], aby mě připravili o čas nějakým malicherným sporem."
 intrigue_dread.4100.desc.lazy: "\n\nJejich stížnosti sotva dokážu poslouchat... Jak mám vládnout, když většina mého omezeného času a sil padne na takové nesmysly?"
 intrigue_dread.4100.desc.councillors: "\n\nSnaží se mě přesvědčit, že tahle záležitost ohrožuje samotnou bezpečnost panství, ale nemohu se zbavit dojmu, že její závažnost silně zveličují jen proto, aby si pohladili vlastní ego."
 intrigue_dread.4100.desc.fallback: "\n\nČím déle poslouchám jejich argumenty, tím víc nabývám přesvědčení, že celý tenhle spor nestojí za mou pozornost."
 intrigue_dread.4100.z: "Zajímalo by mě, jak upovídané budou vaše useknuté hlavy?"
 intrigue_dread.4100.a: "Stráže, dostaňte tyhle ničemy z mých očí!"
 intrigue_dread.4100.b: "Já vás naučím mrhat časem dvora!"
 intrigue_dread.4100.b.duel_success: "Žadatelé se krčí před tvým hněvem"
 intrigue_dread.4100.b.duel_failure: "Žadatele tvé výhrůžky urazí"
 intrigue_dread.4100.c: "Tak ještě jednou od začátku..."
 intrigue_dread.4100.c.tooltip: "Dáš si na rozhodnutí dostatek času"
 intrigue_dread.4100.c.support.petitioner_1: "Pokud podpoříš [petitioner_1.GetTitledFirstName]"
 intrigue_dread.4100.c.support.petitioner_2: "Pokud podpoříš [petitioner_2.GetTitledFirstName]"
 intrigue_dread.4100.d: "[scoped_chancellor.GetTitledFirstNameNoTooltip] by se měl[Select_CString(scoped_chancellor.IsFemale,'a','')] o takové záležitosti postarat."
 intrigue_dread.4102.desc.commanders: "Jádrem sporu mezi [petitioner_1.GetFirstName] a [petitioner_2.GetFirstName] jsou jakési rozepře mezi veliteli a několika armádními veterány."
 intrigue_dread.4102.desc.guests: "Zdá se, že problém vznikl kvůli jakémusi diplomatickému incidentu..."
 intrigue_dread.4102.desc.fallback: "Doufám, že za jejich stížnostmi objevím nějaký hlubší smysl, ale čím déle poslouchám hašteření mezi [petitioner_1.GetFirstName] a [petitioner_2.GetFirstName], tím malichernější mi celá věc připadá."
 intrigue_dread.4102.desc.antagonizer: "\n\nKdyž nic jiného, je mi alespoň jasné, že z těch dvou žadatelů mi [scoped_antagonizer.GetFirstNameNoTooltip] leze na nervy mnohem víc."
 intrigue_dread.4102.a: "Požaduji, abyste se okamžitě usmířili. Jinak..."
 intrigue_dread.4102.b: "[petitioner_1.GetFirstNameNoTooltip] má očividně pravdu."
 intrigue_dread.4102.c: "Slova, která pronáší [petitioner_2.GetFirstNameNoTooltip], znějí přesvědčivě."
 intrigue_dread.4200.t: "Les mých snů"
 intrigue_dread.4200.desc.intro: "Při své snaze stát se skutečně obávanou a respektovanou osobou jsem svůj žalář naplnil[Select_CString(ROOT.Char.IsFemale,'a','')] ohromným množstvím provinilců a zrádců."
 intrigue_dread.4200.desc.noble_forest: "Mé cely praskají ve švech pod náporem rivalů, zrádců a obyčejných zločinců. Možná nadešel čas jejich smrti — [ROOT.Char.GetFaith.DeathDeityName] je očekává a [ROOT.Char.GetFaith.NegativeAfterLife] bude jejich údělem. A ještě přitom mohou posloužit zájmům [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
 intrigue_dread.4200.desc.commoner_forest: "Na svůj osud čeká spousta podřadných hrdlořezů a kapsářů z venkova i měst, odloučených od společnosti. Možná pro ně ale mám lepší využití."
 intrigue_dread.4200.desc.middle: "\n\nVe svých ponurých představách vidím [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] ze všech stran obklopené lesem nabodnutých ničemů a zrádců: chmurnou připomínkou toho, co čeká každého, kdo zradí [ROOT.Char.GetTitleAsNameNoTooltip]."
 intrigue_dread.4200.desc.noble_forest.outro: "Před očima mám [random_prisoner_scope.GetName] nabodnutého[Select_CString(random_prisoner_scope.IsFemale,'ou','')] na kůl a kolem něj stejně vystavené poddané. Teď už zbývá jen proměnit ten sen ve skutečnost!"
 intrigue_dread.4200.desc.commoner_forest.outro: "Vidím nekonečné řady obyčejných zločinců táhnoucí se až k obzoru a [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip] potřísněné jejich krví. S trochou úsilí snad pochytáme dost téhle havěti, aby se můj sen stal skutečností."
 intrigue_dread.4200.a: "Dejme se do práce!"
 intrigue_dread.4200.b: "[random_prisoner_scope.GetTitledFirstNameNoTooltip] a pár poddaných vyšlou dostatečně jasný vzkaz."
 intrigue_dread.4200.c: "Pár mrtvol bude stačit."
 intrigue_dread.4200.d: "Všichni se mě musí bát!"
 intrigue_dread.4200.e: "Při [ROOT.Char.GetFaith.HighGodName]! Tohle nemohu udělat!"
 intrigue_dread.4201.t: "Les mrtvol"
 intrigue_dread.4201.desc.intro: "Má vize konečně ožila díky mrtvolám bezpočtu zločinců. Poklidně se procházím za krákání ptáků a tichého odkapávání zatuchlé krve na promáčenou zem."
 intrigue_dread.4201.desc.noble_forest: "\n\nNarazím na tělo [random_prisoner.GetNameNoTooltip]. Tvář zůstala zkřivená výrazem šoku a hrůzy, jako by snad [random_prisoner.GetTitledFirstName] předem tušil[Select_CString(random_prisoner.IsFemale,'a','')], jaký osud čeká."
 intrigue_dread.4201.desc.commoner_forest: "\n\nProcházím kolem jedné řady bezejmenných ničemů a banditů za druhou s jistotou, že každý lapka či bandita mířící k [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] jasně uvidí, co čeká ty, kdo se pokusí rozsévat zločin a chaos v [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]!"
 intrigue_dread.4201.desc.outro: "\n\nNa konci své obhlídky se naposledy nadechnu smrtelného puchu a spokojeně se svým dílem se vrátím domů."
 intrigue_dread.4201.a: "Teď se všichni budou bát jména „[ROOT.Char.GetNameNoTooltip]“."
 forest_of_corpses_1_modifier: "Les mrtvol"
 forest_of_corpses_1_modifier_desc: "V tomto hrabství byl vztyčen rozsáhlý les nabodnutých mrtvol"
 forest_of_corpses_2_modifier: "$forest_of_corpses_1_modifier$"
 forest_of_corpses_2_modifier_desc: "$forest_of_corpses_1_modifier_desc$"
 forest_of_corpses_3_modifier: "$forest_of_corpses_1_modifier$"
 forest_of_corpses_3_modifier_desc: "$forest_of_corpses_1_modifier_desc$"
 intrigue_dread.2001.t: "I [loved_one.GetTitledFirstName] se mě bojí"
 intrigue_dread.2001.desc: "Ruka [loved_one.GetTitledFirstName] se pod tou mou chvěje. Když se natáhnu, abych pohladil[Select_CString(ROOT.Char.IsFemale,'a','')] tvář, [loved_one.GetTitledFirstName] sebou trhne a ucukne.\n\n[loved_one.GetTitledFirstName] mi vypráví, jaké podivné věci se o mně povídají. Děsivé věci. A ptá se, které z nich jsou pravdivé."
 intrigue_dread.2001.a: "Nevědí ani #EMP polovinu#! toho, co jsem udělal[Select_CString(ROOT.Char.IsFemale,'a','')]."
 intrigue_dread.2001.a.tt: "Pojď blíž. #EMP Ještě blíž#!. Pošeptám ti to do ucha."
 intrigue_dread.2001.b: "Všechno, co dělám, dělám pro tvou ochranu!"
 intrigue_dread.2001.c: "Kdo přesně tyhle věci říká? Chci jména."
 intrigue_dread.2001.d: "Jen se usměj a odejdi."
 intrigue_dread.2001.b.into_it: "[loved_one.GetFirstName] je dojat[Select_CString(loved_one.IsFemale,'á','')] tvou oddaností"
 intrigue_dread.2001.b.reassured: "[loved_one.GetFirstName] získá jistotu, že je v bezpečí"
 intrigue_dread.2001.b.terrified: "Tvé přiznání [loved_one.GetFirstName] vyděsí"
 tooltip.intrigue_dread.2001.c.duel_success: "Tvé stráže pochytají klevetníky"
 tooltip.intrigue_dread.2001.c.duel_failure: "[loved_one.GetFirstName] se ti otevřeně vzepře"
 intrigue_protected_by_loved_one_modifier: "Chráněn milovanou osobou"
 intrigue_protected_by_loved_one_modifier_desc: "Tato osoba má někoho blízkého, kdo by pro její ochranu udělal #EMP cokoli#!."
 intrigue_defied_loved_one_opinion: "Vzepření milované osobě"
 intrigue_dread.2101.t: "Zvěsti o [family_member.GetFirstNameNoTooltip]"
 intrigue_dread.2101.desc.intro: "„Ty odporné zvěsti o [family_member.GetTitledFirstName]... [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))|U] přece patří do vaší rodiny. Jejich zdroj už znám.“ [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)|U] poklepe na svazek dopisů.\n\nDopisy dokazují, že [hater.GetName] se snaží pošpinit jméno [family_member.GetFirstName]. "
 intrigue_dread.2101.desc.failed_assassination: "[hater.GetTitledFirstName] dokonce tvrdí, že [family_member.GetFirstName] [Select_CString(family_member.IsFemale,'se pokusila zosnovat atentát','se pokusil zosnovat atentát')]!"
 intrigue_dread.2101.desc.committed_adultery: "[hater.GetTitledFirstName] tvrdí, že [family_member.GetFirstName] [Select_CString(family_member.IsFemale,'byla nevěrná manželka','byl nevěrný manžel')], a barvitě líčí všechny zálety!"
 intrigue_dread.2101.desc.bullied_me: "[hater.GetTitledFirstName] tvrdí, že [family_member.GetFirstName] má v sobě semínko zla už od dětství, kdy [hater.GetNameNoTooltip] [Select_CString(family_member.IsFemale,'krutě šikanovala','krutě šikanoval')]."
 intrigue_dread.2101.desc.bad_friend: "[hater.GetTitledFirstName] tvrdí, že [family_member.GetFirstName] [Select_CString(family_member.IsFemale,'byla mizerná přítelkyně','byl mizerný přítel')] a ukončením jejich přátelství [Select_CString(family_member.IsFemale,'způsobila','způsobil')] [hater.GetTitledFirstName] velkou bolest."
 intrigue_dread.2101.desc.sinner: "[hater.GetTitledFirstName] se vysmívá povaze [family_member.GetFirstName] a jako důkaz přidává otřesný výčet: [ROOT.GetCharacter.Custom('GetSinMisdeedPlural')]."
 intrigue_dread.2101.desc.outro: "\n\nOpravdu si lidé myslí, že mohou takhle mluvit o mé rodině? [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_member'))|U] přece patří mezi mé nejbližší!"
 intrigue_dread.2101.a: "Rozšiřme o [family_member.GetFirstNameNoTooltip] ještě děsivější zvěsti, ať se nás všichni bojí."
 intrigue_dread.2101.a.tt.success: "Lidé věří, že [family_member.GetFirstName] je schopný[Select_CString(family_member.IsFemale,'á','')] čehokoli"
 tooltip.intrigue_dread.2101.a.duel_success: "Uvěří a třesou se strachy"
 intrigue_dread.2101.a.tt.failure: "Nikdo tvým přehnaným historkám nevěří"
 tooltip.intrigue_dread.2101.a.duel_failure: "Lidé se tvým přehnaným historkám vysmívají"
 intrigue_dread.2101.b: "Nabídnout [hater.GetTitledFirstNameNoTooltip] pár mincí za mlčení."
 intrigue_dread.2101.b.tt.success: "[hater.GetTitledFirstName] bude mlčet"
 tooltip.intrigue_dread.2101.b.duel_success: "[hater.GetTitledFirstName] mlčí a všichni jsou spokojení"
 intrigue_dread.2101.b.tt.failure: "[hater.GetTitledFirstName] bude dál šířit klepy"
 tooltip.intrigue_dread.2101.b.duel_failure: "[hater.GetTitledFirstName] si vezme tvé mince a dál roznáší klepy"
 intrigue_everyone_is_satisfied_tt: "[hater.GetTitledFirstName] i [family_member.GetFirstName] jsou s tímto řešením spokojení"
 intrigue_dread.2101.c: "Potají najít rváče, kteří [hater.GetTitledFirstNameNoTooltip] zbijí."
 intrigue_dread.2101.c.tt.success: "Nikdo se neodváží mluvit špatně o tvé rodině"
 tooltip.intrigue_dread.2101.c.duel_success: "[hater.GetTitledFirstName] se zotavuje z bolestivé nehody"
 intrigue_suspect_you_in_attack_success_tt: "Nikdo nedokáže tvou účast prokázat, ale jejich podezření stačí, aby se tě báli"
 intrigue_dread.2101.c.tt.failure: "Vyjde najevo tvé spojení s obyčejnými zločinci"
 tooltip.intrigue_dread.2101.c.duel_failure: "[hater.GetTitledFirstName] tě podezírá, že stojíš za nezdařeným útokem"
 intrigue_dread.2101.d: "Od [family_member.GetFirstNameNoTooltip] se raději distancuji."
 intrigue_everyone_heard_rumours_tt: "Všichni u tvého dvora uslyší zostuzující zvěsti o [family_member.GetNameNoTooltip]"
 intrigue_everyone_heard_horrifying_rumours_tt: "Všichni u tvého dvora uslyší děsivé zvěsti o [family_member.GetNameNoTooltip]"
 intrigue_bumbling_tyrant_modifier: "Tyranské neumětelství"
 intrigue_blanket_of_fear_modifier: "Příkrov strachu"
 intrigue_controlling_the_narrative_modifier: "Ovládnutí příběhu"
 intrigue_thrown_under_the_carriage_opinion: "Distancování se ode mě"
 intrigue_made_me_sound_scary_opinion: "Vykreslení jako postrach"
 intrigue_dread.2201.t: "Strach projevit vlastní názor"
 intrigue_dread.2201.desc: "„Jak moudré rozhodnutí, Výsosti!“ [yesman.Custom2('MyCharacterIntroduction', ROOT.Char)] se nervózně usmívá a přikyvuje přede mnou hlavou jako holub. „Opravdu k tomu nemám co dodat!“\n\n[yesman.GetNameNoTooltip] se mě bojí natolik, že se neodvažuje odporovat mým rozhodnutím. Jako [yesman.GetCouncilTitle] je tak prakticky k ničemu."
 intrigue_dread.2201.a: "Dokonalé. Má [Concept('council','rada')|E] se mě #EMP má#! bát."
 intrigue_dread.2201.b: "Tak tu práci udělám za tebe, ty hlupáku!"
 intrigue_dread.2201.c: "Mluv otevřeně. O své místo nepřijdeš."
 intrigue_guaranteed_position_block_firing_councillor_effect_tt: "[yesman.GetShortUIName|U] nemůže být po dobu 5 let [Select_CString(yesman.IsFemale,'odvolána','odvolán')] z [Concept('council','rady')|E]"
 intrigue_dread.2201.c.tt.success: "[yesman.GetFirstNameNoTooltip] ti důvěřuje natolik, že mluví otevřeně"
 tooltip.intrigue_dread.2201.c.duel_success: "$intrigue_dread.2201.c.tt.success$"
 intrigue_dread.2201.c.tt.failure: "[yesman.GetFirstNameNoTooltip] si myslí, že jde z tvé strany o léčku"
