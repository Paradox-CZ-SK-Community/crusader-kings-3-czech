l_polish:
 intrigue_events_bjorn.5100.t: "Lekce srdce" # todo: NEW TRANSLATION
 intrigue_events_bjorn.5100.desc: "Pozorovat mého milovaného [the_lover.GetFirstName] mě přivádí na myšlenku, že od tak úžasné osoby se mohu hodně naučit. [Select_CString(the_lover.IsFemale,'Její','Jeho')] mysl je jako poklad k vyrabování; a mám pár věcí, kterými mohu [the_lover.GetFirstName] také obohatit.\n\nA navíc je to tak nádherný způsob, jak trávit společný čas!" # todo: NEW TRANSLATION
 intrigue_events_bjorn.5100.a: "Moje láska mi toho může tolik naučit." # todo: NEW TRANSLATION
 intrigue_events_bjorn.5100.b: "[the_lover.GetSheHe|U] bude skvělým žákem." # todo: NEW TRANSLATION
 intrigue_events_bjorn.5100.c: "Stačí mi, že spolu trávíme čas." # todo: NEW TRANSLATION
 intrigue_events_bjorn.5101.t: "Společné zájmy" # todo: NEW TRANSLATION
 intrigue_events_bjorn.5101.desc: "[the_lover.GetFirstName] mě tak fascinuje! Chci si užít to, co [the_lover.GetHerHim] těší.\n\nÓ, trávit společně blažené dny:\n\nRuce pracující v souhře, mysli soustředěné na společné zájmy.\n\nNaše srdce bijí jako jedno." # todo: NEW TRANSLATION
 intrigue_events_bjorn.5101.a: "Ukaž mi, co rozdmýchává tvé vášně, má lásko." # todo: NEW TRANSLATION
 intrigue_events_bjorn.5101.b: "Pojď, poděl se se mnou o tuto radost." # todo: NEW TRANSLATION
 intrigue_events_bjorn.5101.c: "Co kdybychom se spolu naučili něco nového?" # todo: NEW TRANSLATION
 intrigue_events_bjorn.5102.t: "Milovat stín" # todo: NEW TRANSLATION
 intrigue_events_bjorn.5102.desc: "S tím, jak se k sobě více přibližujeme, stojíme nyní na prahu. Snad je načase sdílet spolu opravdu všechno, abychom poznali vše, co se dá poznat. Sdílet věci, které se obvykle… nesdílí.\n\nZ tohoto bodu už není cesty zpět, ale přijme [the_lover.GetFirstName] všechno, co o mně lze vědět?" # todo: NEW TRANSLATION
 intrigue_events_bjorn.5102.a: "Mám ti takové věci ukázat." # todo: NEW TRANSLATION
 intrigue_events_bjorn.5102.b: "Řekni mi, co jsi nikomu jinému nesdělil." # todo: NEW TRANSLATION
 intrigue_events_bjorn.5102.c: "Prozkoumejme naše nejtemnější fantazie." # todo: NEW TRANSLATION
 intrigue_events_bjorn.5102.d: "Ne! Některé věci by nikdy neměly vyjít na světlo." # todo: NEW TRANSLATION
