l_polish:
 intrigue_events_bjorn.5100.t: "Lekce srdce"
 intrigue_events_bjorn.5100.desc: "Když pozoruji milovanou osobu [the_lover.GetFirstName], dochází mi, kolik bych se od někoho tak úžasného [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] naučit. Mysl [the_lover.GetFirstName] je jako poklad čekající na objevení; a i já mám co předat.\n\nA navíc je to tak krásný způsob, jak spolu trávit čas!"
 intrigue_events_bjorn.5100.a: "Má láska mě toho může tolik naučit."
 intrigue_events_bjorn.5100.b: "[the_lover.GetFirstName] bude [Select_CString(the_lover.IsFemale,'báječnou studentkou','báječným studentem')]."
 intrigue_events_bjorn.5100.c: "Mně stačí, že spolu trávíme čas."
 intrigue_events_bjorn.5101.t: "Společné záliby"
 intrigue_events_bjorn.5101.desc: "[the_lover.GetFirstName] mě tolik fascinuje! Chci poznat vše, co přináší radost.\n\nAch, trávit spolu blažené dny:\n\nRuce pracující bok po boku, mysl upřená ke společným zálibám.\n\nNaše srdce bijící jako jedno."
 intrigue_events_bjorn.5101.a: "Ukaž mi, co v tobě probouzí vášeň, má lásko."
 intrigue_events_bjorn.5101.b: "Pojď, poděl se se mnou o tu radost."
 intrigue_events_bjorn.5101.c: "Co kdybychom se spolu naučili něco nového?"
 intrigue_events_bjorn.5102.t: "Milovat stín"
 intrigue_events_bjorn.5102.desc: "Jak se k sobě stále více přibližujeme, ocitáme se na prahu něčeho nového. Možná nastal čas sdílet spolu opravdu všechno, abychom o sobě věděli úplně vše. Svěřit si i věci, které se obvykle... nesdílejí.\n\nZa tímto bodem už není návratu, ale přijme [the_lover.GetFirstName] všechno, co se o mně může dozvědět?"
 intrigue_events_bjorn.5102.a: "Mám toho tolik, co ti chci ukázat."
 intrigue_events_bjorn.5102.b: "Řekni mi, co jsi ještě nikomu [Select_CString(the_lover.IsFemale,'nesvěřila','nesvěřil')]."
 intrigue_events_bjorn.5102.c: "Pojďme prozkoumat naše nejtemnější fantazie."
 intrigue_events_bjorn.5102.d: "Ne! Některé věci by nikdy neměly vyjít na světlo."
