l_polish:
 available_because_of_dread_tt: "Tato možnost je dostupná díky tvé [Concept('dread','hrůze')|E]"
 intrigue_lifestyle_perk_indication: "Můžeš získat [Concept('perk','talent')|E] [Concept('intrigue_lifestyle','pletichářského životního stylu')|E]"
 intrigue_scheming_focus_point_clear_gain: "Tvé porozumění [Concept('intrigue_lifestyle','pletichářskému životnímu stylu')|E] se zvyšuje"
 intrigue_scheming.1001.t: "Nářek [county.GetNameNoTierNoTooltip]"
 intrigue_scheming.1001.desc: "„Ty zásoby potřebujeme pro vojsko! Jestli kvůli tomu musí jedna malá vesnice v [county.GetNameNoTier] hladovět—“\n\nVyhrocená hádka mezi mými rádci mě provází až ven z místnosti. Když se přiblížím, [councillor.GetTitledFirstName], [Select_CString(councillor.IsFemale,'zástupkyně','zástupce')] [county.GetNameNoTierNoTooltip], mě přivítá unaveným pohledem."
 intrigue_scheming.1001.a: "Tady. Tento výnos je donutí dát vám pokoj."
 intrigue_scheming.1001.b: "Co znamená jedna vesnice ve velkém běhu věcí?"
 intrigue_scheming.1011.t: "Potřeba utajení"
 intrigue_scheming.1011.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“\nOtočím se a vidím [council_member.GetTitledFirstName], jak ke mně bez dechu přibíhá. „Našli dalšího mrtvého posla, [ROOT.Char.Custom('FormOfAddressForLiege')]. Brašna i dopis zmizely.“\n\nUž potřetí za tento rok. Z nepříjemnosti se pomalu stává vážný problém. Co když naši nepřátelé čtou korespondenci mezi mnou a mými spolčenci?"
 intrigue_scheming.1011.a: "Sežeňte kryptografa, práce začne okamžitě!"
 intrigue_scheming.1011.a.flavor: "Společně s kryptografem vyvineme vlastní šifru."
 intrigue_scheming.1011.b: "Příště musím být obezřetnější."
 intrigue_scheming.1012.desc: "Dlouhá noc se mění v časné ráno a odpočinek je stále v nedohlednu jak pro mě, tak pro [cryptographer.GetTitledFirstName].\n\n"
 intrigue_scheming.1012.desc_archimedes: "„Tahle dřina by byla hned snazší, kdybychom měli Archimédovy práce o šifrách. Stránku za stránkou o kódech a šifrování...“"
 intrigue_scheming.1012.desc_al_kindi: "„Tahle dřina by byla hned snazší, kdybychom měli al-Kindího práce o kryptografii. Stránku za stránkou o kódech a šifrování...“"
 intrigue_scheming.1012.desc_ending: "\nZ ospalého oparu ke mně doléhá mumlání [cryptographer.GetTitledFirstName]."
 intrigue_scheming.1012.a: "My dva toho máme hodně k probrání..."
 intrigue_scheming.1012.a.duel_success: "Společně s [cryptographer.GetTitledFirstNameNoTooltip] úspěšně vyvineme novou šifru"
 intrigue_scheming.1012.a.duel_failure: "[cryptographer.GetTitledFirstNameNoTooltip] mě nedokáže zasvětit do svého umění"
 intrigue_scheming.1012.b: "Vzbuď mě, pokud na něco přijdeš."
 intrigue_scheming.1013.desc_alive: "Konečně něco máme! Po mnoha dlouhých rozhovorech a ještě delších nocích jsme s [cryptographer.GetTitledFirstName] konečně dospěli k závěru.\n\n"
 intrigue_scheming.1013.desc_dead: "Navzdory ztrátě kryptografa konečně něco mám!\n\n"
 intrigue_scheming.1013.desc_transposition: "Nejlépe nám poslouží poměrně jednoduchý systém, který přehazuje písmena ve slovech. Je nanejvýš důležité, aby příjemce dokázal zprávu pochopit bez přílišného zdržení."
 intrigue_scheming.1013.desc_substitution: "Nejlépe nám poslouží systém, který nahrazuje písmena čísly. Našim nepřátelům bude připadat jako naprostý nesmysl!"
 intrigue_scheming.1013.desc_cipher: "Nejlépe nám poslouží šifra, díky níž budou nepřátelé přesvědčeni, že každá zachycená zpráva je napsaná v cizím jazyce!"
 intrigue_scheming.1013.a: "Tohle nikdo neprolomí!"
 intrigue_scheming.1013.a.tt: "Získáš #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! bodů [Concept('intrigue_rigueint','Rigueint')|E]"
 intrigue_scheming.1013.b.tt: "Získáš #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! bodů [Concept('intrigue_9_14_20_18_9_7_21_5','9 14 20 18 9 7 21 5')|E]"
 intrigue_scheming.1013.c.tt: "Získáš #T [THIS.Var('intrigue_exp_gain_value').GetValue]#! bodů [Concept('intrigue_lqwuljxh','Lqwuljxh')|E]"
 intrigue_scheming.1014.desc_alive: "Bohužel se mi přes veškerou snahu nepodařilo pochopit tajemné kryptografické umění, které ovládá [cryptographer.GetTitledFirstName]. \n\n[cryptographer.GetTitledFirstName] mě ujišťuje, že vytvořená šifra je naprosto bezpečná, ale přesto se nemohu zbavit pocitu, že mi unikla příležitost zdokonalit vlastní schopnosti."
 intrigue_scheming.1014.desc_dead: "Po smrti [cryptographer.GetTitledFirstName] musím své snahy vytvořit tajnou šifru pro bezpečnou výměnu citlivých informací odložit. \n\nMohu jen doufat, že se brzy naskytne další příležitost zlepšit ochranu mého [ROOT.Char.Custom('GetCourt')] před špionáží."
 intrigue_scheming.1014.a: "Jaká škoda..."
 intrigue_scheming.1201.t: "Každý kout a skulina"
 intrigue_scheming.1201.desc: "Temná noc dokáže stíny v chodbách mého [ROOT.Char.Custom('FortifiedBuilding')] skutečně probudit k životu. S každým nestřeženým koutem, kterého si všimnu, si stále víc uvědomuji nebezpečí, které představují nezvaní návštěvníci.\n\nJestli tolik slabin vidím já, představme si, co by dokázalo odhalit víc lidí se stejným pohledem na věc!"
 intrigue_scheming.1201.a: "Najmu skupinu... #EMP diskrétních#! spolčenců."
 intrigue_scheming.1201.b: "Můj vlastní pohled bohatě stačí!"
 intrigue_scheming.1202.desc: "„Takže byste měli udělat následující...“\n[hired_spy.GetTitledFirstName], #EMP mistrně#! ovládající umění nenápadnosti, [Select_CString(hired_spy.IsFemale,'prozkoumala','prozkoumal')] celý můj [ROOT.Char.Custom('FortifiedBuilding')] a [Select_CString(hired_spy.IsFemale,'děsila','děsil')] služebnictvo i dvořany, kdykoli se [Select_CString(hired_spy.IsFemale,'vynořila','vynořil')] z těch nejtemnějších koutů.\n\nNad poznámkami, které [hired_spy.GetTitledFirstName] [Select_CString(hired_spy.IsFemale,'pořídila','pořídil')], se pomalu rýsuje podrobný plán na posílení bezpečnosti."
 intrigue_scheming.1202.a: "Už teď se cítím bezpečněji!"
 intrigue_scheming.1202.b: "Pro někoho s tvým nadáním bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] najít využití."
 intrigue_scheming.1202.b.tt: "[hired_spy.GetTitledFirstName] zůstane u tvého dvora"
 intrigue_scheming.1202.c: "Tyhle znalosti se samozřejmě nesmí příliš rozšířit."
 intrigue_scheming.1401.t: "Střípky z daleka"
 intrigue_scheming.1401.desc_opening: "Při návštěvě místního tržiště mě zaujme kupec z daleké země.\n\n„Přistupte blíž, [ROOT.Char.Custom('FormOfAddressForLiege')]! Žasněte nad poklady, jaké v těchto končinách ještě nikdo neviděl!"
 intrigue_scheming.1401.desc1: "Dostat tyhle krásky ven, to chtělo mít oči na stopkách. Spát s oběma očima zavřenýma nepřipadalo v úvahu.“"
 intrigue_scheming.1401.desc2: "Proklouznout s těmihle kráskami přímo kolem stráží nebylo nic těžkého. Na lidi mám zkrátka nos.“"
 intrigue_scheming.1401.desc3: "Kvůli těmhle kráskám bylo nutné splynout s davem. Vskutku otřesný zážitek.“"
 intrigue_scheming.1401.desc_ending: "\n\nTenhle kupec mi možná může nabídnout víc než jen divy z dalekých krajů."
 intrigue_scheming.1401.a: "„Při tolika cestách musíte zažívat spoustu zajímavých věcí!“"
 intrigue_scheming.1401.a.tt: "#F Přesvědčíš kupce, aby se s tebou podělil o své postřehy.#!"
 intrigue_scheming.1401.a.success: "Přesvědčíš kupce"
 intrigue_scheming.1401.a.failure: "Kupce se ti přesvědčit nepodaří"
 intrigue_scheming.1401.b: "#EMP Řekne#! mi všechno, co ví!"
 intrigue_scheming.1401.b.penalty: "Tvé chování rozhněvá poddané"
 intrigue_scheming.1401.c: "„Tohle by mělo stačit na cetku i informace.“"
 intrigue_scheming.1601.t: "Věci, které víme"
 intrigue_scheming.1601.desc: "Musím přiznat, že pohled na [blackmailed_vassal.GetTitledFirstName], když vyšlo najevo, co všechno vím, mi působil jisté potěšení.\n\nKdyž si mě vezme stranou do soukromí, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('blackmailed_vassal'))] chce vědět, co se s tím dá dělat."
 intrigue_scheming.1601.a: "Trocha zlata zmůže hodně."
 intrigue_scheming.1601.b: "Znám někoho, na koho chci udělat dojem..."
 intrigue_scheming.1601.c: "Nedá se s tím nic dělat. Chci jen, aby tě to trápilo."
 intrigue_scheming.2001.t: "[Select_CString(future_mentor.IsFemale,'Učitelka','Učitel')]"
 intrigue_scheming.2001.desc: "„Váš zájem o umění... úskoků mi neunikl, [ROOT.Char.Custom('FormOfAddressForLiege')]. Možná vám dokážu pomoci proniknout ještě hlouběji.“\n\n[future_mentor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('future_mentor') )], se [future_mentor.Custom('quirk_pos_adverb')] usměje a připojí se ke mně. Místem našeho setkání je [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetRandomCampBuilding'),'mé zahrady')]. Pověst [future_mentor.GetTitledFirstName] v těchto uměních sotva kdo překoná a já #EMP chci#! své znalosti pletichářství prohloubit."
 intrigue_scheming.2001.a: "„Veď mě.“"
 intrigue_scheming.2001.b: "Bylo by naivní důvěřovat někomu s takovými schopnostmi."
 intrigue_scheming.2101.t: "Zajímavá nabídka"
 intrigue_scheming.2101.desc: "„Doslechlo se ke mně, [ROOT.Char.Custom('FormOfAddressForLiege')], že byste možná potřebovali někoho s mým... nadáním.“ S úsměvem ke mně přistoupí má nová známost, [sneaky_person.GetTitledFirstName].\n\n„Pokud by se vám mé služby hodily, neváhejte o ně požádat.“"
 intrigue_scheming.2101.a: "Možná pro tebe nějaké využití najdu."
 intrigue_scheming.2101.b: "Ty se na tuhle práci nehodíš."
 intrigue_scheming.2102.t: "Otázka věrnosti"
 intrigue_scheming.2102.desc: "Stojím ve stínu [ROOT.Char.Custom('GetCourtyard')] a sleduji, jak [sneaky_person.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sneaky_person') )], mizí v noci.\n\nDalší večer, další tajemná schůzka a mé podezření vůči [sneaky_person.GetTitledFirstName] jen sílí."
 intrigue_scheming.2102.a: "[sneaky_person.GetFirstNameNoTooltip], co máš za lubem?!"
 intrigue_scheming.2102.a.tt: "[sneaky_person.GetTitledFirstName] si tvého pátrání nevšimne"
 intrigue_scheming.2102.b.tt: "[sneaky_person.GetTitledFirstName] odhalí tvé pátrání"
 intrigue_scheming.2102.b: "Nejspíš o nic nejde."
 intrigue_scheming.2103.desc_not_noticed: "„Takže [sneaky_person.GetTitledFirstName] pracuje pro [sneaky_person_scheme_owner.GetTitledFirstName]?!“\n\nU [sneaky_person.GetTitledFirstName] najdu dopis, který neponechává prostor k pochybnostem. Celou dobu proti mně kuje pikle a náš údajně věrný vztah je jen zástěrkou."
 intrigue_scheming.2103.desc_noticed: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], co pro vás mohu udělat?“\n\nPřes veškerou snahu na [sneaky_person.GetTitledFirstName] nenacházím nic nekalého, snad kromě podivných nočních návyků."
 intrigue_scheming.2103.a: "Do žaláře s [sneaky_person.GetTitledFirstName]!"
 intrigue_scheming.2103.b: "Vyhoďte [sneaky_person.GetTitledFirstName]!"
 intrigue_scheming.2103.c: "Všichni máme své... #EMP potřeby#!, koneckonců."
 intrigue_scheming.3001.t: "Sluhové a páni"
 intrigue_scheming.3001.desc: "[hooked_courtier.GetTitledFirstName] je pevně v mé hrsti. Vztah mezi [hooked_courtier.GetTitledFirstName] a [new_target.GetTitledFirstName] je přitom jasný: [new_target.Custom2('RelationToMe', SCOPE.sC('hooked_courtier'))]. Se správnou strategií bych však [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] svou převahu ještě posílit.\n\nMožná by mi [hooked_courtier.GetFirstName] [Select_CString(hooked_courtier.IsFemale,'mohla','mohl')] pomoci rozšířit vliv i na [new_target.GetTitleTierName]?"
 intrigue_scheming.3001.a: "Pošlu [hooked_courtier.GetFirstNameNoTooltip] špehovat!"
 intrigue_scheming.3001.a.tt: "Pokud má [new_target.GetFirstNameNoTooltip] nějaká tajemství:\n   Dozvíš se jedno z nich"
 intrigue_scheming.3001.b: "Takhle zaručeně odhalíš tajemství [new_target.GetFirstNameNoTooltip]..."
 intrigue_scheming.3001.b.tt: "Pokud má [new_target.GetFirstNameNoTooltip] nějaká tajemství:\n   Dozvíš se jedno z nich\nPokud ne:"
 intrigue_scheming.3001.b.success: "Smyšlené tajemství"
 intrigue_scheming.3001.b.success_tt: "[hooked_courtier.GetFirstNameNoTooltip] „najde důkazy“ potvrzující jedno z tajemství, které skrývá [new_target.GetFirstNameNoTooltip]"
 intrigue_scheming.3001.b.failure: "Pomluva odhalena"
 intrigue_scheming.3001.c: "Ty jsi klíčem k nádherné pasti, [hooked_courtier.GetFirstNameNoTooltip]!"
 intrigue_scheming.3001.c.success: "Zinscenovaná vražda"
 intrigue_scheming.3001.c.failure_secret: "Past selhala"
 intrigue_scheming.3001.c.failure: "Past odhalena"
 intrigue_scheming.3001.c.failure.tt: "[new_target.GetFirstNameNoTooltip] se dozví o tvém podílu na vraždě"
 intrigue_scheming.3001.d: "Dej jasně najevo, jak snadno se k [new_target.GetTitledFirstName] dokážu dostat."
 intrigue_scheming.3001.d.success: "Má pověst mě předchází"
 intrigue_scheming.3001.d.failure: "Prázdné hrozby"
 intrigue_scheming.3001.z: "Rozšiř pár zvěstí o hrůze, kterou budím."
 intrigue_scheming.3003.desc: "[hooked_courtier.GetTitledFirstName] [Select_CString(hooked_courtier.IsFemale,'odvedla','odvedl')] svou práci dobře! Teď už znám tajemství [new_target.GetTitledFirstName] a dluh, který vůči mně [hooked_courtier.GetFirstName] [Select_CString(hooked_courtier.IsFemale,'měla','měl')], je splacen."
 intrigue_scheming.3003.a: "Nebylo to tak hrozné, jak jsi [Select_CString(hooked_courtier.IsFemale,'čekala','čekal')], že?"
 intrigue_scheming.3003.b: "A teď k vydírání..."
 intrigue_scheming.3004.desc: "[hooked_courtier.GetTitledFirstName] [Select_CString(hooked_courtier.IsFemale,'nedokázala','nedokázal')] najít žádné usvědčující informace o [new_target.GetTitledFirstName]. Přesto [Select_CString(hooked_courtier.IsFemale,'ta hlupačka','ten hlupák')] tvrdí, že vynaloženým úsilím svůj dluh vůči mně zcela [Select_CString(hooked_courtier.IsFemale,'splatila','splatil')]!"
 intrigue_scheming.3004.a: "Opravdu nevzbuzuji takový respekt, jak jsem si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]?"
 intrigue_scheming.3013.desc: "[hooked_courtier.GetTitledFirstName] [Select_CString(hooked_courtier.IsFemale,'nedokázala','nedokázal')] najít žádné usvědčující informace o [new_target.GetTitledFirstName], takže ještě že jsem si je [Select_CString(ROOT.Char.IsFemale,'připravila','připravil')] [Select_CString(ROOT.Char.IsFemale,'sama','sám')].\n\nKolem [new_target.GetFirstName] se náhle vyrojí odporné zvěsti a čirou náhodou mám všechny důkazy, které je potvrzují."
 intrigue_scheming.3013.a: "[ROOT.Char.GetFaith.TricksterGodName]! Kdo si pomůže sám, tomu pomůže i štěstí."
 intrigue_scheming.3014.desc: "[hooked_courtier.GetTitledFirstName] [Select_CString(hooked_courtier.IsFemale,'nedokázala','nedokázal')] najít žádné usvědčující informace o [new_target.GetTitledFirstName]. Bohužel se zdá, že pečlivě nastražené zvěsti nikoho příliš nezaujaly a obviněním, která jsem [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] vznést proti [new_target.GetTitledFirstName], nikdo nevěří.\n\nA co hůř, podařilo se vypátrat, že falešné zvěsti pocházejí ode mě!"
 intrigue_scheming.3014.a: "Co znamená pár neškodných lží mezi přáteli?"
 intrigue_scheming.3021.desc: "Křik je slyšet po celém [new_target.Custom('ResidenceBuilding')]. Přibíhající služebnictvo zastihne [Select_CString(new_target.IsFemale,'zmatenou','zmateného')] [new_target.GetTitledFirstName], jak zírá na zkrvavenou mrtvolu [hooked_courtier.GetTitledFirstName] ležící v [new_target.Custom('GetChamberPlural')]. Vedle těla leží [new_target.GetTitledFirstNamePossessive] nůž.\n\n„[Select_CString(new_target.IsFemale,'Byla','Byl')] jsem na zahradě [Select_CString(new_target.IsFemale,'sama','sám')], musíte mi věřit!“ naléhá [new_target.GetTitledFirstName] na shromážděný dav [new_target.Custom('GetCourtierPlural')]. Kdo by uvěřil tak chabé výmluvě?"
 intrigue_scheming.3021.a: "Miluji nechávat lidem dárky!"
 intrigue_scheming.3022.desc: "Můj pokus obvinit [new_target.GetTitledFirstName] skončil katastrofou! [hooked_courtier.GetFirstName] ještě [Select_CString(hooked_courtier.IsFemale,'dýchala','dýchal')], když [Select_CString(hooked_courtier.IsFemale,'ji','ho')] služebnictvo našlo krvácet v [new_target.Custom('GetChamberPlural')], kde [new_target.GetTitleTierName] přebývá.\n\nKdyž [new_target.GetFirstName] [Select_CString(new_target.IsFemale,'dorazila','dorazil')], zbýval [hooked_courtier.GetFirstName] už jen jediný nádech. „[ROOT.Char.GetTitledFirstName]...“"
 intrigue_scheming.3022.a: "[Select_CString(ROOT.Char.IsFemale,'Zabila','Zabil')] bych [hooked_courtier.GetTitledFirstName], kdyby už nebylo pozdě!"
 intrigue_scheming.3023.desc: "Mělo to být dokonalé, a přece... [hooked_courtier.GetTitledFirstName] [Select_CString(hooked_courtier.IsFemale,'měla','měl')] být [Select_CString(hooked_courtier.IsFemale,'nalezena','nalezen')] v [new_target.Custom('GetChamberPlural')], kde [new_target.GetTitleTierName] přebývá, s podříznutým hrdlem a po boku s nožem, který patří [new_target.GetTitledFirstName]. A právě v době, kdy [new_target.GetTitleTierName] [Select_CString(new_target.IsFemale,'neměla','neměl')] žádné alibi.\n\nJenže půl tuctu sluhů může potvrdit, že [new_target.GetTitledFirstName] toho dne [Select_CString(new_target.IsFemale,'vyjela','vyjel')] na projížďku, takže vraždu spáchat [Select_CString(new_target.IsFemale,'nemohla','nemohl')]."
 intrigue_scheming.3023.a: "Taková škoda dobré oběti!"
 intrigue_scheming.3031.desc: "Má pověst člověka, který si vždy prosadí svou bez ohledu na prostředky, mi znamenitě prospívá. Když se přede mnou krčí tolik mých vazalů a služebníků, netřeba mnoho, aby je ostatní následovali.\n\nStačilo, aby [hooked_courtier.GetTitledFirstName] jednoho večera [Select_CString(hooked_courtier.IsFemale,'zastihla','zastihl')] [new_target.GetTitledFirstName] o samotě a [Select_CString(hooked_courtier.IsFemale,'předala','předal')] dopis s mou pečetí. [new_target.GetTitleTierName] teď chápe, jak snadno se k [Select_CString(new_target.IsFemale,'ní','němu')] dokážu dostat."
 intrigue_scheming.3031.a: "Skoro škoda. Přesvědčovat lidi mě baví..."
 intrigue_scheming.3032.desc: "[hooked_courtier.GetTitledFirstName] [Select_CString(hooked_courtier.IsFemale,'zastihla','zastihl')] jedné noci [new_target.GetTitledFirstName] o samotě a [Select_CString(hooked_courtier.IsFemale,'předala','předal')] dopis s mou pečetí, aby bylo jasné, kam až sahá můj vliv. Jenže kýžený účinek se nedostavil. [new_target.GetTitleTierName] místo toho rychle [Select_CString(new_target.IsFemale,'propadla','propadl')] zálibě vyprávět každému o mých „planých výhrůžkách“!"
 intrigue_scheming.3032.a: "Možná ti ukážu, jak plané ve skutečnosti jsou..."
 intrigue_scheming.3041.t: "Váha vlivu"
 intrigue_scheming.3041.desc: "Těší mě, jak ochotně [vassal_target.GetTitledFirstName] plní mé rozkazy, ale [vassal_target.Custom2('RelationToMe', SCOPE.sC('liege_target'))] [liege_target.GetTitledFirstName] zůstává mimo můj dosah. Právě [vassal_target.GetFirstName] mi však může pomoci to změnit."
 intrigue_scheming.3041.a: "Lenní pán nese odpovědnost za činy svých vazalů..."
 intrigue_scheming.3041.a.success: "Strach z následků"
 intrigue_scheming.3041.a.failure: "Bez dojmu"
 intrigue_scheming.3041.b: "[vassal_target.GetFirstNameNoTooltip] mi pomůže nahnat [liege_target.GetTitledFirstName] strach!"
 intrigue_scheming.3041.b.torture_desc: "[vassal_target.GetFirstNameNoTooltip] z toho možná nevyjde úplně bez úhony"
 intrigue_scheming.3041.b.success: "Rozhodná ruka vždy zabere!"
 intrigue_scheming.3041.b.failure: "[liege_target.GetFirstNameNoTooltip] se nenechá zastrašit"
 intrigue_scheming.3041.c: "K dosažení svých cílů nepotřebuji pomoc."
 intrigue_scheming.3042.desc: "[liege_target.GetTitledFirstName] vypadá zděšeně, jako by skutečnost, že [vassal_target.GetTitledFirstName] stojí proti [Select_CString(liege_target.IsFemale,'ní','němu')], byla #EMP naprostým#! překvapením. „Ty jsi [Select_CString(vassal_target.IsFemale,'ochotná','ochotný')] podpořit jakýkoli požadavek tohohle... tohohle [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('liege_target'))]?!“\n\n[vassal_target.GetFirstName] podle plánu přísně přikývne. Usměji se na svou budoucí loutku. „Ani na okamžik si nemysli, že [vassal_target.GetFirstName] jedná [Select_CString(vassal_target.IsFemale,'sama','sám')].“"
 intrigue_scheming.3042.a: "Takže, co bych od tebe [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')]..."
 intrigue_scheming.3043.desc: "„Nemysli si, že mě tak snadno donutíš k poslušnosti!“ prohlásí [liege_target.GetTitledFirstName]. [vassal_target.GetTitledFirstName] jako by se před [liege_target.GetTitledFirstName] [Select_CString(vassal_target.IsFemale,'scvrkla','scvrkl')] a veškerá předchozí sebejistota, s níž mě [Select_CString(vassal_target.IsFemale,'měla','měl')] podpořit, je pryč.\n\n[liege_target.GetTitleTierName] zmaří mé poslední naděje. „Moji [liege_target.Custom('GetFollowerOrVassalPlural')] znají své místo.“ [vassal_target.GetFirstName] to svým mlčením jen potvrdí."
 intrigue_scheming.3043.a: "Tohle už bylo příliš..."
 intrigue_scheming.3051.desc: "Na pozvání [vassal_target.GetTitleTierName] jsem [Select_CString(ROOT.Char.IsFemale,'vylákala','vylákal')] [liege_target.GetTitledFirstName] do žaláře [vassal_target.GetTitledFirstName]. Tam čekám [Select_CString(ROOT.Char.IsFemale,'připravená','připravený')], abych [Select_CString(ROOT.Char.IsFemale,'předvedla','předvedl')] svou moc mučením našeho hostitele. [liege_target.GetFirstName] však zareaguje úplně jinak, než čekám.\n\n„Člověk by řekl, že tohle děláš poprvé!“\nV šoku sleduji, jak [liege_target.GetTitledFirstName] převezme otěže a zařídí, aby [vassal_target.GetFirstName] [Select_CString(vassal_target.IsFemale,'vydržela','vydržel')] až do úsvitu. Ani o chvíli déle."
 intrigue_scheming.3051.a: "Jak hrůzná podívaná!"
 intrigue_scheming.3051.b: "Tolik jsem se toho [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')]!"
 intrigue_scheming.3052.desc: "Na pozvání [vassal_target.GetTitleTierName] jsem [Select_CString(ROOT.Char.IsFemale,'vylákala','vylákal')] [liege_target.GetTitledFirstName] do žaláře [vassal_target.GetTitledFirstName]. Tam čekám, abych [Select_CString(ROOT.Char.IsFemale,'odhalila','odhalil')], že náš hostitel je vězněm ve vlastním sídle.\n\nMožná jsem se s životem [vassal_target.GetTitledFirstName] v rukou [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] trochu unést, ale podařilo se mi z toho vytvořit jemné poselství o tom, že očekávám naprostou poslušnost."
 intrigue_scheming.3052.a: "I přes křik [vassal_target.GetFirstNameNoTooltip] [liege_target.GetFirstNameNoTooltip] pochopí, o co mi jde."
 intrigue_scheming.3053.desc: "Na pozvání [vassal_target.GetTitleTierName] jsem [Select_CString(ROOT.Char.IsFemale,'vylákala','vylákal')] [liege_target.GetTitledFirstName] do žaláře [vassal_target.GetTitledFirstName]. Tam čekám, abych [Select_CString(ROOT.Char.IsFemale,'odhalila','odhalil')], že náš hostitel je vězněm ve vlastním sídle.\n\nMoje ukázka mučení však [liege_target.GetFirstName] nezastraší tak, jak jsem [Select_CString(ROOT.Char.IsFemale,'očekávala','očekával')]. „Takoví zvrhlíci jako ty mě nikdy nevyděsí, [ROOT.Char.GetTitledFirstName]!“"
 intrigue_scheming.3053.a: "Po tomhle mě nerozveselí ani prosby [vassal_target.GetFirstNameNoTooltip] o milost."
 intrigue_scheming.3061.t: "Zpochybněný původ"
 intrigue_scheming.3061.desc: "Celé dny posedle zkoumám rodovou linii [target.GetDynasty.GetBaseName] a teď už mám jasno. [target.GetTitledFirstName] nemá žádný způsob, jak nezvratně prokázat své otcovství vůči [heir.GetTitledFirstName]!\n\nKde chybějí důkazy, dají se nějaké podstrčit... Je načase přepsat pravdu o původu [heir.GetFirstName]!"
 intrigue_scheming.3061.a: "[new_father.GetTitledFirstNameNoTooltip] by byl výborným otcem."
 intrigue_scheming.3061.b: "[mother.GetTitledFirstNameNoTooltip] se spustila se sluhou?! Ta hanba!"
 intrigue_scheming.3061.c: "A hlavní role připadne mně!"
 intrigue_scheming.3061.d: "Všechny ty znalosti rodové historie by se mohly hodit i k něčemu jinému."
 intrigue_scheming.3061.success: "Nové důkazy"
 intrigue_scheming.3061.c.success_tt: "Budeš moci odhalit [heir.GetTitledFirstNameNoTooltip] jako své nemanželské dítě"
 intrigue_scheming.3061.failure: "Zneuctění rodové linie"
 intrigue_scheming.3061.a.success_tt: "Budeš moci odhalit, že [heir.GetTitledFirstNameNoTooltip] je nemanželské dítě, jehož otcem je [new_father.GetTitledFirstNameNoTooltip]"
 intrigue_scheming.3061.b.success_tt: "Budeš moci odhalit, že [heir.GetTitledFirstNameNoTooltip] je nemanželské dítě, jehož otcem je [commoner_target.GetTitledFirstNameNoTooltip]"
 intrigue_scheming.3062.opening: "Zvěsti se začaly šířit přesně podle mých představ. Nikdo samozřejmě nemůže s jistotou říct, jak to skutečně je — a právě o to jde!"
 intrigue_scheming.3062.ending: "Moji spolčenci hlásí, že dokonce i [target.GetTitledFirstName] hledí na [heir.GetTitledFirstName] s pochybnostmi a na [new_father.GetTitledFirstName] s nedůvěrou."
 intrigue_scheming.3062.a: "Zveřejním své „důkazy“!"
 intrigue_scheming.3062.b: "Ještě nenastal správný čas."
 intrigue_scheming.3062.b.tt: "#F Prozatím si toto „tajemství“ necháš pro sebe#!"
 intrigue_scheming.3063.opening: "„Ha, ty zvěsti jsou naprosto absurdní! To jen [ROOT.Char.GetTitledFirstName] šíří odporné lži.“\n\nMoji spolčenci hlásí, že [new_father.GetTitledFirstName] odmítá jakékoli tvrzení, podle něhož by [heir.GetTitledFirstName] [Select_CString(heir.IsFemale,'mohla','mohl')] být [Select_CString(heir.IsFemale,'dcerou','synem')] [target.GetTitledFirstName]."
 intrigue_scheming.3063.ending: "\n\nAni [target.GetTitledFirstName] zjevně nevěří, že by na mých zvěstech mohlo být něco pravdy, a veřejně mě [Select_CString(target.IsFemale,'odsoudila','odsoudil')] jako [Select_CString(ROOT.Char.IsFemale,'nestoudnou','nestoudného')] [Select_CString(ROOT.Char.IsFemale,'lhářku','lháře')], [Select_CString(ROOT.Char.IsFemale,'která','který')] nemá úctu k právoplatnému řádu věcí."
 intrigue_scheming.3063.a: "Protestuji! Vůbec se nestydím!"
 intrigue_scheming.3064.ending: "Moji spolčenci hlásí, že dokonce i [target.GetTitledFirstName] začíná pochybovat a hledí s nedůvěrou na [mother.GetTitledFirstName], [heir.GetTitledFirstName] i [commoner_target.GetTitledFirstName]."
 intrigue_scheming.3065.opening: "„Jako bych vůbec někdy dovolila nějakému poddanému jako [commoner_target.GetTitledFirstName], aby na mě sáhl.“\n\nMoji spolčenci hlásí, že [mother.GetTitledFirstName] ani na okamžik nezaváhala a okamžitě popřela zvěsti, které se o ní snažím šířit."
 intrigue_scheming.3066.desc: "Data, cesty, příležitosti k tajným schůzkám... Všechno do sebe zapadá a díky zvěstem, které jsem [Select_CString(ROOT.Char.IsFemale,'zasela','zasel')], začíná dokonce i [target.GetTitledFirstName] pochybovat o otcovství [heir.GetTitledFirstName].\n\nJe jen otázkou času, než někoho napadne, že pravděpodobným otcem jsem právě já..."
 intrigue_scheming.3066.a: "Pojď k tatínkovi, [heir.GetFirstNameNoTooltip]!"
 intrigue_scheming.3066.b: "Všechno má svůj čas. Všechno má svůj čas."
 intrigue_scheming.3067.opening: "Po všech těch zvěstech, které o [mother.GetTitledFirstName] šířím, jsem [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')], že se s ní setkám osobně.\n\n„Jak se opovažuješ říkat tak odporné věci o mně a mém dítěti?!“ Slova [mother.GetTitledFirstName] neštípou ani zdaleka tolik jako nečekaná facka přes tvář. „Blíž k mému doteku se už nikdy nedostaneš!“"
 intrigue_scheming.3067.a: "Zdá se, že jsem své protivníky špatně [Select_CString(ROOT.Char.IsFemale,'odhadla','odhadl')]..."
 intrigue_scheming.4021.t: "Výslech"
 intrigue_scheming.4021.desc: "Podle informací, které jsem [Select_CString(ROOT.Char.IsFemale,'získala','získal')], mám silné podezření, že [prisoner.GetTitledFirstName] zná tajemství, o němž já nevím. Jelikož je [prisoner.GetTitledFirstName] právě mým vězněm, mám dokonalou příležitost použít jakékoli prostředky, abych [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], o co přesně jde..."
 intrigue_scheming.4021.a: "Nabídnout [prisoner.GetTitledFirstName] propuštění výměnou za informace."
 intrigue_scheming.4021.a.success: "[prisoner.GetTitledFirstName] mou nabídku přijme"
 intrigue_scheming.4021.a.failure: "[prisoner.GetTitledFirstName] mou nabídku odmítne"
 intrigue_scheming.4021.b: "Psychologické hry dokážou odhalit překvapivě mnoho..."
 intrigue_scheming.4021.b.success: "Lstí přiměješ [prisoner.GetTitledFirstName] prozradit, co ví"
 intrigue_scheming.4021.b.failure: "[prisoner.GetTitledFirstName] odolá tvým psychologickým hrám"
 intrigue_scheming.4021.c: "Vyhrožovat [prisoner.GetTitledFirstName] mučením, dokud se nepřizná!"
 intrigue_scheming.4021.c.success: "Tvé výhrůžky vyděsí [prisoner.GetTitledFirstName] natolik, že se přizná"
 intrigue_scheming.4021.c.failure: "Zdá se, že tvé výhrůžky [prisoner.GetTitledFirstName] vůbec nevyvedou z míry"
 intrigue_scheming.4021.success: "Dozvíš se [Concept('secret','tajemství')|E], které zná [prisoner.GetTitledFirstName]"
 intrigue_scheming.4021.failure: "Nedozvíš se nic důležitého"
 intrigue_scheming.4040.t: "Šíření podezření"
 intrigue_scheming.4040.desc: "Je všeobecně známo, že [ROOT.Char.Custom('GetCourtierPlural')] kují pikle a intrikují, ale možná bych toho [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] využít ve svůj prospěch.\n\nPokud dokážu udržovat své [ROOT.Char.Custom('GetCourtierPlural')] ve vzájemném podezření a zaměstnat je vnitřními rozepřemi, nezbude jim čas ani prostředky na intriky proti mně!"
 intrigue_scheming.4040.a: "Okamžitě začnu šířit zvěsti!"
 intrigue_scheming.4040.a.success: "Zvěsti vyvolají mezi mými [ROOT.Char.Custom('GetCourtierPlural')] vzájemnou nedůvěru"
 intrigue_scheming.4040.a.success.tt: "[courtier_1.GetFirstName], [courtier_2.GetFirstName] a [courtier_3.GetFirstName] vůči sobě navzájem ztratí #N [EmptyScope.ScriptValue('medium_positive_opinion')|N0]#! [Concept('opinion','mínění')|E]."
 intrigue_scheming.4040.a.success.desc: "Zvěsti, které jsem [Select_CString(ROOT.Char.IsFemale,'rozšířila','rozšířil')] po svém [ROOT.Char.Custom('GetCourt')], vyvolaly mezi několika mými [ROOT.Char.Custom('GetCourtierPlural')] nedůvěru"
 intrigue_scheming.4040.a.failure: "Zvěsti jsou odmítnuty jako bezvýznamné žvásty"
 intrigue_scheming.4040.a.failure.tt: "Zvěsti, které jsi [Select_CString(ROOT.Char.IsFemale,'rozšířila','rozšířil')] po svém [ROOT.Char.Custom('GetCourt')], byly odmítnuty jako bezvýznamné žvásty"
 intrigue_scheming.4040.b: "Dokud mezi ně nasadím pár špehů, budu v bezpečí."
 intrigue_scheming.4040.c.dread: "Moji [ROOT.Char.Custom('GetCourtierPlural')] už vědí, že proti mně nemají intrikovat!"
 intrigue_scheming.4040.c.dread.tt: "Tato možnost je dostupná díky tvé vysoké [Concept('dread','hrůze')|E]."
 intrigue_scheming.4050.t: "Obchod s informacemi"
 intrigue_scheming.4050.desc.start: "Předpokládám, že [buyer.GetTitledFirstName] bude mít velký zájem o informace, podle nichž"
 intrigue_scheming.4050.desc.lover: "[owner.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))]) spí s [target.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.incest: "[owner.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))]) a [target.GetTitledFirstName] ([owner.Custom2('RelationToMeShort', SCOPE.sC('target'))]) spolu udržují incestní poměr..."
 intrigue_scheming.4050.desc.pregnancy: "[owner.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))]) čeká dítě s [target.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.bastard: "[target.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))]) má ve skutečnosti za otce [target.GetRealFather.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.murderattempt: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale,'stála','stál')] za neúspěšným pokusem zavraždit [target.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.murderattemptself: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale,'stála','stál')] za neúspěšným pokusem zavraždit [target.GetTitledFirstName]..."
 intrigue_scheming.4050.desc.murder: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale,'zavraždila','zavraždil')] [target.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))])..."
 intrigue_scheming.4050.desc.end: "\n\nMožná bude [buyer.GetTitledFirstName] mít dokonce takový zájem, že mi za ně nabídne něco hodnotného?"
 intrigue_scheming.4050.a: "Prodám [buyer.GetTitledFirstName] informace za zlato."
 intrigue_scheming.4050.b: "Tajemství za tajemství je férový obchod."
 intrigue_scheming.4050.b.tt: "[buyer.GetTitledFirstName] ti prozradí jedno tajemství, které zná"
 intrigue_scheming.4050.c: "Informace předám [buyer.GetTitledFirstName] jedině výměnou za laskavost."
 intrigue_scheming.4050.c.rival: "Ať je to nabídka smíru mezi námi."
 intrigue_scheming.4050.c.opinion: "Jako odměna mi postačí přízeň [buyer.GetTitledFirstName]."
 intrigue_scheming.4050.d: "Vědění je moc a já se ho tak snadno nevzdám."
 intrigue_scheming.4050.success: "[buyer.GetTitledFirstName] přijme tvou nabídku"
 intrigue_scheming.4050.failure: "[buyer.GetTitledFirstName] odmítne tvou nabídku"
 intrigue_scheming.4051.desc.start: "[seller.GetTitledFirstName] za mnou přichází, údajně s novým zjištěním, že"
 intrigue_scheming.4051.desc.lover: "někdo z mé blízké rodiny má mimomanželský poměr."
 intrigue_scheming.4051.desc.bastard: "legitimita mé rodové linie je ohrožena, pokud nezasáhnu."
 intrigue_scheming.4051.desc.murderattempt: "za neúspěšným pokusem zavraždit [target.GetTitledFirstName] stojí konkrétní osoba."
 intrigue_scheming.4051.desc.murderattemptself: "za neúspěšným pokusem o mou vraždu stojí konkrétní osoba."
 intrigue_scheming.4051.desc.murder: "za vraždou [target.GetTitledFirstName], [buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))], stojí konkrétní osoba."
 intrigue_scheming.4051.desc.incest: "v mé vlastní rodině dochází k incestnímu poměru!"
 intrigue_scheming.4051.desc.middle: "\n\n[seller.GetTitledFirstName] mi nabízí veškeré informace včetně jmen a důkazů,"
 intrigue_scheming.4051.desc.gold: "výměnou za jednorázovou platbu ve zlatě."
 intrigue_scheming.4051.desc.secret: "výměnou za podrobnosti o jiném tajemství, které znám."
 intrigue_scheming.4051.desc.favor: "výměnou za laskavost, kterou budu muset v budoucnu oplatit."
 intrigue_scheming.4051.desc.rival: "jako nabídku smíru mezi námi, abychom svou křivdu mohli odložit stranou."
 intrigue_scheming.4051.desc.opinion: "jako gesto dobré vůle."
 intrigue_scheming.4051.a: "Musím znát pravdu!"
 intrigue_scheming.4051.a.tt: "Dozvíš se podrobnosti o tomto neznámém tajemství"
 intrigue_scheming.4051.a.opinion: "To je vskutku velkorysé!"
 intrigue_scheming.4051.b: "Do některých věcí je lepší nevrtat..."
 intrigue_scheming.4052.desc: "Vidina tajemství, která mám v rukou, byla příliš lákavá a [buyer.GetTitledFirstName] mou nabídku [Select_CString(buyer.IsFemale,'přijala','přijal')]. Pokud budu dál slídit, možná se mi v budoucnu podaří uzavřít další podobné obchody..."
 intrigue_scheming.4052.a: "Tady se skrývá velký potenciál!"
 intrigue_scheming.4053.desc: "Těžko říct, zda mi [buyer.GetTitledFirstName] [Select_CString(buyer.IsFemale,'uvěřila','uvěřil')], když jsem [Select_CString(ROOT.Char.IsFemale,'prozradila','prozradil')], že mám informace týkající se rodiny. Ať tak či onak, mé podmínky [Select_CString(buyer.IsFemale,'odmítla','odmítl')] a [Select_CString(buyer.IsFemale,'poslala','poslal')] mě pryč s prázdnou."
 intrigue_scheming.4053.a: "Budu muset najít jiný způsob, jak tyto informace využít..."
 intrigue_scheming.4054.desc.start: "Po prostudování dokumentů od [seller.GetTitledFirstName] je zřejmé, že"
 intrigue_scheming.4054.desc.lover: "[owner.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))]) má poměr s [target.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.incest: "[owner.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))]) a [target.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))]) spolu udržují sexuální poměr!"
 intrigue_scheming.4054.desc.pregnancy: "[owner.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('owner'))]) čeká dítě s [target.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.bastard: "[target.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))]) má ve skutečnosti za otce [target.GetRealFather.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.murderattempt: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale,'stála','stál')] za neúspěšným spiknutím, jehož cílem bylo zavraždit [target.GetTitledFirstName]!"
 intrigue_scheming.4054.desc.murderattemptself: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale,'stála','stál')] za neúspěšným pokusem mě zavraždit!"
 intrigue_scheming.4054.desc.murder: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale,'zavraždila','zavraždil')] [target.GetTitledFirstName] ([buyer.Custom2('RelationToMeShort', SCOPE.sC('target'))])!"
 intrigue_scheming.4054.a: "Aspoň to teď vím."
 intrigue_scheming.4054.a.incest: "Nepřirozené! Koledují si o hněv božstva jménem [ROOT.Char.GetFaith.HighGodName]!"
 intrigue_scheming.4054.a.incest.deviant: "Ó, velmi svůdné!"
 intrigue_scheming.4054.a.incest.accepted: "Co je na tom vlastně špatného?"
 intrigue_scheming.4054.a.murder: "Ta proradná krysa!"
 intrigue_scheming.4054.a.bastard: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem [Select_CString(ROOT.Char.IsFemale,'zrazena','zrazen')]!"
 intrigue_scheming_special.1001.t: "Sehrát svou roli"
 intrigue_scheming_special.1001.desc: "Zaslechnutý šepot a ostrý pohled jsou posledními dílky skládačky. [courtier_spy.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('courtier_spy'))], se v umění intrik vyzná mnohem lépe, než dává ostatním najevo.\n\nVědomí, že se u dvora pohybuje někdo takový, mě poněkud znervózňuje. Pokud si však dokážu získat důvěru [courtier_spy.GetTitledFirstName], [Select_CString(ROOT.Char.IsFemale,'mohla bych se dozvědět','mohl bych se dozvědět')] mnohé."
 intrigue_scheming_special.1001.a: "Přesvědčím [courtier_spy.GetTitledFirstName], že jsme ze stejného těsta!"
 intrigue_scheming_special.1001.b: "Riziko je příliš velké. #EMP Já#! nemohu věřit #EMP [courtier_spy.GetTitledFirstName]#!."
 intrigue_scheming_special.1001.c: "[courtier_spy.GetTitledFirstName] musí pryč!"
 intrigue_scheming_special.1002.desc: "Trvá to mnoho dní, ale nakonec #EMP čirou náhodou#! narazím na [courtier_spy.GetTitledFirstName] právě ve chvíli, kdy je o samotě. „[courtier_spy.GetLadyLord|U] [courtier_spy.GetTitledFirstNameNoTooltip], už nějakou dobu jsem [Select_CString(ROOT.Char.IsFemale,'chtěla promluvit','chtěl promluvit')]—“\n„Kdybys [Select_CString(ROOT.Char.IsFemale,'vešla','vešel')] do místnosti a [Select_CString(ROOT.Char.IsFemale,'našla','našel')] tam svého manžela či manželku, jak křičí na mladé páže za to, že upustilo talíř, co bys [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]?“\n\nJe to zkouška? Možná je to má příležitost přesvědčit [courtier_spy.GetTitledFirstName], že máme mnoho společného."
 intrigue_scheming_special.1002.a: "Páže by samozřejmě dostalo trest."
 intrigue_scheming_special.1002.b: "Každý dělá chyby. Pážeti bych [Select_CString(ROOT.Char.IsFemale,'odpustila','odpustil')]."
 intrigue_scheming_special.1002.c: "Oba by mi museli říct, co se stalo."
 intrigue_scheming_special.1002.d: "Jistě by si s tím poradili lépe beze mě."
 intrigue_scheming_special.1002.e: "[Select_CString(ROOT.Char.IsFemale,'Pobídla','Pobídl')] bych je k rozhovoru. Ten vyřeší většinu problémů."
 intrigue_scheming_special.1002.f: "Hádka? Co nejrychleji bych [Select_CString(ROOT.Char.IsFemale,'odešla','odešel')]."
 intrigue_scheming_special.1002.g: "[Select_CString(ROOT.Char.IsFemale,'Začala','Začal')] bych křičet s nimi!"
 intrigue_scheming_special.1002.h: "[Select_CString(ROOT.Char.IsFemale,'Vyslechla','Vyslechl')] bych si obě verze sporu."
 intrigue_scheming_special.1003.desc_good: "„Hm.“ [courtier_spy.GetTitledFirstName] se na okamžik zamyslí a pak pokračuje.\n\n"
 intrigue_scheming_special.1003.desc_bad: "„Hm.“ [courtier_spy.GetTitledFirstName] se zašklebí, jako by právě [Select_CString(courtier_spy.IsFemale,'ochutnala','ochutnal')] něco kyselého, a pak pokračuje.\n\n"
 intrigue_scheming_special.1003.desc: "„Uprostřed pochodu do bitvy, právě když stavíte tábor, za tebou přijde důstojník a zeptá se, co má udělat s dopadeným špehem.“"
 intrigue_scheming_special.1003.a: "Ať je špeh výstrahou ostatním!"
 intrigue_scheming_special.1003.b: "Nejdřív bych se [Select_CString(ROOT.Char.IsFemale,'ujistila','ujistil')], že se se špehem zachází dobře."
 intrigue_scheming_special.1003.c: "Špeh? Na tom nezáleží. Pokračujeme v pochodu!"
 intrigue_scheming_special.1003.d: "Důstojník jistě ví, co dělat."
 intrigue_scheming_special.1003.e: "[Select_CString(ROOT.Char.IsFemale,'Promluvila','Promluvil')] bych si se špehem a [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], co mi řekne."
 intrigue_scheming_special.1003.f: "[Select_CString(ROOT.Char.IsFemale,'Požádala','Požádal')] bych důstojníka, ať to vyřeší a nechá mě na pokoji."
 intrigue_scheming_special.1003.g: "Špeh?! U nás by nikdy— To se přece nemůže stát!"
 intrigue_scheming_special.1003.h: "Je zřejmé, že špeh bude muset časem zodpovědět několik otázek."
 intrigue_scheming_special.1004.desc_good: "[courtier_spy.GetTitledFirstName] přikývne a předestře další situaci.\n\n"
 intrigue_scheming_special.1004.desc_bad: "[courtier_spy.GetTitledFirstName] svraští obočí a pohled zchladne.\n\n"
 intrigue_scheming_special.1004.desc: "„Učiníš rozhodnutí — dejme tomu, že zvýšíš všechny daně v jednom hrabství — a dozvíš se, že jeden z tvých vazalů toto rozhodnutí otevřeně zpochybňuje. Jak zareaguješ?“"
 intrigue_scheming_special.1004.a: "Trest je jediná možnost."
 intrigue_scheming_special.1004.b: "Každý můžeme mít jiný názor. Nevadilo by mi to."
 intrigue_scheming_special.1004.c: "Nikdo mě nebude takhle zpochybňovat! S vazalem bych si to [Select_CString(ROOT.Char.IsFemale,'vyříkala','vyříkal')]."
 intrigue_scheming_special.1004.d: "Pokud si můj vazal myslí, že je to špatné rozhodnutí, pak nejspíš opravdu je."
 intrigue_scheming_special.1004.e: "Celý dvůr by se doslechl o každé vazalově chybě."
 intrigue_scheming_special.1004.f: "[Select_CString(ROOT.Char.IsFemale,'Pokusila','Pokusil')] bych se tu urážku přejít. Není třeba dělat scénu."
 intrigue_scheming_special.1004.g: "No, [Select_CString(ROOT.Char.IsFemale,'postavila','postavil')] bych se mu. A pořádně nahlas."
 intrigue_scheming_special.1004.h: "Rozdílné názory se mají řešit rozhovorem."
 intrigue_scheming_special.1099.desc_won: "Tvář [courtier_spy.GetTitledFirstName] rozzáří překvapivě vřelý úsměv. „Zdá se, že máš zdravý úsudek.“\n\n[courtier_spy.GetTitledFirstName] [courtier_spy.Custom('quirk_pos_present')] a pak tichými kroky zamíří chodbou dál. „Pojď se mnou. Máme toho hodně k probrání.“"
 intrigue_scheming_special.1099.desc_lost: "[courtier_spy.GetTitledFirstName] se zamračí a o krok ustoupí. „[Select_CString(courtier_spy.IsFemale,'Ocenila','Ocenil')] bych, kdybys za mnou s tímhle už [Select_CString(ROOT.Char.IsFemale,'nechodila','nechodil')].“\n\nNež stačím odpovědět, [courtier_spy.GetTitledFirstName] už kráčí chodbou pryč a s každým krokem se hlouběji noří do stínů."
 intrigue_scheming_special.1099.a: "Raději budu v téhle šarádě ještě chvíli pokračovat."
 intrigue_scheming_special.1099.b: "[courtier_spy.GetTitledFirstName] je skutečně záhada."
 intrigue_scheming_special.1301.t: "Pronásledování stíny"
 intrigue_scheming_special.1301.desc: "Kroky ozývající se temnými chodbami, přemístěné listiny v mé pracovně, stín zahlédnutý koutkem oka..."
 intrigue_scheming_special.1301.desc_mentor_or_other: "\n\n„Myslíš, že tě někdo sleduje?“ [mentor_or_other.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('mentor_or_other'))], se nad tím chvíli zamýšlí a pak přikývne. „I #EMP já#! jsem si v poslední době [Select_CString(mentor_or_other.IsFemale,'všimla','všiml')] několika podezřelých věcí v [ROOT.Char.Custom('FortifiedBuilding')].“"
 intrigue_scheming_special.1301.a: "Musím tomu přijít na kloub!"
 intrigue_scheming_special.1301.b: "Postarám se, abych se o svou bezpečnost už nikdy [Select_CString(ROOT.Char.IsFemale,'nemusela','nemusel')] strachovat."
 intrigue_scheming_special.1302.desc: "[Select_CString(ROOT.Char.IsFemale,'Ukrytá','Ukrytý')] v jedné z odlehlejších chodeb, která vede k nejodlehlejším komnatám i do zahrad [ROOT.Char.Custom('FortifiedBuilding')], čekám a pozoruji.\n\n#EMP Nebyla chyba sem chodit? Možná kdybych#!— Kroky. Tiše se blíží chodbou a ze stínů vystupuje postava.\n\nCo tady dělá [sneaky_courtier.GetTitledFirstName]?"
 intrigue_scheming_special.1302.a: "Okamžitě [Select_CString(sneaky_courtier.IsFemale,'ji','ho')] konfrontuji!"
 intrigue_scheming_special.1302.a.tt: "Pokud je [sneaky_courtier.GetFirstName] [Select_CString(sneaky_courtier.IsFemale,'zapojena','zapojen')] do intriky, odhalíš ji\nPokud ne, tvůj pokus vypátrat špeha selže"
 intrigue_scheming_special.1302.b: "Musím mít jistotu. Budu [sneaky_courtier.GetTitledFirstName] dál sledovat."
 intrigue_scheming_special.1302.b.tt1: "[sneaky_courtier.GetTitledFirstName] si tě nevšimne"
 intrigue_scheming_special.1302.b.tt2: "[sneaky_courtier.GetTitledFirstName] tě zaslechne při sledování"
 intrigue_scheming_special.1302.c: "Neodhalím se. [sneaky_courtier.GetTitledFirstName] to být nemůže."
 intrigue_scheming_special.1302.c.tt: "Budeš pokračovat v pátrání po špehovi."
 intrigue_scheming_special.1303.desc_exposed: "Už nemusím [sneaky_courtier.GetTitledFirstName] sledovat a zjišťovat, co má za lubem — je známo, že [sneaky_courtier.GetTitledFirstName] špehuje!\n\nSnad příště rozpoznám varovná znamení ještě dřív... Tohle poznání jsem si [Select_CString(ROOT.Char.IsFemale,'musela draze vykoupit','musel draze vykoupit')]!"
 intrigue_scheming_special.1303.desc_sneak_win: "Daří se mi sledovat [sneaky_courtier.GetTitledFirstName] bez jediného zvuku. [sneaky_courtier.GetTitledFirstName] spěchá jednou chodbou za druhou a po několika minutách projde přímo kolem mých komnat a vyjde ven do zahrad. [ROOT.Char.Custom('FortifiedBuilding')|U] zůstává hned za námi."
 intrigue_scheming_special.1303.desc_sneak_win_spy: "Daří se mi sledovat [sneaky_courtier.GetTitledFirstName] bez jediného zvuku a s každým krokem blíž k mým soukromým komnatám cítím, jak se mi zrychluje tep.\n\nBrzy se chodbou rozlehne cvaknutí zámku mých soukromých komnat."
 intrigue_scheming_special.1303.desc_sneak_fail: "Sleduji [sneaky_courtier.GetTitledFirstName], aniž si mě všimne, a jak se blížíme k mým soukromým komnatám a zahradám, srdce mi bije čím dál rychleji. [ROOT.Char.Custom('FortifiedBuilding')|U] je už nedaleko. Co tady [sneaky_courtier.GetTitledFirstName] dělá? Rozptýlí mě to natolik, že zavadím o vázu zdobící chodbu a ta se roztříští o podlahu.\n\nNásledující rámus téměř přehluší spěšné kroky vzdalující se chodbou a [sneaky_courtier.GetTitledFirstName] brzy zmizí v temnotě."
 intrigue_scheming_special.1303.a: "Konfrontovat [sneaky_courtier.GetTitledFirstName]!"
 intrigue_scheming_special.1303.b: "Budu si muset dávat pozor."
 intrigue_scheming_special.1303.c: "No, dnes #EMP je#! opravdu krásná noc."
 intrigue_scheming_special.1303.c.tt: "Své podezření jsi [Select_CString(ROOT.Char.IsFemale,'nechala za sebou','nechal za sebou')] a [Select_CString(ROOT.Char.IsFemale,'získala cennou zkušenost','získal cennou zkušenost')].\n"
 intrigue_scheming_special.1303.d: "Ale znamení se mi podařilo rozpoznat včas!"
 intrigue_scheming_special.1304.desc_found: "Já to [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')]! Jen taktak se stáhnu do temného objetí stínů, když se chodbou objeví [sneaky_courtier.GetTitledFirstName] a zamíří přímo k mým komnatám.\n\nCvaknutí odemykaného zámku vzápětí vystřídá vyjeknutí [sneaky_courtier.GetTitledFirstName], když položím ruku [Select_CString(sneaky_courtier.IsFemale,'na její rameno','na jeho rameno')]."
 intrigue_scheming_special.1304.desc_not_found: "Noc se vleče, ale chodba zůstává tichá. Není slyšet ani šepot a nikde se neobjeví žádný hrozivý stín.\n\nMožná jsem přece jen [Select_CString(ROOT.Char.IsFemale,'měla sledovat','měl sledovat')] [sneaky_courtier.GetTitledFirstName]?"
 intrigue_scheming_special.1304.a: "„Myslím, že půjdeš se mnou.“"
 intrigue_scheming_special.1304.b: "A co když tu od začátku žádná hrozba nebyla?"
 intrigue_scheming_special.1350.desc: "Teď, když [sneaky_courtier.GetTitledFirstName] [Select_CString(sneaky_courtier.IsFemale,'zemřela','zemřel')], se už nikdy nedozvím, zda proti mně skutečně něco [Select_CString(sneaky_courtier.IsFemale,'chystala','chystal')]... Mé pátrání mě však mnohému naučilo a příště už nebudu tápat!"
 intrigue_scheming_special.1350.a: "Byla ta smrt požehnáním, nebo jen náhodou?"
 intrigue_scheming_special.1398.desc: "„Proč mě z něčeho takového obviňuješ?!“ ptá se [sneaky_courtier.GetTitledFirstName] a v hlase zní [sneaky_courtier.Custom('GeneralTemperament')]. „Jen jsem se [Select_CString(sneaky_courtier.IsFemale,'šla nadýchat','šel nadýchat')] čerstvého vzduchu do zahrad.“\n\nTeď, když vidím bolest v očích [sneaky_courtier.GetTitledFirstName], nechápu, jak mě vůbec mohlo napadnout, že [sneaky_courtier.GetTitledFirstName] je špeh."
 intrigue_scheming_special.1398.a: "Snad mi [sneaky_courtier.GetTitledFirstName] odpustí."
 intrigue_scheming_special.1399.desc: "Položím ruku [Select_CString(sneaky_courtier.IsFemale,'na její rameno','na jeho rameno')] a [sneaky_courtier.GetTitledFirstName] se otočí rychlostí blesku. [Select_CString(sneaky_courtier.IsFemale,'Přistižená přímo při činu','Přistižen přímo při činu')], [sneaky_courtier.GetTitledFirstName] se ani nepokusí nic zapírat.\n\nCelá tahle záležitost mi dala cennou lekci o důvěře a ostražitosti a teď mi jen tak něco neunikne!"
 realm_has_more_than_2_siegeable_holdings_trigger_desc: "Dvě nebo více nepřátelských držav lze obléhat"
 realm_has_more_than_2_siegeable_holdings_trigger_desc_not: "Méně než 2 nepřátelské državy lze obléhat"
 intrigue_scheming.1801.t: "Anonymní informátor"
 intrigue_scheming.1801.desc: "a podá mi právě doručený anonymní dopis. Zdá se, že máme jedinečnou příležitost získat informace o obranných strategiích [enemy.GetTitledFirstNamePossessive].\n\nV dopise stojí:\n\n„Pokud toužíte po informacích o [enemy.GetFirstNamePossessiveNoTooltip] obraně, ať se se mnou [spymaster.GetCouncilTitle] [spymaster.GetFirstNameNoTooltip] do čtrnácti dnů setká v [meeting_place.GetName]. Přineste dostatek zlata.“"
 intrigue_scheming.1801.a: "Byla by hloupost to neprošetřit."
 intrigue_scheming.1801.b: "Tohle není nic než obyčejné vydírání."
 intrigue_scheming.1801_landed: "Do místnosti přiběhne [spymaster.GetFirstName], [spymaster.GetCouncilTitle],"
 intrigue_scheming.1801_laamp: "Do stanu přiběhne [spymaster.GetFirstName], [GetCourtPositionType('second_camp_officer').GetNameNoTooltip],"
 intrigue_scheming.1802.intro_desc: "Po návratu ze schůzky s anonymním informátorem [spymaster.GetFirstName] s vážným výrazem rozloží přede mě svazek pergamenů, na nichž jsou podle všeho zaznamenány obranné taktiky mého nepřítele."
 intrigue_scheming.1802.g_high_skill_desc: "$intrigue_scheming.1802.intro_desc$\n\nPokud to dokážu posoudit, tyto nákresy [enemy.GetFirstNamePossessive] obranných plánů vypadají naprosto věrohodně."
 intrigue_scheming.1802.g_medium_skill_desc: "$intrigue_scheming.1802.intro_desc$\n\nNákresy na pergamenu dávají smysl, ale několik detailů neodpovídá tomu, co už víme o [enemy.GetFirstNamePossessive] obvyklé strategii."
 intrigue_scheming.1802.decent_skill_desc: "$intrigue_scheming.1802.intro_desc$\n\nDokument vypadá pravě, ale něco tu nehraje... Jen nedokážu určit co."
 intrigue_scheming.1802.fallback_desc: "$intrigue_scheming.1802.intro_desc$\n\nJe téměř nemožné určit, zda jsou tyto plány pravé."
 intrigue_scheming.1802.a: "Jednat podle informací."
 intrigue_scheming.1802.b: "Informace ignorovat."
 intrigue_scheming.1803.f_high_skill_desc: "$intrigue_scheming.1802.intro_desc$\n\nPři pročítání dokumentu nacházím v plánech příliš mnoho do očí bijících chyb na to, aby mohly být pravé. Napálili mě!"
 intrigue_scheming.1803.f_medium_skill_desc: "$intrigue_scheming.1802.intro_desc$\n\nNěkteré podrobnosti v plánech dávají smysl, ale mnohé vůbec neodpovídají tomu, co víme o [enemy.GetFirstNamePossessive] obvyklé obranné strategii."
 intrigue_scheming.1803.a: "Jednat podle informací."
 intrigue_scheming.1803.b: "Informace ignorovat."
 intrigue_scheming.1804.genuine_info_desc: "Právě dorazila zpráva od mých vojsk, která ve válce proti [enemy.GetTitledFirstName] obléhají [barony.GetName]. Podle jejich hlášení byly informace od anonymního informátora pravé!\n\nDíky této důvěrné znalosti [enemy.GetFirstNamePossessiveNoTooltip] obranné taktiky se jim podařilo dobýt [enemy.Custom('FortifiedBuilding')] v rekordním čase. Vítězství se zdá být téměř jisté!"
 intrigue_scheming.1804.fake_info_desc: "Právě dorazila zpráva od mých vojsk, která ve válce proti [enemy.GetTitledFirstName] obléhají [barony.GetName]. Podle jejich hlášení byly informace od anonymního informátora falešné!\n\nPřesto se jim podařilo dobýt [enemy.Custom('FortifiedBuilding')], ale cesta před námi bude náročná."
 intrigue_scheming.1804.rejected_fake_info_desc: "Právě dorazila zpráva od mých vojsk, která ve válce proti [enemy.GetTitledFirstName] obléhají [barony.GetName]. Podle jejich hlášení byly informace od anonymního informátora falešné!\n\n[ROOT.Char.GetFaith.HighGodName]! [Select_CString(ROOT.Char.IsFemale,'Ještě že jsem se těmi podvodnými listinami neřídila','Ještě že jsem se těmi podvodnými listinami neřídil')]!"
 intrigue_scheming.1804.a: "Musím uznat, že to byl dobrý obchod."
 intrigue_scheming.1804.b: "Musíme vytrvat!"
 intrigue_scheming.1804.c: "Rozhodnutí bylo správné."
 intrigue_scheming.1804.custom_tt: "Ty a každý velitel"
