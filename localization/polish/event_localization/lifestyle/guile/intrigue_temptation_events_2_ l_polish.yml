l_polish:
 intrigue_temptation.3100.cloth_t: "Jak krásné... vyšívání"
 intrigue_temptation.3100.stone_t: "Jak krásná... rytina"
 intrigue_temptation.3100.wax_t: "Jak krásné... rytí"
 intrigue_temptation.3100.wood_t: "Jak krásná... řezba"
 intrigue_temptation.3100.vellum_t: "Jak krásná... kresba"
 intrigue_temptation.3100.start_desc: "[ROOT.Char.Custom('lowly_servant_type')|U] mi nenápadně položí balíček po bok. Zívnu, sotva snáším tuhle žalostnou hostinu, a začnu jej rozbalovat.\n\nUvnitř nacházím"
 intrigue_temptation.3100.end_desc: "Na výjevu je [propositioning_courtier.GetWomanMan] s poněkud lichotivě zvýrazněnými přednostmi, [Select_CString(propositioning_courtier.IsFemale,'zkroucená','zkroucený')] do „svůdné“ pózy.\n\nOhromeně se rozhlédnu po [ROOT.Char.Custom('GetRoom')] a spatřím [propositioning_courtier.GetTitledFirstNameNoTooltip], jak na mě upřeně hledí. Na tváři se objeví úšklebek a obočí se začne zmítat jako dvě splašené housenky."
 intrigue_temptation.3100.cloth_desc: "potřísněný kus látky s neumělou výšivkou."
 intrigue_temptation.3100.stone_desc: "tenkou kamennou destičku s hrubě vyrytou kresbou."
 intrigue_temptation.3100.wax_desc: "páchnoucí voskovou tabulku s ledabyle vyrytým obrázkem."
 intrigue_temptation.3100.wood_desc: "dřevěnou destičku s neobratně vyřezaným obrázkem."
 intrigue_temptation.3100.vellum_desc: "list pergamenu s kaňkovitou kresbou inkoustem."
 intrigue_temptation.3100.a: "Jak nechutné!"
 intrigue_temptation.3100.a.tt: "Všechny cudné postavy v tvém [ROOT.Char.Custom('GetCourt')] k tobě získají o něco větší respekt"
 intrigue_temptation.3100.b: "Další nedočkavý hlupák, další tajemství."
 intrigue_temptation.3100.b.tt: "Pokusíš se z [propositioning_courtier.GetShortUINameNoTooltip] vylákat tajemství"
 intrigue_temptation.3100.b.tt.secret_gained: "V posteli [propositioning_courtier.GetShortUINameNoTooltip] vypráví tak zajímavé věci."
 intrigue_temptation.3100.b.tt.xp_gained: "Bohužel [propositioning_courtier.GetShortUINameNoTooltip] nic neví."
 intrigue_temptation.3100.cloth_c: "[propositioning_courtier.GetWomanMan|U] s tak šikovnými prsty..."
 intrigue_temptation.3100.stone_c: "Páni, ta postava vypadá opravdu #EMP pevně#!..."
 intrigue_temptation.3100.wax_c: "Páni, ten vosk je ještě teplý..."
 intrigue_temptation.3100.wood_c: "To vypadá přímo k nakousnutí..."
 intrigue_temptation.3100.vellum_c: "Takže [propositioning_courtier.GetTitledFirstNameNoTooltip] se [Select_CString(propositioning_courtier.IsFemale,'ráda','rád')] umaže..."
 intrigue_temptation.3100.d: "Myslím, že si to zaslouží veřejnou výstavu."
 public_shamer_modifier: "Sdílení amatérského umění"
 intrigue_temptation.3110.t: "Trocha experimentování"
 intrigue_temptation.3110.start_desc: "Dlouhý večer věnovaný státním záležitostem s [potential_deviant.GetTitledFirstNameNoTooltip] se pomalu zvrhl v pořádnou pijatiku, při níž si s jazykem ztěžklým alkoholem vyměňujeme oplzlé historky.\n\nPrávě dokončuji vyprávění příběhu"
 intrigue_temptation.3110.end_desc: "když v očích svého společníka zahlédnu nevhodný záblesk.\n\nHlavou mi bezděčně proběhnou myšlenky na vydírání. Možná má [potential_deviant.GetTitledFirstNameNoTooltip] o tohle téma ve skutečnosti větší zájem, než si vůbec připouští?"
 intrigue_temptation.3110.0_desc: "o zakázané lásce mezi kozou a jezevcem,"
 intrigue_temptation.3110.1_desc: "o žalostné touze po vlastním nedosažitelném odrazu,"
 intrigue_temptation.3110.2_desc: "o nanejvýš nepravděpodobném vztahu s jedním koněm,"
 intrigue_temptation.3110.3_desc: "o pánovi, který svou půdu miloval až #EMP příliš#!,"
 intrigue_temptation.3110.4_desc: "o tom, jak tři chlípně naladění [ROOT.Char.GetFaith.PriestNeuterPlural|l] našli jeden nesmírně obnošený plstěný klobouk,"
 intrigue_temptation.3110.5_desc: "o milostných dobrodružstvích mého dědečka s jednou vychytralou rybou,"
 intrigue_temptation.3110.6_desc: "o jednom až příliš svůdně tvarovaném pečivu,"
 intrigue_temptation.3110.7_desc: "o oblíbeném pařezu jednoho bandity,"
 intrigue_temptation.3110.8_desc: "o svůdných půvabech jistých exotických mořských nestvůr,"
 intrigue_temptation.3110.9_desc: "o přirozených sklonech jistých barbarských kultur,"
 intrigue_temptation.3110.a: "Znám ještě pár podobných historek..."
 intrigue_temptation.3110.a.tt_success: "[potential_deviant.GetShortUINameNoTooltip] objeví novou zálibu"
 intrigue_temptation.3110.a.tt_fail: "[potential_deviant.GetShortUINameNoTooltip] je mou oplzlostí [Select_CString(potential_deviant.IsFemale,'znechucena','znechucen')]"
 intrigue_temptation.3110.b: "To už pro dnešek #EMP bohatě#! stačí, děkuji."
 intrigue_temptation.3120.t: "Toulavá srdce"
 intrigue_temptation.3120.desc: "Dnes večer už snad po dvanácté lenoším u dohasínajícího ohně s [tempted_guest.GetTitledFirstName]. Společné chvíle působí tak přirozeně a nenuceně, jako by [tempted_guest.GetTitledFirstNameNoTooltip] [Select_CString(tempted_guest.IsFemale,'pobývala','pobýval')] v [capital.GetNameNoTooltip] celé roky, ne pouhé týdny.\n\nKdyby jen [tempted_guest.GetFirstNameNoTooltip] [Select_CString(tempted_guest.IsFemale,'souhlasila','souhlasil')] zůstat natrvalo, mohly by tyhle dlouhé, poklidné večery pokračovat věčně. Samozřejmě, se správným postrčením..."
 intrigue_temptation.3120.a: "Ukážu ti, #EMP jak#! pohostinně se tu umím chovat."
 intrigue_temptation.3120.a.tt_success: "[tempted_guest.GetShortUINameNoTooltip] je [Select_CString(tempted_guest.IsFemale,'okouzlena','okouzlen')]"
 intrigue_temptation.3120.a.tt_fail: "[tempted_guest.GetShortUINameNoTooltip] je [Select_CString(tempted_guest.IsFemale,'znechucena','znechucen')]"
 intrigue_temptation.3120.b: "Stačí říct a snesu ti i měsíc z nebe."
 intrigue_temptation.3120.c: "Přípitek na příjemnou, byť pomíjivou společnost!"
 intrigue_temptation.3130.t: "S chladným srdcem"
 intrigue_temptation.3130.desc: "[rival_main.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ve mně probouzí tak slepý vztek, že si někdy sotva vzpomenu, proč se vlastně nenávidíme. Teď už na tom nezáleží: v náručí držím [rival_spouse.GetFirstName], [Select_CString(rival_spouse.IsFemale,'manželku','manžela')] [rival_main.GetFirstNameNoTooltip], a vášeň mezi námi plane.\n\nBrzy se díky mým jízlivým úsměvům a několika dobře zaplaceným klepnám [rival_main.GetFirstNameNoTooltip] všechno dozví. #EMP Postarám#! se, aby se to [Select_CString(rival_main.IsFemale,'dozvěděla','dozvěděl')].\n\nJediný zakázaný polibek tuhle rivalitu zpečetí."
 intrigue_temptation.3130.a: "[Select_CString(rival_spouse.IsFemale,'Má drahá, už jsi někdy políbila','Můj drahý, už jsi někdy políbil')] #EMP [Select_CString(ROOT.Char.IsFemale,'skutečnou ženu','skutečného muže')]#!?"
 intrigue_temptation.3130.a.tt_success: "Jeden polibek, pak další..."
 intrigue_temptation.3130.a.tt_fail: "[rival_spouse.GetFirstNameNoTooltip] ucukne"
 intrigue_temptation.3130.b: "Tohle nedokážu."
 saucy_reputation_01_modifier: "Vypočítavý svůdce"
 saucy_reputation_02_modifier: "Vypočítavý svůdce"
 saucy_reputation_03_modifier: "Vypočítavý svůdce"
 intrigue_temptation.3140.t: "Předvádění se"
 intrigue_temptation.3140.desc: "Dnes ráno mě čekalo příjemné setkání s někým ze služebnictva — [ROOT.Char.Custom('OppositeGenderedLowlyServantType')]. Vtipkovali jsme, smáli se a rozešli se v dobré náladě, jen proto, že jsem se trochu víc [Select_CString(ROOT.Char.IsFemale,'snažila','snažil')] být příjemnou společností.\n\nMožná bych tuhle nově nabytou sebejistotu ve flirtování [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] využít i jinde než v osobních záležitostech?"
 intrigue_temptation.3140.a: "Asi bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] o něco častěji hledět lidem do očí..."
 intrigue_temptation.3140.b: "Dlouhý dotek dokáže poškádlit duši."
 intrigue_temptation.3140.c: "Můj pohled by okouzlil i bytost jménem [ROOT.Char.GetFaith.DevilName]!"
 intrigue_temptation.3140.d: "Tohle všechno je pod mou úroveň."
 licentious_01_modifier: "Neobratné koketování"
 licentious_02_modifier: "Přehnané koketování"
 licentious_03_modifier: "Vypočítavé koketování"
 licentious_04_modifier: "Mistrovské koketování"
 licentious_05_modifier: "Ďábelské koketování"
 intrigue_temptation.3150.t: "Přistižení při činu"
 intrigue_temptation.3150.desc: "Soukromá komnata je jen spoře osvětlená a s [primary_seducee.GetTitledFirstName] se k sobě tiskneme tak těsně, že se naše rty téměř dotýkají. Noční vzduch je chladný, ale tělo [primary_seducee.GetTitledFirstNameNoTooltip] je na dotek rozpálené a dech přichází v krátkých, přerývaných nádeších.\n\nV tu nejhorší možnou chvíli vtrhne do [ROOT.Char.Custom('GetRoom')] [secondary_seducee.Custom2('MyCharacterIntroduction', ROOT.Char)] a už ode dveří spustí.\n\n„[Select_CString(ROOT.Char.IsFemale,'Vznešená','Vznešený')] [ROOT.Char.GetTitleAsNameNoTooltip], musíme probrat můj úspě— ach. Nevidím, že máte společnost.“"
 intrigue_temptation.3150.a: "Ale, [primary_seducee.GetFirstNameNoTooltip], vůbec jsem si tě [Select_CString(ROOT.Char.IsFemale,'nevšimla','nevšiml')]!"
 intrigue_temptation.3150.b: "Právě odcházíme. Někam do většího #EMP soukromí#!."
 intrigue_temptation.3150.b.tt_success: "[primary_seducee.GetFirstNameNoTooltip] se ušklíbne a následuje tě"
 intrigue_temptation.3150.b.tt_failure: "Nálada je pryč"
 intrigue_temptation.3150.c: "...[secondary_seducee.GetFirstNameNoTooltip], zavři dveře."
 intrigue_temptation.3150.c.tt_success: "Skončíš v posteli s oběma"
 intrigue_temptation.3150.c.tt_success.lovers: "Oba se stanou mými milenci."
 intrigue_temptation.3150.c.tt_failure: "Následují hořké výčitky"
 silver_tongued_modifier: "Výřečnost"
 quick_thinker_modifier: "Pohotový úsudek"
 intrigue_temptation.3160.t: "Extrémy vášně"
 intrigue_temptation.3160.desc: "„[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('sometime_rival'))|U] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('sometime_rival'))]!“ křičí [sometime_rival.GetTitledFirstName] a z té žumpy, které říká ústa, létají sliny. Zdá se, že [sometime_rival.GetWomanMan] si vůči mně [Select_CString(sometime_rival.IsFemale,'vypěstovala','vypěstoval')] pořádnou zášť, ale dnešní hádka je obzvlášť vášnivá. A plivavá.\n\nKdyž [sometime_rival.GetTitledFirstNameNoTooltip] rudne vzteky a těžce oddechuje, [Select_CString(ROOT.Char.IsFemale,'přísahala','přísahal')] bych, že pohled na okamžik sklouzne po mém těle níž, než se znovu prudce vrátí k mým očím.\n\nJe v té tváři opravdu vepsaný #EMP jen#! vztek?"
 intrigue_temptation.3160.a: "Vrhnout se vpřed a políbit [sometime_rival.GetTitledFirstNameNoTooltip]."
 intrigue_temptation.3160.a.tt_success: "[Select_CString(sometime_rival.IsFemale,'Překvapená','Překvapený')] [sometime_rival.GetShortUINameNoTooltip] polibek opětuje"
 intrigue_temptation.3160.a.tt_success.tt: "Potom si své pocity vyjasníme."
 intrigue_temptation.3160.a.tt_fail: "[Select_CString(sometime_rival.IsFemale,'Znechucená','Znechucený')] [sometime_rival.GetShortUINameNoTooltip] tě odstrčí"
 intrigue_temptation.3160.b: "Nestojíš ani za pozornost psa, natož za mou."
 intrigue_temptation.3161.desc: "O několik hodin později ležíme v posteli naprosto bez sil, kolem nás potrhaná prostěradla a rozbitý nábytek. Poprvé za celý týden jsme se s [sometime_rival.GetTitledFirstNameNoTooltip] konečně přestali hádat.\n\nHruď [sometime_rival.GetTitledFirstNameNoTooltip] se zvedá a klesá ve stále pomalejším rytmu; každou chvíli nejspíš přijde spánek."
 intrigue_temptation.3161.a: "Možná to byla celou dobu touha nás obou?"
 intrigue_temptation.3161.b: "[Select_CString(ROOT.Char.IsFemale,'Zažila','Zažil')] jsem lepší večery i na latríně!"
 intrigue_temptation.3161.b_flavour: "Popadnu šaty [sometime_rival.GetTitledFirstNameNoTooltip] a s chechotem uteču z místnosti."
 intrigue_temptation.3161.c: "Udusit [sometime_rival.GetTitledFirstNameNoTooltip] ve spánku."
 malignant_hearsay_modifier: "Zhoubné klepy"
 malignant_hearsay_modifier_desc: "Služebnictvo a prostý lid si šeptají, že tato osoba má něco společného s podezřelým úmrtím."
