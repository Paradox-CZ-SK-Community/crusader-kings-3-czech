l_polish:
 intrigue_temptation.2201.t: "Důvěrnosti v ložnici"
 intrigue_temptation.2201.desc: "Po našem posledním dostaveníčku spolu s [my_lover.GetFirstName] ležíme a nezávazně si povídáme.\n\n„A tomu bys nikdy nevěřil[Select_CString(ROOT.Char.IsFemale,'a','')]—“ [my_lover.GetFirstName] se náhle zarazí a zrudne. „Promiň, lásko, tohle pro tebe musí být strašná nuda...“"
 intrigue_temptation.2201.a: "Vůbec ne. Prosím, povídej dál..."
 intrigue_temptation.2201.a.success: "[my_lover.GetFirstName] se podělí o klepy ze dvora, kde vládne [court_owner.GetTitledFirstName]"
 intrigue_temptation.2201.a.success.tt: "Odhalíš [Concept('secret','tajemství')|E], které skrývá náhodná postava"
 intrigue_temptation.2201.a.failure: "[my_lover.GetFirstName] odmítne říct cokoli dalšího"
 intrigue_temptation.2201.b: "Tvůj hlas mě nikdy nenudí, lásko."
 intrigue_temptation.2201.d.sadistic: "Něco skrýváš... Řekni mi to, #EMP hned#!!"
 intrigue_temptation_special.1001.t: "O lásce a chtíči"
 intrigue_temptation_special.1001.desc: "Ty zasněné pohledy a teskné povzdechy mohou znamenat jediné – [wants_love.Custom2('MyCharacterIntroduction', ROOT.Char)] touží po lásce!\n\nMožná bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] prověřit své dohazovačské schopnosti a trochu tomuto trápení ulevit? [wants_love.GetTitledFirstName] by za to jistě byl[Select_CString(wants_love.IsFemale,'a vděčná',' vděčný')]!"
 intrigue_temptation_special.1001.a: "[wants_love.GetFirstNameNoTooltip] už dlouho osaměl[Select_CString(wants_love.IsFemale,'á','ý')] nezůstane!"
 intrigue_temptation_special.1001.a.tt: "Mezi [wants_love.GetTitledFirstName] a protějškem podle tvého výběru může vzniknout milostný poměr"
 intrigue_temptation_special.1001.b: "Musím se soustředit na vlastní manželství."
 intrigue_temptation_special.1001.c: "Musím se soustředit na vlastní milostný život."
 intrigue_temptation_special.1002.t: "Otázka vkusu"
 intrigue_temptation_special.1002.desc: "Abych pro [wants_love.GetTitledFirstName] našel[Select_CString(ROOT.Char.IsFemale,'a','')] dokonalý protějšek, musím zjistit víc o jeho či jejích představách. Když budu nenápadně sledovat, jak se [wants_love.GetTitledFirstName] chová u dvora k ostatním, možná zahlédnu něco z nejskrytějších tužeb...\n\nNež začnu, měl[Select_CString(ROOT.Char.IsFemale,'a','')] bych mít nějakou teorii. Co asi [wants_love.GetFirstNameNoTooltip] hledá u partnera?"
 intrigue_temptation_special.1002.a: "Spřízněnou duši s podobnou povahou."
 intrigue_temptation_special.1002.a.tt: "#F Většina lidí, zvláště empatičtí a laskaví, dává přednost partnerům s podobnou povahou.\n\nPokud je můj předpoklad chybný, mohu usoudit, že [wants_love.GetFirstName] dává přednost přitažlivosti nebo moci.#!"
 intrigue_temptation_special.1002.b: "Přitažlivost, ať už vzhledem, nebo povahou."
 intrigue_temptation_special.1002.b.tt: "#F Chtivé, arogantní nebo přitažlivé osoby obvykle dávají přednost pohledným, přátelským, odvážným či koketním partnerům.\n\nPokud je můj předpoklad chybný, mohu usoudit, že [wants_love.GetFirstName] dává přednost podobné povaze nebo moci.#!"
 intrigue_temptation_special.1002.c: "Moc a vliv."
 intrigue_temptation_special.1002.c.tt: "#F Lidé toužící po bohatství a úspěchu obvykle dávají přednost mocným partnerům.\n\nPokud je můj předpoklad chybný, mohu usoudit, že [wants_love.GetFirstName] dává přednost podobné povaze nebo přitažlivosti.#!"
 intrigue_temptation_special.1002.d: "Raději zjistím, zda [wants_love.GetTitledFirstName] dává přednost mužům, nebo ženám."
 intrigue_temptation_special.1002.d.tt: "#F Většina lidí dává přednost partnerům opačného pohlaví, ale není neobvyklé dávat přednost stejnému pohlaví nebo oběma.#!"
 intrigue_temptation_special.1003.t: "Dohazování"
 intrigue_temptation_special.1003.start.desc: "[wants_love.GetTitledFirstName] už nějakou dobu pozoruji a teď mám jasno."
 intrigue_temptation_special.1003.personality_success.desc: "Jak jsem předpokládal[Select_CString(ROOT.Char.IsFemale,'a','')], [wants_love.GetTitledFirstName] skutečně dává přednost lidem s podobnou povahou."
 intrigue_temptation_special.1003.personality_failure.desc: "Mýlil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem se. Na povaze [wants_love.GetTitledFirstName] zřejmě příliš nezáleží. U partnera tedy musí být důležitější moc nebo přitažlivost."
 intrigue_temptation_special.1003.sex_appeal_success.desc: "[wants_love.GetTitledFirstName] přitahují lidé s velkým šarmem a krásou jako můru plamen."
 intrigue_temptation_special.1003.sex_appeal_failure.desc: "Mýlil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem se – [wants_love.GetTitledFirstName] zjevně nerozlišuje mezi lidmi obdařenými krásou a těmi docela obyčejnými. Důležitější tedy musí být povaha... nebo moc."
 intrigue_temptation_special.1003.power_success.desc: "Jak jsem tušil[Select_CString(ROOT.Char.IsFemale,'a','')], [wants_love.GetTitledFirstName] vyhledává u dvora společnost těch nejvlivnějších pánů a dam."
 intrigue_temptation_special.1003.power_failure.desc: "Mýlil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem se. [wants_love.GetTitledFirstName] se stýká s lidmi vysokého i nízkého postavení. Přitahovat tedy musí něco jiného než moc – možná podobná povaha nebo oslnivý vzhled?"
 intrigue_temptation_special.1003.end.desc: "\n\nTeď, když už trochu lépe znám touhy [wants_love.GetFirstNameNoTooltip], sestavil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem seznam možných protějšků. Kdo by se k [ROOT.GetCharacter.Custom2('RelationToMe' , wants_love )] hodil nejlépe?"
 intrigue_temptation_special.1003.a: "[target_list_member_a.GetTitledFirstNameNoTooltip] – [target_list_member_a.Custom('ComplimentAdjective')]."
 intrigue_temptation_special.1003.a.tt: "Pokusíš se dát dohromady [wants_love.GetFirstName] a [target_list_member_a.GetTitledFirstName]"
 intrigue_temptation_special.1003.b: "[target_list_member_b.GetTitledFirstNameNoTooltip] – [target_list_member_b.Custom('ComplimentAdjective')] [target_list_member_b.GetWomanMan]."
 intrigue_temptation_special.1003.b.tt: "Pokusíš se dát dohromady [wants_love.GetFirstName] a [target_list_member_b.GetTitledFirstName]"
 intrigue_temptation_special.1003.c: "[target_list_member_c.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMe' , target_list_member_c )] – [target_list_member_c.Custom('ComplimentAdjective')]."
 intrigue_temptation_special.1003.c.tt: "Pokusíš se dát dohromady [wants_love.GetFirstName] a [target_list_member_c.GetTitledFirstName]"
 intrigue_temptation_special.1003.tt: "Dobrým protějškem bude někdo, kdo odpovídá představám [wants_love.GetFirstName]"
 intrigue_temptation_special.1004.t: "Navození nálady"
 intrigue_temptation_special.1004.start.desc: "Abych získal[Select_CString(ROOT.Char.IsFemale,'a','')] první představu o tom, jak se k sobě hodí, uspořádal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem malou večeři, na kterou jsem pozval[Select_CString(ROOT.Char.IsFemale,'a','')] [wants_love.GetTitledFirstName] i [chosen_match.GetTitledFirstName]."
 intrigue_temptation_special.1004.great.desc: "Většinu večeře spolu strávili hovorem a ve chvílích ticha po sobě pokradmu zvědavě pokukovali."
 intrigue_temptation_special.1004.good.desc: "Žádné jednoznačné náznaky jsem neviděl[Select_CString(ROOT.Char.IsFemale,'a','')], ale rozuměli si velmi dobře."
 intrigue_temptation_special.1004.bad.desc: "Bohužel po jiskření, které jsem očekával[Select_CString(ROOT.Char.IsFemale,'a','')], nebylo ani stopy. Snad za to mohla jen nervozita."
 intrigue_temptation_special.1004.end.desc: "\n\nMusím kout železo, dokud je žhavé, a dát [wants_love.GetFirstNameNoTooltip] a [chosen_match.GetFirstNameNoTooltip] další příležitost se setkat. Tentokrát připravím něco vzrušujícího, při čem budou moci sdílet společný zájem!"
 intrigue_temptation_special.1004.a: "Veselý tanec."
 intrigue_temptation_special.1004.b: "Napínavý lov."
 intrigue_temptation_special.1004.c: "Výprava za kontrolou místní infrastruktury."
 intrigue_temptation_special.1004.d: "Soukromá večeře s trochou „drbů“."
 intrigue_temptation_special.1004.e: "Večer poezie."
 intrigue_temptation_special.1004.tt: "Měl[Select_CString(ROOT.Char.IsFemale,'a','')] bys vybrat činnost, která bude podle schopností [wants_love.GetFirstName] i [chosen_match.GetFirstName] známá a příjemná"
 intrigue_temptation_special.1005.t: "Zkouška citů"
 intrigue_temptation_special.1005.great_diplomacy.desc: "Obvykle se nechlubím, ale tentokrát to musím říct — na tento tanec se bude vzpomínat ještě mnoho a mnoho let! Mám dokonce podezření, že včerejší večer zůstane drahou vzpomínkou jak pro [wants_love.GetFirstName], tak pro [chosen_match.GetFirstName]. Protancovali spolu téměř celý večer a nedokázali ze sebe spustit oči!"
 intrigue_temptation_special.1005.great_martial.desc: "Obvykle to neříkám, ale někdy jsem opravdu génius! [wants_love.GetFirstName] i [chosen_match.GetFirstName] si lov náramně užili. Spolupracovali, jako by se znali celý život, a zdaleka předčili všechny ostatní dvojice."
 intrigue_temptation_special.1005.great_stewardship.desc: "Pohled na [wants_love.GetFirstName] a [chosen_match.GetFirstName], jak jedou bok po boku, byl pastvou pro oči! Celé hodiny hovořili o mostech, mlýnech a zavlažovacích systémech, až nakonec zaostali za zbytkem výpravy. Kdo ví, do jakých oblastí se pak jejich rozhovor zatoulal, ale [wants_love.GetFirstName] vypadal[Select_CString(wants_love.IsFemale,'a naprosto okouzleně',' naprosto okouzleně')]."
 intrigue_temptation_special.1005.great_intrigue.desc: "[wants_love.GetFirstName] a [chosen_match.GetFirstName] mezi staré lišáky dokonale zapadli! Zanedlouho už udávali tón celému rozhovoru a s působivou rychlostí rozvíjeli jeden nápad za druhým. Málokdy jsem viděl[Select_CString(ROOT.Char.IsFemale,'a','')], aby dvě mysli pracovaly v tak dokonalém souladu!"
 intrigue_temptation_special.1005.great_learning.desc: "Málokdy jsem viděl[Select_CString(ROOT.Char.IsFemale,'a','')] někoho tak okouzleného jako [wants_love.GetFirstName] při poslechu [chosen_match.GetFirstName], který[Select_CString(chosen_match.IsFemale,'á přednášela',' přednášel')] [wants_love.GetFirstNamePossessive] báseň! U poslední sloky už [wants_love.GetFirstName] téměř slzel[Select_CString(wants_love.IsFemale,'a','')].\n\nPo přednesu spolu hovořili celé hodiny — ještě dlouho poté, co všichni ostatní hosté odešli."
 intrigue_temptation_special.1005.good_diplomacy.desc: "Zdálo se, že tanec zvedl náladu jak [wants_love.GetFirstName], tak [chosen_match.GetFirstName]. Díky mému nenápadnému pobízení spolu strávili spoustu času a podle jejich výrazů jsem si jist[Select_CString(ROOT.Char.IsFemale,'á','ý')], že si to užili."
 intrigue_temptation_special.1005.good_martial.desc: "Jak jsem předpokládal[Select_CString(ROOT.Char.IsFemale,'a','')], [wants_love.GetFirstName] i [chosen_match.GetFirstName] jsou zkušení lovci, stejně jistí v sedle jako na vlastních nohou. Vypadali, že si lov užívají, a zaslechl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, jak [chosen_match.GetFirstNameNoTooltip] velmi chválí [wants_love.GetFirstNameNoTooltip] za střelbu z luku."
 intrigue_temptation_special.1005.good_stewardship.desc: "Výprava za kontrolou infrastruktury možná není zrovna nejromantičtější prostředí, ale [wants_love.GetFirstName] i [chosen_match.GetFirstName] ji podle všeho považovali za zajímavou. Dlouze spolu hovořili o mlýnech a zavlažovacích systémech a společnost toho druhého jim očividně byla příjemná."
 intrigue_temptation_special.1005.good_intrigue.desc: "[wants_love.GetFirstName] a [chosen_match.GetFirstName] byli vítanými hosty našeho soukromého setkání a přinesli s sebou několik lákavých klepů. Oba odhalili stejné trapné tajemství o jistém šlechtici a s neskrývaným nadšením rozebírali všechny špinavé podrobnosti."
 intrigue_temptation_special.1005.good_learning.desc: "[wants_love.GetFirstName] a [chosen_match.GetFirstName] seděli jako očarovaní, zatímco moje čestná hostka přednášela svou báseň. Zřejmě se jich hluboce dotkla, protože o ní potom spolu diskutovali téměř hodinu."
 intrigue_temptation_special.1005.bad_diplomacy.desc: "K mé nelibosti se ukázalo, že tanec byl příšerný nápad."
 intrigue_temptation_special.1005.bad_martial.desc: "Obávám se, že představa lovu jako vhodné společné činnosti byla chybná."
 intrigue_temptation_special.1005.bad_stewardship.desc: "Zpětně viděno byla výprava za kontrolou místní infrastruktury špatný nápad."
 intrigue_temptation_special.1005.bad_intrigue.desc: "Myslel[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že malá soukromá večeře okořeněná zajímavým rozhovorem sblíží [wants_love.GetFirstName] a [chosen_match.GetFirstName], ale celé setkání se změnilo v nesnesitelně trapnou záležitost."
 intrigue_temptation_special.1005.bad_learning.desc: "Jak se ukázalo, poezie není pro každého."
 intrigue_temptation_special.1005.wants_love_struggled.desc: "Bylo téměř bolestivé sledovat, jak se [wants_love.GetFirstName] trápí. Po celou tu žalostnou záležitost se držel[Select_CString(wants_love.IsFemale,'a','')] stranou a na [chosen_match.GetFirstName] se ani jednou nepodíval[Select_CString(wants_love.IsFemale,'a','')]."
 intrigue_temptation_special.1005.chosen_match_struggled.desc: "Bylo téměř bolestivé sledovat, jak se [chosen_match.GetFirstName] trápí. Po celou tu žalostnou záležitost se držel[Select_CString(chosen_match.IsFemale,'a','')] stranou a na [wants_love.GetFirstName] se ani jednou nepodíval[Select_CString(chosen_match.IsFemale,'a','')]."
 intrigue_temptation_special.1005.great_status.desc: "\n\nDoufal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že můj malý podnik zlepší [wants_love.GetFirstNameNoTooltip] náladu, ale tak rychlé výsledky jsem nečekal[Select_CString(ROOT.Char.IsFemale,'a','')]! Pokud se v lidech opravdu tak strašně nepletu, mezi těmi dvěma rozhodně něco je."
 intrigue_temptation_special.1005.good_status_despite_bad_activity.desc: "\n\nNaštěstí se zdá, že ono trapné setkání nezadusilo city, které mezi nimi začaly klíčit. Na jisté závěry je ještě brzy, ale myslím, že se mi to možná podařilo."
 intrigue_temptation_special.1005.good_status.desc: "\n\nUž několik dní je pozoruji a teď jsem si jist[Select_CString(ROOT.Char.IsFemale,'á','ý')]. Je mezi nimi něco, co tam dříve nebylo."
 intrigue_temptation_special.1005.bad_status.desc: "\n\nJe načase přiznat porážku – [wants_love.GetFirstNameNoTooltip] a [chosen_match.GetFirstNameNoTooltip] spolu nikdy nebudou."
 intrigue_temptation_special.1005.a: "Vskutku skvělý pár!"
 intrigue_temptation_special.1005.b: "Na lidi mám opravdu dobrý odhad."
 intrigue_temptation_special.1005.c: "Láska je největší záhada."
 intrigue_temptation_special.1006.t: "Troufalý omyl"
 intrigue_temptation_special.1006.desc: "Abych posoudil[Select_CString(ROOT.Char.IsFemale,'a','')] kvalitu svého výběru, uspořádal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem malou večeři, na kterou jsem pozval[Select_CString(ROOT.Char.IsFemale,'a','')] [wants_love.GetTitledFirstName] i [chosen_match.GetTitledFirstName].\n\nSnažil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem se je přimět k rozhovoru, ale [not_interested.GetFirstNameNoTooltip] se k zamýšlenému protějšku choval[Select_CString(not_interested.IsFemale,'a chladně a odmítavě',' chladně a odmítavě')]. Místo toho neustále pokukoval[Select_CString(not_interested.IsFemale,'a','')] po pohledném [interesting_ladylord.GetLadyLord] o kus dál u stolu. Že by...?"
 intrigue_temptation_special.1006.a: "Příště si lidi prohlédnu pozorněji."
 intrigue_temptation_special.1007.t: "Pohled, který zahřeje"
 intrigue_temptation_special.1007.desc: "Po mnoho měsíců sleduji [wants_love.GetTitledFirstName] a [chosen_match.GetTitledFirstName] a hledám známky svého úspěchu. Dnes večer byla má zvědavost konečně ukojena.\n\nNa lavičce ukryté v nejbujnějším a nejtemnějším koutě mých zahrad jsem zahlédl[Select_CString(ROOT.Char.IsFemale,'a','')] ty dva hrdličky. Se spokojeným úsměvem na rtech jsem se stáhl[Select_CString(ROOT.Char.IsFemale,'a','')] zpět po zarostlé pěšině. Byli příliš zabraní do polibku, než aby si mě všimli."
 intrigue_temptation_special.1007.a: "Přeji jim jen to nejlepší."
 intrigue_temptation.3000.t: "Sladké sbohem"
 intrigue_temptation.3000.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], bylo mi... totiž... chtěl[Select_CString(guest_lover.IsFemale,'a','')] jsem říct, že mi bylo potěšením být tvým hostem zde v [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...“ koktá [guest_lover.GetFirstName], zatímco se chystá k odjezdu.\n\n„Poznal[Select_CString(guest_lover.IsFemale,'a','')] jsem #emphasis tebe#!. Už jen kvůli tomu stál můj pobyt za to. Ale přesto tě prosím... strávíš se mnou před odjezdem noc plnou vášně?“\n\n[guest_lover.GetFirstName] podlehl[Select_CString(guest_lover.IsFemale,'a','')] mé nenápadné manipulaci! Teď jen rozhodnout, jak této příležitosti využít."
 intrigue_temptation.3000.a: "Ano, lásko, pro tebe bych udělal[Select_CString(ROOT.Char.IsFemale,'a','')] #emphasis cokoli#!!"
 intrigue_temptation.3000.b: "Takže, drahoušku, co ta pověst o mém vazalovi?"
 intrigue_temptation.3000.c: "Zlatíčko, promluvíš si s [guest_lovers_friend.GetFirstNameNoTooltip]?"
 intrigue_temptation.3000.d: "Ach, nemohu... Tak už běž!"
 intrigue_temptation.3000.c.tt: "Využiješ [guest_lover.GetFirstName] k tomu, abys získal[Select_CString(ROOT.Char.IsFemale,'a','')] bližší přístup k [guest_lovers_friend.GetFullName]"
 intrigue_temptation.3000.b.tt: "Pokusíš se přimět [guest_lover.GetFirstName] k prozrazení tajemství svého vazala"
 intrigue_temptation.3000.b.success: "[guest_lover.GetFirstName] ti prozradí tajemství!"
 intrigue_temptation.3000.b.failure: "[guest_lover.GetFirstName] během vašeho milování nic neprozradí..."
 yearly.3000.b.success.desc: "Úspěšně přiměješ [guest_lover.GetFirstName] k řeči"
 yearly.3000.b.success.tt: "Odhalíš [Concept('secret','tajemství')|E] jednoho ze svých vazalů"
 yearly.3000.b.failure.desc: "Nepodaří se ti přimět [guest_lover.GetFirstName] k řeči"
 intrigue_temptation.3010.t: "Květ v divočině"
 intrigue_temptation.3010.start.desc: "Už třetí noc v řadě sedím u stejného stolu ve stejném hostinci. Je od něj skvělý výhled na výčep — a na podmanivou osobu za ním, [bar_servant.Custom('bar_servant')] [bar_servant.GetFirstName].\n\nMé snění přeruší [wingman.Custom2('MyCharacterIntroduction', ROOT.Char)], když rázně postaví korbel na stůl. „Celý večer vidím, jak zíráš na [bar_servant.GetFirstName],“ zašeptá s potutelným úsměvem. „Ani se ti nedivím, [bar_servant.GetFirstName] je"
 intrigue_temptation.3010.end.desc: "[bar_servant.Custom('RomanticComplimentAdjective')] [bar_servant.GetWomanMan]. Mám vás seznámit?“"
 intrigue_temptation.3010.a: "Ty znáš [bar_servant.GetFirstName]? To by bylo skvělé!"
 intrigue_temptation.3010.b: "Tohle zvládnu bez pomoci."
 intrigue_temptation.3010.c: "Jsem tu jen kvůli pití..."
 intrigue_temptation.3010.success.tt: "Budeš moci rozhodnout, jak pokračovat"
 intrigue_temptation.3010.a.success: "S trochou pomoci si [bar_servant.GetFirstNameNoTooltip] omotáš kolem prstu"
 intrigue_temptation.3010.a.failure: "[bar_servant.GetFirstNameNoTooltip] tvé pokusy o sblížení neopětuje"
 intrigue_temptation.3010.b.success: "[bar_servant.GetFirstNameNoTooltip] si omotáš kolem prstu"
 intrigue_temptation.3011.help.desc: "Už jsem viděl[Select_CString(ROOT.Char.IsFemale,'a','')], jak [bar_servant.GetFirstName] odmítá víc pokusů o sblížení, než dokážu spočítat. Díky tomu, že nás [wingman.GetTitledFirstName] seznámí a navodí uvolněnou atmosféru, se však [bar_servant.GetFirstName] brzy rozpovídá.\n\nRozhovor plyne hladce — nečekal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že si budu mít tolik co říct s někým, kdo tu pracuje jako [bar_servant.Custom('bar_servant')]! Že [wingman.GetFirstNameNoTooltip] odešel[Select_CString(wingman.IsFemale,'a','')], si uvědomím teprve ve chvíli, kdy mi [bar_servant.GetFirstNameNoTooltip] položí ruku na paži a zeptá se, zda chci na noc pokoj. Podle pohledu v očích má být pro dva."
 intrigue_temptation.3011.alone.desc: "Už jsem viděl[Select_CString(ROOT.Char.IsFemale,'a','')], jak [bar_servant.GetFirstName] odmítá víc pokusů o sblížení, než dokážu spočítat. Někoho méně sebejistého by to odradilo, já jsem však s chutí využil[Select_CString(ROOT.Char.IsFemale,'a','')] příležitosti poučit se z chyb ostatních. Jsem připraven[Select_CString(ROOT.Char.IsFemale,'á','ý')].\n\nNáš rozhovor plyne hladce — nečekal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že si budu mít tolik co říct s někým, kdo tu pracuje jako [bar_servant.Custom('bar_servant')]! Když se zvedám k odchodu, [bar_servant.GetFirstNameNoTooltip] mi položí ruku na paži a zeptá se, zda chci na noc pokoj. Podle pohledu v očích má být pro dva."
 intrigue_temptation.3011.a: "Jen na jednu noc? Co třeba #EMP každou#! noc?"
 intrigue_temptation.3011.b: "Veď mě, [bar_servant.Custom('LoverPetName')]."
 intrigue_temptation.3011.c: "Lichotí mi to, ale chtěl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si jen popovídat."
 intrigue_temptation.3020.t: "Nový plamínek"
 intrigue_temptation.3020.start.desc: "Za ta léta ke mně dorazilo mnoho portrétů od nejrůznějších"
 intrigue_temptation.3020.nobles.desc: "šlechticů,"
 intrigue_temptation.3020.noblemen.desc: "šlechticů,"
 intrigue_temptation.3020.noblewomen.desc: "šlechtičen,"
 intrigue_temptation.3020.end.desc: "ze zahraničí i z domova. Až dosud na ně většinou jen sedal prach někde na půdě.\n\nMožná bych je měl[Select_CString(ROOT.Char.IsFemale,'a','')] vytáhnout a vybrat si další objekt svého zájmu?"
 intrigue_temptation.3020.a: "Dokážu si představit někoho nového..."
 intrigue_temptation.3020.b: "Na můj vkus jsou příliš domýšliví."
 intrigue_temptation.3020.a.tt: "Vytáhneš portréty"
 intrigue_temptation.3021.beauty.desc: "Mnozí mi říkali, že [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] je pastvou pro oči! Zajímalo by mě, zda tomu portrét dokáže dostát?"
 intrigue_temptation.3021.generic1.desc: "A co [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]? O [potential_date.GetTitledFirstName] se široko daleko ví, že je [potential_date.Custom('ComplimentAdjective')] [potential_date.GetWomanMan]. Také jsem ale zaslechl[Select_CString(ROOT.Char.IsFemale,'a','')], že někdy dokáže být dost [potential_date.Custom2('InsultAdjective', ROOT.Char)]..."
 intrigue_temptation.3021.generic2.desc: "Ach, [potential_date.GetFullName] — [potential_date.Custom('ComplimentAdjective')]! Hodili bychom se k sobě?"
 intrigue_temptation.3021.ugly.desc: "Tohle musí být [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Portrét je rozhodně dobře namalovaný, ale slyšel[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že skutečnost možná zachycuje poněkud lichotivě..."
 intrigue_temptation.3021.generic3.desc: "Na tomto portrétu není nikdo jiný než [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Říká se, že [potential_date.GetTitledFirstName] je [potential_date.Custom('ComplimentAdjective')], ale také jsem zaslechl[Select_CString(ROOT.Char.IsFemale,'a','')] zvěsti o povaze, která je prý [potential_date.Custom2('InsultAdjective', ROOT.Char)]..."
 intrigue_temptation.3021.generic4.desc: "Ach, [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Že by to byl právě ten pravý protějšek?"
 intrigue_temptation.3021.arrogant.desc: "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi poslal[Select_CString(potential_date.IsFemale,'a','')] balík s #EMP [ROOT.Char.Custom('ThreeToTwelve')]#! portréty. Všechny vypadají úplně stejně...?"
 intrigue_temptation.3021.impatient.desc: "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi za ta léta poslal[Select_CString(potential_date.IsFemale,'a','')] mnoho portrétů. K tomu poslednímu byl přiložen poněkud netrpělivý vzkaz."
 intrigue_temptation.3021.tall.desc: "Tohle je portrét [potential_date.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Posel, který jej doručil, považoval za nezbytné přesně popsat, jak vysoký[Select_CString(potential_date.IsFemale,'á','ý')] [potential_date.GetTitledFirstNameNoTooltip] je. A to hned několikrát."
 intrigue_temptation.3021.adventurous.desc: "K portrétu [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] je zezadu připevněn dopis. V něm stojí: „Jsem spontánní duše toužící po dobrodružství.“"
 intrigue_temptation.3021.fish.desc: "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi poslal[Select_CString(potential_date.IsFemale,'a','')] portrét od jezera s velkou rybou v rukou."
 intrigue_temptation.3021.dog.desc: "Na portrétu pózuje [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)] s rozkošným malým psem."
 intrigue_temptation.3021.do_not_believe.desc: "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] připojil[Select_CString(potential_date.IsFemale,'a','')] k portrétu poněkud jízlivý vzkaz. „Na seznamování s budoucím protějškem tímhle způsobem vlastně moc nevěřím, ale proč to nezkusit.“"
 intrigue_temptation.3021.lewd.desc: "[ROOT.Char.GetFaith.FertilityGodName|U], na tohle jsem úplně zapomněl[Select_CString(ROOT.Char.IsFemale,'a','')]! Portrét, který mi poslal[Select_CString(potential_date.IsFemale,'a','')] [potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)], ponechává jen velmi málo prostoru představivosti. Vlastně vůbec žádný."
 intrigue_temptation.3021.must_be_tall.desc: "[potential_date.Custom2('MyCharacterIntroduction', ROOT.Char)|U] připojil[Select_CString(potential_date.IsFemale,'a','')] k portrétu velmi dlouhý a přátelský dopis. Úplně na konci mě vybízí, ať brzy odpovím, „ale jen pokud měříš víc než šest stop“."
 intrigue_temptation.3021.a: "Tenhle vede! Do horní hromádky."
 intrigue_temptation.3021.a.tt: "Označíš [potential_date.GetShortUIName] jako současného favorita, kterému můžeš věnovat zvláštní pozornost"
 intrigue_temptation.3021.a.favorite_exists.tt: "Tvým současným favoritem je [favorite.GetShortUIName]"
 intrigue_temptation.3021.b: "Tenhle si nechám! Do pravé hromádky."
 intrigue_temptation.3021.b.tt: "Ponecháš [potential_date.GetShortUIName] ve výběru"
 intrigue_temptation.3021.b.2_dates.tt: "Vybral sis [date_1.GetShortUIName] a [date_2.GetShortUIName] a můžeš vybrat ještě #V 1#! osobu"
 intrigue_temptation.3021.b.1_date.tt: "Vybral sis [date_1.GetShortUIName] a můžeš vybrat ještě #V 2#! osoby"
 intrigue_temptation.3021.c: "Ne, díky! Do levé hromádky."
 intrigue_temptation.3021.c.tt: "Vyřadíš portrét: [potential_date.GetShortUIName]"
 every_approved_date: "Všichni, jejichž portrét zůstal ve výběru"
 intrigue_temptation.3021.d: "Tohle nemá cenu! Příšerný nápad."
 intrigue_temptation.3021.d.tt: "Uložíš portréty zpět"
 intrigue_temptation.3022.desc: "Bylo to vyčerpávající, ale podivně návykové! Výběr mám za sebou, takže teď mohu vytáhnout brk a sepsat pár líbezných veršů."
 intrigue_temptation.3022.a: "Záleží mi jen na [favorite.Custom('RomanticComplimentAdjective')] [favorite.GetFirstNameNoTooltip]."
 intrigue_temptation.3022.b: "Všichni si zaslouží mou poezii!"
 intrigue_temptation.3022.b.success: "Všichni jsou nadšení"
 intrigue_temptation.3022.b.failure: "Můj plán se obrátí proti mně"
 intrigue_temptation.3022.c: "Nebudu ztrácet čas ani s jedním z nich."
 intrigue_temptation.3023.t: "Pro [ROOT.Char.Custom('RomanticComplimentAdjective')] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 intrigue_temptation.3023.desc: "[letter_writer.Custom2('love_letter', ROOT.Char)]"
 intrigue_temptation.3023.a: "Jak lichotivé! Musím odepsat!"
 intrigue_temptation.3023.b: "S několika úpravami bych to mohl[Select_CString(ROOT.Char.IsFemale,'a','')] věnovat [ROOT.Char.GetPrimarySpouse.GetFirstNameNoTooltip]."
 intrigue_temptation.3023.c: "Dělá se mi z toho špatně..."
 intrigue_temptation.3024.desc: "[answering_date.Custom2('love_letter', ROOT.Char)]"
 intrigue_temptation.3024.a: "Výborně!"
 intrigue_temptation.3025.t: "[Select_CString(ROOT.Char.IsFemale,'Pro tu proradnou','Pro toho proradného')] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('favorite'))] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 intrigue_temptation.3025.desc: "Před čtrnácti dny mi od tebe přišel dopis. Na obálce bylo mé jméno, ale verše uvnitř byly věnovány [lower_left_portrait.GetTitledFirstName]. Po dotazu na [lower_left_portrait.GetTitledFirstName] vyšlo najevo, že dorazila úplně stejná báseň — jenže byla určena někomu jinému. A šlo o [lower_right_portrait.GetWomanMan]!\n\nTohle je ta nejpodlejší a nejšpinavější věc, o jaké jsem kdy slyšel[Select_CString(favorite.IsFemale,'a','')]. Už nám nikdy nepiš!"
 intrigue_temptation.3025.a: "Aha. Tohle je... trapné."
