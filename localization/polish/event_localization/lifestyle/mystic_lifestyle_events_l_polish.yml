l_polish:
 mystic_lifestyle_communion_header: "Mystické spojení: "
 mystic_lifestyle.1001.t: "$mystic_lifestyle_communion_header$Nesouhlas"
 mystic_lifestyle.1001.desc: "Přípravy na mé mystické sjednocení jsou už v plném proudu, když ke mně přichází [SCOPE.sC('priest').Custom2('MyCharacterIntroduction', ROOT.Char )].\n\n„Nemyslím si, že to, co děláš, je zrovna... pravověrné,“ ozve se. „Takové počínání se s pravou oddaností naší víře neslučuje.“"
 mystic_lifestyle.1001.a: "Takhle bude ke mně [ROOT.Char.GetFaith.HighGodName] blíž, než se kdy dostaneš ty!"
 mystic_lifestyle.1001.b: "Samozřejmě. Jak mě to vůbec mohlo napadnout?"
 mystic_lifestyle.1001.b.flavor: "Přiznat ještě, že jediné, na co při tom myslíš, je [ROOT.Char.GetFaith.HighGodNameAlternate], asi nebude nejlepší nápad."
 mystic_lifestyle.1002.opening: "[SCOPE.sC('religious_head').Custom2('AppropriateGreeting', ROOT.Char)]"
 mystic_lifestyle.1002.desc: "Doneslo se ke mně, že se pravidelně oddáváš velmi neobvyklým způsobům modlitby.\n\nPožaduji okamžité ukončení této směšné praxe a náležité pokání za takové překrucování naší víry."
 mystic_lifestyle.1002.a: "Já vím lépe než ty, co [ROOT.Char.GetFaith.HighGodName] skutečně chce!"
 mystic_lifestyle.1003.opening: "[SCOPE.sC('vassal').Custom2('RelationToMeShort', ROOT.Char )] se vydává žalostně pomýlenou cestou"
 mystic_lifestyle.1003.desc: "[ROOT.Char.GetFaith.PriestNeuterPlural] tvé podivné praktiky neschvalují a někdo tě za ně musí pokárat. Když to neudělám já, [ROOT.Char.GetFaith.HighGodName] se o to postará.\n\nProsím, vzpamatuj se a opusť tuto podivnou cestu. Kdo ví, k jakému kacířství či uctívání démonů může vést!"
 mystic_lifestyle.1003.a: "Pro tebe zůstávají [ROOT.Char.GetFaith.HighGodNamePossessive] tajemství skryta, ale mě to neodradí!"
 mystic_lifestyle.1004.t: "$mystic_lifestyle_communion_header$Zvěsti"
 mystic_lifestyle.1004.desc: "Zdá se, že mé poněkud neobvyklé náboženské návyky přitahují stále více pozornosti.\n\nTo sotva představuje problém — stejně nemohou doufat, že pochopí, co dělám — jenže podle šeptandy za zavřenými dveřmi #EMP něco dělám#! a lidé by mě měli mít na očích."
 mystic_lifestyle.1004.a: "Je mi úplně jedno, co si šeptají."
 mystic_lifestyle.1004.b: "Co když je přivítám a nic před nimi nebudu skrývat? Třeba pochopí."
 mystic_lifestyle.1005.opening: "V mém srdci má [SCOPE.sC('vassal').Custom2('RelationToMeShort', ROOT.Char )] své místo"
 mystic_lifestyle.1005.desc: "Netvrdím, že plně rozumím tvým zvykům a praktikám. Musím však ocenit, kolik úsilí očividně vkládáš do svých modliteb.\n\nKéž by každý skutečný věřící projevoval stejnou zbožnost jako ty."
 mystic_lifestyle.1005.a: "Těší mě, že oceňuješ mé úsilí."
 mystic_lifestyle.1005.b: "Ukážu ti, jak na to!"
 mystic_lifestyle.1006.t: "$mystic_lifestyle_communion_header$Pověst"
 mystic_lifestyle.1006.desc: "Mé mystické praktiky mi očividně vynesly jistou pověst. Lidé přesně nevědí, co vlastně dělám, ale vědí, že si mě nechtějí znepřátelit a na vlastní kůži zjistit, co se stane.\n\nJe to směšné, ale možná to není úplně špatně..."
 mystic_lifestyle.1006.a: "Ať se bojí, jak jen jejich malé dušičky dokážou."
 mystic_lifestyle.1006.b: "Když odpřisáhnu, že nikomu neubližuji, uklidní se."
 mystic_lifestyle.1007.t: "$mystic_lifestyle_communion_header$Něco je špatně"
 mystic_lifestyle.1007.desc: "Má spojení s božstvím jsou v poslední době jiná. Místo extáze po nich přichází jen slabost.\n\nDnes nemám sílu ani vstát z postele."
 mystic_lifestyle.1007.a: "Sluhové... Pomoc..."
 mystic_lifestyle.1008.t: "$mystic_lifestyle_communion_header$Zázrak"
 mystic_lifestyle.1008.desc: "Navzdory slabosti se mi podařilo mystické spojení vykonat.\n\nBylo intenzivnější než kdy dřív a dnes ráno, hle! [ROOT.Char.GetFaith.HighGodName|U] mi dopřává zázrak!"
 mystic_lifestyle.1008.a: "Síla se mi vrátila!"
 mystic_lifestyle.1009.opening: "V mém srdci má [SCOPE.sC('mystic').Custom2('RelationToMeShort', ROOT.Char )] zvláštní místo"
 mystic_lifestyle.1009.desc: "Musím ocenit tvé mystické zkoumání naší víry!\n\nPodle zvěstí, které slýchám, to vypadá, že i já se mám ještě co učit!"
 mystic_lifestyle.1009.a: "S radostí se podělím!"
