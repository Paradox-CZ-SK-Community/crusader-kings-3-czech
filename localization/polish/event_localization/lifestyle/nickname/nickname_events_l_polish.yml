l_polish:
 lifestyle_nicknames.0001.t: "Jak vejít ve známost"
 lifestyle_nicknames.0001.desc: "Po nesčetných hodinách strávených nad účetními knihami, sčítáním čísel a správou [ROOT.Char.Custom('GetCourt')] se má pečlivost konečně vyplatila. [ROOT.Char.Custom('GetRealmOrDomicile')|U] nyní prosperuje jako nikdy předtím!\n\nKaždý schopný vládce by měl vejít ve známost svými úspěchy — a [ROOT.Char.GetFullName] není výjimkou.\n\nJak si tedy mám říkat?"
 lifestyle_nicknames.0001.a: "Chci vejít ve známost svou správou!"
 lifestyle_nicknames.0001.b: "Lidé si mě budou pamatovat pro mou spravedlnost!"
 lifestyle_nicknames.0001.c: "Mé zákony proslaví mé jméno!"
 lifestyle_nicknames.0001.d: "Když nad tím tak přemýšlím, raději ne."
 lifestyle_nicknames.0001.tt: "Rozhodneš se, že za tebe budou mluvit tvé činy, nikoli [Concept('epithet','epiteton')|E]."
 lifestyle_nicknames.0002.desc: "„Jak si přeješ, [ROOT.Char.Custom('GetCourtOwner')]!“ volá [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames_second',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames_kurultai','lifestyle_nicknames_steward'))] při odchodu z [ROOT.Char.Custom('GetChamberPlural')].\n\nZvedám se ze židle a vycházím na [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames.0002.laamp',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames.0002.laamp','lifestyle_nicknames.0002.landed'))] Čím si mě mají pamatovat?"
 lifestyle_nicknames.0002.landed: "balkon. Pode mnou vidím tisíce lidí, kterým má vláda přinesla blahobyt."
 lifestyle_nicknames.0002.laamp: "prostranství uprostřed tábora. Kolem sebe vidím stovky lidí, kterým má korouhev přinesla blahobyt."
 lifestyle_nicknames.0002.a: "Chci, aby si mě pamatovali pro mou štědrost."
 lifestyle_nicknames.0002.b: "Snad si mě budou pamatovat pro mou laskavost."
 lifestyle_nicknames.0002.c: "Kéž jednou vzpomínají na #EMP vytříbenost mé vlády#!."
 lifestyle_nicknames.0002.d: "Když nad tím tak přemýšlím, raději ne."
 lifestyle_nicknames.0002.tt: "Možná je prosperující panství samo o sobě větší odměnou než jakékoli okázalé [Concept('nickname','přízvisko')|E]."
 lifestyle_nicknames.0003.t: "Mluviti stříbro"
 lifestyle_nicknames.0003.desc: "Veškerý čas věnovaný diplomacii konečně přináší ovoce. Říká se, že mlčeti zlato, ale schopnost domluvit se, argumentovat a přesvědčovat má podle mě ještě větší cenu než samotné zlato.\n\nKaždý vážený vládce získává díky svým činům druhé jméno. Jak si tedy mají pamatovat mě?"
 lifestyle_nicknames.0003.a: "Už to mám! Co třeba „[Select_CString(ROOT.Char.IsFemale,'Velkolepá','Velkolepý')]“?"
 lifestyle_nicknames.0003.b: "[ROOT.Char.GetFullName] [Select_CString(ROOT.Char.IsFemale,'Velkorysá','Velkorysý')]!"
 lifestyle_nicknames.0003.c: "[Select_CString(ROOT.Char.IsFemale,'Mírotvůrkyně','Mírotvůrce')]. To zní dobře!"
 lifestyle_nicknames.0003.d: "Když nad tím tak přemýšlím, raději ne."
 lifestyle_nicknames.0003.tt: "[Concept('cognomen','Kognomen')|E] si člověk musí zasloužit, ne si ho sám přivlastnit."
 lifestyle_nicknames.0004.desc: "Veškerá tvrdá práce na zdokonalování mého státnického umění přinesla vynikající vnitřní i zahraniční vztahy. Rolníci v ulicích radostně mávají mé družině a většinu svých dvořanů znám jménem.\n\nMyslím, že už jsem si [Select_CString(ROOT.Char.IsFemale,'udělala jméno','udělal jméno')]. Jaké by ale mělo být?"
 lifestyle_nicknames.0004.a: "Se všemi jednám spravedlivě bez ohledu na postavení, takže..."
 lifestyle_nicknames.0004.b: "Doufám, že lidé oceňují mou laskavost."
 lifestyle_nicknames.0004.c: "Všichni říkají, že se se mnou příjemně rozmlouvá."
 lifestyle_nicknames.0004.d: "Když nad tím tak přemýšlím, raději ne."
 lifestyle_nicknames.0004.tt: "Činy vládce by měly mluvit hlasitěji než jeho [Concept('epithet','epiteton')|E]."
 lifestyle_nicknames.0005.t: "Meč rozumu"
 lifestyle_nicknames.0005.desc: "Jednoho pokojného večera, když už všichni [ROOT.Char.Custom('GetCourtierPlural')] spěšně opustili [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'room_command_tent','room_throne_room')], usedám a na chvíli se zamýšlím.\n\n„Všichni velcí vládci světa mají velká jména, tak proč ne já? Od nynějška a po všechny věky budu [Select_CString(ROOT.Char.IsFemale,'známá','známý')] jako [ROOT.Char.GetTitledFirstName]..."
 lifestyle_nicknames.0005.a: "...$nick_the_conqueror$!"
 lifestyle_nicknames.0005.b: "...$nick_haardraade$!"
 lifestyle_nicknames.0005.c: "...$nick_the_noble$!"
 lifestyle_nicknames.0005.d: "..."
 lifestyle_nicknames.0005.tt: "Opřeš se v křesle: tvé strategie a tvůj meč ti časem vytesají důstojný [Concept('cognomen','kognomen')|E]."
 lifestyle_nicknames.0006.desc: "Prohlížím si bitevní plány rozložené přede mnou a beru do ruky jednoho z dřevěných vojáčků. Jako dítě jsem si s nimi [Select_CString(ROOT.Char.IsFemale,'hrála','hrál')] ve svých komnatách a teď tytéž hračky používám k vedení válek.\n\n„[ROOT.Char.GetTitledFirstName]?“ — do stanu vstoupí [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'lifestyle_nicknames_second',SelectLocalization(IsNomad(ROOT.Char),'lifestyle_nicknames_kurultai','lifestyle_nicknames_marshal'))] — „Velitelé s tebou chtějí mluvit. Jak tě máme představit?“\n\nTa narážka je trefná. Ti, kdo pod mým velením bojují, by měli vědět, že je vede někdo větší než život sám."
 lifestyle_nicknames_second: "[GetCourtPositionType('second_camp_officer').GetNameNoTooltip]"
 lifestyle_nicknames_marshal: "[GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName]"
 lifestyle_nicknames_steward: "[GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName]"
 lifestyle_nicknames_kurultai: "[GetPlayer.GetCouncillorPosition( 'councillor_kurultai_1' ).GetPositionName]"
 lifestyle_nicknames.0006.a: "Ať mě znají díky mému strategickému důvtipu."
 lifestyle_nicknames.0006.b: "Ať mě znají díky mému odhodlání."
 lifestyle_nicknames.0006.c: "Sem mě dovedla statečnost a odvaha..."
 lifestyle_nicknames.0006.d: "Prosím, říkejte mi [ROOT.Char.GetFirstNameNoTooltip]."
 lifestyle_nicknames.0006.tt: "I ty patříš mezi pouhé smrtelníky a žádný [Concept('epithet','epiteton')|E] na tom nic nezmění."
 lifestyle_nicknames.0007.t: "Mlčeti zlato"
 lifestyle_nicknames.0007.desc: "Říká se, že vliv je jako tráva na jaře. Může růst sám od sebe, ale já jsem o ten svůj trpělivě [Select_CString(ROOT.Char.IsFemale,'pečovala','pečoval')], dokud se nerozšířil po celém mém panství a pak ještě dál. Zahrada, o kterou jsem s takovým úsilím [Select_CString(ROOT.Char.IsFemale,'pečovala','pečoval')], rozkvetla do skutečné krásy.\n\nMoc spočívá tam, kde si přeji. Cena za mlčení lidí je vysoká, ale tuto oběť jsem [Select_CString(ROOT.Char.IsFemale,'ochotna','ochoten')] podstoupit. Se mnou je nutné počítat a můj vliv si zaslouží vejít do dějin! Mocné jméno by mělo navždy upevnit mé místo v historii..."
 lifestyle_nicknames.0007.a: "Jsem jako stín. Sleduji každý krok."
 lifestyle_nicknames.0007.b: "Pozoruji zpovzdálí a udeřím bez zaváhání."
 lifestyle_nicknames.0007.c: "Není větší odměny než pohled na chvějící se poddané."
 lifestyle_nicknames.0007.d: "Tajemství úspěchu tkví v tajemství samotném."
 lifestyle_nicknames.0007.tt: "Rozhodneš se od toho upustit. Nechvalně proslulé [Concept('nickname','přízvisko')|E] by ti v budoucnu nejspíš jen překáželo."
 lifestyle_nicknames.0008.desc: "Jsem [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetLaampDescribeTypeSelf'),'monarch')] a dokážu zastrašit své [ROOT.Char.Custom('GetFollowerOrVassalPlural')] i inspirovat svůj lid. Jako [SelectLocalization( IsLandlessAdventurer(ROOT.Char),ROOT.Char.Custom('GetLaampDescribeTypeSelf'),'ruler')] mám lásku svých poddaných i moc utvářet jejich osud. [ROOT.Char.Custom('GetRealmOrDomicile')|U] má být místem, kde mocní nekořistí na slabých.\n\nV tyto hodnoty věřím! Tento sen chci ztělesňovat.\n\nOd nynějška vejdu ve známost díky..."
 lifestyle_nicknames.0008.a: "Svému důvtipu při správě záležitostí panství."
 lifestyle_nicknames.0008.b: "Tajemstvím a šepotu, které mohou svrhnout celé říše."
 lifestyle_nicknames.0008.c: "Své pečlivě utkané síti vlivu."
 lifestyle_nicknames.0008.d: "Pouze činům, kterými pomáhám svému rodu a panství."
 lifestyle_nicknames.0008.tt: "Rozhodneš se nepřijmout žádný [Concept('epithet','epiteton')|E] — prosperující panství je odměnou samo o sobě."
 lifestyle_nicknames.0009.t: "Pero je mocnější"
 lifestyle_nicknames.0009.desc: "Knihovna v mém paláci je skutečně úchvatná. Tisíce účetních knih, svazků a svitků ukrývají vědomosti, které většina lidí nezná. Je mou pýchou a jedním z mých největších úspěchů.\n\nNa velké myslitele minulosti se stále vzpomíná, jejich díla se citují a studují. Zasloužím si stanout po jejich boku. Od nynějška budu [Select_CString(ROOT.Char.IsFemale,'známá jako','znám jako')] [ROOT.Char.GetTitledFirstName]..."
 lifestyle_nicknames.0009.a: "...$nick_the_enlightened$!"
 lifestyle_nicknames.0009.b: "...$nick_the_truthseeker$!"
 lifestyle_nicknames.0009.c: "...$nick_the_chronicler$!"
 lifestyle_nicknames.0009.d: "..."
 lifestyle_nicknames.0009.tt: "Žádný [Concept('cognomen','kognomen')|E] nepřijmeš, neboť se stydíš už jen za to, že tě napadla tak domýšlivá myšlenka."
 lifestyle_nicknames.0010.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], je čas.“ [my_chaplain.GetCouncilTitle|U] [my_chaplain.GetFirstName] se u dveří do mých komnat hluboce ukloní.\n\nNa psacím stole skládám své poznámky do úhledné hromádky. Před vyslanci a velvyslanci mám pronést řeč o nedávných kulturních úspěších panství.\n\nPřed vstupem do sálu mě [my_chaplain.GetCouncilTitle] zastaví:\n„Všichni o tobě samozřejmě #EMP vědí#! — ale jak tě mám představit?“"
 lifestyle_nicknames.0010.a: "Kdo jiný jsem než „$nick_the_sage$“?"
 lifestyle_nicknames.0010.b: "Hm. Co třeba „$nick_the_scholar$“?"
 lifestyle_nicknames.0010.c: "Asi ve mně přece jen něco z historika je..."
 lifestyle_nicknames.0010.d: "Jsem prostě [ROOT.Char.GetTitleAsName]."
 lifestyle_nicknames.0010.tt: "Do sálu vstoupíš bez nového [Concept('nickname','přízviska')|E]."
 lifestyle_nicknames.0011.t: "Ozvěna"
 lifestyle_nicknames.0011.desc: "Ať jdu kamkoli, nedokážu uniknout nesouhlasným pohledům urozených ani prostých lidí. Navzdory mým nejlepším úmyslům se zdá, že mé zvolené jméno vzbudilo mnohem větší opovržení, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')].\n\nUchyluji se do svých komnat a přemýšlím, co dál..."
 lifestyle_nicknames.0011.a: "Možná mě nebudou respektovat, ale poslouchat mě budou!"
 lifestyle_nicknames.0011.a.tt: "Dáš všem jasně najevo, že si svůj zvolený [Concept('cognomen','kognomen')|E] ponecháš a nepřipouštíš žádnou jinou možnost."
 lifestyle_nicknames.0011.b: "Mají pravdu. Co mě to vůbec napadlo?"
 lifestyle_nicknames.1000.t: "Přízvisko: [nickname_getter.GetNicknameNoTooltip|U]"
 lifestyle_nicknames.1000.desc: "„Víš, [informer.Custom2('RelationToMeShort', SCOPE.sC('nickname_getter'))], jak ti říkají?“ ptá se mě [informer.GetFirstName], [nickname_getter.Custom2('RelationToMeShort', SCOPE.sC('informer'))], zatímco [informer.Custom('quirk_pos_pp')].\n\n"
 lifestyle_nicknames.1000.desc_prison: "„[nickname_getter.GetFirstNameNoTooltip], víš, jak ti říkají?“ vyhrkne [informer.GetFirstName] a poklepe pohárem o železné mříže.\n\n"
 lifestyle_nicknames.1000.desc_good: "„Říkají ti #EMP ‚[nickname_getter.GetTitledFirstNameNicknamedNoTooltip]‘#!. Nádhera, nemyslíš? Tohle jméno mají na rtech prostí lidé i šlechtici.“"
 lifestyle_nicknames.1000.desc_bad: "„Říkají ti #EMP ‚[nickname_getter.GetTitledFirstNameNicknamedNoTooltip]‘#!... Zrovna #EMP lichotivé#! to asi není, ale sotva s tím něco naděláš.“"
 lifestyle_nicknames.1000.end_bad_bad: "\n\n„Raději si na to zvykni!“ ušklíbne se [informer.GetFirstNameNoTooltip] a odchází."
 lifestyle_nicknames.1000.end_good_bad: "\n\n„Já bych ti takové jméno [Select_CString(informer.IsFemale,'nevybrala','nevybral')]...“ pronese [informer.GetFirstNameNoTooltip] se zjevným rozladěním."
 lifestyle_nicknames.1000.end_bad_good: "\n\n„Jestli tě to utěší, slibuji, že ti tak říkat nebudu.“ [informer.GetFirstNameNoTooltip] se usměje."
 lifestyle_nicknames.1000.end_good_good: "\n\n„Tohle si zaslouží oslavu!“ zvolá [informer.GetFirstNameNoTooltip] radostně."
 lifestyle_nicknames.1000.a: "Na tohle jméno si dokážu zvyknout!"
 lifestyle_nicknames.1000.b: "„[nickname_getter.GetNicknameNoTooltip|U]“? #EMP Cože!?!#! To je absurdní!"
 lifestyle_nicknames.1000.c: "Drobný paprsek světla v temnotě..."
 lifestyle_nicknames.1000.d: "Aha. Takže život #EMP opravdu může#! být ještě horší."
 lifestyle_nicknames.1000.e: "*Souhlasné zabručení*"
 lifestyle_nicknames.1000.f: "*Nesouhlasné zabručení*"
