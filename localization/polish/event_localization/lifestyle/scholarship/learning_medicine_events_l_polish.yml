l_polish:
 learning_medicine.2001.t: "Tajemství přírody"
 learning_medicine.2001.pool.desc: "[herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] mi posílá nabídku. Pokud se dopisu dá věřit, má s bylinkářstvím bohaté zkušenosti a nabízí, že se se mnou podělí o své znalosti. Odměnou mají být jen [ROOT.Char.Custom('GetRoom')] a strava."
 learning_medicine.2001.no_pool.desc: "[herbalist.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] se dobře vyzná v léčivých i škodlivých rostlinách. Už několikrát mi [Select_CString(herbalist.IsFemale,'nabídla','nabídl')], že se se mnou podělí o své znalosti."
 learning_medicine.2001.chaplain_hates_herbs.desc: "\n\nNabídka je lákavá, ale vím, že [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] nedůvěřuje kouzlům ani lektvarům. Tvrdí, že [ROOT.Char.GetFaith.DevilName] je používá k nekalým účelům... "
 learning_medicine.2001.a: "Vždy mě láká naučit se něco nového."
 learning_medicine.2001.b: "Vzácná květina by rozjasnila [flower_receiver.GetFirstNamePossessiveNoTooltip] den."
 learning_medicine.2001.c: "Ať vysadí zahradu posvátných bylin."
 learning_medicine.2001.d: "Nemám čas hrabat se v hlíně a rostlinách."
 learning_medicine.2001.d.chaplain_hates_herbs: "V téhle věci rozhodne [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstNameNoTooltip]."
 learning_medicine.2002.start.desc: "[herbalist.GetFirstName] a já trávíme další dlouhou noc tříděním rostlin a vařením lektvarů. Když listuji jedním z [Select_CString(herbalist.IsFemale,'jejích','jeho')] ošoupaných svazků, narazím na"
 learning_medicine.2002.chaplain_hates_herbs.desc: "odstavec, kvůli kterému se [chaplain_hates_herbs.GetCouncilTitle] [chaplain_hates_herbs.GetFirstName] může pominout vzteky!"
 learning_medicine.2002.not_witchcraft_accepted.desc: "odstavec, kvůli kterému se [ROOT.Char.Custom('DefaultPriestTitlePlural')] mohou pominout vzteky!"
 learning_medicine.2002.witchcraft_accepted.desc: "nanejvýš zajímavý recept. Kdo by řekl, že obyčejné byliny mají takovou moc..."
 learning_medicine.2002.a: "Musím proniknout hlouběji do tohoto skrytého poznání!"
 learning_medicine.2002.a.success.t: "[herbalist.GetFirstNameNoTooltip] je [Select_CString(herbalist.IsFemale,'čarodějnice','čaroděj')]"
 learning_medicine.2002.a.failure.t: "[herbalist.GetFirstNameNoTooltip] je mými narážkami [Select_CString(herbalist.IsFemale,'zděšená','zděšený')]"
 learning_medicine.2002.b: "Jestli něco tají, zjistím to."
 learning_medicine.2002.b.success.t: "Odhalím pravdu"
 learning_medicine.2002.b.success.tt: "Pokud [herbalist.GetShortUIName] skrývá čarodějnické tajemství, bude ti odhaleno"
 learning_medicine.2002.b.success.witch.t: "[herbalist.GetFirstNameNoTooltip] je [Select_CString(herbalist.IsFemale,'čarodějnice','čaroděj')]"
 learning_medicine.2002.b.success.no_witch.t: "[herbalist.GetFirstNameNoTooltip] není [Select_CString(herbalist.IsFemale,'čarodějnice','čaroděj')]"
 learning_medicine.2002.b.success.no_witch.desc: "Je jasné, že [herbalist.GetTitledFirstName] je [Select_CString(herbalist.IsFemale,'nevinná','nevinný')]"
 learning_medicine.2002.b.inconclusive.t: "Vyšetřování bez výsledku"
 learning_medicine.2002.b.inconclusive.desc: "Žádný důkaz čarodějnictví se nenašel"
 learning_medicine.2002.b.failure.t: "[herbalist.GetFirstNameNoTooltip] mě přistihne při slídění"
 learning_medicine.2002.c: "Nenechám se rozptylovat mýty a pověstmi."
 learning_medicine.2003.desc: "„Tohle se chci naučit,“ říkám a podávám [herbalist.GetFirstName] svazek. „Naučíš mě to?“\n\n[herbalist.GetFirstName] si mě dlouze a pozorně prohlíží. „Opravdu to chceš, [ROOT.Char.GetFirstNameNoTooltip]? [herbalist.GetFaith.WitchGodName] žádá tvou oddanost a na oplátku ti udělí požehnání. Přijmeš?“"
 learning_medicine.2003.a: "Nic si nepřeji víc."
 learning_medicine.2010.t: "Znepokojivý překlad"
 learning_medicine.2010.start.desc: "Když překročím práh pracovny, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('court_physician'))] [court_physician.GetFirstName] se hluboce sklání nad knihou.\n\n„Tenhle překlad"
 learning_medicine.2010.galen.desc: "Galéna"
 learning_medicine.2010.hippocrates.desc: "Hippokrata"
 learning_medicine.2010.herophilus.desc: "Hérofila"
 learning_medicine.2010.hildegard.desc: "Hildegardy z Bingenu"
 learning_medicine.2010.mundinus.desc: "Mundina"
 learning_medicine.2010.avicenna.desc: "Avicenny"
 learning_medicine.2010.trota.desc: "Troty ze Salerna"
 learning_medicine.2010.sun_simiao.desc: "Suna S'-miaa"
 learning_medicine.2010.zhan_zhongjing.desc: "Čang Čung-ťinga"
 learning_medicine.2010.hua_tuo.desc: "Chua Tchua"
 learning_medicine.2010.tamba_yasuyori.desc: "Tamba Jasujoriho"
 learning_medicine.2010.bianque.desc: "[Glossary( 'Bian Que', 'BIAN_QUE_GLOSS' )]"
 learning_medicine.2010.fallback.desc: "zprávy z pitvy"
 learning_medicine.2010.end.desc: "je příšerný,“ povzdechne si [court_physician.GetFirstNameNoTooltip]. „Když se budu řídit těmito pokyny, mám stejnou šanci pacienta vyléčit jako ho rovnou zabít.“"
 learning_medicine.2010.a: "Nech mě se na to podívat..."
 learning_medicine.2010.a.success.desc: "[court_physician.GetFirstNameNoTooltip] s tvou pomocí text přeloží"
 learning_medicine.2010.a.failure.desc: "Ztrapníš se"
 learning_medicine.2010.b: "Pořídím ti lepší překlad."
 learning_medicine.2010.c: "[ROOT.Char.GetFaith.ReligiousText] ti ukáže správnou cestu."
 learning_medicine.2021.t: "[ROOT.Char.Custom('FormalComplimentAdjective')|U] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 learning_medicine.2021.desc: "Jmenuji se [physician.GetTitledFirstNameNoTooltip] a mám lékařské vzdělání se specializací na otázky plodnosti.\n\nSnad by vám má diskrétní rada mohla být ku prospěchu? Bylo by mi ctí vám sloužit — za symbolický poplatek."
 learning_medicine.2021.a: "Vaše pomoc by se mi hodila..."
 learning_medicine.2021.a.tt: "Přijmeš léčbu plodnosti"
 learning_medicine.2021.b: "[Select_CString(physician.IsFemale,'Vzdělaná lékařka je vždy vítána.','Vzdělaný lékař je vždy vítán.')]"
 learning_medicine.2021.b.tt: "Odmítneš léčbu plodnosti"
 learning_medicine.2021.c: "Já žádné takové #EMP potíže#! nemám!"
 learning_medicine.2022.t: "Problémy s plodností"
 learning_medicine.2022.old_physician.desc: "[physician.GetTitledFirstName] se přede mnou už [Select_CString(physician.IsFemale,'vypořádala','vypořádal')] se vším od pijavic po hnijící těla, ale takové rozpaky ve tváři vidím poprvé.\n\n„Mám na starosti vaše zdraví,“ říká [physician.GetFirstNameNoTooltip] a hledí přitom do země. „To zahrnuje i vaše... #EMP reprodukční#! zdraví. Mohu připravit tinkturu, která by mohla pomoci vám oběma. [spouse.Custom('WifeHusband')|U] ji může užívat spolu s vámi. [Select_CString(physician.IsFemale,'Četla jsem','Četl jsem')] také o několika experimentálních léčbách se slibnými výsledky.“"
 learning_medicine.2022.new_physician.desc: "Na zabydlení měl být čas, ale jen pár hodin po příchodu [physician.GetFirstName] vtrhne do mé pracovny s velkým kufrem v závěsu. Vyhoupne ho na můj stůl s nepříjemným #EMP žuchnutím#!.\n\n„Vy i [spouse.Custom('WifeHusband')] máte několik možností, [ROOT.Char.Custom('FormOfAddressForLiege')]. Existují osvědčené tinktury — ale vyvíjím i několik experimentálních léčeb.“"
 learning_medicine.2022.b: "Obyčejná tinktura zní rozumně."
 learning_medicine.2022.b.success: "Léčba je úspěšná"
 learning_medicine.2022.b.failure: "Léčba je neúspěšná"
 learning_medicine.2022.a: "Budoucnost panství je v sázce! Zkusím cokoli!"
 learning_medicine.2022.a.success: "Léčba je velmi úspěšná"
 learning_medicine.2022.a.unexpected: "Léčba má podivné vedlejší účinky"
 learning_medicine.2022.a.failure: "Léčba má nepříznivé vedlejší účinky"
 learning_medicine.2022.c: "Vlastně chci jen nějakou... radu."
 learning_medicine.2022.a.unexpected.tt: "Může se stát něco nečekaného"
 learning_medicine.2023.urine.desc: "„Vaše těla nejsou v souladu, [ROOT.Char.Custom('FormOfAddressForLiege')], ale mám na to lék. Vy i [spouse.Custom('WifeHusband')] musíte každý večer před spaním pít moč toho druhého, a to celý týden. Pak se vaše energie jistě sladí!“\n\nByl to dlouhý týden."
 learning_medicine.2023.unpleasant_end.desc: "\n\nAčkoli samotná léčba nebyla zrovna příjemná,"
 learning_medicine.2023.pig_testicles.desc: "„[location.GetNameNoTooltip] má nejplodnějšího kance široko daleko a toho se mi podařilo získat. Jeho varlata už jsou usušená a rozemletá na prášek. Pijte ho čtrnáct dní ve víně a vaše plodnost se zvýší desetkrát!“"
 learning_medicine.2023.pig_testicles_end.desc: "\n\nAčkoli prášek dodal vínu zatuchlou příchuť, celkově to byl překvapivě příjemný zážitek."
 learning_medicine.2023.udder.desc: "„Mléko dává život, a proto musíme jít přímo ke zdroji. Kuchaři vám oběma připraví dušené kravské vemeno. Týden nejezte nic jiného a odměna vás jistě nemine.“\n\nByl to dlouhý týden."
 learning_medicine.2023.female_orgasm.start.desc: "„Jak možná víte, potěšení ženy je stejně důležité jako potěšení muže."
 learning_medicine.2023.female_orgasm.female.desc: "Vaše semeno musí vytrysknout a smísit se se semenem vašeho protějšku. [spouse.Custom('WifeHusband')|U] by si [Select_CString(spouse.IsFemale,'měla','měl')] přečíst tento svazek o milostných technikách. [ROOT.Char.Custom('GetChamber')|U] se k jejich zkoušení hodí nejlépe.“\n\nLepší léčbu si snad ani nelze přát.\n\n"
 learning_medicine.2023.female_orgasm.male.desc: "[spouse.Custom('WifeHusband')|U] musí dosáhnout vyvrcholení, aby semeno mohlo vytrysknout a smísit se s vaším. Vy si zase přečtěte tento svazek o milostných technikách. [ROOT.Char.Custom('GetChamber')|U] se k jejich zkoušení hodí nejlépe.“\n\nOsvojit si neznámé metody dalo spoustu práce, ale nakonec se to podařilo — alespoň [spouse.GetFirstNameNoTooltip] mou zručnost podle všeho oceňuje!\n\n"
 learning_medicine.2023.milk_bath.desc: "„Každé mléko dává život a kozí má obzvlášť velkou sílu. Kdykoli se budete snažit počít dítě, vy i [spouse.Custom('WifeHusband')] se nejprve vykoupejte v kozím mléce. Můžete to dokonce zkusit přímo ve vaně!“"
 learning_medicine.2023.milk_bath_end.desc: "\n\nAčkoli mělo mléko výrazný #EMP zápach#!,"
 learning_medicine.2023.end.desc: "[physician.GetFirstNameNoTooltip] je z výsledků [Select_CString(physician.IsFemale,'nadšená','nadšený')] a já se cítím skvěle! Doporučení zní, abychom byli trpěliví, ale podle mě můžeme brzy čekat nového člena rodiny."
 learning_medicine.2023.a: "[ROOT.Char.Custom('GetChamber')|U] nám poskytne soukromí, [spouse.GetFirstNameNoTooltip]..."
 learning_medicine.2024.end.desc: "\n\nŘídím se přesně všemi pokyny a [physician.GetFirstNameNoTooltip] dál doporučuje trpělivost, ale pochybnosti sílí. Je mi nevolno a motá se mi hlava, zatímco [spouse.GetFirstName] už třetí den nevstává z postele."
 learning_medicine.2024.a: "Chci si jen odpočinout..."
 learning_medicine.2024.b: "Stráže! Do vězení s [Select_CString(physician.IsFemale,'tou šarlatánkou','tím šarlatánem')]!"
 learning_medicine.2025.start.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], mám skvělé zprávy! Je ještě brzy, ale [spouse.Custom('WifeHusband')] vykazuje všechny známky těhotenství!“\n\nNejprve mě zaplaví štěstí a úleva, vzápětí však přijde zmatek. „Ale léčba ještě ani nezačala, [physician.GetFirstName],“ namítnu.\n\n"
 learning_medicine.2025.fertilitygod.desc: "„[physician.GetFaith.FertilityGodName]"
 learning_medicine.2025.the_universe.desc: "„Vesmír"
 learning_medicine.2025.end.desc: "působí tajemnými cestami, [ROOT.Char.Custom('FormOfAddressForLiege')]. Někdy je lepší přijmout požehnání, než se je snažit vysvětlit.“"
 learning_medicine.2025.b: "Moudrá slova!"
 learning_medicine.2025.a: "[spouse.GetFirstNameNoTooltip]... Musíme si promluvit. O samotě."
 learning_medicine.2025.a.tt: "Vyvoláš konfrontaci — [spouse.GetShortUIName]"
 learning_medicine.2030.t: "Tíha koruny"
 learning_medicine.2030.desc: "Někdy na mě povinnosti doléhají tak silně, že jsou téměř k neunesení. Jsem přece [ROOT.Char.GetTitleAsNameNoTooltip], ale jak může jediný člověk nést všechnu tu tíhu? [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] přece nemůže spočívat jen na jedněch ramenou.\n\nMožná jsou břemena, která nemusím nést bez pomoci. Kdyby tak bylo komu se svěřit..."
 learning_medicine.2030.a: "Když promluví [confider_target.GetFirstNameNoTooltip], vždy se mi uleví."
 learning_medicine.2030.a.message: "Když se svěříš, stres poleví"
 learning_medicine.2030.b: "[confider_target_2.GetFirstNameNoTooltip] umí tak dobře naslouchat."
 learning_medicine.2030.c: "Můžeme si navzájem střežit i ta nejtemnější tajemství."
 learning_medicine.2030.d: "Spoléhat se na druhé by mě jen oslabilo."
 learning_medicine.2030.c.tt: "Pokud má [confider_target.GetShortUIName] nějaké [Concept('secret','tajemství')|E], odhalí ti ho"
 learning_medicine.2030.c.message: "[confider_target.GetFirstNameNoTooltip] ti odhalí tajemství"
 learning_medicine.2040.t: "Mysl a tělo"
 learning_medicine.2040.start.desc: "Čím hlouběji pronikám do svého studia, tím zřejmější je spojení mezi myslí a tělem. Příliš mnoho starostí může člověku způsobit nemoc a mysl není silnější než schránka, v níž přebývá!\n\n"
 learning_medicine.2040.athletic_friend.desc: "Můj moudrý přítel [friend.GetTitledFirstName] přísahá, že mu [Select_CString(friend.IsFemale,'vydatný pohyb pomáhá držet stres na uzdě','vydatný pohyb pomáhá držet stres na uzdě')]. Také jsem četl[Select_CString(ROOT.Char.IsFemale,'a','')], že vedení deníku dokáže utišit úzkost."
 learning_medicine.2040.journaller_friend.desc: "Můj moudrý přítel [friend.GetTitledFirstName] si zapisuje své starosti do deníku a přísahá, že se mu díky tomu uleví. Také jsem četl[Select_CString(ROOT.Char.IsFemale,'a','')], že vydatný pohyb dokáže uklidnit pocuchané nervy."
 learning_medicine.2040.no_friend.desc: "Potřebuji zdravý způsob, jak se vyrovnat s tlakem vládnutí. Četl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem o blahodárných účincích vydatného pohybu i vedení deníku na pocuchané nervy."
 learning_medicine.2040.a: "Zacvičit si s [friend.GetFirstNameNoTooltip]."
 learning_medicine.2040.b: "Požádat [friend.GetFirstNameNoTooltip] o radu s vedením deníku."
 learning_medicine.2040.c: "Jít si zaběhat."
 learning_medicine.2030.c.trait: "Cvičení mě uklidní"
 learning_medicine.2030.c.modifier: "Necítím se klidněji, ale sílím"
 learning_medicine.2040.d: "Strávit odpoledne psaním deníku."
 learning_medicine.2030.d.trait: "Psaní deníku mě uklidní"
 learning_medicine.2030.d.modifier: "Necítím se klidněji, ale lépe píšu"
 learning_medicine.2040.e: "Vzít si celý den volno."
 learning_medicine.2050.t: "Vykrvácení"
 learning_medicine.2050.start.desc: "Právě prohlížím [Select_CString(IsLandlessAdventurer(ROOT.Char),'táborovou','kasárenskou')] ošetřovnu, když přinesou těžce zraněného vojáka. „[Select_CString(soldier.IsFemale,'Ztrácí','Ztrácí')] příliš mnoho krve! Kde je lékař?!“\n\n"
 learning_medicine.2050.physician.desc: "[physician.GetTitledFirstName] není nikde k nalezení."
 learning_medicine.2050.no_physician.desc: "Léčitel není nikde k nalezení."
 learning_medicine.2050.end.desc: "Po zádech mi přeběhne mráz. Možná jsem #EMP já#! [Select_CString(soldier.IsFemale,'její','jeho')] jediná naděje.\n\nNajednou, jako by se [helper.Custom2('MyCharacterIntroduction', ROOT.Char)] zjevila odnikud, stojí po mém boku. [helper.GetFirstNameNoTooltip] si vyhrne rukávy a pohlédne na mě."
 learning_medicine.2050.a: "Podej mi škrtidlo!"
 learning_medicine.2050.a.success: "Společně s [helper.GetFirstNameNoTooltip] zachráníme vojáka"
 learning_medicine.2050.a.failure: "Navzdory našemu úsilí voják zemře"
 learning_medicine.2050.b: "#EMP Ustup#!! Tohle je #EMP můj#! pacient!"
 learning_medicine.2050.b.success: "Vojáka zachráním bez cizí pomoci"
 learning_medicine.2050.b.failure: "Vojáka se mi nepodaří zachránit"
 learning_medicine.2050.c: "Ať vykrvácí. Nic lepšího si nezaslouží."
 learning_medicine.2051.start_our.desc: "Náš"
 learning_medicine.2051.start.desc: "pacient křičí a zmítá se. Přestože ho [Select_CString(soldier.IsFemale,'drží při zemi tři dospělé ženy','drží při zemi tři dospělí muži')], každý další krok je boj."
 learning_medicine.2051.middle.desc: "[helper.GetTitledFirstName] však zachovává klid a nakonec se i nás zmocní tiché soustředění.\n\nNevím, jak se nám to podařilo, ale nakonec to vypadá, že voják přežije. „To byl působivý výkon,“"
 learning_medicine.2051.my_ladylord.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“"
 learning_medicine.2051.firstname.desc: "[ROOT.Char.GetFirstNameNoTooltip],“"
 learning_medicine.2051.end.desc: "pronese [helper.GetFirstNameNoTooltip] s unaveným úsměvem. „Bylo mi ctí pracovat po vašem boku.“"
 learning_medicine.2051.a: "Bez tebe bych to nezvládl[Select_CString(ROOT.Char.IsFemale,'a','')]."
 learning_medicine.2052.middle.desc: "\n\nPracujeme jako o život a překřikujeme všechen ten chaos, ale je to marné. [soldier.GetFirstNameNoTooltip] jen dál slábne a životodárná krev nám proudí mezi prsty.\n\n„Udělali jsme všechno, co bylo v našich silách,“"
 learning_medicine.2052.end.desc: "pronese [helper.GetFirstNameNoTooltip] s těžkým povzdechem, zatímco tělo odnášejí. „[soldier.GetFirstNameNoTooltip] [Select_CString(soldier.IsFemale,'byla odsouzena','byl odsouzen')] k smrti dávno předtím, než jsme se k [Select_CString(soldier.IsFemale,'ní','němu')] dostali.“"
 learning_medicine.2052.a: "Máš pravdu. Děkuji, [helper.GetFirstNameNoTooltip]."
 learning_medicine.2052.b: "O tvou lítost nestojím!"
 learning_medicine.2053.start_my.desc: "Můj"
 learning_medicine.2053.desc: "Mé znalosti mě však nezradí a ruce zůstávají pevné.\n\nNevím, jak se mi to podařilo, ale nakonec to vypadá, že voják přežije. [Select_CString(soldier.IsFemale,'Její','Jeho')] druhové mě plácají po zádech a samou úlevou zapomínají na veškerou etiketu. „Děkujeme, [ROOT.Char.Custom('FormOfAddressForLiege')]. Bez vás bychom [soldier.GetFirstName] ztratili!“"
 learning_medicine.2053.a: "Dnes jsem zachránil[Select_CString(ROOT.Char.IsFemale,'a','')] život!"
 learning_medicine.2054.desc: "\n\nPracuji jako o život a překřikuji všechen ten chaos, ale je to marné. [soldier.GetFirstNameNoTooltip] jen dál slábne a životodárná krev mi proudí mezi prsty.\n\nKdyž tělo odnášejí, [helper.GetFirstName] se na mě dívá s"
 learning_medicine.2054.disgust.desc: "neskrývaným znechucením."
 learning_medicine.2054.pity.desc: "lítostí."
 learning_medicine.2054.a: "Já... Kdybych jen..."
 learning_medicine.2110.t: "Rozhovor u koláčků"
 learning_medicine.2110.desc: "Se svou družinou se vracím z krátké výpravy do [capital.GetNameNoTooltip], když nečekaně narazíme na [hashish_vassal_or_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] s doprovodem, jak se bez ohlášení potloukají po mém hlavním městě za jakousi záležitostí.\n\n"
 learning_medicine.2110.desc_good_terms: "„Ach, [ROOT.Char.GetFirstNameNoTooltip]! Doufal[Select_CString(hashish_vassal_or_liege.IsFemale,'a','')] jsem, že na tebe narazím. Pojď, kousek odsud jsem objevil[Select_CString(hashish_vassal_or_liege.IsFemale,'a','')] naprosto rozkošnou hospůdku. Dáš si se mnou [ROOT.Char.Custom('GetExpensiveDrink')] a koláčky s hašišem?“"
 learning_medicine.2110.desc_bad_terms: "Napětí ve vzduchu by se dalo krájet a stráže na obou stranách se už už chystají do boje. „[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ ozve se za mnou nervózní mladý voják, „co kdybychom se všichni uklidnili u hašišových koláčků v tamté hospůdce?“\n\nObě skupiny ztichnou a [hashish_vassal_or_liege.GetFirstNameNoTooltip] čeká na mou odpověď."
 learning_medicine.2110.desc_neutral_terms: "Překvapení nás na několik nepříjemných okamžiků umlčí, než pohled [hashish_vassal_or_liege.GetFirstNameNoTooltip] spočine na něčem za mými zády.\n\n„Ach, [hashish_vassal_or_liege.Custom2('RelationToMe', ROOT.Char)], co kdybychom na tohle zapomněli nad [ROOT.Char.Custom('GetExpensiveDrink')] a hašišovými koláčky?“"
 learning_medicine.2110.a.good_terms: "Omlouvám se, ale musím jít."
 learning_medicine.2110.a.bad_terms: "S tímhle ničemou? Nikdy!"
 learning_medicine.2110.a.neutral_terms: "Obávám se, že mám jiné povinnosti."
 learning_medicine.2110.b.good_terms: "Možná se nechám zlákat k malému požitku..."
 learning_medicine.2110.b.bad_terms: "Dobrá. Ale #EMP jen jeden#! koláček."
 learning_medicine.2110.b.neutral_terms: "Snad bychom si mohli dát jeden nebo dva..."
 learning_medicine.2110.b.flavour: "Z jednoho koláčku jsou dva, pak tři, pak pět..."
 cosmic_insights_modifier: "Kosmické poznání"
 cosmic_insights_modifier_desc: "Dlouhá noc strávená požíváním hašiše dala této postavě skutečně nahlédnout do podstaty reality."
 learning_medicine.2110.c.good_terms: "Jen se snaž držet krok, příteli!"
 learning_medicine.2110.c.bad_terms: "Má výdrž je legendární!"
 learning_medicine.2110.c.neutral_terms: "Dnes v noci si pořádně dopřejeme!"
 learning_medicine.2110.c.tt_success: "Hašiš rozváže [hashish_vassal_or_liege.GetFirstNameNoTooltip] jazyk"
 learning_medicine.2110.c.tt_fail: "Přeženu to a prozradím víc, než bych měl[Select_CString(ROOT.Char.IsFemale,'a','')]"
 learning_medicine_special.1001.t: "Tajemství těla"
 learning_medicine_special.1001.desc: "Lidské tělo a všechna tajemství, která před námi stále skrývá, mě nepřestávají fascinovat. Otázky života a smrti mi neustále zaměstnávají mysl.\n\nČíst o tomto tématu je jistě užitečné, ale nemohu se zbavit pocitu, že praktickým zkoumáním bych se dozvěděl[Select_CString(ROOT.Char.IsFemale,'a','')] mnohem víc."
 learning_medicine_special.1001.a: "Prozkoumám, co nemoc napáchala na mrtvém těle."
 learning_medicine_special.1001.b: "Těla mrtvých si zaslouží naši úctu!"
 learning_medicine_special.1002.desc: "Snažím se zadržet dech, když se probírám změtí slizkých, zduřelých vnitřností vyhřezlých z břicha mrtvoly, ale marně. Hnilobný zápach rozkladu si pomalu nachází cestu do mých plic a zvedá se mi žaludek.\n\nPak se cosi protrhne a po pitevním stole se rozlije proud vazké, nažloutlé tekutiny.\n\n„Co to #EMP bylo#!?“"
 learning_medicine_special.1002.a: "Možná mi [scoped_physician.GetTitledFirstNameNoTooltip] pomůže?"
 learning_medicine_special.1002.a.good: "[scoped_physician.GetTitledFirstName] mi pomůže s výzkumem"
 learning_medicine_special.1002.a.bad: "Mé pokusy [scoped_physician.GetTitledFirstName] zděsí"
 learning_medicine_special.1002.b: "Potřebuji jen najít další těla... Nějak."
 learning_medicine_special.1002.c: "Dost! Tohle je nedůstojné!"
 learning_medicine_special.1003.desc_physician: "[scoped_physician.GetTitledFirstName] přijal[Select_CString(scoped_physician.IsFemale,'a','')] můj nově objevený zájem o anatomii s nadšením. Díky této pomoci jsem výrazně prohloubil[Select_CString(ROOT.Char.IsFemale,'a','')] své znalosti lidského těla."
 learning_medicine_special.1003.desc_fallback: "Díky několika mincím ve správných rukou a mlčenlivému služebnictvu mám zajištěn stálý přísun těl k pokusům. Bohužel většinu z nich nakonec spíš zmasakruji, ale jak se má člověk něco naučit, aniž by udělal chybu nebo rovnou tucet?"
 learning_medicine_special.1003.desc_ending: "\n\nKéž by jen existoval způsob, jak zahnat ten zápach... Začínám se obávat, že tolik špatného vzduchu mému zdraví neprospívá."
 learning_medicine_special.1003.a: "Možná by pomohly nějaké květiny?"
 learning_medicine_special.1003.a.good: "Má opatření mě ochrání před nemocí"
 learning_medicine_special.1003.a.bad: "Zápach mrtvol začne narušovat mé tělesné šťávy"
 learning_medicine_special.1003.b: "Myslím, že už jsem se naučil[Select_CString(ROOT.Char.IsFemale,'a','')] dost."
 learning_medicine_special.1004.desc: "Z mých pokusů nebyl [scoped_physician.GetTitledFirstName] vůbec potěšen. Jakoukoli pomoc odmítá a kárá mě, že podobné počínání nepřísluší postavení, jaké zastává [ROOT.Char.GetTitleTierName]."
 learning_medicine_special.1004.unavailable.desc: "Protože mi [scoped_physician.GetTitledFirstName] už nemůže pomáhat, nedokážu ve svých pokusech s lidskou anatomií pokračovat."
 learning_medicine_special.1004.a: "Možná máš pravdu..."
 learning_medicine_special.1004.unavailable.a: "Běda."
 learning_medicine_special.1004.unavailable.tt: "Přestaneš zkoumat lidské mrtvoly"
 learning_medicine_special.1005.desc: "Naštěstí se zdá, že správné rozmístění květin, pálení kadidla a větrání zmírnily účinky škodlivých výparů, které z mrtvol působily na mé tělo.\n\nKonečně se mohu soustředit na své studium bez obav, že si naruším rovnováhu tělesných šťáv."
 learning_medicine_special.1005.a: "Poznání už nestojí nic v cestě!"
 learning_medicine_special.1006.desc_opening: "Stojím nad jedním z těl, které už několik dní leží v mé pracovně, když mě náhle znovu přepadne závrať."
 learning_medicine_special.1006.desc_death: "Netrvá dlouho a přidá se kašel. Když se bolestí sehnu, ucítím, jak mi mezi rty stéká krev.\n\nMrknu a najednou ležím na zemi. Chrčivě se nadechnu, ale další nádech už nepřijde. Zavírám oči..."
 learning_medicine_special.1006.desc: "Potřeby vlastního těla už nemohu dál přehlížet. Musím s tím přestat a na chvíli si lehnout..."
 learning_medicine_special.1006.a: "Pach smrti narušil mé tělesné šťávy!"
 learning_medicine_special.2100.t: "Nanejvýš zázračná ryba"
 learning_medicine_special.2100.desc: "Přede mě předstoupil[Select_CString(fish_alchemist.IsFemale,'a','')] místní [Select_CString(fish_alchemist.IsFemale,'rybářka','rybář')] z [hallucinogenic_fish_county.GetNameNoTierNoTooltip], [fish_alchemist.GetName], s tvrzením, že umí připravit kouzelnou večeři.\n\nÚdajně na tajném místě loví snové ryby a provádí nad nimi podivné rituály. Poté podává jejich hlavy a každá taková ryba prý po pozření vyvolává celé dny extatické vize.\n\n[Select_CString(fish_alchemist.IsFemale,'Rybářka','Rybář')] si nervózně mne ruce a hledí na mě očima, v nichž se mísí chamtivost se strachem."
 learning_medicine_special.2100.a: "Připrav mi jednu ze svých kouzelných ryb."
 learning_medicine_special.2100.a.tt_success: "Obdržím božská zjevení o [ROOT.Char.GetFaith.PositiveAfterLife]"
 hallucinogenic_visions_uplifting_modifier: "Povznášející vize posmrtného života"
 hallucinogenic_visions_uplifting_modifier_desc: "Tato postava obdržela mysl proměňující zjevení blaženosti, která čeká na vyvolené v posmrtném životě."
 learning_medicine_special.2100.a.tt_failure: "Zakusím noční můry o [ROOT.Char.GetFaith.NegativeAfterLife]"
 hallucinogenic_visions_terrifying_modifier: "Děsivé vize posmrtného života"
 hallucinogenic_visions_terrifying_modifier_desc: "Tuto postavu sužují mysl drásající vize hrůz, které čekají na nehodné v posmrtném životě."
 learning_medicine_special.2100.b: "Ten rituál... Ten mě musíš naučit."
 learning_medicine_special.2100.b.tt_success: "[Select_CString(fish_alchemist.IsFemale,'Rolnice odhalí','Rolník odhalí')] svá tajemství"
 learning_medicine_special.2100.b.tt_success.tt: "[fish_alchemist.GetShortUINameNoTooltip] vstoupí do tvého dvora jako věrný služebník"
 learning_medicine_special.2100.b.tt_fail: "Pohádám se s [Select_CString(fish_alchemist.IsFemale,'prostou ženou','prostým mužem')]"
 learning_medicine_special.2100.b.tt_failure.tt: "[fish_alchemist.GetShortUINameNoTooltip] rozhořčeně uprchne z tvého dvora"
 associates_with_strange_peasants_modifier: "Stýká se s podivnými rolníky"
 associates_with_strange_peasants_modifier_desc: "Tato postava je známá tím, že se pouští do podivných hádek s lidmi hluboko pod svým společenským postavením."
 learning_medicine_special.2100.c: "Nenech čarodějnici naživu!"
 learning_medicine_special.2100.c.tt: "[fish_alchemist.GetShortUINameNoTooltip] je upálen[Select_CString(fish_alchemist.IsFemale,'a','')] na hranici"
 learning_medicine_special.2100.d: "Může někdo laskavě odvést [Select_CString(fish_alchemist.IsFemale,'tu selku','toho sedláka')]?"
 learning_medicine_special.2100.d.tt: "[fish_alchemist.GetShortUINameNoTooltip] je zahořkle vyhozen[Select_CString(fish_alchemist.IsFemale,'a','')] z tvého dvora"
 aloof_from_the_commoners_modifier: "Odtažitost vůči prostému lidu"
 aloof_from_the_commoners_modifier_desc: "Tato postava má pověst někoho, kdo odmítá rolníky, kteří ji jen připravují o čas."
