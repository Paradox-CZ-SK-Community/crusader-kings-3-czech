l_polish:
 learning_zealous_path_tt: "#F Tato volba tě může zavést na cestu horlivosti#!"
 learning_cynical_path_tt: "#F Tato volba tě může zavést na cestu cynismu#!"
 learning_scholarship_focus_point_clear_gain: "Lépe chápeš [Concept('learning_lifestyle','učený životní styl')|E]"
 learning_lifestyle_rank_up_indication: "Můžeš získat [Concept('perk','talent')|E] pro [Concept('learning_lifestyle','učený životní styl')|E]"
 learning_lifestyle_experience_gain_indication: "Můžeš získat [Concept('lifestyle_experience','zkušenosti životního stylu')|E] pro [Concept('learning_lifestyle','učený životní styl')|E]"
 learning_scholarship.1101.t: "Negramotnost"
 learning_scholarship.1101.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [Select_CString(bishop.IsFemale,'doslechla','doslechl')] jsem se, že možná potřebujete trochu výuky v umění... luštění psaného slova,“ pronese [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)] a podá mi svitek.\n\n„Pokud si to [ROOT.Char.GetLadyLord] přeje, [Select_CString(bishop.IsFemale,'ráda vás budu učit','rád vás budu učit')]. Mám tu pro vás dokonalý text.“"
 learning_scholarship.1101.a: "Kr... král má... měl velkou korunu..."
 learning_scholarship.1101.b: "Číst přece umím!"
 learning_scholarship.1201.t: "Zpěvný ptáček"
 learning_scholarship.1201.desc: "Peří z lesklého kovu, oči z drahokamů, hlas znějící jako zvonkohra... Mechanický pták, kterého mi [Select_CString(bird_sender.IsFemale,'darovala','daroval')] [bird_sender.Custom2('MyCharacterIntroduction', ROOT.Char)], je skutečným mistrovským dílem!\n\n„Tohoto ptáka vyrobili ti nejlepší řemeslníci v celé [bird_sender.GetPrimaryTitle.GetNameNoTierNoTooltip],“ stojí v přiloženém dopise. „Myslím, že vás bude náramně zajímat.“"
 learning_scholarship.1201.a: "Prodat ho."
 learning_scholarship.1201.b: "Vystavit ho."
 learning_scholarship.1201.c: "Rozebrat ho a prozkoumat jeho mechanismus."
 learning_scholarship.1201.c.success: "[bird_sender.GetTitledFirstNameNoTooltip] je [Select_CString(bird_sender.IsFemale,'učená žena','učený muž')]"
 learning_scholarship.1201.c.failure: "[bird_sender.GetTitledFirstNameNoTooltip] se urazí"
 learning_scholarship.1401.t: "Skleněný kámen"
 learning_scholarship.1401.desc: "Když se snažím rozeznat drobná písmena na svitku přede mnou, znovu mě začíná bolet hlava. Proč písaři trvají na tak titěrných znacích?!\n\nPřimhouřím oči a zkusím to znovu.\n\n„...hotový zázrak. S pomocí skleněného kamene mohou bez námahy číst dokonce i [ROOT.Char.GetWomenMen] v pokročilém věku, kterým slábne zrak.“"
 learning_scholarship.1401.a: "Jeden takový kámen potřebuji!"
 learning_scholarship.1401.b: "Prodat všechno, co se nedá přečíst."
 learning_scholarship.1401.c: "[bishop.GetTitledFirstNameNoTooltip], potřebuji tvou pomoc!"
 learning_scholarship.3001.t: "Vize božského"
 learning_scholarship.3001.desc: "Přivolám [chaplain.GetTitledFirstName], svého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))], do kruhu mosazných koulí a svící rozmístěných na stojanech po celé temné místnosti. Kadidlo, které má zahnat škodlivé výpary, brzy naplní vzduch tak těžkou vůní, že nám začnou slzet oči. „Právě takhle koutkem oka zahlédneme nepostižitelnou podobu andělů.“\n\n[chaplain.GetFirstNameNoTooltip] však brzy zaváhá. „Tohle není správné. Jsou to božské bytosti, které smrtelné oči nemají spatřit.“"
 learning_scholarship.3001.a: "Můžeš odejít, ale já se pravdu tak či tak dozvím."
 learning_scholarship.3001.b: "Ano, je to bláhové počínání, ne-li přímo hřích."
 learning_scholarship.3001.c: "Ujišťuji tě, že mé úmysly jsou čisté!"
 learning_scholarship.3001.c.tt1: "Přesvědčím [chaplain.GetFirstName], aby mi [Select_CString(chaplain.IsFemale,'pomohla','pomohl')]"
 learning_scholarship.3001.c.toast.tt1: "Mé prosby [chaplain.GetFirstName] přesvědčily"
 learning_scholarship.3001.c.tt2: "Nepodaří se mi přesvědčit [chaplain.GetFirstName]"
 learning_scholarship.3001.c.toast.tt2: "[chaplain.GetFirstName] odmítne mé důvody"
 book_translation_story: "Překlad významného díla"
 book_translation_story_desc: "Překladem významného díla umožníš ostatním čerpat z jeho moudrosti. Dovršení tohoto ambiciózního intelektuálního počinu bude důkazem tvé zářivé geniality; neúspěch tě naopak označí za tupce."
 TRANSLATION_STORY: "Překládáš dílo [Story.GetOwner.Custom('TranslationBookLong')]"
 TRANSLATION_QUALITY: "Kvalita překladu"
 POOR_TRANSLATION: "Špatná"
 EXCELLENT_TRANSLATION: "Vynikající"
 DURATION_LEFT: "Zbývající doba"
 PROGRESS_TOWARDS_CYNICISM: "Postup k cynismu"
 CYNICISM: "Cynismus"
 ZEALOTRY: "Horlivost"
 learning_scholarship_special.2001.t: "Nový překlad"
 learning_scholarship_special.2001.desc: "Čím víc se vzdělávám, tím jasněji si uvědomuji, kolik toho ještě nevím. A kolik vědomostí se asi během věků ztratilo, když se knihy rozpadly nebo jejich jazyky upadly v zapomnění...\n\nMožná bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] přispět tím, že pořídím nový překlad některého z klasických děl?\n\nJenže co vlastně překládat...?"
 learning_scholarship_special.2001.regula_pastoralis: "Regula Pastoralis, pojednání o tom, jak vést dobrý život."
 learning_scholarship_special.2001.physica_elementa: "Klasické vědecké dílo — Aristotelova Physica!"
 learning_scholarship_special.2001.almagest: "Zkoumat nebesa prostřednictvím Ptolemaiova Almagestu."
 learning_scholarship_special.2001.elements: "Základy, Eukleidovo matematické pojednání!"
 learning_scholarship_special.2001.corpus_hermeticus: "Mystické poznání obsažené v Corpus Hermeticum!"
 learning_scholarship_special.2001.treatises_of_hippocrates: "Lékařské poznatky z Hippokratových spisů."
 learning_scholarship_special.2001.peri_psyches: "Slavné Aristotelovo dílo O duši!"
 learning_scholarship_special.2001.kategoriai: "Kategorie, pojednání vymezující všechny podměty a přísudky."
 learning_scholarship_special.2001.avesta: "Avesta, starobylé perské posvátné texty."
 learning_scholarship_special.2001.de_oratore: "Ciceronovy lekce rétoriky v díle O řečníkovi!"
 learning_scholarship_special.2001.book_of_arda_viraf: "Snová pouť z Knihy Arda Viraf."
 learning_scholarship_special.2001.upanishads: "Upanišady, nejslavnější z védských textů!"
 learning_scholarship_special.2001.rigveda: "Náboženské hymny Rígvédy."
 learning_scholarship_special.2001.book_of_balances: "Kompendium o výpočtech."
 learning_scholarship_special.2001.secret_of_secrets: "Tajemství tajemství, darované Alexandrovi."
 learning_scholarship_special.2001.court_of_agriculture: "Kniha o zemědělství."
 learning_scholarship_special.2001.lanterns_of_wisdom: "Alchymistické nauky v Lucernách moudrosti."
 learning_scholarship_special.2001.shahnameh: "Šáhnáma, báseň o dějinách Persie."
 learning_scholarship_special.2001.arithmetica: "Aritmetika a komentáře Diofanta."
 learning_scholarship_special.2001.pali_canon: "Jeden z textů Pálijského kánonu."
 learning_scholarship_special.2001.the_norse_sagas: "Jedna ze severských ság!"
 learning_scholarship_special.2001.family_history: "Něco osobního — dějiny mého rodu."
 learning_scholarship_special.2001.ancient_myths: "Něco velkolepého — jeden z dávných mýtů!"
 learning_scholarship_special.2001.decline: "Tohle zní příliš náročně."
 book_translation_tooltip.unchanged: "#V Kvalita překladu#! zůstane beze změny"
 book_translation_tooltip.more_good: "#V Kvalita překladu#! se výrazně zlepší"
 book_translation_tooltip.less_good: "#V Kvalita překladu#! se mírně zlepší"
 book_translation_tooltip.finish_faster: "Překlad bude dokončen rychleji"
 book_translation_toast.unchanged: "#V Kvalita překladu#! zůstala beze změny"
 book_translation_toast.more_good: "#V Kvalita překladu#! se výrazně zlepšila"
 book_translation_toast.less_good: "#V Kvalita překladu#! se mírně zlepšila"
 book_translation_toast.finish_faster: "Překlad bude dokončen rychleji"
 learning_scholarship_special.2011.desc: "Práce na překladu díla [ROOT.Char.Custom('TranslationBook')] pokračuje, ale jedna pasáž ve verzi, z níž překládám, mě zarazí.\n\nPísaři trvají na tom, že slova na stránce znamenají: „jak držíme dvě chodidla a vzestupné okraje ducha lovce“.\n\nTo přece nemůže být správně, nebo ano?"
 learning_scholarship_special.2011.a: "Vymyslím něco, co sem bude sedět lépe."
 learning_scholarship_special.2011.a.success: "Vylepším text"
 learning_scholarship_special.2011.a.failure: "Ztratím původní význam"
 learning_scholarship_special.2011.b: "Přeložíme text přesně tak, jak je napsán!"
 learning_scholarship_special.2011.c: "Ale vždyť je význam zřejmý. Nech to na mně."
 learning_scholarship_special.2012.desc: "Jedna konkrétní pasáž v díle [ROOT.Char.Custom('TranslationBook')] už celé dny maří mé překladatelské úsilí. Dokonce si ji občas začínám mumlat pro sebe.\n\n„Pořád se s tím trápíš?“ Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))] pozvedne těžký starý svazek. „Stačí jen vědět, kde hledat.“"
 learning_scholarship_special.2012.a: "Pomoz mi to rozluštit, [realm_priest.GetFirstNameNoTooltip]!"
 learning_scholarship_special.2012.a.success: "[realm_priest.GetShortUINameNoTooltip] najde odpověď"
 learning_scholarship_special.2012.a.failure: "[realm_priest.GetShortUINameNoTooltip] najde něco, co se odpovědi alespoň podobá"
 learning_scholarship_special.2012.b: "Žádné hry. Prostě mi řekni, co mám hledat."
 learning_scholarship_special.2012.c: "Tak mi to ukaž, [realm_priest.GetFirstNameNoTooltip]."
 learning_scholarship_special.2012.c.friendship_tooltip: "Tato možnost je dostupná, protože [realm_priest.GetFirstNameNoTooltip] je [Select_CString(realm_priest.IsFemale,'tvá přítelkyně','tvůj přítel')]"
 learning_scholarship_special.2013.desc: "Nechávám si předčítat poznámky k překladu díla [ROOT.Char.Custom('TranslationBook')], když mi náhle všechno dojde. „Písaři! Přidejte následující komentář...“"
 learning_scholarship_special.2013.a: "„Na rozdíl od [ROOT.Char.GetFaith.ReligiousText] toto dílo tvrdí, že...“"
 learning_scholarship_special.2013.b: "„[ROOT.Char.GetFaith.HighGodNamePossessive] plán je zřejmý...“"
 learning_scholarship_special.2014.desc: "Nechávám si předčítat poznámky k překladu díla [ROOT.Char.Custom('TranslationBook')], když...\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]? Odpusťte mi, ale... vy jste [Select_CString(ROOT.Char.IsFemale,'usnula','usnul')]?!“\n\nNebesa nade mnou, tahle „klasika“ je naprostý blábol!"
 learning_scholarship_special.2014.a: "Přesto se tím donutím prokousat!"
 learning_scholarship_special.2014.b: "Písaři mohou převzít větší díl práce."
 learning_scholarship_special.2014.c: "Potřebuji si od toho všeho odpočinout."
 learning_scholarship_special.2015.desc: "Nad překladem díla [ROOT.Char.Custom('TranslationBook')] trávím celé hodiny v mihotavém světle svíčky. Často si sotva všimnu, jak čas plyne. Písaři mi to však připomenou.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], vždyť už musí být dávno po půlnoci. Není čas si odpočinout?“"
 learning_scholarship_special.2015.a: "„Ne, musíme pokračovat, dokud nebudu mít dost!“"
 learning_scholarship_special.2015.b: "„Ano, trocha spánku nám všem prospěje.“"
 learning_scholarship_special.2015.c: "„Vy můžete pokračovat v práci, zatímco já si odpočinu.“"
 learning_scholarship_special.2016.desc: "Jeden z mých písařů bez mého vědomí upravoval můj překlad díla [ROOT.Char.Custom('TranslationBook')]!\n\n„Jen jsem chtěl, aby byl co nejlepší! Vždycky se vám líbil, dokud jste si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')], že je to vaše vlastní práce!“"
 learning_scholarship_special.2016.a: "Už nikdy nebudeš pro nikoho opisovat text!"
 learning_scholarship_special.2016.b: "Za tohle zaplatíš!"
 learning_scholarship_special.2016.b.flavor: "„A vy ostatní písaři si z toho vezměte ponaučení!“"
 learning_scholarship_special.2016.c: "Tohle... je vlastně docela dobré."
 learning_scholarship_special.2017.desc: "Neustálá práce na překladu díla [ROOT.Char.Custom('TranslationBook')] je vyčerpávající. Nepolevující soustředění, porozumění a tvořivost, které vyžaduje, mě vysávají, i když se dokončení stále přibližuje."
 learning_scholarship_special.2017.a: "Dnes večer ještě pár stránek a ráno zase pár dalších..."
 learning_scholarship_special.2017.b: "Dokud to nebude hotové, musím se odloučit od všeho, co by mě mohlo rozptylovat."
 learning_scholarship_special.2017.c: "Kniha může chvíli počkat."
 learning_scholarship_special.2097.t: "Vynikající překlad"
 learning_scholarship_special.2097.opening: "Můj překlad díla [ROOT.Char.Custom('TranslationBook')] je konečně dokončen. Má slova spočívají na nádherně iluminovaných stránkách, chráněných honosnou vazbou, jak se na význam takového díla sluší."
 learning_scholarship_special.2097.conclusion: "\n\nSvazek získal čestné místo v mé sbírce a při četbě vždy na [ROOT.Char.GetFaith.PriestNeuter] silně zapůsobí mé úsilí. Někteří už dokonce mluví o pořízení vlastních opisů."
 learning_scholarship_special.2097.a: "Tahle práce mě naučila tolik nového."
 learning_scholarship_special.2098.t: "Můj překlad je dokončen"
 learning_scholarship_special.2098.opening: "Po dlouhém úsilí je můj překlad díla [ROOT.Char.Custom('TranslationBook')] konečně hotový. Text obklopují nádherné iluminace a ty nejhonosnější odvádějí pozornost od pasáží, u nichž jsem si [Select_CString(ROOT.Char.IsFemale,'nebyla','nebyl')] [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')]."
 learning_scholarship_special.2098.conclusion: "\n\nMísty může být trochu obtížné mu porozumět, ale není pochyb, že tento překlad je velmi potřebný. Teď spočívá v mé sbírce, kde jej často čtou [ROOT.Char.GetFaith.DevoteeNeuterPlural], a já netrpělivě očekávám první pokusy o jeho opis."
 learning_scholarship_special.2098.a: "Tolik jsem se při tom [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')]!"
 learning_scholarship_special.3001.t: "Z olova zlato"
 learning_scholarship_special.3001.desc_opening: "Proměna olova ve zlato je odedávna snem alchymistů po celém světě. Mnozí se o tento čin pokoušeli, ale není známo, že by kdy někdo uspěl.\n\n"
 learning_scholarship_special.3001.desc_alchemist: "[alchemist.Custom2('MyCharacterIntroduction', ROOT.Char)|U] však narazí na poznámky vepsané na okraj knihy o rostlinách. Podle nich lze vytvořit „zlatý déšť“ vařením olověného cukru ve filtrovaném roztoku popela z mořských řas."
 learning_scholarship_special.3001.desc: "Přesto narazím na poznámky vepsané na okraj knihy o rostlinách. Podle nich lze vytvořit „zlatý déšť“ vařením olověného cukru ve filtrovaném roztoku popela z mořských řas."
 learning_scholarship_special.3001.desc_ending: "\n\nMohlo by něco takového skutečně fungovat?"
 learning_scholarship_special.3001.a: "Když nic jiného, stojí to za prozkoumání..."
 learning_scholarship_special.3001.b: "Tyhle čmáranice jsou očividně jen nesmyslný žert."
 learning_scholarship_special.3001.c: "Taková honba za bohatstvím je sama o sobě bezbožná!"
 learning_scholarship_special.3001.d: "Sliby čarodějnictví mě nezlákají!"
 learning_scholarship_special.3002.desc_alchemist: "První činidlo, které musíme získat, je olověný cukr, přísada používaná ke slazení vína.\n\nMůžeme najít dodavatele a nechat si potřebné množství dovézt, ale bude to drahé. Případně si ho můžeme levně vyrobit sami tak, že spálíme kovové olovo a vzniklý popel rozpustíme v octě..."
 learning_scholarship_special.3002.desc: "První činidlo, které potřebuji získat, je olověný cukr, přísada používaná ke slazení vína.\n\nMohu najít dodavatele a nechat si potřebné množství dovézt, ale bude to drahé. Případně si ho mohu levně vyrobit [Select_CString(ROOT.Char.IsFemale,'sama','sám')] tak, že spálím kovové olovo a vzniklý popel rozpustím v octě..."
 learning_scholarship_special.3002.a: "Kdo chce vydělat, musí nejdřív utratit!"
 learning_scholarship_special.3002.b: "Jak se mám něco naučit, když všechnu práci udělají ostatní?!"
 learning_scholarship_special.3002.b_alchemist: "Jak se máme něco naučit, když všechnu práci udělají ostatní?!"
 learning_scholarship_special.3002.a.success: "Olověný cukr vyrobíš bez nehody"
 learning_scholarship_special.3002.a.failure: "Z olověných výparů tě rozbolí hlava"
 learning_scholarship_special.3002.tt: "Získáš olověný cukr"
 learning_scholarship_special.3002.c: "Když o tom tak přemýšlím, není to dobrý nápad..."
 learning_scholarship_special.3003.desc_alchemist: "Druhé činidlo, které musíme získat, jsou mořské řasy... spousta mořských řas. Sto drachem, nasekaných a poté usušených. Kde seženeme takové množství?"
 learning_scholarship_special.3003.desc: "Druhé činidlo, které potřebuji získat, jsou mořské řasy... spousta mořských řas. Sto drachem, nasekaných a poté usušených. Kde seženu takové množství?"
 learning_scholarship_special.3003.a: "Nechám je dovézt z různých pobřežních měst."
 learning_scholarship_special.3003.b: "Uvalím na své poddané daň z mořských řas!"
 learning_scholarship_special.3003.c: "Olovo můžu nakonec prostě použít ke slazení vína..."
 learning_scholarship_special.3003.tt: "Získáš mořské řasy"
 learning_scholarship_special.3004.desc_alchemist: "Konečně máme všechna činidla potřebná k vytvoření zlatého deště!\n\nOlověný cukr je bezpečně uložen ve vodotěsných sudech. Svazky usušených mořských řas jsou naskládány v peci a připraveny ke spálení.\n\nBude to naše vrcholné dílo?"
 learning_scholarship_special.3004.desc: "Konečně mám všechna činidla potřebná k vytvoření zlatého deště!\n\nOlověný cukr je bezpečně uložen ve vodotěsných sudech. Svazky usušených mořských řas jsou naskládány v peci a připraveny ke spálení.\n\nBude to mé vrcholné dílo?"
 learning_scholarship_special.3004.a: "Zahájit pokus!"
 learning_scholarship_special.3004.a.success: "Podaří se ti vytvořit zlatý déšť"
 learning_scholarship_special.3004.a.success.tt: "Bohatství a sláva jsou tvé!"
 learning_scholarship_special.3004.a.failure: "Postup nefunguje podle očekávání"
 learning_scholarship_special.3004.a.failure.tt: "Ale co jsi tedy [Select_CString(ROOT.Char.IsFemale,'vytvořila','vytvořil')]?"
 learning_scholarship_special.3004.b: "...co to vlastně dělám? Tohle je hloupost."
 learning_scholarship_special.3005.desc_alchemist: "Jakmile do roztoku přimícháme olověný cukr, náhle se zbarví jasně žlutě! Když směs po převaření zprůhlední, na okamžik nás přepadnou obavy, ale po vychladnutí se v baňce začnou tvořit drobné zlatavé krystaly.\n\nPři bližším zkoumání zjistíme, že nejde o skutečné zlato, protože jsou průsvitné. Je však možné, že tato reakce představuje jeden z bájných „12 zásadních procesů“ potřebných k vytvoření zlata!"
 learning_scholarship_special.3005.desc: "Jakmile do roztoku přimíchám olověný cukr, náhle se zbarví jasně žlutě! Když směs po převaření zprůhlední, na okamžik mě přepadnou obavy, ale po vychladnutí se v baňce začnou tvořit drobné zlatavé krystaly.\n\nPři bližším zkoumání zjistím, že nejde o skutečné zlato, protože jsou průsvitné. Je však možné, že tato reakce představuje jeden z bájných „12 zásadních procesů“ potřebných k vytvoření zlata!"
 learning_scholarship_special.3005.a: "Jsem o krok blíž skutečné transmutaci?"
 learning_scholarship_special.3005.a_alchemist: "Jsme o krok blíž skutečné transmutaci?"
 learning_scholarship_special.3006.desc_alchemist: "Jakmile do převařeného popela z mořských řas přimícháme olověný cukr, směs náhle získá zářivě žlutou barvu.\n\nSkutečné zlato se nám sice vyrobit nepodařilo, ale zjistili jsme, že náš roztok lze použít jako barvivo, které svou sytostí soupeří se šafránem. Jeho prodej mi umožní získat zpět alespoň část nákladů."
 learning_scholarship_special.3006.desc: "Jakmile do převařeného popela z mořských řas přimíchám olověný cukr, směs náhle získá zářivě žlutou barvu.\n\nSkutečné zlato se mi sice vyrobit nepodařilo, ale zjistím, že můj roztok lze použít jako barvivo, které svou sytostí soupeří se šafránem. Jeho prodej mi umožní získat zpět alespoň část nákladů."
 learning_scholarship_special.3006.a: "Pěkné, jen výroba se příliš nevyplatí."
 learning_scholarship_special.3007.desc_alchemist: "Po spálení mořských řas a smíchání popela s vodou nám zbude znepokojivé množství odporného hnědého kalu. Protože nevíme, co dál, přimícháme do roztoku olověný cukr, ale žádná viditelná změna nenastane.\n\nBohužel mě napadá jediné využití výsledku našeho pokusu: použít ho jako hnojivo."
 learning_scholarship_special.3007.desc: "Po spálení mořských řas a smíchání popela s vodou mi zbude znepokojivé množství odporného hnědého kalu. Protože nevím, co dál, přimíchám do roztoku olověný cukr, ale žádná viditelná změna nenastane.\n\nBohužel mě napadá jediné využití výsledku mého pokusu: použít ho jako hnojivo."
 learning_scholarship_special.3007.a: "Tak snad letos alespoň dobře poroste úroda?"
 learning_scholarship_special.3099.termination.toast: "Transmutace zmařena"
 learning_scholarship_special.3099.termination.desc.prison: "Z vězení nemohu v pokusech s transmutací pokračovat."
 learning_scholarship_special.3099.termination.desc.incapable: "Ve svém současném stavu nemohu v pokusech s transmutací pokračovat."
 learning_scholarship.4000.t: "Jdi už ven!"
 learning_scholarship.4000.desc: "Je pozdě a já se právě začítám do strhujícího pojednání o klasické gramatice. Sotva se začnu pochechtávat nad nádherně jízlivými poznámkami, které předchozí čtenář zanechal na okraji stránky, vstoupí do [ROOT.Char.Custom('GetRoom')] [Select_CString(spouse_uninterested_in_study.IsFemale,'má manželka','můj manžel')].\n\n„Ty bezpáteřní knihomole! Nestaráš se o nic než o své studium a od soumraku do úsvitu sedíš [Select_CString(ROOT.Char.IsFemale,'sama','sám')] uvnitř nad knihami. Vytáhni konečně hlavu z těch zaprášených svitků, nebo se dnes do mé postele ani nepřibližuj.“"
 learning_scholarship.4000.a: "Jak si přeješ."
 learning_scholarship.4000.b: "Možná bychom si odteď mohli některé pasáže číst společně."
 learning_scholarship.4000.c: "Musím pracovat dlouho do noci, abych [Select_CString(ROOT.Char.IsFemale,'připravila','připravil')] výuku pro drahé dítě [child_educated.GetFirstNameNoTooltip]."
 learning_scholarship.4000.c.tt: "[spouse_uninterested_in_study.GetFirstName] není [Select_CString(spouse_uninterested_in_study.IsFemale,'matkou','otcem')] postavy [child_educated.GetFirstNameNoTooltip]."
 learning_scholarship.4000.d: "Tebe v posteli nepotřebuji — zahřeje mě náruč poznání!"
 bibliomancy_chain_header: "Posvátný text:"
 learning_scholarship.5000.t: "Posvátný text"
 learning_scholarship.5000.desc: "Při procházce tržištěm na mě od jednoho stánku někdo zavolá a tvrdí, že má něco, co mě jistě zaujme.\n\nKdyž přistoupím blíž, zahltí mé smysly vůně sušených bylin a cizokrajných tinktur. Postava za stánkem se přehrabuje ve sbírce zaprášených svazků a dalších pokladů.\n\nPo chvíli hledání vytáhne starou knihu a naléhá, že ji budu potřebovat kvůli „tomu, co přijde“."
 learning_scholarship.5000.a: "Dobrá, nechám se zlákat."
 learning_scholarship.5000.b: "Snad se dokážeme dohodnout."
 learning_scholarship.5000.c: "Vezmu si, co potřebuji."
 learning_scholarship.5000.d: "K čemu by mi byly tvé knihy?"
 learning_scholarship.5000.b.success: "Vyjednáš lepší cenu"
 learning_scholarship.5000.b.failure: "Nepodaří se ti vyjednat lepší cenu"
 bibliomancy_book_purchased: "Získáš knižní [Concept('artifact','artefakt')|E]"
 learning_scholarship_sacred_artifact_obtained: "Získáš posvátný text"
 learning_scholarship.5001.t: "$bibliomancy_chain_header$ Bibliomancie"
 learning_scholarship.5001.desc: "Když ukládám nově získaný [sacred_text.GetName], vypadne z něj útržek pergamenu. Jsou na něm pokyny k praktice zvané bibliomancie, při níž lze z úryvku knihy věštit vlastní osud.\n\nStačí otevřít text na náhodném místě a přečíst první osudový verš, na který padne můj zrak."
 learning_scholarship.5001.a: "Tomuto pokušení nelze odolat."
 learning_scholarship.5001.b: "S touto bezbožnou praktikou nechci mít nic společného."
 learning_scholarship.5002.t: "$bibliomancy_chain_header$ Osudové čtení"
 learning_scholarship.5002.desc: "Přesně se řídím pokyny a náhodně vyberu pasáž z textu přede mnou. Zachvěji se očekáváním, otevřu oči a čtu:\n\n#EMP Strach zabíjí mysl. Zbabělec umírá tisíci drobných smrtí, zatímco statečný muž zemře jen jednou.#!\n\nCo si z toho mám vzít?"
 learning_scholarship.5002.a: "Strach je malá smrt, která přináší naprosté zničení."
 learning_scholarship.5002.b: "Fascinující. Tohle si žádá další zkoumání."
 learning_scholarship.5002.b.success: "Odhalím skutečný význam této pasáže"
 learning_scholarship.5002.b.failure: "Význam pasáže mi stále uniká"
 learning_scholarship.5002.c: "Naprostý nesmysl!"
 learning_scholarship.5002.c.tt: "Pasáž ignoruješ"
 learning_scholarship.5002.d: "Můj $antiquarian_court_position$ [antiquarian.GetTitledFirstNameNoTooltip] by se na to [Select_CString(antiquarian.IsFemale,'měla podívat','měl podívat')]."
 learning_scholarship.5003.t: "$bibliomancy_chain_header$ Bibliomancie"
 learning_scholarship.5003.desc: "Můj vazal [bibliomancy_antagonist.GetName] už léta v tichosti pochybuje o mých schopnostech. Nedávno mi však správce oznámil, že [bibliomancy_antagonist.GetFirstNameNoTooltip] začíná stále otevřeněji zpochybňovat mé právo vládnout. Mezi ostatními vazaly má značný vliv a snadno by mi [Select_CString(bibliomancy_antagonist.IsFemale,'mohla','mohl')] zkomplikovat život.\n\nMohla snad pasáž z [sacred_text.GetName] předpovědět právě tohle? Strach zabíjí mysl..."
 learning_scholarship.5003.a: "Postavím se svému strachu."
 learning_scholarship.5003.a.tt: "Veřejně se utkám v debatě s [bibliomancy_antagonist.GetName]"
 learning_scholarship.5003.b: "Nejlepší bude postupovat nenápadně."
 learning_scholarship.5003.b.tt: "Formálně se pokusím usmířit s [bibliomancy_antagonist.GetName]"
 learning_scholarship.5003.c: "Probereme to později."
 learning_scholarship.5003.vassal.tt: "Každý vazal"
 learning_scholarship.5003.a.success: "V debatě se svým vazalem zvítězíš"
 learning_scholarship.5003.a.failure: "V debatě se svým vazalem prohraješ"
 learning_scholarship.5003.b.success: "Podaří se ti svého vazala uklidnit"
 learning_scholarship.5003.b.failure: "Nepodaří se ti svého vazala uklidnit"
 learning_scholarship.5004.t: "$bibliomancy_chain_header$ Znepokojivá pasáž"
 learning_scholarship.5004.desc: "Za nic na světě nedokážu pochopit tuto pasáž z [sacred_text.GetName] a už mě to naprosto pohlcuje!\n\nStrach zabíjí mysl... Co to vůbec může znamenat? Čeho bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] bát? #EMP Co mi uniká#!?\n\nMožná by mi to dokázal objasnit někdo jiný."
 learning_scholarship.5004.a: "[court_chaplain.GetCouncilTitle] [court_chaplain.GetTitledFirstNameNoTooltip] bude znát odpověď."
 learning_scholarship.5004.b: "Pomůže mi [target_courtier.GetTitledFirstNameNoTooltip] z mého dvora."
 learning_scholarship.5004.c: "Vzdávám to."
 learning_scholarship.5004.a.success: "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] objasní pasáž"
 learning_scholarship.5004.a.failure: "[court_chaplain.GetCouncilTitle] [court_chaplain.GetFirstNameNoTooltip] pasáži neporozumí"
 learning_scholarship.5004.b.success: "[target_courtier.GetFirstNameNoTooltip] objasní pasáž"
 learning_scholarship.5004.b.failure: "[target_courtier.GetFirstNameNoTooltip] pasáži neporozumí"
 learning_scholarship.5005.t: "$bibliomancy_chain_header$ Není se čeho bát"
 learning_scholarship.5005.desc: "Konečně se mi podařilo rozluštit záhadnou pasáž z [sacred_text.GetName] a cítím se díky tomu mnohem moudřeji. Po onom setkání na tržišti se mi nitky osudu náhle jeví mnohem zřetelněji.\n\nStrach možná zabíjí mysl, ale já už se ho nebojím."
 learning_scholarship.5005.a: "Bez strachu zemřu jen jednou."
 learning_scholarship.5006.t: "$bibliomancy_chain_header$ Narůstající paranoia"
 learning_scholarship.5006.desc: "Po několika dnech strávených nad touto nesrozumitelnou a neproniknutelnou pasáží to nakonec vzdávám. Nemám nejmenší tušení, co by mohla znamenat, a celá tahle záležitost mě děsí až do morku kostí.\n\nCo se stane? Musím teď žít ve strachu #EMP navždy#!?"
 learning_scholarship.5006.a: "Strach je malá smrt, která přináší naprosté zničení."
 learning_scholarship_paranoid_trait.tt: "Tento rys máš, protože se ti nepodařilo pochopit pasáž v [sacred_text.GetName]"
 learning_scholarship_paranoid_trait_possible: "Můžeš získat [Concept('trait','rys')|E] [GetTrait('paranoid').GetName( GetNullCharacter )]"
 learning_scholarship.6000.t: "[Select_CString(illiterate.IsFemale,'Žena mála písmen','Muž mála písmen')]"
 learning_scholarship.6000.desc: "[teacher.Custom2('HerHisCharacterIntroduction',illiterate)|U] se ze všech sil snaží, ale [illiterate.GetName] zůstává gramotností zhruba na úrovni průměrného vesnického hlupáka.\n\n„[ROOT.Char.GetTitleTierName|U], jste ztělesněním moudrosti a osvícenosti,“ podlézá [teacher.GetFirstNameNoTooltip]. „Jak mám svého lenního pána přimět, aby se naučil číst?“"
 learning_scholarship.6000.willing_pupil: "\n\n[teacher.GetFirstNameNoTooltip] si podrážděně povzdechne.\n\n„[illiterate.GetTitleAsNameNoTooltip|U] přece nebude trávit dlouhé hodiny studiem jen kvůli samotnému čtení...“"
 learning_scholarship.6000.holy_book_insult: "\n\n[teacher.GetFirstNameNoTooltip] zaváhá a pak zamumlá:\n\n„Po prvních namáhavě přečtených svatých řádcích z [illiterate.GetFaith.ReligiousText] zaznělo cosi, co nebylo ani svaté, #EMP ani#! osvícené...“"
 learning_scholarship.6000.poetry_insult: "\n\n[teacher.GetFirstNameNoTooltip] se zašklebí.\n\n„A po tom trápení nad nejvytříbenější [illiterate.GetCulture.GetNameNoTooltip] poezií... To, co pak zaznělo, nebylo ani vytříbené, #EMP ani#! osvícené...“"
 learning_scholarship.6000.very_willing_pupil: "\n\n[teacher.GetFirstNameNoTooltip] ukáže na mé nahromaděné vědomosti.\n\n„[illiterate.GetTitleTierName|U] má obavy, že se bude prokousávat tisícem řádků, a přesto nikdy nedosáhne moudrosti, jakou máte vy.“"
 learning_scholarship.6000.a: "Můj [illiterate.GetCouncilTitle] potřebuje zprávu o vzdálených národech."
 learning_scholarship.6000.b: "Můj [illiterate.GetCouncilTitle] potřebuje kroniku plnou dvorských klepů."
 learning_scholarship.6000.c: "Můj [illiterate.GetCouncilTitle] potřebuje příběhy o válečných činech."
 learning_scholarship.6000.d: "Můj [illiterate.GetCouncilTitle] potřebuje pojednání o spravedlnosti."
 learning_scholarship.6000.e: "Můj [illiterate.GetCouncilTitle] potřebuje neodolatelnou ódu na duchovno."
 learning_scholarship.6000.f: "Ať si přečte, co mu píše [ROOT.Char.GetTitleTierName]."
 learning_scholarship.6000.f.tt: "Záminka k psaní místo vládnutí!"
 learning_scholarship.6000.f.success: "Tvé pojednání je velmi poučné"
 learning_scholarship.6000.f.failure: "Tvůj vazal se vysmívá tvému nudnému a zbytečnému textu"
 learning_scholarship.6000.g: "Čas [illiterate.GetTitledFirstNameNoTooltip] je na to příliš cenný."
 learning_scholarship.6000.g.tt: "[illiterate.GetTitledFirstNameNoTooltip|U] dává přednost činům — číst mohou ostatní!"
 learning_scholarship.6000.h: "Rouhání? Pověz mi o tom trochu víc..."
 learning_scholarship.6000.h.tt: "Můžeš [Select_CString(illiterate.IsFemale,'její slova podat','jeho slova podat')] tak, aby zněla #EMP skutečně#! bezbožně"
 learning_scholarship.6000.non_believer: "Získáš důkaz, že [illiterate.GetTitledFirstName] je nevěřící"
 learning_scholarship.6000.i: "Budu oslavovat [illiterate.GetCulture.GetNameNoTooltip] poezii. Třeba [illiterate.GetTitledFirstNameNoTooltip] načerpá inspiraci."
 learning_scholarship.6000.i.tt: "Na tvém dvoře se bude často recitovat [illiterate.GetCulture.GetNameNoTooltip] poezie"
 learning_scholarship.6000.j: "Moudrost znamená vidět zázrak v každém slově..."
 learning_scholarship.6000.j.tt: "...ne prahnout po tom přečíst je všechna."
 learning_scholarship.6000.k: "Ten moula se číst nikdy nenaučí!"
 learning_scholarship.6000.k.tt: "Rovnou bys [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] učit kozu astronomii!"
 high_learning_custom: "Každý vazal s vysokou [Concept('learning','učeností')|E], který není [GetTrait('compassionate').GetName( GetNullCharacter )]"
