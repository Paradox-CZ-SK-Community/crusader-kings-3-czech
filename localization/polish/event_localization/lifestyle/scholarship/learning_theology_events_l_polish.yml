l_polish:
 learning_theology.1301.t: "Vytoužené čtení"
 learning_theology.1301.desc_opening: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně spěšně přichází.\n\n"
 learning_theology.1301.desc_regula_pastoralis: "„Místní obchodník má výtisk vlivného díla Regula Pastoralis, ale odmítá mi ho prodat."
 learning_theology.1301.desc: "„Místní obchodník má výtisk Kompendia o výpočtech, ale odmítá mi ho prodat."
 learning_theology.1301.desc_ending: "Jestli toho obchodníka přimějete uznat jeho omyl, nezapomenu vám to!“"
 learning_theology.1301.a: "Postarám se, aby se k tobě kniha dostala."
 learning_theology.1301.b: "Hm, tahle kniha zní zajímavě..."
 learning_theology.1301.c: "Tohle zní jako #EMP tvůj#! problém."
 learning_theology.2020.t: "Jakou moc má [ROOT.Char.GetFaith.ReligiousText|U]"
 learning_theology.2020.desc: "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] často cituje z [ROOT.Char.GetFaith.ReligiousText] pasáže o svatých ctnostech. Měl bych dokázat, že dávám pozor, a odcitovat nějakou pasáž sám — nejlépe takovou, která se hodí k povaze [court_chaplain.GetFirstNameNoTooltip].\n\nNaučím se zpaměti a přednesu část pojednávající o..."
 learning_theology.2020.brave: "...odvaze."
 learning_theology.2020.just: "...spravedlnosti."
 learning_theology.2020.temperate: "...umírněnosti."
 learning_theology.2020.chaste: "...cudnosti."
 learning_theology.2020.compassionate: "...soucitu."
 learning_theology.2020.honest: "...pravdomluvnosti."
 learning_theology.2020.forgiving: "...shovívavosti."
 learning_theology.2020.wrathful: "...zuřivosti."
 learning_theology.2020.vengeful: "...pomstychtivosti."
 learning_theology.2020.content: "...spokojenosti."
 learning_theology.2020.patient: "...trpělivosti."
 learning_theology.2020.calm: "...vyrovnanosti."
 learning_theology.2020.humble: "...pokoře."
 learning_theology.2020.diligent: "...píli."
 learning_theology.2020.generous: "...štědrosti."
 learning_theology.2020.greedy: "...bohatství."
 learning_theology.2020.lustful: "...touze."
 learning_theology.2020.ambitious: "...ctižádosti."
 learning_theology.2020.gluttonous: "...zdravé chuti k jídlu."
 learning_theology.2020.success.desc: "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] přijme lichotku s potěšením"
 learning_theology.2020.neutral.desc: "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] má radost"
 learning_theology.2020.failure.desc: "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstNameNoTooltip] má za to, že je to výsměch"
 learning_theology.2021.desc: "[court_chaplain.GetCouncilTitle|U] [court_chaplain.GetFirstName] při kázání jistě nejednou zmiňuje ctnost, kterou je [SCOPE.Custom('virtue_choice')]. Nepamatuji si přesná slova, takže si dovolím trochu tvůrčí volnosti.\n\nBohužel je [court_chaplain.GetCouncilTitle|l] poněkud konzervativní. „O čem to mluvíš?“ [court_chaplain.GetFirstNameNoTooltip] se posměšně ušklíbne. „[ROOT.Char.GetFaith.HighGodName] přece učí něco jiného!“"
 learning_theology.2021.a: "[ROOT.Char.GetFaith.ReligiousText|U] si zřejmě zaslouží mou pozornost častěji..."
 learning_theology.3002.t: "Věk světa"
 learning_theology.3002.desc: "Studuji starobylé náboženské texty i spisy učenců a všechny se zdají shodovat v tom, že [ROOT.Char.Custom('WorldDeadline')]. Podle mých výpočtů nás od té chvíle dělí méně než století.\n\nMůj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))] [chaplain.GetTitledFirstName] mě však nabádá, abych si to nechal pro sebe. „Ať se tím zabývají [ROOT.Char.GetFaith.AltPriestTermPlural|l] a nevyvolávej paniku. Co když jsou tvé výpočty chybné?“"
 learning_theology.3002.a: "Každý si zaslouží znát pravdu!"
 learning_theology.3002.b: "Rozumná námitka, [chaplain.GetFirstNameNoTooltip]."
 learning_theology.3002.c: "[ROOT.Char.GetFaith.PriestNeuterPlural|U] mi k tomu jistě řeknou víc."
 learning_theology.3003.t: "Pozorování hvězd"
 learning_theology.3003.desc: "Po tolika večerech strávených pozorováním hvězd konečně na vlastní oči vidím něco, o čem jsem dosud jen slýchal[Select_CString(ROOT.Char.IsFemale,'a','')].\n\nHvězdy se pohybují různou rychlostí a v různých chvílích obracejí svůj směr, zdánlivě však ve velkých skupinách podle toho, ke které nebeské sféře náleží. Se správnými výpočty by dokonce bylo možné jejich pohyb předpovídat.\n\nMůj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chaplain'))] s tím samozřejmě nesouhlasí. „Nech nebesa být. Nebeskou říši mají poznávat [ROOT.Char.GetFaith.AltPriestTermPlural].“"
 learning_theology.3003.a: "Odpovědi najdu na nebesích."
 learning_theology.3003.b: "Máš pravdu, raději se zaměřím na pozemské záležitosti."
 learning_theology.3011.t: "Společná modlitba"
 learning_theology.3011.desc_friend: "[ROOT.Char.GetFaith.HouseOfWorship|U] v [temple_county.GetName] zůstává za našimi zády. Odtud právě vycházíme společně — já a můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('believer'))] [believer.GetTitledFirstName] — když se k nám připojí několik místních obchodníků."
 learning_theology.3011.desc: "[ROOT.Char.GetFaith.HouseOfWorship|U] v [temple_county.GetName] zůstává za mými zády. Právě odtud vycházím a narazím na několik místních obchodníků; je s nimi i [believer.GetTitledFirstName]."
 learning_theology.3011.ending: "Právě vedou debatu o teologii a světském bohatství.\n\n„Já bych do [ROOT.Char.GetFaith.HouseOfWorship] #EMP investoval#!, ale jak mám vědět, zda si to [ROOT.Char.GetFaith.WealthGodName] vůbec přeje?“"
 learning_theology.3011.a_friend: "Přesvědčíme je, že [ROOT.Char.GetFaith.WealthGodName] sesílá znamení!"
 learning_theology.3011.a: "Pomoz mi je přesvědčit, [believer.GetTitledFirstNameNoTooltip]!"
 learning_theology.3011.a.success: "Obchodníci se nechají přesvědčit"
 learning_theology.3011.a.failure: "[ROOT.Char.GetFaith.HouseOfWorship|U] neuvidí ani minci"
 learning_theology.3011.b: "Vím, kde by se vaše zlato uplatnilo lépe...!"
 learning_theology.3021.t: "Svatý dopis"
 learning_theology.3021.desc_opening: "Mé nedávné teologické bádání ve mně probudilo větší úctu k pozemským zástupcům toho, koho představuje [ROOT.Char.GetFaith.HighGodName]. Ve snaze dát těmto pocitům nějakou podobu sepíšu dopis pro [compliment_receiver.GetTitleAsName] [compliment_receiver.GetFirstName].\n\n"
 learning_theology.3021.desc_friend: "Usedám se svým [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('believer'))] [believer.GetTitledFirstName],"
 learning_theology.3021.desc: "Usedám s písařem, "
 learning_theology.3021.desc_christian: "a společně vytvoříme skutečně skvostný dopis vyzdvihující přednosti Jeho Svatosti..."
 learning_theology.3021.desc_other: "a společně vytvoříme skutečně skvostný dopis vyzdvihující přednosti této významné osobnosti..."
 learning_theology.3021.success.tt: "Podle uvážení [believer.GetTitledFirstNameNoTooltip]:"
 learning_theology.3021.b: "Nade všemi stojí jen [ROOT.Char.GetFaith.HighGodName|U]!"
 learning_theology.3022.opening: "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3022.desc: "Tvého dopisu si velice cením! Tvůj vhled do božských záležitostí i lidské povahy je ohromující."
 learning_theology.3022.a: "Budiž chvála!"
 learning_theology.3023.opening: "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3023.desc: "Tvůj vhled do našeho náboženství na mě udělal dojem, tvé porozumění ostatním lidem však už méně."
 learning_theology.3023.a: "Budiž."
 learning_theology.3024.opening: "[compliment_receiver.Custom2('AppropriateGreeting', ROOT.Char)]"
 learning_theology.3024.desc: "Tvá prázdná okázalost ve jménu [ROOT.Char.GetFaith.HighGodName] mě neoklame a tvůj zastřený pohled do lidských srdcí tě prozrazuje!"
 learning_theology.3024.a: "Zatraceně...!"
 learning_theology.3031.t: "Rozdíly ve víře"
 learning_theology.3031.desc_opening: "V [county.GetName] má své stoupence [county.GetProvince.GetCounty.GetFaith.GetNameNoTooltip].\n\n"
 learning_theology.3031.desc_bishop: "[bishop.GetCouncilTitle|U] [bishop.GetFirstName] to odsuzuje jako kacířství, ale lidé prosí o pochopení..."
 learning_theology.3031.desc: "Mnozí to odsuzují jako kacířství, ale lidé prosí o pochopení..."
 learning_theology.3031.a: "Jak uctívají své bohy, do toho mi nic není."
 learning_theology.3031.b: "K [ROOT.Char.GetFaith.PantheonTerm] se #EMP budou#! modlit!"
 learning_theology.3031.b_confucian: "Budou následovat cestu!"
 learning_theology.3031.b_tt: "Zvýší se postup úkolu rady $task_conversion$"
 learning_theology.3031.b_tt2: "Po dobu 30 let bude snazší změnit víru v [county.GetNameNoTooltip]"
 learning_theology.3041.t: "Mystické poznání"
 learning_theology.3041.desc: "Slýchám, že [ROOT.Char.GetFaith.DevoteeNeuterPlural] upadají do transu a zakoušejí extatické vize, aby navázali spojení s božskou přítomností.\n\nMohl[Select_CString(ROOT.Char.IsFemale,'a','')] bych i já dosáhnout takového spojení?"
 learning_theology.3041.a: "Co se stane, když jejich praktiky napodobím?"
 learning_theology.3041.a.tt: "Vyzkoušíš mystické praktiky"
 learning_theology.3041.b: "Co o tom říkají jiné texty?"
 learning_theology.3041.b.tt: "Pokusíš se o těchto praktikách zjistit více z knih"
 learning_theology.3042.desc: "Zavřen[Select_CString(ROOT.Char.IsFemale,'á','ý')] v místnosti jsem sypal[Select_CString(ROOT.Char.IsFemale,'a','')] podivné prášky do hořícího ohně, který vydával nesnesitelné horko, kouř a pachy, a snažil[Select_CString(ROOT.Char.IsFemale,'a','')] se vnímat věci ležící za hranicí smyslového světa.\n\nNevím, kolik času uplynulo, než ke mně začaly přicházet podivné, nesrozumitelné vize světla a pulzující zvuky. Byla to jen má představivost, nebo záblesk božského? Dá se to vůbec poznat?"
 learning_theology.3042.a: "Musím to zkusit znovu a zjistit, zda bude něco jinak!"
 learning_theology.3042.a.tt: "Pokračuješ v pokusech"
 learning_theology.3042.b: "Zajímavé. Zapíšu si své poznatky pro budoucnost."
 learning_theology.3043.desc: "Čím víc experimentuji, tím jasněji všemu rozumím. Jako bych už dokázal[Select_CString(ROOT.Char.IsFemale,'a','')] přivolat onu přítomnost, kterou při svém malém rituálu cítím.\n\nUprostřed chaosu světa mi přináší stálost a útěchu."
 learning_theology.3043.a: "Právě tohle jsem hledal[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 learning_theology.3043.b: "Božského na tom asi mnoho není — ale je to nesmírně uklidňující!"
 learning_theology.3044.desc: "Čím hlouběji pronikám do starobylých textů, tím víc toho objevuji. Mohly by tajemné praktiky dávných [ROOT.Char.GetFaith.DevoteeNeuterPlural] předcházet dokonce i samotnému [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]?\n\nZdá se, že jsem narazil[Select_CString(ROOT.Char.IsFemale,'a','')] na něco pozoruhodného."
 learning_theology.3044.a: "Dozvídám se díky tomu o své víře tolik nového!"
 learning_theology.3044.b: "Možná bych přece jen měl[Select_CString(ROOT.Char.IsFemale,'a','')] trochu experimentovat..."
 learning_theology.3045.desc: "Tohle je tak frustrující! Ať dělám cokoli, nedokážu znovu vyvolat pocit, který ve mně zanechaly první mystické pokusy.\n\nTen dojem, že tam #EMP něco#! je, jen těsně mimo můj dosah, je prostě pryč. Ať zkouším cokoli!"
 learning_theology.3045.a: "Musím ten pocit znovu vyvolat!"
 learning_theology.3045.b: "Stačí mi modlitba. [ROOT.Char.GetFaith.HighGodNameAlternate] mě uslyší."
 learning_theology.3046.desc: "Tak dlouho už hledám mystické poznání a zkušenosti, a přesto... nic! Zbývá jediná možnost: vrátit se na úplný začátek a dokonale napodobit podmínky svého prvního pokusu.\n\nMusím navázat spojení s božským. Copak mě božská moc úmyslně přehlíží?!"
 learning_theology.3046.a: "Musím najít odpovědi!"
 learning_theology.3046.a.success: "Úspěšný pokus"
 learning_theology.3046.a.success.tt: "Můžeš získat [GetTrait('lifestyle_mystic').GetName( GetPlayer )]"
 learning_theology.3046.a.failure: "Pořád nic!"
 learning_theology.3046.a.failure.tt: "Tvé pátrání tě dožene k šílenství"
 learning_theology.3046.b: "Co to dělám... Je načase s touhle pošetilostí skončit."
 learning_theology.3047.desc: "K rozmluvě s božským nepotřebuji starobylé rituály. Božské ke mně promlouvá neustále. Slyším to. Nemám se čeho obávat ani co hledat. Je to tady se mnou, každé ráno, každý večer, každou noc.\n\nPromlouvá ke mně, a jen ke mně!"
 learning_theology.3047.a: "[ROOT.Char.GetFaith.HighGodName] mě povolává! Jsem [Select_CString(ROOT.Char.IsFemale,'vyvolená','vyvolený')]!"
 learning_theology.3051.t: "[ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] divadelní kus v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 learning_theology.3051.desc.intro: "Dozvídám se, že [passion_playwright.GetName] hodlá uvést vlastní hru. Toto jméno už proslavil [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] repertoár a nové dílo nese název:"
 learning_theology.3051.passion: "Pašije: [ROOT.Char.GetFaith.random_GoodGodNames]"
 learning_theology.3051.arabian_nights: "2000 nocí — [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), ROOT.Char.GetCulture.GetCollectiveNounNoTooltip, ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip ) ]"
 learning_theology.3051.inferno: "Inferno: [ROOT.Char.GetFaith.random_EvilGodNames]"
 learning_theology.3051.my_immortal: "Můj [passion_playwright.GetRandomPositiveTrait]"
 learning_theology.3051.desc.passion: "„$learning_theology.3051.passion$.“"
 learning_theology.3051.desc.arabian_nights: "„$learning_theology.3051.arabian_nights$.“"
 learning_theology.3051.desc.inferno: "„$learning_theology.3051.inferno$.“"
 learning_theology.3051.desc.my_immortal: "„$learning_theology.3051.my_immortal$.“"
 learning_theology.3051.desc.outro: "\n\nVstupné je vysoké, ale příležitost vidět na vlastní oči hru, kterou [Select_CString(passion_playwright.IsFemale,'napsala','napsal')] [passion_playwright.GetNameNoTooltip], se nejspíš naskytne jen jednou za život!"
 learning_theology.3051.a: "Čeká mě zbožný večer v divadle!"
 learning_theology.3051.b: "Za stvořením všeho stojí [ROOT.Char.GetFaith.CreatorName]. Nebudu si z něj dělat legraci."
 learning_theology.3052.desc: "Jak se přede mnou hra rozvíjí, rychle mi dochází, proč je [passion_playwright.GetName] považován[Select_CString(passion_playwright.IsFemale,'a','')] za literárního génia.\n\nPróza, herecké výkony, zkrátka všechno ve mně vyvolává pocit, že přede mnou ožívají události, o nichž vypráví [ROOT.Char.GetFaith.ReligiousText] — jako bych byl[Select_CString(ROOT.Char.IsFemale,'a','')] přímo při tom a na vlastní oči viděl[Select_CString(ROOT.Char.IsFemale,'a','')], jak tvoří [ROOT.Char.GetFaith.CreatorName]!\n\nKdyž představení skončí, ocitnu se o samotě s [passion_playwright.GetNameNoTooltip]."
 learning_theology.3052.a: "Musíš mě naučit, jak vykládat „[ROOT.Char.GetFaith.ReligiousText]“ stejně jako ty!"
 learning_theology.3052.b: "Dokážu napsat něco lepšího!"
 learning_theology.3053.desc: "Sleduji, jak se přede mnou hra odvíjí, a bez nejmenších pochyb je to naprostý brak. To, čeho jsem právě byl[Select_CString(ROOT.Char.IsFemale,'a','')] svědkem, si ani nezaslouží být nazýváno literaturou.\n\nPříběh sleduje mladou učenou postavu vystupující jako „[ROOT.Char.GetCapitalLocation.Custom('GetRandomRegionalWood')|U] [ROOT.Char.Custom('GetRandomRegionalBird')|U]spár“, která studuje [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip|l] mysticismus a čarodějnictví a přitom střídá jednu milostnou známost za druhou v učeném kruhu autora hry.\n\nS [ROOT.Char.GetFaith.ReligiousText] má hra sotva něco společného a ostatní diváci už se začínají posmívat mizernému psaní, které [Select_CString(passion_playwright.Char.IsFemale,'předvedla','předvedl')] [passion_playwright.GetNameNoTooltip]."
 learning_theology.3053.a: "Fuj!"
 learning_theology.3053.b: "Napíšu vlastní hru!"
 learning_theology.3053.c: "[passion_playwright.GetFirstNameNoTooltip] je génius! Tihle hlupáci to jen nechápou!"
 learning_theology.3054.t: "Můj [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip|l] divadelní kousek"
 learning_theology.3054.desc.intro: "Kdysi jsem [Select_CString(ROOT.Char.IsFemale,'přísahala','přísahal')] překonat podřadné dílo, které [Select_CString(passion_playwright.IsFemale,'napsala','napsal')] [passion_playwright.GetName]. Teď, když inkoust mých písařů konečně zasychá, obdivuji vlastní výtvor.\n\n"
 learning_theology.3054.desc.outro: "je podle mého skromného názoru dílo, které si zaslouží označení „mistrovské“.\n\nZbývá jediná otázka: kdo ztvární hlavní roli?"
 learning_theology.3054.a: "Já, samozřejmě — v přestrojení!"
 learning_theology.3054.b: "[family_actor.Custom2('RelationToMeShort', ROOT.Char)|U] [family_actor.GetFirstNameNoTooltip] má teď příležitost zazářit!"
 learning_theology.3054.c: "[ROOT.Char.Custom2('RelationToMeShort', random_actor)|U] [random_actor.GetTitledFirstNameNoTooltip] má šarm od přírody."
 learning_theology.3055.t: "Dramatický debut"
 learning_theology.3055.desc.intro.solo: "Zhluboka se nadechnu a připravuji se uvést svou hru. Když její zbožné poselství předávám osobně, výsledek přece musí být bezchybný."
 learning_theology.3055.desc.intro.hired_actor: "Usedám mezi diváky a sleduji, jak [lead_actor.GetName] zahajuje představení mého mistrovského díla."
 learning_theology.3055.desc.victory.solo: "\n\nPo dalším nádechu bezchybně odříkám své repliky a publikum kolem mě hltá každé slovo. Mistrným podáním příběhů, které vypráví [ROOT.Char.GetFaith.ReligiousText], je zcela uchvátím."
 learning_theology.3055.desc.defeat_writing.solo: "\n\nPřestože své repliky odříkám bez jediné chyby, očekávání ve tvářích diváků rychle střídá rozčarování a zmatek."
 learning_theology.3055.desc.defeat_acting.solo: "\n\nPři pokusu přečíst úvodní řádky se okamžitě zadrhnu a strnule klopýtám skrz text, protože si nedokážu vybavit ani vlastní slova. Publikum nemá slitování a rychle na mě začne bučet a syčet!"
 learning_theology.3055.desc.victory.hired_actor: "\n\nK mé radosti podává [lead_actor.GetFirstNameNoTooltip] výkon hodný nejen mého díla, ale i [ROOT.Char.GetFaith.HighGodName] to jistě ocení!"
 learning_theology.3055.desc.defeat_writing.hired_actor: "\n\nK mé hrůze [lead_actor.GetFirstNameNoTooltip] přednáší mé repliky přesně podle mých představ, ale publikum se přesto rychle obrací proti celému představení. Syčí a bučí, ačkoli samotný výkon je skvělý!"
 learning_theology.3055.desc.defeat_acting.hired_actor: "\n\nK mé hrůze se [lead_actor.GetFirstNameNoTooltip] zadrhává, plete slova a nezvládá ani obstojný výkon. Krev se mi vaří, když sleduji, jak je mé velké dílo przněno, a ze svého místa nedokážu zastavit posměch publika."
 learning_theology.3055.desc.victory_outro: "\n\nKdyž dav propukne v potlesk, je mi jasné, že jsem [Select_CString(ROOT.Char.IsFemale,'překonala sama sebe','překonal sám sebe')]. [passion_playwright.GetName] teď vidí, jak píše hru skutečný [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]!"
 learning_theology.3055.desc.defeat_outro.solo: "\n\nPokračuji dál v naději, že znovu najdu správný rytmus a představení ještě zachráním, ale je to marné. Ještě před koncem se divadlo vyprázdní a zůstane po mně jen ostuda."
 learning_theology.3055.desc.defeat_outro.hired_actor: "\n\n[lead_actor.GetTitledFirstNameNoTooltip|U] pokračuje dál v naději, že se hra ještě podaří zachránit, ale představení je propadák. Ještě před koncem se divadlo vyprázdní a zůstane po mně jen ostuda."
 learning_theology.3055.a: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U] všude slaví skvělý večer!"
 learning_theology.3055.b: "Možná herectví není pro mě..."
 learning_theology.3054.a.tt: "Ty a [passion_playwright.GetName] se utkáte v souboji, kde rozhodne tvá [Concept('diplomacy_skill','diplomatická dovednost')|E]."
 learning_theology.3054.b.tt: "[family_actor.GetName] a [passion_playwright.GetName] se utkají v souboji, kde rozhodne tvá [Concept('diplomacy_skill','diplomatická dovednost')|E]."
 learning_theology.3054.c.tt: "[random_actor.GetName] a [passion_playwright.GetName] se utkají v souboji, kde rozhodne tvá [Concept('diplomacy_skill','diplomatická dovednost')|E]."
 learning_theology_special.1001.t: "Apokryfy"
 learning_theology_special.1001.desc: "Má neuhasitelná touha po poznání mě přivedla k objevu podivného starého textu.\n\nSvazek, připisovaný dávnému teologovi, o němž se oficiální prameny zmiňují jen zřídka, vrhá nové světlo na některé stránky [ROOT.Char.GetFaith.GetName], o nichž jsem vůbec netušil[Select_CString(ROOT.Char.IsFemale,'a','')], že patří k jeho učení."
 learning_theology_special.1001.d: "Musíme tyto dávné praktiky oživit."
 learning_theology_special.1001.d.success: "Úspěšně začlením své poznatky do současného učení [THIS.Char.GetFaith.GetName]"
 learning_theology_special.1001.d.failure: "Nedokážu o svých závěrech přesvědčit zbytek duchovenstva"
 learning_theology_special.1001.d.failure.toast: "Můj pokus začlenit apokryfní text selhal"
 learning_theology_special.1001.e: "[vassal_pope.GetTitledFirstNameNoTooltip] se o tom musí dozvědět!"
 learning_theology_special.1001.e.success: "Přesvědčím [vassal_pope.GetTitledFirstName], aby mé poznatky začlenil[Select_CString(vassal_pope.IsFemale,'a','')] do současného učení [THIS.Char.GetFaith.GetName]"
 learning_theology_special.1001.e.failure: "[vassal_pope.GetTitledFirstNameNoTooltip] odmítne uznat text za pravý"
 learning_theology_special.1001.e.failure.toast: "[vassal_pope.GetTitledFirstName] zavrhl[Select_CString(vassal_pope.IsFemale,'a','')] text jako kacířský podvrh"
 learning_theology_special.1001.a: "[bishop.GetTitledFirstNameNoTooltip] by mi mohl[Select_CString(bishop.IsFemale,'a','')] pomoci tento text prostudovat."
 learning_theology_special.1001.a.desc: "Záleží na tom, jak horlivý je [bishop.GetTitledFirstName]"
 learning_theology_special.1001.a.success: "[bishop.GetTitledFirstNameNoTooltip] mi pomůže se studiem"
 learning_theology_special.1001.a.success.toast: "[bishop.GetTitledFirstName] mi pogratuloval[Select_CString(bishop.IsFemale,'a','')] ke vzácnému nálezu"
 learning_theology_special.1001.a.failure: "[bishop.GetTitledFirstNameNoTooltip] nechá knihu spálit"
 learning_theology_special.1001.a.failure.toast: "[bishop.GetTitledFirstName] mi poděkoval[Select_CString(bishop.IsFemale,'a','')] za odevzdání kacířské knihy plamenům"
 learning_theology_special.1001.b: "Raději to prostuduji v soukromí..."
 learning_theology_special.1001.c: "Tahle kacířská špína patří do ohně!"
 learning_theology_special.1002.t: "Nové dogma"
 learning_theology_special.1002.a.desc: "Začleněním obsahu starého textu do současných praktik [ROOT.Char.GetFaith.GetName] jsem v naší víře zanechal[Select_CString(ROOT.Char.IsFemale,'a','')] historickou stopu, které se jen málokterý z mých nástupců vyrovná.\n\nNěkteří významní představitelé duchovenstva se této neobvyklé změně našeho učení stále vysmívají, ale díky mé výřečnosti se mi podařilo přesvědčit většinu vlivných teokratů o oprávněnosti mé reformy."
 learning_theology_special.1002.b.desc: "Přesvědčit [vassal_pope.GetTitledFirstName] nejprve o pravosti textu a poté i ostatní významné představitele [ROOT.Char.GetFaith.GetName] nebylo snadné, ale mé nadšení a znalosti teologie nakonec zvítězily.\n\nNěkteří významní představitelé duchovenstva se této neobvyklé změně našeho učení stále vysmívají, ale většinu vlivných teokratů se podařilo přesvědčit o její oprávněnosti."
 learning_theology_special.1002.a: "Je zřejmé, že mě k této knize přivedla vůle — [ROOT.Char.GetFaith.HighGodName]!"
 learning_theology_special.1003.a.desc: "Ve své nesmírné moudrosti objevil[Select_CString(player_pope.IsFemale,'a','')] [player_pope.GetTitledFirstName] starobylý náboženský text, který zásadně mění učení [ROOT.Char.GetFaith.GetName].\n\nPo projednání nálezu s významnými členy duchovenstva se [player_pope.GetTitleTierName] rozhodl[Select_CString(player_pope.IsFemale,'a','')] začlenit obsah knihy do oficiální nauky víry."
 learning_theology_special.1003.b.desc: "Po namáhavém výzkumu a nekonečných hodinách teologického studia objevil[Select_CString(pope_liege.IsFemale,'a','')] [pope_liege.GetTitledFirstName] starobylý náboženský text, který zásadně mění učení [ROOT.Char.GetFaith.GetName].\n\nPoté, co byly tyto poznatky předloženy [vassal_pope.GetTitledFirstName], se [vassal_pope.GetTitleTierName] rozhodl[Select_CString(vassal_pope.IsFemale,'a','')] začlenit obsah knihy do oficiální nauky víry."
 learning_theology_special.1003.a: "Co to přesně znamená pro nás ostatní?"
 learning_theology_special.1101.t: "Komentáře"
 learning_theology_special.1101.desc: "„Požehnání s vámi, [ROOT.Char.Custom('FormOfAddressForLiege')]. Jmenuji se [scholar.GetTitledFirstName].“ Rabín přede mnou se uctivě ukloní.\n\n„Svůj život jsem zasvětil[Select_CString(scholar.IsFemale,'a','')] studiu Tanachu a Talmudu a psaní komentářů k nim. Snad by vám mé spisy a rady mohly být užitečné při vlastním studiu [ROOT.Char.GetFaith.ReligiousText].“"
 learning_theology_special.1101.desc.fallback: "„Zdravím vás, [ROOT.Char.Custom('FormOfAddressForLiege')]. Jmenuji se [scholar.GetTitledFirstName].“ Kněz přede mnou se uctivě ukloní.\n\n„Svůj život jsem zasvětil[Select_CString(scholar.IsFemale,'a','')] studiu a psaní o [ROOT.Char.GetFaith.ReligiousText]. Snad by vám mé spisy a rady mohly být při vlastním studiu užitečné.“"
 learning_theology_special.1101.a: "Pojďme psát komentáře k [ROOT.Char.GetFaith.ReligiousText]!"
 learning_theology_special.1101.b: "V #emp skutečném#! světě mám naléhavější starosti."
 learning_theology_special.1101.c: "Kacíře pod svou střechou nikdy nestrpím!"
 learning_theology_special.1102.desc: "Po dnech usilovné práce hledíme na stránky rozložené před námi. Komentáře, které jsme sepsali, jsou vyčerpávající a podrobné. Díky vedení [scholar.GetTitledFirstNameNoTooltip] nyní [ROOT.Char.GetFaith.ReligiousText] chápu mnohem lépe."
 learning_theology_special.1102.desc_dead: "Po dnech usilovné práce hledím na stránky rozložené přede mnou. Sepsané komentáře jsou vyčerpávající a podrobné. Škoda jen, že [scholar.GetTitledFirstName] už je nemůže spatřit."
 learning_theology_special.1102.desc_ending: "\n\nVěřím, že duchovenstvo by má práce mohla zajímat!"
 learning_theology_special.1102.a.success: "Přesvědčím [scholar.GetTitledFirstNameNoTooltip], aby pokračoval[Select_CString(scholar.IsFemale,'a','')]"
 learning_theology_special.1102.a.failure: "[scholar.GetTitledFirstNameNoTooltip] se nenechá přesvědčit"
 learning_theology_special.1102.b: "Proč bych se měl[Select_CString(ROOT.Char.IsFemale,'a','')] dělit o slávu?"
 learning_theology_special.1102.c: "Za všechno vděčím [scholar.GetFirstNameNoTooltip]!"
 learning_theology_special.1102.c.rl_desc: "Záleží na tom, jak čestný je [scholar.GetTitledFirstNameNoTooltip]"
 learning_theology_special.1102.c.success: "[scholar.GetTitledFirstNameNoTooltip] se se mnou podělí o slávu"
 learning_theology_special.1102.c.failure: "[scholar.GetTitledFirstNameNoTooltip] si přisvojí veškerou slávu"
 learning_theology_special.1102.c.success.toast: "[scholar.GetTitledFirstName] se se mnou podělil[Select_CString(scholar.IsFemale,'a','')] o slávu"
 learning_theology_special.1102.c.failure.toast: "[scholar.GetTitledFirstName] si přisvojil[Select_CString(scholar.IsFemale,'a','')] veškeré zásluhy"
 learning_theology_special.1102.b.success: "Přelstím [scholar.GetShortUINameNoTooltip]"
 learning_theology_special.1102.b.failure: "[scholar.GetShortUINameNoTooltip] odhalí mou lest"
 learning_theology_special.1102.d: "Ale přesto jsem se hodně naučil[Select_CString(ROOT.Char.IsFemale,'a','')]!"
