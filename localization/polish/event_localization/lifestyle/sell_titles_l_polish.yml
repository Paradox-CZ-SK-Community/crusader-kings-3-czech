l_polish:
sell_titles.0001.opening: "[vassal.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
sell_titles.0001.desc.dislike: "O prázdné sliby, které prodáváš, nemám zájem. Pokud však zlato potřebuješ až tak zoufale, myslím, že bychom se mohli nějak dohodnout."
sell_titles.0001.desc.normal: "O větší pocty nestojím, [vassal.Custom2('RelationToMeShort', ROOT.Char)], ale pokud potřebuješ zlato, myslím, že bychom se mohli nějak dohodnout."
sell_titles.0001.a: "Ty peníze potřebuji pro dobro panství, chápeš."
sell_titles.0001.b: "Tohle není smlouvání na selském trhu!"
sell_titles.0002.opening: "[friend.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
sell_titles.0002.desc: "Doneslo se ke mně, že nabízíš tituly výměnou za „dary“.\n\nPříteli, pokud potřebuješ zlato, stačilo mi říct!"
sell_titles.0002.a: "Jsi skutečný přítel, [friend.GetFirstNameNoTooltip]!"
sell_titles.0002.b: "Tohle nemohu přijmout."
sell_titles.0003.desc: "Tituly, které mi nabízíš, jsou pro mě velikou ctí a samozřejmě na ně náležitě přispěji, jak se sluší a patří!\n\nZa takovou poctu ti nemohu dostatečně poděkovat. Ať ode mě žádáš cokoli, udělám vše, co bude v mých silách."
sell_titles.0003.a: "Jsi skutečně věrný a oddaný vazal."
sell_titles.0003.a.flavor: "Kéž by všichni chápali, jak nesmírně štědrý můj čin je."
sell_titles.0004.opening: "[vassal.Custom2('AppropriateGreeting', ROOT.Char )]"
sell_titles.0004.desc: "Doneslo se ke mně, že rozprodáváš tituly, přestože mé vlastní služby dosud nebyly náležitě oceněny.\n\nVzhledem ke všemu, čeho jsem pro tebe dosáhl, by mi pár nových titulů rozhodně neuškodilo."
sell_titles.0004.a: "Nuže, bude po tvém."
sell_titles.0004.b: "Nepřeceňuj své zásluhy!"
sell_titles.0005.desc: "Přestože s nimi nejsou spojena žádná léna, povinnosti vyplývající z titulů, které nabízíš, jsou velkorysejší, než bych se kdy odvážil žádat.\n\nTakovou štědrost samozřejmě poctím odpovídajícím darem!"
sell_titles.0005.a: "Opravdu? Aha."
sell_titles.0005.b: "Tak jsem to... Proklínám tě!"
sell_titles.0006.desc: "Vím, že riskuji tvůj hněv, ale čest mi nedovoluje mlčet. Tvá nabídka „titulů“ výměnou za „dary“ není vedena ničím jiným než obyčejnou chamtivostí. To je nad slunce jasné!\n\nMá čest pramení z mého vznešeného původu, nikoli z mého bohatství. U tebe je tomu zřejmě naopak!"
sell_titles.0006.a: "Jak se opovažuješ mě takhle zostudit?!"
sell_titles.1002.t: "Prodej titulů: Skromný návrh"
sell_titles.1002.desc: "[Select_CString(merchant.IsFemale,'Jistá','Jistý')] [merchant.GetTitledFirstName], zámožný kupec, se doslechla o mých pokusech rozprodat nepotřebné tituly. Přichází však s mnohem troufalejším návrhem:\n\n„Kdybych předložil důkazy o vzdáleném příbuzenství s dynastií [ROOT.Char.GetDynasty.GetBaseName], podpoříš můj nárok?“\n\nTen návrh je naprosto směšný, jenže [merchant.GetTitledFirstName] má také naprosto směšné množství zlata..."
sell_titles.1002.a.muslim: "Vždyť i Mohamed byl kupec!"
sell_titles.1002.a: "Oslavme návrat [Select_CString(merchant.IsFemale,'mé dávno ztracené sestry','mého dávno ztraceného bratra')]!"
sell_titles.1002.b: "Mé jméno není za žádných okolností na prodej!"
sell_titles.1004.t: "Prodej titulů: Výtečný obchod"
sell_titles.1004.desc: "Navzdory všem očekáváním se [merchant.GetTitledFirstName], kupec, který se ukázal být mým velmi, velmi vzdáleným příbuzným, osvědčil jako [Select_CString(merchant.IsFemale,'vynikající válečnice','vynikající válečník')]!\n\nKdo by si pomyslel, že se někdo neurozený může vyšvihnout až tak vysoko?"
sell_titles.1004.a: "Možná [merchant.GetTitledFirstName] přece jen skutečně pochází ze vznešené krve?"
sell_titles.1005.desc: "Od chvíle, kdy jsem [merchant.GetTitledFirstName] přijal... chci říct, od návratu do rodiny, si [merchant.GetTitledFirstName] získává oblibu mezi [ROOT.Char.GetFaith.AltPriestTermPlural]. Zdá se, že oplývá značnou moudrostí. Mnohem větší, než by člověk od obyčejného neurozeného čekal."
sell_titles.1005.a: "I zlato se koneckonců najde mezi obyčejným kamením."
sell_titles.1006.desc: "Možná #EMP skutečně#! není od věci čas od času přivítat nový pohled na věc? [merchant.GetTitledFirstName] už prokázal dost schopností na to, aby si zajistil místo v mém rodu, a nyní se ukazuje, že se v nástrahách mého dvora pohybuje s neuvěřitelnou obratností. Občas si dokonce říkám, jestli [merchant.GetTitledFirstName] neví o dění kolem mě víc než já!"
sell_titles.1006.a: "Díky [ROOT.Char.GetFaith.HighGodName], že mi za tohle [merchant.GetTitledFirstName] něco dluží."
sell_titles.1007.t: "Prodej titulů: Černá ovce"
sell_titles.1007.desc: "Existuje důvod, proč se z neurozených lidí nestávají šlechtici jen tak z rozmaru. Od chvíle, kdy [merchant.GetTitledFirstName] přišel ke mně ke dvoru, je z toho jen jedna ostuda za druhou!\n\nPodpořil jsem nárok [merchant.GetTitledFirstName] na příslušnost k mému rodu, takže teď už s tím nic nenadělám. Tuhle chybu ale podruhé nejspíš neudělám!"
sell_titles.1007.a: "Jaká škoda..."
