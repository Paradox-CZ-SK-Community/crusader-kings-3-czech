l_polish:
 diplomacy_family.0007.t: "Vhodná příležitost"
 diplomacy_family.0007.desc: "Pečlivě připravená večeře probíhá přesně podle plánu a nakonec zůstanu s [voter.GetTitledFirstName] o samotě. Víno i [voter.Custom('FavoriteTreat')] zjevně udělaly své a [voter.GetFirstNameNoTooltip] vypadá spokojeněji než kdykoli za poslední měsíce.\n\nTohle je dokonalá příležitost přesvědčit [voter.GetFirstNameNoTooltip], aby [Select_CString(voter.IsFemale,'hlasovala','hlasoval')] pro [candidate.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('candidate'))]..."
 diplomacy_family.0007.a: "Přednést ty nejpádnější argumenty."
 diplomacy_family.0007.a.success.tt: "Přesvědčíš [voter.GetTitledFirstNameNoTooltip]"
 diplomacy_family.0007.a.success.desc: "Podařilo se mi přesvědčit [voter.GetTitledFirstName], aby [Select_CString(voter.IsFemale,'hlasovala','hlasoval')] pro [candidate.GetTitledFirstName]."
 diplomacy_family.0007.a.failure.tt: "Nepodaří se ti přesvědčit [voter.GetTitledFirstNameNoTooltip]"
 diplomacy_family.0007.a.failure.desc: "Můj pokus přesvědčit [voter.GetTitledFirstName] selhal."
 diplomacy_family.0007.c: "Protislužba za protislužbu je přece fér, ne?"
 diplomacy_family.0007.b: "Možná názor změní tenhle měšec..."
 diplomacy_family.0007.placeholder.tt: "[voter.GetShortUIName|U] bude hlasovat pro zvolení [candidate.GetShortUIName] [Select_CString(candidate.IsFemale,'příští vládkyní','příštím vládcem')] [title.GetNameNoTier]"
 diplomacy_family.0008.t: "Povahová vada"
 diplomacy_family.0008.start.desc: "Až opustím tento svět, [disagreeable_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] bude vládnout místo mě.\n\nBohužel se šíří zvěsti, že [disagreeable_heir.GetFirstNameNoTooltip] "
 diplomacy_family.0008.lazy.desc: "propadá ostudné lenosti."
 diplomacy_family.0008.craven.desc: "projevuje naprostou zbabělost."
 diplomacy_family.0008.arbitrary.desc: "postrádá veškeré morální zásady."
 diplomacy_family.0008.callous.desc: "má srdce z kamene."
 diplomacy_family.0008.stubborn.desc: "projevuje nesnesitelnou umíněnost."
 diplomacy_family.0008.gluttonous.desc: "oddává se odpudivému obžerství."
 diplomacy_family.0008.greedy.desc: "trpí nenasytnou chamtivostí."
 diplomacy_family.0008.arrogant.desc: "propadá nekajícnému velikášství."
 diplomacy_family.0008.deceitful.desc: "uchyluje se ke lžím a úskokům."
 diplomacy_family.0008.vengeful.desc: "nedokáže zapomenout žádnou křivdu."
 diplomacy_family.0008.end.desc: " Nutí mě to přemýšlet, zda si [disagreeable_heir.GetFirstNameNoTooltip] po mé smrti dokáže udržet podporu mých vazalů..."
 diplomacy_family.0008.end_no_vassals.desc: " [ROOT.Char.Custom('GetCourt')|U] není vůči těmto řečem imunní. Nutí mě to přemýšlet, zda [disagreeable_heir.GetFirstNameNoTooltip] po mé smrti zvládne odpovědnost za [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] a jeho lid..."
 diplomacy_family.0008.a: "Pokusit se tyto nedostatky napravit."
 diplomacy_family.0008.a.tt: "[disagreeable_heir.GetShortUIName|U] možná své nedostatky překoná"
 diplomacy_family.0008.b: "Raději vyzdvihnout dobré vlastnosti."
 diplomacy_family.0008.b.custom: "Každý [ROOT.Char.Custom('GetFollowerOrVassal')]"
 diplomacy_family.0008.c: "Soustředit se na sebe a jít příkladem."
 diplomacy_family.0009.desc: "[disagreeable_heir.GetTitledFirstName] souhlasí, že se bude řídit mými radami, i když nadšení není zrovna valné.\n\nObávám se, že tyto neřesti jsou hluboce zakořeněné, ale skutečně poučný zážitek by mohl otevřít oči a ukázat pošetilost dosavadního chování.\n\nCo bychom měli udělat?"
 diplomacy_family.0009.wronglessonstart.desc: "Když sleduji [disagreeable_heir.GetFirstName] při plnění zadaného úkolu, pomalu mě přepadnou pochybnosti. [disagreeable_heir.GetFirstNameNoTooltip] nemá sebemenší problém "
 diplomacy_family.0009.compassion.desc: "vcítit se do lidí, kteří měli méně štěstí, a projevit jim soucit."
 diplomacy_family.0009.honor.desc: "přiznat vlastní chyby a nést jejich následky."
 diplomacy_family.0009.greed.desc: "vzdát se hmotného majetku."
 diplomacy_family.0009.energy.desc: "vládnout místo mě."
 diplomacy_family.0009.vengefulness.desc: "upřímně odpustit."
 diplomacy_family.0009.wronglessonend.desc: " Přesto se zdá, že si z celého cvičení nic neodnáší.\n\nDám [disagreeable_heir.GetFirstNameNoTooltip] ještě jednu šanci a možná bych [Select_CString(ROOT.Char.IsFemale,'měla zkusit','měl zkusit')] jinou metodu.\n\nTentokrát..."
 diplomacy_family.0009.rightlessonstart.desc: "Je frustrující sledovat, jak se [disagreeable_heir.GetFirstName] marně snaží "
 diplomacy_family.0009.rightlessonend.desc: " Skoro to vypadá, že se ani nesnaží!\n\nTéměř nepochybuji o tom, že problém nebyl v mé lekci, ale v nedostatku nadšení. [disagreeable_heir.GetFirstNameNoTooltip] dostane ještě jednu šanci...\n\nOtázkou je, zda máme zkusit novou taktiku, nebo dnes nakonec zvítězí vytrvalost?"
 diplomacy_family.0009.a: "Vyrazíme do ulic a promluvíme si s chudými."
 diplomacy_family.0009.a.tt: "Lekce vhodná pro někoho, kdo potřebuje zapracovat na soucitu"
 diplomacy_family.0009.b: "Přiznat se k provinění a napravit ho."
 diplomacy_family.0009.b.tt: "Lekce vhodná pro někoho, kdo potřebuje zapracovat na cti"
 diplomacy_family.0009.c: "Rozdat svůj majetek potřebným."
 diplomacy_family.0009.c.tt: "Lekce vhodná pro někoho, kdo potřebuje zapracovat na štědrosti"
 diplomacy_family.0009.d: "[disagreeable_heir.GetFirstNameNoTooltip] bude pořádat audienci místo mě."
 diplomacy_family.0009.d.tt: "Lekce vhodná pro někoho, kdo potřebuje zapracovat na rozhodnosti"
 diplomacy_family.0009.e: "Odpustit někomu, kdo [Select_CString(disagreeable_heir.IsFemale,'jí','mu')] ublížil."
 diplomacy_family.0009.e.tt: "Lekce vhodná pro někoho, kdo se potřebuje naučit nechat křivdy být"
 diplomacy_family.0010.t: "$diplomacy_family.0008.t$: Nové pochopení"
 diplomacy_family.0010.start.desc: "Mám velkou radost ze změn, které pozoruji u [disagreeable_heir.GetTitledFirstName]!"
 diplomacy_family.0010.compassion.desc: "Zpočátku sice [disagreeable_heir.GetFirstNameNoTooltip] nejeví přílišný zájem, ale příběhy nešťastníků, které jsme potkali, jako by přece jen pohnuly něčím hluboko v [Select_CString(disagreeable_heir.IsFemale,'jejím','jeho')] nitru.\n\nCestou domů [disagreeable_heir.GetFirstNameNoTooltip] mlčky rozjímá a od té doby už nepůsobí tak "
 diplomacy_family.0010.honor.desc: "Zpočátku si [disagreeable_heir.GetFirstNameNoTooltip] [Select_CString(disagreeable_heir.IsFemale,'nemyslela','nemyslel')], že [Select_CString(disagreeable_heir.IsFemale,'udělala','udělal')] něco špatně, ale reakce na snahu vše napravit nakonec přinese pochopení.\n\nMám podezření, že takové úcty se [disagreeable_heir.GetFirstNameNoTooltip] nikdy předtím nedostalo, a od té doby už nepůsobí tak "
 diplomacy_family.0010.greed.desc: "Zpočátku se [disagreeable_heir.GetFirstNameNoTooltip] samozřejmě [Select_CString(disagreeable_heir.IsFemale,'jen nerada vzdávala','jen nerad vzdával')] svého majetku, ale radost a vděčnost lidí ve skutečné nouzi jsou zcela novou zkušeností.\n\nCestou domů se [disagreeable_heir.GetFirstNameNoTooltip] dokonce [Select_CString(disagreeable_heir.IsFemale,'přiznala','přiznal')], že většina rozdaných věcí vlastně vůbec nechybí, a od té doby už nepůsobí tak "
 diplomacy_family.0010.energy.desc: "Zpočátku mám obavy, jak dopadne, když [disagreeable_heir.GetFirstNameNoTooltip] dostane tolik odpovědnosti. Jenže když není za koho se schovat ani na koho úkol přenést, [disagreeable_heir.GetFirstNameNoTooltip] se ho nakonec chopí.\n\nVlastní skryté nadání překvapí [disagreeable_heir.GetFirstNameNoTooltip] ještě víc než mě a od té doby už nepůsobí tak "
 diplomacy_family.0010.vengefulness.desc: "Vidím, jak těžké je pro [disagreeable_heir.GetFirstNameNoTooltip] postavit se člověku, který [Select_CString(disagreeable_heir.IsFemale,'jí','mu')] ublížil. Při pokusu promluvit váznou slova v hrdle.\n\nNaštěstí [Select_CString(dummy_gender.IsFemale,'žena','muž')] zareaguje velkoryse a [disagreeable_heir.GetFirstName] podle [Select_CString(dummy_gender.IsFemale,'jejího','jeho')] příkladu nakonec [Select_CString(dummy_gender.IsFemale,'odpustí jí','odpustí mu')] skutečně od srdce. Od té doby už nepůsobí tak "
 diplomacy_family.0010.lazy.desc: "líně"
 diplomacy_family.0010.craven.desc: "nejistě"
 diplomacy_family.0010.arbitrary.desc: "svévolně"
 diplomacy_family.0010.callous.desc: "bezcitně"
 diplomacy_family.0010.stubborn.desc: "umíněně"
 diplomacy_family.0010.gluttonous.desc: "nenasytně"
 diplomacy_family.0010.greedy.desc: "sobecky"
 diplomacy_family.0010.arrogant.desc: "samolibě"
 diplomacy_family.0010.deceitful.desc: "nečestně"
 diplomacy_family.0010.sadistic.desc: "chladně"
 diplomacy_family.0010.vengeful.desc: "mstivě"
 diplomacy_family.0010.end.desc: "jako dřív."
 diplomacy_family.0010.a: "Velký úspěch pro nás oba!"
 diplomacy_family.0010.b: "Byla to jen poučná zkušenost, nic víc."
 diplomacy_family.0010.c: "Tohle je teprve první krok! Musíme se snažit dál!"
 diplomacy_family.0011.t: "$diplomacy_family.0008.t$: Starých zvyků se nezbaví"
 diplomacy_family.0011.start.desc: "[disagreeable_heir.GetTitledFirstName]. "
 diplomacy_family.0011.end.desc: " Přivádí mě to k šílenství! Přes veškerou mou snahu se nic nezlepšilo.\n\nPokud [disagreeable_heir.GetFirstNameNoTooltip] skutečně nechce změnu, nikdy k ní nedojde."
 diplomacy_family.0011.a: "Vzdávám to..."
 diplomacy_family.2101.t: "Rodinná hádka"
 diplomacy_family.2101.desc: "[family_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se už několik dní hádá s [family_2.Custom2('HerHisCharacterIntroduction', family_1)]. Právě teď slyším, jak se [ROOT.Char.Custom('GetRoom')] hned vedle otřásá jejich hádkou o...\n\n„Neuvěřitelné!“ vykřikne [family_1.GetFirstName]. „Jak si vůbec můžeš myslet, že právě ty dokonale ztělesňuješ rodinné ctnosti dynastie [ROOT.Char.GetDynastyName]?! Vždyť jsi [family_2.Custom2('InsultNoun', SCOPE.sC('family_1'))]! Já si tohle označení #EMP rozhodně#! zasloužím mnohem víc než ty!“"
 diplomacy_family.2101.a: "V rodině se hádat nebudeme!"
 diplomacy_family.2101.a.tt: "Pokusíš se jejich hádku ukončit"
 diplomacy_family.2101.b: "Ať si svůj spor vyřeší sami."
 diplomacy_family.2102.desc: "[ROOT.Char.Custom('GetRoom')|U] se přede mnou otevře a [family_1.GetFirstName] se ke mně otočí. „[Select_CString(family_1.IsFemale,'Jsem ráda','Jsem rád')], že jsi tady, [ROOT.Char.GetFirstNameNoTooltip]. Nemůžeš prosím zasáhnout? [family_2.Custom2('YourCharacterIntroduction', ROOT.Char)|U] se chová naprosto nerozumně!“"
 diplomacy_family.2102.a: "Ano, styď se, [family_2.GetFirstNameNoTooltip]!"
 diplomacy_family.2102.b: "Tady se mýlíš ty, [family_1.GetFirstNameNoTooltip]."
 diplomacy_family.2102.c: "Chováte se jako umíněné děti!"
 diplomacy_family.2102.c.success: "Dají si říct"
 diplomacy_family.2102.c.failure: "Odmítnou poslouchat"
 diplomacy_family.2102.d: "Ha! Nejlepší z dynastie [ROOT.Char.GetDynastyNameNoTooltip] jsem #EMP očividně#! já!"
 diplomacy_family.2102.d.flavor: "No, rozhodně je to jeden ze způsobů, jak je přimět, aby se přestali hádat #EMP mezi sebou#!..."
 diplomacy_family.2200.t: "Nejdražší ze všech přátel"
 diplomacy_family.2200.desc: "Jen málokdy se [ruler.GetWomenMen] mohou pochlubit tolika přáteli jako já. Podpory každého z nich si cením a všem důvěřuji stejně, přesto mám pocit, že mezi všemi těmi statečnými dušemi, které počítám ke svým věrným životním druhům, je jedna, která mi rozumí lépe než všechny ostatní."
 diplomacy_family.2200.a: "[friend_1.GetTitledFirstNameNoTooltip] [Select_CString(friend_1.IsFemale,'je má nejlepší přítelkyně','je můj nejlepší přítel')]."
 diplomacy_family.2200.a.tt: "[friend_1.GetTitledFirstName] se může stát [Select_CString(friend_1.IsFemale,'tvou nejlepší přítelkyní','tvým nejlepším přítelem')]"
 diplomacy_family.2200.b: "[friend_2.GetFirstNameNoTooltip] důvěřuji víc než komukoli jinému."
 diplomacy_family.2200.b.tt: "[friend_2.GetTitledFirstName] se může stát [Select_CString(friend_2.IsFemale,'tvou nejlepší přítelkyní','tvým nejlepším přítelem')]"
 diplomacy_family.2200.c: "Kdo jiný než [friend_3.GetTitledFirstNameNoTooltip]?"
 diplomacy_family.2200.c.tt: "[friend_3.GetTitledFirstName] se může stát [Select_CString(friend_3.IsFemale,'tvou nejlepší přítelkyní','tvým nejlepším přítelem')]"
 diplomacy_family.2200.d: "[Select_CString(ROOT.Char.IsFemale,'Neměla','Neměl')] bych nikoho upřednostňovat."
 diplomacy_family.2201.desc: "Teprve nedávno mi začíná docházet, jak moc spoléhám na rady a podporu [ruler.GetFirstNamePossessive]. Dnes už je pro mě [ruler.GetFirstNameNoTooltip] [Select_CString(ruler.IsFemale,'nejbližší a nejdražší přítelkyní','nejbližším a nejdražším přítelem')]."
 diplomacy_family.2201.a: "Jsme skutečně spřízněné duše."
 diplomacy_family.2201.b: "Jsme přátelé, jistě, ale nic víc."
 diplomacy_family.2201.b.tt: "Zůstaneme pouze přáteli"
 diplomacy_family.2201.a.tt: "Stanou se z nás skuteční nejlepší přátelé"
 diplomacy_family.2250.t: "[lover.Custom2('RelationToMeShort', SCOPE.sC('ruler'))|U] v zajetí žárlivosti"
 diplomacy_family.2250.desc.intro: "Nesnesu pohled na to, jak [ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))|U] [lover.GetFirstName], má láska, tráví čas s [spouse.GetTitledFirstName] — osobou bez špetky vychování."
 diplomacy_family.2250.desc.legal.pure: "\n\nPředstava, že nečisté ruce poskvrňují [Select_CString(lover.IsFemale,'její','jeho')] tělo, je nesnesitelná. Patříme ke stejnému rodu [ruler.GetHouse.GetName]. Patříme k sobě!"
 diplomacy_family.2250.desc.legal.same: "\n\nProč  má božská přízeň připadnout [ruler.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] [spouse.GetFirstNameNoTooltip] spíš než mně? Patříme k rodu [ruler.GetHouse.GetName], ale [spouse.GetFirstNameNoTooltip] může žít s [lover.GetFirstNameNoTooltip], zatímco já se musím skrývat v jejich stínu."
 diplomacy_family.2250.desc.illegal: "\n\nI když se nemůžeme vzít, ještě to neznamená, že mi může být jedno, s kým [lover.GetFirstNameNoTooltip] stráví zbytek života!"
 diplomacy_family.2250.a: "Ať si [spouse.GetFirstNameNoTooltip] nechá ruce pro sebe!"
 diplomacy_family.2250.a.tt: "[ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))|U] [lover.GetFirstName] už nebude sdílet lože s [spouse.GetTitledFirstName] — postarám se o to"
 diplomacy_family.2250.a.success.duel: "Podaří se mi [spouse.GetTitledFirstName] zastrašit"
 diplomacy_family.2250.a.failure.duel: "[spouse.GetTitledFirstName] mé varování ignoruje"
 diplomacy_family.2250.a.failure.tt: "[spouse.GetTitledFirstName] [Select_CString(spouse.IsFemale,'nedbala','nedbal')] mých varování ohledně [lover.GetFirstName]"
 diplomacy_family.2250.b.a: "„Proč už konečně neumřeš?!“"
 diplomacy_family.2250.b.b: "[spouse.GetFirstNameNoTooltip] musí být [Select_CString(spouse.IsFemale,'odstraněna','odstraněn')]."
 diplomacy_family.2250.b.tt: "[Concept('scheme','Intrika')|E] bude mít zvýšenou [Concept('success_chance','šanci na úspěch')|E]"
 diplomacy_family.2250.b.spouse_joining: "[lover.GetFirstName] se k mé [Concept('scheme','intrice')|E] #P připojí#!"
 diplomacy_family.2250.b.spouse_refusing: "[lover.GetFirstName] se k mé [Concept('scheme','intrice')|E] #N NEPŘIPOJÍ#!"
 diplomacy_family.2250.c.a: "[house_head.GetTitledFirstNameNoTooltip] musí toto manželství ukončit!"
 diplomacy_family.2250.c.b: "Musím toto manželství ukončit!"
 diplomacy_family.2250.c.flavor: "[Concept('house_head','Hlava rodu')|E] má moc zrušit manželství, v němž žije [lover.GetFirstNameNoTooltip]"
 diplomacy_family.2250.d: "Musím se naučit s touhle bolestí žít."
 diplomacy_family.2251.desc: "Než [spouse.GetTitledFirstName] znovu sáhne na [lover.GetFirstName], dobře si to rozmyslí. [Select_CString(ROOT.Char.IsFemale,'Dávala jsem','Dával jsem')] si velký pozor, abych [Select_CString(ROOT.Char.IsFemale,'neprozradila','neprozradil')] své důvody, ale znovu na to v budoucnu tlačit by nejspíš nebylo moudré.\n\nDříve či později [spouse.GetFirstNameNoTooltip] sebere odvahu mé výhrůžky ignorovat, ale prozatím mohu klidně spát."
 diplomacy_family.2251.a: "[ruler.Custom2('RelationToMeShort', SCOPE.sC('lover'))|U] [lover.GetFirstNameNoTooltip] to snad ocení."
 diplomacy_family.2252.desc: "„Jak můžeš být tak [Select_CString(ROOT.Char.IsFemale,'bezohledná','bezohledný')]?!“ syčí na mě [lover.GetFirstName] a ani v mých vlastních [ROOT.Char.Custom('GetRoomPlural')] se neodváží zvýšit hlas.\n\nZdá se, že [spouse.GetTitledFirstName] mé varování ignoruje a o našem rozhovoru [Select_CString(spouse.IsFemale,'pověděla','pověděl')] [lover.GetFirstNameNoTooltip].\n\n„Nemohu kvůli tobě zanedbávat své manželské povinnosti, [ruler.GetFirstNameNoTooltip]!“ Nato [lover.GetFirstNameNoTooltip] spěšně odejde."
 diplomacy_family.2252.a: "Ale...!"
 diplomacy_family.2253.desc.a: "Můj plán vyšel dokonale! [lover.GetFirstName] je konečně [Select_CString(lover.IsFemale,'volná','volný')]! [spouse.GetTitledFirstName] — [spouse.Custom2('InsultNoun', ROOT.Char)] bez špetky vychování — už nám nestojí v cestě a větší radost si snad ani nelze představit.\n\nJakmile se [lover.GetFirstNameNoTooltip] [Select_CString(lover.IsFemale,'dozvěděla','dozvěděl')] novinu od [house_head.GetTitledFirstName], [Select_CString(lover.IsFemale,'přispěchala','přispěchal')] za mnou do [ROOT.Char.Custom('GetRoomPlural')] a tím nejsladším způsobem mi [Select_CString(lover.IsFemale,'vyjádřila','vyjádřil')] svou vděčnost."
 diplomacy_family.2253.desc.b: "Můj plán vyšel dokonale! [lover.GetFirstName] je konečně [Select_CString(lover.IsFemale,'volná','volný')]! [spouse.GetTitledFirstName] — [spouse.Custom2('InsultNoun', ROOT.Char)] bez špetky vychování — už nám nestojí v cestě a větší radost si snad ani nelze představit.\n\nJakmile [lover.GetFirstNameNoTooltip] [Select_CString(lover.IsFemale,'obdržela','obdržel')] můj dopis, [Select_CString(lover.IsFemale,'přispěchala','přispěchal')] za mnou do [ROOT.Char.Custom('GetRoomPlural')] a tím nejsladším způsobem mi [Select_CString(lover.IsFemale,'vyjádřila','vyjádřil')] svou vděčnost."
 diplomacy_family.2253.a: "Teď už můžeme být konečně navždy spolu!"
 diplomacy_family.2253.b: "Co všechno člověk neudělá pro rodinu..."
 diplomacy_family.2253.c: "O naší lásce se dozvědí všichni!"
 diplomacy_family.2254.desc.a: "[Select_CString(ROOT.Char.IsFemale,'Doufala jsem','Doufal jsem')], že mi [lover.GetFirstName] poděkuje za žádost, kterou jsem [Select_CString(ROOT.Char.IsFemale,'předložila','předložil')] [house_head.GetTitledFirstName], aby [Select_CString(house_head.IsFemale,'ukončila','ukončil')] manželství s [spouse.GetFirstName]. Opak je však pravdou.\n\n[lover.GetFirstNameNoTooltip] je kvůli mému vměšování do [Select_CString(lover.IsFemale,'jejího','jeho')] manželství naprosto [Select_CString(lover.IsFemale,'vzteklá','vzteklý')] a už se mnou nechce mít nic společného."
 diplomacy_family.2254.desc.b: "[Select_CString(ROOT.Char.IsFemale,'Doufala jsem','Doufal jsem')], že mi [lover.GetFirstName] poděkuje za to, že jsem [Select_CString(ROOT.Char.IsFemale,'zařídila','zařídil')] rozvod. Opak je však pravdou.\n\n[lover.GetFirstNameNoTooltip] je kvůli mému vměšování do [Select_CString(lover.IsFemale,'jejího','jeho')] manželství naprosto [Select_CString(lover.IsFemale,'vzteklá','vzteklý')] a už se mnou nechce mít nic společného."
 diplomacy_family.2254.a: "Nejde o nás, ale o rodinu!"
 diplomacy_family.2254.b: "Nevím, co říct..."
 diplomacy_family.2300.t: "Prořezávání rodokmenu"
 diplomacy_family.2300.desc.intro: "Už samotná existence [bad_relative.GetFirstNameNoTooltip] je urážkou jména naší slavné dynastie."
 diplomacy_family.2300.desc.a: "\n\n[ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))|U] [bad_relative.GetFirstNameNoTooltip] je [Select_CString(bad_relative.IsFemale,'taková senilní hlupačka','takový senilní hlupák')], [Select_CString(bad_relative.IsFemale,'která','který')] se potácí životem a každým slovem, které vypustí z úst, dělá ostudu rodu [ruler.GetDynastyName]."
 diplomacy_family.2300.desc.b: "\n\n[ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))|U] [bad_relative.GetFirstNameNoTooltip] je naprostým zklamáním ve všem, o co se pokusí."
 diplomacy_family.2300.desc.c: "\n\n[ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))|U] [bad_relative.GetFirstNameNoTooltip] [Select_CString(bad_relative.IsFemale,'je znetvořená zrůda','je znetvořený netvor')], [Select_CString(bad_relative.IsFemale,'která','který')] každým nádechem ponižuje dynastii [bad_relative.GetDynasty.GetName]. Jak mohl tak vznešený rod zplodit někoho takového?"
 diplomacy_family.2300.desc.d: "\n\n[ruler.Custom2('RelationToMeShort', SCOPE.sC('bad_relative'))|U] [bad_relative.GetFirstNameNoTooltip] je seschlou, pokroucenou větví našeho bujného rodokmenu a neustálou připomínkou nevěry [bad_parent.GetFirstNamePossessive]."
 diplomacy_family.2300.a: "Možná ještě dokážu [bad_relative.GetFirstNameNoTooltip] něco užitečného naučit."
 diplomacy_family.2300.a.success.tt: "Pomohu [bad_relative.GetFirstName] naučit se něco užitečného"
 diplomacy_family.2300.a.success.effect.tt: "Jedna z [Concept('skills','dovedností')|E] postavy [bad_relative.GetFirstNameNoTooltip] se zvýší"
 diplomacy_family.2300.a.failure.tt: "[bad_relative.GetFirstName] mou pomoc odmítne"
 diplomacy_family.2300.a.failure.toast: "Nepodařilo se mi [bad_relative.GetFirstName] naučit nic podstatného"
 diplomacy_family.2300.b.a: "Musím znovu zařídit, aby [bad_relative.GetFirstNameNoTooltip] [Select_CString(bad_relative.IsFemale,'zmizela','zmizel')]."
 diplomacy_family.2300.b.b: "Někdy je zkrátka třeba strom prořezat..."
 diplomacy_family.2300.c: "Musím [bad_relative.GetFirstNameNoTooltip] vyhnat!"
 diplomacy_family.2300.c.flavor: "[Concept('dynast','Hlava dynastie')|E] má moc vydědit členy rodiny"
 diplomacy_family.2300.d: "Každý máme své nedostatky."
 diplomacy_family.2301.desc: "Byla to dřina, ale nakonec se mi podařilo něco [bad_relative.GetFirstNameNoTooltip] vtluct do té tvrdé palice. Přinejmenším už [bad_relative.GetFirstNameNoTooltip] není naprostým zklamáním..."
 diplomacy_family.2301.a: "[Select_CString(ROOT.Char.IsFemale,'Udělala','Udělal')] jsem, co bylo v mých silách."
 diplomacy_family_special.2200.t: "Spor o následníka"
 diplomacy_family_special.2200.desc: "Na konci dne odpočívám; [ROOT.Char.Custom('ResidenceBuilding')|U] kolem mě pomalu utichá. Právě tehdy dovnitř vejde [heir.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(heir.IsFemale,'viditelně rozrušená','viditelně rozrušený')].\n\n„[vassal.Custom2('YourCharacterIntroduction', ROOT.Char)|U] [Select_CString(vassal.IsFemale,'je tak otravná','je tak otravný')]!“ vykřikne [heir.GetFirstNameNoTooltip]. „[vassal.GetFirstNameNoTooltip|U] pořád dokola tvrdí, že se nehodím na to, abych po tobě [Select_CString(heir.IsFemale,'převzala','převzal')] vládu. Tvrdí, že mou povahu nejlépe vystihuje „[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')]“ a že proto nemůžu být příští "
 diplomacy_family_special.2200.same_title.desc: "[ROOT.Char.GetTitleAsNameNoTooltip]"
 diplomacy_family_special.2200.same_sex_title.desc: "$diplomacy_family_special.2200.same_title.desc$"
 diplomacy_family_special.2200.opposite_sex_title.desc: "[ROOT.Char.GetPrimarySpouse.GetTitleAsNameNoTooltip]"
 diplomacy_family_special.2200.ruler.desc: "[ROOT.Char.GetTitleAsNameNoTooltip]"
 diplomacy_family_special.2200.end.desc: "! V sázce je přece [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!“"
 diplomacy_family_special.2200.a: "Pojď si ke mně sednout, probereme to."
 diplomacy_family_special.2200.a.tt: "Pomůžeš [heir.GetFirstNameNoTooltip] najít způsob, jak na kritiku odpovědět"
 diplomacy_family_special.2200.b: "Promluvím si o tom s [vassal.GetTitledFirstNameNoTooltip]."
 diplomacy_family_special.2200.b.tt: "[vassal.GetFirstNameNoTooltip] ti vysvětlí, proč kritizuje tvého dědice"
 diplomacy_family_special.2200.c: "Proč mě s tím obtěžuješ?"
 diplomacy_family_special.2201.desc: "Odvedu [heir.GetFirstName] stranou, abychom si promluvili od srdce. Je zřejmé, že situace kolem [vassal.GetTitledFirstName] [heir.GetFirstNameNoTooltip] [Select_CString(heir.IsFemale,'frustruje a je ochotná vyslechnout mou radu','frustruje a je ochotný vyslechnout mou radu')]."
 diplomacy_family_special.2201.a: "Máte toho společného víc, než si myslíš."
 diplomacy_family_special.2201.a.success: "[heir.GetFirstNameNoTooltip] a [vassal.GetFirstNameNoTooltip] urovnají své neshody"
 diplomacy_family_special.2201.a.failure: "[heir.GetFirstNameNoTooltip] se odmítne s [vassal.GetFirstNameNoTooltip] usmířit"
 diplomacy_family_special.2201.b: "[Select_CString(ROOT.Char.IsFemale,'Mohla bych','Mohl bych')] ti pomoci osvojit si opačnou vlastnost — „[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]“..."
 diplomacy_family_special.2201.b.success: "Přesvědčíš [heir.GetFirstNameNoTooltip], [Select_CString(heir.IsFemale,'aby se pokusila změnit svou povahu','aby se pokusil změnit svou povahu')]"
 diplomacy_family_special.2201.b.failure: "[heir.GetFirstNameNoTooltip] odmítne změnit svou povahu"
 diplomacy_family_special.2201.b.success.tt: "[heir.GetTitledFirstName] začne pracovat na opačném povahovém rysu: [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInvertedTraitLink')]"
 diplomacy_family_special.2201.b.failure.tt: "[heir.GetTitledFirstName] zůstane beze změny: [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagTraitLink')]"
 diplomacy_family_special.2201.c: "Za tu kritiku [vassal.GetFirstNameNoTooltip] zaplatí!"
 diplomacy_family_special.2202.desc: "[vassal.GetTitledFirstName] přijme mou žádost o schůzku. Chci probrat vznesenou kritiku; jejím terčem je [heir.GetTitledFirstName]. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))|U] přece patří do mé rodiny.\n\n„Je to prosté, [ROOT.Char.GetTitledFirstNameNoTooltip]. Nelíbí se mi představa, že mi má vládnout někdo s povahou, kterou nejlépe vystihuje „[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')]“. [ROOT.Char.Custom('GetRealmOrDomicile')|U] si zaslouží lepší budoucnost. [Select_CString(vassal.IsFemale,'Jsem ochotná dát svou nespokojenost najevo, i kdybych se tím měla vystavit nebezpečí','Jsem ochotný dát svou nespokojenost najevo, i kdybych se tím měl vystavit nebezpečí')].“"
 diplomacy_family_special.2202.a: "Ale [heir.GetFirstNameNoTooltip] má přece i dobré vlastnosti!"
 diplomacy_family_special.2202.a.success: "[vassal.GetFirstNameNoTooltip] a [heir.GetFirstNameNoTooltip] urovnají své neshody"
 diplomacy_family_special.2202.a.failure: "[vassal.GetFirstNameNoTooltip] se odmítne s [heir.GetFirstNameNoTooltip] usmířit"
 diplomacy_family_special.2202.b: "Máš pravdu, [heir.GetFirstNameNoTooltip] je zklamání."
 diplomacy_family_special.2202.c: "Takhle o mé rodině mluvit nebudeš! [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))|U] [heir.GetFirstNameNoTooltip] si zaslouží úctu."
 diplomacy_family_special.2210.desc: "[vassal.GetTitledFirstName] se po našem rozhovoru rozhodne udělat první krok ke smíru a [heir.GetTitledFirstName] tak dostane příležitost odpovědět stejně. Místo vzájemných rozdílů se zaměří na to, co mají společné. Tato změna postoje vypadá velmi nadějně!"
 diplomacy_family_special.2210.a: "To je dobré znamení do budoucna!"
 diplomacy_family_special.2211.desc: "[vassal.GetTitledFirstName] mé argumenty vyslechne, ale ani přes veškerou mou snahu nechce připustit, že trocha dobré vůle by mohla jejich vztah s [heir.GetTitledFirstName] napravit. [Select_CString(vassal.IsFemale,'Ta hlupačka odmítá','Ten hlupák odmítá')] uznat, že [heir.GetTitledFirstName] má jedinou sympatickou vlastnost."
 diplomacy_family_special.2211.a: "[vassal.GetTitledFirstNameNoTooltip] [Select_CString(vassal.IsFemale,'je opravdu nesnesitelná','je opravdu nesnesitelný')]!"
 diplomacy_family_special.2211.a.high_opinion: "[Select_CString(ROOT.Char.IsFemale,'Čekala jsem','Čekal jsem')] od [vassal.GetTitledFirstNameNoTooltip] víc."
 diplomacy_family_special.2212.desc: "[heir.GetTitledFirstName] si po našem rozhovoru vezme má slova k srdci a řekne, že se bude snažit chovat lépe, kdykoli bude [vassal.GetTitledFirstName] nablízku.\n\nPokud se zaměří na to, co mají společné, místo na své rozdíly, možná mezi nimi dokonce vznikne nové přátelství."
 diplomacy_family_special.2212.a: "To je dobré znamení do budoucna!"
 diplomacy_family_special.2213.desc: "Přes veškerou mou snahu [heir.GetTitledFirstName] odmítne připustit, že by trocha dobré vůle mohla jejich vztah napravit. Kdykoli je [vassal.GetTitledFirstNameNoTooltip] nablízku, [heir.GetFirstNameNoTooltip] odmítá své chování změnit.\n\nZdá se, že jejich vzájemná nevraživost ještě nějakou dobu potrvá..."
 diplomacy_family_special.2213.a: "[heir.GetFirstNameNoTooltip] mě [Select_CString(ROOT.Char.IsFemale,'zklamala','zklamal')]."
 diplomacy_family_special.2220.desc: "Sednu si s [heir.GetFirstName] a vysvětlím, že někdy je pro dobro [ROOT.Char.Custom('GetRealmOrDomicile')] nejlepší jednat způsobem, který vystihuje „[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]“, i když to člověku není vlastní.\n\n[heir.GetFirstNameNoTooltip] [Select_CString(heir.IsFemale,'zpočátku pochybuje, ale povzbudí ji','zpočátku pochybuje, ale povzbudí ho')], když vysvětlím, že s časem a praxí je takové chování snazší."
 diplomacy_family_special.2220.a: "Čas ukáže, co to změní."
 diplomacy_family_special.2220.a.tt: "[heir.GetFirstName] se pokusí změnit svou povahu: [SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInvertedTraitLink')]"
 diplomacy_family_special.2221.desc: "[Select_CString(ROOT.Char.IsFemale,'Snažila jsem se','Snažil jsem se')] [heir.GetFirstName] vysvětlit, proč je ve vlastním zájmu zmírnit rys „[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlag')]“. Na příkladech ukazuji, že [ROOT.Char.GetTitleAsNameNoTooltip] může mnohdy získat, když jedná opačně — tedy „[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]“.\n\nPřesto [heir.GetFirstNameNoTooltip] odmítne o jakékoli změně chování vůbec uvažovat. Je pevně [Select_CString(heir.IsFemale,'rozhodnutá zůstat při starém, i kdyby tím měla','rozhodnutý zůstat při starém, i kdyby tím měl')] přijít o přízeň ostatních."
 diplomacy_family_special.2221.a: "Proč [heir.GetFirstNameNoTooltip] nechce vidět pravdu v mých slovech?"
 diplomacy_family_special.2231.desc: "[heir.GetTitledFirstName] stojí na jedné straně, [vassal.GetTitledFirstName] na druhé; jejich vztah sice začal nevraživostí a záští, ale pod mým vedením mezi nimi postupně vzniklo vzájemné porozumění a důvěra. Pečlivé rozvíjení těchto základů nakonec vedlo ke skutečně pevnému přátelství!"
 diplomacy_family_special.2231.a: "[Select_CString(ROOT.Char.IsFemale,'Věděla jsem','Věděl jsem')], že to společně zvládneme!"
 diplomacy_family_special.2233.desc: "Už několik let [heir.GetFirstName] povzbuzuji ke změně chování a zdá se, že mé úsilí skutečně přineslo ovoce!\n\nJednat způsobem, který vystihuje „[SCOPE.Custom('PersonalityGetTraitDescriptionFromFlagInverted')]“, je teď pro [heir.GetFirstNameNoTooltip] téměř druhou přirozeností. Tento návyk se zakořenil natolik, že už takové chování nevyžaduje žádné vědomé úsilí."
 diplomacy_family_special.2233.a: "[Select_CString(ROOT.Char.IsFemale,'Jsem ráda, že','Jsem rád, že')] [heir.GetFirstNameNoTooltip] osobnostně roste."
 diplomacy_family.2400.story_title: "Výchova dědice"
 diplomacy_family.2400.t: "$diplomacy_family.2400.story_title$: Nabídka"
 diplomacy_family.2400.desc: "Jednoho časného rána za mnou přijde [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('spouse'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]. Místem našeho setkání je [ROOT.Char.Custom('GetChambersOrTent')].\n\n„[ROOT.Char.Custom('ComplimentAdjective')|U] [spouse.Custom2('RelationToMe', ROOT.Char)]! V poslední době přemýšlím o vzdělání [heir.GetFirstNameNoTooltip]. Mou nejsilnější stránkou je [spouse.Custom('highest_skill_noun')] a myslím, že mé znalosti by mohly [heir.GetFirstNameNoTooltip] prospět. Dovolíš mi pomoci s učením?“"
 diplomacy_family.2400.a: "[Select_CString(spouse.IsFemale,'Měla by dostat příležitost','Měl by dostat příležitost')]."
 diplomacy_family.2400.a.tt: "[spouse.GetFirstNameNoTooltip] se pokusí doučovat [heir.GetFirstNameNoTooltip]"
 diplomacy_family.2400.a.result.tt_first: "#weak Vzdělání postavy [TARGET_CHARACTER.GetFirstNameNoTooltip] se #EMP možná#! zlepší#!"
 diplomacy_family.2400.b: "Má výuka postačí."
 diplomacy_family.2410.t: "$diplomacy_family.2400.story_title$: Na mrtvém bodě"
 diplomacy_family.2410.desc: "Jedné neklidné noci se vydám na procházku. Když dojdu ke skladu potravin, zaslechnu podivný zvuk. K mému překvapení tam [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName] hltá [ROOT.Char.Custom('GetExpensiveDessert')]. [Select_CString(spouse.IsFemale,'Podívá se na mě zahanbená a zoufalá','Podívá se na mě zahanbený a zoufalý')].\n\n„S výchovou [heir.GetFirstName] jsem v koncích! Místo poslouchání mých rad [heir.GetFirstNameNoTooltip] "
 diplomacy_family.2410.rowdy: "pobíhá všude kolem a tropí neplechu."
 diplomacy_family.2410.charming: "neustále klábosí s ostatními dětmi."
 diplomacy_family.2410.curious: "mě dohání k šílenství nepodstatnými otázkami."
 diplomacy_family.2410.pensive: "má neustále nos zabořený v knize."
 diplomacy_family.2410.bossy: "dělá přesný opak toho, co řeknu."
 diplomacy_family.2410.desc.after: " Takhle už nemůžu pokračovat, aniž bych [Select_CString(spouse.IsFemale,'přišla','přišel')] o rozum.“"
 diplomacy_family.2410.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych opatřit studijní materiály."
 diplomacy_family.2410.a.tt: "Pomůžeš [spouse.GetFirstNameNoTooltip] s výukou postavy [heir.GetNameNoTooltip]"
 diplomacy_family.2410.a.possible_outcome_good.tt_first: "#weak Díky vašim společným schopnostem se vzdělání postavy [TARGET_CHARACTER.GetFirstNameNoTooltip] může #P výrazně#! zlepšit#!"
 diplomacy_family.2410.a.possible_outcome_mediocre.tt_first: "#weak Díky vašim společným schopnostem se vzdělání postavy [TARGET_CHARACTER.GetFirstNameNoTooltip] může #M mírně#! zlepšit#!"
 diplomacy_family.2410.b: "„Musíš se víc snažit.“"
 diplomacy_family.2410.b.tt: "Povzbudíš [spouse.GetFirstNameNoTooltip], aby [Select_CString(spouse.IsFemale,'pokračovala','pokračoval')] ve výuce postavy [heir.GetFirstNameNoTooltip]"
 diplomacy_family.2410.b.possible_outcome.tt_first: "#weak Vzdělání postavy [TARGET_CHARACTER.GetFirstNameNoTooltip] se zlepší#!"
 diplomacy_family.2410.c: "Raději se o to postarám [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 diplomacy_family.2410.c.possible_outcome_you.tt_first: "#weak Vzdělání postavy [TARGET_CHARACTER.GetFirstNameNoTooltip] se zlepší#!"
 diplomacy_family.2411.t: "$diplomacy_family.2400.story_title$: Společnými silami"
 diplomacy_family.2411.desc: "Po měsících tvrdé práce a úsilí věnovaného vzdělávání [heir.GetFirstNameNoTooltip] za mnou přijde [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName]. Místem našeho setkání je [ROOT.Char.Custom('GetChambersOrTent')]. [Select_CString(spouse.IsFemale,'Tvář jí září pýchou','Tvář mu září pýchou')].\n\n„Ach, [ROOT.Char.GetFirstNameNoTooltip]! Díky tvému vedení a podpoře [heir.GetNameNoTooltip], [heir.Custom('PetName')], ve studiu skutečně vyniká. Bez tebe bych [Select_CString(spouse.IsFemale,'byla ztracená','byl ztracený')].“"
 diplomacy_family.2411.a: "[heir.GetFirstNameNoTooltip] má před sebou světlou budoucnost."
 diplomacy_family.2411.a.outcome_spouse_medium.tt_global_past: "#weak díky dostatečným schopnostem manžela či manželky.#!"
 diplomacy_family.2411.a.outcome_you_medium.tt_global_past: "#weak díky tvým dostatečným schopnostem.#!"
 diplomacy_family.2411.a.outcome_spouse_good.tt_global_past: "#weak díky výjimečným schopnostem manžela či manželky.#!"
 diplomacy_family.2411.a.outcome_you_good.tt_global_past: "#weak díky tvým výjimečným schopnostem.#!"
