l_polish:
 diplomacy_foreign.1074.t: "Náboženští uprchlíci"
 diplomacy_foreign.1074.desc: "[heretic_ruler.GetTitledFirstName] vládne nedalekému [target_county.GetName], kde ve velkém počtu žijí [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. [heretic_ruler.GetFaith.GetAdherentName|U] [heretic_ruler.GetTitleAsName] by tam mohl[Select_CString(heretic_ruler.IsFemale,'a snadno pronásledovat',' snadno pronásledovat')] věrné [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] a mou povinností je je chránit. Zvlášť když [Select_CString(heretic_ruler.IsFemale,'její přístup','jeho přístup')] lze vystihnout jako „[ROOT.GetCharacter.Custom2('ToleranceValue', SCOPE.sC('heretic_ruler'))]“."
 diplomacy_foreign.1074.a: "Nesmíme dovolit [heretic_ruler.GetFirstNameNoTooltip] utiskovat věřící!"
 diplomacy_foreign.1074.b: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip|U] musí být v bezpečí. Propašujeme jich pryč co nejvíc."
 diplomacy_foreign.1074.c: "Vyslat k [heretic_ruler.GetFirstNameNoTooltip] posla a promluvit si o zacházení s věřícími."
 diplomacy_foreign.1074.c.success: "[heretic_ruler.GetFirstName] mého posla otevřeně přivítá"
 diplomacy_foreign.1074.c.failure: "[heretic_ruler.GetFirstName] pojme podezření ohledně záměrů mého posla"
 diplomacy_foreign.3001.t: "Korespondence"
 diplomacy_foreign.3001.opening: "[neighboring_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 diplomacy_foreign.3001.desc: "Slyším o tobě samou chválu a rád[Select_CString(neighboring_ruler.IsFemale,'a bych si s tebou začala dopisovat',' bych si s tebou začal dopisovat')]. Doufám, že tě tento dopis zastihne ve stejně vstřícné náladě, protože netrpělivě očekávám rychlou odpověď."
 diplomacy_foreign.3001.a: "Začít si dopisovat s [neighboring_ruler.GetFirstNameNoTooltip]."
 diplomacy_foreign.3001.a.tt: "Od [neighboring_ruler.GetFirstName] budeš nadále dostávat dopisy"
 diplomacy_foreign.3001.b: "Dopis [neighboring_ruler.GetTitleAsNamePossessiveNoTooltip] vystavím ve své síni!"
 diplomacy_foreign.3001.c: "Zdvořile odmítnout."
 diplomacy_foreign.3003.desc_dead: "[Select_CString(dead_ruler.IsFemale,'Má předchůdkyně','Můj předchůdce')] [dead_ruler.GetTitledFirstName] mě [Select_CString(dead_ruler.IsFemale,'vyzvala','vyzval')], abych v korespondenci s tebou pokračoval[Select_CString(neighboring_ruler.IsFemale,'a','')]. Přiznávám ale, že si [Select_CString(neighboring_ruler.IsFemale,'nejsem jistá','nejsem jistý')], o čem psát. Prosím, vyber téma!"
 diplomacy_foreign.3003.desc: "Děkuji za rychlou odpověď! Na naši korespondenci se opravdu těším. Prosím, vyber první téma, o kterém si budeme psát!"
 diplomacy_foreign.3003.a_lifestyle_diplomat: "Proberme jemné nuance etikety!"
 diplomacy_foreign.3003.a_lifestyle_general: "Mám pár skvělých válečných historek."
 diplomacy_foreign.3003.a_lifestyle_administrator: "Zvláštnosti správy panství jsou prostě #EMP fascinující!#!"
 diplomacy_foreign.3003.a_lifestyle_schemer: "Och, vsadím se, že [neighboring_ruler.GetFirstNameNoTooltip] by ocenil[Select_CString(neighboring_ruler.IsFemale,'a nejnovější klepy',' nejnovější klepy')]..."
 diplomacy_foreign.3003.a_lifestyle_scholar: "Filozofické debaty jsou vždy zajímavé!"
 diplomacy_foreign.3003.a.tt: "Téma, ve kterém se vyznáš, může na [neighboring_ruler.GetFirstNameNoTooltip] udělat dojem"
 diplomacy_foreign.3003.b: "Prosím, pověz mi něco o tématu, které tě zajímá: [neighboring_ruler.Custom('subject_of_interest')]."
 diplomacy_foreign.3003.b.tt: "Podle zvěstí je toto téma [neighboring_ruler.GetFirstNameNoTooltip] velmi blízké"
 diplomacy_foreign.3003.c: "Pošlu dar jako projev uznání."
 diplomacy_foreign.3003.c.tt: "Myslíš si, že [neighboring_ruler.GetFirstNameNoTooltip] si cení hmotných věcí"
 diplomacy_foreign.3007.desc_dead: "[Select_CString(dead_ruler_2.IsFemale,'Má předchůdkyně','Můj předchůdce')] [dead_ruler_2.GetTitledFirstName] mě [Select_CString(dead_ruler_2.IsFemale,'vyzvala','vyzval')], abych v korespondenci s tebou pokračoval[Select_CString(neighboring_ruler.IsFemale,'a','')]. Tvůj poslední dopis na mě udělal velmi dobrý dojem!"
 diplomacy_foreign.3007.desc_lifestyle: "Potěšilo mě, s jakým zaujetím se věnuješ svým zájmům. Tvůj poslední dopis rozhodně dokazuje, že se v nich vyznáš!"
 diplomacy_foreign.3007.desc_interest: "Že ses zeptal[Select_CString(ROOT.Char.IsFemale,'a právě',' právě')] na téma, které je mi tak drahé... Opravdu mě znáš lépe než většina lidí!"
 diplomacy_foreign.3007.desc_gift: "Dar, který jsi mi poslal[Select_CString(ROOT.Char.IsFemale,'a','')], mi udělal velikou radost!"
 diplomacy_foreign.3007.desc_ending: "Když jsi mi věnoval[Select_CString(ROOT.Char.IsFemale,'a tolik pozornosti',' tolik pozornosti')], musím se zeptat: mohu pro tebe něco udělat?"
 diplomacy_foreign.3007.a: "Chci jen pokračovat v našem dopisování!"
 diplomacy_foreign.3007.a_random_list_good: "Naše korespondence mě mnohému učí o zahraničních záležitostech"
 diplomacy_foreign.3007.a_random_list_bad: "Z dopisů [neighboring_ruler.GetFirstNamePossessiveNoTooltip] se toho mnoho nedozvím"
 diplomacy_foreign.3007.b: "Možná bychom mohli uzavřít obchodní dohodu?"
 diplomacy_foreign.3007.c: "[Select_CString(ROOT.Char.IsFemale,'Když už jsem ti vyhověla a povídala si s tebou...','Když už jsem ti vyhověl a povídal si s tebou...')]"
 diplomacy_foreign.3007.c_tt: "Pokusíš se přesvědčit [neighboring_ruler.GetFirstNameNoTooltip], že ti něco dluží!"
 diplomacy_foreign.3007.c_random_list_good: "Podaří se mi přesvědčit [neighboring_ruler.GetFirstNameNoTooltip]"
 diplomacy_foreign.3007.c_random_list_bad: "Ztrapním se"
 diplomacy_foreign.3008.opening: "[neighboring_ruler.Custom2('RelationDescriptor', ROOT.Char)|U] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 diplomacy_foreign.3008.desc.dead: "[Select_CString(dead_ruler_2.IsFemale,'Má předchůdkyně','Můj předchůdce')] [dead_ruler_2.GetTitledFirstName] mě [Select_CString(dead_ruler_2.IsFemale,'vyzvala','vyzval')], abych v korespondenci s tebou pokračoval[Select_CString(neighboring_ruler.IsFemale,'a','')]. Po tvém posledním dopise však naši výměnu ukončuji. Zdá se, že [Select_CString(dead_ruler_2.IsFemale,'se mýlila','se mýlil')] v tom, jak příjemná je s tebou rozmluva!"
 diplomacy_foreign.3008.desc.skilled: "Snažíš se mě snad zesměšnit? Tvůj poslední dopis byl tak přeplněný obskurnostmi, že jsem nerozuměl[Select_CString(neighboring_ruler.IsFemale,'a ani jedné větě ze tří',' ani jedné větě ze tří')]!"
 diplomacy_foreign.3008.desc.special: "Pokud si myslíš, že se někam dostaneš podlézáním, velmi ses ve mně zmýlil[Select_CString(ROOT.Char.IsFemale,'a','')]. Teď už vidím, že tvá slova jsou stejně prázdná jako tvá lebka."
 diplomacy_foreign.3008.desc.bribe: "Pokud si myslíš, že se někam dostaneš úplatky, velmi ses ve mně zmýlil[Select_CString(ROOT.Char.IsFemale,'a','')]. Chamtivost je nesmírně odpudivá vlastnost."
 diplomacy_foreign.3008.desc.end: "A přitom pro mě kdysi tvé přátelství tolik znamenalo..."
 diplomacy_foreign.3008.a: "Jejda."
 diplomacy_foreign.3008.a.tt: "Alespoň z toho vzešlo nějaké ponaučení!"
 diplomacy_foreign_special.1017.t: "Pohostinnost"
 diplomacy_foreign_special.1017.desc: "Čím víc studuji vznešené umění státnictví, tím jasněji si uvědomuji, jak prospěšné jsou dobré vztahy se sousedy.\n\nMěl[Select_CString(ROOT.Char.IsFemale,'a bych',' bych')] bych jednoho z nich pozvat ke svému dvoru a ukázat, jak dobrým přítelem dokážu být — ale koho?"
 diplomacy_foreign_special.1017.a: "[target_list_member_a.GetNameNoTooltip]."
 diplomacy_foreign_special.1017.b: "[target_list_member_b.GetNameNoTooltip]."
 diplomacy_foreign_special.1017.c: "[target_list_member_c.GetNameNoTooltip]."
 diplomacy_foreign_special.1017.d: "Raději se zaměřím na usmíření vlastních vazalů."
 diplomacy_foreign_special.1017.great: "Má pohostinnost na [THIS.Char.GetFirstName] udělá velký dojem"
 diplomacy_foreign_special.1017.good: "[THIS.Char.GetFirstName] si návštěvu užívá"
 diplomacy_foreign_special.1017.bad: "[THIS.Char.GetFirstName] je [Select_CString(THIS.Char.IsFemale,'zklamaná a odchází','zklamaný a odchází')] předčasně"
 diplomacy_foreign_special.1017.friends_a: "S [target_list_member_a.GetShortUIName] bychom se mohli spřátelit"
 diplomacy_foreign_special.1017.friends_b: "S [target_list_member_b.GetShortUIName] bychom se mohli spřátelit"
 diplomacy_foreign_special.1017.friends_c: "S [target_list_member_c.GetShortUIName] bychom se mohli spřátelit"
 diplomacy_foreign_special.1018.opening: "[foreign_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
 diplomacy_foreign_special.1018.desc: "Srdečně děkuji za pozvání ke tvému dvoru. Má družina a já dorazíme do [root_realm.GetNameNoTierNoTooltip] za několik týdnů."
 diplomacy_foreign_special.1017.a.spouse: "[helper_spouse.GetFirstNameNoTooltip], zapřáhni služebnictvo!"
 diplomacy_foreign_special.1017.a.no_spouse: "Okamžitě zapřáhnu služebnictvo!"
 diplomacy_foreign_special.1018.a.tt: "[foreign_guest.GetTitledFirstName] brzy dorazí"
 diplomacy_foreign_special.1019.t: "$diplomacy_foreign_special.1017.t$: Vřelé přivítání"
 diplomacy_foreign_special.1019.start.desc: "Konečně je tu [foreign_guest.GetTitledFirstName]! Dnes večer uspořádáme hostinu na uvítanou zahraničním hostům.\n\n"
 diplomacy_foreign_special.1019.spouse.desc: "[helper_spouse.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('helper_spouse'))], se pilně věnuje veškerému plánování a přípravám. Teď se mě ptá, zda mám nějaké návrhy na poslední úpravy."
 diplomacy_foreign_special.1019.no_spouse.desc: "Veškerému plánování a přípravám se pilně věnuji sám. Všechno je téměř hotové a ještě zbývá trochu času na poslední úpravu."
 diplomacy_foreign_special.1019.a: "Znám několik specialit z [foreign_guest_realm.GetNameNoTierNoTooltip]."
 diplomacy_foreign_special.1019.a.success.tt: "[foreign_guest.GetTitledFirstNameNoTooltip] se cítí jako doma"
 diplomacy_foreign_special.1019.a.failure.tt: "Spleteš se a [foreign_guest.GetTitledFirstNameNoTooltip] se urazí"
 diplomacy_foreign_special.court_visit.very_well: "Návštěva dvora probíhá #P velmi dobře#!"
 diplomacy_foreign_special.court_visit.poorly: "Návštěva dvora probíhá #N špatně#!"
 diplomacy_foreign_special.1019.b: "Musí to být okázalé! Víc... všeho!"
 diplomacy_foreign_special.1019.b.rl.desc: "Výsledek závisí na povaze postavy [foreign_guest.GetTitledFirstNameNoTooltip]"
 diplomacy_foreign_special.1019.b.success.tt: "[foreign_guest.GetTitledFirstNameNoTooltip] gesto ocení, stejně jako většina lidí"
 diplomacy_foreign_special.1019.b.failure.tt: "[foreign_guest.GetTitledFirstNameNoTooltip] by dal[Select_CString(foreign_guest.IsFemale,'a přednost',' přednost')] něčemu prostšímu"
 diplomacy_foreign_special.1019.c: "Nebudu riskovat změny na poslední chvíli."
 diplomacy_foreign_special.court_visit.normal: "Návštěva dvora probíhá #Z obvyklým způsobem#!"
 diplomacy_foreign_special.court_visit.well: "Návštěva dvora probíhá #P dobře#!"
 diplomacy_foreign_special.court_visit.disaster: "Návštěva dvora končí #N katastrofou#!"
 diplomacy_foreign_special.1020.t: "$diplomacy_foreign_special.1017.t$: Pohyb, nebo odpočinek"
 diplomacy_foreign_special.1020.desc: "Pokud se dá věřit obloze, čeká nás dnes nádherné počasí! Je to skvělá příležitost ukázat mému hostu [foreign_guest.GetTitledFirstName] krásy zdejší krajiny. Co by asi ocenil víc — náročný lov, nebo poklidný oběd na slunci?"
 diplomacy_foreign_special.1020.a: "Lov bude dokonalý!"
 diplomacy_foreign_special.1020.a.success.tt: "[foreign_guest.GetTitledFirstNameNoTooltip] si lov užívá"
 diplomacy_foreign_special.1020.a.failure.tt: "[foreign_guest.GetTitledFirstNameNoTooltip] se při lovu příšerně baví"
 diplomacy_foreign_special.1020.b: "Myslím, že [foreign_guest.GetFirstNameNoTooltip] dá přednost obědu."
 diplomacy_foreign_special.1020.b.success.tt: "[foreign_guest.GetTitledFirstNameNoTooltip] si oběd užívá"
 diplomacy_foreign_special.1021.t: "$diplomacy_foreign_special.1017.t$: Veselí, nebo zbožnost"
 diplomacy_foreign_special.1021.desc: "Rád[Select_CString(ROOT.Char.IsFemale,'a bych',' bych')] bych svému hostu [foreign_guest.GetTitledFirstName] ukázal[Select_CString(ROOT.Char.IsFemale,'a','')] kulturní skvosty [root_realm.GetNameNoTier]. Otázkou je, zda [foreign_guest.GetFirstNameNoTooltip] dá přednost velkolepému tanci se všemi pány a dámami dvora, nebo návštěvě [ROOT.Char.GetFaith.HouseOfWorship]."
 diplomacy_foreign_special.1021.a: "Vsadím se, že [foreign_guest.GetFirstNameNoTooltip] [Select_CString(foreign_guest.IsFemale,'je skvělá tanečnice','je skvělý tanečník')]!"
 diplomacy_foreign_special.1021.b: "[ROOT.Char.GetFaith.HouseOfWorship|U] se zdá být bližší vkusu [foreign_guest.GetFirstNameNoTooltip]."
 diplomacy_foreign_special.1021.a.success.tt: "[foreign_guest.GetTitledFirstNameNoTooltip] si tanec užívá"
 diplomacy_foreign_special.1021.b.success.tt: "[foreign_guest.GetTitledFirstNameNoTooltip] si návštěvu [ROOT.Char.GetFaith.HouseOfWorship] užívá"
 diplomacy_foreign_special.1022.t: "$diplomacy_foreign_special.1017.t$: Podivná žádost"
 diplomacy_foreign_special.1022.desc: "„[interesting_relation.GetFirstName] je opravdu znamenitý člověk,“ pronese [foreign_guest.GetTitledFirstName] a zamyšleně přitom krouží pohárem s [foreign_guest.Custom('RegionalDrink')]. Pohledem přitom sleduje [interesting_relation.GetFirstName], který[Select_CString(interesting_relation.IsFemale,'á sedí',' sedí')] o kus dál u stolu.\n\n„[ROOT.GetCharacter.GetTitledFirstNameNoTooltip], dovolíš mi soukromé setkání s [interesting_relation.GetFirstNameNoTooltip]? Samozřejmě nic nevhodného. Jen prostá večeře v mých komnatách.“"
 diplomacy_foreign_special.1022.a: "„Samozřejmě! V tom nevidím problém.“"
 diplomacy_foreign_special.1022.a.tt: "Nebudeš vědět, co se děje za zavřenými dveřmi"
 diplomacy_foreign_special.1022.b: "Dovolit to, ale tajně poslouchat..."
 diplomacy_foreign_special.1022.b.duel.success: "Zjistíš, co spolu dělají"
 diplomacy_foreign_special.1022.b.duel.failure: "Odhalí tě"
 diplomacy_foreign_special.1022.c: "„Tohle mi nepřipadá vhodné.“"
 diplomacy_foreign_special.1023.t: "$diplomacy_foreign_special.1017.t$: Bezdůvodné podezření"
 diplomacy_foreign_special.1023.desc: "Po celou dobu soukromého setkání [foreign_guest.GetTitledFirstName] a [interesting_relation.GetFirstName] zůstávám ve skryté chodbě. Zdá se, že mé obavy byly naprosto bezdůvodné. Žádné nabídky, žádné pletichy, žádné svádění."
 diplomacy_foreign_special.1023.a: "To se mi ulevilo!"
 diplomacy_foreign_special.1024.t: "$diplomacy_foreign_special.1017.t$: Příjemně strávený čas"
 diplomacy_foreign_special.1024.desc: "V téhle skryté chodbě trčím už celé hodiny a poslouchám zdánlivě nekonečný rozhovor mezi [foreign_guest.GetTitledFirstName] a [interesting_relation.GetFirstName]. Na jejich slovech není nic podezřelého, snad jen nezvykle silná vzájemná náklonnost na dva lidi, kteří se právě poznali."
 diplomacy_foreign_special.1024.a: "Na tom není nic špatného."
 diplomacy_foreign_special.1024.b: "Tohle skončí. Hned teď!"
 diplomacy_foreign_special.1025.t: "$diplomacy_foreign_special.1017.t$: Had na prsou"
 diplomacy_foreign_special.1025.desc: "Ze svého úkrytu ve skryté chodbě slyším zrádná slova [foreign_guest.GetTitledFirstName] naprosto zřetelně. [foreign_guest.GetFirstNameNoTooltip] se snaží poštvat [interesting_relation.GetFirstName] proti mně a zdá se, že to zabírá."
 diplomacy_foreign_special.1025.a: "Pche! Ať si [foreign_guest.GetFirstNameNoTooltip] myslí, že má nějakou šanci."
 diplomacy_foreign_special.1025.b: "Zrádci! Oba dva!"
 diplomacy_foreign_special.1026.t: "$diplomacy_foreign_special.1017.t$: Klam a touha"
 diplomacy_foreign_special.1026.desc: "Když [foreign_guest.GetTitledFirstName] pronese nestoudný návrh, nevím, jestli mě víc rozčiluje naprostý nedostatek studu, nebo ohromuje ta drzost. Svádět [interesting_relation.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('interesting_relation'))], přímo pod mou střechou! Opřu se o chladnou zeď skryté chodby a snažím se zkrotit bouři emocí."
 diplomacy_foreign_special.1026.a.tt: "Dozvíš se o jejich [Concept('secret','tajemství')|E]"
 diplomacy_foreign_special.1026.a: "Ať si užijí. Co je mi do toho."
 diplomacy_foreign_special.1026.b: "Dej ty špinavé ruce pryč od [interesting_relation.GetFirstNameNoTooltip], ty [foreign_guest.Custom2('InsultNoun', ROOT.Char)]!"
 diplomacy_foreign_special.1026.c: "Najde se v té posteli místo pro tři?"
 diplomacy_foreign_special.1026.c.success: "Všichni tři strávíme noc společně"
 diplomacy_foreign_special.1026.c.failure: "Oba jsou naprosto zděšení"
 diplomacy_foreign_special.1027.t: "$diplomacy_foreign_special.1017.t$: Krysa ve své díře"
 diplomacy_foreign_special.1027.desc: "Tiše jako stín se plížím skrytými chodbami až ke komnatám [foreign_guest.GetTitledFirstName]. Tam se přikrčím a připravím se na dlouhý večer.\n\nNáhle mě zničehonic sevře ruka za rameno a celé tělo mi strne hrůzou. „Takhle zacházíš se svými hosty, [ROOT.GetCharacter.GetTitledFirstName]?“"
 diplomacy_foreign_special.1027.a: "Já... moc se omlouvám!"
 diplomacy_foreign_special.1028.t: "$diplomacy_foreign_special.1017.t$: Okvětní lístky a trny"
 diplomacy_foreign_special.1028.desc: "Při procházce zahradami se s [foreign_guest.GetTitledFirstName] zastavíme, abychom se pokochali výhledem. „Ty proporce, ty barvy... Jen máloco, co jsem kdy spatřil[Select_CString(foreign_guest.IsFemale,'a','')], se tomu vyrovná krásou, [ROOT.GetCharacter.GetTitledFirstNameNoTooltip],“ pronese [foreign_guest.GetFirstNameNoTooltip] a ukáže na scenérii před námi.\n\nMěl[Select_CString(ROOT.Char.IsFemale,'a bych',' bych')] bych na oplátku říct něco milého. Třeba něco o..."
 diplomacy_foreign_special.1028.compassionate: "Vřelosti a laskavosti."
 diplomacy_foreign_special.1028.bold: "Neochvějné odvaze."
 diplomacy_foreign_special.1028.honorable: "Věrnosti a smyslu pro čest."
 diplomacy_foreign_special.1028.greed: "Nesmírné ctižádosti."
 diplomacy_foreign_special.1028.rational: "Jasném úsudku."
 diplomacy_foreign_special.1028.zealous: "Neochvějné víře."
 diplomacy_foreign_special.1028.energetic: "Energii a spontánnosti."
 diplomacy_foreign_special.1028.forgiving: "Odpouštějící povaze."
 diplomacy_foreign_special.1028.beautiful: "Vznešeném půvabu."
 diplomacy_foreign_special.1028.strong: "Síle paží."
 diplomacy_foreign_special.1028.extroverted: "Umění jednat s lidmi."
 diplomacy_foreign_special.1028.dominant: "Sebejistém vystupování."
 diplomacy_foreign_special.1028.good: "Má poklona je přijata s nadšením"
 diplomacy_foreign_special.1028.neutral: "Má poklona se mine účinkem"
 diplomacy_foreign_special.1028.bad: "Má poklona vyzní jako urážka"
 diplomacy_foreign_special.1028.compliment.tt: "To, jak dobře [foreign_guest.GetTitledFirstName] přijme tvou poklonu, závisí především na tom, jak dobře ji vystihuje, ale také na názoru, který na tebe má, a na tvé [Concept('diplomacy','diplomacii')|E]."
 diplomacy_foreign_special.1029.good.message: "[foreign_guest.GetTitledFirstName] má poklona polichotila!"
 diplomacy_foreign_special.1029.neutral.message: "[foreign_guest.GetTitledFirstName] si mé poklony sotva všimne."
 diplomacy_foreign_special.1029.bad.message: "[foreign_guest.GetTitledFirstName] se mou poklonou cítí spíš [Select_CString(foreign_guest.IsFemale,'uražená','uražený')]..."
 diplomacy_foreign_special.1030.t: "$diplomacy_foreign_special.1017.t$: Trvalé pouto"
 diplomacy_foreign_special.1030.desc: "Po návštěvě, kterou lze označit jedině za mimořádně příjemnou, se [foreign_guest.GetTitledFirstName] i celý doprovod chystají odjet do [foreign_guest_realm.GetNameNoTierNoTooltip].\n\nNež [foreign_guest.GetTitledFirstNameNoTooltip] nastoupí do kočáru, [ROOT.GetCharacter.Custom('GestureOfFriendship')] a vyjádří "
 diplomacy_foreign_special.1030.bad_guest.desc: "Prohnaný host [foreign_guest.GetTitledFirstName] i celý doprovod se chystají odjet do [foreign_guest_realm.GetNameNoTierNoTooltip].\n\nNež [foreign_guest.GetTitledFirstNameNoTooltip] nastoupí do kočáru, [ROOT.GetCharacter.Custom('GestureOfFriendship')] a vyjádří "
 diplomacy_foreign_special.1030.spouse.desc: "vděk mně i [helper_spouse.GetFirstName], o které[Select_CString(helper_spouse.IsFemale,' mluví jako o „nesmírně [helper_spouse.Custom('ComplimentAdjective')]“','m mluví jako o „nesmírně [helper_spouse.Custom('ComplimentAdjective')]“')] [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('helper_spouse'))]. Slíbím, že pochvalu vyřídím."
 diplomacy_foreign_special.1030.no_spouse.desc: "vděk. Ujistím [foreign_guest.GetFirstNameNoTooltip], že další návštěva bude vždy vítána."
 diplomacy_foreign_special.1030.a_bad_guest: "[foreign_guest.GetFirstNameNoTooltip] si myslí, že mě [Select_CString(foreign_guest.IsFemale,'převezla','převezl')], ale já vím, co se stalo."
 diplomacy_foreign_special.1030.a_extroverted: "Snad nás [foreign_guest.GetFirstNameNoTooltip] brzy znovu navštíví!"
 diplomacy_foreign_special.1030.a_introverted: "Konečně trochu klidu a ticha."
 diplomacy_foreign_special.1030.a: "Ať je tvá cesta rychlá a bezpečná!"
 diplomacy_foreign_special.1031.t: "$diplomacy_foreign_special.1017.t$: Předčasný odjezd"
 diplomacy_foreign_special.1031.desc: "Slunce sotva vyšlo, když zahlédnu jednoho ze služebníků [foreign_guest.GetTitledFirstName], jak nese velkou truhlu. Následuji [Select_CString(dummy_servant_gender.IsFemale,'služebnici','služebníka')] na nádvoří, kde najdu svého hosta, jak dohlíží na nakládání kočárů.\n\n[foreign_guest.GetFirstName] se při mém pozdravu lekne a začne cosi neurčitě vykládat o dopise a naléhavých záležitostech. Rozpačitě popřeji bezpečnou cestu a rychle se vrátím do svých soukromých komnat."
 diplomacy_foreign_special.1031.a: "Takhle jsem si to tedy nepředstavoval[Select_CString(ROOT.Char.IsFemale,'a','')]..."
 diplomacy_foreign.0100.opening: "[other_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 diplomacy_foreign.0100.desc: "Myslím, že by našim panstvím prospělo setkání našich dědiců, [main_heir.GetTitledFirstName] a [other_heir.GetTitledFirstName]. Pokud si už teď vybudují pevný a zdravý vztah, jistě tím přispějí k budoucí stabilitě našich zemí."
 diplomacy_foreign.1100.a: "To je znamenitý nápad!"
 diplomacy_foreign.1100.b: "Možná bychom se místo toho měli lépe poznat my dva."
 diplomacy_foreign.1100.t: "Rodící se přátelství"
 diplomacy_foreign.1101.desc: "Dohodnuté setkání [other_heir.GetFirstName] a [main_heir.GetFirstName] je dokonalou příležitostí položit základy dlouhodobého vztahu mezi mým panstvím a zeměmi, jimž vládne [other_ruler.GetTitledFirstName].\n\nSetkání musím naplánovat opravdu pečlivě."
 diplomacy_foreign.1101.a: "[scoped_capital.GetNameNoTooltip] bude místem, kam přijede [other_heir.GetFirstNameNoTooltip]."
 diplomacy_foreign.1101.court_visit.very_well: "Návštěva dvora probíhá #P velmi dobře#!"
 diplomacy_foreign.1101.court_visit.poorly: "Návštěva dvora probíhá #N špatně#!"
 diplomacy_foreign.1101.court_visit.well: "Návštěva dvora probíhá #P dobře#!"
 diplomacy_foreign.1101.a.tooltip: "Jako hostitel budeš moci setkání ovlivnit"
 diplomacy_foreign.1101.b: "[main_heir.GetTitledFirstNameNoTooltip] navštíví dvůr, kde vládne [other_ruler.GetTitledFirstNameNoTooltip]."
 diplomacy_foreign.1101.b.tooltip: "Setkání #N nebudeš#! moci ovlivnit"
 diplomacy_foreign.1102.desc: "[other_heir.GetTitledFirstName] se dostane veškeré okázalosti a poct náležejících tak vznešenému hostu. [scoped_capital.GetNameNoTooltip] se na několik týdnů stane místem pobytu [other_heir.GetFirstNameNoTooltip] a během této doby se [other_heir.GetFirstNameNoTooltip] s [main_heir.GetFirstName] lépe poznají."
 diplomacy_foreign.1102.a: "Pomůžu [main_heir.GetFirstNameNoTooltip], jak jen budu moci."
 diplomacy_foreign.1102.a.duel_success: "Má pohostinnost na [other_heir.GetTitledFirstNameNoTooltip] udělá dojem"
 tooltip.diplomacy_foreign.1102.a.duel_success: "Má pohostinnost na [other_heir.GetTitledFirstNameNoTooltip] udělala dojem"
 diplomacy_foreign.1102.a.duel_failure: "Má přítomnost naruší setkání mladých dědiců"
 tooltip.diplomacy_foreign.1102.a.duel_failure: "Má přítomnost narušila setkání mladých dědiců"
 diplomacy_foreign.1102.b: "Zahrnu [other_heir.GetFirstNameNoTooltip] okázalými dary!"
 diplomacy_foreign.1102.c: "Věřím, že [main_heir.GetFirstNameNoTooltip] si poradí bez mé pomoci."
 diplomacy_foreign.1102.c.tooltip.high: "[main_heir.GetTitledFirstName] si povede #P dobře#!"
 diplomacy_foreign.1102.c.tooltip.medium: "[main_heir.GetTitledFirstName] si povede #P obstojně#!"
 diplomacy_foreign.1102.c.tooltip.low: "[main_heir.GetTitledFirstName] si povede #N špatně#!"
 diplomacy_foreign.1103.start.desc: "Konečně nastal čas, aby se [other_heir.GetTitledFirstName] vrátil[Select_CString(other_heir.IsFemale,'a domů',' domů')]."
 diplomacy_foreign.1103.culture_conversion.desc: "Zdá se, že si [other_heir.GetFirstNameNoTooltip] během zdejšího pobytu [Select_CString(other_heir.IsFemale,'oblíbila naši kulturu a osvojila','oblíbil naši kulturu a osvojil')] několik zvyků mého dvora."
 diplomacy_foreign.1103.faith_conversion.desc: "S radostí se dozvídám, že se [other_heir.GetFirstNameNoTooltip] během zdejšího pobytu [Select_CString(other_heir.IsFemale,'rozhodla přijmout','rozhodl přijmout')] [main_heir.GetFaith.GetName] a opustit dosavadní víru."
 diplomacy_foreign.1103.present.desc: "Před odjezdem nás [other_heir.GetFirstNameNoTooltip] poctí nádherným darem jménem [other_ruler.GetTitledFirstName]."
 diplomacy_foreign.1103.prestige.desc: "Naše pohostinnost na [other_heir.GetFirstNameNoTooltip] zapůsobila natolik, že [Select_CString(other_heir.IsFemale,'slíbila','slíbil')] šířit pověst o věhlasu mého dvora široko daleko."
 diplomacy_foreign.1103.empty.desc: ""
 diplomacy_foreign.1103.friendship.desc: "\n\nVztah mezi [other_heir.GetFirstNameNoTooltip] a [main_heir.GetFirstName] dopadl ještě lépe, než jsme čekali: stali se z nich nerozluční přátelé."
 diplomacy_foreign.1103.love.desc: "\n\nVztah mezi [other_heir.GetFirstNameNoTooltip] a [main_heir.GetFirstName] dopadl ještě lépe, než jsme čekali: je zřejmé, že se do sebe zamilovali."
 diplomacy_foreign.1103.rivalry.desc: "\n\nBohužel se věci nevyvíjely podle plánu: [other_heir.GetFirstNameNoTooltip] a [main_heir.GetFirstName] se prostě nemohou vystát."
 diplomacy_foreign.1103.opinion_gain.desc: "\n\nVztah mezi [other_heir.GetFirstNameNoTooltip] a [main_heir.GetFirstName] se vyvíjel přesně tak dobře, jak jsme s [other_ruler.GetTitledFirstName] doufali. Snad z toho časem vznikne pevné přátelství."
 diplomacy_foreign.1103.opinion_loss.desc: "\n\nBohužel se věci nevyvíjely podle plánu: zdá se, že [other_heir.GetFirstNameNoTooltip] a [main_heir.GetFirstName] toho nakonec mnoho společného nemají..."
 diplomacy_foreign.1103.tainted_exp.desc: "\n\nPřinejmenším mi tato zkušenost pomohla prohloubit porozumění politice."
 diplomacy_foreign.1103.good_exp.desc: "\n\nNavíc se tato návštěva ukázala jako skvělá příležitost zdokonalit mé diplomatické schopnosti."
 diplomacy_foreign.1103.no_exp.desc: "\n\nNa celé téhle záležitosti mě nejvíc rozčiluje, že mi téměř nic nepřinesla."
 tooltip.diplomacy_foreign.1103.a.culture_conversion_success: "Přijetí kultury"
 tooltip.diplomacy_foreign.1103.a.faith_conversion_success: "Změna víry"
 diplomacy_foreign.1103.a: "Je třeba kout železo, dokud je žhavé!"
 diplomacy_foreign.1103.b: "Někdy bychom to měli zopakovat..."
 diplomacy_foreign.1104.start.desc: "[main_heir.GetFirstName] se konečně [Select_CString(main_heir.IsFemale,'vrátila','vrátil')] z návštěvy dvora [other_ruler.GetTitledFirstName]."
 diplomacy_foreign.1104.culture_conversion.desc: "\n\nBěhem krátkého pobytu si [main_heir.GetFirstNameNoTooltip] podle všeho [Select_CString(main_heir.IsFemale,'velmi oblíbila','velmi oblíbil')] zvyky svých hostitelů."
 diplomacy_foreign.1104.faith_conversion.desc: "\n\nZdá se, že během návštěvy [main_heir.GetFirstNameNoTooltip] [Select_CString(main_heir.IsFemale,'našla','našel')] nový smysl ve víře svých hostitelů. [other_heir.GetFaith.HighGodName] je nyní středem [Select_CString(main_heir.IsFemale,'její','jeho')] náboženského života."
 diplomacy_foreign.1104.present.desc: "\n\nVzhledem ke vznešenému postavení [main_heir.GetFirstNameNoTooltip] se během pobytu [Select_CString(main_heir.IsFemale,'dočkala záplavy přepychových darů','dočkal záplavy přepychových darů')]."
 diplomacy_foreign.1104.prestige.desc: "\n\nVzhledem ke vznešenému postavení se [main_heir.GetFirstNameNoTooltip] dostalo mimořádně vlídného zacházení. Během návštěvy byla navíc naše rodina při mnoha příležitostech veřejně vychvalována."
 diplomacy_foreign.1105.hostdead.desc: "S nešťastným úmrtím [other_ruler.GetTitledFirstName] končí i náš plán seznámit naše dědice a zajistit přátelské vztahy mezi našimi panstvími."
 diplomacy_foreign.1105.guestdead.desc: "Náš plán s [other_ruler.GetTitledFirstName] bohužel překazilo náhlé úmrtí [other_heir.GetFirstName]."
 diplomacy_foreign.1105.fallback.desc: "Zdá se, že Osud se spikl, aby zabránil setkání [main_heir.GetFirstName] a [other_heir.GetFirstName]. Snad se v budoucnu naskytne nová příležitost."
 diplomacy_foreign.1105.a: "Jak tragické..."
 diplomacy_foreign.1150.t: "Urovnání hranic"
 diplomacy_foreign.1150.desc: "Už nějakou dobu přemýšlím nad rozdíly mezi historickými a současnými hranicemi mého panství a zemí, jimž vládne [neighbor.GetTitledFirstName].\n\n[neighbor.GetFirstNameNoTooltip|U] ovládá [county.GetName], území, které by mělo právem náležet k [ruler.GetPrimaryTitle.GetNameNoTierNoTooltip], zatímco já ovládám [neighbor_county.GetName], na které si [neighbor.GetTitledFirstNameNoTooltip] činí nárok."
 diplomacy_foreign.1150.a: "Řešení je prosté..."
 diplomacy_foreign.1160.a.success: "Přesvědčím [neighbor.GetTitledFirstName]"
 diplomacy_foreign.1160.a.failure: "[neighbor.GetTitledFirstName] můj návrh odmítne"
 diplomacy_foreign.1150.b: "Jistě se dokážeme nějak dohodnout."
 diplomacy_foreign.1150.c: "Tenhle spor vyřeší meče, ne slova."
 diplomacy_foreign.1151.desc: "Díky svému diplomatickému důvtipu se mi podařilo přesvědčit [neighbor.GetTitledFirstName], aby se vzdal[Select_CString(neighbor.IsFemale,'a','')] [county.GetNameNoTier] výměnou za [neighbor_county.GetNameNoTier]. Snad tím zabráníme zbytečnému krveprolití mezi našimi panstvími v budoucnu."
 diplomacy_foreign.1151.a: "Nezbývá než doufat."
 diplomacy_foreign.1152.desc: "Bohužel se mi nepodařilo přesvědčit [neighbor.GetTitledFirstName], aby se vzdal[Select_CString(neighbor.IsFemale,'a','')] [county.GetNameNoTier] výměnou za [neighbor_county.GetNameNoTier]. Mohu jen doufat, že [Select_CString(neighbor.IsFemale,'její','jeho')] tvrdohlavost nesvede naše panství na temnou cestu."
 diplomacy_foreign.1152.a: "Konflikt může být nevyhnutelný."
 diplomacy_foreign.1153.desc: "[ruler.GetTitledFirstName] mi dnes předložil[Select_CString(ruler.IsFemale,'a','')] zvláštní návrh.\n\n[ruler.GetFirstNameNoTooltip|U] je [Select_CString(ruler.IsFemale,'připravena','připraven')] vzdát se vlády nad [neighbor_county.GetNameNoTier], územím, na které má mé panství dávné nároky, výměnou za [county.GetName], kde údajně kdysi vládli předkové [ruler.GetFirstNameNoTooltip]."
 diplomacy_foreign.1153.a: "Spravedlivý návrh."
 diplomacy_foreign.1153.b: "Toho, co je mé, se nevzdám!"
 diplomacy_foreign.1200.t: "Choulostivé záležitosti"
 diplomacy_foreign.1200.spouse.desc: "„Zase pracuješ dlouho do noci, [ROOT.Char.Custom('FormOfAddressForLiege')]?“\n\nPřes rameno mi nakoukne [diplomacy_friend.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('diplomacy_friend'))], a pohledem přejede listiny, které se kupí na stole. „S podobnými záležitostmi mám nějaké zkušenosti,“ pronese [diplomacy_friend.GetFirstNameNoTooltip] váhavě. „Možná bych ti mohl[Select_CString(diplomacy_friend.IsFemale,'a pomoci',' pomoci')] získat důvěru [neighbor_ruler.GetTitledFirstName]?“"
 diplomacy_foreign.1200.relative.desc: "„Doslechl[Select_CString(diplomacy_friend.IsFemale,'a jsem',' jsem')] se, že se snažíš zlepšit vztahy panství se sousedy, [diplomacy_friend.Custom2('RelationToMe', ROOT.GetCharacter)].“\n\n[diplomacy_friend.GetFirstName] ke mně přistoupí s přátelským výrazem. „O tyhle záležitosti se zajímám už dlouho a rád[Select_CString(diplomacy_friend.IsFemale,'a bych',' bych')] ti pomohl[Select_CString(diplomacy_friend.IsFemale,'a','')] získat důvěru [neighbor_ruler.GetTitledFirstName]. Koneckonců jsme rodina.“"
 diplomacy_foreign.1200.fallback.desc: "[diplomacy_friend.GetTitledFirstName] mi v posledních dnech skutečně pomáhá při snaze upevnit vztahy našeho panství se sousedy. Teď mi [diplomacy_friend.GetFirstNameNoTooltip] znovu [Select_CString(diplomacy_friend.IsFemale,'nabídla','nabídl')] pomoc se získáním důvěry [neighbor_ruler.GetTitledFirstName].\n\nV dnešní době je tak těžké najít někoho, na koho se člověk může opravdu spolehnout..."
 diplomacy_foreign.1200.a.a: "Nic by mě nepotěšilo víc."
 diplomacy_foreign.1200.a.b: "Je mi ctí, [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('diplomacy_friend'))]."
 diplomacy_foreign.1200.a.c: "Tvou laskavost si budu pamatovat."
 diplomacy_foreign.1200.b: "Myslím, že [neighbor_ruler.GetTitledFirstNameNoTooltip] zvládnu sám."
 diplomacy_foreign.1200.b.success: "Mé diplomatické úsilí přinese ovoce"
 diplomacy_foreign.1200.b.failure: "Na [neighbor_ruler.GetTitledFirstName] nedokážu udělat dojem"
 diplomacy_foreign.1200.c: "[neighbor_ruler.GetTitledFirstNameNoTooltip] za tu námahu nestojí..."
