l_polish:
 diplomacy_lifestyle_rank_up_indication: "Možná získám [Concept('perk','talent')|E] [Concept('diplomacy_lifestyle','diplomatického životního stylu')|E]"
 diplomacy_generic.0012.t: "Sociální manipulace"
 diplomacy_generic.0012.start.desc: "Když se to stalo poprvé, sotva jsem tomu věnoval[Select_CString(ROOT.Char.IsFemale,'a pozornost',' pozornost')], ale [disobedient_subject.Custom2('MyCharacterIntroduction', ROOT.Char)] si dovoluje čím dál víc. [Select_CString(disobedient_subject.IsFemale,'Její výpady','Jeho výpady')] už nezůstávají bez povšimnutí"
 diplomacy_generic.0012.council.desc: "u jednacího stolu."
 diplomacy_generic.0012.vassal.desc: "mezi mými vazaly."
 diplomacy_generic.0012.end.desc: "\n\n[disobedient_subject.GetFirstNameNoTooltip|U] zkouší, kam až může zajít. Ostatní se jistě přidají — pokud [disobedient_subject.GetFirstNameNoTooltip] neokusí vlastní medicínu..."
 diplomacy_generic.0012.a: "Budu [disobedient_subject.GetFirstNameNoTooltip] ignorovat a přivlastním si předkládané nápady."
 make_invisible_option.tt: "Tipuješ, že [disobedient_subject.GetFirstName] je [Select_CString(disobedient_subject.IsFemale,'neprůbojná, apatická nebo bez ambicí','neprůbojný, apatický nebo bez ambicí')]"
 diplomacy_generic.0012.b: "Stačí zesměšnit „[disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)]“ a [disobedient_subject.GetFirstNameNoTooltip] zmlkne."
 ridicule_option.tt: "Tipuješ, že [disobedient_subject.GetFirstName] [Select_CString(disobedient_subject.IsFemale,'si není jistá sama sebou a záleží jí na mínění ostatních','si není jistý sám sebou a záleží mu na mínění ostatních')]"
 diplomacy_generic.0012.c: "Stačí „zapomenout“ na pozvání a [disobedient_subject.GetFirstNameNoTooltip] zůstane mimo dění."
 withhold_information_option.tt: "Tipuješ, že [disobedient_subject.GetFirstName] má slabou vůli nebo se drží stranou"
 diplomacy_generic.0012.d: "[disobedient_subject.GetFirstNameNoTooltip|U] dostane úkoly, které nelze splnit."
 impossible_task_option.tt: "Tipuješ, že [disobedient_subject.GetFirstName] udělá vše, co je v jeho silách, aby úkol splnil"
 diplomacy_generic.0012.e: "Veškeré problémy půjdou na vrub [disobedient_subject.GetFirstNameNoTooltip]."
 shame_option.tt: "Tipuješ, že [disobedient_subject.GetFirstName] [Select_CString(disobedient_subject.IsFemale,'je svědomitá, nebo alespoň chce, aby o ní ostatní smýšleli dobře','je svědomitý, nebo alespoň chce, aby o něm ostatní smýšleli dobře')]"
 diplomacy_generic.0012.f: "Pár poznámek na téma „[disobedient_subject.Custom('ObjectifiedFeature')]“ vyvede [disobedient_subject.GetFirstNameNoTooltip] z míry."
 objectification_option.tt: "Tipuješ, že [disobedient_subject.GetFirstName] [Select_CString(disobedient_subject.IsFemale,'se kvůli svému vzhledu často stávala terčem objektifikace','se kvůli svému vzhledu často stával terčem objektifikace')]"
 diplomacy_generic.0012.g: "„Nenápadná“ výhrůžka násilím tohle ukončí."
 threat_option.tt: "Tipuješ, že [disobedient_subject.GetFirstName] [Select_CString(disobedient_subject.IsFemale,'je zbabělá nebo chce zachovat klid','je zbabělý nebo chce zachovat klid')]"
 diplomacy_generic.0012.h: "„Jak se opovažuješ zpochybňovat svého #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!!?“"
 diplomacy_generic.0012.tt: "Není to zrovna diplomatické, ale účinné to bude..."
 diplomacy_generic.0012.good_outcome.desc: "Zmanipuluješ [disobedient_subject.GetTitledFirstNameNoTooltip]"
 diplomacy_generic.0012.bad_outcome.desc: "[disobedient_subject.GetTitledFirstNameNoTooltip] se oklamat nenechá"
 diplomacy_generic.0012.terrible_outcome.desc: "[disobedient_subject.GetTitledFirstNameNoTooltip] tě přechytračí"
 diplomacy_generic.0012.failure.desc: "Nepodařilo se ti zmanipulovat [disobedient_subject.GetTitledFirstName]"
 diplomacy_generic.0013.t: "Loutka na provázku"
 diplomacy_generic.0013.make_invisible.desc: "Zdá se, že [suppressor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))], už o mé názory nestojí. Kdykoli promluvím, [suppressor.GetFirstNameNoTooltip] mě přeruší nebo obrátí pozornost jinam. Občas mě však očividně poslouchá, protože pak opakuje mé nápady a vydává je za vlastní..."
 diplomacy_generic.0013.ridicule.desc: "Co mám udělat, aby mě [suppressor.GetTitledFirstName] [Select_CString(suppressor.IsFemale,'brala vážně','bral vážně')]? Kdykoli promluvím, přeruší mě, aby zesměšnil[Select_CString(suppressor.IsFemale,'a mé názory',' mé názory')] nebo mé „[disobedient_subject.Custom2('PointOfRidicule', SCOPE.sC('suppressor'))]“."
 diplomacy_generic.0013.withhold_information.desc: "V poslední době jako by všichni věděli všechno kromě mě! Při poradách musím neustále žádat [suppressor.GetTitledFirstName] o vysvětlení nebo předkládám návrhy založené na zastaralých informacích, takže působím směšně. Obávám se, že [suppressor.GetFirstNameNoTooltip] přede mnou informace záměrně zatajuje."
 diplomacy_generic.0013.impossible_task.desc: "[suppressor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))], mi pořád zadává úkoly, které se v daném čase nedají splnit! Když se snažím odvést důkladnou práci, jsem prý [Select_CString(ROOT.Char.IsFemale,'líná','líný')], a když spěchám, [suppressor.GetFirstNameNoTooltip] mě považuje za [Select_CString(ROOT.Char.IsFemale,'nedbalou','nedbalého')]."
 diplomacy_generic.0013.shame.desc: "Kdykoli nastane problém, [suppressor.GetTitledFirstName] jako by automaticky vinil[Select_CString(suppressor.IsFemale,'a mě',' mě')]. Když ale na nějaký problém upozorním já, obviní mě, že se soustředím na nesprávné věci!"
 diplomacy_generic.0013.objectification.desc: "Kdykoli mě [suppressor.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suppressor'))], svolá na poradu, sevře se mi žaludek. Za posledních několik týdnů už padla nejedna poznámka na téma „[disobedient_subject.Custom('ObjectifiedFeature')]“ a když promluvím, [suppressor.GetFirstNameNoTooltip] mě spíš okukuje, než poslouchá. Proč [suppressor.GetTitledFirstName] zajímá mé tělo víc než to, co dělám a říkám?"
 diplomacy_generic.0013.threat.desc: "V poslední době si všímám zvláštního výrazu ve tváři [suppressor.GetTitledFirstName] pokaždé, když promluvím — směsi podráždění a hněvu. Až do dneška jsem ale nevěděl[Select_CString(ROOT.Char.IsFemale,'a jistě',' jistě')], že je něco skutečně v nepořádku. Když jsem při poradě vyjádřil[Select_CString(ROOT.Char.IsFemale,'a nesouhlas',' nesouhlas')], [suppressor.GetFirstNameNoTooltip] mi [Select_CString(suppressor.IsFemale,'vyhrožovala','vyhrožoval')], že mě nechá zbičovat!"
 diplomacy_generic.0013.a: "Tuhle hru mohou hrát dva."
 diplomacy_generic.0013.a.success.tt: "Úspěšně zmanipuluješ [suppressor.GetTitledFirstNameNoTooltip]"
 diplomacy_generic.0013.a.failure.tt: "[suppressor.GetTitledFirstNameNoTooltip] zmanipuluje tebe"
 diplomacy_generic.0013.b: "Možná si takové zacházení zasloužím..."
 diplomacy_generic.0014.t: "$diplomacy_generic.0012.t$: Mistr umlčování"
 diplomacy_generic.0014.make_invisible.desc: "Kdykoli [disobedient_subject.GetTitledFirstName] zvýší hlas a pokusí se promluvit, zívnu, obrátím pozornost jinam nebo [disobedient_subject.GetFirstNameNoTooltip] rovnou přeruším. Když ostatní začnou následovat mého příkladu, [disobedient_subject.GetTitledFirstNameNoTooltip] postupně ztrácí jistotu."
 diplomacy_generic.0014.ridicule.desc: "Zdá se, že mé neustálé jízlivé poznámky na téma „[disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)]“ se [disobedient_subject.GetTitledFirstName] opravdu dostaly pod kůži! Když ostatní začnou následovat mého příkladu, [disobedient_subject.GetTitledFirstNameNoTooltip] postupně ztrácí jistotu."
 diplomacy_generic.0014.withhold_information.desc: "Od chvíle, kdy před [disobedient_subject.GetTitledFirstName] zatajuji informace, se [disobedient_subject.GetFirstNameNoTooltip] ztrapnil[Select_CString(disobedient_subject.IsFemale,'a už tolikrát, že to ani nedokážu spočítat',' už tolikrát, že to ani nedokážu spočítat')]. Odmítat beznadějně zastaralé návrhy je snazší než přechytračit psa."
 diplomacy_generic.0014.impossible_task.desc: "Když se [disobedient_subject.GetTitledFirstName] snaží své úkoly plnit důkladně, veřejně [Select_CString(disobedient_subject.IsFemale,'ji pokárám','ho pokárám')], a když spěchá, aby vše stihl[Select_CString(disobedient_subject.IsFemale,'a včas',' včas')], vystavím nedbalou práci všem na odiv. [disobedient_subject.GetFirstNameNoTooltip|U] se může přetrhnout, aby se mi zavděčil[Select_CString(disobedient_subject.IsFemale,'a','')], ale já její[Select_CString(disobedient_subject.IsFemale,' úsilí nikdy neocením','ho úsilí nikdy neocením')]."
 diplomacy_generic.0014.shame.desc: "Problém, na který [disobedient_subject.GetTitledFirstName] původně upozornil[Select_CString(disobedient_subject.IsFemale,'a','')], vrhal špatné světlo na mě, ale teď se karta obrátila. Kdykoli [disobedient_subject.GetFirstNameNoTooltip] otevře nepříjemné téma, obratně přenesu vinu zpět na [disobedient_subject.GetFirstNameNoTooltip] nebo celou věc podám tak, že už samotné upozornění působí malicherně."
 diplomacy_generic.0014.objectification.desc: "Obscénní vtipy, dlouhé pohledy, přerušování řeči kvůli „komplimentům“ na téma „[disobedient_subject.Custom('ObjectifiedFeature')]“. Kousek po kousku [disobedient_subject.GetTitledFirstName] lámu, až je [Select_CString(disobedient_subject.IsFemale,'napjatá a nejistá','napjatý a nejistý')]."
 diplomacy_generic.0014.threat.desc: "Někdy prostě stačí výhrůžka násilím."
 diplomacy_generic.0014.end.desc: "Teď [disobedient_subject.GetFirstNameNoTooltip] mlčí a klopí oči."
 diplomacy_generic.0014.a.cruel: "Příště si [disobedient_subject.GetFirstNameNoTooltip] dobře rozmyslí, jestli mě znovu vyzve!"
 diplomacy_generic.0014.a.compassionate: "Možná to bylo kruté, ale muselo se to udělat."
 diplomacy_generic.0015.t: "$diplomacy_generic.0012.t$: Z loutkáře loutkou"
 diplomacy_generic.0015.make_invisible.desc: "Když [disobedient_subject.GetTitledFirstName] zvýší hlas, aby promluvil[Select_CString(disobedient_subject.IsFemale,'a','')], zívnu a obrátím pozornost k listinám. Čekám, že ostatní udělají totéž, ale místo toho se zapojí do rozhovoru. Když nakonec spolknu svou pýchu a přidám se, [disobedient_subject.GetFirstName] už má navrch a má slova brzy zapadnou."
 diplomacy_generic.0015.ridicule.desc: "Ukazuje se, že [disobedient_subject.GetTitledFirstName] má mnohem ostřejší jazyk, než jsem čekal[Select_CString(ROOT.Char.IsFemale,'a','')]. Jakmile utrousím poznámku na téma „[disobedient_subject.Custom2('PointOfRidicule', ROOT.Char)]“, [disobedient_subject.GetFirstNameNoTooltip] okamžitě obrátí situaci proti mně a já vypadám malicherně, protože na skutečný problém odpovídám jízlivostí."
 diplomacy_generic.0015.impossible_task.desc: "K mému velkému překvapení se [disobedient_subject.GetTitledFirstName] podařilo získat na pomoc s úkolem jednoho z ostatních. Sotva jej stihli společně dokončit včas, takže bylo zřejmé, že jsem požadoval[Select_CString(ROOT.Char.IsFemale,'a příliš mnoho',' příliš mnoho')]. Nemohl[Select_CString(ROOT.Char.IsFemale,'a jsem si ani stěžovat',' jsem si ani stěžovat')] na provedení."
 diplomacy_generic.0015.shame.desc: "Svalit vinu na [disobedient_subject.GetTitledFirstName] je těžší, než jsem čekal[Select_CString(ROOT.Char.IsFemale,'a','')]. Ano, umím být přesvědčivý[Select_CString(ROOT.Char.IsFemale,'á','')], ale [disobedient_subject.GetFirstNameNoTooltip] je v téhle hře ještě schopnější. Jedinou větou rozmetá mé vysvětlení a já pak vypadám buď hloupě, nebo nedůvěryhodně. Nevím, co je horší."
 diplomacy_generic.0015.objectification.desc: "Myslel[Select_CString(ROOT.Char.IsFemale,'a','')], že mé oplzlé poznámky [disobedient_subject.GetTitledFirstName] umlčí, jenže odpověď je důstojná a zároveň přesně mířená. Ostatní teď považují [disobedient_subject.GetFirstNameNoTooltip] téměř za světce, zatímco já vedle toho působím malicherně a nemravně."
 diplomacy_generic.0015.threat.desc: "Myslel[Select_CString(ROOT.Char.IsFemale,'a','')], že mé výhrůžky [disobedient_subject.GetTitledFirstName] umlčí, jenže [disobedient_subject.GetFirstNameNoTooltip] je prostě ignoruje a pokračuje dál. Naprostý nedostatek strachu způsobí, že má slova působí spíš směšně než děsivě."
 diplomacy_generic.0015.withhold_information.desc: "Přestože pravidelně „zapomínám“ posílat [disobedient_subject.GetTitledFirstName] zprávy nebo zvát [disobedient_subject.GetFirstNameNoTooltip] na porady, [disobedient_subject.GetFirstNameNoTooltip] jako by vždycky přesně věděl[Select_CString(disobedient_subject.IsFemale,'a, co se děje',' , co se děje')]. Ve srovnání s tím teď působím zmateně a neschopně!"
 diplomacy_generic.0015.a: "Tentokrát vyhráváš, [disobedient_subject.GetFirstNameNoTooltip]."
