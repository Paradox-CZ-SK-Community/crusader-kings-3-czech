l_polish:
 diplomacy_majesty.0004.t: "Síla slov"
 diplomacy_majesty.0004.desc: "Oběma nám to neuniklo — nucené úsměvy a váznoucí rozhovory, po nichž následuje nepříjemné ticho. Mezi [compliment_receiver.Custom2('MyCharacterIntroduction', ROOT.Char)] a mnou zkrátka něco není v pořádku.\n\nMožná by naše setkání zpříjemnila dobře zvolená poklona? Příště by se hodilo pochválit..."
 diplomacy_majesty.0004.compassionate: "Empatii a laskavé srdce."
 diplomacy_majesty.0004.bold: "Neochvějnou odvahu."
 diplomacy_majesty.0004.honorable: "Věrnost a smysl pro čest."
 diplomacy_majesty.0004.greed: "Nesmírnou ctižádost."
 diplomacy_majesty.0004.rational: "Jasný úsudek."
 diplomacy_majesty.0004.zealous: "Neochvějnou víru, jejímž středem je [compliment_receiver.GetFaith.HighGodName]."
 diplomacy_majesty.0004.energetic: "Mladistvou energii."
 diplomacy_majesty.0004.forgiving: "Odpouštějící povahu."
 diplomacy_majesty.0004.beautiful: "Pohledný zevnějšek."
 diplomacy_majesty.0004.strong: "Sílu paží."
 diplomacy_majesty.0004.extroverted: "Bezkonkurenční umění jednat s lidmi."
 diplomacy_majesty.0004.dominant: "Sebejisté vystupování."
 diplomacy_majesty.0004.fallback: "...vlastně nic. Ještě by to mohlo vyznít jako urážka!"
 diplomacy_majesty.0004.compliment.tt: "To, jak [compliment_receiver.GetTitledFirstName] zareaguje, bude záviset na tom, jak dobře poklona vystihuje jeho povahu:"
 diplomacy_majesty.0004.success.tt: "Tvá poklona je přijata s nadšením"
 diplomacy_majesty.0004.neutral.tt: "Tvá poklona se mine účinkem"
 diplomacy_majesty.0004.failure.tt: "Tvá poklona vyzní jako urážka"
 diplomacy_majesty.0004.neutral_outcome.desc: "Poklona, kterou jsem [Select_CString(ROOT.Char.IsFemale,'složila','složil')], se minula účinkem."
 diplomacy_majesty.0005.t: "$diplomacy_majesty.0004.t$: Sladké jako med"
 diplomacy_majesty.0005.desc: "Na mou pečlivě připravenou poklonu [compliment_receiver.GetTitledFirstName] odpoví vděčným úsměvem a lehce se začervená. Rozhovor, který následuje, je tím nejpříjemnějším, jaký jsme spolu za mnoho měsíců vedli."
 diplomacy_majesty.0005.a: "Pár vlídných slov dokáže skutečné divy!"
 diplomacy_majesty.0006.t: "$diplomacy_majesty.0004.t$: Hořké jako pelyněk"
 diplomacy_majesty.0006.desc: "Má slova měla být laskavá, ale reakce [compliment_receiver.GetTitledFirstName] nenechává o mém neúspěchu nejmenších pochyb. [compliment_receiver.GetFirstNameNoTooltip] se zatváří tak pobouřeně, až se mi sevře žaludek."
 diplomacy_majesty.0006.a: "Jak jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být tak netaktní..."
 diplomacy_majesty.0016.t: "Spřízněné duše"
 diplomacy_majesty.0016.desc: "Všímám si, že [potential_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] a já se v mnohém shodujeme v názorech i jednání. Ne vždy vidíme věci stejně, ale v jádru si podle mě rozumíme.\n\nMohly by to být základy trvalého přátelství — nebo slabina, kterou lze využít..."
 diplomacy_majesty.0016.a: "Tohle bude začátek velkého přátelství!"
 diplomacy_majesty.0016.a.tt: "[Concept('scheme','Intrika')|E] bude mít zvýšenou [Concept('success_chance','šanci na úspěch')|E]"
 diplomacy_majesty.0016.b: "[potential_friend.GetFirstNameNoTooltip] bude brzy dělat přesně to, co chci..."
 diplomacy_majesty.0016.c: "Nepotřebuji přátele, mám nože!"
 diplomacy_majesty.1020.t: "Věrnost, nebo strach"
 diplomacy_majesty.1020.desc: "Jsem [ROOT.Char.GetTitleAsName] a [ROOT.Char.Custom('GetFollowerOrVassalPlural')] mi dluží věrnost. Mé slovo je zákon. Jakou cenu však má poslušnost bez skutečné oddanosti?\n\nV dobách krize může pomalá reakce nebo polovičaté úsilí skončit katastrofou. Mohu si takové riziko dovolit?"
 diplomacy_majesty.1020.a: "Získám si jejich neochvějnou oddanost."
 diplomacy_majesty.1020.b: "Jsou i důležitější [important_ruler.GetWomenMen], na které musím udělat dojem."
 diplomacy_majesty.1020.c: "Strach je mnohem účinnější nástroj."
 diplomacy_majesty.1020.d: "Proč by mě mělo zajímat, co si o mně ostatní myslí?"
 diplomacy_majesty.4030.t: "Bitva myšlenek"
 diplomacy_majesty.4030.desc: "Čím více se věnuji státnictví a diplomacii, tím častěji přemýšlím nad podobnostmi mezi životem u [ROOT.Char.Custom('GetCourt')] a válčením. Odhadnout protivníka... tahy a protitahy...\n\nKdyž si tyto úvahy nechám pro sebe, mohou se stát mou tajnou zbraní a pomoci mi prosadit vlastní vůli. Nebo se o ně mohu podělit s [event_target.GetTitledFirstName] a získat si tak přízeň."
 diplomacy_majesty.4030.a: "Tuto teorii musím dále rozvinout!"
 diplomacy_majesty.4030.a.success: "Má nová taktika funguje mimořádně dobře"
 diplomacy_majesty.4030.a.failure: "Nepodaří se mi vyvinout užitečnou taktiku"
 diplomacy_majesty.4030.b: "Spojenci jsou nezbytní ve válce i v míru."
 diplomacy_majesty.4030.c: "Už samotný tento způsob uvažování mi prospěje."
 diplomacy_majesty.4031.t: "$diplomacy_majesty.4030.t$: Vliv"
 diplomacy_majesty.4031.desc: "Po mnoha nocích strávených rozjímáním mám konečně pevnou strategii, jak v debatě prosadit svůj názor.\n\nZačnu z výhodné pozice tím, že se přikloním k oblíbenému a těžko napadnutelnému postoji. Z něj pak zaútočím na argumenty protivníka a poukážu na všechny jejich nedostatky.\n\nTak postupně odstraním všechna možná řešení problému... samozřejmě až na to, které vyhovuje mně."
 diplomacy_majesty.4031.a: "Touto technikou získám lidi na svou stranu."
 diplomacy_majesty.4032.t: "$diplomacy_majesty.4030.t$: Nepředvídatelné střety"
 diplomacy_majesty.4032.desc: "Mnoho nocí jsem [Select_CString(ROOT.Char.IsFemale,'strávila','strávil')] vymýšlením taktiky, jak směřovat rozhovory tam, kam potřebuji, a promýšlením všech možných reakcí na má slova.\n\nPřesto pokaždé, když se pokusím tyto strategie použít, vše dopadne jinak, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]. Zdá se, že žádný plán nepřežije střet s nepřítelem."
 diplomacy_majesty.4032.a: "Alespoň tento neúspěch nikoho nestál život."
 diplomacy_majesty.4033.t: "Zásobovací linie myšlenek"
 diplomacy_majesty.4033.desc: "Dnes za mnou přijde [thinker.GetTitledFirstName] se zajímavou myšlenkou. Debatu u dvora lze prý vnímat jako otevřenou bitvu. Různí účastníci sledují různé cíle a každý se snaží nasměrovat rozhovor ve svůj prospěch, ale zvítězit může jen jeden."
 diplomacy_majesty.4033.a: "[thinker.GetFirstNameNoTooltip|U] má na diplomacii opravdu fascinující názory!"
 diplomacy_majesty.4070.t: "Kouzlo jazyka"
 diplomacy_majesty.4070.desc: "Vládnout mnohokulturnímu [ROOT.Char.GetPrimaryTitle.GetName] přináší vlastní úskalí. Cizí [ROOT.Char.Custom('GetCourtierPlural')|l] se často cítí odcizeně, když u [ROOT.Char.Custom('GetCourt')] nemohou mluvit rodným jazykem, a to v nich probouzí zášť.\n\n[my_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] navrhuje, že bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] výrazně zlepšit vztahy s [my_vassal.GetCulture.GetName] [ROOT.Char.Custom('GetCourtierPlural')], kdybych se vedle svého jazyka [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')] také jejich."
 diplomacy_majesty.4070.a: "Je čas zabořit se do knih!"
 diplomacy_majesty.4070.b: "Najmu si učitele."
 diplomacy_majesty.4070.c: "Proč se namáhat? [ROOT.Char.GetCulture.GetNameNoTooltip] kultura je očividně nadřazená."
 diplomacy_majesty.4070.d: "Můj dvorní učitel mi jistě pomůže!"
 diplomacy_majesty.4070.success: "Naučím se mluvit jazykem [my_vassal.GetCulture.GetName] kultury"
 diplomacy_majesty.4070.failure: "Nepodaří se mi naučit nový jazyk"
 diplomacy_majesty.4070.failure.tt: "Můžeš se rozhodnout ve studiu pokračovat"
 diplomacy_majesty.4071.t: "$diplomacy_majesty.4070.t$: Osvojený jazyk"
 diplomacy_majesty.4071.desc: "Po mnoha dlouhých týdnech studia konečně dobře ovládám základy jazyka [my_vassal.GetCulture.GetName] kultury.\n\nDalším procvičováním se budu dál zlepšovat, ale už tato základní znalost zlepšila mé vztahy s [my_vassal.GetCulture.GetNameNoTooltip] [ROOT.Char.Custom('GetCourtierPlural')]."
 diplomacy_majesty.4071.a: "Dobře využitý čas."
 diplomacy_majesty.4071.b: "Tak fascinující kultura... Chci se dozvědět víc!"
 diplomacy_majesty.4070.b.custom: "Každý [ROOT.Char.Custom('GetCourtier')] z [Concept('close_family','nejbližší rodiny')|E] a každý přímý vazal, který je dítětem"
 diplomacy_majesty.4072.t: "$diplomacy_majesty.4070.t$: Nepochopitelné!"
 diplomacy_majesty.4072.desc: "Navzdory mnoha týdnům studia se mi stále nedaří pořádně pochopit jazyk [my_vassal.GetCulture.GetName] kultury. Několik slov už znám, ale gramatika, obraty... stále mi unikají. Těžko si představit, že je tohle k něčemu."
 diplomacy_majesty.4072.a: "Musím se snažit dál!"
 diplomacy_majesty.4072.b: "Svůj čas mohu využít lépe."
 diplomacy_majesty.4072.c: "$diplomacy_majesty.4070.b$"
 diplomacy_majesty.4073.t: "$diplomacy_majesty.4070.t$: Marné úsilí"
 diplomacy_majesty.4073.desc: "Ačkoli se mi to nechce přiznat, nemyslím si, že jazyk [my_vassal.GetCulture.GetName] kultury někdy skutečně ovládnu. Zkouším to znovu a znovu, ale bez jakéhokoli pokroku... Musím se s tím smířit."
 diplomacy_majesty.4073.a: "Vzdávám to."
 diplomacy_majesty.4090.t: "Znaky majestátu"
 diplomacy_majesty.4090.desc: "Jako svrchovaný vládce stojím nad svými poddanými a v panství mi není rovno. Nádherné šaty a šperky by všem nenápadně připomínaly, kdo tu vládne."
 diplomacy_majesty.4090.a: "Jedině ten nejlepší hermelín a samet!"
 diplomacy_majesty.4090.b: "Místní móda má svůj symbolický význam."
 diplomacy_majesty.4090.b.desc: "Hledám krejčího, který umí pracovat s místními materiály"
 diplomacy_majesty.4090.b.success: "Získám oděv, za který by se [me.GetTitleAsNameNoTooltip] [Select_CString(me.IsFemale,'nemusela','nemusel')] stydět"
 diplomacy_majesty.4090.b.success.tt: "Tvůj nádherný nový oděv je skutečně takový, za jaký by se [me.GetTitleAsNameNoTooltip] [Select_CString(me.IsFemale,'nemusela','nemusel')] stydět!"
 diplomacy_majesty.4090.b.failure: "Získám nudný a nevýrazný oděv"
 diplomacy_majesty.4090.b.failure.tt: "Tvůj nový oděv na nikoho neudělá dojem."
 diplomacy_majesty.4090.c: "K legitimizaci své vlády nepotřebuji žádné #EMP věci#!!"
 diplomacy_majesty.4090.c.zealous: "[ROOT.Char.GetFaith.HighGodName] od svých služebníků přepych nevyžaduje!"
 diplomacy_majesty.4090.d.lunatic.male: "Kalhoty nejsou nic než vězení pro nohy!"
 diplomacy_majesty.4090.d.lunatic.neutral: "Šaty nejsou nic než vězení pro tělo!"
 diplomacy_majesty.4090.d.lunatic.female: "Šněrovačky nejsou nic než utlačující pouta!"
 diplomacy_majesty.4090.d.lunatic_beautiful: "Žádný oděv se nevyrovná mé přirozené kráse!"
 diplomacy_majesty_special.1010.t: "Únavný spor"
 diplomacy_majesty_special.1010.start.desc: "S [debater.Custom2('MyCharacterIntroduction', ROOT.Char)] se vždycky nakonec přeme o "
 diplomacy_majesty_special.1010.divine_attributes.desc: "slučitelnost božských vlastností."
 diplomacy_majesty_special.1010.free_will.desc: "slučitelnost božského předurčení se svobodnou vůlí."
 diplomacy_majesty_special.1010.faith_reason.desc: "vztah mezi vírou a rozumem."
 diplomacy_majesty_special.1010.just_war.desc: "podstatu spravedlivé války."
 diplomacy_majesty_special.1010.chivalry.desc: "hodnotu rytířství."
 diplomacy_majesty_special.1010.seven_virtues.desc: "nejdůležitější ze sedmi ctností."
 diplomacy_majesty_special.1010.duty_women.desc: "povinnosti žen."
 diplomacy_majesty_special.1010.mercy.desc: "to, zda je milosrdenství známkou slabosti."
 diplomacy_majesty_special.1010.ambition.desc: "to, zda je ctižádost hříchem, nebo předností."
 diplomacy_majesty_special.1010.inheritance.desc: "otázky dědického práva."
 diplomacy_majesty_special.1010.mapped_territory.desc: "to, co leží za hranicemi zmapovaného světa."
 diplomacy_majesty_special.1010.heroism.desc: "to, zda je hrdinství odvahou, nebo pošetilostí."
 diplomacy_majesty_special.1010.end.desc: "Nikdy se nikam neposuneme, jen stále dokola opakujeme stejné argumenty...\n\nDost bylo dost. Až toto téma přijde na přetřes příště, bude to naposledy."
 diplomacy_majesty_special.1010.o.tt: "V blízké budoucnosti budeš debatovat s [debater.GetFirstNameNoTooltip]"
 diplomacy_majesty_special.1010.a: "Důkladně si téma nastuduji."
 diplomacy_majesty_special.1010.a.success.desc: "Lépe tématu porozumím"
 diplomacy_majesty_special.1010.a.success.tt: "Zvýšíš svou šanci na úspěch v závěrečné debatě o #P 20 %#!"
 diplomacy_majesty_special.1010.a.success.message: "Studium se vydařilo a na závěrečnou debatu jsem teď lépe [Select_CString(ROOT.Char.IsFemale,'připravená','připraven')]!"
 diplomacy_majesty_special.1010.a.failure.desc: "Studium mě vyčerpá"
 diplomacy_majesty_special.1010.a.failure.tt: "Snížíš svou šanci na úspěch v závěrečné debatě o #N 20 %#!"
 diplomacy_majesty_special.1010.a.failure.message: "Studium mě úplně vyčerpalo a skoro nic mi z něj neutkvělo v paměti."
 diplomacy_majesty_special.1010.b: "Studium protivníka mi možná poskytne výhodu..."
 diplomacy_majesty_special.1010.b.success.desc: "Lépe porozumím [debater.GetTitledFirstNameNoTooltip]"
 diplomacy_majesty_special.1010.b.success.tt: "V závěrečné debatě dostaneš nápovědu, kterou taktiku zvolit"
 diplomacy_majesty_special.1010.c: "Trocha odpočinku mě na střet připraví."
 diplomacy_majesty_special.1010.d: "Ať si [debater.Custom2('InsultNoun', ROOT.Char)] nemyslí, že tu velí!"
 diplomacy_majesty_special.1010.e: "Nejjednodušší bude nechat [debater.GetFirstNameNoTooltip] vyhrát."
 diplomacy_majesty_special.1011.start.desc: "A je to tu zase, přesně podle očekávání. Přeme se o "
 diplomacy_majesty_special.1011.study_subject_success.desc: "Ještě že se přípravy tak vydařily — mám v rukávu několik nových argumentů!"
 diplomacy_majesty_special.1011.study_opponent_success.desc: "Ještě že už vím, co je pro [debater.GetFirstName] nejdůležitější: „[debater.Custom('StrongestAIValueNoun')]“. Toho se dá využít!"
 diplomacy_majesty_special.1011.failure.desc: "Bohužel je načasování příšerné. Včerejší přípravy se protáhly hluboko do noci."
 diplomacy_majesty_special.1011.end.desc: "\n\nJeden po druhém se lidé v okolí zastavují, aby si vyslechli naši hádku — někteří o něco méně nenápadně než jiní. Teď je čas to jednou provždy ukončit.\n\nNež začnu, musím se rozhodnout, čeho chci především dosáhnout."
 diplomacy_majesty_special.1011.a: "Chci získat [debater.GetFirstNameNoTooltip] na svou stranu."
 diplomacy_majesty_special.1011.a.flavor: "K tomu budu muset své myšlenky podat co nejpřijatelněji pro [debater.GetFirstNameNoTooltip]..."
 diplomacy_majesty_special.1011.b: "Chci [debater.GetFirstNameNoTooltip] před všemi rozdrtit!"
 diplomacy_majesty_special.1011.b.flavor: "K tomu budu muset využít některou povahovou slabinu, aby [debater.GetFirstNameNoTooltip] [Select_CString(debater.IsFemale,'přestala uvažovat racionálně','přestal uvažovat racionálně')]..."
 diplomacy_majesty_special.1011.a.desc: "Možné výsledky závěrečné debaty"
 diplomacy_majesty_special.1011.a.success.desc: "Pokud závěrečnou debatu vyhraji"
 diplomacy_majesty_special.1011.a.failure.desc: "Pokud závěrečnou debatu prohraji"
 diplomacy_majesty_special.1011.b.rival: "Může se stát mým sokem"
 diplomacy_majesty_special.1012.desc: "S ohledem na to, co vím o povaze [debater.GetFirstName], věřím, že nejlepší způsob, jak získat [debater.GetFirstNameNoTooltip] na svou stranu, je..."
 diplomacy_majesty_special.1012.a: "... postavit své argumenty na logice."
 diplomacy_majesty_special.1012.a.tt: "Dobře funguje proti těm, kdo jsou racionální, sobečtí, skeptičtí nebo bezcitní"
 diplomacy_majesty_special.1012.b: "... zachovat klid, ať se stane cokoli."
 diplomacy_majesty_special.1012.generic.tt: "Účinnost taktiky závisí na tom, jak dobře odpovídá povaze [debater.GetTitledFirstName]"
 diplomacy_majesty_special.1012.b.tt: "Dobře funguje proti těm, kdo jsou odvážní, energičtí, pomstychtiví nebo nečestní"
 diplomacy_majesty_special.1012.c: "... odvolávat se na vyšší hodnoty."
 diplomacy_majesty_special.1012.c.tt: "Dobře funguje proti těm, kdo jsou čestní, dobrosrdeční, shovívaví, věřící nebo postrádají ctižádost"
 diplomacy_majesty_special.1012.d: "... pozorně naslouchat tomu, co [debater.GetFirstNameNoTooltip] říká."
 diplomacy_majesty_special.1012.d.tt: "Dobře funguje proti těm, kdo jsou opatrní, apatičtí nebo nevědomí"
 diplomacy_majesty_special.1013.logic.desc: "Jasně jsem [Select_CString(ROOT.Char.IsFemale,'ukázala','ukázal')], jak jedna myšlenka vyplývá z druhé, a [Select_CString(ROOT.Char.IsFemale,'vystavěla','vystavěl')] tak argumentaci pevnou jako hradby [ROOT.Char.Custom('FortifiedBuilding')]. Když jsem nakonec [Select_CString(ROOT.Char.IsFemale,'dospěla','dospěl')] ke svému závěru, [debater.GetFirstName] [Select_CString(debater.IsFemale,'nemohla','nemohl')] dělat nic jiného než souhlasit."
 diplomacy_majesty_special.1013.calm.desc: "Ať mě [debater.GetFirstName] [Select_CString(debater.IsFemale,'provokovala','provokoval')] jakkoli, [Select_CString(ROOT.Char.IsFemale,'udržela jsem emoce na uzdě a odpovídala','udržel jsem emoce na uzdě a odpovídal')] klidně a vyrovnaně. Na přihlížející to zapůsobilo a při mých slovech začali přikyvovat a souhlasně pobrukovat. Pak [Select_CString(debater.IsFemale,'začala','začal')] naslouchat i [debater.GetFirstNameNoTooltip] a brzy jsem [Select_CString(ROOT.Char.IsFemale,'zapůsobila','zapůsobil')] i na [Select_CString(debater.Char.IsFemale,'ni','něj')]."
 diplomacy_majesty_special.1013.higher_values.desc: "Vím, že [debater.GetFirstName] dbá na vyšší dobro, a proto se odvolávám na hodnoty, které jsou pro [debater.GetFirstNameNoTooltip] tak důležité. Z této perspektivy konečně vyniknou přednosti mých argumentů."
 diplomacy_majesty_special.1013.listen.desc: "Vím, že [debater.GetFirstName] nemá dost odhodlání, aby v hádkách [Select_CString(debater.IsFemale,'dokázala','dokázal')] obstát, a tak udělám něco, co ještě nikdo jiný — opravdu poslouchám. To, že [debater.GetFirstNameNoTooltip] někdo bere vážně, očividně potěší, a když domluví, ochotně si na oplátku vyslechne mě."
 diplomacy_majesty_special.1013.a.cruel: "Jak snadno se slabí dají ovládat."
 diplomacy_majesty_special.1013.a.compassionate: "Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že to můžeme hodit za hlavu."
 diplomacy_majesty_special.1014.desc: "S ohledem na to, co vím o slabinách [debater.GetFirstName], myslím, že nejúčinnější způsob, jak [debater.GetFirstNameNoTooltip] přede všemi ponížit, je..."
 diplomacy_majesty_special.1014.a: "... jednat nemilosrdně a nahnat [debater.GetFirstNameNoTooltip] strach."
 diplomacy_majesty_special.1014.generic.tt: "#F Účinnost taktiky závisí na tom, jak dobře využívá slabin [debater.GetTitledFirstName].#!"
 diplomacy_majesty_special.1014.a.tt: "#F Dobře funguje proti těm, kdo jsou opatrní, dobrosrdeční, shovívaví nebo apatičtí.#!"
 diplomacy_majesty_special.1014.b: "... vyprovokovat [debater.GetFirstNameNoTooltip], aby [Select_CString(debater.IsFemale,'ztratila','ztratil')] nervy."
 diplomacy_majesty_special.1014.b.tt: "#F Dobře funguje proti těm, kdo jsou odvážní, energičtí, pomstychtiví nebo čestní.#!"
 diplomacy_majesty_special.1014.c: "... poukazovat na špatný charakter [debater.GetFirstNameNoTooltip]."
 diplomacy_majesty_special.1014.c.tt: "#F Dobře funguje proti těm, kdo jsou nečestní, bezcitní, sobečtí nebo skeptičtí.#!"
 diplomacy_majesty_special.1014.d: "... zveličovat názory [debater.GetFirstNameNoTooltip]."
 diplomacy_majesty_special.1014.d.tt: "#F Dobře funguje proti těm, kdo jsou nevědomí, věřící nebo postrádají ctižádost.#!"
 diplomacy_majesty_special.1015.scare.desc: "[Select_CString(ROOT.Char.IsFemale,'Mohla','Mohl')] jsem být o něco nenápadnější, ale mé sotva zastřené výhrůžky a jedovaté odpovědi rozhodně splnily účel. [debater.GetFirstName] sotva [Select_CString(debater.IsFemale,'dokázala','dokázal')] formulovat vlastní argumenty, natož odporovat mým!"
 diplomacy_majesty_special.1015.provoke.desc: "Vyprovokovat [debater.GetFirstName] k zuřivosti bylo skoro až příliš snadné. Než si [debater.GetFirstNameNoTooltip] [Select_CString(debater.IsFemale,'všimla','všiml')] zděšených výrazů našich posluchačů, bylo už pozdě. Vedle toho působím jako ztělesnění moudrosti, aniž bych se vůbec [Select_CString(ROOT.Char.IsFemale,'musela','musel')] příliš snažit."
 diplomacy_majesty_special.1015.exaggerate.desc: "Místo rozvíjení vlastního stanoviska se soustředím na překrucování a zveličování názorů [debater.GetFirstName]. Zpočátku si toho [debater.GetFirstNameNoTooltip] nevšimne a dál obhajuje stále absurdnější postoje. Když nakonec představím svůj vlastní názor, publikum už stojí na mé straně."
 diplomacy_majesty_special.1015.low_character.desc: "Místo abych na tvrzení [debater.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'odpovídala','odpovídal')] fakty a logikou, začnu spojovat názory [debater.GetFirstNameNoTooltip] s povahovými nedostatky. Označení „[debater.Custom2('InsultAdjective', ROOT.Char)]“ je mezi lidmi dobře známé, a tak brzy poskvrní i pohled publika na zastávané stanovisko, bez ohledu na to, co [debater.GetFirstNameNoTooltip] říká."
 diplomacy_majesty_special.1015.a.cruel: "Ten výraz ve tváři [debater.GetFirstNameNoTooltip]! K nezaplacení!"
 diplomacy_majesty_special.1015.a.compassionate: "Možná jsem [Select_CString(ROOT.Char.IsFemale,'byla trochu příliš tvrdá','byl trochu příliš tvrdý')]..."
 diplomacy_majesty_special.1016.start.desc: "Navzdory veškeré snaze "
 diplomacy_majesty_special.1016.logic.desc: "přesvědčit [debater.GetFirstName] pomocí logiky jsou emoce příliš silné na to, aby [debater.GetFirstNameNoTooltip] [Select_CString(debater.IsFemale,'dokázala','dokázal')] uvažovat jasně."
 diplomacy_majesty_special.1016.calm.desc: "zachovat klid mě pobuřující názory [debater.GetFirstName] brzy přivedou k zuřivosti. „[debater.Custom2('InsultAdjective', ROOT.Char)] [debater.Custom2('InsultNoun', ROOT.Char)]!“"
 diplomacy_majesty_special.1016.higher_values.desc: "odvolávat se na vyšší hodnoty [debater.GetFirstName] se situace obrátí proti mně, když mě [debater.GetFirstNameNoTooltip] obviní ze snahy změnit téma."
 diplomacy_majesty_special.1016.listen.desc: "pozorně naslouchat [debater.GetFirstName] se z toho stane jen nekonečný proud obvyklých nesmyslů. Zatímco v duchu přemýšlím, co všechno bych [Select_CString(ROOT.Char.IsFemale,'dělala','dělal')] raději, [debater.GetFirstName] kupodivu pronese několik dobrých argumentů."
 diplomacy_majesty_special.1016.scare.desc: "zastrašit [debater.GetFirstName] se mi dostane jen smíchu a nakonec působím malicherně i hloupě."
 diplomacy_majesty_special.1016.provoke.desc: "vyprovokovat [debater.GetFirstName] zachová [debater.GetFirstNameNoTooltip] klid. Na publikum to udělá dojem, zatímco já působím jen malicherně."
 diplomacy_majesty_special.1016.exaggerate.desc: "obrátit překroucené názory [debater.GetFirstName] proti jejich původci nakonec jen hraji [debater.GetFirstNameNoTooltip] přímo do karet."
 diplomacy_majesty_special.1016.low_character.desc: "přesměrovat pozornost na špatný charakter [debater.GetFirstName] se ukáže, že nikdo jiný můj názor nesdílí. Publikum se naopak začne [debater.GetFirstNameNoTooltip] zastávat!"
 diplomacy_majesty_special.1016.end.desc: "\n\nNa tom, že mám pravdu, nezáleží — [debater.GetFirstName] si přihlížející omotá kolem prstu a ti přijmou každé slovo bez jediné námitky."
 diplomacy_majesty_special.1016.a: "Jak trapné..."
 diplomacy_majesty_special.1050.title: "Debata skončila bez výsledku"
 diplomacy_majesty_special.1050.message: "Nikdy jsem [Select_CString(ROOT.Char.IsFemale,'nedostala','nedostal')] příležitost vyzkoušet své debatní schopnosti proti [debater.GetTitledFirstName]."
