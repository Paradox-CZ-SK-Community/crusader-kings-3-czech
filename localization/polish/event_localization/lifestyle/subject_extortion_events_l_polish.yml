l_polish:
 subject_extortion.0001.t: "Vydírání poddaných: [Select_CString(extortion_target.IsFemale,'Mocná vazalka','Mocný vazal')]"
 subject_extortion.0001.desc: "[extortion_target.GetTitledFirstName] rozhodně netrpí nouzí. Soudě podle výrazu ve tváři je účel mé návštěvy už dávno jasný.\n\n„Jsem loajální a platím, co mám,“ zní naléhavá obhajoba. „Jak po mně můžeš chtít ještě víc?“"
 subject_extortion.0001.a: "Ber to jako malou zkoušku věrnosti navíc!"
 subject_extortion.0001.b: "Neboj, platit budou #EMP všichni#!."
 subject_extortion.0001.c: "Ale vždyť mi pořád něco dlužíš, vzpomínáš?"
 subject_extortion.0001.d: "Jen žertuji, [extortion_target.GetFirstNameNoTooltip]!"
 subject_extortion.0001.d.flavor: "Zdá se, že [extortion_target.GetFirstNameNoTooltip] je tím rozrušenější, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]."
 subject_extortion.0002.t: "Vydírání poddaných: Rolníci"
 subject_extortion.0002.desc: "Rolníkům v [extortion_target.GetName] se očividně daří lépe, než by člověk podle daní, které odtud vybírám, čekal. Menší příspěvek do mé pokladnice jim jistě neublíží.\n\nSamozřejmě si budou stěžovat, ale copak rolníci dělají někdy něco jiného? Tohle přežijí, o tom nepochybuji."
 subject_extortion.0002.a: "Ať si dělají, co chtějí, hlavně když dostanu své zlato!"
 subject_extortion.0002.b: "Proč nikdy nejsou vděční za to, co #EMP mají#!?"
 subject_extortion.0002.c: "Teď nestojí za to si je rozhněvat."
 subject_extortion.0003.t: "Vydírání poddaných: [ROOT.Char.GetFaith.AltPriestTermPlural|U]"
 subject_extortion.0003.desc: "Copak [ROOT.Char.GetFaith.WealthGodName] nestojí o to, aby se mi dařilo? A co by k tomu mohlo vést lépe než plná pokladnice?\n\nZ nějakého důvodu se však [ROOT.Char.GetFaith.AltPriestTermPlural] zdráhají souhlasit. Zřejmě věří, že je ochrání vliv, který mají na své věřící."
 subject_extortion.0003.a: "[ROOT.Char.GetFaith.PriestNeuterPlural|U] musí přispívat stejně jako všichni ostatní!"
 subject_extortion.0003.b: "Copak [ROOT.Char.GetFaith.HighGodName] nevidí, že jsem si to [Select_CString(ROOT.Char.IsFemale,'zasloužila','zasloužil')]?"
 subject_extortion.0003.c: "[ROOT.Char.GetFaith.HighGodNameAlternate] své služebníky chrání. Rozhněvat je není dobrý nápad..."
 subject_extortion.0004.t: "Vydírání poddaných: Vazalové"
 subject_extortion.0004.desc: "Samotným účelem mých vazalů je podporovat mé úsilí. Za tuto výsadu sice už platí daně, ale nemohu přestat myslet na to, o kolik víc bych [Select_CString(ROOT.Char.IsFemale,'získala','získal')], kdyby každý přidal ještě trochu navíc...\n\nPro mě ohromné bohatství, pro ně sotva znatelná ztráta!"
 subject_extortion.0004.a: "Dokonalé řešení!"
 subject_extortion.0004.b: "Proč si brát trochu, když si můžu vzít #EMP hodně#!?"
 subject_extortion.0004.c: "Ne, své povinnosti už splnili."
 subject_extortion.0005.t: "Vydírání poddaných: Dvořané"
 subject_extortion.0005.desc: "Moji dvořané žijí prakticky jen z mé štědrosti. Není už nejvyšší čas, aby projevili trochu vděku?\n\nI ten nejbezvýznamnější šlechtic přece musí chápat alespoň tolik o cti a povinnosti."
 subject_extortion.0005.a: "Vždyť vůbec #EMP žijí#! jen z mé milosti!"
 subject_extortion.0005.b: "Není to požadavek, ale dary samozřejmě očekávám."
 subject_extortion.0005.c: "Ale vždyť už tak mají na světě tak málo..."
 subject_extortion.9998.t: "Vydírání poddaných"
 subject_extortion.9998.desc.steward: "Zdá se, že [steward.GetCouncilTitle] už v mém panství nedokáže najít žádný další zdroj zlata.\n\n„Omlouvám se, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], ale už nezbylo nic, co bychom si mohli dovolit vzít.“"
 subject_extortion.9998.desc: "Navzdory mé laskavosti a bezúhonnému charakteru se mi nedaří najít nikoho, kdo by mě byl ochoten podporovat nad rámec svých zákonných povinností. A ani mé návrhy nových zákonů v nikom nevzbuzují zrovna nadšení.\n\nTo mám kvůli svým chamtivým a sobeckým služebníkům snad skončit na mizině?!"
 subject_extortion.9998.a: "Počkat! Co ti to cinká v kapse?"
 subject_extortion.9998.b: "Moment, co je tohle pod mým sedadlem?"
