l_polish:
 destination_events.10.t: "[Select_CString(travel_leader_character.IsFemale,'Zkušená pocestná','Zkušený pocestný')]"
 destination_events.10.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ ozve se [provider_character.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))], když vstoupí do mé pracovny. „Nedávno jsem [Select_CString(provider_character.IsFemale,'jednala','jednal')] s někým, kdo vede karavany. Takové zkušenosti by se vám na cestách mohly hodit. Má za sebou cesty do dalekých krajů a právě takové zkušenosti jsme hledali.“\n\nDosud se nám nedařilo najít nikoho, kdo by se ujal vedení mých cest, takže tohle by mohla být dobrá příležitost."
 destination_events.10.a: "Najměme tedy tuhle posilu."
 destination_events.10.a.tt: "[Concept('aptitude','Způsobilost')|E] ([travel_leader_character.GetUIName|U]): [travel_leader_character.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 destination_events.10.b: "O tuto osobu nemám zájem."
 destination_events.20.t: "Přípravy na výpravu"
 destination_events.20.desc: "„Cože? Říkáš, že máme zásoby navíc?“ reaguji, když za mnou přijde [provider_character.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))], se zprávou o nedávném nálezu v jednom z mých skladišť.\n\n„Přesně tak. Není jasné, proč chyběly v našich záznamech. Ale takový malý dar osudu se hodí. Víš už, co s nimi chceš udělat?“\n\nTyto přebytečné zásoby by se mohly hodit na mé příští cestě."
 destination_events.20.a: "S nimi můžeme cestovat pomalu a opatrně."
 destination_events.20.b: "Zkusme je vyměnit za pár koní."
 destination_events.20.c: "Přebytečné zásoby prodejme."
 destination_excursion_safety_modifier: "Příprava na výpravy: bezpečnost"
 destination_excursion_safety_modifier_desc: "#emp Po dosažení [Concept('destination','cíle')|E] zmizí#!\nNa příští cestu byly odloženy zásoby, aby proběhla bezpečně."
 destination_excursion_speed_modifier: "Příprava na výpravy: rychlost"
 destination_excursion_speed_modifier_desc: "#emp Po dosažení [Concept('destination','cíle')|E] zmizí#!\nNa příští cestu byli připraveni další koně, aby proběhla rychle a efektivně."
 destination_events.30.t: "Cesta k místu [journey_province.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 destination_events.30.desc: "Nedávno se mi dostal do rukou krátký cestopis popisující cestu místního kupce, jejímž cílem bylo město [journey_province.GetName]. Zvláštní pozornost věnuje místní památce [journey_province.GetHolding.GetSpecialBuildingType.GetName] a také všem zajímavostem, které by měl člověk ve městě spatřit.\n\nMožná by stálo za to se tam vydat, až budu příště zase na cestách..."
 destination_events.30.a: "Zní to jako místo, na které se nezapomíná!"
 destination_events.30.a.tt: "Při návštěvě oblasti [journey_province.GetName] v rámci aktivity [GetActivityType('activity_journey').GetName] můžeš získat dodatečné zkušenosti pro [Concept('wanderer_lifestyle','potulný životní styl')|E]"
 destination_events.30.toast.title: "Cesta k místu [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
 destination_events.40.t: "[poi_province.GetCulture.GetLanguage.GetNameNoTooltip]"
 destination_events.40.desc: "Z nějakého důvodu vzpomínám na cestu, která mě zavedla do kraje [poi_province.GetName], a především na to, jak zněla [poi_province.GetCulture.GetLanguage.GetName|l], kterou tam mluvili na každém kroku. Ten jazyk byl tak #emp [poi_province.Custom('DestinationInspiredLanguageDescriptor')]#! —  zkrátka na něj nedokážu zapomenout.\n\nShodou osudu na můj dvůr [Select_CString(teacher_character.IsFemale,'zavítala','zavítal')] [Select_CString(teacher_character.IsFemale,'učenka','učenec')] jménem [teacher_character.GetFirstName] z [teacher_character.GetCulture.GetName] kultury. Mohu požádat o pomoc a třeba mi [teacher_character.GetFirstName] pomůže si tento jazyk osvojit."
 destination_events.40.a: "Příští cesta díky tomu bude mnohem příjemnější!"
 destination_events.40.b: "Učit se další jazyk zní jako spousta práce..."
 destination_inspired_by_language: "Inspirace jazykem"
