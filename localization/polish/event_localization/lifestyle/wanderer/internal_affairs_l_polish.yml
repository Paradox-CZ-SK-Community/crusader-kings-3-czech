l_polish:
 internal_affairs.10.t: "Vzpoura na obzoru"
 internal_affairs.10.desc: "„A taková je současná situace v [barony_title.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')],“ sděluje mi [provider_character.GetFirstName]. Zdá se, že v poslední době dochází v ulicích k menším nepokojům kvůli rozhořčení nad "
 internal_affairs.10.desc.control: "bezuzdným řáděním banditů, kteří ohrožují obyvatele."
 internal_affairs.10.desc.opinion.other: "nenávistí obyvatel vůči jejich lennímu pánovi, [county_holder.GetTitledFirstName]."
 internal_affairs.10.desc.opinion.me: "mou vládou nad touto oblastí."
 internal.affairs.10.desc.outro: "\n\nPřed otevřeným násilím zatím situaci zachraňuje [barony_holder.GetTitledFirstName]. Mezi místními má očividně značnou oblibu a kromě toho, že udržuje obyvatele na uzdě, posílá i skromnou žádost o uspořádání slavnosti, která by měla situaci ještě více uklidnit."
 internal_affairs.10.a: "Tak tedy ať [barony_holder.GetTitledFirstNameNoTooltip] převezme správu..."
 internal_affairs.10.b: "...a [county_holder.GetFirstNameNoTooltip] za to dokonce dostane odškodné!"
 internal_affairs.10.c: "[barony_holder.GetTitledFirstNameNoTooltip] si může uspořádat slavnost."
 internal_affairs.10.d: "Neměl by se o to postarat [county_holder.GetFirstNameNoTooltip]?"
 internal_affairs_local_uprising_appeasement_modifier: "Usmíření místních obyvatel"
 internal_affairs_local_uprising_appeasement_modifier_desc: "Místní obyvatelstvo bylo uklidněno po změně vlády nad oblastí."
 internal_affairs_local_uprising_festival_modifier: "Venkovská slavnost"
 internal_affairs_local_uprising_festival_modifier_desc: "Každoročně se zde koná malá venkovská slavnost, která má uklidnit místní obyvatele."
 internal_affairs.20.t: "[Select_CString(county_holder.IsFemale,'Neschopná vládkyně','Neschopný vládce')]"
 internal_affairs.20.desc: "Už potřetí jen za tento týden ke mně dorazil posel se zprávou o žalostném stavu hrabství [county_title.GetNameNoTier]."
 internal_affairs.20.desc.both: "Bují tam zločinnost, v ulicích leží mrtví obyvatelé a všude vládne strach a nespokojenost."
 internal_affairs.20.desc.control: "Bují tam zločinnost, cesty nejsou bezpečné a obyvatelé se po setmění bojí vycházet z domů."
 internal_affairs.20.desc.opinion: "Panuje tam hluboká nespokojenost se způsobem, jakým je hrabství spravováno, a v ulicích se pravidelně protestuje."
 internal_affairs.20.desc.outro: "\n\nO problému už ví i [county_holder.GetTitledFirstName], přesto se zdá, že potížím není konce. Zaslouží si někdo s takovými výsledky být #emp mým#! vazalem?"
 internal_affairs.20.dread: "Když už je chceš ždímat, tak pořádně. Amatére."
 internal_affairs.20.a: "Nepřijatelné."
 internal_affairs.20.a.tt: "Můžeš oprávněně [Concept('revoke','odebrat')|E] [title_i] [Concept('title','titul')|E], který drží [county_holder.GetTitledFirstName]"
 internal_affairs.20.b: "Tentokrát to nechám být."
 opinion_unfitting_ruler_opinion: "Neschopný vládce"
 MODIFIER_DEFINITION_UNFITTING_RULER_DESC: "\nTento modifikátor se zvyšuje s [Concept('dread','hrůzou')|E] [Concept('holder','držitele')|E]"
 inspection_unfitting_ruler_modifier: "Vyždímané hrabství"
 inspection_unfitting_ruler_modifier_desc: "Toto hrabství je ždímáno do poslední kapky a každý den z něj odtékají peníze i lidé."
 inspection_unfitting_ruler_desc: "\t#weak Zvyšuje se s každým bodem [Concept('dread','hrůzy')|E], který [Concept('holder','držitel')|E] má#!"
 internal_affairs.30.t: "Přimhouřit oko"
 internal_affairs.30.desc: "„Víte, [ROOT.Char.Custom('FormOfAddressForLiege')], některé místní požadavky, které na nás kladou, jsou pro obchod #emp opravdu#! tvrdé...“ Za [SCOPE.Custom('LocalGuildsLoc')] z [guild_province.GetName] za mnou přichází [merchant_character.GetFirstName] a dlouze mi líčí všechny potíže, kterými si cech musel projít.\n\n„Napadlo mě, že bychom se možná mohli mezi sebou dohodnout na trochu příznivějších podmínkách.“ Na stůl přede mě položí malý váček a věnuje mi všeříkající pohled."
 internal_affairs.30.a: "Ale já dokážu víc než jen přimhouřit oko..."
 internal_affairs.30.b: "Dobrá, ale jen tentokrát."
 internal_affairs.30.c: "Vypadni, než tě nechám zabít, ty pijavice!"
 internal_affairs.40.t: "Volné konce"
 internal_affairs.40.follower_intro: "Jako posel ke mně [secret_giver.GetFirstName] průběžně nosí zprávy z okolí a udržuje mě v obraze, zatímco se věnuji jiným záležitostem. Většina těchto zpráv není ničím neobvyklá, ale kdykoli zazní jméno [secret_haver.GetName], v hlase cítím znepokojení.\n\nNakonec "
 internal_affairs.40.courtier_intro: "Když přecházím po táboře, zaslechnu poblíž neznámý hlas hovořící s jedním z mých společníků. Zastavím se a zaposlouchám se. Zpočátku jde o docela nezajímavý rozhovor, ale pak náhle padne jméno [secret_haver.GetName].\n\n"
 internal_affairs.40.desc: "[secret_giver.GetFirstName] se pouští do citlivějších záležitostí týkajících se [secret_haver.GetFirstNameNoTooltip] a odhaluje věci, které by mohly velmi snadno poškodit pověst dotyčné osoby..."
 internal_affairs.40.a: "Možná tvých služeb přece jen využiji, [secret_giver.GetFirstName]."
 internal_affairs.40.blackmail: "Tohle rozhodně dokážu obrátit ve svůj prospěch."
 internal_affairs.40.expose: "Tohle by se měli dozvědět všichni!"
 internal_affairs.40.move_zealous: "[GetPlayer.GetFaith.HighGodName] mě volá jinam..."
 internal_affairs.40.move: "Možná je čas opustit [GetPlayer.GetDomicile.GetLocation.GetName]..."
 internal_affairs.50.t: "Náboženský protest: [target_faith.GetNameNoTooltip]"
 internal_affairs.50.desc: "Rolníci v [tensions_county.GetNameNoTier] zjevně nechovají důvěru ani náklonnost k [tensions_county.GetHolder.GetName]. O příčině tohoto neklidu není pochyb: [target_faith.GetAdherentNamePluralNoTooltip] vidí, jak jsou jejich památky znesvěcovány, a stále přibývá rvaček, do nichž se zapojují jak [target_faith.GetAdherentNamePluralNoTooltip], tak [opposing_faith.GetAdherentNamePluralNoTooltip]. "
 internal_affairs.50.desc.holder_faith: "Ačkoli [tensions_county.GetHolder.GetNameNoTooltip] vyznává [target_faith.GetNameNoTooltip], stejně jako [target_faith.GetAdherentNamePluralNoTooltip], jejich [target_liege.GetTitleTierName] vyznává [opposing_faith.GetNameNoTooltip], a samotná víra místního vládce tak nestačí napětí uklidnit."
 internal_affairs.50.desc.root_faith: "\n\nJe na místě bedlivě sledovat, jak se daří [GetPlayer.GetFaith.GetAdherentNamePluralNoTooltip], už jen proto, aby při našich obřadech mohlo bez překážek zaznívat jméno [GetPlayer.GetFaith.HighGodName]. "
 internal_affairs.50.desc.neutral_faith: "\n\nMé vyznání není ani [opposing_faith.GetNameNoTooltip], ani [target_faith.GetNameNoTooltip], přesto stojí za to zjistit, co se s tím dá dělat. "
 internal_affairs.50.desc_end: "V nejlepším případě se mohu pokusit toto napětí uklidnit, než začne ohrožovat mou bezpečnost."
 internal_affairs.50.tolerance: "Ať si [target_faith.GetAdherentNamePluralNoTooltip|l] věří, čemu chtějí."
 internal_affairs.50.conversion: "V [tensions_county.GetNameNoTierNoTooltip] musí převládnout [opposing_faith.GetNameNoTooltip]!"
 internal_affairs.50.neutral_cynic: "Proč lidé dovolují náboženství, aby mělo nad jejich životy takovou moc?"
 internal_affairs.50.neutral: "Na druhou stranu se mě to vůbec netýká..."
 internal_affairs.tolerance_desc: "Pokusíš se pomoci rolníkům prosadit jejich právo svobodně vyznávat [target_faith.GetNameNoTooltip]."
 internal_affairs.conversion_desc: "Pokusíš se obrátit rolníky z [tensions_county.GetNameNoTierNoTooltip] na [opposing_faith.GetNameNoTooltip]."
 local_zealots_appeased_tt: "Místní [target_faith.GetAdherentNamePluralNoTooltip|l] se uklidňují"
 religious_tension_continues_tt: "[target_faith.GetAdherentNamePluralNoTooltip] pokračují v nepokojích"
 religious_county_converted_tt: "V [tensions_county.GetNameNoTierNoTooltip] se prosazuje [opposing_faith.GetNameNoTooltip]"
 internal_affairs.60.t: "Loupežnický lup"
 internal_affairs.60.desc: "Když procházím průchody v [bandit_location.GetNameNoTier], koutkem oka zahlédnu postavu, která se rychle mihne kolem. Za rohem spatřím skupinu drsně vyhlížejících mužů, jak nakládají na vůz nejrůznější kořist a spěchají, jako by jim v patách bylo samo ztělesnění zla: [GetPlayer.GetFaith.DevilName].\n\nVětšina mužů odchází pro další lup a [bandit_character.GetFirstName] zůstává sám na stráži. Na jedné brašně ve voze vidím pečeť se jménem [bandit_holder.GetName], ale její obsah by se mi hodil také..."
 internal_affairs.60.force: "Co mi asi [bandit_character.GetName] udělá?"
 internal_affairs.60.force_tt: "Postavíš se osamělému banditovi a pokusíš se získat jeho kořist pro sebe"
 internal_affairs.60.force_tt_succ: "Úspěšně ukradneš kořist banditů"
 internal_affairs.60.force_tt_fail: "[bandit_character.GetNameNoTooltip] tě odrazí"
 internal_affairs.60.snitch: "O tomhle se [bandit_holder.GetFirstName] musí dozvědět."
 internal_affairs.60.snitch_tt: "Podáš zprávu o činnosti banditů. [bandit_holder.GetNameNoTooltip] tě odmění částí ukradeného zboží."
 internal_affairs.60.sus: "Možná mě [bandit_character.GetNameNoTooltip] zasvětí do svého řemesla..."
 internal_affairs.60.sus_tt: "Na mapě se vytvoří #V 3#! [Concept('criminal_task_contracts','zločinné zakázky')|E]"
 internal_affairs.60.neutral: "Tohle není můj problém."
 MODIFIER_DEFINITION_LOCAL_CORRUPTION_DESC: "\nTento modifikátor se zvyšuje s klesající [Concept('county_control','kontrolou hrabství')|E] v [Concept('county','hrabství')|E]"
 internal_affairs_local_corruption_desc: "\t#weak Zvyšuje se za každý bod [Concept('county_control','kontroly hrabství')|E] pod 100#!"
 internal_affairs_local_corruption_modifier: "Posvěcená korupce"
 internal_affairs_local_corruption_modifier_desc: "Místní cech obchodníků získal téměř neomezenou moc nad obchodem a pomalu rozleptává správu i hierarchii hrabství."
 internal_affairs_camp_momentum_modifier: "Cestovní elán"
 internal_affairs_camp_momentum_modifier_desc: "Tento dobrodruh pocítil volání cest a možná založí tábor někde jinde."
 internal_affairs_county_religious_tensions_modifier: "Vyhrocené náboženské napětí"
 internal_affairs_county_religious_tensions_modifier_desc: "Náboženské napětí v tomto hrabství ještě zhoršilo vměšování vlivné osoby.\nMěsíční postup [Concept('convert_county','konverze víry v hrabství')|E]: #N -0.2#!"
 RELIGIOUS_TENSIONS_DESC: "[GetModifier('internal_affairs_county_religious_tensions_modifier').GetNameWithTooltip]"
 RELIGIOUS_TOLERANCE_DESC: "[GetModifier('internal_affairs_county_religious_tolerance_modifier').GetNameWithTooltip]"
 internal_affairs_county_religious_tolerance_modifier: "Náboženská tolerance"
 internal_affairs_county_religious_tolerance_modifier_desc: "Hlas náboženské menšiny v tomto hrabství byl vyslyšen a její právo vyznávat vlastní víru je alespoň prozatím respektováno.\nMěsíční postup [Concept('convert_county','konverze víry v hrabství')|E]: #N -0.1#!"
 internal_affairs_character_religious_tolerance_modifier: "$internal_affairs_county_religious_tolerance_modifier$"
 internal_affairs_character_religious_tolerance_modifier_desc: "Tato postava ukázala ostatním, jakou hodnotu má respekt k cizímu vyznání - možná se tím mohou řídit také."
