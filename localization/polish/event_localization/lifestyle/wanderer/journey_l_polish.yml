l_polish:
 journey_events.10.t: "Společník na cesty"
 journey_events.10.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], zdá se mi, že nutně potřebujete společníka na cesty,“ ozve se [provider_character.GetFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('provider_character'))]) při vstupu do mé pracovny. Následuje vědoucí pohled. „Dnes tudy projíždí kupecká karavana - [ROOT.Char.GetCapitalLocation.GetName] je jednou z jejích zastávek - a prý nabízí velký výběr zvířat na prodej.“\n\nKdyž se vyptávám na podrobnosti, padne zmínka o psech, koních a sokolech všech možných velikostí. Když nad tím přemýšlím, možná je společník na cesty přesně to, co potřebuji."
 journey_events.10.a: "Pořádný válečný oř, to by bylo přesně ono."
 journey_events.10.b: "Psi, to jsou opravdoví společníci."
 journey_events.10.c: "Lovecký sokol, přesně to potřebuji."
 journey_events.10.d: "O žádné zvíře nemám zájem."
 journey_events.11.t: "Společník na cesty: Kůň"
 journey_events.11.desc: "Po dni či dvou mi konečně přivedou velkého a statného koně. Sotva převezmu otěže, svéhlavé zvíře se mi začne vzpírat.\n\nNa okamžik se bojím, že skončím na zemi, ale nakonec se v sedle udržím, i když jen tak tak. Zvíře se na mě pak zadívá s něčím, co lze popsat jedině jako záblesk respektu."
 journey_events.11.a: "Časem z nás budou dobří přátelé."
 journey_events.12.t: "Společník na cesty: Pes"
 journey_events.12.desc: "Po dni či dvou mi konečně přinesou malou bedýnku. Když se přiblížím, lehce se zavrtí, a tak ji po krátkém váhání otevřu. Uvnitř čeká můj nový malý společník.\n\nJakmile zvednu víko, štěně vyskočí ven a začne plné energie pobíhat po místnosti. Asi po minutě se zastaví, svalí se na bok a začne podřimovat."
 journey_events.12.a: "Je trochu malé, nemyslíš?"
 journey_events.20.t: "Na obloze nad námi"
 journey_events.20.desc: "Den už značně pokročil, když za mnou přijde [informer_character.GetFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('informer_character'))]) s jiskrou v očích.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], donesla se ke mně zvěst, která by vás mohla zajímat.“\n\n[informer_character.GetFirstName] mi pak vypráví o příběhu, podle něhož se v poslední době na obloze v [destination_province.GetName] pravidelně objevují podivuhodné astronomické jevy. Podrobnosti jsou poněkud nejasné, ale prý jde o zážitek, který člověka potká jednou za život."
 journey_events.20.a: "Tak to je zajímavé..."
 wayfarer_astronomical_phenomenon: "Astronomický úkaz"
 wayfarer_astronomical_phenomenon_desc: "#emp Během [Concept('activity','aktivity')|E] [GetActivityType('activity_roaming').GetName] zažiješ v tomto [Concept('barony','baronství')|E] jedinečnou událost#!\n\nPodle vyprávění se v této provincii pravidelně objevují pozoruhodné astronomické úkazy."
 journey_events.30.t: "Příběh či dva"
 journey_events.30.desc: "Přistihnu [character_1.GetFirstName] a [character_2.GetFirstName] při vzrušeném rozhovoru. „Opravdu? [traveller_province.GetName], říkáš?“ Když si mě všimnou, [character_1.GetFirstNameNoTooltip] se ke mně obrátí: „Tvé cesty tě tam už zavedly, že ano, [ROOT.Char.GetFirstName]?“\n\n„Podle [character_2.GetFirstNameNoTooltip] se v [traveller_province.GetNameNoTooltip] nachází [traveller_province.Custom('journey_events_30_custom_loc')]. Je ti něco takového povědomé?“"
 journey_events.30.a: "[traveller_province.GetNameNoTooltip]: [traveller_province.Custom('journey_events_30_short_custom_loc')]? Ale jistě, o tom vám můžu vyprávět!"
 journey_events.30.a.tt: "Máš pocit, že si #emp možná#! vybavuješ místo, o kterém je řeč ([traveller_province.GetNameNoTooltip]: [traveller_province.Custom('journey_events_30_short_custom_loc')]). Jenže z toho dobrý příběh nebude. Možná bude potřeba něco přikrášlit..."
 journey_events.30.a.win: "Přesvědčím je, že o tom vím úplně všechno"
 journey_events.30.a.loss: "Přistihnou mě při „přikrašlování“"
 journey_events.30.b: "Možná mi to něco říká?"
 journey_events.30.c: "Ne, pověz mi o tom všechno, [character_2.GetFirstNameNoTooltip]."
 journey_events_30_custom_loc_fallback: "nádherný přírodní oblouk"
 journey_events_30_custom_loc_oasis: "nezapomenutelná zelená oáza"
 journey_events_30_custom_loc_desert: "prastarý monumentální megalit"
 journey_events_30_custom_loc_mountains: "úchvatné výhledy z horského úbočí"
 journey_events_30_custom_loc_forest: "velký les"
 journey_events_30_short_custom_loc_fallback: "přírodní oblouk"
 journey_events_30_short_custom_loc_oasis: "oáza"
 journey_events_30_short_custom_loc_desert: "megalit"
 journey_events_30_short_custom_loc_mountains: "úchvatné výhledy"
 journey_events_30_short_custom_loc_forest: "velký les"
 journey_events.40.t: "Místní bard"
 journey_events.40.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ osloví mě [suggester_character.GetFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suggester_character'))]) při vstupu do místnosti. „Každý u dvora ví, jak rád se dělíte o příběhy a zážitky ze svých cest - a mohu vás ujistit, že k potěšení všech.“\n\nPak pokračuje: „Doslechl jsem se o místním bardovi, který si v poslední době získal značnou oblibu. Takový potulný pěvec, kterého mají rolníci rádi. Se správnou motivací by možná mohl začít šířit některé z vašich příběhů po celém panství?“"
 journey_events.40.a: "Máš pravdu, mé příběhy si zaslouží slyšet každý..."
 journey_events.40.a.tt: "Některá [Concept('counties','hrabství')|E] ve tvém [Concept('realm','panství')|E] získají [GetModifier('journey_local_bard_modifier').GetNameWithTooltip] na #high 3 roky#!"
 journey_events.40.b: "Znám lepší způsoby, jak utratit peníze, [suggester_character.GetFirstNameNoTooltip]."
 journey_local_bard_modifier: "Místní bard"
 journey_local_bard_modifier_desc: "Bard baví místní obyvatele příběhy z cest jejich vládce."
 journey_events.50.t: "[ROOT.Char.GetCapitalLocation.GetNameNoTooltip] na jednu noc"
 journey_events.50.desc: "Už dlouho přemýšlím, jak spolu mí poddaní jednají, když je jejich vrchnost nevidí. Po důkladném zvážení se konečně naskytla vhodná chvíle nepozorovaně vyklouznout a podařilo se mi sehnat i pár otrhaných kusů látky na převlek.\n\nČím víc se však ta chvíle blíží, tím větší mám pochybnosti. Sluší se mi vůbec něco takového?"
 journey_events.50.a: "Teď už je pozdě couvnout."
 journey_events.50.a.win: "Nepozorovaně vyklouznu"
 journey_events_50_event_chain_begins_tt: "Cílem mé cesty bude [rootscope.GetCapitalLocation.GetName]"
 journey_events.50.a.loss: "Přistihnou mě v hadrech"
 journey_events.50.b: "Ne, v něčem takovém mě nesmí nikdo vidět!"
 journey_events.50.b.tt: "Co mě to napadlo? Samozřejmě si nepůjdu sednout k rolníkům a nevolníkům!"
 journey_events.51.desc: "Při toulání ulicemi narazím na pochybný, ale očividně oblíbený podnik. Sotva vejdu dovnitř, někdo mi vrazí do ruky pití a dav mě zatlačí až k místu v rohu. Za celou dobu si mě nikdo ani pořádně neprohlédne.\n\nSedím o samotě a pozoruji ostatní hosty. Kolem velkého stolu se tlačí hlučná skupina a několik rolníků se očividně dobře baví při hře v kostky."
 journey_events.51.a: "Tak já jim ukážu, jak se hraje u šlechty."
 journey_events.51.a.tt: "Je načase je připravit o těch pár grošů, co mají. Skoro jako vybírat daně!"
 journey_events.51.a.big_win: "Vyhraju téměř každou hru"
 journey_events.51.a.win: "Tu a tam něco vyhraju"
 journey_events.51.a.loss: "Prohraju víc, než vyhraju"
 journey_events.51.b: "Dopiju a půjdu domů."
 journey_events.51.b.tt: "Rolníků už jsem viděl dost na celý život."
 journey_events.52.desc: "Zpočátku je u stolu veselo, ale čím víc všichni pijí a čím pozdější je hodina, tím větší roste podráždění. Nakonec [local_gambler.GetFirstNameNoTooltip] vstane a hlasitě prohlásí: „Zatracená šlechta! Nemají ani ponětí, jak se žije nám #bold obyčejným#! lidem! A [ROOT.Char.GetTitledFirstName] je ze všech nejhorší - úplně k ničemu!“\n\nKdyž se od celého stolu ozve souhlasné brumlání, nejraději bych se v židli propadl. Mé reakce si však [local_gambler.GetFirstNameNoTooltip] všimne, obrátí se ke mně a zeptá se: „A co si myslíš ty?“"
 journey_events.52.a: "Myslím, že je čas na další rundu!"
 journey_events.52.a.tt: "Stačí jim dál nalévat, dokud nepřestanou remcat!"
 journey_events.52.b: "No, vlastně... [ROOT.Char.GetTitledFirstNameNoTooltip] #bold jsem já#!."
 journey_events.52.b.tt: "Dokážu jim, jak moc se ve mně mýlí!"
 journey_events.52.c: "[threat_1.GetTitledFirstNameNoTooltip] si prý osobně shrábne všechny naše daně pro sebe..."
 journey_events.52.c.chancellor: "[threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip] je prý [Select_CString(threat_1.IsFemale,'pořádně zkorumpovaná','pořádně zkorumpovaný')]..."
 journey_events.52.c.steward: "[threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip] prý vybírá zvláštní daně a strká si je do vlastní kapsy..."
 journey_events.52.c.marshal: "[threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip] prý někoho na ulici [Select_CString(threat_1.IsFemale,'umlátila','umlátil')] k smrti..."
 journey_events.52.c.spymaster: "[threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip] má prý na svědomí opravdu nechutné věci..."
 journey_events.52.c.chaplain: "Prý má [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip] na svědomí všelijaké hříšné skutky..."
 journey_events.52.c.fallback: "Za to prý ve skutečnosti může [threat_1.GetCouncilTitle] [threat_1.GetFirstNameNoTooltip]."
 journey_events.52.c.tt: "Tohle je příležitost hodit vinu na někoho jiného - třeba na [threat_1.GetFirstNameNoTooltip]."
 journey_drink_and_circus_modifier: "Pití a hry"
 journey_drink_and_circus_modifier_desc: "V tomto hrabství začal lenní pán ve zvýšené míře zásobovat místní krčmy alkoholem; podle některých dokonce osobně."
 journey_blame_game_modifier: "Neoblíbenost u lidu"
 journey_blame_game_modifier_desc: "Tato postava je mezi místními hluboce neoblíbená a šíří se o ní nejrůznější zvěsti."
 journey_blame_game_province_modifier: "Obliba u lidu"
 journey_blame_game_province_modifier_desc: "Vládce hrabství získává mezi lidmi stále větší oblibu díky příběhům o tom, jak se zastává obyčejných lidí."
 journey_pauper_king_modifier: "Přízeň chudiny"
 journey_pauper_king_modifier_desc: "Mezi rolníky a nevolníky se tato postava těší mimořádné oblibě díky četným příběhům o přátelském a osobním jednání s lidmi z nižších vrstev."
 journey_events.53.desc: "Objednávám jednu rundu za druhou, dokud všichni buď neusnou, nebo neodejdou domů. Nakonec u stolu zůstáváme jen já a [local_gambler.GetFirstNameNoTooltip]. Sotva se ještě daří sedět vzpřímeně, přesto ke mně míří šilhavý pohled.\n\n„Víš co? Na panstvo se s tebou dá docela vydržet,“ zamumlá nakonec [local_gambler.GetFirstNameNoTooltip], načež hlava dopadne na stůl a přichází bezvědomí."
 journey_events.53.a: "Hm, jak dlouho už asi ví, kdo jsem?"
 journey_events.53.a.tt: "Je čas vrátit se domů, než si někdo začne dělat příliš velké starosti s tím, kde jsem."
 journey_events.54.desc: "Zpočátku je napětí vysoké. Po několika příbězích z mých cest a několika rundách alkoholu ale cítím, jak všichni postupně povolují. Za nějakou dobu už v krčmě panuje veselá nálada a lidé se mě vyptávají na všechno možné.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jestli smím...“ začne opatrně [local_gambler.GetFirstNameNoTooltip]. „Tady v [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] máme místní domobranu a rádi bychom vám sloužili přímo.“\n\nNavzdory mým námitkám na své nabídce trvají. Když se výčep konečně zavírá, všichni vypadají náramně spokojeně a postupně se trousí ven."
 journey_events.54.a: "To byl ale produktivní večer!"
 local_militia_name_default: "Místní domobrana"
 journey_events.55.desc: "Pokouším se zmírnit napětí v místnosti, když najednou přiletí první rána - první z mnoha.\n\nPo záplavě ran pěstmi a kopanců mě vyhodí do zadní uličky. Tvář skoro necítím a nedokážu se ani postavit na nohy.\n\nPo několika bolestivých hodinách kolem projde několik strážných a jeden z nich mě jakýmsi zázrakem pozná podle tváře. Pomohou mi vstát a doprovodí mě domů."
 journey_events.55.a: "Celý tenhle nápad byla chyba..."
 journey_events.56.desc: "Nejdřív se snažím vymyslet jen pár drobných jedovatostí. Terčem je [threat_1.GetFirstName]. Po chvíli se ale do vyprávění skutečně ponořím. Už nejde jen o přetvářku, která má odvést vinu jinam - [threat_1.GetFirstName] mi zkrátka skutečně leze na nervy.\n\nV mých historkách páchá [threat_1.GetFirstName] čím dál horší nepravosti a já postupně přidávám i to, jak těžké je pro mě, [ROOT.Char.GetTitledFirstName], vypořádávat se s takovou zkažeností.\n\nNa konci večera lidé odcházejí s výrazně změněným názorem na nás oba - na [threat_1.GetFirstName] i na mě."
 journey_events.56.a: "Nic lepšího si [threat_1.GetFirstName] nezaslouží."
 journey_events.56.a.tt: "Plodný večer. Teď je čas vrátit se domů, než si někdo začne dělat příliš velké starosti."
 journey_events.57.desc: "Snažím se ze všech sil svalit vinu jinam. Mým terčem je [threat_1.GetFirstName] - [threat_1.GetCouncilTitle] v mé radě. Jenže mi neustále někdo skáče do řeči. Jeden vytáhne něco o mé povaze, další zase nějakou pověst, která koluje o mně.\n\nNež se naději, večer končí a všichni odcházejí s ještě horším míněním o mně než na začátku. Jak se tohle proboha stalo?"
 journey_events.57.a: "Kdo by řekl, že mě lidé tak nesnášejí?"
 journey_events.57.a.tt: "No... ne tak plodný večer, jak jsem doufal, ale rozhodně na něj jen tak nezapomenu..."
 journey_events.60.t: "Prozření"
 journey_events.60.desc_intro: "V poslední době mě tíží zvláštní neklid. [journey_county.GetNameNoTierNoTooltip] nabízí nádhernou krajinu - [journey_province.Custom('TerrainTypeProvincePrefix')] [journey_county.Custom('TerrainTypeCountyScopePlural')] - ale ani ta nedokáže zaplnit neustávající pocit prázdnoty.\n\nKdyž se zabývám svými obvyklými záležitostmi, "
 journey_events.60.desc_courtly: "vejdu na [journey_county.GetHolder.GetNamePossessive] dvůr a sleduji jeho zasedání. Místní páni a dámy se slavnostně shromažďují kolem trůnu; jejich domovem je [journey_county.GetHolder.GetPrimaryTitle.GetNameNoTierNoTooltip]. Postupně přicházejí prosebníci a důstojně předstupují se svými žádostmi o zlato či podporu. Ať je jejich prosba sebevšednější nebo sebemalichernější, [journey_county.GetHolder.GetTitleTierName] jí pozorně naslouchá a vynáší spravedlivý soud."
 journey_events.60.desc_bellicose: "narazím na tábor a chvíli pozoruji skupinu rytířů při výcviku. Cvičně spolu bojují a v jejich pohybech se snoubí brutalita s elegancí, téměř jako by se pohybovali v dokonalé souhře. Velitel je sleduje s patrnou hrdostí a vzájemná úcta mezi nimi je téměř hmatatelná."
 journey_events.60.desc_stoic: "zahlédnu děti hrající si na ulici. Jedno z nich je však očividným terčem ostatních. Strkají do něj a trhají mu šaty, ono však zůstává klidné a vyrovnané. Prostě vstane, opráší se a pokračuje dál. Ostatní děti tomu nerozumějí a brzy o svou oběť ztratí zájem."
 journey_events.60.desc_bureaucratic: "spatřím místní žáky, jak pobíhají městem se svitky a knihami v náručí. Jednomu z nich něco vypadne, aniž by si toho všiml. Než to stačím vrátit, upoutá mě složitý nákres. Na zemi leží [ROOT.Char.Custom('GetWritingMaterial')] a na jeho povrchu je plán nové stavby v [journey_county.GetNameNoTierNoTooltip] s tak pokročilými prvky, že bych je čekal od zkušeného mistra stavitele. Nikdo z těch studentů nevypadá na víc než osmnáct let, a přesto už ovládají řemeslo, jehož zvládnutí by většině lidí trvalo celý život."
 journey_events.60.desc_spiritual: "narazím na skupinu rolníků a mnichů shromážděných v kruhu. Vzduchem se nesou jejich tiché zpěvy, ale nedokážu rozeznat, komu jsou určeny. Zda v jejich chvalozpěvech zaznívá [ROOT.Char.GetFaith.HighGodName], nebo jméno jiného božstva. Při bližším pohledu si všimnu, že někteří z rolníků mají vyšší postavení a několik lidí dokonce nosí šlechtický oděv. Přesto všichni působí pokojně a úcta k božskému je spojuje bez ohledu na jejich původ."
 journey_events.60.desc_egalitarian: "zastavím se na chvíli v místní krčmě a vstoupím přímo doprostřed živé debaty. Podle přízvuků i oděvů mají hosté společného jen málo. Přesto probíhá rozhovor civilizovaně a živě, bez známky odsuzování, jako by všichni pocházeli z jedné rodiny. Na každého se tu hledí prostě jako na pocestného. Původ nikoho nezajímá - [journey_culture.GetNameNoTooltip] kultura ani [ROOT.Char.GetCulture.GetNameNoTooltip] kultura tu člověka neurčuje."
 journey_events.60.desc_communal: "ozve se mrazivý výkřik a lidé se rozběhnou za jeho zdrojem. Přidám se k nim a spatřím ženu svírající dítě před hořícím domem. Ostatní bez váhání popadnou vědra s vodou a dokonce i šlechtici přiloží ruku k dílu. Požár se podaří rychle uhasit, ale matčin domov je zničen. Měšťané se shromáždí kolem ní a dítěte a nabízejí jim i to málo, co sami mají, aby jim pomohli začít znovu."
 journey_events.60.opt: "[journey_culture.GetCollectiveNounNoTooltip]... možná se od nich mohu něco naučit."
 journey_events.60.opt_b: "Mé cesty mi toho ukázaly tolik."
 journey_bellicose_modifier: "Úcta k válečnictví"
 journey_bellicose_modifier_desc: "Tato postava viděla rytíře v akci a jejich umění ji naplnilo úžasem."
 journey_stoic_modifier: "Neochvějné odhodlání"
 journey_stoic_modifier_desc: "Tato postava se řídí zásadami stoicismu."
 journey_bureaucratic_modifier: "Architektonické ambice"
 journey_bureaucratic_modifier_desc: "Tato postava viděla pokročilé plánování místního stavebního projektu."
 journey_spiritual_modifier: "Úcta k božskému"
 journey_spiritual_modifier_desc: "Tato postava si váží přítomnosti vyšší moci."
 journey_egalitarian_modifier: "Zastánce rovnosti"
 journey_egalitarian_modifier_desc: "Tato postava poznala výhody rozmanité společnosti.\nCena náboru [Concept('courtier','dvořanů')|E]: #P -10%#!"
 journey_communal_modifier: "Patron společenství"
 journey_communal_modifier_desc: "Tato postava dokáže v těžkých chvílích stmelit své společenství.\nCena [Concept('activity','aktivity')|E] [GetActivityType('activity_camp_party').GetName]: #P -20%#!\nCena [Concept('activity','aktivity')|E] [GetActivityType('activity_feast').GetName]: #P -20%#!"
