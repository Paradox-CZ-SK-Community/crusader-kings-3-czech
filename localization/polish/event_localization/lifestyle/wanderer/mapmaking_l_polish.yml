l_polish:
 mapmaking.0001.t: "Itineráře a mapy"
 mapmaking.0001.desc: "Nastal čas zaznamenat poznatky z mých cest, aby z mých zkušeností mohli čerpat i ostatní. Podrobný itinerář doplněný mapami a nákresy mi umožní předat dál vše, co jsem tak pracně zjistil.\n\nNejprve se musím rozhodnout, ze které cesty bude tento projekt vycházet."
 mapmaking.0001.a: "Doména [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]"
 mapmaking.0001.a.tt: "Základem projektu budou poznatky získané v místě [visited_own_county.GetName] a v dalších državách tvé [Concept('domain','domény')|E]\nVýsledný artefakt bude silnější, čím více svých držav v [Concept('domain','doméně')|E] navštívíš"
 mapmaking.0001.b: "Země [visited_own_vassal_title.GetNameNoTooltip]"
 mapmaking.0001.b.tt: "Základem projektu budou poznatky získané v místě [visited_own_vassal.GetName] a v dalších hlavních sídlech vazalů\nVýsledný artefakt bude silnější, čím více baronství sloužících jako [Concept('capital','hlavní sídla')|E] [Concept('powerful_vassals','mocných vazalů')|E] navštívíš"
 mapmaking.0001.c: "Trasa vedoucí k místu, kde stojí [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 mapmaking.0001.c.tt: "Základem projektu budou poznatky získané v místě [poi_map_target.GetName] a u tamního [Concept('point_of_interest','zajímavého místa')|E]\nVýsledný artefakt bude silnější, čím více zkušeností máš s rysem [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0001.d: "Mapa [foreign_kingdom_map_target.GetNameNoTooltip]"
 mapmaking.0001.d.tt: "Základem projektu bude návštěva místa [foreign_capital_map_target.GetName], které je hlavním sídlem titulu [foreign_capital_map_target.GetTitle.GetHolder.GetPrimaryTitle.GetName]\nVýsledný artefakt bude silnější, čím více zkušeností máš s rysem [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0001.z: "[visited_own_liege.GetNameNoTooltip]"
 mapmaking.0010.t: "Mapování domény"
 mapmaking.0010.desc: "Každý dobrý lenní pán zná své panství. Ví, koho požádat, když je potřeba něco zařídit, kde leží nevyužitá půda, co vyžaduje údržbu a jaké překážky je třeba překonat.\n\nKdyž usedám k mapě svých zemí, musím se zamyslet nad tím, co bude pro jejího čtenáře skutečně důležité. Jaké poznatky mi mé cesty přinesly?"
 mapmaking.0010.a: "Zaměřím se na nevyužité zdroje."
 mapmaking.0010.a.tt: "Výsledkem bude itinerář s výhodami pro hospodářství [Concept('domain','domény')|E]\nTato volba těží z vyššího [Concept('stewardship','správcovství')|E]"
 mapmaking.0010.b: "Obrana panství je zásadní."
 mapmaking.0010.b.tt: "Výsledkem bude itinerář s výhodami pro obranu tvé [Concept('domain','domény')|E]\nTato volba těží z vyššího [Concept('martial','válečnictví')|E]"
 mapmaking.0020.t: "Země [visited_own_vassal_title.GetNameNoTooltip]"
 mapmaking.0020.desc: "Návštěvy zemí mých vazalů mi ukázaly, jak zacházejí se svými poddanými, čeho mají nedostatek a čeho naopak nadbytek. Možná už dokonce tuším, kde hledat jejich tajemství a bohatství.\n\nTo všechno ale jedna mapa jen tak nepojme. Musím se rozhodnout, jaký druh mapy vytvořím."
 mapmaking.0020.a: "Ukážu, jak je držet na uzdě."
 mapmaking.0020.a.tt: "Výsledkem bude itinerář s výhodami souvisejícími s [Concept('dread','hrůzou')|E].\nTato volba těží z vysoké úrovně ostřílených zkušeností v rysu [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0020.b: "Tahle mapa mi pomůže jim prospět."
 mapmaking.0020.b.tt: "Výsledkem bude itinerář s výhodami pro dobré vztahy s [Concept('vassals','vazaly')|E] a [Concept('courtiers','dvořany')|E].\nTato volba těží z vyšší [Concept('diplomacy','diplomacie')|E]"
 mapmaking.0020.c: "Má mapa odhalí jejich tajemství."
 mapmaking.0020.c.tt: "Výsledkem bude itinerář s výhodami souvisejícími s [Concept('schemes','intrikami')|E].\nTato volba těží z vyššího [Concept('intrigue','pletichářství')|E]"
 mapmaking.0030.t: "Nezmapované"
 mapmaking.0030.desc: "[poi_map_target.Custom('GetSpecialBuildingPrefix')|U][poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] patří k místům, která na mě během cest zapůsobila nejvíce. Samotná cesta k místu [poi_map_target.GetHolding.GetNameNoTooltip] byla téměř stejně nezapomenutelná a s lepší přípravou by nejspíš proběhla mnohem rychleji.\n\nDo mapy se však vejde jen omezené množství informací, a tak se při sepisování svých zážitků musím rozhodnout, na co se zaměřím."
 mapmaking.0030.a: "Nic není důležitější než rychlá a bezpečná cesta."
 mapmaking.0030.a.tt: "Zaměření na cestu k místu [poi_map_target.GetHolding.GetNameNoTooltip] povede k itineráři zlepšujícímu bezpečnost a rychlost [Concept('travel','cestování')|E].\nTato volba těží z vysoké úrovně ostřílených zkušeností v rysu [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0030.b: "Nakreslím podrobnou mapu místa [poi_map_target.GetHolding.GetNameNoTooltip]."
 mapmaking.0030.b.tt: "Zaměření na [poi_map_target.Custom('GetSpecialBuildingPrefix')][poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] povede k itineráři s výhodami odpovídajícími typu [Concept('point_of_interest','zajímavého místa')|E].\nTato volba těží z vysoké úrovně cestovatelských zkušeností v rysu [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0040.t: "[foreign_kingdom_map_target.GetNameNoTooltip]"
 mapmaking.0040.desc: "Cesta zemí [foreign_kingdom_map_target.GetNameNoTier] mi ukázala mnohé, nejen o tamních poddaných, ale i o tom, jak odlišná je jejich země od té naší. [foreign_kingdom_map_target.GetAdjectiveNoTooltip] kraj obývají lidé s vlastními zvyky, kteří si vydělávají na živobytí jinak než my. V mnoha ohledech mi byla cizí i samotná krajina.\n\nKdyž se pouštím do zaznamenávání svých poznatků, musím se rozhodnout, na co se zaměřím a co by se o této zemi měli dozvědět další cestovatelé."
 mapmaking.0040.a: "Tamní dvůr byl skutečně nezapomenutelný."
 mapmaking.0040.a.tt: "Zaměření na dvůr povede k itineráři s výhodami souvisejícími s [Concept('prestige','prestiží')|E].\nTato volba těží z vysoké úrovně cestovatelských zkušeností v rysu [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0040.b: "Zaměřím se na zdejší lidi a jejich zvyky."
 mapmaking.0040.b.tt: "Zaměření na lidi povede k itineráři s výhodami souvisejícími s [Concept('diplomacy','diplomacií')|E].\nTato volba těží z vysoké úrovně ostřílených zkušeností v rysu [GetTrait('lifestyle_traveler').GetName( GetNullCharacter )]"
 mapmaking.0040.c: "Všichni musí vědět, že [foreign_kingdom_map_target.GetAdjectiveNoTooltip] kraj je domovem tvorů známých jako [SCOPE.Custom('mythical_map_creatures')]!"
 mapmaking.0040.c.tt: "Zaměření na mýtické tvory povede k itineráři s výhodami souvisejícími s [Concept('dynasty_prestige','věhlasem')|E]."
 mapmaking.0004.t: "[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] a tamní [background_terrain_scope.Custom('GetTerrainLandPlural')]"
 mapmaking.0004.heat.t: "[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] pod spalujícím sluncem"
 mapmaking.0004.snow.t: "[background_terrain_scope.Custom('GetBadWeatherDesc')|U] sužuje [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetAdjectiveNoTooltip] kraj"
 mapmaking.0004.fighting.t: "[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] a tamní nebezpečí"
 mapmaking.0004.monsoon.t: "[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] za monzunových dešťů"
 mapmaking.0004.desc.intro: "Každý itinerář musí čtenáře varovat před nebezpečími, která ho na cestě čekají.\n\n"
 mapmaking.0004.fighting.desc: "Cestování touto oblastí mě naučilo neustále dávat pozor na přepadení a útoky. [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] je místem, kde platí právo silnějšího. Ať už člověk narazí na psance, místní barony, nebo cizí vojska, musí být vždy připraven se bránit.\n\n"
 mapmaking.0004.snow.desc: "Se jménem [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] se mi navždy spojily tamní zimy. Náhlé vánice, prudké poklesy teplot a zdánlivě nekonečné bílé moře sněhu, kterým jsme se museli brodit.\n\n"
 mapmaking.0004.heat.desc: "Se jménem [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] si spojuji především nemilosrdné sluneční paprsky. Krajinu tvoří [background_terrain_scope.Custom('GetTerrainLandPlural')] a při cestě přes ni jsme neustále vyhlíželi stín a čerstvou vodu.\n\n"
 mapmaking.0004.monsoon.desc: "Se jménem [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip] se mi navždy spojí tamní prudké deště. V období monzunů se i ta nejbezpečnější cesta dokázala proměnit v bahnité močáliště.\n\n"
 mapmaking.0004.terrain_steppes.desc: "Otevřená step je v mnoha ohledech tím nejvýraznějším rysem celé oblasti. Divoká, nespoutaná a obtížně obdělávatelná krajina nabízí jen málo zásob a ještě méně čerstvé vody..."
 mapmaking.0004.terrain_deep_forests.desc: "Hluboké lesy určují podobu každé cesty touto oblastí. Kudy se vydat, kde hledat potravu a jak lovit, to všechno jsou nepostradatelné zkušenosti. Právě ty se mi vybaví, kdykoli zazní jméno [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]..."
 mapmaking.0004.terrain_wetlands.desc: "Mokřady patří k nezapomenutelným rysům této oblasti. Jak se orientovat v mlze a jak bezpečně projít zrádnou půdou, to jsou první věci, které se mi vybaví..."
 mapmaking.0004.terrain_undulating.desc: "Cesta touto oblastí znamená připravit se na namáhavý pochod, protože terén se neustále zvedá a zase klesá. Odměnou jsou však nádherné výhledy z výšin, na které dodnes vzpomínám..."
 mapmaking.0004.terrain_open_farmland.desc: "Se zásobami jsme tu nikdy neměli potíže a ani samotný terén nepředstavoval velké nebezpečí. Ústředním bodem krajiny je [background_terrain_scope.GetTitle.GetNameNoTierNoTooltip] a odtud se do všech stran táhnou pečlivě obdělávaná pole..."
 mapmaking.0004.terrain_open.desc: "Rozlehlá otevřená krajina nedávala sebemenší možnost skrýt náš příchod. Nezbývalo než být připraveni postavit se každému nepříteli přímo..."
 mapmaking.0004.terrain_desert.desc: "Poušť klade na každého poutníka obrovské nároky. V nekonečném otevřeném prostoru není kam se ukrýt před sluncem ani před nepřáteli."
 mapmaking.0004.terrain_jungle.desc: "Džungle je domovem bezpočtu rostlin a zvířat, některých užitečných a jiných smrtelně nebezpečných. Umět je rozeznat a vědět, jak správně rozbít tábor, jsou nepostradatelné zkušenosti..."
 mapmaking.0004.desc.generic_fallback: "Jen málokdy jsem předtím nebo potom viděl tak nevýraznou zemi. Fádnosti zdejší krajiny se vyrovnají snad jen stejně nezajímaví obyvatelé."
 mapmaking.0004.a: "Zaměřím se na cestování krajinou, kterou tvoří [background_terrain_scope.Custom('GetTerrainLandPlural')]."
 mapmaking.0004.a.tt: "[background_terrain_scope.GetTerrain.GetName] bude [Concept('terrain','terénem')|E], pro který výsledný artefakt poskytne výhody"
 mapmaking.0004.b: "Popíšu, jak se připravit na přepadení."
 mapmaking.0004.b.tt: "Výsledný artefakt poskytne výhody pro bezpečnost [Concept('travel','cestování')|E] a obranu při napadení"
 mapmaking.0004.c: "Zaměřím se na boj s chladem."
 mapmaking.0004.c.tt: "Výsledný artefakt poskytne výhody související se zimou"
 mapmaking.0004.d: "Zásadní je umět se vypořádat s vedrem."
 mapmaking.0004.d.tt: "Výsledný artefakt poskytne výhody pro bezpečnost [Concept('travel','cestování')|E] v horkém [Concept('terrain','terénu')|E]"
 mapmaking.0004.e: "Důležitější je monzun."
 mapmaking.0004.e.tt: "Výsledný artefakt poskytne výhody pro bezpečnost [Concept('travel','cestování')|E] v mokrém [Concept('terrain','terénu')|E]"
 mapmaking.1000.t: "Cesta, jejímž cílem je [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
 mapmaking.1000.internal.t: "Putování po [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
 mapmaking.1000.mythical.t: "Cesta do země tvorů známých jako [SCOPE.Custom('mythical_map_creatures')|U]"
 mapmaking.1000.desc: "Když dopisuji poslední stránku rukopisu, naplňuje mě hluboké uspokojení.\n\nZaznamenávání poznatků z mých cest je v mnoha ohledech nostalgické. Mohu znovu prožít některé z okamžiků, které mě v minulosti nejvíce formovaly, a zároveň vytvářím něco, co může pomoci budoucím cestovatelům.\n\nDoufám, že výsledný itinerář i podrobná mapa mé trasy obstojí ve zkoušce času. Ústředním tématem obou je [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]."
 mapmaking.1000.a: "Tato cesta je u konce."
 map_artifact_name: "Itinerář, jehož cílem je [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTooltip]"
 map_artifact_name_domain: "Doména [author.GetTitledFirstNameNoTooltip]"
 map_artifact_name_vassal_dread: "[background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetAdjectiveNoTooltip] spis o podrobení vazalů"
 map_artifact_name_vassal_opinion: "[background_terrain_scope.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] cestopis"
 map_artifact_name_vassal_intrigue: "Tajný [background_terrain_scope.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] cestopis"
 map_artifact_name_poi: "Cesta, jejímž cílem je [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]"
 map_artifact_name_mythical: "Země tvorů, jinak známých jako [SCOPE.Custom('mythical_map_creatures_capitalized')|U]"
 map_artifact_beginning_western: "Tato malá kniha v kožené vazbě je itinerář se složenou mapou uvnitř. Mapa i kniha zachycují putování spojené se jménem [author.GetFullName]"
 map_artifact_beginning_far_eastern: "Tento rukopis na palmových listech je itinerář putování spojeného se jménem [author.GetFullName]"
 map_artifact_beginning_internal: "[newly_created_artifact.GetDesc] v panství známém jako [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]. Doprovází jej podrobná mapa vytvořená stejnou rukou.\nPříběh popisuje cestu poznamenanou "
 map_artifact_beginning_external: "[newly_created_artifact.GetDesc] do zemí známých jako [background_terrain_scope.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier]. Doprovází jej podrobná mapa vytvořená stejnou rukou.\nPříběh popisuje cestu poznamenanou "
 map_artifact_danger_type_heat: "[newly_created_artifact.GetDesc]spalujícím vedrem a neustálým nedostatkem vody"
 map_artifact_danger_type_monsoons: "[newly_created_artifact.GetDesc]prudkými monzunovými dešti"
 map_artifact_danger_type_snowstorms: "[newly_created_artifact.GetDesc]krutým mrazem a sněhovými bouřemi"
 map_artifact_danger_type_fighting: "[newly_created_artifact.GetDesc]bezprávím a téměř nevyhnutelnými střety"
 map_artifact_danger_type_undulating: "[newly_created_artifact.GetDesc]zvlněnými kopci a nebezpečnými horskými průsmyky"
 map_artifact_danger_type_wetlands: "[newly_created_artifact.GetDesc]zrádnými mokřady plnými nemocí"
 map_artifact_danger_type_open: "[newly_created_artifact.GetDesc]rozlehlými otevřenými pláněmi bez jediného úkrytu"
 map_artifact_danger_type_desert: "[newly_created_artifact.GetDesc]nelítostnými pouštěmi bez vody a úkrytu"
 map_artifact_danger_type_jungle: "[newly_created_artifact.GetDesc]hustými džunglemi plnými nebezpečných zvířat"
 map_artifact_danger_type_forests: "[newly_created_artifact.GetDesc]hlubokými lesy plnými skrytých nebezpečí"
 map_artifact_danger_type_steppes: "[newly_created_artifact.GetDesc]otevřenými stepmi daleko od osídlených krajů"
 map_artifact_danger_type_farmlands: "[newly_created_artifact.GetDesc]bohatou zemědělskou krajinou schopnou uživit každou družinu"
 map_artifact_danger_type_end: "[newly_created_artifact.GetDesc] a obsahuje úvahy o tom, jak se s podobnými nástrahami nejlépe vypořádat.\n\n"
 map_artifact_domain_purpose_growth: "[newly_created_artifact.GetDesc]Popsaná cesta byla podniknuta za účelem prohlídky vlastní domény. Itinerář shrnuje získané poznatky a vysvětluje, jak z vlastních zemí co nejlépe získávat zdroje a bohatství."
 map_artifact_domain_purpose_defensive: "[newly_created_artifact.GetDesc]Popsaná cesta byla podniknuta za účelem prohlídky vlastní domény. Itinerář i mapa popisují, jak zdejší země bránit před nepřátelskými vojsky. Mapa ukazuje, kde budovat obranná postavení, jak co nejlépe podporovat vlastní ozbrojence a jaké kroky může podniknout útočník."
 map_artifact_vassal_purpose_dread: "[newly_created_artifact.GetDesc]Itinerář popisuje cestu podniknutou za účelem prohlídky zemí vazalů.\nNa mapě jsou vyznačena všechna místa považovaná za silné body spolu s pokyny, jak nejlépe zlomit případný odpor. Nechybějí ani poznámky o povahách jednotlivých vazalů a způsobech, jak je co nejúčinněji zastrašit a přimět k poslušnosti."
 map_artifact_vassal_purpose_opinion: "[newly_created_artifact.GetDesc]Text popisuje cestu za účelem prohlídky zemí vazalů a obsahuje poznámky o cenném majetku i povaze každého z nich. Nabízí také řadu doporučení, jak jim co nejlépe pomáhat a lichotit, aby si vládce zachoval jejich podporu."
 map_artifact_vassal_purpose_intrigue: "[newly_created_artifact.GetDesc]Text popisuje cestu za účelem prohlídky vazalů a obsahuje množství poznámek o vstupech do hradů, tajných chodbách i místech, kde jednotliví vazalové ukrývají svůj nejcennější majetek."
 map_artifact_poi_travel: "[newly_created_artifact.GetDesc]Cílem cesty byla podle všeho návštěva místa, kde stojí [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. Mapa podrobně zachycuje zvolenou trasu a radí, jak se nejlépe vyhnout chybám, ke kterým během výpravy cestou došlo."
 map_artifact_poi_purpose: "[newly_created_artifact.GetDesc]Cílem cesty byla podle všeho návštěva místa, kde stojí [poi_map_target.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]. Samostatná mapa se věnuje tomuto místu a jeho okolí, zatímco itinerář popisuje, co tam může cestovatel očekávat."
 map_artifact_foreign_purpose_court: "[newly_created_artifact.GetDesc]Popsaná cesta vrcholí návštěvou dvora, jehož sídlem je [background_terrain_scope.GetTitle.GetNameNoTierNoTooltip], a značná část textu je věnována životu tamní vyšší společnosti."
 map_artifact_foreign_purpose_people: "[newly_created_artifact.GetDesc]Účelem popsané cesty byla návštěva tamního dvora, itinerář však hlavní sídlo téměř nezmiňuje. Místo toho se velmi podrobně věnuje obyvatelům země, jejich nezvyklému chování a obyčejům."
 map_artifact_foreign_purpose_mythical: "[newly_created_artifact.GetDesc]Popsaná cesta vrcholí návštěvou tamního dvora, hlavní pozornost však poutá barvité líčení země, kterou údajně sužují tvorové, kteřím místní říkají [SCOPE.Custom('mythical_map_creatures')], a rady, jak se má cestovatel na setkání s nimi co nejlépe připravit."
