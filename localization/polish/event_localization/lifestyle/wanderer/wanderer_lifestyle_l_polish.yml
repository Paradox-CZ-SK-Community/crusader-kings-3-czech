l_polish:
 wanderer_lifestyle_events.10.t: "Sny o cestě"
 wanderer_lifestyle_events.10.desc: "Tenhle pokoj, tyhle zdi, ta zatracená židle... Už toho mám #bold tak#! dost.\n\n#emp Musím#! odsud pryč. Musím někam jinam. Kamkoli.\n\nS každým dnem stráveným v téhle příšerné místnosti mám pocit, jako by mi mizel další kousek života."
 wanderer_lifestyle_events.10.a: "Potřebuji si od toho všeho odpočinout..."
 wanderer_lifestyle_events.10.a.tt: "[Concept('traveling','Cestování')|E] odstraní [Concept('modifier','modifikátor')|E] a poskytne [Concept('stress_loss','úbytek stresu')|E] a [Concept('lifestyle_experience','zkušenosti životního stylu')|E]"
 wanderer_restlessness_modifier: "Neklid"
 wanderer_restlessness_modifier_desc: "#emp Tento [Concept('modifier','modifikátor')|E] zmizí, jakmile se příště vydáš na [Concept('travel','cestu')|E]#!\nKaždý příšerný den trávím sněním o tom, že jsem někde jinde."
 wanderer_restlessness_removal_title: "Klid"
 wanderer_lifestyle_events.20.t: "Vzpomínky: [reminiscing_location.GetNameNoTooltip]"
 wanderer_lifestyle_events.20.desc: "Když se přehrabuji ve svých věcech a hledám něco úplně jiného, narazím na starou figurku tvora z map, kterému se říká [SCOPE.Custom('mythical_map_creatures')]. [Select_CString(ROOT.Char.IsFemale,'Přivezla','Přivezl')] jsem si ji během návštěvy [reminiscing_location.GetName]. Při pohledu na ni se mi vybaví "
 wanderer_lifestyle_events.20.desc.special_building: "[reminiscing_location.GetHolding.GetSpecialBuildingType.GetName], místo dávno zapadlé v mých vzpomínkách."
 wanderer_lifestyle_events.20.desc.coastal: "velký přístav a nádherný výhled na oceán."
 wanderer_lifestyle_events.20.desc.river: "řeka protékající městem a četné mosty, které ji překlenovaly."
 wanderer_lifestyle_events.20.desc.castle: "impozantní hrad, který se hrdě tyčil nad městem."
 wanderer_lifestyle_events.20.desc.city: "rozlehlé majestátní město s mnoha čtvrtěmi a nespočtem malých zákoutí."
 wanderer_lifestyle_events.20.desc.people: "přátelští lidé, kteří tam žili."
 wanderer_lifestyle_events.20.desc.outro_child: "\n\nZrovna se probírám vzpomínkami, když dovnitř náhle vtrhne [listening_child.GetFirstName]. „Co je to?“ zazní zvědavá otázka při pohledu na malou figurku."
 wanderer_lifestyle_events.20.desc.outro: "\n\nPři vzpomínání se mě zmocní nostalgie. Možná... Možná by nebylo špatné se tam někdy vrátit. [reminiscing_location.GetNameNoTooltip] přece stojí za další návštěvu."
 wanderer_lifestyle_events.20.a: "Povím ti o jednom tvorovi z [reminiscing_location.GetNameNoTooltip] - [SCOPE.Custom('mythical_map_creatures')]!"
 wanderer_lifestyle_events.20.b: "Jednou přijde čas na návrat: [reminiscing_location.GetNameNoTooltip]..."
 wanderer_lifestyle_events.20.b.child: "Tahle figurka mi připomíná jedno místo: [reminiscing_location.GetNameNoTooltip]. Třeba tě tam jednou vezmu."
 wanderer_lifestyle_events.20.a.win: "[listening_child.GetFirstName] příběhu zcela propadne"
 wanderer_lifestyle_events.20.a.lose: "Příběhu [listening_child.GetFirstName] úplně nevěří, ale přesto se baví"
 wanderer_lifestyle_events.20.b.tt: "Můžeš získat dodatečné zkušenosti [Concept('wanderer_lifestyle','potulného životního stylu')|E] nebo [Concept('stress_loss','úbytek stresu')|E], pokud při [Concept('travel','cestování')|E] projdeš přes [reminiscing_location.GetName]"
 wanderer_lifestyle_events.25.t: "Další návštěva"
 wanderer_lifestyle_events.25.desc: "Kráčím stejnými ulicemi jako minule v [province_location.GetName]. Vidím stejné stánky, cítím stejné vůně a slyším stejné zvuky.\n\nJe uklidňující vědět, že některé věci se nezměnily."
 wanderer_lifestyle_events.25.a: "Tohle... je přesně podle mých představ."
 wanderer_lifestyle_events.30.t: "Sny o vzdálených krajích"
 wanderer_lifestyle_events.30.desc: "Při prohlížení knih narazím na cestovní deník kupce, který popisuje vzdálenou oblast: [ROOT.Char.Custom('DistantLandsRegionLoc')].\n\n„#emp Krajina kolem nás: [ROOT.Char.Custom('DistantLandsTerrainTypeLoc')]. Náhle se přede mnou objeví [ROOT.Char.Custom('DistantLandsPluralTypeLoc')]. [ROOT.Char.Custom('DistantLandsGroupTypeLoc')|U], [ROOT.Char.Custom('DistantLandsActivityTypeLoc')].#!“"
 wanderer_lifestyle_events.30.desc.singular: "#emp Na první pohled mě upoutá: [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')]. Chvíli zvíře jen pozoruji. Nic podobného se mi ještě nepoštěstilo spatřit. Až později se dozvídám, jak se jmenuje.#!"
 wanderer_lifestyle_events.30.desc.plural: "#emp Na první pohled mě upoutá: [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')]. Chvíli je jen pozoruji. Nic podobného se mi ještě nepoštěstilo spatřit. Až později se dozvídám, jak se jmenují.#!"
 wanderer_lifestyle_events.30.a.singular: "Jednou to uvidím na vlastní oči."
 wanderer_lifestyle_events.30.a.plural: "Jednou je spatřím na vlastní oči."
 wanderer_lifestyle_events.30.a.europe: "Můžeš získat dodatečné zkušenosti [Concept('wanderer_lifestyle','potulného životního stylu')|E] nebo [Concept('stress_loss','úbytek stresu')|E], pokud během [Concept('travel','cestování')|E] projdeš touto oblastí: [GetGeographicalRegion('world_europe').GetName]"
 wanderer_lifestyle_events.30.a.africa: "Můžeš získat dodatečné zkušenosti [Concept('wanderer_lifestyle','potulného životního stylu')|E] nebo [Concept('stress_loss','úbytek stresu')|E], pokud během [Concept('travel','cestování')|E] projdeš touto oblastí: [GetGeographicalRegion('world_africa').GetName]"
 wanderer_lifestyle_events.30.a.asia: "Můžeš získat dodatečné zkušenosti [Concept('wanderer_lifestyle','potulného životního stylu')|E] nebo [Concept('stress_loss','úbytek stresu')|E], pokud během [Concept('travel','cestování')|E] projdeš touto oblastí: [GetGeographicalRegion('world_middle_east').GetName]"
 wanderer_lifestyle_events.30.a.india: "Můžeš získat dodatečné zkušenosti [Concept('wanderer_lifestyle','potulného životního stylu')|E] nebo [Concept('stress_loss','úbytek stresu')|E], pokud během [Concept('travel','cestování')|E] projdeš touto oblastí: [GetGeographicalRegion('world_india').GetName]"
 wanderer_lifestyle_events.30.a.tibet: "Můžeš získat dodatečné zkušenosti [Concept('wanderer_lifestyle','potulného životního stylu')|E] nebo [Concept('stress_loss','úbytek stresu')|E], pokud během [Concept('travel','cestování')|E] projdeš touto oblastí: [GetGeographicalRegion('world_tibet').GetName]"
 wanderer_lifestyle_events.30.a.steppe: "Můžeš získat dodatečné zkušenosti [Concept('wanderer_lifestyle','potulného životního stylu')|E] nebo [Concept('stress_loss','úbytek stresu')|E], pokud během [Concept('travel','cestování')|E] projdeš touto oblastí: [GetGeographicalRegion('world_steppe').GetName]"
 wanderer_lifestyle_events.35.t: "Sen se stává skutečností"
 wanderer_lifestyle_events.35.desc.singular: "Když cestujeme krajinou, kterou tvoří [province_location.Custom('HoldingNoHoldingTerrainRoaming')], náhle spatřím zvíře: [ROOT.Char.Custom('DistantLandsActivityTypeLoc')]. Nejdřív přemýšlím, co je to za tvora, ale pak se mi vybaví starý popis z doby před mnoha lety. To musí být [ROOT.Char.Custom('DistantLandsPluralTypeLoc')]!\n\nMá [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')] a téměř přesně odpovídá cestovnímu deníku, "
 wanderer_lifestyle_events.35.desc.singular.adorable: "přesto je až nečekaně roztomilé. Něčím mě zkrátka přitahuje."
 wanderer_lifestyle_events.35.desc.singular.neutral: "přesto je skutečnost trochu jiná než moje představa. Ne však k horšímu."
 wanderer_lifestyle_events.35.desc.singular.taken_aback: "přesto mě ten vzhled trochu zaskočí... Ale radost z úspěšného pátrání je obrovská!"
 wanderer_lifestyle_events.35.desc.plural: "Když cestujeme krajinou, kterou tvoří [province_location.Custom('HoldingNoHoldingTerrainRoaming')], náhle spatřím zvířata: [ROOT.Char.Custom('DistantLandsActivityTypeLoc')]. Nejdřív přemýšlím, co je to za tvory, ale pak se mi vybaví starý popis z doby před mnoha lety. To musí být [ROOT.Char.Custom('DistantLandsPluralTypeLoc')]!\n\nMají [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')] a téměř přesně odpovídají cestovnímu deníku, "
 wanderer_lifestyle_events.35.desc.plural.adorable: "přesto jsou až nečekaně roztomilá. Něčím mě zkrátka přitahují."
 wanderer_lifestyle_events.35.desc.plural.neutral: "$wanderer_lifestyle_events.35.desc.singular.neutral$"
 wanderer_lifestyle_events.35.desc.plural.taken_aback: "přesto mě jejich vzhled trochu zaskočí... Ale radost z úspěšného pátrání je obrovská!"
 wanderer_lifestyle_events.35.a: "TO CHCI!"
 wanderer_lifestyle_events.35.a.win: "Podaří se ti odchytit zvíře: [ROOT.Char.Custom('DistantLandsLoc')]"
 wanderer_lifestyle_events.35.a.lose: "Ztrapníš se"
 wanderer_lifestyle_events.35.b.singular: "Konečně spatřit tohle zvíře na vlastní oči mi stačí."
 wanderer_lifestyle_events.35.b.plural: "Konečně je spatřit na vlastní oči mi stačí."
 wanderer_lifestyle_events.40.t: "Přešlap na tržišti"
 wanderer_lifestyle_events.40.desc: "Cesta [ROOT.Char.GetLocationDesc|l] zatím probíhá bez potíží, jenže nastávají krušné časy - zásoby jídla nám téměř došly! Lákavá vůně mě dovede k podivnému stánku. Připravuje se tam [ROOT.Char.Custom('GetExpensiveMeal')] a na pultě leží všelicos: [ROOT.Char.Custom('GetLocalStreetFoodPlural')], porce místní ryby [ROOT.Char.Custom('GetRegionalFish')] a k tomu cosi sladkého... [ROOT.Char.Custom('FavoriteTreat')]?\n\nKdyž to pominu, cena je víc než výhodná! Za pultem na mě někdo cosi nesrozumitelně zamumlá a gestem naznačí, že mám zaplatit víc než místní. Pořád by to sice vyšlo levněji, ale takové jednání si nemusím nechat líbit. Jenže [provisions_merchant.GetCulture.GetLanguage.GetNameNoTooltip|l] mi je cizí..."
 wanderer_lifestyle_events.40.fold: "Asi prostě zaplatím, kolik se po mně chce, a budu to mít z krku."
 wanderer_lifestyle_events.40.barter: "Mám vlastní plán, i když touhle hatmatilkou nemluvím."
 wanderer_lifestyle_events.40.language: "Možná mi [provisions_merchant.GetCulture.GetLanguage.GetNameNoTooltip|l] není úplně cizí..."
 wanderer_lifestyle_events.40.meh: "Vlastně máme jídlo doma."
 wanderer_lifestyle_events.40.language_tt: "Pokusíš se využít rodný jazyk, kterým mluví [provisions_merchant.GetName]"
 wanderer_lifestyle_events.40.language_tt.success: "Domluva se podaří a [provisions_merchant.GetName] ti proto nabídne #EMP místní#! cenu"
 wanderer_lifestyle_events.40.language_learned: "Tvé jazykové pátrání přinese ovoce"
 wanderer_lifestyle_events.40.language_nothing: "Jazyk se nenaučíš, ale přesto dostaneš místní cenu"
 wanderer_lifestyle_events.40.language_tt.fail: "Situace se ještě více zamotá a nakonec stejně zaplatíš o něco víc"
 wanderer_lifestyle_events.40.barter_tt: "Pokusíš se #EMP smlouvat#! o místní slevu, zatímco [provisions_merchant.GetName] zvažuje tvou nabídku"
 wanderer_lifestyle_events.40.barter_tt.success: "[provisions_merchant.GetName] ocení tvou snahu a ty dostaneš nižší cenu"
 wanderer_exotic_animal_modifier: "Exotické zvíře"
 wanderer_exotic_animal_modifier_desc: "Nic neudělá takový dojem jako exotické zvíře, které ještě nikdo jiný neviděl!"
