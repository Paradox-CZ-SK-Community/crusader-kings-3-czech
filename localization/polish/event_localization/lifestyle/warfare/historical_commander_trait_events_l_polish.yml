l_polish:
 historical_commander_trait.reject.tt: "#F Inspiraci budeš hledat jinde. #!"
 historical_commander_trait.0001.t: "„Nepřítel Říma“"
 historical_commander_trait.0001.desc: "Při studiu taktiky starověkých vojevůdců se [ROOT.Char.Custom('surprised_reaction')] dozvídám o činech Hannibala Barky během druhé punské války.\n\n#F Hannibal, známý jako „Nepřítel Říma“, dosáhl svého největšího triumfu v bitvě u Kann, kde jeho armáda o zhruba 50 000 mužích obratným manévrem obklíčila početnější římské vojsko čítající 86 000 mužů. Římané byli obklíčeni a neměli kam ustoupit; masakr přežilo pouhých 3 000 z nich.#!"
 historical_commander_trait.0001.a: "Stejně jako Hannibal zničím své nepřátele!"
 historical_commander_trait.0001.b: "Hannibal byl skutečným mistrem fabiánské taktiky."
 historical_commander_trait.0001.c: "Hannibalovou největší předností byla všestrannost."
 historical_commander_trait.0001.d: "Pche! Byl to hlupák, když vedl válku bez naděje na vítězství."
 historical_commander_trait.0001.d.good: "Brutalita není hodna obdivu ani ve válce."
 historical_commander_trait.0002.t: "Cézarův triumf"
 historical_commander_trait.0002.desc: "Při studiu taktiky starověkých vojevůdců mě pobaví příběh o činech Julia Cézara během dobývání Galie.\n\n#F Při obléhání Alesie Cézar usoudil, že přímý útok na dobře opevněné město by byl příliš nákladný. Místo toho nařídil své armádě vybudovat vlastní opevnění kolem celého města, aby uvnitř uvěznil nepřátelskou posádku a nechal ji vyhladovět, zatímco zároveň bránil posilám dorazit obráncům na pomoc.#!"
 historical_commander_trait.0002.a: "Trocha důvtipu dokáže při obléhání divy."
 historical_commander_trait.0002.b: "Ať nepřítel přijde za tebou! To se mi líbí!"
 historical_commander_trait.0002.c: "Cézar tím plánem riskoval, ale vyplatilo se mu to!"
 historical_commander_trait.0002.d: "Takové války se dnes už prostě nevedou..."
 historical_commander_trait.0003.t: "Nezastavitelný Alexandr"
 historical_commander_trait.0003.desc: "Při studiu taktiky starověkých vojevůdců se [ROOT.Char.Custom('surprised_reaction')] dozvídám o činech Alexandra Velikého během dobývání Mezopotámie.\n\n#F Během obléhání Týru Alexandr zaútočil na ostrovní pevnost tak, že nechal zbořit nedaleké město a jeho trosky použil k vybudování hráze táhnoucí se od pevniny až k městským hradbám. Díky tomu mohly jeho obléhací stroje útočit přímo na nepřátelskou pevnost, ačkoli průlom nakonec vytvořilo až jeho loďstvo.#!"
 historical_commander_trait.0003.a: "Žádná voda mé armády nezastaví!"
 historical_commander_trait.0003.b: "Ta hráz byla dílem mimořádného důvtipu."
 historical_commander_trait.0003.c: "Obrátit prostředky nepřítele proti němu? Geniální!"
 historical_commander_trait.0003.d: "Proč ztrácet čas studiem taktiky, která nefungovala?"
 historical_commander_trait.0004.t: "Zjevení chí-ró"
 historical_commander_trait.0004.desc: "Při studiu taktiky starověkých vojevůdců mě inspiruje příběh o Konstantinově vítězství v bitvě u Milvijského mostu.\n\n#F V noci před bitvou se Konstantinovi zdálo, že mu bude dopřáno vítězství, pokud na štíty svých vojáků namaluje chí-ró, symbol Krista. Přesně to udělal a následujícího dne rozdrtil vojska uzurpátora Maxentia, který spadl do Tibery a utopil se.#!"
 historical_commander_trait.0004.a: "Hříšníci se Božím vojskům nemohou rovnat!"
 historical_commander_trait.0004.b: "Stejně jako Konstantina ani mě žádná řeka nezdrží na cestě k vítězství!"
 historical_commander_trait.0004.c: "Z logického hlediska tu bitvu vyhrála pružná taktika."
 historical_commander_trait.0004.d: "Triky na povzbuzení morálky k vítězství ve válce nestačí!"
 historical_commander_trait.0005.t: "Meč Alláhův"
 historical_commander_trait.0005.desc: "Při studiu taktiky historických vojevůdců mě k zamyšlení přivádí příběh o první bitvě Chálida ibn al-Valída po jeho přijetí islámu.\n\n#F V bitvě u Mu'ty měli Byzantinci více než trojnásobnou početní převahu, ale Chálid povzbudil své kolísající vojáky, aby udrželi linii. Tento vzdorovitý odpor mu poskytl čas zorganizovat ústup do Medíny a zachránit své muže před jistou smrtí. Chálid a jeho armáda později ve jménu Alláha dobyli celou Arábii!#!"
 historical_commander_trait.0005.a: "Ti, kdo bojují ve jménu Alláha, zvítězí!"
 historical_commander_trait.0005.b: "Oddanost nám dodává sílu i proti přesile."
 historical_commander_trait.0005.c: "Vědět, #EMP kdy#! bojovat, je stejně důležité jako vědět, #EMP jak#!."
 historical_commander_trait.0005.d: "Proč oslavovat potupnou porážku?"
 historical_commander_trait.0006.t: "Moudrý král"
 historical_commander_trait.0006.desc: "Při studiu taktiky dávných vojevůdců mě inspirovaly příběhy o výbojích Bilge kagana, které sahaly do všech čtyř světových stran.\n\nPři nájezdech proti Basmylům a do Kan-čou pokořil armádu tchangského císaře Süan-cunga, přestože čítala stovky tisíc mužů. Skutečně pochopil, že naše síla spočívá v rychlosti a pohyblivosti!\n\nBilge a jeho vojsko později ve jménu Tengriho rozdrtili také Kitany a Si!"
 historical_commander_trait.0006.a: "S požehnáním Nebes vytrváme!"
 historical_commander_trait.0006.b: "$historical_commander_trait.0005.c$"
 historical_commander_trait.0006.c: "Pohyblivá armáda potřebuje pružnou taktiku!"
 historical_commander_trait.0006.d: "Jsme lepší než nějaké laciné triky!"
 historical_commander_trait.0007.t: "Sun-c'"
 historical_commander_trait.0007.desc: "Při studiu sedmi vojenských klasik se [ROOT.Char.Custom('surprised_reaction')] dozvídám o bitvě u Po-ťü, v níž Sun-c' prokázal hodnotu svých teorií o vedení války.\n\n#F Sun-c' měl údajně v období Jar a podzimů dovést vojska státu Wu k vítězství nad početnějšími silami státu Čchu za použití svých dnes již proslulých vojenských zásad.#!"
 historical_commander_trait.0007.a: "Hranice mezi chaosem a řádem spočívá v koordinaci."
 historical_commander_trait.0007.b: "Musím usilovat o podrobení nepřítele bez boje."
 historical_commander_trait.0007.c: "Když udeříš, udeř jako blesk!"
 historical_commander_trait.0007.d: "Největší vítězství je to, které nevyžaduje žádnou bitvu."
