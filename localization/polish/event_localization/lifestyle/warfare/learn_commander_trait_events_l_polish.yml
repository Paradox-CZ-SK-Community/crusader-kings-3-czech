l_polish:
 learn_commander_trait.0002.t: "Jemná rovnováha"
 learn_commander_trait.0002.desc: "V žáru boje často rozhoduje o vítězství či porážce odhodlání jednat.\n\nAž přijde ta chvíle, vím, jak se zachovám."
 learn_commander_trait.0002.a: "Udeřím a nepolevím!"
 learn_commander_trait.0002.b: "Ani o krok neustoupím."
 learn_commander_trait.0002.c: "Zůstanu ve střehu a přizpůsobím se situaci."
 learn_commander_trait.0003.t: "Na nepřátelském území"
 learn_commander_trait.0003.desc: "O válkách rozhodují bitvy, ale o bitvách rozhoduje jejich příprava.\n\nNechat se zastihnout bez plánu a směru je spolehlivá cesta k porážce."
 learn_commander_trait.0003.a: "Mé armády musí mít vždy dostatek zásob."
 learn_commander_trait.0003.b: "Žádný hrad mě dlouho nezadrží."
 learn_commander_trait.0003.c: "Přes řeky udeřím s jistotou přílivu."
 learn_commander_trait.0004.t: "Příliv bitvy"
 learn_commander_trait.0004.desc: "Už jsem viděl, jak to chodí: uprostřed boje přijde krátké ochabnutí. Prchavý okamžik, kdy se ani jedna strana netlačí vpřed a vřava se rozestoupí jako vlny kolem skály."
 learn_commander_trait.0004.b: "V útoku nikdy nepolevím!"
 learn_commander_trait.0004.c: "Čas přezbrojit vším, co nezůstalo vězet v nějakém těle!"
 learn_commander_trait.0005.t: "Jako bouře"
 learn_commander_trait.0005.desc: "Dupot stovky bot dopadajících do mělké vody, útok stejně rychlý jako nemilosrdný a za námi jen hořící budovy."
 learn_commander_trait.0005.a: "Mému běsnění nic neodolá!"
 learn_commander_trait.0006.t: "Meč [ROOT.Char.GetFaith.WarGodNamePossessive]"
 learn_commander_trait.0006.desc: "Viděl jsem, jak bojují [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')|l]. Vím, s jakou krutostí srážejí věřící k zemi.\n\nPostavím se jim s vědomím, že [ROOT.Char.GetFaith.WarGodName] je na mé straně!"
 learn_commander_trait.0006.a: "Ať mě provází [ROOT.Char.GetFaith.PantheonTerm]! Nepřátelé víry budou zničeni!"
 learn_commander_trait.0007.t: "Pod žhnoucím sluncem"
 learn_commander_trait.0007.desc: "Moji nepřátelé nechápou, jakým požehnáním jsou drsný písek a spalující žízeň.\n\nNechápou, jak mohou mé oddíly snášet žár a trpělivě čekat na střet, zatímco jejich protivníci marně polykají vyschlými hrdly."
 learn_commander_trait.0007.a: "Poušť je mým spojencem."
 learn_commander_trait.0008.t: "Smrtící jako houští"
 learn_commander_trait.0008.desc: "V džungli neexistují snadné bitvy a já toho umím využít. Mé oddíly ženou nepřítele zarostlými stezkami, lapají ho v bahně a křovinách a trny dokážou napáchat stejnou škodu jako mé meče a kopí.\n\nKdyž padne noc, těla mizí mezi spadaným listím."
 learn_commander_trait.0008.a: "Prales nezná slitování."
 learn_commander_trait.0009.t: "Chladný jako noc"
 learn_commander_trait.0009.desc: "Nelítostný mráz si vyžádal mnoho životů. Ale ne můj ani životy mých vojáků.\n\nVíme, kde pod sněhem hledat potravu, nepřátele stopujeme jako vlci a koušeme jako ten nejkrutější zimní mráz..."
 learn_commander_trait.0009.a: "Udeříme jako krupobití."
 learn_commander_trait.11.opening: "„[Select_CString(teacher.IsFemale,'Slyšela','Slyšel')] jsem, že se chcete hlouběji ponořit do válečného umění?“ Když ke mně [teacher.GetTitledFirstName] přichází, [teacher.Custom('quirk_pos_present')]. „Možná vám dokážu ukázat bojiště z nové perspektivy.“"
 learn_commander_trait.11.desc: "\n\n[teacher.GetFirstName] je [Select_CString(teacher.IsFemale,'proslulá','proslulý')] svým mistrovstvím. [ROOT.Char.Custom('CommanderTraitSkillDescription')|U] patří k tomu, čemu rozumí nejlépe. Pokud mi s tím někdo může pomoci, pak právě [teacher.GetFirstNameNoTooltip]."
 learn_commander_trait.11.a: "Chci se učit."
 learn_commander_trait.11.b: "Nechám to na svých velitelích."
 learn_commander_trait.11.martial_tt: "[teacher.GetFirstName] se ti pokusí předat znalosti potřebné k získání tohoto rysu: [THIS.Char.Custom('CommanderTraitBeingTaught')]\n$EFFECT_LIST_BULLET$Vysoká [Concept('martial_skill','válečnická dovednost')|E] ti při tomto výcviku pomůže"
 learn_commander_trait.11.b.tt: "#F Možná někdy jindy.#!"
 learn_commander_trait.12.desc: "[teacher.GetTitledFirstName] mi během výcviku [Select_CString(teacher.IsFemale,'ukázala','ukázal')] všechny důležité podrobnosti. Hlavní téma bylo jasné — [ROOT.Char.Custom('CommanderTraitSkillDescription')]. Závěrečnou zkouškou bude cvičná bitva, v níž proti sobě povedeme vojska a já ukážu, [Select_CString(ROOT.Char.IsFemale,'co jsem se naučila','co jsem se naučil')]."
 learn_commander_trait.12.a: "Připravte šiky!"
 learn_commander_trait.12.b: "Ne, ještě mi není úplně jasné, co se mě [teacher.GetFirstNameNoTooltip] snaží naučit."
 learn_commander_trait.giving_up_tt: "#F Tohle se učit nepotřebuji.#!"
 learn_commander_trait_final_test_success: "Vítězství!"
 learn_commander_trait_final_test_success_tt: "#F Dokážu, že výcvik přinesl ovoce.#!"
 learn_commander_trait_final_test_failure: "Porážka!"
 learn_commander_trait_final_test_failure_tt: "#F Ještě toho neumím dost.#!"
 learn_commander_trait.13.desc: "[teacher.GetTitledFirstName] ke mně přijíždí na koni. „Působivé!“ vykřikne. „Nepřátelští“ odvedenci jen užasle sledují, jak účinně si mé ostatní oddíly počínají.\n\nNemůže být pochyb, že už chápu, co znamená být [ROOT.Char.Custom('CommanderTraitBeingTaught')]."
 learn_commander_trait.13.a: "[Select_CString(ROOT.Char.IsFemale,'Naučila jsem se toho tolik.','Naučil jsem se toho tolik.')]"
 learn_commander_trait.14.desc: "„Možná se ještě máš co učit...“ [teacher.GetTitledFirstName] ke mně natáhne ruku a pomůže mi vstát z bláta.\n\nMé oddíly se zrovna nepředvedly. Musím uznat, že [teacher.GetFirstNameNoTooltip] má možná pravdu."
 learn_commander_trait.14.a: "Ukaž mi ještě jednou, jak to děláš."
 learn_commander_trait.14.a.tt: "„Zkusím to ještě jednou...“"
 learn_commander_trait.14.b: "Tohle je příliš těžké!"
 learn_commander_trait.14.b.tt: "„Vzdávám to! Alespoň prozatím.“"
 learn_commander_trait.01.t: "Zásoba znalostí"
 learn_commander_trait.1101.desc: "\n\n[teacher.GetFirstName] je [Select_CString(teacher.IsFemale,'proslulá','proslulý')] svým mistrovstvím v zásobování. Pokud mi s tím někdo může pomoci, pak právě [teacher.GetFirstNameNoTooltip]."
 learn_commander_trait.1201.desc: "[teacher.GetTitledFirstName] mi [Select_CString(teacher.IsFemale,'ukázala','ukázal')] všechny záludnosti zásobování vojáků v poli. Závěrečnou zkouškou bude cvičná bitva: [teacher.GetFirstNameNoTooltip] se pokusí napadnout můj zásobovací trén a já ho musím ochránit."
 learn_commander_trait.1301.desc: "[teacher.GetTitledFirstName] ke mně přijíždí na koni. „Působivé!“ vykřikne. „Mé oddíly se k zásobovacímu trénu ani nepřiblížily.“"
 learn_commander_trait.1401.desc: "Všechno vypadalo tak dobře, dokud mi nedošlo, že jízda byla jen klamný útok!\n\nKdyž přijíždím, [teacher.GetTitledFirstName] už drží v ruce jablko z jednoho z mých vozů. „Myslím, že vím, kde se stala chyba,“ poznamená a [teacher.Custom('quirk_pos_pp')]."
 learn_commander_trait.02.t: "Stavět na znalostech"
 learn_commander_trait.1102.desc: "\n\n[teacher.GetFirstName] je [Select_CString(teacher.IsFemale,'proslulá','proslulý')] svým mistrovstvím ve vojenském inženýrství. Pokud mi s tím někdo může pomoci, pak právě [teacher.GetFirstNameNoTooltip]."
 learn_commander_trait.1202.desc: "[teacher.GetTitledFirstName] mě [Select_CString(teacher.IsFemale,'zasvětila','zasvětil')] do všech záludností obléhání. Teď stojíme nad modelem pevnosti a mým závěrečným úkolem je popsat nejúčinnější způsob jejího dobytí."
 learn_commander_trait.1302.desc: "„To mě nenapadlo,“ [teacher.GetTitledFirstName] [teacher.Custom('quirk_pos_present')]. V mém plánu nedokáže najít jedinou chybu!"
 learn_commander_trait.1402.desc: "„A co tamta věž?“ [teacher.GetTitledFirstName] ukáže z cimbuří na místo před hradbou, které právě popisuji. Teď už tu osudovou chybu ve svém plánu vidím."
 learn_commander_trait.03.t: "Drtivé poznání"
 learn_commander_trait.04.t: "Štít vědění"
 learn_commander_trait.05.t: "Studnice poznání"
 learn_commander_trait.06.t: "Odpověď na každou situaci"
 learn_commander_trait.07.t: "Moudrost pouště"
 learn_commander_trait.08.t: "Houští vědění"
 learn_commander_trait.09.t: "Chladné lekce"
 learn_commander_trait.10.t: "Umění plenit"
 learn_commander_trait.12.t: "Zuby a drápy"
 learn_commander_trait.13.t: "Do boje s horlivostí"
 learn_commander_trait.14.t: "Umění nájezdu"
 learn_commander_trait.91.t: "Na vlastní pěst"
 learn_commander_trait.1291.desc: "Ačkoli [teacher.GetTitledFirstName] není nablízku, pořád si mohu dokázat, že výcvik nebyl zbytečný. [ROOT.Char.Custom('CommanderTraitSkillDescription')|U] patří k tomu, co [Select_CString(ROOT.Char.IsFemale,'bych už měla ovládat','bych už měl ovládat')]. Zbývá jediná zkouška: cvičná bitva, která prověří mé schopnosti."
 learn_commander_trait.1291.a: "Je čas."
 learn_commander_trait.1291.b: "Když tu [teacher.GetFirstNameNoTooltip] není, můžu prostě říct, že se mi vedlo skvěle."
 learn_commander_trait.1391.desc: "„[teacher.GetFirstName], [Select_CString(teacher.IsFemale,'byla bys na mě hrdá','byl bys na mě hrdý')]!“\n\nCvičná bitva dopadla skvěle a [Select_CString(ROOT.Char.IsFemale,'dokázala jsem, že jsem výcvik zvládla','dokázal jsem, že jsem výcvik zvládl')]."
 learn_commander_trait.1391.a: "Teď to využít na skutečném bojišti!"
 learn_commander_trait.1491.desc: "Možná je dobře, že [teacher.GetTitledFirstName] u toho není...\n\nV cvičné bitvě se pokazilo úplně všechno a žádná z mých taktik nefungovala!"
 learn_commander_trait.1491.a: "Zdá se, že se ještě mám co učit..."
