l_polish:
 martial_authority.5000.t: "Obhlídka zapadákovů"
 martial_authority.5000.authoritative_religion.desc: "Třu si pulzující spánky, zatímco mi úředník čte už dvanácté letošní hlášení z [baron_1_lands.GetNameNoTier]. V několika podobně významných lénech má kontrola v posledních měsících slábne...\n\nKrátká obhlídka těchto odlehlých držav, jak mi velí povinnost, by mohla mou vládu nad nimi opět upevnit. Na druhou stranu mě [party_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] pozval na soukromou hostinu..."
 martial_authority.5000.relaxed_religion.desc: "Třu si pulzující spánky, zatímco mi úředník čte už dvanácté letošní hlášení z [baron_1_lands.GetNameNoTier]. V několika podobně významných lénech má kontrola v posledních měsících slábne, ale krátká obhlídka těchto odlehlých držav by mohla mou vládu nad nimi opět upevnit.\n\nNa druhou stranu mě [party_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] pozval na soukromou hostinu..."
 martial_authority.5000.a: "[Select_CString(ROOT.Char.IsFemale,'Správná','Správný')] [ROOT.Char.GetTitleAsNameNoTooltip] občas navštíví své poddané."
 martial_authority.5000.b: "Na tu hostinu mám přece #EMP povinnost#! jít!"
 martial_authority.5000.a.characters_baron_final_list: "[baron_1.GetShortUIName|U], [baron_2.GetShortUIName] a [baron_3.GetShortUIName]"
 martial_authority.5000.a.land_baron_final_list: "[baron_1_lands.GetNameNoTier], [baron_2_lands.GetNameNoTier] a [baron_3_lands.GetNameNoTier]"
 authority_central_control_modifier: "Rozsáhlý feudální dohled"
 martial_authority.8000.t: "Turnajový záchvat"
 martial_authority.8000.desc: "Můj [marshal.GetCouncilTitle] pořádá snad už stý letošní turnaj a já sotva udržím oči otevřené. Rázem mě probere zatažení za loket.\n\nJe to [fighting_child.GetName], mé ještě malé dítě — [fighting_child.Custom('GetDaughterSon')]. Navzdory všem zákonům přírody se potácí s kopím čtyřikrát delším, než je [Select_CString(fighting_child.IsFemale,'ona sama','on sám')], a někde vyhrabalo nepadnoucí přilbu, která mu neustále sjíždí přes oči.\n\n„[ROOT.Char.GetMotherFather|U] mi dovolí jedno kolo v klání, že?“"
 martial_authority.8000.a: "Dovolím to, ale nařídím všem, aby [fighting_child.GetName] neublížili."
 martial_authority.8000.tt: "[fighting_child.GetName] postupuje turnajem"
 martial_authority.8000.a.tt: "[fighting_child.GetName] se může osvědčit"
 martial_authority.8000.tt.failure: "[fighting_child.GetName] se nedokáže nijak vyznamenat"
 martial_authority.8000.b: "„Samozřejmě! Ať žádný bojovník nezadrží tvůj hněv!“"
 martial_authority.8000.c: "„Buď hodné dítě a běž si hrát s koňmi.“"
 martial_authority.8000.d: "„Tohle není místo pro děti. [fighting_child.Custom('GirlBoy')|U] v tvém věku sem nepatří.“"
 martial_authority_child_trait_gain: "[fighting_child.GetName] získává [Concept('trait','rys')|E]"
 martial_authority_brave: "$trait_brave$"
 martial_authority_arrogant: "$trait_arrogant$"
 martial_authority_wrathful: "$trait_wrathful$"
 martial_authority_one_eyed_child_title: "$trait_one_eyed$!"
 martial_authority_one_eyed_child: "[fighting_child.GetNameNoTooltip] [Select_CString(fighting_child.IsFemale,'přišla','přišel')] v turnaji o oko."
 martial_authority_disfigured_child_title: "$trait_disfigured$!"
 martial_authority_disfigured_child: "[fighting_child.GetNameNoTooltip] utrpí při turnaji zranění, které [Select_CString(fighting_child.IsFemale,'ji','ho')] znetvoří."
 martial_authority_unremarkable_child_title: "Tvé dítě je průměrné!"
 martial_authority.8000_injury: "[fighting_child.GetName] se zraní"
 martial_authority_unremarkable_child: "[fighting_child.GetNameNoTooltip] v turnaji vůbec ničím nevynikne."
 martial_authority.8100.desc: "Bojovníci v hromadném klání rozpačitě krouží kolem [fighting_child.GetName], zjevně se bojí, že dítěti ublíží. [fighting_child.GetNameNoTooltip] jim však oplácí zákeřnými údery a nedbá žádných turnajových pravidel.\n\nSleduji, jak čtyřmetrové ratiště zezadu prorazí lebku [murdered_knight.GetName], [Select_CString(murdered_knight.IsFemale,'která mi slouží jako','který mi slouží jako')] [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]. Ostatní dál útočí jen naoko, zatímco [fighting_child.GetNameNoTooltip] probodne mozek dalšímu soupeři.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má','Můj')] [ROOT.Char.GetLadyLord|l] to musí zastavit!“ žadoní [marshal.GetTitledFirstName]."
 martial_authority.8100.a: "[Select_CString(fighting_child.IsFemale,'Vypadá to, že máme vítězku!','Vypadá to, že máme vítěze!')]"
 martial_authority.8100.c: "[ROOT.GetCharacter.GetFaith.HighGodName]! [fighting_child.GetNameNoTooltip]! Omlouvám se za [Select_CString(fighting_child.IsFemale,'ni','něj')]."
 martial_authority.4000.t: "Rezavý nástroj"
 martial_authority.4000.desc: "V zaprášeném šeru zbrojnice přejíždím pohledem po nejrůznějších válečných zbraních. Pár otlučených kožených náholenníků, čerstvě nabroušený meč, kopí s ošoupaným ratištěm, nějaký... #EMP rezavý zemědělský nástroj?#!\n\nBeru ho do ruky. Možná se mezi zbraně připletl omylem? Potěžkám ho, prohlížím si podivně zahnutou čepel připomínající srp a zkusmo s ním máchnu proti nedaleké kroužkové košili.\n\nČepel prorazí kroužky a několik železných oček se rozsype po podlaze.\n\n#EMP Zajímavé.#!"
 martial_authority.4000.a: "Co kdyby se z toho dala udělat zbraň?"
 martial_authority.4000.b: "To by stačilo."
 martial_authority.4000.a.tt: "Zkoumáš možnosti, jak tento nástroj přeměnit ve zbraň."
 martial_authority.4000.b.tt: "Hledáš jiné způsoby, jak zdokonalit svou válečnickou dovednost."
 martial_authority.4001.t: "Rezavý nástroj: Samé možnosti..."
 martial_authority.4001.desc: "Vynesu malou čepel na polední slunce a prohlédnu si ji zblízka. Na jednom konci se zužuje do špičky, na druhém mizí v řapu a mezi nimi se táhne kus lehce zrezivělého, ale stále ostrého železa.\n\nZlom u špičky dodává nástroji zlověstné zahnutí. Člověk by řekl, že se hodí k prosekávání křovin. Nebo snad k hledání mezer ve zbroji?\n\nJe jasné, že by se z něj dala udělat válečná zbraň. Otázkou zůstává, jakou podobu by měla mít..."
 martial_authority.4001.a: "Kdyby se čepel narovnala, mohl by z ní být užitečný tesák..."
 martial_authority.4001.a.tt: "Pokusíš se z nástroje vyrobit krátkou bodnou zbraň."
 martial_authority.4001.b: "Co kdybychom ji připevnili na konec kopí?"
 martial_authority.4001.b.tt: "Vracíš se dovnitř a hledáš kus provazu..."
 martial_authority.4001.c: "Proč ho prostě nenechat tak, jak je?"
 martial_authority.4001.c.tt: "Možná může být účinnou zbraní i bez úprav?"
 martial_authority.4001.b.failure: "Nástroj jsi zlomil!"
 martial_authority_4001.dagger.tt: "Z nástroje vyrobíš primitivní tesák."
 martial_authority_4001.halberd.tt: "Z nástroje vyrobíš primitivní halapartnu."
 martial_authority_4001.billhook.tt: "Nabrousíš čepel."
 martial_authority_4001.fail.tt: "Z nástroje se ti nepodaří vyrobit nic užitečného."
 martial_authority.4002.t: "Rezavý nástroj: Provizorní čepel"
 martial_authority.4002.desc: "Jako [ROOT.Char.GetLadyLord|l] se ve skutečných úpravách válečných zbraní příliš nevyznám. Přes všechno mé nadšení je brzy jasné, že budu potřebovat odbornou pomoc.\n\nPřivolám [Select_CString(blacksmith.IsFemale,'místní kovářku','místního kováře')] [blacksmith.GetFirstName], [Select_CString(blacksmith.IsFemale,'která si','který si')] něco nesrozumitelně mumlá o panovnících a jejich oblíbených projektech. Po dni pilování a broušení je mé dílo konečně hotové.\n\nDříve zahnutá čepel je nyní rovná a zkrácená, zakončená zužující se špičkou, zatímco po její ploše vede zkosený žlábek. Není to krásná zbraň, ale zbraň to bezpochyby je."
 martial_authority.4002.a: "Je dokonalá!"
 martial_authority.4002.b: "Je dokonce lepší než ta moje!"
 martial_authority_4002.make.tt: "Získáš [improvised_dagger.GetName]"
 martial_authority.4003.t: "Rezavý nástroj: Provizorní halapartna"
 martial_authority.4003.desc: "Zapřu dříve spatřené kopí mezi nohu a stůl a hrubým provázkem přivážu zemědělský nástroj k hrotu kopí. Hlavice se zprvu znepokojivě viklá, ale následující den úpravu dokončí několik proužků vyvařené kůže, které mi opatří [blacksmith.GetFirstName].\n\nZbraň, kterou jsem vytvořil[Select_CString(ROOT.Char.IsFemale,'a','')], rozhodně vypadá patřičně. Délka kopí poskytuje dosah a umožňuje bodat, zatímco zahnutá čepel zemědělského nástroje by snadno stáhla jezdce z koně nebo pronikla do spár ve zbroji.\n\nJe to hrubá, narychlo sestavená zbraň, ale mám pocit, že by mohla být #EMP velice#! účinná..."
 martial_authority.4003.a: "Tak schválně, co na to ta vaše nóbl zbroj!"
 martial_authority.4003.b: "Je dokonce lepší než ta moje!"
 martial_authority_4003.make.tt: "Získáš [improvised_halberd.GetName]"
 martial_authority.4004.t: "Rezavý nástroj: Dokonalý tak, jak je"
 martial_authority.4004.desc: "Nástroj, kterému se podle [Select_CString(blacksmith.IsFemale,'místní kovářky','místního kováře')] [blacksmith.GetFirstName] říká „kosíř“, vypadá po nabroušení skutečně jako válečná zbraň.\n\nZ řapu vyrůstá ostří, které se táhne až do těžké zahnuté hlavice. Čerstvě nabroušená špička se leskne v poledním slunci, když ji zasunu do spáry ve staré zbroji z vyvařené kůže a prudce trhnu zpět. Jediným pohybem přeseknu všechny upevňovací řemínky."
 martial_authority.4004.a: "Jaká další tajemství asi naši skromní rolníci skrývají?"
 martial_authority.4004.b: "Tohle se mi líbí. Rozdejte je po celém panství!"
 martial_authority_4004.make.tt: "Získáš [improvised_billhook.GetName]"
