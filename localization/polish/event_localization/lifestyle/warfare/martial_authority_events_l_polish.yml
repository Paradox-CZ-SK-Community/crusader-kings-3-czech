l_polish:
 martial_authority.1031.t: "Slitování se žoldnéři"
 martial_authority.1031.desc: "Ruch hostince, [ROOT.Char.Custom('RegionalAlcoholicDrink')] po ruce, klidný večer po dlouhém dni výcviku... Do mě vrazí žoldnéř potácející se po úderu a vyrazí mi pohár z ruky. Spolu s pitím rozlévajícím se po podlaze mizí i veškerá naděje na odpočinek.\n\n„Prosím, [ROOT.Char.Custom('FormOfAddressForLiege')].“ Hostinský žadoní: „Tuhle bandu vede [scoped_mercenary.GetFirstNameNoTooltip] a už celé dny mi tu pijí zadarmo! A jejich rvačky děsí personál i hosty!“"
 martial_authority.1031.a: "Zaplatím za vaše pití, pokud okamžitě odejdete."
 martial_authority.1031.b: "Vojáci, vyhoďte je!"
 martial_authority.1031.c: "Jsou příliš opilí, než aby představovali skutečnou hrozbu. Tohle bude rychlé."
 martial_authority.2040.t: "Spor v táboře"
 martial_authority.2040.desc: "Když moje armáda rozbije tábor, zaslechnu rozruch z ubikací $knight_culture_player_plural_possessive_no_tooltip_lowercase$.\n\nVydám se zjistit, co se děje, a nacházím [first.GetTitledFirstName] a [second.GetTitledFirstName] uprostřed prudké hádky, zatímco několik přihlížejících je ještě povzbuzuje."
 martial_authority.2040.a: "Promluvím k davu o jednotě."
 martial_authority.2040.a.success: "Má slova všechny uklidní"
 martial_authority.2040.a.failure: "Má slova hádku nijak nezmírní"
 martial_authority.2040.a.failure.tt: "Rvačka se rozhoří naplno a přihlížející se přidají!"
 martial_authority.2040.b: "Za tu nekázeň je nechte zbičovat!"
 martial_authority.2040.c: "Kašlu na to, jdu do stanu a zacpu si uši..."
 martial_authority.2040.c.drunkard: "Kašlu na to, jdu do stanu a něco si dám..."
 martial_authority.2040.c.hashishiyah: "Kašlu na to, jdu si dát trochu hašiše."
 martial_authority.2041.t: "Urovnání"
 martial_authority.2041.desc: "Vstanu a promluvím o tom, že všichni bojujeme za [ROOT.Char.GetPrimaryTitle.GetName] a proti nepřátelům musíme stát jednotně. Pokud nebudeme, čeká venku dost těch, kdo by našich vnitřních svárů rádi využili, zabrali naši půdu a vnutili nám svou vládu.\n\nKdyž domluvím, [first.GetTitledFirstName] a [second.GetTitledFirstName] se zahanbeně omluví a začnou se chystat na noc."
 martial_authority.2041.a: "Společně jsme silnější."
 martial_authority.2042.t: "Rvačka"
 martial_authority.2042.desc: "Mé prosby, abychom všichni hodili spory za hlavu, padají na hluché uši a hádka přeroste v pořádnou rvačku.\n\nPití i jídlo létají vzduchem, jak po sobě všichni začnou házet vším, co jim přijde pod ruku."
 martial_authority.2042.a: "Tak se taky přidám!"
 martial_authority.2042.a.success: "Z rvačky vyjdu jako [Select_CString(ROOT.Char.IsFemale,'jediná vítězka','jediný vítěz')]"
 martial_authority.2042.a.failure: "V divoké rvačce utrpím zranění"
 martial_authority.2042.b: "To je ale spoušť..."
 martial_authority.2050.t: "Pravá ruka"
 martial_authority.2050.desc.opening: "Ať už mám jako [ROOT.Char.GetTitleAsNameNoTooltip] údajně sebevětší autoritu, nemohu být všude najednou, ať už [ROOT.Char.Custom('GetRealmOrDomicile')|l] řídím sebelépe. Vždy se najde někdo, kdo „zapomene“ plnit mé rozkazy, jakmile obrátím pozornost jinam.\n\nPrávě tady může pomoci [right_hand_person.Custom2('MyCharacterIntroduction', ROOT.Char)], kdo dosud věrně prosazuje má nařízení"
 martial_authority.2050.desc.vassal: "na svém vlastním území."
 martial_authority.2050.desc.knight: "při cestách krajem."
 martial_authority.2050.desc.courtier: "přímo tam, kde mám [ROOT.Char.Custom('GetCourt')|l]."
 martial_authority.2050.desc.ending: "[Select_CString(right_hand_person.IsFemale,'Mohla by','Mohl by')] se stát mou pravou rukou a převzít aktivnější roli ve správě? [ROOT.Char.Custom('GetRealmOrDomicile')|U] přece nemohu řídit úplně [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 martial_authority.2050.a: "Ano, bude mi dobře sloužit!"
 martial_authority.2050.a.tt: "Ty a [right_hand_person.GetShortUIName] spolu budete trávit více času"
 martial_authority.2050.b: "Ty problémy zvládne [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marshal'))] [marshal.GetFirstNameNoTooltip]."
 martial_authority.2050.c: "Když budu pracovat tvrději, zvládnu všechno [Select_CString(ROOT.Char.IsFemale,'sama','sám')]!"
 martial_authority.2050.toast.title: "[right_hand_person.GetShortUIName] ti nyní slouží jako pravá ruka"
 martial_authority.2051.t: "Pravá ruka"
 martial_authority.2051.desc: "[ROOT.Char.Custom('GetRealmOrDomicile')|U] nám dává spoustu práce. [right_hand_person.GetTitledFirstName] mi se správou pomáhá a při společné práci zjišťujeme, že toho máme překvapivě mnoho společného!\n\nBěhem společné práce jsme si díky tomu vybudovali pevné pouto a začínám přemýšlet, co nám budoucnost přinese..."
 martial_authority.2051.a: "Z toho bude pevné přátelství!"
 martial_authority.2051.b: "Je tohle jiskra něčeho víc?"
 martial_authority.2051.c: "Musíme náš vztah udržet čistě pracovní."
 martial_authority.2052.message: "[Select_CString(ROOT.Char.IsFemale,'Uvěznila jsem','Uvěznil jsem')] svou pravou ruku"
 martial_authority.2053.toast: "[imprisoner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(imprisoner.IsFemale,'uvěznila','uvěznil')] mou pravou ruku a dokud nebude na svobodě, nemůže mi sloužit."
 martial_authority.2054.toast: "Má pravá ruka se vrací do mých služeb"
 martial_authority.2054.toast.no_return: "Má pravá ruka se do mých služeb nevrací"
 martial_authority.2055.message: "Má pravá ruka opustila mé služby"
 martial_authority.2055.message.incapable: "Má pravá ruka už není schopna služby"
 martial_authority.2056.message: "Má pravá ruka zemřela"
 martial_authority.2056.message.death: "[Select_CString(ROOT.Char.IsFemale,'Zabila jsem','Zabil jsem')] svou pravou ruku"
 martial_authority_special.1100.t: "Inkognito"
 martial_authority_special.1100.start.desc: "Dnes večer odkládám všechny znaky své hodnosti a vydávám se anonymně mezi své vojáky. Je klidný večer, takže když vypukne hádka, slyším každé slovo naprosto jasně.\n\n"
 martial_authority_special.1100.heavy_infantry.desc: "[Select_CString(soldier_friend.IsFemale,'Pěšákyně','Pěšák')]"
 martial_authority_special.1100.cavalry.desc: "[Select_CString(soldier_friend.IsFemale,'Jezdkyně','Jezdec')]"
 martial_authority_special.1100.archer.desc: "[Select_CString(soldier_friend.IsFemale,'Lučištnice','Lučištník')]"
 martial_authority_special.1100.skirmisher.desc: "[Select_CString(soldier_friend.IsFemale,'Harcovnice','Harcovník')]"
 martial_authority_special.1100.pikemen.desc: "[Select_CString(soldier_friend.IsFemale,'Bojovnice s píkou','Bojovník s píkou')]"
 martial_authority_special.1100.end.desc: "se snaží přesvědčit [Select_CString(officer.IsFemale,'svou velitelku','svého velitele')], [officer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], o výhodách jiné strategie. [officer.GetFirstNameNoTooltip] o tom nechce ani slyšet — když se přiblížím, [Select_CString(officer.IsFemale,'rozzuřená velitelka zvedne','rozzuřený velitel zvedne')] pěst..."
 martial_authority_special.1100.a: "Zakročím a [Select_CString(soldier_friend.IsFemale,'vojákyni','vojáka')] ochráním."
 martial_authority_special.1100.a.success.tt: "V boji beze zbraně porazíš [Select_CString(officer.IsFemale,'velitelku','velitele')]"
 martial_authority_special.1100.a.failure.tt: "V boji beze zbraně tě [Select_CString(officer.IsFemale,'velitelka porazí','velitel porazí')]"
 martial_authority_special.1100.b: "Urovnám spor mezi [officer.GetFirstNameNoTooltip] a [Select_CString(soldier_friend.IsFemale,'vojákyní','vojákem')]."
 martial_authority_special.1100.b.success.tt: "Přesvědčíš [Select_CString(officer.IsFemale,'velitelku','velitele')]"
 martial_authority_special.1100.b.failure.tt: "[Select_CString(officer.IsFemale,'Velitelka ti pořádně vyčiní','Velitel ti pořádně vyčiní')]"
 martial_authority_special.1100.c: "Udělám z nich odstrašující příklad."
 martial_authority_special.1100.d: "Nenápadně zmizím a ten nápad vydám za svůj."
 martial_authority_special.1101.desc: "Výcvik se vyplatil. O několik okamžiků později už [officer.GetTitledFirstName] bezmocně vězí v mém pevném chvatu. „Ať je to pro vás ponaučení,“ prohlásím nahlas, aby mě všichni slyšeli. „[ROOT.Char.GetTitleTierName|U] nemá pochopení pro zabedněné hlupáky. Bez ohledu na jejich hodnost.“"
 martial_authority_special.1101.end.desc: "\n\n[Select_CString(soldier_friend.IsFemale,'Vojákyně se rozzáří vděčností','Voják se rozzáří vděčností')]. „Děkuji, [ROOT.Char.Custom('FormOfAddressForLiege')]. [Select_CString(soldier_friend.IsFemale,'Věrnější služebnici','Věrnějšího služebníka')] než [soldier_friend.GetFullNameNoTooltip] nenajdete.“"
 martial_authority_special.1101.a: "Ta strategie stojí za vyzkoušení."
 martial_authority_special.1101.b: "Proberu strategii podrobněji a přiučím se válečnému umění."
 martial_authority_special.1102.desc: "[soldier_friend.GetTitledFirstName] ví, jaké následky by mělo napadení [Select_CString(officer.IsFemale,'velitelky','velitele')], a proto se přicházejícím ranám vůbec nebrání. Jakmile začne téct krev, vrhnu se mezi ně.\n\nMožná jsem měl mít dost rozumu a nepouštět se do rvačky [Select_CString(officer.IsFemale,'se zkušenou válečnicí','se zkušeným válečníkem')]. Nakonec musím odhalit svou totožnost a teprve potom mě [officer.GetTitledFirstName] pustí. Než se zpráva rozšíří, odplížím se zpátky do svého stanu..."
 martial_authority_special.1102.a: "Alespoň jsem se naučil pár triků."
 martial_authority_special.1103.desc: "Když zvýším hlas, [officer.GetTitledFirstName] zarazí ruku uprostřed úderu. Síla emocí v mých slovech zjevně zasáhne citlivé místo — ve tváři se objeví rozpaky. Následuje koktavá omluva a rychlý ústup."
 martial_authority_special.1501.t: "[Select_CString(deserting_soldier.IsFemale,'Dezertérka','Dezertér')]"
 martial_authority_special.1501.desc: "Procházím oblast [ravaged_place.GetName] na hlídce a snažím se posoudit nedávné škody v hrabství. Než dojdu dál, [deserting_soldier.GetTitledFirstName] mě zastaví:\n\n„Pamatuji si přesně tohle místo."
 martial_authority_special.1501.desc_battle: "Zpustošila ho jedna z našich nedávných bitev!"
 martial_authority_special.1501.desc_raid: "Bylo přepadeno a vypleněno!"
 martial_authority_special.1501.desc_outro: "[Select_CString(deserting_soldier.IsFemale,'Viděla jsem','Viděl jsem')] ty hrůzy, slyšel[Select_CString(deserting_soldier.IsFemale,'a','')] ten křik, viděl[Select_CString(deserting_soldier.IsFemale,'a','')] krev... oheň.“ [deserting_soldier.GetTitledFirstName] zbledne. „J-já už tady nemůžu zůstat. Nezůstanu!“"
 martial_authority_special.1501.a: "„Já také. Ale musíme vydržet.“"
 martial_authority_special.1501.a_tt: "Vyprávíš [deserting_soldier.GetFirstNameNoTooltip] o vlastních podobných zkušenostech a o tom, jaké pocity v tobě vyvolávají"
 martial_authority_special.1501.a.success: "[deserting_soldier.GetFirstName] se uklidní"
 martial_authority_special.1501.a.failure: "[Select_CString(deserting_soldier.IsFemale,'Její bludy se šíří','Jeho bludy se šíří')]"
 martial_authority_special.1501.b: "Tohle už se ti nikdy nestane."
 martial_authority_special.1501.c: "„Vzpamatuj se!“"
 martial_authority_special.3000.t: "Ukázka vůdčích schopností"
 martial_authority_special.3000.desc: "[martial_authority_friend.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] se v poslední době často motá kolem zasedání mé rady. Vím o zájmu, který má o otázky vůdcovství, a nemohu se zbavit dojmu, [Select_CString(martial_authority_friend.IsFemale,'že čeká, až na ni udělám dojem','že čeká, až na něj udělám dojem')].\n\n[Select_CString(ROOT.Char.IsFemale,'Mohla bych','Mohl bych')] se dát do řeči. Na druhou stranu by možná bylo lepší, [Select_CString(martial_authority_friend.IsFemale,'kdyby mě prostě viděla při obchůzce mezi vojáky','kdyby mě prostě viděl při obchůzce mezi vojáky')]. [ROOT.Char.Custom('WomenMenPeople_GenderPreference')|U] přece tvoří mé řady a něco na tom je, když člověk alespoň #EMP předstírá#!, že zná tvář každého vojáka."
 martial_authority_special.3000.a: "Promluvme si o způsobech komunikace."
 martial_authority_special.3000.b: "Měli bychom jít pozdravit pár nováčků!"
 respected_figurehead: "Respektovaná autorita"
