l_polish:
 martial_chivalry.0001.t: "Nedůstojná výzva"
 martial_chivalry.0001.opening: "Když [duel_opponent.GetName] vstoupí na cvičiště, zprvu mi [Select_CString(duel_opponent.IsFemale,'připadá jako obyčejná pěšačka bez špetky rozumu','připadá jako obyčejný pěšák bez špetky rozumu')]."
 martial_chivalry.0001.hard_fight: "Souboj je však mnohem tvrdší, než [Select_CString(ROOT.Char.IsFemale,'jsem čekala','jsem čekal')], a postupně je jasné, že [duel_opponent.GetNameNoTooltip] nedokáže krotit své divoké a zuřivé údery natolik, aby mě [Select_CString(duel_opponent.IsFemale,'nezranila','nezranil')]!"
 martial_chivalry.0001.easy_fight: "\n\nAčkoli [duel_opponent.GetTitledFirstName] zprvu nevypadá nebezpečně, brzy je jasné, že nedokáže krotit své divoké a zuřivé údery natolik, aby mě [Select_CString(duel_opponent.IsFemale,'nezranila','nezranil')]!"
 martial_chivalry.0001.conclusion: "Odzbrojit [duel_opponent.GetNameNoTooltip] se rázem stává otázkou života a smrti.\n\nKdyž meč konečně dopadne na zem, jen stěží skrývám úlevu."
 martial_chivalry.0001.a: "Víc takových jako ty by se mi hodilo!"
 martial_chivalry.0001.a.tt: "[duel_opponent.GetTitledFirstName] ti snad bude dobře sloužit."
 martial_chivalry.0001.b: "[Select_CString(duel_opponent.IsFemale,'Tahle pěšačka','Tenhle pěšák')] — a moji vojáci — dostanou přednášku o cti."
 martial_chivalry.0001.b.tt: "Tvým vojákům by také prospělo vysvětlení, co je při osobním souboji správné a co ne."
 martial_chivalry.0001.c: "Na místě [Select_CString(duel_opponent.IsFemale,'ji','ho')] skolím."
 martial_chivalry.0001.c.tt: "Setnout hlavu jediným úderem zaručeně zapůsobí na přítomné pěšáky — i šlechtice."
 martial_chivalry.0002.t: "Náhlý otřes"
 martial_chivalry.0002.desc: "[Select_CString(ROOT.Char.IsFemale,'Už tolikrát jsem cválala, mířila a udeřila','Už tolikrát jsem cválal, mířil a udeřil')], až mám pocit, že už mě nic nemůže vyvést z rytmu. Při dalším cvalu přes cvičiště však nějaký rozruch mimo mé zorné pole přiměje koně vzepnout se.\n\nSetrvačnost mě na okamžik drží na jeho hřbetě, zatímco sebou začne zmítat. Pak jako by se čas zpomalil a já cítím, jak ztrácím rovnováhu."
 martial_chivalry.0002.a: "Klid, [ROOT.Char.Custom('RandomGirlBoy')]! Klid!"
 martial_chivalry.0002.a_success: "Udržíš se v sedle"
 martial_chivalry.0002.a_failure: "Kůň tě shodí"
 martial_chivalry.0002.increase_horse_mastery: "Mé jezdecké umění se zlepšuje a s ním i má odbornost ve [Concept('martial_lifestyle','válečnickém životním stylu')|E]."
 martial_chivalry.0002.b: "Skočím na pevnou zem — jistota je jistota!"
 martial_chivalry.0003.t: "Mám to pod kontrolou"
 martial_chivalry.0003.desc: "Cítím, jak mě to hází ze strany na stranu, ale nic mě nedonutí povolit sevření otěží ani sedla.\n\nMé povely koně nakonec uklidní a brzy už znovu netrpělivě podupává po udusané zemi, pevný a klidný jako dřív."
 martial_chivalry.0003.a: "To je ale divoké zvíře."
 martial_chivalry.0003.b: "O výcvik tohoto koně se postarám osobně."
 martial_chivalry.0003.a.tt: "Když nic jiného, tato příhoda tě naučila zase o něco lépe ovládat koně."
 martial_chivalry.0004.t: "Neslavná podívaná"
 martial_chivalry.0004.desc: "Tvrdě dopadám na udusanou zem a bolest nárazu mi projede každou kostí v těle.\n\nPodkoní přibíhá jen o okamžik později."
 martial_chivalry.0004.a: "Proklaté zvíře!"
 martial_chivalry.0005.t: "„To je ale špatný den na vyjížďku“"
 martial_chivalry.0005.desc: "Podkoní se mi snaží pomoct na nohy, ale okřiknu ho, ať toho nechá.\n\nNáraz na zem mi vyslal bolest do celého těla a stará rána teď pálí hůř než tehdy, když byla čerstvá!"
 martial_chivalry.0005.a: "Dnes jsem vůbec [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] vstávat z postele."
 martial_chivalry.0006.t: "Co se stalo?"
 martial_chivalry.0006.desc: "Na dopad na zem si vůbec nevzpomínám. Vím jen, že mě celé tělo pálí bolestí. Nade mnou se shlukují rozmazané tváře a hledí dolů.\n\nVšechno potemní."
 martial_chivalry.0006.a: "Jak [Select_CString(ROOT.Char.IsFemale,'jsem se dostala','jsem se dostal')] do postele? Kde je můj kůň?"
 martial_chivalry.0007.t: "Království za koně"
 martial_chivalry.0007.desc: "Jízda na koni mi měla ulevit. Trocha námahy měla pomoct hojení. Když letím vzduchem, bolest ran mě na krátký okamžik beztíže opouští. Poprvé po týdnech je mi skutečně dobře.\n\nKdyž tvrdě narazím na zem, už se nemusím trápit bolestí ani žádnými jinými pozemskými starostmi."
 martial_chivalry.0007.a: "Co mě čeká na druhé straně?"
 martial_chivalry.0010.t: "[ROOT.Char.Custom('signature_weapon')|U]: Cesta mistrovství"
 martial_chivalry.0010.desc: "Nekonečný třesk kovu o kov, odírání zbroje, štiplavý pot... Je to tanec stejně důvěrně známý jako vyčerpávající. [ROOT.Char.Custom('SignatureWeaponAction')|U], útočím, uhýbám, kryji se — a znovu od začátku.\n\nMožná by mi prospělo procvičit své schopnosti s jinou zbraní."
 martial_chivalry.0010.a: "[ROOT.Char.Custom('signature_weapon')|U] zůstane mou věrnou zbraní."
 martial_chivalry.0010.b: "Dost té jednotvárnosti. Podejte mi jinou zbraň!"
 martial_chivalry.0010.b.tt1: "Ukážeš jim, jak se to dělá"
 martial_chivalry.0010.b.tt2: "Klopýtneš a zraníš se"
 martial_chivalry.1011.t: "Odpočinek pro znavené"
 martial_chivalry.1011.desc: "Dlouhý den výcviku s vojáky se chýlí ke konci a všichni už potřebujeme jídlo a odpočinek.\n\nKdyž hledáme místo k táboření, spatříme v dálce starý opuštěný hrad. [ROOT.Char.Custom('quirk_pos_personal_pp')|U] prohlásím: „Dnes v noci se utáboříme tam.“\n\nSlunce zapadá a s každým krokem k ruinám působí hrad zlověstněji. Netrvá dlouho a vojáci si začnou šeptat o přízracích."
 martial_chivalry.1011.a: "Vydejme se dovnitř. Určitě tam čeká nějaký poklad!"
 martial_chivalry.1011.a.tt: "Kdo ví, co uvnitř najdeš?"
 martial_chivalry.1011.b: "Postavme stany venku. Je čas si odpočinout."
 martial_chivalry.1012.t: "Hledání neznáma"
 martial_chivalry.1012.desc: "Uvnitř hradu vládne tma, vlhko a pustota. Po životě nezůstala ani stopa.\n\nKdyž vzhlédnu k rozpadajícímu se schodišti, zahlédnu cosi, co by mohly být zbytky honosných tapisérií a starých obrazů. Dolů po točitých schodech však vidím jen temnotu, která se táhne hluboko pod hrad."
 martial_chivalry.1012.a: "Prohledáme horní patra!"
 martial_chivalry.1012.a.success: "Najdeme velký poklad"
 martial_chivalry.1012.a.failure: "Najdeme cetky a tretky"
 martial_chivalry.1012.b: "Co se asi skrývá v temnotě pod námi?"
 martial_chivalry.1012.b.tt1: "#F „Přísahám, že se ten stín právě pohnul! Je to... krev? Co to bylo za zvuk?!“#!"
 martial_chivalry.1012.b.success: "Postavíš se svému strachu"
 martial_chivalry.1012.b.failure: "Tohle místo tě děsí"
 martial_chivalry.1021.t: "Chaos bitvy"
 martial_chivalry.1021.desc: "Meč se odráží od mého náprsního plátu, loket naráží do přilby a voják se snadno vyhýbá mému neohrabanému protiútoku... Cvičná bitva zuří všude kolem, ale nedokážu se soustředit.\n\nJakmile boj na chvíli poleví, mám chuť spustit zbraň, ale vím, že druhý útok začne každým okamžikem."
 martial_chivalry.1021.a: "Na chvíli se stáhnu."
 martial_chivalry.1021.b: "Vrhnout se útoku vstříc!"
 martial_chivalry.1021.b.success: "Můj výpad budí úžas"
 martial_chivalry.1021.b.failure: "Klopýtnu a zraním se"
 martial_chivalry.2010.t: "Výzva"
 martial_chivalry.2010.start.desc: "Právě cvičně bojuji s jedním ze svých vojáků a na čele se mi perlí pot, když mě přepadne podivný pocit, že mě někdo sleduje. Ohlédnu se přes rameno a spatřím [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)],"
 martial_chivalry.2010.like.desc: "[Select_CString(challenger.IsFemale,'která mi zamává','který mi zamává')]. Přijdu [challenger.GetNameNoTooltip] pozdravit.\n\nChvíli si povídáme o výcviku se zbraněmi a vyměňujeme si triky a rady. Právě když se chystám vrátit k dalšímu kolu, [challenger.GetTitledFirstName] náhle ožije a navrhne, abychom si zacvičili spolu."
 martial_chivalry.2010.dislike.desc: "[Select_CString(challenger.IsFemale,'která si mě prohlíží','který si mě prohlíží')] a přitom ledabyle mává svou zbraní — [challenger.Custom('signature_weapon')].\n\n„[ROOT.Char.GetTitleTierName]!“ zahřmí přes nádvoří hlas [challenger.GetFirstName]. „Nechcete své schopnosti raději poměřit se mnou?“"
 martial_chivalry.2010.a: "Výzvu přijímám!"
 martial_chivalry.2010.a.success.tt: "Vyhraješ cvičný souboj"
 martial_chivalry.2010.b: "Raději ne..."
 martial_chivalry.2010.a.failure1.tt: "[challenger.GetShortUINameNoTooltip] získá v souboji převahu"
 martial_chivalry.2010.a.failure2.tt: "Prohraješ cvičný souboj"
 martial_chivalry.2011.t: "Navrch"
 martial_chivalry.2011.start.desc: "Zvuk mé zbraně, [ROOT.Char.Custom('signature_weapon')], narážející do zbraně [challenger.GetName], [challenger.Custom('signature_weapon')], se rozléhá mezi zdmi nádvoří. Všechny oči se upírají na nás. Každý chce vidět, jak jejich [ROOT.Char.GetTitleTierName] a [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('challenger'))] měří síly.\n\n"
 martial_chivalry.2011.end.desc: "Když vyrazím vpřed, dav propukne v jásot a jeho obdiv mi dodá odvahu. Místo abych [Select_CString(ROOT.Char.IsFemale,'ustoupila','ustoupil')], zkusím novou techniku, kterou už nějakou dobu nacvičuji. Pohyb projde mým tělem až do zbraně, jako bychom byli jedno. [challenger.GetTitledFirstName] je proti mně [Select_CString(challenger.IsFemale,'bezbranná','bezbranný')]."
 martial_chivalry.2011.a: "Tady to ukončíme! Dobrý boj."
 martial_chivalry.2011.b: "Ukážu [challenger.GetNameNoTooltip], proč mě už nemá znovu vyzývat!"
 martial_chivalry.2012.t: "[challenger.Custom('signature_weapon')|U] u mého krku"
 martial_chivalry.2012.end.desc: "Předchozí výcvik mě musel vyčerpat, protože se pohybuji těžkopádně a nedokážu se soupeři vyrovnat. Když vyrazím vpřed, [challenger.GetNameNoTooltip] už je pryč a mé kryty přicházejí na poslední chvíli. Netrvá dlouho a ocitám se na zemi před [challenger.GetNameNoTooltip]."
 martial_chivalry.2012.a: "Vzdávám se! Dobrý boj."
 martial_chivalry.2012.b: "Vzdávají se jen zbabělci!"
 martial_chivalry.2012.b.failure.tt: "#F Prohraješ cvičný souboj.#!"
 martial_chivalry.2013.t: "Krvavé ponížení"
 martial_chivalry.2013.end.desc: "Díky podlému triku získá [challenger.GetFirstName] hned zkraje převahu. Není čas protestovat a nechci vypadat jako ufňukanec. Nedokážu to však pustit z hlavy a frustrace mě vyvede z rovnováhy. Neuváženě vyrazím vpřed a soupeř mě srazí k zemi."
 martial_chivalry.2013.a: "Ten proradný [challenger.Custom2('InsultNoun', ROOT.Char)]!"
 martial_chivalry.2014.t: "Navzdory všemu"
 martial_chivalry.2014.desc: "Podle výkřiků davu lidé sotva věří vlastním očím, když se odkutálím stranou před zbraní [challenger.GetFirstName] — [challenger.Custom('signature_weapon')] — a jediným rychlým pohybem [challenger.GetNameNoTooltip] odzbrojím. Vím, že to byl nebezpečný manévr, ale někdy je třeba podstoupit velké riziko, aby člověk dosáhl slavného vítězství."
 martial_chivalry.2014.a: "Na můj triumf se jen tak nezapomene!"
 martial_chivalry.2015.t: "Veřejný posměch"
 martial_chivalry.2015.desc: "Podniknu zoufalý poslední útok, ale [challenger.GetFirstName] je [Select_CString(challenger.IsFemale,'rychlá','rychlý')]. Instinktivně vykryje můj úder, jenže protože útok přišel nečekaně, nemá svou zbraň zcela pod kontrolou. Paží mi projede ochromující bolest."
 martial_chivalry.2015.a: "Proč jsem to [Select_CString(ROOT.Char.IsFemale,'dělala','dělal')]?!"
 martial_chivalry.3000.t: "Neukáznění rekruti"
 martial_chivalry.3000.desc: "Dnes sleduji [bad_commander.GetTitledFirstName], jak cvičí část svých nových rekrutů. Pod [Select_CString(bad_commander.IsFemale,'jejím','jeho')] velením však připomínají spíš neuspořádanou chátru než armádu.\n\nPozoruji, jak se situaci snaží dostat pod kontrolu, očividně už na hranici svých sil."
 martial_chivalry.3000.desc.callous: " [ROOT.Char.GetPrimaryTitle.GetName] si takovou ostudu nezaslouží. Tohle nelze tolerovat!"
 martial_chivalry.3000.desc.compassionate: " [Select_CString(ROOT.Char.IsFemale,'Sama jsem se už v podobné situaci ocitla','Sám jsem se už v podobné situaci ocitl')] a vím, jak těžké je pracovat s nevycvičenými vojáky."
 martial_chivalry.3000.desc.fallback: " Výcvik nových vojáků nikdy není snadný, ale [bad_commander.GetTitledFirstName] musí předvést něco mnohem lepšího."
 martial_chivalry.3000.a: "Pokárám [Select_CString(bad_commander.IsFemale,'ji','ho')] za tohle selhání."
 martial_chivalry.3000.b: "Ukážu [Select_CString(bad_commander.IsFemale,'jí','mu')], co vím o velení."
 martial_chivalry.3000.b.attempt: "[bad_commander.GetTitledFirstNameNoTooltip] se rozhodne podle své osobnosti"
 martial_chivalry.3000.b.tt.s: "[bad_commander.GetTitledFirstNameNoTooltip] přijímá tvou radu"
 martial_chivalry.3000.b.tt.f: "[bad_commander.GetTitledFirstNameNoTooltip] odmítá poslouchat"
 martial_chivalry.3000.c: "Po výcviku [Select_CString(bad_commander.IsFemale,'ji','ho')] povzbudím."
 martial_chivalry.3000.response.desc: "[my_liege.GetTitledFirstName] se dnes [Select_CString(my_liege.IsFemale,'zastavila','zastavil')], aby mě [Select_CString(my_liege.IsFemale,'pozorovala','pozoroval')], když jsem [Select_CString(ROOT.Char.IsFemale,'cvičila','cvičil')] své nové odvedence.\n\nK mé ostudě se moji neukáznění vojáci při cvičení změnili v chaotický dav!"
 martial_chivalry.3001.t: "Ponížení!"
 martial_chivalry.3001.desc: "A co hůř, [my_liege.GetFirstName] z tohohle selhání [Select_CString(my_liege.IsFemale,'obvinila','obvinil')] přímo mě."
 martial_chivalry.3001.a: "Potrestám ty rekruty za to, že mě zesměšnili!"
 martial_chivalry.3001.b: "Pro dobro panství si musím vést lépe."
 martial_chivalry.3001.c: "[Select_CString(ROOT.Char.IsFemale,'Zklamala jsem','Zklamal jsem')] [my_liege.GetTitledFirstNameNoTooltip]."
 martial_chivalry.3002.t: "Zásah"
 martial_chivalry.3002.desc: "A teď mě [my_liege.GetFirstName] poučuje o úplných základech výcviku nových vojáků!"
 martial_chivalry.3002.a: "Přijmu tu radu s grácií."
 martial_chivalry.3002.b: "Ať je ta chátra prokletá za to, že mě zesměšnila!"
 martial_chivalry.3003.t: "Rada přijata"
 martial_chivalry.3003.desc.1: "Zatímco se rekruti pokoušejí pokračovat ve výcviku, [bad_commander.GetTitledFirstName] se mnou poodejde stranou. „Při výcviku nových vojáků je nejdůležitější vštípit jim kázeň!“ vysvětluji. „Bez ní se nemůžeš spolehnout, že budou plnit tvé rozkazy...“"
 martial_chivalry.3003.desc.2: "\n\nKdyž skončím, [bad_commander.GetFirstName] mi poděkuje a vrátí se na cvičiště, kde rychle dostane situaci pod kontrolu."
 martial_chivalry.3003.a: "Díky tomu bude [bad_commander.GetFirstNameNoTooltip] [Select_CString(bad_commander.IsFemale,'lepší velitelkou','lepším velitelem')]."
 martial_chivalry.3004.t: "Rada odmítnuta!"
 martial_chivalry.3004.desc: "[bad_commander.GetTitledFirstName] ucítí mé poklepání na rameno, rozhodí rukama a zakřičí: „Tohle #EMP není#! moje vina, [ROOT.Char.GetFirstNameNoTooltip]! Tihle pitomí sedláci nepoznají pravou ruku od levé! Jak má z téhle chátry kdokoli udělat armádu?!“"
 martial_chivalry.3004.b: "Tuhle drzost si [bad_commander.GetTitledFirstNameNoTooltip] ještě odskáče!"
 martial_chivalry.3004.a: "[Select_CString(ROOT.Char.IsFemale,'Čekala jsem','Čekal jsem')] od tebe víc, [bad_commander.GetFirstNameNoTooltip]."
 martial_chivalry.3005.t: "Útěcha"
 martial_chivalry.3005.desc: "K mé úlevě za mnou [my_liege.GetFirstName] po cvičení [Select_CString(my_liege.IsFemale,'přišla','přišel')], aby mě [Select_CString(my_liege.IsFemale,'utěšila a povzbudila','utěšil a povzbudil')] v mém úsilí."
 martial_chivalry.3005.a: "[Select_CString(my_liege.IsFemale,'Měla právo mě pokárat, ale neudělala to.','Měl právo mě pokárat, ale neudělal to.')]"
 martial_chivalry.4000.t: "Půlnoční jízda"
 martial_chivalry.4000.desc: "Výkřik služebnictva mě vytrhne ze snů.\n\n„Zloději! Nájezdníci!“ ozývá se křik. „[ROOT.Char.GetTitleAsNameNoTooltip], mladí válečníci ženou tvá stáda do tmy a tvrdě je pohánějí směrem k zemím [raiders.GetTitledFirstName]!“\n\nZ postelí se vyhrnou $knight_culture_player_plural_no_tooltip_lowercase$ a ženou se k sedlům. [ROOT.Char.Custom('signature_weapon')|U] spočívá v mé ruce, když mířím ke koni.\n\n Hodina je pokročilá a před námi je dlouhá cesta."
 martial_chivalry.4000.sleepy: "\n\nMyšlenkami se vracím k měkké, teplé posteli..."
 martial_chivalry.4000.angry: "Ale zloděje musíme zastavit!"
 martial_chivalry.4000.a: "Až je obklíčíme, zpanikaří."
 martial_chivalry_special.4000.a.tt: "Vedeš své jezdce, aby zloděje dobytka předjeli a obklíčili."
 martial_chivalry_special.4000.a.tt_success: "Tvůj protiútok vyjde dokonale"
 martial_chivalry_special.4000.a.tt_failure: "Zloději tě odrazí"
 martial_chivalry_special.4000.a.tt_failure_2: "Ty nebo někdo z tvých $knight_culture_player_plural_no_tooltip$ utrpí zranění"
 martial_chivalry.4000.b: "Zabiju jejich drzého vůdce!"
 martial_chivalry_special.4000.b.tt: "[ROOT.Char.GetTitledFirstNameNoTooltip] nemá v jízdě ani v boji sobě rovného!"
 martial_chivalry_special.4000.b.tt_success: "Pro svůj dobytek proliješ krev"
 martial_chivalry_special.4000.b.tt_failure: "Mladý zloděj tě poníží"
 martial_chivalry_special.4000.b.tt_critical_failure: "[Select_CString(ROOT.Char.IsFemale,'Jsi sražena ze sedla... a ušlapána','Jsi sražen ze sedla... a ušlapán')]"
 martial_chivalry_special.4000.b.tt_critical_failure_2: "[Select_CString(ROOT.Char.IsFemale,'Jsi těžce zmrzačena','Jsi těžce zmrzačen')]"
 martial_chivalry.4000.c: "S koněm máme jasno: „Dnes v noci ne.“"
 martial_chivalry_special.4000.c.tt: "Jistě, #EMP některé#! z těch zlodějů chytíš. Až se pořádně vyspíš."
 martial_chivalry_special.1201.t: "[ROOT.Char.Custom('MountedWarriorAdjective')|U] výcvik"
 martial_chivalry_special.1201.desc: "Řinčení kroužkové zbroje a třesk mečů mi zní v uších, zatímco [ROOT.Char.Custom('MountedWarriorTermPlural')] cvičí se zbraněmi. Pozorně je sleduji a snažím se odhalit silné i slabé stránky každého z nich.\n\nOdpočinku si moc neužijí, protože sotva zvon ohlásí konec cvičné šarvátky, otevřou se vrata stájí. Je čas vyvést jezdecká zvířata."
 martial_chivalry_special.1201.a: "Dnes vyrážíme na jízdu do terénu!"
 martial_chivalry_special.1201.a.tt: "Když [ROOT.Char.Custom('MountedWarriorTermPlural')] procvičují formace, můžeš si prohloubit zkušenosti s [Concept('martial_lifestyle','válečnickým životním stylem')|E]."
 martial_chivalry_special.1201.b: "Přineste mi zbroj. Na kvintáně jsem [Select_CString(ROOT.Char.IsFemale,'nejezdila','nejezdil')] celou věčnost!"
 martial_chivalry_special.1201.b.tt: "\nCvičení až do západu slunce ti sice nepomůže lépe pochopit taktiku, ale zato tě pořádně #EMP posílí#!."
 martial_chivalry_special.1202.t: "[ROOT.Char.Custom('MountedWarriorAdjective')|U] výcvik: Výhled z návrší"
 martial_chivalry_special.1202.desc: "[soldier.GetTitledFirstName] pohlédne na rozbahněná pole pod kopcem. „Mohla by představovat obrysy nepřátelské armády,“ poznamená.\n\nProhlížím bojovou linii a vysvětluji plán. [ROOT.Char.Custom('MountedWarriorTermPlural')|U] dostávají pokyny k nadcházejícímu manévru."
 martial_chivalry_special.1202.a: "Stočíme se šikmo a vpadneme jim do „křídel“."
 martial_chivalry_special.1202.b: "#EMP Úúútoook!#!"
 martial_chivalry_special.1202.b_success: "Útok je proveden skvěle"
 martial_chivalry_special.1202.b_failure: "Útok skončí katastrofou"
 martial_chivalry_special.1203.t: "[ROOT.Char.Custom('MountedWarriorAdjective')|U] výcvik: Přesný úder"
 martial_chivalry_special.1203.desc: "Hřmění kopyt všude kolem, pokřik jezdců, jejich nezadržitelný nápor. Když jedu v jejich čele, připadá mi, jako bych [Select_CString(ROOT.Char.IsFemale,'vedla','vedl')] samu přírodní sílu. Tuhle sílu však řídím já. Reaguje na každý můj sebemenší rozkaz a velím jí, jako by byla prodloužením mé vlastní vůle.\n\nVrážíme do křídel pomyslné armády a [ROOT.Char.Custom('MountedWarriorTermPlural')] se bez zaváhání drží mého plánu. Přesně takhle přinesu nepříteli naprostou zkázu."
 martial_chivalry_special.1203.a: "Přesně takový bude příval vítězství."
 martial_chivalry_special.1204.t: "[ROOT.Char.Custom('MountedWarriorAdjective')|U] výcvik: Zuřivost šelem"
 martial_chivalry_special.1204.desc: "[ROOT.Char.Custom('SignatureWeaponAction')|U] [ROOT.Char.Custom('signature_weapon')] a vedu jezdce v šíleném úprku z kopce. Ve zdánlivém chaosu pohybující se zbroje, pozvednutých zbraní a válečného pokřiku se však skrývá plán. Když vrazíme do pomyslné armády na poli pod námi, každý voják najde své místo v naší linii, chystá úder, stahuje se, škubne otěžemi a znovu se vrhá do vřavy.\n\nPřeženeme se přes nepřátele jako přírodní živel a oni se zlomí jako strom v bouři."
 martial_chivalry_special.1204.a: "Pobijeme každého, kdo nám zkříží cestu!"
 martial_chivalry_special.1601.t: "Výcvik válečného koně"
 martial_chivalry_special.1601.desc: "Při prohlídce stájí mi padne zrak na [dummy_gender.Custom('HorseMareStallion')], [Select_CString(dummy_gender.IsFemale,'která stojí odděleně od ostatních','který stojí odděleně od ostatních')]. Pohazuje hlavou a dupe kopyty, čímž dává vyniknout mohutným zádím a krásně klenutému krku. Tohle zvíře má dokonalou stavbu těla a příšernou povahu.\n\nTakového válečného koně jsem ještě [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')], ale stájník trvá na tom, že [Select_CString(dummy_gender.IsFemale,'ji','ho')] nelze vycvičit."
 martial_chivalry_special.1601.a: "Před výzvou neuhnu!"
 martial_chivalry_special.1601.b: "Za tak nádherného koně dostanu pořádný balík."
 martial_chivalry_special.1601.c: "Můj stájník se při krocení [Select_CString(dummy_gender.IsFemale,'jí','ho')] hodně naučí."
 martial_chivalry_special.1601.a.tt: "Kůň se může stát tvým osobním ořem"
 martial_chivalry_special.1601.d: "Copak [m_horse.GetTitledFirstNameNoTooltip] nerozumí koním nejlépe?"
 martial_chivalry_special.1601.d.tt: "Tvůj $master_of_horse_court_position$ se pokusí zvíře zkrotit. Pokud uspěje, kůň se stane tvým osobním ořem."
 martial_chivalry_special.1603.desc: "Kůň při mém příchodu stáhne uši dozadu a dává naprosto jasně najevo, co si o mně myslí. Při prvním setkání je důležité získat [Select_CString(dummy_gender.IsFemale,'její','jeho')] důvěru a respekt, takže se musím rozhodnout, jak na to."
 martial_chivalry_special.1603.a: "Na zkrocení téhle bestie je potřeba pevná ruka!"
 martial_chivalry_special.1603.a.tt: "Pravděpodobně bude dobře fungovat s vysokou [Concept('prowess','udatností')|E] nebo odvážnou osobností"
 martial_chivalry_special.1603.b: "[Select_CString(ROOT.Char.IsFemale,'Budu-li mírná a budu se pohybovat pomalu','Budu-li mírný a budu se pohybovat pomalu')], začne mi důvěřovat."
 martial_chivalry_special.1603.b.tt: "Pravděpodobně bude dobře fungovat s vysokou [Concept('diplomacy','diplomacií')|E] nebo laskavou osobností"
 martial_chivalry_special.1603.c: "Každý má svou cenu - přineste jablka!"
 martial_chivalry_special.1603.c.tt: "Pravděpodobně bude dobře fungovat s vysokým [Concept('intrigue','pletichářstvím')|E] nebo štědrou osobností"
 martial_chivalry_special.1604.desc_success: "Je to opojný pocit. Mohutný kůň poslechne každé mé přání. Teď, když [Select_CString(ROOT.Char.IsFemale,'jsem si získala','jsem si získal')] [Select_CString(dummy_gender.IsFemale,'její','jeho')] důvěru, [Select_CString(dummy_gender.IsFemale,'zdá se, že si mě skoro oblíbila','zdá se, že si mě skoro oblíbil')]."
 martial_chivalry_special.1604.desc_failure: "Ať zkouším cokoli, kůň odmítá poslouchat. Mé pokusy končí tím, že ze mě i z koně lije pot a vztek jen roste. Když pozdě večer opouštím stáje, vím, že se sem hned tak nevrátím."
 martial_chivalry_special.1604.a: "Nechám si [Select_CString(dummy_gender.IsFemale,'ji','ho')] jako svého osobního válečného koně!"
 martial_chivalry_special.1604.a_2: "To stálo za to! Zkusím to znovu."
 martial_chivalry_special.1604.b: "Alespoň už vím, co #EMP nedělat#!..."
 martial_chivalry_special.1604.c: "Můj lenní pán bude mít radost."
 martial_chivalry_special.1604.t: "Kůň zkrocen"
 martial_chivalry_special.1604.succcess: "Tvůj temperamentní kůň je zkrocen! Zásluhu má $master_of_horse_court_position$."
 martial_chivalry_special.1604.t.2: "Kůň nezkrocen"
 martial_chivalry_special.1604.failure: "Tvůj $master_of_horse_court_position$ nedokázal zkrotit koně."
 martial_chivalry.5000.t: "Nepodložené zvěsti"
 martial_chivalry.5000.intro: "Nedlouho po západu slunce mě cestou do ložnice zastaví [spymaster.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tvá galantnost je mezi vazaly dobře známá a obdivovaná, ale takové dvorské vystupování budí závist. Už teď se šeptá, že máš jiné, mnohem chlípnější úmysly.“"
 martial_chivalry.5000.desc.lustful: "\n\nNikdy bych to [Select_CString(ROOT.Char.IsFemale,'nepřiznala','nepřiznal')], ale pravda je, že jejich podezření není daleko od pravdy..."
 martial_chivalry.5000.desc.honest_chaste: "\n\nJak si vůbec někdo může myslet, že bych se [Select_CString(ROOT.Char.IsFemale,'dopustila','dopustil')] něčeho tak hanebného?"
 martial_chivalry.5000.desc.fallback: "\n\nPovytáhnu obočí - kdyby šlo jen o tohle, nevypadal by tak znepokojeně."
 martial_chivalry.5000.desc.outro: "\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], kolují zvěsti, že máš... #EMP poměr#! s [my_liege.GetShortUINamePossessive] [Select_CString(my_liege.IsFemale,'manželem','manželkou')].“"
 martial_chivalry.5000.a: "Tato obvinění okamžitě popřu!"
 martial_chivalry.5000.a.success: "Přesvědčíš [my_liege.GetFirstNameNoTooltip] o svých čestných úmyslech"
 martial_chivalry.5000.a.failure: "[my_liege.GetFirstNameNoTooltip] tě stále podezírá"
 martial_chivalry.5000.b: "Mluvit o tom by jen přitáhlo další pozornost."
 martial_chivalry.5000.c: "Musím si s [my_liege.GetTitledFirstNameNoTooltip] promluvit osobně."
 martial_chivalry.5000.d: "Kdyby jen viděli, jak se na mě [spouse.GetFirstNameNoTooltip] dívá..."
 martial_chivalry.5000.d.tt: "Není nic galantnějšího než usilovat o zakázanou lásku."
 martial_chivalry.5000.d.tt.warning: "@warning_icon! #X Ukončí všechny probíhající osobní [Concept('schemes','intriky')|E].#!"
 martial_chivalry.6000.t: "Do [church_province.GetTerrain.GetNameNoTooltip]"
 martial_chivalry.6000.desc: "Lesy byly vždy cenným místem pro výcvik. Každý přece ví, že každý správný rytíř neustále vyhlíží nové dobrodružství: zlovolného tyrana, tajnou zkoušku nebo nevinného člověka v nouzi.\n\nTuto část [church_province.GetTerrain.GetNameNoTooltip|l] jsem ještě nikdy [Select_CString(ROOT.Char.IsFemale,'neprozkoumala','neprozkoumal')]. Možná právě proto mi náhle objevené ruiny připadají jako zkouška odvahy.\n\nPodle všeho je kostel opuštěný už celá desetiletí. Sklo v oknech nahradily pavučiny. Z polámaných kmenů jsou teď lavice. Když se přiblížím ke shnilým dveřím, několik ptáků odletí."
 martial_chivalry.6000.a: "Jen máloco láká tolik jako tajemství, která skrývá [ROOT.Char.GetFaith.HouseOfWorship|l]!"
 martial_chivalry.6000.a.tt: "Uvnitř můžeš něco najít."
 martial_chivalry.6000.b: "[bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] o tak důležitém nálezu jistě [Select_CString(bishop.IsFemale,'ráda uslyší','rád uslyší')]."
 martial_chivalry.6000.c: "Mohli bychom to tu prostě využít jako nové skladiště."
 ignored_church_modifier: "Skladiště v opuštěném kostele"
 martial_chivalry.6001.t: "Do [church_province.GetTerrain.GetNameNoTooltip]: Nestvůra!"
 martial_chivalry.6001.desc: "Oltář je pod nánosy přírody téměř k nepoznání. Kořeny a mech se bez milosti derou přes kámen. Tiché šustění listí vedle něj působí tak uklidňujícím, téměř klamným dojmem.\n\nAch! Tak se mi to přece jen nezdálo!\n\nVe skutečnosti to vrčí [ROOT.Char.Custom('GetAnimalType')|l], jehož hladové oči se upírají přímo na mě."
 martial_chivalry.6001.a: "Tady skončíš, bestie!"
 martial_chivalry.6001.a_success: "Porazíš šelmu"
 martial_chivalry.6001.a_success_toast: "Čestné vítězství!"
 martial_chivalry.6001.a_failure: "Utrpíš zranění"
 martial_chivalry.6001.a_failure_toast: "Šelma vrací úder!"
 martial_chivalry.6001.b: "Zkusím se prostě nepozorovaně vytratit..."
 martial_chivalry.6001.b_success: "Unikneš útoku"
 martial_chivalry.6001.b_success_toast: "Úspěšně unikneš"
 martial_chivalry.6001.b_failure: "Zvíře tě dostane"
 martial_chivalry.6001.b_failure_toast: "Šelma si tě všimne"
 martial_chivalry.6002.t: "Do [church_province.GetTerrain.GetNameNoTooltip]: Poklad!"
 martial_chivalry.6002.desc: "Těsně za oltářem vyrostl strom. Jeho koruna nahradila propadlé části střechy. Vedle něj stojí dřevěná truhla, kterou podle chybějícího prachu a plísně někdo nedávno používal.\n\nUvnitř se skrývá malý poklad."
 martial_chivalry.6002.a: "Tohoto posvátného daru si budu vážit."
 church_artifact_book: "Kniha dvorské galantnosti"
 church_artifact_book_desc: "Bohatě zdobený svazek obsahující rady, jak se stát zdvořilým rytířem. Byl nalezen na posvátné půdě [church_county.GetNameNoTooltip]."
 church_artifact_sword: "Meč svaté oddanosti"
 church_artifact_sword_desc: "Bohatě zdobený meč. Do čepele někdo vyryl modlitbu. Byl nalezen na posvátné půdě [church_county.GetNameNoTooltip]."
 church_artifact_dagger: "Dýka mocné modlitby"
 church_artifact_dagger_desc: "Bohatě zdobená dýka. K hlavici někdo přivázal amulet. Byla nalezena na posvátné půdě [church_county.GetNameNoTooltip]."
 martial_chivalry.6002.book: "Tohle zní jako dokonalé čtení pro rytíře!"
 martial_chivalry.6002.book_tt: "Prostuduješ svazek a vrátíš ho na jeho posvátné místo."
 martial_chivalry.6002.b: "[bishop.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tento dar jistě ocení."
 martial_chivalry.6002.c: "Tahle modlářská faleš patří do ohně!"
 martial_chivalry.6003.t: "Do [church_province.GetTerrain.GetNameNoTooltip]: Kdo je tam...?"
 martial_chivalry.6003.desc_intro: "Silueta se objeví tak náhle, až to působí podezřele. Tvář té postavy odráží světlo zapadajícího slunce, a přesto působí chladně.\n\n"
 martial_chivalry.6003.desc_ugly: "„Ach... ty... [Select_CString(dummy_attracted_gender.IsFemale,'Čekala','Čekal')] jsem někoho #EMP galantnějšího#!...“\n\n[dummy_attracted_gender.GetFirstNameNoTooltip] si zakryje nos bílým kapesníkem.\n\n„Ale asi budeš muset stačit. Odvezeš mě zpátky na hrad?“"
 martial_chivalry.6003.desc_pretty: "„Ach, konečně přicházíš na mou záchranu? Budeš tak [Select_CString(ROOT.Char.IsFemale,'laskavá','laskavý')] a odvezeš mě zpátky na hrad?“\n\nHlas [dummy_attracted_gender.GetFirstNameNoTooltip] zní tak uklidňujícím dojmem a úleva v gestu je nepřehlédnutelná."
 martial_chivalry.6003.a: "Nevinného člověka v nouzi nikdy neopustím."
 martial_chivalry.6003.a_success: "Najdeš cestu zpět"
 martial_chivalry.6003.a_failure: "Ztratíš se v lese"
 martial_chivalry.6003.b: "Co tu [dummy_attracted_gender.GetFirstNameNoTooltip] dělá úplně [Select_CString(dummy_attracted_gender.IsFemale,'sama','sám')]? Musím pryč, než mě někdo přepadne!"
 martial_chivalry.6003.c: "Duch! Přízrak! Nezůstanu tu ani o vteřinu déle!"
 martial_chivalry.6003.d: "Ať si tu [dummy_attracted_gender.GetFirstNameNoTooltip] klidně shnije."
 martial_chivalry.6003.d_tt: "Aspoň se [dummy_attracted_gender.GetFirstNameNoTooltip] naučí chovat vždy zdvořile."
