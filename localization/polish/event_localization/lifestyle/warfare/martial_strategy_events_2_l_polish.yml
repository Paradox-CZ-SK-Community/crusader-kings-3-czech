l_polish:
 martial_strategy.4000.t: "Plné sýpky"
 martial_strategy.4000.desc: "S mohutným říhnutím odstrčím zbytek jídla a rozvalím se v křesle. Mé kuchyně se poslední dobou plní zlatavým obilím a čerstvě ulovenou zvěřinou, takže všichni mí dvořané už získali zdravý lesk lidí, kteří se až příliš dobře najedli.\n\nZašklebím se. Tahle hojnost je sice skvělá, ale věčně nevydrží. Musím rozhodnout, co se všemi těmi přebytky jídla."
 martial_strategy.4000.a: "Nasolit, vyudit - hlavně to uskladnit."
 martial_strategy.4000.b: "Já i mí hosté budeme hodovat jako králové!"
 martial_strategy.4000.c: "Dokonce i služebnictvo bude jíst stejně jako jejich [ROOT.Char.GetTitleAsNameNoTooltip]!"
 martial_strategy.4000.d: "Ano, vypadají #EMP opravdu#! pěkně vypaseně..."
 strategy_stocked_larders_modifier: "Bohatě zásobené sklady"
 strategy_emptied_larders_modifier: "Téměř prázdné sklady"
 strategy_fed_peasants_larders_modifier: "Chléb pro poddané"
 strategy_human_meat_larders_modifier: "Spíže s naprosto obyčejným masem"
 strategy_entirely_unrelated_disappearances_modifier: "Naprosto nesouvisející zmizení"
 martial_strategy.4010.t: "Hradby [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.desc: "Delegace z [crumbling_holding.GetNameNoTierNoTooltip] pomalu opouští mé soukromé komnaty a naše dlouhé jednání je konečně u konce. Žadatelé prosí o peníze na opravu rozpadajících se hradeb sídla a dovolávají se mé panské povinnosti doplatit to, co sami nedokázali vybrat. Bubnuji prsty do stolu a přemýšlím, zda jim zbývající prostředky poskytnout. Kvalitní opevnění je příšerně drahé.\n\nSamozřejmě, když už se hradby stejně rozpadají, mohl bych peníze vyčleněné na jejich opravu přesměrovat na osobnější záležitosti..."
 martial_strategy.4010.a: "Mám povinnost starat se o své poddané."
 martial_strategy.4010.b: "Na rekonstrukci dohlédnu osobně."
 martial_strategy.4010.c: "#EMP Já#! rozhoduji, za co se utrácejí #EMP mé#! peníze, a [crumbling_holding.GetNameNoTierNoTooltip] není prioritou!"
 martial_strategy.4010.b.tt_crit_success: "Mistrovsky vylepšíš hradby [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.b.tt_success: "Úspěšně přestavíš hradby [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.b.tt_botch: "Rekonstrukci naprosto zpackáš"
 strategy_paid_for_walls_modifier: "Profesionálně přestavěné hradby"
 strategy_let_walls_crumble_modifier: "Rozpadající se hradby"
 strategy_botched_supervised_walls_modifier: "Katastrofálně přestavěné hradby"
 strategy_successfully_supervised_walls_modifier: "Dovedně přestavěné hradby"
 martial_strategy.4010.d: "Na rekonstrukci dohlédne můj $royal_architect_court_position$."
 martial_strategy.4010.d.tt_crit_success: "Tvůj $royal_architect_court_position$ mistrovsky vylepší hradby [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.d.tt_success: "Tvůj $royal_architect_court_position$ úspěšně přestaví hradby [crumbling_holding.GetNameNoTierNoTooltip]"
 martial_strategy.4010.d.tt_botch: "Tvůj $royal_architect_court_position$ rekonstrukci naprosto zpacká"
 martial_strategy.7000.t: "Taktika?"
 martial_strategy.7000.desc_opening: "Když právě cvičím svou"
 martial_strategy.7000.desc_elephantry: "sloní jízdu"
 martial_strategy.7000.desc_cavalry: "těžkou jízdu"
 martial_strategy.7000.desc_middle: " [worried_knight.GetTitledFirstName] ke mně přistoupí, zatímco sedím v sedle. Vyhýbá se mému pohledu a hledí do země. Po dlouhém váhání konečně promluví:\n\n„[ROOT.Char.GetLadyLord|U], zdá se, že s našimi"
 martial_strategy.7000.desc_war_elephant: "válečnými slony"
 martial_strategy.7000.desc_armored_horse: "obrněnými koňmi"
 martial_strategy.7000.desc_cont: "neděláme nikdy nic jiného než to, že je ženeme přímo proti nepříteli v rovné linii. Není načase zkusit jiný přístup?“"
 martial_strategy.7000.a: "Ha! Dobrý vtip, [worried_knight.GetTitledFirstNameNoTooltip]!"
 martial_strategy.7000.b: "Hlupáku! Útočit přímo vpřed je [ROOT.Char.GetCulture.GetNameNoTooltip|l] způsob boje!"
 martial_strategy.7000.c: "Hlupáku! Zkoušel jsi někdy řídit válečného slona?"
 martial_strategy.7000.d: "Hlupáku! Lidstvo nezná lepší válečnou lest."
 martial_strategy.7000.e: "Možná na tom něco je..."
 martial_strategy.7000.f: "Až tě rozdupeme, uvidíš, jak účinné to je."
