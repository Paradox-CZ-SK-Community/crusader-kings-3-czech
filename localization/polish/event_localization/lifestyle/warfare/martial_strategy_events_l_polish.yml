l_polish:
 martial_strategy.1051.t: "Řeči o vojevůdci"
 martial_strategy.1051.desc: "Nejoblíbenější téma hovoru na [ROOT.Char.Custom('GetCourt')] se neustále mění, ale v poslední době se často mluví o mých pozoruhodných schopnostech vojenského velitele - a o tom, v čem spočívá tajemství mých úspěchů.\n\nTéto přirozené zvědavosti mohu využít k posílení své pověsti, nejprve se však musím rozhodnout, čemu své úspěchy přisoudím..."
 martial_strategy.1051.a: "Mám přirozený talent, který mě staví nad ostatní."
 martial_strategy.1051.a.humble: "Znám své meze, a proto je dokážu obejít."
 martial_strategy.1051.b.brave: "Má odvaha inspiruje mé vojáky, aby vytrvali a bojovali."
 martial_strategy.1051.b.stalwart: "Mé odhodlání je tak pevné, že nikdy nezakolísám!"
 martial_strategy.1051.c.wrathful: "Mé drtivé zuřivosti nikdo neodolá!"
 martial_strategy.1051.c.feareater: "Už jen má přítomnost nahání nepřátelům strach!"
 martial_strategy.1051.d.zealous: "Vítězství mi dopřává [ROOT.GetCharacter.GetFaith.HighGodName]."
 martial_strategy.1051.d.sadistic: "Vždy udeřím nepřítele tam, kde to bolí nejvíc."
 martial_strategy.1051.d.zealoussadistic: "Ve svém tažení proti bezbožným neznám slitování!"
 martial_strategy.1051.e.patient: "Jsem neustále ve střehu a čekám na správnou chvíli k úderu."
 martial_strategy.1051.f.ambitious: "Pro vítězství udělám #EMP cokoli#!!"
 martial_strategy.2000.t: "Ponaučení z minulosti"
 martial_strategy.2000.start.desc: "Než nadejde můj konec, jistě ještě spatřím mnoho bojišť, ale má knihovna ukrývá příběhy válek, které by vystačily na sto životů.\n\nNedávno se mi dostal do rukou svazek o velké"
 martial_strategy.2000.hastings.desc: "bitvě u Hastingsu, "
 martial_strategy.2000.tours.desc: "bitvě u Tours, "
 martial_strategy.2000.palaceofthemartyrs.desc: "bitvě u Paláce mučedníků, "
 martial_strategy.2000.catalaunianplains.desc: "bitvě na Katalaunských polích, "
 martial_strategy.2000.constantinople.desc: "obléhání Konstantinopole, "
 martial_strategy.2000.vapati.desc: "bitvě u Vapati, "
 martial_strategy.2000.end.desc: "a spolu s ním i časem ohlodaný svitek napsaný v jakémsi prastarém jazyce. Kdo ví, jaká zapomenutá tajemství ukrývá..."
 martial_strategy.2000.a: "Přečtu si novější svazek."
 martial_strategy.2000.b: "Pokusím se přeložit starý svitek."
 martial_strategy.2000.b.success: "Odhalím střípek dávného vědění"
 martial_strategy.2000.b.success.tt: "Získáš #P 1#! [Concept('martial','válečnictví')|E], #P 1#! [Concept('learning','učenosti')|E] a bonus pro [Concept('commander','velitele')|E] na #V 20 let#!"
 martial_strategy.2000.b.failure: "Nepodaří se mi svitek rozluštit"
 martial_strategy.2000.b.failure.tt: "Musíš získat [Concept('stress','stres')|E], nebo to vzdát"
 martial_strategy.2001.start.desc: "Ani s pomocí zaprášeného slovníku nevydává svitek svá tajemství snadno, ale nevzdávám se. Jak noc postupuje, začíná se přede mnou odvíjet neuvěřitelný příběh...\n\n"
 martial_strategy.2001.gaixia.desc: "#F Svitek popisuje bitvu u Gaixie. Chan Sin, velitel Chanů, zlomil morálku nepřítele tím, že nechal své muže zpívat písně z jejich rodného království Čchu. Čchuský velitel Siang Jü unikl s malou skupinou věrných mužů, ale nakonec je dostihli a porazili.#!"
 martial_strategy.2001.red_cliffs.desc: "#F V bitvě u Rudých útesů nechal vojevůdce Cchao Cchao kvůli mořské nemoci spoutat své lodě od přídě k zádi řetězy. Chuang Kaj, jeden z velitelů protivníkových vojsk Sun-Liou, vycítil příležitost a poslal předstíraný dopis o kapitulaci. Poté připravil skupinu lodí naplněných chrastím a olejem a nechal je větrem unášet k Cchao Cchaovu loďstvu. Když se prázdné lodě přiblížily k nepřátelské flotile, byly zapáleny a bezpočet mužů zahynul v plamenech.#!"
 martial_strategy.2001.thermopylae.desc: "#F Řecká vojska, přestože byla v drtivé početní nevýhodě, zablokovala úzký pobřežní průsmyk u Thermopyl a sedm dní zadržovala perskou armádu. Posledního dne, když byl král Leónidás obklíčen, propustil většinu svého vojska a v hrdinném posledním odporu kryl jeho ústup. Hrdinství jeho vojáků je svědectvím o síle vlasteneckého vojska bránícího svou rodnou zem.#!"
 martial_strategy.2001.teutoburg_forest.desc: "#F Arminius, syn germánského náčelníka, vyrůstal v Římě, ale tajně plánoval sjednotit kmeny proti Římanům. Stal se důstojníkem římského vojevůdce Vara a poradil mu, aby se vydal oklikou přes Teutoburský les. Tam Arminius rozpoutal sérii léček. Díky své římské výchově přesně věděl, jak čelit nepřátelské taktice, a dovedl svůj lid k rozhodujícímu vítězství.#!"
 martial_strategy.2001.a: "Prostuduj bitvu."
 martial_strategy.2001.b: "Soustřeď se na samotný překlad."
 martial_strategy.2002.desc: "Padá noc a jediná svíce osvětlující text přede mnou je každou hodinou kratší. Když naposledy zabliká a zanechá mě ve tmě, tajemství svitku zůstávají neodhalena."
 martial_strategy.2002.a: "Pokračovat."
 martial_strategy.2002.b: "Vzdát to."
 martial_strategy.2020.t: "Je dovoleno všechno?"
 martial_strategy.2020.opening: "O čestném vedení války bylo sepsáno mnoho pojednání, jenže jejich autoři při psaní vlastní život neriskovali.\n\n"
 martial_strategy.2020.desc: "Chci-li co nejvíce zvýšit své šance na vítězství v bitvě, možná by stálo za to zvážit i poněkud... nekonvenční strategie."
 martial_strategy.2020.desc.ambitious: "Chci-li si zajistit vítězství, musím na bojišti využít každé možné výhody, i kdyby to znamenalo sáhnout po taktice, kterou někdo může považovat za nečestnou."
 martial_strategy.2020.desc.martial: "Ze zkušenosti vím, že nejlepší způsob, jak porazit nepřátele, je bojovat pouze za podmínek, které vyhovují mně! Otázkou je, jaké podmínky by byly nejvýhodnější."
 martial_strategy.2020.desc.deceitful: "Četl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem básně, které přirovnávají bojiště k živoucí bytosti. To mě přivádí na myšlenku... šlo by manipulovat bojištěm stejně jako lidmi?"
 martial_strategy.2020.a: "Vylákám nepřátele příliš daleko z jejich pozic!"
 martial_strategy.2020.a.success: "Můj trik vyjde"
 martial_strategy.2020.a.failure: "Můj trik selže a zesměšní mě"
 martial_strategy.2020.b: "Útoky a rychlé ústupy nepřítele vyčerpají!"
 martial_strategy.2020.d: "K takovým špinavým způsobům boje neklesnu!"
 martial_strategy.2020.d.brave: "Takovou taktiku používají jen zbabělci!"
 martial_strategy.2020.d.flavor: "Odmítneš používat tuto taktiku"
 martial_strategy.2021.t: "Úspěšná lest"
 martial_strategy.2020.desc.opening: "Shromáždil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem svou družinu k válečným hrám, protože jsem chtěl[Select_CString(ROOT.Char.IsFemale,'a','')] vyzkoušet nápad předstírat ústup a vylákat protivníky příliš daleko z jejich pozic."
 martial_strategy.2021.desc: "\n\nKdyž jsme se rozdělili do týmů, pečlivě jsem všem ukázal[Select_CString(ROOT.Char.IsFemale,'a','')], jak ustoupit právě natolik, aby druhou stranu vylákali z postavení, ale ne tolik, aby se naše linie prolomila.\n\nMá nová taktika fungovala bezchybně. Obklíčili jsme protivníkův tým a donutili ho vzdát se!"
 martial_strategy.2021.a: "Nemohu se dočkat, až tenhle trik použiji ve skutečné bitvě!"
 martial_strategy.2022.t: "Zmařené naděje"
 martial_strategy.2022.desc: "\n\nBohužel, když se můj tým pokusil novou taktiku vyzkoušet, nedokázali jsme udržet pozice. Protivník rychle prorazil naši linii, rozvrátil naše řady a uštědřil nám rychlou a ponižující porážku.\n\nVšichni, kdo se válečných her účastnili, si teď myslí, že jsem [Select_CString(ROOT.Char.IsFemale,'hlupačka','hlupák')], a s mými „nápady“ už nechtějí mít nic společného."
 martial_strategy.2022.b: "Možná bych se měl[Select_CString(ROOT.Char.IsFemale,'a','')] držet osvědčené taktiky..."
 martial_strategy.2030.t: "Jistota zásobování"
 martial_strategy.2030.desc.fallback: "K velení armádě patří i to, že se postarám, aby mí vojáci měli na dlouhých taženích dostatek jídla, pití a táborového vybavení."
 martial_strategy.2030.desc.diligent: "Zakládám si na tom, že mám vždy o všem přehled, a k tomu patří i řádné zásobování mých vojáků."
 martial_strategy.2030.desc.ambitious: "Ať jsou mí vojáci sebeobávanější, pokud jim během tažení dojdou zásoby, budou mi platní asi jako vycvičené veverky."
 martial_strategy.2030.desc.end: "\n\nMěl[Select_CString(ROOT.Char.IsFemale,'a','')] bych proto vymyslet plán, který zajistí, že mí vojáci budou mít v poli vždy vše potřebné."
 martial_strategy.2030.a: "Vytvořím síť obchodníků, kteří mi budou pomáhat."
 martial_strategy.2030.a.success.tt: "Vybuduješ spolehlivou síť dodavatelů"
 martial_strategy.2030.a.failure.tt: "Obchodníci, které najdeš, jsou nespolehliví"
 martial_strategy.2030.b: "Nahromadím zásoby ve své pevnosti."
 martial_strategy.2030.c: "Mí vojáci si mohou zásoby opatřit sami."
 martial_strategy.2031.t: "Spolehlivá síť"
 martial_strategy.2031.desc: "Po procházení stohů účetních knih se mi podařilo vybrat skupinu obchodníků rozesetých po kraji, o nichž vím, že se na ně mohu spolehnout.\n\nNabídl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem jim pravidelnou odměnu za to, že budou kdykoli připraveni dodat mé armádě vše potřebné. Mí velitelé tak budou vždy vědět, na koho se obrátit, když budou potřebovat zásoby."
 martial_strategy.2031.a: "Mé armády v poli tak budou spolehlivě zásobovány."
 martial_strategy.2031.b: "A teď si z toho trochu ukrojit pro sebe..."
 martial_strategy.2032.t: "Chybějící zásoby"
 martial_strategy.2032.desc: "Oslovil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem řadu dostupných obchodníků, abych zjistil[Select_CString(ROOT.Char.IsFemale,'a','')], kdo dokáže mou armádu nejlépe zásobovat.\n\nJeden kupec nabídl velmi dobré ceny, a tak jsem zařídil[Select_CString(ROOT.Char.IsFemale,'a','')], aby od něj pocházela většina zásob pro mou armádu... jenže když nadešel čas zásilku vyzvednout, nebylo po něm ani po jeho zboží ani stopy!"
 martial_strategy.2032.a: "Až toho podvodníka najdu, nechám ho o hlavu kratšího!"
 martial_strategy.2032.a.forgiving: "Než jsem objednávku zadal[Select_CString(ROOT.Char.IsFemale,'a','')], měl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si ho lépe prověřit."
 martial_strategy.3010.t: "Strategická patová situace"
 martial_strategy.3010.desc.start: "Sedím u mapového stolu s [impatient_commander.GetTitledFirstName] a [patient_commander.GetTitledFirstName] a probíráme strategii pro probíhající válku.\n\n[impatient_commander.GetFirstNameNoTooltip]"
 martial_strategy.3010.desc.middle: "zatímco [patient_commander.GetFirstNameNoTooltip]"
 martial_strategy.3010.desc.end: "\n\nKonečné rozhodnutí o našem dalším postupu náleží mně."
 martial_strategy.3010.desc.wrathful: "udeří pěstí do stolu a hlasitě prohlásí, že bychom měli zaútočit přímo na nepřítele a rozdrtit ho hrubou silou našich armád,"
 martial_strategy.3010.desc.greedy: "dychtivě ukazuje na všechny lákavé cíle, které bychom měli okamžitě vyslat plenit nájezdníky,"
 martial_strategy.3010.desc.patient: "se pohodlně usadí a trpělivě prosazuje, abychom zajistili klíčová místa a raději počkali, až nepřítel přijde k nám."
 martial_strategy.3010.desc.craven: "nervózně mumlá, že bychom se měli vyhýbat zbytečným střetům a vést opotřebovací válku."
 martial_strategy.3010.desc.flexible: "vysvětluje, že musíme sledovat kroky nepřítele a podle nich přizpůsobovat svůj postup."
 martial_strategy.3010.a: "[impatient_commander.GetTitledFirstNameNoTooltip] na to jde správně!"
 martial_strategy.3010.b: "Raději se budu řídit plánem, který navrhuje [patient_commander.GetTitledFirstNameNoTooltip]."
 martial_strategy.3010.c: "Ať každý z mých velitelů jedná podle vlastního uvážení."
 martial_strategy.3010.o_martial: "Vím, jak využít obě strategie!"
 martial_strategy.3010.desc.response.start: "Účastním se strategické porady s [my_liege.GetTitledFirstName] a [other_commander.GetTitledFirstName], kde probíráme naše plány pro probíhající válku."
 martial_strategy.3011.t: "Strategie přijata"
 martial_strategy.3011.desc: "\n\n[my_liege.GetTitledFirstName] je mým návrhům velmi [Select_CString(my_liege.IsFemale,'nakloněna','nakloněn')] a dává jim přednost před těmi, které navrhuje [other_commander.GetFirstName]. Teď se jimi budeme řídit při určování strategie pro probíhající válku!"
 martial_strategy.3011.a.disapprove: "Kdo by řekl, že [my_liege.GetFirstNameNoTooltip] dokáže uznat rozumný názor?"
 martial_strategy.3011.a: "Věděl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že se [my_liege.GetTitledFirstNameNoTooltip] mé nápady zalíbí!"
 martial_strategy.3012.t: "Strategie odmítnuta"
 martial_strategy.3012.desc: "\n\nBohužel [my_liege.GetTitledFirstName] mé návrhy odmítá a místo nich dává přednost těm, které předkládá [other_commander.GetFirstName]. Teď se jimi budeme řídit při určování strategie pro probíhající válku!"
 martial_strategy.3012.a.disapprove: "Taková pošetilost mě u [my_liege.GetFirstNameNoTooltip] nepřekvapuje."
 martial_strategy.3012.a: "Čas ukáže, zda se [my_liege.GetFirstNameNoTooltip] [Select_CString(my_liege.IsFemale,'rozhodla','rozhodl')] správně."
 martial_strategy.3013.t: "Volná ruka"
 martial_strategy.3013.desc: "[my_liege.GetTitledFirstName] se [Select_CString(my_liege.IsFemale,'rozhodla','rozhodl')] do našich plánů nezasahovat a dovoluje mně i [other_commander.GetFirstName], abychom jednali podle vlastního uvážení."
 martial_strategy.3013.a: "Jsem rád[Select_CString(ROOT.Char.IsFemale,'a','')], že budu mít volnou ruku."
 martial_strategy.3014.t: "Strategie sjednocena"
 martial_strategy.3014.desc: "\n\n[my_liege.GetTitledFirstName] [Select_CString(my_liege.IsFemale,'spojila','spojil')] mé návrhy s nápady [other_commander.GetFirstName] do jediné ucelené strategie, která nám na bojišti poskytne značnou výhodu!"
 martial_strategy.3014.a.disapprove: "Přes všechny své nedostatky je [my_liege.GetFirstNameNoTooltip] [Select_CString(my_liege.IsFemale,'schopná vojevůdkyně','schopný vojevůdce')]."
 martial_strategy.3014.a: "Plán, který [my_liege.GetTitledFirstNameNoTooltip] [Select_CString(my_liege.IsFemale,'vytvořila','vytvořil')], na mě udělal dojem."
 martial_strategy_special.1301.t: "V obležení"
 martial_strategy_special.1301.desc: "„Skutečným nepřítelem každého vojáka je samolibost,“ pronese [siege_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)] a poté [siege_proposer.Custom('quirk_pos_pp')]. Stojíme bok po boku na hradbách mého [ROOT.Char.Custom('FortifiedBuilding')] a hledíme na vojáky, kteří dole cvičí.\n\n„Mohli bychom bránu [ROOT.Char.Custom('FortifiedBuilding')] nahradit dřevěnými fošnami a otupit šípy v toulcích vojáků,“ pokračuje [siege_proposer.GetFirstNameNoTooltip]. „Veď vojáky do cvičného útoku na [ROOT.Char.Custom('FortifiedBuilding')] a uvidíme, jak si povedou v akci!“"
 martial_strategy_special.1301.a: "Čas raději věnujeme zlepšení obrany."
 martial_strategy_special.1301.b: "Dobrý nápad. Ty povedeš obránce!"
 martial_strategy_special.1301.b.tt: "#F Hra může začít!#!"
 martial_strategy_special.1302.t: "$martial_strategy_special.1301.t$: První útok"
 martial_strategy_special.13.a.tt: "#F Riskantnější přístup, který může přinést větší odměnu.#!"
 martial_strategy_special.13.b.tt: "#F Bezpečnější a taktičtější přístup.#!"
 martial_strategy_special.1302.desc: "Pevně zavřená brána a hradby tyčící se vysoko k nebi. Za cimbuřím se jako stíny pohybují lučištníci a ve vzduchu je cítit skutečné vzrušení.\n\nV tichu před bitvou se otočím k vojákům. Můj rozkaz zazní přes celé pole hlasitě a jasně."
 martial_strategy_special.1302.c: "Využijte slabin brány!"
 martial_strategy_special.1302.d: "Prolezte stokami!"
 martial_strategy_special.1302.a: "Zaútočte na hlavní bránu!"
 martial_strategy_special.1302.a.tt1: "Projdeme dovnitř prakticky bez odporu"
 martial_strategy_special.1302.a.tt2: "Utrpíme těžké „ztráty“, ale bránu prolomíme"
 martial_strategy_special.1302.b: "Přineste žebříky!"
 martial_strategy_special.1302.b.tt1: "Hradby zdoláme bez větších potíží"
 martial_strategy_special.1302.b.tt2: "Sotva se dostaneme na cimbuří a utrpíme těžké „ztráty“"
 martial_strategy_special.storm_castle.very_well: "Útok postupuje #P velmi dobře#!"
 martial_strategy_special.storm_castle.poorly: "Útok postupuje #N špatně#!"
 martial_strategy_special.storm_castle.normal: "Útok postupuje #Z obstojně#!"
 martial_strategy_special.storm_castle.well: "Útok postupuje #P dobře#!"
 martial_strategy_special.1303.t: "$martial_strategy_special.1301.t$: Každý krok je boj"
 martial_strategy_special.1303.desc: "Schodištěm se rozlehne rána, když se další otupená zbraň odrazí od středového sloupu. Už podruhé během několika minut proklínám těsnou spirálu, která nám brání pořádně se rozmáchnout proti obráncům.\n\nTěžké oddechování vojáků kolem mě je ohlušující a s každým odraženým útokem jsou sklíčenější a podrážděnější. Musím převzít velení!"
 martial_strategy_special.1303.c: "Všichni leváci dopředu!"
 martial_strategy_special.1303.d: "Opatrně! Nenechte se vylákat!"
 martial_strategy_special.1303.a: "Nepolevujte, převálcujeme je!"
 martial_strategy_special.1303.e: "Za mnou! #EMP Útok#!!"
 martial_strategy_special.1303.a.tt1: "Schodiště dobudeme s brutální účinností"
 martial_strategy_special.1303.a.tt2: "Schodiště sotva získáme, klopýtaví a s unavenými pažemi"
 martial_strategy_special.1303.b: "Po jednom! Buďte ve střehu!"
 martial_strategy_special.1303.b.tt1: "Chvíli to trvá, ale nakonec schodiště dobudeme"
 martial_strategy_special.1303.b.tt2: "Než prorazíme, utrpíme mnoho „ztrát“"
 martial_strategy_special.1303.f: "Za mě! Ochráním vás!"
 martial_strategy_1303.winning: "Vítězíme, ale nesmíme udělat jedinou chybu!"
 martial_strategy_1303.losing: "Tohle je naše poslední šance zvrátit bitvu!"
 martial_strategy_special.1304.t: "$martial_strategy_special.1301.t$: Smělost na hradbách"
 martial_strategy_special.1304.desc: "Udělám poslední krok a vystoupím na hradby obklopující [ROOT.Char.Custom('FortifiedBuilding')]. Rozhlédnu se kolem sebe.\n\nMnoho vojáků možná padlo za oběť lučištníkům na hradbách, ale odradit se nenecháme. Jednoho obránce za druhým přemáháme a vítězně stojíme nad poraženými.\n\nZhluboka se nadechnu a je čas znovu vyrazit vpřed."
 martial_strategy_special.1304.a: "Všichni za mnou!"
 martial_strategy_special.1304.c: "Tvrdě do nich! Dnes to nejsou vaši přátelé!"
 martial_strategy_special.1304.d: "Štíty vzhůru! Kryjte týl!"
 martial_strategy_special.1304.f: "Tvrdě do nich! Bez slitování!"
 martial_strategy_special.1304.a.tt1: "Rychle rozdrtíme vojsko, kterému velí [siege_proposer.GetTitledFirstNameNoTooltip]"
 martial_strategy_special.1304.a.tt2: "Nepřítel zaútočí na náš nechráněný týl"
 martial_strategy_special.1304.b: "Lučištníci, na pozice!"
 martial_strategy_special.1304.b.tt1: "Nic nás nezastaví"
 martial_strategy_special.1304.b.tt2: "Bez lučištníků je náš útok snadno odražen"
 martial_strategy_special.1399.t: "$martial_strategy_special.1301.t$: Útok na [ROOT.Char.Custom('FortifiedBuilding')|U]"
 martial_strategy_special.1399.desc_win: "[ROOT.Char.Custom('FortifiedBuilding')|U] je náš!"
 martial_strategy_special.1399.desc_loose: "Bitva je ztracena a obránci dnes zvítězili."
 martial_strategy_special.1399.desc: "Mezi oslavujícími vojáky najdu [siege_proposer.GetTitledFirstName], [Select_CString(siege_proposer.IsFemale,'která mi blahopřeje','který mi blahopřeje')] k dobře vedenému útoku."
 martial_strategy_special.1399.desc_win2: "\n\n„Jen se na ně podívej, [ROOT.Char.Custom('FormOfAddressForLiege')]. Změna tempa jim prospěla. A i ty vypadáš [Select_CString(ROOT.Char.IsFemale,'svěžejší','svěžejší')], přestože [ROOT.Char.Custom('FortifiedBuilding')] právě padl do rukou útočníků!“"
 martial_strategy_special.1399.desc_loose2: "\n\n„I když se ti nepodařilo dobýt [ROOT.Char.Custom('FortifiedBuilding')], [ROOT.Char.Custom('FormOfAddressForLiege')], změna tempa očividně prospěla vojsku i tobě!“\n\nNezbývá mi než souhlasit. A navíc je uklidňující vědět, že [ROOT.Char.Custom('FortifiedBuilding')] nebude tak snadné dobýt!"
 martial_strategy_special.1399.a: "Naši nepřátelé proti nám nebudou mít šanci!"
 martial_strategy_special.1399.b: "Jako obránci jsme hrozivá síla!"
 martial_strategy_special.1401.t: "Na pochodu"
 martial_strategy_special.1401.opening: "Na konci polního cvičení to znělo jako skvělý nápad...\n\nAbych procvičil[Select_CString(ROOT.Char.IsFemale,'a','')] znovusjednocení rozptýlené armády, rozdělil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem své vojsko a každému důstojníkovi nařídil[Select_CString(ROOT.Char.IsFemale,'a','')], aby se vlastní cestou dostal do [capital.GetNameNoTier].\n\nTřetí den čekání, kdy dorazila sotva polovina mé armády, už ovšem začínám v tom plánu vidět jisté nedostatky."
 martial_strategy_special.1401.commander: "[commander.GetTitledFirstName]"
 martial_strategy_special.1401.officer_fallback: "Jeden z mých důstojníků"
 martial_strategy_special.1401.end: "navrhuje, abych vyrazil[Select_CString(ROOT.Char.IsFemale,'a','')] s oddílem $knight_culture_player_plural_no_tooltip_lowercase$ hledat pohřešované vojáky, zatímco zbytek armády se vrátí domů."
 martial_strategy_special.1401.a: "Tohle bude vzrušující pátrání!"
 martial_strategy_special.1401.a.tt: "Pátrání může nějakou dobu trvat..."
 martial_strategy_special.1401.b: "Dobrý nápad. Přebíráš velení."
 martial_strategy_special.1401.give_up_tt: "#F Ostatním vojákům jen prospěje, když si cestu domů najdou sami.#!"
 martial_strategy.1401.almost_done: "Téměř všichni mí vojáci se už vrátili a vyrážím s vědomím, že těch posledních pár nebude snadné najít.\n\n"
 martial_strategy.1401.close_to_done: "Většina mých vojáků se už vrátila a já vyrážím hledat poslední zbývající pluky.\n\n"
 martial_strategy.1401.a_lot_returned: "Mnoho mých vojáků se už vrátilo a věřím, že se mi podaří najít i zbytek.\n\n"
 martial_strategy.1401.some_returned: "Část mých vojáků se už vrátila a já vyrážím hledat ty zbývající.\n\n"
 martial_strategy.1401.first_find: "Netrvá dlouho a narazím na první pluk, který hledám.\n\n"
 martial_strategy_special.1401.continue_search_tooltip: "Pátrání pokračuje"
 martial_strategy_special.1401.delay_tt: "Pátrání se zdrží"
 martial_strategy_special.1401.give_up: "Vzdáš pátrání a vrátíš se domů"
 martial_strategy_special.1402.t: "Na pochodu"
 martial_strategy_special.1402.desc: "Z hostince u cesty se ozývá naprostý povyk. Jeden z mých $knight_culture_player_plural_no_tooltip_lowercase$ vykopne dveře a odhalí místnost plnou mých zbloudilých vojáků.\n\nJakmile mě spatří, všichni ztichnou a beze slova sklopí pohledy do svých pohárů. Hostinský přimhouří oči. „Takže za tuhle chátru #EMP můžeš ty#!?“"
 martial_strategy_special.1402.a: "Mám dost peněz, abych škodu zaplatil[Select_CString(ROOT.Char.IsFemale,'a','')]."
 martial_strategy_special.1402.a.tt: "#F S rozjařenými vojáky je snazší pořízení než s rozzuřeným hostinským. Pátrání však musí pokračovat.#!"
 martial_strategy_special.1402.b: "Tihle muži na to kápli. Nalijte mi!"
 martial_strategy_special.1402.b.tt: "#F Popíjení s prostým lidem! To je život! Alespoň dokud nebudeš muset pokračovat v pátrání.#!"
 martial_strategy_special.1402.c: "Už mě nebaví řešit neukázněné vojáky."
 martial_strategy_special.1402.d: "Vezměte něco na cestu a vyrážíme!"
 martial_strategy_special.1402.d.tt: "#F Jsi si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že tyto vojáky přesvědčíš, aby se k pátrání přidali.#!"
 martial_strategy_special.1403.t: "Na pochodu"
 martial_strategy_special.1403.desc: "Když se blížím k [ROOT.Char.Custom('IndefiniteBodyOfWater')], zahlédnu na břehu tábor. Jakmile do něj vstoupím, přivítá mě velící seržant.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Během pochodu nám vytekly zásoby vody a soumaři cestu domů s tím málem, co nám zbylo, nezvládnou.“ Voják se na mě nervózně podívá. „Kdyby však [ROOT.Char.GetLadyLord] a [ROOT.Char.Custom('MountedWarriorTermPlural')] pomohli nést měchy s vodou...“"
 martial_strategy_special.1403.a: "Jestli je to jediná možnost..."
 martial_strategy_special.1403.a.tt: "#F Jaká potupa, nosit vodu pro mezky!#!"
 martial_strategy_special.1403.b: "Muži vyrazí na pochod, a to hned!"
 martial_strategy_special.1403.b.tt: "#F „To si ti prosťáčci opravdu myslí, že voda je důležitější než mé rozkazy?“#!"
 martial_strategy_special.1403.c: "Prostě je dostaň domů, seržante. Už je mi to jedno."
 martial_strategy_special.1403.d: "Myslím, že pro to najdu řešení."
 martial_strategy_special.1403.d.tt: "#F Takže, pokud jeden mezek potřebuje osm galonů vody denně...#!"
 martial_strategy_special.1404.t: "Na pochodu"
 martial_strategy_special.1404.desc: "Když mi průzkumní jezdci přinesli zprávu o malém táboře, nečekal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že vojáky najdu stále ještě nacvičovat bojové formace.\n\nZdá se, že [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] se [Select_CString(knight.IsFemale,'sama rozhodla','sám rozhodl')] pokračovat v polním výcviku, zatímco čekali na zprávy od hlavní armády. Když přijíždím blíž, [Select_CString(knight.IsFemale,'její','jeho')] vojáci stojí úhledně seřazení."
 martial_strategy_special.1404.a: "Takové rozkazy jsem nevydal[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 martial_strategy_special.1404.a.tt: "#EMP Moji#! vojáci musí plnit #EMP mé#! rozkazy."
 martial_strategy_special.1404.b: "Co je to za mizerný postoj? Takhle se meč nedrží!"
 martial_strategy_special.1404.b.tt: "Není divu, že se ztratili - tihle vojáci potřebují kázeň!"
 martial_strategy_special.1404.c: "Odveď muže domů, [knight.GetFirstNameNoTooltip]. Už mě hledání unavuje."
 martial_strategy_special.1404.d: "[soldier_friend.GetTitledFirstNameNoTooltip] může převzít velení nad těmito vojáky."
 martial_strategy_special.1404.d.tt: "[soldier_friend.GetTitledFirstNameNoTooltip] je bezpečně dovede na hrad."
 martial_strategy_special.1405.t: "Na pochodu"
 martial_strategy_special.1405.desc: "Když procházím malou vesnicí, všimnu si, že místní stráže sice nosí prostý oděv, ale všechny mají zbraně označené mou značkou!\n\nNa blátivé ulici mě přivítá [zealot.GetTitledFirstName], [Select_CString(zealot.IsFemale,'samozvaná „božská ochránkyně“','samozvaný „božský ochránce“')] města. Moji vojáci odložili zbroj, aby tomuto kazateli pomáhali sloužit [zealot.GetFaith.HighGodName]!"
 martial_strategy_special.1405.a: "Už přece vládnu z božského práva!"
 martial_strategy_special.1405.a.tt: "#F „Tihle vojáci by si měli vzpomenout, že podle božského plánu [Select_CString(ROOT.Char.IsFemale,'jsem byla vyvolena','jsem byl vyvolen')] právě já.“#!"
 martial_strategy_special.1405.b: "Máš jeden den, abys odsud zmizel[Select_CString(zealot.IsFemale,'a','')], fanatiku."
 martial_strategy_special.1405.b.tt: "#F „Potrestat [Select_CString(zealot.IsFemale,'tu ženu','toho muže')] se zdá nebezpečné, ale vyhnanství můj problém prozatím vyřeší.“#!"
 martial_strategy_special.1405.c: "Hra na svaté vojáky je brzy omrzí."
 martial_strategy_special.1405.d: "Přidej se ke mně, kazateli, a společně naplníme [ROOT.Char.GetFaith.HighGodNamePossessive] vůli!"
 martial_strategy_special.1405.d.tt: "#F „Koneckonců, nesloužíme svým způsobem všichni [ROOT.Char.GetFaith.HighGodNameAlternate]?“#!"
 martial_strategy_special.1498.t: "Na pochodu"
 martial_strategy_special.1498.desc: "Poslední z mých vojáků se vrátili do [capital.GetNameNoTier] a pořádek je obnoven.\n\nSotva to byla ukázka vojenské geniality, ale získal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem nový pohled na svou armádu i na jednotlivé vojáky, kteří ji tvoří."
 martial_strategy_special.1498.a: "Nakonec to přece jen bylo užitečné cvičení!"
 martial_strategy_special.1499.t: "Na pochodu"
 martial_strategy_special.1499.desc: "Chvíli to trvá, ale pohřešovaní vojáci se pomalu a jistě trousí zpět branami [capital.GetNameNoTier].\n\nMožná jsem na tom neměl[Select_CString(ROOT.Char.IsFemale,'a','')] příliš velkou zásluhu, ale zdá se, že si z celé zkušenosti hodně odnesli."
 martial_strategy_special.1499.a: "Tohle cvičení neproběhlo podle plánu."
 martial_strategy_special.1499.a.tt: "#F V [ROOT.Char.Custom('FortifiedBuilding')] je stejně mnohem pohodlněji než v terénu.#!"
