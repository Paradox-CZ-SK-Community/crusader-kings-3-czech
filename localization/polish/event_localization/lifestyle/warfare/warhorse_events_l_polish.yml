l_polish:
 warhorse.0001.t: "Válečný kůň"
 warhorse.0001.desc: "Obdivuji, jak [ROOT.Char.Custom('HorseStoryMareStallion')] plní každý můj rozkaz, a přemýšlím, jaké jméno mu dát..."
 warhorse.0001.a: "Jméno inspirované historií!"
 warhorse.0001.b: "Mytologie oplývá úchvatnými jmény koní!"
 warhorse.0001.c: "Je to jen kůň, takže by se podle toho měl i jmenovat."
 warhorse.0002.desc: "Hledám inspiraci u slavných koní, kteří kdysi patřili velkým vládcům a hrdinům minulosti, a přemýšlím nad jménem pro svého válečného koně."
 warhorse.0002.a: "$warhorse_name_tencendur$ — jako kůň Karla Velikého!"
 warhorse.0002.b: "$warhorse_name_bucephalus$ — jako kůň Alexandra Velikého!"
 warhorse.0002.c: "$warhorse_name_seianian$ — osud Gnaea Seia je určitě přehnaný!"
 warhorse.0002.d: "$warhorse_name_zuljanah$ — podle koně Husajna ibn Alího!"
 warhorse.0002.e: "$warhorse_name_red_hare$ — podle koně vojevůdce Lü Bu!"
 warhorse.0002.f: "$warhorse_name_veillantif$ — jako Rolandův kůň!"
 warhorse.0002.g: "$warhorse_name_incitatus$ — oblíbenec císaře Caliguly!"
 warhorse.0002.go_back: "Hm, jiné téma by se pro jméno hodilo lépe..."
 warhorse.0003.desc: "Mytologický svět oplývá velkolepostí i jmény hodnými koní."
 warhorse.0003.llamrei: "$warhorse_name_llamrei$ — podle koně krále Artuše!"
 warhorse.0003.sleipnir: "$warhorse_name_sleipnir$ — jako oř, který nosil Odina!"
 warhorse.0003.uchchaihshravas: "$warhorse_name_uchchaihshravas$ — oř boha Slunce!"
 warhorse.0003.dadhi_kra: "$warhorse_name_dadhi_kra$ — ranní slunce!"
 warhorse.0003.devadatta: "$warhorse_name_devadatta$ — jako vlastní kůň Kalkiho!"
 warhorse.0003.keshi: "$warhorse_name_keshi$ — podle koňského démona!"
 warhorse.0003.kanthaka: "$warhorse_name_kanthaka$ — podle věrného oře Gautamy Buddhy!"
 warhorse.0003.burko: "$warhorse_name_burko$ — jako kouzelný kůň z lidových pověstí!"
 warhorse.0003.aranjagaan: "$warhorse_name_aranjagaan$ — oř velkého válečníka Džangara!"
 warhorse.0003.haizum: "$warhorse_name_haizum$ — kůň archanděla Gabriela!"
 warhorse.0003.buraq: "$warhorse_name_buraq$ — podle bytosti, která nosila proroky!"
 warhorse.0003.balius: "$warhorse_name_balius$ — jeden z Achillových koní!"
 warhorse.0003.xanthos: "$warhorse_name_xanthos$ — jméno druhého Achillova koně by se hodilo lépe!"
 warhorse.0003.boreas: "$warhorse_name_boreas$ — starořecký bůh severního větru!"
 warhorse.0003.khiimori: "$warhorse_name_khiimori$, Větrný kůň, symbol duše!"
 warhorse.0003.rlung_rta: "$warhorse_name_rlung_rta$, nositel modliteb a štěstí!"
 warhorse.0003.jonon_khar: "$warhorse_name_jonon_khar$, létající kůň, jehož ržání připomíná zvuk morin churu."
 warhorse.0003.tulpar: "$warhorse_name_tulpar$ — božský okřídlený tvor bezkonkurenční rychlosti."
 warhorse.0003.aranzhale: "$warhorse_name_aranzhale$ — podle dalšího z Džangarových ořů."
 warhorse.0003.oyomaa: "$warhorse_name_oyomaa$ — podle nádherného tmavého koně Möngena Šigširgeho."
 warhorse.0003.rakhsh: "$warhorse_name_rakhsh$ ze #EMP Šáhnáme#!, s tělem lva a silou slona."
 warhorse.0004.desc: "Kůň by měl dostat jméno odpovídající tomu, čím ve skutečnosti je."
 warhorse.0004.a: "$warhorse_name_charger$."
 warhorse.0004.b: "$warhorse_name_abbot$."
 warhorse.0004.c: "$warhorse_name_prancer$."
 warhorse.0004.d: "$warhorse_name_glitterhoof$."
 warhorse.0004.courser: "$warhorse_name_courser$."
 warhorse.1001.t: "[ROOT.Char.Custom('WarhorseStoryName')|U]: [ROOT.Char.Custom('HorseStoryMareStallion')|U] k nezaplacení"
 warhorse.1001.desc: "Po doslechu zvěstí o mém mocném válečném koni [ROOT.Char.Custom('WarhorseStoryName')] mě vyhledal proslulý cvičitel a nabízí své služby.\n\n„Na oplátku žádám jen malou odměnu.“"
 warhorse.1001.a: "[ROOT.Char.Custom('HorseStorySheHe')|U] musí zesílit."
 warhorse.1001.b: "[ROOT.Char.Custom('HorseStorySheHe')|U] se musí naučit pohybovat rychleji."
 warhorse.1001.c: "[ROOT.Char.Custom('HorseStorySheHe')|U] musí zapracovat na [ROOT.Char.Custom('HorseStoryHerHis')] výdrži."
 warhorse.1001.d: "Pokud [ROOT.Char.Custom('HorseStorySheHe')] něco postrádá, pak je to zuřivost!"
 warhorse.1001.e: "Nemám zájem."
 warhorse.1001.e.tt: "#F „[THIS.Char.Custom('WarhorseStoryName')] nepotřebuje jiného cvičitele než mě!“#!"
 warhorse.1001.f: "Od toho přece platím $master_of_horse_court_position$!"
 warhorse.1001.f.tt: "Tvůj $master_of_horse_court_position$ začíná cvičit [THIS.Char.Custom('WarhorseStoryName')]"
 warhorse.1001.f.failure: "[Select_CString(ROOT.Char.IsFemale,'Přecenila jsi','Přecenil jsi')] svého $master_of_horse_court_position$"
 warhorse.1001.f.failure.tt: "[m_horse.GetTitledFirstNameNoTooltip] nezvládne výcvik koně [ROOT.Char.Custom('WarhorseStoryName')]."
 warhorse.1002.desc: "[ROOT.Char.Custom('WarhorseStoryName')] si při výcviku vede skvěle a výsledky jsou vidět okamžitě!"
 warhorse.1002.a: "To byly dobře utracené peníze!"
 warhorse.1101.t: "[ROOT.Char.Custom('WarhorseStoryName')|U]: Slunečný den"
 warhorse.1101.desc: "Když mířím k uvazovacím kůlům, vítá mě radostné ržání koně [ROOT.Char.Custom('WarhorseStoryName')]. [ROOT.Char.Custom('HorseStorySheHe')|U] se v krásném počasí očividně nemůže dočkat, až si protáhne nohy, a já s tím nemohu než souhlasit."
 warhorse.1101.a: "Musím využít každou chvíli k tréninku!"
 warhorse.1101.b: "Tak krásný den si musím pořádně užít!"
 warhorse.1201.t: "[ROOT.Char.Custom('WarhorseStoryName')|U]: [ROOT.Char.Custom('HorseStoryMareStallion')|U] v nesnázích"
 warhorse.1201.desc: "[ROOT.Char.Custom('WarhorseStoryName')] se ke mně pomalu vleče. [ROOT.Char.Custom('HorseStoryHerHis')|U] nohy sotva opouštějí zem a hlava bezvládně visí. Není pochyb — [ROOT.Char.Custom('HorseStoryMareStallion')] stůně.\n\nOšetřovatel mě ujišťuje, že na [ROOT.Char.Custom('HorseStoryHerHis')] nemoc existuje lék, ale bude stát nemalé peníze."
 warhorse.1201.a: "Pro [ROOT.Char.Custom('WarhorseStoryName')] není žádná cena příliš vysoká!"
 warhorse.1201.b: "Ať se stane cokoli, [ROOT.Char.GetFaith.HighGodName] má poslední slovo."
 warhorse.1201.b_good: "[ROOT.Char.Custom('WarhorseStoryName')] se uzdraví"
 warhorse.1201.b.tt: "[THIS.Char.Custom('HorseStorySheHe')|U] ti ale začne méně důvěřovat"
 warhorse.1201.b_bad: "[ROOT.Char.Custom('WarhorseStoryName')] podlehne nemoci"
 warhorse.1301.t: "[ROOT.Char.Custom('WarhorseStoryName')|U]: [Select_CString(horse_vassal.IsFemale,'Milovnice koní','Milovník koní')]"
 warhorse.1301.desc: "[horse_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] si [ROOT.Char.Custom('WarhorseStoryName')] prohlíží od hlavy k patě a uznale přikyvuje.\n\n„To je ale [ROOT.Char.Custom('HorseStoryMareStallion')]! Kdybyste mi [Select_CString(ROOT.Char.IsFemale,'dovolila','dovolil')] projet se na [ROOT.Char.Custom('WarhorseStoryName')], [Select_CString(horse_vassal.IsFemale,'byla bych vám velice vděčná','byl bych vám velice vděčný')].“"
 warhorse.1301.a: "Užij si to!"
 warhorse.1301.a.tt: "[THIS.Char.Custom('WarhorseStoryName')] je divoký oř a [horse_vassal.GetFirstNameNoTooltip] [Select_CString(horse_vassal.IsFemale,'není zrovna proslulá','není zrovna proslulý')] svou udatností — zvládne to?"
 warhorse.1301.b: "Na [ROOT.Char.Custom('WarhorseStoryName')] nejezdí nikdo kromě mě!"
 warhorse.1401.t: "[ROOT.Char.Custom('WarhorseStoryName')|U]: Koňská hrůza"
 warhorse.1401.desc: "Když padne tma, zůstávám téměř o samotě a noční ticho narušuje jen dupot kopyt koně [ROOT.Char.Custom('WarhorseStoryName')]. [ROOT.Char.Custom('HorseStorySheHe')|U] se na mě dívá nějak podivně, téměř... #EMP výhružně#!.\n\n[ROOT.Char.Custom('HorseStoryHerHis')|U] pohled mě sleduje, i když se otáčím k odchodu, a mráz, který mi přeběhne po zádech, mě neopouští ještě dlouho do noci."
 warhorse.1401.a: "To je směšné — [ROOT.Char.Custom('HorseStorySheHe')] je přece jen zvíře."
 warhorse.1401.a.tt: "#F Proč ale pořád cítíš [THIS.Char.Custom('HorseStoryHerHis')] pohled na sobě?#!"
 warhorse.1401.b: "Na [ROOT.Char.Custom('HorseStoryHerHis')] hřbetě určitě leží kletba. Zbavte se [ROOT.Char.Custom('WarhorseStoryName')]!"
 warhorse.1402.desc: "Nohy mám pohmožděné od kopyt, ruce rozedrané od zubů a celé tělo samou modřinu po pádech... [ROOT.Char.Custom('WarhorseStoryName')] vesele řehtá, zatímco [ROOT.Char.Custom('HorseStorySheHe')] mě málem shodí přímo na kopí jednoho z vojáků. Nevím, kolik toho ještě vydržím."
 warhorse.1402.a: "Nenechám se porazit koněm!"
 warhorse.1402.b: "Příběh koně [ROOT.Char.Custom('WarhorseStoryName')] tady končí."
 warhorse.1499.desc: "Stane se to právě při návratu z krátké vyjížďky — přesně to, čeho se děsím od chvíle, kdy jsem v pohledu koně [ROOT.Char.Custom('WarhorseStoryName')] poprvé [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')] zlobu. [ROOT.Char.Custom('HorseStorySheHe')|U] mě shodí právě ve chvíli, kdy projíždíme kolem ostrých skal, a já padám hlavou přímo na hranu jedné z nich. Bolest mi zastře zrak a slyším už jen hlasité ržání, než všechno pohltí tma..."
 warhorse.1499.a: "[ROOT.Char.Custom('WarhorseStoryName')]... proč?"
 warhorse.8001.t: "[ROOT.Char.Custom('WarhorseStoryName')|U]: Konec života"
 warhorse.8001.desc: "[ROOT.Char.Custom('WarhorseStoryName')] stárne. [ROOT.Char.Custom('HorseStoryHerHis')|U] krok už není tak svižný jako dřív a oheň v [ROOT.Char.Custom('HorseStoryHerHis')] očích pomalu vyhasíná.\n\nPokud chci zachovat [ROOT.Char.Custom('HorseStoryHerHis')] pokrevní linii, musím rychle najít vhodný protějšek."
 warhorse.8001.a: "Najdu silného [ROOT.Char.Custom('HorseStoryOppositeMareStallion')]."
 warhorse.8001.b: "Najděte obratného [ROOT.Char.Custom('HorseStoryOppositeMareStallion')]."
 warhorse.8001.c: "U [ROOT.Char.Custom('HorseStoryOppositeMareStallion')] je nejdůležitější výdrž."
 warhorse.8001.d: "Prohledejte země a najděte nejzuřivějšího [ROOT.Char.Custom('HorseStoryOppositeMareStallion')]!"
 warhorse.8001.e: "Dopřeji [ROOT.Char.Custom('WarhorseStoryName')] klidné poslední dny."
 warhorse.8002.t: "[ROOT.Char.Custom('WarhorseStoryName')|U]: Koloběh života"
 warhorse.8002.desc: "Můj milovaný [ROOT.Char.Custom('HorseStoryMareStallion')] [ROOT.Char.Custom('WarhorseStoryName')] už není mezi námi, ale [ROOT.Char.Custom('HorseStorySheHe')] po sobě zanechává silné hříbě! Už teď v něm poznávám [ROOT.Char.Custom('HorseStoryHerHis')] povahu — v jistém smyslu je můj přítel stále se mnou."
 warhorse.8002.a: "Odpočívej v pokoji, [ROOT.Char.Custom('WarhorseStoryName')]."
 warhorse.8003.desc: "Když vyjdu na čerstvý vzduch, přivítá mě smutná zpráva o noční smrti mého milovaného koně [ROOT.Char.Custom('WarhorseStoryName')]. V srdci po něm zůstává jen prázdnota."
 warhorse.8003.a: "Ach, [ROOT.Char.Custom('WarhorseStoryName')], budeš mi chybět!"
