 marriage_effect.1001.t: "Láska vítězí"
 marriage_effect.1001.desc: "Ach, [spouse.GetTitledFirstName], [spouse.Custom('LoverPetName')|l]! Teď tě konečně mohu bez obav obejmout před zraky všech a s požehnáním, které nám dává [ROOT.Char.GetFaith.FertilityGodName]... Jsem [Select_CString(ROOT.Char.IsFemale, 'nejšťastnější žena', 'nejšťastnější muž')] na světě!"
 marriage_effect.1001.a: "Pojď ke mně, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse') )|l]!"
 marriage_effect.1002.desc: "Ach, [spouse_2.GetTitledFirstName], [spouse_2.Custom('LoverPetName')|l]! Teď tě konečně mohu bez obav obejmout před zraky všech a s požehnáním, které nám dává [ROOT.Char.GetFaith.FertilityGodName]... Jsem [Select_CString(ROOT.Char.IsFemale, 'nejšťastnější žena', 'nejšťastnější muž')] na světě!"
 marriage_effect.1002.a: "Pojď ke mně, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse_2') )|l]!"
 marriage_effect.2001.t: "Svatební oslava"
 marriage_effect.2001.desc.start_normal: "Po mém sňatku s [new_spouse.GetTitledFirstName] od nás všichni očekávají náležitě okázalou svatební oslavu."
 marriage_effect.2001.desc.start_divine_marriage: "Po mém sňatku s [new_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] celé Panství dychtivě očekává velkolepou hostinu na oslavu opětovného spojení naší božské krve."
 marriage_effect.2001.desc.start_prison: "Můj nový protějšek [new_spouse.GetTitledFirstName] je nyní ve vězení. Přesto je náš sňatek platný a Panství od nás stále očekává okázalou svatební oslavu."
 marriage_effect.2001.desc.end: "\n\nMám plné právo při této příležitosti vybrat královskou pomocnou dávku, někteří však mohou považovat uvalení další daně v čase oslav za nevkusné..."
 marriage_effect.2001.a: "Samozřejmě ji vyberu! Kdo si platí vlastní svatbu?"
 marriage_effect.2001.b: "Dovolím svým poddaným užít si oslavy bez starostí."
 