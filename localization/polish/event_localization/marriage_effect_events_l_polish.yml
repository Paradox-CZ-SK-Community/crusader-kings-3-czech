l_polish:
 marriage_effect.0001.t: "Náprava"
 marriage_effect.0001.desc.multiple: "Konečně je vše tak, jak vždy mělo být. Tajemství, které se vznášelo nad mými [illegitimate_child.Custom('TwinDaughtersSonsChildren')|l], nám už nemůže ublížit. Jejich otec [new_spouse.GetTitledFirstName] a já jsme teď právoplatně svoji."
 marriage_effect.0001.desc.child: "Probděla jsem mnoho nocí obavami o své dítě [illegitimate_child.GetTitledFirstName] a o to, co by s námi bylo, kdyby pravda o jeho původu vyšla najevo.\n\nJeho otec [new_spouse.GetTitledFirstName] a já jsme teď právoplatně svoji, takže své dávné obavy mohu konečně nechat odpočívat."
 marriage_effect.0001.desc.pregnancy: "Ode dne, kdy jsem zjistila, že jsem těhotná, mě sžíraly obavy o budoucnost mého dítěte. Teď se jich konečně mohu zbavit. Otec dítěte [new_spouse.GetTitledFirstName] a já jsme právoplatně svoji."
 marriage_effect.0001.a: "Tohle tajemství mě už strašit nebude."
 marriage_effect.0002.desc.multiple: "Konečně je vše tak, jak vždy mělo být. Tajemství, které se vznášelo nad mými [illegitimate_child.Custom('TwinDaughtersSonsChildren')|l], už nemůže ublížit jim ani jejich matce [real_mother.GetTitledFirstName]. Teď jsme totiž právoplatně svoji."
 marriage_effect.0002.desc.child: "Probděl jsem mnoho nocí obavami o své dítě [illegitimate_child.GetTitledFirstName] a o to, co by s ním bylo, kdyby pravda o jeho původu vyšla najevo.\n\nJeho matka [real_mother.GetTitledFirstName] a já jsme teď právoplatně svoji, takže své dávné obavy mohu konečně nechat odpočívat."
 marriage_effect.0002.desc.pregnancy: "Ode dne, kdy jsem zjistil, že [real_mother.GetTitledFirstName] čeká naše dítě, mě sžíraly obavy o jeho budoucnost. Teď jsme právoplatně svoji a já je konečně mohu nechat odpočívat."
 marriage_effect.0002.desc.pregnancy_not_knowing: "[real_mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistoupí s rukou položenou na břiše.\n\n„Dřív jsem ti to neřekla, ale... Dítě, které nosím, je tvoje. Teď, když jsme právoplatně svoji, už nám tohle tajemství nemůže ublížit.“"
 marriage_effect.0001.a_not_knowing: "Ach, já... mám radost."
 marriage_effect.0003.desc.pregnancy: "Ode dne, kdy jsem zjistil, že má [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] čeká dítě s [new_spouse.GetTitledFirstName], jsem jejich tajemství úzkostlivě střežil. Teď jsou konečně právoplatně svoji a já si mohu oddechnout."
 marriage_effect.0003.desc.multiple: "Od narození dětí mám starost o svou [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] i o její [illegitimate_child.Custom('TwinDaughtersSonsChildren')|l]. Vím totiž, že byly počaty z jejího nedovoleného svazku s [new_spouse.GetTitledFirstName].\n\nTeď jsou [new_spouse.GetTitledFirstName] a [real_mother.GetFirstName] právoplatně svoji, takže své dávné obavy mohu konečně nechat odpočívat."
 marriage_effect.0003.desc: "Od narození dítěte mám starost o svou [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_mother') )] [real_mother.GetTitledFirstName] i o [illegitimate_child.GetTitledFirstName]. Vím totiž, že dítě bylo počato z jejího nedovoleného svazku s [new_spouse.GetTitledFirstName].\n\nTeď jsou [new_spouse.GetTitledFirstName] a [real_mother.GetFirstName] právoplatně svoji, takže své dávné obavy mohu konečně nechat odpočívat."
 marriage_effect.0011.desc.multiple: "Konečně je vše tak, jak vždy mělo být. Tajemství, které se vznášelo nad mými [illegitimate_child.Custom('TwinDaughtersSonsChildren')|l], nám už nemůže ublížit. Jejich otec [new_spouse.GetTitledFirstName] a já jsme teď spojeni právoplatným svazkem."
