l_polish:
 marriage_interaction.0001.desc.start: "[ROOT.Char.GetFullName],\n\nPo pečlivém zvážení ruším "
 marriage_interaction.0001.desc.liegetoliege: "zasnoubení mezi mou [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] [rejecting_betrothed.GetTitledFirstName] a tvou [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rejected_betrothed'))] [rejected_betrothed.GetTitledFirstName]."
 marriage_interaction.0001.desc.betrothedtobetrothed: "naše zasnoubení."
 marriage_interaction.0001.desc.betrothedtoliege: "své zasnoubení s tvou [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rejected_betrothed'))] [rejected_betrothed.GetTitledFirstName]."
 marriage_interaction.0001.desc.liegetobetrothed: "tvé zasnoubení s mou [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] [rejecting_betrothed.GetTitledFirstName]."
 marriage_interaction.0001.desc.end: "Omlouvám se za veškeré nepříjemnosti, které mé rozhodnutí způsobí, a upřímně doufám, že nepoškodí vztahy mezi našimi rodinami."
 marriage_interaction.0001.a: "Těžká urážka..."
 marriage_interaction.0002.desc: "Mé [actor.Custom2('RelationToMe', SCOPE.sC('rejecting_betrothed'))] [rejecting_betrothed.GetFullName],\n\nDospěl jsem k závěru, že tvůj zamýšlený sňatek s [rejected_betrothed.GetTitledFirstName] není v nejlepším zájmu ani tvém, ani naší rodiny. Proto jsem se rozhodl zasnoubení zrušit."
 marriage_interaction.0002.a: "Bohužel."
 marriage_interaction.0004.t: "Zasnoubení ponechané svému osudu"
 marriage_interaction.0004.desc: "Dohody byly uzavřeny a vše bylo připraveno, dokud nenastal čas sňatek skutečně uzavřít. Obě strany se však zjevně spokojily s předstíráním, že k žádné dohodě nikdy nedošlo, takže je nepravděpodobné, že se [betrothed_1.GetTitledFirstName] a [betrothed_2.GetTitledFirstName] vůbec někdy vezmou."
 marriage_interaction.0004.a: "Tak je to nejlepší."
 marriage_interaction.0005.t: "Zasnoubení ponechané svému osudu"
 marriage_interaction.0005.desc: "Navzdory všemu vyjednávání a pečlivému plánování to vypadá, že si svého snoubence [other_betrothed.GetTitledFirstName] nikdy nevezmu. Přestože už nadešel čas slíbený sňatek uzavřít, ani jedna strana neučinila potřebný krok."
 marriage_interaction.0005.a: "Kdo ví, koho si teď nakonec vezmu."
 marriage_interaction.0006.t: "Zasnoubení ponechané svému osudu"
 marriage_interaction.0006.desc: "Navzdory všemu vyjednávání a pečlivému plánování to vypadá, že si svého snoubence [other_betrothed.GetTitledFirstName] nikdy nevezmu. Přestože už nadešel čas slíbený sňatek uzavřít, ani jedna strana neučinila potřebný krok."
 marriage_interaction.0006.a: "Koho si nakonec vezmu?"
 marriage_interaction.0008.t: "Zasnoubení zrušené kvůli víře"
 marriage_interaction.0008.desc: "[betrothed_clergy.GetTitledFirstName] [Select_CString(betrothed_clergy.IsFemale, 'zasvětila', 'zasvětil')] svůj život [betrothed_clergy.GetFaith.HighGodName] - navzdory všemu vyjednávání a pečlivému plánování to vypadá, že si [betrothed_2.GetTitledFirstName] nikdy nevezme. "
 marriage_interaction.0008.a: "Bohužel."
 marriage_interaction.0009.desc_clergy: "Teď, když jsem svůj život [Select_CString(betrothed_clergy.IsFemale, 'zasvětila', 'zasvětil')] [betrothed_clergy.GetFaith.HighGodName], je mi sňatek zapovězen a musím svého snoubence [betrothed_2.GetTitledFirstName] opustit. Doufám, že mi [betrothed_2.GetFirstNameNoTooltip] odpustí."
 marriage_interaction.0009.desc: "[betrothed_clergy.GetTitledFirstName] [Select_CString(betrothed_clergy.IsFemale, 'zasvětila', 'zasvětil')] svůj život [betrothed_clergy.GetFaith.HighGodName] - navzdory všemu vyjednávání a pečlivému plánování to vypadá, že si svého snoubence nikdy nevezmu."
 marriage_interaction.0009.a: "Bohužel."
