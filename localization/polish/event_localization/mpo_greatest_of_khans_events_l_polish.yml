 mpo_gok_onslaught_white_peace_defender: "Zachováš si nezávislost a vládu, ztratíš pouze obsazená hrabství."
 mpo_gok_onslaught_defeat_attacker: "$mpo_gok_onslaught_white_peace$ Utrpíš ponížení."
 mpo_gok_onslaught_defeat_defender: "$mpo_gok_onslaught_white_peace_defender$ [attacker.GetShortUIName|U] utrpí ponížení."
 mpo_gok_onslaught_defeat: "$mpo_gok_onslaught_white_peace$ [attacker.GetShortUIName|U] utrpí ponížení."
 mpo_greatest_of_khans.0020_title: "[recipient.GetTitledFirstNameNoTooltip] se podrobuje"
 goK_war_gain_all_titles: "Získá #high všechny#! [Concept('vassals','vazaly')|E] a [Concept('titles','tituly')|E] pod [Concept('empire','říšskou')|E] [Concept('title_tier','úrovní')|E]. [defender.GetShortUINamePossessive] dvůr o ně přijde"
 goK_war_gain_vassal_titles: "Získáš většinu [Concept('landed','zeměpanských')|E] [Concept('titles','titulů')|E], které drží [Concept('vassals','vazalové')|E] [Concept('duchy','vévodské')|E] a [Concept('kingdom','královské')|E] [Concept('title_tier','úrovně')|E], pokud nejsou [Concept('administrative','administrativní')|E]. [defender.GetShortUINamePossessive] dvůr tak o tyto tituly přijde"
 mpo_greatest_of_khans.0021.opening: "[Select_CString(actor.IsFemale,'Velká','Veliký')] [actor.GetTitledFirstNameNoTooltip], [Select_CString(actor.IsFemale,'sjednotitelka','sjednotitel')] stepných národů,"
 mpo_greatest_of_khans.0021.desc_nomad: "Osud stojí při tobě a [recipient.GetDomicile.GetCulture.GetCollectiveNoun] také.\n\nJá, [recipient.GetFirstName], ti dávám veškerou svou sílu. Se svými nejlepšími jezdci budu zbraní ve tvé pravici."
 mpo_greatest_of_khans.0021.desc: "Podrobuji se. Je jen správné, abych já i všichni vládci světa ctili tvou velikost a moc a zároveň se jí báli.\n\nTvůj děsivý stín dopadá na zdi mého domova i na trůn [recipient.GetPrimaryTitle.GetNameNoTier]. Má věrnost ani tribut ti nikdy nebudou chybět."
 mpo_greatest_of_khans.0021.a: "[recipient.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] ušetřím ostří svého hněvu."
 mpo_greatest_of_khans.0022.opening: "[actor.GetFirstNameNoTooltip], ty Největší z podvraťáků,"
 mpo_greatest_of_khans.0022.desc_nomad: "Dokud ve mně proudí život, nechám si snad nepřítelem vzít svůj toulec? Jakou cenu by pak můj život měl?\n\nPadnu-li při obraně lidu [recipient.GetDomicile.GetCulture.GetCollectiveNoun], pohřbí vedle mých kostí můj toulec i luk. Ale pokud zde zemřeš #EMP ty#!... tvůj luk zlomíme. Tvé tělo potřísníme zvířecími výkaly. Tvé maso předhodíme psům."
 mpo_greatest_of_khans.0022.desc: "Tví vyslanci páchli koňmi a vznešenému panství [recipient.GetPrimaryTitle.GetNameNoTier] nepřinesli nic než hrubé výhrůžky. Nechal jsem je zabít.\n\nKlidně opusť kožené stany své pustiny a vydej se sem. Čekají tu na tebe pevné hradby."
 mpo_greatest_of_khans.0022.a: "[recipient.GetPrimaryTitle.GetNameNoTierNoTooltip|U] se utopí v krvi."
 mpo_greatest_of_khans.0022.a_nomadic: "Osud [recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] je zpečetěn."
 mpo_greatest_of_khans.0030.t: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] navěky"
 mpo_greatest_of_khans.0030.desc: "V tisících měst a vesnic hrdě pochodují [ROOT.Char.GetCulture.GetName] válečníci. V palácích a velkých síních je slovo mých úředníků zákonem. Každý nomád i každé zvíře stepi ve svém nitru ví, že vládnu já. A páni usedlých zemí se krčí u mých nohou.\n\nFilosofové i vojevůdci slouží mé vůli. Teď lze vše přetvořit a dát mému dílu, jímž je [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], věčnou podobu..."
 mpo_greatest_of_khans.0030.a: "#EMP Pálit! Vraždit! Vyhánět!#! Dokud všichni nebudou žít jako nomádi!"
 mpo_greatest_of_khans.0030.a.flavor: "Usedlý způsob života je podřadný. Činí lidi slabými. Většina národů mé říše si musí vybrat: opustit své domovy a přijmout nomádský život... nebo zemřít."
 mpo_greatest_of_khans.0030.b: "Administrativní stát, který mé země pevně uspořádá."
 mpo_greatest_of_khans.0030.b.flavor: "Velké administrativní říše světa přetrvaly dlouhá staletí a jejich moc sahala daleko."
 mpo_greatest_of_khans.0030.c: "Feudální hierarchie, která upevní mou vládu."
 mpo_greatest_of_khans.0030.c.flavor: "Přísahy nám nomádům nejsou cizí a na feudálních slovech o cti je cosi přitažlivého..."
 mpo_greatest_of_khans.0030.d: "Ať klany vládnou tomu, co klany dobyly."
 mpo_greatest_of_khans.0030.d.flavor: "Sláva klanu [ROOT.Char.GetHouse.GetName] je největší... pokud budeme držet při sobě a svá panství uspořádáme podle pokrevních pout."
 mpo_greatest_of_khans.0030.e: "Mé dílo, [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], je slavné už takové, jaké je."
 mpo_greatest_of_khans.0030.e.flavor: "Můj lid vládne pouhou silou. Ať naši usedlí poddaní naříkají. Kopyta našich koní je umlčí."
 gok_every_held_title_gains_castles: "Každé [Concept('county_capital','hlavní sídlo hrabství')|E] ve tvé [Concept('domain','doméně')|E] získá [Concept('castle','hradní')|E] [Concept('holding','državu')|E]"
 gok_some_nomad_vassals_holdings_switch: "Souhlasící [Concept('nomadic','nomádští')|E] [Concept('vassals','vazalové')|E] #high ([switching_vassals_value])#! rovněž změní svou [Concept('government','vládu')|E] a typy [Concept('holding','držav')|E]"
 great_khans_capital_modifier: "Trůn stepí"
 great_khans_capital_modifier_desc: "Z blízkých i vzdálených zemí sem přicházejí obchodníci, vojáci, úředníci i přistěhovalci. Hrabství se rychle osidluje a urbanizuje."
 gok_capital_holdings_switch_tt: "Získá [Concept('castle','hradní')|E] [Concept('holding','državu')|E] a pokud je to možné, také [Concept('temple','chrám')|E] a [Concept('city','město')|E]"
 gok_some_sedentaries_become_admin_tt: "Ochotní [Concept('feudal','feudální')|E] a [Concept('clan','klanoví')|E] vazalové přijmou [Concept('administrative','administrativní')|E] vládu"
 gok_counties_become_nomad_counties_tt: "Většina nenomádských [Concept('counties','hrabství')|E] ve tvém [Concept('realm','Panství')|E] #high ([burned_to_nomadism_value])#! získá [Concept('nomadic_holding','nomádskou državu')|E] a přijde o všechny ostatní [Concept('holdings','državy')|E]"
 gok_new_nomad_counties_lose_development_tt: "Tato [Concept('counties','hrabství')|E] přijdou o všechny úrovně @development_icon![Concept('development','rozvoje')|E] a veškerou @control_icon![Concept('control','kontrolu')|E]"
 gok_other_counties_lose_development_tt: "Všechna ostatní [Concept('counties','hrabství')|E] ve tvém [Concept('realm','Panství')|E] ztratí část úrovní @development_icon![Concept('development','rozvoje')|E]"
 gok_non_nomads_become_nomad_tt: "Ochotní nenomádští [Concept('vassals','vazalové')|E] #high ([sedentary_to_nomad_vassals_value])#! přijmou [Concept('nomadic','nomádskou')|E] vládu"
 gok_city_state_creation: "Neochotní nenomádští [Concept('vassals','vazalové')|E] #high ([city_state_vassals_value])#! budou omezeni na [Concept('duke','vévodskou')|E] [Concept('title_tier','úroveň')|E] a jejich přebytečné [Concept('titles','tituly')|E] získáš ty"
 gok_time_limit_end_decision_tt: "@alert_icon! #alert_trial Pokud tvá [Concept('dynasty','dynastie')|E] ztratí kontrolu nad [gok_title.GetName] nebo do roku #high [gok_empire_crumble_date|0]#! nepřijme #high $mpo_gok_world_conquest_decision$#! [Concept('decision','rozhodnutí')|E], tyto bonusy budou ztraceny a [gok_title.GetName] bude hrozit rozpad!#!"
 gok_time_limit_end_decision_other_players_tt: "Pokud [genghis_khan.GetShortUINamePossessive] [Concept('dynasty','dynastie')|E] ztratí kontrolu nad [gok_title.GetName] nebo do roku #high [gok_empire_crumble_date|0]#! nepřijme #high $mpo_gok_world_conquest_decision$#! [Concept('decision','rozhodnutí')|E], přijde o své bonusy"
 mpo_greatest_of_khans.0040.t: "Pohasínání velkého snu"
 mpo_greatest_of_khans.0040.desc_timed_out: "Rod [ROOT.Char.GetHouse.GetName] vládne naší říši krve už celá desetiletí. Hrdé hradby našich nepřátel leží v troskách a naše hordy tloustnou z kořisti. Z nejvyšších vrcholů hor jsme provolávali: [ROOT.Char.GetFaith.HighGodName] budiž veleben! A odpovědí nám byl nářek statisíců hlasů vyslovujících naše jména!\n\nVládli jsme však příliš dlouho. Naše sliby dalších výbojů už nikoho nenadchnou. Náčelníci a páni se rvou jako supi a ozývají se hlasy zpochybňující mé příkazy..."
 mpo_greatest_of_khans.0040.desc: "Naše velkolepá říše vyklouzla mé rodině z rukou! Už se nemůžeme bez odporu dovolávat přízně Velkého modrého nebe - už nemůžeme jediným švihnutím biče svolat hordy do války.\n\nV příštích letech se možná vyškrábu zpět na svůj právoplatný trůn jako zostuzený zločinec, který vyklouzl ze svého [Glossary('dřevěného pranýře', 'CANGUE_GLOSS')]... naše vznešená éra výbojů však skončila."
 mpo_greatest_of_khans.0040.a: "Přesto... svět se stále chvěje při vyslovení mého jména."
 gok_no_more_special_powers: "Už nemůžeš používat #high $mpo_offer_submission_or_ruin$#! ani #high $mpo_gok_onslaught_cb$#!"
 gok_no_more_reform_decision: "Už nemůžeš přijmout #high $mpo_gok_world_conquest_decision$#! [Concept('decision','rozhodnutí')|E]"
 gok_guaranteed_disastrous_chaotic_succession_tt: "@warning_icon! #X Tvé příští #high Chaotické#! [Concept('succession','nástupnictví')|E] pravděpodobně rozvrátí [ROOT.Char.GetPrimaryTitle.GetName]#!"
 mpo_greatest_of_khans.0041.t: "Stále veliký, chán už méně"
 mpo_greatest_of_khans.0041.desc: "Mé sídlo [ROOT.Char.Custom('ResidenceBuilding')] má nádherné zdi. Mé panství, [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l], je světem zákonů, sídel a pokojného obchodu... přicházejí však ještě staré sny?\n\nRozeznívá mé srdce stále osud Velkého chána, sen rozdrtit celý svět pod koňskými kopyty?\n\nToto [ROOT.Char.GetGovernment.GetAdjective] Panství se pod praporcem z koňských ohonů nesemkne v jediný celek. Na mé zavolání nenaloží vše na vozy a nevyrazí. Moji [ROOT.Char.Custom('GetFighterTermPlural')] a [ROOT.Char.Custom('GetLocalCommonerTermPlural')] už společně netouží dobývat pod Věčným modrým nebem.\n\nNáš velký sen o výbojích pohasl, ale stále jsme silní a bohatí."
 mpo_greatest_of_khans.0041.a: "Není právě toto pohodlí #EMP skutečným#! snem nomádů?"
