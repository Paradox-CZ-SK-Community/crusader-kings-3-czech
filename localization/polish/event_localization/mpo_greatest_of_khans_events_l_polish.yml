 mpo_gok_onslaught_victory_admin: "[attacker.GetShortUIName|U] získá [defender.GetShortUINamePossessive] majetek - všechny země a tituly."
 mpo_gok_onslaught_victory_attacker: "Získáš [defender.GetShortUINamePossessive] majetek, tedy všechny země, a také tituly, které patří [Select_CString(defender.IsFemale, 'jí', 'jemu')] a [Select_CString(defender.IsFemale, 'jejím', 'jeho')] silnějším vazalům."
