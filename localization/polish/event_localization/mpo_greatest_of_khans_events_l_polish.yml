 gok_cb_event_troops_tt: "Získá [Concept('special_troops','vojsko z událostí')|E]. [gok_victim.GetShortUINamePossessive] rozsah vlády v [Concept('realm','panství')|E] určuje velikost tohoto vojska"
 refused_the_great_khan_opinion: "Odmítnuté milosrdenství Největšího z chánů"
 tried_to_become_gok_opinion: "Pokus stát se Největším z chánů"
 gok_sacking_cultural_acceptance: "Brutální odveta vpadající hordy"
 gok_slaughter.t: "Masakr v [defender.GetCapitalLocation.GetNameNoTooltip]"
 gok_slaughter.tooltip: "Říká se, že [defender.GetPrimaryTitle.GetAdjective] lid zde zanechal hromady mrtvých a mezi nimi bylo #N [gok_slaughter_value]#! urozených lidí zohavených k nepoznání.\n\nJejich [defender.GetTitleAsName] se [Select_CString(defender.IsFemale, 'rozhodla', 'rozhodl')] vzdorovat. Proti nim stojí [Select_CString(attacker.IsFemale, 'veliká', 'veliký')] [attacker.GetTitleAsName]; [attacker.GetPrimaryTitle.GetAdjective] lid táhne s [Select_CString(attacker.IsFemale, 'ní', 'ním')]."
 gok_slaughter_victim.t: "Smrt rukou nájezdníků"
 gok_destruction.t: "[defender.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] v troskách"
 gok_destruction.tooltip: "[attacker.GetPrimaryTitle.GetAdjective] nájezd zaplavuje země, jimž vládne [defender.GetTitledFirstName]! Hordy v divokém běsnění srovnají se zemí #N [destroyed_holdings]#! [Concept('holdings','držav')|E] a povraždí všechny jejich obyvatele.\n\nTak se projevuje [attacker.GetTitleAsNamePossessive] hněv."
 gok_slaughter_victim.tooltip: "[gok.GetPrimaryTitle.GetAdjective] nájezd nezná slitování. [victim.GetShortUIName] [Select_CString(victim.IsFemale, 'padla', 'padl')] postupujícím hordám do cesty a [Select_CString(victim.IsFemale, 'byla nemilosrdně zabita', 'byl nemilosrdně zabit')]."
