 MPO_GREAT_WAR_OF_DEFIANCE_NAME_BASE: "$mpo_great_war_of_defiance_cb$"
 mpo_war_of_defiance_gok_loses_defender: "Jsi uvězněn [attacker.GetShortUIName]em a všechny tvé udělené [Concept('titles','tituly')|E], [Concept('vassals','vazalové')|E] a [Concept('tributaries','tributáři')|E] se stávají nezávislými. Přijdeš o většinu svého [Concept('herd','stáda')|E], [Concept('prestige','prestiže')|E], [Concept('gold','zlata')|E], [Concept('nomadic_authority','dominancí')|E] a [Concept('legitimacy','legitimita')|E]." # todo: CONCEPT CASE
 mpo_war_of_defiance_gok_loses_attacker: "[defender.GetShortUIName] je tebou uvězněn, ponížen, zbídačen a ztrácí všechny své [Concept('landed','zeměpána')|E] [Concept('titles','tituly')|E]. [defender.GetHerHis|U] [Concept('vassals','Vazalové')|E], [Concept('counties','hrabství')|E] a [Concept('tributaries','tributáři')|E] se stávají nezávislými." # todo: CONCEPT CASE
 mpo_war_of_defiance_gok_loses_other: "[defender.GetShortUIName] je uvězněn [attacker.GetShortUIName]em, ponížen, zbídačen a ztrácí všechny své [Concept('landed','zeměpána')|E] [Concept('titles','tituly')|E]. [defender.GetHerHis|U] [Concept('vassals','Vazalové')|E], [Concept('counties','hrabství')|E] a [Concept('tributaries','tributáři')|E] se stávají nezávislými." # todo: CONCEPT CASE
 mpo_war_of_defiance_gok_wins_defender: "Porazení [Concept('independent','nezávislý')|E] [Concept('nomads','nomádi')|E] se stanou tvými [Concept('obedient','poslušným')|E] [Concept('vassals','vazaly')|E]. Všechny ostatní [Concept('truces','příměří')|E] s tebou jsou zrušeny. Staneš se [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] a získáš mocné bonusy pro univerzální dobytí." # todo: CONCEPT CASE
 mpo_war_of_defiance_gok_wins_other: "Porazení [Concept('independent','nezávislý')|E] [Concept('nomads','nomádi')|E] se stanou [defender.GetShortUINamePossessive] [Concept('obedient','poslušným')|E] [Concept('vassals','vazaly')|E]. Všechny ostatní [Concept('truces','příměřím')|E] s [defender.GetShortUIName] jsou zrušeny. [defender.GetShortUIName] se stává [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] a získává mocné bonusy pro univerzální dobytí." # todo: CONCEPT CASE
