 great_khans_capital_modifier: "Trůn stepi"
 great_khans_capital_modifier_desc: "Ze všech koutů přicházejí kupci, vojáci, úředníci i migranti. Toto hrabství se rychle usazuje a urbanizuje."
 gok_capital_holdings_switch_tt: "Získává [Concept('castle','hrad')|E] [Concept('holding','država')|E] a, je-li to možné, také [Concept('temple','chrám')|E] a [Concept('city','město')|E]" # todo: CONCEPT CASE
 gok_some_sedentaries_become_admin_tt: "Ochotní [Concept('feudal','feudální')|E] a [Concept('clan','klan')|E] [Concept('vassals','vazalové')|E] se stanou [Concept('administrative','administrativním')|E]" # todo: CONCEPT CASE
 gok_counties_become_nomad_counties_tt: "Většina ne-[Concept('nomadic','kočovný')|E] [Concept('counties','hrabství')|E] v tvém [Concept('realm','panství')|E] #high ([burned_to_nomadism_value])#! získá [Concept('nomadic_holding','kočovném sídlišti')|E] a ztratí všechny ostatní [Concept('holdings','državy')|E]" # todo: CONCEPT CASE
