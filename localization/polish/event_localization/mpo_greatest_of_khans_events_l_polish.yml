l_polish:
 mpo_great_war_of_defiance_cb: "Velká válka vzdoru"
 MPO_GREAT_WAR_OF_DEFIANCE_NAME: "$mpo_great_war_of_defiance_cb$ proti postavě [DEFENDER.GetShortUINameNotMe]"
 MPO_GREAT_WAR_OF_DEFIANCE_NAME_MY: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]$mpo_great_war_of_defiance_cb$ proti postavě [DEFENDER.GetShortUIName]"
 MPO_GREAT_WAR_OF_DEFIANCE_NAME_BASE: "$mpo_great_war_of_defiance_cb$"
 mpo_war_of_defiance_gok_loses_defender: "Uvězní tě [attacker.GetShortUIName] a všechny tvé [Concept('landed','zeměpanské')|E] [Concept('titles','tituly')|E], [Concept('vassals','vazalové')|E] a [Concept('tributaries','tributáři')|E] získají nezávislost. Přijdeš o většinu svého [Concept('herd','stáda')|E], [Concept('prestige','prestiže')|E], [Concept('gold','zlata')|E], [Concept('nomadic_authority','dominance')|E] a [Concept('legitimacy','legitimity')|E]."
 mpo_war_of_defiance_gok_loses_attacker: "[defender.GetShortUIName] bude [Select_CString(defender.IsFemale, 'uvězněna, ponížena a zbavena majetku', 'uvězněn, ponížen a zbaven majetku')] a přijde o všechny [Concept('landed','zeměpanské')|E] [Concept('titles','tituly')|E]. [Select_CString(defender.IsFemale, 'Její', 'Jeho')] [Concept('vassals','vazalové')|E], [Concept('counties','hrabství')|E] a [Concept('tributaries','tributáři')|E] získají nezávislost."
 mpo_war_of_defiance_gok_loses_other: "[defender.GetShortUIName] bude [Select_CString(defender.IsFemale, 'uvězněna, ponížena a zbavena majetku', 'uvězněn, ponížen a zbaven majetku')] postavou [attacker.GetShortUIName] a přijde o všechny [Concept('landed','zeměpanské')|E] [Concept('titles','tituly')|E]. [Select_CString(defender.IsFemale, 'Její', 'Jeho')] [Concept('vassals','vazalové')|E], [Concept('counties','hrabství')|E] a [Concept('tributaries','tributáři')|E] získají nezávislost."
 mpo_war_of_defiance_gok_wins_defender: "Poražení [Concept('independent','nezávislí')|E] [Concept('nomads','nomádi')|E] se stanou tvými [Concept('obedient','poslušnými')|E] [Concept('vassals','vazaly')|E]. Všechna ostatní [Concept('truces','příměří')|E] s tebou jsou zrušena. Staneš se [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] a získáš mocné bonusy k dobytí celého světa."
 mpo_war_of_defiance_gok_wins_other: "Poražení [Concept('independent','nezávislí')|E] [Concept('nomads','nomádi')|E] se stanou [Concept('obedient','poslušnými')|E] [Concept('vassals','vazaly')|E] postavy [defender.GetShortUIName]. Všechna ostatní [Concept('truces','příměří')|E], která má [defender.GetShortUIName], jsou zrušena. [defender.GetShortUIName] se stane [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] a získá mocné bonusy k dobytí celého světa."
 accolade_attackers_all_gain_glory_tt: "#high Útočníků#! @accolade_icon![Concept('accolades','vyznamenání')|E] získají významnou [Concept('glory','slávu')|E]"
 accolade_defenders_all_gain_glory_tt: "#high Obránců#! @accolade_icon![Concept('accolades','vyznamenání')|E] získají významnou [Concept('glory','slávu')|E]"
 mpo_war_of_defiance_gold_herd_tt: "Každý #high Útočník#! získá @herd_icon![Concept('herd','stádo')|E] a @gold_icon![Concept('gold','zlato')|E]"
 custom.every_defender_vassal: "Každý z [Concept('vassals','vazalů')|E] postavy [defender.GetShortUIName]"
 custom.every_defender_tributary: "Každý z [Concept('tributaries','tributářů')|E] postavy [defender.GetShortUIName]"
 great_war_of_defiance_attackers_gold_tt: "Od každého #high Útočníka#! obdržíš @gold_icon![Concept('gold','zlato')|E]"
 gok_delete_all_truces_tt: "Všechna uzavřená [Concept('truce','příměří')|E] skončí"
 will_become_greatest_of_khans_tt: "Stane se [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]... a začne podmaňování světa"
 every_new_vassal_becomes_obedient_tt: "Každý získaný [Concept('vassal','vazal')|E] bude nejméně #high 10 let#! [Concept('obedient','poslušný')|E]"
 msg_great_war_of_defiance_war_invalidated_message: "[war.GetName] ztratila smysl: [defender.GetShortUIName] se nemůže stát [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]."
 war_declared_opening_mpo_gok: "[ROOT.War.GetActiveCB.GetDefender.GetTitledFirstNameNoTooltip], ty [Select_CString(ROOT.War.GetActiveCB.GetDefender.IsFemale, 'vzteklá feno', 'vzteklý pse')],\n\n"
 war_declared_flavor_mpo_gok: "Ne všechno živé na zemi je kořistí pro tvé hladové čelisti. Svět nikdy nebude tvůj.\n\nVšichni jsme se shodli, že ti upřeme moc a srazíme tě! Dosud jsi vždy čelil nepříteli zpříma, nikdy zády ani koňskou zádí. A tak budeme válčit."
 mpo_greatest_of_khans.0101.t: "Válka o zemi i nebesa"
 mpo_greatest_of_khans.0101.desc_intro: "Nesčetné kmeny povstávají proti mně; k válce je podnítil"
 mpo_greatest_of_khans.0101.desc_gok_opponent: "[primary_coalition_defender.GetName]. Přidávají se k nim i armády, které vysílá [gok_opponent.GetPrimaryTitle.GetNameNoTier] - [gok_opponent.GetTitledFirstName] zoufale touží vidět Velkou step rozdělenou!"
 mpo_greatest_of_khans.0101.desc_primary_attacker: "vliv, za nímž stojí [primary_coalition_defender.GetName] - temná slova a naditý měšec."
 mpo_greatest_of_khans.0101.desc_sub: "\n\nJiní, slabí a ustrašení, se připlazili až do mého hlavního sídla [ROOT.Char.GetCapitalLocation.GetName]. Přidal se k nim [big_sub.GetName] a všichni se mi podrobili."
 mpo_greatest_of_khans.0101.desc: "\n\n„Všechny klany, které spojuje [ROOT.Char.GetPrimaryTitle.GetName], jsou povolány!“ volá [Select_CString(vassal_1.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', vassal_1)|l], [vassal_1.GetTitledFirstName]. „Stateční sedlají válečné koně! Jedeme tam, kde vítr napíná tvé praporce z koňských ohonů!“"
 gok_submitters_became_tributaries_tt: "Mnoho drobných sousedních [Concept('rulers','vládců')|E] se stalo tvými [Concept('obedient','poslušnými')|E] [Concept('tributaries','tributáři')|E]"
 mpo_greatest_of_khans.0101.a: "A #EMP zbabělci?#! Ti pojedou také!"
 mpo_greatest_of_khans.0101.a.flavor: "Když vyšlu svou rodinu, aby je prosila o pomoc, někteří vyjedou do bitvy... za cenu naší hrdosti."
 mpo_greatest_of_khans.0101.b: "Šetřete síly na války, které přijdou."
 mpo_greatest_of_khans.0101.b.flavor: "Tuhle válku povedu [Select_CString(ROOT.Char.IsFemale, 'sama', 'sám')]."
 mpo_greatest_of_khans.0101.c: "Svět bude náš - nebo zemřeme!"
 became_your_tributary_tt: "Stává se tvým [Concept('tributary','tributářem')|E]"
 gok_fights_alone_reward_on_victory_tt: "Pokud se staneš [GetTrait('greatest_of_khans').GetName( GetNullCharacter )], získáš @dynasty_prestige_icon![Concept('dynasty_prestige','věhlas')|E] v množství odpovídajícím počtu a [Concept('title_tier','úrovni')|E] těchto [Concept('vassals','vazalů')|E]"
 gok_obedient_vassals_leave_war_tt: "@alert_icon! #alert_trial Všichni [Concept('vassals','vazalové')|E], kteří se na tvé straně připojili k tvé [Concept('war','válce')|E], přestanou být jejími účastníky#!"
 gok_joiners_wars_cancelled_tt: "Tito [Concept('vassals','vazalové')|E] opustí ostatní [Concept('wars','války')|E], případně je ukončí [Concept('white_peace','bílým mírem')|E]"
 mpo_greatest_of_khans.0102.t: "Vztáhnout ruku po celém světě"
 mpo_greatest_of_khans.0102.desc: "Z drsné země [gurkhan_to_gok.GetPrimaryTitle.GetBaseNameNoTier] se valí jezdci s tvářemi bledými jako popel a zbídačené národy, všichni s nářkem vyslovují jediné jméno - [gurkhan_to_gok.GetName]!\n\n[gurkhan_to_gok.GetTitledFirstName|U], nejobávanější ze všech [Concept('nomads','nomádů')|E], nyní žádá, aby se všechny klany podrobily. Sjednocené pod krvavým praporem sní o dobytí celého světa!\n\nRozsáhlou koalici sjednotil [primary_coalition_defender.GetName] a nyní vyráží vzdorovat pýše, kterou zosobňuje [gurkhan_to_gok.GetTitledFirstNameNoTooltip]... válka začala a údery kopyt nesou smrt."
 mpo_greatest_of_khans.0102.a: "#EMP Cháne chánů, jedu po tvém boku!#!"
 mpo_greatest_of_khans.0102.b: "[gurkhan_to_gok.GetTitledFirstNameNoTooltip] musí padnout!"
 mpo_greatest_of_khans.0102.c: "[gurkhan_to_gok.GetFirstNameNoTooltip] nelze zastavit. Musím se podrobit."
 mpo_greatest_of_khans.0102.d: "Tomuto dobyvateli mohu přísahat věrnost."
 mpo_greatest_of_khans.0102.e: "Nebe potemnělo šípy a osud mizí z dohledu..."
 gok_took_become_gok_decision_tt: "Přijato #high $mpo_become_greatest_of_khans_decision$#! [Concept('decision','rozhodnutí')|E]"
 gok_began_war_of_defiance_tt: "Zahájena #high $mpo_great_war_of_defiance_cb$#! proti všem [Concept('nomads','nomádům')|E] ve společných [Concept('situation_sub_regions','oblastech situace')|E] [Concept('the_great_steppe','Velké stepi')|E]"
 gok_gurkhan_declared_intent_tt: "@warning_icon! #X Vítěz #high $mpo_great_war_of_defiance_cb$#! se stane [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] a začne dobývat svět#!"
 gok_warning_one_off_tt: "@alert_icon! #alert_trial Žádný jiný [Concept('ruler','vládce')|E] se už nikdy nebude moci stát [GetTrait('greatest_of_khans').GetName( GetNullCharacter )]#!"
 mpo_greatest_of_khans.0103.t: "Nejmenší z chánů"
 mpo_greatest_of_khans.0103.desc_defender_intro: "Já, nejmocnější ze všech nomádů - [Select_CString(defender.IsFemale, 'velká sněžná tygřice, která se odvážila', 'velký sněžný tygr, který se odvážil')] přinutit každého vlka i divokou kočku sklonit hlavu - teď ležím v řetězech.\n\n[defender.GetFirstName], [defender.GetLadyLord] lidu známého jako [defender.GetDomicile.GetCulture.GetCollectiveNoun], se Největším z chánů nestane.\n\nStep se znovu propadá do bezvládí."
 mpo_greatest_of_khans.0103.desc_intro: "Nejmocnější ze všech nomádů - [Select_CString(defender.IsFemale, 'velká sněžná tygřice, která se odvážila', 'velký sněžný tygr, který se odvážil')] přinutit každého vlka i divokou kočku sklonit hlavu - teď leží v řetězech.\n\n[defender.GetFirstName], [defender.GetLadyLord] lidu známého jako [defender.GetDomicile.GetCulture.GetCollectiveNoun], se Největším z chánů nestane.\n\nStep se znovu propadá do bezvládí."
 mpo_greatest_of_khans.0103.desc_defender: "Mí vlastní zoufalí válečníci se obrátili proti mně. [attacker.GetName] si mě od nich [Select_CString(attacker.IsFemale, 'koupila', 'koupil')]. Můj lid pohrdá mou rodinou, mým snem i mým jménem.\n\nNejsem dítě osudu."
 mpo_greatest_of_khans.0103.desc_attacker: "Zlomil jsem moc svého nepřítele nad náčelníky! Teď se ti psi budou navzájem rvát do krve o zbytky."
 mpo_greatest_of_khans.0103.desc_defenders: "Skláníme větrem ošlehané tváře hanbou, ukládáme roztřepené tětivy a proklínáme falešná znamení, která nás přiměla následovat do války někoho, kdo toho nebyl hoden..."
 mpo_greatest_of_khans.0103.desc_attackers: "[defender.GetFirstNamePossessiveNoTooltip] lid ztratil po našem hrdém vítězství vůli vzdorovat a my, kteří jsme bojovali bok po boku, jásáme! [attacker.GetName] teď drží našeho společného nepřítele v potupných okovech."
 mpo_greatest_of_khans.0103.desc: "[defender.GetFirstNamePossessiveNoTooltip] lid je rozprášen a [attacker.GetTitledFirstNamePossessive] svaz spojenců jej žene z pastviny na pastvinu. Kde kdysi hrozil jediný mocný nepřítel, tam se teď mrchožrouti rvou o zbytky."
 mpo_greatest_of_khans.0103.a: "Jednoho dne však může povstat skutečný pán všech nomádů..."
 mpo_greatest_of_khans.0001.t: "Můj kurultaj promlouvá - za celý svět!"
 mpo_greatest_of_khans.0001.desc: "Na nebesích září mnohá velká světla. Slunce, měsíc a hvězdy. Na zemi však může být jen jediný chán.\n\nJá, [ROOT.Char.GetFirstName], jsem tím chánem - Největším ze všech chánů.\n\nPo mém vítězství nad hady, kteří se mi vinuli kolem nohou, se mi na kurultaji všech klanů už nikdo neodváží odporovat. Náčelníci se dychtivě podrobují, skládají přísahy a lační po dobytí celého světa.\n\nPrvní paprsky ranního slunce pronikají nad obzor. Nasedám na koně a všechny armády [ROOT.Char.GetPrimaryTitle.GetNameNoTier] burácejí."
 mpo_greatest_of_khans.0001.a: "Svět bude můj."
 mpo_greatest_of_khans.0001.mongol_invasion_cb: "Mohu použít [Concept('mongol_invasion_casus_belli','casus belli mongolské invaze')|E]"
 mpo_greatest_of_khans.0002.a: "Vše náleží [genghis_khan.GetTitledFirstNameNoTooltip]."
 mpo_greatest_of_khans.0002.b: "Jen společně můžeme my náčelníci vzdorovat [genghis_khan.GetFirstNameNoTooltip]."
 mpo_greatest_of_khans.0003.t: "[ROOT.Char.GetTitleAsNameNoTooltip] potřebuje jméno"
 mpo_greatest_of_khans.0003.desc: "Mocných znamení je mnoho.\n\nNebe i země, jak se říká, nade mnou drží ochrannou ruku. Ve snech i oblacích prachu věští mohutní býci zkázu mým nepřátelům. Nádherní valaši a klisny, dary v podobě přepychových stanů... Klanoví starší slibují jedno za druhým...\n\nPotřebuji titul hodný tohoto osudu."
 mpo_greatest_of_khans.0003.a: "Jsem #EMP $nick_genghis_khan$#!."
 mpo_greatest_of_khans.0003.b: "Jsem #EMP $nick_cengiz_khan$#!."
 mpo_greatest_of_khans.0003.c: "#EMP $nick_yekhe_khagan$#!: Veliký."
 mpo_greatest_of_khans.0003.d: "#EMP $nick_dort_yonlug_khagan$#!: Pán čtyř světových stran."
 mpo_greatest_of_khans.0003.e: "#EMP $nick_tengri_khagan$#!: Zrozený z nebes."
 mpo_greatest_of_khans.0003.f: "#EMP $nick_xormuzta$#!: nebeský, prastarý a moudrý."
 mpo_greatest_of_khans.0003.g: "#EMP $nick_cihangir$#!: Dobyvatel světa!"
 mpo_greatest_of_khans.0003.h: "#EMP $nick_mar_sargis$#!: vedený svatým mučedníkem!"
 mpo_greatest_of_khans.0003.i: "#EMP $nick_akhshunwar$#!: Nositel moci!"
 mpo_greatest_of_khans.0003.j: "#EMP Kagan#!: [ROOT.Char.GetCulture.GetNameNoTooltip] kultura má jediného pravého vládce."
 mpo_greatest_of_khans.0003.k: "Ponechám si jen své vlastní jméno."
