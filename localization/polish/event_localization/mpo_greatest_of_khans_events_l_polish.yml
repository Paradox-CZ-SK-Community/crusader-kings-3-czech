 gok_city_state_creation: "Neochotní ne-[Concept('nomadic','kočovný')|E] [Concept('vassals','vazalové')|E] #high ([city_state_vassals_value])#! budou sníženi na [Concept('duke','vévodu')|E]-[Concept('title_tier','úroveň')|E] a ty obdržíš jejich přebytečné [Concept('titles','tituly')|E]" # todo: CONCEPT CASE
 gok_time_limit_end_decision_tt: "@alert_icon! #alert_trial Pokud tvá [Concept('dynasty','dynastie')|E] ztratí kontrolu nad [gok_title.GetName] nebo do roku #high [gok_empire_crumble_date|0]#! nedokončí #high $mpo_gok_world_conquest_decision$#! [Concept('decision','rozhodnutí')|E], tyto bonusy budou ztraceny a [gok_title.GetName] se může rozpadnout!#!" # todo: CONCEPT CASE
 gok_time_limit_end_decision_other_players_tt: "Pokud [genghis_khan.GetShortUINamePossessive] [Concept('dynasty','dynastie')|E] ztratí kontrolu nad [gok_title.GetName] nebo do roku #high [gok_empire_crumble_date|0]#! nedokončí #high $mpo_gok_world_conquest_decision$#! [Concept('decision','rozhodnutí')|E], jejich bonusy budou ztraceny" # todo: CONCEPT CASE
 mpo_greatest_of_khans.0040.t: "Vyhasínání Velkého snu"
 mpo_greatest_of_khans.0040.desc_timed_out: "Po desetiletí vládli [ROOT.Char.GetHouse.GetName] naší říši krve. Hrdé zdi našich nepřátel byly rozbity, naše hordy nacpané kořistí. Z nejvyšší hory jsme zpívali chválu [ROOT.Char.GetFaith.HighGodName] a slyšeli statisíce hlasů, jak nám odpovídají!\n\nAle vládli jsme příliš dlouho. Naše sliby dobytí už neinspirují. Náčelníci a páni se hašteří jako supi a ozývají se hlasy, které zpochybňují mé rozkazy..."
 mpo_greatest_of_khans.0040.desc: "Naše velká říše vyklouzla z rukou mé rodiny! Už si nemůžeme bez odporu činit nárok na přízeň Velkého modrého nebe — už nemůžeme shromažďovat hordy k válce mávnutím biče.\n\nV příštích letech se možná zpět vyškrábu na svůj právoplatný trůn, jako nějaký zahanbený zločinec uniklý z [Glossary( 'cangue', 'CANGUE_GLOSS' )]... ale naše ušlechtilá doba dobývání je u konce."
 mpo_greatest_of_khans.0040.a: "A přece... svět se stále chvěje při vyslovení mého jména."
 gok_no_more_special_powers: "Už nemůžete používat #high $mpo_offer_submission_or_ruin$#! nebo #high $mpo_gok_onslaught_cb$#!"
 gok_no_more_reform_decision: "Už nemůžeš přijmout #high $mpo_gok_world_conquest_decision$ [Concept('decision','rozhodnutí')|E]" # todo: CONCEPT CASE
 gok_guaranteed_disastrous_chaotic_succession_tt: "@warning_icon! #X Tvé příští #high chaotické#! [Concept('succession','nástupnictví')|E] pravděpodobně rozbije [ROOT.Char.GetPrimaryTitle.GetName]#!„ gok_took_become_gok_decision_tt: ‚Přijal #high $mpo_become_greatest_of_khans_decision$#! [Concept('decision','rozhodnutí')|E]" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 mpo_greatest_of_khans.0041.t: "Stále velký, ale méně chán" # todo: NEW TRANSLATION
 mpo_greatest_of_khans.0041.desc: "Ve zdech mého [ROOT.Char.Custom('ResidenceBuilding')], v rámci mého [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] zákonů, sídel a poklidného obchodu... přesto se vracejí staré sny?\n\nZpívá mé srdce o osudu Velkého chána, o rozdrcení celého světa pod koňskými kopyty?\n\nToto [ROOT.Char.GetGovernment.GetAdjective] království se nesjednocuje pod praporem koňského ohony. Není naloženo na vozy na můj povel. Moji [ROOT.Char.Custom('GetFighterTermPlural')] a [ROOT.Char.Custom('GetLocalCommonerTermPlural')] netouží společně dobývat pod Nekonečnou modrou oblohou.\n\nNáš velký sen o dobytí je oslaben, přesto jsme silní a bohatí." # todo: NEW TRANSLATION
 mpo_greatest_of_khans.0041.a: "Není toto pohodlí #EMP true#! snem nomádů?" # todo: NEW TRANSLATION
