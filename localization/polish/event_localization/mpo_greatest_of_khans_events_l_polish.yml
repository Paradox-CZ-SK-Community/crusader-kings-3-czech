 mpo_greatest_of_khans.0050.opening: "Tato slova odvracejí tvou smrt."
 mpo_greatest_of_khans.0050.desc: "[Select_CString(attacker.IsFemale, 'Veliká', 'Veliký')] [attacker.GetTitleAsName] - [Select_CString(attacker.IsFemale, 'ta, jejímž osudem je rozdrtit', 'ten, jehož osudem je rozdrtit')] všechna panství pod koňskými kopyty, [Select_CString(attacker.IsFemale, 'ta, která pálí a plenila', 'ten, který pálí a plenil')] - tě nechá žít. Od této chvíle budeš sloužit pod praporem, který nese jméno [attacker.GetPrimaryTitle.GetName].\n\n"
 mpo_greatest_of_khans.0050.desc_end: "Ty pse z panství jménem [defender_primary.GetNameNoTier]: budeš hlídat obrovská stáda lidu, jemuž vládne [attacker.GetTitleAsNameNoTooltip], a žebrat o zbytky, kdykoli se [attacker.GetTitleAsNameNoTooltip] uráčí."
 mpo_greatest_of_khans.0050.desc_reorganized: "[attacker.GetTitleAsNameNoTooltip] nemá nejmenší chuť poslouchat tvůj ubohý hlásek. Odteď se budeš zodpovídat postavě [liege.GetName]."
 mpo_greatest_of_khans.0050.a: "Snad odtáhnou stejně rychle, jako přišli..."
 mpo_greatest_of_khans.0051.opening: "Všem ubožákům z panství jménem [defender_primary.GetNameNoTier],"
 mpo_greatest_of_khans.0051.desc: "[Select_CString(attacker.IsFemale, 'Veliká', 'Veliký')] [attacker.GetTitleAsName] - [Select_CString(attacker.IsFemale, 'ta, která', 'ten, který')] vašemu lidu [Select_CString(attacker.IsFemale, 'vzala', 'vzal')] vše a jejíž hordy zaplavují vaše země - vám přikazuje toto:\n\nObraťte své uplakané tváře proti větru a jeďte daleko. Každému, koho potkáte, řekněte, že svět brzy připadne hordám, které vede [attacker.GetTitleAsNameNoTooltip]."
 mpo_greatest_of_khans.0051.a: "Můj lenní pán selhal... Jsem [Select_CString(ROOT.Char.IsFemale, 'ztracena', 'ztracen')]."
