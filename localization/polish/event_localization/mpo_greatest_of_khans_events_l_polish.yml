l_polish:
 mpo_great_war_of_defiance_cb: "Velká válka vzdoru"
 MPO_GREAT_WAR_OF_DEFIANCE_NAME: "$mpo_great_war_of_defiance_cb$ proti [DEFENDER.GetShortUINameNotMe]"
