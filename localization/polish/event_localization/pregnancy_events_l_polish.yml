l_polish:
 pregnancy.1001.t: "Těhotenství!"
 pregnancy.1001.d: "V mém lůně roste dítě. Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstNameNoTooltip], bude [Select_CString(real_father.IsFemale, 'hrdá', 'hrdý')]!"
 pregnancy.1001.a: "Dobře!"
 pregnancy.1002.t: "Těhotenství!"
 pregnancy.1002.d: "Osud se na mě usmívá! Má [spouse.Custom2('RelationToMe', SCOPE.sC('mother'))] [mother.GetTitledFirstNameNoTooltip] čeká mé dítě!"
 pregnancy.1002.a: "Už se nemohu dočkat, až budu dítě držet v náručí!"
 pregnancy.1101.t.dead: "Život jde dál"
 pregnancy.1101.t.divorced: "Neobvyklé okolnosti"
 pregnancy.1101.desc.start: "V mém lůně roste dítě a nepochybuji, že jeho otcem je"
 pregnancy.1101.desc.dead: "můj zesnulý manžel [ex_spouse.GetTitledFirstName]."
 pregnancy.1101.desc.divorced: "můj bývalý manžel [ex_spouse.GetTitledFirstName]."
 pregnancy.1101.desc.end: "\n\nOkolnosti tohoto těhotenství jsou sice nešťastné, ale alespoň se mohu radovat, že mé nenarozené dítě nebude považováno za levobočka."
 pregnancy.1101.a.dead: "Kéž by tu teď [ex_spouse.GetFirstNameNoTooltip] mohl být..."
 pregnancy.1101.a.divorced: "Asi o tom musím [ex_spouse.GetFirstNameNoTooltip] okamžitě zpravit."
 pregnancy.1102.t: "$pregnancy.1101.t.divorced$"
 pregnancy.1102.desc: "Teď už je zřejmé, že má [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))] [mother.GetTitledFirstName] čeká dítě, ale podle načasování pochybuji, že je moje.\n\nNejspíš je jeho skutečným otcem bývalý manžel [mother.GetTitledFirstNameNoTooltip], [ex_spouse.GetTitledFirstName]."
 pregnancy.1102.a: "Bohužel."
 pregnancy.1103.opening: "[mother.Custom2('RelationDescriptor', ROOT.Char)|U], můj bývalý manželi,"
 pregnancy.1103.opening_concubine: "[mother.Custom2('RelationDescriptor', ROOT.Char)|U], můj bývalý [Select_CString(ROOT.Char.IsFemale, 'družko', 'druhu')],"
 pregnancy.1103.desc: "Píši ti, abych tě zpravil, že čekám dítě a že je zcela jistě tvoje.\n\nKdyž bylo počato, byli jsme manželé, takže na něm neulpívá poskvrna levobočství. Až se narodí, bude známo jako tvůj legitimní potomek."
 pregnancy.1103.desc_concubine: "Píši ti, abych tě zpravil, že čekám dítě a že je zcela jistě tvoje.\n\nKdyž bylo počato, byli jsme spolu, takže na něm neulpívá poskvrna levobočství. Až se narodí, bude známo jako tvůj potomek."
 pregnancy.1103.a: "Dobrá tedy."
 pregnancy_not_first_child_message_title: "[spouse.Custom2('RelationToMe', SCOPE.sC('mother'))|U] otěhotněla"
 pregnancy_not_first_child_message: "Tvá [spouse.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], čeká tvé dítě"
 pregnancy.2001.t: "Mimo manželství"
 pregnancy.2001.opening: "Dlouho jsem se tím trápila, ale znamení jsou jasná. Jsem těhotná!"
 pregnancy.2001.father_is_married: "\n\n[real_father.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je bezpochyby otcem, jenže je ženatý a mé dítě by určitě nikdy za své nepřijal!"
 pregnancy.2001.father_is_unmarried: "\n\nMůj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))] [real_father.GetTitledFirstName] je bezpochyby otcem, ale co budou lidé o mém dítěti říkat, když nejsme sezdaní?"
 pregnancy.2001.a: "Všem řeknu, kdo je otcem!"
 pregnancy.2001.b: "[real_father.GetFirstNameNoTooltip] to musí vědět, ale nikdo jiný!"
 pregnancy.2001.c: "Nemohu to říct #EMP nikomu#!..."
 pregnancy.2001.c.tt: "Doufáš, že se to nikdo nedozví!"
 pregnancy.2001.d: "Musím požádat moudrou ženu, aby mi připravila odvar."
 pregnancy.2002.t: "S jiným mužem"
 pregnancy.2002.desc: "Dlouho jsem se tím trápila, ale znamení jsou jasná. Jsem těhotná!\n\nK radosti však není důvod. Nepochybuji, že skutečným otcem je [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)], a ne můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName]!"
 pregnancy.2002.desc.polyamorous: "Dlouho jsem se tím trápila, ale znamení jsou jasná. Jsem těhotná!\n\nNepochybuji, že skutečným otcem je [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)], a ne můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetFirstName]."
 pregnancy.2002.a: "Přiznám svou nevěru!"
 pregnancy.2002.b: "[real_father.GetFirstNameNoTooltip] se to dozví, ale důvěrně."
 pregnancy.2002.c: "Nikdo se to nikdy nesmí dozvědět."
 pregnancy.2002.c.tt: "#F Doufáš, že to zůstane tajemstvím#!"
 reveal_illegitimate_pregnancy_to_real_father_tt: "Tajemství bude odhaleno postavě [real_father.GetFirstName]"
 pregnancy.2002.d: "Potřebuji odvar od moudré ženy."
 search_for_real_father_tt: "#F Vydám se ho hledat!#!"
 pregnancy_treatment_fails_tt: "Léčba selže"
 pregnancy.2003.t: "Čekání"
 pregnancy.2003.desc_no_notice: "Dlouho jsem se obávala, zda odvar, jehož základem je [ROOT.Char.Custom('Abortifacient')], zabere, ale teď už je vše jasné.\n\nDítě už nenosím."
 pregnancy.2003.desc_pain: "Odvar, jehož základem je [ROOT.Char.Custom('Abortifacient')], mi způsobil křeče a zvracení, ale pořád je to lepší, než kdyby vůbec nezabral.\n\nUž nejsem těhotná."
 pregnancy.2003.a: "Udělala jsem, co jsem musela."
 pregnancy.2004.t: "Nemoc"
 pregnancy.2004.desc: "Odvar, jehož základem je [ROOT.Char.Custom('Abortifacient')], ukončil mé těhotenství, ale zanechal mě ve zvracení a horečkách. Moudrá žena mě před horečkou varovala, ale bolest neustupuje, jak tvrdila."
 pregnancy.2004.a: "Tohle zvládnu."
 pregnancy.2005.t: "Čekání"
 pregnancy.2005.desc: "Doufala jsem, že odvar, jehož základem je [ROOT.Char.Custom('Abortifacient')], ukončí mé trápení, ale moudrá žena mě varovala, že nemusí zabrat.\n\nObávám se, že její varování bylo oprávněné. Nepochybuji, že dítě v mém břiše stále roste."
 pregnancy.2005.a: "Už se nedá nic dělat."
 pregnancy.2007.t: "Odcházení"
 pregnancy.2007.desc: "Od chvíle, kdy jsem vypila odvar, jehož základem je [ROOT.Char.Custom('Abortifacient')], je všechno rozmazané. Kolem mého lůžka se za tichého mumlání pohybují matné šedé postavy a splývají s temnými okraji mého zorného pole. Čím naléhavější je jejich šepot, tím silnější je i žár v mé hrudi."
 pregnancy.2007.a: "Kdo mě přivítá?"
 pregnancy.2050.t: "S jiným"
 pregnancy.2050.desc.polyamorous: "Dlouho jsem se tím trápila, ale znamení jsou jasná. Jsem těhotná!\n\nNepochybuji, že skutečným otcem je [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 pregnancy.2050.desc: "Dlouho jsem se tím trápila, ale znamení jsou jasná. Jsem těhotná!\n\nK radosti však není důvod, protože teď už všichni vědí, že jsem byla nevěrná postavě [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]. Nepochybuji, že skutečným otcem je [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]..."
 pregnancy.2101.t: "Příliš brzy"
 pregnancy.2101.desc_other_children: "Jak roste mé břicho, roste i můj neklid. Těhotná nejsem poprvé, ale tenhle zlý pocit je nový. Něco není v pořádku.\n\nV noci přijdou křeče a ráno najdu prostěradla potřísněná krví."
 pregnancy.2101.desc_pain: "Jak roste mé břicho, roste i můj neklid. Těhotná jsem poprvé, ale tenhle zlý pocit nemůže být správný. Něco není v pořádku.\n\nV noci přijdou křeče a ráno najdu prostěradla potřísněná krví."
 pregnancy.2101.desc: "Dny plynou, ale místo břicha roste jen má úzkost. Nemělo by už být těhotenství znát? Nemělo by už o sobě dítě dát vědět?\n\nNěco se muselo pokazit. Necítím v sobě ani jiskřičku života."
 pregnancy.2101.a: "Už nejsem těhotná."
 pregnancy.2102.desc: "„Tomuto dítěti nebylo souzeno přijít na svět.“\n\n[mother.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě ujišťuje, že takový je život, ale její ruka stále spočívá na břiše."
 pregnancy.2102.a: "[mother.GetFirstNameNoTooltip|U] už není těhotná."
 pregnancy.3001.t: "Nerozvážnost"
 pregnancy.3001.opening: "Břicho [mother.GetTitledFirstName] roste a už nemůže být pochyb. Je těhotná!"
 pregnancy.3001.lovers_love: "Nic mi neřekla, ale mohlo by to být dítě zrozené z naší lásky?"
 pregnancy.3001.lovers_not_love: "Nic mi neřekla, ale mohlo by to být dítě zplozené při našich milostných hrátkách?"
 pregnancy.3001.not_lovers: "Nic mi neřekla, ale mohlo by to být dítě zplozené při našem nedávném dostaveníčku?"
 pregnancy.3001.a: "Musím se jí na to zeptat sám."
 pregnancy.3001.a.tt: "Promluvíš si s [mother.GetFirstNameNoTooltip] o dítěti"
 pregnancy.3001.b: "Možná se to nikdy nedozvím, ale vždycky mě to bude hlodat..."
 pregnancy.3001.b.tt: "Na základě svých podezření nic nepodnikneš"
 pregnancy.3002.t: "Nerozvážnost"
 pregnancy.3002.lovers: "Samozřejmě jsem něco tušil už ve chvíli, kdy se na mé [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))] [mother.GetTitledFirstName] začaly projevovat známky těhotenství. Teď mi sama řekla, že dítě je moje."
 pregnancy.3002.not_lovers: "[mother.GetTitledFirstName] je těhotná a důvěrně mi sdělila, že dítě je následkem našeho nedovoleného dostaveníčka."
 pregnancy.3002.spouse_exists: "\n\nNaštěstí si její [mother.Custom2('RelationToMe', SCOPE.sC('spouse'))] [spouse.GetTitledFirstName] myslí, že dítě je [Select_CString(spouse.IsFemale, 'její', 'jeho')]."
 pregnancy.3002.a: "Ach, [mother.GetFirstNameNoTooltip], kéž bychom byli jen my dva a naše dítě..."
 pregnancy.3002.b.not_again: "Jak jsem mohl dopustit, aby se to stalo znovu?!"
 pregnancy.3002.b: "Tohle musí zůstat tajemstvím!"
 pregnancy.3002.a.tt: "Dítě postavy [mother.GetShortUINameNoTooltip] se narodí bez známého otce"
 pregnancy.3002.c: "Pravda musí vyjít najevo!"
 pregnancy.3003.t: "Vzdouvající se břicho"
 pregnancy.3003.desc: "[mother.GetTitledFirstName] za mnou přišla a okamžitě mi bylo jasné proč. Čeká dítě a stejně jako já ani na okamžik nepochybuje o tom, kdo je jeho otcem. Dítě narozené mimo řádné manželství je odsouzeno k životu [Concept('bastard','levobočka')|E]. Chci pro své dítě takový osud?"
 pregnancy.3003.desc_no_bastards: "[mother.GetTitledFirstName] za mnou přišla a okamžitě mi bylo jasné proč. Čeká dítě a stejně jako já ani na okamžik nepochybuje o tom, kdo je jeho otcem. Jaký život čeká mé dítě, které se narodí mimo manželství?"
 pregnancy.3003.a: "Tohle musí zůstat tajemstvím!"
 pregnancy.3003.a.tt: "Tajemství prozatím zůstane skryto"
 pregnancy.3003.b: "Ach, to je radostná zpráva!"
 pregnancy.3004.t: "Vzdouvající se břicho"
 pregnancy.3004.desc: "[mother.GetTitledFirstName] za mnou přišla a okamžitě mi bylo jasné proč. Čeká dítě a stejně jako já ani na okamžik nepochybuje o tom, kdo je jeho otcem.\n\nKvůli svému manželství s [spouse.GetFirstName] však nemohu dělat nic jiného než doufat, že má účast zůstane tajemstvím."
 pregnancy.3004.a: "Nikdy jsem si nemyslel, že to dojde až sem."
 pregnancy.5001.t: "„Musím to vědět!“"
 pregnancy.5001.desc: "[real_father_inquirer.GetTitledFirstName] mě [Select_CString(real_father_inquirer.IsFemale, 'vyhledala', 'vyhledal')]. Položí mi ruku na břicho a ustaraně se na mě zadívá."
 pregnancy.5001.real_father: "\n\n„Chci to jen slyšet z tvých úst. Už vím, že je moje.“"
 pregnancy.5001.not_father: "\n\n„Prosím, řekni mi pravdu.“\n\nUpřu oči na chodbu za [Select_CString(real_father.IsFemale, 'jejími', 'jeho')] zády a s obavou přemýšlím, zda nás někdo neuvidí spolu."
 pregnancy.5001.a: "Dítě je tvoje, [real_father.GetFirstNameNoTooltip]."
 pregnancy.5001.b: "Nejsi otcem mého dítěte."
 pregnancy.5002.t: "Naše krev"
 pregnancy.5002.love: "„Samozřejmě že je tvoje, [ROOT.Char.GetFirstNameNoTooltip]!“\n\nDokonce zapomenu na obavy, zda nás někdo neuslyší. Tělem mi projede radost i zmatek. Jako by všechny mé modlitby byly vyslyšeny a našemu spojení se dostalo požehnání, i když tu jsou jisté... komplikace."
 pregnancy.5002.not_love: "„Samozřejmě že je tvoje, [ROOT.Char.GetFirstNameNoTooltip]!“\n\nObávám se, že [mother.GetFirstNameNoTooltip] mohl někdo zaslechnout, ale kolem nás zůstává jen ticho. Ještě že tak, protože najednou mám o čem přemýšlet."
 pregnancy.5002.a: "My dva... Dítě..."
 pregnancy.5002.b: "To je radostná zpráva a všichni se ji musí dozvědět!"
 pregnancy.5003.t: "Mylná představa"
 pregnancy.5003.desc: "Přestože na [mother.GetTitledFirstName] stále naléhám, neústupně trvá na svém. „To dítě není tvoje, [ROOT.Char.GetFirstNameNoTooltip].“\n\nOpravdu jsem se tak mýlil?"
 pregnancy.5003.a: "Říká mi [mother.GetFirstNameNoTooltip] pravdu?"
 pregnancy.5003.a.tt: "„Jen čas ukáže, zda mám pravdu...“"
 pregnancy_announcement_my_child_will_be_a_bastard: "Mé dítě se narodí jako [Concept('bastard','levoboček')|E] a jeho otcem bude [real_father.GetTitledFirstNameNoTooltip]"
 pregnancy_announcement_the_child_will_be_a_bastard_real_father: "Dítě postavy [mother.GetTitledFirstNameNoTooltip] se narodí jako [Concept('bastard','levoboček')|E] a já budu znám jako jeho otec"
 pregnancy_announcement_the_child_will_be_a_bastard: "Dítě postavy [mother.GetTitledFirstNameNoTooltip] se narodí jako [Concept('bastard','levoboček')|E] a jeho otcem bude [real_father.GetTitledFirstNameNoTooltip]"
 pregnancy.6001.t: "Mimo veškeré pochybnosti"
 pregnancy.6001.desc: "Dítě, které nosím, je možná nemanželské, ale vyroste s vědomím, kdo je jeho otcem, ať už si [real_father.GetTitledFirstName] přeje cokoli."
 pregnancy.6001.a: "Vždy udělám to, co je pro mé dítě nejlepší."
 pregnancy.6002.t: "Mimo veškeré pochybnosti"
 pregnancy.6002.desc: "[mother.GetTitledFirstName] mě veřejně označila za otce svého nenarozeného dítěte!"
 pregnancy.6002.married: "\n\n„Jak jsi mi to mohl udělat?!“ [spouse.GetFirstName] mě sleduje [spouse.Custom('GeneralTemperament')|l]."
 pregnancy.6002.unmarried_sympathetic: "\n\nDítě narozené mimo manželství čeká těžký život, ale alespoň bude znát pravdu."
 pregnancy.6002.unmarried_unsympathetic: "\n\nNestačí snad, že toto břemeno nese [mother.GetFirstNameNoTooltip]? Musí s sebou stáhnout i mě?"
 pregnancy.6002.a: "Co na to řeknou lidé?"
 pregnancy.6003.t: "Mimo veškeré pochybnosti"
 pregnancy.6003.desc: "Má [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], se přiznala, že její těhotenství nejen vzešlo z nemanželského svazku, ale že skutečným otcem nenarozeného dítěte není nikdo jiný než [real_father.GetTitledFirstName]!\n\nJakou hanbu přivedla na můj rod! Jak mi to mohla udělat? Jak nám to mohla udělat?"
 pregnancy.6003.a: "[real_father.GetFirstNameNoTooltip]?!"
 pregnancy.6004.t: "Mimo veškeré pochybnosti"
 pregnancy.6004.desc: "Má [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], dala veřejně najevo, že její nenarozené dítě nejen vzešlo z nedovoleného svazku, ale že jeho otcem není nikdo jiný než [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 pregnancy.6004.incest: "\n\nCo bude s dítětem počatým z tak bezbožného svazku?"
 pregnancy.6004.mother_married: "\n\nCo to vůbec znamená pro manželství, které spojuje [mother.GetFirstNameNoTooltip] a [spouse.GetTitledFirstName]?"
 pregnancy.6004.mother_unmarried: "\n\nCo teď bude s dítětem, když už celý svět zná pravdu?"
 pregnancy.6004.a: "[mother.GetFirstNameNoTooltip|U] uvrhla tento rod do zmatku!"
 pregnancy.6005.t: "Mimo veškeré pochybnosti"
 pregnancy.6005.desc: "[mother.GetTitledFirstName] celému světu prozradila, kdo je otcem dítěte z jejího nedovoleného těhotenství. Chtěl jsem doufat, že to není pravda, ale samozřejmě jsem to věděl. Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetTitledFirstName], je skutečným otcem jejího nenarozeného dítěte!"
 pregnancy.6005.a: "[real_father.GetFirstNameNoTooltip], jak jsi mohl?"
 pregnancy.6006.t: "Mimo veškeré pochybnosti"
 pregnancy.6006.desc: "[real_father.Custom2('MyCharacterIntroduction', ROOT.Char)|U] byl označen za skutečného otce nenarozeného dítěte postavy [mother.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 pregnancy.6006.real_father_married: "\n\nCopak [real_father.GetFirstNameNoTooltip] vůbec nemyslí na význam svého manželství s [spouse.Custom2('HerHisCharacterIntroduction', SCOPE.sC('real_father'))]?"
 pregnancy.6006.real_father_unmarried: "Copak [real_father.GetFirstNameNoTooltip] vůbec nemyslel na čest své rodiny?"
 pregnancy.6006.a: "Co pro nás bude toto dítě, [Concept('bastard','levoboček')|E], znamenat?"
 pregnancy.6999.t: "S jiným mužem"
 pregnancy.6999.desc: "Má [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], [mother.GetTitledFirstName], dala veřejně najevo, že čeká dítě s [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\nDítě sice není moje, ale stále jsem [mother.GetFirstNameNoTooltip] [ROOT.Char.Custom('WifeHusband')|l] a mou povinností je v nadcházejících měsících se o ni postarat."
 pregnancy.6999.a: "A svou povinnost splním."
