l_polish:
 dungeon_ongoing.0001.t: "Neustálé tlachání"
 dungeon_ongoing.0001.desc: "Nevidím, kdo to je ani kde přesně se nachází, ale hlasitý šepot se touhle vlhkou kobkou rozléhá bez ustání. Jedinou výjimkou jsou chvíle, kdy jej vystřídá křik."
 dungeon_ongoing.0001.a: "Kéž bys aspoň na chvíli ztichl!"
 dungeon_ongoing.0001.b: "„Mluvíš se mnou, příteli?“"
 dungeon_ongoing.0002.t: "Čekání"
 dungeon_ongoing.0002.desc: "Nejhůř na mě doléhá plynutí času. Kdo ví, kolik už ho uplynulo nebo jak dlouho tu ještě zůstanu? Mohou to být hodiny... nebo měsíce."
 dungeon_ongoing.0002.a: "Musím se odsud dostat!"
 dungeon_ongoing.0002.b: "Počkám tak dlouho, jak bude třeba."
 dungeon_ongoing.0003.t: "„Ztiš se!“"
 dungeon_ongoing.0003.desc: "Přes mříže neustále dorážím na stráže a požaduji, aby mě pustily ven. Odpovědí jsou jen výhrůžné pohledy, pozvednuté pěsti a zavrčení, ať „držím hubu“."
 dungeon_ongoing.0003.a: "Odvolávat se na jejich povinnosti očividně nikam nevede."
 dungeon_ongoing.0003.b: "Myslíte, že mě výhrůžkami umlčíte?!"
 dungeon_ongoing.0004.t: "Infekce"
 dungeon_ongoing.0004.desc: "Myslel jsem, že se rána skoro zahojila, ale teď začala pálit. Ve tmě na ni pořádně nevidím, na dotek je však oteklá.\n\nNedokážu poznat, zda vlhkost doprovázející palčivou bolest způsobuje krev, hnis, nebo jen voda srážející se ve vlhkém vzduchu."
 dungeon_ongoing.0004.a: "Prosím, potřebuji pomoc..."
 dungeon_no_response_tooltip: "#F Zdá se, že tvé prosby nikdo neslyší.#!"
 dungeon_ongoing.0005.t: "Žár ustupuje"
 dungeon_ongoing.0005.desc: "Kůže kolem rány je tvrdá jako nasáklé dřevo, ale pálení ustoupilo. Zdá se, že infekce je pryč."
 dungeon_ongoing.0005.a: "[ROOT.Char.GetFaith.HealthGodName] nade mnou bdí."
 dungeon_ongoing.0006.t: "Bída a beznaděj"
 dungeon_ongoing.0006.desc: "Neustálý chlad, věčná vlhkost a nekonečný hlad z příliš řídké kaše."
 dungeon_ongoing.0006.a: "[ROOT.Char.GetFaith.HighGodName]! Čím jsem si [Select_CString(ROOT.Char.IsFemale,'zasloužila','zasloužil')] něco takového?!"
 dungeon_ongoing.0006.b: "Eh, mohlo být hůř."
 dungeon_ongoing.0007.t: "Touha po něčem víc"
 dungeon_ongoing.0007.desc: "Trčím tady dole ve tmě, zatímco venku jde svět dál. Měl bych být tam venku a sahat po nebesích, ne být pohřbený pod zemí."
 dungeon_ongoing.0007.a: "Zasloužím si mnohem víc než tohle!"
 dungeon_ongoing.0007.b: "Musím se soustředit jen na jediné: přežít."
 dungeon_ongoing.0008.t: "Plynutí dnů"
 dungeon_ongoing.0008.desc: "Jsem tu snad celou věčnost. Jsou to měsíce? Roky? Desetiletí? Mé vyhnanství v temnotě nikdy neskončí!"
 dungeon_ongoing.0008.a: "Je to tááák dlouho!"
 dungeon_ongoing.0009.t: "Útěcha přítele"
 dungeon_ongoing.0009.desc: "Nevím, jak bych to tady dole přežil bez útěchy, kterou mi poskytuje můj drahý [ROOT.Char.Custom('prison_pet')].\n\nKdykoli je mi smutno, přichází útěcha. Kdykoli mám chuť všechno vzdát, dostane se mi povzbuzení. Ještě nikdy jsem nenarazil na jiného [ROOT.Char.Custom('prison_pet')], který by byl takový!"
 dungeon_ongoing.0009.a: "Ty jsi ale poklad, [ROOT.Char.Custom('prison_pet')]!"
 dungeon_ongoing.0010.t: "Má záchrana"
 dungeon_ongoing.0010.desc: "Možná můj úděl v kamenné kobce není nezvratný. Napadá mě [letter_recipient.Custom2('MyCharacterIntroduction', ROOT.Char)]. [Select_CString(ROOT.Char.IsFemale,'Mohla bych','Mohl bych')] poslat dopis s prosbou o vysvobození z tohoto kamenného hrobu. Dokážu ho však pod tolika slídivými zraky dostat až do [letter_recipient.GetCurrentLocation.GetNameNoTooltip]?"
 dungeon_ongoing.0010.a: "Pomohou mi samotné stráže."
 dungeon_ongoing.0010.a.tt: "Musíš přesvědčit stráže sloužící [imprisoner.GetShortUINameNoTooltip], aby doručily tvůj dopis."
 dungeon_ongoing.0010.a.success.t: "Dopis se podaří propašovat ven"
 dungeon_ongoing.0010.a.success.desc: "[letter_recipient.GetTitledFirstNameNoTooltip] může vyjednat tvé propuštění z vězení"
 dungeon_ongoing.0010.a.failure.t: "Stráže se nepodaří přesvědčit"
 dungeon_ongoing.0010.b: "Dopis lze snadno přehlédnout..."
 dungeon_ongoing.0010.b.tt: "Musíš propašovat svůj dopis přes stráže sloužící [imprisoner.GetShortUINameNoTooltip]."
 dungeon_ongoing.0010.b.failure.t: "Stráže zabaví tvůj dopis"
 dungeon_ongoing.0010.c: "Ne, musím zůstat opatrný."
 dungeon_ongoing.0011.t: "[prisoner.Custom2('RelationToMeShort', ROOT.Char)|U] v kobce"
 dungeon_ongoing.0011.desc: "Dorazil mi dopis, jehož původ mě zaskočil. [prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] v něm líčí hrůzné podrobnosti věznění, za kterým stojí [imprisoner.GetTitledFirstName], a naléhavě mě prosí o vysvobození. Má strach, že jinak zemře."
 dungeon_ongoing.0011.a: "[prisoner.GetFirstNameNoTooltip] tam nesmí zůstat ani o chvíli déle!"
 dungeon_ongoing.0011.a.tt: "Požádáš [imprisoner.GetTitledFirstNameNoTooltip] o propuštění [prisoner.GetTitledFirstNameNoTooltip]"
 dungeon_ongoing.0011.a.success.t: "[imprisoner.GetTitledFirstNameNoTooltip] tvé žádosti vyhoví"
 dungeon_ongoing.0011.a.failure.t: "[imprisoner.GetTitledFirstNameNoTooltip] odmítne propustit [prisoner.GetTitledFirstNameNoTooltip]"
 dungeon_ongoing.0011.a_not_ai: "[imprisoner.GetTitledFirstNameNoTooltip] zváží propuštění [prisoner.GetTitledFirstNameNoTooltip]"
 dungeon_ongoing.0011.b: "Pche, [prisoner.GetFirstNameNoTooltip] určitě přehání."
 dungeon_ongoing.0012.t: "Spálené dopisy"
 dungeon_ongoing.0012.desc: "Dny se přede mnou vlečou a od [letter_recipient.Custom2('MyCharacterIntroduction', ROOT.Char)] stále nepřichází žádná odpověď. Co se děje? Proč nikdo neodpovídá? Kéž bych se jen mohl vymanit z tohoto kamenného sevření!"
 dungeon_ongoing.0012.a: "Možná se dopis ztratil?"
 dungeon_ongoing.0012.b: "Vždycky mi bylo jasné, že [letter_recipient.GetTitledFirstNameNoTooltip] je [letter_recipient.Custom2('InsultNoun', ROOT.Char)]"
 dungeon_ongoing.0013.t: "Rodina v kobce"
 dungeon_ongoing.0013.desc_intro: "Ačkoli mám plné právo věznit [prisoner.Custom2('MyCharacterIntroduction', ROOT.Char)], [letter_recipient.GetTitledFirstName] očividně můj pohled nesdílí.\n\n"
 dungeon_ongoing.0013.desc_reasoning_compassionate: "„Copak s tebou nic nedělá, že někdo z rodu [ROOT.Char.GetHouse.GetBaseName] je takhle zavřený?“ zazní otázka. „Odhlédni od provinění a mysli na dobro rodu, prosím.“"
 dungeon_ongoing.0013.desc_reasoning_other: "„Když se zavíráme za vlastní zdi, jen tím slábneme vůči hrozbám zvenčí,“ zazní protest. „Nepropustíš tedy [prisoner.GetTitledFirstNameNoTooltip] pro dobro [realm_title.GetNameNoTier]?“"
 dungeon_ongoing.0013.a: "[prisoner.GetTitledFirstNameNoTooltip] dnes vyjde na svobodu."
 dungeon_ongoing.0013.b: "Mám plné právo držet [prisoner.GetTitledFirstNameNoTooltip] ve vězení, rodina sem, rodina tam."
 dungeon_ongoing.0014.t: "Prázdné ozvěny"
 dungeon_ongoing.0014.desc: "Doléhá ke mně šeptání stráží. [letter_recipient.Custom2('MyCharacterIntroduction', ROOT.Char)] očividně vyslyšel mé dopisy a obrátil se na mého žalářníka [imprisoner.GetTitledFirstName]. Bohužel ten [imprisoner.Custom2('InsultNoun', ROOT.Char)] neprojevil ani špetku slitování a žádost odmítl. Na mé nesvobodě se nezměnilo vůbec nic."
 dungeon_ongoing.0014.a: "Alespoň je [letter_recipient.GetTitledFirstNameNoTooltip] dobrý [ROOT.Char.Custom2('RelationToMeShort', letter_recipient)]."
 dungeon_ongoing.0014.b: "Copak mi nikdo nepomůže?!"
 dungeon_ongoing.9001.t: "Uvnitř"
 dungeon_ongoing.9001.desc: "Nevzpomínám si, kdy jsem naposledy viděl slunce. Nevzpomínám si, kdy jsem naposledy dostal pevné jídlo, nebo vůbec cokoli pevného.\n\nMám pocit, jako by se mi vlhkost ze vzduchu usadila v plicích.\n\nKdyž mě bolí zub, jednoduše ho vytrhnu z hnijících dásní."
 dungeon_ongoing.9001.a: "Je tak těžké se hýbat."
 dungeon_ongoing.9002.t: "Prázdnota"
 dungeon_ongoing.9002.desc: "Kašel nikdy neustává. Už celé dny jsem nespal ani hodinu v kuse, aniž bych se probudil s rukama křečovitě sevřenýma kolem hrdla.\n\nAni olizování pramínků vody ze zdi už nepomáhá."
 dungeon_ongoing.9002.a: "Chci jen, aby to skončilo."
 dungeon_ongoing.9003.t: "Vzpomínky"
 dungeon_ongoing.9003.desc: "Pustí mě odsud vůbec někdy? Jsem tu prostě zavřený, opuštěný a zapomenutý?\n\nVí kromě žalářníka vůbec někdo, že jsem tady?\n\nZůstal ještě někdo, kdo zná mé jméno?\n\nKdo si pamatuje, kým jsem byl?"
 dungeon_ongoing.9003.a: "Sotva si vybavuji jejich tváře..."
 dungeon_ongoing.9004.t: "Opuštění"
 dungeon_ongoing.9004.desc: "Tady zemřu. Vím to jistě. Už nikdy neucítím slunce na tváři ani neuslyším smích, v němž by nebyla stopa beznaděje."
 dungeon_ongoing.9004.a: "Tohle je celý můj svět."
 dungeon_ongoing.9005.t: "Nevýslovná ztráta"
 dungeon_ongoing.9005.desc: "Můj věrný společník, můj nejdražší přítel, má jediná opora na tomhle temném místě...\n\nKdyž v náručí svírám svého umírajícího [ROOT.Char.Custom('prison_pet')], zaplaví mě naprostá beznaděj. Jestli na tomhle místě musí zemřít i tak nevinné stvoření, jakou šanci mám já?"
 dungeon_ongoing.9005.a: "Nemůžeš mě tady nechat samotného!"
