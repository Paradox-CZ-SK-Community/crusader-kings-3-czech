l_polish:
 house_arrest_ongoing.0001.t: "Cíle a sny"
 house_arrest_ongoing.0001.desc: "Každý další den, kdy mě [prison_holder.GetTitledFirstName] drží v zajetí, znamená, že se mé pečlivě spřádané plány vzdalují stále víc.\n\nSkutečným trestem není samotné omezení mého pohybu, ale to, že nemohu vůbec nic dělat!"
 house_arrest_ongoing.0001.a: "V jakém stavu asi jsou mé záležitosti?"
 house_arrest_ongoing.0001.b: "Až mě propustí, budu [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')]. Musím plánovat!"
 house_arrest_ongoing.0002.t: "Pomýlený rozsudek"
 house_arrest_ongoing.0002.desc: "Za koho se [prison_holder.GetTitledFirstName] vůbec považuje?! Drží mě tu v zajetí jako zvíře a ještě má tu drzost tvrdit, že je to spravedlnost.\n\nVždyť právo soudit #EMP mě#! má jen [ROOT.Char.GetFaith.HighGodName]."
 house_arrest_ongoing.0002.a: "Nikdy mě nikdo takhle neurazil!"
 house_arrest_ongoing.0002.b: "Musím se pokusit zachovat klid."
 house_arrest_ongoing.0003.t: "Osamělé dny"
 house_arrest_ongoing.0003.desc_opening: "Trávit čas odloučeně od všech, které miluji, je krutý trest. Hledám útěchu a společnost, kde se jen dá, ale příležitostí je žalostně málo."
 house_arrest_ongoing.0003.desc_friendly_prisoner: "\n\nDlouhé dny mi pomáhá překonat jediné, pouto, které mám s [friendly_prisoner.GetTitledFirstName]."
 house_arrest_ongoing.0003.a: "Copak si se mnou nikdo nepromluví?!"
 house_arrest_ongoing.0003.b: "Ještě najdu někoho, kdo si se mnou bude chtít promluvit."
 house_arrest_ongoing.0003.c: "[friendly_prisoner.GetFirstNameNoTooltip] je jediný člověk, který mi tu zůstal nablízku."
 house_arrest_ongoing.0003.d: "[friendly_prisoner.GetFirstNameNoTooltip] je jediným zdrojem útěchy a lásky."
 house_arrest_ongoing.0003.e: "[ROOT.Char.GetFirstNameNoTooltip] je jediným zdrojem útěchy a lásky."
 house_arrest_ongoing.0004.t: "Úleva od trápení"
 house_arrest_ongoing.0004.desc1: "„Vím, jak ti chybí knihy a svitky, tak jsem ti [Select_CString(friend_at_court.IsFemale,'přinesla','přinesl')] něco malého z trhu!“"
 house_arrest_ongoing.0004.desc2: "„Vím, jak moc máš [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] koláče, a kuchař zrovna nedával pozor, takže...“"
 house_arrest_ongoing.0004.desc3: "„Dnes jsem ve městě [Select_CString(friend_at_court.IsFemale,'zahlédla','zahlédl')] tenhle náramek a hned mi bylo jasné, že se ti bude líbit. Prosím, nasaď si ho!“"
 house_arrest_ongoing.0004.desc4: "„Stráže jsem [Select_CString(friend_at_court.IsFemale,'přesvědčila','přesvědčil')] jen k tomuhle, ale snad ti procházka po zahradách zvedne náladu!“"
 house_arrest_ongoing.0004.desc: "\n\n[friend_at_court.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend_at_court') )], na mě pořád myslí a dělá vše pro to, aby byl můj trest snesitelnější."
 house_arrest_ongoing.0004.a: "Nevím, co bych si bez [friend_at_court.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'počala','počal')]!"
 house_arrest_ongoing.0005.t: "Můj osobní trýznitel"
 house_arrest_ongoing.0005.desc: "„[Select_CString(ROOT.Char.IsFemale,'Měla jsi','Měl jsi')] vidět ty kejklíře na slavnosti. To byla podívaná!“\n\nUž samotné vězení je dost zlé. K tomu ještě musím snášet posměšky od [rival_at_court.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_at_court') )]. Teď, když jsem na dně, si [rival_at_court.GetFirstNameNoTooltip] dává záležet, aby mi život co nejvíc znepříjemnil."
 house_arrest_ongoing.0005.a: "A daří se to skvěle!"
