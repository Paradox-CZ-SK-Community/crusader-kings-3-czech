l_polish:
 prison.1001.t: "Pravda, nebo muka"
 prison.1001.start.desc: "Mé snění náhle přeruší dveře cely, které se rozletí dokořán. Siluetu strážného poznávám, ale [Select_CString(actor.IsFemale,'ženu','muže')], která stojí za ním... Ach. Ach ne.\n\n"
 prison.1001.rack.desc: "[actor.GetTitledFirstName] mě [Select_CString(actor.IsFemale,'vlastnoručně připoutá','vlastnoručně připoutá')] ke skřipci a na rtech se objeví spokojený úšklebek. „Předpokládám, že jsi slyšel ostatní. Ten křik, praskání kostí a šlach.“"
 prison.1001.whip.desc: "[actor.GetTitledFirstName] si pohrává s bičem. „Ach, vypadá docela nevinně, ale maso dokáže oddělit od kostí stejně dobře jako kterýkoli nůž.“"
 prison.1001.rats.desc: "„Tyhle krysy možná vypadají krotce,“ pronese [actor.GetTitledFirstName] a ukáže na kbelík, z něhož se ozývá tiché pištění. „Jakmile ale ucítí oheň, s chutí se prokoušou #emp čímkoli#!, jen aby unikly.“"
 prison.1001.poetry.desc: "[actor.GetTitledFirstName] vytáhne dlouhý, předlouhý, #EMP nekonečně dlouhý#! svitek ukrytý v podpaží.\n\n„Snad ti nebude vadit, když ti přečtu jeden či dva svazky své... #EMP nejlepší#! poezie.“"
 prison.1001.my_secret.desc: "„Něco skrýváš, to poznám,“ pronese [actor.GetTitledFirstName]. „Řekni mi pravdu, nebo...“"
 prison.1001.anothers_secret.desc: "„Něco víš o [reveal_secret_owner.Custom2('MyCharacterIntroductionNoComma' SCOPE.sC('actor'))],“ pronese [actor.GetTitledFirstName]. „Řekni mi všechno, nebo...“"
 prison.1001.a: "Řeknu ti všechno, přísahám!"
 prison.1001.b: "..."
 prison.1002.rack.desc: "Proč věci komplikovat? Nad starý dobrý skřipec není. Když žalářník přivede [recipient.GetTitledFirstName] do místnosti, pohled okamžitě padne na mohutný dřevěný rám."
 prison.1002.whip.desc: "Ach, sladký polibek biče! Možná vypadá nevinně, ale maso dokáže oddělit od kostí stejně dobře jako kterýkoli nůž. Soudě podle výrazu ve tváři [recipient.GetTitledFirstName] je to až příliš dobře známo."
 prison.1002.rats.desc: "Krysy v kbelíku možná zprvu působí plaše, ale jakmile přijde žár, s chutí se prokoušou lidskou hrudí. Když tento princip vysvětluji [recipient.GetTitledFirstName], odhodlání se mi přímo před očima rozplývá."
 prison.1002.poetry.desc: "Když člověk dokáže slova ohýbat pro potěšení tak dobře jako já, použít je k působení bolesti je hračka.\n\nVytáhnu dlouhý svitek poezie, rozvinu ho a nechám jeho konec dopadnout na podlahu a pomalu se odkutálet ven ze dveří."
 prison.1002.anothers_secret.desc: "\n\n„Ne, ne, já... Já něco vím! [reveal_secret_owner.GetTitledFirstName] [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]! Řeknu ti všechno!“"
 prison.1002.my_secret.desc: "\n\n„Prosím, ne! #EMP Prosím!#! Řeknu ti cokoli, co chceš vědět! Já... já [secret_to_reveal.Custom('SecretDescriptionFirstPerson')]!“"
 prison.1002.a: "Zajímavé. Zpátky do cely."
 prison.1002.b: "Ještě s tebou #emp nejsem#! hotov..."
 prison.1003.t: "Mučení"
 prison.1003.rack.desc: "Proč věci komplikovat? Nad starý dobrý skřipec není. Zvuk praskajících kostí a šlach se jen tak nezapomíná. Ale ještě nezapomenutelnější bude bolest, kterou má [recipient.GetTitledFirstName] zakrátko poznat..."
 prison.1003.whip.desc: "Ach, sladký polibek biče! Možná vypadá nevinně, ale maso dokáže oddělit od kostí stejně dobře jako kterýkoli nůž – a [recipient.GetTitledFirstName] se o tom brzy přesvědčí. Na zádech se ještě dlouho spát nebude..."
 prison.1003.rats.desc: "„Tyhle krysy možná vypadají plaše,“ říkám, zatímco připevňuji kbelík na odhalenou hruď [recipient.GetFirstName]. „Jakmile se uvnitř oteplí, udělají cokoli, aby unikly. Naštěstí pro ně mají #emp velmi#! ostré zuby.“ [recipient.GetFirstNameNoTooltip] prosí o slitování, zatímco sahám po rozžhaveném uhlí."
 prison.1003.poetry.desc: "$prison.1002.poetry.desc$\n\nPak začnu předčítat."
 prison.1003.a: "Ach... Ten křik bych mohl poslouchat celé hodiny."
 prison.1003.b: "Bylo to nutné."
 prison.1010.rack.desc: "[actor.GetTitledFirstName] mě vlastnoručně připoutá ke skřipci a na rtech se objeví spokojený úšklebek. Slyšel jsem ten křik i zvuk, když kosti a šlachy #emp praskají#!... Prosím o slitování, ale úsměv ve tváři [actor.GetFirstNameNoTooltip] se jen rozšiřuje."
 prison.1010.whip.desc: "[actor.GetTitledFirstName] si pohrává s bičem. „Ach, vypadá docela nevinně, ale maso dokáže oddělit od kostí stejně dobře jako kterýkoli nůž. Dovol mi to předvést...“"
 prison.1010.rats.desc: "„Tyhle krysy možná vypadají plaše,“ pronese [actor.GetTitledFirstName], zatímco mi připevňuje kbelík na odhalenou hruď. „Jakmile se uvnitř oteplí, udělají cokoli, aby unikly. Naštěstí pro ně mají #emp velmi#! ostré zuby.“"
 prison.1010.poetry.desc: "$prison.1001.poetry.desc$\n\nPak začne předčítat."
 prison.1010.a: "Prosím, ne, já...! #emp Aaaaaaaah!#!"
 prison.1020.t: "[Select_CString(recipient.IsFemale,'Oslepena','Oslepen')]"
 prison.1020.start.desc: "Žalářník přivleče vyděšeného [recipient.GetTitledFirstName] do [ROOT.Char.Custom('GetRoom')]. „Prosím! Udělám cokoli, cokoli budete chtít!“ Protesty náhle utichnou, když přijde roubík a pevné připoutání ke stolu.\n\n"
 prison.1020.cruel.desc: "„Ach, [recipient.GetFirstNameNoTooltip],“ teatrálně povzdechnu. „Nikdy jsme si zrovna nepadli do oka. Ale podívej se na to z té lepší stránky, konečně jsem přišel na způsob, jak to napravit.“"
 prison.1020.compassionate.desc: "„Možná to vypadá barbarsky,“ říkám, zatímco se lékař připravuje, „ale jde o stabilitu panství. Věř mi – tvé utrpení mi nepůsobí žádné potěšení.“"
 prison.1020.compassionate.landless.desc: "„Možná to vypadá barbarsky,“ říkám, zatímco se lékař připravuje, „ale takhle je to nejlepší. Věř mi – tvé utrpení mi nepůsobí žádné potěšení.“"
 prison.1020.child.desc: "„Po tomhle se budeš cítit lépe,“ pronese lékař a nabídne [recipient.GetTitledFirstName] uspávací nápoj. Drobná ruka se třese, ale nápoj přesto zmizí do poslední kapky.\n\nJakmile dítě usne, lékař na mě dlouze pohlédne. „Jste si tím jistý, [actor.GetLadyLord]?“"
 prison.1020.a: "Ach ano, tohle #emp bude#! bolet."
 prison.1020.b: "Mám své důvody."
 prison.1021.start.desc: "Tiše přemítám o svém osudu, když žalářník náhle rozrazí dveře a vytáhne mě z cely. V ponuré chodbě čeká [actor.GetTitledFirstName].\n\n"
 prison.1021.landless_start.desc: "Tiše přemítám o svém osudu, když žalářník náhle vstoupí a vytáhne mě z klece. Vzápětí stojím tváří v tvář [actor.GetTitledFirstName].\n\n"
 prison.1021.cruel.desc: "Výraz spokojenosti ve tváři [actor.GetTitledFirstName] mi žene mráz po zádech.\n\n„Neboj se. Pro tvou hlavu jsem nepřišel – oči mi budou stačit.“"
 prison.1021.compassionate.desc: "„[recipient.GetFirstNameNoTooltip], chci, abys věděl, že mi to nepůsobí žádné potěšení. Musím tě oslepit. Pro stabilitu panství.“"
 prison.1021.child.desc: "„Po tomhle se budeš cítit lépe,“ pronese lékař a podá mi malou skleněnou lahvičku. Tohle je špatné místo plné špatných lidí, ale ten pohled... působí laskavě. Třesoucí se rukou zvednu lahvičku ke rtům."
 prison.1021.a: "Moje... moje oči? Pusťte mě! #emp Nééé!#!"
 prison.1021.b: "Já... Cítím se divně..."
 prison.1025.t: "Vykastrován"
 prison.1025.cruel.desc: "„Ach, [recipient.GetFirstNameNoTooltip],“ teatrálně povzdechnu. „Neboj se. Nepřišel jsem si pro tvou hlavu ani pro nic jiného cenného. Tvé mužství mi bohatě postačí.“"
 prison.1026.cruel.desc: "Spokojený výraz ve tváři [actor.GetTitledFirstName] mi žene mráz po zádech.\n\n„Neboj se. Nepřišel jsem si pro tvou hlavu ani pro nic jiného cenného. Tvé mužství mi bohatě postačí.“"
 prison.1026.compassionate.desc: "„[recipient.GetFirstNameNoTooltip], chci, abys věděl, že mi to nepůsobí žádné potěšení. Musím tě nechat vykastrovat. Pro stabilitu panství.“"
 prison.1026.a: "Cože...? Pusťte mě! #emp Nééé!#!"
 prison.1030.t: "[Select_CString(recipient.IsFemale,'Zohyzděna','Zohyzděn')]"
 prison.1030.cruel.desc: "„Nuže, [recipient.GetFirstNameNoTooltip],“ teatrálně povzdechnu. „Zdá se, že nadešel čas, aby tvá vnější schránka odrážela ošklivost, kterou ukrýváš uvnitř.“"
 prison.1031.cruel.desc: "Spokojený výraz ve tváři [actor.GetTitledFirstName] mi žene mráz po zádech.\n\n„Neboj se. Nepřišel jsem si pro #EMP celou#! tvou hlavu. Bohatě mi postačí jen její část...“"
 prison.1031.a: "Můj... můj nos? Pusťte mě! #EMP Nééé!#!"
 prison.1041.t: "[Select_CString(recipient.IsFemale,'Zmrzačena','Zmrzačen')]"
 prison.1041.cruel.desc: "„Jedna věc na tobě vždycky vzbuzovala můj obdiv, [recipient.GetFirstName],“ ušklíbnu se. „Dokážeš vytěžit maximum i z nepříznivých okolností. Vždycky si umíš poradit s málem – třeba i s o pár liber menší váhou...“"
 prison.1041.compassionate.desc: "„[recipient.GetFirstName], chci, abys věděl, že mi to nepůsobí žádné potěšení. Musím tě zmrzačit. Pro stabilitu panství.“"
 prison.1042.cruel.desc: "Spokojený výraz ve tváři [actor.GetTitledFirstName] mi žene mráz po zádech.\n\n„Jedna věc na tobě vždycky vzbuzovala můj obdiv, [recipient.GetFirstName],“ zazní s úšklebkem. „Dokážeš vytěžit maximum i z nepříznivých okolností. Vždycky si umíš poradit s málem – třeba i s o pár liber menší váhou...“"
 prison.1041.a: "Moje... moje končetiny? Ne, to nemůžete, #EMP nemůžete!#!"
 prison.9001.t: "Svoboda!"
 prison.9001.desc_1: "Dlouhé dny plánuji útěk, promýšlím nejlepší postup i únikovou cestu. Nakonec je všechno to úsilí k ničemu. Jednoho dne stráž prostě zapomene zamknout celu a odpotácí se pryč, aniž by se ohlédla."
 prison.9001.desc_2: "Pár vlídných slov, tu a tam upřímná poklona – a počáteční podezřívavost stráže se brzy mění v důvěrnou náklonnost. Když požádám o trochu čerstvého vzduchu, nepřijde ani jediná otázka. O chvíli později už utíkám a za sebou nechávám bezvládné tělo v příkopu."
 prison.9001.desc_3_opening: "Stačila jediná chvilka nepozornosti, abych vytáhl klíče z opasku stráže a schoval je za zády."
 prison.9001.desc_3_house_arrest: "Když padne tma, pomalu pootevřu dveře a při jejich skřípění sebou cuknu."
 prison.9001.desc_3: "Když padne tma, pomalu se vydám ven z cely a při skřípění dveří sebou cuknu."
 prison.9001.desc_4: "Prohledávám každý kousek cely. Zkoumám každý pant, přejíždím rukou po každé mříži a prověřuji každý řetěz. Když znovu padne tma, konečně objevím to, co jsem hledal – uvolněný kámen! Rozšířit otvor v tunel je pak už snadná práce."
 prison.9001.desc_5: "Procházím celé místo, až znám každé dveře jako starého přítele, a čekám na svou chvíli. Vím, kdo kam chodí a kdy. Vím, kdo si volá které služebnictvo, a znám nejrychlejší cestu ven. Když padne tma, jednoduše vyčkám na dokonalý okamžik a pak zmizím jako stín."
 prison.9001.desc_6: "Počkám, až padne tma, a jakmile mám jistotu, že nikdo není nablízku, popadnu do každé ruky jednu mříž a #EMP zatlačím#!. Pot mi stéká do očí a zrychlený dech se rozléhá tmou, ale brzy vznikne otvor právě tak velký, abych se jím protáhl."
 prison.9001.desc_7: "Jakmile stráž odejde, vrhnu se na zámek. Je starý a rezavý a jediným nástrojem je malý hřebík, který jsem našel v koutě, ale to mě nezastaví. Trochu pootočit, lehce zatlačit a – #EMP je to!#!"
 prison.9001.desc_8: "Usměji se, když stráž marně potlačuje zívnutí. Rozhovor už udržuji celé hodiny a bez ustání rozebírám [ROOT.Char.Custom('subject_of_interest')]. Brzy začne hlava klimbat nad židlí a dostat se ke klíčům už je hračka."
 prison.9001.desc_9: "Mnoho dní kradmých pohledů, svůdných gest a náznaků konečně nese ovoce. Když ke mně stráž přichází už zcela podmaněná, jen se usměji. [dummy_gender.Custom('GetUpperClothingArticle')] jde stranou a ztratit vědomí ve víru rozkoše je přece tak snadné. Dávám si pozor, aby nevznikla žádná zbytečná újma."
 prison.9001.desc_ending_1: "\n\nKonečně mizím pryč. Přede mnou se rozprostírá [imprisoner.Custom('TerrainType')] a za mnou zůstává [imprisoner.Custom('ResidenceBuilding')], kde rozhoduje [imprisoner.GetTitledFirstName]. Teprve teď si dovolím doufat."
 prison.9001.desc_ending_2: "\n\nKdyž zmizím v noci a dostanu se daleko od všech, zakloním hlavu a rozesměji se."
 prison.9001.a: "[Select_CString(ROOT.Char.IsFemale,'Jsem volná!','Jsem volný!')]"
 prison.9002.desc_opening: "Stačí jediný okamžik nepozornosti"
 prison.9002.desc_rat: " – vypustím svou krysu, která tiše přeběhne po podlaze, vyšplhá po stoličce, na níž odpočívá stráž, a zamíří přímo ke klíčům"
 prison.9002.desc_stone: " – připlížím se zezadu ke stráži a #EMP udeřím#! kamenem do zadní části přilby. Jakmile se stráž zhroutí k zemi, rychle prohledám výstroj a najdu klíče"
 prison.9002.desc_spoon: " a vrazím lžíci do zámku. Po dlouhém viklání a páčení zámek s hlasitým #EMP cvaknutím#! povolí"
 prison.9002.desc_cockroach: " – vypustím svého švába a jakmile proběhne stráži pod nohama, prudké ucuknutí skončí nárazem hlavy o zem"
 prison.9002.desc_end: ", a zanedlouho já i můj věrný [ROOT.Char.Custom('prison_pet')] mizíme pryč. Za námi zůstává [imprisoner.Custom('ResidenceBuilding')], kde rozhoduje [imprisoner.GetTitledFirstName], a před námi se rozprostírá [imprisoner.Custom('TerrainType')]."
 prison.9002.a: "Máme svobodu, [ROOT.Char.Custom('prison_pet')]!"
 prison.9003.desc: "[imprisoner.GetTitledFirstName] má stráže, ale jakmile se ke mně a mému spoluvězni [prison_friend.GetTitledFirstName] otočí zády, udeříme.\n\nDlouhé dny ve vězení mě však oslabily. Jedna ze stráží mě udeří železem pobitou pěstí do břicha, rána mě přemůže a přitlačí k zemi. Už se chystá zasadit poslední úder, když nad námi zahlédnu [prison_friend.GetTitledFirstNameNoTooltip] s jejím vlastním nožem v ruce – a zanedlouho jsme znovu na útěku.\n\nKdyž se společně potácíme do noci a navzájem se podpíráme, smějeme se."
 prison.9003.a: "Jsme na svobodě!"
 prison.9499.t: "[Select_CString(escapee.IsFemale,'Uprchla!','Uprchl!')]"
 prison.9499.desc_house_arrest: "[escapee.GetTitledFirstName] [Select_CString(escapee.IsFemale,'utekla','utekl')] z domácího vězení!"
 prison.9499.desc_dungeon: "[escapee.GetTitledFirstName] [Select_CString(escapee.IsFemale,'utekla','utekl')] z žaláře!"
 prison.9499.desc_ending: "\n\nStráže nemají na svou obhajobu co říct, ale škoda už byla napáchána."
 prison.9499.a: "Proklínám tě, [escapee.GetFirstNameNoTooltip]!"
 prison.9501.t: "Nezlomné okovy"
 prison.9501.desc: "Když stráž na okamžik ztratí pozornost, natáhnu se po klíčích visících u opasku, ale pevná ruka mě v půli pohybu zastaví.\n\n„Ale ne, ne. Odsud se neutíká, #EMP můj [ROOT.Char.GetTitleAsNameNoTooltip]#!.“ Stráž se nade mnou ušklíbne a rozesměje.\n\n„Myslíš, že ta kaše byla špatná?“\n\n„Jen. Počkej.“"
 prison.9501.a: "Tady shniju..."
 prison.9502.t: "Můj statečný [ROOT.Char.Custom('prison_pet')|U]"
 prison.9502.desc_opening: "Jakmile se stráž otočí, rychle popadnu svého [ROOT.Char.Custom('prison_pet')] a mrštím ho přímo proti její hlavě.\n\n"
 prison.9502.desc_rat: "Krysa se zoufale snaží něčeho zachytit, ale stráž ji rychle strhne a hodí na zem.\n\nMůj protestní křik téměř zaniká v bolestném pištění, když ji stráž nemilosrdně rozdrtí podpatkem."
 prison.9502.desc_stone: "Kámen tvrdě narazí do přilby, ale stráž se jen překvapeně otočí.\n\nKdyž zahlédne kámen, s úšklebkem ho odhodí."
 prison.9502.desc_spoon: "Lžíce se odrazí od přilby a stráž si toho sotva všimne.\n\nPak se otočí, zahlédne nepatřičnou lžíci, zvedne ji a zastrčí si ji za opasek."
 prison.9502.desc_cockroach: "Šváb se snaží zachytit, ale pohyb stráž upozorní. Ruka ho nemilosrdně srazí k zemi a vzápětí ho s odporem rozdrtí bota."
 prison.9502.a: "Ne!! Můj [ROOT.Char.Custom('prison_pet')]!"
 prison.9503.t: "Zrada"
 prison.9503.desc: "Se spoluvězněm [prison_friend.GetTitledFirstName] jsme strávili mnoho nocí plánováním útěku.\n\nZatímco dělám rámus, [prison_friend.GetFirstNameNoTooltip] čeká připraveně u dveří. Stráž je otevře a já se usměji. Teď přijde útok zezadu a– a dveře se za stráží zavírají. [prison_friend.GetTitledFirstNameNoTooltip] mizí bez odporu v noci, zatímco všechny stráže míří ke mně."
 prison.9503.a: "No, alespoň je [prison_friend.GetFirstNameNoTooltip] venku..."
 prison.9503.b: "Ten [prison_friend.Custom2('InsultAdjective', ROOT.Char)] [prison_friend.Custom2('InsultNoun', ROOT.Char)] mě zradil!"
 prison.9504.t: "Můj spoluvězeň"
 prison.9504.desc: "Plánováním útěku jsem strávil dlouhé hodiny a když se uprostřed noci plížím ven, nemohu potlačit úsměv. Tohle by mohlo vyjít! Stráž je zneškodněná, cesta–\n\n„[ROOT.Char.GetFirstNameNoTooltip] utíká! Stráže! #EMP Stráže!#!“ Ticho protne skřípavý hlas. Je to [prison_rival.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prison_rival'))], a zanedlouho mě obklopí ozbrojené a rozzuřené stráže."
 prison.9504.a: "Proklínám tě, [prison_rival.GetFirstNameNoTooltip]!"
 prison.9505.t: "Zkoušení hranic"
 prison.9505.opening: "Začíná mi být jasné, že musím vzít svůj osud do vlastních rukou. Stejně tak je zřejmé, že ne každá část [bg_override_char.Custom('GetDungeon')|l] je střežena stejně dobře."
 prison.9505.tumble: "\n\nPo ošklivém pádu z výčnělku na zdi si však přeji, aby tomu tak bylo. Trvalo celou hodinu, než mě někdo našel a pomohl mi zpátky do komnat, kam byl následně přivolán léčitel."
 prison.9505.tunnels: "\n\nBrzy však zjišťuji, že chodby pod hradbami jsou temné a matoucí. Teprve po mnoha odřeninách a několika bolestivých střetech hlavy s kamením se mi podaří najít cestu ven a vrátit se na nádvoří."
 prison.9505.camp: "\n\nBrzy však zjišťuji, že jsem uprostřed změti stanů plné ohnišť, znuděných vojáků a všemožných překážek. Zrádné stanové lano mě pošle tváří k zemi a když mě stráže znovu odvádějí, nezbývá než přijmout, že tudy cesta ven nevede."
 prison.9505.a: "Já... já ještě žiju...!"
