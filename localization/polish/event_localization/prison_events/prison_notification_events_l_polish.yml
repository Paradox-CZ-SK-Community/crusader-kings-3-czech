l_polish:
 prison_notification.0001.t: "[Select_CString(ROOT.Char.IsFemale,'Uvězněna!','Uvězněn!')]"
 prison_notification.0001.desc: "[Select_CString(ROOT.Char.IsFemale,'Byla jsem zajata a uvězněna','Byl jsem zajat a uvězněn')] proti své vůli a za vším stojí [imprisoner.GetTitledFirstName]!\n\nMísto, kam patřím, je [ROOT.Char.Custom('GetCourt')], ale vrátit se tam už nemohu ani cestovat, kam se mi zachce."
 prison_notification.0001.a: "Doufám, že to nebude trvat dlouho."
 prison_notification.0002.t: "[Select_CString(prisoner.IsFemale,'Uvězněna!','Uvězněn!')]"
 prison_notification.0002.desc: "[prisoner.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('prisoner'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))], je teď proti své vůli [Select_CString(prisoner.IsFemale,'držena','držen')] v zajetí a za vším stojí [imprisoner.GetTitledFirstName]."
 prison_notification.0002.a: "Co se dá dělat? [prisoner.GetFirstNameNoTooltip] potřebuje pomoc."
 prison_notification.0003.message: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))|U] [Select_CString(prisoner.IsFemale,'uvězněna','uvězněn')]!"
 prison_notification.1001.t: "Do temnoty"
 prison_notification.1001.desc: "[puppet_or_actor.GetTitledFirstName] mě [Select_CString(puppet_or_actor.IsFemale,'nechala','nechal')] uvrhnout do žaláře! Shniju snad tady, ve vlhkých chodbách, které skrývá [puppet_or_actor.Custom('FortifiedBuilding')] [puppet_or_actor.Custom('CZ_TitledFirstName_G')]?"
 prison_notification.1001.a: "[Select_CString(puppet_or_actor.IsFemale,'ona','on')|U] je horší než krysy, které tu pobíhají!"
 prison_notification.1001.a.tt: "Pobyt v žaláři ti bude postupně zvyšovat [Concept('stress','stres')|E] až na nebezpečnou úroveň!"
 prison_notification.1002.t: "Čerstvější vzduch"
 prison_notification.1002.desc: "[puppet_or_actor.GetTitledFirstName] [Select_CString(puppet_or_actor.IsFemale,'uznala','uznal')] za vhodné propustit mě ze svého žaláře, ale jen proto, aby mě dál [Select_CString(puppet_or_actor.IsFemale,'držela','držel')] v domácím vězení."
 prison_notification.1002.a: "Vezmu zavděk každou milostí."
 prison_notification.1002.a.tt: "Domácí vězení nezvyšuje [Concept('stress','stres')|E]."
 prison_notification.2001.t: "Znovu na svobodě"
 prison_notification.2001.desc: "[imprisoner.GetTitledFirstName] mě už nedrží proti mé vůli. Můžu se vrátit domů nebo zamířit kamkoli se mi zachce."
 prison_notification.2001.a: "[Select_CString(ROOT.Char.IsFemale,'Myslela jsem, že už své země nikdy neuvidím.','Myslel jsem, že už své země nikdy neuvidím.')]"
 prison_notification.2002.t: "Znovu na svobodě"
 prison_notification.2002.desc: "[prisoner.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('prisoner'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))], je opět na svobodě! [imprisoner.GetTitledFirstName] [Select_CString(prisoner.IsFemale,'ji už nedrží','ho už nedrží')] ve vězení."
 prison_notification.2002.a: "Věznit druhé je kruté."
 prison_notification.2003.message: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))|U] je opět na svobodě!"
