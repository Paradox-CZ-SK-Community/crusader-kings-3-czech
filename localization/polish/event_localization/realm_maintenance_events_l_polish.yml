l_polish:
 realm_maintenance.1001.t: "Nový lenní pán"
 realm_maintenance.1001.t.ceremonial_regent: "Nový $game_concept_ceremonial_regent$"
 realm_maintenance.1001.conquest: "[new_liege.GetTitledFirstName] se právem dobyvatele stává tvým novým [Concept('liege','lenním pánem')|E]"
 realm_maintenance.1001.conquest_holy_war: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co osvobodil tvé země od [old_liege.Custom2('GetUnbelieverTermAdjective', ROOT.Char)] nadvlády postavy [old_liege.GetTitledFirstName]!"
 realm_maintenance.1001.conquest_claim: "$realm_maintenance.1001.conquest$"
 realm_maintenance.1001.conquest_populist: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co osvobodil tvé země od postavy [old_liege.GetTitledFirstName], kterou tvůj lid považuje za [old_liege.Custom2('GetUnbelieverAndForeignerTerm', ROOT.Char)]!"
 realm_maintenance.1001.inheritance: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co po [old_liege.GetTitledFirstName] zdědil [Concept('titles','tituly')|E]"
 realm_maintenance.1001.abdication: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co [old_liege.GetTitledFirstName] [Select_CString(old_liege.IsFemale, 'abdikovala', 'abdikoval')] ze svého trůnu"
 realm_maintenance.1001.destroyed: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] v důsledku zničení [Concept('title','titulu')|E]"
 realm_maintenance.1001.created: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] v důsledku vytvoření [Concept('title','titulu')|E]"
 realm_maintenance.1001.usurped: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co uzurpoval [Concept('titles','tituly')|E] postavě [old_liege.GetTitledFirstName]"
 realm_maintenance.1001.granted: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co obdržel nové [Concept('titles','tituly')|E]"
 realm_maintenance.1001.revoked: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E], protože [old_liege.GetTitledFirstName] přišel o své [Concept('titles','tituly')|E]"
 realm_maintenance.1001.election: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co zvítězil ve volbě nástupce postavy [old_liege.GetTitledFirstName]"
 realm_maintenance.1001.independency: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co získal nezávislost"
 realm_maintenance.1001.returned: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co mu [old_liege.GetTitledFirstName] vrátil jeho [Concept('titles','tituly')|E]"
 realm_maintenance.1001.leased_out: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co si od [old_liege.GetTitledFirstName] pronajal [Concept('title','titul')|E]"
 realm_maintenance.1001.lease_revoked: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co zrušil pronájem [Concept('titles','titulů')|E] postavy [old_liege.GetTitledFirstName]"
 realm_maintenance.1001.faction_demand: "[new_liege.GetTitledFirstName] nahrazuje [old_liege.GetTitledFirstName] jako tvůj [Concept('liege','lenní pán')|E] poté, co jej dosadila [Concept('faction','frakce')|E]"
 realm_maintenance.1001.swear_fealty: "Přísahal jsi věrnost postavě [new_liege.GetTitledFirstName] a stal ses jejím [Concept('vassal','vazalem')|E]"
 realm_maintenance.1001.appointment: "[new_liege.GetTitledFirstName] nahrazuje [old_liege.GetTitledFirstName] jako tvůj [Concept('liege','lenní pán')|E], protože byl dalším kandidátem v pořadí"
 realm_maintenance.1001.appointment_succession: "$realm_maintenance.1001.appointment$"
 realm_maintenance.1001.stepped_down: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E] poté, co [old_liege.GetTitledFirstName] odstoupil"
 realm_maintenance.1001.error: "[new_liege.GetTitledFirstName] se stává tvým novým [Concept('liege','lenním pánem')|E], ale nevíš proč!"
 realm_maintenance.2001.t: "[ROOT.Char.GetTitleAsNameNoTooltip|U] přebírá vládu"
 realm_maintenance.2001.t_ceremonial_regent: "Správce [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 realm_maintenance.2001.desc_murdered: "Po tragické a #EMP nešťastné#! smrti [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] nyní na má bedra padá odpovědnost za vládu. [title.GetTierAsNameNoTooltip|U] je nyní v mých rukou."
 realm_maintenance.2001.desc_dead: "Po smrti [previous_holder.Custom2('MyCharacterIntroduction', ROOT.Char)] nyní na má bedra padá odpovědnost za vládu. [title.GetTierAsNameNoTooltip|U] je nyní v mých rukou."
 realm_maintenance.2001.desc_alive: "Nyní je na mně, abych řídil státní aparát, který po sobě zanechal můj předchůdce [previous_holder.GetTitledFirstName]."
 realm_maintenance.2001.desc: "\n\nNasadím výraz hodný panovníka, předstoupím před své vazaly a [ROOT.Char.Custom('quirk_pos_personal_present')]. Ach, jaké věci dokážu!"
 realm_maintenance.2001.desc_ceremonial_regent: "Mou vážnou povinností je jménem [ROOT.Char.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetHolder.GetTitledFirstName] spravovat zemi, jejíž jméno zní [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nDůstojně usednu před shromážděným dvorem, vychutnávám si ten okamžik a [ROOT.Char.Custom('quirk_pos_personal_present')]. Ach, jaké věci dokážu!"
 realm_maintenance.2001.a: "Ať žije [ROOT.Char.GetTitleAsNameNoTooltip]!"
 realm_maintenance.2001.a.ceremonial_regent: "Je mi velkou ctí sloužit postavě [ROOT.Char.GetPrimaryTitle.MakeScope.Var('administrative_ui_special_title').Title.GetHolder.GetTitleAsNameNoTooltip]!"
 