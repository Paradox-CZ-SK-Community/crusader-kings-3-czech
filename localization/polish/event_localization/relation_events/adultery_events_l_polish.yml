l_polish:
 adultery.0002.t: "Někdo jiný"
 adultery.0002.consort_start.desc: "[lover_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je s příchodem noci opět k nenalezení a [ROOT.Char.Custom('GetChamber')|l] zeje prázdnotou. V poslední době se mi stále víc vzdaluje, často se ztrácí v myšlenkách a [ROOT.Char.Custom('GetCourt')|l] [Select_CString(lover_spouse.IsFemale,'ji','ho')] vídá jen zřídka."
 adultery.0002.soulmate_start.desc: "Už je to příliš dlouho, co mi [lover_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] naposledy [Select_CString(lover_spouse.IsFemale,'spočinula','spočinul')] v náručí. V poslední době se mi vzdaluje a neustále si vymýšlí nové výmluvy, proč se nemůžeme sejít."
 adultery.0002.desc: "\n\nCopak se mnou není [Select_CString(lover_spouse.IsFemale,'spokojená','spokojený')]? Nebo má prostě moc práce? Anebo snad zahřívá postel někomu jinému...?"
 adultery.0002.a: "„Máš někoho jiného, [lover_spouse.GetFirstNameNoTooltip]?“"
 adultery.0002.a.tt: "[lover_spouse.GetTitledFirstNameNoTooltip] bude čelit tvému obvinění z nevěry"
 adultery.0002.b: "Prověřím si to [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 adultery.0002.b.tt: "Pokud skutečně došlo k nevěře, odhalíš ji"
 adultery.0002.b.success: "Úspěšně odhalíš pravdu o milostném životě"
 adultery.0002.b.success.innocent: "[lover_spouse.GetTitledFirstName] je [Select_CString(lover_spouse.IsFemale,'nevinná','nevinný')]"
 adultery.0002.b.failure: "Nenajdeš žádný důkaz nevěry"
 adultery.0002.c: "Neunikne mi jediný pohyb."
 adultery.0002.c.tt: "Tvůj [Concept('spymaster','špehmistr')|E] bude dál sledovat, co [lover_spouse.GetShortUIName] dělá"
 adultery.0002.d: "Nikdy by [Select_CString(lover_spouse.IsFemale,'neznesvětila','neznesvětil')] posvátnost našeho manželství!"
 adultery.0002.d.concubine_or_soulmate: "Takhle by se ke mně nikdy [Select_CString(lover_spouse.IsFemale,'nezachovala','nezachoval')]!"
 adultery.0003.t: "Obvinění"
 adultery.0003.desc: "[spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je v poslední době [Select_CString(spouse.IsFemale,'napjatá','napjatý')], a když konečně zůstaneme o samotě, vyjde najevo proč.\n\n„Prosím, řekni mi pravdu,“ pronese vážně. „Je tu někdo jiný? S někým se scházíš?“"
 adultery.0003.a: "Samozřejmě že ne!"
 adultery.0003.a.tt_lie: "Doufám, že mi to uvěří..."
 adultery.0003.a.tt_truth: "Jak mě vůbec může z něčeho takového podezírat..."
 adultery.0003.b: "[Select_CString(ROOT.Char.IsFemale,'Doufala','Doufal')] jsem, že ti to uniklo..."
 adultery.0003.b.tt: "Možná mi odpustí. Anebo také ne..."
 adultery.0004.desc: "„Jak vůbec můžeš něco takového říct, [spouse.GetFirstNameNoTooltip]? Nikdy bych si nikoho [Select_CString(lover_spouse.IsFemale,'nenašla','nenašel')]!“\n\nKdyž [lover_spouse.GetTitledFirstName] odmítá mé obvinění, působí skutečně rozrušeně."
 adultery.0004.b: "Nezbývá mi než tomu věřit."
 adultery.0004.b.malicious: "Prozatím..."
 adultery.0006.apologetic_start.desc: "[lover_spouse.GetFirstNameNoTooltip] mlčí, jako by se zastavil čas, ale v očích je všechno jasné. Mé obavy se potvrdily. I já na okamžik ztuhnu, jen srdce mi divoce buší.\n\nKdyž se konečně ozve [lover_spouse.GetFirstNamePossessiveNoTooltip] hlas, z očí se zároveň vyhrnou slzy. „Prosím, [lover_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))], odpusť mi. Prosím tě! Já... všechno ti řeknu. "
 adultery.0006.your_lovername.desc: "[Select_CString(sex_partner.IsFemale,'Byla','Byl')] to [sex_partner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]."
 adultery.0006.my_lovername.desc: "[Select_CString(sex_partner.IsFemale,'Byla','Byl')] to [sex_partner.Custom2('MyCharacterIntroductionNoComma', lover_spouse)]."
 adultery.0006.unapologetic_start.desc: "Mé obvinění [lover_spouse.GetFirstNameNoTooltip] zjevně zaskočí, ale šok rychle pomine.\n\n„Tak konečně ti to došlo, #EMP [lover_spouse.Custom2('RelationToMe', SCOPE.sC('spouse'))]#!.“ Z těch slov odkapává jed. „Ano, byl tu někdo jiný. "
 adultery.0006.male_lover.desc: "Byl to bezvýznamný muž. Ani nevím, jak se jmenuje."
 adultery.0006.female_lover.desc: "Byla to bezvýznamná žena. Ani nevím, jak se jmenuje."
 adultery.0006.apologetic_end.desc: "Přísahám, stalo se to jen jednou!“"
 adultery.0006.unapologetic_end.desc: "Stalo se to jen jednou, ale věř mi, s chutí bych to [Select_CString(lover_spouse.IsFemale,'udělala','udělal')] znovu.“"
 adultery.0006.a: "Všichni se dozvědí o tvé zradě, [lover_spouse.Custom2('InsultNounSexual', ROOT.Char)]!"
 adultery.0006.b: "Odpouštím ti. Tentokrát."
 adultery.0006.c: "Když už mezi námi není důvěra, co nám ještě zbývá?"
 adultery.0007.start.desc: "Mé obavy nebyly bezdůvodné. Důkaz [lover_spouse.GetFirstNamePossessiveNoTooltip] nevěry je nezvratný!\n\n"
 adultery.0007.lover_my.desc: "Samé lži, [lover_spouse.Custom2('InsultNoun', ROOT.Char)]! A [sex_partner.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(sex_partner.IsFemale,'skončila','skončil')] v [Select_CString(lover_spouse.IsFemale,'její','jeho')] posteli."
 adultery.0007.lover_herhis.desc: "Samé lži, [lover_spouse.Custom2('InsultNoun', ROOT.Char)]! A [sex_partner.Custom2('HerHisCharacterIntroduction', lover_spouse)] [Select_CString(sex_partner.IsFemale,'skončila','skončil')] v [Select_CString(lover_spouse.IsFemale,'její','jeho')] posteli."
 adultery.0007.male_lover.desc: "Styk s bezvýznamným mužem nízkého původu [Select_CString(lover_spouse.IsFemale,'ji poskvrnil','ho poskvrnil')]."
 adultery.0007.female_lover.desc: "Styk s bezvýznamnou ženou nízkého původu [Select_CString(lover_spouse.IsFemale,'ji poskvrnil','ho poskvrnil')]."
 adultery.0007.end.desc: "Pokud mohu soudit, stalo se to jen jednou. Tváří v tvář té zradě je to ale chabá útěcha..."
 adultery.0008.t: "Odhalení"
 adultery.0008.sex_partner.desc: "Zdálo se mi, že [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] a já jsme po našem malém románku nezanechali jedinou stopu. Přesto [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] nějakým nepochopitelným způsobem všechno [Select_CString(spouse.IsFemale,'zjistila a naše tajemství rozhlásila','zjistil a naše tajemství rozhlásil')] do světa!"
 adultery.0008.no_sex_partner.desc: "Zdálo se mi, že po mém malém románku nezůstala jediná stopa. Přesto [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] nějakým nepochopitelným způsobem všechno [Select_CString(spouse.IsFemale,'zjistila a mé tajemství rozhlásila','zjistil a mé tajemství rozhlásil')] do světa!"
 adultery.0008.a: "[ROOT.Char.Custom('CulturalCurse')|U]!"
 adultery.0009.desc: "[spouse.GetTitledFirstNamePossessive] slzy bolí mnohem víc, než by kdy dokázala krutá slova. Jen sklíčeně stojím, zatímco si tvář zakrývá kapesníkem.\n\n„Já... [Select_CString(spouse.IsFemale,'myslela','myslel')] jsem, že budeme navždy spolu,“ šeptá mezi vzlyky. „Slíbili jsme si to. #EMP Ty#! jsi mi [Select_CString(ROOT.Char.IsFemale,'dala','dal')] slovo, [ROOT.Char.GetFirstNameNoTooltip], a přesto jsi [Select_CString(ROOT.Char.IsFemale,'sdílela','sdílel')] lože s někým jiným. Už ti nikdy nedokážu věřit. Je konec.“"
 adultery.0009.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'taková hlupačka','takový hlupák')]..."
 adultery.1001.t: "Otázka věrnosti"
 adultery.1001.opening: "[mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mother'))], čeká dítě a já bych měl překypovat radostí. V poslední době se však chová podivně a nemohu se zbavit pocitu, že něco není v pořádku.\n\n"
 adultery.1001.default: "Jsem opravdu otcem, jak tvrdí, nebo naši společnou důvěru zradila?"
 adultery.1001.hard_to_believe: "Jen těžko se mi věří, že by mě dokázala takhle zradit. Ale co když přece jen nejsem otcem?"
 adultery.1001.easy_to_believe: "Je až příliš snadné uvěřit, že mě zradila a otcem jejího dítěte je někdo jiný."
 adultery.1001.desc_sadistic: "Klidně by porodila dítě někoho jiného jen proto, aby mě tím mučila."
 adultery.1001.desc_lustful: "Vždycky mě znepokojovalo, že její nenasytný apetit možná nepatří jen mně. Co když je otcem dítěte někdo jiný?"
 adultery.1001.desc_deceitful: "Tvrdí, že jsem otec, ale už tolikrát mi lhala."
 adultery.1001.desc_root_trusting: "Mám podezření, že možná nejsem otcem, ale... Něco takového by přede mnou přece nikdy netajila, ne?"
 adultery.1001.desc_root_lunatic: "Zašeptali mi to. Chápu. Myslím, že chápu. Jak bych mohl být otcem té věci v jejím nitru? Té kruté a děsivé věci?"
 adultery.1001.desc_lunatic: "Tvrdí, že jsem otec, ale také tvrdí, že k ní promlouvají stíny."
 adultery.1001.a: "Musí mi to říct!"
 adultery.1001.a.tt: "Promluvíš si s [mother.GetFirstNameNoTooltip] přímo"
 adultery.1001.b: "Diskrétně to prověřím."
 adultery.1001.b_no_scheme: "Měl bych to prověřit později..."
 adultery.1001.b_cannot_start_scheme: "#F Teď nemám čas se tím zabývat, ale nezapomenu na to...#!"
 adultery.1001.c: "Musím být otcem. Určitě."
 adultery.1001.c.tt: "#F Proč se trápit něčím, co možná vůbec není pravda?#!"
 adultery.1002.t: "Plíživé podezření"
 adultery.1002.desc_paranoid: "„Vím, že to dítě není moje!“ [spouse.Custom('WifeHusbandPossessive')] oči planou obviněním. „Kdo to je?“ naléhá [adultery_spouse.GetTitledFirstName]. „Kdo?“"
 adultery.1002.desc_chaste: "„Je dítě, které nosíš, skutečně moje?“ ptá se [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]. „Víš, že má oddanost vždy byla... Jako [spouse.GetWomanMan]... Především je tu [spouse.GetFaith.HighGodName].“"
 adultery.1002.desc_craven: "„Je... Je to dítě opravdu moje?“ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] vypadá, jako by se odpovědi [Select_CString(adultery_spouse.IsFemale,'bála','bál')]."
 adultery.1002.desc_vengeful: "„Je dítě, které nosíš, opravdu moje?“ ptá se [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))]. „[adultery_spouse.GetFaith.HighGodName] je mi svědkem, jestli mi lžeš...“"
 adultery.1002.desc_compassionate: "„Je dítě, které nosíš, skutečně moje?“ ptá se [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))]. „Ať už jsi udělala cokoli, nechci, abys trpěla.“"
 adultery.1002.worried: "„Řekni mi, je opravdu moje?“ [adultery_spouse.GetTitledFirstName] působí zdrceně. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))] mi ustaraně hledí do očí."
 adultery.1002.desc_sadistic: "„Snad nečekáš dítě s někým jiným, s někým, kdo je stejně jako já [spouse.GetWomanMan]?“ [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] si mě pozorně měří. „Víš přece, že by to pro tebe bylo skoro stejně zlé jako mi lhát, že ano?“ [Select_CString(spouse.IsFemale,'Usměje se','Usměje se')]."
 adultery.1002.desc_lunatic: "„Je to dítě moje?!“ [adultery_spouse.GetTitledFirstNamePossessive] oči divoce těkají. „Oni mi to řeknou, však víš!“"
 adultery.1002.conclusion: "\n\n[ROOT.Char.Custom2('QuirkPersonalTowardsOther', SCOPE.sC('adultery_spouse'))]."
 adultery.1002.a: "Musím ti říct pravdu."
 adultery.1002.a.confession_tt: "[adultery_spouse.GetShortUIName|U] se dozví pravdu"
 adultery.1002.b: "Samozřejmě že je tvoje, [adultery_spouse.GetFirstNameNoTooltip]!"
 adultery.1002.b.tt: "#F Snad už se nebude dál vyptávat.#!"
 adultery.1002.c: "Samozřejmě že je tvoje, [adultery_spouse.GetFirstNameNoTooltip]!"
 adultery.1002.c.tt: "#F Tomu přece musí uvěřit!#!"
 adultery.1003.desc: "„Samozřejmě že je dítě tvoje.“ [mother.GetFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('mother'))]. „Proč tě vůbec napadlo něco jiného?“"
 adultery.1003.a: "Jen jsem to potřeboval slyšet přímo od ní."
 adultery.1003.a.tt: "#F Je uklidňující to vědět.#!"
 adultery.1003.b: "Nevěřím jí!"
 adultery.1003.duel_success: "Odhalíš pravdu"
 adultery.1003.duel_success_tt: "Pokud je otcem dítěte [mother.GetFirstNamePossessiveNoTooltip] někdo jiný, najdeš důkazy o její nevěře"
 adultery.1003.duel_failure: "Spolčenci odhaleni"
 adultery.1004.default_reaction: "[mother.GetTitledFirstNamePossessive] oči se zalijí slzami."
 adultery.1004.reaction_callous: "[mother.GetTitledFirstName] na mě hledí bez jediného hnutí ve tváři."
 adultery.1004.reaction_sadistic: "[mother.GetTitledFirstName] se na mě sarkasticky usměje."
 adultery.1004.reaction_gluttonous: "[mother.GetTitledFirstName] se snaží schovat oči plné slz za sladkou houskou."
 adultery.1004.reaction_deceitful: "„Už mě tak unavuje lhát.“ [mother.GetTitledFirstName] vypadá, že se každou chvíli rozpláče."
 adultery.1004.reaction_compassionate: "„Měl by ses posadit, drahý.“ V očích [mother.GetTitledFirstName] je upřímná starost."
 adultery.1004.reaction_honest: "„Nechci lhát tobě ani nikomu jinému.“ [mother.GetTitledFirstNamePossessive] oči jsou zarudlé od pláče."
 adultery.1004.reaction_lunatic: "[mother.GetTitledFirstName] na mě hledí s nezvykle jasnou myslí. Pak se jí pohled opět zakalí. „Už ti to pošeptali?“"
 adultery.1004.reaction_positive_opinion: "„Musíš pochopit, že jsem ti nikdy nechtěla ublížit.“ Po [mother.GetTitledFirstNamePossessive] tváři stékají slzy."
 adultery.1004.reaction_negative_opinion: "[mother.GetTitledFirstNamePossessive] rty se v nehybné tváři stáhnou do tenké čárky. „Vlastně se mi skoro ulevilo.“"
 adultery.1004.default_admission: "\n\nPo dlouhém mlčení to nakonec přizná. „[real_father.GetTitledFirstName] je skutečným otcem mého dítěte.“"
 adultery.1004.a: "Jak je to možné? Potřebuji čas na rozmyšlenou."
 adultery.1004.a.tt: "Tajemství si zatím necháš pro sebe."
 adultery.1004.b: "Tohle tajemství musí zůstat mezi námi!"
 adultery.1004.c: "O tvé nevěře se dozvědí všichni!"
 adultery.1006.t: "[Select_CString(adultery_spouse.IsFemale,'Ona','On')] to ví"
 adultery.1006.very_positive_opinion: "„Ano, [real_father.GetTitledFirstName] je otcem.“ Skoro se mi ulevilo, že [adultery_spouse.GetTitledFirstName] už zná pravdu."
 adultery.1006.very_negative_opinion: "„Ano, [real_father.GetTitledFirstName] je otcem.“ Bylo až příjemné vpálit tu pravdu do očí."
 adultery.1006.fallback: "„Ano, [real_father.GetTitledFirstName] je otcem...“ Nezbylo než se přiznat."
 adultery.1006.conclusion: "\n\nAlespoň to ví jen [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))]."
 adultery.1006.a: "Co bude teď?"
 adultery.1009.t: "Podezření rozptýleno"
 adultery.1009.desc: "Zdá se, že mé obavy byly neopodstatněné. Ať se mí špehové snažili sebevíc, nenašli nic, co by naznačovalo, že [mother.GetTitledFirstName] byla nevěrná.\n\nBohužel se o mém podezření dozvěděla a je mnou hluboce zklamaná."
 adultery.1009.a: "Samozřejmě že jsem ti celou dobu věřil, drahá!"
 adultery.1009.a.flavor_tt: "Jen jsem si musel být jistý."
 adultery.2001.t: "[Select_CString(adultery_child.IsFemale,'Má dcera','Můj syn')]"
 adultery.2001.desc_dislike: "Někdy si nad [adultery_child.GetTitledFirstName] lámu hlavu. Ty řeči, ta protivná povaha, ten neuvěřitelný talent lézt mi na nervy... Je mi stejně [Select_CString(adultery_child.IsFemale,'cizí','cizí')] jako kterýkoli obyčejný poddaný."
 adultery.2001.desc_suspicious_mother: "[adultery_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))], mi o našem dítěti něco tají, tím jsem si jistý! Ty kradmé pohledy, přehnaná ochranitelskost vůči [adultery_child.GetTitledFirstName], to neustálé vyhýbání se mým otázkám..."
 adultery.2001.desc_mother_lover: "Od chvíle, kdy jsem zjistil, že [adultery_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))], porušila naši věrnost, hledím s podezřením na každého v její blízkosti. Na každého dvořana, který projde kolem, dokonce i na vlastní potomstvo..."
 adultery.2001.desc_fallback: "Kdykoli přijde řeč na [adultery_child.GetTitledFirstName], [adultery_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))], se mi začne vzdalovat. Zpočátku jsem tomu nevěnoval pozornost, ale teď začínám mít podezření, že [adultery_spouse.GetFirstName] něco tají."
 adultery.2001.desc_end: "\n\nNení lehké připustit si, že [adultery_child.GetTitledFirstName] možná není mé dítě, ale pochybnosti mě užírají."
 adultery.2001.a: "Musím mít jistotu!"
 adultery.2001.b: "Samozřejmě že je to mé dítě."
 adultery.2001.a.tt: "Pokud [adultery_child.GetFirstNameNoTooltip] není mým vlastním dítětem:"
 adultery.2001.a.duel_success: "Úspěšně špehuji svou rodinu"
 adultery.2001.a.duel_success.tooltip: "Odhalíš pravdu, ať už je jakákoli"
 adultery.2001.a.duel_failure: "Při pátrání po pravdě budu odhalen"
 adultery.2002.t_a: "Naše dítě"
 adultery.2002.desc_no_child: "Zahradou prochází [adultery_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))], a já zamávám. Odpovědí je jen okázalé odvrácení.\n\nMé původní obavy z nevěry byly zřejmě neopodstatněné. [adultery_spouse.GetFirstNameNoTooltip] však na mé podezření jen tak nezapomene."
 adultery.2002.desc_not_born: "Zahradou prochází [adultery_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))], a já zamávám. Odpovědí je jen okázalé odvrácení.\n\nMé původní obavy z nevěry byly zřejmě neopodstatněné. [adultery_spouse.GetFirstNameNoTooltip] však na mé podezření jen tak nezapomene."
 adultery.2002.desc_spouse: "Zahradou prochází [adultery_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))], a já zamávám. Odpovědí je jen okázalé odvrácení.\n\nMé původní pochybnosti o původu [adultery_child.GetTitledFirstName] byly zřejmě neopodstatněné. Na mé podezření se však jen tak nezapomene."
 adultery.2002.desc: "[adultery_child.GetTitledFirstName] prochází zahradou. Zamávám a snažím se zahnat své chmurné pochybnosti.\n\nMé původní pochybnosti o původu dítěte byly zřejmě neopodstatněné. Na mé podezření se však jen tak nezapomene."
 adultery.2002.a_spouse: "Jestli si myslí, že přede mnou něco utají, tak se mýlí!"
 adultery.2002.a_unborn: "Přede mnou nic neutají!"
 adultery.2002.a: "Přede mnou nic neutají!"
 adultery.2002.a_spouse_tt: "#F Budu si dávat ještě větší pozor!#!"
 adultery.2002.a.tt_unborn: "#F Ještě zpřísním dohled!#!"
 adultery.2002.a.tt: "#F Ještě zpřísním dohled!#!"
 adultery.2002.b: "To je taková úleva!"
 adultery.2003.desc: "„Ano, ot... [ROOT.Char.GetFirstNameNoTooltip], [real_father.GetTitledFirstName] je můj skutečný rodič!“\n\nBolest z toho, že mě [adultery_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('adultery_spouse'))], [Select_CString(adultery_spouse.IsFemale,'zradila','zradil')], téměř přebíjí úleva, že konečně znám pravdu. A pomyslet, že [adultery_spouse.GetTitledFirstName] i [adultery_child.GetFirstName] to přede mnou celou dobu tajili..."
 adultery.2003.a: "Jak mě mohli takhle podvádět?!"
 adultery.2006.t: "Můj původ"
 adultery.2006.desc: "[owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], [Select_CString(owner.IsFemale,'zjistila','zjistil')], že mým skutečným rodičem je [real_father.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], a ne [owner.GetTitledFirstName]! Alespoň to ještě není všeobecně známé... zatím."
 adultery.2006.a: "Jak se teď [Select_CString(owner.IsFemale,'jí','mu')] podívám do očí?"
 adultery.2008.t: "[Select_CString(adultery_child.IsFemale,'Má dcera?','Můj syn?')]"
 adultery.2008.desc: "Ten strach, který ve mně celou dobu narůstal, byl oprávněný!\n\nMí špehové odhalili pravdu: [adultery_child.GetTitledFirstName] není mé dítě. Nedovolený poměr spolu měli [adultery_spouse.GetFirstName] a [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)] a právě z něj se toto dítě narodilo!"
 adultery.2008.a: "Ať se to všichni dozvědí. Tohle není moje dítě!"
 adultery.2008.b: "Potřebuji čas na rozmyšlenou."
 adultery.2008.b.tt: "Zatím si to necháš pro sebe"
 adultery.2009.t: "[Select_CString(adultery_child.IsFemale,'Má dcera?','Můj syn?')]"
 adultery.2009.desc: "Kamkoli [adultery_child.GetTitledFirstName] [Select_CString(adultery_child.IsFemale,'zamířila','zamířil')], mí špehové byli v patách, ale nenašli nic, co by dávalo důvod pochybovat o původu dítěte.\n\n[adultery_child.GetFirstNameNoTooltip] se však stále nedokáže smířit s tím, že jsem vůbec něco takového podezíral."
 adultery.2009.a: "Takže je to přece jen moje dítě."
 adultery.3001.t: "Tajemství"
 adultery.3001.desc: "„[Select_CString(ROOT.Char.IsFemale,'Dcero moje','Synu můj')], mé drahé dítě, musela jsem ti to říct! Dokážeš mi někdy odpustit?“\n\nMá matka klečí na zemi, po tváři jí stékají slzy a já nevím, co říct."
 adultery.3001.desc_father: "[father.GetFirstName] není můj pokrevní příbuzný, přestože jsem celý život [Select_CString(ROOT.Char.IsFemale,'vyrůstala','vyrůstal')] v domnění, že je to můj otec. Mým skutečným otcem je [real_father.GetTitledFirstName]!"
 adultery.3001.desc_no_father: "Mým skutečným rodičem je [real_father.GetTitledFirstName]!"
 adultery.3001.a: "[Select_CString(parent_with_secret.IsFemale,'Jak mi to mohla vlastní matka udělat?!','Jak mi to mohl vlastní otec udělat?!')]"
 adultery.3001.a.tt: "#F Alespoň to ještě není všeobecně známé...#!"
 adultery.4001.t: "Nevěra: [adultery_spouse.GetTitledFirstNameNoTooltip]"
 adultery.4001.start.desc: "[adultery_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', adultery_spouse)],"
 adultery.4001.unsuccessful_sex_attempt.desc: "[Select_CString(adultery_spouse.IsFemale,'se pokusila někoho svést','se pokusil někoho svést')]?! A tím někým byl [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]?!"
 adultery.4001.fur.desc: "Říká se, že [adultery_spouse.GetTitledFirstName] [Select_CString(adultery_spouse.IsFemale,'přišla','přišel')] do komnat, kde pobývá [sex_partner.GetTitledFirstName], jen v kožešinách, a vzápětí [Select_CString(adultery_spouse.IsFemale,'byla vyhozena','byl vyhozen')]!"
 adultery.4001.laugh.desc: "Říká se, že když [adultery_spouse.GetTitledFirstName] [Select_CString(adultery_spouse.IsFemale,'pozvala','pozval')] [sex_partner.GetTitledFirstName] do své postele, [sex_partner.GetTitledFirstName] se tomu jen [Select_CString(sex_partner.IsFemale,'vysmála','vysmál')]!"
 adultery.4001.threw.desc: "Říká se, že sotva zůstali o samotě, [adultery_spouse.GetTitledFirstName] [Select_CString(adultery_spouse.IsFemale,'se bez váhání nabídla','se bez váhání nabídl')], ale [sex_partner.GetFirstNameNoTooltip] tu představu nedokázal[Select_CString(sex_partner.IsFemale,'a','')] vystát!"
 adultery.4001.sex_partner.desc: "[Select_CString(adultery_spouse.IsFemale,'smilnila','smilnil')]?! A s kým? [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]?!"
 adultery.4001.commoner.desc: "[Select_CString(adultery_spouse.IsFemale,'smilnila','smilnil')] s obyčejným člověkem nízkého původu?!"
 adultery.4001.servant.desc: "[Select_CString(adultery_spouse.IsFemale,'smilnila','smilnil')] s někým ze služebnictva?!"
 adultery.4001.another_gender.desc: "A navíc [unknown_sex_partner.GetWomanMan]!"
 adultery.4001.bed.desc: "Přímo v naší vlastní posteli, pokud se těm řečem dá věřit!"
 adultery.4001.mare.desc: "A navíc ve stáji, jako nějaká klisna!"
 adultery.4001.stallion.desc: "A navíc ve stáji, jako nezkrotný hřebec!"
 adultery.4001.deer.desc: "A navíc v lese, jako jelen v říji!"
 adultery.4001.elephant.desc: "A navíc v lese, jako slon v říji!"
 adultery.4001.desk.desc: "Přímo na mém vlastním stole, pokud se těm řečem dá věřit!"
 adultery.4001.alley.desc: "A navíc ve špinavé uličce, úplně bez studu!"
 adultery.4001.table: "Přímo na stole ve velkém sále, pokud se těm řečem dá věřit!"
 adultery.4001.kitchen.desc: "Dole v kuchyni, pokud se těm řečem dá věřit!"
 adultery.4001.privy.desc: "A navíc v temném puchu latríny, pokud se těm řečem dá věřit!"
 adultery.4001.end.desc: "\n\nKdyž dojde na konfrontaci, [adultery_spouse.GetFirstName] trvá na tom, že „se to stalo jen jednou“, jako by tím zrada bolela o něco méně!"
 adultery.4001.a: "Jak mám ještě někdy věřit?"
 adultery.4001.b: "Stráže! Zatkněte! Je to [adultery_spouse.Custom2('InsultNounSexual', ROOT.Char)]!"
 adultery.4001.b2: "Tohle budeš litovat! Stráže!"
 adultery.4001.c: "Tak či onak se musím pokusit odpustit."
