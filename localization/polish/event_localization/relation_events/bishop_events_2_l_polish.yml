l_polish:
 bishop.2001.t: "Právo duchovenstva"
 bishop.2001.desc.a: "[scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] zuří.\n\nTvrdí, že [scoped_prisoner.GetTitledFirstName] nesmí zůstat v mém žaláři. „Je to [scoped_prisoner.GetWomanMan] v duchovní službě! Ať už má na svědomí cokoli, žádný světský vládce nemá pravomoc nad duchovenstvem vynášet rozsudky!“"
 bishop.2001.desc.b: "[scoped_prisoner.GetTitledFirstName] stojí přede mnou v okovech. Na stole leží [scoped_prisoner.GetFaith.ReligiousText]. Pevným hlasem zazní jedna z pasáží a pak přijde čekání na rozsudek. [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] stojí hned vedle a věnuje mi pohrdavý pohled. „Ukázalo se, že [scoped_prisoner.GetFirstNameNoTooltip] patří k duchovenstvu. Proto musí přejít pod jeho dohled.“"
 bishop.2001.desc.c: "Na stole leží [scoped_prisoner.GetFaith.ReligiousText]. [scoped_prisoner.GetTitledFirstName] třesoucím se hlasem odříká jednu z pasáží a pak zmlkne.\n\n[scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] stojí hned vedle a věnuje mi pohrdavý pohled. „Ukázalo se, že [scoped_prisoner.GetFirstNameNoTooltip] patří k duchovenstvu. Proto musí přejít pod jeho dohled.“"
 bishop.2001.a: "Jistě dokáže odříkat i pasáž, kterou vyberu já?"
 tooltip.bishop.2001.a.success: "[scoped_prisoner.GetTitledFirstName] odříká pasáž správně"
 bishop.2001.success.a.desc.tt: "[scoped_prisoner.GetTitledFirstName] přechází pod dohled duchovenstva."
 tooltip.bishop.a.2001.fail: "[scoped_prisoner.GetTitledFirstName] nedokáže přečíst druhý verš"
 bishop.2001.failure.a.desc.tt: "[scoped_prisoner.GetTitledFirstName] se vrací do žaláře."
 bishop.2001.b: "Nenecháváš mi na vybranou."
 bishop.2001.c: "Hlavně cestou ven nezakopni..."
 tooltip.bishop.c.2001.success: "[scoped_prisoner.GetTitledFirstName] potká nehoda"
 bishop.2001.success.c.desc.tt: "Po propuštění [scoped_prisoner.GetFirstName] zemře."
 tooltip.bishop.c.2001.fail: "[scoped_prisoner.GetTitledFirstName] odejde bez úhony"
 bishop.2001.failure.c.desc.tt: "[scoped_prisoner.GetFirstName] unikne mým vrahům!"
 bishop.2001.d: "[scoped_prisoner.GetTitledFirstName] je v mé moci a v mém žaláři také zůstane!"
 bishop.2002.t: "Má [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] rodina"
 bishop.2002.desc.b: "Na druhém konci sálu stojí [scoped_relative.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_relative'))]. Zvednu ruku na pozdrav, ale odpovědí je jen rozpačitý pohled a rychlý ústup."
 bishop.2002.desc.c: "Rozhlížím se kolem jídelního stolu a snažím se rozpoutat rozhovor, ale setkávám se jen s rozpačitými pohledy a odvrácenými tvářemi."
 bishop.2002.desc.a: "\n\nVlastní rodina se obrátila proti mně kvůli tomu [scoped_bishop.Custom2('InsultAdjective', ROOT.Char)] [scoped_bishop.Custom2('InsultNoun', ROOT.Char)], kterým není nikdo jiný než [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName]. Při duchovních radách teď příbuzným pravidelně našeptává lži. Tvrdí, že jako [ROOT.Char.GetTitleTierName] vládnu bezbožně a že za prokletím našeho rodu stojí [ROOT.GetCharacter.GetFaith.HighGodName]."
 bishop.2002.a: "[scoped_bishop.GetFirstName] si také vyslechne pár věcí..."
 tooltip.bishop.2002.a.success: "Přesvědčíš své příbuzné, že [scoped_bishop.GetTitledFirstName] lže"
 bishop.2002.success.a.desc.tt: "Odhalíš pokus, kterým se tě [scoped_bishop.GetFirstName] snaží pomluvit."
 tooltip.bishop.a.2002.fail: "Tvou rodinu tvá slova nepřesvědčí"
 bishop.2002.failure.a.desc.tt: "Tví příbuzní tě odmítnou vyslechnout."
 bishop.2002.b: "Pomohlo by veřejné pokání?"
 bishop.2002.c: "[scoped_bishop.GetCouncilTitle|U] nebude podkopávat mou autoritu!"
 bishop.2003.t: "Kněz lidu"
 bishop.2003.desc: "Ani jeden den se neobejde bez posměšků, kterými mě [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] častuje během kázání.\n\nTo je ale [scoped_bishop.Custom2('InsultNoun', ROOT.Char)]! [scoped_bishop.GetFirstName] neustále hlásá, že mým pánem je [ROOT.Char.GetFaith.DevilName], a neustane, dokud proti mně nepoštve rolníky."
 bishop.2003.a: "[scoped_bishop.GetFirstName] se po daru a několika ústupcích jistě uklidní..."
 bishop.2003.b.a: "Mám všechno naprosto pod kontrolou!"
 bishop.2003.b.b: "Pche. Co nejhoršího se může stát?"
 bishop.2003.c: "Nestrpím neposlušnost vlastních vazalů!"
 bishop.2003.c.infidel: "[scoped_bishop.GetFirstName] musí jednou provždy zmlknout."
 bishop.2002.everyrelative.custom: "Každý další [Concept('family_member','člen mé rodiny')|E], který vyznává [scoped_bishop.GetFaith.GetName]"
 bishop.2002.everypiousrelative.custom: "Každý další zbožný [Concept('family_member','člen mé rodiny')|E], který vyznává [scoped_bishop.GetFaith.GetName]"
 bishop.2003.countyunrest.custom: "Každé [Concept('county','hrabství')|E] v mé [Concept('domain','doméně')|E], které vyznává [scoped_bishop.GetFaith.GetName]"
 bishop.2003.everytheocrat.custom: "Každý [Concept('theocratic','teokratický')|E] vazal vyznávající [scoped_bishop.GetFaith.GetName]"
 bishop.2004.t: "V očích horlivců"
 bishop.2004.desc: "[scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] si v poslední době při každém kázání stěžuje na můj údajný „nedostatek zbožnosti“.\n\nDokonce během kázání na mou adresu zazní „[root_scope.Custom2('InsultNoun', SCOPE.sC('scoped_bishop'))]“ a obvinění z bezbožnosti. Mí horlivější vazalové tomu navíc začínají naslouchat..."
 bishop.2004.theologian: "To jsou nestoudné lži a pomluvy!"
 bishop.2004.a: "Možná by pomohl další „dar z dobré vůle“..."
 bishop.2004.b: "Pche! Ať si věří, čemu chtějí."
