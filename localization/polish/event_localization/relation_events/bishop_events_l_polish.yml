l_polish:
 bishop.1001.opening: "[bishop.Custom2('AppropriateGreeting', ROOT.Char)]"
 bishop.1001.desc: "Je mou povinností oznámit ti, že byly odhaleny nezvratné důkazy, podle nichž jste ty a [spouse.GetTitledFirstName] pokrevní příbuzní a vaše manželství je proto nepřípustné.\n\n"
 bishop.1001.desc.actually_incestuous: "Pokud tento bezbožný svazek okamžitě ukončíš, zůstane tato informace jen mezi námi."
 bishop.1001.desc.made_up: "Pokud tento #EMP očividně#! bezbožný svazek okamžitě ukončíš, zůstane tato... #EMP nezvratná#! informace jen mezi námi."
 bishop.1001.a: "Samozřejmě."
 bishop.1001.a.tt: "@warning_icon! #X Ty a [spouse.GetUIName] se rozvedete#!"
 bishop.1001.b: "Tak očividná lež naše manželství nerozbije!"
 bishop.1001.b.success: "Prokážeš, že obvinění je smyšlené"
 bishop.1001.b.failure: "Obvinění je skutečně nezvratné"
 bishop.1001.c: "Taková lež... [bishop.GetTitledFirstNameNoTooltip] si vyslechne, co si o tom myslím."
 bishop.1001.c.success: "Úspěšně obhájíš posvátnost svého manželství"
 bishop.1001.c.failure: "[bishop.GetTitledFirstNameNoTooltip] se nenechá přesvědčit"
 bishop.1001.d: "Tohle všechno by se jistě dalo... zapomenout?"
 bishop.1011.desc_opening: "Tvá účast ve frakci [faction.GetNameNoTooltip], jejímž cílem je [targeting.GetTitledFirstName], je nanejvýš nevhodná. Pokud z ní nevystoupíš, budu nucen podniknout rázná opatření."
 bishop.1011.desc_cannibal: "\n\nMimochodem, [cannibal_food.GetTitledFirstName] vypadá opravdu chutně. Byla by #EMP škoda#!, kdyby se něco přihodilo..."
 bishop.1011.desc_beating: "\n\nNedaleko se potuluje skupina horlivců, kteří rozdávají boží tresty bez velkého slitování. [to_beat_up.GetTitledFirstName] se přece pořád občas vydává do ulic o samotě, že...?"
 bishop.1011.a: "Nebudu pokoušet hněv duchovních."
 bishop.1011.b: "Tvé řeči mi nemohou ublížit!"
 bishop.1011.b.tt: "Ignoruješ sotva skrývané výhrůžky"
 bishop.1011.b.outcome: "Krvavý nález v ulicích"
 all_my_theocratic_vassals: "Všichni moji teokratičtí vazalové"
 bishop.1011.c: "Dovol mi vysvětlit své důvody..."
 bishop.1011.c.success_vassal: "Mé argumenty zaberou natolik, že [bishop.GetTitledFirstNameNoTooltip] získá pro věc další podporu mezi duchovenstvem"
 bishop.1011.c.success: "[bishop.GetTitledFirstNameNoTooltip] chápe mé pohnutky"
 bishop.1011.c.failure: "[bishop.GetTitledFirstNameNoTooltip] to nepovažuje za přesvědčivé"
 bishop.1011.c.failure.tt: "Následují rázná opatření"
 bishop.1012.title: "Záhadné zmizení"
 bishop.1012.desc: "[cannibal_food.GetTitledFirstName] beze stopy zmizí. Zůstane po [Select_CString(cannibal_food.IsFemale,'ní','něm')] jen kaluž krve..."
