l_polish:
 friendship.0001.t: "Odcizení"
 friendship.0001.desc_opening: "Časy se mění a lidé s nimi. Někdy se i ti nejbližší začnou zdát jako cizinci.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip],“ [friend_in_question.Custom2('MyCharacterIntroduction', ROOT.Char)] se smutně usměje."
 friendship.0001.desc_murder: "„To, že jsi někoho [Select_CString(ROOT.Char.IsFemale,'zavraždila','zavraždil')]... Mám pocit, že z našeho přátelství už nic nezbylo.“"
 friendship.0001.desc: "„Mám pocit, že z našeho přátelství už nic nezbylo.“"
 friendship.0001.a: "Tak už to chodí."
 friendship.0001.b: "Ale... vzpomeň si na všechny ty krásné chvíle!"
 friendship.0001.b.tt: "Dá vašemu vztahu ještě jednu šanci"
 friendship.0002.t: "Odcizení"
 friendship.0002.desc: "Časy se mění a lidé s nimi. Někdy se i ti nejbližší začnou zdát jako cizinci.\n\nJe jasné, že přátelství mezi námi je u konce."
 friendship.0002.a: "Tak už to chodí."
 friendship.0003.t: "Něco víc"
 friendship.0003.desc_intro: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend_as_potential_lover'))] "
 friendship.0004.desc_intro: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_friend'))] "
 friendship.0003.desc: "[friend_as_potential_lover.GetTitledFirstName] pro mě znamená opravdu hodně. Často se mi vrací do myšlenek a někdy téměř nedokážu snést vzdálenost mezi námi.\n\nJe to jen důkaz hloubky našeho přátelství, nebo je v tom něco víc?"
 friendship.0003.a: "Napíšu. Vždycky umí dobře poradit."
 friendship.0003.goes_for_it_tooltip: "[friend_as_potential_lover.GetTitledFirstName] se dozví o tvých citech"
 friendship.0003.b: "Ne. Jsme přátelé a nic víc."
 friendship.0004.desc: "[first_friend.GetTitledFirstName] pro mě znamená opravdu hodně. Často se mi vrací do myšlenek a někdy téměř nedokážu snést vzdálenost mezi námi.\nJe to jen důkaz hloubky našeho přátelství, nebo je v tom něco víc?"
 friendship.0004.a: "Ach, tuhle touhu už nemohu dál popírat!"
 friendship.0004.goes_for_it_tooltip: "Rozhodneš se otevřeně vyznat své city"
 friendship.0004.b: "Ne. Jsme dobří přátelé a nic víc."
 friendship.0005.t: "Citlivé odmítnutí"
 friendship.0005.desc: "Ačkoli se snažím mluvit neurčitě, [friend_as_potential_lover.GetTitledFirstName] jako vždy přesně pochopí, co se snažím říct. Odpověď je tak jemná, tak plná péče, a přesto tolik bolí.\n\nJsou v tom silné city, ale jen přátelské."
 friendship.0005.a: "Snažím se, aby na mně nebylo nic znát. „Ach, to bylo nedorozumění.“"
 friendship.0005.b: "Proč mě odstrkuješ, když vím, že to cítíš stejně, [friend_as_potential_lover.GetFirstNameNoTooltip]?"
 friendship.0005.c: "I v tom je krása."
 friendship.0007.t: "Když náklonnost přeroste ve vášeň"
 friendship.0007.desc: "[friend_as_potential_lover.GetTitledFirstName] stojí přede mnou a srdce mi buší, když natáhnu ruku k něžnému doteku. Už předem vím, že neucukne.\n\nV našem objetí je víc lásky, než jsem kdy poznal."
 friendship.0007.a: "Ach, [friend_as_potential_lover.GetFirstNameNoTooltip]!"
 friendship.0008.t: "Když náklonnost přeroste ve vášeň"
 friendship.0008.desc: "[first_friend.GetTitledFirstName] stojí přede mnou a srdce mi buší, když natáhnu ruku k něžnému doteku. Už předem vím, že neucukne.\n\nV našem objetí je víc lásky, než jsem kdy poznal."
 friendship.0008.a: "Ach, [first_friend.GetFirstNameNoTooltip]!"
 friendship.0009.t: "Co mohlo být"
 friendship.0009.desc: "[friend_as_potential_lover.GetFirstName] už není mezi živými. Od té doby trávím mnoho pozdních večerů o samotě a vzpomínám na věrnost, přátelství a vřelost, které nás provázely až do konce. Nemohu přestat přemýšlet nad tím, co mohlo být, kdyby nám osud dopřál více času."
 friendship.0009.a: "Odpočívej v pokoji, [Select_CString(friend_as_potential_lover.IsFemale,'drahá','drahý')] [friend_as_potential_lover.GetFirstNameNoTooltip]"
 friendship.0010.t: "Odcizení"
 friendship.0010.desc: "[best_friend.GetTitledFirstName] naslouchá mému vyprávění o snech s naprosto zmateným výrazem. Taková reakce mě zaskočí. Vždycky tu přece mělo být pochopení a opora.\n\nPřesto mám někdy při našich setkáních pocit, jako by přede mnou stál někdo úplně cizí."
 friendship.0010.a: "Musíme na tom zapracovat a obnovit naše přátelství!"
 friendship.0010.b: "Už to nestojí za tu námahu."
 friendship.0010.a.success: "Urovnáš váš vztah"
 friendship.0010.a.failure: "Tvá snaha vyjde naprázdno"
 friendship.0010.a.success.message: "[best_friend.GetTitledFirstName] a já zůstáváme nejlepšími přáteli."
 friendship.0010.a.failure.message: "Nepodařilo se mi napravit náš vztah."
 friendship.0011.t: "Odcizení"
 friendship.0011.desc: "Konec přichází pomalu a bez velkého dramatu, ale stejně nevyhnutelně jako plynutí času. Kdysi se zdálo, že naše přátelství vydrží navždy. Dnes se [other_best_friend.GetTitledFirstName] rozpačitě omlouvá a mě to vůbec nepřekvapuje."
 friendship.0011.a: "Prožili jsme spolu krásné chvíle, ale je čas nechat to být."
 friendship.0014.t: "Zrada"
 friendship.0014.desc: "Po tom všem, čím jsme spolu prošli, stále nemohu uvěřit tomu, co [friend_to_rival.GetTitledFirstName] provádí.\nJe to zrada každého přátelského gesta, které jsme si kdy projevili. Ba co víc, je to zrada samotného našeho přátelství! Kdysi jsme spolu lámali chléb, ale teď ze mě [friend_to_rival.GetTitledFirstName] má nepřítele na celý život."
 friendship.0014.a: "[friend_to_rival.GetFirstName] za to zaplatí!"
 friendship.0015.opening: "[original_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 friendship.0015.desc: "Zříkám se přátelství, které jsi tak lehkomyslně [Select_CString(ROOT.Char.IsFemale,'zesměšnila','zesměšnil')]!\nVšechny tvé sliby a gesta nakonec skončily hanbou... Když teď vím, [Select_CString(ROOT.Char.IsFemale,'jaká','jaký')] doopravdy jsi, vlastně mě to nemělo překvapit.\n\nZa tohle utrpení si můžeš [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 friendship.0015.a: "Tady jsi za hlupáka ty, [original_friend.GetFirstNameNoTooltip]."
 friendship.0018.t: "Více přátel než času"
 friendship.0018.desc: "[ROOT.GetCharacter.Custom('friendship_metaphor_with_tending')].\nS tolika přáteli roztroušenými po světě sotva stíhám udržovat kontakt alespoň prostřednictvím dopisů, natož jim věnovat pozornost, kterou si zaslouží.\nMožná by bylo snazší nechat někoho... vzdálit se."
 friendship.0018.a: "„[friend_1.GetTitledFirstNameNoTooltip]... Mrzí mě, že ti musím sdělit nepříjemnou zprávu...“"
 friendship.0018.b: "„[friend_2.GetFirstNameNoTooltip]... Vždycky ses ke mně [Select_CString(friend_2.IsFemale,'chovala','choval')] dobře, ale...“"
 friendship.0018.c: "„[friend_3.GetFirstNameNoTooltip]... Není to tebou, je to mnou...“"
 friendship.0018.d: "Nezklamu jediného ze svých přátel!"
 friendship.0018.e: "Ale ne, tohle zvládnu."
 friendship.0019.t: "Konec korespondence"
 friendship.0019.desc: "Už dlouho čekám, kdy [first_friend.GetTitledFirstName] pošle další dopis, ale nic nepřichází. Posílám vlastní zprávy, avšak bez jediné odpovědi.\nNabízí se nevyhnutelný závěr, že naše přátelství už nestojí za čas ani pozornost."
 friendship.0019.a_1: "[first_friend.GetFirstNameNoTooltip]... V nouzi bych ti přece [Select_CString(ROOT.Char.IsFemale,'odpověděla.','odpověděl.')]"
 friendship.0019.a_2: "[first_friend.GetFirstNameNoTooltip]... Ani ode mě to nebylo zrovna přátelské."
 friendship.1002.opening: "[sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 friendship.1002.desc: "Přijmi prosím tento dar jako projev vděčnosti za naše trvalé přátelství."
 friendship.1002.a: "Ať naše přátelství navždy vzkvétá!"
 friendship.1003.desc: "Mí lovci chytili živého jelena a jeho ladnost a majestátnost mi připomněly tebe!\n\nPřijmi jej prosím jako symbol našeho věčného přátelství!"
 friendship.1003.a: "Ať se prohání po zahradách!"
 friendship.1003.b: "To bude prvotřídní zvěřina..."
 garden_stag_modifier: "Jelen v zahradě"
 impromptu_venison_feast_modifier: "Neplánovaná zvěřinová hostina"
 friendship.1004.desc: "Jako projev vděčnosti za naše trvalé přátelství se s tebou chci podělit o něco, co by tě mohlo zajímat.\n\nNalož s touto informací, jak uznáš za vhodné."
 friendship.1004.a: "Jak štědré!"
 friendship.1006.t: "Podpora"
 friendship.1006.desc: "Obavy o mou současnou válku přiměly [friend.GetTitledFirstName] sáhnout do vlastní pokladnice a podpořit mé válečné úsilí!"
 friendship.1006.desc_2: "\n\nBrzy ráno se v mém hlavním táboře objevuje [friend.GetFirstNameNoTooltip] v čele karavany vozů naložených zlatem a teď už vyplácí mé vojáky. Taková štědrost!"
 friendship.1006.a: "Jsem nesmírně [Select_CString(ROOT.Char.IsFemale,'vděčná.','vděčný.')]"
 friendship.1006.b: "[friend.GetFirstNameNoTooltip], potřebuji #EMP víc!#!"
 friendship.1007.t: "Zrada a úskočnost"
 friendship.1007.desc: "[friend_at_war.GetTitledFirstName] si ve vlastní válce nedokáže poradit bez pomoci, a tak [friend_providing_gift.GetTitledFirstName] přispívá obrovským množstvím zlata!"
 friendship.1007.a: "Jak nečestné!"
 friendship.1008.t: "Vzor hodný následování"
 friendship.1008.desc: "[courtier_on_offer.GetTitledFirstName] mi už dlouho dobře slouží a ve svých povinnostech vyniká. Napadá mě, že [friend_receiving_gift.GetTitledFirstName] by takovou posilu jistě [Select_CString(friend_receiving_gift.IsFemale,'uvítala','uvítal')]."
 friendship.1008.a: "[friend_receiving_gift.GetFirstNameNoTooltip] takovou posilu jistě ocení."
 friendship.1008.a.success: "[friend_receiving_gift.GetFirstName] přijme tvou nabídku"
 friendship.1008.a.failure: "[friend_receiving_gift.GetFirstName] odmítne tvou nabídku"
 friendship.1008.b: "Ne, [courtier_on_offer.GetTitledFirstNameNoTooltip] musí zůstat tady."
 friendship.1008.b.tt: "[courtier_on_offer.GetTitledFirstName] ti bude nadále sloužit"
 friendship.1009.t: "Dobrá rada"
 friendship.1009.desc: "Není to poprvé, co se ke mně donesla chvála: [courtier_on_offer.GetTitledFirstName] prý odvádí skvělou práci. Teď ke mně [first_friend.GetTitledFirstName] posílá právě tuto posilu. [courtier_on_offer.GetTitledFirstName] se představí jako znamení našeho vzájemného přátelství."
 friendship.1009.a: "Vítej v mých službách, [courtier_on_offer.GetFirstNameNoTooltip]!"
 friendship.1009.b: "Když se tě [first_friend.GetTitledFirstNameNoTooltip] tak snadno vzdává, tak dobré to s tebou být nemůže."
 friendship.1009.rejection_tooltip: "Nabídku odmítneš a [courtier_on_offer.GetTitledFirstNameNoTooltip] se vrátí zpět"
 friendship.2001.t: "Potřeba se svěřit"
 friendship.2001.desc: "Má tajemství jsou tíživým břemenem, které nikdy nemohu odložit. Kdybych se s nimi ale někomu [Select_CString(ROOT.Char.IsFemale,'svěřila','svěřil')], možná by se nesla o něco lehčeji.\n\nJsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], že [friend_receiving_confession.GetTitledFirstName] by mě [Select_CString(friend_receiving_confession.IsFemale,'pochopila','pochopil')]."
 friendship.2001.a: "Pojď blíž, [friend_receiving_confession.GetFirstNameNoTooltip]. Musím se ti s něčím svěřit."
 friendship.2001.b: "Ne... nikdo se to nesmí dozvědět!"
 friendship.2002.t: "Jednou vyslovené tajemství"
 friendship.2002.desc: "[confessor.GetTitledFirstName] za mnou přichází s něčím, co už dlouho tíží na duši.\n\nProjevuji veškeré možné pochopení. Uvnitř mě ale hlodá nemalá zvědavost..."
 friendship.2002.a: "Právem mi důvěřuješ, [confessor.GetFirstNameNoTooltip]."
 friendship.2002.b: "[confessor.GetFirstNameNoTooltip], také se ti musím s něčím svěřit."
 friendship.2003.t: "Sdílené tajemství"
 friendship.2003.desc: "Když se svěřím se svým tajemstvím, [friend_receiving_confession.GetTitledFirstName] vykulí oči.\n„[SCOPE.GetRootScope.GetCharacter.GetFirstName], já ti také musím něco říct!“\n\nUkáže se, že [friend_receiving_confession.GetFirstName] skrývá velmi podobné tajemství!"
 friendship.2003.a: "Je dobře, že to oba víme."
 friendship.2004.t: "Strašlivé břemeno"
 friendship.2004.desc: "Nemohu v sobě dál dusit pravdu, která mi rozežírá duši. Někdo se ji musí dozvědět.\n\n[friend_receiving_confession.GetTitledFirstName] by mě [Select_CString(friend_receiving_confession.IsFemale,'pochopila','pochopil')] a [Select_CString(friend_receiving_confession.IsFemale,'pomohla','pomohl')] mi nést to břemeno."
 friendship.2004.a: "Musím se svěřit."
 friendship.2005.t: "Jednou vyslovené tajemství"
 friendship.2005.desc: "[confessor.GetTitledFirstName] mě varuje, že jde o temné tajemství, které už dál nemůže nést o samotě, ale něco takového jsem si vůbec [Select_CString(ROOT.Char.IsFemale,'nedokázala','nedokázal')] představit!\n\nAlespoň už na tohle břemeno nebude nikdo sám."
 friendship.2005.a: "Právem jsi mi [Select_CString(confessor.IsFemale,'důvěřovala','důvěřoval')]."
 friendship.2005.b: "[confessor.GetFirstNameNoTooltip], také se ti musím s něčím svěřit..."
 friendship.2006.t: "Sdílené tajemství"
 friendship.2006.desc: "Když se svěřuji se svým tajemstvím, bojím se, že ani [friend_receiving_confession.GetTitledFirstName] mě nepochopí. Opak je pravdou, a to mnohem víc, než jsem si [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] představit.\n\n„Až příliš dobře vím, jak se cítíš, [ROOT.GetCharacter.GetFirstName]. Vlastně úplně přesně...“"
 friendship.2006.a: "Nemohu uvěřit, kolik toho máme společného."
 friendship.2007.t: "Dobré slovo"
 friendship.2007.desc: "Náhodou se setkávám s [talking_target.GetTitledFirstName] a ke svému překvapení zjišťuji, že [friend_interceded_for.GetTitledFirstName] nemá zrovna nejlepší pověst!\n\nMožná je to příležitost tenhle názor změnit."
 friendship.2007.a: "Povím ti jeden příběh o [friend_interceded_for.GetFirstNameNoTooltip]..."
 friendship.2007.b: "Lidé by měli místo toho mluvit #EMP o mně#!."
 friendship.2007.utter_failure_tt: "Katastrofálně poškodíš pověst, kterou má [friend_interceded_for.GetFirstName]"
 friendship.2007.failure_tt: "Ještě zhoršíš situaci, ve které se [friend_interceded_for.GetFirstName] nachází"
 friendship.2007.success_tt: "Zlepšíš názor, který má [talking_target.GetFirstName] na [friend_interceded_for.GetFirstName]"
 friendship.2009.t: "Trapná situace"
 friendship.2009.desc: "Ach ne. Nevím, co se pokazilo, ale čím víc vyprávím o [friend_interceded_for.GetFirstName], tím kyseleji se [talking_target.GetTitledFirstName] tváří.\n\nSituace se zhorší natolik, že [friend_interceded_for.GetFirstName] začíná přemýšlet, co jsem asi [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] říct!"
 friendship.2009.a: "Je mi to tak líto, [friend_interceded_for.GetFirstNameNoTooltip]."
 friendship.2010.t: "Trapná situace"
 friendship.2010.desc: "Při společně stráveném čase [friend_doing_interceding.GetTitledFirstName] zjistí, že mezi mnou a [talking_target.GetTitledFirstName] panuje... napětí.\n\nPokus přesvědčit [talking_target.GetFirstName] o mých kvalitách ale podle všeho všechno ještě zhorší!"
 friendship.2010.a: "Ach ne. [friend_doing_interceding.GetFirstNameNoTooltip]!"
 friendship.2012.t: "Mnoho snahy pro malý užitek"
 friendship.2012.desc: "Snažím se vykreslit [friend_interceded_for.GetTitledFirstName] v tom nejlepším světle, ale pokaždé, když přijde řeč na tuto osobu, [talking_target.GetTitledFirstName] jen odvrátí pohled.\n\nMám podezření, že to příliš nezapůsobilo."
 friendship.2012.a: "Ale [friend_interceded_for.GetFirstNameNoTooltip] je přece [Select_CString(friend_interceded_for.IsFemale,'skvělá','skvělý')]!"
 friendship.2013.t: "Přehodnocení vztahu"
 friendship.2013.desc: "Během večera ve společnosti [friend_doing_interceding.GetTitledFirstName] zazní několik příběhů o [friend_interceded_for.GetTitledFirstName]. Po hodinách poslouchání o všemožných činech musím uznat, že můj úsudek byl nejspíš nespravedlivý."
 friendship.2013.a: "[friend_interceded_for.GetFirstNameNoTooltip] možná není tak [Select_CString(friend_interceded_for.IsFemale,'špatná','špatný')]."
 friendship.2014.t: "Pochvalná slova"
 friendship.2014.desc: "Během jednoho setkání [friend_doing_interceding.GetTitledFirstName] zjistí, že [talking_target.GetTitledFirstName] se mnou zrovna nevychází.\n\nNenechá to však jen tak a nakonec [talking_target.GetFirstName] uvěří, že nejsem tak [Select_CString(ROOT.Char.IsFemale,'špatná','špatný')], jak se původně zdálo!"
 friendship.2014.a: "Na takové přátele je spoleh!"
 friendship.2015.t: "Změna přesvědčení"
 friendship.2015.desc: "Snažím se vykreslit [friend_interceded_for.GetTitledFirstName] v tom nejlepším světle a [talking_target.GetTitledFirstName] postupně začíná naslouchat se stále větším zájmem.\n\nKdyž nakonec tiše zazní „To jsem vůbec [Select_CString(talking_target.IsFemale,'nevěděla','nevěděl')]!“, je mi jasné, že se mi podařilo zapůsobit."
 friendship.2015.a: "[friend_interceded_for.GetFirstNameNoTooltip] je skvělý člověk!"
 friendship.3001.t: "Podle přátel poznáš člověka"
 friendship.3001.desc: "[spouse_benefitting.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse_benefitting') )], se obklopuje dobrými lidmi.\n\n[friend_being_approved.GetTitledFirstName] je nejlepším důkazem, že si přátele umí vybírat."
 friendship.3001.a: "Mám v životě tolik dobrých lidí."
 friendship.3002.t: "Podle přátel poznáš člověka"
 friendship.3002.desc: "[first_spouse.GetTitledFirstName] se na mě usměje a poznamená, že si kolem sebe umím vybírat dobré lidi.\n\nJistě má na mysli lidi jako [friend_being_approved.GetTitledFirstName]."
 friendship.3002.a: "Mám v životě tolik dobrých lidí."
 friendship.3003.t: "Podle přátel poznáš člověka"
 friendship.3003.desc: "[spouse_suffering.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('spouse_suffering') )], se obklopuje opravdu příšernými lidmi.\n\nA [friend_being_disapproved.GetTitledFirstName] patří k těm nejhorším."
 friendship.3003.a: "Jestli [friend_being_disapproved.GetTitledFirstName] ještě jednou přijde na návštěvu..."
 spouse_responds_tt: "[spouse_suffering.GetFirstName] možná tohle přátelství ukončí. Anebo také ne..."
 friendship.3004.t: "Podle přátel poznáš člověka"
 friendship.3004.desc: "Bylo by mnohem snazší, kdyby spolu lidé v mém životě vycházeli. Jenže kdykoli přijde řeč na [friend_being_disapproved.GetTitledFirstName], [spouse.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe', SCOPE.sC('spouse'))], reaguje s neskrývaným odporem."
 friendship.3004.a: "Tohle přátelství kvůli ničemu neopustím."
 friendship.3004.b: "Přednost má [spouse.GetFirstNameNoTooltip]."
 friendship.3005.t: "Volba přátel"
 friendship.3005.desc: "Ještě donedávna mezi mnou a [spouse_suffering.GetTitledFirstName] panovalo dobré přátelství. Teď mi ale přichází zpráva, že už tam pro mě není místo!\n\nŽádný důvod nezazněl, ale vím, odkud vítr vane: [spouse.GetTitledFirstName] mě nemůže vystát..."
 friendship.3005.a: "Jak jsi mi to [Select_CString(spouse_suffering.IsFemale,'mohla','mohl')] udělat, [spouse_suffering.GetFirstNameNoTooltip]?"
 friendship.3006.t: "Výhodné vztahy"
 friendship.3006.desc: "Radu mi poskytuje [friend_on_council.GetTitledFirstName], [Select_CString(friend_on_council.IsFemale,'které','kterému')] [hooked_councillor.GetTitledFirstName] dluží laskavost. A [hooked_councillor.GetFirstNameNoTooltip] už dobře ví, že ji musí oplatit způsobem, který určím já."
 friendship.3006.a: "Děkuji, [friend_on_council.GetFirstNameNoTooltip]!"
 friendship.3006.b: "Věřím, že tuhle páku využiješ lépe než já, [friend_on_council.GetFirstNameNoTooltip]."
 friendship.3007.t: "Přátelská útěcha"
 friendship.3007.opening: "Jen máloco si užívám víc než chvíle, kdy je se mnou [friend.GetTitledFirstName]."
 friendship.3007.fallback: "\n\n[friend.GetTitledFirstName] přesně ví, jak zahnat mé chmurné myšlenky. Když jsme onehdy společně někam vyrazili, opravdu mi to pomohlo."
 friendship.3007.malicious: "\n\nCelý večer patřil trýznění služebnictva, rýpání do každé drobné chyby a stížnostem na sebemenší detail. Kdo by řekl, že takové malicherné trápení druhých dokáže tak dobře ulevit rozbouřené mysli!"
 friendship.3007.benevolent: "\n\nSpolečná procházka městem, rozdávání mincí chudým a odpuštění jednomu troufalému kapsáři mi udělaly dobře. Trocha dobročinnosti a shovívavosti opravdu dokáže ulevit od stresu."
 friendship.3007.dominant: "\n\n[friend.GetTitledFirstName] mě vláčí od jedné činnosti ke druhé a to zběsilé tempo mi skutečně nedává čas myslet na starosti."
 friendship.3007.submissive: "\n\nSpolečná procházka krajinou mi opravdu pomohla zahnat chmurné myšlenky, i když veškerá iniciativa nakonec zůstala na mně."
 friendship.3007.extroverted: "\n\nBouřlivá noc ve městě a spousta nových známostí mi dokonale pomohly zapomenout na starosti!"
 friendship.3007.introverted: "\n\nTichý společný večer, víno a dlouhé rozhovory o našich problémech mi skutečně přinesly úlevu."
 friendship.3007.emotional: "\n\n[friend.GetTitledFirstName] mě pobízí, ať nechám emocím volný průchod. Talíře létají vzduchem, výkřiky tlumí polštáře a když bouře konečně odezní, opravdu se cítím lépe."
 friendship.3007.levelheaded: "\n\n[friend.GetTitledFirstName] tiše vyslechne všechny mé starosti a pomůže mi podívat se na ně s odstupem. Po chvíli si uvědomím, že věci nejsou zdaleka tak zlé, jak jsem si [Select_CString(ROOT.Char.IsFemale,'představovala','představoval')]."
 friendship.3007.end_chill: "\n\nPo tomhle krátkém oddechu se můžu znovu pustit do svých povinností. Mám štěstí, že v mém životě je [friend.GetTitledFirstName]!"
 friendship.3007.end_severe: "\n\nPo tomhle krátkém oddechu se cítím lépe než už hodně dlouho! Mám štěstí, že v mém životě je [friend.GetTitledFirstName]."
 friendship.3007.a: "Příjemná malá přestávka."
 friendship.3007.b: "Když je se mnou [friend.GetFirstNameNoTooltip], vždycky mi to prospěje."
 friendship.3007.c: "[Select_CString(ROOT.Char.IsFemale,'Netušila','Netušil')] jsem, jak moc jsem to [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')]."
 friendship.3007.d: "Na chvíli jsem úplně [Select_CString(ROOT.Char.IsFemale,'zapomněla','zapomněl')] na všechny starosti světa."
