l_polish:
 lover.0001.t: "Konec vášně"
 lover.0001.desc_opening: "„[ROOT.Char.Custom('LoverPetName')], tohle... tohle už mezi námi nefunguje!“\n\n[lover.GetTitledFirstName] se ode mě odtáhne a pokračuje:"
 lover.0001.desc_murder: " „Jiskra mezi námi pohasíná... A k tomu ta vražda... Je toho na mě příliš!“"
 lover.0001.desc: " „Ta jiskra mezi námi... jako by docela vyhasla.“"
 lover.0001.a: "Souhlasím. Je čas, aby se naše cesty rozešly."
 lover.0001.b: "Ale... vzpomeň si na všechny ty krásné chvíle!"
 lover.0001.b.tt: "Dá vašemu vztahu ještě jednu šanci"
 lover.0002.t: "Konec vášně"
 lover.0002.still_in_love: "[first_lover.GetTitledFirstName] ke mně promluví pochmurným tónem a ta slova mi stále znějí v uších. Nemohu se zbavit pocitu, že jejich cílem bylo mi ublížit.\n\n„Já... ale já tě miluji!“ vyjde mi z vyprahlého hrdla. Ani mé prosby však nic nezmění."
 lover.0002.still_likes: "To, co mi [first_lover.GetTitledFirstName] řekne, bolí, ale snažím se tu bolest spolknout.\n\nJestli je tohle pro nás opravdu nejlepší, nebudu odchod ještě víc ztěžovat."
 lover.0002.neutral: "„Všechno jednou skončí,“ řekne mi [first_lover.GetTitledFirstName]. Při pomyšlení na všechno, co jsme spolu prožili a co jsme teď ztratili, mě přepadá smutek. Nakonec to ale nejspíš bude nejlepší."
 lover.0002.dislike: "[first_lover.GetTitledFirstName] za mnou přichází s patrnou nejistotou. Když pochopím, že je mezi námi konec, necítím zármutek. Jen úlevu."
 lover.0002.hate: "[first_lover.GetTitledFirstName] za mnou přichází s tím, že si musíme vážně promluvit. Ještě než však zazní jediné slovo, spustím tirádu o všech těch dalších zklamáních.\n\nKdyž se pak dozvím, že už se nemáme vídat, pocítím téměř radost."
 lover.0002.like.vengeful: "[first_lover.GetTitledFirstName] chrlí jednu chabou výmluvu za druhou a s každým slovem ve mně roste nenávist. Takže už nestačím? Dobrá. Tohle ještě bude mít následky..."
 lover.0002.dislike.vengeful: "[first_lover.GetTitledFirstName] chrlí jednu ubohou výmluvu za druhou a v mém nitru se rozlévá ledové opovržení, které ničí poslední zbytky něhy. Za takové odmítnutí přijde odplata..."
 lover.0002.like.humble: "Ta slova působí téměř nesnesitelnou bolest, ale jejich pravdu nemohu popřít. Pro tenhle vztah jsem nikdy nebyl dost dobrou partií. Snad beze mě přijde větší štěstí..."
 lover.0002.like.arrogant: "[first_lover.GetTitledFirstName]... už mě nechce? To nedává žádný smysl. Něco musí být v nepořádku, nebo snad ta podivná slova zazněla pod nátlakem. Já... jsem přece přesně to, co potřebuje!"
 lover.0002.dislike.arrogant: "Málem se rozesměju nad absurditou toho, co [first_lover.GetTitledFirstName] říká. Samozřejmě po mně stále touží, vždyť lepší partii si ani nelze přát! Přesto se nehádám. Mně je to ostatně jedno."
 lover.0002.like.lustful: "[first_lover.GetTitledFirstName] se objeví bez ohlášení a já mám radost. Ty dychtivé doteky mi už tolik chyběly! Nemohu se dočkat objetí, ale při pokusu přitáhnout se blíž přijde odpor.\n\nSlova, která následují, si sotva pamatuji, ale tupá bolest, kterou po sobě zanechají, dosud nepolevila."
 lover.0002.dislike.lustful: "K mému překvapení pocítím nejprve úlevu, když [first_lover.GetTitledFirstName] oznámí, že je mezi námi konec. Konečně si mohu přiznat, že mé touhy už nedokáže naplnit."
 lover.0002.like.understanding: "Když [first_lover.GetTitledFirstName] marně hledá správná slova, hned poznám, že nepřichází nic dobrého. Potlačím vlastní žal, protože nechci tuhle chvíli ještě víc ztěžovat, a naše ruce se na okamžik pevně sevřou. Pak se slova vyhrnou jako vodopád a mé nejhorší obavy se potvrdí."
 lover.0002.dislike.understanding: "Ať už je důvod návštěvy jakýkoli, je zjevné, že [first_lover.GetTitledFirstName] něco hluboce trápí. Ačkoli mé city už vyprchaly, pohled na takové trápení mě stále bolí.\n\nPo mém ujištění, že všechno bude v pořádku, konečně zazní, že je mezi námi konec."
 lover.0002.like.angry: "Celou věčnost se [first_lover.GetTitledFirstName] přede mnou kroutí a potí, takže samotné přiznání mě nijak nepřekvapí. Zato vlastní reakce ano. Z úst mi jako láva vytrysknou odporná slova a já je nedokážu zastavit. Ani nechci. Potřebuji vidět svou vlastní bolest odraženou v té tváři.\n\nVztek mě chrání až do chvíle, kdy [first_lover.GetFirstName] vyrazí z [ROOT.Char.Custom('GetRoom')]. Pak už zbývá jen mučivá skutečnost odmítnutí."
 lover.0002.dislike.angry: "Celou věčnost se [first_lover.GetTitledFirstName] přede mnou kroutí a potí, až svůj vztek nedokážu dál držet na uzdě. Všechno jedovaté, co se mi kdy honilo hlavou, vytryskne z úst jako láva.\n\nBolest v těch očích mi dodává sílu, a když nakonec chraplavě zazní, že je mezi námi konec, můj triumf je úplný."
 lover.0002.like.paranoid: "Když mi [first_lover.GetTitledFirstName] oznámí, že už mě nechce, nijak mě to nepřekvapí. Už dlouho to vidím v očích a cítím ve váhavých dotecích. Pokaždé, když se zeptám, přijde zapírání, ale teď už pravdu zřejmě nelze dál skrývat. Anebo mě snad jen bylo příjemné sledovat trpět..."
 lover.0002.dislike.paranoid: "Když mi [first_lover.GetTitledFirstName] oznámí, že už mě nechce, nijak mě to nepřekvapí. Už dlouho vím, že tohle přijde, navzdory neustálému zapírání. Možná se to všechno protahovalo jen proto, abych trpěl... Ano, [first_lover.GetTitledFirstName] se v mém utrpení určitě vyžívá!"
 lover.0002.a: "Ale proč, lásko moje..."
 lover.0002.b: "Ne, musím něco udělat!"
 lover.0002.c: "Možná to tak bude nejlepší."
 lover.0002.d: "Konečně! [ROOT.GetCharacter.GetFaith.FertilityGodName] mi přeje!"
 lover.0002.e: "Takovou zradu nikdy neodpustím."
 lover.0003.t: "Příliš mnoho dobrého"
 lover.0003.desc.intro: "Nikdy by mě nenapadlo, že i [ROOT.Char.Custom('lover_reason')] může člověka zahltit, ale život mě vyvedl z omylu. Některé dny mám pocit, že veškerý můj volný čas vypadá pořád stejně: "
 lover.0003.desc.twolovers: "[lover_1.Custom('lover_activity')] a [lover_2.Custom('lover_activity')]. "
 lover.0003.desc.threelovers: "[lover_1.Custom('lover_activity')], [lover_2.Custom('lover_activity')] a [lover_3.Custom('lover_activity')]. "
 lover.0003.desc.end1: "\n\nJak dlouho to ještě vydržím? "
 lover.0003.desc.end2men: "Tihle muži"
 lover.0003.desc.end2women: "Tyhle ženy"
 lover.0003.desc.end2people: "Tihle lidé"
 lover.0003.desc.end3: " mě jednou zničí!"
 lover_0003.a: "Musím nechat [lover_1.GetFirstNameNoTooltip] odejít."
 lover_0003.b: "S [lover_2.GetFirstNameNoTooltip] jsme došli na konec společné cesty."
 lover_0003.c: "S [lover_3.GetFirstNameNoTooltip] už takhle dál nemohu."
 lover_0003.d: "V lásce nejde o množství, ale o kvalitu!"
 lover_0003.d.tt: "Využiješ svůj romantický šarm, aby byli všichni spokojení, aniž by tě to vyčerpalo."
 lover_0003.e: "Možná mě to zlomí, ale co je to za život, když v něm není [ROOT.Char.Custom('lover_reason')]?"
 lover_0003.e.tt: "Vynaložíš velké úsilí, aby všechny vztahy vydržely."
 lover.0004.t: "Bodnutí odmítnutí"
 lover.0004.desc: "[first_lover.GetFirstName] a já jsme si prošli těžkými chvílemi, to nemohu popřít, ale přesto mě tenhle konec zaskočil. Ani nevím proč, ale nikdy jsem si [Select_CString(ROOT.Char.IsFemale,'nemyslela','nemyslel')], že to mezi námi skončí právě takhle.\n\nVztek, rozhořčení, lítost... lhostejnost. Jedna emoce střídá druhou a já jen ochromeně tápu, co dělat nebo cítit."
 lover_0004.a: "Jak mám bez té [ROOT.Char.Custom('lover_reason')] dál žít?"
 attempt_to_regain_affection_tt: "Musím udělat něco radikálního, abych znovu [Select_CString(ROOT.Char.IsFemale,'získala','získal')] náklonnost!"
 lover.0005.t: "Peklo nezná větší hněv"
 lover.0005.desc: "Kdybych [Select_CString(ROOT.Char.IsFemale,'tvrdila','tvrdil')], že jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')], že [lover.GetFirstName] přijme mé rozhodnutí dobře, [Select_CString(ROOT.Char.IsFemale,'lhala','lhal')] bych. Přesto mě reakce překvapí. Žádné slzy, žádné prosby, žádné urážky. Jen oči prozradí skutečné pocity, a z toho pohledu mi přeběhne mráz po zádech."
 lover_0005.a: "Obávám se, že jsem si dnes [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] nepřítele."
 lover.0101.t: "[Select_CString(lover.IsFemale,'Zajala','Zajal')] mě [lover.GetFirstNameNoTooltip]"
 lover.0101.desc_dungeon: "Přes slzy sotva rozeznávám mříže. Proč mi tohle [lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))], vůbec dělá? [lover.Custom('LoverPetName')], prosím, pusť mě ven..."
 lover.0101.desc_house_arrest: "Ačkoli s [lover.GetTitledFirstName] stále chodíme stejnými chodbami, naše srdce si nikdy nebyla vzdálenější. [lover.Custom('LoverPetName')], prosím, pusť mě ven..."
 lover.0101.a: "Člověk, kterého miluji, by mi tohle neudělal!"
 lover.0101.b: "Je to jen další překážka, kterou společně překonáme."
 lover.0102.t: "Vězeň"
 lover.0102.desc: "Kdo by čekal, že to skončí takhle? [imprisoned_lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('imprisoned_lover'))], se vyhýbá i mé pouhé přítomnosti. Stále je sice v mé moci, ale veškerá náklonnost ke mně je pryč."
 lover.0102.a: "Láska dokázala uniknout, i když její nositel ne!"
 lover.0103.t: "City ve válce"
 lover.0103.desc: "[lover.GetTitledFirstName], [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('lover'))] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))], proti mně [Select_CString(lover.IsFemale,'vyhlásila','vyhlásil')] válku... Ať už mezi námi bylo cokoli, ať už jsem [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')] cokoli, zvuk válečných rohů to pomalu přehlušuje."
 lover.0103.a: "Nic mi nebude stát v cestě. Ani ty, lásko moje!"
 lover.0103.b: "Ve válce je život nejcennější a láska nejsladší."
 lover.0103.b.tt: "#F V zápalu boje nebudu dělat ukvapená rozhodnutí!#!"
 lover.0104.desc: "Od chvíle, kdy jsem [Select_CString(ROOT.Char.IsFemale,'dala','dal')] přednost dobytí [war_title.GetName] před naším vztahem, [war_lover.GetTitledFirstName] se na mě odmítá byť jen podívat. Obávám se, že to, co mezi námi bylo, je navždy ztraceno."
 lover.0104.a: "V lásce a válce je dovoleno vše."
 lover.0201.t: "Konec poměru"
 lover.0201.desc: "„Jsem [Select_CString(breaker.IsFemale,'ráda','rád')], že chápeš, proč to takhle musí být,“ zazní přede mnou.\n\nAch, [breaker.GetFirstName], kéž bych [Select_CString(ROOT.Char.IsFemale,'chápala','chápal')]! Nejdřív všechna ta sladká slůvka, a teď prostě odcházíš?"
 lover.0201.other_lover: "\n\nZa tím je [other_lover.Custom2('InsultNounSexual', ROOT.Char)], že ano?!"
 lover.0201.a: "Takhle to přece nemělo skončit."
 lover.0202.t: "[Select_CString(breaker.IsFemale,'Má vlastní manželka','Můj vlastní manžel')]"
 lover.0202.desc: "Jsem... [Select_CString(ROOT.Char.IsFemale,'zmatená','zmatený')]. [breaker.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('breaker'))], už se mnou prý nechce být [Select_CString(breaker.IsFemale,'milenkou','milencem')]. Copak naše vášeň nestačí k tomu, aby plamen tohoto manželství dál hořel?"
 lover.0202.a: "Co si [breaker.GetFirstNameNoTooltip] vůbec myslí?"
 lover.0203.t: "Úleva"
 lover.0203.desc: "„Není to tebou, je to mnou...“ [breaker.GetFirstName] mluví, ale já už vlastně neposlouchám. Není pochyb, že náš románek právě končí, ale jediné, co cítím, je obrovská vlna úlevy."
 lover.0203.a: "Ano, ano, je to strašná škoda. Tak už běž."
 lover.0204.t: "[Select_CString(lover.IsFemale,'Opovržená žena','Opovržený muž')]"
 lover.0204.desc: "„Jak se opovažuješ! Jak se se mnou můžeš rozejít, a navíc kvůli [other_lover.Custom2('InsultNounSexual', SCOPE.sC('lover'))]!“\n\nZvěsti se šíří rychle a dramatický výstup, který [lover.GetFirstName] [Select_CString(lover.IsFemale,'předvedla','předvedl')], se přede mnou už znovu přehrává v podání druhých. Je jasné, že vůči mně panuje silná zášť a možná přijde i pomsta, ať už oprávněná, nebo ne."
 lover.0204.a: "[breaker.GetFirstNameNoTooltip] si [Select_CString(breaker.IsFemale,'vybrala','vybral')] mě. Smiř se s tím."
 lover.3111.t: "Jediná láska"
 lover.3111.desc: "[lover.GetTitledFirstName] mě drží v náručí a já prožívám vzácný okamžik skutečného štěstí. Jen si představit, že by to mohlo trvat navždy - že už by mezi námi nikdy nebyl nikdo další..."
 lover.3111.a: "Slibme si, že už nikdy nebudeme milovat nikoho jiného!"
 lover.3111.a.success: "[lover.GetShortUIName|U] souhlasí s výlučným vztahem"
 lover.3111.a.failure: "Tvůj návrh uvede [lover.GetShortUIName] do rozpaků"
 lover.3111.a.tt: "#F Navrhneš, abyste si slíbili věrnost jeden druhému a nikomu jinému#!"
 lover.3111.b: "Tohle mi stačí ke štěstí. Ještě jednou se mi odevzdej!"
 lover_0300_break_up_with_other_lovers_effect.tt: "Všechny tvé ostatní milenecké vztahy"
 lover.3002.t: "Řekni to slovy"
 lover.3002.desc: "Ty city už ve mně skoro nejdou udržet! Musím dát najevo, co cítím!\n\nLásko, veď mou ruku, až se pero dotkne papíru!"
 lover.3002.a: "Jediná pravda se skrývá v poezii!"
 lover.3002.b: "Je to mnohem těžší, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]..."
 lover.3002.a_beautiful: "Nádherný milostný dopis"
 lover.3002.a_good: "Dobrý milostný dopis"
 lover.3002.a_competent: "Ucházející milostný dopis"
 lover.3002.a_bad: "Špatný milostný dopis"
 lover.3003.desc: "Přišel mi dopis! Odesílatelem je [first_lover.GetTitledFirstName]!\n\n[first_lover.Custom2('love_letter', ROOT.Char )]"
 lover.3003.desc_conclusion: "\n\nCo... to má být?"
 lover.3003.a: "To je snad nejhorší báseň, jakou jsem kdy [Select_CString(ROOT.Char.IsFemale,'slyšela','slyšel')]!"
 lover.3004.desc: "Můj dopis se zřejmě nesetkal s přílišným nadšením. Podívám se na něj ještě jednou...\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3004.a: "Je to opravdu tak špatné?"
 lover.3005.desc_conclusion: "\n\nTo je... milé."
 lover.3005.a: "Alespoň na mě [first_lover.GetTitledFirstName] myslí."
 lover.3006.desc: "Můj dopis měl docela úspěch, i když byl označen za „prostý pokus o poezii“:\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3006.a: "Hlavní je přece úmysl!"
 lover.3007.desc_conclusion: "\n\nBáseň, jen pro mě!"
 lover.3007.a: "Ach, to je tak dojemné!"
 lover.3008.desc: "Můj dopis měl úspěch! Podle všeho už jej díky [lover.GetTitledFirstName] slyšelo několik dalších lidí.\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3008.a: "Můj básnický jazyk opět nezklamal!"
 lover.3009.desc_conclusion: "\n\nJe to opravdu nádherné. A celé jen pro mě!"
 lover.3009.a: "Tato slova si navždy uchovám v srdci!"
 lover.3010.desc: "[lover.GetTitledFirstName] odpovídá, že můj dopis patří k tomu nejkrásnějšímu, co kdy zaznělo! Když si jej teď znovu pročítám, vlastně mě to ani nepřekvapuje:\n\n[first_lover.Custom2('love_letter', SCOPE.sC('lover'))]"
 lover.3010.a: "Možná jsem se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] stát básníkem, a ne [ROOT.Char.GetTitleAsNameNoTooltip]!"
 lover.3112.desc: "„Nikdy nebudu toužit po nikom jiném než po tobě, [ROOT.Char.Custom('LoverPetName')].“\n\n[proposing_lover.GetTitledFirstName] si mě přitáhne blíž. Na krku cítím teplý dech a pak přichází žádost o slib: už nikdy nemít žádného jiného milence."
 lover.3112.a: "Nikoho jiného nepotřebuji!"
 lover.3112.b: "Jistě, #EMP rozhodně#! nebudu mít nikoho jiného."
 lover.3112.b.tt: "#F Co zlého může vzejít ze lži pronesené z lásky?#!"
 lover.3112.c: "To přece nemyslíš vážně?!"
 lover.3112.b.remain_together.tt: "[THIS.Char.GetShortUIName] zůstane [Concept('lover',Select_CString(THIS.Char.IsFemale,'tvou milenkou','tvým milencem'))|E]"
 lover.3113.desc: "„Ano, samozřejmě že chci patřit jen tobě, [ROOT.Char.Custom('LoverPetName')]!“\n\nSrdce mi zaplaví něha a touha. [lover.GetTitledFirstName] se ocitne v mém objetí a následuje dlouhý, vášnivý polibek."
 lover.3113.a: "Na nikom jiném nezáleží!"
 lover.3113.a.tt: "#F Nikdo pro mě nikdy nebude znamenat tolik jako [lover.GetFirstNameNoTooltip]!#!"
 lover.3114.desc: "„Mám tě [Select_CString(lover.IsFemale,'ráda','rád')], [ROOT.Char.GetFirstNameNoTooltip], ale ještě nejsem [Select_CString(lover.IsFemale,'připravená','připravený')] slíbit ti naprostou oddanost.“\n\n[lover.GetTitledFirstName] [lover.Custom('quirk_neg_present')] a mezi námi zavládne trapné ticho."
 lover.3114.a: "Jak jsem se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] tak splést?"
 lover.0304.opening: "[Select_CString(ROOT.Char.IsFemale,'Má drahá','Můj drahý')] [ROOT.Char.GetFirstNameNoTooltip],"
 lover.0304.desc: "Nikdy jsem [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')], že to skončí právě takhle, ale stalo se. Je mi to líto, ale miluji někoho jiného. Už spolu nemůžeme být.\n\nPřeji ti všechno štěstí světa. Ať nad tebou bdí [ROOT.Char.GetFaith.HighGodName]."
 lover.0304.a: "Takže je opravdu konec?"
 lover.1001.t: "Zvěsti a dohady"
 lover.1001.desc: "[snoopy_lover.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('snoopy_lover') )], při svých příchodech a odchodech na mém [ROOT.Char.Custom('GetCourt')] zaslechne ledacos.\n\nV poslední době se donesly zvlášť zajímavé příběhy o tom, co ve stínech provádí [secret_holder.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('secret_holder') )]..."
 lover.1001.a: "Tohle se bude hodit, [ROOT.GetCharacter.Custom('LoverPetName')]."
 lover.1002.t: "Tahání za nitky"
 lover.1002.desc: "[lover.GetTitledFirstName], [ROOT.GetCharacter.Custom('LoverPetName_possessive')], se výborně vyzná ve spletitých vztazích na mém [ROOT.Char.Custom('GetCourt')]. Nabízí, že své zkušenosti využije při mých diplomatických snahách vůči [target.GetTitledFirstName]."
 lover.1002.a: "Skvělý nápad!"
 lover.1002.b: "Do tohohle [lover.GetFirstNameNoTooltip] zatahovat nemohu."
 lover.1003.t: "Útěcha milence"
 lover.1003.desc: "Povinnosti spojené s tím, že jsem [ROOT.Char.GetTitleAsNameNoTooltip], mě v poslední době těžce doléhají a jen vřelé objetí, které mi nabízí [lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('lover') )], dokáže to břemeno trochu odlehčit.\n\n„Prosím, [ROOT.Char.Custom('LoverPetName')], nech mě, ať ti pomohu se uvolnit.“"
 lover.1003.a: "Co bychom si bez sebe počali, lásko?"
 lover.1003.b: "Přesně tohle jsem [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')]!"
 lover.1004.t: "Pojďme někam pryč"
 lover.1004.desc: "[lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('lover') )], se [lover.Custom('quirk_pos_adverb')] usměje a obejme mě. Znovu si připomenu, proč pro mě tolik znamená.\n\nJak krásné by bylo na chvíli spolu někam zmizet. Jen my dva..."
 lover.1004.a: "[Select_CString(ROOT.Char.IsFemale,'Slyšela','Slyšel')] jsem, že [county.GetNameNoTierNoTooltip] je v tomto ročním období nádherné místo."
 lover.1004.a.tt: "#F Romantická cesta... Kdo ví, co se může stát?#!"
 lover.1004.b: "Ložnice je dost vzrušující cíl sama o sobě!"
 lover.1005.desc_opening_same_court: "„Ach, [ROOT.Char.GetFirstNameNoTooltip]! Uniknout od dvora, byť jen na chvíli... Připadám si jako ve snu.“\n\n"
 lover.1005.desc_opening_other_court: "„Ach, [ROOT.Char.GetFirstNameNoTooltip]! Setkat se takhle daleko od obou našich dvorů... Připadám si jako ve snu.“\n\n"
 lover.1005.desc_object_of_importance: "[lover.GetTitledFirstName] se usmívá a v očích se zračí nedočkavost, takže nadšeně souhlasím. V [county.GetNameNoTier] si najdeme pokoj v hostinci, který zdobí [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('lover'))]."
 lover.1005.desc: "[lover.GetTitledFirstName] se usmívá a v očích se zračí nedočkavost, takže nadšeně souhlasím. V [county.GetNameNoTier] si najdeme pokoj v hostinci."
 lover.1005.a: "Nejsoukromější pokoj, který máte. Na celý týden!"
 lover.1005.a.tt: "#F Tvé nepřítomnosti si možná někdo všimne#!"
 lover.1005.b: "Využijme naplno alespoň jednu noc."
 lover.1005.c: "Hm, tomuhle hostinci - vlastně celé vesnici - by pár vylepšení prospělo..."
 lover.1006.opening: "[lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.1006.desc_opening: "Prosím tě, propůjč mi své schopnosti!"
 lover.1006.desc_chancellor: "Tvé diplomatické schopnosti jsou všeobecně známé,"
 lover.1006.desc_steward: "Tvé správní schopnosti jsou všeobecně známé,"
 lover.1006.desc_marshal: "Tvé vojenské schopnosti jsou všeobecně známé,"
 lover.1006.desc_spymaster: "Tvé schopnosti v #EMP citlivých#! záležitostech jsou všeobecně známé,"
 lover.1006.desc_court_chaplain: "Tvé teologické znalosti jsou všeobecně známé,"
 lover.1006.desc_kurultai: "Tvé schopnosti v pasteveckých záležitostech jsou všeobecně známé,"
 lover.1006.desc_end: "a myslím, že bys [Select_CString(ROOT.Char.IsFemale,'byla','byl')] dokonalou volbou pro místo v mé radě."
 lover.1006.a: "Samozřejmě ti pomohu, [lover.GetFirstNameNoTooltip]!"
 lover.1006.b: "Na službu v radě nemám čas."
 lover.1007.t: "Vazal a vrchnost"
 lover.1007.desc: "„[ROOT.Char.Custom('LoverPetName')], zasloužíš si samotné hvězdy.“ Ležíme vedle sebe a [lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))], mi přejede rukou po zádech. „Bohužel ti mohu dát jen světské věci... Hned zítra upravím podmínky tvého vazalství.“"
 lover.1007.a: "Jsi ke mně až příliš [Select_CString(lover.IsFemale,'štědrá','štědrý')], [lover.GetFirstNameNoTooltip]!"
 lover.1007.b: "Jen #EMP několik#! změn, lásko?"
 lover.1007.b_1: "Získáš ještě výhodnější podmínky"
 lover.1007.b_2: "[lover.GetFirstNameNoTooltip] tvou chamtivost neocení"
 lover.1008.t: "Příjezd: [lover.GetTitleTierName]"
 lover.1008.desc: "Vydávám se přivítat [lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))], v [capital.GetNameNoTier], ale kolem už se tlačí hodnostáři a úředníci, kteří žádají o pomoc a radu."
 lover.1008.a: "Rozestupte se! [lover.GetTitledFirstName] [Select_CString(lover.IsFemale,'přijela','přijel')] za mnou!"
 lover.1008.b: "Názor [lover.GetTitledFirstName] na tyto záležitosti by se mohl hodit..."
 lover.2001.t: "Tlak utajení"
 lover.2001.desc: "Trávím spoustu času přemýšlením nad tím, kdo už mohl zjistit o mém vztahu s [lover.GetTitledFirstName].\n\nSrdce se mi rozbuší pokaždé, když i nevinná poznámka začne znít podezřele. Snažím se přesvědčit, že si to všechno jen namlouvám."
 lover.2001.a: "Nikdo to neví. Určitě to nikdo neví."
 lover.2002.t: "Břemeno lásky"
 lover.2002.desc: "[lover.GetTitledFirstName] ve mně probouzí silnou vášeň, ale tenhle vztah vyžaduje tolik pozornosti a péče, a právě teď je to nesmírně obtížné!\nPovinnosti, které mám jako [ROOT.Char.GetTitleAsNameNoTooltip], jsou příliš důležité. Nemohu přece trávit každou zbývající bdělou hodinu milostnými schůzkami!"
 lover.2002.secret: "\n\nUž samotné utajování našeho poměru je obrovský úkol!"
 lover.2002.a: "Ne, [ROOT.GetCharacter.Custom('LoverPetName')], není to tak, že by mi na tobě nezáleželo!"
 lover.2003.t: "„Břemeno“ lásky"
 lover.2003.desc: "[first_lover.GetTitledFirstName] všechno svádí na povinnosti spojené s postavením [first_lover.GetTitleAsNameNoTooltip], ale mám pocit, že už se na mě ani nedívá jako dřív.\n\nJe snad opravdu tak přehnané chtít, aby si člověk, který tvrdí, že vás miluje, našel alespoň chvilku na společně strávený čas?"
 lover.2003.a: "Zasloužím si něco lepšího."
 lover.2004.t: "Porušený slib"
 lover.2004.desc: "[lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))], trvá na tom, že manželství s [lovers_lover.GetTitledFirstName] je jen politickou nutností. Některé úsměvy, které si však oba vyměňují, ve mně probouzejí pochybnosti..."
 lover.2004.a: "Tohle nestrpím. Slíbili jsme si, že nikdy nebudeme milovat nikoho jiného!"
 lover.2004.a.tt: "Postavíš [lover.GetShortUIName] před své podezření"
 lover.2004.b: "Důvěřuji."
 lover.2004.b.tt: "#F Má láska by mi přece nelhala!#!"
 lover.2005.desc: "„[ROOT.Char.Custom('LoverPetName')], ty něžné pohledy, které si vyměňujete ty a [lovers_lover.GetTitledFirstName], jsou jistě jen nedorozumění, že ano?“\n\n[original_lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('original_lover'))], má od mé svatby obavy o slib vzájemné oddanosti, který jsme si kdysi dali..."
 lover.2005.a: "Neboj se, lásko. Pro mě existuješ jen ty!"
 lover.2005.b: "Do mého manželství nemáš co mluvit."
 lover.3103.desc_married: "Ačkoli [lover.GetFirstName] žije v manželství s tím [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('lovers_lover'))] člověkem, kterým je [lovers_lover.GetTitledFirstName], ujišťuje mě, že miluje jen mě.\n\n„[lover.Custom('LoverPetName')|U], nemusíš se ničeho bát. Jsi celý můj svět. Nikoho jiného bych nikdy [Select_CString(lover.IsFemale,'nedokázala','nedokázal')] milovat.“"
 lover.3103.a: "Nakonec si [Select_CString(lover.IsFemale,'vybrala','vybral')] mě. To je jediné, na čem záleží."
 lover.3104.desc_married: "„[lovers_lover.GetTitledFirstName] a já jsme přece manželé! Nemohu to jen tak ukončit. A i kdybych [Select_CString(lover.IsFemale,'mohla','mohl')]... oba pro mě znamenáte stejně mnoho, [lover.Custom('LoverPetName')].“"
 lover.3104.desc_ending: "\n\nTo, co říká [lover.GetTitledFirstName], bolí ještě víc než samotné manželství. Pomyslet, že mě takhle odmítne!"
 lover.3104.a: "[lovers_lover.GetTitledFirstName] po mně alespoň pořád touží..."
 lover.3104.a.tt: "#F Spolu s dalšími...#!"
 lover.3104.b: "Tak to ukončím já!"
 lover.3105.t: "Postel, jakou si zaslouží [ROOT.Char.GetTitleTierName]"
 lover.3105.desc: "„Že mě takhle zradíš, [ROOT.Char.GetFirstNameNoTooltip]... Nikdy jsem si [Select_CString(discoverer.IsFemale,'neměla','neměl')] pouštět do postele někoho, koho lze nazvat [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('lover'))].“\n\nA pomyslet, že [discoverer.GetFirstName], [discoverer.Custom('LoverPetName')], mě kvůli takové maličkosti opustí!"
 lover.3105.a: "Alespoň mi zůstává [lovers_lover.GetFirstNameNoTooltip]!"
 lover.3201.t: "Dokonalý dar"
 lover.3201.desc: "[ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('lover'))] přede mnou leží v celé své dokonalosti a při představě úsměvu, který vykouzlí na tváři [lover.GetTitledFirstName], se sotva dokážu ovládnout.\n\n„Je to skvost. Souhlasíte, [ROOT.Char.Custom('FormOfAddressForLiege')]?“ Starý kupec mrkne. „[ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('lover'))] - to je dokonalý dar pro milovanou osobu.“"
 lover.3201.a: "To tedy ano. Pořádně to zabal."
 lover.3201.b: "Rozhodně. Vezmu si jich deset!"
 lover.3201.c: "Tenhle brak? Ani náhodou."
 lover.3201.c.tt: "#F Určitě najdu jiný způsob, jak dát najevo svou lásku!#!"
 lover.3202.desc_exquisite_gift: "[ROOT.Char.Custom2('LoverSeductionObjectMultiple', SCOPE.sC('original_lover'))] pokrývají mou postel. Je jich deset a původ téhle záhady dokáže odhalit jedině mé srdce."
 lover.3202.desc_ordinary_gift: "[ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('original_lover'))|U] leží na mém polštáři. Původ téhle záhady dokáže odhalit jedině mé srdce."
 lover.3202.desc_ending: "\n\nAch, [original_lover.GetTitledFirstName], [original_lover.Custom('LoverPetName')], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('original_lover'))] k pohledání! Lepší protějšek bych si [Select_CString(ROOT.Char.IsFemale,'nemohla','nemohl')] přát!"
 lover.3202.a: "Za tenhle dar musím poděkovat!"
 lover.3202.a.tt: "#F A mou #EMP vděčnost#! jistě ocení!#!"
 lover.3203.t: "Má láska"
 lover.3203.desc: "Po plodném dni není nic lepšího než pořádné milostné dovádění. A jaké mám štěstí! [lover.GetTitledFirstName], [lover.Custom('ComplimentAdjective')], i [spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))], mi nechávají dveře do svých komnat otevřené!"
 lover.3203.a_not_beloved: "[spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))], dnes dostane přednost, jak se sluší."
 lover.3203.a_beloved: "[spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('spouse'))], dnes dostane přednost. Tak mi velí srdce!"
 lover.3203.b: "Už jdu, [lover.GetFirstNameNoTooltip]!"
 lover.3203.b.success: "Nenápadně se vytratíš"
 lover.3203.b.failure: "Budeš odhalen"
 lover.3203.b.tt_safe: "[spouse.GetFirstNameNoTooltip] nic netuší."
 lover.3203.c: "Jsem silnější než tyhle touhy!"
 lover.3204.t: "Touha na dálku"
 lover.3204.desc: "S každým dalším dnem cítím odloučení od [lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))], o něco bolestněji. Kéž bych častěji [Select_CString(ROOT.Char.IsFemale,'vídala','vídal')] ten [lover.Custom('quirk_pos_adjective')] úsměv, [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')] vedle sebe teplo milovaného těla a [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] okusit vše, co se mi nabízí...\n\nTouha ve mně stále plane stejně jasně, a proto je takové odloučení čím dál únavnější."
 lover.3204.a: "Ať [ROOT.Char.GetFaith.HighGodName] rozhodne, jak to má být."
 lover.3204.a.tt: "#F Nebudeš nic podnikat. Co se má stát, to se stane.#!"
 lover.3204.b: "K čemu je nám to dobré, když jsme takhle odloučeni?"
 lover.3205.opening: "[original_lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.3205.desc: "Pro mou [ROOT.Char.Custom('LoverPetName')], [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstName].\n\nObávám se, že vzdálenost, která mi brání spočinout ve tvém objetí, mě nakonec přemohla. Odpusť mi, lásko, a věz, že stále toužím po tvé něze a teple, i když musím ukončit to, co mezi námi bylo."
 lover.3205.a: "Tak takhle to končí..."
 lover.3205.a.tt: "#F [original_lover.GetTitledFirstName] mi zlomí srdce #EMP dopisem#!?!#!"
 lover.3206.t: "Na opačných stranách bojiště"
 lover.3206.desc: "Ach, [lover.GetTitledFirstName], lásko moje, přežijeme oba tuto válku?\n\nJedna věc je, že mě [attacker.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('attacker'))] [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('attacker'))], povolává do války. Ale pozvednout zbraň proti milované osobě..."
 lover.3206.a: "V lásce a válce je dovoleno vše. Nemohu s tím nic dělat."
 lover.3206.b: "Zmařím plány, které má [attacker.GetFirstNameNoTooltip]!"
 lover.3206.b.tt: "#F Udělám cokoli, aby [lover.GetFirstNameNoTooltip] [Select_CString(lover.IsFemale,'zůstala','zůstal')] v bezpečí!#!"
 lover.3207.t: "Láska v dáli"
 lover.3207.desc: "Ačkoli jsme od sebe daleko, [lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))], a já jsme srdcem stále spolu. Připomenu-li své city, možná se mi podaří znovu vykouzlit ten [lover.Custom('quirk_pos_adjective')] úsměv, který tolik miluji..."
 lover.3207.a: "Složím báseň, která vyjádří mé city!"
 lover.3207.a_object: "Báseň a [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('lover'))] vyjádří mé city!"
 lover.3207.a.tt: "Pokud [lover.GetFirstNameNoTooltip] báseň ocení:"
 lover.3207.c: "[lover.GetTitledFirstName] už přece ví, co pro mě znamená!"
 lover.3207.c.tt: "#F Určitě to ví...!#!"
 lover.3208.opening: "[writing_lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.3208.desc_object: "Tento dar, [ROOT.Char.Custom2('LoverSeductionObject', SCOPE.sC('writing_lover'))], je jen připomínkou mé touhy a oddanosti\n"
 lover.3208.a: "To je tak sladké!"
 lover.3208.a_terrible: "#F Vím, že úmysl byl dobrý, ale ta #EMP báseň#!...#!"
 lover.3208.a_okay: "#F I když poezie by ještě potřebovala trochu vypilovat...#!"
 lover.3208.a_great: "#F Dokáže dokonce psát výmluvnou poezii!#!"
 lover.3208.a_amazing: "#F Při čtení té básně se zamilovávám znovu!#!"
 lover.3208.b: "Tohle je ta nejhloupější věc, jakou jsem kdy [Select_CString(ROOT.Char.IsFemale,'četla','četl')]!"
 lover.3209.opening: "[lover.Custom2('AppropriateGreeting', ROOT.Char)]"
 lover.3209.desc: "Báseň, kterou jsi mi [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')], mi rozzářila den a znovu rozdmýchala touhu po tobě. Jen vědomí, že i ty myslíš na mě, činí naše odloučení snesitelným."
 lover.3209.a: "Ach, [lover.GetFirstNameNoTooltip], tolik mi chybíš!"
 lover.3210.desc: "Prosím, už mi takové bláboly neposílej. Navzdory vzdálenosti, která nás dělí, na tebe stále vzpomínám s láskou a [Select_CString(lover.IsFemale,'ráda','rád')] bych, aby to tak zůstalo."
 lover.3210.a: "Možná ze mě nakonec básník nebude..."
 lover.3211.t: "Zachytit lásku"
 lover.3211.desc: "Do [capital.GetNameNoTier] přijel nadaný malíř a při pohledu na jeho nádherná díla mi okamžitě vytane na mysli [lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))].\n\nObraz by byl krásným darem. Jen vybrat dokonalý námět..."
 lover.3211.a: "Temná ulička před úsvitem, plná symboliky!"
 lover.3211.a.tt: "#F Jemné narážky jistě neuniknou pozornosti!#!"
 lover.3211.b: "Abrahám a Sára bok po boku."
 lover.3211.b.tt: "#F Snad náboženská symbolika potěší!#!"
 lover.3211.c: "Mou spalující touhu nejlépe vystihne dramatická bitva!"
 lover.3211.c.tt: "#F Nic nevyjadřuje lásku lépe než boj za to, co je člověku drahé!#!"
 lover.3211.d: "Rušné tržiště je dokonalým námětem!"
 lover.3211.d.tt: "#F Živý obraz plný příležitostí jistě potěší!#!"
 lover.3211.e: "Obraz zachycující dialog Sókrata s Faidrem!"
 lover.3211.e.tt: "#F Jak lépe uctít naši lásku než vyobrazením jedné z prvních zaznamenaných rozprav o tomto tématu?#!"
 lover.3211.f: "Na takové rozmařilosti nemám čas."
 lover.3211.appreciate: "Pokud [lover.GetFirstNameNoTooltip] gesto ocení:"
 lover.3212.desc_opening: "Dar pro mou [ROOT.Char.Custom('LoverPetName')] [ROOT.Char.GetFirstNameNoTooltip],\n\n"
 lover.3212.desc_lifestyle_schemer: "Obraz zachycuje temnou uličku v [capital.GetNameNoTier] těsně před úsvitem. Symboliku a narážky ukryté ve tmě však nechám na tobě."
 lover.3212.desc_lifestyle_scholar: "Obraz zachycuje Abraháma a Sáru bok po boku, sjednocené stejně jako my a připravené společně čelit budoucnosti. Doufám, že oceníš jeho symbolický význam."
 lover.3212.desc_lifestyle_general: "Obraz zachycuje velkolepou bitvu, v níž slavní hrdinové vítězí nad zlem. Stejně jako mi při pohledu na něj vře krev v žilách, stačí k tomu i pouhé vyslovení tvého jména, [Select_CString(ROOT.Char.IsFemale,'drahá','drahý')] [ROOT.Char.GetFirstNameNoTooltip]!"
 lover.3212.desc_lifestyle_administrator: "Obraz zachycuje rušné tržiště překypující lidmi a zbožím, stejně jako já překypuji náklonností k tobě. Ať ti připomíná množství příležitostí, které nás každý den obklopují, i mé city! "
 lover.3212.desc_lifestyle_diplomat: "Obraz je ztvárněním dialogu Sókrata s Faidrem o lásce a rétorice, inspirovaným láskou, kterou k tobě cítím."
 lover.3212.a.perfect: "#F Ještě nikdy ke mně žádný obraz nepromlouval tak silně!#!"
 lover.3212.a: "Je nádherný!"
 lover.3212.b: "Ten obraz je příšerný, vyhoďte ho!"
 lover.3213.desc_perfect: "Nikdy předtím jsem [Select_CString(lover.IsFemale,'neviděla','neviděl')] umělecké dílo, jako je obraz, který jsi mi [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')]. Hluboce mě zasáhl,"
 lover.3213.desc: "Obraz, který jsi mi [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')], mě velmi potěšil. Je na něm znát promyšlenost i umění,"
 lover.3213.desc_lifestyle_schemer: "a jemné detaily a symbolika ukryté v nejtemnějších zákoutích uličky skutečně naznačují hlubší význam!"
 lover.3213.desc_lifestyle_scholar: "a zvolit za námět Abraháma a Sáru byl geniální tah!"
 lover.3213.desc_lifestyle_general: "a vyobrazená bitva ve mně skutečně rozproudila krev. Nemohu se dočkat, až tě zase uvidím, lásko!"
 lover.3213.desc_lifestyle_administrator: "a rušné tržiště překypující lidmi a příležitostmi působí jako živé!"
 lover.3213.desc_lifestyle_diplomat: "a vidět slavný dialog ztvárněný právě takhle je opravdu inspirující!"
 lover.3213.a: "Jsem [Select_CString(ROOT.Char.IsFemale,'ráda,','rád,')] že se dar líbil!"
 lover.3214.desc: "Gesta si vážím, ale obraz, který jsi mi [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')], patří k nejošklivějším uměleckým dílům, jaká jsem kdy [Select_CString(lover.IsFemale,'viděla','viděl')]. Měl to snad být žert?"
 lover.3214.a: "Haha... ano. Žert."
 lover.3215.t: "Píseň na tvou počest"
 lover.3215.desc: "[lover.GetTitledFirstName] je ode mě daleko a já se bojím, že časem zapomene, jak silně mé city stále planou.\n\nKdyby se objevil [lover.Custom('MusicalPerformer')] jako můj zástupce v umění lásky a mým jménem dvořil básněmi, písněmi a sladkými slovy, jistě by mé city znovu připomněl!"
 lover.3215.a: "Okamžitě pošlu toho nejlepšího!"
 lover.3215.a.tt: "[court_location.GetNameNoTier]: [THIS.Char.Custom('GetCourt')] získá [lover.Custom('MusicalPerformer')] v mých službách"
 lover.3215.b: "Kdokoli bude stačit, ne?"
 lover.3215.c: "Nenechám nějakého pěvce, aby se za mě dvořil."
 lover.3215.c.tt: "#F Jistě se naskytnou jiné, osobnější příležitosti#!"
 lover.3216.desc: "Ke dvoru dorazí [lover.Custom('MusicalPerformer')], oficiálně proto, aby bavil společnost. Brzy mě však vyhledá a prozradí skutečný důvod své návštěvy."
 lover.3216.desc_fancy_troubadour: "Ke dvoru dorazí [lover.Custom('MusicalPerformer')]. Zpěv by mohl těšit samotná nebesa a slova plynou hladce jako řeka. Brzy mě však vyhledá a prozradí skutečný důvod své návštěvy."
 lover.3216.desc_ending: "\n\n„Posílá mě [original_lover.GetTitledFirstName]. Mým úkolem je ujistit vás o této lásce a předvést vám své umění, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 lover.3216.a: "Jak rozkošné!"
 lover.3216.b: "Proč za sebe [original_lover.GetTitledFirstName] posílá někoho jiného, aby se mi dvořil?"
 lover.3217.desc: "Vystoupení, které jsi mi [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')], je naprostý poklad! Zpěv zní jako ptačí hlas a slova se spřádají jako na vřetenu. Každý den mi připomíná tvou lásku a můj život je díky tomu bohatší!"
 lover.3217.a: "To mě těší!"
 lover.3218.desc: "Děláš si ze mě legraci, [ROOT.Char.Custom('LoverPetName')]? Vystoupení, které jsi mi [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')], sotva drží tón a i dětské říkanky mají větší hloubku než zaznívající verše."
 lover.3218.a: "#EMP [Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')]#! jsem, že jsem [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] najímat pouličního pěvce!"
 lover.3219.t: "Osobní památka"
 lover.3219.desc: "[lover.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe',SCOPE.sC('lover'))], žije tak daleko od mého objetí... Kdyby [Select_CString(lover.IsFemale,'měla','měl')] něco osobního, co by mě připomínalo, [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')] bych se klidněji."
 lover.3219.a: "[lover.GetTitledFirstName] dostane pramínek mých vlasů."
 lover.3219.a.tt: "#F [lover.GetTitledFirstName] mě musí také strašlivě postrádat.#!"
 lover.3219.b: "[lover.GetTitledFirstName] dostane něco z mého spodního prádla!"
 lover.3219.b.tt: "#F Takové odvážné gesto jistě nezůstane bez odezvy.#!"
 lover.3219.c: "Připomenu staré časy darem: [lover.Custom2('LoverSeductionObjectIndefinite', ROOT.Char)]."
 lover.3219.c.tt: "#F Vím, že [lover.GetTitledFirstName] dokáže ocenit romantické gesto.#!"
 lover.3219.d: "Na takové nesmyslné dárky nemám čas."
 lover.3219.d.tt: "#F Najdu lepší příležitost dát najevo, jak moc mi [lover.GetTitledFirstName] chybí!#!"
 lover.3220.desc_opening: "Každý den bez tebe je prázdný a každý okamžik mimo tvé objetí je utrpením."
 lover.3220.desc_hair: "Aby ti má láska byla nablízku i v době, kdy já nemohu, posílám ti osobní dar: pramínek svých vlasů."
 lover.3220.desc_smallclothes: "Aby ti má láska byla nablízku i v době, kdy já nemohu, posílám ti intimní dar: něco ze svého spodního prádla."
 lover.3220.desc_object: "Aby ti má láska byla nablízku i v době, kdy já nemohu, posílám ti dar připomínající naši minulost: [ROOT.Char.Custom2('LoverSeductionObjectIndefinite', SCOPE.sC('original_lover'))]."
 lover.3220.a: "To je tak krásný dar!"
 lover.3220.b: "Co s tím mám jako dělat?"
 lover.3220.b.tt_smallclothes: "#F Fuj. Prostě fuj.#!"
 lover.3221.desc_opening: "Dar, který jsi mi [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')], mi rychle přirostl k srdci."
 lover.3221.desc_hair: "S částí tebe tak blízko bude snazší snášet trápení z toho, jak málo času můžeme trávit spolu."
 lover.3221.desc_smallclothes: "S tak intimní připomínkou toho, co spolu sdílíme, bude snazší snášet trápení z toho, jak málo času můžeme trávit spolu."
 lover.3221.desc_object: "S připomínkou naší společné minulosti bude snazší snášet trápení z toho, jak málo času můžeme trávit spolu."
 lover.3221.a: "Ulevilo se mi, že se dar líbil!"
 lover.3222.desc_opening: "Dar, který jsi mi [Select_CString(ROOT.Char.IsFemale,'poslala','poslal')], byl skutečně... osobní."
 lover.3222.desc_hair: "Musím se zeptat: co mám s těmi vlasy dělat? Mají snad sloužit k nějakému tajemnému rituálu?"
 lover.3222.desc_smallclothes: "Musím se zeptat: co tě pro všechno na světě přimělo poslat mi tak necudný kus oděvu?"
 lover.3222.desc_object: "Musím se zeptat: proč se tolik upínáš k tomu, co mezi námi bylo? Nevidíš snad žádnou budoucnost?"
 lover.3222.a: "Nemohu uvěřit, že se dar nelíbil!"
 lover.7001.t: "[Select_CString(potential_lover.IsFemale,'Má','Můj')] [potential_lover.Custom2('ComplimentAdjective', ROOT.Char)|l] [Select_CString(potential_lover.IsFemale,'přítelkyně','přítel')]"
 lover.7001.desc: "[potential_lover.GetTitledFirstName] sedí vedle mě. Povídáme si o [potential_lover.Custom('herhis_subject_of_interest')] a já sleduji, jak se [potential_lover.GetTitledFirstName] [potential_lover.Custom('quirk_pos_adverb')] usmívá... Když se naše pohledy setkají, srdce se mi rozbuší a [potential_lover.GetTitledFirstName] se zardí. Zjevně nejsem [Select_CString(ROOT.Char.IsFemale,'jediná','jediný')], kdo náhlé napětí cítí."
 lover.7001.a: "Tuhle chvíli si budu vychutnávat, dokud to jen půjde!"
 lover.7001.a.tt: "#F Třeba bychom jednou mohli být víc než jen přátelé?#!"
 lover.7001.b: "Takže, jak jsi [Select_CString(potential_lover.IsFemale,'říkala','říkal')]..."
 lover.7001.b.tt: "#F Nechci, aby si [potential_lover.GetTitledFirstName] [Select_CString(potential_lover.IsFemale,'myslela','myslel')], že mezi námi může být něco víc než přátelství.#!"
 lover.7002.t: "[Select_CString(proposing_friend.IsFemale,'Má','Můj')] [proposing_friend.Custom2('ComplimentAdjective', ROOT.Char)|U] [Select_CString(proposing_friend.IsFemale,'přítelkyně','přítel')]"
 lover.7002.desc: "[proposing_friend.GetTitledFirstName] sedí vedle mě. Povídáme si o [ROOT.Char.Custom('subject_of_interest')] a když se usměji, [proposing_friend.GetTitledFirstName] na mě upře oči... Náhle je napětí téměř hmatatelné a [proposing_friend.GetTitledFirstName] se zardí. Zjevně nejsem [Select_CString(ROOT.Char.IsFemale,'jediná','jediný')], kdo ho cítí."
 lover.7003.t: "[potential_lover.Custom2('InsultAdjective', ROOT.Char)|U] [Select_CString(potential_lover.IsFemale,'soupeřka','soupeř')]"
 lover.7003.desc: "[potential_lover.GetTitledFirstName] se zase pouští do tirády o [potential_lover.Custom('herhis_subject_of_interest')] a já nechávám myšlenky bloudit. Přitom si nemohu nevšimnout, že je vlastně docela [potential_lover.Custom2('ComplimentAdjective', ROOT.Char)] [potential_lover.GetWomanMan].\n\nNapětí mezi námi není nic nového, ale když se naše pohledy setkají, srdce se mi rozbuší kvůli něčemu docela jinému než nenávisti..."
 lover.7003.a: "Jak to, že na mě [potential_lover.Custom2('InsultNoun', ROOT.Char)] působí jako nějaké kouzlo?!"
 lover.7003.a.tt: "#F Musím zjistit, co za tímhle podivným pocitem vězí...#!"
 lover.7003.b: "Určitě je to jen odpor."
 lover.7004.t: "[proposing_rival.Custom2('InsultAdjective', ROOT.Char)|U] [Select_CString(proposing_rival.IsFemale,'soupeřka','soupeř')]"
 lover.7004.desc_opening: "Uprostřed poutavé debaty o [ROOT.Char.Custom('subject_of_interest')] se rozhlédnu. [ROOT.Char.Custom('GetRoom')] mi náhle připadá mnohem menší, když si všimnu, že [proposing_rival.GetTitledFirstName] opodál stojí a mračí se.\n\n"
 lover.7004.desc_potential_lover_is_go: "Když se naše pohledy setkají, [proposing_rival.GetTitledFirstName] se k mému překvapení [proposing_rival.Custom('quirk_pos_adverb')] usměje. Opravdu je [proposing_rival.Custom2('ComplimentAdjective', ROOT.Char)] [proposing_rival.GetWomanMan] už celou dobu?"
 lover.7004.desc_not: "Když se naše pohledy setkají, [proposing_rival.GetTitledFirstName] se zamračí a rychle odvrátí zrak — [proposing_rival.Custom2('InsultNoun', ROOT.Char)], jako vždycky!"
 lover.7004.a: "Úsměv opětuji...?"
 lover.7004.a.tt: "#F Proč se mi najednou tak rozbušilo srdce?#!"
 lover.7004.b: "Fuj, nech mě na pokoji, [proposing_rival.GetFirstNameNoTooltip]."
 lover.7005.t: "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )|U]: zakázaná láska"
 lover.7005.desc: "Neuniklo mi, že [potential_lover.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )], je velice [Select_CString(potential_lover.IsFemale,'přitažlivá','přitažlivý')]. Kdykoli se [potential_lover.GetTitledFirstName] usměje nebo [potential_lover.Custom('quirk_pos_present')], srdce se mi rozbuší..."
 lover.7005.a: "Je vůbec normální mít takové city? Vždyť [potential_lover.GetTitledFirstName] je [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )]!"
 lover.7005.a.tt: "#F Ať už to znamená cokoli, chci toho víc!#!"
 lover.7005.b: "[potential_lover.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('potential_lover') )], přece patří do mé rodiny. Vzpamatuj se, [ROOT.Char.GetFirstNameNoTooltip]!"
 lover.7006.t: "[ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )|U]: zakázaná láska"
 lover.7006.desc: "[proposing_family.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('proposing_family') )], ve mně už dávno vzbuzuje obdiv. V poslední době se však v mé přítomnosti zdržuje déle než obvykle, usmívá se sladčeji než dřív a pokradmu mě pozoruje, kdykoli si myslí, že si toho nevšimnu..."
 lover.7006.a: "Také mě [proposing_family.GetTitledFirstName] přitahuje!"
 lover.7006.a.tt: "#F Ale nic z toho nebude... Jen si představ ten skandál!#!"
 lover.7006.b: "Určitě nejde o nic víc než o rodinnou náklonnost."
 lover.8102.t: "$pilgrimage_header$ Následky"
 lover.8102.desc: "„Promiňte,“ osloví mě [Select_CString(brothel_worker.IsFemale,'povědomá venkovanka','povědomý venkovan')]. Usilovně přemýšlím, kde jsme se už mohli setkat, ale odpověď dostanu dřív, než si vzpomenu, jako by mi někdo četl myšlenky.\n\n„Setkali jsme se v nevěstinci v [brothel_location.GetName]. [Select_CString(ROOT.Char.IsFemale,'Zaplatila','Zaplatil')] jsi za mé služby.“ Ve tváři se objeví ruměnec.\n„To, že jsme se znovu setkali... Musí být osud, že"
 lover.8102.desc.puppy_love: "jsem se do tebe [Select_CString(brothel_worker.IsFemale,'zamilovala','zamiloval')]. V tvém náručí mi všechno připadalo tak správné... Je v tvém srdci místo pro někoho, jako jsem já?“"
 lover.8102.desc.they_pregnant: "čekám s tebou dítě. V tom čaji nejspíš nebyly ty správné byliny. Nechci to dítě vychovávat bez tebe.“"
 lover.8102.desc.you_pregnant: "možná čekáš dítě. V tom čaji nebyly správné byliny ani dost silná dávka. Nechci, aby výchova toho dítěte zůstala jen na tobě.“"
 lover.8102.desc.ending: "\n\nHlas se pomalu vytratí do ticha a následuje nesmělý úsměv. Nebo je to snad spíš vědoucí úšklebek?"
 lover.8102.a: "Převezmu plnou odpovědnost za své činy."
 lover.8102.b: "Jen se mě snažíš nachytat, že?!"
 lover.8102.c: "Zapomeň na tu noc, jinak o tobě už nikdo nikdy neuslyší."
 lover.8102.c.success: "[brothel_worker.GetTitledFirstNameNoTooltip] se pod hrozbou odmlčí"
 lover.8102.c.failure: "[brothel_worker.GetTitledFirstNameNoTooltip] souhlasí, že za úplatu bude mlčet"
 lover.8102.c.crit_failure: "[brothel_worker.GetTitledFirstNameNoTooltip] všem vyzradí, co máš na svědomí"
 lover.8102.d: "Můžeš jít se mnou, pokud naše minulost zůstane tajemstvím."
