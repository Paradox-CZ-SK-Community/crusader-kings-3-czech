l_polish:
 mentor_student.0001.t: "Co kdysi bylo"
 mentor_student.0001.desc: "„Takhle to nemůže pokračovat, [ROOT.Char.GetFirstNameNoTooltip]!“ vykřikne [mentor_to_lose.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mentor_to_lose') )], [mentor_to_lose.Custom('quirk_neg_pp')].\n\n„Náš vztah je u konce. Jsme příliš rozdílní, než aby to mohlo fungovat. Odteď se musíš obejít beze mě.“"
 mentor_student.0001.a: "Dobrá."
 mentor_student.0002.desc: "„Už tě nemám co naučit.“\n\n[mentor_to_lose.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mentor_to_lose') )], se [mentor_to_lose.Custom('quirk_pos_adverb')] usměje a přikývne. „Hodně ses toho [Select_CString(ROOT.Char.IsFemale,'naučila','naučil')], ale pokud chceš ve studiu pokročit ještě dál, musíš si najít vlastní cestu.“"
 mentor_student.0002.a: "Opravdu mě toho hodně [Select_CString(mentor_to_lose.IsFemale,'naučila','naučil')]!"
 mentor_student.0002.b: "Mám pocit, že teď bude náš vztah ještě pevnější."
 mentor_student.0003.t: "Pochybnosti"
 mentor_student.0003.desc: "[mentor_to_lose.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('mentor_to_lose') )], se [mentor_to_lose.Custom('quirk_neg_adverb')] usmívá a vypráví mi o svých nejnovějších #EMP vítězstvích#!.\n\nMožná se mám stále co učit, ale snášet [mentor_to_lose.GetFirstName] jako člověka je čím dál těžší."
 mentor_student.0003.a: "Tímhle náš vztah končí."
 mentor_student.0003.b: "Pokud je to cena za poznání..."
