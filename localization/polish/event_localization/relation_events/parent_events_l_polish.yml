l_polish:
 parent_meddling_tt: "[Select_CString(parent.IsFemale,'Tvá','Tvůj')] [parent.Custom('MotherFather')] očekává, že bude mluvit do tvých rozhodnutí"
 parent_meddling_decrease_tt: "[Select_CString(parent.IsFemale,'Tvá','Tvůj')] [parent.Custom('MotherFather')] je [Select_CString(parent.IsFemale,'spokojená','spokojený')], že se řídíš radami"
 parent.1001.t: "Radí [parent.Custom('MotherFather')|U]"
 parent.1001.desc: "[Select_CString(parent.IsFemale,'Má','Můj')] [parent.Custom('MotherFather')] má spoustu připomínek k $knight_culture_player_plural_no_tooltip_lowercase$. [ROOT.Char.Custom('GetCourt')] je dějištěm jejich výcviku a nic neunikne pozornosti mého rodiče, od způsobu, jakým cvičí, až po to, na co by se měli připravovat v boji.\n\nDokonce i $knight_culture_player_plural_no_tooltip$ připouštějí, že ty rady dávají velký smysl."
 parent.1001.a: "„Co by tedy #EMP měli#! $knight_culture_player_plural_no_tooltip_lowercase$ dělat jinak?“ [parent.Custom('MotherFather')|U] jistě ví nejlépe."
 parent.1001.b: "O tom, jak budou bojovat, rozhoduji jen já!"
 parent.1002.desc: "[Select_CString(parent.IsFemale,'Má','Můj')] [parent.Custom('MotherFather')] je [Select_CString(parent.IsFemale,'moudrá','moudrý')] [parent.GetWomanMan] a potřebám i touhám lidí rozumí opravdu dobře.\n\nPři jednání s ostatními mi proto často nabízí cenné rady."
 parent.1002.a: "Upřímně, každá rada se mi hodí."
 parent.1002.b: "„[ROOT.Char.Custom('GetCourt')] je #EMP moje#! starost.“ [parent.Custom('MotherFather')|U] ať se do toho neplete."
 parent.1003.desc: "[ROOT.Char.Custom('GetCourt')] nabízí bezpočet drobností, které přehlížím, a [Select_CString(parent.IsFemale,'má','můj')] [parent.Custom('MotherFather')] na ně dokáže celé hodiny upozorňovat.\n\nDva sluhové, kteří se dříve hádali, teď spolu klábosí, stráže jsou tišší než obvykle a nádoba s uhlíky stojí na opačné straně. [ROOT.Char.Custom('ResidenceBuilding')] zkrátka neunikne pozornému oku..."
 parent.1003.a: "Lepší vědět než později litovat."
 parent.1003.b: "„Mé obavy už nepotřebují další potravu.“ [parent.Custom('MotherFather')|U] s tím nemusí pomáhat."
 parent.1004.desc: "Někdy mám pocit, že [Select_CString(parent.IsFemale,'má','můj')] [parent.Custom('MotherFather')] má o mé pokladnici lepší přehled než samotný správce. Zlatka jako by měla dvojnásobnou cenu, když dostanu radu, jak ji utratit!"
 parent.1004.a: "„Chci se rozhodovat uvážlivě.“ [parent.Custom('MotherFather')|U] mě může vést."
 parent.1004.b: "Mé panství, má pokladnice!"
 parent.1005.desc: "[ROOT.Char.Custom('GetCourt')] hostí mnoho moudrých lidí, ale pochybuji, že by někdo z nich dokázal v debatě překonat [parent.GetTitledFirstName]. [parent.Custom('MotherFather')|U] vždy přijde s nečekaným pohledem na věc nebo odhalí další vrstvu vědomostí!"
 parent.1005.a: "„Poděl se se mnou o svou moudrost!“ [parent.Custom('MotherFather')|U] toho ví tolik."
 parent.1005.b: "Ta slova znějí působivě, ale jsou opravdu tak moudrá?"
 parent.1006.t: "Vedoucí ruka"
 parent.1006.desc: "[Select_CString(parent.IsFemale,'Má','Můj')] [parent.Custom('MotherFather')] se v poslední době velmi zajímá o dění, jehož středem je [county.GetNameNoTier].\n\nDokonce už začíná vést korespondenci s barony a starosty a poučovat je o správném hospodaření!"
 parent.1006.a: "[parent.Custom('MotherFather')|U] odvádí dobrou práci."
 parent.1007.t: "Smír přináší [parent.Custom('MotherFather')|U]"
 parent.1007.desc_opening: "[courtier.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))], dává zcela jasně najevo, jak mnou pohrdá.\n\n"
 parent.1007.courtier_1: "Narazím na [courtier.GetTitledFirstName] právě ve chvíli, kdy vypráví historku o mém #EMP údajném#! trapasu z události, kde má přítomnost zcela chyběla!"
 parent.1007.courtier_2: "Narazím na [courtier.GetTitledFirstName] a dalšího příživníka, jak se procházejí kolem. [ROOT.Char.Custom('ResidenceBuilding')] jim zjevně poskytuje dost prostoru ke klepům. Jakmile si mě [courtier.GetTitledFirstNameNoTooltip] všimne, rozhovor okatě utichne a pokračuje až poté, co projdu kolem. A není to poprvé, co se mi dostalo podobné urážky!"
 parent.1007.desc_end: "\n\n[parent.Custom('MotherFather')|U] jako vždy nabízí, že mezi námi urovná spory."
 parent.1007.a: "[parent.Custom('MotherFather')|U] nabízí pomoc, kterou neodmítnu."
 parent.1007.b: "Tyhle lidi si udržím na uzdě bez pomoci!"
 parent.1009.t: "Nová známost"
 parent.1009.desc: "[new_courtier.GetTitledFirstName] je dávná známost. [parent.Custom('MotherFather')|U] [Select_CString(parent.IsFemale,'zařídila','zařídil')], aby se tu tato návštěva objevila, a [ROOT.Char.Custom('GetCourt')] tak vítá novou tvář.\n\n[parent.Custom('MotherFather')|U] mi neustále naznačuje, jak prospěšné by bylo, kdyby [new_courtier.GetFirstNameNoTooltip] [Select_CString(new_courtier.IsFemale,'dostala','dostal')] nějakou funkci..."
 parent.1009.a: "[new_courtier.GetFirstNameNoTooltip] určitě nějaké uplatnění najde."
 parent.1009.b: "Ne. [new_courtier.GetFirstNameNoTooltip] tady domov nenajde."
 parent.1010.t: "Trocha uvolnění"
 parent.1010.desc: "Poslední dobou na mě moje role coby [ROOT.Char.GetTitleAsNameNoTooltip] doléhá víc než obvykle a [parent.Custom('MotherFather')|U] si toho zřejmě všímá.\n\n[parent.Custom('MotherFather')|U] trvá na tom, že dnešek má patřit odpočinku, a ujišťuje mě, že mezitím převezme mé povinnosti."
 parent.1010.a: "Trocha odpočinku je přesně to, co potřebuji."
 parent.1010.b: "Teď není čas odpočívat!"
 parent.2002.t: "Řádné vzdělání"
 parent.2002.desc: "Když jsem [child.GetTitledFirstName] několik dní [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')], brzy jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], že [Select_CString(parent.IsFemale,'má příliš horlivá','můj příliš horlivý')] [parent.Custom('MotherFather')|l] přesně ví, kde se nachází:\n„Jen jsem [Select_CString(parent.IsFemale,'zařídila','zařídil')], aby [child.GetTitledFirstName] [Select_CString(child.IsFemale,'odjela','odjel')]. Šlo mi jen o vzdělání. A [new_guardian.GetTitledFirstName] se o [Select_CString(child.IsFemale,'ni','něj')] postará mnohem lépe.“"
 parent.2002.a: "Ty jsi [child.Custom('DaughterSon')] [Select_CString(child.IsFemale,'poslala','poslal')] #EMP kam#!?!"
 child_sent_away_tt: "[child.GetTitledFirstName] bude [Select_CString(child.IsFemale,'vychovávána','vychováván')] postavou [new_guardian.GetTitledFirstName]"
 parent.2003.t: "[Select_CString(parent.IsFemale,'Má malicherná','Můj malicherný')] [parent.Custom('MotherFather')|U]"
 parent.2003.desc: "[Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že spor mezi [parent.GetTitledFirstName] a [hated_courtier.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hated_courtier'))], nikdy neskončí.\n\nTeď už je ale po všem. [parent.Custom('MotherFather')|U] [Select_CString(parent.IsFemale,'vyhnala','vyhnal')] [hated_courtier.GetFirstNameNoTooltip] z místa, kterému říkám [ROOT.Char.Custom('GetRealmOrDomicile')|l]!"
 parent.2003.a: "Jak si to [parent.Custom('MotherFather')] dovoluje?! [ROOT.Char.Custom('GetRealmOrDomicile')|l] patří #EMP mně#!!"
 parent.2003.b: "Konečně je pryč."
 parent.2004.t: "Neustálá otrava"
 parent.2004.opening: "[parent.GetFirstName], [Select_CString(parent.IsFemale,'má','můj')] [parent.Custom('MotherFather')], si [Select_CString(parent.IsFemale,'zvykla','zvykl')] mě všude následovat, vyjadřovat se ke všemu, co dělám, a neustále mi radit."
 parent.2004.malicious: "\n\nNeúnavně do mě rýpe a tvrdí, že takové tvrdé zacházení je jen pro mé dobro. Přitom popírá, že by se na rtech občas objevil pobavený úsměv."
 parent.2004.benevolent: "\n\nNeustále mě poučuje o ctnostech spravedlivého jednání a dává mi najevo, že se v tomto ohledu mám ještě hodně co učit."
 parent.2004.dominant: "\n\nPoučuje mě bez přestání, nikdy nepoleví a nedovolí mi ani chvíli oddechu."
 parent.2004.submissive: "\n\nStal se z toho můj neustálý stín. Každá poznámka se skrývá za zdánlivě nevinnou radou nebo narážkou."
 parent.2004.extroverted: "\n\nStejně se chová i mezi mými [ROOT.Char.Custom('GetCourtierPlural')|l]. Nutí mě s nimi mluvit a vytváří tím trapné situace pro všechny!"
 parent.2004.introverted: "\n\nNeustále vychvaluje přednosti samoty a snaží se mě izolovat od mých [ROOT.Char.Custom('GetCourtierPlural')|l]!"
 parent.2004.emotional: "\n\nSnadno propadá citovým výbuchům a dobře ví, že raději všechno vyslechnu, než abych vyvolal scénu."
 parent.2004.levelheaded: "\n\nChce se se mnou přít o úplně všem a tvrdí, že kdo se do něčeho vrhne bez rozmyslu, zahazuje veškerou výhodu. Ty nekonečné debaty mě stojí příliš mnoho času i sil."
 parent.2004.fallback: "\n\nBez ustání mě zahrnuje radami a [ROOT.Char.Custom('GetCourt')|l] už začíná řešit, kdo vlastně rozhoduje tam, kde stojí [ROOT.Char.Custom('ResidenceBuilding')]!"
 parent.2004.end: "Vím, že to dělá z lásky, ale tohle už začíná být směšné."
 parent.2004.a: "Přikážu, aby s tím [parent.Custom('MotherFather')] [Select_CString(parent.IsFemale,'přestala','přestal')]!"
 parent.2004.b: "[parent.Custom('MotherFather')|U] je [Select_CString(parent.IsFemale,'otravná','otravný')], ale pomoc se nedá upřít..."
 parent.2004.b.message: "Takhle mi to vyhovuje"
 parent.3001.t: "Pod mými křídly"
 parent.3001.desc: "Poslední dobou si všímám, že [child.GetTitledFirstName], moje milé [child.Custom('GetDaughterSon')], tráví spoustu času s [parent.GetTitledFirstName].\n\nZdá se, že se [parent.GetTitledFirstName] osobně zajímá o život [child.GetFirstNameNoTooltip] a hodlá v něm sehrát aktivní roli."
 parent.3001.a: "[parent.Custom('MotherFather')|U] se o [child.GetTitledFirstName] opravdu stará!"
 parent.3001.b: "Ten náhlý zájem, který [parent.Custom('MotherFather')] projevuje o [child.GetTitledFirstName], mě znepokojuje..."
 parent.3001.c: "[Select_CString(parent.IsFemale,'Má vychytralá','Můj vychytralý')] [parent.Custom('MotherFather')] si tohle jen tak neprosadí!"
