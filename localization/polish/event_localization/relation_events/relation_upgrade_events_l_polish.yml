l_polish:
 relation_upgrade.0001.t: "Trable na turnaji"
 relation_upgrade.0001.desc.opening: "Jako [ROOT.Char.GetTitleAsNameNoTooltip] se musím zúčastnit místního [ROOT.Char.Custom('MartialTournamentAdjective')] turnaje, jenže soutěžící mají zpoždění — turnaj nezačne dřív než za hodinu.\n\n"
 relation_upgrade.0001.desc.rival: "[rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je také tady a jako vždy se chová naprosto nesnesitelně. Neustálé stížnosti kazí náladu všem #EMP ještě víc#! než obvykle."
 relation_upgrade.0001.desc.friend: "Když se rozhlédnu, [friend.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sedí pod nedalekým pavilonem a očividně se k smrti nudí."
 relation_upgrade.0001.desc.lover: "Když se rozhlédnu, [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] sedí v hledišti o samotě a působí opravdu osaměle."
 relation_upgrade.0001.desc.second_friend: "\n\nMezitím [friend.Custom2('MyCharacterIntroduction', ROOT.Char)] sedí pod pavilonem a očividně se k smrti nudí..."
 relation_upgrade.0001.desc.second_lover: "\n\nMezitím [lover.Custom2('MyCharacterIntroduction', ROOT.Char)] sedí v hledišti o samotě a působí opravdu osaměle..."
 relation_upgrade.0001.desc.second_bridge: "\n\nNa druhou stranu,"
 relation_upgrade.0001.desc.drink: "Právě dorazil kupec s vozem. Nákladem je [ROOT.Char.Custom('GetExpensiveDrink')]..."
 relation_upgrade.0001.desc.food: "Právě se z kuchyně line neodolatelná vůně. Zdrojem je [ROOT.Char.Custom('GetExpensiveMeal')]..."
 relation_upgrade.0001.desc.prowess: "tohle by mohla být dobrá příležitost předvést své bojové umění a zároveň pobavit dav."
 relation_upgrade.0001.desc.gossip: "tohle by mohla být dobrá příležitost vyslechnout si, o čem se baví ostatní hosté."
 relation_upgrade.0001.desc.book: "čas bych si mohl zkrátit četbou. [ROOT.Char.GetFaith.ReligiousText] se k tomu přímo nabízí."
 relation_upgrade.0001.rival: "Trochu to tu oživím. [rival.GetFirstNameNoTooltip] skončí v koňském napajedle."
 relation_upgrade.0001.friend: "Pod pavilonem mi [friend.GetFirstNameNoTooltip] může dělat společnost."
 relation_upgrade.0001.lover: "Co kdyby si se mnou [lover.GetFirstNameNoTooltip] [Select_CString(lover.IsFemale,'uspořádala','uspořádal')] vlastní „[ROOT.Char.Custom('MartialTournamentAdjective')] turnaj“?"
 relation_upgrade.0001.drink: "Pořádný drink mi vždycky zvedne náladu!"
 relation_upgrade.0001.food: "Dobré jídlo mi vždycky zvedne náladu!"
 relation_upgrade.0001.prowess: "Dav mi bude nadšeně provolávat slávu!"
 relation_upgrade.0001.gossip: "Někdo tady určitě něco ví..."
 relation_upgrade.0001.gossip.tt: "Odhalíš náhodné tajemství někoho ve svém [Concept('realm','panství')|E]"
 relation_upgrade.0001.book: "[ROOT.Char.GetFaith.ReligiousText] rozhodně není špatný způsob, jak si zkrátit čas."
 relation_upgrade.0001.opt_out: "Touhle katastrofou už jsem promarnil dost času..."
 relation_upgrade.0011.t: "$relation_upgrade.0001.t$"
 relation_upgrade.0011.desc.opening: "$relation_upgrade.0001.desc.opening$"
 relation_upgrade.0011.desc.rival: "Zrovna si stěžuji, jak mizerně je celý turnaj zorganizovaný, když ke mně náhle přijde [source.Custom2('MyCharacterIntroduction', ROOT.Char)] a strčí mě přímo do koňského napajedla. Všichni kolem vyprsknou smíchy!"
 relation_upgrade.0011.desc.friend: "Čekám pod pavilonem, až se konečně začne něco dít, když k mému stolu přijde [source.Custom2('MyCharacterIntroduction', ROOT.Char)] a posadí se. „To je ale turnaj, co? Každopádně, jak se máš?“"
 relation_upgrade.0011.desc.lover: "Čekám, až se soutěžící konečně objeví, když ke mně přijde [source.Custom2('MyCharacterIntroduction', ROOT.Char)] a navrhne, abychom si uspořádali vlastní „[ROOT.Char.Custom('MartialTournamentAdjective')] turnaj“."
 relation_upgrade.0011.rival.accept: "Jak se #EMP opovažuje#!?!"
 relation_upgrade.0011.rival.accept.toast: "[rival.GetFirstNameNoTooltip] se urazí"
 relation_upgrade.0011.rival.decline: "Vlastně to #EMP bylo#! docela vtipné..."
 relation_upgrade.0011.rival.decline.toast: "[rival.GetFirstNameNoTooltip] to přejde smíchem"
 relation_upgrade.0011.friend.accept: "To je ale milé překvapení, [source.GetFirstNameNoTooltip]!"
 relation_upgrade.0011.friend.accept.toast: "[friend.GetFirstNameNoTooltip] a ty se lépe poznáte"
 relation_upgrade.0011.friend.decline: "Promiň, zrovna jsem na odchodu..."
 relation_upgrade.0011.friend.decline.toast: "[friend.GetFirstNameNoTooltip] nemá zájem"
 relation_upgrade.0011.lover.accept: "To zní zábavněji než tohle..."
 relation_upgrade.0011.lover.accept.toast: "[lover.GetFirstNameNoTooltip] přijímá tvůj návrh"
 relation_upgrade.0011.lover.decline: "Ha, dobrý vtip... To byl #EMP vtip#!, že ano?"
 relation_upgrade.0011.lover.decline.toast: "[lover.GetFirstNameNoTooltip] tvůj návrh odbývá smíchem"
 relation_upgrade.1001.t: "Noc k zapomenutí"
 relation_upgrade.1001.desc.intro: "[ROOT.GetCharacter.GetFaith.HighGodName] mi buď svědkem, tahle oslava je #EMP nudná#!! [terrible_party_host.GetFirstName] snad musí být nejhorší hostitel, jakého svět kdy #EMP poznal#!. Jak má [ROOT.GetCharacter.GetWomanMan] vůbec vydržet tuhle uspávající přehlídku průměrnosti?\n\nRozhlížím se po místnosti a hledám nějaké rozptýlení. Jakékoli."
 relation_upgrade.1001.desc.friend: "[potential_friend.GetFirstName] mi přátelsky zamává z nedalekého balkonu."
 relation_upgrade.1001.desc.lover: "[potential_lover.GetFirstName] při cestě kolem mě toužebně povzdechne."
 relation_upgrade.1001.desc.rival: "V rohu po mně [potential_rival.GetFirstName] vrhá vražedné pohledy."
 relation_upgrade.1001.desc.outro: "Musím #EMP něco#! udělat, jinak se tenhle večer potáhne věčně."
 relation_upgrade.1001.a: "Možná bych mohl[Select_CString(ROOT.Char.IsFemale,'a','')] lépe poznat [potential_friend.GetFirstNameNoTooltip]?"
 relation_upgrade.1001.a.tt: "Čekáš na odpověď..."
 relation_upgrade.1001.b: "[potential_lover.GetFirstNameNoTooltip], nechceš se projít za měsíčního svitu?"
 relation_upgrade.1001.b.tt: "$relation_upgrade.1001.a.tt$"
 relation_upgrade.1001.c: "Hej, [potential_rival.GetFirstNameNoTooltip], chceš slyšet, co si o tobě #EMP doopravdy#! myslím?"
 relation_upgrade.1001.c.tt: "[potential_rival.GetFirstNameNoTooltip] reaguje na tvou tirádu..."
 relation_upgrade.1001.d: "Jdu si zatančit!"
 relation_upgrade.1001.d.tt_success: "Oživíš večírek!"
 relation_upgrade.1001.d.tt_success.list: "Všichni [Concept('guests','hosté')|E] a [Concept('courtiers','dvořané')|E] na večírku"
 relation_upgrade.1001.d.tt_fail: "[terrible_party_host.GetFirstNamePossessiveNoTooltip] večírek je zničený a všichni vědí, že za to můžeš #EMP TY#!"
 relation_upgrade.1001.e: "Kdyby někdo zatarasil dveře, tohle místo by shořelo jedna radost..."
 relation_upgrade.1001.e.list: "$relation_upgrade.1001.d.tt_success.list$"
 relation_upgrade.1001.f: "Asi se z toho pokusím vytěžit, co se dá."
 relation_upgrade.1001.g: "Třeba si promluvím s někým novým?"
 relation_upgrade.1001.h: "[terrible_party_host.GetFirstName], tenhle večírek stojí za nic!"
 relation_upgrade.1001.h.list: "$relation_upgrade.1001.d.tt_success.list$"
 relation_upgrade.1001.i: "Nenápadně se vytratím."
 relation_upgrade.1002.t: "$relation_upgrade.1001.t$: Kamkoli, jen ne sem"
 relation_upgrade.1002.desc: "Na tomhle příšerném večírku, jehož pořádání [terrible_party_host.GetFirstName] naprosto nezvládá, trčím už snad #EMP hodiny#! a bezduše mávám na každého, kdo projde kolem.\n\nPředstava, že se vrhnu z balkonu, začíná znít čím dál lákavěji, když ucítím poklepání na rameno.\n\n„Promiň, [potential_friend.GetFirstNameNoTooltip]?“ ozve se [party_root.GetTitledFirstName]. „Nechceš se odsud někam projít?“"
 relation_upgrade.1002.a: "[ROOT.GetCharacter.GetFaith.HighGodName], ano! Kamkoli, jen ne sem!"
 relation_upgrade.1002.a.tt: "[potential_friend.GetFirstNameNoTooltip] přijímá tvou nabídku"
 relation_upgrade.1002.b: "Ehm, díky, ale raději ne."
 relation_upgrade.1002.b.tt: "[potential_friend.GetFirstNameNoTooltip] tě zdvořile odmítá"
 relation_upgrade.1002.c: "S #EMP tebou#!? Vždyť jsi tu nejnudnější člověk!"
 relation_upgrade.1002.c.tt: "[potential_friend.GetFirstNameNoTooltip] tě místo toho začne pomlouvat"
 relation_upgrade.1003.t: "$relation_upgrade.1001.t$: Procházka za měsíčního svitu"
 relation_upgrade.1003.desc: "Netuším, co mě přimělo přijít na tu příšernou, ubíjející oslavu, kterou pořádá [terrible_party_host.GetFirstName]. Musel to být okamžik šílenství... nebo snad naděje, že se tu objeví [party_root.GetTitledFirstName].\n\nDříve večer se naše cesty na chvíli zkřížily, ale můj úmyslně teskný povzdech zůstal bez povšimnutí. Nebo alespoň bez odpově-\n\n„[Select_CString(potential_lover.IsFemale,'Má drahá','Můj drahý')] [potential_lover.GetFirstNameNoTooltip]! Nechceš se projít za měsíčního svitu?“"
 relation_upgrade.1003.a: "[party_root.GetFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'myslela jsem','myslel jsem')], že se nikdy nezeptáš!"
 relation_upgrade.1003.a.tt: "[potential_lover.GetFirstNameNoTooltip] tvou nabídku s radostí přijímá"
 relation_upgrade.1003.b: "Vlastně bude lepší, když zůstaneme přáteli..."
 relation_upgrade.1003.b.tt_custom_relation: "[party_root.GetFirstNameNoTooltip] se už nebude snažit stát tvým [Concept('lover','milencem')|E]."
 relation_upgrade.1003.b.tt: "[potential_lover.GetFirstNameNoTooltip] chce zůstat jen u přátelství"
 relation_upgrade.1003.c: "Ne. O žádné námluvy teď nestojím."
 relation_upgrade.1003.c.tt: "[potential_lover.GetFirstNameNoTooltip] tě nechá bez odpovědi"
 relation_upgrade.1004.t: "$relation_upgrade.1001.t$: Nekonečné vřískání"
 relation_upgrade.1004.desc: "[ROOT.GetCharacter.GetFaith.HighGodName] mi buď svědkem, [terrible_party_host.GetFirstName] neumí uspořádat hostinu ani za nic! Žádná hudba, mdlé jídlo, žádný tanec, sotva nějaké světlo, a jako by to nestačilo, objeví se tu ještě [party_root.GetTitledFirstName]!\n\n„$relation_upgrade.1001.c$“ zařve [party_root.GetTitledFirstName] přes celou místnost, upoutá pozornost celého stáda ospalých hostů a vykročí přímo ke mně, zjevně s jediným cílem: pořádně mi to vytmavit."
 relation_upgrade.1004.a: "Tak ty chceš slyšet #EMP skutečnou#! pravdu, ničemo?"
 relation_upgrade.1004.a.tt: "[potential_rival.GetFirstNameNoTooltip] ti vztekle odpoví"
 relation_upgrade.1004.b: "Tohle je pod mou úroveň."
 relation_upgrade.1004.b.tt: "[potential_rival.GetFirstNameNoTooltip] odmítá klesnout na tvou úroveň"
 relation_upgrade.1004.c: "Možná... možná bychom místo toho mohli být přátelé?"
 aloof_but_alluring_modifier: "Nedostupný půvab"
 aloof_but_alluring_modifier_desc: "S touto postavou se zdá téměř nemožné navázat rozhovor, přesto ji obklopuje nepopiratelné tajemné kouzlo..."
 inured_to_boredom_modifier: "Otrlost vůči nudě"
 inured_to_boredom_modifier_desc: "Této postavě už společenská dřina dávno zevšedněla."
 relation_upgrade.2101.t: "Nezdravé vztahy"
 relation_upgrade.2101.desc_opening: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], ta nemoc je nakažlivá, mějte se na pozoru!“\n\n"
 relation_upgrade.2101.desc_opening_physician: "[physician.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('physician'))], mě zadržuje; na stole leží nemocné tělo prostého člověka –"
 relation_upgrade.2101.desc_opening_other: "Na stole leží nemocné tělo prostého člověka –"
 relation_upgrade.2101.desc_bubonic_plague: "pokryté velkými dýměji, z nichž vytéká hnis a krev –"
 relation_upgrade.2101.desc_smallpox: "s kůží zohyzděnou vyrážkou a puchýři –"
 relation_upgrade.2101.desc_ending: "každý, kdo se mrtvoly dotkne, riskuje nákazu. A... a já jsem zrovna [Select_CString(ROOT.Char.IsFemale,'plánovala','plánoval')] výpravu, která mě zavede nedaleko. [rival_capital.GetNameNoTierNoTooltip] leží přímo při cestě a vládne tam [rival.Custom2('MyCharacterIntroduction', ROOT.Char)]..."
 relation_upgrade.2101.a: "Ať je cílem [rival_capital.GetNameNoTierNoTooltip]!"
 relation_upgrade.2101.a_tt: "Na dvoře, kde pobývá [rival.GetTitledFirstName], může někdo onemocnět!"
 relation_upgrade.2101.a_tt_rival: "[rival.GetTitledFirstName] se pravděpodobně stane [Select_CString(rival.IsFemale,'tvou sokyní','tvým sokem')]"
 relation_upgrade.2101.a_tt_nemesis: "[rival.GetTitledFirstName] se pravděpodobně stane [Select_CString(rival.IsFemale,'tvou úhlavní nepřítelkyní','tvým úhlavním nepřítelem')]"
 relation_upgrade.2101.b: "Tělo by mohlo skrývat stopy vedoucí k původu nemoci."
 relation_upgrade.2101.b_tt: "Někdo z tvého dvora se nakazí"
 relation_upgrade.2101.b_tt_2: "Propuknutí nemoci v [capital.GetNameNoTooltip]"
 relation_upgrade.2101.c: "Tomu člověku se dostane důstojného pohřbu."
 relation_upgrade.2102.desc_opening: "[rival_capital.GetNameNoTier] je na dohled, když se opodál zastaví doprovod, v jehož čele je [corpse_rival.Custom2('MyCharacterIntroduction', ROOT.Char)]. Než stihnu vyslat posla, z jejich tábora cosi vyletí směrem tam, kde stojí [rival.Custom('ResidenceBuilding')].\n\nZ nebe se snese zohavené tělo, zpustošené nemocí;"
 relation_upgrade.2102.desc_bubonic_plague: "je pokryté velkými dýměji, z nichž vytéká hnis a krev, viditelnými i z místa, kde stojím."
 relation_upgrade.2102.desc_smallpox: "kůži má zohyzděnou vyrážkou a puchýři, které jsou vidět i z místa, kde stojím."
 relation_upgrade.2102.desc_ending: "\n\nS mokrým žuchnutím dopadne na zem a rozmetá kolem krev, vnitřnosti a paniku."
 relation_upgrade.2102.a: "Seberte tu mrtvolu – pošleme ji rovnou zpátky!"
 relation_upgrade.2102.b: "To tělo je třeba prozkoumat."
 relation_upgrade.2102.tt: "[rival.GetTitledFirstNamePossessive] dvůr postihne nákaza: onemocní jeden z dvořanů"
 relation_upgrade.2102.b_tt_2: "Propuknutí nemoci v [rival_capital.GetNameNoTooltip]"
 relation_upgrade.2001.t: "Vášnivé zaujetí"
 relation_upgrade.2001.lover_dinner.desc: "Při večeři"
 relation_upgrade.2001.lover_party.desc: "Na večírku konaném tam, kde leží [lover_1_location.GetNameNoTooltip]"
 relation_upgrade.2001.lover.desc: "si záměrně vybírám místo vedle [lover_1.GetTitledFirstName]. [lover_1.Custom('ComplimentAdjective')] – přesně tak na mě působí. Brzy mě vtáhne do rozhovoru, jehož tématem je [lover_1.Custom('herhis_subject_of_interest')]."
 relation_upgrade.2001.soulmate.desc: "[lover_1.GetTitledFirstName], pro mě jednoduše [lover_1.Custom('LoverPetName')], si nepřítomně pohrává s mými vlasy a vypráví mi o [lover_1.Custom('herhis_subject_of_interest')]."
 relation_upgrade.2001.relates.desc: "\n\n[Select_CString(lover_1.IsFemale,'Její','Jeho')] pohled na věc je fascinující, ale ještě víc obdivuji nadšení pro samotné téma. Čím hlouběji se do něj noří, tím víc ožívá a ty nádherné oči přímo #EMP září#!. Mám pocit, že bych ten hlas [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] poslouchat věčně."
 relation_upgrade.2001.does_not_relate.desc: "\n\nAčkoli toho o podobných věcech moc nevím, to nadšení pro téma mě naprosto uchvacuje. [Select_CString(lover_1.IsFemale,'Její','Jeho')] nádherné oči přímo #EMP září#! a i mně, kdo se v tom sotva vyzná, je jasné, kolik hlubokých znalostí se za těmi slovy skrývá. Mám pocit, že bych ten hlas [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] poslouchat věčně."
 relation_upgrade.2001.a: "Nechceš v tomhle rozhovoru pokračovat někde v soukromí?"
 relation_upgrade.2001.a.success: "[lover_1.GetShortUIName|U] přijímá tvou nabídku"
 relation_upgrade.2001.a.failure: "[lover_1.GetShortUIName|U] nepochopí tvůj náznak"
 relation_upgrade.2001.b: "[lover_1.GetFirstNameNoTooltip], myslím, že tě miluji."
 relation_upgrade.2001.b.success: "[lover_1.GetShortUIName|U] cítí totéž"
 relation_upgrade.2001.b.failure: "[lover_1.GetShortUIName|U] tvé city neopětuje"
 relation_upgrade.2001.c: "Jak zajímavé! Můžeš mi to vysvětlit ještě jednou?"
 relation_upgrade.2002.lover_dinner.desc: "Při večeři se ocitám vedle [lover_2.GetTitledFirstName]. V hlavě mi vytane jediné slovo: [lover_2.Custom('ComplimentAdjective')]."
 relation_upgrade.2002.lover_party.desc: "Na mém večírku se nečekaně objeví [lover_2.GetTitledFirstName], což je velmi příjemné překvapení. V hlavě mi vytane jediné slovo: [lover_2.Custom('ComplimentAdjective')]."
 relation_upgrade.2002.lover.desc: "Nakonec se rozpovídáme o [lover_1.Custom('my_subject_of_interest')] — tématu, o kterém dokážu mluvit celé hodiny. K mému potěšení [lover_2.GetFirstNameNoTooltip] skvěle poslouchá. Zájem o má slova působí naprosto upřímně a otázky jsou promyšlené a bystré.\n\nNež se naději, zůstáváme u stolu sami. Když se [lover_2.GetFirstNameNoTooltip] nakloní blíž, aby neuniklo jediné slovo, cítím, jak se mi zrychluje tep..."
 relation_upgrade.2002.c.lover: "Ehm, ano, jak jsem [Select_CString(ROOT.Char.IsFemale,'říkala','říkal')]..."
 relation_upgrade.2002.soulmate.desc: "[lover_2.GetTitledFirstName], pro mě jednoduše [lover_2.Custom('LoverPetName')], se mi opírá hlavou o hruď. Nepřítomně si pohrávám s pramenem vlasů a vyprávím o [lover_1.Custom('my_subject_of_interest')]. [lover_2.GetFirstNameNoTooltip] skvěle poslouchá — tiše přitakává, přikyvuje a klade promyšlené otázky. To, s jak opravdovým zájmem naslouchá tématu, které je mi tak blízké, mě hřeje u srdce."
 relation_upgrade.2002.c.soulmate: "Jsi [Select_CString(lover_2.IsFemale,'opravdu skvělá posluchačka','opravdu skvělý posluchač')], víš to?"
 relation_upgrade.2003.lover.desc: "Když se nakloním blíž a vyslovím svůj návrh, [lover_1.GetFirstNameNoTooltip] se na mě podívá a v očích se zaleskne docela jiný druh vášně. Na okamžik zaváhá, do tváří se vlije ruměnec, ale vnitřní boj rychle skončí.\n\n„Počkej tady ještě chvíli, aby nikdo nic netušil. Pak přijď do mých komnat.“ Když [lover_1.GetFirstNameNoTooltip] spěšně odchází, nedokážu odtrhnout pohled."
 relation_upgrade.2003.soulmate_start.desc: "Když vyznám lásku, [lover_1.GetFirstName] zůstane zaskočeně sedět. Ruka, která si ještě před chvílí pohrávala s mými vlasy, se zastaví a na tváři cítím zběsilé bušení srdce. Mé vlastní tluče stejně silně.\n\n"
 relation_upgrade.2003.soulmate_end.desc: "„Je to pravda, [lover_2.GetFirstNameNoTooltip]? Cítím to stejně už tak dlouho, ale nikdy mě nenapadlo...“\n\nPolibek, který následuje, je nejsladším okamžikem mého života."
 relation_upgrade.2003.a: "To je ale [lover_1.GetWomanMan|l]!"
 relation_upgrade.2003.b: "Jsem nejšťastnější [lover_2.GetWomanMan|l] v [realm.GetNameNoTierNoTooltip]!"
 relation_upgrade.2004.lover.desc: "[lover_1.GetFirstName] můj náznak nepochopí — nebo ho snad záměrně přehlíží jen proto, aby odmítnutí nebylo tak trapné.\n\nNáš rozhovor o [lover_1.Custom('my_subject_of_interest')] pokračuje. Naštěstí se [lover_1.GetFirstNameNoTooltip] o téma zajímá natolik, že mé rozpaky brzy ustoupí do pozadí."
 relation_upgrade.2004.soulmate_end.desc: "„Záleží mi na tobě, [lover_2.GetFirstNameNoTooltip], a je mi s tebou dobře. Nemůžeme to prostě nechat tak, jak to je?“\n\nPo rozpačité omluvě se rychle vracím k rozhovoru o [lover_1.Custom('my_subject_of_interest')] a zoufale se snažím zahnat napětí mezi námi."
 relation_upgrade.2004.a: "Bylo ode mě pošetilé dělat si takové domněnky..."
 relation_upgrade.3000.t: "Rozpuk nenávisti"
 relation_upgrade.3000.desc: "[rival_to_be.GetFirstName] mi vaří krev! [rival_to_be.Custom2('InsultAdjective', ROOT.Char)|U] [rival_to_be.Custom2('InsultNoun', ROOT.Char)] — nic jiného to není! Jak mohl [ROOT.GetCharacter.GetFaith.HighGodName] dopustit, aby svět musel snášet [rival_to_be.GetFirstNamePossessiveNoTooltip] [rival_to_be.Custom2('InsultAdjective', ROOT.Char)] [rival_to_be.Custom2('InsultNounPlural', ROOT.Char)]!? Ne, je to jasné — [rival_to_be.GetFirstNameNoTooltip] je [ROOT.GetCharacter.GetFaith.DevilNamePossessive] potomek. Je to horší než hnisající vřed i hejno nenasytných kobylek.\n\nNesnesu už jen pomyšlení, že mám dýchat stejný vzduch jako [rival_to_be.GetFirstNameNoTooltip]! [rival_to_be.Custom2('InsultAdjective', ROOT.Char)|U] — už to slovo samo mi obrací žaludek! Musím něco udělat. Musím jednat.\n\nZávisí na tom můj zdravý rozum."
 relation_upgrade.3000.a: "Nenajdu klid, dokud [rival_to_be.GetFirstNameNoTooltip] nebude ležet pod zemí..."
 relation_upgrade.3000.b: "Ne! Nesmím dovolit, aby mi pomsta ovládla život!"
 driven_by_vengeance_modifier: "Touha po pomstě"
 driven_by_vengeance_modifier_desc: "Tuto postavu pohání touha přivodit zkázu svým sokům."
