l_polish:
 rivalry.0001.t: "Zakopat válečnou sekeru"
 rivalry.0001.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip], v minulosti jsme měli své neshody, ale nemyslíš, že už je načase hodit je za hlavu?“\n\n[rival.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ukáže nejprve na mě a potom na sebe. „Ať už mezi námi bylo cokoli... začněme znovu!“"
 rivalry.0001.a: "Ano, začněme."
 rivalry.0001.b: "Ty se přede mnou plazíš?! [ROOT.Char.GetFaith.HighGodName] mi skutečně přeje!"
 rivalry.0002.t: "Zakopat válečnou sekeru"
 rivalry.0002.desc: "S odstupem času mi to všechno připadá tak zvláštní. Tolik nenávisti, tolik touhy působit bolest...\nK čemu to všechno bylo?\n\n[rival_response.GetTitledFirstName] už pro mě není [Select_CString(rival_response.IsFemale,'nepřítelkyní','nepřítelem')]."
 rivalry.0002.a: "Nechme minulost minulostí."
 rivalry.0003.t: "Nedůstojný protivník"
 rivalry.0003.imprisoned.desc: "Když se ke mně donesla zpráva, že [nemesis.GetTitledFirstName] [Select_CString(nemesis.IsFemale,'skončila','skončil')] ve vězení,"
 rivalry.0003.incapable.desc: "Když se ke mně donesla zpráva o nehodě a o tom, že [nemesis.GetTitledFirstName] [Select_CString(nemesis.IsFemale,'zůstala upoutaná','zůstal upoutaný')] na lůžko a jen slintá,"
 rivalry.0003.my_prisoner.desc: "Když [nemesis.GetTitledFirstName] [Select_CString(nemesis.IsFemale,'zůstala','zůstal')] za dveřmi a [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'cage', 'cell')] zaklapla,"
 rivalry.0003.middle.desc: "zaplavila mě škodolibá radost. [nemesis.Custom2('InsultAdjective', ROOT.Char)|U] [nemesis.Custom2('InsultNoun', ROOT.Char)] konečně dostává, co si zaslouží!\n\n"
 rivalry.0003.compassionate.desc: "Jenže radost časem vyprchala. [nemesis.GetTitledFirstName] pro mě kdysi [Select_CString(nemesis.IsFemale,'představovala','představoval')] skutečnou výzvu a vítězství chutnalo sladce. Ale tahle ubohá troska? Je mi [Select_CString(nemesis.IsFemale,'jí','ho')] skoro #EMP líto#!..."
 rivalry.0003.uncompassionate.desc: "Časem mě však ten žalostný stav začal #EMP nudit#!. Trýznit krotkou myšku mi nepřináší žádné potěšení."
 rivalry.0003.a: "Je načase tuhle kapitolu uzavřít."
 rivalry.0003.b: "Nikdy [Select_CString(nemesis.IsFemale,'jí','mu')] neodpustím! Nikdy!"
 rivalry.1001.t: "Stále na očích"
 rivalry.1001.desc.opening: "[rival.GetTitledFirstName] se [Select_CString(rival.IsFemale,'stala','stal')] neustálou pohromou mého života.\n\n"
 rivalry.1001.malicious: "Vždycky mi pokazí všechno, do čeho se pustím, a ještě se při tom šklebí! [rival.Custom2('InsultAdjective', ROOT.Char)|U] [rival.GetWomanMan]!"
 rivalry.1001.benevolent: "[rival.Custom2('InsultAdjective', ROOT.Char)|U] [rival.GetWomanMan] se při každém našem setkání okázale snaží působit slušně a spravedlivě, povýšeně mě poučuje a dělá ze mě hlupáka. Nejhorší je, že na to všichni ostatní skočí!"
 rivalry.1001.dominant: "[rival.GetTitledFirstName] si neustále nárokuje pozornost i prostor, a ještě má tu drzost vyžadovat můj čas. Copak nemám nic lepšího na práci než poslouchat to věčné vychloubání?"
 rivalry.1001.submissive: "[rival.Custom2('InsultAdjective', ROOT.Char)|U] [rival.GetWomanMan] předstírá pokoru, jen aby mi při každé příležitosti vrazil kudlu do zad!"
 rivalry.1001.extroverted: "Na každé události si [rival.GetTitledFirstName] uzurpuje veškerou pozornost a nutí všechny celé hodiny poslouchat nekonečné žvanění. A jako by to nestačilo, při každé příležitosti si rýpne i do mě!"
 rivalry.1001.introverted: "[rival.Custom2('InsultAdjective', ROOT.Char)|U] [rival.GetWomanMan] má charisma kamene, ale na šíření pomluv o mně se čas vždycky najde!"
 rivalry.1001.emotional: "Při každé příležitosti udělá [rival.GetTitledFirstName] scénu a ze mě padoucha! Fňuká, stěžuje si, vláčí mé jméno bahnem a viní mě ze všeho, co se v životě pokazí."
 rivalry.1001.levelheaded: "Ať už jde o sabotáž mé vlády nebo štiplavou urážku, [rival.GetTitledFirstName] je vždy nablízku a čeká."
 rivalry.1001.desc.fallback: "Ať jdu kamkoli a dělám cokoli, [rival.GetTitledFirstName] vždycky nějak dokáže připomenout svou přítomnost. Je to jako stín, který mi neustále zatemňuje každý den."
 rivalry.1001.a: "K čertu s tebou, [rival.GetFirstNameNoTooltip]!"
 rivalry.1010.t: "Naschvály"
 rivalry.1010.desc: "[rival.GetTitledFirstName] mě vždycky dokáže rozčílit. Důvod? [rival.Custom2('InsultBehavior', ROOT.Char)]. Ale"
 rivalry.1010.desc.patient: "I má trpělivost má své meze. [rival.GetTitledFirstName] je zkouší znovu a znovu. Důvod? [rival.Custom2('InsultBehavior', ROOT.Char)]. A"
 rivalry.1010.desc.end: "v poslední době mi to leze na nervy víc než kdy dřív. Chci to oplatit, ale jak se mám pomstít?"
 rivalry.1010.a: "Roznesu skandální zvěsti. [rival.GetTitledFirstName] se jich nezbaví celé roky!"
 rivalry.1010.a.success.tt: "#F Zvěsti vyvolají spoustu klepů a dohadů #!"
 rivalry.1010.a.failure.tt: "#F Těm přitaženým zvěstem nikdo neuvěří #!"
 rivalry.1010.a.badfailure.tt: "#F Vyjde najevo, odkud zvěsti pocházejí: ode mě #!"
 rivalry.1010.b: "[rival.GetTitledFirstName] se stane terčem jízlivé básně o všech svých chybách!"
 rivalry.1010.b.success.tt: "#F Báseň si získá takovou oblibu, že ji lidé opisují znovu a znovu #!"
 rivalry.1010.b.failure.tt: "#F Lidé považují báseň za špatně napsanou a nevkusnou #!"
 rivalry.1010.b.badfailure.tt: "#F Vyjde najevo, že báseň je moje dílo #!"
 rivalry.1010.c: "[rival.GetTitledFirstName] si přímo do očí vyslechne, co si o té drzosti myslím!"
 rivlary.1010.c.tt: "#F [rival.GetTitledFirstName] zareaguje na tvůj výpad #!"
 rivalry.1011.t: "Zlomyslné řeči"
 rivalry.1011.desc.poem: "Koluje nová báseň, která mě zesměšňuje; terčem je i [ROOT.GetCharacter.Custom('quirk_neg_noun')] a celé mě to vykresluje v tom nejhorším světle. Nemohu dokázat, že za tím stojí [from_rival.GetTitledFirstName], ale z těch veršů přímo čiší, že v tom má prsty."
 rivalry.1011.desc.rumors: "Všude kolem mě kolují pobuřující zvěsti; terčem je i [ROOT.GetCharacter.Custom('quirk_neg_noun')]. [ROOT.Char.Custom('GetCourt')|U] nevyjímaje. Kamkoli se hnu, pronásleduje mě zlomyslné šeptání a krutý smích. Přesně k takové podlé taktice by se [from_rival.GetTitledFirstName] [Select_CString(from_rival.IsFemale,'snížila','snížil')]!"
 rivalry.1011.a: "Tohle [Select_CString(from_rival.IsFemale,'jí','mu')] oplatím!"
 rivalry.1012.t: "Pošetilé výmysly"
 rivalry.1012.desc.poem: "Právě se ke mně doneslo, že [from_rival.GetTitledFirstName] má na svědomí hanlivou báseň, která si ze mě utahuje kvůli [ROOT.GetCharacter.Custom('quirk_neg_noun')]! Jenže je napsaná tak mizerně, že se místo mě všichni smějí právě autorovi. [from_rival.GetFirstName] se [Select_CString(from_rival.IsFemale,'stala','stal')] terčem posměchu za to, že na takové bláboly vůbec plýtvá dobrým papírem!"
 rivalry.1012.desc.rumors: "Právě se ke mně doneslo, že [from_rival.GetTitledFirstName] se snaží šířit hanlivé zvěsti o tom, co údajně dělám v soukromí. [from_rival.Custom('quirk_neg_adjective')|U]... to je první slovo, které mě při pomyšlení na [from_rival.GetTitledFirstName] napadne. Ty zvěsti jsou totiž tak přitažené za vlasy a neuvěřitelné, že je všichni rovnou zavrhli. Místo toho se teď klábosí o tom, k jak malicherným a zlomyslným praktikám se [from_rival.GetFirstName] [Select_CString(from_rival.IsFemale,'snížila','snížil')]."
 rivalry.1012.a: "Dobře [Select_CString(from_rival.IsFemale,'jí','mu')] tak!"
 rivalry.1013.t: "Zaseté zvěsti"
 rivalry.1013.desc: "Terčem skandálních zvěstí je [rival.GetTitledFirstName] a díky mému přičinění se šíří jedna radost. [rival.Custom('GetCourt')|U] teď žije novým oblíbeným tématem plným klepů a dohadů. Podle všeho vyvolávají marné pokusy ty řeči zastavit čím dál větší podráždění a frustraci!"
 rivalry.1013.a: "[rival.GetTitledFirstName] konečně pozná své místo."
 rivalry.1014.t: "Zvěsti odmítnuty!"
 rivalry.1014.desc.start: "Terčem zvěstí, které se snažím šířit, je [rival.GetTitledFirstName]. Nikdo je ale nebere vážně a všichni je odmítají jako naprosté výmysly. Lidé se teď smějí spíš "
 rivalry.1014.desc.hidden: "tomu, kdo je vymyslel. Prý je taková "
 rivalry.1014.desc.exposed: "mně, protože jsem je [Select_CString(ROOT.Char.IsFemale,'vymyslela','vymyslel')]. Prý je taková "
 rivalry.1014.desc.end: "dětinská a malicherná taktika ubohý způsob, jak pošpinit pověst, kterou má [rival.GetFirstNamePossessive]."
 rivalry.1014.a: "Alespoň se mi podařilo zamést stopy..."
 rivalry.1014.a.exposed: "Tohle rozhodně nebylo v plánu."
 rivalry.1015.t: "Oblíbená báseň"
 rivalry.1015.desc: "Terčem mé jízlivé básně je [rival.GetTitledFirstName] a vtipné rýmy i chytré dvojsmysly se očividně trefily do černého. Báseň se šíří jako požár a nevynechává ani [rival.Custom('GetCourt')]! Ať se [rival.GetTitledFirstName] snaží sebevíc, její šíření nedokáže zastavit, čímž jen prohlubuje vlastní rozpaky!"
 rivalry.1015.a: "[rival.GetTitledFirstName] konečně pozná své místo."
 rivalry.1016.t: "Báseň bez ohlasu"
 rivalry.1016.desc: "Mám za sebou několik básní, které si berou na mušku [rival.GetTitledFirstName]. [rival.Custom('GetCourt')|U] se má stát místem, odkud se rozšíří dál, a tak je nechám kolovat a čekám, až se uchytí.\n\nBohužel se zdá, že mé verše příliš nadšení nevzbuzují... Vlastně se všichni shodují, že jsou to bláboly, které nestojí ani za papír, na němž jsou napsané!"
 rivalry.1016.desc.exposed: "A co hůř, všem je jasné, jak moc [rival.GetTitledFirstName] nenávidím, takže nikdo nepochybuje, kdo ty básně napsal!"
 rivalry.1016.a: "Ještě že pod nimi není mé jméno."
 rivalry.1016.a.exposed: "Co mě to vůbec napadlo?"
 rivalry.1017.t: "Drzá urážka!"
 rivalry.1017.desc: "Právě si [ROOT.GetCharacter.Custom('quirk_pos_adverb')] hledím svého, když ke mně přistoupí [from_rival.GetTitledFirstName] a urazí mě přímo do očí.\n\n„[ROOT.GetCharacter.Custom('quirk_neg_adjective')|U] [ROOT.GetCharacter.Custom2('InsultNoun', SCOPE.sC('from_rival'))], jen tě vidím a chce se mi brečet!“"
 rivalry.1017.a: "Na tuhle urážku odpovím vlastní záplavou nadávek!"
 rivalry.1017.b: "[from_rival.GetTitledFirstName] se mi za ty lži zodpoví v souboji!"
 rivalry.1017.b.tt: "#F V souboji se ukáže, kdo z nás dvou je lepší#!"
 rivalry.1017.c: "Udělám správnou věc a nastavím druhou tvář."
 rivalry.1018.t: "Odplata"
 rivalry.1018.desc: "Když konečně dojde na naši konfrontaci, [rival.GetTitledFirstName] odpoví na mou tirádu záplavou vlastních urážek a nadávek!\n\nCelá výměna působí dětinsky a oba kvůli ní ztrácíme tvář."
 rivalry.1018.a: "[rival.Custom('quirk_neg_adjective')|U] — přesně proto si za to [rival.GetTitledFirstName] může [Select_CString(rival.IsFemale,'sama','sám')]!"
 rivalry.1019.t: "Urážka bez odplaty"
 rivalry.1019.desc: "Když konečně dojde na naši konfrontaci, vyjmenuji jednu chybu za druhou. [rival.GetTitledFirstName] nenajde na svou obranu jediné slovo a já odcházím s jistotou, že tentokrát už zná své místo."
 rivalry.1019.a: "[rival.GetTitledFirstName] přece jen nemá žádnou páteř!"
 rivalry.1020.t: "Výzva za urážku!"
 rivalry.1020.desc: "Naše hádka se rychle vyostří a já se do [rival.GetTitledFirstName] pustím bez zábran. Nakonec dojde i na [rival.Custom('quirk_neg_noun')]. To byla poslední kapka a [rival.GetTitledFirstName] na obranu své cti mě vyzve na souboj!"
 rivalry.1020.a: "Tak pojď, [rival.GetFirstNameNoTooltip]!"
 rivalry.1020.b: "Ehm... není třeba hned sahat k násilí..."
 rivalry.1021.tt: "Drtivé vítězství"
 rivalry.1022.tt: "Těsné vítězství"
 rivalry.1023.tt: "Těsná porážka"
 rivalry.1024.tt: "Potupná porážka"
 rivalry.1021.t: "Drtivé vítězství"
 rivalry.1021.desc: "Souboj začíná a [duel_loser.GetTitledFirstName] mi od první chvíle nestačí. Tlačím na svou výhodu a nedávám čas znovu získat rovnováhu. Brzy [duel_loser.GetTitledFirstNameNoTooltip] udělá chybu a odkryje se. Díky tomu mohu [ROOT.GetCharacter.Custom('SignatureWeaponCritical')] oblasti paže a souboj ukončit!\n\nRychlé a rozhodné vítězství chutná o to sladčeji."
 rivalry.1021.a: "[Select_CString(ROOT.Char.IsFemale,'Dokázala','Dokázal')] jsem, že jsem lepší než [duel_loser.GetFirstNameNoTooltip]!"
 rivalry.1022.t: "Těsné vítězství"
 rivalry.1022.desc: "Jakmile souboj začne, [duel_loser.GetTitledFirstName] mě rychle přesvědčí, že naše síly jsou vyrovnanější, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]. Nějakou dobu si vyměňujeme útoky a kryty a nikdo z nás si nedokáže udržet převahu příliš dlouho.\n\nNakonec nás oba začne zmáhat únava a [duel_loser.GetTitledFirstNameNoTooltip] odkryje obranu. Můžu tak [ROOT.GetCharacter.Custom('SignatureWeaponCritical')] oblasti nohy a souboj ukončit!"
 rivalry.1022.a: "Mé vítězství dokazuje, že jsem [Select_CString(ROOT.Char.IsFemale,'měla','měl')] pravdu."
 rivalry.1023.t: "Těsná porážka"
 rivalry.1023.desc: "Jakmile souboj začne, ukáže se, že [duel_winner.GetTitledFirstName] představuje mnohem větší hrozbu, než se zprvu zdálo. Boj je vyrovnaný, útok střídá kryt a oba čekáme na sebemenší skulinu.\n\nNakonec mě začne zmáhat únava a na okamžik mi klesne kryt. [duel_winner.Custom('signature_weapon')|U] je rázem nebezpečně blízko a [duel_winner.GetFirstName] může [duel_winner.Custom('SignatureWeaponCritical')] oblasti paže."
 rivalry.1023.desc.end: "Silně krvácím a nezbývá mi než souboj vzdát."
 rivalry.1023.desc.death: "Zranění si vybírají svou daň a já se hroutím k zemi."
 rivalry.1023.a: "Příště tě dostanu, [duel_winner.GetTitledFirstNameNoTooltip]!"
 rivalry.1023.a.death: "Je tu taková tma..."
 rivalry.1024.t: "Potupná porážka"
 rivalry.1024.desc: "Sotva souboj začne, [duel_winner.GetTitledFirstName] se na mě okamžitě vrhne! Zaskočeně se snažím znovu získat pevnou půdu pod nohama, ale neúprosné útoky mi nedávají sebemenší šanci se vzpamatovat.\n\nNetrvá dlouho a můj kryt je prolomen. [duel_winner.Custom('signature_weapon')|U] je rázem nebezpečně blízko a [duel_winner.GetFirstName] [duel_winner.Custom('SignatureWeaponCriticalPresent')] oblasti nohy,"
 rivalry.1024.desc.end: "což jasně značí konec souboje. Ta ostudná porážka mě naplňuje ponížením a hanbou!"
 rivalry.1024.desc.death: "a já se hroutím k zemi."
 rivalry.1024.a: "Domů se odkulhám v hanbě."
 rivalry.1025.t: "Hanebná zbabělost"
 rivalry.1025.desc: "Když došlo na souboj, [from_rival.GetTitledFirstName] zbaběle [Select_CString(from_rival.IsFemale,'vycouvala — přestože mě předtím urazila','vycouval — přestože mě předtím urazil')] přímo do očí! Nedovedu si představit nic hanebnějšího než někoho urazit a pak nemít odvahu stát si za svými slovy. Vždycky bylo jasné, že [from_rival.GetTitledFirstName] nemá čest, a teď mám důkaz!"
 rivalry.1025.a: "Alespoň moje čest zůstala neposkvrněná."
 rivalry.1030.t: "Zasahování do manželství"
 rivalry.1030.desc.happy: "Vadí mi, že [Select_CString(rival.IsFemale,'má sokyně','můj sok')] [rival.GetTitledFirstName] a [rival_spouse.GetWifeHusband] [rival_spouse.GetTitledFirstName] si očividně užívají blaženého manželství. Stačilo by mezi ně zasít podezření a přimět je pochybovat jeden o druhém. [rival.GetTitledFirstName] by to přineslo spoustu stresu a starostí."
 rivalry.1030.desc.neutral: "Manželství bez lásky, ve kterém žijí [Select_CString(rival.IsFemale,'má sokyně','můj sok')] [rival.GetTitledFirstName] a [rival_spouse.GetWifeHusband] [rival_spouse.GetTitledFirstName], nabízí lákavou příležitost. Pokud mezi ně zaseji podezření a nedůvěru, [rival.GetFirstName] bude natolik [Select_CString(rival.IsFemale,'zaměstnaná','zaměstnaný')] rozpadajícím se manželstvím, že mi nebude moci kazit plány!"
 rivalry.1030.desc.unhappy: "Není nic neobvyklého na tom, že se [Select_CString(rival.IsFemale,'má sokyně','můj sok')] [rival.GetTitledFirstName] a [rival_spouse.GetWifeHusband] [rival_spouse.GetTitledFirstName] neustále hádají. Pečlivě nastrčený dopis by mohl rozpoutat další hádku. [rival.GetFirstName] by se pak [Select_CString(rival.IsFemale,'musela zabývat manželstvím místo toho, aby mi kazila','musel zabývat manželstvím místo toho, aby mi kazil')] plány..."
 rivalry.1030.a: "Podstrčím dopisy od tajného milence tak, aby je [rival_spouse.GetTitledFirstNameNoTooltip] [Select_CString(rival_spouse.IsFemale,'našla','našel')]."
 rivalry.1030.a.tt: "[rival.GetTitledFirstName] objeví kompromitující důkazy... ale uvěří jim?"
 rivalry.1030.b: "Raději bude [Select_CString(rival.IsFemale,'podezřelá','podezřelý')] [rival.GetTitledFirstNameNoTooltip]."
 rivalry.1030.b.tt: "[rival_spouse.GetTitledFirstName] objeví kompromitující důkazy... ale uvěří jim?"
 rivalry.1030.c: "Zasahovat do cizího manželství už by bylo příliš!"
 rivalry.1030.c.tt: "Prozatím od tohoto plánu upustíš"
 rivalry.1030.a_success: "Úspěšně nastražené důkazy"
 rivalry.1030.a_failure: "Plán selže"
 rivalry.1031.t: "Důkaz nevěry?"
 rivalry.1031.desc: "Dnes jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')] milostný dopis. Z textu je jasné, že [my_spouse.GetWifeHusband] [my_spouse.GetFirstName] je v něm [Select_CString(my_spouse.IsFemale,'oslovena','osloven')] velmi důvěrně. Dopis podrobně líčí jejich poslední milostné dobrodružství a naléhavě se v něm žádá o další setkání!"
 rivalry.1031.desc.fooled: "\n\nDopis není podepsaný a hlavou se mi honí jediná otázka: s kým se [my_spouse.GetWifeHusband] [my_spouse.GetFirstNameNoTooltip] tajně schází?!"
 rivalry.1031.desc.suspicious: "\n\nNejprve mě to rozruší, ale při pozornějším čtení si všimnu, jak je dopis obecný. Žádné osobní podrobnosti, žádný podpis. Tohle mohl napsat kdokoli..."
 rivalry.1031.a.fooled: "Musím zjistit, s kým se [my_spouse.GetFirstNameNoTooltip] tajně schází!"
 rivalry.1031.a.suspicious: "V tichosti zjistím, co se tu děje."
 rivalry.1031.b.fooled: "[my_spouse.GetFirstNameNoTooltip] mi ten dopis vysvětlí přímo do očí!"
 rivalry.1031.b.suspicious: "[my_spouse.GetFirstNameNoTooltip] mi řekne pravdu přímo do očí!"
 rivalry.1031.b.tt: "Zeptáš se přímo, zda ti [my_spouse.GetTitledFirstName] [Select_CString(my_spouse.IsFemale,'byla nevěrná','byl nevěrný')]"
 rivalry.1031.c: "[my_spouse.GetTitledFirstNameNoTooltip] má mou důvěru. Ten dopis musí být padělek!"
 rivalry.1031.c.tt: "Dopis zahodíš"
 rivalry.1032.t: "Obvinění z nevěry"
 rivalry.1032.desc: "[Select_CString(suspicious_spouse.IsFemale,'Má','Můj')] [suspicious_spouse.GetWifeHusband] [suspicious_spouse.GetFirstName] za mnou dnes přijde s dopisem v ruce a tvrdí, že ho napsala má tajná známost! Teď mě obviňuje, že mám poměr!"
 rivalry.1032.a: "[Select_CString(ROOT.Char.IsFemale,'Nebyla jsem ti nevěrná,','Nebyl jsem ti nevěrný,')] přísahám!"
 rivalry.1032.a.tt: "Pokusíš se [suspicious_spouse.GetFirstNameNoTooltip] přesvědčit o své věrnosti"
 rivalry.1032.b: "Musím se přiznat k poměru s [spouse_lover.GetTitledFirstNameNoTooltip]!"
 rivalry.1033.t: "Popření viny"
 rivalry.1033.desc: "Dnes si beru [my_spouse.GetFirstName] stranou kvůli dopisu, který měl pocházet od někoho, s kým má tajný poměr. Obvinění zjevně šokuje a zraňuje, ale [my_spouse.GetFirstNameNoTooltip] trvá na své nevině!"
 rivalry.1033.a: "Důvěřuji [my_spouse.GetFirstNameNoTooltip]. Tohle vysvětlení mi stačí!"
 rivalry.1033.a.tt: "Ukončíš pátrání"
 rivalry.1033.b: "Lži! Budu pátrat dál a zjistím pravdu!"
 rivalry.1034.t: "Slzavé přiznání"
 rivalry.1034.desc: "Když se [my_spouse.GetFirstName] zeptám na dopis od údajné tajné známosti, nakonec se zhroutí a se slzami přizná, že má poměr s [spouse_lover.GetTitledFirstName]!"
 rivalry.1034.a: "Jak mi to [Select_CString(my_spouse.IsFemale,'mohla','mohl')] udělat?"
 rivalry.1035.t: "Padělek odhalen!"
 rivalry.1035.desc: "Při pátrání po původu dopisu, který měl pocházet od osoby, s níž se [my_spouse.GetFirstName] údajně tajně schází, odhalím, že jde o podvrh. A kdo za ním stojí? [instigator.Custom2('InsultAdjective', ROOT.Char)|U] [instigator.Custom2('InsultNoun', ROOT.Char)] [instigator.GetTitledFirstName]!"
 rivalry.1035.a: "Za vměšování do mého manželství [instigator.GetTitledFirstName] zaplatí!"
 rivalry.1036.t: "Slepé uličky"
 rivalry.1036.desc: "Prověřuji jednu stopu za druhou a snažím se vypátrat, kdo poslal [rival_spouse.GetFirstName] ten údajný milostný dopis. Původ dopisu se mi ale stále nedaří zjistit."
 rivalry.1036.a: "Ať tak či onak, [rival_spouse.GetFirstNameNoTooltip] si budu dál hlídat..."
 rivalry.1036.b: "Musím dojít k závěru, že ten dopis je padělek!"
 rivalry.1037.t: "Vměšování do manželství"
 rivalry.1037.desc: "Moji špehové mi hlásí, že mezi [rival.GetTitledFirstName] a [rival_spouse.GetFirstName], [Select_CString(rival_spouse.IsFemale,'manželkou','manželem')], skutečně panuje nové napětí. Zdá se, že můj plán zasít mezi ně nedůvěru vyšel!"
 rivalry.1037.a: "Jejich sváry jsou hudbou pro mé uši!"
 rivalry.1038.t: "Vměšování do manželství"
 rivalry.1038.desc: "Moji špehové mi hlásí, že [rival.GetTitledFirstName] [Select_CString(rival.IsFemale,'odhalila','odhalil')], že dopis, který měl zasít nedůvěru mezi [rival.GetFirstNameNoTooltip] a [rival_spouse.GetFirstName], je padělek. Na mou lest tedy [Select_CString(rival.IsFemale,'nenaletěla','nenaletěl')]!"
 rivalry.1038.a: "Budu muset zkusit něco jiného..."
 rivalry.1039.t: "$rivalry.1037.t$"
 rivalry.1039.desc: "Moji špehové mi hlásí nečekanou novinu: [my_spouse.GetTitledFirstName] [Select_CString(my_spouse.IsFemale,'měla','měl')] poměr už celou dobu! Můj padělaný dopis přitom způsobil, že [my_spouse.GetFirstNameNoTooltip] se [Select_CString(my_spouse.IsFemale,'zhroutila a všechno přiznala','zhroutil a všechno přiznal')] [suspicious_spouse.GetTitledFirstName]!"
 rivalry.1039.a: "No tedy... to #EMP je#! zajímavé."
 rivalry.2001.t: "Překážka přátelství"
 rivalry.2001.desc: "Dnes mi přišel dopis od [target_in_question.GetTitledFirstName], ve kterém se mě ptá, co si myslím o [rival.GetTitledFirstName]. Zdá se, že [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('rival') )] se snaží diplomaticky sblížit s [target_in_question.GetTitledFirstNameNoTooltip]."
 rivalry.2001.a: "Ha! To se [target_in_question.GetFirstNameNoTooltip] opravdu musí ptát?"
 rivalry.2001.b: "Ať si [target_in_question.GetFirstNameNoTooltip] udělá vlastní názor."
 rivalry.2002.t: "Překážka přátelství"
 rivalry.2002.desc: "Usilovně se snažím udělat na [target_in_question.GetTitledFirstName] dobrý dojem, a co nezjistím?\n\nNikdo jiný než [first_rival.GetTitledFirstName] o mně šíří odporné zvěsti, jen aby mé snahy překazil!"
 rivalry.2002.a: "To [target_in_question.GetFirstNameNoTooltip] opravdu věří tomu, co [first_rival.GetFirstNameNoTooltip] napovídá?"
 rivalry.3001.t: "Od desíti k pěti"
 rivalry.3001.desc.opening: "Jako by nestačilo, že [rival.GetTitledFirstName] ztělesňuje ty nejhorší lidské neřesti, teď mě ještě urazí přímo do očí!\n\n"
 rivalry.3001.malicious: "Posel se postará, aby celý [ROOT.Char.Custom('GetCourt')] slyšel každé odporné slovo. „[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))|U] [ROOT.Char.GetTitledFirstName],“ začíná vzkaz a dál je to už jen horší. [rival.Custom2('InsultAdjective', ROOT.Char)|U] [rival.GetWomanMan] má ale drzost!"
 rivalry.3001.benevolent: "Dorazí dopis, který zdánlivě žádá o zlepšení našich vztahů, ale přitom mě oslovuje „[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]“. [rival.GetTitledFirstName] konečně ukazuje pravou tvář!"
 rivalry.3001.dominant: "Dorazí posel, který mě osloví „[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]“ a prakticky si říká o rvačku!"
 rivalry.3001.submissive: "Najdu tajně propašovaný lístek. [ROOT.Char.Custom('GetChamber')|U] — právě tam ho někdo pod rouškou noci zanechal. „[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))|U] [ROOT.Char.GetTitledFirstName],“ stojí na začátku a dál je to už jen horší. [rival.Custom2('InsultAdjective', ROOT.Char)|U] [rival.GetWomanMan] má dokonce tu drzost se pod něj podepsat!"
 rivalry.3001.extroverted: "Právě promlouvám a [ROOT.Char.Custom('GetCourt')] naslouchá, když přede mě předstoupí posel. Pozdraví mě slovy „[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]“ a pak přede všemi dál vláčí mé jméno bahnem!"
 rivalry.3001.emotional: "Dorazí posel s obviněním, že „sabotuju [rival.GetFirstNamePossessiveNoTooltip] celý život“. Pak mě nazve „[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]“ a ještě kolem toho udělá pořádnou scénu."
 rivalry.3001.levelheaded: "Posel si počká na dokonalý okamžik a jakoby náhodou mě osloví „[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]“. Pak předstírá, že šlo jen o nedorozumění."
 rivalry.3001.desc.fallback: "Dorazí posel a přede všemi mě nazve „[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.GetTitledFirstName]“!"
 rivalry.3001.desc.end: "\n\nTohle si nenechám líbit. [rival.GetTitledFirstName] za tu drzost zaplatí."
 rivalry.3001.a: "Jen počkej, [rival.GetTitledFirstNameNoTooltip]!"
 rivalry.3002.t: "Nepřítel mého přítele"
 rivalry.3002.desc: "[friend.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('friend') )], má v poslední době nemalé trápení. [rival.GetTitledFirstName] si zrovna [friend.GetFirstNameNoTooltip] vybral jako terč všech svých podlých intrik.\n\nCopak můžu jen přihlížet, když se takhle zachází s mými přáteli?"
 rivalry.3002.a: "Tohle ti neprojde, [rival.GetTitledFirstNameNoTooltip]!"
 rivalry.3002.b: "[rival.GetTitledFirstNameNoTooltip] nemusí vědět, co si o tom myslím."
 rivalry.3003.t: "Krysy se slézají"
 rivalry.3003.desc: "Zdá se, že [first_friend.GetTitledFirstName] se proti mně [Select_CString(first_friend.IsFemale,'postavila','postavil')]. Důvodem má být mé sokovství s [friend.GetTitledFirstName], [first_friend.Custom2('RelationToMe', SCOPE.sC('friend') )].\n\nMých nepřátel očividně přibývá..."
 rivalry.3003.a: "Pche! Stádo ovcí."
 rivalry.3004.t: "Nejhorší člověk pod sluncem"
 rivalry.3004.opening: "I bez té nenávisti je mi jasné, že s [rival.GetTitledFirstName] bychom se nikdy nesnesli!"
 rivalry.3004.fallback: "\n\nVe všem se [rival.GetTitledFirstName] chová přesně opačně než já!"
 rivalry.3004.a: "Dělá to snad jen proto, aby mě [Select_CString(rival.IsFemale,'provokovala','provokoval')]?!"
