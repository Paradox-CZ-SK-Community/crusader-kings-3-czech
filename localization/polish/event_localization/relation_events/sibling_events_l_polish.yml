l_polish:
 sibling.0001.t: "Zasloužená odměna"
 sibling.0001.desc: "[sibling.GetTitledFirstName] mě žádá o oficiální audienci!\n\n„[Select_CString(sibling.IsFemale,'Drahá','Drahý')] [sibling.Custom2('RelationToMe' , ROOT.GetCharacter )|l], věrně ti sloužím. Není načase mou dobrou práci náležitě odměnit?“"
 sibling.0001.a: "Dám ti vlastní titul i půdu!"
 sibling_promised_land_tt: "[sibling.GetFirstName] bude očekávat, že brzy dostane vlastní titul"
 sibling.0001.b: "Můžeš mě požádat o jakoukoli laskavost."
 sibling.0001.c: "Vezmi si tento dar a dokaž světu, co v tobě je!"
 sibling_funded_for_invasion: "[sibling.GetFirstName] si začne hledat vhodné panství, kde zkusí štěstí."
 sibling_becomes_councillor_tt: "[sibling.GetFirstName] se stane členem mé rady."
 sibling.0001.e: "Neudělalo se nic víc, než bylo tvou povinností!"
 sibling.0002.desc: "[sibling.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], za mnou přichází s připomínkou, že jsem kdysi [Select_CString(ROOT.Char.IsFemale,'slíbila','slíbil')] vlastní půdu a titul.\n\n„Čekám už dost dlouho, [sibling.Custom2('RelationToMe' , ROOT.Char )].“"
 sibling.0002.a: "Zaplatím ti, když na ten slib zapomeneš."
 sibling.0002.b: "Nemám ti co dát."
 sibling.0003.desc: "[sibling.GetFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], za mnou přichází s desátky z nově získaných držav.\n\n„[sibling.Custom2('RelationToMe' , ROOT.Char )|U]! Ať nás tyto dary navždy spojí stejně pevně jako naše krev!“"
 sibling.0003.a: "Za rodinu a panství!"
 sibling.0004.t: "[sibling.Custom('SisterBrother')|U] a [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('vassal') )|U]"
 sibling.0004.opening: "[vassal.GetTitledFirstName] za mnou zase přichází se stížností na [sibling.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )]."
 sibling.0004.fallback: "\n\nJe zřejmé, že spolu prostě nedokážou vyjít, a tentokrát už byla překročena hranice."
 sibling.0004.a: "[sibling.GetFirstNameNoTooltip] jedná mým jménem."
 sibling.0004.b: "Vzpamatuj se, [sibling.GetFirstNameNoTooltip]!"
 sibling.0004.c: "Musím vás snad kárat jako malé děti?!"
 sibling.0005.t: "Zdroj potíží"
 sibling.0005.desc: "Už nějakou dobu je mi jasné, že [sibling.Custom2('MyCharacterIntroduction', ROOT.Char )] jednou narazí.\n\n[vassal.GetTitledFirstName] přichází s požadavkem nejen za sebe, ale jménem všech [ROOT.GetCharacter.Custom('powerful_vassals_loc')|l]. Chtějí, abych s nesnesitelným chováním [sibling.GetTitledFirstName] konečně něco [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]."
 sibling.0005.a: "„Opovaž se tak o [sibling.GetFirstNameNoTooltip] mluvit!“"
 sibling.0005.b: "[sibling.GetFirstNameNoTooltip] se musí naučit, že takové chování je nepřijatelné."
 sibling.0005.c: "Dost bylo dost, [sibling.GetFirstNameNoTooltip]!"
 sibling.1001.t: "Diplomatická podpora"
 sibling.1001.desc: "[sibling.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], za mnou přichází s nápadem, jak dobře využít svůj řečnický talent.\n\n„Mohu tě zastupovat při jednáních, nebo ti dokonce připravovat zprávy a rozkazy.“"
 sibling.1001.a: "Přesně vím, kde bude tvá pomoc nejužitečnější."
 accepted_sibling_help_tt: "Tak cenná pomoc může časem přijít s očekáváním nějaké odměny..."
 sibling.1001.b: "Nechci vůči tobě mít žádný dluh."
 sibling.1002.t: "Vojenské znalosti"
 sibling.1002.desc: "[sibling.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], za mnou přichází a dává jasně najevo své znalosti válečnictví.\n\n„Nech mě pomoci s výcvikem tvých vojáků a budou bojovat jako žádné vojsko, které jsi kdy [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]!“"
 sibling.1002.a: "Přesně vím, kde bude tvá pomoc nejužitečnější."
 sibling.1002.b: "Nechci vůči tobě mít žádný dluh."
 sibling.1003.t: "Tajemství a šepoty"
 sibling.1003.desc: "[sibling.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], nabízí, že mi bude předávat zprávy o všem, co se u mě děje.\n\n„[ROOT.Char.Custom('GetCourt')|U] má svá tajemství. Někdo, komu můžeš opravdu věřit, se ti určitě bude hodit...“"
 sibling.1003.a: "Jedině rodinným poutům mohu skutečně věřit."
 sibling.1003.b: "Ty si opravdu myslíš, že ti věřím?"
 sibling.1004.t: "Tok zlata"
 sibling.1004.desc: "[ROOT.Char.Custom('GetRealmOrDomicile')|U] má své účetní knihy a při jejich procházení se [sibling.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], neubrání smíchu.\n\n„Prosím, dovol mi ukázat tomu, kdo za tenhle chaos odpovídá, jak se to dělá.“"
 sibling.1004.a: "Ano. Ukaž, co umíš, a naplň mou pokladnu."
 sibling.1004.b: "Já vím, oč ti jde — chceš se dostat k mým penězům..."
 sibling.1005.t: "Úvahy o božství"
 sibling.1005.desc: "[sibling.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], má pronikavý úsudek, kterému se málokdo vyrovná.\n\nNyní mi nabízí, že se o své poznatky podělí. [ROOT.Char.Custom('GetCourt')|U] tak získá [Select_CString(sibling.IsFemale,'rádkyni','rádce')] pro všechny duchovní záležitosti."
 sibling.1005.a: "Prosím, [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], veď mou ruku."
 sibling.1005.b: "Svou duši bych ti nikdy nesvěřil."
 sibling.2001.t: "Na obtíž"
 sibling.2001.opening: "Už samotná přítomnost [sibling.GetTitledFirstName] je pro mě k nevydržení."
 sibling.2001.fallback: "\n\nKdyž [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )] zrovna něco omylem nezapaluje nebo neutrácí mé zlato, [ROOT.Char.Custom('GetCourtierPlural')|U] zase mají důvod ke stížnostem."
 sibling.2001.a: "Ach běda, ale rodina je rodina!"
 sibling.2001.b: "Dost bylo dost, [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )]!"
 sibling.8001.t: "Cena rodiny"
 sibling.8001.desc: "[sibling.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , SCOPE.sC('sibling') )], si v rámci svého „kapesného“ bere stále víc a víc mincí.\n\nTeď už to ale přehání: požaduje peníze na obchodní podnik a pak si je všechny nechává!"
 sibling.8001.a: "Ode mě už nic nedostaneš, [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )]!"
 sibling.8002.t: "Štědrá kapsa"
 sibling.8002.desc: "[province.GetName] je místem, kde [sibling.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], naslouchá strastem rolníků a štědře rozdává dary a sliby.\n\nNavíc dává jasně najevo, že všechny tyto laskavosti koná jménem #EMP „[ROOT.Char.GetTitledFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'Dobrá','Dobrý')]“#!..."
 sibling.8002.a: "Dobrá práce, [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )]."
 sibling.8002.b: "To všechno za #EMP MÉ#! zlato?!"
 sibling.8003.t: "Nerozvážnosti"
 sibling.8003.desc: "[sibling.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], má za sebou spoustu špatných rozhodnutí, ale tohle možná překonává všechno: [sibling.Custom('servant_for_romance')] jako milostná známost!"
 sibling.8003.a: "Ach, [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] si přece může dělat, co chce..."
 risk_of_sibling_producing_bastard_tt: "Může to mít následky..."
 sibling.8003.b: "Tenhle románek končí. [sibling.Custom('servant_for_romance')] už nepřipadá v úvahu!"
 sibling.8004.t: "Úcta k nadřízeným"
 sibling.8004.desc: "[province.GetName] má několik vesnic a měst, jejichž rolníky [sibling.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], při cestě značně [Select_CString(sibling.IsFemale,'rozčílila','rozčílil')]. Požaduje nejen ubytování, ale také zacházení, jako by [sibling.GetTitledFirstName] [Select_CString(sibling.IsFemale,'byla','byl')] [ROOT.GetCharacter.Custom2('using_my_title' , SCOPE.sC('sibling') )]. Navíc trestá lidi za sebemenší projev neúcty."
 sibling.8004.a: "Chápu, proč jsou rozčilení."
 peasants_dislike_sibling_tt: "Rolníci v oblasti zvané [province.GetName] nejsou spokojení"
 sibling.8005.t: "Bez uvítání"
 sibling.8005.desc: "Na návštěvu mého dvora má přijet [vassal.GetTitledFirstName]. Přivítání má obstarat [sibling.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )].\n\n[vassal.GetFirstName] se však o několik dní opozdí. Když konečně dorazí, [sibling.GetTitledFirstNameNoTooltip], [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], už kvůli netrpělivosti není nikde k nalezení a host zůstává bez uvítání!"
 sibling.8005.a: "Pár darů to vynahradí."
 sibling.8005.b: "„[sibling.GetFirstNameNoTooltip]!!!“"
 sibling.8006.t: "Tvrdě, ale spravedlivě"
 sibling.8006.desc: "[sibling.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], je právě na návštěvě u dvora, kde vládne [vassal.GetTitledFirstName], když přijde žádost, aby mým jménem [Select_CString(sibling.IsFemale,'rozsoudila','rozsoudil')] spor.\n\n[vassal.GetFirstNameNoTooltip] pak dlouze chválí smysl pro spravedlnost, který [sibling.GetFirstNameNoTooltip] [Select_CString(sibling.IsFemale,'prokázala','prokázal')], a [sibling.Custom('SisterBrotherPossessive')] návštěva očividně udělala skvělý dojem."
 sibling.8006.a: "[sibling.GetFirstNameNoTooltip] by [Select_CString(sibling.IsFemale,'měla','měl')] trávit víc času u [vassal.GetFirstNamePossessiveNoTooltip] dvora."
 sibling.8006.b: "I já mám pár případů. [sibling.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], by je [Select_CString(sibling.IsFemale,'mohla','mohl')] posoudit za mě!"
