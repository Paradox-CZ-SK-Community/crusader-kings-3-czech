l_polish:
 spouse.0001.t: "Co máme společné"
 spouse.0001.desc: "Když se bavíme o životě, [spouse.GetFirstName] a já se často shodneme. Vím, že můj pohled na svět opravdu chápe."
 spouse.0001.a: "Mám štěstí, že jsem s někým, kdo mi rozumí."
 spouse.0002.t: "Co máme společné"
 spouse.0002.desc: "Nedávno mi [first_spouse.GetFirstName] [Select_CString(first_spouse.IsFemale,'řekla','řekl')], že podle [Select_CString(first_spouse.IsFemale,'ní','něj')] patřím k nemnoha lidem, kteří [Select_CString(first_spouse.IsFemale,'jí','mu')] opravdu rozumějí.\n\nPřesně vím, co tím myslí."
 spouse.0002.a: "Poutá nás víc než jen manželství."
 spouse.0003.t: "Co spolu děláme"
 spouse.0003.desc: "Někdy si říkám, že není nikdo, s kým bych raději [Select_CString(ROOT.Char.IsFemale,'trávila','trávil')] čas než s [spouse.GetFirstName]. Ze všeho, co se dá v životě dělat, nás baví tolik stejných věcí."
 spouse.0003.a: "Život lze sdílet mnoha způsoby."
 spouse.0004.t: "Co máme společné"
 spouse.0004.desc: "Ze všech lidí u [ROOT.Char.Custom('GetCourt')], s nimiž by [first_spouse.GetFirstName] [Select_CString(first_spouse.IsFemale,'mohla','mohl')] trávit čas, ho tráví se mnou, kdykoli může.\n\nTo, co spolu podnikáme, [Select_CString(first_spouse.IsFemale,'ji','ho')] opravdu baví!"
 spouse.0004.a: "Život lze sdílet mnoha způsoby."
 spouse.0005.t: "Manželské neshody"
 spouse.0005.desc: "Ať se snažím vysvětlit své jednání sebevíc, [spouse.GetFirstName] mi nikdy úplně nerozumí.\n\nZdá se, že jsme zkrátka naprosto odlišní lidé."
 spouse.0005.a: "Ať chceme, nebo ne, jsme v tom spolu."
 spouse.0006.t: "Manželské neshody"
 spouse.0006.desc: "[from_spouse.GetFirstName] prostě nerozumím. Snaží se mi vysvětlit, proč dělá to, co dělá, ale mně to vůbec nedává smysl.\n\nJsme snad až příliš odlišní?"
 spouse.0006.a: "Vůbec mi to neusnadňuje."
 spouse.0007.t: "Přítel mého přítele"
 spouse.0007.desc: "[friend_in_common.GetTitledFirstName] mi vypráví, jak [Select_CString(spouse.IsFemale,'dobrou přítelkyní','dobrým přítelem')] pro [Select_CString(friend_in_common.IsFemale,'ni','něj')] [spouse.GetFirstName] je. Když vím, jak se [spouse.GetFirstNameNoTooltip] chová k ostatním, vážím si [Select_CString(spouse.IsFemale,'jí','ho')] o to víc."
 spouse.0007.a: "Musím se usmát."
 spouse.0008.t: "Přítel mého přítele"
 spouse.0008.desc: "[first_spouse.GetFirstName] se na mě v poslední době usmívá vřeleji než obvykle a říká, že pohled na mě [Select_CString(first_spouse.IsFemale,'ji','ho')] hřeje u srdce.\n\nZřejmě za to může náš společný přítel [friend_in_common.GetTitledFirstName], který [Select_CString(first_spouse.IsFemale,'jí','mu')] vypráví, jak [Select_CString(ROOT.Char.IsFemale,'dobrou přítelkyní','dobrým přítelem')] jsem!"
 spouse.0008.a: "Děkuji, [friend_in_common.GetFirstNameNoTooltip]!"
 spouse.0008.b: "Kolik času vlastně [first_spouse.GetFirstNameNoTooltip] tráví s [friend_in_common.GetFirstNameNoTooltip]?"
 spouse.0009.t: "Přátelskost budí podezření"
 spouse.0009.desc: "Přestože [spouse.GetFirstName] dávám najevo svou náklonnost, odpovědí je jen chlad a podezřívavost. Prý trávím příliš mnoho času s naším přítelem [friend_in_common.GetTitledFirstName]."
 spouse.0009.a: "Jak se opovažuje?!"
 spouse.0009.has_lover_tooltip: "[spouse.GetFirstNameNoTooltip] to přece nemůže vědět. Nebo snad ano?"
 spouse.1001.t: "Čas strávený spolu"
 spouse.1001.desc: "[spouse.GetFirstName] mi možná není zrovna nejdražší na světě, ale čím víc času spolu trávíme, tím lépe [Select_CString(spouse.IsFemale,'jí','mu')] začínám rozumět."
 spouse.1001.a: "Možná si [Select_CString(spouse.IsFemale,'ji','ho')] časem dokážu i zamilovat."
 spouse.1002.t: "Čas strávený spolu"
 spouse.1002.desc: "Čím víc času spolu trávíme, tím víc si všímám, že si mě [first_spouse.GetFirstName] začíná oblibovat. Říká, že na mně stále objevuje nové stránky."
 spouse.1002.a: "Možná si mě časem dokáže i zamilovat."
 spouse.1003.t: "Čas strávený spolu"
 spouse.1003.desc: "[spouse.GetFirstName] mi k srdci nikdy příliš [Select_CString(spouse.IsFemale,'nepřirostla','nepřirostl')] a čím víc času spolu trávíme, tím lépe začínám chápat proč. Všechno, co dělá, mi alespoň trochu leze na nervy."
 spouse.1003.a: "S tímhle člověkem mám strávit celý život."
 spouse.1004.t: "Čas strávený spolu"
 spouse.1004.desc: "Tohle si nemůžu jen namlouvat. Čím déle jsme spolu, tím podrážděněji [first_spouse.GetFirstName] působí. Kdybych to nevěděl lépe, [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')] bych, že už [Select_CString(first_spouse.IsFemale,'jí','mu')] lezu na nervy!"
 spouse.1004.a: "Na nějakou dobu spolu budeme trávit méně času."
 spouse.2001.t: "Útěcha"
 spouse.2001.opening: "Tolik věcí je třeba udělat a času je tak málo. Nevím, jak bych to všechno [Select_CString(ROOT.Char.IsFemale,'zvládala','zvládal')], nebýt [spouse.GetFirstName], [Select_CString(spouse.IsFemale,'která','který')] mi s láskou stojí po boku."
 spouse.2001.chaste: "\n\nDává mi najevo, že ve všech mých nesnázích stojí při mně alespoň duchem."
 spouse.2001.lustful: "\n\nBěhem vášnivých nocí mi vrací sílu a připomíná mi zápal, který potřebuji k překonání všech překážek."
 spouse.2001.temperate: "\n\nPřipomíná mi, že všeho je třeba s mírou, jinak se nakonec úplně zničím."
 spouse.2001.gluttonous: "\n\nVždycky pozná, kdy potřebuji přijít na jiné myšlenky díky lahodnému jídlu a pití."
 spouse.2001.generous: "\n\nDává ze sebe tolik, jen aby mě [Select_CString(spouse.IsFemale,'podpořila','podpořil')]."
 spouse.2001.greedy: "\n\nVždycky dokáže najít nové příležitosti, které mi pomohou dosáhnout mých cílů."
 spouse.2001.diligent: "\n\nKdyž už je toho na mě příliš, pomůže mi, vezme do ruky brk, kdykoli je třeba, a nikdy si nestěžuje."
 spouse.2001.lazy: "\n\nDbá na to, abych si skutečně [Select_CString(ROOT.Char.IsFemale,'odpočinula','odpočinul')], kdykoli to potřebuji."
 spouse.2001.wrathful: "\n\nVyřizuje za mě nepodstatné záležitosti a spílá poslům, kteří přicházejí s bezvýznamnými dopisy."
 spouse.2001.calm: "\n\nKe všemu přistupuje s rozvahou a pomáhá mi spravovat záležitosti, které nevyžadují okamžitou pozornost."
 spouse.2001.impatient: "\n\nVždycky najde způsob, jak mou práci urychlit a dostat se dříve na konec dlouhého dne."
 spouse.2001.patient: "\n\nDbá na to, abych každé povinnosti [Select_CString(ROOT.Char.IsFemale,'věnovala','věnoval')] potřebný čas, a připomíná mi, že ať to trvá jakkoli dlouho, nakonec vše zvládnu."
 spouse.2001.stubborn: "\n\nPobízí mě dál a nedovolí mi vzdát se, dokud není práce hotová."
 spouse.2001.fickle: "\n\nVždycky mi najde něco nového na práci, abych alespoň na chvíli [Select_CString(ROOT.Char.IsFemale,'přestala','přestal')] myslet na starosti, které mě tíží."
 spouse.2001.humble: "\n\nPřipomíná mi, že práce je mou povinností a nejdůležitější je splnit ji se ctí."
 spouse.2001.arrogant: "\n\nPřipomíná mi, že dělám to, co jsem si [Select_CString(ROOT.Char.IsFemale,'zvolila','zvolil')], a že mě ve skutečnosti nemůže soudit nikdo, jen [ROOT.Char.GetFaith.HighGodName]."
 spouse.2001.deceitful: "\n\nVždycky je tu, aby mě [Select_CString(spouse.IsFemale,'ujistila','ujistil')], že všechno dobře dopadne."
 spouse.2001.honest: "\n\nVždycky mi říká, že i když toho mám mnoho, opravdu věří, že to zvládnu."
 spouse.2001.craven: "\n\nVždycky mi pomůže vykroutit se z povinností, do kterých se mi chce nejméně."
 spouse.2001.brave: "\n\nPovzbuzuje mě, abych se svým problémům [Select_CString(ROOT.Char.IsFemale,'postavila','postavil')] čelem a [Select_CString(ROOT.Char.IsFemale,'nenechala','nenechal')] se tlakem zlomit."
 spouse.2001.shy: "\n\nPomáhá mi skrývat se před úředníky a posly, kteří přinášejí další a další záležitosti k vyřízení."
 spouse.2001.gregarious: "\n\nKdykoli se objeví další záležitost vyžadující mou pozornost, dokáže ji vymluvit ze světa jako nikdo jiný."
 spouse.2001.ambitious: "\n\nPřipomíná mi, proč dělám to, co dělám, a jaká odměna mě na konci čeká."
 spouse.2001.content: "\n\nPřipomíná mi, že na tom všem nakonec až tolik nezáleží. Všechno bude v pořádku, i když některé povinnosti zůstanou nesplněné."
 spouse.2001.arbitrary: "\n\nPomáhá mi rozhodnout, které povinnosti je skutečně nutné splnit a které mohu nechat být."
 spouse.2001.just: "\n\nDbá na to, abych každé záležitosti [Select_CString(ROOT.Char.IsFemale,'věnovala','věnoval')] náležitou pozornost a spravedlivý úsudek."
 spouse.2001.cynical: "\n\nVěnuje mi konejšivé úsměvy a tvrdí, že nakonec není důležité, co skutečně zvládnu. Hlavní je, aby mě ostatní viděli při práci."
 spouse.2001.zealous: "\n\nKdykoli je toho na mě příliš, připojí se ke mně v modlitbě, aby mi [ROOT.Char.GetFaith.HighGodName] dal sílu, kterou potřebuji."
 spouse.2001.paranoid: "\n\nUpozorňuje mě na ty, kdo mi úmyslně působí potíže, a radí mi, koho proto mohu bez výčitek zklamat."
 spouse.2001.trusting: "\n\nPřipomíná mi všechny, kdo spoléhají na to, že jako lenní pán splním svou povinnost, a že každý musí poctivě odvést svůj díl."
 spouse.2001.compassionate: "\n\nJe tak [Select_CString(spouse.IsFemale,'laskavá','laskavý')] a [Select_CString(spouse.IsFemale,'starostlivá','starostlivý')], naslouchá mým obavám a nabízí mi každou radu i podporu, kterou může."
 spouse.2001.callous: "\n\nS těmi „kretény“, kteří mrhají mým časem, nemá žádnou trpělivost a s radostí jim to dá najevo."
 spouse.2001.sadistic: "\n\nČím víc se trápím, tím širší úsměv se [spouse.GetFirstNameNoTooltip] objevuje na tváři, zatímco se lopotím se svými povinnostmi."
 spouse.2001.vengeful: "\n\nNa ty, kdo ode mě žádají příliš mnoho, má pořádně ostrá slova a je skutečnou úlevou poslouchat, jak jejich jména proklíná někdo jiný."
 spouse.2001.forgiving: "\n\nPro mou situaci má velké pochopení a ujišťuje mě, že jakmile tyto stresující časy pominou, zanedbávání ostatních částí mého života mi bude odpuštěno."
 spouse.2001.a: "Nikdo mě nedokáže rozesmát jako [spouse.GetFirstNameNoTooltip]."
 spouse.2002.t: "Dobré slovo"
 spouse.2002.desc: "Během návštěvy se mi podařilo, byť jen na chvíli, upoutat pozornost [told_of_character.GetFirstName]. Možná nastal vhodný okamžik pronést pár dobrých slov o [spouse.GetFirstName]."
 spouse.2002.a: "Povím ti něco o [spouse.GetFirstNameNoTooltip]..."
 spouse.2002.b: "Povím ti něco o sobě..."
 spouse.2003.t: "[Select_CString(spouse.IsFemale,'Žena hodná','Muž hodný')] potlesku"
 spouse.2003.opening: "Během nedávné návštěvy [initial_spouse.GetTitledFirstName] dlouze [Select_CString(initial_spouse.IsFemale,'vyprávěla','vyprávěl')] o [spouse.GetTitledFirstName]."
 spouse.2003.exceptional: "\n\nUpřímně řečeno, až dosud jsem si vůbec [Select_CString(ROOT.Char.IsFemale,'neuvědomovala','neuvědomoval')], jak [Select_CString(spouse.IsFemale,'úžasná žena','úžasný muž')] to je!"
 spouse.2003.a: "Děkuji, že jsi mi [Select_CString(initial_spouse.IsFemale,'otevřela','otevřel')] oči, [initial_spouse.GetFirstNameNoTooltip]!"
 spouse.2004.t: "Podpora od [told_of_character.GetFirstNameNoTooltip]"
 spouse.2004.opening: "Během nedávné návštěvy [initial_spouse.GetFirstName] dlouze [Select_CString(initial_spouse.IsFemale,'rozmlouvala','rozmlouval')] s [told_of_character.GetTitledFirstName]."
 spouse.2004.exceptional: "\n\nAť už [initial_spouse.GetFirstNameNoTooltip] [Select_CString(initial_spouse.IsFemale,'řekla','řekl')] cokoli, muselo to udělat pořádný dojem! Před odjezdem ke mně [told_of_character.GetFirstName] [Select_CString(told_of_character.IsFemale,'přistoupila','přistoupil')] a přátelsky mě [Select_CString(told_of_character.IsFemale,'objala','objal')]!"
 spouse.2004.a: "Co bych si bez [initial_spouse.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'počala','počal')]?"
 spouse.2005.t: "Pozorný posluchač"
 spouse.2005.desc: "Zdá se, že způsob, jakým jsem [Select_CString(ROOT.Char.IsFemale,'mluvila','mluvil')] o [spouse.GetFirstName], na [told_of_character.GetTitledFirstName] opravdu zapůsobil! Před odjezdem [told_of_character.GetTitledFirstName] dokonce [spouse.GetFirstNameNoTooltip] [Select_CString(told_of_character.IsFemale,'objala','objal')]!"
 spouse.2005.a: "A skoro jsem ani [Select_CString(ROOT.Char.IsFemale,'nemusela','nemusel')] přehánět."
 spouse.2006.t: "[Select_CString(spouse.IsFemale,'Žena hodná','Muž hodný')] chvály"
 spouse.2006.good: "\n\n[initial_spouse.GetFirstNameNoTooltip] mi [Select_CString(initial_spouse.IsFemale,'ukázala','ukázal')] nový pohled na to, čeho bych si [Select_CString(ROOT.Char.IsFemale,'měla','měl')] na [spouse.GetFirstName] vážit."
 spouse.2006.a: "Děkuji, že jsi mi [Select_CString(initial_spouse.IsFemale,'otevřela','otevřel')] oči, [initial_spouse.GetFirstNameNoTooltip]."
 spouse.2007.t: "Podpora od [initial_spouse.GetFirstNameNoTooltip]"
 spouse.2007.good: "\n\nAť už [initial_spouse.GetFirstNameNoTooltip] [Select_CString(initial_spouse.IsFemale,'řekla','řekl')] cokoli, muselo to udělat dobrý dojem. Před odjezdem mi [told_of_character.GetFirstName] s úsměvem [Select_CString(told_of_character.IsFemale,'položila','položil')] ruku na rameno!"
 spouse.2007.a: "Co bych si bez [initial_spouse.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'počala','počal')]?"
 spouse.2008.t: "Pozorný posluchač"
 spouse.2008.desc: "Zdá se, že způsob, jakým jsem [Select_CString(ROOT.Char.IsFemale,'mluvila','mluvil')] o [spouse.GetFirstName], na [told_of_character.GetTitledFirstName] opravdu zapůsobil! Teď spolu vycházejí lépe než kdy dřív."
 spouse.2008.a: "Jen jsem [Select_CString(ROOT.Char.IsFemale,'říkala','říkal')] pravdu."
 spouse.2009.t: "[Select_CString(spouse.IsFemale,'Žena','Muž')] budící pochybnosti"
 spouse.2009.bad: "\n\nNevím, zda to byl záměr, ale při poslouchání [initial_spouse.GetFirstName] mě napadlo, že jsem [spouse.GetFirstName] možná [Select_CString(ROOT.Char.IsFemale,'přeceňovala','přeceňoval')]."
 spouse.2009.a: "Děkuji, že jsi mi [Select_CString(initial_spouse.IsFemale,'otevřela','otevřel')] oči, [initial_spouse.GetFirstNameNoTooltip]..."
 spouse.2010.t: "Podpora od [told_of_character.GetFirstNameNoTooltip]"
 spouse.2010.desc: "\n\nAť už [initial_spouse.GetFirstNameNoTooltip] [Select_CString(initial_spouse.IsFemale,'řekla','řekl')] cokoli, na [told_of_character.GetFirstName] to zjevně udělalo špatný dojem. Při odchodu se na mě jen [Select_CString(told_of_character.IsFemale,'podívala a zavrtěla','podíval a zavrtěl')] hlavou."
 spouse.2010.a: "„Co bych si bez [initial_spouse.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'počala','počal')]...“"
 spouse.2011.t: "Pozorný posluchač"
 spouse.2011.desc: "Ať jsem se [Select_CString(ROOT.Char.IsFemale,'snažila','snažil')] opravovat sebevíc, všechno, co jsem o [spouse.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')], znělo spíš jako urážka než jako chvála! Při odchodu [told_of_character.GetFirstName] při pohledu na [spouse.GetFirstNameNoTooltip] jen [Select_CString(told_of_character.IsFemale,'zavrtěla','zavrtěl')] hlavou."
 spouse.2011.a: "Co jsem to [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')]?"
 spouse.2012.t: "Manželská důvěrnost"
 spouse.2012.secret_about_me: "Jsou věci, které před [spouse.GetFirstName] nedokážu dál skrývat. Vím, že by mě [Select_CString(spouse.IsFemale,'pochopila','pochopil')]."
 spouse.2012.secret_about_spouse: "O [spouse.GetFirstName] něco vím. Nemůže dál žít v nevědomosti."
 spouse.2012.secret_about_other: "Přemýšlím, zda se příště, až budeme s [spouse.GetFirstName] o samotě a mimo doslech zvědavých uší, nepodělit o jedno tajemství.\n\nTo, co jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')] o [owner_of_secret.GetTitledFirstName], by [spouse.GetFirstNameNoTooltip] jistě velmi zajímalo."
 spouse.2012.a: "O toto tajemství se s [spouse.GetFirstNameNoTooltip] podělím."
 spouse.2012.a.tt: "Tajemství bude odhaleno [spouse.GetTitledFirstName]"
 spouse.2012.b: "Některé věci je lepší nechat ve tmě."
 spouse.2013.t: "Manželská důvěrnost"
 spouse.2013.opening: "[first_spouse.GetFirstName] mě [Select_CString(first_spouse.IsFemale,'odvedla stranou a vážně se na mě podívala','odvedl stranou a vážně se na mě podíval')]."
 spouse.2013.secret_about_me: "\n\n„Musím se ti svěřit s tajemstvím,“ [Select_CString(first_spouse.IsFemale,'řekla','řekl')]. Když se ke mně [Select_CString(first_spouse.IsFemale,'naklonila a zašeptala','naklonil a zašeptal')] mi do ucha, [Select_CString(ROOT.Char.IsFemale,'vytřeštila','vytřeštil')] jsem oči."
 spouse.2013.secret_about_spouse: "\n\n„Musíš něco vědět,“ [Select_CString(first_spouse.IsFemale,'řekla','řekl')]. Když se ke mně [Select_CString(first_spouse.IsFemale,'naklonila a zašeptala','naklonil a zašeptal')] mi do ucha, [Select_CString(ROOT.Char.IsFemale,'vytřeštila','vytřeštil')] jsem oči."
 spouse.2013.secret_about_other: "\n\n„Musím ti něco říct,“ [Select_CString(first_spouse.IsFemale,'řekla','řekl')]. „Něco o [owner_of_secret.GetTitledFirstName].“ \nKdyž se ke mně [Select_CString(first_spouse.IsFemale,'naklonila a zašeptala','naklonil a zašeptal')] mi do ucha, [Select_CString(ROOT.Char.IsFemale,'vytřeštila','vytřeštil')] jsem oči."
 spouse.2013.a: "Opravdu? To bych nikdy [Select_CString(ROOT.Char.IsFemale,'netušila','netušil')]!"
 spouse.2014.t: "Hrozba?"
 spouse.2014.desc: "Na tom, jak se [agent.GetTitledFirstName] chová v blízkosti [spouse.GetFirstName], když si myslí, že se nikdo nedívá, je něco divného. Neustále [agent.GetFirstNameNoTooltip] vídám, jak pokukuje stranou, potuluje se prázdnými chodbami a bedlivě sleduje každý pohyb [spouse.GetFirstNamePossessive].\n\nObávám se, že něco chystá."
 spouse.2014.a: "[spouse.GetFirstNameNoTooltip] musím varovat!"
 spouse.2014.reveal_tt: "[spouse.GetTitledFirstName] bude [Select_CString(spouse.IsFemale,'varována','varován')], že [agent.GetTitledFirstName] něco chystá."
 spouse.2014.b: "Nejspíš se mýlím."
 spouse.2015.t: "Hrozba?"
 spouse.2015.desc: "[first_spouse.GetFirstName] za mnou [Select_CString(first_spouse.IsFemale,'přišla','přišel')] se starostlivým výrazem v očích. Ztišeným hlasem mi [Select_CString(first_spouse.IsFemale,'pověděla','pověděl')] o velmi podezřelém chování, kterého si [Select_CString(first_spouse.IsFemale,'všimla','všiml')] u [agent.GetTitledFirstName]. [first_spouse.GetFirstNameNoTooltip] [agent.GetFirstNameNoTooltip] přímo [Select_CString(first_spouse.IsFemale,'obvinila','obvinil')] ze spolčení s intrikány!"
 spouse.2015.a: "Děkuji za varování, [first_spouse.GetFirstNameNoTooltip]!"
 spouse.2015.b: "Mohu v tomhle [first_spouse.GetFirstNameNoTooltip] opravdu věřit?"
 spouse.3001.t: "Manželské trápení"
 spouse.3001.desc.opening: "Jako bych už [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] dost vlastních problémů, ještě se musím potýkat s [spouse.GetFirstName]! "
 spouse.3001.desc.fallback: "Pořád něco nedělám dost dobře a každý den přijde nová stížnost."
 spouse.3001.lazy: "[spouse.GetFirstNameNoTooltip] mi nikdy nechce podat pomocnou ruku. Když mám práce nejvíc, schválně podřimuje a klábosí, často přímo přede mnou!"
 spouse.3001.wrathful: "[ROOT.Char.GetFaith.HighGodName] je mi svědkem, že mě výbušná povaha [spouse.GetFirstNamePossessive] dohání k šílenství. Výbuchy vzteku, hádky a nekonečné zášti... Dochází mi trpělivost."
 spouse.3001.deceitful: "V poslední době jsem [Select_CString(ROOT.Char.IsFemale,'odhalila','odhalil')] tolik lží. Většinou jde o bezvýznamné maličkosti, ale zmocňují se mě pochybnosti. Co dalšího přede mnou [spouse.GetFirstName] skrývá...?"
 spouse.3001.paranoid: "[spouse.GetFirstName] mě neustále obviňuje z věcí, které jsem nikdy [Select_CString(ROOT.Char.IsFemale,'neudělala','neudělal')], a má trpělivost je u konce. Skoro mám chuť příště skutečně udělat to, z čeho mě obviní..."
 spouse.3001.impatient: "\n\n[spouse.GetFirstName] má povinnost mě podporovat a mít pro mě pochopení, jenže trpělivost [Select_CString(spouse.IsFemale,'jí','mu')] schází. Přestože se dusím pod tíhou svých povinností, zajímají [Select_CString(spouse.IsFemale,'ji','ho')] jen nesplněné sliby a pozornost, které se [Select_CString(spouse.IsFemale,'jí','mu')] nedostává."
 spouse.3001.arrogant: "[spouse.GetFirstName] zuří kvůli mým náročným povinnostem, ale ne proto, že by [Select_CString(spouse.IsFemale,'měla','měl')] starost o mé blaho. Kdepak, očekává, že [Select_CString(spouse.IsFemale,'jí','mu')] dám přednost před svými povinnostmi [ROOT.Char.GetTitleAsNameNoTooltip]!"
 spouse.3001.sadistic: "\n\nSnažím se věnovat všem svým povinnostem pozornost, kterou si zaslouží, ale cítím, že mi docházejí síly. Kdysi jsem si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')], že u [spouse.GetFirstName] najdu oporu, ale tak naivní už nejsem. Myslím, že [spouse.GetFirstNameNoTooltip] má z mého utrpení skutečně radost!"
 spouse.3001.callous: "Po dlouhém a úmorném dni toužím po soucitu a povzbuzení. [spouse.GetFirstName] mi však nabízí jen štiplavé poznámky a chladné odmítnutí."
 spouse.3001.vengeful: "Přiznávám, jsem jen [Select_CString(ROOT.Char.IsFemale,'žena','muž')] a mám své chyby, ale [spouse.GetFirstName] jich má až příliš! Pamatuje si každý můj prohřešek a co hůř, stále mě za ně trestá."
 spouse.3001.desc.end: "\n\nČlověk by skoro řekl, že se [spouse.GetFirstNameNoTooltip] ze všech sil snaží proměnit můj život v nekonečné utrpení!"
 spouse.3001.a: "Proč mě tak nenávidíš?!"
 spouse.3002.t: "Příležitost k odplatě"
 spouse.3002.desc: "Během návštěvy se mi podařilo, byť jen na chvíli, upoutat pozornost [told_of_character.GetTitledFirstName]. Možná nastal vhodný okamžik vysvětlit, co by si o [spouse.GetFirstName] [Select_CString(told_of_character.IsFemale,'měla','měl')] doopravdy myslet."
 spouse.3002.a: "Povím ti pár věcí, [told_of_character.GetFirstNameNoTooltip]."
 spouse.3002.a.great: "Přesvědčivé historky"
 spouse.3002.a.great_tt: "#F [told_of_character.GetFirstNameNoTooltip] je [Select_CString(told_of_character.IsFemale,'zděšená','zděšený')]#!"
 spouse.3002.a.good: "Znepokojivé historky"
 spouse.3002.a.good_tt: "#F Má slova [told_of_character.GetFirstNameNoTooltip] přesvědčí#!"
 spouse.3002.a.bad: "Potupná slova"
 spouse.3002.a.bad_tt: "#F [told_of_character.GetFirstNameNoTooltip] je [Select_CString(told_of_character.IsFemale,'pobouřená','pobouřený')], že takhle mluvím o svém protějšku#!"
 spouse.3002.b: "Takhle za zády svého protějšku jednat nemohu."
 spouse.3003.t: "Znepokojivý rozhovor"
 spouse.3003.opening: "Během nedávné návštěvy jsem nějaký čas [Select_CString(ROOT.Char.IsFemale,'rozmlouvala','rozmlouval')] s [initial_spouse.GetTitledFirstName], [Select_CString(initial_spouse.IsFemale,'partnerkou','partnerem')] [spouse.GetTitledFirstName]."
 spouse.3003.exceptional: "\n\n[spouse.GetFirstName] jsem si dosud velmi [Select_CString(ROOT.Char.IsFemale,'vážila','vážil')], ale to, co mi [initial_spouse.GetFirstNameNoTooltip] [Select_CString(initial_spouse.IsFemale,'řekla','řekl')], mě naprosto vyděsilo!"
 spouse.3003.a: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem k tobě až příliš [Select_CString(ROOT.Char.IsFemale,'laskavá','laskavý')], [spouse.GetFirstNameNoTooltip]!"
 spouse.3004.t: "Znepokojivý rozhovor"
 spouse.3004.opening: "Během nedávné návštěvy [Select_CString(told_of_character.IsFemale,'věnovala','věnoval')] [told_of_character.GetTitledFirstName] znepokojivě mnoho času rozhovoru s [initial_spouse.GetFirstName], [Select_CString(initial_spouse.IsFemale,'která','který')] ke mně zrovna nechová mnoho lásky."
 spouse.3004.exceptional: "\n\nMé nejhorší obavy se potvrdily při odjezdu, kdy se na mě [told_of_character.GetFirstName] před rozloučením [Select_CString(told_of_character.IsFemale,'odmítla','odmítl')] byť jen podívat!"
 spouse.3004.a: "Co jsi [Select_CString(told_of_character.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')]?!"
 spouse.3005.t: "Dobrý posluchač"
 spouse.3005.exceptional: "To, co jsem [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')] o [spouse.GetFirstName], očividně zapůsobilo. [told_of_character.GetFirstName] [Select_CString(told_of_character.IsFemale,'vytřeštila','vytřeštil')] oči a nevěřícně [Select_CString(told_of_character.IsFemale,'zamumlala','zamumlal')]: „To přece není možné...“"
 spouse.3005.a: "Ale je. Všechno do posledního slova."
 spouse.3006.t: "Znepokojivý rozhovor"
 spouse.3006.good: "\n\n[spouse.GetFirstName] jsem si dosud velmi [Select_CString(ROOT.Char.IsFemale,'vážila','vážil')], ale podle toho, co mi [initial_spouse.GetFirstNameNoTooltip] [Select_CString(initial_spouse.IsFemale,'řekla','řekl')], je [spouse.GetFirstNameNoTooltip] spíš zklamáním."
 spouse.3006.a: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem k tobě příliš [Select_CString(ROOT.Char.IsFemale,'laskavá','laskavý')], [spouse.GetFirstNameNoTooltip]."
 spouse.3007.t: "Znepokojivý rozhovor"
 spouse.3007.good: "\n\nMé obavy byly oprávněné. Při odjezdu na mě [told_of_character.GetFirstName] jen [Select_CString(told_of_character.IsFemale,'pohlédla','pohlédl')] a [Select_CString(told_of_character.IsFemale,'zavrtěla','zavrtěl')] hlavou."
 spouse.3007.a: "Co jsi [Select_CString(told_of_character.IsFemale,'jí','mu')] [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')]?"
 spouse.3008.t: "Dobrý posluchač"
 spouse.3008.good: "To, co jsem [told_of_character.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')] o [spouse.GetFirstName], muselo zapůsobit. Když nastal čas odjezdu, [told_of_character.GetFirstNameNoTooltip] se na [spouse.GetFirstNameNoTooltip] jen [Select_CString(told_of_character.IsFemale,'podívala','podíval')] a [Select_CString(told_of_character.IsFemale,'zavrtěla','zavrtěl')] hlavou."
 spouse.3008.a: "Nemělo by mě překvapovat, jakou mi to dělá radost."
 spouse.3009.t: "Příjemné překvapení"
 spouse.3009.bad: "\n\n[spouse.GetFirstName] jsem si vždy velmi [Select_CString(ROOT.Char.IsFemale,'vážila','vážil')] a to, co mi [initial_spouse.GetFirstNameNoTooltip] [Select_CString(initial_spouse.IsFemale,'řekla','řekl')], jen potvrzuje, že oprávněně!"
 spouse.3009.a: "[Select_CString(spouse.IsFemale,'Žena hodná','Muž hodný')] mé úcty."
 spouse.3010.t: "Příjemné překvapení"
 spouse.3010.bad: "\n\n[Select_CString(ROOT.Char.IsFemale,'Nemusela','Nemusel')] jsem se obávat. [told_of_character.GetFirstName] mi později [Select_CString(told_of_character.IsFemale,'řekla','řekl')], že díky [initial_spouse.GetFirstName] na mně [Select_CString(told_of_character.IsFemale,'objevila','objevil')] stránky, kterých si dříve pořádně [Select_CString(told_of_character.IsFemale,'nevážila','nevážil')]!"
 spouse.3010.a: "[initial_spouse.GetFirstNameNoTooltip] o mně [Select_CString(initial_spouse.IsFemale,'mluvila','mluvil')] dobře? Opravdu?"
 spouse.3011.t: "Strašlivé nedorozumění"
 spouse.3011.bad: "Ať jsem se [Select_CString(ROOT.Char.IsFemale,'snažila','snažil')] vykreslit [spouse.GetFirstName] v sebehorším světle, [told_of_character.GetFirstName] si [Select_CString(told_of_character.IsFemale,'myslela','myslel')], že [spouse.GetFirstNameNoTooltip] chválím! Teď spolu zřejmě vycházejí lépe než kdy dřív."
 spouse.3011.a: "Co jsem to [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')]?"
 spouse.3012.t: "Hrozba..."
 spouse.3012.opening: "Přestože je [spouse.GetFirstName] naprosto k ničemu, zdá se, že si svůj život u [ROOT.Char.Custom('GetCourt')] užívá až příliš pohodlně."
 spouse.3012.agent_suspicious: "\n\nKdyž se podělím o podezřelé chování, kterého jsem si [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')] u [agent.GetTitledFirstName], pohodlí [spouse.GetFirstNameNoTooltip] trochu naruším."
 spouse.3012.agent_probably_innocent: "\n\nKdyž budu tvrdit, že jsem u [agent.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale,'pozorovala','pozoroval')] krajně podezřelé chování, pohodlí [spouse.GetFirstNameNoTooltip] trochu naruším."
 spouse.3012.a: "[spouse.GetFirstNameNoTooltip] se musí o této „hrozbě“ dozvědět!"
 spouse.3012.false_reveal_tt: "[spouse.GetFirstNameNoTooltip] bude „[Select_CString(spouse.IsFemale,'varována','varován')]“ před [agent.GetFirstNameNoTooltip]."
 spouse.3012.b: "Ani nebudu předstírat, že chci svému protějšku pomoci."
 spouse.3013.t: "Hrozba?"
 spouse.3013.desc: "[initial_spouse.GetFirstName] za mnou [Select_CString(initial_spouse.IsFemale,'přišla','přišel')] se starostlivým výrazem v očích. Ztišeným hlasem mi [Select_CString(initial_spouse.IsFemale,'pověděla','pověděl')] o velmi podezřelém chování, kterého si [Select_CString(initial_spouse.IsFemale,'všimla','všiml')] u [agent.GetTitledFirstName]. [initial_spouse.GetFirstNameNoTooltip] [agent.GetFirstNameNoTooltip] přímo [Select_CString(initial_spouse.IsFemale,'obvinila','obvinil')] ze spolčení s intrikány!"
 spouse.3013.a: "Mohu v tomhle [initial_spouse.GetFirstNameNoTooltip] opravdu věřit?"
