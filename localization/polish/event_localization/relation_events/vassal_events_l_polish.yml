l_polish:
 vassal.1001.t: "Jak si [ROOT.Char.GetFaith.HighGodName|U] přeje"
 vassal.1001.desc: "[religious_liege.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_liege'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))], prochází mými državami. Při prohlídce budov [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_liege'))] a zamračí se.\n\n„Víš, co tomuto pohledu chybí? [religious_liege.GetFaith.HouseOfWorship] – velkolepá pocta! [religious_liege.GetFaith.HighGodName] si ji zaslouží!“"
 vassal.1001.a: "Slibuji, že tu [ROOT.Char.GetFaith.HouseOfWorship] vyroste!"
 vassal.1001.a.tt: "#F [religious_liege.GetFirstNameNoTooltip] si tvůj slib zapamatuje a pokud ho do deseti let splníš, bude ti dlužit [Concept('favor','laskavost')|E]#!"
 vassal.1001.b_zealous: "Kdo si myslíš, že jsi?! [ROOT.Char.GetFaith.HighGodName] rozhoduje, ne ty!"
 vassal.1001.b: "Nic takového není potřeba."
 vassal.1010.desc: "„Tentokrát ses opravdu [Select_CString(ROOT.Char.IsFemale,'překonala','překonal')], [ROOT.Char.GetFirstNameNoTooltip]. To je vskutku nádherná stavba.“ [religious_liege.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))], [religious_liege.Custom('quirk_pos_present')] a gestem ukáže k novostavbě. [religious_liege.GetFaith.HouseOfWorship] už stojí v celé své kráse.\n\n„Nepochybuji, že i [religious_liege.GetFaith.HighGodName] má z té stavby radost!“"
 vassal.1010.a: "[religious_liege.GetFaith.HighGodName] je smyslem mého života."
 vassal.1020.desc_religious: "„Tak zbožný člověk, a přesto dáváš plané sliby... A zrovna slib, že [religious_liege.GetFaith.HouseOfWorship] bude stát! [religious_liege.GetFaith.HighGodName] na takové sliby nezapomíná!“"
 vassal.1020.desc_not_as_religious: "„[ROOT.Char.GetFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'lhala','lhal')] jsi mi... A zrovna slib, že [religious_liege.GetFaith.HouseOfWorship] bude stát!“"
 vassal.1020.desc: "\n\n[religious_liege.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_liege'))], se netají nelibostí. Přitom [religious_liege.Custom('quirk_neg_present')]."
 vassal.1020.a: "Chybovat je lidské!"
 vassal.1020.a_religious: "Doufám, že mi [religious_liege.GetFaith.HighGodName] odpustí..."
 vassal.1020.a.tt: "#F Možná jsem [Select_CString(ROOT.Char.IsFemale,'měla','měl')] svůj slib dodržet a postarat se o slíbenou stavbu: [THIS.Char.GetFaith.HouseOfWorship]...#!"
 vassal.1101.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [Select_CString(religious_vassal.IsFemale,'všimla','všiml')] jsem si, že ve tvých državách je místo, kde může vzniknout [religious_vassal.GetFaith.HouseOfWorship].“\n\n[religious_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('religious_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))], [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('religious_vassal'))] a pokračuje: „Pokud tu stavbu skutečně vybuduješ, získáš [religious_vassal.GetFaith.HighGodNameAlternatePossessive] vděk stejně jako můj.“"
 vassal.1101.a.tt: "#F [religious_vassal.GetFirstNameNoTooltip] si tvůj slib zapamatuje a pokud ho do deseti let splníš, bude ti dlužit [Concept('favor','laskavost')|E]#!"
 vassal.1110.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Tentokrát ses opravdu [Select_CString(ROOT.Char.IsFemale,'překonala','překonal')]! To je vskutku nádherná stavba.“ [religious_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))], [religious_vassal.Custom('quirk_pos_present')] a gestem ukáže k novostavbě. [religious_vassal.GetFaith.HouseOfWorship] už stojí v celé své kráse.\n\n„Nepochybuji, že i [religious_vassal.GetFaith.HighGodName] má z té stavby radost!“"
 vassal.1110.a: "[religious_vassal.GetFaith.HighGodName] je smyslem mého života."
 vassal.1120.desc_religious: "„Tak zbožný člověk, a přesto dáváš plané sliby... A zrovna slib, že [religious_vassal.GetFaith.HouseOfWorship] bude stát! [religious_vassal.GetFaith.HighGodName] na takové sliby nezapomíná!“"
 vassal.1120.desc_not_as_religious: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [Select_CString(ROOT.Char.IsFemale,'lhala','lhal')] jsi mi... A zrovna slib, že [religious_vassal.GetFaith.HouseOfWorship] bude stát!“"
 vassal.1120.desc: "[religious_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('religious_vassal'))], [religious_vassal.Custom('quirk_neg_present')] a zavrtí hlavou.\n\n„Snad ti [religious_vassal.GetFaith.HighGodNameAlternate|U] odpustí.“"
 vassal.1120.a: "Chybovat je přece lidské!"
 vassal.1120.a.tt: "#F Možná jsem [Select_CString(ROOT.Char.IsFemale,'měla','měl')] svůj slib dodržet a postarat se o slíbenou stavbu: [THIS.Char.GetFaith.HouseOfWorship]...#!"
 vassal.2001.t: "Výchova mládeže"
 vassal.2001.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], myslím, že [child_to_educate.GetFirstName] by se pod tvým vedením [Select_CString(child_to_educate.IsFemale,'mohla','mohl')] hodně naučit.“\n\nPohled [vassal_proposing_education.GetTitledFirstNamePossessive] spočine na [child_to_educate.GetFirstName]. Pak [vassal_proposing_education.Custom2('RelationToMe', SCOPE.sC('child_to_educate'))] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('child_to_educate'))] a zamává nám."
 vassal.2001.a: "Dobrá, [child_to_educate.Custom('GirlBoy')] se bude učit pod mým vedením."
 vassal.2001.b: "[Select_CString(child_to_educate.IsFemale,'Tvá','Tvůj')] [child_to_educate.Custom('GetDaughterSon')] je tvoje odpovědnost!"
 vassal.2101.t: "Náruživý hodovník"
 vassal.2101.desc: "„Už je to mnoho měsíců, co se páni a dámy panství sešli u hostiny. A přece jsi [ROOT.Char.GetTitleTierName]!“\n\n[party_vassal.GetTitledFirstName] [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', party_vassal)] pokračuje: „Prospělo by ti – a samozřejmě i nám, kteří máme rádi dobrou hostinu – kdyby se to brzy napravilo!“"
 vassal.2101.a: "Slibuji, že brzy uspořádám hostinu!"
 vassal.2101.a_hyped: "Samozřejmě že musíme hodovat! Nechápu, proč to trvalo tak dlouho."
 vassal.2101.a.tt: "#F [party_vassal.GetFirstNameNoTooltip] si tvůj slib zapamatuje a pokud ho do deseti let splníš, bude ti [Select_CString(party_vassal.IsFemale,'vděčná','vděčný')]#!"
 vassal.2101.b: "Hostinu uspořádám, až se mi zachce."
 vassal.2101.b_arrogant: "Kdo si vůbec myslíš, že jsi?!"
 vassal.2101.b_greedy: "Víš vůbec, kolik by to stálo?!"
 vassal.2101.b_lazy: "Jednou se k tomu určitě dostanu..."
 vassal.2101.b_shy: "Hostina? S lidmi? To tedy ne..."
 vassal.2110.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Tentokrát ses opravdu [Select_CString(ROOT.Char.IsFemale,'překonala','překonal')]!“\n\n[party_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('party_vassal'))], se zřejmě ještě vzpamatovává z dlouho slibované hostiny, ale náladu má přesto výbornou."
 vassal.2110.a: "Na tuhle hostinu se jen tak nezapomene!"
 vassal.2120.desc_party: "„Že zrovna [ROOT.Char.GetWomanMan] jako ty, s takovou láskou k dobré zábavě, dává plané sliby... Musím přiznat, že mě to zklamalo.“"
 vassal.2120.desc_regular: "„Že zrovna [party_vassal.Custom2('DescriptorPositive', ROOT.Char)] [ROOT.Char.GetWomanMan] jako ty dává plané sliby... Musím přiznat, že mě to zklamalo.“"
 vassal.2120.desc: "\n\n[party_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('party_vassal'))], [party_vassal.Custom('quirk_neg_present')] a zavrtí hlavou."
 vassal.2120.a: "To mi muselo vypadnout z hlavy!"
 vassal.2201.t: "Finanční výpomoc"
 vassal.2201.desc: "„Jako [ROOT.Char.GetTitleTierName] jistě víš, jak vrtkavá může být pokladna. Nemohu si nevšimnout, že by se ti hodila finanční výpomoc.“\n\n[vassal_loan_holder.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_loan_holder'))], [vassal_loan_holder.Custom('quirk_pos_present')] a navrhne dohodu: půjčku, která by ulevila mé pokladně."
 vassal.2201.a: "Děkuji za pomoc, [vassal_loan_holder.GetFirstNameNoTooltip]."
 vassal.2201.a.money_loan_tooltip: "[vassal_loan_holder.GetFirstNameNoTooltip] ti půjčí [gold_i] #bold [THIS.Var('amount_to_loan_root').GetValue]#! zlatých."
 vassal.2201.a.repay_loan: "Půjčku budeš muset splatit pomocí rozhodnutí #bold Splatit půjčku#!."
 vassal.2201.b: "Nejsem #EMP tak#! [Select_CString(ROOT.Char.IsFemale,'zoufalá','zoufalý')]!"
 vassal.2205.desc_inherited: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], kdysi ti byla poskytnuta půjčka člověkem, který už nežije. Na jedné straně ty, na druhé [vassal_loan_holder.Custom2('RelationToMe', SCOPE.sC('original_lender'))].“\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] a pokračuje: „Po smrti této osoby přešla pohledávka na mě. Teď žádám o splacení.“"
 vassal.2205.desc_inherited_loan: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], kdysi došlo k půjčce mezi mnou a někým, kdo už nežije. Na jedné straně já, na druhé [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_loaner'))].“\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] a pokračuje: „Po smrti této osoby přešla povinnost splatit půjčku na tebe.“"
 vassal.2205.desc_all_new_char: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tahle půjčka kdysi vznikla mezi dvěma lidmi, kteří už nežijí. Na jedné straně [vassal_loan_holder.Custom2('RelationToMe', SCOPE.sC('original_lender'))], na druhé [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_loaner'))].“\n\n[vassal_loan_holder.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('vassal_loan_holder'))] a pokračuje: „Pohledávka přešla na mě a dluh na tebe.“"
 vassal.2205.desc_first_time: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], doufám, že ti půjčka dobře posloužila?“\n\n[vassal_loan_holder.GetTitledFirstName] stojí přede mnou a žádá o vrácení půjčeného zlata."
 vassal.2205.desc_second_time: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tahle hra mě nebaví. Dlužíš mi a doufám, že tvůj slib o splacení nebyla lež.“\n\n[vassal_loan_holder.GetTitledFirstName] [vassal_loan_holder.Custom('quirk_neg_present')]. Už podruhé stojí přede mnou a čeká na své peníze."
 vassal.2205.desc_three_times: "„Už mě to unavuje, [ROOT.Char.Custom('FormOfAddressForLiege')]! Naposledy se ptám po dobrém: kde jsou peníze, které mi dlužíš?“\n\n[vassal_loan_holder.Custom('quirk_neg_pp')|U]. [vassal_loan_holder.GetTitledFirstName] dává svou nelibost jasně najevo a trpělivost je očividně u konce."
 vassal.2205.desc_more_times: "„Kdyby mi od začátku bylo jasné, co jsi zač — [ROOT.Char.Custom2('InsultAdjectiveArticle', SCOPE.sC('vassal_loan_holder'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('vassal_loan_holder'))] — a kolik je v tobě nepoctivosti, k žádné půjčce by nikdy nedošlo.“\n\nPeníze v mé pokladně jsou jen slabou útěchou, když vidím [vassal_loan_holder.GetTitledFirstNamePossessive] znechucení. Než odejde, [vassal_loan_holder.Custom('quirk_neg_present')]."
 vassal.2205.z: "Tady! Vezmi si to a zmiz!"
 vassal.2205.a: "Samozřejmě dostaneš své zlato!"
 vassal.2205.a.tt: "#F Půjčku je nejlepší splatit co nejdříve!#!"
 vassal.2205.b: "Neobtěžuj mě takovými malichernostmi."
 vassal.2205.c_greedy: "Koho se snažím obelhat? To zlato je skvělá útěcha!"
 vassal.2205.c: "Ale byla to spousta peněz..."
 vassal.2301.t: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('skilled_vassal'))|U] s mimořádnými schopnostmi"
 vassal.2301.desc_opening: "[skilled_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] opakovaně prokazuje mimořádné schopnosti,"
 vassal.2301.desc_diplomacy: "zejména v diplomatických záležitostech."
 vassal.2301.desc_martial: "zejména ve vojenství."
 vassal.2301.desc_stewardship: "zejména ve správních záležitostech."
 vassal.2301.desc_intrigue: "zejména v #EMP choulostivých#! záležitostech."
 vassal.2301.desc_learning: "zejména v otázkách učenosti."
 vassal.2301.desc_ending: "\n\n„Mám několik projektů a [develop_county.GetName] je pro ně ideální místo. Samozřejmě jen s tvým požehnáním.“"
 vassal.2301.a: "Vezmi to do svých rukou, [skilled_vassal.GetFirstNameNoTooltip]!"
 vassal.2301.b_diplomacy: "Ne, tentokrát se budeš řídit #EMP mými#! diplomatickými zkušenostmi."
 vassal.2301.b_martial: "Vojenství? Pche! Ty úpravy provedu #EMP osobně#!."
 vassal.2301.b_stewardship: "Tuhle správní záležitost zvládnu bez pomoci."
 vassal.2301.b_intrigue: "Tak choulostivá záležitost patří do #EMP mých#! rukou."
 vassal.2301.b_learning: "K řešení této záležitosti mám mnohem lepší předpoklady."
 vassal.2301.c: "Vazalové by si takovou volnost neměli dovolovat."
 vassal.2401.t: "Záblesk naděje"
 vassal.2401.desc_family: "„Víš, kdo pro tebe jsem — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_needs_gold'))]. Potřebuji finanční pomoc.“"
 vassal.2401.desc_other: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], potřebuji finanční pomoc. A ty jsi přece [ROOT.Char.GetTitleTierName].“"
 vassal.2401.desc: "\n\n[vassal_needs_gold.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_needs_gold'))], se na mě [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', SCOPE.sC('vassal_needs_gold'))] podívá a pokračuje: „Dokonce nabízím ústupky... Prosím, vím, že máš prostředky mi pomoci!“"
 vassal.2401.a: "[possible_county.GetNameNoTierNoTooltip] za zlato? To zní rozumně."
 vassal.2401.b: "Tvoje smlouva je už teď #EMP velmi#! výhodná..."
 vassal.2401.c: "Copak se o své zlato nedokážeš postarat?!"
 vassal.2451.t: "Lepší smlouva"
 vassal.2451.desc: "[negotiating_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('negotiating_vassal'))], ke mně přichází. Je [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('negotiating_vassal'))] a usmívá se.\n\n„Bylo by skvělé, kdybychom mohli... znovu projednat mou smlouvu. Koneckonců jsi [ROOT.Char.GetTitleTierName]. Za každé zlepšení samozřejmě nabídnu zlato z pokladny nebo část svých držav.“"
 vassal.2451.a: "[possible_county.GetNameNoTierNoTooltip] mě #EMP skutečně#! zajímá..."
 vassal.2451.b: "Moje pokladna by doplnění rozhodně potřebovala."
 vassal.2451.c: "Tady se žádné dohody nedočkáš, [negotiating_vassal.GetFirstNameNoTooltip]."
 vassal.2501.t: "Prosba o mír"
 vassal.2501.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tahle válka...“ [peaceful_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('peaceful_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peaceful_vassal'))], si povzdechne a pokračuje: „Vojsko tím trpí — my všichni tím trpíme. Musím přiznat, že začínám pochybovat.“\n\nMožná je načase něco udělat, aby ty rostoucí pochybnosti polevily?"
 vassal.2501.a: "Menší tlak by možná pomohl."
 vassal.2501.b: "Musím ti připomínat, kdo je tady [ROOT.Char.GetTitleTierName]?!"
 vassal.2501.c: "Musíš se naučit držet své pochybnosti na uzdě."
 vassal.2601.t: "Touha po válce"
 vassal.2601.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [holder_of_claim.GetTitledFirstName] ti dává důvod k útoku, a přesto váháš...“ [warmongering_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('warmongering_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmongering_vassal'))], [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('warmongering_vassal'))] a pokračuje: „Proč? Mír trvá už příliš dlouho. Téhle příležitosti musíš využít!“"
 vassal.2601.a: "Máš pravdu, [warmongering_vassal.GetFirstNameNoTooltip]!"
 vassal.2601.a.tt: "#F [warmongering_vassal.GetFirstName] si tvůj slib zapamatuje#!"
 vassal.2601.b: "Nenechám se dotlačit k unáhlenému činu."
 vassal.2610.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], tohle bylo správné rozhodnutí. [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('recipient'))|U] [recipient.GetTitledFirstName] ještě pozná, co dokážeme! A [claim_to_fight_for.GetNameNoTier] připadne tobě!“"
 vassal.2610.a: "Tuhle válku vyhrajeme!"
 vassal.2620.desc: "[warmongering_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('warmongering_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('warmongering_vassal'))], [warmongering_vassal.Custom('quirk_neg_present')].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [holder_of_claim.GetTitledFirstName] dosud [Select_CString(holder_of_claim.IsFemale,'nepoznala','nepoznal')] tvůj hněv ani tvé vojsko. Proč mi slibuješ válku, kterou vůbec nehodláš rozpoutat?“"
 vassal.2620.a: "Prostě se toho děje tolik..."
 vassal.2701.t: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('teacher'))|U] – [ROOT.Char.Custom('CommanderTraitBeingTaughtNoTooltip')]"
 vassal.2701.desc: "[teacher.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('teacher'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('teacher'))], vyniká ve vojenství – zvlášť v oblastech, kde mám co dohánět."
 vassal.2701.a: "Naučíš mě to, [teacher.GetFirstNameNoTooltip]?"
 vassal.2701.a.tt: "Nezískáš [Concept('trait','rys')|E] [THIS.Char.Custom('CommanderTraitBeingTaught')]"
 vassal.2701.a.random_list.success: "Výcvik je úspěšný"
 vassal.2701.a.random_list.failure: "Výcvik je neúspěšný"
 vassal.2701.c: "Mám na práci důležitější věci!"
 vassal.2702.desc_success_inclination: "„Působivé, [ROOT.Char.Custom('FormOfAddressForLiege')]!“\n\nMožná není překvapením, že mi učení [teacher.GetTitledFirstName] jde tak dobře, ale výsledek mě přesto těší."
 vassal.2702.desc_success_no_inclination: "„Působivé, [ROOT.Char.Custom('FormOfAddressForLiege')]!“\n\nVojenství mi nikdy nešlo samo od sebe, ale učení [teacher.GetTitledFirstName] vstřebávám s takovým zápalem a obratností, že se nestačím divit."
 vassal.2702.desc_failure: "Ani přes veškerou snahu [teacher.GetTitledFirstName] mi nic z vysvětlování ani ukázek nedává smysl. Tohle nemá budoucnost."
 vassal.2702.a: "Konečně chápu, proč kolem toho všichni dělají takový povyk!"
 vassal.2702.b: "Je problém ve výuce, nebo ve mně?"
 vassal.2801.t: "Požadavky lenního pána"
 vassal.2801.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip], nemohu si nevšimnout, že [develop_county.GetNameNoTier] už dlouho čeká na nějaké zlepšení, přestože prostředky na takové projekty očividně máš.“"
 vassal.2801.a: "Hned se o to postarám!"
 vassal.2801.b: "Kdyby tak ubylo mých ostatních povinností..."
 vassal.2901.t: "[claim_to_propose.GetNameNoTier|U]"
 vassal.2901.desc: "„Jako [ROOT.Char.GetTitleTierName] máš ve svém držení něco – jedno místo – co by mělo patřit mně.“\n\n[claim_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('claim_vassal'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('claim_vassal'))], přichází se svým požadavkem. Chce jediné: [claim_to_propose.GetName]."
 vassal.2901.a: "Uvidím, co se dá dělat."
 vassal.2901.a.tt: "#F [claim_vassal.GetFirstNameNoTooltip] si tvůj slib zapamatuje a pokud ho splníš, bude ti [Select_CString(claim_vassal.IsFemale,'vděčná','vděčný')]!#!"
 vassal.2901.b: "[claim_to_propose.GetNameNoTierNoTooltip] patří mně!"
 vassal.2901.z: "Dostaneš, oč žádáš."
 vassal.2910.desc: "„Děkuji, [ROOT.Char.GetTitleTierName]!“\n\n[recipient.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('recipient'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('recipient'))], má z nového titulu radost. A mě zase těší [Concept('favor','laskavost')|E], kterou mi za něj teď dluží."
 vassal.2910.a: "Všechno má svou cenu!"
 vassal.2911.desc: "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('claim_vassal'))|U] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('claim_vassal'))] zuří. Teď už je jasné, že můj slib „[claim_to_propose.GetName]“ nebyl ničím než prázdnými slovy."
 vassal.2911.a: "Tak směšnému požadavku jsem nemusel vyhovět."
 vassal.3001.t: "Trable v posteli"
 vassal.3001.desc_child: "[vassal_to_ask.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))], má kolem sebe plno lásky. Všude jsou [vassal_to_ask.Custom('ChildChildrenGender')] a mně se vybaví chlad, který prostupuje mým vlastním domovem – možná by ho další dítě dokázalo rozehřát."
 vassal.3001.desc_no_child: "[vassal_to_ask.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))], má kolem sebe plno lásky. Všude jsou [vassal_to_ask.Custom('ChildChildrenGender')] a mně se vybaví prázdné pokoje a tiché chodby mého vlastního domova."
 vassal.3001.desc: "\n\nSamozřejmě se snažíme – [spouse.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], i já – ale něco zřejmě děláme špatně..."
 vassal.3001.a: "Možná [vassal_to_ask.GetFirstNameNoTooltip] ví, co děláme špatně!"
 vassal.3001.b: "Tohle je soukromá záležitost."
 vassal.3002.desc: "„[ROOT.Char.GetFirstNameNoTooltip], tobě [ROOT.Char.Custom('ChildChildrenGender')] nechybějí, ale mně podobné štěstí dopřáno nebylo. Nemáš nějakou radu, jak to... napravit?“\n\nNemohu tomu uvěřit! [liege_with_trouble.GetTitledFirstName], [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('liege_with_trouble'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege_with_trouble'))], se mě ptá na rady do ložnice!"
 vassal.3002.a: "Co takhle sušená prasečí varlata a víno?"
 vassal.3002.a.critical_success: "Tvé rady přinesou úžasné výsledky"
 vassal.3002.a.success: "Tvé rady přinesou dobré výsledky"
 vassal.3002.a.failure: "Tvé rady nadělají víc škody než užitku"
 vassal.3002.b: "Nechci mít nic společného s tím, co se tam děje!"
 vassal.3002.c: "[spouse.GetTitledFirstNameNoTooltip] potřebuje pár lekcí."
 vassal.3002.c.tt_success: "[liege_with_trouble.GetTitledFirstNameNoTooltip] souhlasí"
 vassal.3002.c.tt_failure: "[liege_with_trouble.GetTitledFirstNameNoTooltip] se urazí"
 vassal.3002.d: "Myslím, že by ti prospělo trochu osobního... #EMP doučování#!."
 vassal.3002.d.tt_success: "[liege_with_trouble.GetTitledFirstNameNoTooltip] má zájem o soukromé lekce"
 vassal.3002.d.tt_failure: "[liege_with_trouble.GetTitledFirstNameNoTooltip] se urazí"
 vassal.3003.desc_good_counsel: "[vassal_to_ask.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))], mi podá lektvar a prohlásí: „Rozdíl poznáš okamžitě, [ROOT.Char.Custom('FormOfAddressForLiege')]!“\n\nO složení lektvaru však nepadne téměř ani slovo, což mě trochu znepokojí. Už teď ale cítím, jak mi žilami proudí nová síla!"
 vassal.3003.desc_bad_counsel: "[vassal_to_ask.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))], mi podá lektvar a prohlásí: „Rozdíl poznáš okamžitě, [ROOT.Char.Custom('FormOfAddressForLiege')]!“\n\nO složení lektvaru však nepadne téměř ani slovo, což mě trochu znepokojí. Když pak cítím, jak ze mě vyprchává životní síla, proklínám tu mizernou radu!"
 vassal.3003.desc_making_a_move_on_spouse: "„Ať za mnou přijde [spouse.GetFirstName]. Ukážu, jak ti udělat v ložnici větší radost, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 vassal.3003.desc_making_a_move: "„Ale [ROOT.Char.Custom('FormOfAddressForLiege')], rady se dávají tak těžko. Mnohem snazší by bylo ti to prostě ukázat...“"
 vassal.3003.desc_refusal: "Taková drzost! [vassal_to_ask.GetTitledFirstName], [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('vassal_to_ask'))] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal_to_ask'))], mou choulostivou otázku vyslechne, ale pak mě bez okolků odmítne."
 vassal.3003.a: "[spouse.GetTitledFirstNameNoTooltip]! Sejdeme se v našich komnatách!"
 vassal.3003.b: "Je mi snad souzen život bez dětí?"
 vassal.3003.spouse: "Hned za tebou přijde [spouse.GetFirstNameNoTooltip]!"
 vassal.3003.spouse.tt: "Zvýšená plodnost"
 vassal.3003.c: "Ano, trochu osobního doučování by možná pomohlo."
 vassal.3003.d: "Taková drzost!"
 vassal.3004.desc_spouse: "Nakolik byla moje soukromá lekce skutečně poučná, o tom by se dalo diskutovat, ale [spouse.GetTitledFirstName] si rozhodně nestěžuje.\n\nPokud bude mít [liege_with_trouble.GetTitledFirstName] štěstí, něco z ní snad utkví v paměti i pro příště...!"
 vassal.3004.desc_refused: "[liege_with_trouble.GetTitledFirstName] mě odmítá!\n\nMohu jen doufat, že se jim v ložnici bude dařit lépe...!"
 vassal.3004.desc: "Nakolik byla moje soukromá lekce skutečně poučná, o tom by se dalo diskutovat, ale [liege_with_trouble.GetTitledFirstName] si rozhodně nestěžuje.\n\nPokud bude mít [spouse.GetTitledFirstName] štěstí, něco z ní snad utkví v paměti i pro příště...!"
 vassal.3004.a: "Tak dobře. Přichází o hodně!"
 vassal.3004.b: "Podělit se o své umění je to nejmenší, co můžu udělat!"
 vassal.3004.c: "[spouse.GetFirstNameNoTooltip] je [Select_CString(spouse.IsFemale,'výborná studentka','výborný student')]!"
 vassal.5010.opening: "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 vassal.5010.desc: "Možná mi nepřísluší zpochybňovat tvou strategii, přesto nechápu, proč necháváš nepřátele naší víry nerušeně páchat jejich ničemnosti. Máme prostředky i právo je potrestat, takže tak přece musíme učinit!"
 vassal.5010.a: "Do šesti měsíců proti nim vytáhneme!"
 vassal.5010.a.tt: "#F Zavážeš se do šesti měsíců vyhlásit válku nepřátelům víry.#!"
 vassal.5010.b: "Až přijde správný čas..."
 vassal.5010.b.tt: "#F Slíbíš všechno a zároveň nic.#!"
 vassal.5010.c: "[ROOT.Char.GetTitleTierName] si nenechá poroučet!"
 vassal.5020.t: "Porušený zbožný slib"
 vassal.5020.desc: "Od mého slibu vyslat vojska proti nepřátelům víry už uplynulo šest měsíců. [vassal.GetTitledFirstName] mou nečinností rozhodně nebude [Select_CString(vassal.IsFemale,'nadšená','nadšený')]."
 vassal.5020.a: "Možná ten slib padl příliš ukvapeně."
 vassal.5020.b: "Slova jsou jen vítr."
 vassal.5050.desc: "Prosím tě, abys ve své moudrosti zvážil můj nárok. [claim.GetName] mi po právu náleží. Není správné, že [claimed_title_holder.GetTitledFirstName] může v bezpečí mého hradu dál pošlapávat dědické právo mé dynastie. Prosím, [ROOT.Char.Custom('FormOfAddressForLiege')], postav se za mě a pokud můj nárok nebude uznán dobrovolně, vezmi kvůli němu do rukou zbraň!"
 vassal.5050.a: "Do roka se za tebe postavím!"
 vassal.5050.a.tt: "#F Zavážeš se prosadit nárok, který má [vassal.GetTitledFirstName].#!"
 vassal.5050.b: "Až přijde správný čas..."
 vassal.5050.b.tt: "#F Zasáhneš jen tehdy, pokud v tom uvidíš vlastní prospěch.#!"
 vassal.5050.c: "Mám spoustu jiných naléhavých záležitostí."
 vassal.5060.t: "Porušený slib"
 vassal.5060.desc: "Před rokem ode mě [vassal.GetTitledFirstName] [Select_CString(vassal.IsFemale,'slyšela','slyšel')] slib, že kvůli [Select_CString(vassal.IsFemale,'jejímu','jeho')] nároku půjdu do války. Ve hře je [claim.GetName]. [vassal.GetTitledFirstName] mou nečinností rozhodně nebude [Select_CString(vassal.IsFemale,'nadšená','nadšený')]."
 vassal.5060.a: "Možná nebylo moudré se k tomu zavazovat."
 vassal.5060.b: "Jenže teď na to zkrátka není vhodná chvíle, chápeš?"
