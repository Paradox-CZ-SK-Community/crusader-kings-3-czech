l_polish:
 bp2_decision.0001.t: "$find_wet_nurse_decision$"
 bp2_decision.0001.desc: "Pokud jde o péči v naší rodině, [ROOT.Char.Custom('GetChildChildren')] si zaslouží jen to nejlepší$bp2_decision.0001.desc_candidates$"
 bp2_decision.0001.desc_widower: "Výchova urozeného dítěte rozhodně není práce pro jediného člověka$bp2_decision.0001.desc_candidates$"
 bp2_decision.0001.desc_candidates: ", a proto moji úředníci dostali za úkol vyhledat schopné ženy, které by pracovaly jako [GetCourtPositionType('wet_nurse_court_position').GetName()].\n\nNyní mi k posouzení představují několik místních žen."
 bp2_decision.0001.a: "Nejlépe na mě působí zkušená [wet_nurse_candidate_1.GetFirstNameNoTooltip]."
 bp2_decision.0001.a.aptitude: "[wet_nurse_candidate_1.GetUINamePossessive] [Concept('aptitude','způsobilost')|E] je [wet_nurse_candidate_1.GetCourtPositionAptitude( GetCourtPositionType( 'wet_nurse_court_position' ) )]"
 bp2_decision.0001.b: "[wet_nurse_candidate_2.GetFirstNameNoTooltip] postačí."
 bp2_decision.0001.b.aptitude: "[wet_nurse_candidate_2.GetUINamePossessive] [Concept('aptitude','způsobilost')|E] je [wet_nurse_candidate_2.GetCourtPositionAptitude( GetCourtPositionType( 'wet_nurse_court_position' ) )]"
 bp2_decision.0001.c: "Žádná mi nevyhovuje."
 bp2_yearly.7000.t: "Nemocenská"
 bp2_yearly.7000.desc: "Kojná [wet_nurse.GetFirstName] si vyžádala okamžitou audienci.\n\n„Prosím, [wet_nurse.Custom2('RelationToMe', ROOT.Char)], onemocněla jsem! Musím vás poprosit o několik dní odpočinku — mé zkažené tělesné šťávy by mohly nakazit děti, které mám v péči.“\n\nTa slova ze sebe souká s chorobnou naléhavostí."
 bp2_yearly.7000.desc_child_liege: "Moje kojná [wet_nurse.GetFirstName] na tom poslední dobou není dobře. Zjevně si všimla mých obav.\n\n„[wet_nurse.Custom2('RelationToMe', ROOT.Char)] [nursed_child.GetFirstName], těžko se mi to říká, ale... přemohla mě nějaká ošklivá nemoc. Na nějaký čas budu muset odejít, ale moc se neboj! Brzy budu zase s tebou.“"
 bp2_yearly.7000.a: "Neboj se, postarám se o tebe."
 bp2_yearly.7000.a.tt: "Zaplatíš návštěvu lékaře"
 bp2_yearly.7000.b: "Tak ať je to volno natrvalo."
 bp2_yearly.7000.b.tt: "Péče [wet_nurse.GetFirstNamePossessiveNoTooltip] bude chybět."
 bp2_yearly.7000.c: "Nemoc? Drž se od mých dětí dál!"
 bp2_yearly.7000.c_child_liege: "Nemoc? Drž se ode mě dál!"
 bp2_yearly.7000.ill: "[nursed_child.GetFirstNameNoTooltip] onemocní"
 bp2_yearly.7000.healthy: "[nursed_child.GetFirstNameNoTooltip] nákaze odolá"
 bp2_yearly.7000.healthy.tt: "[nursed_child.GetShortUIName] zůstane zdravý"
 bp2_yearly.7001.t: "Živené podezření"
 bp2_yearly.7001.desc: "[wet_nurse.GetFirstName] se o mé děti stará jako skvělá kojná a její péče si zaslouží uznání. V poslední době však [ROOT.Char.Custom2('RelationToMe', jealous_spouse)] [jealous_spouse.GetFirstName] hledí na kojnou s podezřením.\n\n„[jealous_spouse.Custom2('RelationToMe', ROOT.Char)], od chvíle, kdy k nám nastoupila [wet_nurse.GetFirstNameNoTooltip], ta děvka, tvůj zájem o naše děti jen kvete! Že by tě inspirovaly její #EMP bujné vnady#!?“\n\n"
 bp2_yearly.7001.desc_lover: "Zdá se... že opatrnosti nebylo dost."
 bp2_yearly.7001.desc_no_lover: "[jealous_spouse.GetFirstNameNoTooltip] mě napadá úplně bezdůvodně! Že ano...?"
 bp2_yearly.7001.a: "To mám naše děti ignorovat?!"
 bp2_yearly.7001.a.tt: "Tato možnost je dostupná, protože máš [Concept('lover','milence')|E]"
 bp2_yearly.7001.b: "Nesmysl, drahoušku: víš přece, že jsem ti [Select_CString(ROOT.Char.IsFemale,'věrná','věrný')]!"
 bp2_yearly.7001.b.spouse_convinced: "Tvému vysvětlení [jealous_spouse.GetFirstNameNoTooltip] uvěří"
 bp2_yearly.7001.b.spouse_not_convinced: "[jealous_spouse.GetFirstNameNoTooltip] ti nevěří"
 bp2_yearly.7001.c: "Rozptýlím tvé obavy."
 bp2_yearly.7001.tt: "Jsi [Select_CString(ROOT.Char.IsFemale,'známá lhářka','známý lhář')]"
 bp2_yearly.7002.t: "Mléčný sourozenec"
 bp2_yearly.7002.desc: "[court_chaplain.GetFirstName] ke mně bez ohlášení vpadne s ustaraným výrazem. A kde že mě zastihne? [ROOT.Char.Custom('GetChamber')].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], promiňte, že ruším, ale je to naléhavé! Dostala se ke mně zpráva, že [spouse.GetFirstName] i vy jste v dětství měli stejnou kojnou. Váš sňatek je proto nanejvýš nevhodný; jste mléční sourozenci — v očích [ROOT.Char.GetFaith.HighGodNamePossessive] jste si tou nejbližší rodinou!“\n\nŠokující odhalení! Než stačím cokoli namítnout, [court_chaplain.GetFirstNameNoTooltip] pokračuje. \n\n„Radím vám, abyste se okamžitě rozvedli. Jinak nezbude než váš sňatek prohlásit za krvesmilný.“"
 bp2_yearly.7002.a: "Krvesmilstvo? Já tomu říkám láska!"
 bp2_yearly.7002.b: "Okamžitě se rozvedeme."
 bp2_yearly.7002.c: "Možná bychom se mohli dohodnout, že na to... zapomeneme?"
 bp2_yearly.parental_neglect_effect: "[nursed_child.GetFirstNameNoTooltip] zuří"
 bp2_yearly.7003.title: "[nursed_child.GetFirstNamePossessiveNoTooltip] první"
 bp2_yearly.7003.t: "$bp2_yearly.7003.title$ slova"
 bp2_yearly.7003.desc: "„Rychle, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')], tohle musíte slyšet!“\n\nKojná [wet_nurse.GetFirstName] mě spěšně vede do [ROOT.Char.Custom('GetChamber')], kde už čeká [nursed_child.GetFirstName]. [wet_nurse.GetFirstNameNoTooltip] na dítě vzrušeně ukáže, a tak se nakloním blíž a poslouchám.\n\n"
 bp2_yearly.7003.desc_gold: "[nursed_child.GetFirstNameNoTooltip] mi podává oslintanou minci a říká:\n\n„Z-zl, z-zlato...“"
 bp2_yearly.7003.desc_secret: "[nursed_child.GetFirstNameNoTooltip] si přiloží prst k drobným rtům a zašeptá mi:\n\n„Tajemství.“"
 bp2_yearly.7003.desc_motto: "„[nursed_child.GetHouse.GetMotto].“\n\nNeuvěřitelné! [nursed_child.GetHouse.GetName]! [nursed_child.GetFirstNameNoTooltip] právě [Select_CString(nursed_child.IsFemale,'vypravila','vypravil')] naše rodové motto bez jediného zadrhnutí!"
 bp2_yearly.7003.desc_house: "„[nursed_child.GetHouse.GetNameNoTooltip].“\n\nNeuvěřitelné! [nursed_child.GetFirstNameNoTooltip] už umí vyslovit jméno našeho rodu."
 bp2_yearly.7003.desc_military: "„Guh-bah-nuh... [nursed_child.Custom( 'KnightCultureNoTooltipLowercase' )]!“\n\nZdá se, že [nursed_child.GetFirstNameNoTooltip] už má bojovného ducha!"
 bp2_yearly.7003.desc_faith: "„[nursed_child.GetFaith.random_GoodGodNames].“\n\nZdá se, že [nursed_child.GetFirstNameNoTooltip] už projevuje velkou zbožnost!"
 bp2_yearly.7003.desc_father: "„Ta-, ta-...“"
 bp2_yearly.7003.desc_mother: "„Ma-, ma-...“"
 bp2_yearly.7003.a: "To je rozkošné!"
 bp2_yearly.7003.b: "Co ještě [nursed_child.GetFirstNameNoTooltip] umí říct?"
 bp2_yearly.7003.b.tt: "[nursed_child.GetFirstNameNoTooltip] má pod tvým nátlakem mluvit dál."
 bp2_yearly.7003.c: "Na tohle nemám čas."
 bp2_yearly.7004.t: "$bp2_yearly.7003.title$ krůčky"
 bp2_yearly.7004.desc: "Z komnat se ozývá nějaký rozruch. Uvnitř je [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] [nursed_child.GetFirstName], a tak tam spěchám. Kojná [wet_nurse.GetFirstName] si právě s dítětem hraje. \n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], právě včas! [nursed_child.GetFirstNameNoTooltip] právě [Select_CString(nursed_child.IsFemale,'udělala','udělal')] svůj první krůček!“ nadšeně vykřikne [wet_nurse.GetFirstNameNoTooltip].\n\n[nursed_child.Custom('GirlBoy')|U] [nursed_child.GetFirstNameNoTooltip] se drží kojné za ruce a spolu se pokoušejí obejít místnost."
 bp2_yearly.7004.a: "„Obrovský krok pro dítě. Malý krůček pro panovníka.“"
 bp2_yearly.7004.b: "Co dalšího [nursed_child.GetFirstNameNoTooltip] dokáže?"
 bp2_yearly.7004.b.tt: "Nutíš [nursed_child.GetFirstNameNoTooltip], aby [Select_CString(nursed_child.IsFemale,'chodila','chodil')] dál."
 bp2_yearly.7004.c: "$bp2_yearly.7003.c$"
 bp2_yearly.7005.t: "$bp2_yearly.7003.title$ vypadlý zub"
 bp2_yearly.7005.desc: "S mým svolením do [ROOT.Char.Custom('GetChamber')] vpochodují [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] [nursed_child.GetFirstName] a kojná [wet_nurse.GetFirstName]. [wet_nurse.GetFirstNameNoTooltip] se napřímí jako herold a slavnostně prohlásí:\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], právě jste svědkem významné události! [nursed_child.GetFirstNameNoTooltip] vám chce předat mocný dar.“ Pobídne dítě kupředu. „Jen do toho, [nursed_child.GetFirstNameNoTooltip], pověz to!“\n\n„Vypadl mi zub!“ [ROOT.Char.Custom2('RelationToMeShort', nursed_child)|U] [nursed_child.GetFirstNameNoTooltip] se na mě hrdě bezzubě usměje a podá mi váček s vypadlým zubem."
 bp2_yearly.7005.a: "Nádhera! Ale zub si nech pro štěstí."
 bp2_yearly.7005.b: "Tady máš: dar za dar!"
 bp2_yearly.7005.b.tt: "Získáš zub"
 bp2_yearly.7005.c: "$bp2_yearly.7003.c$"
 child_teeth_memorabilia: "[nursed_child.GetNamePossessiveNoTooltip] mléčný zub"
 child_teeth_memorabilia_desc: "[nursed_child.GetNamePossessiveNoTooltip] první vypadlý mléčný zub."
 bp2_yearly.7006.t: "$bp2_yearly.7003.title$ oblékání"
 bp2_yearly.7006.desc: "Trpělivě čekám, až mi přinesou šaty, když tu služebník zakoktá: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], ehm... vaše šaty nemůže nikdo najít!“\n\n„Jsem obklopen neschopnými lidmi!“ procedím a vyřítím se z [ROOT.Char.Custom('GetChamber')].\n\nNakonec je objevím v [ROOT.Char.Custom('GetRoom')], kde je [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] [nursed_child.GetFirstName]. A s mými šaty je tam i kojná [wet_nurse.GetFirstName].\n\n„Já s tím nic nemám, [Select_CString(ROOT.Char.IsFemale,'má paní','můj pane')] — [nursed_child.GetFirstNameNoTooltip] se [Select_CString(nursed_child.IsFemale,'oblékla sama','oblékl sám')]!“ odpoví [wet_nurse.GetFirstNameNoTooltip] se smíchem."
 bp2_yearly.7006.a: "[Select_CString(nursed_child.IsFemale,'Malá rošťanda!','Malý rošťák!')]"
 bp2_yearly.7006.b: "Takže [nursed_child.GetFirstNameNoTooltip] je [nursed_child.Custom('GetPrincessPrince')] módy?"
 bp2_yearly.7006.c: "$bp2_yearly.7003.c$"
 bp2_yearly.7008.t: "$bp2_yearly.7003.title$ zášť"
 bp2_yearly.7008.desc_start: "„Ach, když jsi [Select_CString(ROOT.Char.IsFemale,'byla ještě malá','byl ještě malý')]! Na ty časy [Select_CString(reflecting_parent.IsFemale,'budu vždycky ráda vzpomínat','budu vždycky rád vzpomínat')],“ pronese zničehonic [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] [reflecting_parent.GetFirstName].\n\nVšechno se mi vrací. #EMP Vím#!, že"
 bp2_yearly.7008.desc: "$bp2_yearly.7008.desc_start$ [reflecting_parent.GetFirstNameNoTooltip] se o mě [Select_CString(reflecting_parent.IsFemale,'nikdy nestarala','nikdy nestaral')]. #EMP Vím#!, že chvíle, které [Select_CString(reflecting_parent.IsFemale,'jí','jemu')] připadaly zábavné, pro mě byly těmi nejhoršími zkouškami."
 bp2_yearly.7008.desc_dead_parent: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'mi byla nepřítelkyní, dokud žila','mi byl nepřítelem, dokud žil')]."
 bp2_yearly.7008.desc_word: "[ROOT.Var('nursed_child_parent_var').Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'dokonce odbyla','dokonce odbyl')] má první slova!"
 bp2_yearly.7008.desc_step: "[ROOT.Var('nursed_child_parent_var').Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'znuděně odešla','znuděně odešel')], právě když jsem dělal své první krůčky."
 bp2_yearly.7008.desc_tooth: "[ROOT.Var('nursed_child_parent_var').Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'znechuceně ucukla','znechuceně ucukl')] před mým prvním vypadlým zubem!"
 bp2_yearly.7008.desc_dress: "[ROOT.Var('nursed_child_parent_var').Char.GetFirstNameNoTooltip] se [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'vysmála','vysmál')] mé dětské zálibě v převlékání!"
 bp2_yearly.7008.desc_end: "\n\nMělo by mi připadnout, co mi náleží! Anebo... je načase přestat se hrabat v minulosti?"
 bp2_yearly.7008.a: "„Dej mi svou zemi!“"
 bp2_yearly.7008.a.tt_good: "[reflecting_parent.GetFirstNameNoTooltip] s tebou souhlasí"
 bp2_yearly.7008.a.tt_bad: "[reflecting_parent.GetFirstNameNoTooltip] ti místo toho nabídne něco jiného"
 bp2_yearly.7008.b: "„Dlužíš mi své bohatství!“"
 bp2_yearly.7008.c: "„Pohrdám tebou a doufám, že už tě nikdy neuvidím!“"
 bp2_yearly.7008.c_dead_parent: "„Proč jsi mě tak [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'zanedbávala','zanedbával')]?!“"
 bp2_yearly.7008.d: "Raději se budu věnovat vlastním dětem."
 bp2_yearly.7008.e: "Takové zacházení je... po právu."
 bp2_yearly.7008.tt: "[reflecting_parent.GetFirstNameNoTooltip] bude muset odpovědět"
 bp2_yearly.7009.t: "$bp2_yearly.7003.title$ rodinná pouta"
 bp2_yearly.7009.desc: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] [reflecting_parent.GetFirstName] ve mně [Select_CString(reflecting_parent.IsFemale,'vždy viděla','vždy viděl')] to nejlepší a [Select_CString(reflecting_parent.IsFemale,'ze všech sil se mě zastávala','ze všech sil se mě zastával')]. Nejkrásnější chvíle mého dětství byly ty společné."
 bp2_yearly.7009.desc_dead_parent: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] [reflecting_parent.GetFirstName] mi [Select_CString(reflecting_parent.IsFemale,'byla hluboce oddaná','byl hluboce oddaný')] a také [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] mě za svého života [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'vroucně milovala','vroucně miloval')]."
 bp2_yearly.7009.desc_word: "Právě [ROOT.Var('nursed_child_parent_var').Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'slyšela','slyšel')] má první slova."
 bp2_yearly.7009.desc_step: "[ROOT.Var('nursed_child_parent_var').Char.GetFirstNameNoTooltip] mi [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'pomohla','pomohl')] udělat první krůčky."
 bp2_yearly.7009.desc_tooth: "[ROOT.Var('nursed_child_parent_var').Char.GetFirstNameNoTooltip] dokonce [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'vzala','vzal')] můj mléčný zub do vlastní ruky."
 bp2_yearly.7009.desc_dress: "[ROOT.Var('nursed_child_parent_var').Char.GetFirstNameNoTooltip] [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'podporovala','podporoval')] mé lumpárny i zálibu v převlékání."
 bp2_yearly.7009.desc_end: "\n\nMožná je načase tu náklonnost oplatit?"
 bp2_yearly.7009.desc_end_dead_parent: "\n\n[ROOT.Var('nursed_child_parent_var').Char.GetFirstNameNoTooltip] už se mého poděkování nedočká. Teď je tu už jen [ROOT.Char.Custom2('RelationToMe', reflecting_parent)] [reflecting_parent.GetFirstName], komu mohu svou vděčnost dát najevo."
 bp2_yearly.7009.a: "„[nursed_child.Custom2('RelationToMeShort', reflecting_parent)|U] [reflecting_parent.GetFirstName] je mi [Select_CString(reflecting_parent.IsFemale,'tak drahá','tak drahý')]!“"
 bp2_yearly.7009.a.tt_good: "$bp2_yearly.7008.a.tt_good$"
 bp2_yearly.7009.a.tt_bad: "[reflecting_parent.GetFirstNameNoTooltip] chce něco na oplátku"
 bp2_yearly.7009.b: "Láskyplnou péči předám svým dětem!"
 bp2_yearly.7009.c: "Hm. Rodina, vděčnost... a tak dál."
 bp2_yearly.7004.t: "$bp2_yearly.7003.title$ krůčky"
 bp2_yearly.7004.desc: "Z [nursed_child.GetFirstNamePossessive] komnaty se ozývá rozruch. Spěchám dovnitř a vidím, že si kojná [wet_nurse.GetFirstName] hraje s [nursed_child.GetFirstName]. \n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], právě včas! [nursed_child.GetFirstNameNoTooltip] právě [Select_CString(nursed_child.IsFemale,'udělala','udělal')] první krůček!“ volá kojná nadšeně.\n\n[nursed_child.Custom('GirlBoy')|U] drží kojnou za ruce a ta se snaží dítě provést po pokoji."
 bp2_yearly.7004.a: "„Velký krok pro dítě. Malý krok pro [Select_CString(ROOT.Char.IsFemale,'panovnici','panovníka')].“"
 bp2_yearly.7004.b: "Co ještě dokáže?"
 bp2_yearly.7004.b.tt: "[nursed_child.GetFirstNameNoTooltip] má pod tvým nátlakem chodit dál."
 bp2_yearly.7004.c: "$bp2_yearly.7003.c$"
 bp2_yearly.7005.t: "$bp2_yearly.7003.title$ vypadlý zub"
 bp2_yearly.7005.desc: "S mým svolením přichází [nursed_child.GetFirstName] spolu s kojnou. [ROOT.Char.Custom('GetChamber')|U] se rázem stává dějištěm malého průvodu. [wet_nurse.GetFirstName] se postaví jako herold a slavnostně prohlásí:\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], čeká vás významný okamžik! [nursed_child.GetFirstNameNoTooltip] má pro vás mocný dar.“ Kojná dítě postrčí kupředu. „Tak do toho, [nursed_child.GetFirstNameNoTooltip], pověz to!“\n\n„[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U], vypadl mi zub!“ [ROOT.Char.Custom2('RelationToMeShort', nursed_child)|U] se pyšně usměje bezzubým úsměvem a podá mi váček s vypadlým zubem."
 bp2_yearly.7005.a: "Nádhera! Ale zub si nech jako talisman pro štěstí."
 bp2_yearly.7005.b: "Tady máš. Za dar se sluší odměnit darem!"
 bp2_yearly.7005.b.tt: "Získáš zub"
 bp2_yearly.7005.c: "$bp2_yearly.7003.c$"
 child_teeth_memorabilia: "[nursed_child.GetNamePossessiveNoTooltip] mléčný zub"
 child_teeth_memorabilia_desc: "[nursed_child.GetNamePossessiveNoTooltip] první vypadlý mléčný zub."
 bp2_yearly.7006.t: "$bp2_yearly.7003.title$ převlékání"
 bp2_yearly.7006.desc: "Trpělivě čekám, až mi přinesou šaty, když někdo ze služebnictva zakoktá: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], ehm... nikdo nemůže najít vaše šaty!“\n\n„Tohle služebnictvo je k ničemu!“ zabručím a vyrazím pryč. [ROOT.Char.Custom('GetChamber')|U] zůstává za mnou.\n\nMoje šaty nakonec najdu tam, kde je [nursed_child.GetFirstNamePossessive] [ROOT.Char.Custom('GetRoom')]. [ROOT.Char.Custom2('RelationToMeShort', nursed_child)|U] tu ale není jediným překvapením, je tu i kojná.\n\n„S tím nemám nic společného, [ROOT.Char.Custom('FormOfAddressForLiege')] — [nursed_child.GetFirstNameNoTooltip] se [Select_CString(nursed_child.IsFemale,'oblékla sama','oblékl sám')]!“ odpoví [wet_nurse.GetFirstName] se smíchem."
 bp2_yearly.7006.a: "[Select_CString(nursed_child.IsFemale,'Ta malá nezbeda','Ten malý nezbeda')]!"
 bp2_yearly.7006.b: "Takže [nursed_child.Custom('GetPrincessPrince')] módy?"
 bp2_yearly.7006.c: "$bp2_yearly.7003.c$"
 bp2_yearly.7008.t: "$bp2_yearly.7003.title$ hořkost"
 bp2_yearly.7008.desc_start: "Zničehonic se ozve [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] [reflecting_parent.GetFirstName]: „Ach, když jsi [Select_CString(ROOT.Char.IsFemale,'byla ještě malá','byl ještě malý')]! Na ty časy budu vždycky vzpomínat s láskou.“\n\nVšechno se mi vrací. #EMP Vím#!, že"
 bp2_yearly.7008.desc: "$bp2_yearly.7008.desc_start$ [Select_CString(reflecting_parent.IsFemale,'se o mě nikdy nestarala','se o mě nikdy nestaral')]. #EMP Vím#!, že každá taková „zábavná“ chvíle byla pro mě tím nejhorším utrpením."
 bp2_yearly.7008.desc_dead_parent: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'mi byla nepřítelkyní až do smrti','mi byl nepřítelem až do smrti')]."
 bp2_yearly.7008.desc_word: "Dokonce [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'odmítla','odmítl')] má první slova!"
 bp2_yearly.7008.desc_step: "Při mých prvních krůčcích [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'znuděně odešla','znuděně odešel')]."
 bp2_yearly.7008.desc_tooth: "Když mi vypadl první zub, [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'odvrátila se znechucením','odvrátil se znechucením')]!"
 bp2_yearly.7008.desc_dress: "[Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'Vysmívala se','Vysmíval se')] mému dětskému převlékání!"
 bp2_yearly.7008.desc_end: "\n\n[Select_CString(ROOT.Char.IsFemale,'Měla bych dostat, co mi náleží','Měl bych dostat, co mi náleží')]! Nebo snad bude lepší přestat se minulostí zabývat?"
 bp2_yearly.7008.a: "„Dej mi svou zemi, [nursed_child.Custom2('RelationToMeShort', reflecting_parent)]!“"
 bp2_yearly.7008.a.tt_good: "[reflecting_parent.GetFirstNameNoTooltip] s tebou souhlasí"
 bp2_yearly.7008.a.tt_bad: "[reflecting_parent.GetFirstNameNoTooltip] místo toho nabídne něco jiného"
 bp2_yearly.7008.b: "„Dlužíš mi své bohatství!“"
 bp2_yearly.7008.c: "„Pohrdám tebou a doufám, že už tě nikdy neuvidím!“"
 bp2_yearly.7008.c_dead_parent: "„[Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'Proč jsi mě tak zanedbávala','Proč jsi mě tak zanedbával')]?!“"
 bp2_yearly.7008.d: "Raději se budu věnovat vlastním dětem."
 bp2_yearly.7008.e: "Takové zacházení si... zasloužím."
 bp2_yearly.7008.tt: "[reflecting_parent.GetFirstNameNoTooltip] bude muset odpovědět"
 bp2_yearly.7009.t: "$bp2_yearly.7003.title$ pouta"
 bp2_yearly.7009.desc: "$bp2_yearly.7008.desc_start$ [Select_CString(reflecting_parent.IsFemale,'ve mně vždy viděla to nejlepší a snažila se mě chránit','ve mně vždy viděl to nejlepší a snažil se mě chránit')]. Nejkrásnější chvíle mého dětství jsou ty společné."
 bp2_yearly.7009.desc_dead_parent: "$bp2_yearly.7008.desc_start$ [ROOT.Char.Custom2('RelationToMeShort', reflecting_parent)] [reflecting_parent.GetFirstName] [Select_CString(reflecting_parent.IsFemale,'mi byla hluboce oddaná','mi byl hluboce oddaný')]. [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('nursed_child_parent_var').Char)] [ROOT.Var('nursed_child_parent_var').Char.GetFirstName] [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'mě po celý život stejně vroucně milovala','mě po celý život stejně vroucně miloval')]."
 bp2_yearly.7009.desc_word: "Právě [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'ona slyšela','on slyšel')] má první slova."
 bp2_yearly.7009.desc_step: "[Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'Pomohla','Pomohl')] mi s prvními krůčky."
 bp2_yearly.7009.desc_tooth: "Dokonce [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'vzala','vzal')] můj mléčný zub do vlastní ruky."
 bp2_yearly.7009.desc_dress: "Mé lumpárny a převlékání [Select_CString(ROOT.Var('nursed_child_parent_var').Char.IsFemale,'vždy podporovala','vždy podporoval')]."
 bp2_yearly.7009.desc_end: "\n\nMožná je načase tu lásku oplatit?"
 bp2_yearly.7009.desc_end_dead_parent: "\n\nNa poděkování už je ale pozdě. Teď je tu ještě [ROOT.Char.Custom2('RelationToMe', reflecting_parent)] — a právě tady má moje vděčnost ještě smysl."
 bp2_yearly.7009.a: "„[Select_CString(nursed_child.IsFemale,'Mám tě tolik ráda','Mám tě tolik rád')], [nursed_child.Custom2('RelationToMeShort', reflecting_parent)].“"
 bp2_yearly.7009.a.tt_good: "$bp2_yearly.7008.a.tt_good$"
 bp2_yearly.7009.a.tt_bad: "[reflecting_parent.GetFirstNameNoTooltip] chce něco na oplátku"
 bp2_yearly.7009.b: "Stejnou lásku předám i svým dětem!"
 bp2_yearly.7009.c: "Jistě. Rodina, vděčnost... a tak dále."
 bp2_yearly.7010.t: "$bp2_yearly.7008.t$"
 bp2_yearly.7010.desc_start: "S [nursed_child.GetFirstName] probírám dvorské záležitosti. Pak se [ROOT.Char.Custom2('RelationToMeShort', nursed_child)] zničehonic vrátí k dětství.\n\n"
 bp2_yearly.7010.desc: "$bp2_yearly.7010.desc_start$„[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U], přiznej si to: [Select_CString(ROOT.Char.IsFemale,'nikdy ses o mě nestarala','nikdy ses o mě nestaral')], ani v mém dětství.“"
 bp2_yearly.7010.desc_dead_parent: "$bp2_yearly.7010.desc_start$„[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U], o mrtvých se nemá mluvit zle, ale musíš uznat jedno: [nursed_child.Custom2('RelationToMeShort', nursed_child.MakeScope.Var('nursed_child_parent_var').Char)] — horší rodič snad neexistoval!“"
 bp2_yearly.7010.desc_word: "Má první slova zůstala bez povšimnutí!"
 bp2_yearly.7010.desc_step: "Mých prvních kroků si nikdo nevšímal!"
 bp2_yearly.7010.desc_tooth: "Mé první vypadlé zuby skončily v koši!"
 bp2_yearly.7010.desc_dress: "Mému převlékání se bez milosti vysmívali."
 bp2_yearly.7010.desc_end: "„#EMP Tohle#! má být láska?“\n\n[nursed_child.GetFirstNameNoTooltip] se snaží ovládnout, třese se emocemi, ale působí odhodlaně."
 bp2_yearly.7010.desc_title: "$bp2_yearly.7008.a$"
 bp2_yearly.7010.desc_gold: "$bp2_yearly.7008.b$"
 bp2_yearly.7010.desc_hate: "$bp2_yearly.7008.c$"
 bp2_yearly.7010.desc_hate_dead_parent: "$bp2_yearly.7008.c_dead_parent$"
 bp2_yearly.7010.a: "Dokážu ti, že toho lituji."
 bp2_yearly.7010.a.tt: "$bp2_yearly.7008.a.tt_good$"
 bp2_yearly.7010.b: "„Odteď ode mě dostaneš, co potřebuješ!“"
 bp2_yearly.7010.b.tt: "$bp2_yearly.7008.a.tt_bad$"
 bp2_yearly.7010.c: "„Dospěj.“"
 bp2_yearly.7010.c.tt: "[reflecting_parent.GetFirstNameNoTooltip] se ve skutečnosti nezajímá"
 bp2_yearly.7011.t: "$bp2_yearly.7009.t$"
 bp2_yearly.7011.desc: "$bp2_yearly.7010.desc_start$„[nursed_child.Custom2('RelationToMeShort', ROOT.Char)|U], [Select_CString(ROOT.Char.IsFemale,'starala ses o mě jako fena o štěňata','staral ses o mě jako pes o štěňata')]. Vlastně ještě lépe. Mé nejstarší a nejmilejší vzpomínky patří tobě.“"
 bp2_yearly.7011.desc_dead_parent: "$bp2_yearly.7010.desc_start$„[nursed_child.Custom2('RelationToMeShort', nursed_child.MakeScope.Var('nursed_child_parent_var').Char)] tu tehdy [Select_CString(nursed_child.MakeScope.Var('nursed_child_parent_var').Char.IsFemale,'byla se mnou','byl se mnou')] a mé vzpomínky jsou plné lásky. Od vás obou se mi vždy dostávalo času a pozornosti.“"
 bp2_yearly.7011.desc_word: "Když jsem [Select_CString(nursed_child.IsFemale,'pronesla','pronesl')] první slova!"
 bp2_yearly.7011.desc_step: "Když jsem [Select_CString(nursed_child.IsFemale,'udělala','udělal')] první krůčky!"
 bp2_yearly.7011.desc_tooth: "Když můj první vypadlý zub skončil ve tvé dlani."
 bp2_yearly.7011.desc_dress: "Když jsem [Select_CString(nursed_child.IsFemale,'tropila','tropil')] lumpárny a [Select_CString(nursed_child.IsFemale,'pobíhala','pobíhal')] v převlecích!"
 bp2_yearly.7011.desc_end: "„[Select_CString(ROOT.Char.IsFemale,'Držela jsi mě tak blízko','Držel jsi mě tak blízko')].“\n\nPřitom se začervená a rozzáří.\n\n"
 bp2_yearly.7011.desc_receive_love: "$bp2_yearly.7011.desc_end$$bp2_yearly.7009.a$"
 bp2_yearly.7011.desc_forwarded_love: "$bp2_yearly.7011.desc_end$„$bp2_yearly.7009.b$“"
 bp2_yearly.7011.a: "„A já tě mám [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], [ROOT.Char.Custom2('RelationToMeShort', nursed_child)]!“"
 bp2_yearly.7011.a.tt: "$bp2_yearly.7009.a.tt_good$"
 bp2_yearly.7011.b: "„Taková oddanost!“"
 bp2_yearly.7011.b.tt: "$bp2_yearly.7009.a.tt_bad$"
 bp2_yearly.7011.c: "„Neulpívej na minulosti.“"
 bp2_yearly.7011.c.tt: "$bp2_yearly.7010.c.tt$"
 bp2_yearly.7012.t: "Mléko kojné, láska mateřská"
 bp2_yearly.7012.desc: "[nursed_child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se vpotácí dovnitř, přeruší jednání mé rady a snaží se mě odvést stranou.\n\n„[nursed_child.GetFirstNameNoTooltip]! Tady nemáš co dělat,“ namítnu, ale [nursed_child.Custom('GirlBoy')] rudne a začne křičet.\n\n„Já tě #EMP nenávidím#!! Proč jsi to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]?!“ Dítě se s popotáhnutím odmlčí a všechny oči se na něj upřou. „Poslal[Select_CString(ROOT.Char.IsFemale,'a','')] jsi pryč moji [former_wet_nurse.GetFirstName]! Není to jen nějaká kojná — miluji ji jako matku! #EMP Víc#! než vlastní matku!“"
 bp2_yearly.7012.a: "Odpusť mi. Přijmu ji zpátky!"
 bp2_yearly.7012.b: "Moje rozhodnutí musíš respektovat."
 bp2_yearly.7012.b_win: "[nursed_child.GetFirstNameNoTooltip] přijme tvé vysvětlení a najde útěchu"
 bp2_yearly.7012.b_loss: "[nursed_child.GetFirstNameNoTooltip] ti zazlívá tvou nadvládu"
 bp2_yearly.7012.c: "Dítě, mlč!"
 bp2_yearly.7013.t: "Dětský žal"
 bp2_yearly.7013.desc: "Poslední dobou [nursed_child.GetFirstName] bezcílně bloumá sem a tam a myšlenkami je úplně jinde. V komnatě pak dítě najdu s tváří zabořenou do polštářů. \n\n„Co se děje?“ zeptám se. [ROOT.Char.Custom2('RelationToMeShort', nursed_child)|U] se pomalu uklidňuje.\n\n„Co se stane, když člověk zemře? Jen přemýšlím.... jestli je moje kojná [former_wet_nurse.GetFirstName] v pořádku.“ Dítě hlasitě popotáhne a snaží se zadržet slzy. „Možná teď musí kojit... [ROOT.Char.GetFaith.DevilName] ji k tomu nutí?“\n\n[nursed_child.GetFirstNamePossessiveNoTooltip] hlas se zlomí a z očí vytrysknou obrovské, třpytivé slzy."
 bp2_yearly.7013.a: "„Nová kojná všechno napraví!“"
 bp2_yearly.7013.a.tt: "Spustí $bp2_decision.0001.t$"
 bp2_yearly.7013.b: "„Určitě ji teď čeká [nursed_child.GetFaith.PositiveAfterLife].“"
 bp2_yearly.7013.c: "Smrt je smrt."
 bp2_yearly.7014.t: "Někdo blízký"
 bp2_yearly.7014.desc: "Moje kojná [wet_nurse.GetFirstName] mě ukládá do postele a chystá se na noc sfouknout svíčky.\n\n„Počkej! Ještě ti chci něco říct!“ prosím. „[Select_CString(ROOT.Char.IsFemale,'Jsem ráda','Jsem rád')], že jsi tady... Bez tebe bych se [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')] hrozně osaměle.“\n\n[wet_nurse.GetFirstNameNoTooltip] je z toho trochu nesvá, ale zároveň dojatá.\n\n„Víš,"
 bp2_yearly.7014.desc_faith: " já svou víru beru vážně. [wet_nurse.GetFaith.HighGodName] mi dává sílu a jednou ji bude dávat i tobě. Až bude tvá víra pevná, [wet_nurse.GetFaith.HighGodName] tě povede a utěší. Pak už mě nebudeš potřebovat.“"
 bp2_yearly.7014.desc_culture: " [wet_nurse.GetCulture.GetName] kultura je domovem nás obou. Sdílíme stejný étos: [wet_nurse.GetCulture.GetEthos.GetNameNoTooltip|l]. [tradition.GetNameNoTooltip], [tradition_2.GetNameNoTooltip]... to jsou naše zvyky! Ať jsme mocní nebo prostí, všichni jsme dobří lidé.“"
 bp2_yearly.7014.desc_culture_no_trad: " [wet_nurse.GetCulture.GetName] kultura je domovem nás obou. Sdílíme stejný étos: [wet_nurse.GetCulture.GetEthos.GetNameNoTooltip|l], a také prastaré zvyky! Ať jsme mocní nebo prostí, všichni jsme dobří lidé.“"
 bp2_yearly.7014.a: "„Kéž bys byla moje maminka!“"
 bp2_yearly.7014.b: "Na tuhle chvíli nezapomenu."
 parenting_by_example: "Výchova příkladem"
 parenting_by_example_desc: "Rodiče této postavy ji naučili vychovávat děti s láskou a péčí."
 role_model_parent: "Rodič jako vzor"
 role_model_parent_desc: "Tento rodič inspiruje své děti k tomu, aby i ony vychovávaly vlastní potomky s láskou a péčí."
 rites_of_passage_decision: "$bp2_decision.0002.t$"
 rites_of_passage_decision_desc: "Mladí lidé určitého věku mohou podstoupit obřad dospělosti: rituál, který potvrzuje jejich dospělost, postavení a hodnotu v rámci kmene."
 rites_of_passage_decision_effect_tooltip: "Mladý člověk podstoupí jeden z následujících obřadů: $rites_of_passage_duel$, $rites_of_passage_scarification$, $rites_of_passage_seclusion$, $rites_of_passage_shaving$ nebo očistu živlem"
 rites_of_passage_decision_confirm: "Nastal čas"
 rites_of_passage_duel: "Duel"
 rites_of_passage_scarification: "Rituální jizvení"
 rites_of_passage_seclusion: "Samota"
 rites_of_passage_shaving: "Oholení hlavy"
 bp2_decision.0002.t: "Obřady dospělosti"
 bp2_decision.0002.desc: "[ROOT.Char.GetCulture.GetName] kultura uznává dospělost, postavení a vlastní hodnotu teprve tehdy, když je člověk prokáže při obřadu. Vhodného věku už [Select_CString(teentribal.IsFemale,'dosáhla','dosáhl')] také [teentribal.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort',teentribal)]. Náš lid zná tři prastaré způsoby, jak [teentribal.GetFirstNameNoTooltip] podrobit zkoušce.\n\n"
 bp2_decision.0002.desc_root: "Dokud neprokážu svou dospělost, ostatní [ROOT.Char.GetCulture.GetCollectiveNoun] mě nebudou považovat za [Select_CString(ROOT.Char.IsFemale,'plnohodnotnou členku','plnohodnotného člena')] kmene. Náš lid zná tři prastaré obřady, které znamenají vstup do dospělosti... a prověří mou hodnotu. Jako [ROOT.Char.GetTitleAsName] musím obstát.\n\n"
 bp2_decision.0002.desc_duel: "V duelu proti někomu z [ROOT.Char.GetCulture.GetName] kultury rozhodnou dovednost a síla."
 bp2_decision.0002.desc_scarification: "Při rituálním jizvení se odhodlání vrývá přímo do kůže."
 bp2_decision.0002.desc_seclusion: "V samotě se prověřuje přizpůsobivost a prozíravost."
 bp2_decision.0002.desc_hair_shaving: "Oholení krásných vlasů prověří sílu vůle."
 bp2_decision.0002.desc_cleansing: "Zkouška $cleansing_type_element$ prověří trpělivost a horlivost."
 bp2_decision.0002.desc_end: "\n\nPokud [teentribal.GetFirstNameNoTooltip] projde některou z těchto zkoušek, získá přízeň v očích [ROOT.Char.GetFaith.HighGodName] a [ROOT.Char.GetCulture.GetNameNoTooltip] kultura [Select_CString(teentribal.IsFemale,'ji uzná za dospělou a hodnou úcty','ho uzná za dospělého a hodného úcty')]."
 bp2_decision.0002.desc_end_root: "\n\nPokud některou z těchto zkoušek zvládnu, získám přízeň v očích [ROOT.Char.GetFaith.HighGodName] a [ROOT.Char.GetCulture.GetNameNoTooltip] kultura mě uzná za [Select_CString(ROOT.Char.IsFemale,'dospělou a hodnou úcty','dospělého a hodného úcty')]."
 bp2_decision.0002.effect_tt: "Získá buď [Concept('personality_trait','osobnostní rys')|E], [Concept('lifestyle_experience','zkušenosti životního stylu')|E], nebo bod [Concept('skill','dovednosti')|E]"
 bp2_decision.0002.effect_modifier_tt: "Na #V 10 let#! získá buď [GetModifier('proven_adult_modifier').GetNameWithTooltip], nebo [GetModifier('insecure_adult_modifier').GetNameWithTooltip]"
 bp2_decision.0002.a: "Duel."
 bp2_decision.0002.a.flavor: "Na jedné straně [teentribal.Custom('GirlBoy')], na druhé [teentribal.GetWomanMan]!"
 bp2_decision.0002.a.tt: "Vybereš soupeře pro [Concept('single_combat_duel','duel')|E]"
 bp2_decision.0002.a.win: "Pokud v souboji zvítězí"
 bp2_decision.0002.a.lose: "Pokud souboj prohraje"
 bp2_decision.0002.b: "Rituální jizvení."
 bp2_decision.0002.b.tt: "Všem ukaž, že mysl vládne tělu!"
 bp2_decision.0002.b_scarred: "Pokud zůstanou hluboké jizvy"
 bp2_decision.0002.b_scarred.tt: "Získá [GetTrait('scarred').GetName( GetNullCharacter )|LV] nebo [GetTrait('wounded_1').GetName( GetNullCharacter )|LV]"
 bp2_decision.0002.b_modifier: "Pokud se čepel kůže sotva dotkne"
 bp2_decision.0002.c: "Samota."
 bp2_decision.0002.c.tt: "Drsná divočina odhalí pravé já."
 bp2_decision.0002.c.destination: "Vybereš [Concept('travel_destination','cíl cesty')|E]"
 bp2_decision.0002.c_win: "Pokud v samotě obstojí"
 bp2_decision.0002.c_lose: "Pokud se samota změní v utrpení"
 bp2_decision.0002.c_trait: "Získá [Concept('commander_trait','velitelský rys')|E] podle terénu v cíli cesty"
 bp2_decision.0002.d: "Oholení hlavy."
 bp2_decision.0002.d.tt: "Ať s vlasy padnou i výsady dětství!"
