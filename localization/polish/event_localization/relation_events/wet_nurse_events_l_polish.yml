 bp2_yearly.7021.t: "$bp2_decision.0002.t$: $rites_of_passage_duel$"
 bp2_yearly.7021.desc: "Kdo náleží k [ROOT.Char.GetCulture.GetName] kultuře, musí pohrdat strachem, odmítat slabost a počítat s tím, že život přináší bolest.\n\nMladá krev už [teentribal.GetFirstName] svedla k ranám s vrstevníky, nikdy však ještě nestála proti skutečně dospělému soupeři z [ROOT.Char.GetCulture.GetNameNoTooltip] kultury.\n\nNáš kmen má mnoho zdatných bojovníků, ale jen jeden z nich smí prověřit, zda [teentribal.GetFirstNameNoTooltip] skutečně [Select_CString(teentribal.IsFemale,'dospěla','dospěl')] k této zkoušce."
 bp2_yearly.7021.desc_root: "Bojovníci se rodí v zápase a krvi.\n\nS vrstevníky už jsem si rány [Select_CString(ROOT.Char.IsFemale,'vyměnila','vyměnil')], ale proti skutečně důstojnému soupeři z [ROOT.Char.GetCulture.GetName] kultury jsem ještě [Select_CString(ROOT.Char.IsFemale,'nestála','nestál')].\n\nNáš kmen má mnoho zdatných bojovníků, ale k prověření své připravenosti smím podstoupit jen jediný souboj."
 bp2_yearly.7021.a: "[teentribal.GetFirstNameNoTooltip] se utká s [family_duelist.GetFirstNameNoTooltip]!"
 bp2_yearly.7021.a_root: "Proti tobě, [family_duelist.GetFirstNameNoTooltip], prokážu svou cenu!"
 bp2_yearly.7021.a.tt: "Proběhne [Concept('single_combat_duel','duel')|E]: [teentribal.GetFirstName] proti [family_duelist.GetFirstName]"
 bp2_yearly.7021.b_root: "Mou výzvu dostane [duelist_1.GetFirstNameNoTooltip]!"
 bp2_yearly.7021.b: "Soupeřem pro [teentribal.GetFirstNameNoTooltip] bude [duelist_1.GetFirstNameNoTooltip]!"
 bp2_yearly.7021.b.tt: "Proběhne [Concept('single_combat_duel','duel')|E]: [teentribal.GetFirstName] proti [duelist_1.GetFirstName]"
 bp2_yearly.7021.c: "[duelist_2.GetFirstNameNoTooltip] — předstup!"
 bp2_yearly.7021.c_root: "Mým soupeřem bude raději [duelist_2.GetFirstNameNoTooltip]."
 bp2_yearly.7021.c.tt: "Proběhne [Concept('single_combat_duel','duel')|E]: [teentribal.GetFirstName] proti [duelist_2.GetFirstName]"
 bp2_yearly.7021.d: "$bp2_decision.0002.f$"
 bp2_yearly.7021.d.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7022.t: "$bp2_decision.0002.t$: $rites_of_passage_duel$ je u konce"
 bp2_yearly.7022.desc_child_win: "Jakmile dozní kněžské požehnání, zbraně vyzyvatelů o sebe zazvoní. [sc_loser.GetFirstName] má díky zkušenostem zpočátku navrch — jenže [sc_victor.GetFirstName] útočí chytře a protivník ty výpady dlouho odrážet nedokáže.\n\nVítězný úder zasadí [teentribal.GetFirstNameNoTooltip] a [sc_loser.GetFirstNameNoTooltip] se poroučí k zemi.\n\n„Vzdávám se!“ zasténá [Select_CString(sc_loser.IsFemale,'starší bojovnice','starší bojovník')]. „[sc_victor.GetFirstNameNoTooltip] mi [Select_CString(sc_victor.IsFemale,'rozdrtila','rozdrtil')] klouby a krev mi zalila oči. Je stejně [Select_CString(sc_victor.IsFemale,'plnohodnotnou bojovnicí jako kterákoli','plnohodnotným bojovníkem jako kterýkoli')] z nás. [Select_CString(sc_victor.IsFemale,'Takovou bojovnici si','Takového bojovníka si')] [ROOT.Char.GetCulture.GetName] kultura zaslouží!“\n\nObřad je tím završen."
 bp2_yearly.7022.desc_child_lost: "Obětní úlitba ještě ani nestačí dopadnout na zem, když [sc_loser.GetFirstName] vyrazí do prudkého útoku! [sc_victor.GetFirstName] však pod přívalem ran podrží zkušenosti a bouři přečká. [teentribal.GetFirstNameNoTooltip] brzy začne ztrácet síly, přesto ze sebe vydá všechno... obřad však končí s čepelí na krku.\n\n[sc_victor.GetFirstNameNoTooltip] vidí v očích soupeře stále planoucí odhodlání a projeví velkorysost.\n\n„Přede mnou stojí [Select_CString(sc_loser.IsFemale,'bojovnice','bojovník')]! Místo mezi námi si člověk vyslouží bojem, ne vítězstvím. [sc_loser.GetFirstNameNoTooltip] [Select_CString(sc_loser.IsFemale,'prokázala odvahu bojovnice','prokázal odvahu bojovníka')] a čest našeho lidu.“"
 bp2_yearly.7022.desc_root_win: "„Dost!“ vydechne [sc_loser.GetFirstName] a odhodí [sc_loser.Custom('SignatureWeaponNameOrType')] do prachu. „Zasaď mi smrtící ránu jako [Select_CString(ROOT.Char.IsFemale,'plnoprávná bojovnice','plnoprávný bojovník')]! Byla by hanba zemřít rukou [Select_CString(ROOT.Char.IsFemale,'děvčete','chlapce')].“\n\n„Ale — #EMP co to říkám?#! Už teď bojuješ jako [Select_CString(ROOT.Char.IsFemale,'skutečná bojovnice','skutečný bojovník')]. Jako [ROOT.Char.GetTitleAsName], [Select_CString(ROOT.Char.IsFemale,'která pozná moc i vítězství','který pozná moc i vítězství')]! Přimluvím se za tebe a postarám se, aby ti přibyly výsady.“\n\nJe hotovo. [ROOT.Char.Custom('SignatureWeaponNameOrType')|U] prokázala mou hodnotu."
 bp2_yearly.7022.desc_root_lost: "[sc_victor.GetFirstName] má mnohem víc zkušeností než já... ale takhle obřad skončit nemůže! Snažím se zvednout a znovu se připravit k boji, jenže přicházím o zbraň. Vrhnu se za ní, ale soupeř mi zastoupí cestu. #EMP Takhle to skončit nemůže!#! \n\n[sc_victor.GetFirstNameNoTooltip] se na mě pobaveně dívá.\n\n„Stůj! [ROOT.Char.Custom('RegionalFerociousAnimal')|U] — přesně takovou zuřivost v tobě vidím! [ROOT.Char.GetCulture.GetName] kultura může být hrdá. [ROOT.Char.Custom( 'KnightCultureNoTooltipLowercase' )|U] — takový duch v tobě plane! [Select_CString(ROOT.Char.IsFemale,'Bojovala jsi statečně a navzdory porážce tě uznávám za členku kmene','Bojoval jsi statečně a navzdory porážce tě uznávám za člena kmene')].“\n\n„Tento výsledek přijímám.“"
 bp2_yearly.7022.toast: "[teentribal.GetFirstNameNoTooltip]: duel zanechá svou stopu"
 bp2_yearly.7022.a: "Takové je odhodlání rodu [teentribal.GetHouse.GetBaseNameNoTooltip]!"
 bp2_yearly.7022.a_victory: "Vítězství přináší sebedůvěru v bojovnickém umění i ve vlastní schopnosti."
 bp2_yearly.7022.a_loss: "[teentribal.GetFirstNameNoTooltip] na tuto porážku nikdy nezapomene... a pozná, že vytrvalost má své využití i mimo bojiště."
 bp2_yearly.7022.b: "Kmen získá [Select_CString(teentribal.IsFemale,'novou šampionku','nového šampiona')]."
 bp2_yearly.7022.b_victory: "Ještě zbývá naučit se mnoho triků, ale tohle je skvělý začátek!"
 bp2_yearly.7022.b_loss: "[teentribal.GetFirstNameNoTooltip] se musí naplno oddat výcviku, aby příští duely dopadly lépe!"
 bp2_yearly.7022.c: "Krvavá řež! #EMP Velmi#! krvavá řež..."
 bp2_yearly.7022.c_victory: "S proudící krví přichází jakási radost a probouzí se zlovolná vášeň..."
 bp2_yearly.7022.c_loss: "Tady vidím spíš někoho, kdo má počítat zásoby, než bojovat... pokud chce [teentribal.GetFirstNameNoTooltip] dlouho žít."
 bp2_yearly.7023.t: "$bp2_decision.0002.t$: $rites_of_passage_scarification$"
 bp2_yearly.7023.desc: "[ROOT.Char.GetCulture.GetCollectiveNoun] z mého kmene se shromažďují, aby přihlíželi rituálnímu jizvení. Vzduch houstne kouřem posvátných bylin a obřad zahajuje [priest.GetFirstName], [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]. Shromáždění ztichne.\n\n[priest.GetFirstNameNoTooltip] tasí rituální čepel.\n\n„Zde bude [teentribal.GetFirstName] z rodu [teentribal.GetHouse.GetName] [Select_CString(teentribal.IsFemale,'poznamenána a zjizvena','poznamenán a zjizven')], [Select_CString(teentribal.IsFemale,'zkoušena','zkoušen')] bolestí,“ pronese [priest.GetFirstNameNoTooltip] slavnostním hlasem. „Až před námi [teentribal.GetFirstNameNoTooltip] v budoucnu znovu stane, spatříme odhodlání — spatříme [Select_CString(teentribal.IsFemale,'ženu','muže')]!“"
 bp2_yearly.7023.a: "Jizvy budou důkazem i pýchou."
 bp2_yearly.7023.a.tt: "[priest.GetFirstNameNoTooltip] vede čepel rázně, znovu a znovu."
 bp2_yearly.7023.a_nothing: "Řezy jsou čisté"
 bp2_yearly.7023.a_scarred: "Řezy zanechají trvalé jizvy"
 bp2_yearly.7023.a_wounded: "Řezy jsou surově hluboké"
 bp2_yearly.7023.b: "Možná by to mohlo být jen... symbolické?"
 bp2_yearly.7023.b.tt: "[priest.GetFirstNameNoTooltip] zachází s čepelí jemně a zanechá jen nepatrné stopy."
 bp2_yearly.7023.c: "$bp2_decision.0002.f$"
 bp2_yearly.7023.c.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7024.t: "$bp2_decision.0002.t$: $rites_of_passage_seclusion$"
 bp2_yearly.7024.desc: "„Samota posiluje tělo i ducha,“ trvá na svém [priest.GetFirstName], [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]. „V klidu přichází moudrost! V přežití důvtip. Vyber místo, kde nalezneš soulad... ale také divočinu a strádání.“\n\n[priest.GetFirstNameNoTooltip] mi podává skromné zásoby.\n\n"
 bp2_yearly.7024.desc_capital: "„Doma je [teentribal.Custom('GirlBoy')] v bezpečí. [rite_location.GetName], [rite_location.GetTerrain.GetNameNoTooltip|l]... to je známé prostředí."
 bp2_yearly.7024.desc_abroad: "„Pro skutečnou zkoušku zvaž vzdálenou cizinu: [abroad_location.GetName], [abroad_location.GetTerrain.GetNameNoTooltip|l]!"
 bp2_yearly.7024.desc_realm: "„Nebo se můžeš vydat jen na krátkou cestu. Co třeba [realm_location.GetName]?"
 bp2_yearly.7024.desc_end: " Teď běž, dítě — ať ti [priest.GetFaith.KnowledgeGodName] propůjčí moudrost.“"
 bp2_yearly.7024.a: "Vzhůru do dalekých krajů!"
 bp2_yearly.7024.a.tt: "#N Vyšší#! pravděpodobnost nebezpečí"
 bp2_yearly.7024.a.abroad: "Cíl cesty: [abroad_location.GetName] ([abroad_location.GetTerrain.GetNameNoTooltip|l]); zde vládne [foreign_ruler.GetName]"
 bp2_yearly.7024.win: "Veškerému nebezpečí se podaří vyhnout"
 bp2_yearly.7024.lose: "Dostane se do nebezpečí"
 bp2_yearly.7024.b: "Cesta nemusí být příliš dlouhá."
 bp2_yearly.7024.b.tt: "#Z Střední#! pravděpodobnost nebezpečí"
 bp2_yearly.7024.b.realm: "Cíl cesty: [realm_location.GetName] ([realm_location.GetTerrain.GetNameNoTooltip|l])"
 bp2_yearly.7024.c: "Postačí zdejší divočina."
 bp2_yearly.7024.c.tt: "#P Nižší#! pravděpodobnost nebezpečí"
 bp2_yearly.7024.c.capital: "Místo samoty: [rite_location.GetName] ([rite_location.GetTerrain.GetNameNoTooltip|l]); [Concept('realm_capital','hlavní sídlo panství')|E]"
 bp2_yearly.7024.d: "$bp2_decision.0002.f$"
 bp2_yearly.7024.d.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7025.t: "$bp2_decision.0002.t$: $rites_of_passage_seclusion$"
 bp2_yearly.7025.desc: "— do mého malého tábora se vkrádá [teentribal.MakeScope.Var('animal_type').GetFlagName]!\n\nPřed tím zoufalým tvorem nemám šanci utéct. Musím ho přemoci, nebo přelstít. Po ruce mám čerstvě zabitého zajíce..."
 bp2_yearly.7025.desc_realm: "[realm_location.GetName] leží nedaleko. Tamní terén je [realm_location.GetTerrain.GetNameNoTooltip|l], a tak se brzy pouštím do příprav na noc. Když rozdělávám oheň, abych si připravil večeři, náhle něco zaslechnu $bp2_yearly.7025.desc$"
 bp2_yearly.7025.desc_abroad: "Svítá nad [seclusion_location.GetName]. Neznámý terén, [realm_location.GetTerrain.GetNameNoTooltip|l], byl v noci děsivý, v ranním světle je však nádherný. [seclusion_location.GetCounty.GetCulture.GetCollectiveNoun] nikde v dohledu.\n\nVedle napůl rozdělaného ohně náhle něco zaslechnu $bp2_yearly.7025.desc$"
 bp2_yearly.7025.desc_capital: "[rite_location.GetName] je hned poblíž, a tak si rychle najdu vhodné místo k táboření. Rozdělám oheň, abych se připravil na noc a dal si něco teplého. Náhle něco zaslechnu $bp2_yearly.7025.desc$"
 bp2_yearly.7025.desc_fight: " možná získám čas na luk, když zajíce hodím stranou?"
 bp2_yearly.7025.desc_outwit: " možná se dokážu nenápadně stáhnout, zatímco se [teentribal.MakeScope.Var('animal_type').GetFlagName] nasytí?"
 bp2_yearly.7025.a: "Odplížím se a schovám."
 bp2_yearly.7025.a_win: "Odplížíš se, zatímco šelmu zaměstnává návnada"
 bp2_yearly.7025.a_lose: "[teentribal.MakeScope.Var('animal_type').GetFlagName] se rozzuří a zaútočí na tebe"
 bp2_yearly.7025.tt: "Během samoty na tebe zaútočí [teentribal.MakeScope.Var('animal_type').GetFlagName]"
 bp2_yearly.7025.b: "Pár dobře mířených šípů — a [teentribal.MakeScope.Var('animal_type').GetFlagName] uteče!"
 bp2_yearly.7025.b_win: "[teentribal.MakeScope.Var('animal_type').GetFlagName] prchá pod přívalem šípů"
 bp2_yearly.7025.b_lose: "[teentribal.MakeScope.Var('animal_type').GetFlagName] vyvázne bez zranění a zaútočí"
 bp2_yearly.7026.t: "$bp2_decision.0002.t$: $rites_of_passage_shaving$"
 bp2_yearly.7026.desc: "Kmen se shromažďuje k obřadu stříhání vlasů. Všude kolem se ještě splétají jemné copy a pohupují krásné kadeře, jako by se s nimi všichni naposledy loučili.\n\n[priest.GetFirstName], [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], uchopí [teentribal.GetFirstNameNoTooltip] za vlasy a pozvedne zdobený nůž.\n\n„[teentribal.Custom('GirlBoy')|U] dnes zanechá dětství ve prospěch budoucnosti kmene! Odloží vše, co patří k dětským marnostem, a odhalí svou pravou podstatu i sílu ducha!“\n\n[priest.GetFirstNameNoTooltip] po mně nejistě střelí pohledem.\n\n„...pokud s tím [ROOT.Char.GetTitleAsName] souhlasí.“"
 bp2_yearly.7026.desc_child: "Kmen se shromažďuje k obřadu stříhání vlasů. Všude kolem se ještě splétají jemné copy a pohupují krásné kadeře, jako by se s nimi všichni naposledy loučili.\n\n[priest.GetFirstName], [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], mě uchopí za vlasy a pozvedne zdobený nůž.\n\n„[ROOT.Char.GetTitleAsName|U] dnes zanechá dětství ve prospěch budoucnosti kmene! Odloží vše, co patří k dětským marnostem, a odhalí svou pravou podstatu i sílu ducha!“\n\n[priest.GetFirstNameNoTooltip] po mně nejistě střelí pohledem.\n\n„...pokud s tím [ROOT.Char.GetTitleAsNameNoTooltip] souhlasí.“"
 bp2_yearly.7026.a: "Naprosté odhodlání: nemilosrdně oholit celou hlavu."
 bp2_yearly.7026.a.tt: "[priest.GetFirstNameNoTooltip] rázně přejede čepelí přes celou hlavu, jak se na obřad sluší."
 bp2_yearly.7026.a.toast: "Rituální holení je dokončeno."
 bp2_yearly.7026.b: "Ustřihnout jen jediný pramen a navždy ho uchovat!"
 bp2_yearly.7026.b.tt: "Tenký pramen vlasů je odstřižen a uložen do obřadního medailonu jako připomínka povinnosti."
 bp2_yearly.7026.b.toast: "Stříhání vlasů je dokončeno"
 bp2_yearly.7026.c: "$bp2_decision.0002.f$"
 bp2_yearly.7026.c.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7027.t: "$bp2_decision.0002.t$: Očista"
 bp2_yearly.7027.desc: "Kmen se v posvátné úctě shromažďuje na břehu vody a [priest.GetFirstName] pozvedá obřadní pohár.\n\n„Z několika kapek vzniklo moře! Z dítěte se stane [Select_CString(teentribal.IsFemale,'žena','muž')]! Tak to začíná.“ [priest.GetFirstNameNoTooltip] vylije posvátnou vodu na vlasy a kůži.\n\n„Ve jménu [priest.GetFaith.WaterGodName]: ať tě voda očistí, ať smyje dětství a zanechá moudrost dospělosti.“\n\nDalší část obřadu je na mně — a posvátná tůň čeká."
 bp2_yearly.7027.a: "Jen kdo se málem utopí, pozná vodu!"
 bp2_yearly.7027.a.tt: "Ponoření do posvátné vody trvá... skoro smrtelně dlouho."
 bp2_yearly.7027.b: "Obřadu postačí... lehké smočení."
 bp2_yearly.7027.b.tt: "Krátké ponoření: ve světě bdělých vládne symbolika."
 bp2_yearly.7027.c: "$bp2_decision.0002.f$"
 bp2_yearly.7027.c.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7027.tt: "Očista $cleansing_type_element$ je dokončena"
 bp2_yearly.7028.t: "$bp2_decision.0002.t$: Očista"
 bp2_yearly.7028.desc: "Mohutné plameny osvětlují zachmuřené tváře příslušníků mého kmene. [priest.GetFirstName], [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], rozhrne násadou kopí hranici a rozprostře žhavé uhlíky do planoucí stezky.\n\nDýchej — klidně dýchej, nabádám se.\n\n„Je toto dítě připraveno vstoupit mezi vás?!“ zvolá [priest.GetFirstNameNoTooltip]. „[priest.GetFaith.WarGodName] rozhodne, až [teentribal.GetFirstName] podstoupí zkoušku ohně! Jdi, dítě: spal vše, co tě činí nehodným, a na chladnou zem pak smíš vstoupit jako [Select_CString(teentribal.IsFemale,'dospělá členka','dospělý člen')] lidu, který utváří [ROOT.Char.GetCulture.GetName] kultura!“"
 bp2_yearly.7028.a: "[priest.GetFaith.WarGodName|U] provede věřícího ohněm!"
 bp2_yearly.7028.a.tt: "Po žhavých uhlících se kráčí pomalu, rozvážně a s krajní opatrností."
 bp2_yearly.7028.b: "Rychle! Přes uhlíky poběžím."
 bp2_yearly.7028.b.tt: "Obřadní chůze ohněm je dodržena, ale úprk přes uhlíky je rychlý jako vítr."
 bp2_yearly.7028.c: "$bp2_decision.0002.f$"
 bp2_yearly.7028.c.tt: "$bp2_decision.0002.cooldown$"
 bp2_yearly.7028.tt: "$bp2_yearly.7027.tt$"
 bp2_yearly.7029.t: "Obřady dospělosti: Důvěrně známý strach"
 bp2_yearly.7029.desc: "Jako [ROOT.Char.GetTitleAsName] uděluji svolení mladým lidem, kteří se chystají podstoupit obřady dospělosti. Někteří pronášejí odvážné sliby a přísahy, jimž by dostál jen málokdo. Jiní, jako [teentribal.GetFirstName], se třesou.\n\nDnes padla volba na stejnou zkoušku, jakou jsem kdysi podstoupil i já:"
 bp2_yearly.7029.desc_duel: "Cenu [teentribal.GetFirstNameNoTooltip] má prokázat zručnost se zbraní. Jenže si všimnu... že tu není žádný meč.\n\n„Vybraný soupeř je jako hora!“ zasténá [teentribal.GetFirstNameNoTooltip]. „Jak mám vyhrát jinak než nějakým podrazem?“"
 bp2_yearly.7029.desc_scarification: "Tvář [teentribal.GetFirstNameNoTooltip] mají navždy poznamenat jizvy jako důkaz příslušnosti k našemu lidu. Už pouhá představa čepele vyvolává zděšení.\n\n„Bojím se, že přijdu o oko!“ zasténá [teentribal.GetFirstNameNoTooltip]. „Jak se mám na něco tak strašného připravit?“"
 bp2_yearly.7029.desc_seclusion: "[teentribal.GetFirstNameNoTooltip] stojí před cestou do samoty jen chabě [Select_CString(teentribal.IsFemale,'připravená','připravený')]. Loučení se protahuje v objetích a oči se lesknou slzami.\n\n„Není to špatné znamení?“ zeptá se [teentribal.GetFirstNameNoTooltip]. „Ne? Ale stejně... tohle počasí. V takovém počasí přece nikdo necestuje?“"
 bp2_yearly.7029.desc_hair_shaving: "Vlasy [teentribal.GetFirstNameNoTooltip] mají být oholeny. Bílé klouby svírají celé hrsti vlasů v čiré hrůze.\n\n„Říká se, že mám nejkrásnější vlasy v celém kmeni!“ protestuje [teentribal.GetFirstNameNoTooltip]. „Nemohli bychom místo toho ostříhat nějaké obětní zvíře?!“"
 bp2_yearly.7029.desc_fire_cleanse: "[teentribal.GetFirstNameNoTooltip] má bosé nohy, aby před chůzí po žhavém uhlí poznal chlad. Malá rákosová lampička je podrobena podezřívavému pohledu.\n\n„Je na tom ohni vůbec něco pravdivého?“ zakňourá [teentribal.GetFirstNameNoTooltip]. „Jestli ode mě všichni chcete jen utrpení, asi vám ho tedy dopřeju až dost...“"
 bp2_yearly.7029.desc_water_cleanse: "[teentribal.GetFirstNameNoTooltip] čeká ponoření do vody. Nadšení z toho rozhodně není.\n\n„Možná přivolám nějakého tvora z hlubin, aby mě sežral,“ zabručí [teentribal.GetFirstNameNoTooltip]. „[ROOT.Char.GetFaith.PriestNeuter|U] mě chce zabít nejspíš stejně moc...“"
 bp2_yearly.7029.a: "Můj příběh o vlastní zkoušce dodá [teentribal.GetFirstNameNoTooltip] odvahu!"
 bp2_yearly.7029.a.tt: "Tvá slova znějí [teentribal.GetFirstNameNoTooltip] v uších a dodávají odhodlání čelit zkoušce."
 bp2_yearly.7029.a.teaching: "[teentribal.GetFirstNameNoTooltip] se od tebe mnohému naučí"
 bp2_yearly.7029.a.inspiration: "Tvůj příběh je nesmírně inspirativní"
 bp2_yearly.7029.b: "[teentribal.GetFirstNameNoTooltip] se musí poučit z vlastních chyb."
 bp2_yearly.7029.b.success: "[teentribal.GetFirstName] se naučí spoléhat na vlastní síly"
 bp2_yearly.7029.b.fail: "[teentribal.GetFirstName] obřad nezvládne dobře"
 bp2_yearly.7029.b.tt: "[teentribal.GetFirstNameNoTooltip] se se zkouškou potýká o samotě a odnese si z ní buď sílu dospělého člověka, nebo hanbu neúspěchu."
