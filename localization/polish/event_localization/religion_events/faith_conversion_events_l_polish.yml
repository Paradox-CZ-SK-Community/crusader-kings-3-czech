l_polish:
 faith_conversion.1001.t: "Konverze"
 faith_conversion.1001.start: "Po mém rozhodnutí přijmout [new_faith.GetName] přicházejí na řadu příslušné obřady. Ujme se jich [new_faith.PriestNeuter] a místem bude můj [ROOT.Char.Custom('GetCourt')|l].\n\n"
 faith_conversion.1001.desc: "Když je v sázce osud mé nesmrtelné duše, nezbývá mi než se modlit, aby mé rozhodnutí bylo správné.\n\nPonechám-li metafyziku stranou,"
 faith_conversion.1001.desc.zealous: "Při recitaci úryvků z [new_faith.ReligiousText] #EMP cítím#!, jak ve mně mé přesvědčení plane stále silněji. Není pochyb, že kráčím správnou cestou.\n\nAť je má horlivost sebevětší,"
 faith_conversion.1001.desc.zealous.carnal_male: "Při recitaci úryvků z [new_faith.ReligiousText] #EMP cítím#!, jak mé přesvědčení nabývá na objemu. Není pochyb, že kráčím správnou cestou.\n\nAť je má horlivost sebevětší,"
 faith_conversion.1001.desc.zealous.carnal_female: "Při recitaci úryvků z [new_faith.ReligiousText] #EMP cítím#!, jak ve mně mé přesvědčení pulzuje. Není pochyb, že kráčím správnou cestou.\n\nAť je má horlivost sebevětší,"
 faith_conversion.1001.desc.compassionate: "Když je v sázce nejen osud mé nesmrtelné duše, ale i duší mých poddaných, modlím se, aby mé rozhodnutí bylo správné.\n\nPonechám-li metafyziku stranou,"
 faith_conversion.1001.desc.reincarnation: "Když je v sázce život mého příštího vtělení, modlím se, aby mé rozhodnutí bylo správné.\n\nPonechám-li metafyziku stranou,"
 faith_conversion.1001.desc.cynical: "Žvástům, které [new_faith.PriestNeuter] chrlí, sice ve skutečnosti nevěřím, ale změna víry nabízela tolik politických výhod, že bylo jasné, že k ní dříve či později musí dojít.\n\nAť už byly mé důvody jakékoli, "
 faith_conversion.1001.end.is_vassal.convert_away: "mou nejbezprostřednější starostí jsou světské záležitosti. Jak [my_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] zareaguje na mé odmítnutí [Select_CString( my_liege.IsFemale, 'její', 'jeho' )] víry?"
 faith_conversion.1001.end.is_vassal.convert_to: "mohu si oddechnout s vědomím, že [my_liege.Custom2('MyCharacterIntroduction', ROOT.Char)] už mi mou víru nebude moci vyčítat."
 faith_conversion.1001.end.is_top_liege.convert_away: "mou nejbezprostřednější starostí jsou světské záležitosti. Když většina mých vazalů vyznává jinou víru, dokážu své panství udržet pohromadě proti vnitřním vzpourám i cizím mocnostem čekajícím na příležitost?"
 faith_conversion.1001.end.is_top_liege.convert_to: "mohu se utěšovat vědomím, že [new_faith.GetName] je společným vyznáním většiny mého panství a [new_faith.PantheonTerm] nás drží pohromadě."
 faith_conversion.1001.end.is_landless_adventurer: "představa, že se [new_faith.GetNameNoTooltip] bude krok za krokem šířit z mého skromného tábora, mi rozeznívá srdce radostí."
 faith_conversion.1001.a: "Ať [ROOT.Char.GetFaith.HighGodName] sklízí slávu!"
 faith_conversion.1001.b: "Alespoň [template_priest.GetFirstNameNoTooltip] mi může ukázat cestu..."
 faith_conversion.1101.toast: "[Select_CString( ROOT.Char.IsFemale, 'Lenní paní změnila víru', 'Lenní pán změnil víru' )]"
