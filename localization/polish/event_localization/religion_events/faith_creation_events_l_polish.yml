l_polish:
 faith_creation.1001.t.schism: "[reformed_faith.GetAdjectiveNoTooltip] rozkol"
 faith_creation.1001.t.reformation: "[reformed_faith.GetAdjectiveNoTooltip] reformace"
 faith_creation.1001.desc.schism: "[reformed_faith.GetReligion.GetName] nyní čelí nové roztržce. [old_faith.GetAdjective] víra přichází o část svých věřících, protože [reformer.GetTitledFirstName] se svými následovníky zakládá nové náboženské hnutí."
 faith_creation.1001.desc.reformation: "[reformed_faith.GetAdherentNamePlural] mají mezi sebou výraznou osobnost, jíž je [reformer.GetTitledFirstName]. Z jejího podnětu se nyní scházejí lidé ze všech koutů země, jejichž duchovní titul zní [reformer.Custom('DefaultPriestTitle')], ke společné debatě o svém přesvědčení a stanovení oficiální nauky pohanské víry."
 faith_creation.1001.desc.schism.personal: "[old_faith.GetAdjective] [old_faith.AltPriestTermPlural] už nevědí kudy kam a nelze jim dál svěřovat naše duchovní vedení. Proto se z mého podnětu nyní schází úzký kruh. Patří do něj [reformer.Custom('DefaultPriestTitlePlural')]. Společně probereme budoucnost naší víry."
 faith_creation.1001.desc.reformation.personal: "Konečně se mi podařilo shromáždit všechny významné představitele duchovenstva na světě, jejichž titul zní [reformer.Custom('DefaultPriestTitle')], ke společné debatě o našem přesvědčení a stanovení oficiální nauky, která bude naši víru vést do budoucna."
 faith_creation.1001.desc.schism.personal.hof: "Už nebudu klečet, zatímco [old_hof.GetTitledFirstName] a [old_faith.AltPriestTermPlural] [old_faith.GetAdjective] víry svádějí věřící na scestí. Shromáždil jsem [reformer.Custom('DefaultPriestTitlePlural')], kteří sdílejí mé přesvědčení, a z [old_rite.GetAdjective] ritu, který jsme zachovali, jsme vykovali víru, jež [old_faith.GetName] nic nedluží." # todo: NEW TRANSLATION
 faith_creation.1001.desc.schism.hof: "[reformer.GetTitledFirstName] zavrhl autoritu [old_hof.GetTitledFirstName] a odvádí [reformer.GetHerHis] následovníky od [old_faith.GetName]. Jejich [old_rite.GetAdjective] ritus se proměnil ve víru, která se nyní zodpovídá pouze sama sobě." # todo: NEW TRANSLATION
 faith_creation.1001.desc.outlook.ghw: "\n\nZapálení [reformer.Custom('DefaultPriestTitlePlural')] už mluví o tom, že [reformed_faith.GHWNamePlural] rozšíří jejich novou víru po celém světě a"
 faith_creation.1001.desc.outlook.pacifism: "\n\nTito [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] odsuzují násilí a krveprolití s tím, že válka vede jen k utrpení a nenávisti, a"
 faith_creation.1001.desc.outlook.dogmatic: "\n\nTito [reformer.Custom('DefaultPriestTitlePlural')] zastávají názor, že [reformed_faith.GetNameNoTooltip] je jediná pravá víra, a"
 faith_creation.1001.desc.outlook.accepting: "\n\nTito [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] podporují spolupráci a toleranci i vůči nevěřícím, a"
 faith_creation.1001.desc.outlook.fallback: "\n\nTito [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] zaujímají k ostatním vírám pragmatický a vyvážený postoj a"
 faith_creation.1001.desc.belief.sacrifice: "tvrdí, že jediným náležitým projevem oddanosti jsou lidské oběti na počest [reformed_faith.HighGodName]!"
 faith_creation.1001.desc.belief.indulgent: "vyzývají věřící, aby se oddávali tělesným touhám a užívali života plnými doušky."
 faith_creation.1001.desc.belief.incest: "schvalují sňatky mezi blízkými příbuznými s tím, že rodinná pouta jsou posvátná a takovým svazkům náleží požehnání."
 faith_creation.1001.desc.belief.aniconism: "odmítají veškerou náboženskou symboliku s tvrzením, že žádné pouhé zpodobnění nedokáže postihnout vše, co představuje [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.ascetic: "prosazují mezi svými stoupenci askezi s tím, že honba za hmotnými statky brání duchovnímu naplnění."
 faith_creation.1001.desc.belief.spirits: "žádají duchy o pomoc při vedení věřících těmito bouřlivými časy."
 faith_creation.1001.desc.belief.superstition: "zařazují do oficiální nauky mnohé prastaré pověry a mytické příběhy."
 faith_creation.1001.desc.belief.nature: "chovají hlubokou úctu k samotné přírodě a snaží se ji chránit před těmi, kdo by ji chtěli využít pro vlastní prospěch."
 faith_creation.1001.desc.belief.community: "[reformed_faith.GetAdherentNamePluralNoTooltip] propojují novou víru se svými kulturními tradicemi a vytvářejí pevně semknutá společenství, která nerada přijímají cizince."
 faith_creation.1001.desc.belief.pain: "učí, že tělo je třeba pokořit strádáním a bolestí, neboť utrpení očišťuje duši a přibližuje věřící k [reformed_faith.HighGodName]." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.iconoclasm: "trvají na tom, že pozemské modly napodobující božské tváře je třeba strhnout a spálit, ať se nacházejí kdekoli." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.militant: "učí, že věřící jsou především vojáci, kteří mají šířit víru ostřím meče." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.veneration: "uctívají svaté zesnulé jako přímluvce, ctí jejich ostatky a vzývají jejich jména v modlitbách." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.sacraments: "učí, že svatá milost plyne lidstvu pouze prostřednictvím posvátných obřadů a vysvěcených duchovních." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.penance: "učí, že každá duše se rodí poskvrněná a očistit ji lze pouze zpovědí a pokáním." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.christology: "vyřešili zásadní otázku nauky a stanovili samotnou podstatu božství tak, jak ji musí vyznávat všichni věřící." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.rebirth: "učí, že duše putuje kolem znovuzrození a každý život utvářejí skutky toho předchozího." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.learning: "nade vše si cení vzdělanosti a učí, že studovat svět znamená lépe poznávat mysl [reformed_faith.HighGodName]." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.law: "staví posvátné právo nade vše a trvají na tom, že každou nauku je třeba přesně dodržovat." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.missionary: "přísahali, že svou nauku přinesou do všech koutů světa, aby žádná duše nezůstala v temnotě." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.hierarchy: "učí, že všechno má své náležité místo a že harmonie nastává jen tehdy, když každá duše ctí řád, který jí byl určen." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.charity: "nabádají své následovníky, aby na strádání odpovídali dobročinností a pomáhali chudým, nemocným i cizincům." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.family: "považují pokrevní pouta za posvátná a učí, že uctívat lze i ctěním předků a výchovou mnoha dětí." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.sacred_sites: "staví velkolepé kamenné památníky jako svědectví své oddanosti, posvátná místa, která mají přetrvat generace." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.worldly: "přistupují k oddanosti pragmaticky a věří, že dary, kompromisy a dobře načasované mlčení slouží víře stejně dobře jako modlitba." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.syncretic: "vetkávají do svého vyznání víru svých sousedů a věří, že k téže pravdě vede mnoho cest." # todo: NEW TRANSLATION
 faith_creation.1001.desc.belief.fallback: "vyzývají všechny věřící k odložení starých sporů a sjednocení ve jménu nové víry."
 faith_creation.1001.desc.temporal: "\n\nDo čela tohoto rodícího se [reformed_faith.GetAdjectiveNoTooltip] hnutí se osobně staví [reformer.GetFirstNameNoTooltip] jako [reformed_faith.ReligiousHeadName]. Tato vznešená hodnost má později přejít na dědice."
 faith_creation.1001.desc.temporal.personal: "\n\nOsobně se ujímám vedení tohoto rodícího se [reformed_faith.GetAdjectiveNoTooltip] hnutí jako [reformed_faith.ReligiousHeadName]. Tato vznešená hodnost po mně přejde na mé potomky."
 faith_creation.1001.desc.spiritual: "\n\n[reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] vybírají novou hlavu svého společenství. [reformed_hof.GetFirstNameNoTooltip] bude jejich [reformed_faith.ReligiousHeadName] a bude určovat náboženskou nauku i rozhodovat spory mezi vírami v celém [reformed_faith.GetAdjectiveNoTooltip] světě."
 faith_creation.1001.desc.spiritual.sameold: "\n\n[reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] ponechávají dosavadní uspořádání. [reformed_hof.GetFirstNameNoTooltip] zůstává jejich [reformed_faith.ReligiousHeadName] a bude i nadále určovat náboženskou nauku a rozhodovat spory mezi vírami v celém [reformed_faith.GetAdjectiveNoTooltip] světě."
 faith_creation.1001.desc.no_head: "\n\nRodící se hnutí se rozhodlo neustanovovat náboženskou hlavu. Namísto toho bude o učení vhodném pro vlastní [reformed_faith.HouseOfWorship] rozhodovat místní [reformer.Custom('DefaultPriestTitle')]."
 faith_creation.1001.desc.no_holy_sites: "\n\n[reformed_faith.ReligiousHeadName] má podle proroctví teprve přijít a [reformed_faith.GetAdherentNamePluralNoTooltip] tento okamžik netrpělivě očekávají. Tato velká osobnost sjednotí všechny věřící a zahájí nový [reformed_faith.GetAdjectiveNoTooltip] zlatý věk."
 faith_creation.1001.o.frightened: "[second.Custom('GetUnbelieverNamePlural')] prahnou po krvi! Ať nás před nimi [ROOT.Char.GetFaith.random_GoodGodNames] ochrání!"
 faith_creation.1001.o.heretical: "Tito kacíři zaplatí za své zločiny proti [ROOT.Char.GetFaith.HighGodName]!"
 faith_creation.1001.o.crusader: "[second.Custom('GetUnbelieverNamePlural')] brzy poznají své místo. [ROOT.Char.GetFaith.GHWName] se o to postará, třeba i víc než jednou!"
 faith_creation.1001.o.interested: "Tento nový vývoj bychom měli bedlivě sledovat..."
 faith_creation.1001.o.uninterested: "[second.Custom('GetUnbelieverNamePlural')] si mohou věřit, čemu chtějí. Je to bezvýznamné."
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "Získáte #V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! bezplatných akcí k vytvoření, snížení úrovně, povýšení, přijetí či opuštění [holy_sites|E]" # todo: NEW TRANSLATION
 faith_creation.1001.o.personal: "Svět uvidí, že [ROOT.Char.GetFaith.HighGodName] stojí při nás!"
 faith_creation.1002.t: "Odtržený ritus" # todo: NEW TRANSLATION
 faith_creation.1002.t.new_faith: "Víra podle nás" # todo: NEW TRANSLATION
 faith_creation.1002.desc.intro.founder: "Můj [old_rite.GetAdjective] ritus se postupně měnil — modlitbu za modlitbou, zásadu za zásadou — až přestal být vírou [old_faith.GetName]." # todo: NEW TRANSLATION
 faith_creation.1002.desc.intro.member: "Náš [old_rite.GetAdjective] ritus se za [founder.GetTitledFirstName] postupně měnil — modlitbu za modlitbou, zásadu za zásadou — až přestal být vírou [old_faith.GetName]." # todo: NEW TRANSLATION
 faith_creation.1002.desc.intro.observer: "[old_rite.GetAdjective] ritus [founder.GetTitledFirstName] se postupně měnil — modlitbu za modlitbou, zásadu za zásadou — až přestal být vírou [old_faith.GetName]." # todo: NEW TRANSLATION
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.GetTitledFirstName] vynáší rozsudek: zbloudilé stádo je vyobcováno, zpřetrhají se s ním veškerá pouta." # todo: NEW TRANSLATION
 faith_creation.1002.desc.anathema.no_hof: "\n\n[old_faith.AltPriestTermPlural] víry [old_faith.GetName] vynášejí rozsudek od každého oltáře: zbloudilé stádo je vyvrženo, i s kořeny." # todo: NEW TRANSLATION
 faith_creation.1002.desc.new_head.personal: "Vše, co přijde, leží na mých bedrech: dokud budu žít, jsem [new_faith.GetName] [new_faith.ReligiousHeadName|U]." # todo: NEW TRANSLATION
 faith_creation.1002.desc.new_head.founder: "Ti, kdo je následovali do vyhnanství, je následují i nadále — [founder.GetFirstNameNoTooltip], [new_faith.GetName] [new_faith.ReligiousHeadName|U]." # todo: NEW TRANSLATION
 faith_creation.1002.desc.new_head.other: "[new_hof.GetTitledFirstName] nyní stojí v čele [new_faith.GetName] jako [new_faith.ReligiousHeadName|U]." # todo: NEW TRANSLATION
 faith_creation.1002.desc.new_head.none: "Nové stádo nemá žádného pastýře; jeho [new_faith.AltPriestTermPlural] se zodpovídají pouze sami sobě." # todo: NEW TRANSLATION
 faith_creation.1002.desc.outro.new_faith: "\n\nVíra našeho zrodu, zákon našeho zrodu — vyznání, které právě promluvilo, ale na něž mohou [old_faith.GetAdherentNamePlural] odpovědět odsouzením i mečem." # todo: NEW TRANSLATION
 faith_creation.1002.desc.outro.old_faith: "\n\nVšechny země a duše vyznávající [old_rite.GetName] se jediným prohlášením zříkají [old_faith.GetName]. Od této chvíle jsou nám cizí — a brzy možná i nepřáteli." # todo: NEW TRANSLATION
 faith_creation.1002.a: "Konečně máme vlastní víru." # todo: NEW TRANSLATION
 faith_creation.1002.a.founder: "Tato cesta nám vždy patřila — a teď nám patří i její jméno." # todo: NEW TRANSLATION
 faith_creation.1002.b: "Kacíři, nyní i navždy." # todo: NEW TRANSLATION
 faith_creation.1002.b.hof: "Ať poznají, jaký chlad čeká mimo stádo." # todo: NEW TRANSLATION
 faith_creation.1002.consequences.tt: "[new_faith.GetName] je zcela samostatná [faith|E]:\n$EFFECT_LIST_BULLET$Všechny [characters|E] a [counties|E] náležející k původnímu [rite|E] přecházejí k nové víře\n$EFFECT_LIST_BULLET$Mezi [new_faith.GetName] a [old_faith.GetName] se uplatňuje [faith_hostility|E], což může umožnit [holy_wars|E]\n$EFFECT_LIST_BULLET$[faiths|E] již nesdílejí [head_of_faith|E]" # todo: NEW TRANSLATION
 faith_creation.1002.a.free_holy_site_actions: "[new_faith.GetName] získává #V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! bezplatných akcí k vytvoření, snížení úrovně, povýšení, přijetí či opuštění [holy_sites|E]" # todo: NEW TRANSLATION
 faith_creation.1002.a.lost_ecumenism: "[new_faith.GetName] ztrácí [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]" # todo: NEW TRANSLATION
 faith_creation.1010.t: "[HoF.GetFirstNameNoTooltip] se stává [faith.ReligiousHeadName|U]"
 faith_creation.1010.desc.start: "O oprávněnosti naší víry nikdy nebylo pochyb, ale období bez duchovního vůdce bylo těžkou zkouškou. Ta je konečně u konce, protože"
 faith_creation.1010.desc.temporal.personal: "se mi konečně podařilo dosáhnout uznání a [faith.AltPriestTermPlural] nyní přijímají, že [faith.ReligiousHeadName|U] jsem já a nikdo jiný."
 faith_creation.1010.desc.temporal: "[faith.AltPriestTermPlural] se nakonec nechávají přesvědčit a [HoF.GetTitledFirstName] se tak stává [faith.ReligiousHeadName|U]."
 faith_creation.1010.desc.spiritual: "[faith.AltPriestTermPlural] se scházejí k volbě. [HoF.GetFirstName] je výsledkem jejich rozhodnutí a jako [faith.ReligiousHeadName|U] se stává jedinou uznávanou hlavou víry."
 faith_creation.1010.desc.end: "\n\nKonečně nastává jednota věřících pod jediným vedením a [faith.GetNameNoTooltip] tak vstupuje do nového zlatého věku."
 faith_creation.1010.desc.end.personal: "\n\nKonečně nastává jednota věřících pod mým vedením a [faith.GetNameNoTooltip] vstoupí do nového zlatého věku!"
 faith_creation.1010.a: "Ať [faith.HighGodName] sklízí slávu!"
 faith_creation.1011.message.title: "Ustanovena hlava víry"
 faith_creation.1011.message.desc: "[faith.GetAdjective] [faith.AltPriestTermPlural] oznamují, že [faith.ReligiousHeadName|U] [HoF.GetFirstName] je jejich [Concept('head_of_faith','hlavou víry')|E]"
 faith_creation.1021.t: "Ritus uvnitř společenství" # todo: NEW TRANSLATION
 faith_creation.1021.t.founder: "Náš vlastní ritus" # todo: NEW TRANSLATION
 faith_creation.1021.desc.intro.founder: "[new_rite.GetName] je pevně ustaven a jeho následovníci vzhlížejí ke mně. Stále jsme [old_faith.GetAdherentNamePlural], přestože jsme se oddělili od [source_rite.GetName]." # todo: NEW TRANSLATION
 faith_creation.1021.desc.intro.observer: "[founder.GetTitledFirstName] ustavil v rámci [old_faith.GetName] nový ritus. Jeho následovníci jej znají jako [new_rite.GetName] a ten zachovává víru [old_faith.GetAdjective]... ovšem po svém." # todo: NEW TRANSLATION
 faith_creation.1021.desc.divergence.minor: "\n\nOd [source_rite.GetAdjective] ritu se liší jen v maličkostech. " # todo: NEW TRANSLATION
 faith_creation.1021.desc.divergence.moderate: "\n\nPro následovníky [source_rite.GetName] jsou zvyklosti tohoto nového ritu poněkud zvláštní. " # todo: NEW TRANSLATION
 faith_creation.1021.desc.divergence.major: "\n\nJeho zvyklosti se od [source_rite.GetAdjectiveNoTooltip] ritu odchylují natolik, že vzbuzují podezření. " # todo: NEW TRANSLATION
 faith_creation.1021.desc.differing.tenet: "Nejvýraznější rozdíl představuje zásada [differing_tenet.GetBaseName]." # todo: NEW TRANSLATION
 faith_creation.1021.desc.differing.doctrine: "Nejvýraznější rozdíl představuje nauka [differing_doctrine.GetDescriptiveName]." # todo: NEW TRANSLATION
 faith_creation.1021.desc.differing.fallback: "Rozdělení nevyznačuje žádná jediná zvyklost." # todo: NEW TRANSLATION
 faith_creation.1021.desc.outro.founder.mainline: "\n\nOddělili jsme se od hlavního proudu ritu, od samotného měřítka, jímž [old_faith.GetNameNoTooltip] posuzuje všechny ostatní. Nazvou-li to domýšlivostí, budiž." # todo: NEW TRANSLATION
 faith_creation.1021.desc.outro.founder.branch: "\n\nVždy jsme byli odnoží, jednou z větví; od nynějška jsme větví podle vlastních představ a řídíme se sami." # todo: NEW TRANSLATION
 faith_creation.1021.desc.outro.observer: "\n\nNové rity vznikají dost často. Tento může zapustit kořeny, uvadnout, nebo zpustnout v kacířství; ukáže to čas." # todo: NEW TRANSLATION
 faith_creation.1021.a.founder: "Ať se tiše šíří mezi zbožnými." # todo: NEW TRANSLATION
 faith_creation.1021.b.founder: "Ať se o něm dozví celá říše." # todo: NEW TRANSLATION
 faith_creation.1021.a: "Živá víra má prostor pro mnoho ritů." # todo: NEW TRANSLATION
 faith_creation.1021.b: "Každé kacířství začíná jako novota." # todo: NEW TRANSLATION

