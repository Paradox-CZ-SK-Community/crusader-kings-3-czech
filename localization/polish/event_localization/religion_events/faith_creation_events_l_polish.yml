l_polish:
 faith_creation.1001.t.schism: "[reformed_faith.GetAdjectiveNoTooltip] rozkol"
 faith_creation.1001.t.reformation: "[reformed_faith.GetAdjectiveNoTooltip] reformace"
 faith_creation.1001.desc.schism: "[reformed_faith.GetReligion.GetName] nyní čelí nové roztržce. [old_faith.GetAdjective] víra přichází o část svých věřících, protože [reformer.GetTitledFirstName] se svými následovníky zakládá nové náboženské hnutí."
 faith_creation.1001.desc.reformation: "[reformed_faith.GetAdherentNamePlural] mají mezi sebou výraznou osobnost, jíž je [reformer.GetTitledFirstName]. Z jejího podnětu se nyní scházejí lidé ze všech koutů země, jejichž duchovní titul zní [reformer.Custom('DefaultPriestTitle')], ke společné debatě o svém přesvědčení a stanovení oficiální nauky pohanské víry."
 faith_creation.1001.desc.schism.personal: "[old_faith.GetAdjective] [old_faith.AltPriestTermPlural] už nevědí kudy kam a nelze jim dál svěřovat naše duchovní vedení. Proto se z mého podnětu nyní schází úzký kruh. Patří do něj [reformer.Custom('DefaultPriestTitlePlural')]. Společně probereme budoucnost naší víry."
 faith_creation.1001.desc.reformation.personal: "Konečně se mi podařilo shromáždit všechny významné představitele duchovenstva na světě, jejichž titul zní [reformer.Custom('DefaultPriestTitle')], ke společné debatě o našem přesvědčení a stanovení oficiální nauky, která bude naši víru vést do budoucna."
 faith_creation.1001.desc.schism.personal.hof: "Už nebudu pokorně klečet, zatímco [old_hof.GetTitledFirstName] a [CZFaithAdjSti(old_faith)] [old_faith.AltPriestTermPlural] svádějí věřící na scestí. Kolem mě se shromáždili [reformer.Custom('DefaultPriestTitlePlural')], kteří sdílejí mé přesvědčení. Náš [old_rite.GetAdjective] ritus se stal základem nové víry a [old_faith.GetName] už na ni nemá žádný nárok."
 faith_creation.1001.desc.schism.hof: "[reformer.GetTitledFirstName] se [Select_CString(reformer.IsFemale,'zřekla','zřekl')] autority [old_hof.Custom('CZ_TitledFirstName_G')] a odvádí své stoupence od původní víry [old_faith.GetName]. Jejich [old_rite.GetAdjective] ritus se rozrostl ve víru, která se nyní zodpovídá jen sama sobě."
 faith_creation.1001.desc.outlook.ghw: "\n\nZapálení [reformer.Custom('DefaultPriestTitlePlural')] už mluví o tom, že [reformed_faith.GHWNamePlural] rozšíří jejich novou víru po celém světě a"
 faith_creation.1001.desc.outlook.pacifism: "\n\nTito [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] odsuzují násilí a krveprolití s tím, že válka vede jen k utrpení a nenávisti, a"
 faith_creation.1001.desc.outlook.dogmatic: "\n\nTito [reformer.Custom('DefaultPriestTitlePlural')] zastávají názor, že [reformed_faith.GetNameNoTooltip] je jediná pravá víra, a"
 faith_creation.1001.desc.outlook.accepting: "\n\nTito [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] podporují spolupráci a toleranci i vůči nevěřícím, a"
 faith_creation.1001.desc.outlook.fallback: "\n\nTito [reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] zaujímají k ostatním vírám pragmatický a vyvážený postoj a"
 faith_creation.1001.desc.belief.sacrifice: "tvrdí, že jediným náležitým projevem oddanosti jsou lidské oběti na počest [reformed_faith.HighGodName]!"
 faith_creation.1001.desc.belief.indulgent: "vyzývají věřící, aby se oddávali tělesným touhám a užívali života plnými doušky."
 faith_creation.1001.desc.belief.incest: "schvalují sňatky mezi blízkými příbuznými s tím, že rodinná pouta jsou posvátná a takovým svazkům náleží požehnání."
 faith_creation.1001.desc.belief.aniconism: "odmítají veškerou náboženskou symboliku s tvrzením, že žádné pouhé zpodobnění nedokáže postihnout vše, co představuje [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.ascetic: "prosazují mezi svými stoupenci askezi s tím, že honba za hmotnými statky brání duchovnímu naplnění."
 faith_creation.1001.desc.belief.spirits: "žádají duchy o pomoc při vedení věřících těmito bouřlivými časy."
 faith_creation.1001.desc.belief.superstition: "zařazují do oficiální nauky mnohé prastaré pověry a mytické příběhy."
 faith_creation.1001.desc.belief.nature: "chovají hlubokou úctu k samotné přírodě a snaží se ji chránit před těmi, kdo by ji chtěli využít pro vlastní prospěch."
 faith_creation.1001.desc.belief.community: "[reformed_faith.GetAdherentNamePluralNoTooltip] propojují novou víru se svými kulturními tradicemi a vytvářejí pevně semknutá společenství, která nerada přijímají cizince."
 faith_creation.1001.desc.belief.pain: "učí, že tělo musí pokořit strádání a bolest, neboť utrpení očišťuje duši a přibližuje věřící k božstvu [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.iconoclasm: "trvají na tom, aby byly svrženy a spáleny všechny pozemské modly, které napodobují božské tváře, ať už se nacházejí kdekoli."
 faith_creation.1001.desc.belief.militant: "učí, že věřící jsou především vojáky, vyslanými šířit víru na ostří meče."
 faith_creation.1001.desc.belief.veneration: "uctívají svaté zesnulé jako přímluvce, vzdávají čest jejich ostatkům a vzývají jejich jména v modlitbách."
 faith_creation.1001.desc.belief.sacraments: "učí, že svatá milost proudí k lidstvu jedině prostřednictvím posvátných obřadů a hrstky vysvěcených."
 faith_creation.1001.desc.belief.penance: "učí, že každá duše se rodí poskvrněná a tuto skvrnu lze smýt jedině zpovědí a pokáním."
 faith_creation.1001.desc.belief.christology: "rozřešili velkou otázku nauky a přesně vymezili samotnou podstatu božství, k níž se musí hlásit všichni věřící."
 faith_creation.1001.desc.belief.rebirth: "učí, že duše se otáčí na velikém kole znovuzrození a každý život utvářejí skutky toho předešlého."
 faith_creation.1001.desc.belief.learning: "nade vše si cení učenosti a učí, že studium světa pomáhá lépe poznat, jak uvažuje [reformed_faith.HighGodName]."
 faith_creation.1001.desc.belief.law: "staví posvátný zákon nade vše a trvají na přesném dodržování každého řádku nauky."
 faith_creation.1001.desc.belief.missionary: "přísahali, že své učení zanesou do všech koutů země, aby ani jediná duše nezůstala v temnotě."
 faith_creation.1001.desc.belief.hierarchy: "učí, že vše má své právoplatné místo a soulad nastává jedině tehdy, když každá duše ctí řád, jemuž podléhá."
 faith_creation.1001.desc.belief.charity: "vyzývají své stoupence, aby na strádání odpovídali milosrdenstvím a pečovali o chudé, nemocné i cizince."
 faith_creation.1001.desc.belief.family: "pokládají pokrevní pouta za posvátná a učí, že úcta k předkům a výchova mnoha dětí jsou samy o sobě bohoslužbou."
 faith_creation.1001.desc.belief.sacred_sites: "staví veliké kamenné památníky jako svědectví své oddanosti, posvátná místa, která přetrvají celé generace."
 faith_creation.1001.desc.belief.worldly: "k oddanosti přistupují prakticky a věří, že dary, kompromisy a vhodně zvolené mlčení slouží víře stejně dobře jako modlitba."
 faith_creation.1001.desc.belief.syncretic: "vplétají do svého vyznání víru sousedů a věří, že ke stejné pravdě vede mnoho cest."
 faith_creation.1001.desc.belief.fallback: "vyzývají všechny věřící k odložení starých sporů a sjednocení ve jménu nové víry."
 faith_creation.1001.desc.temporal: "\n\nDo čela tohoto rodícího se [reformed_faith.GetAdjectiveNoTooltip] hnutí se osobně staví [reformer.GetFirstNameNoTooltip] jako [reformed_faith.ReligiousHeadName]. Tato vznešená hodnost má později přejít na dědice."
 faith_creation.1001.desc.temporal.personal: "\n\nOsobně se ujímám vedení tohoto rodícího se [reformed_faith.GetAdjectiveNoTooltip] hnutí jako [reformed_faith.ReligiousHeadName]. Tato vznešená hodnost po mně přejde na mé potomky."
 faith_creation.1001.desc.spiritual: "\n\n[reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] vybírají novou hlavu svého společenství. [reformed_hof.GetFirstNameNoTooltip] bude jejich [reformed_faith.ReligiousHeadName] a bude určovat náboženskou nauku i rozhodovat spory mezi vírami v celém [reformed_faith.GetAdjectiveNoTooltip] světě."
 faith_creation.1001.desc.spiritual.sameold: "\n\n[reformed_faith.GetAdjectiveNoTooltip] [reformer.Custom('DefaultPriestTitlePlural')] ponechávají dosavadní uspořádání. [reformed_hof.GetFirstNameNoTooltip] zůstává jejich [reformed_faith.ReligiousHeadName] a bude i nadále určovat náboženskou nauku a rozhodovat spory mezi vírami v celém [reformed_faith.GetAdjectiveNoTooltip] světě."
 faith_creation.1001.desc.no_head: "\n\nRodící se hnutí se rozhodlo neustanovovat náboženskou hlavu. Namísto toho bude o učení vhodném pro vlastní [reformed_faith.HouseOfWorship] rozhodovat místní [reformer.Custom('DefaultPriestTitle')]."
 faith_creation.1001.desc.no_holy_sites: "\n\n[reformed_faith.ReligiousHeadName] má podle proroctví teprve přijít a [reformed_faith.GetAdherentNamePluralNoTooltip] tento okamžik netrpělivě očekávají. Tato velká osobnost sjednotí všechny věřící a zahájí nový [reformed_faith.GetAdjectiveNoTooltip] zlatý věk."
 faith_creation.1001.o.frightened: "[second.Custom('GetUnbelieverNamePlural')] prahnou po krvi! Ať nás před nimi [ROOT.Char.GetFaith.random_GoodGodNames] ochrání!"
 faith_creation.1001.o.heretical: "Tito kacíři zaplatí za své zločiny proti [ROOT.Char.GetFaith.HighGodName]!"
 faith_creation.1001.o.crusader: "[second.Custom('GetUnbelieverNamePlural')] brzy poznají své místo. [ROOT.Char.GetFaith.GHWName] se o to postará, třeba i víc než jednou!"
 faith_creation.1001.o.interested: "Tento nový vývoj bychom měli bedlivě sledovat..."
 faith_creation.1001.o.uninterested: "[second.Custom('GetUnbelieverNamePlural')] si mohou věřit, čemu chtějí. Je to bezvýznamné."
 faith_creation.1001.o.getreaction: "[ROOT.Char.Custom2('GetFaithCreationReaction', reformer)]"
 faith_creation.1001.o.free_holy_site_actions: "Získáš #V [reformed_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! bezplatných akcí k vytváření, snižování či zvyšování významu, přijímání nebo opouštění [Concept('holy_sites','svatých míst')|E]"
 faith_creation.1001.o.personal: "Svět uvidí, že [ROOT.Char.GetFaith.HighGodName] stojí při nás!"
 faith_creation.1002.t: "Odtržený ritus"
 faith_creation.1002.t.new_faith: "Naše vlastní víra"
 faith_creation.1002.desc.intro.founder: "Můj [old_rite.GetAdjective] ritus se odchyloval — modlitbu po modlitbě, zásadu po zásadě — až přestal patřit k víře [old_faith.GetName]."
 faith_creation.1002.desc.intro.member: "Náš [old_rite.GetAdjective] ritus se pod vedením [founder.Custom('CZ_TitledFirstName_G')] odchyloval — modlitbu po modlitbě, zásadu po zásadě — až přestal patřit k víře [old_faith.GetName]."
 faith_creation.1002.desc.intro.observer: "[old_rite.GetAdjective] ritus, který vede [founder.GetTitledFirstName], se odchyloval — modlitbu po modlitbě, zásadu po zásadě — až přestal patřit k víře [old_faith.GetName]."
 faith_creation.1002.desc.anathema.hof: "\n\n[old_hof.GetTitledFirstName] vynáší rozsudek: zbloudilé stádo je vyobcováno, odříznuto i s kořeny."
 faith_creation.1002.desc.anathema.no_hof: "\n\n[old_faith.AltPriestTermPlural] vyznávající víru [old_faith.GetName] vynášejí rozsudek od každého oltáře: zbloudilé stádo je vyobcováno, odříznuto i s kořeny."
 faith_creation.1002.desc.new_head.personal: "Břemeno všeho, co bude následovat, spočívá na mně: dokud žiji, zastávám úřad [new_faith.ReligiousHeadName|U] a vedu víru [new_faith.GetName]."
 faith_creation.1002.desc.new_head.founder: "Toho, koho následovali do vyhnanství, následují dál — [founder.GetFirstNameNoTooltip] nyní zastává úřad [new_faith.ReligiousHeadName|U] a vede víru [new_faith.GetName]."
 faith_creation.1002.desc.new_head.other: "[new_hof.GetTitledFirstName] nyní zastává úřad [new_faith.ReligiousHeadName|U] a vede víru [new_faith.GetName]."
 faith_creation.1002.desc.new_head.none: "Novému stádu chybí jakýkoli pastýř; jeho [new_faith.AltPriestTermPlural] se zodpovídají jen sami sobě."
 faith_creation.1002.desc.outro.new_faith: "\n\nVíra podle nás, zákon podle nás — vyznání, jež teprve začíná znít světem, ale na něž již mohou [old_faith.GetAdherentNamePlural] odpovědět odsudkem i mečem."
 faith_creation.1002.desc.outro.old_faith: "\n\nVšechny země a duše vyznávající ritus [old_rite.GetName] se jediným prohlášením zříkají víry [old_faith.GetName]. Od této chvíle jsou pro nás cizí — a brzy možná i nepřátelské."
 faith_creation.1002.a: "Konečně naše vlastní víra."
 faith_creation.1002.a.founder: "Cesta byla vždy naše — a teď je naše i jméno."
 faith_creation.1002.b: "Kacíři, nyní a navždy."
 faith_creation.1002.b.hof: "Ať poznají, jaká zima je mimo stádo."
 faith_creation.1002.consequences.tt: "[new_faith.GetName] je zcela samostatná [Concept('faith','víra')|E]:\n$EFFECT_LIST_BULLET$Všechny [Concept('characters','postavy')|E] a všechna [Concept('counties','hrabství')|E] původního [Concept('rite','ritu')|E] patří k nové víře\n$EFFECT_LIST_BULLET$Mezi vírami [new_faith.GetName] a [old_faith.GetName] platí [Concept('faith_hostility','nepřátelství vír')|E], které může umožnit [Concept('holy_wars','svaté války')|E]\n$EFFECT_LIST_BULLET$Tyto [Concept('faiths','víry')|E] už nesdílejí [Concept('head_of_faith','hlavu víry')|E]"
 faith_creation.1002.a.free_holy_site_actions: "[new_faith.GetName] získává #V [new_faith.MakeScope.Var('free_holy_site_actions').GetValue|0]#! bezplatných akcí k vytváření, snižování či zvyšování významu, přijímání nebo opouštění [Concept('holy_sites','svatých míst')|E]"
 faith_creation.1002.a.lost_ecumenism: "[new_faith.GetName] ztrácí doktrínu [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]"
 faith_creation.1010.t: "[HoF.GetFirstNameNoTooltip] se stává [faith.ReligiousHeadName|U]"
 faith_creation.1010.desc.start: "O oprávněnosti naší víry nikdy nebylo pochyb, ale období bez duchovního vůdce bylo těžkou zkouškou. Ta je konečně u konce, protože"
 faith_creation.1010.desc.temporal.personal: "se mi konečně podařilo dosáhnout uznání a [faith.AltPriestTermPlural] nyní přijímají, že [faith.ReligiousHeadName|U] jsem já a nikdo jiný."
 faith_creation.1010.desc.temporal: "[faith.AltPriestTermPlural] se nakonec nechávají přesvědčit a [HoF.GetTitledFirstName] se tak stává [faith.ReligiousHeadName|U]."
 faith_creation.1010.desc.spiritual: "[faith.AltPriestTermPlural] se scházejí k volbě. [HoF.GetFirstName] je výsledkem jejich rozhodnutí a jako [faith.ReligiousHeadName|U] se stává jedinou uznávanou hlavou víry."
 faith_creation.1010.desc.end: "\n\nKonečně nastává jednota věřících pod jediným vedením a [faith.GetNameNoTooltip] tak vstupuje do nového zlatého věku."
 faith_creation.1010.desc.end.personal: "\n\nKonečně nastává jednota věřících pod mým vedením a [faith.GetNameNoTooltip] vstoupí do nového zlatého věku!"
 faith_creation.1010.a: "Ať [faith.HighGodName] sklízí slávu!"
 faith_creation.1011.message.title: "Ustanovena hlava víry"
 faith_creation.1011.message.desc: "[faith.GetAdjective] [faith.AltPriestTermPlural] oznamují, že [faith.ReligiousHeadName|U] [HoF.GetFirstName] je jejich [Concept('head_of_faith','hlavou víry')|E]"
 faith_creation.1021.t: "Ritus uvnitř stáda"
 faith_creation.1021.t.founder: "Náš vlastní ritus"
 faith_creation.1021.desc.intro.founder: "Ritus [new_rite.GetName] pevně zapustil kořeny a jeho stoupenci se obracejí ke mně. Zůstáváme [old_faith.GetAdherentNamePlural], přestože jsme se oddělili od ritu [source_rite.GetName]."
 faith_creation.1021.desc.intro.observer: "[founder.GetTitledFirstName] [Select_CString(founder.IsFemale,'založila','založil')] nový ritus uvnitř víry [old_faith.GetName]. Jeho stoupenci jej znají jako [new_rite.GetName] a [CZFaithAdjDecline(old_faith,'ou')] víru zachovává... po svém."
 faith_creation.1021.desc.divergence.minor: "\n\nS původním ritem se rozchází jen v maličkostech; [source_rite.GetAdjective] ritus mu zůstává blízký. "
 faith_creation.1021.desc.divergence.moderate: "\n\nTěm, kdo následují ritus [source_rite.GetName], připadají zvyklosti tohoto nového ritu dosti podivné. "
 faith_creation.1021.desc.divergence.major: "\n\nJeho zvyklosti a [source_rite.GetAdjectiveNoTooltip] ritus se rozcházejí natolik, že to budí podezření. "
 faith_creation.1021.desc.differing.tenet: "Nejvýraznější rozdíl představuje zásada [differing_tenet.GetBaseName]."
 faith_creation.1021.desc.differing.doctrine: "Nejvýraznější rozdíl představuje doktrína [differing_doctrine.GetDescriptiveName]."
 faith_creation.1021.desc.differing.fallback: "Rozdíl nespočívá v jediné zvyklosti."
 faith_creation.1021.desc.outro.founder.mainline: "\n\nOddělili jsme se od hlavního ritu, samotného měřítka, podle něhož [old_faith.GetNameNoTooltip] posuzuje všechny ostatní. Pokud to nazvou opovážlivostí, budiž."
 faith_creation.1021.desc.outro.founder.branch: "\n\nVždy jsme byli odnoží, větví; od nynějška jsme větví podle svých představ a vedeme se sami."
 faith_creation.1021.desc.outro.observer: "\n\nNové rity vyrůstají dost často. Tento může zakořenit, zvadnout či zahnisat v kacířství; čas ukáže."
 faith_creation.1021.a.founder: "Ať se tiše šíří mezi zbožnými."
 faith_creation.1021.b.founder: "Ať o něm slyší celé panství."
 faith_creation.1021.a: "Živá víra má místo pro mnoho ritů."
 faith_creation.1021.b: "Každé kacířství začíná jako novinka."

