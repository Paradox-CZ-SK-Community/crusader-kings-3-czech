l_polish:
 fervor.1002.t: "Skandální duchovní"
 fervor.1002.desc.start: "[sinful_theocrat.GetFaith.GetAdjectiveNoTooltip] svět byl [sinful_theocrat.Custom('GetShockedExpression')], když vyšlo najevo, že [sinful_theocrat.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 fervor.1002.desc.start_hof: "[sinful_theocrat.GetFaith.GetAdjectiveNoTooltip] svět byl zděšen, když vyšlo najevo, že [sinful_theocrat.GetTitledFirstName] [Select_CString(sinful_theocrat.IsFemale, 'sama', 'sám')]"
 fervor.1002.desc.lustful: "[Select_CString(sinful_theocrat.IsFemale, 'byla přistižena', 'byl přistižen')] „in flagrante delicto“ s několika mladými sloužícími přímo ve svém domě! Tomu, kdo je přistihl, nezbylo než odvrátit zrak, zatímco viníci spěšně popadali šaty a oblékali se."
 fervor.1002.desc.chaste: "[Select_CString(sinful_theocrat.IsFemale, 'už léta neměla', 'už léta neměl')] žádný pohlavní styk! Navzdory četným nabídkám se zdá, že [sinful_theocrat.Custom('GetCouncilOrTitleName')] nemá sebemenší zájem o tělesné vztahy s kýmkoli."
 fervor.1002.desc.gluttonous: "[Select_CString(sinful_theocrat.IsFemale, 'byla přistižena', 'byl přistižen')], jak se přejídá na přepychové hostině, kde nechybí [sinful_theocrat.Custom('GetExpensiveMeal')], [sinful_theocrat.Custom('GetExpensiveMealAlt')], [sinful_theocrat.Custom('GetExpensiveDessert')] ani [sinful_theocrat.Custom('GetExpensiveDrink')]. Taková nestřídmost vrhla temný stín na [Select_CString(sinful_theocrat.IsFemale, 'její', 'jeho')] legitimitu."
 fervor.1002.desc.temperate: "vede za zavřenými dveřmi asketický život! Údajně se vyhýbá veškerému přepychu a pohodlí a dává přednost co nejprostšímu životu."
 fervor.1002.desc.greedy: "zpronevěřuje peníze, které věřící věnovali na dobročinnost, a používá je pro vlastní potřebu!"
 fervor.1002.desc.generous: "tajně ze svého živí chudé a nuzné!"
 fervor.1002.desc.lazy: "vymýšlí si výmluvy, odkládá práci a za každou cenu se vyhýbá svým povinnostem!"
 fervor.1002.desc.diligent: "dlouho do noci pracuje na dokončení jednoho ze svých osobních projektů!"
 fervor.1002.desc.wrathful: "bije služebnictvo za to, že se nedokázalo zavděčit, a způsobuje mu těžká zranění!"
 fervor.1002.desc.calm: "nedokáže projevit žádné silné emoce a raději zachovává stoický klid a kamennou tvář, i když je takové chování očividně nevhodné!"
 fervor.1002.desc.patient: "má ve zvyku při důležitých rozhodnutích otálet a váhat, čímž zbytečně zdržuje svou práci!"
 fervor.1002.desc.impatient: "nedokáže počkat, až budou věci řádně dokončeny, a neustále popohání své pomocníky a služebnictvo!"
 fervor.1002.desc.arrogant: "se považuje za bytost od přírody nadřazenou svým vrstevníkům, neschopnou omylu a povznesenou nad jakoukoli pochybnost."
 fervor.1002.desc.humble: "trpí přehnanou pokorou a pochybnostmi o sobě, pokládá všechny kolem za schopnější a vlastní postavení za nezasloužené!"
 fervor.1002.desc.deceitful: "pravidelně lže. Terčem jsou místní [sinful_theocrat.Custom('DefaultPriestTitlePlural')]. Zřejmě je záměrně zásobuje falešnými informacemi, aby nevědomky napomáhali skrytým plánům!"
 fervor.1002.desc.honest: "naprosto neumí lhát a pokusy o pletichy či klamání působí směšně nepřesvědčivě."
 fervor.1002.desc.craven: "postrádá odvahu i rozhodnost a raději ustupuje požadavkům druhých, než se postaví za to, co je správné."
 fervor.1002.desc.brave: "bezhlavě vystavuje sebe i své pomocníky zbytečnému nebezpečí jen kvůli troše laciného vzrušení!"
 fervor.1002.desc.shy: "vymýšlí si výmluvy, vyhýbá se společenským setkáním a raději tráví čas o samotě doma!"
 fervor.1002.desc.gregarious: "úmyslně vnucuje svou přítomnost ostatním, narušuje jejich osobní prostor a mrhá jejich časem!"
 fervor.1002.desc.ambitious: "kuje pikle s cílem získat další majetek a tituly, přestože už vlastní mnoho držav."
 fervor.1002.desc.content: "nevyužívá četné příležitosti k rozšíření své osobní moci a majetku a očividně se spokojí s tím, co už má."
 fervor.1002.desc.arbitrary: "dělá výjimky z důležitých postupů ve prospěch svých oblíbenců a na úkor ostatních."
 fervor.1002.desc.just: "se drží neuvěřitelně přísného a neústupného kodexu cti a odmítá se od něj odchýlit bez ohledu na jakékoli polehčující okolnosti!"
 fervor.1002.desc.cynical: "ve skutečnosti nevěří v [sinful_theocrat.GetFaith.GetName] a považuje je jen za vhodný politický nástroj. "
 fervor.1002.desc.zealous: "neochvějně věří v nadpřirozený a duchovní svět navzdory tomu, že pro nic takového neexistují žádné rozumné důkazy."
 fervor.1002.desc.paranoid: "propadá krajní paranoie a nedůvěře a neustále má za to, že všichni kolem kují pikle proti [Select_CString(sinful_theocrat.IsFemale, 'ní', 'němu')]!"
 fervor.1002.desc.trusting: "projevuje neuvěřitelnou naivitu a důvěřivost a bez otázek přijímá i ty nejzjevnější lži od svých pomocníků."
 fervor.1002.desc.compassionate: "projevuje přehnaný soucit a uděluje milost i tam, kde pro ni není důvod, jen proto, že nedokáže snést pohled na lidské utrpení."
 fervor.1002.desc.callous: "projevuje neuvěřitelnou bezcitnost a nedokáže či nechce soucítit ani s lidmi v zoufalé situaci."
 fervor.1002.desc.sadistic: "[Select_CString(sinful_theocrat.IsFemale, 'byla přistižena', 'byl přistižen')] při mučení v tajné komoře pod svými pokoji. Obětí je [sinful_theocrat.Custom('GirlBoy')] ze služebnictva a zjevně si vychutnává [sinful_theocrat.Custom('GirlBoyPossessive')] zoufalé výkřiky!"
 fervor.1002.desc.stubborn: "odhazuje zprávy svých pomocníků, aniž je vůbec čte, a odmítá zohlednit jakékoli nové informace týkající se svých již učiněných rozhodnutí."
 fervor.1002.desc.fickle: "nedokáže si stát za svým, když přituhne, a při prvním náznaku odporu proti svým rozhodnutím ustoupí."
 fervor.1002.desc.vengeful: "vede si seznam všech, kdo se na [Select_CString(sinful_theocrat.IsFemale, 'ní', 'něm')] kdy provinili, a podrobně v něm rozepisuje, jak se jim hodlá pomstít a ukojit svou touhu po odplatě!"
 fervor.1002.desc.forgiving: "pravidelně nedokáže náležitě potrestat ty, kdo neplní své povinnosti, a raději jim dává druhou či dokonce třetí šanci, než je potrestá!"
 fervor.1002.desc.fallback: "projevuje neuvěřitelnou bezbožnost a nesplňuje ani základní standardy, které má [sinful_theocrat.Custom('GetCouncilOrTitleName')] dodržovat."
 fervor.1002.desc.end: "\n\nAčkoli [sinful_theocrat.GetFaith.AltPriestTermPlural] provázejí skandály odjakživa, je znepokojivé, že k jednomu došlo tak blízko domova..."
 fervor.1002.desc.end_hof: "\n\nAčkoli [sinful_theocrat.GetFaith.AltPriestTermPlural] provázejí skandály odjakživa, mnozí jsou zděšeni, že hlava naší víry podlehla takovým pokušením."
 fervor.1002.b: "Odsoudit [Select_CString(sinful_theocrat.IsFemale, 'ji', 'ho')] za všechny ty prohřešky!"
 fervor.1002.c: "Veřejně hájit [Select_CString(sinful_theocrat.IsFemale, 'její', 'jeho')] dobré jméno, i kdyby mě to mělo ohrozit!"
 fervor.1002.d: "Možná bude lepší o tom prostě mlčet..."
 fervor.2002.t: "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip] povznesení"
 fervor.2002.desc.lustful: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'se stala vzorem', 'se stal vzorem')] pro nespočet ctnostných [virtuous_theocrat.GetWomenMen] a předmětem touhy mnoha dalších mladých [virtuous_theocrat.GetFaith.GetAdherentNamePlural].\n\nPříběhy o milostných výbojích této osobnosti se rozšířily široko daleko a mnozí v [Select_CString(virtuous_theocrat.IsFemale, 'ní', 'něm')] spatřují ztělesnění nekonečné lásky [ROOT.Char.GetFaith.FertilityGodNamePossessive]."
 fervor.2002.desc.chaste: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'si získala', 'si získal')] bezchybnou pověst naprostým odmítáním jakéhokoli tělesného potěšení.\n\nTato neochvějná kázeň se stala vzorem pro mnoho mladých [virtuous_theocrat.GetFaith.GetAdherentNamePlural], kteří se snaží odolat ponižujícímu vábení chlípnosti."
 fervor.2002.desc.gluttonous: "Mnozí vyprávějí podivuhodné příběhy o přepychových hostinách, které pořádá [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName]. Jako [virtuous_theocrat.GetWomanMan] vytříbeného vkusu [Select_CString(virtuous_theocrat.IsFemale, 'skutečně přijala', 'skutečně přijal')] epikurejskou ctnost, o niž by měl usilovat každý dobrý stoupenec [ROOT.Char.GetFaith.WealthGodName]."
 fervor.2002.desc.temperate: "Jako vzor neochvějné askeze ukazuje [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName], že ukázněná duše může nalézt skutečný klid a jasnost pouze prostřednictvím rozjímání a odříkání.\n\nNavzdory svému vznešenému postavení se [virtuous_theocrat.GetFirstNameNoTooltip] živí jen těmi nejskromnějšími pokrmy, aby [Select_CString(virtuous_theocrat.IsFemale, 'prokázala svou', 'prokázal svou')] neochvějnou oddanost [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip] nauce."
 fervor.2002.desc.greedy: "Jen málo [virtuous_theocrat.GetFaith.HouseOfWorshipPlural] se může nádherou a velkolepostí měřit s [scoped_primary_title.GetName]. \n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'učinila svým životním posláním', 'učinil svým životním posláním')] dokazovat svou trvalou oddanost tím, že věnuje nekonečný proud zlata a bohatství ke slávě [ROOT.Char.GetFaith.WealthGodName]."
 fervor.2002.desc.generous: "Chudí a potřební jsou vždy vítáni v [virtuous_theocrat.GetFaith.HouseOfWorship], kde působí [virtuous_theocrat.GetFirstName]. \n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] působící v [scoped_primary_title.GetNameNoTier] [Select_CString(virtuous_theocrat.IsFemale, 'se proslavila', 'se proslavil')] svou štědrostí a mnoha dobročinnými skutky. Tento příklad přiměl mnoho [virtuous_theocrat.GetFaith.GetAdherentNamePlural], aby se vzdali svého pozemského majetku ve snaze získat božskou odměnu."
 fervor.2002.desc.generous.pope: "Chudí a potřební jsou vždy vítáni v [virtuous_theocrat.GetFaith.HouseOfWorship], kde působí [virtuous_theocrat.GetFirstName]. \n\nNa [virtuous_theocrat.Custom('GetCouncilOrTitleName')] působící v [scoped_primary_title.GetNameNoTier] se bude dlouho vzpomínat pro [Select_CString(virtuous_theocrat.IsFemale, 'její', 'jeho')] štědrost a mnohé dobročinné skutky. Tento příklad přiměl mnoho [virtuous_theocrat.GetFaith.GetAdherentNamePlural], aby se vzdali svého pozemského majetku ve snaze získat božskou odměnu."
 fervor.2002.desc.lazy: "Jen naprostým odpoutáním od přízemních záležitostí tohoto světa může duše nalézt své právoplatné místo v příštím životě. A jen málokdo ztělesňuje tuto ctnost tak dokonale jako [virtuous_theocrat.Custom('GetCouncilOrTitleName')] působící v [scoped_primary_title.GetNameNoTier]. \n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] tráví většinu dní poklidným rozjímáním, straní se nesmyslných politických her i ponižující námahy tělesné práce a usiluje o stav božského pokoje."
 fervor.2002.desc.diligent: "Neúnavná práce, kterou [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] vykonává ve službách [ROOT.Char.GetFaith.HighGodName], inspirovala mnoho příběhů. \n\nNavzdory svému vznešenému postavení je [virtuous_theocrat.GetFirstNameNoTooltip] vždy [Select_CString(virtuous_theocrat.IsFemale, 'připravena', 'připraven')] přiložit ruku k dílu a ujmout se i těch nejnáročnějších a nejnamáhavějších úkolů, čímž představuje skutečný příklad [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ctnosti."
 fervor.2002.desc.wrathful: "Jako vášnivý [virtuous_theocrat.GetWomanMan] se [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'proslavila', 'proslavil')] v blízkých i vzdálených městech svou prchlivostí a násilnickou povahou.\n\nJedině rychlým a otevřeným trestáním rouhání lze očistit hřích a [virtuous_theocrat.GetFirstNameNoTooltip] svými častými výbuchy nepochybně [Select_CString(virtuous_theocrat.IsFemale, 'nahnala', 'nahnal')] nespočtu věřících strach z [ROOT.Char.GetFaith.WarGodName]."
 fervor.2002.desc.wrathful.pope: "Jako vášnivý [virtuous_theocrat.GetWomanMan] se [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'stala nechvalně proslulou', 'stal nechvalně proslulým')] svou prchlivostí a násilnickou povahou.\n\nJedině rychlým a otevřeným trestáním rouhání lze očistit hřích a [virtuous_theocrat.GetFirstNameNoTooltip] svými častými výbuchy bezpochyby [Select_CString(virtuous_theocrat.IsFemale, 'nahnala', 'nahnal')] nespočtu věřících strach z [ROOT.Char.GetFaith.WarGodName]."
 fervor.2002.desc.calm: "Mnozí začali v [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] spatřovat ztělesnění božského pokoje, jehož během života dosáhne jen málokdo.\n\nJako nesmírně ukázněný [virtuous_theocrat.GetWomanMan] je [virtuous_theocrat.GetFirstNameNoTooltip] zářným příkladem vítězství rozumu nad vášní."
 fervor.2002.desc.impatient: "Lidem byl na tomto světě vyměřen jen krátký čas a [ROOT.Char.GetFaith.HighGodName] si přeje, abychom z něj nepromarnili ani jedinou vteřinu.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] si tuto zásadu [Select_CString(virtuous_theocrat.IsFemale, 'vzala', 'vzal')] k srdci natolik, že se široko daleko [Select_CString(virtuous_theocrat.IsFemale, 'proslavila', 'proslavil')] nesnášenlivostí vůči lenosti a zbytečné práci."
 fervor.2002.desc.impatient.pope: "Lidem byl na tomto světě vyměřen jen krátký čas a [ROOT.Char.GetFaith.HighGodName] si přeje, abychom z něj nepromarnili ani jedinou vteřinu.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] si tuto zásadu [Select_CString(virtuous_theocrat.IsFemale, 'vzala', 'vzal')] k srdci natolik, že se na [Select_CString(virtuous_theocrat.IsFemale, 'ni', 'něj')] bude dlouho vzpomínat pro nesnášenlivost vůči lenosti a zbytečné práci."
 fervor.2002.desc.arrogant: "Urazit vyslance [ROOT.Char.GetFaith.HighGodName] se nijak neliší od rouhání přímo před samotným božstvem.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] to dobře ví a během svého působení v [scoped_primary_title.GetName] nikdy neprojevuje mnoho shovívavosti vůči cynikům a hlupákům."
 fervor.2002.desc.humble: "Všechna lidská díla blednou vedle velkoleposti [ROOT.Char.GetFaith.HighGodNamePossessive].\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] to chápe lépe než mnozí jiní duchovní a o [Select_CString(virtuous_theocrat.IsFemale, 'její mírné a pokorné povaze', 'jeho mírné a pokorné povaze')] koluje mnoho příběhů. [virtuous_theocrat.GetFirstNameNoTooltip] se zříká pohodlného života, na nějž by měl [Select_CString(virtuous_theocrat.IsFemale, 'její', 'jeho')] úřad nárok, a často bývá [Select_CString(virtuous_theocrat.IsFemale, 'vídána', 'vídán')], jak bosky kráčí mezi nejchudšími členy svého stáda."
 fervor.2002.desc.deceitful: "Rozum je největším darem [ROOT.Char.GetFaith.KnowledgeGodName] lidstvu a právě ten nás odlišuje od zvířat.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] je zářným příkladem této pravdy. Díky bystrému důvtipu a výřečnosti [Select_CString(virtuous_theocrat.IsFemale, 'přelstila a zesměšnila', 'přelstil a zesměšnil')] nespočet cyniků, rouhačů a podle některých dokonce i démonů."
 fervor.2002.desc.honest: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] se díky své upřímnosti [Select_CString(virtuous_theocrat.IsFemale, 'stala známou a velmi váženou osobností', 'stal známou a velmi váženou osobností')] mezi mnoha [virtuous_theocrat.GetFaith.GetAdherentNamePlural].\n\nPro tohoto zbožného [virtuous_theocrat.GetWomanMan] není žádná lež příliš malá ani žádná pravda příliš nepříjemná a tento příklad každý den inspiruje nespočet dalších věřících."
 fervor.2002.desc.honest.pope: "Na [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] bude většina [virtuous_theocrat.GetFaith.GetAdherentNamePlural] dlouho vzpomínat pro [Select_CString(virtuous_theocrat.IsFemale, 'její', 'jeho')] upřímnost.\n\nPro tohoto zbožného [virtuous_theocrat.GetWomanMan] není žádná lež příliš malá ani žádná pravda příliš nepříjemná a tento příklad každý den inspiruje nespočet dalších věřících."
 fervor.2002.desc.craven: "Život je nesmírně cenný dar a [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'přiměla', 'přiměl')] mnoho svých následovníků, aby přijali ctnost opatrnosti a prozíravosti, vyhýbali se zbytečným rizikům a dožili se dlouhého života ve službě [ROOT.Char.GetFaith.HighGodNamePossessive].\n\n[virtuous_theocrat.GetFaith.HouseOfWorship] téměř neopouští a říká se, že toto místo je bezpečnější než kterákoli pokladnice a nedobytnější než kterákoli pevnost."
 fervor.2002.desc.brave: "Do [virtuous_theocrat.GetFaith.HouseOfWorship], kde působí [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive], každodenně putuje mnoho začínajících kazatelů, aby u tohoto váženého duchovního hledali vedení.\n\n[virtuous_theocrat.GetFirstNamePossessiveNoTooltip] neochvějné odhodlání a nebojácnost jsou proslulé široko daleko. Ať už jde o lov divoké šelmy, nebo střet s kacíři a rouhači, [virtuous_theocrat.GetFirstNameNoTooltip] je vždy [Select_CString(virtuous_theocrat.IsFemale, 'připravena a odhodlána', 'připraven a odhodlán')] vrhnout se nepřátelům přímo vstříc."
 fervor.2002.desc.shy: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'se stala zářným příkladem', 'se stal zářným příkladem')] toho, jak zásadní je odloučení od společnosti pro očištění duše.\n\nTento uctívaný duchovní se straní strastí běžného společenského života a [Select_CString(virtuous_theocrat.IsFemale, 'dosáhla', 'dosáhl')] takového spojení s božstvím, o jakém si většina [virtuous_theocrat.GetFaith.GetAdherentNamePlural] může nechat jen zdát."
 fervor.2002.desc.gregarious: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'se stala oporou', 'se stal oporou')] své komunity.\n\nVždy ochotně naslouchá svému stádu a věnuje se mu, čímž ztělesňuje ducha pospolitosti, o němž kolegové často káží, ale málokdy se jím sami řídí."
 fervor.2002.desc.gregarious.pope: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] pravidelně projevuje takovou míru zájmu o společenství, jakou by chtěli napodobit všichni [virtuous_theocrat.GetFaith.GetAdherentNamePlural].\n\nVždy ochotně naslouchá svému stádu, čímž ztělesňuje ducha pospolitosti, o němž kolegové často káží, ale málokdy se jím sami řídí."
 fervor.2002.desc.ambitious: "Jen málokdo usiluje s větším zápalem a odhodláním o přízeň, kterou uděluje [ROOT.Char.GetFaith.HighGodName], než [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName].\n\nTato neúnavná honba za slávou se stala inspirací pro nespočet mladých [virtuous_theocrat.GetFaith.GetAdherentNamePlural] z blízkého i dalekého okolí."
 fervor.2002.desc.content: "Podle mnohých [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'skutečně přijala', 'skutečně přijal')] za své odpoutání od světských záležitostí, které je ústřední součástí [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] nauky.\n\nTento [virtuous_theocrat.GetWomanMan] nejeví žádný zájem o věhlas ani slávu a spokojí se s životem zasvěceným službě, kterou žádá [ROOT.Char.GetFaith.HighGodName]."
 fervor.2002.desc.arbitrary: "Každý rozumný učenec ví, že božská vůle je nevyzpytatelná a věčně proměnlivá, ale jen málokdo její povahu ztělesňuje tak dokonale jako [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName]. \n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] působící v [scoped_primary_title.GetNameNoTier] [Select_CString(virtuous_theocrat.IsFemale, 'si získala', 'si získal')] pověst díky rychlým a záhadným soudům, až mnozí začali věřit, že za tímto nadáním stojí [ROOT.Char.GetFaith.HighGodName]."
 fervor.2002.desc.just: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstNamePossessive] pevná a neposkvrněná pověst [Select_CString(virtuous_theocrat.IsFemale, 'jí získala', 'mu získala')] úctu mnohých.\n\nČasto bývá [Select_CString(virtuous_theocrat.IsFemale, 'povolávána', 'povoláván')] k rozhodování sporů a mnozí v [Select_CString(virtuous_theocrat.IsFemale, 'ní', 'něm')] spatřují ztělesnění ducha božské spravedlnosti, který je tak zásadní součástí [virtuous_theocrat.GetFaith.GetAdjectiveNoTooltip] nauky."
 fervor.2002.desc.cynical: "Během let studia a kázání si [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'vybudovala', 'vybudoval')] skvělou pověst kritického myslitele.\n\n[ROOT.Char.GetFaith.HighGodName] naplnil svět tajemstvími a skutečného osvícení mohou věřící dosáhnout jedině neustálým kladením otázek a rozumným přístupem."
 fervor.2002.desc.zealous: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] je v očích mnohých hrází, která chrání víru před zkažeností a kacířstvím.\n\nS neochvějnou oddaností bojuje dnem i nocí, aby všichni členové stáda do písmene dodržovali [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] nauku."
 fervor.2002.desc.zealous.pope: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] je v očích mnohých hrází, která chrání víru před zkažeností a kacířstvím.\n\nS neochvějnou oddaností bojuje dnem i nocí, aby [virtuous_theocrat.GetFaith.GetName] zůstalo neporušené a duchovenstvo se do písmene řídilo dogmatickými pravdami obsaženými v [virtuous_theocrat.GetFaith.ReligiousText]."
 fervor.2002.desc.paranoid: "Když se kacíři a rouhači skrývají za každým rohem, [ROOT.Char.GetFaith.HighGodName] očekává od každého zbožného následovníka především bystrou a zvídavou mysl.\n\n[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'inspirovala', 'inspiroval')] nespočet kazatelů svými pojednáními o odhalování kacířství, a pomáhá tak zachovat neposkvrněnost naší víry."
 fervor.2002.desc.trusting: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] v posledních letech usilovně šíří zjevenou pravdu, že všichni [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] lidé jsou čestní a upřímní.\n\nJedině bezvýhradnou důvěrou ve slovo bližního lze na oplátku podpořit jeho poctivost."
 fervor.2002.desc.compassionate: "Jako skutečně požehnaná duše se [virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'stala pravým příkladem', 'stal pravým příkladem')] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] laskavosti, vede své stádo mírnou rukou a je vždy [Select_CString(virtuous_theocrat.IsFemale, 'připravena', 'připraven')] naslouchat méně šťastným duším, které přicházejí pro radu, a pomoci jim."
 fervor.2002.desc.callous: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] opakovaně ukazuje mnoha svým druhům a následovníkům, jak důležité je pro zbožného [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] člověka zachovávat odstup od pokušení i bolesti.\n\nVášně vyvolané hmotným světem jsou pomíjivé a bezvýznamné ve srovnání se slávou nebes."
 fervor.2002.desc.sadistic: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'se stala stejnou měrou respektovanou i obávanou', 'se stal stejnou měrou respektovaným i obávaným')] svým stádem. Bez jakéhokoli slitování tráví své dny trestáním hříšníků, kdekoli je nalezne, a prostřednictvím vrcholného utrpení tak očišťuje jejich duše."
 fervor.2002.desc.sadistic.pope: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'se stala stejnou měrou respektovanou i obávanou', 'se stal stejnou měrou respektovaným i obávaným')] mezi věřícími. Bez jakéhokoli slitování tráví své dny trestáním hříšníků, kdekoli je nalezne, a prostřednictvím vrcholného utrpení tak očišťuje jejich duše."
 fervor.2002.desc.forgiving: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] [Select_CString(virtuous_theocrat.IsFemale, 'se stala symbolem', 'se stal symbolem')] [ROOT.Char.GetFaith.HighGodNamePossessive] nekonečného odpuštění.\n\n[virtuous_theocrat.GetFirstNameNoTooltip] je vždy [Select_CString(virtuous_theocrat.IsFemale, 'připravena', 'připraven')] podat pomocnou ruku a přistupovat s otevřenou myslí k těm, kdo jsou v nouzi, a významně tak přispívá k zachování [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] zásady, že nikdo není nikdy skutečně nevinný, a proto nikdo nesmí soudit druhé. To smí jedině [ROOT.Char.GetFaith.HighGodName]."
 fervor.2002.desc.fallback: "[virtuous_theocrat.Custom('GetCouncilOrTitleName')] [virtuous_theocrat.GetFirstName] je mnohými [Select_CString(virtuous_theocrat.IsFemale, 'považována', 'považován')] za vzor [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ctnosti.\n\nBezúhonné chování a neúnavná práce učence a kazatele v posledních několika letech výrazně pomohly znovu oživit víru."
 fervor.2001.a.a: "To je nám všem příkladem!"
 fervor.2001.a.b: "Jak chvályhodné."
 fervor.2001.a.c: "Ale dělá to pro slávu, nebo proto, že si to přeje [ROOT.Char.GetFaith.HighGodName]?"
