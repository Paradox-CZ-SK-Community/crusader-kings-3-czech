l_polish:
 head_of_faith.0000.new_faith_submitted_for_hook: "[ROOT.Char.GetTitledFirstName] se [Select_CString(ROOT.Char.IsFemale,'podřídila','podřídil')] autoritě tvého úřadu [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 head_of_faith.0000.wishes_to_schism_caliphate_flag_added: "Po zbytek života pro tebe bude snazší opustit zvolený úřad [GetPlayer.GetFaith.ReligiousHeadTitleName]"
 head_of_faith.0000.t: "Dědicové Proroka"
 head_of_faith.0000.desc: "a všichni pravověrní ode mě jako od nejvyšší autority této víry očekávají, že se zavážu k poslušnosti některému ze stávajících chalífů.\n\nVlastní autoritu mohu čerpat jedině z podřízení se nejvyšší pozemské autoritě, nad níž stojí už jen [ROOT.Char.GetFaith.HighGodName], bez ohledu na ostatní teologické rozdíly mezi námi.\n\nHlavní otázkou je samozřejmě, #EMP komu#! složím slib věrnosti, a ti nejchytřejší z nás se ptají také, #EMP jak upřímně#!..."
 head_of_faith.0100.t: "Autorita úřadu [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 head_of_faith.0100.desc: "Dnes se náš ritus [ROOT.Char.GetRite.GetName] oddělil od víry [ROOT.Char.GetFaith.GetName]; rozkol byl formálně uznán. Tam, kde jsme kdysi modlitbou splývali s ritem [hof.GetRite.GetName], se nyní rozcházíme v samotné podobě své oddanosti.\n\nPřesto [hof.GetTitledFirstName] dál stojí v čele všech, nad nimiž bdí [ROOT.Char.GetFaith.HighGodName]. Máme sklonit hlavy a stále dbát [hof.Custom('CZ_TitledFirstName_G')] vedení, nebo jsou už rozdíly v našem přesvědčení příliš velké?"
 head_of_faith.0100.a: "Naše víra nás spojuje: podřizujeme se autoritě [hof.Custom('CZ_TitleAsNameNoTooltip_G')] [hof.Custom('CZ_FirstNameNoTooltipRegnal_G')]!"
 head_of_faith.0100.b: "Budeme dbát [Select_CString(hof.IsFemale,'její','jeho')] vůle... #EMP prozatím#!."
 head_of_faith.0001.t: "$head_of_faith.0000.t$: Sunnité"
 head_of_faith.0001.desc: "Jako [ROOT.Char.GetFaith.GetAdherentName] jsem se [Select_CString(ROOT.Char.IsFemale, 'rozhodla', 'rozhodl')] následovat cestu dědiců Abú Bakra, $head_of_faith.0000.desc$"
 head_of_faith.0001.a: "Návrat k sunnitské ortodoxii je naší jedinou možností."
 head_of_faith.0001.b: "Musíme i nadále uznávat [old_caliph.GetFaith.GetAdjectiveNoTooltip] autoritu!"
 head_of_faith.0001.c: "Naši #EMP současnou#! věrnost má [sunni_caliph.GetTitledFirstNameNoTooltip]..."
 head_of_faith.0001.d: "Naším vůdcem zůstane [old_caliph.GetTitledFirstNameNoTooltip]... prozatím..."
 head_of_faith.0001.e: "Já #EMP zastávám#! úřad [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 head_of_faith.0011.t: "$head_of_faith.0000.t$: Šíité"
 head_of_faith.0011.desc: "[ROOT.Char.GetFaith.GetName] následuje neomylnou nástupnickou linii Alího, $head_of_faith.0000.desc$"
 head_of_faith.0011.a: "Volá nás hlavní proud šíitského učení."
 head_of_faith.0011.b: "$head_of_faith.0001.b$"
 head_of_faith.0011.c: "Rozkazy nám udílí [shia_caliph.GetTitledFirstNameNoTooltip]. Prozatím."
 head_of_faith.0011.d: "$head_of_faith.0001.d$"
 head_of_faith.0021.t: "$head_of_faith.0000.t$: Muhakkima"
 head_of_faith.0021.desc: "Odmítáme nízké politické půtky sunnitů a šíitů a [ROOT.Char.GetFaith.GetName] se tak řadí ke směru Muhakkima v islámu. Řadoví členové tohoto hnutí ode mě neočekávají, že se zavážu k poslušnosti některému ze stávajících chalífů, ale mohli by takové rozhodnutí přijmout, pokud jasně vyjádřím svou věrnost."
 head_of_faith.0021.a: "Můžeme si volit vlastní vůdce."
 head_of_faith.0021.b: "$head_of_faith.0001.b$"
 head_of_faith.0031.t: "$head_of_faith.0000.t$: Zandaq"
 head_of_faith.0031.desc: "Jako vyznavače směru Zandaq nás příliš nezajímá, jak ostatní islámské sekty odvozují nástupnictví po Prorokovi, a ony nás na oplátku nemají v lásce. [ROOT.Char.GetFaith.GetAdherentNamePlural] ode mě rozhodně neočekávají, že vyhlásím naši podřízenost některému ze stávajících chalífů.\n\nMožná bychom si však přísahou věrnosti jedné z velmocí islámu mohli pro svou víru koupit alespoň trochu bezpečí a tolerance..."
 head_of_faith.0031.a: "$head_of_faith.0021.a$"
 head_of_faith.0031.b: "$head_of_faith.0001.a$"
 head_of_faith.0031.c: "$head_of_faith.0011.a$"
 head_of_faith.0031.d: "$head_of_faith.0001.b$"
 head_of_faith.0031.rejection_body: "odmítá slib věrnosti"
 head_of_faith.0031.acceptance_body: "přijímá slib věrnosti"
 head_of_faith.0031.rejection.outcome: "Nakonec ti stejně nezbývá než vydat se vlastní cestou"
 head_of_faith.0031.b.rejection: "@piety_level_0_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.b.acceptance: "@piety_level_3_icon_islam! [sunni_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0031.c.rejection: "@piety_level_0_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.c.acceptance: "@piety_level_3_icon_islam! [shia_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0031.d.rejection: "@piety_level_0_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.rejection_body$"
 head_of_faith.0031.d.acceptance: "@piety_level_3_icon_islam! [old_caliph.GetTitledFirstNameNoTooltip] $head_of_faith.0031.acceptance_body$"
 head_of_faith.0032.t: "Slib věrnosti"
 head_of_faith.0032.desc: "Nechť [pledge_target.GetTitledFirstNameNoTooltip] vyslechne naši prosbu. My, [pledgeing_individual.GetFaith.GetAdherentNamePlural], ti chceme přísahat věrnost a přijmout tě za svou [Concept('head_of_faith','hlavu víry')|E].\n\nPřijmeš nás pod své vedení?"
 head_of_faith.0032.a: "@piety_level_3_icon_islam! Samozřejmě, odmítnout vás přece nemohu!"
 head_of_faith.0032.b: "@piety_level_0_icon_islam! Pryč s vámi, odporní žebráci!"
 head_of_faith.0032.notif.a: "[pledge_target.GetTitledFirstNameNoTooltip] přijímá tvůj slib věrnosti!"
 head_of_faith.0032.notif.b: "[pledge_target.GetTitledFirstNameNoTooltip] odmítá tvůj slib věrnosti!"
