l_polish:
 heresy.0010.t: "Kacířství: [heretic_faith.GetAdherentNamePluralNoTooltip] v [heretic_title.GetNameNoTierNoTooltip]"
 heresy.0010.desc: "[heretic_ruler.GetTitledFirstName] z [heretic_title.GetNameNoTier] [Select_CString(heretic_ruler.IsFemale, 'oznámila', 'oznámil')] světu, že společně se svými vazaly [Select_CString(heretic_ruler.IsFemale, 'změnila', 'změnil')] víru. Jejich novým vyznáním je [heretic_faith.GetName]."
 heresy.0010.desc.nonexistant: "\n\nŠlechta z [heretic_title.GetNameNoTierNoTooltip] ztratila důvěru v učení, které hlásají [origin_faith.GetAdjective] [origin_faith.PriestMalePlural], a už nepovažuje [origin_faith.AltPriestTermPlural] za spravedlivé a pravověrné. Jako [heretic_faith.GetAdherentNamePluralNoTooltip] věří, že jejich nová víra lépe odpovídá tomu, co si přeje [heretic_faith.HighGodName], a odvracejí se od svých někdejších náboženských institucí."
 heresy.0010.desc.exists: "\n\nŠlechta z [heretic_title.GetNameNoTierNoTooltip] ztratila důvěru v učení, které hlásají [origin_faith.GetAdjective] [origin_faith.PriestMalePlural], už nepovažuje [origin_faith.AltPriestTermPlural] za spravedlivé a pravověrné a odvrací se od svých někdejších náboženských institucí. Místo toho se hlásí k [heretic_faith.GetAdherentNamePluralNoTooltip], jejichž učení podle nich lépe odpovídá [heretic_faith.HighGodNamePossessive] vůli."
 heresy.0010.desc.resurgent: "\n\nŠlechta z [heretic_title.GetNameNoTierNoTooltip] ztratila důvěru v učení, které hlásají [origin_faith.GetAdjective] [origin_faith.PriestMalePlural], a už nepovažuje [origin_faith.AltPriestTermPlural] za spravedlivé a pravověrné. Proto šlechtici z [heretic_title.GetNameNoTierNoTooltip] obnovili opuštěné učení [heretic_faith.GetAdherentNamePluralNoTooltip], které podle nich lépe odpovídá [heretic_faith.HighGodNamePossessive] vůli."
 heresy.0010.tt.custom: "[heretic_faith.GetName|V] se objevuje v [heretic_title.GetName]"
 heresy.0010.a.new_heresy: "Co je to za zvrácenou parodii na naši víru!?"
 heresy.0010.a.existing_heresy: "Ti odporní kacíři je svedli z pravé cesty!"
 heresy.0010.a.astray_faith: "Nechápu to, ale asi jsou tak šťastní?"
 heresy.0010.a.same_faith: "Věděl jsem, že nakonec prohlédnou!"
 heresy.0010.b: "Když nad tím tak přemýšlím, něco na tom je..."
 heresy.0010.notification.title: "Nové náboženské hnutí"
 heresy.0010.notification: "[heretic_ruler.GetFullName] [Select_CString(heretic_ruler.IsFemale, 'založila', 'založil')] nové [heretic_faith.GetAdjective] hnutí!"
 heresy.0011.notification.heresy: "[convert_ruler.Custom2('HierarchicalStatus', me)] přijímá kacířství: [convert_ruler.GetShortUINameNoTooltip]"
 heresy.0011.notification.same_faith: "[convert_ruler.Custom2('HierarchicalStatus', me)] přijímá pravou víru: [convert_ruler.GetShortUINameNoTooltip]"
 heresy.0011.notification.other: "[convert_ruler.Custom2('HierarchicalStatus', me)] mění víru: [convert_ruler.GetShortUINameNoTooltip]"
