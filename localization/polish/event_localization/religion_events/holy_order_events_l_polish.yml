 monastic_order_entering_interaction_range_tt: "@alert_icon! #alert_trial [monastic_order.GetName] vstoupí do [holy_order_vicinity|E], čímž zpřístupní své [interactions|E]#!" # todo: NEW TRANSLATION
 holy_order.2050.t: "V [barony.GetNameNoTierNoTooltip] sílí hnutí" # todo: NEW TRANSLATION
 holy_order.2050.desc: ""„Stále [target_order.GetName] trpí... jako poustevníci na poušti?“ — tak začínají všechna ohnivá psaní [clerical_helper.GetNamePossessive].\n\n„Odívá se [target_lessee.GetTitledFirstName] do zlata?“ — ptají se reformátoři ve svých kázáních v [barony.GetNameNoTier] a uzavírají je slovy: #EMP „Nový způsob! Nová řehole!“#!\n\nKlášter se rychle stává semeništěm zbožných reforem a nesouhlasu. Jeho obyvatelé už sotva jsou [target_lessee.GetPrimaryTitle.GetAdjectiveNoTooltip] a sotva se spokojí s omšelými řečmi o [target_order_tenet.GetName( founder.GetRite )]. Jejich reformní zápal je však stále třeba nasměrovat k jediné nové zásadě a jediné mysli." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [target_lessee.GetHerselfHimself]; nepárny počet úvodzoviek
