 holy_order.2040.desc: "Je hotovo. Pobočka řádu [recipient.GetPrimaryTitle.GetNameNoTier] bude přiléhat k [actor.GetFaith.HouseOfWorship] v [target.GetNameNoTier] a tam, v srdci [target.GetDeJureLiegeOfTier( 'duchy' ).GetNameNoTier], uložíme starobylé texty z knihoven v [recipient.GetCapitalLocation.GetName].\n\n" # todo: NEW TRANSLATION
