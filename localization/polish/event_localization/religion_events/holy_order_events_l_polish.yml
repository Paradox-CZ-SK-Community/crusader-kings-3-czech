 holy_order.2040.desc_monks: "A tam budou naši [recipient.GetFaith.DevoteeMalePlural] zpívat modlitby k [actor.GetFaith.HighGodName] za vás." # todo: NEW TRANSLATION
 holy_order.2040.desc_huge_donation: "Takto vám řád projevuje vděčnost za vaši zbožnou štědrost." # todo: NEW TRANSLATION
 holy_order.2040.desc_rite: "\n\nVězte, že pobočka bude dodržovat obřady [recipient.GetRite.GetName], stejně jako každý dům našeho řádu." # todo: NEW TRANSLATION
 holy_order.2040.a: "Ať váš řád vzkvétá!" # todo: NEW TRANSLATION
