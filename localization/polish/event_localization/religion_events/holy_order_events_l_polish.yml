 holy_order.2041.opening: "[actor.GetFirstName] z [actor.GetPrimaryTitle.GetNameNoTier]," # todo: NEW TRANSLATION
 holy_order.2041.desc: "My, nejčistší oddaní [recipient.GetFaith.HighGodNamePossessive], kteří přinášíme na tuto ubohou Zemi naprostou svatost [recipient.GetFaith.PositiveAfterLife]... se obáváme, že nad říší [actor.GetPrimaryTitle.GetNameNoTier] leží kletba, kterou nedokážou zaplašit ani naše modlitby.\n\nDuše vaší říše je tak žalostně odtržena od [recipient.GetFaith.HighGodName], že [recipient.GetPrimaryTitle.GetName] nemůže přijít do [target.GetNameNoTier]." # todo: NEW TRANSLATION
 holy_order.2041.a: "Jejich „čistota“ — nesmysl!" # todo: NEW TRANSLATION
