l_polish:
 holy_order_hired_message: "Svatý řád najat"
 holy_order.hired_message: "[holy_order.GetName] byl povolán do boje postavou [actor.GetUIName]"
 holy_order_hired_by_enemy_message: "Nepřátelský svatý řád"
 holy_order.hired_by_enemy: "[holy_order.GetName] byl povolán postavou [actor.GetUIName] a nyní stojí proti nám"
 holy_order.destroyed_message: "[title.GetName] byl zničen"
 holy_order_expanded: "Svatý řád se rozrůstá"
 holy_order.new_lease: "[holy_order.GetName] si nyní pronajímá [barony.GetName] od [former_holder.GetTitledFirstName]"
 monastic_holy_order_expanded: "Řeholní řád se rozrůstá" # todo: NEW TRANSLATION
 holy_order.0001.t: "Svatý řád"
 holy_order.0001.desc_opening: "[recipient.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] stojí venku a čeká na mě, zavazadla i doprovod jsou připravené k odjezdu.\n\n"
 holy_order.0001.desc_demand: ""Předpokládám, že na tom něco čestného je..." [recipient.GetSheHe] zabručí, "umřít při dobývání nějaké cizí pohanské země. Myslel jsem, že padnu v boji za [actor.GetPrimaryTitle.GetNameNoTier]..."\n\n[recipient.GetSheHe|U] nasedne na [recipient.GetHerHis] koně a zeptá se: "Kam mám jít?"" # todo: NEW TRANSLATION
 holy_order.0001.desc: "„Tak tedy, [Select_CString(root.IsFemale, 'má paní', 'můj pane')], kam mě tato cesta zavede?“"
 holy_order.0001.desc_relation: "„Tak tedy, [recipient.Custom2('RelationToMeShort', ROOT.Char)], kam mě tato cesta zavede?“"
 holy_order.0001.a: "Půjdeš k [holy_order_1.GetName]."
 holy_order.0001.b: "Tvým cílem je [holy_order_2.GetName]."
 holy_order.0001.c: "Daleko odsud. Ať už tě nevidím!"
 holy_order.0001.d: "Teď už jsi problémem pro [holy_order_4.GetName]."
 holy_order.0001.e: "Udělal jsem chybu... Patříš sem!"
 holy_order.0001.toast_puppeteer: "[recipient.GetShortUIName] přijal[a] [puppet_or_actor.GetShortUINamePossessive] povolání do vojenského řádu" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT navyše [a]
 holy_order.0002.desc_angry: "Vyslovil jsem posvátná slova a stejně jako mě spoutala tvá vůle, jsem nyní spoután [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 holy_order.0002.desc: "Vyslyším volání vyšší moci a děkuji ti, že jsi mě [Select_CString(ROOT.Char.IsFemale, 'nasměrovala', 'nasměroval')] na tuto cestu spravedlnosti."
 holy_order.0002.a_demand: "Dobře. Nyní jdi v tichosti očekávat [ROOT.Char.GetFaith.PositiveAfterLife]." # todo: NEW TRANSLATION
 holy_order.0002.a: "Jsem si jist, že [ROOT.Char.GetFaith.HighGodName] bude s tvou službou [Select_CString(ROOT.Char.IsFemale, 'spokojena', 'spokojen')]!"
 holy_order.0002.toast_puppeteer: "[recipient.GetShortUIName] složil sliby na [puppet_or_actor.GetShortUINamePossessive] žádost" # todo: NEW TRANSLATION
 char_interaction.0001.opening_low_piety: "Že se někdo tak [ROOT.GetCharacter.Custom('GetSinfulShameful')] jako ty připlazí ke svatému řádu, který slouží [ROOT.Char.GetFaith.HighGodName]... Než se začneš starat o světské bohatství, měl by ses soustředit na vykoupení své duše."
 holy_order.0200.desc_opening: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 holy_order.0200.desc: "Vyslyšel jsem tvou prosbu o zlato a [order.GetName] odpoví na tvé volání."
 holy_order.0200.a: "[ROOT.Char.GetFaith.HighGodName] se na mě usmívá!"
 holy_order.0200.b: "Ale... Ale já ty peníze potřebuji!"
 holy_order.0202.second_time: "Znovu ti připomínám, že mému řádu dlužíš #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! zlata."
 holy_order.0202.opening: "Mému řádu dlužíš #bold [ROOT.Var('loan_amount_owed').GetValue|0]#! zlata."
 holy_order.0202.desc: "Pokud zlato nevrátíš, najdeme jiné způsoby, jak nám dluh splatíš... způsoby, které [ROOT.Char.GetFaith.HighGodName] jistě schválí, ale tobě se možná líbit nebudou."
 holy_order.0202.a: "Samozřejmě naši dohodu dodržím."
 holy_order.0202.a_no: "Zaplatím! Jen mi dej čas najít zlato..."
 holy_order.0202.a._not.tt: "@warning_icon! #X Nemáš dostatek [gold_i][Concept('gold','zlata')|E]#!"
 holy_order.0202.b_christian: "Není snad trpělivost ctností?"
 holy_order.0202.b: "Jsme přece oba oddaní věřící... Prosím, dej mi více času!"
 holy_order.0202.b.tt: "[recipient.GetTitledFirstNameNoTooltip] ti poskytne dalších 5 let"
 holy_order.0202.c: "Možná bychom mohli najít jiný způsob splácení...?"
 holy_order.0202.c.tt: "@warning_icon! #X [recipient.GetTitleAsNameNoTooltip] po tobě bude něco chtít#!"
 holy_order.0202.d: "V mých rukou je to zlato užitečnější!"
 holy_order.0203.desc: "Na ty, kdo nedodrží své slovo, se nedívám laskavě a [ROOT.Char.GetFaith.HighGodNameAlternate] také ne. Toto provinění napravíš tím, že nám pronajmeš [province.GetName], abychom mohli dále konat [ROOT.Char.GetFaith.HighGodNamePossessive] dílo."
 holy_order.0203.a: "Samozřejmě, [province.GetNameNoTierNoTooltip] bude vaše."
 holy_order.0203.b: "To je směšný požadavek!"
 holy_order.0204.desc: "Na ty, kdo nedodrží své slovo, se nedívám laskavě a [ROOT.Char.GetFaith.HighGodNameAlternate] také ne. Toto provinění napravíš tím, že nám pošleš svého [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [child.GetTitledFirstName], aby konal [ROOT.Char.GetFaith.HighGodNamePossessive] dílo."
 holy_order.0204.a: "Pošlu... pošlu [Select_CString(child.IsFemale, 'ji', 'ho')] na cestu."
 holy_order.0204.a.tt: "Řádu už nebudeš dlužit žádné zlato"
 holy_order.0205.desc: "Celá tahle záležitost s půjčkou byla ostudnou ukázkou tvé chamtivosti. Postarám se, ať se o tom [ROOT.Char.GetFaith.ReligiousHeadName] dozví!"
 holy_order.0205.a: "K čertu!"
 holy_order_letter.opening: "Tobě, kdo stejně jako já sloužíš [ROOT.Char.GetFaith.HighGodNameAlternate]"
 holy_order.1001.intro: "Náš řád [holy_order.GetName] se rozrůstá a potřebujeme více půdy, odkud bychom mohli organizovat obranu [ROOT.Char.GetFaith.GetAdjective] víry."
 holy_order.1001.end: "\n\n[target_barony.GetName] dokonale vyhovuje našim potřebám a chceme si toto území pronajmout do služeb naší věci."
 holy_order.1001.a: "Tvé žádosti vyhovuji. Za [ROOT.Char.GetFaith.HighGodName]!"
 holy_order.1001.b: "Neposloužil by vám stejně dobře [alternative_barony.GetNameNoTierNoTooltip]?"
 holy_order.1001.c: "Ne, tuto zemi vám nedám."
 holy_order.1011.intro: "V [target_barony.GetName] je dobrá půda k obdělávání a krásný [grandmaster.GetFaith.HouseOfWorship], kterému by prospěla klášterní komunita mých [grandmaster.Custom('SistersBrothers')]." # todo: NEW TRANSLATION
 holy_order.1011.end: "\n\nZprostředkujete nám to, aby tam [holy_order.GetName] mohl založit klášter?" # todo: NEW TRANSLATION
 holy_order.1011.a: "Řád si může pronajmout [target_barony.GetNameNoTierNoTooltip]." # todo: NEW TRANSLATION
 holy_order.1011.b: "V [alternative_barony.GetNameNoTierNoTooltip] panuje klid?" # todo: NEW TRANSLATION
 holy_order.1011.c: "Obávám se, že své [grandmaster.Custom('SistersBrothers')] budete muset poslat jinam." # todo: NEW TRANSLATION
 holy_order.2001.t: "Božské poslání"
 holy_order.2001.desc: "Když za mnou přijde můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], [child.GetFirstName], rychle pochopím, že chce probrat něco velmi vážného.\n\n„[ROOT.Char.Custom('MotherFather')|U], můj život tady bude navždy probíhat ve stínu ostatních. Dovol mi raději vstoupit do [holy_order.GetName] a sloužit [child.GetFaith.HighGodName]. Dlouho jsem o tom [Select_CString(child.IsFemale, 'přemýšlela', 'přemýšlel')] a právě to chci udělat.“"
 holy_order.2001.a: "[child.GetFaith.HighGodNameAlternate] tě povede, můj [child.Custom('DaughterSon')]."
 holy_order.2001.b: "Moje plány s tebou možná nejsou velkolepé, ale počítají s tebou tady."
 holy_order.2002.desc: "Když mi můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling'))], [sibling.GetTitledFirstName], poví o svých plánech, je zřejmé, že o nich dlouho přemýšlí.\n\n„Tady mě toho mnoho nedrží, a pokud mám někomu sloužit, raději budu sloužit přímo [sibling.GetFaith.HighGodName]. Vstupuji do [holy_order.GetName].“"
 holy_order.2002.a: "Tvou volbu chápu, [sibling.Custom('SisterBrother')]."
 holy_order.2002.b: "Ale ne, tohle tedy #EMP rozhodně#! neuděláš!"
 holy_order.2003.opening: "[grandmaster.Custom2('AppropriateGreetingPositive', ROOT.Char)|U]"
 holy_order.2003.desc: "Vždy budou zapotřebí skuteční válečníci, kteří zastaví každou hrozbu pro [grandmaster.GetFaith.GetAdjective] víru.\n[child.Custom('DaughterSon')|U] [child.GetTitledFirstName] má mnoho nadání a jen malou naději na dědictví. Věřím proto, že lepší život najde ve službách [holy_order_scope.GetName]. U nás bude [child.GetTitledFirstName] cvičit, učit se a přinese tvému jménu velkou čest."
 holy_order.2003.a: "Takový život náleží pravému [child.GetFaith.GetAdherentName]."
 holy_order.2003.child_joins_order: "[child.GetFirstName] získává [GetTrait('order_member').GetName( child.Self )] a vstupuje na dvůr [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.b: "Možná byste místo toho mohli vycvičit [alternative_child.GetFirstNameNoTooltip]?"
 holy_order.2003.alternative_child_joins_order: "[alternative_child.GetFirstName] získává [GetTrait('order_member').GetName( alternative_child.Self )] a vstupuje na dvůr [grandmaster.GetTitledFirstNameNoTooltip]"
 holy_order.2003.c: "Patří sem, ke mně."
 holy_order.2004.opening: "[child.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 holy_order.2004.desc: "Zasvětil jsem svůj život [child.GetFaith.HighGodNameAlternate], ale [child.GetFaith.HighGodNameSheHe] by si nepřál, abych zanedbával vlastní rodinu.\n\n[grandmaster.GetTitledFirstName] mi dovoluje vrátit se ke starému životu a znovu se stát součástí tvého [ROOT.Char.Custom('GetCourt')]."
 holy_order.2004.a: "Vítej doma, můj [child.Custom('DaughterSon')]!"
 holy_order.2004.b: "Ne. Tady už pro tebe není místo."
 holy_order.2005.t: "Návrat domů"
 holy_order.2005.desc: "[child.GetTitledFirstNamePossessive] návštěva trvala déle než obvykle. Teprve když se můj [child.Custom('DaughterSon')] zabydlel v mém [ROOT.Char.Custom('GetCourt')] — cpal se mým jídlem a obtěžoval mé služebnictvo — začal jsem mluvit o návratu do [holy_order.GetName]. Odpověď byla bohužel nadšená.\n\n„Copak jsi neslyšel, [ROOT.Char.Custom('MotherFather')]? [grandmaster.GetTitledFirstName] byl tak štědrý, že mě zbavil povinností vůči [child.GetFaith.GetName]! Konečně jsem doma se svou rodinou.“"
 holy_order.2005.a: "Ach, takže ty... tu zůstaneš?"
 holy_order.destroyed_title: "Svatý řád rozpuštěn"
 holy_order.2010.t: "Nový řeholní řád" # todo: NEW TRANSLATION
 holy_order.2010.desc: "Poustevníci, mystici a nespokojení učedníci ze starších řádů se shromáždili v [barony.GetNameNoTier] a léta pracovali na vybudování svého nového domova v divočině. [leader.GetWomanMan] jménem [leader.Custom('SisterBrother')|U] [leader.GetFirstName] se přirozeně stal[a] vůdcem tohoto rozrůstajícího se řádu, „[leader.GetPrimaryTitle.GetName]“... ale #EMP můj#! vznešený hlas se k této záležitosti dosud nevyjádřil. Také jsem ještě nenavrhl žádné svaté přikázání, které by se stalo srdcem životního řádu této komunity.\n\nO čem bude tento sbor čistých oddaných zpívat v [barony.GetNameNoTierNoTooltip]? Čemu se budou plně oddávat, o čem přemýšlet a psát? A kdo je v tom povede?" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT navyše [a]
 holy_order.2010.4: "[tenet_4.GetName( order_rite )] a [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 holy_order.2010.5: "[tenet_5.GetName( order_rite )] a [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 holy_order.2010.6: "[tenet_6.GetName( order_rite )] a [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 holy_order.2010.d: "[tenet_1.GetName( order_rite )] a [monk_tenet_1.Custom('SisterBrother')|U] [monk_tenet_1.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 holy_order.2010.e: "[tenet_2.GetName( order_rite )] a [monk_tenet_2.Custom('SisterBrother')|U] [monk_tenet_2.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 holy_order.2010.f: "[tenet_3.GetName( order_rite )] a [monk_tenet_3.Custom('SisterBrother')|U] [monk_tenet_3.GetFirstNameNoTooltip]." # todo: NEW TRANSLATION
 monastic_tenet_pick_tt: "[tenet_pick.GetName( order_rite )] se stane [core_tenet|E], který bude [monastic_order.GetName] prosazovat" # todo: NEW TRANSLATION
 monastic_order_tenet_advocated_tt: "[monastic_order.GetName] prosazuje [tenet_pick.GetName( order_rite )]" # todo: NEW TRANSLATION
 founded_monastic_order_modifier: "Založen řeholní řád" # todo: NEW TRANSLATION
 founded_monastic_order_modifier_desc: "Tento moudrý vládce pomohl vymyslet a založit nový řeholní řád, a tím zahájil novou cestu k božství." # todo: NEW TRANSLATION
 pick_becomes_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] se stane [ruler|E] řádu [monastic_order.GetName]" # todo: NEW TRANSLATION
 pick_remains_monastic_order_leader_tt: "[chosen_leader.GetShortUIName] zůstane [ruler|E] řádu [monastic_order.GetName]" # todo: NEW TRANSLATION
 holy_order.2009.t: "Výstavba kláštera" # todo: NEW TRANSLATION
 holy_order.2009.desc: "Uprostřed klidné krajiny [province.GetTerrain.GetNameNoTooltip|l], na místě milovaném [province.GetCulture.GetCollectiveNoun], pokládám první kámen, na němž jednoho dne bude stát klášter v [province.GetName].\n\nMoji dělníci společně s prostými obláty zvedají ze země zdi a ze svých pilných těl vydávají zbožné chorály. První ctihodní řeholníci — jako [potential_leader.Custom('SisterBrother')|U] [potential_leader.GetName] — sem také přicházejí, aby toto místo obývali a připravili plány kaplí a refektářů.\n\nZa několik let se zde zrodí nový řád. A vedle kamene a [ROOT.Char.Custom('GetWritingMaterial')] bude tento řád potřebovat také další členy, kteří mu přísahají věrnost." # todo: NEW TRANSLATION
 holy_order.2009.a: "Tento nový řád musí vést ti, které podporuji." # todo: NEW TRANSLATION
 holy_order.2009.b: "Mnozí řeholníci jsou nespokojeni se svým současným řádem..." # todo: NEW TRANSLATION
 holy_order.2009.b.tt: "...a opustili by své představené kvůli vedení tohoto nového řádu a svobodě sepsat novou řeholi." # todo: NEW TRANSLATION
 holy_order.2009.c: "Shromážděte divoké askety a horlivé mladíky." # todo: NEW TRANSLATION
 monastic_order_creation_increased_spiritual_fulfillment: "[interactions|E] s [monastic_holy_order|E] budou po dobu #high 50 let#! přinášet více [spiritual_fulfillment|E]" # todo: NEW TRANSLATION
 monastic_founder_become_saint_tt: "[chosen_leader.GetShortUIName] se po [chosen_leader.GetHerHis] smrti stane [GetTrait('saint').GetName( chosen_leader.Self )], pokud bude mít [chosen_leader.GetSheHe] #high 65+#! [trait_level_track_xp|E] vlastnosti [GetTrait('devoted').GetName( chosen_leader.Self )] nebo alespoň [piety_level|E] @piety_level_4_icon_christian! [GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]" # todo: NEW TRANSLATION
 holy_order.2020.t: "Řeholní sliby" # todo: NEW TRANSLATION
 holy_order.2020.desc: "Na mé naléhání se [recipient.GetFirstNamePossessive] v novém řeholním oděvu obrací zády k mému [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] i šlechtě světského světa. [recipient.GetSheHe|U] vstupuje do [archabbot.GetPrimaryTitle.GetName].\n\nStejně jako ostatní [recipient.Custom('SistersBrothers')] ze svého řádu přísahá [recipient.GetFirstNameNoTooltip] věrnost a oddanost svému svatému společenství. [recipient.GetSheHe|U] zasvěcuje své tělo [recipient.GetFaith.HighGodName] a svou mysl úctě k [recipient.GetFaith.PositiveAfterLife].\n\n[recipient.GetFirstNameNoTooltip] bude žít v [archabbot.GetCapitalLocation.GetName] nebo v jiné svatyni řádu a tam započne svůj život studia a rozjímání." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis], [recipient.GetHerHis], [recipient.GetHerHis], [recipient.GetHerHis], [recipient.GetHerHis]
 holy_order.2020.aa: "Řád získal pilnou mysl." # todo: NEW TRANSLATION
 holy_order.2020.aa.tt: "[recipient.GetFirstNamePossessiveNoTooltip] schopnosti ve správě budou řádu dobře sloužit při jeho neustálé práci." # todo: NEW TRANSLATION
 holy_order.2020.a: "Řád získal moudrého učedníka." # todo: NEW TRANSLATION
 holy_order.2020.a.tt: "Pro vzdělaného [recipient.GetFirstNameNoTooltip] nemůže být na tomto smrtelném světě vhodnější místo." # todo: NEW TRANSLATION
 holy_order.2020.b: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] jejich patrona přece není žádný služebný [recipient.Custom('GirlBoy')]..." # todo: NEW TRANSLATION
 holy_order.2020.c: "„Dar“ zajistí, že se bude mít [recipient.GetFirstNameNoTooltip] jako v bavlnce." # todo: NEW TRANSLATION
 holy_order.2020.d: "[recipient.GetHerHis|U] život nyní patří řádu." # todo: NEW TRANSLATION
 holy_order.2020.toast_puppeteer: "[recipient.GetShortUIName] vstoupil[a] na žádost [puppet_or_actor.GetShortUINamePossessive] do mnišského řádu" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT navyše [a]
 take_vows_improve_education_learning_tt: "Výsledek [education|E] v oblasti @skill_learning_icon![learning|E] se zlepší" # todo: NEW TRANSLATION
 take_vows_improve_education_stewardship_tt: "Výsledek [education|E] v oblasti @skill_stewardship_icon![stewardship|E] se zlepší" # todo: NEW TRANSLATION
 recently_joined_holy_order_desc: "[recipient.GetShortUIName] vstoupil[a] do svého řádu během posledních 5 let" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]; navyše [a]
 child_in_holy_order_desc: "[recipient.GetShortUIName] je dítě zaslíbené [recipient.GetHerHis] řádu" # todo: NEW TRANSLATION
 custom.every_domain_monastic_order: "Každý [monastic_holy_order|E] ve vaší [domain|E]" # todo: NEW TRANSLATION
 order_gains_minor_tenet_popularity_tt: "Jejich [core_tenet|E] získá #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! [tenet_popularity|E]" # todo: NEW TRANSLATION
 new_order_gains_minor_tenet_popularity_tt: "Váš nový [monastic_holy_order|E] přidá svému [core_tenet|E] dalších #P [EmptyScope.ScriptValue('minor_tenet_popularity_value')|0]#! [tenet_popularity|E]" # todo: NEW TRANSLATION
 holy_order.2030.t: "Dar: [recipient.GetPrimaryTitle.GetNameNoTooltip]" # todo: NEW TRANSLATION
 holy_order.2030.desc: "Mé bohatství putuje do pokladnic klášterů [recipient.GetTitledFirstNamePossessive]. Dar, který bude financovat zbožnou péči o půdu, opisování svatých textů a světské cíle [recipient.GetPrimaryTitle.GetName]...\n\n...a tisíce modliteb za spásu mé nesmrtelné duše. Řeholníci žijí, aby se modlili, a jejich neochvějná, spravedlivá oddanost — jak se říká — přiměje [ROOT.Char.GetFaith.random_GoodGodNames|U], aby jejich modlitbám věnoval zvláštní pozornost.\n\n#EMP [actor.GetFaith.HighGodName|U], slyšíš, jak vyslovují mé jméno?#!" # todo: NEW TRANSLATION
 holy_order.2030.desc_desperate_plea: "#EMP Víš, jak jsem se plazil a žebral — jako ubožák — o tvé milosrdenství?#!" # todo: NEW TRANSLATION
 holy_order.2030.desc_huge_donation: "#EMP Víš, jakého jmění jsem se vzdal...?#!" # todo: NEW TRANSLATION
 holy_order.2030.a: "Noví zastánci mé spásy." # todo: NEW TRANSLATION
