l_polish:
 jewish_events.0001.t: "Konec polygamie mezi [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] věřícími"
 jewish_events.0001.desc: "Po staletí nebylo jasné, zda je dovoleno mít více manželských partnerů. Po menší radě, na níž se sešli nejvlivnější rabíni vyznávající [ROOT.Char.GetFaith.GetName], však bylo rozhodnuto, že polygamie již není přípustná.\n\nToto rozhodnutí vychází především z obav, že jeden člověk nedokáže náležitě zaopatřit více manželských partnerů a že polygamie může mezi nimi vyvolávat žárlivost vedoucí k hříšnému jednání."
 jewish_events.0001.a: "Budiž."
 jewish_events.0001.b: "My [ROOT.Char.GetCulture.GetCollectiveNoun] se svých zvyků nevzdáme!"
 jewish_events.0001.c: "Myslím, že rabíni zapomínají, kde je jejich místo."
