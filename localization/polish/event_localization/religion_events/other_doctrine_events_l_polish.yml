l_polish:
 false_conversion.0020.t: "[old_faith.GetNameNoTooltip] v utajení"
 false_conversion.0020.desc: "Na veřejnosti se do puntíku řídím tím, co hlásá [ROOT.Char.GetFaith.GetNameNoTooltip]. Za závazný považuji [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] hodnotový řád, mou četbou je [ROOT.Char.GetFaith.ReligiousText], tedy [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] posvátný spis, a [ROOT.Char.GetFaith.HouseOfWorshipPlural] navštěvuji všude tam, kde se schází [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] sbor věřících.\n\nZa zavřenými dveřmi se však jen těžko vzdávám toho, co učí [old_faith.GetNameNoTooltip], a část mého nitra touží po otevřeném návratu ke starým způsobům.\n\nMožná právě teď nastal čas znovu otevřeně přiznat, že jsem [old_faith.GetAdherentNameNoTooltip], a přivést s sebou tolik dalších tajných vyznavačů a nedávných konvertitů, kolik jen dokážu?"
 false_conversion.0020.desc_landless: "Až dosud jsem se do puntíku řídil tím, co hlásá [ROOT.Char.GetFaith.GetNameNoTooltip]. Za závazný považuji [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] hodnotový řád, mou četbou je [ROOT.Char.GetFaith.ReligiousText], tedy [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] posvátný spis, a [ROOT.Char.GetFaith.HouseOfWorshipPlural] navštěvuji všude tam, kde se schází [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] sbor věřících.\n\nZa zavřenými dveřmi se však jen těžko vzdávám toho, co učí [old_faith.GetNameNoTooltip], a část mého nitra touží po návratu ke starým způsobům.\n\nMožná právě teď nastal čas znovu otevřeně přiznat, že jsem [old_faith.GetAdherentNameNoTooltip], a pevně tuto identitu zakotvit mezi těmi, které sdružuje [ROOT.Char.Custom('GetCourt')|l]?"
 false_conversion.0020.a: "[old_faith.HighGodName] zná mé srdce!"
 false_conversion.0020.b: "Ne, ne, ještě nenastal správný čas."
 false_conversion.0020.c: "$false_conversion.0020.a$"
 false_conversion.0030.t: "Amnestie pro tajné vyznavače"
 false_conversion.0030.desc_start: "Ke mně se donesly zvěsti o lidech v mém panství, kteří zcela či částečně tajně vyznávají jiné víry.\n\n"
 false_conversion.0030.desc_no_secret_faith: "Jako [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] stojím pevně za svou vírou, ta však vždy prosazovala ideál pluralismu a je politováníhodné, že se někteří ze strachu z pronásledování cítí nuceni své vyznání skrývat.\n\n"
 false_conversion.0030.desc_no_secret_faith_not_pluralist: "Někteří z těchto tajných věřících mohou být [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], jež náboženské pronásledování už dávno zahnalo do stínů.\n\n"
 false_conversion.0030.desc_has_secret_faith: "Ani já se nedokážu zcela oprostit od mnoha obřadů a přesvědčení, které přináší [old_faith.GetNameNoTooltip]. Mé pokračující uctívání nesmí nikdy vyjít na veřejnost, přesto ve mně osud těchto tajných společenství skrytých věřících budí hluboký soucit.\n\n"
 false_conversion.0030.desc_end: "Jako [ROOT.Char.GetTitleAsNameNoTooltip|L] mohu samozřejmě vyhlásit veřejnou amnestii pro všechny, kdo svou skutečnou víru skrývají..."
 false_conversion.0030.a: "Všichni mají mít svobodu uctívat božství!"
 false_conversion.0030.a.tt: "Dozvím se, kolik tajných vyznavačů, pokud vůbec nějací, mou nabídku přijme."
 false_conversion.0030.b_no_secret_faith: "Krypto-cože? To je nesmysl."
 false_conversion.0030.b_has_secret_faith: "Některá tajemství je prostě lepší nechat skrytá."
 false_conversion.0031.t: "$false_conversion.0030.t$"
 false_conversion.0031.desc: "[ROOT.Char.GetLiege.GetTitledFirstName] vydává po celém [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier] obecné prohlášení, že si přeje, aby každý mohl veřejně uctívat božství bez ohledu na to, jakou víru vyznává. Zároveň nabízí amnestii těm, kdo své náboženství praktikují tajně."
 false_conversion.0031.a: "Konečně vystoupíme ze stínů!"
 false_conversion.0031.b: "Lži o toleranci už jsme slyšeli..."
 false_conversion.1000.t: "[ROOT.Char.GetFaith.GetName] končí"
 false_conversion.1000.desc_intro: "[actor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] konečně přichází s požadavkem."
 false_conversion.1000.desc_has_family: " Týká se mě i zbytku mé rodiny."
 false_conversion.1000.desc_convert: " Novým vyznáním se má stát [actor.GetFaith.GetName].\n\n"
 false_conversion.1000.desc_forced: "Kvůli páce, kterou na mě má, působí tento požadavek téměř jako meč přiložený ke krku. Pokud však přijmu riziko následků, mohu [ROOT.Char.GetFaith.GetName] dál vyznávat "
 false_conversion.1000.desc_voluntary: "Na tento požadavek tedy víceméně kývnu. Možná však lze [actor.GetFaith.GetNameNoTooltip] veřejně hlásat a [ROOT.Char.GetFaith.GetName] přitom dál vyznávat "
 false_conversion.1000.desc_bold: "v tajném vzdoru."
 false_conversion.1000.desc_cowardly: "za rouškou tajemství."
 false_conversion.1000.desc_outro: "\n\nTak závažné rozhodnutí není snadné učinit o samotě..."
 false_conversion.1000.a: "Staré způsoby dnes končí."
 false_conversion.1000.b_single: "Na rtech bude [actor.GetFaith.GetNameNoTooltip], ale v srdci [ROOT.Char.GetFaith.GetNameNoTooltip]."
 false_conversion.1000.b_sanctioned_single: "[ROOT.Char.GetFaith.HighGodName] mi odpustí. [ROOT.Char.GetFaith.GetName] zůstane mým tajným vyznáním."
 false_conversion.1000.b_plural: "Na našich rtech bude [actor.GetFaith.GetNameNoTooltip], ale v našich srdcích [ROOT.Char.GetFaith.GetNameNoTooltip]."
 false_conversion.1000.b_sanctioned_plural: "[ROOT.Char.GetFaith.HighGodName] nám odpustí. [ROOT.Char.GetFaith.GetName] zůstane naším tajným vyznáním."
 false_conversion.1010.desc_has_no_family: " Vedle mě jej musí splnit také [spouse.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 false_conversion.1010.desc_spouse_intro: "[spouse.GetFirstNameNoTooltip] a já trávíme dlouhé noci marným hledáním způsobu, jak obejít [actor.GetTitledFirstNamePossessiveNoTooltip] požadavek. Nakonec [spouse.GetFirstNameNoTooltip] promluví:\n\n"
 false_conversion.1010.desc_spouse_advises_secrecy: "„Nemůžeme opustit cestu, kterou nám ukazuje [spouse.GetFaith.HighGodName], ať [actor.GetTitledFirstNameNoTooltip] požaduje cokoli. Musíme dál žít tak, jak si přeje [spouse.GetFaith.HighGodName], třeba jen v tajnosti.“"
 false_conversion.1010.desc_spouse_advises_conversion_cynical: "„Je mi lhostejné, zda naším vyznáním je [actor.GetFaith.GetNameNoTooltip] nebo [spouse.GetFaith.GetNameNoTooltip]. Pokud si však [actor.GetTitledFirstNameNoTooltip] přeje, aby naším vyznáním bylo [actor.GetFaith.GetNameNoTooltip], tak proč ne?“"
 false_conversion.1010.desc_spouse_advises_conversion_neutral: "„Ačkoli mě bolí to říci, nemůžeme si dovolit, aby naším vyznáním zůstalo [spouse.GetFaith.GetNameNoTooltip], ani tajně. [actor.GetTitledFirstNameNoTooltip] rozhoduje a my musíme poslechnout. Naším vyznáním se musí stát [actor.GetFaith.GetNameNoTooltip].“"
 false_conversion.1010.desc_outro_demure: "\n\nMám dát na radu, kterou nabízí "
 false_conversion.1010.desc_spouse_disliked: "[spouse.Custom2('InsultAdjective', ROOT.Char)] "
 false_conversion.1010.desc_spouse_liked: "[spouse.Custom('ComplimentAdjective')] "
 false_conversion.1010.desc_outro_wife_husband: "[spouse.GetWifeHusband|L]?"
 false_conversion.2000.t: "Chvíle slabosti"
 false_conversion.2000.desc_intro: "Čím více času spolu trávíme, tím zřetelněji [vulnerable_relation.Custom2('MyCharacterIntroduction', owner)] dává najevo, jak [Select_CString(vulnerable_relation.IsFemale, 'ji', 'ho')] drtí"
 false_conversion.2000.desc_descriptor_grief: " žal"
 false_conversion.2000.desc_descriptor_depression: " deprese"
 false_conversion.2000.desc_descriptor_stress: " stres"
 false_conversion.2000.desc_bridge: ".\n\n"
 false_conversion.2000.desc_quote_grief: "„Při sebemenší maličkosti se mi vybaví [deceased_character.GetFirstName],“ naříká [vulnerable_relation.GetTitledFirstNameNoTooltip]. „Jak mám teď žít na tomto světě bez [Select_CString(deceased_character.IsFemale, 'ní', 'něj')]?“"
 false_conversion.2000.desc_quote_depression: "„Každý den je těžší než ten předchozí,“ svěřuje se mi [vulnerable_relation.GetTitledFirstNameNoTooltip]. „Jak takhle můžu pokračovat, když mi z očí pomalu mizí vůle žít?“"
 false_conversion.2000.desc_quote_stress: "„Každodenní strasti života se pro mě staly utrpením,“ naříká [vulnerable_relation.GetTitledFirstNameNoTooltip]. „Každý den se modlím, aby mě něco vysvobodilo z nevyhnutelného osudu.“"
 false_conversion.2000.desc_outro: "\n\nMožná [owner.GetSecretFaith.HighGodName] dokáže vdechnout nový život této prázdné schránce..."
 false_conversion.2000.a: "„[owner.GetSecretFaith.GetName] zahojí tvůj žal.“"
 false_conversion.2000.a_flavor: "[vulnerable_relation.GetTitledFirstNameNoTooltip] zváží, zda bude [owner.GetSecretFaith.GetNameNoTooltip] tajně vyznávat"
 false_conversion.2000.a_success: "[vulnerable_relation.GetTitledFirstNameNoTooltip] nachází útěchu, kterou nabízí [owner.GetSecretFaith.HighGodName]"
 false_conversion.2000.a_failure: "[vulnerable_relation.GetTitledFirstNameNoTooltip] považuje můj návrh za urážku"
 false_conversion.2000.b: "[vulnerable_relation.GetTitledFirstNameNoTooltip] potřebuje jen útěchu. Dělat cokoli dalšího by bylo špatné."
 false_conversion.2001.t: "V čase nouze"
 false_conversion.2001.desc_grief: "Není dne, kdy se mi nevybaví [deceased_character.GetTitledFirstName]. Každá připomínka toho, jak [deceased_character.GetTitledFirstName] [Select_CString(deceased_character.IsFemale, 'žila', 'žil')] na tomto světě, otevírá novou studnici žalu."
 false_conversion.2001.desc_depression: "Dny se nekonečně vlečou a všichni kolem mě prožívají nové radosti i strasti. Já však dál bloudím v moři šedi a topím se v něm už celých [vulnerable_relation.GetAge] let."
 false_conversion.2001.desc_stress: "Začaly se u mě projevovat mimovolné tiky. Koušu si nehty, skřípu zuby a vyčerpaně přecházím sem a tam, než si lehnu do postele, kde pak stejně nemohu usnout. Přesto mě dál drtí stres, kterému ani nedokážu porozumět."
 false_conversion.2001.desc_outro: "\n\nPrávě když přemýšlím, jak vůbec pokračovat dál, [owner.Custom2('RelationToMeAddress', vulnerable_relation)] mi zašeptá do ucha: „Stačí přijmout léčivou moc, kterou nabízí [owner.GetSecretFaith.GetName], [vulnerable_relation.Custom2('RelationToMeAddress', owner)], a všechny tvé strasti pominou.“"
 false_conversion.2001.a: "Pak bude [owner.GetSecretFaith.GetNameNoTooltip] mou vírou a přijmu ji celým srdcem!"
 false_conversion.2001.b: "Co se mi to [owner.GetTitledFirstNameNoTooltip] snaží naznačit?"
 false_conversion.2001.b_flavor: "[owner.GetTitledFirstNameNoTooltip] už nic dalšího neřekne... prozatím"
 false_conversion.8000.t: "Má víra byla odhalena"
 false_conversion.8000.desc_intro: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] odhaluje, že za zavřenými dveřmi vyznávám [ROOT.Char.GetSecretFaith.GetName]!"
 false_conversion.8000.desc_disapproving_chaplain: "[disapproving_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] požaduje, ať veřejně činím pokání a uznám, že nade mnou stojí [disapproving_chaplain.GetFaith.HighGodName]."
 false_conversion.8000.desc_silent_chaplain: "[silent_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] k celé záležitosti mlčí, takže požadavkům na pokání musím čelit bez pomoci."
 false_conversion.8000.desc_outro: ""
 false_conversion.8000.a: "Už nikdy nezapochybuji v tom, co hlásá [ROOT.Char.GetFaith.GetNameNoTooltip]!"
 false_conversion.8000.b: "[ROOT.Char.GetSecretFaith.GetNameNoTooltip] je jediná pravá víra!"
 event_false_convert_my_vassal.t: "Vazal odhalil tajnou víru"
 event_false_convert_my_liege.t: "Lenní pán odhalil tajnou víru"
 event_false_convert_interface.desc: "[ROOT.Char.GetShortUIName] se zříká veřejně vyznávané víry. Novým vyznáním je [ROOT.Char.GetFaith.GetName] a tím vychází najevo dosavadní tajné vyznávání."
 event_false_converts.t: "Odhalení tajní vyznavači"
 event_false_converts_plus_counties.desc: "Vazalové-zeměpáni, kteří se zřekli veřejně vyznávané víry: [ROOT.Var('num_false_converts_vassal').GetValue|V0].\n\nBezzemci na mém dvoře, kteří se zřekli veřejně vyznávané víry: [ROOT.Var('num_false_converts_landless').GetValue|V0].\n\nHrabství s rozsáhlými komunitami tajných vyznavačů, které se veřejně přihlásily ke své skryté víře: [ROOT.Var('num_false_converts_counties').GetValue|V0]."
 event_false_converts_without_counties.desc: "Vazalové-zeměpáni, kteří se zřekli veřejně vyznávané víry: [ROOT.Var('num_false_converts_vassal').GetValue|V0].\n\nBezzemci na mém dvoře, kteří se zřekli veřejně vyznávané víry: [ROOT.Var('num_false_converts_landless').GetValue|V0]."
 event_false_converts_counties_only.desc: "Hrabství v mém panství s rozsáhlými komunitami krypto-[ROOT.Char.GetFaith.GetAdherentNameNoTooltip]: [ROOT.Var('num_false_converts_counties').GetValue|V0]. Mnohé z těchto komunit se ke své víře veřejně přihlásily spolu se mnou."
 false_convert_modifier: "Podezření na falešné konvertity"
 false_convert_modifier_desc: "Mnohé komunity v tomto hrabství zřejmě stále tajně vyznávají svou starou víru."
 relieved_cryptos_modifier: "Úleva tajných vyznavačů"
 relieved_cryptos_modifier_desc: "Zdejší obyvatelé jsou vděční, že mohou svou víru opět veřejně vyznávat."
 convert_to_crypto_religion_key: "Přijmout krypto-[ROOT.Char.GetSecretFaith.GetNameNoTooltip|L]"
 convert_to_crypto_religion_interaction_key: "Přijmout krypto-[actor.GetSecretFaith.GetNameNoTooltip|L]"
 convert_to_crypto_religion_interaction: "$convert_to_crypto_religion_interaction_key$ #weak (Intrika)#!"
 convert_to_crypto_religion: "Přijmout krypto-#D náboženství#!"
 convert_to_crypto_religion_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] pozná moudrost, kterou zjevuje [SCHEME.GetOwner.GetSecretFaith.KnowledgeGodName]. Výsledkem má být tajná konverze a novým vyznáním bude [SCHEME.GetOwner.GetSecretFaith.GetNameNoTooltip]."
 convert_to_crypto_religion_desc_general: "Nauč cílovou postavu tajně vyznávat novou víru. Tou bude [CHARACTER.GetSecretFaith.GetName]."
 convert_to_crypto_religion_action: "Obrátit"
 convert_to_crypto_religion_interaction_notification: "$convert_to_crypto_religion_interaction_key$"
 convert_to_crypto_religion_scheme_invalidated_title: "@scheme_icon! „$convert_to_crypto_religion$“ končí"
 convert_to_crypto_religion_general_desc: "[Concept('scheme','Intrika')|E], jejímž cílem je přivést cílovou postavu k tajné víře a rozšířit skryté společenství osnovatele."
 convert_to_crypto_religion_no_more_secret: "Mým tajným vyznáním už není [CHARACTER.GetSecretFaith.GetName]."
 convert_to_crypto_religion_invalid: "Tajná konverze už není možná. Cílem měl být [target.GetShortUIName|U] a novým vyznáním [CHARACTER.GetSecretFaith.GetName]."
