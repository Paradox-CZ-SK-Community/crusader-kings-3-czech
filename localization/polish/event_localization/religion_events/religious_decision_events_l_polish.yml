l_polish:
 religious_decision.0001.t: "Adorcismus"
 religious_decision.0001.desc: "[Select_CString(realm_priest.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom('MyPriestTitle')] [realm_priest.GetFirstName] mě zavádí na klidnou mýtinu poblíž malého potoka, kde pravidelné zurčení vody přes kameny vytváří uklidňující atmosféru.\n\n„Duchům se tu líbí, [ROOT.Char.GetFirstNameNoTooltip]. Je to nejlepší místo, kde je můžeme požádat o pomoc.“\n\n[realm_priest.GetFirstNameNoTooltip] zvedá dva koše, které si [Select_CString(realm_priest.IsFemale, 'přinesla', 'přinesl')], a dodává: „Teď se musíme rozhodnout, jakou oběť jim zanecháme.“"
 religious_decision.0001.desc_landless: "Při putování divočinou s koši plnými obětin brzy nacházím poklidný potůček ukrytý u vstupu do jeskyně.\n\nVzduch je tu téměř nasycen přítomností duchů.\n\nNevím však přesně, kteří z nich jsou zde přítomni, a tak přemýšlím nad obsahem svých košů. Co jim mám obětovat?"
 religious_decision.0001.a: "Velkolepou oběť z kauri, ovoce a myrhy."
 religious_decision.0001.b: "Tradiční úlitbu z obilí a borassy."
 religious_decision.0001.c: "Oběť? Pche! Nestačí snad, že jsem přišel?"
 religious_decision.0001.d: "Když o tom tak přemýšlím, raději je nebudeme rušit..."
 religious_decision.0001.a.tt.1: "Duchové si této oběti #P rozhodně všimnou#!"
 religious_decision.0001.a.tt.2: "Tato oběť může přilákat pozornost #Z mocného ducha#!, v dobrém či zlém"
 religious_decision.0001.b.tt: "Duchové si této oběti #P pravděpodobně všimnou#!"
 religious_decision.0001.c.tt: "Duchové se #N pravděpodobně urazí#!, ale taková drzost na ně může naopak #P zapůsobit#!"
 religious_decision.0001.d.flavor: "Duchové jsou vrtkaví. Nejlepší bude neriskovat, že je rozhněváme."
 religious_decision.0002.t: "Adorcismus"
 religious_decision.0002.desc.start_offering: "[realm_priest.GetFirstName] vysype mou obětinu na zem a začne kolem ní chodit v kruzích."
 religious_decision.0002.desc.start_offering_alone: "Vysypu svou obětinu na zem a začnu kolem ní chodit v kruzích."
 religious_decision.0002.desc.start_no_offering: "[realm_priest.GetFirstName] na mě zmateně hledí. „Obětuješ... sebe? Nu, asi to může fungovat...“ Poté začne kolem mě chodit v kruzích."
 religious_decision.0002.desc.start_no_offering_alone: "Na chvíli zaváhám a přemýšlím, zda není příliš troufalé nabídnout duchům jako oběť jen sebe. Pak začnu chodit v kruzích a zahájím rituál."
 religious_decision.0002.desc: "\n\n„Ó duchové, slyšte mě. Vyzývám vás, abyste tomuto prosebníkovi poskytli svou pomoc!“ zpěvavě pronáší [realm_priest.GetFirstNameNoTooltip].\n\nPohyb se postupně zrychluje a přechází v tanec. Gesta jsou stále zběsilejší a na tváři se leskne pot. Nakonec vše dospěje k vrcholu a sotva je tanec dokončen, [realm_priest.GetFirstNameNoTooltip] se vyčerpáním zhroutí k zemi."
 religious_decision.0002.desc_alone: "\n\n„Duchové, slyšte mě. Přijměte mou oběť a vyslyšte mou prosbu!“ volám do mýtiny, na kterou už padá soumrak.\n\nJak dál kroužím, náhle mě zaplaví příval energie. Čelo se mi orosí potem a údy se dají do zběsilého pohybu... stále rychleji a rychleji. Pohybuji se, pohybuji, #EMP pohybuji#!... až se nakonec zadýchaně zhroutím k zemi."
 religious_decision.0002.desc.end_changed: "\n\nPo skončení obřadu se cítím jinak. Jako bych se nějak změnil..."
 religious_decision.0002.desc.end_no_change: "\n\nDo mýtiny se vrací ticho a nehybnost. Všechno se zdá být přesně stejné jako předtím."
 religious_decision.0002.shrewd: "Má mysl ještě nikdy nebyla tak jasná!"
 religious_decision.0002.strong: "Tolik energie! Tolik síly!"
 religious_decision.0002.good: "Co je to za podivný pocit?"
 religious_decision.0002.bad: "Tohle nemůže být správně..."
 religious_decision.0002.possessed: "Cítím se uvězněný ve vlastním těle!"
 religious_decision.0002.no_change.zealous: "Urazil jsem snad duchy?"
 religious_decision.0002.no_change: "Jaká ztráta času."
 religious_decision.0101.t: "Bhakti"
 religious_decision.0101.desc.start: "Bhakti lze přirovnat k náklonnosti, oddanosti a uctívání, ale žádný z těchto pocitů tento pojem plně nevystihuje. Oddáním se některému z vtělení božství se mu zavazuji tělem i duší.\n\n[ROOT.Char.GetFaith.GetNameNoTooltip] se soustředí na uctívání"
 religious_decision.0101.desc.generic: "jen několika z nich."
 religious_decision.0101.desc.vaishnavism: "různých vtělení Višnua Uchovatele."
 religious_decision.0101.desc.shaivism: "mnoha vtělení Šivy Ničitele."
 religious_decision.0101.desc.smartism: "aspektů nejvyšší skutečnosti."
 religious_decision.0101.desc.end: "Jeden z těchto aspektů mě musí oslovovat více než ostatní..."
 religious_decision.0101.ganga: "Ganga, bůh čistoty a pokání."
 religious_decision.0101.saraswati: "Sarasvatí, bohyně učenosti a umění."
 religious_decision.0101.kali: "Kálí, bohyně ničení zla."
 religious_decision.0101.kubera: "Kubéra, bůh bohatství a spravedlnosti."
 religious_decision.0101.lakishmi: "Lakšmí, bohyně štěstí a blahobytu."
 religious_decision.0101.jagganath: "Džagannáth, Pán vesmíru."
 religious_decision.0101.hayagriva: "Hajagríva, bůh poznání a moudrosti."
 religious_decision.0101.parvati: "Párvatí, bohyně plodnosti a krásy."
 religious_decision.0101.virabhadra: "Vírabhadra, bůh spravedlivého hněvu."
 religious_decision.0101.munishwarar: "Muníšvarar, bůh domova a rodiny."
 religious_decision.0101.dakshinamoorthy: "Dakšinamúrti, bůh všech forem učení."
 religious_decision.0101.ganesha: "Ganéša, bůh moudrosti a nových začátků."
 religious_decision.0101.vishnu: "Višnu, bůh bdící nad stvořením."
 religious_decision.0101.shiva: "Šiva, bůh pronásledující zlo."
 religious_decision.0101.optout: "Ještě nejsem připraven se rozhodnout."
 religious_decision.0101.flavor: "Není ostuda počkat, dokud si nebudu jistý."
 religious_decision.0102.t: "Volba božstva"
 religious_decision.0102.desc: "[ROOT.Char.GetFaith.PantheonTerm|U] tvoří početný a nevyzpytatelný zástup, přesto nemohu tvrdit, že mě někteří z nich nepřitahují více než ostatní. Kdybych se otevřeně zasvětil především uctívání jednoho takového božstva, nepochybně bych k sobě přitáhl podobně smýšlející duše.\n\nAť už mi mé božstvo udělí jakákoli požehnání, když mě obklopí [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] podobného smýšlení, může mi to přinést jen zdraví, bohatství a slávu."
 religious_decision.0102.odin: "Ódin, vůdce Ásů!"
 religious_decision.0102.ullr: "Ullr, lovec, válečník, strůjce slávy!"
 religious_decision.0102.tyr: "Týr Jednoruký, válečník!"
 religious_decision.0102.thor: "Thor, přítel lidstva!"
 religious_decision.0102.freyr: "Freyr, pán a ochránce!"
 religious_decision.0102.optout: "$religious_decision.0101.flavor$"
 religious_decision.0102.flavor: "$religious_decision.0101.flavor$"
 religious_decision.0201.t: "Meditace v ústraní"
 religious_decision.0201.desc: "Vydat se prostřednictvím meditace na cestu do vlastního nitra není žádná maličkost. Je třeba učinit mnoho příprav a jednou z nich je rozhodnout, kam se uchýlím.\n\nMísto, které si k meditaci vyberu, výrazně ovlivní výsledek celé mé cesty."
 religious_decision.0201.home: "[ROOT.Char.Custom('ResidenceBuilding')|U] mi poskytne pohodlí domova."
 religious_decision.0201.plains: "[plains_location.GetNameNoTooltip]: mírné pláně."
 religious_decision.0201.hills: "[hills_location.GetNameNoTooltip]: zvlněné kopce."
 religious_decision.0201.steppe: "[steppe_location.GetNameNoTooltip]: pod širým modrým nebem."
 religious_decision.0201.forest: "[forest_location.GetNameNoTooltip]: odlehlé lesy."
 religious_decision.0201.drylands: "[drylands_location.GetNameNoTooltip]: vyprahlé křoviny."
 religious_decision.0201.mountains: "[mountains_location.GetNameNoTooltip]: odlehlé hory."
 religious_decision.0201.wetlands: "[wetlands_location.GetNameNoTooltip]: páchnoucí mokřady."
 religious_decision.0201.jungle: "[jungle_location.GetNameNoTooltip]: hlučná džungle."
 religious_decision.0201.desert: "[desert_location.GetNameNoTooltip]: spalující pouštní žár."
 religious_decision.0201.optout: "Teď mám příliš mnoho práce na to, abych meditoval."
 religious_decision.0201.optout.flavor: "Není kam spěchat. Svět nikam neuteče."
 religious_decision.0201.difficulty.easy: "[tooltip_loc.GetName] je #P bezpečné a snadné#! místo k meditaci"
 religious_decision.0201.difficulty.medium: "[tooltip_loc.GetName] je #Z středně náročné#! místo k meditaci"
 religious_decision.0201.difficulty.hard: "[tooltip_loc.GetName] je #N obtížné a nebezpečné#! místo k meditaci"
 religious_decision.0201.stress: "Na tomto místě si s větší pravděpodobností snížím [Concept('stress','stres')|E]"
 religious_decision.0201.trait: "Na tomto místě s větší pravděpodobností dospěji k osobnímu poznání"
 religious_decision.0201.learning: "Na tomto místě s větší pravděpodobností dospěji k teologickému poznání"
 religious_decision.0210.toast: "Začínáš meditovat"
 religious_decision.0211.t: "$religious_decision.0201.t$"
 religious_decision.0211.desc.beginning.home: "Uchyluji se do soukromí svých komnat a zahajuji dlouhé období půstu a meditace."
 religious_decision.0211.desc.beginning.plains: "[meditation_location.GetName] se přede mnou otevírá širými pláněmi a má mysl se zbavuje pout a může se volně toulat."
 religious_decision.0211.desc.beginning.hills: "[meditation_location.GetName] nabízí z vrcholků kopců daleké výhledy, které přímo vybízejí k hlubokému rozjímání."
 religious_decision.0211.desc.beginning.steppe: "[meditation_location.GetName] se svým širým stepním nebem osvobozuje mou mysl od všech pout a nechává ji volně bloudit."
 religious_decision.0211.desc.beginning.forest: "[meditation_location.GetName] mě vítá divokými lesy, kde nacházím poklidnou mýtinu vhodnou k meditaci."
 religious_decision.0211.desc.beginning.drylands: "[meditation_location.GetName] mě obklopuje suchým vzduchem křovinaté pustiny, který mi plní plíce a vysušuje kůži."
 religious_decision.0211.desc.beginning.mountains: "[meditation_location.GetName] nabízí řídký horský vzduch, který mi pročistí mysl, když obrátím pozornost do vlastního nitra."
 religious_decision.0211.desc.beginning.wetlands: "[meditation_location.GetName] mě zahaluje vlhkým vzduchem mokřadů. Šaty se mi lepí na kůži, když usedám a obracím pohled do vlastní duše."
 religious_decision.0211.desc.beginning.jungle: "[meditation_location.GetName] mě obklopuje neustálým bzukotem hmyzu a zpěvem ptáků, zatímco se snažím nahlédnout do vlastního nitra."
 religious_decision.0211.desc.beginning.desert: "[meditation_location.GetName] mě vítá spalujícím pouštním sluncem. Pod jeho žárem obracím pohled do svého nitra a hledám hlubší pochopení svého místa ve vesmíru."
 religious_decision.0211.desc.result.impatient: "\n\nBrzy však začínám ztrácet trpělivost. Ať sedím sebevíc nehybně a snažím se sebevíc, necítím nic než nudu."
 religious_decision.0211.desc.result.secret: "\n\nBohužel nedokážu přestat myslet na temná tajemství, která skrývám. Co se stane, pokud se o nich svět dozví? Takové myšlenky mi nedovolují nalézt klid."
 religious_decision.0211.desc.result.hungry: "\n\nBrzy mě však přemůže hlad a dochází mi, že zásoby, které jsem si přinesl, jsou zoufale nedostatečné. Zbytek cesty trávím hledáním potravy v divočině a na rozjímání mi zbývá jen málo času."
 religious_decision.0211.desc.result.thirsty: "\n\nNetrvá dlouho a začínají mi praskat rty. Žízeň sílí a je zřejmé, že ji měch s vodou dlouho neutiší. Brzy si uvědomuji, že pokud chci přežít žár, musím vyhledat úkryt. Hostinec, který nacházím, je však příliš rušný na to, abych v něm nalezl potřebný klid a ticho."
 religious_decision.0211.desc.result.headache: "\n\nBohužel mě zanedlouho přepadne silná bolest hlavy, která neustupuje. Brzy už nedokážu myslet na nic jiného než na bolest."
 religious_decision.0211.desc.result.distraction: "\n\nBohužel se nekonečný hluk stává neustálým rozptýlením a rostoucí podráždění představuje duševní překážku, kterou nedokážu překonat."
 religious_decision.0211.desc.result.minor_stress: "\n\nKdyž mě netíží malicherné starosti, které přináší každodenní [ROOT.Char.Custom('GetCourt')|l] život, brzy zjišťuji, že stále více času trávím prostým užíváním drobných životních radostí."
 religious_decision.0211.desc.result.medium_stress: "\n\nOdlehlost tohoto místa je velkým požehnáním a poskytuje mi vítaný oddech od každodenních problémů, které obvykle přináší [ROOT.Char.Custom('GetCourt')|l]."
 religious_decision.0211.desc.result.major_stress: "\n\nDaleko od všeho v hluboké divočině zjišťuji, že starosti, kterými mě zatěžuje [ROOT.Char.Custom('GetCourt')|l], náhle ztrácejí veškerou váhu. Poprvé po příliš dlouhé době nacházím klid."
 religious_decision.0211.desc.result.reflection: "\n\nPři hlubokém pohledu do vlastního nitra si uvědomuji, že život, který vedu, je povrchní a nedokonalý a poskvrňují jej nezdravé touhy. Když se ze své cesty vracím, zjišťuji, že mě tyto věci už nelákají jako dříve."
 religious_decision.0211.desc.result.epiphany: "\n\nPři meditaci v odloučení mě náhle zasáhne prozření. Přítomnost člověka ve světě a naše místo v přirozeném řádu... Další dílek vesmírné skládačky zapadl na své místo!"
 religious_decision.0211.desc.result.fugue: "\n\nPo mnoha dnech upadám do stavu fugy a zcela ztrácím vědomí sebe sama. Osvobozen od tužeb a předsudků spatřuji pravdu vesmíru vetkanou přímo do samotné podstaty světa kolem mě. Vidím všechno... rozumím všemu... vesmír a já jsme jedno.\n\nNakonec se vracím ke svému starému já, přesto si stále pamatuji útržky toho, co jsem během transu poznal."
 religious_decision.0211.a.critical_success: "Tato zkušenost se mnou zůstane navždy."
 religious_decision.0211.a.success: "Jsem rád, že jsem si na to udělal čas."
 religious_decision.0211.a.failure: "Běda..."
 religious_decision.0211.experience: "Zlepšuješ svou dovednost v meditaci"
 religious_decision.0291.toast: "Dokončuješ meditaci"
 religious_decision.0302.t: "Nebeský pohřeb"
 religious_decision.0302.desc.wilderness: "[ROOT.Char.Custom('GetCourt')|U] podle tradice shromáždí malou skupinu lidí, která vynese [ROOT.Var('ancestor_to_bury').Char.GetFirstNamePossessive] tělo do divočiny, abychom mu mohli dopřát řádný pohřeb.\n\nPrůvodu si brzy všimnou mrchožraví ptáci a začnou kroužit nad našimi hlavami. Dychtivě, ale trpělivě čekají, dokud neproneseme poslední slova a neodejdeme, a teprve potom slétnou k hostině."
 religious_decision.0302.desc.zoroastrian: "Kvůli nebezpečí poskvrnění démonem mrtvol Nasu nesmím vstoupit do věže dachma, kde bude [ROOT.Var('ancestor_to_bury').Char.GetFirstNamePossessive] tělo zbaveno masa.\n\nTěla se místo mě ujme několik [ROOT.Char.GetFaith.PriestNeuterPlural], kteří jsou speciálně vycvičeni k zacházení s mrtvými, a vynesou je na vrchol věže.\n\nPo nějaké době se [ROOT.Char.GetFaith.PriestNeuterPlural] vracejí. Jako [ROOT.Char.GetTitleAsNameNoTooltip] dostávám zprávu: „Je hotovo. Nyní mrchožraví ptáci oberou tělo o maso a sluneční paprsky vybělí kosti.“"
 religious_decision.0302.a: "Ať [ROOT.Char.Custom2('RelationToMe', ROOT.Var('ancestor_to_bury').Char)] odpočívá v pokoji."
 religious_decision.0401.t: "Věštění z hvězd"
 religious_decision.0401.desc.beginning: "Mnoho nocí jsem strávil pozorováním noční oblohy a sledováním pohybu nebeských těles.\n\nPostupem času jsem si všiml určitého vzorce a po několika dnech zkoumání si jsem svou předpovědí jistý. Znamení jsou jasná:"
 religious_decision.0401.desc.great_battle: " čeká mě velká bitva."
 religious_decision.0401.desc.new_friends: " nastal čas zahojit staré rány a najít nové přátele."
 religious_decision.0401.desc.hard_work: " tvrdá práce mě v budoucnu dovede k velkému bohatství."
 religious_decision.0401.desc.betrayal: " mí spojenci nejsou tím, za koho jsem je považoval."
 religious_decision.0401.desc.new_beginnings: " nastává čas nových začátků a otevřené mysli."
 religious_decision.0401.a: "Co dalšího asi budoucnost chystá?"
 religious_decision.0501.t: "[ROOT.Char.GetTitleAsNameNoTooltip] a víra, kterou vyznává [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 religious_decision.0501.desc: "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] je po generace zemí, kde o zdejší šlechtě platí, že její příslušník bývá [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]. [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] svět přitom běžně přijímal náboženský pluralismus a uctívání místních bohů. Po obnovení velekněžství však [ROOT.Char.GetFaith.ReligiousHeadTitleName] [ROOT.Char.GetFaith.ReligiousHeadName] trvá na ukončení této pohanské praxe a požaduje, aby každý, kdo přísahá věrnost chánovi, přísahal věrnost také Bohu a náležitě jej uctíval.\n\nJako [ROOT.Char.GetTitleAsNameNoTooltip] mám nakonec pravomoc rozhodnout o budoucnosti víry. [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] i celá Step jsou nyní odkázány na mé slovo."
 religious_decision.0501.a: "[Select_CString(ROOT.Char.IsFemale, 'Dobrá', 'Dobrý')] [ROOT.Char.GetTitleAsNameNoTooltip] nechává svému lidu jeho zvyky."
 religious_decision.0501.b: "Možná by umírněná reforma uspokojila obě strany."
 religious_decision.0501.c: "[ROOT.Char.GetFaith.GetNameNoTooltip] se musí šířit do celého světa!"
 religious_decision.0501.jewish.tt: "Každý židovský [Concept('vassal','vazal')|E]"
 religious_decision.0501.nonjewish.tt: "Každý nežidovský [Concept('vassal','vazal')|E]"
 religious_decision.0501.diff_culture.tt: "Každý [Concept('vassal','vazal')|E] jiné [Concept('culture','kultury')|E]"
 can_never_reform_kuzarism_tt: "[GetFaithByKey('kabarism').GetName] si natrvalo zachová své stávající zásady."
 religious_decision.0502.t: "[khazar_khan.GetTitleAsNameNoTooltip] a víra, kterou vyznává [khazar_khan.GetFaith.GetAdherentNameNoTooltip]"
 religious_decision.0501.d: "[ROOT.Char.GetFaith.GetNameNoTooltip] je jediná pravá víra a [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] jsou [ROOT.Char.GetFaith.HighGodNamePossessive] poslové."
 religious_decision.0502.desc.intro: "[khazar_khan.GetPrimaryTitle.GetNameNoTierNoTooltip] je po generace zemí, kde o zdejší šlechtě platí, že její příslušník bývá [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]. [khazar_khan.GetPrimaryTitle.GetAdjectiveNoTooltip] svět přitom běžně přijímal náboženský pluralismus a uctívání místních bohů."
 religious_decision.0502.desc.body: "V poslední době však [khazar_khan.GetTitleAsNameNoTooltip] a rabíni panství vedou prudký spor o lidová náboženství a nevěřící. [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip] musí rozhodnout, jaké místo jim náleží.\n\n[Khazar_khan.GetTitleAsNameNoTooltip] už však [Select_CString(khazar_khan.IsFemale, 'dospěla', 'dospěl')] k rozhodnutí. "
 religious_decision.0502.desc.righteous: "Královské nařízení stanoví, že [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip] už nebude zvýhodňovat ty, kdo stále uctívají staré způsoby. [khazar_khan.GetTitleAsNameNoTooltip] navíc přijme přísahu věrnosti pouze od těch, pro něž je [khazar_khan.GetFaith.HighGodName] rovněž nejvyšší autoritou."
 religious_decision.0502.desc.fundamentalist: "Náboženský pluralismus nejen končí, ale [khazar_khan.GetPrimaryTitle.GetTierAsNameNoTooltip] nyní považuje za nepřítele každého, kdo nepraktikuje ortodoxní [khazar_khan.GetFaith.GetNameNoTooltip]. [khazar_khan.GetTitleAsNameNoTooltip] prohlašuje, že po celé Stepi i za jejími hranicemi má být jediným vyznáním [khazar_khan.GetFaith.GetNameNoTooltip] a každý dobrý [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] má povinnost zapojit se do této nové éry náboženských válek."
 religious_decision.0502.a: "[ROOT.Char.GetFaith.GetNameNoTooltip] dnes prožívá vskutku temný den."
 religious_decision.0502.b: "Už bylo načase!"
 religious_decision.0503.t: "Hebrejský jazyk"
 religious_decision.0503.desc: "[hebrew_language_adopter_scope.GetCulture.GetName] kultura má svého nejvlivnějšího panovníka a zároveň vládce rozsáhlého židovského panství: [hebrew_language_adopter_scope.GetName]. [hebrew_language_adopter_scope.GetNameNoTooltip] vydává nařízení, podle něhož se hebrejština od nynějška stává liturgickým i běžným jazykem lidu, jehož kultura je [hebrew_language_adopter_scope.GetCulture.GetNameNoTooltip]!\n\nHebrejština byla po tisíciletí liturgickým jazykem židovské víry. Nyní však [hebrew_language_adopter_scope.GetNameNoTooltip] vládne panství s židovskou většinou, a potřeba používat v každodenním životě jiné jazyky proto slábne. Ačkoli židovskou víru nevyznává každý příslušník lidu, jehož kultura je [hebrew_language_adopter_scope.GetCulture.GetNameNoTooltip], pravděpodobně potrvá jen jednu či dvě generace, než budou všichni mluvit hebrejsky."
 religious_decision.0503.a.jewish: "Le chajim!"
 religious_decision.0503.a.non_jewish: "Raději bych měl začít trénovat."
 religious_decision.0503.b: "Tímhle podivným jazykem neumím mluvit!"
 religious_decision.0601.t: "Rozkol ummy: [founder.GetFaith.GetAdjectiveNoTooltip] [founder.GetFaith.ReligiousHeadTitleName|L]"
 religious_decision.0601.desc: "Bez #EMP skutečného#! vedení jsme ztraceni.\n\nMy, [founder.GetFaith.GetAdherentNamePlural], od chvíle, kdy [old_caliph.GetTitledFirstName] [Select_CString(old_caliph.IsFemale, 'získala', 'získal')] tento úřad, postrádáme potřebné vedení a další věřící trpí nedostatkem rad, autority a právního výkladu.\n\nS těžkým srdcem a podporou některých z nejvlivnějších duchovních [founder.GetFaith.GetAdjectiveNoTooltip] světa prohlašuji, že [founder.GetFaith.HighGodName] neochvějně trvá na tom, aby nejvyšší náboženský úřad přešel do mých rukou.\n\nOd tohoto dne až do Dne zúčtování bude tento úřad náležet mně a mým dědicům a pod mou pevnou rukou budou pravověrní celého světa vzkvétat!"
 religious_decision.0601.a: "Nyní nesu toto těžké břemeno..."
 religious_decision.0601.b: "Ha! [old_caliph.GetFirstNameNoTooltip] teď [Select_CString(old_caliph.IsFemale, 'dostala', 'dostal')] #EMP co proto#!."
 religious_decision.0601.tt.some_rulers_converted_away: "Počet [Concept('rulers','vládců')|E], kteří na protest změní víru: [THIS.Var('schismed_caliphate_major_ruler_converted_count').GetValue|0]. Jejich novým vyznáním bude [old_caliph.GetFaith.GetName]"
 religious_decision.0601.tt.all_rulers_stayed: "Žádný významný [founder.GetFaith.GetAdjective] [Concept('ruler','vládce')|E] na protest víru nezmění. Novým vyznáním žádného z nich se nestane [old_caliph.GetFaith.GetName]"
 religious_decision.0602.t: "$religious_decision.0601.t$"
 religious_decision.0602.desc: "[founder.GetFirstName] dává otevřeně najevo, že #EMP nesnáší#! způsob, jakým [old_caliph.GetTitledFirstName] vykonává posvátný úřad hlavy víry, ale pochybuji, že někdo čekal, že [founder.GetFirstNameNoTooltip] zajde až #EMP tak daleko#!.\n\nTo šílenství zašlo tak daleko, že [founder.GetFirstNameNoTooltip] [Select_CString(founder.IsFemale, 'shromáždila', 'shromáždil')] dostatek podpory, aby [Select_CString(founder.IsFemale, 'mohla', 'mohl')] prohlásit: #EMP [founder.GetFirstNameNoTooltip]#! je [founder.GetFaith.ReligiousHeadName]. Tím [Select_CString(founder.IsFemale, 'rozštěpila', 'rozštěpil')] ummu!\n\nJe znepokojivé, že prostý lid toto rozhodnutí z velké části přijal jen jako další z mocenských her svých nadřízených. V rámci víry, kterou představuje [founder.GetFaith.GetName], však patřím k jejím nejvýznamnějším osobnostem, takže je na mně rozhodnout, zda se mé panství novému řádu podřídí, nebo se vzepře."
 religious_decision.0602.a: "[founder.GetTitledFirstNameNoTooltip] jistě prokáže svou způsobilost."
 religious_decision.0602.a.tt: "V klidu se přizpůsobíš novému řádu"
 religious_decision.0602.b: "[old_caliph.GetTitledFirstNameNoTooltip] má mou neochvějnou věrnost!"
 religious_decision.0602.c: "Lidé očividně zoufale touží po skutečném vůdci..."
 fp2_opportunistic_schismatic_modifier: "Oportunistický rozkolník"
 fp2_opportunistic_schismatic_modifier_desc: "Tato postava si postupně razí cestu k vlastnímu zjevení..."
 religious_decision.0603.t: "$religious_decision.0601.t$"
 religious_decision.0603.desc: "V poslední době jsou [founder.GetFirstName] a [old_caliph.GetShortUINameNoFormat] ve stále ostřejším sporu, ale [founder.GetFirstNameNoTooltip] jej nyní [Select_CString(founder.IsFemale, 'vyhrotila', 'vyhrotil')] do nečekaně prudké míry.\n\n[founder.GetFaith.GetName] má mnoho předních duchovních a značná část z nich tento krok podpořila. Díky tomu [founder.GetFirstNameNoTooltip] [Select_CString(founder.IsFemale, 'úspěšně prohlásila', 'úspěšně prohlásil')], že právě [Select_CString(founder.IsFemale, 'ona je pravou hlavou', 'on je pravou hlavou')] své víry. [old_caliph.GetShortUINameNoFormat] tím přichází o autoritu nad těmi, pro které už [old_caliph.GetFaith.GetName] nepředstavuje ortodoxii.\n\nMnozí $islam_religion_adherent_plural$, kteří kladou důraz na jednotu společenství, otevřeně oplakávají další trhlinu v ummě."
 religious_decision.0603.a: "Zrůda! Prašivá bestie! Rouhavá stvůra!"
 religious_decision.0603.b: "[old_caliph.GetTitledFirstNameNoTooltip] si nedokáže udělat pořádek ani ve vlastním domě..."
 religious_decision.0603.c: "Ha! To je ale drama!"
