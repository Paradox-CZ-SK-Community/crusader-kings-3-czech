l_polish:
 religious_interaction.1.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.1.desc: "Po mnoha modlitbách a úvahách vyhovuji tvé žádosti o rozvod. [secondary_recipient.GetFirstNameNoTooltip] už nebude [Select_CString(secondary_recipient.IsFemale, 'tvou manželkou', 'tvým manželem')],"
 religious_interaction.1.consanguinity: "a to z důvodu pokrevního příbuzenství."
 religious_interaction.1.fallback: "a to kvůli podezření z cizoložství."
 religious_interaction.1.adultery: "a to kvůli cizoložství."
 religious_interaction.1.different_faith: "a to proto, že druhá strana nevyznává pravou víru."
 religious_interaction.1.eunuch: "a to proto, že druhá strana není náležitě vybavena."
 religious_interaction.1.a: "Je mi líto, že [secondary_recipient.GetFirstNameNoTooltip] tím musí projít."
 religious_interaction.2.desc: "Po dlouhém zvažování považuji za nejlepší pro náš rod vyhovět tvé žádosti o rozvod. [secondary_recipient.GetFirstNameNoTooltip] už nebude [Select_CString(secondary_recipient.IsFemale, 'tvou manželkou', 'tvým manželem')],"
 religious_interaction.2.infertility: "a to kvůli odmítání naplnit manželství."
 religious_interaction.2.adultery: "a to proto, že druhá strana porušila posvátnost manželství tím, že měla pohlavní styk s někým jiným."
 religious_interaction.3.desc: "Po zvážení tvé situace tvé žádosti vyhovuji."
 religious_interaction.3.defensive_war: "Ať ti tyto prostředky pomohou ubránit víru před vpádem! [war_target.GetFaith.GetAdjective] svět proti tobě vysílá hordy a v jejich čele stojí [war_target.GetTitledFirstName]!"
 religious_interaction.2.offensive_war: "Ať ti tyto prostředky přinesou vítězství! Proti tobě stojí [war_target.GetTitledFirstName]."
 religious_interaction.3.fallback: "Ať ti tyto prostředky pomohou šířit pravou víru ve tvých zemích!"
 religious_interaction.3.a: "[ROOT.Char.GetFaith.WealthGodName] stojí při mně, daňová vratka je tu!"
 religious_interaction.3.b: "Tyto prostředky mi přinesou vítězství!"
 religious_interaction.3.c: "Toto bohatství využiji moudře."
 religious_interaction.3.d: "Toto zlato zahojí rány mé pokladnice!"
 religious_interaction.32.desc: "Po zvážení tvé žádosti ji zamítám."
 religious_interaction.32.a: "Ach ne!"
 religious_interaction.4.desc: "Po zvážení tvé žádosti uznávám tvůj nárok, podle něhož ti má náležet [target.GetName]."
 religious_interaction.4.child: "Protože [secondary_recipient.GetTitledFirstName] je pouhé dítě, máš právo zasáhnout."
 religious_interaction.4.they_are_female: "Protože [secondary_recipient.GetTitledFirstName] je žena, máš právo zasáhnout."
 religious_interaction.4.they_are_male: "Protože [secondary_recipient.GetTitledFirstName] je muž, máš právo zasáhnout."
 religious_interaction.4.fallback: "Vyšly najevo nezpochybnitelné důkazy, že tví předkové této zemi v dávných dobách skutečně vládli."
 religious_interaction.4.a: "Prokážu svou způsobilost vládnout!"
 religious_interaction.42.desc: "Po zvážení tvé žádosti ji zamítám. Neuznávám tedy tvrzení, že ti má náležet [target.GetName]."
 religious_interaction.42.a: "K čertu!"
 religious_interaction.5.child: "Kvůli tvému nízkému věku,"
 religious_interaction.5.they_are_female: "Kvůli tomu, že jsi žena,"
 religious_interaction.5.they_are_male: "Kvůli tomu, že jsi muž,"
 religious_interaction.5.fallback: "Kvůli zjevnému nedostatku zbožnosti,"
 religious_interaction.5.outro: "což církev velmi znepokojuje,"
 religious_interaction.5.outro_different_recipient: "vyhovuji žádosti, kterou podává [actor.GetName], a uznávám, že předmětem nároku je [target.GetName]."
 religious_interaction.5.self: "rozhoduji se svůj nárok uplatnit, jak je mým právem. Jeho předmětem je [target.GetName]."
 religious_interaction.5.a: "To je výsměch spravedlnosti!"
 religious_interaction.6.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.6.desc: "Po mnoha modlitbách a úvahách vyhovuji tvé žádosti o rozvod. [secondary_actor.GetFirstNameNoTooltip] a [secondary_recipient.GetFirstNameNoTooltip] už nebudou manželé,"
 religious_interaction.6.consanguinity: "a to z důvodu pokrevního příbuzenství."
 religious_interaction.6.fallback: "a to kvůli podezření z cizoložství."
 religious_interaction.6.adultery: "a to kvůli cizoložství."
 religious_interaction.6.different_faith: "a to proto, že druhá strana nevyznává pravou víru."
 religious_interaction.6.eunuch: "a to proto, že druhá strana není náležitě vybavena."
 religious_interaction.6.a: "Je mi líto, že [secondary_recipient.GetFirstNameNoTooltip] tím musí projít."
 religious_interaction.1001.t.fatwa: "Vydána fatva!"
 religious_interaction.1001.t: "Právní odsouzení!"
 religious_interaction.1001.desc: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))], [actor.GetTitledFirstName], [Select_CString(actor.IsFemale, 'zařídila', 'zařídil')], aby [actor.GetFaith.PriestNeuterPlural|L] vydali spis, v němž jsem [Select_CString(ROOT.Char.IsFemale, 'odsouzena jako hříšnice', 'odsouzen jako hříšník')]!\n\nTento spis může posloužit jako právní základ, na němž [recipient.GetFaith.GetAdjective] svět zpochybní mou způsobilost k vládě."
 religious_interaction.1001.a: "[Select_CString(actor.IsFemale, 'Kdyby nebyla mou lenní paní,', 'Kdyby nebyl mým lenním pánem,')] já bych..."
 religious_interaction.1001.a.revoke_tt: "[actor.GetTitledFirstName] může [Concept('revoke','odebrat')|E] jeden z mých titulů"
 religious_interaction.1010: "Je chvályhodné, že se snažíš odčinit své hříchy. Přijímám tvůj štědrý dar a na oplátku ti uděluji své požehnání."
 religious_interaction.1011: "Tvé prohřešky jsou příliš závažné na to, aby je vykoupilo pouhé zlato. Pokud chceš své hříchy skutečně odčinit, musíš změnit své chování a dokázat mi, že opravdu usiluješ o odpuštění. Teprve potom přijmu tvůj dar."
 religious_interaction.1020: "Donesly se ke mně znepokojivé zprávy o tvých prohřešcích. Přináší je [actor.GetTitledFirstName]."
 religious_interaction.1021: "Můžeš si říkat [actor.GetFaith.GetAdherentName|L], ale tvé činy dokazují, že se ve skutečnosti neřídíš cestou, kterou ukazuje [actor.GetFaith.HighGodName]. Nemohu dovolit, aby se tvé hanebné chování skrývalo za maskou [actor.GetFaith.GetAdjective|L] spravedlnosti, a proto mi nezbývá než tě z víry exkomunikovat. Ať se nad tvou duší [actor.GetFaith.HighGodName] smiluje."
 religious_interaction.1022: "To, co mi vyprávíš, mě velmi znepokojuje. [secondary_recipient.GetTitledFirstName] se podle tvých slov dopouští závažných prohřešků. Bolí mě to, ale souhlasím, že pro dobro [actor.GetFaith.GetAdjective] víry musí být [Select_CString(secondary_recipient.IsFemale, 'exkomunikována', 'exkomunikován')]."
 religious_interaction.1023: "Co tě to napadlo pokoušet se o exkomunikaci někoho, kdo stejně jako ty vyznává [actor.GetFaith.GetName]? [actor.GetFaith.GetAdjective] víra není nástrojem k získávání politických výhod! Můžeš mluvit o štěstí, že za takovou žádost neexkomunikuji i tebe."
 religious_interaction.1024: "Vidím, že svých hříchů skutečně lituješ a vynaložil jsi velké úsilí na své vykoupení. Tvé prohřešky proti [actor.GetFaith.GetAdjective] víře byly sice velmi závažné, ale tvé nedávné činy mě přesvědčily, že si zasloužíš další šanci.\n\nProto tímto ruším tvou exkomunikaci a vítám tě zpět mezi věřící [actor.GetFaith.GetName]."
 religious_interaction.1025: "Myslíš si snad, že lidi exkomunikuji lehkovážně? Že k nápravě stačí vlažná omluva? Pros, jak chceš, ale zpět mezi své souvěrce tě přijmu teprve tehdy, až dokážeš, že ses svého hanebného chování opravdu vzdal."
 religious_interaction.1030: "Po dlouhém rozjímání jsem dospěl k závěru, že tvá slova byla pravdivá a moudrá. Vstoupím do mnišského řádu a začnu nový život zasvěcený jedině službě, kterou ode mě žádá [actor.GetFaith.HighGodName]."
 religious_interaction.1031: "Tvůj návrh, abych od základu změnil celý svůj život a utekl do nějakého odlehlého kláštera, je směšný. Jsem spokojený tam, kde jsem, a nemám v úmyslu na tom cokoli měnit."
 religious_interaction.1000.positive: "Jsem rád, že [recipient.GetFirstNameNoTooltip] pochopil smysl mé žádosti."
 religious_interaction.1000.negative: "Velká škoda..."
 religious_interaction.1000.strong_negative: "K čertu!"
 religious_interaction.1024.positive: "Jsem rád, že [recipient.GetFirstNameNoTooltip] pochopil smysl tohoto kroku."
 religious_interaction.2002.desc: "Rozhodl jsem se následovat tě do světla. Mým novým vyznáním bude [ROOT.Char.GetFaith.GetName]!"
 religious_interaction.2002.a: "Požehnán buď [ROOT.Char.GetFaith.HighGodName]!"
 religious_interaction.2003.desc: "Má víra je příliš pevná, než aby ji zviklala tvá světská slova. Raději si počkám na odměnu, kterou mi přinese [recipient.GetFaith.DivineRealm]."
 religious_interaction.2003.hooking_out: "\n\nTaké ti připomínám, že mi něco dlužíš, a proto bys mě neměl pronásledovat jen za to, že jsem skutečný věřící."
 religious_interaction.2003.a: "Přál jsem si jen tvou spásu."
 religious_interaction.2003.b: "Dobrá, pak za to zaplatíš na tomto světě!"
 religious_interaction.2003.c: "Nemysli si, že ti tohle jen tak projde!"
 religious_interaction.2003.d: "Ale ano, ty budeš věřit přesně tomu, čemu ti řeknu."
 religious_interaction.2011.desc: "Rád bych se k tvému nadšení přidal, ale jen samotná obnova [recipient.GetFaith.HouseOfWorshipPlural] a obracení mých rolníků by stály celé jmění...\n\nPokud bys mi pomohl tyto výdaje uhradit, velmi rád se budu modlit tak, jak si přeje [ROOT.Char.GetFaith.HighGodName]."
 religious_interaction.2011.a: "Pro víru cokoli."
 religious_interaction.2011.b: "Za tvou věčnou spásu platit nebudu!"
 religious_interaction.2011.c: "Uděláš to za něco mnohem cennějšího než zlato."
 religious_interaction.2012.desc: "Vidím moudrost tvé víry, ale snad chápeš, jak dlouhá a klikatá je cesta z temnoty do světla.\n\nKdybys mi slíbil podporu ve všem, co budu potřebovat, možná by ta cesta byla snazší."
 religious_interaction.2012.a: "Souhlasím, pro dobro věřících všude na světě."
 religious_interaction.2012.b: "O tvou duši smlouvat nebudu!"
 religious_interaction.2012.c: "Nejdřív mi musíš splatit jiné dluhy."
 religious_interaction.2021.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 religious_interaction.2021.desc: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]\nNastal čas, abys mě následoval do světla. Vzhledem ke všemu, co mi dlužíš, požaduji, aby ses obrátil. Tvým novým vyznáním bude [actor.GetFaith.GetName]!"
 religious_interaction.2021.a: "Já... Dobrá, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('actor'))]."
 religious_interaction.2100.t: "[imprisoner.GetFaith.HighGodNamePossessive|U] soud"
 religious_interaction.2100.desc: "Po [ROOT.Char.GetFaith.HighGodName] ví jak dlouhé době strávené v temné cele mě ostré denní světlo oslepuje. Stráže mě vyvádějí z [imprisoner.Custom('FortifiedBuilding')] do divočiny a jejich chování je překvapivě vážné, téměř obřadné.\n\n"
 religious_interaction.2100.descwaterlogged: "Slunce jasně svítí, ale bažinatá půda pod mýma nohama čvachtá a vtahuje mi chodidla do bláta. Brzy spatřím, jak se ke mně [imprisoner.GetTitledFirstName] samolibě, ale poněkud opatrně blíží přes rozmáčenou zem v doprovodu několika [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.descpleasant: "Slunce jasně svítí a půda kolem mě je zdravá a bujně zarostlá. Brzy spatřím, jak se ke mně [imprisoner.GetTitledFirstName] blíží s náznakem nejistoty v doprovodu několika [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.descforest: "Slunce jasně svítí a jeho paprsky pronikají korunami stromů v mihotavých skvrnách. Brzy spatřím, jak si [imprisoner.GetTitledFirstName] razí cestu houštím v doprovodu několika [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.descoasis: "Slunce nemilosrdně praží na poušť a jeho paprsky se odrážejí od hladiny oázy. Brzy spatřím, jak se ke mně [imprisoner.GetTitledFirstName] brodí vodou v doprovodu několika [imprisoner.Custom('DefaultPriestTitlePlural')].\n\n"
 religious_interaction.2100.deschostile: "Jakmile spatřím [imprisoner.GetTitledFirstName] obklopeného tuctem [imprisoner.Custom('DefaultPriestTitlePlural')], účel naší malé výpravy je mi jasný.\n\n„[ROOT.Char.GetFullNameNoTooltip]. Necháme tě zde přivázaného ke kůlu a o tvém osudu rozhodne [imprisoner.GetFaith.HighGodName]. Jsi-li [Select_CString(ROOT.Char.IsFemale, 'nevinná', 'nevinný')], přežiješ. Jsi-li však [Select_CString(ROOT.Char.IsFemale, 'vinna', 'vinen')], zahyneš.“"
 religious_interaction.2100.middledefault: "„Za své prohřešky budeš [Select_CString(ROOT.Char.IsFemale, 'souzená', 'souzen')]. Rozsudek nad tebou vynese [imprisoner.GetFaith.HighGodName|U],“ pronese [imprisoner.GetTitledFirstName] hromovým hlasem. Stráže přistoupí a připoutají mi ruce i nohy ke kůlu. [imprisoner.Custom('DefaultPriestTitlePlural')|U] začnou s pažemi rozpřaženými zpívat žalozpěv. Poté všichni odejdou. Zůstávám [Select_CString(ROOT.Char.IsFemale, 'sama', 'sám')] a čeká se, že zemřu žízní."
 religious_interaction.2100.middleoasis: "„Za své prohřešky budeš [Select_CString(ROOT.Char.IsFemale, 'souzená', 'souzen')]. Rozsudek nad tebou vynese [imprisoner.GetFaith.HighGodName|U],“ pronese [imprisoner.GetTitledFirstName] hromovým hlasem. Stráže přistoupí a připoutají mi ruce i nohy ke kůlu, který stojí ve vodě oázy sahající mi až po hruď. [imprisoner.Custom('DefaultPriestTitlePlural')|U] začnou s pažemi rozpřaženými zpívat žalozpěv. Poté všichni odejdou. Zůstávám [Select_CString(ROOT.Char.IsFemale, 'sama', 'sám')] a čeká se, že zemřu žízní."
 religious_interaction.2100.endwaterlogged: "\n\nRozhlédnu se po promáčeném okolí."
 religious_interaction.2100.endpleasant: "\n\nRozhlédnu se po příjemném okolí."
 religious_interaction.2100.endforest: "\n\nRozhlédnu se po zeleni kolem sebe."
 religious_interaction.2100.endoasis: "\n\nPohlédnu dolů na vodu."
 religious_interaction.2100.a.believer: "[imprisoner.GetFaith.HighGodName|U] mě bude soudit spravedlivě!"
 religious_interaction.2100.a.unbeliever: "Vy mě tu #EMP necháte#?!"
 religious_interaction.2100.a.confused: "Ehm..."
 religious_interaction.2100.a.success: "Přežiješ zkoušku"
 religious_interaction.2100.a.failure: "Zahyneš pod žhnoucím sluncem"
 religious_interaction.2101.t: "[imprisoner.GetFaith.HighGodNamePossessive|U] milost"
 religious_interaction.2101.start.desc: "Vodu, potřebuji vodu! Hrdlo, hlava, kůže... všechno mě pálí!\n\nByl tu skutečně [ROOT.Char.GetFaith.DevilName] a smál se mému utrpení? Nabídl mi [ROOT.Char.GetFaith.WaterGodName] měch s vodou? [Select_CString(ROOT.Char.IsFemale, 'Pila', 'Pil')] jsem a [Select_CString(ROOT.Char.IsFemale, 'pila', 'pil')], ale žízeň nepolevovala."
 religious_interaction.2101.end.desc: "\n\nKdyž se [imprisoner.GetTitledFirstName] vrátí a někdo mi přitiskne k ústům měch s vodou, mlha v mé mysli se rozplyne. Na [imprisoner.GetTitleAsNameNoTooltip] je znát jisté zklamání, že mě nachází naživu, ale božská vůle promluvila."
 religious_interaction.2101.desc.pleasant: "Dny strávené [Select_CString(ROOT.Char.IsFemale, 'připoutaná', 'připoutaný')] venku jsem si téměř #EMP [Select_CString(ROOT.Char.IsFemale, 'užívala', 'užíval')]#!. Ptáci zpívali, slunce mi hřálo kůži a občasný déšť mě osvěžoval a hasil mou žízeň.\n\nKdyž se [imprisoner.GetTitledFirstName] vrátí, má očividně vztek, že jsem [Select_CString(ROOT.Char.IsFemale, 'čilá', 'čilý')] a v dobré náladě. Podmínky však byly stanoveny jasně a nelze před nimi uniknout: božská vůle promluvila!"
 religious_interaction.2101.desc.oasis: "Dny strávené [Select_CString(ROOT.Char.IsFemale, 'zavěšená', 'zavěšený')] v chladivé vodě oázy jsem si téměř #EMP [Select_CString(ROOT.Char.IsFemale, 'užívala', 'užíval')]#!. Slunce sice nemilosrdně pražilo, ale provazy byly natolik volné, že jsem se [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] sklonit a dosyta se napít.\n\nKdyž se [imprisoner.GetTitledFirstName] vrátí, má očividně vztek, že mě nachází v dobrém zdraví. Podmínky však byly stanoveny jasně a nelze před nimi uniknout: božská vůle promluvila!"
 religious_interaction.2101.a: "Jsem [Select_CString(ROOT.Char.IsFemale, 'nevinná', 'nevinný')]!"
 religious_interaction.2102.desc: "Posledního večera zkoušky, kterou podstupuje [prisoner.GetTitledFirstName], jej nacházíme v bezvědomí, ale stále dýchá.\n\n„Je to zázrak!“ prohlásí [ROOT.Char.Custom('DefaultPriestTitle')] a pozvedne ruce k nebi. „[ROOT.Char.GetFaith.HighGodName|U] promluvil! [prisoner.GetTitledFirstName] je [Select_CString(prisoner.IsFemale, 'nevinná', 'nevinný')]!“"
 religious_interaction.2102.oasis: "Když se blížím k místu zkoušky, brodím se vodami oázy. [prisoner.GetTitledFirstName] je stále připoután ke kůlu, ale nacházíme jej nejen při vědomí, nýbrž dokonce zcela zdravého.\n\n„Je to zázrak!“ prohlásí [ROOT.Char.Custom('DefaultPriestTitle')] a pozvedne ruce k nebi. „[ROOT.Char.GetFaith.HighGodName|U] promluvil! [prisoner.GetTitledFirstName] je [Select_CString(prisoner.IsFemale, 'nevinná', 'nevinný')]!“\n\nZatínám zuby frustrací, zatímco [ROOT.Char.Custom('DefaultPriestTitlePlural')] odvazují [prisoner.GetFirstNameNoTooltip]. Proč jsme [Select_CString(prisoner.IsFemale, 'ji', 'ho')] museli nechat zrovna #EMP tady#!?!"
 religious_interaction.2102.pleasant: "Když se blížím k místu zkoušky, nacházíme [prisoner.GetTitledFirstName] nejen při vědomí, ale dokonce téměř #EMP s úsměvem na tváři#!.\n\n„Je to zázrak!“ prohlásí [ROOT.Char.Custom('DefaultPriestTitle')] a pozvedne ruce k nebi. „[ROOT.Char.GetFaith.HighGodName|U] promluvil! [prisoner.GetTitledFirstName] je [Select_CString(prisoner.IsFemale, 'nevinná', 'nevinný')]!“\n\nZatínám zuby frustrací, zatímco [ROOT.Char.Custom('DefaultPriestTitlePlural')] odvazují [prisoner.GetFirstNameNoTooltip]. Proč jsme [Select_CString(prisoner.IsFemale, 'ji', 'ho')] museli nechat zrovna #EMP tady#!?!"
 religious_interaction.2102.a: "Je to vůle, kterou projevil [ROOT.Char.GetFaith.HighGodName|U]."
 religious_interaction.2102.b: "Mně připadá [prisoner.GetTitledFirstName] docela [Select_CString(prisoner.IsFemale, 'mrtvá', 'mrtvý')]..."
 religious_interaction.2102.b.tt: "[ROOT.Char.GetFaith.HighGodName|U] se #EMP vždycky#! nemůže mít pravdu!"
 religious_interaction.2102.b.success: "Tvůj zásah zůstane neodhalen"
 religious_interaction.2102.b.failure: "Vyjde najevo, že jsi [Select_CString(ROOT.Char.IsFemale, 'vražedkyně', 'vrah')]"
 religious_interaction.2103.t: "[imprisoner.GetFaith.HighGodNamePossessive|U] hněv"
 religious_interaction.2103.end.desc: "\n\nPokud si [ROOT.Char.GetFaith.HighGodName] toto přeje, možná si to zasloužím. Možná jsem... [Select_CString(ROOT.Char.IsFemale, 'zlá', 'zlý')]."
 religious_interaction.2103.desc.pleasant: "[Select_CString(ROOT.Char.IsFemale, 'Byla jsem si tak jistá', 'Byl jsem si tak jistý')], tak pošetilý. Teď už chápu, že tak dlouhý pobyt pod širým nebem zlomí každého člověka. Přes den na mě praží slunce, v noci do mě burácí vítr a obloha zůstává děsivě a nemilosrdně bez jediného mráčku.\n\nVoda, voda. Je všude kolem mě, uzamčená v náruči přírody, ale ani kapka není na dosah. Hlava mi bezvládně klesá."
 religious_interaction.2103.desc.waterlogged: "Vítr do mě sice buší a slunce mi spaluje kůži, ale alespoň mě osvěžuje neustálý déšť z mraků, které tuto krajinu tak vydatně zalévají. Když začíná další liják, usměji se k nebi.\n\nNáhle se svět začne naklánět. Zpočátku téměř neznatelně, pak stále rychleji. Až po chvíli mi dochází, že se můj kůl převážil a padá přímo do tůně přede mnou!\n\nJakmile dopadnu do vody, začnu sebou zběsile zmítat ve snaze uniknout, ale je to marné. Všechny končetiny mám svázané a váha kůlu mě tlačí stále hlouběji do mělké tůně. Křičím, ale nevydám ani hlásku a voda mi vniká do úst."
 religious_interaction.2103.desc.oasis: "Během zkoušky mi na kůži nemilosrdně praží slunce. Alespoň mě osvěžuje voda oázy, která mi sahá až k hrudi, zatímco zůstávám připoutaný ke kůlu.\n\nNáhle se svět začne naklánět. Zpočátku téměř neznatelně, pak stále rychleji. Až po chvíli mi dochází, že měkký písek pod kůlem povolil a já padám přímo do oázy přede mnou!\n\nJakmile dopadnu do vody, začnu sebou zběsile zmítat ve snaze uniknout, ale je to marné. Všechny končetiny mám svázané a váha kůlu mě tlačí stále hlouběji pod hladinu. Křičím, ale nevydám ani hlásku a voda mi vniká do úst."
 religious_interaction.2103.a: "Já... jsem tak [Select_CString(ROOT.Char.IsFemale, 'unavená', 'unavený')]..."
 religious_interaction.2103.b: "#DIE1 Bl-#! #DIE2 blub...#!"
 religious_interaction.2104.desc: "Posledního večera zkoušky, kterou podstupuje [prisoner.GetTitledFirstName], se při našem příchodu nic nehýbe. Jeden ze sluhů přiloží měch s vodou k vyprahlým rtům, ale voda jen bez odezvy stéká po bradě.\n\n„[ROOT.Char.GetFaith.HighGodName|U] promluvil!“ prohlásí [ROOT.Char.Custom('DefaultPriestTitle')] a pozvedne ruce k nebi. „[prisoner.GetTitledFirstName] je [Select_CString(prisoner.IsFemale, 'vinna', 'vinen')]!“"
 religious_interaction.2104.desc.drowned: "Když se blížíme k místu, kde jsme nechali [prisoner.GetTitledFirstName] připoutaného ke kůlu, rychle je jasné, že se něco pokazilo. Kůl se zřejmě převážil dopředu přímo do tůně vedle místa zkoušky. Provazy kolem končetin svou práci očividně odvedly až příliš dobře a pod vahou kůlu neměl [prisoner.GetTitledFirstName] žádnou šanci.\n\n„[ROOT.Char.GetFaith.HighGodName|U] promluvil!“ prohlásí [ROOT.Char.Custom('DefaultPriestTitle')] a pozvedne ruce k nebi. „[prisoner.GetTitledFirstName] je [Select_CString(prisoner.IsFemale, 'vinna', 'vinen')]!“"
 religious_interaction.2104.desc.oasisdrowned: "Když se blížíme k místu, kde jsme nechali [prisoner.GetTitledFirstName] připoutaného ke kůlu, rychle je jasné, že se něco pokazilo. Kůl se zřejmě převážil dopředu přímo do oázy vedle místa zkoušky. Provazy kolem končetin svou práci očividně odvedly až příliš dobře a pod vahou kůlu neměl [prisoner.GetTitledFirstName] žádnou šanci.\n\n„[ROOT.Char.GetFaith.HighGodName|U] promluvil!“ prohlásí [ROOT.Char.Custom('DefaultPriestTitle')] a pozvedne ruce k nebi. „[prisoner.GetTitledFirstName] je [Select_CString(prisoner.IsFemale, 'vinna', 'vinen')]!“"
 religious_interaction.2104.b.drowned: "No, asi se na to dá dívat i takhle..."
 religious_interaction.2400.t: "Velká disputace"
 religious_interaction.2400.desc: "Páže se třese strachy, když mi předčítá plamenný dopis, který posílá [actor.GetTitledFirstName]. Vyzývá mě v něm k veřejné disputaci o ctnostech a nectnostech naší společné víry. Tou je [recipient.GetFaith.GetNameNoTooltip|L], a v dopise dokonce zpochybňuje, zda se držím jejích základních zásad.\n\nMůj sluha při čtení koktá a tón dopisu nenechává nikoho na pochybách o tom, co si o mé zbožnosti myslí [actor.GetShortUINameNoTooltip]."
 religious_interaction.2400.a: "Ta bestie! Výzvu přijímám!"
 religious_interaction.2400.a.tt_success: "Ve veřejné disputaci utrpí [actor.GetShortUINameNoTooltip] ponížení"
 religious_interaction.2400.a.tt_fail: "[actor.GetShortUINameNoTooltip] úspěšně zpochybní mou víru"
 religious_interaction.2400.b: "Tahle fraška nestojí za to. [recipient.GetFaith.HighGodName] do ní nepatří."
 religious_interaction.2400.b.tt: "[actor.GetShortUINameNoTooltip] dostane zprávu"
 religious_interaction.2400.b_turned_down: "[recipient.GetShortUIName|U] mou výzvu k disputaci odmítá"
 used_literalist_debate_modifier: "Nedávná disputace"
 used_literalist_debate_modifier_desc: "Nedávno tato postava zahájila disputaci o základních zásadách své víry."
 literally_debated_modifier: "Nedávná disputace"
 literally_debated_modifier_desc: "Nedávno tato postava vedla disputaci o základních zásadách své víry."
 religious_interaction.2401.desc_intro: "Dějištěm naší disputace je [debate_locale.GetNameNoTierNoTooltip]. Ve velkém sále stojíme na vratkých stolech jen pár stop od sebe a kolem nás se tísní dav dychtivých přihlížejících. Shromáždění postupně ztichne a všichni čekají, až disputace začne.\n\n"
 religious_interaction.2401.desc_won: "Během jediné hodiny je naprosto jasné, že [recipient.GetTitledFirstName] v disputaci nestačí. Napadám zbožnost i smysl pro ctnost a nakonec prohlašuji: „[actor.GetFaith.HighGodName] pro tebe očividně nic neznamená!“ Dav je nemilosrdný. [recipient.GetTitledFirstNameNoTooltip] se stává terčem shnilých vajec a plesnivého zelí a nakonec prchá ze sálu."
 religious_interaction.2401.desc_lost: "Slovní smršť spustí [recipient.GetTitledFirstName] okamžitě a sotva mi dává příležitost odpovědět. Netrvá dlouho a dav už má o vítězi jasno.\n\nJeště několik minut se nevzdávám a statečně čelím dešti hnijící zeleniny, ale nakonec musím ustoupit, když mi jeden z rolníků mrští na hlavu živé kuře."
 religious_interaction.2401.a_won: "[actor.GetFaith.HighGodName] mě snad nemiluje?"
 religious_interaction.2401.a_lost: "Tihle lidé vůbec nechápou, co znamená [actor.GetFaith.GetReligion.GetNameNoTooltip|L]!"
 religious_interaction.2402.desc_won: "Přestože mě [actor.GetTitledFirstName] vyzývá k disputaci s naprostou sebejistotou, mé drtivé argumenty a zbožná kritika tuto jistotu rychle rozmetají. Brzy se přidá i dav a [actor.GetTitledFirstNameNoTooltip] ustupuje pod krupobitím plesnivé zeleniny a jednoho obzvlášť agresivního kohouta."
 religious_interaction.2402.desc_lost: "Ať se snažím sebevíc, [actor.GetTitledFirstName] přichází s dokonale připravenými argumenty a téměř okamžitě si získává dav. Pak mě ještě více než hodinu nepřetržitě peskuje, připisuje mi všechny možné neřesti a dokonce se ptá: „Opravdu pro tebe [recipient.GetFaith.HighGodName] něco znamená?“\n\nNakonec prchám a dav mě při ústupu zasypává shnilými plodinami."
 religious_interaction.2403.desc: "[victim.GetTitledFirstName] nemá sebemenší šanci. Přes veškerou domnělou přípravu smetu každý chabý argument jako obtížnou mouchu. S každou mou námitkou [victim.GetFirstNameNoTooltip] sebou trhne, jako by právě přišel úder. Čím déle disputace trvá, tím méně se [victim.GetFirstNameNoTooltip] dokáže hájit, až nakonec ztichne i dav.\n\n„...a právě proto,“ říkám a dramaticky pozvednu ruku s obviňujícím prstem namířeným přes celý sál, „ty nikdy...“\nZarazím se, když si všimnu, že [victim.GetFirstNameNoTooltip] lapá po dechu a svírá se za"
 religious_interaction.2403.conclusion_either: "hruď."
 religious_interaction.2403.conclusion_man: "paži."
 religious_interaction.2403.conclusion_woman: "břicho."
 religious_interaction.2403.a.low_compassion: "„Tak zbaběle utíkáš, jak vidím.“"
 religious_interaction.2403.a.zealous: "„[ROOT.Char.GetFaith.PantheonTerm|U] [ROOT.Char.GetFaith.PantheonTermHasHave] o vítězi jasno.“"
 religious_interaction.2403.a.stubborn: "„Hej, ještě jsem [Select_CString(ROOT.Char.IsFemale, 'neskončila', 'neskončil')]!“"
 religious_interaction.2403.a: "„Jsi... jsi v pořádku?“"
 religious_interaction.2403.a.tt: "[victim.GetShortUIName] utrpí srdeční záchvat a [character_death_dies|El]"
 religious_interaction.2500.desc: "To, že ti konečně došlo, jak se věci mají... To musí být znamení! [ROOT.Char.GetFaith.HighGodNameAlternate] tě očividně vede správným směrem. Dveře k pravé víře jsou ti otevřené."
 religious_interaction.2500.a: "Sláva! [ROOT.Char.GetFaith.HighGodName] si zaslouží veškerou chválu!"
 religious_interaction.2501.desc: "Snad žertuješ? [recipient.GetFaith.HighGodName] se tvými průhlednými pokusy o politický únik nenechá obměkčit!"
 religious_interaction.2600.t: "Lekce milosti"
 religious_interaction.2600.desc.recipient: "[actor.GetTitledFirstName|U] mě jemně vezme za ruku a vede mě k pestré sbírce ostrých i tupých předmětů, které budeme při dnešním sezení používat. Jedna z čepelí zachytí světlo a zaplaví mě pocit klidu.\n\nS nástrojem v ruce dávám znamení k otočení. [actor.GetTitledFirstName] si vyhrne košili a odhalí nedotčenou kůži na zádech. Dávám se do práce a tiché sténání a skřeky se brzy promění v hluboké broukání vycházející z hrdla.\n\nUž vím, kterým nástrojem zušlechtím vlastní milost."
 religious_interaction.2600.desc.actor: "[recipient.GetTitledFirstName|U] si pozorně prohlíží nástroje povznesení a očekáváním se sotva znatelně chvěje.\n\nChytím natažené zápěstí, vložím do dlaně ostrou čepel a jemně ji přitisknu ke své hrudi. „Jen zlehka, ano? Ruku pevně. Pohybujeme se tu na tenké hranici.“\n\n[recipient.GetFirstNameNoTooltip] se mi podívá do očí a přikývne, pak si začne rozepínat vlastní košili a odhalí kousek čisté kůže bez jediné jizvy, na niž brzy sestoupí milost, kterou uděluje [recipient.GetFaith.HighGodName]."
 religious_interaction.2600.a: "„Povznesme se společně.“"
 religious_interaction.2610.desc: "Bohužel se tentokrát musím věnovat několika důležitým záležitostem... příště však budeme uctívat s ještě větším zápalem!"
 religious_interaction.2610.a: "Jaká škoda."
 attempted_transcendence_together_opinion: "Společný pokus o povznesení"
