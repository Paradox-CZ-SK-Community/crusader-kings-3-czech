 rite_growth.0010.desc.divergence.major: "Stoupenci jej znají jako [new_rite.GetName]. Většině věřících, kteří následují [source_rite.GetAdjective] ritus, připadají jeho zvyklosti téměř kacířské, "
 rite_growth.0010.desc.differing.tenet: "přičemž nejvýraznější odchylkou je zásada [differing_tenet.GetBaseName]."
 rite_growth.0010.desc.differing.doctrine: "přičemž nejvýraznější odchylkou je doktrína [differing_doctrine.GetDescriptiveName]."
 rite_growth.0010.desc.differing.fallback: "ale rozdíl v nauce je příliš jemný, než aby se dal snadno pojmenovat."
 rite_growth.0010.desc.outro.wildfire: "\n\nToto nové učení se rychle šíří mezi [origin_faith.Custom('CZ_Adjective_yymi')] věřícími."
 rite_growth.0010.a: "Má duše je v bezpečí, dokud následuji ritus [ROOT.Char.GetRite.GetNameNoTooltip]."
