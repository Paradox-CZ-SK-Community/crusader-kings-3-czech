l_polish:
 rite_growth.0010.t: "Nový [origin_faith.GetReligion.Custom('CZ_Adjective_yy')] ritus"
 rite_growth.0010.desc.intro.relation: "V čele nově založeného ritu stojí [Select_CString(founder.IsFemale,'tvá','tvůj')] [GetPlayer.Custom2('RelationToMeShort', founder.Self)] [founder.GetFirstName], "
 rite_growth.0010.desc.intro.descriptor_archbishop: "V čele nově založeného ritu stojí [Select_CString(founder.IsFemale,founder.GetCulture.Custom('CZ_Adjective_aa'),founder.GetCulture.Custom('CZ_Adjective_yy'))] [Select_CString(founder.IsFemale,'arcibiskupka','arcibiskup')] [founder.GetFirstName], "
