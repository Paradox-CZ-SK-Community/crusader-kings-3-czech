 rite_growth.0010.desc.opener.lands: "[Select_CString(founder.IsFemale,'jejíž','jehož')] vládě podléhají země panství [founder.GetPrimaryTitle.GetBaseNameNoTier].\n\n"
 rite_growth.0010.desc.divergence.minor: "Stoupenci jej znají jako [new_rite.GetName] a nový ritus se jen mírně liší od původního, jímž je [source_rite.GetAdjective] ritus, "
