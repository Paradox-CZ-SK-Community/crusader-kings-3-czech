l_polish:
 abduct_event_title: "Únos:"
 do_not_execute_abduct_tooltip: "O únos se nepokusím"
 abduct_outcome.1001.t: "$abduct_event_title$ Přepadení na cestě"
 abduct_outcome.1001.opening: "Mí spolčenci mi hlásí, že [target.GetTitledFirstName] právě cestuje."
 abduct_outcome.1001.arrival: "Cesta vede mezi místy [departure.GetNameNoTooltip] a [arrival.GetNameNoTooltip]."
 abduct_outcome.1001.no_arrival: "Celá cesta se odehrává na území [departure.GetNameNoTooltip]."
 abduct_outcome.1001.ending: "\n\nNěkolik lapků dostalo za úkol tuto malou cestu přerušit a postarat se, aby [target.GetTitledFirstName] místo původního cíle skončil[Select_CString(target.IsFemale, 'a', '')] tady."
 abduct_outcome.1001.a: "Brzy mi bude [target.GetTitledFirstName] vydán[Select_CString(target.IsFemale, 'a', '')] na milost!"
 abduct_outcome.1001.b: "Ne, riziko je příliš veliké."
 abduct_outcome.1002.t: "$abduct_event_title$ Na cestě"
 abduct_outcome.1002.desc: "Naskytla se dokonalá příležitost! [target.GetTitledFirstName] cestuje mezi místy [departure.GetNameNoTooltip] a [arrival.GetNameNoTooltip] téměř bez stráží.\n\nZřejmě si myslí, že je v bezpečí..."
 abduct_outcome.1002.a: "Dokonalá chvíle udeřit!"
 abduct_outcome.1003.t: "$abduct_event_title$ Nevítaní hosté"
 abduct_outcome.1003.desc: "Mí spolčenci se mohou volně pohybovat u dvora v [court_location.GetNameNoTierNoTooltip], takže [target.GetTitledFirstName] je na dosah!\n\nJsou připraveni uprostřed noci vpustit dovnitř malou skupinku lidí a při odchodu zahladit jejich stopy. V ideálním případě i ztlumit křik kopajícího pytle z pytloviny."
 abduct_outcome.1003.a: "Tenhle plán se mi líbí!"
 abduct_outcome.2001.desc: "Úspěch! Lapkové odvedli svou práci obdivuhodně a [target.GetTitledFirstName] je bezpečně v mých rukou."
 abduct_outcome.2001.a: "Doufám, že se [target.GetTitledFirstName] bude nové ubytování líbit..."
 abduct_outcome.2002.desc: "Než si [target.GetTitledFirstName] vůbec uvědomil[Select_CString(target.IsFemale, 'a', '')], co se děje, mí spolčenci už [Select_CString(target.IsFemale, 'ji', 'ho')] měli! Konečně je [target.GetTitledFirstName] v mých rukou."
 abduct_outcome.2003.desc: "Nemohu uvěřit, že to vyšlo! Stačilo uprostřed noci vpustit několik mých spojenců do sídla, kde pobývá [target.GetTitledFirstName].\n\nTeď se bezpochyby vzteká nad mizerným zabezpečením. Tam, kde je nyní, je naštěstí mnohem lepší."
 abduct_outcome.4001.opening: "K čertu! [target.GetTitledFirstName] unikl[Select_CString(target.IsFemale, 'a', '')] mým najatým lapkům a bezpečně se dostal[Select_CString(target.IsFemale, 'a', '')] zpět do [departure.GetBaronyNameExplicitly]."
 abduct_outcome.4001.owner_discovered: "\n\nA co hůř, jednoho z lapků později dopadli a přiznal úplně všechno, včetně mého zapojení!"
 abduct_outcome.4001.owner_secret: "\n\nAlespoň se nikdo nikdy nedozví, že lapkové pracovali pro mě."
 abduct_outcome.4001.a: "Najdu jiný způsob, jak se s [target.GetTitledFirstName] vypořádat."
 abduct_outcome.4001.b: "Štěstí [target.GetTitledFirstName] nebude trvat věčně. Je čas to zkusit znovu!"
 abduct_outcome.4002.opening: "Jak se to mohlo stát?! Mí spolčenci čekali ve správný čas na správném místě, ale [target.GetTitledFirstName] se vůbec neukázal[Select_CString(target.IsFemale, 'a', '')]!"
 abduct_outcome.4002.owner_discovered: "\n\n[target.GetTitledFirstName|U] se zřejmě dozvěděl[Select_CString(target.IsFemale, 'a', '')], že něco plánuji!"
 abduct_outcome.4002.owner_secret: "\n\n[target.GetTitledFirstName|U] musel[Select_CString(target.IsFemale, 'a', '')] něco zaslechnout, ale alespoň mé zapojení nikdy neodhalí."
 abduct_outcome.4003.opening: "Ne! Mé spojence odhalili při pokusu vniknout do komnat, které obývá [target.GetTitledFirstName]. Mělo mi být jasné, že to nebude tak snadné."
 abduct_outcome.4003.owner_discovered: "\n\nA co hůř, přiznali se a prozradili i mou účast na celé intrice!"
 abduct_outcome.4003.owner_secret: "\n\nNějakým zázrakem se mým spojencům podařilo uniknout a mé zapojení zůstává tajemstvím."
 abduct_outcome.5001.t: "[Select_CString(ROOT.Char.IsFemale, 'Unesena!', 'Unesen!')]"
 abduct_outcome.5001.opening: "[owner.Custom2('MyCharacterIntroduction', ROOT.Char)] mě [Select_CString(owner.IsFemale, 'unesla', 'unesl')]!"
 abduct_outcome.5001.seized_roadside: "\n\nNa cestě mě i mou družinu přepadli lapkové. Nevím, co se stalo s ostatními, protože mi přes hlavu přetáhli pytel. Když ho konečně sundali, zjistil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že mě vězní v [prison_location.GetBaronyNameExplicitly]."
 abduct_outcome.5001.on_the_way: "\n\nCestou do města mě doprovázela jen hrstka stráží a [owner.GetTitledFirstName] přesně [Select_CString(owner.IsFemale, 'věděla', 'věděl')], kdy udeřit - v mé nejzranitelnější chvíli!"
 abduct_outcome.5001.unwelcome_guests: "\n\nUprostřed noci do mých komnat vtrhla skupina cizinců. Zrádci je museli pustit dovnitř a mně se zdálo, že je se mnou konec. Místo toho mi však přetáhli přes hlavu pytel a odvlekli mě pryč. Spoutali mě a přivedli sem, do tohoto vlhkého žaláře."
 abduct_outcome.5001.a: "Jen počkejte, až se odsud dostanu!"
 abduct_outcome.5002.t: "Únos zmařen!"
 abduct_outcome.5002.seized_roadside: "Když jsem [Select_CString(ROOT.Char.IsFemale, 'cestovala', 'cestoval')] v [departure.GetBaronyNameExplicitly], přepadla nás skupina banditů.\n\nPodařilo se mi ujet do bezpečí a bylo zřejmé, že mi nechtěli ublížit. Snažili se mě zajmout živého[Select_CString(ROOT.Char.IsFemale, 'u', '')]!"
 abduct_outcome.5002.on_the_way: "Cestou do města mě doprovázela jen hrstka stráží, když udeřili.\n\nMé stráže naštěstí zareagovaly rychle a odvážně a zanedlouho jsem byl[Select_CString(ROOT.Char.IsFemale, 'a', '')] zpět v [target.Custom('ResidenceBuilding')]."
 abduct_outcome.5002.unwelcome_guests: "Uprostřed noci mě probudil rozruch. Někdo vpustil skupinu hrdlořezů do místa, kde sídlím, a odhaleni byli až přede dveřmi mých komnat!"
 abduct_outcome.5002.fallback: "Unikl[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem pokusu o únos!"
 abduct_outcome.5002.owner_known: "\n\nZa tím nemůže stát nikdo jiný než [owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))]!"
 abduct_outcome.5002.owner_not_known: "\n\nNevím, kdo za tímto pokusem o únos stojí, ale hrozba stále nepominula..."
 abduct_outcome.5002.a: "Za to mi [owner.GetTitledFirstName] zaplatí!"
 abduct_outcome.5002.b: "Musím se mít na pozoru."
