l_polish:
 befriend_ongoing_dislike.0001.t: "Spřátelení: Dar pro získání přízně"
 befriend_ongoing_dislike.0001.desc: "Chci, aby si mě [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] oblíbil[Select_CString(target.IsFemale, 'a', '')] víc. A kdo by neměl rád dárky?"
 befriend_ongoing_dislike.0001.a: "Tímhle [target.GetTitledFirstName] pořádně ohromím!"
 befriend_ongoing_dislike.0001.b: "Vzhledem k našemu vztahu bude rozumnější držet se zpátky."
 befriend_ongoing_dislike.0001.c: "Dárkem si přízeň nezískám."
 befriend_ongoing_dislike.0002.t: "Spřátelení: Tváří v tvář nevraživosti"
 befriend_ongoing_dislike.0002.desc: "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] stále odmítá mé pokusy o sblížení.\n\n[target.GetTitledFirstName|U] dal[Select_CString(target.IsFemale, 'a', '')] jasně najevo, že si mě nikdy nebude vážit. Ani o trochu víc než nějaké žížaly."
 befriend_ongoing_dislike.0002.a: "Tohle nebude snadné..."
 befriend_ongoing_dislike.0003.t: "Spřátelení: Vytrvalost se vyplácí"
 befriend_ongoing_dislike.0003.desc: "Zdá se, že všechny dopisy a dárky, o jejichž doručení jsem se obával[Select_CString(ROOT.Char.IsFemale, 'a', '')], nakonec dorazily k [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], protože jsem se konečně dočkal[Select_CString(ROOT.Char.IsFemale, 'a', '')] odpovědi!\n\nBohužel jen proto, aby mi [target.GetTitledFirstName] sdělil[Select_CString(target.IsFemale, 'a', '')], že [Select_CString(target.IsFemale, 'ji', 'ho')] má vytrvalost obtěžuje."
 befriend_ongoing_dislike.0003.a: "Alespoň ve mně nepřehlédne!"
 befriend_ongoing_dislike.0004.t: "Spřátelení: Zpět odesílateli"
 befriend_ongoing_dislike.0004.desc: "Zdá se, že několik přátelských dopisů, které jsem poslal[Select_CString(ROOT.Char.IsFemale, 'a', '')] [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], se mi vrátilo s poslem - neotevřených.\n\nJak může [target.GetTitledFirstName] nechápat, že se jen snažím dát věci do pořádku?"
 befriend_ongoing_dislike.0004.a: "Chci jen, aby si mě [target.GetTitledFirstName] oblíbil[Select_CString(target.IsFemale, 'a', '')]."
 befriend_ongoing_dislike.0004.b: "Mé poselství přednese herold osobně!"
 befriend_ongoing_dislike.0005.t: "Spřátelení: Ledy tají"
 befriend_ongoing_dislike.0005.desc: "Mé pokusy získat si přízeň [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] rozhodně nebyly bez překážek, ale poslové mi hlásí, že mé dopisy už nejsou přijímány se stejným otráveným bručením.\n\nNa tváři [target.GetTitledFirstName] se teď občas objeví něco, co by snad mohlo být... zájmem."
 befriend_ongoing_dislike.0005.a: "Ha, ještě si [target.GetTitledFirstName] získám!"
 befriend_ongoing_dislike.2001.t: "Spřátelení: Bez pozvání"
 befriend_ongoing_dislike.2001.desc: "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] je znám[Select_CString(target.IsFemale, 'á', 'ý')] svou družností a přátelskou povahou a rád[Select_CString(target.IsFemale, 'a', '')] hoduje a slaví s ostatními.\n\nPřesto mě [target.GetTitledFirstName] nepozval[Select_CString(target.IsFemale, 'a', '')] na svou poslední hostinu v sídle jednoho barona, přestože se koná docela blízko mých zemí a já bych byl[Select_CString(ROOT.Char.IsFemale, 'a', '')] zcela přirozeným hostem!"
 befriend_ongoing_dislike.2001.a: "To je těžká urážka!"
 befriend_ongoing_dislike.2001.b: "Promarněná příležitost, ale nesmím v tom hledat víc, než tam je."
 befriend_ongoing_dislike.2002.t: "Spřátelení: Příliš blízko"
 befriend_ongoing_dislike.2002.desc: "Je všeobecně známo, že [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] je značně plach[Select_CString(target.IsFemale, 'á', 'ý')] a málokdy tráví s lidmi více času, než považuje za nezbytné.\n\nTeď [target.GetTitledFirstName] přestal[Select_CString(target.IsFemale, 'a', '')] odpovídat na mé zprávy a já nevím, jak dál."
 befriend_ongoing_dislike.2002.a: "Musím [Select_CString(target.IsFemale, 'jí', 'mu')] dát čas."
 befriend_ongoing_dislike.2002.b: "Postarám se, aby o mně [target.GetTitledFirstName] ještě hodně slyšel[Select_CString(target.IsFemale, 'a', '')]!"
 befriend_ongoing_dislike.5001.t: "Spřátelení: Cynik a horlivec"
 befriend_ongoing_dislike.5001.desc: "Mé snahy zmírnit napětí mezi mnou a [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] maří nesmyslné pohoršení nad mou údajně nedostatečnou zbožností.\n\nPřes všechny své výčitky mi však [target.GetTitledFirstName] stále nedokázal[Select_CString(target.IsFemale, 'a', '')] vysvětlit, proč bych měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] svou zbožnost prohlubovat. [ROOT.GetCharacter.GetFaith.HighGodName] už přece mou úctu má."
 befriend_ongoing_dislike.5001.a: "Asi bych mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] [ROOT.Char.GetFaith.HouseOfWorship] navštěvovat častěji."
 befriend_ongoing_dislike.5001.b: "Nějak se s tím budeme muset vyrovnat."
 befriend_ongoing_dislike.5001.c: "Koho vůbec zajímá, že mám pochybnosti!"
 befriend_ongoing_dislike.5002.t: "Spřátelení: Důvěra a nedůvěra"
 befriend_ongoing_dislike.5002.desc: "Získat si přízeň [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] by bylo mnohem snazší, kdyby [target.GetTitledFirstName] alespoň věřil[Select_CString(target.IsFemale, 'a', '')], že to myslím upřímně! Místo toho se mi posmívá a přemýšlí, co se svou laskavostí snažím získat."
 befriend_ongoing_dislike.5002.a: "Budu vytrval[Select_CString(ROOT.Char.IsFemale, 'á', 'ý')], ale nebudu lhát o tom, kdo jsem."
 befriend_ongoing_dislike.5002.b: "Ehm, ano, možná se opravdu snažím něco získat..."
 befriend_ongoing_dislike.5003.t: "Spřátelení: Skleslost"
 befriend_ongoing_dislike.5003.desc: "Chci jen, aby [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] poznal[Select_CString(target.IsFemale, 'a', '')], jakou radost může přinášet společnost druhých! Jenže [target.GetTitledFirstName] se stále drží stranou a svůj pokoj opouští jen tehdy, když je to naprosto nezbytné."
 befriend_ongoing_dislike.5003.a: "[target.GetTitledFirstName|U] by se z toho už měl[Select_CString(target.IsFemale, 'a', '')] dostat!"
 befriend_ongoing_dislike.5003.b: "Pokud [target.GetTitledFirstName] potřebuje prostor, dopřeji [Select_CString(target.IsFemale, 'jí', 'mu')] ho."
 befriend_ongoing_dislike.5004.t: "Spřátelení: Velkolepý dar zklamal"
 befriend_ongoing_dislike.5004.desc: "Chtěl[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] ukázat své dobré úmysly, a tak jsem nechal[Select_CString(ROOT.Char.IsFemale, 'a', '')] připravit velkolepou hostinu a poslat ji tam, kde [target.GetTitledFirstName] sídlí. Teď se však doslýchám, že z ní údajně neochutnal[Select_CString(target.IsFemale, 'a', '')] ani sousto!\n\n Nejdřív jsem si myslel[Select_CString(ROOT.Char.IsFemale, 'a', '')], že se něco stalo, ale očividně ne každý miluje hory jídla tolik jako já."
 befriend_ongoing_dislike.5004.a: "Za svou přehnanost se omluvím."
 befriend_ongoing_dislike.5004.b: "Tak ať se tedy dívá, jak všechno to jídlo shnije."
 befriend_ongoing_dislike.5005.t: "Spřátelení: Výzva k činu"
 befriend_ongoing_dislike.5005.desc: "Snažím se, aby mi [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] lépe rozuměl[Select_CString(target.IsFemale, 'a', '')], ale výsledkem je jen to, že já rozumím [target.GetTitledFirstName] čím dál méně. Kde je nějaký zápal, nějaká ctižádost? Zdá se, jako by [Select_CString(target.IsFemale, 'jí', 'mu')] vůbec nevadilo, kdyby všechno zůstalo přesně tak, jak je."
 befriend_ongoing_dislike.5005.a: "Prozatím se s tím tedy zkusím smířit."
 befriend_ongoing_dislike.5005.b: "Stojí vůbec za to takového člověka poznávat?"
 befriend_ongoing_dislike.5005.c: "Jaké tajné ambice asi tak skrývá?!"
