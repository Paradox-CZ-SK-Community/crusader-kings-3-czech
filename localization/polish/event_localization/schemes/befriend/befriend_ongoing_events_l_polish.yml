l_polish:
 befriend_ongoing.0901.t: "Spřátelení: Co mohlo být"
 befriend_ongoing.0901.desc: "Dostala se ke mně šokující zpráva. [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] zemřel[Select_CString(target.IsFemale, 'a', '')].\n\nOsud tomu chtěl, že si [Select_CString(target.IsFemale, 'její', 'jeho')] přátelství nikdy neužiji."
 befriend_ongoing.0901.a: "Svět je krutý a nevyzpytatelný."
 befriend_ongoing.0902.t: "Spřátelení: Zajaté publikum"
 befriend_ongoing.0902.t.other: "Spřátelení: Za mřížemi"
 befriend_ongoing.0902.desc: "[target.Custom2('MyCharacterIntroduction', ROOT.Char)] je teď mým vězněm.\n\nAčkoli má nyní spoustu času na mou společnost, dokud zůstává v zajetí, sotva bude [target.GetTitledFirstName] nakloněn[Select_CString(target.IsFemale, 'a', '')] mým pokusům získat si [Select_CString(target.IsFemale, 'její', 'jeho')] přátelství."
 befriend_ongoing.0902.desc.other: "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] byl[Select_CString(target.IsFemale, 'a', '')] uvězněn[Select_CString(target.IsFemale, 'a', '')] postavou [imprisoner.Custom2('MyCharacterIntroduction', ROOT.Char)]! Dokud [target.GetTitledFirstName] zůstává v zajetí, [Select_CString(target.IsFemale, 'její', 'jeho')] přátelství si získat nedokážu."
 befriend_ongoing.0902.a: "A proč ne!? Jsem přece skvělý věznitel!"
 befriend_ongoing.0902.a.other: "Běda."
 befriend_ongoing.0903.t: "Spřátelení: Válka a přátelství"
 befriend_ongoing.0903.desc: "Dokud se naše panství střetávají ve válce, můj sen o velkorysosti a přátelství s [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] zůstává nedosažitelný. Alespoň prozatím."
 befriend_ongoing.0903.a: "Doufejme v lepší časy."
 befriend_ongoing.0903.a.tt: "Má intrika Spřátelení s [target.GetTitledFirstNameNoTooltip] skončila"
 befriend_ongoing.1001.t: "Spřátelení: Obdiv a úcta"
 befriend_ongoing.1001.desc.startnormal: "Když pomyslím na své životní činy, je jen přirozené, že ke mně ostatní chovají úctu."
 befriend_ongoing.1001.desc.starthumble: "Ačkoli o tom málokdy mluvím, mám za sebou několik činů, na které jsem hrdý[Select_CString(ROOT.Char.IsFemale, 'á', '')]."
 befriend_ongoing.1001.desc.end: "Jsem přesvědčen[Select_CString(ROOT.Char.IsFemale, 'á', 'ý')], že i [target.GetTitledFirstName] dokázal[Select_CString(target.IsFemale, 'a', '')] něco, co [Select_CString(target.IsFemale, 'ji', 'ho')] naplňuje hrdostí.\n\nMožná bych měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] nechat složit krátkou báseň porovnávající naše činy, aby bylo zřejmé, že jsme ze stejného těsta."
 befriend_ongoing.1001.a: "Mé činy na [target.GetTitledFirstName] jistě udělají dojem!"
 befriend_ongoing.1001.b: "Zaměřme se na úspěchy [target.GetFirstNameNoTooltip]."
 befriend_ongoing.1001.c: "Postarám se, aby o mé velikosti slyšeli #EMP všichni#!."
 befriend_ongoing.1002.t: "Spřátelení: Gesto štědrosti"
 befriend_ongoing.1002.desc.start: "Své snaze spřátelit se s [target.GetTitledFirstName] bych mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] pomoci vhodným darem.\n\n"
 befriend_ongoing.1002.desc.greedy: "Dárky přece miluje každý!"
 befriend_ongoing.1002.desc.malicious: "Lidé se dají tak snadno ovládat pomocí lesklých cetek..."
 befriend_ongoing.1002.desc.benevolent: "Dokonalý dárek může člověku opravdu ukázat, jak moc mi na něm záleží."
 befriend_ongoing.1002.desc.generic: "\n\nPokud mě to přiblíží k cíli, budou to dobře utracené peníze."
 befriend_ongoing.1002.d: "Najdu něco opravdu okázalého!"
 befriend_ongoing.1002.a: "Teď není čas šetřit."
 befriend_ongoing.1002.b: "Důležitý je úmysl."
 befriend_ongoing.1002.c: "Ne, nechci na to tlačit příliš."
 befriend_ongoing.1003.t: "Spřátelení: Nepřítel mého nepřítele"
 befriend_ongoing.1003.desc: "Jedno máme s [target.GetTitledFirstName] společné - nenávidíme [rival.GetTitledFirstName].\n\nSilné poselství by vyslala podobizna mého nepřítele visící na hradbách, až se [target.GetFirstNameNoTooltip] příště vrátí do [barony.GetTitledFirstNameNoTier]."
 befriend_ongoing.1003.a: "A ještě bude hořet!"
 befriend_ongoing.1003.b: "[rival.GetFirstNameNoTooltip] už nemusím dráždit víc."
 befriend_ongoing.1004.t: "Nepřítel mého nepřítele"
 befriend_ongoing.1004.desc: "Při poslední návštěvě [barony.GetNameNoTooltip], kde vládne [owner.GetTitledFirstName], mě při příchodu k [barony.Custom('BaronyTownType')] čekal pozoruhodný pohled. Z hradeb visela podobizna, v níž jsem okamžitě poznal[Select_CString(ROOT.Char.IsFemale, 'a', '')] našeho dávného společného nepřítele [rival.GetTitledFirstName]!\n\n[owner.GetFirstNameNoTooltip] na mě volal[Select_CString(owner.IsFemale, 'a', '')] na uvítanou a přitom lil[Select_CString(owner.IsFemale, 'a', '')] na „[rival.GetFirstNameNoTooltip]“ hořící smolu."
 befriend_ongoing.1004.a: "Jsem rád[Select_CString(ROOT.Char.IsFemale, 'a', '')], že na [rival.GetTitledFirstName] máme stejný názor!"
 befriend_ongoing.1005.t: "Přítel mého nepřítele"
 befriend_ongoing.1005.desc: "Herold se zdráhá podělit o zvěsti.\n\n„Zdá se, že vaši nepřátelé [owner.GetTitledFirstName] a [target.GetTitledFirstName] pověsili na hradby [barony.GetNameNoTooltip] vaši podobiznu, zapálili ji a přitom se vysmívali vašemu jménu.“\n\nSpolečně jsou desetkrát horší než každý zvlášť."
 befriend_ongoing.1005.a: "Věděl[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že mám dobrý důvod je nenávidět."
 befriend_ongoing.2001.t: "Spřátelení: Hřejivost přátelskosti"
 befriend_ongoing.2001.desc: "Myslel[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem si, že získat si přízeň [target.GetTitledFirstName] bude pořádná práce, ale ukázalo se, že [target.GetTitledFirstName] je nejpřátelštější člověk, jakého znám!\n\n[target.GetFirstNameNoTooltip] mi řekl[Select_CString(target.IsFemale, 'a', '')], že u [Select_CString(target.IsFemale, 'jejího', 'jeho')] krbu se vždy najde místo pro nové známé."
 befriend_ongoing.2001.a: "Výborně. Nechám [target.GetTitledFirstName], ať přijde za mnou."
 befriend_ongoing.2001.b: "Takové pozvání neodmítnu!"
 befriend_ongoing.3001.t: "Spřátelení: Spojovací článek"
 befriend_ongoing.3001.desc: "[befriend_envoy.GetTitledFirstName] mi pomáhá sblížit se s [target.GetTitledFirstName] a nabízí se, že nám bude zprostředkovávat kontakt. Věří, že mě dokáže vykreslit v tom nejlepším světle."
 befriend_ongoing.3001.a: "[befriend_envoy.GetTitledFirstName|U] by [Select_CString(befriend_envoy.IsFemale, 'měla', 'měl')] oslovit [target.GetFirstNameNoTooltip] přímo."
 befriend_ongoing.3001.b: "Je v sázce příliš mnoho, než abych se [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] spoléhat na [befriend_envoy.GetFirstNameNoTooltip]."
 befriend_ongoing.3001.tt: "#F [befriend_envoy.GetFirstName] požádá [target.GetFirstName] o audienci#!"
 befriend_ongoing.3002.t: "Neobvyklá dohoda"
 befriend_ongoing.3002.desc: "Není nic neobvyklého na tom, když mě [befriend_envoy.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('befriend_envoy'))], požádá o audienci. Tentokrát však přichází z vskutku zvláštního důvodu. Prohlašuje totiž, že jménem [owner.GetTitledFirstName] přichází jako [Select_CString(befriend_envoy.IsFemale, 'vyslankyně', 'vyslanec')] přátelství!"
 befriend_ongoing.3002.a: "Zvláštní, ale [Select_CString(ROOT.Char.IsFemale, 'ráda', 'rád')] si poslechnu, co mi [befriend_envoy.GetTitledFirstName] poví o [owner.GetFirstNameNoTooltip]."
 befriend_ongoing.3002.b: "Žádný z mých poddaných nebude dělat vyslance někomu jinému!"
 befriend_ongoing.3003.t: "Spřátelení: Zpráva prostředníka"
 befriend_ongoing.3003.accepted_envoy: "[befriend_envoy.GetTitledFirstName] mi přináší slibné zprávy. [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'přijala', 'přijal')] [befriend_envoy.GetTitledFirstName] vřele jako [Select_CString(befriend_envoy.IsFemale, '„vyslankyni“', '„vyslance“')] mého přátelství."
 befriend_ongoing.3003.dismissed_envoy: "[Select_CString(ROOT.Char.IsFemale, 'Věděla', 'Věděl')] jsem, že využít [befriend_envoy.GetTitledFirstName], [scheme.GetTargetCharacter.Custom2('RelationToMe', SCOPE.sC('befriend_envoy'))] [target.GetTitledFirstName], je poněkud troufalé, ale [Select_CString(ROOT.Char.IsFemale, 'doufala', 'doufal')] jsem, že v tom [target.GetTitledFirstName] uvidí mé dobré úmysly. Jak hluboce jsem se [Select_CString(ROOT.Char.IsFemale, 'mýlila', 'mýlil')]. Nikdy jsem [Select_CString(ROOT.Char.IsFemale, 'neměla', 'neměl')] na plán [befriend_envoy.GetTitledFirstName] přistoupit..."
 befriend_ongoing.3003.a: "Na naše rodící se přátelství!"
 befriend_ongoing.3003.b: "Musím být opatrnější."
 befriend_ongoing.3007.t: "Spřátelení: Rozsudek z [agent_speaking_highly.GetFaith.DivineRealm|U]"
 befriend_ongoing.3007.desc.conviction: "Je to zázrak! [agent_speaking_highly.GetTitledFirstName] [Select_CString(agent_speaking_highly.IsFemale, 'měla', 'měl')] vidění seslané božskou mocí. Ujišťuje mě, že [target.GetTitledFirstName] a já jsme předurčeni stát se přáteli!"
 befriend_ongoing.3007.desc.doubt: "[agent_speaking_highly.GetTitledFirstName] mi vypráví o božském vidění. Podle něj jsme [target.GetTitledFirstName] a já předurčeni stát se přáteli. Jak příhodné."
 befriend_ongoing.3007.a: "O tom vidění povíme [target.GetFirstNameNoTooltip]."
 befriend_ongoing.3007.b: "[agent_speaking_highly.GetFirstNameNoTooltip], pomodleme se společně na poděkování."
 befriend_ongoing.3009.t: "Spřátelení: Dobré slovo"
 befriend_ongoing.3009.desc: "[spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], si všímá mé snahy zapůsobit na [target.GetTitledFirstName] a přichází s návrhem.\n\n„Myslím, že mé slovo má u [target.GetTitledFirstName], [spouse.Custom2('RelationToMe', SCOPE.sC('target'))], značnou váhu. Mohu říct, jak [Select_CString(ROOT.Char.IsFemale, 'úžasná', 'úžasný')] podle mě jsi.“"
 befriend_ongoing.3009.a: "Ach, nic nezamlčuj, [Select_CString(spouse.IsFemale, 'drahá má', 'drahý můj')]."
 befriend_ongoing.3009.a.success: "Slova [spouse.GetFirstNameNoTooltip] zapůsobí na [target.GetFirstNameNoTooltip]"
 befriend_ongoing.3009.a.failure: "[target.GetFirstNameNoTooltip] zůstane bez dojmu"
 befriend_ongoing.3009.b: "Ne, tohle zvládnu [Select_CString(ROOT.Char.IsFemale, 'sama', 'sám')]."
 befriend_ongoing.3009.b.tt: "Při navazování přátelství se nemohu spoléhat na ostatní."
 befriend_ongoing.3010.t: "Dobré slovo"
 befriend_ongoing.3010.desc: "[spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], mi poslední dobou hodně vypráví o [owner.GetTitledFirstName], [spouse.Custom2('RelationToMe', SCOPE.sC('owner'))].\n\nMusím uznat, že podle toho, co slyším, si [owner.GetTitledFirstName] mou úctu možná skutečně zaslouží."
 befriend_ongoing.3010.a: "Možná bych [Select_CString(ROOT.Char.IsFemale, 'měla', 'měl')] [owner.GetTitledFirstName] lépe poznat."
 befriend_ongoing.3011.desc: "„[target.GetTitledFirstName] má teď rozhodně větší zájem tě poznat,“ říká mi [spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]. Zdá se, že plán vyšel dokonale!"
 befriend_ongoing.3011.a: "Na tebe je vždy spoleh, [spouse.GetFirstNameNoTooltip]."
 befriend_ongoing.3012.desc: "„Mrzí mě to, ale přes veškerou mou snahu [target.GetTitledFirstName], [spouse.Custom2('RelationToMe', SCOPE.sC('target'))], [Select_CString(target.IsFemale, 'zůstala', 'zůstal')] tebou [Select_CString(target.IsFemale, 'nezaujatá', 'nezaujatý')],“ říká mi [spouse.GetTitledFirstName]. Zdá se, že ten plán nakonec nebyl příliš dobrý."
 befriend_ongoing.3012.a: "Proč se vůbec spoléhám na ostatní?"
 befriend_ongoing.3014.t: "Nepříjemná pověst"
 befriend_ongoing.3014.desc: "Poslední dobou je ke mně [owner.GetTitledFirstName] nezvykle [Select_CString(owner.IsFemale, 'přátelská', 'přátelský')]. Když se o tom ale zmíním před [spouse.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))] a zároveň [owner.Custom2('RelationToMe', SCOPE.sC('spouse'))] [owner.GetTitledFirstName], jen se ušklíbne.\n\n„[owner.GetFirstNameNoTooltip] si tvé přátelství nezaslouží. Povím ti, [Select_CString(owner.IsFemale, 'jaká', 'jaký')] doopravdy je...“"
 befriend_ongoing.3014.a: "Kdo by to mohl vědět lépe?"
 befriend_ongoing.3015.t: "Spřátelení: Pomluvy!"
 befriend_ongoing.3015.desc: "Navzdory všemu mému úsilí je ke mně [target.GetTitledFirstName] o něco chladnější. Zdá se, že se k [Select_CString(target.IsFemale, 'ní', 'němu')] donesly nepříjemné zvěsti o mně, a k mému zděšení je šíří [spouse.GetFirstName], [target.Custom2('RelationToMe', SCOPE.sC('spouse'))] [target.GetTitledFirstName] a zároveň [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))]!\n\n[spouse.GetFirstName] tím není nijak [Select_CString(spouse.IsFemale, 'znepokojená', 'znepokojený')]. „Jen jsem [Select_CString(spouse.IsFemale, 'řekla', 'řekl')] pravdu, #EMP drahoušku#!.“"
 befriend_ongoing.3015.a: "Jak jsi mi to [Select_CString(spouse.IsFemale, 'mohla', 'mohl')] udělat?"
 befriend_ongoing.4000.t: "Spřátelení: Ti, kdo znají válku"
 befriend_ongoing.4000.desc: "Snažím se spřátelit s [target.GetTitledFirstName] a vím, že se stejně jako já vášnivě zajímá o vojenství. Jistě bychom měli o čem hovořit."
 befriend_ongoing.4000.a: "Oslovím [target.GetTitledFirstName]."
 befriend_ongoing.4000.a.tt: "#F Společný zájem by nás mohl sblížit#!"
 befriend_ongoing.4000.b: "Najdu způsob, jak toho využít."
 befriend_ongoing.4002.t: "Ti, kdo znají válku"
 befriend_ongoing.4002.desc: "[owner.GetTitledFirstName] za mnou přichází s tím, že nás oba zajímá vojenství, a chce si vyměnit názory. Je znát, že o strategii i taktice má načteno opravdu hodně."
 befriend_ongoing.4002.a: "Konečně nějaký zajímavý rozhovor!"
 befriend_ongoing.4002.b: "S [owner.GetTitledFirstNameNoTooltip]? To sotva."
 befriend_ongoing.4004.a.desc: "S [target.GetTitledFirstName] jsme dlouho rozebírali obléhání, obchvaty, nájezdy za zásobami, nasazení lučištníků i správné rozmístění obléhacích strojů. Dobře jsme se pobavili nad nechápavými přihlížejícími, kteří při zaslechnutí našeho hovoru jen kroutili hlavami."
 befriend_ongoing.4004.b.desc: "[target.GetTitledFirstName] chladně odvětil[Select_CString(target.IsFemale, 'a', '')], že [Select_CString(target.IsFemale, 'ji', 'ho')] vojenství vlastně nezajímá. Jenže já vím, že to není pravda."
 befriend_ongoing.4004.a: "Válka je vskutku nejušlechtilejší umění."
 befriend_ongoing.4004.b: "Jaké zklamání."
 befriend_ongoing.4010.t: "Spřátelení: Dvě slunce"
 befriend_ongoing.4010.desc: "Když se lidí ptám na [target.GetTitledFirstName], vyprávějí o důvtipu, šarmu a přirozené lehkosti, s níž se [target.GetTitledFirstName] stává středem každé společnosti. Zdá se, že máme něco společného."
 befriend_ongoing.4010.a: "Dvě slunce společně zazáří třikrát jasněji!"
 befriend_ongoing.4012.t: "Dvě slunce"
 befriend_ongoing.4012.desc: "[owner.GetTitledFirstName] všude trousí dost průhledné náznaky, že by se se mnou rád[Select_CString(owner.IsFemale, 'a', '')] spřátelil[Select_CString(owner.IsFemale, 'a', '')]. Ve společnosti je jako ryba ve vodě a naznačuje, že právě naše společné nadání by nás mělo přirozeně sblížit."
 befriend_ongoing.4012.a: "A má pravdu!"
 befriend_ongoing.4012.b: "Ve skutečnosti na [owner.GetTitledFirstName] není ani zdaleka tolik zajímavého, jak si myslí."
 befriend_ongoing.4014.a.desc: "Na mé pozvání jsme se s [target.GetTitledFirstName] sešli ve společnosti. Skvěle jsme se bavili a ostatní také. Bylo příjemné sledovat, jak se celá společnost už po několika minutách začala přirozeně točit kolem nás dvou."
 befriend_ongoing.4014.b.desc: "Od [target.GetTitledFirstName] ke mně po společných známých doputovala krutá a odmítavá odpověď na mé pozvání, důmyslně utkaná z náznaků a šeptandy."
 befriend_ongoing.4014.a: "Jako mouchy kolem dvou hrnců medu!"
 befriend_ongoing.4014.b: "Působivé. A urážlivé."
 befriend_ongoing.4020.t: "Spřátelení: Není o čem mluvit"
 befriend_ongoing.4020.desc: "Uvědomil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem si, že [target.GetTitledFirstName] má stejně jako já smysl pro pořádek v číslech a náležitě chápe, jak důležité je mít v účtech jasno."
 befriend_ongoing.4020.a: "Ví vůbec, co je nula? Musím to zjistit!"
 befriend_ongoing.4022.t: "Není o čem mluvit"
 befriend_ongoing.4022.desc: "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] za mnou přichází a chce si pohovořit o našem společném zájmu o správu a čísla. Zvláštní pozornost chce věnovat číslu nula."
 befriend_ongoing.4022.a: "Samozřejmě! To bude velmi poučné!"
 befriend_ongoing.4022.b: "Právě tohle číslo dokonale vystihuje míru mého zájmu."
 befriend_ongoing.4024.a.desc: "S [target.GetTitledFirstName] jsme dlouze rozebírali číslo nula, jeho význam i možnosti využití v matematice a správě. Jsem rád[Select_CString(ROOT.Char.IsFemale, 'a', '')], že jsem našel[Select_CString(ROOT.Char.IsFemale, 'a', '')] někoho s nedělitelně kladným vztahem k číslům, kdo chápe jejich skutečnou hodnotu."
 befriend_ongoing.4024.b.desc: "[target.GetTitledFirstName] pouze odvětil[Select_CString(target.IsFemale, 'a', '')], že nula ze všech čísel nejlépe odpovídá míře zájmu o další rozhovor se mnou."
 befriend_ongoing.4024.a: "Někdy je dobré mluvit o ničem."
 befriend_ongoing.4024.b: "Ale mé zklamání je nekonečné."
 befriend_ongoing.4030.t: "Spřátelení: Tanec pletichářů"
 befriend_ongoing.4030.desc: "O [target.GetTitledFirstName] se říká, že se velmi dobře vyzná v úkladech a manipulaci. Možná je načase navázat hovor a zjistit, zda by nás právě tohle nemohlo sblížit."
 befriend_ongoing.4030.a: "Udělám to nepřímo a úskočně."
 befriend_ongoing.4032.t: "Tanec pletichářů"
 befriend_ongoing.4032.desc: "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] mi prostřednictvím nepřímých náznaků dává najevo, že by se se mnou rád[Select_CString(owner.IsFemale, 'a', '')] spřátelil[Select_CString(owner.IsFemale, 'a', '')]. Je zřejmé, že to pojímá jako hru, jakýsi tanec intrik, v němž se ode mě očekává stejně nepřímá odpověď."
 befriend_ongoing.4032.a: "[owner.GetFirstNameNoTooltip] dostane příznivou odpověď."
 befriend_ongoing.4032.b: "Dám [owner.GetTitledFirstName] jasně najevo, co si o té pošetilosti myslím."
 befriend_ongoing.4034.a.desc: "Mé jemné náznaky se u [target.GetTitledFirstName] setkaly s příznivou odezvou a věřím, že nás to o něco sblížilo. Ukázalo se, že přece jen máme něco společného."
 befriend_ongoing.4034.b.desc: "Na mé náznaky přátelství přišla od [target.GetTitledFirstName] krajně urážlivá odpověď, byť stejně jemná a nepřímá. Jakákoli má reakce by ze mě jen udělala hlupáka."
 befriend_ongoing.4034.a: "Intrika ke spřátelení s intrikánem. Jak příhodné."
 befriend_ongoing.4034.b: "Tohle jsem opravdu nečekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 befriend_ongoing.4040.t: "Spřátelení: Spřízněné mysli"
 befriend_ongoing.4040.desc: "[target.GetTitledFirstName] je podle všeho stejně jako já opravdov[Select_CString(target.IsFemale, 'á učenka', 'ý učenec')]. Jistě bychom našli mnoho učených témat k rozpravě. [target.GetTitledFirstName] by stálo za to oslovit."
 befriend_ongoing.4040.a: "Uvidíme, co z toho vzejde."
 befriend_ongoing.4042.t: "Spřízněné mysli"
 befriend_ongoing.4042.desc: "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] za mnou přichází s návrhem na učenou rozpravu o tématu podle mého výběru. Je zřejmé, že se se mnou snaží spřátelit."
 befriend_ongoing.4042.a: "Ano, ať se dvě velké mysli setkají!"
 befriend_ongoing.4042.b: "Co zajímavého by mi vůbec mohl[Select_CString(owner.IsFemale, 'a', '')] [owner.GetTitledFirstName] říct?"
 befriend_ongoing.4044.a.desc: "S [target.GetTitledFirstName] jsme dlouze rozmlouvali o povaze poznání a dalších filozofických otázkách. Mám pocit, že se naše mysli setkaly a k přátelství máme zase o něco blíž."
 befriend_ongoing.4044.b.desc: "[target.GetTitledFirstName] mi [Select_CString(target.IsFemale, 'dala', 'dal')] jasně najevo, že o učené rozpravy se mnou nestojí. V odpovědi zaznívalo nezaměnitelné pohrdání."
 befriend_ongoing.4044.a: "Velké mysli přece smýšlejí podobně."
 befriend_ongoing.4044.b: "Jaké zklamání."
 befriend_ongoing.4050.t: "Spřátelení: Jiskry vášně"
 befriend_ongoing.4050.desc: "Proslýchá se, že [target.GetTitledFirstName] stejně jako já dokonale ovládá umění rozněcovat v druhých milostnou vášeň. Zdá se mi, že bychom se měli sejít a porovnat své zkušenosti."
 befriend_ongoing.4050.a: "Vede si [target.GetTitledFirstName] seznam svých milostných výbojů? To by mě zajímalo."
 befriend_ongoing.4052.t: "Jiskry vášně"
 befriend_ongoing.4052.desc: "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] za mnou přichází a připomíná náš společný zájem o svádění a milostná dobrodružství. Navrhuje, abychom se sešli a porovnali své zkušenosti."
 befriend_ongoing.4052.a.wine: "Ano, podělme se o pikantní historky nad pohárem vína!"
 befriend_ongoing.4052.a.tee: "Ano, podělme se o pikantní historky!"
 befriend_ongoing.4052.b: "[owner.GetTitledFirstName|U] se chce poměřovat se mnou? Ha!"
 befriend_ongoing.4054.a.desc: "S [target.GetTitledFirstName] jsme celé hodiny rozmlouvali a porovnávali své milostné výboje. Podivné a spletité příhody vydaly na lepší historky než ty obyčejné, těch však bylo mnohem víc."
 befriend_ongoing.4054.b.desc: "[target.GetTitledFirstName] se se mnou [Select_CString(target.IsFemale, 'odmítla', 'odmítl')] sejít a vyměňovat si příběhy o milostných výbojích. Prý se s [Select_CString(target.IsFemale, 'ní', 'ním')] vůbec nemohu měřit."
 befriend_ongoing.4054.a: "Oba jsme už dávno přestali počítat."
 befriend_ongoing.4054.b: "Ha! Závist je odporná bestie!"
 befriend_ongoing.4060.t: "Spřátelení: Zkřížené čepele"
 befriend_ongoing.4060.desc: "Lidé vyprávějí o mimořádné zručnosti, kterou [target.GetTitledFirstName] předvádí s mečem v ruce. Říká se, že jakmile se tasí čepele, jen málokdo dokáže pod útoky vydržet déle než pár vteřin."
 befriend_ongoing.4060.a: "Musíme se sejít a zkřížit čepele!"
 befriend_ongoing.4062.t: "Zkřížené čepele"
 befriend_ongoing.4062.desc: "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] sdílí mou zálibu v šermu a přichází s návrhem na přátelský souboj, při němž bychom si snad mohli i pohovořit o našem oblíbeném tématu."
 befriend_ongoing.4062.a: "Výborný návrh!"
 befriend_ongoing.4062.b: "[owner.GetTitledFirstNameNoTooltip] nestojí za můj čas."
 befriend_ongoing.4064.a.desc: "S [target.GetTitledFirstName] jsme se sešli k přátelskému souboji s meči v rukou. Po dobrých dvou hodinách svižného tance výpadů a krytů jsme strávili další tři rozpravou o technice a taktice."
 befriend_ongoing.4064.b.desc: "[target.GetTitledFirstName] mi velmi jasně a ne právě zdvořile [Select_CString(target.IsFemale, 'sdělila', 'sdělil')], že o šermířský souboj se mnou nemá zájem."
 befriend_ongoing.4064.a: "Jen málokdo chápe vnitřní krásu čepele."
 befriend_ongoing.4064.b: "Tak mluví zbabělec."
 befriend_ongoing.4070.t: "Spřátelení: Příběhy z divočiny"
 befriend_ongoing.4070.desc: "[target.GetTitledFirstName] je stejně jako já [Select_CString(target.IsFemale, 'oddaná lovkyně', 'oddaný lovec')]. Jistě bychom měli o čem mluvit a našli spoustu společných zážitků."
 befriend_ongoing.4070.a: "Měli bychom se sejít a porovnat své úlovky!"
 befriend_ongoing.4072.t: "Příběhy z divočiny"
 befriend_ongoing.4072.desc: "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] za mnou přichází s návrhem, abychom se sešli a podělili se o své lovecké zkušenosti. Je to příležitost vyměnit si pořádně přibarvené historky z divočiny."
 befriend_ongoing.4072.a: "Jaký byl asi nejtěžší úlovek [owner.GetTitledFirstName]?"
 befriend_ongoing.4072.b: "Ten lovec králíků mě nezajímá."
 befriend_ongoing.4074.a.desc: "S [target.GetTitledFirstName] jsme strávili celý večer vyprávěním a porovnáváním zážitků z nejrůznějších lovů."
 befriend_ongoing.4074.b.desc: "[target.GetTitledFirstName] na mou nabídku reagoval[Select_CString(target.IsFemale, 'a', '')] jen pohrdavě a označil[Select_CString(target.IsFemale, 'a', '')] mě za lovce králíků."
 befriend_ongoing.4074.a: "Pár těch historek si [target.GetTitledFirstName] určitě přikrášlil[Select_CString(target.IsFemale, 'a', '')]."
 befriend_ongoing.4074.b: "Tak ať je králíkem [target.GetTitledFirstName]."
 befriend_ongoing.4080.t: "Spřátelení: Divoké noci"
 befriend_ongoing.4080.desc: "[target.GetTitledFirstName] má stejně jako já pověst milovníka bujarých radovánek. Myslím, že bychom se skvěle bavili, kdybychom uspořádali menší pitku."
 befriend_ongoing.4080.a: "Musíme to uskutečnit!"
 befriend_ongoing.4082.t: "Divoké noci"
 befriend_ongoing.4082.desc: "[owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] mě zve na menší večer plný pití a bujarého veselí. Podle všeho má [owner.GetTitledFirstName] v těchto radovánkách už jistou pověst."
 befriend_ongoing.4082.a: "To bude zábava."
 befriend_ongoing.4082.b: "[owner.GetFirstNameNoTooltip]? To se raději napiji o samotě."
 befriend_ongoing.4084.a.desc: "S [target.GetTitledFirstName] jsme strávili den a noc (nebo snad dvě?) bujarým veselím. Jasně si pamatuji jen, kde to začalo a kde skončilo, ale jedno je jisté: [ROOT.Char.GetFaith.random_GoodGodNames] dosvědčí, že jsme se skvěle bavili!"
 befriend_ongoing.4084.b.desc: "[target.GetTitledFirstName] prohlašuje, že bude raději pít o samotě než trávit čas se mnou."
 befriend_ongoing.4084.a: "Nebyl to špatný způsob, jak strávit... nějaký čas."
 befriend_ongoing.4084.b: "Tak to jsem asi unikl[Select_CString(ROOT.Char.IsFemale, 'a', '')] pohromě."
 befriend_ongoing.4090.t: "Spřátelení: Symfonie bolesti"
 befriend_ongoing.4090.desc: "Dozvídám se, že [target.GetTitledFirstName] stejně jako já oddaně studuje jemné umění bolesti a nátlaku. Bylo by zajímavé se sejít a probrat různé metody i jejich použití."
 befriend_ongoing.4090.a: "Budeme samozřejmě potřebovat nástroje a oběti."
 befriend_ongoing.4092.t: "Symfonie bolesti"
 befriend_ongoing.4092.desc: "[owner.GetTitledFirstName] dává najevo přání sejít se se mnou a probrat náš společný zájem o jemné umění bolesti a nátlaku."
 befriend_ongoing.4092.a: "Výborný nápad. Přinesu si nástroje."
 befriend_ongoing.4092.b: "S někým, kdo jen hrubě trhá nehty, nemám o čem mluvit."
 befriend_ongoing.4094.a.desc: "S [target.GetTitledFirstName] jsme strávili celý den i noc ve společnosti několika nešťastníků narychlo sesbíraných mezi drobnými zločinci. Probírali jsme a zkoušeli různé techniky a plánovali další experimenty."
 befriend_ongoing.4094.b.desc: "Na mé pozvání přišla od [target.GetTitledFirstName] jen odpověď, že mé metody jsou příliš hrubé a o mou společnost není zájem."
 befriend_ongoing.4094.a: "Bylo to inspirativní i poučné."
 befriend_ongoing.4094.b: "Jen ať [target.GetTitledFirstName] přijde blíž. S radostí předvedu, jak hrubé mé metody opravdu jsou..."
 befriend_ongoing.4100.t: "Spřátelení: Nepřítel mého nepřítele"
 befriend_ongoing.4100.desc: "Válka přináší hrůzy, ale také příležitosti ke slávě. A s nimi i pouta, která vznikají mezi těmi, kdo bojují na stejné straně.\n\nBěhem našeho boje proti [befriend_ongoing_4100_enemy.GetTitledFirstName] jsme s [befriend_ongoing_4100_text_scope.GetTitledFirstName] podle všeho našli společnou řeč."
 befriend_ongoing.4100.a: "Válka uková přátelství."
 befriend_ongoing.4110.t: "Společné cíle"
 befriend_ongoing.4110.desc: "S [befriend_ongoing_4110_text_scope.GetTitledFirstName] působíme ve stejné frakci a při naší spolupráci zjišťuji, že mezi lidmi usilujícími o společný dlouhodobý cíl nevyhnutelně vznikají pevná pouta."
 befriend_ongoing.4110.a: "Kéž se nám všem daří."
 befriend_ongoing.4300.t: "Spřátelení: Podívaná na popravišti"
 befriend_ongoing.4300.a: "Spravedlnosti bude učiněno zadost. Spravedlnosti i strachu."
 befriend_ongoing.4300.b: "Musí existovat jiná cesta."
 befriend_ongoing.4300.desc: "Dozvídám se, že [target.GetTitledFirstName] stejně jako já vládne takovou spravedlností, před níž se ostatní třesou. Měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] bych nabídnout místo po svém boku při příští veřejné popravě."
 befriend_ongoing.4300.a.tt: "#F Dopis obdrží [target.GetTitledFirstName]#!"
 befriend_ongoing.4302.t: "Pozvání na popravu"
 befriend_ongoing.4302.desc: "[owner.GetTitledFirstName] mě [Select_CString(owner.IsFemale, 'pozvala', 'pozval')] na čestné místo po svém boku při příští veřejné popravě."
 befriend_ongoing.4302.c: "Máš mě snad za hlupáka? Tak snadno se ti do spárů nedostanu!"
 befriend_ongoing.4302.a: "Výborný nápad. Bude mi ctí sledovat, jak vykonáváš spravedlnost."
 befriend_ongoing.4302.b: "Mám důležitější věci na práci než sledovat, jak se vypořádáváš s drobnými zločinci."
 befriend_ongoing.4304.t: "Spřátelení: Hrůzu nahánějící podívaná"
 befriend_ongoing.4304.a.desc: "[target.GetTitledFirstName] dorazil[Select_CString(target.IsFemale, 'a', '')] k mému dvoru, aby zhlédl[Select_CString(target.IsFemale, 'a', '')] veřejnou popravu a poznal[Select_CString(target.IsFemale, 'a', '')] mou spravedlnost. Mám příležitost zapůsobit svou přísností. Kterého vězně mám popravit?"
 befriend_ongoing.4304.b.desc: "Na mé pozvání přišla od [target.GetTitledFirstName] odpověď, že se mnou nechce mít nic společného ani mi svou hrůznou pověstí dodávat legitimitu."
 befriend_ongoing.4304.a: "Je čas zemřít, [prisoner_a.GetFirstNameNoTooltip]."
 befriend_ongoing.4304.b: "Tvůj konec nadešel, [prisoner_b.GetFirstNameNoTooltip]."
 befriend_ongoing.4304.c: "Setněte [prisoner_c.GetFirstNameNoTooltip] hlavu!"
 befriend_ongoing.4304.d: "Dnes mám milosrdnou náladu. Nikdo nezemře."
 befriend_ongoing.4304.d.tt: "#F [target.GetTitledFirstName] může mou milost považovat za slabost#!"
 befriend_ongoing.4304.e: "Jednou možná mou ocel okusí i [owner.GetTitledFirstName]."
 befriend_ongoing.4304.e.tt: "#F [owner.GetTitledFirstName] nechce navštívit můj dvůr#!"
 befriend_ongoing.4304.f: "Zabijte je všechny!"
 befriend_ongoing.5001.t: "Spřátelení: Cynik a horlivec"
 befriend_ongoing.5001.desc: "Mé snahy zmírnit napětí mezi mnou a [target.GetTitledFirstName] komplikuje neustálé odsuzování mé nedostatečné zbožnosti. Pokusy přesvědčit mě však mým přesvědčením sotva otřesou..."
 befriend_ongoing.5001.a: "Dobrá, [ROOT.Char.GetFaith.HouseOfWorship] bude místem mých častějších návštěv. [target.GetFirstNameNoTooltip] z toho snad bude mít radost."
 befriend_ongoing.5001.b: "Najdeme jiné věci, na kterých se shodneme."
 befriend_ongoing.5002.t: "Spřátelení: Otázka důvěry"
 befriend_ongoing.5002.desc: "Získat si přízeň [target.GetTitledFirstName] by bylo mnohem snazší s trochou důvěry v upřímnost mého snažení! Z vyhýbavých odpovědí a neustálého ukončování rozhovorů je však jasné, že o mé upřímnosti panují pochybnosti..."
 befriend_ongoing.5002.a: "Budu naléhat, ale nebudu lhát o tom, kdo jsem."
 befriend_ongoing.5002.b: "Bohužel bývají lži přesvědčivější než pravda."
 befriend_ongoing.5003.t: "Spřátelení: Temný mrak za slunného dne"
 befriend_ongoing.5003.desc: "Chci jen, aby [target.GetTitledFirstName] poznal[Select_CString(target.IsFemale, 'a', '')] radost ze společnosti druhých! Čím víc se však snažím, tím víc se mi vzdaluje. Teď už téměř nevychází ze svých komnat..."
 befriend_ongoing.5003.c: "Budu naslouchat a pokusím se projevit pochopení."
 befriend_ongoing.5003.a: "Musí se z toho vzpamatovat!"
 befriend_ongoing.5003.b: "Pokud potřebuje prostor, dopřeji ho."
 befriend_ongoing.5004.t: "Spřátelení: Mimo vkus"
 befriend_ongoing.5004.desc: "Nic mi nezvedne náladu tak jako [ROOT.Char.Custom('FavoriteTreat')]. Důkazem mých dobrých úmyslů se proto měla stát porce připravená mým osobním kuchařem a určená pro [target.GetTitledFirstName].\n\nCelé gesto však skončilo katastrofou. [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'nechala', 'nechal')] služebnictvo všechno vyhodit, aniž by vůbec ochutnal[Select_CString(target.IsFemale, 'a', '')] jediné sousto..."
 befriend_ongoing.5004.a: "Za svou přehnanost se omluvím."
 befriend_ongoing.5004.b: "Takový nevděk! [target.Custom2('InsultNoun', ROOT.Char)]!"
 befriend_ongoing.5005.t: "Spřátelení: Výzva k činu"
 befriend_ongoing.5005.desc: "Snažím se, aby mi [target.GetTitledFirstName] lépe rozuměl[Select_CString(target.IsFemale, 'a', '')], ale výsledkem je jen to, že já rozumím [target.GetTitledFirstName] čím dál méně. Kde je nějaký zápal, nějaká ctižádost? Zdá se, že by [target.GetTitledFirstName] bylo úplně jedno, kdyby se už nikdy nic nezměnilo."
 befriend_ongoing.5005.a: "Nemusím s tím souhlasit, ale dokážu to přijmout."
 befriend_ongoing.5005.b: "Stojí vůbec za to takového člověka poznávat?"
 befriend_ongoing.5006.t: "Spřátelení: Překlenutí rozdílů"
 befriend_ongoing.5006.desc: "Hledám a hledám, ale zdá se, že s [target.GetTitledFirstName] nemáme vůbec nic společného.\n\nJak mám bez jakéhokoli společného základu vůbec začít budovat přátelství?"
 befriend_ongoing.5006.a: "S trochou úsilí se naučím [target.GetTitledFirstName] rozumět."
 befriend_ongoing.5006.b: "Dříve či později se jistě něco najde."
 befriend_ongoing.5007.t: "Spřátelení: Poznání na dosah"
 befriend_ongoing.5007.opening: "S [target.GetTitledFirstName] toho máme společného jen málo, a proto spolu jen těžko hledáme společnou řeč.\n\nS trochou úsilí si však dokážu osvojit dost znalostí k rozhovoru"
 befriend_ongoing.5007.martial: " o strategii a zásobovacích trasách."
 befriend_ongoing.5007.diplomacy: " o správné dvorské etiketě a tradicích."
 befriend_ongoing.5007.intrigue: " o moci ukryté v tajemstvích. Ve všech možných tajemstvích."
 befriend_ongoing.5007.stewardship: " o spletitostech nejrůznějších feudálních smluv v panství."
 befriend_ongoing.5007.learning: " o metafyzické podstatě duše."
 befriend_ongoing.5007.a: "Téma si zaslouží tolik studia, kolik si mohu dovolit."
 befriend_ongoing.5007.a.success: "Získáš nové poznatky"
 befriend_ongoing.5007.a.failure: "Toto studium nebylo správnou volbou"
 befriend_ongoing.5007.b: "Nebo si prostě odpočinu."
 befriend_ongoing.6001.t: "Svoboda a přátelství"
 befriend_ongoing.6002.t: "Svoboda a přátelství"
 befriend_ongoing.6002.desc: "Poslední dobou se ke mně [owner.GetTitledFirstName] chová nezvykle přátelsky.\n\nPokud tato změna tónu znamená i změnu povahy, možná se [prisoner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))], přece jen konečně dočká svobody?"
 befriend_ongoing.6002.a: "Jestli se mnou [owner.GetTitledFirstName] skutečně chce být přítel..."
 befriend_ongoing.6002.a.tt: "Pokud [owner.GetFirstNameNoTooltip] přijme:"
 befriend_ongoing.6002.b: "[prisoner.GetFirstNameNoTooltip] může počkat ještě o něco déle."
 befriend_ongoing.6002.b.tt: "#F [owner.GetFirstNameNoTooltip] může [prisoner.GetFirstNameNoTooltip] dál držet v zajetí#!"
 befriend_ongoing.6004.desc: "[target.GetTitledFirstName] si mou nedávnou přátelskost [Select_CString(target.IsFemale, 'vyložila', 'vyložil')] jako znamení a přichází za mnou s obavami o jednoho z mých vězňů.\n\n„Velmi by mě potěšilo, kdyby [prisoner.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('prisoner'))], mohl[Select_CString(prisoner.IsFemale, 'a', '')] opustit [prisoner.Custom('PrisonTypeCell')],“ říká [target.GetTitledFirstName] a [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('target'))]."
 befriend_ongoing.6004.a: "Levná cesta k přízni. [target.GetFirstNameNoTooltip] bude [Select_CString(target.IsFemale, 'spokojená', 'spokojený')]."
 befriend_ongoing.6004.b: "Ne, ale [prisoner.GetFirstNameNoTooltip] může dostat o něco pohodlnější celu."
 befriend_ongoing.6004.c: "Ne! [prisoner.GetFirstNameNoTooltip] zůstane ve vězení!"
 befriend_ongoing.6005.desc: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'projevila', 'projevil')] milost! [prisoner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))], je konečně v bezpečí."
 befriend_ongoing.6005.a: "Vítej doma."
 befriend_ongoing.6006.desc: "Navzdory všem řečem o přátelství [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'rozhodla', 'rozhodl')], že [prisoner.GetFirstNameNoTooltip] zůstane v zajetí."
 befriend_ongoing.6006.a: "Jsou i jiné cesty. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))|U] musí ještě vydržet."
 befriend_ongoing.6007.desc: "[owner.GetTitledFirstName] dlouze a lítostivě [Select_CString(owner.IsFemale, 'vysvětlovala', 'vysvětloval')], proč [prisoner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('prisoner'))], musí zůstat v zajetí. Alespoň teď však pobývá v mnohem pohodlnějších komnatách."
 befriend_ongoing.6007.a: "Jednou budeš zase na svobodě."
 befriend_ongoing.6008.desc: "Zdá se, že mé propuštění ze zajetí [owner.GetTitledFirstName] zařídil[Select_CString(target.IsFemale, 'a', '')] [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))]!"
 befriend_ongoing.6008.a: "Nemohu ti dost poděkovat, [target.GetFirstNameNoTooltip]."
 befriend_ongoing.6009.t: "Spřátelení: Dobrá vůle"
 befriend_ongoing.6009.desc: "Slib oddanosti by vyslal jasné poselství o mých dobrých úmyslech vůči [target.GetTitledFirstName].\n\nKaždý ocení významnou laskavost."
 befriend_ongoing.6009.a: "Slib bude oficiální a slavnostní!"
 befriend_ongoing.6009.b: "Postarám se, aby na ten slib [target.GetTitledFirstName] nezapomněl[Select_CString(target.IsFemale, 'a', '')] ani jediný den."
 befriend_ongoing.6009.c: "Takovým závazkům je lepší se vyhnout."
 befriend_ongoing.6009.c.tt: "#F Žádný dluh na sebe nevezmu#!"
 befriend_ongoing.6010.t: "Dobrá vůle"
 befriend_ongoing.6010.desc: "K mému překvapení za mnou přichází [owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], a slibuje mi, že stačí požádat a udělá pro mě vše, co bude v jeho silách."
 befriend_ongoing.6010.a: "Co tím [owner.GetTitledFirstName] získá?"
 befriend_ongoing.6011.desc: "Ačkoli mi [target.GetTitledFirstName] dluží významnou laskavost, možná by bylo lepší zdůraznit, že naše přátelství má být rovnocenné.\n\n[target.GetTitledFirstName|U] by byl[Select_CString(target.IsFemale, 'a', '')] bezpochyby nesmírně vděčný[Select_CString(target.IsFemale, 'á', 'ý')], kdybych dal[Select_CString(ROOT.Char.IsFemale, 'a', '')] jasně najevo, že splacení laskavosti neočekávám."
 befriend_ongoing.6011.a: "Přátelé dávají dobrovolně, ne z povinnosti."
 befriend_ongoing.6011.b: "Nemohla by být splacením toho dluhu věčná přátelskost?"
 befriend_ongoing.6011.b.tt: "#F Takto přátelství očividně nefunguje#!"
 befriend_ongoing.6012.desc: "Od chvíle, kdy jsem dal[Select_CString(ROOT.Char.IsFemale, 'a', '')] svůj slib, mě znervózňuje, jakou protislužbu si [owner.GetTitledFirstName] za mou dlužnou laskavost vyžádá. Teď mi však dává najevo, že můj dluh bude považovat za splacený, pokud na [owner.GetTitledFirstName] budu smýšlet příznivě."
 befriend_ongoing.6012.a: "Co z toho chce [owner.GetTitledFirstName] získat?"
 befriend_ongoing.6013.desc: "Mezi mnou a [target.GetTitledFirstName] panují nemalé neshody, způsobené drobným problémem v podobě mého vydírání.\n\nMohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] bych od něj samozřejmě upustit a dát tak najevo, že mé úmysly jsou - koneckonců - jen dobré."
 befriend_ongoing.6013.a: "Přátelství bude vždy mocnější než nátlak."
 befriend_ongoing.6013.b: "Své jediné výhody se vzdát nemohu!"
 befriend_ongoing.6014.desc: "Jaká nesmírná úleva! [owner.GetTitledFirstName] slavnostně přísahal[Select_CString(owner.IsFemale, 'a', '')] na vše svaté, že se vzdá vydírání, kterým mě drží v šachu.\n\nNevím, co k tomu vedlo, ale konečně mám pocit, že mohu zase volně dýchat."
 befriend_ongoing.6014.a: "Díky božské přízni! [ROOT.Char.GetFaith.HighGodNameAlternate] při mně stojí."
 befriend_ongoing.6015.t: "Spřátelení: Nabídka úlevy"
 befriend_ongoing.6015.opening: "Mé snahy sblížit se s [target.GetTitledFirstName] nejsou snadné, z velké části kvůli tlaku, s nímž se musí vyrovnávat.\n\nMožná bych tím pomohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] nám oběma, kdybych zařídil[Select_CString(ROOT.Char.IsFemale, 'a', '')] den, který bude [target.GetTitledFirstName] mít jen pro sebe a během něhož může"
 befriend_ongoing.6015.malicious: " strávit nějaký čas na polích a bavit se nad špínou a nemotorností rolníků."
 befriend_ongoing.6015.benevolent: " rozdávat milodary chudobincům - nebo méně šťastným šlechticům."
 befriend_ongoing.6015.dominant: " vyjet s vojenskou hlídkou a dohlédnout, aby náležitě udržovala pořádek."
 befriend_ongoing.6015.submissive: " věnovat den modlitbám a rozjímání, daleko od požadavků ostatních."
 befriend_ongoing.6015.extroverted: " trávit čas s bezstarostnými dvořany, daleko od zatuchlých zasedání rady a zaprášených správních záznamů."
 befriend_ongoing.6015.introverted: " uniknout náročným dvořanům a rádcům a konečně si dopřát chvíli klidu."
 befriend_ongoing.6015.emotional: " přijít na jiné myšlenky při divadelním představení v [barony.Custom('BaronyTownType')] [barony.GetNameNoTooltip]."
 befriend_ongoing.6015.levelheaded: " získat odstup a znovu si ujasnit své priority."
 befriend_ongoing.6015.a: "Bude to náročné, ale bude to stát za to."
 befriend_ongoing.6015.b: "Mám dost vlastních problémů."
 befriend_ongoing.6016.t: "Nabídka úlevy"
 befriend_ongoing.6016.opening: "K mému překvapení se [owner.GetTitledFirstName] domluvil[Select_CString(owner.IsFemale, 'a', '')] s mými rádci a zařídil[Select_CString(owner.IsFemale, 'a', '')] mi den jen pro sebe, abych si odpočinul[Select_CString(ROOT.Char.IsFemale, 'a', '')] od všeho toho tlaku.\n\nNakonec jsem se řídil[Select_CString(ROOT.Char.IsFemale, 'a', '')] návrhem od [owner.GetFirstName] a den strávil[Select_CString(ROOT.Char.IsFemale, 'a', '')]"
 befriend_ongoing.6016.malicious: " projížďkou po polích a pobaveným sledováním nehorázné špíny a nemotornosti rolníků."
 befriend_ongoing.6016.benevolent: " rozdáváním milodarů chudobincům a méně šťastným šlechticům."
 befriend_ongoing.6016.dominant: " jízdou s vojenskou hlídkou a osobním dohledem nad pořádkem ve svém panství."
 befriend_ongoing.6016.submissive: " o samotě v modlitbách a rozjímání, daleko od požadavků všech ostatních. Společnost mi dělal jen [ROOT.Char.GetFaith.HighGodName]."
 befriend_ongoing.6016.extroverted: " ve společnosti bezstarostných dvořanů, daleko od zatuchlých zasedání rady a zaprášených správních záznamů."
 befriend_ongoing.6016.introverted: " daleko od náročných dvořanů a rádců, a konečně si tak dopřál[Select_CString(ROOT.Char.IsFemale, 'a', '')] vzácnou chvíli klidu."
 befriend_ongoing.6016.emotional: " tím, že jsem při divadelním představení v [barony.Custom('BaronyTownType')] [barony.GetNameNoTooltip] [Select_CString(ROOT.Char.IsFemale, 'přišla', 'přišel')] na jiné myšlenky."
 befriend_ongoing.6016.levelheaded: " získáváním odstupu a nového pohledu, abych znovu zvážil[Select_CString(ROOT.Char.IsFemale, 'a', '')] své priority."
 befriend_ongoing.6016.a: "Tohle jsem potřeboval[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 befriend_ongoing.6017.t: "Spřátelení: Přátelský rozvoj"
 befriend_ongoing.6017.desc: "Mezi mnou a [target.GetTitledFirstName] je mnoho rozdílů. Jedním z nich je i to, že [county.GetNameNoTooltip] na tom není právě nejlépe.\n\n[owner_county.GetNameNoTooltip] však těží z několika postupů, které by mohly pomoci i zde. [target.GetFirstNameNoTooltip] dal jasně najevo, že dobře financovaný projekt rozvoje krajiny by přišel velmi vhod..."
 befriend_ongoing.6017.a: "Skvělý plán!"
 befriend_ongoing.6017.b: "Takové přátelství má sice cenu zlata..."
 befriend_ongoing.6017.b.tt: "#F ... ale zase ne tolika zlata.#!" 
 befriend_ongoing.6018.t: "Přátelský rozvoj"
 befriend_ongoing.6018.desc: "Mé nenápadné náznaky si [owner.GetTitledFirstName] vyložil jako pobídku a financuje rovnou rozsáhlý zavlažovací projekt! [county.GetNameNoTooltip] se tak dočkal skutečně velkorysé investice.\n\nV mnoha ohledech je to možná překročení jistých mezí, ale díky postupům, které se osvědčily v [owner_county.GetNameNoTooltip], může zdejší kraj zbohatnout jako nikdy předtím!"
 befriend_ongoing.6018.a: "Neobvyklé, ale rozhodně to vítám!"
 befriend_ongoing.6019.t: "Spřátelení: Zapeklitý rozhovor"
 befriend_ongoing.6019.desc: "Právě s [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|l], a [opinion_target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('opinion_target'))|l], probírám [ROOT.Char.Custom('education_conversation_subject')|l], když si uvědomím, že [target.GetFirstNameNoTooltip] se v tématu vůbec neorientuje...\n\nZe všech sil se snažím, aby [target.GetFirstNameNoTooltip] nevypadal hloupě, ale úplně ztuhnu, když [opinion_target.GetTitledFirstNameNoTooltip] požádá jednoho z nás o vysvětlení."
 befriend_ongoing.6019.a: "Ať to vysvětlí [target.GetFirstNameNoTooltip], má přece bystrý úsudek!"
 befriend_ongoing.6019.b: "Tak tedy poslouchejte..."
 befriend_ongoing.6019.c: "Nejlepší bude probrat to všichni společně!"
 befriend_ongoing.9001.t: "Spřátelení: Náhodné setkání"
 befriend_ongoing.9001.desc: "[target.GetTitledFirstName] je na cestách a několik nocí stráví v sídle jednoho z mých baronů. Tohle může být příležitost, na kterou jsem čekal!"
 befriend_ongoing.9001.a: "Připravte mou družinu, ihned vyrážíme!"
 befriend_ongoing.9001.b: "Obávám se, že ještě nenastal správný čas..."
 befriend_ongoing.9100.t: "Spřátelení: Narušené vztahy"
 befriend_ongoing.9100.desc: "Právě ke mně dorazila nanejvýš znepokojivá zpráva! [scoped_rival.GetTitledFirstName], [scoped_rival.Custom2('InsultAdjective', ROOT.Char)|l] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_rival'))|l], o mně šíří lživé zvěsti. Podle nich má [target.GetFirstName] uvěřit, že mou snahu o přátelství vede jen cynická touha [Select_CString(target.IsFemale, 'ji', 'ho')] využít."
 befriend_ongoing.9100.a: "Nesmysl! Takovým lžím přece nikdo neuvěří."
 befriend_ongoing.9100.b: "Nedovolím, aby [scoped_rival.GetTitledFirstName] [Select_CString(scoped_rival.IsFemale, 'pošpinila', 'pošpinil')] mé dobré jméno!"
 befriend_ongoing.9100.b.success.desc.tt: "[target.GetFirstNameNoTooltip] uvěří mým slovům"
 befriend_ongoing.9100.b.success.desc.toast: "[target.GetFirstName] uvěřil[Select_CString(target.IsFemale, 'a', '')] mé prosbě"
 befriend_ongoing.9100.b.failure.desc.tt: "Pomluvy, které šíří [scoped_rival.GetFirstNameNoTooltip], se šíří dál"
 befriend_ongoing.9100.c: "Nejlepší bude vůbec nereagovat."
 befriend_ongoing.9101.t: "Spřátelení: Přátelská pomoc"
 befriend_ongoing.9101.desc: "[scoped_friend.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scoped_friend'))|l], si [Select_CString(scoped_friend.IsFemale, 'všimla', 'všiml')] mé snahy získat si přízeň [target.GetTitledFirstName] a nabízí mi pomoc.\n\nUjišťuje mě, že [target.GetFirstNameNoTooltip] má velmi podobnou povahu. [scoped_friend.GetFirstNameNoTooltip] přesně ví, co mám udělat, aby mi [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'začala', 'začal')] důvěřovat."
 befriend_ongoing.9101.a: "Prosím, povídej!"
 befriend_ongoing.9101.b: "Děkuji, ale pomoc nepotřebuji."
 befriend_ongoing.9102.desc: "Poslední dobou jako by [owner.GetFirstName] nemyslel na nic jiného: chce, aby [target.GetFirstName] konečně [Select_CString(target.IsFemale, 'uvěřila', 'uvěřil')] [Select_CString(owner.IsFemale, 'jejím', 'jeho')] dobrým úmyslům. [Select_CString(ROOT.Char.IsFemale, 'Rozhodla', 'Rozhodl')] jsem se proto pomoci.\n\nMá rada [owner.GetFirstNameNoTooltip] nadchla. Prý na mé laskavé gesto nikdy nezapomene."
 befriend_ongoing.9102.a: "Od čeho jsou přátelé?"
 befriend_ongoing.9103.t: "Spřátelení: Strašlivé nedorozumění"
 befriend_ongoing.9103.vassal.desc: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'měla být překvapena', 'měl být překvapen')] velkolepou hostinou uspořádanou na [Select_CString(target.IsFemale, 'její', 'jeho')] počest, jenže svou účast na poslední chvíli [Select_CString(target.IsFemale, 'odřekla', 'odřekl')].\n\nZdá se, že celou věc [Select_CString(target.IsFemale, 'považovala', 'považoval')] za součást spiknutí, které [Select_CString(target.IsFemale, 'ji', 'ho')] mělo zavraždit!"
 befriend_ongoing.9103.ruler.desc: "[Select_CString(ROOT.Char.IsFemale, 'Vyslala', 'Vyslal')] jsem nedávno posla ke dvoru, kde sídlí [target.GetTitledFirstName], aby vylíčil bohatství a moc [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] a snad tím vzbudil respekt.\n\nZ jeho zprávy však vyplývá, že jsem [Select_CString(ROOT.Char.IsFemale, 'zanechala', 'zanechal')] úplně jiný dojem. [target.GetTitledFirstName|U] si myslí, že vyhrožuji invazí do [target.GetPrimaryTitle.GetNameNoTierNoTooltip], pokud se mi nepodvolí!"
 befriend_ongoing.9103.a: "Ať si [target.GetTitledFirstName] myslí, co chce."
 befriend_ongoing.9103.b: "Možná je na místě omluva."
 befriend_ongoing.9104.t: "Spřátelení: Přátelská obětina"
 befriend_ongoing.9104.desc: "Jak si lépe naklonit [Select_CString(target.IsFemale, 'zbožnou ženu', 'zbožného muže')], jako je [target.GetTitledFirstName], než veřejným projevem oddanosti? [owner.GetFaith.HighGodName] jistě uvidí, jak pevná je má víra.\n\nJen jaké gesto by bylo pro tuto příležitost nejvhodnější..."
 befriend_ongoing.9104.a: "Veřejné pokoření by mělo zabrat."
 befriend_ongoing.9104.b: "Ať [target.GetFaith.HouseOfWorship|l] obdrží štědrý dar."
 befriend_ongoing.9104.c: "Krev nevinného prokáže pevnost mého přesvědčení!"
 befriend_ongoing.9104.d: "Má bolest bude důkazem mé lásky! [owner.GetFaith.HighGodName] to uvidí."
 befriend_ongoing.9104.e: "Co kdyby se oltář stal místem našeho spojení?"
 befriend_ongoing.9104.e.tt: "#F [target.GetTitledFirstName] se ke mně připojí při posvátném obcování#!"
 befriend_ongoing.9104.f: "Ať [scoped_mate.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_mate'))|l], utiší žízeň, kterou [target.GetTitledFirstName] pociťuje!"
 befriend_ongoing.9104.f.tt: "#F Za mě promluví [scoped_mate.GetFirstName]; [target.GetTitledFirstName] vyslechne [Select_CString(scoped_mate.IsFemale, 'její', 'jeho')] přímluvu#!"
 befriend_ongoing.9104.g: "[target.GetFaith.HouseOfWorship|U] se stane mým novým domovem."
 befriend_ongoing.9104.h: "Ať [scoped_monk.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_monk'))|l], zasvětí svůj život bohoslužbě."
 befriend_ongoing.9104.z: "Když se nad tím zamyslím..."
