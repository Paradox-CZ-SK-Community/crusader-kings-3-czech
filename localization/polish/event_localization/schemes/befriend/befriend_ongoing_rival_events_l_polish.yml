l_polish:
 befriend_ongoing_rival.3000.t: "Spřátelení: Křehká rovnováha"
 befriend_ongoing_rival.0001.t: "Spřátelení: Vráceno odesílateli"
 befriend_ongoing_rival.0001.desc: "Když jsem [Select_CString(ROOT.Char.IsFemale, 'psala', 'psal')] dopis pro [target.GetTitledFirstName], pečlivě jsem [Select_CString(ROOT.Char.IsFemale, 'zvažovala', 'zvažoval')] každé slovo. Ani po odložení brku a návratu do svých komnat jsem [Select_CString(ROOT.Char.IsFemale, 'nedokázala', 'nedokázal')] přestat přemýšlet nad obraty a skrytými významy, které by mohly vyvolat nelibost.\n\nDo dopisu jsem [Select_CString(ROOT.Char.IsFemale, 'vkládala', 'vkládal')] velké naděje... [Select_CString(ROOT.Char.IsFemale, 'Věřila', 'Věřil')] jsem, že se stane zlomem v mém úsilí, ale krutě jsem se [Select_CString(ROOT.Char.IsFemale, 'mýlila', 'mýlil')]. Dnes se mi vrátil neotevřený!"
 befriend_ongoing_rival.0001.a: "Taková nevděčnost od někoho, kdo je [target.Custom2('InsultNoun', ROOT.Char)]!"
 befriend_ongoing_rival.0002.t: "Spřátelení: Hádka na ostří nože"
 befriend_ongoing_rival.0002.desc: "S [target.GetTitledFirstName] jsem [Select_CString(ROOT.Char.IsFemale, 'strávila', 'strávil')] dost času na to, abych věděl, že o [target.Custom('herhis_subject_of_interest')] dokáže mluvit celé hodiny. [Select_CString(ROOT.Char.IsFemale, 'Nastudovala', 'Nastudoval')] jsem si tedy potřebné informace a [Select_CString(ROOT.Char.IsFemale, 'připravila', 'připravil')] několik otázek s nadějí na plodnou debatu.\n\nJenže jsem se šeredně [Select_CString(ROOT.Char.IsFemale, 'mýlila', 'mýlil')]. Během několika minut jsme narazili na něco, v čem jsme se neshodli, a debata se vzápětí zvrhla v zuřivé překřikování."
 befriend_ongoing_rival_0002.a: "Spolknu svou hrdost a přikloním se k názoru, který zastává [target.GetFirstNameNoTooltip]."
 befriend_ongoing_rival_0002.b: "Kdyby to tak [target.GetFirstNameNoTooltip] konečně [Select_CString(target.IsFemale, 'pochopila', 'pochopil')]..."
 befriend_ongoing_rival_0002.b.tt: "Výsledek pozitivně či negativně ovlivní postup mé intriky."
 befriend_ongoing_rival_0002.c: "S tak směšným názorem nikdy nemohu souhlasit!"
 befriend_ongoing_rival.0003.t: "Spřátelení: Společná řeč"
 befriend_ongoing_rival.0003.desc: "Stálo nás to pořádnou dávku hádek a nadávek, ale nakonec se zdá, že jsme s [target.GetTitledFirstName] v této otázce přece jen našli společnou řeč. \n\nMožná jsme se nerozešli jako přátelé, ale mám pocit, že se někam posouváme."
 befriend_ongoing_rival_0003.a: "Možná pro nás přece jen ještě je naděje."
 befriend_ongoing_rival.0004.t: "Spřátelení: Hloupá chyba"
 befriend_ongoing_rival.0004.desc: "Zoufale jsem se [Select_CString(ROOT.Char.IsFemale, 'snažila', 'snažil')] vysvětlit svůj názor tak, aby jej [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'dokázala', 'dokázal')] pochopit ze svého pohledu, ale nakonec jsem se jen [Select_CString(ROOT.Char.IsFemale, 'zamotala', 'zamotal')] do vlastních argumentů. \n\n[target.GetTitledFirstName] tak [Select_CString(target.IsFemale, 'dostala', 'dostal')] spoustu příležitostí mé argumenty rozcupovat a já z celé hádky [Select_CString(ROOT.Char.IsFemale, 'vyšla', 'vyšel')] jako naprostý hlupák."
 befriend_ongoing_rival_0004.a: "Tentokrát má možná navrch [target.GetTitledFirstNameNoTooltip]..."
 befriend_ongoing_rival.0005.t: "Spřátelení: Ve špatném světle"
 befriend_ongoing_rival.0005.desc: "Když mě [spymaster.GetTitledFirstName] [Select_CString(spymaster.IsFemale, 'upozornila', 'upozornil')] na odpornou pověst, která se o mně šíří u dvora, krev se ve mně začala vařit. Na můj příkaz se [spymaster.GetTitledFirstName] [Select_CString(spymaster.IsFemale, 'pustila', 'pustil')] do pátrání po jejím původu a nijak mě nepřekvapilo, když se ukázalo, že za ní nestojí nikdo jiný než [target.GetTitledFirstName]. \n\n[ROOT.Char.GetFaith.HighGodName], proč ten prolhaný [target.Custom2('InsultNoun', ROOT.Char)] s těmi nesmysly nepřestane?!"
 befriend_ongoing_rival_0005.a: "Musím se bránit proti odporným lžím, které [target.GetFirstNameNoTooltip] šíří!"
 befriend_ongoing_rival_0005.b: "Teď bude možná nejlepší nechat to vyšumět."
 befriend_ongoing_rival.2000.t: "Spřátelení: Pohlazení ega"
 befriend_ongoing_rival.2000.desc: "[target.GetTitledFirstName] má bezpochyby řadu špatných stránek a já se vždy soustředím jen na ně, což mi při mém současném cíli příliš nepomáhá. Určitě však musí mít i obdivuhodné přednosti.\n\nNenápadná, ale upřímně míněná pochvala jedné z těchto předností by mohla být dobrý nápad."
 befriend_ongoing_rival_2000.a: "Ačkoli jsme se už mnohokrát pohádali, [target.GetFirstNameNoTooltip] má dobré srdce."
 befriend_ongoing_rival_2000.b: "[target.GetFirstNameNoTooltip] si přece jen dokáže zjednat respekt."
 befriend_ongoing_rival_2000.c:: "[target.GetFirstNameNoTooltip] to s lidmi opravdu umí."
 befriend_ongoing_rival_2000.d: "[target.GetFirstNameNoTooltip] si většinou zachovává chladnou hlavu."
 befriend_ongoing_rival_2000.tt: "#F Upřímná pochvala by mé intrice pomohla, ale špatně zvolená by mohla dopadnout přesně opačně.#!"
 befriend_ongoing_rival_2000.a.tt: "Vyzdvihni, že [target.GetFirstName] má laskavou povahu"
 befriend_ongoing_rival_2000.b.tt: "Vyzdvihni, že [target.GetFirstName] si dokáže zjednat respekt"
 befriend_ongoing_rival_2000.c.tt: "Vyzdvihni, že [target.GetFirstName] umí jednat s lidmi"
 befriend_ongoing_rival_2000.d.tt: "Vyzdvihni, že [target.GetFirstName] si zachovává chladnou hlavu"
 befriend_ongoing_rival.2001.t: "Spřátelení: Síla uznání"
 befriend_ongoing_rival.2001.intro: "[Select_CString(ROOT.Char.IsFemale, 'Postarala', 'Postaral')] jsem se, aby [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'zaslechla', 'zaslechl')], když jsem se [Select_CString(ROOT.Char.IsFemale, 'zmínila', 'zmínil')] o tom,"
 befriend_ongoing_rival.2001.benevolent: "že štědrost, kterou [target.GetTitledFirstName] projevuje, je podle mě příkladem hodným následování."
 befriend_ongoing_rival.2001.dominant: "že kdykoli [target.GetTitledFirstName] vstoupí do místnosti, okamžitě na sebe strhne pozornost všech."
 befriend_ongoing_rival.2001.extroverted: "že [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'bývá všude vítanou hostkou', 'bývá všude vítaným hostem')] a vždy dokáže rozproudit zábavu."
 befriend_ongoing_rival.2001.levelheaded: "že navzdory všem našim sporům jsem vždy [Select_CString(ROOT.Char.IsFemale, 'obdivovala', 'obdivoval')], jak si [target.GetTitledFirstName] dokáže zachovat chladnou hlavu."
 befriend_ongoing_rival.2001.end: "\n\nPozději se ke mně doneslo, že [target.GetTitledFirstName] po zaslechnutí mých slov jen stěží [Select_CString(target.IsFemale, 'skrývala', 'skrýval')] spokojený úsměv."
 befriend_ongoing_rival_2001.a: "Upřímná pochvala dokáže skutečné divy."
 befriend_ongoing_rival.2002.t: "Spřátelení: Osudné nedorozumění"
 befriend_ongoing_rival.2002.end: "\n\nPotom za mnou [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'přišla', 'přišel')] a já si [Select_CString(ROOT.Char.IsFemale, 'myslela', 'myslel')], že mi jde poděkovat! Alespoň dokud jsem si [Select_CString(ROOT.Char.IsFemale, 'nevšimla', 'nevšiml')], jak zuřivě se tváří... Ukázalo se, že mou snahu o pochvalu [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'pochopila', 'pochopil')] jako jízlivý výsměch."
 befriend_ongoing_rival_2002.a: "Vůbec jsem [Select_CString(ROOT.Char.IsFemale, 'neměla', 'neměl')] otevírat pusu..."
 befriend_ongoing_rival.2003.t: "Spřátelení: To je trapné"
 befriend_ongoing_rival.2003.end: "\n\n[Select_CString(ROOT.Char.IsFemale, 'Ohlédla', 'Ohlédl')] jsem se a [Select_CString(ROOT.Char.IsFemale, 'čekala', 'čekal')] alespoň nepatrný náznak spokojenosti, jenže [target.GetTitledFirstNameNoTooltip] [Select_CString(target.IsFemale, 'vypadala', 'vypadal')] spíš zmateně, možná dokonce trochu podrážděně."
 befriend_ongoing_rival_2003.a: "Možná jsem si to [Select_CString(ROOT.Char.IsFemale, 'měla', 'měl')] ještě trochu promyslet..."
