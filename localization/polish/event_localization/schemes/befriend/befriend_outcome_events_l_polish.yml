l_polish:
 befriend_outcome.1001.t: "Spřátelení: Příjemný večer"
 befriend_outcome.1001.desc: "Když jsem se [Select_CString(ROOT.Char.IsFemale, 'dozvěděla', 'dozvěděl')], že [target.GetTitledFirstName] bude hostem na jednom z panství v [barony.Custom('BaronyTownType')] [barony.GetNameNoTier], [Select_CString(ROOT.Char.IsFemale, 'uvědomila', 'uvědomil')] jsem si, že je to skvělá příležitost se s [target.GetTitledFirstName] setkat.\n\n"
 befriend_outcome.1002.t: "Spřátelení: Na tanci"
 befriend_outcome.1002.desc: "Když jsem se [Select_CString(ROOT.Char.IsFemale, 'dozvěděla', 'dozvěděl')], že [target.GetTitledFirstName] půjde na tanec v [barony.Custom('BaronyTownType')] [barony.GetNameNoTier], [Select_CString(ROOT.Char.IsFemale, 'rozhodla', 'rozhodl')] jsem se, že je to skvělá příležitost se tam zastavit a konečně si s [target.GetTitledFirstName] promluvit tváří v tvář!\n\n"
 befriend_outcome.1201.t: "Spřátelení: Formální setkání"
 befriend_outcome.1201.desc: "Navzdory našim předchozím neshodám navrhli rádcové, kteří slouží [target.GetTitledFirstName], abychom se sešli, vyjasnili si své spory a tentokrát nechali meče stranou.\n\n"
 befriend_outcome.1301.t: "Spřátelení: Panství"
 befriend_outcome.1301.desc: "Po dlouhém přemýšlení jsem se nakonec [Select_CString(ROOT.Char.IsFemale, 'rozhodla', 'rozhodl')] pozvat [target.GetTitledFirstName] na prohlídku jednoho ze svých panství v [barony.GetNameNoTier]."
 befriend_outcome.2001.t: "Spřátelení: Příjemný večer"
 befriend_outcome.2001.desc: "Na mou žádost mě během večeře posadili hned vedle [target.GetTitledFirstName] a oba jsme si večer náramně užili! Překvapilo mě, o kolika věcech si spolu dokážeme povídat."
 befriend_outcome.2001.a: "To je ale příjemný [Select_CString(target.IsFemale, 'člověk', 'člověk')]!"
 befriend_outcome.2002.t: "Spřátelení: Tanec"
 befriend_outcome.2002.desc: "Ples byl nádherný a [target.GetTitledFirstName] se opravdu [Select_CString(target.IsFemale, 'předvedla', 'předvedl')]! Potom jsem [Select_CString(ROOT.Char.IsFemale, 'řekla', 'řekl')], jaký dojem to na mě udělalo, a dali jsme se do řeči."
 befriend_outcome.2002.a: "To byl ale vydařený den!"
 befriend_outcome.2003.t: "Spřátelení: Večer ve dvou"
 befriend_outcome.2003.opening: "Po náročných přípravách se mi konečně podařilo strávit večer o samotě s [target.GetTitledFirstName] a"
 befriend_outcome.2004.opening: "Po náročných přípravách se mi konečně podařilo strávit nějaký čas o samotě s [target.GetTitledFirstName]."
 befriend_outcome.2003.same_fame: "zavzpomínat na uplynulé časy a minulé činy a podivovat se nad tím, v jak zvláštním světě žijeme."
 befriend_outcome.2003.same_lifestyle: "povídat si o věcech, pro které stojí za to žít, a podělit se o několik dobrých příběhů."
 befriend_outcome.2003.same_education: "rozmlouvat o [ROOT.GetCharacter.Custom('education_conversation_subject')]."
 befriend_outcome.2003.deceitful: "Konečně se mi podařilo strávit nějaký čas s [target.GetTitledFirstName] a rozmlouvat o [target.Custom('education_conversation_subject')]. Naštěstí si [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'nevšimla', 'nevšiml')], že tomu, o čem mluvím, sotva rozumím."
 befriend_outcome.2003.fallback: "podělit se o několik příběhů a objevit společné zájmy."
 befriend_outcome.2003.great_time: "\n\nKdyž jsem [Select_CString(ROOT.Char.IsFemale, 'odcházela', 'odcházel')], [target.GetTitledFirstName] mi [Select_CString(target.IsFemale, 'řekla', 'řekl')], že bylo příjemné mluvit s někým, kdo [target.GetTitledFirstName] skutečně rozumí. Nemohl jsem než souhlasit."
 befriend_outcome.2003.a: "Nikdy jsme si nebyli bližší."
 befriend_outcome.2201.t: "Spřátelení: Plodná diplomacie"
 befriend_outcome.2201.desc: "Když jsme si s [target.GetTitledFirstName] konečně sedli spíše jako sobě rovní než jako nepřátelé, mám pocit, že jsem se toho o [target.GetTitledFirstName] dozvěděl mnohem víc. I [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'pochopila', 'pochopil')], že časem můžeme najít společnou řeč."
 befriend_outcome.2201.a: "Než jsem [Select_CString(ROOT.Char.IsFemale, 'odešla', 'odešel')], [target.GetTitledFirstName] se na mě dokonce [Select_CString(target.IsFemale, 'usmála', 'usmál')]."
 befriend_outcome.2301.desc: "\n\nNávštěva se ukázala být ještě lepším nápadem, než jsem [Select_CString(ROOT.Char.IsFemale, 'čekala', 'čekal')]. [target.GetTitledFirstName] nejen [Select_CString(target.IsFemale, 'přinesla', 'přinesl')] nečekaně cenné postřehy ohledně panství, ale po celou dobu mě také [Select_CString(target.IsFemale, 'udržovala', 'udržoval')] v dobré náladě."
 befriend_outcome.2301.increase_opinion: "Mám pocit, že se teď známe způsobem, jakým jsme se dříve neznali."
 befriend_outcome.2301.a: "Ta cesta stála za námahu."
 befriend_outcome.4001.t: "Spřátelení: Trapná večeře"
 befriend_outcome.4001.desc: "Když přišel čas večeře, posadili mě hned vedle [target.GetTitledFirstName], ale po celou dobu jsem ze sebe [Select_CString(ROOT.Char.IsFemale, 'nedokázala', 'nedokázal')] dostat nic zajímavého!"
 befriend_outcome.4001.b: "Argh, vzdávám to!"
 befriend_outcome.4002.t: "Spřátelení: Tanec"
 befriend_outcome.4002.desc: "Den tance přivítala šedivá obloha a místo veselí, které jsem [Select_CString(ROOT.Char.IsFemale, 'očekávala', 'očekával')], panovala pochmurná nálada."
 befriend_outcome.4002.a: "Tak tedy až příště, kdy se s [target.GetTitledFirstName] setkám!"
 befriend_outcome.4002.b: "To je beznadějné..."
 befriend_outcome.4003.t: "Spřátelení: Omyl"
 befriend_outcome.4003.same_fame: "Protože jsme s [target.GetTitledFirstName] proslulí mnoha podobnými věcmi, [Select_CString(ROOT.Char.IsFemale, 'myslela', 'myslel')] jsem si, že toho budeme mít hodně společného. Jestli tomu tak ale opravdu je, mně se nic najít nepodařilo."
 befriend_outcome.4003.same_lifestyle: "[Select_CString(ROOT.Char.IsFemale, 'Byla', 'Byl')] jsem si tak [Select_CString(ROOT.Char.IsFemale, 'jistá', 'jistý')], že s [target.GetTitledFirstName] žijeme velmi podobným způsobem, ale po několika hodinách rozhovoru už si tím zdaleka tak [Select_CString(ROOT.Char.IsFemale, 'jistá', 'jistý')] nejsem..."
 befriend_outcome.4003.same_education: "Opravdu jsem [Select_CString(ROOT.Char.IsFemale, 'věřila', 'věřil')], že s [target.GetTitledFirstName] vidíme svět podobně, ale po několika hodinách dohadování o [target.Custom('education_conversation_subject')], během nichž jsme nenašli jediný společný bod, jsem si [Select_CString(ROOT.Char.IsFemale, 'musela', 'musel')] přiznat, jak strašně jsem se [Select_CString(ROOT.Char.IsFemale, 'mýlila', 'mýlil')]."
 befriend_outcome.4003.deceitful: "[Select_CString(ROOT.Char.IsFemale, 'Myslela', 'Myslel')] jsem si, že dokážu předstírat znalosti o čemkoli, o čem by [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'chtěla', 'chtěl')] hovořit, ale třetí hodinu rozhovoru o [target.Custom('education_conversation_subject')] už se veškerá má snaha o příjemnou společnost zcela rozpadla."
 befriend_outcome.4003.fallback: "Navzdory tomu, co jsem si zprvu [Select_CString(ROOT.Char.IsFemale, 'myslela', 'myslel')], se mi nepodařilo najít vůbec nic, co bychom s [target.GetTitledFirstName] měli společného a co by nás mohlo sblížit."
 befriend_outcome.4003.bad_time: "\n\n[Select_CString(ROOT.Char.IsFemale, 'Odcházela', 'Odcházel')] jsem sklíčeně a zdálo se, že [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'byla', 'byl')] jen [Select_CString(target.IsFemale, 'ráda', 'rád')], že mě vidí odcházet."
 befriend_outcome.4003.b: "Našemu přátelství zkrátka nebylo souzeno."
 befriend_outcome.4201.t: "Spřátelení: Chladné setkání"
 befriend_outcome.4201.desc: "Bohužel, ačkoli bylo naše setkání vedeno dobrými úmysly, nakonec mi jen připomnělo, proč spolu nevycházíme."
 befriend_outcome.4201.b: "Neměl[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem se o to vůbec pokoušet."
 befriend_outcome.4301.desc: "\n\nBohužel se cesta ukázala jako katastrofální nápad. [target.GetTitledFirstName] se na ni [Select_CString(target.IsFemale, 'špatně připravila', 'špatně připravil')] a pokaždé, když jsem se [Select_CString(ROOT.Char.IsFemale, 'pokusila', 'pokusil')] zlepšit náladu, [Select_CString(target.IsFemale, 'reagovala', 'reagoval')] jen sotva skrývanou nevolí."
 befriend_outcome.4301.b: "Po tom všem se vzdávám."
 befriend_outcome.6001.begin_friendship: "\n\nKdyž přišel čas odchodu, připadalo mi, jako bychom se znali celý život."
 befriend_outcome.6301.begin_friendship: "\n\n[target.GetTitledFirstName] není jen můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], ale také [Select_CString(target.IsFemale, 'přítelkyně', 'přítel')]."
 befriend_outcome.8001.disastrous_time: "\n\nPři odchodu bych [Select_CString(ROOT.Char.IsFemale, 'přísahala', 'přísahal')], že po mně [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'vrhla', 'vrhl')] jeden z nejodpornějších pohledů, jaké mi kdy kdo věnoval."
 befriend_outcome.8201.disastrous_time: "\n\nV jednu chvíli se mi dokonce podařilo nedopatřením urazit #EMP jak#! [Select_CString(target.IsFemale, 'její', 'jeho')] matku, #EMP tak#! [Select_CString(target.IsFemale, 'jejího', 'jeho')] oblíbeného koně."
 befriend_outcome.8301.disastrous_time: "\n\nPo návratu se mnou [target.GetTitledFirstName] skoro nechce ani mluvit!"
 befriend_outcome.9800.t: "Spřátelení: Sdílený žal je poloviční žal"
 befriend_outcome.9800.desc: "Když mi špehové pověděli, že [target.GetTitledFirstName] každoročně chodí k"
 befriend_outcome.9800.desc_same_parent.our_parent: "[Select_CString(target_dead_parent.IsFemale, 'hrobu naší matky', 'hrobu našeho otce')],"
 befriend_outcome.9800.desc_strangers.their_parent: "[Select_CString(target_dead_parent.IsFemale, 'hrobu své matky', 'hrobu svého otce')],"
 befriend_outcome.9800.mid.desc: "okamžitě mi došlo, že je to ta nejlepší příležitost překlenout propast mezi námi.\n\nKdyž ten den nadejde, nacházím [target.GetTitledFirstNameNoTooltip] klečet před náhrobkem.\n\n„Odpusť, že vyrušuji,“ říkám tiše."
 befriend_outcome.9800.desc_same_parent.dialogue: "„Vím, jak moc pro tebe [Select_CString(target_dead_parent.IsFemale, 'matka znamenala', 'otec znamenal')]. Také mi chybí.“"
 befriend_outcome.9800.desc_strangers.dialogue: "„Chci ti vyjádřit soustrast. Také vím, jaké to je přijít o rodiče.“"
 befriend_outcome.9800.end: "\n\nNakonec si několik hodin vyprávíme o blízkých, které jsme ztratili, a rozcházíme se s lehčí duší."
 befriend_outcome.9800.a: "Náš žal nás sbližuje."
 befriend_outcome.9900.t: "Spřátelení: Nezvladatelné emoce"
 befriend_outcome.9900.end: "Bohužel, sotva mě [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'zahlédla', 'zahlédl')], [Select_CString(target.IsFemale, 'vyskočila', 'vyskočil')] na nohy a rozzuřeně se na mě [Select_CString(target.IsFemale, 'vrhla', 'vrhl')]."
 befriend_outcome.9900.b: "...Přišel jsem snad nevhod?"
 befriend_outcome.0002.t: "Přátelství: [owner.GetTitledFirstNameNoTooltip]"
 befriend_outcome.0002.critsucc.desc: "Už nějakou dobu je zřejmé, že [owner.GetTitledFirstName] se se mnou snaží [GetScheme('befriend').GetTypeName|l].\n\nUž několikrát se ukázalo, že [owner.GetTitledFirstName] je [Select_CString(owner.IsFemale, 'spolehlivá a upřímná žena', 'spolehlivý a upřímný muž')], které[Select_CString(owner.IsFemale, 'é', 'mu')] skutečně leží na srdci jen mé dobro."
 befriend_outcome.0002.succ.desc: "Už nějakou dobu je zřejmé, že [owner.GetTitledFirstName] se se mnou snaží [GetScheme('befriend').GetTypeName|l].\n\nZačínám si uvědomovat, kolik toho máme společného a jak spolehlivě se na [owner.GetTitledFirstName] během posledních několika měsíců mohu spolehnout."
 befriend_outcome.0002.fail.desc: "Už nějakou dobu je zřejmé, že [owner.GetTitledFirstName] se se mnou snaží [GetScheme('befriend').GetTypeName|l].\n\nNemohu si pomoci, ale ten náhlý zájem, který o mě [owner.GetTitledFirstName] projevuje, mě dráždí. A nemohu se zbavit pocitu, že za ním nejsou čisté úmysly..."
 befriend_outcome.0002.critfail.desc: "Už nějakou dobu je zřejmé, že [owner.GetTitledFirstName] se se mnou snaží [GetScheme('befriend').GetTypeName|l].\n\nNemohu si pomoci, ale ten náhlý zájem, který o mě [owner.GetTitledFirstName] projevuje, mě dráždí. Jestli něco, pak [owner.GetTitledFirstName] svou posedlou snahou zapůsobit na mě a neobratnými projevy předstírané náklonnosti jen [Select_CString(owner.IsFemale, 'prohloubila', 'prohloubil')] mou nechuť."
 befriend_outcome.0002.a: "Skutečného přítele člověk najde jen zřídka."
 befriend_outcome.0002.b.success: "Měli bychom spolu trávit víc času!"
 befriend_outcome.0002.b.failure: "Ale [owner.GetTitledFirstName] má přece jen jisté kouzlo..."
 befriend_outcome.0002.c.success: "Stále mám pochybnosti."
 befriend_outcome.0002.c.failure: "Proč mě [owner.GetTitledFirstName] nemůže nechat na pokoji?"
 befriend_outcome.0002.d: "Už nikdy nechci, aby se mi [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'ukázala', 'ukázal')] na oči!"
 befriend_outcome.2004.t: "Spřátelení: Spřízněné duše"
 befriend_outcome.2004.spouse: "\n\nKdyž jsme se na konci večera vrátili do svých komnat, bylo znát, že [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|l] se v mé společnosti cítí mnohem uvolněněji a je ke mně vstřícnější."
 befriend_outcome.2004.relative: "\n\nPotěšilo mě, že máme příležitost upevnit naše rodinné pouto, a soudě podle [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))|l] chování na konci večera to potěšilo i [target.GetTitledFirstName]."
 befriend_outcome.2004.vassal: "\n\nNa konci večeře mi [target.GetTitledFirstNameNoTooltip] [Select_CString(target.IsFemale, 'řekla', 'řekl')], že si velice váží toho, že má [Select_CString(ROOT.Char.IsFemale, 'tak pohostinnou a srdečnou lenní paní', 'tak pohostinného a srdečného lenního pána')], a doufá, že se v budoucnu naskytne příležitost mou laskavost oplatit."
 befriend_outcome.2004.liege: "\n\nNa znamení vděčnosti se jen několik dní po našem soukromém setkání [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|l] [Select_CString(target.IsFemale, 'rozhodla', 'rozhodl')] před celým dvorem vychválit mou pohostinnost a [Select_CString(target.IsFemale, 'prohlásila', 'prohlásil')], že má štěstí, když má pod svou ochranou [Select_CString(ROOT.Char.IsFemale, 'tak věrnou a pohostinnou vazalku, jako jsem já', 'tak věrného a pohostinného vazala, jako jsem já')]."
 befriend_outcome.2004.outsider: "\n\nNakonec ani vzdálenost nebyla tak velkou překážkou, aby mi zabránila získat [target.GetTitledFirstNamePossessiveNoTooltip] důvěru a přátelství. Mohu jen doufat, že pouto, které jsme dnes vytvořili, bude v příštích letech dál sílit."
 befriend_outcome.2004.fallback: "\n\nBěhem našeho setkání jsme dostali příležitost poznat se mnohem lépe. Opravdu věřím, že nám společně strávený večer výrazně pomohl vybudovat vzájemnou důvěru."
 befriend_outcome.6004.spouse: "\n\nKdyž jsme se na konci večera vrátili do svých komnat, bylo mi jasné, že [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|l] si zaslouží mou naprostou důvěru a že [target.GetTitledFirstName] cítí totéž vůči mně."
 befriend_outcome.6004.relative: "\n\nPotěšilo mě, že máme příležitost upevnit naše rodinné pouto, a na konci večeře už nebylo pochyb, že [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('target'))|l] pocity jsou stejné."
 befriend_outcome.6004.vassal: "\n\nNa konci večeře už [target.GetTitledFirstNameNoTooltip] [Select_CString(target.IsFemale, 'věřila', 'věřil')], že mi skutečně leží na srdci [Select_CString(target.IsFemale, 'její', 'jeho')] dobro, a já mám stejnou důvěru v [target.GetTitledFirstNameNoTooltip]. Díky mému úsilí mezi námi vzniklo pouto důvěry a věrnosti, jaké se mezi lenním pánem a vazalem podaří vytvořit jen málokdy."
 befriend_outcome.6004.liege: "\n\nNa znamení vděčnosti se jen několik dní po našem soukromém setkání [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|l] [Select_CString(target.IsFemale, 'rozhodla', 'rozhodl')] před celým dvorem vychválit mou pohostinnost a [Select_CString(target.IsFemale, 'prohlásila', 'prohlásil')], že má štěstí, když má pod svou ochranou [Select_CString(ROOT.Char.IsFemale, 'tak věrnou a pohostinnou vazalku, jako jsem já', 'tak věrného a pohostinného vazala, jako jsem já')], a že je [Select_CString(target.IsFemale, 'hrdá', 'hrdý')], že mě může nazývat [Select_CString(ROOT.Char.IsFemale, 'svou přítelkyní', 'svým přítelem')]."
 befriend_outcome.6004.outsider: "\n\nNakonec ani vzdálenost nebyla tak velkou překážkou, aby mi zabránila získat [target.GetTitledFirstNamePossessiveNoTooltip] důvěru a přátelství. Naše setkání nám umožnilo poznat se natolik dobře, že při loučení mezi námi už panovalo skutečné přátelství."
 befriend_outcome.4004.t: "Spřátelení: Nesmiřitelné rozdíly"
 befriend_outcome.4004.spouse: "Přes veškerou mou snahu udělat dojem na [target.GetTitledFirstName] se ke mně [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|l] stále chová s nedůvěrou a odstupem."
 befriend_outcome.4004.relative: "Připadalo mi, že když je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|l] členem mé vlastní rodiny, upevnit naše pouto bude snadné... Jaký omyl. Přes veškerou mou snahu nejeví [target.GetTitledFirstName] sebemenší zájem trávit se mnou čas nebo se dozvědět něco o mých zájmech."
 befriend_outcome.4004.vassal: "Přes všechny mé pokusy získat [target.GetTitledFirstNamePossessive] důvěru si [target.GetTitledFirstName] při rozhovoru se mnou stále drží odstup. Zdá se, že rozdíl v našem postavení je příliš velkou překážkou, než aby ji dokázal[Select_CString(target.IsFemale, 'a', '')] překonat."
 befriend_outcome.4004.liege: "[target.GetTitledFirstName] mé četné pokusy získat důvěru vůbec neocenil[Select_CString(target.IsFemale, 'a', '')]. Když se ke mně donesly zvěsti kolující u [target.GetTitledFirstNamePossessive] dvora, došlo mi, že mě [target.GetTitledFirstName] považuje za [Select_CString(ROOT.Char.IsFemale, 'pouhou patolízalku toužící získat přízeň', 'pouhého patolízala toužícího získat přízeň')]."
 befriend_outcome.4004.outsider: "Bohužel se zdá, že rozdíly a vzdálenost mezi mnou a [target.GetTitledFirstName] jsou navzdory veškerému mému odhodlání zkrátka příliš velké. Ani přes všechen čas a úsilí vložené do získání důvěry [target.GetTitledFirstNameNoTooltip] svůj postoj ke mně nijak nezměnil[Select_CString(target.IsFemale, 'a', '')]."
 befriend_outcome.4004.ending: "\n\nObávám se, že v tuto chvíli už nezbývá mnoho, čím bych mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] propast mezi námi překlenout."
 befriend_outcome.8005.desc: "[Select_CString(ROOT.Char.IsFemale, 'Byla jsem hloupá', 'Byl jsem hloupý')], když jsem doufal[Select_CString(ROOT.Char.IsFemale, 'a', '')], že dokážu změnit názor, který na mě [target.GetTitledFirstName] má. \n\n[target.GetTitledFirstName] jen využil[Select_CString(target.IsFemale, 'a', '')] mé nedávné otevřenosti a vstřícnosti k tomu, aby se mi otevřeně vysmíval[Select_CString(target.IsFemale, 'a', '')] a tvrdil[Select_CString(target.IsFemale, 'a', '')], že jsem [Select_CString(owner.IsFemale, 'jen ubohá žena bez přátel, která je ze strachu ze samoty ochotná se ponížit', 'jen ubohý muž bez přátel, který je ze strachu ze samoty ochotný se ponížit')]."
 befriend_outcome.8005.a: "[Select_CString(ROOT.Char.IsFemale, 'Měla', 'Měl')] jsem to od [target.GetTitledFirstName] čekat."
 befriend_outcome.2005.t: "Spřátelení: Konec svárů"
 befriend_outcome.2005.relative: "Zpočátku nebylo snadné přesvědčit [target.GetTitledFirstName] o upřímnosti mých úmyslů, ale krůček po krůčku se mi podařilo dát najevo, že jsem [Select_CString(ROOT.Char.IsFemale, 'připravená', 'připravený')] ukončit naši rivalitu pro dobro nás obou."
 befriend_outcome.2005.vassal: "Neshody s vlastními vazaly nikdy nevěstí nic dobrého. Díky svému diplomatickému úsilí se mi podařilo urovnat spory, které jsem měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] s [target.GetTitledFirstName].\n\nS trochou štěstí se časem naučíme jeden druhému více důvěřovat. Prozatím mě těší už jen to, že mezi námi nepanuje nepřátelství."
 befriend_outcome.2005.liege: "Stabilita každého panství závisí na vzájemném respektu mezi lenní vrchností a jejími vazaly. Těší mě, že se mi podařilo přesvědčit [target.GetTitledFirstName], že svár mezi námi by našim poddaným přinesl jen zbytečné utrpení.\n\nVelice se mi ulevilo, že jsme své neshody konečně urovnali."
 befriend_outcome.2005.fallback: "Přimět [target.GetTitledFirstName] k setkání, na kterém bychom mohli urovnat své neshody, nebylo snadné. Když jsme si ale konečně sedli a já vysvětlil[Select_CString(ROOT.Char.IsFemale, 'a', '')] důvody našich dřívějších sporů, ukázalo se, že [target.GetTitledFirstName] je mnohem rozumnější, než jsem se obával[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 befriend_outcome.2005.a: "Konečně můžeme začít znovu."
 befriend_outcome.8006.t: "Spřátelení: Nesmiřitelná politika"
 befriend_outcome.8006.desc: "Celý minulý týden jsem se [Select_CString(ROOT.Char.IsFemale, 'scházela', 'scházel')] s [target.GetTitledFirstName] a snažil[Select_CString(ROOT.Char.IsFemale, 'a', '')] se vysvětlit, že není důvod, abychom byli nepřátelé.\n\nBohužel se zdá, že můj pokus usmířit frakci, kterou [target.GetTitledFirstName] vede, ji jen ještě více semkl."
 befriend_outcome.8006.everyfactionmember.custom: "Každý člen [Concept('faction','frakce')|E], kterou vede [target.GetTitledFirstName]"
 befriend_outcome.8006.a: "[Select_CString(ROOT.Char.IsFemale, 'Neměla', 'Neměl')] jsem tomu člověku nikdy věřit."
 befriend_outcome.8007.t: "Spřátelení: Cena důvěry"
 befriend_outcome.8007.desc: "Včera večer jsem se v posledním pokusu získat si [Select_CString(target.IsFemale, 'její náklonnost', 'jeho náklonnost')] [Select_CString(ROOT.Char.IsFemale, 'rozhodla', 'rozhodl')] svěřit [target.GetTitledFirstName] jedno ze svých nejhanebnějších tajemství. Doufal[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že má upřímnost pomůže překlenout propast mezi námi, ale krutě jsem se [Select_CString(ROOT.Char.IsFemale, 'mýlila', 'mýlil')].\n\nTeď mi [target.GetTitledFirstName] vyhrožuje, že mé tajemství prozradí celému dvoru, pokud nepřistoupím na jeho požadavky!"
 befriend_outcome.8007.a: "Dobrá! Kolik potřebuješ?"
 befriend_outcome.8007.b: "Jak si přeješ, drahoušku!"
 befriend_outcome.8007.c: "Nenechám se vydírat někým, kdo mi má být tak blízký!"
 befriend_outcome.8008.t: "Spřátelení: Kněžské neshody"
 befriend_outcome.8008.desc: "Bohužel se zdá, že [target.GetTitledFirstName] považuje mou snahu získat si důvěru za pouhou lest, protože prý jen doufám, že mi [ROOT.Char.GetFaith.HighGodNameAlternate] odpustí mé hříchy.\n\nJako by odmítnutí mé nabídky přátelství nestačilo, [target.GetTitledFirstNameNoTooltip] začal[Select_CString(target.IsFemale, 'a', '')] při kázání mým poddaným špinit mé jméno!"
 befriend_outcome.8008.a: "Dost! Vzdávám to!"
 befriend_outcome.8009.t: "Spřátelení: Nedůstojné podlézání"
 befriend_outcome.8009.desc: "[Select_CString(ROOT.Char.IsFemale, 'Byla jsem přesvědčená', 'Byl jsem přesvědčený')], že když veřejně vychválím četné přednosti a schopné vedení [target.GetTitledFirstName], získám si přízeň. Bohužel jsem se krutě [Select_CString(ROOT.Char.IsFemale, 'mýlila', 'mýlil')].\n\nSotva jsem dokončil[Select_CString(ROOT.Char.IsFemale, 'a', '')] svou řeč, [target.GetTitledFirstNameNoTooltip] se mi před celým dvorem vysmál[Select_CString(target.IsFemale, 'a', '')] a prohlásil[Select_CString(target.IsFemale, 'a', '')], že jsem [Select_CString(owner.IsFemale, 'jen bezpáteřní patolízalka, která se snaží pozvednout vlastní postavení podlézáním mocnějším', 'jen bezpáteřní patolízal, který se snaží pozvednout vlastní postavení podlézáním mocnějším')]."
 befriend_outcome.8009.everycourtier.custom: "Každý člen tamního dvora"
 befriend_outcome.8009.a: "Ale každé slovo jsem myslel[Select_CString(ROOT.Char.IsFemale, 'a', '')] vážně!"
 befriend_outcome.2006.t: "Spřátelení: Vzájemné porozumění"
 befriend_outcome.2006.desc: "Nakonec [target.GetTitledFirstName] na mé naléhání opustil[Select_CString(target.IsFemale, 'a', '')] svou pomýlenou podporu frakci známé jako [targeting_faction.GetName].\n\nUkázalo se, že toho máme společného mnohem víc, než si kdokoli z nás zprvu myslel."
 befriend_outcome.2006.a: "Vždy je dobré vidět, když zvítězí zdravý rozum."
 befriend_outcome.6006.t: "Spřátelení: Politické usmíření"
 befriend_outcome.6006.desc: "Díky svému diplomatickému umu se mi podařilo přesvědčit [target.GetTitledFirstName], aby se nejen vzdal[Select_CString(target.IsFemale, 'a', '')] vedení frakce známé jako [scoped_faction.GetName], ale aby ji rovnou rozpustil[Select_CString(target.IsFemale, 'a', '')], čímž jsme odvrátili hrozbu občanské války."
 befriend_outcome.6007.desc: "Nedokážu pochopit jak, ale [owner.GetTitledFirstName] přesvědčil[Select_CString(owner.IsFemale, 'a', '')] [target.GetTitledFirstName], aby svou frakci rozpustil[Select_CString(target.IsFemale, 'a', '')].\n\nVčera večer [target.GetTitledFirstName] svolal[Select_CString(target.IsFemale, 'a', '')] všechny její členy a prohlásil[Select_CString(target.IsFemale, 'a', '')], že stát na opačné straně než [owner.GetTitledFirstNameNoTooltip] byla chyba a že si přeje náš konflikt vyřešit mírovou cestou."
 befriend_outcome.6007.a.a: "[target.GetTitledFirstNameNoTooltip] nás zradil[Select_CString(target.IsFemale, 'a', '')]!"
 befriend_outcome.6007.a.b: "Možná má pravdu..."
 befriend_outcome.2007.opening_travel: "K mé velké radosti ke mně sem do [current_location.GetName] [target.GetTitledFirstName] vyslal[Select_CString(target.IsFemale, 'a', '')] [Select_CString(courier.IsFemale, 'jednu ze svých poselkyň', 'jednoho ze svých poslů')] právě ve chvíli, kdy má družina pokračuje v cestě, jejímž cílem je [next_destination.GetName].\n\n"
 befriend_outcome.2007.opening_no_travel: "K mé velké radosti ke mně [target.GetTitledFirstName] vyslal[Select_CString(target.IsFemale, 'a', '')] [Select_CString(courier.IsFemale, 'jednu ze svých poselkyň', 'jednoho ze svých poslů')] až sem, kde je [ROOT.Char.Custom('FortifiedBuilding')|l] mým sídlem v oblasti [ROOT.Char.GetCurrentLocation.GetName].\n\n"
 befriend_outcome.2007.desc: "Přináší dobrou zprávu. [target.GetFirstNameNoTooltip] chce naše přátelství stvrdit! Nikdy jsem nečekal[Select_CString(ROOT.Char.IsFemale, 'a', '')], že se tolik sblížíme, ale [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'se ukázala jako spolehlivá a upřímná žena, které skutečně leží na srdci mé dobro', 'se ukázal jako spolehlivý a upřímný muž, kterému skutečně leží na srdci mé dobro')]."
