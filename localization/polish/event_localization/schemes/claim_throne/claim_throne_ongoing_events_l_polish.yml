l_polish:
 claim_throne_ongoing.1001.t: "Zlá znamení"
 claim_throne_ongoing.1001.desc: "Ve své touze vládnout [target_title.GetNameNoTooltip] zjevně nejsem [Select_CString(ROOT.Char.IsFemale, 'sama', 'sám')]! Místem, kde sídlí [target.GetTitledFirstName], je [target.Custom('ResidenceBuilding')|l] a na střechách se tam houfují havrani. Před několika nocemi se dokonce zdálo, jako by z nebe padaly hvězdy. Bylo je vidět po celém území, které nese jméno [target_title.GetNameNoTierNoTooltip].\n\nSedláci i šlechtici šeptají, že je to znamení, že [target.GetFirstNameNoTooltip] ztratil[Select_CString(target.IsFemale, 'a', '')] přízeň [ROOT.Char.GetFaith.PantheonTerm]."
 claim_throne_ongoing.1001.a: "Je čas na změnu! [target.GetTitleAsNameNoTooltip] už nebude [target.GetTitledFirstNameNoTooltip]!"
 claim_throne_ongoing.1001.b: "Jen [ROOT.Char.GetFaith.AltPriestTermPlural] dokážou tato znamení vyložit."
 claim_throne_ongoing.1002.t: "Zasloužená autorita"
 claim_throne_ongoing.1002.desc: "Mým cílem je [target_title.GetName], ale ne kvůli pouhé touze po moci. Jde o obrovskou odpovědnost a jsem jedin[Select_CString(ROOT.Char.IsFemale, 'á', 'ý')], kdo ji dokáže unést! Zdá se, že si to uvědomuje dokonce i [target.GetTitledFirstName], protože mi svěřuje stále důležitější úkoly ve službách panství.\n\nBrzy už možná budu [target_title.GetTierAsNameNoTooltip] řídit ve všem kromě jména..."
 claim_throne_ongoing.1002.a: "„Žádné obavy, [Select_CString(target.IsFemale, 'má lenní paní', 'můj lenní pane')], postarám se i o tohle...“"
 claim_throne_ongoing.1002.b: "Popravdě, začíná toho být trochu moc."
 claim_throne_ongoing.1003.t: "Získávání podpory"
 claim_throne_ongoing.1003.desc: "Dobře vím, že pokud jednou [target_title.GetNameNoTier] připadne mně a titul [target.GetTitleAsName] bude můj, budu potřebovat podporu svých současných spoluvazalů ještě více, než ji má nyní [target.GetTitledFirstName].\n\nUkázat jim už teď štědrost, jakou mohou od držitele titulu [target.GetTitleAsName] očekávat, by mohlo přinést své ovoce."
 claim_throne_ongoing.1003.a: "Pro mé budoucí služebníky není nic příliš dobré!"
 claim_throne_ongoing.1003.b: "Pro nadcházející boj budu potřebovat všechno své zlato."
 claim_throne_ongoing.1004.t: "Vyhlášení vlády"
 claim_throne_ongoing.1004.desc: "Mohlo by se zdát, že si vládu nad [target_title.GetName] teprve musím vydobýt, ale ve skutečnosti už mám titul s mnohem větší autoritou.\n\nJsem [Select_CString(ROOT.Char.IsFemale, 'Paní všech ředkviček', 'Pán všech ředkviček')] v [target_title.GetNameNoTierNoTooltip]!"
 claim_throne_ongoing.1004.a: "Kasteláne, přines mi mé ředkvičkové pečetidlo!"
 claim_throne_ongoing.1004.b: "Ne, ne [Select_CString(ROOT.Char.IsFemale, 'Paní všech ředkviček', 'Pán všech ředkviček')] v [target_title.GetNameNoTierNoTooltip]..."
 claim_throne_ongoing.1004.b_flavor: "...ale na celém světě!"
 claim_throne_ongoing.1005.t: "[Select_CString(ROOT.Char.IsFemale, 'Paní ředkviček', 'Pán ředkviček')]"
 claim_throne_ongoing.1005.desc: "[Select_CString(ROOT.Char.IsFemale, 'Nechala', 'Nechal')] jsem potrestat několik služebníků za něco, co jsem považoval[Select_CString(ROOT.Char.IsFemale, 'a', '')] za výsměch, když mě oslovovali „Vaše Ředkvičenstvo“. Teď mi však z kancléřské kanceláře přinesli listinu, kterou jsem si nechal[Select_CString(ROOT.Char.IsFemale, 'a', '')] sepsat a v níž na tomto oslovení výslovně trvám.\n\nPřipadá mi to jako krutý žert, který si se mnou zahrává celý svět, ale zároveň se v zamlžených zákoutích mé mysli probouzí jakási matná vzpomínka..."
 claim_throne_ongoing.1005.a: "Co... co jsem to dělal[Select_CString(ROOT.Char.IsFemale, 'a', '')]?"
 claim_throne_ongoing.1005.b: "Já chyby nedělám. Všichni se budete řídit tou listinou."
 claim_throne_ongoing.1006.t: "Neochvějná podpora"
 claim_throne_ongoing.1006.desc: "Stejně jako v mnoha jiných věcech se mnou i [Select_CString(friend.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))], [friend.GetTitledFirstName], souhlasí v tom, že [target_title.GetNameNoTier] si zaslouží schopnější vládu, než jakou nabízí [target.GetTitledFirstName].\n\n„Napadá mě mnoho lepších kandidátů,“ [Select_CString(friend.IsFemale, 'svěří', 'svěří')] se mi [friend.GetTitledFirstName]. „A ty jsi mezi nimi na prvním místě. Stačí říct a máš mou podporu.“"
 claim_throne_ongoing.1006.a: "Přátelství je nejčestnější podobou věrnosti."
 claim_throne_ongoing.1006.b: "Raději ostatním ukaž, že právě já jsem tou správnou volbou."
 claim_throne_ongoing.1007.t: "Vláda meče"
 claim_throne_ongoing.1007.desc: "Mým cílem je [target_title.GetNameNoTier] a zvěsti o mé touze převzít vládu se už začínají šířit. [GetPlayer.Custom( 'KnightCulturePluralNoTooltipLowercase' )] se o tom doslýchají a mezi bojovníky roste nespokojenost, protože mnozí věří, že nastal čas na změnu.\n\nNapětí houstne a právě tehdy za mnou přichází [scheming_knight.GetTitledFirstName], [Select_CString(scheming_knight.IsFemale, 'která patří', 'který patří')] mezi ně. „Naši bojovníci si zaslouží víc. Slib jim spravedlivé zacházení a štědrý měšec zlata a můj meč bude tvůj.“"
 claim_throne_ongoing.1007.a: "Moji $knight_culture_player_plural_no_tooltip_lowercase$ budou vždy na prvním místě! "
 claim_throne_ongoing.1007.b: "$knight_culture_player_no_tooltip_lowercase$, který zradí svou lenní vrchnost, není žádný $knight_culture_player_no_tooltip_lowercase$."
 claim_throne_ongoing.1008.t: "Ošálit všechny"
 claim_throne_ongoing.1008.desc: "Mému úsilí posílit nárok na [target_title.GetName] by možná prospěla trocha lstivosti.\n\nV poslední době koluje po sousedních panstvích dopis hlásající, že se blíží konec. S trochou padělatelského umu a trpělivosti bych určitě dokázal[Select_CString(ROOT.Char.IsFemale, 'a', '')] vytvořit podobný dopis, který by prohlašoval, že místo [target.GetTitledFirstName] mám vládnout já.\n\nJak ale takový dopis nejlépe využít?"
 claim_throne_ongoing.1008.a: "Předveď ho veřejnosti."
 claim_throne_ongoing.1008.b: "Poděl se o něj se svými spoluvazaly."
 claim_throne_ongoing.1008.c: "Nechám to být."
 claim_throne_ongoing.1008.c.tt: "Místo toho využiješ čas rozumněji."
 claim_throne_ongoing.1009.t: "Odhalená lež"
 claim_throne_ongoing.1009.desc: "Zdá se, že [fraud_catcher.GetTitledFirstName] se chce proslavit tvrzením, že můj nedávný dopis je pouhý padělek a žádné z tvrzení v něm není pravdivé.\n\nA co hůř, [target.GetTitledFirstName] tomu všemu věří! Byla má lest odhalena?"
 claim_throne_ongoing.1009.a: "Tohle byla zkouška a vy všichni jste selhali."
 claim_throne_ongoing.1009.b: "Jak se opovažuješ obviňovat mě ze lži?"
 claim_throne_ongoing.1009.b.duel_success: "Přesvědčivě obhájíš své tvrzení"
 tooltip.claim_throne_ongoing.1009.b.duel_success: "Všichni ti naletí"
 claim_throne_ongoing.1009.b.duel_failure: "Nikdo ti to nevěří"
 tooltip.claim_throne_ongoing.1009.b.duel_failure: "Na nikoho nezapůsobíš"
