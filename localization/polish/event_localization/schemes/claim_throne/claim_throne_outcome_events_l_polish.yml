l_polish:
 do_not_execute_claim_throne_tooltip: "Nepokusíš se vznést nárok na [target.GetPrimaryTitle.GetName]"
 claim_throne_outcome.1001.t: "Nárok na trůn"
 claim_throne_outcome.1001.desc: "Po všem tom úsilí konečně nadešel čas předložit důkazy, které se mi „náhodou dostaly do rukou“ a podle nichž mi díky dávnému dynastickému sňatku právem náleží [target_title.GetName].\n\nDokud mi [target.GetTitledFirstName] stojí v cestě, není ničím víc než pouh[Select_CString(target.IsFemale, 'ou pretendentkou', 'ým pretendentem')]!"
 claim_throne_outcome.1001.a: "Brzy bude [target.GetPrimaryTitle.GetNameNoTierNoTooltip] patřit mně!"
 claim_throne_outcome.1001.b: "Možná jednám příliš ukvapeně..."
 claim_throne_outcome.2001.opening: "Konečně už nikdo nemůže pochybovat, že mám oprávněný nárok na [target_title.GetName]!"
 claim_throne_outcome.2001.discovered: "\n\nAčkoli [target.GetTitledFirstName] považuje mé tvrzení o dávném dynastickém sňatku za naprostý výmysl, podstatné je, že je nedokáže vyvrátit."
 claim_throne_outcome.2001.no_awareness: "\n\nPřesné okolnosti dávného dynastického sňatku zahaluje mlha času, ale není důvod pochybovat, že k němu skutečně došlo. Dokonce i [target.GetTitledFirstName] musí uznat, že můj nárok je oprávněný."
 claim_throne_outcome.2001.a: "Teď už mě nic nezastaví!"
 claim_throne_outcome.2001.b: "[target.GetFirstNameNoTooltip] si může stěžovat, jak chce! Nic to nezmění."
 claim_throne_outcome.4001.opening: "Můj nárok na [target_title.GetName] nikoho nepřesvědčil!"
 claim_throne_outcome.4001.owner_discovered: "\n\nA co hůř, [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'odhalila', 'odhalil')] mou snahu zfalšovat záznamy o sňatku mezi dynastií [ROOT.Char.GetDynasty.GetBaseName] a dávnou vládnoucí dynastií [target_title.GetNameNoTierNoTooltip]!"
 claim_throne_outcome.4001.owner_secret: "\n\nAčkoli byly záznamy o sňatku mezi dynastií [ROOT.Char.GetDynasty.GetBaseName] a dávnou vládnoucí dynastií [target_title.GetNameNoTierNoTooltip] odmítnuty jako nevěrohodné, alespoň nikdo nezjistil, že vznikly na můj příkaz."
 claim_throne_outcome.4001.a: "„[Select_CString(target.IsFemale, 'Má lenní paní', 'Můj lenní pane')], chtěl[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem se jen podílet na slávě tvého rodu!“"
 claim_throne_outcome.4001.b: "Dám tomu tolik času, kolik bude třeba."
 claim_throne_outcome.4001.c: "Tahle hra je příliš nebezpečná."
 claim_throne_outcome.1002.desc: "Teď mám téměř nezpochybnitelné důkazy, že můj rod sahá až k [ROOT.Char.Custom('ClaimThroneMythicalFounder')] [ROOT.Char.Custom('ClaimThroneMythicalFounderHerselfHimself')]!\n\nAni [target.GetTitledFirstName] už nemůže popírat oprávněnost mého nároku na [target_title.GetName]."
 claim_throne_outcome.2002.discovered: "\n\nAčkoli [target.GetTitledFirstName] považuje mé tvrzení, že mezi mé předky patří [ROOT.Char.Custom('ClaimThroneMythicalFounder')], za naprostý podvrh, nedokáže je vyvrátit, a na ničem jiném nezáleží."
 claim_throne_outcome.2002.no_awareness: "\n\nKdyž mezi mé předky patří [ROOT.Char.Custom('ClaimThroneMythicalFounder')], kdo by mohl můj nárok považovat za neoprávněný?"
 claim_throne_outcome.4002.owner_discovered: "\n\nUkázalo se, že pro [target.GetTitledFirstName] bylo až překvapivě snadné dokázat, že onen dávný vládce, [owner.Custom('ClaimThroneMythicalFounder')], není mým předkem. [target.GetTitledFirstName] navíc [Select_CString(target.IsFemale, 'poznala', 'poznal')], že všechny mé „důkazy“ jsou naprosto zfalšované!"
 claim_throne_outcome.4002.owner_secret: "\n\nNikdo nevěří, že onen dávný vládce, [owner.Custom('ClaimThroneMythicalFounder')], patří mezi mé předky, ale alespoň [target.GetTitledFirstName] zřejmě netuší, že všechny mé „důkazy“ byly od samého počátku zfalšované."
 claim_throne_outcome.4002.a: "„[Select_CString(target.IsFemale, 'Má lenní paní', 'Můj lenní pane')], šlo mi jen o to podílet se na té slávě!“"
 claim_throne_outcome.1003.desc: "Mám několik svědků ochotných přísahat při [ROOT.Char.GetFaith.PantheonTerm], že [previous_title_holder.GetTitledFirstName], tehdejší [previous_title_holder.GetTitleAsNameNoTooltip] [target_title.GetNameNoTier], si jako své poslední přání [Select_CString(previous_title_holder.IsFemale, 'přála', 'přál')] předat [target.Custom('RealmType')] mně.\n\nAčkoli [target.GetTitledFirstName] můj nárok nejspíš neuzná, ve skutečnosti nepotřebuji přesvědčit právě [target.GetTitledFirstName]..."
 claim_throne_outcome.2003.discovered: "[target.GetTitledFirstName] veřejně označil[Select_CString(target.IsFemale, 'a', '')] slib, který mi dal[Select_CString(previous_holder.IsFemale, 'a', '')] někdejší [previous_holder.GetTitledFirstName], za zoufalou lež. Jenže [target.GetTitledFirstName] tvrdí jedno a posvátné přísahy svědků něco docela jiného."
 claim_throne_outcome.2003.no_awareness: "[previous_holder.GetTitledFirstName] mi dal[Select_CString(previous_holder.IsFemale, 'a', '')] slib a tolik lidí je ochotno přísahat, že jej slyšeli, že [target.GetTitledFirstName] nemůže dělat nic jiného než jej uznat. Možná [target.GetTitledFirstName] [target.GetTierAsNameNoTooltip] jen tak neopustí, ale můj nárok už nelze popřít."
 claim_throne_outcome.4003.owner_discovered: "\n\nPod tlakem [target.GetTitledFirstName] všichni, kdo přísahali, že mi [previous_holder.GetTitledFirstName] přislíbil[Select_CString(previous_holder.IsFemale, 'a', '')] vládu po své smrti, náhle změnili výpověď! Teď naopak tvrdí, že za své přísahy ode mě dostali úplatek! Je to sice pravda, ale tak odpornou zradu věrnosti jsem nečekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 claim_throne_outcome.4003.owner_secret: "\n\nPod tlakem [target.GetTitledFirstName] všichni, kdo přísahali, že mi [previous_holder.GetTitledFirstName] přislíbil[Select_CString(previous_holder.IsFemale, 'a', '')] vládu po své smrti, od svých tvrzení ustoupili. Jelikož mě ale [target.GetFirstNameNoTooltip] z ničeho neobvinil[Select_CString(target.IsFemale, 'a', '')], musí mít obavy, že na jejich slovech přece jen mohlo něco být."
 claim_throne_outcome.4003.a: "Dá se dnes ještě někomu věřit?"
 claim_throne_outcome.5001.opening: "[Select_CString(owner.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], [owner.GetTitledFirstName], vznesl[Select_CString(owner.IsFemale, 'a', '')] nárok na [target_title.GetName]!"
 claim_throne_outcome.5001.distant_relation: "\n\nPřed několika generacemi prý došlo ke strategickému sňatku mezi našimi dynastiemi a [owner.GetTitledFirstName] ho teď využívá jako základ sporu o dědictví."
 claim_throne_outcome.5001.mythical_founder: "\n\n[owner.GetFirstNameNoTooltip] tvrdí, že mezi [Select_CString(owner.IsFemale, 'její', 'jeho')] předky patří samotný [owner.Custom('ClaimThroneMythicalFounder')]! [owner.GetTitledFirstName] se domnívá, že už to samo o sobě stačí k tomu, aby [Select_CString(owner.IsFemale, 'byla jmenována vládkyní', 'byl jmenován vládcem')] [target_title.GetNameNoTooltip]."
 claim_throne_outcome.5001.previous_holder_promise: "\n\n[owner.GetFirstNameNoTooltip] tvrdí, že [Select_CString(previous_holder.IsFemale, 'má', 'můj')] [previous_holder.Custom2('RelationToMe', ROOT.Char)] na smrtelném loži přísahal[Select_CString(previous_holder.IsFemale, 'a', '')], že [target_title.GetTierAsNameNoTooltip] má připadnout [owner.GetFirstNameNoTooltip]. A co je horší, několik lidí je ochotno posvátně přísahat, že je to pravda."
 claim_throne_outcome.5001.fallback: "\n\n[owner.GetFirstNameNoTooltip] odmítá prozradit, o co své nároky opírá, ale ustoupit nehodlá!"
 claim_throne_outcome.5001.discovered: "\n\nTyto nároky jsou naprosto vykonstruované, ale panuje kolem nich dost nejistoty na to, aby představovaly skutečnou hrozbu, pokud je ostatní podpoří!"
 claim_throne_outcome.5001.a: "Své panství bez boje nevydám!"
 claim_throne_outcome.5002.a: "Opravdu si [owner.GetTitledFirstName] myslí, že tohle projde?!"
 claim_throne_outcome.5003.opening: "[Select_CString(owner.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], [owner.GetTitledFirstName], se pokusil[Select_CString(owner.IsFemale, 'a', '')] vznést nárok na [target_title.GetName]!"
 claim_throne_outcome.5003.owner_known: "\n\nTyto nároky jsou samozřejmě směšné, a pokud je tohle vše, čím mě [owner.GetFirstNamePossessiveNoTooltip] hrozba může ohrozit, nemám příliš důvodů k obavám."
 claim_throne_outcome.5003.a: "Za tu drzost [owner.GetTitledFirstName] zaplatí."
 claim_throne_invalidated: "Intrika Nárok na trůn končí"
 claim_throne_target_died_tt: "[target.GetTitledFirstName] zemřel[Select_CString(target.IsFemale, 'a', '')]"
 claim_throne_target_lost_titles_tt: "[target.GetTitledFirstName] už nevlastní žádnou državu"
 claim_throne_target_no_longer_liege_tt: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'už není mou lenní paní', 'už není mým lenním pánem')]"
 claim_throne_invalidate_fallback_tt: "Už nemohu vznést nárok na [target.GetTitledFirstNamePossessive] trůn"
