l_polish:
 court_event_title: "Dvoření:"
 court_competitor_modifier: "Sok v lásce"
 court_ongoing.0001.t: "$court_event_title$ Odmítnutí"
 court_ongoing.0001.desc: "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] odmítá mé dvoření! Je naprosto jasné, že o mě nemá zájem a nejspíš ani nikdy mít nebude."
 court_ongoing.0001.a: "Ach, jaké neštěstí!"
 court_ongoing.0501.t: "$court_event_title$ Vyznání lásky"
 court_ongoing.0501.desc: "Nadešel čas dát [target.GetTitledFirstName] najevo své city. Chci, aby na tento den [target.GetTitledFirstName] vzpomínal[Select_CString(target.IsFemale, 'a', '')] po zbytek života."
 court_ongoing.0501.a: "Zazpívej milostnou baladu."
 court_ongoing.0501.b: "Tajně podstrč dopis do [target.Custom('GetChambersOrTent')|l], kde přebývá [target.GetFirstNameNoTooltip]."
 court_ongoing.0501.c: "Napiš milostnou báseň."
 court_ongoing.0501.d: "Vyhraj cvičný souboj a tím zapůsob."
 court_ongoing.0501.x: "V pravou chvíli dej na svůj instinkt."
 court_ongoing.0501.tt: "[target.GetShortUIName|U] se dozví o tvé nehynoucí oddanosti"
 court_ongoing.0502.t: "$court_event_title$ Vyznání lásky"
 court_ongoing.court_start_song.start.0502.desc: "Procházím se zahradou a společnost mi dělají [ROOT.Char.Custom('LadiesLords')|l] od dvora, když si všimnu, že se blíží [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]. Ustoupím stranou a nechám volnou cestu, ale k mému velkému překvapení se [owner.GetTitledFirstNameNoTooltip] zastaví přede mnou a poklekne!\n\nNež stačím pořádně pochopit, co se děje, [owner.GetTitledFirstNameNoTooltip] začne zpívat.\n\n"
 court_ongoing.court_start_song.bad.0502.desc: "K mému velkému zděšení je brzy jasné, že [owner.GetTitledFirstNameNoTooltip] zpívat vůbec neumí. Chvíli trvá, než píseň poznám — je to slavná milostná balada z [target.GetCulture.GetNameNoTooltip] kultury. Text byl upraven tak, aby obsahoval mé jméno a opěvoval můj vzhled, čímž se rytmus rozpadá ještě víc."
 court_ongoing.court_start_song.good.0502.desc: "Melodii poznám okamžitě — je to slavná milostná balada z [target.GetCulture.GetNameNoTooltip] kultury. Slyšel[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem ji už nesčetněkrát, ale nikdy s takovým umem a vášní!\n\nSilné emoce písně se zrcadlí i v pohledu, kterým mě [owner.GetFirstNameNoTooltip] sleduje. Ani na jediný úder srdce ze mě nespustí oči."
 court_ongoing.court_start_sneaky_love_letter.start.0502.desc: "Když odhrnu přikrývky a chystám se ulehnout, najdu na podhlavníku malý svitek. Někdo nepozorovaně pronikl do [ROOT.Char.Custom('GetChambersOrTent')|l]? Přeběhne mi mráz po zádech, když opatrně rozvinu silný pergamen.\n\n„Ó, [ROOT.Char.Custom('RomanticComplimentAdjective')|l] "
 court_ongoing.court_start_sneaky_love_letter.compliment.0502.desc: "[ROOT.Char.Custom('RomanticComplimentNoun')|l]!"
 court_ongoing.court_start_sneaky_love_letter.relative.0502.desc: "[owner.Custom2('RelationToMeShort', ROOT.Char)|l]!"
 court_ongoing.court_start_sneaky_love_letter.end.0502.desc: "[ROOT.Char.GetLadyLord|U] mého srdce! Své city už nedokážu déle skrývat. Od dnešního dne udělám vše, co je v mých silách, abych ti dokázal[Select_CString(owner.IsFemale, 'a', '')] svou věrnou lásku.“\n\n„Brzy se znovu uvidíme. Do té doby o mně sni, má lásko. [Select_CString(owner.IsFemale, 'Navždy tvá', 'Navždy tvůj')], [owner.GetTitledFirstName].“"
 court_ongoing.court_start_poem_love_letter.0502.desc: "[owner.Custom2('love_letter', SCOPE.sC('target'))]\n\nTyto verše jsou jen bledým odrazem mých citů k tobě. Pro svou věrnou lásku udělám cokoli."
 court_ongoing.court_start_sparring.start.0502.desc: "Řinčení zbraní a vzrušené výkřiky mě přitáhnou na nádvoří. Co se děje?\n\nVidím dva obrněné bojovníky, kteří svádějí"
 court_ongoing.court_start_sparring.bad.0502.desc: "neobratný cvičný souboj. Snažím se nedat najevo rozpaky, když jeden z nich po zbytečně prudkém úderu zavrávorá."
 court_ongoing.court_start_sparring.good.0502.desc: "prudký cvičný souboj. Oba nepochybně prošli zkouškou skutečné bitvy."
 court_ongoing.court_start_sparring.great.0502.desc: "dechberoucí cvičný souboj. Takové mistrovství se vidí málokdy! [owner.Custom('SignatureWeaponArticle')] [owner.Custom('signature_weapon')|l] jako by v rukou jednoho z nich doslova ožíval[Select_CString(owner.IsFemale, 'a', '')]. Nedokážu odtrhnout oči!"
 court_ongoing.court_start_sparring.end.0502.desc: "\n\nPo posledním bezhlavém útoku jeden z bojovníků vyrazí druhému zbraň z ruky. K mému překvapení pak ten, kdo zůstal ozbrojený, poklekne přede mnou a sundá si přilbu. Je to [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n„Toto vítězství věnuji tobě, [ROOT.Char.GetTitledFirstNameNoTooltip],“ zazní slavnostně. „Mou jedinou touhou je přinášet ti čest!“"
 court_ongoing.0502.a: "Lichotíš mi, [Select_CString(owner.IsFemale, 'má paní', 'můj pane')]!"
 court_ongoing.0502.b.incest: "Cože? Vždyť jsi [Select_CString(owner.IsFemale, 'má', 'můj')] #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))]#!!"
 court_ongoing.0502.b: "S tímhle pošetilým snažením #EMP okamžitě#! přestaň."
 court_ongoing.0502.a.tt: "[owner.GetShortUIName|U] se pokusí získat mé srdce"
 court_ongoing.court_start_song.intro.0503.desc: "[Select_CString(ROOT.Char.IsFemale, 'Našla', 'Našel')] jsem klasickou milostnou baladu, která se k [target.GetFirstName] dokonale hodí! Zkouším ji znovu a znovu — všechno musí být dokonalé!\n\nV zahradách [target_location.GetNameNoTooltip] zahlédnu [target.GetFirstName], [target.Custom('LoverPetName')|l] mého srdce, ve společnosti přátel. Srdce mi buší jako kladivo, když před [target.GetFirstNameNoTooltip] pokleknu a začnu zpívat."
 court_ongoing.court_start_song.success.0503.desc: "\n\n[target.GetFirstNamePossessiveNoTooltip] tváře zrudnou jako granátové jablko, ale píseň není přerušena. Všichni kolem se tváří potěšeně, nebo snad žárlivě — to je jistě dobré znamení!\n\n„Máš nádherný hlas, [ROOT.Char.Custom('FormOfAddressForLiege')|l],“ pronese [target.GetFirstNameNoTooltip] a spěšně odchází. Přátelé se rychle vydají za [target.GetFirstNameNoTooltip]. Zvedám se na roztřesených nohou a sleduji, jak všichni mizí mezi živými ploty, zatímco mé srdce buší silněji než kdy dřív."
 court_ongoing.court_start_sneaky_love_letter.intro.0503.desc: "Mé vyznání lásky smí spatřit pouze [target.GetTitledFirstName]. Na nikom jiném nezáleží! Stránku za stránkou vylévám své srdce a mé city sílí s každým slovem, které konečně dostávám na papír. Inkoust sotva zaschne a už se vydávám tam, kde [target.GetFirstNameNoTooltip] přebývá — do [target.Custom('GetChambersOrTent')|l].\n\nSvitek opatrně položím na podhlavník. Ulehne tu dnes v noci [target.GetFirstNameNoTooltip] a bude snít o mně?"
 court_ongoing.court_start_sneaky_love_letter.success.0503.desc: "\n\nČekání je nesnesitelné. Jen při pomyšlení na odmítnutí se mi svírá žaludek! Když konečně dorazí odpověď, roztřesenýma rukama strhnu pečeť.\n\n„Ačkoli tě nemohu povzbuzovat, [owner.Custom2('RelationToMeAddress', ROOT.Char)], jsem ti za tvá laskavá slova nesmírně vděčn[Select_CString(target.IsFemale, 'á', 'ý')]. S úctou [target.GetFirstNameNoTooltip].“"
 court_ongoing.court_start_poem_love_letter.intro.0503.desc: "Svíčka už téměř dohořívá, když konečně dokončím svou báseň. Než ji odešlu, ještě jednou si ji přečtu.\n\n„[owner.Custom2('love_letter', SCOPE.sC('target'))]“"
 court_ongoing.court_start_sparring.same_locaton_intro.0503.desc: "Přizvu [Select_CString(sparring_soldier.IsFemale, 'jednu ze svých nejzkušenějších bojovnic', 'jednoho ze svých nejzkušenějších bojovníků')] a tři dny v kuse společně cvičíme. Jakmile usoudí, že můj výcvik stačí, vydáme se společně na hlavní nádvoří.\n\nZačneme spolu zápasit, kolem se brzy shromáždí dav a jeho jásot nakonec přiláká samotn[Select_CString(target.IsFemale, 'ou', 'ého')] [target.Custom('RomanticComplimentAdjective')|l] [target.GetTitledFirstName].\n\n[sparring_soldier.GetFirstNameNoTooltip] bojuje statečně, ale posledním dokonale provedeným výpadem vyrazím zbraň z ruky. Pokleknu před [target.GetFirstNameNoTooltip] a vyznám své ušlechtilé úmysly. „Toto vítězství věnuji tobě, [target.GetTitledFirstNameNoTooltip]. Mou jedinou touhou je přinášet ti čest!“\n\n"
 court_ongoing.court_start_sparring.other_locaton_intro.0503.desc: "Přizvu [Select_CString(sparring_soldier.IsFemale, 'jednu ze svých nejzkušenějších bojovnic', 'jednoho ze svých nejzkušenějších bojovníků')] a společně vyrazíme do [target_location.GetNameNoTooltip]. Po každém dni na cestě nacvičujeme naše vystoupení.\n\nPo příjezdu začneme zápasit na hlavním nádvoří. Kolem se brzy shromáždí dav a jeho jásot nakonec přiláká samotn[Select_CString(target.IsFemale, 'ou', 'ého')] [target.Custom('RomanticComplimentAdjective')|l] [target.GetTitledFirstName].\n\n[sparring_soldier.GetFirstNameNoTooltip] bojuje statečně, ale posledním dokonale provedeným výpadem vyrazím zbraň z ruky. Pokleknu před [target.GetFirstNameNoTooltip] a vyznám své ušlechtilé úmysly. „Toto vítězství věnuji tobě, [target.Custom2('RelationToMeAddress', ROOT.Char)]. Mou jedinou touhou je přinášet ti čest!“\n\n"
 court_ongoing.court_start_sparring.success.0503.desc: "„[ROOT.Char.Custom('LoverPetName')|U]...“ [target.GetTitledFirstName] zůstává beze slova, ale lichotí to zjevně. Proč jinak by se tak usmíval[Select_CString(target.IsFemale, 'a', '')]?"
 court_ongoing.public_sodomy_rejection.0503.desc: "Reakce [target.GetFirstNameNoTooltip] není taková, v jakou jsem doufal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. „Zbláznil[Select_CString(ROOT.Char.IsFemale, 'a', '')] ses, [ROOT.Char.Custom2('RelationToMeAddress', target)]?! Co mi to vlastně navrhuješ?“"
 court_ongoing.public_incest_rejection.0503.desc: "Reakce [target.GetFirstNameNoTooltip] není taková, v jakou jsem doufal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. „Co mi to navrhuješ? Vždyť jsem tvůj #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]#!!“"
 court_ongoing.public_regular_rejection.0503.desc: "Reakce [target.GetFirstNameNoTooltip] není taková, v jakou jsem doufal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. „Už se dál neztrapňuj, [ROOT.Char.Custom2('RelationToMeAddress', target)]. Raději sním vlastní [target.Custom('GetClothingArticle')|l], než abych v tvé přítomnosti strávil[Select_CString(target.IsFemale, 'a', '')] další jedinou minutu!“"
 court_ongoing.written_sodomy_rejection.0503.desc: "\n\nOdpověď [target.GetFirstNameNoTooltip] přichází rychle a nedá se vyložit jinak. „Zbláznil[Select_CString(ROOT.Char.IsFemale, 'a', '')] ses? Uvědomuješ si, jak nebezpečná by tvá slova byla, kdyby se dostala do nesprávných rukou? Prosím tě — okamžitě s tím pošetilým snažením přestaň!“"
 court_ongoing.written_incest_rejection.0503.desc: "\n\nOdpověď [target.GetFirstNameNoTooltip] přichází rychle a nedá se vyložit jinak. „Vždycky s tebou bylo něco zvláštního, ale tohle? Vyznání lásky vlastnímu #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]#!? Jen při pomyšlení na nás dva se mi dělá špatně!“"
 court_ongoing.written_regular_rejection.0503.desc: "\n\nOdpověď [target.GetFirstNameNoTooltip] přichází rychle a nedá se vyložit jinak. „Za tvůj vzkaz ti z celého srdce děkuji. Opravdu mě pobavil! Jak směšná představa, že by mé srdce mohlo někdy zatoužit právě po #EMP tobě#!!“"
 court_ongoing.0503.a: "Mým půvabům [target.GetFirstNameNoTooltip] dlouho neodolá!"
 court_ongoing.0503.a.tt: "Pokračuje tvá intrika Dvoření, jejímž cílem je [target.GetShortUIName]"
 court_ongoing.0503.b: "Myslel[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že jsme si souzeni..."
 court_ongoing.1000.t: "$court_event_title$ Trapný zápach"
 court_ongoing.1000.desc: "Podařilo se mi získat pozvání na hostinu v [location.GetNameNoTooltip] a navíc tak výhodné místo u stolu, že [target.GetFirstName] sedí hned vedle mě. Ať se snažím sebevíc, rozhovor se mi však nedaří rozproudit. Intenzita mých citů nejspíš [target.GetFirstNameNoTooltip] připravila o řeč.\n\nVtom se od našeho stolu ozve nejhlasitější prd, jaký jsem kdy slyšel[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Několik hostů se podívá na [target.GetFirstNameNoTooltip]. Musím zasáhnout!"
 court_ongoing.1000.a: "To já! Mně to ujelo!"
 court_ongoing.1000.a.success: "[target.GetFirstNameNoTooltip] pocítí úlevu a vděčnost"
 court_ongoing.1000.a.failure: "Ukáže se, že zdrojem onoho zvuku byl někdo jiný"
 court_ongoing.1000.b: "[scapegoat.GetTitledFirstNameNoTooltip], ty [scapegoat.Custom2('InsultNoun', ROOT.Char)]! To je ale smrad!"
 court_ongoing.1000.b.rl: "Pokusíš se tvrdit, že za to může [scapegoat.GetTitledFirstNameNoTooltip]"
 court_ongoing.1000.b.failure: "Místo tebe vzbudí soucit [scapegoat.GetTitledFirstNameNoTooltip]"
 court_ongoing.1000.b.tt: "O výsledku rozhodne, kolik empatie projeví [target.GetFirstNameNoTooltip]"
 court_ongoing.1000.c: "Možná bych měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] raději mlčet..."
 court_ongoing.1010.t: "$court_event_title$ [Select_CString(target.IsFemale, 'Čest dámy', 'Čest pána')]"
 court_ongoing.1010.desc: "„Při [insulter.GetFaith.HighGodName], [target.GetTitledFirstName] — to je ale [target.Custom2('InsultNoun', SCOPE.sC('insulter'))]! A všimli jste si, jak [target.GetFirstNameNoTooltip] [target.Custom('quirk_neg_present')]? Směšné!“\n\n[insulter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zakloní hlavu a zlomyslně se rozesměje.\n\n[target.GetFirstNameNoTooltip] dál rozmlouvá s přáteli, ale je mi jasné, že ta slova neunikla jeho pozornosti. Nesnáším, když někdo [target.GetFirstNameNoTooltip] ubližuje."
 court_ongoing.1010.a: "Odporné lži! Tas meč, ty [insulter.Custom2('InsultNoun', ROOT.Char)]!"
 court_ongoing.1010.b: "Omluv se [target.GetTitledFirstName]."
 court_ongoing.1010.c: "Ach, [target.GetFirstNameNoTooltip]. Jak jen se [insulter.GetTitledFirstName] mýlí!"
 court_ongoing.1010.a.success: "V souboji porazíš [insulter.GetFirstNameNoTooltip]"
 court_ongoing.1010.a.failure: "[insulter.GetFirstNameNoTooltip] tě v souboji porazí"
 court_ongoing.1010.b.success: "Přesvědčíš [insulter.GetFirstNameNoTooltip], aby se omluvil[Select_CString(insulter.IsFemale, 'a', '')]"
 court_ongoing.1010.b.failure: "[insulter.GetFirstNameNoTooltip] tě odmítne vyslechnout"
 court_ongoing.1011.desc: "[insulter.GetTitledFirstName] tasí meč se samolibým úšklebkem. Ten arogantní výraz však dlouho nevydrží!\n\nPo souboji je ponížení [insulter.GetTitledFirstNameNoTooltip] naprosté. S modřinami a tváří rudou hanbou ze sebe vypraví omluvu a odkulhá si lízat rány.\n\n[target.GetTitledFirstName] naproti tomu září jako slunce. „To bylo skutečně hrdinské, [ROOT.Char.GetTitledFirstNameNoTooltip]! Máš mou věčnou vděčnost!“"
 court_ongoing.1011.a: "Bylo mi ctí, [Select_CString(target.IsFemale, 'má paní', 'můj pane')] [target.GetFirstNameNoTooltip]."
 court_ongoing.1021.t: "Důkaz oddanosti"
 court_ongoing.1021.desc: "„[Select_CString(target.IsFemale, 'Má paní', 'Můj pane')] [target.GetFirstName]! [target.Custom('RomanticComplimentAdjective')] [target.Custom('RomanticComplimentNoun')]!“\n\n[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přede mnou klečí v prachu a pravou ruku si tiskne k srdci. „Mou jedinou touhou je přinášet ti čest a štěstí. Prosím, pověz mi — jak ti mohu dokázat svou lásku?“"
 court_ongoing.1021.a: "Zabij vlka a přines mi jeho kožešinu."
 court_ongoing.1021.wolf_pelt.success: "[owner.GetShortUINameNoTooltip] ti přinese vlčí kožešinu"
 court_ongoing.1021.wolf_pelt.failure: "[owner.GetShortUINameNoTooltip] nedokáže zabít vlka"
 court_ongoing.1021.b: "Chci chlupatého společníka."
 court_ongoing.1021.cat_pet.success: "[owner.GetShortUINameNoTooltip] ti daruje kočku"
 court_ongoing.1021.dog_pet.success: "[owner.GetShortUINameNoTooltip] ti daruje psa"
 court_ongoing.1021.eagle_pet.success: "[owner.GetShortUINameNoTooltip] ti daruje orlí mládě"
 court_ongoing.1021.pet.failure: "[owner.GetShortUINameNoTooltip] ti žádného mazlíčka nedaruje"
 court_ongoing.1021.c: "[necklace_owner.GetTitledFirstNamePossessive] náhrdelník vypadá nádherně..."
 court_ongoing.1021.necklace.success: "[owner.GetShortUINameNoTooltip] ti daruje náhrdelník"
 court_ongoing.1021.necklace.failure: "[owner.GetShortUINameNoTooltip] ti náhrdelník odmítne darovat"
 court_ongoing.1021.d: "Přines mi něco neobvyklého — třeba exotickou orchidej?"
 court_ongoing.1021.orchid.success: "[owner.GetShortUINameNoTooltip] ti přinese vzácnou orchidej"
 court_ongoing.1021.orchid.failure: "[owner.GetShortUINameNoTooltip] ti odmítne přinést orchidej"
 court_ongoing.1021.x: "Dost! Tohle šílenství dnes končí!"
 court_ongoing.1022.t: "$court_event_title$ Šedivec"
 court_ongoing.1022.start.desc: "„[Select_CString(target.IsFemale, 'Drahá paní', 'Drahý pane')] [target.GetFirstName]!“ vydechnu, když před [target.GetFirstNameNoTooltip] pokleknu. „Mou jedinou touhou je přinášet ti čest a štěstí. Prosím, pověz mi — jak ti mohu dokázat svou lásku?“\n\n"
 court_ongoing.1022.end.desc: "[target.GetTitledFirstNameNoTooltip] zaváhá a zrudne. Při [ROOT.Char.GetFaith.HighGodName], kéž je to radostí, a ne rozpaky!\n\n„Zabij pro mě vlka a přines mi jeho kožešinu. Pak můžeme v tomto rozhovoru pokračovat.“"
 court_ongoing.1022.a: "„Tvé přání je mi rozkazem!“"
 court_ongoing.1022.a.success: "Zabiješ vlka"
 court_ongoing.1022.a.failure: "Vrátíš se s prázdnou"
 court_ongoing.1022.b: "V psinci je přece jedna chlupatá bestie..."
 court_ongoing.1022.b.success: "[target.GetShortUINameNoTooltip] uvěří, že psí kožešina pochází z vlka"
 court_ongoing.1022.b.failure: "[target.GetShortUINameNoTooltip] tvůj podvod prohlédne"
 court_ongoing.1022.c: "Uplatím lovce."
 court_ongoing.1022.c.master_of_hunt: "Ať mi $master_of_hunt_court_position$ obstará vlčí kožešinu!"
 court_ongoing.1022.c.master_of_hunt.success: "[master_of_hunt.GetFirstNameNoTooltip] během lovu najde a skolí vlka"
 court_ongoing.1022.c.master_of_hunt.success.tt: "Kožešinu získáš zdarma a bez jakéhokoli rizika."
 court_ongoing.1022.c.master_of_hunt.failure: "[master_of_hunt.GetFirstNameNoTooltip] najde vlčí kožešinu na prodej"
 court_ongoing.1022.d: "„Promiň, ale tohle nedokážu.“"
 court_ongoing.1023.desc: "Z psince se ztratil jeden z mých oblíbených psů. [dummy_gender.Custom('MistressMaster')|U] psince včera v noci [Select_CString(dummy_gender.IsFemale, 'zorganizovala', 'zorganizoval')] pátrání, ale [Select_CString(dummy_gender.IsFemale, 'vrátila se s prázdnou', 'vrátil se s prázdnou')]. „Netuším, jak se ten pes dostal ven,“ povzdechne si [Select_CString(dummy_gender.IsFemale, 'šedovlasá žena', 'šedovlasý muž')]. „Pes přece nedokáže otevřít bránu...“\n\n„[Select_CString(ROOT.Char.IsFemale, 'Má paní', 'Můj pane')] [ROOT.Char.GetFirstNameNoTooltip]!“ Když se otočím, [owner.GetTitledFirstName] se na mě široce usmívá. V rukou se leskne kožešina..."
 court_ongoing.1023.a: "Nech mě o samotě. Potřebuji čas na rozmyšlenou..."
 court_ongoing.1023.b: "[Select_CString(owner.IsFemale, 'Vražedkyně!', 'Vrahu!')] Už tě nikdy nechci vidět!"
 court_ongoing.1024.desc: "Pod rouškou noci se vplížím do psince. Brzy najdu dokonalou oběť. „Pojď sem, zvířátko,“ zašeptám a zamávám před nic netušícím tvorem tlustou klobásou...\n\nMůj mazaný plán však nabere nečekaný směr, když kožešinu předložím [target.GetTitledFirstName]. Sotva ji [target.GetTitledFirstNameNoTooltip] spatří, je mi jasné, že ji poznává. „[Select_CString(ROOT.Char.IsFemale, 'Ty... ty vražedkyně!', 'Ty... ty vrahu!')] Ten pes pro mě byl jako vlastní dítě!“"
 court_ongoing.1024.a: "Já... vůbec netuším, o čem mluvíš!"
 court_ongoing.1030.t: "$court_event_title$ Zvířecí společníci"
 court_ongoing.1030.desc: "Venku se spustil liják. [target.GetTitledFirstName], [target.Custom('ComplimentAdjective')|l] jako vždy, si při pohledu z okna rozmazaného deštěm povzdechne.\n\n„Jak jen dokáže být [location.GetNameNoTooltip] pochmurné místo. Kéž bych měl[Select_CString(target.IsFemale, 'a', '')] někoho, kdo by mi dělal společnost za dlouhých a ponurých dní...“\n\nA [target.Custom('LoverPetName')|l]? Má raději kočky, nebo psy?"
 court_ongoing.1030.desc.eagle: "Nebo by snad byl lepší nějaký praktičtější společník?"
 court_ongoing.1030.a: "Chytrá kočka určitě udělá [target.GetFirstNameNoTooltip] radost."
 court_ongoing.1030.a.success: "[target.GetShortUINameNoTooltip] si kočku zamiluje"
 court_ongoing.1030.a.failure: "[target.GetShortUINameNoTooltip] si kočku neoblíbí"
 court_ongoing.1030.b: "Věrný pes by byl výborným společníkem."
 court_ongoing.1030.b.success: "[target.GetShortUINameNoTooltip] si psa zamiluje"
 court_ongoing.1030.b.failure: "[target.GetShortUINameNoTooltip] si psa neoblíbí"
 court_ongoing.1030.d: "Statný orel by mohl být [target.GetFirstNameNoTooltip] užitečný."
 court_ongoing.1030.d.success: "[target.GetShortUINameNoTooltip] si orla zamiluje"
 court_ongoing.1030.d.failure: "[target.GetShortUINameNoTooltip] si orla neoblíbí"
 court_ongoing.1030.c: "„Neboj se, já budu vždy po tvém boku!“"
 court_ongoing.1031.start.desc: "„[Select_CString(owner.IsFemale, 'Dlouho jsem přemýšlela', 'Dlouho jsem přemýšlel')], [ROOT.Char.Custom('LoverPetName')|l],“ pronese [owner.GetTitledFirstName] a opatrně položí košík na můj stůl. „Jaký společník by se nejlépe hodil k někomu tak věrnému, energickému a společenskému, jako jsi ty? A pak mi to došlo — nic se k tobě nehodí lépe než pes!“\n\n[owner.GetFirstNameNoTooltip|U] odhrne přikrývku z košíku a odhalí malé štěně! Samým nadšením se ke mně vrhne a málem přitom zakopne o okraj košíku."
 court_ongoing.1031.a: "Jé! Budu se o tebe tak dobře starat!"
 court_ongoing.1031.b: "Tohle... jsem zrovna nečekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 court_ongoing.1032.desc: "„[Select_CString(owner.IsFemale, 'Dlouho jsem přemýšlela', 'Dlouho jsem přemýšlel')], [ROOT.Char.Custom('LoverPetName')|l],“ pronese [owner.GetTitledFirstName] a opatrně položí košík na můj stůl. „Jaký společník by se nejlépe hodil k někomu tak chytrému a nezávislému, jako jsi ty? A pak mi to došlo — nic se k tobě nehodí lépe než kočka!“\n\n[owner.GetFirstNameNoTooltip|U] odhrne přikrývku z košíku a odhalí malé kotě! Vzhlédne ke mně velkýma očima barvy [ROOT.Char.Custom('RandomCatEyeColor')|l] a začne příst."
 court_ongoing.1033.desc: "„[Select_CString(owner.IsFemale, 'Dlouho jsem přemýšlela', 'Dlouho jsem přemýšlel')], [ROOT.Char.Custom('LoverPetName')|l],“ pronese [owner.GetTitledFirstName] a vyláká mě ven. Dovede mě k malému hrbolku zakrytému kusem látky. „Jaký společník by se nejlépe hodil k někomu tak odvážnému a strategicky smýšlejícímu, jako jsi ty? A pak mi to došlo — nic se k tobě nehodí lépe než orel!“\n\n[owner.GetFirstNameNoTooltip|U] stáhne látku a odhalí mladé orlí mládě na dřevěném bidle. Oči mu zakrývá malá kápi, aby zůstalo klidné, ale jeho štěbetání mě naplňuje vzrušením."
 court_ongoing.1040.t: "$court_event_title$ Třpytivé zlato"
 court_ongoing.1040.end.desc: "[target.GetFirstNameNoTooltip] si mě dlouze prohlíží. „[necklace_owner.GetTitledFirstNameNoTooltip] má nádherný náhrdelník,“ pronese a kývne tím směrem. „Ale kolem mého krku by vypadal ještě lépe.“"
 court_ongoing.1040.a: "Nech vyrobit stejný náhrdelník."
 court_ongoing.1040.b: "Nabídni [necklace_owner.GetFirstNameNoTooltip] laskavost výměnou za náhrdelník."
 court_ongoing.1040.c: "Ukradni ho."
 court_ongoing.1040.c.success: "Podaří se ti náhrdelník ukrást"
 court_ongoing.1040.c.failure: "[necklace_owner.GetFirstNameNoTooltip] tě při krádeži odhalí"
 court_ongoing.1040.d: "Pochval [target.GetFirstNameNoTooltip] za vytříbený vkus."
 court_ongoing.1050.t: "$court_event_title$ Vzácná květina"
 court_ongoing.1050.start.desc: "[target.GetFirstName], [target.Custom('LoverPetName')|l] mého srdce, se se mnou prochází zahradami [target_location.GetNameNoTooltip]. Rozhlédnu se po okolní zeleni. „Ať jsou všechny ty květy sebekrásnější, žádný se nevyrovná tvé kráse, [Select_CString(target.IsFemale, 'má paní', 'můj pane')].“\n\n„Jeden ano,“ odpoví [target.GetTitledFirstName] s rošťáckým úsměvem. „Je to vzácná orchidej. Její domovinou je [orchid_origin.GetNameNoTierNoTooltip] a vypěstovat ji je téměř nemožné."
 court_ongoing.1050.monastery.desc: "Jediným místem v těchto krajích, kde se jí daří, jsou ruiny kláštera, které najdeš tam, kde leží [orchid_location.GetNameNoTooltip].“"
 court_ongoing.1050.temple.desc: "V těchto krajích roste jedině v opuštěné zahradě. Stojí v ní [target_host.GetFaith.HouseOfWorship] a najdeš ji tam, kde leží [orchid_location.GetNameNoTooltip].“"
 court_ongoing.1050.a: "Určitě najdu obchodníka, který mi jednu prodá."
 court_ongoing.1050.b: "„Pro tebe se do těch ruin odvážím!“"
 court_ongoing.1050.b.success: "V ruinách najdeš orchidej"
 court_ongoing.1050.b.soft_failure: "Celý den hledáš, ale nic nenajdeš"
 court_ongoing.1050.b.hard_failure: "Při šplhání na věž se zraníš"
 court_ongoing.1050.b.friend.success: "[helpful_friend.GetShortUIName|U] najde v ruinách orchidej"
 court_ongoing.1050.b.friend.soft_failure: "[helpful_friend.GetShortUIName|U] nic nenajde"
 court_ongoing.1050.b.friend.hard_failure: "[helpful_friend.GetShortUIName|U] se v ruinách zraní"
 court_ongoing.1050.b.friend: "[helpful_friend.GetTitledFirstNameNoTooltip] by mi mohl[Select_CString(helpful_friend.IsFemale, 'a', '')] pomoci."
 court_ongoing.1050.b.friend.f: "Tato možnost je dostupná, protože [helpful_friend.GetShortUIName] má vysokou [Concept('prowess','Udatnost')|E]"
 court_ongoing.1050.c: "Téměř nemožné? Vždyť už ji mám ve své sbírce!"
 court_ongoing.1050.c.friend.f: "Tato možnost je dostupná, protože [helpful_friend.GetShortUIName] má rys Bylinkář"
 court_ongoing.1050.d: "„Slyšel[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že v těch ruinách straší...“"
 court_ongoing.1050.e: "„Vedle tvé krásy přece musí zblednout i ta orchidej!“"
 court_ongoing.1050.f: "„Snad ji jednoho dne spatřím.“"
 court_ongoing.1100.t: "$court_event_title$ Básnická licence"
 court_ongoing.1100.desc: "Nikdo není půvabnější než [target.GetTitledFirstName]! V přítomnosti [target.GetFirstNameNoTooltip] mi často docházejí slova — žádná má poklona nedokáže vystihnout všechny přednosti. Možná by je lépe zachytila pečlivě složená báseň?\n\nBudu psát o..."
 court_ongoing.1100.compliment.tt: "Odpověď [target.GetTitledFirstName] bude záviset na tom, jak dobře báseň vystihne [target.GetFirstNameNoTooltip]."
 court_ongoing.1100.success.tt: "[target.GetFirstNameNoTooltip] odpoví kladně"
 court_ongoing.1100.neutral.tt: "[target.GetFirstNameNoTooltip] neodpoví"
 court_ongoing.1100.failure.tt: "[target.GetFirstNameNoTooltip] odpoví záporně"
 court_ongoing.1100.compassionate: "Laskavém a soucitném srdci."
 court_ongoing.1100.bold: "Neohrožené odvaze."
 court_ongoing.1100.honorable: "Vznešené počestnosti."
 court_ongoing.1100.greed: "Nespoutané ctižádosti."
 court_ongoing.1100.rational: "Bezmezné moudrosti."
 court_ongoing.1100.zealous: "Planoucí víře."
 court_ongoing.1100.energetic: "Mladistvé životní síle."
 court_ongoing.1100.forgiving: "Shovívavé povaze."
 court_ongoing.1100.beautiful: "Nádherném vzhledu."
 court_ongoing.1100.strong: "Tělesné síle."
 court_ongoing.1100.extroverted: "Okouzlujícím vystupování."
 court_ongoing.1100.dominant: "Sebevědomém vystupování."
 court_ongoing.1100.fallback: "Poezie není mou silnou stránkou."
 court_ongoing.1101.t: "Pro [target.GetTitledFirstNameNoTooltip], [target.Custom('RomanticComplimentAdjective')|l],"
 court_ongoing.1101.desc: "[owner.Custom2('love_letter_compliment_system', SCOPE.sC('target'))]"
 court_ongoing.1101.a.good: "Mé nitro je na pergamenu vystiženo dokonale!"
 court_ongoing.1101.a.bad: "Jak zvláštní! A přece je to... okouzlující."
 court_ongoing.1101.c.good: "Jak domýšlivé."
 court_ongoing.1101.c.bad: "To se mě [owner.GetTitledFirstName] snaží urazit?!"
 court_ongoing.1102.t: "Pro [owner.GetTitledFirstNameNoTooltip], [owner.Custom('RomanticComplimentAdjective')|l],"
 court_ongoing.1102.desc: "[target.Custom2('love_letter', SCOPE.sC('owner'))]"
 court_ongoing.1102.a: "Takže se má báseň líbila!"
 court_ongoing.1103.t: "[target.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 court_ongoing.1103.a: "To se mi [target.GetTitledFirstName]... vysmívá?"
 court_ongoing.1110.t: "$court_event_title$ Soupeření"
 court_ongoing.1110.desc: "V poslední době každou mou návštěvu u [target.GetFirstName] kazí [competitor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [competitor.GetTitledFirstName] se drží [target.GetFirstNameNoTooltip] na každém kroku jako ztracené štěně. Pokusy získat si přízeň [target.GetTitledFirstName] jsou směšné, přesto se obávám, že taková vytrvalost nakonec přinese ovoce."
 court_ongoing.1110.a: "Souboj ukáže, kdo je hoden lásky!"
 court_ongoing.1110.a.success: "V souboji zvítězíš"
 court_ongoing.1110.a.failure: "V souboji prohraješ"
 court_ongoing_1110.competitor_remains.tt: "[competitor.GetShortUIName|U] se dál dvoří [target.GetShortUIName]"
 court_ongoing.1110.b: "„Nešťastná“ otrava jídlem by mohla problém vyřešit."
 court_ongoing.1110.b.success: "[competitor.GetShortUINameNoTooltip] se při večeři pořádně ztrapní"
 court_ongoing.1110.b.failure: "[competitor.GetShortUINameNoTooltip] si všimne tvého pokusu nalít jed do poháru"
 court_ongoing.1110.b.murder: "Jed je #EMP až příliš#! účinný"
 court_ongoing.1110.c: "Tohle není pravá láska; pár mincí snad ukončí celé dvoření."
 court_ongoing.1110.c.success: "[competitor.GetShortUINameNoTooltip] přijme úplatek"
 court_ongoing.1110.c.failure: "[competitor.GetShortUINameNoTooltip] poví [target.GetShortUINameNoTooltip] o tvé nabídce"
 court_ongoing.1111.t: "Žádaná společnost"
 court_ongoing.1111.start.desc: "[owner.GetTitledFirstName] není jediný člověk, který se snaží získat mou přízeň. Stále častěji za mnou přichází také [competitor.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] a původně zdvořilé lichotky jsou čím dál důvěrnější.\n\n"
 court_ongoing.1111.duel_success.desc: "[owner.GetTitledFirstNameNoTooltip] nesl[Select_CString(owner.IsFemale, 'a', '')] pozornost, kterou mi věnuje [competitor.GetFirstNameNoTooltip], velmi nelibě. Dokonce došlo na výzvu k souboji! Když jsem dorazil[Select_CString(ROOT.Char.IsFemale, 'a', '')], bylo už po všem; [owner.GetTitledFirstNameNoTooltip] vítězně stál[Select_CString(owner.IsFemale, 'a', '')] nad zbitým protivníkem."
 court_ongoing.1111.duel_failure.desc: "[owner.GetTitledFirstNameNoTooltip] nesl[Select_CString(owner.IsFemale, 'a', '')] pozornost, kterou mi věnuje [competitor.GetFirstNameNoTooltip], velmi nelibě. Dokonce došlo na výzvu k souboji! Když jsem dorazil[Select_CString(ROOT.Char.IsFemale, 'a', '')], bylo už po všem; [competitor.GetTitledFirstNameNoTooltip] vítězně stál[Select_CString(competitor.IsFemale, 'a', '')] nad zbitým protivníkem."
 court_ongoing.1111.poison_success.desc: "Jenže dnes večer při večeři [competitor.GetTitledFirstNameNoTooltip] vypil[Select_CString(competitor.IsFemale, 'a', '')] příliš mnoho a pozvracel[Select_CString(competitor.IsFemale, 'a', '')] mi šaty! [owner.GetTitledFirstNameNoTooltip] ani na okamžik nezaváhal[Select_CString(owner.IsFemale, 'a', '')] a přispěchal[Select_CString(owner.IsFemale, 'a', '')] mě zachránit před tou spouští."
 court_ongoing.1111.poison_failure.desc: "Teď mi [competitor.GetTitledFirstNameNoTooltip] tvrdí, že [owner.GetTitledFirstNameNoTooltip] zešílel[Select_CString(owner.IsFemale, 'a', '')] žárlivostí a pokusil[Select_CString(owner.IsFemale, 'a', '')] se [competitor.GetFirstNameNoTooltip] otrávit!"
 court_ongoing.1111.a.success: "Ach, [owner.GetTitledFirstNameNoTooltip]! Jak hrdinské!"
 court_ongoing.1111.a.duel_failure: "Ubohý [owner.GetTitledFirstNameNoTooltip]! Pojď, ošetřím ti ty šrámy."
 court_ongoing.1111.a.poison_failure: "[owner.GetTitledFirstNameNoTooltip] by se k tak podlé lsti nikdy nesnížil[Select_CString(owner.IsFemale, 'a', '')]!"
 court_ongoing.1111.b.poison_success: "Nech mě být! Poradím si sám[Select_CString(ROOT.Char.IsFemale, 'a', '')]!"
 court_ongoing.1111.b.poison_failure: "Jak jsi mohl[Select_CString(owner.IsFemale, 'a', '')], [owner.GetTitledFirstNameNoTooltip]?!"
 court_ongoing.1111.b.duel_success: "Taková dětinská hádka na mě #EMP vůbec#! nezapůsobí."
 court_ongoing.1111.b: "Žárlivost ti nesluší, [owner.GetTitledFirstNameNoTooltip]."
 court_ongoing.1111.c.duel_failure: "Ach, [competitor.GetTitledFirstNameNoTooltip]! Jaká odvaha!"
 court_ongoing.1111.c: "Ubohý [competitor.GetTitledFirstNameNoTooltip]! Srdce mě pro tebe bolí!"
 court_ongoing.1111.d: "Mám vás obou dost!"
 court_ongoing.1112.desc: "[competitor.GetTitledFirstName] proti mně neměl[Select_CString(competitor.IsFemale, 'a', '')] nejmenší šanci! Porážka musela být pořádně ponižující — a [target.GetFirstName], [target.Custom('LoverPetName')|l] mého srdce, to všechno viděl[Select_CString(target.IsFemale, 'a', '')]! Od té chvíle už [target.GetTitledFirstName] nevěnuje [competitor.GetFirstNameNoTooltip] žádnou pozornost."
 court_ongoing.1112.a: "Další soupeř poražen!"
 court_ongoing.1113.desc: "Zdá se, že jsem schopnosti [competitor.GetTitledFirstName] podcenil[Select_CString(ROOT.Char.IsFemale, 'a', '')] — porážka bolela stejně jako ponížení, které ji provázelo. Jedinou útěchou mi je, že [target.GetTitledFirstName] nebyl[Select_CString(target.IsFemale, 'a', '')] u toho."
 court_ongoing.1113.a: "Na tohle raději zapomeňme..."
 court_ongoing.1113.b: "Pomstím se! Na to vezmi jed!"
 court_ongoing.1114.desc: "Nic se nevyrovná uspokojení z dokonale provedeného plánu!\n\nNikdo si nevšiml, když jsem nalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jed do poháru [competitor.GetTitledFirstName], a na scénu, která následovala, jen tak někdo nezapomene! [competitor.GetTitledFirstName] pozvracel[Select_CString(competitor.IsFemale, 'a', '')] [target.GetFirstNamePossessive] [target.Custom('GetClothingArticle')|l] a [target.GetTitledFirstName] byl[Select_CString(target.IsFemale, 'a', '')] nesmírně vděčný[Select_CString(target.IsFemale, 'á', '')], když jsem přispěchal[Select_CString(ROOT.Char.IsFemale, 'a', '')] na pomoc."
 court_ongoing.1114.a: "[target.GetTitledFirstName] už se na [competitor.GetFirstNameNoTooltip] ani nepodívá!"
 court_ongoing.1115.desc: "Ukázalo se, že [competitor.GetTitledFirstName] je mnohem všímavější, než jsem čekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Přistihl[Select_CString(competitor.IsFemale, 'a', '')] mě přímo při pokusu otrávit jeho pohár a okamžitě mě udal[Select_CString(competitor.IsFemale, 'a', '')]!"
 court_ongoing.1115.a: "Není to tak, jak to vypadá..."
 court_ongoing.1116.desc: "První část mého plánu vyšla dokonale. Nikdo mě neviděl, když jsem nalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jed do poháru [competitor.GetTitledFirstName]. Zdá se však, že jsem podcenil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jeho sílu.\n\nSotva [competitor.GetFirstNameNoTooltip] přiložil[Select_CString(competitor.IsFemale, 'a', '')] pohár ke rtům, začal[Select_CString(competitor.IsFemale, 'a', '')] se dusit! Než stačil kdokoli pomoci, [competitor.GetTitledFirstName] se zhroutil[Select_CString(competitor.IsFemale, 'a', '')] obličejem do dušeného masa a byl[Select_CString(competitor.IsFemale, 'a', '')] na místě mrtvý[Select_CString(competitor.IsFemale, 'á', '')]."
 court_ongoing.1116.a: "Alespoň už se [competitor.GetTitledFirstName] nebude dvořit [target.GetFirstNameNoTooltip]."
 court_ongoing.1120.t: "$court_event_title$ $court_ongoing.1121.t$"
 court_ongoing.1120.desc: "Účastním se tance v [target_location.GetNameNoTooltip], abych mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] strávit nějaký čas s [target.GetTitledFirstName]. Už při pouhé představě, že se dotkneme rukama, mi poskočí srdce! Když však dorazím, [target.GetTitledFirstName] vězí v rozhovoru s [unpleasant_guest.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)].\n\n[unpleasant_guest.Custom2('InsultAdjective', ROOT.Char)|U] [unpleasant_guest.GetWomanMan] mele pořád dál a vůbec si nevšímá, jak nepříjemně se [target.GetFirstNameNoTooltip] cítí."
 court_ongoing.1120.a: "Trocha #EMP „rozptýlení“#! by přišla vhod."
 court_ongoing.1120.a.failure: "Rozhovor je nesnesitelně nudný"
 court_ongoing.1120.b: "Můj šarm vylepší každý rozhovor!"
 court_ongoing.1120.c: "Vystřídám [target.GetFirstNameNoTooltip]. Raději ať trpím já."
 court_ongoing.1120.d: "„Dost! [target.GetTitledFirstName] se kvůli tobě unudí k smrti!“"
 court_ongoing.1120.e: "K tomu [unpleasant_guest.GetWomanMan] se ani nepřiblížím!"
 court_ongoing.1121.t: "Nepříjemné zdvořilosti"
 court_ongoing.1121.start.desc: "Když jsem rozesílal[Select_CString(ROOT.Char.IsFemale, 'a', '')] pozvánky na tanec, těšil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem se na večer plný příjemné společnosti a bezstarostné zábavy. Místo toho jsem uvízl[Select_CString(ROOT.Char.IsFemale, 'a', '')] v příšerném rozhovoru s [unpleasant_guest.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]...\n\n"
 court_ongoing.1121.diplomacy.desc: "„Dobrý večer,“ ozve se známý hlas — do rozhovoru se přidává [owner.GetTitledFirstName]. Pozorně naslouchá a brzy se veškerá pozornost [unpleasant_guest.GetFirstNameNoTooltip] soustředí právě na [owner.GetTitledFirstName]. Mám volnou cestu k úniku."
 court_ongoing.1121.intrigue.desc: "„Hluboce se omlouvám, ale nastala naléhavá záležitost, která vyžaduje tvou pozornost, [unpleasant_guest.Custom2('RelationToMeAddress', owner)].“ Ten známý hlas nepatří nikomu jinému než [owner.GetTitledFirstName]. [owner.GetTitledFirstName] na mě mrkne a pokyne [unpleasant_guest.GetFirstNameNoTooltip], aby následoval[Select_CString(unpleasant_guest.IsFemale, 'a', '')]."
 court_ongoing.1121.insult.desc: "„Myslím, že [ROOT.Char.GetLadyLord] už toho má dost,“ přeruší rozhovor [owner.GetTitledFirstName]. „Copak nevidíš, že [ROOT.Char.GetTitledFirstNameNoTooltip] k smrti nudíš, [unpleasant_guest.Custom2('RelationToMeAddress', owner)]?“"
 court_ongoing.1121.a: "Užitečná, byť nepříjemná lekce diplomacie!"
 court_ongoing.1121.a.critical_success: "Odhalíš nový diplomatický trik"
 court_ongoing.1121.a.success: "Tvé porozumění diplomacii se zlepší"
 court_ongoing.1121.b: "Užitečná, byť nepříjemná lekce pletichaření!"
 court_ongoing.1121.b.critical_success: "Odhalíš nový trik v intrikách"
 court_ongoing.1121.b.success: "Tvé porozumění intrikám se zlepší"
 court_ongoing.1121.c: "„Vskutku, už toho mám dost.“"
 court_ongoing.1121.c.success: "[unpleasant_guest.GetShortUIName|U] ocení tvou upřímnost"
 court_ongoing.1121.c.failure: "[unpleasant_guest.GetShortUIName|U] se urazí"
 court_ongoing.1121.d: "[ROOT.Char.GetTitleAsNameNoTooltip] má čas na každého. [owner.GetFirstNameNoTooltip] by to měl[Select_CString(owner.IsFemale, 'a', '')] vědět."
 court_ongoing.1121.e: "Nezůstanu tu ani o chvíli déle, než musím!"
 court_ongoing.1201.t: "Žádost"
 court_ongoing.1201.desc: "„[Select_CString(target.IsFemale, 'Má paní', 'Můj pane')] [target.GetFirstName], dovol mi dokázat svou oddanost jakýmkoli způsobem, který uznáš za vhodný!“ [owner.GetTitledFirstName] mě prosí, abych vymyslel[Select_CString(ROOT.Char.IsFemale, 'a', '')] zkoušku oddanosti — nějaký čin podle mého výběru. Nechám [owner.GetTitledFirstName] několik dní obejít se bez..."
 court_ongoing.1201.a: "Spánku — chraň mě před nočními můrami!"
 court_ongoing.1201.a_success: "[owner.GetShortUIName|U] drží hlídku a ty můžeš klidně spát"
 court_ongoing.1201.a_failure: "[owner.GetShortUIName|U] ve své povinnosti selže"
 court_ongoing.1201.b: "Jídla — láska ke mně ti musí stačit jako potrava."
 court_ongoing.1201.b_success: "[owner.GetShortUIName|U] prokáže svou oddanost"
 court_ongoing.1201.c: "Nemám zájem zkoušet [owner.GetTitledFirstName]."
 court_ongoing.1211.t: "$court_event_title$ Žádost"
 court_ongoing.1211.desc_opening: "„[Select_CString(target.IsFemale, 'Má paní', 'Můj pane')] [target.GetFirstName], dovol mi dokázat svou oddanost jakýmkoli způsobem, který uznáš za vhodný!“\n\n[target.GetFirstNameNoTooltip] chvíli o mé žádosti přemýšlí, než se tvář rozzáří."
 court_ongoing.1211.desc: "„V poslední době mě sužují noční můry. Pokud mi jsi skutečně oddán[Select_CString(ROOT.Char.IsFemale, 'a', '')], budeš držet stráž před [target.Custom('GetChambersOrTent')|l], kde spím, a dohlédneš, aby se ke mně nedostalo žádné zlo.“"
 court_ongoing.1211.a: "Budeš spát nerušeně!"
 court_ongoing.1211.a.success: "Dokážeš zůstat vzhůru"
 court_ongoing.1211.a.failure: "Spánek tě nakonec přemůže"
 court_ongoing.1211.b: "Nech mě celou noc o samotě a budu držet hlídku."
 court_ongoing.1211.b.tt: "Koště s mým pláštěm dokáže zahánět noční můry stejně dobře."
 court_ongoing.1211.b.success: "Nikdo lest neodhalí"
 court_ongoing.1211.b.failure: "[target.GetShortUIName|U] podvod odhalí"
 court_ongoing.1211.c: "Tohle neudělám."
 court_ongoing.1212.desc: "Když po další noci plné klidného spánku vychází slunce, nezbývá mi než děkovat [owner.GetTitledFirstName], že držel[Select_CString(owner.IsFemale, 'a', '')] stráž před [ROOT.Char.Custom('GetChambersOrTent')|l] a dopřál[Select_CString(owner.IsFemale, 'a', '')] mi ničím nerušený odpočinek."
 court_ongoing.1212.a: "Můj statečný strážce!"
 court_ongoing.1213.desc: "Právě když uprostřed nejtemnější noci začínám usínat, náhle zaslechnu hlasité #EMP žuchnutí#!! Vyhlédnu z [ROOT.Char.Custom('GetChambersOrTent')|l] a spatřím [owner.GetTitledFirstName], jak tvrdě spí na podlaze."
 court_ongoing.1213.a: "Můj statečný strážce..."
 court_ongoing.1214.desc: "\n\nDokonce jsem několikrát vyhlédl[Select_CString(ROOT.Char.IsFemale, 'a', '')] ze dveří a pokaždé tam [owner.GetTitledFirstName] stál[Select_CString(owner.IsFemale, 'a', '')] vzpřímeně jako socha, ani se nezakymácel[Select_CString(owner.IsFemale, 'a', '')]."
 court_ongoing.1215.desc: "Právě když uprostřed nejtemnější noci začínám usínat, náhle zaslechnu hlasité #EMP žuchnutí#!! Vyhlédnu z [ROOT.Char.Custom('GetChambersOrTent')|l] a na zemi spatřím prázdný plášť [owner.GetTitledFirstName], přilbu a převrácené koště."
 court_ongoing.1215.a: "[owner.GetTitledFirstName] mě chtěl[Select_CString(owner.IsFemale, 'a', '')] oklamat!"
 court_ongoing.1221.desc: "„Několik dní by ti k přežití měla stačit samotná láska ke mně.“"
 court_ongoing.1221.a: "Má oddanost mě udrží při síle!"
 court_ongoing.1221.a.success: "Dokážeš se obejít bez jídla"
 court_ongoing.1221.a.failure: "Podlehneš potřebám svého těla"
 court_ongoing.1221.b: "Přes tyto rty neprojde ani drobeček!"
 court_ongoing.1221.b.tt: "Ale většímu soustu ani pořádnému kusu se nevyhýbám..."
 court_ongoing.1222.desc: "[owner.GetTitledFirstName] s každým dalším dnem vypadá vyhubleji, ale i když tělo chřadne, vůle a oddanost zůstávají pevné.\n\nVyhledám [owner.GetTitledFirstName], abych zkoušku prohlásil[Select_CString(ROOT.Char.IsFemale, 'a', '')] za splněnou, a první, co zazní z úst, je další příslib věrnosti."
 court_ongoing.1222.a: "[Select_CString(owner.IsFemale, 'Má oddaná paní', 'Můj oddaný pane')]!"
 court_ongoing.1223.desc: "[owner.GetTitledFirstName] s každým dalším dnem vypadá vyhubleji."
 court_ongoing.1223.desc_ending: "Když však [owner.GetTitledFirstName] vyhledám, abych zkoušku prohlásil[Select_CString(ROOT.Char.IsFemale, 'a', '')] za splněnou, najdu [owner.GetTitledFirstName] ve spižírně, obalen[Select_CString(owner.IsFemale, 'ou', 'ého')] drobky a právě uprostřed hltání celého bochníku sýra."
 court_ongoing.1223.a: "Vidím, že sis [Select_CString(owner.IsFemale, 'našla', 'našel')] jiný zdroj obživy..."
 court_ongoing.1225.desc: "[owner.GetTitledFirstName] podle všeho půst zvládá až podezřele dobře. Když [owner.GetTitledFirstName] vyhledám, abych vyjádřil[Select_CString(ROOT.Char.IsFemale, 'a', '')] svůj údiv a obdiv, zjistím proč.\n\nCelý plášť má nacpaný jídlem! Soudě podle zahanbeného výrazu jsem to rozhodně neměl[Select_CString(ROOT.Char.IsFemale, 'a', '')] vidět..."
