l_polish:
 court_outcome.0001.t: "$court_event_title$ Teď, nebo nikdy"
 court_outcome.0001.desc: "Ach, [target.GetFirstName], [target.Custom('LoverPetName')|l]! Toužím po tvém objetí! Bez sladkého nektaru tvých polibků snad zemřu!\n\nAčkoli jsou mé city čisté, tolik lidí by nás odsoudilo. Mám za [target.GetFirstNameNoTooltip] jít? Nebo se musím držet stranou?"
 court_outcome.0001.b: "Nemohu [target.GetFirstNameNoTooltip] vystavit nebezpečí..."
 court_outcome.0001.a: "Nic nás nerozdělí!"
 court_outcome.0003.t: "Je to láska?"
 court_outcome.0003.success.desc: "Sotva si vzpomínám, jaký byl můj život předtím, než mi [owner.GetFirstName] vyznal[Select_CString(owner.IsFemale, 'a', '')] své city. Ty dny se teď zdají tak bezútěšné, tak pochmurné... Ale s [owner.GetFirstNameNoTooltip] po mém boku se najednou zdá možné úplně všechno!\n\nKéž by to tak mohlo zůstat navždy, ale hluboko uvnitř vím, že se musím rozhodnout. Najdu v sobě dost odvahy podlehnout svým citům, nebo své srdce před [owner.GetFirstNameNoTooltip] navždy uzavřu?"
 court_outcome.0003.failure.desc: "Sotva si vzpomínám, jaký byl můj život předtím, než mi [owner.GetFirstName] vyznal[Select_CString(owner.IsFemale, 'a', '')] lásku. Je to lichotivé, ale zároveň je té pozornosti na mě příliš. Stále častěji toužím jen po troše klidu a ticha.\n\nPřesto mě neopouštějí pochybnosti. Nezahazuji tím svou jedinou naději na pravou lásku? To přece nemůže být správné! Nebo ano...?"
 court_outcome.0003.a: "Patřím ti, [owner.GetFirstNameNoTooltip]. Teď a navždy!"
 court_outcome.0003.a.tt: "[owner.GetShortUIName|U] se může stát mou [Concept('soulmate','spřízněnou duší')|E]"
 court_outcome.0003.b.success: "Mohu ti dát jen jediný polibek z pravé lásky."
 court_outcome.0003.b.failure: "Za svou oddanost si [owner.GetShortUIName|U] zaslouží alespoň polibek."
 court_outcome.0003.b.tt: "[owner.GetShortUIName|U] se #bold nestane#! mou [Concept('soulmate','spřízněnou duší')|E]"
 court_outcome.0003.c: "Tohle poblouznění dnes končí."
 court_outcome.kiss.tt: "Políbíš se s [target.GetShortUIName]"
 court_outcome.0001.a.tt: "Pokračuješ ve snaze dvořit se [target.GetTitledFirstName]"
 court_outcome.1000.t: "$court_event_title$ Divoký hon"
 court_outcome.1000.i_invite.desc: "Když [target.GetTitledFirstName] navrhl[Select_CString(target.IsFemale, 'a', '')] uspořádat hon, neváhal[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem ani chvíli. Pro [target.Custom('LoverPetName')|l] bych udělal[Select_CString(ROOT.Char.IsFemale, 'a', '')] cokoli, jen abych se mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] alespoň na okamžik pokochat pohledem!"
 court_outcome.1000.own_invite.desc: "Když mě [target.GetFirstName] pozval[Select_CString(target.IsFemale, 'a', '')] na hon, neváhal[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem ani chvíli. Nedokážu si představit půvabnější pohled než na [target.GetFirstNameNoTooltip] v sedle statného hřebce!"
 court_outcome.1000.liege_invite.desc: "Když mě [target_host.Custom2('NamePossessiveCharacterIntroduction', target)] pozval[Select_CString(target_host.IsFemale, 'a', '')] na hon, neváhal[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem ani chvíli. Pro [target.Custom('LoverPetName')|l] bych udělal[Select_CString(ROOT.Char.IsFemale, 'a', '')] cokoli, jen abych se mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] alespoň na okamžik pokochat pohledem!"
 court_outcome.1000.end.desc: "\n\nPlížím se houštím, páže mám těsně za patami a o kus přede mnou běží můj lovecký pes. Zdá se, že zachytil stopu! Vtom mé soustředění roztříští výkřik — a ten patří [target.GetTitledFirstName]!"
 court_outcome.1000.a: "„Už jdu, má lásko!“"
 court_outcome.1000.b: "Možná by bylo moudřejší poslat páže..."
 court_outcome.1000.c: "Nejspíš to byl jen nějaký pták."
 court_outcome.1000.b.failure: "Na [target.GetFirstNameNoTooltip] zaútočí divoká šelma"
 court_outcome.1000.b.success: "Ukáže se, že [target.GetFirstNameNoTooltip] žádné nebezpečí nehrozilo"
 court_outcome.1001.desc: "Během chvíle, která mi připadá jako celá hodina, dorazím na mýtinu. [target.GetFirstName] leží přede mnou na zemi, [Select_CString(target.IsFemale, 'rozcuchaná a beze zbraně', 'rozcuchaný a beze zbraně')]. Naproti stojí obrovský [ROOT.Char.Custom('GetAnimalType')] a právě se chystá zaútočit!\n\nMůj šíp zasáhne přesně a zvíře se skácí k zemi. [target.GetFirstNameNoTooltip] na mě chvíli jen nevěřícně hledí, pak se [Select_CString(target.IsFemale, 'potácivě vrhne', 'potácivě vrhne')] ke mně a padne mi do náruče."
 court_outcome.1001.a: "Potřebuji tě, má lásko, tady a teď!"
 court_outcome.1001.b: "Toužím jen po jediném sladkém polibku."
 court_outcome.1002.desc: "„[target.GetFirstName]! Už jdu!“ Prodírám se křovím na mýtinu, srdce mi divoce buší a po tváři stéká pot.\n\nJenže přede mnou se naskytne úplně jiný výjev, než jsem čekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. [ROOT.Char.Custom('GetAnimalType')] tam skutečně je — ale leží na zemi se šípem zabodnutým mezi očima. [target.GetFirstNameNoTooltip] sklání luk a obrací se ke mně.\n\n„Co to má znamenat, [owner.GetTitledFirstNameNoTooltip]? [Select_CString(owner.IsFemale, 'Myslela sis', 'Myslel sis')], že se nedokážu ubránit?“"
 court_outcome.1002.a: "[Select_CString(ROOT.Char.IsFemale, 'Já... zabloudila jsem?', 'Já... zabloudil jsem?')]"
 court_outcome.1005.desc: "Čím jsem blíž, tím hlasitější jsou výkřiky. To musí být [target.GetFirstName] — [target.Custom('RomanticComplimentAdjective')|l] jako vždy. Ten hlas poznám kdekoli!\n\nJenže na těch výkřicích je cosi #EMP podivného#!. Nezní jako strach... Ani jako bolest...\n\nSrdce mi klesne, když konečně spatřím [target.GetFirstNameNoTooltip]: [Select_CString(target.IsFemale, 'nahou jako v den, kdy se narodila', 'nahého jako v den, kdy se narodil')], jak se válí v trávě s [targets_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 court_outcome.1005.a: "[target.GetFirstNameNoTooltip] pro mě ve svém srdci zjevně nemá místo."
 court_outcome.1005.b: "[targets_lover.GetFirstNameNoTooltip] bude litovat dne, kdy mi [Select_CString(targets_lover.IsFemale, 'zkřížila', 'zkřížil')] cestu!"
 court_outcome.1005.c: "Zachráním [target.GetFirstNameNoTooltip] před tou bestií!"
 court_outcome.1005.c.murder_undiscovered: "Můj šíp zasáhne [targets_lover.GetFirstNameNoTooltip]"
 court_outcome.1005.c.murder_discovered: "Můj šíp zasáhne [targets_lover.GetFirstNameNoTooltip], ale jsem odhalen[Select_CString(ROOT.Char.IsFemale, 'a', '')]"
 court_outcome.1005.c.murder_attempt: "Minu a uteču z místa"
 court_outcome.1005.d: "Jestli [target.GetFirstNameNoTooltip] nemůže být se mnou, nebude s nikým!"
 court_outcome.1005.d.murder_undiscovered: "Můj šíp zasáhne [target.GetFirstNameNoTooltip]"
 court_outcome.1005.d.murder_discovered: "Můj šíp zasáhne [target.GetFirstNameNoTooltip], ale jsem odhalen[Select_CString(ROOT.Char.IsFemale, 'a', '')]"
 court_outcome.1003.t: "Divoký hon"
 court_outcome.1004.desc: "Projíždím se krajinou, když můj kůň náhle uskočí z cesty. Pádu už nelze zabránit a náraz mi vyrazí dech. Když vzhlédnu, stojí přede mnou [owner.Custom('GetAnimalType')]!\n\nNež stačím vykřiknout, zvíře se zhroutí k zemi se šípem mezi očima.\n\n„[target.GetFirstNameNoTooltip], [target.Custom('LoverPetName')|l]! [Select_CString(owner.IsFemale, 'Bála jsem se, že jsem tě ztratila', 'Bál jsem se, že jsem tě ztratil')]!“ [Select_CString(owner.IsFemale, 'Mou hrdinkou není nikdo jiný než', 'Mým hrdinou není nikdo jiný než')] [owner.GetTitledFirstName]!"
 court_outcome.1003.b: "Vyměníme si jediný polibek, sladký jako med."
 court_outcome.1100.t: "$court_event_title$ Vetřelec"
 court_outcome.1100.start.desc: "Pokaždé, když zavřu oči, vidím tvář [target.GetTitledFirstName]. Spánek nepřichází. Už nemohu čekat ani chvíli — pod rouškou tmy se vydávám na cestu. Mým cílem je"
 court_outcome.1100.targets_residence.desc: "[target.Custom('ResidenceBuilding')|l], kde sídlí [target.GetTitledFirstName]."
 court_outcome.1100.my_residence.desc: "zahrada před komnatami, kde přebývá [target.GetTitledFirstName]."
 court_outcome.1100.targets_host_residence.desc: "[target.Custom('ResidenceBuilding')|l], kde [target_host.GetTitledFirstName] hostí [target.GetTitledFirstName]."
 court_outcome.1100.end.desc: "\n\nJakmile spatřím okno komnaty, v níž [target.GetFirstNameNoTooltip] spí, srdce se mi rozbuší. Tak blízko, a přece tak daleko!\n\nAle počkat — kdo to šplhá po věži? Podezřelá postava se zastaví u okna a odjišťuje okenice..."
 court_outcome.1100.a: "[target.Custom('LoverPetName')|l] je v nebezpečí — musím zasáhnout!"
 court_outcome.1100.b: "„Stráže! #EMP Stráže!#! Ve věži je vetřelec!“"
 court_outcome.1100.b.failure: "[target.GetShortUIName|U] utrpí zranění od vetřelce"
 court_outcome.1100.b.success: "[target.GetShortUIName|U] vyvázne bez zranění"
 court_outcome.1100.c: "[Select_CString(ROOT.Char.IsFemale, 'Nepřišla', 'Nepřišel')] jsem sem zápasit se zlodějem."
 court_outcome.1101.start.desc: "Zvuky zápasu nade mnou mě ženou vpřed jako nic předtím. Bez ohledu na vlastní zdraví se vyšvihnu oknem do komnaty, kde je [target.GetTitledFirstName].\n\n"
 court_outcome.1101.owner_fights.desc: "Je to, jako bych se náhle ponořil[Select_CString(ROOT.Char.IsFemale, 'a', '')] do ledového jezera. [target.GetFirstNameNoTooltip] leží na zemi, vetřelec [Select_CString(target.IsFemale, 'ji tiskne', 'ho tiskne')] k podlaze a mezi nimi se leskne čepel. S řevem popadnu padoucha za límec a mrštím jím proti zdi. Zbytek splývá v jedinou šmouhu.\n\nKdyž je po nebezpečí, obrátím se k [target.GetFirstNameNoTooltip]."
 court_outcome.1101.target_fights.desc: "Výjev přede mnou je úplně jiný, než jsem čekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Převrácený nábytek, potrhané závěsy a [target.GetFirstName], [Select_CString(target.IsFemale, 'která stojí', 'který stojí')] nad nehybným tělem s krvavou dýkou v ruce.\n\n"
 court_outcome.1101.end.desc: "„[target.GetFirstNameNoTooltip], jsi v pořádku?“ zeptám se opatrně. Jako by má slova prolomila kouzlo, [target.GetTitledFirstName] se konečně vzpamatuje a vrhne se mi do náruče. „Díky [target.GetFaith.HighGodName], že jsi tady, [ROOT.Char.GetFirstNameNoTooltip]!“"
 court_outcome.1101.a: "Už nikdy nedovolím, aby ti něco ublížilo!"
 court_outcome.1102.end.desc: "„Co tady děláš?!“ vyhrkne [target.GetTitledFirstName] roztřeseným hlasem. Zvednu ruce na znamení míru, ale [target.GetTitledFirstName] tasí dýku. „Ani krok! Okamžitě odejdi, nebo ti #EMP opravdu#! ublížím!“"
 court_outcome.1102.a: "Jen jsem se snažil[Select_CString(ROOT.Char.IsFemale, 'a', '')] pomoct!"
 court_outcome.1103.desc: "Zvuky zápasu nade mnou mě ženou vpřed jako nic předtím. Než vůbec stačím vymyslet nějaký plán, už jsem u okna. Vyšvihnu se nahoru — ale výjev přede mnou je úplně jiný, než jsem čekal[Select_CString(ROOT.Char.IsFemale, 'a', '')].\n\n[target.GetTitledFirstName] totiž zrovna... #EMP nezápasí#!. Ne, zdá se, že se naopak skvěle baví — společně s [targets_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 court_outcome.1105.t: "Vetřelec"
 court_outcome.1105.start.desc: "#EMP Prásk!#! Já... kde to jsem? Co se děje? Zahledím se do tmy a oči si na ni pomalu přivykají. #EMP [ROOT.Char.GetFaith.HighGodName].#! U okna mé ložnice někdo stojí.\n\n"
 court_outcome.1105.owner_fights.desc: "Vyškrábu se z postele a rozběhnu se ke dveřím, ale vetřelec je rychlejší. Popadne mě za paži, škubne a já padám k zemi. Než stačím vykřiknout, ústa mi zakryje ruka.\n\n„Dobře poslouchej, [ROOT.Char.GetTitleAsNameNoTooltip]. Když uděláš, co ti řeknu, nikomu se nic ne—“ Větu přeruší zachroptění, když se vetřelci hluboko do krku zaboří dýka.\n\n„[target.GetFirstNameNoTooltip], jsi v pořádku?“ Ten hlas bych poznal[Select_CString(ROOT.Char.IsFemale, 'a', '')] kdekoli. [Select_CString(owner.IsFemale, 'Mou zachránkyní není nikdo jiný než', 'Mým zachráncem není nikdo jiný než')] [owner.GetTitledFirstName]!"
 court_outcome.1105.target_fights.desc: "Vyškrábu se z postele a sáhnu po dýce na nočním stolku. Vetřelec mě popadne za paži a škubne, ale já se otočím a vrazím mu čepel hluboko do břicha. Dlouhou chvíli na mě jen nevěřícně hledí a rty se mu bezhlesně pohybují. Pak se zhroutí k zemi.\n\n„[target.GetFirstNameNoTooltip], jsi v pořádku?“ U okna nestojí nikdo jiný než [owner.GetTitledFirstName], s čepelí v ruce a [Select_CString(owner.IsFemale, 'připravená', 'připravený')] mě bránit. Vrhneme se k sobě a [owner.GetTitledFirstName] mě pevně obejme."
 court_outcome.1105.a: "Ach, má lásko! Už mě nikdy nespouštěj z očí!"
