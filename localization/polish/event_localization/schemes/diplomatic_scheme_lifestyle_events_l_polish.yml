l_polish:
 diplomatic_scheme_lifestyle.1001.t: "Strategické zájmy"
 diplomatic_scheme_lifestyle.1001.desc: "Zpočátku jsem si s [target.GetTitledFirstName] dopisoval[Select_CString(ROOT.Char.IsFemale, 'a', '')] jen proto, abych [Select_CString(target.IsFemale, 'ji', 'ho')] lépe poznal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Brzy jsme však zjistili, že máme mnoho společného, a teď si posíláme celé stránky úvah o vojenské strategii!"
 diplomatic_scheme_lifestyle.1001.a: "Už se nemohu dočkat dalších [Select_CString(target.IsFemale, 'jejích', 'jeho')] myšlenek."
 diplomatic_scheme_lifestyle.1001.b: "Mám nový nápad, který na [Select_CString(target.IsFemale, 'ni', 'něj')] určitě zapůsobí!"
 diplomatic_scheme_lifestyle.3001.t: "Poznávám [Select_CString(target.IsFemale, 'ji', 'ho')]"
 diplomatic_scheme_lifestyle.3001.desc: "Vím, že většina lidí by nad tím asi ohrnovala nos, ale bedlivě sledovat [target.GetTitledFirstName] přece nemůže být na škodu. Alespoň si to namlouvám, když svým spolčencům nařizuji, aby zaznamenávali vše, co má [target.GetTitledFirstName] rád[Select_CString(target.IsFemale, 'a', '')] a co nesnáší."
 diplomatic_scheme_lifestyle.3001.a: "Chci-li získat [Select_CString(target.IsFemale, 'její', 'jeho')] přátelství, musím [Select_CString(target.IsFemale, 'ji', 'ho')] nejprve poznat!"
 diplomatic_scheme_lifestyle.3001.a.tt: "#F To přece [target.GetTitledFirstName] určitě pochopí!#!"
 diplomatic_scheme_lifestyle.3001.b: "Možná na tom něco je..."
 diplomatic_scheme_lifestyle.3001.b.tt: "#F Musím svou strategii přehodnotit.#!"
 diplomatic_scheme_lifestyle.3101.t: "Konfrontace"
 diplomatic_scheme_lifestyle.3101.desc_opening_good: "„Je to všechno docela lichotivé, ale nejsem si jist[Select_CString(target.IsFemale, 'á', '')], jaké jsou vlastně vaše úmysly.“\n\n[target.GetTitledFirstName] [target.Custom('quirk_pos_present')] a pokračuje: „A pořád se motáte někde kolem... mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] byste mě prosím na chvíli nechat na pokoji?“"
 diplomatic_scheme_lifestyle.3101.desc_opening_bad: "„Tohle musí přestat!“\n\n[target.GetTitledFirstName] [target.Custom('quirk_neg_present')] a pokračuje: „Nevím, čeho se snažíte dosáhnout, [ROOT.Char.GetFirstNameNoTooltip], ale pokud chcete, abych vás nesnášel[Select_CString(target.IsFemale, 'a', '')] ještě víc, pak se vám to rozhodně podařilo!“"
 diplomatic_scheme_lifestyle.3101.a: "Na nějakou dobu se stáhnu."
 diplomatic_scheme_lifestyle.3101.a.tt: "#F Ale nevzdávám se!#!"
 diplomatic_scheme_lifestyle.3101.b: "Nevzdám se!"
 diplomatic_scheme_lifestyle.3101.b.tt: "#F To přece [target.GetTitledFirstName] nemohl[Select_CString(target.IsFemale, 'a', '')] myslet vážně.#!"
 diplomatic_scheme_lifestyle.3101.c: "Jestli to takhle cítím, možná bude nejlepší to celé ukončit."
 diplomatic_scheme_lifestyle.3201.t: "Znevažování"
 diplomatic_scheme_lifestyle.3201.desc: "„[Select_CString(sacrificial_agent.IsFemale, 'Ta', 'Ten')] [sacrificial_agent.Custom2('InsultAdjective', ROOT.Char)] [sacrificial_agent.Custom2('InsultNoun', ROOT.Char)] [sacrificial_agent.GetFirstNameNoTooltip] se pořád někde plíží - nemám před [Select_CString(sacrificial_agent.IsFemale, 'ní', 'ním')] ani chvíli klidu!“\n\nNacházím [target.GetTitledFirstName] uprostřed výbuchu vzteku namířeného proti [sacrificial_agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sacrificial_agent'))]."
 diplomatic_scheme_lifestyle.3201.a: "Přesně! A jak pořád [sacrificial_agent.Custom('quirk_neg_present')]... #EMP Fuj#!!"
 diplomatic_scheme_lifestyle.3201.b: "[sacrificial_agent.GetTitledFirstName|U] je opravdu velmi [sacrificial_agent.Custom('quirk_pos_adjective')] [Select_CString(sacrificial_agent.IsFemale, 'žena', 'muž')]!"
