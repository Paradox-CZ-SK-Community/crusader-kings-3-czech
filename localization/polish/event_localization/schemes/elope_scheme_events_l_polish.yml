l_polish:
 elope_event_title: "Útěk:"
 elope.0001.t: "$elope_event_title$ Pod rouškou stínů"
 elope.0001.positive.desc: "Poslední přípravy jsou hotové. Únikovou cestu mám naplánovanou, stráže podplacené a [target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'připravená', 'připravený')]. Dnes v noci, až se [location.GetNameNoTooltip] ponoří do tmy, [target.Custom('LoverPetName')] konečně získá svobodu a já si [Select_CString(target.IsFemale, 'ji vezmu za manželku', 'ho vezmu za manžela')]."
 elope.0001.negative.desc: "V duchu si znovu procházím celý plán. Únikovou cestu mám naplánovanou, stráže snad dostaly své úplatky a doufám, že [target.GetTitledFirstName] obdržel[Select_CString(target.IsFemale, 'a', '')] můj vzkaz včas. Ale co když ne? Co když ho [target.GetTitledFirstName] vůbec nedostal[Select_CString(target.IsFemale, 'a', '')]? A co všechno ostatní, co se mohlo pokazit...\n\nNa pochybnosti už není čas. Tohle je má jediná šance. Ať se stane cokoli, musím za [Select_CString(target.IsFemale, 'ní', 'ním')] jít, nebo celý plán opustit."
 elope.0001.a: "Už jdu! [target.GetFirstNameNoTooltip] dnes získá svobodu!"
 elope.0001.b: "Co to dělám? Vždyť je to šílenství!"
 elope.0001.a.tt: "[target.GetShortUIName] a já se pokusíme společně uprchnout"
 elope.0001.a.success: "#P Uspěji#!"
 elope.0001.a.failure_discover: "#N Neuspěji a budu [Select_CString(ROOT.Char.IsFemale, 'odhalena', 'odhalen')]#!"
 elope.0001.a.failure_hidden: "#N Neuspěji#!, ale nikdo mě neodhalí"
 elope.1001.t: "$elope_event_title$ Láska přetrvá"
 elope.1001.start.desc: "Během čekání si nedokážu přestat představovat všechno, co by se mohlo pokazit. Připadám si naprosto bezmocně - a s tímhle pocitem se #EMP rozhodně#! nechci blíže seznamovat.\n\nV dálce zahlédnu pochodeň, která se blíží naším směrem, a pokynu svým strážím, aby se ukryly."
 elope.1001.start.desc_brave: "Během čekání musím neustále myslet na to, kde právě [target.GetFirstName] je. Je [target.GetFirstNameNoTooltip] v pořádku? Podařilo se [Select_CString(target.IsFemale, 'jí', 'mu')] uniknout? Pronásleduje [Select_CString(target.IsFemale, 'ji', 'ho')] někdo?\n\nV dálce zahlédnu pochodeň, která se blíží naším směrem, a pokynu svým strážím, aby se ukryly."
 elope.1001.end.desc: "Světlo se přibližuje a rozeznáváme dvě siluety. Jedna z nich má meč, o tom není pochyb. Ta druhá... to musí být #EMP [Select_CString(target.IsFemale, 'ona', 'on')]#!!\n\nRozběhnu se vstříc [target.Custom('LoverPetName')] a [target.GetTitledFirstName] se mi vrhne do náruče. Objetí je krátké, ale sladké jako med. Ruku v ruce se dáváme do běhu."
 elope.1001.a: "Pospěš, má lásko! [ROOT.Char.Custom('DefaultPriestTitle')] už čeká!"
 elope.1002.t: "Zmizení v noci"
 elope.1002.start.desc: "Ze spánku mě vytrhne prudké bušení na dveře. „[Select_CString(ROOT.Char.IsFemale, 'Má', 'Můj')] [ROOT.Char.GetTitleAsNameNoTooltip]! Našli jsme mrtvého strážného a [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('target'))] je pryč!“"
 elope.1002.desc_naked: "Vyskočím z postele a ještě než vyrazím ze dveří, už křičím rozkazy."
 elope.1002.desc_not_naked: "Vyskočím z postele a při oblékání už křičím rozkazy."
 elope.1002.desc: "\n\nPátrání pokračuje celé hodiny. Teprve kolem poledne najdou podepsaný dopis. Napsal[Select_CString(target.IsFemale, 'a', '')] ho [target.GetTitledFirstName] a rukopis nelze s ničím splést.\n\n"
 elope.1002.apologetic_relationship.desc: "„Je mi to nesmírně líto, ale musím následovat své srdce. Odcházím od tebe, protože mou životní láskou je [owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)].“"
 elope.1002.unapologetic_relationship.desc: "„Odcházím. [owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)] je člověk, kterého si vezmu. Nechoď za mnou - raději zemřu, než abych se k tobě někdy [Select_CString(target.IsFemale, 'vrátila', 'vrátil')]!“"
 elope.1002.apologetic_family.desc: "„[ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('target'))|U], odcházím, abych si vzal[Select_CString(target.IsFemale, 'a', '')] svou životní lásku - [owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]. Jediné, po čem toužím, je být šťastn[Select_CString(target.IsFemale, 'á', 'ý')]. Doufám, že mi jednou dokážeš odpustit.“"
 elope.1002.unapologetic_family.desc: "„Kdyby pro tebe opravdu něco znamenalo, že jsem [ROOT.Char.Custom2('RelationToMeShort', target)], přál[Select_CString(ROOT.Char.IsFemale, 'a', '')] by sis mé štěstí. Ale když ti na mně tak málo záleží, odcházím za hlasem svého srdce. [owner.Custom2('YourCharacterIntroduction', ROOT.Char)] je člověk, kterého si vezmu, a nic s tím neuděláš!“"
 elope.1002.a.fallback: "Jak tohle mohl[Select_CString(target.IsFemale, 'a', '')] [target.GetTitledFirstName] udělat?"
 elope.1002.a.vengeful: "Za tohle [target.Custom2('InsultNounSexual', ROOT.Char)] zaplatí, jak si zaslouží!"
 elope.1002.a.compassionate: "Doufám, že [target.GetTitledFirstName] najde štěstí, ať se stane cokoli."
 elope.1003.opening: "[target_keeper.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 elope.1003.start.desc: "Dovoluji si vás informovat, že"
 elope.1003.target_root_family.desc: "[target.GetFirstName] ([ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('target'))])"
 elope.1003.target_keeper_relation.desc: "[target.GetFirstName] ([target_keeper.Custom2('RelationToMeShort', SCOPE.sC('target'))])"
 elope.1003.target_liege_subject.desc: "[target.GetFirstName] ([Select_CString(target.IsFemale, 'má poddaná', 'můj poddaný')])"
 elope.1003.middle.desc: "a"
 elope.1003.owner_root_family.desc: "[owner.GetFirstName] ([ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('owner'))]) jsou na útěku!"
 elope.1003.your_character_introduction.desc: "[owner.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)] jsou na útěku!"
 elope.1003.end.desc: "Řeknu to bez obalu: je to vážná urážka a poskvrna cti vaší rodiny. Pokud ten #EMP šťastný pár#! vyhledá útočiště v [capital.GetNameNoTooltip], věřím, že jim dáte za vyučenou!"
 elope.1003.a: "Jaká pohroma!"
 elope.1011.t: "$elope_event_title$ Pochodně ve tmě"
 elope.1011.middle.desc: "Vidím dvě siluety, tři, čtyři... [ROOT.Char.GetFaith.HighGodName], to nevěstí nic dobrého!"
 elope.1011.end.desc: "Na můj povel ustupujeme houštím. Naši pronásledovatelé se naproti tomu s žádnou nenápadností nezdržují a rychle se přibližují.\n\n„Nemůžeš se skrývat věčně, [ROOT.Char.GetTitledFirstNameNoTooltip]! Jednoho z tvých lidí jsme už zajali a ty budeš další!“"
 elope.1011.a: "#EMP Utíkejte!#!"
 elope.1012.t: "Nezdařený útěk"
 elope.1012.desc: "Pokus o útěk s [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] byl zmařen! Velitel stráží mi sděluje, že [owner.Custom2('YourCharacterIntroduction', ROOT.Char)] plánoval[Select_CString(owner.IsFemale, 'a', '')] [target.GetTitledFirstName] odvést a tajně si [Select_CString(target.IsFemale, 'ji', 'ho')] vzít.\n\nA jako by to nestačilo, dopisy nalezené v komnatách [target.GetFirstNamePossessiveNoTooltip] dokazují, že [target.GetTitledFirstName] o celém plánu věděl[Select_CString(target.IsFemale, 'a', '')] a spolupracoval[Select_CString(target.IsFemale, 'a', '')]!"
 elope.1012.a: "[owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNounSexual', ROOT.Char)] nikdy nedostane [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('target'))]!"
 elope.1012.b: "Zrada! [target.GetFirstNameNoTooltip] zavřete, #EMP okamžitě!#!"
 elope.1012.c: "Za tohle budou trpět, na to vezměte jed!"
 elope.1012.d: "Z toho mě začíná bolet hlava..."
 elope.1021.end.desc: "\n\nNa můj povel ustupujeme houštím. Čirou náhodou se nám podaří dostat zpět ke kočáru a pod rouškou noci uniknout."
 elope.1021.a: "[target.GetFirstNameNoTooltip], má lásko... Modlím se, abys byl[Select_CString(target.IsFemale, 'a', '')] v pořádku."
 elope.2000.t: "Má lásko,"
 elope.2000.start.desc: "Přesvědčuješ mě, že se nemám bát, ale své obavy už nedokážu držet na uzdě. Co když"
 elope.2000.target_relation.desc: "[discoverer.GetFirstName], [target.Custom2('RelationToMeShort', SCOPE.sC('discoverer'))], zjistí, co plánujeme? Skoro nemohu spát a sotva v sobě udržím jídlo. [discoverer.GetTitledFirstName] si začíná dělat starosti - a možná už něco tuší!"
 elope.2000.titledname.desc: "[discoverer.GetTitledFirstName] zjistí, co plánujeme? Kdykoli se [discoverer.GetTitledFirstNameNoTooltip] objeví, ztuhnu a nezmohu se na slovo. Je jen otázkou času, než si něčeho všimne!"
 elope.2000.end.desc: "\n\nDochází nám čas. Prosím, můj nejdražší [ROOT.Char.GetFirstNameNoTooltip], pospěš si!"
 elope.2000.a: "Urychlíme přípravy, [target.Custom('LoverPetName')]."
 elope.2000.c: "Věř mi - všechno mám pod kontrolou."
 elope.2000.c.success: "[target.GetShortUIName|U] je [Select_CString(target.IsFemale, 'přesvědčená', 'přesvědčený')]"
 elope.2000.c.failure: "[target.GetShortUIName|U] se cítí [Select_CString(target.IsFemale, 'nevyslyšená', 'nevyslyšený')]"
 elope.2000.b: "Tak mi tedy neposílej dopisy!"
