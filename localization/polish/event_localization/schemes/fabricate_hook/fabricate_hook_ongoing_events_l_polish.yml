l_polish:
 fabricate_hook_ongoing.0001.t: "$fabricate_hook_header$ Rodinný kontakt"
 fabricate_hook_ongoing.0001.desc: "Pro [target.GetTitledFirstName] je [family_member.GetTitledFirstName] [target.Custom2('RelationToMe', SCOPE.sC('family_member'))|l] a v poslední době je nezvykle [Select_CString(family_member.IsFemale, 'sdílná', 'sdílný')]. I když ví, že mé úmysly s [target.GetFirstName] nemusí být zrovna čisté, na mé otázky odpovídá více než ochotně."
 fabricate_hook_ongoing.0001.a: "„Má [target.GetFirstNameNoTooltip] nějaké zvláštní slabiny, o kterých bych měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] vědět?“"
 fabricate_hook_ongoing.0001.b: "„Jak by se dalo s [target.GetFirstNameNoTooltip] více sblížit?“"
 fabricate_hook_ongoing.0002.t: "$fabricate_hook_header$ Nezdravý vliv"
 fabricate_hook_ongoing.0002.desc: "Když je nablízku [hooking_character.GetTitledFirstName], [target.GetTitledFirstName] si dává nezvykle velký pozor. Pro [target.GetFirstNameNoTooltip] je přitom [hooking_character.GetFirstNameNoTooltip] [target.Custom2('RelationToMeShort', hooking_character)|l]. Taková úslužnost může znamenat jediné — [hooking_character.GetFirstNameNoTooltip] má na [target.GetFirstNameNoTooltip] nějakou páku.\n\nMožná bych z toho mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] něco vytěžit?"
 fabricate_hook_ongoing.0002.a: "Moji špehové musí zjistit, co se za tou záhadou skrývá."
 fabricate_hook_ongoing.0002.b: "Musím zjistit, k čemu [hooking_character.GetFirstNameNoTooltip] [target.GetFirstNameNoTooltip] nutí!"
 fabricate_hook_ongoing.0003.t: "$fabricate_hook_header$ Klepy"
 fabricate_hook_ongoing.0003.desc_servant: "Moji agenti navázali kontakt s [servant.GetTitledFirstName], [Select_CString(servant.IsFemale, 'služebnicí', 'služebníkem')] v [target.Custom('ResidenceBuilding')|l], kde žije [Select_CString(target.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName]."
 fabricate_hook_ongoing.0003.desc: "Moji agenti navázali kontakt se služebnictvem v [target.Custom('ResidenceBuilding')|l], kde žije [Select_CString(target.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], [target.GetTitledFirstName]."
 fabricate_hook_ongoing.0003.desc_ending: "\n\nZa správnou pobídku je [dummy_servant_gender.GetSheHe] ochotn[Select_CString(dummy_servant_gender.IsFemale, 'á', 'ý')] začít #EMP šeptat#!, že [target.GetTitledFirstNameNoTooltip] zdaleka není tak [target.Custom('FormalComplimentAdjective')|l], jak se tváří!"
 fabricate_hook_ongoing.0003.a: "Zničíme [target.GetFirstNameNoTooltip] pověst!"
 fabricate_hook_ongoing.0003.a_gregarious: "#EMP Víš#!, že je to správná věc."
 fabricate_hook_ongoing.0003.b: "Stačí mi někdo nablízku, kdo [target.GetFirstNameNoTooltip] ochotně vyslechne."
 fabricate_hook_ongoing.0003.b_lustful: "Nebo bychom místo toho mohli něco #EMP začít#! my dva..."
 fabricate_hook_ongoing.0004.t: "$fabricate_hook_header$ Otázka vkusu"
 fabricate_hook_ongoing.0004.desc: "[target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] je složitá osobnost.\n\nPokud chci při nadcházejících... #EMP sporech#! přesvědčit ostatní, aby se postavili na mou stranu, musím co nejlépe pochopit, co je [target.GetFirstNameNoTooltip] zač."
 fabricate_hook_ongoing.0004.a: "Brzy zjistím, co je [target.GetFirstNameNoTooltip] skutečně zač."
 fabricate_hook_ongoing.0004.b.success: "Dozvíš se více o [target.GetFirstNameNoTooltip]"
 fabricate_hook_ongoing.0004.b.failure: "[target.GetShortUIName|U] tě odhalí"
 fabricate_hook_ongoing.0004.b: "Dám si na čas."
 fabricate_hook_ongoing.0005.desc: "Lidé popisují [target.GetTitledFirstName] jako [target.Custom('ComplimentAdjective')|l] i [target.Custom2('InsultAdjective', ROOT.Char)|l], což mi vypovídá více o jejich vztahu k [target.GetFirstNameNoTooltip] než o čemkoli jiném.\n\nPozoruhodně mnoho lidí také zmiňuje, jak často [target.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('target'))|l] a mluví o [target.Custom('herhis_subject_of_interest')|l]."
 fabricate_hook_ongoing.0005.a: "Tyto informace se mi určitě budou hodit."
