l_polish:
 fabricate_hook_header: "Vykonstruování páky:"
 fabricate_hook_hook_gained_on_you: "@warning_icon [owner.GetShortUIName] [Select_CString(owner.IsFemale, 'vykonstruovala', 'vykonstruoval')] na tebe [Concept('hook','páku')|E]!"
 fabricate_hook_outcome.0001.t: "$fabricate_hook_header$ Tajemství"
 fabricate_hook_outcome.0001.desc: "Zdá se, že [target.GetTitledFirstName] má co skrývat. Jaké štěstí pro mě. Tentokrát nemusím být při hledání způsobu, jak si [target.GetFirstNameNoTooltip] podrobit, ani příliš vynalézavý."
 fabricate_hook_outcome.0001.a: "Stačí dát [target.GetFirstNameNoTooltip] najevo, co všechno vím..."
 fabricate_hook_outcome.0001.b: "Prozatím si to nechám pro sebe."
 fabricate_hook_outcome.0001.c: "Ach, tohle by se měl dozvědět úplně každý!"
 fabricate_hook_outcome.1001.t: "$fabricate_hook_header$ Choulostivá situace"
 fabricate_hook_outcome.1001.desc: "Každý je #EMP někdy#! nahý. Těžší bude zařídit, aby skupina kejklířů vtrhla do komnat [target.GetTitledFirstName] přesně v pravou chvíli a aby kolem bylo dost služebnictva, které si začne šeptat o chaosu, jenž následoval.\n\nMám podezření, že [target.GetFirstNameNoTooltip] udělá cokoli, jen abych nepřikládal[Select_CString(ROOT.Char.IsFemale, 'a', '')] pod kotel následných klepů..."
 fabricate_hook_outcome.1001.a: "Pošlete dovnitř kejklíře!"
 fabricate_hook_outcome.1001.a.flavor: "Uf, zase musím mluvit s kejklíři."
 fabricate_hook_outcome.1001.b: "Měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] bych si to ještě pořádně promyslet."
 fabricate_hook_outcome.1001.c: "Tohle celé byla obrovská chyba."
 fabricate_hook_outcome.1002.t: "$fabricate_hook_header$ Usvědčující dopis"
 fabricate_hook_outcome.1002.desc: "Zadržení posla od dvora [target.GetTitledFirstName] mi otevřelo zajímavou příležitost.\n\n"
 fabricate_hook_outcome.1002.desc.vassals: "Když napodobím pečeť, kterou používá [target.GetTitleAsName], mohu zfalšovat dopis hrozící zvýšením daní a rozšířit jej mezi vazaly. Nebo tím alespoň pohrozit..."
 fabricate_hook_outcome.1002.desc.no_vassals: "Když napodobím pečeť, kterou používá [target.GetTitleAsName], mohu zfalšovat dopis hrozící zvýšením daní a rozšířit jej mezi dvořany. Nebo tím alespoň pohrozit..."
 fabricate_hook_outcome.1002.a: "„Tohle #EMP je#! tvůj podpis, nebo snad ne?“"
 fabricate_hook_outcome.1003.t: "$fabricate_hook_header$ Odvážná záchrana"
 fabricate_hook_outcome.1003.desc: "Nebylo by nádherné, kdyby mi [target.GetTitledFirstName] něco dlužil[Select_CString(target.IsFemale, 'a', '')] nikoli ze strachu, ale z vděčnosti? Kdybych například při cestě zachránil[Select_CString(ROOT.Char.IsFemale, 'a', '')] [target.GetFirstNameNoTooltip] před krutými lapky? Třeba právě před těmi krutými lapky, kteří teď čekají před hradní branou?\n\nNa poslední chvíli bych se svými strážemi přispěchal[Select_CString(ROOT.Char.IsFemale, 'a', '')], zahnal[Select_CString(ROOT.Char.IsFemale, 'a', '')] je a [target.GetFirstNameNoTooltip] by mi dlužil[Select_CString(target.IsFemale, 'a', '')] život."
 fabricate_hook_outcome.1003.a: "Tak prosté, a přitom tak přesvědčivé."
 fabricate_hook_outcome.1004.t: "$fabricate_hook_header$ Odporné řeči"
 fabricate_hook_outcome.1004.desc: "Rozšířil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem o [target.GetTitledFirstName] celou řadu odporných klepů. Ani jeden není pravdivý a někdo by je měl veřejně odsoudit jako očividné lži.\n\nA kdo jiný než právě ten #EMP někdo#! by pak mohl mít [target.GetFirstNameNoTooltip] zavázaného?"
 fabricate_hook_outcome.1004.a: "Musím se proti té nespravedlnosti postavit!"
 fabricate_hook_outcome.1004.a.flavor: "Můj [ROOT.Char.GetFaith.PriestNeuter] z toho radost mít nebude."
 fabricate_hook_outcome.1004.a.flavor_sacred_shadows: "Můj [ROOT.Char.GetFaith.PriestNeuter] z toho bude nadšený!"
 fabricate_hook_outcome.1005.t: "$fabricate_hook_header$ Barbarské, ale účinné"
 fabricate_hook_outcome.1005.desc: "Nejjednodušší řešení bývá často nejlepší. Proč se trápit všemi těmi intrikami a manipulací, když mohu [target.GetTitledFirstName] jednoduše donutit, aby dělal[Select_CString(target.IsFemale, 'a', '')], co chci?\n\nPár hromotluků a několik výhrůžně formulovaných dopisů by mělo stačit."
 fabricate_hook_outcome.1005.a: "Písaři! Máme dopisy k sepsání!"
 fabricate_hook_outcome.1005.a.flavor: "„Má nejdražší oběti...“"
 fabricate_hook_outcome.2001.t: "$fabricate_hook_header$ Podlý úskok"
 fabricate_hook_outcome.2001.desc: "[owner.GetTitledFirstName] pomocí podlých machinací vykonstruoval[Select_CString(owner.IsFemale, 'a', '')] situaci, která mu dává nade mnou páku!\n\nMohu to odsuzovat jako samé lži a podvody, ale nezbývá mi než se tomu podvolit."
 fabricate_hook_outcome.2001.a: "Myslel[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že něčeho takového nejsi schopn[Select_CString(owner.IsFemale, 'á', 'ý')], [owner.GetFirstNameNoTooltip]."
 fabricate_hook_outcome.3001.t: "$fabricate_hook_header$ Ztráta převahy"
 fabricate_hook_outcome.3001.desc: "[target.GetTitledFirstName] odhalil[Select_CString(target.IsFemale, 'a', '')], že se nad [target.GetFirstNameNoTooltip] snažím nečestnými prostředky získat páku!\n\nMusím udělat vše, co je v mých silách, abych zachránil[Select_CString(ROOT.Char.IsFemale, 'a', '')] svou pověst!"
 fabricate_hook_outcome.3001.a: "Tím mé snažení končí..."
