l_polish:
 hostile_scheme_discovery.1001.t: "Intrika u [ROOT.Char.Custom('GetCourt')|U]"
 hostile_scheme_discovery.1001.close_relation: "Přichází za mnou [spymaster.GetCouncilTitle] se závažnou zprávou. Je si jist[Select_CString(spymaster.IsFemale, 'á', '')], že [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], proti mně kuje pikle!"
 hostile_scheme_discovery.1001.close_relation_no_spymaster: "Dostala se ke mně závažná zpráva. [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], proti mně kuje pikle!"
 hostile_scheme_discovery.1001.close_relation_spymaster_other_target: "Přichází za mnou [spymaster.GetCouncilTitle] se závažnou zprávou. Je si jist[Select_CString(spymaster.IsFemale, 'á', '')], že [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], kuje pikle proti [Select_CString(spymaster.IsFemale, 'ní', 'němu')]!"
 hostile_scheme_discovery.1001.close_relation_other_target: "Přichází za mnou [spymaster.GetCouncilTitle] se závažnou zprávou. Je si jist[Select_CString(spymaster.IsFemale, 'á', '')], že [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], kuje pikle proti [targeted_courtier.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))]!"
 hostile_scheme_discovery.1001.close_relation_no_spymaster_other_target: "Dostala se ke mně závažná zpráva. [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], kuje pikle proti [targeted_courtier.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))]!"
 hostile_scheme_discovery.1001.desc: "Přichází za mnou [spymaster.GetCouncilTitle] s odhalením. Je si jist[Select_CString(spymaster.IsFemale, 'á', '')], že [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], proti mně kuje pikle!"
 hostile_scheme_discovery.1001.desc_no_spymaster: "Dostala se ke mně závažná zpráva. Vyšlo najevo, že [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], proti mně kuje pikle!"
 hostile_scheme_discovery.1001.desc_other_target_spymaster: "Přichází za mnou [spymaster.GetCouncilTitle] s odhalením. Je si jist[Select_CString(spymaster.IsFemale, 'á', '')], že [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], kuje pikle proti [Select_CString(spymaster.IsFemale, 'ní', 'němu')]!"
 hostile_scheme_discovery.1001.desc_other_target: "Přichází za mnou [spymaster.GetCouncilTitle] s odhalením. Je si jist[Select_CString(spymaster.IsFemale, 'á', '')], že [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], kuje pikle proti [targeted_courtier.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))]!"
 hostile_scheme_discovery.1001.desc_no_spymaster_other_target: "Dostala se ke mně závažná zpráva. Vyšlo najevo, že [agent.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], kuje pikle proti [targeted_courtier.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('targeted_courtier'))]!"
 hostile_scheme_discovery.1001.a: "Ať každý ví, kdo je zrádce."
 hostile_scheme_discovery.1001.b: "Uvrhněte [Select_CString(agent.IsFemale, 'ji', 'ho')] do žaláře!"
 hostile_scheme_discovery.1001.b.tt_not_your_courtier_or_vassal: "[agent.GetTitledFirstName] není tvůj [Concept('courtier','dvořan')|E] ani [Concept('vassal','vazal')|E]"
 hostile_scheme_discovery.1001.c: "Ať už je to pravda, nebo ne, [agent.GetFirstNameNoTooltip] obviňovat nebudu."
 hostile_scheme_discovery.1001.c.tt: "[agent.GetFirstNameNoTooltip] zůstane na svobodě."
 hostile_scheme_discovery.1002.t: "Intrikán odhalen!"
 hostile_scheme_discovery.1002.intro: "Přichází za mnou [spymaster.GetCouncilTitle] se závažnou zprávou: za vším stojí [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 hostile_scheme_discovery.1002.intro_no_spymaster: "Dostala se ke mně závažná zpráva: za vším stojí [owner.Custom2('MyCharacterIntroduction', ROOT.Char)]"
 hostile_scheme_discovery.1002.murder: "a plánuje zabít"
 hostile_scheme_discovery.1002.abduction: "a plánuje unést"
 hostile_scheme_discovery.1002.elope: "a plánuje uprchnout s"
 hostile_scheme_discovery.1002.steal_back_artifact: "a plánuje ukrást artefakt"
 hostile_scheme_discovery.1002.fallback: "a kuje pikle proti"
 hostile_scheme_discovery.1002.a: "[owner.Custom2('InsultAdjective', ROOT.Char)] ďábel!"
 hostile_scheme_discovery.2001.intro: "Přichází za mnou [spymaster.GetCouncilTitle] se závažnou zprávou. Zatím sice nevíme, kdo za tím stojí, ale"
 hostile_scheme_discovery.2001.intro_no_spymaster: "Dostala se ke mně závažná zpráva. Zatím sice není známo, kdo za tím stojí, ale"
 hostile_scheme_discovery.2001.murder: "někdo plánuje zabít"
 hostile_scheme_discovery.2001.abduction: "někdo plánuje unést"
 hostile_scheme_discovery.2001.fallback: "někdo kuje pikle proti"
 hostile_scheme_discovery.2001.elope: "někdo plánuje uprchnout s"
 hostile_scheme_discovery.2001.steal_back_artifact: "někdo se pokouší okrást"
 hostile_scheme_discovery.2001.depose: "někdo plánuje sesadit"
 hostile_scheme_discovery.2001.target_other: "[target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))]!"
 hostile_scheme_discovery.2001.target_spymaster: "[Select_CString(target.IsFemale, 'ji', 'ho')]!\n\n„Nevědí, s kým mají tu čest, [ROOT.Char.Custom('FormOfAddressForLiege')]. Myslí si, že mohou zabít #EMP mě#!? Já jim ukážu. To tedy ano.“"
 hostile_scheme_discovery.2001.target_me: "mě!"
 hostile_scheme_discovery.2001.a: "Musíme toho ničemu zastavit!"
 hostile_scheme_discovery.3001.t: "Spolčenec odhalen!"
 hostile_scheme_discovery.3001.intro: "[agent.GetTitledFirstName], můj spolčenec v intrice [scheme.GetName|l] u dvora [court_owner.GetTitledFirstName], byl[Select_CString(agent.IsFemale, 'a', '')] odhalen[Select_CString(agent.IsFemale, 'a', '')]!"
 hostile_scheme_discovery.3001.imprisoned: "\n\n[court_owner.GetTitleAsName] teď nechal[Select_CString(court_owner.IsFemale, 'a', '')] [Select_CString(agent.IsFemale, 'ji', 'ho')] zavřít."
 hostile_scheme_discovery.3001.accused: "\n\nTeď už všichni vědí, že [agent.GetTitledFirstName] není důvěryhodn[Select_CString(agent.IsFemale, 'á', 'ý')], a mé věci už dál nepomůže."
 hostile_scheme_discovery.3001.a: "Proklínám [court_owner.GetTitledFirstNameNoTooltip] i [Select_CString(spymaster.IsFemale, 'její', 'jeho')] [spymaster.GetCouncilTitle]!"
 hostile_scheme_discovery.3002.t: "Intrika odhalena"
 hostile_scheme_discovery.3002.desc: "Existence mého plánu [scheme.GetFullActionName] byla odhalena!\n\nO mém zapojení zatím nikdo neví, ale uskutečnit mé záměry teď bude mnohem obtížnější."
 hostile_scheme_discovery.3002.a: "K čertu!"
 hostile_scheme_discovery.3003.t: "Mé zapojení odhaleno"
 hostile_scheme_discovery.3003.desc: "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] odhalil[Select_CString(target.IsFemale, 'a', '')], že jsem strůjcem intriky"
 hostile_scheme_discovery.3003.murder: "s cílem [Select_CString(target.IsFemale, 'ji', 'ho')] zavraždit!"
 hostile_scheme_discovery.3003.abduction: "s cílem [Select_CString(target.IsFemale, 'ji', 'ho')] unést!"
 hostile_scheme_discovery.3003.elope: "s cílem s [Select_CString(target.IsFemale, 'ní', 'ním')] uprchnout!"
 hostile_scheme_discovery.3003.steal_back_artifact: "s cílem ukrást [Select_CString(target.IsFemale, 'jí', 'mu')] artefakt!"
 hostile_scheme_discovery.3003.fallback: "namířené proti [Select_CString(target.IsFemale, 'ní', 'němu')]!"
 hostile_scheme_discovery.3003.a: "Muselo dojít k nedorozumění!"
 hostile_scheme_discovery.4001.t: "Intrika odhalena!"
 hostile_scheme_discovery.4001.opening: "Má intrika proti [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], byla odhalena!"
 hostile_scheme_discovery.4001.end: "\n\nDokonce i [ROOT.Char.Custom('GetCourtierPlural')|l] si za mými zády šeptají. Veškerá důvěra či náklonnost, kterou ke mně snad chovali, se po tomto odhalení rozplynula."
 hostile_scheme_discovery.4002.opening: "Má intrika usilující o smrt [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], byla odhalena! Teď už všichni vědí, že jsem plánoval[Select_CString(ROOT.Char.IsFemale, 'a', '')] [target.GetTitledFirstName] zabít."
 hostile_scheme_discovery.4001.a: "Tohle všechno je jedno velké nedorozumění!"
 hostile_scheme_discovery.4001.b: "Ještě jim ukážu, čeho všeho jsem schopn[Select_CString(ROOT.Char.IsFemale, 'á', 'ý')]."
