 influence_house_ambition_ongoing.1002.tt: "Tvrdá jednání" # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1002.desc: "Začínám pochybovat, jestli mě [target.GetFirstName] vůbec bere vážně. Slyším jen mlhavé sliby, odklady a nekonečné žvanivé debaty.\n\nNastal čas dát najevo svou nespokojenost. Možná ne přímo, ale tak, aby [target.GetFirstName] pochopil, že urazit [ROOT.Char.GetTitleAsNameNoTooltip] mého kalibru má své následky!" # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1002.a: "Poškoď [Select_CString(target.IsFemale,'její','jeho')] obchodní zájmy." # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1002.b: "Nech rváče přepadnout a zbít [Select_CString(target.IsFemale,'jejího','jeho')] dvořana." # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1002.c: "Zapálit [Select_CString(target.IsFemale,'její','jeho')] dům." # todo: NEW TRANSLATION
