 influence_house_ambition_ongoing.1001.tt: "Vnímavý posluchač" # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1001.desc: "Kdybych [Select_CString(ROOT.Char.IsFemale,'našla','našel')] v [target.GetFirstNamePossessive] družině někoho, kdo by mi ochotně naslouchal, mohl by mi pomoci ovlivnit [Select_CString(target.IsFemale,'její','jeho')] mínění a přimět [target.GetHerHim], aby věci viděl po mém.\n\nMěl bych vybrat někoho příjemného na pohled, kdo se umí dobře vyjadřovat. Neuškodilo by ani, kdyby byl pohledný.\n\nPo nenápadném vyptávání na dvořany [target.GetFirstNamePossessive] jsem [Select_CString(target.IsFemale,'našla','našel')] dva vhodné kandidáty: [target_associate_01.GetFirstName] a [target_associate_02.GetFirstName]." # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 influence_house_ambition_ongoing.1001.a: "[target_associate_01.GetFirstNameNoTooltip] je dobrá volba." # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1001.b: "[target_associate_02.GetFirstNameNoTooltip] by mohl přesvědčit [Select_CString(target_associate_02.IsFemale,'jejího','jeho')] pána." # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1001.c: "Ne. Má slova sama o sobě stačí." # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1001_1_success.desc: "[target_associate_01.GetFirstNameNoTooltip] přednese přesvědčivý argument v tvůj prospěch" # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1001_1_failure.desc: "[target_associate_01.GetFirstNameNoTooltip] nedokáže sestavit dobrý argument" # todo: NEW TRANSLATION
 influence_house_ambition_ongoing.1001_2_success.desc: "[target_associate_02.GetFirstNameNoTooltip] přednese přesvědčivý argument v tvůj prospěch" # todo: NEW TRANSLATION
