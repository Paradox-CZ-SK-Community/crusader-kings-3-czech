l_polish:
 intrigue_scheme_lifestyle.1001.t: "Kázeň a věrnost"
 intrigue_scheme_lifestyle.1001.desc: "Když si uvědomím, jak se vojáci mezi sebou chovají a jak volně se mezi nimi šíří zprávy i klepy, napadne mě jedna věc.\n\nKdyby někteří z mých vlastních vojáků pronikli mezi ty, kterým velí [target.GetTitledFirstName], mohli by mi poskytnout zcela nový pohled na [Select_CString(target.IsFemale, 'její', 'jeho')] plány."
 intrigue_scheme_lifestyle.1001.a: "Je načase, aby [target.GetFirstNameNoTooltip] přijal[Select_CString(target.IsFemale, 'a', '')] pár nových rekrutů."
 intrigue_scheme_lifestyle.1001.a.tt: "#F Mezi vojáky se klepy šíří velmi rychle... Mohu se toho dozvědět spoustu, pokud se mí spolčenci nedostanou do potíží.#!\n"
 intrigue_scheme_lifestyle.1001.b: "Ne, je to příliš riskantní."
 intrigue_scheme_lifestyle.1001.b.tt: "#F Nebudu sázet na to, komu je obyčejný voják doopravdy věrný.#!\n"
 intrigue_scheme_lifestyle.1002.t: "Kázeň a věrnost"
 intrigue_scheme_lifestyle.1002.desc: "Právě jsem obdržel[Select_CString(ROOT.Char.IsFemale, 'a', '')] zprávu, že vojáci, které jsem vyslal[Select_CString(ROOT.Char.IsFemale, 'a', '')] proniknout mezi ty, kterým velí [target.GetTitledFirstName], byli odhaleni! Kdo ví, jaký trest - nebo ještě hůř, výslech! - právě teď podstupují."
 intrigue_scheme_lifestyle.1002.a: "Raději ať neprozradí nic z mých plánů!"
 intrigue_scheme_lifestyle.3001.t: "Pravidelné návyky"
 intrigue_scheme_lifestyle.3001.desc_agents: "Mí spolčenci si všimli, že [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], má poměrně pravidelné návyky.\n\nKdyby je dokázali vypozorovat, mohlo by to vést k zásadnímu průlomu..."
 intrigue_scheme_lifestyle.3001.desc: "Uvědomil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem si, že [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], se drží poměrně pravidelného režimu. Kdybych jej dokázal[Select_CString(ROOT.Char.IsFemale, 'a', '')] vypozorovat, mohlo by to vést k zásadnímu průlomu..."
 intrigue_scheme_lifestyle.3001.a: "Osobně prostuduji [Select_CString(target.IsFemale, 'její', 'jeho')] návyky."
 intrigue_scheme_lifestyle.3001.a_agent: "Chci, aby [Select_CString(target.IsFemale, 'ji', 'ho')] někdo sledoval ve dne v noci!"
 intrigue_scheme_lifestyle.3001.a.tt: "#F Samozřejmě je to riskantní podnik...#!"
 intrigue_scheme_lifestyle.3001.b: "Je to příliš riskantní."
 intrigue_scheme_lifestyle.3001.b.tt: "#F [target.GetTitledFirstName|U] si může všimnout, že [Select_CString(target.IsFemale, 'ji', 'ho')] někdo sleduje!#!"
 intrigue_scheme_lifestyle.3101.t: "Důkladně informován[Select_CString(ROOT.Char.IsFemale, 'a', '')]"
 intrigue_scheme_lifestyle.3101.desc: "Služebnictvo u dvora bývá příhodně přehlíženo, zatímco naslouchá rozhovorům, uklízí a nepozorovaně se pohybuje chodbami...\n\nStejně je tomu i u dvora, v jehož čele stojí [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))]. To mi nabízí příležitost."
 intrigue_scheme_lifestyle.3101.a: "Některé přesvědčím, aby mým spolčencům občas něco prozradili."
 intrigue_scheme_lifestyle.3101.a.tt: "#F Informátoři mi mohou poskytnout neocenitelné zprávy, ale jsou to také amatéři se všemi riziky, která z toho plynou...#!"
 intrigue_scheme_lifestyle.3101.b: "Riziko je příliš veliké!"
 intrigue_scheme_lifestyle.3101.b.tt: "#F Takovým lidem nemohu důvěřovat!#!"
 intrigue_scheme_lifestyle.3102.desc: "Služebnictvo, které mým spolčencům předávalo informace o [target.GetTitledFirstName], bylo odhaleno!"
 intrigue_scheme_lifestyle.3102.a: "Raději ať drží jazyk za zuby!"
 intrigue_scheme_lifestyle.3201.t: "Spojení"
 intrigue_scheme_lifestyle.3201.desc_animal: "Jaké štěstí! Poselští ptáci, které používá [target.GetTitledFirstName], si oblíbili právě semena rostoucí v mé zahradě a zůstávají tu dost dlouho na to, abych si mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] přečíst jejich zprávy!"
 intrigue_scheme_lifestyle.3201.elope.desc: "Jaké štěstí! Mí spolčenci objevili cestu do pracovny [target.GetLiege.Custom2('NamePossessiveCharacterIntroduction', target)], kde jsou uchovávány rozepsané dopisy. Všechny [Select_CString(target.GetLiege.IsFemale, 'její', 'jeho')] zprávy si teď mohu přečíst!"
 intrigue_scheme_lifestyle.3201.desc: "Jaké štěstí! Mí spolčenci objevili cestu do pracovny, kde [target.GetTitledFirstName] uchovává rozepsané dopisy. Všechny [Select_CString(target.IsFemale, 'její', 'jeho')] zprávy si teď mohu přečíst!"
 intrigue_scheme_lifestyle.3201.a: "Udělejme z toho pravidlo!"
 intrigue_scheme_lifestyle.3201.b: "Poslové [target.GetTitledFirstName] mi zobou z ruky."
 intrigue_scheme_lifestyle.3201.b.tt: "Tato možnost je dostupná díky mému modifikátoru $modifier_hunt_friend_of_animal$"
 intrigue_scheme_lifestyle.3201.c: "Byla to jen šťastná náhoda, nic víc."
 intrigue_scheme_lifestyle.3301.t: "Jiná cesta"
 intrigue_scheme_lifestyle.3301.desc_murder: "Mí spolčenci si všimli, že [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] reaguje podivně pokaždé, když někdo zmíní [secret_to_reveal_target.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))]..."
 intrigue_scheme_lifestyle.3301.desc_lover: "Mí spolčenci si všimli, že [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] tráví až podezřele mnoho času o samotě s [secret_to_reveal_target.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))]..."
 intrigue_scheme_lifestyle.3301.desc_pregnancy: "Mí spolčenci si všimli, že [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] má velké starosti o zdraví [secret_to_reveal_target.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))]."
 intrigue_scheme_lifestyle.3301.desc_child: "Mí spolčenci si všimli, že [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] se nezvykle mnoho zajímá o život [secret_to_reveal_target.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))]."
 intrigue_scheme_lifestyle.3301.desc_fallback: "Mí spolčenci si všimli, že [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))] [target.GetTitledFirstName] se v přítomnosti [secret_to_reveal_target.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))], chová podivně."
 intrigue_scheme_lifestyle.3301.desc_end: "\n\nDalší pátrání by znamenalo odložit mé temné plány - jejich cílem je [target.GetTitleTierName] - ale musím přiznat, že má zvědavost je probuzena!"
 intrigue_scheme_lifestyle.3301.a: "Pokud [target.GetTitledFirstName] něco skrývá, musím zjistit co!"
 intrigue_scheme_lifestyle.3301.b: "Budu se držet svého cíle."
 intrigue_scheme_lifestyle.3301.b.tt: "#F Se smrtící přesností!#!"
 intrigue_scheme_lifestyle.3302.t: "Co skrývá [target.GetTitledFirstName]"
 intrigue_scheme_lifestyle.3302.desc_murder: "Mí spolčenci odhalují jednu podivnost za druhou, jednu stopu za druhou, až se záhy vynoří celý obraz. [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('target'))] [target.GetTitledFirstName] zabil[Select_CString(target.IsFemale, 'a', '')] [secret_to_reveal_target.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_target'))]!"
 intrigue_scheme_lifestyle.3302.desc_lover: "Mí spolčenci odhalují jednu podivnost za druhou, jednu stopu za druhou, až se záhy vynoří celý obraz: [secret_to_reveal_target.GetTitledFirstName] má milostný poměr s [target.GetTitledFirstName]!"
 intrigue_scheme_lifestyle.3302.desc_pregnancy: "Mí spolčenci odhalují jednu podivnost za druhou, jednu stopu za druhou, až se záhy vynoří celý obraz: [secret_to_reveal_target.GetTitledFirstName] čeká dítě s [target.GetTitledFirstName]!"
 intrigue_scheme_lifestyle.3302.desc_child: "Mí spolčenci odhalují jednu podivnost za druhou, jednu stopu za druhou, až se záhy vynoří celý obraz: rodiči [secret_to_reveal_target.GetTitledFirstName] jsou [target.GetTitledFirstName] a [secret_to_reveal_owner.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('secret_to_reveal_owner'))]!"
 intrigue_scheme_lifestyle.3302.desc_fallback: "Mí spolčenci odhalují jednu podivnost za druhou, jednu stopu za druhou, až se záhy vynoří celý obraz: [target.GetTitledFirstName] skutečně něco skrýval[Select_CString(target.IsFemale, 'a', '')]!"
 intrigue_scheme_lifestyle.3302.a: "Ach, tohle se mi líbí!"
 intrigue_scheme_lifestyle.3302.a.tt: "#F Mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] bych [target.GetTitledFirstName] vydírat, donutit [Select_CString(target.IsFemale, 'ji', 'ho')], aby plnil[Select_CString(target.IsFemale, 'a', '')] mé rozkazy, nebo #EMP cokoli#!!#!"
 intrigue_scheme_lifestyle.3401.t: "Cesta dovnitř"
 intrigue_scheme_lifestyle.3401.desc: "[courtier_to_fool.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('courtier_to_fool'))] [target.GetTitledFirstName], je [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('courtier_to_fool'))] [Select_CString(courtier_to_fool.IsFemale, 'žena', 'muž')]. Když se ocitnu v [Select_CString(courtier_to_fool.IsFemale, 'její', 'jeho')] společnosti, jsem zprvu obezřetn[Select_CString(ROOT.Char.IsFemale, 'á', 'ý')]. Brzy si však uvědomím, že [courtier_to_fool.GetTitledFirstName] mou společnost neodmítá zdaleka tolik, jak jsem si zprvu myslel[Select_CString(ROOT.Char.IsFemale, 'a', '')]..."
 intrigue_scheme_lifestyle.3401.a: "Prosím, příteli, pověz mi něco o sobě!"
 intrigue_scheme_lifestyle.3401.a.tt: "#F Jsem vlk v rouše beránčím a pomalu se blížím ke své kořisti...!#!"
 intrigue_scheme_lifestyle.3401.b: "Tohle je záležitost mezi [target.GetFirstNameNoTooltip] a mnou."
