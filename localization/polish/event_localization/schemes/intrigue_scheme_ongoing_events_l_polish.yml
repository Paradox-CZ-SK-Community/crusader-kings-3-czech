l_polish:
 intrigue_scheme_ongoing.1001.t: "Úplatek v pravou chvíli"
 intrigue_scheme_ongoing.1001.desc: "Zdá se, že ne všichni služebníci u dvora, kde vládne [scheme.GetTargetCharacter.GetTitledFirstName], jsou bezmezně oddaní... [agent.GetFirstName] mě ujišťuje, že zná cestu dovnitř a pár mincí ve správné kapse dokáže divy."
 intrigue_scheme_ongoing.1001.elope.desc: "Zdá se, že ne všichni služebníci u dvora, kde pobývá [scheme.GetTargetCharacter.GetTitledFirstName], jsou bezmezně oddaní [scheme.GetTargetCharacter.GetLiege.GetTitledFirstName]... [agent.GetFirstName] mě ujišťuje, že zná cestu dovnitř a pár mincí ve správné kapse dokáže divy."
 intrigue_scheme_ongoing.1001.a: "Co je koneckonců trocha zlata?"
 intrigue_scheme_ongoing.1001.b: "Je to příliš riskantní!"
 intrigue_scheme_ongoing.1002.t: "Boží spravedlnost"
 intrigue_scheme_ongoing.1002.desc: "[agent_in_question.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent_in_question'))], odsoudil[Select_CString(agent_in_question.IsFemale, 'a', '')] [scheme.GetTargetCharacter.GetTitledFirstName] za prohřešky proti božské vůli.\n\nDokonce vyzval[Select_CString(agent_in_question.IsFemale, 'a', '')] své souvěrce, aby [scheme.GetTargetCharacter.GetFirstName] stihl trest shůry, a naznačil[Select_CString(agent_in_question.IsFemale, 'a', '')], že další tresty teprve přijdou."
 intrigue_scheme_ongoing.1002.a: "Možná trochu přehnaně optimistické, ale ten zápal se mi líbí!"
 intrigue_scheme_ongoing.1002.a.success: "[agent_in_question.GetTitledFirstName|U] získá pro naši věc místní [agent_in_question.GetFaith.GetAdherentNamePlural]"
 intrigue_scheme_ongoing.1002.a.failure: "[agent_in_question.GetFirstNameNoTooltip] se ve svém zápalu prozradí"
 intrigue_scheme_ongoing.1002.b: "[agent_in_question.GetTitledFirstNameNoTooltip] bude mlčet, nebo ať mi [agent_in_question.GetFaith.HighGodName] pomáhá."
 intrigue_scheme_ongoing.1002.c: "V tomhle ušlechtilém úsilí [Select_CString(agent_in_question.IsFemale, 'jí', 'mu')] pomohu!"
 intrigue_scheme_ongoing.1004.t: "Příliš upovídan[Select_CString(agent_in_question.IsFemale, 'á', 'ý')]"
 intrigue_scheme_ongoing.1004.desc: "Schopnost [agent_in_question.GetFirstNameNoTooltip] navazovat přátelství se pro mou intriku ukázala jako neocenitelná, jenže v přítomnosti ostatních není [agent_in_question.GetTitledFirstName] zdaleka tak opatrn[Select_CString(agent_in_question.IsFemale, 'á', 'ý')], jak by měl[Select_CString(agent_in_question.IsFemale, 'a', '')] být.\n\nAž příliš rád[Select_CString(agent_in_question.IsFemale, 'a', '')] trousí neurčité narážky, a kdyby se někdo začal vyptávat, těžko říct, co všechno by prozradil[Select_CString(agent_in_question.IsFemale, 'a', '')]."
 intrigue_scheme_ongoing.1004.a: "To, co se dozvídá, je příliš cenné, než abych [Select_CString(agent_in_question.IsFemale, 'ji', 'ho')] umlčel[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 intrigue_scheme_ongoing.1004.a.success: "[agent_in_question.GetFirstNameNoTooltip] zůstane neodhalen[Select_CString(agent_in_question.IsFemale, 'a', '')]"
 intrigue_scheme_ongoing.1004.a.failure: "[agent_in_question.GetFirstNameNoTooltip] je odhalen[Select_CString(agent_in_question.IsFemale, 'a', '')]"
 intrigue_scheme_ongoing.1004.b: "Když nedokáže udržet tajemství, bude muset alespoň držet jazyk za zuby!"
 intrigue_scheme_ongoing.1004.toast.success: "[agent_in_question.GetFirstNameNoTooltip] zůstane neodhalen[Select_CString(agent_in_question.IsFemale, 'a', '')]"
 intrigue_scheme_ongoing.1004.toast.failure: "[agent_in_question.GetFirstNameNoTooltip] je odhalen[Select_CString(agent_in_question.IsFemale, 'a', '')]"
 intrigue_scheme_ongoing.1006.t: "Zametání stop"
 intrigue_scheme_ongoing.1006.desc: "Samozřejmě že právě [agent_in_question.GetTitledFirstName] mi musel[Select_CString(agent_in_question.IsFemale, 'a', '')] přidělat problémy.\n\nPři pohybu po dvoře, kde vládne [scheme.GetTargetCharacter.GetTitledFirstName], nedodržuje potřebnou opatrnost a [scheme.GetTargetCharacter.GetTitleAsNameNoTooltip] si toho začíná všímat. Je jen otázkou času, než bude [agent_in_question.GetTitledFirstName] odhalen[Select_CString(agent_in_question.IsFemale, 'a', '')]!"
 intrigue_scheme_ongoing.1006.elope.desc: "Samozřejmě že právě [agent_in_question.GetTitledFirstName] mi musel[Select_CString(agent_in_question.IsFemale, 'a', '')] přidělat problémy.\n\nPři pohybu po dvoře, kde pobývá [scheme.GetTargetCharacter.GetTitledFirstName], nedodržuje potřebnou opatrnost a [scheme.GetTargetCharacter.GetLiege.Custom2('HerHisCharacterIntroduction', scheme.GetTargetCharacter)] si toho začíná všímat. Je jen otázkou času, než bude [agent_in_question.GetFirstNameNoTooltip] odhalen[Select_CString(agent_in_question.IsFemale, 'a', '')]!"
 intrigue_scheme_ongoing.1006.a.success: "[agent_in_question.GetFirstNameNoTooltip] zůstane neodhalen[Select_CString(agent_in_question.IsFemale, 'a', '')]"
 intrigue_scheme_ongoing.1006.a.failure: "[agent_in_question.GetFirstNameNoTooltip] je odhalen[Select_CString(agent_in_question.IsFemale, 'a', '')]"
 intrigue_scheme_ongoing.1006.a: "Stopy po někom, kdo se tu potají plíží, [scheme.GetTargetCharacter.GetFirstNameNoTooltip] určitě znervózní!"
 intrigue_scheme_ongoing.1006.b: "[agent_in_question.GetTitledFirstName|U] si musí dát načas a počínat si lépe."
 intrigue_scheme_ongoing.1007.t: "Vyjádřené obavy"
 intrigue_scheme_ongoing.1007.desc: "„Co když tě [target.GetTitledFirstName] odhalí? Je moudré dál věnovat tolik času tomuto úsilí?“\n\n[caring_agent.GetTitledFirstName] [caring_agent.Custom('QuirkPresentPosOrNeg')]. Přestože vím, že mě v tom bude následovat, poznám, že starost o mě je upřímná."
 intrigue_scheme_ongoing.1007.a: "Mé plány budou pokračovat a od tebe očekávám tvrdou práci!"
 intrigue_scheme_ongoing.1007.b: "Máš pravdu, zabralo mi to spoustu času. Pojď, posaď se ke mně."
 intrigue_scheme_ongoing.1008.t: "V patách"
 intrigue_scheme_ongoing.1008.desc: "Zdá se, že [defender.GetTitledFirstName] zpřísňuje bezpečnost u dvora a snaží se vypátrat zrádné intrikány. Můj spolčenec [agent.GetTitledFirstName] se obává, že na sebe možná přitáhl[Select_CString(agent.IsFemale, 'a', '')] nežádoucí pozornost."
 intrigue_scheme_ongoing.1008.a: "Schopnostem [agent.GetFirstNameNoTooltip] důvěřuji."
 intrigue_scheme_ongoing.1008.a.success: "[agent.GetFirstNameNoTooltip] zůstane neodhalen[Select_CString(agent.IsFemale, 'a', '')]"
 intrigue_scheme_ongoing.1008.a.failure: "[agent.GetFirstNameNoTooltip] je odhalen[Select_CString(agent.IsFemale, 'a', '')]"
 intrigue_scheme_ongoing.1008.b: "Stopa vedoucí od [Select_CString(agent.IsFemale, 'ní', 'něj')] ke mně musí skončit. Hned."
 intrigue_scheme_ongoing.1008.c: "Ještě že je tu [councillor.GetTitledFirstNameNoTooltip] a může zasáhnout. [ROOT.Char.GetFaith.HighGodNameAlternate] při nás stojí."
 intrigue_scheme_ongoing.1009.t: "Pomoc"
 intrigue_scheme_ongoing.1009.desc: "[potential_agent.GetTitledFirstName] za mnou přichází s odhodláním v očích.\n\n„[potential_agent.Custom2('RelationToMe', ROOT.Char)|U], zdráhal[Select_CString(potential_agent.IsFemale, 'a', '')] jsem se přidat k tvým plánům proti [target.GetTitledFirstName], [potential_agent.Custom2('RelationToMe', SCOPE.sC('target'))], ale myslím, že nastal čas v této věci důvěřovat tvému úsudku.“"
 intrigue_scheme_ongoing.1009.elope.desc: "[potential_agent.GetTitledFirstName] za mnou přichází s odhodláním v očích.\n\n„[potential_agent.Custom2('RelationToMe', ROOT.Char)|U], zdráhal[Select_CString(potential_agent.IsFemale, 'a', '')] jsem se přidat k tvému plánu uprchnout s [target.GetTitledFirstName], ale teď vidím, že ti na [Select_CString(target.IsFemale, 'ní', 'něm')] opravdu záleží.“"
 intrigue_scheme_ongoing.1009.a: "Podpoř prosím mou věc, [potential_agent.GetFirstNameNoTooltip]."
 intrigue_scheme_ongoing.1009.b: "Požádám tě jen o jednu malou laskavost..."
 intrigue_scheme_ongoing.2001.t: "Špatně vložená důvěra"
 intrigue_scheme_ongoing.2001.desc: "Důvěřivá povaha [scheme.GetTargetCharacter.GetFirstNameNoTooltip] umožnila [agent_in_question.GetTitledFirstName] vetřít se do přízně mnohem snáze, než jsem čekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Když teď [agent_in_question.GetFirstNameNoTooltip] nabízí rady, [scheme.GetTargetCharacter.GetTitledFirstName] [Select_CString(agent_in_question.IsFemale, 'jí', 'mu')] obvykle naslouchá."
 intrigue_scheme_ongoing.2001.a: "Ať dál rozdává dobré rady, dokud..."
 intrigue_scheme_ongoing.2001.b: "Může zajistit, aby ostatní spolčenci mohli volně přicházet a odcházet."
 intrigue_scheme_ongoing.2002.t: "Opilá kořist"
 intrigue_scheme_ongoing.2002.desc: "[target.GetTitledFirstName] až příliš holduje alkoholu, a pod jeho vlivem se občas chová nerozumně.\n\nPro [agent_in_question.GetTitledFirstName] by nebylo těžké tuto slabost podporovat a postarat se, aby se těchto návyků [target.GetTitledFirstName] jen tak nezbavil[Select_CString(target.IsFemale, 'a', '')]."
 intrigue_scheme_ongoing.2002.a: "Pomohu [agent_in_question.GetFirstNameNoTooltip] obstarat ten nejsilnější mok!"
 intrigue_scheme_ongoing.2002.b: "Ať má [target.GetTitledFirstName] pocit, že se může bez obav oddávat opilství."
 intrigue_scheme_ongoing.2002.c: "Ha! [target.GetTitledFirstName] vůbec netuší, jakou má slabinu!"
 intrigue_scheme_ongoing.2003.t: "Šťastná náhoda při špehování"
 intrigue_scheme_ongoing.2003.bad_habits: "Při odposlouchávání tajných rozhovorů doufal[Select_CString(agent.IsFemale, 'a', '')] [agent.GetTitledFirstName] v jiný objev, ale pravda o tom, jaké neobvyklé návyky má [other_secret_target.GetTitledFirstName], se může hodit..."
 intrigue_scheme_ongoing.2003.secret_relationships: "Při odposlouchávání tajných rozhovorů čekal[Select_CString(agent.IsFemale, 'a', '')] [agent.GetTitledFirstName] jiný objev, ale zjištění, jaké nedovolené vztahy udržuje [other_secret_target.GetTitledFirstName], se může hodit..."
 intrigue_scheme_ongoing.2003.bastardy: "Při odposlouchávání tajných rozhovorů čekal[Select_CString(agent.IsFemale, 'a', '')] [agent.GetTitledFirstName] jiný objev, ale pravda o tom, odkud [secret_target.GetTitledFirstName] skutečně pochází, se může hodit..."
 intrigue_scheme_ongoing.2003.murder: "Při odposlouchávání tajných rozhovorů čekal[Select_CString(agent.IsFemale, 'a', '')] [agent.GetTitledFirstName] jiný objev, ale zjištění, jakých strašných zločinů se [other_secret_target.GetTitledFirstName] dopustil[Select_CString(other_secret_target.IsFemale, 'a', '')], se může hodit..."
 intrigue_scheme_ongoing.2003.desc: "Při odposlouchávání tajných rozhovorů doufal[Select_CString(agent.IsFemale, 'a', '')] [agent.GetTitledFirstName] v jiný objev, ale zjištění, co [other_secret_target.GetTitledFirstName] skrývá, se může hodit..."
 intrigue_scheme_ongoing.2003.a: "Možná by to mohlo pomoci mým plánům?"
 intrigue_scheme_ongoing.3001.t: "Spravedlnost a tajnosti"
 intrigue_scheme_ongoing.3001.desc: "Jak se to poslední dobou chovám... Všechna ta tajemství a pikle spřádané ve stínech. Tohle nemůže být správné. Tohle nemůže být spravedlivé."
 intrigue_scheme_ongoing.3001.a: "Dělám, co musím!"
 intrigue_scheme_ongoing.3001.b: "Když už se to musí udělat, mělo by se to udělat správně."
 intrigue_scheme_ongoing.3002.t: "Břímě lží"
 intrigue_scheme_ongoing.3002.desc: "Všechny ty tajné plány a temné úklady... Kdykoli na ně pomyslím, jako by mi srdce sevřela ledová ruka. Je to tak špatné."
 intrigue_scheme_ongoing.3002.a: "Je to nutné!"
 intrigue_scheme_ongoing.3002.b: "Trávím přemýšlením o tom až příliš mnoho času."
 intrigue_scheme_ongoing.3002.c: "Co jsem to jen provedl[Select_CString(ROOT.Char.IsFemale, 'a', '')]? [ROOT.Char.GetFaith.HighGodName] mi snad odpustí."
 intrigue_scheme_ongoing.3002.d: "Musím své úmysly přiznat."
 intrigue_scheme_ongoing.3003.t: "Na cestě"
 intrigue_scheme_ongoing.start.3003.desc: "Až přijde čas, mí spolčenci budou potřebovat"
 intrigue_scheme_ongoing.escape_route.3003.desc: "bezpečnou únikovou trasu od sídla, kde pobývá [defender.GetTitledFirstName]. [defender.Custom('ResidenceBuilding')] musí být možné rychle opustit, kdyby se něco pokazilo."
 intrigue_scheme_ongoing.leave_with_target.3003.desc: "bezpečnou trasu, po níž dostanou [target.GetTitledFirstName] pryč od sídla, kde pobývá [defender.GetTitledFirstName]. Výchozím bodem bude [defender.Custom('ResidenceBuilding')]."
 intrigue_scheme_ongoing.end.3003.desc: "Podrobná mapa zdejší krajiny se všemi skrytými stezkami a jeskyněmi by byla neocenitelná. Zmapovat je třeba oblast [scheme_location.Custom('TerrainTypeProvince')]."
 intrigue_scheme_ongoing.3003.a: "Zaplať lovci z [scheme_location.GetNameNoTooltip], aby nakreslil mapu."
 intrigue_scheme_ongoing.3003.a.success: "Lovec [hunter.GetShortUIName] je diskrétní"
 intrigue_scheme_ongoing.3003.a.failure: "Lovec [hunter.GetShortUIName] se chlubí nově nabytým bohatstvím"
 intrigue_scheme_ongoing.3003.d: "Ať pomůže tvůj přítel [hunter.GetTitledFirstNameNoTooltip]."
 intrigue_scheme_ongoing.3003.b: "Osobně prozkoumej zdejší krajinu ([scheme_location.Custom('TerrainTypeProvince')])."
 intrigue_scheme_ongoing.3003.b.success: "Zmapuješ okolí [scheme_location.GetNameNoTooltip]"
 intrigue_scheme_ongoing.3003.b.soft_failure: "Při průzkumu zdejší krajiny ([scheme_location.Custom('TerrainTypeProvince')]) se ztratíš"
 intrigue_scheme_ongoing.3003.b.hard_failure: "Při průzkumu zdejší krajiny ([scheme_location.Custom('TerrainTypeProvince')]) se ztratíš a strávíš venku celou noc"
 intrigue_scheme_ongoing.3003.c: "Vzdej se toho nápadu."
 intrigue_scheme_ongoing.3003.e: "Ať pomůže tvůj $master_of_hunt_court_position$ [hunter.GetTitledFirstNameNoTooltip]."
 intrigue_scheme_ongoing.3004.t: "Mapa"
 intrigue_scheme_ongoing.3004.desc: "Mí špehové mě informovali o lovci, který tropí povyk v místní krčmě. [hunter.GetTitledFirstName] utrácí velké sumy a hlasitě se chlubí výhodným obchodem s „[Select_CString(owner.IsFemale, 'nějakou vyparáděnou', 'nějakým vyparáděným')] [owner.GetLadyLord] v perlách a hedvábí“.\n\nPodle všeho nakreslil[Select_CString(hunter.IsFemale, 'a', '')] pro neznám[Select_CString(owner.IsFemale, 'ou šlechtičnu', 'ého šlechtice')] mapu zdejšího okolí a zaznamenal[Select_CString(hunter.IsFemale, 'a', '')] na ní i terén [defender.Custom('TerrainType')]. Špehové se domnívají, že [owner.GetLadyLord] proti mně nebo některému z mých poddaných něco chystá."
 intrigue_scheme_ongoing.3004.a: "Děkuji, že jste mě na to upozornili."
 intrigue_scheme_ongoing.3004.b: "[hunter.GetTitledFirstName] patří do mého žaláře!"
 intrigue_scheme_ongoing.3004.c: "Přiveďte [hunter.GetTitledFirstName] ke mně. Myslím, že [Select_CString(hunter.IsFemale, 'jí', 'mu')] dokážu osvěžit paměť..."
 intrigue_scheme_ongoing.3004.c.tt: "Je odhalena [Concept('scheme','intrika')|E], která je [Concept('scheme_hostile','nepřátelská')|E] nebo jinak škodlivá"
 intrigue_scheme_ongoing.3004.toast: "Intrika odhalena"
 intrigue_scheme_ongoing.3005.t: "Okřídlený posel"
 intrigue_scheme_ongoing.3005.desc: "Jak se má intrika blíží uskutečnění, rychlé dorozumívání nabývá na důležitosti. Mám obzvlášť chytrého holuba, kterého by [pigeon_recipient.GetTitledFirstName] mohl[Select_CString(pigeon_recipient.IsFemale, 'a', '')] v případě potřeby použít k odeslání naléhavé zprávy ke mně sem do [root_location.GetNameNoTooltip].\n\nJak ale ptáka dostat dovnitř? V [target_location.GetNameNoTooltip] se nachází [defender.Custom('ResidenceBuilding')], kam ho musím nějak propašovat."
 intrigue_scheme_ongoing.3005.c.f: "Tato možnost je dostupná, protože tvůj spolčenec [elope_agent.GetShortUIName] je [Concept('friend', Select_CString(elope_agent.IsFemale, 'přítelkyní', 'přítelem'))|E], [Concept('close_family_member', Select_CString(elope_agent.IsFemale, 'členkou blízké rodiny', 'členem blízké rodiny'))|E] nebo [pigeon_recipient.GetShortUIName] využívá [Select_CString(elope_agent.IsFemale, 'jejích', 'jeho')] služeb"
 intrigue_scheme_ongoing.3005.a: "Místní cvičitel ptáků by ho mohl doručit jako „dar“."
 intrigue_scheme_ongoing.3005.a.success: "[pigeon_recipient.GetShortUIName|U] „dar“ obdrží"
 intrigue_scheme_ongoing.3005.a.failure: "[defender.GetShortUIName|U] cvičitele ptáků odmítne"
 intrigue_scheme_ongoing.3005.b: "Když „dar“ pošlu osobně, [defender.GetTitledFirstNameNoTooltip] ho přece nemůže odmítnout."
 intrigue_scheme_ongoing.3005.c: "Ať ptáka doručí [elope_agent.GetTitledFirstNameNoTooltip]."
 intrigue_scheme_ongoing.3005.d: "Je to příliš riskantní."
 intrigue_scheme_ongoing.4001.t: "Dohled dospělého"
 intrigue_scheme_ongoing.4001.desc: "[agent_in_question.GetTitledFirstName] mi sdělil[Select_CString(agent_in_question.IsFemale, 'a', '')], že byl[Select_CString(agent_in_question.IsFemale, 'a', '')] pověřen[Select_CString(agent_in_question.IsFemale, 'a', '')] dohledem nad skupinou dětí, které si hrají u dvora.\nShodou okolností mezi ně patří i [scheme.GetTargetCharacter.GetTitledFirstName].\n\nTo je skvělá příležitost, aby [agent_in_question.GetTitledFirstName] posunul[Select_CString(agent_in_question.IsFemale, 'a', '')] mé plány kupředu."
 intrigue_scheme_ongoing.4001.a: "Nauč je hrát si daleko od bdělých očí."
 intrigue_scheme_ongoing.4001.b: "Postarej se, aby ti [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] začal[Select_CString(scheme.GetTargetCharacter.IsFemale, 'a', '')] důvěřovat."
 intrigue_scheme_ongoing.4002.t: "Dětská naivita"
 intrigue_scheme_ongoing.4002.desc: "Navzdory všem intrikám, které se u dvora kolem [target.GetTitledFirstName] odehrávají, si vůbec nedokáže představit, že by někdo mohl kout nečestné plány.\n\nKdyž spolu mluvíme, zdá se, že mi [scheme.GetTargetCharacter.GetTitledFirstName] skutečně důvěřuje!"
 intrigue_scheme_ongoing.4002.a: "Příležitost dostat se blíž k jednomu z rodičů: [target.Custom2('RelationToMe', SCOPE.sC('parent'))]!"
 intrigue_scheme_ongoing.4002.b: "Tajná skrýš? Ukážeš mi ji?"
 intrigue_scheme_ongoing.4003.t: "Když se tak zamyslím"
 intrigue_scheme_ongoing.4003.desc: "[agent_in_question.GetTitledFirstName] za mnou přichází s obavami kvůli intrice, do níž jsem [Select_CString(agent_in_question.IsFemale, 'ji', 'ho')] zapojil[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Sice jsem nařídil[Select_CString(ROOT.Char.IsFemale, 'a', '')], aby si získal[Select_CString(agent_in_question.IsFemale, 'a', '')] důvěru dítěte, kterým je [scheme.GetTargetCharacter.GetTitledFirstName], ale nikdy jsem nechtěl[Select_CString(ROOT.Char.IsFemale, 'a', '')], aby si k sobě vytvořili citové pouto!\n\nTeď si kladu otázku, nakolik se dá [agent_in_question.GetTitledFirstName] ještě věřit..."
 intrigue_scheme_ongoing.4003.a: "„Nenuť mě připomínat ti, proč mi vlastně pomáháš!“"
 intrigue_scheme_ongoing.4003.b: "Potají omezím [Select_CString(agent_in_question.IsFemale, 'její', 'jeho')] zapojení do mé intriky."
 intrigue_scheme_ongoing.5001.t: "Svědivé rozptýlení"
 intrigue_scheme_ongoing.5001.desc: "Přede mnou stojí [servant.GetWomanMan], kter[Select_CString(servant.IsFemale, 'á', 'ý')] má na starosti čištění oděvů stráží [target.GetTitledFirstName]. Nikdo si nevšimne, když se pustí do jejich šatů, a kdyby se do nich podařilo vložit něco, co stráže pořádně rozptýlí...\n\n„Co ode mě žádáte, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 intrigue_scheme_ongoing.5001.a: "Rozemel šípky úplně najemno..."
 intrigue_scheme_ongoing.5001.b: "Vystříhej jim do šatů díry. Na nevhodných místech."
 intrigue_scheme_ongoing.5002.t: "Psáno ve hvězdách"
 intrigue_scheme_ongoing.5002.desc: "Cíl je jasný: [target.GetTitleAsNameNoTooltip]. K tomu místní [Select_CString(local_mystic.IsFemale, 'věštkyně', 'věštec')] [local_mystic.GetName] pochybných mravů a smyšlené znamení... Dokonalé.\n\nNež se [Select_CString(local_mystic.IsFemale, 'věštkyně', 'věštec')] vydá ke dvoru, kde pobývá [target.GetTitledFirstName], zbývá jediná otázka - bude mé falešné znamení slibovat štěstí, nebo zkázu?"
 intrigue_scheme_ongoing.5002.a: "[target.GetTitleAsNameNoTooltip|U] si zaslouží špatné znamení!"
 intrigue_scheme_ongoing.5002.a.tt: "Věřím, že [target.GetFirstNameNoTooltip] snáze podlehne špatným zprávám"
 intrigue_scheme_ongoing.5002.a.success: "[target.GetTitledFirstName|U] kvůli obavám probdí mnoho nocí"
 intrigue_scheme_ongoing.5002.a.failure: "[target.GetTitledFirstName|U] jen ještě zvýší svou ostražitost"
 intrigue_scheme_ongoing.5002.b: "Dobré znamení - [target.GetTitledFirstName] pak snáze propadne falešnému pocitu bezpečí."
 intrigue_scheme_ongoing.5002.b.tt: "Věřím, že [target.GetFirstNameNoTooltip] spíše uvěří dobrým zprávám"
 intrigue_scheme_ongoing.5002.b.success: "[target.GetTitledFirstName|U] poleví v ostražitosti"
 intrigue_scheme_ongoing.5002.b.failure: "[target.GetTitledFirstName|U] začne být obezřetnější"
 intrigue_scheme_ongoing.5003.t: "Znamení"
 intrigue_scheme_ongoing.5003.desc_opening: "Místní [Select_CString(local_mystic.IsFemale, 'věštkyně', 'věštec')] [local_mystic.GetName] trval[Select_CString(local_mystic.IsFemale, 'a', '')] na tom, že mě musí vidět. Jakmile se ocitl[Select_CString(local_mystic.IsFemale, 'a', '')] přede mnou, začal[Select_CString(local_mystic.IsFemale, 'a', '')] naříkat a... je to na [Select_CString(local_mystic.IsFemale, 'jejích', 'jeho')] rukou krev?\n\n"
 intrigue_scheme_ongoing.5003.desc: "„Znamení! Znamení vám nejsou nakloněna, [Select_CString(target.IsFemale, 'má paní', 'můj pane')]. Rozpáral[Select_CString(local_mystic.IsFemale, 'a', '')] jsem slepici a z její krve vyčetl[Select_CString(local_mystic.IsFemale, 'a', '')] vaši budoucnost - je temná a plná smrti!“"
 intrigue_scheme_ongoing.5003.a: "To je... zlověstné!"
 intrigue_scheme_ongoing.5004.desc: "„Znamení! Znamení vám jsou nakloněna, [Select_CString(target.IsFemale, 'má paní', 'můj pane')]. Rozpáral[Select_CString(local_mystic.IsFemale, 'a', '')] jsem slepici a z její krve vyčetl[Select_CString(local_mystic.IsFemale, 'a', '')] vaši budoucnost - bude slavná!“"
 intrigue_scheme_ongoing.5004.a: "No... děkuji?"
 intrigue_scheme_ongoing.5005.t: "Není všechno zlato, co se třpytí"
 intrigue_scheme_ongoing.5005.desc: "[spymaster.GetCouncilTitle] [spymaster.GetTitledFirstName] ke mně přichází se zlověstným úšklebkem.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], v tomto váčku je obzvlášť zákeřný prášek. Stačí jím něco posypat - třeba dárek pro [target.GetTitledFirstName] - a nezanechá žádné stopy, ale každého, kdo se toho dotkne, postihne slabost a rozvrat tělesných šťáv.“"
 intrigue_scheme_ongoing.5005.a: "No vida... [target.GetTitledFirstName] si dárek jistě zaslouží."
 intrigue_scheme_ongoing.5005.b: "Ode mě [target.GetTitledFirstName] žádné zlato nedostane!"
 intrigue_scheme_ongoing.5006.t: "Dar"
 intrigue_scheme_ongoing.5006.desc: "[owner.GetTitledFirstName] mi poslal[Select_CString(owner.IsFemale, 'a', '')] dar, bohatě zdobenou skříňku plnou zlata. Když nechám mince proklouzávat mezi prsty, náhle se se mnou začne točit celý pokoj a dech se mi krátí."
 intrigue_scheme_ongoing.5006.a: "Jak nečekané! A ten podivný účinek..."
 intrigue_scheme_ongoing.5007.t: "Otrávené zlato"
 intrigue_scheme_ongoing.5007.desc_opening: "[poisoned.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('poisoned'))], ke mně přichází s bledou tváří a potem perlícím se na čele.\n\n"
 intrigue_scheme_ongoing.5007.desc: "„[Select_CString(ROOT.Char.IsFemale, 'Matko', 'Otče')], něco není v pořádku. Od chvíle, kdy jsem ti pomáhal[Select_CString(poisoned.IsFemale, 'a', '')] balit ten dárek pro [target.GetTitledFirstName], jsou mé tělesné šťávy v naprosté nerovnováze...“"
 intrigue_scheme_ongoing.5007.a: "Co by to mohlo... To otrávené zlato!"
 intrigue_scheme_ongoing.5007.a.tt: "Kéž božská moc ochrání [poisoned.GetTitledFirstName]!"
 intrigue_scheme_ongoing.5008.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], od chvíle, kdy jsem vám pomáhal[Select_CString(poisoned.IsFemale, 'a', '')] balit ten dárek pro [target.GetTitledFirstName], jsou mé tělesné šťávy v naprosté nerovnováze... Obávám se, že nákaza ze zlata postihla i mě.“"
 intrigue_scheme_ongoing.5008.a: "K čertu."
 intrigue_scheme_ongoing.5009.t: "Tunel"
 intrigue_scheme_ongoing.5009.desc: "Donesly se ke mně zprávy o nezvykle velkém množství krys poblíž místa, kde pobývá [target.GetTitledFirstName]. Protože si se zvířaty rozumím, vydávám se to prozkoumat.\n\nJakmile dorazím, krysy se ke mně seběhnou, jako by mě vítaly, a odvedou mě k temnému tunelu, který leží kus od [target.Custom('ResidenceBuilding')]."
 intrigue_scheme_ongoing.5009.a: "Ukažte mi cestu, přátelé!"
 intrigue_scheme_ongoing.5009.a.tt: "Kam mě asi tihle #EMP hlodavci#! vedou?"
 intrigue_scheme_ongoing.5009.b: "Fuj. Tam tedy nelezu."
 intrigue_scheme_ongoing.5010.desc: "Je tu tma a dusný vzduch prosycený zápachem odpadků naplňuje cupitání drobných tlapek.\n\nNáhle ke mně zavane čerstvý vzduch a před sebou spatřím světlo pronikající skrz mříž. Krysy mě dovedly tunelem přímo do místa, kde pobývá [target.GetTitledFirstName]!"
 intrigue_scheme_ongoing.5010.a: "Děkuji vám, přátelé!"
 intrigue_scheme_ongoing.5010.b: "*Kašel* Děkuji vám, přátelé! Ale ten smrad...!"
 intrigue_scheme_ongoing.5011.t: "Jedovatý tvor"
 intrigue_scheme_ongoing.5011.desc: "U stánku obchodníka mě vítá pestrá sbírka jedovatých tvorů a náhle dostanu nápad. Nebyl by jeden z těchto nádherných tvorečků dokonalým dárkem pro [target.GetTitledFirstName]?"
 intrigue_scheme_ongoing.5011.a: "Jednoho z vašich nejsmrtonosněj- totiž nejzajímavějších, prosím."
 intrigue_scheme_ongoing.5011.a.tt: "[target.GetTitledFirstName|U] nic nepozná, dokud nebude pozdě!"
 intrigue_scheme_ongoing.5011.b: "Dejte mi toho tvora ([SCOPE.Custom('VenomousCreature')]) ke studiu."
 intrigue_scheme_ongoing.5012.desc: "Obchodník bez jediného dotazu vložil tvora ([SCOPE.Custom('VenomousCreature')]) do pleteného košíku. Cestou domů nadzvednu víko, ale k mému překvapení je košík prázdný..."
 intrigue_scheme_ongoing.5012.a: "Kam se poděl...? Kde- ÁÁÁ!"
 intrigue_scheme_ongoing.5013.desc: "\n\n„Mami, podívej! [Select_CString(ROOT.Char.IsFemale, 'Ta žena', 'Ten muž')] má na hlavě nějakého tvora!“ Za zády se mi ozve nadšený hlas, a když se otočím, zjistím, že se kolem mě shromáždil dav."
 intrigue_scheme_ongoing.5013.a: "...TADÁ! A teď to ze mě sundejte. Sundejte to #EMP ze mě#!!"
 intrigue_scheme_ongoing.5013.a.tt: "O tvora jsem přišel[Select_CString(ROOT.Char.IsFemale, 'a', '')], ale alespoň ne o život..."
 intrigue_scheme_ongoing.5014.t: "Hebký exotický koberec"
 intrigue_scheme_ongoing.5014.t_persian: "$persian_has_plush_carpet_modifier$"
 intrigue_scheme_ongoing.5014.desc: "Hebký, zářivý a měkký jako první světlo úsvitu - obchodník mi nabízí nádherný koberec v naději na dobré vztahy do budoucna.\n\nKdyž obdivuji jeho jemné tkaní, napadne mě jedna věc. Neztlumil by takový koberec zvuk kroků? Možná by dokázal skrýt i dupání nějakého nešikovného spolčence..."
 intrigue_scheme_ongoing.5014.a: "[target.GetTitledFirstNameNoTooltip] bude takovým darem jistě poctěn[Select_CString(target.IsFemale, 'a', '')]."
 intrigue_scheme_ongoing.5014.a.success: "[target.GetTitledFirstName|U] dar přijme"
 intrigue_scheme_ongoing.5014.a.failure: "[target.GetTitledFirstName|U] pojme podezření"
 intrigue_scheme_ongoing.5014.b: "Ale v mých komnatách by vypadal #EMP skvěle#!..."
 intrigue_scheme_ongoing.5015.desc: "Jako dar od [owner.GetTitledFirstName] mi dorazí nádherný, zářivý a hebký koberec.\n\nNevím, proč mi [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'poslala', 'poslal')] tak skvostný dar, ale jeho jemné tkaní je na dotek stejně příjemné jako kůže milence."
 intrigue_scheme_ongoing.5015.a: "Tenhle koberec bude zdobit podlahu mých komnat!"
 intrigue_scheme_ongoing.5015.b: "Asi bych se ho [Select_CString(ROOT.Char.IsFemale, 'měla', 'měl')] raději zbavit..."
 intrigue_scheme_ongoing.5016.t: "Síla slov"
 intrigue_scheme_ongoing.5016.desc: "Přede mnou stojí [servant.GetTitledFirstName], [Select_CString(servant.IsFemale, 'služebnice', 'služebník')] [target.GetTitledFirstName].\n\n„Teď pro mě něco uděláš... A samozřejmě za to dostaneš patřičně zaplaceno.“"
 intrigue_scheme_ongoing.5016.a: "Pár slov šeptaných do správných uší může svrhnout i [target.GetTitleAsNameNoTooltip]!"
 intrigue_scheme_ongoing_5016_every_courtier: "Každý dvořan a host, který není spolčencem"
 intrigue_scheme_ongoing.5016.b: "Postarej se, abych [Select_CString(ROOT.Char.IsFemale, 'měla', 'měl')] do [target.Custom('ResidenceBuilding')] vždy volný přístup."
 intrigue_scheme_ongoing.5016.c_man: "Nic z toho nebude. Vrať se ke svému pánovi."
 intrigue_scheme_ongoing.5016.c_woman: "Nic z toho nebude. Vrať se ke své paní."
 intrigue_scheme_ongoing.5017.t: "Přílišná důvěřivost"
 intrigue_scheme_ongoing.5017.desc: "Jen stěží skrývám radost, když na mě čeká [spouse.GetTitledFirstName], [target.Custom2('RelationToMe', SCOPE.sC('spouse'))] [target.GetTitledFirstName], spolu s malým doprovodem. Kdybych tak dokázal[Select_CString(ROOT.Char.IsFemale, 'a', '')] přesvědčit #EMP [spouse.GetTitledFirstNameNoTooltip]#!, aby mi s intrikou pomohl[Select_CString(spouse.IsFemale, 'a', '')]...\n\n„[Select_CString(ROOT.Char.IsFemale, 'Vzkázala', 'Vzkázal')] jste, že se mnou chcete mluvit, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 intrigue_scheme_ongoing.5017.a: "[Select_CString(target.IsFemale, 'Tvá', 'Tvůj')] [spouse.Custom2('RelationToMe', SCOPE.sC('target'))] o tobě říká, že jsi [spouse.Custom2('InsultAdjectiveArticle', ROOT.Char)] [spouse.Custom2('InsultNoun', ROOT.Char)]."
 intrigue_scheme_ongoing.5017.a.success: "[spouse.GetTitledFirstNameNoTooltip] mi uvěří"
 intrigue_scheme_ongoing.5017.a.failure: "[target.GetTitledFirstName] přesvědčí [spouse.GetTitledFirstNameNoTooltip], že lžu"
 intrigue_scheme_ongoing.5017.b: "Pověz mi prosím něco o [target.Custom('ResidenceBuilding')]!"
 intrigue_scheme_ongoing.5018.t: "Táborový doprovod"
 intrigue_scheme_ongoing.5018.desc: "[target.GetTitledFirstName] je ve válce.\n\nPrávě táboří v [location.GetName] a mé zdroje tvrdí, že se k táboru brzy přidají další lidé - dokonalá příležitost dostat mezi ně několik mých vlastních!"
 intrigue_scheme_ongoing.5018.a: "V davu zůstanou bez povšimnutí a budou mi podávat zprávy."
 intrigue_scheme_ongoing.5018.b: "Mouka, obilí, maso... Spalte to."
 intrigue_scheme_ongoing.5018.msg.t: "Zásoby shořely při nehodě"
 intrigue_scheme_ongoing.5019.t: "Tajný tunel"
 intrigue_scheme_ongoing.5019.desc: "[Select_CString(agent.IsFemale, 'Má spolčenkyně', 'Můj spolčenec')] [agent.GetTitledFirstName] ke mně přichází se svazkem pergamenů v rukou.\n\n„[Select_CString(agent.IsFemale, 'Našla', 'Našel')] jsem staré stavební plány sídla, kde pobývá [target.GetTitledFirstName]! Možná už nejsou úplně aktuální, ale podívej sem...“"
 intrigue_scheme_ongoing.5019.a: "To vypadá jako tunel, který bychom mohli využít!"
 intrigue_scheme_ongoing.5019.b: "Kéž bych [Select_CString(ROOT.Char.IsFemale, 'měla', 'měl')] tolik tajných prostor i já... Zavolejte mé architekty."
 intrigue_scheme_ongoing.5019.b.tt: "Na stavební práce dohlédne [architect.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('architect'))]"
 intrigue_scheme_ongoing.5021.t: "Nebezpečné zaujetí"
 intrigue_scheme_ongoing.5021.desc: "Vydám se za [owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))], do [Select_CString(owner.IsFemale, 'jejích', 'jeho')] komnat, ale [owner.Custom('GetChamber')] zeje prázdnotou.\n\nBez spěchu se probírám [Select_CString(owner.IsFemale, 'jejími', 'jeho')] listinami, když narazím na něco znepokojivého - nepochybně jde o plány namířené proti [target.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 intrigue_scheme_ongoing.5021.a: "Co to má znamenat, [owner.GetFirstNameNoTooltip]?!"
 intrigue_scheme_ongoing.5021.a.success: "[owner.GetTitledFirstName|U] skutečně plánuje vraždu"
 intrigue_scheme_ongoing.5021.a.success.tt: "Intrika je odhalena"
 intrigue_scheme_ongoing.5021.a.failure: "[owner.GetTitledFirstName|U] se cítí [Select_CString(owner.IsFemale, 'uražená', 'uražený')]"
 intrigue_scheme_ongoing.5021.b: "#EMP Nic#! jsem [Select_CString(ROOT.Char.IsFemale, 'neviděla', 'neviděl')]."
 intrigue_scheme_ongoing.5022.t: "Obvinění"
 intrigue_scheme_ongoing.5022.desc: "„Ty plánuješ někoho zabít?!“\n\n[family_member.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('family_member'))], mě konfrontuje s hrůzou ve tváři. V ruce svírá listiny s poznámkami o mém plánu zabít [target.GetTitledFirstName] - listiny, které jsem podle všeho nechal[Select_CString(ROOT.Char.IsFemale, 'a', '')] ve své soukromé pracovně."
 intrigue_scheme_ongoing.5022.a: "Já bych #EMP nikdy#!!"
 intrigue_scheme_ongoing.5022.a.success: "[family_member.GetTitledFirstName|U] ti uvěří"
 intrigue_scheme_ongoing.5022.a.failure: "[family_member.GetTitledFirstName|U] se nenechá přesvědčit"
 intrigue_scheme_ongoing.5022.b: "Je to tak nejlepší. Teď mě vyslechni..."
 intrigue_scheme_ongoing.5022.b.success: "[family_member.GetTitledFirstName|U] vyslechne tvé argumenty"
 intrigue_scheme_ongoing.5022.b.failure: "[family_member.GetTitledFirstName|U] se nenechá přesvědčit"
 intrigue_scheme_ongoing.5022.c: "Zdá se, že mé plány právě nabraly nový směr."
 intrigue_scheme_ongoing.5023.desc: "„Tohle jsi [Select_CString(ROOT.Char.IsFemale, 'neměla', 'neměl')] vidět.“\n\n[owner.GetTitledFirstName] mluví tiše, ale v hlase slyším hněv. Když sáhne k opasku, o krok ustoupím, ale než stačím cokoli udělat, vrhne se na mě s nožem v ruce."
 intrigue_scheme_ongoing.5023.a: "[owner.GetFirstNameNoTooltip], prosím- Au!"
 intrigue_scheme_ongoing.5024.t: "Oslavy v [province.GetNameNoTooltip|U]"
 intrigue_scheme_ongoing.5024.desc: "[Select_CString(agent.IsFemale, 'Má spolčenkyně', 'Můj spolčenec')] [agent.GetTitledFirstName] mi sděluje, že místní slavnost v [province.GetName], kde sídlí [target.GetTitledFirstName], se potýká s nedostatkem peněz.\n\n„Kdyby se konala, přilákala by sem spoustu lidí, urozených i prostých - dokonalá příležitost někoho mezi ně propašovat!“"
 intrigue_scheme_ongoing.5024.a: "Tady. Postarej se, aby se konala."
 intrigue_scheme_ongoing.5024.b: "Kvůli [target.GetTitledFirstName] penězi plýtvat nebudu!"
 intrigue_scheme_ongoing.5026.t: "Pomocná ruka"
 intrigue_scheme_ongoing.5026.desc: "Stejně jako všichni [target.GetFaith.GetAdherentNamePluralNoTooltip] i [target.Custom2('MyCharacterIntroduction', ROOT.Char)] cítí silné pouto k božství. [target.GetFaith.HighGodName] stojí v samotném středu této víry a [court_chaplain.GetTitledFirstName] je jejím duchovním prostředníkem.\n\nKdyby se mi jen podařilo od [court_chaplain.GetTitledFirstNameNoTooltip] zjistit něco o obavách a plánech [target.GetTitledFirstName]...!"
 intrigue_scheme_ongoing.5026.a: "„Je to pro dobro víry!“"
 intrigue_scheme_ongoing.5026.a.success: "[court_chaplain.GetTitledFirstName|U] mi pomůže"
 intrigue_scheme_ongoing.5026.a.failure: "[court_chaplain.GetTitledFirstName|U] odmítne"
 intrigue_scheme_ongoing.5026.a_gregarious: "„Pojďme se projít.“"
 intrigue_scheme_ongoing.5026.a_gregarious_tt: "[court_chaplain.GetTitledFirstName|U] si ani nevšimne, že mi vykládá #EMP úplně všechno#!"
 intrigue_scheme_ongoing.5026.b_agent: "„Už jsi přece [Select_CString(court_chaplain.IsFemale, 'souhlasila', 'souhlasil')], že mi pomůžeš, takže...“"
 intrigue_scheme_ongoing.5026.b: "„Ale [target.GetFaith.HighGodName] přece...“"
 intrigue_scheme_ongoing.5026.b_scholar: "„Podívejme se, co říká [target.GetFaith.HighGodName].“"
 intrigue_scheme_ongoing.5026.b_scholar_tt: "Jaká náhoda, že to bude přesně to, co chci já!"
 intrigue_scheme_ongoing.5026.c: "Do toho mi nic není. [target.GetFaith.PantheonTerm] se o to postará."
 intrigue_scheme_ongoing.3010.t: "[scheme.GetNameNoTooltip]: Tajemství ([target.GetCulture.GetLanguage.GetNameNoTooltip])"
 intrigue_scheme_ongoing.3010.desc: "V rámci své pokračující intriky [scheme.GetNameNoTooltip|l] [target.GetTitledFirstName] mí přisluhovači pravidelně zachycují dopisy. [target.GetCulture.GetLanguage.GetName] mi nedělá potíže, takže bych je mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] číst osobně namísto spoléhání na překlady z druhé ruky, i když by mě to připravilo o čas na jiné povinnosti.\n\nMožná bych tak získal[Select_CString(ROOT.Char.IsFemale, 'a', '')] cenné poznatky?"
 intrigue_scheme_ongoing.3010.a: "Dopisy si přeložím osobně."
 intrigue_scheme_ongoing.3010.b: "To zní jako příliš mnoho práce."
 intrigue_scheme_ongoing.3011.t: "[scheme.GetNameNoTooltip]: Šifra, v níž se mísí [language_culture.GetLanguage.GetNameNoTooltip|l], [language_culture_2.GetLanguage.GetNameNoTooltip|l] a [multilingual_agent.GetCulture.GetLanguage.GetNameNoTooltip]"
 intrigue_scheme_ongoing.3011.desc: "V intrice [scheme.GetNameNoTooltip|l] [target.GetTitledFirstName] mi pomáhá [multilingual_agent.GetName] - hotová chodící encyklopedie, pokud jde o jazyky. Díky rozsáhlé znalosti několika nářečí [Select_CString(multilingual_agent.IsFemale, 'vytvořila', 'vytvořil')] šifru, o níž tvrdí, že je „nerozluštitelná“.\n\n„Nestačil by ani mistr kryptograf. [language_culture_2.GetLanguage.GetNameNoTooltip] má své gramatické jemnosti, [language_culture.GetLanguage.GetNameNoTooltip|l] zase specifická přísloví a [multilingual_agent.GetCulture.GetLanguage.GetNameNoTooltip|l] vlastní stavbu slov. To všechno by musel znát!“"
 intrigue_scheme_ongoing.3011.a: "Výborná iniciativa."
 intrigue_scheme_ongoing.3011.b: "To mi připadá jako ztráta času."
