l_polish:
 learn_language_ongoing.1200.t: "$learn_language$: Čtyřnohý problém"
 learn_language_ongoing.1200.desc: "Při učení jazyka „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]“ si dělám spoustu poznámek, protože všechno si v hlavě zkrátka neudržím. Jenže teď, když je potřebuji, je nemůžu nikde najít! Ani po rychlém hledání nemám tušení, kam se poděly.\n\nKdyž se otočím, vidím, že [ROOT.Char.Custom('DogStoryName')] je u mých nohou. Vesele vrtí ocasem a tváří se spokojeně jako [ROOT.Char.Custom('GetAnimalType')]. Chvíli mi trvá, než si uvědomím, že všechny mé poznámky pevně svírá v zubech..."
 learn_language_ongoing.1200.a: "Na tebe se přece nedokážu zlobit!"
 learn_language_ongoing.1200.b: "Chceš se jít projít? Tak pojď."
 learn_language_ongoing.1200.c: "To není hračka! #EMP Zlobivý#! pes!"
