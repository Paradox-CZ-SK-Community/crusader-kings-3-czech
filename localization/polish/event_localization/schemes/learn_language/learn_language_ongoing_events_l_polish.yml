 own_court_language_scheme_key_no_tt: "[ROOT.GetScheme.GetOwner.GetCourtLanguage.GetNameNoTooltip]"
 liege_court_language_scheme_key_no_tt: "[ROOT.GetScheme.GetOwner.GetLiege.GetCourtLanguage.GetNameNoTooltip]"
 target_character_language_scheme_key_no_tt: "[ROOT.GetScheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]"
 learn_language_ongoing.1000.t: "$learn_language$: Výhoda mládí"
 learn_language_ongoing.1000.desc: "[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] mi jde čím dál lépe — mám pocit, že mám všechnu soustředěnost a energii světa!\n\n„Jmenuji... se... [fast_learner.GetFirstNameNoTooltip]!“\n\n„Moje... oblíbená... pochoutka... je... [fast_learner.Custom('FavoriteTreatDemand')]!“\n\nStačí se jen #EMP soustředit ještě víc#! a za chvíli budu mluvit plynně!"
 learn_language_ongoing.1000.a: "Věnuji tomu #EMP všechen#! svůj čas!"
 learn_language_ongoing.1000.b: "Svůj čas raději strávím jinak..."
 learn_language_ongoing.1010.t: "$learn_language$: Milostné nedorozumění"
 learn_language_ongoing.1010.desc: "„...a tak [ROOT.Char.Custom('education_conversation_subject')] je tématem rady, jíž předsedá [ROOT.Char.GetTitleTierName], zatímco [scheme.GetTargetCharacter.GetCouncillorPosition( 'councillor_steward' ).GetPositionName] přistupuje k...“\n\nJen co překvapeně zvednu oči od knihy psané v jazyce „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]“, zjistím, že se nade mnou sklání [lover_target.GetFirstName] se zrudlými tvářemi.\n\n„Ale ale, to je snad #EMP [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]#!?“ zazní pobaveně.\n„Víš... [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] je přece jazyk lásky — a pokud mě sluch neklame, právě od tebe zaznělo, že jsem [lover_target.Custom('RomanticComplimentAdjective')] [lover_target.Custom('RomanticComplimentNoun')]? Ty [ROOT.Char.Custom('RomanticComplimentNoun')], ty!“"
 learn_language_ongoing.1010.a: "...ano, ano, samozřejmě! To byl přesně můj záměr!"
 learn_language_ongoing.1010.b: "Ne, ne! To je celé nedorozumění!"
 learn_language_ongoing.1010.c: "Zmiz, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. Musím se soustředit!"
 outside_help_modifier: "Pomoc zvenčí"
 learn_language_ongoing.1020.c.success: "Podaří se ti [language_helper.GetFirstNameNoTooltip] přimět k pomoci"
 learn_language_ongoing.1020.c.failure: "[language_helper.GetFirstNameNoTooltip] tvou manipulaci prohlédne"
 learn_language_ongoing.1020.t_hash_collision: "$learn_language$: Pomoc zvenčí"
 learn_language_ongoing.1020.desc: "[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] je jazyk, který studuji už tak usilovně, že o tom ví i [language_helper.GetTitledFirstName]. Tento jazyk má jako mateřský a nabízí mi pomoc se studiem.\n\n„Za své úsilí nežádám víc než symbolickou odměnu. Takovou nabídku snad [ROOT.Char.GetTitleTierName] neodmítne,“ dodává [language_helper.Custom('quirk_pos_pp')]."
 learn_language_ongoing.1020.a: "Pomoz mi a to zlato bude tvoje."
 learn_language_ongoing.1020.b: "Protislužba za protislužbu?"
 learn_language_ongoing.1020.c: "Ach, jak #EMP nezištné#! od tebe, že mi pomůžeš zadarmo!"
 learn_language_ongoing.1020.d: "Děkuji, ale poradím si bez pomoci."
 learn_language_ongoing.1020.b.success: "[chosen_peasant.GetFirstName] na nabídku přistoupí"
 learn_language_ongoing.1020.b.failure: "[chosen_peasant.GetFirstName] tvoji nabídku považuje za urážku"
 gain_artifact_tt: "Získáš [Concept('artifact','artefakt')|E] [newly_created_artifact.GetName]"
 steal_artifact_tt: "Ukradneš [Concept('artifact','artefakt')|E] [newly_created_artifact.GetName]"
 learn_language_ongoing.1030.t: "$learn_language$: Ohmataná příručka"
 learn_language_ongoing.1030.desc: "[chosen_peasant.GetTitledFirstName] ke mně přichází, [chosen_peasant.Custom('quirk_pos_pp')].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], doneslo se ke mně, že se učíte nový jazyk — [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]. Můj otec býval obchodníkem a jakýkoli jazyk se naučil raz dva!“ pokračuje.\n\n„Své tajemství zapsal do této příručky. Nemám pro ni využití, protože neumím číst. Za rozumnou cenu může být vaše.“"
 learn_language_ongoing.1030.a: "Zajímavé. Zaplatím."
 learn_language_ongoing.1030.b: "Možná žádáš trochu... moc."
 learn_language_ongoing.1030.c: "To bude pěkný dar! Stráže, zabavte tu příručku."
 learn_language_ongoing.1030.d: "Nesmysl! Ven! A tyhle šarlatánské řeči si nech pro někoho jiného!"
 learn_language_ongoing.1040.t: "$learn_language$: Uznání"
 learn_language_ongoing.1040.desc: "[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] je jazyk, který se snažím naučit, a při studiu se snažím mluvit stejně jako [target.GetTitledFirstName]. V poslední době mi [target.GetFirstNameNoTooltip] dokonce začíná psát.\n\nUž mi přišlo několik dopisů, v nichž mé úsilí chválí a označuje za úctyhodné a obdivuhodné!\n\nJe příjemné, když někdo ocení mou tvrdou práci!"
 learn_language_ongoing.1040.a: "Písaři! Pošlete odpověď s mým poděkováním."
 learn_language_ongoing.1040.b: "[target.GetFirstNamePossessiveNoTooltip] rukopis je zajímavý..."
 learn_language_ongoing.1040.c: "Pche! Nepotřebuji uznání nikoho kromě #EMP sebe!#!"
 extra_success_chance_modifier: "Zvýšená šance na úspěch"
 massive_extra_success_chance_modifier: "Výrazně zvýšená šance na úspěch"
 tutorial_success_chance_modifier: "$extra_success_chance_modifier$"
 learn_language_ongoing.1050.t: "$learn_language$: Vraní pařáty"
 learn_language_ongoing.1050.desc: "Mé drahocenné poznámky k jazyku „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]“ jsou rozházené po celé pracovně a havran celý od inkoustu tu #EMP pořád#! mává křídly! Jak se sem vůbec dostal? #EMP Kdo ho polil inkoustem!?#!\n\n„Dopis,“ oznámí sluha. „[ROOT.Char.GetTitleTierName] si jej jistě bude chtít přečíst.“ Otočím se a vytrhnu zprávu z natažené ruky.\n\n„Velká škoda, co se stalo s tvými poznámkami — ale podívej se na to z té lepší stránky: tvé písmo už předtím vypadalo jako vraní pařáty! S pozdravem [sabotage_rival.GetTitledFirstName].“"
 learn_language_ongoing.1050.a: "Mé poznámky... ne! Tolik práce je pryč!"
 learn_language_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip] si zaslouží #EMP SMRT!#!"
 learn_language_ongoing.1050.c: "Ha! Vždycky mám #EMP záložní poznámky!#!"
 learn_language_ongoing.1060.t: "$learn_language$: Ztraceno v překladu"
 learn_language_ongoing.1060.desc: "„...alchymista sáhl po [target.Custom('RandomWeirdObject')], zatímco [target.Custom('lowly_servant_type')] přihlížel se strachem, a pak...“ Náhle mě přeruší rozzuřený[Select_CString(offended_character.IsFemale, 'á', '')] [offended_character.GetTitledFirstName].\n\n„To jsi právě nazval[Select_CString(ROOT.Char.IsFemale, 'a', '')] mou milovanou osobu, které říkám [offended_character.Custom('MotherFather')], [offended_character.Custom2('InsultNoun', SCOPE.sC('offended_character'))] a [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!?“ zazní rozhořčený křik. „Za tuhle těžkou urážku žádám odškodnění!“\n\nZdá se, že [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] ještě potřebuje trochu procvičit..."
 learn_language_ongoing.1060.a: "Strašně mě to mrzí! Snad tohle bude stačit."
 learn_language_ongoing.1060.b: "Ale ne, špatně jsi mě slyšel[Select_CString(offended_character.IsFemale, 'a', '')]! Řekl[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že jsi #EMP [offended_character.Custom('ComplimentAdjective')]#! a #EMP [offended_character.Custom('RomanticComplimentNoun')]!#!"
 learn_language_ongoing.1060.c: "Ha! Ano, přesně to jsem řekl[Select_CString(ROOT.Char.IsFemale, 'a', '')], a navíc jsi #EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)]!#!"
 learn_language_ongoing.1060.d: "Jen si procvičuji jazyk „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]“! Přeřekl[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem se!"
 extra_careful_modifier: "Mimořádná opatrnost"
 carefully_chosen_words_modifier: "Pečlivě volená slova"
 learn_language_ongoing.1060.b.success: "Přesvědčíš [offended_character.GetFirstNameNoTooltip], že tvá slova o [offended_character.Custom('MotherFather')] byla ve skutečnosti #EMP lichotkou#!"
 learn_language_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip] tvou lež prohlédne"
 learn_language_ongoing.1060.d.success: "Úspěšně vysvětlíš, že šlo o nedorozumění"
 learn_language_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip] ti nevěří"
 learn_language_ongoing.1070.t: "$learn_language$: Prostopášná literatura"
 learn_language_ongoing.1070.desc: "Když nahlas předčítám z knihy psané v jazyce „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]“, kterou mi před časem poslal[Select_CString(target.IsFemale, 'a', '')] [target.GetTitledFirstName], všimnu si, že se mi celý houf sluhů pochechtává...\n\n„Prosím, nepřestávejte!“ hihňají se sluhové.\n„Vždyť [ROOT.Char.GetTitleTierName] už nám málem ukázal[Select_CString(ROOT.Char.IsFemale, 'a', '')] [ROOT.Char.Custom('ObjectifiedFeature')]! Musíme přece vědět, jestli [ROOT.Char.GetTitleTierName] a [target.Custom('lowly_servant_type')] nakonec skončí spolu, nebo jestli se mezi ně zase nevmísí ta [target.Custom2('InsultNounSexual', ROOT.Char)]!“\n\nTo snad čtu... #EMP nějakou oplzlost?#! [ROOT.Char.Custom('CulturalCurse')|U]."
 learn_language_ongoing.1070.a: "Stráže, zbavte mě té proklaté knihy!"
 learn_language_ongoing.1070.b: "Vy se mi opovažujete smát!? #EMP Všechny je zbičujte.#!"
 learn_language_ongoing.1070.c: "Nu což, svým způsobem to #EMP je#! poučné..."
 erotic_novel_connoisseur_modifier: "Znalec erotických románů"
 lauded_loud_reader_modifier: "Opěvovaný předčitatel"
 lauded_loud_reader_modifier_desc: "Tato postava bavila svou domácnost „zajímavým“ hlasitým předčítáním."
 learn_language_ongoing.1080.t: "$learn_language$: Lekce k nezaplacení"
 learn_language_ongoing.1080.desc: "Můj dvorní učitel [court_tutor.GetFirstName] mi dnem i nocí pomáhá s jazykem „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]“.\n\nTakové odhodlání věnované umění výuky je inspirující — není dne, kdy bych nedostal[Select_CString(ROOT.Char.IsFemale, 'a', '')] dopis v jazyce „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]“ ke čtení, neměl[Select_CString(ROOT.Char.IsFemale, 'a', '')] příležitost rozmlouvat s učenou osobou z [scheme.GetTargetCharacter.GetCulture.GetNameNoTooltip] kultury nebo se neučil[Select_CString(ROOT.Char.IsFemale, 'a', '')] nějakou neobyčejnou mnemotechnickou říkanku.\n\nBez pomoci [court_tutor.GetFirstNameNoTooltip] bych rozhodně nebyl[Select_CString(ROOT.Char.IsFemale, 'a', '')] tak daleko."
 learn_language_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip], zasloužíš si odměnu!"
 learn_language_ongoing.1080.b: "[court_tutor.GetFirstNameNoTooltip] odvádí svou práci dobře."
 attended_by_tutor_modifier: "Péče dvorního učitele"
 court_tutor_child_language_rank_1_modifier: "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_2_modifier: "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_3_modifier: "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_4_modifier: "$attended_by_tutor_modifier$"
 court_tutor_child_language_rank_5_modifier: "$attended_by_tutor_modifier$"
 learn_language_ongoing.1090.t: "$learn_language$: Už se nic nevejde"
 learn_language_ongoing.1090.desc: "Naučit se jazyk „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]“ je těžké. Opravdu těžké.\n\nMám pocit, že už se mi do hlavy nic dalšího nevejde. Jakmile si zapamatuji jedno slovo, jiné se propadne do propasti zapomnění. S každou lekcí zápolím a vůbec se neposouvám."
 learn_language_ongoing.1090.friend.desc: "\n\nNaštěstí je tu pro mě vždy [helpful_friend.GetTitledFirstName].\n„Jen vydrž, můj [ROOT.Char.Custom('ComplimentAdjective')] příteli, věřím ti!“ slýchám znovu a znovu. Mám skutečně štěstí."
 learn_language_ongoing.1090.no_friend.desc: "\n\nMožná potřebuji přestávku?"
 learn_language_ongoing.1090.a: "Na [helpful_friend.GetFirstNameNoTooltip] se vždy můžu spolehnout!"
 learn_language_ongoing.1090.b: "Ať je to sebehorší, musím vytrvat!"
 learn_language_ongoing.1090.c: "Potřebuji přestávku..."
 encouraged_by_friend_modifier: "Povzbuzení přítelem"
 learn_language_ongoing.1100.t: "$learn_language$: [ROOT.Char.GetTitleTierName], kterému záleží na druhých"
 learn_language_ongoing.1100.desc: "Není žádným tajemstvím, že se usilovně učím jazyk „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]“, a zdá se, že se o tom už doslechli i [target.GetCulture.GetNameNoTooltip] rolníci.\n\nZačali mi říkat „[ROOT.Char.GetTitleTierName], kterému záleží na druhých“, což mi lichotí. Mé úsilí chválí dokonce i nižší šlechta!\n\nMám pocit, že díky mému snažení si jsou [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] a [target.GetCulture.GetCollectiveNounNoTooltip] zase o něco bližší."
 learn_language_ongoing.1100.a: "Možná bych měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] pronést projev #EMP v obou#! jazycích — [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip] i [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]?"
 learn_language_ongoing.1100.b: "Ať na mě zapomenou, nemohu si dovolit rozptylování."
 learn_language_ongoing.1100.c: "To je nanejvýš příznivé!"
 learn_language_ongoing.1100.a.success: "Proneseš fantastický projev"
 learn_language_ongoing.1100.a.failure: "Uděláš ze sebe hlupáka"
 learn_language_ongoing.1110.t: "$learn_language$: Vábení poezie"
 learn_language_ongoing.1110.desc: "Ach, „[target.Custom('RegionalDrink')|U] u jezera“ od [the_poet.GetFirstName] ([poet_location.GetNameNoTierNoTooltip]). Vskutku skvělá sbírka poezie — [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] v celé své kráse!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nMožná bych se měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] také pokusit o poezii?"
 learn_language_ongoing.1110.a: "Myslím, že to zkusím!"
 learn_language_ongoing.1110.b: "Co takhle #EMP milostná#! báseň? Třeba [lover_to_be.GetFirstNameNoTooltip] ocení mé verše."
 learn_language_ongoing.1110.c: "Ne, mám #EMP studovat#!, na takové kratochvíle není čas!"
 poetry_collector_modifier: "Sběratel poezie"
 learn_language_ongoing.1110.a.success: "Zjistíš, že máš na poezii skutečný talent"
 learn_language_ongoing.1110.a.failure: "Rýmy ti vůbec nejdou"
 learn_language_ongoing.1120.t: "$learn_language$: Dětské bajky"
 learn_language_ongoing.1120.desc: "„Moudrý [ROOT.Char.Custom('GetAnimalType')|U] pak promluvil k dítěti — [ROOT.Char.Custom('GirlBoy')] naslouchá: ‚Dej si pozor, protože tam číhá...‘“ Náhle mě někdo přeruší.\n\n„Cože!? Mocný [ROOT.Char.GetTitleTierName] si čte #EMP dětské bajky!#! Nemáš žádnou hrdost?“ zvolá [insensitive_asshole.GetTitledFirstName].\n„Tohle je nepřijatelné! Jestli se o tom dozvědí tví nepřátelé, budou tě mít za slabomyslného blázna!“\n\nMožná nebyla má volba literatury v jazyce „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]“ v očích [ROOT.Char.Custom('GetCourt')] zrovna... oslnivá."
 learn_language_ongoing.1120.a: "Ne! Tohle jsou... #EMP uctívaná klasická díla [target.GetCulture.GetNameNoTooltip] kultury!#! Přesně tak!"
 learn_language_ongoing.1120.b: "Ty se mě opovažuješ urážet!? Já ti ukážu!"
 learn_language_ongoing.1120.c: "Máš pravdu. Tohle není četba pro někoho, kdo je [ROOT.Char.GetTitleTierName]."
 learn_language_ongoing.1120.d: "Ať si lidé myslí, co chtějí. Ty příběhy jsou poučné!"
 learn_language_ongoing.1120.a.success: "[insensitive_asshole.GetFirstNameNoTooltip] uvěří, že bajky jsou klasická díla"
 learn_language_ongoing.1120.a.failure: "Tvé předčítání bajek vejde ve známost a utrpí tím tvá pověst"
 easily_read_fables_modifier: "Snadno čitelné bajky"
 seemingly_feeble_minded_modifier: "Zdánlivě slabomyslný"
 seemingly_feeble_minded_modifier_desc: "Tato postava často čte dětské bajky, a proto budí dojem, že její mysl ještě zcela nedospěla."
 learn_language_ongoing.1120.b.tt: "#V Vyzvi [insensitive_asshole.GetFirstName] na souboj#! a potrestej tu drzost!\n#weak Tento souboj NENÍ na život a na smrt.#!\nPokud vyhraješ, získáš [prestige_i] [Concept('prestige','prestiž')|E] a [Concept('modifier','modifikátor')|E] pro [Concept('scheme','intriku')|E]. Pokud prohraješ, staneš se terčem posměchu.\n\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[insensitive_asshole.GetFirstName] — [Concept('prowess','udatnost')|E]: [prowess_i]#V [insensitive_asshole.GetProwess]#!"
 learn_language_ongoing.1121.trigger_failure: "Souboj byl zrušen — [insensitive_asshole.GetFirstNameNoTooltip] už proti mně nemůže nastoupit"
 learn_language_ongoing.1123.t: "$learn_language_ongoing.1120.t$"
 learn_language_ongoing.1123.desc: "„Vzdávám se! Prosím, odpusť mi, vůbec nejsi slabomyslný blázen! Jen mě ušetři!“ vykřikne [insensitive_asshole.GetTitledFirstName].\n\nTeď už [insensitive_asshole.GetFirstNameNoTooltip] ví, co se stane, když urazí #EMP mě#!."
 learn_language_ongoing.1123.a: "Jedno moudré ponaučení praví: „[ROOT.Char.Custom('GetAnimalType')|U] radí: Neurážej ty, kdo jsou nad tebou!“"
 learn_language_ongoing.1123.b: "Za svou drzost budeš hnít v žaláři!"
 learn_language_ongoing.1124.t: "$learn_language_ongoing.1120.t$"
 learn_language_ongoing.1124.desc: "Vedle mě, zatímco ležím na zemi, dopadne plivanec. [insensitive_asshole.GetTitledFirstName] nade mnou stojí.\n\n„Ty že jsi [ROOT.Char.GetTitleTierName]? Jsi slabost a ubohost sama. Teď ti prokážu laskavost a zbavím tě těch pitomých knih.“"
 learn_language_ongoing.1124.a: "Má studia utrpěla ránu..."
 learn_language_ongoing.1130.t: "$learn_language$: Láska ke slovům"
 learn_language_ongoing.1130.desc: "„Ach, miláčku [ROOT.Char.GetFirstNameNoTooltip]! Ty se opravdu učíš můj milovaný jazyk — [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]? To je nádherné, tolik se snažíš mi porozumět!“ pronese [lover_to_help.GetTitledFirstName], [lover_to_help.Custom('quirk_pos_pp')].\n\n„Můžu ti nějak pomoci? Třeba tě naučit pár slov?“"
 learn_language_ongoing.1130.a: "Vezmu zavděk každou pomocí!"
 learn_language_ongoing.1130.b: "Jak se řekne: „Sejdeme se nazí v mé ložnici?“"
 learn_language_ongoing.1130.c: "Děkuji, ale zvládám to dobře."
 motivated_by_love_modifier: "Motivace láskou"
 learn_language_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip] je dobrý, byť poněkud flirtující učitel"
 learn_language_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip] považuje za vhodné #EMP začít#! výuku slovy jako „terpsichorský“, „transmogrifikovat“ a „lugubriální“"
 learn_language_ongoing.1140.t: "$learn_language$: Pomocná ruka"
 learn_language_ongoing.1140.desc: "„Učíš se jazyk „[scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]“, jak vidím — dobrá volba. Když jím budeš mluvit, jistě to upevní tvé postavení coby [ROOT.Char.GetTitleTierName],“ zvolá [close_one_to_help.GetFirstName], [close_one_to_help.Custom('quirk_pos_pp')]. [close_one_to_help.GetFirstNameNoTooltip] je mi [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))], takže mě zájem o má studia vlastně ani nepřekvapuje.\n\n„[target.GetCulture.GetNameNoTooltip] je má rodná řeč. Možná by má pomoc přišla vhod? Vždyť pro mě jsi [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))].“"
 learn_language_ongoing.1140.a: "Pomůžeš mi pochopit tuhle větu?"
 learn_language_ongoing.1140.b: "Nechceš se ode dneška připojit k mým lekcím?"
 helpful_assistance_modifier: "Vítaná pomoc"
 learn_language_ongoing.1300.t: "$learn_language$: Příjemné tlachání"
 learn_language_ongoing.1300.desc: "Když procházíme krajem jménem [ROOT.Char.GetCurrentLocation.GetTitle.GetName], přistoupí k mému doprovodu rozradostněný místní člověk. [interlocutor.GetFirstName] má úsměv od ucha k uchu. Z tónu je jasné, že jde o srdečné přivítání, ale jemnější význam slov mi bohužel uniká.\n\nNevadí. Mávnutím odešlu své pozorné společníky stranou a radostný pozdrav opětuji — těžko si lze představit lepší příležitost procvičit si jazyk „[interlocutor.GetCulture.GetLanguage.GetName]“!"
 learn_language_ongoing.1300.a: "Prostě si příjemně popovídáme."
 learn_language_ongoing.1300.a.flavor: "Tématem rozhovoru se stanou dva jazyky: [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] a [interlocutor.GetCulture.GetLanguage.GetNameNoTooltip], jejich podobnosti a rozdíly"
 learn_language_ongoing.1300.b: "Dnes mám chuť trochu #EMP poškádlit#!..."
 learn_language_ongoing.1300.b.flavor: "Pokusíš se rozpoutat přátelskou debatu. [interlocutor.GetFirstNameNoTooltip] bude tvým protějškem"
 learn_language_ongoing.1300.b.success: "Rozvine se poutavá debata a [interlocutor.GetFirstNameNoTooltip] se do ní s chutí zapojí"
 learn_language_ongoing.1300.b.failure: "[interlocutor.GetFirstNameNoTooltip] ti nedokáže porozumět"
 learn_language_ongoing.1300.c: "„Přidej se k nám! Míříme do místa jménem [next_destination.GetNameNoTooltip]!“"
 learn_lang_cult_acceptance_gain_debate: "Přátelská debata na cestách"
 interlocutor_entourage_member: "Účastník rozhovoru se připojil k doprovodu"
