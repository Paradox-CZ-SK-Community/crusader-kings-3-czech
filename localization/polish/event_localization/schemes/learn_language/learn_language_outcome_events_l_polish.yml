l_polish:
 learn_language_outcome.1000.t: "$learn_language$: Úspěch!"
 learn_language_outcome.1000.desc: "Po spoustě dřiny konečně umím jazyk [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName]! Nekonečné hodiny procvičování přízvuku, bezesné noci napodobováním modulace hlasu, nespočet lekcí správné intonace... nakonec to všechno stálo za to.\n\nPři svém úsilí jsem se snažil[Select_CString(ROOT.Char.IsFemale, 'a', '')] napodobit přízvuk, kterým mluví [target.GetTitledFirstName] — [target.GetTitledFirstName] by mé výsledky jistě [Select_CString(target.IsFemale, 'ocenila', 'ocenil')]!\n\nA samozřejmě si mě teď mnohem víc váží i rolníci z [target.GetCulture.GetNameNoTooltip] kultury."
 learn_language_outcome.1000.a: "Mám ze sebe dobrý pocit!"
 learn_language_outcome.1000.b: "Co kdyby ode mě [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'dostala', 'dostal')] dopis v jazyce [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip]?"
 learn_language_outcome.1000.b.success: "Na [target.GetFirstNameNoTooltip] udělám svými znalostmi dojem"
 learn_language_outcome.1000.b.failure: "Můj dopis vyzní jako neupřímný výsměch"
 target_responds: "[target.GetTitledFirstName] odpovídá na tvůj dopis"
 learn_language_outcome.1001.opening: "[owner.Custom2('AppropriateGreetingPositive', target)]"
 learn_language_outcome.1001.desc: "Jazyk [target.GetCulture.GetLanguage.GetName] studuji už mnoho úplňků. Tento list vznikl mou vlastní rukou v písmu jazyka [target.GetCulture.GetLanguage.GetNameNoTooltip] — je to přátelský dopis od někoho, kdo mluví jazykem [owner.GetCulture.GetLanguage.GetName]!\n\nPřeji si, aby naše budoucí diplomatické styky přinesly nám oběma velký užitek!"
 learn_language_outcome.1001.a: "[owner.GetTitledFirstName] už umí jazyk [target.GetCulture.GetLanguage.GetNameNoTooltip]? Působivé, vyřiď mé pozdravy!"
 learn_language_outcome.1001.b: "Ha! [owner.GetTitledFirstName] se marně honí za slávou. K smíchu!"
 learn_language_outcome.2000.t: "$learn_language$: Neúspěch"
 learn_language_outcome.2000.desc: "Po spoustě dřiny... nic! Naučit se jazyk [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] je #EMP nemožné#!. Ať se snažím sebevíc, mluvím jako sotva odstavené batole a mé písmo připomíná čmáranice negramotného slepého nevolníka, kterému chybí většina prstů!\n\nPche! To byla ztráta času..."
 learn_language_outcome.2000.a: "Přiznávám porážku... [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetNameNoTooltip|l] je nad mé síly."
 learn_language_outcome.2000.b: "Ne! Musím začít znovu a tentokrát pořádně."
 learn_language_outcome.2000.c: "Aspoň teď znám pár velice účinných zdvořilostních obratů!"
 scheme_loses_half_progress: "[Concept('scheme','Intrika')|E] ztratí polovinu svého postupu, ale zůstane aktivní"
 learn_language_outcome.3000.t: "$learn_language$: Pokračovat ve studiu?"
 learn_language_outcome.3000.desc: "Bohužel už tu [target.GetTitledFirstName] není. Je to škoda, při učení jazyka [target.GetCulture.GetLanguage.GetName] mi [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'měla', 'měl')] sloužit jako vzor pro výslovnost.\n\nAle není důvod studium ukončovat — stačí si najít někoho jiného, podle koho se budu učit!"
 learn_language_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] má nádherný přízvuk!"
 learn_language_outcome.3000.b: "A co třeba [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? Má zajímavé nářečí."
 learn_language_outcome.3000.c: "Možná [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 learn_language_outcome.3000.d: "Ach, stejně jsem hledal[Select_CString(ROOT.Char.IsFemale, 'a', '')] důvod se studiem přestat! Hurá!"
 scheme_retains_progress: "[Concept('scheme','Intrika')|E] si zachová veškerý dosavadní postup"
 child_learned_language_title: "[owner.Custom('GetDaughterSon')|U] se [Select_CString(owner.IsFemale, 'naučila', 'naučil')] jazyk!"
 child_learned_language_desc: "[Select_CString(owner.IsFemale, 'Tvá', 'Tvůj')] [owner.Custom('GetDaughterSon')] se [Select_CString(owner.IsFemale, 'naučila', 'naučil')] [Concept('language','jazyk')|E] [target.GetCulture.GetLanguage.GetName]"
 child_learned_language_fail_title: "[owner.Custom('GetDaughterSon')|U] se jazyk [Select_CString(owner.IsFemale, 'nenaučila', 'nenaučil')]"
 child_learned_language_fail_desc: "[Select_CString(owner.IsFemale, 'Tvá', 'Tvůj')] [owner.Custom('GetDaughterSon')] se [Concept('language','jazyk')|E] [target.GetCulture.GetLanguage.GetName] [Select_CString(owner.IsFemale, 'nenaučila', 'nenaučil')]"
 child_learned_language_invalidated_title: "Intrika tvého dítěte za účelem naučit se jazyk byla zrušena"
 child_learned_language_invalidated_desc: "[Concept('scheme','Intrika')|E] tvého dítěte [GetScheme('learn_language').GetTypeName] byla zrušena"
