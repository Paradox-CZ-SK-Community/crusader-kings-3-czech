l_polish:
 do_not_execute_assassination_tooltip: "Nepokoušet se o atentát"
 assassination_ongoing.0001.t: "Tajný sympatizant"
 assassination_ongoing.0001.desc: "Můj vrah [assassin.GetName] přichází se zajímavým zjištěním. [target.GetName] má u dvora člověka, který nám může být užitečný: [secret_sympathizer.GetName]. [secret_sympathizer.GetFirstNameNoTooltip] k naší věci chová nemalé sympatie — možná je [ROOT.Char.GetFaith.GetName] ve skutečnosti tím, čemu potají věří.\n\n„[Select_CString(secret_sympathizer.IsFemale, 'Je ochotná', 'Je ochoten')] nám se spiknutím pomoci,“ vysvětluje [assassin.GetFirstNameNoTooltip]. „Má to ale svou cenu. Touží po tvém požehnání a přízni a po pověsti velkého zastánce věrných — [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] tělem i duší.“"
 assassination_ongoing.0001.a: "[secret_sympathizer.GetFirstNameNoTooltip] má mou přímluvu. [ROOT.Char.GetFaith.HighGodNameAlternate] ji uslyší."
 assassination_ongoing.0001.b: "Nemohu žehnat každému ztracenému psu, kterého přede mě přivedeš."
 fp3_sympathizer_might_betray_you.flavor: "[secret_sympathizer.GetFirstNameNoTooltip] nám možná místo pomoci ještě podrazí nohy..."
 assassination_ongoing.0002.t: "Námluvy s fanatiky"
 assassination_ongoing.0002.desc: "[assassin.GetName] se při přípravách na svou misi chová nezvykle nervózně. Před bolestivou smrtí by přitom ani [Select_CString(assassin.IsFemale, 'nemrkla', 'nemrkl')], to vím jistě. Musí za tím být něco jiného. Když se zeptám, jde rovnou k věci.\n\n„[target.GetTitledFirstName] musí zemřít, ale na tu práci potřebuji víc rukou,“ vysvětluje [assassin.GetFirstNameNoTooltip]. „V pustině jsem narazil na několik horlivých vyhnanců. Každý z nich o sobě říká totéž: Jsem [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]. [Select_CString(ROOT.Char.IsFemale, 'Do vyhnanství je poslala panovnice, která stojí proti naší věci', 'Do vyhnanství je poslal panovník, který stojí proti naší věci')]. Když jim dáme zbraně a zbroj, přidají se k nám.“"
 assassination_ongoing.0002.a: "Ať přijde každý věrný muž i každá věrná žena. Každá ruka se hodí!"
 assassination_ongoing.0002.b: "Těmhle pobudům svůj osud do rukou nesvěřím..."
 assassination_usury_event_title: "Zlato a [owner.GetFaith.HighGodNameAlternate]"
 assassination_not_usury_event_title: "Měšec zlata"
 assassination_ongoing.0003_opening: "[assassin.GetName] přichází se zajímavou zprávou: [target.GetName] má ve svém okolí slabinu, které můžeme využít.\n\n„Vskutku,“ přisvědčí [assassin.GetFirstNameNoTooltip]. „Mám tam tajný kontakt. Je to "
 assassination_usury_event_scullery_maid_desc: "obyčejná, ale pomstychtivá kuchyňská služka"
 assassination_usury_event_guard_desc: "úplatný strážce"
 assassination_usury_event_harem_slave_desc: "ctižádostivý otrok z harému"
 assassination_usury_event_gardener_desc: "nenápadný zahradník, kdysi [owner.GetFaith.GetAdherentNameNoTooltip]"
 assassination_usury_event_minor_servant_desc: "bezvýznamný sluha, zato mimořádně schopný"
 assassination_ongoing.0003.outro: ". Za informace si ovšem žádá odměnu. Musíme zaplatit zlatem... a hlavně nenápadně.“\n\nNa okamžik zaváhám. Služby se koupit dají, jistě. Ale co věrnost? A důvěra?"
 assassination_ongoing.0003.a: "Chybovat je lidské..."
 assassination_ongoing.0003.b: "Není proč váhat!"
 assassination_ongoing.0003.c: "Ne. Věrnost si #italic získám#!, ne koupím."
 assassination_ongoing.0004.t: "Chvíle pochybností"
 assassination_ongoing.0004_opening: "[assassin.GetName] působí nezvykle nejistě, snad až sklíčeně.\n\n„Ano,“ přizná se, když se přiblížím, „má víra kolísá, [ROOT.Char.Custom('FormOfAddressForLiege')]. Začínám pochybovat o slibované odměně po smrti. Mám opravdu položit život, jen abych [Select_CString(assassin.IsFemale, 'zabila', 'zabil')] toho [target.Custom2('InsultAdjective', SCOPE.sC('assassin'))] [target.GetFirstName]? Co když [assassin.GetFaith.HighGodNameAlternate] ve skutečnosti neschvaluje zabíjení #EMP všech#! nevěřících?“\n\nKdyž vidím, jak se můj mistr vrahů zmítá v pochybnostech, dochází mi, že potřebuje jediné: "
 assassination_doubt_event_hashish_desc: "trochu hašiše na uklidnění mysli, aby se stal prázdnou nádobou, skrze niž může [assassin.GetFaith.HighGodName] projevit svou vůli."
 assassination_doubt_event_alcohol_desc: "pořádně se opít a v alkoholovém oparu nahlédnout na onen svět."
 assassination_doubt_event_food_desc: "na chvíli zahnat všechny pochybnosti požitkem, který dokáže přinést jen dobré jídlo."
 assassination_doubt_event_confide_desc: "někoho, kdo všechny pochybnosti vyslechne a dodá ztracenou jistotu."
 assassination_doubt_event_orgy_desc: "večer s konkubínami, který připomene, že život stojí za to – a ten dokážu snadno zařídit."
 assassination_doubt_event_meditation_desc: "chvíli ticha a vnitřního rozjímání, v němž může [assassin.GetFaith.HighGodName] odpovědět."
 assassin_doubt_event_nothing_else: "mé ujištění, že [assassin.GetFaith.PositiveAfterLife3|U] skutečně čeká na ty, kdo ve víře neochvějně vytrvají."
 assassination_console.success: "[assassin.GetFirstNameNoTooltip] díky tobě znovu nabývá jistoty"
 assassination_console.failure: "[assassin.GetFirstNameNoTooltip] tvému ujišťování neuvěří"
 assassination_console_toast.success: "[assassin.GetFirstNameNoTooltip] znovu nalezne odhodlání"
 assassination_console_toast.failure: "[assassin.GetFirstNameNoTooltip] dál pochybuje"
 assassination_ongoing.0003.c_hashish: "Pojď, dáme si spolu pár hašišových koláčků."
 assassination_ongoing.0003.c_alcohol: "Pojď, napijeme se spolu."
 assassination_ongoing.0003.c_food: "Pojď, něco spolu sníme."
 assassination_ongoing.0003.c_confide: "Pojď, svěř se mi."
 assassination_ongoing.0003.c_orgy: "Pojď, zařídím ti malou ochutnávku toho, co slibuje [assassin.GetFaith.PositiveAfterLife3|U]..."
 assassination_ongoing.0003.c_meditation: "Pojď, budeme společně rozjímat."
 assassination_ongoing.0004.b: "Nesmíš zaváhat. Věř, že [assassin.GetFaith.HighGodName] zná správnou cestu."
 assassination_ongoing.0004.c: "Možná bychom ten atentát měli přehodnotit..."
 high_risk_of_dying.tt: "@warning_icon! #X [assassin.GetNameNoTooltip] bude při atentátu vystaven vyššímu riziku smrti!#!"
 assassination_ongoing.0005.t: "Jed, nebo nákaza"
 assassination_ongoing.0005.desc: "„Musíme využít každou výhodu, kterou máme, chceme-li [target.GetTitledFirstName] sprovodit ze světa,“ začne [assassin.GetName]. „Na Východě prý mystici po troškách užívají nesmírně prudký jed. [Select_CString(assassin.IsFemale, 'Mohla bych', 'Mohl bych')] jím potřít svou čepel. Jenže sehnat ho nebude levné...“"
 assassination_ongoing.0005.a_you: "Není třeba. Jed ti dokážu připravit vlastníma rukama!"
 assassination_ongoing.0005.a_them: "V bylinách se vyznáš. Něco namíchej."
 assassination_ongoing.0005.b: "Za naši věc zaplatím jakoukoli cenu!"
 assassination_ongoing.0005.c: "Nech čepel přes noc v latríně. To bohatě postačí."
 assassination_ongoing.0005.d: "Ne. Je to ztráta času a pod naši úroveň."
 assassination_ongoing.0006.t: "Vrah na útěku"
 assassination_ongoing.0006.desc: "Atentát na [target.GetName] byl na dosah. Můj mistr vrahů [assassin.GetName] už zahlédl příležitost udeřit, když jednoho z pomocníků náhle přemohl strach ze smrti a dal se na útěk.\n\nCelý plán jsme museli odvolat. Naštěstí [target.GetTitledFirstNameNoTooltip] zřejmě nic netuší a [assassin.GetFirstNameNoTooltip] mě ujišťuje, že brzy dostaneme další příležitost. Zběh však zůstává nebezpečným volným koncem. Musíme ho najít dřív, než nám způsobí potíže."
 assassination_ongoing.0006.a: "[Select_CString(dummy_assassin_gender.IsFemale, 'Najdeme ji — a umlčíme jednou provždy.', 'Najdeme ho — a umlčíme jednou provždy.')]"
 assassination_ongoing.0006.b: "S tím rizikem budeme muset žít."
 assassination_hunted_down_toast.success: "[Select_CString(dummy_assassin_gender.IsFemale, 'Uprchlice byla umlčena', 'Uprchlík byl umlčen')]"
 assassination_hunted_down_toast.failure: "Pátrání skončilo neúspěchem"
 assassination_hunted_down.success: "[Select_CString(dummy_assassin_gender.IsFemale, 'Uprchlá vražedkyně je vypátrána a zabita', 'Uprchlý vrah je vypátrán a zabit')]"
 assassination_hunted_down.failure: "[Select_CString(dummy_assassin_gender.IsFemale, 'Pátrání selže a uprchlice unikne', 'Pátrání selže a uprchlík unikne')]"
 assassination_ongoing.0007.t: "[Select_CString(target.IsFemale, 'Ctnostná žena?', 'Ctnostný muž?')]"
 assassination_ongoing.0007.desc: "„Nedokážu to,“ prohlásí náhle můj vrah [assassin.GetFirstName] a v tváři má nezvyklé obavy.\n\n„[target.GetTitledFirstName] je sice kacíř, ale [Select_CString(target.IsFemale, 'je to žena mimořádné ctnosti', 'je to muž mimořádné ctnosti')] a [assassin.GetFaith.HighGodName] [Select_CString(target.IsFemale, 'pro ni znamená vše', 'pro něj znamená vše')]. [Select_CString(target.IsFemale, 'Není známá jako zkorumpovaná ani nespravedlivá', 'Není známý jako zkorumpovaný ani nespravedlivý')]. Pokud [Select_CString(target.IsFemale, 'ji zabiji', 'ho zabiji')], bojím se, že [assassin.GetFaith.HighGodName] se na mě rozhněvá a [ROOT.Char.GetFaith.NegativeAfterLife] mi přinese strašlivý trest.“"
 assassination_ongoing.0007.a: "[Select_CString(assassin.IsFemale, 'Jsi #italic vražedkyně#!', 'Jsi #italic vrah#!')]! Neplatím ti za váhání!"
 assassination_ongoing.0007.b: "Možná máš pravdu... Prozatím toho necháme."
