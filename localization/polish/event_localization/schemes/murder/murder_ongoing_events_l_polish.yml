l_polish:
 murder_event_title: "Vražda:"
 murder_ongoing.3010.t: "$murder_event_title$ Opilý spolčenec"
 murder_ongoing.3010.desc_opening: "[agent_in_question.GetTitledFirstName] se den co den opíjí."
 murder_ongoing.3010.desc_hero: "Pravda, opilecké výstřelky už nám párkrát pomohly zjistit něco o [scheme.GetTargetCharacter.GetTitledFirstName]. Jenže [agent_hero_of_the_moment.GetTitledFirstName] – člověk blízký [scheme.GetTargetCharacter.GetTitledFirstName] coby [target.Custom2('RelationToMe', SCOPE.sC('agent_hero_of_the_moment'))] a zároveň můj spolčenec – se začíná obávat, že ten opilec ohrozí jeho postavení u dvora.\n\n„Je jen otázkou času, kdy [agent_in_question.GetFirstNameNoTooltip] zase neudrží svou prchlivost na uzdě!“"
 murder_ongoing.3010.desc: "Pravda, opilecké výstřelky už nám párkrát pomohly zjistit něco o [scheme.GetTargetCharacter.GetTitledFirstName]. Jinak je mi ale [agent_in_question.GetTitledFirstName] zoufale k ničemu..."
 murder_ongoing.3010.a: "Jen si dej ještě jednu, [agent_in_question.GetFirstNameNoTooltip]!"
 murder_ongoing.3010.a.success: "Opilecké výstřelky postavy [agent_in_question.GetFirstNameNoTooltip] přinesou užitek"
 murder_ongoing.3010.a.failure: "[agent_in_question.GetFirstNameNoTooltip] se prozradí"
 murder_ongoing.3010.b: "[agent_in_question.GetTitledFirstNameNoTooltip] už nesmí ani přičichnout k alkoholu."
 murder_ongoing.3010.c: "Postarám se, aby prchlivost opravdu zvítězila. Buď připraven."
 murder_ongoing.3301.t: "$murder_event_title$ Ne zrovna nejostřejší"
 murder_ongoing.3301.desc: "Kde je můj obřadní nůž?! Ten, který [Select_CString(target.IsFemale, 'měla', 'měl')] mít [target.GetTitledFirstName] ve své hrudi! Ten, který už celé dny brousím!\n\nPřevrátím své komnaty vzhůru nohama, ale nikde po něm není ani stopy."
 murder_ongoing.3301.a: "Přísahal bych, že jsem ho nechal právě tady!"
 murder_ongoing.3302.t: "$murder_event_title$ Špetka toho, snítka onoho..."
 murder_ongoing.3302.desc: "Najednou si vzpomenu na byliny, které jsem obstaral během cesty přes [herb_location.GetTerrain.GetNameNoTooltip|l] v [herb_location.GetNameNoTooltip].\n\nTy by mohly celé mé snaze vysvobodit [target.GetTitledFirstName] z pout smrtelného života dodat ten správný #EMP říz#!..."
 murder_ongoing.3302.a: "Ty se mi budou ještě náramně hodit."
