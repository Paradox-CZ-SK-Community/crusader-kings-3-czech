l_polish:
 do_not_execute_murder_tooltip: "Nepokoušet se o vraždu"
 murder_child_really_tooltip: "Opravdu chceš zavraždit dítě?"
 murder_outcome_murdered_rival_tt: "Za přežití svého [Concept('rival','soka')|E] získáš [prestige_i][EmptyScope.ScriptValue('rival_outlived_prestige_value')|P0]"
 murder_unknown_murder_against_you_was_successful: "#X Zavraždil tě neznámý útočník!#!"
 murder_unknown_murder_against_you_was_successful_other: "#X [THIS.Char.GetShortUIName]: oběť neznámého útočníka!#!"
 murder_outcome.1001.t: "Nájemný vrah!"
 murder_outcome.1001.d: "Čas nadešel. Všichni mí spolčenci jsou na svých místech. Jeden vyplatí nájemného vraha ještě téže noci, kdy má udeřit. Druhý se postará, aby hradba zůstala bez stráží. Třetí zanechá nenápadnou stezku ze svíček až k [target.GetTitledFirstNamePossessive] ložnici.\n\nVšechno je připraveno."
 murder_outcome.1001.a: "Do toho."
 murder_outcome.1001.b: "Počkat. Ještě ne."
 murder_outcome.1002.t: "Přepadení"
 murder_outcome.1002.opening: "Moji spolčenci zařídili [target.GetTitledFirstName] cestu, která povede temnými lesy. $murder_outcome.1002.d$"
 murder_outcome.1002.opening_travel: "[target.GetTitledFirstName] je právě na cestě a cílem je [province.GetName]. Trasa vede několika pustými oblastmi.\n\n$murder_outcome.1002.d$"
 murder_outcome.1002.d: "Chybí už jen banda hrdlořezů a jedna tragicky zpackaná loupež, při níž [target.GetTitledFirstName] přijde o život.\n\nUž teď vidím, jak krev mé oběti prosakuje do temné půdy..."
 murder_outcome.1002.a: "Ach, divočina umí být tak nebezpečná."
 murder_outcome.1002.b: "Počkat, teď není vhodná chvíle."
 murder_outcome.1003.t: "Hostina k nezaplacení"
 murder_outcome.1003.d: "Moji spolčenci se připravují už celé týdny. Kuchař je podplacený, aby se díval jinam, jed je obstaraný a [target.GetTitledFirstName] dostane kachnu jen pro sebe. Maso potřeme jedem a vůně bylin při podávání přehluší jeho pach.\n\nTa smrtelná hořkost bude poslední chutí, kterou má oběť kdy pozná."
 murder_outcome.1003.a: "Dobrou chuť, [target.GetFirstNameNoTooltip]..."
 murder_outcome.1003.b: "Počkat, potřebuji na přípravy víc času!"
 murder_outcome.1004.t: "Nezvaný host"
 murder_outcome.1004.desc: "Jeden z mých spolčenců obstaral [SCOPE.Custom('VenomousCreature')] a podplatil sluhu, aby je před setměním ukryl do [target.GetTitledFirstNamePossessive] postele.\n\nStačí jediné mé slovo. Jakmile [SCOPE.Custom('VenomousCreatureType')] udeří, bude s [target.GetTitledFirstName] konec."
 murder_outcome.1004.a: "Doufám, že nemáš strach z [SCOPE.Custom('VenomousCreatureTypePlural')], [target.GetFirstNameNoTooltip]..."
 murder_outcome.1004.b: "Ne. Takhle to neuděláme."
 murder_outcome.1005.t: "$knight_culture_player_plural_no_tooltip$ a sedláci"
 murder_outcome.1005.desc: "[home_province.GetNameNoTier] v poslední době sužují selské nepokoje a jeden z mých spolčenců přišel s nápadem, jak se při té příležitosti zbavit [target.GetTitledFirstName].\n\nPár mincí do správných kapes, několik štváčů v ulicích – a můžeme rozpoutat skutečnou vzpouru právě ve chvíli, kdy bude městem projíždět [target.GetTitleTierName]."
 murder_outcome.1005.a: "Je čas na starou dobrou vládu davu."
 murder_outcome.1005.b: "Tohle je až příliš nepředvídatelné!"
 murder_outcome.1006.t: "Sud vína"
 murder_outcome.1006.desc: "[home_province.GetName] chystá místní slavnost a [target.GetTitledFirstName] se jí zúčastní. A shodou okolností moc dobře vím, že vínu opravdu rozumí.\n\nMým sídlem je [target.Custom('ResidenceBuilding')] a jeho sklep se k soukromé ochutnávce přímo nabízí. Stačí připravit několik výjimečných lahví, nalákat mou oběť dovnitř... a postarat se, aby [Select_CString(target.IsFemale, 'už nikdy nevyšla', 'už nikdy nevyšel')]."
 murder_outcome.1006.a: "Tohle bude snadné!"
 murder_outcome.1007.t: "V neklidných vodách"
 murder_outcome.1007.travel: "[target.GetTitledFirstName] je právě na palubě lodi. Místem plavby je [province.GetName]."
 murder_outcome.1007.desc_not_inspection: "[province.GetNameNoTier] bude později tento týden svědkem návštěvy – [target.GetTitledFirstName] se chystá na loď zakotvenou v jednom z místních přístavů."
 murder_outcome.1007.desc: "[province.GetNameNoTier] bude později tento týden svědkem inspekce – [target.GetTitledFirstName] si přijde prohlédnout loď zakotvenou v jednom z místních přístavů."
 murder_outcome.1007.desc_ending: "\n\nStačí, aby moji spolčenci polili veslici hořlavinou. [target.GetTitledFirstName] v ní vyrazí k lodi, a až bude člun uprostřed přístavu, přijde jediný hořící šíp... Pak už jen necháme vodu dokonat zbytek."
 murder_outcome.1007.desc_ending_travel: "\n\nJaká tragédie by to byla, kdyby moji spolčenci polili lodní trámy hořlavinou, zmocnili se jediné veslice a při bezpečném úniku za sebou loď zapálili... [target.GetFirstNamePossessiveNoTooltip] osud by byl zpečetěn spolu s celým doprovodem."
 murder_outcome.1007.a: "Uveďte plán do pohybu."
 murder_outcome.1008.t: "Nápoj života"
 murder_outcome.1008.desc: "Moji spolčenci obstarali nenápadný prášek, který po rozpuštění v nápoji nezanechá jedinou stopu. Podplatili jsme služebnictvo, které dolévá [target.GetTitledFirstNamePossessive] pohár a stará se o něj. Zbývá už jen mé svolení, aby se jed při příštím osvěžujícím doušku dostal dovnitř."
 murder_outcome.1008.a: "Na zdraví!"
 murder_outcome.1201.t: "Stezka, kudy málokdo chodí"
 murder_outcome.1201.desc: "[assassin.GetTitledFirstName] chystá zvláštní výlet do lesa. [target.GetTitledFirstName] se už jistě těší na příjemný den v přírodě a nemá sebemenší důvod něco tušit.\n\nBohužel se však [target.GetFirstNameNoTooltip] cestou ztratí. A než padne noc, nebude už k nalezení. Ach, tak mladý život..."
 murder_outcome.1201.no_assassin: "Jeden z mých spolčenců chystá zvláštní výlet do lesa. [target.GetTitledFirstName] se už jistě těší na příjemný den v přírodě a nemá sebemenší důvod něco tušit.\n\nBohužel se však [target.GetFirstNameNoTooltip] cestou ztratí. A než padne noc, nebude už k nalezení. Ach, tak mladý život..."
 murder_outcome.1201.a: "Dítě ztracené v lese... Jak tragicky časté neštěstí."
 murder_outcome.1201.b: "Ne. Tohle si musím ještě rozmyslet!"
 murder_outcome.1202.t: "[Select_CString(target.IsFemale, 'Bezbranná', 'Bezbranný')]"
 murder_outcome.1202.desc: "Je čas. Jedna z kojných, které má [target.GetTitledFirstName], je ochotná udělat, co je třeba. Samozřejmě za patřičnou odměnu.\n\nMávnutím ruky svého spolčence zarazím dřív, než stačí dopovědět, k čemu přesně má posloužit ta ostrá jehla."
 murder_outcome.1202.a: "Ať je to hotové. Na ceně nezáleží."
 murder_outcome.1202.b: "Co mě to vůbec napadlo?"
 murder_outcome.1203.desc: "Najít někoho ochotného vztáhnout ruku na nemluvně není snadné. Najít někoho ochotného vložit mu do kolébky malý dárek – [SCOPE.Custom('VenomousCreatureType')] – už je mnohem snazší.\n\nSleduji, jak můj spolčenec otevírá malý vak a dovnitř mizí [SCOPE.Custom('VenomousCreature')]. Otřesu se. Ta věc je skoro stejně velká jako její budoucí oběť!"
 murder_outcome.1204.t: "Mlsný jazýček"
 murder_outcome.1204.desc: "Jestli je něco, čemu [target.GetTitledFirstName] nedokáže odolat, pak je to [target.Custom('FavoriteTreat')]...\n\nPříště můj spolčenec před dítětem „zapomene“ obzvlášť lákavou pochoutku. Recept je prostý: [target.Custom('FavoriteTreat')] a pořádná dávka prudkého jedu."
 murder_outcome.1204.a: "Bonbon appétit!"
 murder_outcome.1205.t: "Nebezpečné výšiny"
 murder_outcome.1205.desc_opening: "[target.GetTitledFirstName] má své dny sečtené. Všechno jednou padne: království, [ROOT.Char.Custom('LadiesLords')], #EMP děti shozené z výšky#!...\n\n"
 murder_outcome.1205.desc_dog: "Můj spolčenec uváže provaz kolem psa, kterého má [target.GetTitledFirstName], a spustí zvíře z vysoké hradby. Kňučení a vytí dítě zaručeně přiláká."
 murder_outcome.1205.desc_cat: "Můj spolčenec uváže provaz kolem kočky, kterou má [target.GetTitledFirstName], a spustí zvíře z vysoké hradby. Zoufalé mňoukání dítě zaručeně přiláká."
 murder_outcome.1205.desc_toy: "Můj spolčenec připraví tu nejlepší návnadu: [target.Custom('child_favorite_toy_indefinite')]. Uváže ji na provaz a spustí z vysoké hradby. [target.GetTitledFirstName] si jejího zmizení jistě všimne a vydá se ji hledat."
 murder_outcome.1205.desc: "Můj spolčenec vyskládá cestičku ze sladkostí, která povede výš a výš, až se malému žaludku při pohledu dolů sevře útroba. A úplně nahoře bude přes hradbu viset košík plný dobrot."
 murder_outcome.1205.desc_ending: "Až se dítě natáhne dolů, aby rozvázalo provaz, stačí tak málo, aby uklouzlo..."
 murder_outcome.1205.a: "Jaká tragédie. Opravdu."
 murder_outcome.1301.t: "Zapomenutý ve tmě"
 murder_outcome.1301.desc: "Zdá se, že za správnou cenu dokáže žalářník, kterému poroučí [prison_owner.GetTitledFirstName], na ledacos „zapomenout“. Třeba na skupinku dvořanů, která se prosmýkne do podzemí na návštěvu.\n\n[target.GetTitledFirstName] už další mít nebude..."
 murder_outcome.1301.a: "Jak dlouho asi potrvá, než [prison_owner.GetFirstNameNoTooltip] vůbec zjistí, že [target.GetFirstNameNoTooltip] je po smrti?"
 murder_outcome.1301.b: "Ne, teď ne."
 murder_outcome.1302.t: "Nevítaný host"
 murder_outcome.1302.desc: "Dostat se k [target.GetTitledFirstName] během domácího vězení není vůbec snadné. Moji spolčenci však našli starého sloužícího, který kdysi působil"
 murder_outcome.1302.home_court_exists: " u dvora v [target_home.GetNameNoTier],"
 murder_outcome.1302.home_court_does_not_exists: " u někdejšího dvora mé oběti,"
 murder_outcome.1302.end: " a je ochoten sehrát dávného přítele, který přichází na návštěvu..."
 murder_outcome.1302.a: "[Select_CString(dummy_gender.IsFemale, 'Dejte služce zbraň a pošlete ji dovnitř.', 'Dejte sluhovi zbraň a pošlete ho dovnitř.')]"
 murder_outcome.1302.b: "Ne, teď ne."
 murder_outcome.1401.t: "Milosrdenství"
 murder_outcome.1401.desc: "Ubohý, bezbranný [target.GetTitledFirstName]... Kdy vlastně ještě stojí za to žít?\n\nJeden z mých spolčenců zařídil, aby se nájemný vrah dostal do komnat, kde bezvládně „odpočívá“ [target.GetTitledFirstName]."
 murder_outcome.1401.a: "Takhle to bude nejlepší."
 murder_outcome.1401.b: "Ne. Tohle už není správné."
 murder_outcome.2000.t: "Zvrat osudu"
 murder_outcome.2000.desc: "Právě dokončuji přípravy na odchod [target.GetTitledFirstName] z tohoto světa, když mě vyruší páže. Ten [owner.Custom2('InsultNoun', ROOT.Char)] si klidně zemřel úplně bez mé pomoci!"
 murder_outcome.2000.a: "[ROOT.Char.GetFaith.DevilName|U] má zřejmě o společnost [target.GetFirstNameNoTooltip] pořádný zájem!"
 murder_outcome.2000.a.tt: "[target.GetTitledFirstName] [target.GetDeathReason]"
 murder_outcome.2500.desc: "Zatímco dál připravuji setkání mezi [target.GetTitledFirstName] a [ROOT.Char.GetFaith.DevilName|U], vyruší mě páže. Ten [owner.Custom2('InsultNoun', ROOT.Char)] odcestoval kamsi do daleka a teď je mimo můj dosah!"
 murder_outcome.2500.a: "Mně možná unikneš, ale smrti neutečeš!"
 murder_outcome.2001.t: "Nájemný vrah!"
 murder_outcome.2001.opening_1: "Plán vyšel. [target.GetName] je konečně po smrti!"
 murder_outcome.2001.opening_2: "Dostat [target.GetTitledFirstName] o samotě nebylo snadné, ale jakmile se to vrahovi konečně podařilo, [Select_CString(target.IsFemale, 'neměla už před sebou dlouhý život', 'neměl už před sebou dlouhý život')]."
 murder_outcome.2001.opening_3: "Nájemný vrah odvedl znamenitou práci. [target.GetName] je konečně po smrti!"
 murder_outcome.2001.heh: "\nHeh."
 murder_outcome.2001.owner_is_known_1: "\n\nBohužel mohu tvrdit, že všechna obvinění jsou nepodložená, jak dlouho chci. Nikdo nepochybuje, že je to moje práce."
 murder_outcome.2001.owner_is_known_2: "\n\nJenže někdo někde udělal chybu a má účast na vraždě vyšla najevo! Alespoň se mohu utěšovat tím, že [target.GetTitledFirstName] je na tom podstatně hůř než já."
 murder_outcome.2001.no_awareness_1: "\n\nNaštěstí nikdo netuší, že v tom mám prsty."
 murder_outcome.2001.no_awareness_2: "\n\nStopy jsem zahladil dokonale. A jestli mě někdo přece jen podezírá, že za útokem stojím já, nahlas to vyslovit nedokáže."
 murder_outcome.2001.a.discovered: "[Select_CString(target.IsFemale, 'Můj vrah tam byl jen proto, aby ji chránil před #EMP skutečným#! vrahem! Čestné slovo!', 'Můj vrah tam byl jen proto, aby ho chránil před #EMP skutečným#! vrahem! Čestné slovo!')]"
 murder_outcome.2001.a: "Překvapivé návštěvy mám opravdu rád."
 murder_outcome.2001.memories: "\n\nVzpomínám si, jak [bad_memory.GetDescription], [ROOT.Char.Custom('MurderMemoryEnding')]"
 murder_outcome.2002.t: "Nebezpečné cesty"
 murder_outcome.2002.opening_1: "Můj skvělý plán a pár najatých hrdlořezů se postaraly o své. [target.GetTitledFirstName] je konečně po smrti!"
 murder_outcome.2002.opening_2: "Hrdlořezové splnili svůj úkol. [target.GetTitledFirstName] už není mezi živými!"
 murder_outcome.2002.opening_3: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'opustila', 'opustil')] tento svět s čepelí lapky v těle."
 murder_outcome.2002.heh: "\nHeh."
 murder_outcome.2002.no_save: "\n\nKdyž se průvod večer utábořil, z lesa se vyhrnuli lapkové s řevem o krvi a zlatě! Vojáci se bránili, ale naštěstí ne dost dobře. V nastalé řeži [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'tragicky zahynula', 'tragicky zahynul')]."
 murder_outcome.2002.owner_is_known_1: "\n\nBohužel jednoho z lapků zajali. A ten zatracený bídák vyklopil, že jsem jim zaplatil právě za smrt [target.GetTitledFirstName]!"
 murder_outcome.2002.owner_is_known_2: "\n\nJednoho z lapků zřejmě zajali, protože už se rozkřiklo, že za přepadením stojím já!"
 murder_outcome.2002.no_awareness_1: "\n\nPo lapcích teď pátrá snad každý, ale na mou účast nepadl ani stín podezření!"
 murder_outcome.2002.no_awareness_2: "\n\nJak příhodné, že většina lapků padla v boji. A mrtví nemluví. O mé účasti se nikdy nikdo nedozví!"
 murder_outcome.2002.a.discovered: "Mým jediným zločinem bylo věřit neurozeným lapkům..."
 murder_outcome.2002.a: "Ha! Možná přece jen nejsou obyčejní lidé úplně k ničemu."
 murder_outcome.2002.a.less_arrogant: "Mé dva problémy se vyřešily navzájem!"
 murder_outcome.2003.t: "Zdravá výživa"
 murder_outcome.2003.opening_1: "Kachna a lahvička jedu odvedly svou práci. [target.GetTitledFirstName] je konečně po smrti!"
 murder_outcome.2003.opening_2: "Jed zabral přesně podle plánu. [target.GetTitledFirstName] už není mezi živými!"
 murder_outcome.2003.opening_3: "Ten opeřenec byl poslední věcí, kterou [target.GetFirstName] [Select_CString(target.IsFemale, 'kdy snědla', 'kdy snědl')]!"
 murder_outcome.2003.owner_is_known_1: "\n\nJenže zatímco se [target.GetTitledFirstName] zdánlivě dusil kostí, [Select_CString(target.IsFemale, 'dokázala mezi chrčením vyslovit mé jméno a proklít mě jako svou vražedkyni', 'dokázal mezi chrčením vyslovit mé jméno a proklít mě jako svého vraha')]!"
 murder_outcome.2003.owner_is_known_2: "\n\nBohužel se přišlo na jed a travič bez dlouhého přemlouvání prozradil, kdo za vším stojí!"
 murder_outcome.2003.owner_is_known_3: "\n\nJednoho ze služebníků, které má [target.GetTitledFirstName], však přemohly výčitky svědomí. Přiznal se a zároveň prozradil, že jed pocházel ode mě."
 murder_outcome.2003.no_awareness_1: "\n\nA ještě lépe: v posledních křečích [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'uvízla', 'uvízl')] v krku kost! Teď už nikdo pořádně neví, co [Select_CString(target.IsFemale, 'ji vlastně zabilo', 'ho vlastně zabilo')]!"
 murder_outcome.2003.no_awareness_2: "\n\nNavíc to vypadá, že žádný z mých spolčenců nevzbudil podezření. Nikdo tedy nedokáže vystopovat jed až ke mně!"
 murder_outcome.2003.a.discovered_1: "Jen jsem chtěl hostinu trochu okořenit!"
 murder_outcome.2003.a.discovered_2: "[Select_CString(target.IsFemale, 'Ale prosím vás. Náladu by zkazila tak jako tak.', 'Ale prosím vás. Náladu by zkazil tak jako tak.')]"
 murder_outcome.2003.a: "[Select_CString(target.IsFemale, 'Asi snědla něco špatného.', 'Asi snědl něco špatného.')]"
 murder_outcome.2004.opening_1: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')]! Smrt přineslo [SCOPE.Custom('VenomousCreatureAttack')] tvora [SCOPE.Custom('VenomousCreature')]. [SCOPE.Custom('VenomousCreatureType')] zaútočil krátce poté, co se [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'uchýlila do svých komnat', 'uchýlil do svých komnat')]. Stráže sice přiběhly, ale zachránit [Select_CString(target.IsFemale, 'ji už nedokázal nikdo', 'ho už nedokázal nikdo')]."
 murder_outcome.2004.owner_is_known_1: "\n\nBohužel [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'zemřela s mým jménem na rtech', 'zemřel s mým jménem na rtech')] a zvěsti o mé účasti se už rozletěly široko daleko."
 murder_outcome.2004.no_awareness_1: "\n\nNaštěstí [SCOPE.Custom('VenomousCreatureTypePlural')] neumějí mluvit, takže po jejich útoku nevede žádná stopa ke mně."
 murder_outcome.2004.no_awareness_1_beaked_mammal: "\n\nNaštěstí takoví tvorové neumějí mluvit — neumějí, že ne? – takže po útoku nevede žádná stopa ke mně."
 murder_outcome.2004.a.discovered: "Je čas [SCOPE.Custom('VenomousCreatureMovement')] pryč jako [SCOPE.Custom('VenomousCreatureType')]!"
 murder_outcome.2004.a: "Můj malý přítel odvedl svou práci znamenitě."
 murder_outcome.2005.opening_1: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá – ubitá a ušlapaná', 'mrtvý – ubitý a ušlapaný')] vlastními poddanými!\n\nRozzuřeným sedlákům stačilo zahlédnout svého lenního pána projíždět ulicemi a dav se utrhl ze řetězu. [target.GetTitledFirstName] i několik $knight_culture_player_plural_no_tooltip_lowercase$ strhli ze sedel a utloukli k smrti!"
 murder_outcome.2005.owner_is_known_1: "\n\nMnoho sedláků skončilo na šibenici. Bohužel se ještě před popravou několik mých štváčů rozpovídalo a označilo mě za původce celé té podívané."
 murder_outcome.2005.no_awareness_1: "\n\nMnoho sedláků skončilo na šibenici, včetně mých štváčů. Výborně – teď už po celé záležitosti nevede jediná stopa ke mně!"
 murder_outcome.2005.a.discovered: "Sedlákům se zkrátka nedá věřit, že pochopí, co je pro mě nejlepší."
 murder_outcome.2005.a.discovered.less_arrogant: "Zradili mě dokonce i vlastní pokorní služebníci!"
 murder_outcome.2005.a: "Sílu davu není radno podceňovat."
 murder_outcome.2006.desc: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá, zazděná a brzy zapomenutá', 'mrtvý, zazděný a brzy zapomenutý')]!\n\nDo sklepa mě [Select_CString(target.IsFemale, 'následovala', 'následoval')] zcela dobrovolně, [Select_CString(target.IsFemale, 'opojená', 'opojen')] veselím a vínem. Po několika pohárech „znamenitého“ vína [target.GetTitledFirstName] bez odporu [Select_CString(target.IsFemale, 'usnula', 'usnul')] a ani se [Select_CString(target.IsFemale, 'nepohnula', 'nepohnul')], když jsem [Select_CString(ROOT.Char.IsFemale, 'vytáhla', 'vytáhl')] zednickou lžíci a [Select_CString(ROOT.Char.IsFemale, 'začala', 'začal')] cihlu po cihle zazdívat východ.\n\n"
 murder_outcome.2006.scheme_owner_known: "Bohužel mě někdo zahlédl, jak [target.GetTitledFirstName] vedu do sklepa. Za pár týdnů novou zeď strhli a odhalili hrůzu, kterou ukrývala."
 murder_outcome.2006.scheme_unknown: "Naštěstí si té podivné nové zdi v mém sklepě zřejmě nikdo nevšiml..."
 murder_outcome.2006.a.discovered: "[Select_CString(target.IsFemale, 'Byla opilá a potřebovala', 'Byl opilý a potřeboval')] někde přespat!"
 murder_outcome.2006.a: "Ať [Select_CString(target.IsFemale, 'odpočívá', 'odpočívá')] v pokoji!"
 murder_outcome.2007.desc: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')], navždy [Select_CString(target.IsFemale, 'sevřená', 'sevřen')] chladnou náručí oceánu!\n\nHořící šíp mého spolčence prosvištěl přístavem jako plamenná čára a o několik okamžiků později už byla celá loď v jednom ohni."
 murder_outcome.2007.desc_lowborn: "Všichni na palubě skončili ve vodě. A obyčejné šaty jsou po nasáknutí vodou zatraceně těžké..."
 murder_outcome.2007.desc_highborn: "Všichni na palubě skončili ve vodě. A drahé látky jsou po nasáknutí vodou zatraceně těžké..."
 murder_outcome.2007.scheme_owner_known: "\n\nBohužel lučištníka někdo zahlédl – a ten ničema neváhal mě udat!"
 murder_outcome.2007.scheme_unknown: "\n\n#EMP Bohužel#! se lučištníka nepodařilo najít."
 murder_outcome.2007.a.discovered: "Já... [Select_CString(ROOT.Char.IsFemale, 'myslela', 'myslel')] jsem, že [target.GetTitledFirstName] umí plavat!"
 murder_outcome.2007.a: "Jaká tragédie!"
 every_entourage_member: "Každý člen doprovodu postavy [target.GetTitledFirstNameNoTooltip]:"
 murder_outcome.2008.desc_drunkard: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')] – zahubil [Select_CString(target.IsFemale, 'ji', 'ho')] právě [target.Custom('RegionalAlcoholicDrink')], který tolik [Select_CString(target.IsFemale, 'milovala', 'miloval')]!"
 murder_outcome.2008.desc_not_drunkard: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')] – stačil jediný pořádný doušek nápoje [target.Custom('RegionalDrink')]!"
 murder_outcome.2008.desc: "\n\nMoji spolčenci nasypali jed do poháru a sledovali, jak beze stopy mizí v nápoji. Teprve když [target.GetTitledFirstName] začalo otékat hrdlo a [Select_CString(target.IsFemale, 'přestala', 'přestal')] moci dýchat, [Select_CString(target.IsFemale, 'pochopila', 'pochopil')], že je něco špatně. Tou dobou už však bylo příliš pozdě.\n\n"
 murder_outcome.2008.scheme_owner_known: "Bohužel mé spolčence někdo zahlédl a podplacené služebnictvo ani na okamžik nezaváhalo, než prozradilo mou účast!"
 murder_outcome.2008.scheme_unknown: "Naštěstí byli mí spolčenci dávno pryč, než se účinky jedu projevily a všem došlo, že se stalo něco nekalého!"
 murder_outcome.2008.a.discovered: "...[Select_CString(target.IsFemale, 'Vypadala žíznivě?', 'Vypadal žíznivě?')]"
 murder_outcome.2008.a: "Na zdraví, [target.GetTitledFirstNameNoTooltip]!"
 murder_outcome.2201.t: "Zohavené tělo"
 murder_outcome.2201.opening: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')]!\n\nHledalo se dlouho do noci, než pátrání přerušili a za úsvitu začali znovu. Teprve tehdy našli tělo – zakrvácené, zohavené a rozervané, jako by se na ně vrhla nějaká hladová šelma.\n\nAlespoň doufám, že to byla šelma."
 murder_outcome.2201.scheme_owner_known: "\n\nKatastrofa! Jakmile dítě našli, můj spolčenec se okamžitě přiznal. Teď každý ví, že za tou „tragédií“ stojím já!"
 murder_outcome.2201.scheme_unknown: "\n\nNaštěstí všichni vidí jen strašlivou tragédii. O mé účasti – ba ani o tom, že vůbec existovalo nějaké spiknutí – nikdo netuší."
 murder_outcome.2201.a.discovered: "Nečekané překážky jsou přece nedílnou součástí každého dětství!"
 murder_outcome.2201.a: "A pak že děti jsou naše budoucnost."
 murder_outcome.2202.desc: "Je hotovo. [target.GetTitledFirstName] nikdy [Select_CString(target.IsFemale, 'nevyroste', 'nevyroste')], nikdy nepozná svět kolem sebe. Prý to bylo prosté – ostrá železná jehla přiložená k uchu snadno pronikla měkkou kůží i chrupavkou."
 murder_outcome.2202.desc_sadistic: "Nechám si ještě několikrát zopakovat popis křiku a tryskající krve, než je má zvědavost konečně ukojena."
 murder_outcome.2202.desc_normal: "Dvořana propustím dřív, než začne zacházet do dalších podrobností."
 murder_outcome.2202.scheme_owner_known: "\n\nKatastrofa! Kojnou chytili a ona mě označila za strůjce toho odporného činu."
 murder_outcome.2202.scheme_unknown: "\n\nKojnou sice chytili, ale v návalu hněvu ji popravili dřív, než stačila prozradit mou účast."
 murder_outcome.2202.a: "[Select_CString(ROOT.Char.IsFemale, 'Musela', 'Musel')] jsem to udělat. [Select_CString(ROOT.Char.IsFemale, 'Musela', 'Musel')]."
 murder_outcome.2202.a.tt: "#F [Select_CString(ROOT.Char.IsFemale, 'Musela', 'Musel')] jsem!#!"
 murder_outcome.2202.a.sadistic: "Tak co mám dnes na seznamu dál?"
 murder_outcome.2203.desc: "Je hotovo. [target.GetTitledFirstName] nikdy [Select_CString(target.IsFemale, 'nevyroste', 'nevyroste')], nikdy nepozná bolesti ani radosti tohoto světa. Smrt prý přišla rychle – jed zapůsobil ještě dřív, než můj spolčenec stačil opustit místnost.\n\n"
 murder_outcome.2203.scheme_owner_known: "Stráže ho však dostihly téměř okamžitě a ten zbabělec bez váhání vyzradil, že za tím ohavným činem stojím já."
 murder_outcome.2203.scheme_unknown: "Stejně rychlé byly ovšem i stráže a zanedlouho už byl můj spolčenec v řetězech. Naštěstí ho popravili dřív, než stačil vyslovit mé jméno."
 murder_outcome.2204.desc: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')] – návnadu [Select_CString(target.IsFemale, 'spolkla', 'spolkl')] i s [target.Custom('FavoriteTreat')]! Za okamžik už [Select_CString(target.IsFemale, 'svírala', 'svíral')] hrdlo a [Select_CString(target.IsFemale, 'lapala', 'lapal')] po dechu, než se [Select_CString(target.IsFemale, 'zhroutila', 'zhroutil')] na zem do malé bezvládné hromádky, která už nikdy nevstane."
 murder_outcome.2204.scheme_owner_known: "\n\nKatastrofa! Někdo zahlédl mého spolčence, jak návnadu pokládá, a zanedlouho už všichni věděli, že celý ten děsivý plán pochází ode mě!"
 murder_outcome.2204.scheme_unknown: "\n\nVyslechli všechny pekaře široko daleko, ale po cizím zavinění nenašli jedinou stopu."
 murder_outcome.2205.t: "Pád z výšin"
 murder_outcome.2205.desc_opening: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')]! Na zemi našli [Select_CString(target.IsFemale, 'její zohavené tělo', 'jeho zohavené tělo')],"
 murder_outcome.2205.desc_dog: " v náručí stále [Select_CString(target.IsFemale, 'svírala', 'svíral')] tělo svého prašivého psa."
 murder_outcome.2205.desc_cat: " v náručí stále [Select_CString(target.IsFemale, 'svírala', 'svíral')] tělo své vyzáblé kočky."
 murder_outcome.2205.desc_cat_alive: " ale po [Select_CString(target.IsFemale, 'její vyzáblé kočce', 'jeho vyzáblé kočce')] nebylo ani stopy."
 murder_outcome.2205.desc_toy: " k hrudi stále [Select_CString(target.IsFemale, 'tiskla', 'tiskl')] svou oblíbenou hračku – [target.Custom('child_favorite_toy')]."
 murder_outcome.2205.desc_nothing: " kolem těla ležely rozházené sladkosti."
 murder_outcome.2205.desc: "V mladé tváři navždy ztuhl výraz překvapení a hrůzy."
 murder_outcome.2205.scheme_owner_known: "\n\nStejná hrůza se mi vzápětí musí zračit ve tváři i mně – mého spolčence chytili a ani na okamžik nezaváhal, než mě prozradil!"
 murder_outcome.2205.scheme_unknown: "\n\nAlespoň všichni věří, že [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'spadla nešťastnou náhodou', 'spadl nešťastnou náhodou')]."
 murder_outcome.2301.t: "Zapomenutý ve tmě"
 murder_outcome.2301.opening_1: "Konečně! [target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')]! V žaláři postavy [prison_owner.GetTitledFirstName] [Select_CString(target.IsFemale, 'ji', 'ho')] utloukla skupina neznámých mužů. Napůl [Select_CString(target.IsFemale, 'vyhladovělá', 'vyhladovělý')] neměla má oběť proti přesile téměř žádnou šanci a nedokázala se ubránit."
 murder_outcome.2301.heh: "Heh."
 murder_outcome.2301.owner_is_known_1: "\n\nBohužel stačilo položit pár otázek a jeden z těch zbabělců se hned od ostatních odtrhl a ukázal prstem na mě."
 murder_outcome.2301.no_awareness_1: "\n\nNení pochyb, že vrazi patří ke dvoru postavy [prison_owner.GetTitledFirstName]. Drží však jazyk za zuby a mé jméno zůstává v bezpečí."
 murder_outcome.2301.a.discovered: "Nemůžeš někoho nechat shnít v žaláři a pak se divit, když skutečně zemře."
 murder_outcome.2301.a: "Konečně jsem tě [Select_CString(ROOT.Char.IsFemale, 'osvobodila', 'osvobodil')], [target.GetFirstNameNoTooltip]."
 murder_outcome.2302.t: "Nevítaný host"
 murder_outcome.2302.opening_1: "[target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')]! Jak bylo v plánu, [Select_CString(dummy_gender.IsFemale, 'služka se dostala', 'sluha se dostal')] až do komnat mé oběti, což jistě vyvolalo pořádný zmatek. Ten však musel rychle zmizet ve chvíli, kdy [Select_CString(dummy_gender.IsFemale, 'vytasila dýku', 'vytasil dýku')]. [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'dlouho nepřežila', 'dlouho nepřežil')]."
 murder_outcome.2302.owner_is_known_1: "\n\nBohužel vraždu odhalili dřív, než mohl můj nastrčený návštěvník uniknout. [Select_CString(dummy_gender.IsFemale, 'Služka výměnou za svůj život bez váhání vyzradila mé jméno', 'Sluha výměnou za svůj život bez váhání vyzradil mé jméno')]."
 murder_outcome.2302.no_awareness_1: "\n\nNastrčený návštěvník zase nepozorovaně zmizel a v době, kdy tělo vůbec objevili, byl dávno pryč. O mé účasti nikdo netuší."
 murder_outcome.2302.a.discovered: "[target.GetFirstNameNoTooltip] alespoň domácí vězení hned tak neopustí."
 murder_outcome.2302.a: "Snadné jako návštěva starého přítele!"
 murder_outcome.2401.opening_1: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'opustila', 'opustil')] tento svět, ačkoli se nabízí otázka, zda jej vlastně [Select_CString(target.IsFemale, 'neopustila', 'neopustil')] už dávno. Když vrah přitiskl polštář k tváři, nepřišel ani náznak odporu. Zpod látky se ozvalo jen několik tichých zasténání – a pak už nic."
 murder_outcome.2401.owner_is_known_1: "\n\nBohužel vraha objevily stráže a netrvalo dlouho, než přiznal i mou účast!"
 murder_outcome.2401.no_awareness_1: "\n\nVrah unikl a žádní další svědci nejsou. Nevidím jediný způsob, jak by ke mně ještě mohla vést nějaká stopa."
 murder_outcome.2401.a.discovered: "Nebyla to vražda. Bylo to vysvobození!"
 murder_outcome.2401.a: "Konečně odpočívej v pokoji, [target.GetFirstNameNoTooltip]."
 murder_outcome.4001.t: "Nájemný vrah!"
 murder_outcome.4001.failure_declaration_1: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'vyvázla bez jediného škrábnutí', 'vyvázl bez jediného škrábnutí')]!"
 murder_outcome.4001.failure_declaration_2: "Můj pokus připravit [target.GetTitledFirstName] o život byl zmařen!"
 murder_outcome.4001.failure_declaration_3: "Zdá se, že [target.GetTitledFirstName] opět [Select_CString(target.IsFemale, 'unikla', 'unikl')] [ROOT.Char.GetFaith.HighGodNamePossessive] soudu."
 murder_outcome.4001.desc: "Nájemný vrah se dostal až dovnitř. [target.Custom('ResidenceBuilding')] už tedy nebyl překážkou, ale ke komnatám postavy [target.GetFirstNameNoTooltip] se vrah přesto nedostal."
 murder_outcome.4001.exposed_scheme: "[Select_CString(dummy_assassin_gender.IsFemale, 'Chytili ji a pod hrozbou smrti vyzradila mé jméno!', 'Chytili ho a pod hrozbou smrti vyzradil mé jméno!')]"
 murder_outcome.4001.not_exposed_scheme: "[Select_CString(dummy_assassin_gender.IsFemale, 'Jakmile ji někdo zahlédl a spustil poplach, okamžitě uprchla a od té doby o ní nikdo neslyšel.', 'Jakmile ho někdo zahlédl a spustil poplach, okamžitě uprchl a od té doby o něm nikdo neslyšel.')]\n\n[target.GetTitledFirstName] se teď má na pozoru."
 murder_outcome.4001.a.discovered: "[Select_CString(dummy_assassin_gender.IsFemale, 'Ve skutečnosti tam byla jen proto, aby zahnala #EMP skutečného#! vraha! A podařilo se jí to!', 'Ve skutečnosti tam byl jen proto, aby zahnal #EMP skutečného#! vraha! A podařilo se mu to!')]"
 murder_outcome.4001.a: "Jednou za to zaplatíš, [target.GetFirstNameNoTooltip]!"
 murder_outcome.4001.b: "Když se to nepovede napoprvé..."
 murder_outcome.4002.desc: "\n\nMoji najatí hrdlořezové nedokázali přemoci doprovod postavy [target.GetTitledFirstName]."
 murder_outcome.4002.exposed_scheme: "A co hůř, několik jich zajali živých a ti bez váhání přiznali, že za útok dostali zaplaceno! Netrvalo dlouho a peníze vystopovali až ke mně."
 murder_outcome.4002.not_exposed_scheme: "Alespoň padli do jednoho. Nikdo už nemůže promluvit, a tak je všichni považují jen za obyčejné lapky."
 murder_outcome.4002.a: "Prostému lidu se opravdu nedá svěřit vůbec nic..."
 murder_outcome.4002.a.less_arrogant: "Tak prostý úkol, a přesto..."
 murder_outcome.4002.a.discovered: "Typičtí lapkové. Napovídají cokoli, jen aby si zachránili krk."
 murder_outcome.4003.desc: "\n\nJed nezabral tak, jak měl. [target.GetTitledFirstName] po něm jen [Select_CString(target.IsFemale, 'strávila', 'strávil')] týden upoutaný na lůžko."
 murder_outcome.4003.exposed_scheme: "A aby toho nebylo málo, bylinkáře, který jed dodal, vypátrali. [target.GetFirstNameNoTooltip] už teď ví, že za celým spiknutím stojím já!"
 murder_outcome.4003.not_exposed_scheme: "Naštěstí všichni věří, že šlo jen o obyčejnou nemoc, a [target.GetFirstName] nic netuší."
 murder_outcome.4003.a: "Příště se postarám, aby se tím [Select_CString(target.IsFemale, 'opravdu udusila', 'opravdu udusil')]!"
 murder_outcome.4003.a.discovered: "Takže opeřenec nebyl zrovna podle tvého gusta, [target.GetFirstNameNoTooltip]?"
 murder_outcome.4004.failure_declaration_1: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'přežila', 'přežil')] [SCOPE.Custom('VenomousCreatureAttack')] tvora [SCOPE.Custom('VenomousCreature')]!"
 murder_outcome.4004.failed_attempt_1: "[SCOPE.Custom('VenomousCreatureType')] sice zaútočil, ale lékaře přivolali včas a ten dokázal zabránit jedu, aby se rozšířil."
 murder_outcome.4004.scheme_owner_known: "\n\nKatastrofa! Sluhu, který [SCOPE.Custom('VenomousCreatureType')] nastražil, našli a zanedlouho vyšla najevo i má účast!"
 murder_outcome.4004.scheme_known: "\n\nNastražit [SCOPE.Custom('VenomousCreature')] přímo do postele, kde spává [target.GetTitleAsNameNoTooltip], není zrovna nenápadné. Alespoň však nikdo netuší, že za tím stojím já."
 murder_outcome.4004.scheme_unknown: "\n\nAlespoň všichni uvěřili, že za [SCOPE.Custom('VenomousCreatureAttack')] může jen zatoulaný [SCOPE.Custom('VenomousCreatureType')], a ne já."
 murder_outcome.4004.a: "Štěstí ti věčně přát nebude, [target.GetFirstNameNoTooltip]!"
 murder_outcome.4005.failure_declaration_1: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'přežila', 'přežil')] útok rozzuřeného davu sedláků!"
 murder_outcome.4005.failed_attempt_1: "\n\nMým štváčům se podařilo sedláky rozběsnit, ale jakmile dav vyrazil do ulic, vojáci postavy [target.GetFirstName] jej začali nemilosrdně kosit. Přeživší se v hrůze rozprchli a [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'ustoupila', 'ustoupil')] zpět do bezpečí, tam, kde stojí [target.Custom('ResidenceBuilding')]."
 murder_outcome.4005.scheme_owner_known: "\n\nMnoho sedláků skončilo na šibenici – a mí štváči se přiznali, že v tom mám prsty!"
 murder_outcome.4005.scheme_known: "\n\nMnoho sedláků skončilo na šibenici a štváči přiznali, že za nepokoji stály cizí síly. Naštěstí ani oni sami nevěděli, že za vším stojím já."
 murder_outcome.4005.scheme_unknown: "\n\nMnoho sedláků skončilo na šibenici. Naštěstí mezi nimi i mí štváči – a mrtví už nikoho ke mně nedovedou."
 murder_outcome.4005.a: "A právě proto vládneme my, a ne tihle neschopní sedláci."
 murder_outcome.4005.a.discovered: "Na dav je vždy spoleh, že udělá přesně to špatné."
 murder_outcome.4006.desc: "[target.GetTitledFirstName] mě do sklepa [Select_CString(target.IsFemale, 'následovala', 'následoval')] zcela dobrovolně, [Select_CString(target.IsFemale, 'opojená', 'opojený')] veselím a vínem.\n\nPo několika pohárech „znamenitého“ vína [target.GetTitledFirstName] snadno [Select_CString(target.IsFemale, 'usnula', 'usnul')]. Už jsem měl téměř zazděný východ, když dovnitř vešlo služebnictvo.\n\n"
 murder_outcome.4006.scheme_owner_known: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]?! A [target.GetTitledFirstNameNoTooltip]? A ta napůl dostavěná zeď, která [Select_CString(target.IsFemale, 'ji', 'ho')] má zavřít uvnitř... Ach ne.“"
 murder_outcome.4006.scheme_unkown: "„Ach, [target.GetTitledFirstNameNoTooltip] vám zřejmě [Select_CString(target.IsFemale, 'usnula', 'usnul')] přímo uprostřed práce. Pomůžeme vám [Select_CString(target.IsFemale, 'ji', 'ho')] odvést do ložnice, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 murder_outcome.4006.a.discovered: "Já... já tu jen trochu přestavuji!"
 murder_outcome.4006.a: "...Ano. Děkuji za pomoc."
 murder_outcome.4007.opening: "Hořící šíp mého spolčence proťal přístav plamennou čárou – a minul člun o vlásek.\n\nKdyž oheň se syčením zhasl ve studené vodě, pasažéři několik dlouhých vteřin jen nechápavě zírali. Pak vypukla panika.\n\n"
 murder_outcome.4007.scheme_owner_known: "A aby toho nebylo málo, lučištníka chytili a ten mě bez jediného zaváhání prozradil."
 murder_outcome.4007.scheme_unkown: "Naštěstí lučištník unikl a po mé účasti nezůstala jediná stopa."
 murder_outcome.4007.a.discovered: "Já jen [Select_CString(ROOT.Char.IsFemale, 'chtěla', 'chtěl')], aby si [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'procvičila', 'procvičil')] plavání!"
 murder_outcome.4007.a: "Jak těžké může být trefit se do člunu?!"
 murder_outcome.4008.desc: "[target.GetTitledFirstName] otravu [Select_CString(target.IsFemale, 'přežila', 'přežil')]!\n\nJedna z kuchyňských služek si totiž před podáváním dovolila usrknout z poháru určeného pro [target.GetTitledFirstName]. A pohled na mrtvou služku zřejmě dokáže člověka od pití docela spolehlivě odradit.\n\n"
 murder_outcome.4008.scheme_owner_known: "A aby toho nebylo málo, jeden z ostatních sluhů ani na okamžik nezaváhal a označil za původce pokusu právě mě!"
 murder_outcome.4008.scheme_unkown: "Alespoň žádný ze sluhů neprozradil mou účast. Člověk musí být vděčný i za maličkosti."
 murder_outcome.4008.a.discovered: "Ta drzost služebnictva postavy [target.GetFirstNameNoTooltip]!"
 murder_outcome.4008.a: "Příště už služebnictvo postavy [target.GetFirstNameNoTooltip] bude vědět, že se nemá plést do cizích věcí!"
 murder_outcome.4201.t: "Cesta domů"
 murder_outcome.4201.opening: "\n\n[assassin.GetTitledFirstName] [Select_CString(assassin.IsFemale, 'nechala', 'nechal')] [target.GetTitledFirstName] napospas osudu, [Select_CString(target.IsFemale, 'samotnou', 'samotného')] v divočině.\n\nJenže když se [assassin.GetFirstName] [Select_CString(assassin.IsFemale, 'vrátila', 'vrátil')] ke dvoru se zdrcující zprávou o ztraceném dítěti, [target.GetFirstName] už [Select_CString(target.IsFemale, 'čekala', 'čekal')] v síni – a [Select_CString(target.IsFemale, 'zeptala', 'zeptal')] se, jestli si spolu ještě půjdou hrát!"
 murder_outcome.4201.scheme_owner_known: "[assassin.GetFirstNameNoTooltip] [Select_CString(assassin.IsFemale, 'byla okamžitě vyslechnuta', 'byl okamžitě vyslechnut')] a můj plán vyšel najevo!"
 murder_outcome.4201.scheme_unknown: "Stačí říct, že [assassin.GetFirstNameNoTooltip] je od této chvíle pod velmi bedlivým dohledem."
 murder_outcome.4201.a.discovered: "Nu... byl to pokus o vraždu, nebo snad pokus o #EMP milosrdenství#!?"
 murder_outcome.4201.a: "Nůž do zad by to vyřešil."
 murder_outcome.4202.opening: "[target.GetTitledFirstName] stále žije! Kojná nakonec nedokázala vrazit jehlu do toho malého děťátka a nechala příležitost uniknout."
 murder_outcome.4202.scheme_owner_known: "\n\nA aby toho nebylo málo, svědomí ji začalo hryzat natolik, že se ke všemu přiznala – včetně mé účasti!"
 murder_outcome.4202.scheme_known: "\n\nA aby toho nebylo málo, svědomí ji přemohlo a přiznala celé spiknutí! Alespoň mé jméno si nechala pro sebe."
 murder_outcome.4202.scheme_unkown: "\n\nAlespoň měla dost rozumu, aby o plánu pomlčela. Možná je nakonec dobře, že to tak dopadlo..."
 murder_outcome.4202.a: "Musím si dobře rozmyslet, co dál."
 murder_outcome.4203.opening: "[target.GetTitledFirstName] stále žije! Zdá se, že jed tvora [SCOPE.Custom('VenomousCreatureType')] nebyl dost silný. Na kůži nemluvněte se objevila jen mírná vyrážka.\n\n"
 murder_outcome.4203.scheme_owner_known: "A aby toho nebylo málo, mého zbabělého spolčence chytili a ten se okamžitě přiznal – samozřejmě nezapomněl dodat, že za vším stojím já!"
 murder_outcome.4203.scheme_unkown: "Drobnou útěchou alespoň je, že můj spolčenec dokázal z místnosti zmizet, aniž by vzbudil poplach."
 murder_outcome.4204.desc_opening: "[target.GetTitledFirstName] stále žije! [Select_CString(target.IsFemale, 'Zvedla', 'Zvedl')] ze země [target.Custom('FavoriteTreat')], ale než se [Select_CString(target.IsFemale, 'stačila zakousnout', 'stačil zakousnout')], přiběhl toulavý pes, vyrval sladkost z rukou a zmizel s ní v ulicích.\n\n"
 murder_outcome.4204.scheme_unkown: "Alespoň se nikdo nedozví, co jsem měl skutečně v úmyslu..."
 murder_outcome.4204.a: "Snad to bylo nějaké znamení?"
 murder_outcome.4205.desc_opening: "[target.GetTitledFirstName] stále žije! Když můj spolčenec [Select_CString(target.IsFemale, 'dítě shodil', 'dítě shodil')] přes okraj, šaty se zachytily o výčnělek ve zdi těsně pod ním. Vydržely dost dlouho, aby přispěchala pomoc a zachránila nejen dítě, ale i"
 murder_outcome.4205.desc_dog: " toho zatraceného psa..."
 murder_outcome.4205.desc_cat: " tu zatracenou kočku..."
 murder_outcome.4205.desc_toy: " tu zatracenou hračku – [target.Custom('child_favorite_toy')]..."
 murder_outcome.4205.desc_nothing: " ty zatracené sladkosti..."
 murder_outcome.4205.scheme_unkown: "Alespoň můj spolčenec nepozorovaně unikl a dítě bylo natolik otřesené, že si nedokáže pořádně vybavit, co se vlastně stalo."
 murder_outcome.4302.t: "Nevítaný host"
 murder_outcome.4302.failure_declaration_1: "[target.GetTitledFirstName] stále žije!"
 murder_outcome.4302.failed_lack_of_planning: "Možná jsem měl celý plán lépe promyslet. Sotva „starý přítel“ vstoupil do komnaty, [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'zavolala', 'zavolal')] stráže. Že by někdo mou oběť varoval?"
 murder_outcome.4302.failed_attempt_1: "Náš „starý přítel“ svou roli zjevně nezahrál tak přesvědčivě, jak měl. Sotva [Select_CString(dummy_gender.IsFemale, 'vytasila ukrytou dýku', 'vytasil ukrytou dýku')], [target.GetFirstName] [Select_CString(target.IsFemale, 'zavolala', 'zavolal')] stráže."
 murder_outcome.4302.disastrous_attempt_1: "\n\nBohužel nastrčený sluha neměl nejmenší zábrany zachránit si vlastní krk tím, že prozradí mou účast na spiknutí."
 murder_outcome.4302.something_is_known: "\n\nAlespoň nikdo netuší, že v tom mám prsty."
 murder_outcome.4302.unknown_so_far: "\n\nNastrčený sluha nakonec unikl. Cestou však zběsile pobral všechno cenné, co mu přišlo pod ruku, takže teď všichni věří, že šlo o důmyslnou loupež, nikoli o pokus o vraždu!"
 murder_outcome.4302.a: "Tvůj čas ještě přijde, [target.GetFirstNameNoTooltip]..."
 murder_outcome.4301.t: "Zapomenutý ve tmě"
 murder_outcome.4301.failure_declaration_1: "Zdá se, že můj plán zabít [target.GetTitledFirstName] selhal!"
 murder_outcome.4301.failed_lack_of_planning: "Možná to chtělo trochu lepší přípravu. Moji rádoby vrazi museli prchnout před až příliš horlivým strážcem a práci nedokončili."
 murder_outcome.4301.failed_attempt_1: "Moji rádoby vrazi [target.GetTitledFirstName] zbili téměř k smrti. #EMP Téměř.#! Ten nepatrný zbytek života nakonec stačil, aby [Select_CString(target.IsFemale, 'přežila', 'přežil')]."
 murder_outcome.4301.something_is_known: "\n\nVšem je jasné, že šlo o pokus připravit [target.GetTitledFirstName] o život. Kdo za ním skutečně stál, však nikdo netuší."
 murder_outcome.4301.unknown_so_far: "\n\nAlespoň všechno svedli na rvačku mezi vězni, takže po mé účasti nevede jediná stopa."
 murder_outcome.4301.disastrous_lack_of_planning: "\n\nAsi jsem měl být trpělivější. Nejenže mé rádoby vrahy při práci vyrušil až příliš horlivý strážce, ale několik z nich mě navíc bez váhání označilo za strůjce celého útoku!"
 murder_outcome.4301.disastrous_attempt_1: "\n\nAby toho nebylo málo, mé rádoby vrahy při práci vyrušil až příliš horlivý strážce a několik z nich mě navíc bez váhání označilo za strůjce celého útoku!"
 murder_outcome.4301.a.discovered: "Je snad opravdu milosrdnější nechat [target.GetTitledFirstName] pomalu shnít v žaláři?"
 murder_outcome.4301.a: "Proklatě!"
 murder_outcome.4401.failure_declaration_1: "Nějak, #EMP nějak#!, [target.GetTitledFirstName] stále žije!"
 murder_outcome.4401.failed_attempt_1: "Vrah pronikl až do komnat mé oběti a přitiskl [target.GetTitledFirstName] polštář k tváři. Držel ho tam, co mohl, jenže [target.GetTitledFirstName] prostě [Select_CString(target.IsFemale, 'odmítala zemřít', 'odmítal zemřít')]."
 murder_outcome.4401.disastrous_attempt_1: "\n\nZanedlouho vtrhly dovnitř stráže a vrah se přiznal nejen k celému plánu, ale i k tomu, že za ním stojím já!"
 murder_outcome.4401.something_is_known: "\n\nZanedlouho dorazily stráže a vrah musel vzít nohy na ramena. Alespoň nikdo netuší, že jsem za pokusem stál já."
 murder_outcome.4401.unknown_so_far: "\n\nKdyž se objevily stráže, můj vrah musel rychle zmizet. Naštěstí si ho nikdo nevšiml a nikdo ani netuší, že tam kdy byl."
 murder_outcome.4302.a.discovered: "Ach, spletl jsem si snad datum popravy?"
 murder_outcome.4401.a: "Je to jen otázka času, [target.GetFirstNameNoTooltip]."
 murder_outcome.5001.t: "Opuštění smrtelné schránky"
 murder_outcome.5001.poisoned_duck: "Pochutnávám si na kachně, když mi náhle začne otékat hrdlo a údy ztěžknou. Vím, co přichází, ale nedokážu tomu nijak zabránit.\n\nNetrvá dlouho a před očima se mi zatmí. Vzdálený veselý smích se mění ve zděšené výkřiky, které pomalu slábnou a vzdalují se..."
 murder_outcome.5001.gang_of_thugs: "Cestuji lesem se svým doprovodem, když nás přepadne banda hrdlořezů. Brzy je jasné, že o naše zlato jim jde mnohem méně než o naše životy. Mí muži bojují statečně, ale lapkové mají výhodu překvapení.\n\nUtíkám, co mi síly stačí, až konečně uvěřím, že jsem v bezpečí. Pak se skrze hluk boje ozve jediný čistý zvuk napnuté tětivy."
 murder_outcome.5001.hired_assassin: "Uprostřed noci se probudím a v mých komnatách stojí temná postava. Netuším, co se stalo se strážemi, ale jakmile se na čepeli zaleskne měsíční světlo, vím, že pro mě už je pozdě.\n\nDostatečně ostrá dýka při proniknutí do masa téměř nevydá zvuk. V přívalu spalující bolesti ani nedokážu poznat, zda jsou mé výkřiky o něco hlasitější."
 murder_outcome.5001.creepy_crawly_intro: "Jakmile ucítím, že se mi něco otřelo o nohu, zachvěji se a prudce odhodím přikrývku. Náhlý pohyb však nezvaného hosta jen víc podráždí."
 murder_outcome.5001.creepy_crawly_known: "I v mdlém měsíčním světle poznávám, co se skrývá v mé posteli: [ROOT.Char.Custom('VenomousCreature')]."
 murder_outcome.5001.creepy_crawly_unknown: "[ROOT.Char.Custom('VenomousCreatureType')] se cítí ohrožený, prudce se pohne a zaútočí."
 murder_outcome.5001.creepy_crawly_end: "Zpočátku [ROOT.Char.Custom('VenomousCreatureAttack')] téměř nebolí, ale záhy mé tělo zachvátí spalující muka. Pokusím se zavolat o pomoc, jenže hlas slábne, údy znecitliví a vědomí se pomalu vytrácí."
 murder_outcome.5001.riled_up_mob: "Projíždím ulicemi [ROOT.Char.GetCurrentLocation.GetName], když se na můj doprovod sesype řvoucí dav sedláků. Než vůbec pochopím, co se děje, strhnou mě z koně a začnou do mě bušit. Slyším křik svých stráží, ale dávno předtím, než se ke mně probojují, mi svět mizí před očima."
 murder_outcome.5001.bricked: "Včerejší večer byl báječný – víno teklo proudem a veselí nebralo konce.\n\nRáno mě probudí příšerná kocovina. Netuším, kde jsem ani jak jsem se sem dostal. Vlhké zdi kolem mě připomínají sklep... a jediný východ zakrývá úplně čerstvá zeď!\n\nMé volání o pomoc polykají silné stěny. Hodiny plynou – ani nevím kolik – a s každou další mizí naděje, že mě někdo najde. Zůstává jen narůstající slabost... #EMP Možná si jen na chvíli zdřímnu...#!"
 murder_outcome.5001.sunken_boat: "Pluji na člunu a užívám si večerního vánku, když se k nám oblohou náhle řítí hořící šíp!\n\nS těžkým #EMP žuchnutím#! se zabodne do člunu a během několika okamžiků je všechno v plamenech. Vrhu se do studeného oceánu. Nasáklé šaty mě táhnou pod hladinu. Snažím se plavat, snažím se něčeho zachytit, snažím se #EMP nadechnout#!..."
 murder_outcome.5001.sunken_boat_travel: "Pluji na lodi po otevřeném moři, když se k nám oblohou náhle řítí hořící šíp!\n\nS těžkým #EMP žuchnutím#! se zabodne do lodi a během několika okamžiků je všechno v plamenech. Vrhu se do studeného oceánu. Nasáklé šaty mě táhnou pod hladinu. Snažím se plavat, snažím se něčeho zachytit, snažím se #EMP nadechnout#!..."
 murder_outcome.5001.poisoned_drink_alcohol: "Vychutnávám si večeři a plný pohár nápoje [ROOT.Char.Custom('RegionalAlcoholicDrink')], když mě náhle zarazí podivný pocit v hrdle."
 murder_outcome.5001.poisoned_drink_no_alcohol: "Vychutnávám si večeři a plný pohár nápoje [ROOT.Char.Custom('RegionalDrink')], když mě náhle zarazí podivný pocit v hrdle."
 murder_outcome.5001.poisoned_drink: "Za chvíli si už #EMP drásám#! krk ve snaze nadechnout se, vykřiknout, dostat skrz oteklé a krvácející hrdlo alespoň trochu vzduchu. Když mi vědomí začíná unikat, všimnu si krve a kůže za nehty. To budu muset umýt... Jak nevkusné..."
 murder_outcome.5001.assassin: "[assassin.GetFirstName] mě dnes [Select_CString(assassin.IsFemale, 'vzala', 'vzal')] do lesa, abychom si hráli, a byla to taková zábava! Jenže už je to strašně dlouho, co se [Select_CString(assassin.IsFemale, 'šla schovat', 'šel schovat')]. Nemůžu [Select_CString(assassin.IsFemale, 'ji', 'ho')] najít a tak rychle se stmívá... a začínám se bát..."
 murder_outcome.5001.courtier: "Několik dvořanů mě dnes vzalo do lesa, abychom si hráli, a byla to taková zábava! Jenže už je to strašně dlouho, co se šli schovat. Nemůžu je najít a tak rychle se stmívá... a začínám se bát..."
 murder_outcome.5001.lured_into_forest: "\n\nSnažím se najít cestu domů, ale všechny stromy vypadají úplně stejně. Brzy slyším, jak si pro mě přicházejí příšery. Rozběhnu se, jenže jsou rychlejší, větší a silnější... Zavřu oči a pláču po mamince."
 murder_outcome.5001.stab_infant: "Světlo se hýbe. Známé tváře. Cizí tváře. Zvuky, které znám, a jiné, kterým nerozumím. Něco ostrého a studeného mě zabolí u ucha a já začnu plakat.\n\nNěkdo mi drží hlavu. Prudká bolest. Pak už nic."
 murder_outcome.5001.infant_creepy_crawly: "Pode mnou je měkká postýlka a hřeje mě teplá přikrývka. Chci jen spát. Už skoro usínám, když ucítím něco zvláštního, jako by mi cosi lezlo po těle. Náhle mě prudce zabolí ruka a já začnu plakat.\n\nBolest se šíří a sílí. #EMP Tolik to bolí.#! Celý svět je najednou jen bolest, dokud nezmizí úplně všechno."
 murder_outcome.5001.poisoned_candy: "Hraji si venku a začínám mít trochu hlad, když se odnikud objeví sluha s tím nejlepším dárkem na světě: [ROOT.Char.Custom('FavoriteTreat')], až se mi sbíhají sliny!\n\nUběhne jen pár chvil a svět se začne převracet, bříško příšerně bolí a já #EMP nemůžu dýchat#!! Padám na zem a nakousnutý [ROOT.Char.Custom('FavoriteTreat')] mi vyklouzne z rukou."
 murder_outcome.5001.child_pushed_dog: "Hraji si venku, když to uslyším – zoufalý nářek mého milovaného psa [ROOT.Char.Custom('DogStoryName')]! Zvednu hlavu a vidím [ROOT.Char.Custom('DogStoryHerHim')], jak visí na provaze z vysoké zdi. Utíkám tam tak rychle, jak jen dokážu.\n\nNatáhnu se dolů, abych [ROOT.Char.Custom('DogStoryHerHim')] zachránil, když se svět najednou převrátí. Padám. Země se ke mně řítí blíž a blíž, zavírám oči a–"
 murder_outcome.5001.child_pushed_cat: "Hraji si venku, když to uslyším – zoufalý nářek mé milované kočky [ROOT.Char.Custom('CatStoryName')]! Zvednu hlavu a vidím [ROOT.Char.Custom('CatStoryHerHim')], jak visí na provaze z vysoké zdi. Utíkám tam tak rychle, jak jen dokážu.\n\nNatáhnu se dolů, abych [ROOT.Char.Custom('CatStoryHerHim')] zachránil, když se svět najednou převrátí. Padám. Země se ke mně řítí blíž a blíž, zavírám oči a–"
 murder_outcome.5001.child_pushed_toy: "Hraji si venku, když ji spatřím – mou milovanou hračku [target.Custom('child_favorite_toy')], zavěšenou na provaze z vysoké zdi! Vyběhnu po schodech tak rychle, jak jen dokážu, ale když se pro ni natáhnu, svět se najednou převrátí. Padám. Země se ke mně řítí blíž a blíž, zavírám oči a–"
 murder_outcome.5001.child_pushed: "Hraji si venku, když si všimnu cestičky ze sladkostí vedoucí vzhůru po schodech. Úplně nahoře visí přes okraj košík nacpaný dobrotami! Natáhnu se po něm, ale svět se najednou převrátí. Padám. Země se ke mně řítí blíž a blíž, zavírám oči a–"
 murder_outcome.5001.beat_to_death_in_dungeon: "Když se otevřou dveře mé žalářní cely, na kratičký okamžik si dovolím doufat, že mě přišli osvobodit. Dovnitř však vstoupí skupina zahalených postav a já okamžitě vím, co mě čeká.\n\nRány přicházejí prudce a bez milosti. Mé zesláblé tělo se nedokáže bránit. Ležím na zemi a cítím, jak ze mě uniká život. Téměř bezmyšlenkovitě sleduji, jak se má krev mísí s vodou na vlhké podlaze."
 murder_outcome.5001.unwelcome_guest_house_arrest: "V mých komnatách čeká [Select_CString(dummy_gender.IsFemale, 'žena, kterou neznám. Přesto mé věznitele přesvědčila, že je mou starou přítelkyní', 'muž, kterého neznám. Přesto mé věznitele přesvědčil, že je mým starým přítelem')].\n\nTeprve když vytáhne ukrytou dýku, dojde mi, odkud tu tvář znám. Je to [dummy_gender.Custom('GenderedLowlyServantType')] z"
 murder_outcome.5001.unwelcome_guest_house_arrest.target_court: " dvora v [target_home.GetNameNoTier]."
 murder_outcome.5001.unwelcome_guest_house_arrest.no_court: " [target.GetFirstNamePossessiveNoTooltip] někdejšího dvora."
 murder_outcome.5001.unwelcome_guest_house_arrest.end: "Úder přichází příliš rychle, než abych stačil zareagovat."
 murder_outcome.5001.strangle_incapable: "Je tam venku ještě svět? Nedokážu vnímat, jak plyne čas. Je to bolest v... hrudi? Nebo... v krku? Je to vůbec moje tělo? Stmívá se snad nad šedými mraky v mé mysli? Tak těžko se soustředím.\n\nTak... těžko..."
 murder_outcome.5001.schemer_known: "\n\nAni na okamžik nepochybuji, kdo mi tohle způsobil. [owner.GetTitledFirstName]!"
 murder_outcome.5001.avenge_me: "Dědicové, pomstěte mou smrt!"
 murder_outcome.5001.not_my_time: "Ještě jsem měl tolik důvodů žít!"
 murder_outcome.5001.option_incapable: "Konečně smrt."
 murder_outcome.5002.t: "Pokus o vraždu!"
 murder_outcome.5002.poisoned_duck: "Právě se chystám zakousnout do nejšťavnatějšího kousku kachny, jaký jsem kdy viděl, když se jeden z mých sluhů náhle svalí k zemi a začne se chytat za hrdlo! Ten hlupák si zřejmě tajně uzobával z mého jídla.\n\nAlespoň mě včas varoval, abych se otráveného ptáka ani nedotkl, a za svou opovážlivost dostal zasloužený trest."
 murder_outcome.5002.gang_of_thugs: "Při cestě lesem můj doprovod přepadnou lapkové! O zlato jim vůbec nejde – rovnou zaútočí, ještě než stačím přikázat svým mužům, aby je pobili na místě. Boj je zuřivější, než jsem čekal, a co hůř, hrdlořezové jdou očividně přímo po mně!\n\nJeště že nakonec nezůstane stát ani jeden. Při jejich urputnosti mě málem dostali."
 murder_outcome.5002.hired_assassin: "Z pozdního nočního spánku mě vytrhne zvuk, jako když nájemný vrah zakopne o nočník. Jakmile spatřím svého útočníka, s naprostým klidem a důstojností zavolám stráže. Po jejich příchodu následuje krátká potyčka, na jejímž konci leží vetřelec mrtvý."
 murder_outcome.5002.creepy_crawly_end: "Jed tvora [SCOPE.Custom('VenomousCreatureType')] mi s palčivou bolestí proniká celým tělem, ale okamžitě si nechám zavolat lékaře. Je to dlouhá a bolestivá noc, avšak s východem slunce konečně začíná bolest ustupovat."
 murder_outcome.5002.riled_up_mob: "Projíždím ulicemi [home_province.GetNameNoTier], když se na můj doprovod sesype řvoucí dav sedláků. Naštěstí mé stráže ani na okamžik nezaváhají a začnou je kosit nalevo napravo, zatímco já se stahuji do bezpečí. Mým cílem je [ROOT.Char.Custom('ResidenceBuilding')]."
 murder_outcome.5002.bricked: "Včera jsem se účastnil místních oslav v [home_province.GetName] a strávil nádherný večer opojený veselím a vínem.\n\nRáno mě probudí příšerná kocovina. Netuším, kde jsem ani jak jsem se sem dostal. Vlhké zdi kolem mě připomínají sklep... a jediný východ #EMP téměř#! zakrývá úplně čerstvá zeď. Někdo mě tu chtěl pohřbít zaživa!"
 murder_outcome.5002.sunken_boat: "Pluji na člunu v přístavu v [province.GetNameNoTier], když se k nám oblohou náhle řítí hořící šíp!\n\nMine nás sotva o vlásek. Nakloním se, abych sledoval, jak se syčením zhasíná ve studené vodě, a vtom ucítím z lodního dřeva nezaměnitelný pach: řecký oheň! Někdo se mě právě pokusil zabít."
 murder_outcome.5002.poisoned_drink: "Právě večeřím a chystám se napít, když do místnosti vtrhne sluha a #EMP těsně#! před mými rty mi vyrazí pohár z ruky!\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], je v tom jed! Jedna z kuchyňských služek... Odpusťte jí, usrkla si a ona – ona je mrtvá!“"
 murder_outcome.5002.lured_into_forest: "[assassin.GetFirstName] mě [Select_CString(assassin.IsFemale, 'vylákala', 'vylákal')] do lesa, abychom si hráli, ale pak se [Select_CString(assassin.IsFemale, 'schovala a už se neukázala', 'schoval a už se neukázal')]!\n\nPláču, klopýtám přes větve a volám o pomoc, až mě hrdlo pálí. Pak se přede mnou zničehonic otevře cesta z lesa – našel jsem cestu domů! Jsem v bezpečí."
 murder_outcome.5002.stab_infant: "Světlo se hýbe. Známé tváře. Cizí tváře. Zvuky, které znám, a jiné, kterým nerozumím. Něco ostrého a studeného mě zabolí u ucha a já začnu plakat.\n\nPak slyším hlasitý ženský pláč. Dospělý. Všude kolem křik a vyděšené hlasy. A potom mě nechají samotného."
 murder_outcome.5002.infant_creepy_crawly: "Pode mnou je měkká přikrývka a nade mnou něco teplého. Už skoro usínám, když ucítím něco zvláštního, jako by mi cosi lezlo po těle. Náhle mě prudce zabolí ruka a já začnu plakat.\n\nNablízku slyším mužský hlas a vzápětí spoustu dalších, hlasitých a vyděšených. Jak hlasy postupně slábnou, mizí i bolest v ruce. Brzy zase usnu."
 murder_outcome.5002.poisoned_candy: "Hraji si venku, když ji spatřím: [ROOT.Char.Custom('FavoriteTreat')], až se mi sbíhají sliny! Nikdo není nablízku a nikdo si přece nevšimne, když si tajně kousnu...\n\nSotva otevřu ústa, přiběhne prašivý toulavý pes, vyrve mi dobrotu přímo z rukou, spolkne ji vcelku – a vzápětí se svalí mrtvý k zemi."
 murder_outcome.5002.child_pushed_dog: "Hraji si venku, když to uslyším – zoufalý nářek mého milovaného psa [ROOT.Char.Custom('DogStoryName')]! Zvednu hlavu a vidím [ROOT.Char.Custom('DogStoryHerHim')], jak visí na provaze z vysoké zdi. Utíkám tam tak rychle, jak jen dokážu.\n\nNatáhnu se dolů, abych [ROOT.Char.Custom('DogStoryHerHim')] zachránil, když se svět najednou převrátí. Padám. Země se ke mně řítí blíž a blíž, zavírám oči a– ...nic! Visím ze zdi a za záda mě drží [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Uf!#!"
 murder_outcome.5002.child_pushed_cat: "Hraji si venku, když to uslyším – zoufalý nářek mé milované kočky [ROOT.Char.Custom('CatStoryName')]! Zvednu hlavu a vidím [ROOT.Char.Custom('CatStoryHerHim')], jak visí na provaze z vysoké zdi. Utíkám tam tak rychle, jak jen dokážu.\n\nNatáhnu se dolů, abych [ROOT.Char.Custom('CatStoryHerHim')] zachránil, když se svět najednou převrátí. Padám. Země se ke mně řítí blíž a blíž, zavírám oči a– ...nic! Visím ze zdi a za záda mě drží [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Uf!#!"
 murder_outcome.5002.child_pushed_toy: "Hraji si venku, když ji spatřím – mou milovanou hračku [target.Custom('child_favorite_toy')], zavěšenou na provaze z vysoké zdi! Vyběhnu po schodech tak rychle, jak jen dokážu, ale když se pro ni natáhnu, svět se najednou převrátí. Padám. Země se ke mně řítí blíž a blíž, zavírám oči a– ...nic! Visím ze zdi a za záda mě drží [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Uf!#!"
 murder_outcome.5002.child_pushed: "Hraji si venku, když si všimnu cestičky ze sladkostí vedoucí vzhůru po schodech. Úplně nahoře visí přes okraj košík nacpaný dobrotami! Natáhnu se po něm, ale svět se najednou převrátí. Padám. Země se ke mně řítí blíž a blíž, zavírám oči a– ...nic! Visím ze zdi a za záda mě drží [ROOT.Char.Custom('GetUpperClothingArticle')]. #EMP Uf!#!"
 murder_outcome.5002.beat_to_death_in_dungeon: "Když se otevřou dveře mé cely, na okamžik si dovolím doufat, že mě přišli osvobodit. Zahalené postavy, které vstoupí dovnitř, mě však rychle vyvedou z omylu a začnou mě surově bít.\n\nNerad to přiznávám, ale život mi zachránil jen náhodný – a dokonale načasovaný – příchod mých stráží."
 murder_outcome.5002.unwelcome_guest_house_arrest: "V mých komnatách má údajně čekat starý přítel, takže mě poněkud překvapí zahalená postava – nápadně cizí a podezřelá.\n\nJakmile se tedy objeví ukrytá dýka, neváhám ani okamžik. Rozběhnu se ke dveřím a křičím na stráže. Čekají hned za nimi, takže cizinci zřejmě nevěřili ani ony. Naštěstí pro mě."
 murder_outcome.5002.strangle_incapable: "Je tam venku ještě svět? Nedokážu vnímat, jak plyne čas. Je to bolest v... hrudi? Nebo... v krku? Je to vůbec moje tělo? Stmívá se snad nad šedými mraky v mé mysli? Tak těžko se soustředím.\n\nJe tu někdo? Nic neslyším, ale #EMP cítím#!, jako by někdo křičel. A potom je zase jen ticho."
 murder_outcome.5002.schemer_known: "\n\nNepochybuji ani na okamžik, čí je to práce. Ten [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)] – [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome.5002.will_find_out: "Zjistím, kdo za tím stojí!"
 murder_outcome.5002.revenge_will_be_had: "Ještě bude litovat, že se o to [Select_CString(owner_to_reveal.IsFemale, 'pokusila', 'pokusil')]!"
 murder_outcome.5002.child: "Který dospělý může být tak krutý?"
 murder_outcome.5002.infant: "Rozpláču se ještě víc."
 murder_outcome.5002.option_incapable: "Co se děje?"
 murder_outcome.5002.memories_death: "\n\nKdyž mi vědomí začíná unikat, zaslechnu chladný hlas:\n#EMP „Zakázka splněna. Pomsta za to, jak [bad_memory.GetThirdPerspectiveDescription|l] – vyřízeno. Teď si vyzvednout zlato.“#!"
 murder_outcome.5002.memories: "\n\nNedaleko místa činu se najde zmačkaný vzkaz, na němž stojí #EMP „Platba přiložena v plné výši. Zakázka vystavena za to, jak [bad_memory.GetThirdPerspectiveDescription|l].“#!"
 murder_outcome.5002.house_feud: "\n\nRod [owner_to_reveal.GetHouse.GetBaseName]! Měl jsem to vědět!"
 murder_outcome.4301.house_feud: "\n\nK čertu s těmi parchanty z rodu [target.GetHouse.GetBaseName]!"
 murder_outcome.2001.house_feud: "\n\nAlespoň je o jednoho člena rodu [target.GetHouse.GetBaseName] méně!"
 murder_outcome.2001.b: "Tohle je teprve začátek."
 murder_outcome.2001.c: "Spravedlnosti bylo učiněno zadost."
 murder_outcome_reworked.0000.success_declaration.generic.1: "[target.GetTitledFirstName] je konečně [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')]!"
 murder_outcome_reworked.0000.success_declaration.generic.2: "Moji spolčenci uspěli! [target.GetTitledFirstName] je [Select_CString(target.IsFemale, 'mrtvá', 'mrtvý')]!"
 murder_outcome_reworked.0000.success_declaration.generic.3: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'byla odeslána', 'byl odeslán')] do [ROOT.Char.GetFaith.DeathDeityNamePossessive] osudového objetí!"
 murder_outcome_reworked.0000.failure_declaration.generic.1: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'vyvázla bez jediného škrábnutí', 'vyvázl bez jediného škrábnutí')]!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.2: "Můj pokus připravit [target.GetTitledFirstName] o život byl zmařen!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.3: "Zdá se, že [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'unikla', 'unikl')] ze spárů, které po [Select_CString(target.IsFemale, 'ní', 'něm')] natahuje [ROOT.Char.GetFaith.DeathDeityName]!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.4: "[target.GetTitledFirstName] stále žije!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.5: "Zdá se, že můj plán zabít [target.GetTitledFirstName] selhal!\n\n"
 murder_outcome_reworked.0000.failure_declaration.generic.6: "Nějak, #EMP nějak#!, [target.GetTitledFirstName] stále žije!\n\n"
 murder_outcome_reworked.0000.memories.bad.general: "Navždy si budu pamatovat, jak [bad_memory.GetDescription], [ROOT.Char.Custom('MurderMemoryEnding')]\n\n"
 murder_outcome_reworked.0000.memories.bad.house_feud: "O jednoho člena rodu [target.GetHouse.GetBaseName] méně starostí.\n\n"
 murder_outcome_reworked.0000.memories.line_break: "Konečně je ta osina v zadku pryč. Budiž pochválen [owner.GetFaith.FateGodName]!\n\n"
 murder_outcome_reworked.0000.kept_secret.generic.1: "\n\nNaštěstí se sice vždy najdou lidé, kteří budou šeptat, ale o mé účasti na zločinu nikdo nic neví."
 murder_outcome_reworked.0000.kept_secret.generic.2: "\n\nStopy jsem zahladil dobře. A jestli mě někdo přece jen podezírá, že za útokem stojím já, nahlas to vyslovit nedokáže."
 murder_outcome_reworked.0000.revealed.generic.1: "\n\nBohužel mohu protestovat, jak chci. Ze všech stran přicházejí nepodložená obvinění a všechna ukazují přímo na #EMP mě#! jako strůjce celé události."
 murder_outcome_reworked.0000.revealed.success.1: "\n\nBohužel někdo někde udělal chybu a má účast na zločinu vyšla najevo. Alespoň se mohu utěšovat tím, že [target.GetTitledFirstName] je na tom podstatně hůř než já."
 murder_outcome_reworked.0000.revealed.failure.1: "\n\nA co hůř, na světlo se dostalo dost důkazů, aby mou účast na zločinu spolehlivě prokázaly. [Select_CString(ROOT.Char.IsFemale, 'Teď jsem nejen vražedkyně, ale ještě k tomu neschopná.', 'Teď jsem nejen vrah, ale ještě k tomu neschopný.')]"
 murder_outcome_reworked.0000.addendum.house_feud.1: "K čertu s těmi [target.GetHouse.GetBaseName] #EMP parchanty#!."
 murder_outcome_reworked.0000.addendum.house_feud.2: "Rod [owner_to_reveal.GetHouse.GetBaseName]! Ať je všechny pohltí [target.GetFaith.random_NegativeAfterLife]!"
 murder_outcome_reworked.0000.addendum.house_feud.2.2: "A zazní i: „$murder_outcome_reworked.0000.addendum.house_feud.2$“"
 murder_outcome_reworked.0000.addendum.house_feud.2.servants: "Služebnictvo dál reptá. $murder_outcome_reworked.0000.addendum.house_feud.2.2$"
 murder_outcome_reworked.0000.memories.target.voice_overheard: "\n\nKdyž mi vědomí uniká, chladný hlas zašeptá: #EMP „Ber to jako pomstu za to, jak [bad_memory.GetSecondPerspectiveDescription]. [Select_CString(target.IsFemale, 'Drahá', 'Drahý')] [target.GetTitleAsNameNoTooltip], doufám, že to za to stálo.“#!"
 murder_outcome_reworked.0000.memories.target.note_discovered: "\n\nNedaleko místa činu se najde zmačkaný vzkaz: #EMP „Platba přiložena v plné výši. Zakázka vystavena za to, jak [bad_memory.GetThirdPerspectiveDescription].“#!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.1: "\n\nKdyž si pro mě přichází smrt, ani na okamžik nepochybuji, kdo mi tohle způsobil: [owner.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.2: "\n\nI když mi mysl pomalu pohasíná, poslední myšlenka je naprosto jasná: za tím bezpochyby stojí [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)] – [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.child: "\n\nUž nikdy neuvidím zdrcující zoufalství své rodiny ani neuslyším šeptání služebnictva: „[Select_CString(owner_to_reveal.IsFemale, 'Byla to', 'Byl to')] [owner_to_reveal.GetTitledFirstName]!“"
 murder_outcome_reworked.0000.revealed.scheme_target.success.baby: "\n\n[Select_CString(target.IsFemale, 'Stejně bych nerozuměla', 'Stejně bych nerozuměl')] panice, která vypukne, až mě služebnictvo najde, ani jeho šeptání: „[Select_CString(owner_to_reveal.IsFemale, 'Byla to', 'Byl to')] [owner_to_reveal.GetTitledFirstName]!“"
 murder_outcome_reworked.0000.revealed.scheme_target.failure.baby: "\n\nNerozumím křiku služebnictva, když mě najde, ani jeho šeptání: „[Select_CString(owner_to_reveal.IsFemale, 'Musela to být', 'Musel to být')] [owner_to_reveal.GetTitledFirstName]!“"
 murder_outcome_reworked.0000.revealed.scheme_target.failure.baby.2: "\n\nNerozumím rozhněvanému šeptání služebnictva: „[Select_CString(owner_to_reveal.IsFemale, 'Musela to být', 'Musel to být')] [owner_to_reveal.GetTitledFirstName]!“"
 murder_outcome_reworked.0000.revealed.scheme_target.success.baby.end: "[Select_CString(target.IsFemale, 'Vždyť jsem byla jen miminko.', 'Vždyť jsem byl jen miminko.')]"
 murder_outcome_reworked.0000.revealed.scheme_target.failure.baby.end: "[Select_CString(target.IsFemale, 'Vždyť jsem jen miminko.', 'Vždyť jsem jen miminko.')]"
 murder_outcome_reworked.0000.revealed.scheme_target.success.1.incapable: "\n\nNež mé tělo najdou, zazní spousta slov, jejichž význam už dávno uniká mé ochablé mysli: „[Select_CString(owner_to_reveal.IsFemale, 'Byla to', 'Byl to')] [owner_to_reveal.GetTitledFirstName]!“"
 murder_outcome_reworked.0000.revealed.scheme_target.failure.1.incapable: "\n\nKdyby pro mě slova ještě něco znamenala, rozuměl bych tomu, co všichni kolem rozhněvaně opakují: „[Select_CString(owner_to_reveal.IsFemale, 'Musela to být', 'Musel to být')] [owner_to_reveal.GetTitledFirstName]!“"
 murder_outcome_reworked.0000.revealed.scheme_target.success.no_linebreak.1: "Ani na okamžik nepochybuji, kdo mi tohle způsobil. [owner.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.success.no_linebreak.2: "Za tím bezpochyby stojí [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)] – [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.scheme_target.failure.1: "\n\nAť [owner_to_reveal.GetTitledFirstName] protestuje sebevíc, všechny důkazy ukazují na přímou účast v celé události."
 murder_outcome_reworked.0000.revealed.scheme_target.failure.2: "\n\nNejenže atentát selhal, ale neobratně zanechané stopy vedou přímo k jeho strůjci - jimž není nikdo jiný, než [owner_to_reveal.GetTitledFirstName]!"
 murder_outcome_reworked.0000.revealed.owner.response.1: "Jaké nestoudné pomluvy!"
 murder_outcome_reworked.0000.successful_scheme_target.adult: "[Select_CString(ROOT.Char.IsFemale, 'Ještě jsem toho měla tolik před sebou...', 'Ještě jsem toho měl tolik před sebou...')]"
 murder_outcome_reworked.0000.successful_scheme_target.child: "To není fér!"
 murder_outcome_reworked.0000.successful_scheme_target.incapable: "Pak už jen nicota."
 murder_outcome_reworked.0001.desc.assassin_present_at_location.consort: "Jako [assassin.Custom2('GetYourConsortType', target)] postavy [target.GetFirstNameNoTooltip] už [assassin.GetFirstName] [Select_CString(assassin.IsFemale, 'byla', 'byl')] samozřejmě přímo na místě. Stačilo jen počkat, až oběť usne, vytáhnout zpod polštáře připravený nůž a podříznout jí hrdlo. „[target.Custom2('InsultNoun', ROOT.Char)]!“ Provaz spuštěný z okna, několik vlastnoručně způsobených řezných ran a předem naaranžované stopy zápasu dole pod oknem pak docela přesvědčivě předstíraly útěk „skutečného“ vraha."
 murder_outcome_reworked.0001.desc.hired_assassin.assassin_present_at_location: "[assassin.GetFirstName] náš plán [Select_CString(assassin.IsFemale, 'provedla', 'provedl')] dokonale. Uprostřed noci [Select_CString(assassin.IsFemale, 'proklouzla', 'proklouzl')] mezerou mezi hlídkujícími strážemi, ukradeným klíčem si [Select_CString(assassin.IsFemale, 'odemkla', 'odemkl')] komnaty naší kořisti a bídný život postavy [target.GetFirstNameNoTooltip] [Select_CString(assassin.IsFemale, 'ukončila', 'ukončil')] v mokrém chrčení."
 murder_outcome_reworked.0001.desc.hired_assassin.assassin_remote_working: "Žoldák ve službách postavy [assassin.GetFirstName] náš plán provedl dokonale. Uprostřed noci [Select_CString(dummy_assassin_gender.IsFemale, 'najmutá vražedkyně proklouzla', 'najatý vrah proklouzl')] předem vypozorovanou mezerou mezi hlídkujícími strážemi, ukradeným klíčem si [Select_CString(dummy_assassin_gender.IsFemale, 'odemkla', 'odemkl')] komnaty naší kořisti a bídný život postavy [target.GetFirstNameNoTooltip] [Select_CString(dummy_assassin_gender.IsFemale, 'ukončila', 'ukončil')] v mokrém chrčení."
 murder_outcome_reworked.0002.desc: "$murder_outcome.5001.hired_assassin$"
 murder_outcome_reworked.0003.desc: "V nejchoulostivějším okamžiku udělal nájemný vrah osudovou chybu! [target.GetFirstNameNoTooltip] se [Select_CString(target.IsFemale, 'probudila', 'probudil')] a u postele spatřila hrozivou postavu zahalenou ve tmě. Okamžitě se ozval křik o pomoc a zaskočený spolčenec vzal nohy na ramena."
 murder_outcome_reworked.0004.desc: "Ze spánku mě vytrhne šmátrání neobratných rukou a tlumené klení.\n\nTěsně vedle mě — #EMP až příliš těsně#! — stojí postava zahalená ve tmě, očividně stejně zaskočená jako já. Vykřiknu o pomoc, vetřelec se dá na útěk a dovnitř se vrhnou mé stráže."
 murder_outcome_reworked.0011.desc: "Vlastně k tomu nebylo potřeba mnoho — jen banda zoufalých lapků lačných po stříbře a pečlivě připravená příležitost k útoku — ale výsledek je #EMP znamenitý#!. Divoká vřava zastihla obránce mé oběti naprosto nepřipravené a jeden z hrdlořezů [Select_CString(target.IsFemale, 'té mrše', 'tomu parchantovi')] vrazil čepel přímo do oka."
 murder_outcome_reworked.0012.desc.alley: "Se svým doprovodem procházím zapadlými uličkami [target.GetCurrentLocation.GetName],"
 murder_outcome_reworked.0012.desc.wilderness: "Se svým doprovodem cestuji divočinou [target.GetCurrentLocation.GetName],"
 murder_outcome_reworked.0012.desc: " když se našimi řadami rozlehne krev tuhnoucí výkřik.\n\nJako by se vynořili odnikud, vrhne se na nás banda hrdlořezů! Vzduchem létají šípy i čepele a čirá zuřivost spolu s touhou zabíjet během okamžiku zdecimují mé stráže. Nehodlám dovolit, aby se mi tahle léčka stala hrobem, a tak prchám do bezpečí. Pak se skrze hluk boje ozve jediný čistý zvuk napnuté tětivy."
 murder_outcome_reworked.0013.desc: "Náš plán vypadal... tak dokonale... připravené rozptýlení, banda zoufalých lapků a náhlý přepad. Tohle #EMP měl#! být konec postavy [target.GetFirstNameNoTooltip], jenže její zatracení strážci se vrhali před každou ránu, šipku i čepel, dokázali se semknout a přešli do protiútoku. Naši žoldáci padali po desítkách."
 murder_outcome_reworked.0014.desc: " když se našimi řadami rozlehne krev tuhnoucí výkřik.\n\nJako by se vynořili odnikud, vrhne se na nás banda hrdlořezů! Jejich útok je zuřivý, ale zuřivosti mých stráží se nevyrovná, a tak jim vyrážíme vstříc. Rozpoutá se nelítostná řež a hrdlořezové jdou #EMP očividně#! především po mně. Jen hlupák by nepoznal, že jde o pokus o vraždu."
 murder_outcome_reworked.0021.desc: "Položit základy mého plánu trvalo celé týdny: otrávený pokrm hodný tak významné osobnosti, jako je [target.GetWomanMan]. Jako vždy se [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'ukázala být příliš hloupá', 'ukázal být příliš hloupý')], než aby přes záplavu exotických bylin ucítila jed v kachně. Smrtící hořkosti si očividně [Select_CString(target.IsFemale, 'všimla', 'všiml')] až ve chvíli, kdy už bylo dávno, dávno pozdě."
 murder_outcome_reworked.0022.desc: "Na hostině si právě vychutnávám obzvlášť znamenitou pečenou kachnu, když... co je to za podivnou hořkost v dochuti? Ten hlupák kuchař musel —\n\nHrdlo mi otéká. V krku cosi těžce praskne a do hlavy mi udeří tepající bolest, která se přes čelo převalí jako běsnící bouře. Proč... proč se mi všechno před očima kalí a tmavne? Kdesi v dálce se smích mění ve zděšený výkřik. Nedokážu se soustředit, #DIE1 nedokážu myslet#!, #DIE2 nedokážu...#!"
 murder_outcome_reworked.0023.desc: "#EMP Hlupáku!#! Jak je možné, že se vždycky najde někdo, kdo dokáže zkazit i ten nejdokonalejší plán?!\n\nKachna byla připravená k podávání, pach jedu mistrně překrytý záplavou voňavých bylin a mlčení kuchařů štědře zaplacené... A přesto si někdo ze služebnictva #EMP prostě musel#! tajně ochutnat a vzápětí se svalit mrtvý přímo před [target.GetFirstNameNoTooltip]!"
 murder_outcome_reworked.0024.desc: "Právě se chystám zakousnout do nejšťavnatějšího kousku kachny, jaký jsem kdy viděl, když se jeden z mých sluhů náhle zhroutí, padne tváří přímo na stůl a začne se chytat za hrdlo. Tajně si ochutnával z mého jídla!\n\nAlespoň mě včas varoval, abych se kachny ani nedotkl, a zároveň dostal zasloužený trest za svůj prohřešek."
 murder_outcome_reworked.0031.desc: "Plán vyšel dokonale. Mé drahocenné překvapení — [SCOPE.Custom('VenomousCreature')] — už čekalo na [target.GetFirstNameNoTooltip] v posteli, když se [Select_CString(target.IsFemale, 'odebrala', 'odebral')] na noc spát, tiše a připravené zaútočit při sebemenším vyrušení. A pak se [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'pohnula', 'pohnul')]."
 murder_outcome_reworked.0033.desc: "Plán měl být naprosto neprůstřelný: [SCOPE.Custom('VenomousCreature')] čekalo na [target.GetFirstNameNoTooltip] v posteli, když se [Select_CString(target.IsFemale, 'odebrala', 'odebral')] na noc spát. Stačilo si jen lehnout a nechat malou potvoru udělat svou práci! Jenže [target.GetFirstNameNoTooltip] si [Select_CString(target.IsFemale, 'všimla', 'všiml')] podezřelého pohybu pod přikrývkou. [target.Custom2('InsultNoun', ROOT.Char)]! Než mohl [SCOPE.Custom('VenomousCreatureType')] zaútočit, bylo po něm."
 murder_outcome_reworked.0034.desc: "Když se ukládám na noc, zaujme mě podezřelý pohyb pod přikrývkou. Opatrně ji odhrnu, abych případného nezvaného hosta nevyplašil, a tam na mě čeká [SCOPE.Custom('VenomousCreatureType')]!\n\n"
 murder_outcome_reworked.0034.desc_unknown: "Nedokážu přesně určit, co je ta malá potvora zač, ale přátelsky rozhodně nevypadá."
 murder_outcome_reworked.0034.desc_end: "Ani na okamžik nezaváhám, popadnu dýku a jediným bodnutím vetřelce přišpendlím k lůžku."
 murder_outcome_reworked.0041.desc: "Na [target.GetFirstNameNoTooltip] čekal při cestě městem rozzuřený dav sedláků.\n\nPouhý pohled na to, jak kolem bezstarostně projíždí [target.GetLadyLord], stačil, aby dav propukl ve vražedné násilí. Hrstka stráží doprovázejících svou vrchnost neměla proti slepé zuřivosti krvežíznivého davu žádnou šanci. [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'byla ušlapána, zbita a pobodána', 'byl ušlapán, zbit a pobodán')] k nepoznání — a bez nejmenší naděje na přežití."
 murder_outcome_reworked.0042.desc: "Při jízdě městem jsem tak zabraný do vlastních myšlenek, že nevěnuji pozornost nervóznímu mumlání svých stráží ani stále většímu davu, který nám blokuje cestu. Když si ho konečně všimnu, je už pozdě.\n\nRozzuření sedláci nás obklopí, strhnou z koní a začnou nás nemilosrdně bít. Rány na mě dopadají jedna za druhou, tolik, že je nelze počítat. Zrak mi zalije krev a potom všechno zčerná."
 murder_outcome_reworked.0043.desc: "Všechno šlo tak dobře. Mým štváčům se podařilo shromáždit dav sedláků a pořádně je poštvat proti [target.GetFirstNameNoTooltip].\n\nJenže když se [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'objevila', 'objevil')] obklopený ozbrojenými strážemi, touha davu po krvi roztála jako sníh na slunci! Zaútočilo jen pár největších zoufalců a vojáci s nimi rychle skoncovali."
 murder_outcome_reworked.0044.desc: "Projíždím městem se svým doprovodem a nelze si nevšimnout davu, který nás ze všech stran stále těsněji obkličuje.\n\nNaštěstí jsem se dnes ráno rozhodl vyrazit s početnou skupinou dobře vyzbrojených vojáků a už samotný pohled na ně úžasně ochladí rozhořčení davu. Když se nás pokusí napadnout hrstka vztekle vyhlížejících sedláků, mé stráže je snadno pobijí a zbytek chátry rozeženou."
 murder_outcome_reworked.0051.desc: "Plán byl elegantní ve své jednoduchosti. Pozval jsem [target.GetFirstNameNoTooltip] na skleničku s vědomím, že jakmile začne pít, nepřestane, dokud se neopije do němoty. Pak mě ten hlupák bez odporu následoval do sklepa a okamžitě usnul. Ani se nepohnul, když mí sluhové vyzdili zeď a uzavřeli jediný vchod do místnosti. #EMP Navždy.#!"
 murder_outcome_reworked.0053.desc: "Všechno šlo podle plánu. Pozval jsem [target.GetFirstNameNoTooltip] na skleničku s vědomím, že jakmile začne pít, nepřestane, dokud se neopije do němoty. Pak mě ten hlupák bez odporu následoval do sklepa a okamžitě usnul. Mí sluhové měli jen vyzdít zeď a zavřít oběť uvnitř, jenže byli zřejmě #EMP příliš unavení#! a práci nedokončili, takže [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'dokázala uniknout', 'dokázal uniknout')]!"
 murder_outcome_reworked.0061.desc: "Lodě se potápějí pořád. Takový je život. Někdy se jim k tomu #EMP trochu pomůže#!, právě když jsou o kousek dál od pobřeží, než by bylo zdrávo. Říká se, že chladné objetí otevřeného moře člověka pořádně zaskočí. [target.GetFirstNameNoTooltip] by mi o tom [Select_CString(target.IsFemale, 'mohla vyprávět, kdyby se neutopila', 'mohl vyprávět, kdyby se neutopil')]. Skutečná #EMP tragédie#!."
 murder_outcome_reworked.0062.desc_port: "Jsem na palubě místní lodi při krátké inspekční plavbě. Pobřeží je stále na dohled a mou mysl zcela zaměstnává nějaké hlášení, takže náhlého praskotu a křiku námořníků si téměř nevšimnu."
 murder_outcome_reworked.0062.desc_travel: "Miluji otevřené moře! Slunce mě hladí po tváři, vítr si pohrává s pláštěm, v nose mě šimrá svěží vůně slané vody, odkudsi se ozývá děsivé praskání doprovázené zběsilým křikem námořníků— Počkat, #EMP COŽE#!?!"
 murder_outcome_reworked.0062.desc: "\n\nNemám ani čas zareagovat. Zlomený stěžeň se na mě zřítí, vyrazí mi všechen vzduch z plic a smete mě přes palubu. Náraz do ledové vody dokoná zbytek, zatímco mě těžké šaty táhnou dolů... pod hladinu..."
 murder_outcome_reworked.0063.desc: "Lodě se potápějí pořád. Takový je život. Nebo by se alespoň #EMP potápět měly#!! Jak těžké může být sabotovat kus plovoucího harampádí tak, aby skončil pod hladinou i s [target.GetFirstNameNoTooltip]?!\n\nPro mé spolčence očividně příliš těžké. [target.GetFirstNamePossessiveNoTooltip] loď se bezpečně vrátila jen s drobnou nepříjemností cestou. S drobnou, očividně naaranžovanou a potenciálně smrtící nepříjemností."
 murder_outcome_reworked.0064.desc: "Má loď pokojně pluje v paprscích zapadajícího slunce, když mou pozornost upoutá praskot a zběsilý křik námořníků. Vzápětí mě jeden ze strážců strhne stranou právě ve chvíli, kdy se část stěžně zřítí a zastaví přesně tam, kde jsem ještě před okamžikem stál.\n\nPoškození lodi je značné, ale kapitán je přesvědčený, že bezpečně doplujeme do nejbližšího přístavu. A co je nejdůležitější, nikomu se nic nestalo."
 murder_outcome_reworked.0071.desc: "Mým spolčencům se podařilo dostat až k [target.GetFirstNamePossessiveNoTooltip] vlastnímu poháru při poslední večeři! Nepozorovaně do nápoje nakapali několik kapek silného jedu. A [target.Custom2('InsultNoun', ROOT.Char)]? [Select_CString(target.IsFemale, 'Vyprázdnila celý pohár jediným douškem a byla mrtvá dřív, než vůbec pochopila, co se děje', 'Vyprázdnil celý pohár jediným douškem a byl mrtvý dřív, než vůbec pochopil, co se děje')]!"
 murder_outcome_reworked.0073.desc: "Mým spolčencům se podařilo propašovat otrávený sud do [target.GetFirstNamePossessiveNoTooltip] kuchyně a připravit z něj plný pohár. Nápad se sudem byla chyba.\n\n[target.Custom2('InsultNoun', ROOT.Char)] ještě ani [Select_CString(target.IsFemale, 'nestačila přiložit pohár ke rtům', 'nestačil přiložit pohár ke rtům')], když do místnosti vtrhlo služebnictvo se zprávou, že někdo jiný se napil ze stejného sudu a okamžitě zemřel."
 murder_outcome_reworked.0074.desc: "Vychutnávám si večeři během večera jako každého jiného. Přede mnou stojí lákavý pohár naplněný až po okraj. Když po něm konečně sáhnu, do místnosti vtrhne celý houf křičícího služebnictva. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], stůjte! Je otrávený! Jeden z nás pil ze stejného sudu a okamžitě padl mrtvý!“ Ruka mi zůstane viset ve vzduchu."
 murder_outcome_reworked.4001.desc: "[target.GetTitledFirstName] se na výlet do lesa tolik [Select_CString(target.IsFemale, 'těšila', 'těšil')]! Jenže každý ví, že les není místo pro děti – tak mladé, tak #EMP naivní#!. Stačí, aby se nechaly strhnout nadšením, ztratily přehled o okolí, své opatrovníky i cestu domů. A už se nikdy nevrátí. Stejně jako [target.GetFirstNameNoTooltip]. Jaká tragédie."
 murder_outcome_reworked.4003.desc: "Mělo to být tak snadné! Les není místo pro děti: tma, nebezpečí, rokle, jedovaté rostliny a šelmy lačnící po mase! Jak těžké může být, aby se dítě prostě ztratilo a zemřelo?!\n\nPro [target.GetFirstNameNoTooltip] to bylo očividně příliš těžké. Ten malý spratek měl totiž tu #EMP drzost#! najít cestu domů živý a zdravý!"
 murder_outcome_reworked.4011.desc: "Děti jsou tak křehká stvoření... Rodině je může vzít jakákoli nemoc. Nebo nehoda! Třeba taková, při níž se setká křehká dětská hlavička s ostrou jehlou – podrobnosti jsem nepotřeboval ani nechtěl slyšet, hlavně že byla práce hotová. Tak příšerné, taková #EMP hanba#!."
 murder_outcome_reworked.4013.desc: "Když jde o děti, lidé mají tolik zábran. Všichni mí spolčenci souhlasili, že [target.GetFirstNameNoTooltip] musí zemřít, za vykonání práce dostali štědře zaplaceno, a přesto při pouhém pohledu na pokojně spící nemluvně zaváhali! Přitom to bylo tak snadné – jediné ostré bodnutí do nejměkčího místa na hlavě a byl by konec... Tak promarněná příležitost."
 murder_outcome_reworked.4021.desc: "Lidé jsou zvláštní. Těžko najít někoho ochotného vztáhnout ruku na nemluvně, ale položit do kolébky [SCOPE.Custom('VenomousCreature')] je očividně mnohem přijatelnější. A [SCOPE.Custom('VenomousCreatureType')] žádné podobné zábrany neměl a zaútočil přesně, jak měl. Jed pak odvedl svou práci rychle a nemilosrdně."
 murder_outcome_reworked.4023.desc: "Jak bylo naplánováno, do postýlky postavy [target.GetFirstNameNoTooltip] jsme nastražili [SCOPE.Custom('VenomousCreature')]. Pohyb nemluvněte však tvora očividně vyplašil natolik, že se místo útoku schoval. O několik hodin později tu neužitečnou potvoru našel sluha pod skříní. A to zatracené dítě vyvázlo bez jediného škrábnutí."
 murder_outcome_reworked.4024.desc: "Pode mnou je měkká postýlka a hřeje mě teplá přikrývka. Už skoro spím, když matně ucítím něco zvláštního, jako by mi cosi lezlo po těle. Prudce se otočím na bok a ten pocit zmizí. Usnu.\n\nPozději mě probudí pronikavý křik služebnictva. Nevím, co se děje. Všude pobíhají dospělí, jejich silné hlasy duní místností a mnozí ukazují na něco pod skříní, kam nevidím."
 murder_outcome_reworked.4031.desc: "Děti jsou tak důvěřivé! Stačilo jednoho ze svých spolčenců převléct za sluhu, poslat ho za [target.GetFirstNameNoTooltip] s kusem nádherně vypadajícího a samozřejmě otráveného koláče – a ten malý hlupák ho bez jediné otázky spolkl na jedno obrovské sousto!\n\nMožná bychom měli děti začít učit, že si od cizích lidí nemají brát sladkosti..."
 murder_outcome_reworked.4033.desc: "Prokleté děti a jejich nevypočitatelnost! Mělo to být tak snadné: podstrčit [target.GetFirstNameNoTooltip] neodolatelnou otrávenou dobrotu a [target.GetFirstNameNoTooltip] zemře. Co je to vůbec za dítě, které na nabídnutou #EMP dobrotu#! odpoví „Nemám hlad“?!"
 murder_outcome_reworked.4034.desc: "Hraji si venku a mám trochu žízeň, když se odnikud objeví sluha a nabízí mi [ROOT.Char.Custom('FavoriteTreat')]. Jenže já nechci [ROOT.Char.Custom('FavoriteTreat')], já chci pít! Hloupý sluha!\n\nO pár hodin později už jsem na celou příhodu dávno zapomněl, když za mnou přijde několik sluhů a začnou mi gratulovat, jak jsem byl chytrý a statečný a překazil nějaký zlý plán nebo co. To je jedno. Teď bych ale [ROOT.Char.Custom('FavoriteTreat')] docela chtěl!"
 murder_outcome_reworked.4041.desc: "Jednou padne všechno: království, [ROOT.Char.Custom('LadiesLords')], #EMP děti svržené z výšky#!...\n\nTaková nevyhnutelná tragédie."
 murder_outcome_reworked.4043.desc: "Když můj spolčenec shodil [target.GetTitledFirstName] přes okraj, šaty se zachytily o výčnělek ve zdi těsně pod ním. Udržely dítě dost dlouho, aby přispěchala pomoc a zachránila nejen je, ale i"
 murder_outcome_reworked.7001.desc: "Jedna věc je v životě jistá - žalářníky zajímá hlavně to, kdo smí z jejich vězení ven. Kdo se dostane dovnitř a co se tam s vězni děje, je jim téměř lhostejné.\n\nKdyž jim mí spolčenci nabídli štědrý úplatek za možnost navštívit svého #EMP dobrého přítele#! [target.GetFirstNameNoTooltip], přijali ho až příliš ochotně. Přeslechnout křik a praskání kostí už bylo zkrátka součástí služby."
 murder_outcome_reworked.7003.desc: "$murder_outcome_reworked.7001.desc$ Tak proč se do toho museli vložit dřív, než byla práce hotová?!"
 murder_outcome_reworked.7004.desc: "$murder_outcome.5001.beat_to_death_in_dungeon$ Pak dovnitř vtrhnou mí obvyklí žalářníci a bití ustane."
 murder_outcome_reworked.7011.desc: "Vězni v domácím vězení mají být pod bedlivým dohledem. Propašovat tedy svého spolčence do domu, kde žije [target.GetFirstNameNoTooltip], pod záminkou návštěvy starého přítele byl, dovolím-li si to říct, skutečně geniální tah! Všechno proběhlo tak rychle, že stráže pochopily, že je něco v nepořádku, až když už bylo po všem."
 murder_outcome_reworked.7012.desc: "Mé stráže mi do pokoje přivedou neznámou zahalenou postavu a představí ji jako mého starého přítele. Už se chystám namítnout, že muselo dojít k omylu, protože toho člověka očividně vůbec neznám, když se ze skryté kapsy zaleskne dýka. #EMP Aha.#! Jeden z #EMP těchhle#! starých přátel.\n\nNemám čas ani zareagovat. Dýka po mně vyrazí rychleji než šíp a já se bez jediného zvuku zhroutím k zemi."
 murder_outcome_reworked.7013.desc: "Vězni v domácím vězení mají být pod bedlivým dohledem. Propašovat tedy svého spolčence do domu, kde žije [target.GetFirstNameNoTooltip], pod záminkou návštěvy starého přítele měl být skutečně geniální tah! Bohužel stráže celé historce příliš nevěřily a čekaly hned za dveřmi, připravené zasáhnout při sebemenším podezření. Pokus o vraždu se očividně #EMP skutečně#! počítá mezi #EMP podezřelé jednání#!."
 murder_outcome_reworked.8001.desc: "[target.GetFirstNameNoTooltip] již má své dny slávy dávno za sebou. Přesto se života [Select_CString(target.IsFemale, 'držela', 'držel')] tak dlouho, tak zoufale, tak #EMP marně#!... Jednání mého spolčence podle mě nebylo ničím jiným než aktem milosrdenství. [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'byla', 'byl')] pouze prázdná schránka. Dá se tomu vůbec říkat vražda?"
 murder_outcome_reworked.8003.desc: "Je neuvěřitelné, kolik neschopnosti může jeden spolčenec předvést. Jak těžké může být uškrtit křehkého člověka, jehož mysl už dávno není přítomná a který sotva žije?! A přesto mě čeká jen neúspěch."
