l_polish:
 murder_save_header: "Zmařená vražda:"
 murder_save.failure_known_owner_tt: "[owner.GetTitledFirstNameNoTooltip]: [Select_CString(owner.IsFemale, 'pokusila se mě zavraždit, ale neuspěla', 'pokusil se mě zavraždit, ale neuspěl')]"
 murder_save.failure_unknown_owner_tt: "Něčí pokus mě zavraždit selhal"
 murder_save.used_up_guile_legacy_5_save: "Ochrana [GetDynastyPerk('guile_legacy_5').GetName] byla vyčerpána"
 murder_save.dynasty_member_used_guile_legacy_5_save: "Pokus o vraždu"
 murder_save.dynasty_member_used_guile_legacy_5_save_desc: "[target.GetTitledFirstName] [Select_CString(target.IsFemale, 'přežila', 'přežil')] pokus o vraždu díky ochraně [GetDynastyPerk('guile_legacy_5').GetName]!"
 murder_save.0001.t: "$murder_save_header$ Láska zasáhla"
 murder_save.0001.opening: "Můj pokus zabít [target.GetTitledFirstName] byl zmařen!\n\nNájemný vrah pronikl až do komnat, kde pobývá [target.GetTitleTierName], ale našel tam [target.GetTitledFirstName] ve společnosti"
 murder_save.0001.rel_to_me: " někoho, kdo patří i do mého života ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))]), totiž"
 murder_save.0001.end: " [lover.GetTitledFirstName]! A co hůř – ti dva spolu mají poměr!\n\nKdyž vrah udeřil, [lover.GetFirstName] [Select_CString(lover.IsFemale, 'zasáhla', 'zasáhl')]. Strhla se rvačka a na jejím konci leželi na podlaze mrtví oba: [lover.GetFirstName] i můj vrah."
 murder_save.0001.a: "Teď už [target.GetFirstNameNoTooltip] nikdy nezískám."
 murder_save.0001.b: "Potřebuji nový plán..."
 murder_save.1001.desc: "„Ani krok blíž!“ [lover.GetTitledFirstName] [Select_CString(lover.IsFemale, 'vykřikla a vrhla se', 'vykřikl a vrhl se')] na temnou postavu, která vstoupila do mých komnat s tasenou dýkou.\n\n[Select_CString(lover.IsFemale, 'Jaké požehnání i prokletí, že tu se mnou této noci byla.', 'Jaké požehnání i prokletí, že tu se mnou této noci byl.')] Jen ten zásah mi zachránil život. Cena je však strašlivá – [lover.GetFirstName] mi vykrvácí v náručí vedle mrtvého vraha."
 murder_save.1001.a: "Jaká zvrácená zrůda za tím stojí?"
 murder_save.1001.b: "[owner.GetTitledFirstNameNoTooltip] za tohle zaplatí!"
 murder_save.1001.c: "Lépe [lover.GetFirstNameNoTooltip] než já!"
 murder_save.0002.t: "$murder_save_header$ Láska [SCOPE.Custom('VenomousCreatureAttackPlural')|U]"
 murder_save.0002.opening: "[target.GetTitledFirstName] stále žije!\n\nV posteli, kde spává [target.GetTitleTierName], bylo nastraženo [SCOPE.Custom('VenomousCreature')], jenže zaútočilo na špatnou oběť! Místo zamýšleného cíle zemřel někdo jiný:"
 murder_save.0002.rel_to_me: " někdo, kdo patří i do mého života ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))]), totiž"
 murder_save.0002.end: " [lover.GetTitledFirstName]! A právě tihle dva spolu měli poměr!"
 murder_save.1002.desc: "„Vrať se ke mně do postele, [lover.Custom('LoverPetName')]...“\n\nPrávě se chystám pozvání přijmout, když [lover.GetFirstName] začne křičet. „Co se děje?!“ Odpověď se objeví sama, když se mezi zmítajícími přikrývkami ukáže [SCOPE.Custom('VenomousCreatureType')].\n\nNež dorazí lékař, [lover.GetFirstName] už nehybně leží, tělo tuhne a chladne. Mrazí i mě. To [SCOPE.Custom('VenomousCreatureType')] bylo určeno mně."
 murder_save.0003.t: "$murder_save_header$ Nájemný vrah"
 murder_save.0003.desc: "[target.GetTitledFirstName] stále žije!\n\nMůj vrah pronikl až do komnat, kde pobývá [target.GetTitleTierName], ale ze všech lidí se mu do cesty postaví právě [broken_person.GetTitledFirstName] – člověk, kterého [target.GetFirstName] neustále trýzní! A přesto [broken_person.GetFirstName] [Select_CString(broken_person.IsFemale, 'položila', 'položil')] život, aby [target.GetFirstName] [Select_CString(target.IsFemale, 'přežila', 'přežil')]. Můj vrah je mrtvý také, zatímco [target.GetFirstName] odchází po svých."
 murder_save.0003.a: "V jak nespravedlivém světě to žijeme."
 murder_save.0003.b: "Musím přijít s novým plánem!"
 murder_save.1003.desc: "[broken_person.GetTitledFirstName] se snaží nedat na sobě nic znát, zatímco se ke mně vrah blíží.\n\n„Tak přivést vraha až do mých komnat, [broken_person.GetFirstNameNoTooltip]? Po tom všem křiku o věčné věrnosti?“ [broken_person.GetFirstName] těká pohledem mezi mnou a zbraní v ruce vraha. „Jak strašné zklamání. Přece nechceš být zklamáním, že ne?“\n\nV očích se cosi změní. [broken_person.GetFirstName] s výkřikem skočí po vrahovi. Když zápas skončí, oba leží mrtví na podlaze."
 murder_save.1003.a: "Považuj to za zasloužený trest, [broken_person.GetFirstNameNoTooltip]."
 murder_save.0004.t: "$murder_save_header$ Přepadení"
 murder_save.0004.desc: "[target.GetTitledFirstName] stále žije!\n\nMoji najatí hrdlořezové podle plánu přepadli průvod, s nímž cestuje [target.GetTitledFirstName], ale nedokázali ho přemoci! [target.GetFirstName] by možná [Select_CString(target.IsFemale, 'padla', 'padl')] do jejich rukou, nebýt toho zuřivého, třikrát prokletého válečného oře, na kterého tak nedá dopustit!"
 murder_save_failure_warhorse_tt: "[target.GetFirstNameNoTooltip] přichází o svého válečného koně, který podléhá zraněním"
 murder_save.1004.opening: "Cestuji se svým doprovodem, když se z nedalekého hájku ozve výkřik. „Útok! Tam je [ROOT.Char.GetTitleTierName]!“ Přepadení!\n\nTo nejsou obyčejní lupiči, kterým jde o mé zlato – tihle hrdlořezové jdou po mém životě! Jenže [ROOT.Char.Custom('HorseStoryMareStallion')] po mém boku ví, co dělat! [ROOT.Char.Custom('HorseStorySheHe')|U] se vzepne a kope kolem sebe, aby mě uchránil před svištícími čepelemi, zatímco se mé stráže vzpamatují a vrhnou do boje."
 murder_save.1004.warhorse_dies: "\n\nTeprve když boj utichne, [ROOT.Char.Custom('WarhorseStoryName')] se pode mnou podlomí a já spatřím [ROOT.Char.Custom('HorseStoryHerHis')] hluboká zranění. [ROOT.Char.Custom('HorseStorySheHe')|U] mě skutečně neopouští až do poslední chvíle..."
 murder_save.1004.a: "Tihle hrdlořezové někomu slouží. Ale komu?"
 murder_save.1004.b: "Je naprosto jasné, kdo za tím stojí!"
 murder_save.1004.c: "Zjistím, kdo to udělal!"
 murder_save.1004.d: "[Select_CString(owner.IsFemale, 'Připravila jsi mě o zatraceně dobrého koně', 'Připravil jsi mě o zatraceně dobrého koně')], [owner.GetFirstNameNoTooltip]!"
 murder_save_warhorse_dies_to_thugs: "#F [THIS.Char.Custom('WarhorseStoryName')] umírá na [THIS.Char.Custom('HorseStoryHerHis')] zranění#!"
 murder_save.0005.t: "$murder_save_header$ Poplach"
 murder_save.0005.desc: "Skupina spiklenců se dostala až k cele. [target.GetTitledFirstName] je uvnitř – a spustí tak příšerný rámus, že by probudil celý hrad. Podplatit žalářníka je jedna věc, ale předstírat, že se nic neděje, když jsou všichni na nohou, je něco docela jiného!\n\nMoji vrazi se dávají na překotný ústup a [target.GetFirstName] zůstává v bezpečí..."
 murder_save.1005.desc: "Nevím, kdo jsou ty zahalené postavy, které se náhle objevily v mé cele, ale jedno vím jistě: přišly mi ublížit. S mým obráncem však nepočítaly.\n\n„Na ně!“ vykřiknu a [ROOT.Char.Custom('prison_pet')] se na ně vrhne, připraven bojovat za můj život! Proti takovému ochránci nemají šanci. Začnu hulákat a povzbuzovat a vetřelci nakonec v čiré hrůze prchnou!\n\nZanedlouho přijde žalářník a umlčí mě výpraskem, ale co na tom – pořád dýchám."
 murder_save.1005.a: "Vděčím ti za život, [ROOT.Char.Custom('prison_pet')]."
 murder_save.1005.b: "Tvá oběť nebyla marná, [ROOT.Char.Custom('prison_pet')]!"
 murder_save.0006.t: "$murder_save_header$ Strážci"
 murder_save.0006.opening: "Moji „najatí pomocníci“ podle plánu přepadli [target.GetTitledFirstName], jenže v mém plánu chyběla jedna maličkost: osobní stráž, kterou"
 murder_save.0006.spouse: "[Select_CString(spouse.IsFemale, 'nechala', 'nechal')] zřídit [spouse.GetTitledFirstName]."
 murder_save.0006.no_spouse: "nechala zřídit choť mé oběti."
 murder_save.0006.end: "\n\nTi strážci bojovali zatraceně statečně a, k mé nechuti, ještě zatraceně lépe – tak dobře, že [target.GetFirstName] stále žije a dočká se dalšího rána."
 murder_save.1006.opening: "Během cesty můj doprovod přepadla banda hrdlořezů! Naštěstí tu byla osobní stráž, za jejíž zřízení vděčím"
 murder_save.1006.spouse: "[spouse.GetTitledFirstName]."
 murder_save.1006.no_spouse: "své choti."
 murder_save.1006.end: "Strážci bojovali statečně a útok odrazili.\n\nKdyž se bili až do posledních sil, začalo být jasné, že těm banditům nejde o zlato, ale o můj život! Nakonec je zahnali, ale má osobní stráž za to málem zaplatila do posledního muže."
 murder_save.0007.t: "$murder_save_header$ Chlupatý strážce"
 murder_save.0007.desc: "[target.GetTitledFirstName] stále žije!\n\n[target.GetTitleTierNamePossessive] pokoj se měl stát místem smrti. V posteli čekala smrtící nástraha: [SCOPE.Custom('VenomousCreature')]. Jenže než mohla udeřit, [target.GetTitleTierNamePossessive] kočičí mazlíček ztropil povyk a pustil se s tvorem do boje!"
 murder_save_failure_cat_tt: "[target.GetFirstNamePossessiveNoTooltip] kočičí mazlíček podlehne svým zraněním"
 murder_save.1007.opening: "Jakmile vstoupím do své komnaty, okamžitě poznám, že má drahá kočka [THIS.Char.Custom('CatStoryName')] je celá nesvá – [THIS.Char.Custom('CatStorySheHe')] neklidně přechází před mou postelí. Jako [THIS.Char.Custom('CatFurColor')] blesk se [THIS.Char.Custom('CatStorySheHe')] náhle vrhne vpřed a rázem je jasno, co se skrývá mezi přikrývkami: [SCOPE.Custom('VenomousCreatureType')]!"
 murder_save.1007.cat_dies: "\n\nStrašlivý tvor se nevzdává snadno. Když se mu [THIS.Char.Custom('CatStoryName')] konečně zakousne do krku, [THIS.Char.Custom('CatStorySheHe')] [THIS.Char.Custom('CatStoryHerselfHimself')] už nepřežije."
 murder_save.1007.a: "Vděčím ti za život, [THIS.Char.Custom('CatStoryName')]!"
 murder_save.1007.b: "Je mi naprosto jasné, kdo za tím stojí!"
 murder_save.1007.c: "Zjistím, kdo to udělal!"
 murder_save.1007.d: "Za tohle zaplatíš, [owner.GetFirstNameNoTooltip]!"
 murder_save_creepy_crawlies_cat_dies: "[THIS.Char.Custom('CatStoryName')] umírá na [THIS.Char.Custom('CatStoryHerHis')] zranění"
 murder_save.0008.t: "$murder_save_header$ Chlupatý strážce"
 murder_save.0008.desc: "Můj pokus ukončit [target.GetTitledFirstNamePossessive] život byl zmařen!\n\n[target.GetTitleTierNamePossessive] pokoj se měl stát místem vraždy. Nájemný vrah pronikl až dovnitř, jenže než stačil udeřit, ozval se štěkot! [target.GetTitleTierNamePossessive] pes, na kterého [target.GetTitledFirstName] tak zatraceně nedá dopustit, vraha rychle zahnal."
 murder_save.1008.desc: "Jakmile vstoupím do svých komnat, můj drahý pes [ROOT.Char.Custom('DogStoryName')] začne štěkat a vzápětí se vrhne na temný stín... Stín zavrávorá! [ROOT.Char.Custom('DogStoryName')] se pustí za prchajícím vrahem a pronásleduje ho, dokud [ROOT.Char.Custom('DogStoryHerHim')] nepřivolám zpět k sobě."
 murder_save.1008.a: "Vděčím ti za život, [ROOT.Char.Custom('DogStoryName')]!"
 murder_save.0009.t: "$murder_save_header$ Rodové vazby"
 murder_save.0009.desc: "V posledních okamžicích mého spiknutí proti [target.GetTitledFirstName] se všechno zhroutilo!\n\nCelé mé spiknutí měli zřejmě od začátku pod dohledem stoupenci dynastie [target.GetDynasty.GetBaseName]. V osudnou noc zasáhli a ostatní spiklence zastavili ještě dřív, než se plán vůbec podařilo uvést do pohybu!"
 murder_save.0009.a: "Musím zmizet, než se pustí do odvety!"
 murder_save.0009.b: "Co se rozpadlo, mohu znovu vystavět."
 murder_save.targets_guile_legacy_save_used_up: "[target.GetShortUIName|U] už ochranu [GetDynastyPerk( 'guile_legacy_5' ).GetName] znovu využít nemůže"
 murder_save.1009.opening: "Pokus o můj život byl zmařen!"
 murder_save.1009.owner_discovered: "\n\nZa vším stojí [owner.GetTitledFirstName]. Plán byl pečlivý, ale s jedním nepočítal: do spiknutí pronikli stoupenci rodu [target.GetHouse.GetNameNoTooltip]!"
 murder_save.1009.owner_not_discovered: "\n\nAť už tento odporný plán zosnoval kdokoli, nepočítal s tím, že do spiknutí proniknou lidé neochvějně věrní rodu [target.GetHouse.GetNameNoTooltip]!"
 murder_save.1009.end: "\n\nSpiknutí se rozsypalo právě ve chvíli, kdy mělo být uvedeno do pohybu, a můj život je stále v bezpečí."
 murder_save.1009.a: "Mé vlastní jméno mi zachránilo život!"
 murder_save.0010.t: "$murder_save_header$ Varjagové"
 murder_save.0010.desc: "Můj pokus připravit [target.GetTitledFirstName] o život byl zmařen!\n\nNájemného vraha zastavil jeden z těch otravných Varjagů! Zdá se, že [target.GetTitleAsNameNoTooltip] nakonec přece jen má stráž, která za něco stojí..."
 murder_save.0010.varangian_dies: "\n\nAlespoň si vrah poradil se strážcem. [varangian.GetTitledFirstName] už se mi do cesty nepostaví."
 murder_save.0010.a: "Teď už [target.GetFirstNameNoTooltip] nikdy nedostanu!"
 murder_save.0010.b: "Potřebuji nový plán..."
 murder_save.1010.desc: "Někdo se mě pokusil zavraždit! Naštěstí byl [varangian.GetFirstName], sloužící v mé varjažské gardě, právě před dveřmi mých komnat a okamžitě zasáhl. S vrahem si rychle poradil dřív, než mi mohl zkřivit jediný vlas."
 murder_save.1010.varangian_dies: "Bohužel však [varangian.GetFirstNameNoTooltip] při zásahu utrpí smrtelná zranění."
 murder_save.1010.owner_discovered: "\n\nNení nejmenších pochyb, že za tím vším stojí [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 murder_save.1010.a: "Kdo mohl zosnovat tak podlý útok?"
 murder_save.1010.b: "[owner.GetTitledFirstNameNoTooltip] za tohle zaplatí!"
 murder_save.0011.t: "$murder_save_header$ Hladová kočka"
 murder_save.0011.desc: "Můj pokus připravit [target.GetTitledFirstName] o život byl zmařen!\n\nJed, kachna, hostina... Všechno šlo přesně podle plánu, dokud se [Select_CString(target.IsFemale, 'její kočka', 'jeho kočka')] nepřikradla k talíři a neukradla sousto dřív, než se ho [target.GetTitledFirstName] vůbec dotkl. Pohled na kočku svíjející se v bolestech až do posledního dechu pak mé oběti jaksi vzal chuť do jídla."
 murder_save_poison_cat_tt: "[target.GetFirstNameNoTooltip] přichází o kočku, která umírá na otravu"
 murder_save.1011.desc: "Když usedám k jídlu, [ROOT.Char.Custom('CatStoryName')] mi vyskočí na klín a začne packou dorážet na talíř. Jedno sousto nakonec zmizí v kočičí tlamě a [ROOT.Char.Custom('CatStoryName')] zase seskočí na zem.\n\nPrávě se chystám pustit do jídla, když mě vyděsí hlasité, bolestné mňoukání. [ROOT.Char.Custom('CatStoryName')] se svíjí na podlaze a nářek postupně slábne, až se tělo přestane hýbat. To jídlo bylo otrávené?!"
 murder_save_poison_cat_dies: "[THIS.Char.Custom('CatStoryName')] tě zachránil před jedem, ale sám otravu nepřežil"
 murder_save.0012.t: "$murder_save_header$ Hladový pes"
 murder_save.0012.desc: "[target.GetTitledFirstName] stále žije!\n\nJed, kachna, hostina... Všechno šlo přesně podle plánu, dokud si pes nevyžebral sousto z talíře dřív, než se [target.GetTitledFirstName] stačil pustit do jídla. Pohled na psa svíjejícího se v bolestech až do posledního dechu pak mé oběti jaksi vzal chuť pokračovat v hostině."
 murder_save_poison_dog_tt: "[target.GetFirstNameNoTooltip] přichází o psa, který umírá na otravu"
 murder_save.1012.desc: "Když usedám k jídlu, [ROOT.Char.Custom('DogStoryName')] mě sleduje tím nejžadonivějším pohledem. Nenápadně nechám jedno sousto sklouznout z talíře na podlahu.\n\nPrávě se chystám pustit do jídla, když se ozve hlasité, bolestné zakňučení. [ROOT.Char.Custom('DogStoryName')] se svíjí na podlaze a žalostné kňučení postupně slábne, až se tělo přestane hýbat. To jídlo bylo otrávené?!"
 murder_save_poison_dog_dies: "[THIS.Char.Custom('DogStoryName')] tě zachránil před jedem, ale sám otravu nepřežil"
 murder_save.0013.t: "$murder_save_header$ Vytříbený čich"
 murder_save.0013.desc: "[target.GetTitledFirstName] stále žije!\n\nJed, [target.Custom('GetExpensiveMeal')]... Všechno šlo podle plánu, dokud mou oběť nezarazilo, že něco není v pořádku. Otrávili jsme právě oblíbený pokrm, jenže jeho vůně byla jiná než obvykle. [target.GetTitledFirstName] si toho okamžitě všimne a jídlo nechá odnést."
 murder_save.1013.desc: "S chutí se pouštím do své oblíbené večeře, když mě zarazí podivná vůně. Pod známým aroma se skrývá nakyslý pach, koření není ve správné rovnováze... Kuchař přísahá, že všechno připravil jako vždy. V hlavě mi zůstává jediná myšlenka: někdo se mě pokusil otrávit!"
 murder_save.0014.t: "$murder_save_header$ Osudné porozumění"
 murder_save.0014.desc: "Můj pokus připravit [target.GetTitledFirstName] o život byl zmařen!\n\nUkázalo se, že ti hlupáci vůbec netušili, že [target.GetTitledFirstName] rozumí jazyku zvanému [owner.GetCulture.GetLanguage.GetNameNoTooltip]. A tak přímo před mou obětí bezstarostně žvanili o celém našem plánu."
 murder_save.1014.desc: "Jednoho večera, když se chystám ulehnout, zaslechnu dva sluhy, jak spolu mluví tlumenými hlasy. Chvíli mi trvá, než si uvědomím, že nemluví [owner.GetCulture.GetLanguage.GetNameNoTooltip], nýbrž [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]. Zjevně vůbec netuší, že jim rozumím.\n\n„Počkej, až usne. Ty budeš hlídat a já podříznu hrdlo.“\n\nRychle vyklouznu ze svých komnat a upozorním stráže, že uvnitř čekají vrazi. [ROOT.Char.GetFaith.HighGodName] při mně stojí! [owner.GetCulture.GetLanguage.GetNameNoTooltip] mi naštěstí není cizí!"
 murder_save.1014.a: "Kdo by asi poslal vrahy, jejichž řečí je [owner.GetCulture.GetLanguage.GetNameNoTooltip]?"
 murder_save.0015.t: "$murder_save_header$ Artefakt v pravý čas"
 murder_save.0015.desc: "[target.GetTitledFirstName] přežil můj pokus o vraždu! Zdá se, že našeho vraha [Select_CString(target.IsFemale, 'brutálně zabila', 'brutálně zabil')], když měl po ruce [this_artifact.GetName]."
 murder_save.1015.start_desc: "[attempted_assassin.GetFirstName|U] vystoupí ze tmy s čepelí v ruce. Zoufale se rozhlížím po něčem, co by se dalo použít jako zbraň, až mi zrak padne na nedaleký"
 murder_save.1015.blunt_artifact.desc: "$murder_save.1015.start_desc$ [this_artifact.GetName]. Popadnu jej, nejprve jím odrazím výpad nožem a pak s ním znovu a znovu třískám [attempted_assassin.GetFirstNameNoTooltip] do lebky.\n\nNakonec vyčerpáním ustoupím a upustím [SCOPE.Custom('ThisArtifactType')], který zůstane ležet na zemi potřísněný krví a kusy tkáně."
 murder_save.1015.sculpture_artifact.desc: "$murder_save.1015.start_desc$ [this_artifact.GetName]. Před [attempted_assassin.GetFirstNameNoTooltip] pomalu ustupuji a čekám na pravou chvíli. Pak na svého útočníka převrhnu [SCOPE.Custom('ThisArtifactType')].\n\n[this_artifact.GetNameNoTooltip] dopadne s odporným křupnutím a rozdrtí tělo pod sebou."
 murder_save.1015.chest_artifact.desc: "$murder_save.1015.start_desc$ [this_artifact.GetName]. Pomalu ustupuji a lákám útočníka blíž k otevřenému [SCOPE.Custom('ThisArtifactType')]. V pravou chvíli popadnu [attempted_assassin.GetFirstNameNoTooltip] za hlavu, strčím ji pod víko truhly a prudce je přibouchnu. Ozve se příšerné křupnutí drcené lebky.\n\nPro jistotu víkem praštím ještě třikrát nebo čtyřikrát, teprve pak ustoupím a nechám tělo sesunout na podlahu."
 murder_save.1015.actual_weapon_artifact.desc: "$murder_save.1015.start_desc$ [this_artifact.GetName]. Jakmile si [attempted_assassin.GetFirstNameNoTooltip] uvědomí, že jsem ozbrojen[Select_CString(ROOT.Char.IsFemale, 'á', 'ý')], vytratí se z tváře všechna barva. Se [SCOPE.Custom('ThisArtifactType')] v ruce už není těžké vraha dorazit."
 murder_save.1015.strangling_artifact.desc: "$murder_save.1015.start_desc$ [SCOPE.Custom('ThisArtifactType')]. Popadnu [this_artifact.GetName], uhnu před výpadem nožem a materiál omotám útočníkovi kolem krku.\n\nStačí jen několik krátkých okamžiků zápasu, než tělo vraha ochabne."
 murder_save.1015.small_artifact.desc: "$murder_save.1015.start_desc$ [this_artifact.GetName]. Popadnu jej, vrhnu se na útočníka a nacpu mu tu cetku hluboko do hrdla.\n\n[attempted_assassin.GetFirstNameNoTooltip] se začne dusit, upustí nůž a zhroutí se na kolena. Zoufale si drásá krk ve snaze popadnout dech. Když mi konečně přiběhnou na pomoc stráže, v duchu si poznamenám, že později budu muset někoho pověřit, aby [this_artifact.GetName] z mrtvoly vyřízl."
 murder_save.1015.throne_start.desc: "Jednoho večera přecházím sem a tam po prázdném trůnním sále, když se ze stínů vyřítí [attempted_assassin.GetFirstName] s nožem v ruce. Jen taktak se útoku vyhnu, podaří se mi však popadnout vraha zezadu za hlavu a znovu a znovu mu třískat obličejem o"
 murder_save.1015.throne_artifact.desc: "$murder_save.1015.throne_start.desc$ tvrdé dřevo [this_artifact.GetFeatureText('generic_material_wood')] mého trůnu [this_artifact.GetName]. Krev a zuby se rozstříknou po dosud neposkvrněné látce [this_artifact.GetFeatureText('generic_material_cloth')]."
 murder_save.1015.throne_special_artifact.desc: "$murder_save.1015.throne_start.desc$ legendární [this_artifact.GetName].\n\nKdyž krev potřísní trůn, napadne mě jediné: snad z něj služebnictvo dokáže ty skvrny dostat."
 new_artifact_loc: "[this_artifact.GetDesc]\n\nTento artefakt posloužil při zmaření pokusu o vraždu postavy [target.GetTitledFirstName]."
 new_artifact_loc_banner: "[this_artifact.GetDesc]\n\nNa jednom z rohů zůstala krvavá skvrna z chvíle, kdy tento artefakt posloužil při zmaření pokusu o vraždu postavy [target.GetTitledFirstName]."
 death_by_artifact: "byl zabit artefaktem"
 death_by_artifact_killer: "byl zabit artefaktem postavou [TARGET_CHARACTER.GetUIName]"
