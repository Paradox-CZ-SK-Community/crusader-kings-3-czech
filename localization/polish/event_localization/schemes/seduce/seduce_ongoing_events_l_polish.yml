l_polish:
 seduce_ongoing.success.rejection: "Bylo to příjemné, ale tím to končí."
 seduce_ongoing.failure.rejection: "Ne, ne a navždy ne, [owner.GetFirstNameNoTooltip]."
 seduce_ongoing_decline_event.tt: "Vzdáváš se této příležitosti zapůsobit na [target.GetTitledFirstName]"
 seduce_ongoing_possible_outcomes_tooltip_effect.success.desc: "Všechno jde podle plánu"
 seduce_ongoing_possible_outcomes_tooltip_effect.failure.desc: "[target.GetFirstNameNoTooltip] není [Select_CString(target.IsFemale, 'ohromena', 'ohromen')]"
 seduce_ongoing.1001.t: "Tanec"
 seduce_ongoing.1001.distant_opening: "Dorazím ke dvoru v [court_of_residence.GetNameNoTier] právě včas na tanec, který se koná v sídle [court_owner.Custom('ResidenceBuilding')|l]. Pozvánku se mi podařilo získat, protože musím vidět [target.GetTitledFirstName]."
 seduce_ongoing.1001.close_opening: "Na tanec nepřicházím jen proto, že mi jako [ROOT.Char.GetLadyLord|l] náleží sídlo [court_owner.Custom('ResidenceBuilding')|l], ale především proto, že tam chci vidět [target.GetTitledFirstName]."
 seduce_ongoing.1001.desc: "\n\n[target.GetTitledFirstName] vypadá oslnivě, a když konečně získáme chvilku o samotě, přednesu svůj návrh."
 seduce_ongoing.1001.a: "Přidáš se ke mně při příštím tanci, [target.GetLadyLord|l]?"
 seduce_ongoing.1001.a.tt: "#F Zkusíš oslovit hravou stránku [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1001.b: "Co takhle procházka zahradou, daleko od toho všeho?"
 seduce_ongoing.1001.b.tt: "#F Zkusíš oslovit přemýšlivou stránku [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1001.c: "Mohu ti nechat přinést ještě něco k jídlu?"
 seduce_ongoing.1001.c.tt: "#F Zkusíš oslovit poživačnou stránku [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1001.d: "Vidíš vůbec, jak tihle lidé „tančí“?"
 seduce_ongoing.1001.d.tt: "#F Zkusíš oslovit jízlivou stránku [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1003.opening: "Během tance v sídle [court_owner.Custom('ResidenceBuilding')|l] ke mně [Select_CString(owner.IsFemale, 'přišla', 'přišel')] [owner.GetTitledFirstName] a [Select_CString(owner.IsFemale, 'nabídla', 'nabídl')] mi svou společnost."
 seduce_ongoing.1003.dance: "\n\nKdyž jsme se spolu vířivě otáčeli po parketu, neunikli jsme mnoha pohledům a já se [Select_CString(ROOT.Char.IsFemale, 'smála', 'smál')] jako malé dítě!"
 seduce_ongoing.1003.walk: "\n\nProcházeli jsme se zahradou a povídali si o všem možném, dokud jsme si neuvědomili, že jsme oba úplně ztratili pojem o čase!"
 seduce_ongoing.1003.food: "\n\n[owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'nechala', 'nechal')] služebnictvo přinést ještě několik chodů a většinu noci jsme pak společně jedli. Bylo to vynikající!"
 seduce_ongoing.1003.mockery: "\n\nSeděli jsme spolu, tropili si žerty z ostatních hostů a dělili se o vtipy i smích. Břitký důvtip, který [owner.GetFirstNameNoTooltip] [Select_CString(owner.IsFemale, 'předvedla', 'předvedl')], na mě udělal velký dojem!"
 seduce_ongoing.1003.fallback: "\n\nNakonec jsme se bavili tak dobře, že jsme protančili téměř celou slavnost!"
 seduce_ongoing.1003.a: "To byl nádherný večer!"
 seduce_ongoing.1004.dance: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'nepochopila', 'nepochopil')], že o tanec nemám zájem, a po několika neochotných otočkách jsem [Select_CString(ROOT.Char.IsFemale, 'musela', 'musel')] požádat, aby mě konečně [Select_CString(owner.IsFemale, 'nechala', 'nechal')] jít."
 seduce_ongoing.1004.walk: "Procházka zahradou byla sice osvěžující, ale povídání, které [Select_CString(owner.IsFemale, 'vedla', 'vedl')] [owner.GetFirstNameNoTooltip], mě nesmírně nudilo.\n\nBrzy jsem se [Select_CString(ROOT.Char.IsFemale, 'omluvila', 'omluvil')] a [Select_CString(ROOT.Char.IsFemale, 'vrátila', 'vrátil')] se zpět k tanci."
 seduce_ongoing.1004.food: "Společnost [owner.GetTitledFirstName] mi sice nevadila, ale celý večer [Select_CString(owner.IsFemale, 'nechávala', 'nechával')] přinášet další a další chody. Brzy jsem [Select_CString(ROOT.Char.IsFemale, 'byla', 'byl')] úplně [Select_CString(ROOT.Char.IsFemale, 'sytá', 'sytý')], a tak jsem se [Select_CString(ROOT.Char.IsFemale, 'omluvila', 'omluvil')] a raději se [Select_CString(ROOT.Char.IsFemale, 'šla', 'šel')] bavit tancem."
 seduce_ongoing.1004.mockery: "[target.GetTitledFirstName] se usadí vedle mě a začne komentovat ostatní hosty.\n\nNejenže je to zbytečně kruté, ale také hrubé a naprosto bez špetky důvtipu."
 seduce_ongoing.1004.fallback: "[owner.GetTitledFirstName] stále navrhuje další a další způsoby, jak společně strávit slavnost, ale když je něčí společnost sama o sobě tak nesnesitelná, mnoho se zachránit nedá."
 seduce_ongoing.1004.a: "Co to mělo znamenat?"
 seduce_ongoing.1005.dance: "[target.GetTitledFirstName] a já jsme spolu vířili po parketu a přitahovali pohledy ostatních, zatímco se [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'smála', 'smál')] od srdce."
 seduce_ongoing.1005.walk: "[target.GetTitledFirstName] a já jsme se procházeli zahradami a povídali si o všem možném. Nakonec jsme si uvědomili, že jsme oba úplně ztratili pojem o čase, a když jsme se vrátili, tanec už se chýlil ke konci."
 seduce_ongoing.1005.food: "Nechám služebnictvo přinést další jídlo pro nás oba a během večera si vychutnáváme jeden lahodný chod za druhým, který kuchaři v [court_of_residence.GetNameNoTier] dokážou nabídnout. [target.GetTitledFirstName] má rozhodně slabost pro ty lepší stránky života."
 seduce_ongoing.1005.mockery: "Sedíme spolu a jeden vtip o ostatních hostech střídá druhý. [Select_CString(ROOT.Char.IsFemale, 'Nečekala', 'Nečekal')] jsem, že [target.GetTitledFirstName] ovládá umění výsměchu tak dokonale!"
 seduce_ongoing.1005.fallback: "[target.GetTitledFirstName] a já se nakonec bavíme tak dobře, že protančíme téměř celou slavnost!"
 seduce_ongoing.1005.a: "To byl ale večer!"
 seduce_ongoing.1006.dance: "Když [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'souhlasila', 'souhlasil')] s tancem, [Select_CString(ROOT.Char.IsFemale, 'myslela', 'myslel')] jsem, že mám vyhráno. Přestože si na parketu vedu obratně, zanedlouho se [target.GetTitledFirstName] vymluví a nechá mě stát samotného[Select_CString(ROOT.Char.IsFemale, 'samotnou', 'samotného')] mezi ostatními tanečníky."
 seduce_ongoing.1006.walk: "Mně se procházka zdála příjemná, ale možná bylo příliš chladno nebo jsem příliš [Select_CString(ROOT.Char.IsFemale, 'mluvila', 'mluvil')]. [target.GetTitledFirstName] se totiž brzy omluví a vrátí se k tanci, aniž by vůbec [Select_CString(target.IsFemale, 'počkala', 'počkal')], zda půjdu také.\n\nNež se vrátím, [target.GetTitledFirstName] už se výborně baví s ostatními tanečníky."
 seduce_ongoing.1006.food: "Bylo snad něco špatného na jídle, které jsem [Select_CString(ROOT.Char.IsFemale, 'nechala', 'nechal')] přinést pro [target.GetTitledFirstName]? I poté, co se [target.GetTitledFirstName] omluví a odejde, proudí z kuchyně další a další pokrmy a hromadí se přede mnou, zatímco do nich bez chuti [Select_CString(ROOT.Char.IsFemale, 'sama', 'sám')] zobu."
 seduce_ongoing.1006.mockery: "Ať se snažím sebevíc, [target.GetTitledFirstName] se mým vtipům nezasměje. Nakonec mě obviní z bezdůvodné krutosti a nechá mě sedět samotného[Select_CString(ROOT.Char.IsFemale, 'samotnou', 'samotného')]."
 seduce_ongoing.1006.fallback: "Stále navrhuji další způsoby, jak bychom spolu mohli trávit slavnost, ale [target.GetTitledFirstName] nejeví sebemenší zájem. Udělal[Select_CString(ROOT.Char.IsFemale, 'Udělala', 'Udělal')] jsem něco špatně?"
 seduce_ongoing.1006.a: "Tohle se nepovedlo."
 seduce_ongoing.successful.target: "\n\nDar sice přišel anonymně, ale [owner.GetTitledFirstName] si [Select_CString(owner.IsFemale, 'dala', 'dal')] velkou práci s tím, abych [Select_CString(ROOT.Char.IsFemale, 'pochopila', 'pochopil')], kdo za ním stojí."
 seduce_ongoing.unsuccessful.target: "\n\nDar sice přišel anonymně, ale není těžké pochopit, že za ním stojí [owner.GetTitledFirstName]..."
 seduce_ongoing.target_successful.option: "Za to si [owner.GetTitledFirstName] zaslouží mé bezvýhradné díky!"
 seduce_ongoing.target_unsuccessful.option: "Možná se najde #EMP někdo#!, komu se to bude líbit..."
 seduce_ongoing.target.opening: "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
 seduce_ongoing.successful.owner: "Moc ti děkuji za dárek – [SCOPE.Custom('SeductionGiftType')]! Sotva si vzpomínám, kdy jsem naposledy dostal něco tak nádherného!"
 seduce_ongoing.unsuccessful.owner: "Dostal se ke mně tvůj dárek – [SCOPE.Custom('SeductionGiftType')]. Nejsem si... úplně jistý, proč jsi mi poslal právě něco takového, ale rozhodně jsem si toho všiml."
 seduce_ongoing.owner_successful.option: "Pro tebe cokoli, [target.GetFirstNameNoTooltip]."
 seduce_ongoing.owner_unsuccessful.option: "Co jsem udělal špatně?"
 seduce_ongoing.1101.t: "Něco drahého"
 seduce_ongoing.1101.desc: "Dárek jistě upoutá pozornost, kterou mi věnuje [target.GetTitledFirstName], a něco krásného a očividně drahého přece musí ocenit každý."
 seduce_ongoing.gift_selection.tapestry: "Tapiserie věnovaná dynastii, k níž náleží [target.GetTitledFirstName]."
 seduce_ongoing.gift_selection.tapestry_tt: "Myslím, že [target.GetTitledFirstName] staví rodinu a dynastii nade vše"
 seduce_ongoing.gift_selection.horse: "Čistokrevného koně jistě ocení."
 seduce_ongoing.gift_selection.horse_tt: "Myslím, že [target.GetTitledFirstName] má rád pohyb a širé nebe"
 seduce_ongoing.gift_selection.tailor: "Krejčí, který se postará o dokonalý šat!"
 seduce_ongoing.gift_selection.tailor_tt: "Myslím, že [target.GetTitledFirstName] si potrpí na styl a dobrý dojem"
 seduce_ongoing.gift_selection.decline: "Možná raději ne."
 seduce_ongoing.1102.t: "Dar vlastních rukou"
 seduce_ongoing.1102.desc: "Dárek potěší každého, ale možná bych mohl vymyslet něco skutečně jedinečného, co na [target.GetTitledFirstName] opravdu zapůsobí!"
 seduce_ongoing.gift_selection.embroidery: "Výšivka s erbem domu, k němuž náleží [target.GetTitledFirstName]."
 seduce_ongoing.gift_selection.embroidery_tt: "Myslím, že [target.GetTitledFirstName] dbá na postavení své rodiny"
 seduce_ongoing.gift_selection.poem: "Objednám báseň o radostech života. Věnování ponese jméno [target.GetTitledFirstName]."
 seduce_ongoing.gift_selection.poem_tt: "Myslím, že [target.GetTitledFirstName] oceňuje tělesné radosti života, nebo přinejmenším poezii"
 seduce_ongoing.gift_selection.woodcarving: "Dřevěná řezba hradu!"
 seduce_ongoing.gift_selection.woodcarving_tt: "Myslím, že [target.GetTitledFirstName] obdivuje architekturu"
 seduce_ongoing.1103.t: "Malé, ale od srdce"
 seduce_ongoing.1103.desc: "Ne každý dárek musí okázale dávat najevo bohatství. Dobře zvolená maličkost může zapůsobit mnohem silněji. Jen co by asi ocenil [target.GetTitledFirstName]?"
 seduce_ongoing.gift_selection.jewelry: "Stříbrný medailon, který bude [target.GetTitledFirstName] nosit stále u srdce."
 seduce_ongoing.gift_selection.jewelry_tt: "Myslím, že [target.GetTitledFirstName] rád přitahuje pozornost – nebo má prostě slabost pro třpytivé věci"
 seduce_ongoing.gift_selection.stuffed_animal: "Vycpaná liška by rozhodně nebyla obyčejným darem..."
 seduce_ongoing.gift_selection.stuffed_animal_tt: "Myslím, že [target.GetTitledFirstName] oceňuje symboly moci – dokonce i moci nad samotným životem"
 seduce_ongoing.gift_selection.flower_display: "Květinová výzdoba pro zahradu v místě zvaném [court_location.GetNameNoTierNoTooltip]."
 seduce_ongoing.gift_selection.flower_display_tt: "Myslím, že [target.GetTitledFirstName] rád o něco pečuje, nebo alespoň dokáže ocenit krásu"
 seduce_ongoing.1104.t: "Něco neobvyklého"
 seduce_ongoing.1104.desc: "Drobný či velký důkaz náklonnosti si může koupit každý. Chci-li na [target.GetTitledFirstName] skutečně zapůsobit, měl bych poslat něco opravdu výjimečného"
 seduce_ongoing.gift_selection.rare_book: "Měl bych získat obzvlášť vzácnou knihu. [target.GetTitledFirstName] ji jistě ocení."
 seduce_ongoing.gift_selection.rare_book_tt: "Myslím, že [target.GetTitledFirstName] má rád vědění, nebo alespoň předměty, které je uchovávají"
 seduce_ongoing.gift_selection.handkerchief: "Kapesník s mým erbem."
 seduce_ongoing.gift_selection.handkerchief_tt: "Myslím, že [target.GetTitledFirstName] dobře využije symbol někoho mého postavení"
 seduce_ongoing.gift_selection.object: "[SCOPE.Custom('SeductionObjectIndefinite')|U], připomínka našeho prvního setkání"
 seduce_ongoing.gift_selection.object_tt: "Myslím, že [target.GetTitledFirstName] ke mně už něco cítí"
 seduce_ongoing.1201.t: "Dobře zvolený dar"
 seduce_ongoing.1201.desc: "Právě mi dorazil dárek – nádherná tapiserie s výjevy z dějin mé dynastie, lemovaná dovedně utkanými erby!"
 seduce_ongoing.1201.a: "Za to patří bezvýhradné díky!"
 seduce_ongoing.1301.t: "Podivný dar"
 seduce_ongoing.1301.desc: "Právě mi dorazila tapiserie, která má znázorňovat výjevy z dějin mé dynastie, jenže postavy vypadají podivně a nikdo nedokáže přijít na to, co se na kterém výjevu vlastně děje."
 seduce_ongoing.1301.a: "Prodat. Když nic jiného, někdo ji může použít jako přikrývku."
 seduce_ongoing.1202.opening: "Přivedli mi dobře živeného koně s vynikajícím rodokmenem! Nádherné zvíře je jako stvořené k jízdě a"
 seduce_ongoing.1202.courtier: " už jsem [Select_CString(ROOT.Char.IsFemale, 'přistihla', 'přistihl')] [courtier.GetTitledFirstName], jak si ho závistivě prohlíží."
 seduce_ongoing.1202.no_courtier: " u dvora už si získalo několik obdivovatelů."
 seduce_ongoing.1302.desc: "Dostal se ke mně kůň, kvůli němuž si musím klást otázku, co si o mně ostatní vlastně myslí. Opravdu čekají, že budu jezdit na té vyhublé staré herce?"
 seduce_ongoing.1302.a: "Co si s touhle herkou počnu? Prodat."
 seduce_ongoing.1203.desc: "Ke dvoru dorazil krejčí, jehož jediným úkolem bylo ušít mi jakékoli nové šaty, po kterých zatoužím. Teď, když je práce hotová, musím uznat, že své řemeslo opravdu ovládá!"
 seduce_ongoing.1203.a: "Vypadám skvěle!"
 seduce_ongoing.1303.desc: "Dorazil krejčí, aby mi ušil jakékoli nové šaty, po kterých zatoužím. Brzy však zděšeně zjistil, jak mě urazila už samotná představa, že by snad s mým dosavadním oděvem bylo něco v nepořádku."
 seduce_ongoing.1303.a: "Alespoň můžu prodat ty ohavné hadry, do kterých mě chtěl obléct."
 seduce_ongoing.1204.desc: "Když rozbaluji kožený balíček, téměř nemohu uvěřit vlastním očím. Svazek uvnitř musí být nejméně sto let starý, možná ještě víc, a dávné ruce jej pečlivě popsaly, vyzdobily a pozlatily."
 seduce_ongoing.1204.a: "Jaké divy se v té knize skrývají?"
 seduce_ongoing.1304.desc: "Když otevřu kožený balíček a najdu v něm zaprášený starý svazek, poněkud mě to zmate. Při listování narazím na pár hezkých ilustrací, ale samotný text ani nedokážu přečíst."
 seduce_ongoing.1304.a: "K čemu mi taková kniha bude? Prodat."
 seduce_ongoing.1205.desc: "Dostal se ke mně nádherný velký vyšívaný obraz, který v živých barvách zachycuje erb mého rodu! V mých komnatách bude dokonalou ozdobou."
 seduce_ongoing.1205.a: "Tohle mistrovské zpracování jistě zapůsobí."
 seduce_ongoing.1305.desc: "Dostal se ke mně velký vyšívaný obraz, který má údajně znázorňovat erb mého rodu. Netuším však, podle čeho umělec pracoval, protože tenhle znak rozhodně nepoznávám. Třeba se bude někomu jinému líbit víc..."
 seduce_ongoing.1305.a: "Mohlo to být pěkné, kdyby alespoň trefili správný erb..."
 seduce_ongoing.1206.desc: "Předstoupil přede mě básník, aby přednesl skladbu o radostech života věnovanou „[ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstName]!“"
 seduce_ongoing.1206.a: "Tohle je v poezii příjemný závan čerstvého vzduchu!"
 seduce_ongoing.1306.desc: "Předstoupil přede mě básník, aby přednesl dlouhou skladbu o radostech života věnovanou „[ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitledFirstName]“. Mezi radosti života tahle báseň rozhodně nepatří."
 seduce_ongoing.1207.desc: "Dostal se ke mně dřevěný model malého hradu! Každý host, který jej spatří, obdivuje množství detailů i řemeslnou zručnost."
 seduce_ongoing.1207.a: "To je ale neobvyklá věc!"
 seduce_ongoing.1307.desc: "Dostal se ke mně dřevěný model... nějaké budovy? Ach – má to být hrad! Tedy údajně."
 seduce_ongoing.1307.a: "Zajímalo by mě, jak dlouho bude hořet."
 seduce_ongoing.1208.desc: "[owner.GetTitledFirstName] mi poslal[Select_CString(owner.IsFemale, 'poslala', 'poslal')] [SCOPE.Custom('SeductionObjectIndefinite')], připomínku našeho prvního setkání."
 seduce_ongoing.1208.a: "Copak si [owner.GetTitledFirstName] myslí, že bych na něj mohl[Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] někdy zapomenout?"
 seduce_ongoing.1308.desc: "[owner.GetTitledFirstName] mi poslal[Select_CString(owner.IsFemale, 'poslala', 'poslal')] [SCOPE.Custom('SeductionObjectIndefinite')], připomínku našeho prvního setkání. Zdá se, že [owner.GetTitledFirstName] na ně vzpomíná mnohem raději než já."
 seduce_ongoing.1209.desc: "Dostal se ke mně malý medailon, nádherný kousek stříbrnické práce. Zajímá mě sice, co se ukrývá uvnitř, ale mnohem důležitější je, že ostatní budou dychtivě hádat, co by tam mohlo být."
 seduce_ongoing.1209.a: "Třeba mi ho jednou někdo pomůže otevřít?"
 seduce_ongoing.1309.desc: "Dostal se ke mně malý medailon a zprvu jsem ani nepoznal[Select_CString(ROOT.Char.IsFemale, 'nepoznala', 'nepoznal')], že ta drobná neleštěná hrouda je vlastně ze stříbra. Navíc se ani nedá otevřít, takže mi připadá naprosto k ničemu."
 seduce_ongoing.1309.a: "Proč by si někdo myslel, že o něco takového stojím?"
 seduce_ongoing.1210.desc: "Je to neobvyklé, to ano, ale na vycpané lišce přede mnou je cosi přitažlivého. Možná ten strnulý, zuřivý škleb na jejích pyscích?"
 seduce_ongoing.1210.a: "Nekonvenční, ale ne nepříjemné."
 seduce_ongoing.1310.desc: "„Dejte tu věc ode mě pryč!“ Vycpaná liška na mě cení zuby v odporném, zuřivém šklebu."
 seduce_ongoing.1310.a: "Komu by se vůbec mohl líbit takový dárek?!"
 seduce_ongoing.1211.desc: "Květinová výzdoba bere dech a od chvíle, kdy ji sedláci vysadili v zahradě, jsou zdejší procházky mnohem oblíbenější."
 seduce_ongoing.1211.a: "Netušil[Select_CString(ROOT.Char.IsFemale, 'Netušila', 'Netušil')] jsem, že se mě taková krása tolik dotkne."
 seduce_ongoing.1311.desc: "„Takže je sázet nemáme, [ROOT.Char.Custom('FormOfAddressForLiege')]?“ Přede mnou stojí sedláci s vahadly na ramenou a z beden se jim sype hlína. Květiny, které přinesli, vypadají zvadle a zbědovaně."
 seduce_ongoing.1311.a: "Tohle se k zahradám ani nepřiblíží."
 seduce_ongoing.1212.desc: "[owner.GetTitledFirstName] mi poslal[Select_CString(owner.IsFemale, 'poslala', 'poslal')] dárek, kapesník s erbem dynastie [owner.GetDynasty.GetBaseName].\n\nRozhodně bude zajímavé sledovat reakce ostatních, až budu tento znak tak okatě vystavovat."
 seduce_ongoing.1212.a: "Tak či onak to jistě zanechá dojem."
 seduce_ongoing.1312.desc: "[owner.GetTitledFirstName] mi poslal[Select_CString(owner.IsFemale, 'poslala', 'poslal')] dárek, kapesník s erbem dynastie [owner.GetDynasty.GetBaseName].\n\nJestli si [owner.GetTitledFirstName] myslí, že budu tenhle erb někdy vystavovat na veřejnosti, pak se šeredně mýlí!"
 seduce_ongoing.1801.t: "[ROOT.Char.Custom('MistressMaster')|U] slova"
 seduce_ongoing.1801.start.desc: "Jako znalec diplomatického umění dobře vím, jakou moc má výmluvný kompliment. Ocenit nejlepší vlastnost, kterou [target.GetTitledFirstName] má, je jistou cestou k srdci.\n\n"
 seduce_ongoing.1801.close.desc: "Až se příště setkáme, pochválím..."
 seduce_ongoing.1801.distant.desc: "Napíšu [target.GetFirstName] dopis a pochválím..."
 seduce_ongoing.1801.compassionate: "vřelé a laskavé srdce."
 seduce_ongoing.1801.bold: "odvážného a nespoutaného ducha."
 seduce_ongoing.1801.honorable: "ušlechtilou a věrnou povahu."
 seduce_ongoing.1801.greed: "ctižádost a chuť do života."
 seduce_ongoing.1801.rational: "rozvážnou a bystrou mysl."
 seduce_ongoing.1801.zealous: "zbožnost a neochvějnou víru."
 seduce_ongoing.1801.energetic: "spontánnost a životní sílu."
 seduce_ongoing.1801.forgiving: "shovívavou povahu."
 seduce_ongoing.1801.beautiful_male: "nápadně pohledný zevnějšek."
 seduce_ongoing.1801.beautiful_female: "jedinečnou krásu, která bere dech."
 seduce_ongoing.1801.strong: "působivou tělesnou zdatnost."
 seduce_ongoing.1801.extroverted: "neodolatelné charisma."
 seduce_ongoing.1801.dominant: "rozhodnost a mocné vystupování."
 seduce_ongoing.1801.compliment.tt: "#F Jak dobře [target.GetTitledFirstName] kompliment přijme, závisí na tom, nakolik odpovídá skutečnosti.#!"
 seduce_ongoing.1802.t: "Hezká slova"
 seduce_ongoing.1802.close.desc: "Když se v tichém zamyšlení procházím zahradou s myslí bůhvíkde, málem vrazím přímo do [owner.GetTitledFirstName]. Než se stačím vzpamatovat, [owner.GetTitledFirstName] se mi omluví a vzápětí začne vychvalovat mou "
 seduce_ongoing.1802.distant.desc: "Dostal se ke mně zajímavý dopis od [owner.GetTitledFirstName]. Mezi běžnými dotazy a historkami se skrývají nenápadné, ale nezaměnitelné komplimenty na mou "
 seduce_ongoing.1802.compassionate.desc: "„laskavost a něhu“."
 seduce_ongoing.1802.bold.desc: "„odvahu a nespoutanost“."
 seduce_ongoing.1802.honorable.desc: "„ušlechtilost a věrnost“."
 seduce_ongoing.1802.greed.desc: "„ctižádost a touhu po životě“."
 seduce_ongoing.1802.rational.desc: "„rozvahu a bystrou mysl“."
 seduce_ongoing.1802.zealous.desc: "„zbožnost a neochvějnou víru“."
 seduce_ongoing.1802.energetic.desc: "„spontánnost a životní sílu“."
 seduce_ongoing.1802.forgiving.desc: "„shovívavost“."
 seduce_ongoing.1802.beautiful_male.desc: "„přitažlivost“."
 seduce_ongoing.1802.beautiful_female.desc: "„úchvatnou krásu“."
 seduce_ongoing.1802.strong.desc: "„tělesnou zdatnost“."
 seduce_ongoing.1802.extroverted.desc: "„osobní přitažlivost“."
 seduce_ongoing.1802.dominant.desc: "„rozhodnost a autoritu“."
 seduce_ongoing.1802.good.desc: "\n\nZ těch slov čiší taková míra něžné pozornosti, až mě to zaskočí."
 seduce_ongoing.1802.neutral.desc: "\n\nTa slova sice nedávají příliš smysl, ale gesto je to, hádám, laskavé."
 seduce_ongoing.1802.bad.desc: "\n\nMám podezření, že úmysl byl dobrý, ale mně to zní spíš jako sotva skrývaný sarkasmus."
 seduce_ongoing.1802.a.good: "[owner.GetTitledFirstNameNoTooltip]... To mi lichotí!"
 seduce_ongoing.1802.a.bad: "Trochu mimo, ale vlastně docela milé."
 seduce_ongoing.1802.b.good: "Příště se budeš muset snažit víc."
 seduce_ongoing.1802.b.bad: "Jak trapné..."
 seduce_ongoing.1802.c: "O takovou pozornost nestojím!"
 seduce_ongoing.1601.t: "Čtení v [location.GetNameNoTooltip]"
 seduce_ongoing.1601.t_no_location: "Čtení"
 seduce_ongoing.1601.desc: "Oslavy skončily a zdálo se, že s nimi i večerní zábava, když tu [target.GetTitledFirstName] navrhne společné čtení.\n\nZanedlouho dorazí písař a ptá se, co by si hosté rádi poslechli. Vtom spatřím příležitost zapůsobit na [target.GetFirstName]."
 seduce_ongoing.1601.a: "Něco zbožného, třeba [SCOPE.Custom('RandomReligiousTextName')]."
 seduce_ongoing.1601.a.tt: "Myslím, že [target.GetTitledFirstName] chce slyšet něco o náboženství."
 seduce_ongoing.1601.b: "Pobavme se. [SCOPE.Custom('RandomEntertainmentTextName')|U]!"
 seduce_ongoing.1601.b.tt: "Myslím, že [target.GetTitledFirstName] chce slyšet něco zábavného."
 seduce_ongoing.1601.c: "[SCOPE.Custom('RandomInformativeTextName')|U] nám dá příležitost něco se dozvědět."
 seduce_ongoing.1601.c.tt: "Myslím, že [target.GetTitledFirstName] chce slyšet něco poučného."
 seduce_ongoing.1603.desc: "Po skončení zábavy na hostině to vypadalo na úmorný večer, ale [owner.GetTitledFirstName] jej [Select_CString(owner.IsFemale, 'zachránila', 'zachránil')] návrhem, abychom si přečetli [SCOPE.Custom('BookInQuestion')]!"
 seduce_ongoing.1603.a: "To mám také moc [Select_CString(ROOT.Char.IsFemale, 'ráda', 'rád')]!"
 seduce_ongoing.1604.desc: "Zatímco nám písař předčítá, [target.GetFirstName] naslouchá s naprostým zaujetím.\n\nPozději za mnou [target.GetTitledFirstName] přijde. „Dobrá volba, [ROOT.Char.GetFirstName],“ pronese a [target.Custom('quirk_pos_present')]."
 seduce_ongoing.1604.a: "Bylo to skvělé, že?"
 seduce_ongoing.1605.desc_1: "Úmorná hostina se ještě zhoršila, když [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'navrhla', 'navrhl')] čtení z [SCOPE.Custom('BookInQuestion')]."
 seduce_ongoing.1605.desc_2: "Naštěstí [other_guest.GetTitledFirstName] brzy [Select_CString(other_guest.IsFemale, 'navrhla', 'navrhl')], abychom místo toho přečetli [SCOPE.Custom('GoodBookSuggestion')]!"
 seduce_ongoing.1605.desc_no_other_guest: "Naštěstí jeden ze sloužících brzy navrhl, abychom místo toho přečetli [SCOPE.Custom('GoodBookSuggestion')]!"
 seduce_ongoing.1605.a: "Mnohem lepší volba!"
 seduce_ongoing.1606.desc_1: "Zatímco písař monotónně předčítá dál a dál, vidím, jak pozornost [target.GetFirstName] ochabuje."
 seduce_ongoing.1606.desc_2: "\n\nZatímco přemýšlím, jak situaci zachránit, [other_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] se náhle ozve: „Smím pokorně navrhnout, abychom místo toho přečetli [SCOPE.Custom('GoodBookSuggestion')]?“ a "
 seduce_ongoing.1606.desc_3: "[target.GetFirstName] okamžitě ožije a začne znovu zaujatě poslouchat."
 seduce_ongoing.1606.desc_no_other_guest: "Náhle se ozve jeden ze sloužících. „Smím pokorně navrhnout, abychom místo toho přečetli [SCOPE.Custom('GoodBookSuggestion')]?“"
 seduce_ongoing.1606.a: "Proč mě to nenapadlo?"
 seduce_ongoing.1701.t: "Cvičné klání"
 seduce_ongoing.1701.desc: "V den cvičného jezdeckého klání se ocitám v místě zvaném [court_of_residence.GetNameNoTier]. Kolem se hemží důstojníci, jimž velí [target.GetTitledFirstName], udílejí pokyny mladým [target.Custom('MountedWarriorTermPlural')] a mezi nimi zahlédnu [target.GetFirstName].\n\nAť už jsem měl v úmyslu cokoli, [target.GetTitledFirstName] se očividně soustředí na povinnosti spojené s velením těmto vojákům."
 seduce_ongoing.1701.a: "Co kdybychom těm nováčkům předvedli cvičný souboj na koních?"
 seduce_ongoing.1701.a.tt: "#F Zkusíš oslovit činorodou či hravou stránku [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1701.b: "Projděme se po hradbách a proberme strategii."
 seduce_ongoing.1701.b.tt: "#F Zkusíš oslovit přemýšlivou stránku [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1701.c: "Chci slyšet všechno o tvých plánech na příští výběr daní."
 seduce_ongoing.1701.c.tt: "#F Zkusíš oslovit spořivou stránku [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1701.d: "Jeden z těchhle „[target.Custom('MountedWarriorTermPlural')]“ by se dal pořádně zesměšnit..."
 seduce_ongoing.1701.d.tt: "#F Zkusíš oslovit zlomyslnou stránku [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.1703.opening: "K mému překvapení se [owner.GetTitledFirstName] objeví v místě zvaném [court_of_residence.GetNameNoTier] na cvičném klání mladých [target.Custom('MountedWarriorTermPlural')]."
 seduce_ongoing.1703.duel: "\n\n[owner.GetTitledFirstName] mě [Select_CString(owner.IsFemale, 'vyzvala', 'vyzval')] k cvičnému souboji na koních a před nováčky jsme předvedli pořádnou podívanou. Z přátelského klání se rychle stal urputný zápas, ale nakonec jsme se objali a oba měli ze svého výkonu dobrý pocit."
 seduce_ongoing.1703.strategy: "\n\nProcházeli jsme se po hradbách, dlouze probírali strategii a pozorovali přitom nováčky na nádvoří pod námi. [owner.GetFirstName] [Select_CString(owner.IsFemale, 'přišla', 'přišel')] s několika pronikavými postřehy a já [Select_CString(ROOT.Char.IsFemale, 'poděkovala', 'poděkoval')] za to, že mě [Select_CString(owner.IsFemale, 'přiměla', 'přiměl')] přehodnotit některé představy o mých nových vojácích. A všechny ty odbočky v našem hovoru byly také velmi poutavé..."
 seduce_ongoing.1703.tax_season: "\n\nCvičné klání bylo sice nutné, ale mnohem příjemnější bylo sedět uvnitř a probírat s [owner.GetFirstName] mé plány na nadcházející výběr daní. Vždyť k čemu je vojsko bez prostředků na jeho obživu, jak [owner.GetTitledFirstName] správně [Select_CString(owner.IsFemale, 'podotkla', 'podotkl')]."
 seduce_ongoing.1703.trap: "\n\nPozorovat nováčky bylo sice nutné, ale nijak zajímavé, takže jsem [Select_CString(ROOT.Char.IsFemale, 'uvítala', 'uvítal')], když [owner.GetFirstName] [Select_CString(owner.IsFemale, 'navrhla', 'navrhl')] malé povyražení. Páže vylilo na zem za překážkou prasečí krev, což některé hůře vycvičené koně vyděsilo k nepříčetnosti. Několik jezdců skončilo na zemi a ostatní měli co dělat, aby se vůbec udrželi v sedle!"
 seduce_ongoing.1703.fallback: "\n\nPozorování nováčků bývá úmorné, ale díky [owner.GetFirstName] tentokrát celý den utekl jako voda."
 seduce_ongoing.1703.a: "Musím [owner.GetFirstNameNoTooltip] za návštěvu poděkovat."
 seduce_ongoing.1704.duel: "\n\n[owner.GetTitledFirstName] trval[Select_CString(owner.IsFemale, 'trvala', 'trval')] na cvičném souboji na koních před nováčky, ale takhle se před nimi zesměšňovat nehodlám. [owner.GetFirstName] vypadal[Select_CString(owner.IsFemale, 'vypadala', 'vypadal')] zklamaně, ale mám na práci důležitější věci než [Select_CString(owner.IsFemale, 'ji', 'ho')] utěšovat."
 seduce_ongoing.1704.strategy: "\n\n[owner.GetTitledFirstName] mě požádal[Select_CString(owner.IsFemale, 'požádala', 'požádal')] o procházku po hradbách, abychom probrali možné strategie, ale jeden špatný návrh střídal druhý a já je musím všechny zavrhovat. Možná by se [owner.GetFirstName] měl[Select_CString(owner.IsFemale, 'měla', 'měl')] držet věcí, kterým skutečně rozumí..."
 seduce_ongoing.1704.tax_season: "\n\nPřestože je zcela zřejmé, že se věnuji nováčkům, [owner.GetTitledFirstName] trvá na rozhovoru o mých plánech pro příští výběr daní. Nakonec [Select_CString(owner.IsFemale, 'ji', 'ho')] musím nechat samotnou[Select_CString(owner.IsFemale, 'samotnou', 'samotného')], abych se mohl[Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] věnovat skutečně důležitým záležitostem."
 seduce_ongoing.1704.trap: "\n\nK mému úžasu [owner.GetTitledFirstName] navrhne, abychom zosnovali důmyslný žert, který mezi mladými [target.Custom('MountedWarriorTermPlural')] rozpoutá chaos. Copak [owner.GetTitledFirstName] nechápe, že právě tomu se chci ze všeho nejvíc vyhnout?"
 seduce_ongoing.1704.fallback: "\n\n[owner.GetFirstName] chtěl[Select_CString(owner.IsFemale, 'chtěla', 'chtěl')] svou návštěvu strávit hovorem se mnou, jako by vůbec nechápal[Select_CString(owner.IsFemale, 'nechápala', 'nechápal')], že dnes mám opravdu plné ruce práce."
 seduce_ongoing.1704.a: "Co to do [owner.GetTitledFirstNameNoTooltip] vjelo?"
 seduce_ongoing.1705.duel: "Cvičný souboj na koních měl mezi mladými [target.Custom('MountedWarriorTermPlural')] ohromný úspěch!\n\nTaké [target.GetTitledFirstName] si jej očividně užíval[Select_CString(target.IsFemale, 'užívala', 'užíval')] a po našem urputném „boji“ jsme se povzbudivě objali. Námaha nám oběma udělala dobře."
 seduce_ongoing.1705.strategy: "Při procházce po hradbách jsme s [target.GetTitledFirstName] probírali nejrůznější způsoby, jak nejlépe využít nezkušené bojovníky, jako jsou ti na nádvoří pod námi.\n\nNa konci dne bylo zřejmé, že [target.GetTitledFirstName] má z našeho rozhovoru stejnou radost jako já, navzdory všem odbočkám – nebo možná právě díky nim."
 seduce_ongoing.1705.tax_season: "[target.GetFirstName] a já jsme většinu dne probírali plány na příští výběr daní. Vždyť k čemu je vojsko, když ho nedokážeš nakrmit? Tomu se [target.GetTitledFirstName] od srdce zasmál[Select_CString(target.IsFemale, 'zasmála', 'zasmál')].\n\nA smíchu přibývalo, jak jsme se oba stále více zabírali do našich mnoha rozhovorů."
 seduce_ongoing.1705.trap: "Po chvíli navrhnu malé povyražení, které nám zpestří pozorování nováčků. Páže vylije trochu prasečí krve poblíž napajedel a její pach vyděsí některé hůře vycvičené koně k nepříčetnosti. Několik mladých [target.Custom('MountedWarriorTermPlural')] skončí na zemi a ostatní mají co dělat, aby se vůbec udrželi v sedle.\n\n[target.GetFirstName] se scéně, kterou jsem zosnoval[Select_CString(ROOT.Char.IsFemale, 'zosnovala', 'zosnoval')], hlasitě směje."
 seduce_ongoing.1705.fallback: "Na konci mé návštěvy vypadá [target.GetTitledFirstName] spokojeně. „Pozorovat nováčky bývá úmorné, ale dnešek utekl jako voda!“"
 seduce_ongoing.1705.a: "[target.GetTitledFirstName] si na tenhle den jistě vzpomene."
 seduce_ongoing.1706.duel: "[target.GetTitledFirstName] můj návrh na cvičný souboj na koních jednoduše odbyde smíchem. „Není třeba, aby se před těmi mladými [target.Custom('MountedWarriorTermPlural')] někdo takhle zesměšňoval!“\n\nZbytek dne přemýšlím, jestli tím [target.GetTitledFirstName] myslel[Select_CString(target.IsFemale, 'myslela', 'myslel')] mě, nebo sebe."
 seduce_ongoing.1706.strategy: "S [target.GetTitledFirstName] se procházíme po hradbách a já se snažím nabízet strategické rady. [target.GetTitledFirstName] však očividně nemá náladu poslouchat. Podle [target.GetFirstName] má každý můj nápad nějakou slabinu a je jasné, že pozornost se mnohem víc upírá k nádvoří pod námi než ke mně."
 seduce_ongoing.1706.tax_season: "Snažím se mluvit o nadcházejícím výběru daní a o tom, jak zajistit prostředky na obživu vojska, kterému velí [target.GetFirstName]. Myšlenkami je však [target.GetFirstName] někde jinde a brzy mě nechá za sebou, aby se mohl[Select_CString(target.IsFemale, 'mohla', 'mohl')] věnovat nováčkům."
 seduce_ongoing.1706.trap: "Když navrhnu, abychom si vystřelili z cvičících [target.Custom('MountedWarriorTermPlural')], [target.GetFirstName] na mě jen nevěřícně zírá.\n\n„Prasečí krev a splašení koně? Ty ses snad #EMP zbláznil[Select_CString(ROOT.Char.IsFemale, 'zbláznila', 'zbláznil')]#!?“"
 seduce_ongoing.1706.fallback: "Celý den se snažím promluvit si s [target.GetTitledFirstName], ale pokaždé si něco na cvičišti vyžádá plnou pozornost. Nakonec se mi ji nikdy nepodaří získat na víc než pár okamžiků a připadám si spíš na obtíž."
 seduce_ongoing.1706.a: "Doufám, že [target.GetFirstNameNoTooltip] na tenhle den rychle zapomene."
 seduce_ongoing.2001.t: "Nápoj lásky"
 seduce_ongoing.2001.desc: "Jeden z mých služebníků získal na jarmarku nápoj lásky od [Select_CString(dummy_gender.IsFemale, 'staré ženy', 'starého muže')], ale tvrdí, že mu žádné štěstí nepřinesl.\n\nKdyž držím malou lahvičku v rukou, nemohu nemyslet na [target.GetTitledFirstName] a napadá mě, zda by se na mě přece jen neusmálo štěstí."
 seduce_ongoing.2001.a: "[target.GetTitledFirstName] se tím určitě pobaví!"
 seduce_ongoing.2001.b: "[target.GetFirstNameNoTooltip] se takovým pověrám jistě rád[Select_CString(target.IsFemale, 'ráda', 'rád')] vysměje."
 seduce_ongoing.2001.c: "Na nesmysly s nápoji lásky nemám čas."
 seduce_ongoing.2001.c.tt: "#F Potřebuji lepší příležitost dát najevo svou náklonnost!#!"
 seduce_ongoing.2002.desc: "[owner.GetTitledFirstName] mi přinesl[Select_CString(owner.IsFemale, 'přinesla', 'přinesl')] „nápoj lásky“, který získal[Select_CString(owner.IsFemale, 'získala', 'získal')] na jarmarku. Přilili jsme si trochu do vína a celý večer se bavili předstíráním, že na nás skutečně působí. Ke konci už se hranice mezi předstíráním a skutečností začala poněkud rozmazávat."
 seduce_ongoing.2002.a: "To byla ale zábava!"
 seduce_ongoing.2003.desc: "S [target.GetFirstName] jsme si dali trochu „nápoje lásky“ s vínem a strávili večer předstíráním, že na nás opravdu působí.\n\nByla to jen nevinná zábava, ale když se se mnou [target.GetTitledFirstName] loučil[Select_CString(target.IsFemale, 'loučila', 'loučil')], v úsměvu se zračila nepřehlédnutelná náklonnost."
 seduce_ongoing.2003.a: "Společně strávený čas rozhodně stál za to."
 seduce_ongoing.2004.desc: "Pro trochu zábavy mě [owner.GetTitledFirstName] vyzval[Select_CString(owner.IsFemale, 'vyzvala', 'vyzval')], abych vypil[Select_CString(ROOT.Char.IsFemale, 'vypila', 'vypil')] „nápoj lásky“, který získal[Select_CString(owner.IsFemale, 'získala', 'získal')] na jarmarku. Když odmítnu pít něco, o čem vůbec nevím, co obsahuje, [owner.GetTitledFirstName] se trochu urazí! Zanedlouho požádám [owner.GetTitledFirstName], aby odešel[Select_CString(owner.IsFemale, 'odešla', 'odešel')], protože si chci jít brzy lehnout."
 seduce_ongoing.2004.a: "Co to do [owner.GetTitledFirstName] vjelo?"
 seduce_ongoing.2005.desc: "[target.GetFirstName] „nápoj lásky“ odmítne a začne se vyptávat, co tím vlastně sleduji. Nechám se trochu unést při vysvětlování, že to všechno měla být jen zábava, a nakonec mě [target.GetTitledFirstName] požádá, abych odešel[Select_CString(ROOT.Char.IsFemale, 'odešla', 'odešel')]."
 seduce_ongoing.2005.a: "Tohle nedopadlo dobře."
 seduce_ongoing.2006.t: "„Nápoj lásky“"
 seduce_ongoing.2006.desc: "[owner.GetTitledFirstName] mi přinesl[Select_CString(owner.IsFemale, 'přinesla', 'přinesl')] nápoj lásky, který získal[Select_CString(owner.IsFemale, 'získala', 'získal')] na jarmarku. Připadalo mi to zábavné, a tak jsem přistoupil[Select_CString(ROOT.Char.IsFemale, 'přistoupila', 'přistoupil')] na naléhání, abychom ho ochutnali.\n\nKdyž mi však začne být prudce zle, [owner.GetFirstName] se raději napít odmítne!"
 seduce_ongoing.2006.a: "Není mi vůbec dobře..."
 seduce_ongoing.2006.a.tt: "#F Proklínám tvou hloupost, #EMP *blééé#! [owner.GetFirstNameNoTooltip]!#!"
 seduce_ongoing.2007.desc: "Ach ne! [target.GetTitledFirstName] souhlasil[Select_CString(target.IsFemale, 'souhlasila', 'souhlasil')] s ochutnáním nápoje lásky, ale z nevinné zábavy se nakonec stalo zvracení a pobyt na lůžku!"
 seduce_ongoing.2007.a: "Kde je ten služebník, který mi to dal?"
 seduce_ongoing.2008.desc: "[owner.GetTitledFirstName] za mnou přišel[Select_CString(owner.IsFemale, 'přišla', 'přišel')] s „nápojem lásky“, který jeden ze služebníků získal na jarmarku. Neznámou tekutinu jsme nepili a místo toho strávili příjemný večer u vína, během něhož jsme se vysmívali prostoduchým pověrám, které se mezi lidmi tak bujně šíří.\n\nKdyž mi nedokážeš říct, kterou tělesnou šťávu to ovlivňuje, nemůžeš tvrdit, že to funguje! Ach, prostý lid uvěří čemukoli..."
 seduce_ongoing.2008.a: "S [owner.GetFirstNameNoTooltip] jsem se výborně bavil[Select_CString(ROOT.Char.IsFemale, 'bavila', 'bavil')]!"
 seduce_ongoing.2009.desc: "Přinesu „nápoj lásky“ k [target.GetTitledFirstName] a ukáže se, že důvěřivost mého služebníka připadá stejně neuvěřitelná nám oběma!\n\nVečer strávíme hovorem o pověrách a směšných představách. Prostý lid uvěří čemukoli."
 seduce_ongoing.2009.a: "Byl to velice příjemný večer."
 seduce_ongoing.2010.desc: "[owner.GetTitledFirstName] za mnou [Select_CString(owner.IsFemale, 'přišla', 'přišel')] s „nápojem lásky“, který získal jeden ze služebníků na jarmarku. Mě samotnou[Select_CString(ROOT.Char.IsFemale, 'samotnou', 'samotného')] nijak nezaujal, ale [owner.GetFirstName] o něm pořád [Select_CString(owner.IsFemale, 'mluvila', 'mluvil')] a neustále [Select_CString(owner.IsFemale, 'rozebírala', 'rozebíral')], jak pověrčivý a důvěřivý je prostý lid."
 seduce_ongoing.2010.a: "Když tomu nevěříš, tak mě s tím neotravuj!"
 seduce_ongoing.2011.desc: "„Nápoj lásky“ na [target.GetFirstName] očividně žádný dojem neudělal a stejně mizerně dopadl můj pokus zavést řeč na směšné pověry prostého lidu. Vlastně to všechno [target.GetTitledFirstName] zjevně jen rozčilovalo!"
 seduce_ongoing.2011.a: "[target.GetTitledFirstName] má dnes snad neobyčejně flegmatickou náladu."
 seduce_ongoing.3001.t: "Srdce a mysl"
 seduce_ongoing.3001.desc: "[Select_CString(ROOT.Char.IsFemale, 'Dozvěděla', 'Dozvěděl')] jsem se, že [target.GetTitledFirstName] má velmi blízký vztah s [close_character.GetTitledFirstName], což je [Select_CString(close_character.IsFemale, 'její', 'jeho')] [target.Custom2('RelationToMe', SCOPE.sC('close_character'))|l]. Kdybych si [Select_CString(ROOT.Char.IsFemale, 'získala', 'získal')] přízeň [close_character.GetTitledFirstName], možná by si mě [target.GetFirstName] konečně [Select_CString(target.IsFemale, 'všimla', 'všiml')]."
 seduce_ongoing.3001.a: "[close_character.GetFirstNameNoTooltip] dostane, oč si řekne."
 seduce_ongoing.3001.b: "Projev dobré vůle by měl stačit."
 seduce_ongoing.3001.c: "[Select_CString(ROOT.Char.IsFemale, 'Mohla', 'Mohl')] bych pomoci splatit dluhy."
 seduce_ongoing.3001.d: "Dar zlata přece musí potěšit každého."
 seduce_ongoing.3001.e: "Tohle mi nepřipadá správné."
 seduce_ongoing.3001.e.tt: "#F Najdeš jiné způsoby, jak si získat náklonnost [target.GetFirstNameNoTooltip].#!"
 seduce_ongoing.3002.desc: "[Select_CString(close_character.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))|l], [close_character.GetTitledFirstName], mi poslední dobou často vypráví, jak moc na [Select_CString(close_character.IsFemale, 'ni', 'něj')] zapůsobila štědrost [owner.GetTitledFirstName].\n\nZdá se, že když [close_character.GetTitledFirstName] pomoc skutečně [Select_CString(close_character.IsFemale, 'potřebovala', 'potřeboval')], [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'nezklamala', 'nezklamal')]."
 seduce_ongoing.3002.a: "Možná jsem [owner.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale, 'podceňovala', 'podceňoval')]?"
 seduce_ongoing.3002.b: "[owner.GetFirstNameNoTooltip] pomáhá [close_character.GetFirstNameNoTooltip]? Svým způsobem působivé."
 seduce_ongoing.3003.desc: "Když se příště setkáme, [target.GetFirstName] mě přivítá širším úsměvem než obvykle.\n\n„[Select_CString(close_character.IsFemale, 'Má', 'Můj')] [target.Custom2('RelationToMe', SCOPE.sC('close_character'))|l] [close_character.GetFirstName] mi [Select_CString(close_character.IsFemale, 'vyprávěla', 'vyprávěl')], jak jsi [Select_CString(close_character.IsFemale, 'jí', 'mu')] [Select_CString(ROOT.Char.IsFemale, 'pomohla', 'pomohl')], a [Select_CString(target.IsFemale, 'chtěla', 'chtěl')] jsem ti poděkovat.“"
 seduce_ongoing.3003.a: "Pro někoho, kdo je [target.Custom2('RelationToMe', SCOPE.sC('close_character'))|l] [target.GetFirstNameNoTooltip], cokoli."
 seduce_ongoing.3004.desc: "Zdá se, že [target.GetFirstName] si mé štědrosti vůči [close_character.GetFirstName], [Select_CString(close_character.IsFemale, 'své', 'svému')] [target.Custom2('RelationToMe', SCOPE.sC('close_character'))|l], vůbec [Select_CString(target.IsFemale, 'nevšimla', 'nevšiml')]. Alespoň [close_character.GetFirstName] je [Select_CString(close_character.IsFemale, 'vděčná', 'vděčný')]!"
 seduce_ongoing.3004.a: "Co ještě musím udělat?"
 seduce_ongoing.4001.t: "[target.Custom('MusicalPerformerPossessive')|U] věnování"
 seduce_ongoing.4001.desc: "U dvora v [court_location.GetNameNoTier] má brzy vystoupit [target.Custom('MusicalPerformer')|l]. Stačilo by požádat, aby vystoupení [Select_CString(dummy_musician_gender.IsFemale, 'věnovala', 'věnoval')] [target.GetTitledFirstName], objektu mé náklonnosti."
 seduce_ongoing.4001.desc.court_musician: "U dvora v [court_location.GetNameNoTier] má brzy vystoupit [target.Custom('MusicalPerformer')|l]. Stačilo by požádat, aby vystoupení [Select_CString(dummy_musician_gender.IsFemale, 'věnovala', 'věnoval')] [target.GetTitledFirstName], objektu mé náklonnosti.\n\nPřípadně bych [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] přizvat [court_musician.GetName], [GetCourtPositionType('court_physician_court_position').GetName()] v mých službách, a nechat zahrát skladby, které mě před tamním publikem ukážou v tom nejlepším světle."
 seduce_ongoing.4001.a: "Bude to odvážné vyznání určené [target.GetTitledFirstName]!"
 seduce_ongoing.4001.b: "Dávám přednost nenápadným narážkám na svou touhu."
 seduce_ongoing.4001.b.failure: "Věnování zůstane bez povšimnutí"
 seduce_ongoing.4001.c: "Lidé v [court_location.GetNameNoTierNoTooltip] se budou kochat mou slávou!"
 seduce_ongoing.4001.d: "Do něčeho takového bych se [Select_CString(ROOT.Char.IsFemale, 'neměla', 'neměl')] pouštět."
 seduce_ongoing.4002.desc.opening: "U dvora vystupují umělci často, ale tentokrát nám slibovali něco výjimečného – a toho se mi rozhodně dostalo."
 seduce_ongoing.4002.desc: "\n\nKdyž [ROOT.Char.Custom('MusicalPerformer')|l] začne další sloku, snažím se nedat najevo, jak moc mi lichotí, že je celé vystoupení přede všemi u dvora věnováno právě mně."
 seduce_ongoing.4002.desc.court_musician: "\n\nKdyž [ROOT.Char.Custom('MusicalPerformer')|l] spolu s [court_musician.GetName], [GetCourtPositionType('court_physician_court_position').GetName()] ve službách [owner.GetTitledFirstName], začnou další sloku, snažím se příliš nedat najevo svůj obdiv při poslechu všech těch činů, které [Select_CString(owner.IsFemale, 'vykonala', 'vykonal')] [owner.GetFirstNameNoTooltip]."
 seduce_ongoing.4002.a: "[owner.GetTitledFirstNameNoTooltip] se tentokrát skutečně [Select_CString(owner.IsFemale, 'překonala', 'překonal')]."
 seduce_ongoing.4003.desc: "\n\nKdyž [ROOT.Char.Custom('MusicalPerformer')|l] začne další sloku, v rozpacích odcházím ze síně. Každá jediná píseň je věnováním, které mi posílá [owner.GetTitledFirstName]!"
 seduce_ongoing.4003.desc.court_musician: "\n\nKdyž [ROOT.Char.Custom('MusicalPerformer')|l] spolu s [court_musician.GetName], [GetCourtPositionType('court_physician_court_position').GetName()] ve službách [owner.GetTitledFirstName], začnou další sloku, v rozpacích odcházím ze síně. Copak [owner.GetFirstNameNoTooltip] opravdu [Select_CString(owner.IsFemale, 'poslala', 'poslal')] svého [GetCourtPositionType('court_physician_court_position').GetName()] jen proto, aby před všemi [Select_CString(court_musician.IsFemale, 'opěvovala', 'opěvoval')] [owner.GetTitledFirstName]?!"
 seduce_ongoing.4003.a: "Ta drzost!"
 seduce_ongoing.4004.desc: "Děkuji ti za hudební dar. Vystoupení, které předvedl [target.Custom('MusicalPerformer')|l], mě velmi potěšilo! Vždycky jsem [Select_CString(ROOT.Char.IsFemale, 'věděla', 'věděl')], že máš dokonalý vkus."
 seduce_ongoing.4004.a: "Dokonalé!"
 seduce_ongoing.4005.opening: "[target.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 seduce_ongoing.4005.desc.court_musician: "Píšu ti, abych ti řekl[Select_CString(ROOT.Char.IsFemale, 'řekla', 'řekl')], jakého hlupáka jsi ze sebe [Select_CString(ROOT.Char.IsFemale, 'udělala', 'udělal')], když jsi obecenstvo [Select_CString(ROOT.Char.IsFemale, 'nutila', 'nutil')] poslouchat své údajné hrdinské činy. Opravdu si myslíš, že nejlepší způsob, jak pobavit dvůr, je mluvit [Select_CString(ROOT.Char.IsFemale, 'sama', 'sám')] o sobě?"
 seduce_ongoing.4005.desc: "Jak ses [Select_CString(ROOT.Char.IsFemale, 'opovážila', 'opovážil')] mě takhle veřejně ztrapnit?! To jsi #EMP [Select_CString(ROOT.Char.IsFemale, 'chtěla', 'chtěl')]#!, abych [Select_CString(target.IsFemale, 'musela', 'musel')] vysvětlovat, co slova, která pronesl [target.Custom('MusicalPerformer')|l], znamenala pro"
 seduce_ongoing.4005.spouse: " [Select_CString(spouse.IsFemale, 'mou', 'mého')] [target.Custom2('RelationToMe', SCOPE.sC('spouse'))|l]?"
 seduce_ongoing.4005.court: " celý dvůr?"
 seduce_ongoing.4005.a: "Takhle jsem to [Select_CString(ROOT.Char.IsFemale, 'nechtěla', 'nechtěl')]!"
 seduce_ongoing.4006.desc: "Zatímco [ROOT.Char.Custom('MusicalPerformer')] dál přednáší verše o lásce a touze, snažím se před zbytkem dvora skrýt, jak moc mi to lichotí.\n\nAčkoli se [owner.GetTitledFirstName] skrývá za metaforami a alegoriemi, vím, že je to věnování určené právě mně."
 seduce_ongoing.4006.a: "Víš, jak upoutat mou pozornost, [owner.GetFirstNameNoTooltip]."
 seduce_ongoing.4007.desc: "Možná bylo mé věnování až příliš nenápadné... [target.GetLadyLord] [target.GetFirstName] si ho zjevně vůbec [Select_CString(target.IsFemale, 'nevšimla', 'nevšiml')]."
 seduce_ongoing.4007.a: "Tolik úsilí nazmar."
 seduce_ongoing.4011.t: "Projížďka v [court_location.GetNameNoTierNoTooltip]"
 seduce_ongoing.4011.desc: "Může to působit opovážlivě, ale napadlo mě, že by se [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'mohla', 'mohl')] přidat ke mně na projížďku. Cílem by bylo [court_location.GetNameNoTier], místo, které je [court_location.Custom('BaronyTownType')]."
 seduce_ongoing.4011.a: "Projedeme se tržištěm, ať nás všichni vidí!"
 seduce_ongoing.4011.b: "Držme se postranních uliček. Na co nám budou ostatní?"
 seduce_ongoing.4011.b.failure: "[target.GetFirstNameNoTooltip] není mým počínáním [Select_CString(target.IsFemale, 'ohromena', 'ohromen')]"
 seduce_ongoing.4011.c: "Možná bychom to dělat neměli."
 seduce_ongoing.4011.c.tt: "#F Mohu si počkat na jinou příležitost#!"
 seduce_ongoing.4012.opening: "Trochu mě překvapilo, když mě [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'pozvala', 'pozval')] na projížďku. Cílem bylo [court_location.GetNameNoTier], místo, které je [court_location.Custom('BaronyTownType')]."
 seduce_ongoing.4012.end: "\n\nNakonec z toho však byl příjemný den. Projížděli jsme tržištěm a rozprávěli o všem možném, zatímco kupci vyvolávali své zboží a sedláci s otevřenými ústy zírali na náš průvod v blyštivé zbroji."
 seduce_ongoing.4012.a: "Rozhodně jsme vzbudili pozornost."
 seduce_ongoing.4013.end: "\n\nČím déle [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'trvala', 'trval')] na projížďce tržištěm, tím větší jsem měl pochybnosti. Okázalý doprovod a téměř naprosté ticho mezi námi jasně prozrazovaly, že se přede mnou jen předvádí. Jedině hrozba veřejné scény mě udržela na místě."
 seduce_ongoing.4013.a: "Tohle už raději neopakujme."
 seduce_ongoing.4014.desc: "[Select_CString(owner.IsFemale, 'Drahá', 'Drahý')] [owner.GetTitledFirstName],\n\n[court_location.GetNameNoTier] je [court_location.Custom('BaronyTownType')] a tvá společnost tam byla jednoduše nádherná. Doufám, že tě brzy zase uvidím."
 seduce_ongoing.4014.a: "Potěšení bylo na mé straně."
 seduce_ongoing.4015.desc: "[target.GetTitledFirstName],\n\n[Select_CString(target.IsFemale, 'Chtěla', 'Chtěl')] jsi mě snad veřejně ztrapnit? Vystavovat mě všem na odiv jako nějakou směšnou trofej... Víš vůbec, co se teď povídá u dvora?"
 seduce_ongoing.4015.a: "To přece nebyl můj záměr!"
 seduce_ongoing.4016.end: "\n\nProplétali jsme se spoustou postranních uliček a smáli se překvapení prostých lidí, kolem nichž procházel náš doprovod. [court_location.GetNameNoTier] je [court_location.Custom('BaronyTownType')] a na konci dne už jsem se tam [Select_CString(ROOT.Char.IsFemale, 'vyznala', 'vyznal')] lépe než kdy dřív."
 seduce_ongoing.4016.a: "[target.GetFirstNameNoTooltip] mi ukazuje svět z tolika nových úhlů."
 seduce_ongoing.4017.desc: "[Select_CString(ROOT.Char.IsFemale, 'Drahá', 'Drahý')] [ROOT.Char.GetTitledFirstName],\n\nDěkuji za společnost během mé návštěvy. [court_location.GetNameNoTier] je [court_location.Custom('BaronyTownType')], ale tvé trvání na postranních uličkách a na tom, abychom zůstali z dohledu, mě naprosto zmátlo. Snad mi to někdy vysvětlíš."
 seduce_ongoing.4017.a: "Bylo to... jen mezi námi, my—"
 seduce_ongoing.4018.desc: "[Select_CString(owner.IsFemale, 'Drahá', 'Drahý')] [owner.GetTitledFirstName],\n\nTvoje návštěva [court_location.GetNameNoTier] byla taková zábava! Je to [court_location.Custom('BaronyTownType')] a teď už vím, že jsou tam i místa, která by mě dřív ani nenapadlo hledat!"
 seduce_ongoing.4018.a: "Potěšení bylo na mé straně."
 seduce_ongoing.4101.t: "Balkon mé lásky"
 seduce_ongoing.4101.desc_opening: "V oknech komnat, kde pobývá [target.GetTitledFirstName], září teplé světlo a i ze země vidím uvnitř pohyb.\n\n"
 seduce_ongoing.4101.desc_same_court: "Srdce mi buší až v uších. [ROOT.Char.Custom('ResidenceBuilding')] je sice mé vlastní sídlo, ale pokud jde o [Select_CString(target.IsFemale, 'její', 'jeho')] touhu, pohybuji se na zcela neznámé půdě."
 seduce_ongoing.4101.desc_other_court: "Srdce mi buší až v uších. Jak snaha dostat [Select_CString(target.IsFemale, 'ji', 'ho')] do postele, tak pobyt v [court_location.GetNameNoTier] mě zavedly do neznámých vod."
 seduce_ongoing.4101.a: "[target.GetFirstNameNoTooltip]! Pohlédni ven a rozzáři mi noc!"
 seduce_ongoing.4101.a.tt: "#F Pokusím se nenápadně upoutat [Select_CString(target.IsFemale, 'její', 'jeho')] pozornost#!"
 seduce_ongoing.4101.b: "Tak vzhůru."
 seduce_ongoing.4101.b.tt: "#F [target.GetFirstNameNoTooltip] mě jistě [Select_CString(target.IsFemale, 'ráda', 'rád')] uvidí!#!"
 seduce_ongoing.4101.c: "[SCOPE.Custom('SeductionObjectIndefinite')] tu zůstane spolu se vzkazem. [target.GetFirstNameNoTooltip] si toho jistě všimne."
 seduce_ongoing.4101.c.tt: "#F [target.GetFirstNameNoTooltip] jistě ocení nenápadné gesto i to, co pro mě znamená#!"
 seduce_ongoing.4101.d: "Raději zmizím, než mě někdo uvidí."
 seduce_ongoing.4101.d.tt: "#F Nebudu se k [Select_CString(target.IsFemale, 'ní', 'němu')] plížit jako zloděj za noci!#!"
 seduce_ongoing.4102.t: "Pod mým balkonem"
 seduce_ongoing.4102.desc: "Když se na večer uchýlím do svých komnat, překvapí mě tlumený hlas zvenčí, který zní podezřele jako [owner.GetTitledFirstName].\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip], prosím tě, ukaž mi svou spanilou tvář!“"
 seduce_ongoing.4102.a: "Jako z nějakého příběhu... jak romantické!"
 seduce_ongoing.4102.b: "A za odměnu mám hledět na tu tvou ohavnou? Ne."
 seduce_ongoing.4103.desc: "Když [target.GetTitledFirstName] otevře dveře a světlo se rozlije po balkonu, jako by se rozlilo i po mém srdci.\n\nTemnota, která nás halí, dodává našemu hovoru zvláštní pocit svobody a — přestože celou dobu stojím dole — nikdy předtím jsme si nebyli tak blízko."
 seduce_ongoing.4103.a: "Ach, [target.GetFirstNameNoTooltip], jsi slunce v mé noci!"
 seduce_ongoing.4104.desc: "Když [target.GetTitledFirstName] otevře dveře a světlo se rozlije po balkonu, jako by se rozlilo i po mém srdci.\n\nRychle však pohasne, když [target.GetTitledFirstName] nasadí výraz, který je [target.Custom('quirk_neg_adjective')], a docela zhasne, jakmile promluví. „Co tady děláš, [ROOT.Char.GetTitledFirstNameNoTooltip]?! Prosím, nech mě na pokoji.“"
 seduce_ongoing.4104.a: "Ale... vždyť jsi slunce v mé temné noci...!"
 seduce_ongoing.4105.desc: "#EMP Zalapám po dechu!#!\n\nKdyž se na večer uchýlím do svých komnat, náhle stojím tváří v tvář [Select_CString(owner.IsFemale, 'ženě', 'muži')] za svým oknem... A nápadně mi připomíná [owner.GetTitledFirstName]."
 seduce_ongoing.4105.a: "Ty [Select_CString(owner.IsFemale, 'pošetilá ženo', 'pošetilý muži')], pojď dovnitř!"
 seduce_ongoing.4105.b: "Ještě že mám tak silné závěsy."
 seduce_ongoing.4105.c: "Stráže! Pomoc, stráže!"
 seduce_ongoing.4106.desc: "Jakmile se vyšplhám na balkon, [target.GetTitledFirstName] vyjde ven se smíchem. „Proč vyvádíš takové hlouposti, [ROOT.Char.GetFirstNameNoTooltip]? Prostě použij dveře jako normální [Select_CString(ROOT.Char.IsFemale, 'žena', 'muž')]. Člověk by skoro řekl, že své úmysly chceš před někým skrývat.“\n\nHravá radost v očích mi za všechno to úsilí stojí."
 seduce_ongoing.4106.a: "Žádná překážka mě od tebe neodradí!"
 seduce_ongoing.4107.desc_paranoid: "Jakmile se vyšplhám na balkon, [target.GetTitledFirstName] začne volat stráže. „Pomoc, vetřelec!“\n\nKřik mě pronásleduje i při zběsilém ústupu. Poslední kus cesty spíš spadnu, než slezu, a pak zmizím do noci."
 seduce_ongoing.4107.desc: "Jakmile se vyšplhám na balkon, [target.GetTitledFirstName] vyjde ven s výrazem, který je [target.Custom('quirk_neg_adjective')].\n\n„Co je tohle za hloupý kousek, [ROOT.Char.GetFirstNameNoTooltip]? Tohle přece nemůžeš — jsi [ROOT.Char.GetTitleTierName]! Takové chování se nehodí.“"
 seduce_ongoing.4107.a: "To mohlo dopadnout lépe..."
 seduce_ongoing.4107.a.tt: "#F Mělo mi dojít, že plížit se k někomu tak paranoidnímu není dobrý nápad!#!"
 seduce_ongoing.4108.desc: "Když se na večer uchýlím do svých komnat, poleká mě zvuk, jako by do okna narazil kamínek. Nahlédnu do temné zahrady a na zemi spatřím dárek zabalený spolu se vzkazem: [SCOPE.Custom('SeductionObjectIndefinite')]. Opodál zahlédnu [owner.GetTitledFirstName], jak mizí do noci.\n\n#EMP [ROOT.Char.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('ComplimentAdjective', ROOT.Char)] jako vždy. Přijmi to jako znamení mých citů.#!"
 seduce_ongoing.4108.a: "Udělám totéž. Až se [owner.GetTitledFirstName] podívá, bude tam čekat dárek: [SCOPE.Custom('SeductionObjectIndefinite')]!"
 seduce_ongoing.4108.b: "Co s tím mám dělat? Prodám to!"
 seduce_ongoing.4109.desc: "V komnatách na mě čekají dva dary: [SCOPE.Custom('SeductionObjectMultiple')]. Žádný vzkaz ani pozdrav, ale přísahám, že ve vzduchu ještě cítím sladkou vůni, kterou tu po sobě [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'zanechala', 'zanechal')], [ROOT.Char.Custom2('ComplimentAdjective', SCOPE.sC('target'))] jako vždy!"
 seduce_ongoing.4109.a: "Ach, [target.GetFirstNameNoTooltip]!"
 seduce_ongoing.4110.desc: "Dny plynou a [target.GetTitledFirstName] se stále nijak neozývá, a tak se rozhodnu zkusit štěstí ještě jednou — třeba si mého daru vůbec [Select_CString(target.IsFemale, 'nevšimla', 'nevšiml')]?\n\nJak rychle má naděje pohasla, když jsem pod oknem [Select_CString(ROOT.Char.IsFemale, 'našla', 'našel')] svůj dar: [SCOPE.Custom('SeductionObject')]. Otisk podpatku v blátě jasně prozrazoval, co se s ním stalo."
 seduce_ongoing.4110.a: "Mé srdce je stejně zlomené jako [SCOPE.Custom('SeductionObject')]!"
 seduce_ongoing.5001.t_rival: "Můj [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))|U] sok"
 seduce_ongoing.5001.t: "[ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('target'))|U] [Select_CString(target.IsFemale, 'žena', 'muž')]"
 seduce_ongoing.5001.desc_tier_up: "„Čemu vděčím za tu čest, #EMP [ROOT.Char.GetTitleTierName]#!?“ ptá se [target.GetTitledFirstName] s úsměvem, který se ani zdaleka neodráží v očích."
 seduce_ongoing.5001.desc_tier_down: "„To mě ten [target.Custom2('RelationDescriptor', ROOT.Char)] člověk snad nikdy nenechá na pokoji...“ zamumlá [target.GetTitledFirstName], když se blížím. „Co pro tebe mohu udělat, [ROOT.Char.GetTitledFirstNameNoTooltip]?“"
 seduce_ongoing.5001.desc_ending: "\n\nNepřátelství mezi námi jako obvykle doutná pod povrchem, ale mám plán, jak zkrotit bouřlivé city, které k sobě chováme..."
 seduce_ongoing.5001.a: "A co téma „[ROOT.GetCharacter.Custom('education_conversation_subject')]“?"
 seduce_ongoing.5001.a.tt: "#F Zkusím zapůsobit po intelektuální stránce#!"
 seduce_ongoing.5001.b: "A co [mocked_courtier.Custom2('InsultNoun', ROOT.Char)] [mocked_courtier.GetFirstNameNoTooltip]..."
 seduce_ongoing.5001.b.tt: "#F Terčem našeho společného posměchu bude [mocked_courtier.GetTitledFirstNameNoTooltip]; snad tím oslovím zlomyslnou stránku svého protějšku#!"
 seduce_ongoing.5001.c_tier_down: "Otázkou je, co mohu udělat #EMP já#! pro #EMP tebe#!, [Select_CString(target.IsFemale, 'má paní', 'můj pane')]."
 seduce_ongoing.5001.c_tier_up: "Potěšení je na mé straně, [Select_CString(target.IsFemale, 'má paní', 'můj pane')]. To bychom měli napravit."
 seduce_ongoing.5001.c.tt: "#F Zkusím zapůsobit na žádostivou stránku svého protějšku#!"
 seduce_ongoing.5001.d: "Omlouvám se, že ruším. Už odcházím."
 seduce_ongoing.5003.t: "Můj [ROOT.Char.Custom2('RelationDescriptor', SCOPE.sC('owner'))|U] sok"
 seduce_ongoing.5003.opening: "S každým krokem, kterým se ke mně [owner.GetTitledFirstName] blíží, mi nálada klesá. Co zase chce [owner.Custom2('InsultNoun', ROOT.Char)]?\n\n"
 seduce_ongoing.5003.conversation: "K mému překvapení se [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'pustila', 'pustil')] do hovoru na téma „[ROOT.GetCharacter.Custom('education_conversation_subject')]“. Navzdory počáteční nechuti k této společnosti mě rozhovor opravdu zaujal!"
 seduce_ongoing.5003.mockery: "„[ROOT.Char.GetTitledFirstNameNoTooltip]! [mocked_courtier.Custom2('InsultNoun', SCOPE.sC('owner'))] [mocked_courtier.GetFirstName] dnes zase něco [Select_CString(mocked_courtier.IsFemale, 'provedla', 'provedl')]!“\nK mému překvapení jsme si pak docela příjemně popovídali o všech chybách, kterými se [mocked_courtier.GetFirstName] vyznačuje."
 seduce_ongoing.5003.bodily: "Nic mě nemohlo připravit na pokušení obnaženého těla, když si [owner.GetTitledFirstName] odhalí kůži a svrchní oděv jde stranou ([owner.Custom('GetUpperClothingArticle')])."
 seduce_ongoing.5003.fallback: "K mému překvapení spolu strávíme docela příjemný večer. Smějeme se těm nejobyčejnějším věcem a společně se procházíme zahradami."
 seduce_ongoing.5003.a: "Nikdy dřív na mě [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'nezapůsobila', 'nezapůsobil')] tak #EMP příjemně#!!"
 seduce_ongoing.5004.opening: "S každým krokem, kterým se ke mně [owner.GetTitledFirstName] blíží, mi nálada klesá. Co zase chce [owner.Custom2('InsultNoun', ROOT.Char)]?\n\n"
 seduce_ongoing.5004.conversation: "„A pokud jde o téma „[owner.Custom('education_conversation_subject')]“...“\n\nNetuším, proč si [owner.GetTitledFirstName] [Select_CString(owner.IsFemale, 'myslela', 'myslel')], že mě něco takového bude zajímat, ale velmi rychle jsem [Select_CString(ROOT.Char.IsFemale, 'dala', 'dal')] naprosto jasně najevo pravý opak."
 seduce_ongoing.5004.mockery: "„[ROOT.Char.GetTitledFirstNameNoTooltip]! [mocked_courtier.Custom2('InsultNoun', SCOPE.sC('owner'))] [mocked_courtier.GetFirstName] dnes zase něco [Select_CString(mocked_courtier.IsFemale, 'provedla', 'provedl')]!“\n\nNetuším, co [owner.GetTitledFirstName] vedlo k tomu, že se přede mnou terčem pomluv [Select_CString(mocked_courtier.IsFemale, 'stala', 'stal')] [mocked_courtier.GetTitledFirstName], ale nemohlo to skončit dost brzy."
 seduce_ongoing.5004.bodily: "Když se [owner.GetTitledFirstName] přitiskne nepříjemně blízko a začne si vyzývavě pohrávat se svrchním oděvem ([owner.Custom('GetUpperClothingArticle')]), rychle ustoupím."
 seduce_ongoing.5004.fallback: "[owner.GetTitledFirstName] se zjevně [Select_CString(owner.IsFemale, 'rozhodla', 'rozhodl')] strávit se mnou celý den, protože [Select_CString(owner.IsFemale, 'odmítala', 'odmítal')] odejít, dokud jsem [Select_CString(ROOT.Char.IsFemale, 'nedala', 'nedal')] jasně najevo, jak nepříjemná mi je tato společnost."
 seduce_ongoing.5004.a: "Jako vždy nepříjemné setkání!"
 seduce_ongoing.5005.conversation: "Po dlouhém rozhovoru o tématu [target.Custom('herhis_subject_of_interest')] rozzáří [target.GetTitledFirstName] úsměv celou tvář. Když mezi námi zavládne příjemné ticho, uvědomím si, že stojíme mnohem blíž než předtím. Má ruka se téměř otírá o [target.Custom('GetClothingArticle')]."
 seduce_ongoing.5005.mockery: "„...a jak [mocked_courtier.GetTitledFirstName] [mocked_courtier.Custom('quirk_neg_present')] – něco takového jsem ještě [Select_CString(ROOT.Char.IsFemale, 'neviděla', 'neviděl')]!“\n\nSmích na účet [mocked_courtier.GetTitledFirstName] je mnohem upřímnější, než jsem [Select_CString(ROOT.Char.IsFemale, 'doufala', 'doufal')], a když mezi námi zavládne příjemné ticho, uvědomím si, že stojíme mnohem blíž než předtím. Má ruka se téměř otírá o [target.Custom('GetClothingArticle')]."
 seduce_ongoing.5005.bodily: "Dostane se mi jen malé ochutnávky toho, co [target.GetTitledFirstName] nabízí, ale tím víc toužím po dalším. Když se od sebe odtáhneme, zavládne mezi námi příjemné ticho a já si uvědomím, že se v mé společnosti [target.GetTitledFirstName] cítí uvolněněji než kdy dřív – dokonce i [target.Custom('GetUpperClothingArticle')] má nakřivo."
 seduce_ongoing.5005.fallback: "Strávíme večer spolu, povídáme si a smějeme se. Když mezi námi zavládne příjemné ticho, uvědomím si, že stojíme mnohem blíž než předtím. Má ruka se téměř otírá o [target.Custom('GetClothingArticle')]."
 seduce_ongoing.5005.ending: "\n\n„Nikdy by mě nenapadlo, že jsi tak příjemná společnost, [ROOT.Char.GetFirstNameNoTooltip]!“"
 seduce_ongoing.5005.a: "Ještě ukážu, jak příjemnou společností dokážu být!"
 seduce_ongoing.5006.conversation: "Po téměř hodině rozpačitého rozhovoru vypadá [target.GetFirstName] znuděněji, než jsem kdy [Select_CString(target.IsFemale, 'viděl', 'viděl')]. Když téma změním z [target.Custom('herhis_subject_of_interest')] na [ROOT.GetCharacter.Custom('education_conversation_subject')], [target.GetTitledFirstName] [target.Custom('quirk_neg_present')] a omluví se."
 seduce_ongoing.5006.mockery: "„[ROOT.Char.GetTitledFirstNameNoTooltip]! [Select_CString(ROOT.Char.IsFemale, 'Věřila', 'Věřil')] bys, že [mocked_courtier.Custom2('InsultNoun', ROOT.Char)] [mocked_courtier.GetFirstName] skutečně...“\n\nRychle se odmlčím, když vidím, jak se ve tváři [target.GetFirstName] stále zřetelněji zračí opovržení."
 seduce_ongoing.5006.bodily: "Když se s [ROOT.Char.Custom('quirk_pos_adverb')] úsměvem přiblížím k [target.GetFirstName] a svůdně nadzvednu [ROOT.Char.Custom('GetUpperClothingArticle')], [target.GetTitledFirstName] rychle ucouvne s výrazem čirého znechucení."
 seduce_ongoing.5006.fallback: "Marně se snažím najít s [target.GetFirstName] něco společného, ale opovržení je každou minutou patrnější.\n\nZanedlouho se [target.GetTitledFirstName] omluví a prchne z mé společnosti."
 seduce_ongoing.5006.a: "Proč se vůbec snažím dostat do postele někoho, kdo je takový [target.Custom2('InsultNounSexual', ROOT.Char)]?!"
 seduce_ongoing.5011.t: "Dráždivá přitažlivost"
 seduce_ongoing.5011.desc: "Málokdo mě dokáže vyprovokovat tak jako [target.GetTitledFirstName]. Když se ocitneme o samotě, netrvá dlouho a dojde jak na urážky, tak na rány. Já samozřejmě oplácím stejnou měrou.\n\nMusím přiznat, že vzrušení z celé situace – ze rvačky i z těsné blízkosti zpoceného, prudce oddechujícího těla – mi rozpaluje krev v žilách. Zanedlouho už ani nevím, zda se skutečně snažím [target.GetTitledFirstName] přemoci, nebo jen úmyslně protahuji naši potyčku..."
 seduce_ongoing.5011.a: "Ten [target.Custom('quirk_neg_adjective')] úsměv z tváře zmizí!"
 seduce_ongoing.5011.b: "Mohu ti pomoci vstát?"
 seduce_ongoing.5011.c: "Příští rána poteče krev."
 seduce_ongoing.5011.c.tt: "#F Co všechno člověk pro lásku nevytrpí!#!\nTato možnost je dostupná díky sadistickému rysu postavy [target.GetFirstNameNoTooltip]\n\n"
 seduce_ongoing.5011.d: "Prát se jako malé děti přece nemůže být cesta k srdci!"
 seduce_ongoing.5012.desc: "Málokdo mě dokáže vyprovokovat tak jako [owner.GetTitledFirstName]. Když se ocitneme o samotě, netrvá dlouho a vzájemně se zahrnujeme urážkami i ranami.\n\nMusím přiznat, že vzrušení z celé situace – ze rvačky i z těsné blízkosti jiného zpoceného, prudce oddechujícího těla – mi rozpaluje krev v žilách. A [owner.GetTitledFirstName] rozhodně nevypadá, že by [Select_CString(owner.IsFemale, 'hodlala', 'hodlal')] polevit."
 seduce_ongoing.5012.a: "Jen ať mě nešetří!"
 seduce_ongoing.5012.b: "Dost! Nech mě být."
 seduce_ongoing.5013.desc: "S [target.GetTitledFirstName] skončíme na zemi a pereme se jako malé [target.Custom('GirlsBoysChildren')]. Naše zamračené tváře se brzy mění v úsměvy, pěsti v pohlazení a nadávky ve vzdechy...\n\nJestli si [target.GetTitledFirstName] všimne, že v pevném sevření setrvávám déle, než je nutné, zjevně mu to nevadí."
 seduce_ongoing.5013.a: "Je dobré občas upustit páru!"
 seduce_ongoing.5014.desc: "S [target.GetTitledFirstName] skončíme na zemi a pereme se jako malé [target.Custom('GirlsBoysChildren')], ale zamračený výraz se brzy mění v bolestivou grimasu.\n\n„Nech toho, ty hrubiáne!“"
 seduce_ongoing.5014.a: "Tohle se nepovedlo."
 seduce_ongoing.5015.desc: "Málokdo mě dokáže vyprovokovat tak jako [owner.GetTitledFirstName]. Když se ocitneme o samotě, netrvá dlouho a vzájemně se zahrnujeme urážkami i ranami.\n\nMusím přiznat, že mě překvapí, když ke mně [owner.GetTitledFirstName] natáhne ruku a nabídne mi pomoc na nohy."
 seduce_ongoing.5015.a: "Děkuji, [owner.GetFirstNameNoTooltip]."
 seduce_ongoing.5015.b: "Za koho se vůbec považuje?!"
 seduce_ongoing.5016.desc: "S [target.GetTitledFirstName] skončíme na zemi a pereme se jako malé [target.Custom('GirlsBoysChildren')], ale naše zamračené tváře se brzy mění v úsměvy.\n\nKdyž nabídnu pomocnou ruku, [target.GetTitledFirstName] ji přijme a vděčně kývne."
 seduce_ongoing.5017.desc: "S [target.GetTitledFirstName] skončíme na zemi a pereme se jako malé [target.Custom('GirlsBoysChildren')], ale zamračený výraz se brzy mění v bolestivou grimasu, která se ještě prohloubí, když se postavím a nechám [target.GetTitledFirstName] na zemi.\n\n„Ani mi nepomůžeš vstát... Od někoho, kdo je takový [owner.Custom2('InsultNoun', ROOT.Char)], jsem [Select_CString(target.IsFemale, 'nemohla', 'nemohl')] čekat nic jiného.“"
 seduce_ongoing.5018.desc: "Málokdo mě dokáže vyprovokovat tak jako [owner.GetTitledFirstName]. Když se ocitneme o samotě, netrvá dlouho a vzájemně se zahrnujeme urážkami i ranami.\n\nPo krátkém zaváhání z druhé strany získám v potyčce převahu a nemohu si pomoci, ale pohled na [owner.GetTitledFirstName], zadýchaně a poddajně vydanou mou milost, si vychutnávám."
 seduce_ongoing.5018.a: "Krčit se přede mnou ti sluší!"
 seduce_ongoing.5018.b: "Tohle je ubohé. Nech mě být."
 seduce_ongoing.5019.desc: "Když nade mnou stojí [target.GetTitledFirstName], nedokážu potlačit záchvěv strachu, který mi proběhne po zádech při pohledu na potěšení v očích. Alespoň se zdá, že mé gesto padlo na úrodnou půdu..."
 seduce_ongoing.5019.a: "To zachvění bylo očekáváním! O-opravdu!"
 seduce_ongoing.5020.desc: "Když nade mnou stojí [target.GetTitledFirstName], nedokážu potlačit záchvěv strachu, který mi proběhne po zádech při pohledu na potěšení v očích. Když se však [target.GetTitledFirstName] s pohrdavým úšklebkem odvrátí, zaplaví mě zároveň úleva i zklamání.\n\n„Nikdy mě nedokážeš uspokojit. Nech mě být, [ROOT.Char.GetFirstNameNoTooltip].“"
 seduce_ongoing.5020.a: "Mohlo to dopadnout lépe... Ale také hůř!"
 seduce_ongoing.5101.t: "Povinnosti a touhy"
 seduce_ongoing.5101.desc: "[target.GetTitledFirstName] se mnou často mluví způsobem, z něhož je zřejmé, že služba mně mezi námi vytváří odstup.\n\nMusím dát najevo, že netoužím jen po službách svého vazala. Toužím po blízkosti, dotecích a těch svůdných rtech."
 seduce_ongoing.5101.a: "Před [ROOT.Char.GetFaith.HighGodNameAlternate] jsme si rovni, [target.GetFirstNameNoTooltip]!"
 seduce_ongoing.5101.a.tt: "#F Zdůrazním, co máme společného#!"
 seduce_ongoing.5101.success_tt: "Pokud [target.GetFirstNameNoTooltip] zareaguje kladně:"
 seduce_ongoing.5101.b: "Můžeš mi sloužit i jinými způsoby, [target.GetFirstNameNoTooltip]..."
 seduce_ongoing.5101.b.tt: "#F Zdůrazním svou moc#!"
 seduce_ongoing.5101.c: "Prozatím bych si [Select_CString(ROOT.Char.IsFemale, 'měla', 'měl')] své city nechat pro sebe."
 seduce_ongoing.5101.c.tt: "#F Jistě existují lepší způsoby, jak dát své city najevo.#!"
 seduce_ongoing.5102.desc: "„Možná ti vládnu jako [owner.GetTitleTierName], ale vždy jsem nás [Select_CString(owner.IsFemale, 'považovala', 'považoval')] za sobě rovné.“ [owner.GetFirstName] za mnou přichází a zpočátku netuším proč, ale brzy je vše jasné. „My dva... tohle mezi námi... Tituly nás nemusí svazovat. Nejsme jen jména. Jsme mnohem víc.“"
 seduce_ongoing.5102.a: "Lichotí mi pozornost [ROOT.Char.Custom2(''RelationToMe'Possessive', SCOPE.sC('owner'))]."
 seduce_ongoing.5102.b: "Nechci nic víc než to, co už mezi námi je."
 seduce_ongoing.5103.desc: "[ROOT.Char.GetTitledFirstName],\nPro mě jsi [target.Custom2('RelationToMe', ROOT.Char)] a lichotí mi, že nás nevnímáš jen jako lenního pána a vazala, ale v mnoha ohledech jako sobě rovné. Kéž nás oba čeká stejně zářná budoucnost."
 seduce_ongoing.5103.a: "[target.GetFirstNameNoTooltip], ještě tě získám!"
 seduce_ongoing.5104.desc: "[owner.GetFirstName]! Pro mě jsi [target.Custom2('RelationToMe', SCOPE.sC('owner'))]!\nTo, co naznačuješ a co po mně žádáš, je naprosto nepřípustné! Mám vůči panství povinnosti vyplývající ze své služby, ale mou věrnost si nepleť s touhou."
 seduce_ongoing.5104.a: "Ach, ale [target.GetFirstNameNoTooltip]..."
 seduce_ongoing.5105.desc: "„Sloužíš mi vždy tak dobře a věrně.“ [owner.GetFirstName] za mnou přichází a zpočátku netuším proč, ale brzy je vše jasné. „Nechci jen tvou vazalskou službu. Toužím po tobě jako po [Select_CString(target.IsFemale, 'ženě', 'muži')]. Služ takto i [Select_CString(owner.IsFemale, 'své paní', 'svému pánovi')]!“"
 seduce_ongoing.5105.a: "Dokážu o tebe pečovat tak, jak nikdo jiný."
 seduce_ongoing.5105.b: "Máš mou povinnou službu, ale nic víc nikdy nedostaneš."
 seduce_ongoing.5106.desc: "[ROOT.Char.GetTitledFirstName],\nPro mě jsi [target.Custom2('RelationToMe', ROOT.Char)] a lichotí mi, že i někdo tak pokorně oddaný tvé službě v tobě může probouzet takové city. Uvidíme, kam nás čas zavede."
 seduce_ongoing.5201.t: "Více než přátelé"
 seduce_ongoing.5201.desc: "S [target.GetFirstName] procházíme [court_location.GetNameNoTier]. Je to [court_location.Custom('BaronyTownType')].\n\nKdyž dorazíme na náměstí s půvabnou kašnou, zastavíme se a pozorujeme ruch kolem sebe. Na okamžik přestaneme vnímat i svůj doprovod. "
 seduce_ongoing.5201.a: "Hoďme minci a přejme si lásku!"
 seduce_ongoing.5201.a.tt: "Myslím, že [target.GetTitledFirstName] už fantazíruje o nás dvou, nebo alespoň o lásce obecně"
 seduce_ongoing.5201.b: "Vzpomínáš, jak jsme tehdy..."
 seduce_ongoing.5201.b.tt: "Myslím, že si [target.GetTitledFirstName] našeho přátelství opravdu váží"
 seduce_ongoing.5201.c: "Nebudu tuhle chvíli kazit."
 seduce_ongoing.5202.desc: "[owner.GetFirstName] je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] a společně procházíme [court_location.GetNameNoTier]. Je to [court_location.Custom('BaronyTownType')]. Když dorazíme na náměstí s půvabnou kašnou, zastavíme se.\n\n„Hodíme tam spolu minci, [ROOT.Char.Custom('FormOfAddressForLiege')]? Říká se, že přináší štěstí v lásce...“"
 seduce_ongoing.5202.a: "Tak rovnou tři, pro větší štěstí!"
 seduce_ongoing.5202.b: "Tohle dělají zamilované páry, ne přátelé."
 seduce_ongoing.5203.desc: "[target.GetFirstName] se s úsměvem postaví po mém boku, vhodí minci do vody a pohlédne mi do očí.\n\nSpolečné přání pak celé naší další procházce dodá příjemně důvěrný tón."
 seduce_ongoing.5203.a: "Opravdu je [target.Custom2('ComplimentAdjectiveArticle', ROOT.Char)] [target.GetWomanMan]!"
 seduce_ongoing.5204.desc: "„Jakou hloupou hru to hraješ, [ROOT.Char.GetFirstNameNoTooltip]?“\n\n[target.GetFirstName] odmítne mé přání, abychom si společně přáli lásku. Zbytek procházky strávíme v napjatém tichu a brzy se rozloučíme."
 seduce_ongoing.5204.a: "Má nálada potemněla jako hlubiny té kašny..."
 seduce_ongoing.5205.desc: "[owner.GetFirstName] je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] a společně procházíme [court_location.GetNameNoTier]. Je to [court_location.Custom('BaronyTownType')]. Přitom vzpomínáme na staré časy.\n\n„Vzpomínáš na tu noc, kdy jsme spolu zůstali až hluboko do noci, spřádali plány do budoucna a představovali si, že bude společná...?“"
 seduce_ongoing.5205.a: "Na to se přece nedá zapomenout."
 seduce_ongoing.5205.b: "Proč [owner.GetFirstName] vytahuje tu trapnou noc?!"
 seduce_ongoing.5206.desc: "S [target.GetFirstName] celé hodiny vzpomínáme na minulost a vymýšlíme, jak by mohla vypadat naše společná budoucnost.\n\nZbytek procházky se nese v příjemném duchu a já si nemohu pomoci, ale doufám, že některé z našich hravých představ se jednou stanou skutečností."
 seduce_ongoing.5207.desc: "„Naše přátelství pro mě tolik znamená, [ROOT.Char.GetFirstNameNoTooltip], že bych na něm nikdy [Select_CString(target.IsFemale, 'nechtěla', 'nechtěl')] nic měnit.“\n\n[target.GetFirstName] dává jasně najevo, že o úvahy nad tím, co mezi námi mohlo být nebo ještě může vzniknout, nemá zájem. Zbytek procházky strávíme v napjatém tichu a brzy se rozloučíme."
 seduce_ongoing.5207.a: "Nu, to mohlo dopadnout lépe!"
 seduce_ongoing.5301.t: "Chvíle o samotě"
 seduce_ongoing.5301.desc: "Nikomu by nepřišlo divné, že [target.GetFirstName] je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] a sedí se mnou u krbu až do pozdního večera. Přesto je ve vzduchu cítit napětí.\n\nPo ničem netoužím víc než přitáhnout si [target.GetFirstName] k sobě a strhnout šaty z toho těla. Kdyby však mé touhy vyšly najevo, [target.GetFirstName] [Select_CString(target.IsFemale, 'by se zděsila', 'by se zděsil')]. Nebo snad ne...?"
 seduce_ongoing.5301.a: "Jediný dotek ruky by řekl vše."
 seduce_ongoing.5301.a.tt: "#F Doufám, že mé nenápadné náznaky budou dobře přijaty#!"
 seduce_ongoing.5301.b: "Jsme sami a ty rty si neodepřu."
 seduce_ongoing.5301.b.tt: "#F Doufám, že můj otevřeně projevený zájem bude dobře přijat#!"
 seduce_ongoing.5301.c: "Byla by strašná škoda pokazit tak nádherný večer."
 seduce_ongoing.5301.c.tt: "#F Budou jiné příležitosti. [target.GetFirstNameNoTooltip] je přece [THIS.Char.Custom2('RelationToMe', SCOPE.sC('target'))] a nikam neodchází.#!"
 seduce_ongoing.5301.success_tt: "Pokud [target.GetFirstName] mé návrhy opětuje:"
 seduce_ongoing.5302.desc: "Působí to tak přirozeně, že si toho zprvu ani nevšimnu. [owner.GetFirstName] je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))]. Když však sedíme před krbem, sevře mi ruku s intenzitou, která dalece přesahuje vše, co by bylo běžné u někoho, kdo je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))].\n\nCítím, jak se tep zrychluje touhou."
 seduce_ongoing.5302.a: "Odmítám věřit, že to, co cítím, je špatné."
 seduce_ongoing.5302.b: "Tvoje pozornost mi lichotí, ale jsi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))]. Ne."
 seduce_ongoing.5303.desc: "[target.GetFirstName] ani necukne, když sevřu tu druhou ruku, přestože oba dobře víme, co to znamená. Jak náš rozhovor pokračuje, cítím, že se tep zrychluje. Dlaň se mi potí a dech se krátí, než-\n#EMP Co to bylo?#! Ach, jen sluha.\n\n[target.GetFirstName] je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))] a oba se omluvíme, než odejdeme. Každý zvlášť."
 seduce_ongoing.5303.a: "Vím, že jsi to [Select_CString(target.IsFemale, 'cítila', 'cítil')] také, [target.GetFirstNameNoTooltip]."
 seduce_ongoing.5304.desc: "Snažím se vše obrátit v žert, ale mé úmysly jsou [target.GetFirstName] naprosto jasné.\n\n„[target.Custom2('RelationToMe', SCOPE.sC('owner'))]... a něco takového? Tohle se nikdy nesmí stát!“ [target.GetFirstName] odejde a nechá mě sedět o samotě u ohně."
 seduce_ongoing.5304.a: "Vím, že jsi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))], ale přesto..."
 seduce_ongoing.5305.desc: "Všechno se seběhne tak náhle, a přesto mě to nepřekvapí. Ještě před chvílí jsme seděli u ohně a vzápětí se ke mně můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))] nakloní blíž. Pak se naše rty spojí a ruce mi laskají šíji, ramena, stehna, slabiny-\n\nZvuk blížícího se sluhy nás přiměje rychle od sebe odskočit a mé myšlenky konečně doženou mou touhu."
 seduce_ongoing.5305.a: "Jako by konečně bylo vše tak, jak má být."
 seduce_ongoing.5306.desc: "[target.GetFirstName] můj polibek opětuje a na několik okamžiků, kdy mi srdce divoce buší, je celý svět přesně takový, jaký má být. Samozřejmě to nemůže trvat věčně a než nás zahlédne procházející sluha, spěšně se od sebe odtrhneme.\n\nKdyž se pak každý vydáme svou cestou, [target.GetFirstName] na mě pohlédne. „Až dosud jsem tomu úplně [Select_CString(target.IsFemale, 'nerozuměla', 'nerozuměl')], [target.Custom2('RelationToMe', SCOPE.sC('owner'))].“"
 seduce_ongoing.5306.a: "Ty a já, můj nejdražší [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))]."
 seduce_ongoing.5307.desc: "[target.GetFirstName] se na okamžik zcela ztratí v polibku, zatímco mé ruce hladově bloudí po těle. Pak mě však odstrčí. „Co si myslíš, že děláš?! Vždyť jsi můj [target.Custom2('RelationToMe', SCOPE.sC('owner'))]!“\n\nNež stačím cokoli říct nebo své jednání nějak vysvětlit, [target.GetFirstName] vyběhne z místnosti."
 seduce_ongoing.5307.a: "[target.GetFirstNameNoTooltip], opravdu jsem si [Select_CString(ROOT.Char.IsFemale, 'myslela', 'myslel')]..."
 seduce_ongoing.6001.t: "Pouhá zvědavost"
 seduce_ongoing.6001.desc: "Při návštěvách cizích dvorů se vyplácí trávit čas s dvořany a poznat tak lépe jejich lenního pána. A pokud je tím dvořanem právě [target.GetTitledFirstName], tím lépe.\n\nNa mé otázky odpovídá svědomitě a mám pocit, že bych [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] naslouchat celý den. Zdá se navíc, že [target.GetTitledFirstName] si povídání docela užívá."
 seduce_ongoing.6001.a: "Tvůj [target.Custom2('RelationToMe', SCOPE.sC('court_owner'))] je zajímavý, ale co máš [Select_CString(target.IsFemale, 'ráda', 'rád')] #EMP ty#!?"
 seduce_ongoing.6001.b: "Jistě se o mně [court_owner.GetFirstNameNoTooltip] zmíníš?"
 seduce_ongoing.6011.t: "Ukázka síly"
 seduce_ongoing.6011.desc: "Sleduji vojáky na nádvoří, jak znovu a znovu procvičují dril podle mých pokynů. Pozoruji je tak soustředěně, že si ani nevšimnu, když se vedle mě objeví [target.GetTitledFirstName].\n\n„Pohybují se dobře, ale támhle [Select_CString(dummy_gender.IsFemale, 'ta žena je pořád', 'ten muž je pořád')] o půl kroku pozadu.“"
 seduce_ongoing.6011.a: "Působivé! Máme toho společného víc, než jsem si [Select_CString(ROOT.Char.IsFemale, 'myslela', 'myslel')]."
 seduce_ongoing.6011.b: "Máš bystré oko!"
 seduce_ongoing.6011.c: "Je to klamný manévr. Jen sleduj, co přijde teď..."
 seduce_ongoing.6021.t: "Spřízněné mysli"
 seduce_ongoing.6021.desc: "Překvapilo mě, že se s [target.GetTitledFirstName] tak zabereme do hovoru o vojenství, ale zdá se, že toto téma vzbuzuje téměř stejnou vášeň na obou stranách. A znalosti, které [target.GetTitledFirstName] má, jsou neuvěřitelné!"
 seduce_ongoing.6021.a: "[target.GetFirstNameNoTooltip], za celý svůj život jsem nic takového [Select_CString(ROOT.Char.IsFemale, 'neslyšela', 'neslyšel')]!"
 seduce_ongoing.6021.b: "[target.GetFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale, 'netušila', 'netušil')] jsem, kolik toho máme společného."
 seduce_ongoing.6021.c: "Pověz mi víc o svých názorech na jezdecké formace..."
 seduce_ongoing.6031.t: "Síť"
 seduce_ongoing.6031.desc: "Stejně jako já má i [target.GetTitledFirstName] vlastní síť špehů, kteří sahají všude, kam mohou, a pátrají po nejrůznějších skrytých tajemstvích. [Select_CString(ROOT.Char.IsFemale, 'Mohla', 'Mohl')] bych jim dovolit, aby „odhalili“ mé úmysly vůči [target.GetFirstName], a nechat tak [target.GetFirstName] uvěřit, že má navrch."
 seduce_ongoing.6031.a: "A také jim dám vědět, že vím, že oni vědí..."
 seduce_ongoing.6031.b: "Postarám se, aby špehové narazili na #EMP něco zajímavého.#!"
 seduce_ongoing.6031.c: "Ach, jak skvělá příležitost si to procvičit!"
 seduce_ongoing.6041.t: "Poznání touhy"
 seduce_ongoing.6041.desc: "Při snaze získat náklonnost [target.GetTitledFirstName] by mi nesmírně pomohlo přesně vědět, co se [target.GetFirstName] líbí a čemu dává přednost..."
 seduce_ongoing.6041.a: "#EMP Pche#!, tohle ani není výzva!"
 seduce_ongoing.6041.b: "Určitě dokážu [target.GetFirstName] přesvědčit, aby mi to [Select_CString(target.IsFemale, 'prozradila', 'prozradil')]."
 seduce_ongoing.6041.b.success: "Dozvím se více o zálibách postavy [target.GetFirstName]"
 seduce_ongoing.6041.b.failure: "[target.GetFirstName] se mým otázkám vyhne"
 seduce_ongoing.6041.c: "Moji špehové to zjistí raz dva."
 seduce_ongoing.6041.c.success: "Moji špehové uspějí"
 seduce_ongoing.6041.c.failure: "[target.GetFirstName] mým špehům unikne"
 seduce_ongoing.6041.d: "Víš co? Prostě se zeptám."
 seduce_ongoing.6042.desc: "Tohle je velmi zajímavé... [target.GetFirstName] má vytříbený vkus."
 seduce_ongoing.6042.a: "To mi pomůže získat náklonnost."
 seduce_ongoing.6043.desc: "Zdá se, že jsem při rozhovoru s [target.GetFirstName] možná [Select_CString(ROOT.Char.IsFemale, 'nebyla', 'nebyl')] právě nejdiskrétnější. Teď si [target.GetFirstName] láme hlavu nad tím, proč mě tak nezdravě zajímají všechny ty cennosti!"
 seduce_ongoing.6043.a: "To pro mě nevěstí nic dobrého."
 seduce_ongoing.6051.t: "Závoj zdvořilosti"
 seduce_ongoing.6051.close: "Všechno jsem [Select_CString(ROOT.Char.IsFemale, 'vydávala', 'vydával')] za příležitost procvičit si diplomatickou zdvořilost. Jsem si [Select_CString(ROOT.Char.IsFemale, 'jistá', 'jist')], že [target.GetTitledFirstName] mou záminku [Select_CString(target.IsFemale, 'prohlédla', 'prohlédl')], ale přesto [Select_CString(target.IsFemale, 'souhlasila', 'souhlasil')]."
 seduce_ongoing.6051.far: "Návštěva cizího dvora je vždy dobrou záminkou k výměně diplomatických zdvořilostí. Naštěstí mi [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'ochotně vyšla', 'ochotně vyšel')] vstříc."
 seduce_ongoing.6051.end: "\n\nKomukoli zvenčí mohla naše slova znít jako prázdné fráze diktované tradicí. Pro nás však byla vášeň doutnající pod jejich povrchem spalujícím ohněm."
 seduce_ongoing.6051.a: "Ach, jak osvěžující!"
 seduce_ongoing.6051.b: "Některé z těch náznaků, [target.GetFirstNameNoTooltip]..."
 seduce_ongoing.6051.c: "Takového cvičení potřebuji víc."
 seduce_ongoing.7001.t: "Pod všemi těmi vrstvami"
 seduce_ongoing.7001.desc: "Jak mám na [target.GetTitledFirstName] zapůsobit? Na první pohled působí uzavřeně a zdá se, že dává přednost tichu před společností druhých. Kdo ale ví, jaký člověk se skrývá za touto tváří v soukromí? Je snad [target.GetTitledFirstName] mírný a poddajný člověk, nebo naopak vášnivý a prudký?\n\nZjistím to, až se mi podaří proniknout skrz tu kamennou slupku. Prozatím se musím rozhodnout, jak zařídit, aby na mě [target.GetFirstName] [Select_CString(target.IsFemale, 'myslela', 'myslel')] i poté, co spolu strávíme chvíli o samotě."
 seduce_ongoing.7001.a: "Budu co nejgalantnější a nejokouzlující."
 seduce_ongoing.7001.a.tt: "#F Myslíš si, že [target.GetFirstNameNoTooltip] skrývá romantickou stránku a dává přednost vášnivým milencům#!"
 seduce_ongoing.7001.b: "Přistoupím k [target.GetFirstNameNoTooltip] něžně – jako přítel."
 seduce_ongoing.7001.b.tt: "#F Myslíš si, že [target.GetFirstNameNoTooltip] dává přednost něžným milencům#!"
 seduce_ongoing.7001.c: "Prostě si počkám na správnou příležitost..."
 seduce_ongoing.7101.desc_opening: "Podaří se mi zastihnout [target.GetTitledFirstName] o samotě. Nespěchám a střídám lichotky s nenuceným hovorem. A když konečně nastane správná chvíle, "
 seduce_ongoing.7101.desc_can_touch_arms: "natáhnu ruku a sevřu dlaň [target.GetFirstName] ve své."
 seduce_ongoing.7101.desc_cannot_touch_arms: "přistihnu se, jak sahám po ruce [target.GetFirstName], ale stáhnu se dřív, než si toho všimne."
 seduce_ongoing.7101.desc_closing: "Otevřeně vyznám [target.GetFirstNameNoTooltip] své city a přísahám věčnou lásku. \n\n„Ani v nejdivočejších snech by mě nenapadlo, že dokážeš být tak vášnivý[Select_CString(owner.IsFemale, 'á', '')], [owner.GetFirstNameNoTooltip]!“ vykřikne [target.GetFirstName] a horečně se ovívá.\n\nMé vyznání sice neopětuje, ale jsem si jist[Select_CString(ROOT.Char.IsFemale, 'á', '')], že rudé uši jsou jasným důkazem toho, jak prudce se po mých smělých slovech červená."
 seduce_ongoing.7101.a: "Brzy budou mé city jistě opětovány."
 seduce_ongoing.7102.desc: "Snažím se vytvořit příležitost, abych s [target.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale, 'strávila', 'strávil')] chvíli o samotě, ale romantická nálada mezi námi zkrátka nepřichází sama. Přesto se rozhodnu zariskovat, i když okolnosti nejsou právě ideální. Nakloním se blíž, abych [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] šeptat sladká slovíčka do ucha, ale než vůbec něco řeknu, [target.GetFirstNameNoTooltip] ucukne, jako by se [Select_CString(target.IsFemale, 'spálila', 'spálil')], a rázně odejde.\n\nNevím, zda za tím byla nezkušenost, odpor, nebo ostych. Jedno však vím jistě – mohlo to dopadnout lépe."
 seduce_ongoing.7102.a: "[Select_CString(ROOT.Char.IsFemale, 'Měla', 'Měl')] bych svůj přístup přehodnotit..."
 seduce_ongoing.7201.desc: "„[Select_CString(ROOT.Char.IsFemale, 'Ráda', 'Rád')] bych tě lépe [Select_CString(ROOT.Char.IsFemale, 'poznala', 'poznal')].“\n[target.GetTitledFirstName] zprvu působí napjatě, ale postupně se uvolní, jakmile začne věřit, že za mou žádostí není žádný postranní úmysl.\n\nNež se rozejdeme, poděkuji [target.GetFirstNameNoTooltip] za příjemně strávený čas a dostane se mi na oplátku trochu nejistého úsměvu. Sotva by se dalo říct, že by dnešní chvíle vešla do dějin, ale jedno je jisté: [target.GetFirstNameNoTooltip] jsem nikdy během jediného dne [Select_CString(ROOT.Char.IsFemale, 'neviděla', 'neviděl')] tolikrát se usmát. Jsem si [Select_CString(ROOT.Char.IsFemale, 'jistá', 'jist')], že na mě ještě dlouho nezapomene."
 seduce_ongoing.7202.desc: "Zastihnout [target.GetTitledFirstName] o samotě nebylo těžké. Ukázalo se však, že skutečnou výzvou je vést normální rozhovor. Položím otázku a [target.GetFirstName] odpoví tím nejstručnějším způsobem, jaký jen dokáže vymyslet, jen aby náš rozhovor okamžitě [Select_CString(target.IsFemale, 'utnula', 'utnul')]. Připadám si, jako bych [Select_CString(ROOT.Char.IsFemale, 'trhala', 'trhal')] jeden zub za druhým bez konce!"
 seduce_ongoing.7202.desc_animal: "\n\nNemohu se zbavit dojmu, že i mrtvý [ROOT.Char.Custom('GetAnimalType')] by mi odpovídal živěji než [target.GetFirstNameNoTooltip]."
