l_polish:
 seduce_outcome.permanent_block: "[owner.GetTitledFirstName] už se mě nikdy nepokusí svést"
 seduce_outcome.cooldown: "[owner.GetTitledFirstName] se mě nějakou dobu znovu nepokusí svést"
 seduce_outcome.0001.t: "Teď, nebo nikdy"
 seduce_outcome.0001.desc: "[target.GetTitledFirstName] mi svými reakcemi na mé pokusy o svedení prozrazuje vše, co potřebuji vědět. Nastal čas uvést můj plán do pohybu.\n\n"
 seduce_outcome.0001.positive.desc: "Myslím, že mé vyhlídky jsou dobré, ale nesmím zapomínat, že [discoverer.Custom2('NamePossessiveCharacterIntroduction', target)|l] mě neustále sleduje..."
 seduce_outcome.0001.negative.desc: "Přesto se obávám následků. [discoverer.Custom2('NamePossessiveCharacterIntroduction', target)|U] může mít své lidi v každém stínu a nastražené uši za každou zdí..."
 seduce_outcome.0001.a: "[target.GetFirstNameNoTooltip] mi podlehne!"
 seduce_outcome.0001.a.tt: "[target.GetTitledFirstName] zůstává cílem tvého pokusu o svedení"
 seduce_outcome.0001.b: "Nemohu riskovat odhalení."
 seduce_outcome.0003.t: "Smyslná nabídka"
 seduce_outcome.0003.success.desc: "[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] si [Select_CString(owner.IsFemale, 'našla', 'našel')] cestu do mého života sladkými slovy a ještě sladšími doteky. Když se noc nachýlí, jen stěží dokážu myslet na cokoli jiného...\n\nTo, co mezi námi doutná, brzy buď vzplane, nebo vyhasne."
 seduce_outcome.0003.failure.desc: "Kamkoli se vydám, [owner.Custom2('MyCharacterIntroduction', ROOT.Char)|l] je mi v patách. Ten pohled v očích, ta slova na rtech... Vím naprosto přesně, co chce."
 seduce_outcome.0003.a.success: "Chci navždy hořet v tomhle žáru!"
 seduce_outcome.0003.a.failure: "Nechám si [Select_CString(owner.IsFemale, 'ji', 'ho')] nablízku. #EMP Hodně#! nablízku."
 seduce_outcome.0003.a.tt: "[owner.GetShortUIName|U] se možná stane [Select_CString(owner.IsFemale, 'tvou', 'tvým')] [Concept('lover',Select_CString(owner.IsFemale, 'milenkou', 'milencem'))|E]"
 seduce_outcome.0003.b.success: "Tahle romance prudce vzplane, ale brzy dohoří."
 seduce_outcome.0003.b.failure: "Pro dnešní noc dobré rozptýlení, ale nic víc."
 seduce_outcome.0003.c: "Jak sladké... ale ne."
 seduce_outcome.0003.d: "Nikdy! Celý svět se dozví, co je [owner.GetShortUIName|U] zač!"
 seduce_outcome.0003.e: "Už mě všichni nechte na pokoji!"
 seduce_outcome.0003.e.tt: "Po dobu #V 10#! let se tě nikdo nepokusí svést"
 seduce_outcome.0004.t: "[target.Custom('LoverPetName_uppercase')]"
 seduce_outcome.0004.desc: "V náručí mi spí [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('target'))|l] [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target') )|l], a já se při tom pohledu samou spokojeností a blahem usmívám.\n\nA pomyslet, že city a oddanost, které cítím, jsou opětovány!"
 seduce_outcome.0004.a: "Jsem nejšťastnější [Select_CString(ROOT.Char.IsFemale, 'žena', 'muž')] pod sluncem!"
 seduce_outcome.0005.t: "Tragicky přerváno"
 seduce_outcome.0005.desc: "[target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target') )|l], [Select_CString(target.IsFemale, 'zemřela', 'zemřel')], a s [Select_CString(target.IsFemale, 'ní', 'ním')] ztratily smysl i mé plány na naši společnou budoucnost.\n\nAť mezi námi kdysi mohlo být cokoli, teď je to mrtvé."
 seduce_outcome.0005.a: "Kéž se mi [Select_CString(target.IsFemale, 'její', 'jeho')] srdce podařilo získat dřív!"
 seduce_outcome.2000.t: "Tajné požehnání"
 seduce_outcome.2000.desc: "Když se [target.GetTitledFirstName] a já tajně setkáme, naplňuje mě bázeň a touha mnohem tělesnější než duchovní. Jistě přede mnou ještě nikdo nepřijal požehnání [Select_CString(target.IsFemale, 'Její Svatosti', 'Jeho Svatosti')] právě takovým způsobem.\n\nKdyž ke mně [target.GetTitledFirstName] natáhne ruku, zavřu oči a pokleknu..."
 seduce_outcome.2000.a: "[target.GetFirstNameNoTooltip] má klíč k mému království."
 seduce_outcome.2000.b: "Požehnání je mé."
 seduce_outcome.2010.t: "In Vino Voluptas"
 seduce_outcome.2010.desc: "Mířím do komnat, kde [target.GetName] přebývá, s dvojí žízní a zásobou vína, které uhasí tu první. Okamžitě je zřejmé, že [target.GetName] touží po tomtéž co já.\n\nPrvní polibek zpečetí naši dohodu a následující den i noc už jen pijeme, milujeme se, pijeme, milujeme se..."
 seduce_outcome.2010.a: "Ach, kéž to nikdy neskončí!"
 seduce_outcome.2010.b: "Sladké zapomnění, obejmi mě."
 seduce_outcome.2020.t: "Na latríně"
 seduce_outcome.2020.desc: "Latrína je stísněná a vzduch páchne tím, co tu bylo nedávno zanecháno. Je tu však soukromí. Tolik soukromí...\n\n[target.GetName] na mě hledí hladově a svléká se. Udělám totéž a při polibku nás zaplaví vlna chtíče, která nám dá zapomenout na nepohodlí stísněného prostoru i na žalostné výjevy a pachy kolem nás."
 seduce_outcome.2020.a: "Tohle bychom měli zopakovat, ale možná někde jinde..."
 seduce_outcome.2020.b: "Na latrínu se přece chodí pro úlevu."
 seduce_outcome.2030.t: "Hlad těla"
 seduce_outcome.2030.a.desc: "Jídlo. Vím, že [target.GetFirstNameNoTooltip] jídlu neodolá, a zásob je víc než dost. Stačí mi pokynout a [target.GetFirstNameNoTooltip] se ochotně svlékne a ulehne. Připravím vše, co potřebuji, a rozložím sýr, ovoce a med na [Select_CString(target.IsFemale, 'její', 'jeho')] tělo i všude kolem. "
 seduce_outcome.2030.alcohol.desc: "Pak [Select_CString(target.IsFemale, 'jí', 'mu')] po hrudi rozliji štědrou dávku vína."
 seduce_outcome.2030.b.desc: "\n\nPolibek, dotek a vzápětí nás oba pohltí rozkoš. Když se chuť a vůně [Select_CString(target.IsFemale, 'jejího', 'jeho')] těla mísí s chutí a vůní jídla, zavřu oči a rozesměji se. Tohle je sladký život!"
 seduce_outcome.2030.a: "Kéž takových chvil zažijeme ještě mnoho!"
 seduce_outcome.2030.b: "To byla hostina!"
 seduce_outcome.2040.t: "Do průlomu"
 seduce_outcome.2040.desc: "Jak se stíny prodlužují, ve tmě pod zdí, za níž stojí [owner.Custom('ResidenceBuilding')|l], na mě čeká [target.GetTitledFirstName].\n\nNejprve ke mně přichází váhavě, pak stále dychtivěji. Když [Select_CString(target.IsFemale, 'ji', 'ho')] přitáhnu k sobě, slyším, jak se [Select_CString(target.IsFemale, 'jí', 'mu')] zrychluje dech. Ve stínu zdi se oddáme jeden druhému, zatímco hlídkující stráže nemají o naší vášni ani tušení..."
 seduce_outcome.2040.a: "Ještě jednou!"
 seduce_outcome.2040.b: "Jakmile padne [owner.Custom('ResidenceBuilding')|l], stahuji se."
 seduce_outcome.2050.t: "Tajné sliby"
 seduce_outcome.2050.desc: "Scházíme se tajně pod rouškou noci, ukryti před zraky i sluchem okolního světa. Můj slib zní: „Vezměme se doopravdy, ale tajně. Nikdo kromě nás dvou se to nedozví. Čisté manželství, povznesené nad svazky, které nám vnutily zvyklosti!“\n\n[target.GetTitledFirstName] souhlasně přikývne, téměř bez dechu dojetím. A pak pod ochranným pláštěm noci naše tajné sliby zpečetíme tělem..."
 seduce_outcome.2050.a: "Pouto na věčnost!"
 seduce_outcome.2050.b: "Byla to kouzelná noc, ale takhle se už sejít nemůžeme."
 seduce_outcome.2301.t: "V komnatách, kde přebývá [target.GetTitledFirstName]"
 seduce_outcome.2301.desc: "Po zádech mi přeběhne chvění plné očekávání, když zamířím ke komnatám, kde přebývá [target.GetTitledFirstName]. Jakmile se otevřou dveře, [target.GetTitledFirstName] [target.Custom('quirk_pos_present')], [target.Custom('quirk_pos_adverb')] se usměje, chytí mě za oděv — [ROOT.Char.Custom('GetUpperClothingArticle')|l] — a vtáhne mě dovnitř.\n\nJakmile mě [target.GetTitledFirstName] obejme, oheň v mé hrudi vzplane naplno a zbytek noci se rozplyne v horkém, spalujícím opojení."
 seduce_outcome.2301.a: "Ach, [target.GetFirstNameNoTooltip], [target.Custom('LoverPetName')|l], setkejme se znovu!"
 seduce_outcome.2301.a.tt: "#F A znovu a znovu a znovu...!#!"
 seduce_outcome.2301.b: "[target.GetFirstNameNoTooltip] rozhodně ví, jak [Select_CString(ROOT.Char.IsFemale, 'potěšit ženu', 'potěšit muže')]."
 seduce_outcome.2302.t: "Na cizím dvoře"
 seduce_outcome.2302.desc_court_owner: "„Kvůli mně až sem, [ROOT.Char.Custom('LoverPetName')|l]?“\n\nPřede mnou stojí [target.Custom('ResidenceBuilding')|l], sídlo, kde pobývá [target.GetTitledFirstName]. V oděvu služebnictva, aby si mě nikdo nevšiml, prohledávám jeho chodby a nakonec v odlehlé zahradě najdu [target.GetTitledFirstName]."
 seduce_outcome.2302.desc_not_court_owner: "„Kvůli mně až sem, [ROOT.Char.Custom('LoverPetName')|l]?“\n\nPřede mnou stojí [target.Custom('ResidenceBuilding')|l], sídlo, kde pobývá [target.GetTitledFirstName]. V oděvu služebnictva, aby si mě nikdo nevšiml, prohledávám jeho chodby a nakonec v odlehlé zahradě najdu [target.GetFirstName]."
 seduce_outcome.2302.desc_end: "Jakmile mě [target.GetTitledFirstName] spatří, rozzáří se, a já při tom pohledu vzplanu stejně.\n\nZanedlouho už na podlaze leží [ROOT.Char.Custom('GetClothingArticle')|l], součást mého ošuntělého přestrojení, a my strávíme celou noc tím, že se postaráme, aby má cesta rozhodně stála za to!"
 seduce_outcome.2302.a: "Kvůli tobě bych tu cestu [Select_CString(ROOT.Char.IsFemale, 'podnikla', 'podnikl')] třeba stokrát!"
 seduce_outcome.2302.b: "Bylo to stejně sladké jako prchavé."
 seduce_outcome.2303.t: "Šepot srdce"
 seduce_outcome.2303.desc: "„[ROOT.Char.Custom2('ComplimentSentence', SCOPE.sC('target'))|U].“\n\n„Nikdy mě neomrzí tvůj [owner.Custom('quirk_pos_adjective')] úsměv,“ odpoví [target.GetTitledFirstName] s ruměncem ve tváři, „ani tvé objetí.“\n\nNaše šeptaná vyznání brzy přestanou dávat smysl, ale to, co je vystřídá, mluví ještě výmluvnějším jazykem."
 seduce_outcome.2303.a: "Jak by šlo [Select_CString(target.IsFemale, 'tak výmluvné ženě', 'tak výmluvnému muži')] cokoli odepřít?"
 seduce_outcome.2303.b: "Tohle povídání jsem si [Select_CString(ROOT.Char.IsFemale, 'užila', 'užil')], ale teď je u konce."
 seduce_outcome.2304.t: "Pod širým nebem"
 seduce_outcome.2304.desc: "[target.GetTitledFirstName] a já dřepíme bok po boku a [ROOT.Char.Custom('GetAnimalAdjective')] [ROOT.Char.Custom('GetAnimalType')|l] před námi nemá o naší přítomnosti ani tušení. Má pozornost však neochabuje — zvlášť když se ke mně [target.GetFirstNameNoTooltip] přitiskne tak blízko, až se o mě otře [target.Custom('GetClothingArticle')|l]. Když [Select_CString(target.IsFemale, 'ji', 'ho')] obejmu, zjistím, že i [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'věnovala', 'věnoval')] svou pozornost #EMP něčemu jinému#!.\n\nKdyž [ROOT.Char.Custom('GetAnimalType')|l] zmizí z dohledu a kolem nás se rozprostírá [ROOT.Char.Custom('TerrainType')|l], naše nahá těla už spočívají na měkké zemi, propletená jedno s druhým."
 seduce_outcome.2304.a: "Je jen přirozené, že jsme spolu!"
 seduce_outcome.2304.b: "Spojit se jen proto, abychom se zase rozešli — i to patří k životu."
 seduce_outcome.2305.t: "Milostný dopis"
 seduce_outcome.2305.desc_opening: "„[letterAuthor.Custom2('love_letter', SCOPE.sC('love_letter_target'))]"
 seduce_outcome.2305.desc_ending: "“\n\nSotva dočtu dopis, který mi [Select_CString(target.IsFemale, 'poslala', 'poslal')] [target.GetTitledFirstName], už mířím ke komnatám, kde [target.GetTitledFirstName] přebývá."
 seduce_outcome.2305.a: "Na ta slova odpovím činy!"
 seduce_outcome.2305.a_terrible: "#F Nebo spíš na jejich smysl — ta báseň byla příšerná!#!"
 seduce_outcome.2305.a_okay: "#F A vynahradím, co jim chybělo!#!"
 seduce_outcome.2305.a_great: "#F Taková výmluvnost si zaslouží odměnu!#!"
 seduce_outcome.2305.a_amazing: "#F Ta próza ve mně zažehla oheň. Uhasit ho může jedině [target.GetTitledFirstName] ve svém náručí!#!"
 seduce_outcome.2305.b: "Naše spojení bude stejně jedinečné jako ta báseň."
 seduce_outcome.2306.t: "[Select_CString(target.IsFemale, 'Má milovaná', 'Můj milovaný')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('target'))|l]"
 seduce_outcome.2306.desc: "Všechno služebnictvo jsme poslali pryč a naši postel ozdobili [SCOPE.Custom('SeductionObjectMultiple')]. Když [target.GetTitledFirstName] vstoupí do našich komnat, [target.Custom('quirk_pos_adverb')] se usměje a bez jediného zaváhání se ke mně přidá.\n\nRukama, ústy i celými těly znovu stvrzujeme oddanost, při jejímž slibu nám byl svědkem [ROOT.Char.GetFaith.HighGodName] – byť tentokrát možná poněkud tělesnějším způsobem, než bylo zamýšleno."
 seduce_outcome.2306.a: "Manželství spojilo naše životy a teď jsou spojena i naše srdce!"
 seduce_outcome.2306.b: "Manželské pouto samo o sobě stačí."
 seduce_outcome.2307.t: "[Select_CString(target.IsFemale, 'Má', 'Můj')] [target.Custom2('InsultAdjective', ROOT.Char)|U] [Select_CString(target.IsFemale, 'milenka', 'milenec')]"
 seduce_outcome.2307.desc: "Když se přiblížím k [target.GetTitledFirstName], nevím, zda z toho těla strhat šaty, nebo z té tváře srazit [target.Custom('quirk_neg_adjective')] úsměv. [target.GetTitledFirstName] mě políbí – jako by mě [Select_CString(target.IsFemale, 'vyzývala', 'vyzýval')] na souboj – a já [Select_CString(target.IsFemale, 'ji', 'ho')] přitáhnu blíž – má odpověď je stejně přímočará.\n\nVálka citů v mé hrudi se přenese i do našich těl a celou noc si navzájem rozdáváme urážky i rozkoš."
 seduce_outcome.2307.a: "Polib mě znovu, [target.Custom2('InsultAdjective', ROOT.Char)] [target.Custom2('InsultNoun', ROOT.Char)]!"
 seduce_outcome.2307.b: "Nech mě být! [target.Custom2('InsultNounSexual', ROOT.Char)|U]!"
 seduce_outcome.2308.t: "Má láska: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))|U]"
 seduce_outcome.2308.desc_illigal: "Když se na mě [target.Custom('ComplimentAdjective')] [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))|l], [target.Custom('quirk_pos_adverb')] usměje, jen těžko si připomínám, že naše vzájemná přitažlivost budí pohoršení.\n\nA pak mi [target.GetTitledFirstName] vyhrne [ROOT.Char.Custom('GetUpperClothingArticle')|l] a nechá své ruce bloudit po mém těle – a já zjišťuji, že je mi to jedno. "
 seduce_outcome.2308.desc_not_illigal: "Když se na mě [target.Custom('ComplimentAdjective')] [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))|l], [target.Custom('quirk_pos_adverb')] usměje, odhodím veškeré zábrany. Strhnu svrchní oděv – [ROOT.Char.Custom('GetUpperClothingArticle')|l] – obejmu [Select_CString(target.IsFemale, 'ji', 'ho')] kolem pasu, přitisknu rty ke krku a svou palčivou touhu k té [Select_CString(target.IsFemale, 'její', 'jeho')]...\n\n"
 seduce_outcome.2308.a: "Vždyť jsme [target.Custom2('RelationToMeShort', ROOT.Char)|l] a [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))|l] – jak by naše láska mohla být špatná!"
 seduce_outcome.2308.b: "[target.GetTitledFirstName] pro mě navždy zůstane [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))|l]."
 seduce_outcome.2309.t: "V sevření vášně"
 seduce_outcome.2309.desc_opening: "Čeká na mě [target.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))|l], a zjevně se už nemůže dočkat."
 seduce_outcome.2309.desc_ending: "[ROOT.Char.Custom2('sex_scene', SCOPE.sC('target'))]"
 seduce_outcome.2309.a: "Tohle bylo příliš dobré na jedinou noc."
 seduce_outcome.2900.t: "[target_liege.GetTitledFirstNamePossessiveNoTooltip] hněv"
 seduce_outcome.2900.start.desc: "Když se ozve křik a štěkot, hradby kolem [target_liege.Custom('FortifiedBuilding')|l]"
 seduce_outcome.2900.capital.desc: "[capital.GetNameNoTierNoTooltip]"
 seduce_outcome.2900.end.desc: "jsou stále nepříjemně blízko. Než si mě někdo stačí všimnout, sesednu a ukryji se za [target_liege.Custom('OutdoorsHidingPlace')|l] u cesty.\n\nSrdce mi buší jako o závod, když kolem procválá lovecká družina. „Rychle! [ROOT.Char.GetTitledFirstNameNoTooltip] nemůže být daleko!“"
 seduce_outcome.2900.a: "Co s námi teď bude?"
 seduce_outcome.3901.t: "Had u dvora"
 seduce_outcome.3901.desc: "Ten úzkostný výraz poznávám. [Select_CString(dummy_servant_gender.IsFemale, 'Má služebná', 'Můj služebník')] mi přináší špatné zprávy.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], pojďte rychle! [owner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] právě [Select_CString(owner.IsFemale, 'vyšla', 'vyšel')] z komnat, kde pobývá [target.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]!“"
 seduce_outcome.3900.a: "To může znamenat jediné!"
 seduce_outcome.3000.desc: "Když se nejvyšší pontifik a já tajně setkáme, naplňuje mě bázeň a touha mnohem tělesnější než duchovní. Jistě přede mnou ještě nikdo nepřijal požehnání [Select_CString(owner.IsFemale, 'Její Svatosti', 'Jeho Svatosti')] právě takovým způsobem.\n\nKdyž ke mně [owner.GetTitledFirstName] natáhne ruku, zavřu oči a pokleknu..."
 seduce_outcome.3000.a: "[owner.GetTitledFirstName] drží klíč k mému království."
 seduce_outcome.3010.desc: "[owner.GetTitledFirstName ] dorazí do mých komnat se dvojí žízní a zásobou vína, které uhasí tu první. Netrvá dlouho a je jasné, že toužíme po tomtéž.\n\nPrvní polibek zpečetí naši dohodu a následující den i noc už jen pijeme, milujeme se, pijeme, milujeme se..."
 seduce_outcome.3020.desc: "Latrína je stísněná a vzduch páchne tím, co tu bylo nedávno zanecháno. Je tu však soukromí. Tolik soukromí...\n\nHladově hledím na [owner.GetTitledFirstName] a svlékám se. [owner.GetTitledFirstName] udělá totéž a při polibku nás zaplaví vlna chtíče, která nám dá zapomenout na nepohodlí stísněného prostoru i na žalostné výjevy a pachy kolem nás."
 seduce_outcome.3030.a.desc: "[owner.GetTitledFirstName] přichází s jídlem – se spoustou jídla. Dobře ví, jak moc ho mám ráda[Select_CString(ROOT.Char.IsFemale, '', '')]. [owner.GetTitledFirstName] pokyne rukou a já se ochotně svléknu a ulehnu. Pak kolem mě rozloží sýr, ovoce a med. Na mém těle i vedle mě."
 seduce_outcome.3030.alcohol.desc: "Pak mi po hrudi rozlije štědrou dávku vína."
 seduce_outcome.3030.b.desc: "\n\nPolibek, dotek a vzápětí nás oba pohltí rozkoš. Když se chuť a vůně těla, které patří [owner.GetTitledFirstName], mísí s chutí a vůní jídla, zavřu oči a rozesměji se. Tohle je sladký život!"
 seduce_outcome.3040.desc: "Jak se stíny prodlužují, spatřím ve tmě pod hradbami přicházet [owner.GetTitledFirstName]. [target.Custom('quirk_pos_adverb')] se usměje a zašeptá: „Víš, proč přicházím.“\n\nNejprve vykročím váhavě, pak stále dychtivěji. Tep se mi zrychlí, když si mě [owner.GetTitledFirstName] přitáhne k sobě. Ve stínu hradeb se oddáme jeden druhému, zatímco hlídkující stráže nad námi nemají o naší vášni ani tušení."
 seduce_outcome.3050.desc: "Scházíme se tajně pod rouškou noci, ukryti před zraky i sluchem okolního světa. [owner.GetTitledFirstName] mi dává slib: „Vezměme se doopravdy, ale tajně. Nikdo kromě nás dvou se to nedozví. Čisté manželství, povznesené nad svazky, které nám vnutily zvyklosti!“\n\nSouhlasně přikývnu, téměř bez dechu dojetím. A pak pod ochranným pláštěm noci naše tajné sliby zpečetíme tělem..."
 seduce_outcome.3301.t: "V mých komnatách"
 seduce_outcome.3301.desc: "Po zádech mi přeběhne chvění plné očekávání, když ticho mých komnat přeruší zaklepání. [Select_CString(owner.IsFemale, 'Že by to byla #EMP ona#!?', 'Že by to byl #EMP on#!?')]\n\nVe dveřích mě přivítá [owner.GetTitledFirstName] s [owner.Custom('quirk_pos_adverb')] úsměvem a chtíčem vepsaným ve tváři. Konečně! Jakmile mě obejme, oheň v mé hrudi vzplane naplno a zbytek noci se rozplyne v horkém, spalujícím opojení."
 seduce_outcome.3301.a: "Ach, [owner.GetFirstNameNoTooltip], [owner.Custom('LoverPetName')|l], setkejme se znovu!"
 seduce_outcome.3301.a.tt: "#F A znovu a znovu a znovu...!#!"
 seduce_outcome.3301.b: "Je vidět, že [owner.GetTitleTierName] rozhodně ví, jak [Select_CString(ROOT.Char.IsFemale, 'potěšit ženu', 'potěšit muže')]."
 seduce_outcome.3302.desc_opening: "Při procházce zahradami mě náhle přivítá pohled sladší než kterýkoli květ: [owner.GetTitledFirstName] v oděvu služebnictva a na tváři [owner.Custom('quirk_pos_adjective')] úsměv.\n\n"
 seduce_outcome.3302.desc_court_owner: "„Nic by mě od tebe neodradilo, [ROOT.Char.Custom('LoverPetName')|l] – už vůbec ne vzdálenost!“"
 seduce_outcome.3302.desc_not_court_owner: "„Nic by mě od tebe neodradilo, [ROOT.Char.Custom('LoverPetName')|l] – ani vzdálenost, ani [court_owner.GetTitledFirstName]!“"
 seduce_outcome.3302.desc_end: "\n\nPrvní letí stranou [ROOT.Char.Custom('GetUpperClothingArticle')|l] ze služebnického převleku, který má [owner.GetFirstName] na sobě, a hned po něm všechno ostatní. Když už [owner.GetFirstName] [Select_CString(owner.IsFemale, 'vážila', 'vážil')] takovou cestu, zaslouží si přece náležitý dík!"
 seduce_outcome.3302.a: "Už nikdy se od sebe na tak dlouho neodlučujme!"
 seduce_outcome.3303.t: "Šepot srdce"
 seduce_outcome.3303.desc: "„[ROOT.Char.Custom2('ComplimentSentence', SCOPE.sC('owner'))|U].“\n\n„Nikdy mě neomrzí tvůj [target.Custom('quirk_pos_adjective')] úsměv,“ odpoví [owner.GetTitledFirstName] s ruměncem ve tváři, „ani tvé objetí.“\n\nNaše šeptaná vyznání brzy přestanou dávat smysl, ale to, co je vystřídá, mluví ještě výmluvnějším jazykem."
 seduce_outcome.3303.a: "Tenhle rozhovor si ještě mnohokrát zopakujeme!"
 seduce_outcome.3304.desc: "[owner.GetTitledFirstName] a já dřepíme bok po boku a [owner.Custom('GetAnimalAdjective')] [owner.Custom('GetAnimalType')|l] před námi nemá o naší přítomnosti ani tušení. Má pozornost však neochabuje – zvlášť když se o mě [owner.GetFirstName] otře oděvem: [owner.Custom('GetClothingArticle')|l]. Když se nakloním, abych [Select_CString(owner.IsFemale, 'ji', 'ho')] [Select_CString(ROOT.Char.IsFemale, 'objala', 'objal')], zjistím, že i [owner.GetFirstName] věnuje svou pozornost #EMP něčemu jinému#!.\n\nKdyž [owner.Custom('GetAnimalType')|l] zmizí v krajině, kterou tvoří [ROOT.Char.Custom('TerrainType')|l], naše nahá těla už spočívají na měkké zemi, propletená jedno s druhým."
 seduce_outcome.3304.a: "Je jen přirozené, že jsme spolu!"
 seduce_outcome.3305.desc: "„[letterAuthor.Custom2('love_letter', SCOPE.sC('love_letter_target'))]“\n\nVděk, který cítím k [owner.GetFirstName] za takovou báseň, bledne vedle vášně, s níž [Select_CString(owner.IsFemale, 'jí', 'mu')] poděkuji."
 seduce_outcome.3305.a: "Ať spolu naše těla recitují poezii, [owner.Custom('LoverPetName')|l]!"
 seduce_outcome.3306.t: "[Select_CString(owner.IsFemale, 'Má milovaná', 'Můj milovaný')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))|l]"
 seduce_outcome.3306.desc: "Když se vrátím do komnat, které sdílím s [owner.GetTitledFirstName], čeká mě nečekaný – zato velmi vítaný – pohled. Naši postel zdobí [SCOPE.Custom('SeductionObjectMultiple')] a uprostřed té nádhery na ní spočívá [owner.GetFirstName] s [owner.Custom('quirk_pos_adverb')] úsměvem.\n\nRukama, ústy i celými těly znovu stvrzujeme oddanost, při jejímž slibu nám byl svědkem [ROOT.Char.GetFaith.HighGodName] – byť tentokrát možná poněkud tělesnějším způsobem, než bylo zamýšleno."
 seduce_outcome.3306.a: "Manželství spojilo naše životy a teď jsou spojena i naše srdce!"
 seduce_outcome.3307.t: "[Select_CString(owner.IsFemale, 'Má', 'Můj')] [owner.Custom2('InsultAdjective', ROOT.Char)|U] [Select_CString(owner.IsFemale, 'milenka', 'milenec')]"
 seduce_outcome.3307.desc: "Když se ke mně [owner.GetTitledFirstName] přiblíží, nevím, zda z toho těla strhat šaty, nebo z té tváře srazit [owner.Custom('quirk_neg_adjective')] úsměv. Políbím [Select_CString(owner.IsFemale, 'ji', 'ho')] – výzva – a [owner.GetTitledFirstName] si mě přitáhne blíž – stejně rázná odpověď.\n\nVálka citů v mé hrudi se přenese i do našich těl a celou noc si navzájem rozdáváme urážky i rozkoš."
 seduce_outcome.3307.a: "Polib mě znovu, [owner.Custom2('InsultAdjective', ROOT.Char)] [owner.Custom2('InsultNoun', ROOT.Char)]!"
 seduce_outcome.3307.b: "Na tuhle chvilku slabosti bude nejlepší zapomenout."
 seduce_outcome.3308.t: "[Select_CString(owner.IsFemale, 'Má milovaná', 'Můj milovaný')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('owner'))|l]"
 seduce_outcome.3308.desc_illigal: "Když se na mě [owner.Custom('ComplimentAdjective')] [owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))|l], [owner.Custom('quirk_pos_adverb')] usměje, jen těžko si připomínám, že naše vzájemná přitažlivost budí pohoršení.\n\nA pak mi [owner.GetTitledFirstName] vyhrne [ROOT.Char.Custom('GetUpperClothingArticle')|l] a nechá své ruce bloudit po mém těle – a já zjišťuji, že je mi to jedno. "
 seduce_outcome.3308.desc_not_illigal: "Když se na mě [owner.Custom('ComplimentAdjective')] [owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))|l], [owner.Custom('quirk_pos_adverb')] usměje, veškeré zábrany se rozplynou. Ze mě vzápětí letí [ROOT.Char.Custom('GetUpperClothingArticle')|l] a já se poddám objetí. [owner.GetTitledFirstName] mě obejme kolem pasu, přitiskne ústa k mému krku a svou palčivou touhu k té mé...\n\n"
 seduce_outcome.3308.a: "Láska, kterou sdílíme, přece nemůže být špatná!"
 seduce_outcome.3309.desc_opening: "Dychtivě ke mně přichází [owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner'))|l]."
 seduce_outcome.3309.desc: "[ROOT.Char.Custom2('sex_scene', SCOPE.sC('owner'))]"
 seduce_outcome.4001.t: "Osten odmítnutí"
 seduce_outcome.4001.incest.desc: "„Mám tě [Select_CString(target.IsFemale, 'ráda', 'rád')], [ROOT.Char.GetFirstNameNoTooltip], opravdu,“ [target.Custom('quirk_pos_adverb')] se usměje [target.GetTitledFirstName], když mě odmítá. „Ale jsi přece můj #EMP [target.Custom2('RelationToMe', SCOPE.sC('owner') )]#! a to je... no, kdo ví, co může přinést budoucnost.“"
 seduce_outcome.4001.regular.desc: "„Jsi [target.Custom2('ComplimentAdjectiveArticle', ROOT.Char)] [Select_CString(ROOT.Char.IsFemale, 'žena', 'muž')], [ROOT.Char.GetFirstNameNoTooltip], ale takovým způsobem se mi nelíbíš,“ řekne [target.GetTitledFirstName] a [target.Custom('quirk_neg_present')]. „Jen [target.GetFaith.HighGodName] ví, co nám budoucnost přinese.“"
 seduce_outcome.4001.a: "Ach... Ano, samozřejmě..."
 seduce_outcome.4002.desc: "Když pozdě v noci vstoupím do komnaty, kde přebývá [target.GetTitledFirstName], nečeká mě sladké objetí, ale posměšný [target.Custom2('InsultNoun', ROOT.Char)]!\n\n„Tvé směšné pokusy okouzlit mě jsem ze slušnosti [Select_CString(target.IsFemale, 'snášela', 'snášel')]. Ale tohle už je příliš! Drž se ode mě dál, ty [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('target'))] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('target'))]!“"
 seduce_outcome.4002.a: "No jo? Ty jsi zase... [target.Custom2('InsultAdjective', ROOT.Char)]... [target.Custom2('InsultNounSexual', ROOT.Char)]!"
 seduce_outcome.4003.t: "Odhalení"
 seduce_outcome.4003.plot.desc: "[target.GetTitledFirstName] mě přivítá šibalským úsměvem a dychtivé ruce se okamžitě pustí do knoflíků a šněrování. Za několik úderů srdce už před [Select_CString(target.IsFemale, 'ní', 'ním')] stojím [Select_CString(ROOT.Char.IsFemale, 'nahá a rozechvělá', 'nahý a rozechvělý')]. Když se však pokusím oplatit stejnou mincí, [target.GetFirstNameNoTooltip] mě odstrčí – a vykřikne!\n\n„Stráže! V mých komnatách je vetřelec! #EMP Stráže!#!“\n\nNahý[Select_CString(ROOT.Char.IsFemale, 'á', '')] jako při narození přeběhnu místnost a vyškrábu se oknem ven."
 seduce_outcome.4003.regular.desc: "Když šplhám k oknu komnaty, kde přebývá [target.GetTitledFirstName], přivítá mě vyděšený výkřik – rozhodně ne tak, jak jsem [Select_CString(ROOT.Char.IsFemale, 'doufala', 'doufal')]! Než stačím cokoli udělat, [target.GetTitledFirstName] se rozběhne ke dveřím a prudce je otevře.\n\n„Pomoc! Stráže! V mých komnatách je vetřelec!“\n\nNež se tahle noc pokazí ještě víc, vyškrábu se zpátky stejnou cestou, kterou jsem [Select_CString(ROOT.Char.IsFemale, 'přišla', 'přišel')]."
 seduce_outcome.4003.a.plot: "[target.Custom2('InsultAdjective', ROOT.Char)|U] [target.Custom2('InsultNoun', ROOT.Char)] za to zaplatí!"
 seduce_outcome.4003.a.regular: "[Select_CString(ROOT.Char.IsFemale, 'Asi jsem špatně odhadla', 'Asi jsem špatně odhadl')] míru nadšení na druhé straně."
 seduce_outcome.4004.t: "Nebezpečná hra"
 seduce_outcome.4004.start.desc: "Srdce mi buší jako kladivo, když zaklepu."
 seduce_outcome.4004.incest.desc: "„[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target') )|U], jsi tam? To jsem já – [ROOT.Char.GetFirstNameNoTooltip]!“"
 seduce_outcome.4004.end.desc: "\n\nDveře se pootevřou a za nimi se objeví [target.GetFirstName] s utrápeným výrazem. „Odpusť mi, ale tohle nedokážu. Kéž bych... Ne, je to příliš nebezpečné!“\n\nPak mě beze slova rychle políbí a zabouchne mi dveře před nosem!"
 seduce_outcome.4004.sodomy.desc: "„[target.Custom('LoverPetName')|U], jsi tam? To jsem já – [ROOT.Char.GetFirstNameNoTooltip]!“"
 seduce_outcome.4004.a: "Proč by nám na tom mělo záležet? Prosím, otevři!"
 seduce_outcome.4005.desc: "Mřížoví pod oknem komnaty, kde přebývá [target.GetTitledFirstName], nevypadá zrovna pevně, ale nic mě neodradí od toho, po čem mé tělo prahne! Po nebezpečném výstupu se mé prsty konečně sevřou kolem okenního parapetu.\n\n„[target.GetFirstNameNoTooltip]! Otevři, [target.Custom('LoverPetName')|l]! To jsem já – [ROOT.Char.GetFirstNameNoTooltip]!“ Zaklepu na okenice, ale nikdo neodpovídá.\n\n„[target_liege.Custom2('RelationToMeShort', SCOPE.sC('target'))|U] je moje rodina! Jak ses [Select_CString(ROOT.Char.IsFemale, 'opovážila', 'opovážil')] takhle mluvit, ty [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('target_liege'))] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('target_liege'))]?!“ Vzhlédnu. Z okna nade mnou se vyklání [target_liege.GetTitledFirstName]!"
 seduce_outcome.4005.a: "Myslím, že je čas zmizet!"
 seduce_outcome.4900.desc: "Mířím do svých komnat za trochou zaslouženého spánku, když od okna zaslechnu slabé zašustění. Jen vítr, pomyslím si – dokud ten vítr nezačne mluvit.\n\n„[target.GetFirstNameNoTooltip]! Otevři, [target.Custom('LoverPetName')|l]! To jsem já – [owner.GetFirstNameNoTooltip]!“ Prudce otevřu okenice a nestačím se divit: až k oknu komnaty, kde přebývá [target.GetTitledFirstName], se [Select_CString(owner.IsFemale, 'vyšplhala nějaká žena', 'vyšplhal nějaký muž')]! Je to [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 seduce_outcome.4900.a.family: "[target_liege.Custom2('RelationToMeShort', SCOPE.sC('target'))|U] je moje rodina! Jak ses [Select_CString(owner.IsFemale, 'opovážila', 'opovážil')] takhle mluvit, ty [owner.Custom2('InsultNounSexual', SCOPE.sC('target_liege'))]?!"
 seduce_outcome.4900.a.courtier: "Při [ROOT.Char.GetFaith.DevilName], copak nemáš žádnou hanbu? Stráže!"
 seduce_outcome.8101.t: "[ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('owner') )|U] láska"
 seduce_outcome.8101.desc: "Teď už nemůže být pochyb. [owner.GetTitledFirstName] – [Select_CString(owner.IsFemale, 'má vlastní', 'můj vlastní')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('owner') )|l] – touží po něčem víc než jen po rodinném poutu...\n\n"
 seduce_outcome.8101.desc_positive: "Nemohu říct, že by mi ta myšlenka nikdy nepřišla na mysl, přesto mě to zjištění zaskočí."
 seduce_outcome.8101.desc_neutral: "[owner.GetTitledFirstName] se těší mé velké úctě, přesto mě to zjištění zaskočí."
 seduce_outcome.8101.desc_negative: "Nemá zvrhlost toho [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('owner'))] žádné meze?"
 seduce_outcome.8101.a: "Přestaň s tím šílenstvím! Jsem přece [Select_CString(target.IsFemale, 'tvá', 'tvůj')] #EMP [owner.Custom2('RelationToMe', SCOPE.sC('target') )] #! !"
 seduce_outcome.8101.c: "Celý svět se dozví o tvých odporných zvrácenostech!"
 seduce_outcome.8101.b: "Nu což, co by byl život bez trochy požitků?"
 seduce_outcome.8101.b.tt: "Nebudu [owner.GetFirstNameNoTooltip] odrazovat od dalších pokusů"
 seduce_outcome.blocked_from_seduction: "Už se nebudu moci pokusit svést [target.GetTitledFirstName]"
 seduce_outcome.8102.t: "Osten odmítnutí"
 seduce_outcome.8102.desc: "„Tohle už zašlo příliš daleko, [owner.GetFirstNameNoTooltip]. Jsem přece [Select_CString(target.IsFemale, 'tvá', 'tvůj')] [owner.Custom2('RelationToMe', SCOPE.sC('target') )|l]! Vždyť tohle je proti všemu, co [ROOT.Char.GetFaith.HighGodName] káže!“\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] a dává mi jasně najevo, jak hluboce mými milostnými návrhy pohrdá."
 seduce_outcome.8102.a: "Byl to přece někdo výjimečný!"
 seduce_outcome.8103.t: "Odmítnutí a odhalení"
 seduce_outcome.8103.desc: "„Hnusíš se mi, [owner.GetFirstNameNoTooltip]. Jsem přece [Select_CString(target.IsFemale, 'tvá', 'tvůj')] [owner.Custom2('RelationToMe', SCOPE.sC('target') )|l]! Vždyť tohle je proti všemu, co [ROOT.Char.GetFaith.HighGodName] káže! Tvé odporné zvrácenosti odhalím před celým světem, na to vem jed!“\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] a dává mi jasně najevo, jak hluboce mými milostnými návrhy pohrdá."
 seduce_outcome.8103.a: "Tohle uděláš mně? Vždyť jsem [Select_CString(owner.IsFemale, 'tvá', 'tvůj')] [target.Custom2('RelationToMe', SCOPE.sC('owner') )|l]!"
 seduce_outcome.4100.desc: "Při procházce zahlédnu v dálce [target.GetFirstName], jak na mě mává. Vydám se tím směrem a po chvíli [Select_CString(target.IsFemale, 'ji dostihnu', 'ho dostihnu')]. Ukryjeme se před zraky ostatních a dychtivě prozkoumáváme těla jeden druhého. Nechám se unést bouří žhavých polibků a bezdechých vzdechů, když tu [target.GetFirstNameNoTooltip] náhle přeruší náš polibek a přiloží mi prst na rty.\n\n„Bylo to příjemné,“ pronese [target.GetTitledFirstName] lehkým tónem a odtáhne se, „ale tahle hra mě už omrzela. "
 seduce_outcome.4100.desc_married: "[target_spouse.GetTitledFirstName] ode mě právem očekává, že budu plnit povinnosti, které mám jako [target_spouse.Custom2('RelationToMeShort', target)|l].“"
 seduce_outcome.4100.desc_fallback: "Musím se soustředit na své vlastní cíle.“"
 seduce_outcome.4100.a: "„Počkej, takhle to přece nemělo skončit!“"
