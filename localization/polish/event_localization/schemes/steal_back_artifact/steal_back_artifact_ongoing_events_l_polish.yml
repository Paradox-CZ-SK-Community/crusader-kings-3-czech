l_polish:
 steal_back_artifact_event_title: "Krádež artefaktu:"
 steal_back_artifact_ongoing.1001.t: "$steal_back_artifact_event_title$ Antikvář"
 steal_back_artifact_ongoing.1001.desc: "Jednou ze zřejmých překážek při získání artefaktu zpět je [antiquarian.GetTitledFirstName], [Select_CString(antiquarian.IsFemale, 'antikvářka', 'antikvář')] ve službách [target.GetTitledFirstName].\n\nExistuje samozřejmě mnoho způsobů, jak se s člověkem... #EMP vypořádat#!, ale říkám si, zda by [antiquarian.GetFirstNameNoTooltip] nad dostatečně štědrým úplatkem [Select_CString(antiquarian.IsFemale, 'nepřimhouřila', 'nepřimhouřil')] oči."
 steal_back_artifact_ongoing.1001.a: "Zlato je univerzálním jazykem úplatků."
 steal_back_artifact_ongoing.1001.a.tt: "Věříš, že [antiquarian.GetTitledFirstName] se nechá koupit bohatstvím..."
 steal_back_artifact_ongoing.1001.b: "Možná artefakt za artefakt?"
 steal_back_artifact_ongoing.1001.b.tt: "[antiquarian.GetTitledFirstName] přistoupí na „rovný obchod“."
 steal_back_artifact_ongoing.1001.c: "Setkání, na které dorazí [random_beauty.GetTitledFirstNameNoTooltip], by mohlo být... #EMP podnětné#!."
 steal_back_artifact_ongoing.1001.c.tt: "Sázíš na to, že [antiquarian.GetTitledFirstName] ocení tělesnou krásu více než věrnost."
 steal_back_artifact_ongoing.1001.d: "Raději se poohlédnu po jiných možnostech."
 steal_back_artifact_ongoing_notification.1001.success: "[antiquarian.GetTitledFirstName] přijímá úplatek"
 steal_back_artifact_ongoing_notification.1001.failure: "[antiquarian.GetTitledFirstName] odmítá úplatek"
 steal_back_artifact_ongoing.1002.t: "$steal_back_artifact_event_title$ Podrobnější pokyny"
 steal_back_artifact_ongoing.1002.desc: "[agent.Custom2('MyCharacterIntroduction', ROOT.Char)] ode mě [Select_CString(agent.IsFemale, 'dostala', 'dostal')] za úkol sledovat [target.GetTitledFirstName], abychom našli ideální příležitost odcizit některý z artefaktů, které [target.GetTitledFirstName] vlastní.\n\nPokrok je však mnohem pomalejší, než bych si přál. Možná by se hodilo upřesnit, na co se má [agent.GetFirstNameNoTooltip] zaměřit?"
 steal_back_artifact_ongoing.1002.a: "Řeknu přesně, na co se má [agent.GetFirstNameNoTooltip] zaměřit."
 steal_back_artifact_ongoing.1002.b: "Věřím, že svou práci zvládne."
 steal_back_artifact_ongoing_notification.1002.success: "[agent.GetTitledFirstName] podává hlášení"
 steal_back_artifact_ongoing_notification.1002.failure: "[antiquarian.GetTitledFirstName] nic nezjistí"
