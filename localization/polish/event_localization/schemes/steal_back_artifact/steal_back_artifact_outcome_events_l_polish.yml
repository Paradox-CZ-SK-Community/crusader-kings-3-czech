l_polish:
 steal_back_artifact_outcome.1001.t: "$steal_back_artifact_event_title$ Úspěch!"
 steal_back_artifact_outcome.1001.desc: "Zaplavil mě příval hrdosti a při pohledu na artefakt, který se mi konečně podařilo získat zpět, se neubráním širokému úsměvu. [artifact.GetName] se vrací svému právoplatnému majiteli!\n\nMožná je po strastech své záchrany trochu odřený a ušpiněný, přesto si nemohu odpustit, abych prsty nepřejel po nádherném povrchu tohoto kdysi ukradeného skvostu... [artifact.GetName], jaká znamenitá kořist!"
 steal_back_artifact_outcome.1001.a: "Vrací se tam, kam právem patří, do správných rukou."
 steal_back_artifact_outcome.1002.t: "$steal_back_artifact_event_title$ Ukradený artefakt!"
 steal_back_artifact_outcome.1002.desc: "Dnes mě napadlo, že se pokochám svým [artifact_to_steal.GetName]... jenže k mé hrůze byl pryč! #EMP Pryč!#!\n\nPo horečném pátrání se přihlásí jeden ze služebníků s tvrzením, že tuto nestoudnou krádež zosnoval[Select_CString(owner.IsFemale, 'a', '')] [owner.GetName]! [owner.GetName] se prý často nechal[Select_CString(owner.IsFemale, 'a', '')] slyšet, oč lépe by [artifact_to_steal.GetName] vypadal v [Select_CString(owner.IsFemale, 'jejím držení', 'jeho držení')]..."
 steal_back_artifact_outcome.1002.a: "Proklínám toho podlého zloděje!"
 steal_back_artifact_outcome.2001.t: "$steal_back_artifact_event_title$ Neúspěch"
 steal_back_artifact_outcome.2001: "Má rafinovaně naplánovaná infiltrace proběhla přesně podle plánu, ale [artifact.GetName] se nepodařilo najít!\n\nPřemístili ho? Ukryli? Buď můj cíl zachránila pouhá šťastná náhoda... nebo mé neschopné poskoky někdo mazaně přelstil. Naprostý nezdar je vyděsil natolik, že už mi dál nepomohou. Má kořist zůstává u svého majitele..."
 steal_back_artifact_outcome.2001.a: "Tomu nemohu uvěřit! #EMP Nepřijatelné!#!"
