l_polish:
 study_confucian_classics_outcome.10.t: "$study_confucian_classics_title$Volba přístupu"
 study_confucian_classics_outcome.10.desc: "Přede mnou leží #EMP Hovory [Glossary('Konfucia', 'CONFUCIUS_GLOSS')]#!, #EMP Kniha písní#!, #EMP Kniha dokumentů#!, #EMP Kniha obřadů#!, #EMP Kniha proměn#! a #EMP Letopisy jar a podzimů#!. Připravil jsem si [Glossary('čtyři poklady pracovny', 'FOUR_TREASURES')] - a #EMP spoustu#! čaje...\n\nChci-li prokázat své zásluhy a učenost, musím studovat. Ale kam až jsem ochoten[Select_CString(ROOT.Char.IsFemale, 'ná', 'ný')] zajít?"
 study_confucian_classics_outcome.10.a: "V honbě za poznáním si nedopřeji odpočinku!"
 study_confucian_classics_outcome.10.b: "Ke studiu budu přistupovat s důstojností."
 study_confucian_classics_outcome.10.c: "Bude to trvat tak dlouho, jak bude třeba."
 no_change_study_tt: "Tvá [GetScheme('study_confucian_classics').GetTypeName] [Concept('scheme','intrika')|E] postupuje beze změny"
 tgp_focused_studies_modifier: "Soustředěné studium"
 tgp_focused_studies_personal_modifier: "Soustředění na konfuciánská studia"
 tgp_focused_studies_personal_modifier_desc: "Tato postava se plně oddala studiu konfuciánských klasiků."
 tgp_dignified_studies_modifier: "Důstojné studium"
 tgp_dignified_studies_personal_modifier: "Důstojné studium konfuciánských klasiků"
 tgp_dignified_studies_personal_modifier_desc: "Tato postava studuje konfuciánské klasiky důstojným způsobem."
 study_confucian_classics_title: "$study_confucian_classics$: "
 study_confucian_classics_outcome.100.t: "$study_confucian_classics_title$Celou noc"
 study_confucian_classics_outcome.100.desc: "Až se příště bude konat [GetActivityType('activity_imperial_examination').GetName], budu [Select_CString(ROOT.Char.IsFemale, 'připravena', 'připraven')]. Padá noc a přede mnou leží Letopisy [ROOT.Char.Custom('GetRandomAnnalsPassage')], jejichž stránky osvětluje jen slabé světlo.\n\nKdyž vydržím vzhůru celou noc a vštípím si do paměti nejdůležitější pasáže, jistě tím získám výhodu... ale opravdu se něco naučím? Možná bych měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] věnovat čas tomu, abych jim skutečně #EMP porozuměl[Select_CString(ROOT.Char.IsFemale, 'a', '')]#!?"
 study_confucian_classics_outcome.100.a: "Zkoušku musím složit, ať to stojí cokoli."
 study_confucian_classics_outcome.100.b: "Moudrost potřebuje čas."
 study_confucian_classics_outcome.100.c: "Raději půjdu spát..."
 preparatory.imperial_examination.advantage.tt: "Získáš [Concept('exam_advantage','výhodu u zkoušky')|E] pro příští [GetActivityType('activity_imperial_examination').GetName]"
 study_confucian_classics_outcome.200.t: "$study_confucian_classics_title$Volání poezie"
 study_confucian_classics_outcome.200.desc: "[ROOT.Char.Custom('GetRandomPoetryPassage')] - ta krása, ten rukopis, prostě #EMP dechberoucí!#! A [poet.GetTitledFirstName] tvoří verše obdivuhodné, nesmrtelné, hodné věků. Přeskakuji od jednoho textu k druhému a nemohu přestat číst.\n\nMožná bych i já měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] namočit štětec... a přidat vlastní dílo do velké knihovny. [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier] si jistě zaslouží další báseň."
 study_confucian_classics_outcome.200.a: "„[ROOT.Char.Custom('GeneratePoem_Title_Fragment_Season')] [ROOT.Char.Custom('FormalComplimentAdjective')] ctnosti volá k...“"
 study_confucian_classics_outcome.200.b: "Počkám, až mě políbí múza!"
 study_confucian_classics_outcome.200.c: "[poet.GetFirstNameNoTooltip] si zaslouží dopis plný obdivu."
 study_confucian_classics_outcome.200.d: "Měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] bych si znovu přečíst [ROOT.Char.Custom('GetRandomPoetryPassage')]."
 friend_praised_privately: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale, 'pochválila', 'pochválil')] [TARGET_CHARACTER.GetShortUIName]."
 friend_praised_privately_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale, 'pochválila', 'pochválil')] [CHARACTER.GetShortUIName]."
 study_confucian_classics_outcome.300.t: "$study_confucian_classics_title$[ROOT.Char.Custom('GetSeason')|U] jako inspirace"
 study_confucian_classics_outcome.300.desc: "Přede mnou se rozprostírá [location_province.Custom('ProvinceCompliment')] [ROOT.Char.Custom('GetSeason')] zahrada a v mysli mi znějí verše, které napsal [ROOT.Char.Custom('GetRandomAncientChinesePoet')]. Vánek si pohrává s rukávem mého roucha a vede mou ruku ke štětci - jako by mě samo Nebe vybízelo k psaní.\n\nPapír přede mnou nehybně čeká na má slova."
 study_confucian_classics_outcome.300.a: "Když se budu snažit, jednou se také zařadím mezi velikány!"
 study_confucian_classics_outcome.300.b: "Prostá báseň, která zachytí tento okamžik."
 study_confucian_classics_outcome.300.c: "Jeho moudrost mi postačí místo inkoustu."
 wang_wei: "Wang Wej"
 tao_yuanming: "Tchao Jüan-ming"
 li_bai: "Li Po"
 du_fu: "Tu Fu"
 meng_haoran: "Meng Chao-žan"
 liu_zongyuan: "Liou Cung-jüan"
 bai_juyi: "Po Ťü-i"
 study_confucian_classics_outcome.110.t: "$study_confucian_classics_title$Konfuciánské klasiky"
 study_confucian_classics_outcome.110.desc: "Letopisy [ROOT.Char.Custom('GetRandomAnnalsPassage')], [ROOT.Char.Custom('GetRandomPoetryPassage')], [ROOT.Char.Custom('GetRandomRitesPassage')] - jeden po druhém pročítám velké konfuciánské klasiky a z jejich stránek čerpám nadčasovou moudrost.\n\nMám-li být spravedlivým správcem, musím kráčet cestou, kterou vytyčil [Glossary('Konfucius', 'CONFUCIUS_GLOSS')]. Právě tato slova si musím vštípit do paměti."
 study_confucian_classics_outcome.110.a: "Musím se učit, ať to stojí cokoli."
 study_confucian_classics_outcome.110.b: "Dám si na čas."
 study_confucian_classics_outcome.120.t: "$study_confucian_classics_title$Čtení letopisů"
 study_confucian_classics_outcome.120.desc: "Než budu moci spravovat zemi, musím nejprve zvládnout vlastní psací stůl. Přede mnou leží otevřené Letopisy [ROOT.Char.Custom('GetRandomAnnalsPassage')] - dílo mudrců a základ spravedlivé vlády. Jejich slova prohloubí mé vědomosti a povedou mě ve stopách [Glossary('Konfucia', 'CONFUCIUS_GLOSS')].\n\nZvítězit mohu jedině díky kázni."
 study_confucian_classics_outcome.120.a: "Prohledám texty a odhalím jejich skryté pravdy."
 study_confucian_classics_outcome.120.b: "Tři šálky čaje a žádný spánek, dokud neobrátím poslední stránku."
 study_confucian_classics_outcome.120.c: "Moudrost přichází k těm, kdo umějí čekat."
 confucian_xp_high_tt: "Výrazně pokročíš ve studiu konfucianismu"
 confucian_xp_low_tt: "Mírně pokročíš ve studiu konfucianismu"
 study_confucian_classics_outcome.130.t: "$study_confucian_classics_title$Jiný pohled na učení"
 study_confucian_classics_outcome.130.desc: "Proč těm textům nedokážu porozumět? Proč mi jejich jemný význam stále uniká? Jsem opravdu #EMP takhle#! neschopný? Odložím štětec a opřu čelo o desku stolu.\n\n„[Select_CString(servant.IsFemale, 'Přinesla', 'Přinesl')] jsem ti čaj,“ ozve se [servant.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', servant)], když vstoupí do pracovny. „To je přece #EMP [ROOT.Char.Custom('GetRandomRitesPassage')]#!! Na ten text mám krásné vzpomínky... Mohu si chvíli číst s tebou?“\n\nZvednu hlavu. Možná je pomocná ruka přesně to, co potřebuji."
 study_confucian_classics_outcome.130.a: "Prosím, pomoz mi tomu porozumět."
 study_confucian_classics_outcome.130.b: "Co kdybychom raději zašli na skleničku?"
 study_confucian_classics_outcome.140.t: "$study_confucian_classics_title$Umění diplomacie"
 study_confucian_classics_outcome.140.desc: "S povzdechem zavřu Hovory. [Glossary('Mistr Kchung', 'CONFUCIUS_GLOSS')] učí o harmonii - o tom, že ctnost se má projevovat spravedlivým jednáním, nikoli lichotkami. Přesto [diplomatic_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', diplomatic_vassal)], dokáže získat mír úsměvem a přípitkem.\n\nNapadá mě... není i toto Cesta?"
 study_confucian_classics_outcome.140.a: "Od [diplomatic_vassal.GetTitledFirstName] se mohu něco přiučit."
 study_confucian_classics_outcome.140.b: "Ne, své zásluhy prokážu jinak."
 relation_servant_of_china_female: "spoluslužebnice ([ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier])"
 relation_servant_of_china_male: "spoluslužebník ([ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier])"
 study_confucian_classics_outcome.150.t: "$study_confucian_classics_title$Poznej zemi"
 study_confucian_classics_outcome.150.desc: "„Pojď se mnou,“ vyzve mě [servant.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', servant)], a pokyne mi, abych vyšel ven. „Prohlédněme si zdejší [location_province.Custom('GetTerrainTypePlural')] v [location_province.GetName].“\n\n„Všímej si pahorků a vyvýšenin, svahů a soutěsek, plání i mokřadů - každý z těchto rysů určuje, k čemu lze půdu nejlépe využít. Taková je moudrost #EMP Knihy obřadů.#!“"
 study_confucian_classics_outcome.150.a: "Velmi poučné."
 study_confucian_classics_outcome.150.b: "Ano... procházka mi pročistí hlavu."
 study_confucian_classics_outcome.160.t: "$study_confucian_classics_title$Záslužná práce"
 study_confucian_classics_outcome.160.desc: "Mám za sebou důkladné studium [ROOT.Char.Custom('GetRandomPoetryPassage')], [ROOT.Char.Custom('GetRandomRitesPassage')] i Letopisů [ROOT.Char.Custom('GetRandomAnnalsPassage')]. Mysl se mi zbystřila, schopnosti vytříbily a cítím, že nastal čas prokázat své zásluhy.\n\nMožná je načase pomoci místním magistrátům s přezkoumáním starých případů, prověřit stav zdejších mostů,"
 study_confucian_classics_outcome.160.desc_own_elder: "nebo sepsat formální zprávu pro [higher_merit_vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', higher_merit_vassal)]."
 study_confucian_classics_outcome.160.desc_other_elder: "nebo sepsat formální zprávu pro někoho z uznávaných starších vysokého postavení: [higher_merit_vassal.GetTitledFirstName]."
 study_confucian_classics_outcome.160.a: "[higher_merit_vassal.GetFirstNameNoTooltip] si jistě všimne dobré služby a zpráva o mých zásluhách se ponese dál."
 study_confucian_classics_outcome.160.b: "Pořádný průzkum vydá za víc než jakékoli vychloubání."
 study_confucian_classics_outcome.160.c: "Pomohu magistrátům."
 merit_gain_high_tt: "Výrazný zisk zásluh"
 merit_gain_low_tt: "Mírný zisk zásluh"
 because_of_your_diplomacy: "Díky tvé [diplomacy_i][Concept('diplomacy','Diplomacii')|E]:"
 because_of_your_stewardship: "Díky tvému [stewardship_i][Concept('stewardship','Správcovství')|E]:"
 because_of_your_learning: "Díky tvé [learning_i][Concept('learning','Učenosti')|E]:"
 study_confucian_classics_outcome.170.t: "$study_confucian_classics_title$Vliv staršího"
 study_confucian_classics_outcome.170.desc: "„Právě dorazil svitek s pečetí [elder.GetTitledFirstName], tvého staršího,“ oznámí mi [letterman.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', letterman)], a podá mi jej. „Myslím, že jsou to dobré zprávy!“\n\nOpatrně svitek rozvinu.\n\n„Tobě, koho nejlépe vystihuje slovo „[ROOT.Char.Custom('ComplimentAdjective')]“ - tvůj pevný tah štětcem, čestné srdce a vytrvalá mysl nezůstaly bez povšimnutí. Zprávy o tvém počínání se donesly k písařům i magistrátům. O tvých zásluhách se ví.“"
 study_confucian_classics_outcome.170.a: "Sepíšu děkovný dopis."
 study_confucian_classics_outcome.170.b: "Možná by šlo [elder.GetTitledFirstName] přesvědčit, aby zatáhl[Select_CString(elder.IsFemale, 'a', '')] za pár dalších nitek?"
 study_confucian_classics_outcome.170.c: "Mám takovou radost, že bych ti nalil deset šálků čaje!"
 study_confucian_classics_outcome.180.t: "$study_confucian_classics_title$Bez břemene"
 study_confucian_classics_outcome.180.desc: "Dokázal jsem to. Dočetl jsem celou #EMP Knihu obřadů#! - a její moudrost mi dokonce zůstala v paměti! Jako by mi z očí spadl závoj. Poprvé jasně vidím cestu, která přede mnou leží.\n\nA přitom... mi nikdo nevěřil. Dokonce ani já sám.\n\nMožná jsem přece jen předurčen k něčemu většímu."
 study_confucian_classics_outcome.180.a: "Tak co budu číst dál..."
 study_confucian_classics_outcome.190.t: "$study_confucian_classics_title$Využití vlivu"
 study_confucian_classics_outcome.190.desc: "Slovo pronesené ve správnou chvíli, báseň věnovaná darem, přízeň váženého učitele... samé příležitosti k budování [Glossary('guanxi', 'GUANXI_GLOSS')]. Dokonce i místo na poklidném básnickém setkání může ovlivnit mou další cestu.\n\nPracuji pilně, ale mudrci učili, že má-li být ctnost poznána, musí také zazářit."
 GUANXI_GLOSS: "Guanxi je síť osobních vazeb mezi lidmi, kteří si navzájem důvěřují a prokazují si laskavosti. Vzniká osobním stykem při čaji, hostinách či vzájemné pomoci a často má větší váhu než formální pravidla."
 study_confucian_classics_outcome.190.a: "Postarám se, aby magistráti znali mé jméno."
 study_confucian_classics_outcome.190.b: "Požádám učence, aby se se mnou podělili o své poznámky."
 study_confucian_classics_outcome.190.c: "Nejlepší verše si zaslouží být slyšeny. Budu studovat s těmi nejlepšími."
 study_confucian_classics_outcome.190.d: "Mé zásluhy mluví samy za sebe."
 tgp_known_by_magistrates_modifier: "Známý magistrátům"
 tgp_known_by_magistrates_modifier_desc: "Tato postava je mezi místními magistráty dobře známá."
 tgp_assisted_by_scholars_modifier: "Pomoc místních učenců"
 tgp_assisted_by_scholars_modifier_desc: "Této postavě pomáhá skupina místních učenců."
 tgp_known_by_poets_modifier: "Známý mezi básníky"
 tgp_known_by_poets_modifier_desc: "Tato postava je mezi místními básníky dobře známá."
 study_confucian_classics_outcome.1000.t: "$study_confucian_classics_title$Přísná výchova"
 study_confucian_classics_outcome.1000.desc: "„Proč se neučíš pilněji? Děláš ostudu rodu [ROOT.Char.GetHouse.GetName]!“ [Select_CString(parent.IsFemale, 'Má matka rozhodí', 'Můj otec rozhodí')] vztekle rukama. „Tvé výmluvy nemají větší váhu než prach na tvém stole.“\n\n„Jestli nebudeš studovat, skončíš v hanbě při práci ve skladišti.“"
 study_confucian_classics_outcome.1000.a: "[Select_CString(parent.IsFemale, 'Matku', 'Otce')] nesmím zklamat."
 study_confucian_classics_outcome.1000.b: "Nikdy ze mě nic nebude."
 study_confucian_classics_outcome.1000.c: "Odpusť mi, potřebuji si odpočinout."
 tgp_gave_up_modifier: "Vzdal to"
 tgp_gave_up_modifier_desc: "Tato postava s vlastností [GetTrait('burdened').GetName(GetNullCharacter)] se zcela vzdala."
 tgp_study_harder_modifier: "Pilnější studium"
 tgp_study_harder_modifier_desc: "Rodiče tuto postavu přiměli k pilnějšímu studiu.\n[GetScheme('study_confucian_classics').GetTypeName] [Concept('success_chance','šance na úspěch')|E]: #P +10%#!"
 never_study_again_tt: "Už nikdy nebudeš moci [GetScheme('study_confucian_classics').GetTypeName]"
 dishonor_opinion: "Zneuctění"
 honorable_opinion: "Čestnost"
 satisfied_opinion: "Spokojenost"
 study_confucian_classics_outcome.1010.t: "$study_confucian_classics_title$Rada staršího"
 study_confucian_classics_outcome.1010.desc: "Mé studium se příliš nedaří... Napůl přečtené Letopisy [ROOT.Char.Custom('GetRandomAnnalsPassage')] si žádají mou pozornost, ale má mysl touží po dalším šálku čaje. Když si jej nalévám, všimnu si svitku od [elder.GetTitledFirstName], mého staršího.\n\nStojí v něm: „Drahý učedníku, doslechl[Select_CString(elder.IsFemale, 'a', '')] jsem se, že se ti studium nedaří. Přikládám své úvahy o Hovorech a několik poznámek, které by ti mohly pomoci.“\n\nMá touha po poznání znovu ožívá!"
 study_confucian_classics_outcome.1010.a: "S pomocí [elder.GetTitledFirstName] budu studovat jako nikdy předtím!"
 study_confucian_classics_outcome.1010.b: "Ten svitek mi velmi pomůže."
 artifact_elder_text_name: "Úvahy od [elder.GetFirstNameNoTooltip]"
 artifact_elder_text_description: "Sbírka pečlivě sepsaných úvah a podrobných poznámek od [elder.GetTitledFirstName], která má pomoci učedníkovi jménem [owner.GetFirstName]."
 tgp_motivated_elder_study_modifier: "Pomoc staršího"
 study_confucian_classics_outcome.1020.t: "$study_confucian_classics_title$Ještě větší úsilí"
 study_confucian_classics_outcome.1020.desc: "Takhle to nejde. Nedokážu nic pořádně dokončit. Má pracovna zeje prázdnotou, nepřečtené knihy se vrší jako obvinění proti lapkovi a svitky se povalují po podlaze jako listí z mrtvého stromu.\n\nAle já #EMP vím#!, že to dokážu.\n\nJen. Se. Musím. Soustředit."
 study_confucian_classics_outcome.1020.a: "Žádné další výmluvy. Budu pokračovat!"
 study_confucian_classics_outcome.1020.b: "Trocha [ROOT.Char.Custom('RegionalAlcoholicDrink')] mi pomůže vydržet..."
 study_confucian_classics_outcome.1020.c: "Nadechni se a začni znovu."
 tgp_double_down_on_studies_modifier: "Dvojnásobné úsilí"
 study_confucian_classics_outcome.1030.t: "$study_confucian_classics_title$Božská pomoc"
 study_confucian_classics_outcome.1030.desc: "Mé studium se příliš nedaří. Možná nepotřebuji další svitek... ale božské vedení. [ROOT.Char.GetFaith.KnowledgeGodName] by mi snad mohl pomoci. Vstoupím do místní svatyně, pokleknu před oltářem a sepnu ruce k modlitbě.\n\n„Hledáš poznání, [priest.Custom2('RelationToMeShort', owner)]?“ zašeptá [priest.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', priest)], a vystoupí ze stínů. „Když přineseš malou obětinu nebo pomůžeš s prací kolem svatyně, mohu ti pomoci.“"
 study_confucian_classics_outcome.1030.a: "Mohu přinést skromnou obětinu."
 study_confucian_classics_outcome.1030.b: "Mé ruce jsou ti k službám."
 study_confucian_classics_outcome.1030.c: "Důvěřuji jedině božskému vedení. [ROOT.Char.GetFaith.KnowledgeGodName] mě nezklame."
 tgp_divine_favor_modifier: "Přízeň kněze"
 study_confucian_classics_outcome.1040.t: "$study_confucian_classics_title$Podpora partnera"
 study_confucian_classics_outcome.1040.desc: "Je toho na mě příliš, nedokážu pochopit #EMP [ROOT.Char.Custom('GetRandomRitesPassage')]#!. Všechny mé poznámky jsou špatně! K ničemu!\n\n„[partner.Custom('LoverPetName')|U], trápí tě studium?“ zeptá se tiše [partner.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', partner)], a přináší tác s čajovým pečivem. „Co kdybych se k tobě přidal[Select_CString(partner.IsFemale, 'a', '')]? Když spojíme síly, zvládneme cokoli! A dej si koláček, [Select_CString(partner.IsFemale, 'upekla', 'upekl')] jsem je pro tebe.“"
 study_confucian_classics_outcome.1040.a: "Prosím, přines mi inkoust a čisté listy."
