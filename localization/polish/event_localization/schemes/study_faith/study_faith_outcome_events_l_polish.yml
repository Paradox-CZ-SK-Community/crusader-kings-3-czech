l_polish:
 study_faith_outcome.0010.t: "Nalezení věřícího"
 study_faith_outcome.0010.desc: "Mé nenápadné vyptávání a drobné úplatky se vyplatily! Nyní přede mnou stojí [study_faith_target.GetShortUIName], údajně [Select_CString(study_faith_target.IsFemale,'stoupenkyně','stoupenec')] víry, jejíž věřící se označují jako [target.GetAdherentNamePlural].\n\n"
 study_faith_outcome.0010.desc.in_realm: "Není to dlouho, co zaznělo mé přání setkat se s někým ze svého panství, kdo vyznává víru [target.GetName]. Nyní přede mnou stojí [study_faith_target.GetShortUIName] v odpovědi na mou výzvu.\n\n"
 study_faith_outcome.0010.d.intimidated: "\"Co ode mě žádáš, [ROOT.Char.Custom('CZ_TitleAsName_V')]?\" ptá se roztřeseně [Select_CString(study_faith_target.IsFemale,'ona','on')]. Stráže si [Select_CString(study_faith_target.IsFemale,'ji','ho')] podezřívavě prohlížejí, připravené zasáhnout při prvním náznaku čarodějnictví."
 study_faith_outcome.0010.d.safe: "\"Jak mohu posloužit, [ROOT.Char.Custom('CZ_TitleAsName_V')]?\" ptá se lehce [Select_CString(study_faith_target.IsFemale,'zastrašená','zastrašený')] [study_faith_target.GetFirstNameNoTooltip]. Mé stráže si [Select_CString(study_faith_target.IsFemale,'ji','ho')] nemohou neprohlížet se zvědavostí, protože vědí o zvěstech o mém hledání."
 study_faith_outcome.0010.a: "Dovol mi od tebe studovat víru [target.GetNameNoTooltip]."
 study_faith_outcome.0010.b: "[Select_CString(ROOT.Char.IsFemale,'Rozmyslela jsem','Rozmyslel jsem')] si to."
 study_faith_outcome.0010.b.desc: "[study_faith_target.GetShortUIName] získá svobodu a bude žít podle vlastního uvážení"
 study_faith_outcome.0101.t: "Poznání božstva [actor.GetFaith.HighGodName]"
 study_faith_outcome.0101.desc: "Namáhavé studium ritu [actor.GetRite.GetName] mi pomohlo lépe porozumět [actor.Custom('CZ_FirstName_D')], [Select_CString(actor.IsFemale,'která je má','který je můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))], a především tomu, jak kráčet cestou božstev [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0101.a: "Je čas, abych se skutečně [Select_CString(ROOT.Char.IsFemale,'obrátila','obrátil')] k nové víře."
 study_faith_outcome.0101.b: "Nemohu opustit božstva [ROOT.Char.GetFaith.GoodGodNames]!"
 study_faith_outcome.0102.desc: "Děkuji ti za trpělivost a štědrost, s nimiž mě vedeš z nevědomosti. Nyní kráčím cestou božstev [actor.GetFaith.GoodGodNames]."
 study_faith_outcome.0102.a: "Bylo jedině správné to udělat."
 study_faith_outcome.0103.desc: "Má věrnost patří božstvům [recipient.GetFaith.GoodGodNames]! Nenechám si vnutit opuštění ritu [recipient.GetRite.GetName]."
 study_faith_outcome.0103.a: "Neposlušnost má svou cenu..."
 study_faith_outcome.0111.t: "Nesnadné pochopení ritu [actor.GetRite.GetNameNoTooltip]"
 study_faith_outcome.0111.desc: "Namáhavé studium ritu [actor.GetRite.GetName] mě nikam nedovedlo! Nejenže se mi nedaří kráčet cestou božstev [actor.GetFaith.GoodGodNames], ale obávám se i o přesvědčení [actor.Custom('CZ_FirstName_G')], [Select_CString(actor.IsFemale,'která je má','který je můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))]. Možná je mylné."
 study_faith_outcome.0111.a: "Snad porozumění přijde s obrácením..."
 study_faith_outcome.0111.b: "Zdvojnásobím své úsilí"
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$"
 msg_letter_from_vassal: "$religious_interaction.1.opening$"
 study_faith_outcome.1000.t: "$study_faith$: Průlom"
 study_faith_outcome.1000.desc: "Po vší té tvrdé práci konečně vše zapadlo do sebe. Nekonečné hodiny nad knihami, probdělé noci při nácviku rituálů a nesčetné lekce [target.GetFaith.Custom('CZ_Adjective_ee')] teologie — to vše se konečně spojuje v jasné porozumění. [target.GetRite.GetAdjective] ritus mi otevírá svůj smysl.\n\nPři svém úsilí [Select_CString(ROOT.Char.IsFemale,'jsem se snažila','jsem se snažil')] napodobit [target.Custom('CZ_TitledFirstName_A')]. Teď však začínám chápat, proč se [Select_CString(target.IsFemale,'ona','on')] může cítit dobře v „hřejivé náruči“ ritu [target.GetRite.GetName]."
 study_faith_outcome.1000.a: "Dokážu si osvojit téměř jakoukoli zvyklost jakékoli víry!"
 study_faith_outcome.1000.b: "Ritus [scheme.GetTargetCharacter.GetRite.GetNameNoTooltip] mi dává větší smysl než mé vlastní způsoby..."
 study_faith_outcome.1200.t: "$study_faith$: Zásada se vyjasňuje"
 study_faith_outcome.1200.desc: "Důvěrně známé stěny mé pracovny jsou svědky tichého vítězství. Konečně chápu, proč si [target.GetRite.GetAdjective] ritus cení zásady [discovered_tenet.GetName( target.GetRite )]. Jakkoli je podivná, s trochou představivosti dokážu vidět, jak ji [target.GetTitledFirstName] a [Select_CString(target.IsFemale,'její','jeho')] příbuzní praktikují.\n\nJe to jen jediný krok na dlouhé cestě — přesto má pouť ritem [target.GetRite.GetNameNoTooltip] znovu o píď pokročila."
 study_faith_outcome.1200.a: "Chci poznat další zvyklosti, které má [target.GetRite.GetAdjectiveNoTooltip] ritus!"
 study_faith_outcome.1200.b: "Fascinující. Zajímalo by mě, jak s tím souvisí doktrína [additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )]!"
 study_faith_outcome.1200.c: "Tohle ve mně budí neklid..."
 study_faith_outcome.1400.t: "$study_faith$: Zvyklosti ritu [target.GetRite.GetNameNoTooltip]"
 study_faith_outcome.1400.desc: "K pochopení ritu [target.GetRite.GetName] je třeba studovat nejen jeho metafyzický rámec, ale také jeho běžný vliv na každodenní život.\n\nPo zamyšlení nad doktrínou [discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )] už chápu dost jejích důsledků, abych je [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] spojit se zvyklostmi celého ritu [target.GetRite.GetNameNoTooltip]."
 study_faith_outcome.1400.alt1.desc: "\n\nTo mi zároveň objasnilo jemné rozdíly v praktikování doktríny [third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]!"
 study_faith_outcome.1400.alt2.desc: "\n\nJe to jen jeden dílek mnohem větší skládačky, každý dílek mě však přibližuje k pochopení ritu [target.GetRite.GetNameNoTooltip] jako celku."
 study_faith_outcome.1400.a: "Užitečné poznání. Vpřed."
 study_faith_outcome.1400.b: "Budu studovat dlouho do noci."
 study_faith_outcome.1400.c: "Vyžádám si víc od [target.Custom('CZ_TitleAsNameNoTooltip_G')] [target.Custom('CZ_FirstNameNoTooltipRegnal_G')]."
 study_faith_outcome.1500.t: "$study_faith$: Mimo můj dosah"
 study_faith_outcome.1500.desc: "Dlouhé studium mě přivedlo na hranici toho, co může pochopit člověk zvenčí. [target.GetRite.GetAdjective] ritus si zbývající tajemství ponechává pro ty, kdo se do něj narodili — přecházejí samozřejmě na ty, kdo žijí podle jeho pravidel, chybějí v každém textu a neumí je vymezit ani trpělivý pozorovatel.\n\nVím vše, co může člověk zvenčí vědět."
 study_faith_outcome.1500.a: "[Select_CString(ROOT.Char.IsFemale,'Naučila jsem','Naučil jsem')] se vše, co bylo možné."
 study_faith_outcome.1500.toast: "$study_faith$: Ukončení"
 study_faith_outcome.1500.toast.desc: "Osvojíš si každou [Concept('core_tenet','zásadu')|E] a [Concept('doctrine','doktrínu')|E] [Concept('rite','ritu')|E] [target.GetRite.GetName], kterou může člověk zvenčí poznat."
 study_faith_scheme_stays_active: "[Concept('scheme','Intrika')|E] zůstává aktivní"
 study_faith_outcome.3000.t: "$study_faith$: Pokračovat ve studiu?"
 study_faith_outcome.3000.desc: "[target.GetTitledFirstName] už bohužel není nablízku. Je to škoda, [Select_CString(ROOT.Char.IsFemale,'hledala jsem','hledal jsem')] u [Select_CString(target.IsFemale,'ní','něj')] vedení v jemnějších otázkách víry [target.GetFaith.GetName].\n\nKvůli tomu však nemusím své studium přerušit — stačí najít někoho jiného, koho mohu napodobit!"
 study_faith_outcome.3000.alt1.desc: "[target.GetTitledFirstName] bohužel [Select_CString(target.IsFemale,'nebyla','nebyl')] nejlepší volbou pro vedení v jemnějších otázkách víry [target.GetFaith.GetName].\n\nKvůli tomu však nemusím své studium přerušit — stačí najít někoho jiného, koho mohu napodobit!"
 study_faith_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] je [Select_CString(potential_continuation_target_1.IsFemale,'horlivá stoupenkyně','horlivý stoupenec')] víry!"
 study_faith_outcome.3000.b: "Snad [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? [Select_CString(potential_continuation_target_2.IsFemale,'Její','Jeho')] teologie je zajímavá."
 study_faith_outcome.3000.c: "Možná [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?"
 study_faith_outcome.3000.d: "Ach, právě se hodil nějaký důvod přestat studovat! Hurá!"
 study_faith_scheme_retains_progress: "[Concept('scheme','Intrika')|E] si zachová veškerý dosavadní postup"
 child_studied_faith_title: "[owner.Custom('GetDaughterSon')|U] studuje ritus!"
 child_studied_faith_desc: "[Select_CString(owner.IsFemale,'Tvá','Tvůj')] [owner.Custom('GetDaughterSon')] se [Select_CString(owner.IsFemale,'dozvěděla','dozvěděl')] více o [Concept('rite','ritu')|E] [target.GetRite.GetName]"
 child_studied_faith_invalidated_title: "Zneplatnění studia ritu tvého dítěte"
 child_studied_faith_invalidated_desc: "[Concept('scheme','Intrika')|E] [GetScheme('study_faith').GetTypeName] tvého dítěte byla zneplatněna"
 study_faith_ongoing.1000.t: "$study_faith$: Lehkost mládí"
 study_faith_ongoing.1000.t.theologian: "$study_faith$: Lehkost zkušenosti"
 study_faith_ongoing.1000.desc.young: "Mé studium víry [scheme.GetTargetCharacter.GetFaith.GetName] postupuje skvěle. Mám pocit, že mám všechnu soustředěnost i energii světa!"
 study_faith_ongoing.1000.desc.theologian: "Mé studium víry [scheme.GetTargetCharacter.GetFaith.GetName] pěkně pokračuje. Je zjevné, že její rámec není zase tak odlišný od rámce jiných věr!"
 study_faith_ongoing.1000.desc: "\n\n„#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!“\n\nMožná slova parafrázuji, ale mám pocit, že duch víry je jasný, i když teprve rozplétám jednotlivosti jejího slova.\n\nPokud se budu dál tak přesně soustředit, brzy ovládnu všechna tajemství víry [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1000.a: "Věnuji tomu #EMP všechen#! svůj čas!"
 study_faith_ongoing.1000.b: "Raději věnuji svůj čas něčemu jinému..."
 study_faith_ongoing.1010.t: "$study_faith$: Důvěrné porozumění"
 study_faith_ongoing.1010.desc: "#EMP „[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]“#!\n\nCítím něčí přítomnost a vzhlédnu od rozboru [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_eeho')] písma. [lover_target.GetFirstName] se nade mnou sklání s chlípným pohledem.\n\n„Je ten text o víře [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]?“ ptá se [Select_CString(lover_target.IsFemale,'ona','on')].\n\n„Jak nádherné je mít u dvora dalšího věřícího, a dokonce v postavení [ROOT.Char.GetTitleTierName]! Snad bych ti [Select_CString(lover_target.IsFemale,'mohla','mohl')] pomoci svým poněkud... důvěrnějším porozuměním?“"
 study_faith_ongoing.1010.a: "Odeberme se do mých komnat, ať nás nikdo neruší."
 study_faith_ongoing.1010.b: "Jsi [lover_target.Custom('GetDerogatoryNonbeliever')] — já jen studuji, to je všechno!"
 study_faith_ongoing.1010.c: "Jsi [lover_target.Custom2('InsultNounSexual', ROOT.Char)]! Odejdi, musím se soustředit!"
 study_faith_ongoing.1010.c.tt: "#EMP Zavřeš [Select_CString(lover_target.IsFemale,'jí','mu')] dveře před nosem a pokračuješ ve studiu#!"
 study_faith_ongoing.1011.t: "$study_faith$: Falešná stopa"
 study_faith_ongoing.1011.desc: "Podezření mám už nějakou dobu a několik otázek nastražených jako past konečně odhalilo přetvářku [scheme.GetTargetCharacter.Custom('CZ_TitledFirstName_G')]. Navzdory všem tvrzením není [Select_CString(scheme.GetTargetCharacter.IsFemale,'její','jeho')] víra [scheme.GetTargetCharacter.GetFaith.GetName] upřímná!\n\nPřestože divadlo nevěřícího je samo o sobě zajímavé, pro skutečný pokrok v mém porozumění víře [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] bude asi nejlepší najít věrnějšího stoupence..."
 study_faith_ongoing.1011.a: "Na [scheme.GetTargetCharacter.Custom('CZ_TitleAsNameNoTooltip_A')] [scheme.GetTargetCharacter.Custom('CZ_FirstNameNoTooltipRegnal_A')] už se nemohu spoléhat."
 study_faith_ongoing.1011.b: "Když to [Select_CString(scheme.GetTargetCharacter.IsFemale,'ona','on')] tak dobře skrývá, možná to zvládnu i já..."
 study_faith_ongoing.1011.c: "Dobrá, v co tedy [scheme.GetTargetCharacter.GetShortUINameNoTooltip] #EMP vlastně#! věří?"
 study_faith_ongoing.1011.c.tt: "Pokusím se proniknout k [Select_CString(scheme.GetTargetCharacter.IsFemale,'jejímu','jeho')] tajnému přesvědčení."
 study_faith_ongoing.1012.t: "$study_faith$: Stoupenec dávných ritů"
 study_faith_ongoing.1012.desc: "Mé pokusy prozkoumat víru [scheme.GetTargetCharacter.Custom('CZ_TitledFirstName_G')] přinesly ovoce, byť nečekané. [Select_CString(scheme.GetTargetCharacter.IsFemale,'ona','on')|U] bezpochyby nevyznává víru [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip], ale zřejmě následuje podivné, zapomenuté rity víry [actual_faith.GetName]. Jejich praktikování se podobá... čarodějnictví.\n\nTen objev mnou otřásl. Mohu z něj nějak vytěžit?"
 study_faith_ongoing.1012.a: "Přesto je #EMP zajímavé#! to vědět."
 study_faith_ongoing.1012.b: "Pro své studium budu potřebovat nového učitele."
 study_faith_ongoing.1012.b.tt: "Pokusíš se najít podobného učitele a pokračovat ve studiu víry [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]"
 study_faith_ongoing.1012.c: "Tohle vlastně vypadá mnohem lákavěji než víra [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1012.c.tt: "Nyní budeš studovat víru [actual_faith.GetNameNoTooltip]"
 study_faith_ongoing.1013.t: "$study_faith$: Spíše kejklíř než mystik"
 study_faith_ongoing.1013.desc: "Mé pokusy prozkoumat víru [scheme.GetTargetCharacter.Custom('CZ_TitledFirstName_G')] selhaly. Za [Select_CString(scheme.GetTargetCharacter.IsFemale,'její','jeho')] zbožnou fasádou se zřejmě skrývá pohled na svět zcela prostý teologických základů.\n\nMožná [Select_CString(scheme.GetTargetCharacter.IsFemale,'ona','on')] následuje zásady víry [scheme.GetTargetCharacter.GetFaith.GetName] jen pro pohodlí, vliv či bezpečí?\n\nAť jsou důvody jakékoli, je jasné, že [Select_CString(scheme.GetTargetCharacter.IsFemale,'tato žena','tento muž')] svému hlásanému přesvědčení nevěnuje skutečný zájem."
 study_faith_ongoing.1013.a: "Ztráta času! S vírou [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] končím."
 study_faith_ongoing.1020.t: "$study_faith$: Místní věřící"
 study_faith_ongoing.1020.desc: "Zdá se, že mé studium [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_eeho')] způsobu víry dolehlo k uším [faith_helper.Custom('CZ_TitledFirstName_G')]. [Select_CString(faith_helper.IsFemale,'ona','on')|U] víru praktikuje místně a nabízí mi pomoc se studiem.\n\n„Žádám jen drobný projev vděku za své úsilí, [ROOT.Char.Custom('FormOfAddressForLiege')],“ říká [Select_CString(faith_helper.IsFemale,'ona','on')] a [faith_helper.Custom('quirk_pos_pp')]."
 study_faith_ongoing.1020.a: "Pokud mi pomůžeš, toto zlato bude tvé."
 study_faith_ongoing.1020.b: "Laskavost za laskavost?"
 study_faith_ongoing.1020.c: "Ach, jak #EMP nezištné#! od tebe, nabídnout mi pomoc zdarma!"
 study_faith_ongoing.1020.d: "Děkuji, ale zvládnu to bez pomoci."
 study_faith_ongoing.1020.c.success: "Přiměješ [faith_helper.Custom('CZ_FirstNameNoTooltip_A')] lichocením k pomoci"
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip] tvou manipulaci ihned prohlédne"
 study_faith_ongoing.1030.t: "$study_faith$: Starý posvátný text"
 study_faith_ongoing.1030.desc: "S vypočítavým úsměvem ke mně přichází [Select_CString(chosen_peasant.IsFemale,'žena','muž')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], je pravda, že studuješ způsoby víry [scheme.GetTargetCharacter.GetFaith.GetName]? Můj otec z jedné cesty ke svatému místu [holy_site.GetNameNoTier] přivezl tento posvátný text, [scheme.GetTargetCharacter.GetFaith.ReligiousText]!\"\n\n\"Nemám pro něj využití, protože neumím číst. S radostí ti jej přenechám výměnou za pár mincí."
 study_faith_ongoing.1030.a: "Jaká šťastná náhoda. Mé zlato je tvé."
 study_faith_ongoing.1030.b: "Není to tak vzácné, jak si asi myslíš..."
 study_faith_ongoing.1030.b.flavor: "Smlouvat s tímto podomním obchodníkem s cetkami"
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName] přijme dohodu"
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName] se tvou nabídkou cítí [Select_CString(chosen_peasant.IsFemale,'uražena','uražen')]"
 study_faith_ongoing.1030.c: "Stráže, zabavte [Select_CString(chosen_peasant.IsFemale,'jí','mu')] tyto pohanské texty."
 study_faith_ongoing.1030.d: "[Select_CString(chosen_peasant.IsFemale,'Podvodnice','Podvodníku')]! Zmiz..."
 study_faith_ongoing.1040.t: "$study_faith$: Obdiv"
 study_faith_ongoing.1040.desc: "Jaká vzpruha! V několika dopisech [target.GetTitledFirstName] chválí mé úsilí poznat jemné rozdíly [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_eeho')] přesvědčení. [Select_CString(target.IsFemale,'ona','on')|U] dokonce tvrdí, že jsem [Select_CString(ROOT.Char.IsFemale,ROOT.Char.GetFaith.Custom('CZ_Adjective_aa'),ROOT.Char.GetFaith.Custom('CZ_Adjective_yy'))] [Select_CString(ROOT.Char.IsFemale,'badatelka','badatel')] nad všechny ostatní, co studují víru [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!\n\nJe příjemné dočkat se uznání za tvrdou práci!"
 study_faith_ongoing.1040.a: "Písaři! Pošlete odpověď s mými díky."
 study_faith_ongoing.1040.b: "Vyjádření víry [target.Custom('CZ_FirstNameNoTooltip_G')] mi otevírá oči..."
 study_faith_ongoing.1040.c: "Pche! Nepotřebuji uznání od nikoho kromě #EMP sebe!#!"
 study_faith_ongoing.1050.t: "$study_faith$: Zápach sabotáže"
 study_faith_ongoing.1050.desc: "Mé poznámky vykládající občas matoucí a protichůdné zásady víry [scheme.GetTargetCharacter.GetFaith.GetName] jsou rozházené po celé pracovně. Měsíce práce leží potrhané a rozervané. Volný list na okně naznačuje, že část poznámek skončila venku.\n\nMusím snad začít zase od nuly?!\n\n#EMP Čich, čich...#!Co je to za nasládlý pach? Kadidlo nebo santalové dřevo smíchané s něčím... květinovým? Vůně mi připomene samolibou tvář. [sabotage_rival.Custom2('InsultAdjective', ROOT.Char)] [sabotage_rival.GetTitledFirstName] — [Select_CString(sabotage_rival.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))] — mi usiluje o zkázu..."
 study_faith_ongoing.1050.a: "Mé poznámky... ne! Tolik práce, pryč!"
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip] si zaslouží #EMP ZEMŘÍT!#!"
 study_faith_ongoing.1050.c: "Ha ha! Vždycky si dělám #EMP záložní poznámky!#!"
 study_faith_ongoing.1060.t: "$study_faith$: Nevědomý výklad"
 study_faith_ongoing.1060.desc: "Na zkoušku svého pokroku se pokouším shrnout pasáž z posvátného textu [scheme.GetTargetCharacter.GetFaith.ReligiousText|U]. Naslouchá mi [offended_character.GetTitledFirstName], [Select_CString(offended_character.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', offended_character)], [Select_CString(offended_character.IsFemale,scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_aa'),scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_yy'))] věřící. #EMP „...[offended_character.GetFaith.PriestNeuter] musí pozvednout předmět zvaný [target.Custom('GetAccessory')]; pak, [target.Custom('FormOfAddressForLiege')], můžeš utrhnout květinu, která se jmenuje [target.GetCurrentLocation.Custom('get_region_flower_type')]-“#!\n\n„Tvůj výklad nedává smysl! Vypadá to, že [offended_character.GetFaith.PriestNeuterPlural] si podle tebe zaslouží označení ‚[offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))]‘ a že [offended_character.GetFaith.HighGodName] je [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!?“\n\nMožná mi jemnější stránka [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_eeho')] způsobu víry stále uniká..."
 study_faith_ongoing.1060.a: "Prosím, přijmi to jako projev mé lítosti."
 study_faith_ongoing.1060.b: "[Select_CString(ROOT.Char.IsFemale,'Chtěla jsem','Chtěl jsem')] vyzdvihnout ctnosti, které má váš duchovní, [offended_character.GetFaith.PriestNeuter]!"
 study_faith_ongoing.1060.c: "Víš co!? [offended_character.GetFaith.HighGodName] je #EMP [offended_character.Custom2('InsultNoun', ROOT.Char)]!#!"
 study_faith_ongoing.1060.d: "[Select_CString(ROOT.Char.IsFemale,'Doufala jsem','Doufal jsem')] jen, že lépe pochopím víru [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!"
 study_faith_ongoing.1060.b.success: "Přiměješ [Select_CString(offended_character.IsFemale,'ji','ho')] uvěřit, že #EMP [Select_CString(ROOT.Char.IsFemale,'jsi lichotila','jsi lichotil')]#! duchovním této víry, které nazývá [offended_character.GetFaith.PriestNeuterPlural]"
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip] tvou lež prohlédne"
 study_faith_ongoing.1060.d.success: "Úspěšně vysvětlíš, že šlo o nedorozumění"
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip] ti nevěří"
 study_faith_ongoing.1070.t: "$study_faith$: Nestoudné mýty"
 study_faith_ongoing.1070.desc: "Dar [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_yych')] mytologických textů od [target.Custom('CZ_TitledFirstName_G')] rozvířil dvůr. Mnozí přihlížejí, když je pročítám a nejzajímavější pasáže čtu nahlas.\n\nNejprve se domnívám, že si se mnou zlomyslně hrají zlé mocnosti, [ROOT.Char.GetFaith.EvilGodNames]. Po důkladném prozkoumání některých vzrušujících pasáží však začíná být jasné, že jde o text erotické povahy.\n\nCo v posvátném textu dělají zmínky o intimních rysech božstva plodnosti, o němž se píše [scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive] [ROOT.Char.Custom('ObjectifiedFeature')]?! [ROOT.Char.Custom('CulturalCurse')|U]."
 study_faith_ongoing.1070.a: "Stráže, zbavte mě té proklaté knihy!"
 study_faith_ongoing.1070.b: "Opovažují se mi smát!? #EMP Zbičujte je všechny.#!"
 study_faith_ongoing.1070.c: "Nu, snad to #EMP je#! svým způsobem poučné..."
 study_faith_ongoing.1080.t: "$study_faith$: Skvělý učitel"
 study_faith_ongoing.1080.desc: "[Select_CString(court_tutor.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', court_tutor)] [court_tutor.GetFirstName] mi neúnavně pomáhá s porozuměním jemnějším otázkám víry [scheme.GetTargetCharacter.GetFaith.GetName].\n\n[Select_CString(court_tutor.IsFemale,'Její','Jeho')] oddanost učitelskému umění je inspirující! Vždy má po ruce nějaký [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_yy')] text nebo mi najde učeného duchovního — [scheme.GetTargetCharacter.GetFaith.PriestNeuter] — k rozhovoru.\n\nBez [Select_CString(court_tutor.IsFemale,'její','jeho')] pomoci by mé porozumění skutečně nepokročilo tak daleko."
 study_faith_ongoing.1080.a: "[court_tutor.Custom('CZ_FirstNameNoTooltip_V')], zasloužíš si odměnu!"
 study_faith_ongoing.1080.b: "[Select_CString(court_tutor.IsFemale,'ona','on')|U] dělá svou práci dobře."
 study_faith_ongoing.1090.t: "$study_faith$: Nepochopitelné!"
 study_faith_ongoing.1090.desc.intro: "Teologii víry [scheme.GetTargetCharacter.GetFaith.GetName] nelze pochopit!"
 study_faith_ongoing.1090.tenet.desc: "Především mi zcela uniká přesvědčení vyjádřené zásadou [discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )]."
 study_faith_ongoing.1090.doctrine.desc: "Především mi zcela uniká doktrína [discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )]."
 study_faith_ongoing.1090.desc.main: "\n\nMá hlava je plná! Sotva jeden pojem vstoupí dovnitř, jiný je vytlačen do propasti zapomnění."
 study_faith_ongoing.1090.friend.desc: "\n\n„Vytrvej! Jsi [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.Char.Custom('ComplimentAdjective')] [Select_CString(ROOT.Char.IsFemale,'přítelkyně','přítel')] a já ti věřím!“\n\nNaštěstí mi [helpful_friend.GetTitledFirstName] vždy pomůže rozplést tato cizí učení. Skutečně mám požehnání."
 study_faith_ongoing.1090.no_friend.desc: "\n\nMožná potřebuji přestávku?"
 study_faith_ongoing.1090.a: "Na vedení [helpful_friend.Custom('CZ_FirstNameNoTooltip_G')] se mohu vždy spolehnout!"
 study_faith_ongoing.1090.b: "Ať to působí sebevíc podivně, musím vytrvat!"
 study_faith_ongoing.1090.c: "Jen musím na chvíli odložit knihy..."
 study_faith_ongoing.1090.d: "Je to beznadějné!"
 study_faith_ongoing.1100.t: "$study_faith$: [Select_CString(ROOT.Char.IsFemale,target.GetFaith.Custom('CZ_Adjective_aa'),target.GetFaith.Custom('CZ_Adjective_yy'))] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]"
 study_faith_ongoing.1100.desc: "Zprávy o mém pilném studiu víry [scheme.GetTargetCharacter.GetFaith.GetName] se rozšířily.\n\nŘíkají mi „[Select_CString(ROOT.Char.IsFemale,target.GetFaith.Custom('CZ_Adjective_aa'),target.GetFaith.Custom('CZ_Adjective_yy'))] [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]“, což by mohlo vést ke zmatkům..."
 study_faith_ongoing.1100.a: "Obratný proslov by mohl usmířit můj lid i věřící, kteří se nazývají [target.GetFaith.GetAdherentNamePluralNoTooltip]!"
 study_faith_ongoing.1100.b: "Mé studium je má věc. Žádné rozptylování!"
 study_faith_ongoing.1100.c: "[scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] to jistě ocení!"
 study_faith_ongoing.1100.a.success: "Proneseš skvělý proslov"
 study_faith_ongoing.1100.a.success.tt: "Každý dvořan či host vyznávající víru [root_scope.GetFaith.GetNameNoTooltip] nebo [target.GetFaith.GetNameNoTooltip]"
 study_faith_ongoing.1100.a.failure: "Ztrapníš se"
 study_faith_ongoing.1110.t: "$study_faith$: Kouzlo [target.GetFaith.Custom('CZ_Adjective_ee')] poezie"
 study_faith_ongoing.1110.desc: "Ach, „[poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U] a [poet_location.Custom('GetTerrainTypePlural')|U]“ od [the_poet.Custom('CZ_FirstName_G')] z hrabství [poet_location.GetCounty.GetName]. Skutečně skvělá sbírka [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_ee')] poezie!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nSnad je poezie oknem do víry?"
 study_faith_ongoing.1110.a: "Zkusím skládat [target.GetFaith.Custom('CZ_Adjective_ee')] verše!"
 study_faith_ongoing.1110.b: "Mám přednést #EMP milostnou#! báseň pro [lover_to_be.Custom('CZ_FirstNameNoTooltip_A')], [Select_CString(lover_to_be.IsFemale,'která je má','který je můj')] [ROOT.Char.Custom2('RelationToMeShort', lover_to_be)]?"
 study_faith_ongoing.1110.c: "Rozeberu báseň z hlediska jejích náboženských kvalit."
 study_faith_ongoing.1110.a.success: "Zjistíš, že ti poezie jde od ruky"
 study_faith_ongoing.1110.a.failure: "Tvé pokusy o poezii jsou žalostné"
 study_faith_ongoing.1120.t: "$study_faith$: Kacířské příběhy"
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n\"Člověk v postavení [ROOT.Char.GetTitleTierName] studuje báje cizí víry? Nemáš stud!?\" zvolá [Select_CString(zealot.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', zealot)] [zealot.GetTitledFirstName].\n\n\"Pokud se tví nepřátelé dozvědí, že se sbližuješ s kacířskými myšlenkami, udělají vše pro to, aby z tebe udělali kacíře!\"\n\nMožná si mé čtení [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_yych')] spisů mohou hlupáci a nepřátelé vyložit špatně — těch je všude dost, i tam, kde sídlí můj [ROOT.Char.Custom('GetCourt')]."
 study_faith_ongoing.1120.a: "Ne! To jsou... #EMP ctihodná [target.GetFaith.Custom('CZ_Adjective_aa')] teologická pojednání!#!"
 study_faith_ongoing.1120.b: "Opovažuješ se mě obvinit z kacířství!? Já ti ukážu!"
 study_faith_ongoing.1120.c: "Máš pravdu. Takové texty se nesluší číst, když zastávám postavení [ROOT.Char.GetTitleTierName]."
 study_faith_ongoing.1120.d: "Ať si lidé myslí, co chtějí. Tyto spisy přinášejí osvícení!"
 study_faith_ongoing.1120.a.success: "Oklameš [zealot.Custom('CZ_FirstNameNoTooltip_A')]"
 study_faith_ongoing.1120.a.failure: "Tvá záliba v kacířské četbě vejde ve všeobecnou známost"
 study_faith_ongoing.1120.b.tt: "Vyzveš [zealot.Custom('CZ_FirstName_A')] na #V souboj#!, abys [Select_CString(zealot.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'potrestala','potrestal')] za drzost!\n#weak Tento souboj NENÍ na život a na smrt.#!\nPokud vyhraješ, získáš [prestige_i] [Concept('prestige','prestiž')|E] a [Concept('modifier','modifikátor')|E] pro [Concept('scheme','intriku')|E]. Pokud prohraješ, staneš se terčem posměchu.\n\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[Concept('prowess','Udatnost')|E] [zealot.Custom('CZ_FirstName_G')]: [prowess_i]#V [zealot.GetProwess]#!"
 study_faith_ongoing.1121.trigger_failure: "Můj souboj s [zealot.Custom('CZ_FirstNameNoTooltip_I')] byl zneplatněn"
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1123.desc: "\"Vzdávám se! Prosím, odpusť mi, rozhodně nejsi [Select_CString(ROOT.Char.IsFemale,'slabomyslná','slabomyslný')]! Jen mě ušetři!\" zvolá [zealot.GetTitledFirstName].\n\nTo [Select_CString(zealot.IsFemale,'ji','ho')] naučí urážet #EMP mě#!."
 study_faith_ongoing.1123.a: "Jak kdysi řeklo moudré zvíře, [ROOT.Char.Custom('GetAnimalType')|U]: \"Neurážej ty, kdo stojí nad tebou!\""
 study_faith_ongoing.1123.b: "Za svou drzost shniješ v žaláři!"
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$"
 study_faith_ongoing.1124.desc: "[zealot.GetTitledFirstName] plivne vedle tebe, jak ležíš na zemi.\n\n\"Tvé postavení [ROOT.Char.GetTitleTierName] je při té ubohé slabosti výsměchem. Teď ti prokážu laskavost a zbavím tě těchto nesmyslných knih,\" říká [Select_CString(zealot.IsFemale,'ona','on')]."
 study_faith_ongoing.1124.a: "Překážka v mém studiu..."
 study_faith_ongoing.1130.t: "$study_faith$: Potěšení víry"
 study_faith_ongoing.1130.desc: "\"Ach, [ROOT.Char.Custom('CZ_FirstNameNoTooltip_V')]! Opravdu se učíš o mé milované víře [scheme.GetTargetCharacter.GetFaith.GetName]? Vážím si takového úsilí porozumět mi!\" říká [lover_to_help.GetTitledFirstName] a [lover_to_help.Custom('quirk_pos_pp')].\n\n\"[Select_CString(lover_to_help.IsFemale,'Ráda','Rád')] ti pomohu #EMP jakýmkoli#! možným způsobem.\""
 study_faith_ongoing.1130.a: "Přijmu jakoukoli pomoc!"
 study_faith_ongoing.1130.b: "Napadá mě jeden velmi příjemný způsob."
 study_faith_ongoing.1130.c: "Raději budu studovat bez pomoci."
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip] je [Select_CString(lover_to_help.IsFemale,'dobrá učitelka, byť koketní','dobrý učitel, byť koketní')]"
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip] zaměřuje tvé lekce na tak okrajové a smyslné prvky teologie, že nedokážeš pochopit, jak jsou slučitelné s vírou jako celkem"
 study_faith_ongoing.1130.a.failure.toast: "Pomoc [lover_to_help.Custom('CZ_FirstNameNoTooltip_G')] je příliš koketní, než aby byla užitečná."
 study_faith_ongoing.1140.t: "$study_faith$: Pomocná ruka"
 study_faith_ongoing.1140.desc: "\"Chválím tvé úsilí poznat víru [scheme.GetTargetCharacter.GetFaith.GetName], jistě to posílí tvé postavení [ROOT.Char.GetTitleTierName]!\" zvolá [Select_CString(close_one_to_help.IsFemale,'má','můj')] [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName].\n\n\"Způsoby víry [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] znám od narození. Snad ti mohu pomoci, [root_for_loc.Custom('CZ_FirstName_V')]?\""
 study_faith_ongoing.1140.a: "Pomůžeš mi porozumět této zásadě?"
 study_faith_ongoing.1140.b: "Chceš se přidat k mému studiu?"
 study_faith_ongoing.1200.t: "$study_faith$: Pohanský pes"
 study_faith_ongoing.1200.desc: "Při svém úsilí poznat tajemství víry [scheme.GetTargetCharacter.GetFaith.GetName] si vedu uspořádané poznámky. Jsou skutečně jediným prostředkem, jak zvládnout chaos jiného systému víry. Bohužel se zřejmě samy někam založily.\n\nDo ruky se mi otírá důvěrně známý mokrý nos, který patří mému psu jménem [ROOT.Char.Custom('DogStoryName')]. Pohlédnu na svého miláčka a doufám v úlevu od frustrace.\n\n[ROOT.Char.Custom('DogStorySheHe')] ke mně vzhlíží a hrdě vrtí ocasem. Teprve pak si všimnu, že v zubech pevně svírá mé poznámky..."
 study_faith_ongoing.1200.a: "Na tebe se přece nemohu dlouho zlobit!"
 study_faith_ongoing.1200.b: "Chceš na procházku? Tak pojď."
 study_faith_ongoing.1200.c: "To není hračka! #EMP Zlobivý#! pes!"
 study_faith_ongoing.1300.t: "$study_faith$: Učit se praxí"
 study_faith_ongoing.1300.desc: "Když procházíme místním panstvím [ROOT.Char.GetCurrentLocation.GetTitle.GetName], obyvatelé právě pořádají [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_ou')] oslavu. Přichází k nám [Select_CString(interlocutor.IsFemale,'žena','muž')] a zve nás, abychom se přidali, přestože jsme [ROOT.Char.GetFaith.GetAdherentNamePlural].\n\nMůj doprovod se pokouší vstoupit mezi nás v obavě, že jde o past.\n\nK čertu s nebezpečím. Stěží si dokážu představit lepší příležitost poznat víru [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] na vlastní kůži!"
 study_faith_ongoing.1300.a: "Ukaž mi cestu!"
 study_faith_ongoing.1300.a.flavor: "Je to jen malý [scheme.GetTargetCharacter.GetFaith.Custom('CZ_Adjective_yy')] rituál. Co by se mohlo stát?"
 study_faith_ongoing.1300.b: "Debata o podrobnostech [Select_CString(interlocutor.IsFemale,'její','jeho')] víry bude jistě nejpoučnější."
 study_faith_ongoing.1300.b.flavor: "Pokusíš se s [interlocutor.Custom('CZ_FirstNameNoTooltip_I')] zapříst přátelskou debatu"
 study_faith_ongoing.1300.b.success: "Povedeš poutavou debatu s [interlocutor.Custom('CZ_FirstNameNoTooltip_I')]"
 study_faith_ongoing.1300.b.failure: "Nepodaří se ti dorozumět se s [interlocutor.Custom('CZ_FirstNameNoTooltip_I')]"
 study_faith_ongoing.1300.c: "„Přidej se k nám na cestě do místa, kterým je [next_destination.GetNameNoTooltip]!“"
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"
 holy_text_indeterminate_quote_1: "Jako můra nezná písmo hvězd, a přesto najde plamen, ani duše nemusí božství pojmenovat, aby ji strávilo."
 holy_text_indeterminate_quote_2: "Když pouštní vítr vymazal tyranovy kroky, písek si pamatoval jen stopy žíznivých a laskavých."
 holy_text_indeterminate_quote_3: "Řeka si nevybírá oblázky, které vyhladí, přesto je s léty všechny zušlechťuje k dokonalosti."
 holy_text_indeterminate_quote_4: "Pij z pramene poznání a on ti ohne záda."
 holy_text_indeterminate_quote_5: "V den, kdy se hora sklonila, nesklonila se před králem ani vojskem, nýbrž se sehnula, aby slyšela dětskou otázku."
 holy_text_indeterminate_quote_6: "Skrytý nejprve promlouvá šeptem pochybností, aby tvá víra byla skutečně tvá, až mu konečně odpovíš."
 holy_text_indeterminate_quote_7: "Každá lež vyřčená před oltářem se vrací jako dým, ale každá upřímná slza je zaseta jako semeno v zahradách posmrtného údělu [ROOT.Char.GetFaith.PositiveAfterLife]."
 holy_text_indeterminate_quote_8: "Neproklínej temnotu, která halí tvou cestu; je tu proto, aby se tvůj vlastní plamen naučil odvaze hořet."
 holy_text_indeterminate_quote_9: "Zářící nepočítá modlitby pyšných, jen tichá milosrdenství vykonaná, když se nikdo nedívá."
 holy_text_indeterminate_quote_10: "Když se svět rozdělil na „mé“ a „tvé“, božství se zasmálo, neboť v jeho očích bylo jen „naše“."
