l_polish:
 study_faith_outcome.0010.t: "Nalezen [target.GetAdherentNameNoTooltip]!" # todo: NEW TRANSLATION
 study_faith_outcome.0010.desc: "Moje nenápadné pátrání a drobné úplatky se vyplatily! Nyní přede mnou stojí [study_faith_target.GetShortUIName], údajně [target.GetAdherentName].\n\n" # todo: NEW TRANSLATION
 study_faith_outcome.0010.desc.in_realm: "Není to tak dávno, co jsem požádal o setkání s [target.GetAdherentName] z mé říše. Nyní přede mnou stojí [study_faith_target.GetShortUIName] a vyslyšel mou výzvu.\n\n" # todo: NEW TRANSLATION
 study_faith_outcome.0010.d.intimidated: "„Co ode mě žádáte, můj [ROOT.Char.GetTitleAsName]?“ ptá se [study_faith_target.GetSheHe] a třese se. Stráže si [study_faith_target.GetHerHim] podezřívavě prohlížejí a jsou připraveny zasáhnout při prvním náznaku čarodějnictví." # todo: NEW TRANSLATION
 study_faith_outcome.0010.d.safe: "„Jak vám mohu posloužit, můj [ROOT.Char.GetTitleAsName]?“ ptá se [study_faith_target.GetSheHe] s lehkou obavou. Mé stráže si [study_faith_target.GetHerHim] nemohou přestat zvědavě prohlížet, neboť vědí o zvěstech, že někoho hledám." # todo: NEW TRANSLATION
 study_faith_outcome.0010.a: "Pověz mi o [target.GetNameNoTooltip]." # todo: NEW TRANSLATION
 study_faith_outcome.0010.b: "Rozmyslel jsem si to." # todo: NEW TRANSLATION
 study_faith_outcome.0010.b.desc: "[study_faith_target.GetShortUIName] bude propuštěn(a), aby mohl(a) žít svůj život tak, jak uzná za vhodné" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [study_faith_target.GetHerHis], [study_faith_target.GetSheHe]
 study_faith_outcome.0101.t: "Seznámení s [actor.GetFaith.HighGodName]" # todo: NEW TRANSLATION
 study_faith_outcome.0101.desc: "Náročné studium [actor.GetRite.GetName] mi pomohlo lépe pochopit [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetName] a především to, jak kráčet po cestě [actor.GetFaith.GoodGodNames]." # todo: NEW TRANSLATION
 study_faith_outcome.0101.a: "Je čas přijmout novou víru." # todo: NEW TRANSLATION
 study_faith_outcome.0101.b: "Nemohu opustit [ROOT.Char.GetFaith.GoodGodNames]!" # todo: NEW TRANSLATION
 study_faith_outcome.0102.desc: "Děkuji ti za trpělivost a štědrost, s jakou jsi mě vyvedl z nevědomosti. Nyní kráčím po cestě [actor.GetFaith.GoodGodNames]." # todo: NEW TRANSLATION
 study_faith_outcome.0102.a: "Bylo to tak správné." # todo: NEW TRANSLATION
 study_faith_outcome.0103.desc: "Jsem věrný [recipient.GetFaith.GoodGodNames]! Nedonutíš mě zříci se [recipient.GetRite.GetName]." # todo: NEW TRANSLATION
 study_faith_outcome.0103.a: "Za neposlušnost se platí..." # todo: NEW TRANSLATION
 study_faith_outcome.0111.t: "Nedaří se mi pochopit [actor.GetRite.GetNameNoTooltip]" # todo: NEW TRANSLATION
 study_faith_outcome.0111.desc: "Namáhavé studium [actor.GetRite.GetName] mě nikam neposunulo! Nejenže se mi nedaří kráčet po cestě [actor.GetFaith.GoodGodNames], ale obávám se, že můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))] [actor.GetFirstNamePossessive] se může ve svém přesvědčení mýlit." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [actor.GetHerHis]
 study_faith_outcome.0111.a: "Snad to pochopím, až konvertuji..." # todo: NEW TRANSLATION
 study_faith_outcome.0111.b: "Zdvojnásobím své úsilí." # todo: NEW TRANSLATION
 study_faith_outcome.0111.c: "$study_faith_outcome.0101.b$" # todo: NEW TRANSLATION
 msg_letter_from_vassal: "$religious_interaction.1.opening$" # todo: NEW TRANSLATION
 study_faith_outcome.1000.t: "$study_faith$: Průlom" # todo: NEW TRANSLATION
 study_faith_outcome.1000.desc: "Po veškerém mém úsilí do sebe věci konečně zapadly. Nekonečné hodiny nad knihami, probdělé noci při nacvičování obřadů, nespočet lekcí z [target.GetFaith.GetAdjective] teologie — to vše se konečně spojilo v jasné pochopení obřadu [target.GetRite.GetAdjective] víry.\n\nSnažil jsem se napodobovat [target.GetTitledFirstName], ale nyní začínám chápat, jak se [target.GetSheHe] může cítit v „hřejivém objetí“ obřadu [target.GetRite.GetName]." # todo: NEW TRANSLATION
 study_faith_outcome.1000.a: "Mohu se naučit téměř každý zvyk každé víry!" # todo: NEW TRANSLATION
 study_faith_outcome.1000.b: "Obřad [scheme.GetTargetCharacter.GetRite.GetNameNoTooltip] mi dává větší smysl než mé vlastní zvyklosti..." # todo: NEW TRANSLATION
 study_faith_outcome.1200.t: "$study_faith$: Jedna z věroučných zásad se vyjasňuje" # todo: NEW TRANSLATION
 study_faith_outcome.1200.desc: "Známé stěny mé pracovny jsou svědky tichého vítězství: podařilo se mi pochopit [target.GetRite.GetAdjective] význam [discovered_tenet.GetName( target.GetRite )]. Ačkoli je to podivné, při troše představivosti si dokážu představit [target.GetTitledFirstName] a [target.GetHerHis] příbuzné, jak se oddávají této cizí praxi.\n\nJe to jen jeden krok na dlouhé cestě — přesto jsem na své pouti obřadem [target.GetRite.GetNameNoTooltip] zase o kousek dál." # todo: NEW TRANSLATION
 study_faith_outcome.1200.a: "Toužím poznat další [target.GetRite.GetAdjectiveNoTooltip] zvyklosti!" # todo: NEW TRANSLATION
 study_faith_outcome.1200.b: "Zajímavé. Zajímalo by mě, jak to souvisí s [additional_discovered_doctrine.GetDescriptiveNameNoTooltip( target.GetFaith )]!" # todo: NEW TRANSLATION
 study_faith_outcome.1200.c: "Začíná mi to být nepříjemné..." # todo: NEW TRANSLATION
 study_faith_outcome.1400.t: "$study_faith$: Zvyklosti [target.GetRite.GetNameNoTooltip]" # todo: NEW TRANSLATION
 study_faith_outcome.1400.desc: "Chceme-li pochopit obřad [target.GetRite.GetName], musíme studovat nejen jeho metafyzický rámec, ale také jeho každodenní vliv na život.\n\nKdyž jsem přemýšlel o konceptu [discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )], pochopil jsem dost jeho důsledků na to, abych jej dokázal propojit s praktikami obřadu [target.GetRite.GetNameNoTooltip] jako celku." # todo: NEW TRANSLATION
 study_faith_outcome.1400.alt1.desc: "\n\nDíky tomu se mi vyjasnily i jemné nuance jejich praxe [third_discovered_doctrine.GetDescriptiveName( scheme.GetOwner.GetFaith.Self )]!" # todo: NEW TRANSLATION
 study_faith_outcome.1400.alt2.desc: "\n\nJe to jen jeden dílek mnohem větší skládačky, ale každý další mě o kousek přibližuje k pochopení obřadu [target.GetRite.GetNameNoTooltip] jako celku." # todo: NEW TRANSLATION
 study_faith_outcome.1400.a: "Užitečné vědomosti. Pokračujme." # todo: NEW TRANSLATION
 study_faith_outcome.1400.b: "Budu ponocovat." # todo: NEW TRANSLATION
 study_faith_outcome.1400.c: "Zkusím z [target.GetShortUINameNoTooltip] dostat další informace." # todo: NEW TRANSLATION
 study_faith_outcome.1500.t: "$study_faith$: Mimo mé chápání" # todo: NEW TRANSLATION
 study_faith_outcome.1500.desc: "Dlouhé studium mě přivedlo na hranici toho, co může pochopit někdo zvenčí. Zbývající [target.GetRite.GetAdjective] tajemství náleží těm, kdo se do obřadu narodili — přirozeně se předávají těm, kteří žijí podle jeho pravidel, nenajdeme je v žádném textu a ani trpělivý pozorovatel je nedokáže definovat.\n\nVím vše, co může vědět člověk zvenčí." # todo: NEW TRANSLATION
 study_faith_outcome.1500.a: "Naučil jsem se, co jsem mohl." # todo: NEW TRANSLATION
 study_faith_outcome.1500.toast: "$study_faith$ dokončeno" # todo: NEW TRANSLATION
 study_faith_outcome.1500.toast.desc: "Naučili jste se všechny [core_tenet|E] a [doctrine|E] obřadu [target.GetRite.GetName] [rite|E], které může znát člověk zvenčí." # todo: NEW TRANSLATION
 study_faith_scheme_stays_active: "[scheme|E] zůstává aktivní" # todo: NEW TRANSLATION
 study_faith_outcome.3000.t: "$study_faith$: Pokračovat ve studiu?" # todo: NEW TRANSLATION
 study_faith_outcome.3000.desc: "Bohužel [target.GetTitledFirstName] už tu není. Škoda, doufal jsem, že mi [target.GetHerHim] pomůže pochopit jemnější podrobnosti [target.GetFaith.GetName].\n\nTo ale neznamená, že musím studium přerušit — stačí najít někoho jiného, koho budu moci napodobovat!" # todo: NEW TRANSLATION
 study_faith_outcome.3000.alt1.desc: "Bohužel [target.GetTitledFirstName] nebyl tou nejlepší volbou, pokud jde o vedení při studiu podrobností [target.GetFaith.GetName].\n\nTo ale neznamená, že musím studium přerušit — stačí najít někoho jiného, koho budu moci napodobovat!" # todo: NEW TRANSLATION
 study_faith_outcome.3000.a: "[potential_continuation_target_1.GetTitledFirstNameNoTooltip] je zbožný vyznavač!" # todo: NEW TRANSLATION
 study_faith_outcome.3000.b: "Co třeba [potential_continuation_target_2.GetTitledFirstNameNoTooltip]? [potential_continuation_target_2.GetHerHis|U] teologie je zajímavá." # todo: NEW TRANSLATION
 study_faith_outcome.3000.c: "Možná [potential_continuation_target_3.GetTitledFirstNameNoTooltip]?" # todo: NEW TRANSLATION
 study_faith_outcome.3000.d: "Ach, zrovna jsem hledal důvod, proč přestat studovat! Hurá!" # todo: NEW TRANSLATION
 study_faith_scheme_retains_progress: "[scheme|E] si zachová veškerý dosavadní pokrok" # todo: NEW TRANSLATION
 child_studied_faith_title: "[owner.Custom('GetDaughterSon')|U] studuje obřad!" # todo: NEW TRANSLATION
 child_studied_faith_desc: "Váš [owner.Custom('GetDaughterSon')] se dozvěděl více o obřadu [target.GetRite.GetName] [rite|E]" # todo: NEW TRANSLATION
 child_studied_faith_invalidated_title: "Plán studia obřadu vašeho dítěte byl zrušen" # todo: NEW TRANSLATION
 child_studied_faith_invalidated_desc: "[scheme|E] [GetScheme('study_faith').GetTypeName] vašeho dítěte byl zrušen" # todo: NEW TRANSLATION
 study_faith_ongoing.1000.t: "$study_faith$: Výhoda mládí" # todo: NEW TRANSLATION
 study_faith_ongoing.1000.t.theologian: "$study_faith$: Výhoda zkušeností" # todo: NEW TRANSLATION
 study_faith_ongoing.1000.desc.young: "Mé studium [scheme.GetTargetCharacter.GetFaith.GetName] pokračuje skvěle. Připadá mi, že mám veškeré soustředění a energii světa!" # todo: NEW TRANSLATION
 study_faith_ongoing.1000.desc.theologian: "Mé studium [scheme.GetTargetCharacter.GetFaith.GetName] se vyvíjí dobře. Je zřejmé, že jejich rámec se v mnohém podobá rámcům jiných vír!" # todo: NEW TRANSLATION
 study_faith_ongoing.1000.desc: "\n\n"#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!"\n\nMožná to parafrázuji, ale mám pocit, že duch víry je zřejmý, i když se stále snažím rozluštit přesná slova.\n\nPokud budu pokračovat s takovou důkladností, brzy poznám všechna tajemství [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!" # todo: NEW TRANSLATION
 study_faith_ongoing.1000.a: "Věnuji tomu #EMP všechen#! svůj čas!" # todo: NEW TRANSLATION
 study_faith_ongoing.1000.b: "Raději bych trávil čas jinde..." # todo: NEW TRANSLATION
 study_faith_ongoing.1010.t: "$study_faith$: Důvěrná znalost" # todo: NEW TRANSLATION
 study_faith_ongoing.1010.desc: "#EMP „[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]“#!\n\nPocítím něčí přítomnost a vzhlédnu od rozboru [scheme.GetTargetCharacter.GetFaith.GetAdjective] svatých textů. [lover_target.GetFirstName] se nade mnou sklání s žádostivým pohledem.\n\n„To je text o [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]?“ ptá se [lover_target.GetSheHe].\n\n„Jak je nádherné mít u dvora souvěrce, a navíc [ROOT.Char.GetTitleTierName]! Možná bych vám mohl pomoci se svými... důvěrnějšími znalostmi?“" # todo: NEW TRANSLATION
 study_faith_ongoing.1010.a: "Odeberme se do mých komnat, ať nás nikdo neruší." # todo: NEW TRANSLATION
 study_faith_ongoing.1010.b: "Jen si tě studuji, [lover_target.Custom('GetDerogatoryNonbeliever')], to je vše!" # todo: NEW TRANSLATION
 study_faith_ongoing.1010.c: "Zmiz, [lover_target.Custom2('InsultNounSexual', ROOT.Char)]. Musím se soustředit!" # todo: NEW TRANSLATION
 study_faith_ongoing.1010.c.tt: "#EMP Zabouchnete [lover_target.GetHerHis] dveře před nosem a vrátíte se ke studiu#!" # todo: NEW TRANSLATION
 study_faith_ongoing.1011.t: "$study_faith$: Falešná stopa" # todo: NEW TRANSLATION
 study_faith_ongoing.1011.desc: "Už nějakou dobu jsem něco tušil a po několika záludných otázkách vyšla [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] lež najevo. Navzdory tomu, co [scheme.GetTargetCharacter.GetSheHe] tvrdí, [scheme.GetTargetCharacter.GetHerHis] víra v [scheme.GetTargetCharacter.GetFaith.GetName] není upřímná!\n\nPoznat divadlo, které předvádí nevěřící, je zajímavé samo o sobě, ale aby mé chápání [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] skutečně pokročilo, bude asi nejlepší najít věrnějšího vyznavače..." # todo: NEW TRANSLATION
 study_faith_ongoing.1011.a: "Už se na [scheme.GetTargetCharacter.GetShortUINameNoTooltip] nemohu spolehnout." # todo: NEW TRANSLATION
 study_faith_ongoing.1011.b: "Když se to [scheme.GetTargetCharacter.GetSheHe] tak dobře daří skrývat, možná to dokážu i já..." # todo: NEW TRANSLATION
 study_faith_ongoing.1011.c: "Tak čemu tedy [scheme.GetTargetCharacter.GetShortUINameNoTooltip] #EMP věří#!?" # todo: NEW TRANSLATION
 study_faith_ongoing.1011.c.tt: "Pokusím se vypátrat [scheme.GetTargetCharacter.GetHerHis] tajnou víru." # todo: NEW TRANSLATION
 study_faith_ongoing.1012.t: "$study_faith$: Vyznavač prastarých obřadů" # todo: NEW TRANSLATION
 study_faith_ongoing.1012.desc: "Mé pokusy prozkoumat víru [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] přinesly ovoce, byť nečekaným způsobem. Ačkoli [scheme.GetTargetCharacter.GetSheHe] zjevně nevěří v [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip], zdá se, že [scheme.GetTargetCharacter.GetSheHe] následuje podivné, zapomenuté obřady víry [actual_faith.GetName]. Jejich praktiky se podobají... čarodějnictví.\n\nTento objev mě otřásl. Mohu toho nějak využít?" # todo: NEW TRANSLATION
 study_faith_ongoing.1012.a: "No, pořád je to #EMP zajímavé#! zjištění." # todo: NEW TRANSLATION
 study_faith_ongoing.1012.b: "Budu si muset najít nového učitele." # todo: NEW TRANSLATION
 study_faith_ongoing.1012.b.tt: "Pokusíte se najít podobného učitele, abyste mohli pokračovat ve studiu [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]" # todo: NEW TRANSLATION
 study_faith_ongoing.1012.c: "Tohle mi připadá mnohem zajímavější než [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!" # todo: NEW TRANSLATION
 study_faith_ongoing.1012.c.tt: "Nyní budete studovat [actual_faith.GetNameNoTooltip]" # todo: NEW TRANSLATION
 study_faith_ongoing.1013.t: "$study_faith$: Spíše kejklíř než mystik" # todo: NEW TRANSLATION
 study_faith_ongoing.1013.desc: "Můj pokus prozkoumat víru [scheme.GetTargetCharacter.GetTitledFirstNamePossessive] selhal. Za [scheme.GetTargetCharacter.GetHerHis] zbožnou fasádou se zdá, že [scheme.GetTargetCharacter.GetHerHis] pohled na svět zcela postrádá jakékoli teologické základy.\n\nMožná se [scheme.GetTargetCharacter.GetSheHe] řídí zásadami [scheme.GetTargetCharacter.GetFaith.GetName] jen z pohodlnosti, kvůli vlivu nebo bezpečí?\n\nAť už jsou důvody jakékoli, je jasné, že tento [scheme.GetTargetCharacter.GetWomanMan] nevěří tomu, co [scheme.GetTargetCharacter.GetSheHe] hlásá." # todo: NEW TRANSLATION
 study_faith_ongoing.1013.a: "Ztráta času! S [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] končím." # todo: NEW TRANSLATION
 study_faith_ongoing.1020.t: "$study_faith$: Místní věřící" # todo: NEW TRANSLATION
 study_faith_ongoing.1020.desc: "Zdá se, že mé studium [scheme.GetTargetCharacter.GetFaith.GetAdjective] praxe se doneslo k [faith_helper.GetTitledFirstName]. [faith_helper.GetSheHe|U] je místní vyznavač a nabízí mi pomoc se studiem.\n\n„Nežádám nic víc než drobnou odměnu za své úsilí, [ROOT.Char.Custom('FormOfAddressForLiege')].“ říká [faith_helper.GetSheHe|U] a [faith_helper.Custom('quirk_pos_pp')]." # todo: NEW TRANSLATION
 study_faith_ongoing.1020.a: "Pomoz mi a toto zlato bude tvoje." # todo: NEW TRANSLATION
 study_faith_ongoing.1020.b: "Služba za službu?" # todo: NEW TRANSLATION
 study_faith_ongoing.1020.c: "Ach, jak #EMP nesobecké#! od tebe, že mi nabízíš pomoc zadarmo!" # todo: NEW TRANSLATION
 study_faith_ongoing.1020.d: "Děkuji, ale zvládnu to sám." # todo: NEW TRANSLATION
 study_faith_ongoing.1020.c.success: "Přemluvíte [faith_helper.GetFirstNameNoTooltip], aby vám pomohl" # todo: NEW TRANSLATION
 study_faith_ongoing.1020.c.failure: "[faith_helper.GetFirstNameNoTooltip] prohlédne vaši manipulaci" # todo: NEW TRANSLATION
 study_faith_ongoing.1030.t: "$study_faith$: Starý [scheme.GetTargetCharacter.GetFaith.ReligiousText|U]" # todo: NEW TRANSLATION
 study_faith_ongoing.1030.desc: "Přistoupí ke mně [chosen_peasant.GetWomanMan] s chtivým úsměvem.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], je pravda, že studujete zvyklosti víry [scheme.GetTargetCharacter.GetFaith.GetName]? Můj otec přivezl tento [scheme.GetTargetCharacter.GetFaith.ReligiousText] z jedné ze svých cest do [holy_site.GetNameNoTier]!“\n\n„Nemám pro něj využití, protože neumím číst. Rád vám ho přenechám výměnou za pár mincí.“" # todo: NEW TRANSLATION
 study_faith_ongoing.1030.a: "To se hodí. Mé zlato je tvoje." # todo: NEW TRANSLATION
 study_faith_ongoing.1030.b: "Není to tak vzácné, jak si myslíš..." # todo: NEW TRANSLATION
 study_faith_ongoing.1030.b.flavor: "Smlouvejte s tímto překupníkem cetek" # todo: NEW TRANSLATION
 study_faith_ongoing.1030.b.success: "[chosen_peasant.GetFirstName] přijme dohodu" # todo: NEW TRANSLATION
 study_faith_ongoing.1030.b.failure: "[chosen_peasant.GetFirstName] se vaší nabídce urazí" # todo: NEW TRANSLATION
 study_faith_ongoing.1030.c: "Stráže, zabavte tyto pohanské texty [chosen_peasant.GetHerHim]." # todo: NEW TRANSLATION
 study_faith_ongoing.1030.d: "Podvodníku! Ztrať se..." # todo: NEW TRANSLATION
 study_faith_ongoing.1040.t: "$study_faith$: Obdiv" # todo: NEW TRANSLATION
 study_faith_ongoing.1040.desc: "To je požehnání! Dostal jsem několik dopisů, v nichž [target.GetTitledFirstName] chválí mou snahu poznat jemné nuance [scheme.GetTargetCharacter.GetFaith.GetAdjective] víry. [target.GetSheHe|U] mě dokonce označuje za nejvýznačnějšího [ROOT.Char.GetFaith.GetAdjectiveNoTooltip], který studuje [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!\n\nJe příjemné, když někdo ocení mou tvrdou práci!" # todo: NEW TRANSLATION
 study_faith_ongoing.1040.a: "Písaři! Odpovězte a vyřiďte mé poděkování." # todo: NEW TRANSLATION
 study_faith_ongoing.1040.b: "Víra [target.GetFirstNamePossessiveNoTooltip] mi otevírá oči..." # todo: NEW TRANSLATION
 study_faith_ongoing.1040.c: "Pche! Nepotřebuji uznání od nikoho jiného než #EMP od sebe samého!#!" # todo: NEW TRANSLATION
 study_faith_ongoing.1050.t: "$study_faith$: Zápach sabotáže" # todo: NEW TRANSLATION
 study_faith_ongoing.1050.desc: "Mé poznámky popisující někdy matoucí a protichůdná učení [scheme.GetTargetCharacter.GetFaith.GetName] leží rozházené po celé pracovně. Měsíce práce jsou roztrhané na kusy, utržený list na okně naznačuje, že přinejmenším část mých poznámek někdo vyhodil ven.\n\nTo mám začít úplně od začátku?!\n\n#EMP Čmuch, čmuch...#!Co je to za odporný zápach? Kadidlo nebo santalové dřevo smíchané s něčím... květinovým? Ta vůně mi připomíná samolibý obličej mého [sabotage_rival.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sabotage_rival'))], [sabotage_rival.GetTitledFirstName]. To [sabotage_rival.GetSheHe] usiluje o mou zkázu..." # todo: NEW TRANSLATION
 study_faith_ongoing.1050.a: "Mé poznámky... ne! Tolik práce je pryč!" # todo: NEW TRANSLATION
 study_faith_ongoing.1050.b: "[sabotage_rival.GetTitledFirstNameNoTooltip] si zaslouží #EMP ZEMŘÍT!#!" # todo: NEW TRANSLATION
 study_faith_ongoing.1050.c: "Ha-ha! Vždycky si dělám #EMP záložní poznámky!#!" # todo: NEW TRANSLATION
 study_faith_ongoing.1060.t: "$study_faith$: Nevědomý výklad" # todo: NEW TRANSLATION
 study_faith_ongoing.1060.desc: "Abych si ověřil svůj pokrok, pokouším se svému [scheme.GetTargetCharacter.GetFaith.GetAdjective] [ROOT.Char.Custom2('RelationToMeShort', offended_character)] [offended_character.GetTitledFirstName] shrnout úryvek z [scheme.GetTargetCharacter.GetFaith.ReligiousText|U]: #EMP „... [offended_character.GetFaith.PriestNeuter] musí pozvednout [target.Custom('GetAccessory')], aby [target.Custom('FormOfAddressForLiege')] mohl(a) utrhnout [target.GetCurrentLocation.Custom('get_region_flower_type')]-“#!.\n\n„Tvůj výklad nedává smysl! Kvůli němu vypadají moji [offended_character.GetFaith.PriestNeuterPlural] jako [offended_character.Custom2('InsultAdjective', SCOPE.sC('offended_character'))] a [offended_character.GetFaith.HighGodName] jako [offended_character.Custom2('InsultNounSexual', SCOPE.sC('offended_character'))]!?“.\n\nMožná mi stále unikají jemnější nuance [scheme.GetTargetCharacter.GetFaith.GetAdjective] praxe..." # todo: NEW TRANSLATION
 study_faith_ongoing.1060.a: "Prosím, přijměte tento dar jako důkaz mé lítosti." # todo: NEW TRANSLATION
 study_faith_ongoing.1060.b: "Chtěl jsem vyzdvihnout ctnosti [offended_character.GetFaith.PriestNeuter]!" # todo: NEW TRANSLATION
 study_faith_ongoing.1060.c: "Víte co!? [offended_character.GetFaith.HighGodName] je #EMP [offended_character.Custom2('InsultAdjective', ROOT.Char)]!#!" # todo: NEW TRANSLATION
 study_faith_ongoing.1060.d: "Jen jsem doufal, že lépe porozumím [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip]!" # todo: NEW TRANSLATION
 study_faith_ongoing.1060.b.success: "Přesvědčíte [offended_character.GetHerHim], že jste #EMP lichotil#! [offended_character.GetHerHis] [offended_character.GetFaith.PriestNeuterPlural]" # todo: NEW TRANSLATION
 study_faith_ongoing.1060.b.failure: "[offended_character.GetFirstNameNoTooltip] prohlédne vaši lež" # todo: NEW TRANSLATION
 study_faith_ongoing.1060.d.success: "Úspěšně vysvětlíte, že šlo o nedorozumění" # todo: NEW TRANSLATION
 study_faith_ongoing.1060.d.failure: "[offended_character.GetFirstNameNoTooltip] vám neuvěří" # todo: NEW TRANSLATION
 study_faith_ongoing.1070.t: "$study_faith$: Necudné mýty" # todo: NEW TRANSLATION
 study_faith_ongoing.1070.desc: "Dar [target.GetTitledFirstNamePossessive] v podobě [scheme.GetTargetCharacter.GetFaith.GetAdjective] mytologických textů rozvířil dvůr. Mnozí přihlížejí, jak se jimi probírám a předčítám ty nejzajímavější pasáže.\n\nNejprve si myslím, že si ze mě [ROOT.Char.GetFaith.EvilGodNames] tropí obscénní žerty, ale po důkladném prozkoumání několika vzrušujících pasáží je jasné, že tento text má erotický charakter.\n\nCo dělají zmínky o [ROOT.Char.Custom('ObjectifiedFeature')] [scheme.GetTargetCharacter.GetFaith.FertilityGodNamePossessive] v posvátném textu?! [ROOT.Char.Custom('CulturalCurse')|U]." # todo: NEW TRANSLATION
 study_faith_ongoing.1070.a: "Stráže, zbavte mě té proklaté knihy!" # todo: NEW TRANSLATION
 study_faith_ongoing.1070.b: "Opovažujete se mi smát!? #EMP Zbičujte je všechny.#!" # todo: NEW TRANSLATION
 study_faith_ongoing.1070.c: "Nu což, svým způsobem je to #EMP poučné#!..." # todo: NEW TRANSLATION
 study_faith_ongoing.1080.t: "$study_faith$: Skvělý učitel" # todo: NEW TRANSLATION
 study_faith_ongoing.1080.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', court_tutor)] [court_tutor.GetFirstName] neúnavně pomáhá mému úsilí pochopit jemné detaily [scheme.GetTargetCharacter.GetFaith.GetName].\n\n[court_tutor.GetHerHis|U] oddanost umění vyučovat je inspirující! [court_tutor.GetSheHe] má vždy po ruce nějaký [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] text nebo mi najde učeného [scheme.GetTargetCharacter.GetFaith.PriestNeuter], s nímž si mohu promluvit.\n\nMé znalosti by bez [court_tutor.GetHerHis] pomoci rozhodně nepokročily tak daleko." # todo: NEW TRANSLATION
 study_faith_ongoing.1080.a: "[court_tutor.GetFirstNameNoTooltip], zasloužíte si odměnu!" # todo: NEW TRANSLATION
 study_faith_ongoing.1080.b: "[court_tutor.GetSheHe|U] svou práci odvádí dobře." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [court_tutor.GetHerHis]
 study_faith_ongoing.1090.t: "$study_faith$: Nepochopitelné!" # todo: NEW TRANSLATION
 study_faith_ongoing.1090.desc.intro: "Teologii [scheme.GetTargetCharacter.GetFaith.GetName] nelze pochopit!" # todo: NEW TRANSLATION
 study_faith_ongoing.1090.tenet.desc: "Zejména mi zcela uniká víra v [discovered_tenet.GetName( scheme.GetOwner.GetFaith.Self )]." # todo: NEW TRANSLATION
 study_faith_ongoing.1090.doctrine.desc: "Zejména mi zcela uniká [discovered_doctrine.GetName( scheme.GetOwner.GetFaith.Self )]." # todo: NEW TRANSLATION
 study_faith_ongoing.1090.desc.main: "\n\nMám plnou hlavu! Jakmile se mi do ní dostane jedna myšlenka, jiná se propadne do propasti zapomnění." # todo: NEW TRANSLATION
 study_faith_ongoing.1090.friend.desc: "\n\n„Jen tak dál, můj [ROOT.Char.Custom('ComplimentAdjective')] příteli. Věřím ti!“\n\nNaštěstí mi [helpful_friend.GetTitledFirstName] vždy pomůže rozplést tato neznámá učení. Mám opravdu požehnání." # todo: NEW TRANSLATION
 study_faith_ongoing.1090.no_friend.desc: "\n\nMožná si potřebuji odpočinout?" # todo: NEW TRANSLATION
 study_faith_ongoing.1090.a: "Vždycky se můžu spolehnout na [helpful_friend.GetFirstNameNoTooltip], že mi poradí!" # todo: NEW TRANSLATION
 study_faith_ongoing.1090.b: "Ať se to zdá jakkoli zvláštní, musím vytrvat!" # todo: NEW TRANSLATION
 study_faith_ongoing.1090.c: "Jen na chvíli odložím knihy..." # todo: NEW TRANSLATION
 study_faith_ongoing.1090.d: "Tohle nemá smysl!" # todo: NEW TRANSLATION
 study_faith_ongoing.1100.t: "$study_faith$: [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] [target.GetFaith.GetAdjectiveNoTooltip]" # todo: NEW TRANSLATION
 study_faith_ongoing.1100.desc: "Rozšířily se zprávy o mém pilném studiu [scheme.GetTargetCharacter.GetFaith.GetName].\n\nŘíkají mi „[ROOT.Char.GetFaith.GetAdherentNameNoTooltip] [target.GetFaith.GetAdjectiveNoTooltip]“, což je titul, který může vést k nedorozuměním..." # todo: NEW TRANSLATION
 study_faith_ongoing.1100.a: "Dobrým proslovem bych mohl uklidnit své poddané i [target.GetFaith.GetAdherentNamePluralNoTooltip]!" # todo: NEW TRANSLATION
 study_faith_ongoing.1100.b: "Mé studium je moje věc. Žádné rozptylování!" # todo: NEW TRANSLATION
 study_faith_ongoing.1100.c: "Jistě to na [scheme.GetTargetCharacter.GetTitledFirstNameNoTooltip] udělá dojem!" # todo: NEW TRANSLATION
 study_faith_ongoing.1100.a.success: "Přednesete skvělý proslov" # todo: NEW TRANSLATION
 study_faith_ongoing.1100.a.success.tt: "Každý dvořan nebo host vyznávající [root_scope.GetFaith.GetNameNoTooltip] či [target.GetFaith.GetNameNoTooltip]" # todo: NEW TRANSLATION
 study_faith_ongoing.1100.a.failure: "Uděláte ze sebe hlupáka" # todo: NEW TRANSLATION
 study_faith_ongoing.1110.t: "$study_faith$: Půvab [target.GetFaith.GetAdjectiveNoTooltip] poezie" # todo: NEW TRANSLATION
 study_faith_ongoing.1110.desc: "Ach, „[poet_location.Custom('RoamingLegendaryBeastProvinceWeather')|U] [poet_location.Custom('GetTerrainTypePlural')|U]“ od [the_poet.GetFirstName] z [poet_location.GetCounty.GetName]. Opravdu skvělá sbírka [scheme.GetTargetCharacter.GetFaith.GetAdjective] poezie!\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nMohla by být poezie oknem do víry?" # todo: NEW TRANSLATION
 study_faith_ongoing.1110.a: "Zkusím skládat [target.GetFaith.GetAdjectiveNoTooltip] verše!" # todo: NEW TRANSLATION
 study_faith_ongoing.1110.b: "Neměl bych svému [ROOT.Char.Custom2('RelationToMeShort', lover_to_be)] [lover_to_be.GetFirstNameNoTooltip] přednést #EMP milostnou#! báseň?" # todo: NEW TRANSLATION
 study_faith_ongoing.1110.c: "Rozeberu náboženské prvky té básně." # todo: NEW TRANSLATION
 study_faith_ongoing.1110.a.success: "Zjistíte, že vám poezie jde od ruky" # todo: NEW TRANSLATION
 study_faith_ongoing.1110.a.failure: "Vaše pokusy o poezii jsou žalostné" # todo: NEW TRANSLATION
 study_faith_ongoing.1120.t: "$study_faith$: Kacířské příběhy" # todo: NEW TRANSLATION
 study_faith_ongoing.1120.desc: "#EMP [scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]#!\n\n„[ROOT.Char.GetTitleTierName] studuje báje cizí víry? Nemáte ani špetku studu?!“ zvolá můj [ROOT.Char.Custom2('RelationToMeShort', zealot)] [zealot.GetTitledFirstName].\n\n„Pokud se vaši nepřátelé dozvědí, že se stýkáte s kacířskými myšlenkami, udělají vše pro to, aby vás označili za kacíře!“\n\nMoji tupí nepřátelé u [ROOT.Char.Custom('GetCourt')] by si mohli [scheme.GetTargetCharacter.GetFaith.GetAdjective] spisy vyložit nesprávně." # todo: NEW TRANSLATION
 study_faith_ongoing.1120.a: "Ne! Tohle jsou... #EMP ctihodná [target.GetFaith.GetAdjectiveNoTooltip] teologická pojednání!#!" # todo: NEW TRANSLATION
 study_faith_ongoing.1120.b: "Opovažuješ se mě obviňovat z kacířství!? Já ti ukážu!" # todo: NEW TRANSLATION
 study_faith_ongoing.1120.c: "Máš pravdu. Takové texty se pro [ROOT.Char.GetTitleTierName] nehodí." # todo: NEW TRANSLATION
 study_faith_ongoing.1120.d: "Ať si lidé myslí, co chtějí. Tyto spisy jsou poučné!" # todo: NEW TRANSLATION
 study_faith_ongoing.1120.a.success: "Obelstíte [zealot.GetFirstNameNoTooltip]" # todo: NEW TRANSLATION
 study_faith_ongoing.1120.a.failure: "Vaše záliba v kacířském čtení vejde ve všeobecnou známost" # todo: NEW TRANSLATION
 study_faith_ongoing.1120.b.tt: "#V Vyzvete#! [zealot.GetFirstName] na souboj, abyste [zealot.GetHerHim] potrestali za [zealot.GetHerHis] drzost!\n#weak Tento souboj NENÍ na život a na smrt.#!\nPokud zvítězíte, získáte [prestige_i] [prestige|E] a [modifier|E] pro [scheme|E]. Pokud prohrajete, stanete se terčem posměchu.\n\nVaše [prowess|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[prowess|E] postavy [zealot.GetFirstNamePossessive]: [prowess_i]#V [zealot.GetProwess]#!" # todo: NEW TRANSLATION
 study_faith_ongoing.1121.trigger_failure: "Můj souboj s [zealot.GetFirstNameNoTooltip] byl zrušen" # todo: NEW TRANSLATION
 study_faith_ongoing.1123.t: "$study_faith_ongoing.1120.t$" # todo: NEW TRANSLATION
 study_faith_ongoing.1123.desc: "„Vzdávám se! Prosím, odpusťte mi, vůbec nejste slabomyslný! Jen mě ušetřete!“ zvolá [zealot.GetTitledFirstName].\n\nTo [zealot.GetHerHim] naučí urážet #EMP mě#!." # todo: NEW TRANSLATION
 study_faith_ongoing.1123.a: "Jak kdysi pravil moudrý [ROOT.Char.Custom('GetAnimalType')|U]: „Neurážej ty, kteří jsou nad tebou!“" # todo: NEW TRANSLATION
 study_faith_ongoing.1123.b: "Za svou drzost shniješ v žaláři!" # todo: NEW TRANSLATION
 study_faith_ongoing.1124.t: "$study_faith_ongoing.1120.t$" # todo: NEW TRANSLATION
 study_faith_ongoing.1124.desc: "[zealot.GetTitledFirstName] plivne vedle tebe, jak ležíš na zemi.\n\n„Jsi slabá, ubohá napodobenina [ROOT.Char.GetTitleTierName]. Teď ti prokážu laskavost a zbavím tě těch nesmyslných knih,“ řekne [zealot.GetSheHe]." # todo: NEW TRANSLATION
 study_faith_ongoing.1124.a: "Studium utrpělo další ránu..." # todo: NEW TRANSLATION
 study_faith_ongoing.1130.t: "$study_faith$: Rozkoše víry" # todo: NEW TRANSLATION
 study_faith_ongoing.1130.desc: "„Ach, můj drahý [ROOT.Char.GetFirstNameNoTooltip]! Ty se opravdu učíš o mé milované víře [scheme.GetTargetCharacter.GetFaith.GetName]? Vážím si toho, že se tolik snažíš mi porozumět!“ řekne [lover_to_help.GetTitledFirstName] [lover_to_help.Custom('quirk_pos_pp')].\n\n„Bude mi potěšením pomoci ti #EMP jakkoli#! to půjde.“" # todo: NEW TRANSLATION
 study_faith_ongoing.1130.a: "Využiju jakoukoli pomoc!" # todo: NEW TRANSLATION
 study_faith_ongoing.1130.b: "Napadá mě způsob, který by se mi líbil nejvíc." # todo: NEW TRANSLATION
 study_faith_ongoing.1130.c: "Raději budu studovat o samotě." # todo: NEW TRANSLATION
 study_faith_ongoing.1130.a.success: "[lover_to_help.GetFirstNameNoTooltip] je dobrý, byť koketní učitel" # todo: NEW TRANSLATION
 study_faith_ongoing.1130.a.failure: "[lover_to_help.GetFirstNameNoTooltip] zaměří vaše lekce na natolik okrajové, smyslné aspekty teologie, že nedokážete pochopit, jak zapadají do víry jako celku" # todo: NEW TRANSLATION
 study_faith_ongoing.1130.a.failure.toast: "Pomoc od [lover_to_help.GetFirstNameNoTooltip] je příliš koketní na to, aby byla užitečná." # todo: NEW TRANSLATION
 study_faith_ongoing.1140.t: "$study_faith$: Pomocná ruka" # todo: NEW TRANSLATION
 study_faith_ongoing.1140.desc: "„Chválím vás, že se učíte více o [scheme.GetTargetCharacter.GetFaith.GetName], jistě to posílí vaše postavení coby [ROOT.Char.GetTitleTierName]!“ zvolá můj [SCOPE.sC('root_for_loc').Custom2('RelationToMeShort', SCOPE.sC('close_one_to_help'))] [close_one_to_help.GetFirstName].\n\n„Způsoby [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] znám od narození. Možná bych vám mohl pomoci, [SCOPE.sC('close_one_to_help').Custom2('RelationToMeShort', SCOPE.sC('root_for_loc'))]?“" # todo: NEW TRANSLATION
 study_faith_ongoing.1140.a: "Mohl bys mi pomoci pochopit tuto zásadu víry?" # todo: NEW TRANSLATION
 study_faith_ongoing.1140.b: "Chtěl by ses připojit k mým studijním sezením?" # todo: NEW TRANSLATION
 study_faith_ongoing.1200.t: "$study_faith$: Pohanský pes" # todo: NEW TRANSLATION
 study_faith_ongoing.1200.desc: "Ve snaze poznat tajemství [scheme.GetTargetCharacter.GetFaith.GetName] si vedu úhledné poznámky. Jsou skutečně jediným způsobem, jak zvládnout chaos jiného náboženského systému. Bohužel se zdá, že se někam zatoulaly.\n\nZnámý vlhký čenich [ROOT.Char.Custom('DogStoryName')] se mi otře o ruku. Podívám se na svého milého psa a doufám, že mi pomůže zapomenout na frustraci.\n\n[ROOT.Char.Custom('DogStorySheHe')] ke mně vzhlédne a hrdě zavrtí [ROOT.Char.Custom('DogStoryHerHis')] ocasem. Teprve pak si uvědomím, že [ROOT.Char.Custom('DogStorySheHe')] pevně svírá mé poznámky v [ROOT.Char.Custom('DogStoryHerHis')] zubech..." # todo: NEW TRANSLATION
 study_faith_ongoing.1200.a: "Vždyť se na tebe nemůžu zlobit!" # todo: NEW TRANSLATION
 study_faith_ongoing.1200.b: "Nechceš se jít projít? Tak pojď." # todo: NEW TRANSLATION
 study_faith_ongoing.1200.c: "To není hračka! #EMP Zlý#! pes!" # todo: NEW TRANSLATION
 study_faith_ongoing.1300.t: "$study_faith$: Uč se praxí" # todo: NEW TRANSLATION
 study_faith_ongoing.1300.desc: "Když procházíme [ROOT.Char.GetCurrentLocation.GetTitle.GetName], zdá se, že místní slaví [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] svátek. Přistoupí k nám [interlocutor.GetWomanMan] a pozve nás, abychom se připojili, přestože jsme [ROOT.Char.GetFaith.GetAdherentNamePlural].\n\nČlenové mé družiny se mezi nás snaží postavit, protože se obávají, že jde o past.\n\nČert vem nebezpečí. Jen stěží si dokážu představit lepší příležitost, jak poznat [scheme.GetTargetCharacter.GetFaith.GetNameNoTooltip] na vlastní kůži!" # todo: NEW TRANSLATION
 study_faith_ongoing.1300.a: "Ukažte mi, jak na to!" # todo: NEW TRANSLATION
 study_faith_ongoing.1300.a.flavor: "Je to jen malý [scheme.GetTargetCharacter.GetFaith.GetAdjectiveNoTooltip] rituál, co by se mohlo stát?" # todo: NEW TRANSLATION
 study_faith_ongoing.1300.b: "Nejvíc mě jistě poučí debata o podrobnostech [interlocutor.GetHerHis] víry." # todo: NEW TRANSLATION
 study_faith_ongoing.1300.b.flavor: "Pokusíte se [interlocutor.GetFirstNameNoTooltip] přimět k přátelské debatě" # todo: NEW TRANSLATION
 study_faith_ongoing.1300.b.success: "Povedete podnětnou debatu s [interlocutor.GetFirstNameNoTooltip]" # todo: NEW TRANSLATION
 study_faith_ongoing.1300.b.failure: "S [interlocutor.GetFirstNameNoTooltip] se vám nepodaří dorozumět" # todo: NEW TRANSLATION
 study_faith_ongoing.1300.c: "„Připojte se k nám na cestě do [next_destination.GetNameNoTooltip]!“" # todo: NEW TRANSLATION
 holy_text_christian_quote: "[ROOT.Char.Custom('RandomRelevantBibleQuote')]" # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_1: "Jako můra nezná písmo hvězd, a přesto najde plamen, tak ani duše nemusí pojmenovat Božství, aby jí pohltilo." # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_2: "Když pouštní vítr zahladil tyranovy stopy, písek si pamatoval jen stopy žíznivých a laskavých." # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_3: "Řeka si nevybírá oblázky, které obrušuje, přesto je plynutím let všechny přivádí k dokonalosti." # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_4: "Napij se z pramene poznání, a tak skloň svá záda." # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_5: "V den, kdy se hora sklonila, nesklonila se před králem ani vojskem, nýbrž se sklonila, aby vyslechla otázku dítěte." # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_6: "Skrytý nejprve promlouvá šeptem pochybností, aby až nakonec odpovíš, byla tvá víra skutečně tvá." # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_7: "Každá lež pronesená před oltářem se vrací jako dým, ale každá upřímná slza je zaseta jako semeno v zahradách [ROOT.Char.GetFaith.PositiveAfterLife]." # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_8: "Neproklínej temnotu, která halí tvou cestu; je tu proto, aby se tvůj vlastní plamen naučil odvaze hořet." # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_9: "Zářivý nepočítá modlitby pyšných, jen tiché skutky milosrdenství vykonané, když se nikdo nedívá." # todo: NEW TRANSLATION
 holy_text_indeterminate_quote_10: "Když byl svět rozdělen na „mé“ a „tvé“, Božství se zasmálo, neboť v jeho očích bylo jen „naše“." # todo: NEW TRANSLATION
