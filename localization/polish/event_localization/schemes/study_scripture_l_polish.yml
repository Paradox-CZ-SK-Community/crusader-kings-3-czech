l_polish:
 study_scripture_outcome.10.t: "$study_scripture_title$Řád studia" # todo: NEW TRANSLATION
 study_scripture_outcome.10.desc: "Knihy leží otevřené na pultíku: články nauky [ROOT.Char.GetFaith.GetAdjective] víry, opsané trpělivou rukou. Svíčka v temnotě poblikává. Dole, v [ROOT.Char.GetFaith.HouseOfWorship], čekají věřící jako vždy.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.10.desc_quote: "Na nejvyšší stránce někdo přede mnou podtrhl jediný úryvek: #EMP "[ROOT.Char.Custom('RandomStudyVerseFragment')]"#!\n\nKolik ze sebe obětuji posvátnému textu?" # todo: NEW TRANSLATION
 study_scripture_outcome.10.desc_generic: "Kolik ze sebe obětuji posvátnému studiu?" # todo: NEW TRANSLATION
 study_scripture_outcome.10.a: "Ať svět počká za klášterními dveřmi." # todo: NEW TRANSLATION
 study_scripture_outcome.10.b: "Studiu vyhradím jeho hodiny, stejně jako [ROOT.Char.Custom('StudyOfficesWord')] ty své." # todo: NEW TRANSLATION
 study_scripture_outcome.10.c: "Budu číst, jak mě duch povede." # todo: NEW TRANSLATION
 no_change_study_scripture_tt: "Váš [scheme|E] [GetScheme('study_scripture').GetTypeName] pokračuje beze změny" # todo: NEW TRANSLATION
 study_scripture_outcome.110.t: "$study_scripture_title$Posvátný text" # todo: NEW TRANSLATION
 study_scripture_outcome.110.desc: "Prokousávám se řádek po řádku velkými texty [ROOT.Char.GetFaith.GetName], zatímco vosk stéká pod zbytkem svíčky a králíci se šneky v okrajových kresbách se spolu přou.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.110.desc_quote: "Jeden úryvek ke mně promlouvá:\n#EMP "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"#!\n\nChci-li vést stádo věrných [ROOT.Char.GetFaith.HighGodNamePossessive], musím tato slova nosit v srdci." # todo: NEW TRANSLATION
 study_scripture_outcome.110.desc_generic: "Chci-li vést stádo věrných [ROOT.Char.GetFaith.HighGodNamePossessive], musím tato slova nosit v srdci." # todo: NEW TRANSLATION
 study_scripture_outcome.110.a: "Musím se učit, ať mě to stojí cokoli." # todo: NEW TRANSLATION
 study_scripture_outcome.110.b: "Porozumění přijde, až nastane jeho čas." # todo: NEW TRANSLATION
 study_scripture_outcome.120.t: "$study_scripture_title$Dlouhý komentář" # todo: NEW TRANSLATION
 study_scripture_outcome.120.desc: "Chci-li vést své stádo, musím se nejprve naučit vést sám sebe. Komentáře od [commentary_writer.GetTitledFirstName] leží rozložené na mém stole — celoživotní dílo jiného učence o [ROOT.Char.GetFaith.ReligiousText], husté jako trní a dvakrát tak ostré. Každý řádek, který rozpletu, odhalí jen další pochybnosti.\n\nProvede mě tím jedině disciplína." # todo: NEW TRANSLATION
 study_scripture_outcome.120.a: "Prozkoumám text a najdu jeho hlubší smysl." # todo: NEW TRANSLATION
 study_scripture_outcome.120.b: "Pravidelná práce přináší pravidelný pokrok." # todo: NEW TRANSLATION
 study_scripture_outcome.120.c: "Jedna stránka za noc stačí." # todo: NEW TRANSLATION
 scholar_xp_high_tt: "Výrazně prohloubíte své učenosti" # todo: NEW TRANSLATION
 scholar_xp_low_tt: "Mírně prohloubíte své učenosti" # todo: NEW TRANSLATION
 study_scripture_outcome.130.t: "$study_scripture_title$Trpělivost na okrajích" # todo: NEW TRANSLATION
 study_scripture_outcome.130.desc: "Proč mi ten smysl uniká? Čtu úryvek už počtvrté, ale svírá se jako pěst. Zlehka si opřu čelo o stůl.\n\n"Přinesl jsem vám svíčku," říká ode dveří můj [ROOT.Char.Custom2('RelationToMeShort', tutor)], [tutor.GetFirstName]. "Ach — staré komentáře. Ty stránky dobře znám. Nechcete si je na chvíli přečíst spolu se mnou?"\n\nVzhlédnu. Možná přesně takovou pomocnou ruku potřebuji." # todo: NEW TRANSLATION
 study_scripture_outcome.130.a: "Učte mě. Nejsem příliš hrdý na to, abych se učil." # todo: NEW TRANSLATION
 study_scripture_outcome.130.b: "Chvíli se mnou posedíte; text počká." # todo: NEW TRANSLATION
 study_scripture_outcome.140.t: "$study_scripture_title$Kázání pro [ROOT.Char.Custom('StudyParishWord')|U]" # todo: NEW TRANSLATION
 study_scripture_outcome.140.desc: "S povzdechem zavřu další knihu. Nauka je na těch stránkách sice vyložena, ale když jsem naposledy slyšel kázat [preacher.GetTitledFirstName], bylo v tom něco #EMP víc#!. [preacher.GetHerHis|U] kázání neobsahovalo žádné překomplikované sylogismy... jen láskyplnou pravdu [ROOT.Char.GetFaith.HighGodNamePossessive].\n\n[ROOT.Char.Custom('StudyParishWord')] plakali. #EMP I#! jsem plakal." # todo: NEW TRANSLATION
 study_scripture_outcome.140.a: "Nauka je jedna věc, její předání druhá. Naučím se obojí." # todo: NEW TRANSLATION
 study_scripture_outcome.140.b: "Mým posláním je stránka, ne [ROOT.Char.Custom('StudyPulpitWord')]." # todo: NEW TRANSLATION
 study_scripture_outcome.150.t: "$study_scripture_title$Pozemské statky" # todo: NEW TRANSLATION
 study_scripture_outcome.150.desc: ""Pojďte se mnou," říká můj [ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )], [steward_scope.GetFirstName], s účetní knihou pod paží a zve mě ven do rána.\n\n"Chrámová pole, mlýn, desátkové sýpky — poznamenejte si, které jsou plné, ze kterých zatéká a které jsou přislíbené hned dvakrát. Stádo se nedá živit pouhou milostí."" # todo: NEW TRANSLATION
 study_scripture_outcome.150.a: "Naučte mě vést účetní knihy." # todo: NEW TRANSLATION
 study_scripture_outcome.150.b: "Procházka mi alespoň pročistí hlavu." # todo: NEW TRANSLATION
 study_scripture_outcome.160.t: "$study_scripture_title$Učená společnost" # todo: NEW TRANSLATION
 study_scripture_outcome.160.desc: "Mé studium mě přivedlo ke korespondenci s [colleague.GetTitledFirstName], jehož zbožnost je známá daleko za hranicemi [colleague.GetHerHis] vlastního panství.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.160.desc_distant: "Vyměňujeme si dopisy o otázkách víry — putují mezi námi otázky, argumenty i opravy. [colleague.GetHerHis|U] rukopis je příšerný, ale [colleague.GetHerHis] úsudek je správný." # todo: NEW TRANSLATION
 study_scripture_outcome.160.a: "Pojďme to řádně probrat." # todo: NEW TRANSLATION
 study_scripture_outcome.160.b: "Učený [ROOT.Char.GetWomanMan] by měl vědět, jak se spravuje [ROOT.Char.GetHerHis] stolec." # todo: NEW TRANSLATION
 study_scripture_outcome.160.c: "Vraťme se společně k textům." # todo: NEW TRANSLATION
 piety_gain_high_tt: "Výrazný přírůstek zbožnosti" # todo: NEW TRANSLATION
 piety_gain_low_tt: "Mírný přírůstek zbožnosti" # todo: NEW TRANSLATION
 study_scripture_outcome.170.t: "$study_scripture_title$Dopis zapečetěný pečetí" # todo: NEW TRANSLATION
 study_scripture_outcome.170.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', letterman)], [letterman.GetFirstName], ho přináší, jako by to byla relikvie: dopis nesoucí pečeť [senior.GetTitledFirstName].\n\n"Zprávy o vašem studiu se donesly dál, než tušíte. Víra je bohatší díky pastýři, který čte. Vytrvejte a buďte si jisti mou přízní."\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.170.desc_quote: "Dopis končí jediným veršem, odděleným od zbytku:\n#EMP "[ROOT.Char.Custom('RandomBibleQuoteShort')]"#!" # todo: NEW TRANSLATION
 study_scripture_outcome.170.desc_generic: "Dopis končí požehnáním ve jménu [ROOT.Char.GetFaith.HighGodNamePossessive], napsaným větším písmem než zbytek." # todo: NEW TRANSLATION
 study_scripture_outcome.170.a: "Sepíšu důstojnou odpověď." # todo: NEW TRANSLATION
 study_scripture_outcome.170.b: "Nemohl by [senior.GetSheHe] ocenit mou učenost ještě... veřejněji?" # todo: NEW TRANSLATION
 study_scripture_outcome.170.c: "Přečti si ho znovu. Tentokrát pomalu." # todo: NEW TRANSLATION
 study_scripture_outcome.171.t: "$study_scripture_title$Dopisy věřícím" # todo: NEW TRANSLATION
 study_scripture_outcome.171.desc: "Dopisy mi přicházejí ze všech koutů [ROOT.Char.GetFaith.GetAdjective] světa: duchovní se přou o verš liturgie, místní [ROOT.Char.GetFaith.PriestNeuterPlural] se děsí vlastních pochybností, učenec žádá o posouzení překladu, který už nikdo naživu nedokáže ověřit. Na každý spor je mou pečeť hodnou odpovědí.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.171.desc_quote: "Dnešní dopis mi s nadějí cituje z Písma:\n#EMP "[ROOT.Char.Custom('RandomBibleQuoteShort')]"#!\n\nHromada na mém stole roste. Stejně tak, tiše, i mé vědomosti." # todo: NEW TRANSLATION
 study_scripture_outcome.171.desc_generic: "Hromada na mém stole roste. Stejně tak, tiše, i mé vědomosti." # todo: NEW TRANSLATION
 study_scripture_outcome.171.a: "Odpověz jim všem. Od toho tu pastýř je." # todo: NEW TRANSLATION
 study_scripture_outcome.171.b: "Ať opisovači rozešlou mé odpovědi do všech koutů víry." # todo: NEW TRANSLATION
 study_scripture_outcome.171.c: "Dnes večer jsem student. Dopisy počkají." # todo: NEW TRANSLATION
 study_scripture_outcome.172.t: "$study_scripture_title$Pastýřský list" # todo: NEW TRANSLATION
 study_scripture_outcome.172.desc: "Dnes večer studuji dopisy, které pastýři psali vzdáleným obcím: kázání a poučení se od [ROOT.Char.Custom('StudyParishWord')] k [ROOT.Char.Custom('StudyParishWord')] značně liší.\n\nMé myšlenky se obracejí k věřícím v [pastoral_county.GetNameNoTier], v zemích [pastoral_lord.GetTitledFirstName]. Mají tam kostel. Jsou daleko mimo můj dosah a bez mého vedení... Možná nastal čas napsat jim osobně.\n\nBeru do ruky brk. #EMP "Věřícím z [pastoral_county.GetNameNoTier]..."#!" # todo: NEW TRANSLATION
 study_scripture_outcome.172.a: "Odešli ho." # todo: NEW TRANSLATION
 study_scripture_outcome.172.b: "Poučení spočívalo v tom, že jsem ho napsal. To stačí." # todo: NEW TRANSLATION
 study_scripture_outcome.172.toast: "[owner.GetTitledFirstName] poslal dopis lidem z [pastoral_county.GetNameNoTier]" # todo: NEW TRANSLATION
 study_scripture_outcome.180.t: "$study_scripture_title$Úleva" # todo: NEW TRANSLATION
 study_scripture_outcome.180.desc: "Začínám číst nový text se zaťatou čelistí a napjatými rameny, připravený snášet další povinnost.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.180.desc_confession: "Někde mezi první a poslední stránkou se má duše zhroutí. Všechno, co jsem v sobě nosil, vyslovím nahlas před nikým jiným než před [ROOT.Char.GetFaith.HighGodName]. Břemeno je pryč.\n\nPoprvé po mnoha měsících je cesta přede mnou jasná." # todo: NEW TRANSLATION
 study_scripture_outcome.180.desc_generic: "Někde mezi první a poslední stránkou mi z ramen sklouzne břemeno. Jako by se zvedl závoj.\n\nPoprvé po mnoha měsících je cesta přede mnou jasná." # todo: NEW TRANSLATION
 study_scripture_outcome.180.a: "A teď — co si přečtu dál..." # todo: NEW TRANSLATION
 study_scripture_outcome.190.t: "$study_scripture_title$Podpora učenců" # todo: NEW TRANSLATION
 study_scripture_outcome.190.desc: "I učení má svou politiku. Opis knihy zaslaný správné radě, nadějný lektor usazený u správného stolu, mé jméno vyslovené s úctou v těch správných síních...\n\nPracuji pilně. Ale píle, které si nikdo nevšimne, je promarněná píle." # todo: NEW TRANSLATION
 study_scripture_outcome.190.a: "Postarej se, aby synod slyšel mé jméno." # todo: NEW TRANSLATION
 study_scripture_outcome.190.b: "Požádej teology, ať se podělí o své poznámky." # todo: NEW TRANSLATION
 study_scripture_outcome.190.c: "Mystikové by měli znát mou práci." # todo: NEW TRANSLATION
 study_scripture_outcome.190.d: "Má zbožnost obstojí sama." # todo: NEW TRANSLATION
 study_scripture_outcome.200.t: "$study_scripture_title$Vizionář" # todo: NEW TRANSLATION
 study_scripture_outcome.200.desc: "Na některých stránkách nacházím místo, kde písmena končí... a začíná cosi za nimi. Mystik známý jako [mystic.GetTitledFirstName] píše o temnotě, která nějakým způsobem září jasněji než poledne, o modlitbě, jež překonává řeč — a [ROOT.Char.GetFaith.GetName] učí, že existují dveře k porozumění, které se otevřou jen těm, kdo mají odvahu zaklepat.\n\nJak obracím stránky, mé svíce jedna po druhé dohasínají. A já dlouho sedím ve tmě. Naslouchám." # todo: NEW TRANSLATION
 study_scripture_outcome.200.a: "V té temnotě něco čekalo. Půjdu to hledat." # todo: NEW TRANSLATION
 study_scripture_outcome.200.b: "Zkoušejte mě, tajemství. Nebojím se." # todo: NEW TRANSLATION
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip] si zaslouží obdivný dopis." # todo: NEW TRANSLATION
 study_scripture_outcome.200.d: "Poznamenám si, kde jsou ty dveře, a budu se držet prostšího studia." # todo: NEW TRANSLATION
 study_scripture_outcome.300.t: "$study_scripture_title$Noční bdění" # todo: NEW TRANSLATION
 study_scripture_outcome.300.desc: "[ROOT.Char.GetFaith.HouseOfWorship] je chladný a naprosto tichý. Mezi poslední pobožností a první další je hodina, která nikomu nepatří, a já si ji přivlastnil — jediná svíce, tma a tajemství, jež se těsně tiskne k plameni.\n\nZa tichem cosi čeká. Je to trpělivé. Dnes večer jsem trpělivý i já." # todo: NEW TRANSLATION
 study_scripture_outcome.300.a: "Hlouběji. Půjdu ještě hlouběji." # todo: NEW TRANSLATION
 study_scripture_outcome.300.b: "Hodina ticha, pak spánek." # todo: NEW TRANSLATION
 study_scripture_outcome.300.c: "Bděl jsem. To stačí." # todo: NEW TRANSLATION
 study_scripture_outcome.100.t: "$study_scripture_title$Otázka nástupnictví" # todo: NEW TRANSLATION
 study_scripture_outcome.100.desc: "Dlouho do noci studuji pravidla volby: kdo může být zvolen, kdo může volit, které precedenty obstály a které se ohnuly. Pravidla odměňují trpělivost.\n\nPapežové umírají. Konkláve se scházejí. A kardinálové nezapomenou, kdo znal zákon, když na tom záleželo." # todo: NEW TRANSLATION
 study_scripture_outcome.100.a: "Jednou ta otázka zazní. Já budu odpovědí." # todo: NEW TRANSLATION
 study_scripture_outcome.100.b: "Moudrost potřebuje čas; ambice mohou počkat." # todo: NEW TRANSLATION
 study_scripture_outcome.100.c: "Raději bych šel spát..." # todo: NEW TRANSLATION
 pam_ss_papabile_tt: "Vaše [papabile_score|E] pro papežské nástupnictví se zvýší o #P +10#!" # todo: NEW TRANSLATION
 study_scripture_outcome.101.t: "$study_scripture_title$Proslulý vykladač" # todo: NEW TRANSLATION
 study_scripture_outcome.101.desc: "Odpověď ke mně přichází u studené večeře, mezi dvěma sousty. Konečně vím, jak ten úryvek číst:\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.101.desc_quote: "#EMP "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"#!\n\nGenerace [Glossary('exegetes', 'GLOSS_EXEGETE')] se přely o tato slova. Nyní se jejich význam zdá naprosto jasný. Otázkou je, co se svou interpretací udělám." # todo: NEW TRANSLATION
 study_scripture_outcome.101.desc_generic: "Generace [Glossary('exegetes', 'GLOSS_EXEGETE')] se přely o tato slova. Nyní se jejich význam zdá naprosto jasný. Otázkou je, co se svou interpretací udělám." # todo: NEW TRANSLATION
 study_scripture_outcome.101.a: "Při příští slavnosti ji vyhlásím z [ROOT.Char.Custom('StudyPulpitWord')]." # todo: NEW TRANSLATION
 study_scripture_outcome.101.b: "Nenápadně ji rozšířím mezi učenci." # todo: NEW TRANSLATION
 study_scripture_outcome.101.c: "Byla mi dána v tichosti; v tichosti ji také vrátím." # todo: NEW TRANSLATION
 GLOSS_EXEGETE: "Člověk zabývající se exegesí — odborník či učenec, který kriticky vysvětluje, vykládá nebo rozebírá text, zejména náboženská písma." # todo: NEW TRANSLATION
 study_scripture_outcome.102.t: "$study_scripture_title$Jasné pochopení nauky" # todo: NEW TRANSLATION
 study_scripture_outcome.102.desc: "Nauky [ROOT.Char.GetFaith.GetName] mám v hlavě už léta, ale některá učení mi nikdy nedávala úplný smysl.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.102.desc_tenet: "Dnes večer mi konečně dochází, co znamená [pam_ss_clarity_tenet.GetBaseName|U]: co tento princip vyžaduje, co odpouští a jaké hranice nesmějí překročit ti, kdo ho ctí. Dokázal bych tuto víru obhájit před kterýmkoli učencem nebo ji vysvětlit dítěti." # todo: NEW TRANSLATION
 study_scripture_outcome.102.desc_generic: "Dnes večer mi konečně dochází, co tato učení znamenají: co vyžadují, co odpouštějí a jaké hranice nepřekračují. Dokázal bych je obhájit před kterýmkoli učencem nebo je vysvětlit dítěti." # todo: NEW TRANSLATION
 study_scripture_outcome.102.desc_quote: "\n\n#EMP "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"#!" # todo: NEW TRANSLATION
 study_scripture_outcome.102.a: "Musím si to zapsat, než světlo pohasne." # todo: NEW TRANSLATION
 study_scripture_outcome.102.b: "Ať mi ta radost stačí." # todo: NEW TRANSLATION
 study_scripture_outcome.102.c: "I zjevení může počkat do rána." # todo: NEW TRANSLATION
 study_scripture_outcome.121.t: "$study_scripture_title$Učitel" # todo: NEW TRANSLATION
 study_scripture_outcome.121.desc: "Najdu svého [ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )], [student_courtier.GetTitledFirstName], v knihovně dlouho poté, co měly svíčky dávno zhasnout. Je skloněný nad textem, který je na jeho vědomosti o několik velikostí příliš náročný.\n\n„Odpusťte mi, [ROOT.Char.Custom('FormOfAddressForLiege')].“ [student_courtier.GetSheHe|U] vyhrkne, zaskočený. „Já... jen bych si přál, abych dokázal tuhle knihu přečíst...“\n\nVzpomenu si, co všechno bych dal za učitele, který by si tu knihu skutečně #EMP přečetl#!." # todo: NEW TRANSLATION, CHECK FORMAT
 study_scripture_outcome.121.a: "Přečteme si ji pořádně, spolu." # todo: NEW TRANSLATION
 study_scripture_outcome.121.b: "Budu [student_courtier.GetHerHim] podporovat." # todo: NEW TRANSLATION
 study_scripture_outcome.121.c: "Nech [student_courtier.GetHerHim] studovat o samotě. Posílí to [student_courtier.GetHerHis] charakter." # todo: NEW TRANSLATION, CHECK FORMAT
 study_scripture_outcome.122.t: "$study_scripture_title$Katechismus" # todo: NEW TRANSLATION
 study_scripture_outcome.122.desc: "Mé studium přineslo ovoce. Dnes večer shromáždím svou domácnost v [ROOT.Char.Custom('ResidenceBuildingHallsType')] své [ROOT.Char.Custom('ResidenceBuilding')] a otevřu před nimi [ROOT.Char.GetFaith.ReligiousText].\n\nČtu. Naslouchají. Brzy přicházejí otázky — některé prosté, jiné překvapivě pronikavé. Zdá se, že nejsem jediný, kdo touží po posvátném vědění." # todo: NEW TRANSLATION
 study_scripture_outcome.122.a: "Řádek po řádku, pro všechny. To je mé poslání." # todo: NEW TRANSLATION
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U] má bystrou mysl. Naučím [pupil.GetHerHim] víc." # todo: NEW TRANSLATION
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip|U] se potom ještě zdržel. Dveře jsou otevřené." # todo: NEW TRANSLATION
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U] se toho naučil dost. Požehnám [devout.GetHerHim]." # todo: NEW TRANSLATION
 study_scripture_outcome.123.t: "$study_scripture_title$Brána [ROOT.Char.Custom('StudySeminaryWord')|U]" # todo: NEW TRANSLATION
 study_scripture_outcome.123.desc: "Pověst o mém studiu se roznesla mezi poutníky a kramáři a dnes mi přivedli dalšího zájemce o studium. [aspirant.GetTitledFirstName] stojí u mé brány, unavený cestou, ale odhodlaný, a v [aspirant.GetHerHis] roztřesených rukou svírá vypůjčenou knihu.\n\n„Říkají, že skutečně čtete to, co kážete. Učte mě a já vám budu sloužit.“" # todo: NEW TRANSLATION
 study_scripture_outcome.123.a: "Ach. Začneme abecedou víry." # todo: NEW TRANSLATION
 study_scripture_outcome.123.b: "Můj dvůr není žádný [ROOT.Char.Custom('StudySeminaryWord')]." # todo: NEW TRANSLATION
 study_scripture_outcome.400.t: "$study_scripture_title$Lékaři, uzdrav sám sebe" # todo: NEW TRANSLATION
 study_scripture_outcome.400.desc: "Ten úryvek mě zarazí. Jeho odsouzení mi připadá až nepříjemně povědomé.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.400.desc_generic: "Text mě nejmenuje, a přesto ano: jsem [penance_sin.GetName( ROOT.Char )], říká — jasně a nemilosrdně — jako by mě autor znal." # todo: NEW TRANSLATION
 study_scripture_outcome.400.desc_end: "\n\nMohl bych knihu zavřít a dál nečíst. Ale obvinění by zůstalo." # todo: NEW TRANSLATION
 study_scripture_outcome.400.a: "Je jen jediný lék. Pokání." # todo: NEW TRANSLATION
 study_scripture_outcome.400.b: "Musím číst dál, ať se děje cokoli." # todo: NEW TRANSLATION
 study_scripture_outcome.400.c: "Svatí káží. Hříšníci vládnou." # todo: NEW TRANSLATION
 study_scripture_outcome.410.t: "$study_scripture_title$Podivné komentáře" # todo: NEW TRANSLATION
 study_scripture_outcome.410.desc: "Kodex mám vypůjčený a jeho předchozí čtenář zanechal na okrajích vlastní myšlenky: námitky, modlitby a poznámky k zásadě, které říká [pam_ss_margin_tenet.GetBaseName].\n\nMěl bych ty čmáranice ignorovat. Místo toho zjišťuji, že si je čtu dvakrát." # todo: NEW TRANSLATION
 study_scripture_outcome.410.a: "A teď potřetí, pomalu." # todo: NEW TRANSLATION
 study_scripture_outcome.410.b: "Tak horlivý blud si zaslouží řádné vyvrácení." # todo: NEW TRANSLATION
 study_scripture_outcome.410.c: "Do ohně s tím, i s celou stránkou." # todo: NEW TRANSLATION
 study_scripture_outcome.430.t: "$study_scripture_title$Zásada a srdce" # todo: NEW TRANSLATION
 study_scripture_outcome.430.desc: "Ze všech učení [ROOT.Char.GetFaith.GetName] je mi jedno bližší než ostatní: [pam_ss_heart_tenet.GetBaseName], které se držím od chvíle, kdy jsem je ještě nedokázal obhájit. Dnes večer se na ně ve svém studiu zaměřím a budu hledat nedostatky.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.430.desc_quote: "Texty odpovídají jedním hlasem:\n#EMP "[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]"#!\n\nChyba nikdy nebyla v tom učení." # todo: NEW TRANSLATION
 study_scripture_outcome.430.desc_generic: "Texty odpovídají jednohlasně, starobylé a neochvějné, zatímco můj hlas kolísá. Zdá se, že chyba nebyla v tom učení." # todo: NEW TRANSLATION
 study_scripture_outcome.430.a: "Věřím tomu. Ať mě celá [ROOT.Char.Custom('StudyParishWord')] vidí, jak podle toho žiji." # todo: NEW TRANSLATION
 study_scripture_outcome.430.b: "Napíšu obhajobu této zásady." # todo: NEW TRANSLATION
 study_scripture_outcome.430.c: "Při bližším zkoumání má každé učení své nedostatky..." # todo: NEW TRANSLATION
 pam_ss_spread_tenet_tt: "Vaše písemná obhajoba může přesvědčit až #V 3#! [rulers|E], aby přijali [pam_ss_heart_tenet.GetBaseName]" # todo: NEW TRANSLATION
 pam_ss_conviction_spread_tt: "$study_scripture_title$Osvojení osobní zásady" # todo: NEW TRANSLATION
 study_scripture_outcome.1000.t: "$study_scripture_title$Pokáraný pastýř" # todo: NEW TRANSLATION
 study_scripture_outcome.1000.desc_present: "[senior.GetTitledFirstName|U] nikdy nezvyšuje [senior.GetHerHis] hlas. Nemá to zapotřebí.\n\n„Říkají mi, že tvé texty zapadají prachem. Pastýř, který se nechce učit, nechává své stádo bloudit. Dostal jsi víc než většina — a co jsi s tím udělal?“\n\nNásledující ticho je horší než jakýkoli křik." # todo: NEW TRANSLATION, CHECK FORMAT
 study_scripture_outcome.1000.desc_letter: "Pergamen nese pečeť [senior.GetTitledFirstName] a každý pečlivě zvolený řádek dopadá jako kámen:\n\n"Doslechl jsem se, že vaše studium vázne. Pastýř, který se nechce učit, svádí [ROOT.Char.GetHerHis] stádo z cesty. Dostalo se vám víc než většině. Očekávám, že příště uslyším lepší zprávy."\n\nBez podpisu. Pečeť stačí." # todo: NEW TRANSLATION
 study_scripture_outcome.1000.desc_dream: "Ve snu stojím ve velké knihovně, kde každá kniha nese mé jméno a každá stránka je prázdná. Postava, kterou znám ze stovek svatých obrazů, zavírá poslední z nich jemně, jako když se zavírají oči mrtvého.\n\n"Bylo vám dáno víc než většině," říká světec — a já se probouzím se slovy, která stále zní v místnosti." # todo: NEW TRANSLATION
 study_scripture_outcome.1000.a: "Už nikdy nezklamu." # todo: NEW TRANSLATION
 study_scripture_outcome.1000.b: "Už to déle neunáším. Dost — navždy." # todo: NEW TRANSLATION
 study_scripture_outcome.1000.c: "Dost. Potřebuji si odpočinout." # todo: NEW TRANSLATION
 never_study_scripture_again_tt: "Už se nikdy nemůžeš pustit do [scheme|E] [GetScheme('study_scripture').GetTypeName]" # todo: NEW TRANSLATION, CHECK FORMAT
 study_scripture_outcome.1010.t: "$study_scripture_title$Dar inkoustu" # todo: NEW TRANSLATION
 study_scripture_outcome.1010.desc: "Dorazí balíček od [sender.GetTitledFirstName]." # todo: NEW TRANSLATION
 study_scripture_outcome.1010.end_christian: "Stužka označuje právě ten úryvek, který se mi nedařilo pochopit:\n\n#EMP "[ROOT.Char.Custom('RandomRelevantBibleQuote')]"#!\n\nŠtědrý a užitečný dar." # todo: NEW TRANSLATION
 study_scripture_outcome.1010.end: "Uvnitř leží krásně vázaná modlitební kniha, jejíž stránky jsou plné modliteb, výkladů a pečlivě provedených iluminací.\n\nŠtědrý a užitečný dar. Odpovědi, které mi unikaly, se možná už skrývají mezi těmito stránkami." # todo: NEW TRANSLATION
 study_scripture_outcome.1010.a: "Tento dar dobře využiji." # todo: NEW TRANSLATION
 study_scripture_outcome.1010.b: "Krásná kniha. Na mé polici bude vypadat dobře." # todo: NEW TRANSLATION
 pam_ss_devotional_book_name: "Modlitební kniha" # todo: NEW TRANSLATION
 pam_ss_devotional_book_description: "Iluminovaný svazek svatých textů a komentářů, opsaný a pozlacený se zjevnou zbožností. Stužka označuje úryvek, který si obdarovaný potřeboval přečíst nejvíce." # todo: NEW TRANSLATION
 study_scripture_outcome.1020.t: "$study_scripture_title$Umrtvování těla" # todo: NEW TRANSLATION
 study_scripture_outcome.1020.desc: "Dnes v noci mě texty porážejí, stejně jako včera a předevčírem. Oči mi kloužou po stránce; mysl mi utíká k večeři, k posteli, ke všemu kromě učení.\n\nProblémem je tělo. Staří asketové to věděli: pohodlí je nejtišším služebníkem [ROOT.Char.GetFaith.DevilName] a hlad zostřuje duši. Možná se tělo musí poddat, než může duch pokročit." # todo: NEW TRANSLATION
 study_scripture_outcome.1020.a: "Bičování mi pročistí mysl." # todo: NEW TRANSLATION
 study_scripture_outcome.1020.b: "Nechť tělo hladoví a duše se sytí." # todo: NEW TRANSLATION
 study_scripture_outcome.1020.c: "Nebo možná večeře, postel a nový začátek zítra." # todo: NEW TRANSLATION
 study_scripture_outcome.1030.t: "$study_scripture_title$Ústraní v klášteře" # todo: NEW TRANSLATION
 study_scripture_outcome.1030.desc: "Mé studium ustrnulo. Stejný stůl, stejná svíce, stejné nezdary. Proto vyhledám svého [ROOT.Char.Custom2( 'RelationToMeShort', counselor )], [counselor.GetTitledFirstName], jehož oddanost nebere ohled na postavení.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.1030.desc_hermitage: ""Přinášíte si s sebou příliš mnoho zdí," říká [counselor.GetFirstNameNoTooltip] a ukazuje na prostou celu, lampu a ticho. "Staří poustevníci to věděli: odstraňte všechno a zůstane jen to, co jste hledali."" # todo: NEW TRANSLATION
 study_scripture_outcome.1030.desc_monastery: ""Studujete jako vládce," říká [counselor.GetFirstNameNoTooltip] bez zlého úmyslu. "Dobýváte stránky a počítáte je jako daně. V tomto domě setrváváme u jednoho řádku celý týden, a nakonec je to on, kdo studuje nás."" # todo: NEW TRANSLATION
 study_scripture_outcome.1030.a: "Zařiďte požehnání pro mé studium." # todo: NEW TRANSLATION
 study_scripture_outcome.1030.b: "Pak budu dva týdny číst tentýž řádek." # todo: NEW TRANSLATION
 study_scripture_outcome.1030.c: "Pomodlím se nad tím a nechám to být." # todo: NEW TRANSLATION
 study_scripture_outcome.1040.t: "$study_scripture_title$Druhý pár rukou" # todo: NEW TRANSLATION
 study_scripture_outcome.1040.desc_acolyte: "O pomoc jsem nežádal. Přesto přišla. Můj [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], mi uspořádal poznámky, našel správný komentář a zastřihl knot mé svíčky. [helper.GetSheHe|U] se potichu naučil[a] moje zvyky — dokonce i to, které pasáže mě nutí povzdychnout si.\n\n„Po odpočinku se ti bude lépe modlit,“ pronese [helper.GetSheHe], když vedle mých poznámek položí teplé [helper.Custom('GetLocalStreetFood')]." # todo: NEW TRANSLATION, CHECK FORMAT
 study_scripture_outcome.1040.desc_partner: "Můj [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], vklouzne dovnitř, vezme mi z rukou kodex a přečte řádek nahlas. Ta slova jsou svatá. [ROOT.Char.GetFaith.HighGodName], odpusť mi — dnes v noci mi připadá ještě svatější [helper.GetHerHis] [helper.Custom('ObjectifiedFeature')].\n\n"Nech mě ti pomoct," zamumlá [helper.GetSheHe], tak blízko, že sdílíme teplo svíce. "Chci to."" # todo: NEW TRANSLATION
 study_scripture_outcome.1040.a: "Tak diktuj až do úsvitu. Dokončíme to." # todo: NEW TRANSLATION
 study_scripture_outcome.1040.b: "Tak tedy hodinu spolu." # todo: NEW TRANSLATION
 study_scripture_outcome.1040.c: "Ta laskavost mi pomůže dost." # todo: NEW TRANSLATION
 study_scripture_outcome.1040.d: "Pojď blíž, svíce dosvítí jen tak daleko..." # todo: NEW TRANSLATION
 study_scripture_outcome.1050.t: "$study_scripture_title$Temná noc duše" # todo: NEW TRANSLATION
 study_scripture_outcome.1050.desc: "Studoval jsem příliš dlouho. Někdy po půlnoci ustoupily odpovědi otázkám a jistota pochybnostem.\n\n" # todo: NEW TRANSLATION
 study_scripture_outcome.1050.desc_quote: "Nejsem první, kdo čelí takovému tichu. #EMP "Bože můj, Bože můj, proč jsi mě opustil?"#!\n\nSvíce hoří. Ticho trvá. Co teď?" # todo: NEW TRANSLATION
 study_scripture_outcome.1050.desc_generic: "Svatí všech věků poznali takové pochybnosti — v hodině, kdy [ROOT.Char.GetFaith.HighGodName] odpírá teplo [ROOT.Char.GetFaith.HighGodHerHis|U] dechu a neřekne nám proč.\n\nSvíce hoří. Nejistota zůstává. Co teď?" # todo: NEW TRANSLATION
 study_scripture_outcome.1050.a: "Pochybnost je text jako každý jiný." # todo: NEW TRANSLATION
 study_scripture_outcome.1050.b: "Možná je právě to ticho odpovědí." # todo: NEW TRANSLATION
 study_scripture_outcome.1050.c: "Za hranice slov, za hranice pochybností — přímo do tajemství." # todo: NEW TRANSLATION
 study_scripture_outcome.1060.t: "$study_scripture_title$[Select_CString( order_head.IsFemale, 'Sisters', 'Brothers' )] řehole" # todo: NEW TRANSLATION
 study_scripture_outcome.1060.desc_house: "Mé studium vázne a nemám mnoho, čím bych se mohl pochlubit. Přesto se zprávy donesly do [order_head.GetPrimaryTitle.GetNameNoTier|l], kde mají pobočku v [order_house_county.GetNameNoTier]. Jejich vůz skřípe na můj dvůr: přepsané komentáře, bedna svící a zapečetěný dopis od [order_head.GetTitledFirstName].\n\n"Dokud nás vede naše řehole, žádný duchovní nestuduje sám. Požádej a vše, co je naše, bude i tvé."" # todo: NEW TRANSLATION
 study_scripture_outcome.1060.desc_far: "Zprávy o mých potížích doputovaly až do [order_head.GetPrimaryTitle.GetNameNoTier|l]. Jejich vůz skřípe na můj dvůr: přepsané komentáře, bedna svící a zapečetěný dopis od [order_head.GetTitledFirstName].\n\n"Dokud trvá řehole, žádný pastýř nestuduje sám. Požádej a vše, co je naše, bude i tvé."" # todo: NEW TRANSLATION
 study_scripture_outcome.1060.a: "Děkuji všem, kdo ty opisy pořídili." # todo: NEW TRANSLATION
 study_scripture_outcome.1060.b: "Pošlete mi jednoho ze svých vzdělaných duchovních." # todo: NEW TRANSLATION
 study_scripture_outcome.1060.c: "Ať je [ROOT.Char.GetFaith.HighGodName] ochraňuje." # todo: NEW TRANSLATION
 pam_ss_lettered_brother_tt: "#EMP Vzdělaný duchovní#! řádu se připojí k vašemu [court|E]" # todo: NEW TRANSLATION
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUIName|U] přijíždí z [order_head.GetPrimaryTitle.GetNameNoTier|l]" # todo: NEW TRANSLATION
