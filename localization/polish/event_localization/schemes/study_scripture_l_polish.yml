l_polish:
 study_scripture_outcome.10.t: "$study_scripture_title$Řehole studia"
 study_scripture_outcome.10.desc: "Na čtecím pultu leží otevřené knihy: články [CZFaithAdjDecline(ROOT.Char.GetFaith,'é')] nauky opsané trpělivou rukou. Svíce se v temnotě zachvívá. Dole, kde stojí [ROOT.Char.GetFaith.HouseOfWorship], věřící čekají jako vždy.\n\n"
 study_scripture_outcome.10.desc_quote: "Na vrchním listu kdosi přede mnou podtrhl jediný úryvek: #EMP „[ROOT.Char.Custom('RandomStudyVerseFragment')]“#!\n\nKolik ze sebe vložím do posvátného listu?"
 study_scripture_outcome.10.desc_generic: "Kolik ze sebe vložím do posvátného učení?"
 study_scripture_outcome.10.a: "Ať svět čeká za dveřmi kláštera."
 study_scripture_outcome.10.b: "Studium bude mít své hodiny, stejně jako je mají [ROOT.Char.Custom('StudyOfficesWord')]."
 study_scripture_outcome.10.c: "Budu číst, jak mě duch povede."
 no_change_study_scripture_tt: "Tvá [Concept('scheme','intrika')|E] [GetScheme('study_scripture').GetTypeName] postupuje beze změny"
 study_scripture_outcome.110.t: "$study_scripture_title$Posvátný list"
 study_scripture_outcome.110.desc: "Řádek po řádku pročítám velké texty víry [ROOT.Char.GetFaith.GetName]. Pod dohořívající svící se hromadí vosk a zajíci se šneky na okrajových kresbách se mezi sebou přou.\n\n"
 study_scripture_outcome.110.desc_quote: "Jedna pasáž ke mně promlouvá:\n#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]“#!\n\nMám-li vést věřící božstva [ROOT.Char.GetFaith.HighGodName], tato slova musím nosit v srdci."
 study_scripture_outcome.110.desc_generic: "Mám-li vést věřící božstva [ROOT.Char.GetFaith.HighGodName], tato slova musím nosit v srdci."
 study_scripture_outcome.110.a: "Musím se učit, ať mě to stojí cokoli."
 study_scripture_outcome.110.b: "Porozumění přijde ve svůj čas."
 study_scripture_outcome.120.t: "$study_scripture_title$Dlouhý komentář"
 study_scripture_outcome.120.desc: "Abych [Select_CString(ROOT.Char.IsFemale,'dokázala','dokázal')] vést své stádo, musím nejprve umět vést sebe. Na stole mám rozložené komentáře [commentary_writer.Custom('CZ_TitledFirstName_G')] — celoživotní dílo jiného učence o posvátném textu [ROOT.Char.GetFaith.ReligiousText], husté jako ostružiní a dvakrát tak ostré. Každý rozluštěný řádek jen odkrývá další nejistoty.\n\nJedině kázeň mě dovede do konce."
 study_scripture_outcome.120.a: "Budu v textu hledat hlubší smysl."
 study_scripture_outcome.120.b: "Pravidelné hodiny, pravidelný pokrok."
 study_scripture_outcome.120.c: "Jedna stránka za noc stačí."
 scholar_xp_high_tt: "Výrazně prohloubíš svou učenost"
 scholar_xp_low_tt: "Mírně prohloubíš svou učenost"
 study_scripture_outcome.130.t: "$study_scripture_title$Trpělivost na okraji stránky"
 study_scripture_outcome.130.desc: "Proč mi smysl stále uniká? Čtu pasáž počtvrté a zavírá se přede mnou jako pěst. Jemně opřu čelo o stůl.\n\n„[Select_CString(tutor.IsFemale,'Přinesla jsem','Přinesl jsem')] ti svíci,“ ozve se ode dveří [Select_CString(tutor.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', tutor)], [tutor.GetFirstName]. „Ach — staré komentáře. Tyto stránky dobře znám. Budeme si v nich chvíli číst společně?“\n\nVzhlédnu. Možná potřebuji právě pomocnou ruku."
 study_scripture_outcome.130.a: "Uč mě. Pýcha mi nebrání učit se."
 study_scripture_outcome.130.b: "Chvíli si ke mně sedni; text může počkat."
 study_scripture_outcome.140.t: "$study_scripture_title$Kázání pro věřící"
 study_scripture_outcome.140.desc: "S povzdechem zavřu další knihu. Ano, na těchto stránkách je vyložena nauka, ale když naposledy [Select_CString(preacher.IsFemale,'kázala','kázal')] [preacher.GetTitledFirstName], bylo v tom něco #EMP víc#!. [Select_CString(preacher.IsFemale,'Její','Jeho')] kázání neobsahovalo žádné přepjaté sylogismy... jen laskavou pravdu božstva [ROOT.Char.GetFaith.HighGodName].\n\nVšichni, kdo tvoří [ROOT.Char.Custom('StudyParishWord')], plakali. #EMP I já#! [Select_CString(ROOT.Char.IsFemale,'jsem plakala','jsem plakal')]."
 study_scripture_outcome.140.a: "Jedna věc je nauka, druhá její podání. Naučím se obojí."
 study_scripture_outcome.140.b: "Mým posláním je psané slovo, nikoli kázání."
 study_scripture_outcome.150.t: "$study_scripture_title$Světské statky"
 study_scripture_outcome.150.desc: "„Pojď se mnou,“ říká [Select_CString(steward_scope.IsFemale,'má','můj')] [ROOT.Char.Custom2( 'RelationToMeShort', steward_scope )], [steward_scope.GetFirstName], s účetní knihou pod paží a zve mě do ranního světla.\n\n„Chrámová pole, mlýn, sýpky na desátky — všímej si, které jsou plné, do kterých zatéká a které jsou přislíbené hned dvakrát. Samotná milost stádo nenasytí.“"
 study_scripture_outcome.150.a: "Nauč mě rozumět účetním knihám."
 study_scripture_outcome.150.b: "Procházka mi alespoň pročistí hlavu."
 study_scripture_outcome.160.t: "$study_scripture_title$Učená společnost"
 study_scripture_outcome.160.desc: "Mé studium mě přivedlo ke korespondenci s [colleague.Custom('CZ_TitledFirstName_I')], o [Select_CString(colleague.IsFemale,'jejíž','jehož')] oddanosti se mluví daleko za zdmi [Select_CString(colleague.IsFemale,'jejího','jeho')] sídla.\n\n"
 study_scripture_outcome.160.desc_distant: "Vyměňujeme si dopisy o otázkách víry — tam a zpět putují otázky, argumenty i opravy. [Select_CString(colleague.IsFemale,'Její','Jeho')] rukopis je příšerný, ale [Select_CString(colleague.IsFemale,'její','jeho')] úsudek má pevné základy."
 study_scripture_outcome.160.a: "Důkladně o tom povedeme disputaci."
 study_scripture_outcome.160.b: "[Select_CString(ROOT.Char.IsFemale,'Učená žena by měla','Učený muž by měl')] vědět, jak se spravuje vlastní církevní sídlo."
 study_scripture_outcome.160.c: "Společně zpátky k textům."
 piety_gain_high_tt: "Výrazný zisk zbožnosti"
 piety_gain_low_tt: "Mírný zisk zbožnosti"
 study_scripture_outcome.170.t: "$study_scripture_title$Dopis pod pečetí"
 study_scripture_outcome.170.desc: "[Select_CString(letterman.IsFemale,'Má','Můj')] [ROOT.Char.Custom2('RelationToMeShort', letterman)], [letterman.GetFirstName], přináší dopis s pečetí [senior.Custom('CZ_TitledFirstName_G')], jako by šlo o relikvii.\n\n„Zprávy o tvém studiu doputovaly dál, než tušíš. Pastýř, který čte, je pro víru obohacením. Vytrvej a můžeš počítat s mou přízní.“\n\n"
 study_scripture_outcome.170.desc_quote: "Dopis uzavírá jediný verš oddělený od zbytku:\n#EMP „[ROOT.Char.Custom('RandomBibleQuoteShort')]“#!"
 study_scripture_outcome.170.desc_generic: "Dopis uzavírá požehnání ve jménu božstva [ROOT.Char.GetFaith.HighGodName], napsané větším písmem než zbytek."
 study_scripture_outcome.170.a: "Sepíšu důstojnou odpověď."
 study_scripture_outcome.170.b: "Snad by [Select_CString(senior.IsFemale,'ona','on')] [Select_CString(senior.IsFemale,'mohla','mohl')] mé studium ocenit více... veřejně?"
 study_scripture_outcome.170.c: "Přečti to znovu. Tentokrát pomalu."
 study_scripture_outcome.171.t: "$study_scripture_title$Dopisy věřícím"
 study_scripture_outcome.171.desc: "Dopisy mě nacházejí ze všech koutů [CZFaithAdjDecline(ROOT.Char.GetFaith,'ého')] světa: duchovní přoucí se o řádek liturgie, místní [ROOT.Char.GetFaith.PriestNeuterPlural] vyděšení vlastními pochybnostmi i učenec žádající posouzení překladu, který nikdo živý nedokáže ověřit. V každém sporu je má pečeť důstojnou odpovědí.\n\n"
 study_scripture_outcome.171.desc_quote: "Dnešní dopis mi s nadějí cituje písmo:\n#EMP „[ROOT.Char.Custom('RandomBibleQuoteShort')]“#!\n\nHromada na mém stole roste. A stejně tiše roste i mé poznání."
 study_scripture_outcome.171.desc_generic: "Hromada na mém stole roste. A stejně tiše roste i mé poznání."
 study_scripture_outcome.171.a: "Odpovědět všem. Od toho tu pastýř je."
 study_scripture_outcome.171.b: "Ať opisovači roznesou mé odpovědi do všech koutů víry."
 study_scripture_outcome.171.c: "Dnes večer jsem [Select_CString(ROOT.Char.IsFemale,'studentkou','studentem')]. Dopisy mohou počkat."
 study_scripture_outcome.172.t: "$study_scripture_title$Pastýřský list"
 study_scripture_outcome.172.desc: "Dnes večer studuji dopisy, které pastýři psali vzdáleným obcím věřících: kázání i slova poučení se mezi jednotlivými společenstvími velice liší.\n\nMyšlenky se mi obracejí k věřícím v hrabství [pastoral_county.GetNameNoTier], v zemích [pastoral_lord.Custom('CZ_TitledFirstName_G')]. Udržují tam kostel. Jsou daleko od mého dosahu a bez mého vedení... Možná je čas napsat jim osobně.\n\nBeru brk. #EMP „Věřícím v hrabství [pastoral_county.GetNameNoTier]...“#!"
 study_scripture_outcome.172.a: "Odeslat."
 study_scripture_outcome.172.b: "Poučení spočívalo v samotném psaní. To stačí."
 study_scripture_outcome.172.toast: "[owner.GetTitledFirstName] [Select_CString(owner.IsFemale,'poslala','poslal')] dopis obyvatelům hrabství [pastoral_county.GetNameNoTier]"
 study_scripture_outcome.180.t: "$study_scripture_title$Odložení břemene"
 study_scripture_outcome.180.desc: "Pouštím se do nového textu se sevřenou čelistí a napjatými rameny. Čekám povinnost, kterou musím přetrpět.\n\n"
 study_scripture_outcome.180.desc_confession: "Kdesi mezi první a poslední stránkou se má duše hroutí. Vše, co mě tíží, vyslovím nahlas před jediným posluchačem, božstvem [ROOT.Char.GetFaith.HighGodName]. Břemeno je pryč.\n\nPoprvé po měsících vidím cestu před sebou jasně."
 study_scripture_outcome.180.desc_generic: "Kdesi mezi první a poslední stránkou mi z ramen sklouzne tíha. Jako by se zvedl závoj.\n\nPoprvé po měsících vidím cestu před sebou jasně."
 study_scripture_outcome.180.a: "A teď — co číst dál..."
 study_scripture_outcome.190.t: "$study_scripture_title$Podpora učených"
 study_scripture_outcome.190.desc: "I učenost má svou politiku. Opsaná kniha zaslaná správné radě, nadějný lektor usazený u správného stolu, mé jméno vřele vyslovené ve správných síních...\n\nPracuji pilně. Neviditelná píle však přichází vniveč."
 study_scripture_outcome.190.a: "Postarejte se, aby synod slyšel mé jméno."
 study_scripture_outcome.190.b: "Požádejte teology, aby se podělili o své poznámky."
 study_scripture_outcome.190.c: "Mystici by měli znát mou práci."
 study_scripture_outcome.190.d: "Má oddanost obstojí sama o sobě."
 study_scripture_outcome.200.t: "$study_scripture_title$Vizionář"
 study_scripture_outcome.200.desc: "Na některých stránkách zjišťuji, že tam, kde končí písmena... začíná něco dalšího. Mystická osobnost známá jako [mystic.GetTitledFirstName] píše o temnotě, která nějak přesahuje jas poledne, a o modlitbě, která přetrvá řeč — a víra [ROOT.Char.GetFaith.GetName] učí, že některé dveře k porozumění se otevřou jen těm, kdo mají odvahu zaklepat.\n\nJak obracím stránky, mé svíce jedna po druhé dohasínají. A já ještě dlouho sedím potmě. Naslouchám."
 study_scripture_outcome.200.a: "V té temnotě něco čekalo. Budu to hledat."
 study_scripture_outcome.200.b: "Zkoušejte mě, tajemství. Nemám strach."
 study_scripture_outcome.200.c: "[mystic.GetFirstNameNoTooltip] si zaslouží obdivný dopis."
 study_scripture_outcome.200.d: "Poznamenám si ty dveře a zůstanu u prostšího studia."
 study_scripture_outcome.300.t: "$study_scripture_title$Noční bdění"
 study_scripture_outcome.300.desc: "Tam, kde stojí [ROOT.Char.GetFaith.HouseOfWorship], panuje chlad a naprosté ticho. Mezi poslední a první bohoslužbou je hodina, která nikomu nepatří, a já si ji [Select_CString(ROOT.Char.IsFemale,'přivlastnila','přivlastnil')] — jediná svíce, temnota a tajemství těsně doléhající na její plamen.\n\nZa tichem něco čeká. Je to trpělivé. A dnes večer jsem i já."
 study_scripture_outcome.300.a: "Hlouběji. Půjdu hlouběji."
 study_scripture_outcome.300.b: "Hodina ticha a pak spánek."
 study_scripture_outcome.300.c: "[Select_CString(ROOT.Char.IsFemale,'Držela jsem','Držel jsem')] stráž; to stačí."
 study_scripture_outcome.100.t: "$study_scripture_title$Otázka nástupnictví"
 study_scripture_outcome.100.desc: "Dlouho do noci studuji pravidla volby: kdo smí být zvolen, kdo smí volit, které precedenty obstály a které se ohnuly. Pravidla odměňují trpělivost.\n\nPapežové umírají. Konkláve se scházejí. A kardinálové nezapomenou, kdo znal zákon, když na tom záleželo."
 study_scripture_outcome.100.a: "Jednou ta otázka zazní. Já budu odpovědí."
 study_scripture_outcome.100.b: "Moudrost potřebuje čas; ctižádost může počkat."
 study_scripture_outcome.100.c: "Raději půjdu spát..."
 pam_ss_papabile_tt: "Tvé [Concept('papabile_score','skóre papežské kandidatury')|E] pro papežské nástupnictví se zvýší o #P +10#!"
 study_scripture_outcome.101.t: "$study_scripture_title$[Select_CString(ROOT.Char.IsFemale,'Proslulá exegetka','Proslulý exegeta')]"
 study_scripture_outcome.101.desc: "Odpověď ke mně přichází nad studenou večeří, mezi dvěma sousty. Konečně vím, jak tu pasáž číst:\n\n"
 study_scripture_outcome.101.desc_quote: "#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]“#!\n\nCelé generace [Glossary('exegetů','GLOSS_EXEGETE')] se přely o tato slova. Nyní mi jejich význam připadá naprosto jasný. Otázkou je, co s mým výkladem udělat."
 study_scripture_outcome.101.desc_generic: "Celé generace [Glossary('exegetů','GLOSS_EXEGETE')] se přely o tato slova. Nyní mi jejich význam připadá naprosto jasný. Otázkou je, co s mým výkladem udělat."
 study_scripture_outcome.101.a: "Při příští slavnosti bude [ROOT.Char.Custom('StudyPulpitWord')] místem, odkud to budu kázat."
 study_scripture_outcome.101.b: "Nechat to tiše kolovat mezi učenými."
 study_scripture_outcome.101.c: "Přišlo to ke mně v tichu; v tichu to vracím."
 GLOSS_EXEGETE: "Člověk, který se věnuje exegezi — znalec či učenec ovládající kritické vysvětlování, vykládání a rozebírání textu, zejména náboženského písma."
 study_scripture_outcome.102.t: "$study_scripture_title$Jasnost nauky"
 study_scripture_outcome.102.desc: "Nauky víry [ROOT.Char.GetFaith.GetName] mi v mysli leží už celé roky, některá učení mi však nikdy nedávala úplný smysl.\n\n"
 study_scripture_outcome.102.desc_tenet: "Dnes večer konečně chápu zásadu [pam_ss_clarity_tenet.GetBaseName|U]: co vyžaduje, co odpouští a jaké hranice nesmí ti, kdo ji ctí, překročit. [Select_CString(ROOT.Char.IsFemale,'Dokázala bych','Dokázal bych')] toto přesvědčení obhájit před kterýmkoli učencem nebo je vysvětlit dítěti."
 study_scripture_outcome.102.desc_generic: "Dnes večer konečně chápu tato učení: co vyžadují, co odpouštějí a jaké hranice nepřekročí. [Select_CString(ROOT.Char.IsFemale,'Dokázala bych','Dokázal bych')] je obhájit před kterýmkoli učencem nebo je vysvětlit dítěti."
 study_scripture_outcome.102.desc_quote: "\n\n#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]“#!"
 study_scripture_outcome.102.a: "Musím to zapsat, než světlo pohasne."
 study_scripture_outcome.102.b: "Ať mi stačí radost z poznání."
 study_scripture_outcome.102.c: "I zjevení může počkat do rána."
 study_scripture_outcome.121.t: "$study_scripture_title$Učitel"
 study_scripture_outcome.121.desc: "Dlouho poté, co už měly svíce zhasnout, nacházím v knihovně [student_courtier.Custom('CZ_TitledFirstName_A')] ([ROOT.Char.Custom2( 'RelationToMeShort', student_courtier )]). Sklání se nad textem, který [Select_CString(student_courtier.IsFemale,'její','jeho')] učenost dalece přesahuje.\n\n„Prosím o odpuštění, [ROOT.Char.Custom('FormOfAddressForLiege')],“ vylekaně vyhrkne [Select_CString(student_courtier.IsFemale,'ona','on')]. „Já... jen toužím umět přečíst tento svazek...“\n\nVzpomínám, kolik [Select_CString(ROOT.Char.IsFemale,'bych dala','bych dal')] za učitele, který tu knihu skutečně #EMP přečetl#!."
 study_scripture_outcome.121.a: "Přečteme si to řádně, společně."
 study_scripture_outcome.121.b: "Poskytnu [student_courtier.Custom('CZ_FirstNameNoTooltip_D')] podporu."
 study_scripture_outcome.121.c: "Ať studuje bez pomoci. Posílí to charakter."
 study_scripture_outcome.122.t: "$study_scripture_title$Katechismus"
 study_scripture_outcome.122.desc: "Mé studium přineslo ovoce. Dnes večer shromáždím svou domácnost v síni svého sídla a otevřu před nimi posvátný text [ROOT.Char.GetFaith.ReligiousText].\n\nČtu. Naslouchají. Brzy přijdou otázky — některé prosté, jiné překvapivě pronikavé. Zdá se, že nejsem jediná duše hladovějící po posvátném učení."
 study_scripture_outcome.122.a: "Řádek po řádku, pro všechny. To je má práce."
 study_scripture_outcome.122.b: "[pupil.GetFirstNameNoTooltip|U] má bystrou mysl. Naučím [Select_CString(pupil.IsFemale,'ji','ho')] víc."
 study_scripture_outcome.122.c: "[stray.GetFirstNameNoTooltip|U] se potom ještě [Select_CString(stray.IsFemale,'zdržela','zdržel')]. Dveře jsou otevřené."
 study_scripture_outcome.122.d: "[devout.GetFirstNameNoTooltip|U] se [Select_CString(devout.IsFemale,'naučila','naučil')] dost. Ať [Select_CString(devout.IsFemale,'ji','ho')] provází mé požehnání."
 study_scripture_outcome.123.t: "$study_scripture_title$Brána semináře"
 study_scripture_outcome.123.desc: "Zprávy o mém studiu putovaly s poutníky a podomními obchodníky a dnes mi přivedli člověka, který se chce učit. [aspirant.GetTitledFirstName] stojí u mé brány, [Select_CString(aspirant.IsFemale,'zmožená cestou a zarputilá','zmožený cestou a zarputilý')], a v roztřesených rukou svírá vypůjčenou knihu.\n\n„Říkají, že opravdu čteš to, co kážeš. Uč mě a já ti budu sloužit.“"
 study_scripture_outcome.123.a: "Ach. Začneme abecedou víry."
 study_scripture_outcome.123.b: "Můj dvůr není [ROOT.Char.Custom('StudySeminaryWord')]."
 study_scripture_outcome.400.t: "$study_scripture_title$Lékaři, uzdrav sám sebe"
 study_scripture_outcome.400.desc: "Ta pasáž mě zarazí. Její odsudek zní nepříjemně povědomě.\n\n"
 study_scripture_outcome.400.desc_generic: "Text mě nejmenuje, a přesto ano: bez příkras a bez milosti mi přisuzuje rys [penance_sin.GetName( ROOT.Char )], jako by mě jeho pisatel znal."
 study_scripture_outcome.400.desc_end: "\n\nMohu knihu zavřít a dál nečíst. Obvinění by však zůstalo."
 study_scripture_outcome.400.a: "Je jen jediný lék. Pokání."
 study_scripture_outcome.400.b: "Musím číst dál, ať se děje cokoli."
 study_scripture_outcome.400.c: "Svatí káží. Hříšníci vládnou."
 study_scripture_outcome.410.t: "$study_scripture_title$Podivné komentáře"
 study_scripture_outcome.410.desc: "Kodex je vypůjčený a předchozí čtenář na jeho okrajích zanechal vlastní myšlenky: námitky, modlitby i poznámky k zásadě, které říká [pam_ss_margin_tenet.GetBaseName].\n\nTakové čmáranice mám přehlížet. Místo toho se přistihnu, že je čtu dvakrát."
 study_scripture_outcome.410.a: "A teď potřetí, pomalu."
 study_scripture_outcome.410.b: "Tak upřímný omyl si zaslouží důkladné vyvrácení."
 study_scripture_outcome.410.c: "Do ohně, i se stránkou."
 study_scripture_outcome.430.t: "$study_scripture_title$Zásada a srdce"
 study_scripture_outcome.430.desc: "Ze všech učení víry [ROOT.Char.GetFaith.GetName] je mi jedno bližší než ostatní: zásada [pam_ss_heart_tenet.GetBaseName], která mě provází dávno předtím, než [Select_CString(ROOT.Char.IsFemale,'jsem ji dokázala','jsem ji dokázal')] obhájit. Dnes večer na ni zaměřuji své studium a hledám nedostatky.\n\n"
 study_scripture_outcome.430.desc_quote: "Texty odpovídají jedním hlasem:\n#EMP „[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]“#!\n\nNedostatek nikdy nebyl v učení."
 study_scripture_outcome.430.desc_generic: "Texty odpovídají svorně, starobyle a neochvějně, zatímco můj hlas se chvěje. Zdá se, že nedostatek nebyl v učení."
 study_scripture_outcome.430.a: "Věřím tomu. Ať všichni věřící vidí, jak tím žiji."
 study_scripture_outcome.430.b: "Budu psát na její obranu."
 study_scripture_outcome.430.c: "Každé učení má nedostatky, když se zkoumá příliš zblízka..."
 pam_ss_spread_tenet_tt: "Tvá písemná obhajoba může přimět až #V 3#! [Concept('rulers','vládce')|E] k přijetí zásady [pam_ss_heart_tenet.GetBaseName]"
 pam_ss_conviction_spread_tt: "$study_scripture_title$Přijetí osobní zásady"
 study_scripture_outcome.1000.t: "$study_scripture_title$[Select_CString(ROOT.Char.IsFemale,'Pokáraná pastýřka','Pokáraný pastýř')]"
 study_scripture_outcome.1000.desc_present: "[senior.GetTitledFirstName|U] nikdy nezvýší hlas. [Select_CString(senior.IsFemale,'ona','on')|U] to nemá zapotřebí.\n\n„Říkají mi, že tvé texty pokrývá prach. Pastýř, který se nechce učit, nechává stádo bloudit. Dostalo se ti více než většině — a co z toho máš?“\n\nTicho, které následuje, je horší než jakýkoli křik."
 study_scripture_outcome.1000.desc_letter: "Pergamen nese pečeť [senior.Custom('CZ_TitledFirstName_G')] a každý odměřený řádek dopadá jako kámen:\n\n„Slyším, že tvé studium vázne. Pastýř, který se nechce učit, vede své stádo na scestí. Dostalo se ti více než většině. Očekávám lepší zprávy.“\n\nBez podpisu. Pečeť stačí."
 study_scripture_outcome.1000.desc_dream: "Ve snu stojím ve veliké knihovně, kde každá kniha nese mé jméno a každá stránka je prázdná. Postava, kterou znám ze stovky svatých obrazů, jemně zavírá poslední z nich, tak jako se zavírají oči mrtvým.\n\n„Dostalo se ti více než většině,“ praví světec — a já se probouzím se slovy, která dosud znějí v místnosti."
 study_scripture_outcome.1000.a: "Už znovu nezklamu."
 study_scripture_outcome.1000.b: "Tohle už dál neunesu. Dost — navždy."
 study_scripture_outcome.1000.c: "Dost. Potřebuji odpočinek."
 never_study_scripture_again_tt: "Už #N nikdy#! nebudeš moci zahájit [Concept('scheme','intriku')|E] [GetScheme('study_scripture').GetTypeName]"
 study_scripture_outcome.1010.t: "$study_scripture_title$Dar inkoustu"
 study_scripture_outcome.1010.desc: "Přichází zásilka od [sender.Custom('CZ_TitledFirstName_G')]."
 study_scripture_outcome.1010.end_christian: "Stužka označuje právě tu pasáž, kterou se mi nedaří pochopit:\n\n#EMP „[ROOT.Char.Custom('RandomRelevantBibleQuote')]“#!\n\nŠtědrý dar, a užitečný."
 study_scripture_outcome.1010.end: "Uvnitř leží krásně vázaná zbožná kniha, jejíž stránky naplňují modlitby, komentáře a pečlivé iluminace.\n\nŠtědrý dar, a užitečný. Odpovědi, které mi dosud unikaly, už možná leží mezi těmito stránkami."
 study_scripture_outcome.1010.a: "Tento dar dobře využiji."
 study_scripture_outcome.1010.b: "Pěkná kniha. Bude se dobře vyjímat na mé polici."
 pam_ss_devotional_book_name: "Zbožná kniha"
 pam_ss_devotional_book_description: "Iluminovaný svazek svatých textů a komentářů, opsaný a pozlacený se zjevnou oddaností. Stužka označuje pasáž, kterou příjemce potřeboval číst nejvíce."
 study_scripture_outcome.1020.t: "$study_scripture_title$Umrtvování těla"
 study_scripture_outcome.1020.desc: "Texty nade mnou dnes večer vítězí, stejně jako včera a předevčírem. Oči mi sklouzávají ze stránky a mysl bloudí k večeři, k posteli, k čemukoli kromě nauky.\n\nProblém je tělo. Staří asketi to věděli: pohodlí tiše slouží ďábelské moci, jejíž jméno je [ROOT.Char.GetFaith.DevilName], a hlad zostřuje duši. Možná musí tělo ustoupit, než duch pokročí."
 study_scripture_outcome.1020.a: "Bič mi pročistí mysl."
 study_scripture_outcome.1020.b: "Vyhladovět tělo, nasytit duši."
 study_scripture_outcome.1020.c: "Nebo raději večeře, postel a zítra nový začátek."
 study_scripture_outcome.1030.t: "$study_scripture_title$Ústup do kláštera"
 study_scripture_outcome.1030.desc: "Mé studium se zastavilo. Stejný stůl, stejná svíce, stejné porážky. Vyhledám tedy [counselor.Custom('CZ_TitledFirstName_A')] ([ROOT.Char.Custom2( 'RelationToMeShort', counselor )]), [Select_CString(counselor.IsFemale,'jejíž','jehož')] oddanost se nestará o postavení.\n\n"
 study_scripture_outcome.1030.desc_hermitage: "„Přinášíš si s sebou příliš mnoho zdí,“ říká [counselor.GetFirstNameNoTooltip] a ukazuje na holou celu, lampu i ticho. „Dávní poustevníci věděli: odlož vše a to, co zůstane, je právě to, co hledáš.“"
 study_scripture_outcome.1030.desc_monastery: "„Studuješ jako [Select_CString(ROOT.Char.IsFemale,'vladařka','vladař')],“ říká [counselor.GetFirstNameNoTooltip], nikoli nelaskavě. „Dobýváš stránky a počítáš je jako daně. V tomto domě sedíme nad jediným řádkem celý týden a na jeho konci už ten řádek studuje nás.“"
 study_scripture_outcome.1030.a: "Zajistit požehnání pro mé studium."
 study_scripture_outcome.1030.b: "Potom budu stejný řádek číst dva týdny."
 study_scripture_outcome.1030.c: "Pomodlím se za to a dál to nechám být."
 study_scripture_outcome.1040.t: "$study_scripture_title$Další pár rukou"
 study_scripture_outcome.1040.desc_acolyte: "O pomoc [Select_CString(ROOT.Char.IsFemale,'jsem nežádala','jsem nežádal')]. Přesto přišla. [Select_CString(helper.IsFemale,'Má','Můj')] [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], [Select_CString(helper.IsFemale,'roztřídila','roztřídil')] mé poznámky, [Select_CString(helper.IsFemale,'našla','našel')] správný komentář a [Select_CString(helper.IsFemale,'zastřihla','zastřihl')] knot svíce. Tiše si [Select_CString(helper.IsFemale,'osvojila','osvojil')] mé zvyky — dokonce i to, nad kterými pasážemi vzdychám.\n\n„V odpočatém těle se lépe modlí,“ říká prostě [Select_CString(helper.IsFemale,'ona','on')] a vedle mých poznámek pokládá teplé jídlo, [helper.Custom('GetLocalStreetFood')]."
 study_scripture_outcome.1040.desc_partner: "[Select_CString(helper.IsFemale,'Má','Můj')] [ROOT.Char.Custom2( 'RelationToMeShort', helper )], [helper.GetTitledFirstName], vklouzne dovnitř, vezme mi kodex z rukou a přečte řádek nahlas. Slova jsou svatá. Kéž mi [ROOT.Char.GetFaith.HighGodName] odpustí — dnes večer považuji [Select_CString(helper.IsFemale,'její','jeho')] [helper.Custom('ObjectifiedFeature')] za ještě svatější.\n\n„Dovol mi pomoci,“ šeptá [Select_CString(helper.IsFemale,'ona','on')] tak blízko, že se společně hřejeme u svíce. „Chci.“"
 study_scripture_outcome.1040.a: "Potom zapisuj můj diktát až do úsvitu. Dokončíme to."
 study_scripture_outcome.1040.b: "Tedy hodinu společně."
 study_scripture_outcome.1040.c: "Ta laskavost je sama o sobě dostatečnou pomocí."
 study_scripture_outcome.1040.d: "Pojď blíž, světlo svíce dosáhne jen kousek..."
 study_scripture_outcome.1050.t: "$study_scripture_title$Temná noc duše"
 study_scripture_outcome.1050.desc: "[Select_CString(ROOT.Char.IsFemale,'Studovala jsem','Studoval jsem')] příliš dlouho. Kdesi po půlnoci ustoupily odpovědi otázkám a jistota pochybnostem.\n\n"
 study_scripture_outcome.1050.desc_quote: "Nejsem první, kdo čelí takovému tichu. #EMP „Bože můj, Bože můj, proč jsi mě opustil?“#!\n\nSvíce hoří. Ticho trvá. Co teď?"
 study_scripture_outcome.1050.desc_generic: "Svatí všech věků znali tuto pochybnost — v hodině, kdy [ROOT.Char.GetFaith.HighGodName] odpírá teplo svého dechu a nechce nám říci proč.\n\nSvíce hoří. Nejistota zůstává. Co teď?"
 study_scripture_outcome.1050.a: "Pochybnost je text jako každý jiný."
 study_scripture_outcome.1050.b: "Možná je ticho odpovědí."
 study_scripture_outcome.1050.c: "Za slova, za pochybnost — do samotného tajemství."
 study_scripture_outcome.1060.t: "$study_scripture_title$[Select_CString(order_head.IsFemale,'Sestry','Bratři')] řehole"
 study_scripture_outcome.1060.desc_house: "Mé studium vázne a nemám se příliš čím pochlubit. Zprávy však dorazily k řádu [order_head.GetPrimaryTitle.GetNameNoTier|l], který udržuje komunitu v hrabství [order_house_county.GetNameNoTier]. Na můj dvůr s vrzáním vjíždí jejich vůz: opsané komentáře, bedna svící a zapečetěný vzkaz od [order_head.Custom('CZ_TitledFirstName_G')].\n\n„Dokud nás vede naše řehole, žádný duchovní nestuduje sám. Požádej a vše naše je i tvé.“"
 study_scripture_outcome.1060.desc_far: "Zprávy o mých nesnázích doputovaly až k řádu [order_head.GetPrimaryTitle.GetNameNoTier|l]. Na můj dvůr s vrzáním vjíždí jejich vůz: opsané komentáře, bedna svící a zapečetěný vzkaz od [order_head.Custom('CZ_TitledFirstName_G')].\n\n„Dokud řehole trvá, žádný pastýř nestuduje sám. Požádej a vše naše je i tvé.“"
 study_scripture_outcome.1060.a: "Mé díky každé ruce, která pořídila opis."
 study_scripture_outcome.1060.b: "Pošlete mi někoho ze svých učených duchovních."
 study_scripture_outcome.1060.c: "Kéž je [ROOT.Char.GetFaith.HighGodName] opatruje."
 pam_ss_lettered_brother_tt: "Na tvůj [Concept('court','dvůr')|E] přichází #EMP učený duchovní#! řádu"
 study_scripture_outcome.1060.b.toast: "[lettered_brother.GetShortUIName|U] přichází z řádu [order_head.GetPrimaryTitle.GetNameNoTier|l]"
