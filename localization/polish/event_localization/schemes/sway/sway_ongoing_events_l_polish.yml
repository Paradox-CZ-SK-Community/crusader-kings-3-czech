l_polish:
 sway_ongoing.1001.t: "Získávání přízně: [target.GetCulture.GetNameNoTooltip] kultura"
 sway_ongoing.1001.desc: "Prostého člověka z [target.GetCulture.GetNameNoTooltip] kultury kdosi v hlavním městě [capital.GetNameNoTooltip] napadl kvůli nějakému drobnému prohřešku.\n\nKdybych se jej veřejně zastal, mohlo by to změnit názor, který na mě [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] má — zvlášť když pochází ze stejné kultury. Jenže bych tím mohl popudit své [ROOT.Char.GetCulture.GetNameNoTooltip] soukmenovce..."
 sway_ongoing.1001.a: "[target.GetCulture.GetCollectiveNounNoTooltip] jsou dobří lidé."
 sway_ongoing.1001.b: "[ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] mají mnohem pevnější morální zásady!"
 sway_ongoing.1002.t: "Získávání přízně: Lichotky"
 sway_ongoing.1002.desc: "Do příštího dopisu, který odešlu na dvůr, kde pobývá [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], bych mohl přidat lichotku. Třeba pak snáze podlehne mým pokusům o sblížení.\n\nRozhodně se zmíním o..."
 sway_ongoing.1002.success.tt: "Rozhodne [friend.GetTitledFirstNameNoTooltip]:"
 sway_ongoing.1002.b: "Budu stručný a věcný."
 sway_ongoing.1003.opening: "[target.Custom2('AppropriateGreeting', ROOT.Char)]"
 sway_ongoing.1003.desc: "Naše nedávná korespondence mi přinesla mnoho potěšení. Nemohu se ubránit dojmu, že častější výměna dopisů by nám oběma mohla prospět."
 sway_ongoing.1003.a: "Výborně!"
 sway_ongoing.1004.desc: "Naše nedávná korespondence zanechala mnoho přání nenaplněných. Do budoucna se, prosím, zdržte osobních poznámek."
 sway_ongoing.1004.a: "Ach ne..."
 sway_ongoing.1005.t: "Získávání přízně: V dobrém světle"
 sway_ongoing.1005.desc: "Když hostím pány a dámy z blízkých i vzdálených panství, naskýtá se hned několik příležitostí. [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] se dá před ostatními vykreslit ve velmi dobrém světle.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], povězte nám, kdo je podle vás ze všech lidí, o nichž jste kdy slyšel[Select_CString(ROOT.Char.IsFemale, 'a', '')], nejvíce [target.Custom('FormalComplimentAdjective')]?“"
 sway_ongoing.1005.a: "[target.GetTitledFirstNameNoTooltip], bezpochyby!"
 sway_ongoing.1005.b: "Přece já, kdo jiný!"
 sway_ongoing.1006.t: "Získávání přízně: Vetřelci"
 sway_ongoing.1006.desc: "Doneslo se mi, že se někteří místní prostí lidé stěhují do hlavního města [capital.GetNameNoTooltip], odkud vládne [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)].\n\nAť už tam žijí odjakživa, nebo se právě přistěhovali, jejich chvála mi jistě může jen prospět. [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] se o ní dříve či později doslechne..."
 sway_ongoing.1006.a: "„Vezměte si tohle zlato a postarejte se, aby vás bylo slyšet.“"
 sway_ongoing.1006.b: "Nestojí to za to."
 sway_ongoing.5001.t: "Získávání přízně: Osobnější tón"
 sway_ongoing.5001.desc: "Z naší nedávné korespondence je mi jasné, že [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] chce věnovat více pozornosti svým ambicím a zájmům.\n\nDo příštích dopisů by se #EMP dalo#! nenápadně vplést něco, co je opravdu blízké srdci mého protějšku..."
 sway_ongoing.5001.diplomacy_lifestyle: "Diplomatické záležitosti jsou zřejmě to pravé."
 sway_ongoing.5001.martial_lifestyle: "Prý [target.GetFirstNameNoTooltip] oceňuje válečné činy."
 sway_ongoing.5001.stewardship_lifestyle: "[target.GetFirstNameNoTooltip] se jistě zajímá o správu panství."
 sway_ongoing.5001.intrigue_lifestyle: "[target.GetFirstNameNoTooltip] má jistě v oblibě úskoky a intriky."
 sway_ongoing.5001.learning_lifestyle: "[target.GetFirstNameNoTooltip] jistě neodolá dobré knize!"
 sway_ongoing.5001.a.tt: "Nenápadně zahrneš toto téma do příštích dopisů"
 sway_ongoing.5001.b: "Do toho mi nic není."
 sway_ongoing.5002.t: "Osobnější tón"
 sway_ongoing.5002.desc_opening: "V naší poslední korespondenci přišla od [owner.Custom2('MyCharacterIntroductionNoComma', target)] mimochodem řeč na"
 sway_ongoing.5002.desc_diplomacy: "nedávný rozhovor"
 sway_ongoing.5002.desc_martial: "stav vojska"
 sway_ongoing.5002.desc_stewardship: "správu panství"
 sway_ongoing.5002.desc_intrigue: "jemnosti dvorských intrik"
 sway_ongoing.5002.desc_learning: "nedávno přečtenou knihu"
 sway_ongoing.5002.desc_fallback: "téma, které s naším rozhovorem nijak nesouviselo"
 sway_ongoing.5002.desc_success: "– a ukázalo se, že [owner.GetFirstNameNoTooltip] se o to také zajímá!"
 sway_ongoing.5002.desc_failure: "– jako by mě něco takového mohlo zajímat!"
 sway_ongoing.5002.desc_ending: "\n\nTyto dopisy mají být samozřejmě ryze diplomatické povahy, ale občas se zkrátka stočí i k osobnějším tématům..."
 sway_ongoing.5002.a: "Promluvme si o tom víc!"
 sway_ongoing.5002.b: "Ach, #EMP prosím#!, povídej dál!"
 sway_ongoing.5002.b.tt: "Tak dobře, ať má [owner.GetFirstNameNoTooltip] radost..."
 sway_ongoing.5002.c: "Ocením, když se budeme držet podstatných témat."
 sway_ongoing.5003.desc_opening: "V odpovědi se ukázalo, že mé drobné odbočení k osobnějším tématům padlo na úrodnou půdu — [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] chce v podobném rozhovoru pokračovat!"
 sway_ongoing.5003.desc_nonsense: "\n\nTeď už jen musím dál předstírat, že o [owner.Custom('LifestyleFocusTopic')] vůbec něco vím..."
 sway_ongoing.5003.desc: "\n\nJak příjemné, že [target.GetFirstNameNoTooltip] se také zajímá o [owner.Custom('LifestyleFocusTopic')]."
 sway_ongoing.5003.a: "Promluvme si o tom víc!"
 sway_ongoing.5003.b_diplomacy: "„Takže... co vazalové?“"
 sway_ongoing.5003.b_martial: "„Takže... co meče?“"
 sway_ongoing.5003.b_stewardship: "„Takže... co zlato?“"
 sway_ongoing.5003.b_intrigue: "„Takže... co spiknutí?“"
 sway_ongoing.5003.b_learning: "„Takže... co písmena?“"
 sway_ongoing.5003.b.tt: "Doufám, že mi to [target.GetFirstNameNoTooltip] spolkne!"
 sway_ongoing.5003.c: "Tohle nedokážu!"
 sway_ongoing.5004.desc: "V odpovědi mě [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] žádá, abych přestal[Select_CString(ROOT.Char.IsFemale, 'a', '')] s osobními otázkami a držel[Select_CString(ROOT.Char.IsFemale, 'a', '')] se tématu.\n\n„Tyhle pokusy odvést řeč jinam se mi nelíbí.“"
 sway_ongoing.5004.desc_nonsense: "\n\nMožná je to tak lepší... O [owner.Custom('LifestyleFocusTopic')] toho stejně moc nevím."
 sway_ongoing.5004.a: "Za pokus to stálo!"
 sway_ongoing.5005.desc: "V poslední odpovědi [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] přiznává, že o [owner.Custom('LifestyleFocusTopic')] ve skutečnosti vůbec nic neví a celou dobu jen předstíral[Select_CString(owner.IsFemale, 'a', '')] zájem kvůli našemu rozhovoru!"
 sway_ongoing.5005.a: "Takový lhář! Ale neboj, nikomu to neřeknu."
 sway_ongoing.5006.desc: "V poslední odpovědi [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] přiznává, že o [target.Custom('LifestyleFocusTopic')] ve skutečnosti vůbec nic neví a celou dobu jen předstíral[Select_CString(target.IsFemale, 'a', '')] zájem kvůli našemu rozhovoru!"
 sway_ongoing.5007.desc: "Poslední dopis od [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] obsahoval celý odstavec o [owner.Custom('LifestyleFocusTopic')]! Vůbec jsem netušil[Select_CString(ROOT.Char.IsFemale, 'a', '')], že se [owner.GetFirstNameNoTooltip] o takové věci tolik zajímá...\n\nZpočátku jsem jen chtěl[Select_CString(ROOT.Char.IsFemale, 'a', '')] udělat radost, ale teď už jsem možná zašel[Select_CString(ROOT.Char.IsFemale, 'a', '')] příliš daleko, než abych mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] vycouvat..."
 sway_ongoing.5007.b.tt: "Doufám, že mi to [owner.GetFirstNameNoTooltip] spolkne!"
 sway_ongoing.5009.desc_success: "Po dlouhých rozhovorech s [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] o [owner.Custom('LifestyleFocusTopic')] a po všem tom studiu, kterým jsem musel[Select_CString(ROOT.Char.IsFemale, 'a', '')] maskovat svou neznalost, si uvědomuji, že už mi tohle téma zdaleka není tak cizí jako dřív!"
 sway_ongoing.5009.desc_owner_discovered: "Z poslední korespondence je zřejmé, že [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] začíná vážně pochybovat o tom, co vlastně vím o [owner.Custom('LifestyleFocusTopic')].\n\nPři čtení posledního dopisu mi dochází, že má lest byla odhalena — pořád se v něm píše o „naprostém nepochopení“ a „ostudné přehlídce hlouposti“."
 sway_ongoing.5009.desc_target_discovered: "V poslední korespondenci [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] předvedl[Select_CString(target.IsFemale, 'a', '')] ostudnou neznalost tématu [owner.Custom('LifestyleFocusTopic')].\n\nA když dokonce #EMP já#! poznám, že [target.GetFirstNameNoTooltip] plácá nesmysly, pak je to opravdu #EMP zlé!#!"
 sway_ongoing.5009.a: "Opravdu jsem se toho hodně naučil[Select_CString(ROOT.Char.IsFemale, 'a', '')]!"
 sway_ongoing.5009.b: "Au."
 sway_ongoing.5009.c: "Neboj. Nikomu to neřeknu."
 sway_ongoing.5010.desc_success: "Po dlouhých rozhovorech s [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] o [owner.Custom('LifestyleFocusTopic')] a po všem tom studiu, kterým jsem musel[Select_CString(ROOT.Char.IsFemale, 'a', '')] maskovat svou neznalost, si uvědomuji, že už mi tohle téma zdaleka není tak cizí jako dřív!"
 sway_ongoing.5010.desc_target_discovered: "Z poslední korespondence je zřejmé, že [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] začíná vážně pochybovat o tom, co vlastně vím o [owner.Custom('LifestyleFocusTopic')].\n\nPři čtení posledního dopisu mi dochází, že má lest byla odhalena — pořád se v něm píše o „naprostém nepochopení“ a „ostudné přehlídce hlouposti“."
 sway_ongoing.5010.desc_owner_discovered: "V poslední korespondenci [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] předvedl[Select_CString(owner.IsFemale, 'a', '')] ostudnou neznalost tématu [owner.Custom('LifestyleFocusTopic')].\n\nA když dokonce #EMP já#! poznám, že [owner.GetFirstNameNoTooltip] plácá nesmysly, pak je to opravdu #EMP zlé!#!"
 sway_ongoing.5011.t: "Získávání přízně: Návštěva"
 sway_ongoing.5011.desc_opening: "Právě projíždím hlavním městem [capital.GetNameNoTooltip], odkud vládne [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], když dostanu pozvání k návštěvě místního sídla — [target.Custom('ResidenceBuilding')].\n\nKdyž dorazím,"
 sway_ongoing.5011.desc_friendly: "čeká mě přivítání s otevřenou náručí"
 sway_ongoing.5011.desc_dislike: "čeká mě zamračené přivítání"
 sway_ongoing.5011.desc_normal: "čeká mě uctivé přivítání"
 sway_ongoing.5011.desc: " a prohlídka sídla. Jedna věc mě okamžitě zaujme — všude je plno nedokončených projektů..."
 sway_ongoing.5011.a: "Chvíli se tu zdržím."
 sway_ongoing.5011.a.tt: "Možná bych mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] s něčím pomoci"
 sway_ongoing.5011.b: "Jen mi ukažte mé komnaty."
 sway_ongoing.5011.b.tt: "Hned ráno odjedu"
 sway_ongoing.5013.desc_opening: "Knihovna, kde se knihy vrší v rozích, všude nedokončené stavební práce – především celá jídelna – a uprostřed chodby jen tak stojí truhla plná zlata...\n\nSídlo, kde žije [target.GetTitledFirstName], je jeden velký nepořádek!"
 sway_ongoing.5012.a_trait: "Tu jídelnu dám hned do pořádku."
 sway_ongoing.5012.a: "Myslím, že s jídelnou dokážu pomoci."
 sway_ongoing.5012.a.tt: "[target.GetTitledFirstNameNoTooltip] zareaguje na to, co uděláš"
 sway_ongoing.5012.a_success: "Podaří se mi to"
 sway_ongoing.5012.a_failure: "Jen to ještě zhorším"
 sway_ongoing.5012.b_trait: "Jen ty knihy trochu srovnám..."
 sway_ongoing.5012.b: "Ty knihy... Ty nebohé knihy!"
 sway_ongoing.5012.b.tt: "Pokusím se dát knihovnu do pořádku"
 sway_ongoing.5012.b_success: "Všechno je srovnané a na svém místě"
 sway_ongoing.5012.b_failure: "Udělám v tom ještě větší nepořádek"
 sway_ongoing.5012.c: "Ta truhla se zlatem je #EMP opravdu#! úplně bez dozoru."
 sway_ongoing.5012.c.tt: "Na tohle bych [Select_CString(ROOT.Char.IsFemale, 'měla', 'měl')] upozornit"
 sway_ongoing.5012.c_success: "[target.GetFirstNameNoTooltip] vezme mé varování vážně"
 sway_ongoing.5012.c_failure: "[target.GetFirstNameNoTooltip] začne mít podezření, že něco chystám"
 sway_ongoing.5012.d: "Půjdu spát."
 sway_ongoing.5013.desc_expansion_success: "Stačilo tomu věnovat trochu péče – zanedlouho už je jídelna na nejlepší cestě k dokončení."
 sway_ongoing.5013.desc_expansion_failure: "Přes veškerou mou snahu vypadá jídelna nakonec ještě hůř než předtím..."
 sway_ongoing.5013.desc_library_success: "Vázané knihy, volné listiny, zdobené hřbety... Po dlouhém přesouvání a rovnání se v chaosu místní knihovny konečně začíná rýsovat jakýsi řád."
 sway_ongoing.5013.desc_library_failure: "Vázané knihy, volné listiny, zdobené hřbety... Ať se snažím sebevíc, v chaosu místní knihovny nedokážu najít žádný systém. "
 sway_ongoing.5013.desc_gold_success: "Když vysvětlím, jak nebezpečné je nechávat truhlu zlata jen tak na očích, [target.GetTitledFirstNameNoTooltip] si konečně uvědomí závažnost situace.\n\n„Ach, ovšemže tam nemůže jen tak stát! Děkuji, [ROOT.Char.GetTitledFirstNameNoTooltip].“"
 sway_ongoing.5013.desc_gold_failure: "Když se pokouším vysvětlit, jak nebezpečné je nechávat truhlu zlata jen tak na očích, [target.GetTitledFirstNameNoTooltip] se na mě podezřívavě zadívá.\n\n„A proč přesně #EMP ty#! tak bedlivě sleduješ mé zlato?“"
 sway_ongoing.5013.desc_steal_success: "„Mé zlato! Kam se podělo mé zlato?!“\n\nNa chodbě spatřím [target.GetTitledFirstName], jak zoufale stojí před prázdnou truhlou. „Ach, [ROOT.Char.GetTitledFirstNameNoTooltip], kéž bych tě [Select_CString(target.IsFemale, 'poslechla', 'poslechl')]!“"
 sway_ongoing.5013.desc_end_good: "\n\nPro pomoc jsem udělal vše, co bylo v mých silách."
 sway_ongoing.5013.desc_end_bad: "\n\nNebyla to zrovna hladká cesta, ale pro pomoc jsem udělal vše, co bylo v mých silách."
 sway_ongoing.5013.desc_good: "\n\nVypadá to dobře a pořád jsou tu další věci, s nimiž můžu pomoci."
 sway_ongoing.5013.desc_bad: "\n\nZatím to možná nevypadá nejlépe, ale pořád jsou tu další věci, s nimiž můžu pomoci!"
 sway_ongoing.5013.c: "Já už vím, jak si vynutit pozornost...!"
 sway_ongoing.5013.c.tt_intrigue: "Co kdyby se tomu zlatu něco... přihodilo?"
 sway_ongoing.5013.d: "#EMP Teď#! už je čas jít spát."
 sway_ongoing.5014.desc_opening: "Ráno u vchodu spatřím [target.GetTitledFirstName], jak čeká na můj odjezd. Když se přiblížím, zaslechnu tiché mumlání.\n\n"
 sway_ongoing.5014.desc_great: "„[ROOT.Char.GetTitledFirstNameNoTooltip] je [Select_CString(ROOT.Char.IsFemale, 'skvělá', 'skvělý')], celé sídlo vypadá jako nové...“"
 sway_ongoing.5014.desc_good: "„[ROOT.Char.GetTitledFirstNameNoTooltip] to tu opravdu [Select_CString(ROOT.Char.IsFemale, 'dala', 'dal')] do pořádku“"
 sway_ongoing.5014.desc_bad: "„[ROOT.Char.GetTitledFirstNameNoTooltip] to tu opravdu [Select_CString(ROOT.Char.IsFemale, 'zpackala', 'zpackal')]“"
 sway_ongoing.5014.desc_failed_but: "ale"
 sway_ongoing.5014.desc_failed_dot: "–"
 sway_ongoing.5014.desc_failed_three: "[ROOT.Char.GetTitledFirstNameNoTooltip] má na svědomí mou zničenou knihovnu i jídelnu #EMP a#! ještě se [Select_CString(ROOT.Char.IsFemale, 'pokusila', 'pokusil')] ukrást mé zlato...“"
 sway_ongoing.5014.desc_failed_library_gold: "[ROOT.Char.GetTitledFirstNameNoTooltip] má na svědomí mou zničenou knihovnu #EMP a#! ještě se [Select_CString(ROOT.Char.IsFemale, 'pokusila', 'pokusil')] ukrást mé zlato..."
 sway_ongoing.5014.desc_failed_expansion_library: "[ROOT.Char.GetTitledFirstNameNoTooltip] má na svědomí mou zničenou knihovnu i jídelnu...“"
 sway_ongoing.5014.desc_failed_expansion_gold: "[ROOT.Char.GetTitledFirstNameNoTooltip] má na svědomí mou zničenou jídelnu #EMP a#! ještě se [Select_CString(ROOT.Char.IsFemale, 'pokusila', 'pokusil')] ukrást mé zlato...“"
 sway_ongoing.5014.desc_failed_expansion: "[ROOT.Char.GetTitledFirstNameNoTooltip] má na svědomí mou zničenou jídelnu...“"
 sway_ongoing.5014.desc_failed_library: "[ROOT.Char.GetTitledFirstNameNoTooltip] má na svědomí mou zničenou knihovnu...“"
 sway_ongoing.5014.desc_failed_gold: "[ROOT.Char.GetTitledFirstNameNoTooltip] se [Select_CString(ROOT.Char.IsFemale, 'pokusila', 'pokusil')] ukrást mé zlato...“"
 sway_ongoing.5014.desc_ending: "\n\n„#EMP Ehm#!.“ Po krátkém rozloučení se brzy vydávám na cestu domů."
 sway_ongoing.5014.a_good: "Jsem [Select_CString(ROOT.Char.IsFemale, 'ráda', 'rád')], že jsem [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] pomoci!"
 sway_ongoing.5014.a_bad: "Asi je to tak nejlepší."
