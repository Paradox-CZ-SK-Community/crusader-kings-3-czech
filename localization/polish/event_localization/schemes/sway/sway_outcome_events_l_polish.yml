l_polish:
 sway_outcome.1001.t: "Získávání přízně: Příležitost"
 sway_outcome.1001.desc: "Při snaze získat [target.GetTitledFirstName] na svou stranu se mi naskytla příležitost. Myslím, že bych [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] tvrdit, že naše cíle jsou ve skutečnosti totožné. Když diktuji další dopis..."
 sway_outcome.1001.a: "...zdůrazním naše společné zájmy."
 sway_outcome.1001.a.success: "[target.GetFirstNameNoTooltip] se nechá přesvědčit"
 sway_outcome.1001.a.failure: "[target.GetFirstNameNoTooltip] mé úsilí prohlédne"
 sway_outcome.1001.b: "...pokusím se zůstat [Select_CString(ROOT.Char.IsFemale, 'nenápadná', 'nenápadný')]."
 sway_outcome.1002.t: "Získávání přízně: Náboženské přesvědčení"
 sway_outcome.1002.same_faith: "Při snaze získat [target.GetTitledFirstName] na svou stranu mě něco napadlo.\n\nSe správnými argumenty by se mi možná podařilo přesvědčit, že nejednám jen ve vlastním zájmu, ale i podle toho, co žádá [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 sway_outcome.1002.other_faith: "Při snaze získat [target.GetTitledFirstName] na svou stranu mě něco napadlo.\n\nMožná bych [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] tvrdit, že podpořit mě je v zájmu všech [target.GetFaith.GetAdherentNamePlural], spíše než podporovat jiného [ROOT.Char.GetFaith.GetAdjective] vládce?"
 sway_outcome.1002.a: "Myslím, že dokážu předložit velmi přesvědčivé argumenty."
 sway_outcome.1002.b: "Možná bych se [Select_CString(ROOT.Char.IsFemale, 'měla', 'měl')] držet diplomatických zdvořilostí."
 sway_outcome.1003.t: "Získávání přízně: Pokoušení štěstěny"
 sway_outcome.1003.desc: "Dočtu poslední dopis od [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] a usměji se – zdá se, že ledy mezi námi konečně tají.\n\nJe to úspěch, ale láká mě využít této příležitosti a pokusit se sblížit ještě víc..."
 sway_outcome.1003.a: "Je čas prověřit mé diplomatické schopnosti!"
 sway_outcome.1003.a.success: "[target.GetFirstNameNoTooltip] mé úsilí ocení"
 sway_outcome.1003.a.failure: "[target.GetFirstNameNoTooltip] se cítí uraženě"
 sway_outcome.1003.a_friend: "Tohle přenechám [friend.GetFirstNameNoTooltip]."
 sway_outcome.1003.b: "Tohle vítězství mi stačí."
 sway_outcome.2001.t: "Získávání přízně: Nedorozumění"
 sway_outcome.2001.opening: "Zdá se, že mé diplomatické snahy vůči [target.GetTitledFirstName] vedly k pořádnému nedorozumění! Přišel mi dopis, z něhož je naprosto jasné, že mé záměry byly pochopeny úplně jinak..."
 sway_outcome.2001.not_interested_relation: "\n\n„Vždyť jsem ti [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('target'))]! [target.GetFaith.HighGodNameAlternate] nás chraň!“"
 sway_outcome.2001.not_interested_romantically: "\n\n„Tvé city mi sice lichotí, ale od někoho tvého postavení jsou krajně nevhodné.“"
 sway_outcome.2001.not_interested_horses: "\n\n„Své čistokrevné koně ti neprodám, ať mi pošleš sebevíc lichotivých dopisů!“"
 sway_outcome.2001.not_interested_toll_exemptions: "\n\n„Osvobození od mýtného ti udělit nemohu, ať slibuješ sebevětší obchod!“"
 sway_outcome.2001.not_interested_friend: "\n\n„Zní to, jako bys ve skutečnosti [Select_CString(ROOT.Char.IsFemale, 'potřebovala', 'potřeboval')] přítele, ale obávám se, že já jím být nemohu. Mohu ti však doporučit, abys—“"
 sway_outcome.2001.not_interested_relics: "\n\n„Žádnou ze svých relikvií ti nedám, i kdybys za mě [Select_CString(ROOT.Char.IsFemale, 'prosila', 'prosil')] sebevíc!“"
 sway_outcome.2001.end: "\n\nNemusím číst dál, abych [Select_CString(ROOT.Char.IsFemale, 'pochopila', 'pochopil')], oč jde."
 sway_outcome.2001.a: "Tohle je jedno velké nedorozumění!"
 sway_outcome.2002.t: "Získávání přízně: Nekalé úklady"
 sway_outcome.2002.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! [target.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] s vámi [Select_CString(target.IsFemale, 'přerušila', 'přerušil')] veškerý styk.“\n\nZdá se, že můj náhlý zájem a množství dopisů vzbudily podezření na nekalé úmysly. [target.GetFirstNameNoTooltip] si zřejmě myslí, že proti [Select_CString(target.IsFemale, 'ní', 'němu')] něco chystám!"
 sway_outcome.2002.a: "Jen jsem se [Select_CString(ROOT.Char.IsFemale, 'snažila', 'snažil')] udělat dobrý dojem..."
