l_polish:
 bastardy_pregnancy_announcement_tooltip: "Svět se dozví pravdu o původu dítěte"
 secret_bastard.0001.t: "Nejasný původ"
 secret_bastard.0001.real_father: "[mother.GetTitledFirstNamePossessive] dvůr oslavuje narození dítěte a zjevně netuší pravdu. Dítě odpočívající v matčině náručí není ve skutečnosti [assumed_father.GetTitledFirstNamePossessive], ale moje!"
 secret_bastard.0001.real_father.no_assumed_father: "Po narození dítěte se na [mother.GetTitledFirstNamePossessive] dvoře za slavnostní fasádou šíří zvěsti. Kdyby jen věděli, že dítě odpočívající v matčině náručí je ve skutečnosti moje..."
 secret_bastard.0001.real_father.multiple: "[mother.GetTitledFirstNamePossessive] dvůr oslavuje narození dětí a zjevně netuší pravdu. Děti odpočívající v matčině náručí nejsou ve skutečnosti [assumed_father.GetTitledFirstNamePossessive], ale moje!"
 secret_bastard.0001.real_father.no_assumed_father.multiple: "Po narození dětí se na [mother.GetTitledFirstNamePossessive] dvoře za slavnostní fasádou šíří zvěsti. Kdyby jen věděli, že děti odpočívající v matčině náručí jsou moje..."
 secret_bastard.0001.assumed_father: "[mother.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', mother)]) tiskne novorozené dítě k hrudi. Nebýt pravdy, kterou znám, byl by to okamžik radosti.\n\nNení to moje dítě, které tak něžně svírá. Jeho skutečným otcem je [real_father.GetTitledFirstName]!"
 secret_bastard.0001.assumed_father.multiple: "[mother.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', mother)]) tiskne novorozené děti k hrudi. Nebýt pravdy, kterou znám, byl by to okamžik radosti.\n\nNejsou to moje děti, které tak něžně svírá. Jejich skutečným otcem je [real_father.GetTitledFirstName]!"
 secret_bastard.0001.family_of_mother: "[mother.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', mother)]) chová v náručí nádherné novorozeně. Nemohu se však ubránit neklidu, protože znám skutečný původ dítěte. Její [child.Custom('GetDaughterSon')] nepochází z manželství s [assumed_father.GetTitledFirstName], nýbrž z tajného poměru s [real_father.GetTitledFirstName]!\n\nCo pro mě znamenají? [ROOT.Char.Custom2('RelationToMe', mother)] a [ROOT.Char.Custom2('RelationToMe', child)]. Co s nimi bude, pokud pravda vyjde najevo?"
 secret_bastard.0001.family_of_mother.multiple: "[mother.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', mother)]) chová v náručí nádherné novorozené děti. Nemohu se však ubránit neklidu, protože znám jejich skutečný původ. Děti nepocházejí z manželství s [assumed_father.GetTitledFirstName], nýbrž z tajného poměru s [real_father.GetTitledFirstName]!\n\nCo pro mě znamená jejich matka? [ROOT.Char.Custom2('RelationToMe', mother)]. Co s ní a dětmi bude, pokud pravda vyjde najevo?"
 secret_bastard.0001.family_of_real_father: "[mother.GetTitledFirstName] a její dvůr slaví narození [assumed_father.GetTitledFirstNamePossessive] dítěte, ale kdyby vyšla najevo pravda, oslavy by nejspíš ztichly.\n\nDítě, které [mother.GetFirstName] tiskne k hrudi, je ve skutečnosti nemanželské a jeho otcem je [real_father.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))])!"
 secret_bastard.0001.family_of_real_father.multiple: "[mother.GetTitledFirstName] a její dvůr slaví narození [assumed_father.GetTitledFirstNamePossessive] dětí, ale kdyby vyšla najevo pravda, oslavy by nejspíš ztichly.\n\nDěti, které [mother.GetFirstName] tiskne k hrudi, jsou ve skutečnosti nemanželské a jejich otcem je [real_father.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))])!"
 secret_bastard.0001.family_of_assumed_father: "Dvůr [father.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('assumed_father'))]) spolu s [mother.GetTitledFirstName] ([SCOPE.Char.Custom2('RelationToMe', mother)]) slaví narození jejich nového dítěte. Kdyby byla pravda všeobecně známá, nálada by však nejspíš pohasla. \n\n[mother.GetFirstNamePossessive] dítě je ve skutečnosti nemanželské a jeho otcem je [real_father.GetTitledFirstName]! Jakou hanbu by to přineslo našemu rodu, kdyby vyšel najevo skutečný původ dítěte..."
 secret_bastard.0001.family_of_assumed_father.multiple: "Dvůr [father.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('assumed_father'))]) spolu s [mother.GetTitledFirstName] ([SCOPE.Char.Custom2('RelationToMe', mother)]) slaví narození jejich nových dětí. Kdyby byla pravda všeobecně známá, nálada by však nejspíš pohasla. \n\n[mother.GetFirstNamePossessive] děti jsou ve skutečnosti nemanželské a jejich otcem je [real_father.GetTitledFirstName]! Jakou hanbu by to přineslo našemu rodu, kdyby vyšel najevo skutečný původ dětí..."
 secret_bastard.0001.other: "[mother.GetTitledFirstNamePossessive] novorozené dítě právě vítají oslavami, ale nálada by byla docela jiná, kdyby dvůr znal pravdu.\n\nDítě v matčině náručí nevzešlo z manželství s [assumed_father.GetTitledFirstName]. Jeho skutečným otcem je [real_father.GetTitledFirstName]!"
 secret_bastard.0001.other.multiple: "[mother.GetTitledFirstNamePossessive] novorozené děti právě vítají oslavami, ale nálada by byla docela jiná, kdyby dvůr znal pravdu.\n\nDěti v matčině náručí nevzešly z manželství s [assumed_father.GetTitledFirstName]. Jejich skutečným otcem je [real_father.GetTitledFirstName]!"
 secret_bastard.0001.a: "Kdyby tak věděli..."
 secret_bastard.0002.t: "Nejistého původu"
 secret_bastard.0002.real_father: "[mother.GetTitledFirstName] nese břímě toho, že porodila nemanželské dítě, k jehož otcovství se nikdo nehlásí.\n\n[mother.GetWomanMan] není vdaná a její dítě nemá přiznaného otce. Je to hrozné, přesto nesmím dopustit, aby vyšlo najevo, že skutečným otcem jsem já.\n\nAch, [child.Custom('GetDaughterSon')]... Co s tebou bude?"
 secret_bastard.0002.family_of_mother: "[mother.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', mother)]) porodila dítě, které ponese cejch levobočství a bude vyrůstat bez přiznaného otce.\n\nNa naši rodinu to vrhá hanbu, ale [real_father.GetTitledFirstName] se zatím odmítá přihlásit k otcovství. [mother.GetFirstNamePossessive] novorozeně tak zůstává bez přiznaného otce, pokud o něm vůbec ví..."
 secret_bastard.0002.family_of_real_father: "[mother.GetTitledFirstNamePossessive] novorozené dítě je všeobecně považováno za nemanželské dítě bez přiznaného otce, ale já znám pravdu. Otcem dítěte, které teď spočívá v matčině náručí, je [real_father.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))])! Mohu se jen modlit, aby [real_father.GetFirstName] věděl, co dělá."
 secret_bastard.0002.family_of_real_father.dislike: "Velké naděje si nedělám."
 secret_bastard.0002.other: "Šíří se zvěsti a šeptem padají obvinění, kdo by mohl být otcem [mother.GetTitledFirstNamePossessive] novorozeného nemanželského dítěte.\n\nNetuší ovšem to, co vím já. Skutečným otcem dítěte je [real_father.GetTitledFirstName]!"
 secret_bastard.0002.a: "Skandál na spadnutí."
 secret_bastard.0002.b: "„Počkejte! To dítě... je moje!“"
 secret_bastard.0010.t: "Odhaleno"
 secret_bastard.0010.spouse_reveal: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('father'))] odhalil skutečný původ mého dítěte a teď pravdu vyzradil celému světu!"
 secret_bastard.0010.other_reveal: "Mé pečlivě střežené tajemství je venku. Za jeho odhalením stojí [secret_exposer.GetTitledFirstName]! Moje rodina se mnou skoro nemluví a [father.GetFirstName] se mi odmítá podívat do očí."
 secret_bastard.0010.desc: "\n\nCo teď bude se mnou a mým dítětem, když všichni vědí, že skutečným otcem je [real_father.GetTitledFirstName]?"
 secret_bastard.0010.a: "Bojím se o naši budoucnost!"
 secret_bastard.001.opening: "[mother.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mother'))]) už nějakou dobu jeví známky těhotenství,"
 secret_bastard.0011.t: "Poskvrna levobočství"
 secret_bastard.0011.spouse_exposer: "a nastal čas, aby se svět dozvěděl pravdu. [mother.GetTitledFirstName] sdílela lože s [real_father.GetTitledFirstName] a on je skutečným otcem!"
 secret_bastard.0011.desc: "a nikdy mě doopravdy nenapadlo, že by dítě mohlo patřit někomu jinému než mně.\n\nTeď však veřejně přiznala celému světu, že sdílela lože s [real_father.GetTitledFirstName] a že právě on je skutečným otcem!"
 secret_bastard.0011.a: "Jak mi to mohla udělat?"
 secret_bastard.0011.b: "A přitom mi kdysi přísahala věrnost."
 secret_bastard.0012.t: "Skandál"
 secret_bastard.0012.dislike_desc: "a všichni se domnívali, že [father.GetTitledFirstName], její [mother.Custom2('RelationToMe', SCOPE.sC('father'))], je otcem dítěte. Teď však vyšlo najevo, že skutečným otcem nenarozeného dítěte není nikdo jiný než [real_father.GetTitledFirstName]!\n\nAch běda, to je ale skandál!"
 secret_bastard.0012.like_desc: "a všichni se domnívali, že [father.GetTitledFirstName], její [mother.Custom2('RelationToMe', SCOPE.sC('father'))], je otcem dítěte. Teď však vyšlo najevo, že skutečným otcem nenarozeného dítěte není nikdo jiný než [real_father.GetTitledFirstName]!\n\nKéž by to jen mohlo zůstat tajemstvím!"
 secret_bastard.0012.a: "Teď už to vědí všichni."
 secret_bastard.0013.t: "Tohle moje dítě"
 secret_bastard.0013.desc: "Z mých pletek s [mother.GetTitledFirstName] vzešlo dítě!"
 secret_bastard.0013.secret_exposer: "Bylo načase dát to všem na vědomí. Dítě, které [mother.GetTitledFirstName] nosí, je moje!\n\nTeď už to vědí všichni."
 secret_bastard.0013.suspicious_desc: "a mé podezření, že jsem otcem dítěte, sílilo spolu s jejím rostoucím břichem.\n\nTeď už to vím jistě a se mnou i celé panství. Dítě je moje!"
 secret_bastard.0013.a: "Takhle je to určitě lepší."
 secret_bastard.0014.t: "Známky zrady"
 secret_bastard.0014.desc: "ale nikdy mě nenapadlo, že by s tím mohl mít něco společného můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))], [real_father.GetFirstName]. Teď je však jasné, že skutečným otcem [mother.GetFirstNamePossessive] nenarozeného dítěte je [real_father.GetFirstName]!"
 secret_bastard.0014.a: "Jak jsi to mohl udělat, [real_father.GetFirstNameNoTooltip]?"
 secret_bastard.1000.t: "Známý původ"
 secret_bastard.1000.desc: "Konec tajností a snah zakrývat pravdu!\n\nVešlo ve všeobecnou známost, že otcem dítěte, které nosím pod srdcem, není nikdo jiný než [real_father.Custom2('MyCharacterIntroductionNoComma' , ROOT.Char)]."
 secret_bastard.1000.real_father_reveal: "Konec tajností a snah zakrývat pravdu!\n\n[real_father.Custom2('MyCharacterIntroduction' , ROOT.Char)|U] dal všem na vědomí, že je otcem mého nenarozeného dítěte."
 secret_bastard.1000.a: "Teď je pravda venku."
 secret_bastard.1000.a.tt: "[real_father.GetShortUINameNoTooltip] bude po narození znám jako otec mého dítěte"
 secret_bastard.1001.t: "Původ vnoučete"
 secret_bastard.1001.desc: "Není žádným tajemstvím, že [mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)], čeká dítě počaté v hříšném svazku. Koneckonců není vdaná.\n\nPřesto zjistit, že [real_father.GetTitledFirstName] je [real_father.GetMotherFather] dítěte..."
 secret_bastard.1001.a: "[mother.GetTitledFirstNameNoTooltip] se kvůli němu ocitla v takové situaci. Jak to mohl dopustit?"
 secret_bastard.1002.t: "Mimo manželství"
 secret_bastard.1002.desc: "Není žádným tajemstvím, že [mother.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', mother)], čeká dítě počaté v hříšném svazku. Koneckonců není vdaná.\n\nAž dosud však bylo záhadou, kdo je [real_father.GetMotherFather] dítěte – teď je jasné, že za tím stojí [real_father.GetTitledFirstName]!"
 secret_bastard.1003.t: "[mother.GetFirstNameNoTooltip] a já"
 secret_bastard.1003.desc: "To, že [mother.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMe' , mother)], čeká moje dítě, je teď všeobecně známo.\n\nVěděl jsem, že naše pletky mohou vést až k tomuhle, ale skutečnost je přece jen něco jiného..."
 secret_bastard.1004.desc: "[mother.GetTitledFirstName] už nějakou dobu nosí dítě neznámého původu, ale nikdy mě nenapadlo, že by s tím mohl mít něco společného [real_father.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('real_father'))].\n\nBohužel už není nejmenších pochyb, že skutečným otcem je právě [real_father.GetTitledFirstName]!"
 secret_bastard.2000.t: "Už se to ví"
 secret_bastard.2000.desc_opening: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'odhalila','odhalil')] mé tajemství celému světu!"
 secret_bastard.2000.desc_opening.me: "Konečně nadešel čas, aby se to dozvěděl celý svět."
 secret_bastard.2000.desc: "\n\n[child.GetTitledFirstName] je [Select_CString(child.IsFemale,'má','můj')] [child.Custom('GetDaughterSon')] a skutečný původ dítěte držím v tajnosti už od doby před narozením. Teď je však můj poměr s [real_father.GetTitledFirstName], skutečným otcem dítěte, všeobecně známý!"
 secret_bastard.2000.a: "[Select_CString(child.IsFemale,'Má','Můj')] [child.Custom('GetDaughterSon')] [child.GetTitledFirstName]... Co s dítětem bude?"
 secret_bastard.2001.t: "Pravda"
 secret_bastard.2001.desc_opening.me: "Mé důkazy ukazují, že"
 secret_bastard.2001.desc: "[child.GetFirstName] není moje legitimní dítě."
 secret_bastard.2001.father: "Ve skutečnosti je skutečným otcem dítěte [real_father.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 secret_bastard.2001.change_lineage_lowborn.twin: "\n\nJe škoda, že to muselo dojít až sem, ale svět se musí dozvědět, že obě děti jsou nemanželského a neurozeného původu."
 secret_bastard.2001.change_lineage_lowborn: "\n\nJe škoda, že to muselo dojít až sem, ale svět se musí dozvědět, že [child.GetFirstName] je nemanželského a neurozeného původu."
 secret_bastard.2001.change_lineage.twin: "\n\nJe škoda, že to muselo dojít až sem, ale svět se musí dozvědět, že obě děti jsou nemanželskými potomky rodu [child.GetHouse.GetBaseName]."
 secret_bastard.2001.change_lineage: "\n\nJe škoda, že to muselo dojít až sem, ale svět se musí dozvědět, že [child.GetFirstName] je nemanželským potomkem rodu [child.GetHouse.GetBaseName]."
 secret_bastard.2001.keep_lineage.twin: "\n\nAčkoli pravdu nelze zjistit, jejich původ navždy zůstane zahalen zvěstmi a nejistotou."
 secret_bastard.2001.keep_lineage: "\n\nAčkoli pravdu nelze zjistit, původ [child.GetFirstName] navždy zůstane zahalen zvěstmi a nejistotou."
 secret_bastard.2001.a: "Takhle je to lepší."
 secret_bastard.2001.b: "Pravda musí vyjít najevo."
 secret_bastard.2002.t: "Odhalené tajemství"
 secret_bastard.2002.i_am_exposer: "Dal jsem na vědomí, že [child.GetTitledFirstName] je ve skutečnosti moje dítě! Tím jsem zároveň přiznal své pletky s [mother.GetTitledFirstName], ale pravda musí být známa."
 secret_bastard.2002.other_exposer: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'odhalila','odhalil')], že [child.GetTitledFirstName] je moje dítě! Teď už všichni vědí i o mých pletkách s [mother.GetTitledFirstName]!"
 secret_bastard.2002.known: "\n\nDůsledky pro [child.GetFirstNameNoTooltip] mohou být hrozivé. Život s nejistým původem není nic snadného."
 secret_bastard.2002.not_known: "\n\nSamozřejmě jsem věděl, že z mých pletek mohou vzejít děti, ale netušil jsem... Jak mi to mohla tak dlouho tajit?!"
 secret_bastard.2002.assumed_father_exists: "\n\nVždy se najdou tací, kteří budou [child.GetFirstName] považovat za legitimní dítě [father.GetTitledFirstName], ale stín pochybností už nikdo nerozptýlí."
 secret_bastard.2002.a: "Tajemství je venku!"
 secret_bastard.2002.b: "Ach, [child.GetFirstNameNoTooltip]..."
 secret_bastard.2003.t: "Temné tajemství"
 secret_bastard.2003.i_exposed: "Konečně nastal čas, aby pravda vyšla najevo."
 secret_bastard.2003.other_exposer: "Tajemství, které jsem tak dlouho [Select_CString(ROOT.Char.IsFemale,'nosila','nosil')] v sobě, teď vyšlo najevo. Odhalení má na svědomí [secret_exposer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 secret_bastard.2003.known: "Konečně se všeobecně ví, že mým skutečným otcem je [real_father.GetTitledFirstName], a nikoli [father.GetTitledFirstName], jak se [mother.Custom('MotherFather')] snaží všem namluvit."
 secret_bastard.2003.not_known: "[Select_CString(ROOT.Char.IsFemale,'Já jsem bastardka?!','Já jsem bastard?!')] [father.GetTitledFirstName], [father.GetWomanMan], kterého jsem celý život [Select_CString(ROOT.Char.IsFemale,'považovala','považoval')] za svého otce, se mnou nemá vůbec žádný pokrevní vztah! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi [Select_CString(secret_exposer.IsFemale,'odhalila','odhalil')], že můj skutečný [father.Custom('MotherFather')] je údajně [real_father.GetTitledFirstName], a [mother.Custom('MotherFather')] [mother.GetTitledFirstName] mi o tom nikdy ani [Select_CString(mother.IsFemale,'neřekla','neřekl')]."
 secret_bastard.2003.desc_ending_exposer: "\n\nNemohu uvěřit, že můj ote– že [father.GetTitledFirstName] tohle tajemství všem vyzradil!"
 secret_bastard.2003.desc_ending_known: "\n\nMůj život už nikdy nebude jako dřív!"
 secret_bastard.2003.desc_ending_not_known: "\n\n[Select_CString(mother.IsFemale,'Jak mi mohla','Jak mi mohl')] [mother.Custom('MotherFather')] něco takového udělat!"
 secret_bastard.2003.a: "To je pohroma!"
 secret_bastard.2004.t: "Nejasný původ"
 secret_bastard.2004.likes: "[Select_CString(ROOT.Char.IsFemale,'Věděla jsem','Věděl jsem')], že [child.GetTitledFirstName] je nemanželským dítětem [mother.GetTitledFirstName] a [real_father.GetTitledFirstName], ale teď už to ví i všichni ostatní!\n\nJe těžké uvěřit, že [child.GetTitledFirstName] vzešlo z tak hanebného svazku. Mohu jen doufat, že odhalení pravdy [child.GetFirstName] prospěje."
 secret_bastard.2004.dislikes: "Pravda je konečně venku!\n\nCelý dvůr si šeptá o tom, že [child.GetTitledFirstName] vzešlo z hříšného svazku mezi [real_father.GetTitledFirstName] a [mother.GetTitledFirstName].\n\nChování [child.GetFirstName] se nikdy nehodilo k legitimnímu dítěti a teď se konečně dostane zacházení odpovídajícího skutečnému postavení."
 secret_bastard.2004.a: "Chudák [child.GetTitledFirstNameNoTooltip]!"
 secret_bastard.2004.b: "Jen si představ tu hanbu, kterou musí [child.GetFirstNameNoTooltip] cítit!"
 secret_bastard.2004.c: "Chudáci [child.GetFirstNameNoTooltip] a [child_twin.GetFirstNameNoTooltip]!"
 secret_bastard.2004.d: "Jen si představ tu hanbu, kterou musí oba cítit!"
 secret_bastard.2005.t: "Odhalené tajemství"
 secret_bastard.2005.alive: "[child.GetTitledFirstName] je nemanželským dítětem [mother.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', mother)]) a [real_father.GetTitledFirstName]!\n\nPomyslet, že [mother.GetTitledFirstName] tak hanebně zradila [father.GetTitledFirstName] a za jeho zády cizoložila."
 secret_bastard.2005.dead: "[child.GetTitledFirstName] je nemanželským dítětem [mother.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', mother)]) a [real_father.GetTitledFirstName]!\n\nPomyslet, že zesnulý [father.GetTitledFirstName] byl [mother.GetTitledFirstName] tak podlým způsobem oklamán."
 secret_bastard.2005.end: "\n\nJak si má [mother.GetTitledFirstName] ještě někdy získat mou důvěru?"
 secret_bastard.2005.a: "Je nevěrná!"
 secret_bastard.3000.t: "Odhalené tajemství"
 secret_bastard.3000.married_known: "„Ty máš bastarda?!“\nMá žena mě konfrontovala s šokující skutečností a já pro ni neměl žádnou dobrou odpověď.\n\nUž jsem věděl, že [child.GetTitledFirstName] je dítětem z mých pletek s [mother.GetTitledFirstName], ale zaskočilo mě, že je teď jeho skutečný původ všeobecně známý. Co mám dělat?"
 secret_bastard.3000.married_not_known: "„Ty máš bastarda?!“\nMá žena mě konfrontovala s šokující skutečností a já pro ni neměl žádnou dobrou odpověď.\n\nJsem překvapený stejně jako všichni ostatní, i když jsem samozřejmě věděl, že se něco takového může stát. Ale že mi [mother.GetTitledFirstName] o skutečném původu [child.GetTitledFirstName] nic neřekla... Co mám dělat?"
 secret_bastard.3000.known: "Tajemství, že [child.GetTitledFirstName] je moje dítě, má najednou na rtech každý!\n\nUž jsem věděl, že [child.GetFirstNameNoTooltip] je dítětem z mých pletek s [mother.GetTitledFirstName], ale důsledky mohou být hrozivé. Život nemanželského dítěte není nic snadného."
 secret_bastard.3000.not_known: "Tajemství, že [child.GetTitledFirstName] je moje dítě, má najednou na rtech každý!\n\nJsem překvapený stejně jako všichni ostatní, i když jsem samozřejmě věděl, že se něco takového může stát. Ale že mi to předtím neřekla..."
 secret_bastard.3000.a: "Teď už to vědí všichni!"
 secret_bastard.3000.b: "To je pohroma!"
 secret_bastard.3001.t: "Můj skutečný původ"
 secret_bastard.3001.incest_marriage: "[real_father.GetTitledFirstName] je můj [real_father.Custom('MotherFather')]!\n\nPoznat pravdu je obrovská úleva, ale přináší to... komplikace. [Select_CString(incest_spouse.IsFemale,'Má','Můj')] [incest_spouse.Custom('WifeHusband')], [incest_spouse.GetTitledFirstName], je jeho [real_father.Custom2('RelationToMe', SCOPE.sC('incest_spouse'))] – což znamená, že je zároveň [Select_CString(incest_spouse.IsFemale,'má','můj')] [incest_spouse.Custom('SisterBrother')]!"
 secret_bastard.3001.known: "Skutečnost, že jsem se [Select_CString(ROOT.Char.IsFemale,'narodila','narodil')] mimo manželství, mě pronásleduje celý život. Vědět, že [real_father.GetTitledFirstName] je můj otec, a přitom o tom nikdy nemluvit, bylo těžké břímě.\n\nTeď, když je tajemství venku, se mi konečně ulevilo!"
 secret_bastard.3001.not_known: "Skutečnost, že jsem se [Select_CString(ROOT.Char.IsFemale,'narodila','narodil')] mimo manželství, mě pronásleduje od narození. [Select_CString(ROOT.Char.IsFemale,'Byla jsem odstrkována a zesměšňována','Byl jsem odstrkován a zesměšňován')], ale matka mi odmítala prozradit můj skutečný původ, ať jsem ji [Select_CString(ROOT.Char.IsFemale,'prosila','prosil')] sebevíc.\n\n„O takových věcech je nejlepší nikdy nemluvit.“\n\nTeď, když znám pravdu, se mi konečně lépe dýchá. Vědomí, že [real_father.GetTitledFirstName] je můj otec, mi přináší klid, který mi tak dlouho unikal."
 secret_bastard.3001.a: "Teď už je pravda známa!"
 secret_bastard.3001.b: "Konečně vím, kdo je můj otec!"
