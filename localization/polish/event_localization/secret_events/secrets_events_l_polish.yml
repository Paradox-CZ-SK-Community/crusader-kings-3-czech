 secrets_secondary_character_my_character_introduction: "[secondary_character.Custom2('MyCharacterIntroductionNoComma', event_root)]"
 secrets_secondary_character_primary_characters_introduction: "[secondary_character.Custom2('HerHisCharacterIntroductionNoComma', primary_character)]"
 secrets.0001.t: "Mé tajemství je venku!"
 secrets.0001.desc: "Mé tajemství zná celý svět a za jeho odhalením stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\nMé nepřirozené choutky a neovladatelné touhy jsou teď všeobecně známé a nikdo o nich nepochybuje!"
 secrets.0001.a: "Jak mám s touhle hanbou vůbec žít?"
 secrets.0101.negative.desc: "[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] čelí obvinění ze sexuální zvrácenosti, za kterým stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]! Vylíčené podrobnosti jsou šokujícím způsobem odporné!"
 secrets.0101.positive_1.desc: "[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] čelí veřejnému obvinění ze sexuální zvrácenosti, za kterým stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 secrets.0101.worried.desc: "\n\nMusím držet své choutky na uzdě, aby mě neovládly. Kdo ví, na koho ukážou prstem příště..."
 secrets.0101.positive_2.desc: "\n\nNechápu, proč se kolem toho dělá takový povyk. Jako by snad žádostivost byla nějaká nepřirozená choroba..."
 secrets.0101.b: "[owner.GetFirstNameNoTooltip] bude za své zločiny pykat. Stráže!"
 secrets.0003.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě veřejně odsuzuje za mé choutky! Podle obvinění mě přitahují [Select_CString(ROOT.Char.IsFemale,'jiné ženy','jiní muži')] a uléhám s nimi. Ať tvrdím, že jde o nedorozumění, [ROOT.Char.Custom('DefaultPriestTitlePlural')] mě označují za hříšníka. Podle nich [ROOT.Char.GetFaith.HighGodName] takové jednání neschvaluje."
 secrets.0003.a: "Kdyby jen byla příležitost to vysvětlit, já... já..."
 secrets.0103.negative.desc: "[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] čelí obvinění z tělesných styků, za kterým stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]! Podle obvinění jsou [owner.GetWomenMen] těmi, s nimiž má [owner.GetTitledFirstNameNoTooltip] tělesné styky! Tohle přece není cesta, kterou nám ukazuje [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 secrets.0103.positive_1.desc: "[owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] čelí veřejnému obvinění ze sodomie, za kterým stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 secrets.0103.positive_2.desc: "\n\nSoudě podle odporných urážek [secret_exposer.GetTitledFirstNamePossessiveNoTooltip] mají být [owner.GetTitledFirstNameNoTooltip] a [ROOT.Char.GetFaith.DevilName] snad jedno a totéž. Jak ale může být láska špatná?"
 secrets.0103.worried_2.desc: "\n\nKdyž jsem s [lover.GetFirstName], musím si dávat pozor, kvůli nám oběma. Kdo ví, na koho ukážou prstem příště..."
 secrets.0103.worried_3.desc: "Budeme někdy moci milovat svobodně a beze strachu?"
 secrets.0103.dislikes_negative: "[ROOT.Char.GetFaith.HighGodName] tě bude soudit!"
 secrets.0103.b: "Stráže! Spoutejte [Select_CString(owner.IsFemale,'tu ženu','toho muže')]!"
 secrets.0004.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mě veřejně odsuzuje jako zrůdu, která si libuje v chuti lidského masa! Přitom zjevně vůbec nechápe, o čem mluví, ale všichni ty zvěsti podle všeho považují za pravdivé."
 secrets.0004.a: "Má pověst je v troskách!"
 secrets.0104.negative.desc: "Při pomyšlení na ta obvinění se mi zvedá žaludek. Za nimi stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]. [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U], kanibal! Nemohu ty odporné výjevy dostat z hlavy..."
 secrets.0104.positive_1.desc: "Veřejně zaznělo obvinění, že [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] je kanibal! Za obviněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 secrets.0104.worried.desc: "Musím si dávat pozor. Pokud neudržím svůj hlad na uzdě, příště mohou přijít na mě..."
 secrets.0104.positive_2.desc: "Copak nechápe, jakou radost má [ROOT.Char.GetFaith.HighGodName] z našich hostin?"
 secrets.0104.dislikes_negative: "Je mi z tebe špatně, [owner.GetFirstNameNoTooltip]!"
 secrets.0104.b: "Tahle zrůda za své zločiny zaplatí. Stráže!"
 secrets.0005.desc: "Mé pochybnosti o tom, zda [ROOT.Char.GetFaith.HighGodName] skutečně existuje, jsou teď všem známé. Za jejich zveřejněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]. [ROOT.Char.Custom('DefaultPriestTitlePlural')] mě kvůli nim považují za člověka bez víry a mé pochybnosti za zradu všeho, co hlásá [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 secrets.0005.a: "Co je tak špatného na tom myslet vlastní hlavou?!"
 secrets.0105.negative.desc: "Veřejně zaznělo obvinění, že [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] nevěří! Za obviněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]. Takové pochybnosti jsou zradou všeho, co hlásá [owner.GetFaith.HighGodName]! Jakým právem [owner.GetTitledFirstName] zpochybňuje to, co hlásá [owner.GetFaith.HighGodNameAlternate]?"
 secrets.0105.positive_1.desc: "Veřejně zaznělo obvinění, že [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] nevěří! Za obviněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 secrets.0105.positive_2.desc: "To, jak nerozumně se [secret_exposer.GetFirstNameNoTooltip] chová, je trapné. Komu vlastně [owner.GetFirstNameNoTooltip] škodí?"
 secrets.0105.worried.desc: "Odteď musím pečlivě vážit každé slovo, jinak mohu být další na řadě..."
 secrets.0105.dislikes_negative: "Copak [owner.GetFirstNameNoTooltip] nemá žádnou hanbu?!"
 secrets.0105.likes_positive: "Co je tak špatného na tom myslet vlastní hlavou?"
 secrets.0006.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'rozšířila','rozšířil')] odporné zvěsti o tělesném vztahu mezi mnou a nejmenovaným příbuzným! Lidé těm pomluvám navíc až příliš ochotně věří!"
 secrets.0006.a: "Kdo jsou, aby určovali, co je pravá láska?!"
 secrets.0106.t: "Odhalené tajemství!"
 secrets.0106.negative.desc: "[ROOT.Char.GetFaith.HighGodName]! Do celého panství se dostaly nezvratné důkazy, že [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] se oddává incestním zvrácenostem! Za jejich zveřejněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 secrets.0106.positive_1.desc: "Veřejně zaznělo obvinění, že [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] udržuje incestní vztahy! Za obviněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 secrets.0106.worried.desc: "\n\nJe nad slunce jasné, že [owner.GetTitledFirstNameNoTooltip] trpí, přesto musím svou útěchu skrývat. Přísahám, že mě jejich pohledy sledují, kamkoli jdu..."
 secrets.0106.positive_2.desc: "Není snad láska mezi příbuznými stejně přirozená jako dýchání?"
 secrets.0106.likes_negative: "Nikdy... Nikdy by mě to nenapadlo!"
 secrets.0106.dislikes_negative: "Odporné! Naprosto odporné!"
 secrets.0106.likes_positive: "Tohle pronásledování není správné!"
 secrets.0106.dislikes_positive: "Copak nemáme nic důležitějšího na práci?"
 secrets.0007.desc: "Mé praktiky byly veřejně odsouzeny jako bezbožné a neodpustitelné! Za obviněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]. Lidé mě teď označují za [Select_CString(ROOT.Char.IsFemale,'čarodějnici','čaroděje')] a za nepřítele všeho, co hlásá [ROOT.Char.GetFaith.HighGodName]!"
 secrets.0007.a: "Copak nevidí pravdu, kterou vidím já?"
 secrets.0107.negative.desc: "Veřejně zaznělo obvinění, že [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] provozuje čarodějnictví! Za obviněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]. [owner.GetWomanMan|U] a [ROOT.Char.GetFaith.DevilName] prý tvoří spojenectví, jehož cílem je otrávit naši mysl a přimět nás odmítnout to, co hlásá [ROOT.Char.GetFaith.HighGodName]!"
 secrets.0107.positive_1.desc: "Veřejně zaznělo obvinění, že [owner.Custom2('MyCharacterIntroduction', ROOT.Char)] provozuje čarodějnictví! Za obviněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 secrets.0107.positive_2.desc: "[secret_exposer.GetWomanMan|U] bez špetky rozumu pořád mele cosi o „[secret_exposer.GetFaith.DevilName]“. Copak není zřejmá moudrost, kterou má [owner.GetTitledFirstNameNoTooltip]?"
 secrets.0107.worried.desc: "\n\nChci se ozvat a ukázat všem pravdu, ale naslouchali by mi vůbec? Kdybych to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')], bojím se, že příště se obrátí proti mně..."
 secrets.0107.dislikes_negative: "[Select_CString(owner.IsFemale,'Upalte čarodějnici!','Upalte čaroděje!')]"
 secrets.0107.b: "[Select_CString(owner.IsFemale,'Čarodějnice za své zločiny zaplatí!','Čaroděj za své zločiny zaplatí!')]"
 secrets.0107.c: "Ta obvinění nejsou nic než zloba a lži."
 secrets.0008.desc: "Můj tajný vztah je odhalen! Za odhalením stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]. Druhou stranou je [Select_CString( ObjectsEqual( secret_exposer, target ), 'tatáž osoba', target.GetTitledFirstName )]! Pravda se šíří jako požár a naše vášeň zřejmě nebyla tak dobře ukrytá, jak jsme si namlouvali."
 secrets.0008.forbidden.desc: "Můj vztah je teď známý celému světu! Za odhalením stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]. Druhou stranou je [Select_CString( ObjectsEqual( secret_exposer, target ), 'tatáž osoba', target.GetTitledFirstName )]!\n\nZatímco na nás ukazují prstem a pokřikují urážky, necítím žádnou hanbu. [Select_CString(ROOT.Char.IsFemale,'Lhala jsem','Lhal jsem')] jen proto, aby náš vztah zůstal v bezpečí. Cítím však strach... Co s námi teď bude?"
 secrets.0008.a: "Kdo jsou, aby nás soudili?!"
 secrets.0108.no_exposer.desc: "Na světlo vyšla tajná pravda. [primary_character.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMeShort', primary_character)])"
 secrets.0108.exposer.desc: "Veřejně zaznělo obvinění. Za ním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]. Podle něj [primary_character.GetTitledFirstName] ([secret_exposer.Custom2('RelationToMeShort', primary_character)])"
 secrets.0108.incest_bad.desc: "udržuje incestní vztah! Druhou stranou je vlastní #EMP [primary_character.Custom2('RelationToMeShort', SCOPE.sC('secondary_character'))]#!, [secondary_character.GetTitledFirstName]! Mají spolu zakázaný poměr!\n\nZa svůj život jsem [Select_CString(ROOT.Char.IsFemale,'viděla a slyšela','viděl a slyšel')] ledacos, ale tohle..."
 secrets.0108.sodomy_bad.desc: "má na svědomí sodomii! Druhou stranou je [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! Tohle přece není cesta, kterou nám ukazuje [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 secrets.0108.adulterer_bad.desc: "má mimomanželský poměr! Druhou stranou je [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! Jak může [primary_character.GetFirstNameNoTooltip] takhle znesvětit vlastní manželství?"
 secrets.0108.fornicator_bad.desc: "má nemanželský pohlavní vztah! Druhou stranou je [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')]! Něco takového nelze mimo manželství přijmout!"
 secrets.0108.incest_is_good.desc: "má poměr! Druhou stranou je [secondary_character.Custom2('HerHisCharacterIntroductionNoComma', primary_character)]. Mnozí je odsuzují, ale já vím, že na tom, co sdílejí [primary_character.GetFirstNameNoTooltip] a [secondary_character.GetFirstNameNoTooltip], není nic špatného..."
 secrets.0108.all_is_good.desc: "má poměr! Druhou stranou je [SCOPE.Custom('SecretRevealSecondCharacterIntroduction')].\n\nNechápu, proč se kolem toho dělá takový povyk. Jako by snad žádostivost byla nějaká nepřirozená choroba..."
 secrets.0108.dislikes_negative: "[ROOT.Char.GetFaith.HighGodName] je bude soudit!"
 secrets.0108.b: "Tenhle zločin nesmí zůstat nepotrestán. Stráže!"
 secrets.0110.start.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'předložila','předložil')] nezvratné důkazy, že"
 secrets.0110.start.above_cutoff: "Ačkoli to nelze nezvratně dokázat, [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'předložila','předložil')] důkazy, podle nichž"
 secrets.0110.single_child.desc: "[child.GetTitledFirstName] není"
 secrets.0110.single_child_relation.desc: "[child.GetFirstName] není"
 secrets.0110.is_not_fathers.desc: "[Select_CString(child.IsFemale,'dcerou','synem')] [father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], nýbrž otcem dítěte je"
 secrets.0110.are_not_fathers.desc: "dětmi [father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)], nýbrž jejich otcem je"
 secrets.0110.is_not_mine.desc: "moje dítě, nýbrž jeho otcem je"
 secrets.0110.incest_real_father.desc: "[real_father.GetTitledFirstName], [mother.Custom2('RelationToMeShort', SCOPE.sC('real_father'))] [mother.GetTitledFirstName]!\n\n"
 secrets.0110.regular_real_father.desc: "[real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 secrets.0110.regular_real_father_self_expose: "nikdo jiný než [real_father.GetTitledFirstName]!"
 secrets.0110.father.child_above_cutoff: "\n\nNic z toho nelze nezvratně dokázat, ale všechno do sebe začíná zapadat..."
 secrets.0110.father_knew.desc: "\n\nI když je ta rána stará, připomínka [mother.GetFirstNamePossessive] nevěry stále bolí... A teď navíc mou hanbu uvidí celý svět."
 secrets.0110.father_love.desc: "\n\nAch, [mother.GetFirstName], jak jsi mohla? Miloval jsem tě i naše dítě... [child.Custom('GetDaughterSon')] však není moje, ale tvoje. Jedinou drtivou ranou jsem přišel o vás oba."
 secrets.0110.father_no_love.desc: "\n\nMohou uplynout tisíce nocí, ale nikdy nezapomenu na zradu, které se [mother.GetFirstName] dopustila. Možná jí jednou znovu dokážu důvěřovat, ale dnes ten den nenastal."
 secrets.0110.incest_consort.desc: "\n\nTo poznání mě zasáhne jako rána kladivem. Ať mě [ROOT.Char.GetFaith.HighGodName] chrání... [consort_bastard.GetFirstNameNoTooltip] patří do mé vlastní rodiny! [ROOT.Char.Custom2('CloseOrExtendedFamilyRelationToMe', SCOPE.sC('consort_bastard'))]... Celou tu dobu... všechno, co jsme spolu dělali..."
 secrets.0110.incest_consort_accepted.desc: "\n\n[ROOT.Char.GetFaith.HighGodName] je mi svědkem, [consort_bastard.GetFirstNameNoTooltip] patří do mé vlastní rodiny! [ROOT.Char.Custom2('CloseOrExtendedFamilyRelationToMe', SCOPE.sC('consort_bastard'))]! [Select_CString(ROOT.Char.IsFemale,'Věděla jsem','Věděl jsem')], že mezi námi #EMP něco#! je, nějaké zvláštní pouto... Teď je mi [consort_bastard.GetFirstNameNoTooltip] bližší než kdy dřív."
 secrets.0110.mother_spouse.desc: "\n\nDrby se dvorem šíří jako požár a [mother.GetFirstName] se zavřela ve svých komnatách. Mám ji utěšit? Pokárat? Mám se... bát?"
 secrets.0110.real_father_spouse.desc: "\n\nDrby se dvorem šíří jako požár, ale já nevím, co si mám myslet ani co říct. Jak jsi to mohl udělat, [real_father.GetFirstName]? Jak ti mám ještě někdy důvěřovat?"
 secrets.0110.mother_family.desc: "\n\nJak nám tohle mohla [mother.GetFirstNameNoTooltip] udělat? [child.GetFirstNameNoTooltip] za nic nemůže, ale následky mohou být hrozivé..."
 secrets.0110.real_father_family.desc: "\n\nJak nám tohle mohl [real_father.GetFirstNameNoTooltip] udělat? [child.GetFirstNameNoTooltip] za nic nemůže, ale následky mohou být hrozivé..."
 secrets.0110.general_end.desc: "\n\n[child.GetFirstNameNoTooltip] za nic nemůže, ale následky mohou být hrozivé. Zato [real_father.GetTitledFirstNameNoTooltip] a [mother.GetTitledFirstName]..."
 secrets.0110.a: "Nemám slov!"
 secrets.0110.a.incest: "Asi se pozvracím."
 secrets.0110.b: "[consort_bastard_parent_lover.GetTitledFirstName] s tebou pořád spí, že?!"
 secrets.0110.b.success.desc: "Má obvinění jsou pravdivá"
 secrets.0110.b.success.tt: "Odhalí se ti tajemství, které skrývá [consort_bastard_parent.GetTitledFirstName]"
 secrets.0110.b.failure.desc: "[consort_bastard_parent.GetTitledFirstNameNoTooltip] a [consort_bastard_parent_lover.GetTitledFirstNameNoTooltip] spolu nemají milostný poměr"
 secrets.0110.c: "Skoro si přeji, abych se to nikdy [Select_CString(ROOT.Char.IsFemale,'nedozvěděla','nedozvěděl')]..."
 secrets.0112.single_child_relation.desc: "[child.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))], má za otce"
 secrets.0112.single_child.desc: "[child.GetTitledFirstName] má za otce"
 secrets.0112.mother_family.desc: "Ach, matko. Nevím, co říct ani co cítit. Alespoň je teď všechno venku."
 secrets.0112.real_father_family.desc: "\n\nJak nám tohle mohl [real_father.GetFirstNameNoTooltip] udělat? [real_father.GetFirstNameNoTooltip], víš vůbec, co to znamená pro naši rodinu?"
 secrets.0112.general_end.desc: "Napadá mě, [Select_CString(child.IsFemale,'věděla','věděl')] [child.GetFirstNameNoTooltip] o svém skutečném původu, nebo se to dozvídá stejně jako já? Bude toto odhalení požehnáním, nebo prokletím?"
 secrets.0112.b.success.desc: "Má podezření jsou správná"
 secrets.0112.a: "Kdo by to byl řekl?"
 secrets.0112.b: "[consort_bastard_parent_lover.GetTitledFirstName] se s tebou pořád schází?"
 secrets.0112.c: "Nechme to za sebou."
 secrets.0115.start.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'předložila','předložil')] nezvratné důkazy o mém pokusu zavraždit [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [ROOT.Char.Custom('CulturalCurse')|U]!\n\n"
 secrets.0115.victim_alive.desc: "Teď už o tom [victim.GetFirstNameNoTooltip] ví, takže musím našlapovat opatrně. Pomsta může přijít zítra, za deset let, nebo možná nikdy. Pokud ale přijde, nesmí mě zastihnout [Select_CString(ROOT.Char.IsFemale,'nepřipravenou','nepřipraveného')]."
 secrets.0115.victim_dead.desc: "Alespoň teď [victim.Custom2('InsultNoun', ROOT.Char)] hnije v hrobě!"
 secrets.0115.a: "[Select_CString(ROOT.Char.IsFemale,'Měla jsem','Měl jsem')] své důvody!"
 secrets.0116.negative.desc: "[ROOT.Char.GetFaith.HighGodName]! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'předložila','předložil')] nezvratné důkazy o pokusu zavraždit [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! Za spiknutím stojí [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nCopak [murderer.GetFirstNameNoTooltip] nemá žádnou úctu k lidskému životu?"
 secrets.0116.positive.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'obvinila','obvinil')] [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] z přípravy vraždy [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nTeď, když je pravda venku, si [murderer.GetFirstNameNoTooltip] musí hlídat záda."
 secrets.0106.victim_knows.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] veřejně [Select_CString(secret_exposer.IsFemale,'obvinila','obvinil')] [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] z pokusu připravit mě o život. Ať se [murderer.GetFirstNameNoTooltip] snaží vysvětlovat nebo mlžit sebevíc, důkazy teď může vidět každý."
 secrets.0106.victim.desc: "[ROOT.Char.GetFaith.HighGodName]! [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'předložila','předložil')] nezvratné důkazy o pokusu zavraždit #EMP mě#!! Za tím proradným spiknutím stojí [murderer.Custom2('InsultNoun', ROOT.Char)], nikdo jiný než [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\nPřísahám, že [murderer.GetFirstNameNoTooltip] tohohle selhání ještě zalituje."
 secrets.0116.likes_negative: "Jak mi tohle [Select_CString(murderer.IsFemale,'mohla','mohl')] [murderer.GetFirstNameNoTooltip] udělat?!"
 secrets.0116.dislikes_negative: "[murderer.GetFirstNameNoTooltip] za to zaplatí, tak či onak!"
 secrets.0116.likes_positive: "Jistě si to [victim.GetFirstNameNoTooltip] [Select_CString(victim.IsFemale,'zasloužila','zasloužil')]!"
 secrets.0116.victim_knows: "Teď už každý ví, co je [murderer.GetFirstNameNoTooltip] zač."
 secrets.0116.b: "Stráže! Zatkněte [Select_CString(murderer.IsFemale,'tu odpornou zločinku','toho odporného zločince')]!"
 secrets.0116.c: "[murderer.GetFirstNameNoTooltip] zatím zůstává na svobodě."
 secrets.0117.start.desc: "[secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(secret_exposer.IsFemale,'předložila','předložil')] nezvratné důkazy o mém podílu na smrti [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]! [ROOT.Char.Custom('CulturalCurse')|U]!\n\n"
 secrets.0117.kinslayer.desc: "[Select_CString(ROOT.Char.IsFemale,'Doufala jsem','Doufal jsem')], že k tomu nikdy nedojde. Pošetilá chyba. Teď o mém osudu rozhoduje [dynast.GetTitledFirstName] a i kdyby mi [Select_CString(dynast.IsFemale,'odpustila','odpustil')], je tu mnoho dalších, kteří prahnou po pomstě..."
 secrets.0117.kinslayer_dynasty_head.desc: "[Select_CString(ROOT.Char.IsFemale,'Doufala jsem','Doufal jsem')], že k tomu nikdy nedojde. Pošetilá chyba. Teď se bojím, že se proti mně obrátí celá má dynastie..."
 secrets.0117.regular.desc: "Raději si budu hlídat záda a připravím se na obranu. Je tu mnoho těch, kteří prahnou po pomstě..."
 secrets.0117.a: "[Select_CString(ROOT.Char.IsFemale,'Měla jsem','Měl jsem')] své důvody!"
 secrets.0118.known_murder.t: "[Select_CString(murderer.IsFemale,'Vražedkyně!','Vrah!')]"
 secrets.0118.negative_start.desc: "Na světlo vyšlo děsivé tajemství a za odhalením stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]! [victim.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(victim.IsFemale,'zemřela','zemřel')] předčasně a odpovědnost nese [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 secrets.0118.negative_start_known.desc: "[victim.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(victim.IsFemale,'zemřela','zemřel')] při chladnokrevné vraždě a odpovědnost nese [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\n"
 secrets.0118.negative_end_family.desc: "[murderer.Custom2('InsultAdjective', ROOT.Char)] [murderer.Custom2('InsultNoun', ROOT.Char)] ať raději spí s jedním okem otevřeným. Tak či onak toho bude [murderer.GetFirstNameNoTooltip] hořce litovat. Přísahám to nad hrobem, v němž [victim.GetTitledFirstNameNoTooltip] odpočívá!"
 secrets.0118.negative_end.desc: "[murderer.GetFirstNameNoTooltip] si snad myslí, že má stejnou moc jako [ROOT.Char.GetFaith.HighGodName], že rozhoduje o životě a smrti a že zákon neznamená nic! Za takový zločin není vykoupení!"
 secrets.0118.positive.desc: "Za obviněním stojí [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)]. Podle něj [victim.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(victim.IsFemale,'zemřela','zemřel')] předčasně a odpovědnost nese [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\nTeď, když je pravda venku, si [murderer.GetFirstNameNoTooltip] musí hlídat záda."
 secrets.0118.positive_known.desc: "[victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] [Select_CString(victim.IsFemale,'zemřela','zemřel')] předčasně a odpovědnost nese [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)]! Dneškem má [murderer.GetFirstNameNoTooltip] víc než jednoho nepřítele."
 secrets.0121.start.desc.intro.self_exposed: "Ať [secret_exposer.GetTitledFirstName] čert vezme! [Select_CString(secret_exposer.IsFemale,'Ta třikrát prokletá vyžvanila','Ten třikrát prokletý vyžvanil')] celému světu všechno o mém přivlastnění prostředků, které patřily právě [secret_exposer.GetTitledFirstName].\n\n"
 secrets.0121.start.desc.intro: "Ať [secret_exposer.GetTitledFirstName] čert vezme! [Select_CString(secret_exposer.IsFemale,'Ta zbabělkyně vyžvanila','Ten zbabělec vyžvanil')] celému světu všechno o mém přivlastnění prostředků, které patřily [secret_target.GetTitledFirstName].\n\n"
 secrets.0121.desc.victim_is_liege_or_above: "A co hůř, [secret_target.GetFirstNameNoTooltip] nade mnou má zákonnou moc a může ještě požadovat, abych [Select_CString(ROOT.Char.IsFemale,'vrátila','vrátil')] #EMP všechno#!. Tohle mě může zruinovat."
 secrets.0121.desc.victim_not_liege.root_has_liege: "Naštěstí [secret_target.GetFirstNameNoTooltip] nemá přímou moc požadovat náhradu. Bohužel takovou pravomoc má [secret_owner.GetLiege.GetTitledFirstName]. Mohla by stačit jediná žádost a peníze budu muset vrátit. Musím doufat, že k tomu nedojde."
 secrets.0121.desc.victim_not_liege.root_has_no_liege: "Alespoň nade mnou není žádná vyšší moc, která by mě mohla přinutit cokoli vracet. Ještě že [secret_owner.GetFaith.WealthGodName] dopřává alespoň trochu milosti."
 secrets.0121.a: "Peníze si prostě jen odpočívaly v mé pokladnici!"
 secrets.0122.t: "Nenechavé prsty"
 secrets.0122.start.desc.intro.self_exposed: "Mám nezvratné důkazy, že [secret_owner.Custom2('MyCharacterIntroduction', secret_target)] mě tajně okrádá! Moji písaři a pokladníci podrobně prověřili neprávem získaný majetek a částky přesně odpovídají chybějícím nebo zpronevěřeným daním a desátkům z celého mého panství.\n\n"
 secrets.0122.start.desc.intro: "Za tvrzením, že [secret_owner.Custom2('MyCharacterIntroduction', secret_target)] mě tajně okrádá, stojí [secret_exposer.Custom2('MyCharacterIntroduction', secret_target)]. Předložené důkazy jsou nezvratné a částky přesně odpovídají chybějícím nebo zpronevěřeným daním a desátkům z celého mého panství.\n\n"
 secrets.0122.desc.victim_is_vassal_or_below.secret_owner: "Jelikož mi [secret_owner.GetFirstNameNoTooltip] podléhá, naštěstí můžu požadovat náhradu. #EMP Jinak...#!"
 secrets.0122.desc.victim_is_vassal_or_below.other: "Ačkoli mi [secret_owner.GetFirstNameNoTooltip] přímo nepodléhá, [secret_owner.GetLiege.GetTitledFirstName] má pravomoc vynutit splacení. Pokud se o dodatečně vybrané daně podělíme napůl, možná přistoupí na to, že peníze vymůže za mě."
 secrets.0122.desc.victim_not_vassal: "Jelikož [secret_owner.GetFirstName] nepodléhá mé autoritě, nemám žádnou možnost získat své ztracené stříbro zpět."
 secrets.0122.a: "Své peníze dostanu, [secret_owner.GetFirstNameNoTooltip]!"
 secrets.0122.a.tt: "[secret_owner.GetFirstName] ti vrátí celých #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#!, jinak se vzbouří"
 secrets.0122.b: "Na zlatu mi nezáleží. Dávám přednost... železu..."
 secrets.0122.c: "Chybovat je lidské, odpouštět božské."
 secrets.0122.c.tt: "[secret_target.GetFirstNameNoTooltip] odpouští tvé „dluhy“"
 secrets.0122.d: "$secrets.0122.a$"
 secrets.0122.d.tt: "Požaduješ, aby [secret_owner.GetFirstName] [Select_CString(secret_owner.IsFemale,'vrátila','vrátil')] #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#!. Nemá však povinnost vyhovět a nejspíš to neudělá"
 secrets.0122.e: "[secret_owner.GetLiege.GetTitledFirstNameNoTooltip] přece musí vidět, jak je to nespravedlivé..."
 secrets.0122.e.tt: "Nabízíš polovinu částky #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#! jako odměnu, pokud [secret_owner.GetLiege.GetTitledFirstName] prosadí, aby [secret_owner.GetFirstName] [Select_CString(secret_owner.IsFemale,'zaplatila','zaplatil')]"
 secrets.0122.f: "$secrets.0122.c$"
 secrets.0122.g: "Mohu si počkat..."
 secrets.0122.g.tt: "[secret_owner.GetFirstName] se jistě jednou dočká soudu."
 secrets.0123.t: "[secret_target.Custom2('AppropriateGreeting', secret_owner)]"
 secrets.0123.desc.self_exposed: "Celý svět už ví o tvém nezákonném převodu daní, desátků a zboží z mé pokladnice.\n\nTyto neprávem získané prostředky okamžitě vrátíš, jinak poneseš následky."
 secrets.0123.desc: "Na tvůj nezákonný převod daní, desátků a zboží z mé pokladnice mě [Select_CString(secret_exposer.IsFemale,'upozornila','upozornil')] [secret_exposer.Custom2('MyCharacterIntroduction', secret_target)].\n\nTyto neprávem získané prostředky okamžitě vrátíš, jinak poneseš následky."
 secrets.0123.a: "Je to krádež mého právoplatného majetku, ale #EMP dobře#!."
 secrets.0123.a.tt: "Tvé zlato dorazí včas a v plné výši"
 secrets.0123.b: "Své zlato dostaneš, až ochutnáš mou ocel!"
 secrets.0123.b.tt.on_the_lamb: "[secret_owner.GetFirstNameNoTooltip] prchá z panství"
 secrets.0123.b.tt.captured: "Pokus o útěk postavy [secret_owner.GetFirstNameNoTooltip] selže"
 secrets.0123.b.tt.refused: "[secret_owner.GetFirstNameNoTooltip] rozhodně odmítá"
 secrets.0124.t: "[secret_target.Custom2('AppropriateGreetingPositive', SCOPE.sC('liege'))]"
 secrets.0124.desc: "Z mé pokladnice zmizelo značné množství zlata a za krádeží stojí [secret_owner.Custom2('YourCharacterIntroduction', SCOPE.sC('liege'))]. Bez tvé pomoci je nedokážu získat zpět.\n\nProsím o vymožení náhrady mým jménem. Za pomoc si můžeš ponechat polovinu zlata."
 secrets.0124.a: "No dobrá. Koneckonců ti to náleží..."
 secrets.0124.a.tt: "Ty i [secret_target.GetShortUIName] získáte každý #P [gold_i][secret.MakeScope.Var('embezzlement_stake_half').GetValue]#!"
 secrets.0124.b: "Dostaneš celou částku!"
 secrets.0124.b.tt: "[secret_target.GetShortUIName|U] získá #P [gold_i][secret.MakeScope.Var('embezzlement_stake').GetValue]#!"
 secrets.0124.b.tt.conditional: "Pokud [secret_owner.GetTitledFirstName] přijme"
 secrets.0124.b.tt.conditional_failed: "Pokud [secret_owner.GetTitledFirstName] odmítne"
 secrets.0124.c: "Tohle zní jako osobní záležitost."
 secrets.0124.c.tt: "[liege.GetTitledFirstNameNoTooltip] nemá zájem"
 secrets.0125.t: "[liege.Custom2('AppropriateGreeting', secret_owner)]"
 secrets.0125.desc: "Šokovala mě zpráva o tvé krádeži, jejíž obětí je [secret_target.Custom2('YourCharacterIntroduction', secret_owner)]. Spravedlnosti se domáhá [secret_target.GetTitledFirstName] a z pozice tvé vrchnosti ti přikazuji vrátit polovinu ukradených peněz.\n\nDruhou polovinu zaplatíš mně jako pokání. Pro dobro panství."
 secrets.0125.a: "Pche, tak si je vezměte."
 secrets.0125.a.tt: "Tvá polovina zlata dorazí"
 secrets.0125.b: "Ani jeden z vás ode mě nedostane nic než ocel!"
 secrets.0125.b.tt: "[secret_owner.GetTitledFirstNameNoTooltip] se místo placení vzbouří"
 secrets.0126.t: "[liege.Custom2('AppropriateGreeting', secret_owner)]"
 secrets.0126.desc: "Tvá zbabělá krádež peněz z pokladnice, kterou spravuje [secret_target.GetTitledFirstName], nezůstane bez trestu. Okamžitě vrať vše do té pokladnice v plné výši, nebo pocítíš můj hněv."
 secrets.0126.a: "Ty peníze jsou poctivě nabyté, ale #EMP dobrá#!."
 secrets.0126.a.tt: "Všechno ti posílá [liege.GetTitledFirstNameNoTooltip]"
 secrets.0126.b: "Ty mi nemáš co poroučet!"
 secrets.0126.b.tt: "$secrets.0125.b.tt$"
 secrets.0131.desc: "[secret_target.GetTitledFirstName] [Select_CString(secret_target.IsFemale,'neprojevila','neprojevil')] žádné slitování. [Select_CString(secret_target.IsFemale,'Odhalila','Odhalil')] mé spiknutí s cílem zmocnit se [secret_target.GetPrimaryTitle.GetTierAsNameNoTooltip|l] a teď o něm vědí všichni v zemích nesoucích jméno „[secret_target.GetPrimaryTitle.GetBaseName]“!\n\nKéž by existoval způsob, jak své činy odčinit..."
 secrets.0131.a: "Kéž mi [ROOT.Char.GetFaith.FateGodName] prokáže milost."
 secrets.0141.start.desc.intro.other_exposed: "Celý plán je venku a zásluhu na tom má [secret_exposer.GetTitledFirstName]...\n\n"
 secrets.0141.start.desc.intro.self_exposed: "Asi bylo jen otázkou času, než se [secret_target.GetTitledFirstName] všechno dozví...\n\n"
 secrets.0141.start.desc.intro: "Bylo mi jasné, že náš nájezd proti rodu [secret_target.GetHouse.GetBaseName] nemůže v tomhle hadím hnízdě zůstat dlouho tajemstvím! Vznešeně mu říkáme „[secret_owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]“, ale zmije zůstávají zmijemi!"
 secrets.0141.desc.target_emperor: "Teď se musíme připravit. [secret_target.GetTitleAsNameNoTooltip] nepochybně propadne nespoutanému hněvu..."
 secrets.0141.desc.owner_emperor: "Jako [secret_owner.GetTitleAsNameNoTooltip] musím postupovat opatrněji, pokud nechci vyvolat hněv velkých rodů..."
 secrets.0141.desc.fallback: "[secret_target.GetFirstNameNoTooltip] se teď nepochybně pokusí využít proti rodu [secret_owner.GetHouse.GetBaseName] moc, kterou má [secret_owner.GetTopLiege.GetTitleAsNameNoTooltip]..."
 secrets.0141.a: "Ať si tlachá, jak chce!"
 secrets.0142.t: "[Select_CString(secret_owner.IsFemale,'Nájezdnice odhalena','Nájezdník odhalen')]"
 secrets.0142.start.desc.intro.other_exposed: "Za odhalení téhle podlosti rodu [secret_owner.GetHouse.GetBaseName] si [secret_exposer.GetTitledFirstName] zaslouží požehnání, které sesílá [secret_target.GetFaith.HighGodName]!\n\n"
 secrets.0142.start.desc.intro.self_exposed: "Vyšší moc mě vedla při odhalení téhle podlosti rodu [secret_owner.GetHouse.GetBaseName]. Tou mocí je [secret_target.GetFaith.HighGodNameAlternate]!\n\n"
 secrets.0142.start.desc.intro: "Konečně víme, kdo stojí za tím nehorázným nájezdem na sídlo rodu [secret_target.GetHouse.GetBaseName]! Za vším stojí [secret_owner.GetTitledFirstName] spolu s tím ohavným rodem!"
 secrets.0142.desc.target_emperor: "Jako [secret_target.GetTitleAsNameNoTooltip] mohu využít veškerou svou moc a pohnat tu podlou rodinu k odpovědnosti."
 secrets.0142.desc.owner_emperor: "Musíme postupovat opatrně. [secret_owner.GetTitleAsNameNoTooltip] bude očekávat naše další kroky..."
 secrets.0142.desc.fallback: "Teď se o zločinu našich nepřátel dozvědí [secret_target.GetTopLiege.GetTitleAsNameNoTooltip] i [secret_target.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] a my je můžeme pohnat k odpovědnosti!"
 secrets.0142.a: "Tahle zrada nezůstane bez trestu!"
 secrets.0142.b: "Pomstíme se, tak či onak..."
 secrets.0500.single_child.t: "[child.Custom('GetDaughterSon')|U] jiného muže"
 secrets.0500.start.desc: "Může to být pravda?"
 secrets.0500.single_child.desc: "[child.GetFirstName] má za otce"
 secrets.0500.incest_real_father.desc: "[real_father.GetTitledFirstName], její vlastní [mother.Custom2('RelationToMeShort', SCOPE.sC('real_father'))],"
 secrets.0500.regular_real_father.desc: "[real_father.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)],"
 secrets.0500.end.desc: "a ne mě?\n\nMám plakat? Křičet? Trestat? Odpustit? Dítě [child.GetFirstNameNoTooltip] bude vždy považováno za mé legitimní dítě, ale důkazy přede mnou nelze popřít..."
 secrets.0500.a: "Potřebuji čas na rozmyšlenou..."
 secrets.0501.t: "Můj skutečný původ"
 secrets.0501.desc_incest_marriage: "Konečně vím, kdo je můj skutečný [real_father.Custom('MotherFather')] – [real_father.GetTitledFirstName]. Jen škoda, že s odhalením přišlo i zjištění, že [incest_spouse.GetTitledFirstName] má ke mně hned dva vztahy: [incest_spouse.Custom('WifeHusband')] a zároveň [incest_spouse.Custom('SisterBrother')]!"
 secrets.0501.desc_unmarried_mother: "Můj původ mimo manželství mě pronásleduje od narození.\n\nTeď konečně znám pravdu. Můj [real_father.Custom('MotherFather')] je [real_father.GetTitledFirstName] a mně se konečně lépe dýchá."
 secrets.0501.desc_married_mother: "Je to vtip? Sen? [father.GetFirstName] mě vychoval, ale není mým skutečným otcem?\n\nZdá se to neskutečné, ale důkazy přede mnou nelze popřít. Mým otcem je jiný muž – [real_father.GetTitledFirstName]."
 secrets.0501.a: "Pravda může být požehnáním i prokletím."
 secrets.0502.single_child.t: "[Select_CString(child.IsFemale,'Má ztracená','Můj ztracený')] [child.Custom('GetDaughterSon')|U]"
 secrets.0502.single_child_start.desc: "[ROOT.Char.GetFaith.HighGodName] je mi svědkem, [child.GetTitledFirstName] je [Select_CString(child.IsFemale,'má','můj')] [child.Custom('GetDaughterSon')]?!"
 secrets.0502.lover.desc: "Vždycky jsem měl podezření, ale teď, když znám pravdu s jistotou, nemám slov."
 secrets.0502.unmarried.desc: "\n\nTo, že [mother.Custom2('MyCharacterIntroduction', ROOT.Char)] otěhotněla mimo manželství, ví každý, ale #EMP můj#! přesný podíl na celé věci zůstal až dosud tajemstvím."
 secrets.0502.married.desc: "\n\nVšichni jsme věřili, že otcem je [father.Custom2('MyCharacterIntroduction', ROOT.Char)]. Pomyslet, že [mother.GetTitledFirstName] celou tu dobu pravdu tajila!"
 secrets.0502.end: "\n\nVždy se najdou tací, podle nichž je [father.GetFirstNameNoTooltip] skutečný otec a [child.GetFirstNameNoTooltip] jeho legitimní dítě, ale já znám pravdu."
 secrets.0502.a.incest: "Asi budu blít..."
 secrets.0502.a: "[child.GetFirstNameNoTooltip], celou tu dobu..."
 secrets.0502.b: "Svět se musí dozvědět pravdu!"
 secrets.0503.t: "Blízké pouto"
 secrets.0503.incest_accepted.desc: "[ROOT.Char.GetFaith.HighGodName] je mi svědkem, [sibling_partner.GetFirstName] je [Select_CString(sibling_partner.IsFemale,'má','můj')] [sibling_partner.Custom('SisterBrother')|l]! Vždycky mezi námi #EMP něco#! bylo, nějaké zvláštní pouto... Teď je mi [consort_bastard.GetFirstNameNoTooltip] bližší než kdy dřív."
 secrets.0503.incest.desc: "Pravda přináší děsivý důsledek: [sibling_partner.GetFirstName] a já máme stejného otce...\n\nPřed očima se mi míhají obrazy všeho, co jsme si řekli, všeho, co jsme spolu dělali. Celou tu dobu..."
 secrets.0502.likes_incest.a: "To je skutečné požehnání!"
 secrets.0502.dislikes_incest.a: "Asi budu blít."
 secrets.0510.t: "Odhalená zmije"
 secrets.0510.traitor.desc: "Nemohu uvěřit, že [murderer.GetTitledFirstName] [Select_CString(murderer.IsFemale,'měla','měl')] tu drzost proti mně osnovat spiknutí! Dokonce plánovat vraždu někoho tak blízkého, jako je [murderer.Custom2('RelationToMeShort', ROOT.Char)]!\n\n"
 secrets.0510.regular.desc: "Cítím úlevu i vztek, když konečně zjišťuji, kdo se mě pokusil připravit o život. [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je [murderer.Custom2('InsultAdjective', ROOT.Char)] [murderer.Custom2('InsultNoun', ROOT.Char)]!\n\n"
 secrets.0510.alive.desc: "Tohle nesmí zůstat bez trestu – kdo ví, co by se mohlo stát příště. Musím zvážit, jaký postup bude nejlepší..."
 secrets.0510.dead.desc: "Plány ale žalostně selhaly. Já stále stojím, zatímco [murderer.GetFirstNameNoTooltip] hnije v zemi!"
 secrets.0510.a.alive: "Musím naplánovat svůj další krok..."
 secrets.0510.a.dead: "Dobře, že je po všem!"
 secrets.0511.regular.desc: "[ROOT.Char.GetFaith.HighGodName]! Co to má znamenat? Terčem vražedného pokusu se [Select_CString(victim.IsFemale,'stala','stal')] [victim.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] a za pokusem stojí [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 secrets.0511.dead.desc: "Alespoň [murderer.GetFirstNameNoTooltip] už hnije v hrobě!"
 secrets.0511.alive.desc: "Pokud nezasáhnu, [victim.GetFirstNameNoTooltip] může být stále v nebezpečí."
 secrets.0512.regular.desc: "[Select_CString(ROOT.Char.IsFemale,'Konečně jsem odhalila pravdu!','Konečně jsem odhalil pravdu!')] Za předčasnou smrt, která postihla [victim.GetFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))]), nenese odpovědnost nikdo jiný než [murderer.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 secrets.0512.immured.desc: "Při důkladné prohlídce vyšlo najevo, že [murderer.Custom('ResidenceBuilding')] skrývá zazděnou místnost. Za zdí čekal hrůzný nález: [Select_CString(victim.IsFemale,'mrtvá','mrtvý')] [victim.GetFirstNameNoTooltip].\n\n"
 secrets.0512.alive.desc: "A [murderer.GetFirstNameNoTooltip] si [Select_CString(murderer.IsFemale,'myslela','myslel')], že tenhle ohavný zločin projde bez trestu! Ale na má slova dojde. [murderer.GetFirstNameNoTooltip] za své hříchy draze zaplatí."
 secrets.0512.dead.desc: "[Select_CString(ROOT.Char.IsFemale,'Jsem ráda','Jsem rád')], že [murderer.GetFirstNameNoTooltip] hnije v hrobě, ale část mě si přeje, aby [murderer.GetFirstNameNoTooltip] [Select_CString(murderer.IsFemale,'stále žila a stála přede mnou','stále žil a stál přede mnou')]. Znám pár věcí, které by byly vhodnější než věčný odpočinek..."
 secrets.1001.t: "Odhalení"
 secrets.1001.opening_spymaster: "Na konci nejnovější zprávy se [spymaster.GetCouncilTitle] [spymaster.GetFirstName] na chvíli odmlčí. „Je tu něco, co byste [Select_CString(ROOT.Char.IsFemale,'měla','měl')] vědět. Tím člověkem je [secret_holder.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))].“"
 secrets.1001.opening_no_spymaster: "Už nějakou dobu slýchám zvěsti. Týkají se člověka, kterého znám jako [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))]. Až dosud však chyběly důkazy."
 secrets.1001.sexual_habits: "\n\nZdá se, že [secret_holder.GetTitledFirstName] má velmi neobvyklé sexuální choutky..."
 secrets.1001.secret_relationships: "\n\n[secret_holder.GetTitledFirstName] a [secret_lover.GetTitledFirstName] spolu mají zakázaný poměr!"
 secrets.1001.fallback: "\n\nZdá se, že [secret_holder.GetTitledFirstName] skrývá mnoho tajemství."
 secrets.1001.a: "Takže [secret_holder.GetFirstNameNoTooltip] má slabost pro [Select_CString(secret_holder.IsFemale,'ženy','muže')]?"
 secrets.1001.b: "[Select_CString(ROOT.Char.IsFemale,'Takže nejsem jediná, kdo podléhá vlastním pudům.','Takže nejsem jediný, kdo podléhá vlastním pudům.')]"
 secrets.1001.c: "Nechápe snad [secret_holder.GetFirstNameNoTooltip] výraz „chov zvířat“ až příliš doslovně?"
 secrets.1001.f: "[secret_holder.GetFirstNameNoTooltip] a [secret_lover.GetFirstNameNoTooltip]? Už jen ta představa mě zneklidňuje!"
 secrets.1001.option_fallback: "Kdybych [Select_CString(ROOT.Char.IsFemale,'nevěděla','nevěděl')], že je to pravda..."
 secrets.1012.t: "Přátelé a milenci"
 secrets.1012.close_relation: "Před opravdovým přítelem se tajemství skrývají těžko. Už dlouho pozoruji zájem, který [first_lover.GetTitledFirstName] projevuje, kdykoli se objeví [lover.GetTitledFirstName]. Přitom [lover.GetFirstName] je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover'))].\n\nTeď jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], že nejde jen o zájem. Mají spolu zakázaný poměr!"
 secrets.1012.desc: "Před opravdovým přítelem se tajemství skrývají těžko a už dlouho si všímám, jaký zájem [first_lover.GetTitledFirstName] projevuje, kdykoli se objeví [lover.GetTitledFirstName].\n\nTeď jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], že nejde jen o zájem. Mají spolu zakázaný poměr!"
 secrets.1012.a: "Není divu, že si to [first_lover.GetFirstNameNoTooltip] [Select_CString(first_lover.IsFemale,'chtěla','chtěl')] nechat pro sebe."
 secrets.1101.t: "Náš původ"
 secrets.1101.opening: "Když jsem [Select_CString(ROOT.Char.IsFemale,'poznala','poznal')] pravdu, všechno do sebe konečně zapadlo."
 secrets.1101.friendly: "Přes všechny naše podobnosti jsou mezi námi i velké rozdíly a teď už lépe chápu proč."
 secrets.1101.unfriendly: "Mělo mi dojít, že za našimi rozdíly není jen nekonečná řada sporů."
 secrets.1101.end: "\n\n[bastard.GetTitledFirstName] je sice [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('bastard'))], ale nesdílíme stejného otce. Skutečným otcem je [real_father.GetTitledFirstName]!"
 secrets.1101.a: "Sotva tomu dokážu uvěřit."
 secrets.1102.friendly: "Nejdřív jsem si [Select_CString(ROOT.Char.IsFemale,'nebyla jistá','nebyl jistý')], ale při pozdravu zaznělo nápadně zdůrazněné „#EMP [ROOT.Char.Custom('SisterBrother')]#!“ a tím se všechno vyjasnilo."
 secrets.1102.unfriendly: "Nejdřív jsem si [Select_CString(ROOT.Char.IsFemale,'nebyla jistá','nebyl jistý')], ale posměšně zdůrazněné „#EMP [ROOT.Char.Custom('SisterBrother')]#!“ při pozdravu vše vyjasnilo."
 secrets.1102.end: "\n\n[father.GetTitledFirstName] ví, kdo je můj skutečný otec."
 secrets.1102.a: "Jak [father.GetTitledFirstName] s tou znalostí naloží?"
 secrets.2002.t: "Neodpustitelné?"
 secrets.2002.desc: "Skoro si přeji, abych se to nikdy [Select_CString(ROOT.Char.IsFemale,'nedozvěděla','nedozvěděl')]! Pomyslet, že [secret_holder.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_holder'))], dokáže vraždit...\n\nAni [murdered_character.GetTitledFirstName] si [Select_CString(murdered_character.IsFemale,'nezasloužila','nezasloužil')] tak potupný konec."
 secrets.2002.a: "Za ty zločiny si [secret_holder.GetFirstNameNoTooltip] zaslouží pokárání!"
 secrets.2002.a.tt: "#F [secret_holder.GetFirstNameNoTooltip] možná projeví lítost.#!"
 secrets.2002.b: "Nu což. Politika bývá ošklivá."
 secrets.2003.desc: "[close_character.GetTitledFirstName] přichází za mnou s rozpolceným výrazem ve tváři. Pro mě je [close_character.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))].\n\n„Vím, co jsi [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] s [murdered_character.GetTitledFirstName],“ zazní. „[Select_CString(ROOT.Char.IsFemale,'Že jsi schopná takového zločinu... Ta myšlenka mě pronásleduje.','Že jsi schopný takového zločinu... Ta myšlenka mě pronásleduje.')]“"
 secrets.2003.a: "Bylo to nutné."
 secrets.2003.b: "Každý den toho lituji!"
 secrets.2004.desc: "Navzdory všem tvrdým slovům mě odpověď zaskočila. [murdered_character.GetTitledFirstName] je po smrti a [secret_holder.GetTitledFirstName] kvůli tomu čelí mé konfrontaci.\n\n„Copak nechápeš, jak mě to pronásleduje?“ zazní. „Je taková úleva konečně někomu říct, jak moc toho lituji.“"
 secrets.2004.a: "Možná si [secret_holder.GetFirstNameNoTooltip] časem zaslouží odpuštění."
 secrets.2004.b: "Ach, na tebe se nikdy nedokážu dlouho zlobit, [target.GetFirstNameNoTooltip]!"
 secrets.3001.t: "Někdo nade mnou drží ochrannou ruku"
 secrets.3001.opening: "[close_character.GetTitledFirstName] přichází za mnou se starostí ve tváři. Pro mě je [close_character.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))]."
 secrets.3001.scheme_owner_known: "\n\n„Podařilo se mi najít jednoho ze spolčenců! Patří ke spiknutí, které proti tobě vede [known_scheme_owner.GetTitledFirstName]. [agent.GetTitledFirstName] se uprostřed noci [Select_CString(agent.IsFemale,'pokusila','pokusil')] doručit zprávu a příjemcem měl být [known_scheme_owner.GetFirstName].“"
 secrets.3001.scheme_known: "\n\n„Podařilo se mi najít jednoho ze spolčenců, kteří se podílejí na spiknutí proti tobě! [agent.GetTitledFirstName] se uprostřed noci [Select_CString(agent.IsFemale,'pokusila','pokusil')] doručit zprávu svému zadavateli.“"
 secrets.3001.scheme_not_known: "\n\n„Podařilo se mi najít spolčence, který se podílí na spiknutí proti tobě! [agent.GetTitledFirstName] se uprostřed noci [Select_CString(agent.IsFemale,'pokusila','pokusil')] doručit zprávu svému zadavateli.“"
 secrets.3001.a: "Děkuji ti! Pro mě jsi [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('close_character'))] a na to nezapomenu."
 secrets.4001.t: "Odhalen podvod při zkouškách"
 secrets.4001.desc: "Do mého sídla vstupuje [minister.GetTitledFirstName] v doprovodu stráží. Pro mě je [minister.GetFirstName] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('minister'))].\n\n„Tohle je naprosté zklamání, [ROOT.Char.GetFirstNameNoTooltip]! Tvoje kariéra byla slibná, ale teď končí.“ [minister.GetTitledFirstName] udeří rukou do mého stolu a nechá na něm listinu. „Tohle je nezvratný důkaz. Výpovědi několika svědků potvrzují, [Select_CString(ROOT.Char.IsFemale,'že jsi při zkouškách podváděla','že jsi při zkouškách podváděl')].“"
 secrets.4001.a: "„Nesmysl! Očití svědci nejsou spolehliví.“"
 secrets.4001.b: "„[Select_CString(ROOT.Char.IsFemale,'I kdyby, Synu nebes jsem vždy sloužila věrně.','I kdyby, Synu nebes jsem vždy sloužil věrně.')]“"
 secrets.4001.c: "„Hliněná socha se bojí deště, lež pravdy.“"
 exam_cheater_bribe_t: "Odhalený podvod při zkouškách: úplatky"
 exam_cheater_reimburse_t: "Odhalený podvod při zkouškách: náhrada"
 exam_cheater_guilty_t: "Odhalený podvod při zkouškách: vina"
