l_polish:
 south_asia.0001.t: "Nová éra"
 south_asia.0001.desc: "Davy skandují mé jméno, zatímco se očišťuji ve vodách nebeských pramenů. Z vody vystupuji jako Čakravartin, [Select_CString(ROOT.Char.IsFemale, 'právoplatná a laskavá vládkyně', 'právoplatný a laskavý vládce')] celého světa.\n\n[ROOT.Char.GetFaith.AltPriestTermPlural] mi říkají, že nastal čas, aby svět následoval mé světlo, ale jejich ujištění nepotřebuji. Když hledím přes širé pláně, cítím to až v hloubi duše."
 south_asia.0001.a: "Svět vyslovuje mé jméno."
 south_asia.0002.t: "Čakravartin"
 south_asia.0002.intro: "Davy putovaly celé dny, ba i týdny, aby se mohly zúčastnit obřadu. Celý život [chakravarti.GetTitledFirstNamePossessive] směřoval k tomuto jedinému okamžiku."
 south_asia.0002.text: "\n\nV ohromeném tichu sleduji, jak z posvátných pramenů vystupuje [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chakravarti'))] [chakravarti.GetTitledFirstName]. [Select_CString(chakravarti.IsFemale, 'Její', 'Jeho')] [chakravarti.GetFaith.AltPriestTermPlural] [Select_CString(chakravarti.IsFemale, 'ji', 'ho')] prohlašují za Čakravartina, [Select_CString(chakravarti.IsFemale, 'naši laskavou vládkyni', 'našeho laskavého vládce')].\n\nNyní už nikdo nemůže zpochybnit, že právě [chakravarti.GetTitledFirstNameNoTooltip] má právoplatně vládnout celému světu."
 south_asia.0002.a: "Je mi ctí, že jsem mohl být svědkem tohoto okamžiku."
 south_asia.0002.b: "Vrhnu se ti v jásotu k nohám!"
 south_asia.0003.text: "\n\nTeprve když z posvátných pramenů vystoupí [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('chakravarti'))] [chakravarti.GetTitledFirstName], dolehne na mě plná váha tohoto okamžiku. [Select_CString(chakravarti.IsFemale, 'Její', 'Jeho')] [chakravarti.GetFaith.AltPriestTermPlural] [Select_CString(chakravarti.IsFemale, 'ji', 'ho')] prohlašují za Čakravartina, právoplatného vládce celého světa.\n\nKdyž [chakravarti.GetTitledFirstName] hledí na pláně rozprostírající se pod námi, nemohu se ubránit pocitu, že je to pravda."
 south_asia.0003.a: "Dovol mi podílet se na tvém triumfu, můj lenní pane!"
 south_asia.0003.b: "Co nyní čeká vládce světa?"
 south_asia.0004.relevant_religion: "Poslové přicházejí v celých zástupech se zprávami z Indické říše. Poprvé po celé věky má svět opět Čakravartina."
 south_asia.0004.desc: "Z Indie dorazily celé zástupy poslů a ohlašují vzestup jejich „Čakravartina“, přičemž nešetří chválou jeho dobrotivosti."
 south_asia.0004.text: "\n\nZa velkolepých obřadů a před zástupy věřících u svých nohou [chakravarti.GetTitledFirstName] [Select_CString(chakravarti.IsFemale, 'přijala', 'přijal')] úlohu právoplatného vládce celého světa."
 south_asia.0004.a: "Stane se [chakravarti.GetFirstNameNoTooltip] novou hrozbou, nebo [Select_CString(chakravarti.IsFemale, 'mocnou spojenkyní', 'mocným spojencem')]?"
 south_asia.0004.b: "Ať si [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] své směšné nároky klidně nechají!"
 south_asia.0011.t: "Posvátné vody"
 south_asia.0011.desc: "Celý den, od východu až do západu slunce, stojím po pás v proudící řece. Nabírám vodu do dlaní, pozvedám ji k nebi a nechávám ji znovu stékat. Znovu a znovu.\n\nKdyž se nakonec vrátím na suchou zem, celé tělo se mi třese a vítají mě podřízení [ROOT.Char.GetFaith.PriestNeuterPlural]. Přísahal jsem chránit nejen vodu, která mi dnes protékala mezi prsty, ale celou řeku a skrze ni i věčnost samotného bytí."
 south_asia.0011.a: "[ROOT.Char.GetFaith.HighGodName] jistě nepochybuje o mé oddanosti."
 south_asia.0012.desc: "[ruler_of_ganges.GetTitledFirstName] ovládá celý tok Gangy a nyní se [Select_CString(ruler_of_ganges.IsFemale, 'prohlásila za duchovní ochránkyni', 'prohlásil za duchovního ochránce')] jejích posvátných vod. Takovou autoritu si dosud nikdo nenárokoval, avšak [ruler_of_ganges.GetFaith.PriestNeuterPlural] tento nárok uznali."
 south_asia.0012.a.like: "Zdá se, že věčnost má nového ochránce."
 south_asia.0012.a.dislike: "Jako by si [ruler_of_ganges.GetTitledFirstName] [Select_CString(ruler_of_ganges.IsFemale, 'zasloužila', 'zasloužil')] něčí úctu! [Select_CString(ruler_of_ganges.IsFemale, 'Pouhá prospěchářka', 'Pouhý prospěchář')]!"
 south_asia.0013.t: "Uzurpace božského poslání"
 south_asia.0013.desc: "Po ztrátě části mého území už lid ani [ROOT.Char.GetFaith.PriestNeuterPlural] mého panství neuznávají mou autoritu nad Gangou! [ruler_of_ganges.GetTitledFirstName] si místo toho [Select_CString(ruler_of_ganges.IsFemale, 'přivlastnila', 'přivlastnil')] postavení, které kdysi náleželo mně, a nyní je [Select_CString(ruler_of_ganges.IsFemale, 'Strážkyní', 'Strážcem')] posvátné řeky."
 south_asia.0013.a: "[Select_CString(ruler_of_ganges.IsFemale, 'Ta povýšenkyně je jen podvodnice', 'Ten povýšenec je jen podvodník')]!"
 south_asia.0021.t: "[founder.GetTitleAsNameNoTooltip] země $k_bene_israel$"
 south_asia.0021.desc: "Židovský lid byl nucen žít kočovným životem v malých enklávách roztroušených po celém světě a po staletí postrádal vlast, kterou by mohl nazývat svou. Zdá se však, že dlouhé věky putování jsou konečně u konce.\n\n[founder.GetNameNoTooltip] nyní nese titul [founder.GetTitleAsNameNoTooltip] a vládne zemi $k_bene_israel$. Jakkoli nepravděpodobně to zní, židovský lid nalezl nový domov na západním pobřeží Indie. Náboženskou hlavu opět představuje [founder.GetFaith.ReligiousHeadTitleName] a byl vyhlášen nový Izrael. [founder.GetTitledFirstNameNoTooltip] [Select_CString(founder.IsFemale, 'věří', 'věří')], že tím zahajuje nový zlatý věk pro vyznavače judaismu po celém světě."
 south_asia.0021.a: "Nový domov pro náš lid!"
 south_asia.0021.b: "Izrael je jen jeden!"
 south_asia.0021.c: "To je vskutku nečekaná korunovace."
 south_asia.0030.t: "Šíření théravády"
 south_asia.0030.desc: "Ačkoli patříme k posledním baštám théravádového učení, naši šlechtici tuto víru nadále přijímají s nadšením. Prostý lid však urputně lpí na tradičních zvycích a uctívání zlovolných natů zůstává velmi rozšířené.\n\nProzíravý vládce by v podobných otázkách možná hledal kompromis, ale třeba je zapotřebí tvrdšího přístupu..."
 south_asia.0030.a: "Ty prostoduché sedláky je třeba přinutit k poslušnosti!"
 south_asia.0030.b: "Staré bohy mohou v rozumné míře uctívat dál."
 south_asia.0030.c: "Vyřeším to později."
 south_asia.0030.a.tt: "Všechna hrabství v oblasti Barmy"
 south_asia.0030.a.ari.tt: "Všichni vazalové vyznávající ari"
 south_asia.0030.b.theravada.tt: "Všichni vazalové vyznávající théravádu"
 south_asia.0031.t: "Náboženské napětí roste"
 south_asia.0031.desc: "Jedna věc je být kulturními vetřelci, ale něco docela jiného je vnucovat náboženskou nadvládu. Prostý lid zuří a mezi tradičněji založenými dvořany, k nimž patří i [ari_vassal.GetTitledFirstName], se při zmínce o tvém jménu ozývá bezpočet posměšných poznámek.\n\nStále ještě mohu vztáhnout ruku ke smíru, nebo ji sevřít v pěst nelítostného vládce. Anebo ji mohu stáhnout úplně a nechat plamen, aby časem sám vyhasl. Musím volit moudře..."
 south_asia.0031.a: "Rozdrť tu chátru a zjisti, kdo se ji opovažuje chránit."
 south_asia.0031.b: "Nemůžeme si dovolit zkázu panství."
 south_asia.0031.c: "Vyšleme jasný vzkaz. Vůdce veřejně popravíme."
 south_asia.0031.d: "Udělal jsem vše, co bylo v mých silách."
 south_asia.0031.a.tt: "Všechna hrabství"
 south_asia.0031.b.theravada: "Všichni vazalové vyznávající théravádu"
 south_asia.0031.c.all.tt: "Všichni ostatní vazalové"
 south_asia.0032.t: "Náboženské napětí polevuje"
 south_asia.0032.desc: "Tradiční barmská lidová božstva zůstávají hluboce zakořeněná, zejména na venkově. Odepřít lidem právo uctívat bohy podle vlastní vůle by způsobilo více škody než užitku, a proto bylo přijetí sedmatřicátého božstva — Thagyamina, buddhistického boha-ochránce — na první a nejvýznamnější místo v panteonu přijato bez odporu.\n\nNyní se před tebou otevírá jedinečná příležitost. [ROOT.Char.GetFaith.GetName] má své tradiční centrum na Lance, které však neustále ohrožují mocnosti z pevniny. Anebo nastal čas, abychom sami určili další směřování naší nově posílené víry."
 south_asia.0032.a: "Pozvi ke svému dvoru náboženské uprchlíky z Lanky."
 south_asia.0032.b: "[ROOT.Char.GetFaith.GetNameNoTooltip] bude mít jediné strážce: nás."
 south_asia.0032.a.tt: "Dorazí [Concept('guests','hosté')|E] z Lanky"
 south_asia.0032.a.ruler.tt: "Všichni sinhálští vládci vyznávající théravádu"
 south_asia.0032.a.lankan: "Ke tvému dvoru dorazili náboženští uprchlíci z Lanky"
 south_asia.0033.t: "Prosazení náboženské vůle"
 south_asia.0033.desc: "Náboženští povstalci jsou pryč. Ti, kteří byli dost stateční a pošetilí, aby se postavili na odpor, byli pobiti, většina však ze strachu z pronásledování sklopila hlavy a držela jazyk za zuby. Náboženští vůdci vyznávající [ari_vassal.GetFaith.GetName] uprchli na venkov, kde mohou dál provozovat své animistické obřady.\n\nNyní přicházejí na řadu ti, kteří jim ještě nedávno tak nestoudně vyjadřovali podporu, ale teď náhle zarytě mlčí."
 south_asia.0033.a: "Všichni u mého dvora se musí přihlásit k pravé víře!"
 south_asia.0033.b: "Prolilo se už dost krve. Nech je jít."
 south_asia.0033.c: "Svou šanci jste měli. STRÁŽE!"
 south_asia.0034.t: "Náboženský konflikt odvrácen"
 south_asia.0034.desc: "Dovést zemi na pokraj občanské války při obraně víry svědčí o horlivosti, avšak poznat, kdy je třeba zadržet ruku, zase o soucitu. Lid dál reptá, ale budiž.\n\nNáboženský rozkol v údolí Iravádí přetrvává, avšak má vláda nad krajem zůstala nedotčena a stále existuje možnost pokračovat v obracení obyvatel běžnými prostředky."
 south_asia.0034.a: "Siddhártha Gautama by můj soucit schvaloval."
 south_asia.0034.b: "A obrátíme je."
 south_asia.0034.counties: "Všechna hrabství"
 south_asia.0034.vassals: "Všichni vazalové"
 south_asia.0034.aricounties: "Všechna hrabství vyznávající ari"
 south_asia.0035.t: "Ochrana domoviny théravády"
 south_asia.0035.desc: "Každý skutečný následovník Buddhova učení dokáže ocenit posvátný význam zachování jeho slov. Pálijský kánon, přestože byl sepsán stovky let po smrti Siddhárthy Gautamy, představuje nejvěrnější soubor Buddhových slov v celém známém světě.\n\nPolitické pletichy na indické pevnině však stále více ohrožují bezpečí těchto posvátných textů v tradiční domovině [ROOT.Char.GetFaith.GetName] na ostrově Lanka. Musím jednat!"
 south_asia.0035.a: "Vyšleme věrné. Věrní [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] pomůžou zachovat víru."
 south_asia.0035.b: "Vyšli posly a nabídni pouto přátelství."
 south_asia.0035.b.theravada.tt: "Všichni nezávislí vládci vyznávající théravádu"
 south_asia.0035.a.lanka: "Všechna hrabství na Lance"
 south_asia.0036.t: "Jak naložit s ari"
 south_asia.0036.desc: "Budoucnost víry mimo údolí Iravádí je nyní zajištěna. Zbývá jediná otázka: co s mnichy vyznávajícími [ari_faith.GetName], kteří stále třímá tolik moci, a přitom při každé příležitosti bezostyšně dávají na odiv své požitkářství. Jejich vliv lze oslabit, ale nesmíme jej podcenit.\n\nS těmito náboženskými vůdci, kteří pijí víno a obětují zvířata, je třeba se vypořádat. Opatrně však, aby jejich pronásledování nebylo vnímáno jako hrozba pro stále křehký mír v oblasti."
 south_asia.0036.a: "Lid musí poznat jejich hříchy. Rozděl a panuj."
 south_asia.0036.b: "Buď konvertují, nebo uprchnou do lesů a hor."
 south_asia.0036.b.tt: "Všechna ostatní hrabství v Barmě"
 south_asia.0037.t: "Víra zajištěna"
 south_asia.0037.desc: "Když se rozplývají poslední zbytky moci mnichů, jako by mi z ramen spadl mlýnský kámen. Náboženské vztahy v království jsou harmonické, víra vzkvétá a lid ve mně právem vidí svého světského i duchovního vůdce.\n\nMá velká pouť je u konce a mé panství se nyní může právem nazývat skutečnou baštou silného a zdravého [ROOT.Char.GetFaith.GetName]."
 south_asia.0037.a: "Naši víru ještě více upevníme!"
 south_asia.0037.b: "Pouze následuji Buddhovu vůli."
 south_asia.0037.b.tt: "Všichni vazalové"
 south_asia.0038.t: "Velký rozkol"
 south_asia.0038.desc: "Věřící v celém údolí Iravádí už mnoho let rozděluje hluboký náboženský rozkol. Městská šlechta a jí podobní vyznávají [proselytiser.GetFaith.GetName], zatímco prostý lid a obyvatelé rozlehlých lesů tohoto údolí nadále uctívají rozmanitá božstva a duchy ari.\n\n[Select_CString(proselytiser.IsFemale, 'Má lenní paní', 'Můj lenní pán')] [proselytiser.GetFullName] [Select_CString(proselytiser.IsFemale, 'se rozhodla', 'se rozhodl')] tento rozkol zacelit a učinit théravádu převládající vírou ve svých zemích, a tím i v mých. Už teď [Select_CString(proselytiser.IsFemale, 'její', 'jeho')] mniši procházejí mými zeměmi a přetvářejí jejich náboženskou tvář podle svých představ."
 south_asia.0038.a: "Théraváda bude vzkvétat!"
 south_asia.0038.b: "To je nehoráznost!"
 south_asia.0038.c: "Jen další z obvyklých nesmyslů."
 south_asia.0038.tt: "Několik tvých [Concept('counties','hrabství')|E] může přijmout théravádu."
 south_asia.0039.t: "Brutální fanatik"
 south_asia.0039.desc: "Zdá se, že misijní úsilí [proselytiser.GetFullName] se příliš nezdařilo. Tvrdý způsob, jakým [proselytiser.GetFirstNameNoTooltip] šíří théravádu, vyvolal nepokoje a protesty, které byly následně brutálně potlačeny.\n\nKaždý pán či paní, kdo se odvážil chránit vyznavače těžce zkoušené ari, buď zmizel, nebo nyní tvrdí, že jeho slova byla překroucena. Nikdo si netroufá dále pokoušet trpělivost [Select_CString(proselytiser.IsFemale, 'své horlivé lenní paní', 'svého horlivého lenního pána')].\n\nZda tento vývoj přinese další následky těm, o nichž se vědělo, že stáli na straně utlačovaných, se teprve ukáže..."
 south_asia.0039.a: "Nic jiného si nezaslouží."
 south_asia.0039.b: "Jednoho dne budou padlí věřící pomstěni."
 south_asia.0039.c: "Jen další malicherné hašteření mezi [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]."
 south_asia.0040.t: "Víra zajištěna?"
 south_asia.0040.desc: "[proselytiser.GetFullName], [Select_CString(proselytiser.IsFemale, 'má lenní paní a vládkyně', 'můj lenní pán a vládce')] těchto zemí, se usilovně věnuje obracení obyvatel na svou víru, [proselytiser.GetFaith.GetName]. Jak její šíření postupuje, nelze zastavit proud kazatelů a bhánaků, kteří procházejí mými zeměmi a šíří nejen svou víru, ale i víru svého vládce.\n\nZatímco théraváda zapouští kořeny, tradiční vyznavači ari mizí do lesních útočišť kolem Arakanských hor. Jejich počty se ztenčují a veřejnému uctívání se stále více vyhýbají."
 south_asia.0040.a: "Skvělé! Pravá víra bude vzkvétat!"
 south_asia.0040.b: "Na tyto činy se nezapomene."
 south_asia.0040.c: "Tohle se mě opravdu netýká."
 south_asia.0040.tt: "Několik tvých [Concept('counties','hrabství')|E] může přijmout théravádu."
 south_asia.0041.t: "Dar ze zahraničí"
 south_asia.0041.desc: "Mou pozornost upoutá až pátý mnich, který toho dne projde mým dvorem. Jen zřídkakdy lze příslušníky této víry vídat tak hojně a otevřeně. Krátké vyptávání brzy odhalí příčinu tohoto nového přívalu věřících do mých zemí.\n\n[proselytiser.GetFullName], [Select_CString(proselytiser.IsFemale, 'cizí vládkyně', 'cizí vládce')], šíří ve svém panství [proselytiser.GetFaith.GetName] a dozvěděl se také o strastech, jimiž naše společná víra v mém panství během minulých generací procházela.\n\nProto sem [proselytiser.GetFirstNameNoTooltip] [Select_CString(proselytiser.IsFemale, 'vyslala', 'vyslal')] mnoho bhikkhů, aby pomohli šířit a podporovat víru v jejích dávných domovinách."
 south_asia.0041.a: "Na toto gesto nezapomenu."
 south_asia.0050.t: "Panství Hindustánu"
 south_asia.0050.desc: "Maurjové, Kušánové, Guptové, Pálové a Pratihárové — po tisíciletí byla Indoganžská nížina sídlem i bojištěm mnoha velkých říší. Někteří vládci přišli z ciziny, mnohem více jich však vzešlo přímo z indického subkontinentu.\n\nRod [founder.GetHouse.GetNameNoTooltip] sice není tak starobylý, ale tam, kde všechny tyto dynastie selhaly, jsme si vybudovali vlastní panství. Nyní nastal čas vytvořit říši a státní správu schopnou vládnout nesčetným národům a vyznavačům rozličných věr, kteří tyto země obývají."
 south_asia.0050.a: "V Dillí povstane nové hlavní město!"
 south_asia.0050.b: "Centrem říše bude Láhaur."
 south_asia.0050.c: "Říši budeme spravovat z [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 south_asia.0051.t: "Sultanát [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 south_asia.0051.desc: "Donesly se k nám zprávy, že rod [founder.GetHouse.GetNameNoTooltip] upevnil svou vládu nad Indoganžskou nížinou a na troskách někdejších hinduistických a buddhistických dynastií založil novou islámskou říši.\n\n[founder.GetFullName] nyní usiluje o císařskou vládu nad celou Indií z [founder.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a [founder.GetFirstNameNoTooltip] si rychle získává obavy i obdiv okolí."
 south_asia.0051.a: "$middle_europe_decisions.0016.a$"
 south_asia.0051.b: "Ty domýšlivé povýšence rozdrtíme!"
 south_asia.0051.c: "Konečně zastánce pravé víry!"
 south_asia.0051.d: "Znepokojivý vývoj"
 south_asia.0051.e: "$middle_europe_decisions.0016.d$"
