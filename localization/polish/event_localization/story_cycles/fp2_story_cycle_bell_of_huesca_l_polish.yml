l_polish:
 bell_special_yearly.1000.t: "Zvon z [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 bell_special_yearly.1000.desc: "[steward.GetCouncilTitle] [steward.GetFirstName] mi navrhuje, abych si [Select_CString(ROOT.Char.IsFemale,'prohlédla','prohlédl')] nedaleký opuštěný kostel z dob Vizigótů.\n\nPod valenou klenbou a mezi podkovovitými oblouky se tyčí kdysi nádherná zvonice s několika poničenými zvony, kterým chybějí srdce.\n\nKdyž procházím ruinou, zaslechnu klapot kopyt. Otvorem ve zdi zahlédnu, jak se blíží [faction_member_1.GetTitledFirstName]. Snad si [Select_CString(faction_member_1.IsFemale,'vyhlédla','vyhlédl')] tohle místo jako úkryt pro zrádnou frakci, ke které patří?"
 bell_special_yearly.1000.a: "[Select_CString(ROOT.Char.IsFemale,'Mohla bych','Mohl bych')] [Select_CString(faction_member_1.IsFemale,'ji','ho')] zabít, když tu není nikdo, kdo by mě viděl!"
 bell_special_yearly.1000.a.tt: "Připlížíš se k [faction_member_1.GetTitledFirstName] a pokusíš se [Select_CString(faction_member_1.IsFemale,'ji','ho')] zabít"
 bell_special_yearly.1000.b: "Raději se potichu vytratím."
 bell_special_yearly.1500.desc: "Schovávám se v předsíni kostela a slyším jen zběsilý tlukot svého vražedného srdce a kroky postavy [faction_member_1.GetTitledFirstName].\n\nJakmile [faction_member_1.GetTitledFirstName] vstoupí do místnosti, udeřím [Select_CString(faction_member_1.IsFemale,'ji','ho')] kusem suti do hlavy a rána [Select_CString(faction_member_1.IsFemale,'ji','ho')] srazí k zemi.\n\nKdyž znovu a znovu zasazuji rány, krví zbarvený pohled mi na okamžik zastře zvláštní představa. Sen o tom, že tahle stará zvonice znovu zazní hudbou a hlavami všech mých nepřátel jako srdci zvonů."
 bell_special_yearly.1500.a: "Do mého souboru přibude další svárlivec!"
 bell_special_yearly.1500.a.tt: "Vyhlédneš si další oběť."
 bell_special_yearly.1500.discovery.tt: "Zvyšuje se riziko odhalení"
 bell_special_yearly.1500.b: "Je čas vrátit se domů a odpočinout si."
 bell_special_yearly.1500.b.tt: "Přestaneš shromažďovat hlavy pro Zvon."
 bell_special_yearly.2000.desc: "Na můj rozkaz mě má navštívit [Select_CString(faction_member_2.IsFemale,'odporná','odporný')] [faction_member_2.GetTitledFirstName]. Místem setkání je [ROOT.Char.Custom('FortifiedBuilding')]. Převléknu se za trubadúra a v kostýmu deklamuji: „[ROOT.Char.GetTitledFirstName] žádá, abyste si [Select_CString(faction_member_2.IsFemale,'vyslechla','vyslechl')] tuto úžasnou novou skladbu, která vznikla právě zde v hlavním městě!“\n\nJakmile je [faction_member_2.GetTitledFirstName] uvnitř, donutím [Select_CString(faction_member_2.IsFemale,'ji','ho')] odejít se mnou do komnaty, kde zůstaneme sami. Tam celé hodiny hraji ty nejobyčejnější #italic cansos#!, dokud [Select_CString(faction_member_2.IsFemale,'ta ubožačka','ten ubožák')] neusne.\n\nPracuji rychle — nepřítele uškrtím jednou ze strun loutny, hlavu schovám [Select_CString(ROOT.Char.IsFemale,'pod šaty','pod plášť')] a zmizím chodbami dřív, než kdokoli stačí mrknout."
 bell_special_yearly.2000.a: "Zvon ještě nemá dost hlav!"
 bell_special_yearly.2000.b: "Tak krásný zločin si nesmím zkazit dalším riskováním."
 bell_special_yearly.3000.desc: "Vnutím [faction_member_3.GetTitledFirstName] svou královskou návštěvu pod záminkou, že se pokusím zmírnit napětí s odbojnou frakcí, ke které patří. Místem návštěvy je [faction_member_3.Custom('FortifiedBuilding')]. Během přestávky v jednání si prohlížím hudební místnosti a požádám, aby mě nechali o samotě hrát.\n\nHudební pokoj má velké okno nad zahradou sídla — [faction_member_3.Custom('FortifiedBuilding')]. Hned vedle něj stojí pořádně velké varhany. Ten okamžik je až příliš dokonalý.\n\nKdyž [faction_member_3.GetFirstNameNoTooltip] vyjde pod okno, aby na chvíli [Select_CString(faction_member_3.IsFemale,'našla','našel')] klid, strčím do varhan. Sřítí se vzduchem a rozdrtí [Select_CString(faction_member_3.IsFemale,'ji','ho')] pod sebou. S chichotáním spěchám pro hlavu dřív, než si někdo smrti všimne."
 bell_special_yearly.3000.a: "Zvon bude nádherný!"
 bell_special_yearly.3000.b: "Nehody s varhanami se přece stávají každý den."
 bell_special_yearly.4000.desc: "Povaluji se na zahradě a bezmyšlenkovitě si hraji s růžemi, jednu po druhé jim utrhávám hlavičky.\n\nCo jen se zvonicí? Zazní z ní někdy vůbec hudba?"
 bell_special_yearly.4000.desc_discoverer: "\n\nZatímco o tom přemítám, zahlédnu, jak mě ze zahrady pozoruje [bell_discoverer.GetTitledFirstName], [Select_CString(bell_discoverer.IsFemale,'jedna z těch ubožaček','jeden z těch ubožáků')], co stále truchlí nad jednou z obětí zmizení. Zasměji se a skoro mám chuť [Select_CString(bell_discoverer.IsFemale,'jí','mu')] to rovnou říct."
 bell_special_yearly.4000.a: "V kostele uspořádám velkolepý koncert!"
 bell_special_yearly.4000.a.tt: "Všichni se dozvědí o tvých vraždách."
 bell_special_yearly.4000.b: "O mých soukromých radovánkách nemusí nikdo vědět."
 bell_discovery_success_effect: "Zvon zůstane tajemstvím"
 bell_discovery_failure_effect: "Zvon je odhalen"
 bell_special_yearly.5000.desc: "Jedné noci vyrazím ke svému Zvonu a chci se pokochat jeho nádhernou zvráceností. K mému překvapení už při vstupu do ruiny zahlédnu mihotání pochodní.\n\nNejprve mě napadne, že duchové Vizigótů nejsou nadšení z toho, jak jsem znesvětil jejich kostel, ale pak [bell_discoverer.GetTitledFirstName] odhrne kápi. „Tohle musí být [bell_discoverer.GetFaith.NegativeAfterLife] a já v něm po odhalení té ohavnosti, která je tvým dílem, budu žít už navždy. Přidáš se ke svým obětem, nestvůro!“\n\nNa okamžik jen ucítím ocel, jak mi projede krkem. Pak už nic."
 bell_special_yearly.5000.a: "Zahraj mi na rozloučenou, [bell_discoverer.GetTitledFirstNameNoTooltip]."
 bell_special_yearly.6000.desc: "Pro celý svůj dvůr pořádám ve vizigótské ruině koncert a slibuji noc plnou hudby ve starém kostele osvětleném svícemi.\n\nVečer začíná obvyklou kratochvílí s potulnými pěvci, zatímco několik hostů si stěžuje na podivný zápach. Posloucháme lehké melodie fléten a drnkacích nástrojů a s postupující nocí jsou skladby čím dál tesknější.\n\nPři finále sluhové na můj příkaz vyrazí ke zvonům a rozezní je do rytmu poslední písně. K hlasům sboru se přidá křik mých dvořanů, když všichni spatří mé drnčící, vyzvánějící hlavy!"
 bell_special_yearly.6000.a: "Taková hudba!"
 bell_special_yearly.6000.b: "Kdo se mi vzepře, přidá se k nim!"
