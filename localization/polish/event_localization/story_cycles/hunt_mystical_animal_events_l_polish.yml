l_polish:
 start_hunt_mystical_animal_story_cycle_effect.tt: "#EMP Nedám si pokoj, dokud ho nenajdu!#!"
 hunt_mystical_animal.1001.t: "[ROOT.Char.Custom('GetLegendaryColor')|U] [ROOT.Char.Custom('GetAnimalType')|U]"
 hunt_mystical_animal.1001.desc: "Ve snu se mi zjevuje nepolapitelná šelma. Z temných hlubin jejích očí cítím odsuzující pohled, zatímco [ROOT.Char.Custom('GetAnimalChargePresent')] kolem a okázale vystavuje svou bezchybnou [ROOT.Char.Custom('GetLegendaryColor')] srst.\n\nStojíme v tichých [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')] pod naběhlým měsícem. Ať se snažím sebevíc, ke své kořisti se nedokážu ani o píď přiblížit.\n\nKdyž se ze snu konečně vydrápu, cítím, jak mé odhodlání sílí..."
 hunt_mystical_animal.1001.a: "Už mi nebude unikat dlouho!"
 hunt_mystical_animal.1002.desc: "Projíždíme [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] v [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip], když cesta náhle zahne a já ho znovu spatřím, jak se třpytí ve slunci — [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')].\n\nOtočím se, abych upozornil ostatní, ale když se podívám zpět, [ROOT.Char.Custom('GetAnimalType')] už je pryč..."
 hunt_mystical_animal.1002.a: "Vysmívá se mi!"
 hunt_mystical_animal.1003.desc: "Od chvíle, kdy jsem zahájil pátrání, přicházejí ze všech koutů [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] zprávy o spatření [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')].\n\nProjít všechna svědectví a oddělit skutečnost od výmyslů je nesmírný úkol. Kéž by jen těm zprávám šlo více věřit..."
 hunt_mystical_animal.1003.a: "Najmu lidi, aby po něm pátrali!"
 hunt_mystical_animal.1003.b: "Tohle je příliš velký úkol. Nechci s tím mít nic společného."
 hunt_mystical_animal.1003.b.tt: "Vzdáš pátrání po #V [THIS.Char.Custom('GetLegendaryColor')] [THIS.Char.Custom('GetAnimalType')]#!"
 hunt_mystical_animal.1003.c: "Ať to roztřídí [steward.GetCouncilTitle]."
 hunt_mystical_animal.1003.d: "Zvládnu to. Já #EMP musím#!!"
 hunt_mystical_animal.1003.e: "[m_hunt.GetTitledFirstNameNoTooltip], sestav pátrací skupinu!"
 hunt_mystical_animal.1004.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ [m_hunt.GetTitledFirstName] sotva skrývá vzrušení. „Máme zprávy, že lidé zahlédli [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')] v [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')] u [legendary_county.GetCountyData.GetCapital.GetNameNoTooltip]!“\n\n„Někteří tvrdí, že v jeho stopách přichází nemoc, jiní zase, že přináší blahobyt, ale všichni se zdají být celkem přesvědčeni, že je někde poblíž.“\n\nJe tady? V [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip]?!"
 hunt_mystical_animal.1004.a: "Vyjíždíme!"
 hunt_mystical_animal.1004.a.tt: "Tentokrát mi neunikne."
 hunt_mystical_animal.1004.a.success: "Najdeš #V [THIS.Char.Custom('GetLegendaryColor')] [THIS.Char.Custom('GetAnimalType')]#!"
 hunt_mystical_animal.1004.b: "Nenechám se takhle vodit za nos."
 hunt_mystical_animal.1005.desc: "\n\nV jediném okamžiku [activity.Custom('GetAnimalType')] [activity.Custom('GetAnimalChargePresent')] pryč do [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')]: zmizí stejně rychle, jako se objevil."
 hunt_mystical_animal.1005.a: "Proklatě! Já tě #EMP dostanu#!, ty stvůro!"
 hunt_mystical_animal.1006.desc: "Zahledím se do mlhavého rána a na okraji [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] spatřím [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')], jak tam sedí a #EMP vysmívá se#! mi.\n\nOdvrátím se, jen abych se ocitl tváří v tvář látce svých prostěradel, a když se z nich pokouším vymotat, vrazím do hlavy [ROOT.Char.Custom('GetAnimalType')] připevněné k trámu.\n\nZavřu oči, ale úniku není. [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')] je tam — a směje se mi!"
 hunt_mystical_animal.1006.a: "JÁ TĚ DOSTANU, TY STVŮRO!"
 hunt_mystical_animal.1006.b: "Ty! Ty jsi teď [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')]! Vrať se sem!"
 hunt_mystical_animal.1007.desc: "Pročesávám krajinu ve snaze vypátrat nepolapitelnou [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] a obracím divočinu v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] vzhůru nohama — tentokrát mi neunikne!\n\nSleduji stopy do [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTree')] a pronikám čím dál hlouběji do zeleně, když se okolí začne podivně proměňovat.\n\nVidím houby velké jako [ROOT.Char.Custom('ResidenceBuildingPlural')], stromy malé jako myši a housenky velikosti koní."
 hunt_mystical_animal.1007.a: "Ať zalezeš do jakékoli díry, najdu tě!"
 hunt_mystical_animal.1007.b: "Ach, ty houby... Vypadají chutně."
 hunt_mystical_animal.1007.b.success: "Mňam!"
 hunt_mystical_animal.1007.b.failure: "Uf, nějak mi není dobře..."
 hunt_mystical_animal.1008.desc: "Dny plynou a o [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')] neslyším ani slovo. Začínám být neklidný...\n\nNěkdo ho přece musel vidět! Co všichni ti rolníci, kterých jsou [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')] plné? Možná bych je měl požádat o pomoc..."
 hunt_mystical_animal.1008.a: "Rozešlete výzvu!"
 hunt_mystical_animal.1008.b: "Tak hluboko neklesnu."
 hunt_mystical_animal.1008.c: "Pošlu [knight.GetFirstNameNoTooltip]."
 hunt_mystical_animal.1009.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], to vaše pátrání po obyčejném zvířeti... Musím přiznat, že mi dělá starosti.“\n\n[court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přistoupí, zatímco probírám zprávy o spatření [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')].\n\n„Je zřejmé, že cokoli, co dokáže odvést tolik pozornosti, mohl seslat [ROOT.Char.GetFaith.DevilName]. Nepředpokládejte, že jeho existence je znamením od [ROOT.Char.GetFaith.HighGodNameAlternate]!“"
 hunt_mystical_animal.1009.a: "[ROOT.Char.Custom('GetAnimalType')] je poslem od [ROOT.Char.GetFaith.HighGodName]!"
 hunt_mystical_animal.1009.a.success: "„Možná máte pravdu...“"
 hunt_mystical_animal.1009.a.failure: "„O čem to vůbec mluvíte?!“"
 hunt_mystical_animal.1009.b: "Do toho ti nic není."
 hunt_mystical_animal.1009.c: "Máš pravdu, co mě to jen napadlo?"
 hunt_mystical_animal.9001.desc: "Sleduji stopy čím dál hlouběji do [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], když kolem mě náhle všechno ztichne.\n\nJako by se zrodil přímo ze vzduchu, stojí přede mnou [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')], srst se mu leskne ve slunci a oči má hluboké jako sny. Zvedám luk..."
 hunt_mystical_animal.9001.a: "... a vypustím šíp."
 hunt_mystical_animal.9002.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ začne [m_hunt.GetTitledFirstName] váhavě. „Jeden místní rolník vám poslal dar. Tvrdí, že toto [activity.Custom('GetLegendaryColor')] zbarvení je přirozené, ale něco takového jsem ještě neviděl!“\n\nS rostoucími obavami přistoupím k balíku — a tam leží [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')], kterého jsem celé roky lovil."
 hunt_mystical_animal.9002.a: "Tohle musí být nějaký vtip...!"
