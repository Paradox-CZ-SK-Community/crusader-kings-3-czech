l_polish:
 pet_animal.0001.t: "Kočka"
 pet_animal.0001.desc: "Když mi [ROOT.Char.Custom('CatStoryHerHim')] spokojeně přede na klíně, přemýšlím, jaké jméno zvolit. Něco historického? Něco, co odkazuje na [ROOT.Char.Custom('CatFurColor')] srst? Nebo něco, co vystihuje ten uklidňující pocit, když [ROOT.Char.Custom('CatStoryHerHim')] škrábu za uchem?\n\nUž vím! Bude se jmenovat..."
 pet_animal.0001.a: "To je skvělé jméno!"
 pet_animal.0101.t: "[ROOT.Char.Custom('CatStoryName')]: Dárce"
 pet_animal.0101.desc: "Když procházím kolem, sledují mě dvě [ROOT.Char.Custom('CatEyeColor')] oči. Ticho přeruší tiché mňouknutí a [ROOT.Char.Custom('CatStoryName')] mi vzápětí skočí po kotníku."
 pet_animal.0101.desc_old: "Nejlepší léta už jsou možná pryč, ale věk [ROOT.Char.Custom('CatStoryHerHim')] nikdy nezastavil!"
 pet_animal.0101.desc_young: "Mládí nic nemění na tom, jaká je to šelma!"
 pet_animal.0101.desc_middle: "Je právě v nejlepších letech, přesto na mně nezanechá jediný škrábanec."
 pet_animal.0101.desc_ending: "\n\nKdyž [ROOT.Char.Custom('CatStoryName')] odběhne, všimnu si na tom místě lesklého dárku."
 pet_animal.0101.a_female: "Děkuji, milá slečno!"
 pet_animal.0101.a_male: "Děkuji, milý pane!"
 pet_animal.0103.t: "[ROOT.Char.Custom('CatStoryName')]: Okouzlený vazal"
 pet_animal.0103.desc: "Když vyjdu ven, spatřím [vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))], jak dřepí vedle [ROOT.Char.Custom('CatStoryName')] a něžně hladí kočičí hlavu.\n\n„Tohle je opravdu nádherná kočka, [ROOT.Char.Custom('FormOfAddressForLiege')].“"
 pet_animal.0103.a: "Máš velmi dobrý postřeh!"
 pet_animal.0104.t: "[ROOT.Char.Custom('CatStoryName')]: Konejšivé předení"
 pet_animal.0104.desc: "Po dalším vyčerpávajícím dni se zhroutím do křesla. Jak dlouho to ještě dokážu snášet?\n\nNáhle zaslechnu tiché mňouknutí. [ROOT.Char.Custom('CatStoryName')] mi vyskočí na klín a začne příst. Chvíli jen sedím, naslouchám uklidňujícímu zvuku a hladím [ROOT.Char.Custom('CatFurColor')] srst."
 pet_animal.0104.a: "Ještě nějakou dobu to zvládnu."
 pet_animal.0105.t: "[ROOT.Char.Custom('CatStoryName')]: Odhalené tajemství"
 pet_animal.0105.desc_opening: "#EMP Mňau!#!\n\nPohlédnu dolů a zjistím, že mi [ROOT.Char.Custom('CatStoryName')] k nohám upustil svitek, zapečetěný nezaměnitelným způsobem [person.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('person'))]. Zvědavost zvítězí a já přelétnu text očima...\n\n"
 pet_animal.0105.desc_murder: "„...vražda, kterou jsem [Select_CString(person.IsFemale,'spáchala','spáchal')], mě tíží a...“"
 pet_animal.0105.desc_lover: "„...láska, kterou chovám k někomu jinému...“"
 pet_animal.0105.desc_homosexual: "„...touha, kterou cítím k lidem stejného pohlaví...“"
 pet_animal.0105.desc_deviant: "„...zvrácenosti, kterých jsem se [Select_CString(person.IsFemale,'dopustila','dopustil')]...“"
 pet_animal.0105.desc_cannibal: "„...lidské maso jsem [Select_CString(person.IsFemale,'ochutnala','ochutnal')]...“"
 pet_animal.0105.desc_murder_attempt: "„...když jsem se [Select_CString(person.IsFemale,'pokusila','pokusil')] připravit někoho o život...“"
 pet_animal.0105.desc_non_believer: "„...protože [person.GetFaith.HighGodName] ve mně nevzbuzuje víru...“"
 pet_animal.0105.desc_incest: "„...že tuto touhu cítím k někomu z vlastní rodiny...“"
 pet_animal.0105.desc_witch: "„...můj čarodějnický sabat bude...“"
 pet_animal.0105.desc_fallback: "„...uchovávat toto tajemství mě tíží...“"
 pet_animal.0105.a: "A přitom to [person.GetFirstNameNoTooltip] celou dobu [Select_CString(person.IsFemale,'skrývala','skrýval')]...!"
 pet_animal.0105.b: "Svět se to musí dozvědět."
 pet_animal.0106.t: "[ROOT.Char.Custom('CatStoryName')]: Přecitlivělost"
 pet_animal.0106.desc: "„[ROOT.Char.GetFirstNameNoTooltip], ta kočka musí pryč!“\n\n[spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spouse'))], drží [ROOT.Char.Custom('CatStoryName')] za kůži na krku. Oči má zarudlé a z nosu teče. „Už to nemůžu vydržet. Když je [ROOT.Char.Custom('CatStoryName')] nablízku, skoro nemůžu dýchat!“"
 pet_animal.0106.a: "Dám [ROOT.Char.Custom('CatStoryName')] [receiver_1.GetFirstNameNoTooltip]..."
 pet_animal.0106.b: "[receiver_2.GetFirstNameNoTooltip] by se nějaký společník hodil..."
 pet_animal.0106.c: "[receiver_3.GetFirstNameNoTooltip] se o [ROOT.Char.Custom('CatStoryName')] dobře postará..."
 pet_animal.0106.d: "[ROOT.Char.Custom('CatStoryName')] nikam nepůjde!"
 pet_animal.0106.e: "Já... asi se [ROOT.Char.Custom('CatStoryName')] opravdu musím vzdát..."
 pet_animal.0107.t: "[ROOT.Char.Custom('CatStoryName')]: Kočka"
 pet_animal.0107.desc: "„[giver.Custom2('RelationToMe', SCOPE.sC('spouse'))] už přítomnost [ROOT.Char.Custom('CatStoryName')] nesnese... Svěřím tedy péči tobě.“\n\n[giver.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('giver'))], ke mně natáhne kočku s [receiver.Custom('CatFurColor')] srstí. „S [ROOT.Char.Custom('CatStoryName')] budeš mít skvělou společnost... opravdu skvělou.“"
 pet_animal.0107.a: "Děkuji, budu si [ROOT.Char.Custom('CatStoryName')] opatrovat!"
 pet_animal.0107.b: "Děkuji. Určitě se [ROOT.Char.Custom('CatStoryName')] bude hodit."
 pet_animal.0108.t: "[receiver.Custom('CatStoryName')]: Život bez tebe"
 pet_animal.0108.t_dead: "Život bez tebe"
 pet_animal.0108.desc_opening: "Navštívím [receiver.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))], abych [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], jak se [receiver.Custom('CatStoryName')] v novém domově daří.\n\n"
 pet_animal.0108.desc_alive_landed: "Před [receiver.Custom('ResidenceBuilding')] mě přivítá [receiver.GetTitledFirstName] s [receiver.Custom('CatFurColor')] kočkou v náručí. „Všechno je v pořádku –"
 pet_animal.0108.desc_alive: "Venku mě přivítá [receiver.GetTitledFirstName] s [receiver.Custom('CatFurColor')] kočkou v náručí. „Všechno je v pořádku –"
 pet_animal.0108.desc_alive_1: "[receiver.Custom('CatStoryName')] pořádá hony na místní ptactvo!“"
 pet_animal.0108.desc_alive_2: "[receiver.Custom('CatStoryName')] se dokonce snaží slepicím upravovat peří!“"
 pet_animal.0108.desc_dead_opening: "Navštívím [receiver.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))], abych [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], jak se kočce v novém domově daří.\n\n"
 pet_animal.0108.desc_dead_landed: "Před [receiver.Custom('ResidenceBuilding')] mě přivítá [receiver.GetTitledFirstName], ale po kočce není ani stopy."
 pet_animal.0108.desc_dead: "Venku mě přivítá [receiver.GetTitledFirstName], ale po kočce není ani stopy."
 pet_animal.0108.desc_dead_ending: "„Ach, určitě si někde hraje...“\n\n[receiver.GetTitledFirstNameNoTooltip] se mi úporně vyhýbá pohledem."
 pet_animal.0108.a: "To se mi ulevilo!"
 pet_animal.0108.b: "Kde je moje kočka?!"
 pet_animal.0109.t: "[ROOT.Char.Custom('CatStoryName')]: Postrach hlodavců"
 pet_animal.0109.desc: "Když ke mně [ROOT.Char.Custom('CatStoryName')] přinese další mrtvou krysu, nezbývá mi než obdivovat lovecké umění téhle kočky. V [ROOT.Char.Custom('ResidenceBuilding')] snad nikdy nebylo tak málo hlodavců!"
 pet_animal.0109.a: "Jen tak dál!"
 pet_animal.0110.t: "[ROOT.Char.Custom('CatStoryName')]: Pohroma"
 pet_animal.0110.desc: "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází s hněvem v očích a kočkou sevřenou v ruce za kůži na krku. Když mi ji strčí před obličej, poznám [ROOT.Char.Custom('CatStoryName')]!\n\n„Tohle malé monstrum se mi hrabalo ve věcech – co nerozdráplo na kusy, to pochcalo!“"
 pet_animal.0110.a: "Nahradím ti škodu!"
 pet_animal.0110.b: "Je to jen kočka..."
 pet_animal.0197.t: "[ROOT.Char.Custom('CatStoryName')]: Pryč"
 pet_animal.0197.desc_court_5020: "Od chvíle, kdy omezuji, kam všude může [ROOT.Char.Custom('CatStoryName')] chodit, se vídáme čím dál méně.\n\nUž je to několik týdnů od našeho posledního setkání a bojím se, že [ROOT.Char.Custom('CatStoryName')] už se nevrátí.\n\nMí dvořané jsou očividně rádi, že mají komnaty bez chlupů, ale můj klín nikdy nepůsobil tak prázdně..."
 pet_animal.0197.desc: "[ROOT.Char.Custom('CatStoryName')] se v poslední době toulá čím dál dál od domova a vrací se po stále delší době.\n\nUž je to několik týdnů od našeho posledního setkání a bojím se, že [ROOT.Char.Custom('CatStoryName')] už se nevrátí."
 pet_animal.0197.a: "Prosím, vrať se, [ROOT.Char.Custom('CatStoryName')]!"
 pet_animal.0199.t: "[ROOT.Char.Custom('CatStoryName')]: Den smutku"
 pet_animal.0199.desc: "[ROOT.Char.Custom('CatStoryName')] už má nejlepší léta za sebou a když se mi vyškrábe na klín, cítím, jak se celé tělíčko třese.\n\nJemně hladím [ROOT.Char.Custom('CatFurColor')] srst a dlouho do noci poslouchám předení. Když se však nakonec rozhostí ticho, vím, že [ROOT.Char.Custom('CatStoryName')] už nikdy neotevře oči."
 pet_animal.0199.a: "Budeš mi chybět, [ROOT.Char.Custom('CatStoryName')]!"
 pet_animal.0199.b: "Zůstaneš navždy po mém boku!"
 pet_animal.0199.b.tt: "Získáš malou vyčiněnou kůži jako [Concept('court_artifact','dvorský artefakt')|E]"
 pet_animal.0200.t: "[ROOT.Char.Custom('CatStoryName')]: Žuch!"
 pet_animal.0200.desc: "Sedím u stolu a pročítám zprávy, které mi dorazily z různých koutů panství. [ROOT.Char.Custom('CatStoryName')] vyskočí vedle mě, najde si teplý sluneční paprsek a spokojeně se stočí vedle mých listin.\n\nRukou přejedu po [ROOT.Char.Custom('CatFurColor')] srsti a [ROOT.Char.Custom('CatStoryName')] se v odpověď rozkošnicky protáhne. A pořádně!\n\nJak se ukáže, až #EMP příliš#! pořádně. [ROOT.Char.Custom('CatStoryName')] se překulí přes okraj stolu a dopadne na všechny čtyři. Pak na mě vrhne povýšený pohled – jako by to snad byla #EMP moje#! vina – a uraženě odkráčí."
 pet_animal.0200.a: "Ha! Ty popletko!"
 pet_animal.0201.t: "[ROOT.Char.Custom('CatStoryName')]: Na hraně"
 pet_animal.0201.desc: "Byl to dlouhý den. U psacího stolu si natáhnu nohy a mé unavené tělo si dnes poprvé konečně odpočine. Na druhé straně místnosti se [ROOT.Char.Custom('CatStoryName')] promenáduje po polici a prozkoumává nejvyšší zákoutí komnaty. Výšky jsou zkrátka neodolatelné –\n\nMůj [cat_artifact.GetName]! Stojí na samém konci police a [ROOT.Char.Custom('CatStoryName')] míří přímo k němu, kočičí oči doširoka rozevřené zájmem. S hrůzou sleduji, jak se natahuje tlapka..."
 pet_animal.0201.a: "Ne!"
 pet_animal.0201.a.tt: "Zachytit artefakt!"
 pet_animal.0201.a.success: "Podaří se ti artefakt zachytit"
 pet_animal.0201.a.failure: "[cat_artifact.GetNameNoTooltip] se zřítí na podlahu"
 pet_animal.0201.b: "Ale ne, ty potvoro–"
 pet_animal.0201.b.success: "Podaří se ti [ROOT.Char.Custom('CatStoryName')] chytit"
 pet_animal.0201.b.failure: "[ROOT.Char.Custom('CatStoryName')] se na tebe zlobí"
 pet_animal.0201.b.tt: "Chytit [ROOT.Char.Custom('CatStoryName')]!"
 pet_animal.0202.t: "[ROOT.Char.Custom('CatStoryName')]: Milostné hrátky"
 pet_animal.0202.desc: "Svíčky poblikávají a prostěradla šustí, zatímco se s [cat_lover.GetFirstName] proplétáme v posteli. Snažíme se být potichu, ale občas se některé zvuky nesou místností až příliš zřetelně! Zalapání po dechu, vzdechy, ... mňoukání?\n\nPrudce se posadím a spatřím [ROOT.Char.Custom('CatStoryName')], jak si spokojeně hoví na polštáři hned vedle nás a blaženě přede. Nevěřícně zírám s otevřenou pusou a přemýšlím, co s tím, zatímco si kočka začne hlasitě čistit tlapku.\n\n[cat_lover.GetFirstNameNoTooltip|U] na mě povýšeně pohlédne. Napůl srdce do spokojené šelmy šťouchnu, jenže [ROOT.Char.Custom('CatStoryName')] se překulí na záda a připraví se ke hře."
 pet_animal.0202.a: "„No tak už... #EMP kšá!#!“"
 pet_animal.0202.a.success: "Podaří se ti kočku odehnat"
 pet_animal.0202.a.failure: "[ROOT.Char.Custom('CatStoryName')] se tvrdošíjně odmítá hnout"
 pet_animal.0202.b: "No, bylo by neslušné rušit..."
 pet_animal.0203.t: "[ROOT.Char.Custom('CatStoryName')]: Zrada!"
 pet_animal.0203.desc: "Slyším snad nějaké #EMP šišlání#!? A k tomu... tlumené mňoukání?\n\nVe výklenku sedí [random_courtier.GetFirstName] a v náručí chová [ROOT.Char.Custom('CatStoryName')]. Kočka k [random_courtier.GetFirstNameNoTooltip] zbožně vzhlíží, tlapky schoulené jako nemluvně, zatímco ji okouzlený dvořan něžně kolébá.\n\nPozdravím. Člověk mi odpoví, ale kočka jen spokojeně přede a zaboří tvář do ohbí paže. Ač se tomu bráním, přece jen mě píchne osten žárlivosti."
 pet_animal.0203.a: "Hej! Sem s mojí kočkou!"
 pet_animal.0203.b: "No dobře, asi nejsem nejoblíbenější..."
 pet_animal.0204.t: "[ROOT.Char.Custom('CatStoryName')]: Kočičí lékař"
 pet_animal.0204.desc: "Lehce se zachvěju a přitáhnu si přikrývky těsněji k tělu. Tahle mizerná choroba mě už několik dní souží a vůbec to nevypadá, že by chtěla polevit.\n\nKdyž si upravuji přikrývky, veselé mňouknutí ohlásí příchod [ROOT.Char.Custom('CatStoryName')]. Kočka si mě prohlédne s náznakem obav a důkladně obejde celé mé lůžko.\n\nNakonec s drobným, samolibým #EMP mrrp!#! začne tlapkami hníst přikrývku a posléze se stočí v ohbí mého lokte."
 pet_animal.0204.a: "Jé. Tak ty mi děláš společnost, [ROOT.Char.Custom('CatStoryName')]?"
 pet_animal.0205.t: "[ROOT.Char.Custom('CatStoryName')]: Vyrušení"
 pet_animal.0205.desc: "Usednu a pokynem vyzvu členy rady, aby učinili totéž. Jsou tu nejmocnější lidé celého panství. Otevřu ústa, abych [Select_CString(ROOT.Char.IsFemale,'promluvila','promluvil')], a...\n\n#EMP „Mňau!“#! Rozhlédnu se po viníkovi. #EMP „Mňau!“#!\n\n[ROOT.Char.Custom('CatStoryName')] vyskočí na dlouhý stůl a spokojeně přede. Radostně mi strčí hlavou do dlaně, zatímco [cat_disapprover.GetFirstName] nesouhlasně sevře rty.\n\n„Nemohli bychom to zvíře nechat odvést, [ROOT.Char.Custom('FormOfAddressForLiege')]? Musíme projednat velmi důležité záležitosti.“"
 pet_animal.0205.a: "Respektuj [ROOT.Char.Custom('CatStoryName')], nebo přijdeš o jazyk."
 pet_animal.0205.b: "Služebnictvo! Odneste tu kočku!"
 pet_animal.0205.c: "Ale no tak, vůbec nepřekáží. Může tu zůstat."
 pet_animal.0205.c.tt: "Pojď sem, ty chlupatá kuličko!"
 dog_got_pregnant_tooltip: "Čeká štěňata!"
 pet_animal.1001.t: "Pes"
 pet_animal.1001.desc: "Když psa hladím po hlavě, spokojeně vrtí ocasem. Jaké jméno by mu slušelo? Něco historického? Něco, co odkazuje na [ROOT.Char.Custom('DogFurColor')] srst? Je to důležité rozhodnutí, ale když se pes převrátí na záda a nastaví mi břicho k drbání, na chvíli ztratím nit.\n\nPočkat, už vím! Bude se jmenovat..."
 pet_animal.1101.t: "[ROOT.Char.Custom('DogStoryName')]: Bok po boku"
 pet_animal.1101.desc: "Každodenní procházky s [ROOT.Char.Custom('DogStoryName')] se už staly zvykem a [Select_CString(ROOT.Char.IsFemale,'nejsem si jistá','nejsem si jistý')], kdo z nás si čerstvého vzduchu a slunce užívá víc!\n\n[ROOT.Char.Custom('DogStoryName')] vyrazí kupředu, ohlédne se na mě a štěkne: #EMP Tak dělej!#!"
 pet_animal.1101.a: "Tak jdeme dál!"
 pet_animal.1102.t: "[ROOT.Char.Custom('DogStoryName')]: Na útěku"
 pet_animal.1102.desc: "Vyjedu si na koni a [ROOT.Char.Custom('DogStoryName')] běží vedle mě, když náhle odběhne do [ROOT.Char.Custom('TerrainType')].\n\nMůj doprovod mě ujišťuje, že se vrátí, ale co když ne?!"
 pet_animal.1102.a: "K noze! [ROOT.Char.Custom('DogStoryName')], říkám k noze! Počkej na mě!"
 pet_animal.1102.a.tt: "Pokusíš se [ROOT.Char.Custom('DogStoryName')] chytit"
 pet_animal.1102.b: "Budu trpělivě čekat."
 pet_animal.1102.b.tt: "[ROOT.Char.Custom('DogStoryName')] se určitě vrátí...!"
 pet_animal.1103.desc_followed: "Po několika minutách hledání najdu [ROOT.Char.Custom('DogStoryName')], jak spokojeně vrtí ocasem a tváří se, jako by se vůbec nic nestalo."
 pet_animal.1103.desc: "Nakonec se [ROOT.Char.Custom('DogStoryName')] přikluše zpátky a tváří se, jako by se vůbec nic nestalo."
 pet_animal.1103.desc_ending: "\n\nV tlamě něco svírá a opatrně to položí přede mě. Jsou to dvě zlaté mince."
 pet_animal.1103.a: "Děkuji!"
 pet_animal.1104.desc_followed: "Hledám dlouho, ale po [ROOT.Char.Custom('DogStoryName')] není ani stopy."
 pet_animal.1104.desc: "Ať čekám sebevíc, [ROOT.Char.Custom('DogStoryName')] se nevrací."
 pet_animal.1104.desc_ending: "\n\nKdyž jedeme zpátky, prázdné místo vedle mého koně ve mně vyvolává bolestivé prázdno."
 pet_animal.1104.a: "[ROOT.Char.Custom('DogStoryName')], proč jsi pryč?"
 pet_animal.1105.desc_ending: "\n\nPrávě když už se chystám vzdát, vrátí se jeden z jezdců mého doprovodu se znepokojivou zprávou – přísahá, že zahlédl [rival.Custom2('MyCharacterIntroduction', ROOT.Char)], jak se tu podezřele potuluje!"
 pet_animal.1105.a: "Jestli s tím má [rival.GetFirstNameNoTooltip] něco společného..."
 pet_animal.1106.desc_ending: "\n\nPrávě když se chystám odejít, zničehonic se objeví [friend.Custom2('MyCharacterIntroduction', ROOT.Char)] a vede s sebou [ROOT.Char.Custom('DogStoryName')].\n\n„Myslím, že se ti někdo ztratil!“"
 pet_animal.1106.a: "Jaké štěstí! Mockrát děkuji!"
 pet_animal.1107.t: "[ROOT.Char.Custom('DogStoryName')]: Okouzlený vazal"
 pet_animal.1107.desc: "Narazím na [vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))], jak dřepí vedle [ROOT.Char.Custom('DogStoryName')] a nadšeně drbe psa na břiše.\n\n„Ten váš pes je opravdu okouzlující, [ROOT.Char.Custom('FormOfAddressForLiege')]!“"
 pet_animal.1107.a_female: "To je ale hodná holka!"
 pet_animal.1107.a_male: "To je ale hodný kluk!"
 pet_animal.1108.t: "[ROOT.Char.Custom('DogStoryName')]: Chlupatý ochránce"
 pet_animal.1108.desc: "Jsem ve svých komnatách, když [ROOT.Char.Custom('DogStoryName')] náhle začne štěkat na dveře. Zaslechnu překvapené vyjeknutí, a když dveře prudce otevřu, [agent.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('agent'))], strne uprostřed kroku."
 pet_animal.1108.a: "Co tu děláš? Mluv!"
 pet_animal.1109.t: "[ROOT.Char.Custom('DogStoryName')]: Setkání"
 pet_animal.1109.desc: "Jsem na procházce s [ROOT.Char.Custom('DogStoryName')], když náhle spatřím [other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], jak přichází s nádherným psem s [other_owner.Custom('DogFurColor')] srstí.\n\nNež kdokoli z nás stačí zareagovat, [ROOT.Char.Custom('DogStoryName')] i druhý pes společně odběhnou."
 pet_animal.1109.a: "Určitě budou v pořádku."
 pet_animal.1109.a.tt: "#EMP Doufám#!, že budou v pořádku"
 pet_animal.1110.desc: "Po nějaké době s [other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] oba psy najdeme právě uprostřed vášnivého páření.\n\n"
 pet_animal.1110.desc_your_dog: "„No, [ROOT.Char.GetTitledFirstNameNoTooltip]... Asi nás brzy bude něco pojit!“"
 pet_animal.1110.desc_their_dog: "„[ROOT.Char.Custom('DogStoryName')]! Jak se tohle mohlo stát s tím vořechem...?!“\n\n[other_owner.GetTitledFirstNameNoTooltip] nedokončí větu, ale hněv v očích mluví za vše."
 pet_animal.1110.a: "No... je to jen přirozené."
 pet_animal.1111.desc: "Po nějaké době s [other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] oba psy najdeme uprostřed divoké hry.\n\n„Je radost vidět, jak si [other_owner.Custom('DogStoryName')] takhle užívá!“"
 pet_animal.1111.a: "Naprosto souhlasím!"
 pet_animal.1112.desc: "Po nějaké době s [other_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] oba psy najdeme uprostřed zuřivého boje.\n\n„Odvolej toho svého čokla!“\n\n"
 pet_animal.1112.desc_dead: "Když se mi konečně podaří [ROOT.Char.Custom('DogStoryName')] odtrhnout, pes [other_owner.GetFirstNameNoTooltip] už začíná chladnout."
 pet_animal.1112.desc_alive: "Když se mi konečně podaří [ROOT.Char.Custom('DogStoryName')] odtrhnout, [other_owner.GetTitledFirstNameNoTooltip] odejde, aniž by se jedinkrát ohlédl."
 pet_animal.1112.a: "Jsi v pořádku, [ROOT.Char.Custom('DogStoryName')]?"
 pet_animal.1113.t: "[ROOT.Char.Custom('DogStoryName')]: Zasedání rady"
 pet_animal.1113.desc: "Když se s členy rady scházíme k jednání, [ROOT.Char.Custom('DogStoryName')] ke mně přijde s prosebným pohledem a svěšeným ocasem.\n\nSamota tomuhle psovi nesvědčí, ale tohle je důležité zasedání..."
 pet_animal.1113.a: "Půjde se mnou."
 pet_animal.1113.a_success: "[ROOT.Char.Custom('DogStoryName')] se chová vzorně"
 pet_animal.1113.a_success.tt: "Nic špatného se nestane"
 every_councillor: "Každý [Concept('councillor','člen rady')|E]"
 pet_animal.1113.a_failure: "[ROOT.Char.Custom('DogStoryName')] dělá všechno možné, jen ne to"
 pet_animal.1113.a_failure.tt: "Stane se něco... špatného"
 pet_animal.1113.b: "Pes na zasedání rady nepatří."
 pet_animal.1113.b.tt: "Zabouchneš dveře přímo před prosebným pohledem psa"
 pet_animal.1113.b_success: "[ROOT.Char.Custom('DogStoryName')] trpělivě čeká"
 pet_animal.1113.b_failure: "[ROOT.Char.Custom('DogStoryName')] se vydá za dobrodružstvím"
 pet_animal.1114.desc: "„Omlouvám se, [ROOT.Char.GetTitledFirstNameNoTooltip],“ pronese [councillor.GetTitledFirstName], [councillor.GetCouncilTitle]. „Musím nesouhlasit s tím, co jste právě–“\n\n#EMP *Grrr*#!\n\n[ROOT.Char.Custom('DogStoryName')] hluboce zavrčí a [councillor.GetTitledFirstNameNoTooltip] sebou trhne. Pohled přeskakuje ze psa na mě a zpět.\n\n„Když o tom tak přemýšlím, je to skvělý nápad!“"
 pet_animal.1014.a_girl: "Hodná holka, [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.1014.a_boy: "Hodný kluk, [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.1115.desc: "„A teď k dalšímu bodu,“ monotónně pokračuje [councillor.GetTitledFirstName], [councillor.GetCouncilTitle]. „Je nanejvýš důležité, abychom–“\n\n#EMP *Prrrrt*#!\n\nNastane ticho, které přeruší jen veselé zaštěkání [ROOT.Char.Custom('DogStoryName')]. Na podlaze právě přibyla nevítaná nadílka."
 pet_animal.1115.a: "Zlobivý pes!"
 pet_animal.1116.desc_opening: "Vyjdu ze zasedací místnosti a zjistím, že [ROOT.Char.Custom('DogStoryName')] je pryč. Hledám všude, nahoře i dole. Co když někde bloudí a má strach?\n\n"
 pet_animal.1116.desc: "Náhle narazím na [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)], komu se na klíně prakticky rozvaluje pes a nechává si nadšeně drbat [ROOT.Char.Custom('DogFurColor')] břicho. Pes nápadně podobný [ROOT.Char.Custom('DogStoryName')].\n\n„To máte ale úžasného společníka, [ROOT.Char.GetTitledFirstNameNoTooltip]!“"
 pet_animal.1116.a: "Ha, ano. [ROOT.Char.Custom('DogStoryName')] mi dělá skvělou společnost..."
 pet_animal.1117.desc: "Náhle narazím na [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)], jak hubuje psa. Psa nápadně podobného [ROOT.Char.Custom('DogStoryName')], kolem kterého se povalují cáry papíru a látky.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip]! Tahle... tahle #EMP bestie#! mi úplně zničila komnaty! Všechno je na kusy!“"
 pet_animal.1117.a: "Ehm... Jejda. Zlobivý pes!"
 pet_animal.1118.t: "[ROOT.Char.Custom('DogStoryName')]: Potížista"
 pet_animal.1118.desc: "[vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází se vztekem v očích a vleče za kůži na krku psa. Když se přiblíží, poznám [ROOT.Char.Custom('DogStoryName')]!\n\n„Našel jsem tu bestii mezi svými věcmi – co nerozkousala na kusy, to pokryla výkaly!“"
 pet_animal.1118.a: "Nahradím ti škodu!"
 pet_animal.1118.b: "Je to jen pes..."
 pet_animal.1190.t: "[ROOT.Char.Custom('DogStoryName')]: Štěně"
 pet_animal.1190.desc: "[ROOT.Char.Custom('DogStoryName')] přivedla na svět rozkošné štěně! Jakkoli jsem si ho [Select_CString(ROOT.Char.IsFemale,'zamilovala','zamiloval')] – i ten jeho drobný vrtící ocásek – o dalšího psa už se nedokážu postarat..."
 pet_animal.1190.a: "Dám ho [receiver_1.GetFirstNameNoTooltip]..."
 pet_animal.1190.b: "[receiver_2.GetFirstNameNoTooltip] by se hodil nějaký společník..."
 pet_animal.1190.c: "[receiver_3.GetFirstNameNoTooltip] se o něj dobře postará..."
 pet_animal.1190.d: "Prodám ho na trhu."
 pet_animal.1191.t: "Štěně"
 pet_animal.1191.desc: "[giver.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází se štěnětem v náručí.\n\n„Nemohu se o něj starat, ale třeba mu můžeš dát domov?“"
 pet_animal.1191.a: "Rozhodně! Sem s ním!"
 pet_animal.1191.b: "Dokážu se o něj... #EMP postarat#!."
 pet_animal.1192.t: "[receiver.Custom('DogStoryName')]: Život bez tebe"
 pet_animal.1192.desc_opening: "Navštívím [receiver.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('receiver'))], abych zjistil, jak se malému [receiver.Custom('DogStoryName')] v novém domově daří.\n\n"
 pet_animal.1192.desc_alive_landed: "Před [receiver.Custom('ResidenceBuilding')] mě přivítá [receiver.GetTitledFirstName] a vedle stojí pes s [receiver.Custom('DogFurColor')] srstí. „Daří se mu dobře –"
 pet_animal.1192.desc_alive: "Venku mě přivítá [receiver.GetTitledFirstName] a vedle stojí pes s [receiver.Custom('DogFurColor')] srstí. „Daří se mu dobře –"
 pet_animal.1192.desc_alive_1: "rád prohání slepice!“"
 pet_animal.1192.desc_alive_2: "rád chodí za koňmi!“"
 pet_animal.1192.desc: "Před [receiver.Custom('ResidenceBuilding')] mě přivítá [receiver.GetTitledFirstName], ale po psovi není ani stopy. „Ach, určitě si někde hraje...“\n\n[receiver.GetTitledFirstNameNoTooltip] se mi úporně vyhýbá pohledem."
 pet_animal.1192.a: "To se mi ulevilo!"
 pet_animal.1192.b: "Kde je [receiver.Custom('DogStoryName')]?!"
 pet_animal.1199.t: "[ROOT.Char.Custom('DogStoryName')]: Den smutku"
 pet_animal.1199.desc: "[ROOT.Char.Custom('DogStoryName')] kráčí po mém boku už mnoho let a čas nešetří ani psy. Když si vedle něj kleknu, začne pomalu vrtět ocasem, ale hlavu už zvednout nedokáže.\n\nSedím s ním dlouho do noci a hladím [ROOT.Char.Custom('DogFurColor')] hřbet, dokud se ocas nepřestane hýbat."
 pet_animal.1199.a: "Budeš mi chybět, [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.2001.t: "Noční tulení"
 pet_animal.2001.desc: "Když se s příchodem noci odeberu do svých komnat, najdu [ROOT.Char.Custom('CatStoryName')] a [ROOT.Char.Custom('DogStoryName')], jak se k sobě tulí na podlaze! [ROOT.Char.Custom('DogStoryName')] má [ROOT.Char.Custom('DogFurColor')] srst krásně lesklou – [ROOT.Char.Custom('CatStoryName')] ji očividně pilně čistil."
 pet_animal.2001.a: "Jsou spolu tak roztomilí!"
 pet_animal.2002.t: "Jako kočka a pes"
 pet_animal.2002.desc: "Sotva vyjdu ven, z opačných stran se objeví [ROOT.Char.Custom('CatStoryName')] a [ROOT.Char.Custom('DogStoryName')].\n\nNemám čas ani zareagovat – během okamžiku si jdou po krku. Vzduchem létají chomáče [ROOT.Char.Custom('DogFurColor')] srsti a oba vrčí. Zase. Tyhle neustálé rvačky musí skončit!"
 pet_animal.2002.a: "Okamžitě toho nech, [ROOT.Char.Custom('DogStoryName')]!"
 pet_animal.2002.a.tt: "Pokusíš se zkrotit psa"
 pet_animal.2002.b: "[ROOT.Char.Custom('CatStoryName')], dost!"
 pet_animal.2002.b.tt: "Pokusíš se zkrotit kočku"
 pet_animal.2002.c: "Nechci se mezi ně plést..."
 pet_animal.2002.c.tt: "Určitě si to mezi sebou vyřeší"
 pet_animal.2003.desc: "[Select_CString(ROOT.Char.IsFemale,'Prohledala','Prohledal')] jsem celý [ROOT.Char.Custom('ResidenceBuilding')] a [ROOT.Char.Custom('CatStoryName')] se mi celou dobu drží v patách, ale [ROOT.Char.Custom('DogStoryName')] není nikde k nalezení!\n\nZastavím se, abych se [Select_CString(ROOT.Char.IsFemale,'zamyslela','zamyslel')], a sehnu se pohladit [ROOT.Char.Custom('CatStoryName')]. Vtom si všimnu chomáče krvavé [ROOT.Char.Custom('DogFurColor')] srsti zachyceného mezi kočičími zuby. Když ho vytáhnu, [ROOT.Char.Custom('CatStoryName')] zasyčí a odskočí do kouta nádvoří – do kouta, kde na zemi leží cosi s [ROOT.Char.Custom('DogFurColor')] srstí."
 pet_animal.2003.a: "Ach, ne! [ROOT.Char.Custom('CatStoryName')], ty snad ne...!"
 pet_animal.2004.desc_opening: "Právě když vycházím z [ROOT.Char.Custom('ResidenceBuilding')], přikluše ke mně [ROOT.Char.Custom('DogStoryName')] a spokojeně vrtí ocasem.\n\n"
 pet_animal.2004.desc_female: "„Ahoj! Kdo je hodná holka? No kdo–“"
 pet_animal.2004.desc_male: "„Ahoj! Kdo je hodný kluk? No kdo–“"
 pet_animal.2004.desc: "\n\nKdyž se přiblíží, všimnu si, že mu z tlamy kape krev a cáry masa. Se sevřeným srdcem se vydám směrem, odkud přišel, a zanedlouho narazím na nehybné tělo mé kočky [ROOT.Char.Custom('CatStoryName')]."
 pet_animal.2004.a: "Ach, ne... [ROOT.Char.Custom('DogStoryName')], proč?!"
 pet_animal.2005.desc_opening: "Nemohu najít ani [ROOT.Char.Custom('CatStoryName')], ani [ROOT.Char.Custom('DogStoryName')]. Prohledám celý [ROOT.Char.Custom('ResidenceBuilding')] i okolí, ale nikdo je neviděl.\n\n"
 pet_animal.2005.desc: "Právě když se chystám vrátit, všimnu si na zemi malé kaluže krve. Pak další. A další... Stopy mě dovedou k hromadě krvavé srsti – dvě rozdrásaná těla propletená na zemi. Není pochyb, komu patří."
 pet_animal.2005.a: "Proč jste spolu prostě nemohli vycházet?!"
 pet_animal.2006.desc: "Právě když se chystám vrátit, spatřím je – leží na zemi v jednom chumlu. Ach ne! Oni se nakonec... Když se však přiblížím, [ROOT.Char.Custom('CatStoryName')] zvedne hlavu, unaveně se na mě podívá a zase usne."
 pet_animal.2006.a: "Oni... Oni si to skutečně vyříkali!"
 pet_animal.5001.t: "Kočka nepřítele"
 pet_animal.5001.desc: "Když cestou za pochůzkou procházím kolem [rival_home.GetName], přiblíží se ke mně kočka s [rival.Custom('CatFurColor')] srstí. Kde už jsem ji jen viděl...? Aha! Vždyť je to [rival.Custom('CatStoryName')], kočka [rival.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))]!\n\nKdyž ke mně vzhlédne, zamňouká a začne příst, po tváři se mi rozlije krutý úsměv."
 pet_animal.5001.a: "#EMP Čičiči#! – nic ti neudělám..."
 pet_animal.5001.a.tt: "Jen jedno rychlé říznutí nožem"
 pet_animal.5001.b: "Kočku toho pitomce pořádně pomazlím!"
 pet_animal.5002.t: "Pes nepřítele"
 pet_animal.5002.desc: "Když cestou za pochůzkou procházím kolem [rival_home.GetName], přiblíží se ke mně pes s [rival.Custom('DogFurColor')] srstí. Kde už jsem ho jen viděl...? Aha! Vždyť je to [rival.Custom('DogStoryName')], pes [rival.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))]!\n\nKdyž na mě vesele zaštěká a zavrtí ocasem, po tváři se mi rozlije krutý úsměv."
 pet_animal.5002.a: "Pojď sem, nic ti neudělám..."
 pet_animal.5002.b: "Psa toho pitomce pořádně pomazlím!"
 pet_animal.6001.t: "Mazlení s [ROOT.Char.Custom('DogStoryName')|U]"
 pet_animal.6001.desc: "Když hladím [ROOT.Char.Custom('DogFurColor')] srst [ROOT.Char.Custom('DogStoryName')], cítím, jak ze mě starosti pomalu opadávají. Mít někoho, jehož oddanost nikdy nezakolísá, a vědět, že vždy zůstane po mém boku... Kéž by ti byli lidé kolem mě podobnější, [ROOT.Char.Custom('DogStoryName')]!\n\nSedíme spolu dlouhé minuty. Ocas vesele vrtí a mé napětí pomalu povoluje, dokud nejsem znovu připraven čelit světu."
 pet_animal.6001.a: "Děkuji, příteli!"
 pet_animal.6002.desc: "Venku najdu [ROOT.Char.Custom('DogStoryName')], jak si hraje s několika dětmi. Jakmile mě zahlédne, rychle ke mně přiběhne s vrtícím ocasem, a když si dřepnu, okamžitě se svalí na záda.\n\nDlouhé minuty drbu [ROOT.Char.Custom('DogFurColor')] břicho a už dlouho jsem se necítil tak uvolněně."
 pet_animal.6003.desc: "Když vyjdu ven, spatřím [ROOT.Char.Custom('DogStoryName')], jak se ke mně řítí s klackem v tlamě. Pár minut na aportování si snad mohu dovolit. Ano, to by mě uklidnilo.\n\n#EMP Počkat, co je tohle?#!\n\nSehnu se pro klacek a zjistím, že to vůbec žádný klacek není, ale #EMP nárok na [target_county.GetName]!#! Jak ses k tomu pro všechno na světě dostal, [ROOT.Char.Custom('DogStoryName')]?!"
 pet_animal.6003.a: "Hodný [ROOT.Char.Custom('DogStoryGirlBoy')], [ROOT.Char.Custom('DogStoryName')]. #EMP Hodný [ROOT.Char.Custom('DogStoryGirlBoy')]!#!"
 pet_animal.6003.b: "[neighboring_ruler.GetTitledFirstNameNoTooltip] bude mít obrovskou radost, až to dostane zpátky!"
 pet_animal.6004.desc: "Venku najdu [ROOT.Char.Custom('DogStoryName')], jak podřimuje na slunci. Přikrčím se vedle a zabořím ruku do [ROOT.Char.Custom('DogFurColor')] srsti, když vtom–\n\nJediným varováním je tiché zavrčení a záblesk zubů, než ucítím, jak se mi v paži něco #EMP trhá#!. Odskočím dozadu dřív, než může přijít další výpad, ale ta bolest...!"
 pet_animal.6004.a: "To... To musel být omyl!"
 pet_animal.6004.b: "Ty #EMP bestie#!!"
 pet_animal.6051.t: "Mazlení s [ROOT.Char.Custom('CatStoryName')|U]"
 pet_animal.6051.desc: "Najdu [ROOT.Char.Custom('CatStoryName')], jak spí na mé posteli, a když si přisednu, ozve se tiché, zmatené zamňoukání.\n\nJakmile však začnu prsty pročesávat [ROOT.Char.Custom('CatFurColor')] srst, brzy se ozve spokojené předení a jeho zvuk jako by uvolnil celé mé tělo."
 pet_animal.6052.desc: "Venku najdu [ROOT.Char.Custom('CatStoryName')], jak se promenáduje po nádvoří. Jakmile mě zahlédne, zamňouká, přikráčí ke mně a otře se mi o nohu.\n\nDlouhé minuty dřepím vedle, hladím hebkou srst a škrábu pod bradou. Když se nakonec narovnám, cítím se lehčeji než už dlouhou dobu."
 pet_animal.3001.t: "Orel"
 pet_animal.3001.desc: "Nové orlí mládě mi spočívá na rukavici a já jemně hladím jeho peří. Vznešený a divoký tvor, rozhodně žádný obyčejný pták.\n\nPři představách o budoucích lovech musím vymyslet, jaké jméno mu dám, než společně vyrazíme ulovit první lišku či zajíce."
 pet_animal.3010.t: "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] zmizení"
 pet_animal.3010.desc: "[eagle_informer.GetFirstName] ke mně přichází se starostlivým výrazem. „Jde o [ROOT.Char.Custom('EagleStoryName')], [ROOT.Char.Custom('FormOfAddressForLiege')]. Nikde ho nemohu najít!“\n\n[eagle_informer.GetFirstNameNoTooltip] se rozhlíží kolem, jako by [Select_CString(eagle_informer.IsFemale,'očekávala','očekával')], že [ROOT.Char.Custom('EagleStoryName')] každou chvíli slétne z oblohy. Pak mi ukáže prázdné bidlo a společně přemýšlíme, kam se orel mohl podít."
 pet_animal.3010.desc_thief: "\n\nKdyž místo prohlížím, všimnu si několika per na zemi a dalších zachycených ve větvích nedalekého stromu. Odešel snad [ROOT.Char.Custom('EagleStoryName')] z vlastní vůle?"
 pet_animal.3010.a: "Udělám cokoli, abych [ROOT.Char.Custom('EagleStoryName')] [Select_CString(ROOT.Char.IsFemale,'našla','našel')]!"
 pet_animal.3010.a_tt: "Po tvém orlovi bude pátrat více lidí, takže se zvýší šance na jeho nalezení"
 pet_animal.3010.b: "Někdo ho musel odnést..."
 pet_animal.3010.b_tt: "Shromáždíš podezřelé a zahájíš vyšetřování zmizení svého orla"
 pet_animal.3010.c: "Nakonec se určitě objeví."
 pet_animal.3010.c_tt: "Návrat svého orla ponecháš náhodě"
 pet_animal.3010.d_mean: "Stejně mi na [ROOT.Char.Custom('EagleStoryName')] nikdy moc nezáleželo."
 pet_animal.3010.d_old: "Už měl svá nejlepší léta za sebou."
 pet_animal.3010.d: "Možná je to tak nejlepší."
 pet_animal.3010.d_tt: "Vzdáš pátrání po orlovi"
 pet_animal.3011.t: "[ROOT.Char.Custom('EagleStoryName')]: Návrat"
 pet_animal.3011.desc: "Od zmizení mého drahého orla [ROOT.Char.Custom('EagleStoryName')] uplynula už dlouhá doba a já téměř ztrácím naději, že spolu ještě někdy vyrazíme na lov. "
 pet_animal.3011.desc_freedom: "Začnu vzpomínat na naše společné chvíle a zamířím k obvyklému bidlu. K mé nesmírné radosti tam sedí [ROOT.Char.Custom('EagleStoryName')] a probodává mě svým pronikavým pohledem. Vrátil se!"
 pet_animal.3011.desc_found: "Shodou okolností právě dorazí posel se zprávou, že zahlédli ptáka odpovídajícího popisu [ROOT.Char.Custom('EagleStoryName')]. Spěchám na místo a tam skutečně sedí na větvi a hledí na mě, jako by se vůbec nic nestalo."
 pet_animal.3011.desc_stolen: "[ROOT.Char.Custom('EagleStoryName')] skončil v rukou [eagle_thief.GetName], kdo se jej právě snaží prodat nejvyšší nabídce. Rychle zasáhnu a můj orel je znovu v mém náručí."
 pet_animal.3011.desc_change: "\n\nRadostí z návratu [ROOT.Char.Custom('EagleStoryName')] jsem bez sebe, ale nemohu si nevšimnout, že se něco změnilo. "
 pet_animal.3011.desc_brave: "[ROOT.Char.Custom('EagleStoryName')] působí odvážněji, jako by poznal svět a přestal se ho bát."
 pet_animal.3011.desc_curious: "[ROOT.Char.Custom('EagleStoryName')] se potuluje po táboře a dychtivě zkoumá úplně všechno."
 pet_animal.3011.desc_loyal: "[ROOT.Char.Custom('EagleStoryName')] se ode mě nechce hnout a z mé rukavice si udělal své osobní bidlo."
 pet_animal.3011.desc_calm: "Dříve býval [ROOT.Char.Custom('EagleStoryName')] neklidný a nervózní, ale teď sedí pokojně dokonce i bez čepičky."
 pet_animal.3011.desc_wise: "[ROOT.Char.Custom('EagleStoryName')] na mě hledí vědoucím pohledem, jako by spatřil věci, které si ani nedokážu představit."
 pet_animal.3011.desc_cunning: "[ROOT.Char.Custom('EagleStoryName')] se zřejmě naučil několik nových triků a vůbec se je nebojí používat."
 pet_animal.3011.desc_observant: "[ROOT.Char.Custom('EagleStoryName')] krouží vysoko nade mnou a bedlivým zrakem sleduje vše pod sebou."
 pet_animal.3011.desc_protective: "[ROOT.Char.Custom('EagleStoryName')] klove každého, kdo se přiblíží příliš blízko, ačkoli dříve by mu to bylo naprosto lhostejné."
 pet_animal.3011.desc_aggressive: "[ROOT.Char.Custom('EagleStoryName')] mi svými pařáty málem probodne rukavici. Je zřejmé, že s tímto orlem si není radno zahrávat."
 pet_animal.3011.a: "Vítej zpátky, [ROOT.Char.Custom('EagleStoryName')]."
 pet_animal.3011.b: "[eagle_thief.GetName] za tohle zaplatí!"
 pet_animal.3012.desc: "Po měsících pátrání mi nezbývá než přijmout, že svého drahého orla [ROOT.Char.Custom('EagleStoryName')] už nikdy neuvidím. [eagle_informer.GetName] se mě snaží utěšit: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], [Select_CString(eagle_informer.IsFemale,'jsem si jistá, že někde stále je a vrátí se','jsem si jistý, že někde stále je a vrátí se')].“ Já však vím své.\n\n[ROOT.Char.Custom('EagleStoryName')] je pryč a musím se s tím smířit."
 pet_animal.3012.a: "Sbohem, [ROOT.Char.Custom('EagleStoryName')]."
 pet_animal.3013.t: "Pátrání po [ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3013.desc: "Jak znám [ROOT.Char.Custom('EagleStoryName')], je jen malá šance, že odešel z vlastní vůle. Pečlivě prohlížím místo, kde byl naposledy spatřen, a vyptávám se, zda ho někdo neviděl.\n\nNěkteří z vyslýchaných působí značně nervózně a začínám přemýšlet, zda nevědí víc, než dávají najevo. Když se nad tím zamyslím, "
 pet_animal.3013.desc_thief_1: "za podezřelého označím [accused_thief_1.GetName]. Důvodem je povaha, kterou lze jen stěží popsat jinak než jako [accused_thief_1.Custom2('InsultAdjective', ROOT.Char)]."
 pet_animal.3013.desc_thief_2: "$pet_animal.3013.desc_thief_1$ Také [accused_thief_2.GetName] však připadá v úvahu. I zde lze povahu sotva popsat jinak než jako [accused_thief_2.Custom2('InsultAdjective', ROOT.Char)]..."
 pet_animal.3013.desc_thief_single: "napadá mě jediný člověk, který to mohl udělat..."
 pet_animal.3013.desc_thief_none: " nedokážu si představit, kdo by mohl [ROOT.Char.Custom('EagleStoryName')] odnést."
 pet_animal.3013.a: "[accused_thief_1.GetName] mi [Select_CString(accused_thief_1.IsFemale,'ukradla','ukradl')] mého drahocenného orla!"
 pet_animal.3013.b: "Nebo to snad [Select_CString(accused_thief_2.IsFemale,'byla','byl')] [accused_thief_2.GetName]?"
 pet_animal.3013.d: "Bez důkazů nemohu nikoho obvinit."
 pet_animal.3013.tt: "Obviníš [accused_thief.GetNameNoTooltip] z krádeže svého orla"
 pet_animal.3013.wrong: "[accused_thief.GetName] [Select_CString(accused_thief.IsFemale,'neukradla','neukradl')] [ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3013.unknown: "Osud tvého orla zůstává neznámý..."
 rival_stole_from_me_eagle: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'se pokusila ukrást','se pokusil ukrást')] [TARGET_CHARACTER.GetNamePossessive] loveckého orla."
 rival_stole_from_me_eagle_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'se pokusila ukrást','se pokusil ukrást')] [CHARACTER.GetNamePossessive] loveckého orla."
 pet_animal.3020.t: "Koloběh pokračuje"
 pet_animal.3020.desc_intro: "Hledím na [ROOT.Char.Custom('EagleStoryName')] a vzpomínám na den, kdy"
 pet_animal.3020.desc_intro_standard: "[Select_CString(ROOT.Char.IsFemale,'jsem ho odnesla z hnízda','jsem ho odnesl z hnízda')]"
 pet_animal.3020.desc_intro_lure: "[Select_CString(ROOT.Char.IsFemale,'jsem ho k sobě nalákala','jsem ho k sobě nalákal')]"
 pet_animal.3020.desc_intro_gift: "[Select_CString(ROOT.Char.IsFemale,'jsem ho dostala darem','jsem ho dostal darem')]"
 pet_animal.3020.desc_intro_market: "[Select_CString(ROOT.Char.IsFemale,'jsem ho koupila u kupeckého stánku','jsem ho koupil u kupeckého stánku')]"
 pet_animal.3020.desc_intro_stolen: "[Select_CString(ROOT.Char.IsFemale,'jsem ho vyrvala ze spárů někoho jiného','jsem ho vyrval ze spárů někoho jiného')]"
 pet_animal.3020.desc_intro_none: "[Select_CString(ROOT.Char.IsFemale,'jsem ho našla','jsem ho našel')]"
 pet_animal.3020.desc: ", i na všechny vzpomínky, které jsme od té doby společně získali. Za ta léta se u [ROOT.Char.Custom('EagleStoryName')] výrazně projevilo: [ROOT.Char.Custom('EaglePersonalityTrait1')]. Stal se mým věrným společníkem a lov bez něj si už téměř nedokážu představit.\n\n"
 pet_animal.3020.desc_normal: "Takový tvor však není určen k tomu, aby ho někdo jako já držel v zajetí. Nejlepší by bylo vrátit ho na svobodu, aby mohl zplodit vlastní potomstvo. Nastal ten čas právě teď?"
 pet_animal.3020.desc_let_go: "Před stejným rozhodnutím jsem už jednou [Select_CString(ROOT.Char.IsFemale,'stála','stál')] a tehdy jsem se [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')] nechat [ROOT.Char.Custom('EagleStoryName')] po svém boku. Vím, že mu patří svoboda, ale síly mu zatím nechybějí. Možná bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] ještě nějakou dobu počkat?"
 pet_animal.3020.desc_let_go_2: "Přesto držím [ROOT.Char.Custom('EagleStoryName')] v zajetí už příliš dlouho. Nastal čas vrátit mu svobodu."
 pet_animal.3020.a_tt: "Vypustíš svého orla zpět do volné přírody."
 pet_animal.3020.a_second: "Ne, na svobodu čeká už příliš dlouho."
 pet_animal.3020.b: "Ještě se s ním nedokážu rozloučit."
 pet_animal.3020.b_second: "Ještě má před sebou několik dobrých let."
 pet_animal.3020.b_tt: "Ještě nějakou dobu si orla ponecháš po svém boku a k možnosti vypustit ho se vrátíš později."
 pet_animal.3020.c: "[ROOT.Char.Custom('EagleStoryName')] nikdy nepustím!"
 pet_animal.3020.c_tt: "Vrátit svého orla do volné přírody pro tebe vůbec nepřipadá v úvahu."
 pet_animal.3020.warning_less: "#warning Je malá pravděpodobnost, že to ovlivní zdraví tvého orla.#!"
 pet_animal.3020.warning: "#warning Je zde pravděpodobnost, že to ovlivní zdraví tvého orla.#!"
 pet_animal.eagle_weak_title: "Zdraví [ROOT.Char.Custom('EagleStoryName')] se zhoršuje"
 pet_animal.eagle_unweak_title: "Zdraví [ROOT.Char.Custom('EagleStoryName')] se zlepšuje"
 pet_animal.3030.t_eye: "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] oko"
 pet_animal.3030.t_wing: "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] křídlo"
 pet_animal.3030.t_claw: "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] pařát"
 pet_animal.3030.desc_intro: "V poslední době si všímám, že [ROOT.Char.Custom('EagleStoryName')] působí značně neklidně."
 pet_animal.3030.desc_training: "Po našem posledním výcviku si všímám, že s [ROOT.Char.Custom('EagleStoryName')] není něco v pořádku."
 pet_animal.3030.desc_eye: "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] obvyklá přesnost se vytratila a jedno oko zůstává zavřené častěji než dřív. V obavě z nejhoršího před ním mávnu rukou, ale [ROOT.Char.Custom('EagleStoryName')] ani necukne! Oko vypadá propadle, což vysvětluje nedávné potíže."
 pet_animal.3030.desc_wing: "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] peří místy prořídlo a [ROOT.Char.Custom('EagleStoryName')] už nedokáže létat tak vysoko jako dřív. Když se křídla jemně dotknu, cítím, že nezvykle poklesává, což vysvětluje nedávné potíže."
 pet_animal.3030.desc_claw: "Jeden z [ROOT.Char.Custom('EagleStoryNamePossessive')] pařátů je zlomený a [ROOT.Char.Custom('EagleStoryName')] se už nedokáže zachytit mé rukavice tak pevně jako dřív. Při bližším pohledu zjistím, že je dráp prasklý, což vysvětluje nedávné potíže."
 pet_animal.3030.desc_weak: "To mě znepokojuje o to víc, protože už předtím na tom [ROOT.Char.Custom('EagleStoryName')] nebyl dobře."
 pet_animal.3030.desc_outro: "\n\nNeléčené zranění se může zanítit, ale kde mám hledat pomoc?"
 pet_animal.3030.court_physician: "Pokud [court_physician.GetFirstName] dokáže léčit nemocné, zvládne i mého orla."
 pet_animal.3030.court_huntsman: "Vyznáš se ve zvířatech, ne, [court_huntsman.GetFirstName]?"
 pet_animal.3030.random_smart_courtier: "[random_smart_courtier.GetFirstName] má značné znalosti, možná dokáže pomoci."
 pet_animal.3030.self: "Vím, jak toto zranění léčit."
 pet_animal.3030.none: "Musím nechat přírodu, ať rozhodne."
 pet_animal.3030.very_good: "Podaří se jim zcela obnovit zdraví tvého orla"
 pet_animal.3030.good: "Ošetří zranění tvého orla"
 pet_animal.3030.good_self: "Úspěšně ošetříš zranění svého orla"
 pet_animal.3030.very_good_self: "Podaří se ti zcela obnovit zdraví svého orla"
 pet_animal.3030.nothing: "Zdá se, že nic z toho, co dělají, nepomáhá"
 pet_animal.3030.bad: "Nějakým způsobem stav tvého orla ještě zhorší"
 pet_animal.3040.t: "Jak vycvičit orla"
 pet_animal.3040.desc: "Ve věku [ROOT.Char.MakeScope.Var('eagle_age_variable').GetValue] let se z [ROOT.Char.Custom('EagleStoryName')] stal velmi schopný lovec, ale vždy je co zlepšovat. Rozhodnu se věnovat nějaký čas výcviku a zjistit, zda lze jeho schopnosti ještě zdokonalit, nebo se o něm sám dozvědět něco nového."
 pet_animal.3040.training_bad_title: "Neúspěšný výcvik"
 pet_animal.3040.training_good_title: "Úspěšný výcvik"
 pet_animal.3040.training_bad_desc: "Výcvik se nedaří"
 pet_animal.3040.training_good_desc: "Výcvik probíhá dobře"
 pet_animal.3040.training_very_bad: "A [ROOT.Char.Custom('EagleStoryName')] se při něm zraní"
 pet_animal.3040.training_bad: "[ROOT.Char.Custom('EagleStoryName')] ztrácí část své vitality"
 pet_animal.3040.training_neutral: "Naštěstí však [ROOT.Char.Custom('EagleStoryName')] vyvázne bez zranění"
 pet_animal.3040.personality_less_effective: "Povaha tvého orla je #N méně nápomocná#!"
 pet_animal.3040.training_good_generic: "Ty i [ROOT.Char.Custom('EagleStoryName')] získáte trochu více zkušeností"
 pet_animal.3040.personality_level: "[ROOT.Char.Custom('EagleStoryNamePossessive')] povaha [ROOT.Char.Custom('EaglePersonalityTraitTooltip')] je #P užitečnější#!"
 pet_animal.3040.personality: "Dozvíš se více o #bold povaze#! [ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3040.personality_change: "#bold Povaha#! [ROOT.Char.Custom('EagleStoryName')] se mění"
 pet_animal.3040.personality_change_tooltip: "Tvůj orel získá nový povahový rys"
 pet_animal.3040.personality_new_brave: "Projevuje značnou odvahu"
 pet_animal.3040.personality_new_curious: "Dychtivě se zajímá o své okolí"
 pet_animal.3040.personality_new_cunning: "Zkouší na tebe všelijaké vychytralé triky"
 pet_animal.3040.personality_new_loyal: "Drží se věrně po tvém boku"
 pet_animal.3040.personality_new_wise: "Na ptáka je mimořádně bystrý"
 pet_animal.3040.personality_new_calm: "Jen tak něco ho nerozruší"
 pet_animal.3040.personality_new_aggressive: "Projevuje značnou zuřivost"
 pet_animal.3040.personality_new_observant: "Je mimořádně všímavý"
 pet_animal.3040.personality_new_protective: "Začíná tě velmi urputně chránit"
 pet_animal.3040.personality_bonus_stewardship: "@skill_stewardship_icon! #P Pravděpodobnější#! při výcviku [Concept('stewardship','Správcovství')|E]"
 pet_animal.3040.personality_bonus_martial: "@skill_martial_icon! #P Pravděpodobnější#! při výcviku [Concept('martial','Válečnictví')|E]"
 pet_animal.3040.personality_bonus_intrigue: "@skill_intrigue_icon! #P Pravděpodobnější#! při výcviku [Concept('intrigue','Pletichářství')|E]"
 pet_animal.3040.personality_bonus_learning: "@skill_learning_icon! #P Pravděpodobnější#! při výcviku [Concept('learning','Učenosti')|E]"
 pet_animal.3040.personality_bonus_diplomacy: "@skill_diplomacy_icon! #P Pravděpodobnější#! při výcviku [Concept('diplomacy','Diplomacie')|E]"
 pet_animal.3040.martial: "Trocha výcviku na bojišti ještě žádnému zkušenému lovci neuškodila."
 pet_animal.3040.stewardship: "Pozná země našeho panství a naučí se v nich orientovat."
 pet_animal.3040.intrigue: "Dobrý lovec musí svou kořist dokázat přelstít."
 pet_animal.3040.learning: "Vědění je moc a [ROOT.Char.Custom('EagleStoryName')] bude moudrý pták."
 pet_animal.3040.diplomacy: "Naučím ho lépe rozumět lidem."
 pet_animal.3040.money: "Na rozvoj jeho schopností mohu postrádat pár mincí."
 pet_animal.3040.money_tt: "Najmeš cvičitele, aby ti pomohl"
 pet_animal.3040.none: "Další rozvoj jeho schopností ponechám náhodě."
 pet_animal.3050.t: "Orel nepřítele"
 pet_animal.3050.desc: "Když cestou za pochůzkou procházím kolem [rival_home.GetName], zahlédnu v kleci orla s povahou [rival.Custom('EaglePersonalityTraitTooltip')]. Kde už jsem toho ptáka jen [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]...? Aha! Vždyť je to [rival.Custom('EagleStoryName')], orel [rival.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe' , SCOPE.sC('rival'))]!\n\nKdyž na mě upře pronikavý pohled a pronikavě zatrylkuje, po tváři se mi rozlije krutý úsměv."
 pet_animal.3050.a.tt: "Pokusíš se ublížit orlovi [rival.GetFirstNameNoTooltip]"
 pet_animal.3050.steal: "Toho ptáka si nechám!"
 pet_animal.3050.steal.tt: "Pokusíš se ukrást orla [rival.GetFirstNameNoTooltip]"
 pet_animal.3050.b: "Toho ptáka vezmu pro [token_child.GetName]!"
 pet_animal.3050.b.flavor: "Krádež pro dobrou věc přece není nic špatného"
 pet_animal.3050.b.tt: "Pokusíš se ukrást orla [rival.GetFirstNameNoTooltip] pro [token_child.GetNameNoTooltip]"
 pet_animal.3050.good: "Tvůj úklad proti [rival.GetFirstNameNoTooltip] uspěje"
 pet_animal.3050.bad: "Orel zůstane nezraněn"
 pet_animal.3050.c: "Za [rival.Custom('EagleStoryName')] bych mohl dostat pěkný balík..."
 pet_animal.3050.c_tt: "Pokusíš se prodat orla svého rivala za tučnou sumu"
 pet_animal.3050.c.tt: "Jak se do lesa volá, tak se z lesa ozývá"
 pet_animal.3050.d: "Ten je roztomilý!"
 pet_animal.3060.t: "Rodící se lovec"
 pet_animal.3060.t_girl: "Rodící se lovkyně"
 pet_animal.3060.desc_intro: "[token_child.GetName] [Select_CString(token_child.IsFemale,'vyrostla','vyrostl')] v někoho vskutku [token_child.Custom('ComplimentAdjective')] a nemohu být pyšnější. Přes všechny dosavadní úspěchy však v životě čeká ještě mnoho nesnází, pokud se nenaučí správně lovit.\n\n"
 pet_animal.3060.desc: "Rozhodnu se, že nám při výcviku pomůže můj orel [ROOT.Char.Custom('EagleStoryName')]. Zároveň si tak může lépe zvyknout na [token_child.GetFirstNameNoTooltip]."
 pet_animal.3060.desc_child: "Naštěstí se [token_child.GetFirstNameNoTooltip] učí rychle a už má dokonce vlastního orla. Jmenuje se [token_child.Custom('EagleStoryName')] a [token_child.GetNameNoTooltip] si ho už velmi [Select_CString(token_child.IsFemale,'oblíbila','oblíbil')]."
 pet_animal.3060.a: "Snad z [token_child.GetFirstNameNoTooltip] jednou bude skvělý lovec!"
 pet_animal.3060.a_girl: "Z [token_child.GetFirstNameNoTooltip] jednou bude skvělá lovkyně!"
 pet_animal.3060.good: "[token_child.GetFirstNameNoTooltip] si s orlem vede dobře"
 pet_animal.3060.decent: "Sokolnické dovednosti [token_child.GetFirstNameNoTooltip] ještě potřebují vypilovat"
 pet_animal.3070.t: "Píseň [ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3070.desc: "Svého orla obvykle nevystavuji pohledům ostatních, ale celý týden hlasitě hvízdá. Nechci ten protivný hluk poslouchat celý den, a tak se jeho dočasným domovem stane nádvoří.\n\nKdyž se na něj později přijdu podívat, najdu [target.GetName], jak naslouchá zpěvu [ROOT.Char.Custom('EagleStoryName')]. „To je váš pták?“ zeptá se [target.GetFirstNameNoTooltip] a já bez nadšení přikývnu.\n\n„[ROOT.Char.Custom('RandomPositiveLookAdjective')|U]!“ zvolá, ačkoli já jeho nadšení zrovna nesdílím."
 pet_animal.3070.a: "Jsem rád, že se to alespoň někomu líbí."
 eagle_funny_sing_modifier: "Ptačí samomluva"
 pet_animal.3080.t: "Dárek od [ROOT.Char.Custom('EagleStoryName')]"
 pet_animal.3080.desc: "Uháním za [ROOT.Char.Custom('EagleStoryName')], který se při naší jízdě náhle odtrhl a odletěl pryč. Když ho konečně doženu, svírá v pařátech chlupatého, zmítajícího se tvora! Úlovek na mě udělá dojem, a tak mu kořist nechám.\n\n„SKRÁÁÁ!“ zakřičí [ROOT.Char.Custom('EagleStoryName')] a pustí bezvládného tvora přímo k mým nohám."
 pet_animal.3080.a: "Jak... milé?"
 pet_animal.3199.t: "[ROOT.Char.Custom('EagleStoryName')]: Poslední let"
 pet_animal.3199.desc_intro: "[ROOT.Char.Custom('EagleStoryName')] létá po mém boku už mnoho let a čas neušetřil ani jeho."
 pet_animal.3199.desc: "Jakkoli mě bolí si to přiznat, peří už ztratilo svůj lesk a [ROOT.Char.Custom('EagleStoryName')] nedokáže létat s takovou silou jako kdysi."
 pet_animal.3199.desc_dying: "Jeho zdraví chřadne a já vím, že [ROOT.Char.Custom('EagleStoryName')] už se mnou dlouho nezůstane."
 pet_animal.3199.desc_outro: "\n\nSundám mu čepičku z očí a vypustím ho k obloze. [ROOT.Char.Custom('EagleStoryName')] stoupá vysoko, ještě výš a výš, ale já vím, že už se nevrátí."
 pet_animal.3199.a: "Budeš mi chybět, [ROOT.Char.Custom('EagleStoryName')]!"
 artifact_animal_feather_name_eagle: "Pero [ROOT.Char.Custom('EagleStoryName')]"
 artifact_bird_feather_pet_description: "Pero milovaného loveckého orla, které vytrhl [ROOT.Char.GetTitledFirstName]."
