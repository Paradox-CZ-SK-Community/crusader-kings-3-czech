 ep3_story_cycle_harrying.0001.t: "Kladivo dopadá"
 ep3_story_cycle_harrying.0001.desc: "Sesazením posledního vládce z řad Æthelingů lze Pustošení severu konečně skutečně považovat za ukončené.\n\n"
 ep3_story_cycle_harrying.0001.desc.hereward: "Žádné další výzvy k boji o trůn [england.GetName] už nepřijdou. Anglosaští šlechtici jsou rozehnaní, zkrotlí a pasivní, zbavení hodností i moci. Všichni se plazí u nohou [ruler_england.GetTitledFirstNamePossessive].\n\nMá věc je ztracena. Normané tu zůstanou a pro anglosaskou budoucnost už není žádná naděje. V lepším případě splyneme s nimi a staneme se součástí této země; v horším zmizíme z dějin docela."
 ep3_story_cycle_harrying.0001.desc.william: "Jsem na vrcholu moci. Nikdo se neodvažuje zpochybnit mou vládu nad [england.GetName]. Anglosaští šlechtici jsou rozehnaní, zkrotlí a pasivní a ze strachu před další odplatou mi skládají hold. Než rok skončí, každý z nich políbí můj prsten a bude se přede mnou plazit.\n\nMé vládě už nikdo neodporuje a já se nyní mohu obrátit k dalším ambicím."
 ep3_story_cycle_harrying.0001.desc.therest: "Zuřivý odpor proti [ruler_england.GetTitledFirstName] se pod náporem kruté odvety konečně zhroutil. Normanskou vládu nad [england.GetName] už nikdo nezpochybňuje."
 ep3_story_cycle_harrying.0001.a: "Má věc selhala."
 ep3_story_cycle_harrying.0001.b: "Má země už není rozdělena."
 ep3_story_cycle_harrying.0001.c: "Zajímavé."
 ep3_story_cycle_harrying.0002.t: "Návrat"
 ep3_story_cycle_harrying.0002.desc: "S Anglosasem opět na trůně [england.GetName] lze Pustošení severu konečně skutečně považovat za ukončené.\n\n"
 ep3_story_cycle_harrying.0002.desc.hereward: "Naše věc byla spravedlivá, překážky obrovské a odplata krutá. Anglosaský duch však zvítězil a my se nyní vracíme na své právoplatné místo v sídlech moci těchto zemí.\n\nTeď musím odložit meč. Možná ještě nenastal čas překovat jej v radlici, neboť nepřátel panství zůstává mnoho, ale má vlastní legenda musí pomalu vyblednout z paměti."
 ep3_story_cycle_harrying.0002.desc.ruler: "Normanští vetřelci před námi mizí. Někteří se stále křečovitě drží své moci, jiní se vracejí do vlasti a ještě více jich leží několik stop pod zeleným anglickým pažitem.\n\nNikdo z nich se neodvažuje zpochybnit mé postavení."
 ep3_story_cycle_harrying.0002.desc.therest: "Úspěšná invaze se pro normanské vetřelce rychle změnila v noční můru a nástup [ruler_england.GetTitledFirstName] k moci konečně učinil přítrž cizím ambicím na anglický trůn. Alespoň prozatím."
 ep3_story_cycle_harrying.0002.a: "Ať rychle a spokojeně vybledne."
 ep3_story_cycle_harrying.0002.b: "Má země už není rozdělena."
 ep3_story_cycle_harrying.0002.c: "Zajímavé."
 ep3_story_cycle_harrying.0003.t: "Nejisté časy"
 ep3_story_cycle_harrying.0003.desc: "Krutý konflikt, který zuřil mezi normanskými vládci a anglosaskými šlechtici, zle poznamenal obě strany a přinesl vskutku nečekaný výsledek.\n\nTrůn [england.GetName] nyní ovládají [ruler_england.GetCulture.GetCollectiveNounNoTooltip] a [ruler_england.GetTitledFirstName] vládne ze sídla moci nad zpustošenou a rozvrácenou zemí. Pustošení severu tím postupně vyhaslo, neboť obě znepřátelené strany už nedokážou ve svém sváru pokračovat.\n\nBudoucnost panství je nejistá a v těchto časech přerodu zůstává mnoho otázek bez odpovědi."
 ep3_story_cycle_harrying.0003.a: "Teprve se ukáže, zda je to vůbec zlepšení..."
 ep3_story_cycle_harrying.0003.b: "Tyto nesourodé země sjednotím."
 ep3_story_cycle_harrying.0003.c: "Zajímavé"
 ep3_story_cycle_harrying.0004.t: "Dávné časy"
 ep3_story_cycle_harrying.0004.desc: "Od normanské invaze do Anglie uplynulo mnoho let.\n\n"
 ep3_story_cycle_harrying.0004.desc.ruler: "Dokonce tolik, že si místní už sotva pamatují, proč proti mé vládě tak zuřivě bojují. Stále častěji odkládají meče a odmítají dál vést boj svých prarodičů.\n\nMá vláda už téměř není zpochybňována a v tomto tažení za pacifikací nemusím pokračovat. Pustošení severu skončilo."
 ep3_story_cycle_harrying.0004.desc.anglo_saxon: "Ti, kteří to všechno před tolika desetiletími zažili, jsou pryč a jejich těla už dávno hnojí pole. Dokonce i jejich děti jsou dnes bělovlasé a vetché. Další generace stále častěji opouští boj svých předků ve prospěch pokojného soužití. Také [ruler_england.GetCulture.GetCollectiveNounNoTooltip] na trůně polevují v útlaku, protože v pokračování konfliktu už nevidí žádný prospěch.\n\nPustošení severu skončilo."
 ep3_story_cycle_harrying.0004.desc.therest: "Uplynulo už tolik času, že si současná generace Anglosasů v Anglii sotva pamatuje, za co vlastně bojuje. [ruler_england.GetCulture.GetCollectiveNounNoTooltip] už pevně patří k této zemi a jen málokdo na kterékoli straně má důvod v konfliktu pokračovat.\n\nPustošení severu skončilo."
 ep3_story_cycle_harrying.0004.a: "Jsou součástí tohoto panství stejně jako my."
 ep3_story_cycle_harrying.0004.b: "Pojďme dál jako přátelé."
 ep3_story_cycle_harrying.0004.c: "Zajímavé."
 ep3_story_cycle_harrying.1000.t: "V plamenech"
 ep3_story_cycle_harrying.1000.desc: "Zatímco nespokojení anglosaští šlechtici dál bojují za svou ztracenou věc, trávím nejeden večer úvahami, jak je připravit o moc.\n\nKaždý, kdo je [ROOT.Char.GetLadyLord], je závislý na práci rolníků. Stojíme nad nimi z vůle [ROOT.Char.GetFaith.HighGodName], ale naše moc vzkvétá jen díky jejich úmorné dřině.\n\nObilí je zase životodárnou mízou rolnictva. Méně obilí znamená méně rolníků. Čím méně rolníků, tím slabší je [ROOT.Char.GetLadyLord]. A čím slabší je [ROOT.Char.GetLadyLord]..."
 ep3_story_cycle_harrying.1000.a: "V oblasti [crop_duchy.GetNameNoTooltip] zničte každé sousto."
 ep3_story_cycle_harrying.1000.b: "Nechte jim jen naprosté minimum. Zbytek spalte."
 ep3_story_cycle_harrying.1000.c: "Jestli chtějí své obilí, budou za něj muset zaplatit."
 every_county_in_duchy_aetheling: "Každé [Concept('county','hrabství')|E] v [crop_duchy.GetName]"
 ep3_story_cycle_harrying.1005.t: "Velká severní cesta"
 ep3_story_cycle_harrying.1005.desc: "„Sever?“ [marshal.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))], se na chvíli zamyslí. „Léta nájezdů zpoza moře dala severu kulturu odlišnou od té, kterou najdeš tady na jihu.“ Prstem přejede po mapě rozložené před námi.\n\n„Vidíš tuhle linii? Říkají jí Velká severní cesta.“ Zamyšleně si pohladí bradu. „Odjakživa je to jediná spolehlivá pozemní cesta na sever, ale dnes je ve velmi špatném stavu.“\n\nChápu ten problém. Taková cesta je požehnáním i prokletím. Zajistit bezpečný průchod pro nás je prvořadé, ale každou cestu mohou využít obě strany..."
 ep3_story_cycle_harrying.1005.a: "Opravte cestu a rozmístěte podél ní ozbrojené stráže."
 ep3_story_cycle_harrying.1005.b: "Potřebujeme cestu v dobrém stavu."
 ep3_story_cycle_harrying.1005.c: "Zničte každý její úsek pod anglosaskou kontrolou."
 ep3_story_cycle_harrying.1005.a.tt: "Každé [Concept('county','hrabství')|E] na [Glossary('Velké severní cestě','GNR_GLOSS')]"
 ep3_story_cycle_harrying.1005.c.tt1: "Všechna Anglosasy ovládaná [Concept('counties','hrabství')|E] na [Glossary('Velké severní cestě','GNR_GLOSS')]:"
 ep3_story_cycle_harrying.1005.c.tt2: "Všechna Normany ovládaná [Concept('counties','hrabství')|E] na [Glossary('Velké severní cestě','GNR_GLOSS')]:"
 GNR_GLOSS: "Cesta vybudovaná Římany, která vede podél značné části páteře Anglie. Velká severní cesta prochází následujícími [Concept('counties','hrabstvími')|E]:\n\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_middlesex').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_hertfordshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_bedford').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_northamptonshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_leicestershire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_nottinghamshire').GetBaseName]\n$EFFECT_LIST_BULLET$[GetTitleByKey('c_west_riding').GetBaseName]"
 ep3_story_cycle_harrying.1010.t: "Rozhodnutí o osudu"
 ep3_story_cycle_harrying.1010.desc: "Být válečným zajatcem je vskutku nešťastný úděl. Jedna taková ubohá duše na mě zasmušile hledí skrze mříže své cely.\n\n„Mám svou cenu, víte.“ Hlas je po dnech strávených v žaláři slabý, pisklavý a nakřáplý. „Jsem [captured.GetFirstName] z rodu [captured.GetHouse.GetBaseName]. Když pošlete zprávu mé rodině, dostanete za mě pěkné výkupné.“\n\nVýkupné? To by jistě nebylo špatné, ale v těchto těžkých časech může někdo, kdo je [captured.GetWomanMan] takového postavení, posloužit lépe jako výstraha než jako pouhý prostředek k získání zlata..."
 ep3_story_cycle_harrying.1010.a: "„[captured.Custom('GirlBoy')]... [Select_CString(captured.IsFemale,'vybrala sis','vybral sis')] špatně. Jsem [ROOT.Char.GetWomanMan], [Select_CString(ROOT.Char.IsFemale,'proti které','proti kterému')] ses [Select_CString(captured.IsFemale,'neměla','neměl')] stavět.“"
 ep3_story_cycle_harrying.1010.b: "„Nechám tě jít. Ale ponechám ti památku na svou #EMP pohostinnost#!.“"
 ep3_story_cycle_harrying.1010.c: "„Máš vytříbené vystupování. Skoro jako někdo z [ROOT.Char.GetCulture.GetNameNoTooltip] kultury...“"
 ep3_story_cycle_harrying.1010.c.success: "[captured.GetFirstNameNoTooltip|U] přijímá tvůj návrh"
 ep3_story_cycle_harrying.1010.c.failure: "[captured.GetFirstNameNoTooltip|U] se tvému návrhu vysmívá"
 ep3_story_cycle_harrying.1010.d: "„Můžeš tu shnít, dokud nebude zaplaceno tvé výkupné.“"
 ep3_story_cycle_harrying.1011.t: "[Select_CString(captured.IsFemale,'Pravá příslušnice','Pravý příslušník')] [ROOT.Char.GetCulture.GetNameNoTooltip] kultury"
 ep3_story_cycle_harrying.1011.desc: "K mému překvapení [Select_CString(captured.IsFemale,'ta','ten')] [captured.GetWomanMan] mou nabídku skutečně zvažuje.\n\n„Takže budu patřit k [ROOT.Char.GetCulture.GetName] kultuře?“ Slovo pomalu vysloví a přemítá nad tím, co to znamená. „A přijmete mě mezi sebe?“\n\nTaké se na chvíli zamyslím nad všemi důsledky své ukvapené nabídky. Pokud mám této zemi vládnout, budu kolem sebe potřebovat co nejvíce vlastních lidí. [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] jsou pro mou vládu nepostradatelní. Přijetí bývalých vládců mezi nás by navzdory našemu cizímu původu mohlo urychlit i to, že nás přijmou zdejší rolníci."
 ep3_story_cycle_harrying.1011.desc.spouse: "\n\nNáhle se mi sama od sebe vnukne myšlenka. [spouse_courtier.GetFirstName]! [Select_CString(spouse_courtier.IsFemale,'Možná by byla vhodnou manželkou','Možná by byl vhodným manželem')]..."
 ep3_story_cycle_harrying.1011.a.spouselanguage: "„[Select_CString(spouse_courtier.IsFemale,'Tvá nová manželka','Tvůj nový manžel')] ti navíc pomůže rychle se naučit jazyk.“"
 ep3_story_cycle_harrying.1011.a.language: "„A jakmile pro tebe [ROOT.Char.GetCulture.GetLanguage.GetName] přestane být cizí, bude z tebe [Select_CString(captured.IsFemale,'skutečná příslušnice','skutečný příslušník')] [ROOT.Char.GetCulture.GetNameNoTooltip] kultury.“"
 ep3_story_cycle_harrying.1011.b: "„Teď jdi. Jsi [Select_CString(captured.IsFemale,'volná','volný')].“"
 ep3_story_cycle_harrying.1015.t: "Mihotavé plameny"
 ep3_story_cycle_harrying.1015.desc: "#EMP Tohle#!, pomyslím si, když plameny šlehají výš, je odplata za pobuřování.\n\n[offending_village.GetName] bývalo ohniskem odporu proti mé vládě. Hořící budova, která ještě nedávno poskytovala těmto buřičům bezpečné útočiště, nyní vypouští do vzduchu tenký sloupec kouře. Sleduji jej a cítím, jak s ním stoupá i můj hněv.\n\nJak se #EMP opovažují#! mi vzdorovat? Spoluviní jsou i všichni ostatní odsud. Každý z nich musel přesně vědět, co ta skupina chystá. Nikdo z nich není bez viny!"
 ep3_story_cycle_harrying.1015.a: "Zapalte další budovu."
 ep3_story_cycle_harrying.1015.b: "Musí se naučit poslušnosti. Přesídlete polovinu obyvatel."
 ep3_story_cycle_harrying.1015.c: "Musím se ovládnout."
 ep3_story_cycle_harrying.1015.c.tt: "Co by mi jinak nakonec zbylo k vládnutí?"
 all_neighbouring_villages: "Všechny [Concept('holdings','državy')|E] sousedící s [offending_village.GetName]"
 ep3_story_cycle_harrying.2000.t: "Chřadnoucí duše"
 ep3_story_cycle_harrying.2000.desc: "Obyvatelé [location.GetName] trpí. Omezení přídělů obilí, která prosadil [william.GetTitledFirstNameRegnal], začínají tvrdě doléhat a lidem doslova ubývá maso z kostí. Jedna z těch ubohých duší pozná podle mého vystupování, kdo jsem, a vrhne se přede mnou na zem s prosbou.\n\n„Prosím!“ vykřikne a kostnatými prsty se mi křečovitě chytí nohou. „[Select_CString(starving_man.IsFemale,'Už dva dny jsem nic nejedla','Už dva dny jsem nic nejedl')]. Dva dny předtím jsem [Select_CString(starving_man.IsFemale,'měla jen jediné jídlo','měl jen jediné jídlo')]. Prosím, prosím... #DIE1 musíte #EMP něco udělat...#!#!“"
 ep3_story_cycle_harrying.2000.notcallous: "\n\n[Select_CString(starving_man.IsFemale,'Ta ubohá žena','Ten ubohý muž')]."
 ep3_story_cycle_harrying.2000.a: "Zaplatím dovoz z vlastní kapsy."
 ep3_story_cycle_harrying.2000.b: "„Pojď se mnou. Nakrmím tě.“"
 ep3_story_cycle_harrying.2000.c: "Možná přijdu na způsob, jak to napravit?"
 ep3_story_cycle_harrying.2000.c.success: "Tvé metody ke zvýšení zemědělské produkce fungují"
 ep3_story_cycle_harrying.2000.c.failure: "Tvé metody nefungují"
 ep3_story_cycle_harrying.2001.opening: "[marshal.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_story_cycle_harrying.2001.desc: "Produkce potravin v oblasti se stabilizovala a mnoho lidí, kteří byli dosud příliš zesláblí na práci, nyní nabízí své služby.\n\nTi nejsilnější z nich se hlásí jako bojovníci za tvou věc!"
 ep3_story_cycle_harrying.2001.a: "Přijměte je!"
 ep3_story_cycle_harrying.2001.b: "Bojovníky teď nepotřebuji."
 ep3_story_cycle_harrying.2001.b.tt: "Ale třeba se budou hodit v budoucnu..."
 ep3_story_cycle_harrying.2005.t: "Odklad popravy"
 ep3_story_cycle_harrying.2005.desc: "Jako [ROOT.Char.GetLadyLord] mého postavení musím občas činit těžká rozhodnutí. Právě na to myslím, když přede mě v řetězech přivedou [Select_CString(murderer.IsFemale,'nechvalně proslulou místní vražedkyni','nechvalně proslulého místního vraha')]. Přikážu [spymaster.GetFirstName], aby zajatce [Select_CString(spymaster.IsFemale,'odvedla','odvedl')] do zbrojnice, kde si můžeme promluvit v soukromí.\n\n[Select_CString(murderer.IsFemale,'Ta','Ten')] [murderer.GetWomanMan] si mě zvědavě prohlíží. Není téměř pochyb, že bez mého zásahu bude do konce týdne viset na šibenici. Pohlédnu na [spymaster.GetFirstNameNoTooltip] a jako potvrzení se mi dostane přikývnutí.\n\n„Potřebuji [Select_CString(murderer.IsFemale,'ženu tvých schopností','muže tvých schopností')]...“"
 ep3_story_cycle_harrying.2005.a: "Musíme zamířit na co nejvýše postavený cíl."
 ep3_story_cycle_harrying.2005.b: "Vezmi si tohle zlato, najmi pár hrdlořezů..."
 ep3_story_cycle_harrying.2005.b.tt: "A zabij každého Normana, kterého najdeš v [willy_vassal.GetName]."
 ep3_story_cycle_harrying.2005.c: "[Select_CString(murderer.IsFemale,'Takovou ženu','Takového muže')] je dobré mít po ruce."
 ep3_story_cycle_harrying.2010.t: "Válečné úsilí"
 ep3_story_cycle_harrying.2010.desc: "Patřím k nejmocnějším Æthelingům, a proto je na mně, abych [Select_CString(ROOT.Char.IsFemale,'získala','získal')] drobnou šlechtu pro naši spravedlivou věc. V sázce je mnoho, takže se všichni zdráhají postavit se za ni celou vahou svého vlivu, ale bez jejich podpory naše poslání nemůže uspět.\n\nOtázkou zůstává, jakou podporu vlastně potřebujeme. Zlato se samozřejmě hodí vždy, ale možná by šlo lid podnítit k aktivnějšímu odporu? Nebo snad potřebujeme skutečně organizovaný odpor?"
 ep3_story_cycle_harrying.2010.a: "Organizovaný odpor je správná cesta."
 ep3_story_cycle_harrying.2010.a.critsuccess: "Odpor rychle sílí"
 ep3_story_cycle_harrying.2010.a.success: "Odpor sílí"
 ep3_story_cycle_harrying.2010.a.failure: "Tvé prosby zůstávají bez odezvy"
 ep3_story_cycle_harrying.2010.a.critfailure: "Normané zachytí tvé zprávy"
 ep3_story_cycle_harrying.2010.b: "Požádám je o dary ve zlatě."
 ep3_story_cycle_harrying.2010.b.success: "Zlato rychle dorazí"
 ep3_story_cycle_harrying.2010.b.failure: "Šlechtici tvé prosby ignorují"
 ep3_story_cycle_harrying.2010.c: "Měli by povzbudit prostý lid k povstání."
 county_list_tt: "Každé Normany ovládané [Concept('county','hrabství')|E] v [Concept('realm','panství')|E] [william.GetTitledFirstNamePossessive]"
 ep3_story_cycle_harrying.2015.t: "Padělané postavení"
 ep3_story_cycle_harrying.2015.desc: "Když mi předají požadované listiny, téměř cítím, jak se mi třesou ruce. Padělky jsou vynikající. Nikdo o nich nemůže pochybovat. Můj nárok na tyto země je díky nim nepopiratelný a další se už připravují pro ostatní Æthelingy.\n\nPřede mnou však stojí mnohem větší otázka. K čemu přesně chci tuto výhodu využít? Existuje nespočet způsobů, jak napadnout postavení [william.GetTitledFirstNamePossessive] a především posílit to naše."
 ep3_story_cycle_harrying.2015.a: "Teď ať se nás zkusí zbavit..."
 ep3_story_cycle_harrying.2015.a.success: "[william.GetTitledFirstNameNoTooltip] se rozhněvaně podvolí"
 ep3_story_cycle_harrying.2015.a.failure: "[william.GetTitledFirstNameNoTooltip] neochvějně odmítá"
 ep3_story_cycle_harrying.2015.b: "Trocha větší svobody by naší věci mohla prospět."
 ep3_story_cycle_harrying.2015.c: "Možná nějaká zvláštní dohoda..."
 ep3_story_cycle_harrying.3000.t: "Vyšší dobro"
 ep3_story_cycle_harrying.3000.desc: "Jaký krásný kostelík! Jsem [Select_CString(ROOT.Char.IsFemale,'ráda','rád')], že mě výlet do [neighboring_church.GetName] zavedl právě sem. A podle nádherných filigránových ozdob to rozhodně není žádná skromná kaple. Z rozjímání mě náhle vytrhne hlas. Promluví [bishop.GetFaith.PriestNeuter].\n\n„Vím, kdo jste.“ Zvedne ruku, aby zarazil jakoukoli námitku. „A vím také, proč jste tady. Vaše pověst vás předchází, [Select_CString(ROOT.Char.IsFemale,'mladá','mladý')] [ROOT.Char.GetFirstNameNoTooltip]. Bylo jen otázkou času, kdy si najdete cestu i sem.“\n\n„Žádám jen jediné — a skutečně vás prosím. Jsem [bishop.GetWomanMan] a [bishop.GetFaith.HighGodName] je mi svědkem: nechte naše relikvie tam, kde jsou. Mince si vezměte, pokud musíte.“"
 ep3_story_cycle_harrying.3000.a: "...říkáte relikvie?"
 ep3_story_cycle_harrying.3000.b: "Tak hluboko neklesnu, abych z kostela [Select_CString(ROOT.Char.IsFemale,'ukradla','ukradl')] relikvii."
 ep3_story_cycle_harrying.3000.b.tt: "...měšec mincí je ovšem něco jiného..."
 ep3_story_cycle_harrying.3000.c: "„[bishop.GetMotherFather|U], není důvod k obavám. Ani ve snu by mě nenapadlo vás okrást.“"
 artifact_church_saint_brooch_name: "Brož světce"
 artifact_church_saint_brooch_description: "Stará cínová brož se stříbrným vykládáním, kterou prý kdysi nosil svatý [ROOT.Char.Custom('GetCatholicSaint')]. Kaple [neighboring_church.GetName] o ni přišla, když ji [ROOT.Char.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'ukradla','ukradl')]."
 ep3_story_cycle_harrying.3005.t: "Čepele v mlze"
 ep3_story_cycle_harrying.3005.desc: "Krčím se s taseným mečem, zatímco se kolem mě i mého malého, ale těžce ozbrojeného doprovodu svírá mlha. Jsme [ROOT.Char.GetWomenMen] a od cesty nás dělí jen několik yardů. Na ní se normanský žoldnéř snaží proniknout pohledem šerem.\n\nV čele karavany stojí [norman_soldier.GetWomanMan]. Podle šeptandy místních je vůz plný zbraní a zbroje a jeho cílem je [vassal_county.GetName]. Kdybychom jej zastavili, zasadili bychom nepříteli těžkou ránu a kořist bychom navíc mohli rozdělit mezi své spojence.\n\nPřede mnou je [norman_soldier.GetWomanMan] s působivým mečem, jehož čepel se matně leskne, zatímco kontroluji vlastní zbraň. Ať už nás čeká jakýkoli boj, bude to krvavá práce."
 ep3_story_cycle_harrying.3005.a: "Tvrdě a rychle. Ty zbraně budou naše!"
 ep3_story_cycle_harrying.3005.a.success: "Přepadení vyjde dokonale"
 ep3_story_cycle_harrying.3005.a.failure: "Přepadení se nezdaří"
 ep3_story_cycle_harrying.3005.b: "Naši spojenci tu výzbroj potřebují."
 ep3_story_cycle_harrying.3005.b.tt: "Každá poslední čepel připadne jim."
 ep3_story_cycle_harrying.3005.c: "Tohle počasí musíme využít ve svůj prospěch."
 ep3_story_cycle_harrying.3005.c.tt: "Pokud se dokážeme nepozorovaně vytratit a poškodit cestu před nimi, můžeme jejich příchod výrazně zpozdit bez jediného boje."
 every_knight: "Každý [Concept('knight','rytíř')|E]"
 every_anglo_vassal: "Každý anglosaský [Concept('vassal','vazal')|E], jehož lenním pánem je [william.GetTitledFirstName]"
 norman_sword_name: "Normanská čepel"
 stolen_norman_sword_name: "Ukradená normanská čepel"
 stolen_norman_sword_description: "Tento pohledný meč nese jasné známky normanské řemeslné práce. Zužující se čepel má po celé délce výrazný žlábek."
 ep3_story_cycle_harrying.3010.t: "Peníze, nebo život"
 ep3_story_cycle_harrying.3010.desc: "Vítr šelestí v korunách stromů, když [norman_noble.GetTitledFirstName] vyjede zpod mostu, přes který právě cestuje. Tiché šumění ani trochu nezakryje můj pronikavý hvizd a vzápětí se celá cesta zalije krví.\n\n[norman_noble.GetFirstNameNoTooltip|U] se zřítí ze sedla, když šíp zasáhne koně do slabiny. Z linie stromů vylétne celý roj šípů — past sklapla.\n\nMoji rytíři vyrazí vpřed, aby se utkali se svými protějšky a zajali je. Přistoupím k [norman_noble.GetTitleAsNameNoTooltip], který se právě zvedá na nohy a tasí meč."
 ep3_story_cycle_harrying.3010.a: "„[Select_CString(norman_noble.IsFemale,'Tas zbraň, normanská čubko.','Tas zbraň, normanský pse.')]“"
 ep3_story_cycle_harrying.3010.a.tt: "#V Souboj#! na život a na smrt: [norman_noble.GetFirstName].\nTvoje [Concept('prowess','udatnost')|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[norman_noble.GetFirstNamePossessive] [Concept('prowess','udatnost')|E]: [prowess_i]#V [norman_noble.GetProwess]#!"
 ep3_story_cycle_harrying.3010.b: "„Vzdej se svého bohatství a já své rytíře odvolám.“"
 ep3_story_cycle_harrying.3011.t: "Cesta ven"
 ep3_story_cycle_harrying.3011.desc: "Krev mi stéká z meče, zatímco jej otírám. Všude už panuje klid; přepadení bylo rychlé a brutální. Jakmile [norman_noble.GetFirstName] padl, mnozí z doprovodu zvedli ruce na znamení kapitulace. Chránit místní šlechtu je koneckonců práce, ne něco, za co stojí položit život. Když procházím kolem zajatců, [Select_CString(saxon_soldier_1.IsFemale,'jedna z nich','jeden z nich')] na mě zavolá.\n\n„Co s námi bude?“ zazní trochu nervózně. Další člověk hned vedle horlivě přikyvuje.\n\nDvojici si prohlédnu. Vypadají statně a v boji se zjevně umějí ohánět, ale prudkost našeho útoku je zaskočila. A soudě podle přízvuku to navíc nejsou Normané."
 ep3_story_cycle_harrying.3011.a: "Co říkáte na práci?"
 ep3_story_cycle_harrying.3011.b: "„Vraťte se domů. Ať se vám daří.“"
 ep3_story_cycle_harrying.3015.t: "Z moře"
 ep3_story_cycle_harrying.3015.desc: "Cizí vpády nejsou v těchto zemích ničím novým. Jenže poslední cizinci, kteří nám vládli, nakonec s touto zemí splynuli. Dánové splynuli s námi a my s nimi a právě z tohoto prolnutí vzešel i můj rod.\n\nSedím a přemítám. Anglie je lákavá kořist a [danish_king.GetTitledFirstName] by ji nepochybně rád získal. Dán na anglickém trůně by nebyl ničím novým. Dnes už jsou součástí nás samotných.\n\nRuka mi bezděčně zamíří k pergamenu a brku..."
 ep3_story_cycle_harrying.3015.a: "Nemůže-li vládnout Anglosas, ať vládne Dán."
 ep3_story_cycle_harrying.3015.a.success: "[danish_king.GetFirstNameNoTooltip] využije tvou prosbu k získání nároku"
 ep3_story_cycle_harrying.3015.a.failure: "[danish_king.GetFirstNameNoTooltip] se odmítne zapojit"
 ep3_story_cycle_harrying.3015.b: "Začít žádostí o vojáky dává smysl."
 ep3_story_cycle_harrying.3015.b.success: "[danish_king.GetFirstNameNoTooltip] ti pošle vojáky"
 ep3_story_cycle_harrying.3015.b.failure: "[danish_king.GetFirstNameNoTooltip] nemůže nikoho postrádat"
 ep3_story_cycle_harrying.3015.c: "Žádné dopisy. Tohle je jen náš boj."
 ep3_story_cycle_harrying.3020.t: "Pohodlí zrádce"
 ep3_story_cycle_harrying.3020.desc: "Šepot, který ke mně doléhá v [location.GetName], už je příliš hlasitý, než abych jej [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] přehlížet. Ta krysa [willy_vassal.GetTitledFirstName] si podle všeho až příliš zvyká na život pod cizí nadvládou. Mnohem příliš.\n\nHorší než Norman může být snad jen Anglosas, který s nimi kolaboruje. [willy_vassal.GetTitledFirstName] možná potřebuje návštěvu a trochu pomoci, aby [Select_CString(willy_vassal.IsFemale,'pochopila','pochopil')], jak hluboce se mýlí..."
 ep3_story_cycle_harrying.3020.a: "Vyrazím okamžitě."
 ep3_story_cycle_harrying.3020.a.tt: "Vydej se na cestu. Cíl: [willy_vassal_capital.GetName]"
 ep3_story_cycle_harrying.3020.b: "Ať si dál hnije."
 ep3_story_cycle_harrying.3021.t: "Tváří v tvář zmiji"
 ep3_story_cycle_harrying.3021.desc: "Pověsti nelhaly. [willy_vassal.GetFirstName] je se svými normanskými pány jedna ruka. Sebejistě se vrací z jakéhosi shromáždění s nimi a doprovází [Select_CString(willy_vassal.IsFemale,'ji','ho')] jen několik ozbrojených stráží.\n\nDám znamení. Vyskočíme ze stínů, moji druhové překvapí stráže a s meči u hrdel je přinutí znehybnět. [Select_CString(willy_vassal.IsFemale,'Nakonec přede mnou stojí samotná','Nakonec přede mnou stojí samotný')] [willy_vassal.GetFirstNameNoTooltip].\n\n„[Select_CString(ROOT.Char.IsFemale,'Vy jste... vy jste ta žena, že? Ta, o které všichni mluví. Ta z mokřin...','Vy jste... vy jste ten muž, že? Ten, o kterém všichni mluví. Ten z mokřin...')]“ zazní koktavě."
 ep3_story_cycle_harrying.3021.a: "„Tas meč, červe.“"
 ep3_story_cycle_harrying.3021.a.tt: "#V Souboj#! na život a na smrt: [willy_vassal.GetFirstName].\nTvoje [Concept('prowess','udatnost')|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[willy_vassal.GetFirstNamePossessive] [Concept('prowess','udatnost')|E]: [prowess_i]#V [willy_vassal.GetProwess]#!"
 ep3_story_cycle_harrying.3021.b: "„Chci si jen promluvit, [willy_vassal.GetFirstNameNoTooltip].“"
 ep3_story_cycle_harrying.3021.b.success: "[willy_vassal.GetTitledFirstNameNoTooltip] se přidá na tvou stranu"
 ep3_story_cycle_harrying.3021.b.failure: "[willy_vassal.GetTitledFirstNameNoTooltip] odmítá uznat tvé argumenty"
 ep3_story_cycle_harrying.3021.c: "„#EMP [willy.GetFirstNameNoTooltip]#! v tobě budí strach? Počkej, až uvidíš, co dokážu já...“"
 ep3_story_cycle_harrying.3021.c.success: "[willy_vassal.GetTitledFirstNameNoTooltip] se přidá na tvou stranu"
 ep3_story_cycle_harrying.3021.c.failure: "[willy_vassal.GetTitledFirstNameNoTooltip] se nenechá zastrašit"
 ep3_story_cycle_harrying.3021.d: "„Každý věrný Anglosas tady má místo po mém boku.“"
 ep3_story_cycle_harrying.3021.d.flavour: "Jejich životy mají pro mě tisíckrát větší cenu než [Select_CString(willy_vassal.IsFemale,'její','jeho')]."
 ep3_story_cycle_harrying.3022.t: "Dost"
 ep3_story_cycle_harrying.3022.desc: "Překročím bezvládné tělo [willy_vassal.GetFirstName]. Osobní stráž se rozprchne, protože už nemá důvod zůstávat.\n\n[willy_vassal.GetFirstNameNoTooltip] [Select_CString(willy_vassal.IsFemale,'byla ženou','byl mužem')] nemalého bohatství a byla by škoda nechat je přijít nazmar. Prsty prohledávám kapsy a váčky, tu seberu pár mincí, tam [newly_created_artifact.GetName].\n\nZnovu se narovnám a pohlédnu na mrtvolu.\n\nJe čas vyslat vzkaz."
 ep3_story_cycle_harrying.3022.a: "Vím o někom, komu by se dárek mohl líbit..."
 ep3_story_cycle_harrying.3022.b: "Lidé by měli vědět, jakou spravedlnost vykonáváme."
 ep3_story_cycle_harrying.3050.opening: "Herewardovi, nechvalně proslulé kryse z mokřin,"
 ep3_story_cycle_harrying.3050.desc: "Mám pro tebe nabídku.\n\nCo nejdříve se vydej do [london.GetNameNoTier]. Budeš chtít slyšet, co ti nabízím.\n\nNenechávej mě čekat."
 ep3_story_cycle_harrying.3050.a: "Vyslechnu si, co [william.GetFirstNameNoTooltip] nabízí."
 ep3_story_cycle_harrying.3050.a.tt: "Vydej se do $cn_lunden$.\n#Weak Dřív umřu, než tomu začnu říkat „#EMP $cn_londres$#!“...#!"
 ep3_story_cycle_harrying.3050.b: "Tohle je očividně past."
 ep3_story_cycle_harrying.3051.t: "Bastard na trůnu"
 ep3_story_cycle_harrying.3051.desc: "Síně moci jsou vskutku velkolepé. Když mě uvedou před [william.GetTitledFirstNameRegnal], strnule sedí na trůnu, ale okázalost okolí přece jen trochu zmírňuje dojem z té nepohodlné pózy.\n\n„[ROOT.Char.GetFirstNameNoTooltip]. [Select_CString(ROOT.Char.IsFemale,'Žena, která','Muž, který')] proměnil krajinu jižně od Washe v takové popraviště.“ Rty [william.GetFirstNameNoTooltip] se vztekle zkřiví, když se mi nepodaří úplně skrýt potěšení nad tímto popisem.\n\n„Nemyslel jsem si, že přijdeš. Čekal jsem, že zůstaneš zalezlá na svém ostrově. Zjevně jsi [Select_CString(ROOT.Char.IsFemale,'žena plná překvapení','muž plný překvapení')].“\n\nZnovu vzhlédnu k [william.GetFirstNameNoTooltip], cizáckému bastardovi na onom slavném trůnu."
 ep3_story_cycle_harrying.3051.a: "„Ten trůn je na tebe trochu velký, nemyslíš?“"
 ep3_story_cycle_harrying.3051.a.success: "[william.GetFirstNameNoTooltip] to přejde"
 ep3_story_cycle_harrying.3051.a.failure: "[william.GetFirstNameNoTooltip] ti přikáže mlčet"
 ep3_story_cycle_harrying.3051.b: "„Jaká je tvá nabídka?“"
 ep3_story_cycle_harrying.3051.b.tt: "Nemá smysl dál si vyměňovat urážky."
 ep3_story_cycle_harrying.3052.t: "Ďáblova dohoda"
 ep3_story_cycle_harrying.3052.desc: "„Znám tě, [ROOT.Char.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetDaughterSon')] [father.GetFirstName]. Vím, proč děláš to, co děláš. Dokonce vím, proč jsi tady.“ [william.GetFirstName] se při řeči nakloní dopředu a probodává mě pohledem.\n\n„Vím, co tě žene vpřed, a vím, po čem toužíš.“ Sáhne po svitku vedle sebe a podá jej strážnému. Zatímco strážný se svitkem v ruce přichází ke mně, pokračuje.\n\n„Tato listina ti dává celý [cambridgeshire.GetName]. Nejen Ely. Všechno.“ [william.GetFirstNameNoTooltip], nový vládce těchto zemí, se vítězoslavně opře dozadu.\n\n„Tohle všechno může být tvoje. Stačí složit zbraně a už proti mně nikdy nevytáhnout čepel.“"
 ep3_story_cycle_harrying.3052.a: "Můj domov! Domov mých předků..."
 ep3_story_cycle_harrying.3052.a.flavor: "Takovou nabídku prostě nelze odmítnout."
 ep3_story_cycle_harrying.3052.a.tt: "[william.GetFirstNameNoTooltip] zavolá písaře..."
 ep3_story_cycle_harrying.3052.b: "„...vrať mi mého bratra, normanský červe.“"
 ep3_story_cycle_harrying.3053.t: "Třicet stříbrných"
 ep3_story_cycle_harrying.3053.desc: "Široký, zlovolný úšklebek, který se rozlije po tváři [william.GetTitledFirstName], mi obrátí žaludek. Pokyne písaři.\n\n„Výborná volba. Tobě i tvé rodině zajistí pohodlí a blahobyt na celé generace!“ [william.GetFirstNameNoTooltip] vstane z trůnu a upřeně se mi zadívá do očí.\n\n„Pamatuj. Tohle všechno získáš výměnou za to, že proti mně už do konce svých dnů nehneš ani prstem. Jestli zaslechnu byť jen sebemenší zvěst, že se v Cambridgeshire obtahuje na brousku něco většího než řeznický sekáček...“\n\nOtupěle přikývnu na souhlas. Pohlédnu na svou ruku natahující se po listinách a pak zpět na potměšilý úsměv [william.GetFirstNameNoTooltip]."
 ep3_story_cycle_harrying.3053.a: "...nedokážu to."
 ep3_story_cycle_harrying.3053.b: "„Kde mám podepsat?“"
 ep3_story_cycle_harrying.3053.b.tt: "@warning_icon! #X Tím ukončíš svůj odpor proti Normanům i svou účast na [harrying_widget_i]Pustošení severu!#!"
 ep3_story_cycle_harrying.3054.t: "Ďáblův díl"
 ep3_story_cycle_harrying.3054.desc: "Tvář [william.GetTitledFirstName] se náhle zkřiví hněvem.\n\n„Ty hlupáku,“ procedí jedovatě, „ty krátkozraký, tupý #EMP hlupáku!#!“ Pokyne strážím, aby postoupily vpřed.\n\n„Copak to nevidíš? Křečovitě se držíš minulosti! Honíš se za životem, který ti už [ROOT.Char.GetFaith.HighGodName] odepřel! Držíš se zásad jen proto, že se jich odmítáš vzdát!“\n\nZběsile se rozhlédnu. Dveře, kterými jsem přišel, stále hlídá jen několik strážných. Kdyby se mi jen podařilo prorazit...\n\n„#EMP Chyťte [Select_CString(ROOT.Char.IsFemale,'ji','ho')]!#!“"
 ep3_story_cycle_harrying.3054.a: "Bez boje mě nedostanou!"
 ep3_story_cycle_harrying.3054.a.success: "Podaří se ti uprchnout!"
 ep3_story_cycle_harrying.3054.a.failure: "Dopadnou tě a za tvůj odpor tě zbijí"
 ep3_story_cycle_harrying.3054.b: "Nemá to cenu."
 ep3_story_cycle_harrying.3054.b.tt: "Raději si ušetřím síly. Budu je potřebovat."
 ep3_story_cycle_harrying.3055.t: "Železná cena"
 ep3_story_cycle_harrying.3055.desc: "Rána do břicha mě ohne v pase a vzápětí mi zkroutí ruce za záda. Když mě odvádějí, před očima se mi míhají přísné a rozzuřené tváře — a vzadu dokonce jedna, která jako by se mnou soucítila.\n\nCesta je krátká, ale zrádná. S každým schodištěm, po němž sestupujeme, ubývá denního světla. Zanedlouho už mám ruce v železech a jsem připoután ke zdi své cely.\n\n„Považuj se za šťastlivce, že ještě žiješ, bandito.“ Hlas [william.GetTitledFirstName] se odráží od vlhkých kamenných zdí. Na okamžik si prohlédne okolí. „Anebo... možná takové štěstí nemáš.“\n\n[william.GetFirstNameNoTooltip] se otočí na patě a se svým doprovodem odkráčí. Zůstanu sám."
 ep3_story_cycle_harrying.3055.a: "No... sakra."
 ep3_story_cycle_harrying.3056.opening: "Statečnému pánu Herewardovi,"
 ep3_story_cycle_harrying.3056.desc: "Musíš nám věřit.\n\nZa tři noci zůstane tvá cela po přinesení jídla odemčená. Zůstaň uvnitř až do setmění.\n\nVyjdi po schodech, dej se druhou chodbou vlevo a pak první vpravo.\n\n#BOL NEJSI SÁM.#!"
 ep3_story_cycle_harrying.3056.a: "Cože?"
 ep3_story_cycle_harrying.3057.t: "Svoboda"
 ep3_story_cycle_harrying.3057.desc: "Podle pokynů počkám, až se definitivně setmí, a teprve pak zkusím zámek své cely. Dveře se s tichým zavrzáním otevřou a já okamžitě vyrazím po schodech vzhůru. Druhá chodba vlevo, první vpravo, další schodiště a...\n\nVyrazím ven do svěžího nočního vzduchu. Kousek ode mě se krčí zahalená postava a pozoruje mě. Poznávám v ní [sympathetic_courtier.GetFirstNameNoTooltip], soucitnou tvář, kterou jsem zahlédl, když mě odváděli do cely.\n\n„[Select_CString(ROOT.Char.IsFemale,'Dokázala jste to','Dokázal jste to')]!“ radostně mě přivítá [sympathetic_courtier.GetFirstNameNoTooltip] a ukáže na cestu vinoucí se městem. „Tudy se jde na sever. Když vyrazíte hned, budete pryč dřív, než si něčeho všimnou.“"
 ep3_story_cycle_harrying.3057.a: "Pojď se mnou!"
 ep3_story_cycle_harrying.3057.a.success: "[sympathetic_courtier.GetFirstNameNoTooltip] s radostí souhlasí"
 ep3_story_cycle_harrying.3057.a.failure: "[sympathetic_courtier.GetFirstNameNoTooltip] tě neochotně odmítne"
 ep3_story_cycle_harrying.3057.b: "Nikdy na tebe nezapomenu. Běž rychle, než tě odhalí."
