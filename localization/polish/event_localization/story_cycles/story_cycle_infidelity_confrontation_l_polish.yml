l_polish:
 infidelity_confrontation.1000.t: "Nevěra"
 infidelity_confrontation.1000.confession.apologetic_start.desc: "[infidelity_partner.GetFirstName] mlčí, jako by zamrzl čas, ale pohled mluví za vše. Mé obavy se naplnily. Ani já se nedokážu pohnout — jen srdce mi zběsile buší.\n\nKdyž se konečně prolomí mlčení, [infidelity_partner.GetFirstName] se rozpláče.\n\n„Ach, [infidelity_partner.Custom2('RelationToMeShort', ROOT.Char)], nikdy jsem ti [Select_CString(infidelity_partner.IsFemale,'nechtěla','nechtěl')] ublížit. Přísahám! Já... všechno ti povím. Je to "
 infidelity_confrontation.1000.confession.your_lovername.desc: "[infidelity_partners_lover.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]."
 infidelity_confrontation.1000.confession.my_lovername.desc: "[infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', infidelity_partner)]."
 infidelity_confrontation.1000.confession.apologetic_end.desc: ""
 infidelity_confrontation.1000.confession.unapologetic_start.desc: "Mé obvinění [infidelity_partner.GetFirstNameNoTooltip] očividně zaskočí, ale vzpamatování netrvá dlouho.\n\n„Tak konečně ti to došlo, #EMP [infidelity_partner.Custom2('RelationToMeShort', ROOT.Char)]#!.“ V hlase je samý jed. „Ano, někdo jiný tu byl — "
 infidelity_confrontation.1000.confession.unapologetic_end_opposite_sex.desc: "raději bych [Select_CString(infidelity_partner.IsFemale,'vystřídala','vystřídal')] stovku jiných, než [Select_CString(infidelity_partner.IsFemale,'strávila','strávil')] jedinou noc s tebou.“"
 infidelity_confrontation.1000.confession.unapologetic_end_same_sex.desc: "[Select_CString(infidelity_partners_lover.IsFemale,'Je dvakrát větší žena, než kdy budeš ty.','Je dvakrát větší muž, než kdy budeš ty.')]“"
 infidelity_controntation.1000.partner_exposed_intro.desc: "[infidelity_partner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(infidelity_partner.IsFemale,'se přiznala','se přiznal')] k nevěře! Druhou stranou poměru je [infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 infidelity_controntation.1000.partners_lover_exposed_intro.desc: "[infidelity_partners_lover.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(infidelity_partners_lover.IsFemale,'se přiznala','se přiznal')] k nevěře! Druhou stranou poměru je [infidelity_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!\n\n"
 infidelity_controntation.1000.exposed_intro.desc: "[exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] odhaluje, že [infidelity_partner.GetFirstName] a [infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] spolu mají poměr!\n\n"
 infidelity_controntation.1000.investigation_intro.desc: "Mé vyšetřování uspělo a obavy se potvrdily. [infidelity_partner.GetFirstName] a [infidelity_partners_lover.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] spolu mají poměr!\n\n"
 infidelity_controntation.1000.exposed_knew.desc: "Teď, když je všechno venku, si [infidelity_partner.GetFirstName] i [infidelity_partners_lover.Custom2('InsultNounSexual', ROOT.Char)] ponesou následky svých činů."
 infidelity_controntation.1000.start_lover.desc: "Jako by nestačila samotná nevěra,"
 infidelity_controntation.1000.start_spouse.desc: "Jako by nestačilo znesvěcení našeho manželství,"
 infidelity_controntation.1000.incest.desc: " ještě k tomu [infidelity_partner.GetFirstName] a [infidelity_partners_lover.GetFirstName] skončili spolu v posteli! Vždyť [infidelity_partners_lover.GetFirstNameNoTooltip] je [infidelity_partner.Custom2('RelationToMeShort', SCOPE.sC('infidelity_partners_lover'))]!\n\nMožná to vlastně nemělo být překvapení. Vždycky mezi nimi byla taková... blízkost. [ROOT.Char.GetFaith.HighGodName] ví, že při pomyšlení na ně spolu... se mi zvedá žaludek."
 infidelity_controntation.1000.sodomy.desc: " ještě k tomu [infidelity_partner.GetFirstName] a [infidelity_partners_lover.GetFirstName] skončili spolu v posteli! A [infidelity_partners_lover.GetFirstNameNoTooltip] je navíc #EMP [infidelity_partners_lover.GetWomanMan]#!!\n\n[ROOT.Char.GetFaith.HighGodName] ví, že při pomyšlení na to, co spolu dělají... se mi zvedá žaludek."
 infidelity_controntation.1000.regular.desc: " jak může [infidelity_partner.GetTitledFirstName] sdílet lože s někým jiným? Jak mi může něco takového udělat? Možná se nikdy nedozvím proč, ale o vině není pochyb."
 infidelity_confrontation.1000.demand_break_up.lover: "Vyber si. Buď [infidelity_partners_lover.GetFirstNameNoTooltip], nebo já!"
 infidelity_confrontation.1000.demand_break_up.spouse: "Ukonči to, nebo #EMP poneseš#! následky!"
 infidelity_confrontation.1000.demand_break_up.success: "[infidelity_partner.GetFirstNameNoTooltip] ustoupí tvému požadavku"
 infidelity_confrontation.1000.break_up.failure: "[infidelity_partner.GetFirstNameNoTooltip] odmítne poměr ukončit"
 infidelity_confrontation.1000.demand_break_up.flavor: "[infidelity_partner.GetFirstNameNoTooltip] spíš vyhoví, pokud se bude obávat následků"
 infidelity_confrontation.1000.plead_break_up: "Lásko, prosím tě! Skoncuj s tímhle šílenstvím!"
 infidelity_confrontation.1000.plead_break_up.flavor: "[infidelity_partner.GetFirstNameNoTooltip] spíš vyhoví, pokud k tobě něco cítí nebo tě lituje"
 infidelity_confrontation.1000.plead_break_up.success: "[infidelity_partner.GetFirstNameNoTooltip] ukončí poměr a prosí o odpuštění"
 infidelity_confrontation.1000.break_up: "Bylo mi #EMP jasné#!, že si mou náklonnost nezaslouží."
 infidelity_confrontation.1000.expose: "Celý svět se dozví o vašem hanebném poměru!"
 infidelity_confrontation.1000.blackmail: "Určitě chceš, aby to zůstalo tajemstvím..."
 infidelity_confrontation.1000.imprison: "Láska tě v žaláři zahřeje."
 infidelity_confrontation.1000.opt_out: "Potřebuji čas na rozmyšlenou..."
 infidelity_confrontation.1000.opt_out.knew: "Tahle fraška mě unavuje."
 infidelity_confrontation.1000.opt_out.blackmail.tt: "Mohu zvážit [Concept('blackmailing','vydírání')|E], oplatit nevěru stejnou mincí nebo odpustit"
 infidelity_confrontation.1000.opt_out.divorce.tt: "Mohu zvážit [Concept('divorcing','rozvádění')|E], oplatit nevěru stejnou mincí nebo odpustit"
 infidelity_confrontation.1000.opt_out.fallback.tt: "Mohu zvážit, zda nevěru oplatit stejnou mincí, nebo odpustit"
 infidelity_confrontation.1010.start.desc: "„Vím všechno! Ty a [infidelity_partners_lover.GetTitledFirstNameNoTooltip] spolu máte poměr! Ani se to nepokoušej popírat!“"
 infidelity_confrontation.1010.sad.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstName] stojí přede mnou. Hlas se [Select_CString(confronting_partner.IsFemale,'ji','mu')] třese a po tvářích stékají slzy.\n\n"
 infidelity_confrontation.1010.angry.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstName] křičí tak, že mi hlas proniká až do morku kostí. Jen s vypětím všech sil sebou necuknu.\n\n"
 infidelity_confrontation.1010.break_up.desc: "„Už to dál nesnesu, [ROOT.Char.GetFirstNameNoTooltip]. Musíš si vybrat. Buď [infidelity_partners_lover.GetFirstNameNoTooltip], nebo já!“"
 infidelity_confrontation.1010.celibacy.desc: "„Jestli ten poměr neukončíš, už s tebou nikdy nebudu sdílet lože!“"
 infidelity_confrontation.1010.imprisonment.desc: "„Jestli ten poměr neukončíš, rozdělí vás železné mříže!“"
 infidelity_confrontation.1010.a: "Ukončím to, přísahám!"
 infidelity_confrontation.1010.c: "Dělej, co chceš — [infidelity_partners_lover.GetFirstNameNoTooltip] a já k sobě patříme!"
 infidelity_confrontation.1011.unapologetic_start.desc: "[infidelity_partner.GetFirstNamePossessive] oči planou jako požár, ale hlas zůstává ledově chladný.\n\n„Myslíš, že výhrůžkami napravíš "
 infidelity_confrontation.1011.unapologetic_marriage.desc: "naše manželství, "
 infidelity_confrontation.1011.unapologetic_love.desc: "naši lásku, "
 infidelity_confrontation.1011.unapologetic_end.desc: "[ROOT.Char.GetFirstNameNoTooltip]? Dobře. Bude po tvém. Ale nic si nenamlouvej. Toho, co jsem [Select_CString(infidelity_partner.IsFemale,'udělala','udělal')], nelituji. Ani na okamžik.“"
 infidelity_confrontation.1011.a: "Bude to mezi námi ještě někdy jako dřív?"
 infidelity_confrontation.1011.apologetic_start.desc: "Po [infidelity_partner.GetFirstNamePossessive] tvářích stékají slzy. Jsou to slzy lítosti, nebo strachu?\n\n„Prosím, musíš mi odpustit. Prosím tě! Ukončím to, samozřejmě že ano. Byla to hloupá chyba, nic víc! Přísahám!“"
 infidelity_confrontation.1012.apologetic_start.desc: "Když vyslovím svůj požadavek, [infidelity_partner.GetFirstName] zůstává bez hnutí a mlčí, zatímco po tvářích stékají slzy. Když konečně promluví, slyším něco úplně jiného, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')].\n\n"
 infidelity_confrontation.1012.apologetic_imprisonment.desc: "„Je mi to líto, ale nemohu. Raději strávím zbytek života v žaláři, než abych [Select_CString(infidelity_partner.IsFemale,'popřela','popřel')] své city k [infidelity_partners_lover.GetFirstName]. Jestli mě tolik nenávidíš, jestli chceš, abych [Select_CString(infidelity_partner.IsFemale,'trpěla','trpěl')], tak dobrá.“"
 infidelity_confrontation.1012.apologetic_break_up.desc: "„Nikdy jsem ti [Select_CString(infidelity_partner.IsFemale,'nechtěla','nechtěl')] ublížit a za to se omlouvám. Ale své city k [infidelity_partners_lover.GetFirstName] popřít nedokážu. To, co mezi námi je, se nedá s ničím srovnat. Ani s tebou.“"
 infidelity_confrontation.1012.unapologetic_imprisonment.desc: "„[ROOT.Char.GetFirstNameNoTooltip]? Raději strávím zbytek života v žaláři než další jedinou vteřinu s tebou!“"
 infidelity_confrontation.1012.unapologetic_break_up.desc: "„[ROOT.Char.GetFirstNameNoTooltip]? Vždycky jsi [Select_CString(ROOT.Char.IsFemale,'byla hloupá','byl hloupý')]. Díky, že jsi mi [Select_CString(ROOT.Char.IsFemale,'otevřela','otevřel')] oči. Ještě nikdy jsem tě [Select_CString(infidelity_partner.IsFemale,'neviděla','neviděl')] tak jasně!“"
 infidelity_confrontation.1012.a: "Dobrá! Ať je po tvém, ty [infidelity_partner.Custom2('InsultAdjective', ROOT.Char)] [infidelity_partner.Custom2('InsultNounSexual', ROOT.Char)]!"
 infidelity_confrontation.1013.t: "[infidelity_partners_lover.Custom2('AppropriateGreeting', infidelity_partner)]"
 infidelity_confrontation.1013.love.desc: "[ROOT.Char.Custom('LoverPetName')|U], [Select_CString(infidelity_partner.IsFemale,'myslela','myslel')] jsem, že budeme navždy spolu a nic nás nedokáže rozdělit. Ale ať mi na tobě záleží sebevíc, už nemohu přehlížet krutou skutečnost. Naše sny byly nádherné a sladké, ale nikdy nebyly ničím víc než sny. A teď už se nikdy nesplní.\n\nNavzdory všemu musíme pokračovat dál, má lásko. Jestli spolu nemůžeme být v tomto životě, nezbývá nám než trpělivě čekat na ten příští."
 infidelity_confrontation.1013.like.desc: "[ROOT.Char.Custom('LoverPetName')|U], tento dopis píšu s těžkým srdcem. Měli jsme sen, nádherný a radostný sen. Jenže nikdy nebyl ničím víc a jakkoli to bolí, odpověď je jasná. Nemůžeme spolu pokračovat.\n\nDěkuji ti za všechny krásné chvíle. Nikdy na ně nezapomenu. Ať je tvůj život dlouhý a šťastný."
 infidelity_confrontation.1013.neutral.desc: "Náš poměr, jakkoli byl příjemný, už není soukromou záležitostí. Bylo to hezké, dokud to trvalo, ale teď musí přijít konec.\n\nOpatruj se, [ROOT.Char.GetTitledFirstNameNoTooltip]. Dnes může tohle rozloučení bolet, ale věř mi, brzy na ně zapomeneš."
 infidelity_confrontation.1013.a: "A ani jsme nedostali šanci políbit se na rozloučenou..."
 infidelity_confrontation.1001.kind_start.desc: "[confronting_partner.GetFirstNamePossessive] slzy bolí mnohem víc, než by kdy dokázala ostrá slova. Vždyť je roní [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNameNoTooltip]. Sklíčeně sleduji, jak "
 infidelity_confrontation.1001.unkind_start.desc: "Jsou [confronting_partner.GetFirstNamePossessive] slzy vůbec opravdové? Možná [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] [confronting_partner.GetFirstNameNoTooltip] jen hraje divadlo, aby ve mně [Select_CString(confronting_partner.IsFemale,'vzbudila','vzbudil')] lítost? Podrážděně si povzdechnu, když "
 infidelity_confrontation.1001.love_end.desc: "[confronting_partner.GetFirstName] zaboří tvář do mého oděvu a [ROOT.Char.Custom('GetClothingArticle')] rychle nasákne slzami.\n\n„[ROOT.Char.GetFirstNameNoTooltip], jak jsi mi to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] udělat? Miluji tě, [Select_CString(ROOT.Char.IsFemale,'ty bláhová ženo','ty bláhový muži')]!“ [confronting_partner.GetFirstName] se dlouze a rozechvěle nadechne. „Vrať se ke mně, [ROOT.Char.Custom('LoverPetName')]. Opusť tu [infidelity_partners_lover.Custom2('InsultNoun', SCOPE.sC('confronting_partner'))] a všechno ti odpustím.“"
 infidelity_confrontation.1001.regular_end.desc: "[confronting_partner.GetFirstName] si kapesníkem otře tváře.\n\n„Vím, že jako [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('confronting_partner'))] mám své chyby, ale tohle si nezasloužím. Nikdo z nás. Prosím tě, vzpamatuj se a opusť tu [infidelity_partners_lover.Custom2('InsultNoun', SCOPE.sC('confronting_partner'))]. Ještě není pozdě dát věci do pořádku.“"
 infidelity_confrontation.1020.a: "Udělám cokoli, abych si [Select_CString(ROOT.Char.IsFemale,'zasloužila','zasloužil')] tvé odpuštění!"
 infidelity_confrontation.1020.b: "Své city k [infidelity_partners_lover.GetFirstNameNoTooltip] popřít nedokážu!"
 infidelity_confrontation.1021.love.desc: "Úleva ve [infidelity_partner.GetFirstNamePossessive] tváři se nedá přehlédnout. Vzápětí přijdou slzy a [infidelity_partner.GetFirstName] se mi vrhne do náruče. Na krku cítím jejich vlhkost.\n\n„Tvé odpuštění si nezasloužím,“ zazní mezi vzlyky. „Ale udělám všechno, co bude v mých silách, abych to [Select_CString(infidelity_partner.IsFemale,'napravila','napravil')]. Přísahám, má lásko. Přísahám na svůj život.“"
 infidelity_confrontation.1021.regular.desc: "Stud ve [infidelity_partner.GetFirstNamePossessive] tváři se nedá přehlédnout. „[Select_CString(infidelity_partner.IsFemale,'Namluvila','Namluvil')] jsem si, že jsem [Select_CString(infidelity_partner.IsFemale,'neudělala','neudělal')] nic špatného, ale teď, když je všechno venku...“\n\n[infidelity_partner.GetFirstName] si s povzdechem potřese hlavou. „Konečně vidím, jak moc jsem [Select_CString(infidelity_partner.IsFemale,'chybovala','chyboval')]. Odpusť mi, [ROOT.Char.GetFirstNameNoTooltip]. Zkusme to znovu.“"
 infidelity_confrontation.1021.a: "Bude to chtít čas, ale dáme to zase dohromady."
 infidelity_confrontation.1021.unapologetic_start.desc: "„Nech toho divadla,“ pronese [infidelity_partner.GetFirstName] [infidelity_partner.Custom('quirk_neg_pp')]. „Žádné slzy mě nepřimějí změnit názor. Přestaň plýtvat svým časem i mým.“\n\nJak může být [infidelity_partner.GetFirstNameNoTooltip] tak [Select_CString(infidelity_partner.IsFemale,'chladná','chladný')]?"
 infidelity_confrontation.1022.apologetic_start.desc: "Když prosím [infidelity_partner.GetFirstName] o lásku, zůstává přede mnou bez hnutí a mlčí, zatímco po tvářích stékají slzy. Když konečně promluví, slyším něco úplně jiného, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')].\n\n"
 infidelity_confrontation.1022.a: "Nabízím ti své srdce, a ty je zahodíš?"
 infidelity_confrontation.1030.t: "[confronting_partner.Custom2('AppropriateGreetingNegative', infidelity_partner)]"
 infidelity_confrontation.1030.desc: "[Select_CString(confronting_partner.IsFemale,'Dozvěděla','Dozvěděl')] jsem se o tvém odporném románku s [infidelity_partners_lover.GetTitledFirstName]. Děkuji, že jsi tak jasně [Select_CString(ROOT.Char.IsFemale,'ukázala','ukázal')], kým doopravdy jsi!\n\nTeď už není pochyb, co jsi zač: [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('confronting_partner'))] [ROOT.Char.Custom2('InsultNounSexual', SCOPE.sC('confronting_partner'))]. Nestojíš ani za inkoust na mém brku! Jakmile tento dopis odešlu, už ti nevěnuji jedinou myšlenku."
 infidelity_confrontation.1030.a: "Kdybys mi jen [Select_CString(confronting_partner.IsFemale,'dovolila','dovolil')] všechno vysvětlit!"
