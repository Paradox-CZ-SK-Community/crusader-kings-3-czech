l_polish:
 murders_at_court.1001.t: "Vraždy u dvora: Modlitba za bezejmennou oběť"
 murders_at_court.1001.desc_physician: "„Dnes ráno byly nalezeny části lidského těla, [ROOT.Char.Custom('FormOfAddressForLiege')],“ pronese [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] a ukáže na stůl před námi. Kolem malých hromádek masa se na desce slévá krev a v temné břečce leží cáry tkáně.\n\n„Jak vidíte, není to celý... člověk. Není toho dost, abychom zjistili, komu ostatky patřily.“"
 murders_at_court.1001.desc: "„Dnes ráno byly nalezeny části lidského těla, [ROOT.Char.Custom('FormOfAddressForLiege')],“ ozve se jeden ze strážných a ukáže na stůl před námi. Kolem malých hromádek masa se na desce slévá krev a v temné břečce leží cáry tkáně.\n\n„Jak vidíte, není to celý... člověk. Není toho dost, abychom zjistili, komu ostatky patřily.“"
 murders_at_court.1001.a: "Pomodlím se za oběť."
 murders_at_court.1001.b: "Dbejte, aby byl #EMP každý#! neustále pod dohledem."
 murders_at_court.1001.b.tt: "Omezím pohyb všech u dvora — snad tím vytvořím dostatečný tlak, aby se pachatel prozradil"
 murder_at_court_movement_restricted_courtiers_craven: "Všichni zbabělí dvořané"
 murder_at_court_movement_restricted_courtiers_other: "Všichni ostatní dvořané"
 murder_at_court_movement_restricted_courtiers: "Všichni dvořané"
 murders_at_court.1001.c: "Zdvojnásobte stráže!"
 murders_at_court.1001.c.tt: "Posílené stráže vraha jistě odradí — nebo mu alespoň ztíží práci"
 murders_at_court.1001.d: "Nikdo nic neviděl? Prosím, potřebuji vaši pomoc!"
 murders_at_court.1001.d.tt: "Po celém panství dám na vědomí, že hledám informace a stopy"
 murders_at_court.1001.e: "Vyšetřím to. Osobně."
 murders_at_court.1001.e.tt: "Při vyšetřování tohoto případu využiji své znalosti"
 murders_at_court.1002.t: "Vraždy u dvora: Vražda za úsvitu"
 murders_at_court.1002.desc_named: "S východem slunce přichází zpráva, že [victim.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(victim.IsFemale,'byla zavražděna','byl zavražděn')] během noci. Brutálně vykuchané tělo vrah vystavil tak, aby je spatřil každý, kdo půjde kolem...\n\nTělo rychle odnesou a do západu slunce nezůstane po hrůzném činu jediná stopa."
 murders_at_court.1002.desc: "Další den, další mrtvola. S těžkým srdcem si uvědomuji, že po nedávných vraždách se v [ROOT.Char.Custom('ResidenceBuilding')] začíná usazovat děsivý pocit rutiny.\n\nJe to [ROOT.Char.Custom('RandomWomanMan')] v mladém věku, s rozpáraným břichem. Tělo rychle odnesou a do západu slunce nezůstane po hrůzném činu jediná stopa."
 murders_at_court.1003.t: "Vraždy u dvora: Dokud nás smrt nerozdělí"
 murders_at_court.1003.desc_opening: "V našich komnatách nacházím [spouse.GetTitledFirstName]. Bezvládné tělo leží roztažené na podlaze v kaluži vlastní krve."
 murders_at_court.1003.desc_like: "S nářkem klesám na podlahu a tisknu bezvládné tělo k hrudi"
 murders_at_court.1003.desc: "Klesám na podlahu a tisknu bezvládné tělo k hrudi"
 murders_at_court.1003.desc_end: "— [Select_CString(spouse.IsFemale,'je tak studená','je tak studený')]... Ó [ROOT.Char.GetFaith.HighGodName], proč [Select_CString(spouse.IsFemale,'je tak studená','je tak studený')]?!"
 murders_at_court.1004.t: "Vraždy u dvora: Mé dítě"
 murders_at_court.1004.desc: "V posteli nacházím chladné a bezvládné tělo [child.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child'))]. Lůžkoviny jsou nasáklé krví a pomalé #EMP kap... kap...#! dopadající z postele na podlahu jako by se rozléhalo celou komnatou."
 murders_at_court.2001.t: "Vraždy u dvora: Stupňování"
 murders_at_court.2001.desc: "Na studené podlaze přede mnou leží [victim.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))]. Tělo pokrývají četné bodné rány, ze kterých stále vytéká krev.\n\nProč mě ten vrah takhle provokuje?!"
 murders_at_court.2002.t: "Vraždy u dvora: O krok napřed"
 murders_at_court.2002.desc: "Když se vrátím do svých komnat, na stole mě čeká useknutá hlava [heir.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))]. Ústa zůstala otevřená v němém výkřiku. [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('heir'))]... Můj [Select_CString(heir.IsFemale,'následnice','následník')]... Ó [ROOT.Char.GetFaith.HighGodName], proč? Tomuhle vražednému řádění musím učinit přítrž!"
 murders_at_court.2002.a: "Musím se modlit za [ROOT.Char.Custom('RealmType')]!"
 murders_at_court.2003.t: "Vraždy u dvora: [Select_CString(murderer.IsFemale,'Odhalená vražedkyně','Odhalený vrah')]"
 murders_at_court.2003.desc: "Ostrá bolest v zádech — zalapám po dechu a sílící muka mě přinutí vykřiknout. Pokouším se otočit, ale podlamují se mi nohy a pohledem sleduji #EMP kap#! #EMP kap#! vlastní krve až k podlaze.\n\nZrak se mi zatmívá, přesto nade mnou rozeznávám [murderer.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murderer'))] — s širokým úsměvem. Natáhnu ruku vzhůru a odměnou je kopanec, po kterém se celá místnost roztočí; dokola a dokola — světlo a tma, stále větší tma, větší a větší..."
 murders_at_court.2003.a: "[murderer.GetFirstNameNoTooltip]... Proč...?"
 murders_at_court.2101.t: "Vraždy u dvora: [Select_CString(other_heir.IsFemale,'Zavražděná nástupkyně','Zavražděný nástupce')]"
 murders_at_court.2101.desc_opening: "Hledím na bezvládné tělo [other_heir.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_heir'))] — a zmocňuje se mě závrať. Krev na podlaze pod tělem jako by snad byla moje vlastní, protože v hlavě mi nezůstala ani kapka.\n\n"
 murders_at_court.2101.desc_family: "Přikrčím se vedle bezvládného těla a vezmu studenou tvář do dlaně — oči jsou doširoka otevřené, ale spíš překvapením než hrůzou. „Udělal ti to někdo, koho jsi [Select_CString(other_heir.IsFemale,'znala','znal')]?“"
 murders_at_court.2101.desc: "Výraz v obličeji je spíš překvapený než vyděšený... Možná svého vraha [Select_CString(other_heir.IsFemale,'znala','znal')]?"
 murders_at_court.2201.t: "Vraždy u dvora: Co nelze spatřit"
 murders_at_court.2201.desc: "„Ale... oči jsou pryč! Vydloubnuté jako kameny z pole!“ Poslední vrahovu oběť našel někdo ze služebnictva ([ROOT.GetCharacter.Custom('lowly_servant_type')]). Vzápětí je tato osoba odvedena pryč — tvář bílá, ruce se třesou a křik stále neutichá.\n\nPři pohledu do rudých, slepých důlků, kde měly být oči, mnou projede mrazení. K čemu vrah potřebuje oči? K nějakému rituálu?"
 murders_at_court.5001.t: "Vraždy u dvora: Pomocník"
 murders_at_court.5001.desc: "Poté, co se doslechne o vraždách sužujících můj dvůr, mě vyhledá jakýsi zvídavý muž.\n\n„Jmenuji se [watson.GetTitledFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Myslím, že vám mohu být nápomocen.“"
 murders_at_court.5001.a: "Hodí se mi každá pomoc!"
 murders_at_court.5001.c: "Do toho vám nic není!"
 murders_at_court.8001.t: "Vraždy u dvora: Memento mori"
 murders_at_court.8001.desc: "Když [story_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] spočine v hrobě, přísahám, že najdu toho, kdo za tou smrtí stojí. Vrah jako by své řádění ukončil a já si musím klást otázku, zda [story_owner.GetTitleAsNameNoTooltip] [Select_CString(story_owner.IsFemale,'nebyla celou dobu skutečným cílem','nebyl celou dobu skutečným cílem')]..."
 murders_at_court.8001.a: "Odpočívej v pokoji, [story_owner.GetFirstNameNoTooltip]."
 murders_at_court.8002.desc: "Když ukládáme [story_owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] k poslednímu odpočinku, jen stěží zadržuju smích. Ten výraz, který [story_owner.GetSheHe] [Select_CString(story_owner.IsFemale,'měla','měl')] ve tváři na konci, byl k nezaplacení! [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('story_owner'))], [story_owner.GetWomanMan], říkají — pche.\n\nTeď, když má obávaný vrah na práci jiné věci, by se tu alespoň mohlo všechno uklidnit."
 murders_at_court.8002.a: "Třeba vládnout [ROOT.Char.Custom('RealmType')]!"
 murders_at_court.8003.t: "Vraždy u dvora: Dědictví"
 murders_at_court.8003.desc: "[predecessor.GetTitledFirstName] často [Select_CString(predecessor.IsFemale,'mluvila','mluvil')] o vraždách, které sužovaly její dvůr — o nelítostném a hrůzném zabíjení.\n\nVšechna opatření, která [predecessor.GetSheHe] [Select_CString(predecessor.IsFemale,'zavedla','zavedl')] ve snaze vraždám zabránit, zůstala v platnosti. Mohu jen doufat, že to bude stačit..."
 murders_at_court.8003.a: "Kéž kletba, která sužovala dvůr, zemřela spolu s [predecessor.GetHerHim]."
 murders_at_court.9001.t: "Vraždy u dvora: Konfrontace"
 murders_at_court.9001.desc_opening_watson: "Když se s [watson.GetTitledFirstName] uchýlíme do mých komnat, čeká tam na nás dopis napsaný rudým inkoustem — ne, #EMP krví#!.\n\n"
 murders_at_court.9001.desc_opening: "Když se vrátím do svých komnat, čeká tam na mě dopis napsaný rudým inkoustem — ne, #EMP krví#!.\n\n"
 murders_at_court.9001.desc_heir: "#EMP V zájmu [ROOT.Char.Custom('RealmType')] s tím pátráním přestaneš. Celý život ti žiju přímo pod nosem, a přesto jsi tak slepý. Odhalení mé totožnosti by ti přineslo jen bolest.#!"
 murders_at_court.9001.desc_rival: "#EMP Svůj život jsem zasvětil tomu, abych s tebou #EMP skoncoval#! — s tebou, tvou rodinou i tvou vládou. Nic z toho, co uděláš, mě nezastaví, ale pokud nepřestaneš strkat nos do mých záležitostí, donutíš mě spáchat ještě temnější činy.#!"
 murders_at_court.9001.desc_witch: "#EMP Myslíš, že tím svým vměšováním něčeho dosáhneš? Temné síly už byly uvedeny do pohybu a tím, že se mi stavíš do cesty, ohrožuješ jen sebe i ty, které miluješ.#!"
 murders_at_court.9001.desc_cannibal: "#EMP Ty tomu nerozumíš. Potřebuji to, abych mohl žít, přežít, abych našel #EMP obživu#!. Okamžitě ukonči pátrání, jinak můj hlad pohltí všechno!#!"
 murders_at_court.9001.desc_vassal: "#EMP V zájmu [ROOT.Char.Custom('RealmType')] s tím pátráním přestaneš. Jsem potřebný — #EMP ceněný#! — a pokud odhalíš mou totožnost, budeš toho jen litovat.#!"
 murders_at_court.9001.desc_fallback: "#EMP Okamžitě ukonči pátrání. Odhalením mé totožnosti nic dobrého nezískáš, a pokud budeš pokračovat, postarám se, aby tě nic dobrého ani nečekalo.#!"
 murders_at_court.9001.desc_ending: "\n\nTen rukopis... Skoro vypadá jako rukopis [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)]!"
 murders_at_court.9001.a: "Mohlo by to být...?"
 murders_at_court.9001.a.tt: "Kvůli tomu se postavím [murderer.GetTitledFirstNameNoTooltip]"
 murders_at_court.9001.b: "Zdá se, že tyhle vraždy zůstanou nevyřešené."
 murders_at_court.9001.b.tt: "Co nejhoršího by se mohlo stát?"
 murders_at_court.9001.c: "[watson.GetFirstNameNoTooltip], co si o tom myslíš?"
 murders_at_court.9001.c.tt: "Nemyslím, že je to tak jednoduché..."
 murders_at_court.9002.t: "Vraždy u dvora: Následky"
 murders_at_court.9002.desc: "Před [ROOT.Char.Custom('ResidenceBuilding')] nacházím oběšené tělo [the_one_to_kill.Custom2('MyCharacterIntroduction', ROOT.Char)]. Je chladné, bledé, nehybné... Ale co je to? V záhybech oblečení je zastrčený malý lístek!\n\n#EMP Toto je má poslední oběť — můj poslední dar pro tebe, [ROOT.Char.GetTitledFirstNameNoTooltip]. Ale neboj se, pořád budu nablízku a budu tě sledovat.#!"
 murders_at_court.9002.a: "A taková zrůda si dál běhá po svobodě..."
 murders_at_court.9003.t: "Vraždy u dvora: Temné dědictví"
 murders_at_court.9003.a: "Za své zločiny budeš [Select_CString(murderer.IsFemale,'potrestána','potrestán')]!"
 murders_at_court.9003.b: "Oko za oko, život za život...!"
 murders_at_court.9003.c: "Jdi, [murderer.GetTitledFirstNameNoTooltip]. Jsi [Select_CString(murderer.IsFemale,'volná','volný')]."
 murders_at_court.9003.d: "Páchat tohle všechno o samotě musí být nuda..."
 murders_at_court.9003.e: "Ach... já — je mi to tak líto."
 murders_at_court.9004.t: "Vraždy u dvora: Přistižen při činu"
 murders_at_court.9004.desc_letter_event: "S [watson.GetTitledFirstName] trávíme dlouhé hodiny zkoumáním dopisu. Ale ta vůně... Ach, voní úplně jako [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)] — [murderer.GetTitledFirstName]!"
 murders_at_court.9004.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip], [victim.GetTitledFirstName] i [murderer.GetTitledFirstName] beze stopy zmizeli.“\n\nStrážného mávnutím propustím a v očích [watson.GetTitledFirstName] vidím stejný neklid, jaký svírá i mě. [murderer.GetTitledFirstNameNoTooltip] by snad..."
 murders_at_court.9004.desc_ending: "\n\nKdyž konečně [murderer.GetTitleAsNameNoTooltip] vypátráme, [murderer.GetSheHe] se s nožem v ruce blíží k [victim.GetTitledFirstName].\n\n„Ani hnout!“"
 murders_at_court.9021.t: "Vraždy u dvora: Temná magie"
 murders_at_court.9021.desc: "Když se strážemi konečně vypátráme [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] klečí holými koleny před starou knihou, čelo přitisknuté k podlaze a ruce zdvižené nad hlavou v téměř nepřirozeném úhlu.\n\n"
 murders_at_court.9031.t: "Vraždy u dvora: Hlad"
 murders_at_court.9031.desc: "Když se strážemi konečně vypátráme [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] právě okusuje něco, co vypadá jako lidský #EMP prst#!."
 murders_at_court.9041.t: "Vraždy u dvora: Útěk"
 murders_at_court.9041.desc_opening: "Když konečně vypátrám [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], jediným, co na mě čeká, jsou"
 murders_at_court.9041.desc_witch: "úlomky kostí, cosi podezřele připomínající lidské oči a"
 murders_at_court.9041.desc_cannibal: "úlomky kostí, které vypadají jako okousané, a"
 murders_at_court.9041.desc: "dopis vysmívající se mému snažení. Po [murderer.GetTitledFirstNameNoTooltip] není ani stopy."
 murders_at_court.9041.a: "O těchto zločinech se dozvědí všichni!"
 murders_at_court.9041.b: "Bude lepší o tom pomlčet..."
 murders_at_court.9099.t: "Vraždy u dvora: Krvavé záležitosti"
 murders_at_court.9099.t_wrong: "Vraždy u dvora: Omyl"
 murders_at_court.9099.desc_wrong: "Když konečně vypátrám [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] se ani nepokusí utéct. Naopak na mě hledí s naprostým zmatením.\n\n„Konečně tě mám, vrahu!“\n\n„Prosím? Ty si myslíš, že všechny ty lidi jsem [Select_CString(murderer.IsFemale,'zavraždila','zavraždil')] #EMP já#!?“"
 murders_at_court.9099.desc_nothing: "Když se strážemi konečně vypátráme [murderer.Custom2('MyCharacterIntroduction', ROOT.Char)], [murderer.GetSheHe] se před námi ani nepokusí utéct.\n\n"
 murders_at_court.9099.desc: "„Zdravím, [ROOT.Char.GetFirstNameNoTooltip],“ pronese [murderer.GetSheHe] a přejede mě pohledem od hlavy k patě. „Už bylo načase, abys mě našel. Předpokládám, že sis mé... #EMP dárky#! užil?“\n\nÚsměv, který se [murderer.GetHerHis] rozlije po tváři, mi pošle mráz po zádech."
 murders_at_court.9989.desc: "Nemohu si však nevšimnout, že vraždy ustaly přesně ve chvíli, kdy [murderer.GetTitledFirstName] [Select_CString(murderer.IsFemale,'opustila','opustil')] dvůr..."
 murders_at_court.9989.a: "Budu si na tu osobu dávat pozor."
 murders_at_court.9999.t: "Vraždy u dvora: Kletba pominula"
 murders_at_court.9999.desc_opening: "Čas plyne, žádná další těla se neobjevují a já se pomalu začínám znovu uklidňovat. Vrah přestal!\n\n"
 murders_at_court.9999.desc: "Nemohu si však nevšimnout, že vraždy ustaly přesně ve chvíli, kdy [murderer.GetTitledFirstName] [Select_CString(murderer.IsFemale,'zemřela','zemřel')]..."
 murders_at_court.9999.a: "Teď, když je [murderer.GetSheHe] pryč, už možná nikdy nezjistím pravdu..."
