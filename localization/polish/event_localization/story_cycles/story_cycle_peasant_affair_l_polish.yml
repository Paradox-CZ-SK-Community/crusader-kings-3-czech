l_polish:
 peasant_affair.1001.t: "Nečekané shledání"
 peasant_affair.1001.desc_opening: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], mé srdce by nenašlo klid, dokud bych tě znovu [Select_CString(peasant_character.IsFemale,'nenašla','nenašel')]! To jsem já, [peasant_character.GetFirstNameNoTooltip]. Snad si na mě vzpomínáš, [ROOT.Char.Custom('LoverPetName')]?“\n\n"
 peasant_affair.1001.desc_child: "Nemohu uvěřit vlastním očím. [Select_CString(peasant_character.IsFemale,'Ta krásná žena, s níž','Ten krásný muž, s nímž')] jsem si před mnoha měsíci [Select_CString(ROOT.Char.IsFemale,'užívala','užíval')], [Select_CString(peasant_character.IsFemale,'matka','otec')] mého drahého dítěte [peasant_child.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))]), se [Select_CString(peasant_character.IsFemale,'objevila','objevil')] u [ROOT.Char.Custom('GetCourtType')|l]."
 peasant_affair.1001.desc_their_child: "Nemohu uvěřit vlastním očím. [Select_CString(peasant_character.IsFemale,'Ta krásná žena, s níž','Ten krásný muž, s nímž')] jsem si před mnoha měsíci [Select_CString(ROOT.Char.IsFemale,'užívala','užíval')], se [Select_CString(peasant_character.IsFemale,'objevila','objevil')] u [ROOT.Char.Custom('GetCourtType')|l]. Vedle stojí [peasant_child.GetTitledFirstName], podle všeho [Select_CString(peasant_child.IsFemale,'dcera','syn')] [peasant_character.GetFirstNameNoTooltip], a při pohledu na věk toho dítěte mě napadne..."
 peasant_affair.1001.desc_rakish_night: "Nemohu uvěřit vlastním očím. [Select_CString(peasant_character.IsFemale,'Ta krásná žena, s níž','Ten krásný muž, s nímž')] jsem si před mnoha měsíci [Select_CString(ROOT.Char.IsFemale,'užívala','užíval')] během jedné noci plné nevázanosti, se [Select_CString(peasant_character.IsFemale,'objevila','objevil')] u [ROOT.Char.Custom('GetCourtType')|l]."
 peasant_affair.1001.desc: "Nemohu uvěřit vlastním očím. [Select_CString(peasant_character.IsFemale,'Ta krásná žena, na kterou','Ten krásný muž, na kterého')] jsem před mnoha měsíci [Select_CString(ROOT.Char.IsFemale,'narazila','narazil')] před [ROOT.Char.Custom('FortifiedBuilding')], se [Select_CString(peasant_character.IsFemale,'objevila','objevil')] u [ROOT.Char.Custom('GetCourtType')|l]."
 peasant_affair.1001.a_1: "Trvám na tom, abys tu [Select_CString(peasant_character.IsFemale,'zůstala','zůstal')] jako součást [ROOT.Char.Custom('GetCourtType')|l]!"
 peasant_affair.1001.a_2: "[peasant_character.GetFirstNameNoTooltip], že ano? Klidně tu zůstaň."
 peasant_affair.1001.b: "[peasant_child.GetFirstNameNoTooltip] si přece zaslouží mít [Select_CString(peasant_character.IsFemale,'matku','otce')] nablízku..."
 peasant_affair.1001.c: "Tady domov nenajdeš."
 peasant_affair.2001.t: "[Select_CString(peasant_character.IsFemale,'Žena, o které sním','Muž, o kterém sním')]"
 peasant_affair.2001.desc_opening: "Znovu se probouzím s bušícím srdcem a doznívajícím žárem, který mi stále doutná v slabinách.\n\n"
 peasant_affair.2001.desc_rakish_night: "Od noci, kdy jsem [Select_CString(ROOT.Char.IsFemale,'sdílela','sdílel')] lože s [Select_CString(peasant_character.IsFemale,'krásnou ženou, na kterou','krásným mužem, na kterého')] jsem [Select_CString(ROOT.Char.IsFemale,'narazila','narazil')] při jednom ze svých nočních dobrodružství, uplynulo už mnoho času, ale má touha jen sílí..."
 peasant_affair.2001.desc_known_father: "Od noci, kdy jsem [Select_CString(ROOT.Char.IsFemale,'sdílela','sdílel')] lože s [peasant_character.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))], uplynulo už mnoho času, ale má touha jen sílí..."
 peasant_affair.2001.desc_unknown_peasant: "Od noci, kdy jsem [Select_CString(ROOT.Char.IsFemale,'sdílela','sdílel')] lože s [Select_CString(peasant_character.IsFemale,'krásnou ženou, na kterou','krásným mužem, na kterého')] jsem [Select_CString(ROOT.Char.IsFemale,'narazila','narazil')] před [ROOT.Char.Custom('FortifiedBuilding')], uplynulo už mnoho času, ale má touha jen sílí..."
 peasant_affair.2001.desc_child: "Tím spíš, že naše milované dítě [peasant_child.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))]), plod naší vášně, mi [peasant_character.GetFirstNameNoTooltip] neustále připomíná!"
 peasant_affair.2001.a: "Musím [peasant_character.GetFirstNameNoTooltip] najít!"
 peasant_affair.2001.a.tt: "#F Okamžitě zahájit pátrání!#!"
 peasant_affair.2001.b: "Bude nejlepší, když na [peasant_character.GetFirstNameNoTooltip] zapomenu."
 peasant_affair.2001.c: "Nezakolísám. Je to zkouška mého odhodlání!"
 peasant_affair.2002.desc_opening: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], po tom člověku, kterého máme hledat, není ani stopy. S omezenými prostředky, které mám k dispozici, už toho víc udělat nedokážu...“\n\n"
 peasant_affair.2002.desc_child: "Zatímco se přede mnou [searching_character.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('searching_character'))]) poníženě uklání, můj pohled padne na zvědavou tvář [peasant_child.GetTitledFirstName], mého dítěte ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_child'))])."
 peasant_affair.2002.desc: "Zatímco se přede mnou [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('searching_character'))] [searching_character.GetTitledFirstName] poníženě uklání, mé myšlenky se zatoulají zpět k oné kouzelné noci..."
 peasant_affair.2002.a: "Musím [peasant_character.GetFirstNameNoTooltip] získat, ať to stojí cokoli!"
 peasant_affair.2002.b: "Žádný sedlák přece nemůže stát za tolik námahy."
 peasant_affair.2003.desc_opening: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], na vaše naléhání před vás přivádím [peasant_character.GetTitledFirstName].“\n\n"
 peasant_affair.2003.desc_dead_brought_child: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], přináším zprávy. [Select_CString(peasant_character.IsFemale,'Žena, kterou','Muž, kterého')] jste nám [Select_CString(ROOT.Char.IsFemale,'poručila hledat','poručil hledat')], bohužel již [Select_CString(peasant_character.IsFemale,'opustila','opustil')] tento svět, ale přivedli jsme s sebou [peasant_child.GetTitledFirstName], dítě této osoby.“\n\nJak krutý žert osudu — konečně [peasant_character.GetFirstNameNoTooltip] najít, jen abych [peasant_character.GetFirstNameNoTooltip] navždy [Select_CString(ROOT.Char.IsFemale,'ztratila','ztratil')]! Ale to dítě... Mohlo by být moje...?"
 peasant_affair.2003.desc_dead: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], přináším zprávy. [Select_CString(peasant_character.IsFemale,'Žena, kterou','Muž, kterého')] jste nám [Select_CString(ROOT.Char.IsFemale,'poručila hledat','poručil hledat')], bohužel již [Select_CString(peasant_character.IsFemale,'opustila','opustil')] tento svět.“\n\nJak krutý žert osudu — konečně [peasant_character.GetFirstNameNoTooltip] najít, jen abych [peasant_character.GetFirstNameNoTooltip] navždy [Select_CString(ROOT.Char.IsFemale,'ztratila','ztratil')]!"
 peasant_affair.2003.desc_dislike: "[Select_CString(peasant_character.IsFemale,'Vysněná venkovanka se vzpírá','Vysněný venkovan se vzpírá')] sevření [searching_character.GetTitledFirstName], ve tváři směs hněvu a strachu.\n\n„Prosím, [ROOT.Char.GetLadyLord], nechte mě jít! Ta noc byla chyba. Chci jen, abyste mě nechali na pokoji.“"
 peasant_affair.2003.desc_dislike_their_child: "[Select_CString(peasant_character.IsFemale,'Vysněná venkovanka se vzpírá','Vysněný venkovan se vzpírá')] sevření [searching_character.GetTitledFirstName], ve tváři směs hněvu a strachu, a přitom k sobě pevně tiskne [Select_CString(peasant_child.IsFemale,'svou dceru','svého syna')].\n\n„Prosím, [ROOT.Char.Custom('FormOfAddressForLiege')], nechte nás jít! Chci jen [Select_CString(peasant_character.IsFemale,'sama','sám')] vychovat #EMP své#! dítě.“"
 peasant_affair.2003.desc_their_child: "Konečně! Když přede mnou [peasant_character.GetFirstNameNoTooltip] stojí, mám pocit, jako by náš společný čas nikdy neskončil. Vedle však stojí dítě, podle všeho [Select_CString(peasant_child.IsFemale,'dcera','syn')] [peasant_character.GetFirstNameNoTooltip], a při pohledu na [Select_CString(peasant_child.IsFemale,'její','jeho')] věk mě něco napadne..."
 peasant_affair.2003.desc: "Konečně! Když přede mnou [peasant_character.GetFirstNameNoTooltip] stojí, mám pocit, jako by náš společný čas nikdy neskončil. Podle vřelého úsměvu na tváři na mě [peasant_character.GetFirstNameNoTooltip] také [Select_CString(peasant_character.IsFemale,'nezapomněla','nezapomněl')]."
 peasant_affair.2003.a_alive: "Prosím, [peasant_character.GetFirstNameNoTooltip], zůstaň tady u [ROOT.Char.Custom('GetCourtType')|l]."
 peasant_affair.2003.a_dead: "Prosím, [peasant_child.GetFirstNameNoTooltip], zůstaň tady u [ROOT.Char.Custom('GetCourtType')|l]."
 peasant_affair.2003.b: "[peasant_child.GetFirstNameNoTooltip], mé dítě, chci ti představit [Select_CString(peasant_character.IsFemale,'tvou matku','tvého otce')]."
 peasant_affair.2003.c: "Teď, když jsi konečně tady... zadržte [Select_CString(peasant_character.IsFemale,'tu ženu','toho muže')]!"
 peasant_affair.2003.c.tt: "#F [Select_CString(peasant_character.IsFemale,'Žena, která','Muž, který')] má proti mně takovou páku, nesmí zůstat na svobodě!#!"
 peasant_affair.2003.d: "Odveďte to dítě pryč!"
 peasant_affair.2003.d.tt: "#F Na celou tuhle pohromu prostě zapomeneme.#!"
 peasant_affair.2003.e: "Jak krutý osud!"
 peasant_affair.2003.f: "To je moje dítě, že ano?! Odveďte [Select_CString(peasant_child.IsFemale,'ji','ho')]!"
 peasant_affair.2003.g: "Okamžitě [peasant_character.GetFirstNameNoTooltip] pusťte! Může svobodně odejít."
 peasant_affair.2004.desc_opening: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], po tom člověku, kterého jste nám poručili hledat, není ani stopy. Se vší pravděpodobností už [Select_CString(peasant_character.IsFemale,'zemřela','zemřel')]...“\n\n"
 peasant_affair.2004.a: "Už nikdy [peasant_character.GetFirstNameNoTooltip] nespatřit... Jaké utrpení!"
 peasant_affair.3001.t: "Taková malá prosba"
 peasant_affair.3001.available_desc: "[peasant_character.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))], za mnou přichází s prosbou, kterou zjevně považuje za skromnou.\n\n„Miláčku, dobře víš, že [peasant_child.GetTitledFirstName] je tvé dítě. Prosím, uznej [Select_CString(peasant_child.IsFemale,'ji','ho')] za součást svého rodu.“"
 peasant_affair.3001.unavailable_desc: "\n\nCopak [peasant_character.GetFirstNameNoTooltip] nechápe, že kvůli [other_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_spouse'))], to není tak docela v mých rukou?"
 peasant_affair.3001.a: "Uznám, že [peasant_child.GetTitledFirstNameNoTooltip] nese mou krev i mé jméno."
 peasant_affair.3001.b: "Dítě možná nese mou krev, ale mé jméno mít nebude."
 peasant_affair.3001.c: "Ano, je to moje dítě."
 peasant_affair.3001.d: "Něco takového nikdy neudělám!"
 peasant_affair.3001.d.tt: "Dám [peasant_character.GetTitledFirstNameNoTooltip] jasně najevo, že k tomu nikdy nedojde."
 peasant_affair.3002.t: "Taková malá prosba"
 peasant_affair.3002.available_desc: "[peasant_character.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('peasant_character'))], za mnou přichází s prosbou, kterou zjevně považuje za skromnou.\n\n„Víš stejně dobře jako já, že [peasant_child.GetTitledFirstName] je moje dítě. Prosím tě, dovol mi přiznat to veřejně.“"
 peasant_affair.3002.unavailable_desc: "\n\nCopak [peasant_character.GetFirstNameNoTooltip] nechápe, že kvůli [other_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('other_spouse'))], to není tak jednoduché!"
 peasant_affair.3002.a: "Je jen správné, aby [peasant_child.GetFirstNameNoTooltip] [Select_CString(peasant_child.IsFemale,'znala','znal')] svůj původ."
 peasant_affair.3002.b: "Ne, to nikdy nedokážu."
 peasant_affair.3003.t: "Vzpomínka"
 peasant_affair.3003.desc: "„Určitě si na náš společný čas vzpomínáš stejně dobře jako já?“ [peasant_character.GetTitledFirstName] mě zastaví o samotě na chodbě a nakloní se blíž, aby mi [Select_CString(peasant_character.IsFemale,'pošeptala','pošeptal')] do ucha. „To, co mezi námi bylo... toho se nedokážu vzdát.“"
 peasant_affair.3003.a: "[ROOT.Char.GetFaith.HighGodName] mě chraň, jak bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] odmítnout?"
 peasant_affair.3003.b: "Je nebezpečné, aby nás vůbec někdo viděl spolu!"
 peasant_affair.3004.t: "Příležitost"
 peasant_affair.3004.desc: "[peasant_character.GetTitledFirstName] se při [peasant_character.Custom('quirk_pos_present')] zamyšleně tváří. „Potřebuješ [Select_CString(peasant_character.IsFemale,'manželku','manžela')],“ pronese nakonec. „Vím, že nepocházím z urozeného rodu, ale pomysli na všechno, co nás spojuje...“"
 peasant_affair.3004.a: "Nemohl by to být nikdo jiný než ty."
 peasant_affair.3004.b: "Vzít se nemůžeme, ale to neznamená, že nemůžeme být spolu."
 peasant_affair.3004.c: "Nemůžeš být [Select_CString(peasant_character.IsFemale,'mou manželkou','mým manželem')], ale patříš ke mně."
 peasant_affair.3004.d: "Sňatek nepřipadá v úvahu."
