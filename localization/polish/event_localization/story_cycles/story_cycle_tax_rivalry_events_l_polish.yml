l_polish:
 tax_rivalry.t: "Krev a zlato"
 tax_rivalry.0011.t: "$tax_rivalry.t$: Usmíření"
 tax_rivalry.0011.desc_intro: "[forgiven_rival.GetTitledFirstName|U] mi už dlouho leží v žaludku jako stříbrný trn, ale možná to tak nemusí zůstat navždy."
 tax_rivalry.0011.desc_opinion: "Vlastně spolu ani nevycházíme tak zle, a pokud se trochu vynasnažíme a ukončíme tenhle spor, možná bychom se dokonce mohli stát cennými spojenci."
 tax_rivalry.0011.desc_compassion: "Rozhodně nejsem [Select_CString(ROOT.Char.IsFemale,'z těch, kdo se rádi dlouho hádají','z těch, kdo se rádi dlouho hádají')], ale mohu věřit, že [forgiven_rival.GetTitledFirstNameNoTooltip] bude stejně smířlivě [Select_CString(forgiven_rival.IsFemale,'naladěná','naladěný')] jako já?"
 tax_rivalry.0011.desc_unity: "Pro dobro klanu bych se s [forgiven_rival.GetTitledFirstNameNoTooltip] mohl alespoň navenek usmířit. Ale bude to [forgiven_rival.GetTitledFirstNameNoTooltip] cítit stejně?"
 tax_rivalry.0011.desc_fallback: "Mohu [forgiven_rival.GetTitledFirstNameNoTooltip] nabídnout usmíření, ale kdo ví, zda podanou ruku přijme?"
 tax_rivalry.0011.a: "Uvidíme, co na můj návrh řekne [forgiven_rival.GetTitledFirstNameNoTooltip]."
 tax_rivalry.0011.a.tt_ai: "Požádám [forgiven_rival.GetTitledFirstNameNoTooltip], abychom svou nevraživost hodili za hlavu."
 tax_rivalry.0011.a.tt_player: "[forgiven_rival.GetTitledFirstNameNoTooltip|U] nakonec rozhodne, jak odpoví."
 tax_rivalry.0011.a.failure: "[forgiven_rival.GetTitledFirstNameNoTooltip] mou nabídku zavrhne"
 tax_rivalry.0011.b: "[forgiven_rival.GetTitledFirstNameNoTooltip|U] ještě okusí mou pomstu!"
 tax_rivalry.0011.b.tt: "Náš vleklý spor znovu propukne."
 tax_rivalry.0012.desc_intro_unfriendly: "Jindy bych každou zmínku o [forgiving_rival.GetTitledFirstName] [Select_CString(ROOT.Char.IsFemale,'odmítla','odmítl')] s opovržením, ale tentokrát mě cosi přimělo přijmout nečekanou návštěvu na mém nádvoří."
 tax_rivalry.0012.desc_intro_friendly: "Ačkoli jsme si s [forgiving_rival.GetTitledFirstName] od začátku našich sporů nebyli nijak blízcí, nečekanou návštěvu na mém nádvoří jsem přesto [Select_CString(ROOT.Char.IsFemale,'uvítala','uvítal')]."
 tax_rivalry.0012.desc_outro: "Za nezvykle příjemného počasí jsme tam společně hodovali, dokud si [forgiving_rival.GetTitledFirstNameNoTooltip] neodkašlal[Select_CString(forgiving_rival.IsFemale,'a','')]:\n\n„Kdybychom nebyli zapleteni do tohoto sporu, mohli bychom si užít ještě mnoho podobných odpolední. Odpustíte mi tedy mé dřívější pošetilosti, [ROOT.Char.GetTitledFirstNameNoTooltip]?“"
 tax_rivalry.0012.a: "Pokud mi odpustíš ty moje."
 tax_rivalry.0012.b: "Služebnictvo, vyprovoďte [forgiving_rival.GetTitledFirstNameNoTooltip]."
 tax_rivalry.0013.desc_intro: "[forgiven_rival.GetTitledFirstName|U] souhlasí s mým návrhem a ode dneška jsou naše peněžní spory minulostí."
 tax_rivalry.0013.desc_outro_neutral: "Nezbývá než doufat, že naše někdejší hořkost už nebude kalit naše budoucí vztahy..."
 tax_rivalry.0013.desc_outro_vengeful: "Koneckonců se jistě najde ještě spousta jiných příležitostí, jak [forgiven_rival.GetTitledFirstNameNoTooltip] umlčet, aniž by tušil[Select_CString(forgiven_rival.IsFemale,'a','')], co chystám..."
 tax_rivalry.0013.a: "Nezbývá než doufat."
 tax_rivalry.0014.desc: "Zdá se, že pro dobro panství odložili [forgiven_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] a [forgiving_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] svůj malicherný spor stranou. Teprve čas však ukáže, zda ze žhavých uhlíků znovu nevzplane oheň."
 tax_rivalry.0014.a: "Uvidíme."
 tax_rivalry.1000.t: "$tax_rivalry.t$: Slepé místo"
 tax_rivalry.1000.desc: "Spory mezi [steward.GetTitledFirstName] a [tax_collector.GetTitledFirstName] začínají poškozovat finance panství. Ani jeden nechce s tím druhým komunikovat, takže se platby často přepisují, zakládají na špatná místa, nebo se dokonce ztrácejí.\n\nKdyž nad tím rozmrzele dumám, všimnu si jejich vlastních příspěvků do pokladny panství. Jak snadné by bylo tuhle sumu „ztratit“ a nechat je, ať ze zmizení viní jeden druhého..."
 tax_rivalry.1000.b: "Za tuhle nedbalost jim pořádně vyčiním."
 tax_rivalry.1000.b.tt: "Nařídím [steward.GetTitledFirstNameNoTooltip] a [tax_collector.GetTitledFirstNameNoTooltip], aby ukončili své soupeření."
 tax_rivalry.1001.desc: "Daně náležející [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] zmizely přesně ve chvíli, kdy [other_rival.Custom2('MyCharacterIntroduction', ROOT.Char)] zaplatil[Select_CString(other_rival.IsFemale,'a','')] ty své!\n\nNemám žádný důkaz, který by svědčil o opaku, takže nezbývá než předpokládat, že jde o úklad [other_rival.GetTitledFirstNameNoTooltip], jehož cílem je pošpinit mé dobré jméno i mou pokladnu."
 tax_rivalry.1001.a: "Ten [other_rival.Custom2('InsultNoun', ROOT.Char)]!"
 tax_rivalry.1002.desc: "„Vy dva začínáte být nedbalí,“ [liege.Custom2('MyCharacterIntroduction', ROOT.Char)] posune po stole směrem k nám měšec zlata. „Bylo by až příliš snadné zmocnit se vašich příspěvků a nechat jednoho z vás obvinit druhého z jejich zmizení, když spolu tak málo komunikujete. Postarejte se, aby tyhle malicherné spory skončily.“\n\n[liege.GetTitledFirstNameNoTooltip|U] popadne měšec, schová ho a probodne nás pohledem."
 tax_rivalry.1002.a: "Už se to nestane."
 tax_rivalry.3001.t: "$tax_rivalry.t$: Lůza"
 tax_rivalry.3001.desc_intro: "Když dumám nad svými křivdami vůči [sabotaged_rival.GetTitledFirstNameNoTooltip], napadne mě podlý plán. Stačí jen pár úplatků a mohu přesvědčit sedláky z [sabotaged_county.GetNameNoTierNoTooltip], že [sabotaged_rival.GetTitledFirstNameNoTooltip] hodlá zpětinásobit jejich daně, a podnítit je ke vzpouře, jejímž cílem bude [liege.GetTitledFirstName], náš lenní pán."
 tax_rivalry.3001.desc_outro_assigned: "Vina samozřejmě padne na toho [sabotaged_rival.Custom2('InsultNoun', ROOT.Char)], který hrabství tak bídně spravuje."
 tax_rivalry.3001.desc_outro_fallback: "Na tom, že [sabotaged_rival.GetTitledFirstNameNoTooltip] hrabství ve skutečnosti vůbec nespravuje, nezáleží. Škoda už bude napáchána."
 tax_rivalry.3001.a: "Pošlete pro hlasatele."
 tax_rivalry.3001.a.tt: "V [sabotaged_county.GetNameNoTierNoTooltip] povstane proti tvému lennímu pánovi [Concept('peasant_faction','selská frakce')|E]"
 tax_rivalry.3001.b: "Důležitější je uhájit vlastní postavení."
 tax_rivalry.3002.desc: "Ten proradný [saboteur.Custom2('InsultNoun', ROOT.Char)]! [saboteur.Custom2('MyCharacterIntroduction', ROOT.Char)|U] rozšířil nepravdivou zvěst, že v [sabotaged_county.GetName] zvyšuji daně. Teď proti mému lennímu pánovi povstal rozzuřený dav a žádná slova už jeho hněv neutiší."
 tax_rivalry.3002.a: "Za všechno může [saboteur.GetTitledFirstNameNoTooltip]!"
 tax_rivalry.3003.desc: "To je ale fraška... V [sabotaged_county.GetName] se teď proti mně zvedla lůza, a to všechno jen proto, že uvěřila, že [sabotaged_rival.GetTitledFirstName] zvýší daně!\n\n[sabotaged_rival.GetTitledFirstNameNoTooltip|U] tvrdí, že za tím stojí [saboteur.GetTitledFirstName], ale jedno je jisté: spor mezi nimi se rychle vymyká kontrole."
 tax_rivalry.3003.a: "Do zbraně!"
 tax_rivalry.3003.a.tt: "V [sabotaged_county.GetNameNoTierNoTooltip] proti tobě povstane [Concept('peasant_faction','selská frakce')|E]"
 tax_rivalry.4000.t: "$tax_rivalry.t$: Rozvrácený klan"
 tax_rivalry_liege_notification_desc: "Stalo se to kvůli sporu mezi [steward.GetShortUIName] a [tax_collector.GetShortUIName]."
 tax_rivalry_steward_notification_desc: "Stalo se to kvůli tvému sporu s [tax_collector.GetShortUIName]."
 tax_rivalry_tax_collector_notification_desc: "Stalo se to kvůli tvému sporu s [steward.GetShortUIName]."
 tax_rivalry.4010.t: "$tax_rivalry.t$: Zavilý svár"
 tax_rivalry.4010.desc_liege_friendly: "Stalo se to navzdory dobrým vztahům mezi nimi."
 tax_rivalry.4010.desc_liege_unfriendly: "Stalo se to kvůli špatným vztahům mezi nimi."
 tax_rivalry.4010.desc_steward_friendly: "Stalo se to navzdory mým dobrým vztahům s [tax_collector.GetTitledFirstNameNoTooltip]."
 tax_rivalry.4010.desc_steward_unfriendly: "Stalo se to kvůli mým špatným vztahům s [tax_collector.GetTitledFirstNameNoTooltip]."
 tax_rivalry.4010.desc_tax_collector_friendly: "Stalo se to navzdory mým dobrým vztahům s [steward.GetTitledFirstNameNoTooltip]."
 tax_rivalry.4010.desc_tax_collector_unfriendly: "Stalo se to kvůli mým špatným vztahům s [steward.GetTitledFirstNameNoTooltip]."
 tax_rivalry.4011.t: "$tax_rivalry.t$: Oteplení vztahů"
 tax_rivalry.4011.desc_liege_friendly: "Stalo se to díky dobrým vztahům mezi nimi."
 tax_rivalry.4011.desc_liege_unfriendly: "Stalo se to navzdory špatným vztahům mezi nimi."
 tax_rivalry.4011.desc_steward_friendly: "Stalo se to díky mým dobrým vztahům s [tax_collector.GetTitledFirstNameNoTooltip]."
 tax_rivalry.4011.desc_steward_unfriendly: "Stalo se to navzdory mým špatným vztahům s [tax_collector.GetTitledFirstNameNoTooltip]."
 tax_rivalry.4011.desc_tax_collector_friendly: "Stalo se to díky mým dobrým vztahům s [steward.GetTitledFirstNameNoTooltip]."
 tax_rivalry.4011.desc_tax_collector_unfriendly: "Stalo se to navzdory mým špatným vztahům s [steward.GetTitledFirstNameNoTooltip]."
 tax_rivalry.9000.t: "$tax_rivalry.t$: Vítězství"
 tax_rivalry.9000.desc: "Už nemusím snášet [less_fortunate_rival.Custom('quirk_neg_noun')] [less_fortunate_rival.GetTitledFirstName]. Teď jsem [ROOT.Char.Custom('MistressMaster')] svého vlastního panství a jestli se [less_fortunate_rival.GetTitledFirstNameNoTooltip] ještě někdy opováží narušovat mou vládu, tentokrát na něj čeká mnohem tvrdší hůl."
 tax_rivalry.9000.a: "Je dobré být [ROOT.Char.GetTitleAsNameNoTooltip]."
 tax_rivalry.9000.a.tt: "Tvůj spor s [less_fortunate_rival.GetTitledFirstNameNoTooltip] prozatím končí."
 tax_rivalry.9001.t: "$tax_rivalry.t$: Porážka"
 tax_rivalry.9001.desc: "Jak jsem mohl tušit, že se [fortunate_rival.GetFullName] stane [fortunate_rival.GetTitleAsNameNoTooltip] v [fortunate_rival.GetPrimaryTitle.GetNameNoTierNoTooltip]? Kdybych jen jednal dřív, můj osud teď nemusel být zpečetěn!"
 tax_rivalry.9001.a_spurned: "Tohle ještě neskončilo!"
 tax_rivalry.9001.a_neutral: "Začíná nová kapitola..."
 tax_rivalry.9001.a.tt: "Tvůj spor s [fortunate_rival.GetTitledFirstNameNoTooltip] prozatím končí."
