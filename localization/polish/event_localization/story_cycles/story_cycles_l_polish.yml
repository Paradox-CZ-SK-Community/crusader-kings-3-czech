l_polish:
 SITUATION_LIST_STORY_CYCLE_MODIFIERS_HEADER: "Modifikátory"
 SITUATION_LIST_STORY_CYCLE_DECISIONS_HEADER: "Rozhodnutí"
 not_yet_chosen: "zatím nevybráno"
 story_cycle_pet_dog: "Psí mazlíček"
 story_cycle_pet_dog_desc: "#F Po tvém boku kráčí věrný psí společník, který ti poskytuje ochranu a oddanost, jaké se vyrovná jen málokterý člověk.#!"
 DOG_INFORMATION_STRING: "Tvůj pes se jmenuje #V [Story.Custom('DogStoryNameAll')].#!\n[Story.Custom('DogStoryHerHisAll')|U] srst je [Story.Custom('DogFurColorAll')], [Story.Custom('DogStoryHerHisAll')] oči jsou [Story.Custom('DogEyeColorAll')] a [Story.Custom('DogStorySheHeAll')] je [Story.Custom('DogStoryPuppyOrAgeAll')].\n[Story.Custom('DogStorySheHeAll')|U] je zkrátka [Story.Custom('DogStoryGirlBoyAll')] k pohledání."
 dog_age_puppy: "štěně"
 dog_age_proper: "ve věku [Story.MakeScope.Var('dog_age_variable').GetValue|0] let"
 cat_age_kitten: "kotě"
 cat_age_proper: "ve věku [Story.MakeScope.Var('cat_age_variable').GetValue|0] let"
 story_cycle_pet_cat: "Kočičí mazlíček"
 story_cycle_pet_cat_desc: "#F Společnost ti dělá hrdá kočka, hbitý lovec, který rozdává náklonnost jen tehdy, když sám chce.#!"
 CAT_INFORMATION_STRING: "Tvá kočka se jmenuje #V [Story.Custom('CatStoryNameAll')].#!\n[Story.Custom('CatStoryHerHisAll')|U] srst je [Story.Custom('CatFurColorAll')], [Story.Custom('CatStoryHerHisAll')] oči jsou [Story.Custom('CatEyeColorAll')] a [Story.Custom('CatStorySheHeAll')] je [Story.Custom('CatStoryKittenOrAgeAll')].[Story.Custom('CatStupidOrNotStupidAll')]"
 dumb_but_sweet_orange_boy: "\n[Story.Custom('CatStorySheHeAll')|U] sice nevyniká chytrostí, ale roztomilosti má na rozdávání. Barva srsti: [Story.Custom('CatFurColorAll')]. Je to [Story.Custom('CatStoryGirlBoyAll')]."
 story_cycle_pet_eagle: "Lovecký orel"
 story_cycle_pet_eagle_desc: "#F Na tvé rukavici sedí lovecký orel, vždy ostražitý, vždy hladový a připravený přinést smrt z výšin.#!"
 EAGLE_INFORMATION_STRING: "Tvůj orel se jmenuje #V [Story.Custom('EagleStoryNameAll')].#!\n[Story.Custom('EagleStorySheHeAll')|U] už má [Story.MakeScope.Var('eagle_age_variable').GetValue|0] let."
 bp2_hostage_loyalty: "Loajální rukojmí"
 bp2_hostage_loyalty_desc: "Jedno z tvých [Concept('hostages','rukojmí')|E] si začíná zvykat na tebe i na tvé způsoby."
 hostage: "[Concept('hostage','Rukojmí')|E]"
 HOSTAGE_STORY_PRACTICAL_INFORMATION_STRING: "Na tvém [Concept('court','dvoře')|E] vyrůstá [Concept('hostage','rukojmí')|E] [Story.MakeScope.Var('hostage_target').Char.GetUIName]. Pobyt této postavy u tebe ovlivňuje budoucí věrnost. Udržuj [Concept('opinion','mínění')|E] této postavy na vysoké úrovni a při událostech vybírej správné možnosti, aby byla větší šance, že ti po dosažení dospělosti zůstane věrná.\n\nSoučasná loajalita: [Story.MakeScope.Var('theon_points').GetValue|0+]"
 LOYALTY_LABEL: "Body loajality"
 claimant: "[Concept('claimant','Pretendent')|E]"
 diverted_crusaders: "Odklonění křižáci"
 frankokratia_story: "Frankokratia"
 frankokratia_story_desc: "[GetTitleByKey('e_byzantium').GetName|l] má svého [Concept('claimant','pretendenta')|E], který odlákal západní prospěcháře od jejich křížové výpravy a obrátil jejich chamtivé meče proti samotnému srdci křesťanstva..."
 FRANKOKRATIA_STORY_PRACTICAL_INFORMATION_STRING: "[GetTitleByKey('e_byzantium').GetName|l] stojí před [Concept('war','válkou')|E] proti [GetTitleByKey('e_byzantium').GetHolder.GetShortUIName], která rozhodne o jeho budoucnosti. Buď se trůnu zmocní [Concept('claimant','pretendent')|E] [Story.MakeScope.Var('byz_claimant').Char.GetUIName] a odmění křižáky za jejich úsilí, nebo vznikne nový [GetTitleByKey('e_latin_empire').GetBaseName] pod vládou stoupenců [GetFaithByKey('catholic').GetName]."
 story_conqueror: "Dobyvatel"
 story_conqueror_desc: "Tvá ctižádost nezná mezí! Svět leží před tebou, zralý k dobytí."
 CONQUEROR_STORY_PRACTICAL_INFORMATION_STRING: "Dobyvatelé získávají mnoho mocných výhod, například oslabení [Concept('factions','frakcí')|E], přístup k [Concept('vassalize_casus_belli','casu belli nucené vazalizace')|E] a příležitostné mocné události.\n\nDobyvatelem přestaneš být, pokud:\n$BULLET_WITH_TAB$Nemáš [Concept('independent','nezávislé postavení')|E]\n$BULLET_WITH_TAB$Tvá hodnost klesne na úroveň [Concept('count','hraběte')|E]\n$BULLET_WITH_TAB$Staneš se [Concept('unlanded','bez země')|E]\n$BULLET_WITH_TAB$Po dobu #V 10#! let nejsi v [Concept('war','žádné válce')|E]\n$BULLET_WITH_TAB$Tvůj [Concept('debt','dluh')|E] výrazně naroste\n$BULLET_WITH_TAB$Prohraješ #V 3#! nebo více [Concept('wars','válek')|E]\n$BULLET_WITH_TAB$Získáš rys [GetTrait('incapable').GetName( GetNullCharacter )]"
 story_destiny_child: "Dítě osudu"
 story_destiny_child_desc: "Narodilo se dítě, které čeká velká budoucnost, jako by si je vybral samotný osud."
 DESTINY_CHILD_STORY_PRACTICAL_INFORMATION_STRING: "Jen velmi zřídka se narodí dítě předurčené k velikosti. Vyvíjí se rychleji než ostatní a může dosáhnout výšin, které jim zůstanou odepřeny.\n\nVěnuj [Story.MakeScope.Var('destiny_child').Char.GetUIName] náležitou péči a zvaž, zda z této postavy neudělat svého [Concept('player_heir',Select_CString(Story.MakeScope.Var('destiny_child').Char.IsFemale,'hráčskou dědičku','hráčského dědice'))|E] - například tím, že ji určíš jako [Concept('designated_heir',Select_CString(Story.MakeScope.Var('destiny_child').Char.IsFemale,'určenou dědičku','určeného dědice'))|E]."
 CHILD_OF_DESTINY: "Dítě osudu"
 story_cycle_martial_lifestyle_warhorse: "Válečný kůň"
 story_cycle_martial_lifestyle_warhorse_desc: "Máš k dispozici mimořádně dobře vycvičeného válečného koně. Ať se nepřátelé třesou před tvým útokem."
 WARHORSE_STORY_PRACTICAL_INFORMATION_STRING: "Tvůj válečný kůň se jmenuje #V [Story.Custom('WarhorseStoryNameAll')]#!. [Story.Custom('HorseStorySheHeAll')|U] je [Story.Custom('HorseStoryMareStallionAll')]."
 DOPPELGANGER: "Tvůj [Glossary( 'doppelgänger', 'DOPPELGANGER_GLOSS' )]"
 story_doppelganger: "Zrcadlo v blátě"
 DOPPELGANGER_GLOSS: "Doppelgänger je dvojník živého člověka, na kterého lze často narazit pouhou náhodou. V německém folklóru jde o znepokojivé zjevení a zlé znamení - spatření vlastního dvojníka může předznamenávat nemoc či smrt."
 story_doppelganger_desc: "Mezi poddanými se našel někdo, kdo je ti k nerozeznání podobný - skutečný [Glossary( 'doppelgänger', 'DOPPELGANGER_GLOSS' )]..."
 DOPPELGANGER_STORY_PRACTICAL_INFORMATION_STRING: "Někdo z poddaných, kdo vypadá a mluví přesně jako ty, může představovat příležitost... nebo prokletí. Prozatím [Story.MakeScope.Var('doppelganger_character').Char.GetUIName] pobývá na tvém [Concept('court','dvoře')|E]."
 story_cycle_hunt_mystical_animal: "Lov mystického zvířete"
 story_cycle_hunt_mystical_animal_desc: "Během lovu se ti na okamžik zjevilo mystické bílé zvíře. Polapit ho by bylo jako nalézt svatý grál!"
 WHITE_ANIMAL_INFORMATION_STRING: "Jsi na stopě záhadného bílého zvířete. Prý je to #V [Story.MakeScope.Var('animal_type').GetFlagName|U]#!.\n\nZa jeho polapení tě čeká velká odměna — pokaždé, když ti [Story.MakeScope.Var('animal_type').GetFlagName] unikne, však získáš [Concept('stress','stres')|E]. Čas od času ti [GetModifier('hunt_sighting_legendary_modifier').GetNameWithTooltip] umožní v lovu pokračovat.\n\nSetkání s bílým zvířetem ([Story.MakeScope.Var('animal_type').GetFlagName]): [Story.MakeScope.Var('encounters').GetValue|0V] #weak (od prvního setkání)#!"
 LEGENDARY_COUNTY_LABEL: "Současné útočiště bílého zvířete ([Story.MakeScope.Var('animal_type').GetFlagName|U])"
 story_sycophant: "Pochlebník"
 story_sycophant_desc: "Jeden z tvých dvořanů je očividný pochlebník a už pouhou svou přítomností popouzí tvé vazaly."
 SYCOPHANT_INFORMATION_STRING: "[Story.MakeScope.Var('sycophant_character').Char.GetShortUIName] ([Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('sycophant_character').Char )]) a [Story.MakeScope.Var('jealous_character').Char.GetShortUIName] ([Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('jealous_character').Char )]) si jdou po krku. Mohu se přiklonit na jednu stranu, ale druhou tím určitě rozhněvám. Teprve čas ukáže, kam tahle situace povede..."
 SYCOPHANT_LABEL: "Pochlebník"
 JEALOUS_VASSAL_LABEL: "Nejžárlivější z mých vazalů"
 story_cycle_pet_rock: "Kamenný mazlíček"
 story_cycle_pet_rock_desc: "Po tvém boku spočívá kamenný mazlíček, jehož neměnná tvář dokonale odpovídá tvému svéráznému pojetí společnosti."
 PET_ROCK_INFORMATION_STRING: "Tvůj kámen se jmenuje #V [Story.GetOwner.Custom('RockStoryName')].#!\nBarva jeho hrbolatého povrchu: [Story.GetOwner.Custom('RockColor')]."
 story_cycle_admin_eunuch: "Význačný eunuch"
 story_cycle_admin_eunuch_desc: "Na tvůj dvůr si našel cestu mimořádně schopný eunuch. Příležitost, nebo hrozba...?"
 EUNUCH_INFORMATION_STRING: "Postupem času dostaneš příležitosti svěřovat [Story.MakeScope.Var('eunuch').Char.GetShortUIName] stále větší moc a vliv. Tím se zvyšuje síla [Concept('modifier','modifikátoru')|E] [GetModifier('admin_eunuch_liege_4_modifier').GetNameWithTooltip].\n\nAle pozor — pokud eunucha odmítneš nebo mu svěříš #EMP příliš#! mnoho moci, aniž si zajistíš jeho loajalitu, následky mohou být vážné...\n\nPočet dosud odmítnutých žádostí: [Story.MakeScope.Var('eunuch_refusals').GetValue|0V]"
 EUNUCH_LABEL: "Eunuch"
 UPSET_COURTIERS: "Poddaní nespokojení s eunuchem"
 POETRY_BOOK_LABEL: "Má básnická sbírka"
 commission_epic_story: "Tvorba eposu"
 commission_epic_story_desc: "Necháváš vytvořit velkolepý epos, který má zachytit skutky tvé rodiny."
 EPIC_INFORMATION_STRING: "Na tvém eposu pracuje [Story.GetOwner.Custom('CommissionEpicScribe')][AddTextIf(Story.MakeScope.Var('composer').IsSet, Concatenate(Concatenate(', ', Story.MakeScope.Var('composer').Char.GetShortUIName), ','))]. Výsledné dílo bude [Story.Custom('CompositionTypeAll')] a má zvýšit [Concept('dynasty_prestige','věhlas')|E] tvé [Concept('dynasty','dynastie')|E] ([Story.GetOwner.GetDynasty.GetName]) a přinést ti [Concept('artifact','artefakt')|E].\n\nŠance na výjimečné dílo ([Story.Custom('CompositionTypeAll')]) je [Story.MakeScope.Var('final_outcome_chance').GetValue|0+/%]"
 COMPOSER: "Autor tvého eposu"
 story_foreign_raised_reformer: "[Select_CString(Story.GetOwner.IsFemale,'Reformátorka vychovaná','Reformátor vychovaný')] v cizině"
 story_foreign_raised_reformer_desc: "Tvé dětství se odehrálo daleko od země, kterou dnes nazýváš domovem.\nBylo tam všechno tak jiné... ale co kdyby se domov mohl více podobat právě tomu místu?"
 REFORMER_INFORMATION_STRING: "V [Story.MakeScope.Var('advanced_realm').Title.GetBaseName] tě [Select_CString(Story.MakeScope.Var('foreign_educator').Char.IsFemale,'vychovávala','vychovával')] [Story.MakeScope.Var('foreign_educator').Char.GetShortUIName], [Story.MakeScope.Var('advanced_culture').Culture.GetName] kultury a [Story.MakeScope.Var('advanced_culture_faith').Faith.GetAdjective] víry. [Story.MakeScope.Var('advanced_culture').Culture.GetName] [Concept('culture','kultura')|E] na tebe udělala dojem a přeješ si, aby se jí tvůj vlastní lid více podobal.\n\nZačneš dostávat příležitosti získávat body reformy nebo upevnění:\n$BULLET_WITH_TAB$#indent_newline:7 Cestou reformace můžeš získat [Concept('innovations','inovace')|E], [Concept('cultural_acceptance','kulturní přijetí')|E], [Concept('traditions','tradice')|E], nebo možná dokonce [GetBuilding('generic_university').GetName]. Pamatuj, že reformace je dlouhý a nákladný proces.#!\n$BULLET_WITH_TAB$#indent_newline:7 Cestou upevnění můžeš získat [Concept('opinion','mínění')|E] [Concept('vassal','vazalů')|E], [Concept('dynasty_prestige','věhlas')|E] a bonusy pro [Concept('war','válku')|E] v podobě [Concept('casus_bellis','casus belli')|E] a [Concept('special_troops','vojska z událostí')|E].#!"
 REFORM_LABEL: "Postup reformy tvé [Concept('culture','kultury')|E]"
 REAFFIRMATION_LABEL: "Postup upevnění tvé [Concept('culture','kultury')|E]"
 REFORM_MIN_VALUE_LABEL: ""
 REFORM_MAX_VALUE_LABEL: "Max.: #V 3#!"
 REAFFIRMATION_MIN_VALUE_LABEL: ""
 REAFFIRMATION_MAX_VALUE_LABEL: "Max.: #V 2#!"
 ECCENTRIC_MIN_VALUE_LABEL: ""
 ECCENTRIC_MAX_VALUE_LABEL: "Max.: #V 5#!"
 IMAGINARY_FRIEND_INFORMATION_STRING: "Tvůj imaginární přítel se jmenuje [Story.MakeScope.Var('imaginary_friend_name').Char.GetShortUINameNoTooltip]. Čas od času dostaneš příležitost ke společným hrám a rozhovorům."
 ECCENTRIC_VALUE: "Postup k získání rysu: [GetTrait('eccentric').GetName( GetNullCharacter )]"
 story_cycle_imaginary_friend: "Imaginární přítel"
 story_cycle_imaginary_friend_desc: "Konečně někdo, s kým si můžu hrát! Koho zajímá, že není skutečný? Pro mě skutečný je!"
 story_greatest_of_khans: "Největší z chánů"
 story_greatest_of_khans_desc: "Na nebesích je mnoho velkých světel. Slunce, měsíc i hvězdy. Ale na zemi může být jen jeden chán."
 GREATEST_OF_KHANS_INFORMATION_STRING: "$become_greatest_of_khans_decision_enable_gok_invasion_cb$\n$gok_enable_offer_submission_or_ruin_tt$\n\n@alert_icon! #alert_trial Pokud tvá [Concept('dynasty','dynastie')|E] ztratí kontrolu nad [Story.GetOwner.GetPrimaryTitle.GetName|l], přestane splňovat požadavek na typ vlády ([GetGovernment( 'nomad_government' ).GetName]), nebo do roku #high [Story.MakeScope.Var('gok_final_date').GetValue|0]#! nepřijme #high $mpo_gok_world_conquest_decision$#! [Concept('decision','rozhodnutí')|E], o tyto bonusy přijdeš a [Story.GetOwner.GetPrimaryTitle.GetName|l] bude hrozit rozpad!#!"
