 story_cycle_pet_cat: "Domácí kočka" # todo: NEW TRANSLATION
 story_cycle_pet_cat_desc: "#F Hrdá kočka vám dělá společnost, hbitý lovec, který dává náklonnost jen podle svých vlastních pravidel.#!" # todo: NEW TRANSLATION
 CAT_INFORMATION_STRING: "Jméno vaší kočky je #V [Story.Custom('CatStoryNameAll')].#!\n[Story.Custom('CatStoryHerHisAll')|U] srst je [Story.Custom('CatFurColorAll')], [Story.Custom('CatStoryHerHisAll')] oči jsou [Story.Custom('CatEyeColorAll')], a [Story.Custom('CatStorySheHeAll')] je [Story.Custom('CatStoryKittenOrAgeAll')].[Story.Custom('CatStupidOrNotStupidAll')]" # todo: NEW TRANSLATION
 dumb_but_sweet_orange_boy: "\n[Story.Custom('CatStorySheHeAll')|U] je hloupý [Story.Custom('CatFurColorAll')] [Story.Custom('CatStoryGirlBoyAll')], ale velmi roztomilý." # todo: NEW TRANSLATION
 story_cycle_pet_eagle: "Lovecký orel" # todo: NEW TRANSLATION
 story_cycle_pet_eagle_desc: "#F Na vaší rukavici sedí lovecký orel, stále bdělý, stále hladový, přinášející smrt z výšky.#!" # todo: NEW TRANSLATION
 EAGLE_INFORMATION_STRING: "Jméno vašeho orla je #V [Story.Custom('EagleStoryNameAll')].#!\n[Story.Custom('EagleStorySheHeAll')|U] má [Story.MakeScope.Var('eagle_age_variable').GetValue|0] let." # todo: NEW TRANSLATION
 bp2_hostage_loyalty: "Věrný rukojmí" # todo: NEW TRANSLATION
 bp2_hostage_loyalty_desc: "Jeden z vašich [Concept('hostages','rukojmí')|E] si k vám a vašim způsobům začíná získávat přízeň." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hostage: "[Concept('hostage','Rukojmí')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 HOSTAGE_STORY_PRACTICAL_INFORMATION_STRING: "Váš [Concept('hostage','rukojmí')|E], [Story.MakeScope.Var('hostage_target').Char.GetUIName], vyrůstá ve vašem [Concept('court','dvoře')|E], což ovlivňuje [Select_CString(Story.MakeScope.Var('hostage_target').Char.IsFemale,'její','jeho')] loajalitu. Udržujte [Story.MakeScope.Var('hostage_target').Char.GetHerHis] [Concept('opinion','mínění')|E] vysoké a vybírejte správné možnosti v událostech, aby bylo pravděpodobnější, že bude [Story.MakeScope.Var('hostage_target').Char.GetHerHim] věrný, až se [Story.MakeScope.Var('hostage_target').Char.GetSheHe] stane dospělým.\n\nAktuální loajalita: [Story.MakeScope.Var('theon_points').GetValue|0+]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 LOYALTY_LABEL: "Body věrnosti" # todo: NEW TRANSLATION
 claimant: "[Concept('claimant','Pretendent')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 diverted_crusaders: "Odvedení křižáci" # todo: NEW TRANSLATION
 frankokratia_story: "Frankokratia" # todo: NEW TRANSLATION
 frankokratia_story_desc: "Nárokovatel na [GetTitleByKey('e_byzantium').GetName|l] nalákal západní oportunisty z jejich křížové výpravy a obrátil jejich chamtivé meče přímo proti srdci křesťanstva..." # todo: NEW TRANSLATION
 FRANKOKRATIA_STORY_PRACTICAL_INFORMATION_STRING: "[Concept('war','Válka')|E] proti [GetTitleByKey('e_byzantium').GetHolder.GetShortUIName] rozhodne o budoucnosti [GetTitleByKey('e_byzantium').GetName|l]. Buď [Concept('claimant','pretendent')|E] [Story.MakeScope.Var('byz_claimant').Char.GetUIName] uchopí trůn a zaplatí křižákům za jejich úsilí — nebo bude zřízen nové [GetTitleByKey('e_latin_empire').GetBaseName] pod [GetFaithByKey('catholic').GetAdjective] nadvládou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 story_conqueror: "Dobyvatel" # todo: NEW TRANSLATION
 story_conqueror_desc: "Vaše ambice neznají mezí! Svět leží před vámi, zralý k uchopení." # todo: NEW TRANSLATION
 CONQUEROR_STORY_PRACTICAL_INFORMATION_STRING: "Dobyvatelé získávají mnoho silných bonusů, jako snížení [Concept('factions','frakce')|E], přístup k [Concept('vassalize_casus_belli','casu belli nucené vazalizace')|E] a občasné silné události.\n\nPřestanete být Dobyvatelem, pokud:\n$BULLET_WITH_TAB$Nejste [Concept('independent','nezávislý')|E]\n$BULLET_WITH_TAB$Váš status je snížen na [Concept('count','hrabě')|E]\n$BULLET_WITH_TAB$Stanete se [Concept('unlanded','bezzemkem')|E]\n$BULLET_WITH_TAB$Nejste ve [Concept('war','válce')|E] po dobu #V 10#! let\n$BULLET_WITH_TAB$Jste hluboce v [Concept('debt','dluhu')|E]\n$BULLET_WITH_TAB$Prohrajete #V 3#! nebo více [Concept('wars','války')|E]\n$BULLET_WITH_TAB$Stanete se [GetTrait('incapable').GetName( GetNullCharacter )]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 story_destiny_child: "Osudové dítě" # todo: NEW TRANSLATION
 story_destiny_child_desc: "Narodilo se dítě s velkým slibem, jako by ho zvolily samotné osudy." # todo: NEW TRANSLATION
 DESTINY_CHILD_STORY_PRACTICAL_INFORMATION_STRING: "Jednou za dlouhou dobu se narodí dítě předurčené k velikosti. Vyvíjí se rychleji než obvykle a dosahuje výšin, kterých ostatní nedosáhnou.\n\nPečujte dobře o [Story.MakeScope.Var('destiny_child').Char.GetUIName] a zvažte, že učiníte z [Story.MakeScope.Var('destiny_child').Char.GetHerHim] svého [Concept('player_heir','hráčského dědice')|E] — například tím, že ho uděláte svým [Concept('designated_heir','určeným dědicem')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 CHILD_OF_DESTINY: "Dítě osudu" # todo: NEW TRANSLATION
 story_cycle_martial_lifestyle_warhorse: "Válečný kůň" # todo: NEW TRANSLATION
 story_cycle_martial_lifestyle_warhorse_desc: "Máte k dispozici zvlášť vycvičeného válečného koně. Nechť vaši nepřátelé třesou před vaším útokem." # todo: NEW TRANSLATION
 WARHORSE_STORY_PRACTICAL_INFORMATION_STRING: "Váš válečný kůň se jmenuje #V [Story.Custom('WarhorseStoryNameAll')]#.! [Story.Custom('HorseStorySheHeAll')|U] je [Story.Custom('HorseStoryMareStallionAll')]." # todo: NEW TRANSLATION
 DOPPELGANGER: "Váš [Glossary( 'Doppelgänger', 'DOPPELGANGER_GLOSS' )]" # todo: NEW TRANSLATION
 story_doppelganger: "Zrcadlo v blátě" # todo: NEW TRANSLATION
 DOPPELGANGER_GLOSS: "Člověk podobný nebo dvojník žijící osoby, často setkán náhodou. V německém folklóru je to zlověstné zjevení a špatné znamení — spatření vlastního dvojníka může předpovídat nemoc nebo smrt." # todo: NEW TRANSLATION
 story_doppelganger_desc: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] nalezen rolník nesoucí vaši přesnou podobu — doslova [Glossary( 'doppelgänger', 'DOPPELGANGER_GLOSS' )]..." # todo: NEW TRANSLATION
 DOPPELGANGER_STORY_PRACTICAL_INFORMATION_STRING: "Rolník, který vypadá a mluví přesně jako vy, může být příležitostí... nebo kletbou. Prozatím [Story.MakeScope.Var('doppelganger_character').Char.GetUIName] pobývá ve vašem [Concept('court','dvoře')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 story_cycle_hunt_mystical_animal: "Lov mystického zvířete" # todo: NEW TRANSLATION
 story_cycle_hunt_mystical_animal_desc: "Během lovu jste zahlédli mystického, bílého tvora. Jeho chycení by bylo jako nalézt svatý grál!" # todo: NEW TRANSLATION
 WHITE_ANIMAL_INFORMATION_STRING: "Jste na stopě #V Bílého [Story.MakeScope.Var('animal_type').GetFlagName|U]#!.\n\nJeho chycení by přineslo velké odměny — ale pokaždé, když vám [Story.MakeScope.Var('animal_type').GetFlagName] unikne, získáte [Concept('stress','stres')|E]. Občas vám [GetModifier('hunt_sighting_legendary_modifier').GetNameWithTooltip] umožní v lovu pokračovat.\n\nWhite [Story.MakeScope.Var('animal_type').GetFlagName] encounters: [Story.MakeScope.Var('encounters').GetValue|0V] #weak (od prvního setkání)#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 LEGENDARY_COUNTY_LABEL: "Současný domov bílého [Story.MakeScope.Var('animal_type').GetFlagName|U]" # todo: NEW TRANSLATION
 story_sycophant: "Pochlebovač" # todo: NEW TRANSLATION
 story_sycophant_desc: "Jeden z vašich dvořanů, zřejmý pochlebovač, rozčiluje vaše vazaly svou pouhou přítomností." # todo: NEW TRANSLATION
 SYCOPHANT_INFORMATION_STRING: "Můj [Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('sycophant_character').Char )] [Story.MakeScope.Var('sycophant_character').Char.GetShortUIName] a můj [Story.GetOwner.Custom2( 'RelationToMeShort', Story.MakeScope.Var('jealous_character').Char )] [Story.MakeScope.Var('jealous_character').Char.GetShortUIName] jsou na nože. Můžu si vybrat oblíbence, ale tím určitě rozčílím toho druhého. Čas ukáže, jak se situace vyvine..." # todo: NEW TRANSLATION
 SYCOPHANT_LABEL: "Pochlebovač" # todo: NEW TRANSLATION
 JEALOUS_VASSAL_LABEL: "Můj nejžárlivější vazal" # todo: NEW TRANSLATION
 story_cycle_pet_rock: "Kamenný mazlíček" # todo: NEW TRANSLATION
 story_cycle_pet_rock_desc: "Po vašem boku je kámen jako mazlíček, jeho neměnný výraz dokonale ladí s vaším zvláštním smyslem pro společnost." # todo: NEW TRANSLATION
 PET_ROCK_INFORMATION_STRING: "Jméno vašeho kamene je #V [Story.GetOwner.Custom('RockStoryName')].#!\n[Story.GetOwner.Custom('RockStoryHerHis')|U] skalnatý povrch je [Story.GetOwner.Custom('RockColor')]." # todo: NEW TRANSLATION
 story_cycle_admin_eunuch: "Významný eunuch" # todo: NEW TRANSLATION
 story_cycle_admin_eunuch_desc: "Eunuch se zvláštními schopnostmi se dostal do vašeho dvora. Příležitost, nebo hrozba..?" # todo: NEW TRANSLATION
 EUNUCH_INFORMATION_STRING: "V průběhu času budete mít příležitosti udělit [Story.MakeScope.Var('eunuch').Char.GetShortUIName] větší moc a vliv. Tím zvýšíte sílu [GetModifier('admin_eunuch_liege_4_modifier').GetNameWithTooltip] [Concept('modifier','modifikátor')|E].\n\nAle pozor — pohrdnutí [Story.MakeScope.Var('eunuch').Char.GetHerHim], nebo udělení [Story.MakeScope.Var('eunuch').Char.GetHerHim] #EMP příliš mnoho#! moci bez zajištění [Select_CString(Story.MakeScope.Var('eunuch').Char.IsFemale,'její','jeho')] loajality, může mít závažné následky...\n\nDosud jste [Select_CString(ROOT.Char.IsFemale,'odmítla','odmítl')] žádosti [Story.MakeScope.Var('eunuch').Char.GetHerHis] [Story.MakeScope.Var('eunuch_refusals').GetValue|0V] krát." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 EUNUCH_LABEL: "Eunuch" # todo: NEW TRANSLATION
 UPSET_COURTIERS: "Dvořané rozhněvaní na eunucha" # todo: NEW TRANSLATION
 POETRY_BOOK_LABEL: "Moje sbírka básní" # todo: NEW TRANSLATION
 commission_epic_story: "Objednat epos" # todo: NEW TRANSLATION
 commission_epic_story_desc: "Objednáváte velký epos, který zaznamená činy vaší rodiny." # todo: NEW TRANSLATION
 EPIC_INFORMATION_STRING: "Váš [Story.GetOwner.Custom('CommissionEpicScribe')][AddTextIf(Story.MakeScope.Var('composer').IsSet, Concatenate(Concatenate(', ', Story.MakeScope.Var('composer').Char.GetShortUIName), ','))] vytváří epický [Story.Custom('CompositionTypeAll')], aby zvýšil [Concept('dynasty_prestige','věhlas')|E] [Story.GetOwner.GetDynasty.GetName] [Concept('dynasty','dynastie')|E] a získal [Concept('artifact','artefakt')|E].\n\nŠance na výjimečný [Story.Custom('CompositionTypeAll')] je: [Story.MakeScope.Var('final_outcome_chance').GetValue|0+/%]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 COMPOSER: "Skladatel vašeho eposu" # todo: NEW TRANSLATION
 story_foreign_raised_reformer: "Reformátor vychovaný v cizině" # todo: NEW TRANSLATION
 story_foreign_raised_reformer_desc: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jste [Select_CString(ROOT.Char.IsFemale,'vychována','vychován')] daleko od země, kterou nyní nazýváte domovem.\nTak odlišně... a přesto — co kdyby [Select_CString(ROOT.Char.IsFemale,'byla','byl')] domov více jako tamto místo?" # todo: NEW TRANSLATION
 REFORMER_INFORMATION_STRING: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jste [Select_CString(ROOT.Char.IsFemale,'vychována','vychován')] v [Story.MakeScope.Var('advanced_realm').Title.GetBaseName] u [Story.MakeScope.Var('foreign_educator').Char.GetShortUIName], [Story.MakeScope.Var('advanced_culture').Culture.GetName] [Story.MakeScope.Var('advanced_culture_faith').Faith.GetAdjective]. [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jste [Select_CString(ROOT.Char.IsFemale,'ohromena','ohromen')] [Story.MakeScope.Var('advanced_culture').Culture.GetName] [Concept('culture','kultura')|E] a přejete si, aby [Select_CString(ROOT.Char.IsFemale,'byla','byl')] váš lid více jako oni.\n\nZačnete získávat příležitosti získat buď body Reformy nebo body Znovupotvrzení:\n$BULLET_WITH_TAB$#indent_newline:7 Pokud usilujete o Reformu, můžete získat [Concept('innovations','inovace')|E], [Concept('cultural_acceptance','kulturní přijetí')|E], [Concept('traditions','tradice')|E], nebo třeba i [GetBuilding('generic_university').GetName]. Mějte na paměti, že Reforma je dlouhý a nákladný proces.#!\n$BULLET_WITH_TAB$#indent_newline:7 Pokud usilujete o Znovupotvrzení, můžete získat [Concept('vassal','vazal')|E] [Concept('opinion','mínění')|E], [Concept('dynasty_prestige','věhlas')|E], bonusy do [Concept('war','války')|E] ve formě [Concept('casus_bellis','casu belli')|E] a [Concept('special_troops','vojsko z událostí')|E].#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 REFORM_LABEL: "Pokrok směrem k reformě vaší [Concept('culture','kulturu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 REAFFIRMATION_LABEL: "Pokrok směrem k znovupotvrzení vaší [Concept('culture','kultuře')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 REFORM_MIN_VALUE_LABEL: "" # todo: NEW TRANSLATION
 REFORM_MAX_VALUE_LABEL: "Max: #V 3#!" # todo: NEW TRANSLATION
