 ECCENTRIC_MIN_VALUE_LABEL: "" # todo: NEW TRANSLATION
 ECCENTRIC_MAX_VALUE_LABEL: "Max: #V 5#!" # todo: NEW TRANSLATION
 IMAGINARY_FRIEND_INFORMATION_STRING: "Jméno vašeho imaginárního přítele je [Story.MakeScope.Var('imaginary_friend_name').Char.GetShortUINameNoTooltip]. Občas budete mít příležitosti jednat s [Story.MakeScope.Var('imaginary_friend_name').Char.GetHerHim]." # todo: NEW TRANSLATION
 ECCENTRIC_VALUE: "Pokrok směrem k získání [GetTrait('eccentric').GetName( GetNullCharacter )]" # todo: NEW TRANSLATION
 story_cycle_imaginary_friend: "Imaginární přítel" # todo: NEW TRANSLATION
 story_cycle_imaginary_friend_desc: "Konečně přítel na hraní! Co na tom, že nejsou skuteční? Pro mě jsou skuteční!" # todo: NEW TRANSLATION
 story_greatest_of_khans: "Největší z chánů" # todo: NEW TRANSLATION
 story_greatest_of_khans_desc: "Na nebi jsou mnohá velká světla. Na nebi slunce, měsíc a hvězdy. Ale na zemi může být jen jeden Chán." # todo: NEW TRANSLATION
 GREATEST_OF_KHANS_INFORMATION_STRING: "$become_greatest_of_khans_decision_enable_gok_invasion_cb$\n$gok_enable_offer_submission_or_ruin_tt$\n\n@alert_icon! #alert_trial Pokud vaše [Concept('dynasty','dynastie')|E] ztratí kontrolu nad [Story.GetOwner.GetPrimaryTitle.GetName|l], přestane být [GetGovernment( 'nomad_government' ).GetName], nebo selže v převzetí #high $mpo_gok_world_conquest_decision$#! [Concept('decision','rozhodnutí')|E] do roku #high [Story.MakeScope.Var('gok_final_date').GetValue|0]#!, tyto bonusy budou ztraceny a [Story.GetOwner.GetPrimaryTitle.GetName|l] se může rozpadnout!#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
