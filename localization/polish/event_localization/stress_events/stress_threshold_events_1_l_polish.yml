 stress_threshold.2341.t: "Duševní zhroucení: Zanedbané povinnosti"
 stress_threshold.2341.desc.intro: "Zatraceně, také potřebuji nějaký čas pro sebe! Co na tom, že si na pár dní, nebo klidně na celý měsíc, odjedu pryč a [ROOT.Char.Custom('GetCourt')|l] se bude muset obejít beze mě? Vládnout je mým právem a budu je vykonávat, nebo odkládat, jak se mi zlíbí.\n\nJsem [ROOT.GetCharacter.GetTitleAsNameNoTooltip],"
 stress_threshold.2341.desc.lazy: "a potřebuji si odpočinout!"
 stress_threshold.2341.desc.craven: "a pokud se rozhodnu nevystavovat nebezpečí, nikomu do toho nic není!"
 stress_threshold.2341.desc.shy: "a pokud nechci nikoho vidět, [ROOT.Char.Custom('GetCourtierPlural')|l] mě k tomu nemohou nutit!"
 stress_threshold.2341.desc.arbitrary: "a nemám žádné povinnosti kromě těch, které se rozhodnu plnit!"
