 stress_threshold.2351.t: "Duševní zhroucení: Nevhodné poznámky"
 stress_threshold.2351.desc.intro: "Sedím a sotva poslouchám, jak místní rolník dokončuje své vyprávění o všech útrapách. Upřímně řečeno, skoro ani nevnímám, o čem je řeč. Hlava mi málem praská pod tíhou mých #EMP vlastních#! problémů.\n\n"
 stress_threshold.2351.desc.content: "„Nemůžeš se prostě #EMP spokojit#! s tím, co ti zbylo?“"
 stress_threshold.2351.desc.cynical: "„Pche, jak mám vůbec vědět, že mi #EMP nelžeš#!?“"
 stress_threshold.2351.desc.paranoid: "„To je ale #EMP věrohodná#! historka. Nejspíš jsi jen nějaký proradný špeh!“"
 stress_threshold.2351.desc.sadistic: "„Víš, myslím, že se pro tebe v mém [ROOT.Char.Custom('GetDungeon')] najde #EMP dokonalé#! místečko.“"
 stress_threshold.2351.desc.vengeful: "„Určitě sis zasloužil všechno, co tě potkalo.“"
 stress_threshold.2351.desc.fallback: "„[ROOT.GetCharacter.GetFaith.HighGodName] ví, že #EMP páchneš#!.“"
 stress_threshold.2351.desc.rump: "vyhrkne ze mě bez přemýšlení.\n\nV [ROOT.Char.Custom('GetRoom')] zavládne naprosté ticho a všechny pohledy se obrátí k nám dvěma. Takovou odpověď zjevně nikdo nečekal."
