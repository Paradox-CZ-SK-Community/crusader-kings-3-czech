l_polish:
 stress_threshold.1701.t: "Duševní zhroucení: Všechno se vrací"
 stress_threshold.1701.desc.intro: "Frustrovaně přecházím sem a tam. [ROOT.Char.Custom('GetCourt')|U] kolem mě hučí hlasy; mnozí [ROOT.Char.Custom('GetCourtierPlural')|l] pořád dokola omílají nějaký problém, jehož dějištěm je [capital_province.GetNameNoTooltip].\n\n"
 stress_threshold.1701.desc.lazy: "Nemám sílu se o to vůbec starat a zoufale toužím zalézt zpátky do postele!"
 stress_threshold.1701.desc.wrathful: "V takových dnech, kdy se jejich slova mění v tupé, protivné bzučení v uších, mám chuť je všechny pověsit."
 stress_threshold.1701.desc.impatient: "Kéž by si pospíšili a vyřešili si to sami, abych se nemusel osobně zabývat každou. Pitomou. Maličkostí."
 stress_threshold.1701.desc.arrogant: "Upřímně, někdy mám pocit, že bez mého osobního dohledu by se všechno sesypalo. A [ROOT.Char.Custom('GetRealmOrDomicile')|l]? Tam obzvlášť."
 stress_threshold.1701.desc.arbitrary: "Možná to ani není skutečný problém. Třeba jde jen o nějakou hloupou místní malichernost, na které sotva záleží."
 stress_threshold.1701.desc.trusting: "Při tom, jak to poslední dobou chodí, se mi těžko soustředí, ale tak tvrdá slova by přece nikdo neříkal, kdyby na nich nebylo něco pravdy."
 stress_threshold.1701.desc.stubborn: "Upřímně, tohle ani nezní jako nějaký velký problém. Kdyby se víc snažili, té závady by si ani nevšimli."
 stress_threshold.1701.desc.fallback: "Někdy je prostě duševně vyčerpávající už jen existovat ve vlastní kůži."
 stress_threshold.1701.desc.rump: "\n\nNa tom, o čem mluví, je něco... povědomého. N-nebyl ten plán náhodou #EMP můj#! nápad? Je to #EMP moje#! vina?"
 stress_threshold.1701.a.rakish.gain: "K čertu s tím! Jdu do nevěstince."
 stress_threshold.1701.a.rakish.effect: "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.1701.b.irritable.gain: "[ROOT.GetCharacter.GetFaith.HighGodName] mi buď svědkem, že někoho praštím."
 stress_threshold.1701.b.irritable.effect: "$stress_threshold.1701.b.irritable.gain$"
 stress_threshold.1701.c.flagellant.gain: "Za své hříchy se zbičuji!"
 stress_threshold.1701.c.flagellant.effect: "$stress_threshold.1701.c.flagellant.gain$"
 stress_threshold.1701.d.profligate.gain: "Možná by mi nový plášť zvedl náladu..."
 stress_threshold.1701.d.profligate.effect: "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1701.g.journaller.gain: "Musím tyhle myšlenky dostat z hlavy na papír."
 stress_threshold.1701.g.journaller.effect: "$stress_threshold.1701.g.journaller.gain$"
 stress_threshold.1701.h.confider.gain: "Třeba mě [friend.GetFirstNameNoTooltip] podpoří?"
 stress_threshold.1701.h.confider.effect: "[friend.GetFirstNameNoTooltip] mě určitě podpoří!"
 stress_threshold.1701.i.drunkard.gain: "Pořádný doušek vyřeší většinu problémů..."
 stress_threshold.1701.i.drunkard.effect: "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.1701.j.hashishiyah.gain: "Trocha hašiše utiší mé rozjitřené nervy..."
 stress_threshold.1701.j.hashishiyah.effect: "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.1701.k: "Jen bezduché tlachání. Se mnou to nemá nic společného."
 stress_threshold.1711.t: "Duševní zhroucení: Příliš mnoho práce"
 stress_threshold.1711.desc.intro: "[ROOT.GetCharacter.GetFaith.FateGodName] mi pomáhej, [ROOT.Char.Custom('GetCourtierPlural')|l] mě poslední dobou nepřestávají zahrnovat žádostmi. Tahle práce snad #EMP nikdy neskončí#!. A už ke mně míří někdo další, zjevně kvůli nějaké malichernosti.\n\n"
 stress_threshold.1711.desc.greedy: "„Neseš mi nějaké daně? Ne? Tak mě to moc nezajímá.“"
 stress_threshold.1711.desc.diligent: "„Na tvoje problémy se dostane za pár týdnů. Na rychlejší vyřízení nejsou dost důležité.“"
 stress_threshold.1711.desc.patient: "$stress_threshold.1711.desc.diligent$"
 stress_threshold.1711.desc.deceitful: "„Nevypadáš na někoho z mých poddaných. Běž obtěžovat někoho jiného.“"
 stress_threshold.1711.desc.ambitious: "„Myslíš, že ze mě vyloudíš královskou pečeť jen proto, že jsi z města? Já jsem [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L]!“"
 stress_threshold.1711.desc.just: "„Jestli přicházíš pro spravedlnost, věz, že kvůli pár mincím nebudu rušit rozhodnutí svých soudců.“"
 stress_threshold.1711.desc.zealous: "„Přímo z tebe cítím puch hříchu!“"
 stress_threshold.1711.desc.fallback: "„Ať se nade mnou [ROOT.GetCharacter.GetFaith.HealthGodName] smiluje, jen ne další!“"
 stress_threshold.1711.desc.rump: "\n\n[courtier.GetFirstName] na mě zírá s vytřeštěnýma očima a šokovaně rychle mrká. To snad kvůli mým slovům?"
 stress_threshold.1711.a.reclusive.gain: "Ještě tenhle. Pak chci být o samotě."
 stress_threshold.1711.a.reclusive.effect: "$stress_threshold.1711.a.reclusive.gain$"
 stress_threshold.1711.b.flagellant.gain: "Bičování ze mě ten hřích vyžene..."
 stress_threshold.1711.b.flagellant.effect: "$stress_threshold.1711.b.flagellant.gain$"
 stress_threshold.1711.c.profligate.gain: "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1711.c.profligate.effect: "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1711.d.improvident.gain: "Posluž si z pokladnice. Peníze se ti budou hodit."
 stress_threshold.1711.d.improvident.effect: "$stress_threshold.1711.d.improvident.gain$"
 stress_threshold.1711.e.journaller.gain: "Útěchu najdu ve svém deníku."
 stress_threshold.1711.e.journaller.effect: "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1711.f.athletic.gain: "Jdu se projet na koni. Hned."
 stress_threshold.1711.f.athletic.effect: "$stress_threshold.1711.f.athletic.gain$"
 stress_threshold.1711.g.drunkard.gain: "Napít se! Na tohle je střízlivá hlava krátká."
 stress_threshold.1711.g.drunkard.effect: "$stress_threshold.1711.g.drunkard.gain$"
 stress_threshold.1711.h.hashishiyah.gain: "Hašiš! Na tohle je střízlivá hlava krátká."
 stress_threshold.1711.h.hashishiyah.effect: "$stress_threshold.1711.h.hashishiyah.gain$"
 stress_threshold.1711.i: "Jsem [ROOT.GetCharacter.GetTitleAsNameNoTooltip], tohle zvládnu!"
 stress_threshold.1721.t: "Duševní zhroucení: Nejsem tím, za koho mě mají!"
 stress_threshold.1721.desc.intro: "Poslední dobou mám pocit, že si nezasloužím být [ROOT.Char.GetTitleAsNameNoTooltip]. Pochybují o sobě ostatní stejně jako já?\n\nSnažím se "
 stress_threshold.1721.desc.chaste: "žít cudně, ale neustále mě pokoušejí tělesné slasti. Takovým choutkám bych přece měl dokázat odolat."
 stress_threshold.1721.desc.temperate: "držet se střídmosti, ale pořád se mi sbíhají sliny. Všechno ve mně probouzí hlad. Proč mám pořád tak zatracený, nelidský hlad?"
 stress_threshold.1721.desc.generous: "rozdávat štědře, ale ať rozdám sebevíc, vždycky se objeví někdo další s nataženou žebráckou miskou. Ostatní jako by takové problémy vůbec neměli."
 stress_threshold.1721.desc.calm: "zachovat klid, ale snad #EMP každý#! z mých [ROOT.Char.Custom('GetCourtierPlural')|l] je odhodlaný pocuchat mi nervy. Drobné krize ovládají mé dny a mám pocit, že pod jejich tíhou praskám, zatímco ostatní ne."
 stress_threshold.1721.desc.humble: "jednat pokorně, ale z každého mého činu jako by čišela pýcha. Ostatní dokážou žít tak skromně, zatímco já při každé příležitosti okázale předvádím vlastní nádheru. Nemohu to vystát."
 stress_threshold.1721.desc.honest: "mluvit pravdu, ale v každém rozhodnutí vidím zamlčené skutečnosti a drobné nepřesnosti, které překrucují smysl mých slov. Ostatní působí tak svědomitě a otevřeně. Proč zrovna mě musí sužovat taková prolhanost?"
 stress_threshold.1721.desc.craven: "jednat ušlechtile, ale zbabělost mi nedovoluje projevit tolik odvahy jako ostatním a zdá se, že mí [ROOT.Char.Custom('GetCourtierPlural')|l] si toho neustále všímají."
 stress_threshold.1721.desc.content: "žít ušlechtile, spokojit se s tím, co mám, a nenechat se vláčet zbytečnými ambicemi, ale přesto mám pocit, že jednám mnohem žárlivěji a pyšněji než ostatní."
 stress_threshold.1721.desc.cynical_no_collide: "uvažovat rozumně, ale mí [ROOT.Char.Custom('GetCourtierPlural')|l] jako by vždy obdivovali názory druhých, zatímco nad mými úvahami jen mávnou rukou."
 stress_threshold.1721.desc.paranoid: "jednat obezřetně, ale všechno předvídat nedokážu. Vždycky se objeví další zrádci, další skrytá spiknutí. Ostatní se s takovou zradou potýkat nemusí a mohu si vyčítat jen to, že ji nějak podněcuji."
 stress_threshold.1721.desc.callous: "hledět na věci realisticky, ale mí [ROOT.Char.Custom('GetCourtierPlural')|l] si všechno, co udělám, vykládají jako zlý úmysl a rozčilují se kvůli každé malichernosti. Ostatní zjevně nemají s ovládáním svých podřízených takové potíže."
 stress_threshold.1721.desc.compassionate: "jednat soucitně, ale ostatní jako by byli mnohem milovanější než já. Nedokážu si k lidem najít takovou cestu, jakou bych chtěl."
 stress_threshold.1721.desc.fickle: "přizpůsobovat se, ale ať změním názor kolikrát chci a ať získám sebevíc nových informací, ostatní se změnám dokážou přizpůsobit lépe než já."
 stress_threshold.1721.desc.vengeful: "jednat spravedlivě, oplácet urážky a trestat provinilce, ale ostatní jako by svou pomstu vždy dokázali vykonat mnohem rychleji."
 stress_threshold.1721.desc.forgiving: "odpouštět, ale mí [ROOT.Char.Custom('GetCourtierPlural')|l] se mi přesto bojí svěřovat se svými problémy. Ostatní jako by měli stovky důvěrníků a já nevím, co udělat, aby mi mí lidé věřili stejně."
 stress_threshold.1721.desc.fallback: "jednat ušlechtile, ale mám tolik nedostatků."
 stress_threshold.1721.desc.rump: "\n\nProklínám celý svět za to, že na někoho, jako jsem já, uvalil takovou odpovědnost!"
 stress_threshold.1721.a.reclusive.gain: "Musím být o samotě a všechno si promyslet."
 stress_threshold.1721.a.reclusive.effect: "$stress_threshold.1721.a.reclusive.gain$"
 stress_threshold.1721.b.irritable.gain: "$stress_threshold.1701.b.irritable.gain$"
 stress_threshold.1721.b.irritable.effect: "$stress_threshold.1701.b.irritable.gain$"
 stress_threshold.1721.c.flagellant.gain: "$stress_threshold.1701.c.flagellant.gain$"
 stress_threshold.1721.c.flagellant.effect: "$stress_threshold.1701.c.flagellant.gain$"
 stress_threshold.1721.d.profligate.gain: "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1721.d.profligate.effect: "$stress_threshold.1701.d.profligate.gain$"
 stress_threshold.1721.e.improvident.gain: "Díky dobročinnosti jsem přece lepší člověk, ne?"
 stress_threshold.1721.e.improvident.effect: "$stress_threshold.1721.e.improvident.gain$"
 stress_threshold.1721.f.contrite.gain: "Musím veřejně vyznat své hříchy."
 stress_threshold.1721.f.contrite.effect: "$stress_threshold.1721.f.contrite.gain$"
 stress_threshold.1721.g.comfort_eater.gain: "Budeme hodovat, dokud mi nebude lépe!"
 stress_threshold.1721.g.comfort_eater.effect: "Uspořádejte další hostinu! A pak další a další!"
 stress_threshold.1721.h.inappetetic.gain: "Řekněte kuchaři, ať mi přestane chystat večeře."
 stress_threshold.1721.h.inappetetic.effect: "$stress_threshold.1721.h.inappetetic.gain$"
 stress_threshold.1721.i.journaller.gain: "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1721.i.journaller.effect: "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1721.j.confider.gain: "$stress_threshold.1701.h.confider.gain$"
 stress_threshold.1721.j.confider.effect: "$stress_threshold.1701.h.confider.effect$"
 stress_threshold.1721.k.drunkard.gain: "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.1721.k.drunkard.effect: "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.1721.l.hashishiyah.gain: "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.1721.l.hashishiyah.effect: "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.1721.m: "Nejsem o nic horší než ostatní!"
 stress_threshold.1721.n: "Možná mám chuť na to nejvzácnější maso..."
 stress_threshold.1731.t: "Duševní zhroucení: Ani chvíle pro sebe"
 stress_threshold.1731.desc.intro: "Poslední dobou je toho vyčerpávajícího shonu až příliš. Jako bych neměl jediného [ROOT.Char.Custom('GetCourtier')|l], který by si bez mých výslovných a podrobných pokynů nedokázal ani utřít zadek!\n\nUprostřed plánování malého výletu"
 stress_threshold.1731.desc.lustful: " do místního nevěstince, kde hodlám zůstat, dokud mě nebude všechno pálit a bolet,"
 stress_threshold.1731.desc.gluttonous: " do vyhlášené krčmy, kde ochutnám exotické pokrmy z dalekých krajů,"
 stress_threshold.1731.desc.brave: " za soubojem ve zbrani s důstojným soupeřem,"
 stress_threshold.1731.desc.shy: " na jedno zdejší místo proslulé svým klidem,"
 stress_threshold.1731.desc.gregarious: " za veselím s několika sympatickými místními,"
 stress_threshold.1731.desc.sadistic: " do místního vězení nacpaného zločinci a rolníky,"
 stress_threshold.1731.desc.fallback: " někam pryč od povinností, které přináší [ROOT.Char.Custom('GetCourt')|l],"
 stress_threshold.1731.desc.rump: " se ke mně přiřítí sluha a začne blekotat o nějaké nové bezvýznamné katastrofě."
 stress_threshold.1731.a.rakish.gain: "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.1731.a.rakish.effect: "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.1731.b.reclusive.gain: "To počká. Všechno to počká."
 stress_threshold.1731.b.reclusive.effect: "$stress_threshold.1731.b.reclusive.gain$"
 stress_threshold.1731.c.profligate.gain: "Cestou se jen zastavím a něco málo si koupím..."
 stress_threshold.1731.c.profligate.effect: "$stress_threshold.1731.c.profligate.gain$"
 stress_threshold.1731.d.comfort_eater.gain: "U oběda si rozmyslím, jestli se vrátím dřív."
 stress_threshold.1731.d.comfort_eater.effect: "$stress_threshold.1731.d.comfort_eater.gain$"
 stress_threshold.1731.e.journaller.gain: "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1731.e.journaller.effect: "$stress_threshold.1711.e.journaller.gain$"
 stress_threshold.1731.f.confider.gain: "Cestou si o tom promluvím s [friend.GetFirstNameNoTooltip]."
 stress_threshold.1731.f.confider.effect: "$stress_threshold.1731.f.confider.gain$"
 stress_threshold.1731.g.athletic.gain: "Možná se na ten svůj únik vydám pěšky..."
 stress_threshold.1731.g.athletic.effect: "$stress_threshold.1731.g.athletic.gain$"
 stress_threshold.1731.h.drunkard.gain: "Vypadá to, že celou cestu budu pít."
 stress_threshold.1731.h.drunkard.effect: "$stress_threshold.1731.h.drunkard.gain$"
 stress_threshold.1731.i.hashishiyah.gain: "Máme na cestu hašišové koláčky?"
 stress_threshold.1731.i.hashishiyah.effect: "$stress_threshold.1731.i.hashishiyah.gain$"
 stress_threshold.1731.g: "#EMP Dobrá#!, zruším své plány."
 stress_threshold.2301.t: "Duševní zhroucení: Narůstající potřeby"
 stress_threshold.2301.desc.intro: "Poslední dobou mi každý den protéká mezi prsty v nekonečném sledu těžkých rozhodnutí. Svírá se mi hruď. Konečky prstů mě svědí a brní a mám pocit, jako by se mi oči už nevešly do lebky.\n\nPotřebuji na chvíli uniknout. Potřebuji jen"
 stress_threshold.2301.desc.lustful: " cítit v náručí teplo druhého člověka a alespoň na chvíli s někým navázat opravdové spojení."
 stress_threshold.2301.desc.gluttonous: " něco sníst, cokoli, co by zaplnilo tuhle prázdnotu."
 stress_threshold.2301.desc.greedy: " mezi prsty ucítit uklidňující tvrdost chladných mincí, něco spolehlivého, něco, co dává smysl."
 stress_threshold.2301.desc.gregarious: " s někým mluvit, s kýmkoli, opravdu #EMP mluvit#! a mít pocit, že mi rozumí."
 stress_threshold.2301.desc.fallback: " se nadechnout bez pocitu, že mě všechno drtí, a usmát se bez té prázdnoty uvnitř."
 stress_threshold.2301.desc.rump: "\n\nJe toho snad tolik?"
 stress_threshold.2301.a.rakish.gain: "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.2301.a.rakish.effect: "$stress_threshold.1701.a.rakish.gain$"
 stress_threshold.2301.b.profligate.gain: "Možná... Možná novou postel? Nebo rovnou tři?"
 stress_threshold.2301.b.profligate.effect: "$stress_threshold.2301.b.profligate.gain$"
 stress_threshold.2301.c.comfort_eater.gain: "$stress_threshold.1721.g.comfort_eater.gain$"
 stress_threshold.2301.c.comfort_eater.effect: "$stress_threshold.1721.g.comfort_eater.effect$"
 stress_threshold.2301.d.drunkard.gain: "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2301.d.drunkard.effect: "$stress_threshold.1701.i.drunkard.gain$"
 stress_threshold.2301.e.hashishiyah.gain: "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2301.e.hashishiyah.effect: "$stress_threshold.1701.j.hashishiyah.gain$"
 stress_threshold.2301.f: "Nenávidím to."
 stress_threshold.2311.t: "Duševní zhroucení: Přízraky minulosti"
 stress_threshold.2311.desc.intro: "Sedím o samotě, tíží mě vzpomínky a hlavou se mi honí věci, které jsem udělal[Select_CString(ROOT.Char.IsFemale,'a','')] před mnoha a mnoha lety."
 stress_threshold.2311.desc.generous: "Byla má štědrost jako [ROOT.GetCharacter.GetTitleAsNameNoTooltip] skutečná? Opravdu jsem lidem pomáhal[Select_CString(ROOT.Char.IsFemale,'a','')]?"
 stress_threshold.2311.desc.diligent: "Pracoval[Select_CString(ROOT.Char.IsFemale,'a','')] jsem tehdy dost tvrdě? Odvrátilo mé úsilí potíže, nebo je naopak způsobilo?"
 stress_threshold.2311.desc.wrathful: "Kolikrát jsem se nechal[Select_CString(ROOT.Char.IsFemale,'a','')] unést vztekem? Obracel se můj hněv správným směrem, nebo jsem si ho vybíjel[Select_CString(ROOT.Char.IsFemale,'a','')] na nesprávných lidech?"
 stress_threshold.2311.desc.patient: "Nebyl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem až příliš opatrný[Select_CString(ROOT.Char.IsFemale,'á','ý')]? Nebyla má trpělivost jen vznešeně nazvanou nerozhodností?"
 stress_threshold.2311.desc.arrogant: "Dovedla mě sem má vlastní pýcha? Čeká mě za ni pád, který mě nakonec zahubí?"
 stress_threshold.2311.desc.humble: "Měl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem na to vůbec? Nebyl by někdo jiný jako [ROOT.GetCharacter.GetTitleAsNameNoTooltip] vhodnější?"
 stress_threshold.2311.desc.deceitful: "Nezapletl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem se už příliš do vlastních lží? Myslel[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si, jak jsem chytrý[Select_CString(ROOT.Char.IsFemale,'á','ý')], ale možná mě mé vlastní úskoky právě teď dohánějí."
 stress_threshold.2311.desc.zealous: "Opravdu nade mnou bdí [ROOT.GetCharacter.GetFaith.HighGodName]? Byla má víra pochodní v temnotách, nebo jen hranicí mé vlastní pošetilosti?"
 stress_threshold.2311.desc.fallback: "Měl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem pravdu? Mýlil[Select_CString(ROOT.Char.IsFemale,'a','')] jsem se?"
 stress_threshold.2311.desc.rump: "Udělal[Select_CString(ROOT.Char.IsFemale,'a','')] jsem vůbec někdy skutečně správnou věc?\n\nTřeští mi hlava. Proč [ROOT.GetCharacter.GetFaith.HighGodName] vede mé kroky právě touto cestou, když mi přináší jen takové trápení?"
