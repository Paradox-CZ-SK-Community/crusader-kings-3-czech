 stress_threshold.3421.t: "Duševní zhroucení: Panství neřesti"
 stress_threshold.3421.desc.intro: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ prosí sluha, „neuděláte prosím něco? [burning_holding.GetNameNoTier] hoří! Musíte poslat pomoc!“\n\n"
 stress_threshold.3421.desc.lustful: "Protáhnu se a oběma rukama bez námahy spočinu na krásných mladých tělech. Sbor sténání za mými zády jako by přítomnost návštěvy vůbec nevnímal."
 stress_threshold.3421.desc.gluttonous: "Dál si cpu jídlo do úst. Svou osamělou hostinu přeruším až po několika trapně dlouhých minutách, kdy je jasné, že posel bez výslovného rozkazu neodejde."
 stress_threshold.3421.desc.greedy: "Nerušeně dál počítám mince. Lesklé hromádky stříbra a zlata mě obklopují jako věžičky maličkého hradu, pečlivě roztříděné podle velikosti a ryzosti, a představují značnou část mého bohatství."
 stress_threshold.3421.desc.lazy: "Oči nechávám zavřené. Zlehka se pohupuji v látkovém závěsu, o samotě v nejvyšší věži, která mi patří. Společnost mi dělá jen posel a záplava měkkých polštářů a přikrývek hodná [ROOT.GetCharacter.GetTitleAsNamePossessiveNoTooltip|L] výkupného."
 stress_threshold.3421.desc.arrogant: "Dál pracuji na modelu nové, dokonalé podoby ideálního paláce. V každém detailu je stejně dokonalý jako já, a protože jej vytvářím právě já, je každý jednotlivý detail ze své podstaty správný."
 stress_threshold.3421.desc.craven: "Zůstávám bezpečně ukrytý za těžkými dveřmi pobitými železem. K jejich vyražení by bylo potřeba tuctu statných vojáků a v této bezpečné místnosti bez oken se mohu držet co nejdál od všeho nebezpečí."
 stress_threshold.3421.desc.gregarious: "Přes hlučný smích a veselí za mými zády sotva slyším, co posel říká. Má oslava je v plném proudu a táhne se už několik dní."
 stress_threshold.3421.desc.cynical: "Ze dveří svého útočiště na posla nevěřícně zírám. Požár? Opravdu? Naprosto očividná lež. Jak vůbec můžu vědět, že je to skutečně jeden z #EMP mých#! sluhů? Může to být kdokoli! Nejlepší bude rychle se ho zbavit."
 stress_threshold.3421.desc.zealous: "Dál si čtu v [ROOT.GetCharacter.GetFaith.ReligiousText], obklopen posvátnými symboly své víry, a čekám, zda mi [ROOT.GetCharacter.GetFaith.HighGodName] ukáže cestu. Teprve když je jasné, že posel neodejde, obrátím k němu pozornost."
 stress_threshold.3421.desc.stubborn: "Oči nechávám zavřené a postel zůstává netknutá. Můj denní řád je můj denní řád a bez #EMP mimořádně#! dobrého důvodu jej měnit nebudu. Pohnu se až ve chvíli, kdy se posel chystá zeptat znovu."
 stress_threshold.3421.desc.fallback: "Stojím v nejvyšší věži. Pode mnou leží [capital_holding.GetNameNoTier] a já se zamračeně dívám na hlavní město. Připadá mi, že jsem odsud celé dny nevytáhl paty, a pokaždé, když to udělám, se něco dalšího katastrofálně pokazí."
 stress_threshold.3421.desc.rump: "\n\n„[Select_CString(ROOT.Char.IsFemale,'Výslovně jsem zakázala','Výslovně jsem zakázal')] jakékoli vyrušování,“ odpovím. Jen tahle místnost, tahle skutečnost, ještě dává mé rozpadající se mysli nějaký smysl."
