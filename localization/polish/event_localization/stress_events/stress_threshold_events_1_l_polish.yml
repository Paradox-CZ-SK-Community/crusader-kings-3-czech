 stress_threshold.2331.t: "Duševní zhroucení: Odcizená autorita"
 stress_threshold.2331.desc.intro: "Poslední dobou se mi [ROOT.Char.Custom('GetCourtierPlural')|l] vyhýbají, jak jen mohou. Slýchám šepot o tom, že "
 stress_threshold.2331.desc.calm: "můj klidný přístup působí znepokojivě, jako bych snad neměl žádné emoce,"
 stress_threshold.2331.desc.brave: "si mou odvahu pletou s krvelačností,"
 stress_threshold.2331.desc.ambitious: "se před svými ambicemi nezastavím vůbec před ničím a nic mi není svaté,"
 stress_threshold.2331.desc.just: "má přísnost zachází příliš daleko a lpím spíš na liteře zákona než na jeho duchu,"
 stress_threshold.2331.desc.callous: "prý nemám srdce a nezáleží mi na nikom kromě sebe,"
 stress_threshold.2331.desc.stubborn: "má tvrdohlavost nezná mezí a odmítám ustoupit či přistoupit na jakýkoli kompromis,"
 stress_threshold.2331.desc.fallback: "si od ostatních držím příliš velký odstup a působím neosobně,"
 stress_threshold.2331.desc.rump: "ale to přece jen znamená, že vládnu pevnou rukou. Neznamená to, že jsem nějaké monstrum.\n\n... Nebo snad ano?"
 stress_threshold.2331.a.reclusive.gain: "Já #EMP je#! také nechci vidět!"
