 stress_threshold.3401.t: "Duševní zhroucení: Zabít posla"
 stress_threshold.3401.desc.intro: "V hlavě mi zuří bouře uvězněná ve skořápce vejce. Vrtím se na trůnu a marně hledám pohodlnější polohu, zatímco poslouchám nějakou bezvýznamnou dojemnou historku o pirátech, banditech, nájezdnících nebo jiné podobné starosti prostého lidu.\n\nTlak v lebce sílí a zoufale si žádá nějaké uvolnění. Téměř bezděčně otevírám ústa."
 stress_threshold.3401.desc.vengeful: "„To od tebe před pár lety přiletělo to vejce, ne?“"
 stress_threshold.3401.desc.wrathful: "„Jak se opovažuješ obtěžovat mě takovými malichernostmi?!“"
 stress_threshold.3401.desc.impatient: "„Tak už to vyklop! Ach, moc pomalu!“"
 stress_threshold.3401.desc.arbitrary: "„[ROOT.GetCharacter.GetFaith.HighGodName] je mi svědkem, že tvůj pach je opravdu pronikavý.“"
 stress_threshold.3401.desc.paranoid: "„Tyhle průhledné lži ti nezbaštím! Tohle je očividně pokus o atentát!“"
 stress_threshold.3401.desc.callous: "„Takové malicherné problémy mě nezajímají.“"
 stress_threshold.3401.desc.sadistic: "„Tak mizerná služba je špatným příkladem pro ostatní.“"
 stress_threshold.3401.desc.fallback: "$stress_threshold.3401.desc.wrathful$"
 stress_threshold.3401.desc.rump: "„#EMP Setněte toho hlupáka!#!“\n\nCelý dvůr kolem nás ztichne jako hrob."
 stress_threshold.3401.a.reclusive.gain: "A potom mi všichni zmizte z očí!"
 stress_threshold.3401.a.reclusive.effect: "$stress_threshold.3401.a.reclusive.gain$"
 stress_threshold.3401.a.reclusive.list: "Každá [Concept('character','postava')|E] mimo tvou nejbližší domácnost"
 stress_threshold.3401.b.irritable.gain: "A setněte každého dalšího, kdo se mnou zkusí promluvit!"
 stress_threshold.3401.b.irritable.effect: "$stress_threshold.3401.b.irritable.gain$"
 stress_threshold.3401.c.journaller.gain: "Vyždímejte tu mrtvolu! #EMP Její tekutiny použiji jako inkoust!#!"
 stress_threshold.3401.c.journaller.effect: "$stress_threshold.3401.c.journaller.gain$"
 stress_threshold.3401.d.confider.gain: "$stress_threshold.1701.h.confider.gain$"
 stress_threshold.3401.d.confider.effect: "$stress_threshold.1701.h.confider.effect$"
 stress_threshold.3401.e.drunkard.gain: "A přineste mi něco k pití! A ještě jedno do zásoby!"
 stress_threshold.3401.e.drunkard.effect: "$stress_threshold.3401.e.drunkard.gain$"
 stress_threshold.3401.f.hashishiyah.gain: "A přineste nějaké hašišové koláčky!"
 stress_threshold.3401.f.hashishiyah.effect: "$stress_threshold.3401.f.hashishiyah.gain$"
 stress_threshold.3401.g: "A přineste mi tu hlavu, poslouží jako podnožka!"
 stress_threshold.3411.t: "Duševní zhroucení: [Select_CString(ROOT.Char.IsFemale,'Nejsem toho hodna!','Nejsem toho hoden!')]"
 stress_threshold.3411.desc.intro: "Tohle nezvládnu. Prostě to nezvládnu. Už ani chvíli nedokážu být [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L]! Jak vůbec někdo dokáže #EMP zvládat#! tuhle vroucí masu stresu? Ať"
 stress_threshold.3411.desc.generous: " rozdám sebevíc a jsem ke svým poddaným sebeštědřejší, vždycky se najde někdo chudý a někdo, kdo mě nenávidí."
 stress_threshold.3411.desc.diligent: " pracuji sebevíc a strávím sebevíc bezesných nocí mimo postel, problémy panství se jen dál množí a hnisají."
 stress_threshold.3411.desc.patient: " trpělivě naslouchám jednomu problému za druhým, nikdy jako bych nedokázal najít dost dobré řešení."
 stress_threshold.3411.desc.humble: " se snažím sebevíc držet vlastní pýchu stranou od svých povinností, stále mám pocit, jako by mě mé vlastní velikášství požíralo zaživa."
 stress_threshold.3411.desc.shy: " se při pořádání audiencí snažím sebevíc, pohled na davy dvořanů mě pokaždé ochromí strachem."
 stress_threshold.3411.desc.just: " jednám sebespravedlivěji a sebehorlivěji prosazuji vládu zákona, zločin přesto bují v každém koutě mého panství."
 stress_threshold.3411.desc.trusting: " lidem odpouštím sebečastěji, půjčuji jim peníze nebo jim dávám možnost vysvětlit své jednání, vždycky se nakonec stane něco katastrofálního a nepředvídatelného."
 stress_threshold.3411.desc.compassionate: " pořádám sebevíc audiencí a naslouchám prostému lidu, vždycky čekají další stovky lidí, kteří mě chtějí požádat o pomoc."
 stress_threshold.3411.desc.forgiving: "$stress_threshold.3411.desc.trusting$"
 stress_threshold.3411.desc.fallback: " se snažím sebevíc, všechno, co udělám, vypadá jako chyba a každý úspěch se mi v rukou mění v popel."
 stress_threshold.3411.desc.rump: "\n\nJe jasné, že na vládu #EMP nikdy#! nebudu stačit. Něco se #EMP musí#! změnit."
