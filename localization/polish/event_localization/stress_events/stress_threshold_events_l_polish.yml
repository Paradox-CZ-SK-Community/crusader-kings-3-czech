l_polish:
 stress_threshold_cooldown_message: "Pokud budeš za [SCOPE.ScriptValue('stress_threshold_cooldown_duration_in_years')|V0] let stále [Concept('stressed','ve stresu')|E], můžeš utrpět další [Concept('mental_break','duševní zhroucení')|E]"
 stress_threshold.0010.toast: "Přemohl tě stres"
 stress_threshold.0010.text: "Získáváš [Concept('stress_level','úroveň stresu')|E]"
 stress_threshold.0400.toast: "Po překročení limitu [Concept('stress','stresu')|E] se tvá [Concept('stress_level','úroveň stresu')|E] vrací na 3"
 stress_threshold.1001.t: "Duševní zhroucení: Temné myšlenky"
 stress_threshold.1001.desc: "Poslední dobou mě sužují vina a stud. Všechny mé hříchy, nedostatky, selhání... tyhle temné myšlenky mě odvádějí od povinností a nedají mi v noci spát.\n\nMusím udělat něco, co ukončí tohle duševní trápení. Ale co by mi vůbec mohlo pomoci?"
 stress_threshold.1001.contrite.gain: "Musím se přiznat ke všemu, co jsem provedl[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 stress_threshold.1001.contrite.effect: "Už dál nemůžu skrývat svá tajemství!"
 stress_threshold.1001.flagellant.gain: "Šlehnutí biče ze mě vyžene hříchy."
 stress_threshold.1001.flagellant.effect: "Zasloužím si trest! Za všechno!"
 stress_threshold.1001.improvident.gain: "Dobročinnými dary odčiním své hříchy."
 stress_threshold.1001.improvident.effect: "Ostatní potřebují mé zlato víc než já!"
 stress_threshold.1001.drunkard.gain: "Možná pomůže pár sklenek?"
 stress_threshold.1001.drunkard.effect: "Budu pít, dokud tyhle myšlenky nezmizí."
 stress_threshold.1001.hashishiyah.gain: "Trocha hašiše mi uklidní mysl..."
 stress_threshold.1001.hashishiyah.effect: "Pomůže mi poklidný večer s tácem hašišových koláčků."
 stress_threshold.1001.journaller.gain: "Když své starosti sepíšu, budu se moci lépe soustředit."
 stress_threshold.1001.journaller.effect: "Potřebuji strávit noc o samotě ve své pracovně."
 stress_threshold.1001.endure: "Musím být [Select_CString(ROOT.Char.IsFemale,'silná','silný')] a těmto nutkáním odolat!"
 stress_threshold.1011.t: "Duševní zhroucení: Nespoutané touhy"
 stress_threshold.1011.desc: "Poslední dobou mě neustále rozptylují chlípné myšlenky a erotické představy. Při všech strastech každodenního života je až příliš snadné ztratit se ve fantaziích a zapomenout na skutečnost.\n\nTyhle touhy mi očividně zasahují do života. Ale co s nimi mám dělat?"
 stress_threshold.1011.rakish.gain: "Návštěva nevěstince mi přinese úlevu!"
 stress_threshold.1011.rakish.effect: "Dnes v noci nesmí do nevěstince nikdo kromě mě."
 stress_threshold.1011.rakish.tt: "Taková nevázanost s sebou nese jistá rizika..."
 stress_threshold.1011.reclusive.gain: "Musím se uchýlit do ústraní a vyhnout se pokušení!"
 stress_threshold.1011.reclusive.effect: "Jen v samotě najdu klid!"
 stress_threshold.1011.conversion.interfaith: "Možná [new_faith.HighGodName] přinese odpověď, když se na víru podívám jinak?"
 stress_threshold.1011.conversion.intrafaith: "Možná mi [new_faith.HighGodName] dokáže pomoci tam, kde [ROOT.Char.GetFaith.HighGodName] nedokáže?"
 stress_threshold.1011.conversion.judaism: "Stará přikázání mi pomohou zůstat čistý[Select_CString(ROOT.Char.IsFemale,'á','ý')]."
 stress_threshold.1011.conversion.christianity: "Ježíši, zbav mě těchto pokušení!"
 stress_threshold.1011.exercise.gain: "Možná pomůže jiný způsob, jak se vybít..."
 stress_threshold.1001.exercise.effect: "Pořádný trénink ze mě tyhle touhy vyžene."
 stress_threshold.1011.endure: "Zatnu zuby a pokusím se soustředit!"
 stress_threshold.1501.t: "Duševní zhroucení: Na ničem nezáleží"
 stress_threshold.1501.intro.desc: "S každým dalším dnem je těžší najít důvod vůbec vstát z postele."
 stress_threshold.1501.helper.desc: "[scoped_helper.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)|U] na mě čeká, ale vím, že žádná slova mi útěchu nepřinesou."
 stress_threshold.1501.nohelper.desc: "Když už se konečně vyhrabu z postele, nezajímá mě malicherné dění, kterým žije [ROOT.Char.Custom('GetCourt')], a žádné potěšení nenacházím ani ve snídani."
 stress_threshold.1501.faith.desc: "\n\nAni [scoped_ruler.GetFaith.AltPriestTermPlural] mě svými slovy nedokážou oslovit."
 stress_threshold.1501.fallback.desc: "\n\nJednotvárný rytmus tohoto života se stal nesnesitelným."
 stress_threshold.1501.a: "Už [Select_CString(scoped_helper.IsFemale,'ji','ho')] nemůžu vystát!"
 stress_threshold.1501.b: "Myslím, že dnes zase vynechám oběd."
 stress_threshold.1501.c: "Chci jen, aby mě všichni nechali o samotě."
 stress_threshold.1501.d: "Proč jíst, když všechno chutná jako popel?"
 stress_threshold.1501.e: "Nesmím dovolit, aby mě tyhle temné myšlenky rozptylovaly."
 stress_threshold.1501.f: "Být [scoped_ruler.GetFaith.GetAdherentName] nemá žádný smysl."
 stress_threshold.1502.t: "Duševní zhroucení: Zášť"
 stress_threshold.1502.intro.desc: "Proč musím #EMP vždycky#! všechno dělat [Select_CString(ROOT.Char.IsFemale,'sama','sám')]? Jak mám spravovat záležitosti [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip]? [ROOT.Char.Custom('GetCourt')|U] mi práci rozhodně neusnadňuje. Polovina lidí kolem mě nedokáže plnit mé rozkazy a ta druhá jim ani nerozumí!"
 stress_threshold.1502.courtier.desc: "\n\nObzvlášť [scoped_courtier.GetFirstName] se v poslední době nedá vydržet. Sotva snáším neustálé tlachání mého [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scoped_courtier'))]."
 stress_threshold.1502.nocourtier.desc: ""
 stress_threshold.1502.a: "Jsi jen [scoped_courtier.Custom2('InsultAdjective', ROOT.Char)] [scoped_courtier.Custom2('InsultNoun', ROOT.Char)]!"
 stress_threshold.1502.b: "Žalářníku! Přiveď mi dalšího vězně!"
 stress_threshold.1502.c: "„Proč musíte být všichni tak neschopní #EMP idioti#!!?“"
 stress_threshold.1502.d: "[ROOT.Char.Custom('GetDungeon')|U]... tam si pročistím hlavu."
 stress_threshold.1502.e: "Prostě to budu muset vydržet."
 stress_threshold.1502.f: "Možná by pomohlo vést si deník všech svých útrap?"
 stress_threshold.1502.g: "[scoped_ruler.GetFaith.HighGodName] mi pomáhej, potřebuji se napít!"
 stress_threshold.1503.t: "Duševní zhroucení: Prázdnota uvnitř"
 stress_threshold.1503.desc: "Nic, co dělám, mě už nedokáže uspokojit. Přes veškerou snahu nenacházím štěstí ani klid. Jako by mi něco... chybělo.\n\nCo by mohlo zaplnit tuhle rozežírající prázdnotu v mé duši?"
 stress_threshold.1503.a.a: "Možná ještě pár šperků?"
 stress_threshold.1503.a.b: "Potřebuji větší korunu!"
 stress_threshold.1503.a.c: "Mé oblečení mě už nudí..."
 stress_threshold.1503.a.d: "Nového statného hřebce!"
 stress_threshold.1503.a.e: "Nový obraz od slavného umělce!"
 stress_threshold.1503.b: "Tu bolest dokáže zahnat jedině [scoped_ruler.Custom('GetExpensiveMeal')]."
 stress_threshold.1503.e: "Kéž by se s tím dalo něco dělat..."
 stress_threshold.1504.t: "Duševní zhroucení: Nekonečná dřina"
 stress_threshold.1504.desc: "Někdy mám pocit, jako by mi na ramenou spočíval celý svět. Jako [scoped_ruler.GetTitleAsNameNoTooltip] mám povinností bez konce...\n\nNa sebe mi nezbývá skoro ani chvilka."
 stress_threshold.1504.a: "Nemůžou mě lidé prostě na chvíli nechat na pokoji?!"
 stress_threshold.1504.b: "Potřebuji něco, co mi znovu vyrovná tělesné šťávy..."
 stress_threshold.1504.e: "Koneckonců je to má povinnost."
 stress_threshold.1504.f: "Jsem [Select_CString(ROOT.Char.IsFemale,'obklopena','obklopen')] samými hlupáky!"
 stress_threshold.1504.g: "Sepíšu své myšlenky a udělám si v nich pořádek."
 stress_threshold.1504.h: "Osedlejte mi koně, potřebuji se projet!"
 stress_threshold.1504.i: "Potřebuji chvíli ticha na přemýšlení."
 stress_threshold.1601.t: "Duševní zhroucení: Myšlenky v kruhu"
 stress_threshold.1601.desc: "Nemůžu se soustředit, myšlenky mi běhají pořád dokola! [ROOT.Char.Custom('GetCourt')|U] potřebuje můj dohled, musím zkontrolovat vojsko, musím...\n\nJak mám najít klid, když mě takhle zrazují i vlastní myšlenky?!"
 stress_threshold.1601.profligate.gain: "Možná když si koupím něco lesklého, budu se mít na co soustředit..."
 stress_threshold.1601.profligate.effect: "Když si koupím něco pěkného, vždycky se hned lépe soustředím!"
 stress_threshold.1601.inappetetic.gain: "Myšlenky na jídlo mě jen rozptylují."
 stress_threshold.1601.inappetetic.effect: "Vyhladovím ze sebe všechno rozptýlení!"
 stress_threshold.1601.comfort_eater.gain: "Plný žaludek by mi mohl pomoci se soustředit."
 stress_threshold.1601.comfort_eater.effect: "S plným žaludkem se vždycky dokážu lépe soustředit."
 stress_threshold.1601.rakish.gain: "Možná najdu soustředění v náruči vášně..."
 stress_threshold.1601.rakish.effect: "Návštěva nevěstince mi pomůže utřídit myšlenky!"
 stress_threshold.1601.reclusive.gain: "Možná by mi samota pomohla utřídit myšlenky..."
 stress_threshold.1601.reclusive.effect: "Když jsem o samotě, vždycky se dokážu lépe soustředit..."
 stress_threshold.1601.irritable.gain: "Možná bych dokázal přemýšlet, kdyby všichni konečně #EMP zmlkli#!!"
 stress_threshold.1601.irritable.effect: "Prostě všem řeknu, ať už #EMP zmlknou#!!"
 stress_threshold.1601.confider.gain: "„[friend.GetFirstNameNoTooltip], pomoz mi utřídit si myšlenky!“"
 stress_threshold.1601.confider.effect: "„[friend.GetFirstNameNoTooltip], prosím, vyslechni mě jako vždycky!“"
 stress_threshold.1601.athletic.gain: "Říká se, že ve zdravém těle je zdravý duch..."
 stress_threshold.1601.athletic.effect: "Nikdy nemám tak klidnou mysl jako po pořádném cvičení!"
 stress_threshold.1601.contrite.gain: "Vyčistím si hlavu tím, že se přiznám ke svým proviněním."
 stress_threshold.1601.contrite.effect: "Musím se přiznat ke svým proviněním! Pak snad budu mít jasnější mysl."
 stress_threshold.1601.flagellant.gain: "Bolest prý zostřuje mysl..."
 stress_threshold.1601.flagellant.effect: "Nic nezaostří myšlenky tak dobře jako bolest."
 stress_threshold.1601.improvident.gain: "Možná mi jasný čin dobročinnosti osvobodí mysl?"
 stress_threshold.1601.improvident.effect: "Dar na dobrou věc mi vždycky uklidní mysl."
 stress_threshold.1601.drunkard.gain: "Možná se po něčem k pití budu lépe soustředit..."
 stress_threshold.1601.drunkard.effect: "Po něčem k pití se vždycky lépe soustředím."
 stress_threshold.1601.hashishiyah.gain: "Trocha hašiše mi snad uklidní mysl..."
 stress_threshold.1601.hashishiyah.effect: "Nikdy nemám tak klidnou mysl jako po večeru s hašišovými koláčky."
 stress_threshold.1601.journaller.gain: "Když si své myšlenky zapíšu, snad se mi vyjasní..."
 stress_threshold.1601.journaller.effect: "Když si své myšlenky zapíšu, vždycky se mi vyjasní!"
 stress_threshold.1601.burdened.gain: "Možná pomůže snít o lepším místě."
 stress_threshold.1601.burdened.effect: "Snění o lepších věcech vždycky pomůže!"
 stress_threshold.1601.endure_no_option: "M-musím vydržet. Nemůžu s tím nic dělat..."
 stress_threshold.1602.t: "Duševní zhroucení: Vír emocí"
 stress_threshold.1602.desc: "S každým dalším dnem jsou mé emoce méně a méně stabilní. V jediném okamžiku dokáže bezbřehá radost vystřídat nejhlubší žal a já i [ROOT.Char.Custom('GetCourt')|l] už toho máme dost.\n\nKéž bych jen dokázal tenhle vnitřní vír nějak zkrotit!"
 stress_threshold.1602.profligate.gain: "Možná mě něco nového, něco třpytivého, zase srovná."
 stress_threshold.1602.profligate.effect: "Něco nového a třpytivého mi přinese jen čistou radost!"
 stress_threshold.1602.inappetetic.gain: "Když nebudu jíst, nezbude mi energie ani na emoce..."
 stress_threshold.1602.inappetetic.effect: "Vyhladovím ze sebe všechny emoce."
 stress_threshold.1602.comfort_eater.gain: "Alespoň jídlo mi přináší jednoznačný pocit útěchy."
 stress_threshold.1602.comfort_eater.effect: "Když jím, cítím jen útěchu."
 stress_threshold.1602.rakish.gain: "Silná touha by mohla ostatní pocity udržet na uzdě..."
 stress_threshold.1602.rakish.effect: "Nic mě nesrovná tak jako silná touha a chtíč!"
 stress_threshold.1602.reclusive.gain: "Možná by mě samota dokázala uklidnit..."
 stress_threshold.1602.reclusive.effect: "O samotě mám vždycky v hlavě jasněji."
 stress_threshold.1602.irritable.gain: "Všechno by bylo snazší, kdyby mi lidé konečně dali #EMP pokoj#!!"
 stress_threshold.1602.irritable.effect: "Řeknu jim, co si myslím o tom jejich #EMP věčném našlapování kolem mě#!!"
 stress_threshold.1602.confider.gain: "Možná pomůže promluvit si o tom s [friend.GetFirstNameNoTooltip]."
 stress_threshold.1602.confider.effect: "Rozhovor s [friend.GetFirstNameNoTooltip] obvykle pomůže!"
 stress_threshold.1602.athletic.gain: "Budu běžet, dokud nebudu cítit nic než uspokojení."
 stress_threshold.1602.athletic.effect: "Běh mé emoce vždycky uklidní."
 stress_threshold.1602.contrite.gain: "Možná se uklidním, když se přiznám ke svým proviněním."
 stress_threshold.1602.contrite.effect: "Po přiznání se vždycky cítím vyrovnaněji!"
 stress_threshold.1602.flagellant.gain: "Možná ze sebe dokážu vyhnat všechny pocity kromě bolesti..."
 stress_threshold.1602.flagellant.effect: "Budu cítit jen bolest. Nic víc."
 stress_threshold.1602.improvident.gain: "Vděk za dobročinnost možná přehluší všechno ostatní."
 stress_threshold.1602.improvident.effect: "Když něco daruji, vždycky se zase trochu srovnám..."
 stress_threshold.1602.journaller.gain: "Budu psát, dokud se nebudu soustředit jen na jedinou věc."
 stress_threshold.1602.journaller.effect: "Psaní o vlastních pocitech vždycky zabere!"
 stress_threshold.1602.drunkard.gain: "S dostatkem pití všechny emoce vyprchají..."
 stress_threshold.1602.drunkard.effect: "Pitím dokážu své emoce vždycky nechat za sebou!"
 stress_threshold.1602.hashishiyah.gain: "Možná mi trocha hašiše přinese klid."
 stress_threshold.1602.hashishiyah.effect: "Hašiš mě vždycky uklidní."
 stress_threshold.1602.burdened.gain: "Kdybych tak dokázal myslet na něco jiného. Na #EMP cokoli#!."
 stress_threshold.1602.burdened.effect: "Když nechám myšlenky volně bloudit, úzkost poleví."
 stress_threshold.2001.t: "Duševní zhroucení: Nevděk"
 stress_threshold.2001.desc: "Nevděční bídáci! Copak nevědí, co všechno pro ně obětuji?\n\n[ROOT.Char.Custom('GetRealmOrDomicile')|U] je důvod, proč se každý den bez konce dřu, a přesto si všichni jen stěžují a chtějí víc!\n\nA teď se [victim.GetFirstName] dokonce opovažuje zpochybňovat mé rozkazy?!"
 stress_threshold.2001.arbitrary.gain: "Jsem [ROOT.Char.GetTitleAsNameNoTooltip], mé slovo je zákon!"
 stress_threshold.2001.arbitrary.effect: "Já rozhoduji, jak to tady bude fungovat!"
 stress_threshold.2001.imprison_victim: "Uvidíme, kolik vděčnosti zbude [victim.GetFirstNameNoTooltip], až se zavřou dveře [ROOT.Char.Custom('GetDungeon')]!"
 stress_threshold.2001.endure: "No tak, trochu trpělivosti..."
 stress_threshold.2101.t: "Duševní zhroucení: Odcizení"
 stress_threshold.2101.desc: "Někdy mám pocit, že [ROOT.Char.Custom('GetCourt')|l] je místo, kam vůbec nepatřím.\n\nNemůžu si nevšímat podivných pohledů, které po mně vrhají [ROOT.Char.Custom('GetCourtierPlural')|l], ani napětí, které zavládne pokaždé, když někam vstoupím a [ROOT.Char.Custom('GetRoom')|l] náhle ztichne... Co se stalo s mým životem? Proč mezi vlastními nejsem vítán?"
 stress_threshold.2101.witch.gain: "Patřím mezi zavržené stejně jako [ROOT.Char.GetFaith.WitchGodName]."
 stress_threshold.2101.witch.effect: "Alespoň [ROOT.Char.GetFaith.WitchGodName] mi rozumí."
 stress_threshold.2101.drunkard.effect: "Možná je mým jediným opravdovým společníkem [ROOT.Char.Custom('RegionalAlcoholicDrink')]."
 stress_threshold.2101.hashishiyah.effect: "Alespoň tenhle hašišový koláček mě nebude soudit."
 stress_threshold.2101.endure: "Možná se to všechno odehrává jen v mé hlavě..."
 stress_threshold.2201.t: "Duševní zhroucení: Vroucí hněv"
 stress_threshold.2201.desc.insult_adventurer: "„[character_to_yell_at.GetFirstName], ať už jsi [ROOT.Char.Custom('GetCourtier')|l] nebo ne, pořád jsi [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)] [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)]!“\n\n"
 stress_threshold.2201.desc.insult: "„Můžeš být [character_to_yell_at.GetTitleAsName], [character_to_yell_at.GetFirstName], ale pořád jsi [character_to_yell_at.Custom2('InsultAdjectiveArticle', ROOT.Char)] [character_to_yell_at.Custom2('InsultNoun', ROOT.Char)]!“\n\n"
 stress_threshold.2201.desc: "Jakmile spatřím výraz ve tváři [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('character_to_yell_at'))], zaváhám, ale... pořád cítím takový #EMP vztek#! a každý si snad o můj hněv přímo koleduje...\n\n"
 stress_threshold.2201.desc_liege: "„Co to do tebe vjelo, [ROOT.Char.GetTitledFirstNameNoTooltip]?! Tohle chování je nepřijatelné."
 stress_threshold.2201.desc_vassal: "„Můj lenní pane, co má tohle chování znamenat?!"
 stress_threshold.2201.desc.calm: " A přitom tě obvykle nic nerozhází...“"
 stress_threshold.2201.desc.ending: "“"
 stress_threshold.2201.a: "Moje slova platí!"
 stress_threshold.2201.save: "Tak mi řekni, jak bys na takový útok odpověděl?"
 stress_threshold.2201.save_tt: "Předstírám, že [Select_CString(character_to_yell_at.IsFemale,'ji','ho')] jen zkouším"
 stress_threshold.2201.liege: "Omlouvám se, můj lenní pane. Příště se ovládnu lépe."
 stress_threshold.2201.c: "Omlouvám se. Příště se ovládnu lépe."
 stress_threshold.2202.t: "Vroucí hněv"
 stress_threshold.2202.desc.liege: "Naprosto mě zaskočil nevyprovokovaný výbuch hněvu [Select_CString(stress_character.IsFemale,'mé lenní paní','mého lenního pána')], [stress_character.GetTitledFirstName]."
 stress_threshold.2202.desc.vassal: "Naprosto mě zaskočil nevyprovokovaný výbuch hněvu [Select_CString(stress_character.IsFemale,'mé vazalky','mého vazala')], [stress_character.GetTitledFirstName]."
 stress_threshold.2202.desc.other_relationship: "Naprosto mě zaskočil ten nevyprovokovaný výbuch hněvu. Vždyť [stress_character.GetTitledFirstName] je [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('stress_character'))]!"
 stress_threshold.2202.desc: "V poslední době je zjevně pod velkým stresem, ale"
 stress_threshold.2202.desc.rival: " když má své chování vysvětlit, jen přidá další urážky."
 stress_threshold.2202.desc.other: " takové chování..."
 stress_threshold.2202.a: "Vrátím ti všechno i s úroky, ty [stress_character.Custom2('InsultNoun', ROOT.Char)]!"
 stress_threshold.2202.b: "Když s tím bojuje i [stress_character.GetTitledFirstName]... Je to vlastně uklidňující."
 stress_threshold.3001.t: "Duševní zhroucení: Hlasy"
 stress_threshold.3001.desc: "[ROOT.Char.Custom('GetCourt')|U] je plný lží a klamu, ale našel se někdo, kdo tvrdí, že mi řekne pravdu.\n\nŽijí se mnou. V mé hlavě.\n\nŘíkají, že znají pravdu...\n\nOpravdu ji znají?"
 stress_threshold.3001.possessed.gain: "Ano, jen hlasy znají skutečnou pravdu!"
 stress_threshold.3001.possessed.effect: "Ano, ano, ony znají pravdu, tu skutečnou pravdu..."
 stress_threshold.3001.naked_run: "Musím ze sebe ty ďábly vyhnat nahým během!"
 stress_threshold.3001.endure: "Prostě... je neposlouchej..."
 stress_threshold.3101.t: "Duševní zhroucení: Něco je špatně"
 stress_threshold.3101.desc: "Všechno je... špatně. [ROOT.Char.Custom('GetRoom')|U] je špatně. Země je špatně. Dokonce i samotný vzduch je špatně!\n\nProč je všechno špatně? Kdo to udělal?\n\nKdo způsobil, že je #EMP všechno špatně?!#!"
 stress_threshold.3101.kill_victim: "Za všechno může [victim.GetFirstNameNoTooltip], tím jsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')]!"
 stress_threshold.3101.lunatic.gain: "[ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')|U]... ti proradní malí parchanti za to můžou!"
 stress_threshold.3101.lunatic.effect: "Ti proradní [ROOT.Char.Custom('GetRandomRegionalSmallGamePlural')] jsou zpátky!"
 stress_threshold.3101.lunatic.tt: "#F Přineste mi pochodeň!#!"
 stress_threshold.3201.t: "Duševní zhroucení: Přetížení"
 stress_threshold.3201.desc: "Je toho příliš. Proč se vůbec ještě snažím?\n\nJsme uprostřed večeře, když se všechno najednou... sesype. Musím projít finance, kterými žije [ROOT.Char.Custom('GetCourt')|l], musím urovnat tucet malicherných sporů, musím...\n\n„Je všechno v pořádku, [ROOT.Char.GetTitleAsNameNoTooltip]?“ opatrně se ozve [vassal.GetTitledFirstName]. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))|U] si o mě očividně dělá starosti."
 stress_threshold.3201.depressed.gain: "K čemu to všechno je? Vzdávám to."
 stress_threshold.3201.depressed.effect: "Stejně je to všechno k ničemu..."
 stress_threshold.3201.help: "„[vassal.GetFirstNameNoTooltip]... Prosím, pomoz mi.“"
 stress_threshold.3201.wrathful.gain: "„Ne, ty [vassal.Custom2('InsultAdjective', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)], #EMP nejsem#! v pořádku!“"
 stress_threshold.3201.wrathful.effect: "„Já ti ukážu, kdo je tady #EMP v pořádku#!, ty [vassal.Custom2('InsultAdjective', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)]!“"
 stress_threshold.3201.wrathful.effect.success: "Zbiješ [vassal.GetTitledFirstName]"
 stress_threshold.3201.wrathful.effect.failure: "[vassal.GetTitledFirstName] se ubrání"
 stress_threshold.3301.t: "Duševní zhroucení: Bolest u srdce"
 stress_threshold.3301.desc_man: "První známkou toho, že něco není v pořádku, je ostrá bolest na hrudi. Zavrávorám a hledám oporu, zatímco mi bolest vystřeluje do levé paže. Točí se mi hlava...\n\nJá... já na tohle nemám čas! Mám přece tolik práce!\n\nPokusím se udělat krok, ale zhroutím se k zemi. Otevřu ústa a chci zavolat o pomoc, vyjde ze mě však jen přidušené zakňučení.\n\nBolest na hrudi sílí a sílí a... zrak mi pohltí tma a #EMP cítím#!, jak mi srdce vynechává."
 stress_threshold.3301.desc_woman: "První známkou toho, že něco není v pořádku, je pálení žáhy, které nechce přestat. Zkouším všechny možné prostředky, měkkou vlnu na břicho, poklidné procházky...\n\nNajednou se nedokážu pořádně nadechnout a zavrávorám ve snaze něčeho se zachytit. Co... co se to děje?! Pokusím se zavolat o pomoc, ale zmůžu se jen na bolestivé zalapání po dechu.\n\n#EMP Bolí to#!! Ostrá bolest se mi od lopatek šíří do levé paže a jak sílí, klesám k zemi.\n\nVzápětí přichází tma."
 stress_threshold.3301.a: "#EMP #DIE1 Ugh...!#!#!"
