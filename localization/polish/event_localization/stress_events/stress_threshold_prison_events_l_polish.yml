l_polish:
 stress_threshold_prison.1001.t: "Duševní zhroucení: Strasti vězení"
 stress_threshold_prison.1001.desc: "[Select_CString(ROOT.Char.IsFemale,'Být uvězněná','Být uvězněný')], odříznutý od všeho, co bývalo v životě dobré a příjemné..."
 stress_threshold_prison.1001.desc.normal: " je těžké nepropadnout zoufalství."
 stress_threshold_prison.1001.desc.cynical: "\n\nJak může [ROOT.Char.GetFaith.HighGodName] dopustit, aby takové místo plné zoufalství vůbec existovalo? Jak to může dopustit jakýkoli bůh?"
 stress_threshold_prison.1001.desc.depressed: " dřív mě to trápilo, ale kupodivu už ne."
 stress_threshold_prison.1001.inappetetic.gain: "Tyhle splašky už do sebe nedostanu."
 stress_threshold_prison.1001.inappetetic.effect: "Jídlo zůstává na talíři netknuté."
 stress_threshold_prison.1001.cynical.gain: "Zdá se, že [ROOT.Char.GetFaith.HighGodName] už o mě nestojí..."
 stress_threshold_prison.1001.cynical.effect: "To jen dokazuje, že [ROOT.Char.GetFaith.HighGodName] neexistuje..."
 stress_threshold_prison.1001.endure: "Proč mě ještě nepustili?!"
 stress_threshold_prison.1001.depressed.gain: "Jak může mít takový život vůbec cenu?"
 stress_threshold_prison.1001.depressed.effect: "Žádnou bolest necítím. Uvnitř už jsem dávno [Select_CString(ROOT.Char.IsFemale,'mrtvá','mrtvý')]."
 stress_threshold_prison.1011.t: "Duševní zhroucení: Mučivý hlad"
 stress_threshold_prison.1011.desc: "Už několik dní v sobě neudržím vůbec nic. Úzkost mi bere i sílu pozřít suchou kaši, kterou mi nosí stráže.\n\nKaždým dnem slábnu, ale co člověk zmůže proti vlastnímu tělu?"
 stress_threshold_prison.1011.a: "Hladovění je lepší než tyhle splašky."
 stress_threshold_prison.1011.b: "Tady dole #EMP jsou#! i jiné zdroje potravy..."
 stress_threshold_prison.1011.c: "Zvládnu to. Jednu lžíci po druhé!"
 stress_threshold_prison.1012.t: "Duševní zhroucení: Čas krmení"
 stress_threshold_prison.1012.desc: "Myslí si, že tu není co jíst, že mě vyhladoví a zlomí.\n\nNetuší, že se stravuji lépe než kdy dřív...\n\nTohle je hodovní síň plná lahodného jídla a burácejícího veselí."
 stress_threshold_prison.1012.a: "Teplé, šťavnaté a plné života."
 stress_threshold_prison.1021.t: "Duševní zhroucení: Kruté hry"
 stress_threshold_prison.1021.desc: "V téhle špinavé díře je pramálo zábavy. [bg_override_char.Custom('GetDungeon')|U] nabízí jen louži zatuchlé vody, odporné vědro a hromádku kamínků...\n\nTemná silueta [fellow_prisoner.GetTitledFirstName] v protějším koutě najednou vypadá jako znamenitý terč."
 stress_threshold_prison.1021.a: "Deset bodů, když to dostane [fellow_prisoner.GetTitledFirstName] do hlavy!"
 stress_threshold_prison.1021.b: "Bolest druhých mi nic nedává. Ale ta moje..."
 stress_threshold_prison.1021.c: "Jak mě vůbec mohlo něco tak odporného napadnout?!"
 stress_threshold_prison.1031.t: "Duševní zhroucení: Pocit moci"
 stress_threshold_prison.1031.desc: "Zavřeli mě sem a čekají, že zeslábnu a zkrotnu. Ha!\n\nTady ve tmě sbírám sílu a v duchu trhám své nepřátele úd po údu! Znovu a znovu. Každý den znovu povstanou a každý den je rozdrtím jako havěť, kterou jsou!\n\nA největší utrpení čeká [jailer.GetTitledFirstName]..."
 stress_threshold_prison.1031.a: "Až se odsud dostanu... všichni mi za to #EMP zaplatí#!!"
 stress_threshold_prison.1031.b: "Proč čekat? V mé mysli jsou mi vydáni na milost..."
 stress_threshold_prison.1031.c: "Ne... tohle je špatně. Takhle se chovat nechci."
 stress_threshold_prison.1041.t: "Duševní zhroucení: Zapomenuté potřeby"
 stress_threshold_prison.1041.desc: "Každý den probíhá stejně. Ráno přejde v den a den v noc...\n\nVzduch je prosycen odporným zápachem kazícího se jídla. Kdy se ta hromada talířů tak rozrostla? Kolik jídel už jsem [Select_CString(ROOT.Char.IsFemale,'vynechala','vynechal')]? Udržet si alespoň zdání normálního života je čím dál těžší..."
 stress_threshold_prison.1041.depressed: "A ještě těžší je vzpomenout si, proč bych se vůbec [Select_CString(ROOT.Char.IsFemale,'měla','měl')] snažit."
 stress_threshold_prison.1041.inappetetic: "K čemu je jídlo bez svobody?"
 stress_threshold_prison.1041.flagellant: "Bolest mi dá něco, na co se můžu soustředit."
 stress_threshold_prison.1041.journaller.gain: "Možná by psaní dokázalo narušit tu jednotvárnost..."
 stress_threshold_prison.1041.journaller.effect: "Aspoň že mám svůj deník."
 stress_threshold_prison.1041.athletic: "Možná jsem [Select_CString(ROOT.Char.IsFemale,'uvězněná','uvězněný')], ale pořád můžu cvičit..."
 stress_threshold_prison.1041.optout: "Jednou se odsud dostanu... že ano?"
 stress_threshold_prison.2001.t: "Duševní zhroucení: Vyškrábat se ven"
 stress_threshold_prison.2001.desc: "Proč mě #EMP nepustí ven#!?! [bg_override_char.Custom('GetDungeon')|U]... jak dlouho už musím snášet ten chlad a #EMP stísněnost#!?\n\nSedím zhrouceně u mříží a tisknu si zkrvavené ruce k hrudi. Když budu škrábat dost dlouho a dost urputně, moje pouta přece musí povolit, ne?\n\n...Ne?"
 stress_threshold_prison.2001.a: "Musím to zkoušet dál!"
 stress_threshold_prison.2001.b: "Ach, kašlu na to. Proč se vůbec snažit o... cokoli?"
 stress_threshold_prison.2011.t: "[ROOT.Char.Custom('prison_pet')|U] a já"
 stress_threshold_prison.2011.desc_rat: "Už mnoho dní mě navštěvuje stále tatáž krysa. Dívá se na mě se soucitem a důvěrou. Takový soucit a důvěru jsem už dlouho [Select_CString(ROOT.Char.IsFemale,'nezažila','nezažil')]."
 stress_threshold_prison.2011.desc_stone: "Stálá přítomnost po mém boku, jediná jistota v životě obráceném vzhůru nohama. Můj věrný kámen je můj společník a přítel, vždycky tu pro mě, když ho potřebuji."
 stress_threshold_prison.2011.desc_spoon: "Jedna z mála jistot mého zdejšího života, jediný zdroj útěchy a společnosti... Má lžíce je tu vždycky, když ji potřebuji, a nikdy mě nesoudí, ani v těch nejtemnějších dnech. [bg_override_char.Custom('GetDungeon')|U] mi toho mnoho jiného nenabízí."
 stress_threshold_prison.2011.desc_cockroach: "A je tu zase. Šváb sedí ve svém temném koutě. Je to můj společník, můj věrný přítel, můj #EMP syn#!.\n\nBdí nade mnou a dělá mi v tomhle mizerném místě společnost."
 stress_threshold_prison.2011.desc_end: "\n\nK žádné jiné bytosti necítím tak silné pouto, takovou oddanost a porozumění."
 stress_threshold_prison.2011.a: "Pojď sem, [ROOT.Char.Custom('prison_pet')], ať tě obejmu."
 stress_threshold_prison.2021.t: "Duševní zhroucení: V nejtemnějších koutech"
 stress_threshold_prison.2021.desc: "Stráže tvrdí, že jsem už celé dny o samotě, ale já vím své. #EMP Cítím#! jejich pohledy. Pozorují mě, zkoumají mě a hledají mé obavy a slabiny...\n\nKaždý zvuk prozrazuje jejich přítomnost, každý stín jejich hrozbu."
 stress_threshold_prison.2021.a: "Musím být neustále ve střehu!"
 stress_threshold_prison.2021.b: "Musím se někam schovat... kamkoli!"
 stress_threshold_prison.2021.c: "Možná bych s nimi [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] promluvit?"
 stress_threshold_prison.3001.t: "Duševní zhroucení: Přítel v nouzi"
 stress_threshold_prison.3001.desc: "Nikdo mě nevaroval, jaká je tu #EMP příšerná nuda#!. A to [bg_override_char.Custom('GetDungeonPlural')|l] mají působit děsivě! Ještě že mi dělá společnost [fictional_friend.Custom('DuchessDuke')|U] [fictional_friend.Custom('RandomExampleName')].\n\n[Select_CString(fictional_friend.IsFemale,'Dobrá','Dobrý')] [fictional_friend.Custom('DuchessDuke')] vtipkuje jako nikdo jiný a vždycky mi zvedne náladu. A jak je [Select_CString(fictional_friend.IsFemale,'moudrá','moudrý')]!\n\nCože, [fictional_friend.Custom('DuchessDuke')|U]? #EMP Ha!#! Ten se povedl!"
 stress_threshold_prison.3001.a: "Pojď sem, ty rošťáku!"
 stress_threshold_prison.3011.t: "Duševní zhroucení: Skutečná rodina"
 stress_threshold_prison.3011.desc: "Potlačím slzu. [Select_CString(ROOT.Char.IsFemale,'Byla jsem tak beznadějně #EMP ztracená#!','Byl jsem tak beznadějně #EMP ztracený#!')] Ale teď už je všechno lepší! Má rodina je tu se mnou a chrání mě.\n\nMatka s otcem mě pevně objímají."
 stress_threshold_prison.3011.sibling: "[Select_CString(sibling.IsFemale,'Má','Můj')] [sibling.Custom('SisterBrother')], [sibling.GetFirstName], na mě dohlíží."
 stress_threshold_prison.3011.sibling_multiple: "[Select_CString(sibling.IsFemale,'Má','Můj')] [sibling.Custom('SisterBrother')], [sibling.GetFirstName], na mě dohlíží. Všichni mí sourozenci jsou tu se mnou."
 stress_threshold_prison.3011.child: "[Select_CString(child.IsFemale,'Má dcera','Můj syn')], [child.GetFirstName], mě drží za ruku a udržuje v mých očích jiskru."
 stress_threshold_prison.3011.child_multiple: "Mé děti, všechny mé děti, se kolem mě shromáždily a udržují v mých očích jiskru."
 stress_threshold_prison.3011.fallback: "Všichni se kolem mě shromáždili a udržují v mých očích jiskru."
 stress_threshold_prison.3011.a: "Jak jsem si vůbec [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] myslet, že mě všichni opustili?"
 stress_threshold_prison.3999.t: "Duševní zhroucení: Svoboda"
 stress_threshold_prison.3999.desc: "Už to déle nevydržím. Mysl mám jasnější než za celé poslední týdny a vím, že jsem [Select_CString(ROOT.Char.IsFemale,'zlomená','zlomený')] po těle i na duchu.\n\nCelé tělo je jedna velká bolest, bolí i samotné dýchání. [bg_override_char.Custom('GetDungeon')|U] už nepůsobí tísnivě. Naopak mě konejší. Vítá mě.\n\nV hloubi duše vím, že tohle jsou mé poslední nádechy."
 stress_threshold_prison.3999.a: "[ROOT.Char.GetFaith.PositiveAfterLife|U], přijmi mě."
