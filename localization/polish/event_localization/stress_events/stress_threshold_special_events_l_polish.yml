l_polish:
 stress_threshold_special.1001.t: "Duševní zhroucení: Příval žalu"
 stress_threshold_special.1001.desc_intro_standard: "Život nikdy nebyl snadný, ale tahle ztráta mě srazila na kolena. Náš vztah měl své jméno: [ROOT.Char.Custom2('RelationToMeShort', deceased_character)]. A [deceased_character.GetFirstName] už tu není.\n\n"
 stress_threshold_special.1001.desc_intro_lover: "Z mého života zmizelo světlo.\n\n„[deceased_character.Custom('LoverPetName')]“... tak jsem [deceased_character.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'oslovovala','oslovoval')]. Teď je pryč a život je najednou mnohem pochmurnější."
 stress_threshold_special.1001.desc_intro_friend: "[Select_CString(deceased_character.IsFemale,'Má přítelkyně','Můj přítel')] [deceased_character.GetFirstName] tu pro mě vždycky [Select_CString(deceased_character.IsFemale,'byla','byl')]. Věděl jsem, že ta smrt nebude snadná, ale nikdy by mě nenapadlo, že to bude až takhle těžké."
 stress_threshold_special.1001.desc_spouse: "[deceased_character.GetFirstName] [Select_CString(deceased_character.IsFemale,'stála','stál')] po mém boku životem a [Select_CString(deceased_character.IsFemale,'pomáhala','pomáhal')] mi překonat tolik zkoušek a strastí. I když jsme se někdy neshodli, představa života bez [Select_CString(deceased_character.IsFemale,'ní','něj')] je prostě... děsivá.\n\nJak to bez [Select_CString(deceased_character.IsFemale,'ní','něj')] vůbec zvládnu?"
 stress_threshold_special.1001.desc_child_toddler: "Tak mladé, tak plné života a možností. A teď naprosto nehybné...\n\nNehybné navždy. Už se nikdy nezasměje ani nerozpláče."
 stress_threshold_special.1001.desc_child_older: "Pořád mám před očima dobu, kdy [deceased_character.GetFirstName] [Select_CString(deceased_character.IsFemale,'byla','byl')] ještě miminko. Tak maličké, tak křehké. A přesto [Select_CString(deceased_character.IsFemale,'přežila','přežil')], [Select_CString(deceased_character.IsFemale,'rostla','rostl')], [Select_CString(deceased_character.IsFemale,'dospívala','dospíval')] až do... teď. A pak se všechno najednou zastavilo.\n\nTolik jsem [Select_CString(ROOT.Char.IsFemale,'doufala','doufal')], co všechno ještě [deceased_character.GetFirstName] v životě dokáže... Tolik věcí jsem chtěl[Select_CString(ROOT.Char.IsFemale,'a','')] vidět, ale teď už se nikdy nestanou."
 stress_threshold_special.1001.desc_parent: "[ROOT.Char.Custom2('RelationToMe', deceased_character)|U]. To slovo mi teď zní v hlavě pořád dokola. Věděl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem, že smrt [deceased_character.GetFirstName] jednou přijde, ale přesto jsem na ni nebyl[Select_CString(ROOT.Char.IsFemale,'a','')] připraven[Select_CString(ROOT.Char.IsFemale,'á','ý')].\n\nUž nikdy nemůžu přijít za [deceased_character.GetFirstName] pro útěchu nebo radu.\n\nZůstalo jen prázdné místo... Dá se vůbec někdy zaplnit?"
 stress_threshold_special.1001.desc_lover: "Každý den je boj a bez [deceased_character.GetFirstName] v něm jen těžko hledám smysl. Nemůžu přestat myslet na všechny nádherné chvíle, které jsme spolu prožili...\n\nA žádné další už nikdy nepřijdou."
 stress_threshold_special.1001.desc_friend: "\n\n[deceased_character.GetFirstName] mě vždycky [Select_CString(deceased_character.IsFemale,'dokázala','dokázal')] rozveselit nebo vytáhnout z nesnází. Při všech problémech, které mě poslední dobou sužují, tu tahle nepřítomnost bolí ještě víc."
 stress_threshold_special.1001.depressed: "Má vůbec život cenu, když tu [deceased_character.GetFirstName] není?"
 stress_threshold_special.1001.drunkard: "Jedna sklenka, protože tu [deceased_character.GetFirstName] už není... a další, abych zapomněl[Select_CString(ROOT.Char.IsFemale,'a','')]."
 stress_threshold_special.1001.hashishiyah: "Ta bolest je příliš čerstvá. Potřebuji něco, co ji otupí..."
 stress_threshold_special.1001.flagellant: "Je to i moje vina. Zasloužím si za to trpět..."
 stress_threshold_special.1001.inappetetic.trait: "K čemu je jídlo, když mám prázdno v srdci?"
 stress_threshold_special.1001.inappetetic.effect: "Teď mám stejně prázdné srdce jako žaludek."
 stress_threshold_special.1001.journaller: "Možná mi pomůže, když své pocity sepíšu?"
 stress_threshold_special.1001.confider.shared: "Je to těžké, ale alespoň [confidant.GetFirstNameNoTooltip] a já můžeme svůj žal překonat společně."
 stress_threshold_special.1001.confider.assist: "Je to těžké, ale [confidant.GetFirstNameNoTooltip] mi může pomoci se přes to přenést."
 stress_threshold_special.1001.frozen_grief: "Musím jít dál. [deceased_character.GetFirstName] by si to [Select_CString(deceased_character.IsFemale,'přála','přál')]."
 stress_threshold_special.1001.lunatic: "Ale [deceased_character.GetFirstName] přece není pryč! Je přímo tady se mnou..."
 stress_threshold_special.1001.lunatic.flavor: "...a [deceased_character.GetFirstName] se mnou zůstane navždy!"
 stress_threshold_special.2001.t: "Duševní zhroucení: Potlačené touhy"
 stress_threshold_special.2001.beginning: "Ach, jak mi chybí dny plné neřesti a chtíče. Už je to tak dlouho, co se mnou někdo sdílel lože... a samota v posteli bolí.\n\n"
 stress_threshold_special.2001.consort: "Vím, že [ROOT.Char.Custom2('RelationToMe', target)] [target.GetFirstName] by mě [Select_CString(target.IsFemale,'znovu přivítala','znovu přivítal')] ve své posteli s otevřenou náručí. Chce mě, to vím... a já po tom toužím stejně!"
 stress_threshold_special.2001.noble: "Už jsem si [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')], jak se na mě [target.Custom2('MyCharacterIntroduction', ROOT.Char)] dívá. Chce mě, to vím... a já po tom toužím stejně!"
 stress_threshold_special.2001.servant: "[Select_CString(target.IsFemale,'Je to jen obyčejná služka','Je to jen obyčejný sluha')], ale všímám si, jak se na mě [target.GetFirstName] dívá. Chce mě, to vím... a já po tom toužím stejně!"
 stress_threshold_special.2001.ending: "\n\nKdyž jsem skládal[Select_CString(ROOT.Char.IsFemale,'a','')] slib, myslel[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si, že celibát zvládnu, ale teď... už si nejsem tak jist[Select_CString(ROOT.Char.IsFemale,'á','ý')]."
 stress_threshold_special.2001.a: "K čertu s tím. Už nedokážu odolávat, #EMP potřebuji#! to!"
 stress_threshold_special.2001.a.tt: "Přijdeš o [Concept('perk','talent')|E] [GetPerk( 'restraint_perk' ).GetName( GetPlayer)|V]"
 stress_threshold_special.2001.b: "Ne... Tohle už nejsem já. Musím tyhle touhy zkrotit!"
