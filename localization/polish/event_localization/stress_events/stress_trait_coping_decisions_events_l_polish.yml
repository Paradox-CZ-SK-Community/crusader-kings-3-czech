l_polish:
 stress_trait_coping_decisions.1001.t: "Zvládání stresu: Do dna!"
 stress_trait_coping_decisions.1001.desc: "Další pohár a napětí v ramenou zase o něco povolí. #EMP Takhle#! mám trávit čas. Být střízlivý znamená trpět."
 stress_trait_coping_decisions.1001.a: "Já... #EMP *škyt*#! Už je mi líp!"
 stress_trait_coping_decisions.1002.t: "Zvládání stresu: Společnost u sklenky!"
 stress_trait_coping_decisions.1002.desc: "„[ROOT.Char.GetFirstNameNoTooltip]! Ahoj!“\n\nNajednou si vedle mě s pohárem v ruce přisedne [fellow_drunkard.GetTitledFirstName]. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fellow_drunkard'))|U] sem zjevně také [Select_CString(fellow_drunkard.IsFemale,'zamířila','zamířil')] za trochou odpočinku a zbytek noci strávíme společným popíjením.\n\nTak uvolněně jsem se necítil[Select_CString(ROOT.Char.IsFemale,'a','')] už celé #EMP měsíce!#!"
 stress_trait_coping_decisions.1002.a: "Napij se, příteli!"
 stress_trait_coping_decisions.1003.t: "Společnost u sklenky!"
 stress_trait_coping_decisions.1003.desc: "Sedím v krčmě nad pitím o samotě, když najednou spatřím, jak si naproti mně sedá [original_drunkard.GetTitledFirstName]. [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('original_drunkard'))|U]!\n\nHned se přesunu blíž a zbytek noci strávíme společným popíjením. [original_drunkard.GetTitledFirstName] se opravdu umí bavit!"
 stress_trait_coping_decisions.1004.t: "Zvládání stresu: Rozpačité ráno"
 stress_trait_coping_decisions.1004.desc: "Probudím se s hlavou zabořenou do měkkého polštáře a vedle sebe cítím několik teplých těl. To musela být noc! Sotva si vzpomí...\n\n#EMP Béé!#!\n\n... Hm. Když otevřu oči, hledí na mě úzká zornička zasazená do velice #EMP bílé#! a #EMP huňaté#! tváře. Můj polštář se náhle zvedne a odkráčí pryč a spící společnost ho vzápětí následuje. Zůstanu v seně úplně sám."
 stress_trait_coping_decisions.1004.a: "No... aspoň to byl ovčividně dobrý spánek!"
 stress_trait_coping_decisions.1501.t: "Zvládání stresu: Uklidňující opar"
 stress_trait_coping_decisions.1501.desc: "Pohodlně se opřu a bezmyšlenkovitě sáhnu po dalším koláčku. Jeho nasládlá chuť mi ulpívá na jazyku a příjemný opar pomalu odplavuje všechny starosti.\n\nTakový klid jsem necítil[Select_CString(ROOT.Char.IsFemale,'a','')] už celé #EMP týdny#!. Jen... tu být. S tímhle tácem hašišových koláčků. To stačí."
 stress_trait_coping_decisions.1501.a: "Nic víc nepotřebuji."
 stress_trait_coping_decisions.2001.t: "Zvládání stresu: Nevázané radovánky"
 stress_trait_coping_decisions.2001.desc_woman: "Ležím ve změti končetin a nade mnou se sklání [ROOT.Char.Custom('AttractionWomanManIndef')]. Tělem mi projede slastné uvolnění a s ním i úleva."
 stress_trait_coping_decisions.2001.desc_man: "Ležím ve změti končetin a obkročmo nade mnou sedí [ROOT.Char.Custom('AttractionWomanManIndef')]. Tělem mi projede slastné uvolnění a s ním i úleva."
 stress_trait_coping_decisions.2001.desc_ending: "\n\nMysl mám klidnější než za celé #EMP týdny#!, a přesto mi srdce pořád buší jako o závod! Nádhera!"
 stress_trait_coping_decisions.2001.a: "Ještě jednou. Pojďte sem, [ROOT.Char.Custom('AttractionGirlBoyPlural')]!"
 stress_trait_coping_decisions.2002.t: "Zvládání stresu: Cena vášně"
 stress_trait_coping_decisions.2002.desc_woman: "Probouzím se po úžasné noci plné vášně. A ten [ROOT.Char.Custom('AttractionWomanMan')], který chtěl zůstat déle než všichni ostatní a rozmazloval mě, dokud jsem neusnula... #EMP Uf#!, to byl tedy #EMP zážitek#!!"
 stress_trait_coping_decisions.2002.desc_man: "Probouzím se po úžasné noci plné vášně. A ta [ROOT.Char.Custom('AttractionWomanMan')], která chtěla zůstat déle než všichni ostatní a nepřestala, dokud jsem neusnul... #EMP Uf#!, to byl tedy #EMP zážitek#!!"
 stress_trait_coping_decisions.2002.desc: "\n\nVstanu, abych se [Select_CString(ROOT.Char.IsFemale,'oblékla','oblékl')], ale něco tu chybí. Něco docela důležitého. Něco jako #EMP úplně všechny moje věci#!! Místnost je vybílená, po oblečení ani měšci není ani stopy.\n\n"
 stress_trait_coping_decisions.2002.desc_ending_rival: "Na podlaze najdu vzkaz: #EMP „Doufám, že [ROOT.Char.Custom('AttractionWomanMan')] ode mě ti [Select_CString(ROOT.Char.IsFemale,'zpříjemnil','zpříjemnila')] noc. S pozdravem [rival.GetTitledFirstName].“#!"
 stress_trait_coping_decisions.2002.desc_ending: "Ach, [Select_CString(ROOT.Char.IsFemale,'ten zatracený','ta zatracená')] [ROOT.Char.Custom('AttractionWomanMan')]!"
 stress_trait_coping_decisions.2002.a: "Prosím... někdo... přineste mi oblečení!"
 stress_trait_coping_decisions.2002.b: "[rival.GetFirstNameNoTooltip]! Ty hade!"
 stress_trait_coping_decisions.2004.t: "Zvládání stresu: Následky"
 stress_trait_coping_decisions.2004.desc: "Jednoho odpoledne ke mně zničehonic přijde [Select_CString(prostitute.IsFemale,'prostá žena','prostý muž')] s nemluvnětem v náručí a slzami stékajícími po tvářích.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip]!“ spustí. „Tvoje zálety mají následky! [baby.Custom('GirlBoy')|U] je #EMP tvoje dítě#!!“\n\nMálem se zadusím. Ale... nevybavuje se mi [prostitute.GetFirstName]? Ta tvář, to tělo v matném světle svíček v jednom z těch doupat neřesti...?"
 stress_trait_coping_decisions.2004.a: "[baby.Custom('GetDaughterSon')|U]! #EMP Moje vlastní dítě!#!"
 stress_trait_coping_decisions.2004.b: "[Select_CString(prostitute.IsFemale,'Ubohá zmatená žena','Ubohý zmatený muž')]. O dítě se přesto postarám..."
 stress_trait_coping_decisions.2004.c: "Za koho mě máš? Stráže!"
 stress_trait_coping_decisions_2004_a_custom: "[Concept('spouse','Choti')|E], [Concept('lover','milenci')|E] a legitimní [Concept('child','děti')|E]"
 stress_trait_coping_decisions.2501.t: "Zvládání stresu: O samotě"
 stress_trait_coping_decisions.2501.desc: "Pomalu vejdu do ticha, které nabízí [ROOT.Char.Custom('GetChamber')|l], a konečně jsem úplně o samotě. Zhluboka se nadechnu. A vydechnu.\n\nSlužebnictvo dostalo rozkaz, aby mě za žádných okolností nikdo nerušil. Jak mi z ramen opadává napětí, vím, že přesně tohle jsem [Select_CString(ROOT.Char.IsFemale,'potřebovala','potřeboval')]."
 stress_trait_coping_decisions.2501.a: "Konečně naprostý klid!"
 stress_trait_coping_decisions.3001.t: "Zvládání stresu: Vylít si zlost"
 stress_trait_coping_decisions.3001.desc_vassal: "„[vassal.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))], tak [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] tě vidím!“ [ROOT.Char.Custom('quirk_neg_adverb')] se usměju.\n\n„[Select_CString(vassal.IsFemale,'Narodila ses','Narodil ses')] jako [vassal.Custom2('InsultAdjectiveArticle', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)], nebo se to projevilo až později?“"
 stress_trait_coping_decisions.3001.desc_has_vassals: "Jakmile se všichni vazalové usadí a [vassal.GetTitledFirstName] začne mluvit, [ROOT.Char.Custom('quirk_neg_adverb')] se usměju.\n\n„[vassal.GetTitledFirstNameNoTooltip], promiň, že tě přerušuji, ale proč jsi pořád [vassal.Custom2('InsultAdjectiveArticle', ROOT.Char)] [vassal.Custom2('InsultNoun', ROOT.Char)]? A ty, [vassal_2.GetTitledFirstName], [Select_CString(vassal_2.IsFemale,'narodila ses','narodil ses')] jako [vassal_2.Custom2('InsultNoun', ROOT.Char)], nebo se to projevilo až později?“"
 stress_trait_coping_decisions.3001.desc_has_target_character: "Jakmile se všichni usadí a [target_character.GetTitledFirstName] začne mluvit, [ROOT.Char.Custom('quirk_neg_adverb')] se usměju.\n\n„[target_character.GetTitledFirstNameNoTooltip], promiň, že tě přerušuji, ale proč jsi pořád [target_character.Custom2('InsultAdjectiveArticle', ROOT.Char)] [target_character.Custom2('InsultNoun', ROOT.Char)]?“"
 stress_trait_coping_decisions.3001.desc: "Jakmile se [ROOT.Char.Custom('GetCourt')|l] shromáždí, [ROOT.Char.Custom('quirk_neg_adverb')] se usměju. Nastal čas.\n\n„Ty tam! Narodil ses jako takový hulvát, nebo se to projevilo až později?“"
 stress_trait_coping_decisions.3001.a_target: "Ten výraz, který má [target_character.GetTitledFirstName] ve tváři...!"
 stress_trait_coping_decisions.3001.a: "A #EMP ty#!! Nemysli si, že tě nevidím!"
 stress_trait_coping_decisions.3501.t: "Zvládání stresu: Uklidňující muka"
 stress_trait_coping_decisions.3501.desc: "#EMP Prásk!#!\n\nBič dopadne na má záda a já se zachvěju nad jasností, kterou bolest přináší. Necítím nic než bolest a nemyslím na nic než na bolest.\n\n#EMP Prásk!#!\n\n#EMP Prásk!#!"
 stress_trait_coping_decisions.3501.a: "Hng... Sladká, přesladká bolest!"
 stress_trait_coping_decisions.4001.t: "Zvládání stresu: Cena, kterou platíme"
 stress_trait_coping_decisions.4001.desc: "Procházím tržištěm v [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] a samým nadšením skoro nevím, kam se podívat. Látky, šperky, nitě a cetky... Chci všechno!\n\nNakonec skončím u stánku, který obsluhuje [ROOT.Char.Custom('RandomWomanMan')], člověk už v letech s velkým pochopením pro mou svízelnou situaci. Dokonce mi slíbí, že mi pomůže s výběrem."
 stress_trait_coping_decisions.4001.a: "Dvakrát tohle. Ne, počkat. #EMP Třikrát!#!"
 stress_trait_coping_decisions.4501.t: "Zvládání stresu: Radost z dávání"
 stress_trait_coping_decisions.4501.desc: "Odcházím od [ROOT.Char.GetFaith.HouseOfWorship] s lehčím měšcem a ještě lehčím srdcem.\n\nStačí pomyslet na všechny potřebné, kterým ty peníze pomohou, a má mysl se hned uklidní!"
 stress_trait_coping_decisions.4501.a: "[ROOT.Char.GetFaith.HighGodName] je štědrý!"
 stress_trait_coping_decisions.5001.t: "Zvládání stresu: Přiznání"
 stress_trait_coping_decisions.5001.desc_opening: "„Dnes jsem [Select_CString(ROOT.Char.IsFemale,'svolala','svolal')] [ROOT.Char.Custom('GetCourt')|l], protože se musím k něčemu přiznat."
 stress_trait_coping_decisions.5001.desc_secret: "Já... já [secret.Custom('SecretDescriptionFirstPerson')].“"
 stress_trait_coping_decisions.5001.desc_sin: "Já... já své [ROOT.Char.Custom('SinfulTrait')|l] stránce neodporuji tolik, jak bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')].“"
 stress_trait_coping_decisions.5001.desc: "„Já... já mám poslední dobou hříšné myšlenky. Vyslechněte mě...“"
 stress_trait_coping_decisions.5001.desc_ending: "\n\nDavem se šíří šokované mumlání, ale mou úlevu tím nic nezkazí."
 stress_trait_coping_decisions.5001.a: "Taková úleva!"
 stress_trait_coping_decisions.5002.desc: "„Já... já [secret.Custom('SecretDescriptionFirstPerson')]. Ne, počkat... To jsem [Select_CString(ROOT.Char.IsFemale,'nebyla','nebyl')] já, to [secret_character.GetTitledFirstName]!“\n\nPobouřený výkřik, který se ozve od [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_character'))], mou úlevu nijak nezmenší."
 stress_trait_coping_decisions.5002.a: "Každopádně... Taková úleva!"
 stress_trait_coping_decisions.5501.t: "Zvládání stresu: Do syta!"
 stress_trait_coping_decisions.5501.desc: "Když přede mě položí další talíř [ROOT.Char.Custom('FavoriteTreat')], cítím, jak ze mě opadává napětí.\n\nNic neuklidní mysl tak jako pořádné jídlo!"
 stress_trait_coping_decisions.5501.a: "Přineste mi další [ROOT.Char.Custom('FavoriteTreat')]!"
 stress_trait_coping_decisions.5502.t: "Zvládání stresu: Překvapivá hostina"
 stress_trait_coping_decisions.5502.desc: "Zatímco čekám, až kuchaři připraví mé jídlo, narazím v chodbách na [ROOT.Char.Custom('lowly_servant_type')].\n\nMůj nečekaný úlovek se snaží vymluvit, ale to teď přece nemůžu dovolit, nebo snad ano? Vždyť jsem právě [Select_CString(ROOT.Char.IsFemale,'narazila','narazil')] na nejlepší jídlo, jaké si lze představit!\n\nOdvedu svou kořist do sklepení, kde nikdo neuslyší křik. A pak se #EMP najím#!!"
 stress_trait_coping_decisions.5502.desc_landless: "Zatímco se toulám táborem a čekám, až mi připraví jídlo, narazím na mladého člověka z jedné z okolních osad.\n\nMůj nečekaný úlovek se snaží vymluvit, ale to teď přece nemůžu dovolit, nebo snad ano? Vždyť jsem právě [Select_CString(ROOT.Char.IsFemale,'narazila','narazil')] na nejlepší jídlo, jaké si lze představit!\n\nOdvedu svou kořist na okraj divočiny, kde jeden či dva výkřiky nikoho nezajímají. A pak se #EMP najím#!!"
 stress_trait_coping_decisions.5502.a: "A nahoře na mě ještě čeká zákusek!"
 stress_trait_coping_decisions.5502.a_landless: "Tak #EMP tomuhle#! říkám úleva."
 stress_trait_coping_decisions.6001.t: "Zvládání stresu: Zříci se jídla"
 stress_trait_coping_decisions.6001.desc: "„Řekněte kuchaři, že se v dohledné době nebudu účastnit společných jídel.“\n\nSotva ta slova vypustím z úst, cítím se lehčeji. Žádné další rozptylování, žádné další nucení se do jídla, které sotva snesu! Teď se můžu soustředit na to, co je důležité."
 stress_trait_coping_decisions.6001.a: "Ano, takhle je to dobré."
 stress_trait_coping_decisions.6501.t: "Zvládání stresu: Inkoust teče proudem"
 stress_trait_coping_decisions.6501.desc: "Popadnu pero a otevřu deník.\n\nS každou další větou, která se objeví na papíře, cítím, jak mi povolují ramena. Nic mi nedokáže vyčistit hlavu tak jako psaní!"
 stress_trait_coping_decisions.6501.a: "Znovu namočím pero..."
 stress_trait_coping_decisions.7001.t: "Zvládání stresu: Svěřit se"
 stress_trait_coping_decisions.7001.desc: "Po dlouhém rozhovoru s [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('confidant'))] [confidant.GetTitledFirstName] cítím, jak se mé myšlenky uklidňují."
 stress_trait_coping_decisions.7001.desc_ending: "\n\nKdyž se však znovu připojím k [ROOT.Char.Custom('GetCourt')|l], na tvářích [ROOT.Char.Custom('GetCourtierPlural')|l] vidím žárlivost... Koneckonců, kdo by nestál o [confidant.GetFirstNamePossessive] důvěru?"
 stress_trait_coping_decisions.7001.a: "Má mysl je ale konečně klidná."
 stress_trait_coping_decisions.7002.desc: "Po dlouhém a vyčerpávajícím rozhovoru cítím, jak se mé myšlenky uklidňují."
 stress_trait_coping_decisions.activity: "Zvládání stresu:"
 stress_trait_coping_decisions.7501.t: "$stress_trait_coping_decisions.activity$ Vypotit starosti"
 stress_trait_coping_decisions.7501.desc: "Když dokončím další okruh kolem místa, kde stojí [ROOT.Char.Custom('ResidenceBuilding')|l], už cítím, jak ze mě spolu s potem odkapávají i starosti.\n\nNěkteří říkají, že před problémy utíkám. Já říkám, že běžím vstříc řešení!"
 stress_trait_coping_decisions.7501.a: "Ještě jeden okruh!"
 stress_trait_coping_decisions.7502.t: "$stress_trait_coping_decisions.activity$ Čím těžší, tím lepší"
 stress_trait_coping_decisions.7502.desc: "Přede mnou leží [ROOT.Char.Custom('signature_weapon')]. „Tohle nestačí!“ pomyslím si. Trénuji bez přestání, ale vůbec se neunavuji. Potřebuji větší výzvu!\n\nAno... něco většího... nebo možná těžšího!\n\nNěco, co mě zaručeně vyčerpá!"
 stress_trait_coping_decisions.7502.a: "[random_artifact.GetNameNoTooltip] bude muset posloužit!"
 stress_trait_coping_decisions.7502.b: "[ROOT.Char.Custom('signature_weapon')|U] poslouží jako vzor. Chci něco mnohem těžšího!"
 stress_trait_coping_decisions.7502.c: "[lifted_child.GetFirstNameNoTooltip], pojď sem!"
 stress_trait_coping_decisions.7502.c.flavor: "Hop nahoru!"
 stress_trait_coping_decisions.7502.d: "Teď není potřeba nic měnit."
 stress_trait_coping_decisions.7502.success: "Větší výzva tě povzbudí"
 stress_trait_coping_decisions.7502.failure: "Přeceníš vlastní sílu"
 stress_trait_coping_decisions.7503.t: "$stress_trait_coping_decisions.activity$ Přátelské soupeření"
 stress_trait_coping_decisions.7503.desc: "Jsem uprostřed tréninku, když si všimnu, že [random_knight.GetTitledFirstName] také cvičí. Nejenže vypadá zdravě, ale očividně je i ve vrcholné tělesné kondici. Láká mě zjistit, kdo z nás má větší udatnost, ale jakým způsobem ji nejlépe poměřit?\n\nPokud chci zvítězit, mám vsadit na více schopností? Na hrubou sílu, nebo na kombinaci, při které rozhodne také výdrž či důvtip?"
 stress_trait_coping_decisions.7503.a: "„Co takhle zápas, [random_knight.GetFirstNameNoTooltip]?“"
 stress_trait_coping_decisions.7503.a.tt: "Myslíš si, že zvítězíš díky čisté udatnosti"
 stress_trait_coping_decisions.7503.b: "„Co takhle cvičný souboj, [random_knight.GetFirstNameNoTooltip]?“"
 stress_trait_coping_decisions.7503.b.tt: "Myslíš si, že k vítězství povede kombinace udatnosti a válečnictví"
 stress_trait_coping_decisions.7503.c: "„Co takhle závod v běhu?“"
 stress_trait_coping_decisions.7503.c.tt: "Myslíš si, že ti kombinace udatnosti a zdraví pomůže soupeře udolat"
 stress_trait_coping_decisions.7503.d: "Raději dokončím svůj obvyklý trénink."
 stress_trait_coping_decisions.7503.success: "Vítězství je tvé!"
 stress_trait_coping_decisions.7503.failure: "[random_knight.GetTitledFirstNameNoTooltip] ve výzvě zvítězí"
 stress_trait_coping_decisions.7504.desc: "Když cvičím o samotě, někdy je těžké najít motivaci a držet se pravidelného tréninku.\n\nMohl by mi pomoci tréninkový partner, který mě povzbudí ve špatných dnech a zároveň mi poslouží jako měřítko vlastního pokroku.\n\nJaký společník by mi vyhovoval nejvíc? Někdo, ke komu můžu vzhlížet, někdo, kdo mě bude neustále nutit překonávat se, nebo snad někdo, jehož příkladu se rozhodně nechci přiblížit?"
 stress_trait_coping_decisions.7504.a: "Nejvíc mě posune někdo, komu závidím udatnost. Třeba [ideal_character.GetFirstNameNoTooltip]!"
 stress_trait_coping_decisions.7504.b: "[similar_character.GetFirstNameNoTooltip] má podobnou postavu a může se řídit stejným tréninkem."
 stress_trait_coping_decisions.7504.c: "Když vidím, jak se [not_ideal_character.GetFirstNameNoTooltip] trápí, hned mám větší motivaci."
 stress_trait_coping_decisions.7504.d: "Při tréninku společnost nepotřebuji."
