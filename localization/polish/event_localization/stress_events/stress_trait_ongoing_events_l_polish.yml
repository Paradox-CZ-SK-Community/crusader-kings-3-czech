l_polish:
 stress_trait_ongoing.0501.t: "Klidný večer"
 stress_trait_ongoing.0501.desc: "Vládnutí je poslední dobou tak stresující. Když to není jedno, je to druhé, a když ne druhé, tak zase první. Nekonečný zástup rolníků, kněží a problémů, všichni čekají, že právě #EMP já#! vyřeším každou jejich malichernou starost.\n\nZasloužím si den jen pro sebe. Bez nápadníků a prosebníků, bez diplomatů a soudců. Jen já a tenhle velký talíř hašišových koláčků..."
 stress_trait_ongoing.0501.adventurer: "Vedení tábora je poslední dobou tak stresující. Když to není jedno, je to druhé, a když ne druhé, tak zase první. Nekonečný seznam drobných úkolů, problémů a otázek, které všechny čekají právě na #EMP moje#! řešení.\n\nZasloužím si den jen pro sebe. Bez povzbuzujících proslovů, bez výcviku a porad. Jen já a tenhle velký talíř hašišových koláčků..."
 stress_trait_ongoing.0501.administrative: "Vedení rodu [ROOT.Char.GetDynastyHouse.GetBaseNameNoTooltip] je poslední dobou tak stresující. Když to není jedno, je to druhé, a když ne druhé, tak zase první. Nekonečný seznam drobných úkolů, problémů a otázek, které všechny čekají právě na #EMP moje#! řešení.\n\nZasloužím si den jen pro sebe. Bez intrik a předvádění, bez podlézání a výmyslů. Jen já a tenhle velký talíř hašišových koláčků..."
 stress_trait_ongoing.0501.a: "Zpátky do práce!"
 stress_trait_ongoing.0501.b: "Je to jen jeden volný den..."
 overworking_diplomacy_modifier: "Přepracování při diplomacii"
 overworking_diplomacy_modifier_desc: "$overworking_stewardship_modifier_desc$"
 overworking_martial_modifier: "Přepracování při válečnictví"
 overworking_martial_modifier_desc: "$overworking_stewardship_modifier_desc$"
 overworking_stewardship_modifier: "Přepracování při správcovství"
 overworking_stewardship_modifier_desc: "Tato postava dává práci přednost před vlastním duševním zdravím."
 overworking_intrigue_modifier: "Přepracování při pletichářství"
 overworking_intrigue_modifier_desc: "$overworking_stewardship_modifier_desc$"
 overworking_learning_modifier: "Přepracování při učenosti"
 overworking_learning_modifier_desc: "$overworking_stewardship_modifier_desc$"
 stress_trait_ongoing.0506.t: "Sladká úleva"
 stress_trait_ongoing.0506.desc_leper: "Ta zhoubná nemoc pomalu požírá mé tělo a den za dnem ze mě odpadává kůže. Jsem sice [ROOT.GetCharacter.GetTitleAsNameNoTooltip], ale někdy se bojím, že [ROOT.Char.Custom(GetCourtierPlural)] ve mně nevidí nic než malomocného člověka."
 stress_trait_ongoing.0506.desc_gout_ridden: "Ta tepající bolest v končetinách je nesnesitelná. Hodiny pomalu sílících muk mě den za dnem ochromují. Někdy přemýšlím, zda by nebylo lepší, kdyby bolest byla alespoň stálá, místo abych pokaždé procházel od tupého tepání k palčivému utrpení a zase zpátky."
 stress_trait_ongoing.0506.desc_cancer: "Týdny se vlečou v neustálém čekání, odkud přijde další záchvat bolesti. Některé dny se dají snést, jindy se sotva dokážu pohnout nebo promluvit a každý nádech přichází pomaleji. Cítím, jak mi zbývající čas na tomto světě uniká mezi prsty, kradený rakovinným nádorem, který ničí mé tělo."
 stress_trait_ongoing.0506.desc_disfigured: "Mé rány se možná navenek zahojily, ale uvnitř bolest zohyzdění stále pálí. Prstem přejedu po starých jizvách a vzpomínky na utrpení se vrátí s plnou silou."
 stress_trait_ongoing.0506.desc_maimed: "Rozkašlu se a vyplivnu chuchvalec hlenu smíšeného s krví. Ani nevím, jestli je to nový problém. Při neustálé bolesti, která zmítá mým zmrzačeným a zničeným tělem, se to těžko poznává."
 stress_trait_ongoing.0506.desc_one_eyed: "Prázdný důlek, kde bývalo mé oko, někdy pořád bolí. Většinou mě jím projíždí ostrá bolest. V nejhorších dnech se přidávají podivné přeludy a záblesky nepřirozených tvarů."
 stress_trait_ongoing.0506.desc_one_legged: "Přitisknu prsty ke zkroucenému pahýlu chybějící nohy. Někdy, zvlášť když procházím známými místy, ji stále cítím. Bolest z její ztráty se mi vrací do mysli stejně skutečná jako tehdy."
 stress_trait_ongoing.0506.desc_wounded: "Trhnu sebou, když prsty prozkoumám ránu. Ulpí na nich rudohnědý prach ze strupu a prudké bodnutí bolesti mi připomene, že rána je pořád velmi čerstvá."
 stress_trait_ongoing.0506.desc_fallback: "Bolest zmítá mým tělem a má vyčerpaná mysl už taková muka sotva snáší. Potřebuji nějakou úlevu. Cokoli, co mi pomůže to vydržet."
 stress_trait_ongoing.0506.desc: "\n\nHašiš by měl bolest alespoň na čas zmírnit. Otázkou je jen, zda si ho dát o samotě, nebo zda by mi společnost zvedla náladu. [medication_friend.GetTitledFirstName] se ostatně ptal[Select_CString(medication_friend.IsFemale,'a','')], zda dnes večer nechci společnost..."
 stress_trait_ongoing.0506.a: "Potřebuji být chvíli o samotě."
 hashish_alone_modifier: "Léčba o samotě"
 hashish_alone_modifier_desc: "Tato postava po večerech tlumí bolest hašišovými koláčky."
 stress_trait_ongoing.0506.b: "Možná by se [medication_friend.GetFirstNameNoTooltip] rád[Select_CString(medication_friend.IsFemale,'a','')] podělil[Select_CString(medication_friend.IsFemale,'a','')]?"
 hashish_with_friend_modifier: "Léčba ve společnosti"
 hashish_with_friend_modifier_desc: "Tato postava tráví večery s dobrým přítelem a kvalitním hašišem."
 stress_trait_ongoing.0511.t: "Tak tomu bylo odjakživa"
 stress_trait_ongoing.0511.desc: "Užívám si chladný večer a nenuceně ujídám z malé hromádky sladkých hašišových koláčků, když mi náhle na tvář dopadne těžký dech potřísněný slinami. [crusty_old_person.GetTitledFirstName] nade mnou stojí v naprostém rozhořčení.\n\n„Odlož ten prokletý plevel, [ROOT.GetCharacter.GetFirstNameNoTooltip], a přestaň si zamlžovat mysl! [crusty_old_person.GetFaith.HighGodName] tě vidí! Nejsi na tomto světě proto, abys promarnil život v omámení!“"
 stress_trait_ongoing.0511.a: "Máš pravdu! Musím s tím okamžitě přestat."
 stress_trait_ongoing.0511.a_flavour: "Vyhodíš hašišové koláčky"
 stress_trait_ongoing.0511.b: "<hluboký nádech> Jistě, #EMP stařešino#!."
 stress_trait_ongoing.0511.b_flavour: "Sněz. Každý. Zatracený. Koláček."
 stress_trait_ongoing_0516.t: "Toulavá myš—"
 stress_trait_ongoing_0516.desc: "„—lenka... a právě proto je toto setkání tak důležité.“\n\nCože? Ach, ano, jistě, setkání s [important_guest.GetTitledFirstName]. Kvůli... něčemu. O čem jsme to #EMP vlastně#! mluvili? [important_guest.GetTitledFirstName] se tváří velmi vážně, ať už šlo o cokoli.\n\nNatáhnu ruku, vezmu si další hašišový koláček a zamyšleně do něj kousnu. [important_guest.GetFirstNameNoTooltip] při pohledu na mé prázdné mlčení pozvedne obočí a mně začíná docházet, že jsem těch koláčků možná snědl[Select_CString(ROOT.Char.IsFemale,'a','')] #EMP až#! příliš."
 stress_trait_ongoing.0516.a: "Ano, samozřejmě, velmi důležité setkání..."
 stress_trait_ongoing.0516.a.tt_success: "[important_guest.GetFirstNameNoTooltip] oceňuje tvé klidné a vyrovnané odpovědi"
 stress_trait_ongoing.0516.a.tt_fail: "Tvé očividné omámení [important_guest.GetFirstNameNoTooltip] urazí"
 stress_trait_ongoing.0516.b: "Omlouvám se, ale není mi dobře."
 stress_trait_ongoing.0516.b_flavour: "Předčasně se vytratíš ze setkání a jdeš si lehnout"
 stress_trait_ongoing.0516.c: "Uvolni se, [important_guest.GetFirstNameNoTooltip]. Dej si trochu hašiše!"
 stress_trait_ongoing.0516.c_flavour: "Necháš sluhu přinést další koláčky, abyste se mohli podělit"
 stress_trait_ongoing.1501.t: "Posedlost"
 stress_trait_ongoing.1501.desc_1_a: "Když kolem mě dnes ráno [obsession.GetTitledFirstName] [Select_CString(obsession.IsFemale,'prošla','prošel')], na okamžik se mi naskytl pohled do svůdného výstřihu."
 stress_trait_ongoing.1501.desc_1_b: "Když kolem mě dnes ráno [obsession.GetTitledFirstName] [Select_CString(obsession.IsFemale,'prošla','prošel')], nešlo si nevšimnout vyzývavé boule pod nohavicemi."
 stress_trait_ongoing.1501.desc_1_c: "[obsession.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se na mě dnes ráno při setkání vřele [Select_CString(obsession.IsFemale,'usmála','usmál')]."
 stress_trait_ongoing.1501.desc_1_d: "Když kolem mě dnes ráno [obsession.GetTitledFirstName] [Select_CString(obsession.IsFemale,'prošla','prošel')], můj pohled bezděčně sklouzl po celé postavě."
 stress_trait_ongoing.1501.bridge: "Od té chvíle mi [obsession.GetTitledFirstName] nejde z hlavy a mé chlípné představy mě neustále odvádějí od práce.\n\n"
 stress_trait_ongoing.1501.desc_2_a: "[Select_CString(obsession.IsFemale,'Její','Jeho')] bujné poprsí,"
 stress_trait_ongoing.1501.desc_2_b: "[Select_CString(obsession.IsFemale,'Její','Jeho')] široké boky,"
 stress_trait_ongoing.1501.desc_2_c: "[Select_CString(obsession.IsFemale,'Její','Jeho')] svůdné mužství,"
 stress_trait_ongoing.1501.desc_2_d: "[Select_CString(obsession.IsFemale,'Její','Jeho')] štíhlá postava,"
 stress_trait_ongoing.1501.desc_2_e: "[Select_CString(obsession.IsFemale,'Její','Jeho')] široká ramena,"
 stress_trait_ongoing.1501.desc_2_f: "[Select_CString(obsession.IsFemale,'Její','Jeho')] přitažlivé tělo,"
 stress_trait_ongoing.1501.desc_3_a: "způsob, jakým se [Select_CString(obsession.IsFemale,'její','jeho')] pružné tělo pohybuje..."
 stress_trait_ongoing.1501.desc_3_b: "způsob, jakým se [Select_CString(obsession.IsFemale,'její','jeho')] kyprá postava při chůzi pohupuje..."
 stress_trait_ongoing.1501.desc_3_c: "způsob, jakým se [Select_CString(obsession.IsFemale,'její','jeho')] svaly při chůzi napínají pod kůží..."
 stress_trait_ongoing.1501.desc_3_d: "elegance a důstojnost, s jakou se pohybuje..."
 stress_trait_ongoing.1501.desc_3_e: "to rozpustilé plížení kolem místa, kde stojí [ROOT.Char.Custom('ResidenceBuilding')]..."
 stress_trait_ongoing.1501.desc_3_f: "ten rozvážný krok..."
 stress_trait_ongoing.1501.end: "Je toho příliš! Musím se téhle poblázněnosti nějak zbavit, jinak už nikdy nic neudělám!"
 stress_trait_ongoing.1501.warning: "\n\nBohužel vím, že [obsession.GetFirstName] o [Select_CString(ROOT.IsFemale,'ženy','muže')] nemá zájem, takže ani já nemám šanci."
 stress_trait_ongoing.1501.a: "Musím zjistit, jestli to cítí stejně!"
 stress_trait_ongoing.1501.a.flavor: "Tak či onak, tímhle se všechno vyjasní."
 stress_trait_ongoing.1501.a.success: "[obsession.GetTitledFirstName] po tobě také touží"
 stress_trait_ongoing.1501.a.failure: "[obsession.GetTitledFirstName] odmítne tvé návrhy"
 stress_trait_ongoing.1501.b: "Trocha fantazírování přece nemůže uškodit, ne?"
 stress_trait_ongoing.1501.b.flavor: "Chvíle o samotě mi alespoň dočasně uleví."
 stress_trait_ongoing.1501.c: "Návštěva nevěstince mi pomůže na tuhle posedlost zapomenout..."
 stress_trait_ongoing.1501.c.flavor: "#EMP Někdo#! tam mi určitě pomůže přenést se přes to."
 stress_trait_ongoing.1501.d: "Tohle je #EMP špatně#!. [obsession.GetFirstNameNoTooltip] není jen objekt mé touhy!"
 stress_trait_ongoing.1501.d.flavor: "[obsession.GetFirstNameNoTooltip] si tuhle posedlost nezaslouží a navíc mi škodí."
 stress_trait_ongoing.4501.t: "Ani sousto k jídlu"
 stress_trait_ongoing.4501.desc: "Posledních pár týdnů bylo obzvlášť stresujících a já chci jediné: [ROOT.Char.Custom('FavoriteTreat')]. Možná několik porcí...\n\nK čertu s tím, klidně celý stůl!\n\nZ kuchyně však přichází zpráva, že už nic nezbylo a nejsou ani suroviny na další."
 stress_trait_ongoing.4501.a: "Vezmi tyhle mince. Ať to stojí cokoli, sežeň mi jídlo!"
 stress_trait_ongoing.4501.b: "Nemáš po ruce #EMP cokoli#!, co by utišilo mou chuť?"
 stress_trait_ongoing.4501.b.success: "Objevíš nový oblíbený dezert"
 stress_trait_ongoing.4501.b.cannibal: "Přijdeš na chuť lidskému masu"
 stress_trait_ongoing.4501.b.failure: "Tvá chuť zůstane neukojená"
 stress_trait_ongoing.4501.c: "Uf... Asi to prostě budu muset vydržet bez toho."
 stress_trait_ongoing.4502.t: "Hlad"
 stress_trait_ongoing.4502.desc: "Posledních pár týdnů bylo obzvlášť stresujících a já myslím jen na pořádný šťavnatý kus masa. Něco pěkně křehkého, třeba kýtu... nebo žebra?\n\nJen při té představě se mi sbíhají sliny a vím, že tentokrát ten hlad neudržím na uzdě."
 stress_trait_ongoing.4502.a: "[prisoner.GetTitledFirstNameNoTooltip] přece nikomu chybět nebude."
 stress_trait_ongoing.4502.b: "[courtier.GetTitledFirstNameNoTooltip] si to stejně zaslouží..."
 stress_trait_ongoing.4502.c: "Čas na výlet do [hapless_village.GetNameNoTier]!"
 stress_trait_ongoing.5001.t: "Hostina dobrých úmyslů"
 stress_trait_ongoing.5001.desc: "„Pojď se mnou, [ROOT.Char.GetTitledFirstName], mám pro tebe překvapení!“ nadšeně pronese [giver.Custom2('MyCharacterIntroduction', ROOT.Char)]. „Všiml[Select_CString(giver.IsFemale,'a','')] jsem si, že poslední dobou pořádně nejíš, a tak jsem celé týdny hledal[Select_CString(giver.IsFemale,'a','')] ty nejvzácnější lahůdky, jaké se mi podařilo najít!“\n\n[giver.GetTitledFirstName] mě vede dál a před námi se objeví stůl zavalený nejrůznějšími vybranými pokrmy. [ROOT.Char.Custom('GetExpensiveMeal')|U] a [ROOT.Char.Custom('GetExpensiveMealAlt')]... [ROOT.Char.Custom('GetExpensiveDessert')]... Už jen z té vůně se mi obrací žaludek.\n\n„Tak co? Pusť se do toho, [ROOT.Char.Custom('FormOfAddressForLiege')]!“"
 stress_trait_ongoing.5001.a: "„Je to, ehm... vážně dobré. Mmm. Moc dobré.“"
 stress_trait_ongoing.5001.a.flavor: "Sním to, ale jen ze slušnosti."
 stress_trait_ongoing.5001.b: "„To sis nemusel[Select_CString(giver.IsFemale,'a','')] dávat takovou práci... Ne, vážně. #EMP Služebnictvo!#! Odneste to.“"
 stress_trait_ongoing.5001.c.dog: "Budu předstírat, že jím. [ROOT.Char.Custom('DogStoryName')] pod stolem se o všechno postará."
 stress_trait_ongoing.5001.c.cat: "Budu předstírat, že jím. [ROOT.Char.Custom('CatStoryName')] pod stolem se o všechno postará."
 stress_trait_ongoing.5001.c.no_pet: "Budu předstírat, že jím. Pes pod stolem se o všechno postará."
 stress_trait_ongoing.5001.c.success: "[giver.GetTitledFirstName] si myslí, že ti jídlo chutnalo"
 stress_trait_ongoing.5001.c.failure: "[giver.GetTitledFirstName] si všimne, že jsi jídlo nesnědl"
