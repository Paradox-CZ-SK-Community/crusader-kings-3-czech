l_polish:
 title_event_francia_name_change.title: "Konec jedné éry"
 title_event_francia_name_change.desc: "Vláda dynastie Karlovců skončila!\n\n[francia_title.GetName] se jim konečně vymkla z rukou. Když jsou Karlovci pryč, tyto země už skutečně nejsou součástí jejich staré říše.\n\nSe mnou jako budoucím [ROOT.Char.GetTitleAsNameNoTooltip] nás čeká nový a zářný osud. Je tedy jen příhodné odstranit #EMP všechny#! připomínky jejich vlivu. Včetně samotného #EMP jména#!!"
 title_event_francia_name_change.a: "Začíná nová éra!"
 title_event_francia_name_change.a_tt_1: "[francia_title.GetName] mění svůj název na #high $k_france$#!"
 title_event_francia_name_change.a_tt_2: "[francia_title.GetName] mění svůj název na #high $k_germany$#!"
 title_event.0012.t: "Rozdělení koruny"
 title_event.0012.desc: "Se vznikem [castille.GetName] a uprázdněním trůnu starého [asturias.GetBaseNameNoTier] Království Pelagiovo konečně přerostlo samo sebe. Jeho zbytek bude od nynějška znám jako [leon.GetBaseNameNoTier], alespoň dokud i jej nezastíní vzestup [castille.GetBaseNameNoTierNoTooltip]."
 title_event.0012.a: "Tak to má být."
 title_event.0013.t: "$title_event.0012.t$"
 title_event.0013.desc: "Teď, když držím trůny [asturias.GetBaseNameNoTier] i samostatného [castille.GetBaseNameNoTier], připadá mnohým představa jednotného [asturias.GetNameNoTooltip] poněkud matoucí a vlastně i zbytečná.\n\nŠlechta i prostý lid proto začali západní polovinu mých zemí označovat podle její dominantní vnitrozemské části, [leon.GetBaseNameNoTier]."
 title_event.0013.a: "Dvě koruny jsou lepší než jedna!"
 title_event.0014.t: "$title_event.0012.t$"
 title_event.0014.desc: "Nedávný vznik nezávislého [castille.GetBaseName], jemuž vládne [castille_char.Custom2('MyCharacterIntroduction' leon_char)], rozmetal nárok mého panství vydávat se za [asturias.GetBaseName].\n\nNaše východní země jsou definitivně ztraceny a nyní převládá vnitrozemská oblast [leon.GetBaseNameNoTier]. Lidé všech stavů i vyznání proto nechávají starý titul pomalu upadnout v zapomnění."
 title_event.0014.a: "Odštěpenci!"
 title_event.0014.b: "Jednou ty země získáme zpět..."
 title_event.0014.c: "Sláva! Celé #EMP království#! druhů!"
 title_event.0015.t: "$title_event.0012.t$"
 title_event.0015.desc: "Po nedávném vzniku [castille.GetBaseName] už nelze tvrdit, že [leon_char.Custom2('MyCharacterIntroduction', castille_char)] skutečně vládne sjednocenému [asturias.GetBaseNameNoTier].\n\nBez protiváhy mých zemí na východě už bývalé [asturias.GetBaseNameNoTierNoTooltip] není ve skutečnosti o mnoho víc než [leon.GetBaseName]. Rolníci, duchovní, a dokonce i šlechtici mu tak už začali říkat, k mé nemalé nelibosti."
 title_event.0015.a: "Moc je zpět tam, kam vždy patřila."
 title_event.0015.b: "Dnes Kastilie. Zítra #EMP León#!."
 title_event.0015.c: "Ve vládě jsme rozděleni, ale krev nás spojuje!"
