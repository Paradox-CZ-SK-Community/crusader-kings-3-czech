l_polish:
 trait_specific.1001.desc: "V poslední době se tu objevují podivní lidé a [ROOT.Char.Custom('GetCourt')|l] se jimi jen hemží – některé zahlédnu jen jako stíny koutkem oka, jiní se mihnou před mým zrakem a vzápětí jako by zmizeli.\n\nAť pátráním pověřím kohokoli, ty podivné lidi se nikdy nepodaří najít, zato jejich posměšky jsou čím dál dotěrnější!"
 trait_specific.1001.a: "Tamhle–! [Select_CString(ROOT.Char.IsFemale,'Přísahala','Přísahal')] bych, že..."
 trait_specific.1002.desc: "V poslední době se mi nedaří jasně přemýšlet – myšlenky se mi rozbíhají jako mraky po letní obloze.\n\nPtáci venku začali zpívat jinou melodii a [ROOT.Char.Custom('ResidenceBuilding')] teď zní jejich podivným zpěvem. Ostatní lidé schválně mluví v hádankách a #EMP nikdo#! nechce uznat, že koriandr je skutečně příšerné koření."
 trait_specific.1002.a: "Počkej, o čem jsem to vlastně [Select_CString(ROOT.Char.IsFemale,'přemýšlela','přemýšlel')]?"
 trait_specific.1010.t: "Propukající šílenství"
 trait_specific.1010.desc: "Celý poslední týden se točím ve spirále jako list v tornádu, pořád dokola, dokola, dokola. Co je skutečnost? Co je #EMP skutečné#!? Na to už nedokážu odpovědět.\n\nVím jen, že žena v oblacích mi rozumí – ale kroutící se stíny se každým dnem šíří dál a dál."
 trait_specific.1010.a: "Sápou se jako krysy... Kšá, pryč!"
 trait_specific.2001.t: "Nástup"
 trait_specific.2001.desc: "V žaludku se mi zvedá nevolnost. Snažím se vrátit, ale [ROOT.Char.Custom('GetChamber')] se mi přímo před očima smršťuje! C-co se to #EMP děje?!#!\n\nNajednou něco cítím... něco, co už jsem určitě [Select_CString(ROOT.Char.IsFemale,'cítila','cítil')], ale... #EMP kde#!? Někdo se mě ptá, jestli jsem v pořádku, ale nedokážu odpovědět, nedokážu vůbec nic..."
 trait_specific.2001.a: "Já... Jak dlouho jsem [Select_CString(ROOT.Char.IsFemale,'byla','byl')] pryč?"
 trait_specific.2002.desc: "V poslední době mívám jakési... záchvaty. Něco se mě zmocní, převezme vládu nad mým tělem a pak mě zanechá [Select_CString(ROOT.Char.IsFemale,'vyčerpanou a zmatenou','vyčerpaného a zmateného')].\n\nSnažím se to před ostatními skrývat a zatajit, ale těžko se ovládá něco, co si přichází a odchází, jak se mu zachce."
 trait_specific.2002.a: "Dívají se na mě, jako bych [Select_CString(ROOT.Char.IsFemale,'byla','byl')]... #EMP [Select_CString(ROOT.Char.IsFemale,'posedlá','posedlý')]#!."
 trait_specific.3001.desc: "Kolem hlavy mi prosviští zbloudilý šíp a já necítím #EMP vůbec nic#! – žádný strach, žádnou paniku, dokonce ani hněv.\n\nV poslední době se z toho stává znepokojivá samozřejmost – jako bych [Select_CString(ROOT.Char.IsFemale,'existovala','existoval')] za závěsem, který mě odděluje od pocitů i od světa, a jsem tak #EMP [Select_CString(ROOT.Char.IsFemale,'unavená','unavený')]#!..."
 trait_specific.3001.a: "Asi se vrátím do postele."
 trait_specific.3002.desc_opening: "Jaký to všechno má smysl? Proč den co den pořád dokola děláme totéž..."
 trait_specific.3999.t: "Šedivé dny"
 trait_specific.3999.desc: "Celý život mám pocit, že ke mně štěstí nepřichází tak snadno jako k ostatním, a teď je mi ten pocit stejně cizí jako vzduch rybě."
 trait_specific.3999.desc_end: "\n\nChybí mi motivace i energie. Můj život se propadá do šedivé otupělosti a mám pocit, že bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] panikařit, jenže už nedokážu ani to."
 trait_specific.3999.a: "Je toho na mě příliš..."
 trait_specific.4001.t: "Jiné čtení"
 trait_specific.4001.landed: "V zaprášeném koutě knihovny nacházím svazek"
 trait_specific.4001.adventurer: "V koutě ošuntělé truhly nacházím svazek"
 trait_specific.4001.desc: " – vázaný v kůži, popsaný podivnými symboly a částečně ukrytý za jinými knihami. Je starý, ale očividně ho někdo nedávno používal.\n\nKdyž jím začnu listovat, brzy mi dochází, že pojednává o poněkud... #EMP nekonvenčních#! znalostech."
 trait_specific.4001.a: "Zajímavé... Než se posadím ke čtení, rozhlédnu se kolem."
 trait_specific.4001.a_tt: "Snad tu není nikdo, kdo tu knihu v poslední době četl..."
 trait_specific.4001.b: "Kacířství! Ať se na to podívají [ROOT.Char.GetFaith.PriestNeuterPlural]."
 trait_specific.5001.t: "Labužník"
 trait_specific.5001.desc: "Srnčí, losí maso, křepelky... Na světě je tolik exotických chutí, které stojí za ochutnání!\n\nZa ta léta jsem [Select_CString(ROOT.Char.IsFemale,'ochutnala','ochutnal')] tolik vytříbených druhů masa, že si nemohu pomoci a přemýšlím, co dalšího tam venku ještě čeká. Jaké nové labužnické zážitky asi čekají na můj jazyk?"
 trait_specific.5001.a: "Musím ochutnat všechno!"
 trait_specific.5001.a.tt: "Budu hledat další exotické druhy masa"
 trait_specific.5001.b: "To, co mám tady, mi bohatě stačí."




 trait_specific.5002.desc: "Při pátrání po vzácných druzích masa se mi v hlavě uhnízdila jedna myšlenka. Sotva si ji dokážu přiznat i [Select_CString(ROOT.Char.IsFemale,'sama před sebou','sám před sebou')], ale nemohu se ubránit otázce, jak asi chutná #EMP lidské#! maso...\n\nKdyž jeden ze služebníků onemocní a ocitne se na prahu smrti, přistihnu se, jak nařizuji, aby byl svěřen do mé osobní péče."
 trait_specific.5002.a: "Odpusť mi – musím to zjistit!"
 trait_specific.5002.b: "Nebudu dělat nic než se modlit za jeho duši."
 trait_specific.5003.t: "Dohnáni do krajnosti"
 trait_specific.5003.desc: "Měl to být jen krátký výlet, příjemná projížďka krajinou. Jenže už celé dny jsme neviděli jediného živého člověka a zásoby nám dávno došly – dokonce jsme už snědli i koně.\n\nNáš průvodce slibuje, že do týdne dorazíme k civilizaci, ale někteří ze služebníků už jsou na pokraji sil a můj žaludek kručí s každou další hodinou hlasitěji."
 trait_specific.5003.a: "Udělám vše, co bude nutné, abych [Select_CString(ROOT.Char.IsFemale,'přežila','přežil')]..."
 trait_specific.5003.b: "Tohle zvládneme!"
 trait_specific.6001.t: "Jiné chutě"
 trait_specific.6001.desc: "V poslední době už mě obvyklé radovánky jaksi... #EMP neuspokojují#!. Lékaři mi doporučili různé masti, ale nic ve mně nedokáže zažehnout jiskru.\n\nS rostoucím zoufalstvím narazím u jednoho kupeckého stánku na několik knih ukrytých na dně hromady, které zachycují poněkud... neobvyklé praktiky. Nedokážu přestat obracet stránky a v klíně se mi začíná rozlévat žár."
 trait_specific.6001.a: "Nuže, pokud je tohle potřeba..."
 trait_specific.6001.b: "Na tohle mám příliš!"
 trait_specific.6002.t: "Experimentování"
 trait_specific.6002.desc: "Je tu se mnou [lover.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )]. Natahuji se blíž a [lover.Custom('GetUpperClothingArticle')] už skoro povoluje pod mými prsty, když se [lover.GetFirstNameNoTooltip] náhle odtáhne.\n\n„Už dlouho chci zkusit něco #EMP nového#!, [ROOT.Char.Custom('LoverPetName')],“ zazní mazlivě a [lover.GetFirstNameNoTooltip] se s potměšilým úsměvem natáhne pod postel.\n\nZpod postele se vynoří ruka svírající [ROOT.Char.Custom('DeviantObjectArticle')]. „Napadlo mě, že bychom mohli použít #EMP tohle#!.“"
 trait_specific.6002.a: "Tak dobře, nenech mě čekat!"
 trait_specific.6002.b: "Tebe přitahují věci jako... #EMP tohle?!#!"
 trait_specific.6002.b_known: "[Select_CString(ROOT.Char.IsFemale,'Věděla','Věděl')] jsem, že [lover.GetFirstNameNoTooltip] má podivné záliby, ale tohle?!"
 trait_specific.7001.t: "Do dna!"
 trait_specific.7001.desc: "Nic mě nedokáže uklidnit tak spolehlivě jako pořádný doušek [ROOT.Char.Custom('RegionalAlcoholicDrink')]. Po těžkém dni, po dobrém dni, po #EMP jakémkoli#! dni... Útěchu vždycky najdu na dně poháru."
 trait_specific.7001.a: "Přineste mi další!"
 trait_specific.7002.b: "Jsem silnější než tohle."
 trait_specific.8001.t: "Klíčící zájem"
 trait_specific.8001.desc: "Rozjařený kupec mi vtiskl do ruky pytlík semen – prý jde o rostliny, o kterých [ROOT.Char.Custom('RandomSheHe')] tvrdí, že posilují tělo i mysl.\n\nMusím přiznat, že s pěstováním rostlin mám jen málo zkušeností, ale jak těžké to může být?"
 trait_specific.8001.a: "Založím si z nich vlastní zahradu!"
 trait_specific.8001.a.success: "Vypěstuješ bujnou zahradu"
 trait_specific.8001.a.small_success: "Projekt selže, ale mnoho se při něm naučíš"
 trait_specific.8001.a.failure: "Semena odmítají vyklíčit"
 trait_specific.8002.b: "Určitě mají nějakou cenu..."
 trait_specific.9001.t: "Večerní rozjímání"
 trait_specific.9001.desc: "Upíjím z poháru [ROOT.Char.Custom('GetExpensiveDrink_Singular')] a očima přelétám své nejnovější verše.\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')|U]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\nVskutku patřím mezi největší umělecké duchy své doby!"
 trait_specific.9001.a: "Skvělé verše! O čem budu rozjímat příště?"
 trait_specific.9001.b: "Psaní je zábava, ale s tím #EMP rýmováním#! si nejsem [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')]."
 trait_specific.9001.c: "Možná si místo toho nechám připravit lázeň..."
 trait_specific.8501.t: "Neslušné posměšky"
 trait_specific.8501.desc: "Probírám poměrně vážné téma a naslouchají mi [ROOT.Char.Custom('GetCourtierPlural')], když si nemohu nevšimnout, že se [mean_courtier.GetTitledFirstName] pochechtává.\n\nTeprve když mi [mean_courtier.GetTitledFirstName] řekne, ať zopakuji slovo „neslušnost“, dojde mi, že se mi vysmívá kvůli šišlání."
 trait_specific.8501.a: "Je to hrubé, ale co nadělám?"
 trait_specific.8501.b: "Do žaláře s tebou!"
 trait_specific.8501.c: "Když ti to připadá tak směšné, možná by se ti vlastní šišlání zamlouvalo."
 trait_specific.8501.d: "Řekni to ještě jednou. Jen to zkus."
 trait_specific.8501.e: "Co takhle podívat se zblízka?"
 trait_specific.8501.f: "[ROOT.Char.GetFaith.HealthGodName] má ostatně také šišlavou výslovnost."
 trait_specific.8501.g: "Nebudeš #EMP věřit#!, co všechno s tímhle jazykem dokážu..."
 trait_specific.8501.d.tt: "Ty a [mean_courtier.GetTitledFirstName] svedete [Concept('single_combat_duel','souboj')|E]"
 trait_specific.8501.h: "Je všechno v pořádku?"
