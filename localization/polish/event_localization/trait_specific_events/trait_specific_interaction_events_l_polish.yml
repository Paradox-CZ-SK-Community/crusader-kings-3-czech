l_polish:
 send_poem_interaction: "Poslat báseň"
 send_poem_interaction_desc: "Pošli [recipient.GetTitledFirstNameNoTooltip] dojemné osobní dílo"
 send_poem_interaction.positive_auto_accept.tt: "Protože je tato báseň laděná pozitivně, může ji [recipient.GetFirstNameNoTooltip] přijmout okamžitě, pokud o tobě má dostatečně vysoké [Concept('opinion','mínění')|E]"
 SEND_POEM_ROMANCE: "Dílo o lásce"
 SEND_POEM_MOURNING: "Dílo o truchlení"
 SEND_POEM_LEGACY: "Dílo o odkazu"
 SEND_POEM_STRIFE: "Dílo o sváru"
 SEND_POEM_INCOMPETENCE: "Dílo o neschopnosti"
 send_poem_interaction.success: "Báseň sklízí chválu"
 send_poem_interaction.failure: "Báseň je terčem posměchu"
 trait_specific_interactions.000.generate_poem: "#POE [actor.Custom('GeneratePoem_Title')]#!\n[actor.Custom('GeneratePoem_Intro_Rhyming')]\n[actor.Custom('GeneratePoem_Outro_Rhyming')]"
 trait_specific_interactions.000.intro.part1: "[actor.GetTitledFirstName], [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], v poslední době slaví se svým nejnovějším dílem velký úspěch a [actor.Custom('GetCourt')] o něm mluví bez ustání:"
 trait_specific_interactions.000.intro.part3: "a [actor.GetFirstNameNoTooltip] jej veřejně [Select_CString(actor.IsFemale,'věnovala','věnoval')] #EMP mně.#!"
 trait_specific_interactions.000.outro: "Dosud jsem si své myšlenky [Select_CString(ROOT.Char.IsFemale,'nechávala','nechával')] pro sebe, ale rozruch kolem díla už nabral takových rozměrů, že ho dál nemohu ignorovat."
 trait_specific_interactions.0001.t: "Dotek lásky"
 trait_specific_interactions.0001.desc.intro: "$trait_specific_interactions.000.intro.part1$ dílo pojednává o lásce a milostných citech, $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0001.desc.poem: "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0001.desc.outro: "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0001.a: "Nevím, co si o tom vlastně myslet..."
 trait_specific_interactions.0001.b: "[actor.GetFirstNameNoTooltip], je vidět, že je to #EMP opravdu#! od srdce!"
 trait_specific_interactions.0001.c: "Pche, bláboly!"
 trait_specific_interactions.0011.t: "Útěcha ve verších"
 trait_specific_interactions.0011.desc.intro: "$trait_specific_interactions.000.intro.part1$ dílo pojednává o zármutku a ztrátě, $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0011.desc.poem: "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0011.desc.outro: "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0011.a: "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0011.b: "$trait_specific_interactions.0001.b$"
 trait_specific_interactions.0011.c: "$trait_specific_interactions.0001.c$"
 trait_specific_interactions.0021.t: "Verše o odkazu"
 trait_specific_interactions.0021.desc.intro: "$trait_specific_interactions.000.intro.part1$ dílo pojednává o paměti a tom, co po sobě zanecháváme, $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0021.desc.poem: "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0021.desc.outro: "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0021.a: "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0021.b: "$trait_specific_interactions.0001.b$"
 trait_specific_interactions.0031.t: "Vzestup navzdory sváru"
 trait_specific_interactions.0031.desc.intro: "$trait_specific_interactions.000.intro.part1$ dílo pojednává o úspěchu a cestě k velikosti, $trait_specific_interactions.000.intro.part3$"
 trait_specific_interactions.0031.desc.poem: "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0031.desc.outro: "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0031.a: "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0031.b: "$trait_specific_interactions.0001.b$"
 trait_specific_interactions.0041.t: "[Select_CString(recipient.IsFemale,'Podlá','Podlý')] [recipient.GetTitleAsNameNoTooltip]"
 trait_specific_interactions.0041.desc.intro: "$trait_specific_interactions.000.intro.part1$ dílo je hanlivé, pobuřující a #EMP výslovně#! věnované mně a mé „jedinečné směsi neschopnosti a inkontinence“."
 trait_specific_interactions.0041.desc.poem: "\n\n$trait_specific_interactions.000.generate_poem$\n\n"
 trait_specific_interactions.0041.desc.outro: "$trait_specific_interactions.000.outro$"
 trait_specific_interactions.0041.a: "$trait_specific_interactions.0001.a$"
 trait_specific_interactions.0041.b: "Hmmm. Ano. #EMP Jak. Zábavné.#!"
