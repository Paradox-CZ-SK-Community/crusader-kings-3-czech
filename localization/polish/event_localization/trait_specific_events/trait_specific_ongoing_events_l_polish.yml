l_polish:
 trait_specific_ongoing.1001.t: "Tříštivé odhalení"
 trait_specific_ongoing.1001.desc: "Pro jistotu udeřím rukama do rámu postele. Když se na ně podívám, na jedné spatřím prasklinu – mé obavy se naplnily! Jsem ze skla!\n\nBudu se muset pohybovat plynule a pomalu, žádné prudké pohyby, žádný vysoký zpěv..."
 trait_specific_ongoing.1001.a: "Ať na mě nikdo nesahá!"
 trait_specific_ongoing.1003.t: "Mějte se mnou medvědí trpělivost"
 trait_specific_ongoing.1003.desc: "Vcházím tam, kde mám [ROOT.Char.Custom('GetChamber')], a ocitám se tváří v tvář obrovské medvědici.\n\n„Ale, Cukřenko! Ty jsi opustila své přátele?“ ptám se a lákám ji, aby mě následovala.\n\nKdyž vyjdeme ven, zvedne se ohlušující kakofonie – všechna zvířata, která se mi podařilo získat, mě zdraví jednohlasně!"
 trait_specific_ongoing.1003.a: "Moji mazlíčci! Najdu vám ještě další kamarády!"
 trait_specific_ongoing.1003.a.flavor: "Když vycházíme ven, Cukřenka mě následuje"
 trait_specific_ongoing.1003.b: "Já... [Select_CString(ROOT.Char.IsFemale,'měla','měl')] bych je prodat, že ano?"
 trait_specific_ongoing.1004.t: "Malý uzlíček radosti"
 trait_specific_ongoing.1004.desc: "Na můj rozkaz mi přivádějí všechna zvířata, která se objeví v [court_location.Custom('BaronyTownType')] [court_location.GetNameNoTier].\n\n"
 trait_specific_ongoing.1004.desc_cat: "Služebníci mi přinášejí nejnovější úlovek v malém proutěném košíku. Přes jeho okraj vykukují [ROOT.Char.Custom('RandomCatEyeColor')] oči kotěte a zevnitř se ozve tiché mňouknutí."
 trait_specific_ongoing.1004.desc_dog: "Služebníci mi přinášejí nejnovější úlovek v malém proutěném košíku. Když nahlédnu dovnitř, spatřím štěně, které na mě zaštěká a začne vrtět ocasem!"
 trait_specific_ongoing.1004.a: "Tahle kočka je teď moje!"
 trait_specific_ongoing.1004.b: "Tenhle pes je teď můj!"
 trait_specific_ongoing.1004.c_cat: "Kočka! Prodejte ji do kuchyně."
 trait_specific_ongoing.1004.c_dog: "Pes! Prodejte ho do psince."
 trait_specific_ongoing.1005.t: "Návrat ze záhrobí: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_person'))|U]"
 trait_specific_ongoing.1005.desc: "Když za mlhavé noci kráčím venku, náhle se přede mnou zjeví přízrak a zahřmí mocným hlasem.\n\n„[ROOT.Char.GetFirstNameNoTooltip]! Už je to příliš dlouho!“\n\nJe to [dead_person.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_person') )]! Vždyť jsem [Select_CString(ROOT.Char.IsFemale,'byla přesvědčená','byl přesvědčený')], že [dead_person.GetDeathReason]!"
 trait_specific_ongoing.1005.a: "Ještě že ne!"
 trait_specific_ongoing.1006.desc: "Už celý rok mě den co den navštěvuje [dead_person.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('dead_person') )]. Trvá na tom, že se před všemi ostatními musí skrývat, ale lidé si začínají dělat starosti...\n\nJak se mám při takovém vyrušování soustředit na [ROOT.Char.Custom('child_object_of_interest')]?!"
 trait_specific_ongoing.1006.a: "Nech mě na pokoji!"
 trait_specific_ongoing.1007.t: "Sen ze skla"
 trait_specific_ongoing.1007.desc: "Po spánku tak hlubokém, že jsem v něm málem [Select_CString(ROOT.Char.IsFemale,'ztratila sama sebe','ztratil sám sebe')], se pomalu prodírám zpět k vědomí.\n\nZdálo se mi o obrovských tabulích skla, které mě ve víru hvězd nesly blíž ke slunci. [Select_CString(ROOT.Char.IsFemale,'Natáhla','Natáhl')] jsem se, jak nejdál to šlo, a podařilo se mi uchopit nebeské těleso v celé jeho planoucí nádheře – [Select_CString(ROOT.Char.IsFemale,'tahala','tahal')] jsem za něj, dokud se nezřítilo z oblohy a nespadlo na zem. Když jsem je [Select_CString(ROOT.Char.IsFemale,'sevřela','sevřel')] v náručí, [Select_CString(ROOT.Char.IsFemale,'pocítila','pocítil')] jsem klid a teplo, jaké jsem nikdy předtím [Select_CString(ROOT.Char.IsFemale,'nezažila','nezažil')]!"
 trait_specific_ongoing.1007.a: "Tak nádherné, tak velkolepé!"
 trait_specific_ongoing.1007.a.tt: "Nyní můžeš učinit rozhodnutí a postavit #bold Skleněný monument#!"
 trait_specific_ongoing.1008.t: "Ztráta reality "
 trait_specific_ongoing.1008.desc: "Trávím den s [friend.GetTitledFirstName], když se najednou všechno začne propadat do víru...\n\nOcelově šedá, krvavě rudá, křičící tvář, hluboká karmínová moře...\n\nKdyž se proberu, [friend.GetTitledFirstName] leží přede mnou bezvládně a já svírám zakrvácený nůž."
 trait_specific_ongoing.1008.a: "[friend.GetFirstNameNoTooltip]! Ach ne... Musím ukrýt tělo."
 trait_specific_ongoing.1008.b: "Musím se přiznat!"
 trait_specific_ongoing.1009.t: "[Select_CString(ROOT.Char.IsFemale,'Nezranitelná','Nezranitelný')]"
 trait_specific_ongoing.1009.desc: "„Nebojte se!“ křičím ze střechy budovy, abych [Select_CString(ROOT.Char.IsFemale,'uklidnila','uklidnil')] lidi shromážděné dole. „Nic mi nemůže ublížit!“\n\nElegantně seskočím z okraje a směju se, když mě při pádu zašimrá v břiše."
 trait_specific_ongoing.1009.a: "HAHAHA – AAAAAH!"
 trait_specific_ongoing.1009.a.success: "Dopadnu na nohy"
 trait_specific_ongoing.1009.a.failure: "Nejsem tak [Select_CString(ROOT.Char.IsFemale,'nezranitelná','nezranitelný')], jak jsem si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]"
 trait_specific_ongoing.1010.t: "Můj kůň [ROOT.Char.Custom('WarhorseStoryName')]"
 trait_specific_ongoing.1010.desc: "Můj nádherný válečný kůň [ROOT.Char.Custom('WarhorseStoryName')] mě lehce nese před shromážděným [ROOT.Char.Custom('GetCourt')].\n\n„Tenhle kůň je dokonalý! Každý z vás stráví alespoň hodinu denně péčí o něj, ať už výcvikem, nebo hřebelcováním. Je mi dražší než kdokoli jiný. Rozchod!“"
 trait_specific_ongoing.1010.a: "Všichni se před ním budou klanět!"
 trait_specific_ongoing.1011.t: "Zákon na míru"
 trait_specific_ongoing.1011.desc: "Když pořádám audienci, neustále mě rozptylují nádherné oděvy všech kolem. Přepychové látky, drahokamy – pche!\n\nProč se vůbec tolik snaží? Copak nevědí, že jim stejně vidím až do nitra? Všechno by bylo jednodušší, kdyby někdo prostě... zakázal oblečení.\n\n...Počkat."
 trait_specific_ongoing.1011.a: "Oblečení je odteď zakázáno. Všechno dolů!"
 all_adult_courtiers: "Všichni dospělí dvořané"
 trait_specific_ongoing.1012.t: "Vidiny temnoty"
 trait_specific_ongoing.1012.desc: "Vůbec si nepamatuji, že by se něco takového stalo, ale když se vrátím tam, kde mám [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('GetCourtierPlural')] mi všechno povědí.\n\nPrý běhám sem a tam a varuji lidi, že přicházejí netopýři. Tolik netopýrů, že zastíní slunce a odnesou [capital.GetNameNoTier] na nějaké příšerné místo, kam nedosáhne ani [ROOT.Char.GetFaith.PositiveAfterLife]."
 trait_specific_ongoing.1012.a: "Co se to se mnou děje..."
 trait_specific_ongoing.1012.b: "Až přijdou, budu [Select_CString(ROOT.Char.IsFemale,'připravena','připraven')]!"
 trait_specific_ongoing.2001.t: "Poselství z druhé strany"
 trait_specific_ongoing.2001.start.desc: "Vím, že přicházejí, ještě než je spatřím. Náhle mě zaplaví"
 trait_specific_ongoing.2001.dread.desc: "hrůza,"
 trait_specific_ongoing.2001.anxiety.desc: "úzkost,"
 trait_specific_ongoing.2001.euphoria.desc: "euforie,"
 trait_specific_ongoing.2001.joy.desc: "radost,"
 trait_specific_ongoing.2001.nausea.desc: "nevolnost,"
 trait_specific_ongoing.2001.walls.desc: "pocit, že se kolem mě [ROOT.Char.Custom('GetChamber')] svírá,"
 trait_specific_ongoing.2001.sulfur.desc: "ostrý pach síry"
 trait_specific_ongoing.2001.smoke.desc: "štiplavý pach kouře"
 trait_specific_ongoing.2001.citrus.desc: "ostrá citrusová chuť na jazyku"
 trait_specific_ongoing.2001.lavender.desc: "svěží závan levandule"
 trait_specific_ongoing.2001.bile.desc: "štiplavý pach žluči"
 trait_specific_ongoing.2001.incense.desc: "těžká vůně kadidla"
 trait_specific_ongoing.2001.blood.desc: "kovový pach krve"
 trait_specific_ongoing.2001.stand_before_me.desc: "– a pak stojí přede mnou.\n\n[ROOT.Char.Custom('one_syllable_number')|U]"
 trait_specific_ongoing.2001.glowing.desc: "zjevení ze světla,"
 trait_specific_ongoing.2001.hazy.desc: "zjevení v mlze,"
 trait_specific_ongoing.2001.dark.desc: "zjevení ze tmy,"
 trait_specific_ongoing.2001.shaking.desc: "zjevení v křečovitém chvění,"
 trait_specific_ongoing.2001.shimmering.desc: "zjevení v mihotavé záři,"
 trait_specific_ongoing.2001.speaking.desc: "jejichž hlas připomíná"
 trait_specific_ongoing.2001.whispers.desc: "šepot."
 trait_specific_ongoing.2001.screeches.desc: "skřeky."
 trait_specific_ongoing.2001.chimes.desc: "zvonění."
 trait_specific_ongoing.2001.raindrops.desc: "dopadající kapky deště."
 trait_specific_ongoing.2001.thunder.desc: "hromobití."
 trait_specific_ongoing.2001.end.desc: "Co jsou ty bytosti zač a co ode mě chtějí?"
 trait_specific_ongoing.2001.a: "Musí to být poslové! Za jejich příchodem jistě stojí [ROOT.Char.GetFaith.HighGodName]!"
 trait_specific_ongoing.2001.a.success: "Přesvědčíš postavu [clergy.GetCouncilTitle] [clergy.GetShortUIName], že tvé vidiny jsou posvátné"
 trait_specific_ongoing.2001.a.failure: "Postavu [clergy.GetCouncilTitle] [clergy.GetShortUIName] tvé vyprávění znepokojí"
 trait_specific_ongoing.2001.b: "Tohle je něco jiného, nějaká hlubší moc, a já ji #EMP chci#!."
 trait_specific_ongoing.2001.c: "Já... jsem prostě [Select_CString(ROOT.Char.IsFemale,'unavená','unavený')]. Musím se o sebe lépe starat."
 trait_specific_ongoing.2001.b.success: "Odhalíš tajné vědění"
 trait_specific_ongoing.2001.b.success.tt: "Dostaneš na výběr: přijmout nové pravdy, nebo říci, že [clergy.GetFaith.HighGodName] je stále tvým nejvyšším božstvem"
 trait_specific_ongoing.2001.b.failure: "Najdeš několik zajímavých, ale docela obyčejných knih"
 trait_specific_ongoing.2002.desc: "Pátrání po vědění, které mi poslové přislíbili, mě zavedlo na neobvyklá místa. Temné uličky, pochybné krčmy, zaprášená knihkupectví – až tam, kam se [ROOT.Char.GetTitleAsNameNoTooltip] běžně nevydává, a odměna vskutku stála za to.\n\n[Select_CString(ROOT.Char.IsFemale,'Objevila','Objevil')] jsem řadu svazků o temné moci. Podle nich ji propůjčuje [ROOT.Char.GetFaith.WitchGodName] těm, kdo tomuto božstvu slouží. Pokušení je silné, to nemohu popřít."
 trait_specific_ongoing.2002.a: "Ó [ROOT.Char.GetFaith.WitchGodMistressMaster] temnot, přijmi mou pokornou službu!"
 trait_specific_ongoing.2002.b: "Tohle mi přerůstá přes hlavu. Je to příliš nebezpečné."
 trait_specific_ongoing.2003.desc: "Při pátrání po skrytém vědění jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')] spoustu zajímavých svazků, ale nic skutečně výjimečného.\n\nObávám se, že mé chápání vůle těch podivných bytostí bylo mylné – nebo že celé to bylo jen výplodem mé mysli!"
 trait_specific_ongoing.2003.a: "Zahrává si se mnou vlastní mysl?"
 trait_specific_ongoing.2010.t: "Božské zaměření"
 trait_specific_ongoing.2010.possessed_start.desc: "Často ke mně přicházejí poselství od tří posvátných bytostí. Zjevují se mi téměř každou noc, tváře zahalené božským světlem. Myslím, že musí být duchy spojenými s těmito božstvy:"
 trait_specific_ongoing.2010.zeal_start.desc: "Už asi měsíc se mi vrací sen, v němž vedu teologickou rozpravu o těchto božstvech:"
 trait_specific_ongoing.2010.health.desc: "[ROOT.Char.GetFaith.HealthGodName],"
 trait_specific_ongoing.2010.fertility.desc: "[ROOT.Char.GetFaith.FertilityGodName],"
 trait_specific_ongoing.2010.wealth.desc: "[ROOT.Char.GetFaith.WealthGodName],"
 trait_specific_ongoing.2010.household.desc: "[ROOT.Char.GetFaith.HouseholdGodName],"
 trait_specific_ongoing.2010.knowledge.desc: "[ROOT.Char.GetFaith.KnowledgeGodName],"
 trait_specific_ongoing.2010.war.desc: "[ROOT.Char.GetFaith.WarGodName],"
 trait_specific_ongoing.2010.trickster.desc: "[ROOT.Char.GetFaith.TricksterGodName],"
 trait_specific_ongoing.2010.and_health.desc: "a [ROOT.Char.GetFaith.HealthGodName]."
 trait_specific_ongoing.2010.and_fertility.desc: "a [ROOT.Char.GetFaith.FertilityGodName]."
 trait_specific_ongoing.2010.and_wealth.desc: "a [ROOT.Char.GetFaith.WealthGodName]."
 trait_specific_ongoing.2010.and_household.desc: "a [ROOT.Char.GetFaith.HouseholdGodName]."
 trait_specific_ongoing.2010.and_knowledge.desc: "a [ROOT.Char.GetFaith.KnowledgeGodName]."
 trait_specific_ongoing.2010.and_war.desc: "a [ROOT.Char.GetFaith.WarGodName]."
 trait_specific_ongoing.2010.and_trickster.desc: "a [ROOT.Char.GetFaith.TricksterGodName]."
 trait_specific_ongoing.2010.end.desc: "\n\nMožná právě já mám šířit jejich slovo a oni mě na oplátku odmění svým požehnáním? Komu zasvětím své modlitby?"
 trait_specific_ongoing.2010.health: "[ROOT.Char.GetFaith.HealthGodName]: zdraví a dlouhý život."
 trait_specific_ongoing.2010.fertility: "[ROOT.Char.GetFaith.FertilityGodName]: nový život a plodnost."
 trait_specific_ongoing.2010.wealth: "[ROOT.Char.GetFaith.WealthGodName]: bohatství a hojnost."
 trait_specific_ongoing.2010.household: "[ROOT.Char.GetFaith.HouseholdGodName]: šťastná rodina."
 trait_specific_ongoing.2010.household.tt: "Týká se všech tvých [Concept('close_family_members','členů blízké rodiny')|E] a [Concept('spouses','chotí')|E]"
 trait_specific_ongoing.2010.knowledge: "[ROOT.Char.GetFaith.KnowledgeGodName]: vědění a moudrost."
 trait_specific_ongoing.2010.war: "[ROOT.Char.GetFaith.WarGodName]: síla v boji."
 trait_specific_ongoing.2010.trickster: "[ROOT.Char.GetFaith.TricksterGodName]: důvtip a štěstí."
 trait_specific_ongoing.2010.fallback: "Nemohu si namlouvat, že jsem [Select_CString(ROOT.Char.IsFemale,'vyvolená','vyvolený')]."
 trait_specific_ongoing.2015.t: "[ROOT.Char.GetFaith.HighGodName] přináší uzdravení"
 trait_specific_ongoing.2015.desc: "[ROOT.Char.GetFaith.HouseOfWorship] se mi před očima začíná kroutit a sloupy se ohýbají, když se mě zmocní další záchvat. Nevydám ani hlásku, ale vím, že [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] pozná, že něco není v pořádku.\n\nJakmile skončí [ROOT.Char.Custom('GetReligiousRite')], [chaplain.GetFirstNameNoTooltip] ke mně přistoupí s ustaraným výrazem. „Za tím musí stát [ROOT.Char.GetFaith.DevilName] a přisluhovači této temné síly, kteří se zmocňují tvého těla, [ROOT.Char.Custom('FormOfAddressForLiege')]. Spásu ti může přinést jedině [ROOT.Char.GetFaith.HighGodName], než bude příliš pozdě!“"
 trait_specific_ongoing.2015.physician.desc: "\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zřejmě všechno [Select_CString(physician.IsFemale,'zaslechla','zaslechl')]. „Co [ROOT.Char.GetTitleAsNameNoTooltip|l] potřebuje, je klid a odpočinek, ne výhrůžky zatracením!“"
 trait_specific_ongoing.2015.a: "Modlitbou zaženu temnotu."
 trait_specific_ongoing.2015.a.success: "Modlitby zabírají"
 trait_specific_ongoing.2015.a.failure: "Tvé záchvaty nepřestávají"
 trait_specific_ongoing.2015.b: "Půst očistí mou duši."
 trait_specific_ongoing.2015.b.success: "Půst zabírá"
 trait_specific_ongoing.2015.b.failure_health: "Půst tě oslabí"
 trait_specific_ongoing.2015.b.failure_eating: "Přísná pravidla ti působí potíže"
 trait_specific_ongoing.2015.b.failure_eating.tt: "Tvůj vztah k jídlu se změní"
 trait_specific_ongoing.2015.c: "Co navrhuješ, [physician.GetFirstNameNoTooltip]?"
 trait_specific_ongoing.2015.c.success: "Léčba lékaře zabírá"
 trait_specific_ongoing.2015.e: "Nechte mě na pokoji!"
 trait_specific_ongoing.2016.physician1.desc: "[physician.GetTitledFirstName] mi [Select_CString(physician.IsFemale,'doporučila','doporučil')] hodně odpočívat a vyhýbat se lesklým předmětům, hlasitým zvukům a extrémnímu počasí."
 trait_specific_ongoing.2016.physician2.desc: "\n\nRada očividně zabrala, protože od té doby jsem [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] žádný záchvat!"
 trait_specific_ongoing.2016.fasting1.desc: "[chaplain.GetTitledFirstName] mi [Select_CString(chaplain.IsFemale,'nařídila','nařídil')], abych [Select_CString(ROOT.Char.IsFemale,'jedla','jedl')] pouze jedno malé jídlo večer, a [Select_CString(chaplain.IsFemale,'dala','dal')] mi dlouhý seznam potravin, kterým se mám vyhýbat. Mléčné výrobky, maso, vejce, sladkosti, alkohol, oleje, ostré koření, zelenina rostoucí pod zemí..."
 trait_specific_ongoing.2016.fasting2.desc: "\n\nDodržovat tak přísný režim bylo obtížné, ale očividně zabral, protože od té doby jsem [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] žádný záchvat!"
 trait_specific_ongoing.2016.prayer1.desc: "[chaplain.GetTitledFirstName] mi [Select_CString(chaplain.IsFemale,'nařídila','nařídil')] věnovat alespoň tři hodiny denně soustředěné modlitbě a [Select_CString(chaplain.IsFemale,'odkázala','odkázal')] mě na tucet pasáží v [ROOT.Char.GetFaith.ReligiousText], které mám dále studovat."
 trait_specific_ongoing.2016.prayer2.desc: "\n\nMá oddanost byla odměněna, protože od té doby jsem [Select_CString(ROOT.Char.IsFemale,'neměla','neměl')] žádný záchvat!"
 trait_specific_ongoing.2016.a.physician: "Děkuji ti, [physician.GetFirstNameNoTooltip]!"
 trait_specific_ongoing.2016.a.chaplain: "[ROOT.Char.GetFaith.HighGodName] je mocné božstvo!"
 trait_specific_ongoing.2017.prayer2.desc: "\n\n[Select_CString(ROOT.Char.IsFemale,'Snažila','Snažil')] jsem se ze všech sil, ale zřejmě nejsem [Select_CString(ROOT.Char.IsFemale,'hodna','hoden')] milosrdenství. [ROOT.Char.GetFaith.HighGodName] mi je neprokazuje a mé záchvaty přicházejí stejně často jako dřív."
 trait_specific_ongoing.2017.physician2.desc: "\n\n[Select_CString(ROOT.Char.IsFemale,'Snažila','Snažil')] jsem se ze všech sil řídit radou, kterou mi [physician.GetTitledFirstName] [Select_CString(physician.IsFemale,'dala','dal')], ale mé záchvaty přicházejí stejně často jako dřív."
 trait_specific_ongoing.2017.a: "Možná jsem něco [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] špatně?"
 trait_specific_ongoing.2018.fasting2.desc: "\n\n[Select_CString(ROOT.Char.IsFemale,'Snažila','Snažil')] jsem se ze všech sil dodržovat přísný režim, ale cítím se jen slabší. Záchvaty přicházejí stejně často jako dřív a vyčerpání, které po nich následuje, zvládám ještě hůř."
 trait_specific_ongoing.2018.a: "Vzdávám to. Potřebuji sílu."
 trait_specific_ongoing.2019.fasting2.desc: "\n\nPravidla se dodržují těžko a přistihuji se, že posedle řeším každý sebemenší detail. Jídlo mi neustále zaměstnává mysl."
 trait_specific_ongoing.2019.a: "Nikdo se nedozví, když pravidla poruším... Jen trošičku!"
 trait_specific_ongoing.2019.b: "Nesmím selhat – v sázce je příliš mnoho!"
 trait_specific_ongoing.2020.t: "Známý pocit"
 trait_specific_ongoing.2020.a: "Už zase! #EMP Odmítám#!! Tohle se #EMP neděje#!..."
 trait_specific_ongoing.2020.start.desc: "Náhle mě zaplaví"
