 trait_specific_ongoing.2020.nausea.desc: "nevolnost"
 trait_specific_ongoing.2020.anger.desc: "hněv"
 trait_specific_ongoing.2020.end.desc: "a podlaha se mi pod nohama začne kroutit a prohýbat. Přestože mě to už nějakou dobu nechávalo na pokoji, okamžitě poznávám známé příznaky.\n\nPrchám do svých komnat dřív, než se rozpláču – nebo úplně ztratím vládu nad vlastním tělem..."
 trait_specific_ongoing.2025.t: "Není kam se skrýt"
 trait_specific_ongoing.2025.start.desc: "Někdo přede mnou vypadá podivně. Tvář je zkřivená... nebo se snad kroutí? Je to vůbec člověk?\n\nRealita sebou #EMP škubne#! a já si uvědomím, že přichází další [ROOT.Char.Custom('PossessedEpisode')] – přímo před shromážděným [ROOT.Char.Custom('GetCourt')]. Když mi"
 trait_specific_ongoing.2025.end.desc: "naplní chřípí, pokouším se promluvit, ale rty se mi ani nepohnou."
 trait_specific_ongoing.2025.a: "Musím odsud pryč, než se to zhorší!"
 trait_specific_ongoing.2025.b: "Jsem [ROOT.Char.GetTitleAsNameNoTooltip] – je mi jedno, co si myslí."
 trait_specific_ongoing.2025.b.success: "Na tvé [ROOT.Char.Custom('GetCourtierPlural')] zapůsobí tvá odvaha"
 trait_specific_ongoing.2025.b.failure: "Tvé [ROOT.Char.Custom('GetCourtierPlural')] to odpuzuje"
 trait_specific_ongoing.2025.c: "Kde je [helper.GetFirstNameNoTooltip]? Potřebuji pomoc!"
 trait_specific_ongoing.2025.d: "[ROOT.Char.GetFaith.HighGodName] za tím poselstvím jistě stojí! Řeknu jim to!"
 trait_specific_ongoing.2025.d.success: "Tví [ROOT.Char.Custom('GetCourtierPlural')] ti uvěří"
 trait_specific_ongoing.2025.d.failure: "Tví [ROOT.Char.Custom('GetCourtierPlural')] si myslí, že lžeš"
 trait_specific_ongoing.2025.e: "[Select_CString(ROOT.Char.IsFemale,'Mohla bych','Mohl bych')] předstírat, že za tím viděním stojí [ROOT.Char.GetFaith.HighGodName]..."
 trait_specific_ongoing.2025.e.failure: "Tví [ROOT.Char.Custom('GetCourtierPlural')] tvůj podvod prohlédnou"
 trait_specific_ongoing.2025.every_courtier: "Každý [actor.Custom('GetCourtier')]"
 trait_specific_ongoing.3001.t: "Sdílené trápení"
 trait_specific_ongoing.3001.desc: "Když domluvím ke shromážděným [ROOT.Char.Custom('GetCourt')], zatímco se lidé ještě rozcházejí a postávají kolem, přistoupí ke mně [sympathetic_character.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('sympathetic_character') )].\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], slyším, že i tebe čas od času sužuje... melancholie. Možná bychom si mohli promluvit o tom, co prožíváme?“"
 trait_specific_ongoing.3001.a: "Pojď, máme si o čem povídat."
 trait_specific_ongoing.3001.b: "Já žádné takové problémy nemám! O čem to mluvíš?!"
 trait_specific_ongoing.3001.b.tt: "Ahaha... ha."
 trait_specific_ongoing.3002.t: "Dlouhodobá řešení"
 trait_specific_ongoing.3002.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ osloví mě jednoho večera [court_physician.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))]. „Mám několik prostředků, které bychom mohli vyzkoušet proti tvé neodbytné melancholii. Než se to zlepší, možná se to trochu zhorší, ale za pokus to stojí!“"
 trait_specific_ongoing.3002.a: "Udělám cokoli, abych se toho [Select_CString(ROOT.Char.IsFemale,'zbavila','zbavil')]."
 trait_specific_ongoing.3002.b: "Potřebuji jen dlouhý spánek. Nebo tři."
 trait_specific_ongoing.3003.desc: "„Při léčbě takových neduhů je velmi důležité nechat špatné myšlenky vyjít ven,“ ujišťuje mě [court_physician.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))]. „Přijď za mnou několikrát týdně a budeme si povídat o tom, co tě tíží.“"
 trait_specific_ongoing.3003.a: "Udělám si na to čas."
 trait_specific_ongoing.3003.b: "Tohle všechno je na mě příliš – vrátím se do postele."
 trait_specific_ongoing.3004.desc: "„Aby ses cítil lépe, musíme pracovat jak s tvými myšlenkami, tak s tvými návyky,“ vysvětluje mi [court_physician.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))]. „Pomohu ti rozpoznat negativní myšlenky a zvyky a společně se je pokusíme změnit.“"
 trait_specific_ongoing.3004.a: "To dává smysl!"
 trait_specific_ongoing.3005.desc: "„Pohyb a tělesná aktivita účinně pomáhají udržovat tělesné šťávy v rovnováze,“ říká mi [court_physician.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))]. „Každý den třikrát obejdeš [ROOT.Char.Custom('ResidenceBuilding')].“"
 trait_specific_ongoing.3005.a: "Udělám, co budu moci."
 trait_specific_ongoing.3006.desc: "„Tyto chmurné myšlenky a melancholie jsou zjevně dílem zlých duchů či démonů,“ říká mi [court_physician.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))]. „Pověříme [ROOT.Char.Custom('DefaultPriestTitle')], aby se nad tebou modlil a vypudil zlo, které v sobě nosíš.“"
 trait_specific_ongoing.3006.a: "[ROOT.Char.GetFaith.HighGodName] mě svou mocí uzdraví!"
 trait_specific_ongoing.3007.desc: "Po všem, čím mě [court_physician.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] – [Select_CString(court_physician.IsFemale,'provedla','provedl')], mi pomalu dochází, že zase něco #EMP cítím#!."
 trait_specific_ongoing.3007.desc_ending: "\n\nJako když slunce prorazí hustou vrstvu mraků, cítím, jak se mi do duše vrací štěstí."
 trait_specific_ongoing.3007.a: "Já... já jsem [Select_CString(ROOT.Char.IsFemale,'šťastná','šťastný')]!"
 trait_specific_ongoing.3008.desc_physician_died: "[court_physician.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] – [Select_CString(court_physician.IsFemale,'zemřela','zemřel')] dřív, než mohla být léčba mé melancholie dokončena, ale zanechané pokyny mi umožnily dokončit ji vlastními silami."
 trait_specific_ongoing.3008.desc_no_depression: "Nemusím už pokračovat v režimu, který mi [court_physician.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] – [Select_CString(court_physician.IsFemale,'stanovila','stanovil')], abych se [Select_CString(ROOT.Char.IsFemale,'zbavila','zbavil')] melancholie, protože už tímto neduhem netrpím!"
 trait_specific_ongoing.3008.desc_fallback: "[court_physician.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] – ještě [Select_CString(court_physician.IsFemale,'nedokončila','nedokončil')] léčbu mé melancholie, ale cítím, jak mě temnota opouští."
 trait_specific_ongoing.3009.t: "Těžké dny"
 trait_specific_ongoing.3009.desc: "Jeden den neúprosně střídá druhý, zatímco se má mysl topí ve vyčerpání a beznaději.\n\nNěkdy je pro mě příliš i jen ráno vstát z postele."
 trait_specific_ongoing.3009.a: "Musím si jen lehnout..."
 trait_specific_ongoing.3015.t: "Jízlivé poznámky"
 trait_specific_ongoing.3015.start.desc: "Ať už jde o sarkastickou poznámku nebo nesouhlasný pohled, [unsympathetic.Custom2('MyCharacterIntroduction', ROOT.Char)] neustále dává najevo pohrdání mým stavem. Když"
 trait_specific_ongoing.3015.council.desc: "spěchám na zasedání rady, zase pozdě,"
 trait_specific_ongoing.3015.withdraw.desc: "se zvedám, abych [Select_CString(ROOT.Char.IsFemale,'odešla','odešel')] od večeře dřív,"
 trait_specific_ongoing.3015.book.desc: "zjistím, že u sebe nemám knihu, kterou mi [unsympathetic.GetTitledFirstNameNoTooltip] [Select_CString(unsympathetic.IsFemale,'půjčila','půjčil')],"
 trait_specific_ongoing.3015.end.desc: "přesně vím, co přijde.\n\n„Proč mě to ještě vůbec překvapuje,“ povzdechne si [unsympathetic.GetTitledFirstNameNoTooltip] a mně poklesne srdce. "
 trait_specific_ongoing.3015.a: "Dokážu, že se ve mně mýlí!"
 trait_specific_ongoing.3015.b: "„Mlč, ty [unsympathetic.Custom2('InsultAdjective', ROOT.Char)] [unsympathetic.Custom2('InsultNoun', ROOT.Char)]!“"
 trait_specific_ongoing.3015.c: "Má pravdu. Jsem k ničemu..."
 trait_specific_ongoing.3015.a.success: "Překonám svou malátnost"
 trait_specific_ongoing.3015.a.neutral: "Jsem stále [Select_CString(ROOT.Char.IsFemale,'unavená','unavený')]"
 trait_specific_ongoing.3015.a.failure: "Přepínání sil mě vyčerpává"
 trait_specific_ongoing.5001.t: "Masové dostaveníčko"
 trait_specific_ongoing.5001.desc_opening: "Noc pokročila, [ROOT.Char.Custom('GetCourt')] pomalu utichá a ostatní se už odebrali ke spánku. Jen [victim.GetTitledFirstName] se mnou zůstává o samotě.\n\n"
 trait_specific_ongoing.5001.desc_small: "Během hovoru si nemohu nevšímat šlachovitých paží postavy [victim.GetTitledFirstNameNoTooltip] a napjatého masa pod kůží..."
 trait_specific_ongoing.5001.desc_big: "Během hovoru si nemohu nevšímat baculatých paží postavy [victim.GetTitledFirstNameNoTooltip], masa a tuku spočívajících v lákavých záhybech..."
 trait_specific_ongoing.5001.desc: "Během hovoru si nemohu nevšímat kůže postavy [victim.GetTitledFirstNameNoTooltip] a pohybu masa pod ní..."
 trait_specific_ongoing.5001.a: "Půlnoční svačinka by přišla vhod."
 trait_specific_ongoing.5001.b: "„Prosím, [victim.GetFirstNameNoTooltip], pokračuj.“"
 trait_specific_ongoing.5002.desc: "Zbytek dvora se už odebral ke spánku a [murderer.GetTitledFirstName] se mnou zůstává o samotě.\n\nJak noc pokračuje, [murderer.GetTitledFirstNameNoTooltip] je čím dál dychtivější a pohledem neustále přejíždí po každém odhaleném místě mého těla. Právě když se chystám zeptat, co to má znamenat, [murderer.GetTitledFirstNameNoTooltip] vytáhne nůž a usměje se."
 trait_specific_ongoing.5002.a: "Ne, ne, prosím– NE! ÁÁÁH!"
 trait_specific_ongoing.5003.t: "Pokušení těla"
 trait_specific_ongoing.5003.desc_opening: "Mou pozornost upoutá [servant.GetTitledFirstName] – tvar paží, křivka krku... Když se nám podaří zůstat o samotě mezi zásobami jídla, [servant.GetFirstNameNoTooltip] se mě s koketním úsměvem zeptá, co si přeji.\n\n„Toužím po tvém těle,“ odpovím a přitisknu se blíž."
 trait_specific_ongoing.5003.desc_big: "„Je tak baculaté – tak plné #EMP života#!!“"
 trait_specific_ongoing.5003.desc: "„Je tak plné #EMP života#!!“"
 trait_specific_ongoing.5003.a: "Jediným plynulým pohybem podříznu [servant.GetFirstNameNoTooltip] hrdlo."
 trait_specific_ongoing.5003.b: "Rozhrnu [servant.Custom('GetUpperClothingArticle')], které má [servant.GetFirstNameNoTooltip] na sobě."
 trait_specific_ongoing.5004.t: "Zastávka na svačinu"
 trait_specific_ongoing.5004.desc: "Když se svou družinou cestuji přes [county.GetNameNoTier], narazíme na osamělý dům, v němž žije úplně sama stará žena.\n\nPožádám družinu, aby počkala opodál, a do domu vejdu bez doprovodu."
 trait_specific_ongoing.5004.a: "Prosím, paní, podejte mi ruku!"
 trait_specific_ongoing.5004.b: "Tak povídejte, jak se vám tady daří?"
 trait_specific_ongoing.5005.t: "Pozdní svačinka"
 trait_specific_ongoing.5005.desc: "Pozdě večer narazím na [courtier.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))] – jak si zdřímá.\n\nNikdy předtím jsem si toho [Select_CString(ROOT.Char.IsFemale,'nevšimla','nevšiml')], ale to tělo vypadá opravdu k nakousnutí..."
 trait_specific_ongoing.5005.a: "Je toho #EMP skoro#! víc, než dokážu strávit!"
 trait_specific_ongoing.5005.b: "[courtier.GetFirstNameNoTooltip] raději vzbudím – tady se nedá pohodlně spát."
 trait_specific_ongoing.6001.t: "Se staženými kalhotami"
 trait_specific_ongoing.6001.desc: "Než se setkám s [lover.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lover') )] – chci se trochu navnadit, a tak vytáhnu [ROOT.Char.Custom('DeviantObjectArticle')] – #EMP ach...!#!\n\nTak mě pohltí zkoumání všech možností použití, že vůbec neslyším, jak někdo vstoupí do [ROOT.Char.Custom('GetRoom')]. Zato hlasité zalapání po dechu postavy [lover.GetFirstNameNoTooltip] už přeslechnout nedokážu, když zjistí, co právě dělám."
 trait_specific_ongoing.6001.a: "Mám ještě jeden... Nechceš se přidat?"
 trait_specific_ongoing.6001.a.success: "[lover.GetFirstNameNoTooltip] to zaujme"
 trait_specific_ongoing.6001.a.failure: "[lover.GetFirstNameNoTooltip] nesdílí tvůj... vkus"
 trait_specific_ongoing.6001.b_woman: "Já... L– lékař mi to doporučil pro posílení životní síly!"
 trait_specific_ongoing.6001.b_man: "Já... L– lékař mi to doporučil pro posílení mužnosti!"
 trait_specific_ongoing.6002.t: "Zvrhlá vrchnost"
 trait_specific_ongoing.6002.desc: "Když jdu navštívit [liege.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege') )] – zavedou mě do soukromých komnat.\n\nOtevřu dveře a spatřím [liege.GetTitledFirstNameNoTooltip] ve víru rozkoše za pomoci [ROOT.Char.Custom('DeviantObjectArticle')] – ani jsem [Select_CString(ROOT.Char.IsFemale,'netušila','netušil')], že se to dá použít právě takhle!"
 trait_specific_ongoing.6002.a: "Ó, ó, ó, tak #EMP tohle#! je zajímavé!"
 trait_specific_ongoing.6002.b: "Ach, tohle... tohle vypadá #EMP zajímavě#!."
 trait_specific_ongoing.6002.c: "Co to má znamenat?!"
 trait_specific_ongoing.6002.d: "Já raději půjdu."
 trait_specific_ongoing.6003.t: "Zvrhlost"
 trait_specific_ongoing.6003.desc_opening: "Právě se oddávám rozkoši za pomoci [ROOT.Char.Custom('DeviantObjectArticle')], když do místnosti vstoupí [vassal.GetTitledFirstName] – [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal') )].\n\n"
 trait_specific_ongoing.6003.desc_deviant: "Oči postavy [vassal.GetTitledFirstNameNoTooltip] se rozšíří – ne odporem, ale zájmem. „Nikdy mě nenapadlo použít to #EMP takhle#!. To je inspirace!“"
 trait_specific_ongoing.6003.desc_joined: "Vidím, jak [vassal.GetTitledFirstNameNoTooltip] zaváhá, pak ale zavře dveře a vstoupí dovnitř. „Ach, [liege.GetTitledFirstNameNoTooltip], to vypadá... To vypadá #EMP zajímavě#!! Pojď, pomohu ti.“"
 trait_specific_ongoing.6003.desc_exposed: "[vassal.GetTitledFirstNameNoTooltip] zděšeně rozrazí dveře dokořán. „[liege.GetTitledFirstNameNoTooltip], co to má znamenat?!“"
 trait_specific_ongoing.6003.desc_ew: "[vassal.GetTitledFirstNameNoTooltip] zděšeně vycouvá z místnosti. „Budeme... Budeme předstírat, že jsem nic [Select_CString(vassal.IsFemale,'neviděla','neviděl')], ano?“"
 trait_specific_ongoing.6003.a: "#EMP Hng...!#!"
