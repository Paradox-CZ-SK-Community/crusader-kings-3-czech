l_polish:
 gdp_travel_events.1000.t: "$travel_danger_prefix$ Uvízli jsme ve vlně veder" # todo: NEW TRANSLATION
 gdp_travel_events.1000.desc: "Duny v [ROOT.Char.GetCurrentLocation.GetName] se táhnou až za obzor jako nekonečné moře písku. Sluneční žár vykresluje na jejich povrchu neustále se měnící, hypnotizující vzory. Zbroceni potem a bez jediného stínu na dohled se zastavíme k odpočinku. Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entourage_member_one'))] [entourage_member_one.GetFirstName] se ke mně obrátí s očima dokořán. \n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], žáru se nebojte. V noci se mi dostalo požehnání od [entourage_member_one.GetFaith.HighGodName]! Měl jsem vidění o oáze nedaleko odsud.“" # todo: NEW TRANSLATION
 gdp_travel_events.1000.a: "Vlastně bychom měli jít tudy!" # todo: NEW TRANSLATION
 gdp_travel_events.1000.b: "Nemáme na výběr, zkusme to." # todo: NEW TRANSLATION
 gdp_travel_events.1000.b.success: "Chvála [entourage_member_one.GetFaith.HighGodName], oáza skutečně existuje" # todo: NEW TRANSLATION
 gdp_travel_events.1000.b.failure: "Nebyla to nic než fata morgána" # todo: NEW TRANSLATION
 gdp_travel_events.1000.c: "Viděním důvěřovat nebudu." # todo: NEW TRANSLATION
 low_caravaneer_experience_reason_tooltip: "Vyžaduje #V 100#! [Concept('trait_level_track_xp','zkušenosti rysu')|E] na dráze $trait_track_caravaneer$ ([GetTrait('lifestyle_merchant').GetName( GetNullCharacter )])" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_travel_events.1010.t: "Ztracení cestovatelé" # todo: NEW TRANSLATION
 gdp_travel_events.1010.desc: "Kousek za [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], [ROOT.Char.GetCurrentLocation.GetTitle.Custom('BaronyTownType')], se naše karavana chystá utábořit. Právě když se začínáme ukládat k večernímu odpočinku, ozve se za námi tichý hlas.\n\n„Promiňte, [ROOT.Char.Custom('FormOfAddressForLiege')]. S rodinou jsme cestovatelé, kteří se oddělili od své karavany. Nemáme mnoho co nabídnout, ale udělal bych cokoli, aby byl můj [traveler_child.Custom('GetDaughterSon')] dnes v noci v bezpečí.“" # todo: NEW TRANSLATION
 gdp_travel_events.1010.a: "Nechte si své peníze. Pojďte s námi." # todo: NEW TRANSLATION
 gdp_travel_events.1010.b: "Můžeme vám poskytnout přístřeší... za malý poplatek." # todo: NEW TRANSLATION
 gdp_travel_events.1010.c: "#EMP Cokoli#! říkáte..." # todo: NEW TRANSLATION
 gdp_travel_events.1010.d: "Máme dost hladových krků." # todo: NEW TRANSLATION
 gdp_travel_events.1020.t: "Historky na cestách" # todo: NEW TRANSLATION
 gdp_travel_events.1020.desc.intro: "Délku cesty z [journey_start.GetName] bolestně pociťuji v pozadí, zatímco můj [ROOT.Char.Custom('GetDonkeyDromedary')] kluše dál skrz [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]. Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('associate'))] [associate.GetFirstName], který jako by výlet vůbec neobtěžoval, se ke mně připojí a dychtivě mi chce něco povědět.\n\n" # todo: NEW TRANSLATION
 gdp_travel_events.1020.desc.caravaneer: "„“Jen taková drobná historka, [ROOT.Char.Custom('FormOfAddressForLiege')]. Nedávno jsem mluvil s vůdcem karavany z [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]. Vyprávěl mi o tomhle úžasném navigačním přístroji...„“" # todo: NEW TRANSLATION
 gdp_travel_events.1020.desc.artisan: "„“[ROOT.Char.Custom('FormOfAddressForLiege')|U], věděli jste, že [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type')] skvěle poslouží jako barvivo na látky? Když vezmete okvětní lístky a rozdrtíte je...„“" # todo: NEW TRANSLATION
 gdp_travel_events.1020.desc.creditor: "„“Zajímavost, [ROOT.Char.Custom('FormOfAddressForLiege')]: na některých místech může být drancování #EMP snad#! legální, pokud vám oběť dluží. To mi připomíná, jak jsme jednou s bratranci...„“" # todo: NEW TRANSLATION
 gdp_travel_events.1020.desc.war_profiteer: "„“Mám pro vás zajímavost, [ROOT.Char.Custom('FormOfAddressForLiege')]. Tohle [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] bylo kdysi dějištěm velké bitvy. Prý tu padl legendární šermíř, který se prosekával nepřáteli jako [ROOT.Char.Custom('RegionalOnlyFerociousAnimal')]...„“" # todo: NEW TRANSLATION
 gdp_travel_events.1020.a: "Fascinující, pověz mi víc." # todo: NEW TRANSLATION
 gdp_travel_events.1020.b: "Raději si promluvme o [ROOT.Char.Custom('my_subject_of_interest')]." # todo: NEW TRANSLATION
 gdp_travel_events.1020.c: "Raději pojedu mlčky." # todo: NEW TRANSLATION
 gdp_travel_events.1020.b.success: "Změníte téma rozhovoru" # todo: NEW TRANSLATION
 gdp_travel_events.1020.b.failure: "[associate.GetFirstNameNoTooltip] vás nechce vyslechnout" # todo: NEW TRANSLATION
 gdp_travel_events.1030.t: "Hanebné šeptání" # todo: NEW TRANSLATION
 gdp_travel_events.1030.desc: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ambitious_associate'))] [ambitious_associate.GetFirstName] se ke mně přikrade a rozhlédne se, jestli nás někdo nesleduje. [ambitious_associate.GetSheHe|U] se ke mně nakloní a zašeptá:\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], doslechl jsem se o vašem partnerovi [current_partner.GetFirstName] znepokojivé věci. Lidé z naší společnosti říkají, že [current_partner.GetSheHe] #EMP [secret_to_reveal.Custom('SecretDescriptionThirdPerson')]#!. Jestli je to pravda, musíme [current_partner.GetHerHim] přivést před spravedlnost!\n\n...a možná čeká odměna na toho, kdo vám přinesl tyto zlé zprávy?„" # todo: NEW TRANSLATION
 gdp_travel_events.1030.a: "Musím znát pravdu!" # todo: NEW TRANSLATION
 gdp_travel_events.1030.a.unity_loss.desc: "Zjistili jste povahu svého partnera" # todo: NEW TRANSLATION
 gdp_travel_events.1030.b: "Nechci spekulovat." # todo: NEW TRANSLATION
 gdp_travel_events.1030.b.unity_gain.desc: "Odmítli jste uvěřit spekulativním zvěstem o svém partnerovi" # todo: NEW TRANSLATION
 gdp_travel_events.1040.t: "$travel_danger_prefix$ Zanedbaná studna" # todo: NEW TRANSLATION
 gdp_travel_events.1040.desc: "[thirsty_traveler.GetFirstName] nahlédne do staré studny a znechuceně nakrčí [Select_CString(thirsty_traveler.IsFemale,'její','jeho')] nos.\n\nO studnu se už dlouho nikdo nestará. Kameny zarůstají, vědro je napůl shnilé a z vody se line takový zápach, že by s jejím pitím váhal i žíznivý člověk.\n\nNaše měchy na vodu jsou bohužel už měkké a téměř prázdné a žízeň se brzy stane nesnesitelnou." # todo: NEW TRANSLATION
 gdp_travel_events.1040.a: "Trocha špíny někomu jako [ROOT.Char.GetWomanMan] neuškodí!" # todo: NEW TRANSLATION
 gdp_travel_events.1040.b: "Znám způsob, jak vodu vyčistit." # todo: NEW TRANSLATION
 gdp_travel_events.1040.c: "Musíme šetřit vodou, která nám zbývá." # todo: NEW TRANSLATION
 gdp_travel_events.1040.d: "Čeká nás dlouhá cesta bez vody." # todo: NEW TRANSLATION
 gdp_travel_events.1040.e: "Možná jen doušek..." # todo: NEW TRANSLATION
 gdp_travel_events.1040.e.critical_failure.tt: "Vaše nemoc se zhorší." # todo: NEW TRANSLATION
 gdp_travel_events.1040.e.success: "Voda je bezpečná k pití." # todo: NEW TRANSLATION
 gdp_travel_events.1040.e.success.desc: "Napijete se ze studny a cítíte se osvěženi." # todo: NEW TRANSLATION
 gdp_travel_events.1050.t: "$travel_danger_prefix$ Popadané stromy" # todo: NEW TRANSLATION
 gdp_travel_events.1050.desc: "Bouře se prohnala [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')], a vyvrátila stromy, které teď leží napříč cestou. Místní dělníci odklízejí trosky, ale potrvá, než budeme moci pokračovat.\n\n[ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')] kolem zátarasu se dá projít, ale naklánějící se stromy činí tuto nebezpečnou objížďku riskantní." # todo: NEW TRANSLATION
 gdp_travel_events.1050.x: "Můj oř [ROOT.Char.Custom('WarhorseStoryName')] ty trosky odtáhne!" # todo: NEW TRANSLATION
 gdp_travel_events.1050.a: "Můžu aspoň přiložit ruku k dílu." # todo: NEW TRANSLATION
 gdp_travel_events.1050.b: "Mohli bychom se od nich poučit." # todo: NEW TRANSLATION
 gdp_travel_events.1050.c: "Najdeme cestu kolem zátarasu." # todo: NEW TRANSLATION
 gdp_travel_events.1050.d: "Počkáme, až dělníci skončí." # todo: NEW TRANSLATION
 gdp_travel_events.1050.c.success: "Najdete cestu kolem popadaných stromů." # todo: NEW TRANSLATION
 gdp_travel_events.1050.c.failure: "V divočině se zraníte." # todo: NEW TRANSLATION
 gdp_travel_events.1060.t: "$travel_danger_prefix$ Krysy v podpalubí" # todo: NEW TRANSLATION
 gdp_travel_events.1060.desc: "Podpalubí lodi se hemží krysami, které hltavě hodují na našem proviantu. Někteří viní z nedbalého skladování – z volných vík a opotřebovaných pytlů. Jiní zase neuvěřitelnou velikost toho hejna.\n\nAť už je důvod jakýkoli, tenhle boj prohráváme a musíme něco podniknout, než ty špinavé krysy všechno sežerou a nezbude nám nic." # todo: NEW TRANSLATION
 gdp_travel_events.1060.x: "Ať si s nimi poradí moje kočka [ROOT.Char.Custom('CatStoryName')]." # todo: NEW TRANSLATION
 gdp_travel_events.1060.a: "„Přineste mi harpunu a pořádnou síť!“" # todo: NEW TRANSLATION
 gdp_travel_events.1060.b: "Problém se skladováním vyřeším sám!" # todo: NEW TRANSLATION
 gdp_travel_events.1060.c: "Zamíříme do přístavu a doplníme zásoby." # todo: NEW TRANSLATION
 gdp_travel_events.1060.d: "Všichni chytat krysy!" # todo: NEW TRANSLATION
 gdp_travel_events.1060.b.tt: "Musíte mít alespoň #V 25#! [Concept('expertise','zkušenost')|E] na [GetTradeGoodCategory('trade_category_cereals').GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 gdp_travel_events.1070.t: "$travel_danger_prefix$ Terč na zádech" # todo: NEW TRANSLATION
 gdp_travel_events.1070.desc: "Ještě před chvílí byl na obzoru jen prach, ale vzápětí spatříme tlupu lotrů, jak se na koních vynořuje za hřebenem suti.\n\n„Stát!“ zavolá na mě jejich vůdce. „Pokojně nám odevzdejte své zlato z obchodu, [ROOT.Char.Custom('CZ_TitledFirstName_G')|l], a nikomu se nic nestane.“" # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [ROOT.Char.GetTitleAsName]; navyše [ROOT.Char.GetTitledFirstName]
 gdp_travel_events.1070.a: "„Cestuji pod ochranou [ROOT.Char.GetSuzerain.Custom('CZ_ShortUIName_G')], vy bídáci!“" # todo: NEW TRANSLATION
 gdp_travel_events.1070.a.success: "Jméno vašeho patrona vám zajistí bezpečný průchod" # todo: NEW TRANSLATION
 gdp_travel_events.1070.b: "„To si budete muset vzít sami!“" # todo: NEW TRANSLATION
 gdp_travel_events.1070.b.success: "Zaženete bandity na útěk" # todo: NEW TRANSLATION
 gdp_travel_events.1070.b.failure: "Bandité vám vezmou zlato" # todo: NEW TRANSLATION
 gdp_travel_events.1070.c: "„Cokoli, jen když nás necháte projít.“" # todo: NEW TRANSLATION
 gdp_travel_events.2000.t: "Nakloněná věž" # todo: NEW TRANSLATION
 gdp_travel_events.2000.desc: "To jsou... mé oči? Nestojím snad pevně na nohou, i když mi to tak připadá? Ne, smysly mě neklamou, navzdory neskutečnosti toho, co vidím. #EMP Velká [GetBuildingType('tower_of_pisa').GetNameNoTooltip] se naklání#!!\n\n„Půda je tu pevná asi jako sražené mléko, [ROOT.Char.Custom('FormOfAddressForLiege')],“ říká [mason.GetFirstName], mistr kameník, který stojí vedle mě. „[ROOT.Char.GetSheHe|U] začal klouzat, když jsme nebyli ani ve čtvrtině, ale nakonec jsme [ROOT.Char.GetHerHim] tam dostali.“\n\n„Není [ROOT.Char.GetSheHe] úchvatný?“" # todo: NEW TRANSLATION
 gdp_travel_events.2000.a: "Třeba jeho #EMP zvláštnost#! přiláká cestovatele, aspoň...?" # todo: NEW TRANSLATION
 gdp_travel_events.2000.b: "Jsi buď génius, nebo šílený[mason.GetWomanMan]. Beru tě!" # todo: NEW TRANSLATION
 gdp_travel_events.2002.opening: "[ROOT.Char.GetTitledFirstNameNoTooltip]," # todo: NEW TRANSLATION
 gdp_travel_events.2002.desc: "Naši kameníci s potěšením oznamují, že vznešená [GetBuildingType('tower_of_pisa').GetNameNoTooltip] je konečně dokončena.\n\nMusím vám však sdělit, že z Pisy také přicházejí podivné zprávy o cestovatelích, kteří mluví o stavbě #EMP zcela#! odlišné od všeho, co kdy viděli. Obávám se, že se při její stavbě něco pokazilo." # todo: NEW TRANSLATION
 gdp_travel_events.2002.a: "Posoudím jejich práci na vlastní oči." # todo: NEW TRANSLATION
 gdp_travel_events.2002.b: "Dokud stojí, je mi to úplně jedno." # todo: NEW TRANSLATION
