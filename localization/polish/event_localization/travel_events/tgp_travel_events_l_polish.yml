l_polish:
 tgp_travel_events.0025.t: "Rodina především"
 tgp_travel_events.0025.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip], chci se kochat výhledem! Nedovolíš mi jet s kočárem vpředu? Tvůj kočár mi příšerně zakrývá výhled,“ zeptá se mě [spouse.GetTitledFirstName] během zastávky v [ROOT.Char.GetCurrentLocation.GetName]. Rukou potlačí zívnutí a ospale na mě zamžourá. \n\nNež stačím odpovědět, do hovoru se s přeslazeným úsměvem vloží [crusty_person.GetTitledFirstName]. „Jistě nesmíme zapomínat na řád, jímž se má správný manželský protějšek řídit. Slušnost vyžaduje, aby [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] [Select_CString(spouse.IsFemale,'zůstala','zůstal')] na svém místě.“"
 tgp_travel_events.0025.a: "Jak si [spouse.GetTitleAsNameNoTooltip] přeje."
 tgp_travel_events.0025.a.tt: "Plodnost vztahu s [spouse.GetTitledFirstName] se zvýší."
 soulmate_travel_bond: "Mezi [CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] vzniklo během společné cesty pouto. Té noci hřálo ohniště."
 lover_travel_bond: "Mezi [CHARACTER.GetShortUIName|U] a [TARGET_CHARACTER.GetShortUIName] vzniklo během společné cesty pouto. Té noci hřálo ohniště."
 tgp_travel_events.0025.b: "Snaží se [crusty_person.GetTitledFirstName] vrazit mezi nás klín?"
 tgp_travel_events.0025.b.flavor: "Musím [crusty_person.GetTitledFirstName] bedlivě sledovat."
 tgp_travel_events.0025.b.success: "Odhalíš, co [crusty_person.GetTitledFirstName] ve skutečnosti skrývá"
 tgp_travel_events.0025.b.failure: "Neodhalíš, co [crusty_person.GetTitledFirstName] ve skutečnosti skrývá"
 tgp_travel_events.0025.c: "Miláčku, můžeš jet vzadu."
 tgp_travel_events.0025.d: "Všichni zticha!"
 tgp_travel_events.0030.t: "Poezie u cesty"
 tgp_travel_events.0030.desc: "Když dorazím na rozcestí, najdu na hraničních tabulkách nalepené množství básní. \n\nZřejmě pocházejí od jiných cestovatelů a některé zmiňují dokonce tak vzdálené kraje jako [poem_province.GetName] a tamní [poem_province.Custom('TerrainInspirationLoc')].\n\nJedna báseň mě obzvlášť zaujme. Podrobně líčí "
 tgp_travel_events.0030.desc.wanderer_poem: "nesčetná celoživotní putování a bohatství, kterým volná příroda obdarovává duši."
 tgp_travel_events.0030.desc.diplomacy_poem: "strašlivý spor mezi dvěma šlechtickými rody, které roztrhal svár o dědictví."
 tgp_travel_events.0030.desc.martial_poem: "mnohé války a mistrovství v zacházení s mečem i perem."
 tgp_travel_events.0030.desc.stewardship_poem: "mnohé zkoušky urozené duše, která se potýkala se suchem a hladomorem."
 tgp_travel_events.0030.desc.intrigue_poem: "vášnivou lásku mezi dvěma dětmi z válčících rodů."
 tgp_travel_events.0030.desc.learning_poem: "obzvlášť působivý obraz krajiny. Z každého verše je znát básnické mistrovství."
 tgp_travel_events.0030.desc.fallback: "$tgp_travel_events.0030.desc.wanderer_poem$"
 tgp_travel_events.0030.a: "Pokusit se z jedné básně načerpat ponaučení."
 tgp_travel_events.0030.a.success: "Báseň úspěšně vyložíš"
 tgp_travel_events.0030.a.failure: "Báseň se ti nepodaří vyložit"
 tgp_travel_events.0030.b: "Jak půvabné!"
 tgp_travel_events.0035.t: "Slabé kořeny"
 tgp_travel_events.0035.desc: "S námahou [ROOT.Char.Custom('TerrainStruggleLoc')] spatřím "
 tgp_travel_events.0035.desc.farmlands: "přede mnou se otevře zvlněná krajina oblasti [farming_county.GetProvince.GetName]."
 tgp_travel_events.0035.desc.ricefields: "přede mnou se rozprostře rýžová terasa oblasti [farming_county.GetProvince.GetName]."
 tgp_travel_events.0035.desc.outro: "\n\nU kraje cesty stojí [Select_CString(farmer_char.IsFemale,'rolnice','rolník')], záda shrbená nad kolem, které upadlo z vozu. Když mě a můj doprovod spatří, zatváří se jako přísný rodič. „Můj syn musel narukovat do vaší války. Kdyby tu byl, [Select_CString(farmer_char.IsFemale,'nemusela','nemusel')] bych se takhle dřít.“ \n\nPohlédnu přes pole a všimnu si, jak málo rolníků na nich pracuje. Nejspíš je všechny potkal podobný osud."
 tgp_travel_events.0035.a: "Zastavit a podat pomocnou ruku."
 tgp_travel_events.0035.b: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych zlepšit podmínky svých rolníků."
 tgp_travel_events.0035.c: "Nemám čas!"
 tgp_travel_events.0040.t: "Chlupy vola"
 tgp_travel_events.0040.desc: "Jednotvárnost mé cesty ještě umocňuje neodbytné cvrčení cikád v plevelu. Když však obejdu "
 tgp_travel_events.0040.desc.farmlands: "kamennou zídku, zahlédnu na nedalekém poli [Select_CString(upset_farmer.IsFemale,'rolnici','rolníka')], jak dovádí s dítětem vedle obzvlášť mohutného vola."
 tgp_travel_events.0040.desc.ricefields: "zákrutu mezi rýžovými políčky, zahlédnu ve vodě [Select_CString(upset_farmer.IsFemale,'rolnici','rolníka')], jak dovádí s dítětem vedle obzvlášť mohutného vola."
 tgp_travel_events.0040.desc.outro: "\n\n„[ROOT.Char.GetTitleAsNameNoTooltip]!“ ozve se z pole. „Ten vůl je můj. Včera v noci mi ho ukradli ze stáje! To má určitě zase na svědomí [Select_CString(parent.IsFemale,'ta neschopná matka. Je to opilkyně a zlodějka','ten neschopný otec. Je to opilec a zloděj')]. A tohle dítě ty zločiny vždycky kryje.“ \n\nPohlédnu na dítě. Viditelně zbledne a roztřese se po celém těle."
 tgp_travel_events.0040.a: "Popravit [Select_CString(parent.IsFemale,'matku','otce')] pro výstrahu ostatním."
 tgp_travel_events.0040.b: "Dítě může dluh odpracovat u dvora."
 tgp_travel_events.0040.c: "Nechám to být."
 tgp_travel_events.0041.t: "Splacený dluh"
 tgp_travel_events.0041.desc: "Jak se střídají roční období, i [farmer_child.GetTitledFirstName] se blíží ke konci pobytu u dvora. \n\nNejprve přišla na řadu tvrdá a spolehlivá práce ve stájích, "
 tgp_travel_events.0041.desc.court_position: "poté přišel vzestup u dvora a s ním i nové postavení [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('farmer_child'))]. Tvrdá práce přitom přinesla hlubší vzdělání i pozoruhodnou zdatnost!"
 tgp_travel_events.0041.desc.knight: "a poté se [Select_CString(farmer_child.IsFemale,'stala rytířkou','stal rytířem')] v mém vojsku."
 tgp_travel_events.0041.desc.stables: "a v dalších letech následovala práce s koňmi a odchov nejednoho skvělého oře."
 tgp_travel_events.0041.desc.kitchens: "a poté následovala práce pod kuchaři v kuchyni, drhnutí pánví a loupání hromad zeleniny."
 tgp_travel_events.0041.desc.study: "a poté následovala práce u dvorních učenců, nošení kalamářů a péče o archivy."
 tgp_travel_events.0041.desc.fallback: "$tgp_travel_events.0041.desc.study$"
 tgp_travel_events.0041.desc.alive: "Dvorský pobyt zjevně přinesl [farmer_child.GetTitledFirstName] mnoho zkušeností. \n\nNyní nastal čas návratu. [farmer_child.GetTitledFirstName] se vrátí k věčně [Select_CString(parent.IsFemale,'opilé matce','opilému otci')] a na pole oblasti [thieving_county.GetProvince.GetName]."
 tgp_travel_events.0041.desc.dead: "\n\nVěčně [Select_CString(parent.IsFemale,'opilá matka zemřela','opilý otec zemřel')], a [farmer_child.GetTitledFirstName] se nyní musí vrátit a postarat se o rodinné pozemky."
 tgp_travel_events.0041.a: "[farmer_child.GetTitledFirstName] si doma jistě povede dobře."
 tgp_travel_events.0041.tt_pay_first: "#weak ... ale jako odškodnění musím rodině prokázat náležitou úctu.#!"
 tgp_travel_events.0041.c: "Ať [farmer_child.GetTitledFirstName] zůstane [Select_CString(farmer_child.IsFemale,'mou vrchní podkoní','mým vrchním podkoním')]."
 tgp_travel_events.0041.d: "Ať [farmer_child.GetTitledFirstName] zůstane [Select_CString(farmer_child.IsFemale,'mou číšnicí','mým číšníkem')]."
 tgp_travel_events.0041.e: "Ať [farmer_child.GetTitledFirstName] zůstane [Select_CString(farmer_child.IsFemale,'mou dvorní básnířkou','mým dvorním básníkem')]."
 tgp_travel_events.0041.f: "Ať [farmer_child.GetTitledFirstName] zůstane u dvora jako dvorní [Select_CString(farmer_child.IsFemale,'učitelka','učitel')]."
 tgp_travel_events.0041.g: "[farmer_child.GetTitledFirstName] zůstane v mých službách!"
 tgp_travel_events.0041.g.tt: "[farmer_child.GetTitledFirstName] ti nadále slouží jako [THIS.Char.Custom2('RelationToMeShort', SCOPE.sC('farmer_child'))]."
 tgp_travel_events.0045.t: "Zaostalé zemědělské postupy"
 tgp_travel_events.0045.desc: "Z vrcholu kopce s výhledem na pole oblasti [foreign_county.GetName] pozoruji rolníky, jak se lopotí v hlíně a lámou si záda při ručním setí. \n\nCo má paměť sahá, doma používáme secí stroje. Zdá se, že tito lidé ze západu k takovému objevu ještě nedospěli."
 tgp_travel_events.0045.a: "Možná se mi podaří domluvit obchod s jejich vládcem."
 tgp_travel_events.0045.b: "Mohu se je pokusit naučit našim způsobům."
 tgp_travel_events.0045.b.flavor: "Názorná gesta a kresby snad překonají jazykovou bariéru."
 tgp_travel_events.0045.b.success: "Prokážu převahu vzdělané a novátorské konfuciánské kultury"
 tgp_travel_events.0045.b.failure: "Výměna vzbudí jistý zájem, ale nedokážu jim vysvětlit, co mám na mysli"
 cultural_acceptance_taught_methods: "[Concept('cultural_acceptance','Kulturní přijetí')|E] mezi [foreign_county.GetCulture.GetCollectiveNoun] a [foreign_county.GetCulture.GetCollectiveNoun] se zvýší o [minor_cultural_acceptance_gain]."
 tgp_travel_events.0045.c: "To není moje starost."
