l_polish:
 travel_completion_event.1000.t: "$travel_event_prefix$ Příjezd"
 travel_completion_event.1000.desc.home: "Konečně jsem doma! Není nad návrat do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] po dlouhé cestě. Teď snad přijde čas trochu si odpočinout, "
 travel_completion_event.1000.desc.abroad: "Po dlouhé cestě jsem konečně v [final_destination_province.GetName]! Na nějakou dobu mám od prašných cest a otlačeného sedla pokoj, "
 travel_completion_event.1000.desc.activity: "protože teď nadešel čas zúčastnit se [ROOT.Char.GetInvolvedActivity.GetName].\n\n"
 travel_completion_event.1000.desc.mandala_contract: "když jsou mé božské povinnosti prozatím splněny.\n\n"
 travel_completion_event.1000.desc.no_activity: "i když mě volání cest stále žene dál.\n\n"
 travel_completion_event.1000.stats: "Můj doprovod hlásí, že jsme na cestě strávili [travel_plan_scope.MakeScope.Var('travel_plan_elapsed_days').GetValue] dní a projeli [travel_plan_scope.MakeScope.Var('travel_plan_provinces_traversed').GetValue] baronství.\n\n"
 travel_completion_event.1000.stats.travel_leader: "[travel_leader_scope.GetName], [GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()], hlásí, že jsme na cestě strávili [travel_plan_scope.MakeScope.Var('travel_plan_elapsed_days').GetValue] dní a projeli [travel_plan_scope.MakeScope.Var('travel_plan_provinces_traversed').GetValue] baronství.\n\n"
 travel_completion_event.1000.desc.memory: "Nikdy nezapomenu na to, jak [travel_conc_memory.GetDescription]."
 travel_completion_event.1000.desc.cultural_ambassador: "Můj kulturní velvyslanec měl příležitost zvýšit přijetí [ROOT.Char.GetCulture.GetName] kultury!\n\n"
 travel_completion_event.1000.a: "[ROOT.Char.GetFaith.HighGodName] si zasluhuje dík za můj šťastný návrat! Konečně zase pod střechou..."
 travel_completion_event.1000.a.adventurer: "[ROOT.Char.GetFaith.HighGodName]! Konečně zase pohodlná postel..."
 travel_completion_event.1000.b: "Cestování je úžasné, ale návrat domů je ještě sladší."
 travel_completion_event.1000.b.adventurer: "Cestování je úžasné, ale v pohodlí ještě víc."
 cultural_ambassador_cultural_acceptance_gain_desc: "Cestování s kulturním velvyslancem"
 cultural_ambassador_toast.t: "[cultural_ambassador.GetFirstNameNoTooltip] zvyšuje kulturní přijetí"
 cultural_ambassador_option.tt: "Účinky kulturního velvyslance:\n$EFFECT_LIST_BULLET$[Concept('cultural_acceptance','Kulturní přijetí')|E] mezi každou navštívenou [Concept('culture','kulturou')|E] a [SCOPE.GetRootScope.GetCharacter.GetCulture.GetName] kulturou se zvýšilo o #positive_value +1%#!"
 finally_there_perk_title_message: "[GetPerk('finally_there_perk').GetName( GetNullCharacter )]"
 souvenirs_aplenty_perk_title_message: "[GetPerk('souvenirs_aplenty_perk').GetName( GetNullCharacter )]"
