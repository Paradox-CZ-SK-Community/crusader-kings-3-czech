l_polish:
 travel_danger_events.7000.t: "$travel_danger_prefix$ Had!"
 travel_danger_events.7000.desc_intro: "Cestou k [destination.GetName] se na chvíli zastavíme, abychom si odpočinuli."
 travel_danger_events.7000.desc_desert: "Někteří se vydají mezi duny, zatímco ostatní odpočívají ve stínu karavany. Slunce stojí nejvýše na obloze a vedro je nesnesitelné. Sleduji [snake_victim.GetTitledFirstName], jak se pomalu plahočí pískem, když náhle klesne na kolena a chytí se za nohu."
 travel_danger_events.7000.desc_oasis: "Většina se shromáždí kolem oázy, pije chladnou vodu a smývá si z tváře prach. [snake_victim.GetName] ponoří ruku do vody, ale vzápětí ji s výkřikem prudce ucukne."
 travel_danger_events.7000.desc_mountains: "Mnozí se vydají hledat něco k jídlu nebo zdroj vody, zatímco ostatní odpočívají ve stínu stromů. Pozoruji [snake_victim.GetName], jak se přehrabuje v podrostu, když náhle s výkřikem uskočí."
 travel_danger_events.7000.desc_hills: "Mnozí se sesednou kolem táborového ohně, hřejí se a vyprávějí si příběhy. [snake_victim.GetName] se mezitím vzdálí, snad aby našel nějakou zvěř. Sotva však sáhne do trávy, ozve se pronikavý výkřik."
 travel_danger_events.7000.desc_floodplains: "Několik lidí se vydá pro vodu, zatímco ostatní zůstanou u karavany a hledají suché místo. [snake_victim.GetName] ponoří čutoru do vody, ale vzápětí ji s bolestným výkřikem prudce vytáhne."
 travel_danger_events.7000.desc: "\n\nPříčinou je [current_location.Custom('GetRandomRegionalPoisonousSnake')]! Zuby se nakonec uvolní z masa [snake_victim.GetName], ale je zřejmé, že jed už začíná účinkovat."
 travel_danger_events.7000.desc_recent: "Situace je vážná, ale podobné nebezpečí [snake_victim.GetName] rozhodně nezažívá poprvé..."
 travel_danger_events.7000.a_1: "Počkáme, dokud se stav [snake_victim.GetName] nezlepší."
 travel_danger_events.7000.a_2: "Snad se [snake_victim.GetName] časem zotaví."
 travel_danger_events.7000.a_3: "Nejlepší bude dopřát [snake_victim.GetName] klid a odpočinek."
 every_victim_relation_tt: "Každý člen rodiny [snake_victim.GetName]:"
 travel_danger_events.7000.a_recover: "[snake_victim.GetName] se zotaví z účinků jedu"
 travel_danger_events.7000.a_dont_recover: "Stav [snake_victim.GetName] se nezmění"
 travel_danger_events.7000.a_dont_recover_die: "[snake_victim.GetName] podlehne jedu"
 travel_danger_events.7000.b: "Možná se dá otrava léčit..."
 travel_danger_events.7000.b_flavor: "Pokusíš se otravu vyléčit vlastními silami"
 travel_danger_events.7000.treatment_good: "Léčba zabere"
 travel_danger_events.7000.treatment_bad: "Jed na léčbu nereaguje"
 travel_danger_events.7000.c: "Třeba nám někdo v [current_location.GetNameNoTooltip] dokáže pomoci."
 travel_danger_events.7000.c_tt: "Zaplatíš někomu z místních, aby se pokusil otravu vyléčit"
 travel_danger_events.7000.d_physician: "[treatment_giver.GetNameNoTooltip] je [Select_CString(treatment_giver.IsFemale,'zkušená léčitelka','zkušený léčitel')]."
 travel_danger_events.7000.c_known: "Tady sídlí [current_location.GetTitle.GetHolder.GetNameNoTooltip] a může nám pomoci."
 travel_danger_events.7000.c_known_tt: "Využiješ svého vztahu s [current_location.GetTitle.GetHolder.GetName], abys našel dobrého místního léčitele."
 travel_danger_events.7000.d: "[treatment_giver.GetNameNoTooltip] má bystrou hlavu, třeba dokáže pomoci."
 travel_danger_events.7000.e_flavor: "Dopřej [snake_victim.GetName] více jídla, aby byla šance na zotavení vyšší."
 travel_danger_events.7000.d_tt: "[treatment_giver.GetName] se pokusí otravu vyléčit"
 travel_danger_events.7000.d_tt_phys: "[treatment_giver.GetName] vyléčí [snake_victim.GetFirstName]"
 travel_danger_events.7000.e: "Dnes večer dostane [snake_victim.GetFirstNameNoTooltip] porci navíc."
 travel_danger_events.7000.f_sea: "Ať si [snake_victim.GetName] vezme příliv!"
 travel_danger_events.7000.f: "Nechci se dívat, jak [snake_victim.GetName] trpí."
 travel_danger_events.7000.g: "To stačí, pokračujeme dál."
