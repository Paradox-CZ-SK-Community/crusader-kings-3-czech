l_polish:
 travel_danger_events.5000.t: "$travel_danger_prefix$ Hádavá sebranka"
 travel_danger_events.5000.intro.land: "Když procházíme přes [location.GetName], naše karavana zastaví na mýtině, kolem níž se rozprostírá [location.Custom('GetProvinceFoliageDesc')]. Zamířím k místu, odkud se ozývá rozruch, a najdu tam [entourage_member_one.GetFirstName] a [entourage_member_two.GetFirstName] uprostřed prudké hádky.\n\n"
 travel_danger_events.5000.intro.sea: "Zvenčí se ozve několik ran a rozzuřený křik. Rychle vyběhnu z podpalubí a najdu tam [entourage_member_one.GetFirstName] a [entourage_member_two.GetFirstName] uprostřed vyhrocené hádky.\n\n"
 travel_danger_events.5000.craven: "„Proč mě pořád trápíš, [entourage_member_two.GetFirstNameNoTooltip]? Nesnáším, když mě někdo zezadu vyděsí, zvlášť když cestujeme místy, kde jsou samé [location.Custom('GetTerrainLandPlural')]!“\n\n„Ale no tak, byl to jen žert! Trocha odvahy by ti neuškodila ― pro dobro nás všech...“"
 travel_danger_events.5000.brave: "„Přestaň fňukat, [entourage_member_two.Custom2('InsultNoun', SCOPE.sC('entourage_member_one'))], a #EMP bojuj se mnou#!! Ukaž, co v tobě je! Zbabělec jako ty nemá na téhle cestě co dělat!“ [entourage_member_one.GetFirstNameNoTooltip] si odplivne na zem.\n\n[entourage_member_two.GetFirstNameNoTooltip] se jen krčí strachy a tiše pláče."
 travel_danger_events.5000.chaste: "„Přestaneš už žvanit o svých chlípnicích... #EMP dobrodružstvích#!, [entourage_member_two.Custom2('InsultNounSexual', SCOPE.sC('entourage_member_one'))]? Už o tom nechci slyšet ani slovo!“ [entourage_member_one.GetFirstNameNoTooltip] si v rozpacích zakryje tvář.\n\n„Ale no tak, [entourage_member_one.GetFirstNameNoTooltip]! Odmítám se stydět za své potřeby...“ odsekne rozhořčeně [entourage_member_two.GetFirstNameNoTooltip]."
 travel_danger_events.5000.stubborn: "„Přísahám, že jdeme špatným směrem! Ani krok dál, dokud to nevyřešíme!“ křičí [entourage_member_one.GetFirstNameNoTooltip].\n\n„#EMP Ty tvrdohlavá stará kozo!#! Copak nevidíš, že celý doprovod už má dost tebe i tohohle: [entourage_member_one.Custom2('PointOfRidicule', ROOT.Char)]?“"
 travel_danger_events.5000.generous: "„Říkám ti to naposledy, [entourage_member_two.GetFirstNameNoTooltip], už nemám co rozdávat! Jak se vůbec opovažuješ chtít další zlato, když už jsi ze mě [Select_CString(entourage_member_two.IsFemale,'vytáhla','vytáhl')] všechno, co šlo?“ křičí rozzuřeně [entourage_member_one.GetFirstNameNoTooltip].\n\n„Ale já potřebuju víc! Nebuď takový skrblík, [entourage_member_one.GetFirstNameNoTooltip]!“"
 travel_danger_events.5000.gregarious: "„Ale no tak, [entourage_member_two.GetFirstNameNoTooltip], jen se snažím nějak ukrátit čas. Neměli bychom se trochu poznat?“ zvolá [entourage_member_one.GetFirstNameNoTooltip] a tvář se [Select_CString(entourage_member_one.IsFemale,'jí','mu')] zachmuří.\n\n[entourage_member_two.GetFirstNameNoTooltip] se nepříjemně ošívá a vypadá, že by nejraději [Select_CString(entourage_member_two.IsFemale,'utekla','utekl')] zpátky do [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
 travel_danger_events.5000.shy: "[entourage_member_one.GetFirstNameNoTooltip] se znepokojeně obrátí ke mně a spustí: „[entourage_member_two.GetFirstNameNoTooltip] mi nedá pokoj! A ještě tohle ― ‚[entourage_member_one.Custom2('InsultAdjective', SCOPE.sC('entourage_member_two'))] [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))]‘! Řekni, že potřebuji klid!“\n\n„Jen jsem si [Select_CString(entourage_member_two.IsFemale,'dělala','dělal')] legraci! O nic nešlo, vážně ― jen o jednu věc u [entourage_member_one.GetFirstNameNoTooltip]: [entourage_member_one.Custom2('PointOfRidicule', SCOPE.sC('entourage_member_two'))]!“"
 travel_danger_events.5000.just: "„Jak ses opovážil mě shodit z koně, [entourage_member_one.GetFirstNameNoTooltip]! [entourage_member_one.Custom2('InsultAdjective', SCOPE.sC('entourage_member_two'))] [entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))]!“ vykřikne [entourage_member_two.GetFirstNameNoTooltip] ze země; všude kolem je [location.Custom('GetProvinceGroundDesc')].\n\n„Za tvůj očividný nedostatek dovednosti opravdu nemohu,“ odpoví [entourage_member_one.GetFirstNameNoTooltip] se samolibým úšklebkem."
 travel_danger_events.5000.patient: "„...a takhle jsem se [Select_CString(entourage_member_one.IsFemale,'dostala','dostal')] z té zoufalé situace při minulé návštěvě [location.GetNameNoTooltip]. Vlastně mi to připomíná ještě jeden příběh...“\n\n„#EMP Už ani slovo, [entourage_member_one.GetFirstNameNoTooltip]!#!“ skočí do řeči [entourage_member_two.GetFirstNameNoTooltip]."
 travel_danger_events.5000.impatient: "[entourage_member_one.GetFirstNameNoTooltip] hlasitě naříká. „Dostaneme se #EMP vůbec někdy#! do [next_destination.GetName]? Už nedokážu ujít ani míli!“\n\n„Dorazíme, až dorazíme! Tvoje nevděčné fňukání jen kazí náladu celému doprovodu. Být po mém, nechali jsme tě už v [random_visited_province.GetNameNoTooltip]!“"
 travel_danger_events.5000.temperate: "„Ty [Select_CString(entourage_member_two.IsFemale,'hříšná, nenažraná svině!','hříšný, nenažraný vepři!')] Dokážeš aspoň jedinou hodinu myslet na něco jiného než na jídlo?“\n\n „Ale já mám #EMP tááákový#! hlad! V hlavě mi pořád běží jediné: [entourage_member_two.Custom('GetExpensiveDessert')], které jsme nechali v [ROOT.Char.GetCapitalLocation.GetNameNoTooltip],“ běduje [entourage_member_two.GetFirstNameNoTooltip] a sliny [Select_CString(entourage_member_two.IsFemale,'jí','mu')] pomalu stékají z koutku úst."
 travel_danger_events.5000.paranoid: "„Poslali tě sem, abys mě [Select_CString(entourage_member_two.IsFemale,'zabila','zabil')]! Nelži mi! [entourage_member_two.Custom2('InsultAdjective', SCOPE.sC('entourage_member_one'))] [entourage_member_two.Custom2('InsultNoun', SCOPE.sC('entourage_member_one'))]!“ křičí [entourage_member_one.GetFirstNameNoTooltip] v naprosté panice.\n\n„Uklidni se, [entourage_member_one.GetFirstNameNoTooltip]! Vždyť jsem to jen já! Jak tě vůbec mohlo něco takového napadnout?“ odpovídá [entourage_member_two.GetFirstNameNoTooltip] a snaží se [Select_CString(entourage_member_one.IsFemale,'ji','ho')] uklidnit."
 travel_danger_events.5000.zealous: "[entourage_member_one.GetFirstNameNoTooltip] zjevně vychvaluje přednosti [entourage_member_one.GetFaith.GetNameNoTooltip]. „...ale nechápeš, že [entourage_member_one.GetFaith.HighGodName] je pro dobrý život naprosto zásadní. Nejdůležitější je ― “\n\n„#EMP Už zase!#!“ [entourage_member_two.GetFirstNameNoTooltip] protočí oči. „[entourage_member_one.Custom2('InsultNoun', SCOPE.sC('entourage_member_two'))]! [entourage_member_two.GetFaith.HighGodName] mě snad vyslyší a zachrání před tímhle kázáním!“"
 travel_danger_events.5000.fallback: "„Už mám dost tvých nesmyslů! [entourage_member_two.Custom2('InsultAdjective', SCOPE.sC('entourage_member_one'))] [entourage_member_two.Custom2('InsultNoun', SCOPE.sC('entourage_member_one'))]!“ [entourage_member_one.GetFirstNameNoTooltip] vztekle dupne do země; všude kolem je [location.Custom('GetProvinceGroundDesc')].\n\n„To ty fňukáš celou cestu! Na každé křižovatce ječíš ‚#EMP Už tam budeme?#!‘!“ odsekne [entourage_member_two.GetFirstNameNoTooltip]."
 travel_danger_events.5000.a: "Ale no tak, jistě se dokážete usmířit."
 travel_danger_events.5000.a.success: "Podaří se ti usmířit [entourage_member_one.GetFirstNameNoTooltip] a [entourage_member_two.GetFirstNameNoTooltip]"
 travel_danger_events.5000.a.failure: "[entourage_member_one.GetFirstNameNoTooltip] a [entourage_member_two.GetFirstNameNoTooltip] se nedokážou usmířit"
 entourage_member_one_leaves.tt: "[entourage_member_one.GetFirstNameNoTooltip] opouští tvůj doprovod"
 entourage_member_two_leaves.tt: "[entourage_member_two.GetFirstNameNoTooltip] opouští tvůj doprovod"
 travel_danger_events.5000.b: "Na vaše malicherné hádky nemáme čas!"
 travel_danger_events.5000.c: "Tohle lze vyřešit jen jediným způsobem."
 travel_danger_events.5000.c.success: "[entourage_member_one.GetFirstNameNoTooltip] vítězí"
 travel_danger_events.5000.c.failure: "[entourage_member_two.GetFirstNameNoTooltip] vítězí"
 travel_danger_events.5010.t: "$travel_danger_prefix$ Všude obsazeno"
 travel_danger_events.5010.desc.intro: "Po několika únavných dnech na cestě zastavujeme u hostince v [location.GetName] a hledáme nocleh. Posílám [travel_leader.GetName], [ROOT.Char.Custom2('RelationToMeShort', travel_leader )], zjistit, zda mají volné pokoje. Když se však vrací k doprovodu se zachmuřenou tváří, nevěstí to nic dobrého.\n\n"
 travel_danger_events.5010.desc.seriously: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], jak asi tušíte...“\n\nJen beznadějně sklopí hlavu. Ten [angry_char.Custom2('InsultAdjective', ROOT.Char)] [angry_char.Custom2('InsultNoun', ROOT.Char)], [angry_char.GetTitledFirstName], je zjevně [Select_CString(angry_char.IsFemale,'odhodlaná','odhodlaný')] proměnit mi tuhle cestu v hotové peklo!"
 travel_danger_events.5010.desc.again: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], už zase! V hostinci prý #EMP vůbec není místo!#! Zdá se, že [angry_char.GetName] rozšířil zprávu o našem příjezdu do těchto končin.“"
 travel_danger_events.5010.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], v hostinci prý nemají jediné volné místo, přestože ve výčepu skoro nikdo nebyl. Mám podezření, že za tím odmítnutím stojí skutečnost, že tyto kraje patří [angry_char.GetName]...“"
 travel_danger_events.5010.a_seriously: "[angry_char.GetFirstNameNoTooltip] toho ještě bude litovat..."
 travel_danger_events.5010.a_again: "#EMP Zase?#! K čertu s tím [angry_char.Custom2('InsultNoun', ROOT.Char)]!"
 travel_danger_events.5010.a: "Nevadí, najdeme nocleh jinde."
 travel_danger_events.5010.b_seriously: "#EMP PUSŤTE. MĚ. DOVNITŘ!#!"
 travel_danger_events.5010.b: "[ROOT.Char.GetTitledFirstNameNoTooltip] si odpočinek upírat nenechá."
 travel_danger_events.5010.b.flavor: "Pokusíš se násilím vynutit vstup do hostince"
 travel_danger_events.5010.b.success: "Odpor hostinského je zlomen"
 travel_danger_events.5010.b.failure: "Hostinský tě odrazí"
 travel_danger_events.5010.c: "Promluvím si s hostinským."
 travel_danger_events.5010.c.flavor: "Pokusíš se hostinského přesvědčit, aby nechal tebe i tvůj doprovod přenocovat"
 travel_danger_events.5010.c.success: "Hostinského přesvědčíš"
 travel_danger_events.5010.c.failure: "Hostinského nepřesvědčíš"
