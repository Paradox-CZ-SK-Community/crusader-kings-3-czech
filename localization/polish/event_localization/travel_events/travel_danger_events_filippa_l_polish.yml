l_polish:
 travel_danger_events.4000.t: "$travel_danger_prefix$ [Select_CString(overboard_character.IsFemale,'Žena','Muž')] přes palubu!"
 travel_danger_events.4000.desc: "Rozbouřené moře by přivodilo nevolnost i zkušenému námořníkovi. Jak se loď na vlnách kymácí ze strany na stranu, lidé se pomalu stahují do bezpečí podpalubí.\n\nVšimnu si [overboard_character.GetTitledFirstName], jak vyhlíží přes zábradlí a pak se chystá zamířit do podpalubí. Než však kdokoli stihne zareagovat, loď prudce škubne do strany a [overboard_character.GetFirstNameNoTooltip] padá do temné vody."
 travel_danger_events.4000.desc.again: "Moře k nám cestou do [destination.GetNameNoTooltip] není vlídné. Plavbu dál sužují prudké otřesy, ale tentokrát se lidé při kapitánově varování stahují do podpalubí rychleji.\n\n[overboard_character.GetTitledFirstName] se však zdrží příliš dlouho a s tichým #EMP žbluňknutím#! padá přes palubu!"
 travel_danger_events.4000.desc.seriously: "[ROOT.Char.GetFaith.WaterGodName] se na nás zřejmě hněvá. Moře se znovu bouří a lidé spěchají do podpalubí ještě dřív, než kapitán stačí vykřiknout varování.\n\nKdyž se také ženeme do podpalubí, zahlédnu [overboard_character.GetTitledFirstName], jak zakopne o uvolněné lano u zábradlí. Jeden z členů posádky přispěchá na pomoc, ale je pozdě. Při dalším zhoupnutí lodi se [overboard_character.GetFirstNameNoTooltip] zřítí do hlubin!"
 travel_danger_events.4000.a: "Musíme [overboard_character.GetFirstNameNoTooltip] zachránit!"
 travel_danger_events.4000.a_again: "Zase ne! Zachraňte [overboard_character.GetFirstNameNoTooltip]!"
 travel_danger_events.4000.a_seriously: "To snad ne! [overboard_character.GetFirstNameNoTooltip], vydrž!"
 travel_danger_events.4000.a.saved.t: "Záchrana"
 travel_danger_events.4000.a.saved.desc: "Posádka prohledá vlny a zachrání [overboard_character.GetShortUIName]"
 travel_danger_events.4000.a.wounded.t: "Záchrana se zraněním"
 travel_danger_events.4000.a.wounded.desc: "Posádka zachrání [overboard_character.GetShortUIName], ale pád si vyžádá zranění"
 travel_danger_events.4000.a.failure.t: "Smrt"
 travel_danger_events.4000.a.failure.desc: "[overboard_character.GetShortUIName] se utopí"
 travel_danger_events.4000.b: "Není čas! Zachráním [overboard_character.GetFirstNameNoTooltip] [Select_CString(overboard_character.Char.IsFemale,'ji','ho')] [Select_CString(ROOT.Char.IsFemale,'sama','sám')]!"
 travel_danger_events.4000.b_travel_leader: "[travel_leader.GetFirstNameNoTooltip], rychle!"
 travel_danger_events.4000.b.flavor: "[overboard_character.GetFirstNameNoTooltip] to #EMP musí#! přežít!"
 travel_danger_events.4000.c: "Je příliš pozdě."
 travel_danger_events.4000.c.flavor: "Vítr v zádech nás požene rychleji!"
 travel_danger_events.4010.t: "$travel_danger_prefix$ Všechno je v pořádku"
 travel_danger_events.4010.desc: "Cestování někdy drsnou krajinou má přinejmenším na #EMP mou#! mysl a vitalitu povzbuzující účinek.\n\nKdyž však pohlédnu na [ill_character.GetTitledFirstName], je zřejmé, že tady je tomu právě naopak. Každý pohyb působí namáhavě, dech je těžký a tělem otřásají náhlé záchvaty kašle. Něco rozhodně není v pořádku."
 travel_danger_events.4010.desc_again: "Právě se ráno chystáme sbalit tábor a pokračovat do [destination.GetNameNoTooltip], když v příbytku [ill_character.GetTitledFirstName] narazím na zbědovaný výjev. Dech je těžký, tvář bledá jako stěna a při mém pohledu následuje prudký záchvat kašle.\n\nTakže nákaza postihla i [ill_character.GetFirstNameNoTooltip]? Je to snad mor?"
 travel_danger_events.4010.desc_sea: "Při plavbě do [destination.GetNameNoTooltip] dělá svěží mořský vzduch přinejmenším #EMP mému#! zdraví a pohodě divy. Ne všichni však mají takové štěstí.\n\nPosledních několik dní sleduji, jak [ill_character.GetTitledFirstName] chřadne, a teď už není pochyb, že jde o nějakou nemoc."
 travel_danger_events.4010.desc_sea_again: "Do [destination.GetNameNoTooltip] postupujeme dobrým tempem a mě to naplňuje novou energií. [ill_character.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ill_character'))] — však očividně prožívá pravý opak.\n\nDnes ráno vidím [ill_character.GetFirstNameNoTooltip], jak se s chraplavým kašlem těžce opírá o zábradlí. Je zjevné, že i tady jde o nějakou nákazu. Je to snad mor?"
 travel_danger_events.4010.a: "[ill_character.GetFirstNameNoTooltip] potřebuje odpočinek a čas na úplné zotavení."
 travel_danger_events.4010.a_sea: "Najděte přístav, aby si [ill_character.GetFirstNameNoTooltip] [Select_CString(ill_character.IsFemale,'mohla','mohl')] odpočinout a plně se zotavit."
 travel_danger_events.4010.b: "Myslím, že znám lék."
 travel_danger_events.4010.b.flavor: "Snítka tohohle, špetka tamtoho..."
 travel_danger_events.4010.b.tt: "U [ill_character.GetShortUIName] se rozvine [GetTrait('pneumonic').GetName( GetNullCharacter )]"
 travel_danger_events.4010.b.cured.t: "Vyléčení"
 travel_danger_events.4010.b.cured.desc: "[ill_character.GetShortUIName] se plně zotaví"
 travel_danger_events.4010.b.worsened.t: "Zhoršení stavu"
 travel_danger_events.4010.b.worsened.desc: "Stav [ill_character.GetShortUIName] se zhorší"
 travel_danger_events.4010.c: "[medicine_person.GetTitledFirstNameNoTooltip], dokážeš [ill_character.GetFirstNameNoTooltip] vyléčit?"
 travel_danger_events.4010.d: "Ale podívejme, zrovna mám #EMP něco vhodného...#!"
 travel_danger_events.4010.d.flavor: "Příležitost zbavit se [ill_character.GetFirstNameNoTooltip] jednou provždy!"
 travel_danger_events.4010.d.poisoned.t: "Smrt"
 travel_danger_events.4010.d.poisoned.desc: "Úspěšně [ill_character.GetFirstNameNoTooltip] otrávíš"
 travel_danger_events.4010.d.failure.t: "Odhalení"
 travel_danger_events.4010.d.failure.desc: "[ill_character.GetShortUIName] všechno odhalí"
 travel_danger_events.4010.e: "Je to jen trocha kašle."
 travel_danger_events.4010.e.flavor: "Už jsem [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] horší."
 travel_danger_events.4010.e.pneumonic.t: "Zápal plic"
 travel_danger_events.4010.e.no_change.t: "Beze změny"
 every_patient_entourage_tt: "Každý člen doprovodu s vlastností [GetTrait('patient').GetName( GetNullCharacter )]"
