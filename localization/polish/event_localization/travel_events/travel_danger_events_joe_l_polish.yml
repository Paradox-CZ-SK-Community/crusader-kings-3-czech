 regional_ship_longship: "dlouhá loď"
 regional_ship_longship_plural: "dlouhé lodě"
 regional_ship_galley: "galéra"
 regional_ship_galley_plural: "galéry"
 regional_ship_dromon: "dromóna"
 regional_ship_dromon_plural: "dromóny"
 regional_ship_cog: "koga"
 regional_ship_cog_plural: "kogy"
 regional_ship_fallback: "loď"
 regional_ship_fallback_plural: "lodě"
 travel_danger_events.6020.t: "$travel_danger_prefix$ Nebezpečí hlubin"
 travel_danger_events.6020.desc: "Stahují se zlověstná mračna a za kapitánovým uklidňováním cítím strach. Brzy nás pohltí strašlivá bouře, palubu bičuje prudký déšť a [ROOT.Char.Custom('RegionalShipType')] se zmítá jako hračka.\n\nUši nám probodne ohlušující praskot, hlasitější než hrom, jako by sám svět nějaký děsivý obr roztrhl vedví. Loď se nám pod nohama prohýbá.\n\n"
 travel_danger_events.6020.hugger: "[hugger.GetTitledFirstName] a já se v hrůze křečovitě chytneme jeden druhého a s vytřeštěnýma očima sledujeme, jak se k lodi řítí obrovská vlna!"
 travel_danger_events.6020.prayer: "Sleduji [prayer.GetTitledFirstName], jak klečí s pažemi vztaženými k nebi rozervanému blesky a křičí: „[prayer.GetFaith.HighGodName]! [prayer.GetFaith.WaterGodName]! Zachraňte nás!“ Vtom se přes palubu převalí obrovská vlna!"
 travel_danger_events.6020.diver: "[diver.GetTitledFirstName] se chytí za spánky a vykřikne: „Přichází pro nás hrůza [diver.GetFaith.DevilNamePossessive]! Není úniku!“ Pak skočí přímo do obrovské vlny valící se přes loď!"
 travel_danger_events.6020.director: "S úžasem sleduji [director.GetTitledFirstName], jak stojí vzpřímeně a vykřikuje rozkazy, které nikdo neslyší, zcela bez ohledu na obrovskou vlnu, jež se právě žene přes palubu!"
 travel_danger_events.6020.fallback: "Přitisknu se do kouta a s hrůzou sleduji, jak námořníci padají do černých hlubin a přes loď se valí obrovská vlna."
 travel_danger_events.6020.a: "ArghghghGHHghghh!"
 travel_danger_events.6030.t: "$travel_danger_prefix$ Zkažené zásoby"
 travel_danger_events.6030.leader: "[travel_leader.GetFirstName] má na starosti naše zásoby jídla a rozpačitě přizná, že kvůli špatnému skladování je teď téměř všechno k ničemu..."
 travel_danger_events.6030.fallback: "Sotva tomu dokážu uvěřit, ale naše zásoby jídla na cestu jsou kvůli špatnému skladování téměř všechny k ničemu..."
 travel_danger_events.6030.desc: "\n\nChléb i další potraviny pokrývají skvrny plísně a zbytek sušených zásob rychle dochází. Se soumrakem začíná mít celý doprovod hlad."
 travel_danger_events.6030.a: "Je to jen trocha plísně!"
 travel_danger_events.6030.b: "Příroda nás uživí!"
 travel_danger_events.6030.b.success: "Najdeš něco k snědku"
 travel_danger_events.6030.b.failure: "Nenajdeš nic"
 travel_danger_events.6030.b.critical: "Sníš nevhodnou rostlinu"
 travel_danger_events.6030.b.death: "Sníš tu nejhorší možnou rostlinu"
 travel_danger_events.6030.c: "Místní tu přece musí #EMP něco#! mít."
 travel_danger_events.6030.d: "Budeme muset všechno nahradit."
 travel_danger_events.6040.t: "$travel_danger_prefix$ Není mi dobře"
 travel_danger_events.6040.wet: "Průchod touhle zatracenou krajinou nás pořádně vyčerpává. Prodíráme se všudypřítomným vlhkem, odháníme hmyz a marně se snažíme zůstat v suchu, zatímco nám docházejí síly i trpělivost."
 travel_danger_events.6040.war: "Krajina nese jizvy války. Všude leží její oběti a stojí tábory těch, kdo ji vedou. Podmínky jsou otřesné a na vojáky narážíme až příliš často."
 travel_danger_events.6040.desc: "\n\nZačínám slábnout a zaostávám za zbytkem výpravy, přestože obvykle udávám tempo... Něco není v pořádku..."
 travel_danger_events.6040.a: "Musím se vrátit."
 travel_danger_events.6040.b: "Jaké požehnání, že je tu můj $court_physician_court_position$!"
 travel_danger_events.6040.c: "Musíme pokračovat..."
 travel_stealing_food_modifier: "Ukradené zásoby"
 travel_stealing_food_modifier_desc: "Šlechtici projíždějící tímto hrabstvím si bez dovolení brali úrodu svých poddaných."
