l_polish:
 travel_danger_events.6000.t: "$travel_danger_prefix$ Hrůzostrašná šelma!"
 travel_danger_events.6000.desc: "Svižně kráčíme po cestě a vychutnáváme si poklidnou atmosféru. Koutkem oka cosi zahlédnu... To snad bylo [ROOT.Char.Custom('GetAnimalFeature')]...! Pak se ozve hlasité [ROOT.Char.Custom('GetAnimalSound')] a je jasno. Je to [ROOT.Char.Custom('GetAnimalType')]!"
 travel_danger_events.6000.desc.again: "Po cestě kráčím pomalu a obezřetně, stále ve střehu po nedávném setkání s divokou šelmou. Srdce mi klesne, když se odněkud z [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] ozve [ROOT.Char.Custom('GetAnimalSound')]. [ROOT.Char.GetFaith.FateGodName] se mi vysmívá! Je to [ROOT.Char.Custom('GetAnimalType')]!"
 travel_danger_events.6000.desc.seriously: "Po nedávném neštěstí postupujeme cestami zdejší krajiny s nejvyšší opatrností. Sotva začnu polevovat v ostražitosti, z [ROOT.Char.GetCurrentLocation.Custom('GetProvinceFoliageDesc')] se ozve [ROOT.Char.Custom('GetAnimalSound')]! Zatraceně! Je to [ROOT.Char.Custom('GetAnimalType')]!"
 travel_danger_events.6000.body: "\n\nNa cestu [ROOT.Char.Custom('GetAnimalChargePresent')] [ROOT.Char.Custom('GetAnimalColor')] šelma. Její mohutné [ROOT.Char.Custom('GetAnimalTrackPlural')] rozmetají kolem sebe [ROOT.Char.GetCurrentLocation.Custom('GetProvinceGroundDesc')]. Mezi [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')] stromy nám zcela zahrazuje další cestu k [destination.GetBaronyNameExplicitlyNoTooltip]."
 travel_danger_events.6000.victim: "\n\n[beast_victim.GetFirstName] zašeptá: „Jen se podívej! #EMP [ROOT.Char.Custom('GetAnimalDanger')]#!...“"
 travel_danger_events.6000.a: "Ustupte, tohle vyřídím!"
 travel_danger_events.6000.a_again: "Čeká tě stejný konec jako posledně!"
 travel_danger_events.6000.a_seriously: "Nech mě #EMP PROJÍT#!!"
 travel_danger_events.6000.a.wounded.t: "Záchrana za cenu zranění"
 travel_danger_events.6000.a.wounded.desc: "Doprovod zachrání [overboard_character.GetShortUIName], ale při pádu utrpí zranění"
 travel_danger_events.6000.b: "Zabij to, [beast_victim.GetFirstNameNoTooltip]! Hned!"
 travel_danger_events.6000.b_again: "Teď jsi na řadě, [beast_victim.GetFirstNameNoTooltip]!"
 travel_danger_events.6000.b_seriously: "Tohle nechám #EMP na tobě#!, [beast_victim.GetFirstNameNoTooltip]!"
 travel_danger_events.6000.b_travel_leader: "[travel_leader.GetFirstNameNoTooltip], dělej něco!"
 travel_danger_events.6000.c: "#EMP UTÍKEJTE#!! #EMP JDE VÁM O ŽIVOT#!!"
 travel_danger_events.6000.success: "[ROOT.Char.Custom('GetAnimalType')] padne; vítězí [beast_victim.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.wound: "[ROOT.Char.Custom('GetAnimalType')] útočí; zranění utrpí [beast_victim.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.failure: "[ROOT.Char.Custom('GetAnimalType')] útočí; [beast_victim.GetShortUINameNoTooltipNoFormat] nepřežije"
 travel_danger_events.6000.success_root: "[ROOT.Char.Custom('GetAnimalType')] padne; vítězí [root_scope.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.wound_root: "[ROOT.Char.Custom('GetAnimalType')] útočí; zranění utrpí [root_scope.GetShortUINameNoTooltipNoFormat]"
 travel_danger_events.6000.failure_root: "[ROOT.Char.Custom('GetAnimalType')] útočí; [root_scope.GetShortUINameNoTooltipNoFormat] nepřežije"
 travel_danger_events.6010.t: "$travel_danger_prefix$ Kouř na obzoru"
 travel_danger_events.6010.raid: "Před námi leží [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]. Sloupy kouře a skupinky procházejících rolníků dávají jasně najevo, že se tu plenilo. Silní si mohou vzít, co se jim zlíbí...\n\n"
 travel_danger_events.6010.siege: "Na okraji [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip] se rozkládá obléhací tábor a nad ním líně povlávají [siege_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] praporce, předzvěst [siege_war.Custom('WarCasusBelliShort')].\n\n"
 travel_danger_events.6010.victim: "Bolí mě vidět vlastní zem takto zpustošenou, ale tento boj nemohu vyhrát."
 travel_danger_events.6010.owner: "Moje vojsko si s tím snadno poradí. A tohle má být [siege_victim.Custom('FortifiedBuilding')]? [siege_victim.GetTitledFirstName] se snad musí stydět."
 travel_danger_events.6010.war_owner: "S trochou štěstí útočníci zvítězí a [siege_victim.GetTitledFirstName] skončí vyvlečen ven za hlasitého křiku a odporu."
 travel_danger_events.6010.war_victim: "Kéž se dá něco udělat! [siege_victim.GetTitledFirstName] potřebuje pomoc. Ať už [Select_CString(siege_owner.IsFemale,'ta proklatá','ten proklatý')] [siege_owner.GetTitledFirstName] zmizí!"
 travel_danger_events.6010.ally_owner: "Jsem si jist, že můj spojenec nakonec zvítězí a přiměje [siege_victim.GetTitledFirstName] nést následky."
 travel_danger_events.6010.ally_victim: "Mohu jen přihlížet. [siege_victim.GetTitledFirstName] stojí na mé straně, ale pomalu a jistě přichází o své državy."
 travel_danger_events.6010.relation_owner: "[siege_owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siege_owner'))], zjevně hodlá [siege_victim.GetTitledFirstName] srazit na kolena, ať to stojí cokoli."
 travel_danger_events.6010.relation_victim: "[siege_victim.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siege_victim'))], má zjevně plné ruce práce s obranou tohoto místa před vojskem, které vede [siege_owner.GetTitledFirstName]."
 travel_danger_events.6010.sieger_liege: "[siege_owner.GetTitledFirstName] patří mezi mé vazaly a zjevně hodlá [siege_victim.GetTitledFirstName] srazit na kolena, ať to stojí cokoli."
 travel_danger_events.6010.peace: "Tahle malá šarvátka, kterou vedou [siege_owner.GetTitledFirstName] a [siege_victim.GetTitledFirstName], je rozhodně nepříjemná."
 travel_danger_events.6010.raid_end: "Mezi hořícími chatrčemi se lidé přehrabují v troskách, porovnávají kořist a vyprávějí si o svých hrdinských činech.\n\nPo cestě k nám míří skupina zachmuřených otrhaných nájezdníků. Nevypadají ani chytře, ani počestně..."
 travel_danger_events.6010.siege_end: "Všude kolem stojí [siege_owner.Custom('RegionalArtilleryPlural')]; v dálce se vojáci hřejí u skomírajících táborových ohňů.\n\n$travel_danger_events.6010.closing$"
 travel_danger_events.6010.closing: "Po cestě k nám míří skupina zachmuřených otrhaných vojáků. Nevypadají ani chytře, ani počestně..."
 travel_danger_events.6010.a: "Zkusme splynout s rolníky..."
 travel_danger_events.6010.a.success: "Projdeš bez povšimnutí"
 travel_danger_events.6010.a.failure: "Všimnou si tvého přepychu"
 travel_danger_events.6010.capture_toast: "Zajetí cestovatele"
 travel_danger_events.6010.b: "Jsem [ROOT.Char.GetTitledFirstNameNoTooltip]! Nechají nás projít."
 travel_danger_events.6010.b.friend: "[siege_commander.GetTitledFirstNameNoTooltip] mě zná. Jsme dobří přátelé."
 travel_danger_events.6010.b.flavor: "#EMP Máte vůbec#! #EMP ponětí, kdo jsem?!#!"
 travel_danger_events.6010.b.success: "Tvé postavení je zaskočí"
 travel_danger_events.6010.b.failure: "Neudělá to na ně dojem"
 travel_danger_events.6010.c: "Ukázka síly je odradí."
 travel_danger_events.6010.c.success: "Nechají tě na pokoji"
 travel_danger_events.6010.c.failure: "Postaví se ti"
 travel_danger_events.6010.c.wound: "Náhodný člen doprovodu utrpí zranění"
 travel_danger_events.6010.d: "Stačí je podplatit."
 travel_danger_events.6011.t: "$travel_danger_prefix$ Bitva před námi"
 travel_danger_events.6011.intro: "Varování vyděšených místních je sotva potřeba. Před námi zjevně zuří bitva a všude kolem jsou patrné stopy války, její oběti i provizorní tábory.\n\n"
 travel_danger_events.6011.battle_both: "Vojska mých nepřátel [battle_owner_1.GetTitledFirstName] a [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.war_battle_1: "Vojska [Select_CString(battle_owner_1.IsFemale,'mé nepřítelkyně','mého nepřítele')] [battle_owner_1.GetTitledFirstName] a [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.war_battle_2: "Vojska [Select_CString(battle_owner_2.IsFemale,'mé nepřítelkyně','mého nepřítele')] [battle_owner_2.GetTitledFirstName] a [battle_owner_1.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.ally_battle_1: "Vojska [Select_CString(battle_owner_1.IsFemale,'mé spojenkyně','mého spojence')] [battle_owner_1.GetTitledFirstName] a [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.ally_battle_2: "Vojska [Select_CString(battle_owner_2.IsFemale,'mé spojenkyně','mého spojence')] [battle_owner_2.GetTitledFirstName] a [battle_owner_1.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.relation_battle_1: "Vojska [battle_owner_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('battle_owner_1'))], a [battle_owner_2.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.relation_battle_2: "Vojska [battle_owner_2.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('battle_owner_2'))], a [battle_owner_1.GetTitledFirstName] $travel_danger_events.6011.clash$"
 travel_danger_events.6011.peace: "Vojska pod [battle_owner_1.GetPrimaryTitle.GetAdjectiveNoTooltip] a [battle_owner_2.GetPrimaryTitle.GetAdjectiveNoTooltip] praporci $travel_danger_events.6011.clash$"
 travel_danger_events.6011.clash: "se v dálce střetávají na území, kde se rozprostírají [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')],"
 travel_danger_events.6011.war: "a rozhodují tak svou [battle_war.Custom('WarCasusBelliShort')]."
 travel_danger_events.6011.raid_both: "a rvou se o zbytky kořisti."
 travel_danger_events.6011.raid: "jedni chtějí plenit a druzí si kořist uchovat."
 travel_danger_events.6011.hostile: "a vyřizují si jakýsi malicherný spor."
 travel_danger_events.6011.end: "\n\nOpodál se potají vytrácí zubožená skupina, možná dezertéři nebo žoldnéři, a míří přímo k nám."
 travel_danger_events.6011.b: "[ROOT.Char.GetTitleAsNameNoTooltip] jim jistě stojí za trochu úcty!"
 travel_danger_events.6011.d: "Rozumějí jen řeči peněz."
 travel_danger_events.6012.t: "$travel_danger_prefix$ Průchod vojska"
 travel_danger_events.6012.intro: "Cesty jsou přeplněné vozy a posilami pochodujícího vojska. V dálce se na slunci lesknou pestré [army_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] praporce a pomalu postupují krajinou, kde se rozprostírají [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')].\n\n"
 travel_danger_events.6012.war: "Pohled na vojsko [Select_CString(army_owner.IsFemale,'mé nepřítelkyně','mého nepřítele')] [army_owner.GetTitledFirstName] mě naplňuje hrůzou,"
 travel_danger_events.6012.ally: "Pohled na vojsko [Select_CString(army_owner.IsFemale,'mé spojenkyně','mého spojence')] [army_owner.GetTitledFirstName] mě naopak potěší,"
 travel_danger_events.6012.relation: "Pohled na vojsko [army_owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('army_owner'))], mě přiměje zbystřit,"
 travel_danger_events.6012.peace: "Pohled na toto vojsko znepokojí celý doprovod,"
 travel_danger_events.6012.clash: "střetávající se v dálce na území, kde se rozprostírají [ROOT.Char.GetCurrentLocation.Custom('GetTerrainLandPlural')],"
 travel_danger_events.6012.raid: "protože míří vyplenit nějakou nešťastnou vesnici."
 travel_danger_events.6012.other: "protože postupuje za jakýmsi vzdáleným cílem."
 travel_danger_events.6012.end: "\n\nZ opačného směru přichází zbědovaná skupina vojáků. Vypadají jako dezertéři."
 travel_danger_events.6013.t: "$travel_danger_prefix$ Sporné území"
 travel_danger_events.6013.intro: "Když procházíme oblastí [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], jsou všude patrné jizvy války. Původní praporce tu byly narychlo nahrazeny [occupy_owner.GetPrimaryTitle.GetAdjectiveNoTooltip] barvami.\n\n"
 travel_danger_events.6013.war_owner: "Je zřejmé, že [Select_CString(occupy_owner.IsFemale,'má nepřítelkyně','můj nepřítel')] [occupy_owner.GetTitledFirstName] získává v boji proti [occupy_victim.GetTitledFirstName] převahu,"
 travel_danger_events.6013.war_victim: "Je zřejmé, že [Select_CString(occupy_victim.IsFemale,'má nepřítelkyně','můj nepřítel')] [occupy_victim.GetTitledFirstName] v boji proti [occupy_owner.GetTitledFirstName] utrpěla několik nezdarů,"
 travel_danger_events.6013.ally_owner: "Je zřejmé, že [Select_CString(occupy_owner.IsFemale,'má spojenkyně','můj spojenec')] [occupy_owner.GetTitledFirstName] získává v boji proti [occupy_victim.GetTitledFirstName] převahu,"
 travel_danger_events.6013.ally_victim: "Je zřejmé, že [Select_CString(occupy_victim.IsFemale,'má spojenkyně','můj spojenec')] [occupy_victim.GetTitledFirstName] v boji proti [occupy_owner.GetTitledFirstName] utrpěla několik nezdarů,"
 travel_danger_events.6013.relation_owner: "[occupy_owner.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('occupy_owner'))], má v boji proti [occupy_victim.GetTitledFirstName] zjevně navrch,"
 travel_danger_events.6013.relation_victim: "[occupy_victim.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('occupy_victim'))], v boji proti [occupy_owner.GetTitledFirstName] zjevně utrpěla několik nezdarů,"
 travel_danger_events.6013.peace: "Máme štěstí, že samotný boj už minul,"
 travel_danger_events.6013.war: "přestože [occupy_war.Custom('WarCasusBelliShort')] zuří dál na jiných místech."
 travel_danger_events.6013.hostile: "ale kdo ví, jak celý střet nakonec dopadne."
 travel_danger_events.6013.end: "\n\nKdyž pokračujeme k [destination.GetNameNoTooltip], z opačného směru se k nám blíží hrozivě vyhlížející skupina veteránů."
 regional_artillery_bombard: "bombarda"
 regional_artillery_bombard_plural: "bombardy"
 regional_artillery_trebuchet: "trebuchet"
 regional_artillery_trebuchet_plural: "trebuchety"
 regional_artillery_mangonel: "mangonel"
 regional_artillery_mangonel_plural: "mangonely"
