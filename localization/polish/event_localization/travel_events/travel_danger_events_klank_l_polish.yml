l_polish:
 travel_danger_events.3000.t: "$travel_danger_prefix$ Na horské stezce"
 travel_danger_events.3000.desc.first_time: "Krok za krokem pomalu postupuji po úzké horské stezce. Náhle zaslechnu rachot a výkřik, který vzápětí utichne.\n\nVyděšeně se otočím. Místo [fallen_victim.GetFirstName], který ještě před chvílí kráčel za mnou, přede mnou stojí jen stejně zmatená a unavená tvář [char_next_in_line.GetFirstName] a za ní čerstvě uvolněné kamení.\n\n„Kde je [fallen_victim.GetFirstNameNoTooltip]?“ dožaduji se odpovědi, ale ze suchých úst mi hlas sotva vychází.\n\nJedinou odpovědí je tiché hvízdání větru."
 travel_danger_events.3000.desc.second_time: "Kráčím dál po zdánlivě nekonečné úzké horské stezce. Cítím, jak mi únavový závoj zatemňuje mysl. Slýchám klamavý šepot polozapomenutých vzpomínek a tiché hvízdání větru.\n\nPronikavý výkřik [fallen_victim.GetFirstName] je však až příliš skutečný. Po zádech mi přeběhne mráz a já se pomalu otočím. Znovu spatřím v našem zástupu mezeru velikosti člověka.\n\n„My jsme... právě... přišli o dalšího člověka?“ pronáším pomalu. [char_next_in_line.GetFirstName] nemusí nic říkat. [Select_CString(char_next_in_line.IsFemale,'Její','Jeho')] tvář ztuhlá hrůzou je dostatečnou odpovědí."
 travel_danger_events.3000.a.first_time: "Dívejte se, kam šlapete! Musíme pokračovat."
 travel_danger_events.3000.a.second_time: "Ach, [fallen_victim.GetFirstNameNoTooltip]! #EMP [Select_CString(ROOT.Char.IsFemale,'Říkala','Říkal')] jsem#! ti, ať dáváš pozor, kam šlapeš!"
 travel_danger_events.3000.a.tt: "Zrádný terén si vyžádal další oběť. Rozhodně ne první a jistě ani poslední."
 travel_danger_events.3000.b: "[fallen_victim.GetFirstNameNoTooltip]! [fallen_victim.GetFirstNameNoTooltip]! Zachráníme tě!"
 travel_danger_events.3000.b.tt: "Ty a tvůj doprovod se pokusíte o záchranu v horách. #EMP #X Je to velmi nebezpečné.#! #!Mnozí zahynou."
 travel_danger_events.3000.b.found_nothing: "[fallen_victim.GetFirstNameNoTooltip] [Select_CString(fallen_victim.IsFemale,'nebyla nalezena','nebyl nalezen')]."
 travel_danger_events.3000.b.found_cloth: "Nalezen byl jen roztrhaný a zkrvavený kus látky."
 travel_danger_events.3000.b.found_fallen_victim: "Navzdory všem předpokladům [fallen_victim.GetFirstNameNoTooltip] [Select_CString(fallen_victim.IsFemale,'byla nalezena živá','byl nalezen živ')]."
 travel_danger_events.3000.c.first_time: "Bude v našich modlitbách."
 travel_danger_events.3000.c.second_time: "Kéž nás [ROOT.Char.GetFaith.HighGodName] ochrání před nebezpečím!"
 travel_danger_events.3000.d.first_time: "[Select_CString(ROOT.Char.IsFemale,'Sama bych to nezvládla','Sám bych to nezvládl')] lépe!"
 travel_danger_events.3000.d.second_time: "Podruhé je to ještě zábavnější!"
 travel_danger_events.3001.t: "$travel_danger_prefix$ Lavina!"
 travel_danger_events.3001.desc: "Po dlouhé a namáhavé cestě mezi zasněženými horskými štíty se pomalu zahřívám u plápolajícího ohně v místním hostinci, zatímco [first_avalanche_victim.GetFirstName] a [second_avalanche_victim.GetFirstName] venku pečují o naši karavanu. Náhle se z dálky ozve mohutná, hluboká a dunivá rána.\n\n„Lavina!“ někdo vykřikne. Než kdokoli uvnitř stihne zareagovat, hluk sílí a sílí, až vyvrcholí prudkým nárazem, který otřese zdmi i podlahou. Po úderu srdce, nebo snad po celé věčnosti, nastane ještě děsivější ticho."
 travel_danger_events.3001.a: "[ROOT.Char.GetCulture.GetCollectiveNoun] vědí, jak přežít v horách."
 travel_danger_events.3001.a.alternate: "[travel_leader.GetCulture.GetCollectiveNoun] vědí, jak přežít v horách."
 travel_danger_events.3001.a.flavor: "Tohle není nic proti pořádné [ROOT.Char.GetCulture.GetName] lavině!"
 travel_danger_events.3001.a.flavor.alternate: "Můj $travel_leader_court_position$ [travel_leader.GetFirstName] díky svému [travel_leader.GetCulture.GetName] původu učinil nezbytná opatření proti nebezpečím hor."
 travel_danger_events.3001.b: "Vydržte, pomoc je na cestě!"
 travel_danger_events.3001.b.flavor: "Když jsou lidé zasypaní pod sněhem, rozhoduje každá chvíle!"
 travel_danger_events.3001.b.success: "Rychlá záchrana po lavině"
 travel_danger_events.3001.b.failure: "Obtížná záchrana po lavině"
 travel_danger_events.3001.c: "Zůstanu uvnitř... ještě chvíli."
 travel_danger_events.3002.opening: "[ROOT.Char.GetTitledFirstName],"
 travel_danger_events.3002.desc: "S politováním vás musím informovat, že místem [avalanche_location.GetName] nedávno prošla strašlivá lavina.\n\nVzala si mnoho životů a narušila životy těch, kteří přežili, včetně pocestných, kteří oblastí procházeli."
 travel_danger_events.3002.a.special: "Já vím! #EMP [Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem tam!#!"
 travel_danger_events.3002.a.default: "To je strašné!"
 travel_danger_events.3002.b: "Tohle jim pomůže zotavit se."
 travel_danger_events.3003.t: "$travel_danger_prefix$ Zasypáni sněhem"
 travel_danger_events.3003.desc: "Sněží už celé dny. Cesta před námi vypadá naprosto neprůchodně. Když se však zadívám dopředu, spatřím malou skupinu lidí, kteří se k nám rychle blíží přes závěje. Zanedlouho přede mnou stojí [maron_leader.GetWomanMan] a s širokým úsměvem promluví:\n\n„Zdá se, že jste se ocitli v pěkné šlamastyce. Ale nebojte se. Za rozumnou cenu vám pomůžeme znovu vyrazit na cestu.“"
 travel_danger_events.3003.a: "Pomáhat druhým je odměnou samo o sobě!"
 travel_danger_events.3003.a.success: "Můj doprovod se rychle dává znovu do pohybu!"
 travel_danger_events.3003.a.failure: "Můj doprovod stále vězí ve sněhu"
 travel_danger_events.3003.b: "To je férová cena."
 travel_danger_events.3003.c: "Poradíme si sami."
 travel_danger_events.3003.c.flavor: "Naše zkušenosti se zimou nám pomohou znovu vyrazit... pokud nějaké máme."
 travel_danger_events.3003.c.complete_success: "Můj doprovod se rychle dává znovu do pohybu!"
 travel_danger_events.3003.c.partial_success: "Můj doprovod se pomalu dává znovu do pohybu"
 travel_danger_events.3003.c.failure: "Můj doprovod uvázl ve sněhu"
 travel_danger_events.3004.t: "$travel_danger_prefix$ Bílá bouře"
 travel_danger_events.3004.desc: "„Bílá bouře! Stočit na levobok!“\n\nDěsivý výkřik kormidelníka se ke klidnému počasí vůbec nehodí. Mé uši však plní stále sílící hukot větru. V jediném okamžiku celou loď pohltí vlhká bílá mlha. Ještě hlasitěji než vítr zapraská hlavní stěžeň a zřítí se přes palubu.\n\nStejně náhle, jako přišla, bouře zase odezní. Naše loď se líně houpe na klidném moři a vleče za sebou potrhané plachty a zlomená vesla."
 travel_danger_events.3004.a: "Musíme nějak vztyčit provizorní plachty!"
 travel_danger_events.3004.a.success: "Naše loď znovu pluje!"
 travel_danger_events.3004.a.failure: "Pomalu nás unáší vítr"
 travel_danger_events.3004.b: "Žádný strach! Máme další plachty."
 travel_danger_events.3004.b.flavor: "Díky námořním zkušenostem našeho doprovodu jsme na něco takového byli připraveni. Z uložených plachet a dřevěných trámů rychle vztyčíme nové oplachtění."
 travel_danger_events.3004.c: "Někdo nás #EMP určitě#! najde... doufám"
 travel_danger_events.3004.c.success: "Proplouvající loď nabízí pomoc"
 travel_danger_events.3004.c.failure: "Po celé dny není spatřena žádná jiná loď"
 travel_danger_events.3005.t: "$travel_danger_prefix$ Noční požár"
 travel_danger_events.3005.desc: "Pozdě odpoledne kráčíme mezi kopci. Tma přichází náhle spolu s temnými mraky nad námi. Pak se v dálce ozve hlasité zadunění hromu. Brzy následuje další, doprovázené oslnivým zábleskem blesku.\n\nPak udeří znovu a jasně ozáří celé okolí, až mi jeho obraz zůstane vypálený v očích. Zamrkám a spatřím místo zásahu: křoviny už hoří a plameny se rychle šíří. Přímo k nám!"
 travel_danger_events.3005.a: "UTÍKEJTE!"
 travel_danger_events.3005.a.success: "Utíkáme před požárem"
 travel_danger_events.3005.a.failure: "Oheň nás při útěku dostihne!"
 travel_danger_events.3005.b: "Uhaste oheň, než se rozšíří příliš daleko!"
 travel_danger_events.3005.b.success: "Úspěšně oheň uhasíš"
 travel_danger_events.3005.b.failure: "Oheň je zastaven, ale ne bez následků"
 travel_danger_events.3005.b.c_failure: "Oheň pohltí můj doprovod!"
