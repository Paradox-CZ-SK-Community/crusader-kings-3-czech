l_polish:
 travel_danger_prefix: "Nebezpečí:"
 travel_danger_events.1000.t: "$travel_danger_prefix$ Z krtinců hory"
 travel_danger_events.1000.desc: "Cesta je posledních několik hodin čím dál kopcovitější a na všech už začíná být znát únava. Kopcům přitom není konce. Přistoupí ke mně [travel_leader.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('travel_leader'))], a řekne:\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], naše zvířata už takhle dlouho nevydrží. Chudáci si musí odpočinout, jinak se obávám, že se zhroutí! Musíme zastavit!“\n\nDobře přitom ví, že nás to na cestě k [destination.GetName] zdrží..."
 travel_danger_events.1000.a: "[travel_leader.GetFirstNameNoTooltip] má pravdu. Bylo by moudré si odpočinout."
 travel_danger_events.1000.b: "„Žádné zdržování nestrpím. Pokračujeme!“"
 travel_danger_events.1001.t: "$travel_danger_events.1000.t$"
 travel_danger_events.1001.desc: "Nutím nás pokračovat ještě o kus dál, odhodlán[Select_CString(ROOT.Char.IsFemale,'a','')] dorazit k [destination.GetName] podle plánu. Když vystoupáme na dosud nejvyšší kopec, začínám doufat, že naše trápení konečně skončilo, když tu náhle...\n\n#EMP ŽUCH! ... ŽUCH, ŽUCH, ŽUCH!#!\n\nOtočím se za tím zvukem a zalapám po dechu. Jedno zvíře za druhým se hroutí k zemi! [travel_leader.GetFirstName] měl[Select_CString(travel_leader.IsFemale,'a','')] pravdu... Ubohá zvířata vydrží jen určitou námahu. [Select_CString(ROOT.Char.IsFemale,'Měla jsem','Měl jsem')] poslechnout, dokud byla příležitost."
 travel_danger_events.1001.a: "„[travel_leader.GetFirstNameNoTooltip], vydej se do nejbližšího města a kup nám čerstvá jízdní zvířata.“"
 travel_danger_events.1001.b: "„Budeme pokračovat pěšky!“"
 travel_danger_events.1002.t: "$travel_danger_prefix$ Zrádné svahy"
 travel_danger_events.1002.desc: "Při cestě oblastí [current_location.GetName] se kochám nádherným výhledem z horského úbočí. Když od něj konečně odtrhnu oči a znovu se zadívám na kamenitou stezku před námi, zjistím, že nás obklíčila skupina hrdlořezů! Před naši karavanu předstoupí [Select_CString(bandit.IsFemale,'hrůzu nahánějící žena, patrně jejich vůdkyně','hrůzu nahánějící muž, patrně jejich vůdce')].\n\n„Za průchod těmihle horami se platí. Je mi jedno, kdo jste. Kdo chce přes moje hory, platí.“"
 travel_danger_events.1002.a: "„Můžeme se přece dohodnout.“"
 travel_danger_events.1002.a.success: "Přesvědčíš bandity"
 travel_danger_events.1002.a.success.desc: "Ty i tvůj doprovod můžete volně projít horským průsmykem"
 travel_danger_events.1002.a.failure: "Bandity nepřesvědčíš"
 travel_danger_events.1002.a.failure.desc: "Zaplatíš banditům za bezpečný průchod"
 travel_danger_events.1002.b: "„Tak snadno se nepodvolím. #EMP Do boje!#!“"
 travel_danger_events.1002.b.success: "Porazíš bandity"
 travel_danger_events.1002.b.success.desc: "$travel_danger_events.1002.a.success.desc$"
 travel_danger_events.1002.b.failure: "Bandité tě porazí"
 travel_danger_events.1002.b.failure.desc: "$travel_danger_events.1002.a.failure.desc$"
 travel_danger_events.1002.c: "„Stráže! Postarejte se o tyhle hlupáky!“"
 travel_danger_events.1002.c.tt: "Pošleš své stráže z [Concept('travel_option','možnosti cestování')|E], aby se vypořádaly s bandity"
 travel_danger_events.1002.d: "„A co kdybych vám zaplatil[Select_CString(ROOT.Char.IsFemale,'a','')], abyste nás místo toho provedli horami?“"
 travel_danger_events.1002.e: "Je to jejich země..."
 travel_danger_events.1003.t: "$travel_danger_prefix$ Zrádné močály"
 travel_danger_events.1003.desc: "Vím, že bažinami oblasti [current_location.GetName] musíme postupovat opatrně. Tohle tísnivé místo mě zneklidňuje až do morku kostí a číhá tu bezpočet nebezpečí. Celému doprovodu jsem proto nařídil[Select_CString(ROOT.Char.IsFemale,'a','')], aby dbal veškeré možné opatrnosti.\n\nZ čela kolony se ohlédnu a přepočítám své společníky...\n\n#EMP Někdo chybí!#!"
 travel_danger_events.1003.a: "Mohu poslat [travel_leader.GetFirstNameNoTooltip], aby toho, kdo chybí, našel."
 travel_danger_events.1003.b.success: "[Select_CString(missing_companion.IsFemale,'Pohřešovaná společnice nalezena','Pohřešovaný společník nalezen')]"
 travel_danger_events.1003.b.success.desc: "[missing_companion.GetShortUIName] se vrátí k tvému doprovodu"
 travel_danger_events.1003.b.failure: "[Select_CString(missing_companion.IsFemale,'Pohřešovaná společnice ztracena','Pohřešovaný společník ztracen')]"
 travel_danger_events.1003.b: "Už není co zachraňovat. Jdeme dál."
 travel_danger_events.1006.t: "$travel_danger_prefix$ Povědomé stromy"
 travel_danger_events.1006.desc: "„Neviděli jsme už tenhle obrovský strom? Přísahám, že chodíme pořád dokola!“ ozve se [travel_leader.GetName] z čela naší karavany.\n\nMožná má pravdu... Už celé hodiny jsme nezahlédli nic, co by naznačovalo, že se z tohohle lesa dostáváme. Jsme vůbec ještě #EMP v#! [current_location.GetName]? Husté koruny stromů nám nedovolují poznat denní dobu ani směr, kterým jdeme.\n\nTakhle se k [destination.GetName] nikdy nedostaneme..."
 travel_danger_events.1006.a: "Vím #EMP přesně#!, kde jsme!"
 travel_danger_events.1006.a.success: "Najdeš správnou cestu"
 travel_danger_events.1006.a.success.desc: "Získáš zkušenosti s nebezpečím"
 travel_danger_events.1006.a.failure: "Nedaří se ti najít správnou cestu"
 travel_danger_events.1006.b: "Pošleme někoho najít místního průvodce."
 travel_danger_events.1006.b.hire_guide: "Pokusíš se najmout průvodce"
 travel_danger_events.1006.c: "Pošleme napřed zvědy."
 travel_danger_events.1006.c.major_speed_decrease: "Tvá cesta se výrazně zdrží"
 travel_danger_events.1006.c.minor_speed_decrease: "Tvá cesta se mírně zdrží"
 travel_danger_events.1007.t: "$travel_danger_prefix$ Ani kapka"
 travel_danger_events.1007.desc: "Naše cesta k [destination.GetName] nás bohužel zavedla přímo přes pustiny oblasti [current_location.GetName]. Na tak dlouhý úsek bez jediného zdroje vody jsme nebyli připraveni a mnozí z mých společníků už vypadají, jako by je někdo nechal na slunci vyschnout stejně jako [ROOT.Char.Custom('RegionalRootVegetablePlural')].\n\nMusím něco udělat... a rychle!"
 travel_danger_events.1007.a: "Znám nedalekou oázu, která by mohla být naší záchranou."
 travel_danger_events.1007.a.tt: "Tvůj plán cesty bude změněn tak, aby vedl k oáze."
 travel_danger_events.1007.b: "[water_hider.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('water_hider'))], pije jako #EMP duha#!. Tomu je konec!"
 travel_danger_events.1007.b.success: "Společníci se nechají inspirovat"
 travel_danger_events.1007.b.success.desc: "[water_hider.GetFirstName] zemře žízní"
 travel_danger_events.1007.b.failure: "Společníky se nepodaří inspirovat"
 travel_danger_events.1007.b.failure.desc: "[water_hider.GetFirstName] trpí těžkou dehydratací"
 travel_danger_events.1007.c: "Musíme pokračovat."
 travel_danger_events.1007.c.tt: "Vyslechneš [water_hider.GetFirstName] kvůli tajné zásobě vody"
 travel_danger_events.1007.c.success: "Při výslechu se podaří najít vodu"
 travel_danger_events.1007.c.failure: "Při výslechu se žádnou vodu najít nepodaří"
 dehydrated_modifier: "Dehydratace"
 dehydrated_modifier_desc: "Tato postava po cestě pouští trpí dehydratací."
 travel_danger_events.1007.d: "Ještě že jsme vzali vodu navíc!"
 travel_danger_events.1008.t: "$travel_danger_prefix$ Následky"
 travel_danger_events.1008.desc: "Naše cesta nás zavede přes [current_location.GetName]. Z kdysi krásného [current_location_barony.Custom('BaronyTownType')] zůstal pouhý stín někdejší podoby.\n\nZ hromad trosek, které bývaly domovy, se stále kouří. Nemilosrdné vojsko tu po sobě zanechalo jen zkázu. Mezi pozůstatky čehosi, co snad kdysi bývalo statkem, se se slzami v očích a tváří umazanou od špíny přehrabuje [Select_CString(zombie.IsFemale,'žena','muž')] a hledá cokoli ze svého majetku, co mohlo přežít.\n\nVšimne si nás, v této zpustošené krajině očividně nepatřičných, a rozběhne se přímo k našemu doprovodu!"
 travel_danger_events.1008.a: "„Stráže! Zastavte [Select_CString(zombie.IsFemale,'tu ženu','toho muže')]!“"
 travel_danger_events.1008.a.tt: "[zombie.GetFirstNameNoTooltip] zemře na tvůj rozkaz"
 travel_danger_events.1008.b: "Určitě nám nechce ublížit."
 travel_danger_events.1008.c: "„#EMP Stůj!#! Vezmi si tohle a běž svou cestou.“"
 travel_danger_events.1008.good_intentions: "[zombie.GetFirstNameNoTooltip] nemá zlé úmysly"
 travel_danger_events.1008.bad_intentions: "[zombie.GetFirstNameNoTooltip] má nekalé úmysly"
 travel_danger_events.1009.t: "$travel_danger_events.1008.t$ a dobré úmysly"
 travel_danger_events.1009.desc: "Vyhublá postava rychle překoná vzdálenost mezi námi a desítek těl rozesetých po zemi si ani nevšimne. [zombie.GetTitledFirstName] přede mnou skloní hlavu a promluví:\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], můj domov lehl popelem a přišel jsem o všechno, čím jsem se živil. Vydávám se vám na milost. #EMP Prosím, pomozte mi!#!“"
 travel_danger_events.1009.a: "„Ty ubožáku...“"
 travel_danger_events.1009.b: "#EMP Stejně [Select_CString(zombie.IsFemale,'ji zabijte','ho zabijte')]!#!"
 travel_danger_events.1009.c: "„Vezmu tě pod svou ochranu!“"
 travel_danger_events.1009.d: "To vlastně není můj problém, že?"
 travel_danger_events.1010.t: "$travel_danger_events.1008.t$ a nekalé úmysly"
 travel_danger_events.1010.desc: "Vyhublá postava rychle překoná vzdálenost mezi námi a desítek těl rozesetých po zemi si ani nevšimne. [zombie.GetTitledFirstName] se na mě vrhne s vyceněnými zuby a divokou zuřivostí v očích."
 travel_danger_events.1010.a: "„Tohle zvládnu!“"
 travel_danger_events.1010.a.success: "Útočníka odrazíš"
 travel_danger_events.1010.a.failure: "Útočník tě zraní"
 travel_danger_events.1010.b: "#EMP Stráže!#!"
 travel_danger_events.1010.b.success: "Útočník je odražen"
 travel_danger_events.1010.b.failure: "Člen doprovodu utrpí zranění"
 travel_danger_events.1010.tt: "[zombie.GetFirstNameNoTooltip] uteče"
 travel_danger_events.1011.t: "$travel_danger_prefix$ Omrzliny"
 travel_danger_events.1011.t_twice: "$travel_danger_prefix$ Ledová muka"
 travel_danger_events.1011.t_thrice: "$travel_danger_prefix$ Smrtící omrzliny"
 travel_danger_events.1011.desc: "Už několik dní sněží a zima je nesnesitelná. Rozhlédnu se kolem sebe a vidím, že stejně trpí i můj doprovod, a tak sesednu a pokračuji pěšky s ostatními. Po další hodině chůze sněhovou bouří si mě [frostbite_victim.GetTitledFirstName] odvede stranou a roztřeseným hlasem vykřikne:\n\n„Prosím, [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)], už vůbec necítím [frostbite_victim.Custom('GetFrostbittenBodyPart')]!“"
 travel_danger_events.1011.desc_frostbite_twice: "Cesta si na naší karavaně opět vybírá krutou daň. Neustálé sněhové bouře a třeskutý mráz nás donutily rozbít tábor. Jdu se podívat na [frostbite_victim.GetTitledFirstName], protože omrzliny už přišly jednou a teď nezbývá než ležet na provizorním lůžku.\n\n„Není mi vůbec dobře, [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)].“ Přesně jak jsem se obával, mráz znovu zasáhl [frostbite_victim.Custom('GetFrostbittenBodyPart')]!"
 travel_danger_events.1011.desc_frostbite_thrice: "Zima nás znovu překvapí svou krutostí. Cesty jsou větrné a kluzké a viditelnost klesla stejně hluboko jako naše nálada. Musím se podívat na [frostbite_victim.GetTitledFirstName], protože omrzliny udeřily už dvakrát.\n\n„Je mi taková zima, [frostbite_victim.Custom2('RelationToMeShort', ROOT.Char)]...“ zazní sotva slyšitelný šepot a vzápětí přijde bezvědomí. Mráz udeřil potřetí a tentokrát z [frostbite_victim.GetNameNoTooltip] pomalu vyhání poslední dech."
 travel_danger_events.1011.desc_head: "$travel_danger_events.1011.desc$ Podívám se zblízka. [frostbite_victim.Custom('GetFrostbittenBodyPart')] má špičku pokrytou ledem a mírně otéká. Jestli nic neudělám, může to být ještě mnohem horší!"
 travel_danger_events.1011.desc_upper_limb: "$travel_danger_events.1011.desc$ Pokus sevřít ruku v pěst skončí kvůli nesnesitelné bolesti. [frostbite_victim.Custom('GetFrostbittenBodyPart')] je oteklá a zbarvená nejrůznějšími odstíny modré a černé."
 travel_danger_events.1011.desc_lower_limb: "$travel_danger_events.1011.desc$ Nařídím sundat botu a prohlédnu si [frostbite_victim.Custom('GetFrostbittenBodyPart')]. Už je celá tmavě modrá a možná je příliš pozdě ji zachránit."
 travel_danger_events.1011.desc_head_twice: "$travel_danger_events.1011.desc_frostbite_twice$ Tentokrát si [frostbite_victim.Custom('GetFrostbittenBodyPart')] prohlédnu a porovnám ji s uchem. Modré zbarvení je světlejší, ale možná jen proto, že tato omrzlina je ještě čerstvá."
 travel_danger_events.1011.desc_upper_limb_twice: "$travel_danger_events.1011.desc_frostbite_twice$ Stará omrzlina prstu se ještě zhoršila a rozšířila se na celou [frostbite_victim.Custom('GetFrostbittenBodyPart')]. Takhle brzy přijde na řadu celá paže!"
 travel_danger_events.1011.desc_lower_limb_twice: "$travel_danger_events.1011.desc_frostbite_twice$ Chytím botu a pomohu ji stáhnout. Chvíli s ní zápasíme, ale nakonec se nám podaří odhalit oteklou [frostbite_victim.Custom('GetFrostbittenBodyPart')]. Jestli to takhle půjde dál, brzy bude v ohrožení celá noha!"
 travel_danger_events.1011.desc_head_thrice: "$travel_danger_events.1011.desc_frostbite_thrice$ Omrzliny se rozšířily i na druhou [frostbite_victim.Custom('GetFrostbittenBodyPart')] a celý obličej je teď temně modrý a studený jako led. Jak je to vůbec možné?!"
 travel_danger_events.1011.desc_upper_limb_thrice: "$travel_danger_events.1011.desc_frostbite_thrice$ Ztráta [frostbite_victim.Custom('GetFrostbittenBodyPart')] otevřela mrazu cestu dál do horní poloviny těla. Hrudník i krk každou minutou tmavnou."
 travel_danger_events.1011.desc_lower_limb_thrice: "$travel_danger_events.1011.desc_frostbite_thrice$ Po ztrátě [frostbite_victim.Custom('GetFrostbittenBodyPart')] při předchozích omrzlinách se mráz pustil rovnou do břicha a celé tělo pomalu modrá."
 travel_danger_events.1011.a: "Spálíme [to_be_burned.GetNameNoTooltip], ať se [frostbite_victim.GetNameNoTooltip] zahřeje."
 travel_danger_events.1011.a.success: "[frostbite_victim.GetTitledFirstNameNoTooltip] pocítí příjemné teplo"
 travel_danger_events.1011.a.failure: "$travel_danger_events.1011.c.tt$"
 travel_danger_events.1011.a_frostbite_treatment_burn_failure: "Třeba tentokrát pomůže spálit [to_be_burned.GetNameNoTooltip]?"
 travel_danger_events.1011.b_physician: "[court_physician.GetTitledFirstNameNoTooltip] přece musí vědět, jak omrzliny léčit!"
 travel_danger_events.1011.b_physician_success: "$travel_danger_events.1011.b.success$"
 travel_danger_events.1011.b_physician_failure: "$travel_danger_events.1011.a.failure$"
 travel_danger_events.1011.b: "Jednou jsem o léčbě omrzlin [Select_CString(ROOT.Char.IsFemale,'četla','četl')] v rukopisu."
 travel_danger_events.1011.b.success: "Léčba omrzlin se podaří"
 travel_danger_events.1011.b.failure: "Léčba omrzlin selže"
 travel_danger_events.1011.b_root_knows_winter: "V zimě se přece jen vyznám."
 travel_danger_events.1011.b_frostbite_treatment_root_failure: "Poprvé se mi to možná nepovedlo, ale teď už vím, jak na to!"
 travel_danger_events.1011.b_physician_knows_winter: "[court_physician.GetNameNoTooltip] zná nástrahy zimy lépe než kdokoli z nás!"
 travel_danger_events.1011.b_frostbite_treatment_physician_failure: "Třeba si tentokrát [court_physician.GetNameNoTooltip] povede lépe?"
 travel_danger_events.1011.c: "Musíme pokračovat."
 travel_danger_events.1011.c.tt: "Omrzliny postavy [frostbite_victim.GetTitledFirstNameNoTooltip] zůstanou beze změny"
 travel_danger_events.1011.c.tt_mild: "[frostbite_victim.GetShortUIName] si ponechá [GetModifier('travel_mild_frostbite_modifier').GetNameWithTooltip]"
 travel_danger_events.1011.c.tt_severe: "[frostbite_victim.GetTitledFirstNameNoTooltip] si ponechá [GetModifier('travel_severe_frostbite_modifier').GetNameWithTooltip]"
 travel_danger_events.1011.c.success: "[frostbite_victim.GetTitledFirstNameNoTooltip] vydrží"
 travel_danger_events.1011.c.failure: "Omrzliny postavy [frostbite_victim.GetTitledFirstNameNoTooltip] se zhorší"
 travel_danger_events.1011.c_frostbite_treatment_none_success: "Jednou už to [frostbite_victim.GetNameNoTooltip] [Select_CString(frostbite_victim.IsFemale,'vydržela','vydržel')], zvládne to znovu!"
 travel_danger_events.1011.c_frostbite_treatment_none_failure: "Tentokrát bude [frostbite_victim.GetNameNoTooltip] v pořádku. Musíme vyrazit hned!"
 travel_danger_events.1012.t: "$travel_danger_prefix$ Lákavé ovoce"
 travel_danger_events.1012.desc: "Cesta nás vede nebezpečnými končinami oblasti [ROOT.Char.GetCurrentLocation.GetName]. Zatímco pozorně vyhlížím jakékoli nebezpečí před námi, mou pozornost upoutá šustění v křoví. Divoké zvíře? Připravím se na nejhorší, ale místo šelmy z křoví vyskočí [poisonous_plant_eater.GetFirstName] s jakousi rostlinou v ruce.\n\n„[poisonous_plant_eater.GetFirstNameNoTooltip]! Tohle mi nedělej! Tak ukaž, co to máš. Nějaký plod?"
 travel_danger_events.1012.desc_food_taster: "$travel_danger_events.1012.desc$ Raději se zeptáme [food_taster.GetFirstName].“\n\n„Musím říct, že je to zvláštní pochoutka a nic nenasvědčuje bezprostřednímu nebezpečí, ale...“ „Takže se to dá jíst!“ rychle skočí [food_taster.GetFirstName] do řeči [poisonous_plant_eater.GetFirstNameNoTooltip]."
 travel_danger_events.1012.desc_unknown: "$travel_danger_events.1012.desc$“ zvolám.\n\n„Ano! Vypadá to a voní to #EMP tak lahodně#!. Jaké to asi je? Možná jen malinko ochutnám?“ řekne [poisonous_plant_eater.GetFirstName]."
 travel_danger_events.1012.desc_again: "Cesta před námi je opět nebezpečná, a tak se raději utáboříme na noc. Zatímco ostatní stavějí tábor, zahlédnu [poisonous_plant_eater.GetFirstName], jak zvedá další neznámý plod.\n\n„Obdivuji tvou zvědavost, [poisonous_plant_eater.GetFirstNameNoTooltip].“\n\nUsměji se, odpovědí mi však je jen šibalský pohled a vzápětí výkřik:\n\n„Promiň, [poisonous_plant_eater.Custom2('RelationToMe', ROOT.Char)], ale nemůžu si pomoct!“ A už se zuby zakusují do plodu."
 travel_danger_events.1012.a: "„Počkej, co když je to jedovaté?!“"
 travel_danger_events.1012.a_again: "„Přestaň strkat #EMP všechno#! do pusy!“"
 travel_danger_events.1012.a.tt: "Popadneš rostlinu a zahodíš ji"
 travel_danger_events.1012.regular_plant: "Nakonec je to neškodná rostlina"
 travel_danger_events.1012.touched_poisonous_plant: "V místě, kde se rostlina dotkla kůže, se objeví vyrážka"
 travel_danger_events.1012.b: "Ať to [poisonous_plant_eater.GetFirstNameNoTooltip] sní."
 travel_danger_events.1012.ate_poisonous_plant: "Plod způsobí bolestivé žaludeční křeče"
 travel_danger_events.1012.ate_delicious_plant: "Plod osvěží tělo i mysl"
 travel_danger_events.1012.c: "„Jedině když ochutnám jako první!“"
 travel_danger_events.1012.c.tt: "Vezmeš plod a sníš ho"
 travel_danger_events.1013.t: "[Select_CString(runaway_character.IsFemale,'Utekla, nebo se ztratila?','Utekl, nebo se ztratil?')]"
 travel_danger_events.1013.desc: "Když se nám konečně podaří překonat nebezpečný úsek cesty v oblasti [ROOT.Char.GetCurrentLocation.GetName], náhle mě přepadne nepříjemný pocit, že někdo chybí. [runaway_character.GetFirstName] dnes celý den nikde není.\n\n"
 travel_danger_events.1013.desc_rival: "$travel_danger_events.1013.desc$Upřímně si nestěžuji. Když [runaway_character.GetFirstName] není na očích, hned je den lepší. Ostatní by to však mohlo odradit od další cesty. A před námi pořád jen [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]..."
 travel_danger_events.1013.desc_lover: "$travel_danger_events.1013.desc$Zároveň se mezi lidmi šíří zvěst o tajném setkání. Údajně se ho mají účastnit [runaway_character.GetFirstNameNoTooltip] a [current_location_holder.GetTitledFirstName]. Procházíme sice územím, kterému vládne [current_location_holder.GetTitledFirstName], ale taková schůzka mi vůbec nedává smysl. Vsadím se, že [runaway_character.GetFirstNameNoTooltip] teď jen někde bloudí. A všude kolem [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]!"
 travel_danger_events.1013.desc_knight: "$travel_danger_events.1013.desc$Při vstupu do válkou zmítané provincie připadl [runaway_character.GetFirstNameNoTooltip] zadní voj. Vzhledem k té kuráži to asi nebyl nejlepší nápad. Teď už nejspíš míří rovnou k přední linii! Pokud ovšem jen někde nebloudí. A kolem samé [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]?"
 travel_danger_events.1013.desc_child: "$travel_danger_events.1013.desc$To je zlé, vždyť je to pořád jen dítě! Co když se cestou někde ztratilo? Teď je určitě osamělé a hlavně hladové!"
 travel_danger_events.1013.a: "Vyšleme pátrací skupinu."
 travel_danger_events.1013.success: "Pátrací skupina najde [runaway_character.GetFirstNameNoTooltip]"
 travel_danger_events.1013.success_root: "Najdeš [runaway_character.GetFirstNameNoTooltip]"
 travel_danger_events.1013.failure: "[runaway_character.GetFirstNameNoTooltip] není nikde k nalezení"
 travel_danger_events.1013.failure_root: "Bezcílně bloudíš. Všude kolem jen [ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')]"
 travel_danger_events.1013.runaway_joins: "[runaway_character.GetFirstNameNoTooltip] se připojí k tvému dvoru"
 travel_danger_events.1013.runaway_return: "Vrátí se do [Concept('entourage','doprovodu')|E]"
 travel_danger_events.1013.b: "Najdu [runaway_character.GetFirstNameNoTooltip] sám!"
 travel_danger_events.1013.c: "Nechci riskovat, že se ztratí další lidé."
 delayed_toast: "Tvá cesta se zdrží"
 travel_hired_foreign_guide: "Najmutý cizí průvodce"
 travel_danger_events.1020.t: "[ROOT.Char.GetCurrentLocation.Custom('TerrainTypeProvince')|U], "
 travel_danger_events.1020.t.wetlands: "samé strasti"
 travel_danger_events.1020.t.floodplains: "samý strach"
 travel_danger_events.1020.t.jungle: "samé nebezpečí"
 travel_danger_events.1020.t.taiga: "samá hrůza"
 travel_danger_events.1020.desc.intro: "Už celé dny putujeme k cíli. Doprovod je unavený a stejně tak i můj statný oř [ROOT.Char.Custom('WarhorseStoryName')]. Právě se chystám sesednout, když cosi mé zvíře vyplaší. [ROOT.Char.Custom('HorseStoryMareStallion')|U] se splaší a vyrazí náhodným směrem. Ze všech sil se snažím udržet, ale nakonec mě prudký náraz shodí k zemi.\n\nPomalu se po pádu zvedám, když se z dálky ozve ržání [ROOT.Char.Custom('WarhorseStoryName')]. Celá má družina se okamžitě rozběhne za zvukem, aby zjistila, co se děje.\n\nMůj kůň bojuje o život,#!"
 travel_danger_events.1020.wetlands: " zvíře po kouskách pohlcuje bažina."
 travel_danger_events.1020.floodplains: " zvíře se marně snaží prodírat proudem."
 travel_danger_events.1020.jungle: " písek se sype po bocích zvířete, které pomalu, ale jistě klesá do propadliště."
 travel_danger_events.1020.taiga: " zvíře se marně snaží vyškrábat z propadliny."
 travel_danger_events.1020.a: "„Bojuj, [ROOT.Char.Custom('WarhorseStoryName')]!“"
 travel_danger_events.1020.a.success: "[ROOT.Char.Custom('WarhorseStoryName')] přežije"
 travel_danger_events.1020.a.failure: "[ROOT.Char.Custom('WarhorseStoryName')] zmizí v hlubině"
 travel_danger_events.1020.b: "„Nestůjte tam jen tak, #EMP něco dělejte!#!“"
 travel_danger_events.1020.b.success: "[horse_helper.GetFirstNameNoTooltip] zasáhne včas a [ROOT.Char.Custom('WarhorseStoryName')] přežije"
 travel_danger_events.1020.b.failure: "Do hlubin zmizí [horse_helper.GetFirstNameNoTooltip] i [ROOT.Char.Custom('WarhorseStoryName')]"
 travel_danger_events.1020.c: "Nic se nedá dělat..."
