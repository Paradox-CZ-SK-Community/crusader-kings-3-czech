l_polish:
 travel_danger_events.9000.t: "$travel_danger_prefix$ Bzučící pohroma"
 travel_danger_events.9000.desc: "V kraji zvaném [location.GetName] se [location.Custom('GetTerrainTypePlural')] #EMP hemží#! drobným tmavým hmyzem sajícím krev. Ať děláme cokoli nebo zamíříme kamkoli, je všude — vysává z nás krev jako trýznivé mračno, které na nás sesílá [ROOT.Char.GetFaith.DevilName] osobně!\n\nNejen koně začínají být neklidní a podráždění, ale i můj doprovod... obzvlášť [Select_CString(mosquito_victim.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('mosquito_victim'))] [mosquito_victim.GetFirstName], zuřivě mávající pažemi potřísněnými krví."
 travel_danger_events.9000.deviant: "#EMP Rozkošné!#! Všichni, svlékněte se!"
 travel_danger_events.9000.herbalist: "Myslím, že by nám tato bylina mohla pomoci..."
 travel_danger_events.9000.a: "Vpřed, je to jen #EMP hmyz!#!"
 travel_danger_events.9000.b: "[mosquito_victim.GetFirstNameNoTooltip]! Svlékni se, půjdeš první."
 drained_by_mosquitoes_modifier: "Vysátý komáry"
 drained_by_mosquitoes_modifier_desc: "Tuto postavu napadl roj hmyzu sajícího krev a vysál z ní nezanedbatelné množství životní mízy."
 travel_danger_events.9010.t: "$travel_danger_prefix$ Klacky pod koly"
 travel_danger_events.9010.desc: "„[location.Custom('GetRandomRegionalDanger')|U]!“ slyším [irritated_character.GetFirstName] vykřiknout v panice. Vzápětí se ozve hlasité prasknutí — jako když se láme dřevo... nebo když konečně praskne má trpělivost.\n\nVystoupím z vozu. Pod nohama [location.Custom('GetProvinceGroundDesc')], přede mnou roztříštěné zbytky kola... #EMP mého#! kola!\n\n„Omlouvám se, [irritated_character.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))]. Byla řada na mně držet hlídku, ale u opratí mě přemohl spánek...“"
 travel_danger_events.9010.strong: "#EMP *Hlasitě si povzdechnu a nadzvednu vůz ze země*#!"
 travel_danger_events.9010.a: "[root_scope.Custom('CulturalCurse')|U]... dorazíme pozdě."
 travel_danger_events.9010.b: "Přeskládejte zásoby. Odteď se obejdu bez pohodlí..."
 travel_danger_events.9020.t: "$travel_danger_prefix$ Hrozící vyhublost"
 travel_danger_events.9020.desc.first: "„My... my už nemáme #EMP vůbec nic#!!“ nervózně koktá [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emaciated_character'))] [emaciated_character.GetFirstName]. „[ROOT.Char.Custom('GetExpensiveDessert')], [ROOT.Char.Custom('GetExpensiveMeal')], [ROOT.Char.Custom('GetExpensiveMealAlt')], [ROOT.Char.Custom('GetLocalStreetFoodPlural')], a dokonce #EMP [ROOT.Char.Custom('get_region_root_vegetable_plural')]!#!“\n\n"
 travel_danger_events.9020.desc.war: "„Ti rabující vojáci nám v noci odnesli všechno! Nezbyl ani #EMP jediný drobek!#!“ ozve se zoufalý výkřik. „Umřeme hlady!“"
 travel_danger_events.9020.desc.other: "„Měli jsme vzít víc jídla — nezbyl ani #EMP jediný drobek#! a kam oko dohlédne, není nic k snědku!“ ozve se zoufalý výkřik. „Umřeme hlady!“"
 travel_danger_events.9020.desc.last: "\n\nMožná ta včerejší trojitá porce nebyla nejlepší nápad — [ROOT.Char.Custom('GetExpensiveMeal')], k tomu omáčka; přísada: [ROOT.Char.Custom('GetFoodDetail')]?"
 travel_danger_events.9020.desc.last.alt: "\n\nAle... vždyť jím jako plch! Jak je tohle spravedlivé?"
 travel_danger_events.9020.a: "Kéž by se ta slova dala sníst..."
 travel_danger_events.9020.b: "To málo, co máme, připadne #EMP mně!#!"
 travel_danger_events.9020.hunter: "Někde tu přece musí být nějaká kořist!"
 travel_danger_events.9020.cannibal: "Ó [emaciated_character.GetFirstNameNoTooltip], [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]... stojí ti za život?"
 emaciated_modifier: "Vyhublost"
 emaciated_modifier_desc: "Tato postava urazila dlouhou cestu zcela bez jídla."
 cannibalicus_maximus: "Ty i všichni členové doprovodu získáte [Concept('secret','tajemství')|E] „Kanibal“, pokud jej už nemáte"
 travel_danger_events.9030.t: "$travel_danger_prefix$ Uvízlí v bahně"
 travel_danger_events.9030.desc: "Dnes neprší silně, ale vytrvale — cesta před námi se mění v husté bahno. Vozy zapadají a mlha omezuje výhled.\n\nNějakou dobu se odtud nehneme."
 travel_danger_events.9030.caravan_master: "[GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()] si s trochou bláta poradí."
 travel_danger_events.9030.a: "Prokleté počasí."
 EVENT_WINDOW_OPTION_AVAILABLE_CARAVAN_MASTER: "Tuto možnost zpřístupňuje [GetCourtPositionType('travel_leader_court_position').GetName()]"
 travel_danger_events.9040.t: "$travel_danger_prefix$ Průtrž mračen"
 travel_danger_events.9040.desc: "Nevidím ani na krok — déšť je příliš prudký. Jsme promočení až na kost a každý úder hromu splaší koně.\n\nPak si uvědomím něco strašného...\n\nKde je [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] [victim.GetFirstName]?"
 travel_danger_events.9040.caravan_master: "[travel_leader.GetFirstNameNoTooltip], najdi [victim.GetFirstNameNoTooltip]!"
 travel_danger_events.9040.a: "Kéž [ROOT.Char.GetFaith.HighGodName] projeví milost! [victim.GetFirstNameNoTooltip] ji bude potřebovat."
 low_aptitude_caravan_master_reason_tooltip: "[travel_leader.GetFirstName|U] ([GetCourtPositionType('travel_leader_court_position').GetName()]): [Concept('aptitude','způsobilost')|E] pouze [travel_leader.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_danger_events.9050.t: "$travel_danger_prefix$ Bloudící mysl"
 travel_danger_events.9050.desc: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] [victim.GetFirstName] mě na cestě doprovází, ale každým dnem je to náročnější — stav zvaný [GetTrait('withering_mind').GetName( GetNullCharacter )] se stále zhoršuje.\n\nPořád musím opakovat totéž: #EMP „Náš cíl je [ROOT.Char.GetTravelPlan.GetData.GetFinalDestination.GetProvince.GetName]! [ROOT.Char.GetTravelPlan.GetData.GetActivity.GetShortName], vzpomínáš?“#! Ale v hlavě to nikdy dlouho nezůstane.\n\nA teď se [Select_CString(victim.IsFemale,'ta stará bláznivka zatoulala','ten starý blázen zatoulal')] a není k nalezení..."
 travel_danger_events.9050.caravan_master: "[Select_CString(travel_leader.IsFemale,'Má vůdkyně karavany','Můj vůdce karavany')] [travel_leader.GetFirstNameNoTooltip] může vést pátrání."
 travel_danger_events.9050.a: "[victim.GetFirstNameNoTooltip] je pryč. Musíme pokračovat."
 travel_danger_events.9050.b: "Stát! Budeme hledat, dokud se [victim.GetFirstNameNoTooltip] nevrátí."
 death_lost: "[Select_CString(CHARACTER.IsFemale,'zatoulala se a už ji nikdo nikdy neviděl','zatoulal se a už ho nikdo nikdy neviděl')]"
 9050_lost: "[victim.GetFirstName] už se nikdy nevrátí"
 9050_found: "[victim.GetFirstName] se podaří najít; [Select_CString(victim.IsFemale,'je však otřesená','je však otřesený')]"
 travel_danger_events.9060.t: "$travel_danger_prefix$ [Select_CString(victim.IsFemale,'Křehká cestující','Křehký cestující')]"
 travel_danger_events.9060.desc: "„Au, au! Prosím, zastavte kočár — prosím vás!“ volá na kočího [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim'))] [victim.GetFirstName]. „Můj stav — [elder_trait.GetName(GetNullCharacter)] — už ty hrboly, kameny a otřesy nevydrží!“\n\n[location.GetName] má hrbolaté cesty, které dávají křehkému tělu pořádně zabrat.\n\nMožná bychom měli trochu zpomalit. Jen trochu."
 travel_danger_events.9060.sadistic: "#EMP ...musíme zrychlit.#!"
 travel_danger_events.9060.a: "Nezastavíme."
 travel_danger_events.9060.b: "[victim.GetFirstNameNoTooltip] potřebuje pohodlnější jízdu."
 traveling_slowly_modifier: "Úmorně pomalá cesta"
 traveling_slowly_modifier_desc: "Tento doprovod cestuje velmi pomalu a představuje tak snadný cíl pro lapky."
 9060_wounded: "[victim.GetFirstName] utrpí zranění"
