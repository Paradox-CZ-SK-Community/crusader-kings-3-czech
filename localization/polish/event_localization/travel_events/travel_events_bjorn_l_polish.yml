 travel_events.5100.t: "Most [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')|U] Bridge" # todo: NEW TRANSLATION
 travel_events.5100.desc: "„Pane! Tento most má špatnou pověst. Pod ním žije [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')]!“ Můj [ROOT.Char.Custom2('RelationToMe', superstitious_traveler)] [superstitious_traveler.GetTitledFirstName] vykřikuje. „Určitě na nás zaútočí nebo nás z dálky prokleje, až půjdeme kolem.“\n\nČlenové mé družiny začínají mezi sebou šeptat. Někteří vzývají jméno [ROOT.Char.GetFaith.HighGodName] pro ochranu. Bohužel je tento most jediné bezpečné místo k přechodu na míle daleko." # todo: NEW TRANSLATION
 travel_events.5100.a: ""Nebojím se žádného [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')] ani démona!"" # todo: NEW TRANSLATION
 travel_events.5100.b: ""Takové věci neexistují, [superstitious_traveler.GetTitledFirstNameNoTooltip]."" # todo: NEW TRANSLATION
 travel_events.5100.c: ""Musíme se pomodlit, abychom tohoto ducha odehnali."" # todo: NEW TRANSLATION
 travel_events.5100.d: ""Děsivé! Najděme jinou cestu."" # todo: NEW TRANSLATION
