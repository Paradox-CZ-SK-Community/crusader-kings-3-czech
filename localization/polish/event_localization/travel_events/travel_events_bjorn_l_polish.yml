l_polish:
 travel_events.5100.t: "Most [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')|U]"
 travel_events.5100.desc: "„[Select_CString(ROOT.Char.IsFemale,'Má paní!','Můj pane!')] Tenhle most má neblahou pověst. Pod ním žije [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')]!“ vykřikne [superstitious_traveler.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', superstitious_traveler)]. „Určitě se na nás vrhne, nebo nás při přechodu prokleje zpovzdálí.“\n\nČlenové mé družiny si mezi sebou začnou šeptat. Někteří prosí o ochranu a doufají, že je [ROOT.Char.GetFaith.HighGodName] vyslyší. Naneštěstí je tento most široko daleko jediným bezpečným místem k překročení."
 travel_events.5100.a: "„Nezastraší mě ani [ROOT.Char.GetCurrentLocation.Custom('GetProvinceTricksterSpirit')], ani žádný jiný démon!“"
 travel_events.5100.b: "„Nic takového neexistuje, [superstitious_traveler.GetTitledFirstNameNoTooltip].“"
 travel_events.5100.c: "„Musíme se modlit a zahnat toho ducha.“"
 travel_events.5100.d: "„To je děsivé! Najděme jinou cestu.“"
