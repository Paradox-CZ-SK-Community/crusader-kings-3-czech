l_polish:
 travel_city_companion_impressed: "\n\n[ROOT.Char.Custom2('RelationToMe', sightseeing_companion)] ke mně při pohledu na tuto přehlídku učenosti tiše poznamená: „Dokázal bych tu strávit celý život, [ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U].“\n"
 travel_city_companion_idea: "\n\n[sightseeing_companion.GetFirstName], [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)], se zamyšleně ozve: „[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U], mohli bychom tu nějaký čas zůstat a poznat jejich zvyky.“"
 travel_city_option_study_locals: "Zjistěme, co se tu dá naučit."
 travel_city_option_souvenir: "Najdu tu něco, co si odvezu domů."
 travel_city_option_reflection_on_existance: "Stojí za to zamyslet se nad křehkostí života."
 travel_city_option_reflection_on_existance_tooltip: "Strávím nějaký čas rozjímáním nad křehkostí života"
 travel_city_contemplated_life_and_death: "Rozjímám o životě a smrti"
 travel_city_contemplated_religion_tooltip: "Strávím nějaký čas rozjímáním nad podstatou Krista"
 travel_city_religious_mystic: "Navazuji hlubší spojení s mystickou stránkou své víry"
 travel_city_contemplated_life_and_death_companion: "Se [sightseeing_companion.GetName] rozmlouváme o životě a smrti"
 travel_city_option_learn_local_history: "Musím se dozvědět víc o městě, které tu kdysi stálo."
 travel_city_duel_history_fail: "[sightseeing_companion.GetName] mě nedokáže poučit o historii [city_province.GetNameNoTooltip]"
 travel_city_duel_teaching_fail_no_companion: "V [city_province.GetNameNoTooltip] se mi nepodaří dozvědět nic hodnotného"
 travel_city_option_learning: "Skvělá příležitost k učené rozpravě."
 travel_city_duel_teaching_great_success: "Pobyt v [city_province.GetNameNoTooltip] mi přinese mnoho cenných poznatků"
 travel_city_duel_teaching_success: "V [city_province.GetNameNoTooltip] se dozvím něco nového"
 travel_city_duel_teaching_fail: "Zanechám ucházející dojem"
 travel_city_duel_teaching_great_fail: "Při styku s místními v [city_province.GetNameNoTooltip] se naprosto znemožním"
 travel_city_duel_learning_fail: "Z historie se mi nepodaří nic naučit"
 duel_companion_tooltip: "[sightseeing_companion.GetName] zvyšuje šanci na příznivý výsledek této možnosti"
 travel_city_option_study_fortifications: "Prozkoumejme tyto pozoruhodné stavby."
 travel_city_option_party_hard: "Užiji si všeho, co toto místo nabízí!"
 travel_city_option_earn_money: "Tohle je příležitost #EMP vydělat#! peníze!"
 travel_city_new_dessert: "[ROOT.Char.Custom('FavoriteTreat')] z [city_province.GetNameNoTooltip] na mě udělalo velký dojem"
 travel_city_new_techniques: "Z [city_province.GetNameNoTooltip] si odvezu nové postupy a módu"
 travel_city_well_rested: "V [city_province.GetNameNoTooltip] jsem si dobře odpočinul"
 travel_city_resupplied: "V [city_province.GetNameNoTooltip] se mi podařilo vydělat peníze a doplnit zásoby"
 travel_city_option_opt_out: "Nebudu na tomto místě ztrácet čas."
 travel_city_major_windfall: "Ve čtvrti lichvářů v [city_province.GetNameNoTooltip] jsem toho mnoho nevydělal, zato se hodně naučil"
 travel_city_gained_money: "Ve čtvrti lichvářů v Konstantinopoli jsem našel finančníky"
 travel_city_option_opt_out_tooltip: "V [city_province.GetNameNoTooltip] strávím jen tolik času, kolik je nezbytné k přípravě na další cestu"
 souvenir_bought_companion: "[sightseeing_companion.GetName] mi pomohl získat [souvenir.GetName]"
 book_souvenir_companion_tooltip: "Díky [sightseeing_companion.GetName] mám větší šanci najít lepší knihu"
 book_souvenir_tooltip: "Na knižním trhu bude získán knižní artefakt"
 book_souvenir_bought: "[souvenir.GetName] byl zakoupen na knižních trzích v [city_province.GetNameNoTooltip]"
 book_artifact_loc: "[souvenir.GetDesc]\n\nNa poslední stránce někdo načmáral poznámku, že knihu koupil na knižních trzích v [city_province.GetName]."
 regalia_artifact_loc: "[souvenir.GetDesc]\n\nRegálie jsou zabalené v kusu látky, na který někdo načmáral poznámku, že je koupil od jednoho z řemeslníků v [city_province.GetName]."
 crown_artifact_loc: "[souvenir.GetDesc]\n\nNa vnitřní straně koruny je drobná značka dílny v [city_province.GetName], kde byla vyrobena."
 souvenir_companion_tooltip: "Díky [sightseeing_companion.GetName] mám větší šanci najít lepší artefakt"
 souvenir_tooltip: "Na trzích v [city_province.GetNameNoTooltip] bude získán artefakt"
 souvenir_bought: "[souvenir.GetName] byl zakoupen v [city_province.GetNameNoTooltip]"
 travel_city_baghdad_intro: "Když procházím branami [city_province.GetNameNoTooltip], nelze se ubránit myšlence, že jsem dorazil do tradičního centra arabsky mluvícího a islámského světa.\n\n"
 travel_city_baghdad_suq_al_warraqin_title: "[city_province.GetNameNoTooltip]: Súk al-Warrákín"
 travel_city_baghdad_royal_enclosure_title: "[city_province.GetNameNoTooltip]: Královská čtvrť"
 travel_city_baghdad_cemeteries_title: "[city_province.GetNameNoTooltip] minulých časů"
 travel_city_baghdad_suq_al_warraqin: "Jak se blížím k vnitřnímu městu, vzduch se plní učenými rozpravami o literatuře. Celou ulici, dokonce i její mosty, lemují stovky rušných knihkupectví a literárních salonů."
 travel_city_baghdad_royal_enclosure: "Na okraji vnitřního města se ocitám obklopen menšími paláci, kuchyněmi a pekárnami. Nad tím vším se neustále tyčí zelená kopule Paláce Zlaté brány."
 travel_city_baghdad_cemeteries: "Při cestě městem si všímám mnoha ruin a starých památek. Nakonec dorazím ke hřbitovům, mezi hrobky chalífů a právních učenců z dávno minulých časů."
 travel_city_baghdad_companion_reflection: "\n\n[sightseeing_companion.GetName], [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)], poznamenává, že tito muži znali úplně jiný Bagdád, dnes už téměř k nepoznání."
 travel_city_rome_intro: "Z dálky působí [city_province.GetNameNoTooltip] jako les věží a bludiště kamenných staveb. Jak se blížíme, krajina se proměňuje: ruiny památek, hradby a starobylé kostely tu stojí vedle polí a pasoucích se zvířat.\n\n"
 travel_city_rome_fortified_monuments_title: "[city_province.GetNameNoTooltip]: Opevněné památky"
 travel_city_rome_fortified_monuments: "Při cestě městem si všímám, jak si znesvářené rody pečlivě opevnily zdejší ruiny. Hadriánovo mauzoleum, a dokonce i Koloseum, tak dnes slouží jako pevnosti."
 travel_city_rome_caesars_needle_title: "[city_province.GetNameNoTooltip]: Caesarova jehla"
 travel_city_rome_caesars_needle: "Když se zastavíme před mohutným obeliskem, jeden z místních nám vypráví, že na jeho vrcholu spočívá v malé kulaté schránce popel Julia Caesara.\n\n#EMP „Ve smrti stejně jako za života ční Caesar nad všemi Římany.“#!"
 travel_city_rome_companion_reflection: "\n[sightseeing_companion.GetName], [ROOT.Char.Custom2('RelationToMe', sightseeing_companion)], dodává, že bychom této příležitosti měli využít a dozvědět se o městě něco víc."
 travel_city_rome_alone_reflection: "\nNemohu se ubránit úvahám nad nesmírným stářím tohoto města."
 travel_city_rome_pilgrims_and_shrines_title: "[city_province.GetNameNoTooltip]: Svatyně a poutníci"
 travel_city_rome_pilgrims_and_shrines: "Poutníci jsou snad všude. Smlouvají, rozmlouvají a stojí ve frontách ke svatyním a hrobkám městských světců. Sídla dávno zapomenutých aristokratů dnes slouží jako noclehárny pro věřící."
 travel_city_constantinople_augustaion_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Střed světa"
 travel_city_constantinople_aqueducts_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Akvadukty a cisterny"
 travel_city_constantinople_goldsmiths_moneychangers_title: "[city_province.GetBaronyNameExplicitlyNoTooltip]: Zlatníci a směnárníci"
 PROSPHORION_GLOSS: "Severní obchodní přístav města [GetTitleByKey('b_constantinople').GetNameNoTier]. Ve městě se nacházela také řada dalších vojenských, obchodních a císařských přístavů."
 travel_city_constantinople_intro: "[city_province.GetBaronyNameExplicitlyNoTooltip] nešlo na obzoru přehlédnout. Jeho mohutné hradby se tyčí vysoko nad krajinou a když postupujeme po [Glossary( 'Mese', 'MESE_GLOSS')], stejně ohromující jsou i davy lidí.\n\n"
 travel_city_constantinople_intro_chalcedon: "Konstantinopolští jsou na cizokrajné návštěvníky zvyklí, a tak si nás v přístavu [Glossary( 'Prosforion', 'PROSPHORION_GLOSS')] sotva všimnou. #EMP My#! jsme však mohutné mořské hradby [city_province.GetBaronyNameExplicitlyNoTooltip] obdivovali už z nábřeží v [last_visited_location.GetBaronyNameExplicitlyNoTooltip]. \n\n"
 travel_city_constantinople_intro_sea: "Když přistáváme v přístavu [Glossary( 'Prosforion', 'PROSPHORION_GLOSS')], žasneme nad rozlohou [city_province.GetBaronyNameExplicitlyNoTooltip]. Jeho věže, kopule a mořské hradby jsme spatřili už z velké dálky.\n\n"
 travel_city_constantinople_augustaion: "Kolem poledne si v horku odpočineme u podivuhodné stavby na úchvatném náměstí [Glossary( 'Augustaion', 'AUGUSTAION_GLOSS')]. Uvnitř stojí zlatý milník, o němž místní tvrdí, že označuje střed světa."
 travel_city_center_of_the_world_reflection: "\n\nObklopen těmito monumentálními stavbami nemám mnoho důvodů jejich tvrzení nevěřit. Má vlastní existence mi náhle připadá méně významná."
 travel_city_companion_center_of_the_world_reflection: "\n\n„[ROOT.Char.Custom2('RelationToMeAddress', sightseeing_companion)|U], toto místo se nepodobá žádnému, které jsi dosud navštívil. Stojíme před více než tisíciletím dějin.“"
 AUGUSTAION_GLOSS: "Augustaion je náměstí ležící bezprostředně před bránou Chalké do císařského palácového areálu Konstantinopole. Na vzdáleném konci náměstí stojí [Glossary( 'Milion', 'MILION_GLOSS')], před ním se rozkládá Hippodrom a po stranách se nacházejí monumentální Zeuxippovy lázně a katedrála Hagia Sofia."
 travel_city_constantinople_aqueduct_valens: "Vedeni zvědavostí sledujeme [Glossary( 'mohutný akvadukt', 'AQUEDUCT_OF_VALENS_GLOSS')] až ke vstupu do podzemní cisterny. Strážný nám vysvětluje, že už po celé generace zásobuje město vodou, a za drobný peníz nám nabízí prohlídku jejího ohromného nitra.\n"
 travel_city_option_study_aqueducts: "Musíme tyto hlubiny zmapovat a zdokumentovat."
 travel_city_constantinople_goldsmiths_moneychangers: "Nakonec se zastavíme ve čtvrti zlatníků. Tady leží finanční srdce města, kde se peníze směňují, půjčují a ukládají. Zlaté [ROOT.Char.GetCurrentLocation.Custom('GetByzantineCoinWithGloss')] s podobiznami dávno zapomenutých císařů tu přecházejí z ruky do ruky spolu s měděnými a elektrovými mincemi."
 BYZANTINE_COINAGE_GLOSS: "Měděné a zlaté mince tvořily hlavní oběživo Byzantské říše. Nejcennějšími mincemi byly zlatý solidus a později hyperpyron, které byly velmi žádané i na západě, kde se jim říkalo #EMP bezanty#!."
 AQUEDUCT_OF_VALENS_GLOSS: "#EMP Valensův akvadukt#! byl vybudován ve 4. století a zásoboval Konstantinopol čerstvou vodou po více než tisíc let. Síť otevřených nádrží a obrovských podzemních cisteren umožňovala městu uchovávat přes milion metrů krychlových vody."
 SOLIDUS: "[Glossary( 'solidi', 'BYZANTINE_COINAGE_GLOSS')]"
 HYPERPYRON: "[Glossary( 'hyperpyra', 'BYZANTINE_COINAGE_GLOSS')]"
 FALLBACK_COIN: "mince"
 travel_city_well_supplied: "Dobře zásoben"
 travel_city_well_supplied_desc: "Tato postava si nedávno doplnila všechny nezbytné zásoby potřebné k cestování."
