l_polish:
 travel_events.1200.t: "Přátelští místní"
 travel_events.1200.desc: "Když se utáboříme u malé vesnice v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], přicházejí si místní prohlédnout naši karavanu.\n\nNejprve si myslím, že s námi chtějí obchodovat, ale brzy je jasné, že nám přišli přinést dary a dozvědět se co nejvíce o naší kultuře!\n\nZvláště [local_peasant.GetNameNoTooltip] má snad milion otázek o tom, odkud pocházíme."
 travel_events.1200.a: "Měli bychom si promluvit a dozvědět se víc."
 travel_events.1200.b: "Využijeme každou výhodu, kterou můžeme."
 tradition_travel_discount_desc: "Tuto kulturní tradici znáš ze svých cest."
 travel_events.1200.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_xenophilic').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1201.t: "Rytířství stále žije"
 travel_events.1201.desc: "Při cestě přes [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] narazíme na několik [ROOT.Char.GetCurrentLocation.GetCulture.GetName] [GetPlayer.Custom('KnightCulturePlural')]. Chovají se nanejvýš uctivě a očividně jsou velkými milovníky poezie, protože ji přednášejí při každé možné příležitosti.\n\nPravidla, jimiž se řídí, mají mnohé přednosti a nemohu si pomoci, musím je obdivovat. Zvlášť působivě na mě zapůsobí [local_knight.GetNameNoTooltip], jeden z [GetPlayer.Custom('KnightCulturePlural')]. "
 travel_events.1201.a: "Takovou tradici bych rád přinesl domů."
 travel_events.1201.b: "Zkusím se sám chovat rytířštěji."
 travel_events.1201.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_chivalry').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1202.t: "Pilní pracanti"
 travel_events.1202.desc: "Při cestě přes [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] si nemohu nevšimnout, že každý, koho potkám, pracuje s tichým zápalem, jaký ve své vlastní zemi vídám jen málokdy.\n\nJednoho z dělníků zastavím a zeptám se, čím to je. [random_peasant.GetFirstNameNoTooltip] se se mnou podělí o stručnou životní moudrost:\n\n„Víte, ono stačí pořádně zabrat a nepřestat, dokud není práce hotová.“"
 travel_events.1202.a: "Měli bychom si promluvit a dozvědět se víc."
 travel_events.1202.b: "Některé z těch zásad by se mohly hodit i doma."
 travel_events.1202.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_hard_working').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1203.t: "Pevná pouta"
 travel_events.1203.desc: "Při průjezdu vesnicemi v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] strávím nějaký čas rozhovory s místními. Jedna věc je obzvlášť nápadná: jejich bezmezná oddanost lennímu pánovi.\n\nJeden z vesničanů o svém vládci mluví s takovým zápalem, že bych skoro řekl, že popisuje milovanou osobu."
 travel_events.1203.a: "Měli bychom si promluvit a dozvědět se víc."
 travel_events.1203.b: "I moji poddaní budou stejně oddaní."
 travel_events.1203.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_loyal_soldiers').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1204.t: "Pokojná rozepře"
 travel_events.1204.desc: "Při cestě přes [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] mám příležitost sledovat několik místních, kteří se přou o to, komu patří jeden kus dobytka. Ačkoli je předmět sporu očividně závažný, obě strany zůstávají klidné a rozvážné a nikdo se neuchyluje k násilí.\n\nJen si představit, čeho všeho bychom mohli dosáhnout, kdyby i doma vládl takový klid a rozum."
 travel_events.1204.a: "Měli bychom si promluvit a dozvědět se víc."
 travel_events.1204.b: "Zkusím ten jejich pacifismus."
 travel_events.1204.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_pacifism').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1205.t: "Prostý život"
 travel_events.1205.desc: "Když cestuji přes [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], nemohu si nevšimnout, jak prosté jsou oděvy, obydlí, a dokonce i výrazy ve tvářích místních z [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury.\n\nKdyž se však zeptám na chudobu tohoto kraje, dozvím se, že je to jejich vlastní volba. Dávají zkrátka přednost praktičnosti před okázalostí."
 travel_events.1205.a: "Z toho bychom se doma mohli poučit."
 travel_events.1205.b: "Zkusím žít skromně."
 travel_events.1205.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_spartan').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1206.t: "Radost z lovu"
 travel_events.1206.desc: "Když cestuji přes [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], narazím na skupinu lovců. Nechají mě nějakou dobu doprovázet jejich výpravu, ukazují mi zvláštnosti svých loveckých postupů a stopy, které jsou typické právě pro tento kraj."
 travel_events.1206.a: "Proč nemohou být moji lidé jako oni?"
 travel_events.1206.b: "Možná by mě mohli něco naučit?"
 travel_events.1206.c: "Tady lovím já!"
 travel_events.1206.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_hunters').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1207.t: "Plody země"
 travel_events.1207.desc: "Při cestě přes [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] nás zastaví stařešina jedné vesnice a naléhá, abychom se připojili k hostině. Při jídle si uvědomím, že v něm není ani sousto masa. Stařešina mi ochotně podrobně vysvětlí, jak se pokrmy připravují, jaké suroviny používají a že maso vlastně téměř vůbec nejedí."
 travel_events.1207.a: "Chci nějaké recepty!"
 travel_events.1207.b: "Možná si ještě přidám?"
 travel_events.1207.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_vegetarianism').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1208.t: "Mořeplavectví"
 travel_events.1208.desc: "Při plavbě přes [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] spustíme kotvu, abychom si promluvili s místními na jedné lodi. Z původně krátké zastávky se nakonec vyvine dlouhá debata o uzlech, zdejších proudech a mořeplavectví vůbec.\n\n„Víte, albatros je králem všech ptáků. A zabít ho? To je největší zločin ze všech.“"
 travel_events.1208.a: "Měli bychom si s nimi promluvit a dozvědět se víc."
 travel_events.1208.b: "Dost bylo poslouchání, je čas ty znalosti využít."
 travel_events.1208.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_seafaring').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1209.t: "Záleží na tom, jak se příběh vypráví"
 travel_events.1209.desc: "Vypravěči z [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], pocházející z [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury, jsou široko daleko proslulí, a když se s nimi konečně setkám, rozhodně nezklamou!\n\nMnoho hodin sedíme kolem ohně a nasloucháme jejich příběhům. Je skutečným potěšením slyšet je vyprávět."
 travel_events.1209.a: "Doma bych měl vyprávění příběhů více podporovat."
 travel_events.1209.b: "Když máte rádi příběhy, tenhle si zamilujete."
 travel_events.1209.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_storytellers').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1210.t: "[ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip|U] hudba"
 travel_events.1210.desc: "Když cestuji přes [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], zaslechnu melodii, která se tiše nese krajinou.\n\nKrátká odbočka z cesty mě zavede ke skupině hudebníků, kteří hrají srdcem i duší něco, co musí být místní [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] hudba. Zastavím se, abych naslouchal krásné melodii, a srdce mi zaplaví radost."
 travel_events.1210.a: "Tuto tradici bychom si měli odnést domů."
 travel_events.1210.b: "Chci se naučit hrát!"
 travel_events.1210.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_music_theory').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1211.t: "Lid poezie"
 travel_events.1211.desc: "„[ROOT.Char.Custom('FormOfAddressForLiege')|U], [ROOT.Char.Custom('FormOfAddressForLiege')], prosím, věnujte mi jen chvilku a vyslechněte mou nejnovější báseň!“\n\nNení to první člověk z [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury, který se mě pokouší seznámit se svou poezií, a vzhledem k cestě přede mnou určitě ani poslední. Poezie tu musí být skutečnou vášní, když snad každý druhý snílek nosí v srdci nějaké verše. "
 travel_events.1211.a: "Měli bychom si s nimi promluvit a dozvědět se víc."
 travel_events.1211.b: "Také bych to chtěl zkusit."
 travel_events.1211.c: "Tomuhle říkáš poezie?"
 travel_events.1211.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_poetry').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1212.t: "Přátelé rybáři"
 travel_events.1212.desc: "V [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] neuplyne jediný den, abych nenarazil na rybáře s nějakou novou radou, ať už jde o vhodnou návnadu, nejlepší místo k lovu, nebo dokonce způsob přípravy ulovených ryb.\n\nDostanu dokonce příležitost si sám zarybařit a rybáři mi ukazují nejrůznější fígle. Když konečně jednu rybu chytím, všichni mi zatleskají."
 travel_events.1212.a: "Měli bychom si s nimi promluvit a dozvědět se víc."
 travel_events.1212.b: "Co kdybychom tyhle rybářské postupy využili při plavbě po moři!"
 travel_events.1212.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_fishermen').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1213.t: "Tajemní poutníci"
 travel_events.1213.desc: "V [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] jsou mystikové snad všude. Putují krajem, kážou a dělí se o své vědomosti.\n\nJednoho dne, zatímco čekáme, až bude z cesty odvalen balvan, se s jedním z nich pustím do poměrně hlubokého rozhovoru o smyslu života."
 travel_events.1213.a: "Více mě zajímá váš lid."
 travel_events.1213.b: "O jakou moudrost se se mnou můžeš podělit?"
 travel_events.1213.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_mendicant_mystics').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1214.t: "Vážení válečníci"
 travel_events.1214.desc: "Během svých cest si uvědomuji, že místní z [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] si nade vše cení válečníků.\n\nSpory se tu řeší násilím a za nejstatečnější jsou považováni ti, kdo nasazují život za své panství. Velkou část jednoho odpoledne s místními probírám nejrůznější podrobnosti jejich válečnické kultury."
 travel_events.1214.a: "Měli bychom si s nimi promluvit a dozvědět se víc."
 travel_events.1214.b: "Můžete mi ukázat pár chvatů?"
 travel_events.1214.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_warrior_culture').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1215.t: "Obdiv budící [GetPlayer.Custom('KnightCultureNoTooltip')]"
 travel_events.1215.desc: "Jedné noci se zastavíme na odpočinek v krčmě. Sedím pokojně v koutě a užívám si [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] hudbu, když se dveře náhle rozletí a v nich se objeví mohutná silueta.\n\nDovnitř sebevědomě nakráčí [GetPlayer.Custom('KnightCultureNoTooltipLowercase')] a nálada v místnosti se okamžitě změní. Lidé uctivě sklánějí hlavy, někteří málem omdlévají a hostinský začne bez váhání nalévat nápoje zdarma, jako by šlo o nějakou místní celebritu.\n\nJe snad být zde [GetPlayer.Custom('KnightCultureNoTooltipLowercase')] opravdu něčím tak výjimečným? "
 travel_events.1215.a: "Měl bych zjistit, proč si jich tolik váží."
 travel_events.1215.b: "Když budu trénovat, můžu být stejný!"
 travel_events.1215.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_martial_admiration').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 travel_events.1216.t: "Putující myslitelé"
 travel_events.1216.desc: "Při průjezdu přes [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] si všimnu jedné zvláštnosti: snad každý druhý pocestný z [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury o sobě tvrdí, že je filozof.\n\nZpočátku jsem k tomu skeptický, ale poté, co mě už potřetí za sebou někdo v rozhovoru dokonale přechytračí, začínám si říkat, že na jejich tvrzení možná něco bude.\n\nPoslední filozof, [local_philosopher.GetNameNoTooltip], se mým nejnovějším pokusům o logickou argumentaci už téměř směje."
 travel_events.1216.a: "Měl bych zjistit víc o tom, jak jejich kultura funguje."
 travel_events.1216.b: "Co se z toho mohu naučit já sám?"
 travel_events.1216.a.tt: "Snižuje náklady na zavedení tradice [GetCultureTradition('tradition_philosopher_culture').GetName] o [prestige_i]#P [EmptyScope.ScriptValue('tradition_travel_discount')|-0] [Concept('prestige','prestiže')|E]"
 healthy_vegetarian_meal_modifier: "Zdravé vegetariánské jídlo"
 healthy_vegetarian_meal_modifier_desc: "Tato postava během cestování snědla zdravé vegetariánské jídlo."
 living_simply_modifier: "Prostý život"
 living_simply_modifier_desc: "Tato postava žije prostě."
 villager_gifts_modifier: "Dary od vesničanů"
 villager_gifts_modifier_desc: "Tato postava dostala od vesničanů několik darů."
 loyal_attitudes_modifier: "Oddaný přístup"
 loyal_attitudes_modifier_desc: "Tato postava podněcuje oddanost u sebe i ostatních."
 pacifist_mindset_modifier: "Pacifistické smýšlení"
 pacifist_mindset_modifier_desc: "Tato postava se snaží osvojit si pacifističtější smýšlení."
 told_good_story_modifier: "Dobrý příběh"
 told_good_story_modifier_desc: "Tato postava nedávno vyprávěla dobrý příběh."
 musically_inspired_modifier: "Hudební inspirace"
 musically_inspired_modifier_desc: "Tato postava se nechala inspirovat hudbou a často cvičí pro své vězně."
 fishing_logistics_modifier: "Rybářská logistika"
 fishing_logistics_modifier_desc: "Tato postava využívá znalosti rybolovu v námořní logistice."
 mystic_wisdom_modifier: "Mystická moudrost"
 mystic_wisdom_modifier_desc: "Tato postava nedávno získala moudrost od mystika."
 trained_in_warrior_culture_modifier: "Výcvik ve válečnické kultuře"
 trained_in_warrior_culture_modifier_desc: "Tato postava nedávno absolvovala výcvik ve válečnické kultuře."
 training_hard_modifier: "Tvrdý trénink"
 training_hard_modifier_desc: "Tato postava právě tvrdě trénuje."
 philosophical_musings_modifier: "Filozofické úvahy"
 philosophical_musings_modifier_desc: "Tato postava se v poslední době často oddává filozofickým úvahám."
 personal_chivalry_modifier: "Osobní rytířskost"
 personal_chivalry_modifier_desc: "Tato postava se v poslední době soustředí na vlastní rytířské chování."
