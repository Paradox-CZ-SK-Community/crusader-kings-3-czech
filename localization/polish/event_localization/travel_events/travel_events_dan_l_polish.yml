l_polish:
 travel_danger_events.2000.t: "$travel_danger_prefix$ Oči džungle"
 travel_danger_events.2000.desc: "Od chvíle, kdy jsme vstoupili do džungle v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], mě něco pozoruje. [Select_CString(ROOT.Char.IsFemale,'Zahlédla','Zahlédl')] jsem záblesk očí, [Select_CString(ROOT.Char.IsFemale,'zaslechla','zaslechl')] šustění listí.\n\nJde za mnou, plíží se za mnou, #EMP loví mě#!.\n\nMuži, které jsem [Select_CString(ROOT.Char.IsFemale,'vyslala','vyslal')], aby to našli, se nevrátili. Co je to za tvora, který číhá ve smaragdových hlubinách džungle?"
 travel_danger_events.2000.a: "Kácejte a palte, #EMP najděte to#!."
 travel_danger_events.2000.b: "Nenávidím to tu. Dostaňte mě odsud."
 travel_danger_events.2000.c: "Jediné, čeho se v téhle džungli mají bát, jsem já!"
 travel_danger_events.2001.t: "$travel_danger_prefix$ Záplava"
 travel_danger_events.2001.desc: "Po celou dobu cesty přes [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] déšť nepolevuje. Nervózně sleduji řeku, jejíž kalná voda stále stoupá a vzdouvá se jako hnisem naplněný puchýř.\n\n[flood_victim.GetFirstNameNoTooltip] ([ROOT.Char.Custom2('RelationToMe', flood_victim)]) si zase stěžuje: „Už celé dny se plahočíme touhle zatracenou, zaplavenou, zabahněnou žumpou. Kdy už...“\n\nNež stačí domluvit, břeh konečně povolí. Příval husté temné vody se valí přímo na naše zásoby a na [flood_victim.GetFirstNameNoTooltip]!"
 travel_danger_events.2001.a: "Zachraňte zásoby!"
 travel_danger_events.2001.b: "Zachraňte [flood_victim.GetFirstNameNoTooltip]!!"
 burned_my_jungle_opinion: "Vypálil mou džungli"
 travel_lost_supplies: "Ztracené zásoby"
 travel_lost_supplies_desc: "Tato postava pociťuje následky ztráty zásob během cesty."
