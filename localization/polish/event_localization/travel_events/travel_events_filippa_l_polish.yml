l_polish:
 travel_events.2000.t: "Co to do kachny?!"
 travel_events.2000.desc: "Dnešní cesta je zatím poměrně klidná a ničím zvláštní. Nacházíme se někde za [ROOT.Char.GetCurrentLocation.GetName] a já zavírám oči, zatímco mě můj oř krok za krokem spolehlivě nese vpřed.\n\nVítr rozeznívá koruny stromů nádhernou melodií, když mi vánek přinese ještě jiný zvuk, který nepochází z našeho doprovodu. Je to... kvákání?\n\n"
 travel_events.2000.desc_meh_memory: "Rozhlížím se po okolí a hledám toho ptáka. Když jsem se minule [Select_CString(ROOT.Char.IsFemale,'vydala','vydal')] za kachnou do divočiny, dopadlo to... rozpačitě."
 travel_events.2000.desc_delicious_memory: "Když jsem se minule [Select_CString(ROOT.Char.IsFemale,'vydala','vydal')] za kachnou do divočiny, čekala mě #EMP znamenitá#! hostina. Třeba mám dnes šťastný den?"
 travel_events.2000.desc_good_memory: "S potěšením vzpomínám na poslední setkání s divokou kachnou. Dovedla mě k hnízdu plnému #EMP tolika#! huňatých kachňátek."
 travel_events.2000.desc_bad_memory: "Na okamžik zaváhám při vzpomínce na poslední výpravu za kachnou do divočiny. Neskončilo to dobře."
 travel_events.2000.desc_default: "Nakonec určím, že zvuk přichází z křoví po mé pravici."
 travel_events.2000.a: "To je dobré znamení."
 travel_events.2000.a_sadist: "Tohle je směšné."
 travel_events.2000.b: "Za tou kachnou!"
 travel_events.2000.b_sadist: "Asi bych za ní [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] jít..."
 travel_events.2000.b.tt: "Chvíli následuješ kachnu"
 travel_events.2000.c: "Fuj, otravný pták! Kšá!"
 travel_events.2000.c.tt: "Hodíš kamínek směrem, odkud se ozývá kvákání."
 travel_events.2001.t_positive: "Tohle je..."
 travel_events.2001.t_negative: "To není kachna!"
 travel_events.2001.t: "Kvák!"
 travel_events.2001.intro: "Sesedám a v nedalekém křoví nacházím kachnu. Začne se kolébat pryč do divočiny a já se vydávám pěšky za ní."
 travel_events.2001.desc_positive: "\n\nJak pokračuji dál, k tichému kvákání se pomalu přidává sbor drobného pípání — zprvu sotva slyšitelného, ale stále silnějšího. Když obejdu další křoví, nevidím jednu kachnu, ale #EMP celé záplavy#! kachen a hnízd plných kachňátek!"
 travel_events.2001.desc_positive_sadist: "\n\nPři pohledu na všechny ty kachny a kachňata mi zakručí v žaludku."
 travel_events.2001.desc_positive_default: "\n\nPři pohledu na všechnu tu hebkou načechranost se mi podlamují kolena."
 travel_events.2001.desc_negative: "\n\nČím dál se vzdalujeme od mého doprovodu, tím silnější mráz mi běhá po zádech. Sleduje mě něco?\n\nNáhle se na okraji podrostu objeví [ROOT.Char.Custom('RegionalFerociousAnimal')]! Výhrůžně odfrkne a zlostně na mě hledí."
 travel_events.2001.desc: "\n\nKachna se náhle zastaví a nakloní ke mně hlavu, očividně zmatená tím, jak se jí podařilo získat lidského následovníka.\n\nUsměji se na ni ve snaze prolomit napětí, jenže kachna se najednou zavrtí, zamává křídly a odletí."
 travel_events.2001.a: "Tohle je... #EMP příliš!#!"
 travel_events.2001.a_tt: "#EMP Rozkošné#!"
 travel_events.2001.a_tt_death: "Tvé ubohé srdce nevydrží tolik roztomilosti"
 travel_events.2001.b: "Z těch by byla dokonalá pečínka..."
 travel_events.2001.b_success.tt: "Dobrá hostina"
 travel_events.2001.b_failure.tt: "Zaskočí ti sousto"
 travel_events.2001.c: "Tohle je #EMP zlé!#!"
 travel_events.2001.c_success.tt: "Úspěch"
 travel_events.2001.c_ran: "Úspěšně utečeš"
 travel_events.2001.c_failure.tt: "Zranění"
 travel_events.2001.c_hit_and_ran: "Schytáš zásah, ale podaří se ti utéct"
 travel_events.2001.c_critical_failure: "Šelma tě zmrzačí"
 travel_events.2001.d: "En garde!"
 travel_events.2001.d_scare_beast: "Zaženeš šelmu"
 travel_events.2001.d_beast_hit: "Šelma zaútočí, ale poté uteče"
 travel_events.2001.e: "Takže celý ten divoký hon byl... #EMP na kachnu#!?"
 travel_events.2002.t: "Vyšlapaná stezka"
 travel_events.2002.desc: "Průvod se zastavil jen co by kamenem dohodil od [ROOT.Char.GetCurrentLocation.GetName]. Ohlédnu se a spatřím [guide_leader.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guide_leader'))], jak stojí vedle koně a soustředěně hledí na cosi na zemi. Ostatní členové doprovodu se shromáždili kolem.\n\nKdyž se přiblížím, [guide_leader.GetFirstNameNoTooltip] ke mně vzhlédne. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], vede tudy mravenčí stezka. Možná jsem trochu [Select_CString(guide_leader.IsFemale,'pověrčivá','pověrčivý')], ale mravenčí stezku by člověk nikdy neměl překračovat.“\n\nNa chvíli se odmlčí. „[Select_CString(great_grand_parent.IsFemale,'Moje prababička','Můj pradědeček')] ji [Select_CString(great_grand_parent.IsFemale,'překročila','překročil')] a už se nikdy [Select_CString(great_grand_parent.IsFemale,'nevrátila','nevrátil')] domů.“"
 travel_events.2002.a: "#EMP Dobrá#!. Najdeme jinou cestu."
 travel_events.2002.b: "To je nesmysl. Budu nás vést [Select_CString(ROOT.Char.IsFemale,'sama','sám')]!"
 travel_events.2002.c: "Na tu tvou pověrčivost znám lék."
 travel_competent_guide_tt: "Jsi [Select_CString(ROOT.Char.IsFemale,'schopná průvodkyně','schopný průvodce')]"
 travel.competent_guide: "$travel_competent_guide_tt$"
 travel_get_lost_tt: "Ztratíš se"
 travel_events.2003.t: "Studium vojenství"
 travel_events.2003.intro: "[local_captain.GetFirstName] spolu s několika místními důstojníky vítá mě i můj doprovod při vstupu do vojenského tábora v [ROOT.Char.GetCurrentLocation.GetName]."
 travel_events.2003.desc_barracks: "Rychle sesednu, [Select_CString(ROOT.Char.IsFemale,'dychtivá','dychtivý')] prohlédnout si místní kasárna, která přímo překypují ruchem."
 travel_events.2003.desc_regiment: "Krátce si prohlížím cvičiště pluku a poté sesednu. Skupinky vojáků tu právě probírají bojové plány."
 travel_events.2003.desc_camp: "Když se [local_captain.GetFirstNameNoTooltip] vydá dál, rychle sesednu a společně procházíme mezi nejnovějšími obléhacími stroji."
 travel_events.2003.outro: "\n\nPřikývnu a se zalíbením sleduji ten organizovaný chaos.\n„A co by si teď [ROOT.Char.Custom('FormOfAddressForLiege')] přál dělat?“ [local_captain.GetFirstNameNoTooltip] očekává mou odpověď."
 travel_events.2003.a: "Trochu šermování by mi neuškodilo!"
 travel_events.2003.a_sparring_tt: "Úspěšně si zatrénuješ s vojáky"
 travel_events.2003.a_wounded_tt: "Při tréninku se nešťastnou náhodou zraníš"
 travel_events.2003.b: "Co je to za zařízení?"
 travel_events.2003.b_success_tt: "Poučení z vojenství"
 travel_events.2003.b_learn_tt: "Studiem vybavení se něco naučíš"
 travel_events.2003.b_failure_tt: "Odhalení"
 travel_events.2003.b_spy_tt: "[county_liege.GetShortUIName] pojme podezření, že možná špehuješ"
 travel_events.2003.b_cut_tt: "Nešťastnou náhodou se o vybavení pořežeš"
 travel_events.2003.c: "[Select_CString(local_captain.IsFemale,'Měla','Měl')] by ses ke mně přidat."
 travel_events.2003.c_success_tt: "Tajný nábor"
 travel_events.2003.c_secret_tt: "[county_liege.GetShortUIName] se o tvém přetahování lidí nedozví"
 travel_events.2003.c_found_out_tt: "[county_liege.GetShortUIName] se o tvém přetahování lidí dozví"
 travel_events.2003.d: "Vlastně musím být někde jinde..."
 travel_events.2004.t: "Pastvina k pohledání"
 travel_events.2004.desc: "Pach hniloby mě udeří do nosu jako štiplavá rána. Když se rozhlédnu po pastvinách v [ROOT.Char.GetCurrentLocation.GetName], dobytek rozhodně nevypadá zdravě.\n\nRolníci, kteří tu pracují, se loudají a bezcílně přecházejí sem a tam ve snaze alespoň předstírat práci. Jejich naprostý nedostatek chuti a morálky se očividně přenesl na celé okolí, protože zdejší rozvoj se zcela zastavil.\n\nNevěřícně se otřesu, když ke mně přichází [local_farmer.GetFirstName]. Tohle místo je vedené naprosto příšerně!"
 travel_events.2004.a: "I slepé prase by to tu vedlo lépe, [local_farmer.GetFirstNameNoTooltip]."
 travel_events.2004.a_success_tt: "Kritika přijata"
 travel_events.2004.a_critique_success_tt: "[local_farmer.GetShortUIName] si tvou kritiku vezme k srdci"
 travel_events.2004.a_failure_tt: "Kritika odmítnuta"
 travel_events.2004.a_critique_reject_tt: "[local_farmer.GetShortUIName] tvou kritiku odmítne"
 travel_events.2004.b: "Potřebuji vaše koně. Hned."
 travel_events.2004.c: "Mám na práci důležitější věci."
 travel_events.2005.t: "Tráva u souseda"
 travel_events.2005.desc: "Takový krásný den! Počasí přeje, pastviny v [ROOT.Char.GetCurrentLocation.GetName] vypadají znamenitě a místní dobytek přímo poskakuje radostí a po svém hrdelně jásá. Telata kráčejí vedle matek, srst mají lesklou a čistou.\n\nCelkově je to tu vedeno velmi schopně, i když si všímám několika drobností, které bych [Select_CString(ROOT.Char.IsFemale,'řešila','řešil')] trochu jinak.\n\nZdejší [local_farmer.Custom('MatriarchPatriarch')] ke mně přichází. „Krásné ráno, [ROOT.Char.Custom('FormOfAddressForLiege')]! Není na ně nádherný pohled?“"
 travel_events.2005.a: "Něco z toho se bude hodit i doma!"
 travel_events.2005.a_success_tt: "Dobrá rada"
 travel_events.2005.a_implemented_tt: "Tvou radu se podaří zavést do praxe"
 travel_events.2005.a_failure_tt: "Špatně pochopená rada"
 travel_events.2005.a_misinterpreted_tt: "Tvou radu zcela špatně pochopí"
 travel_events.2005.b: "Podívejme se, jestli by to tu nešlo ještě vylepšit."
 travel_events.2005.c: "[county_liege.GetTitledFirstNameNoTooltip] se o své pastviny jistě dokáže postarat."
 travel_events.2006.t: "Velký bloud"
 travel_events.2006.desc: "Slunce stojí vysoko nad velbloudí farmou v [ROOT.Char.GetCurrentLocation.GetName] a já hledám stín pod kůžemi napnutými nad některými částmi ohrady. Náhlé zabručení mě vyleká a já se otočím.\n\nJeden z těch nádherných tvorů vedle mě dostal stejný nápad a pohodlně se usadil ve stínu. Nakloním se, abych ho [Select_CString(ROOT.Char.IsFemale,'pohladila','pohladil')] po protáhlé hlavě, když mě zvíře #EMP jediným prudkým pohybem udeří hlavou do čela a plivne mi na tvář#!.\n\nKdyž se vzpamatuji, spatřím jeho [Select_CString(camel_owner.IsFemale,'majitelku','majitele')] stát sotva dvacet kroků opodál, [Select_CString(camel_owner.IsFemale,'celou zahanbenou','celého zahanbeného')]."
 travel_events.2006.a: "Ty i ta tvoje bestie se musíte naučit způsobům!"
 travel_events.2006.a_tt: "Zbičuješ zvíře i jeho majitele."
 travel_events.2006.b: "Hlava téhle bestie poslouží jako #EMP skvělé#! varování."
 travel_events.2006.b_tt: "Setneš velbloudovi hlavu"
 travel_events.2006_camel_head: "Velbloudí hlava"
 travel_events.2006_camel_head_desc: "Hlava neposlušného velblouda."
 travel_events.2006.c: "Zvíře je jen nerozumný tvor."
 travel_events.2007.t: "Chobotastické"
 travel_events.2007.desc_memory: "Podezíravě si prohlížím mohutné tvory ve sloních ohradách v [ROOT.Char.GetCurrentLocation.GetName]. Stále ve mně doznívá nepříjemná vzpomínka na to, jak se mě "
 travel_events.2007.desc_memory_rival: "[Select_CString(crushing_person.IsFemale,'soupeřka ','soupeř ')]"
 travel_events.2007.desc_memory_nemesis: "úhlavní [Select_CString(crushing_person.IsFemale,'nepřítelkyně','nepřítel')] "
 travel_events.2007.desc_memory_segway: "[crushing_person.GetTitledFirstName] málem [Select_CString(crushing_person.IsFemale,'pokusila','pokusil')] nechat jedním z nich rozmáčknout "
 travel_events.2007.desc_memory_here: "právě na tomto místě."
 travel_events.2007.desc_memory_not_here: "v [elephant_memory.Var('elephant_location').GetProvince.GetName] ([elephant_memory.Var('elephant_location').GetTerrain.GetName])"
 travel_events.2007.desc_default: "Majestátní sloni v ohradách v [ROOT.Char.GetCurrentLocation.GetName] jsou skutečně působiví. Pozoruji je, jak přenášejí klády a podstupují nejrůznější tělesná cvičení."
 travel_events.2007.desc_outro: "\n\nPři sledování slonů při práci zaslechnu několik mahútů, jak rozmlouvají o různých způsobech výcviku s těmito zvířaty.\n\nZní to jako pořádná dřina a musím přiznat, že mě to zaujalo."
 travel_events.2007.a: "Tohle #EMP [ROOT.Char.GetTitleAsNameNoTooltip|U]#! hravě zvládne."
 travel_events.2007.a_success_tt: "Skvělý trénink"
 travel_events.2007.a_efficient_training_tt: "Trénink proběhne skvěle"
 travel_events.2007.a_soft_success_tt: "Ucházející trénink"
 travel_events.2007.a_alright_training_tt: "Trénink dopadne obstojně"
 travel_events.2007.a_failure_tt: "Příšerný trénink"
 travel_events.2007.a_failed_training_tt: "Zakopneš o vlastní nohy"
 travel_events.2007.b: "Nebudu tím ztrácet čas."
 travel_events.2008.t: "Račte se posadit"
 travel_events.2008.desc: "Po tváři mi stékají krůpěje potu, jak mě dohání vedro džungle. Zastavím se, abych si otřel čelo, a u místních sloních ohrad v [ROOT.Char.GetCurrentLocation.GetName] zahlédnu [elephant_rival.GetTitledFirstName] — [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('elephant_rival'))] a [elephant_rival.Custom2('InsultNoun', ROOT.Char)] v jedné osobě.\n\n[elephant_rival.GetTitledFirstNameNoTooltip] mi ukáže neslušné gesto a propukne v hlučný smích. Bezpochyby se mi vysmívá. Zatnu čelist.\n\nVtom si všimnu, že [elephant_rival.GetTitledFirstNameNoTooltip] stojí #EMP přímo za slonem#! a zvíře se právě dává do pohybu. Podaří se mi upoutat pozornost jeho mahúta."
 travel_events.2008.a: "[ROOT.Char.Custom('RandomElephantName')], #EMP sedni.#!"
 travel_events.2008.a_success_tt: "Rozmáčknutí slonem"
 travel_events.2008.a_crushed_tt: "[elephant_rival.GetShortUIName]: rozdrcení slonem"
 travel_events.2008.a_soft_success_tt: "Částečné rozdrcení"
 travel_events.2008.a_wounded_tt: "[elephant_rival.GetShortUIName] utrpí zranění"
 travel_events.2008.a_failure_tt: "[elephant_rival.GetTitledFirstNameNoTooltip] unikne"
 travel_events.2008.a_scotfree_tt: "[elephant_rival.GetShortUIName] slonovi unikne"
 travel_events.2008.b: "[elephant_rival.GetTitledFirstNameNoTooltip], pozor!"
 travel_events.2010.t: "Prasklá větev"
 travel_events.2010.temperate_summer: "Teplý vánek mě hladí po šíji, když se procházím sady v [ROOT.Char.GetCurrentLocation.GetName]. Stromy se lehce vzpínají k obloze, zbarvené směsí mladých výhonků a dozrávajících plodů."
 travel_events.2010.temperate_winter: "Ve vzduchu je cítit chlad a dech se mi mění v obláčky páry, když procházím sady v [ROOT.Char.GetCurrentLocation.GetName]. Stromy jako by se před zimou trochu krčily a toužebně čekaly na teplejší dny."
 travel_events.2010.tropical_summer: "Když procházím sady v [ROOT.Char.GetCurrentLocation.GetName], vedro je téměř nesnesitelné. Stromy kolem mě jsou v plném květu, jako by oslavovaly toto období."
 travel_events.2010.tropical_winter: "Konečně nastalo dostatečně mírné období na procházku sady v [ROOT.Char.GetCurrentLocation.GetName], a tak příležitosti využiji. Stromy odpočívají, stále však zůstávají zelené a čekají na teplejší dny."
 travel_events.2010.fallback: "Když procházím pečlivě vysázenými řadami místního sadu v [ROOT.Char.GetCurrentLocation.GetName], stromy se nade mnou vzpínají k obloze. Je krásný den na procházku."
 travel_events.2010.desc: "\n\nNáhle vzduch protne pronikavý výkřik. Přidám do kroku a vzápětí spatřím "
 travel_events.2010.entourage: "[fallen_child.GetFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fallen_child'))], "
 travel_events.2010.peasant: "selské dítě "
 travel_events.2010.outro: "pod stromem, celé rozrušené a usedavě plačící.\n\nPodle všeho se dítě pokusilo vyšplhat na strom, uklouzlo a spadlo na zem. Jedna z kostí teď trčí v nepřirozeném úhlu."
 travel_events.2010.a: "Tyhle stromy jsou životu nebezpečné!"
 travel_events.2010.a_flavor: "Spalte to tu do základů!"
 travel_events.2010.a_tt: "Zranění postavy [fallen_child.GetShortUIName] se mohou zhoršit"
 travel_events.2010.a_tt_2: "[ROOT.Char.GetTitledFirstName] vypálil vaše sady v [location_county.GetNameNoTier]!"
 travel_events.2010.b: "Co tě to napadlo, [fallen_child.GetFirstNameNoTooltip]?!"
 travel_events.2010.b_tt: "Získání rysu"
 travel_events.2010.c: "Tak, tak..."
 travel_events.2010.c_physician: "Pojď, dítě, necháme tě prohlédnout."
 travel_events.2010.c_physician_tt: "[court_physician.GetShortUIName] ošetří postavu [fallen_child.GetShortUIName]"
 travel_events.2010.d: "[fallen_child.Custom('GirlBoyPlural')|U] jsou prostě [fallen_child.Custom('GirlBoyPlural')]."
 travel_events.2011.tt_healed: "Rány se zahojily"
 travel_events.2011.tt_healed_desc: "Rány postavy [fallen_child.GetShortUIName] se zahojily"
 travel_events.2011.tt_worsened: "Rány se zhoršily"
 travel_events.2011.tt_worsened_desc: "Rány postavy [fallen_child.GetShortUIName] se zhoršily"
 travel_events.2012.t: "Požár!"
 travel_events.2012.desc: "Projíždíme krajinou plnou polí a obdělávané půdy. Naší další zastávkou má být místní plantáž v [ROOT.Char.GetCurrentLocation.GetName], ale když asi sto kroků před sebou zahlédnu její bránu, něco není v pořádku...\n\nDo nosu mě udeří štiplavý pach... kouře? Kouř? Požár! Teprve teď si všimnu sloupu dýmu, který se zvedá nad plantáží.\n\nJe hustý a těžký — příliš mohutný na to, aby pocházel jen od dělníků spalujících nějaké zbytky."
 travel_events.2012.a: "[guard_type_character.GetFirstNameNoTooltip], rychle! Vezmi vědra!"
 travel_events.2012.a_unscathed: "Plameny uhašeny"
 travel_events.2012.a_unscathed_desc: "[guard_type_character.GetShortUIName] uhasí požár"
 travel_events.2012.a_scarred: "Uhašeno, ale za cenu jizev"
 travel_events.2012.a_scarred_desc: "[guard_type_character.GetShortUIName] uhasí požár, ale utrpí jizvy"
 travel_events.2012.a_death: "Uhašeno za cenu života"
 travel_events.2012.a_death_desc: "[guard_type_character.GetShortUIName] uhasí požár, ale při tom zemře"
 travel_events.2012.b: "Evakuujme lidi z pracovních budov!"
 travel_events.2012.b_unscathed: "Bez úhony"
 travel_events.2012.b_unscathed_desc: "Zachráníš dělníky bez úhony"
 travel_events.2012.b_scarred: "Zjizvení"
 travel_events.2012.b_scarred_desc: "Zachráníš dělníky, ale utrpíš jizvy"
 travel_events.2012.b_tt: "Mínění členů tvého doprovodu o tobě se výrazně zvýší"
 travel_events.2012.c: "#EMP Inu#!, není to vlastně příležitost..."
 travel_events.2012.c_secret: "Tajné plenění"
 travel_events.2012.c_secret_desc: "Tvé plenění zůstane utajeno"
 travel_events.2012.c_revealed: "Plenění odhaleno"
 travel_events.2012.c_revealed_desc: "[county_liege.GetShortUIName] odhalí tvé plenění"
 travel_events.2012.c_tt: "Mínění členů tvého doprovodu o tobě se výrazně sníží"
 travel_events.2012.d: "Nikdy jsme tu nebyli."
 travel_events.2012.d_flavor: "Doprovod se tiše vytratí."
 travel_events.2012.d_tt: "Mínění členů tvého doprovodu o tobě se sníží"
 travel_events.2013.t: "Opevněné znalosti"
 travel_events.2013.intro: "Vysoká nadmořská výška a svěží vzduch v [ROOT.Char.GetCurrentLocation.GetName] působí velmi osvěžujícím dojmem, když procházíme místním hradištěm."
 travel_events.2013.martial: "\n\nPozorně sleduji vojáky cvičící dole pod námi. Jejich taktika mi není úplně cizí, vždyť vojenskému umění [Select_CString(ROOT.Char.IsFemale,'sama','sám')] dobře rozumím."
 travel_events.2013.default: "\n\nVojáci v údolí pod námi zřejmě nacvičují jakousi neobvyklou techniku, kterou jsem ještě nikdy [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]. Zvědavost mi nedá a přiblížím se."
 travel_events.2013.outro: "\n\nPřitom ke mně přistoupí místní [Select_CString(local_captain.IsFemale,'velitelka','velitel')] [local_captain.GetFirstNameNoTooltip]: „Nechcete se přidat, [ROOT.Char.Custom('FormOfAddressForLiege')]?“"
 travel_events.2013.rough_terrain: "získá zkušenosti s bojem v obtížném terénu"
 travel_events.2013.reckless: "začne jednat bezhlavě"
 travel_events.2013.a: "Výzvám se nikdy nevyhýbám!"
