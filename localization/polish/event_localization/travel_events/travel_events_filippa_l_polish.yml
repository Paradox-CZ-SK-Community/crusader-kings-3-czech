 travel_events.2014.t: "Sek sem, sek tam"
 travel_events.2014.desc: "Mohutný špalek uprostřed dřevorubeckého tábora v [ROOT.Char.GetCurrentLocation.GetName] už toho zažil opravdu hodně. Vypadá, jako by tu stál odjakživa, snad ještě dřív, než člověk poprvé kráčel po zemi.\n\nVšude kolem mě se lopotí dělníci, zalití potem. Přestože jsou nízkého původu, jako by na jejich bedrech neležela tíha celého světa.\n\nZírám na štípací sekeru zaseknutou ve vzrostlém pařezu. Má napjatá ramena, obtěžkaná stresem, přímo volají po troše úlevy."
 travel_events.2014.a: "Sevřu topůrko a #EMP Hrrráá!#!"
 travel_events.2014.a_flavor: "#EMP Nažer se tohohle#!, strese!"
 travel_events.2014.a_stress_tt: "Snížení stresu"
 travel_events.2014.a_great_stress_desc: "Výrazně si snížíš stres"
 travel_events.2014.a_stress_desc: "Snížíš si stres"
 travel_events.2014.a_injured_tt: "Utrpěné zranění"
 travel_events.2014.a_injured_desc: "Nešťastnou náhodou se zmrzačíš"
 travel_events.2014.b: "...ne, ruční práce je pod mou úroveň."
 travel_events.2014.b_flavor: "Spustíš sekeru."
 travel_events.2015.t: "Rašelina? Jen povídejte..."
 travel_events.2015.desc: "[quarry_guide.GetTitledFirstName|U] při provázení rašeliništěm v [ROOT.Char.GetCurrentLocation.GetName] přímo překypuje dětským nadšením. Z nějakého nepochopitelného důvodu je zřejmě přesvědčení, že toto místo je klenotem zdejší zelené krajiny.\n\nRozhlížím se po rozrytém poli, samá hněď a šedavá zeleň.\nVíčka mi těžknou. Poslední dobou se mi spánek vyhýbá. Pomalu se zavírají...\n\nNáhle sebou trhnu a procitnu; [quarry_guide.GetFirstNamePossessiveNoTooltip] ruka mě drží za rukáv.\n„...já vás snad #EMP nudím#!?“"
 travel_events.2015.a: "Jen jsem to všechno [Select_CString(ROOT.Char.IsFemale,'vstřebávala','vstřebával')]!"
 travel_events.2015.a_convinced_tt: "Přesvědčení"
 travel_events.2015.a_convinced_desc: "Podaří se ti přesvědčit postavu [quarry_guide.GetShortUIName]"
 travel_events.2015.a_insulted_tt: "Uražení"
 travel_events.2015.a_insulted_desc: "[quarry_guide.GetShortUIName] se cítí uraženě"
 travel_events.2015.b: "Podívejme se raději na tenhle měšec..."
 travel_events.2015.b_flavor: "Podplatíš postavu [quarry_guide.GetShortUIName]"
 travel_events.2016.t: "Býčí nadělení"
 travel_events.2016.desc: "Tiché bučení a pach hnoje nejsou zdaleka tím jediným, co mohou pastviny na svazích v [ROOT.Char.GetCurrentLocation.GetName] nabídnout pocestným. Nechybí ani křik čeledínů, ohlušující řev a uprchlý býk přímo na cestě před námi.\n\nObrovské zvíře se v naprostém rozrušení žene sem a tam, až si nakonec vybere cíl: [entourage_member.GetFirstName] na vyděšeném koni.\n\nNedaleko je otevřená brána, za kterou bychom býka mohli zavřít — někdo z nás jen musí najít dost odvahy, aby ho tam nalákal!"
 travel_events.2016.a: "Sem, ty [bull_loc.Custom2('InsultAdjective', ROOT.Char)] býku!"
 travel_events.2016.a_captured.tt: "Dopaden"
 travel_events.2016.a_captured.desc: "Úspěšně býka chytíš"
 travel_events.2016.a_wounded.tt: "$travel_events.2001.c_failure.tt$"
 travel_events.2016.a_wounded.desc: "Býka se podaří chytit, ale utrpíš zranění"
 travel_events.2016.b: "[guard_type_character.GetFirstNameNoTooltip], #EMP něco udělej!#!"
 travel_events.2016.b_putdown.tt: "Utracen"
 travel_events.2016.b_putdown.desc: "[guard_type_character.GetShortUIName] ukončí býkovo trápení"
 travel_events.2016.b_wounded.desc: "[guard_type_character.GetShortUIName] schytá zásah"
 travel_events.2016.c: "Raději to nebudu riskovat."
 travel_events.2016.c_escaped.tt: "Únik"
 travel_events.2016.c_escaped.desc: "[entourage_member.GetShortUIName] jen těsně unikne býčímu útoku"
 travel_events.2016.c_wounded.desc: "[entourage_member.GetShortUIName] utrpí zranění"
 travel_events.haunted_manor.t: "„Strašidelné“ sídlo"
 travel_events.2017.t: "$travel_events.haunted_manor.t$"
 travel_events.2017.desc: "Když procházíme chodbami sídla v [ROOT.Char.GetCurrentLocation.GetName], otočí se ke mně zdejší vrchnost [estate_character.GetTitledFirstName]. „Říká se, že v této části panství straší, [ROOT.Char.Custom('FormOfAddressForLiege')].“\n\nNejistě se rozhlédnu. Síň je o něco temnější, než jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')], a svíce na svých místech neklidně poblikávají.\n\nKdyž dorazíme do staré jídelní síně, [estate_character.GetFirstNameNoTooltip] se ke mně znovu otočí, tentokrát s úsměvem. „Nechcete si prohlédnout naše #EMP strašidelné#! sídlo?“"
 travel_events.2017.a: "„Ó, to zní #EMP zajímavě!#!“"
 travel_events.2017.a_tt: "Vstoupíš do sídla"
 travel_events.2017.b: "Tak to tedy ne."
 travel_events.2017.b_tt: "Opustíš sídlo"
 travel_events.2018.t: "$travel_events.haunted_manor.t$: Cesta vpřed"
 travel_events.2018.desc: "Procházíme temnou, opuštěnou chodbou. Těch několik kusů nábytku, na které narazíme, je zakrytých prostěradly, což jen umocňuje přízračnou atmosféru.\n\nByla to... krysa? Zrychlím, abych [Select_CString(ROOT.Char.IsFemale,'dohnala','dohnal')] svůj doprovod.\n\n[estate_character.GetTitledFirstName|U] se k nám otočí, přimhouří oči a pronese: „...a tudy dál, dámy a pánové.“"
 travel_events.2018.a: "Raději se budu držet prohlídky."
 travel_events.2018.a_tt: "Zůstaneš se svým doprovodem"
 travel_events.2018.b: "Copak se asi skrývá v tomhle zákoutí..."
 travel_events.2018.b_tt: "Možná najdeš něco zajímavého"
 travel_events.2018.c: "Já odsud mizím!"
 travel_events.2019.t: "$travel_events.haunted_manor.t$: Zrada v sídle"
 travel_events.2019.desc: "Vydám se levou cestou a projdu nízkým obloukem. Přede mnou se objeví padací dveře, pootevřené jen na škvíru.\n\nNeproniknutelnou tmu narušuje mihotavé světlo přicházející zdola. Opatrně slezu po žebříku a tam... #EMP zahalená postava s dýkou?!#!\n\nZoufale se rozhlížím po okolí, zatímco se ke mně zahalená postava rychle blíží."
 travel_events.2019.a: "„Podívej! Za tebou!“"
 travel_events.2019.a_tt: "Pokusíš se na zahalenou postavu shodit skříň"
 travel_events.2019.a_retaliate.tt: "Odplata"
 travel_events.2019.a_retaliate.desc: "Skříň dopadne na zahalenou postavu a rozdrtí jí lebku"
 travel_events.2019.a_retaliate.effect_tt: "Zahalená postava zemře"
 travel_events.2019.a_death.desc: "Zemřeš"
 travel_events.2019.b: "„Mohu ti naplnit kapsy zlatem!“"
 travel_events.2019.b_tt: "Pokusíš se zahalenou postavu podplatit"
 travel_events.2019.b_paid_off.tt: "Podplacení"
 travel_events.2019.b_paid_off.desc: "Podplacená postava unikne"
 travel_events.2019.a_paid_off.effect_tt: "Zahalená postava unikne"
 travel_events.2019.c: "„Do střehu, ničemo!“"
 travel_events.2019.c_tt: "Pustíš se se zahalenou postavou do boje"
 travel_events.2019.c_retaliate.desc: "Zahalenou postavu zabiješ"
 travel_events.2019.expose_effect_tt: "Spolčenec odhalen"
 travel_events.2020.t: "$travel_events.haunted_manor.t$: Která čarodějnice?"
 travel_events.2020.desc_witch: "Náhle dostanu chuť prozkoumat úzkou chodbu po pravici. Když jí procházím, přivítá mě teplá záře z otevřených dveří.\n\nMístnost je přeplněná nejrůznějším náčiním. Poznávám celou řadu bylin, alembiků, tyglíků, baněk, hrnců a kotlíků... Nádherná ukázka alchymie.\n\nVítá mě [mendicant_character.GetWomanMan] s úsměvem: „Zdravím! Ty jsi [ROOT.Char.Custom('SisterBrother')], že? Jmenuji se [mendicant_character.GetFirstNameNoTooltip] a už je to pěkně dlouho, co někdo překročil můj práh. Dáš si něco k pití?“ Ruka ukáže ke kotlíku, o který se právě stará."
 travel_events.2020.desc: "Oddělím se od skupiny a projdu ještě temnější chodbou, až narazím na dveře. Kolem jejich okrajů proniká světlo.\n\nOpatrně je otevřu a přivítá mě tiché syčení. Uprostřed přeplněné místnosti plné knih, lahví a všemožného alchymistického náčiní stojí [mendicant_character.GetWomanMan].\n\nZ kotle se line odporný zápach. Aniž se postava od kotle otočí, ozve se: „Dáš si trochu? Obvykle to dělá divy.“"
 travel_events.2020.a: "„Trocha toho čaje by mi nevadila.“"
 travel_events.2020.b: "„Víš, na mém dvoře by ses [Select_CString(mendicant_character.IsFemale,'mohla','mohl')] hodit.“"
 travel_events.2020.c: "„Nejdřív ochutnám tebe, čaj až potom.“"
 travel_events.2020.d: "„Ehm... kudy se vrátím k prohlídce?“"
 travel_events.2021.t: "$travel_events.haunted_manor.t$: Něco vypůjčeného"
 travel_events.2021.desc_intro: "Projdu úzkými dveřmi a přivítá mě tlumený svit pronikající zakrytými okny. Místnost zřejmě kdysi sloužila jako pracovna."
 travel_events.2021.desc_illustrious: "\n\nMou pozornost okamžitě upoutá dokonale zachovalý předmět: [new_trinket.GetName], pečlivě umístěný na podstavci uprostřed místnosti. Opatrně se přiblížím.\n\nJe to skutečné umělecké dílo, jeden detail působivější než druhý. Chvíli jen obdivuji jeho krásu."
 travel_events.2021.desc_famed: "\n\nRozhlédnu se po místnosti a okamžitě mi padne do oka mistrovsky zpracovaný předmět: [new_trinket.GetName]. Spočívá na něčem, co připomíná podstavec, a přímo si říká o pozornost.\n\nNěco takového by rozhodně nemělo zůstávat jen tak na očích. Je to dokonalý cíl pro lupiče i zloděje. Opatrně se přiblížím."
 travel_events.2021.desc_masterwork: "\n\nPřímo uprostřed místnosti stojí na podstavci [new_trinket.GetName]. Opatrně se přiblížím.\n\nKomu asi patřil? Vzhledem k místu, kde je uložen, se nachází v pozoruhodně dobrém stavu."
 travel_events.2021.desc_common: "\n\nKdyž si oči zvyknou na nové prostředí, všimnu si na stole u okna zajímavého předmětu: [new_trinket.GetName].\n\nNa první pohled možná nepůsobí nijak výjimečně, ale já dokážu ocenit řemeslnou práci, která se za ním skrývá. Je poctivě zhotovený."
 travel_events.2021.desc_bad: "\n\nProhlížím si místnost a jsem [Select_CString(ROOT.Char.IsFemale,'vděčná','vděčný')] za trochu světla pronikajícího oknem. Právě se chystám odejít, když si všimnu něčeho na hromadě suti v rohu.\n\nJe to... #EMP nějaká věc?#! A má to vůbec nějaký účel? Na okamžik zaváhám."
 travel_events.2021.a: "Tohle bude skvělý přírůstek do mé sbírky."
 travel_events.2021.a_bad: "...vážně musím?"
 travel_events.2021.b: "Raději ne."
 travel_events.2021.b_tt: "Předmět [new_trinket.GetName] necháš bez povšimnutí"
 travel_events.2022.t: "$travel_events.haunted_manor.t$: V bezpečí a bez úhony"
 travel_events.2022.desc_pack: "Když projdeme obloukem do další místnosti, náhle se proti nám shora zhoupne mohutný temný tvar. Celá skupina sebou trhne a vykřikne.\n\nKdyž vzhlédnu, ukáže se, že temná postava je kostra zabalená do černého prostěradla. Zamračím se, zatímco [estate_character.GetTitledFirstName|U] se nám s širokým úsměvem směje.\n\n„Měli jste vidět ty svoje výrazy, dámy a pánové!“ [entourage_member_one.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_one'))], očividně zuří a se zdviženou rukou vykročí k [estate_character.GetTitledFirstNameNoTooltip]."
 travel_events.2022.desc_murder: "Po právě prožitém útoku vraha se mi stále motá hlava, když se zvedám na nohy. #EMP Co se to právě stalo?#!\n\nRoztřeseně vyšplhám po žebříku zpět nahoru a chodbou se vracím směrem k jídelně. Stres brzy vystřídá vztek. #EMP Má v tom [estate_character.GetTitledFirstName] prsty?#!\n\nKdyž konečně dorazím ke shromážděné skupině, sotva si všimnu kostry zahalené v látce, která visí z oblouku.\n\nS očima planoucíma vzteky zírám na [estate_character.GetFirstNameNoTooltip], který na mě hledí naprosto nechápavě."
 travel_events.2022.desc_mendicant: "Po odchodu z místnosti, kde pobývá [mendicant_character.GetTitledFirstName], snadno následuji hluk zpět do hlavní síně.\n\nSkupina vypadá rozrušeně, ale zároveň se jí zjevně ulevilo. Nad nimi visí v oblouku temný tvar. [estate_character.GetTitledFirstName|U] se rychle otočí a při pohledu na mě sebou mírně trhne.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Vyrazit někam o samotě? To není bezpečné, víte!“ [estate_character.GetFirstNameNoTooltip] přimhouří oči."
 travel_events.2022.desc_mendicant_recruit: "Společně s [mendicant_character.GetTitledFirstName] opouštíme místnost a vydáváme se zpět za skupinou v hlavní síni.\n\n[mendicant_character.GetFirstNameNoTooltip] si odfrkne při pohledu na temnou postavu visící z oblouku, kterým skupina zřejmě prošla. [estate_character.GetTitledFirstName] se při tom okamžitě otočí.\n\n[estate_character.GetTitledFirstNameNoTooltip] při pohledu na [mendicant_character.GetFirstNameNoTooltip] vytřeští oči. „Kdo je #EMP tohle#!? [ROOT.Char.GetLadyLord]! Takhle se jen tak vytratit není bezpečné!“"
 travel_events.2022.desc_bauble: "S novým přírůstkem v kapse se spokojeně procházím temnými a úzkými chodbami. Nakonec najdu zbytek skupiny v jídelně na konci sídla.\n\nZ jednoho z oblouků visí velký temný tvar a nemohu se ubránit otázce, k čemu to asi má sloužit. Ostatní navíc vypadají trochu rozrušeně...?\n\n[estate_character.GetTitledFirstName|U] sebou trhne a otočí se ke mně. „[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Co jste tu [Select_CString(ROOT.Char.IsFemale,'vyváděla','vyváděl')]? V těchto temných chodbách není bezpečné chodit o samotě!“"
 travel_events.2022.desc_joshed: "Tápu ve tmě a snažím se nevnímat rostoucí pocit paniky, který ve mně vyvolává. Spěchám dalšími dveřmi a snažím se najít skupinu...\n\n...když se na mě #EMP náhle#! shora snese mohutný temný tvar. Překvapeně vykřiknu.\n\nKdyž se vzpamatuji, zjistím, že skupina stojí přímo v místnosti, do které jsem právě [Select_CString(ROOT.Char.IsFemale,'vstoupila','vstoupil')]. [estate_character.GetTitledFirstName] se smíchy sotva může nadechnout a ukazuje na mě. „[ROOT.Char.GetLadyLord] v celé své kráse! #EMP *odfrkne si*#! Tak co... bav... bavila vás prohlídka?“"
 travel_events.2022.a: "„Právě jsem [Select_CString(ROOT.Char.IsFemale,'přežila','přežil')] pokus o vraždu, který jsi [Select_CString(estate_character.IsFemale,'zosnovala','zosnoval')] #EMP ty!#!“"
 travel_events.2022.a_slain.tt: "Viník zabit"
 travel_events.2022.a_slain.desc: "Zabiješ [estate_character.GetShortUIName]"
 travel_events.2022.a_escape.tt: "Viník unikl"
 travel_events.2022.a_escape.desc: "[estate_character.GetShortUIName] tě zraní a unikne"
 travel_events.2022.b: "„Stráže! Tato osoba se podílí na spiknutí s cílem mě zabít!“"
 travel_events.2022.b_slain.desc: "[travel_leader.GetShortUIName] zabije [estate_character.GetShortUIName]"
 travel_events.2022.b_escape.desc: "[estate_character.GetShortUIName] zraní [travel_leader.GetShortUIName] a unikne"
 travel_events.2022.c: "„Možná byste [Select_CString(estate_character.IsFemale,'měla','měl')] prohledat dům. Mohou tu být čarodějnice.“"
 travel_events.2022.d: "„Vlastně je tu [Select_CString(mendicant_character.IsFemale,'čarodějnice','čaroděj')] — [mendicant_character.GetFirstNameNoTooltip].“"
 travel_events.2022.e: "„Mně to připadá jako naprosto obyčejný dům.“"
 travel_events.2022.f_pack: "[Select_CString(ROOT.Char.IsFemale,'Neměla','Neměl')] bych zasahovat."
 travel_events.2022.f: "„Ty ničemo!“"
 travel_events.2022.g_pack: "„[entourage_member_one.GetFirstNameNoTooltip], nech toho.“"
 travel_events.2022.g: "„Ach. Haha, ano, samozřejmě!“"
 travel_events.2024.t: "$travel_events.haunted_manor.t$: Mor na tebe!"
 travel_events.2024.desc: "[mendicant_character.GetFirstName] na mě zírá. A nepřestává. Rozběhnu se chodbami, abych tomu pohledu [Select_CString(ROOT.Char.IsFemale,'unikla','unikl')] — ale [mendicant_character.GetFirstNameNoTooltip] jde za mnou. Ty oči jsou všude.\n\n„Já... vím...“ ozve se šeptem. Když se otočím k útěku, zakopnu a zřítím se do jámy tak temné, že by ji neosvětlilo ani tisíc svící. Padám dál a dál...\n\nNáhle sebou trhnu a probudím se [Select_CString(ROOT.Char.IsFemale,'zalitá','zalitý')] potem."
 travel_events.2024.a: "To všechno byl... jen zlý sen?"
 travel_events.2025.t: "[Select_CString(estate_owner.IsFemale,'Pohostinná hostitelka','Pohostinný hostitel')]"
 travel_events.2025.desc: "Když krátce před setměním dorazíme k hospodářské usedlosti v [ROOT.Char.GetCurrentLocation.GetName], [estate_owner.GetFirstName] nás přijme s mimořádnou pohostinností a postará se o všechny naše potřeby.\n\nPozději večer je na mou počest uspořádána hostina. Číše zůstávají plné a [ROOT.Char.Custom('RegionalDrink')] nechybí až do chvíle, kdy se na obloze objeví první známky úsvitu.\n\nRáno za mnou přijde [estate_owner.GetFirstNameNoTooltip]: „[ROOT.Char.Custom('FormOfAddressForLiege')|U], bylo nám velkým potěšením vás hostit a na tuhle veselici budeme ještě dlouho s radostí vzpomínat,“ dodá s úsměvem a přikývnutím."
 travel_events.2025.a: "„...a co zásoby? Odpovídá [ROOT.Char.Custom('RegionalDrink')] svou hojností i vaší daňové sazbě?“"
 travel_events.2025.b: "„[estate_owner.GetFirstNameNoTooltip], vaše pohostinnost byla příkladná.“"
 travel_events.2025.c: "„Na oplátku vám nabídnu pár nápadů na zlepšení.“"
 travel_events.2026.t: "Spropitné za pohostinnost"
 travel_events.2026.desc_intro: "Odpoledne rychle přechází v soumrak, když dorazíme k hospodářské usedlosti v [ROOT.Char.GetCurrentLocation.GetName]. [estate_owner.GetFirstName] nás srdečně přivítá a slíbí nám velkolepou hostinu.\n\nJakmile hostina začne, na stole se objeví"
 travel_events.2026.desc_carnivore: "hotová přehlídka pečených zvířat, dušených jídel, polévek, chleba a všelijakých dalších dobrot."
 travel_events.2026.desc_vegetarians: "úžasná záplava zeleninových pokrmů, z nichž některé vůbec neznám."
 travel_events.2026.desc_outro: "\n\nRáno ke mně při snídani přijde [estate_owner.GetFirstNameNoTooltip]. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], uspořádat tak okázalou veselici jako včera může být #EMP drahé...#!“"
 travel_events.2026.a: "„#EMP Vy#! byste [Select_CString(estate_owner.IsFemale,'měla','měl')] platit #EMP mně#! za prestiž, kterou má návštěva přináší vaší #EMP usedlosti#!.“"
 travel_events.2026.b: "„Dovolte mi vám to vynahradit.“"
 travel_events.2026.c: "„Třeba se s [county_liege.GetTitledFirstNameNoTooltip] nějak dohodneme.“"
 travel_events.2026.d: "„Jak se #EMP opovažujete#!?“"
 travel_events.2027.t: "Spor v lomu"
 travel_events.2027.desc: "Když vstoupím do místního lomu v [ROOT.Char.GetCurrentLocation.GetName], spatřím několik vyhublých a špinavých dětí, které pomáhají svým hladovějícím rodičům s těžkou prací. Jídla je tu očividně nedostatek.\n\nO kus dál se vedoucí lomu [foreman_character.GetFirstName] hádá s [peasant_leader.GetFirstName], [Select_CString(peasant_leader.IsFemale,'která','který')] zjevně mluví za dělníky. „Tohle je #EMP nepřijatelné#!!“ vykřikne [peasant_leader.GetFirstNameNoTooltip].\n\n„Nemůžeme si dovolit dost jídla a už celé měsíce chodíme spát hladoví. Naše děti hladoví a při tak těžké práci nám ubývají síly. Stačilo by nám #EMP sebemenší#! zvýšení mzdy...“ Hlas umlkne, jakmile si [peasant_leader.GetFirstNameNoTooltip] všimne mé přítomnosti."
 travel_events.2027.a: "„Dělníci v bezpečí a s plnými žaludky pracují lépe.“"
 travel_events.2027.b: "„Hlad udržuje motivaci.“"
 travel_events.2027.c: "„Zařaď se do řady, #EMP holoto.#!“"
 travel_events.2027.d: "„Co takhle dnešní večeře: [foreman_character.GetFirstNameNoTooltip]?“"
 travel_events.2028.t: "Architektonický přehled"
 travel_events.2028.desc: "Když náš doprovod vstoupí do lomů v [ROOT.Char.GetCurrentLocation.GetName], [budding_architect.GetFirstName] si nás ani nevšimne, tak hluboce se soustředí. Nad velkým, nahrubo tesaným dřevěným stolem kreslí cosi na svitek.\n\nNakloním se blíž přes rameno a tím na sebe upozorním. „[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Vůbec jsem si vás [Select_CString(budding_architect.IsFemale,'nevšimla','nevšiml')], upřímně se omlouvám!“\n\nZeptám se, na čem pracuje, a [budding_architect.GetFirstNameNoTooltip] odpoví:\n„Ale, jen si načrtávám své úvahy o stavitelství a zakládání staveb. V architektuře se docela vyznám, víte,“ zazní s nesmělým úsměvem."
 travel_events.2028.a_architect: "„Ty jsou opravdu dobré. Jeden si vezmu!“"
 travel_events.2028.a: "„Architektura, říkáš? Jeden z těch nákresů si vezmu!“"
 holding_blueprint: "Stavební nákres"
 holding_blueprint_desc: "Svitek s nákresem zachycujícím znalosti o tom, jak co nejúčinněji stavět určité budovy."
 travel_events.2028.b: "Tvé schopnosti by se mi na dvoře hodily."
 travel_events.2028.b.tt: "[budding_architect.GetShortUIName] bude po dobu 20 let pracovat za nižší mzdu"
 trainee_salary_mod: "Nižší nástupní mzda"
 travel_events.2028.c: "To je... pěkné... Jen tak dál."
 travel_events.2029.t: "Probuzení"
 travel_events.2029.desc: "Když za soumraku dorazíme k obilným polím jižně od [ROOT.Char.GetCurrentLocation.GetName], [crop_circler.GetFirstName] tam pilně pracuje. Pomocí velkého plochého kusu dřeva a těžkých kamenů rychle udusává obilí k zemi.\n\nZamračím se při pohledu na tu podivnou práci a zeptám se, co to má znamenat.\n\n[crop_circler.GetFirstNameNoTooltip] sebou trhne a spustí dlouhou tirádu o tom, že se všichni musíme probudit a setkat se se svými skutečnými pány, místo abychom se schovávali za falešné [crop_circler.GetFaith.GetReligion.GetAdjectiveNoTooltip] učení. Překvapeně o několik kroků ustoupím."
 travel_events.2029.a: "„Přestaň s tím, ty [Select_CString(crop_circler.IsFemale,'kacířko','kacíři')]!“"
 travel_events.2029.b: "„Jak se opovažuješ! [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] není k hanobení!“"
 travel_events.2029.c: "„Pověz mi víc o těch #EMP skutečných pánech#!.“"
 travel_events.2029.d: "„Ehm... dobrá.“"
 travel_events.2030.t: "Zpověď pochybující duše"
 travel_events.2030.desc: "Ráno za mnou přijde [entourage_chaplain.GetTitledFirstName] a nervózně si mne ruce. „[ROOT.Char.Custom('FormOfAddressForLiege')|U], musím se k něčemu strašnému přiznat.“\n\nNásleduje těžký povzdech. „Ne že bych [Select_CString(entourage_chaplain.IsFemale,'přijímala','přijímal')] nějaké... vyloženě šílené... učení jako [crop_circler.GetFirstNameNoTooltip] včera večer, ale občas mě přepadly... #EMP pochybnosti.#!“ [entourage_chaplain.GetFirstNameNoTooltip] mě pozorně sleduje a hledá u mě pochopení.\n\n„Prostě si nejsem [Select_CString(entourage_chaplain.IsFemale,'jistá','jist')], zda [entourage_chaplain.GetFaith.HighGodName] skutečně existuje a bdí nad námi.“ Po těch slovech nastane dramatické ticho."
 travel_events.2030.a: "„To je v pořádku.“"
 travel_events.2030.b: "„Tohle je #EMP nepřijatelné#!!“"
 travel_events.2031.t: "Lůno země"
 travel_events.2031.desc: "Pole v [ROOT.Char.GetCurrentLocation.GetName] jsou nádherná na pohled. Všechno kvete, každý list je zelený a každý stonek překypuje životem.\n\nBrzy najdu zdroj té vší nádhery. Uprostřed pole stojí [gardener_character.GetFirstName] a zjevně přednáší shromážděné skupince posluchačů. „Jmenuji se [gardener_character.Custom('MistressMaster')|U] [gardener_character.GetFirstName].“\n\nJakmile si mě všimne v dálce, obrátí se ke mně. „Mé znalosti zahradnictví jsou rozsáhlé, ano, nesrovnatelně rozsáhlé — tak chvíli zůstaňte a poslouchejte.“"
 travel_events.2031.a: "„To mě zaujalo!“"
 travel_events.2031.a_down_to_earth.t: "Při zemi"
 travel_events.2031.b: "„Já, [ROOT.Char.GetTitleAsNameNoTooltip|U], a #EMP zahradničení#!?“"
 travel_events.2032.t: "Jedna bylinka pro vás..."
 travel_events.2032.desc: "[ROOT.Char.GetCurrentLocation.GetName] ([ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]) se pyšní působivým opevněním na vrcholu. Když procházím podél jeho vnějšího obvodu, všimnu si v dálce podivné osoby.\n\n[herbalist_character.GetFirstNameNoTooltip] si cosi mumlá pod nos, co chvíli se zastaví, přikrčí a sbírá nejrůznější byliny. Skoro to vypadá, jako by snad rozmlouval s... #EMP bylinami#!?\n\nOpatrně se přiblížím. [herbalist_character.GetFirstNameNoTooltip] vzhlédne a na otevřené dlani drží několik různých bylin. V očích zahlédnu jiskru zvědavosti, jako by v nich visela nevyslovená otázka."
 travel_events.2032.a: "„A k čemu slouží tahle bylina?“"
 travel_events.2032.a_poisonous.tt: "Obstaráš si jedovaté byliny, které můžeš použít při své příští [Concept('scheme','intrice')|E] typu [GetScheme('murder').GetTypeName]"
 travel_events.2032.a_poisonous.t: "Získané byliny"
 travel_events.2032.a_poisonous.desc: "Najdeš jedovaté byliny"
 travel_events.2032.a_learning.tt: "Zlepšení dovednosti"
 travel_events.2032.b: "[Select_CString(herbalist_character.IsFemale,'„Nechtěla byste se stát mou osobní lékařkou?“','„Nechtěl byste se stát mým osobním lékařem?“')]"
 travel_events.2032.c: "„Tohle je ztráta času.“"
 travel_events.2033.t: "[Select_CString(prisoner.IsFemale,'Vězeňkyně uprchla!','Vězeň uprchl!')]"
 travel_events.2033.desc_intro: "Sotva vstoupíme do loveckého revíru v [ROOT.Char.GetCurrentLocation.GetName], přiběhnou ke mně stráže, zadýchané a lehce zpanikařené. „[ROOT.Char.Custom('FormOfAddressForLiege')|U]! [prisoner.GetTitledFirstName] nám [Select_CString(prisoner.IsFemale,'unikla','unikl')] z pout! Ten [prisoner.Custom2('InsultAdjective', ROOT.Char)] člověk je pryč!“\n\nPohled mi okamžitě sklouzne k okraji lesa. Pátrám po sebemenším náznaku pohybu, ale nic nevidím."
 travel_events.2033.desc_manhunt: "To může znamenat jediné. #EMP Štvanice!#!\n\n"
 travel_events.2033.desc_manhunt_previous: "Vzpomínka na mou poslední štvanici ve mně zažehne jiskru radosti a celé tělo zaplaví neklid. To vzrušení. To nebezpečí. Nemohu se dočkat."
 travel_events.2033.desc_manhunt_first: "Už dlouho toužím vyzkoušet lov nejnepolapitelnější a nejnebezpečnější kořisti přírody: člověka. V koutku úst mi zahraje úsměv."
 travel_events.2033.desc: "Útěk vězně mě na okamžik vyvede z míry a já pečlivě zvažuji situaci.\n\nUprchlého vězně bychom přece měli přivést před spravedlnost, ne?"
 travel_events.2033.a_manhunt: "#EMP Vzrušující!#!"
 travel_events.2033.a_cannibal: "Ach ano, vězni. Takové trochu jiné bílé maso."
 travel_events.2033.a_manhunt_tt: "Kořist, která štvanici unikne, se může později vrátit pro pomstu"
 travel_events.2033.a_manhunt.tt: "Úspěšná štvanice"
 travel_events.2033.a_manhunt.desc: "Štvanice skončí smrtí postavy [prisoner.GetShortUIName]"
 travel_events.2033.a_caught_trophy.desc: "Z postavy [prisoner.GetShortUIName] se po štvanici stane trofej"
 travel_events.2033.a_caught_eaten.tt: "Lidská kořist snědena"
 travel_events.2033.a_caught_eaten.desc: "Kořistí se stane [prisoner.GetShortUIName] a skončí na talíři"
 travel_events.2033.a_escaped.tt: "Úspěšný útěk"
 travel_events.2033.a_escaped.desc: "[prisoner.GetShortUIName] ti unikne"
 travel_events.2033.a_killed.desc: "[prisoner.GetShortUIName] tě zabije a unikne"
 travel_events.2033.a_accident.desc: "Zakopneš a zlomíš si vaz"
 manhunt_skull_cup: "Pohár z lebky ze štvanice"
 manhunt_skull_cup_desc: "Tento pohár z lebky je trofejí z úspěšné štvanice, při níž kořistí byla [new_skull_cup.MakeScope.Var('skull_origin').Char.GetUIName]. Místo lovu: [ROOT.Char.GetCurrentLocation.GetName] ([ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l])."
 manhunt_skull_cup_desc_fallback: "Tento pohár z lebky je trofejí z úspěšné štvanice na lidskou kořist."
 travel_events.2033.b: "...asi bychom [Select_CString(prisoner.IsFemale,'tu uprchlou vězeňkyni','toho uprchlého vězně')] měli chytit?"
 travel_events.2033.b_caught.tt: "Dopadení"
 travel_events.2033.b_caught.desc: "[prisoner.GetShortUIName] je znovu dopaden"
 travel_events.2033.b_caught.effect: "[prisoner.GetShortUIName] nadále zůstává ve tvém vězení"
 travel_events.2033.c: "Nechte [prisoner.GetFirstNameNoTooltip] běžet. Divočina se o zbytek postará."
 travel_events.2034.t: "Jak se do lesa volá..."
 travel_events.2034.desc_intro: "Nad naším táborem v [ROOT.Char.GetCurrentLocation.GetName] ([ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]) začíná svítat. Zívnu, lehce se protáhnu a převalím se na bok.\n\nRozespale vstanu a zamířím k otvoru stanu, abych se [Select_CString(ROOT.Char.IsFemale,'nadechla','nadechl')] čerstvého ranního vzduchu. Náhle se mi zježí chlupy na zátylku, "
 travel_events.2034.desc: "a koutkem oka zahlédnu [vengeful_prisoner.GetTitledFirstName] s taseným nožem.\n\n[vengeful_prisoner.GetFirstNameNoTooltip] se křivě ušklíbne. „[ROOT.Char.GetTitledFirstNameNoTooltip|U], [Select_CString(vengeful_prisoner.IsFemale,'ráda','rád')] vás zase vidím. Tentokrát budu lovit #EMP já#!.“ Na okamžik zůstanu ohromeně stát."
 travel_events.2034.desc_long_time: "a koutkem oka zahlédnu, že opodál stojí [vengeful_prisoner.GetWomanMan] s taseným nožem.\n\nPo tváři přeběhne křivý úsměv. „Vy si mě nepamatujete, že? Já si ale pamatuji #EMP vás#!, [ROOT.Char.GetTitledFirstNameNoTooltip], i ty vaše #EMP sadistické#! štvanice na lidi.“ Vybaví se mi matná vzpomínka. [Select_CString(vengeful_prisoner.IsFemale,'Uprchlá vězeňkyně','Uprchlý vězeň')] #EMP [vengeful_prisoner.GetTitledFirstName]#!...?"
 travel_events.2034.a: "Nemusíš to dělat!"
 travel_events.2034.a_overpowered_desc: "[vengeful_prisoner.GetShortUIName]: podaří se ti získat převahu"
 travel_events.2034.a_overpowered_effect: "[vengeful_prisoner.GetShortUIName]: rozhodneš o dalším osudu"
 travel_events.2034.a_death_desc: "$travel_events.2019.a_death.desc$"
 travel_events.2034.b: "#EMP [bodyguard.GetFirstNameNoTooltip]!!#!"
 travel_events.2034.b_overpowered_desc: "[bodyguard.GetShortUIName] přemůže [vengeful_prisoner.GetShortUIName]"
 travel_events.2034.b_death_tt: "Uprchlý vězeň zabit"
 travel_events.2034.b_death_desc: "[bodyguard.GetShortUIName] zabije [vengeful_prisoner.GetShortUIName]"
 travel_events.2035.t: "...tak se z lesa ozývá"
 travel_events.2035.desc: "Přede mnou klečí [vengeful_prisoner.GetTitledFirstName|U]. Pouta znemožňují jakýkoli pohyb. Po prvotním šoku se stan zaplnil mými strážemi k prasknutí.\n\nPohled tvrdošíjně upírá k zemi a odmítá se mi podívat do očí. Co teď? [vengeful_prisoner.Custom2('InsultNoun', ROOT.Char)|U] si přece zaslouží nějaký trest."
 travel_events.2035.a: "Zasloužíš si smrt."
 travel_events.2035.b: "Vrátíš se do vězení."
 travel_events.2035.c: "Nastavím i druhou tvář."
 travel_events.2036.t: "Konec?"
 travel_events.2036.desc_intro: "Vcházíme branou osady poblíž [ROOT.Char.GetCurrentLocation.GetName]. Zdejší lidé působí spokojeně, věnují se každodenním povinnostem a navzájem si pomáhají.\n\nJen tak si prohlížím vesničany, když mnou náhle projede záchvěv poznání. "
 travel_events.2036.desc_reformed: "U místní svatyně okamžitě poznám [Select_CString(peaceful_prisoner.IsFemale,'svou uprchlou vězeňkyni','svého uprchlého vězně')] [peaceful_prisoner.GetTitledFirstName], jak pokojně rozmlouvá s duchovním vůdcem.\n\nJaká ironie osudu! Přihlížím, jak [peaceful_prisoner.GetFirstNameNoTooltip] pomáhá duchovním s prostými pracemi a působí naprosto vyrovnaně."
 travel_events.2036.desc: "Okamžitě poznám [Select_CString(peaceful_prisoner.IsFemale,'svou uprchlou vězeňkyni','svého uprchlého vězně')] [peaceful_prisoner.GetTitledFirstName], jak se směje s jedním ze starších obyvatel vesnice a pomáhá mu.\n\n[peaceful_prisoner.GetFirstNameNoTooltip] tu podle všeho žije spokojeně."
 travel_events.2036.a: "Žít a nechat žít."
 travel_events.2036.a_criminal: "Asi se dokáže napravit i [Select_CString(peaceful_prisoner.IsFemale,'zločinka','zločinec')]."
 travel_events.2036.a_reformed: "Pokud se mě [peaceful_prisoner.GetFirstNameNoTooltip] znovu nepokusí zabít."
 travel_events.2036.b: "[peaceful_prisoner.GetTitledFirstNameNoTooltip|U] půjde #EMP se mnou#!."
 travel_events.2036.b_criminal: "Zločinná minulost se jen tak nesmaže."
 travel_events.2036.b_reformed: "#EMP ...ne#!. S vědomím, že je [peaceful_prisoner.GetFirstNameNoTooltip] na svobodě, se necítím bezpečně."
 travel_events.2037.t: "[Select_CString(2037_county_liege.IsFemale,'Lovkyně','Lovec')] lidí"
 travel_events.2037.desc: "V místním loveckém revíru narazíme na [2037_county_liege.GetTitledFirstName] s doprovodem.\n\nPo zdvořilém přivítání se na mě [2037_county_liege.GetFirstNameNoTooltip] šibalsky usměje: „Co takhle se ke mně přidat při tom nejušlechtilejším ze sportů, "
 travel_events.2037.desc_child: "drobečku?“ "
 travel_events.2037.desc_adult: "co říkáte?“ "
 travel_events.2037.desc_segway: "[2037_county_liege.GetFirstNameNoTooltip|U] kývne směrem k vězni v okovech na kraji lesa."
 travel_events.2037.desc_outro_segway_adult: "\n\nVelmi rychle mi dojde, o jakém #EMP sportu#! je řeč."
 travel_events.2037.desc_outro_child: "\n\nMoje zvědavost je rozhodně probuzena. Co by to mohlo být za hru...? Na honěnou?\n\nKdyž nabídku zvažuji, všimnu si [entourage_character.GetTitledFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_character'))]), jak se snaží upoutat mou pozornost a opatrně vrtí hlavou."
 travel_events.2037.desc_outro_manhunter: "S lovem lidí už mám zkušenosti, takže mě ten návrh docela láká."
 travel_events.2037.desc_outro: "#EMP Lov lidí.#! Je to odporné... nebo mě to snad láká?"
 travel_events.2037.a: "Zní to docela zajímavě..."
 travel_events.2037.a_child: "Budu hrát!"
 travel_events.2037.a_manhunted: "Můžeme začít."
 travel_events.2037.a_your_kill.desc: "[2037_manhunt_prisoner.GetShortUIName] padne při tvém lovu"
 travel_events.2037.a_their_kill.tt: "[2037_county_liege.GetShortUINameNoTooltip] získá úlovek"
 travel_events.2037.a_their_kill.desc: "[2037_county_liege.GetShortUIName] uloví a zabije postavu [2037_manhunt_prisoner.GetShortUIName]"
 travel_events.2037.b: "Pro [2037_manhunt_prisoner.GetFirstNameNoTooltip] by se mi našlo využití, jestli dovolíte."
 travel_events.2037.b_child: "Raději ať jde [2037_manhunt_prisoner.GetFirstNameNoTooltip] se mnou."
 travel_events.2037.c: "[Select_CString(2037_county_liege.IsFemale,'Zbláznila','Zbláznil')] ses?"
 travel_events.2037.c_child: "Ne. Tohle vypadá jako zlá hra."
 travel_events.2038.t: "Přesná muška"
 travel_events.2038.desc: "Krajina kolem [ROOT.Char.GetCurrentLocation.GetName] se hemží nejrůznější zvěří, a tak se s [entourage_character.GetTitledFirstName] shodneme, že by to bylo nádherné místo k lovu.\n\nNa pořádnou výpravu nemáme čas, ale při průjezdu krajinou zahlédnu na kraji lesa nádherného divokého králíka. Srst má zvláštní kresbu, a tak na zvíře upozorním i [entourage_character.GetFirstNameNoTooltip].\n\nJakmile [entourage_character.GetFirstNameNoTooltip] králíka spatří, usměje se. „Co říkáš na přátelskou sázku? Vyhraje ten, kdo toho krasavce zasáhne šípem.“"
 travel_events.2038.a: "Platí!"
 travel_events.2038.a_your_kill.tt: "Úlovek je tvůj"
 travel_events.2038.a_your_kill.desc: "Tvůj šíp dokonale probodne králíkovi srdce"
 travel_events.2038.a_their_kill.tt: "[entourage_character.GetShortUINameNoTooltip] získá úlovek"
 travel_events.2038.a_their_kill.desc: "[entourage_character.GetShortUIName] zabije králíka"
 lucky_rabbits_paw: "Šťastná králičí packa"
 lucky_rabbits_paw_desc: "Packa z jedinečného nádherného králíka uloveného při přátelském lovu s [entourage_character.GetTitledFirstName] v loveckém revíru poblíž [ROOT.Char.GetCurrentLocation.GetName]."
 travel_events.2038.b: "#EMP Ale ne#!, slunce mi svítí do očí!"
 travel_events.2038.c: "...pche, na tohle nemám čas."
 travel_events.2039.t: "Nejpřesnější muška"
 travel_events.2039.desc_child_won: "[entourage_character.GetTitledFirstName] se žene za králíkem s připraveným lukem a vůbec si nevšímá mého chabého předstírání se záměrně špatně vystřelenými šípy.\n\nPo chvíli zápolení s podrostem [entourage_character.GetTitledFirstNameNoTooltip] vítězoslavně vykřikne a vyrazí vpřed. Ze země zvedne tělo nádherného králíka, kterému z drobného trupu pevně trčí šíp. Zatleskám a [entourage_character.GetFirstNameNoTooltip] na mě vítězoslavně zazáří."
 travel_events.2039.desc_won: "Králíka máme na dohled a oba se k němu pomalu, ale odhodlaně přibližujeme. Míříme na jeho drobné tělo, zatímco nerušeně přežvykuje stéblo trávy. Napnu tětivu — pustím ji — a šíp se zabodne #EMP přímo do jeho těla#!.\n\nNáraz odmrští králíka o několik kroků a drobné tělo pak bezvládně dopadne na zem. Vítězoslavně zařvu a [entourage_character.GetTitledFirstName] se přidá k mému jásotu. „Pěkná rána!“ zavolá [entourage_character.GetFirstNameNoTooltip], zatímco běžím pro svou trofej."
 travel_events.2039.desc_lost: "[entourage_character.GetTitledFirstName] je několik kroků přede mnou, když se oba snažíme dostat ke králíkovi dostatečně blízko na výstřel. Nestačím držet tempo. [entourage_character.GetFirstNameNoTooltip] zamíří a jediným plynulým pohybem vyšle šíp přímo do drobného těla zvířete.\n\n[entourage_character.GetFirstNameNoTooltip] vítězoslavně vykřikne a oslavným gestem přivítá okamžik, kdy králík bezvládně klesne k zemi. Pak rychle vyrazí pro mrtvé zvíře. Uznale zatleskám."
 travel_events.2039.a: "Pěkná rána!"
 travel_events.2039.a_trinket.t: "Získaná cetka"
 travel_events.2039.a_win: "To byla zábava!"
 travel_events.2039.a_cynical: "Už bylo hůř."
 travel_events.2040.t: "Chvíle oddechu"
 travel_events.2040.intro: "Jednou večer sedíme u táborového ohně a já si uvědomím, že tu zůstáváme jen já a [2037_manhunt_prisoner.GetTitledFirstName]. V očích postavy [2037_manhunt_prisoner.GetFirstNameNoTooltip] se odrážejí mihotavé plameny a její pohled se upírá přímo na mě.\n\n"
 travel_events.2040.desc_child: "„Proč tě tam [Select_CString(2037_county_liege.IsFemale,'ta hrozná ženská','ten hrozný chlap')] [Select_CString(2037_county_liege.IsFemale,'chtěla','chtěl')] zabít?“ vyhrknu. [2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] na okamžik zaváhá, pak odvrátí pohled a odpoví:"
 travel_events.2040.desc: "Vlastně mě nikdy nenapadlo zeptat se, proč [2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] [Select_CString(2037_manhunt_prisoner.IsFemale,'skončila','skončil')] ve vězení. A jako by mi [Select_CString(2037_manhunt_prisoner.IsFemale,'četla','četl')] myšlenky, zamumlá:"
 travel_events.2040.outro: "\n\n„Bylo to, jako by to maso samo volalo po osvobození, chápete,“ pronese [2037_manhunt_prisoner.GetFirstNameNoTooltip] s ponurou nostalgií v hlase."
 travel_events.2040.a: "...to je velice filozofické."
 travel_events.2040.a_child: "I já mám na svědomí špatné věci."
 travel_events.2040.a.flavor: "Co může být nebezpečnější než šílený člověk?"
 travel_events.2040.a.flavor_child: "Mně přece [2037_manhunt_prisoner.GetFirstNameNoTooltip] neublíží... že ne?"
 travel_events.2040.a.tt: "[2037_manhunt_prisoner.GetShortUIName] bude zdarma sloužit jako [GetCourtPositionType('bodyguard_court_position').GetName()]"
 insane_bodyguard_salary_mod: "Šílenství v osobní stráži"
 travel_events.2040.b: "Kdo vraždí, patří za mříže."
 travel_events.2040.b_child: "Ubližovat lidem není správné."
 travel_events.2040.b.flavor: "Tak proto [Select_CString(2037_manhunt_prisoner.IsFemale,'byla','byl')] ve vězení..."
 travel_events.2040.b.flavor_child: "[2037_manhunt_prisoner.GetTitledFirstNameNoTooltip] mě děsí..."
 travel_events.2040.c: "#EMP Nemohu nechat [Select_CString(2037_manhunt_prisoner.IsFemale,'vražedkyni','vraha')] žít!#!"
 travel_events.2040.c.flavor: "Oko za oko."
 travel_events.2040.c_slay.t: "[Select_CString(2037_manhunt_prisoner.IsFemale,'Vražedkyně zabita','Vrah zabit')]"
 travel_events.2040.c_slay.desc: "Zabiješ [2037_manhunt_prisoner.GetShortUIName]"
 travel_events.2040.c_wounded.t: "$travel_events.2001.c_failure.tt$"
 travel_events.2040.c_wounded.desc: "Zabiješ [2037_manhunt_prisoner.GetShortUIName], ale utrpíš zranění"
 travel_events.2040.c_incapable.t: "Těžké zranění"
 travel_events.2040.c_incapable.desc: "V boji utrpíš těžké zranění a [2037_manhunt_prisoner.GetShortUIName] unikne"
 travel_events.2040.c_death.desc: "Zemřeš"
 travel_events_life_or_death.t: "Život, nebo smrt"
 travel_events.2100.t: "$travel_events_life_or_death.t$"
 travel_events.2100.desc_intro: "Cesta k [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] nám pěkně ubíhá a "
 travel_events.2100.desc_intro_trees: "ani husté lesy v [ROOT.Char.GetCurrentLocation.GetName] nejsou pro důvtip našeho místního průvodce překážkou.\n\nKdyž stromy prořídnou, zahlédnu před námi další skupinu cestovatelů."
 travel_events.2100.desc_intro_hills: "vítr nám přeje, když procházíme svahy v [ROOT.Char.GetCurrentLocation.GetName] ([ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]).\n\nPoměrně daleko před námi postupuje svahem další doprovod."
 travel_events.2100.desc_intro_flats: "roviny v [ROOT.Char.GetCurrentLocation.GetName] nám dovolují na chvíli polevit v ostražitosti.\n\nKdyž vystoupáme na vrchol údolí a pohlédneme dolů, spatřím další doprovod, který vytrvale pokračuje vpřed."
 travel_events.2100.desc_relation_in: " Když přimhouřím oči, poznám, kdo stojí v čele onoho doprovodu:"
 travel_events.2100.desc_negative_segway: "ten [murder_target.Custom('InsultAdjectiveGeneric')] člověk,"
 travel_events.2100.desc_positive_segway: "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('murder_target'))]"
 travel_events.2100.desc_relation_out: "[murder_target.GetTitledFirstName]."
 travel_events.2100.desc_no_relation_traveller: "Průvod jako by nikam nespěchal. Cestovatelé se kochají krajinou a prohlížejí si okolí."
 travel_events.2100.desc_no_relation_liege: "Průvod zjevně zkoumá okolí, jeho členové si dělají poznámky a rozmlouvají o krajině."
 travel_events.2100.desc_trees: "Něco ale není v pořádku. Když pozorně prohlížím okraj lesa, všimnu si také skupiny podezřelých zahalených postav, které zřejmě čekají, až se cestovatelé přiblíží."
 travel_events.2100.desc_hills: "Ale co jsou zač ti maskovaní jezdci s tasenými zbraněmi, kteří se blíží od západu...?"
 travel_events.2100.desc_flats: "Když skupinu dál pozoruji, všimnu si maskovaných jezdců se zdviženými zbraněmi, kteří se rychle blíží od východu!"
 travel_events.2100.desc_outro: "\n\nVypadá to jako léčka a "
 travel_events.2100.desc_outro_negative: "zaváhám. Mám skutečně zasahovat, když [murder_target.GetTitledFirstNameNoTooltip] zjevně kráčí vstříc jisté smrti?"
 travel_events.2100.desc_outro_positive: "není o čem přemýšlet. Musím zasáhnout a [murder_target.GetTitledFirstNameNoTooltip] musí přežít!"
 travel_events.2100.desc_outro_default: "zaváhám. Je skutečně mou povinností chránit ostatní cestovatele?"
 travel_events.2100.a: "Proč bych se do toho [Select_CString(ROOT.Char.IsFemale,'měla','měl')] #EMP já#! plést?"
 travel_events.2100.a_rival: "Jen ať se tak stane."
 travel_events.2100.a_nemesis: "#EMP Konečně!#!"
 travel_events.2100.a_stealthy_entourage.tt: "Skrytý doprovod"
 travel_events.2100.a_stealthy_entourage.desc: "Ty ani tvůj doprovod se neprozradíte"
 travel_events.2100.a_stealthy_outcome.tt: "Pokud [murder_target.GetShortUIName] přežije, nikdy se o tvé přítomnosti nedozví"
 travel_events.2100.a_nonstealthy_entourage.tt: "Odhalený doprovod"
 travel_events.2100.a_nonstealthy_entourage.desc: "[murder_target.GetShortUIName] si všimne tvé přítomnosti"
 travel_events.2100.a_nonstealthy_outcome.tt: "Pokud [murder_target.GetShortUIName] přežije, bude si to pamatovat"
 travel_events.2100.b: "Musím zasáhnout!"
 travel_events.2100.b.tt: "Zasáhneš proti pokusu o vraždu, jehož cílem je [murder_target.GetShortUIName]"
 travel_events.2100.b_outcome_tt: "[murder_target.GetShortUIName] si to bude pamatovat"
 travel_events.2101.t: "$travel_danger_prefix$ $travel_events_life_or_death.t$ - Vrazi!"
 travel_events.2101.desc: "Při obhlídce krajiny kolem [ROOT.Char.GetCurrentLocation.GetName] stojí slunce vysoko a vane lehký vánek. Rozhlížím se kolem a uvědomuji si, jak liduprázdně zdejší kraj působí, až na několik tažných ptáků vysoko na obloze.\n\nKdyž se skloním, abych si [Select_CString(ROOT.Char.IsFemale,'upravila','upravil')] botu, náhle sebou trhnu a narovnám se, protože zaslechneme blížící se jezdce. Postavy v pláštích se k nám ženou ze všech stran a než se naději, jeden z těch ničemů stojí přímo přede mnou, s tasenou čepelí se vrhá po mém hrdle!"
 travel_events.2101.a: "Jak se opovažuješ!"
 travel_events.2101.a_guards: "[bodyguard.GetNameNoTooltip]!!"
 travel_events.2101.a_assassin_death.tt: "Vrah zabit"
 travel_events.2101.a_bodyguard_kill.desc: "Vraha zabíjí [bodyguard.GetShortUIName]"
 travel_events.2101.a_bodyguard_wounded.tt: "Osobní strážce zraněn"
 travel_events.2101.a_bodyguard_wounded.desc: "[bodyguard.GetShortUIName] zabíjí vraha, ale utrpí zranění"
 travel_events.2101.a_assassin_death.desc: "Zabíjíš vraha"
 travel_events.2101.a_death.desc: "Umíráš"
 travel_events.2101.a_ruler_assassinated.tt: "[murder_target.GetShortUIName] [Select_CString(murder_target.IsFemale,'zemřela','zemřel')]"
 travel_events.2101.a_ruler_assassinated.desc: "[murder_target.GetShortUIName] [Select_CString(murder_target.IsFemale,'byla zavražděna','byl zavražděn')] během návštěvy v [visiting_ruler.MakeScope.Var('assassination_location').GetProvince.GetName]"
 travel_events.2101.a_ruler_survived.tt: "[murder_target.GetShortUIName] [Select_CString(murder_target.IsFemale,'přežila','přežil')]"
 travel_events.2101.a_ruler_survived.desc: "[murder_target.GetShortUIName] [Select_CString(murder_target.IsFemale,'přežila','přežil')] pokus o vraždu v [visiting_ruler.MakeScope.Var('assassination_location').GetProvince.GetName]"
 travel_events.2102.t: "$travel_danger_prefix$ $travel_events_life_or_death.t$ - Zrada"
 travel_events.2102.desc: "Boj zuří zdánlivě celé hodiny, ve skutečnosti však trvá jen pár minut. Vrahy se podaří odrazit a my vyvázneme bez úhony.\n\nProhledávám bojiště a na jednom z těl nacházím důkazy o vražedném spiknutí, které proti mně bylo zosnováno. S myslí stále napjatou k prasknutí si navíc všimnu praporu, který právě mizí z dohledu. [visiting_ruler.GetTitledFirstName]?"
 travel_events.2102.desc_negative: "\n\nSamozřejmě. Bylo by pošetilé čekat pomoc od někoho jako [visiting_ruler.GetFirstNameNoTooltip] a podobné sebranky. Ať je [Select_CString(visiting_ruler.IsFemale,'její','jeho')] hrob prokletý."
 travel_events.2102.desc_positive: "\n\nJak... to [visiting_ruler.GetFirstNameNoTooltip] [Select_CString(visiting_ruler.IsFemale,'mohla','mohl')] udělat? [Select_CString(ROOT.Char.IsFemale,'Čekala','Čekal')] jsem víc. Oči mám napůl zavřené a palčivá bolest téhle zrady mě raní víc než jakákoli čepel."
 travel_events.2102.desc_default: "\n\nVšechno to [Select_CString(visiting_ruler.IsFemale,'viděla','viděl')] a přesto mi v nouzi [Select_CString(visiting_ruler.IsFemale,'nepomohla','nepomohl')]? Taková okázalá nečinnost jasně ukazuje, na koho se lze spolehnout a na koho ne."
 travel_events.2102.a: "To skutečně vypovídá o [visiting_ruler.GetTitledFirstNamePossessiveNoTooltip] [visiting_ruler.Custom('InsultAdjectiveGeneric')] charakteru."
 travel_events.2103.t: "[murder_target.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
 travel_events.2103.desc_intro: "[murder_target.Custom2('NegativeSupplimentaryGreeting', ROOT.Char )]"
 travel_events.2103.desc_negative: "\n\n[Select_CString(murder_target.IsFemale,'Nečekala','Nečekal')] jsem od tebe nic jiného než touhu sledovat, jak ze mě v divočině [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l] uniká poslední dech.\n\nVskutku si vychutnám den, kdy jiskra života konečně opustí ty žumpy, kterým říkáš oči. Ani slovo „[visiting_ruler.Custom('InsultAdjectiveGeneric')]“ tě nevystihuje dost, [murder_target.Custom2('RelationToMe', SCOPE.sC( 'visiting_ruler' ))]."
 travel_events.2103.desc_positive: "\n\nJak jsi to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] udělat, když jsi pro mě [murder_target.Custom2('RelationToMe', SCOPE.sC( 'visiting_ruler' ))]? Jak jsi mě [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] nechat napospas smrti uprostřed [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l]? Tohle si budu pamatovat, o tom nepochybuj."
 travel_events.2103.desc_default: "\n\n[ROOT.Char.GetTitledFirstName], od každého dobrého a věřícího člověka očekávám obyčejnou lidskou slušnost a úctu k životu. To, že jsi mě uprostřed [ROOT.Var('assassination_location').GetProvince.GetName] [ROOT.Var('assassination_location').GetProvince.GetTerrain.GetNameNoTooltip|l] [Select_CString(ROOT.Char.IsFemale,'nechala','nechal')] napospas smrti, bohužel ukazuje, že [ROOT.Char.GetWomanMan] jako ty má k bohabojnosti daleko. Tohle si budu pamatovat."
 travel_events.2103.a: "No, nakonec přece jen #EMP [Select_CString(murder_target.IsFemale,'přežila','přežil')]#!."
 travel_events.2104.t: "$travel_danger_prefix$ $travel_events_life_or_death.t$ - Jak zachránit život"
 travel_events.2104.desc: "Se svým doprovodem vjíždím střemhlav mezi vrahy a dokonale je zaskočím. Jak neschopní musejí být, když si ani nehlídají záda?\n\nTěch pár, kteří se postaví na odpor, snadno posekáme a zbytek prchá do divočiny. Vzhlédnu a spatřím [murder_target.GetTitledFirstName], jak na mě zírá s očima dokořán a pootevřenými ústy.\n\nPak se konečně vzpamatuje. Výraz ve tváři se změní, ale stále v něm zůstává překvapení i vděk za můj zásah. Pokyne mi, ať přistoupím."
 travel_events.2104.a: "Dnešní dobrý skutek mám za sebou."
 travel_events.2104.a_shy: "Bylo to správné."
 travel_events.2105.t: "$travel_events.2104.t$"
 travel_events.2105.desc_intro: "Při obhlídce krajiny kolem [ROOT.Char.GetCurrentLocation.GetName] nás náhle přepadnou vrazi. A jako by se odnikud přímo mezi ně [Select_CString(visiting_ruler.IsFemale,'přiřítila','přiřítil')] [visiting_ruler.GetTitledFirstName] se svým doprovodem, s tasenými zbraněmi!\n\n"
 travel_events.2105.desc_negative: "S úžasem sleduji, jak [ROOT.Char.Custom2('GetRivalNemesis', SCOPE.sC('visiting_ruler'))] [visiting_ruler.GetFirstNameNoTooltip] seká vrahy nalevo napravo, zatímco zbytek prchá v hrůze. [visiting_ruler.GetFirstNameNoTooltip] se obloukem vrátí a zastaví přímo přede mnou. „Vypadá to, že se ti pomoc hodila,“ zazní zachmuřeně.\n\nVáhám. Sice mi [visiting_ruler.GetFirstNameNoTooltip] právě [Select_CString(visiting_ruler.IsFemale,'zachránila','zachránil')] kůži, ale jak mám po tomhle vůbec věřit právě [visiting_ruler.GetFirstNameNoTooltip]...? Nakonec neochotně přikývnu."
 travel_events.2105.desc_positive: "Oči mi září radostí, když sleduji, jak [Select_CString(visiting_ruler.IsFemale,'má zachránkyně','můj zachránce')] a [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_ruler'))] [visiting_ruler.GetFirstNameNoTooltip] zahání vrahy, pak širokým obloukem objede bojiště a vrátí se k mému doprovodu. „Jak se ti vede? Vždyť jsi pro mě [visiting_ruler.Custom2('RelationToMe', ROOT.Char)]!“ Přitom se na mě usmívá."
 travel_events.2105.desc_default: "Skutečnost, že někdo pomůže člověku, který je pro něj v podstatě naprostý cizinec, skutečně dokazuje, že existuje božský plán. Tím nám jistě [ROOT.Char.GetFaith.HighGodName] dává znamení, že naší cestě bylo požehnáno.\n\n[Select_CString(visiting_ruler.IsFemale,'Má zachránkyně','Můj zachránce')] se ke mně obloukem vrátí a zdvořile přikývne. Oplatím úsměvem a vypravím ze sebe: „Ať ti [ROOT.Char.GetFaith.HighGodName] žehná! Vskutku [visiting_ruler.GetLadyLord]!“"
 travel_events.2105.a: "Jsi vskutku vznešená duše!"
 travel_events.2105.a_cynical: "To gesto oceňuji."
 travel_events.2105.a.tt: "[visiting_ruler.GetShortUIName] ti [Select_CString(visiting_ruler.IsFemale,'přišla','přišel')] na pomoc!"
 travel_events.2107.t: "$travel_danger_prefix$ $travel_events_life_or_death.t$ – Bezpečné útočiště"
 travel_events.2107.desc_intro_plains: "Když slunce začíná zapadat, vyhlížím ze svých komnat v [holding_location.GetName] na [holding_location.GetTerrain.GetNameNoTooltip|l]. V dálce spatřím skupinu pocestných, kteří kráčejí travnatou krajinou rozprostírající se před nimi. "
 travel_events.2107.desc_intro_desert: "V písku za [holding_location.GetName] si pohrává mdlý vánek a zvedá drobné obláčky prachu, které víří na všechny strany. Když z pevnosti sleduji putující slunce, všimnu si skupiny pocestných, kteří odhodlaně kráčejí pískem. "
 travel_events.2107.desc_intro_wetlands: "Se západem slunce získávají [holding_location.GetTerrain.GetNameNoTooltip|l] za [holding_location.GetName] dnes večer zvláštní odstín. Z bezpečí své pevnosti sleduji proměnlivé barvy krajiny a blížící se soumrak, když v dálce zahlédnu skupinu pocestných, kteří se prodírají po rozbahněných cestách. "
 travel_events.2107.desc_intro_forest: "Se západem slunce se les kolem [holding_location.GetName] noří do šera. Z bezpečí své pevnosti sleduji večerní světlo a přitom si všimnu skupiny pocestných, kteří kráčejí podél okraje lesa. "
 travel_events.2107.desc_intro_mountains: "Když vyhlédnu ven do údolí pod [holding_location.GetName], ovanul mě svěží vzduch. Vychutnávám si příjemný chlad a pozoruji zdejší zvěř, když si všimnu skupiny pocestných, kteří si odhodlaně razí cestu údolím. "
 travel_events.2107.desc_intro_hills: "Mírné svahy kolem [holding_location.GetName] lahodí oku, když vyhlížím ven a dolů k malému jezírku pod kopci. Kolem něj právě prochází skupina pocestných, kteří pokračují dál za svým cílem. "
 travel_events.2107.desc_intro_jungle: "Džungle je jako obvykle horká a vlhká. Z bezpečí své pevnosti vzhlédnu ke korunám stromů nad [holding_location.GetName], abych [Select_CString(ROOT.Char.IsFemale,'zahlédla','zahlédl')] pestrobarevné ptáky hnízdící ve větvích. Koutkem oka přitom postřehnu skupinu pocestných, kteří se prodírají podrostem na severu. "
 travel_events.2107.desc_intro: "Obloha je téměř bez mráčku a já trávím odpoledne na okraji [holding_location.GetName]. Cestou zpět si všimnu skupiny pocestných, kteří procházejí sotva za hranicemi města. "
 travel_events.2107.desc_segway: "\n\nKdyž se zadívám pozorněji, zjistím, že v čele skupiny není nikdo jiný než [travelling_ruler.GetTitledFirstName] se svým doprovodem. Bez většího zájmu sleduji jejich postup, když mě náhle upoutá houf jezdců, kteří se k poklidné skupině rychle blíží.\n\nJakmile se přiblíží, začnou pozvedat zbraně. "
 travel_events.2107.desc_outro_negative: "Tohle bude zajímavé."
 travel_events.2107.desc_outro_positive: "Musím něco udělat!"
 travel_events.2107.desc_outro_family: "Krev není voda, jak se říká."
 travel_events.2107.desc_outro: "Pocestní budou co nevidět napadeni, a to na #EMP mé#! půdě."
 travel_events.2107.a: "Je naší povinností zasáhnout."
 travel_events.2107.a_christian: "Tak by se zachoval každý dobrý [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] věřící."
 travel_events.2107.a_outcome_tt: "[travelling_ruler.GetShortUIName] si to bude pamatovat"
 travel_events.2107.b: "Je to příliš nebezpečné."
 travel_events.2107.b_negative: "Dobře jim tak."
 travel_events.2107.b_outcome_tt: "Pokud [travelling_ruler.GetShortUIName] přežije, bude si to pamatovat"
 travel_events.2108.t: "$travel_danger_prefix$ $travel_events_life_or_death.t$ – Záchrana"
 travel_events.2108.desc_intro: "Když procházíme [holding_location.GetTerrain.GetNameNoTooltip|l] na okraji [holding_location.GetName], náhle se na nás vyřítí houf loupeživých jezdců lačnících po krvi. Od nedalekého sídla se však rychle blíží další skupina jezdců vedená [province_liege.GetTitledFirstName]!"
 travel_events.2108.desc_negative: "\n\nPřekvapení zatím skrývám. Že mě zachrání právě [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))], jsem rozhodně [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')]!"
 travel_events.2108.desc_positive: "\n\nSrdce mi pookřeje, když [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))] [province_liege.GetFirstNameNoTooltip] vede útok přímo do nechráněného týlu ničemů."
 travel_events.2108.desc: "\n\nNezištnost, kterou místní [province_liege.GetTitleAsNameNoTooltip] [Select_CString(province_liege.IsFemale,'projevila','projevil')], je pro mě velmi příjemným překvapením. Za to, že pomoc dorazila právě včas, si zasluhuje chválu [ROOT.Char.GetFaith.HighGodName]."
 travel_events.2108.desc_segway: "\n\n[province_liege.GetFirstNameNoTooltip] se ke mně vrací s vítězným úsměvem na tváři: "
 travel_events.2108.desc_outro_negative: "„[Select_CString(province_liege.IsFemale,'Nemohla','Nemohl')] jsem přece dovolit, aby si někdo jiný užil potěšení skoncovat s někým, kdo je [province_liege.Custom2('RelationToMe', ROOT.Char)], že?“ Na okamžik zaváhám a pak odseknu."
 travel_events.2108.desc_outro_positive: "„Nejsi [Select_CString(ROOT.Char.IsFemale,'zraněná?','zraněný?')] Až tenhle nepořádek uklidíme, přijmi prosím naše pohostinství v [holding_location.GetNameNoTooltip].“"
 travel_events.2108.desc_outro: "„Přijmi v [holding_location.GetNameNoTooltip] pohostinství, jaké nabízí [province_liege.GetCulture.GetNameNoTooltip] kultura!“"
 travel_events.2108.a: "Bude mi ctí!"
 travel_events.2108.a_negative: "Aspoň že jsem naživu."
 travel_events.2108.a.tt: "[province_liege.GetShortUIName] ti [Select_CString(province_liege.IsFemale,'přišla','přišel')] na pomoc!"
 travel_events.2109.t: "$travel_events.2108.t$"
 travel_events.2109.desc_intro: "Loupežníci ani netuší, co je zasáhlo. Vedu naše nejlepší bojovníky do bitvy za [holding_location.GetName] a prosekáváme se jejich řadami jako nůž máslem za horkého letního dne."
 travel_events.2109.desc_negative: "\n\n[travelling_ruler.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('travelling_ruler'))], jen nevěřícně zírá, jako po zásahu bleskem, a sleduje náš útok i úspěšnou obranu svého cestovního doprovodu."
 travel_events.2109.desc_positive: "\n\n[travelling_ruler.GetTitledFirstName] spolu s doprovodem nás hlasitě povzbuzuje, zatímco proti ničemům vedeme poslední protiútok."
 travel_events.2109.desc: "\n\n[travelling_ruler.GetTitledFirstName] nás pozorně sleduje, když s ničemy děláme krátký proces, a jakmile je zřejmé, že přicházíme v dobrém, napětí trochu opadne."
 travel_events.2109.desc_segway: "\n\nKdyž útočníky konečně zaženeme na útěk, vrátím se k [travelling_ruler.GetFirstNameNoTooltip], "
 travel_events.2109.desc_outro_negative: "kde už se zdá být vše opět v pořádku. Přátelsky mi kývne. „Nic, s čím bychom si neporadili, ale je příjemné, že jsme se nemuseli zbytečně namáhat,“ zazní přiznání."
 travel_events.2109.desc_outro_positive: "odkud se ke mně rychle blíží. „[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('province_liege'))]! Jen škoda, že se znovu setkáváme za tak chmurných okolností,“ zazní nadšeně."
 travel_events.2109.desc_outro: "kde už naše přítomnost očividně nevzbuzuje obavy. „[Select_CString(ROOT.Char.IsFemale,'Přítelkyně','Příteli')], děkuji, že jsi nám v nouzi [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] na pomoc,“ zazní s širokým úsměvem."
 travel_events.2109.a: "Zdejší kraj je opět bezpečný."
 travel_events.2109.a_negative: "Jen jsem [Select_CString(ROOT.Char.IsFemale,'nechtěla','nechtěl')] řešit ještě větší nepořádek."
 travel_events.2109.a_positive: "S potěšením, [province_liege.Custom2('RelationToMe', SCOPE.sC('travelling_ruler'))]!"
 travel_events.2109.a_hurt.tt: "Zranění: [ROOT.Char.Custom('KnightCultureNoTooltip')]"
 travel_events.2109.a_first_hurt.desc: "[first_potential_hurt_knight.GetShortUIName] [Select_CString(first_potential_hurt_knight.IsFemale,'utrpěla','utrpěl')] v bitvě zranění"
 travel_events.2109.a_second_hurt.desc: "[second_potential_hurt_knight.GetShortUIName] [Select_CString(second_potential_hurt_knight.IsFemale,'utrpěla','utrpěl')] v bitvě zranění"
 travel_events.2109.a_third_hurt.desc: "[third_potential_hurt_knight.GetShortUIName] [Select_CString(third_potential_hurt_knight.IsFemale,'utrpěla','utrpěl')] v bitvě zranění"
 travel_events.2109.a_none_hurt.tt: "Bez úhony"
 travel_events.2109.a_none_hurt.desc: "V řadách [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] nedošlo v bitvě k žádnému zranění"
 travel_events.2110.t: "$travel_danger_prefix$ $travel_events_life_or_death.t$ – Bez pomoci"
 travel_events.2110.desc: "Když procházíme [holding_location.GetTerrain.GetNameNoTooltip|l] na okraji [holding_location.GetName], náhle se na nás vyřítí houf loupeživých jezdců lačnících po krvi. Jsme tak blízko sídla, [province_liege.GetTitledFirstName] nám přece určitě pošle pomoc?\n\nČas se vleče a ničemové nás pronásledují, zatímco se co nejdéle snažíme vyhnout boji. Nakonec je až bolestně jasné, že žádná pomoc nepřijde."
 travel_events.2110.desc_negative: "Nevím, co jsem od někoho jako [province_liege.GetFirstNameNoTooltip], [travelling_ruler.Custom2('InsultNoun', ROOT.Char)], vlastně [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')]. Ale i tohle je pod veškerou úroveň."
 travel_events.2110.desc_positive: "Když mi dojde, jaké zrady se na mně právě [province_liege.GetTitledFirstNameNoTooltip] [Select_CString(province_liege.IsFemale,'dopustila','dopustil')], sevře mě ostrá bolest na hrudi."
 travel_events.2110.desc_neutral: "Jak může panovník dopustit, aby se po jeho území proháněli takoví zlovolní jezdci?"
 travel_events.2110.desc_outro: "\n\nPo bok se mi přiřítí [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] [knight_to_sacrifice.GetTitledFirstName] s vážným výrazem v očích. Oba víme, jaký manévr jsme už dříve nacvičovali."
 travel_events.2110.a: "Budeme stát při sobě."
 travel_events.2110.a_unscathed.tt: "Bez úhony"
 travel_events.2110.a_unscathed.desc: "Přežiješ bitvu bez úhony"
 travel_events.2110.a_injured.tt: "Zranění"
 travel_events.2110.a_injured.desc: "Přežiješ bitvu, ale utrpíš zranění"
 travel_events.2110.a_severely_injured.tt: "Těžké zranění"
 travel_events.2110.a_severely_injured.desc: "V bitvě utrpíš těžké zranění"
 travel_events.2110.a_death: "Padneš v bitvě"
 travel_events.2110.b: "[knight_to_sacrifice.GetFirstNameNoTooltip], víš, co máš dělat."
 travel_events.2110.b_tt: "[knight_to_sacrifice.GetShortUIName] zůstane pozadu, aby odlákal útok"
 travel_events.2111.t: "$travel_danger_prefix$ $travel_events.2110.t$"
 travel_events.2111.desc_sacrifice: "Slunce zapadá nad [holding_location.GetTerrain.GetNameNoTooltip|l] a já sleduji scénu přede mnou. Pokud jsem [Select_CString(ROOT.Char.IsFemale,'čekala','čekal')] otevřenou bitvu, [Select_CString(ROOT.Char.IsFemale,'mýlila','mýlil')] jsem se.\n\nZdá se, že [travelling_ruler.GetTitledFirstName] [Select_CString(travelling_ruler.IsFemale,'nařídila','nařídil')] použít návnadu a ustoupit. [Select_CString(knight_to_sacrifice.IsFemale,'Jedna','Jeden')] z [travelling_ruler.Custom('KnightCulturePluralNoTooltipLowercase')] tedy zůstává pozadu, aby [Select_CString(knight_to_sacrifice.IsFemale,'zachránila','zachránil')] zbytek skupiny, zatímco se pocestní znovu seřadili a prchají k opačnému okraji města.\n\nZdá se, že lest funguje. Jezdci si prchající skupiny nevšímají a místo toho se vrhnou na [Select_CString(knight_to_sacrifice.IsFemale,'osamělou bojovnici','osamělého bojovníka')], až mi [knight_to_sacrifice.GetFirstNameNoTooltip] zcela zmizí z očí. Snad byl konec rychlý."
 travel_events.2111.desc_unscathed: "Když slunce mizí za obzorem a barví nebe do ruda, bitva přede mnou stejnou barvou potřísní zem. Zdá se však, že rudne pouze krví loupežníků.\n\nPocestní tváří v tvář náhlému útoku prokazují překvapivou udatnost a bojují zuby nehty, až nakonec ničemy zaženou na útěk. Ti odhazují zbraně a kvapně prchají stejnou cestou, kterou přijeli.\n\n[travelling_ruler.GetTitledFirstName] vzdorovitě gestikuluje směrem k mému sídlu a já v tichém úžasu pozvednu obočí. Tohle jsem #EMP opravdu#! [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')]."
 travel_events.2111.desc_survived: "Když slunce zapadá nad [holding_location.GetTerrain.GetNameNoTooltip|l], obě skupiny se střetnou ve změti zbraní a bolesti. Sleduji, jak prvotní šok pocestných odeznívá, znovu se vzchopí a začnou ozbrojené jezdce zatlačovat zpět.\n\nDo čela protiútoku se staví [travelling_ruler.GetTitledFirstName] a vrhá se rychle a smrtelně na špinavé loupežníky. Jednomu z ničemů se však podaří [travelling_ruler.GetFirstNameNoTooltip] zasadit poměrně těžkou ránu, za což mu vzápětí jeden z [travelling_ruler.Custom('KnightCulturePluralNoTooltipLowercase')] oplatí stejnou mincí.\n\nJezdci, kteří ještě dýchají a dokážou se hýbat, prchají stejně rychle a náhle, jako se objevili. Zůstávají po nich těla a mrtvá zvířata, ale překvapivě početná skupina živých pocestných."
 travel_events.2111.desc_died: "Když slunce mizí za obzorem a barví nebe do ruda, bitva přede mnou stejnou barvou potřísní zem. Dychtivě ji sleduji a snažím se rozeznat, která strana získává navrch.\n\nOdpověď brzy dostanu, když jeden obzvlášť mohutný jezdec vítězoslavně zařve a pozvedne ruce k nebi. V jedné drží čepel, v druhé... hlavu [travelling_ruler.GetTitledFirstName]."
 travel_events.2111.desc_negative_outro: "\n\nS úlevou si oddechnu. Konečně mi ten [travelling_ruler.Custom2('InsultNoun', ROOT.Char)] přestal být trnem v oku."
 travel_events.2111.desc_positive_outro: "\n\nNěkolikrát zamrkám a stále úplně nechápu, co se právě stalo. Ano... asi takhle měl přijít konec."
 travel_events.2111.desc_outro: "\n\nPo tom, co jsem právě [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] zavraždit [travelling_ruler.GetTitledFirstNameNoTooltip], cítím překvapivé prázdno. S těmi jezdci bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] něco udělat."
 travel_events.2111.a: "Zajímavá taktika."
 travel_events.2111.a_compassionate: "Co jsem to [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]..."
 travel_events.2111.a_sadist: "To byla podívaná!"
 travel_events.2111.a_dead: "Dříve či později k tomu dojít muselo."
