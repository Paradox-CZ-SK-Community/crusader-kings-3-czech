l_polish:
 travel_events_fp3.0010.t: "Dohasínající uhlíky"
 travel_events_fp3.0010.desc.intro: "Když se naše družina prodírá náhlou bouří, spatřím skupinu ozbrojených mágů kráčejících opačným směrem. Nesou mezi sebou nosítka s košem na oheň, v němž dohasínají žhavé uhlíky. Vítr a déšť bičují posvátné plameny a hrozí, že je zcela uhasí.\n\nAčkoli jim unavené ruce ostražitě spočívají u zbraní, kněží na nás volají s nadějí, že jim pomůžeme jejich posvátné uhlíky před bouří ochránit."
 travel_events_fp3.0010.a: "Obkličte je a uhaste jejich kacířství!"
 travel_events_fp3.0010.a.success: "Uhasím jejich plamen"
 travel_events_fp3.0010.a.failure: "Mágové nás odrazí"
 travel_events_fp3.0010.a.lightning.desc: "Boj v bouři může být nebezpečný a nepředvídatelný"
 travel_events_fp3.0010.b: "Zabavte ten koš! V mých rukou bude oheň v bezpečí!"
 travel_events_fp3.0010.b.success: "Zabavíš koš s posvátným ohněm"
 travel_events_fp3.0010.b.failure: "Mágové nás odrazí."
 travel_events_fp3.0010.c: "Můžete se ukrýt s námi!"
 travel_events_fp3.0010.c.success: "Uhlíky přečkají bouři"
 travel_events_fp3.0010.c.success.desc: "Získáš vděčnost mágů"
 travel_events_fp3.0010.c.flavor: "Pokud poutníky ochráníme, odvděčí se nám"
 travel_events_fp3.0010.c.failure: "Oheň zhasne"
 travel_events_fp3.0010.d: "[ROOT.Char.GetFaith.HighGodName] nás touto bouří soudí."
 travel_events_fp3.0010.d.flavor: "Necháš cestovatele spoléhat na jejich víru"
 travel_events_fp3.0011.t: "Dohasínající uhlíky"
 travel_events_fp3.0011.desc.intro: "Mágové bojují statečně. Snaží se chránit své posvátné uhlíky a zároveň držet mě i mé muže na odstup. Jakmile však zahlédnu příležitost, vykopnu jim nosítka z rukou. Koš se skutálí do bláta a uhlíky se syčením dohasnou.\n\nPoraženým kněžím se vysmíváme a spíláme jim, když naše jásání náhle přeruší oslepující světlo a ohlušující rachot. Před očima mi stále plane obraz blesku. Když se omámeně sbírám ze země, spatřím, jak znovu zažehnutý posvátný oheň šlehá jasným plamenem. Moji muži už v extatické panice prchají."
 travel_events_fp3.0011.a: "Všichni musí poznat, že [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] vládne nezpochybnitelnou mocí!"
 travel_events_fp3.0011.b: "Tento nevyvratitelný zázrak si budu tajně nosit v srdci."
 travel_events_fp3.0011.c: "To je pouhá náhoda!"
 travel_events_fp3.0012.t: "Dohasínající uhlíky"
 travel_events_fp3.0012.desc.intro: "Společně s mágy nacházíme dostatečný úkryt v polorozpadlé stavbě. Vyždímáme promočené šaty a ujistíme se, že koš i jeho uhlíky přečkaly bouři bez úhony. Napětí konečně poleví. Vypadá to, že bouři přečkáme společně.\n\nKněze vede [fp3_zoroastrian_armed_pilgrim.GetName]. Znalostí má na rozdávání a stejně tak příběhů."
 travel_events_fp3.0012.a: "Až budou odpočívat, vezmu si jejich drahocenné uhlíky..."
 travel_events_fp3.0012.a.success: "Uhlíky se nám podaří ukrást během jejich spánku"
 travel_events_fp3.0012.a.failure: "Mágové tě přistihnou při krádeži a odhalí tvé zlodějství"
 travel_events_fp3.0012.b: "Tvá moudrost by mi mohla dobře posloužit."
 travel_events_fp3.0012.c: "Šťastnou cestu."
 zoroastrian_brazier_name: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] koš s posvátným ohněm"
 zoroastrian_brazier_desc: "$zoroastrian_brazier_name$ zachráněný před neschopnými mágy uprostřed zuřivé bouře. Uhlíky z onoho dne v něm stále žhnou."
 travel_events_fp3.0020.t: "Neobvyklé setkání"
 travel_events_fp3.0020.desc.intro: "Abychom unikli spalujícímu polednímu slunci, utábořili jsme se v podivné a velmi vlhké jeskyni.\n\n„Slyšíte to, [ROOT.GetCharacter.GetTitleTierName|U]?“ [travel_leader.GetName] se v našem temném úkrytu očividně necítí dobře.\n\nKdyž se otočím, náhle přede mnou stojí [fp3_young_rascal.Custom('GirlBoy')] — dítě, které muselo nějak nepozorovaně proklouznout přímo kolem [travel_leader.GetNameNoTooltip]. Polekané dítě okamžitě zmizí hlouběji v jeskyních."
 travel_events_fp3.0020.a: "Za tím dítětem!"
 travel_events.fp3.0020.a.flavor: "Průzkum jeskyní přinese buď nebezpečí, nebo odhalí jejich tajemství"
 travel_events_fp3.0020.a.success: "Najdeš dítě"
 travel_events_fp3.0020.a.success.tooltip: "Vydáš se za dítětem a odhalíš tajemství podzemí"
 travel_events_fp3.0020.b: "Musíme toto místo opustit."
 travel_events.fp3.0020.b.flavor: "[travel_leader.GetNameNoTooltip] naléhá, abychom tyto jeskyně opustili. Nejsou bezpečné"
 travel_events_fp3.0020.b.tt: "Tvá cesta pokračuje."
 travel_events_fp3.0020.a.failure.title: "V temných chodbách upadneš a zraníš se"
 travel_events_fp3.0020.a.failure: "Dítěti ztratíš stopu a nakonec celé dny bloudíš chodbami"
 travel_events_fp3.0021.t: "[ROOT.Char.GetCurrentLocation.GetCounty.GetName]: Qanáty"
 travel_events_fp3.0021.desc: "Sestupujeme stále hlouběji pod zem. Zářivou krajinu zalitou sluncem necháváme za sebou a noříme se do čím dál vlhčích a temnějších chodeb.\n\nKonečně se přede mnou znovu objeví [fp3_young_rascal.Custom('GirlBoy')], ale mou pozornost okamžitě upoutá nádherný výjev. Kam až oko dohlédne, táhne se prastarý systém podzemních kanálů.\n\n„Vítej v mém vlastním paláci! Ty jsi [ROOT.Char.GetTitleAsName], ale ten můj nejspíš zastíní i tvůj.“ Dítě ke mně vzdorovitě vzhlédne, očividně rozmrzelé, že se mi podařilo dojít až sem."
 travel_events_fp3.0021.a: "Ponořme se pro poklad ukrytý pod hladinou."
 travel_events_fp3.0021.a.success.t: "Úlovek: [newly_created_artifact.GetName]"
 travel_events_fp3.0021.a.success.desc: "Najdeš prastarý poklad"
 travel_events_fp3.0021.a.failure.t: "Úlovek? Jen zimnice"
 travel_events_fp3.0021.a.failure.desc: "Málem se utopíš ve stojaté vodě"
 travel_events_fp3.0021.a.artifact: "Najdu starý artefakt"
 travel_events_fp3.0021.b: "Studiem této stavby se mohu něčemu přiučit."
 travel_events_fp3.0021.b.success.t: "Odhalení tajemství zavlažování"
 travel_events_fp3.0021.b.success.desc: "Studuješ qanát"
 travel_events_fp3.0021.b.failure.t: "Řešení ti uniká"
 travel_events_fp3.0021.b.failure.desc: "Tohle je nad tvé síly"
 travel_events_fp3.0021.c: "[fp3_young_rascal.Custom('GirlBoy')|U] se musí naučit respektovat své nadřízené!"
 travel_events_fp3.0030.t: "Hostina pro sokoly"
 travel_events_fp3.0030.desc.intro: "Nad hlavou krouží draví ptáci a na sluncem spálenou krajinu vrhají zlověstné stíny. Jak stoupám po úbočí hrozivě se tyčícího kopce, mé smysly přemůže zápach hnijícího masa.\n\nNa skalách spatřím pečlivě rozložená těla. Supi a sokoli z nich rvou maso a ze zobáků jim visí krvavé cáry. Na nebeský pohřeb dohlíží muž v prostém oděvu. Pokyne mi.\n\n„Prosím, odejděte. I když jste [ROOT.Char.GetTitleAsNameNoTooltip], toto místo je vyhrazeno pouze Nusessalarům...“"
 travel_events_fp3.0030.a: "Tohle je barbarství. Ta těla pohřbíme!"
 every_faith_vassal: "Každý [local_faith.GetAdjective] vazal"
 travel_events_fp3.0030.b: "Doufám, že i já jednou odejdu takto a Nasu opustí mé tělo..."
 travel_events_fp3.0030.c: "Představit si, jak mě k nebi vynesou tato mocná křídla..."
 travel_events_fp3.0030.d: "Smrt si přijde pro nás všechny."
 travel_events_fp3.0030.d_flavor: "Strávíš nějaký čas rozjímáním o smrti a poté místo opustíš"
 travel_events_fp3.0030.e: "Najděte mi nejmladšího sokola. Vycvičím ho k lepším účelům."
 travel_events_fp3.0030.e.tooltip: "Dostaneš příležitost ptáka vycvičit."
 travel_events_fp3.0031.t: "Hostina pro sokoly"
 travel_events_fp3.0031.desc.intro: "Toho sokola, kterého jsem našel u nebeského pohřebiště, hodlám vycvičit. Sejdeme se proto na poli s malým doprovodem. Je tu i [falcon_victim.GetName] ([ROOT.Char.Custom2('RelationToMe', falcon_victim)]) se zajatým zajícem připraveným k vypuštění. Mladý sokol s nasazenou čepičkou netrpělivě čeká na mé rukavici.\n\n[falcon_victim.GetNameNoTooltip] vypustí kořist a zajíc vyrazí přes otevřené pole. Sundám sokolovi čepičku a ten okamžitě vzlétne. Místo střemhlavého útoku na kořist se však vrhne přímo k hlavě [falcon_victim.GetNameNoTooltip]. Než ho někdo stačí odtrhnout, sokol dál kouše a drápe a zanechá po sobě krvavé šrámy."
 travel_events_fp3.0031.a: "Tohle chování dokážu napravit."
 travel_events_fp3.0031.a.success.desc: "Výcvik se ujme"
 travel_events_fp3.0031.a.success.t: "Z ptáka z věže ticha je lovecký sokol"
 travel_events_fp3.0031.a.failure.desc: "Pták zůstane zuřivý"
 travel_events_fp3.0031.a.failure.t: "Sokol nepřestává prahnout po lidském mase"
 travel_events_fp3.0031.b: "Tyto sklony budu podporovat..."
 travel_events_fp3.0031.c: "Té bestie se raději zbavím."
 travel_events_fp3.0031.d: "Každý člověk z [ROOT.Char.GetCulture.GetName] kultury ví, jak zkrotit i toho nejdivočejšího ptáka."
 travel_events_fp3.0031.d.tt: "Tato možnost je dostupná, protože má tvá kultura [Concept('culture_tradition','kulturní tradici')|E] s názvem $tradition_ep2_avid_falconers_name$"
 travel_events_fp3.0040.t: "Kobylí mléko"
 travel_events_fp3.0040.desc.intro: "Cestou míjíme početný tábor turkických cestovatelů. Skupina nás přátelskými gesty zve mezi sebe. [Select_CString(fp3_turkic_traveler.IsFemale,'Drsně vyhlížející žena míchá','Drsně vyhlížející muž míchá')] v kotlíku hustou bílou tekutinu. Nalije trochu do malé misky a podá mi ji.\n\n„#EMP Kumis!#! Pro střeva není nic lepšího!“\n\nDalší dvojice si mě měří pohledem a šeptá si ve vlastním jazyce, jen dost hlasitě na to, abych jejich slova zaslechl."
 travel_events_fp3.0040.desc.intro.a: "\n„Proč plýtvat dobrým #EMP kumisem#! na někoho, koho ani neznáme?“\n\nOčividně si myslí, že jejich řeči nerozumím, ale alespoň mi nepodávají jed."
 travel_events_fp3.0040.desc.intro.b: "\n„Z kořisti si vybírám první! Ty pěkné boty mi budou slušet.“\n\nOčividně si myslí, že jejich řeči nerozumím. Jejich smůla — teď už znám jejich nekalé úmysly."
 travel_events_fp3.0040.desc.intro.c: "Jejich podivné řeči ale nerozumím. Snad to s námi myslí dobře..."
 travel_events_fp3.0040.a: "Poděkuji jim v jejich vlastním jazyce. Na zdraví!"
 travel_events_fp3.0040.ab.tt: "Tuto možnost máš díky znalosti místního jazyka ([fp3_turkic_traveler.GetCulture.GetLanguage.GetNameNoTooltip])"
 travel_events_fp3.0040.b: "V jejich vlastním jazyce nařídím jejich zatčení."
 travel_events_fp3.0040.c: "Není důvod být tak nedůvěřivý."
 travel_events_fp3.0040.c.success: "Kumis je lahodný"
 travel_events_fp3.0040.c.success.t: "Kumis byl lahodný!"
 travel_events_fp3.0040.c.failure: "Omámí tě a okradou"
 travel_events_fp3.0040.c.failure.t: "Omámili mě a okradli!"
 travel_events_fp3.0040.d: "Kobylí mléko? To je odporné."
 travel_events_fp3.0040.e: "[Select_CString(fp3_turkic_traveler.IsFemale,'Ať nás tato žena zasvětí do svých zvyků.','Ať nás tento muž zasvětí do svých zvyků.')]"
 travel_events_fp3.0050.t: "Vykradači hrobek"
 travel_events_fp3.0050.desc.intro: "Za zatáčkou narazíme na skupinu lidí pokrytých prachem, kteří právě vycházejí z místa, jež kdysi muselo být honosnou hrobkou. Vlečou jutové pytle, které při každém kroku cinkají a řinčí pod tíhou cetek vyhrabaných ze starobylé stavby.\n\n„Časy jsou zlé! Vy jste přece [ROOT.Char.GetTitleAsNameNoTooltip], jistě chápete, že naše rodiny musí jíst. A nikomu ze živých přece neubližujeme.“"
 travel_events_fp3.0050.a: "Kdo pohrdá minulostí, nemá budoucnost."
 travel_events_fp3.0050.b: "I [ROOT.Char.GetTitleAsNameNoTooltip] si zaslouží svůj podíl!"
 travel_events_fp3.0050.b.entourage: "Při prohlížení kořisti ti pomáhá [entourage_helper.GetName]."
 travel_events_fp3.0050.b.success.desc: "Vybereš si vzácný poklad"
 travel_events_fp3.0050.b.success.tooltip: "Získáš starobylý poklad"
 travel_events_fp3.0050.b.failure.desc: "Nic zvláštního tě nezaujme"
 travel_events_fp3.0050.b.failure.t: "Pár cenných cetek"
 travel_events_fp3.0050.c: "Na sedláky nemám čas."
