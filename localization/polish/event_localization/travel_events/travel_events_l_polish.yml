l_polish:
 travel_event_prefix: "Cestování:"
 travel_events.0010.t: "Konec cesty"
 travel_events.0010.intro: "Sedím u stolu a chystám se posnídat, ale všechen hlad mě přešel. Něco není v pořádku a jistotu získám, když vidím, jak ke mně zachmuřeně přichází [messenger.GetFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe',messenger)].\n\n„[ROOT.Char.GetTitleAsNameNoTooltip], v noci dorazil posel se strašlivou zprávou,“ pronese tiše.\n\n„Obávám se... Obávám se, že [predecessor.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe',predecessor)], [predecessor.GetDeathReason]. "
 travel_events.0010.to_activity: "K úmrtí došlo v [predecessor_location.GetName] cestou do [travel_destination.GetNameNoTooltip]. "
 travel_events.0010.at_destination: "K úmrtí došlo v [predecessor_location.GetName]. "
 travel_events.0010.from_activity: "K úmrtí došlo v provincii [predecessor_location.GetName] cestou domů po návštěvě [travel_destination.GetNameNoTooltip]. "
 travel_events.0010.desc: "$travel_events.0011.desc$“"
 travel_events.0010.a: "[Select_CString(predecessor.IsFemale,'Nezasloužila','Nezasloužil')] si zemřít tak daleko od domova..."
 travel_events.0011.desc_opening: "[messenger.Custom2('AppropriateGreeting', ROOT.Char)]"
 travel_events.0011.intro: "Je mi líto, že ti musím psát s tak závažnou zprávou, ale právě jsme se dozvěděli, že [predecessor.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('RelationToMe',predecessor)], [predecessor.GetDeathReason].\n\n"
 travel_events.0011.desc: "Přijmi mou upřímnou soustrast, [ROOT.Char.Custom('FormOfAddressForLiege')]."
 travel_events.0050.t: "Volání dálek"
 travel_events.0050.landed: "Je to [ROOT.Char.Custom('GetPeriodOfTimeWord')], co jsem [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')] domov, a od té doby"
 travel_events.0050.adventurer: "Je to [ROOT.Char.Custom('GetPeriodOfTimeWord')], co jsem [Select_CString(ROOT.Char.IsFemale,'vyrazila','vyrazil')] z [ROOT.Char.GetTravelPlan.GetData.GetDepartureLocation.GetName], a od té doby"
 travel_events.0050.desc: " jsem [Select_CString(ROOT.Char.IsFemale,'zažila','zažil')] chvíle dobré i zlé ―  vítr ve vlasech mi přinášel radost, kamínky v botách zase trápení.\n\nTolik míst a věcí jsem ještě [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')]. Tam venku, na širé cestě, mě alespoň na chvíli nesvazuje [ROOT.Char.Custom('GetCourt')].\n\nCesty jsou plné poutníků a pocestných; možná právě mezi #EMP nimi#! najdu klid.\n\n"
 travel_events.0050.a: "Tady venku jsem skutečně [Select_CString(ROOT.Char.IsFemale,'svobodná','svobodný')]."
 travel_events.1000.t: "Bosá bída"
 travel_events.1000.desc: "Když průvod dorazí k místu jménem [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], obklopenému krajinou typu [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l], všimnu si, že u cesty kráčí [Select_CString(shoeless_peasant.IsFemale,'bosá venkovanka','bosý venkovan')]. [Select_CString(shoeless_peasant.IsFemale,'Její','Jeho')] chodidla jsou zkrvavená a oteklá: na cestě musí být už velmi dlouho.\n\nKdyž se míjíme, zadívám se [Select_CString(shoeless_peasant.IsFemale,'jí','mu')] do tváře, do těch smutných, tak smutných očí a bolestivé grimasy. Možná bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] nějak pomoci? "
 travel_events.1000.a: "Sežeňte [Select_CString(shoeless_peasant.IsFemale,'jí','mu')] boty!"
 travel_events.1000.b: "Třeba by se k nám [Select_CString(shoeless_peasant.IsFemale,'chtěla','chtěl')] přidat?"
 travel_events.1000.c: "To přece není můj problém, ne?"
 travel_events.1001.title: "[Select_CString(shoeless_peasant.IsFemale,'Šlechtična','Šlechtic')] v přestrojení!"
 travel_events.1001.desc: "S botami na mozolnatých nohou se na mě [Select_CString(shoeless_peasant.IsFemale,'venkovanka','venkovan')] vědoucně usměje a srovná se mnou krok.\n\n„Jste [Select_CString(ROOT.Char.IsFemale,'dobrá a laskavá','dobrý a laskavý')] [ROOT.Char.GetTitleAsNameNoTooltip|U] a taková laskavost nezůstane bez odměny! Jsem [shoeless_peasant.GetName] z rodu [shoeless_peasant.GetDynastyName] a dobré srdce nikdy nenechám bez odměny.“"
 travel_events.1001.desc.outro.poet: "\n\nZdá se, že [Select_CString(shoeless_peasant.IsFemale,'tato žena','tento muž')] vůbec není [Select_CString(shoeless_peasant.IsFemale,'venkovanka','venkovan')], ale [Select_CString(shoeless_peasant.IsFemale,'proslulá básnířka','proslulý básník')]!"
 travel_events.1001.desc.outro: "\n\nZdá se, že [Select_CString(shoeless_peasant.IsFemale,'tato žena','tento muž')] vůbec není [Select_CString(shoeless_peasant.IsFemale,'venkovanka','venkovan')], ale nesmírně [Select_CString(shoeless_peasant.IsFemale,'bohatá šlechtična','bohatý šlechtic')]!"
 travel_events.1001.a: "Přijímám s vděkem."
 travel_events.1001.c: "Ať nás odteď pojí přátelství!"
 travel_events.1002.title: "$travel_events.1001.title$"
 travel_events.1002.desc: "Když projíždíme kolem, [Select_CString(shoeless_peasant.IsFemale,'venkovanka','venkovan')] mě špinavýma rukama popadne za oděv a upřeně se mi zadívá do očí.\n\n„Takhle se [ROOT.Char.GetTitleAsNameNoTooltip|U] přece nechová, že? Kdybys [Select_CString(ROOT.Char.IsFemale,'věděla, kdo jsem, nenechala','věděl, kdo jsem, nenechal')] bys mě takhle se trmácet!“\n\nNakonec vyjde najevo, že jde o [Select_CString(shoeless_peasant.IsFemale,'šlechtičnu','šlechtice')] z rodu [shoeless_peasant.GetDynastyName], a zdá se, že mnou teď hluboce pohrdá."
 travel_events.1002.a: "Jak jsem to [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] vědět?"
 friend_showed_charity: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'prokázala','prokázal')] [TARGET_CHARACTER.GetShortUIName] velkou laskavost"
 friend_showed_charity_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'prokázala','prokázal')] [CHARACTER.GetShortUIName] velkou laskavost"
 rival_ungenerous: "[CHARACTER.GetShortUIName|U] [Select_CString(CHARACTER.IsFemale,'odmítla','odmítl')] [TARGET_CHARACTER.GetShortUIName] pomoci v nouzi"
 rival_ungenerous_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] [Select_CString(TARGET_CHARACTER.IsFemale,'odmítla','odmítl')] [CHARACTER.GetShortUIName] pomoci v nouzi"
 travel_events.1003.t: "$travel_danger_prefix$ Výběrčí mýtného"
 travel_events.1003.desc: "Na cestě jsme se zdrželi o něco déle, než bylo záhodno, a slunce už začíná klesat za obzor. Z okolní krajiny se vynořují obrysy, které se postupně slévají v nevraživě vyhlížející ozbrojené postavy. \n\n „Za tuhle cestu se platí mýto. Tak plať!“ zahřímá největší a upřímně řečeno i nejošklivější z celé bandy.\n\n[travel_leader.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('travel_leader'))], vystoupí se zdviženou zbraní vpřed a čeká na můj pokyn."
 travel_events.1003.a: "Ach, samozřejmě. Mýtné."
 travel_events.1003.b: "Co takhle platba krví?"
 travel_events.1003.c: "Mýto je pro sedláky a já jsem [ROOT.Char.GetTitleAsNameNoTooltip]."
 travel_events.1003.a.success: "Zastrašení tě nechají projít."
 travel_events.1003.a.failure: "Stejně si budeš muset probojovat cestu."
 travel_events.1005.t: "$travel_danger_prefix$ [ROOT.Char.GetFaith.WaterGodNamePossessive] daň"
 travel_events.1005.desc: "Prudké poryvy větru a neutuchající bouřky už celé hodiny zmítají lodí ze strany na stranu. Když stojím na palubě a pevně se držím stěžně, spatřím, že se uvolnila truhla s mým [overboard_artifact.GetName]!\n\nJe mimo můj dosah, ale [travel_leader.GetFirstName] je nablízku. Pokus o její záchranu by však znamenal riziko pádu přes palubu."
 travel_events.1005.a: "Zachraň tu truhlu!"
 travel_events.1005.b: "Nestojí to za to riziko."
 travel_events.4000.t: "O cestách příštích"
 travel_events.4000.desc.intro: "Při cestě přes [ROOT.Char.GetCurrentLocation.GetName] míjím podivně vyhlížející stan, rozevřený dokořán, a uvnitř kohosi ještě podivnějšího.\n\n„Vstup, ó [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 travel_events.4000.desc.mid.long_to_go: "Vidím, že tě čeká ještě mnoho mil,"
 travel_events.4000.desc.mid.travelled_far: "Vidím, že přicházíš z veliké dálky,"
 travel_events.4000.desc.outro: "a za skromnou cenu ti mohu vyložit, co tě čeká na budoucích cestách.“\n\nTajemná osoba vzbudila zájem mého doprovodu, ale stojí mi takový „výklad“ za ty peníze?"
 travel_events.4000.a: "Pověz mi, co mě čeká, moudrá duše."
 travel_events.4000.b: "Pojď se mnou budoucnost #EMP prožít#!."
 travel_events.4000.c: "Nemám zájem."
 travel_events.4000.d: "Zapečeťte stan a [Select_CString(mystic_scope.IsFemale,'čarodějnici','čaroděje')] upalte!"
 travel.good_reading: "Dobré znamení na cestu"
 travel.bad_reading: "Zlé znamení na cestu"
 travel_events.4001.t: "[Select_CString(loyal_fan_scope.IsFemale,'Fanatička','Fanatik')]"
 travel_events.4001.desc: "Můj doprovod projíždí přes [ROOT.Char.GetCurrentLocation.GetName] bez potíží, dokud nezaslechnu rozruch mezi strážemi. Nakonec se k mému boku protlačí cizí člověk s tváří rozzářenou požehnáním, které sesílá [ROOT.Char.GetFaith.HighGodName].\n\n„Ať [loyal_fan_scope.GetFaith.random_GoodGodNames] dosvědčí má slova! Ať [loyal_fan_scope.GetFaith.random_GoodGodNames] dosvědčí má slova! Ať [loyal_fan_scope.GetFaith.random_GoodGodNames] dosvědčí má slova! To je [ROOT.Char.GetTitleAsNameNoTooltip|U] z [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]! Netoužím po ničem jiném než vám po zbytek života bezvýhradně sloužit!“\n\nStráže už se chystají zakročit a poslat dotěrnou návštěvu zpátky do bláta, ale taková oddanost by se u dvora jistě hodila."
 travel_events.4001.a: "Přidej se ke mně."
 travel_events.4001.b: "Tady máš pár mincí za svou oddanost."
 travel_events.4001.c: "Vrať se do stoky, kam patříš."
 travel_events.4002.t: "[local_beauty_scope.GetWomenMen|U] [local_beauty_scope.GetCulture.GetNameNoTooltip] kultury"
 travel_events.4002.desc: "Na svých cestách jsem [Select_CString(ROOT.Char.IsFemale,'spatřila','spatřil')] mnohé divy světa, ale nikdy takovou krásu jako v [ROOT.Char.GetCurrentLocation.GetName]. [local_beauty_scope.GetWomenMen|U] [local_beauty_scope.GetCulture.GetName] kultury skutečně převyšují všechny ostatní.\n\nZvlášť mě v poslední době [Select_CString(local_beauty_scope.IsFemale,'zaujala','zaujal')] [local_beauty_scope.GetName].\n\n[local_beauty_scope.Custom('LoverPetName')]... Při tom pohledu mám jasno: taková krása nemá trávit dny dřinou v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]."
 travel_events.4002.a: "[Select_CString(local_beauty_scope.IsFemale,'Má nová milenka.','Můj nový milenec.')]"
 travel_events.4002.b: "Musí být navždy po mém boku."
 travel_events.4002.c: "Musíme se ihned vzít!"
 travel_events.4002.d: "Bohužel svou lásku nemohu rozdávat tak volně."
 travel_events.4003.t: "Nestvůra na obzoru"
 travel_events.4003.desc.intro: "Moře halí hustá mlha, v níž se skály a vlny objevují a zase mizí během jediného mrknutí oka. Na obzoru se vynoří obludná silueta a vše zůstává klidné, dokud se ta obrovská bestie nevynoří z mlhy přímo před námi.\n\n"
 travel_events.4003.desc.viking: "K naší lodi se blíží dračí hlava a na jejím hřbetě pokřikuje divoká posádka Seveřanů!"
 travel_events.4003.desc.berber_pirate: "Na obzoru se vynoří mohutná loď obtěžkaná kořistí. Její posádka barbareských pirátů mává čepelemi a chystá se zaútočit!"
 travel_events.4003.desc.regular_pirate: "Blíží se k nám loď nacpaná otrhanými bandity a zloději, kteří se bezzubě šklebí při pomyšlení, jak se svými slanými prsty zmocní našeho bohatství."
 travel_events.4003.a: "Odrazíme je!"
 travel_events.4003.b: "Ať si vezmou, co chtějí."
 travel_events.4003.c: "Zkusíme jim zmizet v mlze!"
 travel_events.4003.d: "Ještě z nich udělám spojence!"
 travel_events.4003.offer_accepted: " [viking_scope.GetFirstName] přijímá tvou nabídku"
 travel_events.4003.offer_refused: " [viking_scope.GetFirstName] odmítá tvou nabídku"
 travel_events.4004.t: "Ryby v moři"
 travel_events.4004.desc: "Slýchá se, že rybáři [fishermen_county_scope.GetCountyData.GetCulture.GetName] kultury jsou po celém světě proslulí tím, jak dovedou z moře vytěžit tu nejhojnější a nejchutnější kořist. Dnes mám u břehů [fishermen_county_scope.GetNameNoTierNoTooltip] štěstí a narazím na rybářskou flotilu [fishermen_county_scope.GetCountyData.GetCulture.GetNameNoTooltip] kultury!\n\nNaše výprava se přiblíží k jednomu osamělému plavidlu flotily a okamžitě mě uvítá pronikavý pach jeho kapitána.\n\n„Je mi ctí! [ROOT.Char.GetLadyLord] se snad nechá zlákat naším nejlepším dnešním úlovkem?“"
 travel_events.4004.a: "Dnes večer se dobře najíme!"
 travel_events.4004.b: "Ryby, nebo život, námořníku!"
 travel_events.4004.c: "Dnes ne."
 travel_events.4005.t: "Vzácné cetky"
 travel_events.4005.desc: "Moře se tu hemží obchodníky [merchant_character_scope.GetCulture.GetName] kultury, kteří se věnují svému obvyklému řemeslu a převážejí vzácné a exotické zboží z jednoho přístavu do druhého.\n\nNa jedné z obchodních lodí je cosi, co okamžitě upoutá mou pozornost. Jakmile mi padne do oka [merchant_artifact_scope.GetName], je mi jasné, že [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] nic podobného nenabízí. Prostě to musím mít."
 travel_events.4005.a: "A taky to mé bude!"
 travel_events.4005.b: "Ukradnu to!"
 travel_events.4005.c: "Bohužel takové rozhazování si nemohu dovolit."
 travel_events.4006.t: "Okřídlený zloděj"
 travel_events.4006.desc: "Poklidnou plavbu širým modrým mořem náhle přeruší pronikavý skřek! Vrhnu se do zásobárny v podpalubí a s hrůzou zjistím, že vedle roztrhaných zbytků našich zásob stojí [ROOT.Char.Custom('GetRandomMigratoryBird')], peří napjaté přes odporně nafouklé břicho.\n\nVztekem vidím rudě a mám chuť tu odpornou okřídlenou pohromu na místě zabít, ale vtom mě zarazí [superstituous_caravan_member.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n„Hej! Ruku pryč! Copak ti jako [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('superstitious_caravan_member'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('superstitious_caravan_member'))] nikdo neřekl, že zabít ptáka na moři nosí smůlu?“"
 travel_events.4006.a: "Projevím milosrdenství."
 travel_events.4006.b: "Nic mi nezabrání toho zatraceného ptáka zabít!"
 travel_events.4007.t: "$travel_danger_prefix$ Bouřlivé počasí"
 travel_events.4007.desc: "[ROOT.Char.GetFaith.WaterGodName] naší plavbě očividně nepřeje, protože na naši nepatrnou loď dopadají vlny veliké jako hrady! Plavidlo se zmítá ze strany na stranu a všichni se drží, čeho mohou, aby je moře nesmetlo přes palubu, zatímco loď se stále nebezpečněji blíží převrácení.\n\nSamozřejmě jsem s ostatními urozenými [Select_CString(ROOT.Char.IsFemale,'ukrytá','ukrytý')] v nejbezpečnější části lodi, ale když oblohu trhá hromobití a moře na nás doráží vší silou, začínám se obávat, že pokud se budu spoléhat jen na víru, dalšího dne se nedožiji."
 travel_events.4007.a: "Věřím našemu kapitánovi."
 travel_events.4007.b: "Ať [ROOT.Char.GetFaith.WaterGodName] dosvědčí, že se kormidla chopím osobně!"
 travel_events.4007.c: "Držte se za místními loděmi skrz bouři."
 travel_events.4008.t: "Opuštěná loď"
 travel_events.4008.desc: "Moře je dnes klidné a shovívavé, nehybné jako balvan, a navíc nám do zad vane silný vítr. Veslaři v podpalubí zřejmě budou mít snadný den, když tu přede mnou náhle spatřím zohavenou mrtvolu lodi, přídí zaklíněnou do rozeklaných skal.\n\nŽádné přeživší nevidím a proplout mezi skalami rozhodně nebude snadné, přesto cítím nutkání ten záhadný vrak prozkoumat."
 travel_events.4008.a: "Prozkoumáme to."
 travel_events.4008.b: "Tím směrem čeká jen smrt."
 travel_events.4009.t: "Opuštěná loď: Cetka"
 travel_events.4009.desc: "Mé podezření se potvrzuje: ve vraku není ani živáčka, kromě několika ptáků ozobávajících napůl sežrané mrtvoly těch, kteří tudy cestovali před námi.\n\nPři bližším pohledu se v zakrváceném zobáku jednoho ptáka něco zaleskne. S pronikavým skřekem upustí předmět mezi trosky a odletí, takže mi nezbývá než si tu podivuhodnou věc vyzvednout."
 travel_events.4009.a: "Nádhera!"
 travel_events.4010.t: "Opuštěná loď: Bohatství"
 travel_events.4010.desc: "Jak všichni předpokládali, vrak nepřežil nikdo. Oděvy a zboží, které zůstaly na mrtvých, však svědčí o tom, že kdysi šlo o bohatou obchodní loď!\n\nMezi troskami vidím exotické zboží a přepychové oděvy, které kromě trochy vody zůstaly neporušené. Jakmile se dostaneme na břeh, nepochybně za ně utržíme pěknou sumu."
 travel_events.4010.a: "Skvělý nález!"
 travel_events.4011.t: "Opuštěná loď: Přeživší"
 travel_events.4011.desc: "K mému překvapení se při přibližování k vraku ozve hlas volající na naši loď. Na zbytku dveří se drží [Select_CString(castaway_scope.IsFemale,'bohatá šlechtična','bohatý šlechtic')].\n\n„Haló! Už to vypadalo, že nikdy nespatřím živou duši a moře si mě vezme stejně jako mé společníky.“\n\n[castaway_scope.GetName] se mi představí, tvrdí, že domovem je [nearby_coast_scope.GetName], a nabízí odměnu za bezpečnou plavbu i společnost."
 travel_events.4011.a: "Dopravíme tě na břeh."
 travel_events.4011.b: "Přidej se k nám na cestu!"
 travel_events.4011.c: "Obávám se, že tě neslyším..."
 travel_events.4012.t: "[feral_child_scope.GetFirstNameNoTooltip], [feral_child_scope.Custom('GirlBoy')|U] divočiny — [feral_child_scope.Custom('GetAnimalType')|U]"
 travel_events.4012.desc: "Putujeme divokou krajinou. [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] ve mně vyvolává neodbytný pocit, že nás někdo sleduje. Nedaleko se neobratně skrývá [Select_CString(feral_child_scope.IsFemale,'křehká, špinavá dívka','křehký, špinavý chlapec')] a pozoruje náš doprovod.\n\nČlen karavany mi sdělí, že podle místních tyto kraje obchází [feral_child_scope.GetFirstNameNoTooltip], [Select_CString(feral_child_scope.IsFemale,'dívka, kterou','chlapec, kterého')] daleko od lidské společnosti vychoval tvor, kterého označují prostě jako [feral_child_scope.Custom('GetAnimalType')].\n\nUbohé stvoření náš doprovod zjevně fascinuje a dokonce už dokáže něco málo říct. Občas se od [Select_CString(feral_child_scope.IsFemale,'ní','něj')] ozve lámaná [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip|l], ale k její skutečné znalosti má stále daleko."
 travel_events.4012.a: "[Select_CString(feral_child_scope.IsFemale,'Tu dívku','Toho chlapce')] naučím žít mezi lidmi!"
 travel_events.4012.b: "Prostě si toho dítěte nevšímejte."
 travel_events.4012.c: "Zažeňte [Select_CString(feral_child_scope.IsFemale,'ji','ho')] zpátky ke zvířecím přátelům! I [feral_child_scope.Custom('GetAnimalType')|l] [Select_CString(feral_child_scope.IsFemale,'jí','mu')] je bližší než lidé."
 travel_events.4013.t: "Průlom: [feral_child_scope.GetFirstNameNoTooltip]"
 travel_events.4013.desc: "Stalo se něco, v co se snad nikdo z nás neodvažoval doopravdy doufat. [feral_child_scope.GetFirstNameNoTooltip] se začíná vzdalovat dítěti, které kdysi znalo jen společnost divokých zvířat.\n\nKde dříve bývala jen nesrozumitelná slova a zvířecí návyky, jsou teď celé věty, smích a hry s ostatními dětmi. [feral_child_scope.GetFirstNameNoTooltip] mezi nimi působí téměř samozřejmě, jako by k nim odjakživa [Select_CString(feral_child_scope.IsFemale,'patřila','patřil')].\n\nA dnes, když naše obvyklá výuka skončila, přišlo něco, co mě zasáhlo ještě víc. [feral_child_scope.GetFirstNameNoTooltip] se mě nesměle [Select_CString(feral_child_scope.IsFemale,'zeptala','zeptal')], zda bych pro [Select_CString(feral_child_scope.IsFemale,'ni','něj')] [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být tím, co pro dítě znamená [ROOT.Char.GetMotherFather]."
 travel_events.4013.a: "Je mi [Select_CString(feral_child_scope.IsFemale,'dcerou','synem')], krev nekrev."
 travel_events.4013.b: "To je ale triumf!"
 travel_events.4014.t: "[feral_child_scope.GetFirstNameNoTooltip] a volání divočiny"
 travel_events.4014.desc: "[feral_child_scope.GetFirstName] mi při výchově dává pořádně zabrat, o tom není pochyb. Sotva dokáže poskládat souvislou větu a stále se plíží kolem jako divoké zvíře. Život pod střechou očividně přináší jen trápení, a když už přijde na slova, téměř vždy se mluví jen o návratu do divočiny.\n\nSleduji, jak se nejistě postaví na dvě nohy a gestem naznačí, že chce odejít. A nějak vím, že tentokrát je to navždy."
 travel_events.4014.a: "Počkej! Dej mi ještě jednu šanci!"
 travel_events.4014.b: "[feral_child_scope.GetFirstNameNoTooltip], nikdy na tebe nezapomenu."
 travel_events.4015.t: "Jazyková bariéra"
 travel_events.4015.desc: "Zdá se, že naše karavana v těchto cizích krajích poněkud zabloudila.\n\n[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] nás už celé hodiny nepouští dál a [travel_leader_scope.GetName] nás vodí sem a tam. Nakonec přece jen spolkne hrdost a požádá o radu, jenže místní řeč zjevně neovládá. Její název je [ROOT.Char.GetCurrentLocation.GetCulture.GetLanguage.GetNameNoTooltip]."
 travel_events.4015.a: "Zkusím to já."
 travel_events.4015.b: "Naštěstí [ROOT.Char.GetCurrentLocation.GetCulture.GetLanguage.GetNameNoTooltip] není žádná překážka!"
 travel_events.4016.t: "$travel_danger_prefix$ Zatracené vedro"
 travel_events.4016.desc.intro: "Domov i ledové větry zůstaly daleko za mnou. Zpočátku mi změna podnebí připadala příjemná a mé pleti dokonce svědčila,"
 travel_events.4016.desc.mid.dry_heat: "teď mi však kůže rudne a voda mnou protéká jako písek sítem."
 travel_events.4016.desc.mid.humid_heat: "teď však vzduch prosycený vlhkostí připomíná dýchání přes mokrou látku."
 travel_events.4016.desc.outro: "\n\nVoda příjemně chladí a osvěžuje a pomáhá zahnat únavu z vedra, ale jednoduše to nestačí."
 travel_events.4016.a: "Jen do mě, slunce!"
 travel.got_heatstroke: "Vedro tě přemohlo"
 travel.found_a_place_to_cool: "Podařilo se ti najít chladivou řeku"
 travel_events.4016.b: "Potřebuji vodu!"
 every_entourage_tt: "Každý člen doprovodu"
 travel.stole_water: "Podařilo se ti ukrást osvěžující doušek vody"
 travel.caught_stealing_water: "Přistihli tě při krádeži!"
 travel_events.4017.t: "Meče k pronájmu"
 travel_events.4017.desc.intro: "O vojenských činech legendárních žoldnéřů [ROOT.Char.GetCurrentLocation.GetCulture.GetName] kultury se vypráví široko daleko. Při cestě krajem, kde leží [ROOT.Char.GetCurrentLocation.GetName], mám štěstí a narazím na velmi [Select_CString(warrior_scope.IsFemale,'zkušenou velitelku','zkušeného velitele')] žoldnéřů!\n\n"
 travel_events.4017.desc.mid.nomad: "[warrior_scope.GetName] o sobě tvrdí, že je [Select_CString(warrior_scope.IsFemale,'nejobávanější bojovnicí','nejobávanějším bojovníkem')] celé stepi"
 travel_events.4017.desc.mid.swordsman: "[warrior_scope.GetName] tvrdí, že je [Select_CString(warrior_scope.IsFemale,'nejlepší šermířkou','nejlepším šermířem')] [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury na světě"
 travel_events.4017.desc.outro: "a že za patřičnou cenu bude ctí sloužit."
 travel_events.4017.a: "A patřičnou cenu také dostane!"
 travel_events.4017.b: "Jistě se můžeme dohodnout."
 travel.haggle_succesful: "Smlouvání bylo úspěšné!"
 travel.haggle_failed: "[warrior_scope.GetName] bere nabídku jako urážku"
 travel_events.4017.c: "Tahle známost by se mohla hodit při příštím obchodu..."
 travel_events.4017.d: "To asi ne."
 travel_events.4018.t: "[Select_CString(mystic_scope.IsFemale,'Žebravá poutnice','Žebravý poutník')] [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] kultury"
 travel_events.4018.desc.intro: "Doslechli jsme se, že [ROOT.Char.GetCurrentLocation.GetCounty.GetTitle.GetHolder.GetPrimaryTitle.GetNameNoTierNoTooltip] je země, která se jen hemží zbožnými poutníky putujícími v naprosté chudobě a často žijícími jen z víry.\n\nK naší karavaně přistoupí [Select_CString(mystic_scope.IsFemale,'jedna taková žebravá poutnice','jeden takový žebravý poutník')],"
 travel_events.4018.desc.mid.mystic: "a každému, kdo je ochoten poslouchat, káže o vlastní mystické a esoterické filozofii."
 travel_events.4018.desc.mid.preacher: "a vykládá [mystic_scope.GetFaith.HighGodNamePossessive] vůli a cestu ke zbožnému životu."
 travel_events.4018.desc.outro: "\n\n[Select_CString(mystic_scope.IsFemale,'Chudá poutnice','Chudý poutník')] se od našeho doprovodu očividně nechce odloučit, ale snad se mi podaří zařídit, aby [Select_CString(mystic_scope.IsFemale,'pokračovala','pokračoval')] jinam..."
 travel_events.4018.a: "V debatě nemám konkurenci."
 travel.debate_won: "V debatě vítězíš!"
 travel.debate_lost: "V debatě prohráváš."
 travel_events.4018.b: "Některé argumenty dávají smysl..."
 travel_events.4018.c: "Dříve či později odejde."
 travel_events.4018.d: "Kacířství si žádá hranici!"
 travel_events.4019.t: "Prostá pochoutka"
 travel_events.4019.desc: "Když se před námi objeví [ROOT.Char.GetCurrentLocation.GetName], narazíme na místní trh s jídlem! Kolem exotických stánků se tlačí sedláci i urození všech možných kultur a jazyků a vzduch je prosycen vůněmi, jaké jsem si dosud [Select_CString(ROOT.Char.IsFemale,'nedokázala','nedokázal')] ani představit.\n\nVůně mě táhne k prostému stánku s pokrmem, o jakém se mi dosud mohlo jen zdát. Z opojení mě náhle vytrhne [pompous_courtier.GetName], když mě zadrží.\n\n„Nekazte si tím chuť, [ROOT.Char.Custom('FormOfAddressForLiege')]. [ROOT.Char.Custom('GetLocalStreetFoodPlural')|U] patří sedlákům, doma máme mnohem lepší jídlo.“"
 travel_events.4019.a: "Jsem [ROOT.Char.GetTitleAsNameNoTooltip] a [ROOT.Char.Custom('GetLocalStreetFood')] bude moje dnešní jídlo!"
 travel.good_food: "Jídlo bylo vynikající"
 travel.bad_food: "Jídlo bylo odporné"
 travel.food_poisoning: "Postihla tě otrava jídlem"
 travel_events.4019.b: "Nemůžu uvěřit, že jsem tu břečku málem [Select_CString(ROOT.Char.IsFemale,'snědla!','snědl!')]"
 travel_events.4019.c: "Třeba se mi podaří získat recept!"
 travel_events.4020.t: "$travel_danger_prefix$ [ROOT.Char.GetFirstNameNoTooltip], [Select_CString(ROOT.Char.IsFemale,'cizinka','cizinec')]"
 travel_events.4020.desc: "Je známo, že [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetCollectiveNoun] jsou horliví věřící a jejich vírou je [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetName]. K nevěřícím se však nechovají právě vlídně. Přesto nám [ROOT.Char.GetCurrentLocation.GetName] leží v cestě, a tak musíme projít.\n\nVesničané na nás však brzy upřou pomstychtivé pohledy jako [ROOT.Char.Custom('GetAnimalType')] na svou kořist. Než stačíme zareagovat, místní [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PriestNeuter] se na nás vyřítí v čele davu rozzuřených fanatiků. Ječí cosi o našich údajných „kacířských názorech“ a požadují platbu jako pokání za průchod těmito „posvátnými zeměmi“."
 travel_events.4020.a: "[Select_CString(strong_believer_scope.IsFemale,'Pošetilá ženo','Pošetilý muži')], to #EMP ty#! jsi [Select_CString(strong_believer_scope.IsFemale,'kacířka','kacíř')]!"
 travel_events.4020.b: "Bude jednodušší prostě zaplatit."
 travel_events.4020.c: "Upalte ty šílence."
 travel_events.4021.t: "Obětní oltář: [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName]"
 travel_events.4021.desc.intro: "Je mi známo, že [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePlural] přinášejí lidské oběti, ale nikdy by mě nenapadlo, že jedné budu přihlížet na vlastní oči. Na kamenném oltáři leží [Select_CString(sacrificed_person_scope.IsFemale,'nahá žena, pevně připoutaná','nahý muž, pevně připoutaný')] k jeho povrchu utaženými provazy.\n\n"
 travel_events.4021.desc.mid.sadist: "Jaké štěstí, že mohu tohle posvátné barbarství sledovat na vlastní oči. Oběť se tak nádherně svíjí a zmítá, až mě mrzí, že nemohu vlastní rukou vrazit nůž do jejího srdce a dokončit obřad. [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HighGodName] si takovou oběť jistě žádá!\n\n"
 travel_events.4021.desc.mid: "Nemohu uvěřit tomu, co vidím. Tělo oběti se chvěje s každým prudkým nádechem a zakrvácené oči přímo žadoní o mou pomoc.\n\n"
 travel_events.4021.desc.outro.cannibal: "Jen doufám, že až bude po všem, dostanu příležitost hodovat na mase oběti."
 travel_events.4021.desc.outro.sadist: "S potěšením přihlížím, oči upřené na nůž, který posílá oběť do nicoty."
 travel_events.4021.desc.outro: "Bezmocně přihlížím a přeji si jediné: zastavit nůž a oddálit nevyhnutelný konec."
 travel_events.4021.a: "Musím se prostě dívat jinam."
 travel_events.4021.a.sadist: "Ať mi neunikne ani okamžik!"
 travel_events.4021.b: "Co když tu ubohou duši vykoupím?"
 travel_events.4021.c: "Stop! Mám lepší oběť: [rival_to_sacrifice.GetNameNoTooltip]!"
 travel_events.4022.t: "Posvátný strom"
 travel_events.4022.desc: "Prý zde v [ROOT.Char.GetCurrentLocation.GetName] uctívají přírodu a věří, že skrze ni promlouvá cosi, čemu říkají [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.PantheonTerm].\n\nSledujeme, jak místní zdobí starý strom drahými látkami a šperky, jako by se mu dvořili. Mnohým z mého doprovodu stačí přihlížet z dálky, ale já cítím potřebu udělat něco víc..."
 travel_events.4022.a: "Fascinující."
 travel_events.4022.a.not_so_different: "Nejsme zas tak odlišní."
 travel_events.4022.a.ignore_heretics: "Do záležitostí kacířů se míchat nebudu."
 travel_events.4022.b: "Nechte ten strom spálit!"
 travel.burn_the_tree: "Strom vzplane"
 travel.beaten_by_peasants: "Věřící tě zaženou zpět"
 travel_events.4022.c: "Přidám se k oslavám!"
 cultural_acceptance_participated_in_festival: "Účast na slavnosti"
 travel_events.4023.t: "Ztracení [prester_john_scope.GetFaith.GetReligion.GetAdherentNamePluralNoTooltip|U]"
 travel_events.4023.desc.intro: "Legendy vyprávějí o vzdáleném kraji, kde [ROOT.Char.GetFaith.GetReligion.GetAdjective] svět přežívá obklopen kacíři a bezvěrci. Tamní stát je [prester_john_scope.GetPrimaryTitle.GetTierAsNameNoTooltip]. V jeho čele stojí [prester_john_scope.GetTitleAsNameNoTooltip], postava opředená legendami. Jednoho dne se má chopit zbraní proti ničemům a s posvátnou zuřivostí je srazit!\n\n"
 travel_events.4023.desc.mid.john: "Legendy mu říkají „Kněz Jan“ a"
 travel_events.4023.desc.mid.joan: "Legendy jí říkají „Kněz Jan“, ale možná měly na mysli „Kněžku Janu“! Ať tak či tak,"
 travel_events.4023.desc.mid: "Jméno této legendární postavy se nedochovalo, ale"
 travel_events.4023.desc.outro: "čím více času tu trávím, tím víc mi [prester_john_scope.GetPrimaryTitle.GetNameNoTierNoTooltip] připadá jako místo z legend a tím pevněji věřím, že [prester_john_scope.GetName] je právě [prester_john_scope.GetTitleAsNameNoTooltip] z oněch dávných příběhů!"
 travel_events.4023.a: "Musím se s [Select_CString(prester_john_scope.IsFemale,'ní','ním')] okamžitě setkat!"
 travel_events.4023.b: "Musím [Select_CString(prester_john_scope.IsFemale,'jí','mu')] připomenout povinnost bojovat proti kacířství!"
 travel_events.4023.c: "[prester_john_scope.GetFaith.GetNameNoTooltip] je pouhá zkomolenina. Pravá víra je [ROOT.Char.GetFaith.GetNameNoTooltip]!"
 travel_events.4023.d: "Fascinující. Jedeme dál."
 travel_events.4024.t: "[ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip|U] z daleka"
 travel_events.4024.desc.intro: "Dorazil ke mně dopis psaný exotickým jazykem. Stojí v něm, že jej posílá [foreign_visitor.GetTitleAsNameNoTooltip] z daleké země, kde žijí „[foreign_visitor.GetFaith.GetAdherentNamePluralNoTooltip]“, vzdálená skupina souvěrců, které bychom označili slovem [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip]."
 travel_events.4024.desc.mid: "\n\nV dopise dále stojí, že pro [foreign_visitor.GetFaith.GetAdherentNamePluralNoTooltip] jsem legendární postavou. Jsem prý [ROOT.Char.GetTitleAsNameNoTooltip|U]. Ze všech stran na mě doléhají [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')], zatímco [ROOT.Char.GetFaith.GetReligion.GetAdjective] svět ve mně vidí svou pravou oporu."
 travel_events.4024.a: "I pro nás se stane legendou!"
 travel_events.4024.b: "[foreign_visitor.GetFaith.GetNameNoTooltip]? To zní jako kacířství!"
 travel_events.4024.c: "Ať je [chaplain_scope.GetNameNoTooltip] poučí. Pravá víra je [ROOT.Char.GetFaith.GetName]!"
 travel.gift_from_john: "[prester_john_scope.GetName] posílá dar"
 travel_events.4024.d: "Jak milé..."
 travel.turned_away_from_john: "Setkání ti bylo odepřeno"
 travel_events.4025.t: "Pozvedni svatý meč"
 travel_events.4025.desc.mid: "V dopise se tvrdí, že jsem legendární postavou předurčenou pozvednout meč proti nevěřícím a vést boj, který si přeje [ROOT.Char.GetFaith.HighGodName]. Ubohé bezvěrce pak prý čeká [ROOT.Char.GetFaith.NegativeAfterLife], přesně jak si zaslouží.\n\nMezi mými sousedy se najdou lidé nejrůznějších vyznání. Opravdu si [ROOT.Char.GetFaith.HighGodName] přeje, abych proti nim [Select_CString(ROOT.Char.IsFemale,'sáhla','sáhl')] k násilí?"
 travel_events.4025.a: "Samozřejmě, že si to [ROOT.Char.GetFaith.HighGodName] přeje!"
 travel_events.4025.b: "Cest je mnoho a na jejich konci čeká [ROOT.Char.GetFaith.PositiveAfterLife]."
 travel.visitor_rejected_me: "[prester_john_scope.GetName] odmítá bojovat proti kacířství"
 travel_events.4025.different_religion_neighbors_and_vassals: "Každý [Concept('vassal','vazal')|E] a sousední [Concept('ruler','vládce')|E] jiného [Concept('religion','náboženství')|E]"
 travel_events.4026.t: "Přátelé z dálky"
 travel_events.4026.desc: "[prester_john_scope.GetName] [Select_CString(prester_john_scope.IsFemale,'odpověděla','odpověděl')] na můj dopis a dává najevo obdiv ke mně i k mé víře. Mou vírou je [ROOT.Char.GetFaith.GetName].\n\nDále píše, že pokud si to [ROOT.Char.GetFaith.HighGodName] bude přát, možná se jednou setkáme. Do té doby si máme zachovat vzájemný obdiv i na dálku."
 travel_events.4026.a: "To zní báječně!"
 travel.became_friends_with_visitor: "[foreign_visitor.GetName] se [Select_CString(foreign_visitor.IsFemale,'stala tvou přítelkyní','stal tvým přítelem')]!"
 travel.visitor_rejected_friendship: "[foreign_visitor.GetName] odmítá přátelství"
 travel_events.4026.b: "Vztahy na dálku mi příliš nesvědčí."
 travel_events.4027.t: "Kacíři na návštěvě"
 travel_events.4027.desc: "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] dnes navštívila skupina poutníků, kteří si říkají [foreign_visitor.GetFaith.GetAdherentNamePlural]. V jejich řadách je také [foreign_visitor.GetFaith.GetAdherentNameNoTooltip], [foreign_visitor.GetTitleAsNameNoTooltip|U], a právě z těchto úst dnes zaznělo obvinění, že jsem [Select_CString(ROOT.Char.IsFemale,'kacířka','kacíř')]!\n\nObvinění zní, že nejen překrucuji [ROOT.Char.GetFaith.HighGodNamePossessive] vůli, ale že celá [ROOT.Char.GetFaith.GetAdjective] víra je jen odpornou karikaturou našeho vlastního náboženství: [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip]!"
 travel_events.4027.a: "Ten nabubřelý fanatik! Ještě uvidíme, kdo se komu vysmívá!"
 travel_events.4028.t: "Runový kámen"
 travel_events.4028.desc: "Kraj, který nese jméno [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], je proslulý runovými kameny: vysokými monolity pokrytými písemnými záznamy legendárních i skutečných událostí.\n\nNa cestě narazíme na obzvlášť impozantní runový kámen zdobený složitými vzory a bezpochyby i nějakou legendou, jenže jazyk nápisu mi nic neříká.\n\nS trochou času a trpělivosti bych snad [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] přijít na jeho význam..."
 travel_events.4028.a: "Zkusím to!"
 travel.read_runestone: "[Select_CString(ROOT.Char.IsFemale,'Přečetla','Přečetl')] jsi runový kámen!"
 travel.failed_to_read_runestone: "Runový kámen se ti přečíst nepodařilo"
 travel_events.4028.b: "Tenhle rouhačský symbol musí být stržen!"
 travel_events.4028.c: "Na tohle nemám čas."
 travel_events.4029.t: "Hrůzostrašný strašák: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events.4029.desc.intro: "Putování krajem, který nese jméno [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], není zdaleka tak poklidné, jak jsem si [Select_CString(ROOT.Char.IsFemale,'představovala','představoval')]. Obloha je černá mraky a pole kolem nás jsou mrtvolně tichá.\n\nTicho náhle rozervou pronikavé výkřiky bolesti ozývající se z hloubi polí. Když se přiblížíme, spatříme kůl. Na něm visí [brainless_character.GetWomanMan], [Select_CString(brainless_character.IsFemale,'přivázaná','přivázaný')] jako strašák.\n\n"
 travel_events.4029.desc.mid.christian: "Výjev je obrazem Kristova utrpení: [brainless_character.GetWomanMan] visí na provizorním kříži uprostřed pole."
 travel_events.4029.desc.mid: "Suché rty a bledá kůže dávají jasně najevo, že tu visí už nějakou dobu."
 travel_events.4029.desc.outro: "Někteří členové mého doprovodu mě naléhavě žádají o záchranu, ale je to vůbec má starost?"
 travel_events.4029.a: "Smilujte se nad tou ubohou duší!"
 travel_events.4029.b: "Tohle je očividně trest za nějaký zločin."
 travel_events.4029.c: "Nechte [Select_CString(brainless_character.IsFemale,'ji','ho')] být."
 travel_events.4030.t: "$travel_events.4029.t$"
 travel_events.4030.desc.intro: "[brainless_character.GetWomanMan] se mi žalostně plazí u nohou a odřenýma rukama krvácí na zem. Členové mého doprovodu brzy zvednou postavu na nejisté nohy a naléhají, aby vyprávěla, co se vlastně stalo.\n\n"
 travel_events.4030.desc.mid.lowborn: "„To máma, víte. Pořád říká, že mi všechno trvá a na poli jsem k ničemu, že jako strašák budu užitečnější. Tak mě přivázala. Zdálo se mi, že to vydržím, ale byla to muka.“"
 travel_events.4030.desc.mid.noble: "„[Select_CString(brainless_character.IsFemale,'Přijela','Přijel')] jsem sem jen vybrat daně. Sedláci mi tvrdili, že zlato zakopali někde tady, a najednou se na mě sesypali a pověsili mě jako strašáka!“"
 travel_events.4030.desc.outro: "\n\nDůvtip očividně není silnou stránkou tohoto člověka, přesto mi za pomoc nabízí menší obnos."
 travel_events.4030.a: "Tady ti očividně hrozí nebezpečí. Pojď se mnou!"
 travel_events.4030.b: "Dobrá odměna za dobrý skutek."
 travel_events.4030.c: "Žádnou odměnu nepotřebuji."
 travel_events.4031.t: "[Select_CString(heartless_knight_scope.IsFemale,'Železná žena','Železný muž')]"
 travel_events.4031.desc.intro: "Procházka krajem, který nese jméno [ROOT.Char.GetCurrentLocation.GetName], je skutečným darem a při pohledu na všechnu tu krásu mi na mysli vytane [ROOT.Char.GetFaith.CreatorName]. Zdejší klid však náhle rozervou rozzuřené výkřiky a řinčení zbroje!\n\n„Pomoc! Dostaňte mě z toho kovového vězení! Můj panoš se urazil kvůli mému chování, dokonce mě nazval [Select_CString(heartless_knight_scope.IsFemale,'bezcitnou','bezcitným')], a pak mě opustil!“\n\n"
 travel_events.4031.desc.mid.callous: "Snažím se potlačit smích, ale představa toho hlupáka, jak se v rachotící zbroji potácí krajinou, je zkrátka příliš komická."
 travel_events.4031.desc.mid: "Ať už [heartless_knight_scope.GetWomanMan] přede mnou [Select_CString(heartless_knight_scope.IsFemale,'provedla','provedl')] cokoli, takový osud si nikdo nezaslouží: navždy uváznout ve vlastní zbroji."
 travel_events.4031.desc.outro: "Samozřejmě můžu zařídit pomoc, ale stojí to vůbec za námahu?"
 travel_events.4031.a: "Za správnou cenu tě z té zbroje dostaneme."
 travel_events.4031.b: "Nabídnu ti věrné panoše výměnou za věrnost."
 travel_events.4031.c: "Nechám tě tvému osudu."
 travel_events.4032.t: "[ROOT.Char.Custom('GetAnimalType')|U] proti [Select_CString(cowardly_knight_scope.IsFemale,'rytířce','rytíři')]"
 travel_events.4032.desc: "Naši cestu násilně přeruší zvuk trhaného masa a cvakajících čelistí. Zoufale křičí [cowardly_knight_scope.GetWomanMan], [Select_CString(cowardly_knight_scope.IsFemale,'které','kterému')] jde o holý život! Ten hluk je tak děsivý, že snad musí přicházet přímo odtud: [ROOT.Char.GetFaith.NegativeAfterLife]!\n\nKdyž najdeme zdroj hluku, spatříme zoufalý zápas: $knight_culture_player_no_tooltip_lowercase$ na jedné straně a [ROOT.Char.Custom('GetAnimalType')] na druhé! Čepel uvázla šelmě mezi čelistmi, ale ruka, která ji drží, začíná ochabovat."
 travel_events.4032.a: "[Select_CString(cowardly_knight_scope.IsFemale,'Tahle žena','Tenhle muž')] si mou pomoc zaslouží!"
 travel.beat_back_lion: "Podařilo se ti odrazit útok: [ROOT.Char.Custom('GetAnimalType')]"
 travel.mauled_by_animal: "Útok tě těžce zranil: [ROOT.Char.Custom('GetAnimalType')]"
 travel_events.4032.b: "Pomoz [Select_CString(cowardly_knight_scope.IsFemale,'jí','mu')], [entourage_helper.GetFirstNameNoTooltip]!"
 travel_events.4032.c: "Kvůli tomu život riskovat nebudu."
 travel_events.4033.t: "[witch_scope.Custom('MagicUserTerm')|U]: [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events.4033.desc.intro: "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip] je pro mě zemí podivných a neznámých zvyků. Místní víra se jmenuje [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetName] a její praktiky jsou mi cizí a nepředstavitelně odlišné od všeho, co znám. Má vlastní víra je [ROOT.Char.GetFaith.GetName] a nikde není ten rozdíl patrnější než v postoji k magii.\n\nPřímo uprostřed města pronáší zaklínadla [witch_scope.GetWomanMan] a rozdává požehnání. Chová se přitom úplně stejně jako [ROOT.Char.GetFaith.PriestNeuter]!"
 travel_events.4033.desc.mid.zealous: "Už samotný pohled na tohle zvrácené kacířství mi obrací žaludek a ruka zvyklá rozdělávat hranice se mi začíná třást vzteky."
 travel_events.4033.desc.mid: "Je mi to podivné, ale lidé kolem jsou z přítomnosti této osoby doslova nadšení."
 travel_events.4033.a: "Musí pochopit, že [witch_scope.Custom('MagicPracticeTerm')] je hřích."
 travel_events.4033.b: "Mám se toho tolik co učit. Uč mě!"
 travel_events.4033.c: "Do tohohle mi vlastně nic není."
 travel_events.4033.d: "[witch_scope.Custom('MagicPracticeTerm')|U]! Buď přijde pokání, nebo hranice!"
 travel.burned_witch: "Podařilo se ti zajmout a upálit člověka známého jako [witch_scope.Custom('MagicUserTerm')]"
 travel.beaten_by_locals: "Místní tě zastavili"
 travel_events.4034.t: "Z popela poklad"
 travel_events.4034.desc.intro: "Zlotřilá osoba známá jako [witch_scope.Custom('MagicUserTerm')] právem skončila na hranici za zločiny proti posvátnému řádu, jehož zosobněním je [ROOT.Char.GetFaith.HighGodName]. Když kouř konečně řídne, všimnu si, že po tomhle [witch_scope.Custom2('InsultAdjective', ROOT.Char)] [witch_scope.GetWomanMan] cosi zůstalo.\n\n"
 travel_events.4034.desc.mid.bones: "V popelu leží kosti, které navzdory prudkému žáru zůstaly dokonale zachované. Nepochybně jde o poslední projev odporné magie."
 travel_events.4034.desc.mid: "V popelu se leskne podivuhodný předmět, kterému se plameny zázračně vyhnuly. Možná je to odměna za mou službu a [ROOT.Char.GetFaith.HighGodName] tak dává najevo svou přízeň... anebo jde o poslední dílo odporné magie."
 travel_events.4034.desc.outro: "Jeden z členů mého doprovodu artefakt vytáhne z popela a očistí. Od této chvíle bude patřit mně."
 travel_events.4034.a: "Pěkný přírůstek do mé sbírky."
 travel_events.4035.t: "Tohle už není [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 travel_events.4035.desc.intro: "Věrně sloužím učení, jehož středem je [ROOT.Char.GetFaith.WitchGodName], a na cestách proto provádím rituály a zaříkávání, která mají můj doprovod chránit před zlými duchy.\n\nJenže [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] je jiné místo. Zdejší "
 travel_events.4035.desc.mid.zealous: "odporní kacíři"
 travel_events.4035.desc.mid: "lidé"
 travel_events.4035.desc.outro: "považují veškerou magii a zázraky prováděné kýmkoli kromě vlastních duchovních za čarodějnictví.\n\nMístní [zealous_priest_scope.GetFaith.PriestNeuter] se proto vrhá na můj průvod jako šelma, stírá mé ochranné symboly a běsní nad údajnou zkažeností mých praktik."
 travel_events.4035.a: "Snad zabere rozumná domluva?"
 travel_events.4035.b: "Kaji se za své zlé praktiky!"
 travel_events.4035.c: "Pryč odsud!"
 travel_events.4035.d: "Probojuji se ven!"
 travel.beat_zealot: "Rozzuřený dav jsi [Select_CString(ROOT.Char.IsFemale,'porazila','porazil')]"
 travel_events.4036.t: "[ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetCollectiveNoun] v karavaně"
 travel_events.4036.desc: "Když cesta vede krajem, který nese jméno [ROOT.Char.GetCurrentLocation.GetCounty.GetName], spatřím v dálce dlouhou řadu karavanních velbloudů. Zanedlouho se setkáme i s jejich podivným vůdcem.\n\n„Přeji dobrý večer. Jen pojďte dál! Jen dál! Ujišťuji vás, že zboží v mém stánku skrývá mnohem víc, než se na první pohled zdá. Ostatně i [kingdom_scope.GetBaseNameNoTierNoTooltip] skrývá víc, než se zdá,“ pronese [merchant_character_scope.GetName] a před očima mi rozloží nespočet třpytivých cetek."
 travel_events.4036.a: "Zaplatím, kolik si řekneš!"
 travel_events.4036.b: "Ukradnu to!"
 travel_events.4036.d: "Možná se nějak dohodneme."
 travel_events.4036.c: "Cetky, které prodávají [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetCollectiveNoun], mě nezajímají."
 travel_events.4037.t: "[ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] a [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]"
 travel_events.4037.desc: "Kraj jménem [ROOT.Char.GetCurrentLocation.GetCounty.GetName] je prý místem, kde lidé vedle vlastní víry vyznávají také [ROOT.Char.GetFaith.GetReligion.GetName]. Teď, když jsem tu, vidím jejich vzájemné prolínání na každém kroku.\n\nZ davu se k našemu doprovodu nadšeně přiřítí [Select_CString(fanboy_character_scope.IsFemale,'podivínská venkovanka','podivínský venkovan')] jménem [fanboy_character_scope.GetFirstName] a s neskrývaným zaujetím začne zkoumat naše náboženské symboly.\n\n„Ať má slova dosvědčí [fanboy_character_scope.GetFaith.HighGodName]! [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] právě tady, ze všech míst na světě! Prosím, [ROOT.Char.Custom('FormOfAddressForLiege')], poučíte nás o vašich obřadech? [ROOT.Char.GetFaith.GetName] mě nesmírně zajímá!“"
 travel_events.4037.a: "Poučím je!"
 travel.good_cermon: "Tvé kázání mělo úspěch"
 travel.bad_cermon: "Tvé kázání dopadlo špatně"
 travel_events.4037.b: "Více mě zajímá [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetNameNoTooltip]."
 travel_events.4037.c: "Pryč, [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]!"
 travel_events.4038.t: "[ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] mezi námi"
 travel_events.4038.desc: "Má víra je [ROOT.Char.GetFaith.GetName]. Má vlastní obřady a vlastní nauku, přesto však [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetName] v našich očích stojí nade všemi ostatními náboženstvími a jeho učení je nám blízké.\n\n[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] proto často zachovávají tradiční obřady a zároveň přijímají i [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetNameNoTooltip]. Nyní přede mnou leží [ROOT.Char.GetCurrentLocation.GetCounty.GetName] a naskýtá se příležitost vyslechnout si kázání a lépe poznat místní víru. Ta se jmenuje [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetName]."
 travel_events.4038.a: "To si nesmím nechat ujít!"
 travel_events.4038.b: "Třeba je zaujmou i naše způsoby!"
 travel_events.4038.c: "Nemám zájem."
 travel_events.4039.t: "Den pohostinnosti"
 travel_events.4039.desc: "Cesta je dlouhá a únavná a chodidla mě bolí tak, že to snad musejí cítit i mí předkové. Právě když mám pocit, že se vyčerpáním zhroutím, dopadne mi na šíji cosi těžkého!\n\nNetrvá dlouho a od hlavy k patě mě zahalí do tradičních šatů, jaké nosí [ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetCollectiveNoun], zatímco ulice kolem propuknou v jásot! Z každého domu mě zvou dovnitř, abych si [Select_CString(ROOT.Char.IsFemale,'odpočinula','odpočinul')] od útrap cesty. Stačila by jen chvíle k načerpání sil a všude bych [Select_CString(ROOT.Char.IsFemale,'byla vítána jako čestná hostka','byl vítán jako čestný host')].\n\n[ROOT.Char.GetCurrentLocation.GetCounty.GetCulture.GetCollectiveNoun] jsou svou pohostinností proslulí. Opravdu si mohu dovolit #EMP nepoznat#! ji na vlastní kůži?"
 travel_events.4039.a: "Snad jen krátký odpočinek..."
 travel_events.4039.b: "Musím pokračovat dál!"
 travel_events.4040.t: "Okouzlení cizí kulturou"
 travel_events.4040.desc: "Od chvíle, kdy jsme dorazili do kraje jménem [ROOT.Char.GetCurrentLocation.GetCounty.GetName], si připadám jako nějaké exotické zvíře vystavené v nádherné zahradě. Lidé na mě užasle zírají kvůli tomu, jak mluvím, jak se chovám a jak vystupuji.\n\nKdyž pokračujeme dál, náhle ke mně přistoupí [Select_CString(fanboy_character_scope.IsFemale,'podivná a nadšená žena','podivný a nadšený muž')], [Select_CString(fanboy_character_scope.IsFemale,'která','který')] na rozdíl od ostatních zřejmě ovládá můj jazyk: [ROOT.Char.GetCulture.GetLanguage.GetName].\n\n„Tak je to opravdu pravda! [ROOT.Char.GetTitleAsNameNoTooltip] právě tady, ze všech míst na světě! [ROOT.Char.GetCulture.GetNameNoTooltip] kultura mě odjakživa fascinuje. Dokonce znám i váš jazyk: [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]! Jaká čest!“"
 travel_events.4040.a: "Ta čest patří jen tobě."
 travel_events.4040.b: "Raději mě pouč o #EMP svých#! lidech."
 travel.caught_red_handed: "Přistihli tě při činu"
 travel.stole_artifact: "Podařilo se ti ukrást artefakt"
 travel.supersititions_abated: "Pověrčivost tvého doprovodu polevila"
 travel.birds_curse: "Tvůj doprovod je přesvědčen, že plavba je prokletá"
 succesfully_navigate_the_storm_tt: "Bouří se ti podařilo bezpečně proplout"
 someone_drowns_tt: "Někdo se utopí"
 some_people_drown_tt: "Mnoho členů doprovodu se utopí"
 you_drown_tt: "Utoneš"
 you_find_nothing_tt: "Nic nenajdeš"
 travel.beat_feral_child: "Podařilo se ti divoké dítě zahnat"
 travel.beaten_by_feral_child: "Divoké dítě tě přemohlo"
 travel.interpreted_instructions: "Pokyny se ti podařilo správně pochopit"
 travel.got_lost: "Ztratíš cestu"
 find_something_cool_tt: "Možná najdeš něco cenného..."
 child_returns_to_nature_tt: "Dítě se vrátí do divočiny..."
 john_may_reward_you_tt: "[prester_john_scope.GetName] tě možná odmění..."
 may_become_friends_tt: "[foreign_visitor.GetName] se možná stane [Select_CString(foreign_visitor.IsFemale,'tvou přítelkyní','tvým přítelem')] na dálku!"
 cheaper_to_convert_to_witchy_faith_tt: "Konverze na [witch_scope.GetFaith.GetName]: získáš slevu #P 50%#!"
 cheaper_to_convert_to_priest_faith_tt: "Konverze na [zealous_priest_scope.GetFaith.GetName]: získáš slevu #P 50%#!"
 cheaper_to_convert_to_fanboy_faith_tt: "Konverze na [fanboy_character_scope.GetFaith.GetName]: získáš slevu #P 50%#!"
 ignores_gender_army_rules_tt: "Tato postava může vést armády bez ohledu na pravidla týkající se pohlaví"
 brainless_may_reward_you_tt: "Možná dostaneš odměnu..."
 learn_language_with_bonus_tt: "Na začátku této intriky získáš velký bonus"
 travel.haggled_for_artifact: "Smlouvání bylo úspěšné"
 travel.failed_to_haggle: "Smlouvání se nezdařilo"
 travel_events.4003.defeated_vikings: "Podařilo se ti porazit [viking_scope.GetFirstName]"
 travel_events.4003.defeated_by_vikings: "[viking_scope.GetFirstName] tě [Select_CString(viking_scope.IsFemale,'porazila','porazil')]"
 travel_events.1005.a.tt.success: "Vůdci karavany se podaří artefakt zachránit."
 travel_events.1005.a.tt.failure: "Vůdce karavany při pokusu zachránit artefakt zemře."
 travel_events.1010.t: "[GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()]"
 travel_events.1010.desc: "Na mou žádost služebníci vybrali dva kandidáty na úřad [GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()]. [great_travel_leader_option.GetName] má být zkušenější, ale [good_travel_leader_option.GetName] je samozřejmě levnější. "
 travel_events.1010.a: "[great_travel_leader_option.GetNameNoTooltip] je skvělá volba."
 travel_events.1010.b: "[good_travel_leader_option.GetNameNoTooltip] postačí."
 travel_events.1010.c: "Ani jedna možnost mi nevyhovuje."
 travel_events.1010.a.aptitude: "[great_travel_leader_option.GetFirstNamePossessiveNoTooltip] [Concept('aptitude','Způsobilost')|E] je [great_travel_leader_option.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_events.1010.b.aptitude: "[good_travel_leader_option.GetFirstNamePossessiveNoTooltip] [Concept('aptitude','Způsobilost')|E] je [good_travel_leader_option.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_events.1020.t: "Nový [GetCourtPositionType('travel_leader_court_position').GetNameNoTooltip()]"
 travel_events.1020.intro.prev_leader_dead: "Můj dosavadní [GetCourtPositionType('travel_leader_court_position').GetName()], [old_travel_leader.GetFirstName], už není mezi živými. [Select_CString(old_travel_leader.IsFemale,'Její','Jeho')] smrt přišla ve chvíli, kdy [old_travel_leader.GetDeathReason]. Musím tedy vybrat někoho jiného, kdo povede můj doprovod.\n\n"
 travel_events.1020.intro.fallback: "Úřad [GetCourtPositionType('travel_leader_court_position').GetName()] je nyní neobsazený, a tak se rozhlížím po svém doprovodu. Najde se někdo, kdo jej dokáže zastávat alespoň do návratu domů, kde budu moci vyhledat řádnou náhradu?\n\n"
 travel_events.1020.desc.two_entourage_members: "Ve skutečnosti tu jsou hned dva lidé, kteří by snadno dokázali převzít [old_travel_leader.GetFirstNamePossessiveNoTooltip] místo. [temp_caravan_master_option_1.GetName], [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_1)], i [temp_caravan_master_option_2.GetName], [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_2)], by v nouzi dokázali posloužit dobře."
 travel_events.1020.desc.one_entourage_member: "V mém doprovodu připadá v úvahu jen jediný člověk: [temp_caravan_master_option_1.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort',temp_caravan_master_option_1)]. Své služby však nabízí také místní [temp_caravan_master_option_2.GetName]."
 travel_events.1020.desc.fallback: "Téhle žalostné sebrance bych [Select_CString(ROOT.Char.IsFemale,'nevěřila','nevěřil')] ani cestu z tržiště domů, natož vedení celé výpravy. Naším dalším cílem je [next_destination.GetName]. Naštěstí své služby nabídli dva místní."
 travel_events.1020.a: "[temp_caravan_master_option_1.GetFirstNameNoTooltip] bude nejlepší."
 travel_events.1020.b: "[temp_caravan_master_option_2.GetFirstNameNoTooltip|U] postačí."
 travel_events.1020.a.aptitude: "[temp_caravan_master_option_1.GetFirstNamePossessiveNoTooltip] [Concept('aptitude','Způsobilost')|E] je [temp_caravan_master_option_1.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_events.1020.b.aptitude: "[temp_caravan_master_option_2.GetFirstNamePossessiveNoTooltip] [Concept('aptitude','Způsobilost')|E] je [temp_caravan_master_option_2.GetCourtPositionAptitude( GetCourtPositionType( 'travel_leader_court_position' ) )]"
 travel_events.2200.t: "Výzva k souboji"
 travel_events.2200.desc: "Na cestě před námi stojí impozantní [local_knight.GetWomanMan].\n\n„Jmenuji se [local_knight.GetName] a pocházím z kraje jménem [local_knight.GetCurrentLocation.GetNameNoTooltip]! V boji už jsem [Select_CString(local_knight.IsFemale,'porazila','porazil')] desítky takových, jako jsi ty! A upřímně, všechny ty souboje byly nudné. Proto teď stojím na téhle cestě a hledám někoho lepšího, někoho, od koho se můžu něco naučit.\n\nPokud mě někdo z vás porazí, získáte ve mně [Select_CString(local_knight.IsFemale,'cennou a věrnou služebnici','cenného a věrného služebníka')]. Proto vás dnes vyzývám: ať se mi někdo postaví v čestném souboji!“"
 travel_events.2200.a: "Nemám zájem ani o tebe, ani o čestný souboj."
 travel_events.2200.a.desc: "[local_knight.GetName] skončí pod kopyty celého tvého doprovodu"
