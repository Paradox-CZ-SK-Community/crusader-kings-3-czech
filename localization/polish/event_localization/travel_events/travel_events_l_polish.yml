 travel_events.5001.t: "Šeptané pověsti"
 travel_events.5001.desc: "Už potřetí dnes při našem průjezdu zaslechnu někoho z místních rozprávět o tomtéž příběhu. [travelling_character.GetFirstName] si všimne mého zmatení.\n\n„Je to zdejší pověst, [ROOT.Char.Custom('FormOfAddressForLiege')]. Říkají jí [potential_legend.GetName],“ svěří se mi [travelling_character.GetFirstName].\n\nNu... rozhodně to zní zajímavě..."
 travel_events.5001.a: "Tenhle příběh vezmu za svůj!"
 travel_events.5001.b: "Nakonec o tom stejně budu vyprávět [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 travel_events.5001.b.flavor: "Přinejmenším z toho bude dobrý příběh pro každého, koho na cestách potkám!"
 travel_events.5001.c: "To je nesmysl."
