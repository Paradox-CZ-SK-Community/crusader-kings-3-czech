 travel_events.4050.t: "Téměř doma"
 travel_events.4050.interpreter: "Na cestě jsem narychlo [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] několik hodnostářů, aby mi na pár okamžiků vzdali úctu. Jejich původ je [foreign_county.GetAdjective].\n\nPozornost mi však odvádí [friendly_child.GetName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))]. Několika společníkům dělá [Select_CString(friendly_child.IsFemale,'tlumočnici','tlumočníka')] a s obdivuhodnou lehkostí přechází mezi jazyky i způsoby chování, takže kolem sebe rozpoutává živou výměnu názorů.\n\nZdá se, že [friendly_child.GetFirstNameNoTooltip] má pro úlohu prostředníka přirozený talent."
 travel_events.4050.religious: "Na cestě se přede mnou shromáždí [friendly_child.GetFaith.AltPriestTermPlural] a já jim narychlo udělím audienci, aby se s námi na pár okamžiků podělili o požehnání a svou moudrost. Jejich původ je [foreign_county.GetAdjective] a tuto moudrost sami označují jako [friendly_child.GetFaith.GetAdjective].\n\nPozornost mi však odvádí [friendly_child.GetName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))]. Kolem sebe shromáždí hlouček mladých souvěrců a uprostřed nich s nečekanou rozvahou vykládá podstatu víry, kterou sdílejí.\n\nPoznávání mého vyznání i vlastní víry očividně přineslo [friendly_child.GetFirstNameNoTooltip] nejedno pozoruhodné poznání."
 travel_events.4050.singing: "Na cestě jsem narychlo [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] několik místních zeměpánů, aby si na pár okamžiků procvičili dvorské způsoby a přitom po mně nervózně pokukovali. Jejich původ je [foreign_county.GetAdjective].\n\nPozornost mi však odvádí [friendly_child.GetName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friendly_child'))]. Náramně si užívá společnost několika místních mladých lidí. Zpívají známé písně, tančí a opěvují dávné hrdiny. Jejich kultura je [friendly_child.GetCulture.GetName] a jejich dědictví nese jméno [friendly_child.GetCulture.GetHeritage.GetName].\n\nPobyt u mého dvora očividně jen prohloubil zájem [friendly_child.GetFirstNameNoTooltip] o vlastní kulturu."
 travel_events.4050.a: "Takový talent stojí za to rozvíjet."
 travel_events.4050.b: "Tohle bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] zarazit..."
 travel_events.4050.b.tt: "Dítě patří k mému dvoru — k mým lidem."
 travel_events.4050.c.interpreter: "Ať [friendly_child.Custom('GirlBoy')|U] něco předvede v řeči zvané [friendly_child.GetCulture.GetLanguage.GetNameNoTooltip]!"
 travel_events.4050.c.religious: "Ať [friendly_child.Custom('GirlBoy')|U] něco předvede! [friendly_child.GetFaith.GetAdherentNamePluralNoTooltip] to jistě ocení."
 travel_events.4050.c.singing: "Ať [friendly_child.Custom('GirlBoy')|U] něco zazpívá! [friendly_child.GetCulture.GetCollectiveNounNoTooltip] se jistě pobaví."
 travel_events.4050.c.tt: "„Ať se [friendly_child.Custom('GetLassLad')] předvede!“"
