l_polish:
 travel_events_mpo.0001.t: "$travel_event_prefix$ Zlaté hejno"
 travel_events_mpo.0001.desc: "Ticho kolem nás náhle ustane. Když vzhlédnu, spatřím několik velkých ptáků kroužících vysoko nad námi a jejich křik se nese stepí. [eagle_noticer.GetName] mě upozorní, že jde o orly skalní, kteří jsou v těchto končinách vzácným úkazem.\n\n[eagle_noticer.GetName] nadšeně vypráví o jejich loveckých schopnostech a o tom, že mnozí si je ochočí jako společníky na celý život. Dokonce navrhne, abychom se pokusili jednoho chytit, protože by nám v budoucnu mohl být velmi užitečný."
 travel_events_mpo.0001.a: "Stačí mi šikovné ruce."
 travel_events_mpo.0001.a_tt: "Postavíš past a počkáš na správný okamžik k chycení orla"
 travel_events_mpo.0001.b: "Na past a návnadu můžeme obětovat pár zásob..."
 travel_events_mpo.0001.b_tt: "Postavíš past a pomocí zásob zvýšíš její účinnost"
 travel_events_mpo.0001.c_noticer: "Ať to zkusí [huntsmaster.GetFirstNameNoTooltip]."
 travel_events_mpo.0001.c_huntsmaster: "Tenhle úkol zvládne [huntsmaster.GetFirstNameNoTooltip]."
 travel_events_mpo.0001.c: "Tohle zvládne někdo z lovců."
 travel_events_mpo.0001.c_tt: "[huntsmaster.GetName] postaví past a počká na správný okamžik místo tebe"
 travel_events_mpo.0001.c_not: "[GetCourtPositionType('master_of_hunt_court_position').GetName()] není ve tvých službách nebo není součástí tvého [Concept('entourage','doprovodu')|E]"
 travel_events_mpo.0001.d: "Jednoho chytím tak, jak mě to [Select_CString(eagle_childhood_teacher.IsFemale,'naučila','naučil')] [eagle_childhood_teacher.GetName]."
 travel_events_mpo.0001.e: "To je sice pěkné, ale žádného ptáka nepotřebuji."
 travel_events_mpo.0001_win: "Úspěšně chytíš orla skalního"
 travel_events_mpo.0001_lose: "Orli jsou příliš ostražití a tvým pokusům se vyhnou"
 travel_events_mpo.0010.t: "$travel_event_prefix$ Na bílém velbloudu"
 travel_events_mpo.0010.desc: "Na obzoru se proti širé stepi rýsuje bílá skvrna. Když se přiblížím, rozeznám bílého velblouda se srstí lesknoucí se ve slunci. Za ním se valí desítky ovcí, které se ho drží jako stín. Náhle se objeví [camel_rider.GetWomanMan], vyskočí na velbloudův hřbet a přivítá mě vřelým úsměvem.\n\n„Mír s vámi,“ ozve se. „Jak vidíte, Alláh mi štědře požehnal, a proto se mohu o jeho dary podělit s ostatními. Neměli byste o něco zájem?“"
 travel_events_mpo.0010.a: "Pár ovcí z tvého stáda by se mi hodilo."
 travel_events_mpo.0010.a_flavor: "[camel_rider.GetName] ti prodá několik ovcí"
 travel_events_mpo.0010.b: "Tvá víra je sama o sobě darem."
 travel_events_mpo.0010.b_islamic: "Ať tě Alláh provází svým požehnáním."
 travel_events_mpo.0010.b_flavor: "Čím by mi mohl Alláh požehnat?"
 travel_events_mpo.0010.c: "Co potřebuji, vezmu si silou."
 travel_events_mpo.0010.c_tt: "[camel_rider.GetName]: pokusíš se ukrást nabízené zboží"
 travel_events_mpo.0010_win: "[camel_rider.GetName] prohraje souboj s tebou"
 travel_events_mpo.0010_lose: "[camel_rider.GetName] tě porazí"
 mpo_islam_conversion_modifier: "Zájem o islám"
 mpo_islam_conversion_modifier_desc: "Tato postava se seznámila s učením islámu a uvažuje o konverzi.\n\nNáklady na konverzi k [GetReligionByKey('islam_religion').GetAdjective] [Concept('faith','víře')|E]: #p -25%#!"
 faith_conversion_cost_mpo_islam_event: "[GetModifier('mpo_islam_conversion_modifier').GetNameWithTooltip]"
