l_polish:
 travel_events.3000.t: "Nestvůrné bytosti"
 travel_events.3000.desc: "Málokdy jsem viděl[Select_CString(ROOT.Char.IsFemale,'a','')] [traveller_monk.Custom2('MyCharacterIntroduction', ROOT.Char)] tak nadšeně. Oči se téměř vpíjejí do bohatě zdobené knihy a občas se mi podaří zahlédnout mapy uvnitř.\n\nJednoho rána za mnou [traveller_monk.GetTitledFirstName] konečně přijde se svými poznatky:\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], povídá se, že v kraji [ROOT.Char.GetCurrentLocation.GetName] žijí neobyčejní lidé! Prý se po zdejších městech potulují [ROOT.Char.Custom('GetGrotesquePlural')].“"
 travel_events.3000.a: "Ty bytosti musím vidět. #EMP Hned!#!"
 travel_events.3000.a.tt: "Budeš po těchto bytostech dál pátrat"
 travel_events.3000.b: "Prosím, [traveller_monk.GetFirstNameNoTooltip], pověz mi o nich víc."
 travel_events.3000.c: "A co má být? Doma máme podivínů dost."
 travel_events.3000.d: "Musím je spatřit a podat zprávu o svých zjištěních."
 travel_events.3000_interest_modifier: "Zájem o nestvůrné bytosti"
 grotesque_rush_modifier: "Horečné pátrání po nestvůrách"
 grotesque_scholar_modifier: "Horečný výzkum nestvůr"
 satiated_curiosity: "Ukojená zvědavost"
 get_grotesque_cynocephalus: "kynokefal, člověk se psí hlavou,"
 get_grotesque_blemee: "blemmy, bezhlavý člověk s tváří na hrudi,"
 get_grotesque_sciapod: "skiapod, trpasličí bytost s jediným obrovským chodidlem,"
 get_grotesque_cynocephaly: "kynokefalové, lidé se psími hlavami,"
 get_grotesque_blemmyae: "blemmyové, bezhlaví lidé s tvářemi na hrudi,"
 get_grotesque_sciapodes: "skiapodové, trpasličí bytosti s jediným obrovským chodidlem,"
 travel_events.3001.t: "Nestvůrné zklamání"
 travel_events.3001.desc_intro: "Pokaždé, když dorazíme do nové osady, chvíli se rozhlížím a pátrám po nestvůrných bytostech, které jsem viděl[Select_CString(ROOT.Char.IsFemale,'a','')] na mapách [traveller_monk.GetTitledFirstNameNoTooltip]. "
 travel_events.3001.desc_cynical: "Příležitost dokázat, že se [traveller_monk.GetTitledFirstName] mýlí."
 travel_events.3001.desc.fallback: "Má zvědavost je zkrátka příliš silná."
 travel_events.3001.desc.outro: "\n\nKdyž dorazíme do [grotesque_place.GetNameNoTooltip], přijde za mnou [traveller_monk.GetTitledFirstName] a pevně svírá svou knihu.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]... řídili jsme se všemi vodítky, ale ty bytosti nikde nejsou. Napadlo mě, že možná... vůbec neexistují.“"
 travel_events.3001.a: "Ach... dobře..."
 travel_events.3001.b: "#EMP Slíbil[Select_CString(traveller_monk.IsFemale,'a','')]#! jsi mi, že tu budou nestvůry."
 travel_events.3001.b_sadistic: "Naučím tě, že svému lennímu pánovi se nelže."
 travel_events.3001.c: "Ha! Já to věděl[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 travel_events.3001.d: "#EMP Někde#! přece být musí."
 travel_events.3001.e: "A jak se doma dozvědí, že tu #EMP nebyly#!?"
 cryptid_obssessed: "Posedlost nestvůrnými bytostmi"
 travel_events.3001.e.success: "Přesvědčíš ostatní o tom, co jsi viděl[Select_CString(ROOT.Char.IsFemale,'a','')]"
 travel_events.3001.e.failure: "Nikdo nevěří tvým příběhům o nestvůrách"
 cryptid_obssessed_rush: "Horečná posedlost nestvůrami"
 travel_events.3010.t: "Cesta domů"
 travel_events.3010.intro: "Po dlouhém dni na cestě se obzor začíná barvit do teplých odstínů. Na chvíli se zastavím, zavřu oči a zhluboka se nadechnu.\n\n"
 travel_events.3010.desc: "„Pozor!“ vykřikne [pet_rescuer.Custom2('MyCharacterIntroduction', ROOT.Char)] a ukáže do [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] za cestou, po níž kráčíme.\n\nDo divočiny prchá cosi, co vypadá jako malý hlodavec,"
 travel_events.3010.alone: "Počkat! Kde je [ROOT.Char.Custom( 'DogStoryName' )]? Už nějakou dobu jsem ho nikde neviděl[Select_CString(ROOT.Char.IsFemale,'a','')]... Zalapám po dechu, když zahlédnu pohyb v [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] za cestou!\n\nDo divočiny prchá cosi, co vypadá jako malý hlodavec"
 travel_events.3010.exotic: "a hned za tím se žene cosi #EMP nebezpečně povědomého#!."
 travel_events.3010.cat: "a za ním se žene [ROOT.Char.Custom('CatFurColor')] postava, kterou okamžitě poznám."
 travel_events.3010.dog: "a za ním se žene [ROOT.Char.Custom('DogFurColor')] postava, kterou okamžitě poznám."
 travel_events.3010.a_dog: "Ne! [ROOT.Char.Custom( 'DogStoryName' )]! [pet_rescuer.GetTitledFirstNameNoTooltip], běž za [ROOT.Char.Custom('DogStoryHerHim')]!"
 travel_events.3010.a_cat: "Ne! [ROOT.Char.Custom( 'CatStoryName' )]! [pet_rescuer.GetTitledFirstNameNoTooltip], běž za [ROOT.Char.Custom('CatStoryHerHim')]!"
 travel_events.3010.a_exotic: "[pet_rescuer.GetTitledFirstNameNoTooltip], chyť mého mazlíčka, než se někomu něco stane!"
 travel_events.3010.a.success: "[pet_rescuer.GetTitledFirstNameNoTooltip] najde tvého mazlíčka"
 travel_events.3010.a.failure: "[pet_rescuer.GetTitledFirstNameNoTooltip] se při hledání tvého mazlíčka ztratí"
 travel_events.3010.a.failure_toast: "[pet_rescuer.GetTitledFirstNameNoTooltip] se při hledání tvého mazlíčka ztratil[Select_CString(pet_rescuer.IsFemale,'a','')]"
 travel_events.3010.b.tt1: "Svého mazlíčka už nikdy neuvidíš"
 travel_events.3010.b.tt2: "Tvůj mazlíček si najde cestu zpět"
 travel_events.3010.b.tt3: "Najdeš svého mazlíčka a ještě něco navíc"
 travel_events.3010.b_dog: "[ROOT.Char.Custom( 'DogStoryName' )] je chytřejší než my všichni. [ROOT.Char.Custom('DogStorySheHe')|U] si cestu zpátky najde."
 travel_events.3010.b_cat: "[ROOT.Char.Custom( 'CatStoryName' )] je chytřejší než my všichni. [ROOT.Char.Custom('CatStorySheHe')|U] si cestu zpátky najde."
 travel_events.3010.b_exotic: "#EMP Pche!#! Jestli by se měl někdo bát, pak spíš lidé v tomhle kraji."
 ill_find_you: "Půjdu tě hledat osobně."
 travel_events.3010.c_dog: "$ill_find_you$ Najdu [ROOT.Char.Custom( 'DogStoryName' )]!"
 travel_events.3010.c_cat: "$ill_find_you$ Najdu [ROOT.Char.Custom( 'CatStoryName' )]!"
 travel_events.3010.c_exotic: "Je sice nebezpečný, ale pořád je to můj ztracený miláček! Najdu ho!"
 travel_events.3010.c.success: "Najdeš svého mazlíčka"
 travel_events.3010.c.failure: "Při hledání svého mazlíčka se ztratíš"
 travel_events.3010.c.failure_toast: "Při hledání svého mazlíčka ses ztratil[Select_CString(ROOT.Char.IsFemale,'a','')]"
 after_him: "Rychle! #EMP Všichni#! za"
 travel_events.3010.e_dog: "$after_him$ [ROOT.Char.Custom('DogStoryHerHim')]!"
 travel_events.3010.e_cat: "$after_him$ [ROOT.Char.Custom('CatStoryHerHim')]!"
 travel_events.3010.e_exotic: "$after_him$ ním!"
 travel_events.3010.d: "Některé duše prostě nejsou stvořené pro život v zajetí. Běž, příteli."
 pet_rescue_modifier: "Zdržení při hledání mazlíčka"
 travel_events.3010.b.tt: "Možná se vrátí samo..."
 travel_events.3011.t: "Tak tady jsi!"
 travel_events.3011.intro: "Vrčení a polámané větvičky mě bez větší námahy dovedou až ke zdroji. "
 travel_events.3011.exotic: "Můj drahý lovec sedí ve spadaném listí a olizuje si z tlap krev své oběti.\n\nHned vedle něj leží veverka, téměř k nepoznání."
 travel_events.3011.dog: "[ROOT.Char.Custom( 'DogStoryName' )] sedí ve spadaném listí a olizuje si z tlap krev své oběti.\n\nHned vedle leží veverka, téměř k nepoznání."
 travel_events.3011.cat: "[ROOT.Char.Custom( 'CatStoryName' )] sedí ve spadaném listí a olizuje si z tlap krev své oběti.\n\nHned vedle leží veverka, téměř k nepoznání."
 travel_events.3011.a: "Ha! Věděl jsem, že to zvládneš! Výborně!"
 travel_events.3011.b: "Už tě nikdy nespustím z očí."
 adventurous_pet_modifier: "Dobrodružný mazlíček"
 travel_events.3012.t: "Cesta domů: Tak tady jsi...?"
 travel_events.3012.exotic: "\n\nZvedne ke mně oči. Jenže jako by mě vůbec nepoznával."
 travel_events.3012.dog: "\n\n[ROOT.Char.Custom( 'DogStoryName' )] ke mně zvedne oči. Jenže mě zřejmě vůbec nepoznává."
 travel_events.3012.cat: "\n\n[ROOT.Char.Custom( 'CatStoryName' )] ke mně zvedne oči. Jenže mě zřejmě vůbec nepoznává."
 travel_events.3012.a: "Vidím, že tady už máš lepší domov. Běž, kam chceš."
 travel_events.3012.c: "Tak se mi to líbí, příteli."
 feral_pet_modifier: "Zdivočelý mazlíček"
 feral_pet_love_modifier: "Milovaný zdivočelý mazlíček"
 travel_events.3020.t: "Vřelé přivítání"
 travel_events.3020.desc: "Při našem příjezdu hraje hudba a šašci žonglují nebezpečně blízko ohně. Děti při pohledu na nás ztichnou a nesměle si na nás ukazují zpoza svých rodičů. [foreign_ruler.GetTitledFirstName] se na mě z vyvýšeného místa usměje.\n\n„Vítejte!“ [foreign_ruler.GetTitledFirstName] ke mně přistoupí s otevřenou náručí. „Čekáme na vás od chvíle, kdy jsme se dozvěděli, že přijedete. Prosím, zůstaňte u nás, jak dlouho budete chtít, a kdybyste cokoli potřebovali, stačí říct.“"
 travel_events.3020.a: "Na dalším úseku cesty přes [next_province.GetNameNoTooltip] by se nám nějaká pomoc hodila."
 travel_events.3020.a_home: "Na cestě domů by se nám nějaká pomoc hodila."
 travel_events.3020.b: "Když už o tom mluvíte... zásoby nám začínají docházet."
 travel_events.3020.b.success: "[foreign_ruler.GetTitledFirstNameNoTooltip] ti poskytne další zásoby"
 travel_events.3020.b.failure: "[foreign_ruler.GetTitledFirstNameNoTooltip] se urazí kvůli tvým požadavkům"
 travel_events.3020.c: "Pár stráží navíc se vždycky hodí."
 travel_events.3020.c.success: "[foreign_ruler.GetTitledFirstNameNoTooltip] ti poskytne další stráže"
 travel_events.3020.d: "Vaši společnost si ještě chvíli vychutnám."
 travel_events.3020.d.tt: "Ještě dva týdny budeš požívat pohostinnosti u dvora [foreign_ruler.GetTitledFirstNameNoTooltip]"
 travel_events.3020.e: "Tyhle záležitosti bychom mohli probrat lépe... ve vašich komnatách."
 travel_events.3020.e.success: "[foreign_ruler.GetFirstNameNoTooltip] tvé návrhy přijme"
 travel_events.3020.e.failure: "[foreign_ruler.GetFirstNameNoTooltip] tvé návrhy odmítne"
 travel_events.3020.f: "Touhle falešnou pohostinností mě neoklamete! Odjíždím!"
 more_supplies_modifier: "Výpomoc se zásobami"
 more_men_modifier: "Vojenská výpomoc"
 travel_events.3021.t: "O otázkách víry"
 travel_events.3021.intro: "„Á, konečně!“ Jakmile vstoupím do trůnního sálu, [foreign_ruler.GetTitledFirstName] mi pokyne, ať přistoupím blíž.\n\n„Čekáme na vás! [foreign_theologian.GetTitledFirstName] patří k nejctnostnějším lidem mého dvora a s potěšením si poslechnu vaši rozpravu o vyšších otázkách. "
 travel_events.3021.different_faiths: "Řekněte mi, proč má být [ROOT.Char.GetFaith.GetName] pravdivější než [foreign_theologian.GetFaith.GetName]?“"
 travel_events.3021.same_faith: "Promluvme si o tom, jakou podstatu má [ROOT.Char.GetFaith.HighGodName].“"
 travel_events.3021.a: "Výzvu přijímám."
 travel_events.3021.a.success: "V dialektickém souboji přesvědčíš [foreign_theologian.GetTitledFirstNameNoTooltip]"
 travel_events.3021.a.failure: "[foreign_theologian.GetTitledFirstNameNoTooltip] předloží přesvědčivější argument"
 travel_events.3021.b: "Ať se výzvy ujme [your_theologian.GetTitledFirstNameNoTooltip]."
 travel_events.3021.b.success: "[your_theologian.GetTitledFirstNameNoTooltip] přesvědčí [foreign_theologian.GetTitledFirstNameNoTooltip] v dialektickém souboji"
 travel_events.3021.c: "Na takové nesmysly nemám čas."
 travel_events.3021.d: "Zlato vyhraje každou debatu..."
 travel_events.3021.d.tt: "[foreign_theologian.GetTitledFirstNameNoTooltip] přijme tvůj úplatek a nechá tě vyhrát."
 nick_the_discussant: "Diskutér"
 dismissed_religious_debate: "Předčasný odchod od dvora"
 travel_events.3022.t: "Oslava"
 travel_events.3022.desc: "Trůnní sál zdobí okázalé květinové girlandy a v sametovém světle svící se rozléhá živý zpěv hostů.\n\n„Á, konečně jste tady!“ [foreign_ruler.GetTitledFirstName] zatleská a zpěváci i hudebníci poslušně ztichnou.\n\n„Právě jsme se chystali zahájit tanec ve vaši čest, [ROOT.Char.GetTitledFirstNameNoTooltip]. Všichni se chyťte za ruce! Utvořte kruh!“"
 travel_events.3022.a: "S chutí se přidám!"
 travel_events.3022.b: "#EMP Aha!#! Konečně přišla má chvíle!"
 travel_events.3022.b.success: "Svým tancem ohromíš celý dvůr"
 travel_events.3022.b.failure: "Před celým dvorem se zesměšníš"
 travel_events.3022.c: "Raději si jen poslechnu, o čem se tu mluví..."
 non_dancer_secret.desc: "Odhalíš [Concept('secret','tajemství')|E]"
 travel_events.3022.d: "[ROOT.Char.GetTitleAsNameNoTooltip] netančí. Jen pozoruje."
 vigorous_dancer_modifier: "Taneční elán"
 vigorous_dancer_modifier.desc: "Oslnivé mistrovství této postavy v nejživějších tancích ji podněcuje k častému procvičování a k tomu, aby při každé příležitosti udělala dojem."
 travel_events.3030.t: "Cizokrajná láska"
 travel_events.3030.desc: "Není to poprvé, co přistihnu [fleeing_knight.Custom2('MyCharacterIntroduction', ROOT.Char)], jak si pohrává s květinami natrhanými podél cesty. Občas bych přísahal[Select_CString(ROOT.Char.IsFemale,'a','')], že zaslechnu i povzdech při pohledu na sídlo v [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\n„[ROOT.Char.Custom('GetCourtOwner')|U],“ ozve se [fleeing_knight.GetTitledFirstName]. „Není žádným tajemstvím, že mé srdce našlo nový domov daleko od toho starého. Má duše touží po [foreign_lady_scope.GetTitledFirstName]. Ta touha nezná mezí... ty oči, ty vlasy... Stačil by mi jediný pozdrav, za jediné slovo bych zemřel[Select_CString(fleeing_knight.IsFemale,'a','')]. Prosím, dovolte mi zůstat po boku [foreign_lady_scope.GetTitledFirstName].“"
 travel_events.3030.a: "Kdo jsem, abych zasahoval[Select_CString(ROOT.Char.IsFemale,'a','')] do záležitostí srdce?"
 travel_events.3030.b: "Domů se vrátíš #EMP se mnou#!."
 travel_events.3030.c: "Na takové mladické poblouznění nemáme čas."
 travel_events.3030.c.success: "Přesvědčíš [fleeing_knight.GetTitledFirstName], aby zůstal[Select_CString(fleeing_knight.IsFemale,'a','')]"
 travel_events.3030.c.failure: "Tvá slova nezaberou"
 travel_events.3030.d: "U našeho dvora je dost místa pro vás oba."
 travel_events.3030.e: "Ty oči jsou opravdu nádherné... a ty vlasy vypadají tak hebce..."
 travel_events.3030.f: "Já lásku #EMP nenávidím#!. Setněte jim hlavy."
 travel_events.3040.t: "Nebezpečné zájmy"
 travel_events.3040.desc: "Každé ráno od chvíle, kdy jsme dorazili do [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], opouští [bishop.Custom2('MyCharacterIntroduction', ROOT.Char)] své nosítko a tiše mi mizí z očí. Tentokrát se vydám po stopě a najdu [bishop.GetTitledFirstName] v živém rozhovoru s místním [foreign_bishop.Custom('GetActualBishopTitle')] [foreign_bishop.GetFirstName].\n\nZačne obřad. Světlo svící ozáří [foreign_bishop.GetFirstNameNoTooltip] a stíny tančí po stěnách jako podzimní listí. „[bishop.GetFirstNameNoTooltip],“ oslovím [bishop.GetTitledFirstName] po skončení obřadu. „Co to děláš?“\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U], právě mě napadlo, že možná neexistuje jen jediná pravda.“"
 travel_events.3040.a: "Ten obřad byl rozhodně působivý..."
 travel_events.3040.b: "To je nesmysl! #EMP Nesmysl!#!"
 travel_events.3040.c: "O tom se dá v klidu diskutovat."
 travel_events.3040.c.success: "Přesvědčíš [bishop.GetFirstNameNoTooltip], že pravda je jen jedna"
 travel_events.3040.c.failure: "Tvá úzkoprsost [bishop.GetFirstNameNoTooltip] rozhněvá"
 travel_events.3040.d: "Tady není prostor pro klidnou debatu! Tas meč!"
 travel_events.3040.d.success: "Síla tvých paží přesvědčí [bishop.GetShortUIName]"
 travel_events.3040.d.failure: "Tvá násilnost [bishop.GetShortUIName] rozhněvá"
 broadened_horizons_modifier: "Rozšířené obzory"
 firm_convictions_modifier: "Pevné přesvědčení"
 travel_events.3060.t: "Poustevník"
 travel_events.3060.desc.intro: "Z porostu vystupuje jeskyně jako kamenný oblouk katedrály. Před vchodem stojí malý dřevěný stolek a stolička a na stolku někdo nechal hořet lucernu."
 travel_events.3060.desc.travel_leader: "\n\n„Opatrně, [ROOT.Char.Custom('FormOfAddressForLiege')],“ varuje mě [travel_leader.GetTitledFirstName] a zvedne paži před mou hruď. „V těchto končinách řádí bandité.“\n\n„S obviněními jste nějak rychlí,“ ozve se spoře osvětlená postava stojící ve vchodu do jeskyně. „Jsem pouhý poustevník. Zato vy... vy nesete titul [ROOT.Char.GetTitleAsNameNoTooltip].“"
 travel_events.3060.desc.on_your_own: " Snad nějaký vyhnanec... nebo úkryt banditů?\n\n„Nebojte se, [ROOT.Char.GetTitleAsNameNoTooltip],“ ozve se spoře osvětlená postava stojící ve vchodu do jeskyně. „Jsem pouhý poustevník hledající moudrost v těchto starých lesích.“"
 travel_events.3060.a: "Poustevník by byl skvělým přírůstkem do mého doprovodu."
 travel_events.3060.b: "Jaké štěstí! Prosím, pověz mi, co mě čeká."
 travel_events.3060.c: "Raději... raději půjdeme."
 impending_doom_modifier: "Blížící se zkáza"
 impending_doom_modifier_desc: "Tato postava má po odmítnutí poustevníka neblahé tušení blížící se zkázy"
 ignored_hermit: "Ignorovaný poustevník"
 hermit_tells_your_future_tt: "Obdržíš proroctví..."
 travel_events.3061.t: "Poustevník: Proroctví"
 travel_events.3061.intro: "Poustevník chvíli mlčí, než odpoví. Vstane a vyčká, dokud se nevydám za ním. Kolem leží rozházené byliny a cosi, co připomíná prosté lůžko. Když se vzdálíme od mého doprovodu, [hermit_scope.GetTitledFirstName] se ke mně otočí a podivně hlubším hlasem pronese:\n\n"
 travel_events.3061.desc_good: "„Kdo hledá, ten nalezne.“"
 travel_events.3061.desc_normal: "„Oheň promluví a z kopyta bučícího dobytka poteče stříbro.“"
 travel_events.3061.desc_bad: "„Voda pomine, ale ty neprojdeš.“"
 travel_events.3061.a: "Jak hlubokomyslné."
 travel_events.3061.a.tt: "Tohle si zapamatuješ"
 travel_events.3062.t: "Kde je můj poustevník?"
 travel_events.3062.desc: "Když dorazíme do sídla [hermit_owner.GetTitledFirstName], dostane se nám vřelého přivítání. Stráže se však při pohledu na náš doprovod pochechtávají a cosi si šeptají, přičemž si mezi sebou ukazují naším směrem.\n\n„Drahý [ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetFirstNameNoTooltip]! Je mi velikou ctí přivítat vás v mém...“ [hermit_owner.GetFirstNameNoTooltip] se zarazí uprostřed věty a tvář se náhle stáhne hněvem. „Co tu dělá #EMP poustevník z mého dvora#!?“"
 travel_events.3062.a: "Neměl[Select_CString(ROOT.Char.IsFemale,'a','')] jsem v úmyslu odvést ti dvořana."
 travel_events.3062.b: "Nu, teď už [hermit_scope.GetTitledFirstName] slouží #EMP mně#! jako $cave_hermit_court_position$."
 travel_events.3062.b.tt: "Po příštích #bold 5 let#! bude najmutí [hermit_scope.GetShortUIName] do pozice $cave_hermit_court_position$ levnější"
 travel_events.3062.c: "Co kdybychom nechali [hermit_scope.GetTitledFirstName] rozhodnout, komu chce sloužit?"
 travel_events.3062.c.success: "Přesvědčíš [hermit_scope.GetShortUINameNoTooltip], aby zůstal[Select_CString(hermit_scope.IsFemale,'a','')] s tebou"
 travel_events.3062.c.failure: "[hermit_scope.GetShortUINameNoTooltip] zůstane u dvora [hermit_owner.GetShortUINameNoTooltip]"
 found_hermit_mod: "Plat nalezeného poustevníka"
 travel_events.3070.t: "$travel_danger_prefix$ Bandité na mostě"
 travel_events.3070.desc: "Tiché zurčení řeky, podél které už nějakou dobu putujeme, postupně sílí. Někteří členové doprovodu navrhují krátkou zastávku, abychom doplnili čerstvou vodu a nechali odpočinout unavené nohy.\n\nZa zatáčkou se objeví kamenný most. Dva muži se opírají o jeho zábradlí. Jeden šťouchne druhého do boku a ukáže na naši skupinu. Od břehu přichází třetí postava a další muž po odplivnutí do řeky zvedne oči naším směrem.\n\n„Víte,“ ozve se [bandit_scope.GetTitledFirstName], „tohle je vlastně most s mýtem.“"
 travel_events.3070.a: "Rozumím."
 travel_events.3070.b: "Odvážné, že tě vůbec něco takového napadlo. [knight_scope.GetTitledFirstNameNoTooltip], ukaž jim."
 travel_events.3070.b.success: "[knight_scope.GetShortUINameNoTooltip] porazí bandity"
 travel_events.3070.b.failure: "Bandité napadnou [knight_scope.GetShortUINameNoTooltip]"
 travel_events.3070.c: "S kým si myslíte, že mluvíte? Já jsem #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!!"
 travel_events.3070.c.success: "Bandity zastrašíš"
 travel_events.3070.c.failure: "Bandité ti nevěří"
 travel_events.3080.t: "[knight_errant.Custom('KnightCultureNoTooltip')] na cestách"
 travel_events.3080.desc_intro: "Je známo, že lidé z [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] chovají zvláštní úctu ke svým [knight_errant.Custom('KnightCulturePluralNoTooltipLowercase')] a k legendám, které se o nich vyprávějí.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ pronese [knight_errant.GetTitledFirstName] a skloní hlavu. „Je velkým štěstím, že se naše cesty zkřížily právě zde. Pátrám po zázračném prameni, jehož voda prý léčí všechny nemoci. Pomůžete-li mi v mém hledání, vzdám vám hold.“"
 travel_events.3080.desc_anagnorisis: "\n\n[same_culture_companion.GetTitledFirstName] rychle skočí do řeči: „Počkejte, [ROOT.Char.Custom('FormOfAddressForLiege')]! Vždyť já [knight_errant.GetFirstName] znám!“"
 travel_events.3080.a: "Nenechám [knight_errant.Custom('KnightCultureNoTooltipLowercase')] napospas osudu. Veď mě!"
 travel_events.3080.a.tt: "Vydáš se za [knight_errant.GetTitledFirstName]"
 travel_events.3080.b: "Přidej se ke mně a zapomeň na tyhle pošetilosti."
 travel_events.3080.b.success: "Přesvědčíš [knight_errant.GetTitledFirstName]"
 travel_events.3080.b.failure: "[knight_errant.GetTitledFirstName] odejde nepřesvědčen[Select_CString(knight_errant.IsFemale,'á','ý')]"
 travel_events.3080.c: "„Pěkná zbroj... Co takhle podělit se o pár mincí?“"
 travel_events.3080.d: "„[same_culture_companion.GetFirstNameNoTooltip], domluv [knight_errant.GetTitledFirstName], ať se přidá k našemu dvoru.“"
 travel_events.3081.t: "[knight_errant.Custom('KnightCultureNoTooltip')] na cestách: Výprava"
 travel_events.3081.desc: "[knight_errant.GetTitledFirstName] nás dovede na malou mýtinu, kde se třpytí přírodní pramen. Světlo se na jeho hladině blaženě mihotá a voda září tak jasně, jako by před námi vyšlo druhé slunce.\n\n„Pozor, šelma! Strážce!“ [knight_errant.GetTitledFirstName] ukáže na [ROOT.Char.Custom('GetAnimalType')], který stojí mezi námi a pramenem."
 travel_events.3081.a: "„Neboj se! Postavím se tomu!“"
 travel_events.3081.a.success: "Zabiješ šelmu"
 travel_events.3081.a.failure: "Šelma tě zraní"
 travel_events.3081.b: "„Odvedu pozornost, ty naber vodu!“"
 travel_events.3081.b.success: "Odvedení pozornosti zabere"
 travel_events.3081.c: "„Teď budeš skvělé rozptýlení #EMP ty#!.“"
 travel_events.3081.d: "To bylo dobrodružství! Jak inspirující!"
 knight_errant_training_modifier: "Výcvik potulného rytíře"
 knight_errant_faith_modifier: "Legenda o léčivé vodě"
 sacred_water_modifier: "Léčivá voda"
 sacred_water_modifier_desc: "O této zázračné vodě se říká, že léčí všechny nemoci."
 travel_events.3090.t: "Zavřené dveře"
 travel_events.3090.desc_intro: "Ach, jak dobře si pamatuji vyprávění o [church_visit_location.GetNameNoTooltip]. Tamní [church_visit_holder.Custom('GetFaithTemple')] se prý tyčí vysoko k nebi jako impozantní bašta zasvěcená [ROOT.Char.GetFaith.HighGodName]. Kamene je v něm snad tolik, že by z něj šlo vystavět celý ráj. Ticho... a modlitby.\n\nPřed námi však leží bezútěšná vesnice v odstínech hnědi, s rozbahněnými ulicemi a dlažbou ohlodanou věkem. Přesto tu [church_visit_holder.Custom('GetFaithTemple')] skutečně stojí. Přesně jak se vyprávělo."
 travel_events.3090.desc_zealous: "\n\nJeho výrazné barvy mi dají zapomenout na všechnu šeď a ponurost kolem. Okamžitě zatoužím podívat se dovnitř."
 travel_events.3090.desc_cynical: "\n\nAlespoň po vzhledové stránce je to působivé."
 travel_events.3090.desc_outro: "\n\n„Ehm... [ROOT.Char.Custom('FormOfAddressForLiege')],“ kněz položí u jedné ze zdí otýpku dřeva, „omlouvám se, ale [church_visit_holder.Custom('GetFaithTemple')] je kvůli přípravám na [activity.GetNameNoTooltip] zavřený.“"
 travel_events.3090.a: "Přijel jsem až sem, abych se podíval dovnitř, #EMP a také se podívám#!."
 travel_events.3090.a.success: "Přesvědčíš místního kněze, aby ti umožnil vstup"
 travel_events.3090.a.failure: "Nepodaří se ti kněze přesvědčit"
 travel_events.3090.b: "Stačí počkat, až tu nikdo nebude..."
 travel_events.3090.b.success: "Úspěšně se dostaneš dovnitř"
 travel_events.3090.b.success_desc: "Objevíš dokumenty, které jsi nikdy neměl vidět..."
 travel_events.3090.b.failure: "Při pokusu proklouznout dovnitř tě přistihnou"
 travel_events.3090.c: "Muži, bude-li třeba, vyrazte dveře."
 travel_events.3090.d: "Nu, to je škoda. Pokračujme v cestě."
 ignored_church: "Ignorovaný svatostánek"
 building_temple_church: "kostel"
 building_temple_mosque: "mešita"
 building_temple_temple: "chrám"
 building_temple_monastery: "klášter"
 travel_events.3100.t: "$travel_danger_prefix$ Zesláblí oři"
 travel_events.3100.desc_intro: "Věděli jsme, že cesta přes stepi v kraji [horses_steppe_location.GetName] nebude snadná. Pochodujeme bez zastávky až do noci a k dalšímu cíli dorazíme tak pozdě, že se ani nenajíme. Kdykoli narazíme na potok, naši koně ržají a odmítají od vody odejít."
 travel_events.3100.desc_steppe: "Na step jsou sice zvyklí i z domova, ale pořád jsou to zvířata a potřebují odpočinek."
 travel_events.3100.desc_outro: "\n\nNetrvá dlouho a naše stížnosti přilákají místního obchodníka. Ukáže na dřevěnou stáj za sebou, plnou zdejších koní.\n\n„Lepší oře nikde nenajdete. Silní a vytrvalí.“"
 travel_events.3100.a: "Jaké štěstí! Dej mi své nejlepší hřebce!"
 travel_events.3100.b: "Budou to muset vydržet. Už žádné další výdaje."
 travel_events.3100.b.success: "Tví koně cestu přežijí"
 travel_events.3100.b.failure: "Tví koně musí neustále odpočívat"
 travel_events.3100.c: "Možná bychom je mohli získat #EMP zadarmo#!..."
 travel_events.3100.c.success: "Podaří se ti koně ukrást"
 travel_events.3100.c.failure: "Obchodník tě donutí za ukradené koně zaplatit"
 travel_events.3100.d: "Ha! #EMP Tihle#! koně už zažili mnohem horší věci!"
 bought_horses_modifier: "Lepší koně"
 pushed_horses_good_modifier: "Úspěšně hnaní koně"
 pushed_horses_bad_modifier: "Přetěžovaní koně"
 tour_travel.3110.t: "Zastávka cestou"
 tour_travel.3110.desc: "Když projíždíme blátivými ulicemi [ghino_di_tacco_location.GetName], potkáváme jen málokoho. Domy jsou prázdné a chátrají. Dítě si mlčky hraje se psem, ale jakmile zahlédne náš doprovod, schová se. Místní kněz nám ukáže, kde bydlí [ghino_di_tacco_scope.GetTitledFirstName], a my se tam vydáme.\n\n„[ROOT.Char.GetTitledFirstNameNoTooltip]! Jaká čest!“ přivítá nás [ghino_di_tacco_scope.GetTitledFirstName] v zaprášené chodbě.\n\n„Je pro nás velikou ctí, že jste zavítali do našeho skromného kraje. Budete-li chtít, přenocujte u nás a povečeřte s námi!“"
 tour_travel.3110.a: "„S radostí vaše pozvání přijímám.“"
 tour_travel.3110.a.tt: "Přijmeš pozvání na hostinu"
 tour_travel.3110.b: "„Tohle... neodpovídá mým nárokům. Musíme pokračovat v cestě.“"
 tour_travel.3110.c: "„Nic by mě nepotěšilo víc! Dokonce jsem si přivedl vlastního $court_jester_court_position$.“"
 tour_travel.3111.t: "Zastávka cestou: Hostina"
 tour_travel.3111.desc_intro: "Olejové lampy vydávají tak slabé světlo, že je sotva vidět. Starý sluha nám přinese jídlo. Rybu. Bez koření.\n\n[ghino_di_tacco_scope.GetTitledFirstNameNoTooltip] působí až příliš nervózně a vypráví o strastech vlády nad tak chudým krajem a o nesnesitelných daních. „Poslední kněz od nás po pár měsících odešel,“ zamumlá a odstrčí naředěné víno.\n\n"
 tour_travel.3111.desc_breaking_down: "Vzápětí se [ghino_di_tacco_scope.GetTitledFirstNameNoTooltip] úplně zhroutí, rozpláče se a skryje tvář v dlaních. „Musím... k vám být upřímn[Select_CString(ghino_di_tacco_scope.IsFemale,'á','ý')]. Pozval[Select_CString(ghino_di_tacco_scope.IsFemale,'a','')] jsem vás sem, protože jsem vás chtěl[Select_CString(ghino_di_tacco_scope.IsFemale,'a','')] okrást, [ROOT.Char.GetLadyLord]. Doufám, že mi odpustíte.“"
 tour_travel.3111.desc_committed: "[ghino_di_tacco_scope.GetTitledFirstNameNoTooltip] se náhle omluví, že musí na latrínu, a cestou do mě jakoby náhodou vrazí."
 tour_travel.3111.a: "„Tady máš. A už nikdy nekrad.“"
 tour_travel.3111.b: "„Na tohle všichni zapomeneme.“"
 tour_travel.3111.c: "„Teď za to naopak zaplatíš #EMP ty#!.“"
 tour_travel.3111.d: "„Moje stráže si s tebou promluví.“"
 tour_travel.3111.e: "„Počkej... co to děláš?“"
 tour_travel.3111.e.success: "Všimneš si, že se tě [ghino_di_tacco_scope.GetFirstNameNoTooltip] snaží okrást"
 tour_travel.3111.e.failure: "Nevšimneš si, že tě [ghino_di_tacco_scope.GetFirstNameNoTooltip] okradl[Select_CString(ghino_di_tacco_scope.IsFemale,'a','')]"
 generous_donations_modifier: "Štědré dary"
 travel_events.3120.t: "$travel_danger_prefix$ Hoří [wooded_location.GetTerrain.GetNameNoTooltip]"
 travel_events.3120.desc: "Příjemná procházka krajinou [wooded_location.GetNameNoTooltip], kde se rozprostírá [wooded_location.GetTerrain.GetNameNoTooltip|l], mi dává naplno vychutnat okolní krásu. Zářivá zeleň je sytá jako šaty dámy z té nejjemnější látky a paprsky slunce prosakují korunami stromů jako tekutý ichor.\n\nVzduchem se nese výrazná vůně. Snad táborák. Otočím se k doprovodu a spatřím zděšenou tvář [travel_leader.GetFirstNameNoTooltip]. „#EMP HOŘÍ!#!“ vykřikne a ukáže k nedalekým plamenům, v nichž uvízl[Select_CString(endangered_character.IsFemale,'a','')] [endangered_character.GetNameNoTooltip]."
 travel_events.3120.a: "„[travel_leader.GetFirstNameNoTooltip], zachraň [endangered_character.GetFirstNameNoTooltip]!“"
 travel_events.3120.a.big_success: "[endangered_character.GetFirstNameNoTooltip] je zachráněn[Select_CString(endangered_character.IsFemale,'a','')]"
 travel_events.3120.a.success: "[endangered_character.GetFirstNameNoTooltip] je s velkými obtížemi zachráněn[Select_CString(endangered_character.IsFemale,'a','')]"
 travel_events.3120.a.failure: "[endangered_character.GetFirstNameNoTooltip] se nepodaří zachránit"
 travel_events.3120.b: "Nic se nedá dělat..."
 travel_events.3120.c: "[endangered_character.GetFirstNameNoTooltip] zachráním sám[Select_CString(ROOT.Char.IsFemale,'a','')]!"
 travel_events.3120.d: "„[prowess_entourage_member.GetFirstNameNoTooltip], běž ty!“"
 travel_events.3120.d.big_success: "[prowess_entourage_member.GetFirstNameNoTooltip] zachrání [endangered_character.GetFirstNameNoTooltip] bez zranění"
 travel_events.3120.d.success: "[prowess_entourage_member.GetFirstNameNoTooltip] s velkými obtížemi zachrání [endangered_character.GetFirstNameNoTooltip]"
 travel_events.3120.d.failure: "[prowess_entourage_member.GetFirstNameNoTooltip] nedokáže zachránit [endangered_character.GetFirstNameNoTooltip]"
 travel_events.3130.t: "$travel_danger_prefix$ Vražedný půvab"
 travel_events.3130.desc: "Cesta územím, kterému vládne [rival_scope.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('rival_scope'))], drží celý můj doprovod v napětí, ba téměř v panice. Při jediném neznámém zvuku saháme po zbraních a hle, mezi našimi vozy stojí tajemná postava!\n\n„Dobrý večer!“ vetřelec se koketně usměje a pohrává si s čepelí. „Kdybychom se tak #EMP jen#! setkali za příjemnějších okolností...“ [sexy_assassin.GetTitledFirstName] našpulí rty. „Ale což! [rival_scope.GetTitledFirstNameNoTooltip] mě posílá, abych vás náležitě #EMP přivítal[Select_CString(sexy_assassin.IsFemale,'a','')]#!.“"
 travel_events.3130.a: "„Blázne! Za tohle zaplatíš!“"
 travel_events.3130.a.success: "Tvé stráže popraví atentátníka"
 travel_events.3130.a.failure: "Atentátník tě zraní a uteče"
 travel_events.3130.b: "„Stráže! Ať [sexy_assassin.GetTitledFirstName] neunikne!“"
 travel_events.3130.b.success: "Atentátníka porazíš a pošleš zpět s dopisem"
 travel_events.3130.c: "„Anebo se můžeš přidat k #EMP mým#! spolčencům...“"
 travel_events.3130.d: "„Příjemnější okolnosti, říkáš...?“"
 travel_events.3130.e: "„Jdi. Už tě nechci nikdy vidět.“"
 executed_assassin_modifier: "Odvrácený atentát"
 sent_assassin_back_modifier: "Odhalení spolčenci"
 travel_events.3140.t: "$travel_danger_prefix$ Nebezpečný průchod"
 travel_events.3140.desc: "Spálená úroda, pustá pole. Následky války. Jakmile spatříme první mrtvoly, zrychlíme tempo.\n\nJediná možná cesta vede kolem vojenského tábora. Ohlédnu se za sebe, ale jinudy to nejde. Kývnu na své stráže. Přikývnou a pevněji sevřou jílce mečů.\n\nU vchodu do tábora stojí velitel. „Spojenci nepřítele, co?“ pronese [hostile_commander.GetTitledFirstName] a poškrábe se na nose. „Nechcete nám tu někoho nechat jako zajatce?“ Přitom zcela zřetelně ukáže na [entourage_member.GetTitledFirstName]."
 travel_events.3140.a: "Podívej se na naše praporce. Nejsme nepřátelé."
 travel_events.3140.a.success: "Přesvědčíš velitele"
 travel_events.3140.a.failure: "Velitel tě odmítne vyslechnout"
 travel_events.3140.b: "[entourage_member.GetTitledFirstName] nikam nepůjde. Nejdřív musíš přes mě!"
 travel_events.3140.b.success: "Zvítězíš v boji"
 travel_events.3140.b.failure: "Velitel zvítězí v boji"
 travel_events.3140.c: "Možná bychom se mohli nějak dohodnout?"
 travel_events.3150.t: "Podivné šeptání"
 travel_events.3150.desc: "Všiml[Select_CString(ROOT.Char.IsFemale,'a','')] jsem si, že se mi [rival_scope.GetTitledFirstName] vyhýbá ještě víc než obvykle. Kdykoli jsme pozváni na hostinu, vždy si sedne na opačný konec stolu, a při táboření mou společnost vytrvale odmítá.\n\nNaše vztahy možná nejsou nejlepší, ale tohle chování mě začíná unavovat, zvlášť když zaslechnu, jak mě [rival_scope.GetTitledFirstName] pomlouvá: „[ROOT.Char.GetFirstNameNoTooltip] je [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival_scope'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_scope'))]. Jako [ROOT.Char.GetTitleAsNameNoTooltip] bych byl[Select_CString(rival_scope.IsFemale,'a','')] mnohem lepší.“"
 travel_events.3150.a: "Chceš vědět, jak se věci mají? Ukážu ti to!"
 travel_events.3150.a.success: "Porazíš [rival_scope.GetFirstNameNoTooltip] a vyženeš ho z výpravy"
 travel_events.3150.a.failure: "[rival_scope.GetFirstNameNoTooltip] tě porazí a odejde"
 travel_events.3150.b: "[travel_leader.GetFirstNameNoTooltip], postarej se o to."
 travel_events.3150.b.success: "[travel_leader.GetFirstNameNoTooltip] zvítězí a přiměje [rival_scope.GetFirstNameNoTooltip] odejít"
 travel_events.3150.b.tt: "[travel_leader.GetFirstName] mírně pokárá [rival_scope.GetFirstName]"
 travel_events.3150.c: "Své dny skončíš v žaláři."
 travel_events.3150.d: "Zmiz mi z očí. #EMP Hned.#!"
 travel_events.3150.e: "To slyším jen vítr?"
 travel_humiliation_modifier: "Ponížení ze vzpoury"
 travel_events.3160.t: "$travel_danger_prefix$ Hejno vran"
 travel_events.3160.desc_battle: "Zem je nasáklá krví. Naše kroky se zpomalují, jako bychom se brodili bažinou. Všude kolem stále leží těla a čekají, až je někdo odklidí. O to nejcennější už většina z nich jistě přišla, ale několik mužů přesto trvá na tom, že je prohledá.\n\nKdyž se k mrtvým přiblížíme, zjistíme, že nejsme jediní, kdo o ně má zájem. Hejno vran na nás hlučně kráká, pak se vznese do vzduchu a vrhne se přímo na mě."
 travel_events.3160.desc_fallback: "Les se táhne dál a dál. Stejně tak cesta. A já s ní. Jakmile projdeme mezi prvními stromy, jako bychom vstoupili do jiného světa, světa zvířat a přítmí. Prodíráme se porostem, vesele si povídáme o cestách a míjíme ptáky i divoké ovoce.\n\nVítr čeří listí a my pokračujeme dál. V korunách stromů přibývá hnízd.\n\nNáhle se ozve hlasité krákání. Hejno vran se vznese a vrhne se přímo #EMP na mě#!."
 travel_events.3160.desc_outro: "Zakryji si obličej pažemi a vykřiknu, když ucítím jejich zobáky, jak se mi snaží proklovat do kůže."
 travel_events.3160.a: "[travel_leader.GetFirstNameNoTooltip]! Pomoc!"
 travel_events.3160.b: "Tady máte chleba! Nechte mě být!"
 travel_events.3160.c: "Já vám ukážu!"
 travel_events.3160.c.success: "Zaženeš vrány"
 travel_events.3160.c.failure: "Vránám se podaří tě zranit"
