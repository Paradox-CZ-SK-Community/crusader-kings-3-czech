l_polish:
 travel_start_event.1000.t_murder: "Hrůzný začátek"
 travel_start_event.1000.t_sick: "Nejistý začátek"
 travel_start_event.1000.t_migrating: "Za zelenějšími pastvinami"
 travel_start_event.1000.t: "Nový začátek"
 travel_start_event.1000.intro_activity: "V [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] pořádá [host.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], [ROOT.Char.GetInvolvedActivity.GetShortName] a nastal čas vyrazit."
 travel_start_event.1000.intro_my_activity: "V [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] pořádám [ROOT.Char.GetInvolvedActivity.GetShortName] a nastal čas vyrazit."
 travel_start_event.1000.desc_sick: "Dobře vím, že vydat se v mém stavu na cestu znamená přidat k obvyklým nebezpečím cestování ještě další riziko spojené s nemocí. Ani můj žalostný stav však cestu nezastaví.\n\nVydejme se tedy do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] a ať nad naší cestou bdí [ROOT.Char.GetFaith.HighGodName]."
 travel_start_event.1000.desc: "Všechno je sbaleno a připraveno. Konečně nastal čas vydat se z [ROOT.Char.GetCurrentLocation.GetName] k našemu příštímu cíli v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName].\n\nKdyž opouštíme sídlo a naši koně se vydávají po nové cestě, nepochybuji, že se brzy vrátíme v pořádku domů."
 travel_start_event.1000.desc_migrating: "Celý tábor hučí jako burácející vodopád: děti pobíhají sem a tam, zvířata protestují a odfrkují a dospělí dokončují balení.\n\nDesítky a desítky vzpomínek, neuspořádaně svázaných do ranců a naskládaných do beden.\n\nNaposledy pohlédnu na [ROOT.Char.GetCurrentLocation.GetName] a pobídnu koně. Mohu jen doufat, že se k nám [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] zachová stejně přívětivě jako toto místo."
 travel_start_event.1010.tt.tournament.every_knight: "Protože se účastníš [GetActivityType( 'activity_tournament' ).GetName], doprovodí tě každý dostupný [Concept('unlanded','bezzemský')|E] [Concept('knight','rytíř')|E], aby mohl soutěžit"
 travel_start_event.1000.a: "Už se nemohu dočkat!"
 travel_start_event.1000.a_cynical: "Asi tedy musíme..."
 travel_start_event.1000.a_craven: "Snad všechno dobře dopadne..."
 travel_start_event.1000.a_hajj: "Na tuto chvíli čekám celý život."
 travel_start_event.1000.a_hajj_revisit: "Už se nemohu dočkat, až znovu spatřím zářící hradby."
 travel_start_event.1000.take_test: "Musím u zkoušek prokázat své schopnosti."
 travel_start_event.1000.take_test_tt: "Jelikož [Concept('governors','guvernéři')|E], kteří jsou [Concept('landed','zeměpány')|E], nesmějí skládat zkoušky, musíš odejít do výslužby, abys odemkl nové [Concept('merit_levels','hodnosti zásluh')|E]."
 travel_start_event.1010.t_sick_tournament: "$activity_tournament$: $travel_start_event.1000.t_sick$"
 travel_start_event.1010.t_tournament: "$activity_tournament$: $travel_start_event.1000.t$"
 travel_start_event.1010.desc_tournament_intro: "V okolí [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] pořádá [ROOT.Char.GetInvolvedActivity.GetHost.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], soutěž [ROOT.Char.GetInvolvedActivity.GetShortName] a nastal čas vyrazit."
 travel_start_event.1010.desc_sick_tournament: "\n\nMé churavé tělo sice strádá, ale ať jsem [Select_CString(ROOT.Char.IsFemale,'prokletá','prokletý')], jestli si nechám ujít událost, která slibuje velkolepou podívanou, o níž se bude mluvit ještě dlouhá léta."
 travel_start_event.1010.desc_tournament: "\n\nBudeme zastupovat rod [ROOT.Char.GetHouse.GetName] a lidé [ROOT.Char.GetCulture.GetNameNoTooltip] kultury na nás budou moci být hrdí."
 travel_start_event.1010.desc_tournament_outro_negative: "\n\nSnad nebude zbytek [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] tak prohnilý jako [host.GetTitledFirstNameNoTooltip]. Přesto bychom měli být obezřetní, když se vydáváme přímo do lví jámy."
 travel_start_event.1010.desc_tournament_outro_positive_culture: "\n\nKdyž už tam budeme, měli bychom využít příležitosti a poznat [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetCulture.GetNameNoTooltip] kulturu."
 travel_start_event.1010.desc_tournament_outro_positive: "\n\nKdyž už budeme daleko od domova, měli bychom také využít příležitosti rozšířit si obzory a užít si pohostinství, kterého se nám dostane."
 travel_start_event.1010.desc_sick_my_tournament: "Nevím, kolik času mi ještě zbývá, a proto je pro mě důležité konečně se zúčastnit soutěže [ROOT.Char.GetInvolvedActivity.GetShortName], kterou jsem tak dlouho [Select_CString(ROOT.Char.IsFemale,'připravovala','připravoval')]. Když se ohlédnu zpět, mrzí mě, že jsem ji nenaplánoval ve svém hlavním městě a místo toho ji pořádám v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]\n\nUvědomuji si, že kvůli mému chatrnému zdraví bude případná účast v soutěži riskantní, ale jistě mám dost [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')], kteří mohou bojovat místo mě."
 travel_start_event.1010.desc_my_tournament: "Členové mého doprovodu jsou svěží, pozorní a nedočkaví, až vyrazíme na soutěž [ROOT.Char.GetInvolvedActivity.GetShortName], kterou pořádám v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName]."
 travel_start_event.1010.desc_my_tournament_outro_shy: "Měla by to být úspěšná událost, která přinese prospěch i hrabství.\n\nSnad se všichni dobře pobaví a ocení úsilí vložené do její přípravy."
 travel_start_event.1010.desc_my_tournament_outro: "Vyrazíme tam a zvítězíme.\n\nA možnost předvést všem váženým hostům naše bohatství a prestiž také není k zahození."
 travel_start_event.1020.t_sick_tour: "$activity_tour$: $travel_start_event.1000.t_sick$"
 travel_start_event.1020.t_tour_majesty: "$activity_tour$: Majestátní začátek"
 travel_start_event.1020.t_tour_tax: "$activity_tour$: Výnosný začátek"
 travel_start_event.1020.t_tour_dread: "$activity_tour$: Hrozivý začátek"
 travel_start_event.1020.desc_tour_intro: "Nastal čas vyrazit na [ROOT.Char.GetInvolvedActivity.GetShortName] po panství [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. Celý můj dvůr má sbaleno, je připravený a už se nemůže dočkat odjezdu.\n\nPrvní zastávkou bude [next_stop_liege.GetTitledFirstNamePossessive] [next_stop_liege.Custom('FortifiedBuilding')] v [next_stop_liege.GetCapitalLocation.GetName], kde na mě čeká [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('next_stop_liege'))];"
 travel_start_event.1020.desc_sick_tour: "bude zajímavé setkat se s místními lidmi.\n\nNavzdory chatrnému zdraví nepochybuji, že se o tomto [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip] bude mluvit ještě dlouhá léta."
 travel_start_event.1020.desc_tour_majesty: "těším se na návštěvu i na to, že budu poznávat své panství sídlo po sídle.\n\nJsem si jist, že [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip] poddaní budou o mé laskavosti mluvit ještě dlouho."
 travel_start_event.1020.desc_tour_tax: "těším se, až lidem pomohu přispět do pokladnice panství všemi dostupnými prostředky.\n\nAž toto turné skončí, [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip] poddaným jistě nezůstane žádný přebytek ukrytý před korunou."
 travel_start_event.1020.desc_tour_dread: "těším se, až budu svým ubohým poddaným nahánět strach, sídlo po sídle.\n\nPostarám se, aby [ROOT.Char.GetPrimaryTitle.GetNamePossessiveNoTooltip] poddaní na toto [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip] nikdy nezapomněli..."
 due_to_activity_options_tt: "Kvůli tvým [Concept('activity_options','možnostem aktivity')|E]:"
 travel_start_event.1030.t_red_wedding: "$activity_wedding$: $travel_start_event.1000.t_murder$"
 travel_start_event.1030.t_sick_wedding: "$activity_wedding$: $travel_start_event.1000.t_sick$"
 travel_start_event.1030.t_wedding: "$activity_wedding$: $travel_start_event.1000.t$"
 travel_start_event.1030.desc_sick_red_wedding: "Zvon bije umíráček mnoha lidem, mě nevyjímaje. Nastal čas vyrazit na [ROOT.Char.GetInvolvedActivity.GetShortName], který pořádám v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName].\n\nNemoc mi nezabrání vykonat to, co musí být vykonáno, a tato událost [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip] se uskuteční, ať se děje cokoli. Postarám se, aby ti, kteří zůstanou naživu, na tuto svatbu jen tak nezapomněli."
 travel_start_event.1030.desc_red_wedding: "Stejně jako nastal čas, abych se se svým doprovodem vydal na [ROOT.Char.GetInvolvedActivity.GetShortName] v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName], nastal také čas, aby hosté události [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip] opustili tento svět.\n\nPokud vše proběhne správně, na tuto svatbu se jen tak nezapomene... alespoň mezi těmi, kteří zůstanou naživu."
 travel_start_event.1030.desc_host_wedding: "V [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] pořádá [host.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], vlastní [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] a nastal čas vyrazit.\n\n[host.GetTitledFirstName] vstoupí do [host.Custom('GetCulturallyAppropriateMarriageReference')] s [host_spouse_to_be.GetTitledFirstName]"
 travel_start_event.1030.desc_host_wedding_negative: "a já budu u toho, abych si z nich mohl dělat posměšky."
 travel_start_event.1030.desc_host_wedding_positive: "a já budu u toho, abych jejich svazku popřál vše dobré."
 travel_start_event.1030.desc_host_wedding_default: "a svatba snad bude příjemná, jako ostatně většina svateb."
 travel_start_event.1030.desc_host_wedding_outro_negative: "\n\nAť je jejich svazek prohnilý jako měsíc stará ryba. Když už nic jiného, alespoň budu moci zneužít pohostinnosti [host.GetTitledFirstNamePossessiveNoTooltip] a dopřát si dobré jídlo a pití."
 travel_start_event.1030.desc_host_wedding_outro_positive: "\n\nAť je jejich manželství stejně štědré jako podzimní úroda a dvakrát tak sladké."
 travel_start_event.1030.desc_host_wedding_outro_default: "\n\nTěším se, až si odpočinu a užiji si oslavy, které k takové příležitosti patří."
 travel_start_event.1030.desc_wedding: "V [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] pořádá [host.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], [ROOT.Char.GetInvolvedActivity.GetShortName] a nastal čas vyrazit.\n\nObřad spojí [first_spouse.GetTitledFirstName], [host.Custom2('RelationToMe', SCOPE.sC('first_spouse'))], a [second_spouse.GetTitledFirstName], [host.Custom2('RelationToMe', SCOPE.sC('second_spouse'))], v [host.Custom('GetCulturallyAppropriateMarriageReference')]."
 travel_start_event.1030.desc_wedding_outro_sick: "\n\nPřestože mi zdraví selhává, těším se na tuto událost, při níž si budu moci odpočinout a užít si oslavy."
 travel_start_event.1030.desc_wedding_outro_negative: "$travel_start_event.1040.desc_feast_outro_negative$"
 travel_start_event.1030.desc_wedding_outro_positive: "\n\nJsem si jist, že [host.GetTitledFirstNameNoTooltip] připravil nezapomenutelnou oslavu, a těším se, až se jí zúčastním."
 travel_start_event.1030.desc_wedding_outro_default: "$travel_start_event.1030.desc_host_wedding_outro_default$"
 travel_start_event.1030.desc_my_spouse_wedding: "V [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] budu pořádat vlastní [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] a nastal čas vyrazit.\n\nTento svazek mě spojí s [my_spouse_to_be.GetTitledFirstName] a jistě půjde o nezapomenutelnou oslavu."
 travel_start_event.1030.desc_my_spouse_wedding_outro_negative: "\n\n[my_spouse_to_be.GetTitledFirstNameNoTooltip] mi sice není zrovna po chuti, ale jistě spolu nějak vyjdeme."
 travel_start_event.1030.desc_my_spouse_wedding_outro_positive: "\n\nVelmi se těším, že strávím zbytek života s [my_spouse_to_be.GetTitledFirstNameNoTooltip], kterého si [Select_CString(ROOT.Char.IsFemale,'tolik vážím','tolik vážím')]."
 travel_start_event.1030.desc_my_spouse_wedding_outro_default: "\n\nJsem si jist, že strávit zbytek života s [my_spouse_to_be.GetTitledFirstNameNoTooltip] bude docela příjemné."
 travel_start_event.1030.desc_my_wedding: "$travel_start_event.1000.intro_my_activity$\n\nSpojíme [first_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('first_spouse'))], a [second_spouse.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('second_spouse'))], v [ROOT.Char.Custom('GetCulturallyAppropriateMarriageReference')], ku prospěchu všech zúčastněných."
 travel_start_event.1030.desc_my_wedding_outro_sick: "\n\nPřestože mi zdraví selhává, udělám vše pro to, aby byli všichni hosté ohromeni a cítili se dobře."
 travel_start_event.1030.desc_my_wedding_outro_negative: "\n\nTak ať je mi teď ten šťastný pár náležitě vděčný."
 travel_start_event.1030.desc_my_wedding_outro_positive: "\n\nNemohu se dočkat, až ty dva konečně uvidím spolu."
 travel_start_event.1030.desc_my_wedding_outro_default: "\n\nBude to příjemný obřad a naši hosté by z něj měli být nadšení."
 travel_start_event.1040.t_murder_feast: "$activity_feast$: $travel_start_event.1000.t_murder$"
 travel_start_event.1040.t_sick_feast: "$activity_feast$: $travel_start_event.1000.t_sick$"
 travel_start_event.1040.t_feast: "$activity_feast$: $travel_start_event.1000.t$"
 travel_start_event.1040.desc_feast: "V [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] pořádá [host.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] a nastal čas vyrazit."
 travel_start_event.1040.desc_feast_celebration: "\n\n[ROOT.Char.GetInvolvedActivity.GetNameNoTooltip|l] se koná na oslavu nejnovějších úspěchů a činů, které má na kontě [celebratory_guest.GetTitledFirstName]."
 travel_start_event.1040.desc_feast_outro_sick: "\n\nPřestože mi zdraví selhává, účast na této události by mi mohla pomoci přijít na jiné myšlenky a trochu se zbavit stresu."
 travel_start_event.1040.desc_feast_outro_negative: "\n\nBěhem této návštěvy si musím hlídat záda stejně jako jídlo, protože [host.GetTitledFirstNameNoTooltip] je proradná stvůra."
 travel_start_event.1040.desc_feast_outro_positive: "\n\nTěším se, že během [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip] strávím s [host.GetTitledFirstNameNoTooltip] více času."
 travel_start_event.1040.desc_feast_outro_default: "\n\nTěším se, až ochutnám [host.Custom('RegionalDrink')] z oblasti [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] a pochutnám si na místní kuchyni."
 travel_start_event.1040.desc_sick_murder_feast: "Nastal čas zúčtovat s hosty mé [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] [ROOT.Char.GetInvolvedActivity.GetShortName].\n\nNyní vyrazíme do [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName], kde se odehraje hostina přesně podle mého gusta. Musím si však pospíšit, než tento svět opustím sám."
 travel_start_event.1040.desc_murder_feast: "Až budu v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName] pořádat [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetPhase.GetName] [ROOT.Char.GetInvolvedActivity.GetShortName], představím hostům svůj vlastní způsob oslav.\n\nVšechno je do posledního detailu připraveno a určitě se budou cítit vítáni. Bude to hostina, na kterou se nezapomíná... tedy alespoň mezi těmi, kteří zůstanou naživu."
 travel_start_event.1040.desc_my_feast: "$travel_start_event.1000.intro_activity$"
 travel_start_event.1040.desc_my_feast_celebration_host: "\n\n[ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip|l] se koná na mou počest a na oslavu všech mých velkolepých úspěchů a činů."
 travel_start_event.1040.desc_my_feast_celebration: "\n\nTato [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip|l] se koná na počest [celebratory_guest.GetTitledFirstName], skutečně pozoruhodného člověka, který si zaslouží zvláštní uznání."
 travel_start_event.1040.desc_my_feast_outro_sick: "\n\nPoslední dobou mi není dobře, ale tahle hostina mě jistě přivede na jiné myšlenky."
 travel_start_event.1040.desc_my_feast_outro_extrovert: "\n\nPostarám se, aby tato [ROOT.Char.GetInvolvedActivity.GetShortNameNoTooltip|l] byla nezapomenutelnou událostí, o které se bude mluvit ještě dlouhá léta!"
 travel_start_event.1040.desc_my_feast_outro_introvert: "\n\nPodobné události sice příliš nemusím, ale čas od času jsou nutným zlem."
 travel_start_event.1040.desc_my_feast_outro: "\n\nTěším se na pořádnou hostinu a příležitost trochu vypustit páru!"
 travel_start_event.1040.a: "Tak by si to přáli."
 travel_start_event.1050.t_sick_playdate: "$activity_playdate$: $travel_start_event.1000.t_sick$"
 travel_start_event.1050.t_playdate: "$activity_playdate$: $travel_start_event.1000.t$"
 travel_start_event.1050.desc_playdate: "$travel_start_event.1000.intro_activity$"
 travel_start_event.1050.desc_sick_playdate: "\n\nPoslední dobou mi sice není dobře, ale snad všechno dopadne dobře a i tak si to užiji."
 travel_start_event.1050.desc_playdate_negative: "\n\n[host.GetTitledFirstName] sice zrovna nepatří mezi mé oblíbence, ale těším se, až strávím čas se svými vrstevníky."
 travel_start_event.1050.desc_playdate_positive: "\n\nUž se nemohu dočkat, až strávím čas s [host.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], a sotva vydržím čekat, než dorazíme!"
 travel_start_event.1050.desc_playdate_default: "\n\nTěším se, až strávím čas se svými vrstevníky a prozkoumám sídlo v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 travel_start_event.1050.desc_playdate_outro: "\n\nA kdo ví, třeba si dokonce [ROOT.Char.Custom('ChildhoodTraitActivity')]."
 travel_start_event.1050.desc_my_playdate: "$travel_start_event.1000.intro_my_activity$"
 travel_start_event.1050.desc_my_playdate_learning: "\n\nMám pro nás zajímavé plány. Něco se naučíme a možná si přitom najdeme i nové přátele."
 travel_start_event.1050.desc_my_playdate_bossy: "\n\nTyhle děti se naučí, že v mém sídle platí moje vůle. Ale určitě spolu budeme vycházet dobře."
 travel_start_event.1050.desc_my_playdate_pensive: "\n\nSetkávat se s vrstevníky opravdu není něco, na co bych měl zrovna náladu... vlastně nikdy.\n\nTohle uspořádání mi sice není příliš po chuti, ale asi budu muset zatnout zuby a přistoupit na jejich hru, pokud si chci udržet své společenské postavení."
 travel_start_event.1050.desc_my_playdate_victim: "\n\n[playdate_victim.GetTitledFirstName|U] tam bude, takže to slibuje příjemně strávený čas... alespoň pro mě.\n\nA předvést sídlo v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip] by také mohla být zábava."
 travel_start_event.1050.desc_my_playdate_default: "\n\nS mými dvořany jsme naplánovali spoustu nejrůznějších činností a těším se, až přivítám své vrstevníky."
 travel_start_event.1050.desc_my_playdate_outro: "\n\nMěla by to být spousta zábavy a zároveň skvělá příležitost předvést sídlo v [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip]."
 travel_start_event.1051.t: "$activity_playdate$: Hurá za zábavou"
 travel_start_event.1051.many: "[child_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_1'))], společně s [child_2.GetTitledFirstName] a ostatními dětmi,"
 travel_start_event.1051.three: "[child_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_1'))], společně s [child_2.GetTitledFirstName] a [child_3.GetTitledFirstName],"
 travel_start_event.1051.two: "[child_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_1'))], společně s [child_2.GetTitledFirstName],"
 travel_start_event.1051.one: "[child_1.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('child_1'))],"
 travel_start_event.1051.desc: "dostává od [host.GetTitledFirstName] pozvání na setkání vrstevníků."
 travel_start_event.1051.single: "\n\nVšechno už má [Select_CString(child_1.IsFemale,'sbavené a připravené','sbalené a připravené')] a očividně se nemůže dočkat, až vyrazí do [host.GetCapitalLocation.GetNameNoTooltip]."
 travel_start_event.1051.multiple: "\n\nVšichni mají sbaleno a jsou připraveni. Očividně se nemohou dočkat, až vyrazí do [host.GetCapitalLocation.GetNameNoTooltip]."
 travel_start_event.1051.a_cynical: "Nu dobrá..."
 travel_start_event.1051.a: "Dobře se bav, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))]!"
 travel_start_event.1051.a.multiple: "Dobře se bavte, děti!"
 travel_start_event.1051.b: "To tedy ne!"
 playdate_depart_tt: "[THIS.Char.GetTitledFirstName] odjíždí na [host.GetInvolvedActivity.GetName]"
 playdate_blocked_tt: "Všechny tvé děti nebo svěřenci pozvaní na [host.GetInvolvedActivity.GetName]"
 playdate_forbidden_title: "$activity_playdate$: Zakázáno"
 playdate_forbidden_tt: "[carer.GetTitledFirstName] [Select_CString(carer.IsFemale,'zakázala','zakázal')] [child_1.GetFirstName] a ostatním účast na $activity_playdate$"
 playdate_forbidden_single_tt: "[carer.GetTitledFirstName] [Select_CString(carer.IsFemale,'zakázala','zakázal')] [child_1.GetFirstName] účast na $activity_playdate$"
 travel_start_event.1060.t_sick_pilgrimage: "$activity_pilgrimage$: $travel_start_event.1000.t_sick$"
 travel_start_event.1060.t_hajj: "Hadždž"
 travel_start_event.1060.t_pilgrimage: "$activity_pilgrimage$: $travel_start_event.1000.t$"
 travel_start_event.1060.desc_sick_pilgrimage: "Cítím to v celém těle: nenápadnou bolest a pomalé chátrání, které přináší má nemoc. V nejtemnějších chvílích mě při životě drží jen vědomí, že [ROOT.Char.GetFaith.HighGodName] má s námi svůj záměr.\n\nProtože však postrádám [ROOT.Char.GetFaith.HighGodHerHis] přítomnost, je mi nyní jasné, že se musím vydat na [ROOT.Char.GetInvolvedActivity.GetShortName] do [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetCounty.GetTitle.GetNameNoTier], abych se přiblížil k [ROOT.Char.GetFaith.HighGodNameAlternate]. Mé duši to zároveň přináší klid, takže až jednou opustím tento svět, nebudu se mít čeho bát."
 travel_start_event.1060.desc_hajj_pilgrimage: "Nastal čas vydat se na pouť do Mekky. Stejně jako všem muslimům mi bylo přikázáno, abych tak projevil svou oddanost [ROOT.Char.GetFaith.HighGodName]."
 travel_start_event.1060.desc_pilgrimage: "Po celou dobu příprav na cestu mě provází zvláštní klid a pocit, že všechno dobře dopadne.\n\nS radostí se vydávám na [ROOT.Char.GetInvolvedActivity.GetShortName] do [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetCounty.GetTitle.GetNameNoTier], abych se ještě více přiblížil k [ROOT.Char.GetFaith.HighGodName]. A nyní více než kdy dřív věřím, že [ROOT.Char.GetFaith.HighGodNameSheHe] bude během cesty nade mnou bdít."
 travel_start_event.1060.tt.random_pilgrim_counter: "K tvé [THIS.Char.GetInvolvedActivity.GetShortName] do [THIS.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetCounty.GetTitle.GetNameNoTier] se přidalo [THIS.Char.MakeScope.Var('rando_pilgrim_counter').GetValue] potenciálních [THIS.Char.Custom('GetPilgrimSingularPlural')]"
 travel_start_event.1060.desc_yatra_pilgrimage: "Když vyrážím na [Glossary('játrá', 'YATRA_GLOSS')], naplňuje mě vzrušení i obava. Připomínám si, že samotná cesta je stejně důležitá jako její cíl. Jakékoli útrapy, které mě mohou potkat, jsou samy o sobě projevem oddanosti.\n\nDoufám, že mě tato [ROOT.Char.GetInvolvedActivity.GetShortName] do [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetCounty.GetTitle.GetNameNoTier] přivede blíže k [ROOT.Char.GetFaith.HighGodName]."
 YATRA_GLOSS: "V sanskrtu „cesta, procesí“. Účastníci takové pouti se nazývají játrí."
 travel_start_event.1070.t_sick_hunt: "$activity_hunt$: $travel_start_event.1000.t_sick$"
 travel_start_event.1070.t_hunt: "$activity_hunt$: $travel_start_event.1000.t$"
 travel_start_event.1070.desc_hunt: "$travel_start_event.1000.intro_activity$"
 travel_start_event.1070.desc_hunt_negative: "Na této cestě si budu muset dávat pozor. [host.GetTitledFirstNameNoTooltip] nevěřím ani nos mezi očima."
 travel_start_event.1070.desc_hunt_positive: "Těším se, až s [host.GetTitledFirstNameNoTooltip] strávím více času."
 travel_start_event.1070.desc_hunt_default: "Měl bych dokázat hrdě reprezentovat rod [ROOT.Char.GetHouse.GetName]."
 travel_start_event.1070.desc_sick_hunt_outro: "\n\nA protože mi zdraví selhává, snad mi tento lov pomůže přijít na jiné myšlenky a trochu se zbavit stresu."
 travel_start_event.1070.desc_hunt_outro_standard: "\n\nPokud bude vše dobře zorganizováno, měla by to být skvělá zábava."
 travel_start_event.1070.desc_hunt_outro_dangerous: "\n\nBudeme lovit nebezpečné šelmy, takže udatnost a důvtip budou naprosto zásadní."
 travel_start_event.1070.desc_hunt_outro_legendary: "\n\nNaší kořistí je bájná šelma z legend a já ji dostanu..."
 travel_start_event.1070.desc_hunt_outro_falconry: "\n\nLov s dravci je nanejvýš vznešená kratochvíle a jsem si jist, že v ní vyniknu."
 travel_start_event.1070.desc_my_hunt: "$travel_start_event.1000.intro_my_activity$"
 travel_start_event.1070.desc_my_hunt_hunter: "Konečně příležitost věnovat se své vášni a zdokonalit své dovednosti."
 travel_start_event.1070.desc_my_hunt_humble: "Těším se, až strávím nějaký čas v přírodě."
 travel_start_event.1070.desc_my_hunt_arrogant: "Nepochybuji, že se brzy vrátím domů ověnčen slávou."
 travel_start_event.1070.desc_sick_my_hunt_outro: "\n\nPřestože nejsem v nejlepší kondici, udělám vše pro to, abych své hosty pobavil. Jsem si jist, že si tuto událost všichni užijí."
 travel_start_event.1070.desc_my_hunt_outro_standard: "\n\nJe to tak, nic se nevyrovná pořádnému starému dobrému lovu!"
 travel_start_event.1070.desc_my_hunt_outro_dangerous: "\n\nNaše kořist bude zuřivá. To jistě přiláká každého, kdo rád pokouší osud."
 travel_start_event.1070.desc_my_hunt_outro_legendary: "\n\nTo, co pronásledujeme, patří do říše legend... pokud to vůbec existuje."
 travel_start_event.1070.desc_my_hunt_outro_falconry: "\n\nUmění mých dravců ostatním ukáže, jak má správný sokolník pečovat o svou sokolnici."
 travel_start_event.1080.t_sick_witch_ritual: "$activity_witch_ritual$: $travel_start_event.1000.t_sick$"
 travel_start_event.1080.t_witch_ritual: "$activity_witch_ritual$: $travel_start_event.1000.t$"
 travel_start_event.1080.desc_witch_ritual: "$travel_start_event.1000.intro_activity$"
 travel_start_event.1080.desc_witch_ritual_negative: "\n\n[host.GetTitledFirstNameNoTooltip] mi sice není zrovna po chuti, ale těším se na příležitost podělit se o vědomosti a něco se přiučit od ostatních bratří a sester."
 travel_start_event.1080.desc_witch_ritual_positive: "\n\n[host.GetTitledFirstNameNoTooltip] je vynikající [host.Custom('MagicUserTerm')], a tak se těším, že spolu s ostatními bratry a sestrami strávíme čas sdílením vědomostí a zdokonalováním svých schopností."
 travel_start_event.1080.desc_witch_ritual_default: "\n\nPříležitost strávit čas se sobě rovnými se nenaskýtá často, a proto se těším na setkání se svými sestrami a bratry, na zdokonalování schopností i sdílení vědomostí."
 travel_start_event.1080.desc_sick_witch_ritual_outro: "\n\nPřestože mi zdraví neslouží, tuto událost si rozhodně nechci nechat ujít."
 travel_start_event.1080.desc_witch_ritual_outro: "\n\nVšechno nasvědčuje tomu, že půjde o skutečně velkolepou událost, na kterou budou měsíce ještě dlouho vzpomínat!"
 travel_start_event.1080.desc_my_witch_ritual: "$travel_start_event.1000.intro_my_activity$"
 travel_start_event.1080.desc_my_witch_ritual_learned: "\n\nJako nesmírně učený [ROOT.Char.Custom('MagicUserTerm')] se postarám, abych své vědomosti předal sestrám a bratrům, a všichni tak mohli žít moudřeji."
 travel_start_event.1080.desc_my_witch_ritual_mystic: "\n\nJako mystik a věštec předvídám, že nás čekají dobré věci, a při oslavě našeho [ROOT.Char.GetFaith.WitchGodMistressMaster] moji bratři a sestry jistě náležitě ocení mou moudrost."
 travel_start_event.1080.desc_my_witch_ritual_health: "\n\nDíky svým znalostem těla a nemocí mohu ostatním sestrám a bratrům předat učení, které jim pomůže prožít dlouhý a zdravý život."
 travel_start_event.1080.desc_my_witch_ritual_default: "\n\nBudu skvělým hostitelem pro všechny sestry a bratry, kteří přicestovali zblízka i zdaleka, abychom se sešli, utužili svá pouta a oslavili našeho [ROOT.Char.GetFaith.WitchGodMistressMaster]!"
 travel_start_event.1080.desc_sick_my_witch_ritual_outro: "$travel_start_event.1080.desc_sick_witch_ritual_outro$"
 travel_start_event.1080.desc_my_witch_ritual_outro: "$travel_start_event.1080.desc_witch_ritual_outro$"
 travel_start_event.1100.t_sick_exam: "$activity_imperial_examination$: $travel_start_event.1000.t_sick$"
 travel_start_event.1100.t_sick_exam_local: "$activity_local_examination$: $travel_start_event.1000.t_sick$"
 travel_start_event.1100.t_exam: "$activity_imperial_examination$: $travel_start_event.1000.t$"
 travel_start_event.1100.t_exam_local: "$activity_local_examination$: $travel_start_event.1000.t$"
 travel_start_event.1100.desc_exam: "$travel_start_event.1000.intro_activity$\n\nProslýchá se, že toto kolo zkoušek se zaměří na "
 travel_start_event.1100.desc_exam_learning: "učenost, a proto jsem si v rámci příprav znovu osvěžil znalost klasických děl."
 travel_start_event.1100.desc_exam_stewardship: "správu země, a proto jsem si oprášil znalosti všech státních záležitostí."
 travel_start_event.1100.desc_exam_martial: "válečné strategie, a proto jsem během příprav trávil dny nad vojenskými záznamy."
 travel_start_event.1100.desc_my_exam_imperial: "$travel_start_event.1000.intro_my_activity$\n\nJako [ROOT.Char.GetTitleAsName] očekávám, že se sjedou ctnostní učenci ze všech koutů panství, aby mezi sebou soupeřili a dokázali, že jsou hodni spravovat všechny, kdo hledí k nebesům."
 travel_start_event.1100.desc_my_exam_local: "$travel_start_event.1000.intro_my_activity$\n\nOčekávám, že se nejschopnější obyvatelé bez prodlení dostaví na místo [location.GetName], připraveni prokázat své schopnosti."
 travel_start_event.1100.desc_sick_exam_outro: "\n\nNavzdory svému churavému tělu si tuto událost nechci nechat ujít."
 travel_start_event.1100.desc_exam_wrong_gender: "\n\nVím, že má účast na této zkoušce vzbudí pochybnosti, ale své zásluhy si #EMP vydobydu#!."
 travel_start_event.1100.desc_exam_outro: "\n\nZajímalo by mě, zda se mi podaří vyniknout mezi ostatními."
 travel_start_event.1100.desc_my_exam_outro: "\n\nKdo asi vynikne mezi ostatními?"
 wrong_examination_gender_tt: "@warning_icon! #X Kvůli [Concept('gender_law','zákonu o pohlaví')|E] panství#!"
 tgp_wrong_examination_gender_female_modifier: "Odmítaná účast"
 tgp_wrong_examination_gender_female_modifier_desc: "Tato postava se navzdory svému pohlaví rozhodla zúčastnit zkoušky."
 tgp_wrong_examination_gender_male_modifier: "$tgp_wrong_examination_gender_female_modifier$"
 tgp_wrong_examination_gender_male_modifier_desc: "$tgp_wrong_examination_gender_female_modifier_desc$"
 travel_start_event.1110.t_sick: "Rituál mandaly: $travel_start_event.1000.t_sick$"
 travel_start_event.1110.t: "Rituál mandaly: $travel_start_event.1000.t$"
 travel_start_event.1110.desc: "Cesta volá! Musím vyrazit a vést své následovníky na místě [contract_location.GetName], aby všichni pocítili mou laskavost."
 travel_start_event.1110.desc_sick_outro: "\n\nNavzdory churavému tělu musím sebrat síly a vydržet."
 travel_start_event.1110.desc_outro: "\n\nUvidíme, co mohou nabídnout."
 travel_start_event.1120.t_special_guest: "Debata: Výzva"
 travel_start_event.1120.t_sick_debate: "Debata: $travel_start_event.1000.t_sick$"
 travel_start_event.1120.t_debate: "Debata: $travel_start_event.1000.t$"
 travel_start_event.1120.desc_special_guest: "[host.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], mě chce vyzvat k debatě o vedení [ROOT.Char.Custom('GetMyMovement')]."
 travel_start_event.1120.desc_my_debate: "$travel_start_event.1000.intro_my_activity$"
 travel_start_event.1120.desc_debate: "$travel_start_event.1000.intro_activity$"
 travel_start_event.1120.desc_sick_debate_outro: "\n\nI když mi tělo selhává, budoucnost [primary_title.GetName] má přednost."
 travel_start_event.1120.a_leader: "Uvidíme, kdo má dost důvtipu, aby uspěl."
 travel_start_event.1120.desc_debate_outro: "\n\nJe mou povinností zajistit, aby se budoucnost [primary_title.GetName] ubírala správným směrem."
 travel_start_event.1120.desc.undecided: "\n\nDozvídám se však, že účast je podmíněna příslušností k jednomu z hlavních hnutí."
 travel_start_event.1120.conservatives: "Mým hnutím bude [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'conservative_movement' ).GetNameNoTooltip]."
 travel_start_event.1120.conservatives.tt: "Přidáváš se k hnutí [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'conservative_movement' ).GetName]"
 travel_start_event.1120.expansionists: "Nejrozumnější volbou je [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'expansion_movement' ).GetNameNoTooltip]."
 travel_start_event.1120.expansionists.tt: "Přidáváš se k hnutí [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'expansion_movement' ).GetName]"
 travel_start_event.1120.advancement: "Do oka mi padne [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'advancement_movement' ).GetNameNoTooltip]."
 travel_start_event.1120.advancement.tt: "Přidáváš se k hnutí [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'advancement_movement' ).GetName]"
 travel_start_event.1120.pro_hegemon: "Povede nás [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'pro_hegemon_movement' ).GetNameNoTooltip]!"
 travel_start_event.1120.pro_hegemon.tt: "Přidáváš se k hnutí [GetSituation('dynastic_cycle').GetTopParticipantGroupByKey( 'pro_hegemon_movement' ).GetName]"
 travel_start_event.1120.bye: "K žádnému z nich se přidávat nechci."
 travel_starts: "Cesta začíná"
 travel_destination_activity: "Tvým cílem je [location.GetName], kde se koná [host.GetInvolvedActivity.GetName]"
