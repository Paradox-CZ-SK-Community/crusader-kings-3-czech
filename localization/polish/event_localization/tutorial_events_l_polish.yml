l_polish:
 tutorial.0001.t: "Znepokojivý vývoj v Ennisu"
 tutorial.0001.desc: "Pozdě v noci mi na dveře komnaty zaklepe [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_ally'))] [potential_ally.GetFirstName]. Pustím [Select_CString(potential_ally.IsFemale, 'ji', 'ho')] dovnitř. S naprosto vážným výrazem pak pronese něco znepokojivého.\n\n„[GetPlayer.GetFirstNameNoTooltip], slyšel jsi ty zprávy? [bad_guy.GetTitledFirstName] si právě vytváří vykonstruovaný nárok na tvé země. Nerad to říkám, ale obávám se, že se chystá k válce.“"
 tutorial.0001.a: "Promluvím si s [bad_guy.GetTitledFirstNameNoTooltip]."
 tutorial.0001.a_flavor: "#TUT Výběrem této možnosti se pokusíš spřátelit s [bad_guy.GetTitledFirstName] a možná tak získáš nového [Concept('friend','přítele')|e] a zcela se vyhneš [Concept('war','válce')|e].#!"
 tutorial.0001.b: "Opilých hlupáků se nebojím."
 tutorial.0001.b_flavor: "#TUT Výběrem této možnosti dáváš najevo, že se nebojíš případné [Concept('war','války')|e], kterou by proti tobě mohl vést [bad_guy.GetTitledFirstName]. Získáš za to střední množství [Concept('prestige','prestiže')|e]."
 tutorial.0001.c: "Malý příspěvek do válečné pokladny by se hodil."
 tutorial.0001.c.tt.success: "Přesvědčíš [potential_ally.GetTitledFirstNameNoTooltip]"
 tutorial.0001.c.tt.failure: "Urazíš [potential_ally.GetTitledFirstNameNoTooltip]"
 tutorial.0001.c_flavor: "#TUT Tato možnost ti umožní pokusit se přesvědčit [potential_ally.GetTitledFirstName], aby ti finančně pomohl. Pokud uspěješ, získané [Concept('gold','zlato')|e] ti může pomoci [Concept('war','válce')|e] předejít nebo v ní zvítězit.#!"
 tutorial.0002.t: "[bad_guy.GetTitledFirstNameNoTooltip] se připravuje na válku"
 tutorial.0002.desc: "Znovu za mnou přichází [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('potential_ally'))] [potential_ally.GetFirstName] s rozpačitým úsměvem na rtech. Nesvůj si odkašle.\n\n„[GetPlayer.GetFirstNameNoTooltip], příteli! Ohledně [bad_guy.GetTitledFirstName] došlo k menšímu vývoji. Víš, před pár dny jsme spolu popíjeli a zaslechl jsem, jak se chlubí svými plány na invazi.“\n\n„Obávám se, že ti nezbývá mnoho času, než [bad_guy.GetTitledFirstNameNoTooltip] udeří.“"
 tutorial.0002.a: "Musí existovat jiná cesta..."
 tutorial.0002.a_flavor: "#TUT Tato možnost ti umožní pokusit se s [bad_guy.GetTitledFirstName] vše vyřešit rozhovorem. Je šance, že tvá [Concept('diplomacy','diplomacie')|e] zabere, ale také hrozí, že se [bad_guy.GetTitledFirstNameNoTooltip] urazí.#!"
 tutorial.0002.a.tt: "Uzavřeš [Concept('alliance','alianci')|e] s [bad_guy.GetTitledFirstName]"
 tutorial.0002.a.tt.crit_success: "Předložíš #EMP velmi#! přesvědčivé argumenty"
 tutorial.0002.a.tt.success: "Předložíš rozumné argumenty"
 tutorial.0002.a.tt.failure: "Urazíš [bad_guy.GetTitledFirstNameNoTooltip]"
 tutorial.0002.b: "Ha! [bad_guy.GetFirstNameNoTooltip] je ale vtipálek."
 tutorial.0002.b_flavor: "#TUT Protože jste s [bad_guy.GetTitledFirstName] [Concept('friends','přátelé')|e], víš, že sice rád dělá ramena, ale ve skutečnosti nic nechystá.#!"
 tutorial.0002.c: "Tyhle hry mě už unavují. [bad_guy.GetFirstNameNoTooltip] se podrobí #EMP mně.#!"
 tutorial.0002.c_flavor: "#TUT Tato možnost ti umožní pokusit se donutit [bad_guy.GetTitledFirstNameNoTooltip], aby se [Select_CString(bad_guy.IsFemale, 'stala tvou', 'stal tvým')] [Concept('vassal', Select_CString(bad_guy.IsFemale, 'vazalkou', 'vazalem'))|e]. K tomu však budeš muset proti [bad_guy.GetTitledFirstNameNoTooltip] vyhrát [Concept('war','válku')|e]!#!"
 