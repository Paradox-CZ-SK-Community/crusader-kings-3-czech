l_polish:
 blotsven.0001.t: "Nečekaná návštěva"
 blotsven.0001.desc: "Pozdě v noci zaklepe na mé dveře [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] a oznámí mi, že lid je rozladěný. [ROOT.Char.GetTopLiege.GetTitledFirstName] odmítá vykonat každoroční blót, ale bez něj nás všechny postihnou sváry a hladomor! [Select_CString(chaplain.IsFemale,'ona','on')|U] zdůrazňuje, jak důležitý tento blót je, a dodává, že lid bude jeho vůdce pokládat za skutečného právoplatného držitele úřadu [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] v panství [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier].\n\n„Vykonáš blót pro lid?“"
 blotsven.0001.a: "Zajímavá vyhlídka. Prozkoumám ji."
 blotsven.0001.a.tt: "Zahájit a dokončit aktivitu blótu a získat nárok."
 blotsven.0001.b: "Pche, nikdy!"
 blotsven.0001.b.tt: "Vzdáváš se této příležitosti potěšit bohy."
 blotsven.0002.t: "Šílený misionář"
 blotsven.0002.desc: "Když má blót začít, vyruší mě z přísahy na železný kruh rozruch. Do našeho posvátného kruhu se hrne křičící muž s rudou tváří a jeho stoupenci.\n\n„Zastavte se ve jménu božstva [eskil.GetFaith.HighGodName]!“ vykřikne a vztáhne ruce k nebi. „Ztrestej pohany, kteří by dopustili tento zlovolný čin!“\n\nJako na jeho povel se rozprší a obzor rozřízne strašlivý blesk."
 blotsven.0002.a: "Zvednout nejbližší kámen a hodit jej po něm."
 blotsven.0002.a.tt: "Kamenování misionářů není nic neslýchaného."
 blotsven.0002.b: "Popadnout sekeru a zamířit mu na hlavu."
 blotsven.0002.b.tt: "Ten hrom zjevně znamená, že Thor přichází ztrestat #S jeho#!"
 blotsven.0002.c: "Něco v jeho řeči mě okouzlilo..."
 blotsven.0002.c.tt: "Zastavit blót a obrátit se k víře [eskil.GetFaith.GetName]."
 blotsven.0002.toast.m.tt: "[eskil.Custom('CZ_TitledFirstName_A')] [Select_CString(ROOT.Char.IsFemale,'jsem zmrzačila','jsem zmrzačil')]."
 blotsven.0002.toast.k.tt: "[eskil.Custom('CZ_TitledFirstName_A')] [Select_CString(ROOT.Char.IsFemale,'jsem zabila','jsem zabil')]."
 blotsven.0003.t: "Rozzlobený misionář"
 blotsven.0003.desc: "[eskil.GetTitledFirstName] s výkřikem odskočí. Můj hod minul a teď čelím ještě rozzuřenějšímu misionáři."
 blotsven.0003.a: "Zabijte ho!"
 blotsven.0003.a.tt: "Přikázat lidem kolem sebe, aby udělali to, co se mi nepodařilo."
 blotsven.0003.b: "Je to znamení? Možná je jeho bůh mocnější než můj..."
 blotsven.0003.b.tt: "Zastavit blót a obrátit se k víře [eskil.GetFaith.GetName]."
 blotsven.0003.toast.tt: "[eskil.GetTitledFirstName] byl popraven na můj rozkaz."
 blotsven.0003.toast.desc.tt: "Jeho lidé zvednou mrtvolu a odnesou ji zpátky do Tuny."
 blotsven.0004.t: "Návrat po znovuzrození"
 blotsven.0004.desc: "Kruh lidí se rozpadl. Po malých skupinách nebo jednotlivě scházejí z kopce. Cítím se jako [Select_CString(ROOT.Char.IsFemale,'nová žena','nový muž')]. Možná mi nepřipadlo království, ale má věčná duše je zachráněna."
 blotsven.0004.a: "Je čas jít domů."
 gruesome_activity_eskil_slain_title: "Zabití Eskila"
 gruesome_activity_eskil_slain: "Eskil byl zabit. Za svou oběť byl prohlášen za svatého."
