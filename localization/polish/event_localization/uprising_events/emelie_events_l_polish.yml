l_polish:
 blotsven.0001.t: "Nečekaná návštěva" # todo: NEW TRANSLATION
 blotsven.0001.desc: "Pozdě jedné noci [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] zaklepe na mé dveře a poví mi, že lidé jsou rozrušení. [ROOT.Char.GetTopLiege.GetTitledFirstName] odmítá uspořádat každoroční blót, ale bez něj nás všechny čekají sváry a hladomor! [chaplain.GetSheHe|U] mi zdůrazňuje, jak je tento blót důležitý, a říká, že lidé budou vůdce tohoto blótu považovat za skutečného právoplatného [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] z [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier].\n\n„Uspořádáš blót pro lid?“" # todo: NEW TRANSLATION
 blotsven.0001.a: "To je zajímavá vyhlídka, podívám se na to." # todo: NEW TRANSLATION
 blotsven.0001.a.tt: "Zahaj a dokonči aktivitu blótu, abys získal(a) nárok." # todo: NEW TRANSLATION
 blotsven.0001.b: "Pche, nikdy!" # todo: NEW TRANSLATION
 blotsven.0001.b.tt: "Zříkáš se této příležitosti potěšit bohy." # todo: NEW TRANSLATION
 blotsven.0002.t: "Rozzuřený misionář" # todo: NEW TRANSLATION
 blotsven.0002.desc: "Když má blót začít, vyruší mě rozruch právě ve chvíli, kdy mám složit přísahu na železný kruh. Do našeho posvátného kruhu vtrhne rudolící muž, který křičí, a jeho následovníci.\n\n„Jménem [eskil.GetFaith.HighGodName] přestaňte!“ vykřikne a vrhne ruce k nebi. „Ztrestej pohany, kteří by takový ničemný čin strpěli!“\n\nJako by na jeho příkaz začne pršet a strašlivý blesk protne obzor." # todo: NEW TRANSLATION
 blotsven.0002.a: "Zvednu nejbližší kámen a mrštím jím po něm." # todo: NEW TRANSLATION
 blotsven.0002.a.tt: "Kamenování misionářů není nic nevídaného." # todo: NEW TRANSLATION
 blotsven.0002.b: "Popadnu sekeru a zamířím mu na hlavu." # todo: NEW TRANSLATION
 blotsven.0002.b.tt: "Tenhle hrom je očividně Thor, který ho přichází #S ztrestat#!" # todo: NEW TRANSLATION
 blotsven.0002.c: "Něco na tom, jak mluví, mě okouzlilo..." # todo: NEW TRANSLATION
 blotsven.0002.c.tt: "Zastav blót a konvertuj k víře [eskil.GetFaith.GetName]." # todo: NEW TRANSLATION
 blotsven.0002.toast.m.tt: "Zmrzačil(a) jsem [eskil.GetTitledFirstName]." # todo: NEW TRANSLATION
 blotsven.0002.toast.k.tt: "Zabil(a) jsem [eskil.GetTitledFirstName]." # todo: NEW TRANSLATION
 blotsven.0003.t: "Rozhněvaný misionář" # todo: NEW TRANSLATION
 blotsven.0003.desc: "[eskil.GetTitledFirstName] s výkřikem uskočí. Minul(a) jsem ho a teď mám na krku ještě rozzlobenějšího misionáře." # todo: NEW TRANSLATION
 blotsven.0003.a: "Zabijte ho!" # todo: NEW TRANSLATION
 blotsven.0003.a.tt: "Přikaž lidem kolem sebe, aby udělali to, co se nepodařilo tobě." # todo: NEW TRANSLATION
 blotsven.0003.b: "Je to znamení? Možná je jeho bůh silnější než můj..." # todo: NEW TRANSLATION
 blotsven.0003.b.tt: "Zastav blót a konvertuj k víře [eskil.GetFaith.GetName]." # todo: NEW TRANSLATION
 blotsven.0003.toast.tt: "[eskil.GetTitledFirstName] byl na můj rozkaz popraven." # todo: NEW TRANSLATION
 blotsven.0003.toast.desc.tt: "Jeho lidé zvednou jeho mrtvolu a odnesou ji zpět do Tuny." # todo: NEW TRANSLATION
 blotsven.0004.t: "Návrat jako znovuzrozený" # todo: NEW TRANSLATION
 blotsven.0004.desc: "Kruh lidí zmizel; po malých skupinkách nebo o samotě sestupují z kopce. Cítím se jako nový [ROOT.Char.GetWomanMan]. Možná jsem nezískal(a) království, ale má věčná duše je zachráněna." # todo: NEW TRANSLATION
 blotsven.0004.a: "Je čas jít domů." # todo: NEW TRANSLATION
 gruesome_activity_eskil_slain_title: "Eskil zabit" # todo: NEW TRANSLATION
 gruesome_activity_eskil_slain: "Eskil byl zabit. Za svou oběť byl prohlášen za svatého." # todo: NEW TRANSLATION
