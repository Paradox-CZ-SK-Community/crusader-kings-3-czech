l_polish:
 vassal_interaction.0001.opening: "[actor.Custom2('GreetingToVassal', ROOT.Char)]"
 vassal_interaction.0001.desc: "Žádám, abys okamžitě ukončil válku proti [defender.GetTitledFirstName], [Select_CString(defender.IsFemale, 'vládkyni', 'vládci')] [defender.GetPrimaryTitle.GetName]!\n\nPanství vydrží, pokud budeme stát při sobě, ne proti sobě."
 vassal_interaction.0001.a: "Tvá vůle je mi rozkazem."
 vassal_interaction.0001.b: "Je to otázka cti, které se nelze jen tak vzdát."
 vassal_interaction.0001.request_favor_tt: "Výměnou žádám [Concept('favor','laskavost')|E]"
 vassal_interaction.0001.request_gold_tt: "Výměnou žádám zlato"
 vassal_interaction.0001.accept: "[actor.GetFirstNameNoTooltip] mou žádost přijímá"
 vassal_interaction.0001.decline: "[actor.GetFirstNameNoTooltip] odmítá"
 vassal_interaction.0001.c: "Do této války jsem už vložil tolik..."
 vassal_interaction.0001.d: "Ne, dotáhnu to až do konce!"
 vassal_interaction.0001.e: "Ne. A ty mě nezastavíš!"
 vassal_interaction.0002.opening: "[recipient.Custom2('GreetingToLiege', ROOT.Char)]"
 vassal_interaction.0002.desc: "Samozřejmě se podřídím tvému moudrému přání. Má věc je sice spravedlivá, ale pro dobro Panství od ní prozatím upustím."
 vassal_interaction.0002.a: "Poslušný služebník je dobrý služebník."
 vassal_interaction.0003.desc: "Jsem příliš blízko svému cíli, než abych se ho vzdal bez náhrady. Ustoupím, pokud mi slíbíš budoucí odškodnění."
 vassal_interaction.0003.a: "Máš mé slovo."
 vassal_interaction.0003.b: "Měl bys mě poslechnout bez jakýchkoli podmínek!"
 vassal_interaction.0003.b.tt: "Válka pokračuje"
 vassal_interaction.0004.desc: "Tato válka mě stála příliš mnoho, než abych ji teď opustil. Menší příspěvek na doplnění mé pokladnice by mě však mohl přesvědčit."
 vassal_interaction.0004.a: "Odškodnění je jen spravedlivé."
 vassal_interaction.0004.b: "To je nehorázná částka!"
 vassal_interaction.0005.opening: "[recipient.Custom2('GreetingToLiege', ROOT.Char)]"
 vassal_interaction.0005.desc: "Tvých přání si nesmírně vážím, ale kostky už byly vrženy. Tuto válku dotáhnu až do konce."
 vassal_interaction.0005.a: "Jak se opovažuješ mi vzdorovat!"
 vassal_interaction.0005.b: "Budu to muset přijmout. Tentokrát."
 vassal_interaction.0006.desc: "Tvá věc je spravedlivá a nebylo by fér žádat to po tobě bez náhrady."
 vassal_interaction.0006.favor: "Za tohle ti budu zavázán."
 vassal_interaction.0006.gold: "Nahradím ti zlato, o které jsi přišel, pokud boje okamžitě skončí."
 vassal_interaction.0006.a: "Děkuji za tvou laskavost."
 vassal_interaction.0006.b: "Děkuji za tvou štědrost."
 vassal_interaction.0007.desc: "Pobuřuje mě, že za splnění rozkazu svého lenního pána požaduješ úplatek! To, cos mi poslal, není ničím jiným než nečestným odmítnutím mého požadavku!"
 vassal_interaction.0007.a: "Dobrá. Musím se vrátit k válce."
 vassal_interaction.0011.desc: "Nárok, který vznáší [attacker.GetTitledFirstName], je oprávněný. Žádám, aby ses okamžitě vzdal a obnovil tak v Panství pořádek."
 vassal_interaction.0011.a: "Pokud to tak musí být, podřídím se."
 vassal_interaction.0011.b: "Prosím, nežádej mě, abych se bez náhrady vzdal své cti."
 vassal_interaction.0011.c: "Žádáš ode mě nákladnou oběť..."
 vassal_interaction.0011.d: "Ne, budu se bránit!"
 vassal_interaction.0012.desc: "Prosím, zvaž, kolik toho po mně žádáš. Je-li to však tvá vůle, vzdám se [attacker.GetTitledFirstName]. Pro dobro Panství."
 vassal_interaction.0012.a: "Odměna za věrnost vždy časem přijde."
 vassal_interaction.0013.desc: "Pokud ukončím válku proti [attacker.GetTitledFirstName], mnoho ztratím. Ustoupit mohu jedině tehdy, pokud mi slíbíš budoucí odškodnění."
 vassal_interaction.0014.desc: "Kapitulace by mě stála příliš mnoho. Pokud mi však tuto ztrátu nahradíš, mohu tvému požadavku vyhovět."
 vassal_interaction.0015.desc: "Kapitulací bych ztratil příliš mnoho. Nechci neposlechnout, ale [attacker.GetTitledFirstName] mi nedává jinou možnost."
 vassal_interaction.0016.gold: "Nahradím ti tvé ztráty, pokud boje okamžitě skončí."
 vassal_interaction.0016.a: "Alespoň jsem ještě neztratil všechno."
 vassal_interaction.0016.b: "Tohle mi pomůže vzpamatovat se."
 vassal_interaction.you_owe_me: "Uděláš, co ti říkám!"
 vassal_interaction.war_ender_gives_up: "[recipient.GetShortUIName|U] na rozkaz, který vydal [actor.GetShortUIName], ukončil válku"
 vassal_interaction.0022.desc: "Píši ti, abych tě informoval, že jsem tvému spoluvazalovi [recipient.GetName] udělil nezávislost."
 vassal_interaction.0022.a: "Dobrá."
 vassal_interaction.0023.desc: "Píši ti, abych tě informoval, že jsem svému vazalovi [recipient.GetName] udělil nezávislost."
 vassal_interaction.0023.a: "Dobrá."
 vassal_interaction.0030.desc: "Tvá prosba je oprávněná a tvé argumenty mě přesvědčily.\n\nTímto ti navždy odpouštím všechny zločiny, kterých ses dosud dopustil v očích [recipient.GetPrimaryTitle.GetNameNoTooltip]. Zůstaneš [Select_CString(actor.IsFemale, 'svobodnou ženou', 'svobodným mužem')]!"
 vassal_interaction.0030.a: "Konečně jsem v bezpečí!"
 vassal_interaction.0040.desc: "Titul [target.GetBaseName] sice držíš ty, ale všem je jasné, že jej #EMP spravuji já#!. Na jeho četné [county_in_title.Custom('TerrainTypeProvince')|l] a vesnice dohlížejí #EMP moji#! rychtáři a #EMP moji#! úředníci.\n\nProto na něj vznáším nárok. Můžeš mi jej udělit, kdykoli budeš chtít. Pokud tak neučiníš, jsem si jist, že mi časem připadne tak jako tak.\n\nTak či onak."
 vassal_interaction.0040.a: "[actor.GetFirstNameNoTooltip] jsem nechal až příliš zesílit..."
 