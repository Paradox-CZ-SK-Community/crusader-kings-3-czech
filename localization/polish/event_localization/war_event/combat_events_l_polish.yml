l_polish:
 combat_event.0003.t: "[Select_CString(ROOT.Char.IsFemale,'Neporazitelná','Neporazitelný')]"
 combat_event.0003.desc.opening: "Sto bitev, sto vítězství!"
 combat_event.0003.desc.commander: "Po svém posledním vítězství nad [enemy_commander.GetTitledFirstName] a vojskem, kterému [Select_CString(enemy_commander.IsFemale,'velela','velel')],"
 combat_event.0003.desc.no_commander: "Po svém posledním vítězství v bitvě"
 combat_event.0003.desc.ending: "jsem konečně [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] tohoto významného milníku.\n\nJediná porážka mi dosud zůstala cizí, a tak se už dlouho šeptá, že mě nelze porazit, že jsem nezlomná síla, kterou nikdo nepřemůže. Začíná se zdát, že na těch řečech možná opravdu něco je..."
 combat_event.0003.desc.alt_ending: "jsem konečně [Select_CString(ROOT.Char.IsFemale,'dosáhla','dosáhl')] tohoto významného milníku.\n\nS každou vyhranou bitvou sílily zvěsti o mé udatnosti. Teď, když mé činy překonaly i skutky z legend, mohu právem tvrdit, že mě nelze porazit, že jsem nezlomná síla, kterou nikdo nepřemůže."
 combat_event.0003.a: "Ať celý svět slyší o mém umění!"
 combat_event.0003.b: "Nesmím propadnout pýše. Stačí jediný zbloudilý šíp."
 combat_event.0003.b.zealous: "Nejsem nic než [ROOT.Char.GetFaith.HighGodNamePossessive] [ROOT.Char.Custom('signature_weapon')]; válečné božstvo [ROOT.GetCharacter.GetFaith.WarGodName] skrze mě pouze prosazuje svou vůli."
 combat_event.0004.t: "Pád kolosu"
 combat_event.0004.desc: "[enemy_commander.Custom2('MyCharacterIntroduction', ROOT.Char)|U] je legendou mezi veliteli. Celý svět zná příběh více než stovky bitev bez jediné porážky.\n\nPřesto dnes [enemy_commander.GetFirstName] na bitevním poli [Select_CString(enemy_commander.IsFemale,'poznala porážku','poznal porážku')] z mé ruky a celý svět viděl, že ani taková legenda není neomylná!"
 combat_event.0004.a: "I ty největší legendy skolí [ROOT.Char.Custom('signature_weapon')]!"
 combat_event.0004.b: "Když lze porazit i [enemy_commander.GetFirstName], lze porazit i mě."
 combat_event.0004.b.zealous: "Válečné božstvo [ROOT.GetCharacter.GetFaith.WarGodName] ukázalo, že ani [enemy_commander.GetWomanMan] není neporazitelná bytost."
 combat_event.0005.t: "Pád kolosu"
 combat_event.0005.desc: "Dnes se stalo nemyslitelné, v bitvě mě [Select_CString(friendly_commander.IsFemale,'porazila','porazil')] [friendly_commander.Custom2('MyCharacterIntroduction', ROOT.Char)]! Už se mi opravdu začínalo zdát, že nemohu nikdy prohrát, teď ale přišlo pokoření a tvrdý návrat na zem.\n\nMá pověst tuto porážku ještě přežije, ale [friendly_commander.GetFirstName] mi [Select_CString(friendly_commander.IsFemale,'sebrala','sebral')] část slávy a věhlasu."
 combat_event.0005.a: "Za porážku někoho, jako jsem já, si [friendly_commander.GetFirstName] zaslouží uznání."
 combat_event.0005.b: "Nepřijatelné! [friendly_commander.GetFirstName] bude litovat dne, kdy se mi [Select_CString(friendly_commander.IsFemale,'postavila','postavil')]!"
 combat_event.0005.message: "Po porážce v bitvě [enemy_commander.GetTitledFirstName] zuří a přísahá mi pomstu!"
 combat_event.1002.pow_message.t: "Zajetí nepřátelských bojovníků"
 combat_event.1002.pow_message.desc.single: "[primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] je mezi těmi, které tvé síly zajaly"
 combat_event.1002.pow_message.desc.double: "[primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] a [secondary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)] jsou mezi těmi, které tvé síly zajaly"
 combat_event.1002.pow_message.desc.multiple: "[primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] a dalších [ROOT.Var('num_other_relevant_captured_combatants').GetValue|V0] jsou mezi těmi, které tvé síly zajaly"
 combat_event.1002.pow_message.desc.end: "po vítězství v [Concept('battle','bitvě')|E] u [combat_location.GetName]!"
 combat_event.1003.pow_message.t: "Zajetí spojeneckých bojovníků"
 combat_event.1003.pow_message.desc.single: "[primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] má nyní status [Concept('prisoner_of_war',Select_CString(primary_prisoner.IsFemale,'válečné zajatkyně','válečného zajatce'))|E]"
 combat_event.1003.pow_message.desc.double: "[primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] a [secondary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)] mají nyní status [Concept('prisoners_of_war','válečných zajatců')|E]"
 combat_event.1003.pow_message.desc.multiple: "[primary_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] a dalších [ROOT.Var('num_other_relevant_captured_combatants').GetValue|V0] mají nyní status [Concept('prisoners_of_war','válečných zajatců')|E]"
 combat_event.1003.pow_message.desc.end: ". Vítězem [Concept('battle','bitvy')|E] u [combat_location.GetName] je tvůj nepřítel [combat_winner.GetTitledFirstName]!"
 combat_event.1004.pow_message.t: "[ROOT.Char.Custom2('RelationToMeShort', primary_prisoner)|U] [Select_CString(primary_prisoner.IsFemale,'zajata','zajat')]"
 combat_event.1004.pow_message.desc.end: ". Vítězem [Concept('battle','bitvy')|E] u [combat_location.GetName] je [combat_winner.Custom2('YourCharacterIntroduction', ROOT.Char)]!"
 combat_event.1005.pow_toast.t: "Zajetí nepřátelských bojovníků"
 combat_event.1005.pow_toast.desc: "[valuable_prisoner.Custom2('NamePossessiveCharacterIntroduction', primary_combat_loser)|U] je po [Concept('battle','bitvě')|E] u [combat_location.GetName] v zajetí tvých sil jako [Concept('prisoner_of_war',Select_CString(valuable_prisoner.IsFemale,'válečná zajatkyně','válečný zajatec'))|E]!"
 combat_event.1005.pow_toast.desc.primary: "Tvůj nepřítel [valuable_prisoner.GetTitledFirstName] je po [Concept('battle','bitvě')|E] u [combat_location.GetName] v zajetí tvých sil jako [Concept('prisoner_of_war',Select_CString(valuable_prisoner.IsFemale,'válečná zajatkyně','válečný zajatec'))|E]!"
 combat_event.1006.pow_toast.t: "[Select_CString(valuable_prisoner.IsFemale,'Dědička zajata','Dědic zajat')]"
 combat_event.1006.pow_toast.desc: "[valuable_prisoner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] je po [Concept('battle','bitvě')|E] u [combat_location.GetName] [Concept('prisoner_of_war',Select_CString(valuable_prisoner.IsFemale,'válečnou zajatkyní','válečným zajatcem'))|E]. Vítězem je [combat_winner.GetTitledFirstName]!"
