l_polish:
 designated_sacrifice_died.t: "Určená oběť zemřela"
 designated_sacrifice_died.desc: "[dead_designated_sacrifice.GetShortUIName|U] už nebude možné obětovat, protože smrt přišla dříve. [ROOT.Char.GetFaith.HighGodName] tak tuto oběť neobdrží. [ROOT.Char.GetFaith.AltPriestTermPlural] i lid dávají najevo nespokojenost."
 designated_sacrifice_release.t: "Určená oběť propuštěna"
 designated_sacrifice_released.desc: "[released_designated_sacrifice.GetShortUIName|U] získává svobodu namísto obětování. [ROOT.Char.GetFaith.HighGodName] tak tuto oběť neobdrží. [ROOT.Char.GetFaith.AltPriestTermPlural] i lid dávají najevo nespokojenost."
 designated_human_sacrifice_modifier: "Určená lidská oběť"
 designated_human_sacrifice_modifier_desc: "Tato postava byla z boží vůle určena k lidské oběti. Alespoň to tvrdí ten, kdo ji drží v zajetí."
 human_sacrifice.0001.t: "Žízniví bohové"
 human_sacrifice.0001.desc: "Už je to několik let, co jsem [Select_CString(ROOT.Char.IsFemale,'vedla','vedl')] nájezd za zajatci a všude při něm znělo jméno [ROOT.Char.GetFaith.HighGodName], ale dodnes nebyli obětováni všichni významní zajatci, kteří na konci konfliktu padli do mého zajetí. [ROOT.Char.GetFaith.AltPriestTermPlural] ztrácejí trpělivost a prostý lid šeptá, že [ROOT.Char.GetFaith.WarGodName] ode mě odvrací svůj zrak."
 human_sacrifice.0001.a: "Počkat, opožděná oběť snad pořád postačí?"
 human_sacrifice.0001.b: "Jejich pohrdání snáším stoicky."
 human_sacrifice.0001.c: "Takové barbarství je mě nedůstojné."
 human_sacrifice_coward_modifier: "Rozhněvaní žízniví bohové"
 human_sacrifice_coward_modifier_desc: "O této postavě je známo, že se před božstvy plazí a hledá výmluvy."
 flowery_war_cb_ended_invalid.t: "Válka zneplatněna"
 flowery_war_cb_ended_invalid.desc_other_sacrifices_attacker: "Válka [war.GetName] skončila: potřebné oběti se podařilo získat jinde."
 flowery_war_cb_ended_invalid.desc_other_sacrifices_defender: "Válka [war.GetName] skončila: [attacker.GetShortUIName] už má vhodné oběti získané jinde."
 flowery_war_cb_ended_invalid.desc_no_sacrificers: "Válka [war.GetName] skončila: ani jeden z hlavních účastníků otevřeně nepraktikuje lidské oběti."
