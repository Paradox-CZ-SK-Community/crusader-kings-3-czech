l_polish:
 designated_sacrifice_died.t: "Označená oběť zemřela"
 designated_sacrifice_died.desc: "[dead_designated_sacrifice.GetShortUIName|U] [Select_CString(dead_designated_sacrifice.IsFemale,'zemřela','zemřel')] dříve, než jsem [Select_CString(dead_designated_sacrifice.IsFemale,'mohla','mohl')] obětovat [dead_designated_sacrifice.GetHerHim] [ROOT.Char.GetFaith.HighGodName]. Moji [ROOT.Char.GetFaith.AltPriestTermPlural] i lidé jsou nespokojeni."
 designated_sacrifice_release.t: "Označená oběť propuštěna"
 designated_sacrifice_released.desc: "[released_designated_sacrifice.GetShortUIName|U] [Select_CString(released_designated_sacrifice.IsFemale,'byla','byl')] [Select_CString(released_designated_sacrifice.IsFemale,'propuštěna','propuštěn')] místo toho, aby [Select_CString(released_designated_sacrifice.IsFemale,'byla','byl')] [Select_CString(released_designated_sacrifice.IsFemale,'obětována','obětován')] [ROOT.Char.GetFaith.HighGodName]. Moji [ROOT.Char.GetFaith.AltPriestTermPlural] i lidé jsou nespokojeni."
 designated_human_sacrifice_modifier: "Určená lidská oběť"
 designated_human_sacrifice_modifier_desc: "Tuto postavu bohové označili k lidské oběti. Aspoň podle toho, kdo ji zajal."
 human_sacrifice.0001.t: "Žízniví bohové"
 human_sacrifice.0001.desc: "Už je to několik let, co jsem [Select_CString(ROOT.Char.IsFemale,'vedla','vedl')] květinovou válku ve jménu [ROOT.Char.GetFaith.HighGodName], ale stále jsem [Select_CString(ROOT.Char.IsFemale,'neobětovala','neobětoval')] všechny prominentní zajatce z konce konfliktu. Moji [ROOT.Char.GetFaith.AltPriestTermPlural] netrpělivě vyhlížejí a obyčejní lidé šeptají, že [ROOT.Char.GetFaith.WarGodName] [Select_CString(ROOT.Char.IsFemale,'odvrátila','odvrátil')] [ROOT.Char.GetFaith.WarGodHerHis] zrak ode mě."
 human_sacrifice.0001.a: "Počkej, jistě postačí i pozdní oběť?"
 human_sacrifice.0001.b: "Jejich opovržení snáším stoicky."
 human_sacrifice.0001.c: "Takové barbarství mi nesluší."
 human_sacrifice_coward_modifier: "Uražení žízniví bohové"
 human_sacrifice_coward_modifier_desc: "Tato postava je známá tím, že se před bohy podlézavě klaní a hledá výmluvy."
 flowery_war_cb_ended_invalid.t: "Válka zneplatněna"
 flowery_war_cb_ended_invalid.desc_other_sacrifices_attacker: "Válka [war.GetName] skončila: [Select_CString(ROOT.Char.IsFemale,'získala','získal')] jsem oběti jinde."
 flowery_war_cb_ended_invalid.desc_other_sacrifices_defender: "Válka [war.GetName] skončila: [attacker.GetShortUIName] [Select_CString(attacker.IsFemale,'získala','získal')] vhodné oběti jinde."
 flowery_war_cb_ended_invalid.desc_no_sacrificers: "Válka [war.GetName] skončila: žádný z hlavních účastníků veřejně nepraktikuje lidské oběti."
