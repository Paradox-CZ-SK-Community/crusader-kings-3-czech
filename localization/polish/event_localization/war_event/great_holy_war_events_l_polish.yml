l_polish:
 great_holy_war.0011.christian.t: "Křižáčtí králové"
 great_holy_war.0011.muslim.t: "Obnovený džihád"
 great_holy_war.0011.pagans.t: "Hněv starých bohů"
 great_holy_war.0011.fallback.t: "Do zbraně, [awakening_faith.GetAdherentNamePlural]!"
 great_holy_war.0011.catholic.rome.desc: "Řím, město svatého Petra a samotné sídlo papežství, padl do rukou nevěřících. Papež v exilu, [Select_CString(ghw_first_sponsor.IsFemale,'Její Svatost','Jeho Svatost')] [ghw_first_sponsor.GetTitledFirstName], proto [Select_CString(ghw_first_sponsor.IsFemale,'oznámila','oznámil')], že hodlá sjednotit křesťanské pány a získat věčné město zpět."
 great_holy_war.0011.christian.europe.desc: "Samotné srdce západního křesťanstva obléhají nevěřící! Zoufalí křesťanští páni se obrátili na [Select_CString(ghw_first_sponsor.IsFemale,'Její Svatost','Jeho Svatost')] [ghw_first_sponsor.GetTitledFirstName], která [Select_CString(ghw_first_sponsor.IsFemale,'oznámila','oznámil')], že hodlá vytvořit spravedlivou alianci a vyhnat pohany. [awakening_faith.WarGodName] má stát v čele této výpravy."
 great_holy_war.0011.christian.byzantion.desc: "Římská říše na východě. Byzanc, pevná bašta křesťanstva proti mohamedánským nevěřícím z Orientu, se hroutí. Zoufalá situace přiměla [Select_CString(ghw_first_sponsor.IsFemale,'Její Svatost','Jeho Svatost')] [ghw_first_sponsor.GetTitledFirstName] připustit možnost otevřené invaze spojených křesťanských sil."
 great_holy_war.0011.catholic.jerusalem.desc: "Křesťanští poutníci do Svaté země trpí všemožným příkořím a cesty, po nichž putují, jsou plné nebezpečí.\n\nAby byli poutníci chráněni a Jeruzalém zajištěn pro Krista a věřící, [Select_CString(ghw_first_sponsor.IsFemale,'Její Svatost','Jeho Svatost')] [ghw_first_sponsor.GetTitledFirstName] připouští možnost otevřené invaze spojených křesťanských sil."
 great_holy_war.0011.christian.fallback.desc: "Příliš dlouho [awakening_faith.GetAdjective] svět trpí pod krutostí kacířů a nevěřících. Už nedovolíme rouhačům pustošit naše posvátná místa ani falešným prorokům zesměšňovat naši víru. Je načase, aby se praví věřící sjednotili a udeřili proti nevěřícím! [awakening_faith.WarGodName] nás povede!"
 great_holy_war.0011.muslim.mecca.desc: "Stalo se nemyslitelné! Svaté město Mekka padlo do rukou nevěřících a už jejich pouhá přítomnost poskvrňuje Kaabu. [Select_CString(ghw_first_sponsor.IsFemale,'Její Vznešenost','Jeho Vznešenost')] [ghw_first_sponsor.GetTitledFirstName] [Select_CString(ghw_first_sponsor.IsFemale,'vyhlásila','vyhlásil')], že světu nastává nová éra džihádu. Svaté město musí být za každou cenu získáno zpět. Všichni pravověrní muslimové se musí připravit, aby se v nadcházejících bojích připojili k řadám mudžáhidů."
 great_holy_war.0011.muslim.jerusalem.desc: "Svaté město Jeruzalém, odkud byl Prorok vzat na nebesa, padlo do rukou nevěřících! [Select_CString(ghw_first_sponsor.IsFemale,'Její Vznešenost','Jeho Vznešenost')] [ghw_first_sponsor.GetTitledFirstName] to nenechá bez odpovědi a [Select_CString(ghw_first_sponsor.IsFemale,'vyhlásila','vyhlásil')] příchod nové éry velkých výbojů, jaké svět zažil za prvních chalífů. Dár al-islám musí být ubráněn! Všichni pravověrní muslimové se musí připravit, aby se v nadcházejících bojích připojili k řadám mudžáhidů."
 great_holy_war.0011.muslim.arabia.desc: "V samotném srdci Domu islámu útočí [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')] a uvrhují jej do smrtelného nebezpečí. [Select_CString(ghw_first_sponsor.IsFemale,'Její Vznešenost','Jeho Vznešenost')] [ghw_first_sponsor.GetTitledFirstName] proto [Select_CString(ghw_first_sponsor.IsFemale,'vyhlásila','vyhlásil')], že světu nastává nová éra džihádu. Jádro dár al-islámu musí být za každou cenu získáno zpět. Všichni pravověrní muslimové se musí připravit, aby se v nadcházejících bojích připojili k řadám mudžáhidů."
 great_holy_war.0011.muslim.africa.desc: "V Africe útočí na Dům islámu [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')] a uvrhují jej do smrtelného nebezpečí. [Select_CString(ghw_first_sponsor.IsFemale,'Její Vznešenost','Jeho Vznešenost')] [ghw_first_sponsor.GetTitledFirstName] proto [Select_CString(ghw_first_sponsor.IsFemale,'vyhlásila','vyhlásil')], že světu nastává nová éra džihádu. Západní oblasti ummy musí být za každou cenu získány zpět. Všichni pravověrní muslimové se musí připravit, aby se v nadcházejících bojích připojili k řadám mudžáhidů."
 great_holy_war.0011.muslim.fallback.desc: "Dům islámu je vážně ohrožen nevěřícími a odpadlíky. Všichni pravověrní věřící [awakening_faith.GetAdjective] světa se musí připravit, aby se v nadcházejících bojích připojili k řadám mudžáhidů. Nastává nová éra islámské expanze."
 great_holy_war.0011.generic.fallback.head.desc: "[awakening_faith.GetReligion.GetAdjective] svět je ze všech stran sužován rouhači, a tak [ghw_first_sponsor.GetTitledFirstName] [Select_CString(ghw_first_sponsor.IsFemale,'rozhodla','rozhodl')], že nadešel čas, aby se všichni bojovníci víry chopili zbraní, bránili svá posvátná místa a začali plánovat velkolepé tažení za náboženským dobytím. [awakening_faith.WarGodName] je povede do boje."
 great_holy_war.0011.generic.fallback.desc: "Už nemůžeme nečinně přihlížet, jak nás rouhači ze všech stran sužují, znesvěcují naše posvátná místa a týrají naše souvěrce. Je načase, aby se bojovníci víry sjednotili a chopili zbraní. [awakening_faith.WarGodName] bude stát při nás."
 great_holy_war.0011.generic.ending.positive: "\n\n[awakening_faith.GetReligion.GetAdjective] svět vstupuje do nové éry velkých svatých válek, [awakening_faith.GHWNamePlural]."
 great_holy_war.0011.generic.ending.negative: "\n\n[awakening_faith.GetReligion.GetAdjective] svět možná vstupuje do éry dosud nevídané agrese."
 great_holy_war.0011.generic.ending.coreligionist.head: "\n\nO teologických důsledcích této zprávy již jedná [other_pope.GetTitleTierName] spolu s dalšími významnými členy našeho duchovenstva. Chtějí následovat příklad, který nyní dávají [awakening_faith.GetAdherentNamePluralNoTooltip], a zahájit novou éru náboženských válek. Jejich společným praporem se má stát [ROOT.Char.GetFaith.GetNameNoTooltip]."
 great_holy_war.0011.generic.ending.coreligionist.autonomous: "\n\nO teologických důsledcích této zprávy již jedná několik významných členů našeho duchovenstva. Chtějí následovat příklad, který nyní dávají [awakening_faith.GetAdherentNamePluralNoTooltip], a zahájit novou éru náboženských válek. Jejich společným praporem se má stát [ROOT.Char.GetFaith.GetNameNoTooltip]."
 great_holy_war.0011.directed.a: "Mé vojsko se k tažení připojí okamžitě!"
 great_holy_war.0011.directed.b: "Budu bránit své souvěrce, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!"
 great_holy_war.0011.a: "Deus Vult!"
 great_holy_war.0011.b: "Alláhu akbar!"
 great_holy_war.0011.c: "[ROOT.Char.GetFaith.WarGodName|U] je s námi!"
 great_holy_war.0011.d: "[ROOT.Char.GetFaith.WarGodName|U] nás ochraňuj!"
 great_holy_war.0011.e: "Když to říkají..."
 great_holy_war.0011.tooltip.effect: "[awakening_faith.GetReligion.GetAdjective] svět nyní může prostřednictvím svých [Concept('faiths','vír')|E] vyhlašovat [awakening_faith.GHWNamePlural]"
 great_holy_war.0015.opening: "[scoped_pope.Custom2('AppropriateGreeting', ROOT.Char)]"
 great_holy_war.0016.custom: "Každý [scoped_pope.GetFaith.GetAdjective] [Concept('theocratic','teokratický')|E] vazal"
 great_holy_war.0015.desc: "Tvá přislíbená podpora spravedlivému boji proti nevěřícím ti přinesla vykoupení. [scoped_pope.GetFaith.WarGodName] ti znovu prokazuje přízeň, a proto ti opět dovolujeme účast na svatém přijímání."
 great_holy_war.0015.a: "Už bylo načase..."
 great_holy_war.0015.b: "Vskutku, [scoped_pope.GetFaith.WarGodName] prokazuje milosrdenství!"

 great_holy_war.0016.desc.a: "Jsme hluboce zklamáni tvým rozhodnutím opustit spravedlivou věc, kterou má naplnit [scoped_pope.GetFaith.GHWName]. Tuto urážku nezapomeneme. [scoped_pope.GetFaith.WarGodName] také ne."
 great_holy_war.0016.desc.b: "Jsme hluboce zklamáni a znepokojeni tvým rozhodnutím opustit spravedlivou věc, kterou má naplnit [scoped_pope.GetFaith.GHWName]. Tvé rouhání tě zostudilo a [scoped_pope.GetFaith.WarGodName] je toho svědkem."
 great_holy_war.0016.desc.c: "Nebudeme tolerovat tvé rouhačské chování. Odmítáš přislíbit podporu svaté věci, kterou představuje [scoped_pope.GetFaith.GHWName], a nám proto nezbývá než tě vyobcovat. Od této chvíle ti zakazujeme účast na svatém přijímání."
 great_holy_war.0016.a: "Mám důležitější starosti."
 great_holy_war.0016.b: "Co jsem to udělal?!"
 great_holy_war.0017.title: "Odvolání podpory pro [scoped_pope.GetFaith.GHWName]"
 great_holy_war.0017.desc.a: "Když vezmu svůj slib zpět, [scoped_pope.GetFaith.GHWName] přijde o mou podporu. Tím si u duchovenstva jistě pohorším a možná na sebe přivolám i hněv Svatého stolce. \n\nNež se definitivně rozhodnu, musím vážně zvážit možné následky. Církev by mě totiž mohla označit za [Select_CString(ROOT.Char.IsFemale,'kacířku','kacíře')]."
 great_holy_war.0017.desc.b: "Když vezmu svůj slib zpět, [scoped_pope.GetFaith.GHWName] přijde o mou podporu. Tím si u duchovenstva jistě pohorším a [scoped_pope.GetTitledFirstName] se na mě může rozhněvat. Než se definitivně rozhodnu, musím vážně zvážit možné následky. Mohl by na mně totiž ulpět cejch [Select_CString(ROOT.Char.IsFemale,'rouhačky','rouhače')]."
 great_holy_war.0017.a: "Je mi to jedno."
 great_holy_war.0017.b: "Možná jednám příliš ukvapeně..."
 great_holy_war.0018.desc: "Pokud přislíbím svou účast, [scoped_pope.GetFaith.GHWName] mě zaváže shromáždit vojsko a v pravý čas vytáhnout proti nepřátelům víry. \n\n[scoped_pope.GetTitledFirstName] by však porušení mého slova [Select_CString(scoped_pope.IsFemale,'jistě neschvalovala','jistě neschvaloval')], takže než své panství zavážu k boji, musím toto rozhodnutí důkladně zvážit."
 great_holy_war.0018.a: "Připojím se k vojsku! [scoped_pope.GetFaith.WarGodName] nás povede!"
 great_holy_war.0018.b: "Musím si to ještě trochu promyslet..."
 great_holy_war.0003.title: "Věřící se chystají do války"
 great_holy_war.0003.catholic.desc: "Na můj dvůr dorazil papežský vyslanec se zprávami z Vatikánu. [ghw_sponsor.GetTitledFirstName] [Select_CString(ghw_sponsor.IsFemale,'vyzvala','vyzval')] všechny pravověrné křesťanské vládce do zbraně. Jako [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] a [ROOT.Char.GetTitleAsNameNoTooltip] mám povinnost připravit své muže na podporu této nejsvětější věci, za níž stojí sama všeobecná církev.\n\nSvatý stolec slibuje úplné rozhřešení ze všech hříchů a zaručené místo v nebi každému, kdo vytáhne proti odporným [target_character.Custom('GetUnbelieverNamePlural')], kteří znesvěcují posvátná místa v [target_kingdom.GetBaseNameNoTier]."
 great_holy_war.0003.fallback.desc: "Na můj dvůr dorazily skvělé zprávy. [ghw_sponsor.GetTitledFirstName] [Select_CString(ghw_sponsor.IsFemale,'rozhodla','rozhodl')], že nadešel čas, aby se všichni pravověrní [ghw_sponsor.GetFaith.GetAdherentNamePluralNoTooltip] sjednotili pod jediným praporem a vytáhli proti nepřátelům víry. Čeká nás [ghw_sponsor.GetFaith.GHWName] a [ghw_sponsor.GetFaith.WarGodName] bude tímto tažením oslaven.\n\nVšem, kdo se k tomuto posvátnému úsilí připojí, [ghw_sponsor.GetTitleTierName] zaručuje místo v [ghw_sponsor.GetFaith.DivineRealm]."
 great_holy_war.0003.a: "Mé vojsko bude připraveno k boji!"
 great_holy_war.0003.a.tt: "Přislíbíš, že se připojíš, jakmile [ghw_sponsor.GetTitledFirstName] zahájí následující tažení: [ghw_sponsor.GetFaith.GHWName]"
 great_holy_war.0003.b: "Na tuto svatou věc ochotně přispěji."
 great_holy_war.0003.c: "Možná bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] připojit..."
 great_holy_war.0003.a.lifted_excommunication: "Tvá [Concept('excommunication','exkomunikace')|E] bude zrušena"
 great_holy_war.0023.desc: "[scoped_pope.GetFaith.GHWName] se blíží, ale tvůj příslib podpory stále chybí. Musíme ti snad připomínat, že jako [scoped_pope.GetFaith.GetAdjectiveNoTooltip] [ROOT.GetCharacter.GetTitleTierName] máš posvátnou povinnost vést válku proti nevěřícím a [target_character.Custom('GetUnbelieverNamePlural')]?"
 great_holy_war.0023.desc.hooked: "[scoped_pope.GetFaith.GHWName] se blíží, ale tvůj příslib podpory stále chybí. To je nepřijatelné! Našimi nepřáteli jsou nevěřící a [target_character.Custom('GetUnbelieverNamePlural')]. Okamžitě se připoj k naší velké válce proti nim."
 great_holy_war.0003.a.hooked: "Moc na výběr asi nemám, že?"
 great_holy_war.0023.c: "Už bojuji! [target_character.Custom('GetUnbelieverNamePlural')] jsou přece moji nepřátelé!"
 great_holy_war.0023.d: "Tohle není má válka."
 great_holy_war.0024.dead.recipient.title: "[ghw_claimant.GetFirstNameNoTooltip] [Select_CString(ghw_claimant.IsFemale,'zemřela','zemřel')]"
 great_holy_war.0024.dead.recipient.replaced: "[the_faith.GHWName] má nyní [Select_CString(ghw_claimant.IsFemale,'novou právoplatnou kandidátku','nového právoplatného kandidáta')]: [ghw_claimant.GetTitledFirstName]."
 great_holy_war.0024.dead.recipient.open: "[former_recipient.GetTitledFirstName] [Select_CString(former_recipient.IsFemale,'zemřela','zemřel')], takže o [target_kingdom.GetBaseNameNoTier] se nyní může ucházet nejzbožnější válečník."
 great_holy_war.0028.dead.beneficiary_title: "Úmrtí příjemce"
 great_holy_war.0028.dead.beneficiary: "[former_beneficiary.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))]) [Select_CString(former_beneficiary.IsFemale,'zemřela','zemřel')]. [ROOT.Char.GetFaith.GHWName] proto potřebuje nového příjemce a já jej musím vybrat."
 great_holy_war.0029.invalid.beneficiary_title: "Nutná změna příjemce"
 great_holy_war.0029.converted.beneficiary: "[former_beneficiary.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))]) bohužel [Select_CString(former_beneficiary.IsFemale,'přestoupila','přestoupil')] k jiné víře. [ROOT.Char.GetFaith.GHWName] už proto s touto postavou jako příjemcem nepočítá a žádnou půdu nezíská."
 great_holy_war.0030.incapable.beneficiary: "[former_beneficiary.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))]) už bohužel není ve stavu vhodném pro roli mého příjemce. Vlastně ani pro cokoli jiného."
 great_holy_war.0030.excommunicated.beneficiary: "[former_beneficiary.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))]) [Select_CString(former_beneficiary.IsFemale,'byla exkomunikována','byl exkomunikován')]. [ROOT.Char.GetFaith.GHWName] proto potřebuje jiného příjemce."
 great_holy_war.0030.devoted.beneficiary: "[former_beneficiary.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))]) [Select_CString(former_beneficiary.IsFemale,'se rozhodla','se rozhodl')] složit sliby. [ROOT.Char.GetFaith.GHWName] proto potřebuje někoho jiného jako příjemce."
 great_holy_war.0030.sick.beneficiary: "[former_beneficiary.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))]) [Select_CString(former_beneficiary.IsFemale,'je příliš slabá a nemocná','je příliš slabý a nemocný')] na roli mého příjemce. Musím vybrat někoho jiného."
 great_holy_war.0030.ruler.beneficiary: "[former_beneficiary.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))]) nyní vládne a má vlastní povinnosti, takže už se pro roli mého příjemce nehodí."
 great_holy_war.0030.heir.beneficiary: "[former_beneficiary.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('former_beneficiary'))]) je nyní první v pořadí na dědictví vlastního titulu, takže už se pro roli mého příjemce nehodí."
 great_holy_war.0040.desc: "Válečná pokladnice představuje souhrn všech darů od podporovatelů tohoto tažení, jímž je [ROOT.Char.GetFaith.GHWName]. \n\nČást tohoto zlata se po skončení přípravné fáze rozdělí mezi účastníky, zatímco zbytek si podle svého příspěvku rozdělí vítězové."
 great_holy_war.0040.a: "Pro tuto věc vyprázdním svou pokladnici!"
 great_holy_war.0040.b: "Přispěji štědrou částkou."
 great_holy_war.0040.c: "Na toto úsilí mohu postrádat pár mincí."
 great_holy_war.0040.d: "Vážně to zvážím."
 great_holy_war.0050.title: "[the_faith.GHWName] o [target_kingdom.GetBaseNameNoTierNoTooltip]"
 great_holy_war.0050.base.desc: "[the_faith.GetAdjectiveNoTooltip] vládci, povzbuzeni výzvou do zbraně od [ghw_sponsor.GetTitledFirstName], začali shromažďovat velké zástupy horlivců. Jejich cílem je [the_faith.GHWName] proti všem nepřátelům víry v [target_kingdom.GetBaseNameNoTierNoTooltip]. Každým dnem se k nim přidávají další fanatici a brzy z nich bude mohutné vojsko připravené přinést válku do našich zemí. Na jeho praporech se skví [the_faith.ReligiousSymbol]."
 great_holy_war.0050.defender.desc: "\n\nJe na mně, abych sjednotil[Select_CString(ROOT.Char.IsFemale,'a','')] své [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] spoluvládce v oblasti a připravil[Select_CString(ROOT.Char.IsFemale,'a','')] se na blížící se příval [ghw_sponsor.Custom('GetUnbelieverNamePlural')], než bude příliš pozdě."
 great_holy_war.0050.others.desc: "\n\nMůžeme se jen modlit, aby [ROOT.Char.GetFaith.WarGodName] dodal odvahu a vytrvalost postavě [target_character.GetTitledFirstName], která se musí postavit přívalu [ghw_sponsor.Custom('GetUnbelieverNamePlural')]."
 great_holy_war.0050.a: "[ROOT.Char.GetFaith.WarGodName], ochraňuj nás před těmito [ghw_sponsor.Custom('GetUnbelieverNamePlural')]!"
 great_holy_war.0051.catholic.attackers.desc: "Nadešel čas seslat svatý hněv na odporné [ghw_defender.Custom('GetUnbelieverNamePlural')] v [target_kingdom.GetBaseNameNoTier]. [the_faith.WarGodName] obrací svou spravedlnost proti nim.\n\nVelké vojsko křižáků shromážděné na výzvu [ghw_sponsor.GetTitledFirstName] vyráží vpřed, naplněno spravedlivým hněvem a nezlomným odhodláním. Zlovolní poznají boží spravedlnost a věrným připadne místo, které jim slibuje [the_faith.DivineRealm]."
 great_holy_war.0051.generic.attackers.desc: "Konečně nadešel čas posvětit půdu [target_kingdom.GetBaseNameNoTier] krví [ghw_defender.Custom('GetUnbelieverNamePlural')] a získat tuto zemi pro slávu, kterou představuje [the_faith.WarGodName].\n\nNaši svatí bojovníci pochodují s jistotou, že ať zvítězí, nebo padnou v boji proti nevěřícím, jejich oddanost nezůstane bez odměny. Čeká na ně [the_faith.PositiveAfterLife]."
 great_holy_war.0051.generic.defenders.desc: "Hordy [ghw_sponsor.Custom('GetUnbelieverNamePlural')], shromážděné na výzvu [ghw_sponsor.GetTitledFirstName], zahájily pochod na [target_kingdom.GetBaseNameNoTier]. Na jejich praporech se skví [the_faith.ReligiousSymbol|U]. \n\nTyto divoké válečníky zjevně vede sám [ROOT.Char.GetFaith.DevilName]. Pokud je nezastavíme, zpustoší naše země a bez milosti povraždí náš lid! Kvůli všem [ghw_defender.GetFaith.GetAdjective] věřícím v [target_kingdom.GetBaseNameNoTierNoTooltip] musíme zvítězit!"
 great_holy_war.0051.generic.start.tt: "[the_faith.GHWName] o [target_kingdom.GetBaseNameNoTierNoTooltip] začne okamžitě!"
 great_holy_war.0052.title.winners: "[the_faith.GHWName] slaví vítězství"
 great_holy_war.0052.title.losers: "[the_faith.ReligiousSymbol|U] přinášející zkázu"
 great_holy_war.0052.generic.attackers.desc: "[title_recipient.GetShortUIName] slaví vítězství ve výpravě [the_faith.GHWName] o [target_kingdom.GetBaseNameNoTier]. [the_faith.WarGodName] stojí při našich bojovnících, kteří znovu a znovu poráželi [ghw_defender.GetTitledFirstName] i [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')], až byli nepřátelé víry donuceni přiznat svou potupnou porážku.\n\nObsazené země jsou nyní pevně pod vládou zbožného [the_faith.GetAdjectiveNoTooltip] panovníka a [the_faith.WarGodName] prosazuje svou vůli. Na vítězných praporech se skví [the_faith.ReligiousSymbol|U] a všichni pravověrní jásají!"
 great_holy_war.0052.generic.defenders.desc: "[ghw_defender.GetFaith.WarGodName] zjevně odvrací svou přízeň od [ghw_defender.GetTitledFirstName], protože jeho vojska utrpěla zdrcující porážku. Proti nim stojí bojovníci a nad jejich zástupy se skví [the_faith.ReligiousSymbol|U].\n\nPo úspěšné výpravě [the_faith.GHWName] obsadili [ROOT.Char.Custom('GetUnbelieverNamePlural')] [target_kingdom.GetBaseNameNoTier] a prohlásili okolní území za právoplatnou [the_faith.GetAdjectiveNoTooltip] zemi."
 great_holy_war.0052.generic.outsiders.desc: "[the_faith.GetAdjectiveNoTooltip] výprava [the_faith.GHWName] proti [target_kingdom.GetBaseName] skončila drtivým úspěchem. Svatí bojovníci, kteří vyslyšeli výzvu [ghw_sponsor.GetTitledFirstName], znovu a znovu poráželi své nepřátele a nakonec natrvalo obsadili jejich země.\n\nTěžko říct, jak dlouho jejich vláda vydrží a zda po tomto ponížení [ghw_defender.GetFaith.WarGodName] povede své následovníky k odvetě. Prozatím však [the_faith.ReligiousSymbol|U] vrhá svůj stín na [target_kingdom.GetBaseNameNoTierNoTooltip]."
 great_holy_war.0052.a: "[the_faith.WarGodName] je s námi!"
 great_holy_war.0052.b: "[ROOT.Char.GetFaith.WarGodName], proč nás trestáš?!"
 great_holy_war.0052.c: "Hašteřící [ghw_sponsor.Custom('GetUnbelieverNamePlural')|l] se nás netýkají."
 great_holy_war.0053.title: "[the_faith.ReligiousSymbol|U] padá"
 great_holy_war.0053.generic.attackers.desc: "Bojovníci, které vedl [the_faith.WarGodName], našli před branami [target_kingdom.GetBaseNameNoTier] jen smrt a ponížení.\n\nVýprava [the_faith.GHWName], kterou [ghw_sponsor.GetTitledFirstName] tak horlivě [Select_CString(ghw_sponsor.IsFemale,'vyhlásila a podporovala','vyhlásil a podporoval')], skončila katastrofální porážkou, jež věci věřících pouze uškodila. Rouhači a nevěřící teď jistě získají ještě větší odvahu odvracet se od [the_faith.GetName]."
 great_holy_war.0053.generic.defenders.desc: "Ubozí bojovníci, které prý vedl sám [the_faith.WarGodName], se našim válečníkům nemohli rovnat. \n\nPod moudrým a zbožným vedením [ghw_defender.GetTitledFirstName] odrazili [ghw_defender.GetFaith.GetAdjective] věřící útočníky a znovu potvrdili svůj nárok na [target_kingdom.GetBaseNameNoTier]. Možná si [ghw_sponsor.GetTitledFirstName] příště rozmyslí, zda má smysl tak ochotně obětovat životy svých následovníků v marné snaze poměřit síly s mocí, kterou představuje [ghw_defender.GetFaith.WarGodName]."
 great_holy_war.0053.generic.outsiders.desc: "Po několika nezdarech a ponižujících porážkách skončila výprava [the_faith.GHWName], kterou [ghw_sponsor.GetTitledFirstName] [Select_CString(ghw_sponsor.IsFemale,'vyhlásila','vyhlásil')] za dobytí [target_kingdom.GetBaseNameNoTier], naprostým neúspěchem.\n\n[ghw_defender.GetFaith.GetAdjective] věřící pod praporem [ghw_defender.GetTitledFirstName] vyhnali všechny útočníky a donutili jejich vůdce ke kapitulaci."
 great_holy_war.0053.a: "[the_faith.WarGodName] nás opustil!"
 great_holy_war.0053.b: "[attacker.Custom('GetUnbelieverNamePlural')] okusili hněv, který přináší [ghw_defender.GetFaith.WarGodName]!"
 great_holy_war.0056.title: "[the_faith.GHWName] selhává"
 great_holy_war.0056.desc: "Zdá se, že vášnivá výzva [ghw_sponsor.GetTitledFirstName] ke společnému boji nepřesvědčila tolik věřících, kolik se očekávalo. [the_faith.ReligiousSymbol|U] má své nepřátele, ale do zbraně proti nim se na tuto výzvu postavilo příliš málo věřících, rozhodně ne dost na sestavení řádného vojska.\n\nNakonec nezbylo než [the_faith.GHWName] odvolat a odsoudit všechny [the_faith.GetAdjective] vládce za jejich zbabělost a hanebnost."
 great_holy_war.0056.a: "Jak jsme se mohli tak vzdálit [the_faith.WarGodNamePossessive] vedení?"
 great_holy_war.0056.b: "Ubohé."
 great_holy_war.0056.c: "Proč se mě to vlastně týká?"
 great_holy_war.0057.title: "[the_faith.ReligiousSymbol|U] má nového bojovníka"
 great_holy_war.0057.crusader.desc: "Naše vojska jsou připravena zapojit se do [the_faith.GHWName] o [target_kingdom.GetBaseNameNoTier]. [the_faith.WarGodName] stojí při nás a brzy povstaneme jako vítězové, zatímco krev [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] zbarví půdu doruda."
 great_holy_war.0057.mujahid.desc: "Náš velký boj konečně začíná. Naše vojska jsou připravena střetnout se s nevěřícími v bitvě. [the_faith.WarGodName] nám žehná a brzy budeme stát jako vítězové na hradbách [target_kingdom.GetBaseNameNoTier]."
 great_holy_war.0057.generic.outsiders.desc: "Naše vojska jsou připravena zapojit se do [the_faith.GHWName] o [target_kingdom.GetBaseNameNoTier]. [the_faith.WarGodName] stojí po našem boku, takže určitě zvítězíme!"
 great_holy_war.0057.a: "[the_faith.WarGodName] nás povede k vítězství!"
 great_holy_war.0058.title: "Projev zbabělosti"
 great_holy_war.0058.base.desc: "Zatímco statečnější bojovníci dál pochodují na [target_kingdom.GetBaseNameNoTier], já opouštím své vojsko a hledám bezpečnější útočiště. Oni vedou nelítostnou válku proti odporným [ROOT.Char.Custom('GetDerogatoryNonbelieverNamePlural')], zatímco já si špiním jméno a zpochybňuji vlastní odhodlání pokračovat v [the_faith.GHWName]."
 great_holy_war.0058.a: "Opustit bojiště byla chyba..."
 great_holy_war.0061.title: "Odměna"
 great_holy_war.0061.notification: "[scoped_beneficiary.GetFirstName] získává odměnu za přínos svého rodu v nedávné [scoped_beneficiary.GetFaith.GHWName]."
 great_holy_war.0070.title: "Nové království"
 great_holy_war.0070.base.desc: "V [target_kingdom.GetBaseNameNoTier] nyní stojí řádné [the_faith.GetAdjective] panství vedené postavou s hodností [title_recipient.GetTitleTierName], a věřící si tak konečně mohou oddechnout. [the_faith.WarGodName] hledí na naše dobré skutky s přízní. A že [title_recipient.GetTitledFirstName] patří k mé dynastii, je jen dalším důkazem božské přízně."
 great_holy_war.0070.a: "Co asi přinese vláda, kterou povede [title_recipient.GetTitledFirstName]?"
 great_holy_war.0070.b: "Je čas znovu se soustředit na své panství."
 great_holy_war.0071.generic.attackers.desc: "[attacker.GetTitledFirstName] [Select_CString(attacker.IsFemale,'vyhlásila','vyhlásil')] [attacker.GetFaith.GHWName], která má sjednotit všechny pravověrné [attacker.GetFaith.GetAdherentNamePlural] pod jediným praporem a vést je proti nepřátelům víry. \n\nKonečně nadešel čas posvětit půdu [target_kingdom.GetBaseNameNoTier] krví [ghw_defender.Custom('GetUnbelieverNamePlural')] a získat tuto zemi. [the_faith.WarGodName] bude tímto vítězstvím oslaven."
 great_holy_war.0071.generic.defenders.desc: "Odporný nepřítel [attacker.GetTitledFirstName] [Select_CString(attacker.IsFemale,'vyhlásila','vyhlásil')] [attacker.GetFaith.GHWName] proti nevinnému lidu [defender.GetPrimaryTitle.GetBaseNameNoTier].\n\nMusíme se semknout proti nelítostné hordě fanatiků, pokud chceme přežít. [attacker.GetTitledFirstName] stojí v jejím čele."
 great_holy_war.0081.title: "[actor.GetFaith.GHWName] má nový cíl"
 great_holy_war.0081.desc: "Ať už je důvod jakýkoli, [actor.GetFaith.GHWName] mění svůj původní cíl a obrací se proti [secondary_recipient.GetPrimaryTitle.GetBaseNameNoTier].\n\nZdá se, že naše země budou alespoň prozatím ušetřeny řádění [actor.GetFaith.GetAdjective] bojovníků."
 great_holy_war.0081.a: "Alespoň jsme v bezpečí."
 great_holy_war.0082.desc: "Už nějakou dobu [actor.GetFaith.GetName] shromažďuje síly pro [actor.GetFaith.GHWName]. \n\nNečekaným zvratem osudu však horlivci v čele tohoto velkého vojska mění své původní plány a vyrážejí na [secondary_recipient.GetPrimaryTitle.GetBaseNameNoTier]!"
 great_holy_war.0082.a: "Na přípravu máme jen málo času!"
 great_holy_war.0085.toast: "[converter.GetTitledFirstName] přestupuje k jiné víře, což mě nutí odvolat svůj příslib"
