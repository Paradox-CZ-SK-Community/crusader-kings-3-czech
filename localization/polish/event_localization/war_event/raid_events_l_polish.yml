l_polish:
 raiding.0002.t: "Oheň a krev"
 raiding.0002.desc: "[sacked_barony.GetNameNoTierNoTooltip], důležitá pevnost v širším okolí [sacked_county.GetNameNoTierNoTooltip], padá do rukou mých nájezdníků. Rozsáhlé území nám teď leží otevřené a [sacked_county_owner.GetTitledFirstName] má spoustu rozechvělých poddaných i blyštivých pokladů, z nichž si můžeme vybírat.\n\nVojsko je připravené a čeká na můj rozkaz."
 raiding.0002.a: "Zajměte schopné otroky pro [raider_capital.GetNameNoTooltip]!"
 raiding.0002.a_nomad: "Ukradněte každou ovci a každou klisnu!"
 stolen_ewes_and_mares_modifier: "Ukradené ovce a klisny"
 stolen_ewes_and_mares_modifier_desc: "Toto hrabství vzkvétá díky množství prvotřídních chovných ovcí a klisen ukořistěných při nedávných nájezdech."
 raiding.0002.b: "Přineste mi bohatou kořist!"
 raiding.0002.c: "Už jsme si vzali dost."
 raiding.0003.t_spared: "[sacked_county.GetNameNoTierNoTooltip] uniká plenění"
 raiding.0003.t_attacked: "[sacked_county.GetNameNoTierNoTooltip] v plamenech"
 raiding.0003.desc.admin_plundered_independent: "Brány [sacked_barony.GetNameNoTierNoTooltip] padly a [raider.GetTitledFirstName] má nyní volnou ruku v širokém okolí [sacked_county.GetNameNoTierNoTooltip]. Příležitost využívá k únosům a zotročování co největšího počtu vzdělaných úředníků a zručných pracovníků. Sedláci si rvou vlasy a oplakávají odvlečené příbuzné."
 raiding.0003.desc.gold_plundered_independent: "Po napjatém obléhání padá opevněná osada [sacked_barony.GetNameNoTierNoTooltip] a [raider.GetTitledFirstName] posílá své vojáky plenit vše, co má nějakou cenu. Netrvá dlouho a polovina [sacked_county.GetNameNoTierNoTooltip] přijde o své bohatství!"
 raiding.0003.desc.spared_plundered_independent: "Osada [sacked_barony.GetNameNoTierNoTooltip] sice kapitulovala před vojskem, které vede [raider.GetTitledFirstName], další plenění však ustává. [sacked_county.GetNameNoTierNoTooltip] tak uniká horšímu osudu. Zdá se ale, že [raider.GetTitledFirstName] hodlá svou kořist získat od #EMP mě#!!"
 raiding.0003.desc.admin_plundered_vassal: "Obrana [sacked_barony.GetNameNoTierNoTooltip] před řáděním, které přináší [raider.GetTitledFirstName], selhala. Její pád připravil [sacked_county.GetNameNoTierNoTooltip] o klíčové opevnění. Už teď krajinu zaplavují vojáci, které vede [raider.GetTitledFirstName], a odvádějí do otroctví každého zručného pracovníka a učně, kterého najdou."
 raiding.0003.desc.gold_plundered_vassal: "Bez pomoci shora neměla osada [sacked_barony.GetNameNoTierNoTooltip] mnoho šancí. [raider.GetTitledFirstName] vede nájezdníky, kteří ji vyplenili, a ti parchanti vzali úplně všechno, od skromného majetku sedláků až po můj pohár pro štěstí.\n\n[sacked_county.GetNameNoTierNoTooltip] z poloviny hoří po [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] plenění a [raider.GetTitledFirstNameNoTooltip] někde tam venku nejspíš pije z mého vlastního poháru."
 raiding.0003.desc.spared_plundered_vassal: "Obléhání [sacked_barony.GetNameNoTierNoTooltip] se sice nepodařilo prolomit, [raider.GetTitledFirstName] však drží své vojáky zkrátka.\n\nVětšina okolní krajiny tak unikla všemu kromě obvyklého rabování, ale [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] nájezdníci teď lačně obracejí zrak jinam..."
 raiding.0003.a: "Ten netvor!"
 raiding.0003.b: "Za tuhle urážku se #EMP pomstím#!."
 raiding.0003.c: "[sacked_county.GetNameNoTierNoTooltip] znovu vybudujeme."
 raiding.0004.desc.admin_plundered: "[raider.GetTitledFirstName] ukazuje svou chamtivost a [sacked_county_owner.GetTitledFirstName] za ni tvrdě platí. Osada [sacked_barony.GetNameNoTierNoTooltip] padla a rozsáhlé části [sacked_county.GetNameNoTierNoTooltip] zůstávají bez obrany. \n\nNikdo jim nestojí v cestě, a tak [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] nájezdníci řádí krajinou a unášejí do otroctví každého zručného pracovníka, kterého najdou."
 raiding.0004.desc.gold_plundered: "[raider.GetTitledFirstNameNoTooltip] dobývá [sacked_barony.GetNameNoTierNoTooltip] a velká část [sacked_county.GetNameNoTierNoTooltip] zůstává vydána napospas řádícím [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] lupičům.\n\nV okolí už téměř nezůstaly žádné větší pevnosti, které by se jim mohly postavit, takže nájezdníci odnášejí každý cenný předmět i poslední kousek stříbra, který najdou."
 raiding.0004.desc.spared_plundered: "Pevnost [sacked_barony.GetNameNoTierNoTooltip], která chrání rozsáhlé části [sacked_county.GetNameNoTierNoTooltip], sice podlehla obléhání, ale [raider.GetTitledFirstName] drží své vojáky zkrátka. Plenění je proto jen ojedinělé a sporadické.\n\nTvá vazalská země tak uniká nejhoršímu, ale [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] nájezdníci lačně hledí na tvé vlastní državy..."
 raiding.0004.a: "Proklínám tyhle dotěrné divochy!"
 raiding.0004.a.tribal: "K čertu s těmi [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] psy!"
 raiding.0004.b: "Vyplať odškodné za ztracené."
 raiding.0004.c: "Pomoz jim s obnovou."
 raiding.0004.c.architect: "Dohledem nad opravami pověříš [architect.GetTitledFirstNameNoTooltip] ([ROOT.Char.Custom2('RelationToMe', SCOPE.sC('architect'))])."
 recently_sacked_modifier: "Nedávné vyplenění"
 recently_sacked_modifier_desc: "Nájezdníci už zde nenajdou nic, co by mohli odnést, a strach z jejich návratu drží sedláky na uzdě."
 rebuilding_after_sacking_modifier: "Obnova po vyplenění"
 rebuilding_after_sacking_modifier_desc: "Bohatý dobrodinec pomáhá místním opravovat poškozené osady."
 raiding.0004.c.feed.t: "Vrchnost hradí opravy"
 raiding.0004.c.feed.desc: "Má vrchnost zaplatila skupiny architektů a správců, kteří pomohou opravit [sacked_county.GetNameNoTierNoTooltip]."
 raiding.0004.c.feed.desc2: "Má vrchnost vyslala Královského architekta, aby vedl skupiny architektů a správců při opravách [sacked_county.GetNameNoTierNoTooltip]."
 raiding.0011.t: "Kořist z nájezdu doručena"
 raiding.0011.desc: "Tví nájezdníci přivážejí [ROOT.Var('raid_loot').GetValue|V0] [gold_i] kořisti a získávají ti [ROOT.Var('raid_loot').GetValue|V0] [prestige_i] prestiže."
 raiding.0011.desc_non_tribal: "Tví nájezdníci přivážejí [ROOT.Var('raid_loot').GetValue|V0] [gold_i] kořisti, ale stojí tě to [SCOPE.ScriptValue('non_tribal_loot_value')|V0] [prestige_i] prestiže."
 raiding.0012.a.t: "Kořist z nájezdu ztracena"
 raiding.0012.a.desc: "[recipient.GetTitledFirstName] nám bere [loot_i][ROOT.Var('raid_loot').GetValue|V0]!\nZa toto vítězství získává [recipient.GetTitledFirstName] [ROOT.Var('raid_prestige').GetValue|V0] [prestige_i]."
 raiding.0012.b.t: "Kořist z nájezdu získána zpět"
 raiding.0012.b.desc: "Kořist [loot_i][ROOT.Var('raid_loot').GetValue|V0] je tvá! [raider.GetTitledFirstName] o ni přichází.\nToto vítězství ti přináší [ROOT.Var('raid_prestige').GetValue|V0] [prestige_i]."
 raiding.0023.t: "Postrach z [capital_province.GetNameNoTooltip]"
 raiding.0023.desc: "Už celé roky vyrážím na ničivé nájezdy a rozechvělému světu ukazuji, jakou zuřivost dokáže seslat [raid_leader.GetFaith.HighGodName]. Pokud mé skutky neschvaluje, proč dosud nepřichází trest?\n\nMá domácnost usíná obklopena nakradeným přepychem cizích vládců a mé lože zahřívají otroci z dalekých zemí.\n\nVznešení i prostí se přede mnou třesou a rodiče utišují plačící děti hrozbou, že si pro ně přijdu."
 raiding.0023.a: "Ha! Ať se třesou už při vyslovení mého jména!"
