 war_event.notification_liege_win.t: "Vítězství lenního pána ve válce"
 war_event.notification_liege_loss.t: "Porážka lenního pána ve válce"
 war_event.1001.t: "Můj lenní pán vyhlašuje válku"
 war_event.1001.desc: "Je zvláštní, jak rychle se může situace během války změnit.\n\nUprostřed bojů, v nichž proti mně stojí [recipient.Custom2('MyCharacterIntroduction', ROOT.Char)], přichází poselství od [liege_invalidator.Custom2('MyCharacterIntroduction', ROOT.Char)]. Mám zanechat vlastní věc a připojit své síly k válce, kterou vede [liege_invalidator.GetTitledFirstName]. Jejím protivníkem je [recipient.GetTitledFirstName]."
 war_event.1001.a: "A-ale co moje válka!? K čertu s tebou!"
 war_event.2003.desc: "Protože [liege_invalidator.Custom2('MyCharacterIntroduction', invalidator)] nyní vede válku proti tobě, mé síly se přidají k této válce."
 war_event.2003.a: "Budiž."
 war_event.2001.t: "Nový protivník"
 war_event.2001.desc: "Nic na tomto světě není jisté, zvlášť za války. Ani [war.GetName] není výjimkou.\n\nNa druhé straně už nestojí [previous_defender.Custom2('MyCharacterIntroduction', ROOT.Char)], nýbrž [defender.Custom2('MyCharacterIntroduction', ROOT.Char)]. Možná je načase celou situaci přehodnotit."
 war_event.2001.a: "Můj cíl se nemění."
 war_event.2001.a.tt: "Válka zuří dál"
 war_event.2001.b: "Tahle cesta už není nejlepší."
 war_event.2001.c: "Možná bychom se mohli dohodnout?"
 war_event.2001.c.tt: "Za ukončení války budeš požadovat velkou částku zlata; zaplatit má [defender.GetTitledFirstName]"
 war_event.2002.t: "[invalidator.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.2002.desc: "Bohužel jsme se v tomto konfliktu ocitli na opačných stranách. To nikdy nebylo mým úmyslem, a proto své vojsko stáhnu."
 war_event.2002.a: "Moudré rozhodnutí."
 war_event.2004.t: "[harald.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.2004.desc: "Když už teď stojíme proti sobě, možná bychom se mohli dohodnout a vyřešit tento konflikt mírovou cestou?\n\nZa odpovídající částku zlata své vojsko stáhnu..."
 war_event.2004.a: "Dobrá dohoda."
 war_event.2004.b: "Nikdy!"
 war_event.2005.t: "[william.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.2005.desc: "Tvá moudrost tě předchází. Platí."
 war_event.2005.a: "Výborně!"
 war_event.2006.t: "[william.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.2006.desc: "Obávám se, že tvou nabídku musím odmítnout. Setkáme se na bojišti."
 war_event.2006.a: "Tak tedy válka."
 war_event.3001.t: "[war_owner.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.3001.desc: "Před dvěma lety jsme se dohodli, že mi pomůžeš ve [war.GetName], ale dosud od tebe nepřišla žádná podpora.\n\nK čemu je nám naše spojenectví, když z tvé strany nepřijde ani sebemenší pomoc?"
 war_event.3001.a: "Okamžitě ti pošlu své vojsko na pomoc!"
 war_event.3001.a.tt: "Pokud během 12 měsíců nezískáš žádný [Concept('war_contribution','válečný příspěvek')|E], ztratíš jednu [Concept('prestige_level','úroveň slávy')|E] a [war_owner.GetTitledFirstNameNoTooltip] může ukončit vaše spojenectví!"
 war_event.3001.b: "Tahle truhla zlata snad mou nepřítomnost vynahradí..."
 war_event.3001.b.tt: "Už se od tebe nebude očekávat, že pošleš vojáky bojovat ve [war.GetName]."
 war_event.3001.c: "Omlouvám se. Ten slib pomoci byla chyba."
 war_event.3002.t: "[war_owner.Custom2('AppropriateGreeting', ROOT.Char)]"
 war_event.3002.desc.start: "Navzdory tvému slibu poslat mi vojsko se na bojišti dosud neobjevil jediný tvůj voják."
 war_event.3002.desc.end.1: "Tvé porušení přísahy přineslo hanbu tobě i tvé rodině."
 war_event.3003.desc.end.2: "Tvé selhání v této věci vážně poškodilo mou důvěru v tebe, [ROOT.Char.GetTitledFirstName]."
 war_event.3002.1.a: "Dobrá."
 war_event.3003.2.a: "Příště to napravím."
 war_event.3003.2.b: "Možná bude lepší naše spojenectví prostě ukončit...?"
 war_event.neighbor_war.both_neighbors.t: "Válka sousedů skončila"
 war_event.neighbor_war.both_neighbors.desc: "[war.GetName] je u konce. Na vítězné straně stojí [winner.GetTitledFirstName], na poražené [loser.GetTitledFirstName]!"
 war_event.neighbor_war.only_winner.t: "Vítězství sousedního vládce"
 war_event.neighbor_war.only_winner.desc: "[war.GetName] je u konce. Na vítězné straně stojí [winner.GetTitledFirstName], na poražené [loser.Custom2('YourCharacterIntroductionNoComma', this_player)]!"
 war_event.neighbor_war.only_loser.t: "Porážka sousedního vládce"
 war_event.neighbor_war.only_loser.desc: "[war.GetName] je u konce. Na poražené straně stojí [loser.GetTitledFirstName], na vítězné [winner.Custom2('YourCharacterIntroductionNoComma', this_player)]!"
 war_event.3101.t: "Nová víra"
 war_event.3101.desc: "Dorazila ke mně zpráva o změně víry. [defender.GetTitledFirstName] nyní vyznává [defender.GetFaith.GetNameNoTooltip]. [defender.GetPrimaryTitle.GetNameNoTierNoTooltip] už není cílem, proti němuž mi [ROOT.Char.GetFaith.HighGodName] dává právo vést válku."
 war_event.3101.a: "Nastal čas složit zbraně."
 war_event.3101.b.tt: "[war.GetName] pokračuje"
 war_event.3101.b: "[defender.GetTitledFirstName] si myslí, že mě to zastaví? Ha!"
 war_event.3102.t: "[attacker.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 war_event.3102.desc: "Tvá nově nalezená víra mě sotva přesvědčí. [ROOT.Char.GetFaith.HighGodName] pro mě není důvodem ustoupit. Má věc je stále spravedlivá a žádné slitování nebude."
 war_event.3102.a: "[ROOT.Char.Custom('CulturalCurse')|U]!"
