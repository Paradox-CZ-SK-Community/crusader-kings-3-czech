l_polish:
 witch.1001.message: "Zasvěcení do čarodějnictví"
 child_witch_conversion_success_effect.desc: "[child.GetFirstNameNoTooltip] je [Select_CString(child.IsFemale, 'přesvědčena', 'přesvědčen')]"
 child_witch_conversion_failure_effect.desc: "[child.GetFirstNameNoTooltip] pochybuje"
 child_witch_conversion_critical_failure_effect.desc: "[child.GetFirstNameNoTooltip] prozradí mé tajemství"
 child_witch_conversion_critical_failure_effect.liege.desc: "[child.GetFirstNameNoTooltip] prozradí čarodějnictví svého poručníka"
 witch.1002.t: "Věk poznání"
 witch.1002.desc: "[child.Custom2('MyCharacterIntroduction', ROOT.Char)|U] stojí na pomezí dětství a dospělosti. Už zná dost, aby [Select_CString(child.IsFemale, 'pochopila', 'pochopil')] pravdu, a stále je dost [Select_CString(child.IsFemale, 'mladá', 'mladý')], aby [Select_CString(child.IsFemale, 'měla', 'měl')] otevřenou mysl. Pokud [Select_CString(child.IsFemale, 'ji', 'ho')] chci zasvětit do služby, k níž volá [ROOT.Char.GetFaith.WitchGodName], je teď poslední příležitost."
 witch.1002.a: "[child.GetFirstNameNoTooltip|U] si zaslouží poznat moc, kterou nabízí [ROOT.Char.GetFaith.WitchGodName]."
 witch.1002.b: "[child.GetFirstNameNoTooltip] je ztracený případ."
 witch.1003.t: "Skryté vědění"
 witch.1003.desc: "[guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] mi [Select_CString(guardian.IsFemale, 'svěřila', 'svěřil')] jisté věci, o nichž nikdo jiný nikdy nemluví. Nikdy se u těchto témat dlouho nezdržíme a já dobře vím, že se nemám vyptávat. \n\nDnes večer je však mezi námi něco jinak. Když se posadíme ke čtení, [guardian.GetFirstNameNoTooltip] se mě zeptá, jestli se nechci na něco zeptat..."
 witch.1003.a: "Ano, pověz mi všechno! Prosím!"
 witch.1003.b: "Ne, myslím, že ne..."
 witch.1003.c: "To je rouhání!"
 witch.2001.t: "$convert_to_witch$: Nastal čas"
 witch.2001.start.desc: "Pravdu musí [target.GetFirstName] spatřit [Select_CString(target.IsFemale, 'sama', 'sám')]; přinutit [Select_CString(target.IsFemale, 'ji', 'ho')] k tomu nemohu. Nezbývá než doufat, že veškerá má snaha otevřít [Select_CString(target.IsFemale, 'jí', 'mu')] mysl nebyla marná."
 witch.2001.secrecy.desc: "Modlím se. [owner.GetFaith.WitchGodName] snad dopřeje, aby [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'pochopila', 'pochopil')] souvislost mezi našimi nevinnými rozhovory a posvátnými texty, které jsem [Select_CString(ROOT.Char.IsFemale, 'zanechala', 'zanechal')] v [Select_CString(target.IsFemale, 'jejích', 'jeho')] komnatách."
 witch.2001.no_secrecy.desc: "Modlím se. [owner.GetFaith.WitchGodName] snad dopřeje, aby [target.GetFirstNameNoTooltip] [Select_CString(target.IsFemale, 'pochopila', 'pochopil')] souvislost mezi našimi dlouhými rozhovory a posvátnými texty, které ode mě [Select_CString(target.IsFemale, 'dostala', 'dostal')]."
 witch.2001.end.desc: "\n\nTeď musím za [Select_CString(target.IsFemale, 'ní', 'ním')] a pozvat [Select_CString(target.IsFemale, 'ji', 'ho')] do společenství, k němuž nás vede [owner.GetFaith.WitchGodName] - nebo celé své úsilí vzdát."
 witch.2001.a: "[target.GetFirstNameNoTooltip|U] si zaslouží rozhodnout se [Select_CString(target.IsFemale, 'sama', 'sám')]."
 witch.2001.b1: "Riziko je příliš veliké."
 witch.2001.b2: "[target.GetFirstNameNoTooltip] ještě není [Select_CString(target.IsFemale, 'připravená', 'připravený')]."
 witch.2001.a.tt: "Pokračuješ ve svém plánu: [target.GetShortUIName] má přijmout cestu, kterou ukazuje [owner.GetFaith.WitchGodName]"
 witch.2002.t: "[owner.GetFaith.WitchGodName]: [Select_CString(ROOT.Char.IsFemale, 'Nová služebnice', 'Nový služebník')]"
 witch.2002.start.desc: "Když ve tmě otevřu oči, okamžitě mě zaplaví zlověstný pocit. Sleduje mě někdo?\n\n„Jsi [Select_CString(ROOT.Char.IsFemale, 'připravená', 'připraven')] přijmout pravdu?“"
 witch.2002.discovery.desc: "Ten hlas poznávám okamžitě. Musí to být [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]."
 witch.2002.no_discovery.desc: "Posadím se a spánek je rázem pryč. Rozhlížím se po zdroji neznámého hlasu, ale všude jsou jen stíny."
 witch.2002.end.desc: "\n\n„[owner.GetFaith.WitchGodName|U] ti nabízí své požehnání. Přijmeš je?“"
 witch.2002.a: "Z celého srdce!"
 witch.2002.b: "Nechci s tím mít nic společného. Zmiz, démone!"
 witch.2002.c: "Svět se dozví o tvém hříchu!"
 witch.2003.t: "$convert_to_witch$: [Select_CString(target.IsFemale, 'Nová zasvěcenkyně', 'Nový zasvěcenec')]"
 witch.2003.desc: "Pozoruji, jak [target.GetFirstName] spí, a pronáším krátkou modlitbu. [owner.GetFaith.WitchGodName] je v mých myšlenkách. Jakmile mi ze rtů unikne poslední šeptané slovo, [target.GetFirstNameNoTooltip] se zavrtí, jako by podvědomí právě na tuto chvíli čekalo.\n\nVystoupím ze stínů a oznámím své poselství: [owner.GetFaith.WitchGodName] nabízí své požehnání. [target.GetFirstNameNoTooltip] neprojeví ani strach, ani zaváhání. Ne, přijímá je dychtivě a celým srdcem."
 witch.2003.a: "Vítej v našem společenství. Odteď jsi [Select_CString(target.IsFemale, 'naše', 'náš')] [target.Custom('SisterBrother')|l]."
 witch.2003.b: "Teď už konečně mohu odhalit svou pravou tvář."
 witch.2003.b.tt: "[target.GetShortUIName|U] musí znát tvé [Concept('secret','tajemství')|E], jinak nemůže dostat pozvání na: $activity_witch_ritual$"
 witch.2003.c: "[target.GetFirstNameNoTooltip|U] si musí najít vlastní cestu."
 witch.2003.message: "[Select_CString(owner.IsFemale, 'Čarodějnice', 'Čaroděj')] přede mnou odhaluje svou pravou tvář"
 witch.2004.t: "$convert_to_witch$: Uzavřená mysl, chladné srdce"
 witch.2004.start.desc: "[target.GetFirstName] se zavrtí ze spaní, když [SelectLocalization( IsLandlessAdventurer(target), 'witch.2004.start_target_laamp', 'witch.2004.start_target_landed')]. „Kdo je tam?“ ozve se nejistým hlasem.\n\n„Na mém jméně nezáleží. Přivádí mě sem [owner.GetFaith.WitchGodName].“\n\n"
 witch.2004.start_target_landed: "vlezu dovnitř oknem"
 witch.2004.start_target_laamp: "vplížím se do stanu"
 witch.2004.discovered.desc: "[target.GetFirstNameNoTooltip] přimhouří oči. „To jsi ty? [owner.GetFaith.WitchGodName|U]? Co je to za nesmysly?!“"
 witch.2004.not_discovered.desc: "[target.GetFirstNameNoTooltip] vyskočí z postele a sáhne po něčem na stolku vedle ní. Nejspíš po ničem dobrém. „Nechci mít nic společného s tebou ani s tvými lžemi! Zmiz, démone!“ zakřičí [target.GetFirstNameNoTooltip] a já rychle poslechnu."
 witch.2004.a: "Omyl! [target.Custom('GetChamber')|U] není to, co hledám. Omlouvám se!"
 witch.2005.toast: "Odhaleno čarodějnictví"
 witch.2005.end.desc: "„To jsi ty? [owner.GetFaith.WitchGodName|U]? [target.GetLiege.Custom2('MyCharacterIntroduction', target)|U] se dozví o tvém rouhání!“"
 witch.2005.a: "Prosím, není to tak, jak si myslíš!"
 witch.2005.a.tt: "Ve skutečnosti to možná je #EMP přesně#! tak, jak si [target.GetFirstNameNoTooltip] myslí..."
 witch.2006.t: "$convert_to_witch$: Odhalení"
 witch.2006.desc: "[target.Custom2('MyCharacterIntroduction', ROOT.Char)|U] není v posteli, když se oknem vplížím dovnitř při plnění poslání, za nímž stojí [owner.GetFaith.WitchGodName]. Kde jen může být-\n\n„Kdo je tam?!“\n\nPrudce se otočím. [target.GetTitledFirstName] se krčí nad pentagramem nakresleným na podlaze."
 witch.2006.a: "Ach, ty už...! Tak i ty jsi [Select_CString(target.IsFemale, 'naše', 'náš')] [target.Custom('SisterBrother')|l]!"
 witch.2007.t: "[Select_CString(owner.IsFemale, 'Skrytá spojenkyně', 'Skrytý spojenec')]"
 witch.2007.desc: "Právě jsem uprostřed nočního obřadu. [owner.GetFaith.WitchGodName] je středem mého uctívání, když za sebou náhle zaslechnu nějaký zvuk. Zloděj? Návštěvník? Vrah?!\n\nPrudce se otočím a tváří v tvář přede mnou stojí [owner.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(owner.IsFemale, 'oděná', 'oděný')] do temného pláště. Na něm se skví nezaměnitelné znamení a já okamžitě poznávám, koho představuje: [owner.GetFaith.WitchGodName]. Typický oděv pro obracení dalších."
 witch.2007.a: "Se mnou tohle není třeba, #EMP [Select_CString(owner.IsFemale, 'sestro', 'bratře')]#!!"
 witch.2010.t: "$convert_to_witchcraft_key$: Někdo nás zaslechl"
 witch.talk.2010: "[target.GetFirstName] a já celé hodiny rozmlouváme o pravdě a vůli, které zjevuje [owner.GetFaith.WitchGodName]. Když se obzor začne zbarvovat do modra, rozloučíme se."
 witch.leave.2010: "Jakmile [target.GetFirstName] vyslechne to nejpodstatnější z moudrosti, kterou zjevuje [ROOT.Char.GetFaith.WitchGodName], a dostane ode mě vlastní grimoár, odejdu."
 witch.end.2010: "\n\nKdyž otevřu dveře komnaty, zaslechnu rychlé kroky mizející chodbou. Naslouchal nám někdo?"
 witch.2010.a: "Ať [ROOT.Char.GetFaith.HighGodName] propadne zatracení!"
 witch.2010.a.tt: "Někdo zná tvé [Concept('secret','tajemství')|E]"
 witch.2010.message: "Tajemství odhaleno"
 convert_to_witchcraft_key: "Obrátit k čarodějnictví"
 convert_to_witchcraft_interaction: "$convert_to_witchcraft_key$ #weak ([Concept('scheme','Intrika')|E])#!"
 convert_to_witchcraft_interaction_desc: "[recipient.GetShortUINameNoTooltip] se má vydat cestou, kterou ukazuje [actor.GetFaith.WitchGodName]. Pokus se toho dosáhnout."
 convert_to_witchcraft: "$convert_to_witchcraft_key$"
 convert_to_witchcraft_desc: "[SCHEME.GetTargetCharacter.GetShortUINameNoTooltip] se pod mým vedením vydá cestou, kterou ukazuje [SCHEME.GetOwner.GetFaith.WitchGodName], a pozná skutečný rozsah této moci."
 convert_to_witchcraft_desc_general: "Veď cíl po pravé cestě a ukaž mu skutečný rozsah této moci."
 convert_to_witchcraft_action: "Obrátit"
 convert_to_witchcraft_interaction_notification: "Obrácení k čarodějnictví"
 convert_to_witchcraft_scheme_invalidated_title: "@scheme_icon! Intrika „Obrácení k čarodějnictví“ končí"
 convert_to_witchcraft_general_desc: "[Concept('scheme','Intrika')|E], jejímž cílem je zasvětit vybranou postavu do čarodějnictví a rozšířit čarodějnický sabat."
 reveal_as_witch_interaction: "Odhalit své čarodějnictví"
 reveal_as_witch_interaction_desc: "Odhal svou oddanost učení, které hlásá [actor.GetFaith.WitchGodName], někomu, kdo rovněž má rys [GetTrait('witch').GetName( GetNullCharacter )]"
 witch.2900.t: "[actor.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 witch.2900.desc: "Dlouho jsi mi [Select_CString(ROOT.Char.IsFemale, 'byla', 'byl')] inspirací a zasloužíš si vědět, co před světem skrývám.\n\nI já kráčím cestou, kterou ukazuje [actor.GetFaith.WitchGodName], a studuji její skrytá tajemství. Doufám, že nás naše společné úsilí ještě více sblíží.\n\nAť nad tebou bdí [actor.GetFaith.WitchGodMistressMaster]."
 witch.2900.a: "Je nás stále víc!"
 witch.2901.t: "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char )]"
 witch.2901.desc: "Těší mě zpráva o tvé věrné službě! [ROOT.Char.GetFaith.WitchGodMistressMaster] jistě hledí na tvé úsilí s potěšením. Ať nad tebou bdí a vede tě po cestě pravdy."
 witch.2901.a: "Ať nad tebou bdí [ROOT.Char.GetFaith.WitchGodMistressMaster]!"
 host_witch_ritual_decision: "Uspořádat velký obřad"
 host_witch_ritual_decision_desc: "[ROOT.Char.GetFaith.WitchGodName] bude středem našeho uctívání a my pronikneme hluboko do skrytých tajemství! $activity_witch_ritual$ je skvělou příležitostí setkat se s ostatními čaroději, pobavit se a podělit se o vědomosti."
 host_witch_ritual_decision_tooltip: "Uspořádat obřad"
 host_witch_ritual_decision_confirm: "Nechť obřad započne!"
 activity_witch_ritual: "Velký obřad"
 activity_witch_ritual_name: "[ACTIVITY.GetOwner.GetNamePossessiveOrMy|U] velký obřad"
 activity_witch_ritual_owner: "Hostitel"
 activity_witch_ritual_desc: "Praví následovníci s [Concept('trait','rysem')|E] [GetTrait('witch').GetName( GetNullCharacter )] jsou zváni, aby společně oslavili moc, kterou zosobňuje [GetPlayer.GetFaith.WitchGodName], a pronikli hluboko do skrytých tajemství."
 activity_witch_ritual_destination_selection: "$activity_witch_ritual$ můžeš uspořádat pouze ve svém [Concept('capital','hlavním sídle')|E]."
 activity_witch_ritual_selection_tooltip: "[GetPlayer.GetFaith.WitchGodName] bude středem tvého uctívání a ty přijmeš temný dar, který nabízí\n\nOčekávané odměny:\n$BULLET_WITH_TAB$[opinion_i] [Concept('opinion','Mínění')|E]\n$BULLET_WITH_TAB$[stress_loss_i] Úbytek [Concept('stress','stresu')|E]"
 activity_witch_ritual_province_capital_desc: "Toto je tvé [Concept('capital','hlavní sídlo')|E]"
 activity_witch_ritual_province_domicile_desc: "Toto je tvůj [Concept('domicile','domicil')|E]"
 activity_witch_ritual_province_both_desc: "$activity_witch_ritual_province_capital_desc$ a [Concept('domicile','domicil')|E]"
 activity_witch_ritual_host_desc: "$BULLET_WITH_TAB$Můžeš získat [Concept('lifestyle_experience','zkušenosti životního stylu')|E]\n$BULLET_WITH_TAB$Účastníci si mohou zlepšit [Concept('opinion','mínění')|E] přítomných postav o sobě\n$BULLET_WITH_TAB$Účastníkům může klesnout [stress_loss_i][Concept('stress','stres')|E]"
 activity_witch_ritual_conclusion_desc: "[GetActivityType( 'activity_witch_ritual' ).GetName] skončil"
 activity_witch_ritual_guest_desc: "$BULLET_WITH_TAB$ Účastníci si mohou zlepšit [Concept('opinion','mínění')|E] přítomných postav o sobě\n$BULLET_WITH_TAB$ Účastníkům může klesnout [stress_loss_i][Concept('stress','stres')|E]"
 activity_witch_ritual_guest_help_text: "$activity_witch_ritual_desc$"
 witch_ritual_phase_desc: "[GetPlayer.GetFaith.WitchGodName] bude středem tvého uctívání"
 host_witch_ritual_title: "Velký obřad"
 host_witch_ritual: "Uctívané božstvo [GetPlayer.GetFaith.WitchGodName]"
 host_witch_ritual_decision_cooldown: "Po dobu #N 10 let#! nebudeš moci uspořádat další velký obřad"
 witch_ritual_phase: "Temný obřad"
 worship_devil_intent: "Uctívat [GetPlayer.GetFaith.WitchGodName]"
 worship_devil_intent_desc: "Odevzdej se skrytému. Tělem. Myslí."
 witch.3001.t: "Drahý [Select_CString(ROOT.Char.IsFemale, 'sestro', 'bratře')] [ROOT.Char.GetFirstNameNoTooltip],"
 witch.3001.desc: "Nastal čas na $activity_witch_ritual$ sabatu rodu [host.GetHouse.GetBaseNameNoTooltip]. Zvu tě, abys za úplňku společně s námi [Select_CString(ROOT.Char.IsFemale, 'uctívala', 'uctíval')] [ROOT.Char.GetFaith.WitchGodName]. Budeme společně provolávat toto jméno a pronikat hluboko do skrytých tajemství!"
 witch.3001.a: "Už se nemohu dočkat!"
 witch.3001.b: "Raději bych snědl misku slimáků."
 witch.3003.t: "Nezvaný host"
 witch.3003.desc: "Když do [capital.GetNameNoTooltip] dorazí ostatní čarodějové, zahlédnu mezi nimi neznámou tvář.\n\nJdu přivítat [inviter.Custom2('MyCharacterIntroduction', ROOT.Char)] a [inviter.GetFirstNameNoTooltip] mi představí neznámou postavu jménem [new_guest.GetFirstName]. Jak se ukáže, jsou to staří známí, a [inviter.GetFirstNameNoTooltip] se mě zeptá, zda se k našemu obřadu může připojit i [new_guest.GetFirstNameNoTooltip]."
 witch.3003.a: "Čím víc, tím lépe!"
 witch.3003.b: "Budeš mým čestným hostem, [new_guest.GetFirstNameNoTooltip]."
 witch.3003.c: "$activity_witch_ritual$ je soukromou záležitostí."
 witch.3002.t: "Nedostatek oddanosti"
 witch.3002.desc: "Mé pozvání nepřijala jediná duše. Požehnání, které nabízí [ROOT.Char.GetFaith.WitchGodName], si nezaslouží!"
 witch.3002.a: "Poznají hněv, který přináší [ROOT.Char.GetFaith.WitchGodName]."
 every_grand_rite_participant: "Každý host na $activity_witch_ritual$"
 witch.3010.t: "Vychází úplněk"
 witch.3010.desc: "Měsíc stoupá k nebesům a ohlašuje příchod toho, koho uctíváme jako [ROOT.Char.GetFaith.WitchGodName]. Cítím, jak mé tělo reaguje na podivné síly proudící vzduchem. Siluety kolem mohutného ohně mlčky a nehybně čekají na to, co přijde.\n\nJako hostitel tohoto shromáždění musím obřad zahájit. Budu..."
 witch.3010.a: "Číst ze starobylého grimoáru."
 witch.3010.a.great: "Můj překlad je působivý"
 witch.3010.a.poor: "Můj překlad je mizerný"
 witch.3010.b: "Předvádět triky se zvuky a stíny."
 witch.3010.b.great: "Mé triky jsou velkolepé"
 witch.3010.b.poor: "Mé triky jsou směšné"
 witch.3010.c: "Spolehnout se na své charisma a improvizovat."
 witch.3010.c.great: "Má improvizace je strhující"
 witch.3010.c.poor: "Má improvizace nedává smysl"
 witch.3010.d: "Předložit velkolepou obětinu."
 witch.3010.e: "Odříkat tradiční modlitby."
 witch.3010.e.tt: "[activity.GetName] pokračuje jako obvykle"
 witch.3014.host.great_translation.desc: "Stará slova jsou podivná, a přesto ke mně promlouvají na jakési instinktivní úrovni. Splétají okouzlující vzorec plný krásy a příslibů. Moji hosté jsou jimi naprosto uchváceni.\n\nKdyž dramatickým gestem zavřu grimoár, mýtinou propukne jejich jásot."
 witch.3014.host.poor_translation.desc: "Ať se snažím sebevíc, starobylá slova mi stále nedávají smysl. Výrazy mých hostů se mění z dychtivých na zmatené a nakonec zklamané. Než ze sebe udělám ještě většího hlupáka, zaimprovizuji alespoň trochu méně žalostný závěr. Jakmile skončím, dav se rychle rozejde."
 witch.3014.host.great_tricks.desc: "Požehnání, která nabízí [ROOT.Char.GetFaith.WitchGodName], mají mnoho podob a patří k nim i vědění, kdy sáhnout po troše klamu. S pomocí několika zrcadel, rohů a ochotných pomocníků předvedu velkolepé divadlo. Vzduch je prosycen vzrušující směsí strachu a nadšení. Ani si nevzpomínám, kdy jsem se naposledy [Select_CString(ROOT.Char.IsFemale, 'cítila', 'cítil')] tak živě!"
 witch.3014.host.poor_tricks.desc: "Když jsem své triky zkoušel o samotě, fungovaly skvěle, ale dnes večer mě zřejmě zradily nervy. Nikdo se nedá oklamat - dokonce zaslechnu, jak se někdo vzadu v davu snaží potlačit smích. Než ze sebe udělám ještě většího hlupáka, rychle zaimprovizuji závěr obřadu."
 witch.3014.host.great_improvisation.desc: "Když vedu shromáždění obřadem, pozorně sleduji reakce ostatních a podle nich volím další slova. Zanedlouho mě už nese vlna jejich nadšení a vášnivé výkřiky mi dodávají sílu, zatímco směřuji k velkolepému vyvrcholení. Dosáhneme ho společně a jako jeden hlas vyjeme k měsíci jméno [ROOT.Char.GetFaith.WitchGodName]."
 witch.3014.host.poor_improvisation.desc: "Možná jsem se přece jen měl lépe připravit. Má improvizace je mdlá a bezcílná. Vidím, že ztrácím pozornost davu, a nakonec se uchýlím k tradiční modlitbě. Jakmile skončím, všichni se rychle rozejdou."
 witch.3014.host.offering.desc: "Všichni dobře víme, jakou zálibu má [ROOT.Char.GetFaith.WitchGodName] v přepychovém jídle a pití. Stoly se prohýbají pod sladkostmi, sudy vína, exotickým ovocem a máslovými koláči. To nejlepší obětujeme tomu, koho uctíváme jako [ROOT.Char.GetFaith.WitchGodName], a na zbytku si pak sami pochutnáme. "
 witch.3014.host.fallback.desc: "Staré modlitby možná nejsou okázalé, ale ani prosté. Jsou krátké a výstižné a skrývají v sobě ty nejposvátnější a nejmocnější pravdy, které zjevuje [ROOT.Char.GetFaith.WitchGodName]. Znovu je odříkávat je jako spočinout v bezpečném náručí matky."
 witch.3014.guest.start.desc: "V předvečer velkého obřadu se scházíme na odlehlé mýtině. Záda nám hřeje mohutný oheň a vzduch je prosycen očekáváním."
 witch.3014.guest.good.desc: "[host.GetTitledFirstName] nás provází velkolepým obřadem. Starobylé modlitby nám plynou ze rtů v okouzlujícím rytmu plném krásy a příslibů. Začínáme tančit a společně směřujeme k velkolepému vyvrcholení. Dosáhneme ho jako jeden hlas a vyjeme k měsíci jméno [ROOT.Char.GetFaith.WitchGodName]."
 witch.3014.guest.bad.desc: "[host.GetTitledFirstName] nás provází rozpačitým obřadem. Je vidět, že se [Select_CString(host.IsFemale, 'snaží', 'snaží')] učinit tuto noc výjimečnou, ale výsledky jsou žalostné. Alespoň společnost je zajímavá..."
 witch.3014.guest.fallback.desc: "[host.GetTitledFirstName] nás provází obřadem se všemi správnými slovy i gesty. Starobylé modlitby nám plynou ze rtů v okouzlujícím rytmu, ale jejich obvyklá krása a síla jsou tentokrát slabší. [host.GetTitledFirstNameNoTooltip] si vede dostatečně dobře, a přesto tomu něco chybí."
 witch.3014.host.end.desc: "\n\nHlavní obřad je u konce a teď se můžeme s hosty oddávat uctívání, jak se nám zlíbí."
 witch.3014.guest.end.desc: "\n\nHlavní obřad je u konce a teď se můžeme oddávat uctívání, jak se nám zlíbí."
 witch.3014.a: "Experimentovat s bylinami společně s [herbalist.GetFirstNameNoTooltip]."
 witch.3014.a.knowledge: "[herbalist.GetFirstNameNoTooltip] mě naučí něco nového"
 witch.3014.a.inspiration: "Rozhovor je inspirující"
 witch.3014.b.start: "Požádat [teacher.GetFirstNameNoTooltip] o lekci v"
 witch.3014.b.diplomacy: "umění okouzlit druhé."
 witch.3014.b.martial: "strategii."
 witch.3014.b.stewardship: "obchodu."
 witch.3014.b.intrigue: "pletichaření."
 witch.3014.b.learning: "poezii."
 witch.3014.c: "Sdílet s někým tělesné dary, které nabízí [ROOT.Char.GetFaith.WitchGodName]."
 witch.3014.c.tt: "Pokusíš se najít někoho se stejnou touhou"
 witch.3014.d: "Strávit čas s [new_guest.GetFirstNameNoTooltip], [Select_CString(new_guest.IsFemale, 'která je', 'který je')] [new_guest.Custom('ComplimentAdjective')|l]."
 witch.3014.e: "Kde je [sex_partner.Custom('LoverPetName')|l]? Toužím po [Select_CString(sex_partner.IsFemale, 'jejím', 'jeho')] doteku..."
 witch.3014.d.move_in: "Skvěle si rozumíme"
 witch.3014.d.friend: "Dobře si rozumíme"
 witch.3014.d.enemy: "Strhne se mezi námi prudká hádka"
 witch.3014.f: "Smát se, pít, tančit - užívat si požehnání, která nabízí [ROOT.Char.GetFaith.WitchGodName]!"
 witch.3015.t: "U jezírka"
 witch.3015.start.desc: "V žilách mi pulzuje moc, kterou propůjčuje [ROOT.Char.GetFaith.WitchGodName], když se toulám lesem. Vítá mě sbor vzdechů a sténání - nejsem jediný, kdo dnes v noci touží po společnosti.\n\n"
 witch.3015.new_guest.desc: "U jezírka zalitého měsíčním svitem narazím na svou novou známost, [sex_partner.GetFirstName]."
 witch.3015.regular.desc: "U jezírka zalitého měsíčním svitem najdu [sex_partner.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 witch.3015.end.desc: "Když se zadívám [sex_partner.GetFirstNameNoTooltip] do očí, všechno do sebe zapadne. Taková je vůle toho, koho uctíváme jako [ROOT.Char.GetFaith.WitchGodName]. [sex_partner.GetFirstNameNoTooltip] mě láká blíž..."
 witch.3015.a: "Uctívejme společně."
 witch.3015.b: "Já... hledám někoho jiného."
 witch.3015.b.tt: "Strávíš noc o samotě"
 witch.3016.t: "Hvězdy se sešly"
 witch.3016.end.desc: "Ozve se známý hlas - je to [sex_partner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]. Otočím se a naše pohledy se střetnou. Všechno do sebe zapadne. My dva... Taková je vůle toho, koho uctíváme jako [ROOT.Char.GetFaith.WitchGodName]. Máme být spolu."
 witch.3016.a: "Navždy."
 witch.3016.b: "Já... na to ještě nejsem [Select_CString(ROOT.Char.IsFemale, 'připravená', 'připravený')]."
 witch.3017.end.desc: "Nevím, kam [sex_partner.GetFirstName] [Select_CString(sex_partner.IsFemale, 'odešla', 'odešel')], ale ani to vědět nemusím. Něco mě k [Select_CString(sex_partner.IsFemale, 'ní', 'němu')] přitahuje jako magnet železo. Když [sex_partner.GetFirstNameNoTooltip] konečně stojí přede mnou, v těch nádherných očích není ani stopa překvapení - jen láska a touha."
 witch.3017.a: "Jak dlouho jsem po tobě toužil..."
 witch.3017.b: "Já... na něco jsem [Select_CString(ROOT.Char.IsFemale, 'zapomněla', 'zapomněl')]! Promiň!"
 witch.3098.t: "Do příště"
 witch.3098.start.desc: "Spolu s hosty jsme"
 witch.3098.end.desc: "uctívali [ROOT.Char.GetFaith.WitchGodName], sdíleli posvátné vědění a navázali hluboká pouta. Hlava mi překypuje novými nápady, ale tělo zoufale touží po odpočinku. Teplé lůžko nikdy nebylo tak lákavé."
 witch.3098.a: "Ať nad námi bdí [ROOT.Char.GetFaith.WitchGodName], dokud nenastane příští $activity_witch_ritual$."
 witch.3099.start.desc: "Společně jsme"
 witch.3099.tt: "Když skončí $activity_witch_ritual$, vydáš se domů"
 witch.4001.t: "Boží soud"
 witch.4001.start.desc: "[annoying_clergy.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi už vážně leze na nervy! Není chvíle, kdy by [Select_CString(annoying_clergy.IsFemale, 'neomílala', 'neomílal')] pořád dokola [annoying_clergy.GetFaith.HighGodName] a božskou vůli.\n\nNejraději všem vykládá, jak [annoying_clergy.GetFaith.HighGodNameAlternate]"
 witch.4001.forgiving.desc: "považuje odpuštění za slabost."
 witch.4001.deceitful.desc: "trestá lháře."
 witch.4001.gluttonous.desc: "trestá ty, kdo nalézají potěšení v jídle a pití."
 witch.4001.wrathful.desc: "trestá ty, kdo se neumějí ovládat."
 witch.4001.greedy.desc: "trestá ty, kdo baží po bohatství."
 witch.4001.arbitrary.desc: "vyžaduje, abychom byli spravedliví a nestranní."
 witch.4001.sadistic.desc: "trestá ty, kdo jsou krutí k ostatním."
 witch.4001.craven.desc: "trestá ty, kdo jsou bázliví a opatrní."
 witch.4001.lustful.desc: "trestá nevěstky a smilníky."
 witch.4001.vengeful.desc: "vyžaduje, abychom nastavili i druhou tvář."
 witch.4001.arrogant.desc: "považuje hrdost na vlastní úspěchy za hřích."
 witch.4001.fallback.desc: "trestá hříšníky."
 witch.4001.witch.desc: "Proč ale brát slova postavy [annoying_clergy.GetFirstNameNoTooltip] vážně, když [ROOT.Char.GetFaith.WitchGodName] přijímá všechny takové, jací jsou, se všemi nedostatky? Jak ubohý život musí [annoying_clergy.GetFirstNameNoTooltip] vést!"
 witch.4001.impious.desc: "Ať jde [annoying_clergy.GetFaith.HighGodName] se svým věčným souzením k čertu!"
 witch.4001.a: "Zařídím, aby se [annoying_clergy.GetFirstNameNoTooltip] [Select_CString(annoying_clergy.IsFemale, 'stala', 'stal')] terčem posměchu v [capital.GetNameNoTooltip]!"
 witch.4001.a.tt: "I já umím soudit!"
 witch.4001.a.success: "Zařídíš, aby se [annoying_clergy.GetShortUINameNoTooltip] [Select_CString(annoying_clergy.IsFemale, 'zesměšnila', 'zesměšnil')]"
 witch.4001.a.failure: "[annoying_clergy.GetShortUINameNoTooltip] odhalí tvůj plán"
 witch.4001.c: "Stačí chvíli předstírat zbožnost a bude ticho."
 witch.4001.b: "[annoying_clergy.GetFirstNameNoTooltip|U] nebude vědět, čemu věřit, až skončím."
 witch.4001.b.success: "Otřeseš vírou postavy [annoying_clergy.GetShortUINameNoTooltip]. [annoying_clergy.GetFaith.HighGodName] už pro ni není nezpochybnitelnou pravdou"
 witch.4001.b.neutral: "[annoying_clergy.GetShortUINameNoTooltip] váhá"
 witch.4001.b.neutral.tt: "Můžeš to vzdát, nebo pokračovat"
 witch.4001.b.failure: "Nepodaří se ti ovlivnit postavu [annoying_clergy.GetShortUINameNoTooltip]"
 witch_4001_corruption_success_effect.tt: "Můžeš použít [Concept('blackmail','vydírání')|E] proti postavě [annoying_clergy.GetShortUIName] kvůli jejímu [Concept('secret','tajemství')|E]"
 witch.4002.witch.desc: "Za tímhle úspěchem musí stát [ROOT.Char.GetFaith.WitchGodName], protože můj plán dopadl ještě lépe, než jsem čekal!\n\n"
 witch.4002.impious.desc: "Můj plán byl dokonalý!\n\n"
 witch.4002.gluttonous.desc: "Do komnat, kde pobývá [annoying_clergy.GetTitledFirstName], dorazily koláče s přimíchanou omamnou látkou. [annoying_clergy.GetFirstNameNoTooltip] se jimi [Select_CString(annoying_clergy.IsFemale, 'nacpala', 'nacpal')] k prasknutí a pak se [Select_CString(annoying_clergy.IsFemale, 'potácela', 'potácel')] městem s marmeládou a drobky rozmazanými kolem úst, než [Select_CString(annoying_clergy.IsFemale, 'usnula', 'usnul')] na schodech [annoying_clergy.GetFaith.HouseOfWorship]!"
 witch.4002.lustful.desc: "Vznikla obzvlášť oplzlá báseň o [lustful_desc.Custom2('MyCharacterIntroduction', ROOT.Char)] a „[lustful_desc.Custom('ObjectifiedFeature')|l]“. Pod ní se skvěl zfalšovaný podpis se jménem [annoying_clergy.GetTitledFirstName] a báseň byla doručena do komnat, kde pobývá [lustful_desc.GetFirstName]. Věnování [lustful_desc.GetFirstNameNoTooltip] #EMP rozhodně#! nepotěšilo a své rozhořčení [Select_CString(lustful_desc.IsFemale, 'nijak neskrývala', 'nijak neskrýval')]."
 witch.4002.craven.desc: "Když [annoying_clergy.GetTitledFirstName] [Select_CString(annoying_clergy.IsFemale, 'spala', 'spal')], mezi prostěradla se nenápadně dostala krysa. Sotva se mi podařilo ukrýt, [annoying_clergy.GetFirstNameNoTooltip] se s výkřikem [Select_CString(annoying_clergy.IsFemale, 'probudila', 'probudil')], [Select_CString(annoying_clergy.IsFemale, 'vyrazila', 'vyrazil')] z postele a vyběhl ven - [Select_CString(annoying_clergy.IsFemale, 'nahá', 'nahý')] jako v den svého narození!"
 witch.4002.vengeful.desc: "[annoying_clergy.GetTitledFirstName] [Select_CString(annoying_clergy.IsFemale, 'uvěřila', 'uvěřil')] podplacenému písaři, který tvrdil, že [vengeful_desc.Custom2('MyCharacterIntroduction', ROOT.Char)] za [Select_CString(annoying_clergy.IsFemale, 'jejími', 'jeho')] zády pronáší urážky. Následující dny se [vengeful_desc.GetFirstNameNoTooltip] při každém setkání [Select_CString(vengeful_desc.IsFemale, 'stala', 'stal')] terčem neuvěřitelné hrubosti. Nakonec už toho [vengeful_desc.GetFirstNameNoTooltip] [Select_CString(vengeful_desc.IsFemale, 'měla', 'měl')] dost a proti zlomyslnému chování se otevřeně [Select_CString(vengeful_desc.IsFemale, 'ohradila', 'ohradil')]. [annoying_clergy.GetFirstNameNoTooltip] [Select_CString(annoying_clergy.IsFemale, 'neměla', 'neměl')] na svou obranu co říct."
 witch.4002.wrathful.desc: "Vím, že [annoying_clergy.GetTitledFirstName] bývá po alkoholu pěkně [Select_CString(annoying_clergy.IsFemale, 'protivná', 'protivný')] a navíc má slabost pro někoho z mého služebnictva. [wrathful_desc.GetWomanMan|U] z mého služebnictva [Select_CString(wrathful_desc.IsFemale, 'přinesla', 'přinesl')] do komnat, kde pobývá [annoying_clergy.GetTitledFirstName], láhev velmi drahého a ještě silnějšího alkoholu. Příslib povýšení byl dostatečnou motivací a [wrathful_desc.GetFirstNameNoTooltip] [Select_CString(wrathful_desc.IsFemale, 'opila', 'opil')] [Select_CString(annoying_clergy.IsFemale, 'ji', 'ho')] právě včas na [annoying_clergy.Custom('GetReligiousRite')|l]."
 witch.4002.arrogant.desc: "Přestože se to snaží skrývat, vím, že [annoying_clergy.GetTitledFirstName] si velmi zakládá na svém vzhledu. Každé ráno si s téměř nábožnou pravidelností nanáší jistou mast. Podařilo se mi vplížit do komnat a přimíchat do ní několik dráždivých bylin. Další den [annoying_clergy.GetTitledFirstNameNoTooltip] [Select_CString(annoying_clergy.IsFemale, 'měla', 'měl')] celý obličej posetý kopřivkou!"
 witch.4002.end.desc: "\n\nVčera večer se u dvora nemluvilo o ničem jiném. [annoying_clergy.GetFirstNameNoTooltip] se z toho jen tak nevzpamatuje!"
 witch.4002.a: "[Select_CString(annoying_clergy.IsFemale, 'Dobře jí tak!', 'Dobře mu tak!')]"
 witch.4003.desc: "Z tajné chodby za komnatami, kde pobývá [annoying_clergy.GetTitledFirstName], škodolibě naslouchám sténání a vzdechům [annoying_clergy.Custom2('InsultAdjective', ROOT.Char)|l] [annoying_clergy.Custom('WomanManPossessive')|l]. [annoying_clergy.GetFirstNameNoTooltip] si přečetl knihu, kterou jsem zanechal na posteli - a vlastně ji od té chvíle nedokázal odložit.\n\nZdá se, že pravdy ukryté v knize hluboce otřásly [Select_CString(annoying_clergy.IsFemale, 'její', 'jeho')] vírou. „Ach, [annoying_clergy.GetFaith.HighGodNameAlternate]! Potřebuji znamení! [Select_CString(annoying_clergy.IsFemale, 'Věřila', 'Věřil')] jsem v tebe, [Select_CString(annoying_clergy.IsFemale, 'prosazovala', 'prosazoval')] tvou vůli na zemi, ale teď... Vidím jen rozpory, klamy, ty... ty lži!“\n\nHlas [annoying_clergy.GetTitledFirstNameNoTooltip] se zlomí v nesrozumitelné vzlyky."
 witch.4003.a: "Odcházím. Má práce je hotova."
 witch.4003.b: "Je čas na hlubší pravdy."
 witch.4003.c: "[annoying_clergy.GetFirstNameNoTooltip|U] bude [Select_CString(annoying_clergy.IsFemale, 'mou učednicí', 'mým učedníkem')]!"
 witch.4004.desc: "Nevinně znějící teologické otázky zasely pochybnosti a [annoying_clergy.GetTitledFirstName] teď začíná ve své víře tápat. [Select_CString(annoying_clergy.IsFemale, 'Její', 'Jeho')] nejisté odpovědi i stín obav, který se objeví na tváři pokaždé, když si myslí, že se nikdo nedívá, mluví jasně.\n\nCíl je ještě přede mnou, ale poslední pokus #EMP by měl#! všechen odpor zlomit."
 witch.4004.a: "Stojí to za tu námahu!"
 witch.4004.b: "Svůj čas mohu využít lépe."
 witch.4005.desc: "Do komnat, kde pobývá [annoying_clergy.GetTitledFirstName], jsem [Select_CString(ROOT.Char.IsFemale, 'podstrčila', 'podstrčil')] knihu plnou nepříjemných pravd. Jen pár stránek však stačilo a [annoying_clergy.GetFirstNameNoTooltip] ji [Select_CString(annoying_clergy.IsFemale, 'hodila', 'hodil')] do ohně. Ta výzva zřejmě jen posílila [Select_CString(annoying_clergy.IsFemale, 'její', 'jeho')] víru - v srdci už nevidím ani stín pochybnosti."
 witch.4005.a: "[Select_CString(annoying_clergy.IsFemale, 'Stejně nebyla hodna!', 'Stejně nebyl hoden!')]"
 witch.4010.t: "Dary jsou hojné"
 witch.4010.desc: "Své dary vysypu na zem: byliny, mléko a med. Se zavřenýma očima a štiplavým kouřem v chřípí pozvednu paže k měsíci.\n\n„[ROOT.Char.GetFaith.WitchGodMistressMaster|U]! Tobě jsou známy všechny pravdy! [ROOT.Char.GetFaith.WitchGodMotherFather|U] veškeré moci! Přijmi prosím mé skromné dary a na oplátku mi poskytni své vedení!“\n\nObracím se na [ROOT.Char.GetFaith.WitchGodName] s prosbou o..."
 witch.4010.a: "Štěstí v umění lásky."
 witch.4010.b: "Šarm a takt."
 witch.4010.c: "Mysl stratéga."
 witch.4010.d: "Cit pro peníze a pořádek."
 witch.4010.e: "Pomoc stínů."
 witch.4010.f: "Moudrost a důvtip."
 witch.4010.g: "Štěstí s čepelí."
 witch.4010.h: "Klid mysli."
 witch.4020.t: "Brát, nebo dávat"
 witch.4020.two_witches.desc: "Společně s [prayer_witch_1.Custom2('MyCharacterIntroduction', ROOT.Char)] a [prayer_witch_2.Custom2('MyCharacterIntroduction', ROOT.Char)] se účastním"
 witch.4020.one_witch.desc: "Společně s [prayer_witch_1.Custom2('MyCharacterIntroduction', ROOT.Char)] se účastním"
 witch.4020.full_moon.desc: "obřadu za úplňku"
 witch.4020.new_moon.desc: "obřadu za novoluní"
 witch.4020.equinox.desc: "obřadu rovnodennosti"
 witch.4020.solstice.desc: "obřadu rovnodennosti"
 witch.4020.end.desc: ", při němž uctíváme [ROOT.Char.GetFaith.WitchGodName]. Jako hostitel musím vést naši modlitbu."
 witch.4020.a: "Moudrý [ROOT.Char.GetFaith.WitchGodMistressMaster|l], dopřej [prayer_witch_1.GetFirstNameNoTooltip] klid a jasnou mysl!"
 witch.4020.b: "Obdař [prayer_witch_2.GetFirstNameNoTooltip] svým požehnáním!"
 witch.4020.c: "[ROOT.Char.GetFaith.WitchGodMotherFather|U] tajemství, propůjč mi svou moc!"
 witch.4030.t: "Tajemství v kožené vazbě"
 witch.4030.no_friend.desc: "Mé kontakty mi poslaly svazek psaný jakousi podivnou šifrou. Koženou vazbu zdobí symboly toho, koho uctívám jako [ROOT.Char.GetFaith.WitchGodMistressMaster].\n\nZatím se mi podařilo rozluštit jen několik prvních stran, ale jejich obsah je nesmírně fascinující."
 witch.4030.friend.desc: "Má dobrá známost [witch_friend.GetTitledFirstName], [ROOT.GetCharacter.Custom2('RelationToMeShort' , SCOPE.sC('witch_friend'))|l], mi přinesla svazek psaný jakousi podivnou šifrou. Koženou vazbu zdobí symboly toho, koho společně uctíváme jako [ROOT.Char.GetFaith.WitchGodMistressMaster].\n\n[witch_friend.GetFirstNameNoTooltip|U] zatím [Select_CString(witch_friend.IsFemale, 'dokázala', 'dokázal')] rozluštit jen několik prvních stran, ale jejich obsah je nesmírně fascinující."
 witch.4030.friend.a: "Společně odhalíme jeho tajemství."
 witch.4030.no_friend.a: "Odhalím jeho tajemství, ať to trvá jakkoli dlouho!"
 witch.4030.b: "Znám někoho z našich, kdo by za tohle zaplatil pěkné peníze."
 witch.4030.c: "Dokonce i [convince_target_1.GetTitledFirstNameNoTooltip] těmto tajemstvím podlehne."
 witch.4030.c.success: "Svazek postavu [convince_target_1.GetShortUIName] naprosto uchvátí"
 witch.4030.c.failure: "[convince_target_1.GetShortUIName|U] svazek spálí"
 witch.4030.d: "Tohle bude [convince_target_2.GetTitledFirstNameNoTooltip] připadat #EMP velice#! zajímavé."
