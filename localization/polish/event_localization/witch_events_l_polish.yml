 witch.4031.start.desc: "Z úkrytu mám ničím nerušený výhled na svazek, který jsem zanechal mezi věcmi postavy [convince_target.GetTitledFirstName]. Sleduji vše kukátkem ukrytým za stěnou. Jakmile [convince_target.GetFirstNameNoTooltip] vstoupí dovnitř, oči okamžitě přitáhne právě ona kniha, jako by oplývala vlastní podivnou magií.\n\n"
 witch.4031.end.desc: "Když [convince_target.GetFirstNameNoTooltip] dočte přeložené stránky, začne přecházet sem a tam. Nakonec se zdá, že vábení svazku už nelze odolat, a [convince_target.GetFirstNameNoTooltip] se dychtivě vrhne po brku."
 witch.4031.a: "Přesně tak, příteli. Ponoř se hlouběji, ještě hlouběji..."
 witch.4032.end.desc: "[convince_target.GetFirstNameNoTooltip] knihu ani neotevře. Jakmile spatří podivné symboly, unikne [Select_CString(convince_target.IsFemale, 'jí', 'mu')] hlasité zalapání po dechu a knihu od sebe okamžitě odhodí."
 witch.4032.a: "#EMP Ne!#! Ať [ROOT.Char.GetFaith.HighGodName] prokleje toho bezpáteřního hlupáka!"
