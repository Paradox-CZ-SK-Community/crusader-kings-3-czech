l_polish:
 bp1_yearly.7000.t: "Snídaně s přítelem"
 bp1_yearly.7000.desc: "Když se chystám navštívit [ROOT.Char.GetFaith.HouseOfWorship], narazím na [distraction_friend.GetTitledFirstName]. [Select_CString(distraction_friend.IsFemale,'Je to má','Je to můj')] [ROOT.Char.Custom2('RelationToMeShort', distraction_friend)]. V ruce má malý vak. Rozhlédne se kolem a spiklenecky ho otevře, čímž odhalí nejrůznější jídlo a pití.\n\n„Je tak nádherný den, pojď se mnou ven na ranní piknik,“ vybídne mě.\n\nKdyž začnu namítat, že mířím do [ROOT.Char.GetFaith.HouseOfWorship], [distraction_friend.GetFirstNameNoTooltip] mě přeruší.\n\n„[ROOT.Char.GetFaith.HighGodName] tu bude i později, ale tyhle [ROOT.Char.Custom('GetExpensiveDessert')] ne.“"
 bp1_yearly.7000.a: "[ROOT.Char.GetFaith.HighGodName] je důležitější než snídaně."
 bp1_yearly.7000.b: "Skutečný hřích by byl tuhle příležitost promarnit."
 lovely_picnic_modifier: "Příjemný piknik"
 lovely_picnic_modifier_desc: "Příjemně strávený čas na pikniku."
 bp1_yearly.7001.t: "Na rybách"
 bp1_yearly.7001.desc: "Zastaví mě [fishing_friend.GetFirstName], [Select_CString(fishing_friend.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', fishing_friend)], s úsměvem od ucha k uchu. V rukou má dva rybářské pruty.\n\n„Pojď dnes se mnou na ryby, [fishing_friend.Custom2('RelationToMeShort', ROOT.Char)]. Slibuji, že se ti to bude líbit!“ zazní nadšeně.\n\nUž je to dlouho, co se mi podařilo na chvíli uniknout shonu a ruchu [ROOT.Char.Custom('FortifiedBuilding')]..."
 bp1_yearly.7001.a: "Chytím bájného bílého kapra!"
 bp1_yearly.7001.b: "[ROOT.Char.GetTitleAsNameNoTooltip] přece #EMP nerybaří#!."
 bp1_yearly_7001.a.tt: "Vyrazíš na ryby"
 bp1_yearly.7001.a.toast.good_time: "Skvělý výlet!"
 bp1_yearly.7001.a.toast.bad_time: "Příšerný výlet!"
 bp1_yearly.7001.a.toast.caught_fish: "Obří ryba je tvá!"
 bp1_yearly.7001.a.toast.white_carp: "Legendární bílý kapr je tvůj!"
 bp1_yearly.7002.t: "Nočníková rozepře"
 bp1_yearly.7002.desc: "Když si ulevím, zamířím k oknu a zadívám se na nádvoří pod sebou.\n\nNálada se mi okamžitě zkazí, když spatřím [chamberpot_rival.GetFirstName], jak prochází nádvořím s nesnesitelně spokojeným výrazem. Oči mi sklouznou k plnému nočníku vedle postele. Možná bych s tou dobrou náladou mohl něco udělat..."
 bp1_yearly.7002.a: "Pozor tam dole!"
 bp1_yearly.7002.b: "Takové dětinskosti jsou pod mou úroveň."
 bp1_yearly.7002.a.tt: "Pokusíš se obsah nočníku vylít na svou oběť"
 drenched_in_excrement_opinion: "Zalití výkaly"
 threw_excrement_opinion: "Téměř zalití výkaly"
 bp1_yearly.7002.a.toast.perfect_hit: "Přímý zásah!"
 bp1_yearly.7002.a.toast.miss: "Úplně vedle!"
 bp1_yearly.7002.a.toast.chamberpot: "Nočník letí dolů!"
 bp1_yearly.7002.a.toast.tripped: "Uklouzneš a skončíš ve výkalech!"
 bp1_yearly.7003.t: "Tapisérie"
 bp1_yearly.7003.desc: "[orgy_tapestry_maker.Custom2('MyCharacterIntroduction', ROOT.Char)] je k nenalezení. Nakonec vtrhnu do komnat, kde ale hledanou osobu #EMP nenajdu#!... zato objevím něco velmi zajímavého.\n\nPodle všeho tu vznikala tapisérie zobrazující dosti explicitní orgii. Jsem na ní i já, sevřený mezi [orgy_participant_1.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', orgy_participant_1)]) a [orgy_participant_2.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', orgy_participant_2)]). Kousek dál si [orgy_tapestry_maker.GetFirstNameNoTooltip] ([ROOT.Char.Custom2('RelationToMeShort', orgy_tapestry_maker)]) očividně užívá neméně. Do radovánek se zapojuje dokonce [ROOT.Char.GetFaith.DevilName], přímo po boku [orgy_tapestry_maker.GetFirstNameNoTooltip]. V rohu celé scény sedí [orgy_participant_3.GetFirstName] ([ROOT.Char.Custom2('RelationToMeShort', orgy_participant_3)]) s uchváceným úsměvem.\n\nNemám slov."
 bp1_yearly.7003.a: "Nechutné!"
 bp1_yearly.7003.b: "Tohle #EMP musí#! viset na mé zdi."
 bp1_yearly.7003.c: "Já jsem, ehm, špatně [Select_CString(ROOT.Char.IsFemale,'odbočila','odbočil')]."
 bp1_orgy_tapestry: "Tapisérie s orgií"
 bp1_orgy_tapestry_desc: "Tato tapisérie zobrazuje [orgy_participant_1.GetFirstName], [ROOT.Char.GetName], [orgy_participant_2.GetName], [orgy_participant_3.GetName] a [orgy_tapestry_maker.GetName] při orgii. Do radovánek se zapojuje také [ROOT.Char.GetFaith.DevilName]."
 bp1_yearly.7004.t: "Přátelská útěcha"
 bp1_yearly.7004.desc: "Když sedím a hledím ven, přichází ke mně [concerned_friend.GetFirstName], [Select_CString(concerned_friend.IsFemale,'má','můj')] [ROOT.Char.Custom2('RelationToMeShort', concerned_friend)]. „Od té doby... od toho, co se stalo, už nejsi jako dřív.“\n\nNemusí to ani vyslovit, je mi jasné, že naráží na chvíli, kdy [bad_memory.GetDescription].\n\n„Možná by ti pomohlo si s někým promluvit? Můžu tu být pro tebe,“ pokračuje jemně."
 bp1_yearly.7004.a: "To zní dobře."
 bp1_yearly.7004.b: "Mé starosti jsou jen moje."
 bp1_yearly.7005.t: "Laskavost pro přítele"
 bp1_yearly.7005.desc: "[Select_CString(borrowing_friend.IsFemale,'Má přítelkyně','Můj přítel')] [borrowing_friend.GetName] za mnou přichází a je očividné, že něco chce. Nakonec mě přestane bavit, jak chodí kolem horké kaše, a vyžádám si, ať mi konečně řekne, o co jde.\n\n„No, [Select_CString(borrowing_friend.IsFemale,'doufala jsem, že bych si mohla','doufal jsem, že bych si mohl')] na jeden večer půjčit [borrowed_artifact.GetName], ale nesmíš se ptát proč...“\n\nJe zjevné, že je tou prosbou v rozpacích. K čemu to jen může potřebovat?"
 bp1_yearly.7005.a: "Asi ano."
 bp1_yearly.7005.b: "Ani náhodou."
 bp1_yearly.7005.a.returned_artifact: "Vypůjčený artefakt vrácen."
 bp1_yearly.7006.t: "$bp1_yearly.7005.t$"
 bp1_yearly.7006.desc: "[borrowing_friend.GetName] ke mně přichází se sklopeným zrakem. „Prosím, nezlob se.“\n\nOdvede mě k [borrowed_artifact.GetName] a hned vidím, že je silně poškozený.\n\n„Je mi to líto, byla to nehoda...“ Na [borrowing_friend.GetFirstNameNoTooltip] je vidět opravdové zděšení."
 bp1_yearly.7006.a: "Ty [borrowing_friend.Custom2('InsultNoun', ROOT.Char)]."
 bp1_yearly.7006.b: "Nehody se stávají."
 bp1_yearly.7005.a.tt: "Tvůj artefakt může být poškozen"
 bp1_yearly.7007.t: "$bp1_yearly.7005.t$"
 bp1_yearly.7007.desc: "[borrowing_friend.GetName] mi vrací [borrowed_artifact.GetName]. Nejsem si [Select_CString(ROOT.Char.IsFemale,'jistá','jistý')], jestli ho jen [Select_CString(borrowing_friend.IsFemale,'vyčistila','vyčistil')], nebo skutečně nějak [Select_CString(borrowing_friend.IsFemale,'upravila','upravil')], ale vypadá působivěji než kdy dřív.\n\n„Doufám, že se ti líbí. [Select_CString(borrowing_friend.IsFemale,'Pracovala','Pracoval')] jsem na tom celý večer.“ dodává nervózně."
 bp1_yearly.7007.a: "To je nádhera!"
 bp1_yearly.7007.b: "Ty jsi [Select_CString(borrowing_friend.IsFemale,'upravila','upravil')] [borrowed_artifact.GetNameNoTooltip]?"
 didnt_trust_friend_opinion: "Projevená nedůvěra"
 trusted_friend_opinion: "Projevená důvěra"
 forgave_me_opinion: "Odpuštění"
 improved_artifact_opinion: "Vylepšení mého artefaktu"
 messed_with_artifact_opinion: "Zásah do mého artefaktu"
 bp1_yearly.7010.t: "Zkouška věrnosti"
 bp1_yearly.7010.desc: "Nemohu přestat přemýšlet nad tím, komu je [tested_friend.GetFirstName] skutečně [Select_CString(tested_friend.IsFemale,'věrná','věrný')]. Je naše přátelství opravdové, nebo mi jen podlézá?\n\nMožná mi malá zkouška konečně přinese klid...\n\nJeden z mých spolčenců, falešné tajemství a anonymní dar. Co by [tested_friend.GetFirstName] přimělo zradit mou důvěru?"
 bp1_yearly.7010.a: "Třicet stříbrných."
 bp1_yearly.7010.b: "Dvě... ne, #EMP tři#! krásné [tested_friend.Custom('AttractionWomanManMultiple')], připravené a ochotné."
 bp1_yearly.7010.c: "Příslib bohatství pro #EMP dalšího#! přítele, [friends_friend.GetFirstNameNoTooltip]."
 bp1_yearly.7010.d: "Tohle je pod mou úroveň."
 bp1_yearly.7010.toast.betrayed: "[tested_friend.GetFirstName] tě zradí"
 bp1_yearly.7010.toast.not_betrayed: "[tested_friend.GetFirstName] prokáže svou věrnost"
 bp1_yearly.7010.a.tt: "Věříš, že věrnost [tested_friend.GetFirstName] lze koupit zlatem"
 bp1_yearly.7010.b.tt: "Věříš, že [tested_friend.GetFirstName] dá tělesným rozkoším přednost před přátelstvím"
 bp1_yearly.7010.c.tt: "Věříš, že [friends_friend.GetFirstName] znamená pro [tested_friend.GetFirstName] víc než ty"
 bp1_yearly.7050.t: "Staří nepřátelé"
 bp1_yearly.7050.desc: "Jsem zpátky na bojišti. Bláto se mi lepí na boty, odporný pach mrtvých mě udeří do nosu a já znovu prožívám den, kdy [war_memory.GetDescription].\n\nProbouzím se s lapáním po dechu a tvář mi pokrývají studené krůpěje potu."
 bp1_yearly.7050.desc.married: "[sleeping_spouse.GetFirstName] se vedle mě zavrtí, ale neprobudí se. Se svými běsy se musím vypořádat [Select_CString(ROOT.Char.IsFemale,'sama','sám')]."
 bp1_yearly.7050.desc.not_married: "V pokoji jsem úplně [Select_CString(ROOT.Char.IsFemale,'sama','sám')] a se svými běsy se musím vypořádat bez pomoci."
 bp1_yearly.7050.a: "[Select_CString(ROOT.Char.IsFemale,'Měla bych','Měl bych')] se pokusit zapomenout."
 bp1_yearly.7050.b: "Už NIKDY neprohraju!"
 vengeance_obsessed_modifier: "Posedlost pomstou"
 bp1_yearly.7051.t: "Bitva u [battle_area.GetNameNoTooltip]"
 bp1_yearly.7051.desc: "Dodnes si živě pamatuji, jak [battle_memory.GetDescription]. Bitva se odehrála v terénu [battle_area.GetTerrain.GetNameNoTooltip], na který jsem tehdy vůbec nebyl připraven.\n\nOd té doby o tom často přemýšlím. Jsem si jistý, že kdyby k té bitvě došlo dnes, vedl bych své vojsko mnohem schopněji."
 bp1_yearly.7051.a: "Už nikdy nedovolím, aby se to opakovalo."
 bp1_yearly.7051.b: "Musím se naučit přizpůsobit."
 bp1_yearly.7052.t: "Příběh o..."
 bp1_yearly.7052.desc: "Oheň praská, něco už se vypilo a [story_friend.GetFirstName] po mně chce nějaký příběh.\n\nJako první mě napadne slavná lidová pověst [ROOT.Char.GetCulture.GetNameNoTooltip] kultury, klasika, která nikdy nezklame.\n\nAnebo bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] vyprávět něco z vlastního života, třeba o tom, jak [story_memory.GetDescription]."
 bp1_yearly.7052.a: "Zůstanu u tradice."
 bp1_yearly.7052.b: "Povím svůj vlastní příběh!"
 bp1_yearly.7052.c: "Proč ne obojí!"
 bp1_yearly.7053.t: "Vzpomínky na pomstu"
 bp1_yearly.7053.desc: "Když procházím městem, znovu mě zachvátí vztek. V poslední době nedokážu myslet na nic jiného než na to, jak [bad_memory.GetDescription].\n\nMusím se [bad_memory_participant.GetFirstNameNoTooltip] nějak pomstít. Zvednu oči k šibenici přede mnou. Když budu postupovat opatrně, možná na ní brzy skončí právě [bad_memory_participant.GetFirstNameNoTooltip]."
 bp1_yearly.7053.a: "Pomstím se."
 bp1_yearly.7053.b: "Musím se pokusit zapomenout."
 murder_memory_modifier: "Vzpomínky na pomstu"
 sex_memory_modifier: "Chlípná vzpomínání"
 bp1_yearly.7053.a.1: "Toto spiknutí získá bonus k šanci na úspěch."
 bp1_yearly.7054.t: "Zapomínání"
 bp1_yearly.7054.desc: "„[forgotten_memory.GetDescription]?“ ptám se zmateně.\n\nMoje dítě [memory_child.GetFirstName] se na mě ustaraně dívá. „Samozřejmě! Tenhle příběh jsi [Select_CString(ROOT.Char.IsFemale,'vyprávěla','vyprávěl')] už tolikrát, copak si nevzpomínáš?“\n\nPravdou je, že si nevzpomínám. Podrobnosti jsou poslední dobou čím dál mlhavější, ale přiznat to by možná působilo jako slabost."
 bp1_yearly.7054.a: "Ach ano, moje chyba."
 bp1_yearly.7054.b: "Poslední dobou toho tolik zapomínám."
 bp1_yearly.7055.t: "Zaznamenání vzpomínky"
 bp1_yearly.7055.desc.positive: "Některé okamžiky musí být uchovány navždy. Chvíle, kdy [recorded_memory.GetDescription], je jedním z nich. Tak neuvěřitelná vzpomínka si zaslouží, aby přetrvala navěky."
 bp1_yearly.7055.desc.negative: "Některé okamžiky musí být uchovány navždy. Chvíle, kdy [recorded_memory.GetDescription], je jedním z nich. Možná je to bolestná vzpomínka, ale někdo ji musí předat příštím generacím."
 bp1_yearly.7055.desc.neutral: "Některé okamžiky musí být uchovány navždy. Chvíle, kdy [recorded_memory.GetDescription], je jedním z nich."
 bp1_yearly.7055.desc.alone_poor_skill: "Psaní mi možná příliš nejde, ale s trochou času a úsilí bych to jistě [Select_CString(ROOT.Char.IsFemale,'zvládla','zvládl')] vlastní rukou.\n\n"
 bp1_yearly.7055.desc.alone_good_skill: "Díky své dokonalé znalosti jazyka [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] bych to snadno [Select_CString(ROOT.Char.IsFemale,'zvládla','zvládl')] sepsat vlastní rukou.\n\n"
 bp1_yearly.7055.desc.blind: "Bohužel mi slepota nedovoluje, abych cokoli [Select_CString(ROOT.Char.IsFemale,'sepsala','sepsal')] vlastní rukou...\n\n"
 bp1_yearly.7055.desc.poet: "[Select_CString(poet.IsFemale,'Má dvorní básnířka','Můj dvorní básník')] [poet.GetFirstName] by mi [Select_CString(poet.IsFemale,'mohla být velmi užitečná','mohl být velmi užitečný')]. [Select_CString(poet.IsFemale,'Její','Jeho')] mistrovství prózy by proměnilo má všední slova v umění."
 bp1_yearly.7055.desc.friend: "Na druhou stranu [Select_CString(friend.IsFemale,'má drahá přítelkyně','můj drahý přítel')] [friend.GetFirstName] píše mnohem lépe než já. Jistě mi pomůže, když požádám."
 bp1_yearly.7055.desc.ending: "Sestavit a ilustrovat celý svazek však může rychle přijít draho..."
 bp1_yearly.7055.poet: "[Select_CString(poet.IsFemale,'Básnířka','Básník')] [poet.GetFirstNameNoTooltip] to sepíše!"
 bp1_yearly.7055.friend: "[friend.GetFirstNameNoTooltip] je [Select_CString(friend.IsFemale,'opravdová přítelkyně','opravdový přítel')]."
 bp1_yearly.7055.high_skill: "Zaznamenám to vlastní rukou."
 bp1_yearly.7055.a: "Zaznamenám to vlastní rukou, dá-li [ROOT.Char.GetFaith.HighGodName]."
 bp1_yearly.7055.b: "Na tohle není čas..."
 recorded_memory_character: "Vzpomínka na [memory_participant.GetTitledFirstNameNoTooltip]"
 recorded_memory: "Vzpomínka [ROOT.Char.GetTitledFirstNamePossessiveNoTooltip]"
 recorded_memory_desc: "Tento svazek vypráví příběh o tom, jak [recorded_memory.GetThirdPerspectiveDescription].\n\n[Select_CString(ROOT.Char.IsFemale,'Sepsala','Sepsal')] [ROOT.Char.GetFirstName]."
 bp1_yearly.7056.t: "Zastrašovací taktika"
 bp1_yearly.7056.desc: "Odvedu [intimidation_target.GetFirstName] do svých [ROOT.Char.Custom('GetDungeonPlural')] a začnu vyprávět o strašlivých věcech, které jsem [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')] lidem, kteří se mi postavili.\n\n„Určitě už se k tobě doneslo, jak [intimidation_memory.GetDescription],“ dodám s potěšením. „A to byl teprve #EMP začátek.#!“\n\nKdyž se uchechtnu, oči [intimidation_target.GetFirstNamePossessiveNoTooltip] se rozšíří hrůzou."
 bp1_yearly.7056.a: "Neboj se, stačí dělat, co říkám, a nic se ti nestane..."
 bp1_yearly.7056.b: "Řekni o mně #EMP všem#!!"
 bp1_yearly.7057.t: "Náboženské vytržení"
 bp1_yearly.7057.desc: "Sedím v [ROOT.Char.GetFaith.HouseOfWorship]. [realm_priest.GetCouncilTitleFirstName] promlouvá, ale má mysl opouští jeho slova a vrací se ke chvíli, kdy [sex_memory.GetDescription]. Od té doby se mi [sex_partner.GetFirstName] vrací do myšlenek téměř každý den."
 bp1_yearly.7057.desc.male: "\n\nBohužel to má jisté dost nápadné následky. Když si [ROOT.Char.GetFaith.ReligiousText] podržím ve správné poloze, možná se mi podaří tento narůstající problém skrýt, aniž by si toho někdo všiml..."
 bp1_yearly.7057.desc.female: "\n\nBohužel to má jisté poněkud... problematické následky."
 bp1_yearly.7057.a: "[sex_partner.GetNameNoTooltip] #EMP mi musí patřit#!..."
 bp1_yearly.7057.b: "Pryč s těmi myšlenkami!"
 bp1_yearly.7057.c: "Kde jinde si lépe ulevit než v [ROOT.Char.GetFaith.HouseOfWorship]?"
 bp1_yearly.7057.a.tt: "[Concept('scheme','Tato intrika')|E] získá bonus k šanci na úspěch."
 bp1_yearly.7058.t: "Katastrofa se zásobami"
 bp1_yearly.7058.desc: "Ranní sbor štěbetajících ptáků mě doprovází ke skladišti zásob. Matné světlo úsvitu ustupuje ponuré tmě a [ROOT.Char.Custom('GetRoom')] mě vítá šerem. Cestou zívám a protahuji se, chodidla tiše našlapují po podlaze.\n\nJakmile si oči přivyknou nedostatku světla, odhalí se přede mnou kulinářská tragédie: ohryzky jablek, rozházené drobky, kosti obrané dočista od masa. V šoku se rozhlížím a [ROOT.Char.Custom('GetRoom')] všude skýtá další a další důkazy.\n\nNáhle se z kouta ozve tiché, spokojené #EMP říhnutí#!..."
 bp1_yearly.7058.glutton: "Mám ještě další jídlo! Otevřeme #EMP tajnou zásobu!#!"
 bp1_yearly.7058.a: "Tohle mi zaplatíš. A pěkně s úroky, jestli máš čím."
 bp1_yearly.7058.b: "Když se ti líbily zásoby, pak tě [ROOT.Char.Custom('GetDungeon')] #EMP nadchne#!!"
 bp1_yearly.7058.c: "#EMP *Povzdech*#! Tak to beru na sebe... asi..."
 bp1_yearly.7030.t: "Tělesná útěcha"
 bp1_yearly.7030.desc: "Od chvíle, kdy [Select_CString(dead_friend.IsFemale,'zemřela','zemřel')] [dead_friend.GetFirstName], se [dead_friend_spouse.GetFirstName] nedokáže vzpamatovat. Jednoho večera mě přijde navštívit.\n\n„Cítím se tak osaměle,“ řekne [dead_friend_spouse.GetFirstName] a toužebně se na mě zadívá. Připomínám si, že [dead_friend.GetFirstNameNoTooltip] [Select_CString(dead_friend.IsFemale,'byla mou dobrou přítelkyní','byl mým dobrým přítelem')].\n\n„Tvoje útěcha pro mě tolik znamená,“ pokračuje [dead_friend_spouse.GetFirstName] a vyzývavě se kousne do rtu. [dead_friend.GetFirstNameNoTooltip] [Select_CString(dead_friend.IsFemale,'byla mou přítelkyní','byl mým přítelem')].\n\n„Jen chci zase něco cítit,“ zašeptá [dead_friend_spouse.GetFirstName]. [dead_friend_spouse.Custom('GetUpperClothingArticle')] má vpředu zapínání a [dead_friend_spouse.GetFirstName] je začne pomalu uvolňovat. [dead_friend.GetFirstNameNoTooltip] #EMP [Select_CString(dead_friend.IsFemale,'byla mou přítelkyní','byl mým přítelem')]#!..."
 bp1_yearly.7030.a: "[dead_friend.GetFirstNameNoTooltip] by to jistě [Select_CString(dead_friend.IsFemale,'schválila','schválil')]..."
 bp1_yearly.7030.b: "Vzpamatuj se, [dead_friend_spouse.GetFirstNameNoTooltip]!"
 bp1_yearly.7100.t: "Od nechuti k nenávisti"
 bp1_yearly.7100.desc: "Ještě před okamžikem si užívám příjemnou procházku na slunci po [owned_county.GetName] a vzápětí mě od hlavy k patě pokrývají výkaly a válím se v blátě. Když si konečně zuřivě setřu nečistoty z [ROOT.Char.Custom('EyeEyes')], pachatele najdu bez nejmenších obtíží.\n\n„[potential_nemesis.GetTitledFirstName] vám posílá pozdravy!“ zazní z okna a vzápětí už tam nikdo není.\n\nMarně se pokouším v nedalekém potoce vyprat jeden kus oděvu, na kterém mi obzvlášť záleží, ale je jasné, že už ho nic nezachrání."
 bp1_yearly.7100.a: "Teď už je to #EMP osobní...#!"
 bp1_yearly.7100.b: "[potential_nemesis.GetFirstNameNoTooltip] za to zaplatí krví!"
 bp1_yearly.7100.c: "Pamatuj si má slova, [potential_nemesis.GetFirstNameNoTooltip], tohle ti oplatím."
 bp1_yearly.7100.d: "Pomsta je pod mou úroveň..."
 bp1_yearly.7100.c.tt: "[potential_nemesis.GetFirstNameNoTooltip] má milovanou kočku, která se tu před chvílí potulovala..."
 bp1_yearly.7100.e: "Tohle oblečení si schovám na... později."
 focused_on_revenge_modifier: "Soustředění na pomstu"
 focused_on_revenge_modifier_desc: "Tato postava se soustředí výhradně na zkázu svých rivalů a kvůli tomu zanedbává mnoho svých povinností."
 vengeful_opinion: "Pomstychtivost"
