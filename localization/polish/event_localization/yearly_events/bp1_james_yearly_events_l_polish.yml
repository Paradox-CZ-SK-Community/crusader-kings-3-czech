l_polish:
 bp1_yearly.9001.t: "Přítel ze dřeva"
 bp1_yearly.9001.opening: "Přátelé bývají tak nestálí a snadno člověka zradí, ale můj nejdražší přítel mě nikdy nezradil. Moje oblíbená hračka je pro mě mnohem víc než jen hračka, [Select_CString(ROOT.Char.IsFemale,'je mou nejlepší přítelkyní','je mým nejlepším přítelem')].\n\n"
 bp1_yearly.9001.desc.bully: "[bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] se mi však před ostatními dětmi bez ustání posmívá a tvrdí, že jsem tak k smíchu, že si nedokážu najít ani skutečné přátele. Mohl bych svou oblíbenou hračku zahodit a posměšky by určitě přestaly, ale tím bych opustil někoho, kdo je mi ze všech nejbližší!"
 bp1_yearly.9001.desc.mentor: "[bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] však trvá na tom, že mám svou oblíbenou hračku odložit, trávit čas se „skutečnými“ dětmi a pořádně se s nimi stýkat. Jenže vůbec nechápe, co pro mě moje milovaná hračka znamená!"
 bp1_yearly.9001.a: "Asi už na ni nemám věk."
 bp1_yearly.9001.b: "[Select_CString(ROOT.Char.IsFemale,'Svou nejlepší přítelkyni nikdy neopustím!','Svého nejlepšího přítele nikdy neopustím!')]"
 bp1_yearly.9002.desc.opening: "Každý den vídám [bp1_yearly_9001_shy_kid.Custom2('MyCharacterIntroduction', ROOT.Char)], jak pobíhá po [ROOT.Char.Custom('GetCourt')] se svou oblíbenou hračkou v ruce. Občas se dokonce někam schová a povídá si s ní, jako by to byl nejlepší přítel na světě!\n\n"
 bp1_yearly.9002.desc.bully: "Je to naprosto ubohé a myslím, že nastal čas ukázat, jak křehké takové přátelství doopravdy je."
 bp1_yearly.9002.desc.mentor: "Připadá mi to dost podivné a obávám se, že bez mého zásahu [bp1_yearly_9001_shy_kid.GetFirstName] vyroste, ale citově zůstane dítětem. Všechny rozumné prosby, aby hračku odložil, však zatím vyšly naprázdno."
 bp1_yearly.9002.a: "Zničím ji!"
 bp1_yearly.9002.b: "Možná bude lepší nechat to být."
 bp1_yearly.9002.c: "Zničím ji a budu doufat, že mi [bp1_yearly_9001_shy_kid.GetFirstName] odpustí."
 bp1_yearly.9003.desc.child: "Naštěstí se [toy_hater.GetName] [Select_CString(toy_hater.IsFemale,'rozhodla','rozhodl')] mou nejlepší kamarádku ušetřit a nechává mě, ať si s ní celý den hraju a povídám!\n\nChvíli to vypadalo, že [toy_hater.GetFirstName] mou hračku opravdu zavraždí, ale nakonec přežila další den."
 bp1_yearly.9003.desc.mentor: "Dnes za mnou [Select_CString(bp1_yearly_9001_shy_kid.IsFemale,'zavítala','zavítal')] [bp1_yearly_9001_shy_kid.Custom2('MyCharacterIntroduction', ROOT.Char)] s radostnými slzami v očích a vypráví mi, že [bp1_yearly_9001_toy_hater.GetName] málem zničil oblíbenou hračku, ale nakonec ji ušetřil.\n\nJe to trochu přehnaná reakce na to, že jedno dítě neroztřískalo kus dřeva, ale i tak se z toho dá něco naučit."
 bp1_yearly.9003.a.child: "[bp1_yearly_9001_toy_hater.GetFirstName] přece jen [Select_CString(bp1_yearly_9001_toy_hater.IsFemale,'není tak hrozná','není tak hrozný')]."
 bp1_yearly.9003.a.mentor: "Vidíš, i tyrani se někdy zachovají správně."
 bp1_yearly.9003.b.child: "Teď už nikoho dalšího nepotřebuji!"
 bp1_yearly.9003.b.mentor: "Ale [bp1_yearly_9001_toy_hater.GetFirstName] ji #EMP [Select_CString(bp1_yearly_9001_toy_hater.IsFemale,'mohla zničit','mohl zničit')]#!!"
 bp1_yearly.9004.t: "Přátelství na třísky"
 bp1_yearly.9004.desc: "Nemůžu tomu uvěřit. Ještě před chvílí byla moje nejlepší kamarádka v bezpečí v mé náruči a vzápětí ji svírají hrubiánské pracky [bp1_yearly_9001_toy_hater.GetNamePossessive]! Je to čiré zlo, [ROOT.Char.GetFaith.DevilName] v dětské podobě. [bp1_yearly_9001_toy_hater.GetFirstName] se zachechtá, zvedne mou hračku vysoko do vzduchu a pak s ní prudce mrští o zem. Zůstane z ní jen hromádka třísek. Pláču nad svou milovanou přítelkyní a zoufale se ji snažím složit zpátky dohromady, ale marně. Před očima se mi právě odehrála vražda."
 bp1_yearly.9004.a: "[bp1_yearly_9001_toy_hater.GetFirstNameNoTooltip], jednou ti udělám totéž!"
 bp1_yearly.9004.b: "Je to těžké, ale [bp1_yearly_9001_toy_hater.GetFirstNameNoTooltip] si zaslouží odpuštění."
 bp1_yearly.9004.c: "Už nikdy nevyjdu ven!"
 bp1_yearly.9005.t: "Nikdy neodpustím"
 bp1_yearly.9005.desc.imprisoned: "Konečně se [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] ocitá v mém žaláři, přesně tam, kam patří! Možná už ani neví, že před tolika lety [Select_CString(bp1_yearly_9001_toy_hater.IsFemale,'zničila','zničil')] mou drahocennou hračku, mého nejlepšího přítele, ale já jsem [Select_CString(ROOT.Char.IsFemale,'nezapomněla','nezapomněl')]."
 bp1_yearly.9005.desc.guest: "Právě když si myslím, že konečně budu mít chvíli klidu, zjistím, že [bp1_yearly_9001_toy_hater.Custom2('MyCharacterIntroduction', ROOT.Char)] pobývá u mého dvora! Každý den vidím [bp1_yearly_9001_toy_hater.GetFirstName], jak jí moje jídlo a spí v mých postelích, jako by tu všechno bylo [Select_CString(bp1_yearly_9001_toy_hater.IsFemale,'její','jeho')]. Už to dál nesnesu!\n\n"
 bp1_yearly.9005.desc.outro: "[bp1_yearly_9001_toy_hater.GetFirstName] je teď v mé moci. Zbývá jediná otázka. Jak se vlastně domoci spravedlnosti za tak strašlivý zločin?"
 bp1_yearly.9005.a: "Čas na pomstu!"
 bp1_yearly.9005.b: "Čas na vraždu!"
 bp1_yearly.9005.c: "Čas odpustit."
 may_lead_to_vengeful: "Může vést k získání [Concept('trait','rysu')|E] [GetTrait('vengeful').GetName( GetNullCharacter )|LV]"
 may_lead_to_forgiving: "Může vést k získání [Concept('trait','rysu')|E] [GetTrait('forgiving').GetName( GetNullCharacter )|LV]"
 may_lead_to_shy: "Může vést k získání [Concept('trait','rysu')|E] [GetTrait('shy').GetName( GetNullCharacter )|LV]"
 bp1_living_as_peasant_modifier: "Život mezi rolníky"
 bp1_living_as_peasant_modifier_desc: "Tato postava tráví dlouhé chvíle životem mezi místními rolníky, aby unikla tlaku spojenému s vládnutím."





 bp1_yearly.9006.t: "Hříšná úvaha"
 bp1_yearly.9006.desc.intro: "Když se vracím z [ROOT.Char.GetFaith.HouseOfWorship], přistoupí ke mně [bp1_yearly_9006_sinful_courtier.GetNameNoTooltip] s chlípně pobaveným úsměvem.\n\n„[ROOT.Char.GetFirstNameNoTooltip], vím, že oba"
 bp1_yearly.9006.desc.lustful: "si dopřáváme tělesné slasti, které nám [ROOT.Char.GetFaith.PriestNeuterPlural] chtějí upírat!"
 bp1_yearly.9006.desc.gluttonous: "sdílíme vášeň pro bezpočet chutí a vůní, které nám svět nabízí prostřednictvím kouzelného umění zvaného vaření. Svět je plný skvělého jídla, skutečným hříchem by bylo neochutnat všechno!"
 bp1_yearly.9006.desc.vengeful: "máme potěšení z toho, když naše nepřátele stihne zasloužený trest. [ROOT.Char.GetFaith.PriestNeuterPlural] sice radost z utrpení nepřátel označují za „hříšnou“, ale podle mě pouze vykonáváme božskou spravedlnost."
 bp1_yearly.9006.desc.sadistic: "se tetelíme blahem při nářku a křiku nevinných i zatracených! Když už stejně zemřou, proč si s nimi předtím trochu neužít?"
 bp1_yearly.9006.desc.craven: "máme dost neustálého vychloubání všech těch surovců jejich údajnými skutky „statečnosti“. No a co, že zabijí zvíře jako [ROOT.Char.Custom('GetAnimalType')]? Je to jen zbytečné riziko!"
 bp1_yearly.9006.desc.arbitrary: "víme, že spravedlnost je jen slovo, kterým ostatní ospravedlňují vlastní rozmary, a že ve skutečnosti nikdo neví, co je spravedlivé. Proč má být naše vůle svévolná, zatímco vůle [ROOT.Char.GetFaith.PriestNeuterPlural] spravedlivá?"
 bp1_yearly.9006.desc.deceitful: "víme, že „pravda“ se dá zábavně ohýbat a každý, kdo je natolik pošetilý, aby naletěl lži, si zaslouží, co ho potká."
 bp1_yearly.9006.desc.chaste: "máme po krk tělesných rozkoší, kterým ostatní propadají jako obyčejná zvířata. Není snad klidný večer plný zábavy a rozjímání příjemnější než další změť zpocených, páchnoucích těl?"
 bp1_yearly.9006.desc.greedy: "víme, že si musíme držet to, co nám patří, a nedávat nic chudým a „potřebným“! Jestli chtějí naše bohatství, neměli promrhat to svoje."
 bp1_yearly.9006.desc.wrathful: "neskrýváme své emoce a necháváme nenávist i hněv volně a bez zábran proudit tělem. Říkají nám, že své pocity nemáme projevovat, že máme dusit to, co je uvnitř, a ještě tomu říkají ctnost."
 bp1_yearly.9006.desc.cynical: "zpochybňujeme autoritu světské církve v duchovních záležitostech. Co skutečně [ROOT.Char.GetFaith.PriestNeuter] ví? Snad se mu [ROOT.Char.GetFaith.DivineRealm] nezjevuje jasněji než nám."
 bp1_yearly.9006.desc.ambitious: "toužíme po mnohem víc než po drobcích, které jsme dostali při narození. [ROOT.Char.GetFaith.PantheonTerm] pro nás jistě zamýšlí víc! Nemůžeme se spokojit s tím, co máme, když víme, že jsme předurčeni k něčemu mnohem většímu!"
 bp1_yearly.9006.desc.shy: "považujeme společnost ostatních za naprosto vyčerpávající. Čeká se od nás, že budeme mluvit s tolika lidmi, ale oni nemají co zajímavého říct a my jim také nemáme co zajímavého odpovědět. Proč s nimi ztrácet čas, když nám o samotě bude lépe?"
 bp1_yearly.9006.desc.callous: "se vůbec nestaráme o utrpení ostatních. Proč bychom se měli zabývat jejich pomíjivými pocity, když je v sázce naše vlastní ničím nerušené štěstí?"
 bp1_yearly.9006.desc.generic: "žijeme podle sebe bez ohledu na nesmysly, které mohou [ROOT.Char.GetFaith.PriestNeuterPlural] hlásat."
 bp1_yearly.9006.desc.outro: "Koneckonců, kdo nám může říkat, že [ROOT.Char.GetFaith.HighGodName] chce, abychom žili právě tak či onak?“\n\n„Máme toho očividně společného mnohem víc než rozdílného a myslím, že bychom spolu měli trávit více času, daleko od prohnilých mozků prostého lidu. Co říkáš?“"
 bp1_yearly.9006.a: "Skvělý nápad, pravím!"
 bp1_yearly.9006.b: "Hříšnými myšlenkami se chlubit nebudu!"
 bp1_yearly.9007.t: "Zrcadlo v blátě"
 bp1_yearly.9007.desc: "Když procházím ulicemi [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] v obvyklém doprovodu stráží a dvořanů, spatřím něco, co mě přiměje zastavit a zalapat po dechu.\n\nPřede mnou žebrá kdosi z lidu. Proti rozmarům počasí nemá nic než bláto a cáry a zoufalýma prosebnýma očima na mě hledí. Už bych pokračoval dál, ale na té tváři mi připadá cosi podivně povědomého.\n\nVtom někdo z mého průvodu vykřikne, že [bp1_yearly_9007_doppelganger.GetName] vypadá přesně jako já! Je děsivé vidět vlastní obraz válet se ve špíně, ale možná mohu tuto kosmickou nespravedlnost napravit."
 bp1_yearly.9007.a: "[bp1_yearly_9007_doppelganger.GetNameNoTooltip] se připojí k mému dvoru!"
 bp1_yearly.9007.b: "Zbavte mě téhle ohavné kopie."
 bp1_yearly.9007.c: "Jdeme dál. Na tuhle podivnou bytost zapomenu."
 bp1_yearly.9008.t: "V kůži mého druhého já"
 bp1_yearly.9008.desc: "Už je to nějaký čas, co [bp1_yearly_9007_doppelganger.GetName] pobývá u mého dvora, a pohled na mé druhé já užívající si života šlechty namísto válení ve špíně a bídě je docela příjemný.\n\n[bp1_yearly_9007_doppelganger.GetName] ke mně přichází s jiskrou v oku a předkládá zajímavý návrh. „Nikdo doma neví, že si tu žiju mezi šlechtou. Napadlo mě, že bychom si měli na den vyměnit místa, [ROOT.Char.GetLadyLord]. Já budu [ROOT.Char.GetTitleAsNameNoTooltip] místo tebe a ty si na den zkusíš život obyčejného člověka!“"
 bp1_yearly.9008.a: "Na jeden den budu místo vlády poslouchat!"
 bp1_yearly.9008.b: "To je urážlivý návrh."
 bp1_yearly.9009.t: "Další láska"
 bp1_yearly.9009.desc.intro: "Když se blížím ke své ložnici, zaslechnu znepokojivé zvuky, jako by uvnitř probíhal divoký zápas! Prudké nárazy, zmítání a... křik [bp1_yearly_9009_lover.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\nVtrhnu dovnitř a spatřím své druhé já [bp1_yearly_9007_doppelganger.GetNameNoTooltip] bez jediného kusu oděvu spolu s [bp1_yearly_9009_lover.GetNameNoTooltip] při věcech, které se ani neodvažuji pojmenovat!"
 bp1_yearly.9009.desc.lustful: "„Je mi to tak líto, lásko,“ rozpláče se [bp1_yearly_9009_lover.GetFirstName]. „Jenže [bp1_yearly_9007_doppelganger.GetNameNoTooltip] je prostě o trochu pohlednější než ty! [bp1_yearly_9007_doppelganger.GetNameNoTooltip] mi rozbuší srdce!“"
 bp1_yearly.9009.desc: "[bp1_yearly_9009_lover.GetFirstName] tvrdí, že vůbec nebylo možné poznat, že to nejsem já, ale nevím, jestli tomu věřit."
 bp1_yearly.9009.a: "Zmizte mi z očí!"
 bp1_yearly.9009.b: "Tu pohlednou stvůru zavřete."
 bp1_yearly.9009.c: "Pravé lásce nemohu stát v cestě."
 bp1_yearly.9009.d: "Teď chápu, že mi záleží na obou!"
 bp1_yearly.9010.t: "Dvakrát [ROOT.Char.GetTitleAsNameNoTooltip]"
 bp1_yearly.9010.desc.intro: "[bp1_yearly_9007_doppelganger.GetName] vtrhne do mého trůnního sálu,"
 bp1_yearly.9010.desc.drunk: "a všude kolem je cítit [ROOT.Char.Custom('RegionalDrink')]. V očích má vztek a vrávorá ke mně.\n\n„Podvod! To *#EMP škyt#!*"
 bp1_yearly.9010.desc.stoner: "a vzduch okamžitě zaplní pach hašišového kouře a potu. Krví podlité oči bezcílně bloudí kolem mé hlavy, zatímco se ke mně líně potácí se šíleným chechotem.\n\n„Podvod! To *#EMP kašl#!*"
 bp1_yearly.9010.desc.outro: "[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9007_doppelganger'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9007_doppelganger'))] není [ROOT.Char.GetNameNoTooltip]! [Select_CString(bp1_yearly_9007_doppelganger.IsFemale,'Já jsem ta pravá','Já jsem ten pravý')] [ROOT.Char.GetNameNoTooltip]!“\n\nJe to očividná lež, přesto se můj dvůr jakýmsi způsobem nechá přesvědčit, že o mé skutečné totožnosti lze pochybovat! Když [bp1_yearly_9007_doppelganger.GetNameNoTooltip] tasí zbraň, je jasné, že jedinou odpovědí je násilí."
 bp1_yearly.9010.a: "[Select_CString(ROOT.Char.IsFemale,'Zůstane jen jedna!','Zůstane jen jeden!')]"
 bp1_yearly.9010.a_tt: "Začne [Concept('single_combat_duel','duel')|E]: [bp1_yearly_9007_doppelganger.GetShortUIName]"
 bp1_yearly.9010.b: "Stráže, chopte se té stvůry!"
 bp1_yearly.9012.t: "Dvojitý problém"
 bp1_yearly.9012.desc: "„Vítězství! Vidíte? Férový souboj přece ukázal, kdo je opravdu [ROOT.Char.GetNameNoTooltip]!“\n\n[bp1_yearly_9007_doppelganger.GetName] slaví vítězství. Mnozí sice stále nejsou přesvědčeni, jiné však tento projev udatnosti zviklal a už začínají pochybovat o mně. Šlechta uspořádá malé hlasování a nakonec potvrdí, že [ROOT.Char.GetNameNoTooltip] jsem stále já, byť jen těsnou většinou.\n\nVětšina stále věří, že jsem tím, za koho se vydávám, ale dost lidí se nechalo přesvědčit, že právě [bp1_yearly_9007_doppelganger.GetNameNoTooltip] je ve skutečnosti [ROOT.Char.GetNameNoTooltip]. Z tohoto střetnutí tak [bp1_yearly_9007_doppelganger.GetNameNoTooltip] odchází s nárokem na mé tituly a s houfem lidí, kteří věří, že právě [bp1_yearly_9007_doppelganger.GetNameNoTooltip] jsem já!"
 bp1_yearly.9012.a: "Ztrácím rozum já, nebo všichni ostatní?"
 bp1_yearly.9013.desc: "Jakmile je vyhlášeno mé vítězství nad mou falešnou kopií, všichni, kdo snad pochybovali o mé skutečné totožnosti, náhle zmlknou. Stráže se chopí [bp1_yearly_9007_doppelganger.GetNameNoTooltip], ale syčení a posměšky neustávají a sálem se dál rozléhá jekot o království, které bylo údajně neprávem odepřeno.\n\nAčkoli [bp1_yearly_9007_doppelganger.GetNameNoTooltip] stále tvrdí, že ve skutečnosti je [ROOT.Char.GetNameNoTooltip], za zdmi mého žaláře už taková tvrzení vyslechne málokdo."
 bp1_yearly.9013.a: "Konečně je po všem."
 bp1_yearly.9014.t: "Víc než jen hezká tvář"
 bp1_yearly.9014.desc.soulmate: "Když ležím v posteli se svou krásnou [Select_CString(bp1_yearly_9007_doppelganger.IsFemale,'milenkou','milencem')] [bp1_yearly_9007_doppelganger.GetNameNoTooltip], zjišťuji, že toho máme společného mnohem víc než jen vzhled. [bp1_yearly_9007_doppelganger.GetNameNoTooltip] má geniální mysl a [Select_CString(bp1_yearly_9007_doppelganger.IsFemale,'je nesmírně vzdělaná','je nesmírně vzdělaný')], navíc často vyslovuje myšlenky, které mě už tolikrát napadly, ale nikdy jsem pro ně nedokázal najít správná slova! Jako by naše mysli byly jednou a dokázaly navzájem dokončovat své myšlenky. Takový vztah může znamenat jediné: lásku!\n\nAle [Select_CString(ROOT.Char.IsFemale,'jsem opravdu tak zahleděná do sebe','jsem opravdu tak zahleděný do sebe')], že bych své vlastní druhé já [Select_CString(bp1_yearly_9007_doppelganger.IsFemale,'nazvala nejen milenkou, ale rovnou... spřízněnou duší','nazval nejen milencem, ale rovnou... spřízněnou duší')]?"
 bp1_yearly.9014.desc.lover: "Stále častěji vyhledávám společnost okouzlující [bp1_yearly_9007_doppelganger.GetName]. Zpočátku pro mě [bp1_yearly_9007_doppelganger.GetNameNoTooltip] nebyl ničím víc než znepokojivým odrazem mé vlastní tváře, ale postupně zjišťuji, že společné chvíle jsou příjemné a uklidňující. Když se spolu procházíme po mém dvoře, oba náhle strneme, protože se naše ruce dotknou.\n\nJe to jen letmý dotek, přesto mi žene krev do tváří. Nervózně pohlédnu na [bp1_yearly_9007_doppelganger.GetNameNoTooltip] a zdá se, že to cítíme oba stejně.\n\n[Select_CString(ROOT.Char.IsFemale,'Jsem opravdu tak sebestředná','Jsem opravdu tak sebestředný')], že bych vůbec uvažoval o tom nazývat své druhé já... [Select_CString(bp1_yearly_9007_doppelganger.IsFemale,'milenkou','milencem')]?"
 bp1_yearly.9014.a: "Samozřejmě že ano!"
 bp1_yearly.9014.a.arrogant: "Miluju se- totiž tebe, tolik!"
 bp1_yearly.9014.b: "N-ne! Tohle nemůžeme!"
 bp1_yearly.9015.t: "Na všechno musí být dva"
 bp1_yearly.9015.desc: "Od chvíle, kdy trávím čas s okouzlující [bp1_yearly_9007_doppelganger.GetName], působí [bp1_yearly_9015_living_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] zamyšleně a neklidně. Snad náš vztah neschvaluje?\n\nPo chvíli naléhání [bp1_yearly_9015_living_parent.GetNameNoTooltip] se slzami přizná pravdu. „Jste dvojčata, [ROOT.Char.GetFirstNameNoTooltip]! Když jste se narodili, [Select_CString(bp1_yearly_9015_living_parent.IsFemale,'nechtěla jsem, aby kvůli tomu někdo zpochybnil tvé nástupnictví, a tak jsem vás rozdělila','nechtěl jsem, aby kvůli tomu někdo zpochybnil tvé nástupnictví, a tak jsem vás rozdělil')]. Nikdy mě nenapadlo, že se znovu najdete!“\n\nTohle přiznání je přinejmenším šokující. Co si s tou informací počít?"
 bp1_yearly.9015.a: "Obejmi mě, [bp1_yearly_9007_doppelganger.Custom('SisterBrother')]!"
 bp1_yearly.9015.b: "Nikdo se to nesmí dozvědět."
 bp1_yearly.9016.t: "[Select_CString(bp1_yearly_9016_uppity_child.IsFemale,'Žena, která chce být','Muž, který chce být')] [ROOT.Char.GetTitleAsNameNoTooltip]"
 bp1_yearly.9016.desc.intro: "To, co začalo jako obyčejné rodinné setkání v hodovní síni [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], se rychle změnilo v prudkou hádku mezi [bp1_yearly_9016_heir.Custom2('MyCharacterIntroduction', ROOT.Char)] a [bp1_yearly_9016_uppity_child.Custom2('MyCharacterIntroduction', ROOT.Char)]!\n\n[bp1_yearly_9016_uppity_child.GetNameNoTooltip] tvrdí, že [bp1_yearly_9016_heir.GetNameNoTooltip] si vůbec nezaslouží být mým dědicem.\n\n"
 bp1_yearly.9016.desc.not_a_child: "„[bp1_yearly_9016_heir.GetNameNoTooltip] ani není [Select_CString(bp1_yearly_9016_heir.IsFemale,'tvá dcera','tvůj syn')]! Jaké má právo mít přede mnou přednost v nástupnictví, až odejdeš do [ROOT.Char.GetFaith.PositiveAfterLife]?"
 bp1_yearly.9016.desc.bastard: "„[bp1_yearly_9016_heir.GetNameNoTooltip] není [Select_CString(bp1_yearly_9016_heir.IsFemale,'žádná legitimní dcera','žádný legitimní syn')] této rodiny. [Select_CString(bp1_yearly_9016_uppity_child.IsFemale,'Já jsem se narodila jako legitimní dítě svých rodičů','Já jsem se narodil jako legitimní dítě svých rodičů')], tak proč má trůn připadnout nemanželskému dítěti?“"
 bp1_yearly.9016.desc.child_of_concubine: "„[bp1_yearly_9016_heir.GetNameNoTooltip] pochází z lůna obyčejné konkubíny! [bp1_yearly_9016_uppity_child.Custom('GetCulturallyAppropriateMarriageReference')] mezi tebou a [bp1_yearly_9016_uppity_child.GetMother.GetName] je svazek, z něhož pocházím já, a koruna mi náleží rodným právem!“"
 bp1_yearly.9016.desc.rival: "„[bp1_yearly_9016_heir.GetNameNoTooltip] tě zradil snad tisíckrát, zatímco [Select_CString(bp1_yearly_9016_uppity_child.IsFemale,'já jsem ti zůstala věrná','já jsem ti zůstal věrný')]! Jak můžeme věřit, že se tahle prostopášná stvůra po tvé smrti postará o [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], když se nedokáže postarat ani o tebe, dokud jsi ještě tady?“"
 bp1_yearly.9016.desc.fallback: "„[bp1_yearly_9016_heir.GetNameNoTooltip] [Select_CString(bp1_yearly_9016_heir.IsFemale,'je naprosto nehodná koruny','je naprosto nehodný koruny')] a po mém nástupu na trůn si zaslouží nanejvýš dělat mi šaška! Dost dlouho už [Select_CString(bp1_yearly_9016_heir.IsFemale,'stála první v pořadí na korunu','stál první v pořadí na korunu')]. Je načase ukázat, kam patří.“"
 bp1_yearly.9016.desc.outro: "„Vyzývám tě na souboj, [bp1_yearly_9016_heir.GetNameNoTooltip]! Souboj o trůn!“"
 bp1_yearly.9016.a: "Tohle bude zajímavé."
 bp1_yearly.9016.b: "[Select_CString(bp1_yearly_9016_uppity_child.IsFemale,'Sedni si, ty hlupačko!','Sedni si, ty hlupáku!')]"
 9016_uppity_child_wins: "Duel vyhrává [bp1_yearly_9016_uppity_child.GetName]"
 9016_heir_wins: "Duel vyhrává [bp1_yearly_9016_heir.GetName]"
 bp1_yearly.9017.t.culture: "Cizí [bp1_yearly_9017_uppity_child.Custom('GetPrincessPrince')]"
 bp1_yearly.9017.t.faith: "Nevěřící [bp1_yearly_9017_uppity_child.Custom('GetPrincessPrince')]"
 bp1_yearly.9017.desc.intro: "V noci u ohně spatřím [bp1_yearly_9017_uppity_child.Custom2('MyCharacterIntroduction', ROOT.Char)], jak zadumaně hledí do plamenů s intenzitou hodnou [ROOT.Char.GetFaith.KnowledgeGodName]. Zeptám se, co se děje, a [bp1_yearly_9017_uppity_child.GetNameNoTooltip] se ke mně otočí s očima planoucíma hněvem a studem.\n\n"
 bp1_yearly.9017.desc.culture: "„Nejsem jako vy ostatní! Neznám zvyky ani tradice [ROOT.Char.GetCulture.GetName] kultury. Cítím se tu osaměle, [Select_CString(bp1_yearly_9017_uppity_child.IsFemale,'jsem žena','jsem muž')] z [bp1_yearly_9017_uppity_child.GetCulture.GetName] kultury a žiju mezi [ROOT.Char.GetCulture.GetCollectiveNoun] u dvora, jako bych [Select_CString(bp1_yearly_9017_uppity_child.IsFemale,'měla právo tvrdit, že k nim patřím','měl právo tvrdit, že k nim patřím')]."
 bp1_yearly.9017.desc.faith: "„Nejsem jako oni! Nemodlím se ani neuctívám bohy stejně jako vy, [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]! Já, [bp1_yearly_9017_uppity_child.GetFaith.GetAdherentNameNoTooltip], mám zdědit [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|L] plné nevěřících."
 bp1_yearly.9017.desc.outro: "„[Select_CString(bp1_yearly_9017_uppity_child.IsFemale,'Jsem podvodnice a už nemohu být tvou dědičkou!','Jsem podvodník a už nemohu být tvým dědicem!')]“"
 bp1_yearly.9017.a: "Naše rozdíly bychom měli oslavovat, [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)]!"
 bp1_yearly.9017.b.culture: "Ať už patříš k [bp1_yearly_9017_uppity_child.GetCulture.GetName] nebo [ROOT.Char.GetCulture.GetName] kultuře, pořád jsi [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)]."
 bp1_yearly.9017.b.faith: "Ať už jsi [bp1_yearly_9017_uppity_child.GetFaith.GetAdherentNameNoTooltip] nebo [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], pořád jsi [ROOT.Char.Custom2('RelationToMe', bp1_yearly_9017_uppity_child)]."
 bp1_yearly.9017.c: "Výborný nápad. Tímto tě vyděďuji!"
 cultural_acceptance_embraced_child: "Oslava kultury"
 cultural_acceptance_rejected_child: "Vyloučení kvůli kultuře"
 bp1_yearly.9018.t: "Vášeň, nebo čistota"
 bp1_yearly.9018.desc.intro: "Ve chvíli naprosté bezradnosti ke mně [bp1_yearly_9018_illegitimate_child.Custom2('MyCharacterIntroduction', ROOT.Char)] přiběhne, obejme mi nohy a potřísní mě slzami a hlenem.\n\n"
 bp1_yearly.9018.desc.bastard: "„[ROOT.Char.GetMotherFather|U]! Je to tak *#EMP smrk#!* hrozné, už to nevydržím! [bp1_yearly_9018_bully.GetName|U] se mi pořád posmívá a tvrdí, že už můj původ dokazuje, že nemám žádnou morálku a nezasloužím si tvou lásku. Řekni, že to není pravda!“\n\n"
 bp1_yearly.9018.desc.child_of_concubine: "„[ROOT.Char.GetMotherFather|U]! [bp1_yearly_9018_bully.GetName|U] říká, že děti konkubín jsou nečisté! [bp1_yearly_9018_bully.GetNameNoTooltip] si přede mnou zacpává nos a říká, že ze mě táhne krev konkubíny. Řekni, že mě miluješ, [ROOT.Char.GetMotherFather]!“\n\n"
 bp1_yearly.9018.desc.outro.callous: "V tuhle chvíli tomu děcku klidně naslibuju cokoli, jen ať se mě pustí. Ale co říct?"
 bp1_yearly.9018.desc.outro: "[bp1_yearly_9018_illegitimate_child.Custom('GirlBoy')] očividně prožívá velmi citlivou chvíli, ale co říct?"
 bp1_yearly.9018.a: "Možná je načase, abychom si všichni tři promluvili."
 bp1_yearly.9018.b: "[bp1_yearly_9018_bully.Custom('GirlBoyPlural')|U] zkrátka budou [bp1_yearly_9018_bully.Custom('GirlBoyPlural')]!"
 bp1_yearly.9018.c: "Proč brečíš? Tohle se přece dá vyřešit násilím."
 9018_uppity_child_wins: "Duel vyhrává [bp1_yearly_9018_illegitimate_child.GetName]"
 9018_bully_child_wins: "Duel vyhrává [bp1_yearly_9018_bully.GetName]"
 bp1_yearly.9019.t: "[bp1_yearly_9019_lover.GetWomanMan|U] v naší posteli"
 bp1_yearly.9019.desc.intro.gay: "Nadešla chvíle, které jsem se tolik [Select_CString(ROOT.Char.IsFemale,'obávala','obával')]. Tiše sebou trhnu a po špičkách vejdu do své [ROOT.Char.Custom('GetChamber')], protože vím, že uvnitř čeká [bp1_yearly_9019_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] a očekává další večer milování bez špetky vášně."
 bp1_yearly.9019.desc.intro.bi: "Opět nadešel čas vejít do své [ROOT.Char.Custom('GetChamber')] a pokusit se s [bp1_yearly_9019_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] zplodit dítě."
 bp1_yearly.9019.desc.bridge: "K mému překvapení však přede mnou stojí [bp1_yearly_9019_spouse.GetName], [Select_CString(bp1_yearly_9019_spouse.IsFemale,'zcela oblečená, a vedle ní','zcela oblečený, a vedle něj')] [Select_CString(bp1_yearly_9019_lover.IsFemale,'nahá žena','nahý muž')]! Dožaduji se vysvětlení a na tváři [bp1_yearly_9019_spouse.GetFirstNameNoTooltip] se objeví vědoucí úsměv.\n\n"
 bp1_yearly.9019.desc.bridge.gay: "„Už nějakou dobu vím, že dotek [Select_CString(bp1_yearly_9019_spouse.IsFemale,'ženy','muže')] v tobě nikdy nedokázal zažehnout touhu."
 bp1_yearly.9019.desc.bridge.bi: "„Už nějakou dobu vím, že toužíš po doteku [Select_CString(bp1_yearly_9019_lover.IsFemale,'další ženy','dalšího muže')]."
 bp1_yearly.9019.desc.compassionate: "Nezlobím se ani nežárlím, chci jen, abys [Select_CString(ROOT.Char.IsFemale,'byla šťastná','byl šťastný')]. Možná by naše milování bylo skutečně plné lásky, kdyby se k nám [Select_CString(bp1_yearly_9019_lover.IsFemale,'přidala i tahle žena','přidal i tenhle muž')]!“"
 bp1_yearly.9019.desc.lustful: "Mně na tom nesejde, toužím jen po noci plné vášně! Možná bychom si ji oba užili víc, kdyby se k našemu milování [Select_CString(bp1_yearly_9019_lover.IsFemale,'přidala i naše přítelkyně','přidal i náš přítel')] zde.“"
 bp1_yearly.9019.desc.cynical: "Upřímně je mi jedno, s kým nebo s čím chceš souložit. Chci jen vlastní legitimní dítě zrozené z našeho svazku.“"
 bp1_yearly.9019.desc.lover: "\n\nNapadá mě, zda [bp1_yearly_9019_spouse.GetFirstNameNoTooltip] vůbec tuší, že s [bp1_yearly_9019_lover.GetName] už známe svá těla velmi důvěrně. Ať tak či onak, takové překvapení jsem opravdu [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')]!"
 bp1_yearly.9019.desc.friend: "\n\nNikdy bych [Select_CString(ROOT.Char.IsFemale,'nečekala','nečekal')], že svou [Select_CString(bp1_yearly_9019_lover.IsFemale,'drahou přítelkyni','drahého přítele')] uvidím v tak choulostivé situaci, ale nemohu upřímně tvrdit, že se mi ten pohled nelíbí."
 bp1_yearly.9019.desc.stranger: "\n\nDocela by mě zajímalo, kde [bp1_yearly_9019_spouse.GetFirstNameNoTooltip] [Select_CString(bp1_yearly_9019_spouse.IsFemale,'našla','našel')] [Select_CString(bp1_yearly_9019_lover.IsFemale,'tuhle ubohou ženu','tohoto ubohého muže')], ale nadšení [Select_CString(bp1_yearly_9019_lover.IsFemale,'jí','mu')] rozhodně nechybí."
 bp1_yearly.9019.desc.outro: ""
 bp1_yearly.9019.a: "Při [ROOT.Char.GetFaith.FertilityGodName], splnila se mi všechna přání?"
 bp1_yearly.9019.b: "Mlč, [bp1_yearly_9019_spouse.Custom2('InsultNoun', ROOT.Char)]! S [bp1_yearly_9019_lover.GetNameNoTooltip] budu spát o samotě!"
 bp1_yearly.9019.c: "Cože? Ne, to přece nemohu!"
 bp1_yearly.9020.t: "Podivná žádost"
 bp1_yearly.9020.desc.intro: "Opět nadešel čas pokusit se zplodit dítě s [bp1_yearly_9020_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)], ale když se připravuji na další noc milování bez špetky vášně, [bp1_yearly_9020_spouse.GetFirstNameNoTooltip] mě probodne děsivým pohledem.\n\n„Obyčejné milování je taková otrava, nemyslíš? Napadlo tě někdy,"
 bp1_yearly.9020.desc.goat: "co všechno by se dalo dělat s kozou? Ty rohy, ta rozcuchaná bradka, to, jak jí vůbec nezáleží na tom, co sežere. Kdybychom jednu přivedli do [ROOT.Char.Custom('GetChamber')], už její pronikavý pach by mi stačil, aby se ve mně rozhořela vášeň!“"
 bp1_yearly.9020.desc.vegetable: "jak přirozeně erotická může být kořenová zelenina? Jen si představ, jaké by to bylo cítit jeden z darů země od [ROOT.Char.GetFaith.CreatorNamePossessive] na těch nejcitlivějších místech svého těla?“"
 bp1_yearly.9020.desc.bondage: "[Select_CString(ROOT.Char.IsFemale,'jaké to asi je být jednou z našich vězeňkyň? Spoutaná řetězy a vydaná napospas rozmarům krutého žalářníka, který tě touží přimět křičet.','jaké to asi je být jedním z našich vězňů? Spoutaný řetězy a vydaný napospas rozmarům krutého žalářníka, který tě touží přimět křičet.')] Jen si představ, jak snadné by bylo přinést nějaké řetězy a... vybavení z [ROOT.Char.Custom('GetDungeon')].“"
 bp1_yearly.9020.desc.feet: "jaké to asi je být podlahou v naší [ROOT.Char.Custom('GetChamber')]? Bosá chodidla se na tebe tisknou, jsi pouhý předmět určený k používání a pošlapávání ostatními. Už jen při té představě mi hoří slabiny!“"
 bp1_yearly.9020.desc.hof: "jaké by to bylo ulehnout s [ROOT.Char.ReligiousHeadTitleName]? Prsty [ROOT.Char.ReligiousHeadTitleName] tráví tolik času přejížděním po svatých knihách, jen si představ, co asi dokážou! Představuj si, že jsi [ROOT.Char.ReligiousHeadTitle], a měj mě za [ROOT.Char.GetFaith.ReligiousText]!“"
 bp1_yearly.9020.desc.outro: "\n\nNemám slov, kterými bych [Select_CString(ROOT.Char.IsFemale,'popsala','popsal')], co jsem právě [Select_CString(ROOT.Char.IsFemale,'vyslechla','vyslechl')], ale jako [ROOT.Char.GetTitleAsNameNoTooltip] mám povinnost dbát na to, aby [bp1_yearly_9020_spouse.GetTitleAsNameNoTooltip] [Select_CString(bp1_yearly_9020_spouse.IsFemale,'byla spokojená','byl spokojený')], a přivést na svět další legitimní děti bez ohledu na cenu. Kdo ví? Třeba se mi to zalíbí."
 bp1_yearly.9020.a: "Cokoli, jen když tě to potěší."
 bp1_yearly.9020.b: "Ne! Cokoli, jen ne tohle!"
 bp1_yearly.9020.c: "O tvé odporné zvrácenosti se dozvědí všichni."
 bp1_yearly.9021.t: "[ROOT.Char.GetFaith.DevilName|U] v mé posteli"
 bp1_yearly.9021.desc: "[bp1_yearly_9021_rival_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] ve mně vzbuzuje tak ryzí nenávist, že ji slovy ani nedokážu vystihnout. Mé povinnosti coby [ROOT.Char.GetTitleAsNameNoTooltip] však bohužel vyžadují, abych vlastní city [Select_CString(ROOT.Char.IsFemale,'odsunula','odsunul')] stranou a připomněl si, že [bp1_yearly_9021_rival_spouse.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9021_rival_spouse.Custom2('InsultNoun', ROOT.Char)] je [Select_CString(bp1_yearly_9021_rival_spouse.IsFemale,'má manželka','můj manžel')] a „milování“ patří k našim povinnostem.\n\n[Select_CString(ROOT.Char.IsFemale,'Čekala jsem, že budu nenávidět každou vteřinu, ale sotva se pustíme do našeho bezduchého souložení, projede mi tělem žár, jaký jsem dosud nepoznala.','Čekal jsem, že budu nenávidět každou vteřinu, ale sotva se pustíme do našeho bezduchého souložení, projede mi tělem žár, jaký jsem dosud nepoznal.')] Při pohledu na čirou zášť a nenávist v očích [bp1_yearly_9021_rival_spouse.GetFirstNameNoTooltip] se mi rozbuší srdce a slabiny náhle ožijí. Poznám, že [bp1_yearly_9021_rival_spouse.GetFirstNameNoTooltip] cítí totéž podle toho, jak mě přitiskne k lůžku a rukama sjíždí po celém mém těle se stejnou měrou pohrdání i vášně. Co je to za pocit? Láska? Nenávist? Nějaká odporná směs obojího?\n\nAť už je ten pocit jakýkoli, nejspíš je hříšný. Může však být vášnivé milování mezi manželi sezdanými před zraky [ROOT.Char.GetFaith.HighGodName] skutečně hříchem? I když se nenávidíme, znamená to snad, že si nemůžeme užít povinnou jízdu?"
 bp1_yearly.9021.a: "Nenávidím tě, miláčku! Přitiskni se ke mně."
 bp1_yearly.9021.b: "[Select_CString(ROOT.Char.IsFemale,'Nejspíš jsem si jen představovala','Nejspíš jsem si jen představoval')] čepel přitisknutou k tomu jemnému krku."
 bp1_yearly.9022.t: "Přátelský zásah"
 bp1_yearly.9022.desc.intro: "Po dalším náročném dni v roli [ROOT.Char.GetTitleAsNameNoTooltip] se vracím do své [ROOT.Char.Custom('GetChamber')], ale rychle zjistím, že [Select_CString(ROOT.Char.IsFemale,'nejsem sama','nejsem sám')]. Čeká tam [bp1_yearly_9022_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] a výraz ve tváři nevěstí nic dobrého.\n\n„[ROOT.Char.GetFirstNameNoTooltip],"
 bp1_yearly.9022.desc.hashishiyah: "všichni si čas od času rádi dáme dobrý hašišový koláček, ale když s tebou mluvím, připadá mi, jako bych mluvil jen s hašišem. Z člověka, kterého jsem kdysi [Select_CString(bp1_yearly_9022_friend.IsFemale,'znala','znal')] jako [ROOT.Char.GetFirstNameNoTooltip], už v tom téměř nepřetržitém omámení mnoho nezbývá a stýská se mi po rozhovorech, které dávají střízlivému člověku smysl."
 bp1_yearly.9022.desc.drunkard: "pokaždé, když spolu mluvíme, cítím z tvého dechu jen [ROOT.Char.Custom('RegionalDrink')] a z úst ti padají nesmysly jako [Select_CString(ROOT.Char.IsFemale,'bezmozkové opilkyni','bezmozkovému opilci')]. Čas od času se napít je zábava, ale popravdě už si skoro nepamatuji, kdy jsi [Select_CString(ROOT.Char.IsFemale,'byla naposledy střízlivá','byl naposledy střízlivý')]."
 bp1_yearly.9022.desc.rakish: "tvá bezmocná závislost na nevěstkách a nevěstincích přivolává strašlivou pohromu na tvé tělo i duši. Tolik neznámých lidí se s tebou vystřídalo, že [Select_CString(bp1_yearly_9022_friend.IsFemale,'kdybych tě měla za kus dobytka, nechala bych tě z opatrnosti i z milosrdenství utratit','kdybych tě měl za kus dobytka, nechal bych tě z opatrnosti i z milosrdenství utratit')]."
 bp1_yearly.9022.desc.comfort_eater: "existuje vůbec chvíle, kdy něco nežvýkáš? Jídlo je přirozený dar, který nám dal [ROOT.Char.GetFaith.CreatorName], ale když tě vidím jíst, je jasné, že z něj nemáš žádnou radost. Kolik jídla bude potřeba, aby zaplnilo tu prázdnotu v tvé duši?"
 bp1_yearly.9022.desc.inappetetic: "kdy jsi naposledy něco jedl? Začínáš vypadat jako mrtvola, kůže je jen vak natažený přes vratkou věž kostí. Kdykoli tě vidím, probudí se ve mně pečovatelský instinkt a chci tě pořádně nakrmit něčím vydatným a výživným. Jak dlouho ještě potrvá, než se úplně rozpadneš v prach?"
 bp1_yearly.9022.desc.flagellant: "proč si musíš tolik ubližovat? Když se zraňuješ, děláš to opravdu pro [ROOT.Char.GetFaith.HighGodName], nebo je to zoufalé volání po tom, aby si někdo všiml bolesti ve tvé duši? Pojď, promluv si se mnou. Nedokážu snést pohled na další jizvu na těle [Select_CString(ROOT.Char.IsFemale,'své drahé přítelkyně','svého drahého přítele')]."
 bp1_yearly.9022.desc.reclusive: "musím tě snad pronásledovat, abych s tebou vůbec [Select_CString(bp1_yearly_9022_friend.IsFemale,'prohodila','prohodil')] pár slov? Kdy jsi naposledy někoho [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] z jiného důvodu než kvůli svým povinnostem? Už nedokážu jen nečinně přihlížet a žebrat o sebemenší kousek tvé pozornosti."
 bp1_yearly.9022.desc.outro: "Dovol mi, abych ti [Select_CString(bp1_yearly_9022_friend.IsFemale,'pomohla','pomohl')], [ROOT.Char.GetFirstNameNoTooltip].“\n\nÚplně mě to zaskočí. Kdo vůbec je [bp1_yearly_9022_friend.GetFirstNameNoTooltip], aby soudil, jak žiju?\n\n„Dej si na čas. Nikam nejdu.“"
 bp1_yearly.9022.a: "Máš pravdu. Potřebuji pomoc."
 bp1_yearly.9022.b: "Vypadni! Okamžitě vypadni!"
 bp1_yearly.9023.t: "Jazyková bariéra"
 bp1_yearly.9023.desc: "Tak [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] trávím čas s [bp1_yearly_9023_friend.Custom2('MyCharacterIntroduction', ROOT.Char)], i když se obvykle neobejdeme bez tlumočníka. Jazyková bariéra nám zpravidla nevadí, ale dnes jsem zřejmě něčím, co jsem [Select_CString(ROOT.Char.IsFemale,'řekla','řekl')], [Select_CString(bp1_yearly_9023_friend.IsFemale,'svou drahou přítelkyni','svého drahého přítele')] [Select_CString(ROOT.Char.IsFemale,'rozrušila','rozrušil')].\n\n[bp1_yearly_9023_friend.GetNameNoTooltip] [Select_CString(bp1_yearly_9023_friend.IsFemale,'řekla něco, co znělo jako vtip','řekl něco, co znělo jako vtip')], a tak jsem se ze zdvořilosti [Select_CString(ROOT.Char.IsFemale,'zasmála','zasmál')]. Pak se na mě však [Select_CString(bp1_yearly_9023_friend.IsFemale,'podívala pohledem, který vydal za tisíc slov','podíval pohledem, který vydal za tisíc slov')]. Když mi ten pohled pronikl až do duše, [Select_CString(ROOT.Char.IsFemale,'viděla jsem','viděl jsem')], jak se naše přátelství, které překonalo i jazykovou bariéru, začíná rozpadat.\n\nCo mohu udělat, abych situaci [Select_CString(ROOT.Char.IsFemale,'napravila','napravil')] a naše přátelství [Select_CString(ROOT.Char.IsFemale,'zachránila','zachránil')]?"
 bp1_yearly.9023.a: "Zamumlat něco, co zní jako [bp1_yearly_9023_friend.GetCulture.GetLanguage.GetNameNoTooltip], a doufat v nejlepší."
 bp1_yearly.9023.b: "Možná bych se měl naučit [bp1_yearly_9023_friend.GetCulture.GetLanguage.GetNameNoTooltip]."
 bp1_yearly.9023.c: "[bp1_yearly_9023_friend.GetNameNoTooltip] by se měl naučit [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]!"
 bp1_yearly.9024.t: "Pečující ruka"
 bp1_yearly.9024.desc: "Tahle nemoc ze mě vysává život, ale naštěstí mám [bp1_yearly_9024_friend.Custom2('MyCharacterIntroduction', ROOT.Char)], [Select_CString(bp1_yearly_9024_friend.IsFemale,'která se o mě během zotavování svědomitě stará','který se o mě během zotavování svědomitě stará')].\n\nNavzdory mému stavu si připadám jako v bavlnce. [bp1_yearly_9024_friend.GetNameNoTooltip] mi vaří, pere oblečení a pečuje o mě, jako by [Select_CString(bp1_yearly_9024_friend.IsFemale,'nebyla ničím víc než obyčejnou služkou','nebyl ničím víc než obyčejným sluhou')]!"
 bp1_yearly.9024.a: "Je příjemné mít tak starostlivé přátele."
 bp1_yearly.9024.b: "Dokážu se o sebe postarat!"
 bp1_sickness_being_doted_on: "Hýčkání"
 bp1_sickness_being_doted_on_desc: "O tuto postavu je během nemoci po všech stránkách postaráno."
 bp1_yearly.9025.t: "Teď už tě znám"
 bp1_yearly.9025.desc: "Konečně s [bp1_yearly_9025_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] mluvíme stejným jazykem a už nějakou dobu spolu vedeme jeden rozhovor za druhým.\n\nMá to jen jeden háček. Velmi rychle jsem [Select_CString(ROOT.Char.IsFemale,'zjistila','zjistil')], že z duše nenávidím každé odporné slovo, které vypadne z úst toho [bp1_yearly_9025_friend.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9025_friend.Custom2('InsultNoun', ROOT.Char)]. Pokud tu nedošlo k nějakému nedorozumění, začínám přemýšlet, jak vůbec může někdo s čistým svědomím nazývat [Select_CString(bp1_yearly_9025_friend.IsFemale,'tuhle ženu svou přítelkyní','tohoto muže svým přítelem')].\n\nJe to naprostá pohroma a stýská se mi po časech, kdy jsem [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] jen tiše sedět v [Select_CString(bp1_yearly_9025_friend.IsFemale,'její uklidňující společnosti','jeho uklidňující společnosti')], [Select_CString(ROOT.Char.IsFemale,'aniž bych tušila','aniž bych tušil')], jaká hniloba se skrývá v srdci [bp1_yearly_9025_friend.GetFirstNameNoTooltip]."
 bp1_yearly.9025.a: "Okamžitě mi zmiz z očí."
 bp1_yearly.9025.b: "Možná se to ještě dá zachránit."
 bp1_yearly.9026.t: "Tvář z dávných časů"
 bp1_yearly.9026.desc.intro: "Uvelebím se v posteli, útulně a pohodlně jako nemluvně mezi matčinými ňadry, ale právě když mi těžká víčka konečně klesnou, abych si [Select_CString(ROOT.Char.IsFemale,'odpočinula','odpočinul')], prudce se posadím. Vedle mě se totiž usadila jakási postava!\n\nK mé hrůze je to [Select_CString(bp1_yearly_9026_dead_friend.IsFemale,'má zesnulá přítelkyně','můj zesnulý přítel')] [bp1_yearly_9026_dead_friend.GetFullName]! [bp1_yearly_9026_dead_friend.GetNameNoTooltip] se mi bezcitně zachechtá, zatímco já hrůzou vykřiknu.\n\n„No tak, [ROOT.Char.GetFirstNameNoTooltip], takhle snad vítáš [Select_CString(bp1_yearly_9026_dead_friend.IsFemale,'starou přítelkyni','starého přítele')]? Přicházím s varováním,"
 bp1_yearly.9026.desc.secret_murderer: "víme, co jsi [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')]. [bp1_yearly_9026_murder_victim.GetName] [Select_CString(bp1_yearly_9026_murder_victim.IsFemale,'se stala tvou obětí','se stal tvou obětí')], [Select_CString(ROOT.Char.IsFemale,'přítelkyně','příteli')]."
 bp1_yearly.9026.desc.murderer: "[bp1_yearly_9026_murder_victim.GetName] [Select_CString(bp1_yearly_9026_murder_victim.IsFemale,'byla zavražděna','byl zavražděn')] a tobě za to možná nikdy nebude odpuštěno."
 bp1_yearly.9026.desc.killer: "[bp1_yearly_9026_murder_victim.GetFullName] je teď v [ROOT.Char.GetFaith.PositiveAfterLife|U] kvůli tobě."
 bp1_yearly.9026.desc.greedy: "ti, kteří jsou na tobě závislí, se hroutí pod tíhou tvé bezuzdné lakoty a chamtivosti."
 bp1_yearly.9026.desc.wrathful: "není snad jediné duše, která by se nebála tvého strašlivého hněvu."
 bp1_yearly.9026.desc.torturer: "[Select_CString(ROOT.Char.IsFemale,'každá','každý')] [ROOT.Char.GetWomanMan] si zaslouží základní lidskou důstojnost, ale ty druhým s radostí působíš bolest. Každá rána, kterou vyvrtáš do kůže nějakého nešťastníka, vrtá ještě hlubší díru do tvého vlastního srdce."
 bp1_yearly.9026.desc.arbitrary: "tvá neschopnost pochopit samotný smysl spravedlnosti a morálky nutí všechny třást se strachy před tvými pochybnými rozsudky."
 bp1_yearly.9026.desc.callous: "tvůj naprostý nedostatek zájmu a soucitu s utrpením ostatních zbavuje tvé soudy veškeré váhy, zatímco každý odporný čin zatěžuje tvé srdce jako další kámen."
 bp1_yearly.9026.desc.sadistic: "pokaždé, když s potěšením způsobíš někomu bolest, utahuješ smyčku kolem krku vlastní duše."
 bp1_yearly.9026.desc.vengeful: "[ROOT.Char.GetFaith.HighGodName|U] od tebe očekává něco jiného, ale každou pomstou se od toho vzdaluješ o další krok. Stojí ti ti lidé opravdu za to?"
 bp1_yearly.9026.desc.deceitful: "nekonečné intriky a lži, kterými si razíš cestu, tě nakonec zahubí. Kdy ti bude pravda stačit? Víš ještě vůbec, co je skutečné?"
 bp1_yearly.9026.desc.impatient: "tvá netrpělivost z tebe dělá zrůdu. Neustále se ženeš k další věci a nemáš slitování s nikým, kdo by snad mohl „mrhat tvým časem“."
 bp1_yearly.9026.desc.arrogant: "láska k sobě samému tě činí necitlivým k lásce ostatních. K čemu je láska, která zůstává uzavřená jen uvnitř?"
 bp1_yearly.9026.desc.craven: "tvá zbabělost zanechává na tvém svědomí větší skvrnu než krev kterékoli bitvy. Kolik statečných válečníků už zemřelo místo tebe?"
 bp1_yearly.9026.desc.ambitious: "tvá nekonečná ctižádost tě činí lhostejným k utrpení všech, kdo stojí v cestě tomu, po čem toužíš. Kolik titulů ještě musíš držet? Kolik bitev musíš vyhrát, než budeš [Select_CString(ROOT.Char.IsFemale,'spokojená','spokojený')]?"
 bp1_yearly.9026.desc.lazy: "[ROOT.Char.GetFaith.DevilName|U] může kvůli tvé nečinnosti nerušeně prosazovat svou vůli. Myslíš si snad, že stojíš nad povinnostmi, které má [ROOT.Char.GetTitleAsNameNoTooltip]? A co povinnosti vůči ostatním, které má [Select_CString(ROOT.Char.IsFemale,'každá','každý')] [ROOT.Char.GetWomanMan]?"
 bp1_yearly.9026.desc.cynical: "[ROOT.Char.GetFaith.HighGodName|U] dává najevo svou vůli, ale ty o ní pochybuješ! [ROOT.Char.GetFaith.DevilName|U] si z tebe tím dělá [Select_CString(ROOT.Char.IsFemale,'svou služebnici','svého služebníka')]!"
 bp1_yearly.9026.desc.shy: "odmítáš se stýkat s ostatními poutníky tímto životem a každým dnem se tak vzdaluješ vlastní lidskosti. Myslíš si snad, že jsi něco víc než oni?"
 bp1_yearly.9026.desc.gluttonous: "přejídat se, zatímco jiní nemají co jíst, je obscénní. Proč si přidávat, když někteří nedostanou ani první porci?"
 bp1_yearly.9026.desc.lustful: "tvé tělesné touhy tě odvádějí od pravé cesty k [ROOT.Char.GetFaith.PositiveAfterLife|U]. Žádné množství souložení se nikdy nevyrovná božské lásce!"
 bp1_yearly.9026.desc.temperate: "za vznikem tohoto světa i všeho jídla v něm stojí [ROOT.Char.GetFaith.CreatorName|U], abys sis těchto darů [Select_CString(ROOT.Char.IsFemale,'mohla užívat','mohl užívat')], a ty je přesto odmítáš."
 bp1_yearly.9026.desc.chaste: "za zrodem lidstva stojí [ROOT.Char.GetFaith.CreatorName|U], a ty přesto [Select_CString(ROOT.Char.IsFemale,'zůstáváš pannou a odpíráš si tolik rozkoší a tužeb','zůstáváš panicem a odpíráš si tolik rozkoší a tužeb')]."
 bp1_yearly.9026.desc.honest: "myslíš si, že tě pravda osvobodí, ale často jsou právě lži jediným způsobem, jak ochránit ty, které milujeme."
 bp1_yearly.9026.desc.fallback: "žádný hřích, kterého ses za života [Select_CString(ROOT.Char.IsFemale,'dopustila','dopustil')], nezůstal bez svědka. O všech svědčí [ROOT.Char.GetFaith.PantheonTerm] a na žádný se nezapomíná."
 bp1_yearly.9026.desc.outro: "Musíš činit pokání za to, co jsi [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')]. [Select_CString(bp1_yearly_9026_dead_friend.IsFemale,'Sama jsem na vlastní kůži poznala','Sám jsem na vlastní kůži poznal')], že [ROOT.Char.GetFaith.HighGodName|U] považuje každý náš hřích za dluh, [Select_CString(ROOT.Char.IsFemale,'přítelkyně','příteli')]. A pokud jde o [ROOT.Char.GetFaith.HighGodHerHis|U] dlužníky, [ROOT.Char.GetFaith.HighGodNameSheHe|U] odpuštěním neplýtvá.“"
 bp1_yearly.9026.a: "Činím pokání! Udělám cokoli, jen ať je mi odpuštěno!"
 bp1_yearly.9026.b: "Zjevně halucinuji! Zmiz, duchu!"
 bp1_yearly.9027.t: "Ubozí nešťastní nevolníci"
 bp1_yearly.9027.desc.intro: "Od návštěvy ducha mého starého přítele [bp1_yearly_9027_dead_friend.GetName] už uplynula nějaká doba a nyní začíná má cesta k vykoupení. Jako [ROOT.Char.GetTitleAsNameNoTooltip] si konečně uvědomuji, že mou povinností je starat se o svůj lid. Vydávám se tedy mezi poddané a ptám se, co ode mě potřebují.\n\nPřistoupí ke mně [Select_CString(bp1_yearly_9027_peasant_begger.IsFemale,'chudá žena v cárech','chudý muž v cárech')] a prosí mě, abych pomohl chudým a nemocným v [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], kteří nemají prostředky postarat se sami o sebe."
 bp1_yearly.9027.desc.greedy: "Požadovaná částka je naprosto nehorázná,"
 bp1_yearly.9027.desc.fallback: "Žádá jen tolik, aby tamní chudí dokázali přežít,"
 bp1_yearly.9027.desc.outro: "ale dá se vůbec vyčíslit cena za vstup do [ROOT.Char.GetFaith.PositiveAfterLife|U]?"
 bp1_yearly.9027.a: "Dostanete všechno, co potřebujete."
 bp1_yearly.9027.b: "Jsou tak chudí, že přijmou jakoukoli nabídku!"
 bp1_yearly.9027.c: "Kolik že to chceš?"
 bp1_yearly.9028.t: "Duch minulých svárů"
 bp1_yearly.9028.desc.intro: "Trhnu sebou ze spánku a tělem mi projede ten známý chlad. Rozhlédnu se stejně jako minule a tentokrát přede mnou stojí můj dávno zesnulý protivník [bp1_yearly_9028_dead_rival.GetFullName]!\n\n"
 bp1_yearly.9028.desc.murderer: "„Vrahu!“"
 bp1_yearly.9028.desc.murderer.fallback: "„[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9028_dead_rival'))]!“"
 bp1_yearly.9028.desc.bridge: "[bp1_yearly_9028_dead_rival.GetNameNoTooltip] běduje. „[Select_CString(bp1_yearly_9028_dead_rival.IsFemale,'Byla jsem','Byl jsem')] [bp1_yearly_9028_dead_rival.GetDeathReason] a teď má duše bloudí po tomto světě a hledá tě! To, co jsi mi [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')], poskvrnilo tvou duši. Musíš prosit mou pozůstalou rodinu o odpuštění!“\n\n"
 bp1_yearly.9028.desc.callous: "Popravdě nemám pocit, že bych měl za co činit pokání. Ten [bp1_yearly_9028_dead_rival.Custom2('InsultNoun', ROOT.Char)] si to zasloužil."
 bp1_yearly.9028.desc.fallback: "Cítím, jak mi ta skvrna proniká hluboko do duše. Může vůbec nějaké pokání stačit?"
 bp1_yearly.9028.desc.outro: "Obdržel jsem pokyny ze záhrobí. Jak mám postupovat?"
 bp1_yearly.9028.a: "Pro vykoupení udělám cokoli!"
 bp1_yearly.9028.b: "Nikdy se nebudu plazit po kolenou."
 bp1_yearly.9029.t: "[bp1_yearly_9029_dead_parent.Custom2('RelationToMe', ROOT.Char)|U]!"
 bp1_yearly.9029.desc.intro: "Od první návštěvy ducha už nějaký čas uplynul a na další jsem [Select_CString(ROOT.Char.IsFemale,'dokonale připravená','dokonale připravený')]. Na co jsem se však připravit nedokázal, je pohrdavá tvář [bp1_yearly_9029_dead_parent.Custom2('RelationToMe', ROOT.Char)] jen několik palců od té mé!\n\n„Ničemné dítě!"
 bp1_yearly.9029.desc.rival_sibling: "Copak nevidíš, že tenhle svár mezi mou vlastní krví žene celou naši rodinu stále blíž k [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife]?"
 bp1_yearly.9029.desc.rival_sibling_unrelated: "[bp1_yearly_9029_rival.GetName] sice není [Select_CString(bp1_yearly_9029_rival.IsFemale,'mojí dcerou','mým synem')], ale pořád je [Select_CString(bp1_yearly_9029_rival.IsFemale,'tvou sestrou','tvým bratrem')] a vaše nevraživost žene celou rodinu stále blíž k [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife]!"
 bp1_yearly.9029.desc.rival: "Nenávist je jistá cesta k [bp1_yearly_9029_dead_parent.GetFaith.NegativeAfterLife], [Select_CString(ROOT.Char.IsFemale,'má dcero','můj synu')]. Chceš-li změnit svůj osud, musíš tento svár ukončit."
 bp1_yearly.9029.desc.outro: "Musíš se pokusit ukončit své nepřátelství s [bp1_yearly_9029_rival.GetName]. Jestli bude třeba, poniž se před [bp1_yearly_9029_rival.GetFirstNameNoTooltip] a služ [Select_CString(bp1_yearly_9029_rival.IsFemale,'jí','mu')]!“"
 bp1_yearly.9029.a: "Tak se tedy ponížím a budu sloužit."
 bp1_yearly.9029.b: "K [ROOT.Char.GetFaith.NegativeAfterLife] s [bp1_yearly_9029_rival.GetFirstNameNoTooltip]!"
 bp1_yearly.9030.t: "Druhá návštěva [bp1_yearly_9026_dead_friend.GetNamePossessive]"
 bp1_yearly.9030.desc.intro: "Když se mi znovu zjeví [bp1_yearly_9026_dead_friend.GetFullName], mé tělo náhle zcela znehybní.\n\n„Řekni mi, duchu, co ještě musím udělat, abych si [Select_CString(ROOT.Char.IsFemale,'zajistila','zajistil')] místo v [ROOT.Char.GetFaith.PositiveAfterLife]?“\n\n„Dobře, že se ptáš, [Select_CString(ROOT.Char.IsFemale,'stará přítelkyně','starý příteli')]."
 bp1_yearly.9030.desc.pilgrimage: "Vydej se do svatých zemí. Tam nalezneš vykoupení, které hledáš. Neotálej, [ROOT.Char.GetFaith.HighGodName] tam na tebe čeká.“"
 bp1_yearly.9030.desc.fallback: "Dobročinnost! Kolikrát ti to ještě musím opakovat? Jeden dobrý skutek nestačí. Rozdávání svého bohatství si musíš osvojit jako zvyk!“"
 bp1_yearly.9030.a: "Udělám, co musím."
 bp1_yearly.9030.a.tt_pilgrimage: "Tvá příští [Concept('pilgrimage','pouť')|E] bude levnější"
 bp1_yearly.9030.b: "Víc už udělat nemohu."
 bp1_yearly.9031.t: "Odpusť mi"
 bp1_yearly.9031.desc.intro: "Konečně se mi podaří zastihnout [bp1_yearly_9031_rival_family.Custom2('MyCharacterIntroduction', bp1_yearly_9031_rival)] ve volné chvíli. V zoufalé touze po odpuštění padnu na kolena a prosím o rozhřešení za všechno, co jsem [bp1_yearly_9031_rival.GetFirstNameNoTooltip] [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')]."
 bp1_yearly.9031.desc.flagellant: "Na tváři [bp1_yearly_9031_rival_family.GetFirstNameNoTooltip] se objeví odporný úšklebek.\n\n„Oba víme, že hledáš odpuštění od [bp1_yearly_9031_rival_family.GetFaith.HighGodNamePossessive], a jedinou cestou k němu je sebebičování. Udělej to. Pořádně. Pak ti odpustím a raději doufej, že [bp1_yearly_9031_rival_family.GetFaith.HighGodNameSheHe|U] také.“"
 bp1_yearly.9031.desc.debate: "[bp1_yearly_9031_rival_family.GetNameNoTooltip] se na mě pohrdavě podívá svrchu.\n\n„Je dobře, že sis své hříšnosti konečně [Select_CString(ROOT.Char.IsFemale,'všimla','všiml')], ale zločiny proti [bp1_yearly_9031_rival_family.GetFaith.ReligiousText] ti odpustit nemohu. Tedy pokud mě o tom nepřesvědčíš v debatě.“"
 bp1_yearly.9031.desc.cleanup: "V té pomalé, zanedbané hlavě [bp1_yearly_9031_rival_family.GetNamePossessiveNoTooltip] se očividně rodí nápad.\n\n„Od chvíle, kdy nás [bp1_yearly_9031_rival.GetFirstNameNoTooltip] [Select_CString(bp1_yearly_9031_rival.IsFemale,'opustila','opustil')], [Select_CString(bp1_yearly_9031_rival_family.IsFemale,'musela jsem','musel jsem')] propustit část služebnictva, které se staralo o úklid. Kdyby mi někdo pomohl dát sídlo do pořádku, možná by si mé odpuštění zasloužil.“"
 bp1_yearly.9031.desc.unconditional: "[bp1_yearly_9031_rival_family.GetNameNoTooltip] se usměje a skloní se ke mně.\n\n„Vstaň. Stačí mi slyšet, že toho lituješ. Před [bp1_yearly_9031_rival_family.GetFaith.HighGodName] jsme koneckonců všichni jen děti a každý z nás dělá chyby.“"
 bp1_yearly.9031.desc.fallback: "[bp1_yearly_9031_rival_family.GetNameNoTooltip] se na mě podívá očima plnýma slz.\n\n„Odpustit ti? Ne. #EMP Nikdy#! ti neodpustím. Dělá se mi špatně už jen z toho, že vyslovíš jméno [bp1_yearly_9031_rival.GetFirstNameNoTooltip]! Jaké pokání by vůbec mohlo odčinit to, co jsi [Select_CString(ROOT.Char.IsFemale,'provedla','provedl')]?“"
 bp1_yearly.9031.a.forgiven: "[Select_CString(ROOT.Char.IsFemale,'Jsem pokořená.','Jsem pokořený.')]"
 bp1_yearly.9031.a: "Udělám cokoli, co budeš chtít."
 bp1_yearly.9031.b.forgiven: "Beru všechno zpět!"
 bp1_yearly.9031.b: "Takto se ponižovat nenechám."
 bp1_yearly.9032.t: "Náprava křivd"
 bp1_yearly.9032.desc: "Přesně podle pokynů vypátrám [bp1_yearly_9032_rival.GetName] a bez váhání padnu na kolena s prosbou o odpuštění.\n\n„Při [bp1_yearly_9032_rival.GetFaith.PantheonTerm|U], tohle je ještě lepší, než jsem [Select_CString(bp1_yearly_9032_rival.IsFemale,'doufala','doufal')]! Ty u mých nohou, ha! Jak dlouho jsem o tomhle dni [Select_CString(bp1_yearly_9032_rival.IsFemale,'snila','snil')].“\n\nMůj výraz však zůstává nehybný jako kámen a [Select_CString(bp1_yearly_9032_rival.IsFemale,'její','jeho')] tón se začne měnit.\n\n„Ty to myslíš vážně? No dobře. Asi by se našlo pár věcí, kterými by sis mé odpuštění mohl zasloužit...“"
 bp1_yearly.9032.a: "Udělám cokoli."
 bp1_yearly.9032.b: "Využít příležitosti a podrazit [Select_CString(bp1_yearly_9032_rival.IsFemale,'ji','mu')] nohy!"
 bp1_yearly.9033.t: "Poslední noc"
 bp1_yearly.9033.desc.intro: "Konečně se mi [bp1_yearly_9026_dead_friend.GetFullName] znovu zjeví, tentokrát snad už naposledy. Probudím se ze spánku a zeptám se, jak dobře se mi podařilo odvrátit svůj osud.\n\n"
 bp1_yearly.9033.desc.did_well: "„Ach, [Select_CString(ROOT.Char.IsFemale,'přítelkyně','příteli')], [Select_CString(ROOT.Char.IsFemale,'odvedla jsi','odvedl jsi')] neuvěřitelnou práci! Tvá budoucnost je sice stále nejistá, ale vypadá mnohem lépe než při mé první návštěvě! Tíha z tvé duše byla sňata a já se mohu vrátit ke svému věčnému trestu s vědomím, že jsem [Select_CString(bp1_yearly_9026_dead_friend.IsFemale,'udělala','udělal')] všechno, co bylo v mých silách, abych tě stejného osudu [Select_CString(bp1_yearly_9026_dead_friend.IsFemale,'ušetřila','ušetřil')].“"
 bp1_yearly.9033.desc.did_bad: "„Jak dobře? Jak dobře? Jsi [Select_CString(ROOT.Char.IsFemale,'zatracená','zatracený')], [ROOT.Char.GetFirstNameNoTooltip]! Na věčnost tě čeká [ROOT.Char.GetFaith.NegativeAfterLife]! Tvá budoucnost je tapisérie hrůzy a tragédie, kterou sis [Select_CString(ROOT.Char.IsFemale,'ušila vlastníma zakrvácenýma rukama','ušil vlastníma zakrvácenýma rukama')]! Vracím se k odpočinku. [Select_CString(bp1_yearly_9026_dead_friend.IsFemale,'Udělala jsem','Udělal jsem')] všechno, co bylo v mých silách, abych zachránil tvou duši.“"
 bp1_yearly.9033.desc.did_okay: "„Nu, co na to říct? [Select_CString(ROOT.Char.IsFemale,'Dostala jsi','Dostal jsi')] příležitost k vykoupení a [Select_CString(ROOT.Char.IsFemale,'zahodila jsi ji','zahodil jsi ji')]. Pár kroků vpřed sice přišlo, ale mnohem víc jich vedlo zpátky. Doufám, že se ještě dokážeš změnit, [Select_CString(ROOT.Char.IsFemale,'přítelkyně','příteli')]. Prozatím se musím vrátit ke svému věčnému trestu a jen doufám, že tě tam jednou neuvidím po svém boku.“"
 bp1_yearly.9033.desc.outro: "\n\n[bp1_yearly_9026_dead_friend.GetFirstNameNoTooltip] opět zmizí a tentokrát pochybuji, že se ještě někdy setkáme."
 bp1_yearly.9033.a: "[Select_CString(ROOT.Char.IsFemale,'Jsem zachráněná!','Jsem zachráněný!')]"
 bp1_yearly.9033.b: "Možná [ROOT.Char.GetFaith.NegativeAfterLife] není zase tak špatné."
 bp1_yearly.9033.c: "[Select_CString(ROOT.Char.IsFemale,'Jsem změněná žena.','Jsem změněný muž.')]"
 end_marley_ghost_story_tt: "Duchové tě už nebudou navštěvovat."
 bp1_increase_good_deeds_tt: "#EMP Duchové budou potěšeni#!"
 bp1_decrease_good_deeds_tt: "#EMP Duchové budou velmi rozzlobeni#!"
 bp1_yearly.9034.t: "[Select_CString(bp1_yearly_9034_witch.IsFemale,'Čarodějnice z bažin','Čaroděj z bažin')]"
 bp1_yearly.9034.desc.intro: "S [bp1_yearly_9034_friend.GetName] si vesele hrajeme v bažinách [bp1_yearly_9034_swampy_location.GetNameNoTooltip]. Jsme do hry tak [Select_CString(ROOT.Char.IsFemale,'zabraná','zabraný')], že si ani nevšimneme, že jsme se vzdálili od [bp1_yearly_9034_guardian.GetName]!\n\nNajednou se z bahna a kalu vynoří podivná postava celá obalená blátem. [Select_CString(bp1_yearly_9034_witch.IsFemale,'Čarodějnice','Čaroděj')] se na nás zamračí a než se naděju, [bp1_yearly_9034_friend.GetName] už [Select_CString(bp1_yearly_9034_friend.IsFemale,'utekla','utekl')]!"
 bp1_yearly.9034.desc.giant: "[bp1_yearly_9034_witch.GetNameNoTooltip] se ke mně těžkopádně blíží, ale [Select_CString(bp1_yearly_9034_witch.IsFemale,'její obrovitá postava ji přemůže a pod vlastní vahou klopýtne a upadne','jeho obrovitá postava ho přemůže a pod vlastní vahou klopýtne a upadne')]!"
 bp1_yearly.9034.desc.hunchbacked: "[bp1_yearly_9034_witch.GetNameNoTooltip] se ke mně těžkopádně blíží, celé tělo [Select_CString(bp1_yearly_9034_witch.IsFemale,'má nepřirozeně shrbené, jako by se sama svázala do uzlu','má nepřirozeně shrbené, jako by se sám svázal do uzlu')]."
 bp1_yearly.9034.desc.beauty_bad: "Tak odpudivou bytost jsem ještě nikdy [Select_CString(ROOT.Char.IsFemale,'neviděla','neviděl')], a to ani z takové dálky. Než si ji stačím pořádně prohlédnout, [bp1_yearly_9034_witch.GetNameNoTooltip] se proti mně rozběhne!"
 bp1_yearly.9034.desc.albino: "Pod nánosy bahna zahlédnu mléčně bílou kůži a vlasy [bp1_yearly_9034_witch.GetFirstNameNoTooltip] a rudé oči planoucí vztekem. Než si ten výjev stačím pořádně prohlédnout, [bp1_yearly_9034_witch.GetNameNoTooltip] se proti mně rozběhne!"
 bp1_yearly.9034.desc.scaly: "Kůže [bp1_yearly_9034_witch.GetFirstNameNoTooltip] připomíná ještěrku, samý hrbol a záhyb. Než si ji stačím pořádně prohlédnout, [bp1_yearly_9034_witch.GetNameNoTooltip] se proti mně rozběhne!"
 bp1_yearly.9034.desc.outro: "\n\nMůj přítel i opatrovník jsou daleko a zůstávám tu jen já a [Select_CString(bp1_yearly_9034_witch.IsFemale,'čarodějnice','čaroděj')]. Co mám dělat?"
 bp1_yearly.9034.a: "Utéct!"
 bp1_yearly.9034.b: "Zjistím, co [bp1_yearly_9034_witch.GetNameNoTooltip] chce."
 9034_escaped_witch: "[Select_CString(ROOT.Char.IsFemale,'Unikla jsi čarodějnici!','Unikl jsi čaroději!')]"
 9034_failed_to_escape: "Při útěku ses [Select_CString(ROOT.Char.IsFemale,'zranila','zranil')]."
 bp1_yearly.9035.t: "[Select_CString(bp1_yearly_9034_witch.IsFemale,'Dobrá čarodějnice z bažin','Dobrý čaroděj z bažin')]"
 bp1_yearly.9035.desc: "Když ke mně [bp1_yearly_9034_witch.GetNameNoTooltip] konečně dorazí, plácne mě po tváři, zabije brouka a otře si ho o tuniku.\n\n„Dávej si tady pozor, drobku. I ta nejmenší havěť tě dostane, když nebudeš [Select_CString(ROOT.Char.IsFemale,'opatrná','opatrný')]. Něco o tom vím, už jsem [Select_CString(bp1_yearly_9034_witch.IsFemale,'ošetřila','ošetřil')] dost oteklých tváří zbloudilých pocestných.“\n\nŽádná nestvůra, jak jsem si původně [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]. [bp1_yearly_9034_witch.GetNameNoTooltip] se představí jako místní [Select_CString(bp1_yearly_9034_witch.IsFemale,'léčitelka a čarodějka, zběhlá','léčitel a čaroděj, zběhlý')] v bylinném léčitelství i rituálech určených k vyhánění duchů z lidí a předmětů. Možná by [Select_CString(bp1_yearly_9034_witch.IsFemale,'tahle žena mohla','tenhle muž mohl')] posloužit nějakému vznešenějšímu účelu."
 bp1_yearly.9035.a: "[Select_CString(bp1_yearly_9034_witch.IsFemale,'Léčitelka? Nová lékařka by se mi hodila...','Léčitel? Nový lékař by se mi hodil...')]"
 bp1_yearly.9035.b: "Nauč mě svému umění, [Select_CString(bp1_yearly_9034_witch.IsFemale,'moudrá ženo','moudrý muži')]."
 bp1_yearly.9035.c: "Ptal se tě snad někdo?"
 bp1_yearly.9036.t: "[Select_CString(bp1_yearly_9034_witch.IsFemale,'Zlá čarodějnice z bažin','Zlý čaroděj z bažin')]"
 bp1_yearly.9036.desc: "[bp1_yearly_9034_witch.Custom2('InsultAdjective', ROOT.Char)] [Select_CString(bp1_yearly_9034_witch.IsFemale,'čarodějnice','čaroděj')] mě popadne dlouhými seschlými prsty a sevře tak pevně, až cítím, jak mi v pažích ustává krev.\n\n„Ve jménu [bp1_yearly_9034_witch.GetFaith.WitchGodName], co děláš v mé bažině, ty [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9034_witch'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9034_witch'))]? Máš vůbec tušení, kolik zlých duchů se tu potuluje? Ničemné dítě!“\n\nSnažím se vysvětlit, že jsem [ROOT.Char.GetTitleAsNameNoTooltip|U], ale [bp1_yearly_9034_witch.GetNameNoTooltip] už vůbec neposlouchá rozum. Cítím, jak mi tělo ochabuje a kůže začíná praskat, když se náhle objeví [bp1_yearly_9034_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 bp1_yearly.9036.a: "[bp1_yearly_9034_guardian.GetNameNoTooltip], pomoz mi!"
 bp1_yearly.9036.guardian_wins: "[bp1_yearly_9034_guardian.GetNameNoTooltip] [Select_CString(bp1_yearly_9034_guardian.IsFemale,'vítězí','vítězí')]"
 bp1_yearly.9036.guardian_loses: "[bp1_yearly_9034_guardian.GetNameNoTooltip] mě nedokáže ochránit před zraněním"
 bp1_yearly_9034_witchy_goodbad_tt: "#EMP [Select_CString(bp1_yearly_9034_witch.IsFemale,'Čarodějnice se může ukázat jiná, než čekáš...','Čaroděj se může ukázat jiný, než čekáš...')]#!"
 bp1_yearly.9037.t: "Tělo v bažině"
 bp1_yearly.9037.desc: "[bp1_yearly_9037_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] mě [Select_CString(bp1_yearly_9037_guardian.IsFemale,'přivedla','přivedl')] do bažin [bp1_yearly_9037_swampy_location.GetNameNoTierNoTooltip] a je to tu opravdu nádherné!\n\nBěhám a hraju si, kopu do páchnoucí vody a házím kameny do bahna. Prostě si užívám nejlepší život, jaký může [ROOT.Char.GetTitleAsNameNoTooltip] mít, když si všimnu něčeho, co se ke mně pomalu plíží.\n\nRákosím se prodere tvář podivné mrtvoly. Minerály v bažinaté vodě dokonale zachovaly výraz čiré hrůzy na tváři [bp1_yearly_9037_corpse.GetFirstNameNoTooltip]."
 bp1_yearly.9037.a: "[bp1_yearly_9037_guardian.GetNameNoTooltip], podívej, co jsem [Select_CString(ROOT.Char.IsFemale,'našla','našel')]!"
 bp1_yearly.9037.custom: "[Select_CString(bp1_yearly_9037_guardian.IsFemale,'Má opatrovnice','Můj opatrovník')] [bp1_yearly_9037_guardian.GetName] bude vědět, co dělat..."
 bp1_yearly.9037.b: "Utéct s křikem!"
 bp1_yearly.9038.t: "Odhalené tajemství"
 bp1_yearly.9038.desc.intro: "Když se přiblíží [bp1_yearly_9037_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)], při pohledu na tvář těla v bažině se [Select_CString(bp1_yearly_9037_guardian.IsFemale,'její výraz zkřiví zděšením a hlubokým neklidem','jeho výraz zkřiví zděšením a hlubokým neklidem')].\n\n„To je [bp1_yearly_9037_corpse.GetNameNoTooltip]... Za tu smrt můžu já."
 bp1_yearly.9038.desc.killer: "Jistě chápeš, [Select_CString(ROOT.Char.IsFemale,'má mladá','můj mladý')] [ROOT.Char.GetTitleAsNameNoTooltip], že tě nemohu nechat pobíhat po okolí a vykládat všem, co jsi tady [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')]. Na místech, jako je tohle, je úžasné, jak jsou odlehlá a nebezpečná. Nikoho by ani nenapadlo tě tu hledat. [Select_CString(ROOT.Char.IsFemale,'Jsi dobrá plavkyně','Jsi dobrý plavec')], [Select_CString(ROOT.Char.IsFemale,'má','můj')] [ROOT.Char.GetTitleAsNameNoTooltip]?“"
 bp1_yearly.9038.desc.not_killer: "[Select_CString(bp1_yearly_9037_guardian.IsFemale,'Nikdy jsem neměla v úmyslu to někomu říct','Nikdy jsem neměl v úmyslu to někomu říct')], ale teď už nemá smysl cokoli skrývat. Na to, co jsem [Select_CString(bp1_yearly_9037_guardian.IsFemale,'udělala','udělal')], nejsem [Select_CString(bp1_yearly_9037_guardian.IsFemale,'hrdá','hrdý')], [ROOT.Char.GetFirstNameNoTooltip]. Jen doufám, že mi jako [Select_CString(bp1_yearly_9037_guardian.IsFemale,'své milující mentorce','svému milujícímu mentorovi')] odpustíš.“"
 bp1_yearly.9038.a: "Nevím, co na to říct."
 bp1_yearly.9038.b: "Utéct a všechno všem povědět!"
 bp1_yearly.9038.c: "Pořádně strčit [bp1_yearly_9037_guardian.GetFirstNameNoTooltip] do bažiny."
 9038_killed_guardian: "Podařilo se ti shodit [bp1_yearly_9037_guardian.GetName] do bažiny."
 9038_guardian_kills_you: "[bp1_yearly_9037_guardian.GetName] tě [Select_CString(bp1_yearly_9037_guardian.IsFemale,'přemohla','přemohl')]."
 bp1_yearly.9039.t: "Dokonale zachovalá mrtvola"
 bp1_yearly.9039.desc: "Stejně jako já je i [bp1_yearly_9037_guardian.GetName] při pohledu na tělo v bažině [Select_CString(bp1_yearly_9037_guardian.IsFemale,'šokovaná a zděšená','šokovaný a zděšený')], ale výraz hrůzy se brzy promění ve fascinaci.\n\n„[ROOT.Char.GetFirstNameNoTooltip], poznáváš tyhle šaty? Tohle je bezpochyby oděv rolníků z doby před třemi sty lety! O tom není pochyb, tohle tělo je zachované jako žádné, které jsem kdy [Select_CString(bp1_yearly_9037_guardian.IsFemale,'viděla','viděl')]! Vždyť je to zázrak! [bp1_yearly_9037_guardian.GetFaith.HighGodName|U] za tím bezpochyby stojí! Dovol mi ty kosti posbírat a připravit ti z nich nádherný dar.“\n\n[bp1_yearly_9037_guardian.GetFaith.HighGodName|U] zřejmě projevuje své „zázraky“ dost podivným způsobem, ale když to [bp1_yearly_9037_guardian.GetNameNoTooltip] říká, nejspíš to tak bude."
 bp1_yearly.9039.a: "To je ale... podivný dar."
 bp1_yearly.9039.b: "Ne, tohle je podle mě zlý duch."
 ghost_stories_modifier: "Příběhy o duchách"
 ghost_stories_modifier_desc: "V tomto hrabství údajně přebývá zlomyslný duch."
 box_of_boggy_bones: "Krabice kostí z bažiny"
 box_of_boggy_bones_desc: "Kosti několik set let staré mrtvoly, dokonale zachované v bažinné vodě a nyní uložené v praktické krabici."
 bp1_withholding_ghost_sex: "Odolávání smyslným snům"
 bp1_withholding_ghost_sex_desc: "Této postavě se zdá o dávno zesnulých milencích, ale odmítá jejich milostné návrhy."
 bp1_indulging_ghost_sex: "Smyslné sny"
 bp1_indulging_ghost_sex_desc: "Této postavě se zdá o dávno zesnulých milencích a naplno se oddává těmto nadpozemským milostným zážitkům."
 bp1_yearly.9040.t: "[Select_CString(bp1_yearly_9040_dead_lover.IsFemale,'Návštěva milenky','Návštěva milence')]"
 bp1_yearly.9040.desc: "Pohodlně ležím v posteli, když ucítím známý dotek přejíždějící po mé nahé hrudi. Zpočátku tomu nevěnuji pozornost, ale když konečně otevřu ospalé oči, spatřím vedle sebe svou drahou zesnulou lásku [bp1_yearly_9040_dead_lover.GetName]!\n\n„Ach, [ROOT.Char.Custom('LoverPetName')], už je to tak dávno, viď? Ale když tě objímám a líbám, nevrací se ti snad láska do srdce, jako by to všechno bylo teprve včera? Obejmi mě, [ROOT.Char.Custom('LoverPetName')], miluj mě znovu jako kdysi!“\n\nNemohu tomu uvěřit, a přesto [bp1_yearly_9040_dead_lover.GetNameNoTooltip] skutečně vidím a cítím! Vím, že je to jen sen, ale je tak skutečný, že mu jednoduše nedokážu odolat."
 bp1_yearly.9040.a: "Ach, obejmi mě jako za starých časů!"
 bp1_yearly.9040.b: "Zmiz, duchu."
 bp1_yearly.9041.t: "[Select_CString(bp1_yearly_9041_parent.IsFemale,'Vzpomínky na matku','Vzpomínky na otce')]"
 bp1_yearly.9041.desc: "[bp1_yearly_9041_sibling.Custom2('MyCharacterIntroduction', ROOT.Char)] sedí schouleně v odlehlém koutě [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a tiše pláče. Jakmile si všimne, že přicházím, vstane a marně se snaží osušit si oči.\n\n„Ach, [Select_CString(ROOT.Char.IsFemale,'sestro','bratře')], promiň. [Select_CString(bp1_yearly_9041_sibling.IsFemale,'Neměla bych plakat','Neměl bych plakat')]. Koneckonců máš mnohem větší důvod postrádat [Select_CString(bp1_yearly_9041_parent.IsFemale,'naši matku','našeho otce')] než já. Raději ti nebudu překážet.“\n\nPopravdě jsem od chvíle, kdy jsem [Select_CString(ROOT.Char.IsFemale,'usedla','usedl')] na trůn, neměl čas na [Select_CString(bp1_yearly_9041_parent.IsFemale,'matku','otce')] ani pomyslet, ale [bp1_yearly_9041_sibling.GetNameNoTooltip] je očividně [Select_CString(bp1_yearly_9041_sibling.IsFemale,'hluboce rozrušená','hluboce rozrušený')]."
 bp1_yearly.9041.a: "Klidně se vyplač, jsem tu pro tebe."
 bp1_yearly.9041.b: "[Select_CString(bp1_yearly_9041_sibling.IsFemale,'Haha! Ty jsi ale ufňukaná!','Haha! Ty jsi ale ufňukaný!')]"
 bp1_yearly.9042.t: "Tvář božstva [ROOT.Char.GetFaith.HealthGodName]"
 bp1_yearly.9042.desc: "Další den vlády nad [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|L] probíhá bez větších překvapení, dokud do mého trůnního sálu nevtrhne [bp1_yearly_9042_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] a nadšeně mi před obličejem nemává pytlíkem sladkostí.\n\n„Můj [ROOT.Char.GetTitleAsNameNoTooltip]! Můj [ROOT.Char.GetTitleAsNameNoTooltip]! To je zázrak! [Select_CString(bp1_yearly_9042_chaplain.IsFemale,'Kontrolovala jsem','Kontroloval jsem')] jídlo, které ti kuchař chystá na dnešní večer, když mě napadlo, jak nápadně tyhle kousky připomínají tvář samotného božstva [ROOT.Char.GetFaith.HealthGodName]!“\n\nKdyž si je prohlédnu zblízka, musím uznat, že podobnost je až zarážející. Tohle ale přece musí být kacířství."
 bp1_yearly.9042.a: "Máš naprostou pravdu!"
 bp1_yearly.9042.b: "Tohle je bezpochyby svatokrádež."
 bp1_yearly.9042.c: "Jaký zázrak! Musím ho sníst!"
 9042_you_win: "[Select_CString(ROOT.Char.IsFemale,'V debatě jsi zvítězila','V debatě jsi zvítězil')]"
 9042_you_lose: "[Select_CString(ROOT.Char.IsFemale,'V debatě jsi prohrála','V debatě jsi prohrál')]"
 dessert_looks_like_god: "Lahodná tvář božstva [ROOT.Char.GetFaith.HealthGodName]"
 dessert_looks_like_god_desc: "Sbírka dezertů typu [ROOT.Char.Custom('GetExpensiveDessert')], které svým vzhledem připomínají božstvo [ROOT.Char.GetFaith.HealthGodName]"
 full_of_jesus_modifier: "Duchovní naplnění"
 full_of_jesus_modifier_desc: "Tato postava snědla dezert, který se nápadně podobá božstvu [ROOT.Char.GetFaith.HealthGodName]"
 bp1_yearly.9043.t: "[ROOT.Char.GetFaith.BishopNeuter|U] a děti k večeři"
 bp1_yearly.9043.desc: "Další příjemný den modliteb a služby s mým skvělým [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] se chýlí ke konci, ale když se chystám odejít, [bp1_yearly_9043_chaplain.GetName] mi zastoupí cestu. Počká, až všichni ostatní odejdou, a pak se nakloní těsně k mému uchu.\n\n„Můj [ROOT.Char.GetTitleAsNameNoTooltip], musím se přiznat, že rozkoše života mi rozhodně nejsou cizí. Žádná zvrácenost pro mě není příliš zvrácená, ať už jde o zvíře, rostlinu, nebo nerost. Upřímně, udělám cokoli s čímkoli a nic na tomto světě se nevyrovná požírání masa těch nejmladších. Dokud jsi neochutnal lidské maso, ještě jsi pořádně [Select_CString(ROOT.Char.IsFemale,'nežila','nežil')], můj [ROOT.Char.GetTitleAsNameNoTooltip]. A ze všeho nejraději bych si tě dnes [Select_CString(bp1_yearly_9043_chaplain.IsFemale,'dala','dal')] k večeři!“\n\nTohle mě naprosto vyvede z míry. Co se na něco takového vůbec dá říct?"
 bp1_yearly.9043.a: "[Select_CString(bp1_yearly_9043_chaplain.IsFemale,'Snědla jsi dítě?','Snědl jsi dítě?')] To zní zábavně!"
 bp1_yearly.9043.b: "#EMP Stráže!#!"
 bp1_yearly.9043.c: "Jen se usmát a jít dál."
 bp1_yearly.9044.t: "Poprava"
 bp1_yearly.9044.desc: "[Select_CString(ROOT.Char.IsFemale,'Doufala jsem','Doufal jsem')], že v sobě najdu sílu držet se od popravy [recipient.GetNamePossessive] dál, ale očividně nedokážu odolat poslednímu rozloučení.\n\nNa [recipient.GetFirstNameNoTooltip] mi skutečně záleželo způsobem, který by nikdo jiný nikdy nepochopil. Za události, které vedly k uvěznění, si však [recipient.GetFirstNameNoTooltip] [Select_CString(recipient.IsFemale,'mohla sama','mohl sám')], a před spravedlností nemohu dělat výjimky.\n\nPoslední chvíle tráví [recipient.GetFirstNameNoTooltip] pohledem upřeným na mě, v uslzených očích výraz zrady. Pak se ozve poslední #EMP křupnutí#! a je po všem. Ještě chvíli zůstávám u bezvládného těla a vzpomínám na všechny krásné chvíle, které jsme spolu zažili."
 bp1_yearly.9044.desc.outro.memory: "Obzvlášť [Select_CString(ROOT.Char.IsFemale,'ráda vzpomínám','rád vzpomínám')] na chvíli, kdy [bp1_yearly_9044_memory_scope.GetDescription]. Mrzí mě, že už spolu nic podobného nezažijeme."
 bp1_yearly.9044.desc.outro.no_memory: "Mohu jen doufat, že se znovu setkáme v [ROOT.Char.GetFaith.PositiveAfterLife], pokud mi [recipient.GetFirstNameNoTooltip] odpustí."
 bp1_yearly.9044.a.indifferent: "Nebylo v tom nic osobního."
 bp1_yearly.9044.a.guilty: "Mrzí mě, že to muselo skončit takhle."
 bp1_yearly.9045.t: "Poprava"
 bp1_yearly.9045.desc.intro: "Nějakou dobu poté, co jsem [Select_CString(ROOT.Char.IsFemale,'nařídila','nařídil')] popravu [recipient.GetName], mě [bp1_yearly_9045_guardian.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(bp1_yearly_9045_guardian.IsFemale,'odvedla','odvedl')] k šibenici s tím, že to, co uvidím, pro mě bude cenným ponaučením.\n\n"
 bp1_yearly.9045.desc.zealous: "[recipient.GetName] kráčí k popravčímu s pevně zavřenýma očima. V tichu nádvoří slyším, jak si do sepjatých rukou mumlá nesrozumitelné modlitby a zaříkávání, jako by stále existovala naděje, že [recipient.GetFaith.HighGodName|U] přijde a zabrání předčasné smrti."
 bp1_yearly.9045.desc.brave: "[recipient.GetFirstNameNoTooltip] hledí popravčímu přímo do tváře a vypadá, že mu každou chvíli plivne do očí. Pak si konečně všimne mě. Ani na okamžik ze mě nespustí oči a pohledem plným čiré nenávisti a pohrdání jako by mi pronikal až do duše."
 bp1_yearly.9045.desc.fallback: "Oči [recipient.GetFirstNameNoTooltip] jsou od pláče celé rudé. Když vykročí k popravčímu, snaží se mlčet, ale při pomyšlení na blížící se smrt nedokáže potlačit tiché kňourání a vzlyky."
 bp1_yearly.9045.desc.outro: "\n\nAť už ve mně tahle podívaná vyvolává cokoli, všechno skončí příliš rychle na to, abych vůbec [Select_CString(ROOT.Char.IsFemale,'stihla','stihl')] popravu odvolat. Když je po všem a srdce [recipient.GetFirstNameNoTooltip] už nebije, [bp1_yearly_9045_guardian.GetNameNoTooltip] odejde a nechá mě o samotě s tělem přemýšlet nad tím, co jsem [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')]."
 bp1_yearly.9045.a.indifferent: "Můžu už jít domů?"
 bp1_yearly.9045.a.sadistic: "To byla podívaná!"
 bp1_yearly.9045.a.guilty: "Proč jsi mi to [Select_CString(bp1_yearly_9045_guardian.IsFemale,'ukázala','ukázal')]?"
 bp1_yearly.9046.t: "Hnědé pojmenování"
 bp1_yearly.9046.desc.intro: "Konečně nadešel čas, aby mé nejdražší novorozeně [bp1_yearly_9046_poopy_child.GetName] dostalo před zraky [ROOT.Char.GetFaith.HighGodName] své jméno, a všichni významní muži i ženy z [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] se shromáždili, aby byli svědky tohoto posvátného dne. Zatímco [bp1_yearly_9046_chaplain.GetName] vykonává své svaté povinnosti, do nosu mě udeří odporný zápach.\n\n"
 bp1_yearly.9046.desc.christian: "Křtitelnice se teď barví do sytě hněda výkaly mého děťátka. Hlavička už byla ponořena do svěcené vody za Otce a já mohu jen přihlížet, jak ji ponoří ještě dvakrát za Syna a Ducha svatého."
 bp1_yearly.9046.desc.not_christian: "Podle hnědé tekutiny odkapávající mezi rukama [bp1_yearly_9046_chaplain.GetFirstNameNoTooltip] je jasné, že můj drahý [bp1_yearly_9046_poopy_child.GetNameNoTooltip] to před [ROOT.Char.GetFaith.HighGodName] nedokázal udržet."
 bp1_yearly.9046.desc.outro: "Navzdory odpornému zápachu a posměškům shromážděných zachovává [bp1_yearly_9046_chaplain.GetNameNoTooltip] naprostou profesionalitu.\n\nMám pocit, že tato událost bude mé novorozeně pronásledovat po celý život a jméno [bp1_yearly_9046_poopy_child.GetFirstNameNoTooltip] už možná navždy zůstane spojeno s dětskými výkaly."
 bp1_yearly.9046.a.indifferent: "Ha! To byla podívaná!"
 bp1_yearly.9046.a: "No, s tím už nic nenadělám."
 bp1_yearly.9046.b: "O tomhle se nikdo mimo tuto místnost nedozví."
 bp1_yearly.9047.t: "Pramen lásky"
 bp1_yearly.9047.desc: "Se svou [Select_CString(bp1_yearly_9047_lover.IsFemale,'nejdražší milenkou','nejdražším milencem')] [bp1_yearly_9047_lover.GetName] si jako obvykle povídáme v posteli a já si kolem prstů obtáčím pramen krásných vlasů.\n\n„Tak moc miluješ mé vlasy, [ROOT.Char.Custom('LoverPetName')]? Možná bys je měl nosit stále při sobě, když plníš své povinnosti jako [ROOT.Char.GetTitleAsNameNoTooltip]. Pak všichni uvidí, že ty a já jsme jedno.“\n\nNejdřív jsem si [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')], že [bp1_yearly_9047_lover.GetNameNoTooltip] žertuje, ale rychle mi dojde, že mám ten pramen vlasů skutečně nosit jako ozdobu na očích všem!"
 bp1_yearly.9047.a: "Budu ho nosit až do smrti."
 bp1_yearly.9047.b: "Cože? To je nechutné!"
 bp1_yearly.9048.t: "Zápas s démonem"
 bp1_yearly.9048.desc: "[bp1_yearly_9048_nemesis.GetName] nikdy nezapomene ukázat svou odpornou tvář přesně ve chvíli, kdy mi tím může dokonale zkazit den. Tentokrát přichází ke mně na [ROOT.Char.Custom('GetCourt')] s očima planoucíma vztekem a zdá se být obzvlášť plný zloby.\n\n„Ty naprostý [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))]! Ty úplný [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))]! Ty [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('bp1_yearly_9048_nemesis'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_9048_nemesis'))]! Každý tvůj nádech je plýtváním vzduchem a urážkou všeho živého. Už mě nebaví hledět na tak zvrácenou podobu [bp1_yearly_9048_nemesis.GetFaith.CreatorNamePossessive] stvoření a žádám zadostiučinění. Tohle mezi námi končí právě teď! Bojuj se mnou!“\n\nNež stačím zareagovat, [bp1_yearly_9048_nemesis.GetName] už stojí připraveně a čeká na zápas!"
 bp1_yearly.9048.a: "Až skončím, bude na světě o jednoho [bp1_yearly_9048_nemesis.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)] méně!"
 bp1_yearly.9048.b: "Táhni pryč, [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)]."
 9048_you_lose: "V souboji prohráváš"
 bp1_yearly.9049.t: "Po zásluze?"
 bp1_yearly.9049.desc: "[bp1_yearly_9048_nemesis.GetName] mi padne k nohám, [Select_CString(bp1_yearly_9048_nemesis.IsFemale,'zkrvavená a zlámaná','zkrvavený a zlámaný')] po žalostném pokusu mě porazit. Souboj skončil a [Select_CString(ROOT.Char.IsFemale,'jsem jasnou vítězkou','jsem jasným vítězem')], přesto mi v srdci stále plane oheň. Mé pěsti netouží po ničem jiném než zatlouct toho [bp1_yearly_9048_nemesis.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_9048_nemesis.Custom2('InsultNoun', ROOT.Char)] do země, dokud z něj nezůstane jen krvavá skvrna.\n\n[bp1_yearly_9048_nemesis.GetNameNoTooltip] si mdle zvedne ruce před obličej. V očích má strach zvířete jako [ROOT.Char.Custom('GetAnimalType')], které ví, že lov se chýlí ke konci."
 bp1_yearly.9049.a: "Ukousnu si z tebe kus!"
 bp1_yearly.9049.b: "Je po všem."
 bp1_yearly.9049.c: "$bp1_yearly.9049.b$.. pro tebe!"
 bp1_yearly.9050.t: "Válečné historky"
 bp1_yearly.9050.desc: "Jednou z nejoblíbenějších kratochvílí [bp1_yearly_9050_friend.GetNamePossessive] je sedět se mnou za krásné noci u ohně a vyměňovat si válečné historky. Tentokrát vzpomínáme od slunce k měsíci a znovu až do východu slunce!\n\nZačnu vyprávěním o tom, jak [bp1_yearly_9050_my_memory.GetDescription], což [bp1_yearly_9050_friend.GetFirstNameNoTooltip] přiměje sepnout ruce a rozesmát se.\n\n„Skvělý příběh! Ale věř mi, [Select_CString(ROOT.Char.IsFemale,'přítelkyně','příteli')], v celých dějinách není slavnější události než ta, kdy [bp1_yearly_9050_friend_memory.GetDescription]! Ha! To byly nádherné časy a modlím se, aby nás čekalo ještě mnoho dalších slavných dnů!“"
 bp1_yearly.9050.a: "Nikdo neumí vyprávět jako [bp1_yearly_9050_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.9050.b: "#EMP Můj#! příběh je očividně lepší!"
 exploitative_lord_modifier: "Vykořisťování poddaných"
 exploitative_lord_modifier_desc: "Tato postava vykořisťuje i ty nejzoufaleji chudé nevolníky, pokud z nich lze vytřískat nějakou minci."
