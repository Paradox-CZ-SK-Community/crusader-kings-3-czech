l_polish:
 bp1_yearly.3001.t: "[Select_CString(friend.IsFemale,'Opravdová přítelkyně','Opravdový přítel')]"
 bp1_yearly.3001.desc: "Ať už se [ROOT.Char.Custom( 'FortifiedBuilding' )] tyčí sebevýš, poslední dobou mám hluboko do kapsy. Ať vyberu na daních sebevíc, stejně se mi nedaří vyjít s penězi!\n\n[friend.GetTitledFirstNameNoTooltip], [Select_CString(friend.IsFemale,'jako vždy svědomitá','jako vždy svědomitý')] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))], mě během tohoto období smůly [Select_CString(friend.IsFemale,'přišla navštívit','přišel navštívit')]. Když probíráme mé současné potíže, [friend.GetFirstNameNoTooltip] nabídne, že mou pokladnici pořádně doplní.\n\n[friend.GetFirstNameNoTooltip] sevře mé ruce a tiše řekne: „Dovol mi pomoci, můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))]. Vím, že ty bys pro mě [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] totéž.“"
 bp1_yearly.3001.a: "Chvála [ROOT.Char.GetFaith.WealthGodName] za tohle nádherné překvapení!"
 bp1_yearly.3001.b: "Nikdy bych [Select_CString(friend.IsFemale,'přítelkyni','přítele')] takhle [Select_CString(ROOT.Char.IsFemale,'nezatěžovala','nezatěžoval')]."
 bp1_yearly.3001.c: "Ve skutečnosti potřebuju pár pohárků..."
 bp1_yearly.3001.c.tt: "Ty a [friend.GetFirstNameNoTooltip] rozhazujete peníze ve jménu přátelství a veselí"
 bp1_yearly.3001.d: "„[Select_CString(friend.IsFemale,'Nemohla','Nemohl')] bys postrádat ještě o něco víc?“"
 bp1_yearly.3002.t: "[Select_CString(friend.IsFemale,'Přítelkyně v nouzi','Přítel v nouzi')]"
 bp1_yearly.3002.desc: "Jdu navštívit [friend.GetTitledFirstNameNoTooltip], svého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))], ale tentokrát [friend.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] vypadá úplně jinak než při mé poslední návštěvě.\n\nKdykoli jsem dříve [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')], [friend.GetFirstNameNoTooltip] pro nás [Select_CString(friend.IsFemale,'nechávala','nechával')] připravit [friend.Custom('GetExpensiveDrink')] a [friend.Custom('GetExpensiveDessert')]."
 bp1_yearly.3002.a: "[Select_CString(ROOT.Char.IsFemale,'Měla','Měl')] bych pomoci, jak jen můžu."
 bp1_yearly.3002.b: "„No, asi už bych [Select_CString(ROOT.Char.IsFemale,'měla','měl')] jít...“"
 bp1_yearly.3002.b.tt: "Když [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))] potřebuje pomoc, jednoduše to ignoruješ"
 bp1_yearly.3002.c: "Ať se [friend.GetFirstNameNoTooltip] jednu noc pořádně pobaví!"
 bp1_yearly.3002.c.tt: "Ty a [friend.GetFirstNameNoTooltip] prožijete večer plný prostopášnosti"
 bp1_yearly.3002.d: "Podíváme se na tvé účetní knihy..."
 bp1_yearly.3002.d.tt: "Necháš si přinést finanční záznamy k prozkoumání"
 bp1_yearly.3003.desc: "Začnu procházet poslední výdaje [friend.GetFirstNamePossessiveNoTooltip] a snažím se přijít na to, co mohlo způsobit tak zoufalou situaci. Problém odhalím okamžitě:\n\nOzbrojenci: -1.8\nVybavení – [friend.Custom('GetCourt')]: -3.2\nNový $court_physician_court_position$: -50\n#difficulty_hard Svíčky: -360 #!\nDary – [friend.Custom('GetCourtierPlural')|U]: -15\n\n„Svíčky? Ty ses [Select_CString(friend.IsFemale,'zadlužila','zadlužil')] kvůli #EMP svíčkám?!#!“\n\n[friend.GetFirstNameNoTooltip] rozpačitě odpoví: „Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('friend'))], ve správě se vyznáš. Prosím, pomoz mi!“"
 bp1_yearly.3003.a: "„Pomůžu ti, ale jen tentokrát...“"
 bp1_yearly.3003.b: "„Utrácej méně za svíčky.“"
 bp1_yearly.3004.t: "Podivný zvuk"
 bp1_yearly.3004.desc: "Po dlouhé osamělé procházce se vracím domů. Přede mnou se znovu tyčí [ROOT.Char.Custom('FortifiedBuilding')]. Další rok je pryč, zase jsem o rok starší...\n\nPrávě dnes je to [ROOT.Char.GetAge] let, co jsem [Select_CString(ROOT.Char.IsFemale,'přišla na svět','přišel na svět')]. Čím jsem starší, tím více si vážím vztahů, které jsem za ta léta [Select_CString(ROOT.Char.IsFemale,'vypěstovala','vypěstoval')]... "
 bp1_yearly.3004.spouse: "O to víc mě mrzí, že [ROOT.Char.Custom2('RelationToMe', ROOT.Char.GetPrimarySpouse)] [ROOT.Char.GetPrimarySpouse.GetFirstName] se mi dnes vůbec [Select_CString(ROOT.Char.GetPrimarySpouse.IsFemale,'neozvala','neozval')], stejně jako nikdo z mých přátel.\n\n"
 bp1_yearly.3004.friends: "O to víc mě mrzí, že [friend1.GetTitledFirstName], [friend2.GetTitledFirstName] ani žádný z mých ostatních přátel se mi dnes vůbec neozvali.\n\n"
 bp1_yearly.3004.end: "Vleču se ke svým komnatám a osamělost tíží každý můj krok, když se z chodby ozve #EMP řinčení#! a tlumený šepot."
 bp1_yearly.3004.a: "„Co to v tuhle hodinu může být?“"
 bp1_yearly.3004.b: "„Kudy nejrychleji pryč? Slaním z okna!“"
 bp1_yearly.3005.t: "Všechno nejlepší!"
 bp1_yearly.3005.desc: "To je překvapení! Všichni mí nejbližší a nejdražší přátelé se sešli, aby mi popřáli do dalšího roku života. Dokonce se tu na celém stole skví [ROOT.Char.Custom('GetExpensiveDessert')], #EMP přesně podle mého gusta!#! A já si přitom [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')], že na mě všichni zapomněli.\n\nNemohu uvěřit, že si [party_host.GetFirstName] [Select_CString(party_host.IsFemale,'dala','dal')] tolik práce, aby všechno tajně [Select_CString(party_host.IsFemale,'připravila','připravil')]. Neměl jsem ani tušení, že se chystá tak pozorné překvapení.\n\nMůj přítel [friend2.GetFirstName] ke mně přichází a sotva unese tři nádherně zabalené balíčky. Jako vždy [Select_CString(friend2.IsFemale,'rozverná','rozverný')] [friend2.GetFirstNameNoTooltip] pronese: „Mám tu tři dary, ze kterých si můžeš vybrat. Jeden bude tvůj, ale který to bude?“"
 bp1_yearly.3005.a: "„Vezmu si ten největší!“"
 bp1_yearly.3005.b: "„Ten prostřední bude perfektní.“"
 bp1_yearly.3005.c: "„Dobré věci přicházejí v malých baleních.“"
 bp1_yearly.3005.a.tt: "Získáš velký dar"
 bp1_yearly.3005.b.tt: "Získáš střední dar"
 bp1_yearly.3005.c.tt: "Získáš malý dar"
 bp1_yearly.3005.t.gift: "Obdržen narozeninový dar"
 bp1_yearly.3005.opinion.tt: "Každý [Concept('friend','přítel')|E] k tobě získá #P 30#! [Concept('opinion','mínění')|E]"
 bp1_yearly.3006.t: "Vzpomínky na dávné narozeniny"
 bp1_yearly.3006.desc: "Dnes jsem zase o rok starší a vybaví se mi nádherná narozeninová oslava, kterou jsem před několika lety [Select_CString(ROOT.Char.IsFemale,'zažila','zažil')] díky svým přátelům [friend1.GetFirstName] a [friend2.GetFirstName]. Jak krásné bylo cítit, s jakou laskavostí a vřelostí se naše přátelství tehdy projevilo!\n\n"
 bp1_yearly.3006.desc.friend1_dead: "[friend1.GetFirstName] od té doby [Select_CString(friend1.IsFemale,'zemřela a já truchlím nad ztrátou tak skvělé přítelkyně','zemřel a já truchlím nad ztrátou tak skvělého přítele')]. [Select_CString(friend1.IsFemale,'Stála','Stál')] při mně v dobrém i zlém a v časech smutku mi vždy [Select_CString(friend1.IsFemale,'dokázala','dokázal')] vykouzlit úsměv na tváři.\n\n"
 bp1_yearly.3006.desc.friend2_dead: "[friend2.GetFirstNameNoTooltip] od té doby [Select_CString(friend2.IsFemale,'zemřela a já truchlím nad ztrátou tak skvělé přítelkyně','zemřel a já truchlím nad ztrátou tak skvělého přítele')]. [Select_CString(friend2.IsFemale,'Stála','Stál')] při mně v dobrém i zlém a v časech smutku mi vždy [Select_CString(friend2.IsFemale,'dokázala','dokázal')] vykouzlit úsměv na tváři. Ačkoli je [friend2.GetFirstNameNoTooltip] pryč, vzpomínky na naše společné chvíle mi zůstávají drahé.\n\n"
 bp1_yearly.3006.desc.artifact_positive: "Pamatuji si to, jako by to bylo včera. Hodovalo se, tančilo a dokonce jsem [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')] nádherný dar!\n\n"
 bp1_yearly.3006.desc.artifact_negative: "Pamatuji si to, jako by to bylo včera. Hodovalo se, tančilo a dokonce jsem [Select_CString(ROOT.Char.IsFemale,'dostala','dostal')] dar. To ovšem bylo ještě předtím, než se mezi námi všechno pokazilo. Dnes ty vzpomínky kalí zrada [friend2.GetFirstNamePossessive].\n\n"
 bp1_yearly.3006.desc.artifact_exists: "Myslím, že [old_bday_gift.GetName] se mi pořád někde povaluje..."
 bp1_yearly.3006.a: "Je příjemné vzpomínat na staré časy."
 bp1_yearly.3006.b: "Nikdy na tebe nezapomenu."
 bp1_yearly.3006.c: "Spalte to a nechte mě na tu zradu zapomenout!"
 bp1_yearly.3006.d: "Proklínám tě. Doufám, že shniješ v pekle."
 bp1_yearly.3007.t: "Rodinné řemeslo"
 bp1_yearly.3007.desc: "Právě dokončuji poslední záležitosti dne ve své [ROOT.Char.Custom('GetChamber')], když dovnitř ležérně vejde [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))] [spouse.GetTitledFirstName]. Hned v patách dychtivě kráčí [spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))] [inspired_family_member.GetFirstName]. Odložím účetní knihu, kterou jsem právě [Select_CString(ROOT.Char.IsFemale,'četla','četl')], protože z téhle nečekané návštěvy jistě nevzejde nic dobrého.\n\n"
 bp1_yearly.3007.desc.tapestry: "[spouse.GetFirstNameNoTooltip] váhavě poznamená něco o vybavení [ROOT.Char.Custom('GetRoom')].\n„Ty holé stěny tě ani trochu nepřivádějí k šílenství? Přesně vím, co [ROOT.Char.Custom('GetRoom')] potřebuje: #EMP tapiserie!#!“\n\n„[spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))] [inspired_family_member.GetFirstName] to s jehlou a nití umí #EMP skvěle#!. "
 bp1_yearly.3007.desc.regalia: "[spouse.GetFirstNameNoTooltip] si mě váhavě prohlédne.\n„Jako [spouse.Custom2('RelationToMeShort', ROOT.Char)] jsi [Select_CString(ROOT.Char.IsFemale,'mocná a vlivná','mocný a vlivný')] [ROOT.GetCharacter.GetTitleAsNameNoTooltip|l], ale někteří ti stále neprokazují úctu, kterou si zasloužíš. Potřebuješ něco, co všem ukáže tvou autoritu!“\n\n„[spouse.Custom2('RelationToMeShort',SCOPE.sC('inspired_family_member'))] [inspired_family_member.GetFirstName] by [Select_CString(inspired_family_member.IsFemale,'dokázala vykovat','dokázal vykovat')] #EMP nádherné#! regálie odpovídající tvému postavení. "
 bp1_yearly.3007.desc.conc: "Ať [inspired_family_member.GetFirstName] získá tvou podporu a uvidíš, jak ti ten výtvor zlepší náladu!“"
 bp1_yearly.3007.a.tapestry: "„Přesně na tohle jsem [Select_CString(ROOT.Char.IsFemale,'myslela','myslel')]! Je to tu příšerné!“"
 bp1_yearly.3007.a.regalia: "„Je nejvyšší čas získat trochu úcty!“"
 bp1_yearly.3007.b: "„Na takový přepych nemáme ani minci nazbyt...“"
 bp1_yearly.3100.t: "[Select_CString(3100_target_courtier.IsFemale,'Dvořanka mezi přáteli','Dvořan mezi přáteli')]"
 bp1_yearly.3100.desc: "Dnes mě svou návštěvou [Select_CString(3100_courtier_liege.IsFemale,'poctila','poctil')] [3100_courtier_liege.GetTitledFirstName], [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('3100_courtier_liege'))]. [3100_courtier_liege.Custom('GetCourtierPlural')|U] obvykle tvoří doprovod, tentokrát však přichází jen [3100_target_courtier.GetFirstName]. [3100_courtier_liege.GetFirstNameNoTooltip] ke mně nadšeně přistoupí:\n\n„Vítám tě, [ROOT.Char.GetTitledFirstNameNoTooltip]! Těší mě, že se ti tady v [ROOT.Char.GetCapitalLocation.GetName] tak daří. Napadlo mě, že [3100_target_courtier.GetFirstName] by ti [Select_CString(3100_target_courtier.IsFemale,'mohla','mohl')] dobře sloužit. [ROOT.Char.Custom('GetCourt')] tím získá novou posilu. "
 bp1_yearly.3100.desc.diplomacy: "[Select_CString(3100_target_courtier.IsFemale,'Je to neuvěřitelně nadaná diplomatka','Je to neuvěřitelně nadaný diplomat')] a jazyk má ostrý jako břitvu! "
 bp1_yearly.3100.desc.intrigue: "Má nespočet cest k vlivu a způsobů, jak se o věci postarat... #EMP potichu#!. "
 bp1_yearly.3100.desc.martial: "[Select_CString(3100_target_courtier.IsFemale,'Je to neuvěřitelně nadaná stratégyně','Je to neuvěřitelně nadaný stratég')]! Neustále promýšlí nové taktické možnosti. "
 bp1_yearly.3100.desc.stewardship: "[Select_CString(3100_target_courtier.IsFemale,'Je to neuvěřitelně schopná správkyně','Je to neuvěřitelně schopný správce')]! "
 bp1_yearly.3100.desc.learning: "[Select_CString(3100_target_courtier.IsFemale,'Je nesmírně vzdělaná','Je nesmírně vzdělaný')], dokonce nejbystřejší ze všech, od kterých jsem se kdy něco [Select_CString(3100_courtier_liege.IsFemale,'naučila','naučil')]! "
 bp1_yearly.3100.desc.prowess: "[Select_CString(3100_target_courtier.IsFemale,'Je stavěná jako medvědice a ještě o polovinu silnější','Je stavěný jako medvěd a ještě o polovinu silnější')]! "
 bp1_yearly.3100.desc.conc: "[3100_target_courtier.GetFirstNameNoTooltip] by mi [Select_CString(3100_target_courtier.IsFemale,'mohla','mohl')] být k užitku, ale bohužel to zřejmě není možné.\n\nByla by škoda nechat takový talent přijít nazmar. Co kdyby [3100_target_courtier.GetFirstNameNoTooltip] [Select_CString(3100_target_courtier.IsFemale,'přešla k tobě a naplno rozvinula svůj potenciál','přešel k tobě a naplno rozvinul svůj potenciál')]?“"
 bp1_yearly.3100.a: "[3100_target_courtier.GetFirstNameNoTooltip] u mě najde přesně to pravé místo!"
 bp1_yearly.3100.b: "Musím zdvořile odmítnout."
 bp1_yearly_3100_courtier_gained: "Na tvůj dvůr přichází [ROOT.Char.Custom('GetCourtier')] s mimořádnými schopnostmi"
 bp1_yearly.3101.t: "Hrabství mezi přáteli"
 bp1_yearly.3101.desc: "[target_title_holder.GetTitledFirstName] za mnou přichází s velkolepým návrhem. Ví, že mám právoplatný nárok na [target_title.GetName], a konečně se [Select_CString(target_title_holder.IsFemale,'rozhodla tento nárok uznat','rozhodl tento nárok uznat')].\n\n„[Select_CString(ROOT.Char.IsFemale,'Má přítelkyně','Můj příteli')],“ pronese, „[Select_CString(target_title_holder.IsFemale,'velmi ráda bych ti přenechala','velmi rád bych ti přenechal')] [target_title.GetNameNoTierNoTooltip], protože ti právem náleží. Nemohu to však udělat, aniž bych za to něco [Select_CString(target_title_holder.IsFemale,'dostala','dostal')]. Ke svému lidu se přece nemohu vrátit s prázdnýma rukama.“\n\n„Dej mi něco, co budu moci po návratu do [target_title_holder.GetCapitalLocation.GetName] ukázat svému lidu, a [target_title.GetNameNoTierNoTooltip] připadne tobě.“"
 bp1_yearly.3101.a: "„S vděčností přijímám! Tohle by mělo stačit...“"
 bp1_yearly.3101.b: "„Takovým způsobem [target_title.GetNameNoTierNoTooltip] přijmout nemohu.“"
 bp1_yearly.3201.opening: "[host.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.3201.desc: "Srdečně tě zvu na svou hostinu v [host.GetCapitalLocation.GetTitle.GetNameNoTier]! Čeká tě velkolepá slavnost se znamenitým jídlem a zábavou."
 bp1_yearly.3202.t: "Hostina pro hlupáka"
 bp1_yearly.3202.desc: "Vstoupím do [host.Custom( 'FortifiedBuilding' )] [host.GetTitledFirstNamePossessiveNoTooltip] v očekávání velkolepé a veselé hostiny, na niž mi přišlo pozvání, ale nikde není ani živáčka! Po chvíli hledání najdu [host.GetFirstNameNoTooltip] a [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('enemy'))] [enemy.GetFirstNameNoTooltip], jak si povídají o bůhvíčem.\n\n[host.GetFirstNameNoTooltip] se při mém nečekaném příchodu překvapeně otočí a zeptá se, proč jsem [Select_CString(ROOT.Char.IsFemale,'dorazila','dorazil')] bez ohlášení.\n\n„[Select_CString(ROOT.Char.IsFemale,'Myslela jsem','Myslel jsem')]... že ta pozvánka na dnešní hostinu byla od tebe...?“\n\n[host.GetFirstNameNoTooltip] mi vysvětlí, že se mýlím, a začne mě poučovat o dvorské etiketě. [enemy.GetFirstNameNoTooltip] se mezitím nedokáže přestat pochechtávat, zatímco mě [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))] naprosto zesměšňuje."
 bp1_yearly.3202.a: "„Omlouvám se, [host.GetTitledFirstNameNoTooltip]...“"
 bp1_yearly.3202.a.liege: "„Omlouvám se, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))]...“"
 bp1_yearly.3202.b: "„Musíš mi věřit, že za tím stojí [enemy.GetFirstNameNoTooltip]!“"
 bp1_yearly.3202.b.success: "Přesvědčíš [host.GetTitledFirstNameNoTooltip] o provinění [enemy.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.3202.b.failure: "Nepodaří se ti přesvědčit [host.GetTitledFirstNameNoTooltip] o provinění [enemy.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.3202.c: "„Je nejvyšší čas tyhle hry ukončit, [enemy.GetFirstNameNoTooltip].“"
 bp1_yearly.3202.c.tt: "#V Duel#! s [enemy.GetFirstName].\n#weak Tento duel NENÍ na život a na smrt. Přesto v něm lze zemřít.#!\nPokud vyhraješ, vyjde najevo pravda o tom, co se zde stalo. Pokud prohraješ, [enemy.GetFirstNameNoTooltip] tě skutečně porazí.\n\nTvá [Concept('prowess','udatnost')|E]: [prowess_i]#V [root_for_loc.GetProwess]#!\n[Concept('prowess','Udatnost')|E] [enemy.GetFirstNamePossessive]: [prowess_i]#V [enemy.GetProwess]#!"
 bp1_yearly.3203.sc_result_won: "V duelu proti [sc_loser.GetTitledFirstNameNoTooltip] vítězíš"
 bp1_yearly.3203.sc_result_lost: "V duelu proti [sc_victor.GetTitledFirstNameNoTooltip] prohráváš"
 bp1_yearly.3204.sc_invalid: "Tvůj duel proti [enemy.GetTitledFirstNameNoTooltip] byl zneplatněn"
 bp1_yearly.3300.t: "Rozjímání o [ROOT.Char.GetFaith.HighGodName]"
 bp1_yearly.3300.desc: "Sedím a rozjímám nad jemnějšími stránkami [ROOT.Char.GetFaith.GetName] a nemohu si nevzpomenout na dobu, kdy [pilgrimage_memory.GetDescription]. Tato cesta mě zavedla daleko od každodenního pohodlí mého života coby [ROOT.Char.GetTitleAsNameNoTooltip|l], ale úleva, kterou jsem [Select_CString(ROOT.Char.IsFemale,'pocítila','pocítil')] po příchodu do [pilgrimage_destination.GetName], za všechny útrapy stála."
 bp1_yearly.3300.a: "Věřím, že [ROOT.Char.GetFaith.HighGodName] mi už navždy bude bližší."
 bp1_yearly.3301.desc: "Sedím a rozjímám nad jemnějšími stránkami [ROOT.Char.GetFaith.GetName] a nemohu si nevzpomenout na dobu, kdy [pilgrimage_memory.GetDescription]. Tato cesta mě zavedla daleko od každodenního pohodlí mého života coby [ROOT.Char.GetTitleAsNameNoTooltip|l], ale úleva, kterou jsem [Select_CString(ROOT.Char.IsFemale,'pocítila','pocítil')] po příchodu do [pilgrimage_destination.GetName], za všechny útrapy stála.\n\nDalším příjemným přínosem bylo, že jsme si s [pilgrimage_friend.GetFirstName] během cesty byli mnohem bližší. Na té pouti jsme spolu prožili opravdu krásné chvíle."
 bp1_yearly.3301.a: "[ROOT.Char.GetFaith.HighGodName] i [pilgrimage_friend.GetFirstNameNoTooltip] mi už navždy budou bližší."
