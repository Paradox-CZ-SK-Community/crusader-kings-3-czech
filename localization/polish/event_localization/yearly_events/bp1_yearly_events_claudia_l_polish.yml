l_polish:
 bp1_yearly.1000.t: "Nový koníček"
 bp1_yearly.1000.desc: "Můj nejlepší [Select_CString(friend.IsFemale,'přítelkyně','přítel')] [friend.GetTitledFirstName] ke mně přichází s širokým úsměvem na tváři.\n\n„[Select_CString(ROOT.Char.IsFemale,'Má nejdražší přítelkyně','Můj nejdražší příteli')], konečně se zase vidíme! Připadá mi, že spolu poslední dobou vůbec netrávíme pořádný čas... Možná bys se mnou [Select_CString(ROOT.Char.IsFemale,'chtěla','chtěl')] zkusit něco nového? Znám přesně to pravé, co ti pročistí hlavu, posílí tělo a pozvedne ducha!"
 bp1_yearly.1000.desc_cannibal: "\n\n„Co kdybys ke mně [Select_CString(ROOT.Char.IsFemale,'přišla','přišel')] na večeři? Mám čerstvou várku #EMP zvláštního#! masa, jaké jsi ještě nikdy [Select_CString(ROOT.Char.IsFemale,'neochutnala','neochutnal')] - #EMP zakázaného#! masa, jestli mi rozumíš...“"
 bp1_yearly.1000.desc_deviant: "\n\n„Někdy v noci by ses ke mně [Select_CString(ROOT.Char.IsFemale,'měla přidat','měl přidat')] při mém #EMP objevování#!! Nic neosvěží tolik jako nacházet potěšení ve všech těch drobnostech... Nebo #EMP velkých věcech#!, pokud je máš raději... Co říkáš na #EMP [friend.Custom('DeviantObjectPlural')]#!?“"
 bp1_yearly.1000.desc_witch: "\n\n„Co kdybys se mnou [Select_CString(ROOT.Char.IsFemale,'vyrazila','vyrazil')] na noční procházku? Znám všechna tajná umění, jak polapit štěstěnu, spoutat smrt, zotročit lásku a přivolat zlato. S #EMP velikou radostí#! bych tě je všechny [Select_CString(friend.IsFemale,'naučila','naučil')]!“"
 bp1_yearly.1000.desc_hashish: "\n\n„Když tě tíží stres a povinnosti, znám ten správný recept, díky kterému necháš všechny starosti za sebou! [Select_CString(ROOT.Char.IsFemale,'Ochutnala jsi','Ochutnal jsi')] někdy moje #EMP speciální koláčky#!?“"
 bp1_yearly.1000.desc_drunkard: "\n\n„#EMP [ROOT.Char.Custom('RegionalAlcoholicDrink')|U]#!! [Select_CString(ROOT.Char.IsFemale,'Přítelkyně','Příteli')], zapijme naše trápení! Jeden pohár za druhým je nejlepší lék ze všech!“"
 bp1_yearly.1000.desc_reveler: "\n\n„Celá noc veselí! Jídlo, pití, zpěv, tanec a bujará zábava, přesně to potřebuješ! Pojď se mnou!“"
 bp1_yearly.1000.desc_hunter: "\n\n„Ticho lesa a vzrušení z lovu ti zaručeně zvednou náladu! Mně to zabírá pokaždé a moc [Select_CString(friend.IsFemale,'ráda bych','rád bych')] se s tebou o tuhle svou vášeň [Select_CString(friend.IsFemale,'podělila','podělil')].“"
 bp1_yearly.1000.desc_confider: "\n\n„Z vlastní zkušenosti vím, že nic nepřináší větší útěchu než svěřit své trápení někomu blízkému. Kdykoli toho na tebe bude příliš, pamatuj, že si se mnou můžeš vždycky promluvit. Uleví se ti, slibuji!“"
 bp1_yearly.1000.desc_athletic: "\n\n„Pohyb je vždycky řešení! Vypoť ze sebe všechnu bolest! Nech svaly křičet tak hlasitě, že neuslyšíš vlastní myšlenky! #EMP VYKRVAŤ ZE SEBE VŠECHEN HNĚV#!! Sejdeme se na nádvoří a já ti ukážu jak!“"
 bp1_yearly.1000.desc_fallback_1: "\n\n„Co takhle vyrazit na ryby? Všude kolem ticho přírody a jen ty, tvá kořist, dobré pití a příjemná společnost...“"
 bp1_yearly.1000.desc_fallback_2: "\n\n„Co takhle zajít na místní tržiště? Pozorovat ostatní při práci, zatímco se jen tak procházíš, je překvapivě uklidňující. A třeba tam najdeš něco pěkného ke koupi!“"
 bp1_yearly.1000.desc_fallback_3: "\n\n„Ve městě je slavný potulný minstrel. Co kdybychom se šli podívat na jeho vystoupení? Určitě to bude stát za to!“"
 bp1_yearly.1000.a1: "Myslíme oba na stejné #EMP zvláštní maso#!?"
 bp1_yearly.1000.a: "Samozřejmě, kvůli tobě to zkusím!"
 bp1_yearly.1000.a.tt: "[friend.GetShortUIName] tě naučí všechny triky"
 bp1_yearly.1000.a.tt.2: "Triky osvojeny!"
 bp1_yearly.1000.a.tt.3: "Osvojíš si tento návyk"
 bp1_yearly.1000.b: "Mně to zase #EMP tak#! lákavé nepřipadá..."
 bp1_yearly.1000.b.tt: "Raději se budeš věnovat svým povinnostem."
 bp1_yearly.1000.c: "Jak se #EMP opovažuješ#!!"
 bp1_yearly.1010.t: "Svaté zprostředkování"
 bp1_yearly.1010.desc: "Když potkám svého [Select_CString(friend.IsFemale,'přítelkyni','přítele')] [friend.GetTitledFirstName], jak odchází z [friend.GetFaith.HouseOfWorship], okamžitě poznám, že mi chce něco říct.\n\n„[Select_CString(ROOT.Char.IsFemale,'Přítelkyně','Příteli')]! Modlím se za tebe ode dne, kdy tě vyloučili ze společenství věřících! Nemohu se přestat strachovat o tvou nebohou duši... Tolik bych ti [Select_CString(friend.IsFemale,'chtěla','chtěl')] pomoci víc!\n\n„Dovolíš mi přimluvit se za tebe u [ROOT.Char.GetFaith.ReligiousHeadName]? [pope.GetFirstNameNoTooltip] by ti teď možná [Select_CString(pope.IsFemale,'byla ochotná odpustit','byl ochotný odpustit')] tvá minulá provinění!“"
 bp1_yearly.1010.a: "Prosím, zkus to kvůli mně..."
 bp1_yearly.1010.a.success: "[friend.GetShortUIName] přesvědčí [pope.GetTitledFirstNameNoTooltip], aby zrušil tvou exkomunikaci"
 bp1_yearly.1010.a.success.tt: "Exkomunikace zrušena!"
 bp1_yearly.1010.a.failure: "[pope.GetTitledFirstNameNoTooltip|U] se nenechá přesvědčit"
 bp1_yearly.1010.a.failure.tt: "[ROOT.Char.GetFaith.ReligiousHeadName|U] se nenechá přesvědčit"
 bp1_yearly.1010.a.horrible_failure: "[pope.GetTitledFirstNameNoTooltip|U] se urazí"
 bp1_yearly.1010.a.horrible_failure.tt: "[ROOT.Char.GetFaith.ReligiousHeadName|U] se urazí!"
 bp1_yearly.1010.b: "Tohle není nutné."
 bp1_yearly.1020.t: "[Select_CString(friend.IsFemale,'Přítelkyně až do konce','Přítel až do konce')]"
 bp1_yearly.1020.desc_intro: "Ležím na lůžku a proklínám své zesláblé, selhávající tělo, když sotva rozeznám postavu, která se ke mně blíží. Pomalé kroky a tíživé ticho ve mně začínají vzbuzovat strach."
 bp1_yearly.1020.desc: "\n\nZřejmě pozná mé znepokojení z tichých zvuků, které ze sebe vydávám, a trhavých pohybů mých rukou, protože kroky náhle zrychlí. Vzápětí už mou ruku svírá teplá dlaň a do zorného pole vstoupí známá tvář.\n\n„Pššt, [ROOT.Char.GetFirstNameNoTooltip], to jsem jen já, [friend.GetFirstName]. Ach, jak mě bolí vidět tě v tomhle stavu... Kéž bych [Select_CString(friend.IsFemale,'mohla','mohl')] něco udělat, #EMP cokoli#!, abych ti [Select_CString(friend.IsFemale,'ulevila','ulevil')].“"
 bp1_yearly.1020.a: "Prosím, zůstaň se mnou..."
 bp1_yearly.1020.b: "Nechci, abys mě takhle [Select_CString(friend.IsFemale,'viděla','viděl')]."
 bp1_yearly.1021.desc: "Stále mám před očima všechny krásné chvíle, které jsem s [friend.GetFirstName] [Select_CString(ROOT.Char.IsFemale,'prožila','prožil')]. Když teď vstoupím do potemnělé místnosti a spatřím na posteli téměř nehybné, zesláblé tělo [friend.GetFirstNameNoTooltip], s jistotou vím, že ty časy už se nevrátí, a srdce mi sevře hluboký smutek.\n\n[friend.GetFirstNameNoTooltip] zaslechne mé kroky a začne být [Select_CString(friend.IsFemale,'neklidná','neklidný')], a tak rychle přispěchám k lůžku.\n\n„To jsem já, [Select_CString(ROOT.Char.IsFemale,'tvá drahá','tvůj drahý')] [ROOT.Char.GetFirstNameNoTooltip]! Jsem tady.“"
 bp1_yearly.1021.desc_bestie: "\n\nNa okamžik se zdá, že mě [friend.GetFirstNameNoTooltip] poznává, a gestem mě přivolá blíž."
 bp1_yearly.1021.desc_token: "„Vezmi si... tohle...“ zamumlá [friend.GetFirstNameNoTooltip]. Přikývnu a přijmu nabízený předmět. V duchu si slíbím, že jej budu opatrovat jako vzpomínku na [friend.GetFirstNameNoTooltip]."
 1021_trinket_desc: "[new_trinket.GetDesc]\n\n[bestie.GetTitledFirstNameNoTooltip|U] jej na smrtelném loži [Select_CString(bestie.IsFemale,'předala','předal')] [Select_CString(ROOT.Char.IsFemale,'své nejlepší přítelkyni','svému nejlepšímu příteli')] [ROOT.Char.GetTitledFirstNameNoTooltip]."
 bp1_yearly.1021.desc_secret: "„Je tu něco... co jsem ti nikdy [Select_CString(friend.IsFemale,'neřekla','neřekl')]...“ zašeptá mi [friend.GetFirstNameNoTooltip] do ucha. Když uslyším pravdu, oči se mi rozšíří úžasem."
 bp1_yearly.1021.desc_misery: "„Prosím... osvoboď mě...“ zamumlá [friend.GetFirstNameNoTooltip]."
 bp1_yearly.1021.desc_end: "Je to jen prchavý okamžik. Potom se pohled [friend.GetFirstNameNoTooltip] znovu rozostří."
 bp1_yearly.1021.a: "Zůstanu po tvém boku."
 bp1_yearly.1021.b: "Nedokážu tě takhle vidět. Odpusť mi."
 bp1_yearly.1021.c: "Odpočívej v pokoji, [friend.GetFirstNameNoTooltip]."
 bp1_yearly.1030.t: "Až do hořkého konce"
 bp1_yearly.1030.desc: "\n\n„HA! Jen se na sebe podívej! Už nejsi tak [Select_CString(ROOT.Char.IsFemale,'děsivá','děsivý')], co? Vůbec mě poznáváš, ty [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('rival'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival'))]? To jsem já, [rival.GetFirstName]! Ach, jak dlouho jsem [Select_CString(rival.IsFemale,'toužila','toužil')] vidět tě takhle [Select_CString(ROOT.Char.IsFemale,'poníženou','poníženého')]!“"
 bp1_yearly.1030.desc_nemesis: "\n\n„Ne, [Select_CString(nemesis.IsFemale,'nepřišla','nepřišel')],“ odpoví [nemesis.GetFirstNameNoTooltip]. Ani nestačím postřehnout nebezpečný záblesk v očích [nemesis.GetFirstNameNoTooltip] a už stojí u mého lůžka s ledovým úsměvem na tváři."
 bp1_yearly.1030.desc_nemesis_guard: "Už ztrácím veškerou naději, když do místnosti náhle vtrhne můj [GetCourtPositionType('bodyguard_court_position').GetName()] [guard.GetFirstName]!"
 bp1_yearly.1030.desc_nemesis_no_guard: "Snažím se pohnout, utéct, vykřiknout, #EMP cokoli#!, ale mé zesláblé tělo mě už dávno neposlouchá..."
 bp1_yearly.1030.desc_rival: "\n\nHořký smích [rival.GetFirstNameNoTooltip] ve mně probudí několik nepříjemných vzpomínek, ale vzápětí je znovu pohltí tupá mlha. Už si ani nedokážu vzpomenout, proč jsme se tolik nenáviděli."
 bp1_yearly.1030.a: "Víš co? #EMP Odpouštím ti#!."
 bp1_yearly.1030.b: "#EMP PROSTĚ ODEJDI!#!"
 bp1_yearly.1030.c: "...#EMP pomoc#!..."
 bp1_yearly.1030.c_saved_guard: "[guard.GetShortUIName] [Select_CString(guard.IsFemale,'zabije útočnici','zabije útočníka')]"
 bp1_yearly.1030.c_saved_guard.tt: "[guard.GetShortUIName] tě [Select_CString(guard.IsFemale,'zachránila','zachránil')]!"
 bp1_yearly.1030.c_barely_saved_guard: "[guard.GetShortUIName] tě sotva dokáže zachránit"
 bp1_yearly.1030.c_barely_saved_guard.tt: "[guard.GetShortUIName] tě sotva [Select_CString(guard.IsFemale,'zachránila','zachránil')]!"
 bp1_yearly.1030.c_killed_guard: "[guard.GetShortUIName] tě zachrání, ale zemře"
 bp1_yearly.1030.c_killed_guard.tt: "[guard.GetShortUIName] tě [Select_CString(guard.IsFemale,'zachránila, ale zemřela','zachránil, ale zemřel')]!"
 bp1_yearly.1030.c_killed_all: "Ty i tvůj [GetCourtPositionType('bodyguard_court_position').GetName()] zemřete"
 bp1_yearly.1030.c_saved: "Útok se ti podaří odrazit"
 bp1_yearly.1030.c_saved.tt: "Útok se ti podařilo odrazit!"
 bp1_yearly.1030.c_killed: "Zemřeš"
 bp1_yearly.1031.desc: "Od chvíle, kdy se ke mně donesla zpráva o nemoci [rival.GetTitledFirstNamePossessive], nemohu najít klid. Musel jsem to vidět na vlastní oči. Teď tu stojím a sleduji, jak zesláblé tělo [rival.GetFirstNameNoTooltip] téměř nehybně leží na lůžku a posledními zbytky sil se zoufale drží života. Zmítají mnou protichůdné pocity."
 bp1_yearly.1031.desc_nemesis: "\n\nNebylo by snazší všechnu tu bolest a zlobu prostě nechat být? Jenže [nemesis.GetFirstNameNoTooltip] nikdy [Select_CString(nemesis.IsFemale,'nevypadala tak slabá ani tak bezbranná','nevypadal tak slabý ani tak bezbranný')]... Tak [Select_CString(nemesis.IsFemale,'křehká','křehký')], že bych [nemesis.GetFirstNameNoTooltip] mohl holýma rukama #EMP přelomit#!..."
 bp1_yearly.1031.desc_rival: "\n\n„Vůbec mě poznáváš, ty [rival.Custom2('InsultAdjective', ROOT.Char)] [rival.Custom2('InsultNoun', ROOT.Char)]?“ Tvář [rival.GetFirstNameNoTooltip] se na okamžik stáhne a oči těkají sem a tam, jako by mě hledaly, ale nikdy se na mě nezaostří."
 bp1_yearly.1031.desc_guard: "Zatímco jsem [Select_CString(ROOT.Char.IsFemale,'zabraná','zabraný')] do svých úvah, všimnu si chladného pohledu, kterým mě z druhé strany místnosti sleduje [GetCourtPositionType('bodyguard_court_position').GetName()] [nemesis.GetFirstNamePossessiveNoTooltip], [guard.GetTitledFirstName]."
 bp1_yearly.1031.a: "Teď už to všechno působí tak zbytečně, viď?"
 bp1_yearly.1031.b: "Dostal jsi, co sis zasloužil."
 bp1_yearly.1031.c: "#EMP Tak... tak... slabé...#!"
 bp1_yearly.1031.c.tt: "Nejdřív se ale budu muset zbavit stráže!"
 bp1_yearly.1031.c_killed_all: "Zabiješ [nemesis.GetShortUIName] i [GetCourtPositionType('bodyguard_court_position').GetName()] [guard.GetShortUIName]"
 bp1_yearly.1031.c_killed_all.tt: "Uspěješ!"
 bp1_yearly.1031.c_killed_guard: "[nemesis.GetShortUIName] pouze zraníš, ale [guard.GetShortUIName] zabiješ"
 bp1_yearly.1031.c_failed.tt: "Atentát se nezdaří!"
 bp1_yearly.1031.c_barely_saved_guard: "[nemesis.GetShortUIName] i [guard.GetShortUIName] pouze zraníš"
 bp1_yearly.1031.c_saved_guard: "[guard.GetShortUIName] tě zabije"
 bp1_yearly.1031.c_killed: "Zabiješ [nemesis.GetShortUIName]"
 bp1_yearly.1031.c_saved: "[nemesis.GetShortUIName] tě dokáže odrazit"
 bp1_yearly.1040.t: "Něco společného"
 bp1_yearly.1040.desc: "Spokojeně se vyhřívám v lázních a s [new_friend.GetTitledFirstName] probíráme hluboké myšlenky i lechtivé žerty. Když cítím, jak ze mě opadává veškeré napětí, uvědomím si, že mé svaly neuvolňuje jen teplá voda.\n\nOpravdu se bavím! A za všechno může společnost [new_friend.GetFirstNamePossessiveNoTooltip]."
 bp1_yearly.1040.desc_best_friend: "[new_friend.GetFirstNameNoTooltip] už mezi mé přátele patří, ale postupně si uvědomuji, jak moc se těším na každou společnou chvíli, jak vysoko si cením názoru [new_friend.GetFirstNameNoTooltip] a že každý okamžik strávený spolu je plný smíchu a vřelosti.\n\n[Select_CString(new_friend.IsFemale,'Stala se','Stal se')] [new_friend.GetFirstNameNoTooltip] mým #EMP nejlepším přítelem#!?"
 bp1_yearly.1040.desc_friend: "Dokud jsme neobjevili společnou vášeň pro lázně, neměli jsme příliš příležitostí se sblížit nebo se pořádně poznat. Teď se na naše pravidelná setkání v lázních skutečně těším, protože jsou vždy plná smíchu a veselí!\n\n[Select_CString(new_friend.IsFemale,'Stali jsme se opravdu přáteli','Stali jsme se opravdu přáteli')]?"
 bp1_yearly.1040.a: "Rozhodně! Připijme na [new_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.1040.b: "A co třeba něco #EMP víc#!?"
 bp1_yearly.1040.b.tt: "Každý ví, že nejlepší vztahy stojí na opravdovém přátelství!"
 bp1_yearly.1040.c: "[new_friend.GetFirstNameNoTooltip] se mi zase #EMP tolik#! nelíbí..."
 bp1_yearly.1050.t: "Otravná společnost"
 bp1_yearly.1050.desc: "Pohodlně se máčím v lázních a konečně si užívám zasloužený odpočinek, když mé poklidné myšlenky přeruší protivný hlas odněkud poblíž.\n\n„Viděli jste, co má...? A to #EMP směšně#! malé...?“ O kus dál zahlédnu [new_rival.GetTitledFirstName], jak dělá oplzlá gesta obklopená davem smějících se patolízalů. Nelze přehlédnout, že všichni zírají přímo na mě."
 bp1_yearly.1050.desc_nemesis: "\n\nA DOST!! Už mám těch nesmyslů [new_rival.GetFirstNameNoTooltip] po krk! [new_rival.GetFirstNameNoTooltip] mě trápí už příliš dlouho a teď mi chce zkazit dokonce i koupel?! V životě jsem [Select_CString(ROOT.Char.IsFemale,'nepotkala','nepotkal')] takového [new_rival.Custom2('InsultAdjective', ROOT.Char)] [new_rival.Custom2('InsultNoun', ROOT.Char)]! PROKLÍNÁM TĚ, [new_rival.GetFirstNameNoTooltip]!"
 bp1_yearly.1050.desc_rival: "\n\n[new_rival.GetFirstNameNoTooltip] téměř neznám, a přesto už mám pocit, že tu osobu nenávidím. Jak se mě #EMP opovažuje#! veřejně zesměšňovat?! Tuhle urážku nezapomenu..."
 bp1_yearly.1050.a: "[new_rival.GetFirstNameNoTooltip] za to zaplatí."
 bp1_yearly.1050.b: "Chci [new_rival.GetFirstNameNoTooltip] mrtvého. #EMP HNED#!."
 bp1_yearly.1050.c: "Možná to trochu přeháním..."
 bp1_yearly.1060.t: "Pověrčivá mysl"
 bp1_yearly.1060.desc: "Když jsem naposledy [Select_CString(ROOT.Char.IsFemale,'viděla','viděl')] [friend.GetTitledFirstName], [Select_CString(friend.IsFemale,'pokoušela se','pokoušel se')] nenápadně zbavit mého žlutého klobouku, protože prý „žlutá přináší lidem mého rodu smůlu“. Předtím jsem zase musel absolvovat směšně dlouhou zacházku, jen abychom se vyhnuli spící černé kočce. „Přináší smůlu!“ [Select_CString(friend.IsFemale,'tvrdila','tvrdil')]. A raději ani nechci vzpomínat na chvíli, kdy si [friend.GetFirstNameNoTooltip] #EMP [Select_CString(friend.IsFemale,'myslela','myslel')]#!, že ztratila svůj talisman pro štěstí!\n\nKdyž však přistihnu [friend.GetFirstNameNoTooltip], jak vyhazuje polovinu mé drahocenné soli jen proto, že se rozsypala, začíná mi docházet trpělivost..."
 bp1_yearly.1060.a: "Ale co když je to všechno #EMP pravda#!?"
 bp1_yearly.1060.b: "Ukážu ti, jak moc se mýlíš."
 bp1_yearly.1060.b_persuaded: "Přesvědčíš [friend.GetShortUIName], aby se vzdala svých pověr"
 bp1_yearly.1060.b_persuaded.tt: "[friend.GetShortUIName] se nechá přesvědčit!"
 bp1_yearly.1060.b_not_persuaded: "Tvé argumenty na [friend.GetShortUIName] nezapůsobí"
 bp1_yearly.1060.b_not_persuaded.tt: "[friend.GetShortUIName] se nenechá přesvědčit!"
 bp1_yearly.1060.b_you_persuaded: "[friend.GetShortUIName] obrátí situaci a přesvědčí tebe"
 bp1_yearly.1060.b_you_persuaded.tt: "[friend.GetShortUIName] změní tvůj názor!"
 bp1_yearly.1060.c: "#EMP Rouhačské pověry!#!"
 bp1_yearly.1060.d: "Nesmysl!"
 bp1_yearly.1070.t: "Smůlu, [rival.GetFirstNameNoTooltip]!"
 bp1_yearly.1070.desc: "Neuniklo mi, že ten opovrženíhodný [rival.GetTitledFirstName] je [Select_CString(rival.IsFemale,'velmi pověrčivá žena','velmi pověrčivý muž')]. Bojí se nešťastných dnů, barev, zvířat, a dokonce i stromů! Stačí ve špatnou chvíli zahlédnout stín nesprávného ptáka a [rival.GetFirstNameNoTooltip] může na celé dny propadnout panice.\n\nPřísné dodržování vlastních rituálů zřejmě přináší [rival.GetFirstNameNoTooltip] nezměrný pocit bezpečí, ale sebemenší odchylka může mít nepředvídatelně velký dopad na duševní klid. A toho bych mohl využít..."
 bp1_yearly.1070.a: "Možnosti jsou skutečně nekonečné..."
 bp1_yearly.1070.a.tt: "[Concept('scheme','Tato intrika')|E] získá dodatečný bonus k šanci na úspěch."
 bp1_yearly.1070.c: "Pořádně [rival.GetFirstNameNoTooltip] zamotám hlavu!"
 bp1_yearly.1070.d: "Tak hluboko neklesnu."
 bp1_yearly.1080.opening: "[relative.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.1080.desc: "Od chvíle, kdy jsem [Select_CString(relative.IsFemale,'vstoupila','vstoupil')] do manželství s odpornou osobou jménem [spouse.GetTitledFirstName], jsou mé dny naplněné jen utrpením."
 bp1_yearly.1080.intoxicated: "[spouse.GetFirstNameNoTooltip] je neustále [Select_CString(spouse.IsFemale,'opilá a sotva vnímá sama sebe','opilý a sotva vnímá sám sebe')]."
 bp1_yearly.1080.sexuality: "[spouse.GetFirstNameNoTooltip] se nijak netají svými nenasytnými sexuálními potřebami. Jen při pomyšlení na všechny ty zálety se červenám!"
 bp1_yearly.1080.violence: "[spouse.GetFirstNameNoTooltip] zřejmě nachází velké potěšení v utrpení ostatních. Dokonce i poddaní žijí ve strachu. Bojím se tu o vlastní bezpečí."
 bp1_yearly.1080.reclusive: "[spouse.GetFirstNameNoTooltip] nesnáší lidskou společnost, utíká před svými povinnostmi a opouští i mě. Připadám si, jako bych žil v manželství s duchem."
 bp1_yearly.1080.profligate: "Utrácení [spouse.GetFirstNameNoTooltip] nezná míru ani rozum. Panství neustále balancuje na pokraji bankrotu a my žijeme v nedůstojné chudobě!"
 bp1_yearly.1080.fallback: "Obávám se, že nepříjemnou povahu a odporné návyky [spouse.GetFirstNameNoTooltip] už dlouho nevydržím..."
 bp1_yearly.1080.ending: "Prosím, nezapomeň na svého oddaného [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('relative'))]."
 bp1_yearly.1080.a: "To je #EMP nehorázné#!!"
 bp1_yearly.1080.a.success: "Podaří se ti tajně dostat [relative.GetShortUIName] zpátky domů"
 bp1_yearly.1080.a.failure: "[relative.GetShortUIName] nedokáže uniknout"
 bp1_yearly.1080.a.failure.tt: "Útěk [relative.GetFirstNamePossessiveNoTooltip] selže"
 bp1_yearly.1080.b: "Kvůli tomu nemůžeme ohrozit spojenectví."
 bp1_yearly.1080.c: "Prosím, buď [Select_CString(relative.IsFemale,'trpělivá','trpělivý')]..."
 bp1_yearly.1080.d: "NEODPUSTITELNÉ!"
 bp1_yearly.1080.d.success: "Přesvědčíš [spouse.GetShortUIName], aby [Select_CString(spouse.IsFemale,'nechala','nechal')] [relative.GetShortUIName] odejít"
 bp1_yearly.1080.d.failure: "[spouse.GetShortUIName] tvé žádosti odmítne"
 bp1_yearly.1080.d.failure.tt: "[relative.GetFirstNameNoTooltip] [Select_CString(relative.IsFemale,'nebyla propuštěna','nebyl propuštěn')]"
 bp1_yearly.1081.t: "Vítej doma!"
 bp1_yearly.1081.desc: "Skoro nemohu uvěřit vlastním očím, když je můj milovaný [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('relative'))] [relative.GetTitledFirstName] konečně [Select_CString(relative.IsFemale,'přivedena','přiveden')] zpět do mého [ROOT.Char.Custom('GetRoom')]. Můj plán vyšel a [relative.GetFirstNameNoTooltip] je konečně mimo dosah toho [spouse.Custom2('InsultAdjective', ROOT.Char)] [spouse.Custom2('InsultNoun', ROOT.Char)] [spouse.GetTitledFirstName]!\n\nPokynu [relative.GetFirstNameNoTooltip], aby se ke mně [Select_CString(relative.IsFemale,'posadila','posadil')] k ohni, když si uvědomím, že manželství stále trvá... Napadá mě, zda s tím ještě mohu něco udělat, nebo zda bych se [Select_CString(ROOT.Char.IsFemale,'měla','měl')] spokojit s tím, že mám [relative.GetFirstNameNoTooltip] znovu po svém boku [Select_CString(relative.IsFemale,'živou a v bezpečí','živého a v bezpečí')]."
 bp1_yearly.1081.a: "Zařídíme rozvod, #EMP hned#!."
 bp1_yearly.1081.b: "Pověz mi o všem svém trápení..."
 bp1_yearly.1081.c: "Říkalo se #EMP dokud nás smrt nerozdělí#!, že...?"
 bp1_yearly.1082.desc: "Nedávno jsem [Select_CString(relative.IsFemale,'zjistila','zjistil')], že [Select_CString(spouse.IsFemale,'má manželka','můj manžel')] [spouse.GetFirstName] - ten [spouse.Custom2('InsultAdjective', SCOPE.sC('relative'))] [spouse.Custom2('InsultNoun', SCOPE.sC('relative'))] - skrývá další špinavé tajemství! [Select_CString(relative.IsFemale,'Nezapomněla','Nezapomněl')] jsem, že ses mi [Select_CString(ROOT.Char.IsFemale,'pokusila','pokusil')] pomoci uniknout z nešťastného manželství, a jako výraz své vděčnosti jsem se [Select_CString(relative.IsFemale,'rozhodla','rozhodl')] podělit se o něj s tebou. Není to mnoho, ale doufám, že ti bude k užitku."
 bp1_yearly.1082.a: "Výborně..."
