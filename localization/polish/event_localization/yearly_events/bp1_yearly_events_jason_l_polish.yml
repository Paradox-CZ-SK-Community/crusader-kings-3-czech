l_polish:
 bp1_yearly.0100.t: "Útočiště před bouří"
 bp1_yearly.0100.desc: "Obloha nevěstí nic dobrého a vítr skučí. Blíží se smršť!"
 bp1_yearly.0100.sedentary_traveller: "\n\nTento podivný kout země je plný nuzných chatrčí, špinavých a titěrných."
 bp1_yearly.0100.nomadic_traveller: "\n\nNež bouře udeří, tábor už postavit nestihneme."
 bp1_yearly.0100.sedentary_host: "Narazili jsme na osamělé, docela ucházející venkovské sídlo... jenže obydlí patří [Select_CString(host.IsFemale,'mé odporné','mému odpornému')] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('host'))] [host.GetFirstName].\n\nSílicí bouře mě nemilosrdně bičuje."
 bp1_yearly.0100.nomadic_host: "Naštěstí jsme narazili na pořádný tábor. Naneštěstí... uvnitř jsou lidé [Select_CString(host.IsFemale,'mé odporné','mého odporného')] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('host'))] [host.GetFirstName].\n\nSílicí bouře mě nemilosrdně bičuje."
 bp1_yearly.0100.lover_welcome: "Možná je [host.GetFirstNameNoTooltip] někde daleko? Možná se na mě usmálo štěstí a [Select_CString(host.IsFemale,'její','jeho')] [Select_CString(lover.IsFemale,'svůdná','svůdný')] [host.Custom2('RelationToMeShort', SCOPE.sC('lover'))] [lover.GetFirstName] je tu, aby mě [Select_CString(lover.IsFemale,'přivítala','přivítal')]?"
 bp1_yearly.0100.friend_welcome: "Možná je [host.GetFirstNameNoTooltip] někde daleko? Možná se na mě usmálo štěstí a [Select_CString(host.IsFemale,'její','jeho')] [befriend.Custom('ComplimentAdjective')] [host.Custom2('RelationToMeShort', SCOPE.sC('befriend'))] [befriend.GetFirstName] je tu, aby mě [Select_CString(befriend.IsFemale,'přivítala','přivítal')]?"
 bp1_yearly.0100.close: "Tak či onak... tohle bude dlouhá noc."
 bp1_yearly.0100.a: "Úsměvy, pánové!"
 bp1_yearly.0100.a.tt: "Čeká tě mizerné pohostinství..."
 bp1_yearly.0100.a_title: "Mizerná noc plná podezírání"
 bp1_yearly.0100.a.success_chance: "Všechny [Concept('schemes','intriky')|E] [host.GetShortUINameNoTooltip] namířené proti tobě získají 15 k [Concept('success_chance','šanci na úspěch')|E]"
 bp1_yearly.0100.b: "Možná právě tady se skrývají rodinná tajemství..."
 bp1_yearly.0100.b.tt: "Ukryješ se před bouří... a využiješ příležitosti trochu slídit"
 bp1_yearly.0100.b.tt_success: "Noc se vyplatí"
 bp1_yearly.0100.b.secrets: "Odhalíš [Concept('secret','tajemství')|E], které se týká [host.GetFirstName] nebo někoho z [Concept('family','rodiny')|E] této postavy"
 bp1_yearly.0100.b.tt_failure: "Žádné kostlivce ve skříni nenajdeš"
 bp1_yearly.0100.b.tt_crit_failure: "Přistihnou tě při slídění"
 bp1_yearly.0100.c: "Proč se svářit s [befriend.GetFirstNameNoTooltip]...?"
 bp1_yearly.0100.c.tt: "Při setkání s [befriend.GetTitledFirstName] ze sebe dokážeš vykřesat dobrou náladu"
 bp1_yearly.0100.c.tt_success: "S [befriend.GetTitledFirstName] se velmi sblížíš ([host.Custom2('RelationToMeShort', SCOPE.sC('befriend'))])"
 bp1_yearly.0100.c.tt_failure: "Tvůj šarm nezůstane bez odezvy"
 bp1_yearly.0100.c.tt_crit_failure: "Celou noc se jen hádáte"
 bp1_yearly.0100.d: "Není nad tajnou schůzku..."
 bp1_yearly.0100.d.tt: "[host.GetFirstNamePossessiveNoTooltip] [host.Custom2('RelationToMeShort', SCOPE.sC('lover'))] možná čeká uvnitř a nemůže se dočkat, až tě zbaví cestou zmačkaného oděvu..."
 bp1_yearly.0100.d.tt.success: "[lover.GetFirstNameNoTooltip] na tebe čeká"
 bp1_yearly.0100.d.tt.sex: "Ty a [lover.GetShortUINameNoTooltip] spolu skončíte v posteli"
 bp1_yearly.0100.d.tt_failure: "Noc o samotě"
 bp1_yearly.0100.d.tt_no_sex: "Po fascinující osobě [lover.GetShortUINameNoTooltip] není ani stopy"
 bp1_yearly.0100.e: "Úkryt si zajistíme meči."
 bp1_yearly.0100.e.tt: "Nasadit falešný úsměv? Kdepak, raději své hostitele svážeš"
 bp1_yearly.0100.e.wounded_chance: "O případném zranění rozhodne tvá [Concept('prowess','udatnost')|E]"
 bp1_yearly.0100.e.tt_success: "Pod příkrovem bouře tě nic nezastaví"
 bp1_yearly.0100.e.tt_failure: "Vyženou tě zpět do nečasu"
 bp1_yearly.0100.f: "I díra v zemi by byla lepší."
 bp1_yearly.0100.f.tt_success: "Nečas přečkáš... jen tak tak"
 bp1_yearly.0100.f.sick: "Můžeš získat [GetTrait('ill').GetName( GetNullCharacter )]"
 bp1_yearly.0100.f.tt_failure: "Noc je dlouhá. Bouře nemilosrdná"
 bp1_yearly.0100.f.very_sick: "Můžeš získat [GetTrait('pneumonic').GetName( GetNullCharacter )]"
 bp1_yearly.0101.t: "Bouře v divočině"
 bp1_yearly.0101.desc: "Pod vousy děkuji [ROOT.Char.GetFaith.FertilityGodName], že odporný [lover.Custom2('RelationToMeShort', SCOPE.sC('host'))] [lover.GetTitledFirstNamePossessive] zůstává daleko od tohoto skromného místa.\n\nZatímco bouře svádí boj s nebesy a její běsnění burácí všude kolem nás,"
 bp1_yearly.0101.gentle_flirt: "[lover.GetFirstNameNoTooltip] se ke mně s každým okamžikem tiskne blíž. Je ten strach jen hraný? V očích [lover.GetFirstNameNoTooltip], těsně za zdvořilým úsměvem, se cosi mihne. Ten pohled mi říká... ano."
 bp1_yearly.0101.protective_flirt: "[lover.GetFirstNameNoTooltip] se tváří sebejistě a ochranitelsky. Vděčně, téměř vyzývavě, se na [lover.GetFirstNameNoTooltip] usměju a zanedlouho... [lover.GetFirstNameNoTooltip] umlkne v opojení. [Select_CString(lover.IsFemale,'Je má.','Je můj.')]"
 bp1_yearly.0101.finish: "\n\nKout, kde se k sobě přitiskneme, je temný. Velmi temný. A přes burácení živlů není slyšet nic z toho, co spolu děláme, když se hladové tělo [lover.GetFirstNameNoTooltip] tiskne pod mé cestou potřísněné šaty.\n\nJediná slova, která mi přejdou přes rty, jsou kletbou na [lover.Custom2('RelationToMeShort', SCOPE.sC('host'))] [lover.GetFirstNameNoTooltip]. A právě v tu chvíli je mé vítězství úplné."
 bp1_yearly.0101.a: "Ale #EMP o tobě#! sním, [lover.GetFirstNameNoTooltip]!"
 bp1_yearly.0101.b: "Jediná, lahodná urážka."
 bp1_yearly.0102.opening: "[host.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 bp1_yearly.0102.desc: "[Select_CString(ROOT.Char.IsFemale,'Vyspala ses','Vyspal ses')] dobře? [Select_CString(ROOT.Char.IsFemale,'Užila sis','Užil sis')] noc plnou pohostinnosti mého lidu,"
 bp1_yearly.0102.desc_weak: "kdy sis [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] nechat odpočinout své vznešené nožky?"
 bp1_yearly.0102.desc_powerful: "kdy ses mohl oddávat snům o tom, že jsi na mém místě?"
 bp1_yearly.0102.uneventful_night: "\n\nPrý jsi [Select_CString(ROOT.Char.IsFemale,'nevychovaná, dotěrná a hnojem potřísněná žebračka','nevychovaný, dotěrný a hnojem potřísněný žebrák')] bez špetky šarmu."
 bp1_yearly.0102.failed_snoop: "\n\nI práva lenního pána mají své meze. [Select_CString(host.IsFemale,'Postarala','Postaral')] jsem se, aby všichni věděli, jak málo je respektuješ."
 bp1_yearly.0102.warm_welcome: "\n\nKéž bych tam [Select_CString(host.IsFemale,'byla a mohla','byl a mohl')] tě vyhodit. [befriend.GetTitledFirstName] [Select_CString(befriend.IsFemale,'měla','měl')] vždycky příšerný vkus."
 bp1_yearly.0102.cold_welcome: "\n\nTvůj hostitel [befriend.GetTitledFirstName] tě teď nenávidí stejně jako já. Srdce mi plesá."
 bp1_yearly.0102.erotic_welcome: "\n\n[Select_CString(host.IsFemale,'Kdybych tam byla, vyhodila','Kdybych tam byl, vyhodil')] bych tě hned po prvním odporném slovu, které jsi [Select_CString(ROOT.Char.IsFemale,'utrousila','utrousil')] k mému [host.Custom2('RelationToMeShort', SCOPE.sC('lover'))]. Ty hade."
 bp1_yearly.0102.attack_success: "\n\n[Select_CString(ROOT.Char.IsFemale,'Napadla','Napadl')] jsi mé muže jako vystrašené zvíře. Bez cti a bez zdvořilosti, přesně jak je tvým zvykem."
 bp1_yearly.0102.attack_fail: "\n\nNe? Ach ano. Ty ses nás vlastně #EMP [Select_CString(ROOT.Char.IsFemale,'pokusila','pokusil')]#! napadnout, ale vyhnali jsme tě zpátky do divočiny jako zvíře, kterým jsi. Byl to žalostný pokus."
 bp1_yearly.0102.close: "\n\nKéž tě příští bouře smete z povrchu zemského."
 bp1_yearly.0102.a: "Pořiď měkčí postele, ty [Select_CString(host.IsFemale,'buranko','burane')]!"
 bp1_yearly.0102.b: "Nebe není to, čeho by ses [Select_CString(host.IsFemale,'měla','měl')] bát, [host.GetFirstNameNoTooltip]..."
