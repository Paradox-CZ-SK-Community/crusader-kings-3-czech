 mpo_ariana_0050_greedy: "nenasytné"
 mpo_events_ariana.0050.a: "Nedovolím, aby bylo jméno mé rodiny poskvrněno."
 mpo_events_ariana.0050.a_tt: "Zaplatíš za očištění jména [criminal_family.GetFirstNameNoTooltip]"
