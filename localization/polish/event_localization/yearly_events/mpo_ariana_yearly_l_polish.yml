l_polish:
 mpo_events_ariana.0001.t: "Nález hnízda"
 mpo_events_ariana.0001.desc: "Cestou zpět do tábora zahlédnu malé hnízdo, ale po žádném ptáku není ani stopy. Je spletené z větviček a trávy a zdá se být v dobrém stavu.\n\nPři bližším pohledu uvnitř objevím dvě orlí mláďata. Jsou už dost velká, aby nějakou dobu přežila bez matky, ale stále příliš mladá na dlouhé lety krajinou. Příležitost"
 mpo_events_ariana.0001.desc_had_story: "znovu získat orla za společníka je lákavá, ale [Select_CString(ROOT.Char.IsFemale, 'musím být opatrná', 'musím být opatrný')], protože dobře vím, jak nevyzpytatelní tito tvorové dokážou být."
 mpo_events_ariana.0001.desc_has_eagle: "jedno z nich chytit, třeba jako dar pro někoho, se přímo nabízí."
 mpo_events_ariana.0001.desc_ending: "vzít si jedno z nich za společníka je příliš lákavá na to, [Select_CString(ROOT.Char.IsFemale, 'abych jí odolala', 'abych jí odolal')]."
 mpo_events_ariana.0001.a: "Dobrý orel za tu námahu stojí."
 mpo_events_ariana.0001.a_tt: "Vyšplháš na horu a pokusíš se orlí mláďata chytit silou"
 mpo_events_ariana.0001.a_win: "Úspěšně chytíš jedno orlí mládě, nebo obě"
 mpo_events_ariana.0001.a_win_desc: "Osud jednoho orlího mláděte, nebo obou, bude ve tvých rukou"
 mpo_events_ariana.0001.a_lose_ok: "Orlí mláďata se ti chytit nepodaří, ale vyvázneš bez úhony"
 mpo_events_ariana.0001.a_lose_bad: "Orlí mláďata se ti chytit nepodaří a při pádu se skutálíš kus po horském svahu"
 mpo_events_ariana.0001.b: "Pokud je nám to souzeno, přijdou ke mně sama."
 mpo_events_ariana.0001.b_win_desc: "Jedno nebo obě orlí mláďata přiletí k tobě"
 mpo_events_ariana.0001.c: "Jasné znamení."
 mpo_daydreaming_birds_modifier: "Snění o ptácích"
 mpo_daydreaming_birds_modifier_desc: "Této postavě není pohled na půvabné okřídlené tvory nijak cizí.\n*$hunt_type_falconry$* [Concept('hunt_success_chance','Šance na úspěch lovu')|E]: #P +5%#!"
 hunt_success_chance.mpo_daydreaming_birds_modifier: "[GetModifier('mpo_daydreaming_birds_modifier').GetNameWithTooltip]"
 mpo_events_ariana.0002.desc_intro: "Orlí mláďata začínají být neklidná. Z hnízda odejdou buď se mnou, nebo v pařátech jiného dravce.\n\n"
 mpo_events_ariana.0002.desc_standard: "Od hnízda sestupuji pomalu a opatrně. Mláďata jsou ještě příliš mladá na dlouhý let, ale rozhodně ne příliš mladá na to, aby byla nebezpečná.\n\n"
 mpo_events_ariana.0002.desc_one_standard: "Noha mi uklouzne na trávě, ale podaří se mi zachytit. Jedno z mláďat si mého zápasu všimne, začne křičet, samo se poleká a odletí pryč. [ROOT.Char.Custom('CulturalCurse')|U]! [Select_CString(ROOT.Char.IsFemale, 'Obě jsem sice nezískala', 'Obě jsem sice nezískal')], ale jedno je pořád lepší než vrátit se s prázdnou."
 mpo_events_ariana.0002.desc_both_standard: "Vytrhnu obě mláďata z hnízda, pevně je sevřu a přes oči jim přehodím kus látky. Jejich váha mi sestup nijak neusnadňuje, ale [Select_CString(ROOT.Char.IsFemale, 'žádná legendární lovkyně orlů se neobešla bez svých břemen', 'žádný legendární lovec orlů se neobešel bez svých břemen')]."
 mpo_events_ariana.0002.desc_lure: "V ruce držím kus masa a lákám orlí mláďata k sobě. Odpovídají křikem a i na tu dálku vidím, jak v nich vzplanula zvědavost.\n\n"
 mpo_events_ariana.0002.desc_one_lure: "Ke mně se odváží jen jedno, zatímco druhé zřejmě dává přednost bezpečí hnízda. Vezmu mládě do náruče a ono se s nenasytnou chutí okamžitě pustí do nabídnutého masa."
 mpo_events_ariana.0002.desc_both_lure: "Rozdělím maso na dva kusy a nabídnu každému jeden. Obě mláďata zakřičí jako na povel a při tom pohledu se neubráním úsměvu."
 mpo_events_ariana.0002.a: "Je nádherné a bude moje."
 mpo_events_ariana.0002.b: "[eagle_first_recipient.GetFirstNameNoTooltip] by [Select_CString(eagle_first_recipient.IsFemale, 'takového tvora mohla ocenit', 'takového tvora mohl ocenit')]."
 mpo_events_ariana.0002.c: "Myslím, že [eagle_second_recipient.GetFirstNameNoTooltip] by [Select_CString(eagle_second_recipient.IsFemale, 'ho ocenila ještě víc', 'ho ocenil ještě víc')]."
 mpo_events_ariana.0002.b_two: "Jedno si nechám a druhé dostane [eagle_first_recipient.GetFirstNameNoTooltip]."
 mpo_events_ariana.0002.c_two: "Jedno bude moje. Možná by o to druhé [eagle_second_recipient.GetFirstNameNoTooltip] [Select_CString(eagle_second_recipient.IsFemale, 'stála', 'stál')]?"
 mpo_events_ariana.0002.d: "[eagle_first_recipient.GetFirstNameNoTooltip] i [eagle_second_recipient.GetFirstNameNoTooltip] si takový dar zaslouží."
 mpo_events_ariana.0002.e: "Jedno bude mým společníkem a druhé mi naplní měšec."
 mpo_events_ariana.0002.e_sell_first: "[eagle_first_recipient.GetFirstNameNoTooltip] dostane jedno a za druhé se mi naplní měšec."
 mpo_events_ariana.0002.e_sell_second: "Jedno na trh a druhé pro [eagle_second_recipient.GetFirstNameNoTooltip]."
 mpo_events_ariana.0002.e_tt: "Druhé orlí mládě prodáš"
 mpo_events_ariana.0002.f_tt: "Orlí mládě prodáš"
 mpo_events_ariana.0002.f_tt_two: "Obě orlí mláďata prodáš"
 mpo_events_ariana.0002.f_one: "Vynese pěknou cenu."
 mpo_events_ariana.0002.f_two: "Vynesou pěknou cenu."
 mpo_events_ariana.0010.t: "Oheň v nitru"
 mpo_events_ariana.0010.desc: "„[converting_heir.Custom2('RelationToMe', ROOT.Char)|U],“ zašeptá [ROOT.Char.Custom2('RelationToMeShort', converting_heir)] [converting_heir.GetName] a pokyne mi blíž. „Má cesta vede tam, kam ukazuje [new_faith.HighGodName|U],“ pokračuje. \n\n„A nyní je mou cestou [new_faith.GetName]. Už dlouho to tak cítím a nemohu to dál dusit v sobě. Vím, že máš své pochybnosti, ale prosím, přidej se ke mně a k mnoha dalším v [ROOT.Char.GetPrimaryTitle.GetTierAsName], kteří si říkají [new_faith.GetAdherentNamePluralNoTooltip]. Pomohu ti pochopit, co skutečně znamená označení „[new_faith.GetAdherentNameNoTooltip]“, a společně dojdeme tam, kde nás čeká [new_faith.PositiveAfterLife].“\n\n[converting_heir.GetFirstNameNoTooltip] se na mě zadívá s očima planoucíma horlivostí, sevře mou ruku a čeká na odpověď."
 mpo_events_ariana.0010.desc_zealous: "Dělá si ze mě [converting_heir.GetFirstNameNoTooltip] legraci? Jak si vůbec může myslet, že mě někdy bude vystihovat označení „[new_faith.GetAdherentNameNoTooltip]“?!"
 mpo_events_ariana.0010.a: "[converting_heir.GetFirstNameNoTooltip], [Select_CString(converting_heir.IsFemale, 'nebudeš na to sama', 'nebudeš na to sám')]."
 mpo_events_ariana.0010.a_zealous: "[Select_CString(ROOT.Char.IsFemale, 'Možná jsem příliš přísná', 'Možná jsem příliš přísný')] a [converting_heir.GetFirstNameNoTooltip] má pravdu."
 mpo_events_ariana.0010.b: "Ve všem kromě jména mě vystihuje označení „[old_faith.GetAdherentNameNoTooltip]“."
 mpo_events_ariana.0010.b_zealous: "Tentokrát ti vyhovím, [converting_heir.GetFirstNameNoTooltip]."
 mpo_events_ariana.0010.b.tt: "Navenek se tvým vyznáním stane [new_faith.GetName], ale v tajnosti bude tvým skutečným vyznáním dál [old_faith.GetName]."
 mpo_events_ariana.0010.c: "Promiň, ale tohle nedokážu."
 mpo_events_ariana.0010.c_cynical: "Náboženství je osobní věc, [converting_heir.GetFirstNameNoTooltip]."
 mpo_events_ariana.0010.c_zealous: "[old_faith.GetName] je cesta, kterou nikdy neopustím!"
 mpo_events_ariana.0010.d: "[old_faith.PositiveAfterLife|U] nečeká nikoho, kdo si říká [new_faith.GetAdherentNameNoTooltip|U]."
 mpo_events_ariana.0010.d_tt: "Pokusíš se [converting_heir.GetNameNoTooltip] přesvědčit, že [old_faith.GetName] je cesta, které se má držet."
 mpo_events_ariana.0010.d_success: "[converting_heir.GetFirstNameNoTooltip] znovu zváží konverzi"
 mpo_events_ariana.0010.d_failure: "[converting_heir.GetFirstNameNoTooltip] na svém rozhodnutí neochvějně trvá a novou cestou se stane [new_faith.GetName]"
 mpo_events_ariana.0020.t: "Nedůvěra"
 mpo_events_ariana.0020.desc_intro: "[worried_spouse.GetName] vpadne do mé komnaty a bez okolků vyhrkne: „Věděl[Select_CString(ROOT.Char.IsFemale, 'a jsi', ' jsi')], že [sus_councillor.GetName] pochází z [councillor_culture.GetName] kultury?“\n\nNež vůbec stačím dát dohromady odpověď, pokračuje: „Nedokážu pochopit,"
 mpo_events_ariana.0020.desc_marshal: "jak může mé vojsko vést někdo z [councillor_culture.GetNameNoTooltip] kultury. Mnohem raději bych [Select_CString(worried_spouse.IsFemale, 'stála', 'stál')] na opačné straně bojiště. A přesto se [sus_councillor.GetFirstNameNoTooltip] volně prochází po našem cvičišti?“"
 mpo_events_ariana.0020.desc_spymaster: "jak můžeme do svého kruhu pustit někoho z [councillor_culture.GetNameNoTooltip] kultury, kdo pořád něco kuje, natož mu svěřovat naše špehování. Spíš bych [Select_CString(worried_spouse.IsFemale, 'věřila', 'věřil')] hadovi než [sus_councillor.GetFirstNameNoTooltip].“"
 mpo_events_ariana.0020.desc_end: "Ačkoli [worried_spouse.GetFirstNamePossessiveNoTooltip] výstupy působí značně přehnaně, je známo, že někteří [councillor_culture.GetCollectiveNounNoTooltip] [sus_councillor.Custom('mpo_yearly_ethos')]\n\n„Prosím...“ naříká [worried_spouse.GetFirstNameNoTooltip]. „Nedovol, aby [sus_councillor.GetFirstNameNoTooltip] v našich síních dál pokračoval[Select_CString(sus_councillor.IsFemale, 'a', '')] v tomhle chování, [sus_councillor.Custom2('InsultBehavior', SCOPE.sC('worried_spouse'))]. Nikdo neví, co může provést.“"
 mpo_yearly_bellicose: "jednají až příliš zbrkle a ženou se za pomstou, i když možná ani není za co se mstít."
 mpo_yearly_stoic: "by neuronili ani slzu, kdyby zemřel někdo z jejich vlastní rodiny."
 mpo_yearly_bureaucratic: "se starají mnohem víc o svitky a knihy než o to, zda jejich vlastní [sus_councillor.GetCulture.GetCollectiveNounNoTooltip] přežijí."
 mpo_yearly_spiritual: "dokážou bezohledně zacházet s druhými, pokud věří, že si to žádá [sus_councillor.GetFaith.HighGodName]."
 mpo_yearly_courtly: "dávají přednost lezení do cizího zadku před prací v polích a horách, která zajišťuje přežití."
 mpo_yearly_egalitarian: "bez váhání přijímají cizince a za pár tisíciletí by jejich kultura nejspíš úplně zmizela."
 mpo_yearly_communal: "jednají jako jedna mysl a jejich neschopnost samostatného jednání je znepokojivá."
 mpo_events_ariana.0020.a: "Máš pravdu, [worried_spouse.GetFirstNameNoTooltip]. [sus_councillor.GetFirstNameNoTooltip] bude zítra pryč!"
 mpo_events_ariana.0020.a_tt: "Všichni [Concept('vassals','vazalové')|E] z [councillor_culture.GetName] kultury:\n$EFFECT_LIST_BULLET$Jejich [Concept('opinion','mínění')|E] o #V tobě#! se sníží o #n 10#!"
 mpo_events_ariana.0020.b: "Asi bych si měl[Select_CString(ROOT.Char.IsFemale, 'a dávat', ' dávat')] na lidi z [councillor_culture.GetNameNoTooltip] kultury větší pozor."
 mpo_events_ariana.0020.c: "Na [sus_councillor.GetFirstNameNoTooltip] ani na nikom z [councillor_culture.GetNameNoTooltip] kultury není nic podezřelého."
 mpo_events_ariana.0020.c_paranoid: "Tvá paranoia mě neovlivní."
 mpo_events_ariana.0020.c_tt: "Všichni [Concept('vassals','vazalové')|E] z [councillor_culture.GetName] kultury:\n$EFFECT_LIST_BULLET$Jejich [Concept('opinion','mínění')|E] o #V tobě#! se zvýší o #p 10#!"
 cultural_suspicion_modifier: "Kulturní podezřívavost"
 cultural_suspicion_modifier_desc: "Tato postava nemá příliš v lásce cizince ve svém panství."
 mpo_events_ariana.0030.t: "Zakázané pití"
 mpo_events_ariana.0030.desc: "„Misky s [Glossary( 'kumis', 'KUMIS_GLOSS')] na našem shromáždění jsou už úplně prázdné, [ROOT.Char.GetTitleAsNameNoTooltip]...“ stěžuje si [spymaster.GetName]. „Ale alespoň vím, kdo za tím suchem stojí.“ [spymaster.GetFirstNameNoTooltip] ukáže na [bartender.GetName], [Select_CString(bartender.IsFemale, 'která právě směňuje pohár kvašeného kobylího mléka s jiným neurozeným', 'který právě směňuje pohár kvašeného kobylího mléka s jiným neurozeným')].\n\n„Přece nenecháš naše hosty bez pití, že ne? [ROOT.Char.GetPrimaryTitle.GetNameNoTier] přece hostí samé velké pány a dámy a právě pro ně byl nápoj připraven.“ [spymaster.GetFirstNameNoTooltip] se na mě obrátí s potutelným úsměvem."
 mpo_events_ariana.0030.jail: "Uvidíme, kolik si vydělá z cely."
 mpo_events_ariana.0030.jail_tt: "Každý [Concept('activity_attending','přítomný host')|E] z [Concept('dynasty','urozené dynastie')|E]:\n$EFFECT_LIST_BULLET$Jeho [Concept('opinion','mínění')|E] o #V tobě#! se zvýší o #p 10#!"
 mpo_events_ariana.0030.jail_effect: "Potrestáš [bartender.GetNameNoTooltip] za prohřešek"
 mpo_events_ariana.0030.ignore: "Ať pijí i poddaní!"
 mpo_events_ariana.0030.ignore_tt: "Každý [Concept('activity_attending','přítomný host')|E] z [Concept('dynasty','urozené dynastie')|E]:\n$EFFECT_LIST_BULLET$Jeho [Concept('opinion','mínění')|E] o #V tobě#! se sníží o #n 10#!"
 mpo_events_ariana.0030.ignore_effect: "Dovolíš [bartender.GetNameNoTooltip] dál obsluhovat neurozené"
 mpo_events_ariana.0030.ignore_tt_lowborn: "Každý [Concept('lowborn','neurozený')|E] [Concept('activity_attending','přítomný host')|E]:\n$EFFECT_LIST_BULLET$Jeho [Concept('opinion','mínění')|E] o #V tobě#! se zvýší o #p 10#!"
 mpo_events_ariana.0030.greedy: "Hosté? Ať pijí vodu."
 mpo_events_ariana.0030.greedy_tt: "Část zisku [bartender.GetNameNoTooltip] si vezmeš pro sebe"
 kumi_tax_modifier: "Daň z nápojů"
 kumi_tax_modifier_desc: "Tato postava využila výnosné obchodní příležitosti během nedávné hostiny."
 buzzed_peasants_county_modifier: "Spokojení poddaní"
 buzzed_peasants_county_modifier_desc: "Neurození v tomto hrabství jsou s nedávnými oslavami velmi spokojeni."
 mpo_events_ariana.0040.title_feast: "Hostina, na kterou se nezapomíná"
 mpo_events_ariana.0040.title_wedding: "Svatební maškaráda"
 mpo_events_ariana.0040.title_camp_party: "Za stanem"
 mpo_events_ariana.0040.desc_wedding_feast: "Sál je ponořený do přítmí, vzduchem zní smích a line se vůně [ROOT.Char.Custom('GetExpensiveMeal')]. Další část oslav má zahalit hosty i pořadatele tajemstvím a vzrušením, a tak si pečlivě nasadím masku, aby mě nebylo možné poznat, a přidám se k tanci a veselí. Jak oslavy pokračují, mou pozornost upoutá tajemná postava. Tvář [masked_guest.GetFirstNameNoTooltip] skrývá propracovaná maska znázorňující [ROOT.Char.Custom('GetRandomRegionalBird')]. [masked_guest.GetFirstNameNoTooltip] mi pokyne, ať přijdu blíž, a já tomu vábení nedokážu odolat.\n\nNetrvá dlouho a náš rozhovor získá smyslnější nádech. Nemohu se ubránit pocitu, že mezi námi vzniká něco, co přesahuje tajemství masky. [masked_guest.GetFirstNameNoTooltip] si mě přitáhne do vřelého objetí a naznačí, že bychom se mohli přesunout někam do soukromí."
 mpo_events_ariana.0040.desc_camp_party: "Tábor žije hudbou a smíchem a [talker.GetName] navrhne, abychom si zahráli na schovávanou. Málem vyprsknu smíchy, ale pak mi dojde, že to myslí vážně. Zanedlouho už se krčím za stanem. Když zaslechnu blížící se kroky, vyrazím ze svého úkrytu a prchám hlouběji do divočiny. Možná se na mně podepsalo pití, ale ztratím se v lese a noc je temná. Brzy do někoho vrazím a zaslechnu úlevný povzdech. „Ach, [Select_CString(masked_guest.IsFemale, 'myslela jsem, že tu bloudím sama', 'myslel jsem, že tu bloudím sám')],“ vydechne [masked_guest.GetFirstNameNoTooltip]. „Měli bychom zůstat spolu, nemyslíš?“\n\nPo nějaké době bloudění se náš rozhovor stočí daleko za hranice běžných zdvořilostí. Přede mnou stojí [masked_guest.Custom('WomanManGirlBoy')], tvář však halí tma. Přesto mě k té tajemné postavě něco táhne. [masked_guest.GetFirstNameNoTooltip] si mě přitáhne blíž a navrhne, abychom v našem dobrodružství pokračovali, až se vrátíme do tábora."
 mpo_events_ariana.0040.a: "Mám chuť na dobrodružství..."
 mpo_events_ariana.0040.a_tt: "Pozvání, které nabízí [masked_guest.GetFirstNameNoTooltip], přijmeš"
 mpo_events_ariana.0040.b: "Tentokrát vynechám."
 mpo_events_ariana.0041.title: "Obnaženo"
 mpo_events_ariana.0041.desc_wedding_feast: "Z oslavy se nenápadně vytratíme, [masked_guest.Custom('WomanManGirlBoy')] i já, a [masked_guest.GetFirstNameNoTooltip] odhodí masku na zem. Měsíční světlo proniká oknem a zalévá tvář [masked_guest.GetFirstNameNoTooltip] jemnou září,"
 mpo_events_ariana.0041.desc_camp_party: "Společně se vracíme do tábora a zdá se, že všichni ostatní už se uložili k spánku. [masked_guest.Custom('WomanManGirlBoy')|U] kráčí vedle mě. Táborový oheň během naší nepřítomnosti téměř vyhasl a znovu nás obklopuje tma. Popadnu kus chrastí a přihodím ho do ohně. Plameny ozáří tvář [masked_guest.GetFirstNameNoTooltip]."
 mpo_events_ariana.0041.desc_middle: "\n\nLehkost a sladké napětí okamžiku náhle zadusí tíživé ticho, když mi dojde, že přede mnou stojí"
 mpo_events_ariana.0041.desc_rival: "má životní pohroma, [masked_guest.GetName]!"
 mpo_events_ariana.0041.desc_family: "někdo z mé vlastní krve, [masked_guest.GetName]..."
 mpo_events_ariana.0041.desc_family_spouse: "manželský protějšek někoho z mé vlastní krve, [masked_guest.GetName]..."
 mpo_events_ariana.0041.desc_rival_spouse: "manželský protějšek mého rivala [masked_guest_spouse.GetName], [masked_guest.GetName]!"
 mpo_events_ariana.0041.desc_outro: "Ačkoli je [masked_guest.GetFirstNameNoTooltip] očividně stejně [Select_CString(masked_guest.IsFemale, 'překvapená jako já', 'překvapený jako já')], rychle se vzpamatuje. Na rtech se objeví úšklebek a zazní tichý šepot: „Na tuhle chvíli čekám už dlouho, [ROOT.Char.GetFirstNameNoTooltip].“"
 mpo_events_ariana.0041.desc_family_outro: "Slyšet taková slova od někoho, koho označuji jako [ROOT.Char.Custom2('RelationToMeShort', masked_guest)]..."
 mpo_events_ariana.0041.a_rival: "Nebezpečná hra, ale budu hrát."
 mpo_events_ariana.0041.a_family: "Na tom poznat vlastní rodinu trochu důvěrněji přece není nic špatného."
 mpo_events_ariana.0041.a_rival_spouse: "Už jen proto, abych [masked_guest_spouse.GetFirstName] uškodil[Select_CString(ROOT.Char.IsFemale, 'a', '')]..."
 mpo_events_ariana.0041.a: "Přijímám tvou nabídku..."
 mpo_events_ariana.0041.b_rival: "Spojovala nás nenávist, teď nás spojí i srdce!"
