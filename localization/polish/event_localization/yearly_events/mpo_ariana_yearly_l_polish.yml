 mpo_events_ariana.0060.t: "Hnízdo plné pokladů"
 mpo_events_ariana.0060.desc: "[Select_CString(appropriate_child.IsFemale, 'Má', 'Můj')] [ROOT.Char.Custom2('RelationToMeShort', appropriate_child)] [appropriate_child.GetName] ke mně přiběhne [Select_CString(appropriate_child.IsFemale, 'celá rozrušená', 'celý rozrušený')] a než se vůbec stačím zeptat, co se děje, vloží mi do ruky malý třpytivý předmět. „Podívej, co jsem [Select_CString(appropriate_child.IsFemale, 'našla', 'našel')]!“ vykřikne. „Vypadlo to z orlího hnízda a myslím, že je to poklad!“ \n\nPředmět si prohlédnu a skutečně jde o malou zlatou cetku. Velkou cenu nemá, ale je zřejmé, že [appropriate_child.GetFirstNameNoTooltip] je na sebe [Select_CString(appropriate_child.IsFemale, 'náležitě pyšná', 'náležitě pyšný')].\n\n„Chceš, abych tě k tomu hnízdu [Select_CString(appropriate_child.IsFemale, 'zavedla', 'zavedl')]?“ zeptá se. „Možná tam toho bude víc.“"
 mpo_events_ariana.0060.a: "Určitě tam dokážu vyšplhat."
 mpo_events_ariana.0060.a_tt: "Pokusíš se vyšplhat k hnízdu a najít další poklady"
 mpo_events_ariana.0060.success: "Úspěšně se dostaneš k hnízdu"
 mpo_events_ariana.0060.success_tt: "Uvnitř najdeš skrýš plnou pokladů"
 mpo_events_ariana.0010.failure: "K hnízdu se ti nepodaří dostat"
 mpo_events_ariana.0010.a_failure: "Spadneš a k hnízdu se ti nepodaří dostat"
 mpo_events_ariana.0060.b: "Půjdu, ale musíš být potichu."
 mpo_events_ariana.0060.b_tt: "Pokusíš se dostat k hnízdu, aniž bys vyrušil orla"
 mpo_events_ariana.0010.b_failure: "Vyplašíš orla a k hnízdu se ti nepodaří dostat"
 mpo_events_ariana.0060.d: "To je hezké, [appropriate_child.GetFirstNameNoTooltip]."
 mpo_events_ariana.0070.desc: "Dostanu se až k hnízdu a uvnitř objevím orlí mládě a malý váček. „Aha, tak odtud ten poklad nejspíš pochází,“ zašeptá [appropriate_child.GetFirstName]. [appropriate_child.GetFirstNameNoTooltip] na mě hledí s očima dokořán a skoro vidím, jak se [Select_CString(appropriate_child.IsFemale, 'jí v hlavě honí jedna myšlenka za druhou', 'mu v hlavě honí jedna myšlenka za druhou')].\n\n„Kde je jeho matka?“ zeptá se. „Měli bychom odejít, než se vrátí.“ Souhlasně přikývnu, ale než vyrazíme, ještě se podívám, co si odsud mohu odnést."
 mpo_events_ariana.0070.a: "Vezmu si poklad, kvůli kterému jsem přišel[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 mpo_events_ariana.0070.a_tt: "Otevřeš váček"
 mpo_events_ariana.0070.a_trinket: "Najdeš záhadnou cetku"
 mpo_events_ariana.0070.a_none: "Nenajdeš nic cenného"
 mpo_events_ariana.0070.a_great: "Váček je plný zlata a drahokamů"
 mpo_events_ariana.0070.a_good: "Ve váčku je několik mincí a cetek"
 mpo_events_ariana.0070.b: "Tohle orlí mládě bude mou odměnou."
 mpo_events_ariana.0070.b_self: "Vezmeš orlí mládě s sebou"
 mpo_events_ariana.0070.b_child: "Dáš orlí mládě [appropriate_child.GetFirstNameNoTooltip]"
 mpo_events_ariana.0070.c: "Patří i tobě, [appropriate_child.GetFirstNameNoTooltip]."
 mpo_events_ariana.0070.c_tt: "Otevřeš váček a o jeho obsah se podělíš s [appropriate_child.GetFirstNameNoTooltip]"
 mpo_events_ariana.0070.c_none_tt: "Vrátíš [appropriate_child.GetFirstNameNoTooltip] původní poklad"
 mpo_events_ariana.0070.d: "Musíme respektovat orlí domov."
 mpo_events_ariana.0070.d_tt: "Odejdeš s prázdnou"
 mpo_events_ariana.0080.t: "Kouzelný strom"
 mpo_events_ariana.0080.desc: "„[ROOT.Char.GetTitledFirstName], můj [tree_lover.Custom2('RelationToMeShort', ROOT.Char)], tohle musíš slyšet!“ vykřikne [tree_lover.GetName] a pokyne mi blíž.\n\n„Slyšel[Select_CString(tree_lover.IsFemale, 'a jsem', ' jsem')] o stromu, který se nepodobá žádnému jinému. Říká se, že má zvláštní moc, a někteří dokonce tvrdí, že mu požehnání udělil [ROOT.Char.GetFaith.HighGodName] a díky tomu dokáže plnit přání. Myslím, že nastal čas ho najít a zjistit, zda jsou ty pověsti pravdivé. [tree_barony.GetName] je místo, kde údajně roste, pokud tě to zaujalo.“\n\n[tree_barony.GetNameNoTooltip]? To je pořádná cesta, ale pokud existuje byť jen možnost, že je ten strom skutečný, musím to zjistit."
 mpo_events_ariana.0080.a: "Přiveď mi ten strom."
 mpo_events_ariana.0080.a_tt: "Pošleš [tree_lover.GetFirstNameNoTooltip] hledat kouzelný strom a přivést ho k tobě"
 mpo_events_ariana.0080.b: "Musím ho vidět na vlastní oči."
 mpo_events_ariana.0080.b_arrogant: "K nalezení obyčejné rostliny nikoho nepotřebuji."
 mpo_events_ariana.0080.b_tt: "Vydáš se na cestu. [tree_barony.GetName] je místo, kde hodláš kouzelný strom najít"
 mpo_events_ariana.0080.c_sus: "[tree_lover.GetFirstNameNoTooltip] mě chce vlákat do pasti!"
 mpo_events_ariana.0080.c: "Proč ztrácet čas pohádkami?"
 mpo_events_ariana.0080.c_flavor: "Nevěnuješ pozornost blouznění [tree_lover.GetFirstNameNoTooltip]"
 mpo_events_ariana.0081.desc_self: "[tree_barony.GetName]! Konečně jsem na místě, o kterém mluvil[Select_CString(tree_lover.IsFemale, 'a', '')] [tree_lover.GetFirstName]. Na mýtině přede mnou stojí strom, který vyzařuje jemné zlatavé teplo."
 mpo_events_ariana.0081.desc_guy: "Od posledního rozhovoru s [tree_lover.GetName] už uplynula nějaká doba. Často na [Select_CString(tree_lover.IsFemale, 'ni', 'něj')] myslím a přemítám, zda už [Select_CString(tree_lover.IsFemale, 'našla strom, o kterém mluvila', 'našel strom, o kterém mluvil')]. Právě když se chystám tu myšlenku pustit z hlavy,"
 mpo_events_ariana.0081.desc: "[tree_lover.GetFirstNameNoTooltip] se přede mnou objeví se širokým úsměvem. Zavede mě na nádvoří, kde se k nebi hrdě tyčí čerstvě zasazený strom.\n\n"
 mpo_events_ariana.0081.desc_dead: "[tree_giver.GetName] se přede mnou objeví se zachmuřeným výrazem a zavede mě na nádvoří, kde se k nebi hrdě tyčí čerstvě zasazený strom. „[tree_lover.GetName] [Select_CString(tree_lover.IsFemale, 'měla pravdu', 'měl pravdu')],“ pronese [tree_giver.GetFirstNameNoTooltip]. „Jen bych si přál[Select_CString(tree_giver.IsFemale, 'a', '')], aby ti ho [tree_lover.GetFirstNameNoTooltip] mohl[Select_CString(tree_lover.IsFemale, 'a předat sama', ' předat sám')].“\n\n"
 mpo_events_ariana.0081.desc_outro: "Při tom pohledu jen žasnu, už proto, že se legenda skutečně ukázala být pravdivou. Listy se třpytí ve slunečním světle a půvabně snášejí k zemi. Paprsky pronikající větvemi mi kreslí po kůži zářivé obrazce a uprostřed všeho toho úžasu znovu pomyslím na [tree_lover.GetFirstNameNoTooltip]. Vybavím si také údajnou schopnost stromu plnit přání. Zavřu oči a v duchu vyslovím prosbu."
 mpo_events_ariana.0081.a: "Přeji si, aby má země i můj rod vzkvétaly."
 mpo_events_ariana.0081.b: "Přeji si sílu porazit své nepřátele."
 mpo_events_ariana.0081.c: "Přeji si moudrost a jasnou mysl."
 mpo_events_ariana.0081.wish: "Vyslovíš své přání"
 mpo_events_ariana.0081.success: "Tvé přání se splní"
 mpo_events_ariana.0081.failure: "Tvé přání zůstane nevyslyšeno"
 mpo_magical_tree_fertility_modifier: "Požehnání plodnosti"
 mpo_magical_tree_fertility_modifier_desc: "Požehnání kouzelného stromu přineslo této postavě blahobyt jejím zemím a početné potomstvo."
 mpo_magical_tree_power_modifier: "Požehnání síly"
 mpo_magical_tree_power_modifier_desc: "Požehnání kouzelného stromu propůjčilo této postavě větší sílu v boji."
 mpo_magical_tree_wisdom_modifier: "Požehnání moudrosti"
 mpo_magical_tree_wisdom_modifier_desc: "Požehnání kouzelného stromu obdařilo tuto postavu moudrostí přesahující její věk."
 mpo_magical_tree_modifier: "Utišení"
 mpo_magical_tree_modifier_desc: "Pohled na kouzelný strom tuto postavu uklidnil."
 mpo_events_ariana.0090.t: "Vlněné ambice"
 mpo_events_ariana.0090.desc: "Po nějaké době strávené na pastvinách s pastevci se [child.GetFirstName] vrátí do jurty s úsměvem na tváři.\n\n"
 mpo_events_ariana.0090.desc_younger: "„Chci být [Select_CString(child.IsFemale, 'pastýřkou', 'pastýřem')], [child.Custom2('RelationToMeShort', ROOT.Char)]!“ vykřikne [child.GetFirstNameNoTooltip]. „Můžu trávit celý den s ovcemi a podívej, jak jsou šťastné. Život, jaký vede [ROOT.Char.GetTitleAsNameNoTooltip], zní nudně!“\n\n[child.GetFirstNameNoTooltip] mi podá čerstvě ostříhaný chomáč vlny. Je hrubý a špinavý, ale v očích dítěte jasně vidím hrdost."
 mpo_events_ariana.0090.desc_older: "„Chci pást ovce, ne žít jako [ROOT.Char.GetTitleAsNameNoTooltip], [child.Custom2('RelationToMeShort', ROOT.Char)],“ vykřikne [child.GetFirstNameNoTooltip]. „Jejich život se zdá tak prostý, bez starostí s válkami a vládnutím.“\n\n[child.GetFirstNameNoTooltip] mi podá čerstvě ostříhaný chomáč vlny. Je hrubý a špinavý, ale z každého slova cítím opravdové nadšení."
 mpo_events_ariana.0090.a: "Je moudré poznat život pastevců."
 mpo_events_ariana.0090.a_flavor: "Sen, který má [child.GetFirstNameNoTooltip], není špatný, byť je prostý."
 mpo_events_ariana.0090.b: "Tvůj odkaz musí být větší než odkaz obyčejného pastevce!"
 mpo_events_ariana.0090.c: "Život pastevců není tak jednoduchý, jak se zdá."
 mpo_events_ariana.0090.c_duel: "[child.GetFirstNameNoTooltip] je [Select_CString(child.IsFemale, 'poslána pracovat na pastviny', 'poslán pracovat na pastviny')]"
 mpo_events_ariana.0090.c_1: "[child.GetFirstNameNoTooltip] si začne vážit tvrdé práce"
 mpo_events_ariana.0090.c_2: "[child.GetFirstNameNoTooltip] při práci zesílí"
 mpo_child_herder_modifier: "Předurčení k pastevectví"
 mpo_child_herder_modifier_desc: "Tato postava strávila nějaký čas na pastvinách a osvojila si dovednosti pastevců."
 mpo_events_ariana.0100.t: "Síla tam, kde by ji nikdo nečekal"
 mpo_events_ariana.0100.desc: "Zem zvíří oblaka prachu, když se dva z mých [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] utkají v zápase. Táborem burácí nadšený řev. Souboj končí rozhodujícím hodem a vítěz srazí svého soupeře k zemi.\n\nProdírám se pohledem davem a snažím se zjistit, kdo je tím zdatným bojovníkem. K mému překvapení je to [Select_CString(warrior.IsFemale, 'má', 'můj')] [ROOT.Char.Custom2('RelationToMeShort', warrior)], [warrior.GetFirstName]! Takovou udatnost a odvahu bych od [Select_CString(warrior.IsFemale, 'ní', 'něj')] nikdy nečekal[Select_CString(ROOT.Char.IsFemale, 'a', '')] a [Select_CString(warrior.IsFemale, 'mnohé by ani nenapadlo hledat tak schopnou bojovnici mezi ženami', 'mnohé by ani nenapadlo hledat tak schopného bojovníka mezi muži')]!"
 mpo_events_ariana.0100.a: "[Select_CString(warrior.IsFemale, 'Taková bojovnice si zaslouží vést!', 'Takový bojovník si zaslouží vést!')]"
 mpo_events_ariana.0100.b: "[warrior.GetFirstNameNoTooltip] se k nám může přidat v bitvě."
 mpo_events_ariana.0100.c: "[Select_CString(warrior.IsFemale, 'Možná není jedinou ženou s takovým nadáním.', 'Možná není jediným mužem s takovým nadáním.')]"
 mpo_events_ariana.0100.d: "[Select_CString(warrior.IsFemale, 'Působivé, ale měla by se držet svých povinností.', 'Působivé, ale měl by se držet svých povinností.')]"
 mpo_diverse_warriors_modifier: "Rozmanití válečníci"
 mpo_diverse_warriors_modifier_desc: "Tato postava ukázala, že schopní válečníci mohou pocházet odkudkoli.\nCena reformy [Concept('martial_custom','válečnického zvyku')|E]: #p -50%#!"
 mpo_diverse_warriors_modifier_value_desc: "[GetModifier('mpo_diverse_warriors_modifier').GetNameWithTooltip]"
 mpo_events_ariana.0110.t: "Vzpurná půda"
 mpo_events_ariana.0110.desc: "„[ROOT.Char.GetTitleAsNameNoTooltip], slyším, jak ke mně promlouvají duchové,“ říká [Select_CString(astrologer.IsFemale, 'má astroložka', 'můj astrolog')] [astrologer.GetFirstName]. „[ROOT.Char.GetFaith.HighGodName|U] varuje před nebezpečím, které tě čeká, pokud svůj rod neudržíš v [current_capital.GetNameNoTier].“\n\n"
 mpo_events_ariana.0110.desc_fertility: "„Tvá stáda se zde nemohou pást a hodovat na takovém místě by přineslo jen smůlu. "
 mpo_events_ariana.0110.desc_opinion: "„Místní lidé tě už nemají v oblibě jako dřív a jejich zášť otravuje samotnou zemi. "
 mpo_events_ariana.0110.desc_ending: "Navrhuji přesunout jurtu do [new_capital.GetNameNoTier]. Možná tam nalezneš blahobyt.“"
 mpo_events_ariana.0110.a: "[ROOT.Char.GetFaith.HighGodName] nelže. Musíme se přesunout."
 mpo_events_ariana.0110.b: "Nesmysl. [current_capital.GetNameNoTierNoTooltip] je můj domov."
 mpo_events_ariana.0110.c_cynical: "[ROOT.Char.GetTitleAsNameNoTooltip] jsem já, ne [ROOT.Char.GetFaith.HighGodName]!"
 mpo_events_ariana.0110.c: "To už stačí, [astrologer.GetFirstNameNoTooltip]."
 mpo_home_sweet_home_modifier: "Jurta, sladká jurta"
 mpo_home_sweet_home_modifier_desc: "Tato postava si svou jurtu i místo, kde stojí, velmi oblíbila."
 mpo_events_ariana.0111.t: "Nový domov"
 mpo_events_ariana.0111.desc: "[Select_CString(ROOT.Char.IsFemale, 'Už je to nějaký čas, co jsem se přestěhovala', 'Už je to nějaký čas, co jsem se přestěhoval')] z [current_capital.GetNameNoTier] do [new_capital.GetNameNoTier], jak mi [Select_CString(astrologer.IsFemale, 'radila', 'radil')] [astrologer.GetFirstName].\n\nSnad za tím stojí [ROOT.Char.GetFaith.FertilityGodName]. Země je úrodnější a můj lid spokojenější."
 mpo_events_ariana.0111.a: "Tady jsme našli blahobyt."
 mpo_destined_leader_modifier: "Předurčení k vedení"
 mpo_destined_leader_modifier_desc: "Tato postava překonala genderové normy své kultury a prokázala, že je schopná vést ostatní."
