 mpo_events_ariana.0050.t: "Poskvrněné jméno"
 mpo_events_ariana.0050.desc: "Šepot a obvinění kolem mého [ROOT.Char.Custom2('RelationToMeShort', criminal_family)] [criminal_family.GetName] jsou čím dál znepokojivější. Mluví se o zapojení [criminal_family.GetFirstNameNoTooltip] do nedávné série krádeží a lidé se začínají bát o vlastní bezpečí. Ať už byl[Select_CString(criminal_family.IsFemale, 'a přistižena přímo při činu', ' přistižen přímo při činu')], nebo jen čelí hrozbě zavržení kvůli své [criminal_family.Custom('mpo_ariana_0050_description')] povaze, lidé žádají trest.\n\nPokud k tomu dojde, [criminal_family.GetFirstNameNoTooltip] přijde o své země, tituly i důstojnost a zůstane žít v hanbě, která vrhne temný stín na [ROOT.Char.GetDynasty.GetName]."
