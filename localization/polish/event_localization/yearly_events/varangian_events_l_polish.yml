l_polish:
 varangian_arrived.title: "Nový člen Varjažské gardy"
 varangian_arrived.desc: "[varangian_candidate.GetShortUIName|U] [Select_CString(varangian_candidate.IsFemale, 'vstoupila', 'vstoupil')] do Varjažské gardy"
 varangian.0002.t: "Varjažská garda"
 varangian.0002.opening: "Když za mnou [varangian_candidate.Custom2('MyCharacterIntroduction', ROOT.Char )] přijde se svým plánem, zdá se, že už je [Select_CString(varangian_candidate.IsFemale, 'pevně rozhodnutá', 'pevně rozhodnutý')].\n\n„Služba mezi Varjagy v"
 varangian.0002.miklagard: "Miklagardu"
 varangian.0002.elsewhere: "císařské gardě"
 varangian.0002.end: "mi přinese bohatství i slávu!“\n\nTo nemohu popřít, ale mohl[Select_CString(ROOT.Char.IsFemale, 'a bych', ' bych')] bych tuto žádost odmítnout. Bylo by však správné bránit někomu v cestě za slávou?"
 varangian.0002.a: "Jdi a provázej tě požehnání [ROOT.Char.GetFaith.WarGodNamePossessive]!"
 varangian.0002.b: "Ne, zakazuji ti to! Potřebuji tě tady."
 varangian.1002.t: "Návrat z Varjažské gardy"
 varangian.1002.opening: "Sotva poznávám [returning_varangian.Custom2('MyCharacterIntroduction', ROOT.Char )], když se [Select_CString(returning_varangian.IsFemale, 'objeví', 'objeví')] v mém [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'camp', 'great_hall')]."
 varangian.1002.new_partner: "A už vůbec nepoznávám [Select_CString(partner.IsFemale, 'ženu', 'muže')] po [Select_CString(returning_varangian.IsFemale, 'jejím', 'jeho')] boku!"
 varangian.1002.ending: "\n\n„Jsem zpátky, [returning_varangian.Custom2('RelationToMeShort', ROOT.Char )]!“ zahřmí [returning_varangian.GetFirstNameNoTooltip]. „Mockrát jsem si [Select_CString(returning_varangian.IsFemale, 'myslela', 'myslel')], že už nikoho jako ty nikdy neuvidím, ale nakonec jsem se přece jen [Select_CString(returning_varangian.IsFemale, 'vrátila', 'vrátil')]!“\n\nJe zvláštní po tolika letech znovu vidět svého [ROOT.Char.Custom2('RelationToMeShort', returning_varangian )], ale nemohu popřít, že na mě [returning_varangian.GetFirstNameNoTooltip] dělá dojem svým oděvem z [emperor.GetCulture.GetNameNoTooltip] kultury, cizokrajnými šperky i těžkou truhlou, kterou si [Select_CString(returning_varangian.IsFemale, 'přivezla', 'přivezl')] s sebou."
 varangian.1002.a: "Vítej doma, [returning_varangian.GetFirstNameNoTooltip]!"
 varangian.3001.t: "Varjažská garda: Čestná smrt"
 varangian.3001.desc: "[varangian.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString(varangian.IsFemale, 'zemřela', 'zemřel')] ve službě Varjažské gardy!\n\nObdržel[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem zprávu od [emperor.GetTitledFirstName], v níž [Select_CString(emperor.IsFemale, 'chválí', 'chválí')] jméno [varangian.GetFirstNameNoTooltip] a popisuje, jak [Select_CString(varangian.IsFemale, 'statečně bojovala', 'statečně bojoval')], aby zachránil[Select_CString(varangian.IsFemale, 'a', '')] život [emperor.GetTitleAsNameNoTooltip] před zákeřnými vrahy.\n\nNic už [varangian.GetFirstNameNoTooltip] nevrátí, ale posmrtná odměna ve zlatě od [emperor.GetTitleAsNameNoTooltip] alespoň trochu mírní žal."
 varangian.3001.a: "[Select_CString(varangian.IsFemale, 'Statečná', 'Statečný')] až do konce, [varangian.GetFirstNameNoTooltip]..."
