 yearly.1081.traitor_end.desc: "\n\n[suspicious.GetFirstNameNoTooltip] za tu proradnou zradu dostane, co si zaslouží!"
 yearly.1081.useful_end.desc: "\n\nTen proradný [suspicious.Custom2('InsultNoun', ROOT.Char)]! Tahle informace se mi jistě bude hodit."
 yearly.1081.secret.desc: "[suspicious.GetFirstNameNoTooltip] [guilty_owned_secret.Custom('SecretDescriptionThirdPerson')]!"
 yearly.1081.a: "Já to věděl[Select_CString(ROOT.Char.IsFemale, 'a', '')]!"
 yearly.1082.investigator_start.desc: "[investigator.GetTitledFirstName] dokončil[Select_CString(investigator.IsFemale, 'a vyšetřování', ' vyšetřování')] počínání [suspicious.GetTitledFirstName], ale vrací se s prázdnou. Nenašel[Select_CString(investigator.IsFemale, 'a žádný důkaz', ' žádný důkaz')] zločinného jednání ani jiných nekalostí, dokonce ani jedinou podezřelou pověst."
 yearly.1082.you_start.desc: "Skrýval[Select_CString(ROOT.Char.IsFemale, 'a jsem se', ' jsem se')] ve stínech, navštěvoval[Select_CString(ROOT.Char.IsFemale, 'a pochybné krčmy', ' pochybné krčmy')] a nenechal[Select_CString(ROOT.Char.IsFemale, 'a kámen na kameni', ' kámen na kameni')], přesto jsem proti [suspicious.GetTitledFirstName] nenašel[Select_CString(ROOT.Char.IsFemale, 'a jediný usvědčující důkaz', ' jediný usvědčující důkaz')]. Ani jedinou podezřelou pověst!"
 yearly.1082.normal.desc: "\n\nZdá se, že tentokrát jsem se mýlil[Select_CString(ROOT.Char.IsFemale, 'a', '')], ale nebyl to promarněný čas. Dnes v noci budu spát jako nemluvně."
 yearly.1082.paranoid.desc: "\n\nTentokrát možná [suspicious.GetFirstNameNoTooltip] nic neprovedl[Select_CString(suspicious.IsFemale, 'a', '')], ale pořád mi na celé té záležitosti něco nesedí. Budu [suspicious.GetFirstNameNoTooltip] bedlivě sledovat, o tom není pochyb."
 yearly.1082.a: "Opatrnosti není nikdy dost!"
 yearly.1082.a.tt: "[suspicious.GetShortUIName|U] působí nevinně"
 yearly.1083.investigator_start.desc: "[investigator.GetTitledFirstName] se vrací s prázdnou. „Proti [suspicious.GetTitledFirstName] jsem nenašel[Select_CString(investigator.IsFemale, 'a žádný usvědčující důkaz', ' žádný usvědčující důkaz')] a možná je skutečně nevinn[Select_CString(suspicious.IsFemale, 'á', 'ý')]. Zaručit to ale nemohu. [suspicious.GetFirstNameNoTooltip] je mimořádně opatrn[Select_CString(suspicious.IsFemale, 'á', 'ý')]. [investigator.GetFaith.HighGodName|U] jediný ví, co může skrývat.“"
 yearly.1083.you_start.desc: "Mé vyšetřování [suspicious.GetTitledFirstName] neodhalilo nic pozoruhodného, snad jen to, že [suspicious.GetFirstNameNoTooltip] je mimořádně opatrn[Select_CString(suspicious.IsFemale, 'á', 'ý')]. [ROOT.Char.GetFaith.HighGodName|U] jediný ví, co může skrývat."
 yearly.1083.a: "[suspicious.GetFirstNameNoTooltip] budu bedlivě sledovat, o tom není pochyb."
 yearly.1083.a.tt: "Vyšetřování [suspicious.GetShortUIName] selhalo"
 yearly.1084.start.desc: "Stráže si od [suspicious.GetTitledFirstName] udržují uctivý odstup, ale jsou připraveny kdykoli zasáhnout. [suspicious.GetFirstNameNoTooltip] si toho očividně dobře uvědomuje a nervózně těká pohledem po [ROOT.Char.Custom('GetRoom')]. Hledá snad únikovou cestu?\n\nK přiznání ani nemusím příliš tlačit."
 yearly.1084.a: "Hoďte [suspicious.GetFirstNameNoTooltip] do [ROOT.Char.Custom('GetDungeon')]!"
 yearly.1084.b: "Zmiz mi z očí, ty proradný [suspicious.Custom2('InsultNoun', ROOT.Char)]!"
 yearly.1085.start.desc: "Stráže si od [suspicious.GetTitledFirstName] udržují uctivý odstup, ale jsou připraveny kdykoli zasáhnout. [suspicious.GetFirstNameNoTooltip] si toho očividně dobře uvědomuje a v ramenou je patrné nezvyklé napětí.\n\n„Proč jste mě povolal[Select_CString(ROOT.Char.IsFemale, 'a', '')], [ROOT.Char.Custom2('RelationToMeAddress', suspicious)]? Chcete se mě na něco zeptat?“\n\nObvinění mi vytryskne z úst jako jed, ale když spatřím výraz ve tváři [suspicious.GetFirstNameNoTooltip], přepadnou mě pochybnosti. Tohle není vina,"
 yearly.1085.angry.desc: "ale hněv.\n\n„Jak se opovažujete mě takhle obviňovat? Po tom všem, co jsem pro vás udělal[Select_CString(suspicious.IsFemale, 'a', '')]!“"
 yearly.1085.sad.desc: "ale žal.\n\n„Vždy jsem vám věrně sloužil[Select_CString(suspicious.IsFemale, 'a', '')],“ zvolá [suspicious.GetFirstNameNoTooltip]. „Nikdy bych vás nezradil[Select_CString(suspicious.IsFemale, 'a', '')]!“"
 yearly.1085.a: "Můžeš odejít."
 yearly.1085.b: "Mýlil[Select_CString(ROOT.Char.IsFemale, 'a jsem se', ' jsem se')]. Upřímně se omlouvám, [suspicious.GetFirstNameNoTooltip]."
 yearly.1085.c: "#EMP Lži!#! Stráže, hoďte [suspicious.GetFirstNameNoTooltip] do [ROOT.Char.Custom('GetDungeon')]!"
 yearly.1086.desc: "Měl[Select_CString(ROOT.Char.IsFemale, 'a jsem plán', ' jsem plán')], pečlivě připravenou řeč. Jakmile však spatřím [suspicious.GetTitledFirstName], vzkypí ve mně krev a obvinění mi vytryskne z úst jako jed. K mému překvapení [suspicious.GetFirstNameNoTooltip] nereaguje hněvem ani slzami.\n\n„Ach, můj [ROOT.Char.Custom('ComplimentAdjective')] [suspicious.Custom2('RelationToMeShort', ROOT.Char)], vím, že trpíš. Tato krutá slova nejsou tvá. Odpovím na všechny tvé otázky a uvidíš, že se mě nemusíš bát.“"
 yearly.1086.a: "Já... nevím, co říct."
 yearly.1090.t: "Daleko od domova"
 yearly.1090.start.desc: "Přivedou přede mě cizince. „[Select_CString(traveler.IsFemale, 'Už týden čeká', 'Už týden čeká')] před branami [ROOT.Char.Custom('ResidenceBuilding')], můj pane,“ oznámí mi strážný.\n\n[Select_CString(traveler.IsFemale, 'Žena', 'Muž')] se hluboce ukloní. „Jmenuji se [traveler.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Procestoval[Select_CString(traveler.IsFemale, 'a jsem daleké kraje a viděla mnoho věcí', ' jsem daleké kraje a viděl mnoho věcí')], ale"
 yearly.1090.family_member.desc: "můj [traveler.Custom2('RelationToMeShort', SCOPE.sC('traveler_family_1'))] [traveler_family_1.GetFistName] a já jsme cestou znavení."
 yearly.1090.family.desc: "má rodina i já jsme cestou znavení."
 yearly.1090.alone.desc: "už mě cesta zmohla."
 yearly.1090.family_stay.desc: "Pokud nám dovolíte zůstat, rád[Select_CString(traveler.IsFemale, 'a se s vámi podělím', ' se s vámi podělím')] o své znalosti světa a budu vám věrně sloužit.“"
 yearly.1090.alone_stay.desc: "Pokud mi dovolíte zůstat, rád[Select_CString(traveler.IsFemale, 'a se s vámi podělím', ' se s vámi podělím')] o své znalosti světa a budu vám věrně sloužit.“"
 yearly.1090.a: "Ať se [ROOT.Char.GetFaith.HighGodName] stane tvým bohem, a toto bude tvůj domov."
 yearly.1090.b: "Čím víc nás bude, tím lépe!"
 yearly.1090.c: "Pro takové, jako jsi ty, tu místo nemáme."
 yearly.1090.travelers_family: "[traveler.GetShortUIName|U] a rodina"
