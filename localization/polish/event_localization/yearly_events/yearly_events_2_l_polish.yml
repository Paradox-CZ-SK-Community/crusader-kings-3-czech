l_polish:
 yearly.1001.t: "Přes sklopené řasy"
 yearly.1001.start.desc: "Když se dnes večer snad už podvacáté střetne můj pohled s pohledem [married_seducer.GetTitledFirstName], vím, že si nic nenamlouvám. I z opačného konce stolu mě ten pohled pálí jako polední slunce.\n\n[married_seducer.GetFirstNameNoTooltip] po mně touží,"
 yearly.1001.end_hesitation.desc: "a cítím, jak mé tělo odpovídá a probouzí se. Jenže dnes je tu i [seducer_spouse.GetTitledFirstName], [Select_CString(seducer_spouse.IsFemale, 'manželka', 'manžel')] [married_seducer.GetFirstNameNoTooltip], a navíc můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('seducer_spouse'))]..."
 yearly.1001.end_intimidated.desc: "a mě svírá strach. Z [married_seducer.GetFirstNameNoTooltip]? Z [seducer_spouse.GetTitledFirstName], [Select_CString(seducer_spouse.IsFemale, 'manželky', 'manžela')] [married_seducer.GetFirstNameNoTooltip]? Nebo... z toho, co bych mohl[Select_CString(ROOT.Char.IsFemale, 'a udělat', ' udělat')] já? Nevím."
 yearly.1001.end_spiteful.desc: "a nemá cenu si lhát, toužím po [married_seducer.GetFirstNameNoTooltip] také... Anebo ve skutečnosti toužím potrestat [seducer_spouse.GetTitledFirstName], [Select_CString(seducer_spouse.IsFemale, 'manželku', 'manžela')] [married_seducer.GetFirstNameNoTooltip]? Záleží na tom vůbec?"
 yearly.1001.a: "S [married_seducer.GetFirstNameNoTooltip] si pořádně užiju!"
 yearly.1001.a.tt: "Jakmile všichni usnou, vyhledám [married_seducer.GetTitledFirstName]"
 yearly.1001.b: "Všichni se dozvědí, jak hříšné myšlenky [married_seducer.GetFirstNameNoTooltip] chová!"
 yearly.1001.c: "Ne! Mé srdce zůstane čisté."
 yearly.1002.desc: "Potom [married_seducer.GetFirstName] s žuchnutím padne na matraci, dech má přerývaný a oči napůl zavřené. [married_seducer.Custom('ObjectifiedFeature')|U] se leskne potem a já ho jemnými prsty pomalu setřu.\n\nSotva uplyne pár okamžiků, [married_seducer.GetFirstNameNoTooltip] s omluvným úsměvem odstrčí mou ruku. „Už bude ráno. Raději půjdu.“"
 yearly.1002.a: "„Nemůžeš ještě chvíli zůstat? Prosím?“"
 yearly.1002.a.success: "[married_seducer.GetFirstNameNoTooltip] zůstane"
 yearly.1002.a.success.message: "S [married_seducer.GetFirstName] jsme se milovali až do svítání."
 yearly.1002.a.failure: "[married_seducer.GetFirstNameNoTooltip] si myslí, že se příliš upínám"
 yearly.1002.a.failure.message: "[married_seducer.GetFirstName] [Select_CString(married_seducer.IsFemale, 'se mi vysmála a odešla.', 'se mi vysmál a odešel.')]"
 yearly.1002.b: "„To ano, raději si pospěš.“"
 yearly.1002.b.success: "[married_seducer.GetFirstNameNoTooltip] ocení mou nezávaznost"
 yearly.1002.b.success.message: "[married_seducer.GetFirstName] ocenil[Select_CString(married_seducer.IsFemale, 'a mou nezávaznost.', ' mou nezávaznost.')]"
 yearly.1002.b.failure: "[married_seducer.GetFirstNameNoTooltip] očekává něco víc"
 yearly.1002.b.failure.message: "[married_seducer.GetFirstName] [Select_CString(married_seducer.IsFemale, 'se zatvářila dotčeně, jako by čekala něco víc.', 'se zatvářil dotčeně, jako by čekal něco víc.')]"
 yearly.1003.t: "Měl jsem to vědět"
 yearly.1003.start.desc: "Jakmile se ujistím, že mě nikdo nesleduje, pootevřu dveře [married_seducer.GetFirstNameNoTooltip] a nakouknu dovnitř. Objekt mé touhy stojí zády ke mně, [Select_CString(married_seducer.IsFemale, 'nahá jako v den, kdy se narodila', 'nahý jako v den, kdy se narodil')]."
 yearly.1003.end.desc: "Zatlačím do dveří a nakloním se blíž...\n\nNáhle se ozve hlasitá rána, hlavou mi projede prudká bolest a já padám dozadu tvrdě na zem. Všude je křik, tolik křiku. A kroky. Hlava se mi točí...\n\n„Jako krysa v pasti,“ zašeptá mi do ucha známý hlas. [seducer_spouse.GetTitledFirstName]. Do prdele."
 yearly.1003.a: "Já... já hledal[Select_CString(ROOT.Char.IsFemale, 'a latrínu!', ' latrínu!')]"
 yearly.1010.t: "Zmizení v noci"
 yearly.1010.start.desc: "Když vstoupím do [ROOT.Char.Custom('GetChamberPlural')] [abductee.GetTitledFirstName], první, čeho si všimnu, je stráž zhroucená v koutě. Druhou věcí je jasně rudá rána táhnoucí se přes krk. [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('abductee'))|U] [abductee.GetTitledFirstName] však nikde!\n\n"
 yearly.1010.friend.desc: "[hunter.GetTitledFirstName] vstoupí do [ROOT.Char.Custom('GetRoom')] s lukem přehozeným přes rameno. „Je mi líto, starý příteli. [abductor.GetTitledFirstName] [Select_CString(abductor.IsFemale, 'unesla', 'unesl')] [abductee.GetFirstNameNoTooltip]."
 yearly.1010.marshal.desc: "Můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hunter'))] vstoupí do [ROOT.Char.Custom('GetRoom')] s lukem přehozeným přes rameno. „Strážný, který přežil, tvrdí, že [abductee.GetFirstNameNoTooltip] [Select_CString(abductor.IsFemale, 'unesla', 'unesl')] [abductor.GetTitledFirstName], [ROOT.Char.Custom('GetCourtOwner')]."
 yearly.1010.end.desc: "Psi i [dummy_gender.GetWomenMen] jsou připraveni. Jaké jsou vaše rozkazy?“"
 yearly.1010.abduction.tt: "[abductor.GetTitledFirstName] [Select_CString(abductor.IsFemale, 'unesla', 'unesl')] [abductee.GetTitledFirstName]"
 yearly.1010.friend.tt: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hunter'))] [hunter.GetTitledFirstName] je tu, aby pomohl."
 yearly.1010.a: "[abductor.GetTitledFirstNameNoTooltip] chci živ[Select_CString(abductor.IsFemale, 'ou', 'ého')]."
 yearly.1010.a.tt: "Poté budeš moci rozhodnout, zda má být [abductee.GetTitledFirstName] [Select_CString(abductee.IsFemale, 'zachráněna, zajata, nebo zabita', 'zachráněn, zajat, nebo zabit')]\n\n"
 yearly.1010.b: "Chci, aby ten [abductor.Custom2('InsultNoun', ROOT.Char)] zemřel."
 yearly.1010.c: "Záleží mi jen na tom, aby se [abductee.GetFirstNameNoTooltip] vrátil[Select_CString(abductee.IsFemale, 'a v pořádku.', ' v pořádku.')]"
 yearly.1010.d: "Je mi to jedno. Nechte je jít."
 yearly_1010_save_abductee_random_list_effect.success.tt: "[abductee.GetShortUIName|U] [Select_CString(abductee.IsFemale, 'je zachráněna', 'je zachráněn')]"
 yearly_1010_save_abductee_random_list_effect.failure.tt: "[abductor.GetShortUIName] [Select_CString(abductor.IsFemale, 'unese', 'unese')] [abductee.GetShortUIName]"
 yearly.1011.desc: "„A co [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('abductee'))]?“ zeptá se [hunter.GetFirstName]. „Kromě stráže nikdo nic neviděl ani neslyšel. Jistě pro to existuje rozumné vysvětlení, ale měl[Select_CString(ROOT.Char.IsFemale, 'a bys vědět', ' bys vědět')] jednu věc. Někteří [dummy_gender.GetWomenMen] mají podezření, že [abductee.GetFirstNameNoTooltip] [Select_CString(abductee.IsFemale, 'odešla dobrovolně', 'odešel dobrovolně')]...“"
 yearly.1011.a: "Nesmysl. Braň [abductee.GetFirstNameNoTooltip] vlastním životem."
 yearly.1011.b: "[abductee.GetFirstNameNoTooltip] chci v řetězech."
 yearly.1011.c: "Podřízni [abductee.GetFirstNameNoTooltip] hrdlo a tělo zakopej."
 yearly_1010_outcome_effect_escape.tt: "[THIS.Char.GetTitledFirstName] unikne"
 yearly_1010_outcome_effect_abductee_save.tt: "[abductee.GetTitledFirstName] je zachráněn[Select_CString(abductee.IsFemale, 'a a vrácena ke mně', ' a vrácen ke mně')]"
 yearly_1010_outcome_effect_abductee_lost.tt: "[abductor.GetTitledFirstName] odvede [abductee.GetTitledFirstName]"
 yearly_1010.target_imprison.desc: "[THIS.Char.GetTitledFirstNameNoTooltip] je zajat[Select_CString(THIS.Char.IsFemale, 'á', 'ý')]"
 yearly_1010.target_wounded.desc: "[THIS.Char.GetTitledFirstNameNoTooltip] je zraněn[Select_CString(THIS.Char.IsFemale, 'a, ale unikne', ', ale unikne')]"
 yearly_1010.hunter_killed.desc: "[THIS.Char.GetTitledFirstNameNoTooltip] zabije [hunter.GetTitledFirstNameNoTooltip] a unikne"
 yearly_1010.target_killed.desc: "[THIS.Char.GetTitledFirstNameNoTooltip] je zabit[Select_CString(THIS.Char.IsFemale, 'a', '')]"
 yearly_1010.abductee_saved.desc: "[abductee.GetTitledFirstNameNoTooltip] je zachráněn[Select_CString(abductee.IsFemale, 'a', '')]"
 yearly_1010.abductee_saved.tt: "[abductee.GetTitledFirstName] se ke mně vrátí živ[Select_CString(abductee.IsFemale, 'á a zdravá', ' a zdráv')]"
 yearly_1010.abductee_lost.desc: "[abductor.GetTitledFirstNameNoTooltip] unikne i s [abductee.GetTitledFirstNameNoTooltip]"
 yearly_1010.abductee_lose.tt: "[abductee.GetTitledFirstName] je odveden[Select_CString(abductee.IsFemale, 'a', '')] z mých zemí"
 yearly_1010_kill_target_effect.tt: "[hunter.GetTitledFirstName] se dozví o mém tajemství"
 yearly.1013.start.desc: "Ta nejistota je nesnesitelná. Uplyne hodina, druhá, třetí... Právě se chystám nechat přivést koně, když z druhé strany brány zaslechnu křik.\n\n"
 yearly.1013.hunter_dead_start.desc: "Když vstoupím do [ROOT.Char.Custom('GetCourtyard')], přivítají mě jen zachmuřené tváře a nehybné tělo [hunter.GetFirstName], položené na provizorních nosítkách."
 yearly.1013.hunter_alive_start.desc: "Vběhnu do [ROOT.Char.Custom('GetCourtyard')] a okamžitě spatřím sklíčenou tvář [hunter.GetFirstName]."
 yearly.1013.hunter_dead_abductee_lost.desc: "Rozhlédnu se kolem, ale nikde nevidím ani náznak naděje. Jen tváře plné hořkosti.\n\n„[abductor.GetTitledFirstName] [Select_CString(abductor.IsFemale, 'odvedla', 'odvedl')] [abductee.GetFirstNameNoTooltip], [ROOT.Char.Custom('GetCourtOwner')]. Zklamali jsme vás...“"
 yearly.1013.hunter_dead_both_escaped.desc: "[abductor.GetTitledFirstName] i [abductee.GetTitledFirstName] mi proklouzli mezi prsty."
 yearly.1013.abductee_lost.desc: "Vykročím k bráně a modlím se, abych za rohem zahlédl[Select_CString(ROOT.Char.IsFemale, 'a známou tvář', ' známou tvář')] [abductee.GetTitledFirstName]. Jenže všechny tváře, které vidím, jsou plné hořkosti, a [abductee.GetFirstNameNoTooltip] mezi nimi není."
 yearly.1013.abductor_escaped_abductee_killed.desc: "Přesto výprava nebyla úplným neúspěchem. [abductor.GetTitledFirstName] sice unikl[Select_CString(abductor.IsFemale, 'a', '')], ale [hunter.GetFirstName] mě tiše ujistí, že [abductee.GetFirstName] už leží v mělkém hrobě."
 yearly.1013.abductor_escaped_abductee_imprisoned.desc: "Přesto výprava nebyla úplným neúspěchem. [abductor.GetTitledFirstName] prý unikl[Select_CString(abductor.IsFemale, 'a', '')], ale [abductee.GetFirstName] takové štěstí neměl[Select_CString(abductee.IsFemale, 'a', '')]..."
 yearly.1013.a1: "S tebou si to ještě vyřídím, [abductee.GetFirstNameNoTooltip]..."
 yearly.1013.a2: "Alespoň je [abductee.GetFirstNameNoTooltip] v bezpečí..."
 yearly.1013.a3: "Za tohle zaplatíš, [abductor.GetFirstNameNoTooltip]..."
 yearly.1014.t: "Úspěšný hon"
 yearly.1014.safe_hunter_start.desc: "Když vstoupím do [ROOT.Char.Custom('GetCourtyard')], přivítá mě široký úsměv [hunter.GetFirstName]. "
 yearly.1014.abductee_saved_abductor_killed.desc: "Na koni [hunter.GetFirstNameNoTooltip] sedí [abductee.GetFirstName], zabalen[Select_CString(abductee.IsFemale, 'á do přikrývky a zcela nezraněná', 'ý do přikrývky a zcela nezraněný')].\n\nKdyž [abductee.GetFirstNameNoTooltip] pomáhám sesednout, pohlédnu na [hunter.GetFirstName]. Přichází tiché přikývnutí. O [abductor.GetTitledFirstName] je postaráno."
 yearly.1014.abductee_saved_abductor_imprisoned.desc: "Na koni [hunter.GetFirstNameNoTooltip] sedí [abductee.GetFirstName], zabalen[Select_CString(abductee.IsFemale, 'á do přikrývky', 'ý do přikrývky')]. Při tom pohledu mi srdce poskočí radostí.\n\nPak zahlédnu další známou tvář. [abductor.GetTitledFirstName] je v řetězech a vlečen[Select_CString(abductor.IsFemale, 'a', '')] za jedním z ostatních koní. Výborně."
 yearly.1014.abductee_saved_abductor_escaped.desc: "Na koni [hunter.GetFirstNameNoTooltip] sedí [abductee.GetFirstName], zabalen[Select_CString(abductee.IsFemale, 'á do přikrývky a zcela nezraněná', 'ý do přikrývky a zcela nezraněný')].\n\nKdyž [abductee.GetFirstNameNoTooltip] pomáhám sesednout, pohlédnu na [hunter.GetFirstName]. Odpovědí je jen zavrtění hlavou. Teď na tom nezáleží. S [abductor.GetTitledFirstName] si to vyřídíme později."
 yearly.1014.both_killed.desc: "[hunter.GetFirstNameNoTooltip] mi pokyne, abych [Select_CString(ROOT.Char.IsFemale, 'šla', 'šel')] za ním.\n\nJakmile jsme z doslechu ostatních, [hunter.GetFirstName] mi všechno poví. Když poslouchám, jak oba zemřeli, kde byli pohřbeni a jak to proběhlo, napětí ze mě pomalu opadává. Nikdo se to nikdy nedozví."
 yearly.1014.both_imprisoned.desc: "[hunter.GetFirstNameNoTooltip] drží v ruce provaz a prudce za něj zatáhne. Dopředu klopýtnou dvě postavy.\n\n[abductee.GetFirstName] a [abductor.GetFirstName] – spoutaní a se zavázanýma očima."
 yearly.1014.abductee_killed_abductor_imprison.desc: "Vedle [hunter.GetFirstNameNoTooltip] stojí [abductor.GetTitledFirstName], v řetězech a se zavázanýma očima.\n\nA pokud jde o [abductee.GetTitledFirstName]... jeho nepřítomnost a výraz ve tváři [hunter.GetFirstName] mi říkají vše. Všechno proběhlo podle plánu."
 yearly.1014.abductee_imprisoneid_abductor_killed.desc: "Vedle [hunter.GetFirstNameNoTooltip] stojí [abductee.GetTitledFirstName], v řetězech a se zavázanýma očima.\n\nA pokud jde o [abductor.GetTitledFirstName]... jeho nepřítomnost a výraz ve tváři [hunter.GetFirstName] mi říkají vše. Všechno proběhlo podle plánu."
 yearly.1014.a: "Takový osud čeká každého, kdo se mi postaví!"
 yearly.1015.t: "Mé ztracené jehně"
 yearly.1015.start.desc: "Když se [abductee.GetFirstName] včera v noci objevil[Select_CString(abductee.IsFemale, 'a', '')] u brány, myslel[Select_CString(ROOT.Char.IsFemale, 'a jsem', ' jsem')], že se mě přišel strašit [Select_CString(abductee.IsFemale, 'její', ' jeho')] duch. Už jsem začínal[Select_CString(ROOT.Char.IsFemale, 'a věřit', ' věřit')], že [abductee.GetFirstNameNoTooltip] nikdy neuvidím, a přesto tam stál[Select_CString(abductee.IsFemale, 'a', '')], skutečn[Select_CString(abductee.IsFemale, 'á jako zem pod mýma nohama', 'ý jako zem pod mýma nohama')].\n\nOd návratu [abductee.GetFirstNameNoTooltip] mnoho neřekl[Select_CString(abductee.IsFemale, 'a', '')], jen že"
 yearly.1015.released.desc: "[abductor.GetTitledFirstName] se rozhodl[Select_CString(abductor.IsFemale, 'a', '')] [abductee.GetFirstNameNoTooltip] propustit. Nikdy bych nevěřil[Select_CString(ROOT.Char.IsFemale, 'a', '')], že má [abductor.GetTitledFirstNameNoTooltip] v těle jedinou čestnou kost, ale [abductee.GetFirstNameNoTooltip] je přece na svobodě... ne?"
 yearly.1015.escaped.desc: "[abductee.GetFirstNameNoTooltip] spatřil[Select_CString(abductee.IsFemale, 'a příležitost a podařilo se jí uniknout', ' příležitost a podařilo se mu uniknout')]. Zní to sice krajně nepravděpodobně, ale staly se už podivnější věci... ne?"
 yearly.1015.immediate.tt: "[abductee.GetTitledFirstName] se vrátil[Select_CString(abductee.IsFemale, 'a', '')] na můj dvůr"
 yearly.1015.a.trusting: "Díky [ROOT.Char.GetFaith.HighGodName], [abductee.GetFirstNameNoTooltip] je zpátky v bezpečí!"
 yearly.1015.a.paranoid: "[abductee.GetFirstNameNoTooltip] něco skrývá, tím jsem si jist[Select_CString(ROOT.Char.IsFemale, 'á', 'ý')]..."
 yearly.1015.a: "Nevím, čemu mám věřit..."
 yearly.1020.opening: "[vip.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.1020.desc: "Za několik dní bude přes [my_county.GetNameNoTierNoTooltip] cestovat můj [enemy.Custom2('InsultAdjective', SCOPE.sC('vip'))] [vip.Custom2('RelationToMeShort', SCOPE.sC('enemy'))] [enemy.GetTitledFirstName]. Pokud připravíte léčku a [Select_CString(enemy.IsFemale, 'zajmete ji', 'zajmete ho')], štědře vás odměním.\n\nPřijmete-li mou nabídku, polovinu peněz dostanete hned a druhou polovinu poté, co mi [enemy.GetTitledFirstNameNoTooltip] předáte. Pokud [enemy.GetFirstNameNoTooltip] v potyčce zemře, slzu neuroním, ale za mrtvolu platit nebudu.\n\nVěřím, že slova na tomto pergamenu zůstanou jen mezi námi. Těším se na vaši odpověď."
 yearly.1020.a: "Znám dokonalé místo pro léčku..."
 yearly.1020.a.rl.t: "Za několik dní"
 yearly.1020.a.capture.desc: "[enemy.GetTitledFirstNameNoTooltip] se ocitne v mém zajetí"
 yearly.1020.a.capture.tt: "[vip.GetTitledFirstName] ti vyplatí zbytek peněz, až si převezme [enemy.GetTitledFirstName]"
 yearly.1020.a.escape.desc: "[enemy.GetTitledFirstNameNoTooltip] unikne"
 yearly.1020.b: "Budu předstírat, že souhlasím, ale [enemy.GetFirstNameNoTooltip] tajně varuji."
 yearly.1020.a.kill.desc: "[enemy.GetTitledFirstNameNoTooltip] je v léčku zabit[Select_CString(enemy.IsFemale, 'a', '')]"
 yearly.1020.a.kill.message: "[enemy.GetTitledFirstName] byl[Select_CString(enemy.IsFemale, 'a v léčku zabita.', ' v léčku zabit.')]"
 yearly.1020.b.success.desc: "[vip.GetTitledFirstNameNoTooltip] uvěří, že jsem na [enemy.GetTitledFirstNameNoTooltip] skutečně připravil[Select_CString(ROOT.Char.IsFemale, 'a léčku', ' léčku')]"
 yearly.1020.b.success.tt: "[vip.GetTitledFirstName] se nikdy nedozví, že jsem jednal[Select_CString(ROOT.Char.IsFemale, 'a', '')] za jeho zády"
 yearly.1020.b.failure.desc: "[vip.GetTitledFirstNameNoTooltip] zjistí, že jsem [enemy.GetTitledFirstNameNoTooltip] varoval[Select_CString(ROOT.Char.IsFemale, 'a', '')]"
 yearly.1020.c: "Tahle dohoda zní příliš nebezpečně."
 yearly.1021.desc: "Špeh, kterého jsem nasadil[Select_CString(ROOT.Char.IsFemale, 'a', '')] do doprovodu [enemy.GetTitledFirstName], mi poslal zprávu. Inu, inu, to bylo napínavé čtení! Ten samolibý výraz už [enemy.GetFirstNameNoTooltip] jistě z tváře zmizel.\n\nVojáci, kteří si přijedou pro toho [enemy.Custom2('InsultAdjective', SCOPE.sC('vip'))] [enemy.Custom2('InsultNoun', SCOPE.sC('vip'))], už jsou na cestě a ano, zlato vezou s sebou.\n\nBylo mi potěšením s vámi obchodovat, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip]. Doufám, že se naše cesty ještě někdy zkříží."
 yearly.1021.a: "Potěšení je zcela na mé straně."
 yearly.1021.b: "Vlastně si [enemy.GetFirstNameNoTooltip] raději nechám!"
 yearly.1021.b.tt: "[enemy.GetTitledFirstName] zůstane mým vězněm"
 yearly.1022.opening: "[enemy.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.1022.desc: "[Select_CString(ROOT.Char.IsFemale, 'Jste nanejvýš čestná žena', 'Jste nanejvýš čestný muž')], [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip]. Vděčím vám za svobodu, možná dokonce za život. Kdo ví, co by se mnou ten [vip.Custom2('InsultAdjective', SCOPE.sC('enemy'))] [vip.Custom2('InsultNoun', SCOPE.sC('enemy'))] [vip.GetTitledFirstName] udělal, kdybych skončil[Select_CString(enemy.IsFemale, 'a', '')] v jeho žaláři?\n\nPřísahám, že vám to oplatím. Do té doby na sebe dávejte pozor."
 yearly.1022.a: "I ty, [enemy.GetLadyLord] [enemy.GetFirstNameNoTooltip]."
 yearly.1023.opening: "[vip.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 yearly.1023.desc: "Opravdu jste si myslel[Select_CString(ROOT.Char.IsFemale, 'a', '')], že vám tenhle malý podvod projde? Mám oči všude, [ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip], a odteď vás budou bedlivě sledovat.\n\nPřísahám na svůj život, že dne, kdy jste se rozhodl[Select_CString(ROOT.Char.IsFemale, 'a', '')] postavit proti mně, budete hořce litovat."
 yearly.1023.a: "Tohle mohlo dopadnout lépe..."
 yearly.1030.t: "[Select_CString(hooked.IsFemale, 'Každá žena sama za sebe', 'Každý muž sám za sebe')]"
 yearly.1030.nervous.desc: "Když vstoupím do [ROOT.Char.Custom('GetChamber')], [hooked.GetTitledFirstName] si nervózně pohrává s rukávem. Co tu v tuto hodinu vůbec dělá?\n\n„Hluboce se omlouvám, ale musím s vámi mluvit v soukromí. [Select_CString(hooked.IsFemale, 'Zjistila jsem', 'Zjistil jsem')] něco #emp velice#! zajímavého.“"
 yearly.1030.confident.desc: "Ohlášení noční návštěvy mě okamžitě zbaví veškeré ospalosti. Kdo mě může v tuto hodinu rušit?\n\nPozdním návštěvníkem není nikdo jiný než [hooked.GetTitledFirstName]. „Musím s vámi mluvit v soukromí, mimo doslech zvědavých uší. [Select_CString(hooked.IsFemale, 'Zjistila jsem', 'Zjistil jsem')] něco #EMP velice#! zajímavého.“"
 yearly.1030.end.desc: "\n\n[hooked.GetTitledFirstNameNoTooltip] odhalil[Select_CString(hooked.IsFemale, 'a', '')] tajemství [secret_character.GetTitledFirstName]. Je ochotn[Select_CString(hooked.IsFemale, 'á se se mnou podělit', 'ý se se mnou podělit')], pokud [Select_CString(hooked.IsFemale, 'ji zbavím závazku, který vůči mně má', 'ho zbavím závazku, který vůči mně má')]."
 yearly.1030.a: "Přísahám, že potom už mi nebudeš nic dlužit."
 yearly.1030.a.tt: "[hooked.GetTitledFirstName] mi prozradí [Concept('secret','tajemství')|E] o [secret_character.GetTitledFirstName]"
 yearly.1030.b: "Ty si myslíš, že si můžeš klást podmínky? Mluv, nebo uvidíš!"
 yearly.1030.b.tt: "Přinutím [hooked.GetTitledFirstName], aby mi prozradil[Select_CString(hooked.IsFemale, 'a', '')] [Concept('secret','tajemství')|E] o [secret_character.GetTitledFirstName]"
 yearly.1030.c: "Raději si podržím tebe v hrsti než [secret_character.GetFirstNameNoTooltip]."
 yearly.1030.a.start.desc: "Tajemství odhaleno"
 yearly.1030.a.secret_deviant.desc: "Odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem zvrácenost [secret_character.GetTitledFirstName]!"
 yearly.1030.a.secret_homosexual.desc: "Odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že [secret_character.GetTitledFirstName] touží po [secret_character.GetWomenMen]!"
 yearly.1030.a.secret_murder_attempt.desc: "Odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem neúspěšný pokus [secret_character.GetTitledFirstName] zavraždit [secret_target.GetTitledFirstNameOrMe]!"
 yearly.1030.a.secret_cannibal.desc: "Odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že [secret_character.GetTitledFirstName] prahne po lidském mase!"
 yearly.1030.a.secret_lover.desc: "Odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem tajný tělesný poměr mezi [secret_character.GetTitledFirstName] a [secret_target.GetTitledFirstName]!"
 yearly.1030.a.secret_murder.desc: "Za předčasnou smrtí [secret_target.GetTitledFirstName] stál[Select_CString(secret_character.IsFemale, 'a', '')] [secret_character.GetTitledFirstName]!"
 yearly.1030.a.secret_heretic.desc: "Odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem kacířství [secret_character.GetTitledFirstName]!"
 yearly.1030.a.secret_incest.desc: "Odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem krvesmilný vztah mezi [secret_character.GetTitledFirstName] a jedním z blízkých příbuzných!"
 yearly.1030.a.secret_witch.desc: "Odhalil[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem, že [secret_character.GetTitledFirstName] se zabývá čarodějnictvím!"
 yearly.1040.t: "Nečekaná návštěva"
 yearly.1040.tumble.desc: "Dorazím ke [suspicious.Custom('GetChamber')] své drahé lásky [suspicious.GetFirstNameNoTooltip], aniž by mě kdokoli spatřil či zaslechl. S touhou v srdci i v bedrech pomalu vstupuji dovnitř.\n\n"
 yearly.1040.dinner.desc: "S vidinou klidného večera mířím za [suspicious.GetFirstNameNoTooltip], mým [ROOT.Char.Custom2('RelationToMeShort', suspicious)], do [suspicious.Custom('GetChamber')]. Nesou s sebou trochu [ROOT.Char.Custom('RegionalDrink')] a [ROOT.Char.Custom('RegionalGameObject')]. Bez zaklepání vstoupím dovnitř.\n\n"
 yearly.1040.council_meeting.desc: "[suspicious.GetTitledFirstName] má zase zpoždění na zasedání rady. Tentokrát to jen tak nepřejdu! Když dorazím ke [suspicious.Custom('GetChamber')], kde přebývá [suspicious.GetFirstNameNoTooltip], ani se neobtěžuji ohlásit svůj příchod.\n\n"
 yearly.1040.vassal_talk.desc: "Od chvíle, kdy můj vazal [suspicious.GetTitledFirstName] na mé velkorysé pozvání dorazil ke dvoru, sotva opustil[Select_CString(suspicious.IsFemale, 'a', '')] svou [suspicious.Custom('GetChamber')]. Požaduji vysvětlení!\n\nKdyž vstoupím dovnitř,"
 yearly.1040.end.desc: "[suspicious.GetTitledFirstNameNoTooltip] sedí a horečně něco píše. Jakmile si odkašlu, málem vyskočí z kůže. Rychle schová svitek pergamenu do kapsy a otočí se ke mně s neklidným výrazem ve tváři."
 yearly.1040.a: "„Co skrýváš? Okamžitě mi to ukaž!“"
 yearly.1040.a.tt: "Zjistíš, co [suspicious.GetTitledFirstName] skrývá, ať už je to cokoli"
 yearly.1040.b: "Vrať se později a tajně prohledej [suspicious.Custom('GetChamber')] postavy [suspicious.GetFirstNameNoTooltip]."
 yearly.1040.b.success.desc: "Najdu pergamen"
 yearly.1040.b.failure.desc: "[suspicious.GetTitledFirstNameNoTooltip] mě přistihne"
 yearly.1040.c: "Budu respektovat [Select_CString(suspicious.Char.IsFemale, 'její', 'jeho')] soukromí."
 yearly.1041.start.desc: "To si [suspicious.GetFirstNameNoTooltip] opravdu [Select_CString(suspicious.IsFemale, 'myslela, že si toho nevšimnu', 'myslel, že si toho nevšimnu')]? „Dej mi to! Okamžitě!“"
 yearly.1041.cross_arm.desc: "[suspicious.GetFirstNameNoTooltip] mi podá zmačkaný pergamen a založí si ruce na prsou."
 yearly.1041.shivering_hand.desc: "[suspicious.GetFirstNameNoTooltip] mi třesoucí se rukou podá zmačkaný pergamen."
 yearly.1041.middle.desc: "\n\n"
 yearly.1041.friend.desc: "Někdo přijímá pozvání a píše, jakou má radost a jak se těší, že stráví nějaký čas se... mnou! A ten dopis napsal můj přítel [secret_friend.GetTitledFirstName]!\n\n„Mělo to být překvapení, příjemný a odpočinkový výlet pro vás dva... A teď je všechno zkažené!“"
 yearly.1041.gift.desc: "Je to dopis. Píše se v něm o nějaké peněžní transakci a také o zakázce, podle níž má vzniknout [ROOT.Char.Custom('SuitableGiftItem')] se znakem dynastie [ROOT.Char.GetDynastyNameNoTooltip]...\n\n„Chtěl[Select_CString(suspicious.IsFemale, 'a jsem tě překvapit a dát ti něco na znamení své vděčnosti.', ' jsem tě překvapit a dát ti něco na znamení své vděčnosti.')] A teď je všechno k ničemu!“"
 yearly.1041.feast.desc: "Je to seznam jídel a nápojů a také spousta známých jmen, mezi nimi i můj oblíbený [ROOT.Char.Custom('MusicalPerformer')]...\n\n„Mělo to být překvapení. [Select_CString(suspicious.IsFemale, 'Říkala jsem si, že by bylo hezké uspořádat hostinu na tvou počest, a takhle se mi odvděčíš...', 'Říkal jsem si, že by bylo hezké uspořádat hostinu na tvou počest, a takhle se mi odvděčíš...')]“"
 yearly.1041.hostile_scheme_agent_other.desc: "Je to seznam časů a míst, zaslechnutých slov i spatřených věcí. Soukromých věcí... [suspicious.GetFirstNameNoTooltip] pomáhá někomu spřádat plán proti [scheme_target.GetFirstName], mému [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scheme_target'))]!"
 yearly.1041.hostile_scheme_agent_me.desc: "Je to seznam časů a míst, zaslechnutých slov i spatřených věcí. Věcí, které jsem řekl[Select_CString(ROOT.Char.IsFemale, 'a nebo udělala', ' nebo udělal')]! [suspicious.GetFirstNameNoTooltip] někoho zásobuje zprávami o mém počínání a pomáhá mu spřádat plán proti mně!"
 yearly.1041.secret_wicked.desc: "Ale, ale, ale. Jak rozkošně zvrácené. Podle tohoto vyděračského dopisu [suspicious.GetFirstNameNoTooltip] [secret.Custom('SecretDescriptionThirdPerson')]!"
 yearly.1041.secret_angry.desc: "Zděšeně přelétnu dopis očima. Obsahuje přesvědčivé obvinění, podle něhož [suspicious.GetFirstNameNoTooltip] [secret.Custom('SecretDescriptionThirdPerson')]!"
 yearly.1041.a.good: "Já... omlouvám se. Neměl[Select_CString(ROOT.Char.IsFemale, 'a jsem ani tušení!', ' jsem ani tušení!')]"
 yearly.1041.a.bad: "Písemný důkaz. Jak ohleduplné."
 yearly.1041.friend.tt: "Kdybych nepokazil[Select_CString(ROOT.Char.IsFemale, 'a', '')] překvapení, které chystal[Select_CString(suspicious.IsFemale, 'a', '')] [suspicious.GetTitledFirstName], snížil by se můj [Concept('stress','stres')|E] a zvýšilo mé [Concept('opinion','mínění')|E] o [secret_friend.GetTitledFirstName]"
 yearly.1041.gift.tt: "Kdybych nepokazil[Select_CString(ROOT.Char.IsFemale, 'a', '')] překvapení, které chystal[Select_CString(suspicious.IsFemale, 'a', '')] [suspicious.GetTitledFirstName], získal bych určité množství [Concept('gold','zlata')|E]"
 yearly.1041.feast.tt: "Kdybych nepokazil[Select_CString(ROOT.Char.IsFemale, 'a', '')] překvapení, které chystal[Select_CString(suspicious.IsFemale, 'a', '')] [suspicious.GetTitledFirstName], získal bych [Concept('prestige','prestiž')|E]"
 yearly.1042.start.desc: "Zatímco se přehrabuji ve věcech [suspicious.GetTitledFirstName], jejich majitel[Select_CString(suspicious.IsFemale, 'ka spí jako nemluvně', ' spí jako nemluvně')]. Uspávadlo, které jsem přidal[Select_CString(ROOT.Char.IsFemale, 'a', '')] do nápoje [suspicious.GetFirstNameNoTooltip], zabralo dokonale! Během několika minut najdu kus pergamenu, který přede mnou [suspicious.GetFirstNameNoTooltip] [Select_CString(suspicious.IsFemale, 'schovala', 'schoval')]...\n\n"
 yearly.1042.friend.desc: "Někdo přijímá pozvání a píše, jakou má radost a jak se těší, že stráví nějaký čas se... mnou! A ten dopis napsal můj přítel [secret_friend.GetTitledFirstName]!\n\nZdá se, že pro mě [suspicious.GetFirstNameNoTooltip] chystá překvapení v podobě společného výletu s [secret_friend.GetFirstNameNoTooltip]!"
 yearly.1042.gift.desc: "Je to dopis. Píše se v něm o nějaké peněžní transakci a také o zakázce, podle níž má vzniknout [ROOT.Char.Custom('SuitableGiftItem')] se znakem dynastie [ROOT.Char.GetDynastyNameNoTooltip]...\n\nZdá se, že pro mě [suspicious.GetFirstNameNoTooltip] chystá dárek!"
 yearly.1042.feast.desc: "Je to seznam jídel a nápojů a také spousta známých jmen, mezi nimi i můj oblíbený [ROOT.Char.Custom('MusicalPerformer')]...\n\nZdá se, že pro mě [suspicious.GetFirstNameNoTooltip] chystá překvapení v podobě hostiny na mou počest!"
 yearly.1042.a.good: "Tohle jsem nečekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 yearly.1042.good.tt: "Až [suspicious.GetTitledFirstName] překvapení odhalí, budu předstírat, že jsem o ničem nevěděl[Select_CString(ROOT.Char.IsFemale, 'a', '')]"
 yearly.1043.t: "Přistižení při činu"
 yearly.1043.desc: "Přehrabuji se ve věcech [suspicious.GetTitledFirstName] a cítím, jak mi zrychluje tep. Kde je ten zatracený pergamen?\n\n„Ehm... [ROOT.Char.GetFirstNameNoTooltip]? Co tady děláš?!“\n\nOtočím se a spatřím [suspicious.GetFirstNameNoTooltip], jak ospale, ale očividně rozhořčeně klopýtá z postele. Zdá se, že uspávadlo, které jsem přidal[Select_CString(ROOT.Char.IsFemale, 'a', '')] do večerního nápoje [suspicious.GetFirstNameNoTooltip], nezabralo tak, jak jsem zamýšlel[Select_CString(ROOT.Char.IsFemale, 'a', '')]..."
 yearly.1043.a: "Já... už jsem byl[Select_CString(ROOT.Char.IsFemale, 'a na odchodu.', ' na odchodu.')]"
 yearly.1043.a.tt: "Nezjistil[Select_CString(ROOT.Char.IsFemale, 'a jsi', ' jsi')], co [suspicious.GetTitledFirstName] skrývá"
 yearly.1044.t: "Projev vděčnosti"
 yearly.1044.start.desc: "Na rtech [suspicious.GetTitledFirstName] pohrává šibalský úsměv. „Vím, že se poslední dobou chovám podivně, a za to se omlouvám. Ale mám k tomu dobrý důvod!“\n\n"
 yearly.1044.friend.desc: "[suspicious.GetFirstNameNoTooltip] mi pokyne, ať jdu za ním, a vyvede mě ven. Tam už na koni sedí [secret_friend.GetTitledFirstName], připraven[Select_CString(secret_friend.IsFemale, 'á na cestu', ' na cestu')]!\n\n„[Select_CString(suspicious.IsFemale, 'Naplánovala jsem', 'Naplánoval jsem')] pro vás dva malý výlet!“ pronese [suspicious.GetFirstNameNoTooltip] nadšeně. „[Select_CString(suspicious.IsFemale, 'Říkala jsem si, že by vám prospělo strávit spolu trochu příjemného času!', 'Říkal jsem si, že by vám prospělo strávit spolu trochu příjemného času!')]“"
 yearly.1044.gift.desc: "[suspicious.GetFirstNameNoTooltip] mi podá úhledně zabalený dárek ozdobený barevnými stuhami. „[Select_CString(suspicious.IsFemale, 'Chtěla jsem tě překvapit.', 'Chtěl jsem tě překvapit.')] Nechal[Select_CString(suspicious.IsFemale, 'a jsem ho vyrobit na zakázku a existuje jen jediný.', ' jsem ho vyrobit na zakázku a existuje jen jediný.')] Tak do toho, otevři ho!“"
 yearly.1044.feast.desc: "[suspicious.GetFirstNameNoTooltip] mi pokyne, ať jdu za ním, a zavede mě do síně. Jakmile otevře dveře, někdo spustí veselou melodii. Ach... ta výzdoba, ta vůně! A všichni jsou tady!\n\n„Je to hostina na tvou počest! Hned ti přinesu pohár, ať si můžeš připít!“"
 yearly.1044.a: "Děkuji, [suspicious.GetFirstNameNoTooltip]!"
 yearly.1050.t: "Mistr soubojů"
 yearly.1050.angry.desc: "[angry_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přichází s ovázanou paží a očima planoucíma touhou po pomstě. Dozvídám se, že můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] [heir.GetTitledFirstName] poslední dobou „řádí“ po celém [title.GetNameNoTierNoTooltip].\n\n„Vaše [heir.Custom('GirlBoy')] si o sobě myslí, že je [Select_CString(heir.IsFemale, 'duelistka', 'duelista')]! [Select_CString(heir.IsFemale, 'Objevila se', 'Objevil se')] u mých dveří a přede všemi mě [Select_CString(heir.IsFemale, 'vyzvala', 'vyzval')] na souboj! Nezbývalo mi než přijmout. A není to poprvé. Jsem jen poslední z dlouhé řady obětí!“"
 yearly.1050.scared.desc: "[angry_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přichází ke dvoru s ovázanou paží a strachem v očích. Dozvídám se, že můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('heir'))] [heir.GetTitledFirstName] vyzývá lidi na souboje po celém [title.GetNameNoTierNoTooltip].\n\n„Odpusťte mi, [ROOT.Char.Custom('FormOfAddressForLiege')], ale tohle musí přestat. [heir.GetTitledFirstNameNoTooltip] se [Select_CString(heir.IsFemale, 'objevila', 'objevil')] u mých dveří a [Select_CString(heir.IsFemale, 'vyzvala', 'vyzval')] mě na souboj. Nezbývalo mi než přijmout. A není to poprvé. Jsem jen poslední z dlouhé řady obětí!“"
 yearly.1050.a: "Tyhle souboje okamžitě skončí."
 yearly.1050.b: "Nebezpečná záliba. Potřebuješ učitele."
 yearly.1050.c.failure.tt: "[heir.GetTitledFirstName] bude dál vyzývat lidi na souboje"
 yearly.1050.c.success.tt: "[heir.GetTitledFirstName] už nebude svádět souboje"
 yearly.1050.c.success.wounded.tt: "[heir.GetTitledFirstName] může být zraněn[Select_CString(heir.IsFemale, 'a', '')]"
 yearly.1050.c.failure.wounded.tt: "Mohu být zraněn[Select_CString(ROOT.Char.IsFemale, 'a', '')]"
 yearly.1050.c: "Pche! [Select_CString(heir.IsFemale, 'Tvá', 'Tvůj')] [heir.Custom2('RelationToMeShort', ROOT.Char)] ti ukáže, jak se to dělá!"
 yearly.1050.critical_success.desc: "Porazím [heir.GetFirstNameNoTooltip]"
 yearly.1050.failure.desc: "Prohraji souboj"
 yearly.1051.t: "Duelista se vrací"
 yearly.1051.victory.desc: "Když se [heir.GetTitledFirstName] vrátí ze svého dobrodružství, přijdou se podívat všichni dvořané. Někteří jásají a hlasitě dávají najevo svůj obdiv, jiní jsou... o poznání méně nadšení.\n\nNikdo však nemůže popřít, že [heir.GetFirstNameNoTooltip] [Select_CString(heir.IsFemale, 'prokázala, že je vynikající duelistkou', 'prokázal, že je vynikajícím duelistou')], když dokázala porazit jednoho [heir.GetLadyLord] za druhým."
 yearly.1051.murder.desc: "Ještě než [heir.GetTitledFirstName] vůbec otevře ústa, je mi jasné, že je zle. Takovou paniku jsem v očích [heir.GetFirstNameNoTooltip] ještě neviděl.\n\n„Prosím, [heir.Custom2('RelationToMeShort', ROOT.Char)], musíš mi pomoct. Nechtěl[Select_CString(heir.IsFemale, 'a jsem, aby...', ' jsem, aby...')] [angry_vassal_2.GetFirstNameNoTooltip] přece neměl[Select_CString(angry_vassal_2.IsFemale, 'a zemřít!', ' zemřít!')]“"
 yearly.1051.decent.desc: "[heir.GetTitledFirstName] se ze svých dobrodružství vrací jako [Select_CString(heir.IsFemale, 'silnější žena', 'silnější muž')]. Několik soubojů sice [Select_CString(heir.IsFemale, 'prohrála a rozhněvala', 'prohrál a rozhněval')] další z mých vazalů, ale také si připsala řadu vítězství a získala cenné zkušenosti.\n\nTeď by možná bylo načase usmířit [angry_vassal_2.GetTitledFirstName]. [heir.GetFirstNameNoTooltip] se k [angry_vassal_2.GetFirstNameNoTooltip] mohl[Select_CString(heir.IsFemale, 'a zachovat šetrněji', ' zachovat šetrněji')]..."
 yearly.1051.defeat.desc: "[heir.GetTitledFirstName] se konečně vrací se staženým ocasem. Ten pošetilý [heir.Custom('GirlBoy')] procestoval celé panství a vyzýval jednoho vazala za druhým, jen aby každý jediný souboj prohrál.\n\nPo potupné porážce od [angry_vassal_2.GetTitledFirstName] se zdá, že [heir.GetFirstNameNoTooltip] konečně pochopil[Select_CString(heir.IsFemale, 'a své ponaučení', ' své ponaučení')]."
 yearly.1051.great_victory_end.desc: "[heir.GetFirstNameNoTooltip] dokonce porazil[Select_CString(heir.IsFemale, 'a', '')] slavného šampiona [angry_vassal_2.GetTitledFirstName]!"
 yearly.1051.regular_victory_end.desc: "Říká se, že vítězství [heir.GetFirstNameNoTooltip] nad [angry_vassal_2.GetTitledFirstName] bylo obzvlášť působivé."
 yearly.1051.victorious.a: "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('heir'))|U], mám z tebe radost."
 yearly.1051.murder.a: "[angry_vassal_2.GetTitledFirstNameNoTooltip] [Select_CString(angry_vassal_2.IsFemale, 'zemřela', 'zemřel')] tvou rukou?!"
 yearly.1051.decent.a: "Dáš si teď konečně pokoj, [heir.GetFirstNameNoTooltip]?"
 yearly.1051.defeat.a: "Děláš mi ostudu."
 yearly.1060.t: "Nejstarší vtip na světě"
 yearly.1060.bed.desc: "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se podepře loktem a na rtech pohrává šibalský úsměv."
 yearly.1060.dance.desc: "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se ladně pohybuje do rytmu hudby a v očích se třpytí pobavení. Když nás tanec přivede blíž k sobě, nakloní se ke mně a zašeptá mi do ucha. "
 yearly.1060.dinner.desc: "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zakrouží pohárem [joker.Custom('RegionalDrink')] a se šibalským úsměvem se ke mně nakloní."
 yearly.1060.garden.desc: "Když se procházíme zahradami, [joker.Custom2('MyCharacterIntroduction', ROOT.Char)] se ke mně nakloní se šibalským úsměvem."
 yearly.1060.ride.desc: "[joker.Custom2('MyCharacterIntroduction', ROOT.Char)|U] přitáhne otěže svého koně a poplácá ho po krku. Když ke mně vzhlédne, všimnu si ruměnce ve tváři a šibalského výrazu v očích."
 yearly.1060.joke.desc: "\n\n„Tak tedy, [ROOT.Char.GetFirstNameNoTooltip]... Co muži visí u stehna a chce se zasunout do otvoru, do kterého už se mnohokrát zasouvalo?“"
