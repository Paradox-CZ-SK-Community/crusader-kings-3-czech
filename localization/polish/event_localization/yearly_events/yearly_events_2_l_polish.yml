 yearly.1070.start.desc: "Na [potential_soulmate.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] je něco zvláštního. Je to snad ten úsměv? Ten nezaměnitelný"
 yearly.1070.peal.desc: "zvonivý tón"
 yearly.1070.rumble.desc: "hluboký tón"
 yearly.1070.middle.desc: "smíchu, nebo snad"
 yearly.1070.benevolent.desc: "laskavost, s níž jedná s každým bez ohledu na původ?"
 yearly.1070.dominant.desc: "nezlomná železná vůle?"
 yearly.1070.submissive.desc: "mírná a poddajná povaha?"
 yearly.1070.extroverted.desc: "schopnost proměnit každý rozhovor v něco tak snadného a příjemného?"
 yearly.1070.introverted.desc: "výmluvnost očí, které toho dokážou tolik říct i beze slov?"
 yearly.1070.emotional.desc: "nespoutaná a vášnivá povaha?"
 yearly.1070.levelheaded.desc: "vznešený a neochvějný klid?"
 yearly.1070.intelligent.desc: "obdivuhodně bystrý rozum?"
