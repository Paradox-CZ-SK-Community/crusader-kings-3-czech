 yearly.1070.zealous.desc: "neochvějná zbožnost, jejímž středem je samotný [ROOT.Char.GetFaith.HighGodName]?"
 yearly.1070.fallback.desc: "ty krásné oči?"
 yearly.1070.end.desc: "\n\nNedokážu přesně říct, čím to je, ale jedním jsem si jist. Když je [potential_soulmate.GetFirstNameNoTooltip] nablízku, jen těžko se dokážu soustředit na cokoli jiného."
