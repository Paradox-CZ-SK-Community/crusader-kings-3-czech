 yearly.1080.t: "Plíživé podezření"
 yearly.1080.normal.desc: "Na [suspicious.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)] je něco zvláštního, ale nedokážu přesně říct co. Možná mi jen příliš bují představivost, přesto mě ten zlověstný pocit nenechává v noci spát."
 yearly.1080.paranoid.desc: "[suspicious.GetTitledFirstName], [suspicious.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('suspicious'))], něco kuje, o tom není pochyb! Proč se jinak pořád plíží kolem a hází po mně ty podivné pohledy? A mé věci nejsou tam, kde jsem je nechal! Copak [suspicious.GetFirstNameNoTooltip] chodí do mé [ROOT.Char.Custom('GetChamber')] bez dovolení?!\n\nTen sladký úsměv mě neoklame. Vím, co se pod ním skrývá!"
 yearly.1080.a.friend: "[investigator.GetFirstNameNoTooltip] to musí prošetřit. Na takového přítele je spoleh."
 yearly.1080.a.spymaster: "Ať to prošetří [investigator.GetFirstNameNoTooltip]."
 yearly.1080.a.success: "Vyšetřování skončí úspěchem"
