l_polish:
 yearly.3001.t: "Varování v pravý čas"
 yearly.3001.desc: "Obdržel[Select_CString(ROOT.Char.IsFemale, 'a', '')] jsem zprávu od [neighbor.GetName]. Píše se v ní, že [vassal.GetTitledFirstName], můj [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))], žádá o podporu ve spiknutí proti mně!\n\n„Ze všeho nejvíc si cením věrnosti,“ stojí v dopise od [neighbor.GetFirstNameNoTooltip], „a právě proto vám to sděluji.“"
 yearly.3001.friend_backs_neighbor: "\n\nNaštěstí je tu můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] [friend.GetFirstName], aby mi [Select_CString(friend.IsFemale, 'poradila', 'poradil')]. „[Select_CString(friend.IsFemale, 'Už nějakou dobu jsem měla', 'Už nějakou dobu jsem měl')] o [vassal.GetFirstNameNoTooltip] své pochybnosti. Tohle je téměř potvrzuje.“"
 yearly.3001.friend_backs_vassal: "\n\nNaštěstí je tu můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))] [friend.GetFirstName], aby mi [Select_CString(friend.IsFemale, 'poradila', 'poradil')]. „Odmítám uvěřit, že by [vassal.GetFirstNameNoTooltip] [Select_CString(vassal.IsFemale, 'klesla', 'klesl')] tak hluboko.“"
 yearly.3001.a: "Promluvím si s [vassal.GetFirstNameNoTooltip] osobně."
 yearly.3001.confront: "[vassal.GetFirstNameNoTooltip] se dozví o mém podezření"
 yearly.3001.true_tt: "Mé obvinění je pravdivé"
 yearly.3001.false_tt: "Mé podezření je neopodstatněné"
 yearly.3001.false_use_tt: "[vassal.GetTitledFirstNameNoTooltip] využije této urážky ve svůj prospěch"
 yearly.3001.b: "[Select_CString(vassal.IsFemale, 'Je vinna', 'Je vinen')] a já [vassal.GetFirstNameNoTooltip] veřejně obviním!"
 yearly.3001.c: "Slovům [neighbor.GetTitledFirstNameNoTooltip] nelze věřit. Moji vazalové mají mou podporu!"
 yearly.3001.c.if_wrong_tt: "Pokud je [vassal.GetFirstNameNoTooltip] neloajální"
 yearly.3001.c.if_right: "Pokud je [vassal.GetFirstNameNoTooltip] loajální"
 yearly.3001.vassal_gains_strength: "Plány, které spřádá [vassal.GetTitledFirstNameNoTooltip], nabývají na síle"
 yearly.3001.d: "#EMP Věděl[Select_CString(ROOT.Char.IsFemale, 'a jsem', ' jsem')] jsem to!#! [vassal.GetFirstNameNoTooltip] za to zaplatí!"
 yearly.3002.t: "Přiznání"
 yearly.3002.desc: "Když [vassal.GetTitledFirstName] spatří dopis od [neighbor.GetTitledFirstName], nezbývá než se přiznat.\n\n„Nikdy jsem... Nebylo to... Jak to mohu napravit?“ [vassal.GetFirstNameNoTooltip] [vassal.Custom('quirk_neg_present')], ale strach ve tváři nelze přehlédnout."
 yearly.3002.a: "Udělej všechno, co řeknu, a budeš ušetřen[Select_CString(vassal.IsFemale, 'a', '')]."
 yearly.3002.b: "Odpustím ti, pokud se všichni dozvědí o mé velkorysosti."
 yearly.3003.t: "Urážlivé obvinění"
 yearly.3003.desc: "Když [vassal.GetTitledFirstName] ukážu dopis od [neighbor.GetTitledFirstName], přichází nejprve zmatení a pak hněv. „Věříte [neighbor.GetFirstNameNoTooltip] víc než mně? Copak jsem vám vždy věrně nesloužil[Select_CString(vassal.IsFemale, 'a', '')]?“\n\nRozhořčení [vassal.GetFirstNameNoTooltip] ve mně zasévá semínko pochybností. Možná jsem jednal[Select_CString(ROOT.Char.IsFemale, 'a', '')] příliš ukvapeně. Měl[Select_CString(ROOT.Char.IsFemale, 'a bych', ' bych')] to napravit dřív, než náš vztah poškodím ještě víc!"
 yearly.3003.friend: "\nNaštěstí zasáhne můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))]. „Jen jsem vás chtěl[Select_CString(friend.IsFemale, 'a varovat', ' varovat')] před pomluvami, které šíří [neighbor.GetTitledFirstName],“ říká [friend.GetTitledFirstName]."
 yearly.3003.a: "Ano. Vlastně tě chci za tvou věrnost odměnit!"
 yearly.3003.b: "Vždy jsi mi věrně sloužil[Select_CString(vassal.IsFemale, 'a', '')]."
 yearly.3003.public_expression_of_gratitude: "Veřejné vyjádření vděčnosti"
 yearly.3003.vassal_loss_of_faith: "Neupřímná omluva"
 yearly.3003.c: "Ano, přesně jak říká [friend.GetFirstNameNoTooltip]!"
 yearly.3003.c.enable: "Tato možnost je dostupná díky vysoké [Concept('diplomacy','diplomacii')|E] postavy [friend.GetTitledFirstNameNoTooltip]"
 yearly.3004.t: "Všechno na světle"
 yearly.3004.desc: "Na shromáždění mnoha svých vazalů prohlásím, že vím o zradě, kterou chystá [vassal.GetTitledFirstName].\n\nMnoho dalších vazalů se postaví na mou stranu. „Všichni víme, že je to pravda. Co s [vassal.GetFirstNameNoTooltip] bude?“"
 yearly.3004.a: "[vassal.GetFirstNameNoTooltip] svou zradu odčiní."
 yearly.3004.b: "Postarám se, aby mi [vassal.GetFirstNameNoTooltip] už nemohl[Select_CString(vassal.IsFemale, 'a', '')] ublížit."
 yearly.3004.c: "Postarám se #EMP opravdu důkladně#!, aby mi [vassal.GetFirstNameNoTooltip] už nemohl[Select_CString(vassal.IsFemale, 'a', '')] ublížit."
 yearly.3005.desc: "Na shromáždění mnoha svých vazalů prohlásím, že vím o zradě, kterou chystá [vassal.GetTitledFirstName]. Ostatní vazalové však dopis od cizího panovníka [neighbor.GetTitledFirstName] za přesvědčivý důkaz rozhodně nepovažují.\n\n[vassal.GetFirstName] promluví za všechny. „Jaký máte důkaz? Kdyby stačil pouhý dopis, nebyli bychom snad vinni #EMP všichni#!?“ Shromáždění souhlasně zamručí. Tohle se mi vymyká z rukou!"
 yearly.3005.a: "Raději převezmu iniciativu!"
 yearly.3005.a.rousing_speech: "Strhující projev o věrnosti"
 yearly.3005.a.stumbling_apology: "Rozpačitá omluva"
 yearly.3005.b: "[vassal.GetFirstNameNoTooltip] je zrádce a podle toho s [Select_CString(vassal.IsFemale, 'ní', 'ním')] bude naloženo!"
 yearly.3011.t: "Druhý dojem"
 yearly.3011.desc: "Před další hostinou na počest mého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('liege'))] [liege.GetTitledFirstName] mě navštíví [vassal.GetTitledFirstName].\n\n„Ani jeden z nás není u [liege.GetFirstNameNoTooltip] právě v největší přízni,“ poznamená [vassal.GetFirstNameNoTooltip], „ale kdybychom na hostině připravili velkolepé představení, mohli bychom si u [liege.GetFirstNameNoTooltip] polepšit.“"
 yearly.3011.a: "Já na to poskytnu zlato!"
 yearly.3011.a.success: "Velkolepé představení"
 yearly.3011.a.failure: "Dostatečně zábavné"
 yearly.3011.b: "Dokážu sehnat baviče, které potřebujeme."
 yearly.3011.c: "Myslím, že bude lepší soustředit se na maličkosti."
 yearly.3011.d: "Přesně vím, jak připravit pořádnou podívanou."
 yearly.3012.desc: "Těla se vlní a proplétají a tanečníci, které jsme s [vassal.GetTitledFirstName] najali, nechávají všechny v úžasu. Po jídle ke mně osobně přistoupí [liege.GetTitledFirstName]. „To tedy bylo něco, [ROOT.Char.GetFirstNameNoTooltip].“\n\nS [vassal.GetFirstName] si nemůžeme pomoci a vyměníme si úsměv."
 yearly.3012.a: "Copak bychom mohli podniknout příště..."
 yearly.3012.b: "Tohle byl výborný nápad, [vassal.GetFirstNameNoTooltip]."
 yearly.3013.desc: "Přes všechno vykopávání nohou a mávání pažemi se nezdá, že by [liege.GetTitledFirstName] tanečníci, které jsme s [vassal.GetTitledFirstName] najali na hostinu, nějak zvlášť zaujali. [liege.GetFirstNameNoTooltip] si s úsměvem vyslechne jejich věnování nám oběma, ale vzápětí obrátí pozornost zpět k jídlu.\n\n[vassal.GetFirstName] se na mě nejistě podívá, ale [liege.GetFirstName] přece jen působí docela spokojeně."
 yearly.3013.a: "Ať tak či onak, budeme stát při sobě."
 yearly.3013.b: "Alespoň jsme udělali, co jsme mohli."
 yearly.3014.desc: "Tanečníci, které jsme s [vassal.GetTitledFirstName] najali, jsou pohroma. Zmítají se a poskakují tak, že připomínají spíš komediantskou družinu než slíbené elegantní představení. Ani [liege.GetTitledFirstName] nevypadá nadšeně, že ho během večeře někdo ruší.\n\nTeprve když začnou své vystoupení věnovat nám, dochází mi, že to vůbec není skupina, se kterou jsme se dohodli! Kdo mohl-\n[nemesis.GetTitledFirstName]!"
 yearly.3014.a: "Povím ti, který ničema nám tohle překazil, [vassal.GetFirstNameNoTooltip]."
 yearly.3014.b: "Tohle není naše vina, [vassal.GetFirstNameNoTooltip]."
 yearly.3021.t: "Na smrtelné posteli"
 yearly.3021.desc: "Teď už je jasné, že [deathbed_character.GetTitledFirstName], můj starý [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('deathbed_character'))], na tomto světě dlouho nezůstane.\n\nKdyž přicházím ke smrtelnému loži, vím, že [deathbed_character.GetFirstNameNoTooltip] prožil[Select_CString(deathbed_character.IsFemale, 'a dlouhý život', ' dlouhý život')]. Na rozloučení ale nikdy není dost času, že? Držím [deathbed_character.GetFirstNameNoTooltip] za ruku, dokud nevychladne a dech se navždy nezastaví."
 yearly.3021.a: "Kéž nalezneš pokoj v příštím životě, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('deathbed_character'))]."
 yearly.3031.t: "O krok napřed"
 yearly.3031.desc: "[fellow_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] i já se těšíme přízni našeho lenního pána [liege.GetTitledFirstName]. Když však dojde na rozdávání titulů, poct a bohatství, jeden z nás bude vždy prvním mezi rovnými.\n\nNadcházející shromáždění v [capital.GetNameNoTierNoTooltip], kde sídlí [liege.GetTitledFirstName], mi dává příležitost zajistit, aby právě mně patřila jeho přízeň."
 yearly.3031.friend: "Po mém boku navíc bude můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('best_friend'))] [best_friend.GetTitledFirstName], což mi jistě pomůže."
 yearly.3031.rival: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('nemesis'))] [nemesis.GetTitledFirstName] se ovšem nijak netají úmyslem mé snahy překazit!"
 yearly.3031.a: "S mým výřečným jazykem to bude hračka."
 yearly.3031.a.best_friend_success: "[best_friend.GetFirstNameNoTooltip] odvede pozornost [fellow_vassal.GetFirstNameNoTooltip]"
 yearly.3031.a.success: "Získám si přízeň [liege.GetTitleAsNameNoTooltip]"
 yearly.3031.a.failure: "[fellow_vassal.GetFirstNameNoTooltip] si získá přízeň [liege.GetTitleAsNameNoTooltip]"
 yearly.3031.a.nemesis_failure: "[nemesis.GetFirstNameNoTooltip] mě očerní"
 yearly.3031.b: "Ukážu, že [ROOT.Char.GetFaith.HighGodName] mi už svou přízeň prokazuje."
 yearly.3031.b.success: "Zapůsobím na [liege.GetTitleAsNameNoTooltip]"
 yearly.3031.b.failure: "[liege.GetTitleAsNameNoTooltip] je více ohromen[Select_CString(liege.IsFemale, 'a', '')] postavou [fellow_vassal.GetFirstNameNoTooltip]"
 yearly.3031.c: "Vím přesně, jak upoutat pozornost [liege.GetFirstNameNoTooltip]..."
 yearly.3031.c.unlock_tt: "Tato možnost je dostupná díky tomu, že tě [liege.GetTitledFirstNameNoTooltip] považuje za přitažlivého[Select_CString(ROOT.Char.IsFemale, 'u', '')]"
 yearly.3031.c.consequence: "[liege.GetFirstNameNoTooltip] o tebe může projevit další zájem"
 yearly.3031.c.success: "Upoutaná pozornost"
 yearly.3031.d: "My vazalové bychom měli spolupracovat, ne soupeřit!"
 yearly.3040.t: "Příkladná [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U] zbožnost"
 yearly.3040.desc: "[Select_CString(ROOT.Char.IsFemale, 'Jsem známá jako hluboce zbožná žena.', 'Jsem známý jako hluboce zbožný muž.')] [ROOT.Char.GetFaith.HighGodName] přece musí mou oddanost ocenit nejen v příštím životě, ale i v tomto, ne?\n\nNěkterým lidem by rozhodně neuškodilo připomenout, že [ROOT.Char.GetFaith.HighGodNameAlternate] mi prokazuje svou přízeň."
 yearly.3040.a: "O mé oddanosti by se mělo hlásat z věží!"
 yearly.3040.b: "Letos jsem byl[Select_CString(ROOT.Char.IsFemale, 'a k', ' k')] [ROOT.Char.GetFaith.HouseOfWorship] až příliš shovívavý[Select_CString(ROOT.Char.IsFemale, 'á', '')]..."
 yearly.3040.c: "[religious_head.GetTitleAsNameNoTooltip] jistě ocení [Select_CString(ROOT.Char.IsFemale, 'zbožnou panovnici', 'zbožného panovníka')]!"
 yearly.3040.d: "[ROOT.Char.Custom('DefaultPriestTitlePlural')] už ke mně vzhlížejí s úctou."
 yearly.3041.opening: "[vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.3041.desc: "Vím, že jste oddaným služebníkem a [ROOT.Char.GetFaith.HighGodNameAlternate] má ve vás věrného následovníka. Proto doufám, že pochopíte, že naše povinnosti vůči vám nám ztěžují konání díla, jež nám ukládá [ROOT.Char.GetFaith.HighGodName].\n\nNemohli byste nám některé z těch nejtěžších povinností odpustit?"
 yearly.3041.a: "Mé zlato slouží tomu, koho představuje [ROOT.Char.GetFaith.HighGodNamePossessive]."
 yearly.3041.b: "Své lidi využijte jinde."
 yearly.3041.c: "#EMP Já#! tu konám dílo, které žádá [ROOT.Char.GetFaith.HighGodName]!"
 yearly.3051.t: "Po právu"
 yearly.3051.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))] mě upozornil[Select_CString(councillor.IsFemale, 'a', '')] na obskurní zákon platný v [county.GetName], podle kterého nesmí být jeho ochráncem nikdo jiný než [ROOT.Char.GetTitleAsNameNoTooltip].\n\nZa normálních okolností by tak zastaralý zákon nikoho nezajímal, tentokrát mi však nabízí jedinečnou příležitost ukázat [vassal.GetTitledFirstName], mému [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))] a současnému vládci [county.GetNameNoTooltip], kde je jeho místo."
 yearly.3051.a: "Zákon mluví jasně. [ROOT.Char.GetTitleAsNameNoTooltip] má plná práva!"
 yearly.3051.b: "[vassal.GetFirstNameNoTooltip] si smí titul ponechat, z mé milosti."
 yearly.3061.t: "Jak naložit s kagoty"
 yearly.3061.desc: "Jen pomyšlení na to mě rozčiluje! V [county.GetName] žijí kagoti volně bok po boku s normálními lidmi a za své prohřešky se sotva setkávají s opovržením! A to všechno přímo podél Svatojakubské cesty!\n\nSamozřejmě nesmějí chodit bosí, dotýkat se zábradlí na mostech ani přijímat svaté přijímání přímo z rukou [ROOT.Char.GetFaith.PriestNeuter], ale kromě toho neděláme #EMP vůbec nic!#!\n\nTahle nesnesitelná situace nemůže pokračovat. Co když něco chystají?!"
 yearly.3061.a: "Uvalím na kagoty těžké daně a udržím je tam, kam patří!"
 yearly.3061.b: "Musí být odděleni od spořádané společnosti!"
 yearly.3061.b.flavor: "Oddělené kagotské čtvrti, znamení rudé blanité nohy, vlastní menší dveře do kostelů... Ano, to by mělo stačit."
 yearly.3061.c: "Nemohli bychom se prostě pokusit žít vedle sebe?"
 yearly.3061.d: "Bezbožní bídáci! Vyžeňte je a zabavte jim majetek!"
 yearly.3071.t: "Jen noční můra"
 yearly.3071.desc: "Probudím se s křikem a srdce mi zběsile buší.\n\nByl[Select_CString(ROOT.Char.IsFemale, 'a jsem nahá a spoutaná', ' jsem nahý a spoutaný')] řetězy, nebo snad připoutaný[Select_CString(ROOT.Char.IsFemale, 'á obojkem', ' obojkem')]? Kolem mě se seběhl tucet mužů a žen s kozlími hlavami a začali mě kousat a rvát ze mě kusy kůže...\n\nPak jsem se náhle stal[Select_CString(ROOT.Char.IsFemale, 'a jednou z těch nestvůr', ' jednou z těch nestvůr')]. Ostrými zuby jsem rval[Select_CString(ROOT.Char.IsFemale, 'a', '')] vlastní maso, polykal[Select_CString(ROOT.Char.IsFemale, 'a', '')] jeho cáry a pil[Select_CString(ROOT.Char.IsFemale, 'a', '')] krev... #EMP srkal[Select_CString(ROOT.Char.IsFemale, 'a', '')] ji...#! Nikdy jsem nezažil[Select_CString(ROOT.Char.IsFemale, 'a', '')] nic děsivějšího než okamžik, kdy jsem viděl[Select_CString(ROOT.Char.IsFemale, 'a', '')], jak z očí mého zohaveného těla mizí život.\n\nAle byl to jen sen. Jen sen."
 yearly.3071.a: "Modlitby za ochranu, kterou mi poskytne [ROOT.Char.GetFaith.HighGodName], mě uklidní."
 yearly.3071.b: "Proč mi ta chuť pořád nejde z hlavy?!"
