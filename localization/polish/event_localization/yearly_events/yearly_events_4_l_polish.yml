l_polish:
 yearly.4001.opening: "[neighboring_ruler.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.4001.desc: "[vassal.Custom2('YourCharacterIntroduction', ROOT.Char)|U] "
 yearly.4001.desc_opinion: "mě těžce [Select_CString(vassal.IsFemale, 'urazila', 'urazil')]. Dokonce [Select_CString(vassal.IsFemale, 'měla', 'měl')] tu drzost nazvat mě před celým mým dvorem [neighboring_ruler.Custom2('InsultAdjectiveArticle', SCOPE.sC('vassal'))] [neighboring_ruler.Custom2('InsultNoun', SCOPE.sC('vassal'))]."
 yearly.4001.desc_lover: "se [Select_CString(vassal.IsFemale, 'opovážila svést', 'opovážil svést')] [neighboring_ruler_secondary.GetTitledFirstName], což je můj [neighboring_ruler.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler_secondary'))], k tělesnému hříchu."
 yearly.4001.desc_murder: "v nečestné rvačce [Select_CString(vassal.IsFemale, 'zabila', 'zabil')] [neighboring_ruler_secondary.GetTitledFirstName], což je můj [neighboring_ruler.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler_secondary'))]."
 yearly.4001.desc_rival: "Od někoho, kdo se stýká právě s #EMP tebou#!, jsem asi nemohl[Select_CString(neighboring_ruler.IsFemale, 'a čekat nic lepšího', ' čekat nic lepšího')], ale tohle je nepřijatelné!"
 yearly.4001.desc_end: "Za tuto urážku požaduji zadostiučinění!"
 yearly.4001.a: "Udělám cokoli, abych to napravil[Select_CString(ROOT.Char.IsFemale, 'a', '')]!"
 yearly.4001.b: "[vassal.GetFirstNameNoTooltip] tě veřejně požádá o odpuštění."
 yearly.4001.c: "Ha! Ta se ti povedla, [vassal.GetFirstNameNoTooltip]!"
 yearly.4011.t: "Jedna ruka"
 yearly.4011.desc: "V poslední době často vídám [heir.Custom2('MyCharacterIntroduction', ROOT.Char)] a [vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] poblíž [ROOT.Char.Custom('ResidenceBuilding')], zabrané do dlouhých rozhovorů. Očividně našli společnou řeč!"
 yearly.4011.a: "Vidět takové přátelství růst... Pomohu mu rozkvést!"
 yearly.4011.b: "Určitě nemají za lubem nic dobrého. Tohle teď skončí."
 yearly.4011.c: "Tááákže... o čem se bavíte?"
 yearly.4011.c.success: "Má společnost je vítaná"
 yearly.4011.c.toast.success: "Má společnost byla vítaná"
 yearly.4011.c.failure: "Působím příliš zvědavě"
 yearly.4011.c.toast.failure: "Působil[Select_CString(ROOT.Char.IsFemale, 'a jsem příliš zvědavě', ' jsem příliš zvědavě')]"
 yearly.4021.t: "Hra, která zašla příliš daleko"
 yearly.4021.desc: "Jaká hrůza! Společná hra, při níž byli [child.Custom2('MyCharacterIntroduction', ROOT.Char)] a [vassal.GetTitledFirstNamePossessive] [vassal.Custom2('RelationToMeShort', SCOPE.sC('vassal_kid'))] [vassal_kid.GetTitledFirstName], skončila náhle a tragicky. [vassal_kid.GetFirstNameNoTooltip] při strašlivé nehodě [Select_CString(vassal_kid.IsFemale, 'přišla', 'přišel')] o život!\n\n„Přísahám, [child.Custom2('RelationToMeShort', ROOT.Char)]. Byla to jen hra!“ ujišťuje mě [child.GetTitledFirstNameNoTooltip], zatímco [vassal.GetTitleAsNameNoTooltip] požaduje spravedlnost."
 yearly.4021.a: "Na mé dítě nesáhneš!"
 yearly.4021.b: "Následkům svých činů nikdo neunikne."
 yearly.4021.c: "Slibuji, že své dítě potrestám!"
 yearly.4021.c_success: "[child.GetTitledFirstNameNoTooltip] poslouchá a vezme si z toho ponaučení"
 yearly.4021.c_failure: "[child.GetTitledFirstNameNoTooltip] se naučí, že činy nemají žádné následky"
 yearly.4021.d: "Musíš mému dítěti odpustit! Prosím, udělám cokoli..."
 yearly.4022.t: "Návrat"
 yearly.4022.desc: "„Ahoj, [child.Custom2('RelationToMeShort', ROOT.Char)].“ [ROOT.Char.Custom2('MyCharacterIntroduction', SCOPE.sC('child'))] po pobytu ve vězení [actor.GetTitledFirstNamePossessive] trochu [Select_CString(child.IsFemale, 'pohubla', 'pohubl')], ale [child.Custom('quirk_neg_adjective')] úsměv, který se [Select_CString(child.IsFemale, 'jí rozlévá po tváři', 'mu rozlévá po tváři')], působí živěji než kdy dřív.\n\n„Už se nemůžu dočkat, až ti poděkuji za lekci o tom, že za své činy musím nést následky.“"
 yearly.4022.a: "Vítej doma, [child.GetFirstNameNoTooltip]."
 yearly.4031.t: "Vrah mezi námi"
 yearly.4031.desc_opening: "Ten pach mě zasáhne ještě dřív, než se otevřou dveře. Těžký, masitý odér prostupuje celým okolím. Je to zápach čerstvé smrti.\n\n"
 yearly.4031.desc_physician: "„Další vražda, [ROOT.Char.Custom('FormOfAddressForLiege')].“ [physician.GetTitledFirstName] si po prohlídce těla utírá krvavé ruce do zástěry a vstává. „Tohoto nesmyslného zabijáka musíme zastavit!“"
 yearly.4031.desc: "Našlo se další tělo... Zatím šlo jen o bezvýznamné lidi, díky [ROOT.Char.GetFaith.HighGodName], ale významnější obyvatelé už začínají být nervózní."
 yearly.4031.a: "Prohledám celý [ROOT.Char.Custom('ResidenceBuilding')] a toho vraha najdu!"
 yearly.4031.tt: "Je zahájeno vyšetřování"
 yearly.4031.b: "Pohřběme tělo a na tuhle hrůzu zapomeňme."
 yearly.4031.b_every_courtier: "Každý dvořan"
 yearly.4031.c: "Jako můj lékař bys [Select_CString(physician.IsFemale, 'měla', 'měl')] ty těla prostudovat."
 yearly.4061.t: "Moudrý blázen"
 yearly.4061.desc_opening: "„Jmenuji se [hodja.GetTitledFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]. Přicházím před vás, abych se s vámi podělil o svou moudrost.“\n\n"
 yearly.4061.desc_guard: "[guard.Custom2('MyCharacterIntroduction', ROOT.Char)|U], který toho muže přivedl, se tváří skepticky."
 yearly.4061.desc: "Strážný, který toho muže přivedl, se tváří skepticky."
 yearly.4061.desc_ending: "„Přijel k [ROOT.Char.Custom('ResidenceBuilding')] na oslu, [ROOT.Char.Custom('FormOfAddressForLiege')]. A seděl na něm pozpátku.“"
 yearly.4061.a: "Prosím, podělte se se mnou o svou moudrost."
 yearly.4061.a_success: "Získáš několik cenných poznatků"
 yearly.4061.a_failure: "Jeho příběhy tě jen zmatou"
 yearly.4061.b: "Nechť tvá moudrost obohatí celý dvůr!"
 yearly.4061.c: "Na blázny nemám čas."
 yearly.4061.c.tt: "Propustíš toho muže"
 yearly.4061.d: "Zábavné! Ať pobaví i prostý lid."
 yearly.4061.d.tt: "Necháš ho vést ulicemi jako blázna pro pobavení davu"
 yearly.4071.t: "Pátrání po vědění"
 yearly.4071.desc: "[councillor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází s hromadou knih v náručí.\n\n„[Select_CString(councillor.IsFemale, 'Všimla jsem si', 'Všiml jsem si')] vaší žízně po vědění, můj [councillor.Custom2('RelationToMe', ROOT.Char)]."
 yearly.4071.desc_focus: "Zvlášť vašich nedávných výprav do oblasti [ROOT.Char.Custom('LifestyleFocus')]!"
 yearly.4071.desc_no_focus: "A to ani nemluvím o vašem dřívějším studiu [ROOT.Char.Custom('education_conversation_subject')]!"
 yearly.4071.desc_ending: "Možná by vás tyto knihy mohly zaujmout?“"
 yearly.4071.a: "Prostudují je všechny, ve jménu [ROOT.Char.GetFaith.ReligiousText]!"
 yearly.4071.b: "Rozdejte je mezi mé [ROOT.Char.Custom('GetCourtierPlural')]."
 yearly.4081.t: "Překlady"
 yearly.4081.desc: "„Místní učenci potřebují podporu při překládání knih z řečtiny do arabštiny, [ROOT.Char.Custom('FormOfAddressForLiege')]. Jejich práce prospívá celému arabskému světu!“\n\n[councillor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] mi [Select_CString(councillor.IsFemale, 'přinesla', 'přinesl')] seznam učenců, které bych mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] podpořit, i knih, na nichž právě pracují."
 yearly.4081.a: "#EMP De materia Medica#!... To zní zajímavě!"
 yearly.4081.a.tt: "Sponzoruješ překlad knihy o lékařství"
 yearly.4081.b: "Ach, tahle! #EMP O vzestupech#!."
 yearly.4081.b.tt: "Sponzoruješ překlad knihy o astronomii"
 yearly.4081.c: "#EMP Základy#! vypadají nejpřínosněji."
 yearly.4081.c.tt: "Sponzoruješ překlad knihy o matematice"
 yearly.4081.d: "Mám lepší způsoby, jak utratit své peníze."
 yearly.4081.d.tt: "Nebudeš financovat žádného učence"
 yearly.4081.toast: "Kniha přeložena"
 yearly.4081.e: "#EMP O duši#!? Fascinující..."
 yearly.4081.e.tt: "Sponzoruješ překlad knihy o lidských pohnutkách"
 yearly.4081.f: "Co je tohle... #EMP Thúkydidés#!?"
 yearly.4081.f.tt: "Sponzoruješ překlad knihy o vojenských dějinách"
 yearly.4081.g: "Tenhle #EMP Plútarchos#! mě zaujal."
 yearly.4081.g.tt: "Sponzoruješ překlad životopisného díla"
 yearly.4081.tt: "Knihu obdržíš"
 yearly.4091.t: "Učenci z Bagdádu"
 yearly.4091.desc_opening: "[ward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] a já se procházíme Bagdádem, když narazíme na"
 yearly.4091.desc_house: "Dům moudrosti."
 yearly.4091.desc_no_house: "několik místních učenců."
 yearly.4091.desc: "\n\n„Zdravíme vás, [ROOT.Char.GetTitledFirstNameNoTooltip]. A zdravíme i vás, [Select_CString(ward.IsFemale, 'mladá paní', 'mladý pane')]. V právě probíhající debatě máme jedno volné místo. Nechtěl by se k nám někdo z vás připojit?“"
 yearly.4091.a: "Jen do toho, [ward.GetFirstNameNoTooltip]."
 yearly.4091.a.tt: "Tímto dále prohloubíš vzdělání [ward.GetFirstNameNoTooltip]"
 yearly.4091.b: "Ano, rád[Select_CString(ROOT.Char.IsFemale, 'a', '')] se připojím."
