l_polish:
 yearly.5001.t: "Nešťastné setkání"
 yearly.5001.duelling.desc: "Náhle zaslechnu ozvěnu dvou důvěrně známých hlasů a zvuk mě zavede až ke komnatám, kde bydlí [bickering_spouse.GetFirstName], [Select_CString(bickering_spouse.IsFemale, 'má manželka', 'můj manžel')].\n\nKdyž dorazím, s úžasem zjistím, že [bickering_spouse.GetFirstName] vede prudkou hádku s mou láskou [bickering_lover.GetFirstName]. Jakmile mě [bickering_attacker.GetFirstNameNoTooltip] spatří, rychle [Select_CString(bickering_attacker.IsFemale, 'tasí svou zbraň a zaútočí', 'tasí svou zbraň a zaútočí')] na [bickering_defender.GetFirstNameNoTooltip],"
 yearly.5001.backstabbing.desc: "Právě se chystám opustit jídelní síň a vrátit se do svých komnat, když v odlehlém koutě zahlédnu svou lásku [bickering_lover.GetFirstNameNoTooltip], jak rozmlouvá s [Select_CString(bickering_spouse.IsFemale, 'mou manželkou', 'mým manželem')]. [bickering_defender.GetFirstName] se otočí, aby mě [Select_CString(bickering_defender.IsFemale, 'přivítala', 'přivítal')], a nevědomky se tak vystaví útoku [bickering_attacker.GetFirstName],"
 yearly.5001.duelling.attackerwins.desc: "kter[Select_CString(bickering_attacker.IsFemale, 'á svou oběť srazí', 'ý svou oběť srazí')] k zemi a nechá [bickering_loser.GetFirstNameNoTooltip] mrtv[Select_CString(bickering_loser.IsFemale, 'ou', 'ého')] krvácet na podlaze."
 yearly.5001.backstabbing.attackerwins.desc: "kter[Select_CString(bickering_attacker.IsFemale, 'á okamžitě využije', 'ý okamžitě využije')] nepozornosti svého soka a vrazí dýku [bickering_loser.GetFirstNameNoTooltip] do plic."
 yearly.5001.duelling.defenderwins.desc: "ale [bickering_defender.GetFirstNameNoTooltip] útok na poslední chvíli zablokuje, prudce [bickering_loser.GetFirstNameNoTooltip] odstrčí a vzápětí [Select_CString(bickering_defender.IsFemale, 'probodne', 'probodne')] protivníka jeho vlastní zbraní."
 yearly.5001.backstabbing.defenderwins.desc: "jenže [bickering_winner.GetFirstNameNoTooltip] zřejmě vycítí hrozící nebezpečí, okamžitě se obrátí zpět k [bickering_loser.GetFirstNameNoTooltip], zkroutí protivníkovi zápěstí a bodne jej jeho vlastní dýkou."
 yearly.5001.lover.epilogue.desc: "\n\n„[Select_CString(bickering_winner.IsFemale, 'Udělala jsem', 'Udělal jsem')] to pro nás,“ tvrdí [bickering_winner.GetFirstNameNoTooltip] a s náznakem lítosti na mě pohlédne. „Abychom mohli být spolu.“"
 yearly.5001.spouse.epilogue.desc: "\n\n„Muselo se to stát,“ tvrdí [bickering_winner.GetFirstNameNoTooltip] a s náznakem lítosti na mě pohlédne. „To ty jsi nás do toho dostal[Select_CString(ROOT.Char.IsFemale, 'a', '')].“"
 yearly.5001.a.a.spouse: "Je mi to opravdu líto... Měl[Select_CString(bickering_spouse.IsFemale, 'a jsi na to plné právo', ' jsi na to plné právo')]."
 yearly.5001.a.a.lover: "A přesto si přeji, aby to nemuselo dojít až sem..."
 yearly.5001.a.b.spouse: "Svůj názor jsi dal[Select_CString(bickering_spouse.IsFemale, 'a', '')] jasně najevo. Teď to nechme za sebou."
 yearly.5001.a.b.lover: "Svůj názor jsi dal[Select_CString(bickering_lover.IsFemale, 'a', '')] jasně najevo. Teď to nechme za sebou."
 yearly.5001.a.c.spouse: "Jen doufám, že v sobě dokážu najít sílu ti odpustit."
 yearly.5001.a.c.lover: "Možná to skutečně byla jediná cesta..."
 yearly.5001.b: "Jak jsi mohl[Select_CString(bickering_winner.IsFemale, 'a', '')]?! Zmiz, než tě nechám zavřít do žaláře."
 yearly.5001.c: "Na tohle nezapomenu, [bickering_winner.GetFirstNameNoTooltip]."
 yearly.5001.d: "Ne. Celé panství se dozví o tvém zrádném zločinu!"
 yearly.5001.e: "Máš pravdu! Teď už mezi námi nic nestojí!"
 yearly.5001.f: "Dvůr se dozví, co se ti [bickering_loser.GetFirstNameNoTooltip] pokusil[Select_CString(bickering_loser.IsFemale, 'a', '')] udělat."
 yearly.5001.g: "Tenhle zločin nemohu nechat bez trestu. Stráže!"
 yearly.5001.i: "Netušil[Select_CString(ROOT.Char.IsFemale, 'a jsem', ' jsem')], že dokážeš být tak krut[Select_CString(bickering_winner.IsFemale, 'á', 'ý')]... Miluji to!"
 yearly.5002.t: "Staré výčitky"
 yearly.5002.spouse.desc: "Už uplynuly celé měsíce od chvíle, kdy jsem [bickering_loser.GetFirstName] poslal[Select_CString(ROOT.Char.IsFemale, 'a', '')] na onen svět, aby jej soudil [ROOT.Char.GetFaith.HighGodName]. Očistil[Select_CString(ROOT.Char.IsFemale, 'a jsem', ' jsem')] tak čest své rodiny a učinil[Select_CString(ROOT.Char.IsFemale, 'a jsem přítrž', ' jsem přítrž')] nevěrným choutkám svého [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scoped_ruler'))]. Přesto mě přízračná tvář mého soka dál pronásleduje noc co noc a připravuje mě o spánek spravedlivých..."
 yearly.5002.lover.desc: "Už uplynuly celé měsíce od chvíle, kdy jsem ze světa odstranil[Select_CString(ROOT.Char.IsFemale, 'a', '')] krutého žalářníka své lásky, abychom se mohli osvobodit od jeho manželské tyranie. Přesto mě přízračná tvář mého soka dál pronásleduje noc co noc a trýzní mě až ze záhrobí..."
 yearly.5002.forgiven.desc: "\n\n[scoped_ruler.GetFirstName] mě stále ujišťuje, že mi mé činy nemá za zlé, ale pocit viny mě přesto začíná zcela přemáhat."
 yearly.5002.unforgiven.desc: "\n\nChladná lhostejnost [scoped_ruler.GetFirstNameNoTooltip] k mému trápení všechno jen zhoršila a mé srdce naplnila výčitkami za násilí, kterého jsem se dopustil[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 yearly.5002.a: "Kéž by mi [scoped_ruler.GetFirstNameNoTooltip] dokázal[Select_CString(scoped_ruler.IsFemale, 'a', '')] pomoci..."
 yearly.5002.b: "Jedině [ROOT.GetCharacter.GetFaith.HighGodName] mi může dopřát klid!"
 yearly.5002.c: "[bickering_loser.GetFirstNameNoTooltip] mě přestane trýznit, teprve až se k [Select_CString(bickering_loser.IsFemale, 'ní', 'němu')] připojím."
 yearly.5003.spouse.desc: "[Select_CString(bickering_winner.IsFemale, 'Má manželka', 'Můj manžel')] [bickering_winner.GetFirstName] od posledního nešťastného setkání s mou láskou už není jako dřív. [Select_CString(bickering_winner.IsFemale, 'Tvrdí, že ji', 'Tvrdí, že ho')] od onoho osudného dne pronásleduje pomstychtivý duch [bickering_loser.GetFirstName]."
 yearly.5003.lover.desc: "[bickering_winner.GetFirstName] od posledního nešťastného setkání s [bickering_loser.GetFirstName] už není jako dřív. [Select_CString(bickering_winner.IsFemale, 'Tvrdí, že ji', 'Tvrdí, že ho')] od onoho osudného dne pronásleduje pomstychtivý duch [bickering_loser.GetFirstNameNoTooltip]."
 yearly.5003.forgiven.desc: "\n\n[Select_CString(bickering_winner.IsFemale, 'Obává se, že jí', 'Obává se, že mu')] strašlivá vzpomínka na tajný zločin pomalu stravuje mysl i duši."
 yearly.5003.unforgiven.desc: "\n\n[bickering_winner.GetFirstNameNoTooltip] mě úpěnlivě prosí o odpuštění za strašlivý zločin spáchaný mým jménem a je přesvědčen[Select_CString(bickering_winner.IsFemale, 'á', 'ý')], že jedině mé rozhřešení může zachránit jeho mysl i duši."
 yearly.5003.a: "Dobrá, [bickering_winner.GetFirstNameNoTooltip]. Odpouštím ti."
 yearly.5003.b.forgiven: "Obávám se, že už pro tebe nemohu nic udělat."
 yearly.5003.b.forgotten: "Je mi líto, ale tohle udělat nemohu."
 yearly.5003.b.callous: "Můžeš laskavě přestat plýtvat mým časem svými bludy?"
 yearly.5003.c: "Je to jen to, co si odporný vrah jako ty zaslouží."
 yearly.5004.desc: "[scoped_ruler.GetFirstName] mi konečně [Select_CString(scoped_ruler.IsFemale, 'odpustila', 'odpustil')] a s tímto odpuštěním jsem znovu [Select_CString(ROOT.Char.IsFemale, 'nalezla', 'nalezl')] klid. [bickering_loser.GetFirstName] už mé sny nebude nikdy strašit."
 yearly.5004.a: "[Select_CString(bickering_loser.IsFemale, 'I vzpomínka na ni', 'I vzpomínka na něj')] brzy vybledne..."
 yearly.5005.desc: "[Select_CString(ROOT.Char.IsFemale, 'Byla', 'Byl')] jsem hlupák, když jsem [Select_CString(ROOT.Char.IsFemale, 'doufala', 'doufal')], že mi [scoped_ruler.GetFirstName] pomůže. [Select_CString(scoped_ruler.IsFemale, 'Vždycky to byla malicherná a zlomyslná žena', 'Vždycky to byl malicherný a zlomyslný muž')]. Mé trápení odbyl[Select_CString(scoped_ruler.IsFemale, 'a', '')] a vysmál[Select_CString(scoped_ruler.IsFemale, 'a', '')] se mi za mou slabost s tím, že si všechno, co se mi děje, zasloužím."
 yearly.5005.a: "Proč mi na tom netvorovi vůbec někdy záleželo?"
 yearly.5006.epilogue.desc: "[bickering_winner.GetFirstName] se nedokáže vyrovnat s pocitem viny za své činy, a proto se [Select_CString(bickering_winner.IsFemale, 'rozhodla', 'rozhodl')] zříci světských záležitostí a zbytek života věnovat víře, jejímž nejvyšším bohem je [bickering_winner.GetFaith.HighGodName]."
 yearly.5006.b.forgiven: "Pak odejdi v pokoji, pokud si to skutečně přeješ."
 yearly.5006.b.upset: "Jak mi tohle můžeš udělat?!"
 yearly.5006.b.default: "Chápu..."
 yearly.5007.t: "Prázdné noci"
 yearly.5007.desc: "V posledních týdnech se mi v myšlenkách často vrací mé poslední setkání s [bickering_loser.GetFirstName]. Už je to dlouho, co mi život připadal tak naplněný jako ve chvíli, kdy mě na kůži hřála krev mého soka.\n\nZdá se, že [scoped_ruler.GetFirstName] to cítí stejně. Nikdy jsme si nebyli bližší než tehdy, když jsme spolu sdíleli to důvěrné vzrušení z vraždy, ale teď se od sebe pomalu vzdalujeme..."
 yearly.5007.a: "Možná je čas znovu rozdmýchat plameny."
 yearly.5007.a.tt: "[bickering_winner.GetFirstName] bude ochotněji vstupovat do mých vražedných spiknutí."
 yearly.5007.b: "Myslím, že už jsem toho [Select_CString(ROOT.Char.IsFemale, 'udělala dost', 'udělal dost')]."
 yearly.5008.desc: "V posledních týdnech se mi v myšlenkách často vrací [bickering_loser.GetFirstName] a předčasná smrt, kterou mu[Select_CString(bickering_loser.IsFemale, ' ', '')] přinesl[Select_CString(bickering_winner.IsFemale, 'a', '')] [bickering_winner.GetFirstName]. Nikdy jsem si se svým [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bickering_winner'))] nebyl[Select_CString(ROOT.Char.IsFemale, 'a', '')] tak blízko jako ve chvíli, kdy jsme spolu sdíleli to důvěrné vzrušení z vraždy. Ještě lákavější je, že [bickering_winner.GetFirstName] podle všeho touží znovu prožít ten nezapomenutelný okamžik stejně jako já a znovu rozdmýchat plameny naší lásky."
 yearly.5008.a: "Tentokrát ale oběť vyberu já!"
 yearly.5008.b: "Ne. Tahle hra už mě omrzela."
 yearly.5009.desc: "Návrh odmítnut"
 yearly.5010.t: "Soucitný svár"
 yearly.5010.desc: "Mé útrapy pohnuly [bickering_vassal_1.GetTitledFirstName] natolik, že mi už mnohokrát [Select_CString(bickering_vassal_1.IsFemale, 'nabídla', 'nabídl')] radu i pomoc ve snaze ulehčit mi břemeno mých povinností.\n\nTato pozornost však rozhněvala [bickering_vassal_2.GetTitledFirstName]. „[bickering_vassal_1.GetFirstNameNoTooltip] není [Select_CString(bickering_vassal_1.IsFemale, 'důvěryhodná', 'důvěryhodný')]! Je to jen lest, jak vás využít, můj pane.“"
 yearly.5010.a: "Důvěru vložím jen v ty, kteří si ji zaslouží."
 yearly.5010.b: "Copak my tři nedokážeme najít společnou řeč?"
 yearly.5010.midwaysuccess.desc: "Podařilo se mi urovnat některé spory mezi [bickering_vassal_1.GetTitledFirstName] a [bickering_vassal_2.GetTitledFirstName]."
 yearly.5010.midwayfail.desc: "Nepodařilo se mi urovnat spor mezi [bickering_vassal_1.GetTitledFirstName] a [bickering_vassal_2.GetTitledFirstName]."
 yearly.5010.midwaycritfail.desc: "Můj pokus přimět [bickering_vassal_1.GetTitledFirstName] a [bickering_vassal_2.GetTitledFirstName], aby odložili své neshody, skončil jen tím, že se na mě rozzlobili oba."
 yearly.5010.c: "Tvého varování budu dbát, [bickering_vassal_2.GetFirstNameNoTooltip]."
 yearly.5010.d: "Tak tedy braň čest svého [ROOT.Char.GetTitleTierName]!"
 yearly.5010.deceitfail.desc: "Nepodařilo se mi lstí přimět [bickering_vassal_2.GetTitledFirstName], aby vyzval[Select_CString(bickering_vassal_2.IsFemale, 'a', '')] [bickering_vassal_1.GetTitledFirstName] na souboj."
 yearly.5011.desc: "Stačí jen málo, aby vzájemné opovržení mezi [bickering_vassal_1.GetFirstName] a [bickering_vassal_2.GetFirstName] přerostlo v otevřené nepřátelství. Po několika ostrých urážkách nakonec [bickering_vassal_2.GetFirstNameNoTooltip] pozvedne svou zbraň, [bickering_vassal_2.Custom('signature_weapon')], proti [bickering_vassal_1.GetFirstNameNoTooltip], který[Select_CString(bickering_vassal_1.IsFemale, 'á odpoví stejným způsobem', ' odpoví stejným způsobem')].\n\nPo krátké výměně prudkých úderů nakonec vítězí [bickering_vassal_winner.GetTitledFirstNameNoTooltip], zatímco protivník zůstává krvácet na zemi."
 yearly.5011.a.new: "Nikdy mi nedošlo, jak [Select_CString(bickering_vassal_winner.IsFemale, 'oddaná', 'oddaný')] mi jsi, [bickering_vassal_winner.GetFirstNameNoTooltip]..."
 yearly.5011.b.new: "Zdá se, že činy skutečně mluví hlasitěji než slova."
 yearly.5011.b.old: "Co bych si bez tebe počal[Select_CString(ROOT.Char.IsFemale, 'a', '')], [bickering_vassal_winner.GetFirstNameNoTooltip]?"
 yearly.5011.c: "Proč jsi mě musel[Select_CString(bickering_vassal_winner.IsFemale, 'a', '')] zatahovat do všech těchhle problémů, [bickering_vassal_winner.GetFirstNameNoTooltip]?"
 tooltip.5010.d.vassalsfight: "Úspěšně vyprovokuji oba vazaly, aby se pustili do boje"
 tooltip.5010.d.vassalsfightfail: "[bickering_vassal_2.GetFirstName] se odmítne nechat zatáhnout do boje"
 tooltip.5010.b.success: "Podaří se mi oba vazaly usmířit"
 tooltip.5010.b.fail: "Nepodaří se mi oba vazaly usmířit"
 tooltip.5010.b.critfail: "Rozhněvám oba vazaly"
 tooltip.5010.d.vassalsfight.effect: "[bickering_vassal_2.GetFirstName] vyzve [bickering_vassal_1.GetFirstName] na souboj na život a na smrt!"
 yearly.5020.t: "Znepokojivá výuka"
 yearly.5020.opening: "[helpful_councillor.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.5020.intro.desc: "[scoped_heir.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))], se v poslední době velmi zajímá o mou práci. Jako [helpful_councillor.Custom('CouncilPosition')] mám jistě mnoho co předat. Pokud mi laskavě dovolíte, [Select_CString(helpful_councillor.IsFemale, 'ráda se výuky ujmu', 'rád se výuky ujmu')]."
 yearly.5020.older.desc: "[scoped_heir.GetWomanMan|U] se v tak mladém věku jistě naučí mnohé"
 yearly.5020.younger.desc: "Jistě se toho naučí mnohé"
 yearly.5020.chancellor.desc: "o politice, etiketě a diplomacii."
 yearly.5020.marshal.desc: "o výcviku vojska, plánování obléhání a dalších válečných záležitostech."
 yearly.5020.steward.desc: "o počtech a správě půdy i bohatství."
 yearly.5020.spymaster.desc: "o diskrétnosti a získávání informací, které nemají být snadno dostupné."
 yearly.5020.court_chaplain.desc: "o dějinách našeho panství a tradicích našeho lidu."
 yearly.5020.kurultai.desc: "o jízdní lukostřelbě a pasteveckých způsobech stepí."
 yearly.5020.a: "Pokud skutečně víš, co děláš..."
 yearly.5020.a.e.tt: "[helpful_councillor.GetFirstNameNoTooltip] ukáže [scoped_heir.GetFirstNameNoTooltip], jaké povinnosti má [helpful_councillor.GetCouncilTitle]"
 yearly.5020.b.a: "[Select_CString(scoped_heir.IsFemale, 'Její budoucnost se tě netýká.', 'Jeho budoucnost se tě netýká.')]"
 yearly.5020.b.b: "[Select_CString(scoped_heir.IsFemale, 'Raději se její výuky ujmu osobně!', 'Raději se jeho výuky ujmu osobně!')]"
 yearly.5020.c: "Nejdřív si ověřím, zda mluvíš pravdu!"
 tooltip.5020.c.success: "Odhalím skutečné důvody, proč chce [helpful_councillor.GetFirstNameNoTooltip] vzdělávat [scoped_heir.GetFirstNameNoTooltip]"
 tooltip.5020.c.success.effect: "Výuka pokračuje bez přerušení"
 tooltip.5020.c.fail: "Nepodaří se mi odhalit skutečné důvody, proč chce [helpful_councillor.GetFirstNameNoTooltip] vzdělávat [scoped_heir.GetFirstNameNoTooltip]"
 tooltip.5020.c.fail.effect: "Možná budu muset zasáhnout"
 tooltip.5020.c.critfail: "[helpful_councillor.GetFirstNameNoTooltip] zjistí, že ji[Select_CString(helpful_councillor.IsFemale, ' nechávám špehovat', ' nechávám špehovat')]"
 tooltip.5020.c.critfail.effect: "[helpful_councillor.GetFirstName] se urazí a přestane mentorovat [scoped_heir.GetFirstName]"
 yearly.5020.ruler.diplomacy.tt: "[Select_CString(scoped_heir.IsFemale, 'Pokusíš se zlepšit její', 'Pokusíš se zlepšit jeho')] [Concept('diplomacy','diplomacii')|E]"
 yearly.5020.ruler.martial.tt: "[Select_CString(scoped_heir.IsFemale, 'Pokusíš se zlepšit její', 'Pokusíš se zlepšit jeho')] [Concept('martial','válečnictví')|E]"
 yearly.5020.ruler.stewardship.tt: "[Select_CString(scoped_heir.IsFemale, 'Pokusíš se zlepšit její', 'Pokusíš se zlepšit jeho')] [Concept('stewardship','správcovství')|E]"
 yearly.5020.ruler.intrigue.tt: "[Select_CString(scoped_heir.IsFemale, 'Pokusíš se zlepšit její', 'Pokusíš se zlepšit jeho')] [Concept('intrigue','pletichářství')|E]"
 yearly.5020.ruler.learning.tt: "[Select_CString(scoped_heir.IsFemale, 'Pokusíš se zlepšit její', 'Pokusíš se zlepšit jeho')] [Concept('learning','učenost')|E]"
 yearly.5020.councillor.diplomacy.tt: "[helpful_councillor.GetFirstName] [Select_CString(scoped_heir.IsFemale, 'zlepší její', 'zlepší jeho')] [Concept('diplomacy','diplomacii')|E]"
 yearly.5020.councillor.martial.tt: "[helpful_councillor.GetFirstName] [Select_CString(scoped_heir.IsFemale, 'zlepší její', 'zlepší jeho')] [Concept('martial','válečnictví')|E]"
 yearly.5020.councillor.stewardship.tt: "[helpful_councillor.GetFirstName] [Select_CString(scoped_heir.IsFemale, 'zlepší její', 'zlepší jeho')] [Concept('stewardship','správcovství')|E]"
 yearly.5020.councillor.intrigue.tt: "[helpful_councillor.GetFirstName] [Select_CString(scoped_heir.IsFemale, 'zlepší její', 'zlepší jeho')] [Concept('intrigue','pletichářství')|E]"
 yearly.5020.councillor.learning.tt: "[helpful_councillor.GetFirstName] [Select_CString(scoped_heir.IsFemale, 'zlepší její', 'zlepší jeho')] [Concept('learning','učenost')|E]"
 yearly.5021.deceitfulcouncillor.desc: "Mé podezření bylo oprávněné! Po několika dnech sledování je naprosto jasné, co má [helpful_councillor.GetFirstName] za lubem. Jediné, oč mu jde, je obrátit proti mně mého vlastního [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))]. [scoped_heir.GetFirstName] se má stát nástrojem proti mně."
 yearly.5021.honestcouncillor.desc: "Ani po důkladném sledování se mému špehovi nepodařilo zjistit nic, co by mě přimělo pochybovat o upřímnosti [helpful_councillor.GetFirstName].\n\nZdá se, že [helpful_councillor.GetFirstName] chce skutečně jen pomoci. [scoped_heir.GetFirstName] se díky této výuce může jednou stát mnohem lepším vládcem."
 yearly.5021.a: "Není důvod bránit tomu, aby výuka pokračovala!"
 yearly.5021.b.a: "Už je nesmím nechávat spolu."
 yearly.5021.b.b: "Ale pořád tomu rádci nevěřím!"
 yearly.5021.c: "V mé radě už nemá co dělat!"
 yearly.5022.a: "Pak není důvod tomu dál bránit!"
 yearly.5023.desc: "[helpful_councillor.GetTitledFirstName] [Select_CString(helpful_councillor.IsFemale, 'chytila mého neschopného špeha', 'chytil mého neschopného špeha')]! Když vyšla najevo má nedůvěra, [helpful_councillor.GetFirstNameNoTooltip] se rozzuřil[Select_CString(helpful_councillor.IsFemale, 'a', '')] a stáhl[Select_CString(helpful_councillor.IsFemale, 'a', '')] svou nabídku výuky."
 yearly.5023.a: "[Select_CString(ROOT.Char.IsFemale, 'Jak jsem měla vědět', 'Jak jsem měl vědět')], že to myslí upřímně?"
 yearly.5024.deceitfulcouncillor.desc: "Něco není v pořádku. Jako [helpful_councillor.Custom('CouncilPosition')] má [helpful_councillor.GetFirstName] při výuce zajistit, aby [scoped_heir.GetFirstName], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))], lépe porozuměl vládnutí. Jenže výuka se podle všeho mnohem více točí kolem zpochybňování každého mého rozhodnutí."
 yearly.5024.deadlycouncillor.desc: "[helpful_councillor.GetFirstName] vtrhne do hlavního sálu. Ve tváři má výraz čirého zděšení a šaty celé od krve.\n\n„Lupiči!“ vykřikne téměř bez dechu. Jako [ROOT.Char.GetTitleTierName] sotva stačím zareagovat. [ROOT.Char.Custom('ResidenceBuilding')] je ještě dnes ráno místem, odkud [helpful_councillor.GetFirstNameNoTooltip] a [scoped_heir.GetFirstName] společně vyrážejí na obhlídku krajiny. „[scoped_heir.GetTitleTierNamePossessive] tělo jsem [Select_CString(helpful_councillor.IsFemale, 'nesla tak dlouho, jak jsem dokázala', 'nesl tak dlouho, jak jsem dokázal')], ale...“"
 yearly.5024.honestcouncillor.desc: "Výuka, kterou vede [helpful_councillor.GetCouncilTitle] [helpful_councillor.GetFirstName], už začíná přinášet ovoce.\n\n[scoped_heir.GetFirstName] [Select_CString(scoped_heir.IsFemale, 'se naučila mnohem víc, než jsem se odvažovala doufat', 'se naučil mnohem víc, než jsem se odvažoval doufat')], a své budoucí povinnosti bere mnohem vážněji než dříve."
 yearly.5024.a.a: "Skvělé! [Select_CString(ROOT.Char.IsFemale, 'Věděla jsem', 'Věděl jsem')], že [Select_CString(helpful_councillor.IsFemale, 'jí mohu věřit', 'mu mohu věřit')]!"
 yearly.5024.a.b: "[Select_CString(helpful_councillor.IsFemale, 'Jak mi tohle mohla udělat?!', 'Jak mi tohle mohl udělat?!')]"
 yearly.5024.a.c: "To není možné!"
 yearly.5024.b: "Nemohu tomu uvěřit. Za tím vším stojíš ty!"
 tooltip_yearly_5022_a: "Dovolíš [helpful_councillor.GetFirstName], aby pokračoval ve výuce."
 yearly.5030.opening: "[squealing_vassal.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.5030.earnestvassal.desc: "Odhalil[Select_CString(squealing_vassal.IsFemale, 'a jsem', ' jsem')] jsem o [blackmailed_vassal.GetTitledFirstName] něco skutečně otřesného. Nerad[Select_CString(squealing_vassal.IsFemale, 'a bych vás tím zatěžovala', ' bych vás tím zatěžoval')], ale musím vás varovat. [Select_CString(blackmailed_vassal.IsFemale, 'Tato žena před vámi skrývá tajemství nanejvýš znepokojivé povahy.', 'Tento muž před vámi skrývá tajemství nanejvýš znepokojivé povahy.')]"
 yearly.5030.selfishvassal.desc: "Píši vám kvůli skutečně otřesnému zjištění o [blackmailed_vassal.GetTitledFirstName]. [Select_CString(blackmailed_vassal.IsFemale, 'Tato žena se za vašimi zády oddává pochybným a nečestným činnostem.', 'Tento muž se za vašimi zády oddává pochybným a nečestným činnostem.')]\n\nUpřímně doufám, že vás toto citlivé sdělení přesvědčí o mé neochvějné věrnosti, [ROOT.Char.GetTitleTierName]."
 yearly.5030.a.a: "Velmi si tvé starostlivosti vážím, [squealing_vassal.GetFirstNameNoTooltip]."
 yearly.5030.a.b: "Na toto gesto nezapomenu, [squealing_vassal.GetFirstNameNoTooltip]."
 yearly.5030.a.tt: "[squealing_vassal.GetTitledFirstName] mi odhalí tajemství, které skrývá [blackmailed_vassal.GetTitledFirstName]"
 yearly.5030.secret.desc: "Tajemství odhaleno"
 yearly.5030.c: "Na tohle všechno raději zapomeň, [squealing_vassal.GetFirstNameNoTooltip]."
 yearly.5030.c.tt: "Tajemství [blackmailed_vassal.GetFirstName] proti této postavě nepoužiješ"
 yearly.5025.desc.a: "Díky mé nedávné výuce se [scoped_heir.GetFirstName] podařilo doplnit některé mezery ve vzdělání.\n\nNávrh [helpful_councillor.GetTitledFirstName] byl přesně tou pobídkou, kterou jsem potřeboval[Select_CString(ROOT.Char.IsFemale, 'a', '')], abych svému [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scoped_heir'))] pomohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] rozvinout část dosud nevyužitého nadání."
 yearly.5025.desc.b: "Mé nedávné pokusy pomoci [scoped_heir.GetFirstName] doplnit mezery ve vzdělání bohužel nepřinesly žádné ovoce.\n\nMožná jsem nabídku [helpful_councillor.GetTitledFirstName] neměl[Select_CString(ROOT.Char.IsFemale, 'a odmítat', ' odmítat')]..."
 yearly.5025.a: "Jsem na [Select_CString(scoped_heir.IsFemale, 'ni a její úspěchy hrdá', 'něj a jeho úspěchy hrdý')]."
 yearly.5025.b: "[Select_CString(scoped_heir.IsFemale, 'Ta dívka je zkrátka trochu pomalejší.', 'Ten chlapec je zkrátka trochu pomalejší.')]"
 yearly.5040.t: "Podezřelý rozhovor"
 yearly.5040.desc: "Při ranní procházce zahradami [ROOT.Char.Custom('ResidenceBuilding')] mi lehký vánek zanese k uším hlasy [whisperer_1.GetFirstName] a [whisperer_2.GetFirstName].\n\nOba dvořané spolu hovoří na nedalekém odlehlém místě a často se rozhlížejí, zda je někdo neposlouchá. Z této dálky většině slov nerozumím, ale jedno je zřejmé. Mluví o [scoped_vassal.GetTitledFirstName]."
 yearly.5040.a.a: "Nechám je spoutat a předat [scoped_vassal.GetFirstNameNoTooltip]."
 yearly.5040.a.b: "Musím [scoped_vassal.GetFirstNameNoTooltip] varovat!"
 yearly.5040.b: "Kdybych se jen dokázal[Select_CString(ROOT.Char.IsFemale, 'a', '')] dostat o něco blíž..."
 yearly.5040.b.success.desc.tt: "Zůstaneš neodhalen"
 yearly.5040.b.success.effect.tt: "Zjistíš, o čem se baví"
 yearly.5040.b.failure.desc.tt: "[whisperer_1.GetFirstNameNoTooltip] a [whisperer_2.GetFirstNameNoTooltip] si tě všimnou"
 yearly.5040.b.failure.effect.tt: "Výslech nic neodhalí"
 yearly.5040.c.a: "Copak [ROOT.Char.GetTitleTierName] nemá právo vědět, co skrýváte?"
 yearly.5040.c.b: "Musím zjistit, co skrývají, ať to stojí cokoli!"
 yearly.5040.c.success.tt: "Mučením dostaneš informace z [whisperer_1.GetFirstNameNoTooltip] a [whisperer_2.GetFirstNameNoTooltip]"
 yearly.5040.c.failure.tt: "[whisperer_1.GetFirstName] a [whisperer_2.GetFirstNameNoTooltip] odmítají spolupracovat"
 yearly.5040.d: "Eh, určitě nejde o nic důležitého..."
 yearly.5041.desc.a: "Podaří se mi přiblížit k oběma dvořanům, aniž by si mě všimli.\n\nMluví o spiknutí, které proti mně zosnoval[Select_CString(scoped_vassal.IsFemale, 'a', '')] [scoped_vassal.GetTitledFirstName]!"
 yearly.5041.desc.b: "Podaří se mi přiblížit k oběma dvořanům, aniž by si mě všimli.\n\nMluví o spiknutí, které [scoped_vassal.GetTitledFirstName] zosnoval[Select_CString(scoped_vassal.IsFemale, 'a', '')] přímo na mém dvoře!"
 yearly.5041.desc.c: "Podaří se mi přiblížit k oběma dvořanům, aniž by si mě všimli.\n\nZdá se, že probírají soukromý život [scoped_vassal.GetTitledFirstName] a jeden velmi pochybný zlozvyk."
 yearly.5041.a: "Zajímavé..."
 yearly.5042.desc.safetorture: "Chvíli trvá, než oba vězni začnou mluvit, ale [Select_CString(dummy_jailor_gender.IsFemale, 'má žalářnice je trpělivá žena', 'můj žalářník je trpělivý muž')]. Po několika hodinách výslechu jsou oba spiklenci připraveni vyzradit své tajemství."
 yearly.5042.desc.deadlytorture: "Vězni jsou zarputilejší, než jsem čekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Po dlouhé noci výslechu však žalářník ztratí trpělivost. Do rána jsou oba dvořané mrtví, ale ještě před smrtí své tajemství vyzradí."
 yearly.5042.desc.a: "\n\nZdá se, že [scoped_vassal.GetTitledFirstName] proti mně něco chystá!"
 yearly.5042.desc.b: "\n\nZdá se, že [scoped_vassal.GetTitledFirstName] něco chystá přímo na mém dvoře!"
 yearly.5042.desc.c: "\n\nPředmětem jejich rozhovoru byl pochybný zlozvyk [scoped_vassal.GetTitledFirstName], o kterém jsem dosud neměl[Select_CString(ROOT.Char.IsFemale, 'a ani tušení', ' ani tušení')]."
 yearly.5042.a.a: "Jak šťastný a vzrušující objev!"
 yearly.5042.a.b: "Krutá cena za životně důležitou informaci."
 yearly.5040.torturefail.desc: "Výslech bohužel nepřinesl žádné výsledky"
 yearly.5040.deceitfail.desc: "[whisperer_1.GetFirstName] a [whisperer_2.GetFirstName] si mě všimnou a spěšně se vrátí do [ROOT.Char.Custom('ResidenceBuilding')]"
 yearly.5043.torturedeadlyfail.desc: "Můj výslech byl pro oba vězně příliš krutý.\n\nVydechli naposledy dřív, než mi stačili prozradit své tajemství."
 yearly.5043.a.a: "Taková ztráta času..."
 yearly.5043.a.b: "Proč jen nepromluvili?"
 yearly.5050.t: "Manželské výčitky"
 yearly.5050.desc.a: "„To je naprosto nepřijatelné!“\n\n[scoped_spouse.GetFirstName] vtrhne do [ROOT.Char.Custom('GetChamber')], ve tváři rud[Select_CString(scoped_spouse.IsFemale, 'á vzteky', 'ý vzteky')] a křičí tak hlasitě, že [Select_CString(scoped_spouse.IsFemale, 'ji', 'ho')] musí slyšet celý [ROOT.Char.Custom('ResidenceBuilding')].\n\n„[slighting_courtier.GetTitledFirstName] právě [Select_CString(slighting_courtier.IsFemale, 'urazila', 'urazil')] mou čest! Žádám, abys tu [slighting_courtier.Custom2('InsultAdjective', SCOPE.sC('scoped_spouse'))] [slighting_courtier.Custom2('InsultNoun', SCOPE.sC('scoped_spouse'))] vyhnal[Select_CString(ROOT.Char.IsFemale, 'a', '')] z našeho [ROOT.Char.Custom('GetCourt')]!“"
 yearly.5050.desc.b: "Překvapí mě, když ve své pracovně najdu [Select_CString(scoped_spouse.IsFemale, 'svou manželku', 'svého manžela')], jak se tam sklíčeně skrývá. Z výrazu [scoped_spouse.GetFirstName] je zřejmé, že se něco děje, ale chvíli mi trvá přesvědčit [Select_CString(scoped_spouse.IsFemale, 'ji', 'ho')], aby se mi [Select_CString(scoped_spouse.IsFemale, 'svěřila', 'svěřil')].\n\n„Má lásko, musím se ti přiznat, že mě [slighting_courtier.GetFirstName] těžce [Select_CString(slighting_courtier.IsFemale, 'urazila', 'urazil')]. Už nesnesu pomyšlení, že bych měl[Select_CString(scoped_spouse.IsFemale, 'a být nablízku tak hrubé ženě', ' být nablízku tak hrubému muži')].“"
 yearly.5050.a.a: "[Select_CString(slighting_courtier.IsFemale, 'Do zítřka bude pryč!', 'Do zítřka bude pryč!')]"
 yearly.5050.b.a: "Neobtěžuj mě takovými nesmysly."
 yearly.5050.b.b: "Nemožné! [slighting_courtier.GetFirstNameNoTooltip] je přece [Select_CString(slighting_courtier.IsFemale, 'tak milá žena', 'tak milý muž')]!"
 yearly.5050.b.c: "Myslím, že trochu přeháníš, drahá[Select_CString(scoped_spouse.IsFemale, '', 'ý')]."
 yearly.5050.c: "Proč mi rovnou neřekneš všechno?"
 yearly.5050.c.success.desc.tt: "Probereš s [scoped_spouse.GetFirstNameNoTooltip] podrobnosti incidentu"
 yearly.5050.c.success.effect.tt: "Zjistíš, zda je [scoped_spouse.GetFirstNameNoTooltip] upřímn[Select_CString(scoped_spouse.IsFemale, 'á', 'ý')]"
 yearly.5050.c.failure.desc.tt: "[scoped_spouse.GetFirstNameNoTooltip] odmítne naslouchat rozumu"
 yearly.5050.c.failure.effect.tt: "[Select_CString(scoped_spouse.IsFemale, 'Tvá manželka', 'Tvůj manžel')] požaduje, abys zasáhl[Select_CString(ROOT.Char.IsFemale, 'a', '')]"
 yearly.5051.desc.a.a: "Čím více o celé záležitosti slyším, tím více jsem přesvědčen[Select_CString(ROOT.Char.IsFemale, 'á', 'ý')], že mi [Select_CString(scoped_spouse.IsFemale, 'má manželka', 'můj manžel')] neříká pravdu. Když náš rozhovor skončí, mám silný dojem, že si [scoped_spouse.GetFirstName] celý příběh [Select_CString(scoped_spouse.IsFemale, 'vymyslela', 'vymyslel')], jen aby očernil[Select_CString(scoped_spouse.IsFemale, 'a', '')] [slighting_courtier.GetTitledFirstName]."
 yearly.5051.desc.a.b: "Po důkladném rozebrání tvrzení svého [Select_CString(scoped_spouse.IsFemale, 'manželky', 'manžela')] docházím k závěru, že [scoped_spouse.GetFirstName] mluví pravdu.\n\n[slighting_courtier.GetTitledFirstName] hluboce [Select_CString(slighting_courtier.IsFemale, 'urazila', 'urazil')] čest [scoped_spouse.GetFirstName] a tím zároveň [Select_CString(slighting_courtier.IsFemale, 'pošlapala', 'pošlapal')] mou pohostinnost."
 yearly.5051.z: "Kdyby se svět dozvěděl o tvém falešném obvinění..."
 yearly.5051.a: "Očekávám, že se [slighting_courtier.GetFirstNameNoTooltip] za tohle nepodložené obvinění omluvíš."
 yearly.5051.b: "Neboj se, vždy budu stát při tobě."
 yearly.5051.c: "Teď, když znám pravdu, mohu [slighting_courtier.GetFirstNameNoTooltip] postavit čelem."
 yearly.5051.d: "Myslím, že by ses měl[Select_CString(scoped_spouse.IsFemale, 'a pokusit', ' pokusit')] [slighting_courtier.GetFirstNameNoTooltip] odpustit."
 yearly.5052.desc.a: "Ani po důkladném rozebrání celé záležitosti s [scoped_spouse.GetFirstName] stále nevím, co si o tom všem myslet."
 yearly.5052.desc.b.a: "\n\n[ROOT.Char.GetTitleTierName] by měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] stát při svém protějšku. Přesto se nemohu zbavit pocitu, že mi [scoped_spouse.GetFirstNameNoTooltip] možná neříká celý příběh..."
 yearly.5052.desc.b.b: "\n\nNa druhou stranu [ROOT.Char.GetTitleTierName] by měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] stát při svém protějšku a [scoped_spouse.GetFirstName] vypadá tím, co se stalo, skutečně zdrcen[Select_CString(scoped_spouse.IsFemale, 'á', 'ý')]."
 yearly.5052.a: "Promluvím si s [slighting_courtier.GetTitledFirstNameNoTooltip]."
 yearly.5052.b: "Myslím, že bys na celou věc měl[Select_CString(scoped_spouse.IsFemale, 'a zapomenout', ' zapomenout')], [scoped_spouse.GetFirstNameNoTooltip]."
 yearly.5053.desc.a: "[Select_CString(scoped_spouse.IsFemale, 'Má manželka si', 'Můj manžel si')] zase stěžuje, že se k [Select_CString(scoped_spouse.IsFemale, 'ní', 'němu')] někdo chová bez úcty. Tentokrát [Select_CString(scoped_spouse.IsFemale, 'ji', 'ho')] podle všeho rozhněval[Select_CString(slighting_courtier.IsFemale, 'a', '')] [slighting_courtier.GetTitledFirstName]. Teď po mně [scoped_spouse.GetFirstName] požaduje, abych s tím něco udělal[Select_CString(ROOT.Char.IsFemale, 'a', '')]."
 yearly.5053.desc.b: "Ani mě nepřekvapí, když po mně [Select_CString(scoped_spouse.IsFemale, 'má manželka', 'můj manžel')] žádá, abych potrestal[Select_CString(ROOT.Char.IsFemale, 'a', '')] dalšího člena dvora, který údajně [Select_CString(scoped_spouse.IsFemale, 'pošpinil její čest', 'pošpinil jeho čest')]. Děje se to už tak často, že výčtu všech křivd, kterých se měl[Select_CString(slighting_courtier.IsFemale, 'a', '')] [slighting_courtier.GetTitledFirstName] dopustit, sotva věnuji pozornost."
 yearly.5053.desc.b.a: "\n\nNechápu, proč [scoped_spouse.GetFirstName] obtěžuje tolik lidí..."
 yearly.5053.desc.b.b: "\n\n[Select_CString(ROOT.Char.IsFemale, 'Podezíravější manželka', 'Podezíravější manžel')] by už možná začal[Select_CString(ROOT.Char.IsFemale, 'a mít podezření', ' mít podezření')], že [scoped_spouse.GetFirstName] zneužívá mé dobré vůle, aby se zbavil[Select_CString(scoped_spouse.IsFemale, 'a', '')] každého, koho nemá rád[Select_CString(scoped_spouse.IsFemale, 'a', '')]..."
 yearly.5053.a: "Dost. Z tohohle udělám odstrašující příklad."
 yearly.5053.b: "Neboj se, o [slighting_courtier.GetTitledFirstNameNoTooltip] se postarám."
 yearly.5053.c: "Dost už těch malicherností, [scoped_spouse.GetFirstNameNoTooltip]."
 yearly.5054.desc.a: "Od chvíle, kdy jsem [slighting_courtier.GetTitledFirstName] nechal[Select_CString(ROOT.Char.IsFemale, 'a', '')] hrůzně popravit, se [Select_CString(scoped_spouse.IsFemale, 'má manželka chová', 'můj manžel chová')] podivně. Jak jsem předpokládal[Select_CString(ROOT.Char.IsFemale, 'a', '')], dvořané už [scoped_spouse.GetFirstName] neobtěžují. Dokonce se k [Select_CString(scoped_spouse.IsFemale, 'ní', 'němu')] ani nepřibližují, pokud k tomu nejsou vyzváni. Přesto [scoped_spouse.GetFirstName] stále nevypadá spokojeně.\n\nPrávě naopak. Působí ještě zachmuřeněji než dřív."
 yearly.5054.desc.b: "Přesně jak jsem očekával[Select_CString(ROOT.Char.IsFemale, 'a', '')], bolestivá a veřejná poprava [slighting_courtier.GetTitledFirstName] za urážku mého [Select_CString(scoped_spouse.IsFemale, 'manželky', 'manžela')] vyslala dvoru přesně takové poselství, jaké bylo třeba.\n\nNikdo se neodvažuje [scoped_spouse.GetFirstName] odmlouvat, ani se přiblížit bez svolení. Konečně už se nemusím obávat nekonečných stížností."
 yearly.5054.a.a: "Myslím, že mi dlužíš poděkování, drahá[Select_CString(scoped_spouse.IsFemale, '', 'ý')]."
 yearly.5054.a.b: "Konečně klid."
 yearly.9020.t: "Mocný slon"
 yearly.9020.desc: "[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] ke mně přichází s úsměvem na tváři. [Select_CString(marshal.IsFemale, 'Vysvětluje mi', 'Vysvětluje mi')], že jsem od správce v [county.GetNameNoTooltip] dostal[Select_CString(ROOT.Char.IsFemale, 'a', '')] skutečně působivý dar, a vybídne mě, abych [Select_CString(marshal.IsFemale, 'ji následovala', 'ho následoval')].\n\nA působivý tedy opravdu je! Jakmile vyjdu ven, přivítá mě #emphasis obrovitánský#! slon. Větší než kterýkoli, kterého jsem kdy viděl[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Tahle bestie jistě rozsévá zkázu mezi každým nepřítelem."
 yearly.9020.a: "Na tomhle mohutném zvířeti pojedu do bitvy. Osobně."
 yearly.9020.b: "[marshal.GetCouncilTitle]. To zvíře je tvoje."
 yearly.9020.c: "Můj $knight_culture_player_no_tooltip_lowercase$ [knight.GetTitledFirstNameNoTooltip] ho jistě dobře využije."
 yearly.9020.d1: "[ROOT.Char.GetFaith.KnowledgeGodName] si zaslouží naši úctu. Propusťme ho na svobodu."
 yearly.9020.d2: "Takové zvíře má být svobodné. Propusťte ho."
 yearly_9020_personal_war_elephant: "Osobní válečný slon"
 yearly.8000.t: "Vzdání holdu"
 yearly.8000.desc: "Můj vazal [vassal.GetTitledFirstName] dorazil před [ROOT.Char.Custom('ResidenceBuilding')] v čele velkolepého průvodu elegantně oděných diplomatů, $knight_culture_player_plural_no_tooltip_lowercase$ a exotických bavičů. Celá společnost připomíná slavnostní procesí a v jejím čele kráčí osobně [vassal.GetFirstNameNoTooltip].\n\nHlasitým hlasem [vassal.GetFirstNameNoTooltip] oznamuje, že mi přichází vzdát hold a přináší dary v podobě #emphasis zlata!#!"
 yearly.8000.desc.paranoid: "\n\n...[Select_CString(vassal.IsFemale, 'očividně mě přišla #emphasis zabít!#!', 'očividně mě přišel #emphasis zabít!#!')]"
 yearly.8000.desc.lunatic: "\n\n#emphasis Muž na Měsíci#! musel vyslyšet mé půlnoční prosby o nového kamaráda na hraní!"
 yearly.8000.desc.default: "\n\nTaková štědrost se mezi poddanými hledá jen těžko. Věrnost [vassal.GetFirstNameNoTooltip] je skutečně poklad!"
 yearly.8000.desc.cannibal: "\n\nTaková lahodná štědrost se u tak křehkého poddaného hledá jen těžko. Šťavnatá věrnost [vassal.GetFirstNameNoTooltip] je skutečně k nakousnutí!"
 yearly.8000.a: "Prosím, vstup! Zlato odlož nalevo..."
 yearly.8000.b: "Copak... #emphasis jistě#! toho můžeš dát víc?"
 yearly.8000.c: "Zlato si nech, tvé přátelství mi stačí!"
 yearly.8000.d: "#emphasis V žádném případě#! [Select_CString(vassal.IsFemale, 'ji', 'ho')] nepouštějte do [ROOT.Char.Custom('ResidenceBuilding')]!"
 yearly.8000.e: "Co kdybys... [Select_CString(vassal.IsFemale, 'zůstala', 'zůstal')] na večeři?"
 yearly.8000.e.tt_eat_vassal: "Bude tebou [Select_CString(vassal.IsFemale, 'snědena', 'sněden')]"
 yearly.8000.e.tt_secret: "Získáš tajemství o vraždě"
 yearly.8100.t: "Nadšení rolníci"
 yearly.8100.desc: "Rolníci v [county.GetName] mají výbornou náladu. Úroda je bohatá, cesty bezpečné a vesničtí stařešinové vyprávějí nesmyslné historky o kravách dávajících mléko plné medu a husách snášejících zlatá vejce.\n\nZa své štěstí chválí #emphasis mě#! a dokonce vyslali delegaci s dary!"
 yearly.8100.a: "Jejich dary milostivě přijímám!"
 yearly.8100.b: "Zajímavé... Pošlete vojáky vybrat další „dary“!"
 yearly.8100.c: "Ne, své přebytky potřebují víc než já."
 yearly.8200.t: "Dar v dobré víře"
 yearly.8200.desc: "Můj [realm_priest.GetCouncilTitle] [realm_priest.GetFirstName] obdržel značný dar ve zlatě z pozůstalosti bohatého, ale bezdětného zeměpána, který nedávno zemřel. [Select_CString(realm_priest.IsFemale, 'Tvrdí', 'Tvrdí')], že zesnulý vedl velmi skromný a zbožný život a přál si, aby zlato posloužilo dobré věci.\n\n[realm_priest.GetCouncilTitle] [realm_priest.GetFirstName] trvá na tom, abych část daru přijal[Select_CString(ROOT.Char.IsFemale, 'a', '')], protože jsem prý „vzorem [ROOT.Char.GetFaith.GetNameNoTooltip] v [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]“."
 yearly.8200.a: "Rozdávat #emphasis posvátné#! bohatství? #emphasis Kacíř!#!"
 yearly.8200.b: "Slibuji, že zlato poslouží panství."
 yearly.8200.c: "Takový „vzor“ si zaslouží celý dar!"
 yearly.8200.d: "Prosím, rozdej ho chudým mým jménem."
 yearly.8200.desc.zealous: "\n\n...za tím jistě stojí [ROOT.Char.GetFaith.DevilName]!"
 yearly.8200.desc.generous: "\n\nSrdce mi plesá při pomyšlení, kolika duším bych tím zlatem [Select_CString(ROOT.Char.IsFemale, 'mohla', 'mohl')] pomoci!"
 yearly.8200.desc.greedy: "\n\n...Samozřejmě mám v úmyslu nechat si peníze pro sebe!"
 yearly.8200.desc.default: "\n\nVskutku lákavá nabídka."
 yearly.8300.t: "Příspěvek do válečné pokladny"
 yearly.8300.desc: "Když s obavami hledím na téměř prázdnou pokladnu, můj hlasatel oznámí příchod čtyř vazalů.\n\n„Přinášíme zlato, můj pane, příspěvek na porážku našich nepřátel!“ oznamuje [vassal_1.GetTitledFirstName].\n\n„Se mnou přichází [vassal_2.Custom('FormalComplimentAdjective')] [vassal_2.GetTitledFirstName], [vassal_3.Custom('FormalComplimentAdjective')] [vassal_3.GetTitledFirstName] a [vassal_4.Custom('FormalComplimentAdjective')] [vassal_4.GetTitledFirstName]. Žádáme jen jediné, veďte nás k vítězství!“"
 yearly.8300.a: "Vaši štědrost vítám!"
 yearly.8300.b: "#emphasis Zlato#!, říkáte? Stráže, #emphasis zabavte ho všechno!#!"
 yearly.8300.c: "Jste až příliš štědří. Nemohu to přijmout."
 yearly.8300.d: "Zlato? Raději bych #emphasis odvedl vaše kalhoty!#!"
 yearly.8400.t: "Zvrhlík na útěku"
 yearly.8400.desc: "Když se na noc uchýlím do [ROOT.Char.Custom('GetChamber')], narazím v nejskrytějším koutě svého soukromí na jednoho ze svých hostů, [deviant_guest.GetTitledFirstName]. Jak se sem vůbec [Select_CString(deviant_guest.IsFemale, 'dostala', 'dostal')]?!\n\n„Není to tak, jak to vypadá, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ tvrdí [deviant_guest.GetFirstNameNoTooltip].\n\nSkutečnost, že je [deviant_guest.GetFirstNameNoTooltip] napůl [Select_CString(deviant_guest.IsFemale, 'nahá', 'nahý')] a právě tělesně znesvěcuje můj #emphasis [ROOT.Char.Custom('RandomPrivateObject')]#!, mi napovídá, že je to ve skutečnosti přesně tak, jak to vypadá."
 yearly.8400.a: "Což... Ale... #emphasis vypadni z mého [ROOT.Char.Custom('GetRealmOrDomicile')]!#!"
 yearly.8400.special: "Poslyš, vím #emphasis přesně#!, kam bys měl[Select_CString(deviant_guest.IsFemale, 'a', '')] jít."
 yearly.8400.b: "Jak jsi [Select_CString(deviant_guest.IsFemale, 'mohla', 'mohl')]?! Do [ROOT.Char.Custom('GetDungeon')] s tebou!"
 yearly.8400.c: "Tohle už se nebude opakovat. Rozumíš?"
 yearly.8400.d: "[Select_CString(ROOT.Char.IsFemale, 'Netušila', 'Netušil')] jsem, že dokážeš #emphasis něco takového#!. Lákavé..."
 yearly.8400.a.tt: "Pošleš [deviant_guest.GetTitledFirstName] na [appropriate_court_target_owner.Custom('GetCourt')] postavy [appropriate_court_target_owner.GetTitledFirstName], kde se z [Select_CString(deviant_guest.IsFemale, 'ní', 'něj')] stane znamenitý spolčenec..."
 yearly.8500.opening: "[current_head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.8500.desc.a: "Situace, v níž ses [Select_CString(ROOT.Char.IsFemale, 'ocitla', 'ocitl')], je nešťastná. Přesto ti posílám tento dar, aby ti pomohl překonat toto nebezpečné období.\n\nModlím se, aby [current_head_of_faith.GetFaith.HighGodName] stál při tobě."
 yearly.8500.desc.b: "Tvůj spravedlivý boj proti nevěřícím nezůstal bez povšimnutí. Osobně jsem [Select_CString(current_head_of_faith.IsFemale, 'vyslala', 'vyslal')] posla s dostatkem mincí, aby ti pomohly překonat toto bouřlivé období.\n\nKéž tě [current_head_of_faith.GetFaith.HighGodName] ochraňuje."
 yearly.8500.a: "Padám na kolena. [current_head_of_faith.GetFaith.HighGodName] mě skutečně vyslyšel!"
 yearly.8500.b: "Tak velký dar přece nemohu přijmout."
