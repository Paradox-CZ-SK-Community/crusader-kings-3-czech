l_polish:
 yearly.9100.t: "Potíže v zahradě"
 yearly.9100.desc: "Sotva vstoupím do zahrady a udělám první krok, zaslechnu někoho sprostě nadávat. „#EMP [gardener.Custom('CulturalCurse')|U]!#!“\n\nObejdu živý plot a pátrám po zdroji křiku. V hlíně spatřím [Select_CString(gardener.IsFemale, 'svou zahradnici', 'svého zahradníka')] [gardener.GetTitledFirstName], [Select_CString(gardener.IsFemale, 'která se se zamračeným výrazem lopotí', 'který se se zamračeným výrazem lopotí')]. Jakmile si mě všimne, rychle vyskočí na nohy.\n\n„Ach! Odpusťte mi, [ROOT.Char.Custom('FormOfAddressForLiege')]. [Select_CString(gardener.IsFemale, 'Nečekala jsem', 'Nečekal jsem')], že tu ještě někdo bude... Nějaké pitomé zvíře, určitě [gardener.Custom('GetAnimalType')], mi zničilo #EMP všechno#!, na čem jsem poslední dobou [Select_CString(gardener.IsFemale, 'pracovala', 'pracoval')]! Tyhle bylinky jsem [Select_CString(gardener.IsFemale, 'zasadila', 'zasadil')] teprve předevčírem!“"
 yearly.9100.a: "Dovolte mi, ať vám pomohu!"
 yearly.9100.b: "Za všechnu tu dřinu si něco zasloužíte!"
 yearly.9100.c: "To #EMP je#! nemilé... Ale kvůli mně nepřestávejte!"
 yearly.9100.a.tooltip_a: "Dozvíš se mnoho o zahradničení"
 yearly.9100.a.tooltip_b: "Situaci ještě zhoršíš"
 yearly.9100.a.success: "Zahradničení už rozumím!"
 yearly.9100.a.failure: "Zahradničení je ztráta času!"
 yearly.9110.t: "Zloděj květin"
 yearly.9110.desc: "[Select_CString(gardener.IsFemale, 'Moje zahradnice', 'Můj zahradník')] [gardener.GetTitledFirstName] vtrhne do poradní síně a rozzuřeně zamíří k [romantic_councillor.GetTitledFirstName] z mé rady.\n\n„Jak se #EMP opovažujete#! ničit zahradu [ROOT.Char.GetTitleTierNamePossessive]?! A ještě k tomu #EMP krást#! vzácné a cenné květiny!“\n\n[romantic_councillor.GetFirstNameNoTooltip] se [Select_CString(gardener.IsFemale, 'zahradničiným', 'zahradníkovým')] hněvem očividně nenechá rozhodit. „Napadlo mě, že by byly dokonalým dárkem pro [councillor_spouse.GetTitledFirstName]. Trocha romantiky přece není zločin, nebo snad ano?“"
 yearly.9110.a: "Ničit mou zahradu ale zločin je. Škodu zaplatíš. Hned."
 yearly.9110.b: "Překračuješ meze, [gardener.GetFirstNameNoTooltip]!"
 yearly.9110.c: "Ty květiny jsou opravdu skvělý dárek... Pro #EMP můj#! protějšek."
 yearly.9110.d: "Do tohohle se #EMP plést nebudu#!! Vyřešte si to sami."
 yearly.9120.t: "Obchodník se semeny"
 yearly.9120.desc: "Tržiště v [barony_market.GetName] je plné ruchu a jeden obchodník obzvlášť upoutá mou pozornost. Na stánku má samé drobné krabičky. Když si všimne mé zvědavosti, pokyne mi, ať přijdu blíž.\n\n„Máte zájem o něco zvláštního, [ROOT.Char.Custom('FormOfAddressForLiege')]? Všechny tyhle krabičky jsou plné různých druhů semen. Z některých vyrostou pestrobarevné květiny, z jiných léčivé byliny. Dokonce mám i jeden vzácný jedovatý druh, kdyby vás něco takového zajímalo.“"
 yearly.9120.a: "Tu jedovatou, prosím... Čistě pro výzkumné účely, samozřejmě."
 yearly.9120.b: "Exotické květiny mé zahrady jistě proslaví!"
 yearly.9120.c: "Bylinky se vždycky hodí. Vezmu si je."
 yearly.9120.d: "Za #EMP takové#! nehorázné ceny?! Ani náhodou!"
