l_polish:
 yearly.7001.t: "Poslední den"
 yearly.7001.desc: "Můj [marshal.GetCouncilTitle] [marshal.GetTitledFirstNameNoTooltip] mi podává mou oblíbenou zbraň, [ROOT.Char.Custom('signature_weapon')]. Je nabroušená a vyleštěná tak dokonale, že v ní rozeznávám část vlastní tváře.\n\n„[Select_CString(ROOT.Char.IsFemale, 'Tuhle zbraň byste měla nosit u sebe', 'Tuhle zbraň byste měl nosit u sebe')], pro vlastní bezpečí. Nespokojenci se plíží ve stínech jako prašivé krysy a pokaždé, když se účastníme nějakého veřejného shromáždění, přemýšlím, zda není naše poslední.“\n\n[marshal.GetFirstNameNoTooltip] hledí z okna. „Možná bychom měli posílit hlídky... V dnešním ranním vzduchu je cosi zlověstného a mám strach.“"
 yearly.7001.a: "Hosty by to znervóznilo! Je to jen paranoia."
 yearly.7001.b: "Pro jistotu přidejte pár dalších hlídek."
 yearly.7001.c: "Ty #EMP něco víš#!, [marshal.GetTitledFirstNameNoTooltip]?"
 yearly.7001.c.tt: "[marshal.GetTitledFirstNameNoTooltip] ti poví více o svém podezření"
 yearly.7001.tt: "[marshal.GetTitledFirstNameNoTooltip] tvé otázky odbyde"
 yearly.7001.d: "Naplňte [ROOT.GetCharacter.Custom('FortifiedBuilding')] strážemi. Ať nezůstane jediná místnost bez dozoru!"
 yearly.7001.d.tt: "Vyděsíš každého, kdo přijde ke dvoru"
 yearly.7001.d.win.tt: "Zastrašíš frakce, které proti tobě vystupují"
 yearly.7002: "Jste v bezprostředním nebezpečí, [ROOT.Char.Custom('FormOfAddressForLiege')]"
 yearly.7002.d: "Když píši tato slova, cítím jen hanbu. [coup_leader.GetTitledFirstName] celé měsíce podplácí vaše stráže. [Select_CString(coup_leader.IsFemale, 'Plánuje před celým dvorem zaútočit', 'Plánuje před celým dvorem zaútočit')] na váš život... Přeji si, abyste přežil[Select_CString(ROOT.Char.IsFemale, 'a', '')], ale ať se snažím sebevíc, mé srdce nepřestává krvácet pro věc frakce [coup_faction.GetName].\n\nUprchl[Select_CString(marshal.IsFemale, 'a jsem', ' jsem')] jsem do vyhnanství. Už se nikdy nesetkáme."
 yearly.7002.a: "Nemohu věřit nikomu!"
 yearly.7002.b: "Musím svěřit svůj život několika nejbližším $knight_culture_player_plural_no_tooltip_lowercase$!"
 yearly.7002.b.tt: "[knight_1.GetTitledFirstName] a [knight_2.GetTitledFirstName] patří k mým nejlepším bojovníkům. Musím doufat, že mě ochrání."
 yearly.7002.c: "Dokážu se ubránit sám[Select_CString(ROOT.Char.IsFemale, 'a', '')]!"
 yearly.7002.b.tt.2: "Svěříš se dvěma ze svých strážců"
 yearly.7002.c.tt: "Necháš si to pro sebe"
 yearly.7004.desc: "„Rychle! [Select_CString(ROOT.Char.IsFemale, 'Probouzí se!', 'Probouzí se!')]“\n\nKdyž se proberu, polštář je nějak hrubší než obvykle. Hlava se mi točí, jenže spolu s ní se houpe i celé mé tělo a všude kolem je tma. Nejsem v posteli. Někdo mě vleče po zemi v pytli.\n\n„Moc se mele! Pořád mi to klouže z rukou.“\n\nZatímco se hlasy dohadují, stačí sebou párkrát pořádně škubnout a pytel jim vypadne. Když se vyškrábu ven, zjistím, že mě sotva odtáhli pár kroků za zahradu."
 yearly.7004.tt: "Plány frakce byly zmařeny"
 yearly.7004.a: "Tomuhle říkáte únos? Čekal[Select_CString(ROOT.Char.IsFemale, 'a bych', ' bych')], že mě dostanete alespoň do [neighbor_county.GetNameNoTier]."
 yearly.7004.b: "Zrádci! Oba budete hnít v pytlích v mém žaláři!"
 yearly.7004.c: "Okamžitě mě odneste zpátky do postele!"
 yearly.7004.c.tt: "Znovu tě strčí do pytle a odnesou do tvé komnaty"
 yearly.7005.preparation: "Je téměř vzrušující jen sedět a čekat, až frakce [coup_faction.GetName] udeří."
 yearly.7005.preparation_poor: "Rozhodl[Select_CString(ROOT.Char.IsFemale, 'a jsem se', ' jsem se')] nevěřit nikomu kromě své zbraně, [ROOT.Char.Custom('SignatureWeaponNameOrType')]. A jestli musí přijít konec, [ROOT.Char.Custom('GetAfterLifeDestination')] nás možná čeká oba."
 yearly.7005.preparation_good: "Je až směšné, že si myslí, že mě nějací vrazi dokážou zabít."
 yearly.7005.knight_support: "[knight_1.GetTitledFirstName] a [knight_2.GetTitledFirstName] jsou připraveni za mě zemřít, ale lituji každého, kdo by se měl postavit jejich čepelím."
 yearly.7005.single_knight_support: "Nakonec přece jen důvěřuji svým [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')], že při mně budou stát."
 yearly.7005.decreased_security: "Všichni hosté bezstarostně popíjejí [ROOT.Char.Custom('RegionalDrink')] a cpou se klepy, jako by se nemohlo nic stát."
 yearly.7005.increased_security: "V [ROOT.GetCharacter.Custom('FortifiedBuilding')] panuje ticho a jen několik hloučků si šeptá. Pohled na trůnní sál lemovaný strážemi všechny drží v napětí."
 yearly.7005.throne_approach: "[coup_leader.GetTitledFirstName] přistupuje k mému trůnu."
 yearly.7005.liberty_faction: "„Zdá se, že jediný způsob, jak zpřetrhat řetězy kolem našich krků, je podříznout ten můj i váš.“"
 yearly.7005.independence_faction: "\n\n„Když nemohu mít vlastní stát, budu alespoň hrdinou své vlastní tragédie.“"
 yearly.7005.claimant_faction: "„Nemáte právo dál zahnívat na tomto trůně. Raději zemřu, než abych z něj musel[Select_CString(coup_leader.IsFemale, 'a', '')] vyslechnout jediný další váš falešný výnos.“"
 yearly.7005.populist_faction: "„Přísahám, že mě rmoutí, když vám mohu nabídnout jen spravedlivější smrt, než jakou poznali všichni ti, které jste rozdrtil[Select_CString(ROOT.Char.IsFemale, 'a', '')] pod svou botou. Alespoň můj konec bude koncem hrdiny.“"
 yearly.7005.weapon: "\n\n[coup_leader.GetFirstNameNoTooltip] vytáhne ukrytou dýku a vyrazí vpřed."
 yearly.7005.single_death: "V jediném děsivém výpadu [coup_leader.GetFirstNameNoTooltip] zasáhne [first_character_kill.GetTitledFirstName]"
 yearly.7005.double_death: "V prudkém dvojím výpadu [coup_leader.GetFirstNameNoTooltip] zasáhne [first_character_kill.GetTitledFirstName] a [second_character_kill.GetTitledFirstName]"
 yearly.7005.triple_death: "K hrůze všech [coup_leader.GetFirstNameNoTooltip] zaútočí na [first_character_kill.GetTitledFirstName], [second_character_kill.GetTitledFirstName] a [third_character_kill.GetTitledFirstName]."
 yearly.7005.coup_ruler_strike: "a pak se vrhne na mě."
 yearly.7005.no_death: "Toto ztřeštěné šílenství rychle skončí, když moji [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] [coup_leader.GetFirstNameNoTooltip] bleskově obklíčí."
 yearly.7005.failure: "Když stráže [coup_leader.GetFirstNameNoTooltip] sevřou, dochází mi, že se [Select_CString(coup_leader.IsFemale, 'zoufalá útočnice snaží', 'zoufalý útočník snaží')] raději vrazit čepel do vlastního srdce, než se nechat zajmout."
 yearly.7005.ruler_death: "Jejich krev se brzy smísí s mou, když ucítím, jak mě [coup_leader.Custom('SignatureWeaponNameOrType')] zasahuje do hrudi."
 yearly.7005.success: "Bylo by pošetilé věřit, že mi [coup_leader.GetFirstNameNoTooltip] může tímto nicotným převratem vzít trůn. Když si však přiloží čepel k vlastnímu hrdlu, pochopím, že o trůn nikdy nešlo."
 yearly.7005.a: "Stráže, zadržte [coup_leader.GetFirstNameNoTooltip]! [Select_CString(coup_leader.IsFemale, 'Nesmí se stát mučednicí', 'Nesmí se stát mučedníkem')] nespokojenců."
 yearly.7005.b: "Nechte [coup_leader.GetFirstNameNoTooltip], ať to udělá."
 yearly.7005.c: "Zasloužíš si mnohem horší osud než zemřít tady!"
 yearly.7005.c.tt: "Oslepíš a uvězníš [coup_leader.GetTitledFirstName]"
 yearly.7005.d: "Vyžeňte [coup_leader.GetFirstNameNoTooltip]. Ať všem vypráví, jak těžké je mě zabít."
 yearly.7005.d.tt: "Získáš všechny tituly a vazaly [coup_leader.GetTitledFirstName]"
 yearly.7005.devout.e: "[ROOT.Char.GetFaith.PositiveAfterLife] tě nikdy nepřijme, mizero!"
 yearly.7005.e: "[ROOT.Char.GetFaith.NegativeAfterLife] na tebe čeká. A já tam budu čekat také, pse!"
 yearly.7010.t: "Krásná hra"
 yearly.7010.desc: "Výprava do jedné z vesnic na mém území mě přivedla k podivuhodné scéně. Zdá se, že na tržiště dorazila snad celá vesnice a z davu se zformovaly dvě nesourodé skupiny.\n\nPřesně mezi nimi stojí poněkud nervózní vesničan a v rukou svírá něco, co z mého místa rozeznávám jen díky němu. Nafouknutý prasečí měchýř.\n\nMůj nechápavý výraz zřejmě neunikne sluhovi, který mi rychle vysvětlí, oč jde. Ukazuje se, že je to jakási oblíbená lidová hra!"
 yearly.7010.a: "Fascinující! Jaká jsou pravidla?"
 yearly.7010.b: "Raději je nechme, ať si hrají."
 yearly.7010.tt.yes: "Zjistíš, co se tu vlastně děje."
 yearly.7010.tt.win: "Tohle ti může pomoci zvítězit!"
 yearly.7010.tt.lose: "Tato volba může snížit tvé šance na vítězství!"
 yearly.7011.t: "Krásná hra: Zvážení rizik"
 yearly.7011.desc: "Můj věrný sluha mi s jistou nervozitou vysvětluje pravidla nadcházejícího klání. Jak se ukazuje, hra zvaná #EMP „foot ball“#! je nesmírně rozšířená a hrají ji lidé všeho druhu.\n\nObě strany se údajně snaží dostat „míč“, jak zde říkají prasečímu měchýři, na opačný konec vesnice, než který jejich skupina brání. A to jakýmikoli prostředky.\n\nPoslední slova pronese s obzvláštní vážností a záhy pochopím proč. Smrt je sice vzácná, ale zranění rozhodně ne."
 yearly.7011.a: "Myslíš, že by se našlo místo i pro mě?"
 yearly.7011.b: "Typická zábava prostého lidu. Nechme je být."
 yearly.7011.tt: "Přineste mi boty!"
 yearly.7012.t: "Krásná hra: Samá výstroj..."
 yearly.7012.desc: "Když stojím mezi vesničany, všimnu si jednoho [Select_CString(dummy_gender.IsFemale, 'muže středního věku', 'muže středního věku')], který si pod tunikou upravuje nějaké kožené řemínky. Když se podívám lépe, jeho trup je na tak vyzáblou postavu až podezřele mohutný a hruď i břicho napínají látku oděvu. Jakmile si všimne mého zájmu, zazubí se, pokyne mi blíž a tuniku nadzvedne.\n\nPod ní má kolem těla omotané vrstvy hrubých dřevěných latěk, které mají připomínat zbroj.\n\n„Říkám tomu #EMP „podzbroj“#!!“ pronese pyšně a spiklenecky na mě mrkne."
 yearly.7012.a: "Kolik za ni chceš?"
 yearly.7012.b: "To je naprosto směšný nápad."
 yearly.7013.t: "Krásná hra: Velký přestup"
 yearly.7013.desc: "Když si prohlížím dav, všimnu si postavy, která sem očividně nezapadá. [Select_CString(dummy_gender.IsFemale, 'Žena je oděná', 'Muž je oděný')] do drahých kožešin a obklopen[Select_CString(dummy_gender.IsFemale, 'á malou družinou', ' malou družinou')], zatímco živě rozmlouvá s někým podstatně mohutnějším. Protlačím se davem právě včas, abych spatřil[Select_CString(ROOT.Char.IsFemale, 'a', '')], jak bohatý obchodník vhodí tomu druhému do ruky malý měšec mincí.\n\n„...radost s vámi obchodovat. Teď se postarejte, aby má sázka byla v bezpečí!“ ušklíbne se kupec s podbradkem.\n\nMohutná postava se vydá ke skupině soupeřů. Zdá se, že někteří si s posvátností hry příliš hlavu nelámou..."
 yearly.7013.a: "Počkej! Ať ti zaplatil cokoli, dám ti dvojnásobek!"
 yearly.7013.b: "Odporné. Za mých časů by se tohle nestalo!"
 yearly.7013.c: "Tak budeme muset vyhrát bez téhle posily!"
 yearly.7014.t: "Krásná hra: Pozor na koláče"
 yearly.7014.desc: "Podnikavý místní pekař si očividně všiml shromážděných davů a jeho dva rozvrzané vozíky plné čerstvě upečených koláčů jdou skvěle na odbyt.\n\nKdyž se nenápadně přiblížím k vozíku, kolem kterého se tlačí soupeřovo mužstvo, všimnu si, že jeden paprsek kola už téměř praská. Sotva mě napadne, co by se s tím dalo udělat, naskytne se příležitost. Z druhé strany náměstí zazní hlasitý rachot něčeho padajícího a všichni se otočí tím směrem.\n\nJediný rychlý kopanec do onoho paprsku a..."
 yearly.7014.desc.1: "Podnikavý místní pekař si očividně všiml shromážděných davů a jeho dva rozvrzané vozíky plné čerstvě upečených masových koláčů jdou skvěle na odbyt.\n\nKdyž se nenápadně přiblížím k vozíku, kolem kterého se tlačí soupeřovo mužstvo, přelétnu pohledem police plné ještě horkého pečiva. Sotva mě napadne, co by se s tím dalo udělat, naskytne se příležitost. Z druhé strany náměstí zazní hlasitý rachot něčeho padajícího a všichni se otočí tím směrem.\n\nRuka mi sklouzne k malému váčku bolehlavu u pasu..."
 yearly.7014.a: "Tak se ukažte, jak vám to půjde teď..."
 yearly.7014.b: "Ale ne, všechny koláče spadly do bláta!"
 yearly.7014.c: "Raději ne."
 yearly.7014.hemlock: "Přisypeš na koláče trochu zvláštní přísady..."
 yearly.7015.t: "Krásná hra: Povzbuzující doušky"
 yearly.7015.desc: "Když se připravuji na nadcházející námahu, zahlédnu na okraji davu [Select_CString(dummy_gender.IsFemale, 'ženu', 'muže')], jak upíjí z lahvice a mezi jednotlivými doušky nervózně těká očima kolem sebe. Samo o sobě by to nebylo nijak zvlášť podezřelé, ale tohle tajnůstkářství ano. A ještě podezřelejší je, jak sebou [Select_CString(dummy_gender.IsFemale, 'trhne', 'trhne')], když jí[Select_CString(dummy_gender.IsFemale, ' poklepu', ' poklepu')] na rameno.\n\nAť už pije cokoli, voda to není. Tekutina je zakalená a podle grimasy při každém doušku chutná příšerně. Naštěstí stačí jen trochu naléhat a tajemství jde ven překvapivě snadno.\n\n„Zvyšuje výkon“, říkáš?"
 yearly.7015.a: "...kolik za to chceš?"
 yearly.7015.b: "Měl[Select_CString(dummy_gender.IsFemale, 'a by ses stydět!', ' by ses stydět!')]"
 yearly.7020.t: "Krásná hra: Výkop"
 yearly.7020.desc: "Když jsou všechny předzápasové záležitosti vyřízeny, zbývá už jen hru zahájit. Městský vyvolávač se nebezpečně vykloní z okna v prvním patře domu nad náměstím a prostrčí rámem prasečí měchýř.\n\nDav vzhlédne v očekávání a po krátké pauze „míč“ vyletí do vzduchu.\n\nZačíná běsnění."
 yearly.7020.a: "Za mnou, týme!"
 yearly.7020.b: "AAAAAAAAAAARGGGHHHH!"
 yearly.7021.t: "Krásná hra: Kámen na scéně"
 yearly.7021.desc: "Tahle údajná „hra“ je mnohem drsnější, než jsem čekal[Select_CString(ROOT.Char.IsFemale, 'a', '')]. Ani pověst o její násilnosti nebyla nijak přehnaná.\n\nPo mé levici drží jeden vesničan druhého v improvizovaném kravatovém sevření a oba se potácejí kolem zuřivé pěstní rvačky, do níž jsou podle všeho zapleteni hned čtyři lidé.\n\nKdyž se od téhle mela snažím vzdálit, vykročí proti mně další vesničan. Z rány na čele mu přes obličej stéká krev, v očích má šílený výraz a v ruce svírá kámen."
 yearly.7021.a: "Hej! To je proti pravidlům!"
 yearly.7021.b: "TEN KÁMEN TI NARVU DO CHŘTÁNU!"
 yearly.7021.c: "Je čas odsud zmizet!"
 yearly.7021.a.tt.win: "Vyrazíš mu kámen z ruky!"
 yearly.7021.a.tt.lose: "Nedokážeš se ubránit"
 yearly.7021.c.tt.escape: "Unikneš bez zranění"
 yearly.7021.c.tt.escapefail: "Nepodaří se ti uniknout"
 yearly.7022.t: "Krásná hra: Půvabný divák"
 yearly.7022.desc: "Soupeři mají míč! Nese ho pohledn[Select_CString(dummy_gender.IsFemale, 'á mladá žena', 'ý mladý muž')] a očividně nechybí ani vychytralost. Jakmile se zmocní míče, začne šplhat po domě, aby unikl řvoucímu davu pod sebou.\n\nZpočátku se zdá, že plán nemá chybu, jenže nepočítá s vlastními přízemními touhami. Když se po fasádě vyšplhám do stejné výšky, [Select_CString(dummy_gender.IsFemale, 'je očividně okouzlena', 'je očividně okouzlen')] zvlášť půvabn[Select_CString(same_gender.IsFemale, 'ou ženou', 'ým mužem')] v okně.\n\nTi dva jsou do sebe očividně celí pryč. A já jsem právě na dosah ruky..."
 yearly.7022.a: "Šup sem s tím!"
 yearly.7022.b: "Ach, mladá láska!"
 yearly.7022.c: "Ha! Ukážu ti, jak vypadá opravdov[Select_CString(ROOT.Char.IsFemale, 'á žena', 'ý muž')]!"
 yearly.7023.t: "Krásná hra: [ROOT.Char.GetFaith.HighGodName] má prsty ve hře"
 yearly.7023.desc: "Prasečí měchýř je volný! Pár nervózních rukou se ho pokusí zachytit, ale míč jednou odskočí a pak jej popadne... někdo z řad [ROOT.Char.GetFaith.AltPriestTermPlural]?\n\nDuchovní se zazubí a klopýtá vpřed, zatímco se před ním dav nejistě rozestupuje. Nikdo pořádně neví, co si počít s posvěcenou osobou, která se účastní tak násilné hry a navíc jí všechno beztrestně prochází!\n\nS jistými pochybnostmi vykročím vpřed..."
 yearly.7023.a: "...a vrazím tomu duchovnímu pěstí přímo do obličeje."
 yearly.7023.b: "...a raději ustoupím stranou. Ať si s tím duchovním poradí někdo jiný."
 yearly.7024.t: "Krásná hra: Střecha v ohrožení"
 yearly.7024.desc: "Dav se jako přílivová vlna žene proti stěnám nedalekého domu a s rachotem do nich narazí. Když se masa lidí od stěn zase odvalí, několik hráčů zůstane viset na všem, čeho se dokázali zachytit, zatímco ostatní se je snaží strhnout dolů, aby se dostali k držiteli míče.\n\nTržištěm se rozléhá praskání dřeva a drceného proutí. Když dav konečně ustoupí, několik částí doškové střechy se sesype k zemi."
 yearly.7024.a: "Opravy zaplatím!"
 yearly.7024.b: "Ve válce, lásce a fotbale je dovoleno všechno!"
 yearly.7030.t: "Krásná hra: Ani náhodou penalta!"
 yearly.7030.desc: "Jak hra pokračuje, stále více vesničanů musí odstoupit. Jeden z nich se kolem mě potácí a na hlavě už mu naskakují pořádné podlitiny.\n\nNáhle mi přímo k nohám s uši drásajícím výkřikem padne další muž. Ten řev vyruší dokonce i ostatní hráče a dav i já před svíjejícím se nešťastníkem ustoupíme, ačkoli bych #EMP přísahal#!, že jsem zahlédl jedno oko pootevřené...\n\nJakmile se kolem něj uvolní dost místa, „zraněný“ vyskočí na nohy, popadne míč a žene se přes náměstí přímo ke mně!"
 yearly.7030.a: "Já... cože... #EMP rozhodčí!#!"
 yearly.7030.b: "Podvodníku! Já tě dostanu!"
 yearly.7030.c: "Ach, rád vidím, že se tak rychle uzdravil!"
 yearly.7030.b.win: "Dostihneš podvodníka"
 yearly.7030.b.lose: "Podvodník ti unikne"
 yearly.7031.t: "Krásná hra: Postrach kotníků"
 yearly.7031.desc: "Hra pokračuje a já si všímám, že řady mého mužstva začínají řídnout. Po tržišti se válí několik hráčů a všichni si drží poraněné kotníky. Podle všeho #EMP pořádně#! poraněné kotníky. Když se přetlačuji s lidmi kolem sebe, zahlédnu u země záblesk kovu a s hrůzou mi dojde, co mé spoluhráče potkalo.\n\nNěkdo obzvlášť krvelačný si do bot přišil malé čepele a přímo před mýma očima jimi brutálně sekne dalšího hráče do holení. Zvažuji, že se protlačím vpřed a zakročím."
 yearly.7031.a: "Sundejte mu ty boty!"
 yearly.7031.b: "Své holeně mám rád tak, jak jsou!"
 yearly.7031.c: "To je ale zajímavý nápad..."
 yearly.7031.a.win: "Strhneš mu boty z nohou"
 yearly.7031.a.lose: "Dostaneš kopanec do holeně!"
 yearly.7032.t: "Krásná hra: Přestávka na občerstvení"
 yearly.7032.desc: "Masa lidí se náhle převalí stranou a silou mě vyvrhne ze svého středu. Doklopýtám ke zdi, abych popadl dech a zorientoval se, a všimnu si několika obchodníků obtěžkaných nejrůznějším občerstvením. Při takové dřině se jim musí dařit skvěle!\n\nTrocha posilnění by mi právě přišla vhod. Copak asi nabízejí?"
 yearly.7032.a: "Čerstvá voda! Dokonalé!"
 yearly.7032.b: "Korbel piva by mi bodl!"
 yearly.7032.c: "Nemáte náhodou trochu [ROOT.Char.Custom('RegionalDrink')]?"
 yearly.7032.d: "Ty hašišové koláčky jsou na prodej?"
 yearly.7033.t: "Krásná hra: Barvířská mela"
 yearly.7033.desc: "Rvačky se soupeři jsou při těchto hrách naprosto běžné, ale s jistým zmatením zjišťuji, že se dva z mých spoluhráčů perou #EMP mezi sebou#!. Oba poznávám. Jeden je místní výrobce luků, druhý barvíř látek. Pustili se do sebe s takovou zuřivostí, že si jejich zápasu začínají všímat i ostatní spoluhráči.\n\nMalicherná hádka už zaměstnává značnou část mého mužstva a masa hráčů se mezitím začíná valit směrem k té části vesnice, kterou bráníme..."
 yearly.7033.a: "Tak dost, od sebe!"
 yearly.7033.b: "Kvůli takovým malicherným hádkám se namáhat nebudu."
 yearly.7033.a.win: "Úspěšně od sebe rváče odtrhneš"
 yearly.7033.a.lose: "Rvačka se ještě vyhrotí"
 yearly.7040.t: "Krásná hra: Konečný výsledek"
 yearly.7040.desc: "Jak den postupuje, příliv a odliv hry dosahuje svého vrcholu. Obě strany se ženou za míčem a já se ocitnu přímo uprostřed jednoho z vírů lidských těl.\n\nZtratím rovnováhu a padám k zemi. Rukama si chráním hlavu před dupajícími chodidly, ale když se nakonec vyškrábu alespoň na kolena, tržiště náhle zachvátí podivný klid.\n\nZdá se, že je po všem."
 yearly.7040.a: "Vyhráli... vyhráli jsme?"
 yearly.7041.t: "Krásná hra: Drtivé vítězství!"
 yearly.7041.desc: "Spoluhráči mě vytáhnou na nohy a jejich jásot mi málem rozskočí srdce radostí! Nebylo to pouhé vítězství, soupeře jsme #EMP rozdrtili#! a já jsem k tomu rozhodně přispěl[Select_CString(ROOT.Char.IsFemale, 'a velkou měrou', ' velkou měrou')]!\n\nNaši soupeři se začínají "
 yearly.7041.a: "To byla ale strhující hra!"
 yearly.7041.b: "Nechám si na památku něco vyrobit!"
 yearly.7041.desc.ending: "sklíčeně trousit pryč, ale pro vítěze oslava teprve začíná. Uprostřed všeho už stojí velký sud [ROOT.Char.Custom('RegionalDrink')] a pití teče proudem. Oslavy bezpochyby potrvají až do večera."
 yearly.7042.t: "Krásná hra: Vítězství!"
 yearly.7042.desc: "Vyškrábu se na nohy a rozmazaným pohledem se snažím zaostřit na lidi proudící kolem mě. Uprostřed náměstí slaví jakási skupina a několik vteřin mi trvá, než mi dojde, že je to vlastně moje mužstvo!\n\nNaši soupeři se začínají "
 yearly.7042.a: "To byla ale strhující hra!"
 yearly.7042.b: "Nechám si na památku něco vyrobit!"
 yearly.7043.t: "Krásná hra: Remíza"
 yearly.7043.desc: "Když se vyškrábu na nohy, stále mě obklopují zástupy lidí. Něco se však změnilo. Ze všech pohybů zmizela naléhavost a hráči se bezcílně trousí pryč z náměstí.\n\nSlunce už visí nízko nad obzorem a zdá se, že hra skončila, aniž by některá strana dokázala rozhodnout."
 yearly.7043.a: "Nevadí. Příště je dostaneme!"
 yearly.7044.t: "Krásná hra: Porážka!"
 yearly.7044.desc: "Vyškrábu se na nohy a rozmazaným pohledem se snažím zaostřit na lidi proudící kolem mě. Uprostřed náměstí slaví jakási skupina a několik vteřin mi trvá, než mi dojde, že... jsou to soupeři.\n\nMoje mužstvo se začíná "
 yearly.7044.a: "Gratuluji vítězům!"
 yearly.7044.b: "Pche! Měli jsme vyhrát!"
 yearly.7044.c: "Stejně si zasloužím trofej!"
 yearly.7045.t: "Krásná hra: Drtivá porážka!"
 yearly.7045.desc: "Kolem mě duní dupot nohou a já se pracně zvedám, abych zjistil, co se děje. Kousek ode mě na náměstí soupeři vítězoslavně zvedají míč nad hlavu a jásají. Tohle nebyla jen porážka. Tohle byl naprostý #EMP debakl#!.\n\nMoje mužstvo se začíná "
 yearly.7045.a: "Gratuluji vítězům!"
 yearly.7045.b: "Pche! Měli jsme vyhrát!"
 yearly.7045.c: "Stejně si zasloužím trofej!"
 yearly.7050.t: "Kde je ta díra?"
 yearly.7050.desc: "Na chodbě narazím na [unfortunate_soul.GetTitledFirstName], jak upřeně zírá do zdi. Ze zvědavosti se zeptám, co tam vlastně hledá.\n\nPohled [unfortunate_soul.GetTitledFirstNameNoTooltip] ke mně prudce sklouzne a tvář sebou zlověstně cukne. „Tady bývala díra, víte,“ pronese [unfortunate_soul.GetTitledFirstNameNoTooltip] s naprostým přesvědčením.\n\nZadívám se na zeď před sebou, ale po údajné díře nenacházím ani stopu."
 yearly.7050.a: "Kde je ta... díra?"
 yearly.7050.a_paranoid: "Musím zjistit víc."
 yearly.7050.a.flavor: "Jak podivuhodná představa."
 yearly.7050.b: "To je nesmysl."
 yearly.7050.b.flavor: "[unfortunate_soul.GetShortUIName] musí blouznit."
 yearly.7050.c: "Přestaň plýtvat mým časem!"
 yearly.7051.t: "Mlžný vrch"
 yearly.7051.desc: "Mlha je tak hustá, že by se dala krájet nožem, a já se marně rozhlížím ve snaze zjistit, kde jsem. Už jsem tu někdy byl? Je tohle... bojiště?\n\nRuce se mi třesou, zatímco se snažím pochopit, co se děje, a opatrně vykročím vpřed. Z dálky zaslechnu hlas, který volá: „Neviděli jste malého chlapce?“\n\nNáhle se v mlze začínají rýsovat tváře. Jsou to... lidé, které jsem zabil[Select_CString(ROOT.Char.IsFemale, 'a', '')]? Jejich obličeje jsou strnulé v děsivých grimasách."
 yearly.7051.a: "Za všechno můžu já..."
 yearly.7051.a.flavor: "Přijmeš odpovědnost."
 yearly.7051.b: "Zasloužili si to. #EMP Všichni#!."
 yearly.7051.b_conviction.desc: "Dokážeš o tom přesvědčit sám sebe"
 yearly.7051.b_unconvinced.desc: "Psychicky se zhroutíš"
 yearly.7052.t: "Jako sen"
 yearly.7052.desc_unconvinced: "Probudím se zalitý[Select_CString(ROOT.Char.IsFemale, 'á potem', ' potem')]. Jestli to nebyl ten nejhorší sen mého života, pak rozhodně patřil k těm nejhorším, které jsem v poslední době zažil[Select_CString(ROOT.Char.IsFemale, 'a', '')].\n\nRuce se mi stále třesou z toho, co jsem právě prožil[Select_CString(ROOT.Char.IsFemale, 'a', '')], a v duchu si znovu vybavuji jednotlivé výjevy. „Snad už to nemůže být o mnoho horší,“ zamumlám a uboze se převalím na druhý bok ve snaze znovu usnout."
 yearly.7052.desc: "Probudím se překvapivě klidný[Select_CString(ROOT.Char.IsFemale, 'á', '')]. Byl to zvláštní sen. Ne zrovna příjemný, ale za svůj život jsem měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] i horší.\n\nChvíli o něm přemýšlím, pak se otočím na druhý bok a brzy znovu upadnu do pokojného spánku."
 yearly.7052.a: "Byl to jen zlý sen."
 yearly.7052.a_positive: "To byl ale podivný sen."
 yearly.7053.t: "Co je to za díru?"
 yearly.7053.desc: "Chodbu zalévá denní světlo, když mířím ke kuchyni. Náhle koutkem oka zahlédnu... ve zdi je #EMP díra#!.\n\nZastavím se a zadívám se na ni se směsicí zvědavosti a nedůvěry. Není velká, sotva na šířku paže. Uvnitř je však černočerná tma.\n\nOpatrně se přiblížím a pokusím se nahlédnout dovnitř. Nechápu, odkud se tu vzala ani k čemu slouží."
 yearly.7053.a: "Správce zahrad o tom musí něco vědět."
 yearly.7053.b: "Myslím, že tam něco vidím..."
 yearly.7053.b_pouch.desc: "Z díry vytáhneš měšec zlatých mincí"
 yearly.7053.b_scratch.desc: "Něco tě poškrábe na paži"
 yearly.7054.t: "Náhlé procitnutí"
 yearly.7054.intro: "Jeden ze sluhů se mě opatrně snaží probudit. Úzkostlivě na mě hledí a vykřikne: „[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Jste v pořádku?“ Zmateně se rozhlížím po chodbě.\n\nOmdlel[Select_CString(ROOT.Char.IsFemale, 'a jsem', ' jsem')] jsem?"
 yearly.7054.desc_pouch: "V ruce stále pevně svírám měšec se zlatem, který se mi podařilo vytáhnout z té... díry?"
 yearly.7054.desc_scratch: "Paže mě pálí přesně v místě, které jsem strčil[Select_CString(ROOT.Char.IsFemale, 'a', '')] do té... díry?"
 yearly.7054.desc: "Matně si vzpomínám, že jsem měl[Select_CString(ROOT.Char.IsFemale, 'a', '')] mluvit se správcem zahrad... kvůli nějaké díře?"
 yearly.7054.outro: "\n\nRychle vyskočím na nohy a zadívám se na zeď. „Tady byla díra,“ zamumlám, zatímco očima přejíždím po světlých stěnách chodby."
 yearly.7054.a: "...Musel[Select_CString(ROOT.Char.IsFemale, 'a jsem si', ' jsem si')] to celé představovat."
 yearly.7054.a.flavor_pouch: "Pevně sevřeš měšec."
 yearly.7054.a.flavor_scratch: "Pálení vycházející ze škrábance na paži zesílí."
 yearly.7054.a.flavor: "Všimneš si, že tě sluha nyní obezřetně pozoruje."
 yearly.7055.t: "Panství pro psa"
 yearly.7055.desc: "Když přecházím nádvoří, odnikud ke mně přiběhne toulavý vořech a zastaví se přímo přede mnou. Na obojku má připevněné jakési podivné kousky kovu.\n\nPes na mě očekávavě hledí a já mu s lehkým podrážděním oplácím pohled do hnědých očí. Vyrušení mě však rychle přestane rozčilovat a zmocní se mě zvláštní pocit, jako by ten pes nějak ovládal... věci?\n\nOpravdu přicházím o rozum, pomyslím si, popadnu obojek a směšné kovové kousky sundám. Když se chystám odejít, pes se na mě přísně zadívá. Takže... teď asi patří mně?"
 yearly.7055.a: "Pojď sem, pse."
 yearly.7055.b: "#EMP Vypadni#!, ty prašivý čokle!"
 yearly.7055.b.flavor: "Pes na tebe pohlédne s ublíženým výrazem."
