l_polish:
 yearly.0001.opening: "[mentor.Custom2('AppropriateGreeting', ROOT.Char)]"
 yearly.0001.desc.default: "Po léta mi mé schopnosti v oblasti [ROOT.Char.Custom('YearlyEvent0001Skill')] dobře slouží a napadlo mě, že by se tyto znalosti mohly hodit i vám. O to, co vím, se s vámi ochotně podělím"
 yearly.0001.desc.arrogant: "Jak jste si bezpochyby všimli, v záležitostech týkajících se [ROOT.Char.Custom('YearlyEvent0001Skill')] se velmi dobře vyznám. O své znalosti se s vámi ochotně podělím"
 yearly.0001.desc.councillor: "Při službě ve funkci [mentor.Custom('CouncilPosition')] jsem se mnohému [Select_CString(mentor.IsFemale, 'naučila', 'naučil')] o [ROOT.Char.Custom('YearlyEvent0001Skill')]. Mohu vás v těchto záležitostech poučit"
 yearly.0001.desc.nofavor: " a získat si tak vaši přízeň."
 yearly.0001.desc.favor: " a oplatit vám tak pomoc, kterou jste mi v minulosti poskytli."
 yearly.0001.desc.friend: "[ROOT.Char.Custom('YearlyEvent0001Skill')|U] vždy patřily k mým silným stránkám a o své zkušenosti se s vámi chci podělit. Pokud si najdete čas na pár lekcí, ochotně vám předám vše, co vím."
 yearly.0001.a: "Vaší pomoci si velice vážím."
 yearly.0001.a.success: "Vezmu si lekce od [mentor.GetFirstNameNoTooltip] k srdci"
 yearly.0001.a.failure: "[mentor.GetFirstNameNoTooltip] mi poradí s mou současnou situací"
 yearly.0001.b: "Velkorysá nabídka, ale co kdybych místo toho [Select_CString(ROOT.Char.IsFemale, 'pomohla vám', 'pomohl vám')] já?"
 yearly.0001.b.success: "[mentor.GetFirstNameNoTooltip] si vezme mé lekce k srdci"
 yearly.0001.b.failure: "Poradím [mentor.GetFirstNameNoTooltip] s nynější situací"
 yearly.0001.c: "Když spojíme své znalosti, prospěje to nám oběma!"
 yearly.0001.d: "[Select_CString(ROOT.Char.IsFemale, 'Sama si poradím', 'Sám si poradím')] si vedu docela dobře."
 yearly.0002.t: "Indiskrétní rádce"
 yearly.0002.desc: "Za věrné služby v roli mého [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('councillor') )] dostal[Select_CString(councillor.IsFemale, 'a', '')] [councillor.GetTitledFirstName] ode mě svolení volně se pohybovat po mém [ROOT.Char.Custom('GetCourt')].\n\nTeď však vyšlo najevo, že mé pohostinnosti zneužívá a udržuje nepřípustně důvěrný vztah s mým [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('child') )] [child.GetFirstName]!"
 yearly.0002.a: "Musejí se vzít, jedině tak své provinění odčiní."
 yearly.0002.c: "[councillor.GetFirstNameNoTooltip] za tuhle zradu shnije v žaláři!"
 yearly.0002.d: "Byla by škoda, kdyby se to rozkřiklo..."
 yearly.0003.t: "Zakázaná láska"
 yearly.0003.start.desc: "Nejdřív jsem to [Select_CString(ROOT.Char.IsFemale, 'považovala', 'považoval')] za žert. Jak je možné, že můj [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] a [relative.Custom2('HerHisCharacterIntroductionNoComma', SCOPE.sC('child'))] jsou milenci?! Jenže dopis, který zachytili mí špehové,"
 yearly.0003.dislikes_incest.desc: " popisuje milostná setkání, k jakým by mezi příbuznými nikdy nemělo docházet..."
 yearly.0003.likes_incest.desc: " zachází do #EMP fascinujících#! podrobností o jejich tělesném vztahu..."
 yearly.0003.b: "Pokusím se jejich dostaveníčka utajit."
 yearly.0003.a: "Celý svět se dozví o jejich zločinech proti [ROOT.Char.GetFaith.PantheonTerm]!"
 yearly.0003.c: "Za potupu rodu [ROOT.Char.GetHouse.GetNameNoTooltip] je oba uvězním!"
 yearly.0003.d: "Pozvu je do své [ROOT.Char.Custom('GetChamber')] na trochu „rodinné zábavy“."
 yearly.0011.t: "Spatřena kometa!"
 yearly.0011.desc: "Když se na nebi objeví kometa, každý smrtelník se na okamžik zastaví. Co může znamenat ten podivný úkaz, který se tak nečekaně toulá po naší obloze?\n\nMoudřejší [ROOT.Char.GetWomenMen] než já strávili celý život úvahami nad menšími záhadami, ale každý domýšlivý sedlák v [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] má očividně vlastní nedomyšlenou teorii..."
 yearly.0011.gain_stress: "Kometa vyděsí nespočet poddaných"
 yearly.0011.lose_stress: "Kometa vyděsí mnoho potížistů"
 gain_rock_artifact_tt: "Získáš [Concept('artifact','artefakt')|e] $artifact_pedestal_rock_name$"
 yearly.0011.new_friends: "Možná přináší nové přátele?"
 yearly.0011.lustful: "Rychle, ať mě někdo obejme!"
 yearly.0011.chaste: "Tohle na nás přivolali smilníci!"
 yearly.0011.gluttonous: "Smrt se blíží! Naplňte spižírny!"
 yearly.0011.temperate: "To je trest za naši nestřídmost!"
 yearly.0011.greedy: "Kdoví, jaké podivné bohatství může kometa přinést..."
 yearly.0011.generous: "Tohle #EMP dokazuje#!, že jsme všichni příliš sobečtí!"
 yearly.0011.lazy: "Kašlu na to, jdu zpátky do postele."
 yearly.0011.diligent: "Kdybychom pracovali, trápilo by nás to méně."
 yearly.0011.wrathful: "Tu zatracenou věc strhnu z nebe!"
 yearly.0011.calm: "I tohle pomine."
 yearly.0011.patient: "Časem přijdeme na to, co toto znamení značí."
 yearly.0011.impatient: "Co to zatraceně znamená?!"
 yearly.0011.arrogant: "Tohle je bezpochyby dobré znamení pro můj rod."
 yearly.0011.humble: "Před Stvořením jsme všichni pouhá smítka."
 yearly.0011.deceitful: "Jaké vysvětlení by se mi asi hodilo nejvíc..."
 yearly.0011.honest: "Vždyť to vypadá jen jako nějaký kámen, ne?"
 yearly.0011.craven: "#EMP VŠICHNI PANIKAŘTE!#!"
 yearly.0011.brave: "Ať už to znamená cokoli, postavíme se tomu čelem!"
 yearly.0011.shy: "Možná bych [Select_CString(ROOT.Char.IsFemale, 'byla', 'byl')] ve své věži v bezpečí..."
 yearly.0011.gregarious: "Jestli je to konec, oslavme ho s přáteli!"
 yearly.0011.ambitious: "Komety zvěstují velké činy a [Select_CString(ROOT.Char.IsFemale, 'velké ženy', 'velké muže')]!"
 yearly.0011.content: "Ať už to znamená cokoli, mělo se to stát."
 yearly.0011.arbitrary: "Znamená to přesně to, co řeknu!"
 yearly.0011.just: "Ó kometo, ó posle božské spravedlnosti!"
 yearly.0011.cynical: "Nejspíš je to jen sražený sedlácký plyn."
 yearly.0011.zealous: "Konec se blíží! Kajícníci, čiňte pokání!"
 yearly.0011.paranoid: "Moji nepřátelé proti mně poštvali samotná nebesa!"
 yearly.0011.trusting: "M-možná to vůbec nic neznamená?"
 yearly.0011.compassionate: "Doufám, že to na nikoho nespadne..."
 yearly.0011.callous: "Pokud to nespadne na mě, je mi to jedno."
 yearly.0011.sadistic: "Doufám, že to spadne na nějakého nepřítele!"
 yearly.0011.stubborn: "Kvůli ničemu menšímu než nebi #EMP i#! zemi se nehnu."
 yearly.0011.fickle: "Nemůžu se rozhodnout, co si o tom myslet..."
 yearly.0011.vengeful: "Ha! Někdo konečně dostane, co si zaslouží!"
 yearly.0011.forgiving: "Veliký [ROOT.GetCharacter.GetFaith.HighGodName], odpusť nám naše hříchy!"
 yearly.0025.t.chain_title: "Provoz hostince"
 yearly.0025.t: "$yearly.0025.t.chain_title$: Starý a zapomenutý"
 yearly.0025.desc: "Při procházce po osamělé cestě v [county.GetBaseNameNoTier] se svou družinou zahlédnu v dálce temnou siluetu, která s každým mým krokem pomalu nabývá jasnějších obrysů.\n\nČím blíž jsem, tím lépe vidím, co přede mnou stojí. Stará krčma, opuštěná a zapomenutá. Trocha péče a lásky by té omšelé budově snadno vdechla nový život a mohl by z ní být útulný hostinec.\n\nNechápu, proč to tu tak zchátralo. Nedaleko leží několik vesnic a už samotný vchod působí přívětivě. Všechno nasvědčuje tomu, že by tohle místo mohlo slušně vydělávat.\n\nStačí jen správn[Select_CString(ROOT.Char.IsFemale, 'á majitelka', 'ý majitel')]."
 yearly.0025.a: "Postarám se, aby to tu vzkvétalo!"
 yearly.0025.a.tt.progress: "Investuješ prostředky do obnovy hostince a výsledkem bude buď #N špatný#!, #M průměrný#! nebo #P dobrý#! výsledek a odpovídající odměny."
 yearly.0025.b: "Půjdeme dál, je to příliš velké riziko."
 yearly.0026.t: "$yearly.0025.t.chain_title$: Renovace"
 yearly.0026.desc: "Jakmile vstoupím do téhle skořápky budovy, rychle pochopím, proč byla opuštěna a ponechána svému osudu.\n\nVe vzduchu se vznáší slabý pach něčeho, co nedokážu určit, a děravou střechou pomalu odkapává voda do bahnité bažiny, která tu zastupuje podlahu.\n\nOpravit to by #EMP nebylo zase tak#! těžké, ale rozhodně to bude otravné a drahé. Ať tak či onak, lidé z [county.GetNameNoTier] se sem určitě pohrnou. Nový podnik zaštítěný samotn[Select_CString(ROOT.Char.IsFemale, 'ou', 'ým')] [ROOT.Char.GetTitleAsNameNoTooltip] má přece jen své kouzlo."
 yearly.0026.a: "Prostě... naházejte na to bláto trochu slámy."
 yearly.0026.a.tt.success: "Vystačím si s tím, co mám"
 yearly.0026.a.tt.failure: "Nepodaří se mi najít dobré řešení"
 yearly.0026.b: "Něco opravíme, ale musíme dodržet termín."
 yearly.0026.c: "Předěláme #EMP úplně všechno!#!"
 yearly.0026.tt.bad: "Hostinec se zlepší jen #N trochu#!."
 yearly.0026.tt.average: "Hostinec se #M docela#! zlepší."
 yearly.0026.tt.good: "Hostinec se zlepší #P výrazně#!."
 yearly.0027.t: "$yearly.0025.t.chain_title$: Hody jako pro [Select_CString(ROOT.Char.IsFemale, 'královnu', 'krále')]"
 yearly.0027.desc: "Myšlenkami se pomalu zatoulám k tomu, jaký potenciál tohle místo má a kolik vzpomínek tu může vzniknout.\n\nK dobrému večeru samozřejmě patří vydatné jídlo a nic nezažene chmury rychleji než džbánek dobrého piva. Pořádný kus mastného masa, opilec bezvládně rozvalený na lavici, noví přátelé s rozmazanými tvářemi... všechny přísady povedeného večera!\n\nOtázkou je, v čem mám hosty nechat se oddávat požitkům. Pivo, víno, pálenka..."
 yearly.0027.a: "Koho zajímá #EMP pití#!? Budu tam já!"
 yearly.0027.a.tt.success: "Můj šarm zabere"
 yearly.0027.tt.good: "$yearly.0026.tt.good$"
 yearly.0027.a.tt.failure: "Nejsem tak okouzlující, jak jsem si myslel[Select_CString(ROOT.Char.IsFemale, 'a', '')]"
 yearly.0027.tt.bad: "$yearly.0026.tt.bad$"
 yearly.0027.b: "Pro každého nasolený tuřín."
 yearly.0027.c: "Zařídím, aby si tihle sedláci připadali jako králové a královny."
 innkeeper_bad_edibles_char_modifier: "Šetrný hostitel"
 innkeeper_bad_edibles_char_modifier_desc: "Jídlo nabízené v hostinci této postavy obsahovalo více plísně než masa."
 innkeeper_neutral_edibles_char_modifier: "Vyvážená strava"
 innkeeper_neutral_edibles_char_modifier_desc: "Během otevíracího večera nově zakoupeného hostince měla tato postava jen omezený výběr jídla."
 innkeeper_fancy_edibles_char_modifier: "Nestřídmost"
 innkeeper_fancy_edibles_char_modifier_desc: "Během otevíracího večera hostince byl k dispozici přepychový výběr jídel a nápojů."
 yearly.0028.t: "$yearly.0025.t.chain_title$: A teď představení!"
 yearly.0028.desc: "Hostinec by jistě nebyl úplný bez nějaké zábavy pro všechny ty davy hostů.\n\nCo třeba zpívající bard s písněmi o lásce i válce? Nebo básník, který by ostatní inspiroval silou svých slov? A proč ne obratný šašek, který všechny rozesměje k slzám a alespoň na jednu noc zažene jejich trápení?\n\nMusím zvážit, jaké vystoupení hosty udrží v napětí. Čím déle tu zůstanou, tím víc toho vypijí."
 yearly.0028.a: "Najměte výřečného barda."
 yearly.0028.b: "Najděte talentovaného básníka."
 yearly.0028.c: "Přiveďte mi obratného šaška."
 yearly.0028.a.gain.bard: "Nakonec máš šanci #P získat#! ke svému dvoru barda."
 yearly.0028.b.gain.poet: "Nakonec máš šanci #P získat#! ke svému dvoru básníka."
 yearly.0028.c.gain.jester: "Nakonec máš šanci #P získat#! ke svému dvoru šaška."
 yearly.0028.tt.minor_xp_gain: "Tvé vyjednávací schopnosti se trochu hodí"
 yearly.0028.tt.major_xp_gain: "Tvé vyjednávací schopnosti se velmi hodí"
 yearly.0029.t: "$yearly.0025.t.chain_title$: Otevírací večer"
 yearly.0029.conclusion_intro: "První večer hostince byl dlouhý a vyčerpávající, plný vzestupů i pádů. Dalo se to čekat, ale stejně jsem naprosto vyčerpaný."
 yearly.0029.refurbishment_bad.1: "Můj nový hostinec už nejspíš zažil lepší časy. Dnešek mezi ně rozhodně nepatřil.\n\n"
 yearly.0029.refurbishment_bad.2: "Doufal jsem, že střecha ještě chvíli vydrží. Bohužel na výčep prší víc vody, než se tu čepuje piva.\n\n"
 yearly.0029.refurbishment_bad.3: "Ten zápach prostě nechce zmizet. Obávám se, že mě bude strašit ve snech navěky.\n\n"
 yearly.0029.refurbishment_average.1: "Pár stoliček někdo ukradl, alespoň mám ale záminku pořídit další.\n\n"
 yearly.0029.refurbishment_average.2: "Na stolech přibylo pár neumělých rytin, ale nic, co by stálo za řeč.\n\n"
 yearly.0029.refurbishment_average.3: "Naštěstí naše opravy vydržely, přestože střecha skřípala poněkud zlověstně.\n\n"
 yearly.0029.refurbishment_good.1: "Investice do oprav se rozhodně vyplatila.\n\n"
 yearly.0029.refurbishment_good.2: "Pár dalších míst k sezení by neuškodilo.\n\n"
 yearly.0029.refurbishment_good.3: "Naštěstí i poslední host právě odešel s úsměvem na tváři.\n\n"
 yearly.0029.edibles_bad.1: "Jídlo příliš velký úspěch nemělo... většina skončila mezi prkny podlahy.\n\n"
 yearly.0029.edibles_bad.2: "Těch pár odvážlivců, kteří si objednali jídlo, nakonec nenašlo odvahu ani k jedinému soustu.\n\n"
 yearly.0029.edibles_bad.3: "Každý nehlídaný tác se proměnil v malou hostinu pro místní krysy. Zástupy a zástupy #EMP krys.#!\n\n"
 yearly.0029.edibles_average.1: "Zdá se, že hostům většina jídla chutnala, i když přitom museli odehnat pár obzvlášť drzých krys.\n\n"
 yearly.0029.edibles_average.2: "Někteří hosté se nad podávaným pivem podezřívavě mračili, očichali ho... a pak ho stejně obrátili do sebe.\n\n"
 yearly.0029.edibles_average.3: "Jídlo ani pivo sice nebyly nijak výjimečné, ale hosté se očividně dobře bavili. Mnozí byli doslova povzneseni alkoholem.\n\n"
 yearly.0029.edibles_good.1: "Hostinský sotva stíhal držet krok s objednávkami. Hosté se ještě ani pořádně neusadili a už volali po další rundě.\n\n"
 yearly.0029.edibles_good.2: "Ze všeho toho jásotu jsem skoro ohluchl. Tak dlouho a hlasitě se tu slavilo.\n\n"
 yearly.0029.edibles_good.3: "Ani jediný podávaný talíř se nevrátil zpátky byť jen s drobečkem.\n\n"
 yearly.0029.entertainment_bard_bad: "Když [Select_CString(entertainer.IsFemale, 'bardka vystoupila', 'bard vystoupil')] před hosty, působil[Select_CString(entertainer.IsFemale, 'a', '')]... nervózně, jako by před publikem nikdy předtím [Select_CString(entertainer.IsFemale, 'nehrála', 'nehrál')]. V očích měl[Select_CString(entertainer.IsFemale, 'a', '')] děs, jako by právě vstoupil[Select_CString(entertainer.IsFemale, 'a', '')] na bitevní pole. Pak ze sebe vydal[Select_CString(entertainer.IsFemale, 'a', '')] jediný pronikavý skřek a utekl[Select_CString(entertainer.IsFemale, 'a', '')].\n\n"
 yearly.0029.entertainment_bard_average: "[Select_CString(entertainer.IsFemale, 'Bardka vstoupila', 'Bard vstoupil')] před hosty poměrně sebejistým krokem, přitáhl[Select_CString(entertainer.IsFemale, 'a si', ' si')] stoličku a s duněním na ni položil[Select_CString(entertainer.IsFemale, 'a', '')] těžkou botu. Jakmile však vytáhl[Select_CString(entertainer.IsFemale, 'a', '')] loutnu, veškeré předchozí sebevědomí bylo pryč. Hosté si museli vyslechnout kolísavou, skřípavou baladu, kterou by neocenil ani umírající hluchý stařec.\n\n"
 yearly.0029.entertainment_bard_good: "Zpočátku se z temnoty venku ozývala jen slabá melodie, která si pomalu získávala pozornost každého opilce v hostinci. Dav postupně ztichl a všechny oči se upřely ke dveřím. Píseň sílila a sílila, až se dveře náhle rozletěly a dovnitř vstoupil[Select_CString(entertainer.IsFemale, 'a půvabná bardka', ' pohledný bard')]. Refrén vystoupal k mohutnému vyvrcholení, aby se vzápětí přelil do rozpustilé melodie doprovázené bouřlivým jásotem. A rozhodně ne posledním toho večera.\n\n"
 yearly.0029.entertainment_poet_bad: "[Select_CString(entertainer.IsFemale, 'Básnířka vstoupila', 'Básník vstoupil')] před hosty s útržkem pergamenu v ruce a ze všech sil se snažil[Select_CString(entertainer.IsFemale, 'a', '')] získat jejich pozornost, ovšem téměř bez úspěchu. Nakonec se ještě jednou zadíval[Select_CString(entertainer.IsFemale, 'a', '')] do poznámek a pokusil[Select_CString(entertainer.IsFemale, 'a', '')] se vypísknout prvních pár veršů. Okamžitě je však přehlušil sbor bučení a [entertainer.GetFirstNameNoTooltip] s pláčem utekl[Select_CString(entertainer.IsFemale, 'a', '')] do noci.\n\n"
 yearly.0029.entertainment_poet_average: "Jakmile [Select_CString(entertainer.IsFemale, 'básnířka vstoupila', 'básník vstoupil')], její[Select_CString(entertainer.IsFemale, '', '')] oslnivé vystupování okamžitě přitáhlo pohledy a i ti nejtupější hosté zvedli hlavy od korbelů. Jakmile však začala recitace, kouzlo pominulo. Místo něčeho podmanivého přišel jen pohřební nářek a nechápavý dav rychle ztratil zájem a vrátil se k pivu.\n\n"
 yearly.0029.entertainment_poet_good: "[Select_CString(entertainer.IsFemale, 'Básnířka rázně vstoupila', 'Básník rázně vstoupil')] na scénu a své verše pronášel[Select_CString(entertainer.IsFemale, 'a', '')] s tak spalující vášní, že žádné srdce nezůstalo nedotčené. Slova na nás dopadala s takovou vahou, že všechny předchozí pocity vedle nich působily... nicotně. Nikdo toho dne neopustil hostinec bez slzy v oku, ať už radostí, nebo smutkem.\n\n"
 yearly.0029.entertainment_jester_bad: "Ten šašek ze mě udělal hlupáka. Věřil jsem, že večer skutečně dorazí, ale nakonec po něm nebylo ani stopy. Nadšené očekávání zábavy rychle vystřídala rozmrzelost a podráždění hosté nevěřícně reptali nad mými chabými výmluvami.\n\n"
 yearly.0029.entertainment_jester_average: "Šašek dokázal v hostinci trochu odlehčit náladu, i když za cenu několika trapných tich a vtipů, které prostomyslným, případně prostě opilým, sedlákům létaly vysoko nad hlavou.\n\n"
 yearly.0029.entertainment_jester_good: "Šašek vtrhl na scénu s výkřikem a přemetem. Celý hostinec propukl v jásot a potlesk, zatímco [entertainer.GetFirstNameNoTooltip] ladně létal[Select_CString(entertainer.IsFemale, 'a', '')] vzduchem a přeskakoval[Select_CString(entertainer.IsFemale, 'a', '')] stoly, stoličky i samotné hosty. Každý druhý kousek doprovázel[Select_CString(entertainer.IsFemale, 'a', '')] pohotovým vtípkem, dokonce i když sotva popadal[Select_CString(entertainer.IsFemale, 'a', '')] dech, takže na konci večera byl[Select_CString(entertainer.IsFemale, 'a', '')] naprosto vyčerpaný[Select_CString(entertainer.IsFemale, '', '')]. Nakonec to byl dechberoucí večer pro všechny zúčastněné, v některých případech doslova.\n\n"
 yearly.0029.conclusion_outro: "Má práce je zde u konce."
 yearly.0029.a: "To byl ale večer!"
