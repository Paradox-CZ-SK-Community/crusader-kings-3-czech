l_polish:
 yearly_persian.1002.t: "Nowruz"
 yearly_persian.1002.desc: "Můj dvůr každoročně slaví [iranian.GetName] svátek Nowruz, ale povinnosti, které mám jako [ROOT.Char.GetTitleAsNameNoTooltip], mi často brání se oslav skutečně účastnit.\n\nRovnodennost se blíží a mému panství se daří, navíc je klidné a stabilní. Přemýšlím proto, zda si letos nedopřát na oslavy trochu víc času. [ROOT.Char.Custom('ResidenceBuilding')] přece počká a já se můžu konečně nechat strhnout sváteční náladou."
 yearly_persian.1002.a: "Uctím Džamšída štědrými dary drahokamů a zlata!"
 yearly_persian.1002.b: "Je čas radovat se a navštěvovat druhé!"
 yearly_persian.1002.c: "Tradiční obřad haft-sín strávím se svou rodinou."
 yearly_persian.1002.d: "Nemůžu odpočívat, čeká mě příliš mnoho práce!"
 yearly_persian.1002.every_iranian_character: "Všichni vazalové a dvořané, jejichž [Concept('heritage','dědictví')|E] je [iranian.GetName]"
 yearly_persian.1002.every_friend_and_neighboring_ruler: "Všichni [Concept('friend','přátelé')|E] a sousední [Concept('ruler','vládci')|E]"
 yearly_persian.1002.every_spouse_and_close_family_member: "Každá [Concept('spouse','choť')|E] a každý [Concept('close_family_member','člen blízké rodiny')|E]"
 yearly_persian.1101.t: "Šu'úbíja"
 yearly_persian.1101.desc.arabic: "Spolu s šířením islámu se z Arabského poloostrova šíří i arabská kultura."
 yearly_persian.1101.desc.seljuk: "Od velkých seldžuckých výbojů se naše dějiny a kultura šíří mezi novými poddanými."
 yearly_persian.1101.desc.ending: "\n\nMnoho kmenů a kultur přijalo jazyk i tradice, jimiž se vyznačuje [ROOT.Char.GetCulture.GetName] kultura. Peršané žijící na Íránské vysočině se však tomuto šíření urputně brání.\n\nJejich vlastní kulturní tradice vycházejí z odkazu velké Achaimenovské a Sásánovské říše. Na svůj původ jsou nesmírně hrdí a chtějí své dějiny zachovat i pod cizí nadvládou."
 yearly_persian.1101.every_county: "Každé hrabství, jehož kultura je [persian.GetName]"
 yearly_persian.1101.every_family: "Každý [Concept('close_family_member','člen blízké rodiny')|E]"
 yearly_persian.1101.a: "Donutím je všechny uznat naši nadvládu. [ROOT.Char.GetCulture.GetName] kultura musí zvítězit!"
 yearly_persian.1101.b.seljuk: "Když přijmu #EMP jejich#! zvyky, [Select_CString(ROOT.Char.IsFemale, 'mohla bych', 'mohl bych')] založit třetí Perskou říši!"
 yearly_persian.1101.c: "Tak rozmanití poddaní jsou požehnáním!"
 yearly_persian.1101.c.warning: "$stewardship_domain.1073.c.warning$"
