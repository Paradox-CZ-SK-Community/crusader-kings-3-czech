 yearly_republic.1014.d.toast: "Staré křivdy jsou zapomenuty" # todo: NEW TRANSLATION
 yearly_republic.1014.e.toast: "Rody spojily své zájmy" # todo: NEW TRANSLATION
 yearly_republic.1015.t: "Zlato za hlasy" # todo: NEW TRANSLATION
 yearly_republic.1015.desc: "[patrician.GetTitledFirstName|U] mě zastihne, když se procházím tržištěm. [patrician.GetSheHe|U] ke mně přistoupí s nenuceným úsměvem a pečlivě ztišeným hlasem.\n\n„Ach, je příjemné si odpočinout od té úmorné záležitosti, jakou je hlasování ve shromáždění. Často si nevím rady, jak hlasovat. Moudrá mysl, jako je ta vaše, je zlatým majákem v mlžném moři a ubožákovi, jako jsem já, ukazuje cestu těmito spletitými politickými záležitostmi.“ [patrician.GetSheHe|U] dramaticky vzdychne.\n\n„Jenže mám málo peněz. Jak má chudý lodník příště nasměrovat svou příď, až shromáždění vyhlásí hlasování?“" # todo: NEW TRANSLATION
 yearly_republic.1015.a: "Jen si řekni o svou cenu." # todo: NEW TRANSLATION
 yearly_republic.1015.c: "Mé návrhy obstojí samy o sobě." # todo: NEW TRANSLATION
 yearly_republic.1016.t: "Vynucení hlasu" # todo: NEW TRANSLATION
 yearly_republic.1016.desc: "[patrician.GetTitledFirstName|U] je drzý červ, ale [patrician.GetSheHe] má hlas ve shromáždění i tak; hlas, k jehož poskytnutí by se [patrician.GetSheHe] dal „přesvědčit“, aby mi posloužil.\n\nStačí na [patrician.GetHerHim] trochu zatlačit, aby [patrician.GetSheHe] pochopil, jaké následky hrozí tomu, kdo zklame muže, jako jsem já." # todo: NEW TRANSLATION
 yearly_republic.1016.a: "Podkopej [Select_CString(patrician.IsFemale,'její','jeho')] obchodní zájmy." # todo: NEW TRANSLATION
 yearly_republic.1016.b: "Nech tlupu surovců přepadnout a zmlátit [Select_CString(patrician.IsFemale,'jejího','jeho')] dvořana." # todo: NEW TRANSLATION
 yearly_republic.1016.c: "Zapalte [Select_CString(patrician.IsFemale,'její','jeho')] dům." # todo: NEW TRANSLATION
 yearly_republic.1016.d: "Naučím [patrician.GetHerHim] hrůze!" # todo: NEW TRANSLATION
 yearly_republic.1016.e: "Nech [patrician.GetHerHim] hlasovat podle [Select_CString(patrician.IsFemale,'její','jeho')] svědomí." # todo: NEW TRANSLATION
 yearly_republic.1016.pledge.toast: "[patrician.GetShortUINameNoTooltip] se zavázal hlasovat jako ty" # todo: NEW TRANSLATION
 yearly_republic.1016.d.tt: "[house_member.GetNameNoTooltip] bude ostatním pro výstrahu." # todo: NEW TRANSLATION
 yearly_republic.1017.t: "Filozofové-králové" # todo: NEW TRANSLATION
 yearly_republic.1017.desc: "Večeře se protáhla do pozdních nočních hodin; nápoje tečou proudem a jazyky se rozvazují.\n[debater_01.GetFirstName], [debater_02.GetFirstName], [debater_03.GetFirstName] a já jsme prodebatovali všechna témata pod sluncem.\n\nUvědomuji si, že rozmlouvám s těmi nejučenějšími patriciji republiky — vskutku vznešenou společností. Právě takové lidi by šlo přesvědčit, aby při příštím zasedání shromáždění hlasovali podle mého přání, a to pádnými argumenty a brilantními myšlenkami." # todo: NEW TRANSLATION
 yearly_republic.1017.a: "Přesvědčím je brilantním řečnickým uměním." # todo: NEW TRANSLATION
 yearly_republic.1017.b: "Ohromím je neprůstřelností svého úsudku." # todo: NEW TRANSLATION
 yearly_republic.1017.c: "Možná bude lepší naslouchat a učit se." # todo: NEW TRANSLATION
 yearly_republic.1017.a.success.desc: "V řečnickém souboji překonáš [debater_orator.GetFirstNameNoTooltip], nejlepšího řečníka u stolu" # todo: NEW TRANSLATION
 yearly_republic.1017.a.success.toast: "Stůl se nechal přesvědčit" # todo: NEW TRANSLATION
 yearly_republic.1017.a.failure.desc: "[debater_orator.GetFirstNameNoTooltip], nejlepší řečník u stolu, tě umluví" # todo: NEW TRANSLATION
 yearly_republic.1017.a.failure.toast: "Tvá rétorika neuspěla" # todo: NEW TRANSLATION
 yearly_republic.1017.b.success.desc: "V argumentaci překonáš [debater_scholar.GetFirstNameNoTooltip], nejučenější mysl u stolu" # todo: NEW TRANSLATION
 yearly_republic.1017.b.success.toast: "Stůl je přesvědčen" # todo: NEW TRANSLATION
 yearly_republic.1017.b.failure.desc: "[debater_scholar.GetFirstNameNoTooltip], nejučenější mysl u stolu, rozcupuje tvé argumenty" # todo: NEW TRANSLATION
 yearly_republic.1017.b.failure.toast: "Tvůj argument je rozcupován" # todo: NEW TRANSLATION
 yearly_republic.1017.c.toast: "Noc strávená nasloucháním" # todo: NEW TRANSLATION
 yearly_republic.1017.c.tt: "Je malá šance, že noční debata v tobě zanechá trvalou stopu" # todo: NEW TRANSLATION
 yearly_republic.1017.c.insight.toast: "Debata v tobě zanechala stopu" # todo: NEW TRANSLATION
 yearly_republic.1018.t: "Přichází s dary" # todo: NEW TRANSLATION
 yearly_republic.1018.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetName] se bez ohlášení objeví u mé brány. Po pozdravech a srdečném objetí mě [benefactor_01.GetFirstNameNoTooltip] zavede ven k čekajícímu vozu naloženému zbožím a tretkami.\n\n„Promiň, že jsem návštěvu neohlásil předem, ale měl jsem cestu kolem a napadlo mě, že by tě potěšila tato [new_curio.GetType], kterou jsem získal při svých nedávných cestách.“\n\n[benefactor_01.GetSheHe|U] z vozu sejme plachtu a odhalí [new_curio.GetName]." # todo: NEW TRANSLATION
 yearly_republic.1018.a: "„Děkuji, můj [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)]!“" # todo: NEW TRANSLATION
 yearly_republic.1018.b: "Možná by se to dalo dobře prodat?" # todo: NEW TRANSLATION
 yearly_republic.1018_domicile_curio_sold_tt: "Později prodáš [new_curio.GetName]." # todo: NEW TRANSLATION
 yearly_republic.1019.t: "Smysl pro detail" # todo: NEW TRANSLATION
 yearly_republic.1019.desc: "Další den trávíme procházkou ulicemi [event_location_01.GetName] s mým [ROOT.Char.Custom2('RelationToMeShort', benefactor_01)] [benefactor_01.GetShortUIName]. Vždycky je na co se dívat a o čem diskutovat.\n\n„Podívej, jak skladují ty potraviny; v [target_city.GetNameNoTooltip] jsem viděl, že to umí mnohem lépe. Věř mi, [ROOT.Char.GetFirstNameNoTooltip], od lidí kolem nás se toho můžeme spoustu naučit, když budeme jen trochu pozorní.“" # todo: NEW TRANSLATION
 yearly_republic.1019.a: "„Naučil ses při svých cestách něco o [experience_trade_category_01.GetNameNoTooltip]?“" # todo: NEW TRANSLATION
 yearly_republic.1019.b: "„Pojďme na tržišti probrat [experience_trade_category_02.GetNameNoTooltip].“" # todo: NEW TRANSLATION
 yearly_republic.1019.c: "Pozorování bych měl zařadit do každodenního života." # todo: NEW TRANSLATION
 yearly_republic.1020.t: "Lázeňská dohoda" # todo: NEW TRANSLATION
 yearly_republic.1020.desc: "„…obchod mezi důvěryhodnými partnery přece jen vzkvétá.“\n\n[house_benefactor_01.GetFirstName] si vylije vědro vody na [Select_CString(house_benefactor_01.IsFemale,'její','jeho')] vlastní hlavu, znovu se ke mně otočí a zvážní. „Vaše rodina má naši úctu, [ROOT.Char.GetFirstName].“\n\nPára z lázní mi zamlžuje zrak a horká voda mi uvolňuje svaly.\n\n„Vy a vaši lidé jste byli našemu rodu [house_benefactor_01.GetDynastyHouseNameNoTooltip] dobrými přáteli. Považuji proto za přirozené, abychom prohloubili naši spolupráci. Prospělo by to oběma našim rodům.“" # todo: NEW TRANSLATION
 yearly_republic.1020.a: "„Měli bychom sdílet spolčence a kontakty v zahraničí a rozšířit tak svůj dosah.“" # todo: NEW TRANSLATION
 yearly_republic.1020.b: "„Podělme se o své znalosti a společně zesílíme.“" # todo: NEW TRANSLATION
 BUCENTAUR_GLOSS: "Bucentaur byla pozlacená státní galéra Benátek, kterou veslovali veslaři z Arsenalu a která sloužila výhradně k obřadním účelům." # todo: NEW TRANSLATION
 DESPONSAMUS_GLOSS: "#bold Desponsamus te, mare, in signum veri perpetuique dominii#! — latinsky „bereme si tě, moře, na znamení pravé a věčné vlády“." # todo: NEW TRANSLATION
