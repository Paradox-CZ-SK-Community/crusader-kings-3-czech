l_polish:
 yearly_republic.1001.t: "Pojď do postele, drahý" # todo: NEW TRANSLATION
 yearly_republic.1001.desc: "Přestože se blíží půlnoc, můj [spouse_target.GetWifeHusband] [spouse_target.Custom('CZ_TitledFirstName')] mě nachází pohrouženého do dokumentů, jak znovu procházím účetní knihy.\n\n„Pojď do postele, můj [ROOT.Char.GetWifeHusband],“ naléhá [spouse_target.GetSheHe]. „Práce přece počká do zítřka, ne?“\n\n„Nebo,“ řekne [spouse_target.GetFirstNameNoTooltip] zamyšleně, „bych ti možná mohla s prací pomoct?“" # todo: NEW TRANSLATION
 yearly_republic.1001.a: "Raději nám přines víc svíček, má lásko." # todo: NEW TRANSLATION
 yearly_republic.1001.b: "Mám tolik povinností, že to nestíhám. Nech mě být!" # todo: NEW TRANSLATION
 yearly_republic.1001.c: "Svět počká, když tě mám po svém boku." # todo: NEW TRANSLATION
 yearly_republic.1001.communal: "Všichni [Concept('vassals','vazalové')|E] získají #P 10#! mínění o #value tobě#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 yearly_republic.1002.t: "Trnité manželství" # todo: NEW TRANSLATION
 yearly_republic.1002.desc: "V manželství s [spouse_target.Custom('CZ_TitledFirstName')] bylo spousty svárů. Zdá se, že se na ničem neshodneme. [spouse_target.GetSheHe|U] bezpochyby pravidelnými dopisy informuje [Select_CString(spouse_target.IsFemale,'její','jeho')] příbuzné o mých „nedostatcích“.\n\nDoufal jsem, že mé manželství sblíží mé obchodní zájmy s rodem [spouse_target.GetDynastyHouseName], ale pokaždé, když se ve městě setkám s jejich spolčenci nebo klienty, vidím v jejich očích nedůvěru.\n\nPokud s tím něco neuděláme, bude se tento jedovatý pocit šířit řadami obou našich rodin jako špatná krev z infikované rány." # todo: NEW TRANSLATION
 yearly_republic.1002.a: "Koupím si vděčnost [spouse_target.GetFirstNameNoTooltip] i [Select_CString(spouse_target.IsFemale,'jejímu','jeho')] rodu." # todo: NEW TRANSLATION
 yearly_republic.1002.b: "Zfalšuji [Select_CString(spouse_target.IsFemale,'její','jeho')] dopisy, aby mě chválily." # todo: NEW TRANSLATION
 yearly_republic.1002.c: "Přísahám při [ROOT.Char.GetFaith.random_GoodGodNames], že se v tvých očích polepším." # todo: NEW TRANSLATION
 yearly_republic.1002.d: "Ať si myslí, co chtějí." # todo: NEW TRANSLATION
 yearly_republic.1002.tt.falsifying_success.desc: "Upravíš dopisy svého manželského protějšku, aby ses ukázal v lepším světle" # todo: NEW TRANSLATION
 yearly_republic.1002.falsifying_success.toast: "[spouse_target.GetDynastyHouseName] uvěří, že ses polepšil" # todo: NEW TRANSLATION
 yearly_republic.1002.tt.falsifying_failure.desc: "Nepodaří se ti zfalšovat dopisy svého manželského protějšku" # todo: NEW TRANSLATION
 yearly_republic.1002.falsifying_failure.toast: "Mínění [spouse_target.GetDynastyHouseName] o tobě se ještě zhorší" # todo: NEW TRANSLATION
 yearly_republic.1002.tt.impress_spouse_success.desc: "Tvůj manželský protějšek je tvým úsilím ohromen" # todo: NEW TRANSLATION
 yearly_republic.1002.impress_spouse_success.toast: "[spouse_target.GetDynastyHouseName] schvaluje tvé úsilí" # todo: NEW TRANSLATION
 yearly_republic.1002.tt.impress_spouse_failure.desc: "Tvůj manželský protějšek není tvým úsilím ohromen" # todo: NEW TRANSLATION
 yearly_republic.1002.impress_spouse_failure.toast: "[spouse_target.GetDynastyHouseName] tě považuje za ztracený případ" # todo: NEW TRANSLATION
 yearly_republic.1003.t: "Čest v temné uličce" # todo: NEW TRANSLATION
 yearly_republic.1003.desc: "„Ty hlupáku! Rvačky v ulicích mohou vyvolat spor mezi rody! Podívej se na sebe, krvácíš!“ vykřikne můj [spouse_target.GetWifeHusband] [spouse_target.Custom('CZ_TitledFirstName_G')], když spatří [ROOT.Char.Custom2('CZ_RelationToMeShort', rook_01)] [rook_01.Custom('CZ_TitledFirstName')]. Mladý hejsek se ale jen směje, zatímco [Select_CString(rook_01.IsFemale,'její','jeho')] krev kape na mou podlahu.\n\n„Můj protivník dopadl mnohem hůř! Ten [rook_01.Custom2('InsultNoun', SCOPE.sC('rook_02'))] [rook_02.GetFirstName] odchází domů a kulhá hanbou.“\n\nK čertu s těmi mladistvými gangy! Potulují se po ulicích se zbraněmi a naparují se, pouštějí se do rvaček a páchají všemožné zločiny pro vlastní pobavení.\n\n„Byla to jen malá rvačka. Neznepokojuj se, [rook_01.Custom2('RelationToMeShort', spouse_target)] — jen jsem hájil čest našeho rodu před urážkami.“" # todo: NEW TRANSLATION
 yearly_republic.1003.a: "Ach, pošetilosti mládí." # todo: NEW TRANSLATION
 yearly_republic.1003.b: "Je zřejmé, že za to může [rook_02.GetNameNoTooltip]. Požadujeme odškodnění!" # todo: NEW TRANSLATION
 yearly_republic.1003.c: "Pošleme [rook_02.GetDynastyHouseNameNoTooltip] dar, aby se vše urovnalo." # todo: NEW TRANSLATION
 yearly_republic.1004.t: "[other_house_character_01.Custom2('AppropriateGreetingNegative', ROOT.Char)]" # todo: NEW TRANSLATION
 yearly_republic.1004.a.desc: "Vaše obvinění namířená proti našemu rodu jsou nepodložená, pošetilá a zcela bez zásluh.\n\nNic od nás nedostanete — ledaže byste se snad politováníhodně rozhodli tuto záležitost dále rozdmýchávat; pak vám na krku projeví zdvořilou pozornost naše čepele." # todo: NEW TRANSLATION
 yearly_republic.1004.b.desc: "Jako hlava rodu [other_house_character_01.GetDynastyHouseName] hluboce lituji nepříjemností mezi našimi rodinami. Musím se omluvit za způsobené potíže a prosím, abyste tento dar přijal jako projev mé lítosti." # todo: NEW TRANSLATION
 yearly_republic.1004.a: "Této neúcty budou litovat!" # todo: NEW TRANSLATION
 yearly_republic.1004.b: "Dobrá, odškodnění si v pravý čas vymůžeme." # todo: NEW TRANSLATION
 yearly_republic.1004.c: "Přijímáme, co nám náleží." # todo: NEW TRANSLATION
 yearly_republic.1004.d: "Ať tímto naše rozepře skončí." # todo: NEW TRANSLATION
 yearly_republic.1005.t: "Veto lidu" # todo: NEW TRANSLATION
 yearly_republic.1005.desc: "Rozepře mezi naším rodem a [other_house_character_01.GetDynastyHouseName] se znovu přenesly do ulic [capital_01.GetName]. Naši vozkové se poprali o přednost v jízdě, až zablokovali celou cestu. Považoval jsem to za další malicherný spor — až dokud se u mých dveří neshromáždil dav.\n\n„Dost!“ vykřikl jeden muž. „Nemůžeme si vyřizovat své záležitosti, dokud se [ROOT.Char.GetDynastyHouseName] a [other_house_character_01.GetDynastyHouseNameNoTooltip] hádají. Přestaňte do své bídy zatahovat celé město!“\n\nMůj [ROOT.Char.Custom2('RelationToMeShort', house_member_01)] [house_member_01.Custom('CZ_TitledFirstName')] se jejich troufalosti vysměje. „Kdo jsou, aby nám diktovali, co máme dělat?“" # todo: NEW TRANSLATION
 yearly_republic.1005.a: "Ne, [ROOT.Char.Custom2('RelationToMeShort', house_member_01)]. Je čas se sejít s [other_house_character_01.GetDynastyHouseNameNoTooltip]." # todo: NEW TRANSLATION
 yearly_republic.1005.b: "Svým řečnickým uměním svalím vinu na rod [other_house_character_01.GetDynastyHouseNameNoTooltip]." # todo: NEW TRANSLATION
 yearly_republic.1005.c: "Stráže! Vyžeňte tu chátru od mých dveří." # todo: NEW TRANSLATION
 yearly_republic.1005.tt.oratory_blame.desc: "Ohromíš dav svým řečnickým uměním" # todo: NEW TRANSLATION
 yearly_republic.1005.tt.oratory_blame.toast: "Svalil jsi problémy na rod [other_house_character_01.GetDynastyHouseName]" # todo: NEW TRANSLATION
 yearly_republic.1005.tt.oratory_blame_failure.desc: "Hlasitý dav tě překřičí" # todo: NEW TRANSLATION
 yearly_republic.1005.tt.oratory_blame_failure.toast: "Nepodařilo se ti svalit vinu na rod [other_house_character_01.GetDynastyHouseName]" # todo: NEW TRANSLATION
 yearly_republic.1006.t: "[other_house_character_01.Custom2('AppropriateGreeting', ROOT.Char)]" # todo: NEW TRANSLATION
 yearly_republic.1006.a.desc: "Máte naprostou pravdu. Nastal čas sejít se a zachovat chladnou hlavu — v zájmu těch, kteří se ještě nenarodili, a pro trvalé dobro republiky. Setkáme se s vámi." # todo: NEW TRANSLATION
 yearly_republic.1006.b.desc: "Bohužel nevidíme důvod, proč vám dát příležitost lhát nám do očí. Nepochybně vám jde jen o to najít vhodnější způsob, jak nám uškodit. Žádná jednání nebudou." # todo: NEW TRANSLATION
 yearly_republic.1006.a: "Výborně!" # todo: NEW TRANSLATION
 yearly_republic.1006.b: "Zatraceně!" # todo: NEW TRANSLATION
 yearly_republic.1007.t: "Uvolnění napětí mezi rody [ROOT.Char.GetDynastyHouseNameNoTooltip] a [other_house_character_01.GetDynastyHouseNameNoTooltip]" # todo: NEW TRANSLATION
 yearly_republic.1007.desc: "Napětí ve vzduchu by se dalo krájet, když usedám naproti [other_house_character_01.Custom('CZ_TitledFirstName')] v podniku na neutrální půdě. Naši klienti zaplnili místnost a rozdělili se na dva tábory — jako dvě armády, které se pozorují přes bojiště. Dýky mají nepochybně skryté pod plášti.\n\n„Takže,“ pronese [other_house_character_01.GetFirstNameNoTooltip] zdrženlivým hlasem. „Řekni, co máš na srdci.“\n\nVšichni v místnosti na mě upírají zrak, zatímco se vzchopím a začnu." # todo: NEW TRANSLATION
 yearly_republic.1007.a: "Tento spor škodí obchodu." # todo: NEW TRANSLATION
 yearly_republic.1007.b: "Měli bychom uzavřít mír jako [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]." # todo: NEW TRANSLATION
 yearly_republic.1007.c: "Prolila se krev; spojme se pokrevním poutem." # todo: NEW TRANSLATION
 yearly_republic.1007.d: "Vyřešme to ocelí, tady a teď!" # todo: NEW TRANSLATION
 yearly_republic.1007.tt.detente_business.desc: "Přesvědčíš [other_house_character_01.GetShortUINameNoTooltip] o svých argumentech" # todo: NEW TRANSLATION
 yearly_republic.1007.tt.detente_business.toast: "[other_house_character_01.GetShortUINameNoTooltip] je přesvědčen" # todo: NEW TRANSLATION
 yearly_republic.1007.tt.detente_business_failure.desc: "Nepodaří se ti přesvědčit [other_house_character_01.GetShortUINameNoTooltip] o svých argumentech" # todo: NEW TRANSLATION
 yearly_republic.1007.tt.detente_business_failure.toast: "[other_house_character_01.GetShortUINameNoTooltip] není zcela přesvědčen" # todo: NEW TRANSLATION
 yearly_republic.1007.detente_business.change.desc: "Oba rody se dohodly, že kvůli obchodu urovnají své spory" # todo: NEW TRANSLATION
 yearly_republic.1007.piety.change.desc: "Oba rody se dohodly, že urovnají své spory z lásky k [ROOT.Char.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 yearly_republic.1007.detente_marriage.change.desc: "Oba rody se dohodly, že urovnají své spory sňatkem." # todo: NEW TRANSLATION
 yearly_republic.1007.duel_win.desc: "Vyhraješ souboj" # todo: NEW TRANSLATION
 yearly_republic.1007.duel_win.toast: "Probodneš [other_house_character_01.GetShortUINameNoTooltip]" # todo: NEW TRANSLATION
 yearly_republic.1007.duel_loss.desc: "[other_house_character_01.GetShortUINameNoTooltip] vyhraje souboj" # todo: NEW TRANSLATION
 yearly_republic.1007.duel_loss.toast: "[other_house_character_01.GetShortUINameNoTooltip] tě probodne" # todo: NEW TRANSLATION
 yearly_republic.1007.duel_win.custom: "[other_house_character_01.GetShortUINameNoTooltip] je [Select_CString(other_house_character_01.IsFemale,'zraněna','zraněn')] nebo [Select_CString(other_house_character_01.IsFemale,'zabita','zabit')]" # todo: NEW TRANSLATION
 yearly_republic.1007.duel_loss.custom: "Budeš [Select_CString(ROOT.Char.IsFemale,'zraněna','zraněn')] nebo [Select_CString(ROOT.Char.IsFemale,'zabita','zabit')]" # todo: NEW TRANSLATION # todo: GENDER FORM ROOT.Char - over, ci ROOT je postava, ktorej sa text tyka
 yearly_republic.1007.c.tt.suitable_pair: "Oba rody mají svobodné členy, kteří se mohou vzít" # todo: NEW TRANSLATION
 house_relation_reason_falsify_good_desc: "Obdrželi dopisy, které vychvalovaly dobrý charakter hlavy rodu" # todo: NEW TRANSLATION
 house_relation_reason_falsify_bad_desc: "Zjistili, že hlava rodu zfalšovala dopisy" # todo: NEW TRANSLATION
 house_relation_reason_thorny_desc: "Nešťastné manželství šíří rozkol" # todo: NEW TRANSLATION
 house_relation_reason_bribery_good_desc: "Zahrnuli manželský protějšek zlatem a šperky" # todo: NEW TRANSLATION
 house_relation_reason_street_combat_desc: "Pouliční rvačka mezi mladíky z obou rodů" # todo: NEW TRANSLATION
 house_relation_reason_business_argument_desc: "Diskutovali o výhodách obchodu" # todo: NEW TRANSLATION
 house_relation_reason_house_blamed_desc: "Byli obviněni ze společenských nepokojů" # todo: NEW TRANSLATION
 house_relation_reason_houses_aligned_desc: "Spojili se na setkání spřízněných rodů" # todo: NEW TRANSLATION
 house_relation_reason_cooperation_desc: "Prohloubili spolupráci mezi rody." # todo: NEW TRANSLATION
 demand_reparation_for_fight_desc: "Odeslat dopis s požadavkem na odškodnění" # todo: NEW TRANSLATION
 pay_reparation_for_fight_desc: "Odeslat dopis s darem a omluvou" # todo: NEW TRANSLATION
 offer_a_sitdown_desc: "Odeslat dopis s nabídkou urovnání sporů" # todo: NEW TRANSLATION
 yearly_republic.1008.t: "Vlci v rouše kupčím" # todo: NEW TRANSLATION
 yearly_republic.1008.desc: "Donesla se mi zajímavá zpráva:\nJeden z obchodních kapitánů ve službách [other_patrician_01.Custom('CZ_TitledFirstName_G')] se při plnění obchodních zakázek ve Středomoří věnuje bezohlednému pirátství a ukořistěný náklad pak prodává pro vlastní zisk — skutečně vlk v rouše beránčím!\n\nNení možné zjistit, zda [other_patrician_01.GetFirstNameNoTooltip] o této intrice ví, ale členům shromáždění, jejichž lodě a náklad byly vyrabovány, na tom sotva záleží." # todo: NEW TRANSLATION
 yearly_republic.1008.a: "Najmi kapitána, a to hned." # todo: NEW TRANSLATION
 yearly_republic.1008.b: "Vyhrožuj kapitánovi, dokud se s tebou [bandit_01.GetSheHe] nerozdělí o [Select_CString(bandit_01.IsFemale,'její','jeho')] kořist." # todo: NEW TRANSLATION
 yearly_republic.1008.c: "Vyhrožuj [other_patrician_01.GetFirstNameNoTooltip], abys získal páku." # todo: NEW TRANSLATION
 yearly_republic.1009.t: "Salon tajemství" # todo: NEW TRANSLATION
 yearly_republic.1009.desc: "Odpoledne trávím v útulném salonu, který patří [patrician_spouse_01.Custom('CZ_TitledFirstName_D')].\n\nZatímco rozmlouvám se svým [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.Custom('CZ_TitledFirstName')] a vychutnávám si [patrician_spouse_01.Custom('GetExpensiveDrink')], všimnu si malého stínu pohybujícího se na stěně poblíž velké zástěny. Po chvíli pozorování zjistím, že ho vrhá paže, která dělá drobné, přesné pohyby; když [relation_01.GetFirstNameNoTooltip] přestane mluvit, pohyby ustávají také. Někdo za zástěnou zapisuje každé slovo, které v salonu zazní!\n\nZdá se, že naše [patrician_spouse_01.Custom('HostessHost')] [patrician_spouse_01.GetFirstNameNoTooltip] a [patrician_spouse_01.GetHerHis] [patrician_husband_01.GetWifeHusband] [patrician_husband_01.Custom('CZ_TitledFirstName')] odposlouchávají rozhovory [Select_CString(patrician_spouse_01.IsFemale,'jejích','jeho')] hostů." # todo: NEW TRANSLATION
 yearly_republic.1009.a: "Musím všechny varovat před touto hanebnou intrikou!" # todo: NEW TRANSLATION
 yearly_republic.1009.a.tt: "Získáš #P 20#! mínění od #value tebe#! a #N -25#! mínění od [patrician_spouse_01.GetShortUINameNoTooltip] a [patrician_husband_01.GetShortUINameNoTooltip]" # todo: NEW TRANSLATION
 yearly_republic.1009.b: "To je skvělý nápad! Měl bych to dělat také." # todo: NEW TRANSLATION
 yearly_republic.1009.c: "Vydírej [patrician_spouse_01.GetFirstNameNoTooltip] a [patrician_spouse_01.GetHerHis] [patrician_husband_01.GetWifeHusband], aby udrželi [Select_CString(patrician_spouse_01.IsFemale,'její','jeho')] tajemství." # todo: NEW TRANSLATION
 yearly_republic.1009.c.success.desc: "Přelstíš [patrician_spouse_01.GetShortUINameNoTooltip]" # todo: NEW TRANSLATION
 yearly_republic.1009.c.success.toast: "Získáš silnou páku na [patrician_husband_01.GetShortUINameNoTooltip]" # todo: NEW TRANSLATION
 yearly_republic.1009.c.failure.desc: "[patrician_spouse_01.GetShortUINameNoTooltip] tě přelstí" # todo: NEW TRANSLATION
 yearly_republic.1009.c.failure.toast: "[patrician_husband_01.GetShortUINameNoTooltip] se blíží k tomu, aby se stal tvým sokem" # todo: NEW TRANSLATION
 yearly_republic.1009.flavor: "Kdo ví, co všechno můžeš zaslechnout?" # todo: NEW TRANSLATION
 yearly_republic.1009.b.secret_learned: "Tvé špehování odhalilo tajemství" # todo: NEW TRANSLATION
 yearly_republic.1010.t: "Patricijové na střešních trámech" # todo: NEW TRANSLATION
 yearly_republic.1010.desc: "Můj [ROOT.Char.Custom2('RelationToMeShort', relation_01)] [relation_01.Custom('CZ_TitledFirstName')] mě zastihne při poklidné procházce a nakloní se ke mně, aby zašeptal:\n\n„Velvyslanec [ambassador_01.GetFirstName] se vrátil z [ambassador_mission_location_01.GetName] a dnes večer podá zprávu na neveřejném zasedání rady v paláci.“\n\n[relation_01.GetSheHe|U] zavrtí [Select_CString(relation_01.IsFemale,'její','jeho')] hlavou. „Představ si, jakou obchodní výhodu bychom získali, kdybychom tu zprávu slyšeli ještě před jejím předložením celému shromáždění!“\n\nKdyž to [relation_01.GetFirstNameNoTooltip] říká, v dálce je vidět střecha paláce." # todo: NEW TRANSLATION
 yearly_republic.1010.a: "Vypáčíme tašky ze střechy paláce a budeme poslouchat." # todo: NEW TRANSLATION
 yearly_republic.1010.b: "Možná by se dal [ambassador_01.GetFirstNameNoTooltip] přesvědčit?" # todo: NEW TRANSLATION
 yearly_republic.1010.c: "Však se to časem dozvíme." # todo: NEW TRANSLATION
 yearly_republic.1010.a.success.desc: "Zaslechneš hlášení" # todo: NEW TRANSLATION
 yearly_republic.1010.a.success.toast: "Zaslechneš hlášení" # todo: NEW TRANSLATION
 yearly_republic.1010.a.mixed.desc: "Spadneš ze střechy" # todo: NEW TRANSLATION
 yearly_republic.1010.a.mixed.toast: "Spadneš ze střechy" # todo: NEW TRANSLATION
 yearly_republic.1010.a.failure.desc: "Spadneš do komnaty" # todo: NEW TRANSLATION
 yearly_republic.1010.a.failure.toast: "Spadneš do komnaty" # todo: NEW TRANSLATION
 yearly_republic.1010.a.mixed.custom: "Ty a [relation_01.Custom('CZ_ShortUIName_N')] získáte [GetTrait('wounded_1').GetName( GetNullCharacter )|LV] [Concept('trait','rys')|E]" # todo: NEW TRANSLATION
 yearly_republic.1010.a.failure.custom: "[republic_ruler.GetShortUIName|U] k tobě a [relation_01.Custom('CZ_ShortUIName_L')] ztratí #N 25#! [Concept('opinion','mínění')|E] #weak ($spy_opinion$)#!\n@portrait_punishment_icon! #TUT_KW Zločin — Opravňuje [republic_ruler.GetShortUIName] k oprávněnému uvěznění vás obou#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 yearly_republic.1010.b.accept: "[ambassador_01.GetShortUINameNoTooltip] je úplatku nakloněn" # todo: NEW TRANSLATION
 yearly_republic.1010.b.refuse: "[ambassador_01.GetShortUINameNoTooltip] se urazí, že ses zeptal" # todo: NEW TRANSLATION
 yearly_republic.1010.b.success.toast: "[ambassador_01.GetShortUINameNoTooltip] ti předá hlášení" # todo: NEW TRANSLATION
 yearly_republic.1010.b.failure.toast: "[ambassador_01.GetShortUINameNoTooltip] odmítne úplatek" # todo: NEW TRANSLATION
 yearly_republic.1011.t: "Předvolání do rady" # todo: NEW TRANSLATION
 yearly_republic.1011.desc: "Znovu jsem byl předvolán, abych se zúčastnil jednoho z mnoha tajných zasedání rady, díky nimž republika funguje.\n\nTakové povinnosti mě odvádějí od rodiny a obchodu, ale jako patricij nemohu předvolání odmítnout bez pádného důvodu nebo povolení od shromáždění." # todo: NEW TRANSLATION
 yearly_republic.1011.a: "Nechám svého lékaře potvrdit, že jsem upoután na lůžko." # todo: NEW TRANSLATION
 yearly_republic.1011.b: "Protože je můj drahý [ROOT.Char.Custom2('RelationToMeShort', sick_person_01)] nemocný, mám dobrý důvod zůstat doma." # todo: NEW TRANSLATION
 yearly_republic.1011.c: "Požádám shromáždění o výjimku na 5 let." # todo: NEW TRANSLATION
 yearly_republic.1011.d: "Je mou povinností jít." # todo: NEW TRANSLATION
