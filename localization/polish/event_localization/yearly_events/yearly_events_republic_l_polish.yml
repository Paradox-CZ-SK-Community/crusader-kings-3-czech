 yearly_republic.1012.t: "Průvod [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]" # todo: NEW TRANSLATION
 yearly_republic.1012.desc: "Napětí v očekávání davu je téměř hmatatelné, když průvod [ROOT.Char.GetTitleAsNamePossessive] vychází z brány paláce a vydává se na cestu městem.\n\nNejprve jdou státní úředníci, seřazení podle důležitosti a prestiže, a pak já: [ROOT.Char.GetTitleAsNameNoTooltip] v nejlepším státním rouchu, s odznaky své moci pozvednutými vysoko, aby je lid mohl obdivovat. \nZa mnou pochodují patricijové, seřazení podle významu svého rodu.\n\nKaždý je na svém místě; hierarchie a sláva naší republiky jsou během tohoto úctyhodného obřadu všem na očích!" # todo: NEW TRANSLATION
 yearly_republic.1012.a: "Za republiku! Za lid!" # todo: NEW TRANSLATION
 yearly_republic.1012.b: "Sláva shromáždění!" # todo: NEW TRANSLATION
 yearly_republic.1012.c: "Všechno odráží MOJI slávu!" # todo: NEW TRANSLATION
 yearly_republic.1012.c.tt: "Po dalších #V 10#! let stojí přijetí $republican_despot_succession_law$ [Concept('succession_law','zákon nástupnictví')|E] o #P 50%#! méně [Concept('prestige','prestiž')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 yearly_republic.1013.t: "Sňatek s mořem" # todo: NEW TRANSLATION
 yearly_republic.1013.desc: "[Glossary( '#bold Bucentaur#!', 'BUCENTAUR_GLOSS' )] minul poslední z bariérových ostrovů a přede mnou se rozprostírá slaná hladina Jaderského moře. [bishop_01.GetTitledFirstName] mi podává obřadní prsten a ustupuje.\nPozvedám ho, aby ho shromáždění hodnostáři viděli, a v souladu s prastarými obřady ho házím do zelených vln.\n\n„[Glossary( '#bold Desponsamus te, mare, in signum veri perpetuique dominii.#!', 'DESPONSAMUS_GLOSS' )]“ prohlašuji, a když dav na palubě souhlasně zaburácí, je sňatek naší republiky s mořem — zdrojem našeho bohatství a moci — dokonán." # todo: NEW TRANSLATION
 yearly_republic.1013.a: "Vládneme vlnám!" # todo: NEW TRANSLATION
 yearly_republic.1013.b: "Pošetilý a prázdný obřad." # todo: NEW TRANSLATION
 yearly_republic.1013.c: "Už jdu, má lásko!" # todo: NEW TRANSLATION
 yearly_republic.1013.d: "Moři zůstanu věrný!" # todo: NEW TRANSLATION
 yearly_republic.1014.t: "Sjednocení rodů" # todo: NEW TRANSLATION
 yearly_republic.1014.desc: "Na pozvání [faction_head_01.GetTitledFirstName] se sešli představitelé rodů s ambicí [faction_head_01.GetHouse.GetHouseAspiration.GetName].\n\n„Přátelé! V takových časech se musíme spojit a sladit své zájmy. Jinak ostatní uskupení naší milované republiky dostanou příležitost nás rozdělit a rozdrtit.“\n\nDebatujeme dlouho do noci. Naše spory jsou sice četné, ale silný hlas je může překlenout a vytvořit jednotnou frontu." # todo: NEW TRANSLATION
 yearly_republic.1014.a: "„Měli bychom všichni vstoupit ke guelfům.“" # todo: NEW TRANSLATION
 yearly_republic.1014.b: "„Měli bychom všichni vstoupit ke ghibellinům.“" # todo: NEW TRANSLATION
 yearly_republic.1014.c: "„Měli bychom posílit pouta mezi našimi rody.“" # todo: NEW TRANSLATION
 yearly_republic.1014.d: "„Všechna naše soupeření musí skončit.“" # todo: NEW TRANSLATION
 yearly_republic.1014.e: "„Měli bychom sladit své obchodní zájmy.“" # todo: NEW TRANSLATION
 yearly_republic.1014.e.tt: "Všichni [Concept('patricians','patricijové')|E] s [Concept('house_ambition','ambicemi rodu')|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] získají na 2 roky [GetModifier('gdp_ambitions_aligned_house_modifier').GetNameWithTooltip]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 yearly_republic.1014.a.tt: "Všichni [Concept('patricians','patricijové')|E] s [Concept('house_ambition','ambicemi rodu')|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] se stanou členy [Concept('situation_participant_group','skupinu účastníků')|E] [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'guelph_member' ).GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 yearly_republic.1014.b.tt: "Všichni [Concept('patricians','patricijové')|E] s [Concept('house_ambition','ambicemi rodu')|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] se stanou členy [Concept('situation_participant_group','skupinu účastníků')|E] [GetSituation('guelph_ghibelline').GetTopParticipantGroupByKey( 'ghibelline_member' ).GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 yearly_republic.1014.c.tt: "Všichni [Concept('patricians','patricijové')|E] s [Concept('house_ambition','ambicemi rodu')|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] zlepší své [Concept('house_relations','vztahy rodů')|E] mezi sebou" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 yearly_republic.1014.d.tt: "Soupeření a nepřátelství mezi [patricians|E] s [Concept('house_ambition','ambicemi rodu')|E] [faction_head_01.GetHouse.GetHouseAspiration.GetName] skončí" # todo: NEW TRANSLATION # todo: CONCEPT CASE
