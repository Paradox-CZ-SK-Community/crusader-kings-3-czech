l_polish:
 yearly_saharan.0001.t: "[target_county.GetNameNoTierNoTooltip]: [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip] obchodníci"
 yearly_saharan.0001.desc: "Těmito kraji odjakživa vedly transsaharské obchodní cesty a spolu s nimi sem proudilo bohatství, nové myšlenky i učení. Vládce jako já si obvykle prostě vezme spravedlivý podíl a o zbytek se obchodní cesty postarají samy.\n\nV poslední době však přes [target_county.GetNameNoTier] prochází stále více obchodníků z jedné náboženské komunity. Její příslušník se označuje jako [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip] a spolu s kupci sem přichází jejich víra i mince.\n\nJedno obchodní sdružení mě nyní žádá o svolení usadit se a nakupovat zde majetek. Aby si získalo mou přízeň, shromáždilo pro mě štědrý dar."
 yearly_saharan.0001.a: "Tento dar milostivě přijímám."
 yearly_saharan.0001.a.tt: "#WEAK Později to může ovlivnit místní obyvatele...#!"
 yearly_saharan.0001.b: "Procházet tudy můžete i nadále, ale nic víc."
 yearly_saharan.0001.c: "[source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip] mají do [target_county.GetNameNoTierNoTooltip] vstup zakázán a jejich zboží #EMP propadá#!!"
 yearly_saharan.0001.c.list: "Všechna sousední [Concept('counties','hrabství')|E] ve stejném [Concept('realm','panství')|E] jako [target_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0003.t: "$yearly_saharan.0001.t$: Začlenění"
 yearly_saharan.0003.desc_initial: "Obchodníci, kterým jsem před lety dovolil[Select_CString(ROOT.Char.IsFemale, 'a', '')] usadit se v [target_county.GetNameNoTier], patří ke komunitě, jejíž příslušník se označuje jako [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNameNoTooltip],"
 yearly_saharan.0003.desc_current: "Už několik let žije v [target_county.GetNameNoTier] komunita obchodníků pocházejících z [source_county.GetNameNoTier]. Jsou to [source_county.GetProvince.GetCounty.GetFaith.GetAdherentNamePluralNoTooltip],"
 yearly_saharan.0003.desc: "a zdá se, že do zdejší společnosti zapadli docela dobře.\n\nObchod díky tomu proudí celým krajem, příjmy nikdy nebyly vyšší a dokonce i sedláci už dobře znají cinkot zlata!"
 yearly_saharan.0003.a: "To je ale příjemná vzpruha!"
 yearly_saharan.0003.b: "Zdanit je až na kost."
 yearly_saharan.0004.t: "$yearly_saharan.0001.t$: Obchodní rozmach"
 yearly_saharan.0004.desc_initial: "$yearly_saharan.0003.desc_initial$"
 yearly_saharan.0004.desc_current: "$yearly_saharan.0003.desc_current$"
 yearly_saharan.0004.desc: "a obchodní ruch, který s sebou přinesli, jako by neznal mezí!\n\nLidé se hrnou na tržiště. Vozy naložené zlatem míří na sever, povozy plné soli proudí na jih a každý cestou tam i zpět platí daně! Tohle je skutečně jeden z nejprosperujících koutů mého panství!"
 yearly_saharan.0004.a.tt: "Pokusíš se zlepšit své [Concept('stewardship','správcovství')|E]"
 yearly_saharan.0004.a: "Od těchhle obchodníků bych se mohl[Select_CString(ROOT.Char.IsFemale, 'a', '')] leccos naučit!"
 yearly_saharan.0004.a.tt.outcome_1: "Správcovství se zvýší"
 yearly_saharan.0004.a.tt.outcome_2: "$yearly_saharan.0004.a.tt.outcome_1$"
 yearly_saharan.0004.a.tt.outcome_3: "$yearly_saharan.0004.a.tt.outcome_1$"
 yearly_saharan.0004.b: "Slyším snad, jak rostou daně?"
 yearly_saharan.0004.c: "Samozřejmě ještě budeme muset vybrat dlužné daně..."
 yearly_saharan.0005.t: "$yearly_saharan.0001.t$: Změna víry"
 yearly_saharan.0005.desc_initial: "$yearly_saharan.0003.desc_initial$"
 yearly_saharan.0005.desc_current: "$yearly_saharan.0003.desc_current$"
 yearly_saharan.0005.desc: "a jejich víra pevně zakořenila v srdcích místních obyvatel. Dnes už se k [target_county.GetProvince.GetCounty.GetFaith.HighGodName] obrací mnohem více lidí než k [target_county_old_faith.HighGodName]!\n\nKe konverzi došlo pokojně a lidé působí se svým novým přesvědčením klidně a spokojeně. Staré způsoby však už téměř vymizely."
 yearly_saharan.0005.a: "Vítejte ve světle, které přináší [ROOT.GetCharacter.GetFaith.HighGodName]!"
 yearly_saharan.0005.b: "Hm. Alespoň jsou s tím spokojení."
 yearly_saharan.0005.c: "Dokud jsem [ROOT.GetCharacter.GetTitleAsNameNoTooltip], tak rozhodně ne!"
 yearly_saharan.0021.t: "Nomádi z [nomad_leader.GetCulture.GetNameNoTooltip] kultury míří do [target_county.GetNameNoTierNoTooltip]"
 yearly_saharan.0021.desc: "Ačkoli jsem [Select_CString(ROOT.Char.IsFemale, 'urozená', 'urozený')] [ROOT.GetCharacter.GetTitleAsNameNoTooltip], existují místa tak odlehlá, že ani mé jméno tam nemá valnou váhu. Místa, kterým nikdy nemohu skutečně vládnout.\n\nPrávě z takových končin hluboko v Sahaře v poslední době přicházejí [nomad_leader.GetCulture.GetCollectiveNounNoTooltip]. Jejich nomádské kmeny pronikají do [target_county.GetNameNoTier] a bez obtíží zabírají území, která místní osadníci z [target_county.GetProvince.GetCounty.GetCulture.GetNameNoTooltip] kultury nechávají volná.\n\n[Select_CString(nomad_leader.IsFemale, 'Jedna z jejich vůdkyň za mnou dokonce přišla', 'Jeden z jejich vůdců za mnou dokonce přišel')] požádat o svolení přivést sem širší svaz svých kmenů a držet toto území mým jménem."
 yearly_saharan.0021.a: "Dokonce ti dovolím, abys tomuto kraji [Select_CString(nomad_leader.IsFemale, 'vládla', 'vládl')]!"
 yearly_saharan.0021.b: "Lidé z [nomad_leader.GetCulture.GetNameNoTooltip] kultury jsou v mém panství vždy vítáni."
 yearly_saharan.0021.c: "Co kdybys místo toho [Select_CString(nomad_leader.IsFemale, 'vstoupila', 'vstoupil')] do mých služeb?"
 yearly_saharan.0021.d: "Neslýchané! Zmiz!"
 yearly_saharan.0031.t: "[affected_sub_realm.GetNameNoTierNoTooltip] čelí sílícím otrokářským nájezdům"
 yearly_saharan.0031.desc: "Otrokářské nájezdy a obchod s lidmi, který je provází, jsou pro obyvatele Sahelu a jeho okolí často krutou součástí života. Zisky z takových výprav bývají příliš lákavé, než aby se jich lidé vzdali, a mnohé osady proto čas od času přepadávají jedna druhou.\n\nV poslední době se však [slave_raider_county.GetNameNoTier] stalo základnou otrokářů, kteří se s nebývalou vervou zaměřují na nedaleké [raided_county.GetNameNoTier]. Několik významných obchodníků už plánuje rozsáhlý útok, zatímco [raided_character_marshal.GetCouncilTitle] [raided_character_marshal.GetFirstName] se jim chystá postavit."
 yearly_saharan.0031.a: "Jak výnosné! Pošlete vojáky, ať se k nim přidají!"
 yearly_saharan.0031.a.tt_success: "[raided_county.GetNameNoTierNoTooltip] je těžce vypleněno při honu na otroky"
 yearly_saharan.0031.a.tt_fail: "[raided_character_marshal.GetTitledFirstNameNoTooltip] otrokáře odrazí"
 yearly_saharan.0031.b: "Zastavte tohle barbarství!"
 yearly_saharan.0031.c: "Tohle se mě opravdu netýká."
 yearly_saharan.0031.c.raided_hurt: "[raided_county.GetNameNoTierNoTooltip] je vypleněno"
 yearly_saharan.0031.c.raiders_hurt: "[slave_raider_county.GetNameNoTierNoTooltip] přijde o mnoho nájezdníků"
 yearly_saharan.0032.t: "Řádící otrokáři z panství [hostile_sub_realm.GetNameNoTierNoTooltip]"
 yearly_saharan.0032.desc: "Otrokářští nájezdníci ze Sahelu jsou bohužel hrozbou, které v těchto krajích čelí mnoho lidí. Vidina bohatství získaného prodejem vlastních bližních do nejvzdálenějších koutů světa je pro některé zkrátka příliš lákavá.\n\nPodobné nájezdy bývají obvykle rozptýlené a nekoordinované, otrokáři, jejichž základnou je [slave_raider_county.GetNameNoTier], však začali podnikat soustředěné útoky na [raided_county.GetNameNoTier]. Nájezdníci odvádějí v řetězech celé vesnice a v čele jejich výprav osobně stojí [slave_raider_county.GetHolder.GetTitledFirstName]!"
 yearly_saharan.0032.a: "Do zbraně proti téhle chátru!"
 yearly_saharan.0032.a.tt_success: "Porazíš a oloupíš otrokáře"
 yearly_saharan.0032.a.tt_fail: "Nájezdníky vede [slave_raider_county.GetHolder.GetFirstNameNoTooltip] a [raided_county.GetNameNoTierNoTooltip] je zpustošeno"
 yearly_saharan.0032.b: "Vlastně... neměli by z toho platit daně?"
 yearly_saharan.0032.c: "Je mi to úplně jedno."
 foreign_trader_enclaves_saharan_modifier: "Enklávy jinověrných obchodníků"
 foreign_trader_enclaves_saharan_modifier_desc: "Usadili se zde jinověrní obchodníci."
 respects_local_traditions_saharan_modifier: "Úcta k místním tradicím"
 respects_local_traditions_saharan_modifier_desc: "Tato postava je známá tím, že si tradic svých předků cení více než cizího zlata."
 foreign_traders_unable_to_root_saharan_modifier: "Potulní jinověrní obchodníci"
 foreign_traders_unable_to_root_saharan_modifier_desc: "Jinověrní obchodníci zde nesmějí vlastnit majetek ani se zdržovat příliš dlouho."
 local_recession_epicentre_saharan_modifier: "Místní recese"
 local_recession_epicentre_saharan_modifier_desc: "Vyhnání jinověrných obchodníků ochromilo místní hospodářství."
 local_recession_ripple_saharan_modifier: "Dopady místní recese"
 local_recession_ripple_saharan_modifier_desc: "Zánik nedaleké obchodní trasy poškodil hospodářství tohoto hrabství."
 integrated_foreign_trader_enclaves_saharan_modifier: "Začlenění jinověrní obchodníci"
 integrated_foreign_trader_enclaves_saharan_modifier_desc: "Jinověrní obchodníci se zde stali nedílnou součástí místní společnosti."
 overtaxed_merchant_enclaves_saharan_modifier: "Přemrštěně zdanění jinověrní obchodníci"
 overtaxed_merchant_enclaves_saharan_modifier_desc: "Jinověrní obchodníci jsou v tomto hrabství nemilosrdně zdaňováni, což pobuřuje jejich obchodní partnery."
 ecstatic_converts_saharan_modifier: "Nadšení konvertité"
 ecstatic_converts_saharan_modifier_desc: "Jásající obyvatelé tohoto hrabství se radují ze své spásy."
 persecuted_converts_saharan_modifier: "Pronásledovaní konvertité"
 persecuted_converts_saharan_modifier_desc: "Nespokojení obyvatelé tohoto hrabství spřádají plány, jak uniknout svým krutým pánům."
 enthusiastic_nomad_settlement_saharan_modifier: "Nadšené usazování nomádů"
 enthusiastic_nomad_settlement_saharan_modifier_desc: "Pouštní kmeny se do tohoto hrabství hrnou ve velkém."
 nomad_settlement_saharan_modifier: "Nomádské osídlení"
 nomad_settlement_saharan_modifier_desc: "Pouštní kmeny se hrnou do tohoto hrabství, aby se zde usadily."
 upset_local_nomads_saharan_modifier: "Vzpurní nomádi"
 upset_local_nomads_saharan_modifier_desc: "Místní pouštní kmeny přepadávají stezky a působí vážné potíže."
 lord_defeated_slavers_modifier: "Lenní pán porazil otrokáře"
 lord_defeated_slavers_modifier_desc: "Hrdinný lenní pán tohoto hrabství porazil tlupy řádících otrokářů!"
 lord_complicit_with_slavers_modifier: "Lenní pán spolčený s otrokáři"
 lord_complicit_with_slavers_modifier_desc: "Chamtivý lenní pán tohoto hrabství vydal místní obyvatele napospas řádícím otrokářům."
 utterly_unphased_modifier: "Naprostá netečnost"
 utterly_unphased_modifier_desc: "Ať poddané této postavy postihne cokoli strašného, nic ji nedokáže vyvést z míry."
