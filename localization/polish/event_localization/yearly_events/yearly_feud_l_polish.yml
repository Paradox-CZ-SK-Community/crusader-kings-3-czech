l_polish:
 bp1_yearly.6000.t: "[Select_CString(my_rival.IsFemale, 'Za hříchy matky', 'Za hříchy otce')]"
 bp1_yearly.6000.desc: "Hluk před mým [ROOT.Char.Custom('ResidenceBuilding')] náhle protne hlasitý výkřik.\n\n„Ty #EMP [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rivals_child'))|U]#!! Jsem [Select_CString(rivals_child.IsFemale, 'dcera', 'syn')]. Mým rodičem je [my_rival.GetTitledFirstName] a nadešel čas, abys za své hanebné skutky nesl odpovědnost.\nPostav se mi, jinak celý svět pozná, že se bojíš hájit vlastní čest!“\n\nKdyž se otočím, střetnu se s planoucím pohledem [rivals_child.GetFirstNameNoTooltip]. V očích je jasně patrná spalující touha bránit čest svého rodiče.\n\nMoje stráže jsou stále nablízku. Kdybych chtěl, mohl bych jim poručit, ať zakročí a pošlou [rivals_child.GetFirstNameNoTooltip] pryč v naprostém ponížení a bezmoci."
 bp1_yearly.6000.a: "Můj spor je s [Select_CString(my_rival.IsFemale, 'tvou matkou', 'tvým otcem')], ne s tebou."
 bp1_yearly.6000.b: "Přijímám výzvu!"
 bp1_yearly.6000.c: "Stráže! Vyveďte to #EMP dítě#! odsud."
 bp1_yearly.6000.a.tt: "Pokusíš se dosáhnout toho, aby [rivals_child.GetFirstNameNoTooltip] [Select_CString(rivals_child.IsFemale, 'odešla', 'odešel')]"
 bp1_yearly.6000.a.success: "[rivals_child.GetFirstName] nakonec ustoupí"
 bp1_yearly.6000.a.failure: "[rivals_child.GetFirstName] považuje tvou blahosklonnost za ponižující"
 bp1_yearly.6000.b.tt: "V #V souboji#! se ti postaví [rivals_child.GetFirstNameNoTooltip] a pozná své místo!\n#weak Tento souboj může skončit smrtí.#!\nPokud zvítězíš, získáš [prestige_i] [Concept('prestige','prestiž')|E]\n\nTvoje [Concept('prowess','udatnost')|E]: [prowess_i]#V [SCOPE.GetRootScope.GetCharacter.GetProwess]#!\n[Select_CString(rivals_child.IsFemale, 'Její udatnost', 'Jeho udatnost')]: [prowess_i]#V [rivals_child.GetProwess]#!"
 bp1_yearly.6001.victory_toast: "[rivals_child.GetFirstName] prohrává a odchází"
 bp1_yearly.6002.trigger_failure: "[rivals_child.GetFirstNameNoTooltip] se se mnou nakonec neutká"
 defused_feud_escalation_opinion: "Odvrácení vyhrocení rodové msty"
 bp1_yearly.6003.t: "Něco zbrklého"
 bp1_yearly.6003.desc: "„[Select_CString(rivals_child.IsFemale, 'Udělala jsem', 'Udělal jsem')] jen to, co bylo třeba, abych hájil[Select_CString(rivals_child.IsFemale, 'a tvou čest', ' tvou čest')]!“\n\n[rivals_child.GetFirstNameNoTooltip] při vyprávění o tom, co se stalo, podivně střídá stud a pýchu. Zdá se, že touha bránit čest rodiny přerostla v přepadení. [attacked_rival.GetTitledFirstName] se stal[Select_CString(attacked_rival.IsFemale, 'a terčem', ' terčem')] útoku přímo doma.\n\nNakonec však [attacked_rival.GetFirstNameNoTooltip] [Select_CString(attacked_rival.IsFemale, 'zvítězila', 'zvítězil')] a moje dítě se teď vrátilo domů ponížené."
 bp1_yearly.6003.a: "Vedl[Select_CString(rivals_child.IsFemale, 'a', '')] sis dobře, [Select_CString(rivals_child.IsFemale, 'dcero', 'synu')]!"
 not_controlling_child_tooltip: "Ztratíš [Concept('prestige','prestiž')|E], protože nedokážeš držet své dítě na uzdě"
 bp1_yearly.6003.b: "Jak jsi to [Select_CString(rivals_child.IsFemale, 'mohla', 'mohl')] udělat? [attacked_rival.GetTitledFirstNameNoTooltip] si zaslouží odškodnění."
 child_let_down_tooltip: "[rivals_child.GetFirstNameNoTooltip] [Select_CString(rivals_child.IsFemale, 'bude zklamaná', 'bude zklamaný')] tvým nedostatkem podpory"
 bp1_yearly.6004.t: "[Select_CString(rivals_child.IsFemale, 'Zabít dceru', 'Zabít syna')]"
 bp1_yearly.6004.desc: "Když hledím na mrtvé tělo, stále víc mi dochází, že tenhle souboj bude mít následky. [my_rival.GetTitledFirstName] teď kvůli mně [Select_CString(my_rival.IsFemale, 'přišla', 'přišel')] o své dítě a brzy se celý svět dozví, co se stalo."
 bp1_yearly.6004.a: "[my_rival.GetTitledFirstNameNoTooltip] si zaslouží alespoň mou soustrast."
 bp1_yearly.6004.b: "[my_rival.GetFirstNameNoTooltip] jen sklízí, co [Select_CString(my_rival.IsFemale, 'zasela', 'zasel')]!"
 killed_my_child: "Zabití mého dítěte"
 bp1_yearly.6005.t: "Triumfální návrat?"
 bp1_yearly.6005.desc: "„[Select_CString(rivals_child.IsFemale, 'Udělala jsem', 'Udělal jsem')] to, co bylo třeba, abych hájil[Select_CString(rivals_child.IsFemale, 'a tvou čest', ' tvou čest')]!“\n\n[rivals_child.GetFirstNameNoTooltip] při vyprávění o tom, co se stalo, překypuje hrdostí, i když v ní lze postřehnout i špetku obav. Touha bránit čest rodiny přerostla v přepadení. [attacked_rival.GetTitledFirstName] se stal[Select_CString(attacked_rival.IsFemale, 'a terčem', ' terčem')] útoku přímo doma.\n\nV následném souboji jeden na jednoho nakonec [rivals_child.GetFirstNameNoTooltip] [Select_CString(rivals_child.IsFemale, 'zvítězila', 'zvítězil')]."
 bp1_yearly.6005.a: "[attacked_rival.GetFirstNameNoTooltip] [Select_CString(attacked_rival.IsFemale, 'dostala cennou lekci', 'dostal cennou lekci')]"
 rewarding_success_in_child_tooltip: "[rivals_child.GetFirstName] [Select_CString(rivals_child.IsFemale, 'bude odměněna', 'bude odměněn')]"
 bp1_yearly.6005.b: "Tohle je celé špatně! [attacked_rival.GetTitledFirstNameNoTooltip] si zaslouží odškodnění."
 bp1_yearly.6005.outcome_toast: "[rivals_child.GetFirstName] slaví vítězství a naše dobré jméno utrpělo potupu"
 bp1_yearly.6006.t: "Návrat hrdiny?"
 bp1_yearly.6006.desc: "„[Select_CString(rivals_child.IsFemale, 'Udělala jsem', 'Udělal jsem')] to, co bylo třeba, abych hájil[Select_CString(rivals_child.IsFemale, 'a tvou čest', ' tvou čest')]!“\n\n[rivals_child.GetFirstNameNoTooltip] při vyprávění o tom, co se stalo, překypuje hrdostí, i když v ní lze postřehnout i špetku obav. Touha bránit čest rodiny přerostla v přepadení. [attacked_rival.GetTitledFirstName] se stal[Select_CString(attacked_rival.IsFemale, 'a terčem', ' terčem')] útoku přímo doma.\n\nV následném souboji jeden na jednoho [rivals_child.GetFirstNameNoTooltip] [Select_CString(rivals_child.IsFemale, 'zvítězila a svého protivníka zabila', 'zvítězil a svého protivníka zabil')]."
 bp1_yearly.6006.a: "Děláš mi čest, [Select_CString(rivals_child.IsFemale, 'dcero', 'synu')]!"
 bp1_yearly.6006.outcome_toast: "[my_rival.GetFirstName] v souboji [Select_CString(my_rival.IsFemale, 'padla', 'padl')] a [rivals_child.GetFirstName] [Select_CString(rivals_child.IsFemale, 'zvítězila', 'zvítězil')]"
 murdered_my_vassal_crime: "Vražda"
 bp1_yearly.6006.b: "Jak jsi to [Select_CString(rivals_child.IsFemale, 'mohla', 'mohl')] udělat? [rivals_beneficiary.GetTitledFirstNameNoTooltip] si zaslouží odškodnění."
 bp1_yearly.6006.c: "Dar na dobročinné účely ten zlý skutek odčiní."
 bp1_yearly.6006.c.tt: "[rivals_child.GetFirstNameNoTooltip] [Select_CString(rivals_child.IsFemale, 'bude zklamaná', 'bude zklamaný')] tvým nedostatkem podpory"
 defended_family_honor_opinion: "Obrana cti rodiny"
 attacked_by_rivals_child: "Znepřátelený rod"
 bp1_yearly.6010.t: "[Select_CString(rivals_child.IsFemale, 'Ztráta dcery', 'Ztráta syna')]"
 bp1_yearly.6010.desc: "Zdá se, že [rivals_child.GetTitledFirstName], [Select_CString(rivals_child.IsFemale, 'má dcera', 'můj syn')], se nechal[Select_CString(rivals_child.IsFemale, 'a strhnout', ' strhnout')] mou nenávistí a rozhodl[Select_CString(rivals_child.IsFemale, 'a se', ' se')] vzít ukončení naší rodové msty do vlastních rukou.\n\nMladické nadšení vedlo k přepadení. [attacked_rival.GetFirstNameNoTooltip] se stal[Select_CString(attacked_rival.IsFemale, 'a terčem', ' terčem')] útoku mého dítěte a v následném boji je nemilosrdně [Select_CString(attacked_rival.IsFemale, 'zabila', 'zabil')]."
 bp1_yearly.6010.desc.apology: "\n\nSpolu s touto zprávou přichází i dopis. [attacked_rival.GetTitledFirstNameNoTooltip] v něm tvrdí, že mé dítě si za útok v cizím domě svůj osud zasloužilo, zároveň však vyjadřuje lítost nad tím, co se stalo, a nabízí mi finanční odškodnění."
 bp1_yearly.6010.a: "[attacked_rival.GetFirstNameNoTooltip] tohoto dne ještě zalituje!"
 bp1_yearly.6010.a.flavor: "Přísaháš [attacked_rival.GetFirstNameNoTooltip] další pomstu"
 bp1_yearly.6010.b: "Co jsem to provedl[Select_CString(ROOT.Char.IsFemale, 'a', '')]?!"
 bp1_yearly.6010.b.flavor: "Pokusíš se zabránit dalšímu krveprolití"
 bp1_yearly.6010.vengeance.outcome_toast: "[rivals_child.GetFirstNameNoTooltip] nezůstane [Select_CString(rivals_child.IsFemale, 'nepomstěná', 'nepomstěný')]; [my_rival.GetFirstName] [Select_CString(my_rival.IsFemale, 'přísahala', 'přísahal')] pomstu"
 bp1_yearly.6010.deescalation.outcome_toast: "[my_rival.GetFirstName] se dozvídá, že [rivals_child.GetFirstNameNoTooltip] [Select_CString(rivals_child.IsFemale, 'zemřela', 'zemřel')]"
 every_child_6010: "Všichni sourozenci, které má [rivals_child.GetFirstNameNoTooltip]"
 culture_tradition_events.2000.t: "Inspirativní vedení"
 culture_tradition_events.2000.desc: "Když zvažuji prosbu o pomoc od svého vazala [inspiring_vassal.GetTitledFirstName], náhle si uvědomím, jak dobré vztahy mě vždy pojily s [ROOT.Char.GetLiege.GetTitledFirstName].\n\nMěl bych se snažit následovat příklad svědomitého jednání [ROOT.Char.GetLiege.GetFirstNameNoTooltip] ve vztahu ke každému, vůči komu mám nějaké povinnosti. Třeba pak vzbudím stejný smysl pro povinnost i v těch, kteří jsou zavázáni mně."
 culture_tradition_events.2000.a: "Tady máš, [inspiring_vassal.GetTitledFirstNameNoTooltip]. A kdyby bylo potřeba víc, stačí říct."
 culture_tradition_events.2000.b: "Věrnost je jen jiné jméno pro slabost."
 culture_tradition_events.2001.t: "Vést příkladem?"
 culture_tradition_events.2001.desc: "Nedávný spor, do něhož se [targeted_vassal.GetTitledFirstName] dostal[Select_CString(targeted_vassal.IsFemale, 'a se svými', ' se svými')] vlastními poddanými, si vyžádal mou náhlou návštěvu v [targeted_vassal.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Zdá se, že už pouhá má přítomnost spor urovnala a místní rolníci jsou spokojení, že jsem jejich stížnosti vyslechl[Select_CString(ROOT.Char.IsFemale, 'a', '')].\n\nKdyž pozdě v noci procházím prázdnými chodbami, přemýšlím nad svým neuspokojivým vztahem s [ROOT.Char.GetLiege.GetTitledFirstName]. [ROOT.Char.GetLiege.GetTitledFirstName] vždy bez váhání požaduje mou poslušnost, ale když potřebuji pomoc já, jen málokdy přijde. Přitom tady stačila pouhá má přítomnost, aby se zdejší spor vyřešil."
 culture_tradition_events.2001.a: "Světem hýbe vzájemnost, ne povinnost."
 culture_tradition_events.2001.b: "Musím se snažit být lepší než [ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip]."
