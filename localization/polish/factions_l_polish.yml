 FACTION_DEMAND_IMPERIAL_POLICY: "Císařská politika" # todo: NEW TRANSLATION
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nLojální poddaní říše snášeli vaše mylné politiky příliš dlouho. [faction.GetName] požaduje, abyste souhlasil s novým směrem pro [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], jinak vám jej vnutíme!" # todo: NEW TRANSLATION
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED: "Požadavky ohledně císařské politiky přijaty" # todo: NEW TRANSLATION
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "Je mi jasné, že byste nechali říši shořet, než byste se vzdali tohoto pošetilého podniku. Pro dobro [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] musím vaše požadavky přijmout, ale vězte, že dnes se stala velká křivda. To nezůstane!" # todo: NEW TRANSLATION
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED: "Požadavky ohledně císařské politiky odmítnuty" # todo: NEW TRANSLATION
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED_DESC: "Vaše arogantní a rozmrzelé pohrdání rozumnými politikami mé vlády jen dokazuje, jak nevhodný jste k tomu činit taková rozhodnutí!\n\nVaše zrada a nečestnost brzy naleznou božský soud, ohavný zrádce!" # todo: NEW TRANSLATION
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION: "Změna kurzu" # todo: NEW TRANSLATION
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "Nastal čas! Všichni, kdo podporují zrušení mylných politik [faction_target.GetTitledFirstNamePossessive], nyní povstanou jako jeden a postarají se, aby bylo království nasměrováno novým směrem. Učiníme to mečem i ohněm, bude-li třeba!"
