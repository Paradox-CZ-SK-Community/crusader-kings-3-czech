 FACTION_DEMAND_CEREMONIAL_CLAIMANT: "Požadavek obřadního nárokovatele"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNikdo nemůže popřít, že [faction_targeted_title.GetNameNoTier] má jediného právoplatného panovníka: [faction_claimant.GetName], nikoli [faction_targeted_title.GetHolder.GetFirstName].\n\nPřijmi tuto skutečnost pokojně, nebo tě k tomu donutíme silou!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC_ME: "[faction_targeted_title.GetDefinitiveName|U] mi z boží vůle právem náleží a konečně mám prostředky, abych svůj nárok prosadil. Přijmi tuto skutečnost pokojně, nebo tě k tomu donutím silou!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED: "Požadavky obřadního nárokovatele přijaty"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_ACCEPTED_DESC: "Je mi jasné, že byste raději nechali panství shořet, než abyste se vzdali tohoto pošetilého podniku. Pro dobro panství musím vaše požadavky přijmout, ale vězte, že dnes došlo k velkému bezpráví. Tohle tak nezůstane!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED: "Požadavky obřadního nárokovatele odmítnuty"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED_DESC: "To, že v tomto nároku podporujete [faction_claimant.GetShortUIName|U], je urážkou důstojnosti našeho právoplatného panovníka, jehož titul zní „[faction_targeted_title.GetHolder.GetTitleAsName]“!\n\nVaši zradu a nečestnost brzy dostihne boží soud, hanebný zrádče!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION: "Právoplatný nárok!"
 FACTION_DEMAND_CEREMONIAL_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC: "Nadešel čas! Všichni, kdo podporují [faction_claimant.GetName], nyní povstanou jako jeden a prosadí tento právoplatný nárok. Jeho cílem je [faction_targeted_title.GetDefinitiveName|l]. Prosadíme jej mečem a ohněm, bude-li třeba!"
 FACTION_CEREMONIAL_CLAIMANT_INVITE: "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_DESC: "[faction_target.GetName] sedí na trůně, který právem náleží tobě! Jsem ochoten podpořit tvůj nárok slovem i mečem a nepochybuji, že se k této spravedlivé věci přidají i další v panství. Stačí jen přijmout."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPT: "Konečně!"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_REFUSE: "Není to správné..."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED: "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "Konečně! [faction_target.GetName] předvádí jen šaškovskou frašku a [faction_target.GetTitleAsNameNoTooltip] je pouhou rolí, kterou hraje. Nepochybuji, že panství povstane za mou věc. Na ty, kdo mi pomohou, nezapomenu."
 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_OPT: "Je to jen otázka času..."
 FACTION_DEMAND_IMPERIAL_POLICY: "Císařská politika"
 FACTION_DEMAND_IMPERIAL_POLICY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVěrní poddaní panství snášeli tvou pomýlenou politiku příliš dlouho. [faction.GetName] požaduje, abys přistoupil na nový směr. [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] se změní, ať už s tvým souhlasem, nebo bez něj!"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED: "Požadavky na císařskou politiku přijaty"
 FACTION_DEMAND_IMPERIAL_POLICY_ACCEPTED_DESC: "Je mi jasné, že byste raději nechali panství shořet, než abyste se vzdali tohoto pošetilého podniku. [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] však nesmí trpět, a proto musím vaše požadavky přijmout. Vězte však, že dnes došlo k velkému bezpráví. Tohle tak nezůstane!"
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED: "Požadavky na císařskou politiku odmítnuty"
 FACTION_DEMAND_IMPERIAL_POLICY_REFUSED_DESC: "Vaše arogantní a umíněné pohrdání rozumnou politikou mé vlády jen dokazuje, jak málo jste způsobilí o takových věcech rozhodovat!\n\nVaši zradu a nečestnost brzy dostihne boží soud, hanební zrádci!"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION: "Změna kurzu"
 FACTION_DEMAND_IMPERIAL_POLICY_SEND_DEMAND_NOTIFICATION_DESC: "Nadešel čas! Všichni, kdo chtějí skoncovat s pomýlenou politikou, kterou prosazuje [faction_target.GetTitledFirstName], nyní povstanou jako jeden a zajistí, aby panství změnilo směr. Prosadíme to mečem a ohněm, bude-li třeba!"
