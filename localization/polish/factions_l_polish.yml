 FACTION_SUCCESSFUL_IMPRISONMENT_RETALIATION: "[actor.GetShortUIName] nespravedlivě uvěznil [recipient.GetShortUIName], který byl jedním z členů mé frakce."
 FACTION_IMPRISONMENT_RETALIATION_END: "\n\nTakový drzý útok na [retaliating_faction.GetName] lze považovat jen za akt války, a pokud se teď neobráníme, budeme jistě rozebráni jeden po druhém!"
