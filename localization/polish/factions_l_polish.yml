 FACTION_DEMAND_CEREMONIAL_CLAIMANT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nNikdo nemůže popřít, že [faction_claimant.GetName], nikoli [faction_targeted_title.GetHolder.GetFirstName], je právoplatným vládcem [faction_targeted_title.GetNameNoTier].\n\nPřijměte tento fakt pokojně, nebo vás k tomu přinutíme silou!" # todo: NEW TRANSLATION
