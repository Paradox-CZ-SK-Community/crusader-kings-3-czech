 ep3_truce_appointed_faction_leader_coruler: "Příměří po povýšení vůdce frakce na spolucísaře"
 FACTION_DEMAND_COUNTER_OFFER_CORULE: "Protiponuka frakce"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVaše požadavky mají opodstatnění — možná dokonce odhalují chyby v mém vlastním úsudku. Složte zbraně a přidejte se ke mně jako můj spoluvládce [faction_target.GetTitleAsNameNoTooltip], a společně budeme vládnout [faction_target.GetPrimaryTitle.GetDefinitiveName]!"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_ACCEPT: "Nabídka, které nelze odmítnout..."
 FACTION_DEMAND_COUNTER_OFFER_CORULE_REJECT: "Fuj, nic než otrávený pohár!"
 faction_demand.0000.offer_accepted: "Protiponuka přijata"
 faction_demand.0000.enter_co_emperorship: "[faction_leader.GetFirstName] se stává vaším [Concept('co_emperor','spolucísařem')|E]" # todo: CONCEPT CASE
 faction_demand.0000.offer_rejected: "Protiponuka odmítnuta"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION: "Vůdce frakce povýšen"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nS potěšením oznamuji, že [faction_target.GetTitledFirstName] se přiklonil k našemu názoru. [faction_target.GetSheHe|U] jmenoval #EMP mě#! spoluvládcem [faction_target.GetTitleAsNameNoTooltip], a já jsem souhlasil, že složíme zbraně. Platí ihned."
 FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.A: "Byli jsme tak blízko..."
 FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.B: "Ten sobecký blázen!"
 peasant_faction: "Frakce rolníků"
 peasant_faction_desc: "Frakce rolníků chce osvobození lidu od cizí nebo nevěřící vlády a bude usilovat o sesazení pána, který nesdílí [Concept('culture','kultura')|E] a [Concept('faith','víra')|E] obyčejných lidí v [Concept('counties','hrabství')|E]." # todo: CONCEPT CASE
 peasant_faction_short_effect_desc: "Chce nižší [Concept('county_control','kontrola hrabství')|E]" # todo: CONCEPT CASE
 peasant_faction_every_county: "Každý [Concept('faction','frakce')|E] [Concept('county','hrabství')|E]" # todo: CONCEPT CASE
 peasant_faction_spawn_county_levies: "Vytváří [new_title.GetAdjective] [Concept('army','armáda')|E] úměrnou jeho [Concept('levies','odvedenců')|E]" # todo: CONCEPT CASE
 FACTION_DEMAND_PEASANT: "Pro [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_PEASANT_DESC: "Příliš dlouho jsme byli zatíženi vašimi utlačovatelskými zákony. Dost! Už vám nebudeme platit daně.\n\nAž vyschnou vaše pokladny a budou prázdné spíže, budete si přát, abyste se k nám dříve choval spravedlivěji."
 FACTION_DEMAND_PEASANT_ACCEPT: "Myslím, že mohu udělit daňové úlevy..."
 FACTION_DEMAND_PEASANT_REFUSE: "Nikdy! Osudem rolníka je sloužit svému pánovi!"
 FACTION_PEASANT_NAME: "Rolnická cháska"
 FACTION_PEASANT_TITLE_NAME: "Rolnické povstání"
 nomadic_faction: "Nomádská frakce"
 nomadic_faction_desc: "Nomádská [Concept('faction','frakce')|E] chce být vládnuta [GetGovernment( 'nomad_government' ).GetName] [Concept('ruler','vládce')|E], jehož [Concept('yurt','kočovné hlavní sídlo')|E] sdílí jejich [Concept('culture','kultura')|E] a [Concept('faith','víra')|E]." # todo: CONCEPT CASE
 nomadic_faction_short_effect_desc: "Chce založit nové [GetGovernment( 'nomad_government' ).GetName] [Concept('realms','panství')|E]" # todo: CONCEPT CASE
 FACTION_DEMAND_NOMADIC: "Pro [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_NOMADIC_DESC: "Už se nebudeme sklonit pod vaším jhem útlaku! My, hrdí [GetGovernment( 'nomad_government' ).GetName] [peasant_leader.GetCulture.GetCollectiveNoun], jsme se narodili, abychom volně bloudili pod těmito nekonečnými nebesy.\n\nS [peasant_leader.GetFaith.WarGodName] jako průvodcem našich jezdců se odtrhneme od vaší ubohé vlády a znovu získáme své místo na otevřené stepi!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "Dobře! Mé panství nemá místo pro vaše neumyté stáda."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "Už nebudeme snášet vaše odporné utlačování hrdých [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Narodili jsme se, abychom volně putovali pod těmito otevřenými nebesy, odmítáme vaši tyranii — náš čas nadešel!\n\nSvrhneme vaši vládu i vládu vašeho pána, [faction_target.GetTitledFirstName], jednou provždy!!"
 FACTION_DEMAND_NOMADIC_VASSAL_JOIN_WAR: "Pak se s tebou setkám na bitevním poli, #EMP tulák#!!"
 populist_faction: "Populistická frakce"
 populist_faction_desc: "Populistická [Concept('faction','frakce')|E] chce osvobození od cizí nebo nevěřící vlády a bude usilovat o nezávislost vůči pánovi, který nesdílí jejich [Concept('culture','kultura')|E] nebo [Concept('faith','víra')|E]." # todo: CONCEPT CASE
 populist_faction_short_effect_desc: "Chce nezávislost na svém [Concept('liege','lenním pánovi')|E]" # todo: CONCEPT CASE
 populist_faction_short_effect_desc_admin: "Chce, aby [Concept('state_faith','státní víra')|E] odpovídala jejich vlastní" # todo: CONCEPT CASE
 FACTION_DEMAND_POPULIST: "Pro [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "Nebudeme dál snášet útlak vaší [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] vlády. [peasant_leader.GetFaith.GetName|U] musí být uznána jako přední víra [ROOT.Char.GetPrimaryTitle.GetName]!\n\nDejte naší víře zasloužený status, nebo se připravte čelit hněvu našich mnoha věřících!"
 FACTION_DEMAND_POPULIST_DESC_CULTURE: "Už nebudeme snášet cizí utlačování tradic [peasant_leader.GetCulture.GetName]. Náš čas právě nastal!\n\nDejte nám právo vládnout sami sobě, jak uznáme za vhodné, nebo čelte společnému hněvu všech mých krajanů!"
 FACTION_DEMAND_POPULIST_DESC_FAITH: "Už nebudeme snášet vaše odporné utlačování věrných [peasant_leader.GetFaith.GetAdherentNamePlural]. Náš čas právě nastal!\n\nS [peasant_leader.GetFaith.WarGodName] jako průvodcem povstaneme a osvobodíme se od vaší [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] vlády!"
 FACTION_DEMAND_POPULIST_DESC: "Už nebudeme snášet vaše odporné utlačování dobrých [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Náš čas právě nastal!\n\nS [peasant_leader.GetFaith.WarGodName] jako průvodcem povstaneme a osvobodíme se od vaší [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] vlády!"
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT: "Počkejte... co kdybych místo toho přijal vaše zvyky?"
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT_STATE_FAITH: "[peasant_leader.GetFaith.GetNameNoTooltip|U] bude takto uznána."
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENDENCE: "Dobrá, takových hádavých poddaných nepotřebuji!"
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENCE_TT: "#N Tímto přijdete o půdu!#!"
 FACTION_DEMAND_POPULIST_REFUSE: "Chcete svobodu? Dostanete ji smrtí!"
 FACTION_DEMAND_POPULIST_REFUSE_ADMIN: "Takové změny nejsou vaším právem, drzý [peasant_leader.Custom2('InsultNoun', ROOT.Char)]!"
 FACTION_DEMAND_POPULIST_REFUSE_TT: "#high [peasant_leader.GetTitledFirstName]#! a #high [faction.GetName]#! vyhlašují vám [Concept('war','válce')|E]" # todo: CONCEPT CASE
 FACTION_POPULIST_REVOLT_TITLE_NAME: "Populistické povstání"
 FACTION_NOMADIC_REVOLT_TITLE_NAME: "Nomádské povstání"
 FACTION_POPULIST_CREATED_TITLE_NAME: "[founder_culture.GetCollectiveNounNoTooltip]"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_SAME_CULTURE_AND_FAITH: "Můžete sdílet naše tradice a víru, ale už vás ani [faction_target.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [faction_target.GetTitledFirstName] nemůžeme dále snášet!\n\nUstupte, nebo nám pomozte získat svobodu, kterou si právem zasloužíme!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "Už nebudeme snášet cizí utlačování tradic [peasant_leader.GetCulture.GetName]. Náš čas právě nastal!\n\nBudeme požadovat nic menšího než úplnou svobodu od vašeho pána, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "Už nebudeme snášet vaše odporné utlačování věrných [peasant_leader.GetFaith.GetAdherentNamePlural]. Náš čas právě nastal!\n\nS [peasant_leader.GetFaith.WarGodName] jako průvodcem povstaneme a osvobodíme se od vlády vašeho pána, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "Už nebudeme snášet vaše odporné utlačování dobrých [peasant_leader.GetCulture.GetName] [peasant_leader.GetFaith.GetAdherentNamePlural]. Náš čas právě nastal!\n\nOsvobodíme se od vaší vlády a tyranie vašeho pána, [faction_target.GetTitledFirstName]!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_REBELS: "Nechte mě přidat se k vaší věci!"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS: "Počkejte! Co kdybych přijal vaše zvyky a #EMP pomohl#! vám?"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS_TT: "Pomůžete rebelům proti svému [Concept('liege','lennímu pánovi')|E]" # todo: CONCEPT CASE
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR: "Potom se s tebou setkám na bitevním poli, #EMP zrádce#!!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT: "Nemůžete se připojit k válce, protože jste již v konfliktu s jiným účastníkem"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT_2: "Nemůžete se připojit k válce, protože by vás to postavilo do války s vaším spojencem v jiné válce"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_TT: "Pomůžete svému [Concept('liege','lennímu pánovi')|E] proti rebelům" # todo: CONCEPT CASE
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE: "Raději se nechci zapojit..."
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_A: "Nepřipojujete se k #high [populist_war.GetName]#!"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N Přijdete o část svého panství, pokud váš pán podlehne jejich požadavkům!#!"
 POPULIST_FACTION_INDEPENDENCE_TITLE: "Získána nezávislost"
 POPULIST_FACTION_INDEPENDENCE_DESC: "Získali jste nezávislost od [faction_target.GetTitledFirstName] v důsledku [popular_faction|E]"
 VASSAL_JOINS_LIEGE_TOOLTIP: "#high [vassal_to_join_liege.GetTitledFirstName]#! se připojuje do války na vaší straně jako Obránce"
 VASSAL_JOINS_REBELS_TOOLTIP: "#high [vassal_to_join_rebels.GetTitledFirstName]#! se připojuje do války na straně rebelů jako Útočník"
 populist_faction_same_culture_faith_as_liege: "Nemůže mít stejnou [Concept('culture','kulturu')|E] a [Concept('faith','víra')|E] jako váš [Concept('liege','lenní pán')|E]" # todo: CONCEPT CASE
 liberty_faction: "Frakce svobody"
 liberty_faction_desc: "Frakce svobody usiluje o snížení [Concept('crown_authority','korunní autoritu')|E], [Concept('tribal_authority','kmenovou autoritu')|E] nebo [Concept('imperial_bureaucracy','imperiální byrokracie')|E], ale členové jsou jinak loajální vůči [Concept('realm','panství')|E]." # todo: CONCEPT CASE
 liberty_faction_desc_admin: "Frakce svobody usiluje o snížení [Concept('imperial_bureaucracy','imperiální byrokracii')|E], ale členové jsou jinak loajální vůči [Concept('realm','panství')|E]." # todo: CONCEPT CASE
 liberty_faction_desc_tribal: "Frakce svobody usiluje o snížení [Concept('tribal_authority','kmenovou autoritu')|E], ale členové jsou jinak loajální vůči [Concept('realm','panství')|E]." # todo: CONCEPT CASE
 liberty_faction_desc_feudal: "Frakce svobody usiluje o snížení [Concept('crown_authority','korunní autoritu')|E], ale členové jsou jinak loajální vůči [Concept('realm','panství')|E]." # todo: CONCEPT CASE
