 liberty_faction_short_effect_desc_admin: "Chce snížit [Concept('imperial_bureaucracy','imperiální byrokracii')|E]"
 liberty_faction_short_effect_desc_tribal: "Chce snížit [Concept('tribal_authority','kmenovou autoritu')|E]"
