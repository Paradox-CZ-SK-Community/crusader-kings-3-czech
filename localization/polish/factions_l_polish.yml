 independence_faction: "Frakce za nezávislost" # todo: CONCEPT CASE
 independence_faction_desc: "Členové frakce za nezávislost se snaží osamostatnit od svého [Concept('liege','lenního pána')|E].\n\n#S Ultimatum#!\nVšichni členové frakce se stanou [Concept('independent','nezávislým')|E]\n[Concept('liege','Lenní pán')|E] ztratí [Concept('prestige','prestiží')|E]" # todo: CONCEPT CASE
 independence_faction_short_effect_desc: "Chce nezávislost na svém [Concept('liege','lenním pánovi')|E]" # todo: CONCEPT CASE
 nation_fracturing_faction: "Frakce rozpuštění"
 nation_fracturing_faction_desc: "Členové frakce $nation_fracturing_faction$ usilují zničit říši svého [Concept('liege','lenního pána')|E].\n\n#S Ultimatum#!\nVšichni členové frakce se stanou [Concept('independent','nezávislým')|E]\n[Concept('liege','Lenní pán')|E] ztrácí svůj [Concept('primary_title','hlavní titul')|E] a další [Concept('titles','tituly')|E] stejné [Concept('title_tier','úroveň')|E]" # todo: CONCEPT CASE
 nation_fracturing_faction_short_effect_desc: "Chce zničit říši svého [Concept('liege','lenního pána')|E]" # todo: CONCEPT CASE
 liege_primary_title_dissolution: "Jste nyní nezávislí!"
 liege_primary_title_dissolution_desc: "Váš pán ztratil svůj [Concept('primary_title','hlavní titul')|E] kvůli frakci $nation_fracturing_faction$" # todo: CONCEPT CASE
 FACTION_DEMAND_COLLAPSE: "[faction_target.GetPrimaryTitle.GetNameNoTier] Požadavek na rozpuštění"
 FACTION_DEMAND_COLLAPSE_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nJe čas, abyste uznal, že nejste schopen udržet jednotu [faction_target.GetPrimaryTitle.GetNameNoTier]. Je čas ukončit vaši vládu či vládu jiných: kraj potřebuje více svobody. Přijměte naše požadavky, nebo čelte našim mečům na bojišti!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED: "Požadavky na rozpuštění přijaty"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVaše mylné požadavky nás všechny jen oslabí. Přesto, abych ušetřil říši zbytečného krveprolití, jsem nucen přijmout vaše žádosti o nezávislost."
 FACTION_DEMAND_COLLAPSE_REFUSED: "Požadavky na rozpuštění odmítnuty"
 FACTION_DEMAND_COLLAPSE_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVáš hanebný pokus o vydírání neuspěl. Ať už jste naverbovali, kolik korumpovaných duší chcete, nepodlehnu bez boje. Raději zemřu v obraně toho, co mi právem patří!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION: "Konec [faction_target.GetPrimaryTitle.GetNameNoTier]!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION_DESC: "Nastal čas! Jednotné hlasy [faction.GetName] se shodují, že [faction_target.GetName] ztratil jakékoli právo vládnout, které [Select_CString(faction_target.IsFemale,'mohla','mohl')] mít [faction_target.GetSheHe]. Buď nám bude udělena nezávislost, nebo si ji vezmeme silou!"
 faction_demand.1002.tt: "[faction_target.GetPrimaryTitle.GetNameNoTier] je zničen."
 FACTION_DEMAND_INDEPENDENCE: "Požadavek na nezávislost"
 FACTION_DEMAND_INDEPENDENCE_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nJe čas, abyste uznal plnou nezávislost [faction_leader.GetPrimaryTitle.GetNameNoTier] a ostatních států ve [faction.GetName]. Přijměte naše požadavky, nebo čelte našim mečům na bojišti!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED: "Požadavky na nezávislost přijaty"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVaše mylné požadavky nás jen oslabí. Přesto, abych ušetřil říši zbytečného krveprolití, jsem nucen přijmout vaši žádost o nezávislost."
 FACTION_DEMAND_INDEPENDENCE_REFUSED: "Požadavky na nezávislost odmítnuty"
 FACTION_DEMAND_INDEPENDENCE_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVáš hanebný pokus o vydírání neuspěl. Ať už jste naverbovali, kolik korumpovaných duší chcete, nepodlehnu bez boje. Raději zemřu v obraně toho, co mi právem patří!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION: "Nezávislost!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION_DESC: "Nastal čas! Jednotné hlasy [faction.GetName] se shodují, že [faction_target.GetName] ztratil jakékoli právo vládnout, které [Select_CString(faction_target.IsFemale,'mohla','mohl')] mít [faction_target.GetSheHe]. Buď nám bude udělena nezávislost, nebo si ji vezmeme silou!"
 faction_demand.0002.tt: "Všichni členové frakce získají nezávislost!"
 FACTION_DEMAND_BRIBE_CO_EMPEROR: "Určitě dar úřadu může přimět je ke spolupráci?"
 FACTION_DEMAND_BRIBE_CO_EMPEROR_REASON: "[faction_leader.GetShortUIName|U] musí být [Concept('faction','frakce')|E] [Concept('claimant','pretendent')|E] #weak ([faction.GetSpecialCharacter.GetTitledFirstName])#!" # todo: CONCEPT CASE
 faction_demand.0000.faction_leader_accepts: "Pokud jejich vůdce přijme vaši nabídku"
 faction_demand.0000.faction_leader_rejects: "Pokud jejich vůdce vaši nabídku odmítne"
 faction_demand.0000.enter_co_rule_avoiding_worst_effects: "[faction_target.GetShortUIName|U] appoint[_s(faction_target)] [faction_leader.GetShortUIName] jako [CharYourHerHis(faction_target)] [Concept('co_emperor','spolucísař')|E], čímž se vyhne nejhorším následkům [faction.GetName]" # todo: CONCEPT CASE
