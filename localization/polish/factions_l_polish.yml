 FACTION_DISCONTENT_CA_2: "Vysoká korunní autorita: #V $VALUE|0$%#!"
 FACTION_DISCONTENT_CA_3: "Absolutní korunní autorita: #V $VALUE|0$%#!"
 FACTION_DEMAND_LIBERTY: "Požadavek na svobodu"
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nJe načase, abys uznal prastará a nezcizitelná práva svých vazalů! [faction.GetName] předkládá své požadavky. Přijmi je, nebo se s námi střetni na bojišti!"
 FACTION_DEMAND_LIBERTY_ACCEPTED: "Požadavky na svobodu přijaty"
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVaše sobecké představy o „svobodě“ oslabí celé panství. Přesto přijmu vaše požadavky, abych zabránil zbytečnému krveprolití."
 faction_demand.0102.tt: "[Concept('crown_authority','Korunní autorita')|E] tvého lenního pána se sníží!"
 FACTION_DEMAND_LIBERTY_REFUSED: "Požadavky na svobodu odmítnuty"
 FACTION_DEMAND_LIBERTY_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVáš směšný pokus o zastrašování nikdy neuspěje. Já jsem [faction_target.GetTitleAsNameNoTooltip]! Vy bídná chásko zrádců, na bojišti poznáte své místo!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION: "Svoboda, nebo smrt!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION_DESC: "Nadešel čas! [faction.GetName] mluví jedním hlasem. [faction_target.GetName] je despota a musí se vzdát tyranské moci nad námi... i kdybychom si to měli vynutit mečem."
 claimant_faction: "Frakce pretendenta"
 claimant_faction_desc: "Členové [Concept('faction','frakce pretendenta')|E] podporují pretendenta, který usiluje o titul náležející jejich [Concept('liege','lennímu pánovi')|E]."
 claimant_faction_short_effect_desc: "Usiluje o [ROOT.Faction.GetSpecialTitle.GetDefinitiveName|l]"
 FACTION_DEMAND_CLAIMANT: "Požadavek pretendenta"
 FACTION_DEMAND_CLAIMANT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\n[faction_targeted_title.GetNameNoTier] má z boží vůle jediného právoplatného vládce: [faction_claimant.GetName]. Shromáždili jsme dostatečnou podporu, abychom toto právo prosadili. Přijmi tuto skutečnost pokojně, nebo tě k tomu donutíme silou!"
 FACTION_DEMAND_CLAIMANT_DESC_ME: "[faction_targeted_title.GetNameNoTier] mi z boží vůle právem náleží a konečně mám prostředky, abych svůj nárok prosadil. Přijmi tuto skutečnost pokojně, nebo tě k tomu donutím silou!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED: "Požadavky pretendenta přijaty"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "Je mi jasné, že byste raději nechali panství shořet, než abyste se vzdali tohoto pošetilého podniku. [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] kvůli němu shořet nesmí, a proto musím vaše požadavky přijmout. Věz však, že dnes došlo k velkému bezpráví. Tohle tak nezůstane!"
 FACTION_DEMAND_CLAIMANT_REFUSED: "Požadavky pretendenta odmítnuty"
 FACTION_DEMAND_CLAIMANT_REFUSED_DESC: "[faction_claimant.GetShortUINamePossessive|U] nárok na můj titul není o nic skutečnější než příběhy, které vyprávíme dětem před spaním. Ať jste ke svému plánu zlákali sebevíc pomýlených hlupáků, před takovou hromadou hnoje se neskloním. Raději zemřu, než aby mé dědictví připadlo někomu tak nízkému!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION: "Právoplatný nárok!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC: "Nadešel čas! [faction_targeted_title.GetNameNoTier] má mít právoplatného vládce: [faction_claimant.GetName]. Všichni, kdo s tím souhlasí, nyní povstanou jako jeden a zajistí, aby právoplatné místo na trůně připadlo tomu, komu náleží. Prosadíme to mečem a ohněm, bude-li třeba!"
 FACTION_CLAIMANT_INVITE: "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] sedí na trůně, který právem náleží tobě! Jsem ochoten podpořit tvůj nárok slovem i mečem a nepochybuji, že se k této spravedlivé věci přidají i další v panství. Stačí jen přijmout."
 FACTION_CLAIMANT_INVITE_ACCEPT: "Konečně!"
 FACTION_CLAIMANT_INVITE_REFUSE: "Není to správné..."
 FACTION_CLAIMANT_INVITE_ACCEPTED: "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "Konečně! [faction_target.GetName] předvádí jen šaškovskou frašku a [faction_target.GetTitleAsNameNoTooltip] je pouhou rolí, kterou hraje. Nepochybuji, že panství povstane za mou věc. Na ty, kdo mi pomohou, nezapomenu."
 FACTION_CLAIMANT_INVITE_ACCEPTED_OPT: "Je to jen otázka času..."
 FACTION_CLAIMANT_INVITE_REFUSED: "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_REFUSED_ALLY_DESC: "Můj nárok je spravedlivý, to vím. Poutá nás však aliance a [faction_target.GetTitledFirstName] je její druhou stranou. Proto nemohu jít do války. V duchu budu stát při vás."
 FACTION_CLAIMANT_INVITE_REFUSED_HOOK_DESC: "Můj nárok je sice spravedlivý, ale já... prostě se k vám nemohu přidat. [faction_target.GetTitledFirstName] má tohle... #emphasis „neodolatelné kouzlo“#!, kvůli kterému proti [Select_CString(faction_target.IsFemale, 'ní', 'němu')] nikdy nedokážu pozvednout ruku. Ano, přesně tak. Přeji vám štěstí."
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "Těší mě, že panství povstává. [faction_target.GetTitledFirstName] nemá na trůn právo, ale má současná situace mi brání připojit se k vašemu spravedlivému úsilí. Pokud uspějete, budu vaším dlužníkem."
 FACTION_CLAIMANT_INVITE_REFUSED_CHILD_DESC: "Jsem rád, že si také myslíte, že [faction_target.GetTitledFirstName] se chová vážně ošklivě a moje vláda by byla mnohem lepší!\n\nTeď mám ale plné ruce práce s novými hračkami\... když vyhrajete, slibuji, že se o ně s vámi podělím!"
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "Konečně! [faction_target.GetName] předvádí jen šaškovskou frašku a [faction_target.GetTitleAsNameNoTooltip] je pouhou rolí, kterou hraje. Nepochybuji, že panství povstane za mou věc.\n\nKvůli svému současnému nízkému postavení ti nemohu pomoci. Ale věz: #emphasis až#! zvítězíš, postarám se, aby se ti dostalo štědré odměny!"
 FACTION_CLAIMANT_INVITE_REFUSED_DESC: "Cením si tvého nadšení pro můj nárok, ale nemohu se zbavit pocitu, že je tento podnik odsouzen k nezdaru. Proto tě nepodpořím. Pokud se ti však přesto nějak podaří uspět, přijmu své místo na trůně."
 FACTION_CLAIMANT_INVITE_REFUSED_OPT: "Škoda."
