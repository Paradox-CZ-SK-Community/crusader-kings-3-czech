 FACTION_DEMAND_CEREMONIAL_CLAIMANT_REFUSED_DESC: "Vaše podpora nároku [faction_claimant.GetShortUINamePossessive|U] na [faction_targeted_title.GetDefinitiveName|l] je urážkou důstojnosti našeho právoplatného [faction_targeted_title.GetHolder.GetTitleAsName]!\n\nVaše zrada a nečestnost brzy naleznou božský soud, zpropadený zrádce!" # todo: NEW TRANSLATION
