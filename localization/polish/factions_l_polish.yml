 FACTION_DEMAND_LIBERTY: "Požadavek na svobodu"
 FACTION_DEMAND_LIBERTY_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nJe čas, abyste uznal pradávná a nezcizitelná práva svých vazalů! Přijměte požadavky [faction.GetName] nebo čelte našim mečům na bojišti!"
 FACTION_DEMAND_LIBERTY_ACCEPTED: "Požadavky na svobodu přijaty"
 FACTION_DEMAND_LIBERTY_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVaše sobecké pojetí 'svobody' oslabí celé království. Abych však předešel zbytečnému krveprolití, přijmu vaše požadavky."
 faction_demand.0102.tt: "Autorita vašeho pána [Concept('crown_authority','korunní autoritu')|E] byla snížena!" # todo: CONCEPT CASE
 FACTION_DEMAND_LIBERTY_REFUSED: "Požadavky na svobodu odmítnuty"
 FACTION_DEMAND_LIBERTY_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVáš směšný pokus o zastrašení nikdy neuspěje. Jsem [faction_target.GetTitleAsNameNoTooltip]! Vy bídná banda zrádců se naučíte své místo na bitevním poli!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION: "Svoboda nebo smrt!"
 FACTION_DEMAND_LIBERTY_SEND_DEMAND_NOTIFICATION_DESC: "Nastal čas! Páni z [faction.GetName] se shodují, že [faction_target.GetName] je despot, který musí vzdát [Select_CString(faction_target.IsFemale,'její','jeho')] tyranskou moc nad námi... případně i pod pohrůžkou meče."
 claimant_faction: "Frakce nárokovačů"
 claimant_faction_desc: "Členové frakce nárokovačů podporují uchazeče o titul, který patří jejich [Concept('liege','lenní pán')|E]." # todo: CONCEPT CASE
 claimant_faction_short_effect_desc: "Požaduje [ROOT.Faction.GetSpecialTitle.GetDefinitiveName|l]"
 FACTION_DEMAND_CLAIMANT: "Požadavek uchazeče"
 FACTION_DEMAND_CLAIMANT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nPrávo vládnout [faction_targeted_title.GetNameNoTier] náleží [faction_claimant.GetName] božským právem, a máme shromážděnou podporu potřebnou k jeho prosazení. Přijměte to pokojně, nebo vás k tomu donutíme silou!"
 FACTION_DEMAND_CLAIMANT_DESC_ME: "Právo vládnout [faction_targeted_title.GetNameNoTier] náleží mně božským právem a konečně mám prostředky to uskutečnit. Přijměte to pokojně, nebo vás k tomu donutím silou!"
 FACTION_DEMAND_CLAIMANT_ACCEPTED: "Požadavky uchazeče přijaty"
 FACTION_DEMAND_CLAIMANT_ACCEPTED_DESC: "Je jasné, že byste raději viděli říši v plamenech, než abyste se vzdali tohoto pošetilého podniku. Pro dobro [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] musím přijmout vaše požadavky, ale vězte, že se dnes stala veliká nespravedlnost. To nesmíme nechat tak!"
 FACTION_DEMAND_CLAIMANT_REFUSED: "Požadavky uchazeče odmítnuty"
 FACTION_DEMAND_CLAIMANT_REFUSED_DESC: "[faction_claimant.GetShortUINamePossessive|U] nárok na můj titul je stejně reálný jako příběhy, které vyprávíme dětem na dobrou noc. Ať už jste shromáždili, kolik omylných bláznů chcete, nepodlehnu takové hromadě hnusu. Raději zemřu, než abych viděl, jak moje dědictví padne k někomu tak nízkému!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION: "Právoplatný nárok!"
 FACTION_DEMAND_CLAIMANT_SEND_DEMAND_NOTIFICATION_DESC: "Nastal čas! Všichni, kdo podporují [faction_claimant.GetName] jako právoplatného vládce [faction_targeted_title.GetNameNoTier], nyní povstanou jako jeden a zajistí, aby [Select_CString(faction_claimant.IsFemale,'mohla','mohl')] zaujmout [Select_CString(faction_claimant.IsFemale,'její','jeho')] právoplatné místo na trůnu. Postaráme se o to, mečem a ohněm, pokud bude třeba!"
 FACTION_CLAIMANT_INVITE: "[faction_invite_from.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_DESC: "[faction_target.GetName] obsazuje trůn, který by právem měl být váš! Jsem ochoten podpořit váš nárok slovem i mečem a jsem si jist, že i další v říši podpoří tuto oprávněnou záležitost. Stačí, když přijmete."
 FACTION_CLAIMANT_INVITE_ACCEPT: "Konečně!"
 FACTION_CLAIMANT_INVITE_REFUSE: "To není správné..."
 FACTION_CLAIMANT_INVITE_ACCEPTED: "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_ACCEPTED_DESC: "Konečně! [faction_target.GetName] není nic jiného než šašek hrající si na [faction_target.GetTitleAsNameNoTooltip], a jsem si jist, že říše povstane za mou věc. Ti, kdo mi pomohou, nebudou zapomenuti."
 FACTION_CLAIMANT_INVITE_ACCEPTED_OPT: "Je to jen otázka času..."
 FACTION_CLAIMANT_INVITE_REFUSED: "[faction_claimant.Custom2('AppropriateGreeting', ROOT.Char)]"
 FACTION_CLAIMANT_INVITE_REFUSED_ALLY_DESC: "Můj nárok je spravedlivý, to vím. Ale má aliance s [faction_target.GetTitledFirstName] mě brání v tom, abych šel do války. Budu s vámi duchovně."
 FACTION_CLAIMANT_INVITE_REFUSED_HOOK_DESC: "I když je můj nárok spravedlivý, prostě se k vám nemohu připojit. [faction_target.GetTitledFirstName] má to... #emphasis 'nepopiratelné kouzlo'#! které mi brání zvednout ruku proti [faction_target.GetHerHim]. Ano, to je to. Přeji vám štěstí."
 FACTION_CLAIMANT_INVITE_REFUSED_PREDICAMENT_DESC: "Jsem rád, že říše povstává proti falešnému [faction_target.GetTitledFirstName], ale moje současná situace mi brání se k vám připojit v tomto spravedlivém úsilí. Pokud uspějete, budu vám zavázán."
 FACTION_CLAIMANT_INVITE_REFUSED_CHILD_DESC: "Jsem rád, že i ty si myslíš, že [faction_target.GetTitledFirstName] je fakt zlosyn a že bych byl mnohem lepším vládcem než [faction_target.GetHerHim]!\n\nPrávě si hraju s novými hračkami... ale pokud vyhraješ, slibuji, že se o ně s tebou podělím!"
 FACTION_CLAIMANT_INVITE_REFUSED_INSIGNIFICANT_DESC: "Konečně! [faction_target.GetName] není nic jiného než šašek hrající si na [faction_target.GetTitleAsNameNoTooltip], a jsem si jist, že říše povstane za mou věc.\n\nVzhledem k mé současné nízké pozici vám nemohu pomoci. Ale vězte toto – #emphasis až#! budete vítězit, zajistím, aby vám byla štědře odměněna!"
 FACTION_CLAIMANT_INVITE_REFUSED_DESC: "I když oceňuji vaše nadšení pro můj nárok, nemohu se zbavit dojmu, že je toto podnikání odsouzeno k zániku. Neposkytl jsem vám tedy svou podporu, ale pokud přesto uspějete, přijmu své místo na trůnu."
 FACTION_CLAIMANT_INVITE_REFUSED_OPT: "Škoda."
