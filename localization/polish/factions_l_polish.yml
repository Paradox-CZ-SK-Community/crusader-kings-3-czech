 faction_demand.9001.t: "[retaliating_faction.GetNameNoTooltip] se mstí"
 FACTION_FAILED_IMPRISONMENT_RETALIATION: "[actor.GetShortUIName] se neprávem [Select_CString(actor.IsFemale, 'pokusila', 'pokusil')] uvěznit [recipient.GetShortUIName]. [recipient.GetShortUIName] stejně jako já patří k této frakci."
 FACTION_SUCCESSFUL_IMPRISONMENT_RETALIATION: "[actor.GetShortUIName] neprávem [Select_CString(actor.IsFemale, 'uvěznila', 'uvěznil')] [recipient.GetShortUIName]. [recipient.GetShortUIName] stejně jako já patří k této frakci."
 FACTION_IMPRISONMENT_RETALIATION_END: "\n\n[retaliating_faction.GetName] čelí tak troufalému útoku, že jej lze chápat jedině jako vyhlášení války. Pokud se neubráníme hned teď, jednoho po druhém nás zničí!"
 FACTION_IMPRISONMENT_RETALIATION_OPT: "Do války!"
 independence_faction: "$game_concept_independence_faction$"
 independence_faction_desc: "Členové [Concept('faction','frakce za nezávislost')|E] usilují o nezávislost na svém [Concept('liege','lenním pánovi')|E].\n\n#S Ultimátum#!\nVšichni členové frakce se stanou [Concept('independent','nezávislými')|E]\n[Concept('liege','Lenní pán')|E] ztratí [prestige|E]"
 independence_faction_short_effect_desc: "Usiluje o nezávislost na svém [Concept('liege','lenním pánovi')|E]"
 nation_fracturing_faction: "Frakce za rozpad"
 nation_fracturing_faction_desc: "Členové $nation_fracturing_faction$ usilují o rozpad [realm|E] svého [Concept('liege','lenního pána')|E].\n\n#S Ultimátum#!\nVšichni členové frakce se stanou [Concept('independent','nezávislými')|E]\n[Concept('liege','Lenní pán')|E] ztratí svůj [Concept('primary_title','hlavní titul')|E] a další [Concept('titles','tituly')|E] stejné [Concept('title_tier','úrovně')|E]"
 nation_fracturing_faction_short_effect_desc: "Usiluje o rozpad [realm|E] svého [Concept('liege','lenního pána')|E]"
 liege_primary_title_dissolution: "Nyní vládneš nezávisle!"
 liege_primary_title_dissolution_desc: "Tvůj [Concept('liege','lenní pán')|E] přišel o svůj [Concept('primary_title','hlavní titul')|E] v důsledku požadavků $nation_fracturing_faction$"
 FACTION_DEMAND_COLLAPSE: "[faction_target.GetPrimaryTitle.GetNameNoTier]: Požadavek na rozpad"
 FACTION_DEMAND_COLLAPSE_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nJe načase přiznat si, že [faction_target.GetPrimaryTitle.GetNameNoTier] se pod tvou vládou nedokáže udržet pohromadě. Je načase skoncovat s tvou vládou i s vládou kohokoli dalšího; tato země potřebuje více svobody. Přijmi naše požadavky, nebo se s námi střetni na bojišti!"
 FACTION_DEMAND_COLLAPSE_ACCEPTED: "Požadavky na rozpad přijaty"
 FACTION_DEMAND_COLLAPSE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVaše pomýlené požadavky nás všechny jen oslabí. Přesto nechci [realm|E] uvrhnout do zbytečného krveprolití, a proto mi nezbývá než přijmout váš požadavek na nezávislost."
 FACTION_DEMAND_COLLAPSE_REFUSED: "Požadavky na rozpad odmítnuty"
 FACTION_DEMAND_COLLAPSE_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVáš hanebný pokus o vydírání selhal. Ať jste ke svému plánu zlákali sebevíc zkažených duší, bez boje neustoupím. Raději zemřu při obraně toho, co mi právem náleží!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION: "Ať [faction_target.GetPrimaryTitle.GetNameNoTier] skončí!"
 FACTION_DEMAND_COLLAPSE_SEND_DEMAND_NOTIFICATION_DESC: "Nadešel čas! [faction.GetName] mluví jedním hlasem. [faction_target.GetName] už nemá žádné právo vládnout. Nezávislost nám bude přiznána, nebo si ji vezmeme silou!"
 faction_demand.1002.tt: "[faction_target.GetPrimaryTitle.GetNameNoTier] zanikne."
 FACTION_DEMAND_INDEPENDENCE: "Požadavek na nezávislost"
 FACTION_DEMAND_INDEPENDENCE_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nJe načase, abys uznal plnou nezávislost [faction_leader.GetPrimaryTitle.GetNameNoTier] i ostatních států, které zastupuje [faction.GetName]. Přijmi naše požadavky, nebo se s námi střetni na bojišti!"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED: "Požadavky na nezávislost přijaty"
 FACTION_DEMAND_INDEPENDENCE_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVaše pomýlené požadavky nás všechny jen oslabí. Přesto nechci [realm|E] uvrhnout do zbytečného krveprolití, a proto mi nezbývá než přijmout váš požadavek na nezávislost."
 FACTION_DEMAND_INDEPENDENCE_REFUSED: "Požadavky na nezávislost odmítnuty"
 FACTION_DEMAND_INDEPENDENCE_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVáš hanebný pokus o vydírání selhal. Ať jste ke svému plánu zlákali sebevíc zkažených duší, bez boje neustoupím. Raději zemřu při obraně toho, co mi právem náleží!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION: "Nezávislost!"
 FACTION_DEMAND_INDEPENDENCE_SEND_DEMAND_NOTIFICATION_DESC: "Nadešel čas! [faction.GetName] mluví jedním hlasem: právo [faction_target.GetName] vládnout je minulostí. Nezávislost nám bude přiznána, nebo si ji vezmeme silou!"
 faction_demand.0002.tt: "Všichni členové frakce získají nezávislost!"
 FACTION_DEMAND_BRIBE_CO_EMPEROR: "Snad je ještě přiměje ke spolupráci nabídka úřadu?"
 FACTION_DEMAND_BRIBE_CO_EMPEROR_REASON: "[faction_leader.GetShortUIName|U] musí být [Concept('claimant','pretendentem')|E] [faction|E] #weak ([faction.GetSpecialCharacter.GetTitledFirstName])#!"
 faction_demand.0000.faction_leader_accepts: "Pokud vůdce frakce přijme tvou nabídku"
 faction_demand.0000.faction_leader_rejects: "Pokud vůdce frakce odmítne tvou nabídku"
 faction_demand.0000.enter_co_rule_avoiding_worst_effects: "[faction_target.GetShortUIName|U] appoint[_s(faction_target)] [faction_leader.GetShortUIName] as [CharYourHerHis(faction_target)] [co_emperor|E], avoiding the worst of the [faction.GetName]'s consequences"
 faction_demand.0000.truce_from_co_rule: "[faction_target.GetShortUIName|U] gain[_s(faction_target)] [EmptyScope.ScriptValue('faction_counter_offer_appointed_co_emperor_value')]leté [Concept('truce','příměří')|E] se všemi členy [Concept('faction','frakce')|E]"
 ep3_truce_appointed_faction_leader_coruler: "Příměří po povýšení vůdce frakce na spolucísaře"
 FACTION_DEMAND_COUNTER_OFFER_CORULE: "Protinabídka frakci"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nVaše požadavky mají své opodstatnění — možná dokonce odhalují chyby v mém vlastním úsudku. Slož zbraně a přidej se ke mně jako [Select_CString(faction_leader.IsFemale, 'má spolucísařovna', 'můj spolucísař')] a společně budeme vládnout [faction_target.GetPrimaryTitle.GetDefinitiveName]!"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_ACCEPT: "Nabídka, kterou nemohu odmítnout..."
 FACTION_DEMAND_COUNTER_OFFER_CORULE_REJECT: "Pche, jen otrávený kalich!"
 faction_demand.0000.offer_accepted: "Protinabídka přijata"
 faction_demand.0000.enter_co_emperorship: "[faction_leader.GetFirstName] se stane tvým [Concept('co_emperor','spolucísařem')|E]"
 faction_demand.0000.offer_rejected: "Protinabídka odmítnuta"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION: "Vůdce frakce povýšen"
 FACTION_DEMAND_COUNTER_OFFER_CORULE_MEMBER_NOTIFICATION_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nS potěšením oznamuji, že [faction_target.GetTitledFirstName] nakonec [Select_CString(faction_target.IsFemale, 'přijala', 'přijal')] náš pohled na věc. [Select_CString(faction_target.IsFemale, 'Jmenovala', 'Jmenoval')] #EMP mě#! [Select_CString(faction_leader.IsFemale, 'spolucísařovnou', 'spolucísařem')] a já jsem souhlasil, že složíme zbraně. S okamžitou platností."
 FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.A: "Byli jsme tak blízko..."
 FACTION_DEMAND_COUNTER_OFFER_MEMBER_NOTIFICATION.B: "Ten sobecký hlupák!"
 peasant_faction: "Selská frakce"
 peasant_faction_desc: "Selská [faction|E] chce osvobodit lid od cizí či bezvěrecké nadvlády a usiluje o nahrazení lenního pána, který nesdílí [culture|E] a [faith|E] prostého lidu v [counties|E]."
 peasant_faction_short_effect_desc: "Usiluje o nižší [Concept('county_control','kontrolu hrabství')|E]"
 peasant_faction_every_county: "Každé [county|E] ve [faction|E]"
 peasant_faction_spawn_county_levies: "Povolá [new_title.GetAdjective] [army|E] úměrnou počtu svých [levies|E]"
 FACTION_DEMAND_PEASANT: "[ROOT.Char.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_PEASANT_DESC: "Příliš dlouho jsme snášeli břemeno tvých utlačovatelských zákonů. Dost! Už ti nebudeme platit daně.\n\nAž tvé pokladnice vyschnou a sýpky zejí prázdnotou, budeš litovat, že ses k nám nechoval spravedlivěji."
 FACTION_DEMAND_PEASANT_ACCEPT: "Asi bych mohl přistoupit na daňovou úlevu..."
 FACTION_DEMAND_PEASANT_REFUSE: "Nikdy! Údělem sedláka je sloužit svému pánovi!"
 FACTION_PEASANT_NAME: "Selská chátra"
 FACTION_PEASANT_TITLE_NAME: "Selské povstání"
 nomadic_faction: "Kočovná frakce"
 nomadic_faction_desc: "Kočovná [Concept('faction','frakce')|E] chce, aby jí vládl [Concept('ruler','vládce')|E] s vládou typu [GetGovernment( 'nomad_government' ).GetName], jehož [Concept('yurt','kočovné hlavní sídlo')|E] má stejnou [Concept('culture','kulturu')|E] a [Concept('faith','víru')|E] jako její členové."
 nomadic_faction_short_effect_desc: "Chce založit nová [Concept('realms','panství')|E] s vládou typu [GetGovernment( 'nomad_government' ).GetName]"
 FACTION_DEMAND_NOMADIC: "[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_NOMADIC_DESC: "Už se nebudeme sklánět pod jhem tvého útlaku! My, hrdí [peasant_leader.GetCulture.GetCollectiveNoun] s vládou typu [GetGovernment( 'nomad_government' ).GetName], jsme se narodili, abychom se svobodně toulali pod tímto nekonečným nebem.\n\n[peasant_leader.GetFaith.WarGodName] vede naše jezdce, a tak se vymaníme z tvé žalostné nadvlády a znovu zaujmeme své místo na širé stepi!"
 FACTION_DEMAND_NOMADIC_ACCEPT_GRANT_INDEPENDENCE: "Dobrá! V mém panství není místo pro vaše špinavá stáda."
 FACTION_DEMAND_NOMADIC_VASSAL_DESC: "Hrdí [peasant_leader.GetFaith.GetAdherentNamePlural] z [peasant_leader.GetCulture.GetName] kultury už nebudou snášet tvůj odporný útlak. Narodili jsme se, abychom se svobodně toulali pod širým nebem, a tvou tyranii odmítáme — nadešel náš čas!\n\nZbavíme se tvé vlády i vlády tvého lenního pána. [faction_target.GetTitledFirstName] nad námi už nebude mít moc!!"
 FACTION_DEMAND_NOMADIC_VASSAL_JOIN_WAR: "Pak se s tebou střetnu na bojišti, #EMP tuláku#!!"
 populist_faction: "Populistická frakce"
 populist_faction_desc: "Populistická [Concept('faction','frakce')|E] chce osvobození od cizí či bezvěrecké nadvlády a usiluje o nezávislost na [Concept('liege','lenním pánovi')|E], který nesdílí její [Concept('culture','kulturu')|E] nebo [Concept('faith','víru')|E]."
 populist_faction_short_effect_desc: "Usiluje o nezávislost na svém [Concept('liege','lenním pánovi')|E]"
 populist_faction_short_effect_desc_admin: "Chce prosadit svou víru jako [Concept('state_faith','státní víru')|E]"
 FACTION_DEMAND_POPULIST: "[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [ROOT.Char.GetTitledFirstName]"
 FACTION_DEMAND_POPULIST_DESC_ADMIN: "Už nedovolíme, aby nás tvá [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] vláda dál utlačovala. [ROOT.Char.GetPrimaryTitle.GetName]: nejvyšší postavení zde musí získat [peasant_leader.GetFaith.GetName|U]!\n\nPřiznej naší víře postavení, které jí právem náleží, nebo se připrav čelit hněvu našich početných věřících!"
 FACTION_DEMAND_POPULIST_DESC_CULTURE: "Už nebudeme snášet cizácký útlak tradic [peasant_leader.GetCulture.GetName] kultury. Nadešel náš čas!\n\nDej nám právo vládnout si podle vlastních představ, nebo pocítíš společný hněv všech mých krajanů!"
 FACTION_DEMAND_POPULIST_DESC_FAITH: "Věrní [peasant_leader.GetFaith.GetAdherentNamePlural] už nebudou snášet tvůj odporný útlak. Nadešel náš čas!\n\n[peasant_leader.GetFaith.WarGodName] nás vede, a tak povstaneme a osvobodíme se od tvé [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] vlády!"
 FACTION_DEMAND_POPULIST_DESC: "My, řádní [peasant_leader.GetFaith.GetAdherentNamePlural] z [peasant_leader.GetCulture.GetName] kultury, už nebudeme snášet tvůj odporný útlak. Nadešel náš čas!\n\n[peasant_leader.GetFaith.WarGodName] nás vede, a tak povstaneme a osvobodíme se od tvé [ROOT.Char.Custom2('GetUnbelieverTermAdjective', peasant_leader)] vlády!"
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT: "Počkejte... co když raději přijmu vaše zvyky?"
 FACTION_DEMAND_POPULIST_ACCEPT_CONVERT_STATE_FAITH: "Této pocty se dostane [peasant_leader.GetFaith.GetNameNoTooltip|U]."
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENDENCE: "Dobrá, takové hašteřivé poddané nepotřebuji!"
 FACTION_DEMAND_POPULIST_ACCEPT_GRANT_INDEPENCE_TT: "#N Tím zůstaneš bez půdy!#!"
 FACTION_DEMAND_POPULIST_REFUSE: "Chcete svobodu? Dostanete ji po smrti!"
 FACTION_DEMAND_POPULIST_REFUSE_ADMIN: "Takové změny ti nepřísluší! A ještě se o ně pokouší někdo jako [peasant_leader.Custom2('InsultNoun', ROOT.Char)]!"
 FACTION_DEMAND_POPULIST_REFUSE_TT: "#high [peasant_leader.GetTitledFirstName]#! a #high [faction.GetName]#! ti vyhlásí [Concept('war','válku')|E]"
 FACTION_POPULIST_REVOLT_TITLE_NAME: "Populistické povstání"
 FACTION_NOMADIC_REVOLT_TITLE_NAME: "Kočovné povstání"
 FACTION_POPULIST_CREATED_TITLE_NAME: "[founder_culture.GetCollectiveNounNoTooltip]"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_SAME_CULTURE_AND_FAITH: "Možná sdílíš naše tradice i víru, ale už tě nebudeme dál trpět! A dost bylo i vlády, kterou představuje [faction_target.Custom2('InsultAdjective', SCOPE.sC('peasant_leader'))] [faction_target.GetTitledFirstName]!\n\nBuď ustup stranou, nebo nám pomoz získat svobodu, která nám právem náleží!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_CULTURE: "Už nebudeme snášet cizácký útlak tradic [peasant_leader.GetCulture.GetName] kultury. Nadešel náš čas!\n\nPožadujeme úplnou svobodu! [faction_target.GetTitledFirstName], tvůj lenní pán, už nad námi nebude mít moc!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC_FAITH: "Věrní [peasant_leader.GetFaith.GetAdherentNamePlural] už nebudou snášet tvůj odporný útlak. Nadešel náš čas!\n\n[peasant_leader.GetFaith.WarGodName] nás vede, a tak povstaneme a osvobodíme se. Tvůj lenní pán [faction_target.GetTitledFirstName] už nám nebude vládnout!"
 FACTION_DEMAND_POPULIST_VASSAL_DESC: "My, řádní [peasant_leader.GetFaith.GetAdherentNamePlural] z [peasant_leader.GetCulture.GetName] kultury, už nebudeme snášet tvůj odporný útlak. Nadešel náš čas!\n\nZbavíme se tvé vlády i tyranie. Tvůj lenní pán [faction_target.GetTitledFirstName] nad námi také ztratí moc!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_REBELS: "Přidám se k vám!"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS: "Počkejte! Co když přijmu vaše zvyky a #EMP pomůžu#! vám?"
 FACTION_DEMAND_POPULIST_VASSAL_CONVERTS_TT: "Pomůžeš rebelům proti svému [Concept('liege','lennímu pánovi')|E]"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR: "Pak se s tebou střetnu na bojišti, #EMP zrádče#!!"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT: "Nemůžeš se připojit k válce, protože už válčíš s jiným jejím účastníkem"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_BLOCK_TT_2: "Nemůžeš se připojit k válce, protože by ses tím dostal do války se spojencem z jiné války"
 FACTION_DEMAND_POPULIST_VASSAL_JOIN_WAR_TT: "Pomůžeš svému [Concept('liege','lennímu pánovi')|E] proti rebelům"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE: "Raději se do toho nebudu plést..."
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_A: "Nepřipojíš se k #high [populist_war.GetName]#!"
 FACTION_DEMAND_POPULIST_VASSAL_TAKE_NO_SIDE_TT_B: "#N Pokud tvůj lenní pán přijme jejich požadavky, přijdeš o část svého panství!#!"
 POPULIST_FACTION_INDEPENDENCE_TITLE: "Získaná nezávislost"
 POPULIST_FACTION_INDEPENDENCE_DESC: "V důsledku [Concept('popular_faction','populistické frakce')|E] jsi získal nezávislost na [faction_target.GetTitledFirstName]"
 VASSAL_JOINS_LIEGE_TOOLTIP: "#high [vassal_to_join_liege.GetTitledFirstName]#! se připojí k válce na tvé straně jako obránce"
 VASSAL_JOINS_REBELS_TOOLTIP: "#high [vassal_to_join_rebels.GetTitledFirstName]#! se připojí k válce na straně rebelů jako útočník"
 populist_faction_same_culture_faith_as_liege: "Nemůžeš mít stejnou [Concept('culture','kulturu')|E] a [Concept('faith','víru')|E] jako tvůj [liege|E]"
 liberty_faction: "Frakce za svobodu"
 liberty_faction_desc: "Frakce za svobodu usiluje o snížení [Concept('crown_authority','korunní autority')|E], [Concept('tribal_authority','kmenové autority')|E] nebo [Concept('imperial_bureaucracy','imperiální byrokracie')|E], její členové jsou však jinak věrní [Concept('realm','panství')|E]."
 liberty_faction_desc_admin: "Frakce za svobodu usiluje o snížení [Concept('imperial_bureaucracy','imperiální byrokracie')|E], její členové jsou však jinak věrní [Concept('realm','panství')|E]."
 liberty_faction_desc_tribal: "Frakce za svobodu usiluje o snížení [Concept('tribal_authority','kmenové autority')|E], její členové jsou však jinak věrní [Concept('realm','panství')|E]."
 liberty_faction_desc_feudal: "Frakce za svobodu usiluje o snížení [Concept('crown_authority','korunní autority')|E], její členové jsou však jinak věrní [Concept('realm','panství')|E]."
