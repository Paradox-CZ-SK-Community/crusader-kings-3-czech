 FACTION_CEREMONIAL_CLAIMANT_INVITE_ACCEPTED_DESC: "Konečně! [faction_target.GetName] není nic než šašek hrající si na [faction_target.GetTitleAsNameNoTooltip] a jsem si jistý, že říše povstane za mou věc. Ti, kdo mi pomohou, nebudou zapomenuti." # todo: NEW TRANSLATION
