l_polish:
 test_text_to_use_explanation: "Slovo [Concept('primary_title','hlavní titul')|El] je herní pojem."
 game_concept_vassal: "Vazal"
 game_concept_vassals: "Vazalové"
 game_concept_vassalage: "Vazalství"
 game_concept_vassal_possessive: "Vazalův"
 game_concept_vassals_possessive: "Vazalů"
 game_concept_direct_vassal: "Přímý vazal"
 game_concept_direct_vassals: "Přímí vazalové"
 game_concept_direct_vassal_desc: "Tví $game_concept_direct_vassals$ jsou [Concept('vassals','vazalové')|El], kteří slouží přímo tobě. Vazalové vazalů #emphasis nejsou#! zahrnuti."
 game_concept_vassalize: "Vazalizovat"
 game_concept_vassalization: "Vazalizace"
 game_concept_vassal_desc: "Vazal je [Concept('ruler','vládce')|El], který přísahal věrnost jinému vládci — svému [Concept('liege','lennímu pánovi')|El].\n\nVazal poskytuje svému lennímu pánovi [Concept('levies','odvedencům')|El] a [Concept('taxes','daně')|El] — své [Concept('obligations','povinnosti')|El] — výměnou za ochranu.\n\nPokud má $game_concept_vassal$ nízké [Concept('opinion','mínění')|El] o svém lenním pánovi, může se připojit k [Concept('factions','frakcím')|El] nebo [Concept('scheme','osnovat intriku')|El], aby svého lenního pána nahradil někým jiným." # todo: CONCEPT CASE
 game_concept_ruler: "Vládce"
 game_concept_rulers: "Vládci"
 game_concept_rulerpossessive: "Vládcův"
 game_concept_ruler_desc: "Vládce je [Concept('character','postava')|El], která drží alespoň jeden [Concept('title','titul')|El]." # todo: CONCEPT CASE
 game_concept_title: "Titul"
 game_concept_title_i: "@titles_icon!"
 game_concept_titles: "Tituly"
 game_concept_titlepossessive: "Titulu"
 game_concept_title_desc: "Titul je v podstatě osvědčením o vlastnictví země.\n\nNejmenší jednotkou země na mapě je [Concept('barony','baronství')|El]. Baronství jsou uspořádána do větších oblastí zvaných [Concept('counties','hrabství')|El]. Hrabství [Concept('de_jure','de iure')|El] náležejí k [Concept('duchy','vévodství')|El], vévodství ke [Concept('kingdom','království')|El] a království k [Concept('empire','říši')|El].\n\nVévodství, království a říše nemusejí mít vždy [Concept('holder','držitele')|El], ale jsou to tituly, které může [Concept('created','vytvořit')|El] vládce ovládající dostatečnou část příslušného území." # todo: CONCEPT CASE
 game_concept_holder: "Držitel"
 game_concept_holders: "Držitelé"
 game_concept_holder_possessive: "Držitelův"
 game_concept_holders_possessive: "Držitelů"
 game_concept_hold: "Držet"
 game_concept_holder_desc: "Držitel [Concept('title','Titul')|El] je postava, která daný titul vlastní. Tituly [Concept('barony','baronství')|El] a [Concept('county','hrabství')|El] budou po osídlení vždy mít $game_concept_holders$, zatímco tituly [Concept('duchy','vévodství')|El], [Concept('kingdom','království')|El] a [Concept('empire','říše')|El] ještě nemusely být vytvořeny. Další výhradou je, že $game_concept_holder$ titulu vysoké úrovně nemusí ve skutečnosti ovládat žádné území v [Concept('de_jure','de iure')|El] oblasti daného titulu.\n\nDržení titulů vyšší úrovně ti umožňuje mít [Concept('vassals','vazaly')|El] vyšší úrovně. Například vévodové mohou mít za vazaly hrabata a králové mohou mít vévody." # todo: CONCEPT CASE
 game_concept_de_jure: "De iure"
 game_concept_de_jure_desc: "Většina [Concept('titles','titulů')|El] je považována za součást titulu vyšší úrovně de iure („podle práva“).\n\nNapříklad [Concept('ruler','vládce')|El] může být [Concept('king','králem')|El] Anglie, ale jeho [Concept('realm','panství')|El] ještě nemusí obsahovat všechny země, které jsou právně považovány za součást Anglie.\n\n[Concept('holder','Držitel')|E] [Concept('duchy','Vévodství')|El], [Concept('kingdom','království')|El] nebo [Concept('empire','říše')|El] má vždy [Concept('casus_belli','casus belli')|El] k uchvácení kontroly nad jeho de iure dílčími tituly.\n\n[Concept('vassals','Vazalové')|E] se také rozhodují, kdo je jejich [Concept('rightful_liege','právoplatným lenním pánem')|El], podle toho, jakého titulu je jejich [Concept('primary_title','hlavní titul')|El] de iure součástí." # todo: CONCEPT CASE
 game_concept_de_jure_drift: "De iure posun"
 game_concept_de_jure_drift_drifted: "Posunutý"
 game_concept_de_jure_drift_drift: "Posun"
 game_concept_de_jure_drifting: "De iure posouvání"
 game_concept_de_jure_drift_desc: "Pomalý proces, při němž se může změnit [Concept('de_jure','de iure')|El] [Concept('liege','lenní pán')|El] [Concept('title','titulu')|El]. Nastává přirozeně, když je [Concept('duchy','vévodství')|El] nebo [Concept('kingdom','království')|El] zcela ovládáno [Concept('ruler','vládcem')|El], který nedrží de iure lenní titul daného území.\n\nTento proces lze urychlit přidělením tvého [Concept('chancellor','kancléře')|El] k příslušnému [Concept('councillor_task','úkolu rádce')|El] #weak ($task_integrate_title$)#!. Vévodství se mohou $game_concept_de_jure_drift$ pouze do království a království se mohou posouvat pouze do [Concept('empires','říší')|El].\n\nNechat tituly de iure posouvat do tvého [Concept('primary_title','hlavního titulu')|El] je dobrý způsob, jak se zbavit postihu za [Concept('rightful_liege','právoplatného lenního pána')|El].\n\n#weak Příklad: Vévodství $d_northumberland$ je de iure součástí $k_england$, ale území vévodství leží celé v $k_scotland$. Jelikož král $k_scotland$ zároveň nedrží $k_england$, vévodství se začne $game_concept_de_jure_drift$ směrem k tomu, aby se stalo součástí $k_scotland$.#!" # todo: CONCEPT CASE
 game_concept_de_jure_drift_desc_part_1: "Pomalý proces, při němž se může změnit [Concept('de_jure','de iure')|El] [Concept('liege','lenní pán')|El] [Concept('title','titulu')|El]. Nastává přirozeně, když je [Concept('duchy','vévodství')|El] nebo [Concept('kingdom','království')|El] zcela ovládáno [Concept('ruler','vládcem')|El], který nedrží de iure lenní titul daného území.\n\nTento proces lze urychlit přidělením tvého [Concept('chancellor','kancléře')|El] k příslušnému [Concept('councillor_task','úkolu rádce')|El] #weak ($task_integrate_title$)#!. Vévodství se mohou de iure posunem pouze do království a království se mohou posouvat pouze do [Concept('empires','říše')|El].\n\nNechat tituly de iure posouvat do tvého [Concept('primary_title','hlavního titulu')|El] je dobrý způsob, jak se zbavit postihu za [Concept('rightful_liege','právoplatného lenního pána')|El]." # todo: CONCEPT CASE
 game_concept_de_jure_drift_desc_part_2: "#weak Příklad: Vévodství $d_northumberland$ je de iure součástí $k_england$, ale území vévodství leží celé v $k_scotland$. Jelikož král $k_scotland$ zároveň nedrží $k_england$, vévodství se začne $game_concept_de_jure_drift$ směrem k tomu, aby se stalo součástí $k_scotland$.#!"
 game_concept_primary_title: "Hlavní titul"
 game_concept_primary_titles: "Hlavní tituly"
 game_concept_primary_title_desc: "Hlavní titul [Concept('rulerpossessive','vládce')|El] je jeho nejvýše postavený [Concept('title','titul')|El], s nímž se nejvíce ztotožňuje a který určuje jeho erb i název jeho [Concept('realm','panství')|El].\n\nPokud ovládáš více titulů stejné úrovně, můžeš si zvolit, který z nich má být tvým hlavním titulem." # todo: CONCEPT CASE
 game_concept_recently_acquired_holding: "Nedávno získaná država"
 game_concept_recently_acquired_holdings: "Nedávno získané državy"
 game_concept_recently_acquired_holding_desc: "[Concept('holdings','Državy')|E] získané během posledního roku, které dostaly vládce nad jeho [Concept('domain_limit','limitem domény')|El], nezpůsobují postihy jeho ostatním državám, ale také neposkytují žádné [Concept('taxes','daně')|El] ani [Concept('levies','odvedence')|El]." # todo: CONCEPT CASE
 game_concept_domain_size: "Velikost domény"
 game_concept_domain_size_desc: "Velikost domény postavy vyjadřuje, kolik [Concept('barony','baronských')|El] a [Concept('county','hraběcích')|El] [Concept('titles','titulů')|El] osobně drží." # todo: CONCEPT CASE
 game_concept_levies: "Odvedenci"
 game_concept_levy: "Odvedenec"
 game_concept_levies_desc: "Jádro většiny [Concept('armies','armád')|El] tvoří $game_concept_levies$.\n\nKaždá [Concept('holding','država')|El] poskytuje svému [Concept('holder','držiteli')|El] určitý počet $game_concept_levies$. [Concept('vassals','Vazalové')|E] zase poskytují část svých odvedenců svému [Concept('liege','lennímu pánovi')|El].\n\nOdvedenci tvoří převážně špatně vyzbrojení bojovníci #weak (selské domobrany, pobudové, místní žoldnéři, zchudlí šlechtici, drobní držitelé půdy atd.)#! a jsou považováni za vlastní typ jednotek.\n\nOdvedenec má [GetDefine('NCombat', 'LEVY_ATTACK')|0] [Concept('damage','poškození')|El] a [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] [Concept('toughness','houževnatosti')|El]. Druhým typem [Concept('soldiers','vojáky')|El] ve hře jsou [Concept('men_at_arms','ozbrojenci')|El] — drazí vycvičení profesionálové." # todo: CONCEPT CASE
 game_concept_vassal_obligations: "Vazalské povinnosti"
 game_concept_obligations: "Povinnosti"
 game_concept_obligation: "Povinnost"
 game_concept_vassal_obligations_desc: "Vazalské povinnosti určují, kolik [Concept('tax','daň')|El] a kolik [Concept('levies','odvedence')|El] poskytuje [Concept('vassal','vazal')|El] svému [Concept('liege','lennímu pánovi')|El]. [Concept('government_form','Forma vlády')|E] vazala určuje, jak se jeho povinnostmi upravují.\n\n#weak Například $game_concept_obligations$ [Concept('vassals','vazaly')|El] s vládou [GetGovernment('feudal_government').GetName] a [GetGovernment('clan_government').GetName] závisí na jejich [Concept('vassal_contract','vazalské smlouvě')|El], zatímco povinnosti vazala s vládou [GetGovernment('administrative_government').GetName] závisí na jeho [Concept('province_administration','správu provincie')|El]." # todo: CONCEPT CASE
 game_concept_contract: "Smlouva"
 game_concept_crown_authority: "Korunní autorita"
 game_concept_crown_authority_desc: "Korunní autorita představuje obecnou moc, kterou [Concept('ruler','vládce')|El] uplatňuje nad svými [Concept('vassals','vazaly')|El].\n\nExistují čtyři úrovně korunní autority: [Concept('autonomous_vassals','autonomní vazalové')|El], [Concept('limited','omezená')|El], [Concept('high','vysoká')|El] a [Concept('absolute','absolutní')|El]. Zvýšení $game_concept_crown_authority$ stojí určité množství [Concept('prestige','prestiže')|El] podle úrovně a [Concept('learning_skill','učenosti')|El] vládce.\n\n#weak Vazalové nemají rádi vyšší úrovně korunní autority a její snížení je hlavním cílem [Concept( 'liberty_faction', 'frakcí za svobodu' )|El].#!" # todo: CONCEPT CASE
 game_concept_autonomous_vassals: "Autonomní vazalové"
 game_concept_autonomous_vassals_crown_authority: "Korunní autorita autonomních vazalů"
 game_concept_autonomous_vassals_crown_authority_desc: "„$game_concept_autonomous_vassals$“ je nejnižší úroveň [Concept('crown_authority','korunní autority')|El]. Na této úrovni nemají [Concept('vassals','vazalové')|El] vůči svému [Concept('liege','lennímu pánovi')|El] žádný postih k [Concept('opinion','mínění')|El] a lenní pán nad nimi má pouze základní moc."
 game_concept_limited: "Omezená"
 game_concept_limited_crown_authority: "Omezená korunní autorita"
 game_concept_limited_crown_authority_desc: "„$game_concept_limited_crown_authority$“ je druhá nejnižší úroveň [Concept('crown_authority','korunní autority')|El]. [Concept('vassals','Vazalové')|E] mají vůči svému [Concept('liege','lennímu pánovi')|El] postih #N -10#! k [Concept('opinion','mínění')|El] a lenní pán může [Concept('revoke','odebírat')|El] [Concept('titles','tituly')|El] a [Concept('retract','odjímat')|El] vazalovy vazaly. [Concept('ruler','Vládce')|E] může přecházet mezi dostupnými [Concept('succession_laws','zákony nástupnictví')|El] typu rozdělení."
 game_concept_high: "Vysoká"
 game_concept_high_crown_authority: "Vysoká korunní autorita"
 game_concept_high_crown_authority_desc: "Vysoká korunní autorita je druhá nejvyšší úroveň. [Concept('vassals','Vazalové')|E] mají vůči svému [Concept('liege','lennímu pánovi')|El] postih #N -20#! k [Concept('opinion','mínění')|El].\n\nNa této úrovni — kromě pravomocí, které lenní pán získává při [Concept('limited_crown_authority','omezené korunní autoritě')|El] — vazalové pod stejným lenním pánem už nemohou vést války mezi sebou, vládce může přecházet mezi všemi dostupnými [Concept('succession_laws','zákony nástupnictví')|El] a [Concept('titles','tituly')|El] vazalů nemohou zdědit vládci mimo [Concept('realm','panství')|El] lenního pána.\n\nA konečně, odmítnutí [Concept('revocation','odebrání')|El] titulu nebo [Concept('retraction','odnětí')|El] vazala je považováno za [Concept('crime','zločin')|El], i když lenní pán nemá dostatečné odůvodnění." # todo: CONCEPT CASE
 game_concept_absolute: "Absolutní"
 game_concept_absolute_crown_authority: "Absolutní korunní autorita"
 game_concept_absolute_crown_authority_desc: "Absolutní korunní autorita je nejvyšší úroveň [Concept('crown_authority','korunní autority')|El]. [Concept('vassals','Vazalové')|E] mají vůči svému [Concept('liege','lennímu pánovi')|El] postih #N -30#! k [Concept('opinion','mínění')|El].\n\nNa této úrovni — kromě účinků [Concept('high','vysoké')|El] a [Concept('limited','omezené')|El] korunní autority — si vládce může za cenu [Concept('prestige','prestiž')|El] vybrat [Concept('designated_heir','určeného dědice')|El].\n\nVazalové navíc nemohou vyhlašovat války ani proti cizím vládcům." # todo: CONCEPT CASE
 game_concept_tribal_authority: "Kmenová autorita"
 game_concept_tribal_authority_desc: "Kmenová autorita představuje obecný vliv, který [Concept('tribal','kmenový')|El] [Concept('ruler','vládce')|El] uplatňuje nad svými [Concept('vassals','vazaly')|El]. Ve srovnání s [Concept('crown_authority','korunní autoritou')|El] nabízí méně pravomocí a až na pozdějších úrovních.\n\nExistují čtyři úrovně kmenové autority: [Concept('disparate_tribes','nesourodé kmeny')|El], [Concept('limited_tribal','omezená')|El], [Concept('high_tribal','vysoká')|El] a [Concept('absolute_tribal','absolutní')|El]. Zvýšení $game_concept_tribal_authority$ stojí určité množství [Concept('prestige','prestiže')|El] podle úrovně a [Concept('learning_skill','učenosti')|El] vládce, ale obecně je dražší než zvyšování korunní autority.\n\n#weak Vazalové nemají rádi vyšší úrovně kmenové autority a její snížení je hlavním cílem každé [Concept('liberty_faction','frakce za svobodu')|El].#!" # todo: CONCEPT CASE
 game_concept_disparate_tribes: "Nesourodé kmeny"
 game_concept_disparate_tribes_tribal_authority: "Kmenová autorita nesourodých kmenů"
 game_concept_disparate_tribes_tribal_authority_desc: "Nesourodé kmeny jsou nejnižší úroveň [Concept('tribal_authority','kmenové autority')|El]. Na této úrovni nemají [Concept('vassals','vazalové')|El] vůči svému [Concept('liege','lennímu pánovi')|El] žádný postih k [Concept('opinion','mínění')|El] a lenní pán nad nimi nemá žádnou moc kromě možnosti požadovat [Concept('levies','odvedence')|El] a [Concept('taxes','daně')|El]." # todo: CONCEPT CASE
 game_concept_limited_tribal: "Omezená"
 game_concept_limited_tribal_authority: "Omezená kmenová autorita"
 game_concept_limited_tribal_authority_desc: "Omezená kmenová autorita je druhá nejnižší úroveň [Concept('tribal_authority','kmenové autority')|El]. [Concept('vassals','Vazalové')|E] mají vůči svému [Concept('liege','lennímu pánovi')|El] postih #N -10#! k [Concept('opinion','mínění')|El] a lenní pán nyní může [Concept('imprison','uvěznit')|El] [Concept('characters','postavy')|El] ve svém [Concept('realm','panství')|El]." # todo: CONCEPT CASE
 game_concept_high_tribal: "Vysoká"
 game_concept_high_tribal_authority: "Vysoká kmenová autorita"
 game_concept_high_tribal_authority_desc: "Vysoká kmenová autorita je druhá nejvyšší úroveň [Concept('tribal_authority','kmenové autority')|El]. [Concept('vassals','Vazalové')|E] mají vůči svému [Concept('liege','lennímu pánovi')|El] postih #N -20#! k [Concept('opinion','mínění')|El].\n\nNa této úrovni může lenní pán kromě možnosti [Concept('imprison','uvěznit')|El] [Concept('characters','postavy')|El] také [Concept('revoke','odebírat')|El] [Concept('titles','tituly')|El] a [Concept('retract','odjímat')|El] vazalovy vazaly." # todo: CONCEPT CASE
 game_concept_absolute_tribal: "Absolutní"
 game_concept_absolute_tribal_authority: "Absolutní kmenová autorita"
 game_concept_absolute_tribal_authority_desc: "Absolutní kmenová autorita je nejvyšší úroveň [Concept('tribal_authority','kmenové autority')|El]. [Concept('vassals','Vazalové')|E] mají vůči svému [Concept('liege','lennímu pánovi')|El] postih #N -30#! k [Concept('opinion','mínění')|El].\n\nNa této úrovni se kromě účinků [Concept('limited_tribal','omezené')|El] a [Concept('high_tribal_authority','vysoké kmenové autority')|El] mohou vládci nyní usadit a stát se [Concept('feudal','feudálním')|El].\n\nNereformovaní [Concept('tribal','kmenoví')|El] vládci náboženské rodiny [GetReligionFamily('rf_pagan').GetName] tento zákon potřebují k reformě své [Concept('faith','víry')|El]." # todo: CONCEPT CASE
 game_concept_powerful_vassal: "Mocný vazal"
 game_concept_powerful_vassal_powerful: "Mocný"
 game_concept_powerful_vassals: "Mocní vazalové"
 game_concept_powerful_vassal_possessive: "Mocného vazala"
 game_concept_powerful_vassal_desc: "„$game_concept_powerful_vassals$“ je hrstka [Concept('vassals','vazalů')|El] s největším počtem [Concept('soldiers','vojáky')|El] a nejvyšším [Concept('income','příjmem')|El]. Těmto vazalům musíš věnovat zvláštní pozornost, protože očekávají místo ve tvé [Concept('council','radě')|El] a pokud je nezískají, budou o tobě mít výrazně nižší [Concept('opinion','mínění')|El].\n\nZměna [Concept('succession_law','zákona nástupnictví')|El] vyžaduje, aby všichni $game_concept_powerful_vassals$ o tobě měli buď kladné [Concept('opinion','mínění')|El], byli tebou [Concept('cowed','vyděšeni')|El], nebo byli [Concept('imprisoned','uvězněni')|El]." # todo: CONCEPT CASE
 game_concept_realm_law: "Zákon panství"
 game_concept_realm_law_desc: "Zákony, které se vztahují na panství této postavy, například úroveň [Concept('crown_authority','korunní autority')|El] nebo [Concept('tribal_authority','kmenové autority')|El]."
 game_concept_title_law: "Zákon titulu"
 game_concept_title_laws: "Zákony titulů"
 game_concept_title_law_desc: "[Concept('titles','Tituly')|E] lze udělit [Concept('title_specific_succession','zákon nástupnictví specifický pro titul')|El]. Tento zákon určí odlišná pravidla nástupnictví než ostatní tituly držené stejnou postavou." # todo: CONCEPT CASE
 game_concept_strong_vassal: "Silný vazal"
 game_concept_strong_vassals: "Silní vazalové"
 game_concept_strong_vassal_desc: "Silný vazal je [Concept('vassal','vazal')|El], který se svou mocí blíží svému [Concept('liege','lennímu pánovi')|El] nebo jej přesahuje, což způsobuje postih k [Concept('opinion','mínění')|El]. #weak Svého lenního pána považuje za slabého a nezpůsobilého vládnout panství.#!" # todo: CONCEPT CASE
 game_concept_domain_limit: "Limit domény"
 game_concept_domain_limit_desc: "Limit domény určuje, kolik [Concept('holdings','državy')|El] můžeš ve své [Concept('domain','doméně')|El] zákonně mít. Limit domény ovlivňuje mnoho věcí, například tvůj [Concept('succession_law','zákon nástupnictví')|El] a úroveň tvého [Concept('primary_title','hlavního titulu')|El].\n\nAčkoli můžeš svůj limit domény překročit, sníží to tvůj [Concept('income','příjem')|El] a [Concept('opinions','mínění')|El] [Concept('vassal','vazalů')|El]." # todo: CONCEPT CASE
 game_concept_vassal_limit: "Limit vazalů"
 game_concept_vassal_limit_desc: "Limit vazalů určuje, kolik [Concept('direct_vassals','přímé vazaly')|El] můžeš zákonně mít (s výjimkou vazalů úrovně [Concept('barony','baronství')|El]).\n\nAčkoli můžeš svůj limit vazalů překročit, sníží to [Concept('taxes','daně')|El] a [Concept('levies','odvedence')|El], které ti vazalové poskytují, a možná bude lepší některé vazaly [Concept('transferring','předat')|El], abys zůstal pod limitem." # todo: CONCEPT CASE
 game_concept_leasing: "Pronájem"
 game_concept_lease: "Pronajmout"
 game_concept_leases: "Pronájmy"
 game_concept_leased: "Pronajaté"
 game_concept_lessee: "Nájemce"
 game_concept_leasing_desc: "Menší [Concept('baronies','baronství')|El] mohou být pronajata [Concept('holy_orders','svatým řádům')|El] nebo [Concept('clergy','duchovenstvu')|El]. Pronajatá baronství poskytují [Concept('taxes','daně')|El] a [Concept('levies','odvedence')|El] [Concept('lessee','nájemci')|El] namísto [Concept('holder','držitele')|El].\n\nSvatý řád si může pronajmout [Concept('castle_holdings','hradní državy')|El], zatímco duchovenstvo si může pronajmout [Concept('temple_holdings','chrámové državy')|El].\n\nPronajaté [Concept('holdings','državy')|El] jsou stále považovány za součást [Concept('realm','panství')|El] držitele. [Concept('county_capitals','Hlavní sídla hrabství')|E] nelze pronajímat." # todo: CONCEPT CASE
 game_concept_succession: "Nástupnictví"
 game_concept_succession_desc: "Nástupnictví nastává, když [Concept('ruler','vládce')|El] zemře a jeho [Concept('gold','zlata')|El] a [Concept('titles','tituly')|El] se rozdělí mezi jeho [Concept('heirs','dědici')|El] podle [Concept('succession_laws','zákonů nástupnictví')|El].\n\nHráči budou pokračovat ve hře za svého [Concept('player_heir','hráčského dědice')|El], i když některé tituly připadnou jiným postavám.\n\nPokud hráčský dědic neexistuje, hra skončí.\n\n#weak Některé vzácné okolnosti mohou vyvolat nástupnictví ještě před smrtí vládce, například prohra v [Concept('excommunication_war','exkomunikační válce')|El]. Právně vzato se však vládci nemohou sami rozhodnout abdikovat.#!" # todo: CONCEPT CASE
 game_concept_heir: "Dědic"
 game_concept_heirs: "Dědici"
 game_concept_heir_possessive: "Dědicův"
 game_concept_heir_desc: "Dědic je postava, která má zdědit jeden nebo více [Concept('titles','titulů')|El].\n\nKaždý držený [Concept('title','titul')|El] má svého dědice, určeného [Concept('succession_laws','zákonů nástupnictví')|El] jeho současného [Concept('holder','držitele')|El]. Když současný držitel titulu zemře nebo jinak vyvolá [Concept('succession','nástupnictví')|El], současný $game_concept_heir$ daného titulu jej zdědí.\n\nPamatuj, že tituly držené stejným [Concept('ruler','vládci')|El] mohou mít různé $game_concept_heirs$. Nejvýznamnější je, že [Concept('primary_title','hlavní titul')|El] zdědí [Concept('primary_heir','hlavní dědic')|El] a hráči budou pokračovat ve hře za svého [Concept('player_heir','hráčského dědice')|El]." # todo: CONCEPT CASE
 game_concept_primary_heir: "Hlavní dědic"
 game_concept_primary_heirs: "Hlavní dědici"
 game_concept_primary_heir_possessive: "Hlavního dědice"
 game_concept_primary_heir_desc: "Hlavní dědic je postava, která při [Concept('succession','nástupnictví')|El] zdědí [Concept('primary_title','hlavním titulu')|El] [Concept('ruler','vládci')|El]. Obvykle — ale ne vždy — jde o stejnou postavu jako [Concept('player_heir','hráčský dědic')|El]." # todo: CONCEPT CASE
 game_concept_player_heir: "Hráčský dědic"
 game_concept_player_heir_desc: "Hráčský dědic je [Concept('heir','dědic')|El], za kterého bude hráč pokračovat ve hře při [Concept('succession','nástupnictví')|El].\n\nHráčský dědic je obvykle stejný jako [Concept('primary_heir','hlavní dědic')|El], ale pokud [Concept('succession_law','zákon nástupnictví')|El] tvého [Concept('primary_title','hlavního titulu')|El] určuje, že má připadnout postavě mimo tvou [Concept('dynasty','dynastie')|El], budeš místo toho pokračovat ve hře za dynastického dědice svého druhého titulu nejvyšší úrovně (nebo třetího, čtvrtého atd.).\n\nTato situace je běžná, když je tvůj $game_concept_player_heir$ přehlasován podle volitelného zákona nástupnictví. Pokud jsi [Concept('house_head','hlavou rodu')|El] [Concept('noble_family','šlechtické rodiny')|El] ve [Concept('administrative','administrativním')|El] [Concept('realm','panství')|El], můžeš přijít o své panství ve prospěch hlavních dědiců mimo svůj [Concept('house','rod')|El], ale ponechat si titul šlechtické rodiny." # todo: CONCEPT CASE
 game_concept_title_heir: "Dědic titulu"
 game_concept_title_heirs: "Dědici titulu"
 game_concept_title_heir_desc: "Dědic titulu je [Concept('heir','dědic')|El] určitého [Concept('title','titulu')|El] s vlastním [Concept('title_succession','nástupnictvím titulu')|El]. Tento titul obdrží, jakmile současný [Concept('holder','držitel')|El] zemře." # todo: CONCEPT CASE
 game_concept_realm_heir: "Dědic panství"
 game_concept_realm_heirs: "Dědici panství"
 game_concept_realm_heir_desc: "Dědic panství je jeden z [Concept('heirs','dědiců')|El] [Concept('realm','panství')|El] a po smrti [Concept('ruler','vládce')|El] tohoto panství obdrží všechny nebo některé [Concept('titles','tituly')|El], které tento vládce držel.\n\nPanství může mít jednoho nebo více dědiců panství podle svého [Concept('succession_law','zákona nástupnictví')|El]." # todo: CONCEPT CASE
 game_concept_disinherit: "Vydědit"
 game_concept_disinherited: "Vyděděný"
 game_concept_disinheriting: "Vydědění"
 game_concept_disinherits: "Vyděďuje"
 game_concept_disinherit_desc: "[Concept('dynast','Hlava dynastie')|E] může za cenu [Concept('dynasty_prestige','věhlas')|El] vydědit člena své [Concept('dynasty','dynastii')|El].\n\nTím bude člen dynastie odstraněn ze všech běžných [Concept('line_of_succession','linií následnictví')|El] všech titulů, které v současnosti drží jiní členové dynastie." # todo: CONCEPT CASE
 game_concept_council: "Rada"
 game_concept_council_i: "@council_icon!"
 game_concept_council_desc: "Rada se skládá ze šesti [Concept('councillors','rádci')|El], kteří pomáhají svému [Concept('ruler','vládci')|El] se správou [Concept('realm','panstvím')|El]. Jako vedoucí svých příslušných úřadů mohou být pověřeni různými důležitými [Concept('councillor_tasks','úkoly rádce')|El]." # todo: CONCEPT CASE
 game_concept_councillor: "Rádce"
 game_concept_councillors: "Rádci"
 game_concept_councillor_desc: "Rádci jsou hlavní pomocníci každého [Concept('ruler','vládce')|El] a tvoří [Concept('council','radu')|El]. V radě je šest pozic: [Concept('chancellor','kancléře')|El], [Concept('marshal','maršála')|El], [Concept('steward','správce')|El], [Concept('spymaster','špehmistr')|El], [Concept('court_chaplain','dvorního kaplana')|El] (nebo [Concept('realm_priest','vrchní duchovní')|El]) a nakonec tvá [Concept('spouse','choť')|El].\n\nKaždý má na starosti úřad, jemuž lze zadat různé [Concept('councillor_tasks','úkoly rádce')|El].\n\n[Concept('powerful_vassals','Mocní vazalové')|E] budou nespokojeni, pokud nebudou jmenováni do jedné z těchto pozic, což znamená, že často musíš volit mezi uklidněním mocného vazala a jmenováním někoho skutečně schopného.\n\nSlužba jako rádce tvému [Concept('liege','lennímu pánovi')|El] ti dává bonus, který roste s [Concept('rank','hodností')|El] lenního pána." # todo: CONCEPT CASE
 game_concept_councillor_task: "Úkol rádce"
 game_concept_councillor_tasks: "Úkoly rádce"
 game_concept_councillor_task_desc: "Úkoly rádce jsou důležité práce, které lze zadat tvým [Concept('councillors','rádci')|El]. Tyto úkoly mohou být buď obecné, nebo mohou konkrétně cílit na [Concept('county','hrabství')|El] či [Concept('court','dvůr')|El].\n\nPokud máš s rádcem [Concept('relation','zvláštním vztahem')|El], úkoly s dobou dokončení mohou trvat déle nebo kratší dobu.\n\n#weak Pamatuj, že rádci nejsou fyzicky přítomni, aby tyto úkoly vykonávali, ale pouze vedou příslušné úsilí.#!" # todo: CONCEPT CASE
 game_concept_councillor_task_possible_side_effects: "Možné vedlejší účinky"
 game_concept_councillor_task_possible_side_effects_desc: "[Concept('councillor_task','Úkol rádce')|E] může mít časem nečekané následky. Ty mohou být dobré i špatné, přičemž kladné účinky jsou pravděpodobnější při vyšší odpovídající [Concept('skill','dovednosti')|El] rádce a záporné účinky jsou pravděpodobnější při nižší odpovídající dovednosti."
 game_concept_chancellor: "Kancléř"
 game_concept_chancellors: "Kancléři"
 game_concept_chancellor_desc: "Kancléř je [Concept('councillor','rádce')|El] odpovědný za diplomatické úsilí uvnitř i vně [Concept('realm','panství')|El]." # todo: CONCEPT CASE
 game_concept_steward: "Správce"
 game_concept_stewards: "Správci"
 game_concept_steward_desc: "Správce je [Concept('councillor','rádce')|El] odpovědný za správu [Concept('domain','doménu')|El], například za otázky [Concept('taxation','zdanění')|El], [Concept('culture','kultury')|El] a [Concept('development','rozvoje')|El]." # todo: CONCEPT CASE
 game_concept_marshal: "Maršál"
 game_concept_marshals: "Maršálové"
 game_concept_marshal_desc: "Maršál je tvůj hlavní [Concept('commander','velitel')|El] a [Concept('councillor','rádce')|El] odpovědný za vojenské záležitosti obecně." # todo: CONCEPT CASE
 game_concept_spymaster: "Špehmistr"
 game_concept_spymaster_desc: "Špehmistr je tvůj [Concept('councillor','rádce')|El] odpovědný za záležitosti intrik a zpravodajství. Dávej si pozor na neloajálního špehmistra, protože může snadno utajit [GetScheme('murder').GetTypeName] proti tobě a tvé blízké rodině a sám se na ní podílet!" # todo: CONCEPT CASE
 game_concept_court_chaplain: "Dvorní kaplan"
 game_concept_court_chaplains: "Dvorní kaplani"
 game_concept_court_chaplain_desc: "Dvorní kaplan je [Concept('councillor','rádce')|El] odpovědný za náboženské a duchovní záležitosti ve [Concept('faiths','vírech')|El] s [Concept('doctrine','doktrínou')|El] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName].\n\nVíry s doktrínou [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName] mají namísto dvorního kaplana mnohem mocnějšího (a problematičtějšího) [Concept('realm_priest','vrchního duchovního')|El]." # todo: CONCEPT CASE
 game_concept_realm_priest: "Vrchní duchovní"
 game_concept_realm_priests: "Vrchní duchovní"
 game_concept_realm_priest_possessive: "Vrchního duchovního"
 game_concept_realm_priest_desc: "Vrchní duchovní je [Concept('councillor','rádce')|El] odpovědný za náboženské a duchovní záležitosti ve [Concept('faiths','vírech')|El] s [Concept('doctrine','doktrínou')|El] [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName].\n\nNa rozdíl od svého protějšku [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] ([Concept('court_chaplains','dvorním kaplanům')|El]) si duchovnímu panství automaticky [Concept('lease','pronajímají')|El] všechny [Concept('temple_holdings','chrámové državy')|El] v [Concept('domain','doméně')|El] [Concept('ruler','vládci')|El] a také dostávají část [Concept('taxes','daní')|El] a [Concept('levies','odvedenců')|El] od duchovního panství [Concept('vassal','vazala')|El].\n\nVrchní duchovní poskytují svému [Concept('liege','lennímu pánovi')|El] odvedence a daně, pokud o něm mají kladné [Concept('opinion','mínění')|El]. Čím vyšší je jejich [Concept('opinion','mínění')|El] o jejich [Concept('liege','lenním pánovi')|El], tím více poskytnou.\n\nVrchní duchovní s nízkým míněním o svém lenním pánovi mu neposkytnou žádné daně ani odvedence a mohou způsobit potíže." # todo: CONCEPT CASE
 game_concept_law: "Zákon"
 game_concept_laws: "Zákony"
 game_concept_law_i: "@law_icon!"
 game_concept_law_desc: "Zákony [Concept('realm_possessive','panství')|El] určují, jak je dané panství uspořádáno.\n\nNejzákladnější z nich je [Concept('crown_authority','korunní autorita')|El] panství (nebo [Concept('tribal_authority','kmenová autorita')|El] u [Concept('tribes','kmenů')|El], [Concept('imperial_bureaucracy','císařská byrokracie')|El] u [Concept('administrative','administrativního')|El] panství a [Concept('nomadic_authority','dominance')|El] u [Concept('nomads','kočovníků')|El]), protože tyto zákony určují, jak spolu [Concept('lieges','lenní páni')|El] a [Concept('vassals','vazalové')|El] běžně jednají.\n\nAčkoli mají na každodenní život [Concept('rulers','vládců')|El] v panství menší dopad, [Concept('succession_laws','zákony nástupnictví')|El] a [Concept('title_laws','zákony titulů')|El] je při [Concept('succession','nástupnictví')|El] stále velmi důležité brát v úvahu." # todo: CONCEPT CASE
 game_concept_succession_law: "Zákon nástupnictví"
 game_concept_succession_laws: "Zákony nástupnictví"
 game_concept_succession_law_desc: "Každý [Concept('ruler','vládce')|El] má hlavní zákon nástupnictví, který určuje, co se při [Concept('succession','nástupnictví')|El] stane s jeho [Concept('titles','tituly')|El].\n\nKromě toho může mít jednotlivý titul někdy vlastní [Concept('title_succession','nástupnictví titulu')|El], které má přednost před výchozím zákonem. Například Svatá říše římská může být volitelná, i když má císař jako hlavní zákon nástupnictví rozdělení.\n\nZákon nástupnictví můžeš změnit pouze při odpovídající úrovni [Concept('crown_authority','korunní autoritě')|El]." # todo: CONCEPT CASE
 game_concept_religious_head_succession_law: "Zákon nástupnictví hlavy víry"
 game_concept_religious_head_succession_law_short: "Zákon hlavy víry"
 game_concept_religious_head_succession_laws: "Zákon nástupnictví hlavy víry"
 game_concept_religious_head_succession_laws_short: "Zákony hlavy víry"
 game_concept_religious_head_succession_law_desc: "[Concept('rulers','Vládci')|E], kteří jsou zároveň [Concept('heads_of_faith','hlavami víry')|El], mají dodatečný zákon [Concept('succession','nástupnictví')|El] panství, který vyžaduje, aby jejich [Concept('heir','dědic')|El] byl stejné [Concept('faith','víry')|El] jako oni. Tento zákon nelze nikdy změnit a [Concept('titles','tituly')|El] $game_concept_head_of_faith$ nemohou mít samostatné [Concept('title_succession','nástupnictví titulu')|El]. Jediným způsobem, jak tento typ zákona panství odstranit, je, aby vnější síla zničila $game_concept_title$ [Concept('head_of_faith','hlavy víry')|El]."
 game_concept_opinion: "Mínění"
 game_concept_opinions: "Mínění"
 game_concept_opinion_i: "@opinion_icon!"
 game_concept_opinion_desc: "Každá postava má jednostranné mínění o každé jiné postavě, vyjádřené hodnotou v rozmezí od #N -100#! do #P +100#!.\n\nMínění, které o tobě má jiná postava, je zásadně důležité, protože bude řídit její chování!\n\nObzvlášť opatrný bys měl být vůči mínění svých [Concept('powerful_vassals','mocným vazalům')|El], [Concept('spymaster','špehmistra')|El] a [Concept('spouse','choti')|El]." # todo: CONCEPT CASE
 game_concept_faction: "Frakce"
 game_concept_factions: "Frakce"
 game_concept_faction_desc: "Frakce je skupina [Concept('vassals','vazalů')|El] se společnými politickými zájmy. K určitým typům frakcí, například selské frakci, se může připojit také místní obyvatelstvo [Concept('counties','hrabství')|El].\n\nFrakce se stávají nebezpečnými, jakmile jejich [Concept('faction_discontent','nespokojenost')|El] dosáhne určitého bodu, kdy předloží ultimátum.\n\nPokud [Concept('liege','lenní pán')|El] nevyhoví, frakce povstane ve vzpouře a rozpoutá [Concept('civil_war','občanskou válku')|El]. Pokud se frakce rozpustí, musí mít lenní pán alespoň [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [Concept('war_score','válečného skóre')|El], aby válku vyhrál." # todo: CONCEPT CASE
 game_concept_faction_discontent: "Nespokojenost"
 game_concept_discontent: "Nespokojenost"
 game_concept_faction_discontent_desc: "Nespokojenost měří, jak blízko je [Concept('faction','frakce')|El] k předložení ultimáta.\n\nPokud je [Concept('military_power','vojenská síla')|El] frakce na prahové hodnotě, nespokojenost bude každý měsíc narůstat. Pokud je vojenská síla pod prahovou hodnotou, nespokojenost bude klesat. Velmi mocným frakcím bude nespokojenost narůstat rychle." # todo: CONCEPT CASE
 game_concept_military_power: "Vojenská síla"
 game_concept_faction_military_power: "Vojenská síla frakce"
 game_concept_faction_military_power_desc: "Vojenská síla frakce měří celkovou vojenskou sílu [Concept('faction','frakce')|El] vzhledem k jejímu cíli.\n\nKaždý jednotlivý člen frakce přidává frakci svou plnou sílu, dokud ve frakci zůstává. Pokud je cíl frakce [Concept('liege','lenním pánem')|El] člena, síla člena se zároveň odečítá od relativní síly lenního pána." # todo: CONCEPT CASE
 game_concept_scheme: "Intrika"
 game_concept_scheming: "Osnování intrik"
 game_concept_schemes: "Intriky"
 game_concept_scheme_desc: "Intrika je dlouhodobý pokus ovlivnit svět kolem sebe. Intriky mohou cílit na [Concept('characters','postavy')|El], [Concept('titles','tituly')|El], [Concept('cultures','kultury')|El] a [Concept('faiths','víry')|El] a dělí se na čtyři typy: [Concept('personal','osobní')|El], [Concept('scheme_hostile','nepřátelské')|El], [Concept('political','politické')|El] a [Concept('contract_schemes','smluvní intriky')|El].\n\n[Concept('success_chance','Šance na úspěch')|E] tvé $game_concept_scheme$ časem roste podle toho, jak zdatný jsi v příslušné [Concept('skill','dovednostech')|El], a mohou ji ovlivnit také [Concept('agents','spolčenci')|El], s nimiž svou intriku osnováš.\n\n#WEAK [Concept('secret_schemes','Tajné intriky')|E] jsou před svým cílem skryté, ale pokud mají nízké [Concept('secrecy','utajení')|El], mohou být odhaleny. #!" # todo: CONCEPT CASE
 game_concept_scheme_countermeasure: "Zaměření protiopatření"
 game_concept_scheme_countermeasures: "Zaměření protiopatření"
 game_concept_scheme_countermeasure_countermeasure: "Protiopatření"
 game_concept_scheme_countermeasure_countermeasures: "Protiopatření"
 game_concept_scheme_countermeasure_desc: "Když máš podezření, že proti tobě cílí [Concept('scheme','intrika')|El], můžeš s tím něco udělat tím, že nasměruješ veškerou svou obranu proti jednomu typu intriky na úkor ostatních.\n\nProto může být aktivní vždy jen jedno. Posílení obrany v jedné oblasti znamená odvedení pozornosti od jiné.\n\nLze je použít ke snížení [Concept('secrecy','utajení')|E] nebo k úpravě [Concept('success_chance','šancím na úspěch')|E] různých skupin intrik. Mohou ti získat čas nebo posílit obranu, ale mají nevýhody, kvůli nimž je nechceš mít aktivní neustále." # todo: CONCEPT CASE
 game_concept_scheme_precaution: "Dodatečné opatření"
 game_concept_scheme_precautions: "Dodatečná opatření"
 game_concept_scheme_precaution_precaution: "Opatření"
 game_concept_scheme_precaution_precautions: "Opatření"
 game_concept_scheme_precaution_desc: "Ne každá [Concept('character','postava')|E] dokáže provést $game_concept_scheme$ jen pomocí [Concept('skill','dovednosti')|El] — když je [Concept('scheme_target_target','cíl intriky')|El] příliš obtížný, zaplacení $game_concept_scheme_precautions$ může pomoci vyrovnat jednu slabinu na úkor jiné.\n\n#WEAK Opatření jsou volitelná: používej je takticky.#!" # todo: CONCEPT CASE
 game_concept_personal_scheme: "Osobní intrika"
 game_concept_personal_schemes: "Osobní intriky"
 game_concept_personal: "Osobní"
 game_concept_personal_scheme_desc: "Osobní intriky jsou [Concept('schemes','intriky')|El], jejichž cílem je navodit určitý stav mezi [Concept('scheme_owner','osnovatelem intriky')|El] a [Concept('scheme_target','cílem intriky')|El].\n\nPříklady $game_concept_personal_schemes$ jsou:\n$BULLET_WITH_TAB$[GetScheme('sway').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('befriend').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]" # todo: CONCEPT CASE
 game_concept_scheme_owner: "Osnovatel intriky"
 game_concept_schemer: "Intrikán"
 game_concept_scheme_owners: "Osnovatelé intrik"
 game_concept_scheme_owner_owner: "Osnovatel"
 game_concept_scheme_owner_desc: "Osnovatel $game_concept_scheme$ je [Concept('character','postava')|El], která osnová intriku proti [Concept('scheme_target','cíli intriky')|El].\n\n#WEAK Například budoucí vrah v intrice [GetScheme('murder').GetTypeName].#!" # todo: CONCEPT CASE
 game_concept_scheme_target: "Cíl intriky"
 game_concept_scheme_targets: "Cíle intriky"
 game_concept_scheme_target_target: "Cíl"
 game_concept_scheme_target_desc: "Cíl $game_concept_scheme$ je [Concept('character','postava')|El], proti níž osnová intriku [Concept('scheme_owner','osnovatele intriky')|El].\n\n#WEAK Například možná oběť v intrice [GetScheme('murder').GetTypeName].#!" # todo: CONCEPT CASE
 game_concept_secret_scheme: "Tajná intrika"
 game_concept_secret_scheme_single: "Tajná"
 game_concept_secret_schemes: "Tajné intriky"
 game_concept_secret_scheme_desc: "Tajná intrika je [Concept('scheme','intrika')|El], která postupuje bez vědomí [Concept('scheme_target','cíle intriky')|El].\n\nMůže však být odhalena, což sníží [Concept('success_chance','šanci na úspěch')|El] a zvýší pravděpodobnost, že bude [Concept('scheme_owner','osnovatel intriky')|El] odhalen při provedení intriky.\n\n[Concept('agents','Spolčenci')|E] naverbovaní do tajné intriky mají šanci být [Concept('agent_discovery_discovered','odhaleni')|El]." # todo: CONCEPT CASE
 game_concept_agent: "Spolčenec"
 game_concept_agents: "Spolčenci"
 game_concept_agent_i: "@scheme_agent_icon!"
 game_concept_agents_desc: "Spolčenec je účastník [Concept('scheme','intriky')|El], který může poskytnout jednu ze tří výhod. Může zvýšit [Concept('success_chance','šanci na úspěch')|El], zkrátit [Concept('scheme_speed_single','délku fáze')|El] nebo zlepšit [Concept('secrecy','utajení')|El]. Jako spolčence lze naverbovat pouze [Concept('courtiers','dvořany')|El], [Concept('guests','hosty')|El] a [Concept('direct_vassals','přímé vazaly')|El] cíle.\n\nU [Concept('scheme_hostile','nepřátelských')|El] intrik je velmi důležité mít spolčence blízko cíle. Například [Concept('councillors','rádci')|El] nebo [Concept('close_family','blízká rodina')|El] cíle intriky přispívají k délce fáze a $game_concept_success_chance$ více.\n\nBýt $game_concept_agent$ v [Concept('hostile_scheme','nepřátelské intrice')|El] je [Concept('crime','zločin')|El] a $game_concept_agent$ riskuje, že bude [Concept('agent_discovery_discovered','odhalen')|El]." # todo: CONCEPT CASE
 game_concept_agent_discovery: "Odhalení spolčence"
 game_concept_agent_discovery_discovered: "Odhalený"
 game_concept_agent_discovery_desc: "Odhalení [Concept('agents','spolčenci')|El] [Concept('secret_scheme','tajné intriky')|El] mohou být svým [Concept('liege','lenním pánem')|El] považováni za [Concept('criminals','zločince')|El] a pravděpodobně budou [Concept('imprisoned','uvězněni')|El], pokud tomu tak je."
 game_concept_scheme_discovery_chance: "Šance na odhalení intriky"
 game_concept_scheme_discovery_chance_desc: "Toto číslo se přímo odečítá od hodnoty [Concept('secrecy','utajení')|El] každé [Concept('secret_scheme','tajné intriky')|El] proti tobě nebo tvým [Concept('courtiers','dvořany')|El].\n\n#WEAK Utajení se kontroluje při provedení intrice a ve snížené míře jednou měsíčně.#!" # todo: CONCEPT CASE
 game_concept_predicted_scheme_difficulty: "Předpokládaná obtížnost intriky"
 game_concept_predicted_difficulty: "Předpokládaná obtížnost"
 game_concept_predicted_scheme_difficulty_desc: "Na úspěšnou [Concept('scheme','intriku')|El] má vliv mnoho faktorů, z nichž některé nelze znát, dokud nezačne a nejsou naverbováni [Concept('agents','spolčenci')|El].\n\nAčkoli je možná jakákoli $game_concept_scheme$, mnohé mohou být nákladné.\n\nPět úrovní obtížnosti je:\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_excellent$ #WEAK — pravděpodobně snadná, rychlá a tichá#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_high$ #WEAK — vyžaduje minimální úsilí#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_medium$ #WEAK — může být potřeba několik úplatků#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_low$ #WEAK — úspěch bude drahý#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_abysmal$ #WEAK — úspěch je nepravděpodobný a nákladný#!"
 game_concept_prevented_murder: "Zabráněná vražda"
 game_concept_prevented_murder_prevent: "Zabránit"
 game_concept_prevented_murder_desc: "Vzácně mohou určité situace v životě [Concept('scheme_target_target','cíle intriky')|El] [GetScheme('murder').GetTypeName] způsobit, že [Concept('scheme','intrika')|El] selže v závěrečných fázích svého provedení.\n\nTím se přepíše [Concept('success_chance','šance na úspěch')|El].\n\n#WEAK Příklady zahrnují zásah osobního strážce, ochutnávače, štítonošečky nebo věrného mazlíčka.#!"
 game_concept_political_scheme: "Politická intrika"
 game_concept_political_schemes: "Politické intriky"
 game_concept_political: "Politická"
 game_concept_political_scheme_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'game_concept_political_scheme_desc_tgp', 'game_concept_political_scheme_desc_default' )]"
 game_concept_political_scheme_desc_default: "Politické intriky zahrnují všechny [Concept('schemes','intriky')|El] používané výhradně [Concept('administrative_governments','správními vládami')|El]. Patří mezi ně:\n$BULLET_WITH_TAB$[GetScheme('challenge_status').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('depose').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('expand_power_base').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('generate_claim').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('promote').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('slander').GetTypeName]\n" # todo: CONCEPT CASE
 game_concept_political_scheme_desc_tgp: "Politické intriky zahrnují [Concept('schemes','intriky')|El] převážně politické a byrokratické povahy, běžně používané [Concept('administrative','správními')|El] a [Concept('mandala_government','mandalovými')|El] typy vlády.\n\nSprávní politické intriky:\n$BULLET_WITH_TAB$[GetScheme('challenge_status').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('depose').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('expand_power_base').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('generate_claim').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('promote').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('slander').GetTypeName]\n\nMandalové politické intriky:\n$BULLET_WITH_TAB$[GetScheme('coerce_tributary').GetTypeName]\n" # todo: CONCEPT CASE
 game_concept_hostile_scheme: "Nepřátelská intrika"
 game_concept_scheme_hostile: "Nepřátelská"
 game_concept_hostile_schemes: "Nepřátelské intriky"
 game_concept_hostile_scheme_desc: "Nepřátelské intriky jsou [Concept('schemes','intriky')|El], jejichž cílem je uškodit [Concept('character','postavě')|El]. Většina nepřátelských intrik využívá [Concept('secrecy','utajení')|El].\n\nPříklady $game_concept_hostile_schemes$ jsou:\n$BULLET_WITH_TAB$[GetScheme('murder').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('abduct').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('claim_throne').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('fabricate_hook').GetTypeName]" # todo: CONCEPT CASE
 game_concept_scheme_phase: "Fáze intriky"
 game_concept_scheme_phases: "Fáze intriky"
 game_concept_scheme_phase_phase: "Fáze"
 game_concept_scheme_phase_phases: "Fáze"
 game_concept_scheme_phase_desc: "Fáze je doba potřebná k #EMP jednomu#! zvýšení [Concept('scheme_success_chance','šance na úspěch intriky')|El].\n\nKaždou fázi získá $game_concept_scheme$ [Concept('scheme_opportunity_opportunity','výhodu')|El]. [Concept('scheme_speed_single','Délka fáze')|E] lze zkrátit jmenováním [Concept('agents','spolčenci')|El] a prodlužuje ji [Concept('scheme_resistance','odolnost vůči intrikám')|El] cíle." # todo: CONCEPT CASE
 game_concept_secret: "Tajemství"
 game_concept_secrets: "Tajemství"
 game_concept_secret_desc: "Tajemství jsou věci, které si postavy nepřejí, aby ostatní věděli, protože jsou trapné, nemorální nebo přímo [Concept('criminal','zločinné')|El].\n\nTajemství lze odhalit pomocí [Concept('councillor_task','úkolu rádce')|El] „$task_find_secrets$“ pro [Concept('spymaster','špehmistra')|El]. Jakmile něčí $game_concept_secret$ znáš, můžeš danou postavu [Concept('blackmail','vydírat')|El] a získat [Concept('hook','páku')|El]." # todo: CONCEPT CASE
 game_concept_barony: "Baronství"
 game_concept_baronies: "Baronství"
 game_concept_barons: "Baroni"
 game_concept_baron: "Baron"
 game_concept_barony_desc: "Baronství je [Concept('title','titul')|El] nejnižší [Concept('title_tier','úrovně titulu')|El].\n\nBaronství mají na mapě nejmenší rozsah a jsou uspořádána do větších [Concept('counties','hrabství')|El].\n\nTitul $game_concept_barony$ musí mít vždy [Concept('holder','držitele')|El], pokud obsahují [Concept('holding','državu')|El]." # todo: CONCEPT CASE
 game_concept_baron_desc: "Baron je [Concept('ruler','vládce')|El], jehož [Concept('primary_title','hlavním titulem')|El] je [Concept('barony','baronství')|El].\n\nJeho [Concept('rank','hodnosti')|El] je nejnižší možná, přímo pod [Concept('counts','hrabaty')|El]. Proto nemůže mít [Concept('vassals','vazaly')|El] a jeho [Concept('liege','lenního pána')|El] může být kdokoli, kdo není $game_concept_baron$." # todo: CONCEPT CASE
 game_concept_county: "Hrabství"
 game_concept_counties: "Hrabství"
 game_concept_count: "Hrabě"
 game_concept_counts: "Hrabata"
 game_concept_county_desc: "Hrabství je [Concept('title','titul')|El] o jednu [Concept('title_tier','úroveň titulu')|El] níže než [Concept('duchy','vévodství')|El] a o jednu výše než [Concept('barony','baronství')|El].\n\nTitul zahrnuje [Concept('county_capital','hlavní sídlo hrabství')|El] v daném hrabství a také [Concept('de_jure','de iure')|El] práva ke všem [Concept('baronies','baronství')|El] v daném hrabství.\n\nHrabství mají vždy [Concept('holders','držitele')|El], protože $game_concept_county_capitals$ nelze zničit." # todo: CONCEPT CASE
 game_concept_count_desc: "Hrabě je [Concept('ruler','vládce')|El], jehož [Concept('primary_title','hlavním titulem')|El] je [Concept('county','hrabství')|El].\n\nJeho [Concept('rank','hodnosti')|El] je pouze nad [Concept('barons','barony')|El] a přímo pod [Concept('dukes','vévody')|El], a proto může mít $game_concept_barons$ jako [Concept('vassals','vazaly')|El] a $game_concept_duke$ či vyššího vládce jako svého [Concept('liege','lenního pána')|El]." # todo: CONCEPT CASE
 game_concept_duchy: "Vévodství"
 game_concept_duchies: "Vévodství"
 game_concept_duke: "Vévoda"
 game_concept_dukes: "Vévodové"
 game_concept_duchy_desc: "Vévodství je [Concept('title','titul')|El] o jednu [Concept('title_tier','úroveň titulu')|El] níže než [Concept('kingdom','království')|El] a o jednu výše než [Concept('county','hrabství')|El].\n\n[Concept('holder','Držitel')|E] Vévodství má [Concept('de_jure','de iure')|El] práva k jeho dílčím hrabství a může mít [Concept('counts','hrabata')|El] jako [Concept('vassals','vazaly')|El].\n\nVévodství mohou být neaktivní a nemusí mít současného držitele. Taková $game_concept_title_succession$ může vytvořit [Concept('ruler','vládce')|El], který ovládá alespoň polovinu jejich $game_concept_counties$." # todo: CONCEPT CASE
 game_concept_duke_desc: "Vévoda je [Concept('ruler','vládce')|El], jehož [Concept('primary_title','hlavním titulem')|El] je [Concept('duchy','vévodství')|El].\n\nJeho [Concept('rank','hodnosti')|El] je přímo nad [Concept('counts','hrabaty')|El] a přímo pod [Concept('kings','králi')|El], a proto může mít $game_concept_counts$ jako [Concept('vassals','vazaly')|El] a $game_concept_king$ či vyššího vládce jako svého [Concept('liege','lenního pána')|El]." # todo: CONCEPT CASE
 game_concept_kingdom: "Království"
 game_concept_kingdoms: "Království"
 game_concept_king: "Král"
 game_concept_kings: "Králové"
 game_concept_kingdom_desc: "Království je [Concept('title','titul')|El] o jednu [Concept('title_tier','úroveň titulu')|El] níže než [Concept('empire','říše')|El] a o jednu výše než [Concept('duchy','vévodství')|El].\n\n[Concept('holder','Držitel')|E] Království má [Concept('de_jure','de iure')|El] práva k jeho dílčímu území.\n\nKrálovství mohou být neaktivní a nemusí mít současného držitele. Takové $game_concept_titles$ může vytvořit [Concept('ruler','vládce')|El], který ovládá alespoň polovinu [Concept('counties','hrabství')|El] v jejich rámci." # todo: CONCEPT CASE
 game_concept_king_desc: "Král je [Concept('ruler','vládce')|El], jehož [Concept('primary_title','hlavním titulem')|El] je [Concept('kingdom','království')|El].\n\nJeho [Concept('rank','hodnosti')|El] je přímo nad [Concept('dukes','vévody')|El] a přímo pod [Concept('emperors','císaři')|El], a proto může mít $game_concept_dukes$ a nižší jako [Concept('vassals','vazaly')|El] a $game_concept_emperor$ či vyššího vládce jako svého [Concept('liege','lenního pána')|El]." # todo: CONCEPT CASE
 game_concept_empire: "Říše"
 game_concept_empires: "Říše"
 game_concept_emperor: "Císař"
 game_concept_emperors: "Císaři"
 game_concept_empire_desc: "Říše je [Concept('title','titul')|El] o jednu [Concept('title_tier','úroveň titulu')|El] níže než [Concept('hegemony','hegemonie')|El] a o jednu výše než [Concept('kingdom','království')|El].\n\n[Concept('holder','Držitel')|E] říše má [Concept('de_jure','de iure')|El] práva k jejímu dílčímu území a může mít [Concept('kings','krále')|El] jako [Concept('vassals','vazaly')|El].\n\nŘíše mohou být neaktivní a nemusí mít současného držitele. Takové $game_concept_titles$ může vytvořit [Concept('ruler','vládce')|El], který ovládá více než 80 % [Concept('counties','hrabství')|El] v jejich rámci." # todo: CONCEPT CASE
 game_concept_emperor_desc: "Císař je [Concept('ruler','vládce')|El], jehož [Concept('primary_title','hlavním titulem')|El] je [Concept('empire','říše')|El].\n\nJeho [Concept('rank','hodnosti')|El] je přímo nad [Concept('kings','králi')|El] a přímo pod [Concept('hegemons','hegemony')|El], a proto může mít $game_concept_kings$ a nižší jako [Concept('vassals','vazaly')|El] a pouze $game_concept_hegemon$ jako svého [Concept('liege','lenního pána')|El]." # todo: CONCEPT CASE
 game_concept_hegemony: "Hegemonie"
 game_concept_hegemonies: "Hegemonie"
 game_concept_hegemon: "Hegemon"
 game_concept_hegemons: "Hegemoni"
 game_concept_hegemony_desc: "Hegemonie je [Concept('title','titul')|El] nejvyšší [Concept('title_tier','úrovně titulu')|El].\n\n[Concept('holder','Držitel')|E] Hegemonie má [Concept('de_jure','de iure')|El] práva k jejímu dílčímu území a může mít [Concept('emperors','císaře')|El] jako [Concept('vassals','vazaly')|El]." # todo: CONCEPT CASE
 game_concept_hegemon_desc: "Hegemon je [Concept('ruler','vládce')|El], jehož [Concept('primary_title','hlavním titulem')|El] je [Concept('hegemony','hegemonie')|El].\n\nJeho [Concept('rank','hodnosti')|El] je nejvyšší možná, přímo nad [Concept('emperors','císaři')|El]. Proto může mít jako [Concept('vassals','vazaly')|El] kohokoli, kdo není $game_concept_hegemons$, a nikdy nemůže mít [Concept('liege','lenního pána')|El]." # todo: CONCEPT CASE
 game_concept_culture: "Kultura"
 game_concept_cultures: "Kultury"
 game_concept_culture_possessive: "Kultury"
 game_concept_cultural: "Kulturní"
 game_concept_culture_desc: "Kultura představuje jazyk a zvyklosti postavy nebo [Concept('county','hrabství')|El].\n\nPostavy odlišných kultur o sobě budou mít nižší [Concept('opinions','mínění')|El]. Tento postih lze snížit zvýšením [Concept('cultural_acceptance','kulturním přijetím')|El]." # todo: CONCEPT CASE
 game_concept_culture_i: "@culture_icon!"
 game_concept_religion: "Náboženství"
 game_concept_religions: "Náboženství"
 game_concept_religion_desc: "Náboženství se může skládat z mnoha různých vyznání, zvaných [Concept('faiths','víry')|El]. Náboženství pak náležejí k jedné ze čtyř větších [Concept('religious_families','náboženských rodin')|El]: [GetReligionFamily('rf_abrahamic').GetName], [GetReligionFamily('rf_eastern').GetName], [GetReligionFamily('rf_sinitic').GetName] nebo [GetReligionFamily('rf_pagan').GetName]." # todo: CONCEPT CASE
 game_concept_heresy: "Kacířství"
 game_concept_heresies: "Kacířství"
 game_concept_heresy_desc: "Když je [Concept('fervor','horlivost')|El] [Concept('faith','víry')|El] nízká, může dojít k vypuknutí kacířství. Když se to stane, [Concept('ruler','vládce')|El] víry s nízkou horlivostí konvertuje k jiné víře a stane se [GetTrait('heresiarch').GetName( GetNullCharacter )]. Poté rozšíří svou novou víru do svých [Concept('counties','hrabství')|El] a mezi své [Concept('vassals','vazaly')|El].\n\nPokud je vypuknutí menšího rozsahu, tím to skončí. Pokud jde o velké vypuknutí, konvertuje více vládců ve stejné oblasti. Pokud se v této oblasti nacházíš, dostaneš také možnost konvertovat, budeš-li chtít."
 game_concept_faith: "Víra"
 game_concept_faiths: "Víry"
 game_concept_faithpossessive: "Víry"
 game_concept_faith_desc: "Víra je konkrétní vyznání v rámci širšího [Concept('religion','náboženství')|El]. Všechny postavy a [Concept('counties','hrabství')|El] mají víru stejně jako mají [Concept('culture','kulturu')|El].\n\nKaždá víra je definována sadou [Concept('doctrines','doktrínami')|El] s dalekosáhlými důsledky pro její stoupence.\n\nKaždá víra má také hodnotu [Concept('fervor','horlivost')|El], která určuje, jak zranitelná je vůči [Concept('heresy','kacířství')|El] ([Concept('rulers','vládci')|El] a hrabství konvertující k jiným vírám v rámci stejného náboženství)." # todo: CONCEPT CASE
 game_concept_tolerance: "Tolerance"
 game_concept_tolerate: "Tolerovat"
 game_concept_tolerates: "Toleruje"
 game_concept_fervor: "Horlivost"
 game_concept_fervor_desc: "Horlivost [Concept('faith','víry')|El] se pohybuje od #V 0#! do #V 100 %#!. Nízká horlivosti usnadňuje [Concept('rulers','vládcům')|El] vytváření vlastních nových věr a zvyšuje pravděpodobnost, že [Concept('counties','hrabství')|El] a postavy konvertují k jiným vírám, včetně [Concept('heresies','kacířství')|El]. Vysoká $game_concept_fervor$ zvyšuje rychlost konverze hrabství.\n\nHorlivost se přirozeně mění v čase. Menší víry mívají vyšší horlivost. Větší víry mívají nízkou horlivost.\n\nVedení velkých svatých válek a úspěšných svatých válek snižuje $game_concept_fervor$. Být jejich cílem horlivostí zvyšuje. Vypuknutí [Concept('heresy','kacířství')|El] $game_concept_fervor$ výrazně zvýší." # todo: CONCEPT CASE
 game_concept_doctrine: "Doktrína"
 game_concept_doctrines: "Doktríny"
 game_concept_doctrines_desc: "Doktríny lze považovat za náboženské zákony, které určují, jaké chování je v rámci [Concept('faith','víry')|El] přijatelné."
 game_concept_gender_doctrines: "Doktríny o pohlaví"
 game_concept_gender_doctrines_desc: "Tyto [Concept('doctrines','doktríny')|El] určují, které [Concept('gender_laws','zákony o pohlaví')|El] jsou dostupné postavám dané [Concept('faith','víry')|El].\n\nUrčují také některá další pravidla, například jaké [Concept('claims','nároky')|El] lze zdědit, kdo může být [Concept('commanders','velitelem')|El] a [Concept('knights','rytířem')|El] a ke kterému [Concept('house','rodu')|El] svých rodičů bude náležet [Concept('bastard','bastard')|El].\n\nDoktríny o pohlaví jsou:\n$BULLET_WITH_TAB$mužská nadvláda\n$BULLET_WITH_TAB$rovnost\n$BULLET_WITH_TAB$ženská nadvláda"
 game_concept_realm_capital: "Hlavní sídlo panství"
 game_concept_realm_capitals: "Hlavní sídla panství"
 game_concept_realm_capital_possessive: "Hlavního sídla panství"
 game_concept_capital: "Hlavní sídlo"
 game_concept_capitals: "Hlavní sídla"
 game_concept_capital_possessive: "Hlavního sídla"
 game_concept_realm_capital_desc: "Hlavní sídlo panství je [Concept('holding','država')|El], kde sídlí [Concept('ruler','vládce')|El] a jeho [Concept('court','dvora')|El]. Tato država má bonus k [Concept('tax','daním')|El] a vždy ji zdědí [Concept('primary_heir','hlavní dědic')|El].\n\n[Concept('occupying','Obsazení')|E] hlavního sídla panství nepřítele ve válce poskytuje značné množství [Concept('war_score','válečného skóre')|El] a někdy ti umožní [Concept('imprison','uvěznit')|El] členy nepřátelské rodiny." # todo: CONCEPT CASE
 game_concept_county_capital: "Hlavní sídlo hrabství"
 game_concept_county_capitals: "Hlavní sídla hrabství"
 game_concept_county_capital_desc: "Hlavní sídlo hrabství je hlavní [Concept('holding','država')|El] [Concept('county','hrabství')|El]. Tato država nemůže být nikdy zničena ani [Concept('leased','pronajata')|El] a vždy ji vlastního [Concept('ruler','vládce')|El], který drží [Concept('title','titul')|El] hrabství.\n\nHlavní sídla hrabství umožňují stavbu dodatečné [Concept('building','budovy')|El] oproti menší državě." # todo: CONCEPT CASE
 game_concept_de_jure_capital: "De iure hlavní sídlo"
 game_concept_de_jure_capital_desc: "De iure hlavní sídlo [Concept('title','Titul')|El] je [Concept('county','hrabství')|El], které bylo jeho historickým hlavním sídlem. Své [Concept('realm_capital','hlavní sídlo panství')|El] můžeš vždy přesunout do de iure hlavního sídla svého [Concept('primary_title','hlavního titulu')|El], i když už bylo přesunuto." # todo: CONCEPT CASE
 game_concept_capital_duchy: "Hlavní vévodství"
 game_concept_capital_duchy_desc: "Modifikátor $game_concept_capital_duchy$ zvyšuje množství [Concept('levies','odvedenců')|El], které získáváš ze všech [Concept('holdings','držav')|El] držených ve stejném [Concept('de_jure','de iure')|El] [Concept('duchy','vévodství')|El] jako tvé [Concept('capital','hlavní sídlo')|El]. Také poskytuje bonus všem [Concept('stationed','umístěným')|El] [Concept('men_at_arms','ozbrojencům')|El]. Aby byl tento modifikátor aktivní, musíš osobně držet příslušné vévodství.\n\nTento modifikátor se nesčítá s bonusem hlavního sídla panství."
 game_concept_liege: "Lenní pán"
 game_concept_lieges: "Lenní páni"
 game_concept_liege_possessive: "Lenního pána"
 game_concept_liege_desc: "Lenní pán je [Concept('ruler','vládce')|El] alespoň s jedním [Concept('vassal','vazalem')|El]. Lenní páni mohou být sami vazaly ještě výše postavených vládců a tak dále." # todo: CONCEPT CASE
 game_concept_rightful_liege: "Právoplatný lenní pán"
 game_concept_rightful_liege_desc: "$game_concept_rightful_liege$ [Concept('vassal','vazala')|El] je [Concept('ruler','vládce')|El], který drží přímý [Concept('de_jure','de iure')|El] [Concept('liege','lenní')|El] [Concept('title','titul')|El] vůči [Concept('primary_title','hlavnímu titulu')|El] daného $game_concept_vassal$. Pokud $game_concept_vassal$ nespadá pod svého $game_concept_rightful_liege$, odvádí méně [Concept('taxes','daní')|El] a [Concept('levies','odvedenců')|El] a zároveň trpí postihem k [Concept('opinion','mínění')|El] vůči svému $game_concept_liege$. Držení $game_concept_title$ vyšší [Concept('title_tier','úrovně titulu')|El] v rámci téhož $game_concept_de_jure$ vede ke snížení těchto postihů.\n\nVýjimkou jsou [Concept('dukes','vévodové')|El], kteří jsou součástí $game_concept_de_jure$ hierarchie některé [Concept('empire','říše')|El] a jsou přímo vazalizováni svému $game_concept_emperor$; ti stále odvádějí plnou výši, přesně jako kdyby $game_concept_emperor$ držel jejich $game_concept_de_jure$ [Concept('kingdom','královský')|El] $game_concept_title$.\n\n#weak Příklad: Hrabě z $c_dunbar$ je přímým vazalem krále $k_england$. Protože král není ani vévodou $d_lothian$, ani králem $k_scotland$, ani císařem $e_britannia$, odvádí hrabě z $c_dunbar$ jen nepatrnou část svých daní a odvedenců.\n\nHrabě z $c_norfolk$ je také přímým vazalem krále $k_england$. Král nedrží vévodství $d_norfolk$, takže i tento hrabě odvádí snížené daně a odvedence. Protože je však $k_england$ de iure královstvím $c_norfolk$, hrabě z $c_norfolk$ stále odvádí králi výrazně více daní a odvedenců než hrabě z $c_dunbar$.#!" # todo: CONCEPT CASE
 game_concept_rightful_liege_desc_part1: "Právoplatný lenní pán [Concept('vassal','Vazal')|El] je [Concept('ruler','vládce')|El], který drží přímý [Concept('de_jure','de iure')|El] [Concept('liege','lenní')|El] [Concept('title','titul')|El] vůči [Concept('primary_title','hlavnímu titulu')|El] daného vazalovi. Pokud $game_concept_vassal$ nespadá pod svého právoplatným lenním pánem, odvádí méně [Concept('taxes','daní')|El] a [Concept('levies','odvedenců')|El] a zároveň trpí postihem k [Concept('opinion','mínění')|El] vůči svému lennímu pánovi. Držení $game_concept_title$ vyšší [Concept('title_tier','úrovně titulu')|El] v rámci téhož de iure vede ke snížení těchto postihů.\n\nVýjimkou jsou [Concept('dukes','vévodové')|El], kteří jsou součástí de iure hierarchie některé [Concept('empire','říše')|El] a jsou přímo vazalizováni svému císaři; ti stále odvádějí plnou výši, přesně jako kdyby $game_concept_emperor$ držel jejich $game_concept_de_jure$ [Concept('kingdom','královský')|El] $game_concept_title$." # todo: CONCEPT CASE
 game_concept_rightful_liege_desc_part2: "#weak Příklad: Hrabě z $c_dunbar$ je přímým vazalem krále $k_england$. Protože král není ani vévodou $d_lothian$, ani králem $k_scotland$, ani císařem $e_britannia$, odvádí hrabě z $c_dunbar$ jen nepatrnou část svých daní a odvedenců.\n\nHrabě z $c_norfolk$ je také přímým vazalem krále $k_england$. Král nedrží vévodství $d_norfolk$, takže i tento hrabě odvádí snížené daně a odvedence. Protože je však $k_england$ de iure královstvím $c_norfolk$, hrabě z $c_norfolk$ stále odvádí králi výrazně více daní a odvedenců než hrabě z $c_dunbar$.#!"
 game_concept_megaduke_penalty: "Přebujelost"
 game_concept_megaduke_penalty_desc: "Pokud máš jako [Concept('duke','vévoda')|El] ve svém [Concept('realm','panství')|El] více než [GetDefine('NCharacter', 'MAX_COUNTIES_IN_REALM_AS_DUKE')] [Concept('counties','hrabství')|El], utrpíš postih $game_concept_megaduke_penalty$, který sníží tvůj příjem z [Concept('tax','daně')|El].\n\nDosažení [Concept('rank','hodnosti')|El] [Concept('king','krále')|El] nebo [Concept('emperor','císaře')|El] tento postih odstraní." # todo: CONCEPT CASE
 game_concept_top_liege: "Nejvyšší lenní pán"
 game_concept_top_lieges: "Nejvyšší lenní páni"
 game_concept_top_liege_possessive: "Nejvyššího lenního pána"
 game_concept_top_liege_desc: "„$game_concept_top_liege$“ je [Concept('liege','lenní pán')|El] na vrcholu [Concept('vassal','vazalské')|El] hierarchie.\n\nJsou to zcela [Concept('independent','nezávislí')|El] [Concept('rulers','vládci')|El] a nezodpovídají se žádnému smrtelníkovi."
 game_concept_top_realm: "Nejvyšší říše"
 game_concept_top_realm_desc: "„$game_concept_top_realm$“ je [Concept('realm','panství')|El] [Concept('top_liege','nejvyššího lenního pána')|El]."
 game_concept_domain: "Doména"
 game_concept_domains: "Domény"
 game_concept_domain_i: "@domain_icon!"
 game_concept_domain_desc: "Doména [Concept('ruler','Vládce')|El] je soubor všech [Concept('holdings','držav')|El], které osobně vlastní.\n\nPoměrně stálý [Concept('domain_limit','limit domény')|El] znamená, že se vládci musí spoléhat na [Concept('vassals','vazaly')|El], chtějí-li své [Concept('realm','panství')|El] zvětšit za určitou mez." # todo: CONCEPT CASE
 game_concept_regiment: "Pluk"
 game_concept_regiments: "Pluky"
 game_concept_regiment_desc: "Pluk je skupina [Concept('soldiers','vojáků')|El] jednoho typu (například lučištníků, pěšáků nebo [Concept('levies','odvedenců')|El]). Ačkoli jsou $game_concept_levies$ organizováni do pluků, skutečně důležité jsou [Concept('men_at_arms','ozbrojenci')|El]." # todo: CONCEPT CASE
 game_concept_realm: "Panství"
 game_concept_realms: "Panství"
 game_concept_realm_possessive: "Panství"
 game_concept_realm_desc: "Panství je veškerá země, kterou [Concept('ruler','vládce')|El] ovládá buď přímo, nebo prostřednictvím [Concept('vassals','vazalů')|El] — na rozdíl od [Concept('domain','domény')|El], která zahrnuje pouze [Concept('holdings','državy')|El] osobně vlastněné vládcem." # todo: CONCEPT CASE
 game_concept_gold: "Zlato"
 game_concept_gold_desc: "„Zlato“ ve skutečnosti představuje veškerý likvidní majetek postavy, tedy její bohatství. Lze je utratit za mnoho věcí, zejména za stavbu [Concept('buildings','budovy')|El], placení [Concept('regiments','pluků')|El] a vytváření [Concept('titles','titulů')|El]." # todo: CONCEPT CASE
 game_concept_gold_i: "@gold_icon!"
 game_concept_income: "Příjem"
 game_concept_income_desc: "Existuje mnoho zdrojů [Concept('gold','zlata')|El], ale dvěma nejdůležitějšími jsou [Concept('taxation','zdanění')|El] tvých vlastních [Concept('holdings','držav')|El] a tvých [Concept('vassals','vazalů')|El]."
 game_concept_trait: "Rys"
 game_concept_traits: "Rysy"
 game_concept_trait_desc: "Rysy postavy popisují její osobnost, zvláštnosti, činy a stav.\n\nRysy mohou mít mnoho účinků, ale mnohé ovlivňují [Concept('skills','dovednosti')|El] postavy.\n\nOsobnostní rysy také výrazně ovlivňují, jaké chování lze od postav očekávat. Jednání proti vlastní osobnosti způsobuje [Concept('stress','stres')|El].\n\nNěkteré rysy jsou [Concept('congenital','vrozené')|El] a mohou je zdědit potomci." # todo: CONCEPT CASE
 game_concept_spouse: "Choť"
 game_concept_spouses: "Choti"
 game_concept_spouse_possessive: "Choti"
 game_concept_spouse_desc: "Choť je manžel či manželka postavy; výsledek [Concept('marriage','sňatku')|El].\n\nChceš-li mít legitimní potomstvo a plodit [Concept('heirs','dědice')|El], měl bys mít choť nebo [Concept('concubine','konkubínu')|El] (ačkoli [Concept('bastards','bastardy')|El] lze legitimizovat).\n\nJediný způsob, jak uzavřít [Concept('alliance','alianci')|El], je skrze sňatek nebo [Concept('betrothal','zasnoubení')|El] — tvůj vlastní nebo blízkého příbuzného.\n\nTvá hlavní choť je také členem tvé [Concept('council','rady')|El] a může plnit mnoho užitečných [Concept('councillor_tasks','úkolů rádce')|El].\n\n[Concept('doctrines','Doktríny')|E] [Concept('faith','víry')|El] určují, kolik choti můžeš mít a jak se s nimi lze [Concept('divorced','rozvést')|El]." # todo: CONCEPT CASE
 game_concept_primary_spouse: "Hlavní choť"
 game_concept_primary_spouse_desc: "Ve [Concept('faiths','vírech')|El] s [GetFaithDoctrine('doctrine_polygamy').GetBaseName] si [Concept('rulers','vládci')|El] musí zvolit jednu ze svých [Concept('spouses','chotí')|El] jako svou hlavní choť. Hlavní choť vládce s ním získává zvýšenou [Concept('fertility','plodností')|El], zvýšené [Concept('opinion','mínění')|El] o něm a může sloužit v jeho [Concept('council','radě')|El]." # todo: CONCEPT CASE
 game_concept_available_spouse: "Dostupná choť"
 game_concept_available_spouse_desc: "Aby mohla [Concept('spouse','choť')|El] sloužit v [Concept('council','radě')|El] vládce, musí být dostupná k plnění povinností této role.\n\nRůzné okolnosti mohou $game_concept_spouse$ bránit v plnění těchto povinností, ale mezi několik nejběžnějších patří:\n$BULLET_WITH_TAB$je [Concept('ruler','vládcem')|El] vlastního [Concept('realm','panství')|El]\n$BULLET_WITH_TAB$pobývá u [Concept('court','dvora')|El] jiného vládce\n$BULLET_WITH_TAB$je [Concept('imprisoned','uvězněna')|El], doma či v cizině\n$BULLET_WITH_TAB$má [Concept('trait','rys')|El] [GetTrait('incapable').GetName( GetNullCharacter )]\n\nPokud se nedostupná choť znovu stane dostupnou, automaticky se vrátí ke svým povinnostem v radě.\n\nChoti, které vládnou vlastním právem, mohou stále sloužit v radě, pokud jsou tvými [Concept('direct_vassals','přímými vazaly')|El], jinak však nikdy nebudou považovány za dostupné."
 game_concept_holding: "Država"
 game_concept_holdings: "Državy"
 game_concept_holding_desc: "Država je ústřední sídlo [Concept('barony','baronství')|El] nebo [Concept('county_capital','hlavního sídla hrabství')|El].\n\nPoskytuje [Concept('taxes','daně')|El] a [Concept('levies','odvedence')|El] svému [Concept('holder','držiteli')|El] podle svého [Concept('holding_type','typu državy')|El]. Soubor držav osobně vlastněných [Concept('ruler','vládců')|El] se nazývá [Concept('domain','doménou')|El]." # todo: CONCEPT CASE
 game_concept_holding_type: "Typ državy"
 game_concept_holding_types: "Typy držav"
 game_concept_holding_type_desc: "Existují čtyři typy [Concept('holdings','držav')|El]: [Concept('castles','hrady')|El], [Concept('cities','města')|El], [Concept('tribes','kmeny')|El] a [Concept('temples','chrámy')|El]. Každý typ umožňuje různé typy [Concept('buildings','budov')|El]. [Concept('government_form','Forma vlády')|E] [Concept('ruler','Vládce')|El] určuje, které typy držav může vládce osobně vlastnit bez postihu. V případě chrámů mohou hrát roli také [Concept('doctrines','doktríny')|El] jejich [Concept('faith','víry')|El]." # todo: CONCEPT CASE
 game_concept_castle_holding: "Hradní država"
 game_concept_castle: "Hrad"
 game_concept_castles: "Hrady"
 game_concept_castle_holdings: "Hradní državy"
 game_concept_castle_holding_desc: "Hrady jsou nejlépe opevněný [Concept('holding_type','typ državy')|El] a standardní typ pro [Concept('feudal','feudálního')|El], [Concept('clan','klanové')|El] a [Concept('tribal','kmenové')|El] [Concept('rulers','vládce')|El], stejně jako pro [Concept('holy_orders','svaté řády')|El]. Obvykle poskytují více [Concept('levies','odvedenců')|El] než [Concept('taxes','daní')|El]." # todo: CONCEPT CASE
 game_concept_temple_holding: "Chrámová država"
 game_concept_temple: "Chrám"
 game_concept_temples: "Chrámy"
 game_concept_temple_holdings: "Chrámové državy"
 game_concept_temple_holding_desc: "Chrámy jsou [Concept('holding_type','typ državy')|El], který mohou držet členové [Concept('clergy','duchovenstva')|El] jako [Concept('church_property','církevní majetek')|El] ([Concept('theocratic','teokratická')|El] [Concept('government_form','forma vlády')|El]). Ve [Concept('faiths','vírech')|El] s [Concept('doctrine','doktrínou')|El] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] však může chrámy držet bez postihu kdokoli.\n\nChrámy poskytují poměrně vyváženou směs [Concept('levies','odvedence')|El] a [Concept('taxes','daní')|El]." # todo: CONCEPT CASE
 game_concept_city_holding: "Městská država"
 game_concept_city: "Město"
 game_concept_cities: "Města"
 game_concept_city_holdings: "Městské državy"
 game_concept_tribal_holding: "Kmenová država"
 game_concept_tribal_holdings: "Kmenové državy"
 game_concept_tribal_holding_desc: "Kmeny jsou chudé na [Concept('taxes','daně')|El], ale bohaté na [Concept('levies','odvedence')|El], [Concept('prestige','prestiž')|El] a vylepšení [Concept('men_at_arms','ozbrojenců')|El]. Mají omezený potenciál vylepšení, a přestože jsou zpočátku silné, s postupem času jejich moc rychle upadá. Bez postihů je mohou držet pouze [Concept('tribal','kmenové')|El] postavy.\n\nPokud v [Concept('county','hrabství')|El] existuje kmen, nelze stavět žádné další [Concept('holdings','državy')|El]. [Concept('feudal','Feudální')|E] vládci budou muset utratit [Concept('gold','zlato')|El], aby kmeny přeměnili na [Concept('castles','hrady')|El]."
 game_concept_tribe: "Kmen"
 game_concept_tribes: "Kmeny"
 game_concept_city_holding_desc: "Města jsou nejbohatším [Concept('holding_type','typem državy')|El] a upřednostňují [Concept('taxes','daně')|El] před [Concept('levies','odvedenci')|El]. Jsou spojena s [Concept('republics','republikami')|El] a jejich držení kteroukoli z hratelných [Concept('government_forms','forem vlády')|El] vždy přinese postih."
 game_concept_rally_point: "Shromaždiště"
 game_concept_rally_points: "Shromaždiště"
 game_concept_rally_point_desc: "Shromaždiště je svolávací místo pro [Concept('levies','odvedence')|El] a [Concept('men_at_arms','ozbrojence')|El] pod tvým velením.\n\nV čase [Concept('war','války')|El] můžeš na shromaždišti povolat své [Concept('soldiers','vojáky')|El] a shromáždit [Concept('army','armádu')|El].\n\nOdvedenci přiřazení ke shromaždišti musí pocházet buď z tvé vlastní [Concept('domain','domény')|El], nebo od tvých [Concept('vassals','vazalů')|El]. Shromaždiště lze podle potřeby reorganizovat, rozdělovat a slučovat." # todo: CONCEPT CASE
 game_concept_piety: "Zbožnost"
 game_concept_pious: "Zbožný"
 game_concept_piety_i: "[GetLocalPlayerPietyTextIcon]"
 game_concept_piety_desc: "Zbožnost představuje ctnost postavy.\n\nZbožné jednání podle [Concept('doctrines','doktrín')|El] její [Concept('faith','víry')|El] zvyšuje zbožnost postavy, například vykonání [GetActivityType('activity_pilgrimage').GetName].\n\nZbožnost lze utratit za různé náboženské záležitosti v závislosti na [Concept('government_form','formu vlády')|El], doktrínách a podobně.\n\nPokaždé, když postava získá $game_concept_piety$, postoupí také směrem k další [Concept('piety_level','úrovni oddanosti')|El]." # todo: CONCEPT CASE
 game_concept_piety_experience: "Oddanost"
 game_concept_piety_experience_desc: "Každý bod oddanosti, který postava získá, zvyšuje její postup směrem k další [Concept('piety_level','úrovni oddanosti')|El]. Když postava získá [Concept('piety','zbožnost')|El], získá zároveň stejné množství oddanosti."
 game_concept_maximum_piety_level: "Nejvyšší úroveň oddanosti"
 game_concept_maximum_piety_level_desc: "Nejvyšší úroveň oddanosti představuje nejvyšší [Concept('piety_level','úroveň oddanosti')|El], které může [Concept('ruler','vládce')|El] za svého života dosáhnout. Ve výchozím stavu je touto úrovní [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L].[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'maximum_piety_level_mandala')]" # todo: CONCEPT CASE
 maximum_piety_level_mandala: "\n\nKdyž však [Concept('mandala','mandalový')|El] [Concept('ruler','vládce')|El] zemře způsobem přijatelným pro svůj [Concept('aspect','aspekt')|El] poté, co dosáhl [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], získá dědic tohoto vládce schopnost postupovat k další úrovni oddanosti až do dosažení [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]."
 game_concept_piety_level: "Úroveň oddanosti"
 game_concept_piety_levels: "Úroveň/úrovně oddanosti"
 additional_mandala_government_piety_levels: "[Concept('government','Vláda')|E] typu [Concept('mandala','mandaly')|El] může po [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L] odemknout další úrovně oddanosti, a to až do [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L] včetně. K dosažení takového stupně božskosti musí být její oddanost prokázána napříč generacemi." # todo: CONCEPT CASE
 game_concept_piety_level_desc: "Úroveň oddanosti postavy vyjadřuje, nakolik je ctnostná a zbožná, stejně jako její postavení mezi ostatními členy její [Concept('faith','víry')|El].\n\nPokaždé, když postava získá [Concept('piety','zbožnost')|El], postoupí také směrem k další úrovni oddanosti.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nÚrovně jsou:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]" # todo: CONCEPT CASE
 game_concept_additional_piety_level_desc: "\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]"
 game_concept_prestige: "Prestiž"
 game_concept_prestigious: "Prestižní"
 game_concept_prestige_i: "@prestige_icon!"
 game_concept_prestige_desc: "Prestiž představuje slávu a společenské postavení postavy.\n\nPrestiž lze utratit za různé světské záležitosti v závislosti na [Concept('government_form','formu vlády')|El], [Concept('doctrines','doktríny')|El] a podobně.\n\nPokaždé, když postava získá prestiž, postoupí také směrem k další [Concept('prestige_level','úrovni slávy')|El]." # todo: CONCEPT CASE
 game_concept_prestige_experience_i: "@prestige_icon!" # todo: CONCEPT CASE
 game_concept_prestige_experience: "Proslulost"
 game_concept_prestige_experience_desc: "Každý bod slávy, který postava získá, zvyšuje její postup směrem k další [Concept('prestige_level','úrovni slávy')|El]. Když postava získá [Concept('prestige','prestiž')|El], získá zároveň stejné množství slávy."
 game_concept_prestige_level: "Úroveň slávy"
 game_concept_prestige_levels: "Úrovně slávy"
 game_concept_prestige_level_desc: "Úroveň slávy postavy měří její obecnou pověst a to, jak je vnímána ostatními.\n\nPokaždé, když postava získá [Concept('prestige','prestiž')|El], postoupí také směrem k další úrovni slávy.\n\nÚrovně jsou:\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_5' ).GetNameWithTooltip|L]" # todo: CONCEPT CASE
 game_concept_dynast: "Hlava dynastie"
 game_concept_dynast_desc: "Hlava dynastie je [Concept('house_head','hlava rodu')|El], která stojí v čele celé [Concept('dynasty','dynastii')|El] a všech jejích [Concept('houses','rodů')|El].\n\nHlava dynastie má nad členy dynastie určité jedinečné pravomoci známé jako [Concept('dynast_interactions','interakce hlavy dynastie')|El]. Hlava dynastie také vybírá [Concept('dynasty_perks','dynastické odkazy')|El] pro dynastii.\n\nZa běžných okolností je $game_concept_dynast$ tou hlavou rodu, která může mít nejvíce [Concept('soldiers','vojáků')|El]. Pokud mají všechny hlav rodu [Concept('administrative','administrativnímu')|El] [Concept('government','vládě')|El], hlavě dynastie je místo toho ten, kdo má nejvyšší [Concept('powerful_family_rating','hodnocení mocné rodiny')|El]." # todo: CONCEPT CASE
 game_concept_dynasty: "Dynastie"
 game_concept_dynasties: "Dynastie"
 game_concept_dynastic: "Dynastický"
 game_concept_dynasty_members: "Členové dynastie"
 game_concept_dynasty_desc: "Dynastie je skupina [Concept('noble','urozených')|El] potomků [Concept('landed','zeměpánského')|El] předka, zakladatele dynastie. Původní [Concept('house','rod')|El] se může rozdělit na nové rody ([Concept('cadet_branches','kadetské větve')|El]), které všechny nadále náležejí k širší dynastii.\n\nKdyž tvá postava zemře, musíš mít [Concept('player_heir','hráčského dědice')|El], jinak hra skončí (i když si můžeš vybrat jiného vládce a pokračovat ve hře ve stejném světě).\n\nPodobně jako mají postavy [Concept('prestige','prestiž')|El], dynastie mají [Concept('dynasty_prestige','věhlas')|El]." # todo: CONCEPT CASE
 game_concept_dynast_interaction: "Interakce hlavy dynastie"
 game_concept_dynast_interactions: "Interakce hlavy dynastie"
 game_concept_dynast_interaction_desc: "Interakce, které jsou jedinečně dostupné [Concept('dynast','hlavě dynastie')|El] [Concept('dynasty','dynastie')|El] vůči ostatním členům této dynastie.\n\nJejich použití stojí [Concept('dynasty_prestige','věhlas')|El]."
 game_concept_dynasty_prestige: "Věhlas"
 game_concept_dynasty_prestige_i: "@dynasty_prestige_icon!"
 game_concept_renown: "Věhlas" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_desc: "Věhlas je podobný [Concept('prestige','prestiži')|El], ale sdílí jej celá [Concept('dynasty','dynastie')|El].\n\nDynastie získává $game_concept_dynasty_prestige$ za následující:\n$BULLET_WITH_TAB$počet aktuálně žijících členů\n$BULLET_WITH_TAB$počet [Concept('rulers','vládců')|El]\n$BULLET_WITH_TAB$počet [Concept('spouses','chotí')|El] jiných vládců\nPamatuj, že vládce nebude vytvářet $game_concept_dynasty_prestige$, pokud má jakéhokoli [Concept('liege','lenního pána')|El] ze stejné dynastie.\n\nStejně jako prestiž se i $game_concept_dynasty_prestige$ započítává do zvyšování tvé [Concept('dynasty_prestige_level','úrovně velkoleposti')|El].\n\nVěhlas může [Concept('dynast','hlava dynastie')|El] utrácet za odemykání [Concept('dynasty_perks','dynastické odkazy')|El] a za ovlivňování členů dynastie různými způsoby.\n\n#weak Dynastie rozšířená široko daleko mezi několika různými [Concept('realms','panstvími')|El] bude vytvářet více $game_concept_dynasty_prestige$ než dynastie soustředěná v jediném panství.#!" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level: "Úroveň věhlasu"
 game_concept_dynasty_prestige_level_desc: "Úroveň věhlasu měří, jak slavná je [Concept('dynasty','dynastie')|El]. Pokrok úrovně nastává pokaždé, když tvá dynastie získá [Concept('dynasty_prestige','věhlas')|El]. Postavy při narození získají určité množství počáteční [Concept('prestige','prestiže')|El] podle své úroveň věhlasu. Podobně [Concept('spouses','choti')|El] získávají část prestiže z dynastie toho druhého, když uzavřou [Concept('marry','sňatek')|El].\n\nÚrovně jsou:\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_0','Prosté kořeny')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_1','Neznámý')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_2','Nevýznamný')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_3','Pozoruhodný')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_4','Vážený')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_5','Dobře známý')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_6','Významný')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_7','Proslulý')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_8','Slavný')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_9','Opěvovaný')|E]\n$EFFECT_LIST_BULLET$[Concept('dynasty_prestige_level_10','Legendární')|E]" # todo: CONCEPT CASE
 game_concept_house: "Rod"
 game_concept_houses: "Rody"
 game_concept_house_possessive: "Rodu"
 game_concept_house_desc: "Rod je větev členů na širším stromě [Concept('dynasty','dynastii')|El]. Rody zakládají [Concept('rulers','vládci')|El], kteří se již nechtějí zodpovídat své současné [Concept('house_head','hlavě rodu')|El] a raději by sami stáli v čele nového rodu.\n\nPřestože mají rody vlastní jména a erby, stále sdílejí [Concept('dynasty_prestige','věhlas')|El] a další členové dynastie mohou být stále tvým [Concept('player_heir','hráčským dědicem')|El]." # todo: CONCEPT CASE
 game_concept_house_head: "Hlava rodu"
 game_concept_house_heads: "Hlavy rodu"
 game_concept_house_heads_possessive: "Hlavy rodu"
 game_concept_house_head_head: "Hlava"
 game_concept_house_head_heads: "Hlavy"
 game_concept_house_head_desc: "Každý [Concept('house','rod')|El] v rámci [Concept('dynasty','dynastie')|El] má $game_concept_house_head$, která má nad členy rodu určité jedinečné pravomoci.\n\nHlava rodu může zejména legitimizovat [Concept('bastards','bastardy')|El], povolávat členy rodu do [Concept('war','války')|El] a požadovat konverzi [Concept('landed','zeměpánských')|El] členů. Hlava rodu také získává [Concept('weak_hook','slabou páku')|El] na všechny členy svého rodu narozené v době, kdy je u moci.\n\nKdyž zemře, jejím novým nástupcem jako $game_concept_house_head$ se stane její [Concept('primary_heir','hlavní dědic')|El].\n\n[Concept('clan_house_heads','Hlavy klanových rodů')|E] mají zvláštní pravidla a výsady." # todo: CONCEPT CASE
 game_concept_clan_house_head: "Hlava klanového rodu"
 game_concept_clan_house_heads: "Hlavy klanových rodů"
 game_concept_clan_house_head_head: "Hlava" # todo: CONCEPT CASE
 game_concept_clan_house_head_desc: "Hlava klanového rodu se v mnoha ohledech podobá běžné [Concept('house_head','hlavě rodu')|El], ale v několika důležitých věcech se liší.\n\nHlavy klanových rodů nezískávají [Concept('weak_hook','slabou páku')|El] na všechny členy svého [Concept('house','rodu')|El]. Mají větší vliv na [Concept('house_unity','soudržnost rodu')|El] než ostatní členové rodu. Kromě toho může kterýkoli člen rodu vyzvat $game_concept_clan_house_head$ k boji o převahu a stát se sám $game_concept_house_head$." # todo: CONCEPT CASE
 game_concept_denounce: "Zavrhnout"
 game_concept_denouncement: "Zavržení"
 game_concept_denounce_desc: "[Concept('dynast','Hlava dynastie')|E] může za cenu [Concept('dynasty_prestige','věhlas')|El] zavrhnout člena své [Concept('dynasty','dynastii')|El].\n\nKaždý člen téže dynastie (včetně samotné hlavy dynastie) získá vůči zavrženému členovi [Concept('imprisonment_reason','důvodu k uvěznění')|El]." # todo: CONCEPT CASE
 game_concept_hook: "Páka"
 game_concept_hooks: "Páky"
 game_concept_hooked: "Zavázaný"
 game_concept_hook_i: "@cs_weak_hook_icon!"
 game_concept_hook_desc: "Páka je obecný pojem pro vztah mezi postavami, v němž jedna může přimět druhou, aby konala její vůli.\n\nExistují dva typy, [Concept('weak_hooks','slabé páky')|El] a [Concept('strong_hooks','silné páky')|El], které se získávají různými způsoby.\n\nPáky lze použít k vynucení mnoha interakcí, například návrhů [Concept('marriage','sňatku')|El] a změn [Concept('vassal_contract','vazalské smlouvy')|El]." # todo: CONCEPT CASE
 game_concept_weak_hook: "Slabá páka"
 game_concept_weak_hooks: "Slabé páky"
 game_concept_weak_hook_desc: "Slabá páka je poměrně běžná [Concept('hook','páka')|El], kterou můžeš mít na postavu, jež ti dluží laskavost, nebo kterou jsi zmanipuloval, aby konala tvou vůli.\n\nAčkoli existuje mnoho interakcí, při nichž lze $game_concept_weak_hook$ použít, například u návrhů [Concept('marriage','sňatku')|El], nelze ji použít k donucení někoho stát se tvým [Concept('agent','spolčencem')|El] při [GetScheme('murder').GetTypeName] a neposkytuje pasivní výhodu #weak (k tomu je nutná [Concept('strong_hook','silná páka')|El].)#!\n\nKaždé dítě narozené do [Concept('noble','urozeného')|El] [Concept('house','rodu')|El] také od počátku dluží [Concept('house_head','hlavě rodu')|El] $game_concept_weak_hook$.\n\nJakmile je $game_concept_weak_hook$ použita, je #emphasis vyčerpána.#!" # todo: CONCEPT CASE
 game_concept_perpetual_hook: "Trvalá páka"
 game_concept_perpetual_hooks: "Trvalé páky"
 game_concept_perpetual_hook_desc: "Trvalá páka je [Concept('hook','páka')|El], kterou můžeš mít na postavu, jež ti dluží laskavost, nebo kterou jsi zmanipuloval, aby konala tvou vůli.\n\nNelze ji použít k donucení někoho stát se tvým [Concept('agent','spolčencem')|El] při [GetScheme('murder').GetTypeName] a neposkytuje pasivní výhodu #weak (k tomu je nutná [Concept('strong_hook','silná páka')|El].)#!\n\nTrvalé páky se při použití nevyčerpají, ale místo toho přejdou do doby obnovy, než je bude možné použít znovu.#!" # todo: CONCEPT CASE
 game_concept_strong_hook: "Silná páka"
 game_concept_strong_hooks: "Silné páky"
 game_concept_strong_hook_i: "@unspent_strong_hook_icon!"
 game_concept_strong_hook_desc: "Silná páka je velmi mocná [Concept('hook','páka')|El], kterou můžeš mít na postavu, již jsi [Concept('blackmailed','vydíral')|El].\n\nSilné páky jsou mnohem mocnější než [Concept('weak_hooks','slabé páky')|El] a mohou někoho donutit konat pro tebe strašné skutky — například stát se tvým [Concept('agent','spolčencem')|El] při [GetScheme('murder').GetTypeName] #weak (kromě všeho, co dokáže $game_concept_weak_hook$!)#!\n\nSilná páka také brání cíli podnikat nepřátelské kroky vůči držiteli.\n\nSilné páky se při použití nevyčerpají, ale místo toho přejdou do doby obnovy, než je bude možné použít znovu. Pasivní účinek se použitím páky neztratí." # todo: CONCEPT CASE
 game_concept_favor: "Laskavost"
 game_concept_favors: "Laskavosti"
 game_concept_favor_desc: "Postavy si mohou navzájem dlužit $game_concept_favors$, které se považují za typ [Concept('hook','páky')|El].\n\nLaskavosti lze získat mnoha způsoby, často však prostřednictvím různých naskriptovaných událostí. Každé dítě narozené do [Concept('noble','urozeného')|El] [Concept('house','rodu')|El] také od počátku dluží [Concept('house_head','hlavě rodu')|El] laskavost."
 game_concept_blackmail: "Vydírání"
 game_concept_blackmailed: "Vydíraný"
 game_concept_blackmailing: "Vydírání"
 game_concept_blackmail_desc: "Pokud znáš [Concept('criminal','zločinné')|El] [Concept('secret','tajemství')|El] jiné postavy, můžeš použít [Concept('character_interaction','interakci postavy')|El] $game_concept_blackmail$ a pokusit se na ni získat [Concept('hook','páku')|El].\n\nSíla této páky závisí na závažnosti tajemství, kterou zase často určují [Concept('doctrines','doktríny')|El]."
 game_concept_manipulation: "Manipulace"
 game_concept_manipulation_desc: "Manipulace je forma [Concept('hook','páky')|El], při níž se ti nějakým způsobem podařilo ovlivnit mysl jiné postavy tak, aby konala tvou vůli." # todo: CONCEPT CASE
 game_concept_soldier: "Voják"
 game_concept_soldiers: "Vojáci"
 game_concept_soldier_i: "@soldier_icon!"
 game_concept_soldiers_desc: "Vojáci je souhrnný pojem pro vojsko v [Concept('regiment','pluku')|El] nebo [Concept('army','armádě')|El], ať už jde o [Concept('levies','odvedence')|El], [Concept('men_at_arms','ozbrojence')|El] nebo [Concept('knights','rytíře')|El].\n\nMít nejvíce $game_concept_soldiers$ pomáhá vyhrávat [Concept('battles','bitvy')|El] a [Concept('sieges','obležení')|El]." # todo: CONCEPT CASE
 game_concept_health: "Zdraví"
 game_concept_healthy: "Zdravý"
 game_concept_health_desc: "Zdraví měří, jak pravděpodobné je, že postava zemře na [Concept('illnesses','nemoci')|El] nebo stářím.\n\nStaré postavy mají každý rok šanci ztratit zdraví a tato šance se s věkem zvyšuje." # todo: CONCEPT CASE
 game_concept_child_health: "Dětské zdraví"
 game_concept_child_health_desc: "Některé [Concept('traits','rysy')|El], například [GetTrait('measles').GetName( GetNullCharacter )], jsou obzvlášť nebezpečné pro [Concept('children','děti')|El].\n\nJakýkoli postih k dětskému zdraví se sčítá s běžnými postihy k [Concept('health','zdraví')|El], a to i od téhož rysu." # todo: CONCEPT CASE
 game_concept_adult_health: "Zdraví dospělých"
 game_concept_adult_health_desc: "Některé [Concept('traits','rysy')|El], například [GetTrait('ill').GetName( GetNullCharacter )], jsou nebezpečnější pro [Concept('adults','dospělé')|El].\n\nJakýkoli postih k zdraví dospělých se sčítá s běžnými postihy k [Concept('health','zdraví')|El], a to i od téhož rysu." # todo: CONCEPT CASE
 game_concept_elderly_health: "Zdraví starších"
 game_concept_elderly_health_desc: "Některé [Concept('traits','rysy')|El], například [GetTrait('pneumonic').GetName( GetNullCharacter )], jsou nebezpečnější pro ty, kdo dosáhli alespoň [GetDefine( 'NCharacter', 'FEMALE_ELDERLY_AGE' )|V] let věku.\n\nJakýkoli postih k zdraví starším se sčítá s běžnými postihy k [Concept('health','zdraví')|El], a to i od téhož rysu." # todo: CONCEPT CASE
 game_concept_character_death: "Smrt postavy"
 game_concept_character_death_death: "Smrt"
 game_concept_character_death_deaths: "Smrti"
 game_concept_character_death_dying: "Umírání"
 game_concept_character_death_die: "Zemřít"
 game_concept_character_death_dies: "Umírá"
 game_concept_character_death_desc: "Smrt vyvolá [Concept('succession','nástupnictví')|El], které je důležité pro [Concept('rulers','vládce')|El].\n\nPokud zemře hráčská postava, hráč bude pokračovat za svého [Concept('player_heir','hráčského dědice')|El] — nebo bude čelit konci hry, pokud nemá platného dědice."
 game_concept_death_natural_causes: "Přirozené příčiny"
 game_concept_death_natural_cause: "Přirozená příčina"
 game_concept_death_natural_causes_desc: "Pokojný odchod je podstatou smrti z přirozených příčin. Pro tyto účely jsou hlavními způsoby opuštění tohoto světa stáří a chronické nemoci." # todo: CONCEPT CASE
 game_concept_death_religion: "Náboženství"
 game_concept_death_religious: "Náboženská"
 game_concept_death_religion_desc: "Být převeden na onen svět pohany či znesvětitelským způsobem zbaven smrtelné schránky — mučednictví, ukřižování — a zůstat věrný své víře až do samého konce; jaký opravdovější způsob odchodu by mohl být?"
 game_concept_death_combat: "Boj"
 game_concept_death_combat_desc: "Utržení smrtelné rány během bitvy, souboje nebo jiných válečnických klání, například turnajů, patří mezi hlavní způsoby, jak odejít způsobem bojem." # todo: CONCEPT CASE
 game_concept_death_murder: "Vražda"
 game_concept_death_murder_desc: "Smrt tě konečně dostihne skrze vraždu — smrt ve lsti. Jaký byl tvůj život, taková byla i tvá smrt."
 game_concept_fertility: "Plodnost"
 game_concept_fertility_desc: "Plodnost měří, nakolik je postava schopna plodit děti." # todo: CONCEPT CASE
 game_concept_life_expectancy: "Očekávaná délka života"
 game_concept_life_expectancy_desc: "Očekávaná délka života je počet let, po které se očekává, že postava bude žít, než zemře přirozenou smrtí.\n\nVysoká $game_concept_life_expectancy$ způsobí, že postavy budou viditelně stárnout pomaleji a budou moci déle plodit [Concept('children','děti')|El]." # todo: CONCEPT CASE
 game_concept_betrothal: "Zasnoubení"
 game_concept_betrothals: "Zasnoubení"
 game_concept_betrothed: "Zasnoubený"
 game_concept_betrothal_desc: "[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_betrothal_desc_TOTO_DLC', 'game_concept_betrothal_desc_NO_TOTO_DLC' )]"
 game_concept_betrothal_desc_NO_TOTO_DLC: "Zasnoubení je příslib budoucího [Concept('marriage','sňatku')|El], který lze uzavřít, pokud některá ze stran ještě není [Concept('adult','dospělá')|El].\n\nZasnoubení mohou poskytovat [Concept('alliances','spojenectví')|El] stejně jako sňatky, ale lze je snadno zrušit. Po dosažení dospělosti lze zasnoubení proměnit v řádný sňatek." # todo: CONCEPT CASE
 game_concept_betrothal_desc_TOTO_DLC: "Zasnoubení je příslib budoucího [Concept('marriage','sňatku')|El]. Lze je uzavřít, pokud některá ze stran ještě není [Concept('adult','dospělá')|El], nebo když je [GetActivityType( 'activity_wedding' ).GetName] [Concept('grand_wedding_promised','přislíbena jako velkolepá svatba')|El].\n\nZasnoubení mohou poskytovat [Concept('alliances','spojenectví')|El] stejně jako sňatky. Běžná zasnoubení mohou trvat tak dlouho, jak je třeba, a lze je snadno zrušit. Po dosažení dospělosti je lze proměnit v řádný sňatek, zatímco zasnoubení s velkolepou svatbou se promění ve sňatek dokončením [GetActivityType( 'activity_wedding' ).GetName]." # todo: CONCEPT CASE
 game_concept_marriage: "Sňatek"
 game_concept_marriages: "Sňatky"
 game_concept_marry: "Uzavřít sňatek"
 game_concept_marries: "Uzavírá sňatek"
 game_concept_married: "Sezdán"
 game_concept_marrying: "Uzavírání sňatku"
 game_concept_marriage_desc: "Sňatky jsou svazky mezi dvěma [Concept('spouses','chotěmi')|El] a jsou (spolu se [Concept('betrothals','zasnoubením')|El]) hlavním způsobem, jak uzavřít [Concept('alliance','alianci')|El] s jiným [Concept('ruler','vládcem')|El].\n\nChoti mohou také plodit [Concept('legitimate','legitimní')|El] děti, které lze [Concept('bred','vyšlechtit')|El] a vychovat jako vhodné [Concept('heirs','dědice')|El].\n\nSňatky končí pouze tehdy, když jedna $game_concept_spouse$ zemře nebo se s druhou [Concept('divorces','rozvede')|El].[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_marriage_desc_TOTO_DLC', '' )]" # todo: CONCEPT CASE
 game_concept_marriage_desc_TOTO_DLC: "\n\nUspořádání [GetActivityType( 'activity_wedding' ).GetName] výrazně zvyšuje přijetí návrhu sňatku."
 game_concept_concubinage: "Konkubinát"
 game_concept_concubine: "Konkubína"
 game_concept_concubines: "Konkubíny"
 game_concept_concubine_male: "Konkubín"
 game_concept_concubine_female: "Konkubína"
 game_concept_concubinage_desc: "Konkubína má nižší postavení než [Concept('spouse','choť')|El] a je povolena ve [Concept('faiths','vírech')|El] s [Concept('doctrine','doktrínou')|El] [GetFaithDoctrine('doctrine_concubines').GetBaseName].\n\nNa rozdíl od [Concept('marriage','sňatku')|El] konkubinát nepřináší [Concept('alliances','aliance')|El]. Konkubíny lze také libovolně odložit bez komplikací [Concept('divorce','rozvodu')|El]. Děti konkubín jsou považovány za [Concept('legitimate','legitimní')|El].\n\nKonkubinát se vzájemně vylučuje s [GetFaithDoctrine('doctrine_polygamy').GetBaseName]." # todo: CONCEPT CASE
 game_concept_bastard: "Levoboček"
 game_concept_bastards: "Levobočci"
 game_concept_bastard_desc: "$game_concept_bastards$ jsou nemanželské děti narozené mimo manželství. Jako takové jsou vyloučeny z dědění [Concept('titles','titulů')|E]. Jejich rodiče však mohou své dítě [Concept( 'legitimized', 'legitimizovat' )|E] se souhlasem své [Concept('house_head','hlavy rodu')|E].\n\nTo, ke kterému [Concept('house','rodu')|E] levoboček patří, určují [Concept('doctrines','doktríny')|E] [Concept('faiths','vír')|E] jeho rodičů v době jeho narození.\n\nPokud levobočci získají tituly nebo budou mít vlastní děti, založí novou [Concept('dynasty','dynastii')|E]."
 game_concept_legitimized_bastard: "Legitimizovaný levoboček"
 game_concept_legitimized: "Legitimizovaný"
 game_concept_legitimized_bastard_desc: "[bastard|E] může být legitimizován, buď při narození, nebo později jako [Concept('character_interaction','interakce s postavou')|E], podle souhlasu své [Concept('house_head','hlavy rodu')|E].\n\nLegitimizovaný levoboček má stejné dědické právo jako [Concept('legitimate','legitimní')|E] děti, ale poskvrna levobočství jej bude provázet po celý život."
 game_concept_bastardy: "Levobočství"
 game_concept_bastardy_desc: "$game_concept_bastard_desc$"
 game_concept_real_father: "Skutečný otec"
 game_concept_real_father_desc: "Skutečný otec postavy. U většiny postav je to ten, kdo je obecně uznáván jako jejich otec, ale u tajných levobočků je to někdo jiný."
 game_concept_legitimate: "Legitimní"
 game_concept_legitimate_desc: "Děti narozené [Concept('married','sezdaným')|E] rodičům jsou považovány za $game_concept_legitimate$, na rozdíl od [Concept('bastards','levobočků')|E], kteří nemohou dědit žádné [Concept('titles','tituly')|E]. Děti [Concept('concubines','konkubín')|E] jsou také považovány za [Concept('legitimate','legitimní')|E], i když mají o něco nižší postavení."
 game_concept_matrilineal: "Matrilineární"
 game_concept_matrilineally: "Matrilineárně"
 game_concept_matrilineal_desc: "V matrilineárním [Concept('marriage','sňatku')|El] se děti narodí do [Concept('house','rodu')|El] své matky místo rodu svého otce." # todo: CONCEPT CASE
 game_concept_patrilineal: "Patrilineární"
 game_concept_patrilineal_desc: "V patrilineárním [Concept('marriage','sňatku')|El] se děti narodí do [Concept('house','rodu')|El] svého otce." # todo: CONCEPT CASE
 game_concept_divorce: "Rozvod"
 game_concept_divorced: "Rozvedený"
 game_concept_divorcing: "Rozvádění"
 game_concept_divorces: "Rozvádí se"
 game_concept_divorce_desc: "[Concept('married','Sezdané')|E] [Concept('spouses','Choti')|El] si mohou sjednat $game_concept_divorce$, ačkoli pravidla, požadavky a důsledky závisejí na [Concept('doctrines','doktríny')|El] jejich [Concept('faiths','vír')|El].\n\n[Concept('concubines','Konkubíny')|E] lze jednoduše kdykoli odložit." # todo: CONCEPT CASE
 game_concept_stress: "Stres"
 game_concept_stress_i: "@stress_icon!"
 game_concept_stress_gain_i: "@stress_gain_icon!"
 game_concept_stress_loss_i: "@stress_loss_icon!"
 game_concept_stress_loss: "Úbytek stresu"
 game_concept_stress_critical_i: "@stress_critical_icon!"
 game_concept_stress_desc: "Postavy získávají stres, když podnikají kroky, které jsou v rozporu s jejich [Concept('personality_traits','osobnostními rysy')|El].\n\nPostavy, které získají dostatek stresu, také získají [Concept('stress_level','úroveň stresu')|El], což vyvolá různé záporné účinky na jejich duševní zdraví, které přetrvají, dokud se jim nepodaří stres snížit.\n\nPřímým způsobem, jak ulevit od stresu, je účast na [Concept('activities','aktivity')|El], například na [GetActivityType( 'activity_hunt' ).GetName]." # todo: CONCEPT CASE
 game_concept_adult: "Dospělý"
 game_concept_adults: "Dospělí"
 game_concept_adulthood: "Dospělost"
 game_concept_adult_desc: "Dospělý je postava stará alespoň #V 16#! let." # todo: CONCEPT CASE
 game_concept_child: "Dítě"
 game_concept_children: "Děti"
 game_concept_child_possessive: "Dítěte"
 game_concept_child_desc: "Dítě je postava mladší než #V 16#! let." # todo: CONCEPT CASE
 game_concept_eligible_child: "Způsobilé dítě"
 game_concept_eligible_children: "Způsobilé děti"
 game_concept_eligible_child_desc: "Způsobilé děti mohou podle zákona dědit [Concept('titles','tituly')|El] svých rodičů.\n\n[Concept('bastards','Bastardi')|E] se za způsobilé nepovažují, stejně jako děti určitých pohlaví podle konkrétních [Concept('gender_laws','zákonů o pohlaví')|El]." # todo: CONCEPT CASE
 game_concept_alliance: "Aliance"
 game_concept_alliances: "Aliance"
 game_concept_allies: "Spojenci"
 game_concept_allied: "Spojenecký"
 game_concept_ally: "Spojenec"
 game_concept_ally_i: "@alliance_icon!"
 game_concept_alliance_desc: "Aliance je diplomatický vztah mezi dvěma [Concept('rulers','vládci')|El]. [Concept('independent','Nezávislí')|E] vládci mohou povolat $game_concept_allies$, aby se připojili k jejich vzájemným [Concept('wars','válkami')|El].\n\nSpojenectví se vytvářejí a udržují prostřednictvím [Concept('marriage','sňatku')|El] nebo [Concept('betrothal','zasnoubení')|El], pokud jsou sezdané postavy dostatečně blízce příbuzné s oběma vládci. Například pokud [Concept('king','král')|El] provdá svou dceru za syna jiného krále, oba králové se stanou spojenci.\n\n[Concept('lieges','Lenní páni')|E] mohou také vytvářet $game_concept_alliances$ se svými [Concept('vassals','vazaly')|El]. Lenní pán nemůže povolat vazala do války, ale zabrání mu to vstoupit do [Concept('factions','frakcí')|El]." # todo: CONCEPT CASE
 game_concept_war: "Válka"
 game_concept_wars: "Války"
 game_concept_war_desc: "Ozbrojený konflikt je nejpřímočařejší způsob, jak rozšířit své [Concept('realm','panství')|El]. Vyhlášení $game_concept_war$ však vyžaduje odůvodnění zvané [Concept('casus_belli','casus belli')|El]. Ve válce nemůžeš dosáhnout více, než dovoluje zvolený casus belli.\n\nVálky se vyhrávají porážením nepřátelských [Concept('armies','armádami')|El] v [Concept('battle','bitvě')|El] a [Concept('occupying','obsazováním')|El] nepřátelských [Concept('holdings','držav')|El]. Tím se získává [Concept('war_score','válečným skórem')|El], které nakonec donutí nepřítele přijmout [Concept('defeat','porážku')|El] v rámci [Concept('peace_offer','mírové nabídky')|El].\n\nBez ohledu na výsledek $game_concept_war$ získá útočník vůči obránci na určitou dobu [Concept('truce','příměří')|El], obránce však může okamžitě vyhlásit novou válku." # todo: CONCEPT CASE
 game_concept_civil_war: "Občanská válka"
 game_concept_civil_wars: "Občanské války"
 game_concept_raid: "Nájezd"
 game_concept_raids: "Nájezdy"
 game_concept_raiding: "Plenění"
 game_concept_raider: "Nájezdník"
 game_concept_raiders: "Nájezdníci"
 game_concept_raided: "Vypleněno"
 game_concept_raid_desc: "[Concept('armies','Armády')|E] lze ze [Concept('rally_points','shromaždiště')|El] povolat jako $game_concept_raiders$. Nájezdníci mohou vpadnout do sousedních zemí a plenit je za [Concept('gold','zlato')|El].\n\nAby bylo možné provést $game_concept_raid$, musí se nájezdnická armáda zastavit v [Concept('holding','državě')|El] vlastněné cizím [Concept('ruler','vládci')|El] a zvolit zahájení plenění — tím se na nějaký čas uváže k plenění, po jehož skončení získá zlato a vyplení državu.\n\nZlato bude uloženo u armády a do pokladnice se přidá až po jejím návratu domů. Pokud porazíš nájezdnickou armádu nesoucí zlato, vezmeš si je a ona proti tobě po určitou dobu nebude moci podnikat nájezdy.\n\nNájezd smějí provádět pouze někteří vládci, zejména [Concept('tribal','kmenoví')|El] vládci a vládci typu [GetGovernment( 'nomad_government' ).GetName].\n\nLze nastavit konkrétní [Concept('raid_intents','záměry nájezdu')|El] a získat tak různé odměny." # todo: CONCEPT CASE
 game_concept_raid_i: "@raid_icon!"
 game_concept_loot: "Kořist"
 game_concept_loot_desc: "Pokud je [Concept('holding','država')|El] [Concept( 'raid', 'vypleněna' )|El], [Concept('occupied','obsazena')|El] při [Concept('siege','obléhání')|El] nebo zapojena do [Concept('bartering','směny')|El], útočník nebo [Concept('barterer','směňující')|El] získá množství [Concept('gold','zlata')|El] odpovídající $game_concept_loot$. Čím je [Concept('holding','država')|El] prosperující, tím více $game_concept_loot$ bude mít.\n\nDržava, která byla nedávno vypleněna, obléhána nebo zapojena do směny, nebude mít žádnou kořist."
 game_concept_loot_i: "@loot_icon!"
 game_concept_barter: "Směna"
 game_concept_barter_i: "@barter_icon!"
 game_concept_barter_desc: "[Concept('rulers','Vládci')|E] typu [GetGovernment( 'wanua_government' ).GetName] mohou povolat [Concept('barterers','směnné výpravy')|El], aby pokojnými prostředky získávali [Concept('gold','zlato')|El]. Směna funguje podobně jako [Concept('raiding','plenění')|El], ale s několika zásadními rozdíly — nejde o akci [Concept('hostile_army','nepřátelské armády')|El] a potřebuješ [Concept('barter_goods','směnné zboží')|El].\n\nK získání #V 1#! [Concept('loot','kořisti')|El] z [Concept('holding','državy')|El] potřebuješ #V 2#! jednotky směnného zboží. Pokud ho máš příliš málo, nestane se nic.\n\nSměna je přátelská akce a cílová država po jejím dokončení získá [GetModifier('recently_bartered_modifier').GetNameWithTooltip]. Na rozdíl od plenění můžeš volně směňovat v zemích svých [Concept('tributaries','tributářů')|El] i své [Concept('suzerain','suzerénní vrchnosti')|El]."
 game_concept_bartering: "Směňování"
 game_concept_bartered: "Směněno"
 game_concept_barterer: "Směnná výprava"
 game_concept_barterers: "Směnné výpravy"
 game_concept_barters: "Směňuje"
 game_concept_barterer_desc: "[Concept('rulers','Vládci')|E] typu [GetGovernment( 'wanua_government' ).GetName] mohou provádět [Concept('barter','směnu')|El] tím, že své [Concept('armies','armádu')|El] povolají jako $game_concept_barterers$. Fungují podobně jako [Concept('raiders','nájezdníci')|El], až na to, že vůči [Concept('holder','držiteli')|El] cílové [Concept('holding','državě')|El] nebudou [Concept('hostile_army','nepřátelskou armádou')|El].\n\nNájezdnické armády jiných vládců mohou se směnnými výpravami bojovat a ukrást jim [Concept('loot','kořisti')|El]." # todo: CONCEPT CASE
 game_concept_barter_goods: "Směnné zboží"
 game_concept_barter_goods_desc: "Směnné zboží — které představuje různé druhy ostrovních komodit, například sušené ryby nebo výrobky z [Glossary('ratanu', 'RATTAN_GLOSS')] — používají [Concept('rulers','vládci')|El] typu [GetGovernment( 'wanua_government' ).GetName] ke [Concept('barter','směně')|El] a k udržování [Concept('armies','armádám')|El].\n\nSměnné zboží vyrábí [GetBuilding('tribe_01').GetName] a další [Concept('buildings','budovy')|El]." # todo: CONCEPT CASE
 game_concept_barter_goods_i: "@barter_goods_icon!"
 game_concept_revolt: "Povstání"
 game_concept_revolts: "Povstání"
 game_concept_revolting: "Povstávající"
 game_concept_civil_war_desc: "[Concept('war','Válka')|E], v níž jeden nebo více [Concept('vassals','vazalů')|El] a/nebo [Concept('counties','hrabství')|El] povstane proti svému [Concept('liege','lennímu pánovi')|El]. Nejčastěji bývá důsledkem [Concept('faction','frakcemi')|El], jejíž požadavky nebyly splněny.\n\nProhra v občanské válce má často následky závažnější než původní požadavky vzbouřené frakce." # todo: CONCEPT CASE
 game_concept_casus_belli: "Casus belli"
 game_concept_casus_bellis: "Casus belli"
 game_concept_casus_belli_desc: "Casus belli („důvod k válce“) je zapotřebí k vyhlášení [Concept('war','válce')|El] jinému [Concept('ruler','vládci')|El].\n\nCasus belli určuje, o co se ve válce bojuje, obvykle o konkrétní území — [Concept('war_target','válečný cíl')|El]. Není možné získat nic nad rámec toho, co casus belli dovoluje, bez ohledu na to, jak drtivě bude nepřítel poražen.\n\nJedním z nejdůležitějších casus belli jsou [Concept('claims','nároky')|El], ať už pocházejí z [Concept('succession','nástupnictví')|El], nebo z úkolu [Concept('fabricate_claim','zfalšovat nárok')|El]." # todo: CONCEPT CASE
 game_concept_war_score: "Válečné skóre"
 game_concept_war_score_desc: "Míra toho, která strana v [Concept('war','válce')|El] vítězí. Pohybuje se od #N -100#! do #P 100#!, přičemž například #N -25#! pro jednu stranu znamená #P 25#! pro druhou. Při #P 100#! válečného skóre můžeš druhou stranu donutit přijmout svou [Concept('peace_offer','mírovou nabídku')|El].\n\nVálečné skóre lze získat:\n$EFFECT_LIST_BULLET$ porážením [Concept('armies','armádami')|El] v [Concept('battle','bitvě')|El]\n$EFFECT_LIST_BULLET$ [Concept('imprisoning','Uvěznění')|El] nepřátelských [Concept('ruler','vládci')|El] nebo jeho [Concept('heirs','dědiců')|El] (nepočítaje jeho [Concept('allies','spojenců')|El])\n$EFFECT_LIST_BULLET$ [Concept('occupying','Obsazování')|El] nepřátelských [Concept('holdings','držav')|El] (zejména v rámci [Concept('war_target','válečného cíle')|El])\n$EFFECT_LIST_BULLET$ obsazením nepřátelského [Concept('realm_capital','hlavního sídla panství')|El]\n$EFFECT_LIST_BULLET$ dlouhodobou kontrolou všech [Concept('objectives','cílů')|El]" # todo: CONCEPT CASE
 game_concept_war_target: "Válečný cíl"
 game_concept_war_targets: "Válečné cíle"
 game_concept_war_target_desc: "Oblast na mapě, na kterou se zaměřuje [Concept('casus_belli','casus belli')|El] v [Concept('war','válce')|El]. Pokud se casus belli nezaměřuje na konkrétní oblast, je $game_concept_war_target$ [Concept('realm_capital','hlavní sídlo panství')|El] obránce.\n\nÚtočící strana získává více [Concept('war_score','válečného skóre')|El] [Concept('occupying','obsazováním')|El] [Concept('holdings','držav')|El] v rámci válečného cíle. Naopak obránce začne — po počáteční ochranné lhůtě — získávat válečné skóre za udržení všech [Concept('counties','hrabství')|El] v oblasti $game_concept_war_target$." # todo: CONCEPT CASE
 game_concept_occupation: "Obsazení"
 game_concept_occupations: "Obsazení"
 game_concept_occupy: "Obsadit"
 game_concept_occupies: "Obsazuje"
 game_concept_occupying: "Obsazování"
 game_concept_occupied: "Obsazeno"
 game_concept_occupation_desc: "Obsazené [Concept('holdings','državy')|El] jsou během [Concept('war','války')|El] dočasně pod kontrolou nepřátelského [Concept('ruler','vládcem')|El]. [Concept('army','Armáda')|E] stojící v [Concept('barony','baronství')|El] s nepřátelskou [Concept('fortified_holding','opevněnou državou')|El] ji začne [Concept('besiege','obléhat')|El], pokud počet [Concept('soldiers','vojáků')|El] v armádě převyšuje [Concept('garrison','posádku')|El].\n\nPokud je obléhání úspěšné, država je obsazena, což obsazující straně v [Concept('war','válce')|El] poskytne [Concept('war_score','válečné skóre')|El].\n\nObsazení državy neznamená, že ti nyní patří! Skutečně změnit majitele může pouze území určené [Concept('war_target','válečným cílem')|El], a to jen pokud útočník [Concept('wins','zvítězí')|El]." # todo: CONCEPT CASE
 game_concept_peace: "Mír"
 game_concept_peace_offer: "Mírová nabídka"
 game_concept_peace_offers: "Mírové nabídky"
 game_concept_peace_desc: "[Concept('wars','Války')|E] mohou skončit třemi typy $game_concept_peace$: [Concept('victory','vítězstvím')|El], [Concept('defeat','porážkou')|El] nebo [Concept('white_peace','bílým mírem')|El].\n\nPři #V 100 %#! [Concept('war_score','válečném skóru')|El] nemůže druhá strana mírovou nabídku odmítnout a musí přijmout [Concept('defeat','porážku')|El].\n\nÚčinky $game_concept_victory$ nebo $game_concept_defeat$ zcela závisí na typu [Concept('casus_belli','casu belli')|El], který byl použit k vyhlášení války, a na s ním spojeném [Concept('war_target','válečným cílem')|El]." # todo: CONCEPT CASE
 game_concept_victory: "Vítězství"
 game_concept_win: "Vyhrát"
 game_concept_wins: "Vítězí"
 game_concept_winning: "Vítězení"
 game_concept_victory_desc: "Vítězství je jednou ze tří možných [Concept('peace_offers','mírových nabídek')|El]. Přesný výsledek vítězství v [Concept('war','válce')|El] závisí na [Concept('casus_belli','casus belli')|El].\n\nPro útočníka obvykle znamená zabrání [Concept('titles','titulů')|El] v oblasti [Concept('war_target','válečného cíle')|El].\n\nPro obránce vítězství obvykle znamená, že útočník musí zaplatit velkou částku zlata jako válečné reparace." # todo: CONCEPT CASE
 game_concept_defeat: "Porážka"
 game_concept_defeat_desc: "Porážka je jednou ze tří možných [Concept('peace_offers','mírových nabídek')|El]. Přesný výsledek porážky v [Concept('war','válce')|El] závisí na [Concept('casus_belli','casus belli')|El], ale poražení obránci obvykle ztratí [Concept('titles','tituly')|El] v oblasti [Concept('war_target','válečného cíle')|El], zatímco poražení útočníci místo toho ztrácejí věci jako [Concept('gold','zlato')|El], [Concept('prestige','prestiž')|El] a [Concept('piety','zbožnost')|El]." # todo: CONCEPT CASE
 game_concept_white_peace: "Bílý mír"
 game_concept_white_peace_desc: "Bílý mír je jednou ze tří možných [Concept('peace_offers','mírových nabídek')|El]. Někdy se obě strany shodnou, že ve [Concept('war','válce')|El] již nemá cenu pokračovat.\n\nPři bílém míru útočník obvykle stále ztratí část [Concept('piety','zbožnosti')|El] nebo [Concept('prestige','prestiže')|El], ale mnohem méně než při ponižující [Concept('defeat','porážce')|El]." # todo: CONCEPT CASE
 game_concept_siege: "Obléhání"
 game_concept_sieges: "Obléhání"
 game_concept_besiege: "Obléhat"
 game_concept_besieging: "Obléhání"
 game_concept_besieged: "Obléháno"
 game_concept_siege_desc: "Obléhání nastává, když [Concept('army','armáda')|El] obklíčí [Concept('fortified_holding','opevněnou državu')|El], aby obyvatele vyhladověla k podrobení a mohla být [Concept('occupied','obsazena')|El]. Obléhání začne automaticky, jakmile armáda vstoupí na místo nepřátelské opevněné državy a zastaví se — pokud počet vojáků v armádě převyšuje [Concept('garrison','posádku')|El].\n\nObléhající armáda může provést [Concept('assault','zteč')|El] proti državě, pokud jsou její hradby prolomeny."
 game_concept_assault: "Zteč"
 game_concept_assaults: "Zteče"
 game_concept_assaulting: "Útok ztečí"
 game_concept_assaulted: "Napadeno ztečí"
 game_concept_assault_desc: "Zteč nastává, když se [Concept('besieging','obléhající')|El] [Concept('army','armádou')|El] pokusí ztečí dobýt [Concept('fortified_holding','opevněnou državu')|El] za cenu rizika ztráty mnoha [Concept('soldiers','vojákům')|El]. Zteč lze provést pouze tehdy, pokud jsou hradby državy prolomeny, což vyžaduje, aby armáda obsahovala [Concept('siege_weapons','obléhací stroje')|El]." # todo: CONCEPT CASE
 game_concept_fort_level: "Úroveň opevnění"
 game_concept_fort_level_i: "@fort_icon!"
 game_concept_fort_level_desc: "Některé [Concept('holdings','državy')|El] jsou opevněné a je třeba je [Concept('besieged','oblehnout')|El] a [Concept('occupied','obsadit')|El], aby bylo možné získat kontrolu nad [Concept('county','hrabstvím')|El].\n\nÚroveň opevnění takových [Concept('fortified_holdings','opevněných držav')|El] určuje, jak dlouho lze očekávat, že obléhání potrvá.\n\nVysoká $game_concept_fort_level$ bude vyžadovat [Concept('siege_weapons','obléhací stroje')|El], aby bylo možné državu účinně $game_concept_besieged$, ačkoli každý obléhací stroj je účinný jen do určité úrovně opevnění.\n\nZvyšování úrovně opevnění neopevněné državy nemá žádný účinek." # todo: CONCEPT CASE
 game_concept_garrison: "Posádka"
 game_concept_garrison_desc: "Posádka [Concept('fortified_holding','Opevněná država')|El] ji chrání před [Concept('besieged','obležením')|El] menšími [Concept('armies','armádami')|El].\n\nObléhající armáda musí mít více [Concept('soldiers','vojáků')|El] než posádka, aby obléhání postupovalo.\n\nKdyž je [Concept('siege','obléhání')|El] prohráno, $game_concept_garrison$ se nastaví na [GetDefine('NDomain', 'HOLDING_MIN_GARRISON_COUNT')|0]. Od této hodnoty se posádkou každý měsíc doplňuje podle [Concept('garrison_reinforcement','míry doplňování posádky')|El], dokud nedosáhne své maximální kapacity.\n\nKdyž začne [Concept('siege','obléhání')|El], obsazení $game_concept_garrison$ ovlivňuje požadované množství [Concept('siege_progress','postupu obléhání')|El]." # todo: CONCEPT CASE
 game_concept_garrison_reinforcement: "Míra doplňování posádky"
 game_concept_garrison_reinforcement_desc: "Míra doplňování posádky [Concept('fortified_holding','Opevněná država')|El] určuje, jak rychle se [Concept('garrison','posádkou')|El] zotavuje po prohraném [Concept('siege','obléhání')|El].\n\nKaždý měsíc [Concept('garrison','posádku')|El] obnoví procento své maximální kapacity odpovídající aktuální míře. Tu lze zvýšit vylepšením [Concept('holding','državou')|El].\n\nBěhem [Concept('siege','obléhání')|El] je však doplňování zastaveno a míra nastavena na 0." # todo: CONCEPT CASE
 game_concept_fortified_holding: "Opevněná država"
 game_concept_fortified_holdings: "Opevněné državy"
 game_concept_fortified_holding_desc: "Opevněná država je [Concept('holding','država')|El] s [Concept('buildings','budovami')|El], které zvyšují její [Concept('fort_level','úrovní opevnění')|El]. [Concept('county_capitals','Hlavní sídla hrabství')|E] jsou opevněná vždy.\n\nAby bylo možné plně [Concept('occupy','obsadit')|El] [Concept('county','hrabství')|El], musí být obsazeny všechny jeho opevněné državy." # todo: CONCEPT CASE
 game_concept_army: "Armáda"
 game_concept_armies: "Armády"
 game_concept_army_desc: "Armády slouží k vyhrávání [Concept('wars','válek')|El] tím, že se pouštějí do [Concept('battle','bitvy')|El] s jinými armádami, a k [Concept('besiege','obléhání')|El] a [Concept('occupy','obsazování')|El] nepřátelských [Concept('fortified_holdings','opevněných držav')|El]. Armády se povolávají na [Concept('rally_points','shromaždiště')|El] a tvoří je především [Concept('levies','odvedenci')|El] a [Concept('men_at_arms','ozbrojenci')|El], ale mohou je posílit také [Concept('mercenaries','žoldnéři')|El] a [Concept('holy_orders','svaté řády')|El].\n\nArmády se mohou přesouvat přes vodu utracením určitého množství [Concept('gold','zlata')|El] za zajištění přepravy. Mohou utrpět ztráty kvůli [Concept('attrition','opotřebení')|El], pokud je místní [Concept('barony','baronství')|El] nedokáže dostatečně [Concept('supply','zásobovat')|El]." # todo: CONCEPT CASE
 game_concept_holy_order: "Svatý řád"
 game_concept_holy_orders: "Svaté řády"
 game_concept_holy_order_i: "@government_type_holy_order!"
 game_concept_holy_order_desc: "Svaté řády jsou nezávislé vojenské organizace, které usilují o obranu a rozšíření vlivu své [Concept('faith','víry')|El].\n\nVládci jejich víry si je mohou najmout, pokud jsou ve [Concept('war','válce')|El] s [Concept('faith_hostile','nepřátelskou')|L] nebo [Concept('faith_evil','ďábelskou')|L] [Concept('faith','vírou')|El], za cenu [Concept('piety','zbožnost')|El]. Jakmile tato válka skončí, přestanou za daného vládce bojovat.\n\nSvatý řád může mít [Concept('holy_order_patron','patrona svatého řádu')|El], který za využití jeho služeb nemusí platit." # todo: CONCEPT CASE
 game_concept_holy_order_patron: "Patron svatého řádu"
 game_concept_holy_order_patron_desc: "Patron svatého řádu [Concept('holy_order','Svatý řád')|El] je král nebo císař, který sdílí jeho [Concept('faith','víry')|El] a jehož [Concept('realm','panství')|El] obsahuje jeho hlavní sídlo.\n\nPatron svatého řádu může zdarma povolat podporu svatý řád proti náboženským nepřátelům, místo aby platil [Concept('piety','zbožností')|El].\n\nNe všechny svaté řády mají $game_concept_holy_order_patron$." # todo: CONCEPT CASE
 game_concept_mercenary_company: "Žoldnéřská družina"
 game_concept_mercenaries: "Žoldnéři"
 game_concept_mercenary: "Žoldnéř"
 game_concept_mercenary_i: "@government_type_mercenary!"
 game_concept_mercenary_company_desc: "[Concept('mercenaries','Žoldnéři')|E] jsou najatí [Concept('soldiers','vojáci')|El], kteří bojují výměnou za [Concept('gold','zlato')|El]. Žoldnéřské [Concept('armies','armádu')|El] mají různou velikost, různé typy [Concept('men_at_arms','ozbrojenců')|El] a určitý počet [Concept('knights','rytířů')|El].\n\nŽoldnéři uzavírají smlouvy na #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] měsíců#!, které lze prodloužit o dalších #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] měsíců#!, pokud jsi stále ve [Concept('war','válce')|El]. Žoldnéřské smlouvy trvají i tehdy, když jsou jejich pluky rozpuštěny — lze je znovu povolat bez dalších nákladů.\n\nSmíš se zadlužit, abys mohl najmout žoldnéře #weak (až do [GetDefine('NMercenary', 'ALLOWED_DEBT_MONTHS')] měsíců)#!." # todo: CONCEPT CASE
 game_concept_mercenary_contract: "Žoldnéřská smlouva"
 game_concept_mercenary_contracts: "Žoldnéřské smlouvy"
 game_concept_mercenary_contract_desc: "Uzavření [Concept('mercenary','žoldnéřské')|El] smlouvy vyžaduje jednorázový náklad, který umožní využívat jejich vojsko po dobu #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] měsíců#!."
 game_concept_hired_troops: "Najmuté vojsko"
 game_concept_hired_troops_desc: "Najmuté vojsko tvoří buď [Concept('mercenaries','žoldnéři')|El], nebo [Concept('holy_orders','svaté řády')|El]."
 game_concept_commander: "Velitel"
 game_concept_commanders: "Velitelé"
 game_concept_army_commanders: "Velitelé armád"
 game_concept_commanding: "Velení"
 game_concept_army_commander: "Velitel armády"
 game_concept_army_commander_desc: "Velitel armády je postava velící [Concept('army','armádě')|El]. Kdokoli z tvých [Concept('courtiers','dvořanů')|El] nebo přímých [Concept('vassals','vazalů')|El] může být potenciálně jmenován velitelem (s ohledem na věk, [Concept('health','zdraví')|El] a [Concept('doctrines','doktríny')|El]).\n\nV [Concept('battle','bitvě')|El] má [Concept('martial_skill','válečnické dovednosti')|El] velitele velký vliv na [Concept('advantage','výhodu')|El]. Dokud je přítomen velitel, budou prováděny dodatečné [Concept('rolls','hody')|El] ve snaze zvýšit $game_concept_advantage$.\n\nKromě toho mohou [Concept('commander_traits','velitelské rysy')|El] armádě poskytovat mnoho různých výhod, a to v bitvě i mimo ni." # todo: CONCEPT CASE
 game_concept_commander_trait: "Velitelský rys"
 game_concept_commander_traits: "Velitelské rysy"
 game_concept_commander_trait_desc: "Velitelské rysy jsou zvláštní [Concept('traits','rysy')|El], které postavám poskytují užitečné výhody, když působí jako [Concept('commanders','velitelé')|El] [Concept('army','armády')|El].\n\nVelitelské rysy obvykle získávají děti vychovávané s válečnickým [Concept('education_focus','zaměřením vzdělání')|El], ale lze je získat také prostřednictvím [Concept('martial_lifestyle','válečnického životního stylu')|El] a dalšími způsoby." # todo: CONCEPT CASE
 game_concept_battle_advantage: "Bitevní výhoda"
 game_concept_advantage: "Výhoda"
 game_concept_battle_advantage_desc: "Bitevní výhoda způsobuje, že jedna strana v [Concept('battle','bitvě')|El] působí větší poškození. Čím vyšší je $game_concept_advantage$, tím větší poškození budou [Concept('soldiers','vojáci')|El] působit.\n\nBitvy často začínají s vyšší výhodou na jedné straně podle [Concept('terrain','terénu')|El] a [Concept('martial_skill','válečnické dovednosti')|El] a [Concept('commander_traits','velitelských rysů')|El] daného [Concept('commander','velitele')|El]. Každá strana pak může získat další $game_concept_advantage$ z [Concept('rolls','hodů')|El] velitele." # todo: CONCEPT CASE
 game_concept_education_trait: "Rys vzdělání"
 game_concept_education_traits: "Rysy vzdělání"
 game_concept_education_trait_desc: "Po dosažení [Concept('adulthood','dospělosti')|El] obdrží každá postava $game_concept_education_trait$.\n\nExistuje pět typů rysů vzdělání, z nichž každý přímo odpovídá určité [Concept('skill','dovednost')|El].\n\nKvalita [Concept('trait','rysu')|El], který postava obdrží, závisí na tom, jak dobře její [Concept('childhood_trait','dětský rys')|El] odpovídal [Concept('education_focus','zaměření vzdělání')|El], a také na příslušné dovednosti jejího [Concept('guardian','poručníka')|El].\n\nRys vzdělání postavy zlepšuje rychlost jejího postupu v odpovídajícím [Concept('lifestyle','životním stylu')|El]." # todo: CONCEPT CASE
 game_concept_education_focus: "Zaměření vzdělání"
 game_concept_education: "Vzdělání"
 game_concept_educations: "Vzdělání"
 game_concept_educate: "Vzdělávat"
 game_concept_educated: "Vzdělaný"
 game_concept_education_focus_short: "Zaměření"
 game_concept_education_focus_desc: "Všem [Concept('children','dětem')|El] ve věku od #V 6#! do #V 9#! lze vybrat $game_concept_education_focus$ zaměřené na jednu z pěti [Concept('skills','dovednostmi')|El].\n\nVzdělání po dosažení [Concept('adulthood','dospělosti')|El] končí získáním [Concept('education_trait','ryse vzdělání')|El].\n\nKvalita $game_concept_education_trait$, který obdrží, závisí na tom, jak dobře jejich [Concept('childhood_trait','dětský rys')|El] odpovídal jejich zaměření vzdělání, a také na příslušné dovednosti jejich [Concept('guardian','poručníka')|El].\n\nPři nastavování zaměření vzdělání můžeš také určit, zda má být dítě vychováváno ve [Concept('faith','víře')|El] a/nebo [Concept('culture','kultuře')|El] svého [Concept('guardian','poručníka')|El]." # todo: CONCEPT CASE
 game_concept_childhood_trait: "Dětský rys"
 game_concept_childhood_trait_desc: "Každé dítě během dospívání získá dětský rys, například [GetTrait('rowdy').GetName( GetNullCharacter )] nebo [GetTrait('charming').GetName( GetNullCharacter )].\n\nZískaný rys naznačuje, které [Concept('education_focus','zaměření vzdělání')|El] by mu nejlépe vyhovovalo."
 game_concept_diplomacy: "Diplomacie"
 game_concept_diplomacy_i: "@skill_diplomacy_icon!"
 game_concept_diplomacy_skill: "Diplomatická dovednost"
 game_concept_diplomacy_skill_desc: "Diplomacie je [Concept('skill','dovednost')|El] představující schopnost postavy okouzlovat, vyjednávat a přesvědčovat.\n\nDiplomacie přímo ovlivňuje [Concept('opinions','mínění')|El], které o tobě mají jiné postavy. Používá se také k rozvíjení diplomatických [Concept('schemes','intrikám')|El].\n\nOdpovídajícím [Concept('lifestyle','životnímu stylu')|El] je [Concept('diplomacy_lifestyle','diplomatický životní styl')|El]." # todo: CONCEPT CASE
 game_concept_martial: "Válečnictví"
 game_concept_martial_i: "@skill_martial_icon!"
 game_concept_martial_skill: "Válečnická dovednost"
 game_concept_martial_skill_desc: "Válečnictví jako [Concept('skill','dovednost')|El] ukazuje, jak dobrá je postava ve vedení [Concept('war','válce')|El] a velení [Concept('armies','armádám')|El] v [Concept('battle','bitvě')|El].\n\nVysoká válečnická dovednost je důležitá pro [Concept('army_commanders','velitele armád')|El], protože zlepšuje jejich [Concept('advantage','výhodu')|El] v [Concept('battle','bitvě')|El].\n\nOdpovídajícím [Concept('lifestyle','životním stylu')|El] je [Concept('martial_lifestyle','válečnický životní styl')|El]." # todo: CONCEPT CASE
 game_concept_stewardship: "Správcovství"
 game_concept_stewardship_i: "@skill_stewardship_icon!"
 game_concept_stewardship_skill: "Správcovská dovednost"
 game_concept_stewardship_skill_desc: "Správcovství je [Concept('skill','dovednost')|El], která pomáhá [Concept('rulers','vládcům')|El] spravovat jejich [Concept('domains','domény')|El]. Přímo zvyšuje [Concept('taxation','zdanění')|El], což z ní činí velmi užitečnou dovednost pro všechny vládce.\n\nOdpovídajícím [Concept('lifestyle','životnímu stylu')|El] je [Concept('stewardship_lifestyle','správcovský životní styl')|El]." # todo: CONCEPT CASE
 game_concept_intrigue: "Pletichářství"
 game_concept_intrigue_i: "@skill_intrigue_icon!"
 game_concept_intrigue_skill: "Pletichářská dovednost"
 game_concept_intrigue_skill_desc: "Pletichářství je [Concept('skill','dovednost')|El] představující schopnost postavy chápat a ovlivňovat jiné postavy a organizovat propracovaná spiknutí.\n\nPoužívá se hlavně k rozvíjení pletichářských [Concept('schemes','intrikám')|El] — a k obraně proti nim.\n\nOdpovídajícím [Concept('lifestyle','životnímu stylu')|El] je [Concept('intrigue_lifestyle','pletichářský životní styl')|El]." # todo: CONCEPT CASE
 game_concept_learning: "Učenost"
 game_concept_learning_i: "@skill_learning_icon!"
 game_concept_learning_skill: "Učenost"
 game_concept_learning_skill_desc: "Učenost je [Concept('skill','dovednost')|El] měřící gramotnost a moudrost postavy. Učenost [Concept('ruler','vládce')|El] ovlivňuje náklady na zvýšení [Concept('crown_authority','korunní autoritu')|El] a také poskytuje určité množství měsíční [Concept('piety','zbožnosti')|El].\n\nOd postav s vysokou učeností lze očekávat rozsáhlé znalosti všech běžných učených oborů, včetně teologie, filozofie, jazyka a matematiky.\n\nOdpovídajícím [Concept('lifestyle','životnímu stylu')|El] je [Concept('learning_lifestyle','učený životní styl')|El]." # todo: CONCEPT CASE
 PROWESS_MUSCLE_INFO: "Zvyšování udatnosti přirozenými zdroji #weak (nikoli prostřednictvím [Concept('artifacts','artefaktů')|El])#! zvýší svalovou hmotu postavy."
 PROWESS_MUSCLE_INFO_PERSONAL: "Zvyšování [Concept('prowess','udatnosti')|El] zvýší tvou svalovou hmotu"
 game_concept_prowess: "Udatnost"
 game_concept_prowess_i: "@skill_prowess_icon!"
 game_concept_prowess_skill: "Udatnost"
 game_concept_prowess_skill_desc: "Udatnost je [Concept('skill','dovednost')|El], která odráží způsobilost postavy v osobním boji.\n\nVysoká udatnost znamená, že postava má větší šanci přežít a dobře si vést jako [Concept('knights','rytíř')|El] v [Concept('battles','bitvách')|El] i v [Concept('single_combat_duel_plural','duelech')|El].\n\nKaždý bod udatnosti dává rytíři:\n$BULLET_WITH_TAB$[Concept('damage','Poškození')|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[Concept('toughness','Houževnatost')|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$" # todo: CONCEPT CASE
 game_concept_natural_prowess: "Přirozená udatnost"
 game_concept_lifestyle: "Životní styl"
 game_concept_lifestyles: "Životní styly"
 game_concept_lifestyle_desc: "[Concept('adult','Dospělý')|E] [Concept('rulers','vládci')|El] si mohou zvolit $game_concept_lifestyle$, který jim následně umožní vybrat [Concept('focus','zaměření')|El] a začít získávat [Concept('perks','talenty')|El].\n\nKaždý $game_concept_lifestyle$ má svůj vlastní typ [Concept('experience','zkušeností')|El], který se používá k nákupu talentům. Například zkušenosti v [Concept('intrigue_lifestyle','pletichářském životním stylu')|El] jsou nezbytné k získání talentům, jako jsou [GetPerk( 'dreadful_perk' ).GetName( GetNullCharacter )] nebo [GetPerk( 'like_weed_in_a_garden_perk' ).GetName( GetNullCharacter )].\n\nŽivotní styly jsou:\n$BULLET_WITH_TAB$ [Concept('diplomacy_lifestyle','Diplomatický životní styl')|E]\n$BULLET_WITH_TAB$ [Concept('stewardship_lifestyle','Správcovský životní styl')|E]\n$BULLET_WITH_TAB$ [Concept('martial_lifestyle','Válečnický životní styl')|E]\n$BULLET_WITH_TAB$ [Concept('intrigue_lifestyle','Pletichářský životní styl')|E]\n$BULLET_WITH_TAB$ [Concept('learning_lifestyle','Učený životní styl')|E]\n$BULLET_WITH_TAB$ [Concept('wanderer_lifestyle','Potulný životní styl')|E]" # todo: CONCEPT CASE
 game_concept_lifestyle_experience: "Zkušenosti životního stylu"
 game_concept_experience: "Zkušenosti"
 game_concept_lifestyle_experience_desc: "Zkušenosti životního stylu se pasivně hromadí díky vybranému [Concept('focus','zaměření')|El] nebo je poskytují události. Existují různé typy $game_concept_lifestyle_experience$, jeden pro každou kategorii [Concept('lifestyle','životní styl')|El].\n\nZískání dostatečného množství $game_concept_lifestyle_experience$ v rámci kategorie udělí [Concept('perk','talent')|El]." # todo: CONCEPT CASE
 game_concept_focus: "Zaměření"
 game_concept_focuses: "Zaměření"
 game_concept_focus_desc: "Každý [Concept('lifestyle','životní styl')|El] obsahuje několik zaměření, z nichž jedno musí být zvoleno při výběru životnímu stylu.\n\nZaměření poskytují pasivní bonusy a ovlivňují typy událostí, které se objevují. #weak (Např. $intrigue_temptation_focus$ zvýší [Concept('fertility','plodnost')|El] a zvýší šanci, že se objeví události s tématem svádění.)#!\n\nPostavy mohou přepínat mezi zaměřením v rámci téhož životního stylu, aniž by ztratily schopnost získávat zkušenosti v tomto životním stylu." # todo: CONCEPT CASE
 game_concept_dynasty_perk: "Dynastický odkaz"
 game_concept_dynasty_perks: "Dynastické odkazy"
 game_concept_dynasty_perk_desc: "Dynastické odkazy jsou odemykatelné bonusy poskytující mocné účinky všem členům [Concept('dynasty','dynastii')|El].\n\n[Concept('dynast','Hlava dynastie')|E] odemyká $game_concept_dynasty_perks$ utrácením [Concept('dynasty_prestige','věhlasem')|El], přičemž každý odkaz ve stejné větvi je postupně dražší a mocnější.\n\nDynastické odkazy se získávají pomalu, ale zůstávají dynastii navždy." # todo: CONCEPT CASE
 game_concept_perk: "Talent"
 game_concept_perks: "Talenty"
 game_concept_perk_desc: "Talenty jsou odemykatelné bonusy, která poskytují mnoho užitečných a zajímavých účinků. Odemykají se výběrem [Concept('focus','zaměřením')|El] v rámci [Concept('lifestyle','životního stylu')|El] a utracením související formy [Concept('experience','zkušeností')|El] #weak (např. pletichářských zkušeností, pokud chceš odemknout $game_concept_perk$ z pletichářského životního stylu.)#!" # todo: CONCEPT CASE
 game_concept_decision: "Rozhodnutí"
 game_concept_decisions: "Rozhodnutí"
 game_concept_decide: "Rozhodnout"
 game_concept_decision_desc: "Rozhodnutí je zvláštní akce, kterou může [Concept('character','postava')|El] provést podle svého uvážení.\n\nKaždé rozhodnutí má vlastní stanovené účinky, které mohou sahat od drobných změn postavy až po dopady otřásající [Concept('empire','říší')|El].\n\nRozhodnutí, která přesouvají postavu na určité místo po určitou dobu, se nazývají [Concept('activities','aktivitami')|El]." # todo: CONCEPT CASE
 game_concept_activity: "Aktivita"
 game_concept_activities: "Aktivity"
 game_concept_activity_desc: "Aktivita je zvláštní příležitost pořádaná za určitým účelem, například vydání se na [GetActivityType( 'activity_hunt' ).GetName] za účelem snížení [Concept('stress','stresu')|El].\n\n[Concept('activity_host_short','Pořadatel')|E] pořádá aktivitu na určitém [Concept('location','místě')|El], které ji různými způsoby ovlivňuje, a každý účastník tam musí [Concept('travel','cestovat')|El].\n\nKaždá zúčastněná postava vzájemně působí s ostatními tak, že si zvolí [Concept('intent','záměr')|El], který se během aktivity snaží naplnit.[SelectLocalization( HasDlcFeature( 'advanced_activities' ), 'game_concept_activity_desc_GRAND_ACTIVITY_DLC', '' )]" # todo: CONCEPT CASE
 game_concept_activity_desc_GRAND_ACTIVITY_DLC: "\n\nBěžná $game_concept_activity$, například [GetActivityType( 'activity_feast' ).GetName] nebo [GetActivityType( 'activity_hunt' ).GetName], je menší a méně působivá než [Concept('grand_activities','velkolepé aktivity')|El]."
 game_concept_activity_option: "Možnost aktivity"
 game_concept_activity_options: "Možnosti aktivity"
 game_concept_activity_option_desc: "Všechny [Concept('activities','aktivity')|El] mají možnosti, které ti dovolují přizpůsobit plánování aktivity. Možnosti mají různé náklady a požadavky."
 game_concept_activity_type: "Typ aktivity"
 game_concept_activity_types: "Typy aktivit"
 game_concept_activity_type_desc: "Některé [Concept('activities','aktivity')|El] a [Concept('grand_activities','velkolepé aktivity')|El] mají různé typy odpovídající zvláštním variantám aktivity.\n\nNapříklad při plánování lovu si můžeš zvolit mezi standardním, sokolnickým a legendárním typem, pokud splňuješ požadavky daného typu."
 game_concept_activity_phase: "Fáze aktivity"
 game_concept_activity_phases: "Fáze aktivity"
 game_concept_activity_phase_desc: "Akční fáze aktivity, například [Concept('contest','soutěž')|El] při [GetActivityType( 'activity_tournament' ).GetName], [Concept('stop','zastávce')|El] na [Concept('tour','cestě')|El] nebo cíl [Concept('pilgrimage','pouti')|El], během níž dochází k událostem." # todo: CONCEPT CASE
 game_concept_activity_phase_action: "Akce fáze aktivity"
 game_concept_activity_phase_action_desc: "Každých #V 7#! dní během [Concept('activity','aktivity')|El] existuje šance, že se mimo běžné události stane #EMP něco#!. Tyto příhody se zobrazují v pravém horním rohu okna aktivity.\n\nCo se může stát, závisí na [Concept('activity_type','typ aktivity')|El]; například [Concept('activity_host','pořadatel aktivity')|El] může při [GetActivityType('activity_feast').GetName] získat [Concept('prestige','prestiž')|El] nebo [Concept('opinion','mínění')|El] [Concept('activity_guest','hosta aktivity')|El].\n\nVždy existuje šance, že se nestane nic; to je obzvlášť pravděpodobné předtím, než je současná [Concept('activity_phase','fáze aktivity')|El] [Concept('activity_state_active','aktivní')|El]." # todo: CONCEPT CASE
 game_concept_activity_state_passive: "Pasivní"
 game_concept_activity_state_passive_desc: "[Concept('activity','Aktivita')|E] je v pasivní fázi, když pořadatel nebo hosté ještě všichni nedorazili, případně když jsou během [Concept('tour','cesty')|El] mezi jednou [Concept('stop','zastávkou')|El] a další."
 game_concept_activity_state_active: "Aktivní"
 game_concept_activity_state_active_desc: "Jakmile pořadatel a hosté dorazili a účastní se [Concept('activity','aktivitou')|El], považuje se za aktivní." # todo: CONCEPT CASE
 game_concept_activity_host: "Pořadatel aktivity"
 game_concept_activity_host_possessive: "Pořadatele aktivity"
 game_concept_activity_host_short: "Pořadatel"
 game_concept_activity_host_desc: "Pořadatel [Concept('activity','aktivity')|El] je [Concept('ruler','vládce')|El], který ji zahájil.\n\nVybírá [Concept('activity_type','typ aktivity')|El], [Concept('location','místo')|El], [Concept('activity_options','možnosti aktivity')|El] a určuje, které [Concept('activity_guests_short','hosty')|El] pozve."
 game_concept_activity_guest: "Host aktivity"
 game_concept_activity_guest_short: "Host"
 game_concept_activity_guests: "Hosté aktivity"
 game_concept_activity_guests_short: "Hosté"
 game_concept_activity_attending: "Účastní se"
 game_concept_activity_guest_desc: "Host na [Concept('activity','aktivitu')|El] je jakákoli [Concept('character','postava')|El] pozvaná [Concept('activity_host','pořadatelem aktivity')|El].\n\nAčkoli obvykle nemůže aktivitu ovlivnit tolik jako její pořadatel, stále může sledovat svůj [Concept('intent','záměr')|El]." # todo: CONCEPT CASE
 game_concept_intent: "Záměr"
 game_concept_intents: "Záměry"
 game_concept_intent_desc: "Záměr představuje, čeho se postava osobně snaží dosáhnout při [Concept('activity','aktivitě')|El]; pořadatel i hosté mají každý vlastní pohnutky a cíle." # todo: CONCEPT CASE
 game_concept_location: "Poloha"
 game_concept_locations: "Polohy"
 game_concept_location_desc: "Každá [Concept('character','postava')|El] má místo určující, kde se ve světě právě nachází. Chceš-li se dostat z jednoho místa na jiné, musíš [Concept('travel','cestovat')|El]."
 game_concept_feast: "$activity_feast$"
 game_concept_feast_desc: "[Concept('activity','Aktivita')|E], při níž se vládci a dvořané v panství scházejí, aby oslavili... to či ono.\n\nÚčastníci ztratí [Concept('stress','stres')|El] a zvýší své [Concept('opinion','mínění')|El] o pořadateli. Shromáždění takového množství lidí může mít i libovolný počet dalších následků.\n\n[Concept('ruler','Vládce')|E] pozve na $activity_feast$ svého [Concept('liege','lenního pána')|El] a své [Concept('vassals','vazaly')|El] spolu s různými [Concept('courtiers','dvořany')|El]."
 game_concept_hunt_success_chance: "Šance na úspěch lovu"
 game_concept_hunt_success_chance_no_prefix: "Šance na úspěch"
 game_concept_hunt_success_chance_desc: "Když se vydáš na [GetActivityType('activity_hunt').GetName], není zaručeno, že svou kořist zaženeš do kouta. Hlavními faktory jsou:\n$BULLET_WITH_TAB$[Concept('trait_level_track_xp','Zkušenosti rysu')|E] [GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] \n$BULLET_WITH_TAB$[Concept('aptitude','Způsobilost')|E] [GetCourtPositionType('master_of_hunt_court_position').GetName()]\n$BULLET_WITH_TAB$[Concept('buildings','Budovy')|El], [Concept('terrain','terén')|El] a [Concept('development','rozvoj')|El]\n$BULLET_WITH_TAB$[Concept('hunt_sightings_no_prefix','Spatření')|El] zvířat\n\nŠance na úspěch lovu nikdy nemůže být vyšší než #V 80#!.\n\n#weak Úspěšné lovy končí skolením kořisti, při němž lze získat trofejní [Concept('artifacts','artefakty')|El] a lovci může být udělena velká [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige','prestiž')|El].#!"
 game_concept_hunt_danger: "Nebezpečnost lovu"
 game_concept_hunt_danger_no_prefix: "Nebezpečnost"
 game_concept_hunt_dangerous: "Nebezpečné"
 game_concept_hunt_danger_desc: "Nevypočitatelnost i mírných divokých zvířat spojená se zběsilostí štvanice už přivedla ke zkáze nejednoho mocného válečníka.\n\nNebezpečnější zvířata udělí lovci větší [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige','prestiž')|El].\n\nPři výběru hostů by se také neměla přehlížet odlehlost divočiny a množství příležitostí..."
 game_concept_playdate: "$activity_playdate$"
 game_concept_playdate_desc: "[Concept('activity','Aktivita')|E], při níž se vládci a dvořané mladší než [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] scházejí, aby si hráli a zapomněli na denní pochmurnost.\n\nÚčastníci ztratí [Concept('stress','stres')|El] a zvýší své [Concept('opinion','mínění')|El] o pořadateli. Shromáždění takového množství dětí může mít i libovolný počet dalších následků.\n\n[Concept('ruler','Vládce')|E] pozve na $activity_playdate$ svého [Concept('liege','lenního pána')|El] a své [Concept('vassals','vazaly')|El] spolu s různými [Concept('courtiers','dvořany')|El]."
 game_concept_wedding_ceremony: "Obřad"
 game_concept_wedding_ceremony_desc: "[Concept('activity_phase','Fáze aktivity')|E] při [GetActivityType('activity_wedding').GetName], v níž si [Concept('spouses','choti')|El] vymění sliby a uzavřou [Concept('married','sezdání')|El]."
 game_concept_wedding_banquet: "Hostina"
 game_concept_wedding_banquet_desc: "[Concept('activity_phase','Fáze aktivity')|E] při [GetActivityType('activity_wedding').GetName], v níž se podává jídlo a pití a hosté si užívají zábavu a společnost."
 game_concept_wedding_night: "Svatební noc"
 game_concept_wedding_night_desc: "[Concept('activity_phase','Fáze aktivity')|E] při [GetActivityType('activity_wedding').GetName], v níž [Concept('spouses','choti')|El] naplní manželství a hosté pokračují v oslavě."
 game_concept_grand_wedding_promise: "Příslib velkolepé svatby"
 game_concept_grand_wedding_promises: "Přísliby velkolepé svatby"
 game_concept_grand_wedding_promised: "Přislíbena"
 game_concept_grand_wedding_promise_desc: "[Concept('betrothal','Zasnoubení')|E] s připojeným příslibem, že pro spojení dvou zúčastněných postav bude uspořádána [GetActivityType('activity_wedding').GetName].\n\nPříslib velkolepé svatby vyprší po 3 letech. Pokud nebude [GetActivityType('activity_wedding').GetName] včas uspořádána nebo bude zasnoubení zrušeno, ponese to trestající následky."
 game_concept_taxes: "Daně"
 game_concept_tax: "Daň"
 game_concept_taxation: "Zdanění"
 game_concept_taxes_desc: "Daně jsou nejdůležitějším měsíčním zdrojem [Concept('income','příjmem')|El] ve [Concept('gold','zlatě')|El] pro [Concept('rulers','vládce')|El].\n\nKaždá [Concept('holding','državu')|El], kterou vládce má, mu každý měsíc poskytuje určité [Concept('domain_taxes','daně z domény')|El]. Většina [Concept('vassals','vazalů')|El] má navíc [Concept('obligation','povinnost')|El] odvádět část svých vybraných daní svému [Concept('liege','lennímu pánovi')|El] ve formě [Concept('liege_taxes','lenním daním')|El]." # todo: CONCEPT CASE
 game_concept_dread: "Hrůza"
 game_concept_dreadful: "Hrůzostrašný"
 game_concept_dreaded: "Obávaný"
 game_concept_dread_i: "@dread_icon!"
 game_concept_dread_desc: "Hrůza vyjadřuje, jak obávaný je [Concept('ruler','vládce')|El].\n\nVládci zvyšují $game_concept_dread$ pácháním krutých a ohavných činů, jako je mučení a popravy [Concept('prisoners','vězňů')|El].\n\nHrůza umožňuje hrát jako [Concept('tyrant','tyran')|El], protože neukáznění [Concept('vassals','vazalové')|El] se mohou stát [Concept('intimidated','zastrašenými')|El] nebo [Concept('cowed','vyděšenými')|El], takže se tě budou příliš bát, než aby se ti postavili.\n\nHrůza postavy se může pohybovat od 0 do 100, s výjimkou [Concept('nomads','kočovníků')|El], kteří mohou dosáhnout 150. Časem bude jejich hrůza směřovat k jejich přirozené hrůze, kterou určují jejich [Concept('personality_traits','osobnostní rysy')|El].\n\n#high Hrůzostrašný [Concept('ruler','vládce')|El] sklízí tyto výhody:#!\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] jsou odrazováni od vstupu do [Concept('factions','frakcí')|El]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] jsou odrazováni od [Concept('scheming','osnování intrik')|El]\n$BULLET_WITH_TAB$Zvyšuje přijetí ze strany [Concept('vassal','vazala')|El] #weak (např. odvolání titulu)#!\n$BULLET_WITH_TAB$Zvyšuje přijetí [Concept('offer_vassalization','nabídky vazalizace')|El]\n$BULLET_WITH_TAB$Zvyšuje pravděpodobnost, že [Concept('electors','volitelé')|El] budou hlasovat stejně jako ty\n$BULLET_WITH_TAB$Snižuje pravděpodobnost, že vazalové budou odporovat změnám [Concept('law','zákonu')|El]\n\n#weak Pamatuj, že stateční a smělí [Concept('vassals','vazalové')|El] jsou hrůzou ovlivněni méně!#!" # todo: CONCEPT CASE
 game_concept_truce: "Příměří"
 game_concept_truces: "Příměří"
 game_concept_truce_desc: "Každá [Concept('war','válka')|El] končí $game_concept_truce$; obdobím, kdy útočník nesmí znovu vyhlásit válku témuž [Concept('ruler','vládci')|El] (obránce příměřím vázán není).\n\nPříměří lze porušit, ale následuje za to přísný postih."
 game_concept_government: "Vláda"
 game_concept_governments: "Vlády"
 game_concept_government_form: "Forma vlády"
 game_concept_government_forms: "Formy vlády"
 game_concept_government_desc: "Forma vlády [Concept('ruler','Vládce')|El] určuje, k jakým [Concept('laws','zákonům')|El] má přístup a jaké [Concept('obligations','povinnosti')|El] má vůči svému [Concept('liege','lennímu pánovi')|El], pokud není [Concept('independent','nezávislý')|El].\n\nFormy vlády jsou: [Concept('feudal','feudální')|El], [Concept('tribal','kmenová')|El], [Concept('clan','klanová')|El], [Concept('theocracy','teokracie')|El], [Concept('republic','republika')|El], [Concept('administrative','administrativní')|El], [GetGovernment( 'nomad_government' ).GetName] a [Concept('herder','pastevecká')|El]." # todo: CONCEPT CASE
 game_concept_feudal: "Feudální"
 game_concept_feudal_government: "Feudální vláda"
 game_concept_feudalism: "Feudalismus"
 game_concept_feudal_i: "@government_type_feudal!"
 game_concept_feudal_desc: "Ve feudální [Concept('government_form','formě vlády')|El] dává [Concept('liege','lenním pánovi')|El] svým [Concept('vassals','vazalech')|El] [Concept('land','půdu')|El] ke správě výměnou za [Concept('levies','odvedence')|El] a [Concept('taxes','daně')|El], upravené jednotlivou [Concept('vassal_contract','vazalskou smlouvu')|El] mezi vazalem a lenním pánem." # todo: CONCEPT CASE
 game_concept_tribal: "Kmenový"
 game_concept_tribal_government: "Kmenová vláda"
 game_concept_tribal_i: "@government_type_tribal!"
 game_concept_tribal_desc: "Kmenová panství mají omezený [Concept('development','rozvoj')|El] hrabství, nemohou pokročit za [Concept('innovations','inovaci')|El] kmenové éry, nemohou stavět nové [Concept('holdings','državy')|El] a obvykle nemohou změnit svůj [Concept('succession_law','zákon nástupnictví')|El].\n\nMohou však k budování svých panství a najímání [Concept('men_at_arms','ozbrojenců')|El] používat [Concept('prestige','prestiž')|El] namísto [Concept('gold','zlata')|El] a oproti [Concept('feudal','feudálním')|El] panstvím mají přístup k většímu počtu [Concept('casus_belli','casus belli')|El]. Nekmenové armády trpí postihem k [Concept('supply_limit','limitu zásobování')|El] na nepřátelském kmenovém území." # todo: CONCEPT CASE
 game_concept_clan: "Klan"
 game_concept_clans: "Klany"
 game_concept_clan_government: "Klanová vláda"
 game_concept_clan_i: "@government_type_clan!"
 game_concept_clan_desc: "Klany jsou [Concept('government_form','formou vlády')|El], v níž množství [Concept('levies','odvedenců')|El] a [Concept('taxes','daní')|El] odváděných [Concept('liege','lenního pána')|El] jeho [Concept('vassals','vazalů')|El] určuje [Concept('aptitude','způsobilost')|El] [Concept('tax_collector','výběrčího daní')|El] daného lenního pána. Klany také využívají [Concept('house_unity','soudržnost rodu')|El]." # todo: CONCEPT CASE
 game_concept_theocracy: "Teokracie"
 game_concept_theocracies: "Teokracie"
 game_concept_theocratic: "Teokratický"
 game_concept_theocratic_government: "Teokratická vláda"
 game_concept_theocracy_government: "Teokratická vláda"
 game_concept_theocracy_i: "@government_type_theocracy!"
 game_concept_theocracy_desc: "Teokracie je nehratelná [Concept('government_form','forma vlády')|El] dostupná pro některé [Concept('faiths','víry')|El] v závislosti na [Concept('doctrines','doktríny')|El]. Obvykle je vedena [Concept('head_of_faith','hlavou víry')|El] nebo [Concept('landed','zeměpánským')|El] [Concept('realm_priest','říšským duchovním')|El]. Biskup se také může stát [Concept('independent','nezávislým')|El] teokratickým vládcem sám o sobě." # todo: CONCEPT CASE
 game_concept_republic: "Republika"
 game_concept_republics: "Republiky"
 game_concept_republican: "Republikánský"
 game_concept_republic_government: "Republikánská vláda"
 game_concept_republic_i: "@government_type_republic!"
 game_concept_republic_desc: "Republikánská vláda je nehratelná [Concept('government_form','forma vlády')|El], v níž zvolený občan vládne doživotně — $game_concept_government_form$ měšťanů a kupců.\n\nRepublikánský [Concept('vassals','Vazalové')|El] mají pevné [Concept('obligations','povinností')|El], které nelze měnit, a proto vždy poskytují spolehlivé a předvídatelné množství [Concept('levies','odvedenců')|El] a [Concept('taxes','daní')|El]." # todo: CONCEPT CASE
 game_concept_skill: "Dovednost"
 game_concept_skills: "Dovednosti"
 game_concept_skills_desc: "Dovednosti postavy měří, jak dobrá je v různých činnostech.\n\nPět hlavních dovedností je: [Concept('diplomacy','diplomacie')|El], [Concept('martial','válečnictví')|El], [Concept('stewardship','správcovství')|El], [Concept('intrigue','pletichářství')|El], [Concept('learning','učenost')|El]."
 game_concept_building: "Budova"
 game_concept_buildings: "Budovy"
 game_concept_building_desc: "Budovy jsou vylepšení, která lze stavět v [Concept('holdings','državách')|El].\n\nMnoho typů budov lze stavět pouze v určitých [Concept('baronies','baronstvích')|El] nebo v určitém [Concept('terrain','teréně')|El].\n\nKaždá država má omezený počet stavebních míst, takže jedna država nemůže obsahovat všechny typy budov. [Concept('county_capitals','Hlavní sídla hrabství')|E] mají přístup k jednomu dodatečnému stavebnímu místu.\n\n[Concept('duchy_buildings','Vévodské budovy')|E] a [Concept('special_buildings','zvláštní budovy')|El] používají vlastní místa." # todo: CONCEPT CASE
 game_concept_duchy_building: "Vévodská budova"
 game_concept_duchy_buildings: "Vévodské budovy"
 game_concept_duchy_building_desc: "Vévodské budovy jsou mocné [Concept('buildings','budovy')|El], které lze stavět pouze v [Concept('de_jure_capital','de iure hlavním sídle')|El] [Concept('duchy','vévodství')|El]. V každém vévodství lze postavit jen jeden typ.\n\nVévodské budovy jsou aktivní pouze tehdy, pokud vlastník drží také příslušný [Concept('title','titul')|El] vévodství.\n\nMnohé vévodské budovy mají modifikátory, které ovlivňují všechny [Concept('holdings','državy')|El] ve vévodství, což z nich činí mocné nástroje pro specializaci tvé [Concept('domain','domény')|El]." # todo: CONCEPT CASE
 game_concept_special_building: "Zvláštní budova"
 game_concept_special_buildings: "Zvláštní budovy"
 game_concept_special_building_desc: "Zvláštní budovy jsou jedinečné [Concept('buildings','budovy')|El], které se nacházejí na několika předem určených místech po celém světě.\n\nMezi příklady patří starověké divy, velkolepé katedrály a významné doly. Některé jsou postaveny už na začátku hry, zatímco jiné je třeba teprve postavit.\n\nZvláštní budovy jsou obvykle velmi mocné a rozhodně stojí za boj." # todo: CONCEPT CASE
 game_concept_great_building: "Velkolepá budova"
 game_concept_great_buildings: "Velkolepé budovy"
 game_concept_great_building_desc: "Velkolepé budovy jsou jedinečné [Concept('buildings','budovy')|El] a vznikají jako výsledek [Concept('great_projects','velkých projektů')|El]. Jedním slavným příkladem je Velká čínská zeď.\n\nVelkolepé budovy jsou obvykle velmi mocné, ale jejich užitečnost je vázána na konkrétní podmínky." # todo: CONCEPT CASE
 game_concept_ruined_building: "Zničená budova"
 game_concept_ruined: "Zničená"
 game_concept_ruined_building_desc: "Budova, která je $game_concept_ruined$, byla vnějšími silami rozbita, zohavena nebo rozebrána na součásti.\n\nTěmito vnějšími silami mohou být například:\n$BULLET_WITH_TAB$[Concept('natural_disasters','Přírodní pohromy')|El][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ruined_buildings_tgp' )]" # todo: CONCEPT CASE
 game_concept_ruined_buildings_tgp: "\\n$BULLET_WITH_TAB$Pomstychtiví [Concept('mandala','mandaloví')|El] vládci"
 game_concept_rebuilt_building: "Obnovená budova"
 game_concept_rebuilt: "Obnovená"
 game_concept_rebuilding: "Obnova"
 game_concept_rebuilt_building_desc: "Akt obnovy [Concept('ruined','zničené')|El] budovy, který jí navrací někdejší slávu."
 game_concept_economic_building: "Hospodářská budova"
 game_concept_economic_buildings: "Hospodářské budovy"
 game_concept_economic_building_desc: "Hospodářské budovy jsou [Concept('buildings','budovy')|El], jejichž hlavní funkcí je zvyšovat [Concept('domain_income','příjem z domény')|El] jejich državy." # todo: CONCEPT CASE
 game_concept_military_building: "Vojenská budova"
 game_concept_military_buildings: "Vojenské budovy"
 game_concept_military_building_desc: "Vojenské budovy jsou [Concept('buildings','budovy')|El], jejichž hlavní funkcí je zvyšovat počet [Concept('levies','odvedenců')|El], které poskytují svému [Concept('holder','držiteli')|El]." # todo: CONCEPT CASE
 game_concept_fortification_building: "Opevňovací budova"
 game_concept_fortification_buildings: "Opevňovací budovy"
 game_concept_fortification_building_desc: "Opevňovací budovy jsou [Concept('buildings','budovy')|El], jejichž hlavní funkcí je buď zvyšovat [Concept('fort_level','úroveň opevnění')|El] jejich državy, nebo poskytovat obráncům bonus k [Concept('advantage','výhodě')|El]." # todo: CONCEPT CASE
 game_concept_pious_building: "Zbožná budova"
 game_concept_pious_buildings: "Zbožné budovy"
 game_concept_pious_building_desc: "Zbožné budovy jsou [Concept('buildings','budovy')|El], jejichž hlavní funkcí je zvyšovat [Concept('piety','zbožnost')|El] jejich državy." # todo: CONCEPT CASE
 game_concept_battle: "Bitva"
 game_concept_battles: "Bitvy"
 game_concept_battle_desc: "Bitvy začnou, když dvě nepřátelské [Concept('armies','armády')|El] vstoupí do stejného [Concept('barony','baronství')|El].\n\nNa začátku bitvy jedna strana obvykle začíná s [Concept('advantage','výhodou')|El] podle faktorů, jako jsou [Concept('terrain','terén')|El], [Concept('commander','velitel')|El] a [Concept('commander_traits','velitelské rysy')|El].\n\nArmády utrpí [Concept('casualties','ztráty')|El] podle množství obdrženého [Concept('damage','poškození')|El]. Bitva vstoupí do své [Concept('aftermath','dohry')|El], jakmile jedné straně nezůstanou žádní [Concept('soldiers','vojáci')|El].\n\nVítěz $game_concept_battle$ získá [Concept('war_score','válečné skóre')|El] podle rozsahu vítězství." # todo: CONCEPT CASE
 game_concept_aftermath: "Dohra"
 game_concept_aftermath_desc: "Fáze $game_concept_aftermath$ v [Concept('battle','bitvě')|El] nastane vždy, když jedna strana zvítězí. Vítěz se pokusí dostihnout a pobít co nejvíce [Concept( 'retreat', 'ustupujících' )|El] [Concept('soldiers','vojáků')|El].\n\n[Concept('men_at_arms','Ozbrojenci')|E] s vysokým [Concept('pursuit','pronásledováním')|El] dokážou během dohry zabít více $game_concept_soldiers$, zatímco $game_concept_men_at_arms$ s vysokým [Concept('screen','krytím')|El] budou chránit spřátelené [Concept('soldiers','vojáky')|El]." # todo: CONCEPT CASE
 game_concept_casualty: "Ztráta"
 game_concept_casualties: "Ztráty"
 game_concept_casualty_desc: "[Concept('armies','Armády')|E] během [Concept('battle','bitvy')|El] utrpí určité množství ztrát podle množství obdrženého [Concept('damage','poškození')|El].\n\nKdyž jsou [Concept('soldiers','vojáci')|El] odstraněni z bitvy, budou považováni buď za [Concept('routed_soldiers','rozprášené vojáky')|El], nebo za [Concept('dead_soldiers','padlé vojáky')|El]." # todo: CONCEPT CASE
 game_concept_retreat: "Ústup"
 game_concept_retreats: "Ústupy"
 game_concept_retreat_desc: "[Concept('army','Armáda')|E] provede $game_concept_retreat$, pokud prohraje [Concept('battle','bitvu')|El]. Armádám lze také během bitev nařídit $game_concept_retreat$. Při ústupu nelze $game_concept_army$ rozpustit ani jí vydat nové rozkazy k pohybu." # todo: CONCEPT CASE
 game_concept_illness: "Nemoc"
 game_concept_ill: "Nemocný"
 game_concept_sick: "Chorý"
 game_concept_sickness: "Choroba"
 game_concept_illnesses: "Nemoci"
 game_concept_diseases: "Nemoci"
 game_concept_illness_desc: "Nemoci jsou druhem negativních [Concept('traits','rysů')|El], které snižují [Concept('health','zdraví')|El] postavy. Rysy nemocí mohou trvat různě dlouho a výrazně se liší svou smrtelností."
 game_concept_medical_treatments: "Lékařská ošetření"
 game_concept_medical_treatments_desc: "Když postava onemocní nebo získá [GetTrait('wounded_1').GetName( GetNullCharacter )], může jí lékařské ošetření pomoci rychleji se zotavit.\n\nZa léčbu tebe a tvých [Concept('courtiers','dvořanů')|El] odpovídá [GetCourtPositionType('court_physician_court_position').GetName()]. Snaž se jej mít vždy ve službě, pokud si můžeš dovolit jeho plat.\n\nČím více ošetření $court_physician_court_position$ provede, tím více poroste jeho dovednost a tím získá [Concept('traits','rysy')|El] [GetTrait('lifestyle_physician').GetName( GetNullCharacter )]."
 game_concept_combat_width: "Šířka boje"
 game_concept_combat_width_desc: "Šířka boje určuje, kolik [Concept('soldiers','vojáky')|El] z každé strany může v [Concept('battle','bitvě')|El] bojovat současně, a mohou ji ovlivnit faktory jako [Concept('terrain','terén')|El].\n\nZabraňuje tomu, aby jedna strana druhou zcela zahltila, a určuje se na začátku bitvy." # todo: CONCEPT CASE
 game_concept_roll: "Hod kostkou"
 game_concept_rolls: "Hody kostkou"
 game_concept_combat_roll: "Bojový hod kostkou"
 game_concept_advantage_roll: "Hod kostkou o výhodu"
 game_concept_advantage_rolls: "Hody kostkou o výhodu"
 game_concept_combat_roll_desc: "[Concept('advantage','Hody kostkou o výhodu')|E] provádí každý [Concept('commander','velitel')|El] během [Concept('battle','bitvy')|El]. Probíhají na stupnici od 0 do 10 a jsou zcela náhodné, ale mohou mít rozhodující vliv na výsledek $game_concept_battle$."
 game_concept_terrain: "Terén"
 game_concept_terrains: "Terény"
 game_concept_terrain_desc: "Každé [Concept('barony','baronství')|El] má určitý převládající terén, který může ovlivňovat věci jako [Concept('supply','zásobování')|El], rychlost pohybu [Concept('armies','armád')|El], účinnost různých typů [Concept('regiments','pluků')|El] [Concept('men_at_arms','ozbrojenců')|El] v [Concept('battle','bitvě')|El] a [Concept('buildings','budovy')|El], které tam lze stavět.\n\nMnohé [Concept('commander_traits','velitelské rysy')|El] se také týkají terénu."
 game_concept_independent_ruler: "Nezávislý vládce"
 game_concept_independent_rulers: "Nezávislí vládci"
 game_concept_independent_ruler_desc: "Nezávislý [Concept('rulers','vládci')|El] nemají [Concept('liege','lenního pána')|El], a proto se těší větší svobodě jednání (například při vyhlašování [Concept('wars','válek')|El]).\n\nNa rozdíl od [Concept('vassals','vazalů')|El] však mohou být také přímo napadeni cizími [Concept('rulers','vládci')|El]." # todo: CONCEPT CASE
 game_concept_independent: "Nezávislý"
 game_concept_unlanded: "Bezzemek"
 game_concept_unlanded_desc: "Bezzemek je postava, která ve své [Concept('domain','doméně')|El] nemá žádné [Concept('holdings','državách')|El], ale teoreticky stále může být určitým druhem [Concept('rulers','vládce')|El]. Může to být například případ [Concept('heads_of_faith','hlav víry')|El] a velmistrů [Concept('holy_orders','svatých řádů')|El]." # todo: CONCEPT CASE
 game_concept_landed: "Zeměpán"
 game_concept_land: "Pozemek"
 game_concept_landed_desc: "Zeměpán je [Concept('ruler','vládce')|El], který vlastní [Concept('holdings','državy')|El]. S výjimkou [Concept('theocracies','teokracií')|El] a [Concept('republics','republik')|El] se [Concept('commoners','poddanými')|El] automaticky stávají [Concept('nobles','urozenými')|El], když získají pozemek, a zakládají novou [Concept('dynasty','dynastii')|El]." # todo: CONCEPT CASE
 game_concept_head_of_faith: "Hlava víry"
 game_concept_heads_of_faith: "Hlavy víry"
 game_concept_head_of_faith_desc: "Hlava víry je formální vůdce [Concept('faith','víry')|El]. Pravomoci a povaha $game_concept_head_of_faith$ závisí na [Concept('doctrines','doktríny')|El] dané víry.\n\nNěkteré víry mají [Concept('spiritual_head_of_faith','duchovní hlavu víry')|El] #weak (např. papeže)#!, některé [Concept('temporal_head_of_faith','světskou hlavu víry')|El] #weak (např. chalífu)#! a některé nemají $game_concept_head_of_faith$ vůbec." # todo: CONCEPT CASE
 game_concept_spiritual_head_of_faith: "Duchovní hlava víry"
 game_concept_head_of_faith_spiritual: "Duchovní"
 game_concept_spiritual_head_of_faith_desc: "[GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] [Concept('head_of_faith','Hlava víry')|El] je [Concept('theocratic','teokratická')|El] a nemusí být [Concept('landed','zeměpánská')|El] #weak (ačkoli může být)#!.\n\nDuchovní $game_concept_heads_of_faith$ mají obvykle přístup k interakcím, například mohou udělovat [Concept('claims','nároky')|El] nebo [Concept('gold','zlato')|El].\n\nPokud [Concept('doctrines','doktríny')|El] [Concept('faith','víry')|El] umožňují [Concept('great_holy_wars','velké svaté války')|El], pak budou [Concept('great_holy_war_undirected','nesměrované')|El] #weak (např. křížové výpravy)#!." # todo: CONCEPT CASE
 game_concept_temporal_head_of_faith: "Světská hlava víry"
 game_concept_head_of_faith_temporal: "Světská"
 game_concept_temporal_head_of_faith_desc: "[GetFaithDoctrine('doctrine_temporal_head').GetBaseName] [Concept('head_of_faith','Hlava víry')|El] jedná podobně jako běžný [Concept('ruler','vládce')|El] a $game_concept_head_of_faith$ [Concept('title','titul')|El] bude zničen, pokud přijde o veškerou svou půdu.\n\nPokud [Concept('doctrines','doktríny')|El] [Concept('faith','víry')|El] umožňují [Concept('great_holy_wars','velké svaté války')|El], budou [Concept('great_holy_war_directed','směrované')|El] #weak (např. džihády)#!." # todo: CONCEPT CASE
 game_concept_routed_soldiers: "Rozprášené ztráty"
 game_concept_routed_soldiers_desc: "V [Concept('battle','bitvě')|El] většinu [Concept('casualties','ztrát')|El] ve skutečnosti tvoří $game_concept_routed_soldiers$, nikoli mrtví či těžce ranění. Na rozdíl od [Concept('dead_soldiers','padlých vojáků')|El] tito [Concept('soldiers','vojáci')|El] přežijí, aby mohli bojovat další den, a po skončení bitvě se vrátí do [Concept('army','armády')|El]. Vítězná strana je během [Concept('aftermath','dohry')|El] bitvy může stále uštvat, a to i tehdy, pokud $game_concept_army$ dobrovolně [Concept('retreats','ustoupí')|El]." # todo: CONCEPT CASE
 game_concept_dead_soldiers: "Smrtelné ztráty"
 game_concept_dead_soldiers_desc: "Během [Concept('battle','bitvy')|El] je mnoho (ale obvykle ne většina) [Concept('soldiers','vojáků')|El] zabito nebo tak těžce raněno, že už nikdy nebudou moci bojovat. Jde o trvalé [Concept('casualties','ztráty')|El], na rozdíl od pouhých [Concept('routed_soldiers','rozprášených vojáků')|El]."
 game_concept_title_claim: "Nárok na titul"
 game_concept_title_claims: "Nároky na tituly"
 game_concept_claims: "Nároky"
 game_concept_claim: "Nárok"
 game_concept_claimed: "Nárokovaný"
 game_concept_claim_i: "@pressed_claim!"
 game_concept_title_claim_desc: "Nárok na [Concept('title','titul')|El] představuje zákonné právo jej vlastnit a poskytuje [Concept('casus_belli','casus belli')|El] k jeho dobytí prostřednictvím [Concept('war','války')|El]. Nároky také poskytují platný důvod k [Concept('revoke','odebrání')|El] [Concept('titles','titulům')|El] [Concept('vassal','vazalským')|El] [Concept('holders','držitelům')|El].\n\nNároky se obvykle udělují [Concept('rulers','vládcům')|El], kdykoli ztratí kontrolu nad tituly ve prospěch někoho jiného, ale lze je také vytvořit prostřednictvím úkolu [Concept('fabricate_claim_short','zfalšovat nárok')|El].\n\nKaždé dítě vládce (dokonce i [Concept('bastards','bastardi')|El]) má navíc [Concept('implicit_claim','implicitní nárok')|El] na všechny [Concept('titles','tituly')|El] tohoto vládce. Pokud po smrti [Concept('ruler','vládce')|El] daný titul nezdědí, tyto [Concept('implicit_claims','implicitní nároky')|El] se změní na [Concept('pressed_claims','uplatněné nároky')|El], které pak mohou jejich vlastní děti zdědit jako [Concept('unpressed_claims','neuplatněné nároky')|El]." # todo: CONCEPT CASE
 game_concept_pressed_claim: "Uplatněný nárok"
 game_concept_pressed_claims: "Uplatněné nároky"
 game_concept_pressed_claim_i: "@pressed_claim!"
 game_concept_pressed: "Uplatněný"
 game_concept_pressed_claim_desc: "Uplatněný [Concept('claims','Nároky')|El] jsou považovány za právně silné a děti [Concept('claimant','pretendenta')|El] je dědí jako [Concept('unpressed_claims','neuplatněné nároky')|El]." # todo: CONCEPT CASE
 game_concept_unpressed_claim: "Neuplatněný nárok"
 game_concept_unpressed_claims: "Neuplatněné nároky"
 game_concept_unpressed_claim_i: "@unpressed_claim!"
 game_concept_unpressed: "Neuplatněný"
 game_concept_unpressed_claim_desc: "Neuplatněný [Concept('claims','Nároky')|El] jsou právně nejisté a děti [Concept('claimant','pretendenta')|El] je nedědí.\n\nNeuplatněné nároky se však stanou [Concept('pressed','uplatněnými')|El], pokud jsou použity jako [Concept('casus_belli','casus belli')|El] k vyhlášení [Concept('war','válce')|El] — i když válka skončí [Concept('white_peace','bílým mírem')|El]." # todo: CONCEPT CASE
 game_concept_implicit_claim: "Implicitní nárok"
 game_concept_implicit_claims: "Implicitní nároky"
 game_concept_implicit_claim_i: "@implicit_claim!"
 game_concept_implicit_claim_desc: "Implicitní nároky jsou [Concept('claims','nároky')|El], které získávají [Concept('eligible_children','způsobilé děti')|El] na všechny [Concept('titles','tituly')|El] držené jejich rodiči. Pokud rodič ztratí [Concept('title','titul')|El], bude odebrán i $game_concept_implicit_claim$ dítěte." # todo: CONCEPT CASE
 game_concept_claimant: "Pretendent"
 game_concept_claimants: "Pretendenti"
 game_concept_claimant_possessive: "Pretendenta"
 game_concept_claimant_desc: "Pretendent je osoba s jedním nebo více [Concept('claims','nároky')|El] na [Concept('titles','tituly')|El]. [Concept('ruler','Vládnoucí')|E] pretendenti je mohou uplatnit použitím nárokového [Concept('casus_belli','casu belli')|El] k vyhlášení [Concept('wars','válek')|El].\n\nTento casus belli lze použít také k uplatnění nároků [Concept('vassals','vazalů')|El] a dokonce i [Concept('unlanded','bezzemků')|El] ve tvém [Concept('realm','panství')|El].\n\nPretendenti mohou také vést [Concept('factions','frakce')|El] — i když nežijí ve tvém panství." # todo: CONCEPT CASE
 game_concept_renounce: "Zříci se"
 game_concept_renounced: "Zřekl se"
 game_concept_renounce_desc: "[Concept('prisoners','Vězni')|E] mohou být propuštěni výměnou za to, že se vzdají všech [Concept('claims','nároků')|El] na [Concept('titles','tituly')|El] v rámci tvého [Concept('realm','panství')|El].\n\nDěti současného [Concept('holder','držitele')|El] však nikdy nemohou o své nároky přijít, dokud je držitel stále naživu."
 game_concept_court: "Dvůr"
 game_concept_courts: "Dvory"
 game_concept_court_desc: "Každý [Concept('ruler','vládce')|El] má $game_concept_court$, tvořený různými [Concept('unlanded','bezzemky')|El], kteří slouží svému [Concept('liege','lennímu pánovi')|El].\n\nTito [Concept('courtiers','dvořané')|El] se obvykle skládají z vládcovy rodiny a směsi nepříbuzných, ale potenciálně užitečných [Concept('nobles','urozených')|El] a prostých lidí."
 game_concept_courtier: "Dvořan"
 game_concept_courtiers: "Dvořané"
 game_concept_courtier_desc: "Dvořan je [Concept('unlanded','bezzemek')|El], který slouží [Concept('ruler','vládci')|El] na jeho [Concept('court','dvoře')|El].\n\nDvořané mohou:\n$BULLET_WITH_TAB$sloužit jako [Concept('councillors','rádci')|El]\n$BULLET_WITH_TAB$sloužit v [Concept('court_positions','dvorských úřadech')|El]\n$BULLET_WITH_TAB$sloužit v [Concept('armies','armádách')|El] jako [Concept('commanders','velitelé')|El] nebo [Concept('knights','rytíři')|El]\n$BULLET_WITH_TAB$stát se [Concept('vassal','vazalem')|El] svého vládce, pokud jim bude udělen [Concept('title','titul')|El]\n$BULLET_WITH_TAB$dovolit svému vládci uplatnit své [Concept('claims','nároky')|El] ve [Concept('war','válce')|El]\n\n#WEAK [Concept('adventurers','Dobrodruzi')|E] mají místo dvořanů [Concept('followers','družiníky')|El] — plní stejnou úlohu, byť jsou zpravidla cítit hůře a mívají na sobě více bláta.#!" # todo: CONCEPT CASE
 game_concept_court_guest: "Host dvora"
 game_concept_guest: "Host"
 game_concept_guests: "Hosté"
 game_concept_court_guest_desc: "[Concept('wanderers','Pocestní')|E] se někdy objeví u [Concept('court','dvora')|El] jako hosté. Zůstanou jen omezenou dobu, ale [Concept('ruler','vládce')|El] je může naverbovat jako trvalé [Concept('courtiers','dvořany')|El]."
 game_concept_wanderer: "Pocestný"
 game_concept_wanderers: "Pocestní"
 game_concept_wanderer_desc: "Postavy, které nepatří k žádnému [Concept('court','dvoru')|El] ani nedrží žádné [Concept('titles','tituly')|El], se nazývají pocestní. Putují světem a cestou navštěvují dvory jako [Concept('guests','hosté')|El]. Pocestní se mohou stát [Concept('mercenary','žoldnéřskými')|El] kapitány, vůdci [Concept('holy_orders','svatých řádů')|El], členy [Concept('clergy','duchovenstvo')|El] nebo držiteli [Concept('city','městu')|El]." # todo: CONCEPT CASE
 game_concept_court_host: "Hostitel dvora"
 game_concept_court_host_desc: "Hostitel dvora je [Concept('ruler','vládce')|El], který není lenním pánem postavy, a přesto ji má na svém [Concept('court','dvoře')|El].\n\nMůže k tomu dojít z několika důvodů, například když [Concept('wanderers','pocestní')|El] navštěvují vládce nebo když [Concept('wards','svěřenci')|El] pobývají na stejném dvoře jako jejich [Concept('guardian','poručník')|El]." # todo: CONCEPT CASE
 game_concept_host: "Hostitel"
 game_concept_hosting: "Hostitelství"
 game_concept_noble: "Urozený"
 game_concept_nobles: "Urození"
 game_concept_nobleman: "Šlechtic"
 game_concept_noblemen: "Šlechtici"
 game_concept_noblewoman: "Šlechtična"
 game_concept_noblewomen: "Šlechtičny"
 game_concept_nobility: "Šlechta"
 game_concept_noble_desc: "Urození jsou postavy, které jsou členy [Concept('dynasty','dynastii')|El]. Postavy bez dynastie jsou považovány za neurozené [Concept('commoners','poddané')|El]." # todo: CONCEPT CASE
 game_concept_commoner: "Poddaný"
 game_concept_lowborn: "Neurozený"
 game_concept_commoners: "Poddaní"
 game_concept_commoner_desc: "Poddaný či $game_concept_lowborn$ postava není členem [Concept('noble','urozeným')|El] [Concept('dynasty','dynastií')|El]. Přesto však stále může být mocným [Concept('rulers','vládcem')|El] [Concept('theocracies','teokracii')|El] a [Concept('republics','republik')|El].\n\nPokud se prostý člověk stane [Concept('landed','zeměpánem')|El], okamžitě se stává urozeným a zakládá vlastní [Concept('dynasties','dynastie')|El] (s výjimkou [Concept('republics','republikami')|El] a [Concept('theocracies','teokracií')|El], které jsou z velké části vedeny prostými lidmi)." # todo: CONCEPT CASE
 game_concept_martial_lifestyle: "Válečnický životní styl"
 game_concept_martial_lifestyle_i: "@martial_lifestyle_icon!"
 game_concept_martial_lifestyle_desc: "Válečnický životní styl je vhodný pro postavy, které chtějí vylepšit své [Concept('men_at_arms','ozbrojence')|El] a [Concept('knights','rytíře')|El], zvýšit [Concept('control','kontrolu')|El] ve své [Concept('domain','doméně')|El] nebo zvýšit své šance na vítězství ve [Concept('wars','válkách')|El]." # todo: CONCEPT CASE
 game_concept_intrigue_lifestyle: "Pletichářský životní styl"
 game_concept_intrigue_lifestyle_i: "@intrigue_lifestyle_icon!"
 game_concept_intrigue_lifestyle_desc: "Pletichářský životní styl je vhodný pro postavy, které chtějí uspět v [Concept('schemes','intrikách')|El], získat [Concept('dread','hrůzu')|El] nebo snadno svádět ostatní." # todo: CONCEPT CASE
 game_concept_intrigue_lqwuljxh: "Lqwuljxh"
 game_concept_intrigue_9_14_20_18_9_7_21_5: "9 14 20 18 9 7 21 5"
 game_concept_intrigue_rigueint: "Rigueint"
 game_concept_diplomacy_lifestyle: "Diplomatický životní styl"
 game_concept_diplomacy_lifestyle_i: "@diplomacy_lifestyle_icon!"
 game_concept_diplomacy_lifestyle_desc: "Diplomatický životní styl je vhodný pro postavy, které chtějí získávat [Concept('claims','nároky')|El] a [Concept('casus_bellis','casus belli')|El], zvyšovat svou [Concept('prestige','prestiž')|El] nebo získávat dobrodiní od rodiny a přátel." # todo: CONCEPT CASE
 game_concept_stewardship_lifestyle: "Správcovský životní styl"
 game_concept_stewardship_lifestyle_i: "@stewardship_lifestyle_icon!"
 game_concept_stewardship_lifestyle_desc: "Správcovský životní styl je vhodný pro postavy, které chtějí vylepšovat svou [Concept('domain','doménu')|El], usmiřovat si svého [Concept('liege','lenního pána')|El] a [Concept('vassals','vazaly')|El] nebo získat mnoho [Concept('gold','zlata')|El]." # todo: CONCEPT CASE
 game_concept_learning_lifestyle: "Učený životní styl"
 game_concept_learning_lifestyle_i: "@learning_lifestyle_icon!"
 game_concept_learning_lifestyle_desc: "Učený životní styl je vhodný pro postavy, které chtějí žít dlouhý a zdravý život, získávat [Concept('piety','zbožnost')|El] nebo získávat dodatečné bonusy ze své [Concept('faith','víry')|El]." # todo: CONCEPT CASE
 game_concept_wanderer_lifestyle: "Potulný životní styl"
 game_concept_wanderer_lifestyle_desc: "Potulný životní styl je vhodný pro postavy, které chtějí spatřit [Concept('points_of_interest','zajímavá místa')|El] nebo získávat dodatečné bonusy z [Concept('traveling','cestování')|El]." # todo: CONCEPT CASE
 game_concept_crime: "Zločin"
 game_concept_crimes: "Zločiny"
 game_concept_criminal: "Zločinný"
 game_concept_criminals: "Zločinci"
 game_concept_crime_i: "@crime_icon!"
 game_concept_crime_desc: "Zločiny jsou činy, které společnost považuje za natolik zavrženíhodné, že si zaslouží trest.\n\nZločiny mohou být světské (například když se [Concept('vassal','vazalem')|El] [Concept('revolting','vzbouří')|El] proti svému [Concept('liege','lennímu pánovi')|El]) nebo náboženské (jakékoli [Concept('shunned','odsuzované')|El] chování, které [Concept('doctrine','doktrína')|El] činí nezákonným). Světské zločiny mohou trestat pouze postavy, kterým provinění uškodilo, ale za náboženské zločiny může své poddané trestat kterýkoli [Concept('ruler','vládce')|El].\n\nVšechny zločiny dávají vládcům platný důvod [Concept('imprison','uvěznit')|El] $game_concept_criminals$ a podle závažnosti zločinu také [Concept('revoke','odebrat')|El] jejich [Concept('titles','tituly')|El], [Concept('banish','vyhostit')|El], [Concept('torture','mučit')|El] nebo je [Concept('execute','popravit')|El]. Každý zločin může vládce potrestat pouze jednou, ačkoli některé zločiny udělí zločinci negativní [Concept('fame_trait','rys pověsti')|El], který si ponese až do hrobu.\n\nNěkdy postavy se zločiny vyváznou; ty se pak stávají [Concept('secrets','tajemstvími')|El], která mohou jiné postavy odhalit a využít k [Concept('blackmail','vydírání')|El]." # todo: CONCEPT CASE
 game_concept_shunned: "Odsuzované"
 game_concept_shunned_desc: "Mnohé [Concept('faiths','víry')|El] mají [Concept('doctrines','doktríny')|El], které určité chování označují za odsuzované. V závislosti na konkrétní doktríně může být takové chování považováno také za [Concept('criminal','zločinné')|El].\n\nPostavy přistižené při chování, které jejich víra odsuzuje, ztratí [Concept('piety_level','úroveň oddanosti')|El] a získají odpovídající [Concept('fame_trait','rys pověsti')|El]; tento rys nebude mít rád nikdo, jehož víra dané chování považuje buď za odsuzované, nebo za zločinné.\n\nPříklady odsuzovaného chování zahrnují:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_refuse_conversion_crime: "Odmítnutí konverze"
 game_concept_refusing_conversion_crime: "Odmítání konverze"
 game_concept_refused_conversion_crime: "Odmítl konverzi"
 game_concept_refuse_conversion_crime_desc: "Odmítnutí konverze bude považováno za [Concept('crime','zločin')|El], pokud:\n$EFFECT_LIST_BULLET$odmítající [Concept('character','postava')|El] náleží ke stejnému [Concept('religion','náboženství')|El] jako $game_concept_character$, která požadavek vznáší\n$EFFECT_LIST_BULLET$Náboženství má [Concept('heresies','kacířství')|El]\n$EFFECT_LIST_BULLET$[Concept('faith','Víra')|E] Postava, která požadavek vznáší, je vůči víře odmítající $game_concept_character$ [Concept('faith_hostile','nepřátelská')|El] nebo horší" # todo: CONCEPT CASE
 game_concept_prison: "Vězení"
 game_concept_imprisons: "Vězní"
 game_concept_imprison: "Uvěznit"
 game_concept_imprisoning: "Uvěznění"
 game_concept_imprisoned: "Uvězněný"
 game_concept_imprisonment: "Uvěznění"
 game_concept_prisons: "Vězení"
 game_concept_prisoner: "Vězeň"
 game_concept_prisoners: "Vězni"
 game_concept_jailor: "Žalářník"
 game_concept_prison_desc: "[Concept('landed','Zeměpán')|E] [Concept('rulers','vládci')|El] mohou držet jiné postavy jako vězně, buď ve svém [Concept('dungeon','žaláři')|El], nebo v prostém [Concept('house_arrest','domácím vězení')|El]. V [Concept('camp','táboře')|El] jsou všichni vězni drženi v [Concept('stockade','ohradě')|El]. Postavám hrozí uvěznění v [Concept('battle','bitvě')|El] nebo na konci [Concept('siege','obléhání')|El].\n\nPostavy mohou také zatknout kohokoli ve svém vlastním [Concept('realm','panství')|El] nebo [Concept('camp','táboře')|El]. Pokud však daná postava není vinna [Concept('crime','zločinem')|El], považuje se to za [Concept('tyrannical','tyranskými')|El].\n\nVězni jsou vydáni na tvou milost a mohou být [Concept('executed','popraveni')|El], [Concept('tortured','mučeni')|El], propuštěni za výkupné nebo jednoduše propuštěni." # todo: CONCEPT CASE
 game_concept_dungeon: "Žalář"
 game_concept_stockade: "Vězeňská ohrada"
 game_concept_dungeons: "Žaláře"
 game_concept_stockades: "Vězeňské ohrady"
 game_concept_dungeon_desc: "[Concept('imprisoned','Uvězněné')|E] postavy držené v žaláři nebo $game_concept_stockade$ trpí rostoucím [Concept('stress','stresem')|El] a také postihem ke [Concept('health','zdraví')|El]. Časem pravděpodobně zemřou na [Concept('illness','nemoc')|El] nebo utrpí duševní zhroucení.\n\nU [Concept('landed','zeměpána')|El] [Concept('rulers','vládců')|El] jsou [Concept('commoners','poddaných')|El] automaticky uvězněni v žaláři, ale mohou být přesunuti do [Concept('house_arrest','domácího vězení')|El]." # todo: CONCEPT CASE
 game_concept_stockade_desc: "$game_concept_dungeon_desc$"
 game_concept_house_arrest: "Domácí vězení"
 game_concept_house_arrest_desc: "Domácí vězení je mírná forma [Concept('prison','vězení')|El], při níž postavy netrpí žádnými škodlivými účinky kromě nudy. [Concept('rulers','Vládci')|E] je však mohou uvrhnout do [Concept('dungeon','žaláře')|El], ačkoli tím sníží [Concept('opinions','mínění')|El] [Concept('close_family','blízké rodiny')|El] vězně.\n\nZajatí [Concept('nobles','urození')|El] jsou automaticky umístěni do [Concept('house_arrest','domácího vězení')|El]." # todo: CONCEPT CASE
 game_concept_tyranny: "Tyranie"
 game_concept_tyrant: "Tyran"
 game_concept_tyrannical: "Tyranský"
 game_concept_tyranny_desc: "Mnohé činy [Concept('ruler','vládce')|El] jsou považovány za tyranský — proti zákonu nebo náboženské [Concept('doctrine','doktríně')|El]. Například [Concept('imprisoning','uvěznění')|El] nebo [Concept('revoking','odebrání')|El] [Concept('titles','titulů')|El] někomu, kdo nespáchal žádný [Concept('crime','zločin')|El], je považováno za tyranské.\n\nTyranie působí jako plošný modifikátor [Concept('opinion','mínění')|El] pro všechny postavy v [Concept('realm','panství')|El]." # todo: CONCEPT CASE
 game_concept_execute: "Popravit"
 game_concept_executed: "Popravený"
 game_concept_executing: "Popravování"
 game_concept_execution: "Poprava"
 game_concept_executions: "Popravy"
 game_concept_execute_desc: "[Concept('imprisoned','Uvězněné')|E] postavy lze $game_concept_executed$. Považuje se to za [Concept('tyrannical','tyranský')|El], pokud jejich věznitel nemá [Concept('execute_reason','důvod k popravě')|El].\n\nPopravy zvyšují tvou [Concept('dread','hrůzu')|El] a [Concept('close_family','blízká rodina')|El] nešťastného cíle je nikdy nepřijímá dobře." # todo: CONCEPT CASE
 game_concept_torture: "Mučení"
 game_concept_tortured: "Mučený"
 game_concept_torturing: "Mučení"
 game_concept_torture_desc: "[Concept('imprisoned','Uvězněné')|E] postavy lze $game_concept_tortured$, což poškodí jejich [Concept('health','zdraví')|El] nebo je dokonce různými způsoby zmrzačí.\n\nMučení může u postav s rysy [GetTrait('callous').GetName( GetNullCharacter )] a [GetTrait('sadistic').GetName( GetNullCharacter )] snižovat [Concept('stress','stres')|El], ale u dobrosrdečných postav jej způsobuje.\n\nMučení [Concept('rulers','vládců')|El] může také zvýšit tvou [Concept('dread','hrůzu')|El]."
 game_concept_banish: "Vyhnat"
 game_concept_banished: "Vyhnaný"
 game_concept_banishment: "Vyhnanství"
 game_concept_banishment_desc: "[Concept('imprisoned','Uvězněné')|E] postavy lze z [Concept('realm','panství')|El] poslat do vyhnanství, což je patrně nejtvrdší forma trestu. Vyhnaný [Concept('landed','Zeměpán')|El] jsou sesazeni, zatímco $game_concept_banished$ [Concept('courtiers','dvořané')|El] přijdou o svůj majetek.\n\nVyhnanství bez důvodu (například bez závažného [Concept('crime','zločinu')|El]) je považováno za krajně [Concept('tyrannical','tyranské')|El]." # todo: CONCEPT CASE
 game_concept_revoke: "Odebrat"
 game_concept_revoked: "Odebraný"
 game_concept_revoking: "Odebírání"
 game_concept_revocation: "Odebrání"
 game_concept_revocations: "Odebrání"
 game_concept_revoke_desc: "Při [Concept('limited_crown_authority','omezené korunní autoritě')|El] nebo vyšší mohou [Concept('rulers','vládci')|El] $game_concept_revoke$ [Concept('titles','tituly')|El] svých [Concept('vassals','vazalů')|El], ale pokud vazal není [Concept('imprisoned','uvězněn')|El], jde o riskantní krok, protože vazal může odmítnout a povstat ve vzpouře.\n\nOdebrání titulu se považuje za [Concept('tyrannical','tyranský')|El], pokud vazal není vinen poměrně závažným [Concept('crime','zločinem')|El]." # todo: CONCEPT CASE
 game_concept_retract: "Odejmout"
 game_concept_retracted: "Odňatý"
 game_concept_retracting: "Odnímání"
 game_concept_retraction: "Odnětí"
 game_concept_retractions: "Odnětí"
 game_concept_retract_desc: "Při [Concept('limited_crown_authority','omezené korunní autoritě')|El] nebo vyšší mohou [Concept('rulers','vládci')|El] $game_concept_retract$ [Concept('vassal','vazala')|El] některému vazalovi, ale pokud tento vazal není [Concept('imprisoned','uvězněn')|El], jde o riskantní krok, protože může odmítnout a povstat ve vzpouře.\n\nOdnětí vazala se považuje za [Concept('tyrannical','tyranský')|El], pokud cíl není vinen poměrně závažným [Concept('crime','zločinem')|El]." # todo: CONCEPT CASE
 game_concept_transfer: "Převést"
 game_concept_transferred: "Převedený"
 game_concept_transferring: "Převádění"
 game_concept_transfer_desc: "[Concept('rulers','Vládci')|E] mohou $game_concept_transfer$ jednoho ze svých [Concept('vassals','vazalů')|El] jinému vazalovi, pokud je první z nich nižší hodnosti než druhý. Je to dobrý způsob, jak zvýšit [Concept('opinion','mínění')|El] vazala, obzvlášť pokud je převedený vazal [Concept('de_jure','de iure')|El] součástí jeho [Concept('realm','panství')|El]."
 game_concept_men_at_arms: "Ozbrojenci"
 game_concept_men_at_arms_desc: "Ozbrojenci jsou profesionální [Concept('soldiers','vojáci')|El] lepší než [Concept('levies','odvedenci')|El].\n\nHráč má přímou kontrolu nad složením a velikostí svých [Concept('regiments','pluků')|El] ozbrojenců.\n\nRůzné typy ozbrojenců jsou dobré či špatné v různých typech [Concept('terrain','teréně')|El]. Každý typ také [Concept('counters','kontruje')|El] jinému typu.\n\nOzbrojence lze [Concept('stationed','umístit')|El] v [Concept('holdings','državách')|El], aby se zvýšila jejich účinnost." # todo: CONCEPT CASE
 game_concept_skirmishers: "Harcovníci"
 game_concept_skirmisher: "Harcovník"
 game_concept_skirmishers_desc: "Harcovníci jsou [Concept('men_at_arms','ozbrojenci')|El], kteří jsou lehce vyzbrojeni a zkušení v obtěžování nepřítele.\n\nAčkoli je každý druh harcovníků jedinečný, obecně [Concept('counter','kontrují')|El] [Concept('heavy_infantry','těžké pěchotě')|El] a sami jsou naopak kontrováni [Concept('archers','lučištníky')|El]."
 game_concept_archers: "Lučištníci"
 game_concept_archer: "Lučištník"
 game_concept_archers_desc: "Lučištníci jsou [Concept('men_at_arms','ozbrojenci')|El], kteří bojují pěšky střelnými zbraněmi.\n\nAčkoli je každý druh lučištníků jedinečný, obecně [Concept('counter','kontrují')|El] [Concept('skirmishers','harcovníkům')|El] a sami jsou naopak kontrováni [Concept('heavy_cavalry','těžkou jízdou')|El] a [Concept('light_cavalry','lehkou jízdou')|El]."
 game_concept_light_cavalry: "Lehká jízda"
 game_concept_light_cavalry_desc: "Lehká jízda jsou jízdní [Concept('men_at_arms','ozbrojenci')|El], kteří vynikají v průzkumu a pronásledování nepřítele.\n\nAčkoli je každý druh lehké jízdy jedinečný, obecně [Concept('counter','kontruje')|El] [Concept('archers','lučištníkům')|El] a sama je naopak kontrována [Concept('spearmen','kopiníky')|El].\n\nLehká jízda je také často silná na rovném [Concept('terrain','teréně')|El].\n\nVe srovnání s [Concept('heavy_cavalry','těžkou jízdou')|El] je obvykle lepší v [Concept('pursuit','pronásledování')|El] a [Concept('screen','krytí')|El]." # todo: CONCEPT CASE
 game_concept_heavy_cavalry: "Těžká jízda"
 game_concept_heavy_cavalry_desc: "Těžká jízda jsou jízdní, těžce obrnění [Concept('men_at_arms','ozbrojenci')|El].\n\nAčkoli je každý druh těžké jízdy jedinečný, obecně [Concept('counter','kontruje')|El] [Concept('archers','lučištníkům')|El] a sama je naopak kontrována [Concept('spearmen','kopiníky')|El].\n\nTěžká jízda je také často silná na rovném [Concept('terrain','teréně')|El].\n\nVe srovnání s [Concept('light_cavalry','lehkou jízdou')|El] je obvykle silnější v hrubém [Concept('damage','poškození')|El] a [Concept('toughness','houževnatosti')|El]." # todo: CONCEPT CASE
 game_concept_spearmen: "Kopiníci"
 game_concept_spearmen_desc: "Kopiníci jsou [Concept('men_at_arms','ozbrojenci')|El], kteří bojují pěšky různými tyčovými zbraněmi.\n\nAčkoli je každý druh kopiníků jedinečný, obecně [Concept('counter','kontrují')|El] [Concept('heavy_cavalry','těžké jízdě')|El] a [Concept('light_cavalry','lehké jízdě')|El] a sami jsou naopak kontrováni [Concept('heavy_infantry','těžkou pěchotou')|El].\n\nKopiníci jsou také často silní v kopcovitém a horském [Concept('terrain','teréně')|El]." # todo: CONCEPT CASE
 game_concept_heavy_infantry: "Těžká pěchota"
 game_concept_heavy_infantry_desc: "Těžká pěchota jsou [Concept('men_at_arms','ozbrojenci')|El], kteří bojují pěšky s těžší zbrojí a zbraněmi.\n\nAčkoli je každý druh těžké pěchoty jedinečný, obecně [Concept('counter','kontruje')|El] [Concept('spearmen','kopiníkům')|El] a sama je naopak kontrována [Concept('skirmishers','harcovníky')|El]."
 game_concept_archer_cavalry: "Jízdní lučištníci"
 game_concept_archer_cavalry_desc: "Jízdní lučištníci jsou jízdní [Concept('men_at_arms','ozbrojenci')|El] vybavení střelnými zbraněmi.\n\nAčkoli je každý druh $game_concept_archer_cavalry$ jedinečný, obecně [Concept('counter','kontruje')|El] [Concept('heavy_infantry','těžké pěchotě')|El] a sám je naopak kontrován [Concept('archers','lučištníky')|El] vybavenými kušemi.\n\nJízdní lučištníci jsou také často silní na rovném [Concept('terrain','teréně')|El], zejména ve stepi." # todo: CONCEPT CASE
 game_concept_camel_cavalry: "Velbloudí jízda"
 game_concept_camel_cavalry_desc: "Velbloudí jízda jsou jízdní [Concept('men_at_arms','ozbrojenci')|El], kteří podobně jako [Concept('light_cavalry','lehká jízda')|El] vynikají v průzkumu a pronásledování nepřítele.\n\nObecně [Concept('counter','kontrují')|El] $game_concept_light_cavalry$ a sami jsou naopak kontrováni [Concept('spearmen','kopiníky')|El].\n\nVelbloudí jízda bývá často silná v pouštním a suchém [Concept('terrain','teréně')|El]." # todo: CONCEPT CASE
 game_concept_elephant_cavalry: "Sloní jízda"
 game_concept_elephant_cavalry_desc: "Sloní jízda jsou jízdní, často obrnění [Concept('men_at_arms','ozbrojenci')|El].\n\nAčkoli je každý druh $game_concept_elephant_cavalry$ jedinečný, obecně představuje silné [Concept('counter','kontrování')|El] pěších jednotek a sám je naopak kontrován [Concept('spearmen','kopiníky')|El].\n\nSloní jízda bývá také často silná v džunglovém [Concept('terrain','teréně')|El]." # todo: CONCEPT CASE
 game_concept_gunpowders: "Střelci"
 game_concept_gunpowder: "Střelec"
 game_concept_gunpowder_desc: "Střelci jsou [Concept('men_at_arms','ozbrojenci')|El] vyzbrojení účinnými palnými zbraněmi.\n\nAčkoli je každý druh střelců jedinečný, obecně [Concept('counter','kontrují')|El] [Concept('heavy_infantry','těžké pěchotě')|El] a sami jsou naopak kontrováni [Concept('heavy_cavalry','těžkou jízdou')|El] a [Concept('light_cavalry','lehkou jízdou')|El]."
 game_concept_peasant_militia: "Selská domobrana"
 game_concept_peasant_militias: "Selské domobrany"
 game_concept_peasant_militia_desc: "Selské domobrany jsou [Concept('men_at_arms','ozbrojenci')|El] vyzbrojení vidlemi a kopími.\n\nAčkoli je každý druh domobrany jedinečný, obecně [Concept('counter','kontruje')|El] [Concept('heavy_cavalry','těžké jízdě')|El] a [Concept('light_cavalry','lehké jízdě')|El] a sama je naopak kontrována [Concept('heavy_infantry','těžkou pěchotou')|El].\n\nSelské domobrany jsou silné v horském a úrodném [Concept('terrain','teréně')|El]." # todo: CONCEPT CASE
 game_concept_special_troops: "Vojsko z událostí"
 game_concept_special_troops_desc: "Vojsko z událostí není jako běžné [Concept('armies','armády')|El], protože není povoláváno z [Concept('holding','državy')|El]. Vojsko z událostí lze získat prostřednictvím událostí a představuje různé síly, například družiny, dravé hordy a ctižádostivé rolnictvo.\n\nObvykle nemá náklady na údržbu a nedoplňuje se. Pokud je máš, využij je moudře.\n\nNěkolik historických [Concept('rulers','vládců')|El] začíná se vojskem z událostí." # todo: CONCEPT CASE
 game_concept_line: "Linie"
 game_concept_line_of_succession: "Linie následnictví"
 game_concept_line_of_succession_desc: "Linie následnictví je pořadí, v němž mohou určité postavy zdědit určité [Concept('titles','tituly')|El], určené [Concept('succession_law','zákonem nástupnictví')|El]."
 game_concept_counter: "Kontrovat"
 game_concept_counters: "Kontry"
 game_concept_men_at_arms_counter: "Kontra ozbrojenců"
 game_concept_men_at_arms_counter_desc: "Většina [Concept('men_at_arms','ozbrojenců')|El] dokáže $game_concept_counter$ jiný typ $game_concept_men_at_arms$.\n\nKdyž je [Concept('regiment','pluk')|El] kontrován, jeho účinnost během [Concept('battle','bitvy')|El] se sníží. Čím více je $game_concept_regiment$ početně převýšen svou kontrovat, tím vyšší je postih." # todo: CONCEPT CASE
 game_concept_intimidated: "Zastrašený"
 game_concept_intimidated_i: "@intimidated_icon!"
 game_concept_intimidated_desc: "Postavy, které se jiné postavy velmi bojí, jsou jí zastrašeny. Obvykle to způsobuje [Concept('dread','hrůza')|El] a/nebo zbabělá osobnost.\n\nZastrašené postavy méně často zahajují nepřátelské akce proti postavě, které se bojí, včetně vstupu do [Concept('factions','frakcí')|El] nebo jejich zakládání.\n\nPostavy, které se bojí ještě více, jsou označeny jako [Concept('cowed','vyděšené')|El]."
 game_concept_cowed: "Vyděšený"
 game_concept_terrified_i: "@terrified_icon!"
 game_concept_cowed_desc: "Vyděšené postavy jsou ochromeny strachem z jiné postavy a jen zřídka proti ní podniknou nepřátelské kroky, včetně zakládání [Concept('factions','frakcí')|El].\n\nPostavy jsou vyděšené nebo [Concept('intimidated','zastrašené')|El] kvůli [Concept('dread','hrůze')|El] a/nebo zbabělé osobnosti."
 game_concept_provisions: "Proviant"
 game_concept_provision: "Proviant"
 game_concept_provisions_i: "@provisions_icon!"
 game_concept_provisions_desc: "Proviant představuje celkové množství jídla, vody a přístřeší, které může [Concept('camp','tábor')|El] poskytnout.\n\nTábory ztrácejí $game_concept_provisions$ při přesunu na jiné [Concept('location','místo')|El]. Přesné množství ovlivňuje velikost jejich [Concept('men_at_arms','ozbrojenců')|El], [Concept('terrain','terén')|El], kterým procházejí, a to, jací [Concept('officers','důstojníci')|El] jsou právě najati.\n\nDružina $game_concept_camp$ s nedostatkem proviantem začne trpět událostmi [Concept('privation','strádáním')|El]: nejprve [Concept('characters','postavy')|El] rychle ztratí [Concept('opinion','mínění')|El] o svém vůdci a situace se pak rychle vyhrotí k hladovění a smrti.\n\n#WEAK Proviant lze při stání na místě doplnit vyžádáním od [Concept('contact_list_contacts','patronů')|El], přijetím [Concept('decision','rozhodnutí')|El] nebo jako odměnu za [Concept('task_contract','zakázku')|El].#!" # todo: CONCEPT CASE
 game_concept_privation: "Strádání"
 game_concept_privation_desc: "Když [Concept('camp','tábor')|El] stojí na místě, dokáže se uživit směňováním jídla za příležitostné práce, lovem, sběrem nebo rybolovem tam, kde je to dovoleno a možné, a obecně #EMP sotva#! udržovat svou zásobovací situaci nad vodou.\n\nJakmile se však musí začít [Concept('traveling','cestovat')|El], je při přežití zcela odkázán na svůj proviant, protože se nemůže zároveň pohybovat a získávat dostatek jídla. Jakmile $game_concept_provisions$ začne docházet (a pak #EMP dojde#!), vzplane napětí a [Concept('followers','družiníci')|El] začnou hladovět.\n\nKdyž k tomu dojde, [Concept('characters','postavy')|El] začnou $game_concept_camp$ opouštět, budou se stále častěji uplatňovat záporné [Concept('modifiers','modifikátory')|El] a ti, kdo zůstanou, se nakonec vzbouří nebo zemřou." # todo: CONCEPT CASE
 game_concept_supply: "Zásoby"
 game_concept_supply_state: "Stav zásob"
 game_concept_supply_desc: "Zásoby je množství jídla a vybavení, které [Concept('army','armáda')|El] nese. Armády začnou ztrácet $game_concept_supply$, když jejich velikost překročí [Concept('supply_limit','limit zásobování')|El] jejich současného místa.\n\nArmády, kterým docházejí $game_concept_supplies$, utrpí postih k [Concept('advantage','výhodě')|El] v [Concept('battle','bitvě')|El], a když jim dojdou zcela, začnou trpět [Concept('attrition','opotřebením')|El].\n\nZásoby se časem zvyšují, dokud armáda zůstává pod limitem zásobování na přátelském území." # todo: CONCEPT CASE
 game_concept_supplied: "Zásobený"
 game_concept_supplies: "Zásoby"
 game_concept_supply_limit_mult: "Násobitel limitu zásobování"
 game_concept_supply_limit: "Limit zásobování"
 game_concept_supply_limit_desc: "Limit zásobování určuje množství [Concept('soldiers','vojáků')|El], které můžeš mít v [Concept('barony','baronství')|El], podle [Concept('terrain','terénu')|El] a [Concept('development','rozvoje')|El] daného baronství.\n\nPokud celková velikost tvé [Concept('army','armády')|El] překročí $game_concept_supply_limit$, tvé $game_concept_armies$ budou ztrácet [Concept('supply','zásoby')|El] a nakonec budou trpět [Concept('attrition','opotřebením')|El]." # todo: CONCEPT CASE
 game_concept_attrition: "Opotřebení"
 game_concept_attrition_desc: "[Concept('armies','Armády')|E] mohou trpět $game_concept_attrition$, což znamená ztrátu [Concept('soldiers','vojáky')|El] kvůli dezerci, nemocem nebo hladovění.\n\nOpotřebení nastává, když je armáda bez [Concept('supplies','zásob')|El], obléhá [Concept('fortified_holding','opevněné državy')|El] nebo se přesouvá z jednoho nepřátelského [Concept('county','hrabství')|El] do jiného, pokud cílové místo nesousedí s hrabstvím již pod kontrolou." # todo: CONCEPT CASE
 game_concept_attrition_i: "@attrition_icon!"
 game_concept_objectives: "Cíle"
 game_concept_objectives_desc: "Určité části nepřátelského [Concept('realm','panství')|El] (obvykle [Concept('realm_capital','hlavní sídlo panství')|El] a [Concept('holdings','državy')|El] v oblasti [Concept('war_target','válečného cíle')|El] [Concept('war','války')|El]) jsou považovány za cíle. [Concept('occupying','Obsazování')|E] Cíle začneš získávat „tikající“ [Concept('war_score','válečné skóre')|El].\n\nObránci začne [Concept('war_score','válečné skóre')|El] narůstat (po počáteční době), pokud se mu podaří zabránit útočící straně v obsazení jakýchkoli cílů." # todo: CONCEPT CASE
 game_concept_war_contribution: "Válečný příspěvek"
 game_concept_contribution: "Příspěvek"
 game_concept_contribute: "Přispět"
 game_concept_war_contribution_desc: "[Concept('rulers','Vládci')|E], kteří pomáhají svým [Concept('allies','spojenci')|El] ve [Concept('war','válce')|El], získávají válečném příspěvku podle počtu a velikosti [Concept('battles','bitev')|El], v nichž bojují, a také podle počtu [Concept('holdings','držav')|El], které dokážou [Concept('occupy','obsadit')|El].\n\nPo skončení války je každý přispěvatel odměněn podle svého příspěvku. Přesná kořist závisí na válečném [Concept('casus_belli','casu belli')|El], ale obvykle jde o [Concept('gold','zlato')|El], [Concept('prestige','prestiž')|El] nebo [Concept('piety','zbožnost')|El].\n\nPříspěvek se zvyšuje i za prohrané bitvy." # todo: CONCEPT CASE
 game_concept_scheme_speed: "Délka fáze intriky"
 game_concept_scheme_speed_single: "Délka fáze"
 game_concept_scheme_speed_i: "@scheme_phase_duration_icon!"
 game_concept_scheme_speed_desc: "Délka fáze označuje, kolik dní trvá dokončení jedné [Concept('scheme_phase','fázi intriky')|El]. Délku ovlivňuje tvá [Concept('skill','dovednost')|El], [Concept('agents','spolčenci')|El] a tvůj [Concept('spymaster','špehmistr')|El], stejně jako [Concept('councillor_task','úkol rádce')|El] „$task_support_schemes$“, pokud je intrika [Concept('scheme_hostile','nepřátelská')|El].\n\n#WEAK Nižší $game_concept_scheme_speed_single$ je výhodná, protože [Concept('scheme','intrika')|El] bude postupovat rychleji." # todo: CONCEPT CASE
 game_concept_scheme_resistance: "Odolnost vůči intrikám"
 game_concept_scheme_resistance_single: "Odolnost"
 game_concept_hostile_scheme_resistance: "Odolnost vůči nepřátelským intrikám"
 game_concept_scheme_resistance_desc: "Odolnost vůči intrikám [Concept('character','Postava')|El] zpomaluje $game_concept_schemes$ vedené proti ní.\n\n[Concept('scheme_speed','Délka fáze intriky')|E] [Concept('scheme_owner','Osnovatel intriky')|El] je touto hodnotou snížena, což prodlužuje dobu, za kterou intriku získá [Concept('scheme_opportunity_opportunities','výhody')|El].\n\n#WEAK Odolnost vůči intrikám se zvyšuje odpovídající [Concept('skill','dovedností')|El] [Concept('scheme_target','cíle intriky')|El] a jeho [Concept('spymaster','špehmistra')|El], stejně jako [Concept('councillor_task','úkolem rádce')|El] „$task_disrupt_schemes$“ (pokud je intrika [Concept('scheme_hostile','nepřátelská')|El]).#!" # todo: CONCEPT CASE
 game_concept_scheme_success_chance: "Šance na úspěch intriky"
 game_concept_success_chance: "Šance na úspěch"
 game_concept_success_chance_i: "@scheme_success_icon!"
 game_concept_scheme_success_chance_desc: "Šance na úspěch [Concept('scheme','Intrika')|El] určuje, jak pravděpodobné je, že při provedení uspěje.\n\nŠance na úspěch dané $game_concept_scheme$ bude časem [Concept('scheme_growth_grow','růstem')|El] a vychází z přiřazených [Concept('agents','spolčenců')|El] i související [Concept('skill','dovednosti')|El]. Šance na úspěch je omezena [Concept('scheme_potential','potenciálem intriky')|El]. Žádná $game_concept_scheme$ nikdy nemůže překročit 95% $game_concept_success_chance$, kromě [Concept('contract_schemes','smluvních intrik')|El].\n\n#WEAK [Concept('secret_schemes','Tajné intriky')|E] hrozí riziko odhalení cílem. Pokud k tomu dojde, tvá $game_concept_success_chance$ bude výrazně snížena. #!" # todo: CONCEPT CASE
 game_concept_scheme_growth: "Růst intriky"
 game_concept_success_chance_growth_i: "@scheme_success_growth_icon!"
 game_concept_scheme_growth_growth: "Růst"
 game_concept_scheme_growth_desc: "Každou [Concept('scheme_phase_phase','fázi intriky')|El] se [Concept('success_chance','šancemi na úspěch')|El] intrikou zvýší o tuto hodnotu, dokud nedosáhne aktuálního maxima [Concept('scheme_potential_potential','potenciálu')|El].\n\n#WEAK Pokud má například $game_concept_scheme$ právě 50% $game_concept_success_chance$, $game_concept_scheme_potential_potential$ 54 % a $game_concept_scheme_growth_growth$ 3 %, pak po uplynutí jedné fázi bude mít 53% $game_concept_success_chance$.\n\nProtože $game_concept_scheme_growth_growth$ je stále omezen $game_concept_scheme_potential_potential$, po další fázi bude mít $game_concept_scheme$ jen 54% $game_concept_success_chance$.#!" # todo: CONCEPT CASE
 game_concept_scheme_growth_grow: "růst"
 game_concept_scheme_growth_grow_desc: "$game_concept_scheme_growth_desc$"
 game_concept_scheme_potential: "Potenciál intriky"
 game_concept_scheme_potential_potential: "Potenciál"
 game_concept_success_chance_max_i: "@scheme_success_max_icon!"
 game_concept_scheme_potential_desc: "[Concept('scheme','Intrika')|E] má [Concept('success_chance','šanci na úspěch')|El], procentuální hodnotu určující její výsledek, které dosahuje prostřednictvím [Concept('scheme_growth','růstu intriky')|El]. Tu omezuje $game_concept_scheme_potential$, který slouží jako horní hranice $game_concept_scheme$.\n\nPotenciál intriky lze zvýšit najmutím vhodných [Concept('agents','spolčenců')|El], ale nikdy nemůže překročit 95 %, kromě [Concept('contract_schemes','smluvních intrik')|El].\n\n#WEAK Harmoničtí spolčenců mohou prostřednictvím událostí poskytovat další bonusové [Concept('modifiers','modifikátory')|El].\n\nPřebytečná $game_concept_success_chance$ nad potenciálem dané $game_concept_scheme$ je ztracena.#!" # todo: CONCEPT CASE
 game_concept_secrecy: "Utajení"
 game_concept_secrecy_i: "@scheme_secrecy_icon!"
 game_concept_secrecy_desc: "Utajení [Concept('hostile_scheme','Nepřátelská intrika')|El] určuje, jak pravděpodobné je, že zůstane před cílem [Concept('scheme','intrikou')|El] neodhalena.\n\nUtajení dané $game_concept_scheme$ bude mít počáteční dobu imunity, během níž ji nelze odhalit. Po tomto období bude $game_concept_scheme$ každý měsíc vystavena riziku odhalení prostřednictvím [Concept('scheme_breach_short','narušení')|El]. Tví [Concept('agents','spolčenců')|El] mohou výrazně ovlivnit, jak dobře dokážeš svou intriku udržet v tajnosti.\n\n#WEAK Intrika s utajením 80 % má 20% šanci na odhalení při provedení a 2% šanci na odhalení každý měsíc, kdy pokračuje.#!" # todo: CONCEPT CASE
 game_concept_secrecy_grace: "Ochranná lhůta"
 game_concept_secrecy_grace_desc.boilerplate: "Většina intrik má ochrannou lhůtu přibližně ~[EmptyScope.ScriptValue('secrecy_grace_period_value')] měsíců, než mohou být měsíčně odhalovány." # todo: CONCEPT CASE
 game_concept_secrecy_grace_desc: "$game_concept_secrecy_grace_desc.boilerplate$\n\nPo skončení ochranné lhůty mohou být $game_concept_schemes$ každý měsíc odhaleny, což způsobí [Concept('scheme_breach_short','narušení')|El]. K tomu dochází s mnohem nižší pravděpodobností než při provedení intriky, ale kontroluje se to výrazně častěji."
 game_concept_county_development: "Rozvoj"
 game_concept_development_i: "@development_icon!"
 game_concept_development: "Rozvoj"
 game_concept_county_development_desc: "Rozvoj měří místní infrastrukturu a technologickou vyspělost v [Concept('county','hrabství')|El]. \n\nVyšší rozvoji zvyšuje [Concept('levies','odvedence')|El], [Concept('taxes','daně')|El] a [Concept('supply_limit','limit zásobování')|El] získávané z hrabství." # todo: CONCEPT CASE
 game_concept_county_development_growth: "Růst rozvoje"
 game_concept_development_growth: "Růst rozvoje"
 game_concept_county_development_growth_desc: "Růst rozvoje měří, jak daleko je [Concept('county','hrabství')|El] od zvýšení svého [Concept('development','rozvoje')|El].\n\nPři hodnotě 100 $game_concept_county_development_growth$ se rozvojem zvýší o 1." # todo: CONCEPT CASE
 game_concept_existing_development: "Stávající rozvoj"
 game_concept_existing_development_desc: "[Concept('develop_county','Rozvíjet hrabství')|E], úkol správce, trpí klesajícími výnosy. Čím více [Concept('development','rozvoje')|El] už [Concept('county','hrabství')|El] má, tím větší postih dostává [Concept('development_growth','růst rozvoje')|El].\n\nVe výchozím stavu dosáhnou [Concept('counties','hrabství')|El] maximálního postihu za [Concept('existing_development','stávající rozvoj')|El] při 10 [Concept('development','rozvoji')|El]. Každá [Concept('era','éře')|El] má [Concept('innovation','inovaci')|El], která tento limit výrazně zvyšuje, až na 90 [Concept('development','rozvoj')|El] v [Concept('era','éře')|El] $culture_era_late_medieval$.\n\nInovace, které ovlivňují modifikátor $game_concept_existing_development$:\n$EFFECT_LIST_BULLET$ $innovation_development_01$\n$EFFECT_LIST_BULLET$ $innovation_development_02$\n$EFFECT_LIST_BULLET$ $innovation_development_03$\n$EFFECT_LIST_BULLET$ $innovation_development_04$" # todo: CONCEPT CASE
 game_concept_county_control: "Kontrola hrabství"
 game_concept_control: "Kontrola"
 game_concept_control_i: "@control_icon!"
 game_concept_county_control_desc: "Kontrola hrabství měří, jak pevně má vláda pod kontrolou obyvatelstvo [Concept('county','hrabství')|El]. Je zásadní zejména pro vybírání [Concept('taxes','daně')|El] z [Concept('holdings','držav')|El].\n\nKdyž hrabství změní majitele prostřednictvím [Concept('war','války')|El], kontrola prudce klesne, což je dobrý důvod raději vazalizovat současného [Concept('holder','držitele')|El] (pokud to [Concept('casus_belli','casus belli')|El] dovoluje). Kontrolu hrabství mohou poškodit také [Concept('sieges','obléhání')|El] a [Concept( 'peasant_faction', 'selská povstání' )|El].\n\nNízká kontrola může vést ke [Concept('county_corruption','korupcím v hrabství')|El] a hlavním způsobem, jak kontrolu zvýšit, je [Concept('councillor_task','úkol rádce')|El] dostupný tvému [Concept('marshal','maršálovi')|El]." # todo: CONCEPT CASE
 game_concept_absolute_control: "Absolutní kontrola"
 game_concept_absolute_control_short: "Absolutní"
 game_concept_absolute_control_desc: "Absolutní kontrola je zvláštní stav [Concept('control','kontroly')|El] umožněný [Concept('perk','talentem')|El] $absolute_control_perk_name$ a značí, že vládce drží obyvatelstvo železnou rukou.\n\nKdykoli je $game_concept_control$ na hodnotě #V 100#!, zobrazí se místo toho jako „$ABSOLUTE_COUNTY_CONTROL$“ a poskytne dodatečné bonusy k [Concept('taxes','daním')|El] a [Concept('levies','odvedencům')|El]." # todo: CONCEPT CASE
 game_concept_county_corruption: "Korupce v hrabství"
 game_concept_county_corruption_desc: "Dokud má [Concept('county','hrabství')|El] nízkou [Concept('control','kontroly')|El] nebo je jeho [Concept('holder','držitele')|El] v [Concept('debt','dluhu')|El], může hrabství získat $game_concept_county_corruption$. Jde o různé druhy záporných [Concept('county_modifiers','modifikátorů hrabství')|El].\n\nKorupce v hrabství časem vyprchá, ale pokud přetrvá hlavní příčina ([Concept('debt','dluh')|El] nebo nízká [Concept('control','kontrola')|El]), může se znovu objevit.\n\nÚkol rádce $task_increase_control$ $councillor_marshal$ může $game_concept_county_corruption$ odstranit rychleji." # todo: CONCEPT CASE
 game_concept_county_modifier: "Modifikátor hrabství"
 game_concept_county_modifiers: "Modifikátory hrabství"
 game_concept_county_modifier_desc: "Modifikátory hrabství jsou modifikátory, které ovlivňují různé hodnoty [Concept('county','hrabství')|El].\n\n[Concept('baronies','Baronství')|E] mohou mít vlastní modifikátory a lze je zobrazit v [Concept('holdings','državách')|El] hrabství." # todo: CONCEPT CASE
 game_concept_fleet: "Loďstvo"
 game_concept_fleets: "Loďstva"
 game_concept_fleet_desc: "[Concept('armies','Armády')|E], které vstoupí do mořské zóny, se automaticky [Concept('embark','nalodí')|El] na loďstvo. [Concept('embarking','Nalodění')|E] stojí určité množství [Concept('gold','zlata')|El], což představuje opatření a stavbu lodí.\n\nZatímco jsou na loďstvo, [Concept('armies','armády')|El] mohou rychle překonávat vodu, ale stojí o #V 25 %#! více na údržbě a po #V [GetDefine('NFleet', 'ATTRITION_AFTER_DAYS')|0]#! dnech na moři začnou ztrácet [Concept('supplies','zásoby')|El].\n\nLoďstva spolu nebojují v [Concept('battles','bitvách')|El].\n\nKdyž se armádou vylodí, loďstvem zmizí a $game_concept_army$ se stane [Concept('recently_disembarked','nedávno vyloděnou')|El]." # todo: CONCEPT CASE
 game_concept_domain_income: "Příjem z domény"
 game_concept_domain_taxes: "Daně z domény"
 game_concept_domain_income_desc: "Tvůj $game_concept_domain_income$ se skládá z [Concept('taxes','daní')|El], které vybíráš ze své vlastní [Concept('domain','domény')|El]. Vybraná částka závisí na místní úrovni [Concept('control','kontrole')|El] a [Concept('development','rozvoje')|El]." # todo: CONCEPT CASE
 game_concept_vassal_taxes: "Vazalské daně"
 game_concept_vassal_taxes_desc: "Tvé $game_concept_vassal_taxes$ se skládají z [Concept('taxes','daní')|El], které dostáváš od svých [Concept('vassals','vazalů')|El]. Jejich výše závisí na [Concept('obligations','povinnosti')|El] každého vazala.\n\nZ pohledu tvých vazalů se tytéž daně nazývají [Concept('liege_taxes','lenní daně')|El], aby se odlišily od jakýchkoli vazalských daní, které vybírají od svých vlastních vazalů." # todo: CONCEPT CASE
 game_concept_tributary_taxes: "Tributářské daně"
 game_concept_tributary_taxes_desc: "Tvé $game_concept_tributary_taxes$ se skládají z [Concept('taxes','daní')|El], které dostáváš od svých [Concept('tributaries','tributářů')|El]. Jejich výše závisí na [Concept('obligations','povinnosti')|El] každého tributáře.\n\nZ pohledu tvých tributářů se tytéž daně nazývají [Concept('suzerain_taxes','daně suzerénovi')|El], aby se odlišily od jakýchkoli $game_concept_tributary_taxes$, které vybírají od svých vlastních $game_concept_tributaries$." # todo: CONCEPT CASE
 game_concept_liege_taxes: "Lenní daně"
 game_concept_liege_taxes_desc: "Tvé $game_concept_liege_taxes$ jsou [Concept('taxes','daně')|El], které musíš platit svému [Concept('liege','lennímu pánovi')|El] jako součást svých [Concept('obligations','povinností')|El]. Pokud jsi [Concept('independent','nezávislý')|El], žádné $game_concept_liege_taxes$ neplatíš.\n\nZ pohledu tvého lenního pána se tytéž daně nazývají [Concept('vassal_taxes','vazalské daně')|El], aby se odlišily od jakýchkoli daní, které může dlužit svému vlastnímu lennímu pánovi." # todo: CONCEPT CASE
 game_concept_suzerain_taxes: "Daně suzerénovi"
 game_concept_suzerain_taxes_desc: "Tvé $game_concept_suzerain_taxes$ jsou [Concept('taxes','daně')|El], které musíš platit svému [Concept('suzerain','suzerénovi')|El] jako součást svých [Concept('obligations','povinností')|El].\n\nZ pohledu tvého suzeréna se tytéž daně nazývají [Concept('tributary_taxes','tributářské daně')|El], aby se odlišily od jakýchkoli daní, které může dlužit svému vlastnímu $game_concept_suzerain$."
 game_concept_usurp_title: "Uzurpovat titul"
 game_concept_usurp: "Uzurpovat"
 game_concept_usurped: "Uzurpovaný"
 game_concept_usurpation: "Uzurpace"
 game_concept_usurp_title_desc: "[Concept('title','Titul')|E] držený cizím [Concept('ruler','vládci')|El] lze obvykle uzurpovat, pokud je více než #V 50 %#! jeho [Concept('de_jure','de iure')|El] [Concept('counties','hrabství')|El] v tvém [Concept('realm','panství')|El]. Tento proces ti daný [Concept('title','titul')|El] předá, což je obzvlášť důležité pro zajištění, že jsi [Concept('rightful_liege','právoplatným lenním pánem')|El] svých [Concept('vassals','vazalů')|El].\n\nUzurpace je obtížnější, pokud je [Concept('faith','víra')|El] současného držitele nepřátelská vůči tvé; v takovém případě je uzurpace možná pouze tehdy, pokud držitel už ve svém panství nevlastní žádné z jeho [Concept('de_jure','de iure')|El] [Concept('counties','hrabství')|El]." # todo: CONCEPT CASE
 game_concept_close_family: "Blízká rodina"
 game_concept_close_family_members: "Členové blízké rodiny"
 game_concept_close_family_member: "Člen blízké rodiny"
 game_concept_close_family_desc: "Blízká rodina postavy zahrnuje:\n$BULLET_WITH_TAB$rodiče\n$BULLET_WITH_TAB$prarodiče\n$BULLET_WITH_TAB$děti\n$BULLET_WITH_TAB$vnoučata\n$BULLET_WITH_TAB$sourozence"
 game_concept_extended_family: "Širší rodina"
 game_concept_extended_family_members: "Členové širší rodiny"
 game_concept_extended_family_desc: "Širší rodina postavy zahrnuje:\n$BULLET_WITH_TAB$bratrance a sestřenice\n$BULLET_WITH_TAB$strýce\n$BULLET_WITH_TAB$tety\n$BULLET_WITH_TAB$synovce\n$BULLET_WITH_TAB$neteře"
 game_concept_family: "Rodina"
 game_concept_family_members: "Členové rodiny"
 game_concept_family_member: "Člen rodiny"
 game_concept_family_desc: "Rodinu postavy tvoří její [Concept('close_family_members','členové blízké rodiny')|El] a [Concept('extended_family_members','členové širší rodiny')|El]."
 game_concept_kinslayer: "Rodovrah"
 game_concept_kinslayers: "Rodovrazi"
 game_concept_kinslaying: "Rodovražda"
 game_concept_kinslaying_desc: "Rodovrah je postava, o níž je známo, že zabila [Concept('family_member','člena rodiny')|El]. Některé [Concept('faiths','víry')|El] považují rodovraždu za [Concept('criminal','zločinného')|El].\n\nTři rysy rodovraždy jsou:\n$BULLET_WITH_TAB$[GetTrait('kinslayer_3').GetName( GetNullCharacter )] — uděluje se těm, kdo zabijí [Concept('close_family','člena blízké rodiny')|El]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_2').GetName( GetNullCharacter )] — uděluje se těm, kdo zabijí [Concept('extended_family','člena širší rodiny')|El]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_1').GetName( GetNullCharacter )] — uděluje se těm, kdo zabijí člena své [Concept('dynasty','dynastii')|El]" # todo: CONCEPT CASE
 game_concept_gender_law: "Zákon o pohlaví"
 game_concept_gender_laws: "Zákony o pohlaví"
 game_concept_gender_law_desc: "Každý [Concept('ruler','vládce')|El] má hlavní zákon o pohlaví, který určuje, na koho mohou při [Concept('succession','nástupnictví')|El] přejít jeho [Concept('titles','titulů')|El]. Zákony o pohlaví také ovlivňují, kdo může velet [Concept('armies','armádám')|El] a možnost mít více [Concept('spouses','chotí')|El] nebo [Concept('concubines','konkubín')|El].\n\nDostupné zákony o pohlaví závisí na [Concept('doctrine','doktrínu')|El] „Postoj k pohlaví“ dané [Concept('faith','víry')|El]." # todo: CONCEPT CASE
 game_concept_depose: "Sesadit"
 game_concept_deposed: "Sesazený"
 game_concept_depose_desc: "[Concept('rulers','Vládci')|E] mohou být sesazeni v důsledku požadavků [Concept('faction','frakcí')|El] nebo zvláštních událostí. Jejich [Concept('heirs','dědici')|El] zdědí jejich [Concept('titles','tituly')|El], i když je starý vládce stále naživu." # todo: CONCEPT CASE
 game_concept_virtue: "Ctnost"
 game_concept_virtues: "Ctnosti"
 game_concept_virtuous: "Ctnostný"
 game_concept_virtue_desc: "Každá [Concept('faith','víra')|El] považuje určité [Concept('traits','rysy')|El] za ctnostné. Postavy s těmito rysy získávají bonusy k [Concept('opinion','mínění')|El] od všech postav, které tyto rysy považují za ctnostné, i když nesdílejí stejnou víru. Postavy, které mají rysy považované jejich vlastní vírou za ctnostné, navíc každý měsíc získávají bonusovou [Concept('piety','zbožnost')|El].\n\nTo, které rysy jsou považovány za ctnosti, se liší víru od víry, ale obvykle to určuje kombinace [Concept('core_tenets','základních zásad')|El] dané víry a [Concept('religion','náboženství')|El], k němuž víra náleží."
 game_concept_sin: "Hřích"
 game_concept_sins: "Hříchy"
 game_concept_sinful: "Hříšný"
 game_concept_sin_desc: "Každá [Concept('faith','víra')|El] považuje určité [Concept('traits','rysy')|El] za hříšné. Postavy s těmito rysy dostávají postihy k [Concept('opinion','mínění')|El] od všech postav, které tyto rysy považují za hříšné, i když nesdílejí stejnou víru. Postavy, které mají rysy považované jejich vlastní vírou za hříšné, navíc každý měsíc ztrácejí [Concept('piety','zbožnost')|El].\n\nTo, které rysy jsou považovány za hříchy, se liší víru od víry, ale obvykle to určuje kombinace [Concept('core_tenets','základních zásad')|El] dané víry a [Concept('religion','náboženství')|El], k němuž víra náleží."
 game_concept_excommunicate: "Exkomunikovat"
 game_concept_excommunicated: "Exkomunikovaný"
 game_concept_excommunication: "Exkomunikace"
 game_concept_excommunication_desc: "Postavy, které jejich [Concept('head_of_faith','hlava víry')|El] označí rysem [GetTrait('excommunicated').GetName( GetNullCharacter )], jsou ostatními postavami své [Concept('faith','víry')|El] považovány za [Concept('criminals','zločince')|El].\n\nNa [Concept('independent','nezávislý')|El] [Concept('rulers','vládce')|El], kteří získali rys [GetTrait('excommunicated').GetName( GetNullCharacter )], může být vyhlášena [Concept('excommunication_war','exkomunikační válka')|El].\n\nExkomunikaci lze odstranit buď prosbou o odpuštění u [Concept('head_of_faith','hlavy víry')|El], nebo přestupem k jiné [Concept('faith','víře')|El]." # todo: CONCEPT CASE
 game_concept_legalism: "Legalismus"
 game_concept_legalistic: "Legalistický"
 game_concept_legalism_desc: "[Concept('core_tenet','Základní zásada')|E] zdůrazňující právní praxi a tradici v teologii a zbožnosti. Ovlivňuje náklady zákonů a členství [Concept('vassal','vazalů')|El] ve [Concept('faction','frakcích')|El] podle počtu [Concept('sins','hříchů')|El] nebo [Concept('virtues','ctností')|El], které [Concept('ruler','vládce')|El] má." # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_0: "Prosté kořeny"
 game_concept_dynasty_prestige_level_1: "Neznámý"
 game_concept_dynasty_prestige_level_2: "Nevýznamný"
 game_concept_dynasty_prestige_level_3: "Pozoruhodný"
 game_concept_dynasty_prestige_level_4: "Vážený"
 game_concept_dynasty_prestige_level_5: "Dobře známý"
 game_concept_dynasty_prestige_level_6: "Významný"
 game_concept_dynasty_prestige_level_7: "Proslulý"
 game_concept_dynasty_prestige_level_8: "Slavný"
 game_concept_dynasty_prestige_level_9: "Opěvovaný"
 game_concept_dynasty_prestige_level_10: "Legendární"
 game_concept_dynasty_prestige_level_0_desc: "#T Prosté kořeny#!\n[GetDynastyPrestigeLevelEffect('(int32)0')][GetDynastyPrestigeLevelNext('(int32)0')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_1_desc: "#T Neznámý#!\n[GetDynastyPrestigeLevelEffect('(int32)1')][GetDynastyPrestigeLevelNext('(int32)1')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_2_desc: "#T Nevýznamný#!\n[GetDynastyPrestigeLevelEffect('(int32)2')][GetDynastyPrestigeLevelNext('(int32)2')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_3_desc: "#T Pozoruhodný#!\n[GetDynastyPrestigeLevelEffect('(int32)3')][GetDynastyPrestigeLevelNext('(int32)3')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_4_desc: "#T Vážený#!\n[GetDynastyPrestigeLevelEffect('(int32)4')][GetDynastyPrestigeLevelNext('(int32)4')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_5_desc: "#T Dobře známý#!\n[GetDynastyPrestigeLevelEffect('(int32)5')][GetDynastyPrestigeLevelNext('(int32)5')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_6_desc: "#T Významný#!\n[GetDynastyPrestigeLevelEffect('(int32)6')][GetDynastyPrestigeLevelNext('(int32)6')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_7_desc: "#T Proslulý#!\n[GetDynastyPrestigeLevelEffect('(int32)7')][GetDynastyPrestigeLevelNext('(int32)7')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_8_desc: "#T Slavný#!\n[GetDynastyPrestigeLevelEffect('(int32)8')][GetDynastyPrestigeLevelNext('(int32)8')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_9_desc: "#T Opěvovaný#!\n[GetDynastyPrestigeLevelEffect('(int32)9')][GetDynastyPrestigeLevelNext('(int32)9')]" # todo: CONCEPT CASE
 game_concept_dynasty_prestige_level_10_desc: "#T Legendární#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\n\nToto je nejvyšší úroveň velkoleposti." # todo: CONCEPT CASE
 game_concept_excommunication_war: "Exkomunikační válka"
 game_concept_excommunicated_ruler: "Exkomunikovaný vládce"
 game_concept_excommunicated_ruler_desc: "V exkomunikační válce útočníci bojují za odstranění [Concept('excommunicated','exkomunikovaného')|El] vládce od moci.\n\nPokud zvítězí, útočníci získají velké množství [Concept('piety','zbožnosti')|El] a přízeň své [Concept('head_of_faith','hlavu víry')|El], zatímco exkomunikovaný vládce je donucen abdikovat ve prospěch svého [Concept('heir','dědice')|El].\n\nPokud však exkomunikovaný vládce zvítězí, jeho [Concept('head_of_faith','hlavy víry')|El] je nucena jeho exkomunikaci odvolat, neboť na bojišti prokázal svou spravedlivost." # todo: CONCEPT CASE
 game_concept_holy_site: "Svaté místo"
 game_concept_holy_sites: "Svatá místa"
 game_concept_holy_site_desc: "Svaté místo je [Concept('county','hrabství')|El], které obsahuje místo náboženského významu pro určitou [Concept('faith','víru')|El]. Svatá místa držená postavou správné víry poskytnou účinek každému, kdo tuto víru vyznává, a mohou také umožnit vytvoření [Concept('special_buildings','zvláštních budov')|El] nebo [Concept('holy_orders','svatých řádů')|El]. Každá víra má odlišnou sadu svatá místa." # todo: CONCEPT CASE
 game_concept_cultural_acceptance_i: "@cultural_acceptance_icon!"
 game_concept_cultural_acceptance: "Kulturní přijetí"
 game_concept_cultural_acceptance_desc: "Kulturní přijetí měří, nakolik se dvě [Concept('cultures','kultury')|El] navzájem přijímají.\n\nPředevším ovlivňuje, o kolik se snižuje [Concept('opinion','mínění')|El] mezi postavami různých kultur. Ovlivňuje také [Concept('county_opinion','mínění hrabství')|El] a cenu vytvoření [Concept('hybrid_culture','hybridní kultury')|El].\n\nKulturní přijetí se může měnit mnoha akcemi, zejména [Concept('wars','válkami')|El], udělováním a odebíráním [Concept('titles','tituly')|El] a [Concept('councillor_task','úkolem rádce')|El] [Concept('accept_culture','přijmout kulturu')|El].\n\nČasem se přijetí vrátí k [Concept('cultural_acceptance_baseline','základní hodnotě kulturnímu přijetí')|El], pokud ji převyšuje." # todo: CONCEPT CASE
 game_concept_cultural_acceptance_baseline: "Základní hodnota kulturního přijetí"
 game_concept_cultural_acceptance_baseline_desc: "[Concept('cultural_acceptance','Kulturní přijetí')|E] má základní hodnotu, k níž bude klesat, pokud ji převyšuje. Základní hodnota závisí na:\n$EFFECT_LIST_BULLET$sdíleném [Concept('heritage','dědictví')|El]\n$EFFECT_LIST_BULLET$sdíleném [Concept('language','jazyk')|El]\n$EFFECT_LIST_BULLET$sdílené [Concept('faith','víře')|El] a [Concept('religion','náboženství')|El], zejména pokud jde o [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] nebo [GetReligionFamily('rf_eastern').GetName]\n$EFFECT_LIST_BULLET$sdíleném [Concept('ethos','étosu')|El] v rámci stejného [Concept('region','regionu')|El]" # todo: CONCEPT CASE
 game_concept_culture_pillar: "Kulturní pilíř"
 game_concept_culture_pillars: "Kulturní pilíře"
 game_concept_culture_pillar_desc: "[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_pillar_desc_REFORM_DLC', 'game_concept_culture_pillar_desc_NO_REFORM_DLC' )]"
 game_concept_culture_pillar_desc_REFORM_DLC: "Pilíře jsou vlastnosti, které odrážejí původ [Concept('culture','kulturu')|El].\n\nExistuje 5 odlišných kulturních pilířů:\n$EFFECT_LIST_BULLET$[Concept('ethos','Étos')|El]\n$EFFECT_LIST_BULLET$[Concept('heritage','Dědictví')|El]\n$EFFECT_LIST_BULLET$[Concept('language','Jazyk')|El]\n$EFFECT_LIST_BULLET$[Concept('martial_custom','Válečnický zvyk')|El]\n$EFFECT_LIST_BULLET$estetika\n\nZ nich může [Concept('culture_head','hlava kultury')|El] změnit étos, jazyk a válečnické zvyky prostřednictvím [Concept('reformation','reformací')|El]." # todo: CONCEPT CASE
 game_concept_culture_pillar_desc_NO_REFORM_DLC: "Pilíře jsou neměnné vlastnosti, které odrážejí původ [Concept('culture','kulturu')|El].\n\nExistuje 5 odlišných kulturních pilířů:\n$EFFECT_LIST_BULLET$[Concept('ethos','Étos')|El]\n$EFFECT_LIST_BULLET$[Concept('heritage','Dědictví')|El]\n$EFFECT_LIST_BULLET$[Concept('language','Jazyk')|El]\n$EFFECT_LIST_BULLET$[Concept('martial_custom','Válečnický zvyk')|El]\n$EFFECT_LIST_BULLET$estetika" # todo: CONCEPT CASE
 game_concept_culture_tradition: "Kulturní tradice"
 game_concept_culture_traditions: "Kulturní tradice"
 game_concept_tradition: "Tradice"
 game_concept_traditions: "Tradice"
 game_concept_culture_tradition_desc: "Tradice představují zvyklosti, návyky, hodnoty a etiku jednotlivých [Concept('cultures','kultur')|El].\n\nKaždá tradice poskytuje určitý druh bonusu nebo zvláštní schopnosti [Concept('characters','postavám')|El] či [Concept('counties','hrabstvím')|El] dané kultury.\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_tradition_desc_REFORM_DLC', 'game_concept_culture_tradition_desc_NO_REFORM_DLC' )]\n\nKultury mohou mít až 6 tradic, ale většina jich má méně." # todo: CONCEPT CASE
 game_concept_culture_tradition_desc_REFORM_DLC: "[Concept('culture_head','Hlava kultury')|E] může pro kulturu zavádět nové tradice nebo nahrazovat stávající prostřednictvím [Concept('reformation','reformací')|El]." # todo: CONCEPT CASE
 game_concept_culture_tradition_desc_NO_REFORM_DLC: "[Concept('culture_head','Hlava kultury')|E] může za cenu [Concept('prestige','prestiž')|El] zavádět pro kulturu nové tradice." # todo: CONCEPT CASE
 game_concept_ethos: "Étos"
 game_concept_ethos_desc: "Étos [Concept('culture','Kultura')|El] určuje její základní hodnoty, vůdčí zásady a obecný postoj jejích členů k životu jako takovému.\n\nÉtos navíc výrazně ovlivňuje náklady, které [Concept('culture_head','hlava kultury')|El] vynakládá na zavádění nových [Concept('traditions','tradice')|El].[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_ethos_desc_REFORM_DLC', '' )]" # todo: CONCEPT CASE
 game_concept_ethos_desc_REFORM_DLC: "\n\n[Concept('culture_head','Hlava kultury')|E] může svůj současný $game_concept_ethos$ nahradit prostřednictvím [Concept('reformation','reformací')|El]." # todo: CONCEPT CASE
 game_concept_language: "Jazyk"
 game_concept_languages: "Jazyky"
 game_concept_language_desc: "Jazyk je [Concept('culture_pillar','kulturní pilíř')|El], který určuje, jakým jazykem mluví běžné obyvatelstvo [Concept('culture','kultury')|El]. Kultury, které mluví stejným jazykem, získávají trvalý bonus k [Concept('cultural_acceptance_baseline','základní hodnotě kulturnímu přijetí')|El].\n\n[Concept('character','Postava')|E] může znát jeden nebo více jazyků. Znalost jazyka snižuje na polovinu postih k [Concept('opinion','mínění')|El] z [Concept('cultural_acceptance','kulturního přijetí')|El] vůči postavám a [Concept('counties','hrabstvím')|El], které jím mluví. Také odrazuje [Concept('faction_independence','frakce za nezávislost')|El] a [Concept('claimant_factions','frakce pretendentů')|El].\n\nPostavy se mohou učit další jazyky pomocí [Concept('scheme','intriky')|El] [GetScheme('learn_language').GetTypeName]. Postavy se mohou pohodlně učit jazyky až do svého [Concept('language_limit','limitu cizích jazyků')|El]." # todo: CONCEPT CASE
 game_concept_language_limit: "Limit cizích jazyků"
 game_concept_language_limit_desc: "Pohodlně si dokážeš zapamatovat jen omezený počet [Concept('languages','jazyků')|El]. Pokud tento limit překročíš, budeš muset některý jazyk zapomenout, nebo utrpíš [Concept('stress','stres')|El].\n\nJazyk, kterým mluví tvá [Concept('culture','kultura')|El], se do tohoto limitu nepočítá.\n\nLimit určují:\n$EFFECT_LIST_BULLET$každý má základ #V 1#!\n$EFFECT_LIST_BULLET$každých [EmptyScope.ScriptValue('language_learning_divide_value')|V0] bodů [learning_i][Concept('learning','učenosti')|E] jej zvyšuje o #V 1#!\n$EFFECT_LIST_BULLET$[Concept('perk','Talent')|E] [GetPerk('open_minded_perk').GetName(GetNullCharacter)] jej zvyšuje o #V 2#!\n$EFFECT_LIST_BULLET$[Concept('perk','Talent')|E] [GetPerk('smooth_operator_perk').GetName(GetNullCharacter)] jej zvyšuje o #V 1#!\n$EFFECT_LIST_BULLET$[Concept('dynasty_perk','Dynastický odkaz')|E] [GetDynastyPerk('ep1_culture_legacy_1').GetName] jej zvyšuje o #V 1#!"
 game_concept_heritage: "Dědictví"
 game_concept_heritage_desc: "Dědictví je [Concept('culture_pillar','kulturní pilíř')|El], který představuje společný původ několika [Concept('cultures','kulturami')|El].\n\nKultury stejného dědictví mají mezi sebou obecně vysoké [Concept( 'cultural_acceptance', 'přijetí' )|El]." # todo: CONCEPT CASE
 game_concept_martial_custom: "Válečnický zvyk"
 game_concept_martial_custom_desc: "Válečnický zvyk je [Concept('culture_pillar','kulturní pilíř')|El], který určuje, která pohlaví mohou působit jako [Concept('commanders','velitelé')|El] nebo [Concept('knights','rytíři')|El].\n\nNěkteré [Concept('traditions','tradice')|El] a [Concept('doctrines','doktríny')|El] mohou tato pravidla pro určité [Concept('characters','postavy')|El] upravovat." # todo: CONCEPT CASE
 game_concept_culture_intermingling: "Mísení kultur"
 game_concept_culture_intermingling_desc: "Čím více dvě [Concept('cultures','kultury')|El] koexistují v témže [Concept('realm','panství')|El], tím více bude docházet k jejich mísení a tím více se zvýší jejich [Concept('cultural_acceptance','kulturní přijetí')|El]."
 game_concept_cultural_head: "Hlava kultury"
 game_concept_culture_head: "Hlava kultury"
 game_concept_culture_head_desc: "„$game_concept_culture_head$“ je [Concept('ruler','vládce')|El], který má největší vliv na svou vlastní [Concept('culture','kulturu')|El].\n\nKonkrétně se hlavou kultury stane vládce s největším celkovým počtem [Concept('counties','hrabstvím')|El] stejné kultury ve svém [Concept('realm','panství')|El], bez ohledu na to, kde se nachází jeho [Concept('domain','doménou')|El] nebo jaká hrabství jiné kultury může vlastnit.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\nHlava kultury může určovat, která [Concept('innovation','inovace')|El] má být upřednostněna k objevení, nastavením [Concept('cultural_fascination','kulturní fascinaci')|El].\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]" # todo: CONCEPT CASE
 game_concept_culture_head_desc_NOMAD_DLC: "\n\n[Concept('nomadic','Kočovný')|E] [Concept('rulers','vládci')|El] však budou svou hlavu kultury volit podle toho, kdo má největší [Concept('herd','stáda')|El], bez ohledu na hodnost. V případě usazených vládců, kteří jsou součástí stejné [Concept('culture','kultury')|El] jako kočovníci, bude rozhodujícím faktorem místo toho [Concept('military_power','vojenské síly')|El]." # todo: CONCEPT CASE
 game_concept_culture_head_desc_REFORM_DLC: "Hlava kultury může také [Concept('reform','reformovat')|El] části své kultury." # todo: CONCEPT CASE
 game_concept_culture_head_desc_NO_REFORM_DLC: "Hlava kultury může také zavádět nové [Concept('traditions','tradice')|El] pro svou kulturu." # todo: CONCEPT CASE
 game_concept_county_opinion: "Lidové mínění"
 game_concept_county_opinion_desc: "Běžné obyvatelstvo každého [Concept('county','hrabství')|El] má [Concept('opinion','mínění')|El] o [Concept('character','postavě')|El], která drží jejich $game_concept_county$. Pokud je obyvatelstvo nespokojené, může založit nebo se připojit k [Concept('peasant_faction','selské frakci')|El] či [Concept('popular_faction','lidové frakci')|El], z nichž kterákoli se může brzy rozšířit po celém [Concept('realm','panství')|El].\n\nNejjednodušším způsobem, jak držet $game_concept_county_opinion$ pod kontrolou, je zajistit, aby [Concept('holder','držitel')|El] $game_concept_county$ měl stejnou [Concept('culture','kultury')|El] a [Concept('faith','víru')|El] jako obyvatelstvo.\n\nLidové mínění z odlišné [Concept('faith','víry')|El] se upravuje podle [Concept('faith_hostility','nepřátelství víry')|El] hrabství i jeho [Concept('fervor','horlivosti')|El], přičemž se lineárně škáluje mezi 0 a 100 $game_concept_fervor$." # todo: CONCEPT CASE
 game_concept_core_tenet: "Zásada"
 game_concept_core_tenet_desc: "Zatímco [Concept('doctrines','doktríny')|El] představují otázky, k nimž musí [Concept('faith','víra')|El] zaujmout postoj, $game_concept_core_tenets$ představují jedinečné zvláštnosti a obřady dané víry."
 game_concept_core_tenets: "Zásady"
 game_concept_holy_war: "Svatá válka"
 game_concept_holy_wars: "Svaté války"
 game_concept_holy_war_holy: "Svatá"
 game_concept_holy_war_desc: "Svatá válka je zvláštní typ [Concept('war','války')|El], kterou vede [Concept('ruler','vládce')|El] jedné [Concept('faith','víry')|El] proti vládci jiné víry.\n\nSvatá válka bývají obvykle poměrně ničivé, přičemž vítěz svaté války si zpravidla zabere všechna [Concept('counties','hrabství')|El] v cílové oblasti. Pokud je však víra útočníka [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] nebo pokud má obránce v cílové oblasti [Concept('vassals','vazaly')|El] stejné víry jako útočník, někteří nebo všichni vazalští vládci v cílové oblasti mohou být místo toho jednoduše převedeni k útočníkovi.\n\nNa rozdíl od jiných válek se vládci stejné víry jako cíl mohou rozhodnout připojit k jeho obraně bez nutnosti [Concept('alliance','aliance')|El].\n\nSvaté války mohou být povoleny nebo omezeny v závislosti na různých [Concept('religious_families','náboženské rodiny')|El]." # todo: CONCEPT CASE
 game_concept_great_holy_war: "Velká svatá válka"
 game_concept_great_holy_wars: "Velké svaté války"
 game_concept_great_holy_war_desc: "Velká svatá válka je zvláštní typ [Concept('war','války')|El], kterou může vyhlásit pouze [Concept('head_of_faith','hlava víry')|El] určitých [Concept('faiths','vír')|El] s cílem přivést celé [Concept('kingdom','království')|El] pod vládu své víry.\n\nVelké svaté války cílí na všechny [Concept('rulers','vládce')|El] jiného [Concept('religion','náboženství')|El] ve zvoleném [Concept('kingdom','království')|El] a nutí je bránit se společně. Pokud útočníci zvítězí, všechny [Concept('titles','tituly')|El] v cílovém království budou zabrány a rozděleny mezi ně.\n\nPodle svých [Concept('doctrines','doktrín')|El] může mít víra přístup ke [Concept('directed_great_holy_wars','směrovaným velkým svatým válkám')|El], [Concept('undirected_great_holy_wars','nesměrovaným velkým svatým válkám')|El], nebo nemusí mít žádné $game_concept_great_holy_wars$ vůbec:\n$EFFECT_LIST_BULLET$k přístupu k velkým svatým válkám obecně jsou vyžadovány [Concept('core_tenets','zásady')|El] [GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName], [GetFaithDoctrine('tenet_struggle_submission').GetBaseName] nebo [GetFaithDoctrine('tenet_warmonger').GetBaseName]\n$EFFECT_LIST_BULLET$víry s [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] hlavou mají přístup pouze ke směrovaným velkým svatým válkám\n$EFFECT_LIST_BULLET$víry s [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] hlavou mají přístup pouze k nesměrovaným velkým svatým válkám\n$EFFECT_LIST_BULLET$víry bez hlavy víry nemohou vyhlásit žádné velké svaté války, i kdyby na ně za běžných okolností měly nárok\n\nNěkteré víry mají pro své velké svaté války zvláštní názvy, například „křížová výprava“ nebo „džihád“. Tyto velké svaté války se liší pouze názvem a fungují jako jakákoli jiná velká svatá válka." # todo: CONCEPT CASE
 game_concept_directed_great_holy_war: "Směrovaná velká svatá válka"
 game_concept_directed_great_holy_wars: "Směrované velké svaté války"
 game_concept_directed_great_holy_war_desc: "Směrovaná velká svatá válka je vyhlašována [Concept('head_of_faith','hlavou víry')|El] typu $doctrine_temporal_head_name$ se záměrem přivést [Concept('kingdom','království')|El] pod vlastní vládu.\n\n[Concept('rulers','Vládci')|E] její [Concept('faith','víry')|El] se mohou rozhodnout hlavě víry pomoci a mohou za to získat odměny. Odměny zahrnují [Concept('piety','zbožnost')|El] a potenciálně i to, že se jejich [Concept('dynasty','dynastie')|El] stane [Concept('landed','zeměpánskou')|El] v dobytém království.\n\nVládci cílového [Concept('religion','náboženství')|El] se mohou rozhodnout bránit proti této válce bez nutnosti [Concept('alliance','aliance')|El]." # todo: CONCEPT CASE
 game_concept_undirected_great_holy_war: "Nesměrovaná velká svatá válka"
 game_concept_undirected_great_holy_wars: "Nesměrované velké svaté války"
 game_concept_undirected_great_holy_war_desc: "Nesměrovaná velká svatá válka je vyhlašována [Concept('head_of_faith','hlavou víry')|El] typu $doctrine_spiritual_head_name$ se záměrem přivést [Concept('kingdom','království')|El] pod vládu její [Concept('faith','víry')|El].\n\nNesměrované velké svaté války nezačínají okamžitě, ale místo toho vstupují do [Concept('preparation_phase','přípravné fáze')|El].\n\nPřed válkou i během ní se vládci útočící víry mohou rozhodnout darovat [Concept('gold','zlato')|El] do [Concept('war_chest','válečné pokladnice')|El].\n\nPokud zvítězí, cílové království bude zabráno a předáno postavě útočící víry. Odměny pro útočníky zahrnují [Concept('piety','zbožnost')|El] a potenciálně i to, že se jejich [Concept('dynasty','dynastie')|El] stane [Concept('landed','zeměpánskou')|El] v dobytém království." # todo: CONCEPT CASE
 game_concept_preparation_phase: "Přípravná fáze"
 game_concept_preparation_phase_desc: "Přípravná fáze je doba před vyhlášením [Concept('undirected_great_holy_war','nesměrovanou velkou svatou válkou')|El].\n\nBěhem této doby se [Concept('rulers','vládci')|El] útočící [Concept('faith','víry')|El] mohou rozhodnout přislíbit vojenskou podporu válce a/nebo přispět do [Concept('war_chest','válečné pokladnice')|El].\n\nČasovač bude odpočítávat čas do konce $game_concept_preparation_phase$, po němž bude válka vyhlášena.\n\nVládci bránících se [Concept('religions','náboženstvím')|El] mohou během této doby přislíbit vlastní vojenskou podporu, čímž poskytnou přehled o síle obou stran." # todo: CONCEPT CASE
 game_concept_war_chest: "Válečná pokladnice"
 game_concept_war_chest_desc: "Válečná pokladnice je soubor [Concept('gold','zlata')|El], [Concept('piety','zbožnosti')|El] a [Concept('prestige','prestiže')|El]. Její obsah se používá především jako odměny za úspěšné vítězství v [Concept('undirected_great_holy_wars','nesměrovaných velkých svatých válkách')|El], kde se rozděluje mezi útočníky podle jejich účasti ve [Concept('war','válce')|El].\n\nUrčitá část obsahu válečné pokladnici se mezi útočníky rozdělí také při vyhlášení války.\n\nPokud je [Concept('undirected_great_holy_war','nesměrovaná velká svatá válka')|El] poražena, obránci si mezi sebe rozdělí zbožnou a prestižní část válečné pokladnice #weak (zlato je ztraceno.)#!" # todo: CONCEPT CASE
 game_concept_crusade: "Křížová výprava"
 game_concept_great_holy_war_undirected: "Nesměrovaná"
 game_concept_crusades: "Křížové výpravy"
 game_concept_jihad: "Džihád"
 game_concept_great_holy_war_directed: "Směrovaná"
 game_concept_jihads: "Džihády"
 game_concept_title_tier: "Úroveň"
 game_concept_title_tiers: "Úrovně"
 game_concept_rank: "Hodnost"
 game_concept_title_rank: "Hodnost"
 game_concept_title_ranks: "Hodnosti"
 game_concept_ranks: "Hodnosti"
 game_concept_title_tier_desc: "Územní protějšek [Concept('rank','hodnosti')|El] titulu, úrovni, určuje postavení [Concept('title','titulu')|El] v hierarchii hry.\n\nVšechny tituly mají úroveň, která určuje nejvyšší možnou úroveň [Concept('vassals','vazalů')|El], které může [Concept('holder','držitel')|El] mít.\n\n[Concept('hegemony','Hegemonie')|E] > [Concept('empire','říše')|E] > [Concept('kingdom','království')|E] > [Concept('duchy','vévodství')|E] > [Concept('county','hrabství')|E] > [Concept('barony','baronství')|E]." # todo: CONCEPT CASE
 game_concept_title_rank_desc: "Osobní protějšek [Concept('title_tier','úrovně titulu')|El], $game_concept_title_rank$, určuje postavení [Concept('ruler','vládce')|El] v hierarchii hry.\n\nVšechny úrovně titulů mají přidruženou hodnost, která určuje nejvyšší možnou hodnost [Concept('vassals','vazalů')|El], které může [Concept('holder','držitel')|El] mít.\n\n[Concept('hegemon','Hegemon')|E] > [Concept('emperor','císař')|E] > [Concept('king','král')|E] > [Concept('duke','vévoda')|E] > [Concept('count','hrabě')|E] > [Concept('baron','baron')|E]." # todo: CONCEPT CASE
 game_concept_clergy: "Duchovenstvo"
 game_concept_clergy_desc: "[Concept('court_chaplains','Dvorní kaplani')|E], [Concept('realm_priests','vrchní duchovní')|El], [Concept('theocratic','teokratičtí')|El] vládci a kdokoli s rysem [GetTrait('devoted').GetName( GetNullCharacter )] jsou považováni za členy duchovenstva.\n\n[Concept('doctrines','Doktríny')|E] [Concept('faith','víry')|El] určují, kdo může být členem duchovenstva a zda se členové duchovenstva mohou ženit, dědit půdu atd."
 game_concept_church_property: "Církevní državy"
 game_concept_church_holdings: "Církevní državy"
 game_concept_church_holding: "Církevní država"
 game_concept_church: "Církev"
 game_concept_church_property_desc: "Církevní državy jsou [Concept('temples','chrámy')|El] pod kontrolou [Concept('realm_priest','vrchního duchovního')|El].\n\nVe [Concept('faiths','vírech')|El] s [Concept('doctrine','doktrínou')|El] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] neexistují žádné církevní državy a [Concept('temples','chrámy')|El] mohou bez postihu přímo držet světští [Concept('rulers','vládci')|El]." # todo: CONCEPT CASE
 game_concept_temple_citadel: "Chrámová citadela"
 game_concept_temple_citadels: "Chrámové citadely"
 game_concept_temple_citadel_holding: "Država chrámové citadely"
 game_concept_temple_citadel_holdings: "Državy chrámových citadel"
 game_concept_temple_citadel_holding_desc: "Chrámové citadely jsou praktickou směsí [Concept('castle','hradního')|El] opevnění a [Concept('temple','chrámového')|El] uctívání — jde o standardní [Concept('holding_type','typ državy')|El] pro [Concept('mandala','mandalové')|El] [Concept('rulers','vládce')|El]. Poskytují vyrovnané množství [Concept('levies','odvedence')|El], [Concept('piety','zbožnost')|El] a [Concept('taxes','daní')|El]." # todo: CONCEPT CASE
 game_concept_embarking: "Naloďování"
 game_concept_embarked: "Naloděno"
 game_concept_embarked_i: "@embarked_icon!"
 game_concept_embark: "Nalodit"
 game_concept_embarkation: "Nalodění"
 game_concept_embarking_desc: "[Concept('army','Armáda')|E] se automaticky $game_concept_embark$ na [Concept('fleet','loďstvo')|El], když dostane rozkaz k přesunu do mořské zóny nebo když k cílovému [Concept('barony','baronství')|El] nevede žádná pozemní cesta.\n\nNaloďování stojí určité množství [Concept('gold','zlata')|El], což představuje opatření a stavbu lodí. Za každých #V 100#! mužů, kteří se nalodí, se zaplatí #V [GetDefine('NFleet', 'EMBARK_GOLD_COST_PER_HUNDRED')|0]#! [gold_i]." # todo: CONCEPT CASE
 game_concept_era: "Éra"
 game_concept_eras: "Éry"
 game_concept_era_desc: "[Concept('innovations','Inovace')|E] lze objevit pouze tehdy, pokud [Concept('culture','kultura')|El] dosáhla požadované éry. Další éra může začít až po určitém roce a pokud bylo objeveno alespoň #V 50 %#! inovací předchozí éry.\n\nVládci s [Concept('tribal_government','kmenovou vládou')|El] a [Concept('nomadic_government','kočovnou vládou')|El] mohou využívat pouze inovace kmenové éry."
 game_concept_innovation: "Inovace"
 game_concept_innovations: "Inovace"
 game_concept_innovation_desc: "Inovace jsou technologie a jiné pokroky, které prospívají všem postavám určité [Concept('culture','kulturu')|El]. Inovace jsou seskupeny do [Concept('eras','ér')|El], v nichž mohou být objeveny.\n\nDíky styku se sousedními kulturami je každá kultura vždy [Concept('spread','šířena')|El] směrem k jedné konkrétní inovaci, která bude objevena mnohem rychleji.\n\nKromě toho může [Concept('culture_head','hlava kultury')|El] nastavit jinou (nebo stejnou) inovaci jako [Concept('cultural_fascination','kulturní fascinaci')|El] pro dodatečné urychlení." # todo: CONCEPT CASE
 game_concept_cultural_fascination: "Kulturní fascinace"
 game_concept_fascination: "Fascinace"
 game_concept_cultural_fascination_desc: "Každá kultura je vždy fascinována určitou [Concept('innovation','inovací')|El], což výrazně zvyšuje rychlost jejího objevování podle [Concept('skills','dovedností')|El] současné [Concept('culture_head','hlavy kultury')|El]. Každé inovaci prospívá určitá dovednost.\n\nHlava kultury může kulturní fascinaci libovolně měnit."
 game_concept_cultural_spread: "Kulturní šíření"
 game_concept_spread: "Šíření"
 game_concept_cultural_spread_desc: "Styk s jinými [Concept('cultures','kulturami')|El], které mají neobjevené [Concept('innovations','inovací')|El], způsobí, že jedna z těchto inovace bude objevována rychleji. Mezi způsobilými [Concept('cultures','kulturami')|El] bude k šíření pokroku [Concept('innovation','inovaci')|El] vybrána ta s nejvyšším [Concept('cultural_acceptance','kulturním přijetím')|El]." # todo: CONCEPT CASE
 game_concept_congenital: "Vrozený"
 game_concept_congenital_trait: "Vrozený rys"
 game_concept_congenital_traits: "Vrozené rysy"
 game_concept_congenital_desc: "Některé [Concept('traits','rysy')|El] jsou vrozené a mohou je zdědit potomci. Správným [Concept('breeding','šlechtěním')|El] je dokonce možné některé takové rysy posílit.\n\nPokud jsou například oba rodiče [GetTrait('intellect_good_1').GetName( GetNullCharacter )], existuje šance, že jejich děti získají ještě lepší rys [GetTrait('intellect_good_2').GetName( GetNullCharacter )].\n\nZákladní [Concept('skills','dovednosti')|El] vrozené nejsou."
 game_concept_breeding: "Šlechtění"
 game_concept_bred: "Vyšlechtěný"
 game_concept_breed: "Šlechtit"
 game_concept_breeding_desc: "Sjednáváním [Concept('marriages','sňatky')|El] mezi postavami s dobrými [Concept('congenital','vrozeným')|El] [Concept('traits','rysy')|El] je možné vyšlechtit děti se stejnými rysy. Šťastní potomci mohou dokonce získat posílenou verzi takových rysů.\n\nTotéž však platí i pro špatné vrozené rysy, jako je [GetTrait('beauty_bad_2').GetName( GetNullCharacter )].\n\nMůže být lákavé sjednávat sňatky mezi blízce příbuznými postavami, aby se u tvých dětí objevily lepší rysy, ale to s sebou nese také riziko vad způsobených [Concept('inbreeding','příbuzenského křížení')|El]." # todo: CONCEPT CASE
 game_concept_inbreeding: "Příbuzenské křížení"
 game_concept_inbred: "Zdegenerovaný"
 game_concept_inbreeding_desc: "[Concept('children','Děti')|E] dvou blízce příbuzných [Concept('characters','postav')|El] se mohou narodit s [Concept('congenital','vrozenou')|El] vadou, z nichž nejvážnější je [Concept('trait','rys')|El] [GetTrait('inbred').GetName( GetNullCharacter )].\n\nV první generaci je to vzácné, ale opakované $game_concept_inbreeding$ riziko zvyšuje.\n\nGenerace $game_concept_inbreeding$ však mohou vést i k prospěšnému rysu [GetTrait('pure_blooded').GetName( GetNullCharacter )], který (pokud ho sdílejí oba rodiče) činí potomky imunními vůči vrozeným vadám, protože všechny vady byly [Concept('bred','vyšlechtěny')|El] z pokrevní linie." # todo: CONCEPT CASE
 game_concept_cadet_branching: "Zakládání kadetských větví"
 game_concept_cadet_branch: "Kadetská větev"
 game_concept_cadet_branches: "Kadetské větve"
 game_concept_cadet_branching_desc: "[Concept('dynasties','Dynastie')|E] mají vždy zakladatelský [Concept('house','rod')|El], ale aby se členové [Concept('house','rodem')|El] sami mohli stát [Concept('house_heads','hlavami rodu')|El], mohou se rozhodnout založit vlastní nový rod — kadetská větev.\n\nČlenové takových odnoží rodu mohou učinit totéž, což nakonec vytvoří strom rodů uvnitř širší dynastie." # todo: CONCEPT CASE
 game_concept_house_head_interaction: "Interakce hlavy rodu"
 game_concept_house_head_interaction_desc: "Zvláštní [Concept('interactions','interakce')|El], které může [Concept('house_head','hlava rodu')|El] použít vůči členům svého [Concept('house','rodu')|El]."
 game_concept_demand_conversion: "Požadovat konverzi"
 game_concept_demanding_conversion: "Požadování konverze"
 game_concept_demand_conversion_desc: "[Concept('rulers','Vládci')|E], kteří mají poddaného jiné [Concept('faith','víry')|El], mohou požadovat konverzi, aby změnili víru svého poddaného na svou vlastní. [Concept('learning','Učenost')|E] vládce a [Concept('opinion','mínění')|El] poddaného o jeho lenním pánovi jsou hlavními faktory určujícími, zda poddaný požadavek přijme, nebo jej [Concept('refuse_conversion_crime','odmítne')|El]."
 game_concept_damage: "Poškození"
 game_concept_damage_desc: "Poškození [Concept('soldier','Voják')|El] určuje, kolik [Concept('casualties','ztráty')|El] dokáže způsobit nepříteli během [Concept('battle','bitvy')|El].\n\n[Concept('levy','Odvedenec')|E] způsobuje [GetDefine('NCombat', 'LEVY_ATTACK')|0] poškození." # todo: CONCEPT CASE
 game_concept_toughness: "Houževnatost"
 game_concept_toughness_desc: "Houževnatost [Concept('soldier','Voják')|El] určuje, kolik [Concept('damage','poškození')|El] dokáže vydržet v [Concept('battle','bitvě')|El], než se stane [Concept('casualty','ztrátou')|El].\n\n[Concept('levy','Odvedenec')|E] má [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] odolnosti." # todo: CONCEPT CASE
 game_concept_pursuit: "Pronásledování"
 game_concept_pursuit_desc: "Vítězná [Concept('army','armáda')|El] zvyšuje množství [Concept('casualties','ztrát')|El], které způsobí v [Concept('aftermath','dohře')|El] [Concept('battle','bitvě')|El], o kombinovanou hodnotu pronásledování své armádu, čímž mění [Concept('routed_soldiers','rozprášené vojáky')|El] na [Concept('dead_soldiers','mrtvé vojáky')|El]." # todo: CONCEPT CASE
 game_concept_screen: "Krytí"
 game_concept_screen_desc: "Poražená [Concept('army','armáda')|El] snižuje množství [Concept('casualties','ztrát')|El], které utrpí v [Concept('aftermath','dohře')|El] [Concept('battle','bitvě')|El], o kombinovanou hodnotu krytí své armády." # todo: CONCEPT CASE
 game_concept_siege_progress: "Postup obléhání"
 game_concept_siege_progress_desc: "Postup obléhání ukazuje, jak blízko je [Concept('siege','obléhání')|El] dokončení a jak dlouho se očekává, že bude $game_concept_siege$ trvat. Když je postup plný, [Concept('holding','država')|El] bude [Concept('occupied','obsazena')|El].\n\nPotřebné množství $game_concept_siege_progress$ ovlivňuje [Concept('fort_level','úroveň pevnosti')|El] a obsazenost [Concept('garrison','posádky')|El].\n\nPostup se získává denně a ovlivňují jej obléhací události. Lze jej také zvýšit pomocí [Concept('siege_weapons','obléhacích zbraní')|El] nebo [Concept('army','armády')|El], která výrazně přečísluje [Concept('garrison','posádku')|El]." # todo: CONCEPT CASE
 game_concept_siege_weapon: "Obléhací zbraň"
 game_concept_siege_weapons: "Obléhací zbraně"
 game_concept_siege_weapon_desc: "Obléhací zbraně jsou [Concept('men_at_arms','ozbrojenci')|El], kteří se plně zaměřují na [Concept('sieges','obléhání')|El].\n\nNemají vliv na [Concept('battles','bitvy')|El], ale výrazně urychlí dokončení $game_concept_siege$ zvýšením [Concept('siege_progress','postupem obléhání')|El].\n\nObléhací zbraně jsou však účinné pouze při obléhání [Concept('holdings','državách')|El] do určité [Concept('fort_level','úrovně pevnosti')|El]." # todo: CONCEPT CASE
 game_concept_completely_controls: "Zcela ovládá"
 game_concept_completely_control: "Zcela ovládat"
 game_concept_completely_controlled: "Zcela ovládáno"
 game_concept_complete_control: "Úplná kontrola"
 game_concept_complete_control_desc: "Tato podmínka je splněna, když všechny [Concept('de_jure','de iure')|El] vazalské [Concept('titles','tituly')|El] cílového titulu drží buď [Concept('ruler','vládce')|El], nebo jeho [Concept('vassals','vazalů')|El], a žádné z jeho hrabství není [Concept('occupied','obsazeno')|El] nepřátelskými [Concept('armies','armádami')|El]." # todo: CONCEPT CASE
 game_concept_complete_control_region: "Úplná kontrola"
 game_concept_completely_controls_region: "Zcela ovládá"
 game_concept_completely_control_region: "Zcela ovládat"
 game_concept_complete_control_region_desc: "Tato podmínka je splněna, když všechna [Concept('counties','hrabství')|El] v cílovém [Concept('region','regionu')|El] drží buď vládce, nebo jeho [Concept('vassals','vazalů')|El], a žádné z jeho hrabství není obsazeno nepřátelskými armádami." # todo: CONCEPT CASE
 game_concept_region: "Region"
 game_concept_regions: "Regiony"
 game_concept_region_desc: "Region představuje určitou zeměpisnou oblast na mapě. Na rozdíl od [Concept('de_jure','de iure')|El] se regiony nikdy nemění."
 game_concept_recently_disembarked: "Nedávno vyloděno"
 game_concept_recently_disembarked_desc: "[Concept('army','Armáda')|E] se stane „$game_concept_recently_disembarked$“ pokaždé, když se vylodí poté, co byla na moři. To způsobí, že $game_concept_army$ utrpí na určitou dobu postih k [Concept('advantage','výhodě')|El] v [Concept('battles','bitvách')|El]."
 game_concept_diplomatic_range: "Diplomatický dosah"
 game_concept_range: "Dosah"
 game_concept_diplomatic_range_desc: "Můžeš jednat pouze s postavami, které jsou v diplomatickém dosahu. Sousední [Concept('realms','panství')|El] jsou však vždy v dosahu."
 game_concept_mongol_empire: "Mongolská říše"
 game_concept_mongol_empire_desc: "[Concept('empire','Říšský')|E] [Concept('title','Titul')|El], který může vytvořit mocný kmenový vládce ve stepích. Umožňuje [Concept('mongol_invasion_casus_belli','casus belli mongolské invaze')|El].\n\nTitul se vytvoří přijetím [Concept('decision','rozhodnutím')|El] #EMP $become_greatest_of_khans_decision$#!." # todo: CONCEPT CASE
 game_concept_mongol_invasion_casus_belli: "Casus belli mongolské invaze"
 game_concept_mongol_invasion_casus_belli_desc: "Mocný [Concept('casus_belli','casus belli')|El] dostupný pouze [Concept('ruler','vládci')|El] [Concept('mongol_empire','Mongolské říše')|El].\n\nMůže cílit na celé [Concept('kingdom','království')|El] najednou a umožňuje rychlé rozšiřování po rozsáhlých územích."
 game_concept_hungarian_invasion_casus_belli: "$HUNGARIAN_INVASION_CB_NAME$ — casus belli"
 game_concept_hungarian_invasion: "$HUNGARIAN_INVASION_CB_NAME$"
 game_concept_hungarian_invasion_casus_belli_desc: "Mocný [Concept('casus_belli','casus belli')|El], který lze za celou kampaň použít pouze jednou k dobytí všech území, jež cíl drží v Panonii.\n\nPři vítězství se všichni $mogyer_collective_noun$ v [Concept('realm','panství')|El] útočníka přesunou s ním do Panonie, [Concept('counties','hrabství')|El] #EMP i#! [Concept('vassals','vazalové')|El], a vytlačí $avar$ $game_concept_counties$. Ostatní vazalové mimo Panonii budou opuštěni, zatímco $game_concept_counties$ dříve obsazená nebo držená $mogyer_collective_noun$ budou ponechána místním drobným vojevůdcům a soupeřícím stepním kmenům."
 game_concept_pax_romana_invasion_casus_belli: "Casus belli Pax Romana"
 game_concept_pax_romana_invasion_casus_belli_desc: "Mocný [Concept('casus_belli','casus belli')|El] dostupný pouze [Concept('ruler','vládci')|El] Římské říše za účelem zahájení nové éry [Glossary( 'Pax Romana', 'PAX_ROMANA_GLOSS' )].\n\nMůže cílit na celý [Concept('title','titul')|El] úrovně [Concept('empire','říše')|El] najednou a umožňuje rychlé rozšiřování po rozsáhlých územích."
 game_concept_eastern_roman_empire: "Východořímská říše"
 game_concept_eastern_roman_empire_desc: "[Concept('title','Titul')|E] úrovně [Concept('empire','říše')|El], který může vytvořit držitel Římské říše.\n\nTitul se vytvoří přijetím [Concept('decision','rozhodnutím')|El] #EMP $split_roman_empire_decision$#!." # todo: CONCEPT CASE
 game_concept_imperial_expedition_cb: "Císařské tažení"
 game_concept_imperial_expedition_cb_expedition: "Tažení"
 game_concept_imperial_expedition_cb_desc: "Mimořádně mocný [Concept('casus_belli','casus belli')|El] použitelný [Concept('co_emperors','spolucísaři')|El] v $game_concept_duumvirates$.\n\nCísařské tažení může být zahájena proti jakémukoli [Concept('realm','panství')|El], které buď sousedí s [Concept('empire','říší')|El], nebo drží země, jež [Concept('de_jure','de iure')|El] náleží staršímu císaři.\n\nMůže (a zpravidla bude) cílit na #BER všechna#! [Concept('duchies','vévodství')|El], která de facto sousedí s říší nebo k ní de iure náležejí.\n\nDále bude každý [Concept('governor','guvernér')|El] sousedící s obráncem nuceně povolán do [Concept('war','války')|El] jako [Concept('ally','spojenec')|El]. Vzdálení $game_concept_governors$ s vojenskými [Concept('province_administrations','správami provincií')|El] se mohou do konfliktu volitelně připojit.\n\nPokud je $game_concept_war$ vyhrána, $game_concept_co_emperor$ se musí rozhodnout mezi:\n$EFFECT_LIST_BULLET$předáním dobytých zemí svému staršímu císaři výměnou za [Concept('influence','vliv')|El] a [Concept('opinion','mínění')|El]\n$EFFECT_LIST_BULLET$ponecháním území pro sebe (za cenu mínění)\n$EFFECT_LIST_BULLET$předáním většiny z nich, ale ponecháním nejlepšího [Concept('duchy','vévodství')|El] (mírně snížený [Concept('influence','vliv')|El] a [Concept('opinion','mínění')|El])\n$EFFECT_LIST_BULLET$jmenováním místních prozatímních guvernérů, kteří mu budou zavázáni\n\n#WEAK Všechny odměny se škálují podle zabrané země: velké dobytí přinese #EMP výrazně#! více $game_concept_influence$ než malá pohraniční válka.#!" # todo: CONCEPT CASE
 game_concept_knight: "Rytíř"
 game_concept_knights: "Rytíři"
 game_concept_knight_i: "@knight_icon!"
 game_concept_knights_possessive: "Rytířův"
 game_concept_knight_desc: "Rytíř je [Concept('vassal','vazal')|El], [Concept('courtier','dvořan')|El] nebo [Concept('follower','družiník')|El], který bojuje přímo ve tvé [Concept('army','armádě')|El].\n\nBěhem [Concept('battles','bitev')|El] rytířů využívají svou [Concept('prowess_skill','udatnost')|El], aby bojovali účinněji. Vysoká $game_concept_prowess$ znamená, že dokážou nepříteli způsobit více poškození a mají větší šanci přežít, nebo dokonce vyváznout z bitvy bez úhony.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Rytíři mohou být známi pod různými názvy v závislosti na [Concept('culture','kulturu')|El] nebo [Concept('faith','víře')|El]. Například $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ nebo $knight_baghatur_no_tooltip_plural$.\n\nRytíři představují jak samotnou postavu, tak její vojenskou družinu.#!" # todo: CONCEPT CASE
 game_concept_knight_desc_TOTO_DLC: "Získáš [Concept('prestige','prestiž')|El] pokaždé, když se jeden z tvých rytířů úspěšně [Concept('contest_qualifies','kvalifikuje')|El] do [Concept('contest','soutěže')|El] [GetActivityType( 'activity_tournament' ).GetName] nebo v ní zvítězí.\n\n" # todo: CONCEPT CASE
 game_concept_knight_desc_NO_TOTO_DLC: ""
 game_concept_knight_desc_ACCOLADE_DLC: "Rytíři, kterým je uděleno [Concept('accolade','vyznamenání')|El], se stanou [Concept('acclaimed_knights','uznávanými rytíři')|El].\n\n"
 game_concept_knight_effectiveness: "Účinnost rytířů"
 game_concept_knight_effectiveness_desc: "Účinnost rytířů [Concept('ruler','Vládce')|El] určuje, jak dobře jeho [Concept('knights','rytířů')|El] bojují v [Concept('battle','bitvě')|El].\n\nPři 100 % bojují rytíři normálně, ale při 200 % bojují, jako by jejich [Concept('prowess','udatnost')|El] byla dvojnásobná." # todo: CONCEPT CASE
 game_concept_short_reign: "Krátká vláda"
 game_concept_short_reign_desc: "„Krátká vláda“ je postupně slábnoucí postih k [Concept('opinion','mínění')|El], který mají všechny postavy v [Concept('realm','panství')|El] vůči novému [Concept('liege','lennímu pánovi')|El].\n\nPodobným způsobem získávají poddaní rostoucí bonus k [Concept('opinion','mínění')|El] [Concept('long_reign','dlouhé vládě')|El] vůči lenním pánům, kteří nad nimi vládnou dlouho." # todo: CONCEPT CASE
 game_concept_long_reign: "Dlouhá vláda"
 game_concept_long_reign_desc: "„Dlouhá vláda“ je rostoucí bonus k [Concept('opinion','mínění')|El], který mají všechny postavy v [Concept('realm','panství')|El] vůči [Concept('liege','lennímu pánovi')|El], jenž nad nimi vládne dlouho.\n\nPodobně mají poddaní vůči novým lenním pánům postupně slábnoucí postih k [Concept('opinion','mínění')|El] [Concept('short_reign','krátké vládě')|El]." # todo: CONCEPT CASE
 game_concept_troop_quality: "Kvalita"
 game_concept_troop_quality_desc: "Kvalita posuzuje sílu [Concept('army','armádu')|El] vzhledem k počtu jejích [Concept('soldiers','vojáků')|El].\n\nArmáda, která obsahuje pouze [Concept('knights','rytíře')|El] a [Concept('men_at_arms','ozbrojence')|El], bude mít vysokou kvalitu, zatímco $game_concept_army$ obsahující velké množství [Concept('levies','odvedenců')|El] bude mít $game_concept_troop_quality$ nižší.\n\nTo znamená, že menší $game_concept_army$ s vysokou kvalitou může bojovat výrazně nad svou váhovou kategorií — před střetem s nepřítelem pečlivě zvaž jak počet vojáků, #Emphasis tak#! $game_concept_troop_quality$!" # todo: CONCEPT CASE
 game_concept_religious_family: "Náboženská rodina"
 game_concept_religious_families: "Náboženské rodiny"
 game_concept_religious_family_desc: "Náboženská rodina je skupina [Concept('religions','náboženství')|El]. Náboženská rodina ovlivňuje, jak se jednotlivá náboženství a jejich [Concept('faiths','víry')|El] navzájem vnímají.\n\nRodina [GetReligionFamily('rf_abrahamic').GetName] schvaluje [Concept('holy_wars','svaté války')|El] proti všem #weak (včetně jiných abrahámovských věr)#!. Náboženství jsou náchylná ke [Concept('heresy','kacířství')|El].\n\nRodina [GetReligionFamily('rf_eastern').GetName] schvaluje svaté války pouze proti jiným náboženským rodinám.\n\nRodina [GetReligionFamily('rf_pagan').GetName] schvaluje svaté války proti všem, ale víry uvnitř těchto náboženství musí být reformovány, aby k nim získaly přístup." # todo: CONCEPT CASE
 game_concept_debt: "Dluh"
 game_concept_debt_desc: "Dluh je stav, kdy máš záporné množství [gold_i][Concept('gold','zlata')|E]. Obvykle k tomu dochází, když [Concept('ruler','vládce')|El] ve válce najme [Concept('mercenaries','žoldnéře')|El], aniž by měl dost zlata na pokrytí celé ceny, nebo když válčí příliš dlouho.\n\n Dokud jsi v dluhu, nemůžeš vyhlašovat nové [Concept('wars','války')|El], tvoji [Concept('men_at_arms','ozbrojence')|El] se nedoplňují a nepřátelé nad tebou budou mít v bitvě [Concept('advantage','výhodě')|El]. Čím hlouběji do dluhu se propadneš, tím více postihů získáš — méně [Concept('levies','odvedenců')|El], nižší [Concept('county_opinion','lidové mínění')|El] a tvoji [Concept('vassals','vazaly')|El] tě budou mít méně rádi.\n\nKromě toho může dojít k různým menším destabilizačním událostem, například ke vzniku [Concept('county_corruption','korupcím v hrabství')|El] ve [Concept('counties','hrabství')|El] tvé [Concept('domain','doméně')|El]. \n\n#help Obecně je dobrý nápad udeřit na nepřátele, když jsou v dluhu, protože budou bojovat se sníženou [Concept('advantage','výhodou')|El]!#!" # todo: CONCEPT CASE
 game_concept_treasury_debt: "Dluh pokladnice"
 game_concept_treasury_debt_desc: "Dluh pokladnice je stav, kdy máš záporné množství [treasury_i][Concept('treasury','pokladnice')|E]. Obvykle k tomu dochází, když [Concept('governor','guvernér')|El] ve válce najme [Concept('mercenaries','žoldnéře')|El], aniž by měl v pokladnici dost prostředků na pokrytí celé ceny, když válčí příliš dlouho, nebo pokud vyplácí příliš mnoho na [Concept( 'treasury_budgeting', 'rozpočtování pokladnice' )|El] vzhledem k tomu, co vybírá od svých [Concept('vassals','vazalů')|El].\n\n Dokud jsi v dluhu, nemůžeš vyhlašovat nové [Concept('wars','války')|El], tvoji [Concept('men_at_arms','ozbrojence')|El] závislí na pokladnici se nedoplňují a nepřátelé nad tebou budou mít v bitvě [Concept('advantage','výhodě')|El]. Čím hlouběji do dluhu se propadneš, tím více postihů získáš — méně [Concept('levies','odvedenců')|El], nižší [Concept('county_opinion','lidové mínění')|El] a tvoji [Concept('vassals','vazaly')|El] tě budou mít méně rádi.\n\nKromě toho může dojít k různým menším destabilizačním událostem, například ke vzniku [Concept('county_corruption','korupcím v hrabství')|El] ve [Concept('counties','hrabství')|El] tvé [Concept('domain','doméně')|El]. \n\n#help Obecně je dobrý nápad udeřit na nepřátele, když jsou v dluhu, protože budou bojovat se sníženou [Concept('advantage','výhodou')|El]!#!" # todo: CONCEPT CASE
 game_concept_beneficiary: "Příjemce"
 game_concept_beneficiaries: "Příjemci"
 game_concept_beneficiary_desc: "Každý účastník [Concept('great_holy_war','velké svaté války')|El] může vybrat $game_concept_beneficiary$ ze své [Concept('dynasty','dynastie')|El]. Po vítězství příjemci obdrží země v cílovém panství úměrně [Concept('war_contribution','válečnému příspěvku')|El] svého vládnoucího patrona.\n\nNejvětší přispěvatel může prosadit, aby jeho příjemce obdržel hlavní titul, o který se bojuje." # todo: CONCEPT CASE
 game_concept_papal_recipient: "Upřednostněný kandidát"
 game_concept_papal_recipient_desc: "Pokud hlavní cíl [Concept('great_holy_war','velké svaté války')|El] již drží nebo nárokuje člen útočící víry, bude považován za právoplatného příjemce titulu, o který se bojuje, pokud se hlavní [Concept( 'war_contribution', 'přispěvatel' )|El] nerozhodne dát přednost svému [Concept('beneficiary','příjemci')|El]."
 game_concept_end_date: "Datum konce"
 game_concept_end_date_desc: "Rok 1453 po Kristu je datem konce a při jeho dosažení hra skončí."
 game_concept_realm_size: "Velikost panství"
 game_concept_realm_size_desc: "Velikost panství postavy je počet [Concept('counties','hrabství')|El], která vlastní ona a její [Concept('vassals','vazalové')|El]." # todo: CONCEPT CASE
 game_concept_voter_strength: "Síla volitele"
 game_concept_voting_strength: "Síla hlasu"
 game_concept_voting_power: "Hlasovací moc"
 game_concept_voter_strength_desc: "Síla volitele představuje míru vlivu, kterou má volitel při hlasování ve volitelném [Concept('succession_law','zákoně nástupnictví')|El]. Tato hodnota se obvykle zvyšuje podle [Concept('rank','hodnosti')|El] vládce, ale podle zákona [Concept('titlepossessive','titulu')|El] mohou hrát roli i jiné faktory." # todo: CONCEPT CASE
 game_concept_stress_level: "Úroveň stresu"
 game_concept_stress_levels: "Úrovně stresu"
 game_concept_stressed: "Ve stresu"
 game_concept_stress_level_desc: "Každých 100 [Concept('stress','stresu')|El], které postava nashromáždí, jí také zvýší úroveň stresu. Úrovně stresu se pohybují od 0 do 3 a každá úroveň ukládá rostoucí postihy k [Concept('fertility','plodnosti')|El] a [Concept('health','zdraví')|El] postavy.\n\nDokud má postava alespoň 1 úroveň stresu, je navíc náchylná k [Concept('mental_breaks','duševnímu zhroucení')|El]." # todo: CONCEPT CASE
 game_concept_mental_break: "Duševní zhroucení"
 game_concept_mental_breaks: "Duševní zhroucení"
 game_concept_mental_break_desc: "Když [Concept('stress','stres')|El] postavu přemůže, zažije duševní zhroucení — osobní krizi, v níž cítí, že musí udělat něco pro snížení svého stresu bez ohledu na cenu.\n\nPostavy trpící duševním zhroucením budou mít několik způsobů, jak se se situací vypořádat, i když mnohé z nich budou mít záporné následky.\n\nPři nízkých [Concept('stress_levels','úrovni stresu')|El] jsou tyto následky mírné a snadno zvládnutelné. Jak však úroveň stresu roste, rostou i tyto následky, až nakonec vedou k šílenství, či dokonce smrti." # todo: CONCEPT CASE
 stress_icon_tooltip: "$game_concept_mental_break_desc$"
 game_concept_clergy_opinion: "Mínění duchovenstva"
 game_concept_clergy_opinion_desc: "Tento typ [Concept('opinion','mínění')|El] ovlivňuje pouze [Concept('clergy','duchovenstvo')|El] tvé vlastní [Concept('faith','víry')|El]."
 game_concept_secular_opinion: "Světské mínění"
 game_concept_secular_opinion_desc: "Tento typ [Concept('opinion','mínění')|El] ovlivňuje všechny postavy, které #emphasis nejsou#! [Concept('clergy','duchovenstvem')|El]."
 game_concept_title_allegiance: "Věrnost titulu"
 game_concept_title_allegiance_desc: "[Concept('vassals','Vazalové')|E] mohou být vázáni věrností konkrétnímu [Concept('title','titulu')|El] namísto osobě svého [Concept('liege','lenního pána')|El]. To se může stát pouze tehdy, pokud má titul vlastní [Concept('succession_law','zákon nástupnictví')|El]. Při [Concept('succession','nástupnictví')|El] se takoví vazalové stanou vazaly nového [Concept('holder','držitele')|El] titulu."
 game_concept_nominate: "Nominovat"
 game_concept_nominate_heir: "Nominovat dědice"
 game_concept_nomination: "Nominace"
 game_concept_nominations: "Nominace"
 game_concept_nominate_desc: "Pod volitelnými [Concept('succession_laws','zákony nástupnictví')|El] může každý [Concept('elector','volitel')|El] nominovat svého upřednostňovaného [Concept('title_heir','dědice titulu')|El]. Platní kandidáti a hlasovací preference volitelů se liší podle konkrétního zákona."
 game_concept_elector: "Volitel"
 game_concept_electors: "Volitelé"
 game_concept_elector_desc: "Volitelé jsou postavy, které mohou podle volitelných [Concept('succession_laws','zákonů nástupnictví')|El] hlasovat pro svého upřednostňovaného [Concept('title_heir','dědice titulu')|El]. Konkrétní zákon určuje, kdo je považován za volitele."
 game_concept_attraction: "Přitažlivost"
 game_concept_attracted: "Přitahován"
 game_concept_attraction_desc: "Přitažlivost je typ [Concept('opinion','mínění')|El], který ovlivňuje pouze postavy, jejichž [Concept('sexuality','sexuální orientace')|El] odpovídá tvému pohlaví.\n\nNapříklad [Concept('homosexual','homosexuální')|El] muž by toto mínění pociťoval vůči jiným mužům, [Concept('asexual','asexuální')|El] postava by jej nepociťovala vůči nikomu a [Concept('heterosexual','heterosexuální')|El] žena by jej pociťovala vůči mužům.\n\nTento typ mínění přestává mít účinek u žen starších než [GetDefine('NCharacter', 'FEMALE_ATTRACTION_CUTOFF_AGE')] let a u mužů starších než [GetDefine('NCharacter', 'MALE_ATTRACTION_CUTOFF_AGE')] let." # todo: CONCEPT CASE
 game_concept_sexuality: "Sexuální orientace"
 game_concept_sexuality_desc: "Sexuální orientace postavy určuje, které jiné postavy ji mohou potenciálně [Concept('attracted','přitahovat')|El].\n\nSexuální orientace nemá vliv na to, koho si postava může [Concept('marry','uzavřít sňatek')|El], ale může snížit [Concept('fertility','plodnost')|El] manželského páru, pokud některý z chotí neodpovídá preferenci toho druhého.\n\nOmezené sexuální orientace znázorněné v #EMP Crusader Kings III#! zahrnují:\n$EFFECT_LIST_BULLET$[Concept('heterosexual','Heterosexuální')|E]\n$EFFECT_LIST_BULLET$[Concept('homosexual','Homosexuální')|E]\n$EFFECT_LIST_BULLET$[Concept('bisexual','Bisexuální')|E]\n$EFFECT_LIST_BULLET$[Concept('asexual','Asexuální')|E]" # todo: CONCEPT CASE
 sexuality_ho: "[Concept('homosexual','Homosexuální')|E]" # todo: CONCEPT CASE
 game_concept_homosexual: "Homosexuální"
 game_concept_homosexual_desc: "V #EMP Crusader Kings III#! tuto postavu přitahují postavy stejného pohlaví."
 sexuality_he: "[Concept('heterosexual','Heterosexuální')|E]" # todo: CONCEPT CASE
 game_concept_heterosexual: "Heterosexuální"
 game_concept_heterosexual_desc: "V #EMP Crusader Kings III#! tuto postavu přitahují postavy opačného pohlaví."
 sexuality_bi: "[Concept('bisexual','Bisexuální')|E]" # todo: CONCEPT CASE
 game_concept_bisexual: "Bisexuální"
 game_concept_bisexual_desc: "V #EMP Crusader Kings III#! tuto postavu přitahují postavy stejného i opačného pohlaví."
 sexuality_as: "[Concept('asexual','Asexuální')|E]" # todo: CONCEPT CASE
 game_concept_asexual: "Asexuální"
 game_concept_asexual_desc: "V #EMP Crusader Kings III#! tato postava pociťuje jen malou nebo žádnou přitažlivost k jiným postavám bez ohledu na pohlaví."
 sexuality_none: "#V Žádná#!"
 game_concept_title_succession: "Nástupnictví titulu"
 game_concept_title_specific_succession: "Specifické pro titul"
 game_concept_title_succession_desc: "[Concept('title','Titul')|E] může mít vlastní [Concept('succession_law','zákon nástupnictví')|El], který se liší od zákona [Concept('realm','panství')|El] jeho [Concept('holder','držitele')|El].\n\n[Concept('kingdoms','Království')|E] a [Concept('empires','říše')|El] mají tradiční nástupnictví titulu nejčastěji.\n\nDržitel $game_concept_title$ může přidávat nebo odstraňovat zákony nástupnictví specifické pro titul, obvykle za cenu [Concept('prestige','prestiž')|El].\n\n[Concept('domiciles','Domicily')|E] mají také vlastní nástupnictví titulu, které nelze odstranit." # todo: CONCEPT CASE
 game_concept_designated_heir: "Určený dědic"
 game_concept_designated_heir_desc: "Určený dědic má přednost při rozhodování o tom, kdo se stane [Concept('realm_heir','dědicem panství')|El]." # todo: CONCEPT CASE
 game_concept_incest: "Krvesmilstvo"
 game_concept_incestuous: "Krvesmilný"
 game_concept_incest_desc: "Krvesmilstvo označuje pohlavní styk mezi blízkými příbuznými.\nTo, které příbuzenské vztahy jsou krvesmilné, určuje [Concept('doctrine','doktrína')|El] $doctrine_consanguinity_name$ [Concept('faith','víry')|El] postavy."
 game_concept_relation: "Zvláštní vztah"
 game_concept_relations: "Zvláštní vztahy"
 game_concept_relationship: "Zvláštní vztah"
 game_concept_relation_desc: "Zvláštní vztahy jsou vztahy, které postava má a které nejsou dány rodinou ani [Concept('vassalage','vazalstvím')|El]. Tyto $game_concept_relations$ spadají do několika různých kategorií, mohou zúčastněné postavě přinášet [Concept('character_modifiers','modifikátory postavy')|El] a určují, co se mezi nimi může stát.\n\nBěžné vztahy:\n$EFFECT_LIST_BULLET$ [Concept('friend','Přítel')|E]\n$EFFECT_LIST_BULLET$ [Concept('lover','Milenec')|E]\n$EFFECT_LIST_BULLET$ [Concept('rival','Sok')|E]\n$EFFECT_LIST_BULLET$ [Concept('guardian','Poručník')|E]\n$EFFECT_LIST_BULLET$ [Concept('ward','Svěřenec')|E]\n$EFFECT_LIST_BULLET$ [Concept('mentor','Mentor')|E]\n$EFFECT_LIST_BULLET$ [Concept('student','Žák')|E]\n$EFFECT_LIST_BULLET$ [Concept('elder','Starší')|E]\n$EFFECT_LIST_BULLET$ [Concept('disciple','Učedník')|E]\n\nVyšší vztahy:\n$EFFECT_LIST_BULLET$ [Concept('best_friend','Nejlepší přítel')|E]\n$EFFECT_LIST_BULLET$ [Concept('soulmate','Spřízněná duše')|E]\n$EFFECT_LIST_BULLET$ [Concept('nemesis','Úhlavní nepřítel')|E]\n\nDětské vztahy:\n$EFFECT_LIST_BULLET$ [Concept('bully','Trýznitel')|E]\n$EFFECT_LIST_BULLET$ [Concept('victim','Oběť šikany')|E]\n$EFFECT_LIST_BULLET$ [Concept('crush','První láska')|E]" # todo: CONCEPT CASE
 game_concept_lover: "Milenec"
 game_concept_lovers: "Milenci"
 game_concept_lover_possessive: "Milencův"
 game_concept_lovers_possessive: "Milenců"
 game_concept_lover_desc: "Milenec je $game_concept_relation$, který označuje trvající milostný a sexuální vztah mezi dvěma [Concept('characters','postavám')|El].\n\nProtože často vzniká mimo svazky [Concept('marriage','sňatek')|El] nebo [Concept('concubinage','konkubinátu')|El], většina milence zvláštní vztahy začíná jako [Concept('secrets','tajemství')|El].\n\nPokud jsou muž a žena $game_concept_lovers$, žena může otěhotnět s mužovým dítětem. Pokud nejsou $game_concept_married$ (a jeden není $game_concept_concubine$ druhého), dítě bude [Concept('bastard','bastard')|El], ať už tajný, nebo ne.\n\nMilenci, kteří jsou hluboce oddaní a citově blízcí, se mohou stát [Concept('soulmates','spřízněnými dušemi')|El]." # todo: CONCEPT CASE
 game_concept_soulmate: "Spřízněná duše"
 game_concept_soulmates: "Spřízněné duše"
 game_concept_soulmate_possessive: "Spřízněné duše"
 game_concept_soulmates_possessive: "Spřízněných duší"
 game_concept_soulmate_desc: "Spřízněná duše je $game_concept_relation$, který označuje hlubokou, niternou romantickou lásku. Je to silnější $game_concept_relation$ než [Concept('lover','milenec')|El]. Postava může mít pouze jednu spřízněnou duši." # todo: CONCEPT CASE
 game_concept_friend: "Přítel"
 game_concept_friends: "Přátelé"
 game_concept_friendships: "Přátelství"
 game_concept_friend_possessive: "Přítelův"
 game_concept_friends_possessive: "Přátel"
 game_concept_friendship: "Přátelství"
 game_concept_friend_desc: "Přítel je $game_concept_relation$, který označuje blízké přátelství a podporu a mohou jej mít [Concept('children','děti')|El] i [Concept('adults','dospělí')|El].\n\nPřátelé s hlubokým poutem se mohou stát [Concept('best_friends','nejlepšími přáteli')|El]." # todo: CONCEPT CASE
 game_concept_best_friend: "Nejlepší přítel"
 game_concept_best_friends: "Nejlepší přátelé"
 game_concept_best_friend_possessive: "Nejlepšího přítele"
 game_concept_best_friends_possessive: "Nejlepších přátel"
 game_concept_best_friend_desc: "Nejlepší přítel je $game_concept_relation$, který označuje celoživotní oddanost a podporu. Je to silnější $game_concept_relation$ než [Concept('friend','přítel')|El]. [Concept('character','Postava')|E] může mít pouze jednoho nejlepšího přítele." # todo: CONCEPT CASE
 game_concept_rival: "Sok"
 game_concept_rivals: "Sokové"
 game_concept_rivalries: "Sokovství"
 game_concept_rivalry: "Sokovství"
 game_concept_rival_possessive: "Sokův"
 game_concept_rivals_possessive: "Soků"
 game_concept_rival_desc: "Sok je $game_concept_relation$, který označuje celoživotní zášť, ne-li nenávist.\n\nSokové, kteří sebou skutečně pohrdají, se mohou stát [Concept('nemeses','úhlavními nepřáteli')|El]." # todo: CONCEPT CASE
 game_concept_nemesis: "Úhlavní nepřítel"
 game_concept_nemeses: "Úhlavní nepřátelé"
 game_concept_nemesis_possessive: "Úhlavního nepřítele"
 game_concept_nemeses_possessive: "Úhlavních nepřátel"
 game_concept_nemesis_desc: "Úhlavní nepřítel je $game_concept_relation$, který označuje naprosté (a vzájemné) pohrdání a nenávist. Je to silnější $game_concept_relation$ než [Concept('rival','sok')|El]. Postava může mít pouze jednoho úhlavního nepřítele." # todo: CONCEPT CASE
 game_concept_grudge: "Křivda"
 game_concept_grudges: "Křivdy"
 game_concept_grudge_possessive: "Křivdy"
 game_concept_grudges_possessive: "Křivd"
 game_concept_grudge_desc: "$game_concept_grudge$ je $game_concept_relation$ vyjadřující jednostrannou ukřivděnost, nenávist a zatrpklost. Cíl křivdy tyto city neopětuje a možná o nich ani neví.\n\n#WEAK $game_concept_grudges$ nejčastěji vznikají, když jedna [Concept('character','postava')|E] provede jiné něco hrozného, aniž by si vůbec uvědomila její existenci — například král, který nechá sedláka ve svém [Concept('dungeon','žaláři')|E] čtyřicet let.#!"
 game_concept_guardian: "Poručník"
 game_concept_guardians: "Poručníci"
 game_concept_guardian_possessive: "Poručníkův"
 game_concept_guardians_possessive: "Poručníků"
 game_concept_guardianship: "Poručenství"
 game_concept_guardian_desc: "Poručník je [Concept('character','postava')|El] pověřená [Concept('educate','výchovou')|El] [Concept('child','dítěte')|El] (nazývaného její [Concept('ward','svěřenec')|El]).\n\nPoručníci mají sklon předávat svým svěřenci své [Concept('personality_traits','osobnostní rysy')|El] i svou [Concept('culture','kulturu')|El] a/nebo [Concept('faith','víru')|El], pokud je to určeno ve zaměření vzdělání.\n\nPoručník může pobývat u jiného [Concept('court','dvora')|El]. Svěření [Concept('close_family_member','člena blízké rodiny')|El] na milost jinému [Concept('ruler','vládci')|El] tímto způsobem zvýší jeho [Concept('opinion','mínění')|El] o tobě." # todo: CONCEPT CASE
 game_concept_ward: "Svěřenec"
 game_concept_wards: "Svěřenci"
 game_concept_ward_possessive: "Svěřencův"
 game_concept_wards_possessive: "Svěřenců"
 game_concept_ward_desc: "Svěřenec je [Concept('child','dítě')|El], které je [Concept('educated','vychováváno')|El] [Concept('guardian','poručníkem')|El]. Každý $game_concept_guardian$ se může starat až o dva $game_concept_wards$." # todo: CONCEPT CASE
 game_concept_mentor: "Mentor"
 game_concept_mentors: "Mentoři"
 game_concept_mentor_possessive: "Mentorův"
 game_concept_mentors_possessive: "Mentorů"
 game_concept_mentor_desc: "Mentoři jsou [Concept('characters','postavy')|El], které pomáhají zlepšovat [Concept('skills','dovednosti')|El] svého [Concept('student','žáka')|El]. Lze je získat prostřednictvím událostí, když je tvé [Concept('lifestyle','životní styl')|El] [Concept('focus','zaměření')|El] nastaveno na určitou dovednost." # todo: CONCEPT CASE
 game_concept_student: "Žák"
 game_concept_students: "Žáci"
 game_concept_student_possessive: "Žákův"
 game_concept_students_possessive: "Žáků"
 game_concept_student_desc: "Žáci jsou [Concept('characters','postavy')|El], které těží z rad [Concept('mentor','mentora')|El], jenž jim pomáhá rozvíjet jednu z jejich [Concept('skills','dovedností')|El]. Mentoři se získávají prostřednictvím událostí, když je tvé [Concept('lifestyle','životní styl')|El] [Concept('focus','zaměření')|El] nastaveno na dovednost, v níž vynikají." # todo: CONCEPT CASE
 game_concept_bully: "Trýznitel"
 game_concept_bullies: "Trýznitelé"
 game_concept_bully_possessive: "Trýznitelův"
 game_concept_bullies_possessive: "Trýznitelů"
 game_concept_bully_desc: "Trýznitel je kruté [Concept('child','dítě')|El], které si dobírá jiné $game_concept_child$ (svou [Concept('victim','oběť šikany')|El]) pro zábavu, prospěch nebo prostě z nudy. Po dosažení [Concept('adulthood','dospělosti')|El] se trýznitelem může stát [Concept('rival','sokem')|El], nebo může ze své dětské nenávisti vyrůst." # todo: CONCEPT CASE
 game_concept_victim: "Oběť šikany"
 game_concept_victims: "Oběti šikany"
 game_concept_victim_possessive: "Oběti šikany"
 game_concept_victims_possessive: "Obětí šikany"
 game_concept_victim_desc: "Oběť šikany je [Concept('child','dítě')|El], které je právě obtěžováno jiným dítětem, často z důvodů nejasných komukoli kromě jeho [Concept('bully','trýznitele')|El]. Po dosažení [Concept('adulthood','dospělosti')|El] se může stát [Concept('rivals','sokem')|El] svého trýznitele, nebo se naučit nechat strasti mládí za sebou." # todo: CONCEPT CASE
 game_concept_crush: "První láska"
 game_concept_crushes: "První lásky"
 game_concept_crush_possessive: "První lásky"
 game_concept_crushes_possessive: "Prvních lásek"
 game_concept_crush_desc: "První láska je jiné [Concept('child','dítě')|El], k němuž toto $game_concept_child$ začíná chovat své první (poněkud bolestně rozpačité) city. Po dosažení [Concept('adulthood','dospělosti')|El] může, pokud je $game_concept_crush$ vzájemná, rozkvést v [Concept('lovers','milencích')|El], nebo se [Concept('character','postavou')|El] může pohnout v životě dál." # todo: CONCEPT CASE
 game_concept_blood_brother: "Pokrevní bratr"
 game_concept_blood_brothers: "Pokrevní bratři"
 game_concept_blood_brother_possessive: "Pokrevního bratra"
 game_concept_blood_brothers_possessive: "Pokrevních bratrů"
 game_concept_blood_brother_desc: "Pokrevní bratr je zvláštní forma [Concept('friend','přítele')|El] a [Concept('ally','spojence')|El]. [Concept('characters','Postavy')|E] mohou mít pouze jednoho pokrevního bratra: tento $game_concept_blood_brother$ se stává symbolickým členem jejich rodiny (a proto už nesmí být [Concept('family','rodinou')|El]). Pokud je odmítnuto volání $game_concept_blood_brother$ do [Concept('war','války')|El], [Concept('relation','zvláštního vztahu')|El] se přeruší a oba se stanou [Concept('rivals','soky')|El].\n\nPokrevní bratři, jejich [Concept('children','děti')|El] a jejich hlavní choti mají navzájem zvýšené [Concept('opinion','mínění')|El] a mohou spolu vyjednávat [Concept('alliances','aliance')|El].\n\nPokrevní bratrství je dostupné prostřednictvím [Concept('nomadic_government','kočovné vlády')|El], [Concept('trait','rysu')|El] [GetTrait('nomadic_philosophy').GetName( GetNullCharacter )] nebo prostřednictvím [Concept('tradition','tradic')|El]." # todo: CONCEPT CASE
 game_concept_modifier: "Modifikátor"
 game_concept_modifiers: "Modifikátory"
 game_concept_modifier_desc: "Modifikátor je účinek, který po delší dobu mění určitou hodnotu. Může například změnit hodnotu [Concept('skills','dovednosti')|El] postavy nebo [Concept('success_chance','šanci na úspěch')|El] [Concept('scheme','intriky')|El].\n\nModifikátory se obvykle objevují u postav, intrik nebo [Concept('counties','hrabství')|El]." # todo: CONCEPT CASE
 game_concept_character_modifier: "Modifikátor postavy"
 game_concept_character_modifiers: "Modifikátory postavy"
 game_concept_character_modifier_desc: "[Concept('modifiers','Modifikátory')|E] držené postavou, které ovlivňují její osobnost, [Concept('skills','dovednosti')|El] a dokonce i [Concept('income','příjem')|El]. Na rozdíl od [Concept('traits','rysů')|El] představují modifikátorů postavy spíše dočasné účinky." # todo: CONCEPT CASE
 game_concept_critical_failure: "Kritické selhání"
 game_concept_critically_fail: "Kriticky selhat"
 game_concept_critical_failure_desc: "Některé [Concept('schemes','intriky')|El] mohou při provedení kritickém selhání.\n\nPřesné výsledky se liší, ale zahrnují obrácení intriku proti [Concept('scheme_owner_owner','osnovateli')|El] nebo zabránění v pokusu o stejnou intriku proti stejnému [Concept('scheme_target_target','cíli')|El] po určitou dobu." # todo: CONCEPT CASE
 game_concept_espionage: "$task_find_secrets$"
 game_concept_espionage_desc: "$task_find_secrets$ je [Concept('councillor_task','úkol rádce')|El], který vykonává [Concept('spymaster','špehmistr')|El].\n\nCílí na [Concept('court','dvůr')|El] [Concept('ruler','vládce')|El] a snaží se odhalit [Concept('secrets','tajemství')|El] o tamních postavách." # todo: CONCEPT CASE
 game_concept_disrupt_schemes: "$task_disrupt_schemes$"
 game_concept_disrupt_schemes_desc: "$task_disrupt_schemes$ je [Concept('councillor_task','úkol rádce')|El], který vykonává [Concept('spymaster','špehmistr')|El].\n\nZvyšuje [Concept('scheme_discovery_chance','šanci na odhalení intriky')|El] [Concept('ruler','vládce')|El] a zpomaluje nepřátelské akce $game_concept_spymaster$ jiných $game_concept_ruler$s, například [Concept('espionage','špehování')|El]." # todo: CONCEPT CASE
 game_concept_increase_control: "$task_increase_control$"
 game_concept_increase_control_desc: "$task_increase_control$ je [Concept('councillor_task','úkol rádce')|El], který vykonává [Concept('marshal','maršál')|El].\n\nCílí na [Concept('county','hrabství')|El], kde zvyšuje [Concept('control','kontrolu')|El] a časem odstraňuje [Concept('county_corruption','korupci v hrabství')|El]." # todo: CONCEPT CASE
 game_concept_manage_guards: "$task_manage_guards$"
 game_concept_manage_guards_desc: "$task_increase_control$ je [Concept('councillor_task','úkol rádce')|El], který vykonává [Concept('marshal','maršál')|El].\n\nZvyšuje [Concept('knight_effectiveness','účinnost rytířů')|El] a snižuje [Concept('success_chance','šanci na úspěch')|El] [Concept('hostile_scheme','nepřátelských intrik')|El] proti [Concept('liege','lennímu pánovi')|El] rádce." # todo: CONCEPT CASE
 game_concept_collect_taxes: "$task_collect_taxes$"
 game_concept_collect_taxes_desc: "$task_collect_taxes$ je [Concept('councillor_task','úkol rádce')|El], který vykonává [Concept('steward','správce')|El].\n\nZvyšuje všechny daně v osobní [Concept('domain','doméně')|El] postavy." # todo: CONCEPT CASE
 game_concept_promote_culture: "$task_promote_culture$"
 game_concept_promote_culture_desc: "$task_promote_culture$ je [Concept('councillor_task','úkol rádce')|El], který vykonává [Concept('steward','správce')|El].\n\nMění [Concept('culture','kulturu')|El] [Concept('county','hrabství')|El] tak, aby odpovídala $game_concept_culture$ jeho vládce." # todo: CONCEPT CASE
 game_concept_accept_culture: "$task_accept_culture$"
 game_concept_promoting_cultural_acceptance: "Podpora přijetí"
 game_concept_accept_culture_desc: "$task_accept_culture$ je [Concept('councillor_task','úkol rádce')|El], který vykonává [Concept('steward','správce')|El].\n\nZvyšuje [Concept('cultural_acceptance','kulturní přijetí')|El] mezi cílovou [Concept('culture','kulturou')|El] a $game_concept_culture$ [Concept('rulerpossessive','vládce')|El]." # todo: CONCEPT CASE
 game_concept_theocratic_vassal: "Teokratický vazal"
 game_concept_theocratic_vassals: "Teokratičtí vazalové"
 game_concept_theocratic_vassal_desc: "Vazalové, kteří mají formu [Concept('theocratic_government','teokratickou vládu')|El].\n\nJejich fungování určují [Concept('doctrines','doktríny')|El] [Concept('faithpossessive','dané víry')|El]." # todo: CONCEPT CASE
 game_concept_ducal_conquest_casus_belli: "Casus belli vévodského dobytí"
 game_concept_ducal_conquest: "Vévodské dobytí"
 game_concept_ducal_conquest_casus_belli_desc: "[Concept('casus_belli','Casus belli')|E], které umožňuje zabrat [Concept('counties','hrabství')|El] potřebná k vytvoření [Concept('uncreated_title','nevytvořenému titulu')|El] [Concept('duchy','vévodské')|El] hodnosti." # todo: CONCEPT CASE
 game_concept_vassalize_casus_belli: "Casus belli nucené vazalizace"
 game_concept_vassalization_casus_belli: "Nucená vazalizace"
 game_concept_vassalized_casus_belli: "Nuceně vazalizován"
 game_concept_vassalize_casus_belli_desc: "[Concept('casus_belli','Casus belli')|E] umožňující nucenou [Concept('vassalization','vazalizaci')|El] sousedního nezávislého [Concept('ruler','vládce')|El] nižší hodnosti. Odemyká jej [Concept('perk','talent')|El] [GetPerk( 'forced_vassalage_perk' ).GetName( GetNullCharacter )].\n\nVazalizovat můžeš každého vládce, který ve svém [Concept('realm','panství')|El] nemá více než #V [EmptyScope.ScriptValue('vassalize_default_size')|0]#! [Concept('counties','hrabství')|El].\n\nTento limit se zvyšuje o #P +[EmptyScope.ScriptValue('vassalize_growth_per_innovation')|0]#! za každou z následujících inovací:\n$EFFECT_LIST_BULLET$#V $innovation_casus_belli$#!\n$EFFECT_LIST_BULLET$#V $innovation_chronicle_writing$#!\n$EFFECT_LIST_BULLET$#V $innovation_divine_right$#!\n$EFFECT_LIST_BULLET$#V $innovation_rightful_ownership$#!"
 game_concept_title_creation: "Vytvoření titulu"
 game_concept_create: "Vytvořit"
 game_concept_created: "Vytvořeno"
 game_concept_create_title: "Vytvořit titul"
 game_concept_created_title: "Vytvořený titul"
 game_concept_uncreated_title: "Nevytvořený titul"
 game_concept_title_creation_desc: "[Concept('ruler','Vládce')|E], který ovládá většinu [Concept('de_jure','de iure')|El] země dosud nevytvořeného [Concept('titlepossessive','titulu')|El], bude moci vytvořit příslušný titul. Vytvoření titulu stojí [Concept('gold','zlato')|El], ale poskytuje [Concept('prestige','prestiž')|El].\n\nVytvořit lze pouze tituly úrovně [Concept('duchy','vévodství')|El], [Concept('kingdom','království')|El] nebo [Concept('empire','říše')|El].\n\nWidget problémů obsahuje seznam všech titulů, které můžeš aktuálně vytvořit."
 game_concept_foreign_affairs: "$task_foreign_affairs$"
 game_concept_foreign_affairs_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('chancellor','kancléř')|El].\nU [Concept('independent','nezávislého')|El] [Concept('ruler','vládce')|El] zvyšuje mínění, které o něm mají ostatní nezávislí vládci. U vazala zvyšuje mínění, které o něm mají ostatní vazalové stejného [Concept('liege','lenního pána')|El]."
 game_concept_domestic_affairs: "$task_domestic_affairs$"
 game_concept_domestic_affairs_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('chancellor','kancléř')|El] a který zvyšuje mínění, jež mají [Concept('vassals','vazalové')|El] v [Concept('realm','panství')|El] vůči [Concept('liege','lennímu pánovi')|El]."
 game_concept_bestow_royal_favor: "$task_bestow_royal_favor$"
 game_concept_bestow_royal_favor_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('chancellor','kancléř')|El] a který zvyšuje mínění vybraného [Concept('vassal','vazala')|El] v [Concept('realm','panství')|El] vůči jeho [Concept('liege','lennímu pánovi')|El]."
 game_concept_integrate_title: "$task_integrate_title$"
 game_concept_integrate_title_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('chancellor','kancléř')|El] a který urychluje proces [Concept('de_jure_drift','de iure posunu')|El] [Concept('title','titulu')|El]."
 game_concept_fabricate_claim: "$task_fabricate_claim$"
 game_concept_fabricate_claim_short: "Vykonstruovat nárok"
 game_concept_fabricated_claims_short: "Vykonstruované nároky"
 game_concept_fabricating_claims: "Konstruování nároků"
 game_concept_fabricate_claim_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('court_chaplain','dvorní kaplan')|El].\nCílí na [Concept('county','hrabství')|El] a postupně buduje pokrok. Při 100% pokroku lze za cenu [Concept('gold','zlato')|El] vykonstruovat [Concept('claim','nárok')|El]." # todo: CONCEPT CASE
 game_concept_religious_relations: "$task_religious_relations$"
 game_concept_religious_relations_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('court_chaplain','dvorní kaplan')|El].\nZvyšuje mínění [Concept('theocratic','teokratických')|El] vládců stejné [Concept('faith','víry')|El] o postavě a zvyšuje měsíční zisk [Concept('piety','zbožnosti')|El]."
 game_concept_interaction: "Interakce"
 game_concept_interactions: "Interakce"
 game_concept_interacting: "Interakce"
 game_concept_character_interaction: "Interakce s postavou"
 game_concept_interaction_desc: "Akce prováděné jednou postavou vůči jiné. Mohou mít širokou škálu účelů a účinků.\n\nNěkteré interakce vyžadují souhlas cílové postavy, zatímco jiné lze provést i bez něj.\n\nObvykle jsou dostupné kliknutím pravým tlačítkem na postavu, čímž se otevře nabídka interakcí pro cílovou postavu, ale někdy jsou dostupné prostřednictvím zvláštních rozhraní."
 game_concept_offer_vassalization: "Nabídnout vazalizaci"
 game_concept_offer_vassalization_interaction: "Interakce nabídnutí vazalizace"
 game_concept_offer_vassalization_desc: "Interakce nabízející [Concept('vassalage','vazalství')|El] [Concept('independent','nezávislému')|El] [Concept('ruler','vládci')|El] nižší [Concept('title_rank','hodnosti titulu')|El], čímž jej mírově připojí k panství."
 game_concept_extort_subjects_decision: "Rozhodnutí vydírat poddané"
 game_concept_extort_subjects: "Vydírat poddané"
 game_concept_extort_subjects_decision_desc: "[Concept('decision','Rozhodnutí')|E] nabízející různé příležitosti, jak od poddaných požadovat dodatečné [Concept('gold','zlato')|El] za různou cenu..."
 game_concept_sell_titles_decision: "Rozhodnutí prodávat tituly"
 game_concept_sell_titles: "Prodávat tituly"
 game_concept_sell_titles_decision_desc: "[Concept('decision','Rozhodnutí')|E] umožňující prodej bezvýznamných titulů — titulů čistě symbolického významu. Poskytuje [Concept('gold','zlato')|El] výměnou za [Concept('prestige','prestiž')|El]."
 game_concept_embrace_celibacy: "Přijmout celibát"
 game_concept_embrace_celibacy_decision: "Rozhodnutí přijmout celibát"
 game_concept_embrace_celibacy_desc: "[Concept('decision','Rozhodnutí')|E], které umožňuje postavě podle vůle získat [Concept('trait','rys')|El] [GetTrait('celibate').GetName( GetNullCharacter )]."
 game_concept_abandon_celibacy: "Opustit celibát"
 game_concept_abandon_celibacy_decision: "Rozhodnutí opustit celibát"
 game_concept_abandon_celibacy_desc: "[Concept('decision','Rozhodnutí')|E], které umožňuje postavě podle vůle ztratit [Concept('trait','rys')|El] [GetTrait('celibate').GetName( GetNullCharacter )]."
 game_concept_convert_county: "$task_conversion$"
 game_concept_convert_county_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('court_chaplain','dvorní kaplan')|El] a který cílí na [Concept('county','hrabství')|El] jiné víry než [Concept('liege','lenní pán')|El].\nPokrok se zvyšuje každý měsíc a při 100 % většina cílového hrabství přejde ze své předchozí víry na víru lenního pána.\n\nRychlost konverze ovlivňuje mnoho faktorů, včetně [Concept('learning_skill','učenosti')|El] [Concept('councillor','rádce')|El] a [Concept('fervor','horlivosti')|El] obou věr."
 game_concept_convert: "Konvertovat"
 game_concept_converted: "Konvertováno"
 game_concept_converting: "Konverze"
 game_concept_commission_epic: "$commission_epic_decision$"
 game_concept_commission_epic_decision: "Rozhodnutí $commission_epic_decision$"
 game_concept_commission_epic_desc: "[Concept('decision','Rozhodnutí')|E], které umožňuje postavě směnit [Concept('gold','zlato')|El] za [Concept('artifact','artefakt')|El] zadáním sepsání rodového eposu.\nEpos poskytne [Concept('dynasty_prestige','věhlas')|El] a podle tvých voleb může poskytnout i další bonusy."
 game_concept_draw_up_new_charts: "$draw_up_new_charts_decision$"
 game_concept_draw_up_new_charts_decision: "Rozhodnutí $draw_up_new_charts_decision$"
 game_concept_draw_up_new_charts_desc: "[Concept('decision','Rozhodnutí')|E], které umožňuje postavě směnit [Concept('gold','zlato')|El] za [Concept('artifact','artefakt')|El] zadáním cestovního itineráře s popisem navštívených míst.\nItinerářový [Concept('artifact','artefakt')|El] poskytne různé účinky podle toho, kde jsi byl a jaké volby učiníš."
 game_concept_local_arbitration: "$local_arbitration_decision$"
 game_concept_local_arbitration_decision: "Rozhodnutí $local_arbitration_decision$"
 game_concept_local_arbitration_desc: "[Concept('decision','Rozhodnutí')|E], které umožňuje postavě zlepšit [Concept('county','hrabství')|El] na jejím současném místě."
 game_concept_exceptional_epic: "Mimořádný epos"
 game_concept_exceptional_epic_desc: "Rodový epos sepsaný prostřednictvím rozhodnutí $commission_epic_decision$ má šanci stát se mimořádným eposem, který poskytuje větší bonusy než běžný epos.\n\nŠanci, že epos bude mimořádný, mohou ovlivnit volby v událostech."
 game_concept_demand_payment: "Požadovat platbu"
 game_concept_demand_payment_decision: "Interakce požadování platby"
 game_concept_demand_payment_desc: "Diplomatická interakce, která umožňuje postavě požadovat platbu [Concept('gold','zlato')|El] výměnou za jakékoli [Concept('hooks','páky')|El], které má." # todo: CONCEPT CASE
 game_concept_independence_faction: "Frakce za nezávislost"
 game_concept_independence_factions: "Frakce za nezávislost"
 game_concept_faction_independence: "Nezávislost"
 game_concept_independence_faction_desc: "Frakce za nezávislost usiluje o nezávislost pro všechny své členy. Pokud uspěje, osamostatní se od svého [Concept('liege','lenního pána')|El]." # todo: CONCEPT CASE
 game_concept_liberty_faction: "$liberty_faction$"
 game_concept_faction_liberty: "Svoboda"
 game_concept_liberty_factions: "Frakce za svobodu"
 game_concept_liberty_faction_desc: "$liberty_faction$ usiluje o snížení [Concept('crown_authority','korunní autoritu')|El] a případně i vlastních [Concept('vassal_contracts','vazalských smluv')|El]. Pokud uspěje, jejich [Concept('liege','lenní pán')|El] nebude moci po určitou dobu změnit korunní autoritu [Concept('realm','panství')|El]." # todo: CONCEPT CASE
 game_concept_claimant_faction: "$claimant_faction$"
 game_concept_claimant_factions: "Frakce pretendenta"
 game_concept_claimant_faction_desc: "$claimant_faction$ usiluje o dosazení konkrétního [Concept('claimant','pretendenta')|El] na trůn [Concept('title','titulu')|El] drženého jejich [Concept('liege','lenním pánem')|El]. Pokud uspěje, lenní pán bude muset titul předat pretendentovi a [Concept('vassal','vazalská')|El] struktura bude odpovídajícím způsobem upravena. Všichni členové [Concept('faction','frakce')|El] získají na pretendenta [Concept('hook','páku')|El]." # todo: CONCEPT CASE
 game_concept_peasant_faction: "$peasant_faction$"
 game_concept_peasant_factions: "Selské frakce"
 game_concept_peasant_faction_desc: "$peasant_faction$ tvoří [Concept('counties','hrabství')|El] s nízkým [Concept('county_opinion','lidovým míněním')|El]. Na rozdíl od jiných [Concept('factions','frakcí')|El] se tato frakce vždy vzbouří, i když je její [Concept('faction_military_power','vojenská síla frakce')|El] nízká, protože sedláci jsou obecně optimističtí a negramotní... Úspěšná selská povstání výrazně sníží kontrolu v tvém [Concept('realm','panství')|El]." # todo: CONCEPT CASE
 game_concept_escalated_peasant_faction: "Vyhrocená $peasant_faction$"
 game_concept_escalated_peasant_factions: "Vyhrocené selské frakce"
 game_concept_escalated_peasant_faction_desc: "Vyhrocená $peasant_faction$ tvoří [Concept('counties','hrabství')|El] s nízkým [Concept('county_opinion','lidovým míněním')|El], která už vynutila požadavky [Concept('peasant_faction','selské frakce')|El] na jednom z tvých [Concept('vassals','vazalů')|El]. Frakce vedená neblaze proslulým vůdcem je nebezpečná a schopná odtrhnout se od tvého [Concept('realm','panství')|El]." # todo: CONCEPT CASE
 game_concept_popular_faction: "$populist_faction$"
 game_concept_popular_factions: "Lidové frakce"
 game_concept_popular_faction_desc: "$populist_faction$ tvoří [Concept('counties','hrabství')|El] s nízkým [Concept('county_opinion','lidovým míněním')|El], která sdílejí společný prvek, například [Concept('culture','kulturu')|El] nebo [Concept('faith','víru')|El]. Usilují o osvobození a vybírají si nového [Concept('ruler','vládce')|El] podle své kultury nebo víry. Tento typ povstání bývá velmi nebezpečný." # todo: CONCEPT CASE
 game_concept_buy_claim: "$buy_claim_interaction$"
 game_concept_buy_claim_interaction: "Interakce $buy_claim_interaction$"
 game_concept_buy_claim_desc: "Interakce, která postavě umožňuje koupit [Concept('unpressed_claims','neprosazené nároky')|El] výměnou za [Concept('piety','zbožnost')|El].\n\n$EFFECT_LIST_BULLET$[Concept('vassal','Vazal')|E] si nesmí koupit nárok na žádný [Concept('title','titul')|El] [Concept('liege','lenního pána')|El] a lenní pán si nesmí koupit nárok na žádný titul vazala\n$EFFECT_LIST_BULLET$[Concept('king','Král')|E] ani [Concept('emperor','císař')|El] si nesmí kupovat nároky na královské tituly a císaři si nesmí kupovat nároky na jiné říše\n$EFFECT_LIST_BULLET$Nikdo si nesmí koupit nárok na svou [Concept('head_of_faith','hlavu víry')|El]"
 game_concept_develop_county: "$task_develop_county$"
 game_concept_develop_county_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('steward','správce')|El]. Cílí na [Concept('county','hrabství')|El], kde urychluje [Concept('development_growth','růst rozvoje')|El] a zkracuje dobu výstavby [Concept('buildings','budov')|El]."
 game_concept_convince_dejure: "$task_convince_dejure$"
 game_concept_convince_dejure_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('steward','správce')|El]. Cílí na [Concept('de_jure','de iure')|El] [Concept('county','hrabství')|El] [Concept('liege','lenního pána')|El] rádce, které vlastní [Concept('independent','nezávislý')|El] [Concept('ruler','vládce')|El]. Jakmile je hrabství přesvědčeno, požádá svého [Concept('ruler','vládce')|El], aby je propustil k jeho [Concept('de_jure','de iure')|El] [Concept('liege','lennímu pánovi')|El]."
 game_concept_organize_levies: "$task_organize_levies$"
 game_concept_organize_levies_desc: "[Concept('councillor_task','Úkol rádce')|E], který vykonává [Concept('marshal','maršál')|El]. Zvyšuje velikost [Concept('garrison','posádky')|El] a rychlost doplňování [Concept('levy','odvedenců')|El] v [Concept('realm','panství')|El] [Concept('liege','lenním pánovi')|El] rádce." # todo: CONCEPT CASE
 game_concept_hostile_army: "Nepřátelská"
 game_concept_hostile_army_desc: "Nepřátelská [Concept('army','Armáda')|El] může být napadena stejně, jako bys byl ve [Concept('war','válce')|El] s jejím vlastníkem, ačkoli za to nebude uděleno žádné [Concept('war_score','válečné skóre')|El].\n\nNepřátelství je způsobeno tím, že máte protichůdné zájmy, včetně:\n$BULLET_WITH_TAB$Nepřátel tvého [Concept('liege','lenního pána')|El]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] tvých nepřátel\n$BULLET_WITH_TAB$Vládců #emphasis útočících#! na stejného nepřítele" # todo: CONCEPT CASE
 game_concept_war_leaders: "Vůdci války"
 game_concept_war_leader: "Vůdce války"
 game_concept_war_leaders_desc: "Hlavní útočník a hlavní obránce ve [Concept('war','válce')|El]. Obvykle jde o postavu, která válku rozpoutala, a [Concept('top_liege','nejvyššího lenního pána')|El] postavy, která drží [Concept('war_target','válečný cíl')|El].\n\nExistuje řada [Concept('casus_belli','casus belli')|El] pro mnoho různých druhů válek, z nichž některé mají jako $game_concept_war_leaders$ jiné postavy."
 game_concept_offensive_war_opinion: "Mínění kvůli útočné válce"
 game_concept_offensive_war_opinion_short: "Útočná válka"
 game_concept_offensive_war_opinion_desc: "Být hlavním útočníkem ve válce po [GetDefine('NCharacterOpinion', 'OFFENSIVE_WAR_PENALTY_GRACE_PERIOD')] měsících postupně způsobí, že tě tvoji [Concept('vassals','vazaly')|El] začnou mít méně rádi. [Concept('civil_wars','Občanské války')|E] a [Concept('great_holy_wars','velké svaté války')|El] jsou z toho vyňaty. Jakmile už v takové válce nebudeš, postih bude pomalu slábnout." # todo: CONCEPT CASE
 game_concept_at_peace_opinion: "Mínění kvůli míru"
 game_concept_at_peace_opinion_short: "V míru"
 game_concept_at_peace_opinion_desc: "Postavy, jejichž [Concept('faith','víra')|El] má jako součást [Concept('core_tenet','zásadu')|El] [GetFaithDoctrine('tenet_warmonger').GetBaseName], budou mít místo postihu [Concept('offensive_war_opinion','míněním kvůli útočné válce')|El] „mínění kvůli míru“.\n\nPokud budeš příliš dlouho v míru, tvoji [Concept('vassals','vazaly')|El] si tě budou méně vážit #weak (pokud sdílejí tvou víru).#!" # todo: CONCEPT CASE
 game_concept_character: "Postava"
 game_concept_characters: "Postavy"
 game_concept_character_possessive: "Postavy"
 game_concept_characters_possessive: "Postav"
 game_concept_character_desc: "Postavy jsou buď [Concept('noble','urozené')|El], nebo [Concept('lowborn','neurozené')|El], buď [Concept('landed','zeměpanské')|El], nebo [Concept('unlanded','bezzemské')|El], každá s vlastní sadou [Concept('skills','dovednostmi')|El] a [Concept('traits','rysů')|El], cílů a tužeb. Vystupují jako [Concept('rulers','vládci')|El], [Concept('courtiers','dvořané')|El] a [Concept('guests','hosté')|El]. Dokud jsou v [Concept('diplomatic_range','diplomatickém dosahu')|El], lze s nimi jednat." # todo: CONCEPT CASE
 game_concept_highlighted_text: "Zvýrazněný text"
 game_concept_highlighted_text_desc: "Tyto informace tu jsou pro tebe, kdykoli si nejsi jistý nějakým herním konceptem.\n\n#TUT Dokonce můžeš přesunout kurzor do #EMP tohoto#! tooltipu a získat ještě více informací! [Concept('highlighted_text_example','pěkného!')|E]#!" # todo: CONCEPT CASE
 game_concept_highlighted_text_example: "Pěkné!"
 game_concept_highlighted_text_example_desc: "Dobrá práce!"
 game_concept_detail_zoom: "$ZOOM_LEVEL_DETAILS$"
 game_concept_detail_zoom_desc: "$ZOOM_LEVEL_DETAILS_TOOLTIP$"
 game_concept_political_zoom: "$ZOOM_LEVEL_POLITICAL$"
 game_concept_political_zoom_desc: "$ZOOM_LEVEL_POLITICAL_TOOLTIP$"
 game_concept_paper_zoom: "$ZOOM_LEVEL_PAPER_MAP$"
 game_concept_paper_zoom_desc: "$ZOOM_LEVEL_PAPER_MAP_TOOLTIP$"
 game_concept_tutorial_education_trait: "Rys vzdělání"
 game_concept_tutorial_education_trait_i: "@tutorial_education_trait_icon!"
 game_concept_tutorial_education_trait_desc: "Místní král Murchad (tvá [Concept('character','postava')|El]) prošel [Concept('martial','válečnickým')|El] [Concept('education','vzděláním')|El]. Po dosažení dospělosti obdržel rys Zdatný taktik."
 game_concept_organized: "Organizovaná"
 game_concept_organized_desc: "Organizovaná [Concept('faith','víra')|El] má náboženskou hierarchii. Uctívání i zvyklosti jsou uspořádanější a písma jsou formalizována.\n\n[GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] víry skupiny [GetReligionFamily('rf_pagan').GetName] se mohou stát organizovanými reformou, zatímco jiné víry jsou vždy považovány za organizované."
 game_concept_flowery_war: "Nájezd za zajatci"
 game_concept_flowery_wars: "Nájezdy za zajatci"
 game_concept_flowery_warring: "Nájezd za zajatci"
 game_concept_flowery_war_desc: "Jde o zvláštní typ [Concept('war','války')|El], kterou zahajuje [Concept('ruler','vládce')|El], jehož [Concept('faith','víra')|El] praktikuje lidské oběti. Hlavním cílem nájezdem za zajatci je bojovat a zajímat [Concept('prisoners','vězně')|El] k oběti, přičemž kterákoli strana může získat dostatečné [Concept('war_score','válečné skóre')|El] v boji a zvítězit, aniž by musela cokoli [Concept('siege','obléhat')|El].\n\nNa konci válce si vítěz (včetně obránce), pokud následuje $game_concept_faith$ praktikující lidské oběti, vezme několik vězňů ze [Concept('court','dvora')|El] poraženého. Pokud oba hlavní bojující v nájezdě za zajatci následují stejnou víru, je válka považována za posvátnou, což znamená, že poražený i při porážce obdrží (sníženou) [Concept('piety','zbožnost')|El].\n\nNemůžeš vést ani pokračovat v nájezdě za zajatci, pokud máš ve svém [Concept('dungeon','žaláři')|El] jakékoli $game_concept_prisoners$ získané vítězstvím v nájezdě za zajatci." # todo: CONCEPT CASE
 game_concept_partition_share: "Dědický podíl"
 game_concept_partition_share_desc: "Pod jakýmkoli [Concept('succession_law','zákonem nástupnictví')|El] s více [Concept('realm_heirs','dědici panství')|El] je $game_concept_partition_share$ [Concept('character_possessive','postavy')|El] určením toho, které [Concept('titles','tituly')|El] daný $game_concept_heir$ zdědí při [Concept('succession','nástupnictví')|El]. Obvykle to znamená dělení mezi děti [Concept('ruler','vládce')|El] nebo vzácně mezi jeho sourozence.\n\nTypicky se podle zavedeného typu nástupnictví mohou $game_concept_titles$ rozdělit rovnoměrně mezi samostatná [Concept('realms','panstvími')|El], rovnoměrně v rámci téhož panství nebo mohou být z větší části předány hlavnímu dědici, zatímco zbytek se rovnoměrně rozdělí mezi ostatní dědici." # todo: CONCEPT CASE
 game_concept_banish_reason: "Důvod k vyhnání"
 game_concept_banish_reasons: "Důvody k vyhnání"
 game_concept_banish_reason_desc: "Důvod k vyhnání dává [Concept('liege','lennímu pánovi')|El] možnost svobodně [Concept('banish','vyhnat')|El] jakéhokoli poddaného, kterého má ve svém [Concept('dungeon','žaláři')|El]. Nejčastěji se získává tím, že je daný poddaný [Concept('criminal','zločincem')|El]." # todo: CONCEPT CASE
 game_concept_imprisonment_reason: "Důvod k uvěznění"
 game_concept_imprisonment_reasons: "Důvody k uvěznění"
 game_concept_imprisonment_reason_desc: "Důvod k uvěznění dává [Concept('liege','lennímu pánovi')|El] možnost svobodně [Concept('imprison','uvěznit')|El] poddaného. Nejčastěji se získává tím, že je daný poddaný [Concept('criminal','zločincem')|El]." # todo: CONCEPT CASE
 game_concept_revoke_title_reason: "Důvod k odebrání titulu"
 game_concept_revoke_title_reasons: "Důvody k odebrání titulu"
 game_concept_revoke_title_reason_desc: "Důvod k odebrání titulu dává [Concept('liege','lennímu pánovi')|El] možnost svobodně [Concept('revoke','odebrat')|El] [Concept('title','titul')|El] poddanému. Nejčastěji se získává tím, že je daný poddaný [Concept('criminal','zločincem')|El]." # todo: CONCEPT CASE
 game_concept_execute_reason: "Důvod k popravě"
 game_concept_execute_reasons: "Důvody k popravě"
 game_concept_execute_reason_desc: "Důvod k popravě dává [Concept('liege','lennímu pánovi')|El] možnost svobodně [Concept('execute','popravit')|El] poddaného, kterého má ve svém [Concept('dungeon','žaláři')|El]. Nejčastěji se získává tím, že je daný poddaný [Concept('criminal','zločincem')|El]." # todo: CONCEPT CASE
 game_concept_movement_lock: "Uzamčení pohybu"
 game_concept_movement_locked: "Pohyb uzamčen"
 game_concept_movement_locked_desc: "Jakmile [Concept('army','armáda')|El] dokončí více než polovinu daného rozkazu k přesunu, nebude možné jej změnit, dokud nedorazí do cíle."
 game_concept_extramarital_sex: "Mimomanželský sex"
 game_concept_extramarital_sex_sleeping_with: "spává s"
 game_concept_extramarital_sex_desc: "Pokud budou odhaleny, dvě postavy provozující mimomanželský sex ponesou následky podle [Concept('doctrines','doktrín')|El] své [Concept('faithpossessive','víry')|El].\n\n$EFFECT_LIST_BULLET$Každá postava se stane známou buď jako [GetTrait('fornicator').GetName( GetNullCharacter )], nebo jako [GetTrait('adulterer').GetName( GetNullCharacter )], podle vlastního manželského stavu\n$EFFECT_LIST_BULLET$Pokud spolu spí muž a žena, může z toho vzejít těhotenství s [Concept('bastard','bastardem')|El]\n$EFFECT_LIST_BULLET$Pokud jsou postavy stejného pohlaví, následky určuje [Concept('doctrine','doktrína')|El] $doctrine_homosexuality_name$ jejich [Concept('faithpossessive','víry')|El]\n$EFFECT_LIST_BULLET$Jakékoli pohlavně přenosné [Concept('diseases','nemoci')|El], které má jedna postava, mohou nakazit tu druhou"
 game_concept_titular_title: "Titulární titul"
 game_concept_titular_title_desc: "Titulární titul je [Concept('title','titul')|El], který na mapě nemá žádnou [Concept('de_jure','de iure')|El] zemi. Netitulární tituly se mohou stát titulárními prostřednictvím [Concept('de_jure_drift','de iure posunu')|El].\n\n[Concept('mercenary','Žoldnéřské')|E], [Concept('head_of_faith','hlavy víry')|El] a [Concept('holy_order','řádové')|El] tituly bývají často titulární." # todo: CONCEPT CASE
 game_concept_pilgrimage: "Pouť"
 game_concept_pilgrimages: "Poutě"
 game_concept_pilgrimage_desc: "Postavy většiny [Concept('faiths','vír')|El] se mohou rozhodnout podniknout [Concept('activity','aktivitu')|El] a vydat se na pouť ke [Concept('holy_site','svatému místu')|El]. Každé [Concept('holy_site','svatému místu')|El] má vlastní dobu odkladu, než je lze navštívit znovu. \n\nTaková cesta může být plná příležitostí i nebezpečí, ale po dosažení cíle postavy získají [Concept('piety','zbožnost')|El] a mohou obdržet i další odměny." # todo: CONCEPT CASE
 game_concept_hajj: "Hadždž"
 game_concept_hajjes: "Hadždže"
 game_concept_hajj_desc: "Postavy většiny islámských [Concept('faiths','vír')|El] se mohou jednou ročně rozhodnout podniknout [Concept('activity','aktivitu')|El] a vydat se na $game_concept_hajj$ do Mekky jako součást své [Concept('doctrine','doktrínu')|El] pouť.\n\nTaková cesta může být plná příležitostí i nebezpečí, ale po dosažení svatého města postavy získají [Concept('piety','zbožnost')|El] a mohou obdržet i další odměny." # todo: CONCEPT CASE
 game_concept_faith_righteous: "Pravověrná"
 game_concept_faith_righteous_desc: "Tato [Concept('faith','víra')|El] je považována za legitimní.\nSňatky mezi jejími vyznavači jsou běžné.\n\n#S Účinky:\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faith_astray: "Zbloudilá"
 game_concept_faith_astray_desc: "Tato [Concept('faith','víra')|El] se liší způsobem, který není nijak zvlášť významný.\nSňatky mezi jejími vyznavači mohou stále nastávat.\n\n#S Účinky:\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_hostile: "Nepřátelská"
 game_concept_faith_hostile_desc: "Tato [Concept('faith','víra')|El] se výrazně odchyluje.\nSňatky mezi jejími vyznavači mohou stále nastávat a lze proti ní vést [Concept('holy_wars','svaté války')|El].\n\n#S Účinky:\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_evil: "Zavrženíhodná"
 game_concept_faith_evil_desc: "Tato [Concept('faith','víra')|El] je považována za zavrženíhodnou.\nSňatky mezi jejími vyznavači nastávají jen zřídka a lze proti ní vést [Concept('holy_wars','svaté války')|El].\n\n#S Účinky:\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostility: "Nepřátelství vír"
 game_concept_faith_hostility_desc: "Všechny [Concept('faiths','víry')|El] mají vztah vůči každé jiné víře, který je určen tím, jak blízce jsou si příbuzné.\n\nBlízkost určuje několik faktorů, například zda sdílejí [Concept('religion','náboženství')|El], [Concept('religious_family','náboženskou rodinu')|El], nebo zda daná víra má zvláštní [Concept('doctrines','doktrín')|El].\n\nPokud jsou dvě víry od sebe vzdálené, často proti sobě mohou vést [Concept('holy_war','svatou válku')|El].\n\nExistují následující vztahy: [faith_righteous|L], [faith_astray|L], [faith_hostile|L] a [faith_evil|L]." # todo: CONCEPT CASE
 game_concept_command_modifier: "Modifikátor velení"
 game_concept_command_modifier_desc: "Tento [Concept('modifier','modifikátor')|El] je aktivní pouze pro [Concept('commanders','velitele')|El].\n\nPokud postava s modifikátorem velení velí [Concept('army','armádě')|El], získá tato armáda jeho účinek."
 game_concept_command_modifier_i: "@command_modifier_icon!"
 game_concept_command_modifiers: "Modifikátory velení"
 game_concept_nickname: "Přízvisko"
 game_concept_epithet: "Epiteton"
 game_concept_cognomen: "Kognomen"
 game_concept_nicknames: "Přízviska"
 game_concept_epithets: "Epiteta"
 game_concept_cognomens: "Kognomeny"
 game_concept_nickname_desc: "Přízviska, $game_concept_epithets$ a $game_concept_cognomens$ jsou všechna vedlejší jména, která [Concept('characters','postavy')|El] buď přijaly, nebo jim byla přisouzena (např. Karel „Holý“). Přízviska jsou čistě estetická, ačkoli okolnosti jejich získání bývají často dramatické nebo pozoruhodné.\n\nŠpatná $game_concept_nicknames$ budou někdy nahrazena dobrými (například když se Vilém „Bastard“ stane Vilémem „Dobyvatelem“)." # todo: CONCEPT CASE
 game_concept_main_phase: "Hlavní fáze"
 game_concept_main_phase_desc: "V hlavní fázi [Concept('battle','bitvu')|El] spolu bojují [Concept('soldiers','vojáci')|El] a [Concept('knights','rytíři')|El] obou stran.\n\nHlavní fáze končí, když se všechna vojska jedné strany stanou [Concept('casualties','ztrátami')|El] nebo se jedna strana rozhodne [Concept('retreat','ustoupit')|El].\n\nPo hlavní fázi boj přechází do [Concept('aftermath','dohry')|El]." # todo: CONCEPT CASE
 game_concept_personality_trait: "Osobnostní rys"
 game_concept_personality_traits: "Osobnostní rysy"
 game_concept_personality_trait_desc: "Osobnostní rys je [Concept('trait','rys')|El], který určuje pohled člověka na svět a to, k jakým činům má největší sklon. Ovlivňuje také [Concept('opinion','mínění')|El] ostatních. Během života lze rysy ztrácet i získávat nové. Jednání v rozporu s vlastní osobností způsobuje [Concept('stress','stres')|El]." # todo: CONCEPT CASE
 game_concept_lifestyle_trait: "Rys životního stylu"
 game_concept_lifestyle_traits: "Rysy životního stylu"
 game_concept_lifestyle_trait_desc: "Rys životního stylu je výsledkem výběru určitých výhod [Concept('lifestyle','životního stylu')|El], [Concept('decisions','rozhodnutí')|El] nebo [Concept('interactions','interakcí')|El].\n\nNěkteré rysy životního stylu lze vylepšovat, jak postava zdokonaluje své mistrovství v dané dovednosti. Úrovně se pohybují od 1 do 3 a hvězdy na ikoně rysu ukazují aktuální úroveň." # todo: CONCEPT CASE
 game_concept_physical_trait: "Tělesný rys"
 game_concept_physical_traits: "Tělesné rysy"
 game_concept_physical_trait_desc: "Tělesný rys je označení tělesného [Concept('trait','rysu')|El] spojeného se vzhledem či chováním postavy nebo s úrovní jejího intelektu. Mnoho tělesných znaků ovlivňuje, jak [Concept('attracted','přitažlivá')|El] je postava pro ostatní.\n\nČasto jsou [Concept('congenital','vrozené')|El], a tedy získané při narození a trvalé." # todo: CONCEPT CASE
 game_concept_fame_trait: "Rys pověsti"
 game_concept_fame_traits: "Rysy pověsti"
 game_concept_fame_trait_desc: "Rys pověsti je zvláštní [Concept('trait','rys')|El] získaný za konkrétních okolností, který ovlivňuje [Concept('opinion','mínění')|El] ostatních o dané postavě. Tyto rysy lze získat jako výsledek vykonání dobrého skutku nebo tehdy, když jsou odhalena temná [Concept('secrets','tajemství')|El] postavy. Jiné jsou důsledkem okolností při narození." # todo: CONCEPT CASE
 game_concept_health_trait: "Zdravotní rys"
 game_concept_health_trait_desc: "Zdravotní rys je [Concept('trait','rys')|El], který přímo ovlivňuje tělesné i duševní [Concept('health','zdraví')|El] postavy, například [Concept('diseases','nemoci')|El]. Do této kategorie spadají také dočasné rysy ovlivňující tělesné schopnosti postavy, například těhotenství a zranění.\n\nStaré [Concept('characters','postavy')|El] mohou získat [Concept( 'elder_traits', 'stařecké rysy' )|El]." # todo: CONCEPT CASE
 game_concept_modifier_contribution: "Příspěvek"
 game_concept_modifier_contributions: "Příspěvky"
 game_concept_modifier_contributes: "Přispívá"
 game_concept_modifier_contribution_desc: "[Concept('modifier','Modifikátor')|E] může změnit $game_concept_modifier_contribution$ [Concept('obligations','povinností')|El] tvých [Concept('vassals','vazalů')|El]. Není to totéž co [Concept('modifier_base_contribution','základní příspěvek')|El].\n\nPokud máš [Concept('vassal','vazala')|El], který ti platí #V 1#! [Concept('gold','zlato')|El] měsíčně, a získáš [Concept('modifier','modifikátor')|El], který zvyšuje $game_concept_modifier_contribution$ o #V 10 %#!, pak ti [Concept('vassal','vazal')|El] místo toho platí #V 1.1#! [Concept('gold','zlata')|El]."
 game_concept_modifier_base_contribution: "Základní příspěvek"
 game_concept_modifier_base_contributions: "Základní příspěvky"
 game_concept_modifier_base_contributes: "Základně přispívá"
 game_concept_modifier_base_contribution_desc: "[Concept('modifier','Modifikátor')|E] může změnit $game_concept_modifier_base_contribution$ [Concept('obligations','povinností')|El] tvých [Concept('vassals','vazalů')|El]. Není to totéž co [Concept('modifier_contribution','příspěvek')|El].\n\nPokud máš [Concept('vassal','vazala')|El], který má celkový [Concept('income','příjem')|El] #V 10#! [Concept('gold','zlata')|El] a platí ti #V 1#! [Concept('gold','zlato')|El] měsíčně, a získáš [Concept('modifier','modifikátor')|El], který zvyšuje $game_concept_modifier_base_contribution$ o #V 10 %#!, pak ti [Concept('vassal','vazal')|El] místo toho platí #V 2#! [Concept('gold','zlata')|El]."
 game_concept_maneuver: "Manévr"
 game_concept_maneuver_desc: "Fáze $game_concept_maneuver$ nastává na začátku [Concept('battle','bitvy')|El] a označuje dobu, která uplyne před zahájením [Concept('main_phase','hlavní fází')|El], kdy se [Concept('armies','armádami')|El] střetnou v boji." # todo: CONCEPT CASE
 game_concept_combat_phase: "Fáze bitvy"
 game_concept_combat_phase_desc: "Fáze bitvy je jedna část [Concept('battle','bitvy')|El]. Bitvy mají tři odlišné fáze: [Concept('maneuver','manévr')|El], [Concept('main_phase','hlavní fázi')|El] a [Concept('aftermath','dohru')|El]." # todo: CONCEPT CASE
 game_concept_unreformed_pagan_combat_bonus: "Bojová výhoda nereformovaných pohanů"
 game_concept_unreformed_pagan_combat_bonus_desc: "[GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] [Concept('faiths','víry')|El] skupiny [GetReligionFamily('rf_pagan').GetName] získávají [Concept('advantage','výhodu')|El] v [Concept('battle','bitvě')|El] v [Concept('counties','hrabství')|El] své víry." # todo: CONCEPT CASE
 game_concept_personality: "Osobnost"
 game_concept_character_personality: "Osobnost postavy"
 game_concept_personalities: "Osobnosti"
 game_concept_personality_desc: "Postavy se k tobě i k ostatním budou chovat podle své osobnosti, která je určena především jejich [Concept('personality_traits','osobnostními rysy')|El]."
 game_concept_economical_archetype: "Hospodářský archetyp"
 game_concept_economical_archetype_desc: "Hospodářský archetyp [Concept('rulerpossessive','vládce')|El] ovlivňuje, jak se rozhoduje utrácet své [gold_i][Concept('gold','zlato')|El]. Z velké části vychází z jeho [Concept('traits','rysů')|El].\n\n#low Hospodářské archetypy jsou:#!\n$EFFECT_LIST_BULLET$[Concept('ai_warlike_personality','Bojovný')|E]\n$EFFECT_LIST_BULLET$[Concept('ai_cautious_personality','Opatrný')|E]\n$EFFECT_LIST_BULLET$[Concept('ai_economical_boom_personality','Stavitel')|E]\n$EFFECT_LIST_BULLET$[Concept('ai_economical_unpredictable_personality','Nepředvídatelný')|E]\n$EFFECT_LIST_BULLET$[Concept('ai_conqueror_personality','Dobyvatel')|E]" # todo: CONCEPT CASE
 game_concept_gift: "Dar"
 game_concept_gifts: "Dary"
 game_concept_send_gift: "Poslat dar"
 game_concept_gift_desc: "Poslání daru jiné postavě zvýší její [Concept('opinion','mínění')|El] o tobě výměnou za [Concept('gold','zlato')|El][gold_i].\n\nČím chamtivější je příjemce, tím více zlata budeš muset poslat a tím více mínění získáš.\n\nČím vyšší je tvá [Concept('diplomacy','diplomacie')|El], tím více mínění získáš."
 game_concept_vote_strength: "Síla hlasu"
 game_concept_valuable_prisoner: "Cenný vězeň"
 game_concept_valuable_prisoners: "Cenní vězni"
 game_concept_valuable_prisoner_desc: "Cenný vězeň je [Concept('prisoner','vězeň')|El], který při zajetí během [Concept('war','války')|El] poskytuje [Concept('war_score','válečné skóre')|El].\n\nAby byla osoba považována za cenného vězně, musí být třetí nebo výše v pořadí na zdědění hlavního titulu svého vůdce války.\n\nCenní vězni jsou po skončení války propuštěni, na rozdíl od [Concept('prisoners_of_war','válečných zajatců')|El]." # todo: CONCEPT CASE
 game_concept_prisoner_of_war: "Válečný zajatec"
 game_concept_prisoners_of_war: "Váleční zajatci"
 game_concept_prisoner_of_war_desc: "Válečný zajatec je [Concept('prisoner','vězeň')|El], který byl zajat během [Concept('war','války')|El], ale není natolik důležitý, aby věznitelům poskytoval [Concept('war_score','válečné skóre')|El].\n\n[Concept('valuable_prisoners','Cenní vězni')|E] jsou po skončení války propuštěni, na rozdíl od válečných zajatců, ty však lze stále vykoupit." # todo: CONCEPT CASE
 game_concept_single_combat_fight: "Souboj"
 game_concept_single_combat_duel: "Duel"
 game_concept_single_combat_fight_plural: "Souboje"
 game_concept_single_combat_duel_plural: "Duely"
 game_concept_single_combat_fight_sudden_death: "Náhlá smrt"
 game_concept_single_combat_fight_desc: "V souboji bojují dvě [Concept('characters','postavy')|El], buď na [Concept('character_death_death','smrt')|El], nebo do první krve. V každém kole si obě $game_concept_characters$ vyberou jednu náhodně vylosovanou možnost ze seznamu a vyměňují si údery, dokud jedna $game_concept_character$ nezasadí pořádný zásah. Dostupné možnosti závisí na tvé [Concept('prowess','udatnost')|El] a [Concept('traits','rysech')|El].\n\nNěkteré možnosti mohou přinášet zvláštní účinky a většina z nich zvýší tvou [Concept('single_combat_success_chance','pravděpodobnost úspěchu')|El] i [Concept('single_combat_injury_chance','riziko zranění')|El]. Jak $game_concept_single_combat_duel_plural$ pokračují, stávají se nebezpečnějšími a nejistějšími a je snazší zvítězit nebo si ublížit. Po několika kolech vstoupí $game_concept_single_combat_duel_plural$ do náhlé smrti, která okamžitě skončí vítězstvím bojovníka s vyšší udatností.\n\nPři duelech můžeš získat dočasné [Concept('character_modifiers','modifikátory postavy')|El] [Concept('single_combat_prowess_bonus','bonusu převahy v duelu')|El] nebo [Concept('single_combat_prowess_malus','postihu převahy v duelu')|El], které zvyšují nebo snižují tvou udatnost až do konce $game_concept_single_combat_duel$." # todo: CONCEPT CASE
 game_concept_single_combat_success_chance: "Pravděpodobnost úspěchu"
 game_concept_single_combat_success_chance_skill: "Úspěch v duelu"
 game_concept_single_combat_success_chance_desc: "Když bojuješ v souboji, tvá $game_concept_single_combat_success_chance$ vyjadřuje, jak dobře si v duelu vedeš. Abys zvítězil, musíš svou pravděpodobnost úspěchu dostat výrazně nad soupeřovu.\n\nJak kola pokračují, vítězství je snazší, což znamená, že potřebuješ menší náskok před soupeřem.\n\nProtějškem pravděpodobností úspěchu je [Concept('single_combat_injury_chance','riziko zranění')|El]." # todo: CONCEPT CASE
 game_concept_single_combat_injury_chance: "Riziko zranění"
 game_concept_single_combat_injury_chance_injure: "Zranit"
 game_concept_single_combat_injury_chance_injury_risk: "Riziko zranění"
 game_concept_single_combat_injury_chance_desc: "[Concept('characters','Postavy')|E] v soubojích riskují, že si ublíží, ať už tím, že omylem odkryjí kryt před soupeřem, nebo se prostě zraní vlastní zbraní. Během boje si také budují $game_concept_single_combat_injury_chance$.\n\nČím déle $game_concept_single_combat_duel_plural$ trvají, tím snazší je ublížit si.\n\nProtějškem rizikem zranění je [Concept('single_combat_success_chance','pravděpodobnost úspěchu')|El]." # todo: CONCEPT CASE
 game_concept_single_combat_prowess_bonus: "Bonus převahy v duelu"
 game_concept_single_combat_prowess_bonus_desc: "Když [Concept('characters','postavy')|El] svádějí $game_concept_single_combat_duel$, mohou získat dočasnou výhodu, například využitím [Concept('terrain','terénem')|El] nebo zvláštních [Concept('traits','rysů')|El]. To po dobu aktuálního střetu zvyšuje jejich [Concept('prowess','udatnost')|El] a ihned po něm je ztraceno.\n\nOpakem bonusem převahy v duelu je [Concept('single_combat_prowess_malus','postih převahy v duelu')|El]." # todo: CONCEPT CASE
 game_concept_single_combat_prowess_malus: "Postih převahy v duelu"
 game_concept_single_combat_prowess_malus_desc: "Když [Concept('characters','postavy')|El] svádějí $game_concept_single_combat_duel$, mohou utrpět dočasnou nevýhodu, často proto, že je soupeř těžce zraní nebo zastraší. To po dobu aktuálního střetu snižuje jejich [Concept('prowess','udatnost')|El], ale ihned po něm se obnoví.\n\nOpakem postihem převahy v duelu je [Concept('single_combat_prowess_bonus','bonus převahy v duelu')|El]." # todo: CONCEPT CASE
 game_concept_game_over: "Konec hry"
 game_concept_game_over_desc: "Hra končí, když tvá současná rodová linie vymře.\n\nI když však hra pro tvou rodovou linii skončí, stále si můžeš zvolit jiného [Concept('ruler','vládce')|El] kdekoli na světě.\n\nHra může skončit dvěma způsoby:\n$BULLET_WITH_TAB$Zemřeš bez [Concept('player_heir','hráčského dědice')|El]\n$BULLET_WITH_TAB$Dosáhneš roku 1453"
 game_concept_de_jure_partition: "De iure rozdělení"
 game_concept_de_jure_partitioned: "De iure rozděleno"
 game_concept_de_jure_partition_desc: "[Concept('realms','Panství')|E], která byla $game_concept_de_jure_partitioned$, byla rozdělena na dva [Concept('titles','tituly')|El] stejné [Concept('title_tier','úrovně')|El], ale stále je lze snadno znovu sjednotit.\n\nKterýkoli $game_concept_title$ může prostřednictvím [Concept('decision','rozhodnutí')|El] okamžitě [Concept('de_jure_drift_drift','přesunout de iure')|El] [Concept('completely_controlled','zcela ovládaná')|El] [Concept('duchies','vévodství')|El] druhého titulu do svého [Concept('de_jure','de iure')|El] území.\n\nPokud bude kterýkoli $game_concept_title$ zničen nebo ztratí poslední ze svých de iure [Concept('counties','hrabství')|El], zbývající $game_concept_title$ pohltí celé jeho de iure území." # todo: CONCEPT CASE
 game_concept_hybrid_culture: "Hybridní kultura"
 game_concept_hybrid_cultures: "Hybridní kultury"
 game_concept_hybridize: "Hybridizovat"
 game_concept_hybridized: "Hybridizováno"
 game_concept_hybridizing: "Hybridizace"
 game_concept_hybridizes: "Hybridizuje"
 game_concept_hybrid_culture_desc: "[SelectLocalization( HasDlcFeature( 'hybridize_culture' ), 'game_concept_hybrid_culture_desc_DLC', 'game_concept_hybrid_culture_desc_NO_DLC' )]"
 game_concept_hybrid_culture_desc_DLC: "Hybridní kultura je [Concept('culture','kultura')|El], kterou vytvořil [Concept('ruler','vládce')|El] spojením dvou existujících kultur.\n\nHybridní kultura je směsí [Concept('traditions','tradicemi')|El], [Concept('culture_pillars','kulturními pilíři')|El] a estetiky obou původních kultur.\n\nHybrid mohou vytvořit pouze kultury odlišného [Concept('heritage','dědictví')|El] a cena v [Concept('prestige','prestiži')|El] se odvíjí od jejich vzájemného [Concept('cultural_acceptance','kulturního přijetí')|El].\n\nČím vyšší je kulturní přijetí, tím více [Concept('counties','hrabství')|El] při vzniku hybridu konvertuje. Vládci hybridní kultury po dobu #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! let od jejího vzniku mnohem rychleji [Concept('promote_culture','prosazují kulturu')|El] v hrabstvích jejích rodičovských kultur.\n\nNové kultury mohou vzniknout také jako [Concept('divergent_culture','odštěpená kultura')|El]." # todo: CONCEPT CASE
 game_concept_hybrid_culture_desc_NO_DLC: "Hybridní kultura je [Concept('culture','kultura')|El], která vznikla spojením dvou jiných kultur.\n\nNové kultury mohou vzniknout také jako [Concept('divergent_culture','odštěpená kultura')|El]." # todo: CONCEPT CASE
 game_concept_divergent_culture: "Odštěpená kultura"
 game_concept_divergent_cultures: "Odštěpené kultury"
 game_concept_diverge: "Odštěpit se"
 game_concept_diverges: "Odštěpuje se"
 game_concept_divergent_culture_desc: "[SelectLocalization( HasDlcFeature( 'diverge_culture' ), 'game_concept_divergent_culture_desc_DLC', 'game_concept_divergent_culture_desc_NO_DLC' )]"
 game_concept_divergent_culture_desc_DLC: "Odštěpená kultura je odnož existující [Concept('culture','kultury')|El], kterou vytvořil [Concept('ruler','vládce')|El].\n\nOdštěpená kultura si zachovává své [Concept('heritage','dědictví')|El], ale jiné aspekty původní kultury lze změnit.\n\nKultura, od níž se odštěpuje, musí být stará alespoň [EmptyScope.ScriptValue('culture_divergence_cooldown')|0] let a cena odštěpení v [Concept('prestige','prestiži')|El] se odvíjí od [Concept('realm_size','velikosti panství')|El] vytvářejícího vládce.\n\nNové kultury mohou vzniknout také jako [Concept('hybrid_culture','hybridní kultura')|El]." # todo: CONCEPT CASE
 game_concept_divergent_culture_desc_NO_DLC: "Odštěpená kultura je odnož existující [Concept('culture','kultury')|El].\n\nNové kultury mohou vzniknout také jako [Concept('hybrid_culture','hybridní kultura')|El]." # todo: CONCEPT CASE
 game_concept_winter: "Tuhost zimy"
 game_concept_winter_desc: "Zima v průběhu času postupně odčerpává [Concept('supply','zásoby')|El], takže armády ztrácejí zásoby, když stojí v baronství postiženém zimou. Postih k zásobám se zvyšuje s každou úrovní tuhosti. Zima má tři různé úrovně tuhosti: [Concept( 'winter_severity_mild', 'mírnou' )|El], [Concept( 'winter_severity_normal', 'běžnou' )|El] a [Concept( 'winter_severity_harsh', 'krutou' )|El]."
 game_concept_winter_severity_mild: "Mírná zima"
 game_concept_winter_severity_mild_desc: "[GetModifier( 'winter_mild_modifier' ).GetDescWithEffects]"
 game_concept_winter_severity_normal: "Běžná zima"
 game_concept_winter_severity_normal_desc: "[GetModifier( 'winter_normal_modifier' ).GetDescWithEffects]"
 game_concept_winter_severity_harsh: "Krutá zima"
 game_concept_winter_severity_harsh_desc: "[GetModifier( 'winter_harsh_modifier' ).GetDescWithEffects]"
 game_concept_deceitful_progress_hostile_schemes_decision: "Rozhodnutí $deceitful_progress_hostile_schemes_decision$"
 game_concept_deceitful_progress_hostile_schemes_decision_desc: "[Concept('decision','Rozhodnutí')|E], které ti umožňuje vylepšit své [Concept('hostile_schemes','nepřátelské intriky')|El]. Poskytuje [Concept('success_chance','šanci na úspěch')|El] a [Concept('scheme_speed','rychlost intriky')|El] výměnou za [Concept('stress','stres')|El]."
 game_concept_diligent_development_focus_decision: "Rozhodnutí $diligent_development_focus_decision$"
 game_concept_diligent_development_focus_decision_desc: "[Concept('decision','Rozhodnutí')|E], které ti umožňuje vylepšit tvé [Concept('capital','hlavní sídlo')|El]. Poskytuje [Concept('development','rozvoj')|El] výměnou za [Concept('stress','stres')|El]."
 game_concept_impatient_rushing_all_schemes_decision: "Rozhodnutí $impatient_rushing_all_schemes_decision$"
 game_concept_impatient_rushing_all_schemes_decision_desc: "[Concept('decision','Rozhodnutí')|E], které ti umožňuje urychlit tvou [Concept('scheme','intriku')|El]. Poskytuje [Concept('scheme_opportunity_opportunities','výhody intriky')|El] výměnou za [Concept('stress','stres')|El]."
 game_concept_dismiss_strong_hook_interaction: "Interakce $dismiss_strong_hook_interaction$"
 game_concept_dismiss_strong_hook_interaction_desc: "[Concept('interaction','Interakce')|E], která ti umožňuje zbavit se [Concept('hook','pákou')|El] namířené proti tobě výměnou za [Concept('prestige','prestiž')|El]." # todo: CONCEPT CASE
 game_concept_abandon_hook_interaction: "Interakce $abandon_hook_interaction$"
 game_concept_abandon_hook_interaction_desc: "[Concept('interaction','Interakce')|E], která ti umožňuje vzdát se [Concept('hook','pákou')|El], kterou máš, výměnou za ztrátu [stress_loss_i][Concept('stress','stres')|El]." # todo: CONCEPT CASE
 game_concept_force_duel_criminals_interaction: "Interakce $force_duel_criminals_interaction$"
 game_concept_force_duel_criminals_interaction_desc: "[Concept('interaction','Interakce')|E], která ti umožňuje vyzvat [Concept('criminals','zločince')|El] na [Concept('single_combat_duel','duel')|El], když jsi [Concept('stressed','ve stresu')|El]."
 game_concept_force_duel_anyone_interaction: "Interakce $force_duel_anyone_interaction$"
 game_concept_force_duel_anyone_interaction_desc: "[Concept('interaction','Interakce')|E], která ti umožňuje vyzvat kohokoli na [Concept('single_combat_duel','duel')|El], když jsi [Concept('stressed','ve stresu')|El]."
 game_concept_artifact_rarity: "Vzácnost artefaktu"
 game_concept_rarity: "Vzácnost"
 game_concept_artifact_rarity_desc: "Některé [Concept('artifacts','artefakty')|El] jsou vzácnější než jiné, což se odráží v jejich vzácnosti.\n\nÚrovně od nejnižší po nejvyšší jsou:\n$BULLET_WITH_TAB$Běžná (nikdy se nezobrazuje, protože jde o výchozí stav)\n$BULLET_WITH_TAB$$masterwork$\n$BULLET_WITH_TAB$$famed$\n$BULLET_WITH_TAB$$illustrious$"
 game_concept_promote_other_culture_development_decision: "Rozhodnutí $promote_other_culture_development_decision_name$"
 game_concept_promote_other_culture_development_decision_desc: "[Concept('decision','Rozhodnutí')|E], které ti umožňuje zlepšit [Concept('development','rozvoj')|El], [Concept('control','kontrolu')|El], náklady na [Concept('building','budovu')|El] a obrannou [Concept('advantage','výhodu')|El] v [Concept('counties','hrabství')|El] odlišných [Concept('cultures','kulturách')|El] s [Concept('cultural_acceptance','kulturním přijetím')|El] #V 75 %#! nebo vyšším.\n\nPřijetí tohoto rozhodnutí také zvýší tvou [Concept('prestige','prestiž')|El] [prestige_i] a [Concept('levies','odvedence')|El].\n\nOvlivněna jsou všechna hrabství v [Concept('realm','panství')|El]. Cena ve [Concept('gold','zlatě')|El] se škáluje podle počtu ovlivněných hrabství." # todo: CONCEPT CASE
 game_concept_reform: "Reforma"
 game_concept_reformation: "Reformace"
 game_concept_reformation_desc: "[Concept('culture_head','Hlava kultury')|E] může prostřednictvím reformací změnit určité části své [Concept('culture','kulturu')|El]. Jde o proces, který trvá dlouho a po zahájení jej nelze zastavit. \n\nReformovatelné části jsou:\n$BULLET_WITH_TAB$[Concept('traditions','Tradice')|E]\n$BULLET_WITH_TAB$[Concept('ethos','Étos')|E]\n$BULLET_WITH_TAB$[Concept('martial_custom','Válečnický zvyk')|E]" # todo: CONCEPT CASE
 game_concept_buy_artifact_claim: "$buy_artifact_claim_interaction$"
 game_concept_buy_artifact_claim_interaction: "Interakce $buy_artifact_claim_interaction$"
 game_concept_buy_artifact_claim_desc: "Interakce, která postavě umožňuje koupit [Concept('personal_artifact_claims','osobní nároky na artefakty')|El] výměnou za [Concept('piety','zbožnost')|El] nebo [Concept('prestige','prestiž')|El]."
 game_concept_vassal_contract: "Vazalská smlouva"
 game_concept_vassal_contracts: "Vazalské smlouvy"
 game_concept_vassal_contract_desc: "Vazalské smlouvy určují [Concept('obligations','povinnosti')|El] mezi [Concept('vassal','vazalem')|El] a jeho [Concept('liege','lenního pána')|El].\n\nVazalové [Concept('feudal','feudálních')|El], [Concept('clan','klanových')|El], [Concept('administrative','administrativních')|El] a [Concept('nomadic','kočovných')|El] $game_concept_government_forms$ mají přístup k různým [Concept('obligations','povinnostem')|El], sjednávaným individuálně pro každého vazala.\n\nVšichni vazalové odvádějí svému lennímu pánovi procento ze svých celkových [Concept('taxes','daní')|El] a [Concept('levies','odvedenců')|El] podle svých [Concept('obligations','povinností')|El]. #EMP Tyto [Concept('modifier_contributions','modifikované příspěvky')|El] pak mohou být upraveny možnostmi „drobným písmem“, například [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )].#!\n\nNěkteré zvláštní smlouvy jsou omezeny na určité hodnosti:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] a [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [Concept('duke','vévoda')|E] a výše\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [Concept('count','hrabě')|E] a výše\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: pouze [Concept('count','hrabě')|E]\n\n#weak Poznámka: [Concept('governor','guvernérské')|El] [Concept('obligations','povinnosti')|El] jsou také známy jako [Concept('province_administrations','správy provincií')|El].#!" # todo: CONCEPT CASE
 game_concept_vassal_directive: "Vazalská směrnice"
 game_concept_vassal_directives: "Vazalské směrnice"
 game_concept_directive: "Směrnice"
 game_concept_directives: "Směrnice"
 game_concept_vassal_directive_desc: "Jako [Concept('liege','lenní pán')|El] můžeš svým [Concept('vassals','vazaly')|El] vydávat směrnice, které ovlivňují jejich [Concept('councillor_tasks','úkoly rádců')|El] a to, jaké [Concept('buildings','budovy')|El] staví.\n\nAbys mohl směrnici vydat, musíš ji zpřístupnit, například tím, že budeš mít u daného vazala [Concept('opinion','mínění')|El] #P 50#! nebo vyšší. Pokročilé [Concept('government_forms','formy vlády')|El] toto nevyžadují." # todo: CONCEPT CASE
 game_concept_tributary_contract: "Tributární smlouva"
 game_concept_tributary_contracts: "Tributární smlouvy"
 game_concept_tributary_contract_desc: "Tributární smlouva určuje [Concept('obligations','povinnosti')|El] mezi [Concept('tributary','tributářem')|El] a jeho [Concept('suzerain','suzerénem')|El].\n\nVšichni tributáři mají přístup k různým [Concept('obligations','povinnostem')|El], sjednávaným individuálně pro každého tributáře.\n\nTributáři odvádějí svému suzerénovi procento ze svých celkových [Concept('taxes','daní')|El], [Concept('levies','odvedenců')|El], [Concept('herd','stáda')|El], [Concept('prestige','prestiží')|El] nebo dokonce [Concept('piety','zbožnosti')|El] podle svých [Concept('obligations','povinností')|El]." # todo: CONCEPT CASE
 game_concept_board_game_match: "Partie"
 game_concept_board_game: "Desková hra"
 game_concept_board_games: "Deskové hry"
 game_concept_board_game_game: "Hra"
 game_concept_board_game_match_desc: "Desková hra sestává ze dvou hráčů, kteří proti sobě zkoušejí štěstí i dovednost ve hře důvtipu a náhody. Mohou se hrát jako přátelské partie nebo s nějakou sázkou.\n\n#weak Existuje mnoho různých [Concept('board_game_types','typů deskových her')|El], ačkoli způsoby, jak [Concept('board_game_win','zvítězit')|El] a hrát každou z nich, zůstávají stejné. Liší se pouze používané dovednosti.#!"
 game_concept_board_game_winning: "Vítězství"
 game_concept_board_game_win: "Zvítězit"
 game_concept_board_game_winning_sudden_death: "Náhlá smrt"
 game_concept_board_game_winning_desc: "Zvítězit ve deskové hře lze jedním ze dvou způsobů:\n$EFFECT_LIST_BULLET$ Získáním výrazného bodového náskoku nad soupeřem.\n$EFFECT_LIST_BULLET$ Tím, že jsi bránícím hráčem, pokud po [EmptyScope.ScriptValue('bg_round_cap_value')|0]. kole není jasný vítěz." # todo: CONCEPT CASE
 game_concept_board_game_type: "Typ deskové hry"
 game_concept_board_game_types: "Typy deskových her"
 game_concept_board_game_type_counter: "kontrují"
 game_concept_board_game_type_counters: "kontruje"
 game_concept_board_game_type_desc_guts: "Při hraní deskové hře různé herní styly $game_concept_board_game_type_counter$ strategii tvého soupeře. Kontruješ-li jeho tahy, výrazně tím snížíš počet bodů, které za ně získá, i když uspěje. Zdatní soupeři si mohou všimnout tvých vlastních dovedností a záměrně se pokusit kontrovat #EMP tebe#!." # todo: CONCEPT CASE
 game_concept_board_game_type_desc: "Při hraní $game_concept_board_game$ různé herní styly $game_concept_board_game_type_counter$ strategii tvého soupeře. Kontruješ-li jeho tahy, výrazně tím snížíš počet bodů, které za ně získá, i když uspěje. Zdatní soupeři si mohou všimnout tvých vlastních dovedností a záměrně se pokusit kontrovat #EMP tebe#!.\n\nDostupné hry jsou:\n$EFFECT_LIST_BULLET$ [Concept('board_game_type_chess','Šachy')|E]\n$EFFECT_LIST_BULLET$ [Concept('board_game_type_pachisi','Pačísí')|E]\n$EFFECT_LIST_BULLET$ [Concept('board_game_type_hnefatafl','Hnefatafl')|E]\n$EFFECT_LIST_BULLET$ [Concept('board_game_type_tabula','Tabula')|E]\n$EFFECT_LIST_BULLET$ [Concept('board_game_type_go','Go')|E]\n$EFFECT_LIST_BULLET$ [Concept('board_game_type_fidchell','Fidchell')|E]" # todo: CONCEPT CASE
 game_concept_board_game_type_chess: "Šachy"
 game_concept_board_game_type_chess_desc: "Při hraní $game_concept_board_game$ různé herní styly $game_concept_board_game_type_counter$ strategii tvého soupeře. Kontruješ-li jeho tahy, výrazně tím snížíš počet bodů, které za ně získá, i když uspěje. Zdatní soupeři si mohou všimnout tvých vlastních dovedností a záměrně se pokusit kontrovat #EMP tebe#!.\n\nV šachách:\n$EFFECT_LIST_BULLET$ [Concept('martial','Válečnictví')|E] kontruje [Concept('learning','učenost')|E]\n$EFFECT_LIST_BULLET$ [Concept('learning','Učenost')|E] kontruje [Concept('intrigue','pletichářství')|E]\n$EFFECT_LIST_BULLET$ [Concept('intrigue','Pletichářství')|E] kontruje [Concept('martial','válečnictví')|E]" # todo: CONCEPT CASE
 game_concept_board_game_type_pachisi: "Pačísí"
 game_concept_board_game_type_pachisi_desc: "Při hraní $game_concept_board_game$ různé herní styly $game_concept_board_game_type_counter$ strategii tvého soupeře. Kontruješ-li jeho tahy, výrazně tím snížíš počet bodů, které za ně získá, i když uspěje. Zdatní soupeři si mohou všimnout tvých vlastních dovedností a záměrně se pokusit kontrovat #EMP tebe#!.\n\nV pačísí:\n$EFFECT_LIST_BULLET$ [Concept('diplomacy','Diplomacie')|E] kontruje [Concept('intrigue','pletichářství')|E]\n$EFFECT_LIST_BULLET$ [Concept('intrigue','Pletichářství')|E] kontruje [Concept('stewardship','správcovství')|E]\n$EFFECT_LIST_BULLET$ [Concept('stewardship','Správcovství')|E] kontruje [Concept('diplomacy','diplomacie')|E]" # todo: CONCEPT CASE
 game_concept_board_game_type_hnefatafl: "Hnefatafl"
 game_concept_board_game_type_hnefatafl_desc: "Při hraní $game_concept_board_game$ různé herní styly $game_concept_board_game_type_counter$ strategii tvého soupeře. Kontruješ-li jeho tahy, výrazně tím snížíš počet bodů, které za ně získá, i když uspěje. Zdatní soupeři si mohou všimnout tvých vlastních dovedností a záměrně se pokusit kontrovat #EMP tebe#!.\n\nV hnefatafl:\n$EFFECT_LIST_BULLET$ [Concept('intrigue','Pletichářství')|E] kontruje [Concept('martial','válečnictví')|E]\n$EFFECT_LIST_BULLET$ [Concept('martial','Válečnictví')|E] kontruje [Concept('prowess','udatnost')|E]\n$EFFECT_LIST_BULLET$ [Concept('prowess','Udatnost')|E] kontruje [Concept('intrigue','pletichářství')|E]" # todo: CONCEPT CASE
 game_concept_board_game_type_tabula: "Tabula"
 game_concept_board_game_type_tabula_desc: "Při hraní $game_concept_board_game$ různé herní styly $game_concept_board_game_type_counter$ strategii tvého soupeře. Kontruješ-li jeho tahy, výrazně tím snížíš počet bodů, které za ně získá, i když uspěje. Zdatní soupeři si mohou všimnout tvých vlastních dovedností a záměrně se pokusit kontrovat #EMP tebe#!.\n\nV tabule:\n$EFFECT_LIST_BULLET$ [Concept('intrigue','Pletichářství')|E] kontruje [Concept('learning','učenost')|E]\n$EFFECT_LIST_BULLET$ [Concept('learning','Učenost')|E] kontruje [Concept('stewardship','správcovství')|E]\n$EFFECT_LIST_BULLET$ [Concept('stewardship','Správcovství')|E] kontruje [Concept('intrigue','pletichářství')|E]" # todo: CONCEPT CASE
 game_concept_house_unity: "Jednota rodu"
 game_concept_unity: "Jednota"
 game_concept_house_unity_i: "@dynasty_house_unity!"
 game_concept_house_unity_desc: "Jednota rodu představuje stav vnitřních vztahů v [Concept('clan','klanovém')|El] [Concept('house','rodě')|El] a postoje, které k sobě jeho členové navzájem chovají.\n\nExistuje několik [Concept('house_unity_levels','úrovně jednoty rodu')|El], které členům rodu poskytují různé výhody a postihy.\n\nJednota rodu se mění podle činů, které členové rodu podnikají vůči sobě navzájem. [Concept('house_unity_unifying_actions','Sjednocující činy')|E] budou $game_concept_house_unity$ obecně zvyšovat, zatímco [Concept('house_unity_devisive_actions','rozdělující činy')|El] ji budou snižovat. [Concept('house_head','Hlava rodu')|E] má obecně větší vliv na jednotu svého rodu." # todo: CONCEPT CASE
 game_concept_house_unity_level: "Úroveň jednoty rodu"
 game_concept_house_unity_levels: "Úrovně jednoty rodu"
 game_concept_house_unity_level_desc: "Úroveň jednoty rodu je aktuální stav [Concept('house_unity','jednoty rodu')|El]. Aktivní úroveň se mění podle toho, jak jednota roste díky [Concept('house_unity_unifying_actions','sjednocujícím činům')|El] nebo klesá kvůli [Concept('house_unity_devisive_actions','rozdělujícím činům')|El], a každá úroveň poskytuje členům [Concept('house','rodu')|El] různé výhody a postihy.\n\nExistuje pět různých úrovní:\n[GetCurrentHouseUnityStagesDescForLocalPlayer]\n\nKaždá úroveň s sebou nese vlastní [Concept('succession_law','zákon nástupnictví')|El] [Concept('house','rod')|El]." # todo: CONCEPT CASE
 game_concept_house_unity_unifying_actions: "Sjednocující činy"
 game_concept_house_unity_unifying_actions_desc: "Sjednocující činy vůči členům tvého [Concept('house','rodu')|El] zvýší tvou [Concept('house_unity','jednotu rodu')|El].\n\n[Concept('house_heads','Hlavy rodu')|E] mohou použít [Concept('decision','rozhodnutí')|El] #V $unity_steer_house_direction_decision$#! a [Concept('interaction','interakci')|El] #V $extoll_virtuousness_interaction$#!, aby jednotu výrazně zvýšily.\n\n#weak Některé příklady sjednocujících činů jsou:$house_unity_increase_examples$#!"
 game_concept_house_unity_devisive_actions: "Rozdělující činy"
 game_concept_house_unity_devisive_actions_desc: "Rozdělující činy vůči členům tvého [Concept('house','rodu')|El] sníží tvou [Concept('house_unity','jednotu rodu')|El].\n\n[Concept('house_heads','Hlavy rodu')|E] mohou použít [Concept('decision','rozhodnutí')|El] #V $unity_steer_house_direction_decision$#! a [Concept('interaction','interakci')|El] #V $accuse_of_decandence_interaction$#!, aby jednotu výrazně snížily.\n\n#weak Některé příklady rozdělujících činů jsou:$house_unity_decrease_examples$#!"
 game_concept_house_succession_law: "Zákon rodového nástupnictví"
 game_concept_house_succession_law_desc: "V [Concept('realms','panství')|El] s vládou typu [GetGovernment('clan_government').GetName] určuje aktuální [Concept('house_unity_level','úroveň jednoty rodu')|El], který [Concept('succession_law','zákon nástupnictví')|El] se použije.\n\nKlany mohou přejít na zákon nástupnictví $SUCCESSION_LAW_CHANGE_WINDOW_SINGLE_HEIR_LAWS$, který zabrání tomu, aby jej [Concept('house_unity','jednotu rodu')|El] měnila, ale je to mnohem obtížnější než obvykle." # todo: CONCEPT CASE
 house_unity_increase_examples: "\n$EFFECT_LIST_BULLET$ $negotiate_alliance_interaction$\n$EFFECT_LIST_BULLET$ $join_war_interaction$\n$EFFECT_LIST_BULLET$ $gift_artifact_interaction$\n$EFFECT_LIST_BULLET$ $pay_ransom_interaction$\n$EFFECT_LIST_BULLET$ $offer_guardianship_interaction$\n$EFFECT_LIST_BULLET$ $send_to_holy_order_interaction$\n$EFFECT_LIST_BULLET$ $restore_inheritance_interaction$\n$EFFECT_LIST_BULLET$ $abandon_hook_interaction$\n$EFFECT_LIST_BULLET$ $stop_attacker_vassal_war_interaction$\n$EFFECT_LIST_BULLET$ $fund_inspiration_interaction$\n$EFFECT_LIST_BULLET$ $propose_best_friendship_interaction$"
 house_unity_decrease_examples: "\n$EFFECT_LIST_BULLET$ $revoke_title_interaction$\n$EFFECT_LIST_BULLET$ $declare_war_interaction$\n$EFFECT_LIST_BULLET$ $imprison_interaction$\n$EFFECT_LIST_BULLET$ $move_to_dungeon_interaction$\n$EFFECT_LIST_BULLET$ $force_join_faction_interaction$\n$EFFECT_LIST_BULLET$ $disinherit_interaction$\n$EFFECT_LIST_BULLET$ $denounce_interaction$\n$EFFECT_LIST_BULLET$ $expose_secret_interaction$\n$EFFECT_LIST_BULLET$ $blackmail_interaction$\n$EFFECT_LIST_BULLET$ $break_betrothal_interaction$\n$EFFECT_LIST_BULLET$ $join_independence_faction_interaction$\n$EFFECT_LIST_BULLET$ $sumptuary_law_debate_interaction$\n$EFFECT_LIST_BULLET$ $vassal_claim_liege_title_interaction$"
 game_concept_dreams: "Sny"
 game_concept_dreams_desc: "Postavy následující víru s principem věštění mohou občas zakoušet sny. Tyto sny pak může vyložit mystik, což může mít různé následky, dobré i špatné."
 game_concept_board_game_type_go: "Go"
 game_concept_board_game_type_go_desc: "Při hraní $game_concept_board_game$ různé herní styly $game_concept_board_game_type_counter$ strategii tvého soupeře. Kontruješ-li jeho tahy, výrazně tím snížíš počet bodů, které za ně získá, i když uspěje. Zdatní soupeři si mohou všimnout tvých vlastních dovedností a záměrně se pokusit kontrovat #EMP tebe#!.\n\nV $game_concept_board_game_type_go$:\n$EFFECT_LIST_BULLET$ [Concept('learning','Učenost')|E] kontruje [Concept('martial','válečnictví')|E]\n$EFFECT_LIST_BULLET$ [Concept('martial','Válečnictví')|E] kontruje [Concept('intrigue','pletichářství')|E]\n$EFFECT_LIST_BULLET$ [Concept('intrigue','Pletichářství')|E] kontruje [Concept('learning','učenost')|E]" # todo: CONCEPT CASE
 game_concept_board_game_type_fidchell: "Fidchell"
 game_concept_board_game_type_fidchell_desc: "Při hraní $game_concept_board_game$ různé herní styly $game_concept_board_game_type_counter$ strategii tvého soupeře. Kontruješ-li jeho tahy, výrazně tím snížíš počet bodů, které za ně získá, i když uspěje. Zdatní soupeři si mohou všimnout tvých vlastních dovedností a záměrně se pokusit kontrovat #EMP tebe#!.\n\nV $game_concept_board_game_type_fidchell$:\n$EFFECT_LIST_BULLET$ [Concept('learning','Učenost')|E] kontruje [Concept('prowess','udatnost')|E]\n$EFFECT_LIST_BULLET$ [Concept('prowess','Udatnost')|E] kontruje [Concept('diplomacy','diplomacie')|E]\n$EFFECT_LIST_BULLET$ [Concept('diplomacy','Diplomacie')|E] kontruje [Concept('learning','učenost')|E]" # todo: CONCEPT CASE
 game_concept_strife: "Svár"
 game_concept_strife_opinion: "Mínění ze sváru"
 game_concept_strife_desc: "Svár je postih k [Concept('opinion','mínění')|El] vůči ostatním [Concept('vassals','vazalům')|El].\n\nSvár vzniká, když poddaný [Concept('liege','lenního pána')|El] podnikne akci proti jinému [Concept('vassal','vazalovi')|El]. Například když $game_concept_diarch$ použije své [Concept('diarch_powers','propůjčené pravomoci')|El] nebo v událostech [Concept('mandate','mandátě')|El], protože $game_concept_diarch$ nemá stejnou autoritu jako jeho [Concept('liege','lenního pána')|El]." # todo: CONCEPT CASE
 game_concept_diarchy: "Sdílení moci"
 game_concept_diarchies: "Sdílení moci"
 game_concept_share_power: "Sdílet moc"
 game_concept_sharing_power: "Sdílení moci"
 game_concept_power_sharing: "Sdílení moci"
 game_concept_diarchy_desc: "Ke sdílení moci dochází, když [Concept('ruler','vládce')|El] sdílí část své autority s jedním ze svých [Concept('vassals','vazalů')|El] nebo [Concept('courtiers','dvořanů')|El], který se stane jeho [Concept('diarch','diarchou')|El].\n\nVládce, který sdílí svou moc, může svému $game_concept_diarch$ určovat [Concept('mandates','mandáty')|El], zatímco $game_concept_diarch$ může využívat zvláštní [Concept('diarch_powers','propůjčené pravomoci')|El].\n\n[Concept('scales_of_power','Misky vah moci')|E] měří, zda má větší autoritu vládce, nebo $game_concept_diarch$."
 game_concept_diarch: "Diarcha"
 game_concept_diarchs: "Diarchové"
 game_concept_diarch_possessive: "Diarchův"
 game_concept_diarchs_possessive: "Diarchů"
 game_concept_diarch_desc: "Mladší partner během [Concept('diarchy','sdílení moci')|El]; $game_concept_diarch$ pomáhá svému [Concept('liege','lennímu pánovi')|El] spravovat [Concept('realm','panství')|El].\n\nDiarcha má přístup k [Concept('diarch_powers','propůjčeným pravomocím')|El] a získává jich více, jak se [Concept('scales_of_power','miskami vah moci')|El] přiklánějí v jeho prospěch." # todo: CONCEPT CASE
 game_concept_regent: "Regent"
 game_concept_regents: "Regenti"
 game_concept_regent_possessive: "Regentův"
 game_concept_regents_possessive: "Regentů"
 game_concept_regent_desc: "Regent je označení pro [Concept('diarch','diarcha')|El] během [Concept('regency','regentství')|El].\n\n[Concept('ruler','Vládce')|E] může regenta určit ještě před začátkem regentství. Jinak je automaticky zvolen kandidát s nejvyšším [Concept('regent_succession_score','skóre nástupnictví regenta')|El]."
 variant_diarchs_replace_regents_boilerplate: "#WEAK Protože $game_concept_ruler$ může mít vždy jen jednoho $game_concept_diarch$, zůstane ve funkci i v případě, že by nastalo [Concept('regency','regentství')|El].#!"
 game_concept_vizier: "Vezír"
 game_concept_viziers: "Vezíři"
 game_concept_vizierate: "Vezírát"
 game_concept_vizier_desc: "Vezír je typ [Concept('diarch','diarcha')|El], kterého mohou [Concept('clan','klanoví')|El] [Concept('rulers','vládci')|El] dobrovolně jmenovat, aby jim pomohl zvýšit [Concept('income','příjem')|El]. Má méně přístupu k [Concept('diarch_powers','propůjčeným pravomocím')|El], ale může být velmi obtížné jej sesadit.\n\nVezíři poskytují svému [Concept('liege','lennímu pánovi')|El] bonusové [Concept('tax_jurisdictions','daňové jurisdikce')|El] škálující se podle jejich [Concept('stewardship','správcovství')|El] a zvyšují [Concept('aptitude','způsobilost')|El] [Concept('tax_collectors','výběrčích daní')|El] podle toho, nakolik jim [Concept('scales_of_power','miskám vah moci')|El] přejí.\n\nZásadní je, že $game_concept_lieges$ mohou $game_concept_viziers$ připravit o jejich [gold_i][Concept('gold','zlato')|El] prostřednictvím [Concept('interaction','interakce')|El] $mulct_vizier_interaction$.\n\n#WEAK Jako posílení civilní úředníci nejsou $game_concept_viziers$ navzdory svému vlivu považováni za prestižní postavení pro [Concept('nobles','urozené')|El]. Jejich nástupce je vybírán podle [Concept('vizier_succession_score','skóre nástupnictví vezíra')|El].#!\n\n$variant_diarchs_replace_regents_boilerplate$" # todo: CONCEPT CASE
 game_concept_confidant: "$councillor_vizier$"
 game_concept_confidant_desc: "$councillor_vizier_desc$"
 game_concept_vizier_succession_score: "Skóre nástupnictví vezíra"
 game_concept_vizier_succession_score_desc: "Ve [Concept('vizierate','vezírátu')|El] je příští vezíra vybrán podle toho, který kandidát má nejvyšší skóre nástupnictví vezíra.\n\nNadějní kandidáti se mohou občas pokusit přesvědčit [Concept('ruler','vládce')|El], aby jim dovolil nahradit současného držitele úřadu výměnou za [Concept('gold','zlato')|El].\n\n#WEAK To umožňuje pouze bezzemským [Concept('characters','postavám')|El] a [Concept('characters','postavám')|El] [Concept('title_tier','úrovně')|El] [Concept('baron','barona')|El], přičemž zvýhodňuje ty se silnou [Concept('diplomacy','diplomacií')|El], [Concept('stewardship','správcovstvím')|El] a [Concept('intrigue','pletichářstvím')|El] i [Concept('traits','rysy')|El], které se hodí pro dobrého civilního úředníka.\n\n[Concept('relations','Zvláštní vztahy')|E] se současným vezírem nebo s [Concept('spouses','chotěmi')|El], [Concept('concubines','konkubínami')|El] a [Concept('adult','dospělými')|El] bezzemskými [Concept('children','dětmi')|El] [Concept('liege','lenním pánem')|El] mohou skóre výrazně ovlivnit.#!" # todo: CONCEPT CASE
 game_concept_vizier_extravagance: "Vezírova okázalost"
 game_concept_vizier_extravagances: "Vezírovy okázalosti"
 game_concept_vizier_extravagance_extravagance: "Okázalost"
 game_concept_vizier_extravagance_extravagances: "Okázalosti"
 game_concept_vizier_extravagance_desc: "Během výkonu úřadu budou [Concept('viziers','vezíři')|El] utrácet své [Concept('gold','zlato')|El] za stále zdobnější [Concept('modifiers','modifikátory')|El] $game_concept_vizier_extravagance_extravagance$, hýčkat sebe i další společenskou elitu [Concept('capital','hlavní sídlo')|El] svého [Concept('liege','lenního pána')|El].\n\nLenní pán může tyto $game_concept_modifiers$ vyplenit pomocí [Concept('interaction','interakce')|El] $mulct_vizier_interaction$ a proměnit je ve zlatu, které je $game_concept_vizier$ nucen předat.\n\n#WEAK Když $game_concept_vizier$ přestane [Concept('sharing_power','sdílet moc')|El], ztratí schopnost udržovat svůj okázalý životní styl a všechny zbývající $game_concept_modifiers$ jsou ztraceny.\n\nPlenění vyšších a pozdějších úrovní poskytuje více $game_concept_gold$ — čtyři úrovně okázalosti jsou:\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t1_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t2_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t3_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t4_title$#!" # todo: CONCEPT CASE
 game_concept_co_rulership: "Spoluvláda"
 game_concept_co_rulerships: "Spoluvlády"
 game_concept_co_ruler: "Spoluvládce"
 game_concept_co_rulers: "Spoluvládci"
 game_concept_co_rulership_desc: "Spoluvládci jsou formou [Concept('diarchies','sdílením moci')|El], kde je [Concept('diarch','diarcha')|El] považován za někoho, kdo se oficiálně a trvale podílí na vládě nad [Concept('realm','panstvím')|El].\n\nVždy jsou [Concept('designated_heir','určeným dědicem')|El] (ačkoli mohou stále prohrát volby) a z úřadu je lze odstranit pouze [Concept('execution','popravou')|El] — pokud jejich [Concept('liege','lenní pán')|El] nemá příslušnou [Concept('culture_tradition','kulturní tradice')|El], v takovém případě mohou být místo toho zmrzačeni.\n\nJedinečně platí, že když $game_concept_co_ruler$ popraví svého lenního pána nebo jej porazí ve válce, [Concept('usurp','uzurpuje')|El] jeho [Concept('titles','titulů')|El]. V [Concept('cultures','kulturách')|El], kde je zmrzačení přijatelným způsobem odstranění $game_concept_co_ruler$, může $game_concept_co_ruler$ svého lenního pána také zmrzačit, aby jej mohl $game_concept_usurp$.\n\n#WEAK Mezi příklady $game_concept_co_rulerships$ patří:\n$EFFECT_LIST_BULLET$[Concept('duumvirates','Duumviráty')|E]\n$EFFECT_LIST_BULLET$[Concept('nominal_duumvirates','Formální duumviráty')|E]\n$EFFECT_LIST_BULLET$[Concept('co_monarchies','Spolumonarchie')|E]#!" # todo: CONCEPT CASE
 game_concept_duumvirate: "Duumvirát"
 game_concept_duumvirates: "Duumviráty"
 game_concept_co_emperor: "Spolucísař"
 game_concept_co_emperors: "Spolucísaři"
 game_concept_duumvirate_desc: "Duumvirát je vláda nad jednou [Concept('empire','říší')|El] dvěma [Concept('characters','postavám')|El]: starším císařem ([Concept('liege','lenním pánem')|El]) a mladším císařem (spolucísařem).\n\nVytvářejí pasivní [Concept('influence','vliv')|El] pro sebe i svého staršího císaře. Přesné množství se zvyšuje každých [EmptyScope.ScriptValue('co_emperor_scale_years_in_job_value')|0] let v úřadu, včetně času, který strávili jako [Concept('junior_emperor','mladší císař')|El].\n\nV praxi většina moci stále spočívá v rukou lenním pánovi, který skutečně drží císařský titul, a nikoli jejich [Concept('diarch','diarcha')|El], ale $game_concept_co_emperor$ má přístup k několika mocným způsobům, jak ovlivnit [Concept('realm','panství')|El], a je levnějším kandidátem k povýšení do [Concept('administrative','administrativních')|El] funkcí.\n\nZejména mohou $game_concept_co_emperors$ při vyšším vychýlení [Concept('scales_of_power','miskách vah moci')|El] používat [Concept('casus_belli','casus belli')|El] [Concept('imperial_expedition_cb','císařské tažení')|E].\n\n#WEAK Spolucísaři mohou [Concept('usurp','uzurpovat')|El] svého staršího císaře tím, že jej rituálně zmrzačí.#!" # todo: CONCEPT CASE
 game_concept_nominal_duumvirate: "Formální duumvirát"
 game_concept_nominal_duumvirates: "Formální duumviráty"
 game_concept_junior_emperor: "Formální spolucísař"
 game_concept_junior_emperors: "Formální spolucísaři"
 game_concept_nominal_duumvirate_desc: "Duumvirát je vláda nad jednou [Concept('empire','říší')|El] dvěma [Concept('characters','postavám')|El]: starším císařem ([Concept('liege','lenním pánem')|El]) a mladším císařem (formálním spolucísařem).\n\nZa $game_concept_nominal_duumvirates$ jsou považováni tehdy, když je mladší císař [Concept('child','dítětem')|El], které nedokáže účinně vládnout, ale po dosažení dospělosti přejdou v plné [Concept('duumvirates','duumviráty')|El].\n\nFormální spolucísaři vytvářejí pasivní [Concept('influence','vliv')|El] pro sebe i svého staršího císaře. Přesné množství se zvyšuje každých [EmptyScope.ScriptValue('co_emperor_scale_years_in_job_value')|0] let v úřadu a přenáší se, když se stanou plnohodnotnými spolucísařy.\n\n#WEAK Jmenování $game_concept_child$ $game_concept_junior_emperor$ je označí jako někoho, kdo je cvičen, aby se jednoho dne pravděpodobně stal starším císařem. Čím více praxe získají, tím více výcviku obdrží.\n\nTo je znázorněno dodatečnou [Concept('skill','dovednost')|El], která jim bude rozdělena, až se stanou [Concept('adult','dospělým')|El], podle vychýlení jejich [Concept('scales_of_power','misek vah moci')|El].\n\nDěti nedostávají události [Concept('mandate','mandátu')|El].#!" # todo: CONCEPT CASE
 game_concept_co_monarchy: "Spolumonarchie"
 game_concept_co_monarchies: "Spolumonarchie"
 game_concept_co_monarch: "Spolupanovník"
 game_concept_co_monarchs: "Spolupanovníci"
 game_concept_co_monarchy_desc: "Spolumonarchie jsou typem [Concept('diarchy','sdílením moci')|El], který [Concept('feudal','feudálním')|El] vládcům poskytuje způsob, jak si zvolit [Concept('designated_heir','určeného dědice')|El] i v ranějších [Concept('eras','ér')|El].\n\nCenou za to je vstup do trvalé dohody o sdílení moci s danou osobou, která bude mít snazší přístup k mnoha stejným pravomocem jako [Concept('entrenched_regent','zakotvený regent')|El].\n\n#WEAK Spolupanovníci jsou dostupní pouze [Concept('kings','králům')|El] a [Concept('emperors','císařům')|El].#!" # todo: CONCEPT CASE
 game_concept_regency: "Regentství"
 game_concept_regencies: "Regentství"
 game_concept_regency_possessive: "Regentství"
 game_concept_regencies_possessive: "Regentství"
 game_concept_regency_desc: "Regentství je zvláštní forma [Concept('diarchy','sdílení moci')|El] pro situace, kdy [Concept('ruler','vládce')|El] nedokáže vládnout svému [Concept('realm','panství')|El] sám.\n\nObvykle nastává, pokud je vládce [Concept('child','dítě')|El], [Concept('imprisoned','uvězněn')|El], [GetTrait('incapable').GetName( GetNullCharacter )] nebo se účastní [Concept('activity','aktivitou')|El] mimo své panství.\n\nRegentství, které trvá příliš dlouho, se může stát [Concept('entrenched_regency','zakotveným regentstvím')|El]." # todo: CONCEPT CASE
 game_concept_regency_veto: "Veto spoluvlády"
 game_concept_veto: "Veto"
 game_concept_regency_veto_desc: "Když [Concept('diarch','diarcha')|El] použije své [Concept('diarch_powers','propůjčené pravomoci')|El], jeho [Concept('liege','lenního pána')|El] může použít veto spoluvlády a zastavit jej za cenu [Concept('prestige','prestiž')|El]." # todo: CONCEPT CASE
 game_concept_regent_succession_score: "Skóre regentského nástupnictví"
 game_concept_regent_succession_score_desc: "V [Concept('regency','regentství')|El] je příští [Concept('regent','regenta')|El] vybrán podle toho, který kandidát má nejvyšší skóre regentského nástupnictví.\n\nPokud [Concept('ruler','vládce')|El] [Concept('realm','panství')|El] určí regenta, přepíše tím pořadí nástupnictví a bude vybrán místo ostatních.\n\n#WEAK To zvýhodňuje [Concept('characters','postavy')|El] příbuzné vládce, zejména bezzemskou [Concept('family','rodinu')|El] u jeho [Concept('court','dvora')|El] a politicky obratné osoby.#!" # todo: CONCEPT CASE
 game_concept_diarch_power: "Propůjčená moc"
 game_concept_diarch_powers: "Propůjčené pravomoci"
 game_concept_diarch_power_power: "Moc"
 game_concept_diarch_power_powers: "Pravomoci"
 game_concept_diarch_power_possessive: "Propůjčené moci"
 game_concept_diarch_powers_possessive: "Propůjčených pravomocí"
 game_concept_diarch_power_power_possessive: "Moci"
 game_concept_diarch_power_powers_possessive: "Pravomocí"
 game_concept_diarch_power_desc: "[Concept('diarch','Diarcha')|E] při aktivním [Concept('power_sharing','sdílení moci')|El] má přístup ke zvláštním propůjčeným pravomocím.\n\nJde o zvláštní [Concept('character_interaction','interakci s postavou')|El], které napodobují ty, jež má jejich [Concept('liege','lenní pán')|El], nebo o jiné zneužití moci. Příkladem je [Concept('revoking','odebírání')|El] [Concept('titles','titulů')|El] ostatním [Concept('vassals','vazalům')|El] nebo odčerpávání [Concept('gold','zlata')|El] od jejich lenního pána.\n\nMnoho propůjčených pravomocí dává lennímu pánovi příležitost je [Concept('veto','vetovat')|El]." # todo: CONCEPT CASE
 game_concept_trilateral_interaction: "Trojstranná interakce"
 game_concept_trilateral_interactions: "Trojstranné interakce"
 game_concept_trilateral_interaction_desc: "Trojstranné interakce vyžadují nejen souhlas příjemce, ale také třetí strany.\n\nPříkladem jsou [Concept('diarch_powers','propůjčené pravomoci')|El], u nichž může [Concept('liege','lenní pán')|El] použít své [Concept('regency_veto','veto spoluvlády')|El]." # todo: CONCEPT CASE
 game_concept_mandate: "Mandát"
 game_concept_mandates: "Mandáty"
 game_concept_mandate_possessive: "Mandátu"
 game_concept_mandates_possessive: "Mandátů"
 game_concept_mandate_desc: "Mandáty jsou užitečné úkoly, které může [Concept('liege','lenní pán')|El] ukládat svému [Concept('diarch','diarchovi')|El] při [Concept('sharing_power','sdílení moci')|El].\n\nPodobně jako u [Concept('councillor_tasks','úkolů rádce')|El] si lennímu pánovi vybere $game_concept_mandate$ a poté z něj postupně získává výhody.\n\nKdyž $game_concept_diarch$ odvádí svou práci dobře, zároveň přiklání [Concept('scales_of_power','misky vah moci')|El] k sobě #EMP a#! vytváří [Concept('strife','svár')|El] s ostatními [Concept('vassals','vazaly')|El].\n\nTo, kolik výhod lenního pána získá, závisí na [Concept('diarch_aptitude','způsobilost diarcha')|El] a [Concept('diarch_loyalty','loajalitě diarcha')|El] $game_concept_diarch_possessive$." # todo: CONCEPT CASE
 game_concept_diarch_aptitude: "Způsobilost diarcha"
 game_concept_diarch_aptitude_desc: "Způsobilost diarcha určuje, jak dobře [Concept('diarch','diarcha')|El] plní jednotlivé [Concept('mandate','mandáty')|El] uložené jeho [Concept('liege','lenního pána')|El].\n\nRoli hrají jak [Concept('skills','dovednosti')|El], tak [Concept('personality_traits','osobnostní rysy')|El]. Například $game_concept_diarch$ s rysem [GetTrait('greedy').GetName(GetNullCharacter)], kterému byl svěřen mandát „$fill_coffers_mandate$“, nemusí svému lennímu pánovi posílat tolik [Concept('gold','zlata')|El].\n\n#WEAK [Concept('diarchs','Diarchové')|E] se pro mandát hodí dobře, když pro něj mají přibližně 40+ $game_concept_aptitude$.#!" # todo: CONCEPT CASE
 game_concept_diarch_loyalty: "Loajalita"
 game_concept_diarch_loyalty_explicit: "Loajalita diarcha"
 game_concept_diarch_loyal: "Loajální"
 game_concept_diarch_loyalty_desc: "Loajalita [Concept('diarch','Diarcha')|El] rozhoduje o tom, jak pravděpodobně bude zneužívat své pravomoci na úkor svého [Concept('liege','lenního pána')|El] nebo [Concept('realm','panství')|El].\n\n$DIARCHY_WINDOW_VISIBLY_LOYAL$ Diarchové se zdržují používání [Concept('diarch_powers','pravomocí spoluvládce')|El], snaží se svědomitě plnit uložený [Concept('mandate','mandát')|El] a na požádání se ochotně vzdají moci.\n\n$DIARCHY_WINDOW_VISIBLY_DISLOYAL$ Diarchové hojně využívají $game_concept_diarch_powers$, snaží se plnit svůj mandát, aby [Concept('scales_of_power','misky vah moci')|El] přiklonili svým směrem, a mohou odmítnout vzdát se moci, pokud jsou $game_concept_scales_of_power_scales$ dost výrazně nakloněny v jejich prospěch.\n\n$DIARCHY_WINDOW_UNKNOWN_LOYALTY$ Diarchové mohou používat $game_concept_diarch_powers$, obvykle se buď rozdělí o výhody $game_concept_mandate$ se svým lenním pánem, nebo svůj mandát zcela ignorují, a pokud jim miskám vah moci vyhovují, může být třeba je uplatit, aby se vzdali úřadu." # todo: CONCEPT CASE
 game_concept_diarch_succession: "Nástupnictví"
 game_concept_diarch_succession_explicit: "Nástupnictví diarcha"
 game_concept_diarch_succession_desc: "Nástupnictví diarcha určuje, který z přímých [Concept('vassals','vazalů')|El] nebo [Concept('courtiers','dvořanů')|El] [Concept('liege','lenního pána')|El] se automaticky stane [Concept('diarch','diarchou')|El], když je nějaký potřeba.\n\nK tomu dochází buď proto, že $game_concept_liege$ zahájí [Concept('diarchy','sdílení moci')|El], nebo proto, že současný $game_concept_diarch$ zemře či je odstraněn z úřadu.\n\n#weak Různé typy $game_concept_power_sharing$ mohou pořadí nástupnictví počítat odlišně — v [Concept('regency','regentství')|El] často převládají bezzemské [Concept('characters','postavy')|El] se silnými osobními vazbami na svého lenního pána.\n\nOvládat [Concept('language','jazyk')|El] $game_concept_liege$ (a [Concept('court_language','dvorský jazyk')|El], pokud nějaký má) je téměř vždy zásadní.#!" # todo: CONCEPT CASE
 game_concept_scales_of_power: "Misky vah moci"
 game_concept_scales_of_power_scales: "Misky vah"
 game_concept_scales_of_power_desc: "Během [Concept('power_sharing','sdílení moci')|El] se rovnováha moci mezi [Concept('liege','lenním pánem')|El] a jeho [Concept('diarch','diarchou')|El] měří na misky vah moci.\n\nKdyž se miskami vah přiklánějí k $game_concept_diarch$, odemykají mu [Concept('diarch_powers','propůjčeným pravomocím')|El] a mohou přidávat náklady k [Concept('diarch_affected_actions','běžným úkonům')|El] lenního pána.\n\nKdyž se přiklánějí k lennímu pánovi, naopak mu usnadňují ukončení [Concept('diarchy','sdílení moci')|El].\n\nMisky vah lze vychýlit takto:\n$EFFECT_LIST_BULLET$Použitím [Concept('character_interaction','interakcí s postavou')|El] $swing_scales_currency_interaction$ proti druhé straně\n$EFFECT_LIST_BULLET$Jako $game_concept_diarch$ dobrým (jakkoli vypočítavým) sloužením svému lennímu pánovi v událostech [Concept('mandate','mandátě')|El]" # todo: CONCEPT CASE
 game_concept_entrenched_regency: "Zakotvené regentství"
 game_concept_entrenched_regency_entrenched: "Zakotvené"
 game_concept_entrenched_regency_regency: "Regentství"
 game_concept_entrenched_regent: "Zakotvený regent"
 game_concept_entrenched_regents: "Zakotvení regenti"
 game_concept_entrenched_regency_entrench: "Zakotvit"
 game_concept_entrenched_regencies: "Zakotvená regentství"
 game_concept_entrenched_regency_desc: "Pokud [Concept('regency','regentství')|El] trvá příliš dlouho, může se zakotvit a [Concept('regent','regent')|El] se stane ještě mocnějším ve srovnání se svým [Concept('liege','lenním pánem')|El].\n\nVýhody, které [Concept('regent','regent')|El] získává z [Concept('scales_of_power','misek vah moci')|El], budou mnohem silnější.\n\nAby bylo možné $game_concept_entrenched_regency$ ukončit, musí regent přijmout dar od svého lenního pána, nebo musí lenní pán přiklonit misky vah ve svůj prospěch."
 game_concept_diarch_affected_actions: "Běžné úkony"
 game_concept_diarch_affected_actions_desc: "Když [Concept('scales_of_power','misky vah moci')|El] během [Concept('power_sharing','sdílení moci')|El] přejí [Concept('diarch','diarchovi')|El], některé [Concept('interactions','interakcí')|El], které [Concept('liege','lenního pána')|El] provádí, mohou začít stát [Concept('prestige','prestiž')|El].\n\nOvlivněné úkony jsou:\n$EFFECT_LIST_BULLET$ [Concept('revoking','odebrání')|El] [Concept('title','Titul')|El]\n$EFFECT_LIST_BULLET$ [Concept('retracting','odnětí')|El] [Concept('vassal','Vazal')|El]\n$EFFECT_LIST_BULLET$ [Concept('imprisoning','Uvěznění')|El] [Concept('characters','Postavy')|El]\n$EFFECT_LIST_BULLET$ [Concept('executing','poprava')|El] Postavy #weak (pokud $game_concept_liege$ nemá [Concept('faith','víru')|El], která praktikuje nějakou formu lidských obětí)#!" # todo: CONCEPT CASE
 game_concept_grand_activity: "Velkolepá aktivita"
 game_concept_grand_activities: "Velkolepé aktivity"
 game_concept_grand_activity_desc: "Okázalé projevy bohatství a vznešenosti, $game_concept_grand_activities$, jsou ze své podstaty větší a #EMP velkolepější#! než běžné [Concept('activities','aktivity')|El]. Mohou mít více [Concept('activity_phases','fází aktivity')|El] a při plánování nabízejí více možností přizpůsobení.\n\nCesty poskytují příležitost navštívit několik [Concept('vassals','vazalů')|El] ve tvém [Concept('realm','panství')|El], zatímco turnaje nabízejí různé [Concept('contests','soutěže')|El], které lze pořádat."
 game_concept_special_guest: "Zvláštní host"
 game_concept_special_guests: "Zvláštní hosté"
 game_concept_honorary_guest: "Čestný host"
 game_concept_honorary_guest_desc: "$honorary_guest_desc$"
 game_concept_special_guest_desc: "Zvláštní hosté zaujímají na [Concept('grand_activities','velkolepé aktivity')|El] zvláštní čestné místo. Ucti někoho na své aktivitě [GetActivityType( 'activity_feast' ).GetName] nebo vyber $special_guest_champion$, aby tě zastupoval na tvé aktivitě [GetActivityType( 'activity_tournament' ).GetName]!\n\nS větší pravděpodobností přijmou tvé pozvání a žádná aktivita, na kterou jsou pozváni, nezačne, dokud nedorazí." # todo: CONCEPT CASE
 game_concept_contest: "Soutěž"
 game_concept_contests: "Soutěže"
 game_concept_contest_desc: "[GetActivityType( 'activity_tournament' ).GetName] se skládá z řady $game_concept_contests$, které vybírá [Concept('activity_host','hostitel aktivity')|El] a v nichž mohou [Concept('contest_qualifying','kvalifikovaní')|El] [Concept('contestants','soutěžící')|El] soupeřit o [Concept('prizes','ceny')|El] a další odměny.\n\nKaždá $game_concept_contest$ používá jeden ze čtyř různých způsobů určení vítěze: [Concept('contest_category_versus','vyřazování')|El], [Concept('contest_category_turn','kola')|El], [Concept('contest_category_team','týmy')|El] a [Concept('contest_category_race','závod')|El].\n\nTvá šance na vítězství v soutěži je určena tvými [Concept('skills','dovednostmi')|El], [Concept('traits','rysy')|El], přípravou a dalšími faktory. Způsobilost ke vstupu do fyzických soutěží je určena zdravím a pohlavím na základě [Concept('culture','kultuře')|El] a [Concept('faith','víry')|El] [Concept('activity_host','hostitele aktivity')|El]." # todo: CONCEPT CASE
 game_concept_prize: "Cena"
 game_concept_prizes: "Ceny"
 game_concept_prize_desc: "Ceny jsou [Concept('artifacts','artefakty')|El] udělované vítězům [Concept('contests','soutěžím')|El] aktivity [GetActivityType( 'activity_tournament' ).GetName] s jediným vítězem.\n\nKvalita $game_concept_prize$ závisí na možnostech zvolených [Concept('activity_host','hostitelem aktivity')|El] a na [Concept('era','éru')|El]." # todo: CONCEPT CASE
 game_concept_contest_category_team: "Týmy"
 game_concept_contest_category_team_desc: "V [Concept('contests','soutěžích')|El] kategorie $game_concept_contest_category_team$ obdrží odměny všichni [Concept('contest_qualifying','kvalifikovaní')|El] [Concept('contestants','soutěžící')|El] v týmu s nejvyšším součtem bodů na konci soutěže.\n\nSoutěže kategorie $game_concept_contest_category_team$:\n$EFFECT_LIST_BULLET$Meleé"
 game_concept_contest_category_versus: "Vyřazování"
 game_concept_contest_category_versus_desc: "Vítězem [Concept('contest','soutěží')|El] kategorie $game_concept_contest_category_versus$ je ten, kdo zůstane jako poslední po třech [Concept('contest_rounds','kolech soutěže')|El] mezi [Concept('contest_qualifying','kvalifikované')|El] [Concept('contestants','soutěžícími')|El].\n\nSoutěže kategorie $game_concept_contest_category_versus$:\n$EFFECT_LIST_BULLET$Zápas\n$EFFECT_LIST_BULLET$Duel\n$EFFECT_LIST_BULLET$Klání\n$EFFECT_LIST_BULLET$Deskové hry" # todo: CONCEPT CASE
 game_concept_contest_category_turn: "Kola"
 game_concept_contest_category_turn_desc: "Vítězem [Concept('contests','soutěžemi')|El] kategorie $game_concept_contest_category_turn$ je [Concept('contest_qualifying','kvalifikovaný')|El] [Concept('contestant','soutěžící')|El] s nejvyšším počtem bodů na konci soutěže.\n\nSoutěže kategorie $game_concept_contest_category_turn:\n$EFFECT_LIST_BULLET$Lukostřelba\n$EFFECT_LIST_BULLET$Přednes" # todo: CONCEPT CASE
 game_concept_contest_category_race: "Závod"
 game_concept_contest_category_race_desc: "Vítězem [Concept('contests','soutěžemi')|El] kategorie $game_concept_contest_category_race je [Concept('contest_qualifying','kvalifikovaný')|El] [Concept('contestant','soutěžící')|El], jehož přihlášený kůň se na konci závodu umístil jako první.\n\nSoutěže kategorie $game_concept_contest_category_race:\n$EFFECT_LIST_BULLET$Koňský závod" # todo: CONCEPT CASE
 game_concept_contest_round: "Kolo soutěže"
 game_concept_contest_rounds: "Kola soutěže"
 game_concept_contest_round_desc: "[Concept('contests','Soutěže')|E] kategorie [Concept('contest_category_versus','vyřazování')|El] určují vítěze párováním všech [Concept('contest_qualifying','kvalifikovaného')|El] [Concept('contestants','soutěžících')|El] proti sobě ve vyřazovacích střetech, dokud nezůstane jen jeden.\n\nExistují tři kola: čtvrtfinále, semifinále a finále." # todo: CONCEPT CASE
 game_concept_contest_qualification: "Kvalifikace"
 game_concept_contest_qualify: "Kvalifikovat se"
 game_concept_contest_qualifier: "Kvalifikant"
 game_concept_contest_qualifiers: "Kvalifikanti"
 game_concept_contest_qualifying: "Kvalifikovaný"
 game_concept_contest_qualifies: "Kvalifikuje se"
 game_concept_contest_qualification_desc: "Ačkoli [GetActivityType( 'activity_tournament' ).GetName] přiláká mnoho způsobilých [Concept('contestants','soutěžících')|El], do každé [Concept('contest','soutěže')|El] se kvalifikuje jen malý počet z nich, kteří získají šanci na slávu a její [Concept('prize','cenu')|El].\n\nAby byla kvalifikace zaručena, tvůj [Concept('progress_to_victory','postup k vítězství')|El] musí být při začátku soutěže nad požadovanou hranicí."
 game_concept_contestant: "Soutěžící"
 game_concept_contestants: "Soutěžící"
 game_concept_contestant_desc: "Aby ses mohl účastnit [Concept('contests','soutěží')|El] aktivity [GetActivityType( 'activity_tournament' ).GetName], musíš splňovat její požadavky. Deskové hry dovolují účast všem postavám, zatímco jiné soutěže, například zápas, závisí na válečnických pravidlech.\n\nPostavy, které nesoutěží, budou [Concept('spectators','diváky')|El] a potenciální [Concept('contestants','soutěžící')|El] se mohou rozhodnout neúčastnit, pokud chtějí přihlížet.\n\nZpůsobilost ke vstupu do soutěží je určena pohlavím a zdravím na základě [Concept('culture','kultuře')|El] a [Concept('religion','náboženství')|El] hostitele." # todo: CONCEPT CASE
 game_concept_spectator: "Divák"
 game_concept_spectators: "Diváci"
 game_concept_spectating: "Přihlížení"
 game_concept_spectate: "Přihlížet"
 game_concept_spectator_desc: "Každá postava, které není dovoleno účastnit se [Concept('contest','soutěží')|El], bude místo toho [Concept('spectate','přihlížet')|El].\n\nPotenciální [Concept('contestants','soutěžící')|El] se také mohou rozhodnout raději přihlížet než soutěžit." # todo: CONCEPT CASE
 game_concept_progress_to_victory: "Postup k vítězství"
 game_concept_progress_to_victory_desc: "Abstrakce tvé pravděpodobnosti vítězství v dané [Concept('contest','soutěži')|El] oproti ostatním soutěžícím, založená na tvých [Concept('skills','dovednosti')|El], [Concept('health','zdraví')|El] a [Concept('traits','rysech')|El]. Například postava s rysem [GetTrait('giant').GetName( GetNullCharacter )] a vysokou [Concept('prowess','udatnost')|El] má výhodu ve fyzických soutěžích vedených pěšky, například v zápase.\n\nMinimální postup k vítězství je vyžadován k zaručení [Concept('contest_qualification','kvalifikaci')|El] do [Concept('contest','soutěže')|El]. Navštěvuj [Concept('locales','stanoviště')|El], kde se ti naskytnou příležitosti zlepšit své šance a sabotovat soupeře.\n\nTurnajová #V výsledková tabule#! zobrazuje aktuální $game_concept_progress_to_victory$ všech soutěžících." # todo: CONCEPT CASE
 game_concept_progress_to_victory_locale_tt: "Navštěvuj [Concept('locales','místa')|El], kde se ti naskytnou příležitosti zlepšit své šance nebo sabotovat soupeře."
 game_concept_contest_aptitude: "Způsobilost v soutěži"
 game_concept_contest_aptitude_desc: "Různé [Concept('contests','soutěže')|El] vyžadují různé vlohy: pěší boj, jízdu na koni, luk, důvtip nebo jejich kombinaci.\n\nTvá způsobilost se odvozuje od tvých [Concept('skills','dovedností')|El], [Concept('health','zdraví')|El], [Concept('traits','rysů')|El] a [Concept('trait_level_track_xp','zkušeností rysu')|El] [GetTrait('tourney_participant').GetName( GetNullCharacter )].\n\nNapříklad postava s rysem [GetTrait('giant').GetName( GetNullCharacter )] a vysokou [Concept('prowess','udatnost')|El] má přirozenou výhodu v soutěži v zápase." # todo: CONCEPT CASE
 game_concept_locale: "Stanoviště"
 game_concept_locales: "Stanoviště"
 game_concept_locale_desc: "Můžeš si zvolit, jak budeš prozkoumávat [GetActivityType( 'activity_tournament').GetName], zatímco se [Concept('contests','soutěžemi')|El] připravují.\n\nKaždé místo nabízí příležitosti setkávat se s hosty, zlepšit [Concept('progress_to_victory','postup k vítězství')|El] nebo sabotovat [Concept('contestants','soutěžící')|El].\n\nPokud si místo nevybereš, po krátké době navštívíš některé náhodně." # todo: CONCEPT CASE
 game_concept_travel: "Cestování"
 game_concept_travels: "Cesty"
 game_concept_traveling: "Cestování"
 game_concept_traveled: "Cestováno"
 game_concept_travel_desc: "Cestování je způsob, jakým se [Concept('character','postavou')|El] dostává z jednoho [Concept('location','místa')|El] na druhé, především kvůli účasti na [Concept('activities','aktivity')|El].\n\nExistuje mnoho způsobů, jak cestu naplánovat, například volbou [GetCourtPositionType('travel_leader_court_position').GetName()] k najmutí, výběrem [Concept('travel_options','možnostmi cesty')|El] a úpravou trasy. Na cestě potkáš mnoho zajímavých postav, ale dávej si pozor na [Concept('travel_danger','nebezpečí cesty')|El], která mohou číhat." # todo: CONCEPT CASE
 game_concept_travel_option: "Možnost cesty"
 game_concept_travel_options: "Možnosti cesty"
 game_concept_travel_option_desc: "Možnost, kterou zvolíš při plánování své [Concept('travel','cesty')|El], aby vylepšila nebo upravila cestu, na niž se chystáš vyrazit."
 game_concept_travel_danger: "Nebezpečí"
 game_concept_travel_danger_i: "@travel_danger_icon!"
 game_concept_travel_danger_desc: "Na svých [Concept('travels','cesty')|El] můžeš procházet nebezpečnými kraji, například pouštěmi nebo bažinami, které mohou tvou cestu ztížit.\n\nRizika nebezpečí můžeš zmírnit zlepšením své [Concept('travel_safety','bezpečnosti cesty')|El]. Toho dosáhneš investicemi do [Concept('travel_options','možností cesty')|El] nebo najmutím [GetCourtPositionType('travel_leader_court_position').GetName()].\n\nNěkteré [Concept('culture_traditions','kulturní tradice')|El] snižují nebo odstraňují rizika určitých typů nebezpečí." # todo: CONCEPT CASE
 game_concept_travel_safety: "Bezpečnost"
 game_concept_travel_safety_desc: "Vysoká hodnota bezpečnosti ti pomůže vyhnout se [Concept('travel_danger','nebezpečí cesty')|El] během tvých [Concept('travels','cest')|El]. Tvá bezpečnost je ovlivněna tvými [Concept('skills','dovednostmi')|El] i dovednostmi tvého [GetCourtPositionType('travel_leader_court_position').GetName()].\n\n$min_travel_contribution$"
 game_concept_travel_speed: "Rychlost"
 game_concept_travel_speed_desc: "Vysoká rychlost při [Concept('traveling','cestování')|El] ti umožní dorazit do cíle rychleji. Tvá rychlost je ovlivněna tvými [Concept('skills','dovednostmi')|El] i dovednostmi tvého [GetCourtPositionType('travel_leader_court_position').GetName()].\n\n$min_travel_contribution$"
 game_concept_entourage: "Doprovod"
 game_concept_entourage_desc: "Jít sám je nebezpečné, proto by sis měl ve svém doprovodu vzít několik společníků. Každý, kdo [Concept('travels','cestuje')|El] s tebou, je součástí tvého doprovodu a sdílí výzvy, kterým můžeš na cestě čelit.\n\nTvůj [GetCourtPositionType('travel_leader_court_position').GetName()] je vůdcem doprovodu a spravuje tvé cestovní plány.\n\nNěkteré [Concept('characters','postavy')|El] jsou do tvého doprovodu přidány standardně při plánování cesty. [Concept('travel_options','Možnosti cesty')|E] a [Concept('activity_options','možnosti aktivity')|El] nabízejí další způsoby, jak postavy přidat."
 min_travel_contribution: "Příspěvek [Concept('character_possessive','postavy')|El] nemůže být nikdy nižší než #HIGH 0#!."
 game_concept_point_of_interest: "Zajímavé místo"
 game_concept_points_of_interest: "Zajímavá místa"
 game_concept_point_of_interest_desc: "Zajímavé místo je místo ve světě, které stojí za návštěvu. Když toto místo navštívíš poprvé, získáš s ním spojené výhody." # todo: CONCEPT CASE
 game_concept_vassal_stance: "Vazalský postoj"
 game_concept_vassal_stances: "Vazalské postoje"
 game_concept_preferred_heir: "Upřednostňovaný dědic"
 game_concept_unpreferred_heir: "Neupřednostňovaný dědic"
 game_concept_preferred_heirs: "Upřednostňovaní dědicové"
 game_concept_unpreferred_heirs: "Neupřednostňovaní dědicové"
 game_concept_vassal_stance_desc: "Každý [Concept('vassal','vazal')|El] má vazalský postoj, který ovlivňuje [Concept('opinion','mínění')|El], jež k tobě jako ke svému [Concept('liege','lennímu pánovi')|El] chová, a také to, kterého [Concept('heir','dědice')|El] upřednostňuje jako nástupce [Concept('realm','panství')|El].\n\nVazalové se stejným postojem mají rádi a nemají rádi stejné věci. Například všichni vazalové postoje [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] nemají rádi, když prohráváš [Concept('wars','války')|El].\n\nKaždý vazalský postoj upřednostňuje jednoho konkrétního dědice. Po nástupnictví bude mít každý upřednostňovaný dědic u vazalů daného postoje nižší [Concept('legitimacy_expectations','očekávání legitimity')|El].\n\n#low Vazalské postoje jsou:#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_personality_i: "@personality_icon!"
 game_concept_warlike_i: "@warlike_icon!"
 game_concept_unpredictable_i: "@unpredictable_icon!"
 game_concept_cautious_i: "@cautious_icon!"
 game_concept_builder_i: "@builder_icon!"
 game_concept_conqueror_i: "@conqueror_icon!"
 game_concept_pious_builder_i: "@pious_builder_icon!"
 game_concept_ai_pious_builder_personality: "Zbožný stavitel"
 game_concept_ai_pious_builder_personality_desc: "Zbožný stavitel chce veškeré své [Concept('gold','zlato')|El] investovat do zvyšování své [Concept('piety','zbožnosti')|El].\n\nSvou pokladnici bude utrácet za financování náboženských a obřadních [Concept('buildings','budov')|El], [Concept('great_projects','velkých projektů')|El], [Concept('activities','aktivit')|El] a [Concept('decisions','rozhodnutí')|El] a často bude stavět více [Concept('pious_buildings','zbožných budov')|El] a [Concept('holdings','držav')|El] typu [Concept('temple','chrámu')|El] nebo [Concept('temple_citadel','chrámová citadela')|El]. Zlato si šetří pouze tehdy, když je přímo ohrožen, například silnou [Concept('faction','frakci')|El].\n\n$game_concept_ai_pious_builder_personality$s častěji vytvářejí a podporují svaté [Concept('legends','legendy')|El].\n\nHorliví [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )][Concept('rulers','vládci')|El] se sklonem ke [Concept('virtue','ctnosti')|El] a bez zvláštní náklonnosti k [Concept('war','válce')|El] bývají $game_concept_ai_pious_builder_personality$s.\nMezi běžné rysy patří [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )] a [GetTrait('generous').GetName( GetNullCharacter )]. Vládci se zaměřením [GetFocus('learning_theology_focus').GetName] také bývají $game_concept_ai_pious_builder_personality$s." # todo: CONCEPT CASE
 game_concept_ai_pious_builder_personality_desc_or_mandala: "nebo [Concept('mandala','mandaloví')|El] "
 game_concept_ai_warlike_personality: "Bojovný"
 game_concept_ai_warlike_personality_desc: "Bojovný [Concept('ruler','Vládce')|El] chce být neustále připraven vyhlásit [Concept('war','válku')|El]. Před investicemi do rozvoje svého [Concept('realm','panství')|El] si bude šetřit [Concept('gold','zlato')|El] na [Concept('war','válku')|El]. Pokud je $game_concept_ai_warlike_personality$ vládce delší dobu v míru, použije zlato ze své válečné pokladnice ke stavbě [Concept('buildings','budovám')|El].\n\nBojovní vládci častěji vytvářejí a podporují hrdinské [Concept('legends','legendy')|El].\n\nOdvážní a chamtiví vládci bývají bojovní.\nMezi běžné rysy patří [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )] a [GetTrait('zealous').GetName( GetNullCharacter )]." # todo: CONCEPT CASE
 game_concept_ai_cautious_personality: "Opatrný"
 game_concept_ai_cautious_personality_desc: "Opatrný [Concept('ruler','Vládce')|El] chce být připraven na to, že mu bude vyhlášena [Concept('war','válka')|El]. Je poněkud zdrženlivý při vyhlašování útočných [Concept('wars','válek')|El] a místo toho dává přednost pomalému budování sil. Udržuje si zásobu [Concept('gold','zlato')|El] na obranu a investuje do [Concept('buildings','budov')|El] a [Concept('men_at_arms','ozbrojenců')|El], aby se cítil bezpečně.\n\nOpatrní vládci méně často vytvářejí a podporují [Concept('legends','legendy')|El].\n\nZdrženliví a opatrní vládci bývají $game_concept_ai_cautious_personality$.\nMezi běžné rysy patří [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )] a [GetTrait('content').GetName( GetNullCharacter )]. Nikdy nebudou mít rys [GetTrait('fickle').GetName( GetNullCharacter )]." # todo: CONCEPT CASE
 game_concept_ai_conqueror_personality: "Dobyvatel"
 game_concept_ai_conquerors_personality: "Dobyvatelé"
 game_concept_ai_conqueror_personality_desc: "Dobyvatel chce za každou cenu rozšířit své [Concept('realm','panství')|El] prostřednictvím [Concept('war','války')|El]. Veškeré své [Concept('gold','zlata')|El] bude investovat do [Concept('war_chest','válečné pokladnice')|El] nebo do nákupu [Concept('men_at_arms','ozbrojencům')|El].\n\nMá sklon vyhlašovat mnohem více [Concept('wars','válek')|El] než obvykle a jako [Concept('allies','spojenci')|El] je dosti nespolehlivý. Zříká se většiny lehkovážných radostí života, například pořádání či navštěvování [Concept('activities','aktivit')|El] a podporování [Concept('inspirations','inspirací')|El], aby šetřil [Concept('gold','zlato')|El] na rozdrcení svých nepřátel. Aktivity využije pouze k získání dostatečné [Concept('prestige','prestiži')|El] a [Concept('piety','zbožnosti')|El] pro vedení [Concept('war','válku')|El].\n\nKaždý [Concept('ruler','vládce')|El], který není [Concept('ai_cautious_personality','opatrný')|El], má možnost stát se dobyvatelem, ale za normálních okolností je na světě jen několik málo vládců s tímto archetypem." # todo: CONCEPT CASE
 game_concept_ai_economical_boom_personality: "Stavitel"
 game_concept_ai_economical_boom_personality_desc: "Stavitel chce veškeré své [Concept('gold','zlato')|El] investovat do [Concept('realm','panství')|El]. Vyprázdní svou pokladnici, aby financoval [Concept('buildings','budovy')|El] a [Concept('men_at_arms','ozbrojence')|El], a často staví více [Concept('economic_buildings','hospodářských budov')|El] a [Concept('holdings','držav')|El]. Zlato si šetří pouze tehdy, když je přímo ohrožen, například silnou [Concept('faction','frakci')|El].\n\nVládci typu stavitele o něco méně často vytvářejí a podporují [Concept('legends','legendy')|El].\n\nOdvážní vládci se sklonem ke stavitelství a bez zvláštní náklonnosti k [Concept('war','válce')|El] bývají typem stavitelem.\nMezi běžné rysy patří [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )] a [GetTrait('profligate').GetName( GetNullCharacter )]. Vládci se zaměřením [GetFocus('stewardship_domain_focus').GetName] také bývají typem stavitelem." # todo: CONCEPT CASE
 game_concept_ai_economical_unpredictable_personality: "Nepředvídatelný"
 game_concept_ai_economical_unpredictable_personality_desc: "Nepředvídatelný [Concept('ruler','Vládce')|El] nemá žádné [Concept('traits','rysy')|El], které by jej tlačily k určitému hospodářskému archetypu, a může se rozhodnout pro jakoukoli strategii.\n\nMůže se rozhodnout dočasně výrazně investovat do [Concept('buildings','budov')|El] podobně jako [Concept('ai_economical_boom_personality','stavitel')|El], nebo své [Concept('realm','panství')|El] budovat pomalu se zásobou [Concept('gold','zlatem')|El]. Do [Concept('war','války')|El] vstupuje běžným tempem." # todo: CONCEPT CASE
 game_concept_trait_level_track: "Cesta rysu"
 game_concept_trait_level_track_desc: "Některé [Concept('traits','rysy')|El] nabízejí několik cest, z nichž každá rys mění jiným způsobem.\n\nK postupu dále po cestě je třeba získávat [Concept('trait_level_track_xp','zkušenosti rysu')|El]."
 game_concept_trait_level_track_xp: "Zkušenosti rysu"
 game_concept_trait_level_track_xp_desc: "Zkušenosti jsou nutné k postupu dále po [Concept('trait_level_track','cestě rysu')|El] a ke změně bonusů, které [Concept('trait','rys')|El] poskytuje."
 game_concept_hunt_sighting: "Zpozorování zvěře"
 game_concept_hunt_sightings: "Zpozorování zvěře"
 game_concept_hunt_sighting_no_prefix: "Zpozorování"
 game_concept_hunt_sightings_no_prefix: "Zpozorování"
 game_concept_hunt_sighting_desc: "Zpozorování zvěře je zpráva o konkrétních prestižních zvířatech spatřených v [Concept('county','hrabství')|El], která lze pronásledovat při aktivitě [GetActivityType('activity_hunt').GetName] pořádané na daném místě.\n\n[GetCourtPositionType('master_of_hunt_court_position').GetName()] jako [Concept('court_position','dvorský úřad')|El] bude vyhledávat $game_concept_hunt_sightings_no_prefix$." # todo: CONCEPT CASE
 game_concept_stationed_regiment: "Umístěný pluk"
 game_concept_stationed_regiment_desc: "[Concept('regiment','Pluk')|E] [Concept('men_at_arms','Ozbrojenci')|El] získává bonusy ke své účinnosti tím, že je umístěn v [Concept('holding','državě')|El].\n\n[Concept('buildings','Budovy')|E] mohou tyto bonusy dále zvyšovat — někdy pro libovolný typ ozbrojenců, nejčastěji však pro jeden nebo dva. Například [GetBuilding('stables_01').GetName] poskytuje bonus umístěné [Concept('light_cavalry','lehké jízdě')|El] a [Concept('heavy_cavalry','těžké jízdě')|El].\n\nPluk můžeš umístit kdykoli kromě doby [Concept('war','války')|El] nebo pokud je država [Concept('occupied','obsazena')|El]. Pokud je država ztracena, všichni umístění ozbrojenci budou odvoláni z umístění." # todo: CONCEPT CASE
 game_concept_stationed: "Umístěno"
 game_concept_station: "Umístit"
 game_concept_station_regiment: "Umístit pluk"
 game_concept_stationed_holding: "Država umístění"
 game_concept_tour: "Turné"
 game_concept_tour_desc: "[Concept('grand_activity','Velkolepá aktivita')|E], při níž [Concept('liege','lenní pán')|El] vykoná královskou návštěvu u několika svých [Concept('vassals','vazalů')|El], aby získal odměny jako [Concept('gold','zlato')|El], [Concept('dread','hrůzu')|El], [Concept('opinion','mínění')|El], [Concept('control','kontrolu')|El] a [Concept('cultural_acceptance','kulturní přijetí')|El]."
 game_concept_tours: "Turné"
 game_concept_royal_tour: "Královské turné"
 game_concept_royal_tours: "Královská turné"
 game_concept_grand_tour: "Velké turné"
 game_concept_grand_tours: "Velká turné"
 game_concept_culture_festival: "Kulturní slavnost"
 game_concept_cultural_festival_desc: "[Concept('activity_phase','Fáze aktivity')|E] během [Concept('royal_tour','královského turné')|El], při níž se od [Concept('vassal','vazala')|El] očekává, že pohostí svého [Concept('liege','lenního pána')|El], což často vede ke zvýšení [Concept('county_opinion','lidovému mínění')|El] a [Concept('cultural_acceptance','kulturního přijetí')|El]." # todo: CONCEPT CASE
 game_concept_cultural_festival: "Kulturní slavnost"
 game_concept_cultural_festivals: "Kulturní slavnosti"
 game_concept_culture_festivals: "Kulturní slavnosti"
 game_concept_hosted_dinner: "Pořádaná hostina"
 game_concept_hosted_dinner_desc: "[Concept('activity_phase','Fáze aktivity')|E] během [Concept('royal_tour','královského turné')|El], při níž se od [Concept('vassal','vazala')|El] očekává, že pohostí svého [Concept('liege','lenního pána')|El], což často vede ke vzájemnému vzniku [Concept('hooks','pákám')|El] a [Concept('relations','vztahů')|El]." # todo: CONCEPT CASE
 game_concept_hosted_dinners: "Pořádané hostiny"
 game_concept_host_a_dinner: "Uspořádat hostinu"
 game_concept_tour_the_grounds: "Obhlédnout državy"
 game_concept_tour_the_grounds_desc: "[Concept('activity_phase','Fáze aktivity')|E] během [Concept('royal_tour','královského turné')|El], při níž [Concept('liege','lenní pán')|El] navštíví [Concept('vassal','vazala')|El], což často vede ke zvýšení [Concept('control','kontrole')|El] v jeho [Concept('counties','hrabství')|El]." # todo: CONCEPT CASE
 game_concept_touring_the_grounds: "Obhlídka držav"
 game_concept_tour_of_the_grounds: "Obhlídka držav"
 game_concept_tour_grounds: "Obhlédnout državy"
 game_concept_tour_stop: "Zastávka turné"
 game_concept_tour_stop_desc: "[Concept('activity_phase','Fáze aktivity')|E] během [Concept('royal_tour','královského turné')|El], při níž může lenní pán buď navštívit [Concept('hosted_dinner','pořádanou hostinu')|El], [Concept('tour_the_grounds','obhlédnout državy')|El] svého [Concept('vassal','vazala')|El], nebo se těšit z [Concept('cultural_festival','kulturní slavnosti')|El]."
 game_concept_stop: "Zastávka"
 game_concept_stops: "Zastávky"
 game_concept_tour_stops: "Zastávky turné"
 game_concept_tour_success: "Úspěch turné"
 game_concept_tour_success_desc: "Hodnota, která určuje, jaké odměny získáš na konci svého [Concept('grand_tour','velkého turné')|El]. Body můžeš získávat i ztrácet výběrem určitých možností na začátku turné a činěním rozhodnutí, která odpovídají tvému [Concept('tour_type','typu turné')|El]."
 game_concept_tour_success_points: "Body úspěchu turné"
 game_concept_tour_success_point: "Bod úspěchu turné"
 game_concept_tour_type: "Typ turné"
 game_concept_tour_type_desc: "Možnost, která určuje, jaký druh [Concept('tour','turné')|El] podnikáš a jaké odměny získáš. Mezi typy turné patří [Concept('majesty_tour','turné majestátu')|El], [Concept('intimidation_tour','zastrašovací turné')|El] a [Concept('taxation_tour','daňové turné')|El]."
 game_concept_majesty_tour: "Turné majestátu"
 game_concept_majesty_tour_desc: "[Concept('tour_type','Typ turné')|E], při němž se snažíš naklonit si své [Concept('vassals','vazaly')|El] zvýšením jejich [Concept('opinion','mínění')|El]."
 game_concept_intimidation_tour: "Zastrašovací turné"
 game_concept_intimidation_tour_desc: "[Concept('tour_type','Typ turné')|E], při němž se snažíš zastrašit své [Concept('vassals','vazaly')|El], získávat [Concept('dread','hrůzu')|El] a nutit je opustit [Concept('factions','frakce')|El]."
 game_concept_taxation_tour: "Daňové turné"
 game_concept_taxation_tour_desc: "[Concept('tour_type','Typ turné')|E], při němž se snažíš ze svých [Concept('vassals','vazalů')|El] vytěžit bohatství a získat [Concept('gold','zlato')|El]."
 game_concept_accolade: "Vyznamenání"
 game_concept_accolade_possessive: "Vyznamenání"
 game_concept_accolades: "Vyznamenání"
 game_concept_acclaimed: "Uznávaný"
 game_concept_accolade_desc: "Vyznamenání jsou pocty udělované [Concept('knights','rytířům')|El] jejich [Concept('liege','lenním pánem')|El].\n\nRytíř, který drží vyznamenání, se stává [Concept('acclaimed_knight','uznávaným rytířem')|El].\n\nJak uznávaný rytíř získává [Concept('glory','slávu')|El], roste způsobilost jeho [Concept('accolade_squires','panošů vyznamenání')|El] (což zlepšuje [Concept('accolade_succession','nástupnictví vyznamenání')|El]) a může získávat [Concept('accolade_ranks','stupně vyznamenání')|El]. Ty umožňují odemknout více [Concept('accolade_types','atributů vyznamenání')|El], které poskytují silnější bonusy.\n\nKdyž uznávaný rytíř zemře, proběhne [Concept('accolade_succession','nástupnictví vyznamenání')|El] a rytíř je okamžitě nahrazen nástupcem, jehož dovednosti jsou upraveny způsobilostí [Concept('accolade_squires','panošů vyznamenání')|El].\n\n[Concept('innovations','Inovace')|E] a vyšší [Concept('title_tiers','úrovně titulů')|El] umožňují [Concept('rulers','vládcům')|El] mít současně více vyznamenání." # todo: CONCEPT CASE
 game_concept_acclaimed_knight: "Uznávaný rytíř"
 game_concept_acclaimed_knights: "Uznávaní rytíři"
 game_concept_acclaimed_knight_possessive: "Uznávaného rytíře"
 game_concept_acclaimed_knight_desc: "[Concept('knight','Rytíř')|E] držící [Concept('accolade','vyznamenání')|El].\n\nAby mohl být rytíř uznávaným rytířem, musí být [Concept('unlanded','bezzemkem')|El] nebo [Concept('baron','baronem')|El] a mít alespoň [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] [Concept('prowess','udatnosti')|El] nebo více. Uznávaný rytíř musí být způsobilý alespoň pro jeden [Concept('accolade_type','atribut vyznamenání')|El], který už nedrží jiný uznávaný rytíř jeho [Concept('liege','lenního pána')|El].\n\nUznávaní rytíři mají menší pravděpodobnost, že budou zabiti nebo zajati v bitvě. Svou [Concept('glory','slávu')|El] mohou zlepšovat především bojem ve [Concept('wars','válkách')|El] a účastí na [Concept('activities','aktivity')|El], jako je [GetActivityType( 'activity_tournament' ).GetName].\n\nUznávaní rytíři mohou občas získat [Concept('skills','dovednosti')|El] a [Concept('traits','rysy')|El] související s atributy jejich vyznamenání." # todo: CONCEPT CASE
 game_concept_accolade_type: "Atribut vyznamenání"
 game_concept_accolade_types: "Atributy vyznamenání"
 game_concept_accolade_type_desc: "[Concept('accolade','Vyznamenání')|E] má až #value 3#! atributy, které poskytují škálující se bonusy podle toho, jak jsou odemykány jejich vyšší úrovně. Každý atribut má #value 3#! úrovně. Když vyznamenání zvýší svůj [Concept('accolade_rank','stupeň vyznamenání')|El], jeho držitel může buď zvýšit úroveň existujícího atributu, nebo přidat k vyznamenání nový atribut. [Concept('acclaimed_knight','Uznávaný rytíř')|E] však musí splňovat požadavky každého nového atributu.\n\nKaždý [Concept('knight','rytíř')|El] je způsobilý pouze pro určité atributy, které mohou vycházet z [Concept('traits','rysů')|El], [Concept('skills','dovedností')|El] nebo odemčení získaných zkušeností během služby rytíře.\n\nKaždé vyznamenání musí mít jedinečné atributy: lenní pán #high nemůže#! duplikovat atributy mezi vyznamenáními. Každé vyznamenání se také může specializovat pouze na #value 1#! atribut typu [Concept('men_at_arms','ozbrojenců')|El]."
 game_concept_accolade_succession: "Nástupnictví vyznamenání"
 game_concept_accolade_succession_desc: "Nástupnictví vyznamenání nastává, když [Concept('acclaimed_knight','uznávaný rytíř')|El] [Concept('accolade_possessive','vyznamenání')|El] zemře nebo přestane být platný.\n\nBývalý uznávaný rytíř je okamžitě nahrazen. Jako nástupci jsou nejprve upřednostněni mladí [Concept('courtiers','dvořané')|El] a [Concept('knights','rytíři')|El] vycvičení díky způsobilosti [Concept('accolade_squires','panošů vyznamenání')|El]; poté ostatní rytíři, další dvořané, pocestní a nakonec nově vytvořené [Concept('characters','postavy')|El]. Na základě způsobilosti [Concept('accolade_squires','panošů vyznamenání')|El] daného vyznamenání získá nový rytíř zvýšenou [Concept('prowess_skill','udatnost')|El], [Concept('martial_skill','válečnickou dovednost')|El], [Concept('trait_level_track_xp','zkušenosti rysu')|El] [GetTrait('tourney_participant').GetName( GetNullCharacter )] a případně i další [Concept('skills','dovednosti')|El].\n\nPo nástupnictví vyznamenání může být ztraceno malé množství [Concept('glory','slávy')|El] a způsobilost panošů vyznamenání se obnoví tak, aby nyní odrážela dovednosti a zkušenosti nového uznávaného rytíře.\n\nPokud uznávaný rytíř zemře v bitvě, duelu nebo jiným čestným způsobem, ztráta slávy se zruší a panoši vyznamenání se zlepší." # todo: CONCEPT CASE
 game_concept_accolade_rank: "Stupeň vyznamenání"
 game_concept_accolade_ranks: "Stupně vyznamenání"
 game_concept_accolade_rank_short: "Stupeň"
 game_concept_accolade_rank_desc: "[Concept('accolade','Vyznamenání')|E] má #value 6#! postupných stupňů, které jeho držiteli umožňují odemykat a zlepšovat bonusy [Concept('accolade_type','atributů vyznamenání')|El], například [Concept('knight_army_modifiers','modifikátory rytířské armády')|El].\n\nZískávání [Concept('glory','slávy')|El] odemyká jednotlivé stupně, zatímco ztráta slávy může způsobit jejich ztrátu. Když vyznamenání ztratí stupeň, jedna úroveň jednoho [Concept('accolade_type','atributu vyznamenání')|El] bude deaktivována. Opětovné získání stupně způsobí obnovení atributu i jeho bonusu."
 game_concept_glory: "Sláva"
 game_concept_glory_desc: "[Concept('glory','Sláva')|E] [Concept('accolade_possessive','Vyznamenání')|El] zvyšuje jeho [Concept('accolade_rank','stupně vyznamenání')|El].\n\nSlávu získává [Concept('acclaimed_knight','uznávaný rytíř')|El] vítězstvím v [Concept('battles','bitvách')|El], porážením bojovníků, soutěžením v [Concept('contests','soutěžích')|El] aktivity [GetActivityType( 'activity_tournament' ).GetName] a účastí na [Concept('activities','aktivity')|El].\n\nSláva vyznamenání se však snižuje, když je uznávaný rytíř zapojen do prohraných bitev, a může také poklesnout při [Concept('accolade_succession','nástupnictví vyznamenání')|El], pokud uznávaný rytíř nezemřel v bitvě, duelu nebo jiným čestným způsobem." # todo: CONCEPT CASE
 game_concept_accolade_squires: "Panoši"
 game_concept_accolade_squire: "Panoš"
 game_concept_accolade_squires_desc: "Každé [Concept('accolade','vyznamenání')|El] má ukazatel způsobilosti panošů, který upravuje [Concept('traits','rysy')|El] a [Concept('skills','dovednosti')|El] jeho příštího [Concept('acclaimed_knight','uznávaného rytíře')|El] — především [Concept('prowess_skill','udatnost')|El], [Concept('martial_skill','válečnickou dovednost')|El] a [Concept('trait_level_track_xp','zkušenosti rysu')|El] [GetTrait('tourney_participant').GetName( GetNullCharacter )].\n\nZpůsobilost panošů má 5 úrovní:\n$EFFECT_LIST_BULLET$Zkušení\n$EFFECT_LIST_BULLET$Schopní\n$EFFECT_LIST_BULLET$Nezkušení\n$EFFECT_LIST_BULLET$Neschopní\n$EFFECT_LIST_BULLET$Ubozí\n\nZpůsobilost na úrovni Nezkušení nebo vyšší způsobí, že uznávaný rytíř bude občas ovlivňovat [Concept('traits','rysy')|El] a [Concept('skills','dovednosti')|El] mladých [Concept('courtiers','dvořanů')|El] pohlaví způsobilého k boji, čímž jim dá přednost při převzetí vyznamenání během [Concept('accolade_succession','nástupnictví vyznamenání')|El].\n\nPanoši se zlepšují především získáváním [Concept('glory','slávou')|El], ale také díky:\n$EFFECT_LIST_BULLET$[Concept('prowess_skill','Udatnost')|E] uznávaného rytíře\n$EFFECT_LIST_BULLET$[Concept('martial_skill','Válečnická dovednost')|E] uznávaného rytíře\n$EFFECT_LIST_BULLET$Získávání [Concept('trait_level_track_xp','zkušeností rysu')|El] [GetTrait('tourney_participant').GetName( GetNullCharacter )] uznávaným rytířem\n$EFFECT_LIST_BULLET$Získávání [Concept('trait_level_track_xp','zkušeností rysu')|El] [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )] uznávaným rytířem\n$EFFECT_LIST_BULLET$[Concept('martial_skill','Válečnická dovednost')|E] [Concept('liege','Lenní pán')|El] vyznamenání\n$EFFECT_LIST_BULLET$[Concept('prowess_skill','Udatnost')|E] [Concept('liege','Lenní pán')|El] vyznamenání\n\nKaždé [Concept('accolade_succession','nástupnictví vyznamenání')|El] panoše vyznamenání resetuje." # todo: CONCEPT CASE
 game_concept_tax_collector: "Výběrčí daní"
 game_concept_tax_collector_desc: "Výběrčí daní umožňuje fungování [Concept('tax_jurisdictions','daňových jurisdikcí')|El].\n\nJeho [Concept('aptitude','způsobilosti')|El] určuje množství [Concept('taxes','daní')|El] a [Concept('levies','odvedenců')|El], které vybírá pro svého [Concept('liege','lenního pána')|El]." # todo: CONCEPT CASE
 game_concept_tax_collectors: "Výběrčí daní"
 game_concept_tax_decree: "Daňové nařízení"
 game_concept_tax_decree_desc: "Každá [Concept('tax_jurisdiction','daňová jurisdikce')|El] může mít jiné $game_concept_tax_decree$, které upravuje [Concept('taxes','daně')|El] a [Concept('levies','odvedence')|El] odváděné jejími [Concept('taxpayers','poplatníky')|El].\n\nDaňová nařízení často mění [Concept('obligations','povinnosti')|El] výměnou za jiný postih nebo výhodu." # todo: CONCEPT CASE
 game_concept_tax_decrees: "Daňová nařízení"
 game_concept_tax_jurisdiction: "Daňová jurisdikce"
 game_concept_tax_jurisdictions: "Daňové jurisdikce"
 game_concept_tax_jurisdiction_desc: "Daňová jurisdikce je skupina [Concept('taxpayers','poplatníků')|El] tvořená [Concept('clan','klanovými')|El] [Concept('vassals','vazaly')|El]. Každá $game_concept_tax_jurisdiction$ podporuje až #V 12#! $game_concept_taxpayers$.\n\nKaždá $game_concept_tax_jurisdiction$ může mít [Concept('tax_decree','daňové nařízení')|El].\n\nPočet dostupných daňových jurisdikcí je určen [Concept('rank','hodností')|El], [Concept('traditions','tradicemi')|El] a [Concept('innovations','inovacemi')|El].\n\nDaňová jurisdikce vyžaduje jmenování [Concept('tax_collector','výběrčího daní')|El]." # todo: CONCEPT CASE
 game_concept_untaxed_jurisdiction: "Nezdaněná jurisdikce"
 game_concept_untaxed_jurisdictions: "Nezdaněné jurisdikce"
 game_concept_untaxed_jurisdiction_short: "Nezdaněná"
 game_concept_untaxed_jurisdiction_desc: "Nezdaněná jurisdikce je [Concept('tax_jurisdiction','daňová jurisdikce')|El] s [Concept('taxpayers','poplatníky')|El], ale bez [Concept('tax_collector','výběrčích daní')|El]. To znamená, že přiřazení $game_concept_taxpayers$ nebudou svému [Concept('liege','lennímu pánovi')|El] odvádět žádné [Concept('taxes','daně')|El] ani [Concept('levies','odvedence')|El]." # todo: CONCEPT CASE
 game_concept_taxpayer: "Poplatník"
 game_concept_taxpayers: "Poplatníci"
 game_concept_taxpayer_desc: "Poplatníci jsou [Concept('clan','klanoví')|El] [Concept('vassals','vazalové')|El], kteří byli přiřazeni k [Concept('tax_jurisdiction','daňové jurisdikci')|El] a budou odvádět měsíční [Concept('tax','daňový')|El] příjem a [Concept('levies','odvedence')|El], dokud bude jmenován [Concept('tax_collector','výběrčí daní')|El]." # todo: CONCEPT CASE
 game_concept_taxpayer_i: "@tax_collector_icon!"
 game_concept_unassigned_vassal: "Nezdanění vazalové"
 game_concept_unassigned_vassals: "Nezdanění vazalové"
 game_concept_unassigned_vassal_short: "Nezdanění"
 game_concept_unassigned_vassal_desc: "Nezdanění vazalové jsou [Concept('clan','klanoví')|El] [Concept('vassals','vazalové')|El], kteří nejsou přiřazeni k [Concept('tax_jurisdiction','daňové jurisdikci')|El] jako [Concept('taxpayers','poplatníci')|El], a proto neodvádějí [Concept('taxes','daně')|El] ani [Concept('levies','odvedence')|El].\n\nJakmile budou přiřazeni k daňové jurisdikci s [Concept('tax_collector','výběrčími daní')|El], začnou platit měsíčně." # todo: CONCEPT CASE
 game_concept_retinue_maa: "Družina ozbrojenců"
 game_concept_retinue_maa_desc: "Některé [Concept('accolade_types','atributy vyznamenání')|El] poskytují přístup ke zvláštním [Concept('men_at_arms','ozbrojencům')|El]. Odemykají se tím, že máš [Concept('acclaimed_knight','uznávaného rytíře')|El] s postupem v příslušné [Concept('trait_level_track','cestě rysu')|El] [GetTrait('tourney_participant').GetName( GetNullCharacter )] nebo s příslušným [Concept('commander_trait','rysem velitele')|El].\n\nDružina ozbrojenců je omezená na jeden [Concept('regiment','pluk')|El]. Při kontrování jiných ozbrojencích je dvakrát účinnější." # todo: CONCEPT CASE
 game_concept_knight_army_modifier: "Modifikátor rytířské armády"
 game_concept_knight_army_modifiers: "Modifikátory rytířské armády"
 game_concept_knight_army_modifier_desc: "Účinek použitý na jakoukoli [Concept('army','armádu')|El], která #high obsahuje#! příslušného [Concept('acclaimed_knight','uznávaného rytíře')|El].\n\n[Concept('knight','Rytíř')|E] #high nemusí#! být [Concept('commander','velitelem')|El] své armády, aby se jeho modifikátor rytířské armády uplatnil."
 game_concept_piety_level_impact: "Dopad úrovně oddanosti"
 game_concept_piety_level_impact_desc: "Dopad úrovně oddanosti zvyšuje nebo snižuje [Concept('modifiers','modifikátory')|El] získané z tvé aktuální [Concept('piety_level','úrovně oddanosti')|El]." # todo: CONCEPT CASE
 game_concept_prestige_level_impact: "Dopad úrovně slávy"
 game_concept_prestige_level_impact_desc: "Dopad úrovně slávy zvyšuje nebo snižuje [Concept('modifiers','modifikátory')|El] získané z tvé aktuální [Concept('prestige_level','úrovně slávy')|El]." # todo: CONCEPT CASE
 game_concept_hostage: "Rukojmí"
 game_concept_hostages: "Rukojmí"
 game_concept_hostages_possessive: "Rukojmí"
 game_concept_hostage_desc: "[Concept('close_family_member','Člen blízké rodiny')|E] [Concept('ruler','Vládce')|El], vyslaný pryč ze svého [Concept('home_court','domovského dvora')|El] jako záruka míru nebo podrobení.\n\nPověst $game_concept_rulers$, kteří vyhlásí [Concept('war','válku')|El] navzdory tomu, že vyslali nebo přijali $game_concept_hostage$, bude vážně poškozena a $game_concept_wardens$ mohou svobodně popravit $game_concept_hostages$ svých nepřátel.\n\nDobře zacházená $game_concept_hostages$ se pravděpodobně stanou loajálními vůči svému strážci, který na ně může získat [Concept('hook','páku')|El], nebo se s nimi dokonce stát [Concept('friends','přáteli')|El].\n\nRukojmí musí být bezzemské děti, sourozenci, neteře, synovci nebo vnoučata $game_concept_ruler$ jejich $game_concept_home_courts_possessive$.\n\nStrážci mají šanci získat [Concept('perpetual_hook','trvalou páku')|El] na dětské rukojmí, když dospěje, a to na základě osobnosti, mínění a let strávených u dvora strážců." # todo: CONCEPT CASE
 game_concept_home_court: "Domovský dvůr"
 game_concept_home_courts: "Domovské dvory"
 game_concept_home_courts_possessive: "Domovského dvora"
 game_concept_home_court_desc: "[Concept('ruler','Vládce')|E], který je [Concept('close_family_member','členem blízké rodiny')|El] [Concept('hostage','rukojmí')|El] a vyslal jej ke [Concept('warden','strážci')|El] jako záruku míru nebo podrobení."
 game_concept_warden: "Strážce"
 game_concept_wardens: "Strážci"
 game_concept_wardens_possessive: "Strážce"
 game_concept_warden_desc: "[Concept('ruler','Vládce')|E], kterému bylo cizím [Concept('home_court','domovským dvorem')|El] vysláno [Concept('hostage','rukojmí')|El] jako záruka míru nebo podrobení.\n\n[Concept('warden','Strážce')|E] bude v průběhu času získávat [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige','prestiž')|El] za každé [Concept('hostage','rukojmí')|El] u svého [Concept('court','dvora')|El]." # todo: CONCEPT CASE
 game_concept_goliardic_shenanigans: "Goliardské alotrie"
 game_concept_goliardic_shenanigans_desc: "Postava v aktivitě [GetActivityType('activity_adult_education').GetName] se může při přijetí studentského života pouštět do všemožných alotrií. Následky jejích dobrodružství jsou nepředvídatelné a zahrnují body [Concept('skill','dovedností')|El], rysy životního stylu a stresu, zkušenosti životního stylu, nemoci a zranění."
 game_concept_adoption: "Adopce"
 game_concept_adopt: "Adoptovat"
 game_concept_adopts: "Adoptuje"
 game_concept_adopting: "Adopce"
 game_concept_adopted: "Adoptován"
 game_concept_adoption_desc: "Adopce je akt přijetí jiné [Concept('character','postavy')|El] do tvého [Concept('house','rodu')|El] a [Concept('dynasty','dynastie')|El]."
 game_concept_legitimacy: "Legitimita"
 game_concept_legitimacy_desc: "Legitimita představuje právo [Concept('ruler','vládce')|El] panovat. [Concept('vassals','Vazalové')|E] také vytvářejí [Concept('legitimacy_expectations','očekávání legitimity')|El], která má jejich [Concept('liege','lenní pán')|El] naplnit.\n\nLegitimita mají pouze [Concept('rulers','vládci')|El]; vypočítává se v okamžiku, kdy se stanou vládci, a výsledkem je jejich [Concept('initial_legitimacy','počáteční legitimita')|El]. Část legitimity předchozího vládce také zdědí jeho [Concept('heir','dědice')|El].\n\nLegitimita ovlivňuje mnoho herních systémů: zvyšuje pravděpodobnost přijetí návrhů [Concept('marriage','sňatku')|El], [Concept('vassalization','vazalizace')|El] a [Concept('alliances','aliancí')|El], zlevňuje [Concept('claims','nároky')|El] a také vychyluje [Concept('scales_of_power','misky vah moci')|El] v [Concept('regency','regentství')|El].\n\nLegitimita má obvykle 5 [Concept('legitimacy_levels','úrovní legitimity')|El] a jednu spodní úroveň #weak nelegitimní#!.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]" # todo: CONCEPT CASE
 game_concept_legitimacy_i: "[GetLocalPlayerLegitimacyTextIcon]"
 game_concept_legitimacy_desc_nomadic: "\n\n[Concept('rulers','Vládci')|E] s vládou typu [GetGovernment( 'nomad_government' ).GetName] mají zvláštní typ $game_concept_legitimacy$, nezávislý na jejich [Concept('rank','hodnosti')|El]."
 game_concept_legitimacy_desc_mandala: "\n\n[Concept('rulers','Vládci')|E] s vládou typu [GetGovernment( 'mandala_government' ).GetName] mají zvláštní typ $game_concept_legitimacy$, nezávislý na jejich [Concept('rank','hodnosti')|El] a s dalšími úrovněmi."
 game_concept_legitimacy_level: "Úroveň legitimity"
 game_concept_legitimacy_level_desc: "Úrovně legitimity lze získat různými způsoby: vítězstvím ve [Concept('wars','válkách')|El], propouštěním [Concept('valuable_prisoners','cenných vězních')|El], vytvářením [Concept('legends','legend')|El], konáním [Concept('court','dvoře')|El] nebo účastí na [Concept('activities','aktivity')|El].\n\nLze je však také ztratit: [Concept('epidemics','mory')|El] pustošící [Concept('capital','hlavní sídlo')|El], prohrané války (zejména války [Concept('faction','frakcí')|El]), ztráta [Concept('titles','titulů')|El] nebo odhalená [Concept('hostile_scheme','nepřátelská intrika')|El] patří mezi hlavní způsoby, jak se legitimitou snižuje.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_level_desc_nomadic' )]" # todo: CONCEPT CASE
 game_concept_legitimacy_levels: "Úrovně legitimity"
 game_concept_legitimacy_gain: "Zisk legitimity"
 game_concept_legitimacy_level_desc_nomadic: "\n\nVládci s vládou typu [GetGovernment( 'nomad_government' ).GetName] získávají o #V 50 %#! více legitimity za vítězství ve válkách, ale při porážce jí také ztrácejí dvojnásobek. Legitimitu získávají také ze [Concept('single_combat_duel_plural','soubojů')|El] a ze sňatků s urozenými [Concept('courtiers','dvořany')|El] někoho se stejnou nebo vyšší [Concept('dominance','dominancí')|El]."
 game_concept_expected_legitimacy: "Očekávaná legitimita"
 game_concept_expected_legitimacy_desc: "[Concept('legitimacy_level','Úroveň legitimity')|E], kterou [Concept('vassals','vazaly')|El] očekávají od svého [Concept('ruler','vládce')|El] na základě svého historického vztahu. Některé faktory, které tato očekávání snižují, jsou:\n$BULLET_WITH_TAB$Být [Concept('de_jure','de iure')|El] [Concept('liege','lenním pánem')|El] vazala\n$BULLET_WITH_TAB$Být součástí [Concept('close_family','blízkou rodinou')|El] vazala\n$BULLET_WITH_TAB$Být [Concept('preferred_heir','upřednostňovaným dědicem')|El] vazala\n$BULLET_WITH_TAB$Být ze stejné [Concept('dynasty','dynastie')|El], které vazal slouží déle než #color_white 50#! let\n$BULLET_WITH_TAB$To, že vazal není [Concept('powerful_vassal','mocným vazalem')|El]\n\nPokud je skutečná úroveň nižší než jejich očekávání, mohou se stát neukázněnými: jejich [Concept('opinion','mínění')|El] bude nižší a mohou se přidávat k [Concept('factions','frakcím')|El] proti svému [Concept('liege','lennímu pánovi')|El].\n\nOčekávání rostou s úrovní jejich [Concept('primary_title','hlavního titulu')|El] i s [Concept('era','érou')|El]." # todo: CONCEPT CASE
 game_concept_legitimacy_expectations: "Očekávání legitimity"
 game_concept_legitimacy_expectations_desc: "$game_concept_expected_legitimacy_desc$"
 game_concept_initial_legitimacy: "Počáteční legitimita"
 game_concept_initial_legitimacy_desc: "Legitimita, kterou má [Concept('character','postava')|El] v okamžiku, kdy se stane zeměpánem.\n\nVypočítává se na základě [Concept('dynasty_prestige_level','úrovni věhlasu')|E], vztahu k předchůdci, [Concept('court_grandeur','velkoleposti dvora')|El], pohlaví, [Concept('bastardy','bastardství')|El], let strávených jako [Concept('ruler','vládce')|El], [Concept('dynasty_perk','dynastického odkazu')|El] [Concept('legitimacy','legitimity')|El], [Concept('diplomacy','diplomacie')|El], [Concept('virtues','ctností')|El], [Concept('sins','hříchů')|El] a dalších zvláštních [Concept('traits','rysů')|El], jako jsou [GetTrait('sayyid').GetName( GetNullCharacter )], [GetTrait('diplomat').GetName( GetNullCharacter )] a [GetTrait('just').GetName( GetNullCharacter )].\n\n[Concept('heirs','Dědici')|E] zdědí [GetDefine( 'NCharacter', 'LEGITIMACY_INHERITED' )|V%^] $game_concept_legitimacy$ předchozího vládce, pokud dědí [Concept('title','titul')|El] vyšší [Concept('title_tier','úrovně')|El]." # todo: CONCEPT CASE
 game_concept_court_position_task_short: "Úkol"
 game_concept_court_position_task_short_desc: "$game_concept_court_position_task_desc$"
 game_concept_court_position_tasks_short: "Úkoly"
 game_concept_court_position_tasks_short_desc: "$game_concept_court_position_task_desc$"
 game_concept_court_position_task: "Úkol dvorského úřadu"
 game_concept_court_position_tasks: "Úkoly dvorských úřadů"
 game_concept_court_position_tasks_desc: "$game_concept_court_position_task_desc$"
 game_concept_court_position_task_desc: "Některé [Concept('court_positions','dvorské úřady')|El] mohou plnit dodatečný úkol, který často poskytuje více výhod za dodatečnou cenu.\n\nU každého [Concept('court_position','dvorského úřadu')|El] může být najednou aktivní pouze jeden úkol."
 game_concept_fatalities: "Oběti"
 game_concept_fatalities_desc: "[Concept('characters','Postavy')|E], které zahynuly jako přímý následek [Concept('epidemic','epidemie')|El] nebo [Concept('natural_disaster','přírodní pohromy')|El]."
 game_concept_funeral: "Pohřeb"
 game_concept_funeral_desc: "[Concept('activity','Aktivita')|E], při níž [Concept('host','hostitel')|El] zve různé [Concept('characters','postavy')|El], aby po nedávné [Concept('character_death','smrti postavy')|El] vzdaly úctu. Pohřby často vedou ke zvýšení [Concept('legitimacy','legitimitě')|El], snížení [Concept('stress','stresu')|El] a příležitostem projevit [Concept('piety','zbožnost')|El]." # todo: CONCEPT CASE
 game_concept_funerals: "Pohřby"
 game_concept_scheme_group_calculating: "Promyšlené"
 game_concept_calculating_schemes: "Promyšlené intriky"
 game_concept_scheme_group_calculating_desc: "Promyšlené intriky zahrnují předem naplánované činy, obvykle s jedním závěrečným incidentem, při němž spiklenci udeří.\n\nNejlépe je maří ozbrojená $game_concept_scheme_countermeasure_countermeasures$, například #V $scheme_countermeasure_type_redouble_guards$#!.\n\nPříklady zahrnují:\n$EFFECT_LIST_BULLET$[GetScheme('abduct').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('murder').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('overthrow_regent').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('steal_back_artifact').GetTypeName]" # todo: CONCEPT CASE
 game_concept_scheme_group_opportunistic: "Příležitostné"
 game_concept_opportunistic_schemes: "Příležitostné intriky"
 game_concept_scheme_group_opportunistic_desc: "Příležitostné intriky zahrnují improvizované, opakované činy mezi [Concept('characters','postavami')|El], které se neformálně setkávají.\n\nNejlépe je překazí bdělá $game_concept_scheme_countermeasure_countermeasures$, například #V $scheme_countermeasure_type_strengthen_sentries$#!.\n\nPříklady zahrnují:\n$EFFECT_LIST_BULLET$[GetScheme('seduce').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('befriend').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('convert_to_witchcraft').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('courting').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('elope').GetTypeName]" # todo: CONCEPT CASE
 game_concept_scheme_group_indirect: "Nepřímé"
 game_concept_indirect_schemes: "Nepřímé intriky"
 game_concept_scheme_group_indirect_desc: "Nepřímé intriky obecně vůbec nepotřebují osobní kontakt se svým [Concept('scheme_target','cílem intriky')|El].\n\nKvůli tomu je nelze účinně kontrovat, ale některá $game_concept_scheme_countermeasure_countermeasures$ je mohou zhoršit.\n\nPříklady zahrnují:\n$EFFECT_LIST_BULLET$[GetScheme('claim_throne').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('fabricate_hook').GetTypeName]" # todo: CONCEPT CASE
 game_concept_scheme_opportunity: "Výhoda intriky"
 game_concept_scheme_opportunities: "Výhody intriky"
 game_concept_scheme_opportunity_opportunity: "Výhoda"
 game_concept_scheme_opportunity_opportunities: "Výhody"
 game_concept_scheme_opportunity_i: "@scheme_opportunity_icon!"
 game_concept_scheme_opportunity_desc: "Výhody představují postup směrem k cíli [Concept('scheme','intrice')|El]. Lze je utratit za přesvědčení [Concept('agents','spolčence')|El], aby se připojili k intrice, nebo za její provedení se zvýšenou [Concept('success_chance','šancemi na úspěch')|El]." # todo: CONCEPT CASE
 game_concept_favorite_child: "Oblíbené dítě"
 game_concept_favorite_child_desc: "Oblíbené dítě je přímý potomek ze stejné [Concept('dynasty','dynastie')|El], kterého se hráčský vládce může rozhodnout upřednostňovat. Bude o tobě mít vyšší [Concept('opinion','mínění')|El] a když zemřeš, můžeš si zvolit, že budeš pokračovat ve svém odkazu jako on místo svého dědice.\n\nTvým oblíbeným dítětem může být kterékoli dítě, vnouče nebo pravnouče, pokud patří k tvé dynastii." # todo: CONCEPT CASE
 game_concept_scheme_breach_short: "Narušení"
 game_concept_scheme_breaches_short: "Narušení"
 game_concept_scheme_breach: "Narušení intriky"
 game_concept_scheme_breaches: "Narušení intriky"
 game_concept_scheme_breach_desc: "Narušení představuje komplikaci v [Concept('secret_scheme','tajné intrice')|El]. Když je [Concept('scheme','intrika')|El] narušena, její [Concept('success_chance','šance na úspěch')|El] se sníží. Postih k šancím na úspěch se zvyšuje s každým dalším narušeními. Jakmile $game_concept_scheme$ dosáhne #V 5#! $game_concept_scheme_breaches_short$, automaticky selže.\n\n#WEAK Intriky také při svém konečném provedení ověřují své utajení — narušení na to nemají žádný vliv.#!" # todo: CONCEPT CASE
 game_concept_influence_ward_personality: "Ovlivnit osobnost svěřence"
 game_concept_influence_ward_personality_desc: "[Concept('interaction','Interakce')|E], při níž se lze pokusit ovlivnit [Concept('ward','svěřence')|El], aby přijal [Concept('personality_trait','osobnostní rys')|El] podobný vlastnímu."
 game_concept_faction_commitment: "Frakční odhodlání"
 game_concept_faction_commitment_desc: "Pravděpodobnost, že [Concept('character','postava')|El] podpoří [Concept('faction','frakci')|El] proti svému [Concept('liege','lennímu pánovi')|El].\n\nMůže ji ovlivnit mnoho důvodů, nejčastěji [Concept('personality','osobnost')|El], [Concept('opinion','mínění')|El] a [Concept('culture','kultura')|El]."
 game_concept_state_faith: "Státní víra"
 game_concept_state_faith_desc: "Státní víra je [Concept('faith','víra')|El] podporovaná a schvalovaná [Concept('administrative_government','administrativní vládou')|El]. Tato víra je vázána k [Concept('title','titulu')|El], nikoli k žádné konkrétní [Concept('character','postavě')|El]. Konvertovat postavy v [Concept('realm','panství')|El] ke státní víře je snazší a odvrátit je od ní je velmi obtížné.\n\nStátní víru může změnit pouze [Concept('ruler','vládce')|El] administrativního panství, ale [Concept('governors','guvernéři')|El] k ní mohou svobodně konvertovat." # todo: CONCEPT CASE
 game_concept_story_cycle: "Příběh"
 game_concept_story_cycles: "Příběhy"
 game_concept_story_cycle_desc: "Příběh je osobní situace spojená s [Concept('ruler','vládcem')|El].\n\nExistuje mnoho druhů příběhů — od vlastnictví [GetModifier('dog_story_modifier').GetNameWithTooltip] až po to stát se #V [GetTrait('conqueror').GetName( GetNullCharacter )]#!. Každý je vystavěn z různých prvků, obvykle zahrnujících klíčové [Concept('characters','postavy')|El], [Concept('titles','tituly')|El] nebo [Concept('decisions','rozhodnutí')|El]."
 game_concept_story_generic_prefix: "Příběh o"
 game_concept_story_generic_desc_boilerplate: "#WEAK Obsah příběhu je volitelný. Po zahájení hry se z něj můžeš kdykoli odhlásit."
 game_concept_story_content_hereward: "Příběh o $bookmark_laamps_hereweard_the_wake$" # todo: CONCEPT CASE
 game_concept_story_content_hereward_desc: "#tooltip_heading Styl příběhu: rozsáhlý#!\n\nJako Hereward poznáš, že tvé vyhnanství v cizině nebude mít dlouhého trvání. S Anglií pod cizím jhem se vrátíš domů, abys bojoval za svobodu, očistil své jméno a zabíjel Normany.\n\nPo dobu příběhu bude aktivní zvláštní mechanika sledující odpor Anglie proti normanské vládě a během ní se budou odehrávat skriptované příběhové události. Tvůj příběh vyvrcholí smrtí: tvou, nebo tvého nepřítele.\n\n#WEAK Obsah příběhu je volitelný. Po zahájení hry se z něj můžeš kdykoli odhlásit." # todo: CONCEPT CASE
 game_concept_story_content_el_cid: "Příběh o $bookmark_laamps_el_cid$" # todo: CONCEPT CASE
 game_concept_story_content_el_cid_desc: "#tooltip_heading Styl příběhu: lehký#!\n\nJako El Cid budeš svým lenním pánem neprávem odvržen. Ve vyhnanství se můžeš rozhodnout zůstat věrný, nebo si najít vlastní cestu, která nakonec vyvrcholí návratem ke dvoru #EMP nebo#! nejvyšší odměnou — Valencií.\n\n#WEAK Obsah příběhu je volitelný. Po zahájení hry se z něj můžeš kdykoli odhlásit." # todo: CONCEPT CASE
 game_concept_story_content_wallada: "Příběh o $bookmark_laamps_wallada_bint_al_mustakfi$" # todo: CONCEPT CASE
 game_concept_story_content_wallada_desc: "#tooltip_heading Styl příběhu: střední#!\n\nJako Wallada budeš rozvíjet na míru vytvořený rys [GetTrait('violet_poet').GetName( GetNullCharacter )] psaním poezie a zakládáním lyrických salonů po celém světě, přičemž budeš postupně vylepšovat jedinečný svazek.\n\nZávěr tvého příběhu bude tak dramatický, jak se rozhodneš jej učinit, ale přestože zůstaneš bezdětná, dostaneš způsoby, jak pokračovat ve hře.\n\n#WEAK Obsah příběhu je volitelný. Po zahájení hry se z něj můžeš kdykoli odhlásit." # todo: CONCEPT CASE
 game_concept_story_content_hasan: "Příběh o $bookmark_laamps_hassan_sabbah$" # todo: CONCEPT CASE
 game_concept_story_content_hasan_desc: "#tooltip_heading Styl příběhu: střední#!\n\nJako Hasan budeš veden cestou náboženského fanatismu, vybereš si místo, kam přinést světlo pravé víry, a budeš konvertovat [Concept('counties','hrabství')|El] přímo pod jejich [Concept('rulers','vládci')|El].\n\nTvůj příběh nakonec vyvrcholí velkým náboženským povstáním proti zvolenému nepříteli.\n\n#WEAK Obsah příběhu je volitelný. Po zahájení hry se z něj můžeš kdykoli odhlásit." # todo: CONCEPT CASE
 game_concept_harrying_widget_i: "@harrying_widget!"
 game_concept_harrying_widget: "@harrying_widget! Pustošení severu"
 game_concept_harrying_widget_desc: "Normanští vládci a nedávno sesazení anglosaští šlechtici svádějí zuřivý boj o vládu nad Anglií. Takový zápas neskončí, dokud nebude jedna nebo obě skupiny zcela zbaveny moci.\n\nJak se bude situace vyvíjet, činy, které podniknou oni i jiné postavy, budou určovat úroveň [Concept('harrying_resistance','odporu')|El] a [Concept('harrying_pacification','pacifikace')|El] v oblasti.\n\n#TS Vyšší #EMP odpor#! povede k:#!\n$EFFECT_LIST_BULLET$Nižšímu [Concept('cultural_acceptance','kulturnímu přijetí')|El]\n$EFFECT_LIST_BULLET$Nižší [Concept('county_control','kontrole hrabství')|El]\n$EFFECT_LIST_BULLET$Vyšší šanci na [Concept('claimant_factions','frakce pretendenta')|El] nebo dokonce [Concept('civil_war','občanskou válku')|El].\n\n#TS Vyšší #EMP pacifikace#! povede k:#!\n$EFFECT_LIST_BULLET$Vyššímu [Concept('cultural_acceptance','kulturnímu přijetí')|El]\n$EFFECT_LIST_BULLET$Rostoucí [Concept('dread','hrůze')|El] vládce Anglie\n$EFFECT_LIST_BULLET$Přístupu k [Concept('decision','rozhodnutí')|El] $embrace_english_culture_decision$." # todo: CONCEPT CASE
 game_concept_harrying_resistance: "Odpor"
 game_concept_harrying_resistance_desc: "Odpor měří trvající odpor vůči normanské vládě v Anglii ze strany původního anglosaského obyvatelstva. Za předpokladu, že odpor je #BOL vyšší#! než [Concept('harrying_pacification','pacifikace')|El], poskytuje na následujících úrovních tyto účinky:\n\n#S Odpor nad #V 7#!#!\n$EFFECT_LIST_BULLET$Anglosasko-normanské [Concept('cultural_acceptance','kulturní přijetí')|E]: [EmptyScope.ScriptValue('miniscule_cultural_acceptance_loss')|0V] měsíčně\n\n#S Odpor nad #V 10#!#!\n$EFFECT_LIST_BULLET$Anglosasko-normanské [Concept('cultural_acceptance','kulturní přijetí')|E]: [EmptyScope.ScriptValue('minor_cultural_acceptance_loss')|0V] měsíčně\n$EFFECT_LIST_BULLET$Mírně zvýšená šance na [Concept('claimant_factions','frakce pretendenta')|El] proti vládci Anglie\n\n#S Odpor nad #V 13#!#!\n$EFFECT_LIST_BULLET$Anglosasko-normanské [Concept('cultural_acceptance','kulturní přijetí')|E]: [EmptyScope.ScriptValue('medium_cultural_acceptance_loss')|0V] měsíčně\n$EFFECT_LIST_BULLET$Znatelně zvýšená šance na [Concept('claimant_factions','frakce pretendenta')|El] proti vládci Anglie\n$EFFECT_LIST_BULLET$[Concept('county_control','Kontrola hrabství')|E] ve všech [Concept('counties','hrabství')|El] každého [Concept('vassal','vazala')|El] Anglie se každé #V 3#! měsíce sníží o [EmptyScope.ScriptValue('minor_discontent_loss')|0V]\n\n#S Odpor nad #V 16#!#!\n$EFFECT_LIST_BULLET$Anglosasko-normanské [Concept('cultural_acceptance','kulturní přijetí')|E]: [EmptyScope.ScriptValue('major_cultural_acceptance_loss')|0V] měsíčně\n$EFFECT_LIST_BULLET$Výrazně zvýšená šance na [Concept('claimant_factions','frakce pretendenta')|El] proti vládci Anglie\n$EFFECT_LIST_BULLET$[Concept('county_control','Kontrola hrabství')|E] ve všech [Concept('counties','hrabství')|El] každého [Concept('vassal','vazala')|El] Anglie se každé #V 3#! měsíce sníží o [EmptyScope.ScriptValue('medium_discontent_loss')|0V]" # todo: CONCEPT CASE
 game_concept_harrying_pacification: "Pacifikace"
 game_concept_harrying_pacification_desc: "Pacifikace sleduje, jak účinně si noví normanští vládci Anglie podmaňují zahořklé anglosaské obyvatelstvo. Za předpokladu, že pacifikace je #BOL vyšší#! než [Concept('harrying_resistance','odpor')|El], poskytuje na následujících úrovních tyto účinky:\n\n#S Pacifikace nad #V 5#!#!\n$EFFECT_LIST_BULLET$Anglosasko-normanské [Concept('cultural_acceptance','kulturní přijetí')|E]: +[EmptyScope.ScriptValue('miniscule_cultural_acceptance_gain')|0V] měsíčně\n\n#S Pacifikace nad #V 8#!#!\n$EFFECT_LIST_BULLET$Anglosasko-normanské [Concept('cultural_acceptance','kulturní přijetí')|E]: +[EmptyScope.ScriptValue('minor_cultural_acceptance_gain')|0V] měsíčně\n$EFFECT_LIST_BULLET$Přidává vládci Anglie [dread_i]#V 1#! [Concept('dread','hrůzy')|El] měsíčně\n\n#S Pacifikace nad #V 11#!#!\n$EFFECT_LIST_BULLET$Anglosasko-normanské [Concept('cultural_acceptance','kulturní přijetí')|E]: +[EmptyScope.ScriptValue('medium_cultural_acceptance_gain')|0V] měsíčně\n$EFFECT_LIST_BULLET$Přidává vládci Anglie [dread_i]#V 2#! [Concept('dread','hrůzy')|El] měsíčně\n\n#S Pacifikace nad #V 14#!#!\n$EFFECT_LIST_BULLET$Anglosasko-normanské [Concept('cultural_acceptance','kulturní přijetí')|E]: +[EmptyScope.ScriptValue('major_cultural_acceptance_gain')|0V] měsíčně\n$EFFECT_LIST_BULLET$Přidává vládci Anglie [dread_i]#V 3#! [Concept('dread','hrůzy')|El] měsíčně\n$EFFECT_LIST_BULLET$Zpřístupňuje [Concept('decision','rozhodnutí')|El] #V $embrace_english_culture_decision$#!"
 game_concept_game_rule_extreme_i: "@warning_icon!"
 game_concept_game_rule_extreme: "Extrémní herní pravidlo"
 game_concept_game_rule_extreme_desc: "Toto herní pravidlo činí hru #bold výrazně#! obtížnější."
 game_concept_game_rule_unique_i: "@alert_icon!"
 game_concept_game_rule_unique: "Jedinečné herní pravidlo"
 game_concept_game_rule_unique_desc: "Toto herní pravidlo #bold výrazně#! mění herní zážitek."
 game_concept_swing_scales_of_power: "$swing_scales_currency_interaction$"
 game_concept_swing_scales_of_power_interaction: "$swing_scales_currency_interaction$" # todo: CONCEPT CASE
 game_concept_swing_scales_of_power_desc: "Za cenu [Concept('prestige','prestiž')|El], [Concept('piety','zbožnost')|El] nebo [Concept('gold','zlata')|El] může [Concept('liege','lenní pán')|El] nebo [Concept('diarch','diarcha')|El] vychýlit [Concept('scales_of_power','misky vah moci')|El] ve svůj prospěch." # todo: CONCEPT CASE
 game_concept_destination: "Cíl"
 game_concept_travel_destination: "Cíl cesty"
 game_concept_destination_desc: "Cíl je místo, ke kterému se směřuje během [Concept('traveling','cestování')|El], případně jeden z několika takových cílů. Při [Concept('pilgrimage','pouti')|El] by jím bylo [Concept('holy_site','svaté místo')|El], k němuž se putuje, zatímco při [Concept('tour','turné')|El] by se za cíl považoval každý jednotlivý [Concept('vassal','vazal')|El], který je navštěvován."
 game_concept_roaming_longer_length_travel: "Dlouhá túra"
 game_concept_roaming_longer_length_travel_desc: "Dlouhá túra je [Concept('activity_option','možnost aktivity')|El] pro [Concept('activity','aktivitu')|El] [GetActivityType('activity_roaming').GetName]. Postava stráví aktivitou výrazně delší dobu a dostane více příležitostí."
 game_concept_inspection_success_chance: "Pravděpodobnost úspěchu inspekce"
 game_concept_inspection_success_chance_no_prefix: "Pravděpodobnost úspěchu"
 game_concept_inspection_success_chance_desc: "Úspěch při provádění [Concept('inspection','inspekci')|El] není samozřejmý. Hlavní faktory ovlivňující tuto šanci jsou:\n$BULLET_WITH_TAB$@skill_learning_icon![Concept('skills','Dovednosti')|E]\n$BULLET_WITH_TAB$@control_icon![Concept('county_control','Kontrola hrabství')|E]\n$BULLET_WITH_TAB$@county_icon!Sousedící cizí [Concept('realm','panství')|El]\n\nPravděpodobnost úspěchu inspekce nikdy nemůže být vyšší než #bold 95#!." # todo: CONCEPT CASE
 game_concept_inspection: "Inspekce"
 game_concept_inspections: "Inspekce"
 game_concept_inspection_i: "@activity_inspection!"
 game_concept_inspection_desc: "Aktivita, při níž [Concept('liege','lenní pán')|El] cestuje do [Concept('county','hrabství')|El] ve svém [Concept('realm','panství')|El], aby dohlédl na místní magnáty a šlechtice.\n\nBude mít příležitosti v jedné z následujících oblastí zaměření: $rewards_inspection_tt$"
 game_concept_skill_challenges: "Výzvy dovedností"
 game_concept_skill_challenges_no_prefix: "Výzvy"
 game_concept_skill_challenges_desc: "Výzvy dovedností jsou okamžiky, kdy má postava šanci použít jednu ze svých [Concept('skills','dovedností')|El] k ovlivnění výsledku události. Čím vyšší dovednost nebo dovednosti, tím pravděpodobnější je, že postava prosadí svou vůli nebo dojde k příznivému výsledku."
 game_concept_hike: "Túra"
 game_concept_hike_i: "@activity_hike!"
 game_concept_hike_desc: "Vydej se na osamělou výpravu a odpočiň si od tlaku dvorského života.\n\nOčekávané odměny:\n$activity_roaming_host_desc$"
 game_concept_monument_expedition: "Výprava k památce"
 game_concept_monument_expedition_i: "@activity_monument_expedition!"
 game_concept_monument_expedition_desc: "Aktivita, při níž se postava rozhodne cestovat ke slavné památce nebo významnému místu, aby se zdokonalila poznáváním jeho dějin, vědění a tajemství.\n\nOčekávané odměny:\n\t$BULLET_WITH_TAB$[Concept('intrigue_i','@skill_intrigue_icon!')|E][Concept('diplomacy_i','@skill_diplomacy_icon!')|E][Concept('martial_i','@skill_martial_icon!')|E][Concept('learning_i','@skill_learning_icon!')|E][Concept('stewardship_i','@skill_stewardship_icon!')|E] Body [Concept('skill','dovedností')|El]\n$BULLET_WITH_TAB$[court_position_i][Concept('court_positions','Dvorské úřady')|E] s vynikající [Concept('aptitude','způsobilostí')|El]\n$BULLET_WITH_TAB$[Concept('prestige_i','@prestige_icon!')|E][Concept('prestige','Prestiž')|E]" # todo: CONCEPT CASE
 game_concept_designated_terrain: "Určený terén"
 game_concept_designated_terrain_desc: "[Concept('decision','Rozhodnutí')|E] odemčené ze stromu [Concept('wanderer_lifestyle','potulnému životnímu stylu')|El], při němž si můžeš zvolit skupinu [Concept('terrain','terén')|El], na kterou se specializuješ. Některé [Concept('perks','talenty')|El] poskytnou zvolené skupině terénů různé výhody.\n\nSkupiny terénů, z nichž lze vybírat:\n$BULLET_WITH_TAB$@forest! Lesy / @jungle! Džungle / @taiga! Tajga / @wetlands! Mokřady\n$BULLET_WITH_TAB$@mountains! Hory / @hills! Kopce / @desert_mountains! Pouštní hory\n$BULLET_WITH_TAB$@plains! Pláně / @steppe! Stepi / @farmlands! Zemědělská půda / @floodplains! Záplavové nížiny\n$BULLET_WITH_TAB$@desert! Pouště / @drylands! Suché oblasti / @oasis! Oázy" # todo: CONCEPT CASE
 game_concept_master_terrain: "Ovládnutý terén"
 game_concept_master_terrain_desc: "[Concept('decision','Rozhodnutí')|E] odemčené ze stromu [Concept('wanderer_lifestyle','potulnému životnímu stylu')|El], při němž si můžeš zvolit [Concept('terrain','terén')|El], na který se specializuješ, podle skupiny zvolené v [Concept('designated_terrain','určeném teréně')|El].\n\nToto rozhodnutí poskytne významné výhody pro zvolený terén, včetně bonusů jako zvýšená [Concept('advantage','výhoda')|El], lepší [Concept('combat_roll','bojový hod kostkou')|El], snížení [Concept('attrition','opotřebení')|El] a zvýšená [Concept('prestige','prestiž')|El] a [Concept('prestige_experience','proslulost')|El] z [Concept('battle','bitvy')|El]." # todo: CONCEPT CASE
 game_concept_story_content_temujin: "Příběh o $bookmark_nomads_temujin$" # todo: CONCEPT CASE
 game_concept_story_content_temujin_desc: "#tooltip_heading Styl příběhu: lehký#!\n\nJako Temüdžin se budeš mstít soupeřícímu kmeni, který uvěznil tvou choť, a prověříš věrnost svého nejbližšího vazala a přítele — Džamuchy.\n\n#WEAK Obsah příběhu je volitelný. Po zahájení hry se z něj můžeš kdykoli odhlásit." # todo: CONCEPT CASE
 game_concept_story_content_jamukha: "Příběh o $bookmark_nomads_temujin$" # todo: CONCEPT CASE
 game_concept_story_content_jamukha_desc: "#tooltip_heading Styl příběhu: lehký#!\n\nJako Džamucha jsi vždy žil v dlouhém stínu Temüdžina, ale nadešel čas prokázat vlastní sílu. Zůstaneš mu věrný, nebo mu ve tmě podřízneš hrdlo?\n\n#WEAK Obsah příběhu je volitelný. Po zahájení hry se z něj můžeš kdykoli odhlásit." # todo: CONCEPT CASE
 game_concept_wanua: "Wanua"
 game_concept_wanua_government: "Vláda wanua"
 game_concept_wanua_i: "@government_type_wanua!"
 game_concept_wanua_desc: "[Concept('government','Vláda')|E] typu $wanua_government_adjective$ sdílí slabiny s [Concept('government','vládou')|El] [GetGovernment('tribal_government').GetNameWithIcon], ale má také snížený [Concept('domain_limit','limit domény')|El] a [Concept('vassal_limit','limit vazalů')|El]. Ačkoli používá [Concept('gold','zlato')|El] ke stavbě [Concept('buildings','budovám')|El] a najímání [Concept('men_at_arms','ozbrojenců')|El], z budov získává jen velmi málo zlata.\n\nMůže však využívat [barter_goods_i][Concept('barter','směnný obchod')|El], [Concept('raid','nájezdy')|El] a má součinnost s vládou typu [GetGovernment('mandala_government').GetName], protože získává [Concept('legitimacy','legitimitu')|El] za to, že je [Concept('tributary','tributářem')|El]." # todo: CONCEPT CASE
 game_concept_bloc_supremacy_war: "Válka o nadvládu bloku"
 game_concept_bloc_supremacy: "Nadvláda bloku"
 game_concept_supremacy: "Nadvláda"
 game_concept_bloc_supremacy_war_desc: "Válka o nadvládu bloku je zvláštní typ [Concept('war','války')|El] vedené mezi [Concept('leading_houses','vedoucími rody')|El] dvou [Concept('soryo','sórjó')|El] [Concept('house_blocs','rodových bloků')|El].\n\n#high Na rozdíl od jiných válek se připojí všichni členové obou $game_concept_blocs$.#!\n\nVítězný $game_concept_bloc$ získá [Concept('cohesion','soudržnost')|El], zatímco poražený $game_concept_bloc$ ztratí třetinu své $game_concept_cohesion$.\n\nNavíc se k vítěznému $game_concept_bloc$ připojí všechny [Concept('soryo','sórjó')|El] [Concept('member_houses','členské rody')|El] poraženého $game_concept_bloc$, jejichž [Concept('house_head','hlava rodu')|El] není [GetTrait('loyal').GetName( GetNullCharacter )], [Concept('hooked','zavázaná')|El] poražené $game_concept_leading_house_possessive$ hlavě rodu, jejím pod-[Concept('vassal','vazalem')|El], jejím [Concept('ally','spojencem')|El], [Concept('friends','přáteli')|El] nebo jí [Concept('cowed','vyděšenému')|El]." # todo: CONCEPT CASE
 game_concept_bloc_expansion_war: "Válka o rozšíření bloku"
 game_concept_bloc_expansion: "Rozšíření bloku"
 game_concept_bloc_expansion_war_desc: "Válka o rozšíření bloku je zvláštní typ [Concept('war','války')|El] vedené členem [Concept('bloc','bloku')|El].\n\nV případě vítězství může vítěz jmenovat [Concept('ruler','vládce')|El] pro sporné [Concept('titles','tituly')|El], nebo si je ponechat pro sebe.\n\nJmenování $game_concept_ruler$ tímto způsobem přidá na příjemce [Concept('hook','páku')|El], připojí jej k vítězovu $game_concept_bloc$ a založí nový [Concept('house','rod')|El], pokud příjemce není [Concept('house_head','hlavou rodu')|El]." # todo: CONCEPT CASE
 game_concept_retirement_age: "$celestial_retirement_law$"
 game_concept_retirement_age_desc: "[Concept('law','Zákon')|E] $celestial_retirement_law$ určuje věk stanovený [Concept('top_liege','nejvyšším lenním pánem')|El] [Concept('realm','panství')|El], po jehož dosažení se [Concept('governors','guvernéry')|El] a [Concept('ministers','ministři')|El] mohou rozhodnout odejít na odpočinek prostřednictvím [Concept('decision','rozhodnutí')|El], nebo k tomu být donuceni [Concept('character_interaction','interakcí s postavou')|El] z důvodu hrozící sešlosti a snížené schopnosti sloužit." # todo: CONCEPT CASE
