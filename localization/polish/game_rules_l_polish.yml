 setting_historicity_extra_admin_tamilakam_alt_historic_always_desc: "Čólové budou vždy začínat s [Concept('administrative','administrativní')|E] [Concept('government','vládou')|E], přestože to ne vždy odpovídá jejich historickému uspořádání."
 rule_historicity_extra_admin_carolingians: "Další [Concept('administrative','administrativní')|E] [Concept('realms','panství')|E] – Karlovci"
 setting_historicity_extra_admin_carolingians_gameplay_not_administrative: "Bez administrativní vlády"
 setting_historicity_extra_admin_carolingians_gameplay_not_administrative_desc: "Žádný z karolínských nástupnických států nebude mít v roce 867 [Concept('administrative','administrativní')|E] [Concept('governments','vládu')|E], což odráží skutečnost, že velká část bývalé říše během poslední jedné či dvou generací přešla k feudalismu."
 setting_historicity_extra_admin_carolingians_alt_historic_all_administrative: "#high Všechny administrativní v roce 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_all_administrative_desc: "Západofranská říše, Lotharingie, Východofranská říše a Itálie budou v roce 867 začínat s [Concept('administrative','administrativními')|E] [Concept('governments','vládami')|E], což neodpovídá jejich historickému uspořádání (ale zatím k němu nemá příliš daleko)."
 setting_historicity_extra_admin_carolingians_alt_historic_west_francia_administrative: "#high Západofranská říše v roce 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_west_francia_administrative_desc: "Pouze Západofranská říše bude v roce 867 začínat s [Concept('administrative','administrativní')|E] [Concept('government','vládou')|E], což neodpovídá jejímu historickému uspořádání."
 setting_historicity_extra_admin_carolingians_alt_historic_lotharingia_administrative: "#high Lotharingie v roce 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_lotharingia_administrative_desc: "Pouze Lotharingie bude v roce 867 začínat s [Concept('administrative','administrativní')|E] [Concept('government','vládou')|E], což neodpovídá jejímu historickému uspořádání."
 setting_historicity_extra_admin_carolingians_alt_historic_east_francia_administrative: "#high Východofranská říše v roce 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_east_francia_administrative_desc: "Pouze Východofranská říše bude v roce 867 začínat s [Concept('administrative','administrativní')|E] [Concept('government','vládou')|E], což neodpovídá jejímu historickému uspořádání."
 setting_historicity_extra_admin_carolingians_alt_historic_italy_administrative: "#high Itálie v roce 867#!"
 setting_historicity_extra_admin_carolingians_alt_historic_italy_administrative_desc: "Pouze Itálie bude v roce 867 začínat s [Concept('administrative','administrativní')|E] [Concept('government','vládou')|E], což neodpovídá jejímu historickému uspořádání."
 rule_historicity_extra_admin_player_wherever: "Další [Concept('administrative','administrativní')|E] [Concept('realms','panství')|E] – hráči"
 setting_historicity_extra_admin_player_wherever_gameplay_not_administrative: "Bez zvláštních změn"
 setting_historicity_extra_admin_player_wherever_gameplay_not_administrative_desc: "Hráči budou [Concept('administrative','administrativní')|E] pouze tehdy, pokud si vyberou [Concept('realm','panství')|E], které již má odpovídající [Concept('government','vládu')|E]."
 setting_historicity_extra_admin_player_wherever_alt_historic_always: "#high Vždy#!"
 setting_historicity_extra_admin_player_wherever_alt_historic_always_desc: "Hráči, kteří začínají s [Concept('realm','panstvím')|E] alespoň [Concept('kingdom','královské')|E] [Concept('title_tier','úrovně')|E], je při zahájení hry automaticky převedou na [Concept('administrative','administrativní')|E] [Concept('government','vládu')|E]."
 setting_historicity_extra_admin_player_wherever_alt_historic_with_august_trait: "#high S rysem @august_trait_icon!Vznešenost#!"
 setting_historicity_extra_admin_player_wherever_alt_historic_with_august_trait_desc: "Hráči, kteří mají [Concept('trait','rys')|E] [GetTrait('august').GetName( GetNullCharacter )] a začínají s [Concept('realm','panstvím')|E] alespoň [Concept('kingdom','královské')|E] [Concept('title_tier','úrovně')|E], je při zahájení hry automaticky převedou na [Concept('administrative','administrativní')|E] [Concept('government','vládu')|E] (určeno pro hru více hráčů, kde se $game_concept_governments$ mohou lišit)."
 rule_title_creation_imperial_power_projection: "Prosazování císařské moci"
 setting_title_creation_imperial_power_projection_none: "Žádné"
 setting_title_creation_imperial_power_projection_none_desc: "[Concept('empires','Říše')|E] může svobodně vytvořit jakákoli [Concept('character','postava')|E], která splňuje příslušné požadavky."
 setting_title_creation_imperial_power_projection_any_power_advantage: "#high Jakákoli mocenská převaha#!"
 setting_title_creation_imperial_power_projection_any_power_advantage_desc: "Vytvoření [Concept('empire','říše')|E] vyžaduje vůči #BER každému#! sousednímu [Concept('realm','panství')|E] $game_concept_empire$-[Concept('title_tier','úrovně titulu')|E] [Concept('strong_hook','silnou páku')|E] na jeho vládce, [Concept('marriage','sňatek')|E] s [Concept('close_family','členem jeho blízké rodiny')|E] nebo o 50 % více vojáků."
 setting_title_creation_imperial_power_projection_hard_power_only: "#high Převaha tvrdé moci#!"
 setting_title_creation_imperial_power_projection_hard_power_only_desc: "Vytvoření [Concept('empire','říše')|E] vyžaduje mít o 50 % více vojáků než #BER každé#! sousední [Concept('realm','panství')|E] $game_concept_empire$-[Concept('title_tier','úrovně titulu')|E]."
 setting_title_creation_imperial_power_projection_soft_power_only: "#high Převaha měkké moci#!"
 setting_title_creation_imperial_power_projection_soft_power_only_desc: "Vytvoření [Concept('empire','říše')|E] vyžaduje vůči #BER každému#! sousednímu [Concept('realm','panství')|E] $game_concept_empire$-[Concept('title_tier','úrovně titulu')|E] [Concept('strong_hook','silnou páku')|E] na jeho vládce nebo [Concept('marriage','sňatek')|E] s [Concept('close_family','členem jeho blízké rodiny')|E]."
 setting_title_creation_imperial_power_projection_hard_power_only_strict: "#high Přísná převaha tvrdé moci#!"
 setting_title_creation_imperial_power_projection_hard_power_only_strict_desc: "Vytvoření [Concept('empire','říše')|E] vyžaduje mít o 50 % více vojáků než #BER každé#! [Concept('realm','panství')|E] $game_concept_empire$-[Concept('title_tier','úrovně titulu')|E], které sousedí s [Concept('character','postavou')|E] nebo má v jejím panství nějaké [Concept('de_jure','de iure')|E] území."
 setting_title_creation_imperial_power_projection_any_power_strict: "#high Přísná jakákoli mocenská převaha#!"
