 game_rule.1141.t: "Witenagemot volí: [elect.GetFirstNameNoTooltip] z rodu [elect.GetHouse.GetNameNoTooltip]"
 game_rule.1141.intro.battlefield: "[winner.GetTitledFirstName] [Select_CString(winner.IsFemale,'padla','padl')] na bojišti v boji s uchvatitelem [loser.GetTitledFirstNameNicknamed|l].\n\n"
 game_rule.1141.intro.home: "[winner.GetTitledFirstName] [Select_CString(winner.IsFemale,'nečekaně zemřela','nečekaně zemřel')] na srdeční záchvat poté, co dorazila dobrá zpráva, že [loser.GetTitledFirstNameNicknamed|l] [Select_CString(loser.IsFemale,'byla poražena','byl poražen')].\n\n"
 game_rule.1141.choice.margaret: "Jakýmsi nepochopitelným zázrakem se witenagemot shodl na #EMP mně#! jako kompromisní kandidátce a pominul očekávaného dědice [jiltee.GetFullNameNoTooltip]. Přední hrabata si očividně myslí, že mě mohou ovládat, že budu pouhou loutkou jejich ambicí.\n\nNic takového nejsem, ale toto nečekané vynesení k moci vítám — jsem přece otcova prvorozená."
 game_rule.1141.choice.edgar: "V záchvatu rozumu, jaký anglická politika mnoho a mnoho let nezažila, witenagemot konečně uznal zjevnou skutečnost: [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamed|l] zanechal jako právoplatného dědice #EMP mě#!. Proto mě pověřil vládou nad panstvím a pominul očekávaného dědice [jiltee.GetFullNameNoTooltip].\n\nNevím, co jsem udělal, že mi [ROOT.Char.GetFaith.FateGodName] projevuje takovou přízeň, ale jsem přešťastný, že jsem to udělal."
 game_rule.1141.choice.svend: "Witenagemot, znechucený smrtí a zkázou, kterou po sobě zanechali všichni ostatní uchazeči, se — pro jednou rozumně — obrátil ke #EMP mně#! jako k dalšímu přirozenému kandidátovi, jenž může obnovit pořádek, a pominul očekávaného dědice [jiltee.GetFullNameNoTooltip].\n\nDánsko bude opět po právu vládnout Anglii."
 game_rule.1141.choice.aelfwine: "Witenagemot, posedlý jakýmsi nevysvětlitelným šílenstvím, mě úpěnlivě žádá, abych se vrátil domů a vládl království svého otce a děda, zatímco očekávaného dědice [jiltee.GetFullNameNoTooltip] pominul.\n\nJá... nikdy jsem po tom netoužil. Nechtěl jsem to. Od moci jsem se držel tak daleko, jak jen to šlo, ale je zřejmé, že [elect.GetFaith.HighGodName] si přeje, abych se vrátil do zemí, které jsem s radostí navždy opustil."
 game_rule.1141.choice.cadoc: "Witenagemot se jako obvykle hašteřil, až nakonec dospěl k podivnému rozhodnutí. Protože nechce snášet dalšího cizího krále a jeho členové navzájem jeden druhému nedůvěřují, vybrali si k vládě nad Anglií #EMP mě#!. Očividně si myslí, že jsem slabá loutka, kterou si mohou vytvarovat podle své vůle.\n\nMožná mají pravdu, možná ne. Mně nezbývá než tuto nečekanou příležitost ukázat, co ve mně je, přivítat!"
 game_rule.1141.a.margaret: "První královna Anglie!"
 game_rule.1141.a.edgar: "Mé dědické právo je mi navráceno!"
 game_rule.1141.a.svend: "Vždycky jsem věděl, že to takhle skončí."
 game_rule.1141.a.aelfwine: "O tohle jsem nikdy nežádal!"
 game_rule.1141.a.cadoc: "I za pět set let budou znát mé jméno!"
 game_rule.1142.t: "$game_rule.1141.t$"
 game_rule.1142.intro.battlefield: "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(winner.IsFemale,'padla','padl')] na bojišti v boji s uchvatitelem [loser.GetTitledFirstNameNicknamed|l].\n\n"
 game_rule.1142.intro.home: "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString(winner.IsFemale,'nečekaně zemřela','nečekaně zemřel')] na srdeční záchvat poté, co dorazila dobrá zpráva, že [loser.GetTitledFirstNameNicknamed|l] [Select_CString(loser.IsFemale,'byla poražena','byl poražen')].\n\n"
 game_rule.1142.choice.preamble: "Navzdory všemu se witenagemot rozhodl zvolit [elect.GetFirstName] z rodu [elect.GetHouse.GetName] —"
 game_rule.1142.choice.margaret: "jejím prastrýcem byl [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamed|l] a jejím otcem poutník [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed|l]"
 game_rule.1142.choice.edgar: "jeho prastrýcem byl [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamed|l], sám byl určeným dědicem, než se moci chopil [winner.GetFirstNameNoTooltip], a jeho otcem byl poutník [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed|l]"
 game_rule.1142.choice.svend: "jeho dědem byl [GetScriptedCharacterByHistoryID( '101505' ).GetTitledFirstNameNicknamed|l], sám je [elect.GetTitleAsNameNoTooltip|l] a [elect.GetPrimaryTitle.GetBaseNameNoTier] je jeho panstvím; do prvních fází konfliktu se rozhodl nezasahovat"
 game_rule.1142.choice.aelfwine: "jeho dědem byl [GetScriptedCharacterByHistoryID( '101510' ).GetTitledFirstNameNicknamed|l] a sám žije v dobrovolném vyhnanství jako chudý duchovní v Okcitánii"
 game_rule.1142.choice.cadoc: "pochází z Cornwallu a z jakéhosi rodu, jehož původ se snad ani nedá vypovědět"
 game_rule.1142.outro: "— [Select_CString(elect.IsFemale,'novou vládkyní','novým vládcem')] království místo #EMP mě#!.\n\nZdá se, že mi Anglie okamžitě proklouzla mezi prsty."
 game_rule.1142.a: "To je nehoráznost, trůn je můj!"
 game_rule.1142.b: "Vůle sněmu je neochvějná."
 game_rule.1142.c: "Tak blízko trůnu, a přece tak daleko..."
 rule_historicity_frankokratia: "Šance na Frankokratii"
 setting_historicity_frankokratia_default: "Vyvážená"
 setting_historicity_frankokratia_default_desc: "Odkloněná křížová výprava, při níž jsou katolíci odvedeni k útoku na Byzanc, je při zahájení hry v roce 1178 možná okamžitě. Při dřívějším zahájení k ní může dojít až #EMP po#! první katolické [Concept('crusade','křížové výpravě')|E]."
 setting_historicity_frankokratia_blocked: "Žádná"
 setting_historicity_frankokratia_blocked_desc: "Katoličtí křižáci nebudou odkloněni k útoku na Byzantskou říši."
 setting_historicity_frankokratia_fourth_crusade: "Čtvrtá křížová výprava"
 setting_historicity_frankokratia_fourth_crusade_desc: "Při dřívějších datech zahájení musí před Odkloněnou křížovou výpravou proběhnout alespoň 3 katolické [Concept('crusades','křížové výpravy')|E]. Při zahájení v roce 1178 mohou katolíci zaútočit na Byzanc až #EMP po#! 1 [Concept('crusade','křížové výpravě')|E]."
 setting_historicity_frankokratia_high: "Vysoká"
 setting_historicity_frankokratia_high_desc: "Kterákoli katolická [Concept('crusade','křížová výprava')|E] se může změnit v Odkloněnou křížovou výpravu, která se oddělí a zahájí válku proti Byzanci."
