 setting_matrilineal_marriages_never_desc: "Postavy ovládané AI nebudou nikdy sjednávat [Concept('matrilineal','matrilineární')|E] sňatky, pokud nežijí v panství, kde platí [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName]."
