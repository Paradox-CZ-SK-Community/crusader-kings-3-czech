 game_rule.1101.desc.oxford: "u nenápadného městečka Oxford,"
 game_rule.1101.desc.cirencester: "okolo hradeb starého Cirencesteru,"
 game_rule.1101.desc.guildford: "podél hřebene Hog's Back u Guildfordu,"
 game_rule.1101.desc.lindisfarne: "na břehu naproti ostrovnímu klášteru Lindisfarne, jednomu z nejposvátnějších míst Británie,"
 game_rule.1101.desc.lands_end: "na úpatí Land's End, téměř v samotné šíři Atlantského oceánu,"
 game_rule.1101.desc.stonehenge: "na široké Salisbury Plain v stínu Stonehenge,"
 game_rule.1101.desc.southwark: "u ruin London Bridge a přechodu ze Southwarku,"
 game_rule.1101.desc.scotland: "na nepřátelské půdě sousedního Skotska,"
 game_rule.1101.desc.wales: "v kopcích a údolích Walesu,"
 game_rule.1101.desc.norway: "v samotném Norsku,"
 game_rule.1101.desc.normandy: "v samotné Normandii,"
 game_rule.1101.desc.france: "na francouzské půdě,"
 game_rule.1101.desc.riverside: "přes úzký kamenný most překlenující řeku v [new_location.GetName],"
 game_rule.1101.desc.coastal: "podél pobřeží [new_location.GetName],"
 game_rule.1101.desc.forest: "v lesích [new_location.GetName],"
 game_rule.1101.desc.plains: "na pláních [new_location.GetName],"
 game_rule.1101.desc.farmlands: "v bujných polích [new_location.GetName],"
 game_rule.1101.desc.wetlands: "v zapáchajících bažinách [new_location.GetName],"
 game_rule.1101.desc.hills: "v zvlněných kopcích [new_location.GetName],"
 game_rule.1101.desc.fallback: "na nevýrazném poli blízko [new_location.GetName],"
 game_rule.1101.desc.combat.commander: "a zjišťuji, že jsem uprostřed toho všeho."
 game_rule.1101.desc.combat.not_present: "i když tam osobně být nemohu."
 game_rule.1101.desc.combat.locale.stamford_bridge: "Celé dopoledne naše jednotky zatlačovaly tam a zpět přes most, oddíly se brodily přes řeku Derwent, aby každou druhou hodinu bojovaly s nepřáteli na protějším břehu.\n\nJe to... masakr. Nic než křik a umírání, doplňované tlučením těl do vody. Derwent teče rudě a bude to tak dál na míle. Meč vztyčený vysoko, vrhám se do posledního šiku, abych prolomil patovou situaci, vyrážím přes most se svými vojáky dvora a —"
 game_rule.1101.desc.combat.locale.hastings: "Celý svět plane rachotem kovu o dřevo, tříštěním štítů, řehtáním koní, vytrvalým staccatem #EMP thwip#! šípů klenoucích se do nebe po tisících.\n\nVšechno se svedlo na křik, krev a gore. Výkřiky zraněných a umírajících, kletby mstitelů, radostné chichotání vítězů, kteří pohánějí svou euforii dál do boje.\n\nOsud balansuje na hraně nože, a se zakřikem #EMP RALLY!#! hnám své vojáky vpřed."
 game_rule.1101.desc.combat.locale.dover: "Tak blízko nebezpečného okraje obě armády manévrují jen proto, aby protivníka přinutily přes sráz — s omezeným efektem.\n\nSmrad krve kazí vzduch, hukot bitvy se jistě nese míle daleko. Nešťastný pozorovatel by snad mohl zahlédnout občasnou skvrnu těla pohybující se dolů po křídovém útesu.\n\nTohle nemůže pokračovat, toto #EMP will#! nebude pokračovat, jinak se vyčerpáme. S výkřikem žene mé vojáky vpřed, k vítězství, k —"
 game_rule.1101.desc.combat.locale.isle_of_wight: "Daleko od pevniny není kam utéct a obě armády bojují se zoufalstvím těch, kdo vědí, že jde o život. Pokud nejsi zatlačen do přílivu Mediny, ostrov není dost velký na to, aby se dlouho skrýval.\n\nNějak jsem se ocitl izolován od svých vojáků, jen hrstka stráží se vedle mě prodírá bitevní vřavou. Kdybych to mohl obrátit ve svůj prospěch, kdybych mohl bitvu aspoň trochu otočit —"
 game_rule.1101.desc.combat.locale.forest_of_dean: "Pod těmito divokými stromy, v houštinách a hájcích tohoto starobylého lesa krev nejvíce zavlažuje zemi a dohled je tak špatný, že nikdo nemůže určit, jak se bitva vyvíjí.\n\nLes jako by nasával zvuk i život, dává našemu boji podivně tlumený ráz vzhledem k množství běsnění a smrti, které se šíří v řadách. Přesto mám pocit, že se věci obracejí v náš prospěch —"
 game_rule.1101.desc.combat.locale.london: "Přes veškeré snahy obránců z hradeb svést průběh na jednu či druhou stranu se obě strany jenom vyčerpávají v neustálém patu.\n\nVzduch páchne krví, hukot umírajících i jejich vrahů vše přehlušuje a mračna prachu a potu znemožňují zjistit, kdo vede.\n\nPřesto nemohu opustit své vojsko tomuto #EMP anarchy#!, a s výkřikem se znovu vrhám na nepřítele. Toto je náš čas, zvítězíme, zlomíme je, my —"
 game_rule.1101.desc.combat.locale.cirencester: "$game_rule.1101.desc.combat.locale.london$"
 game_rule.1101.desc.combat.locale.guildford: "Křivolaký kopec, když žádná armáda zcela nekontroluje jeho vrchol, dává ohromující bitvu. Dlouhý a úzký, obě strany tlačí, aby srazily protivníka dolů po protilehlém hřebeni, kde výhoda výšky je jistě dovede k vítězství.\n\nPřesto vím, že to ponesou #EMP moji#! vojáci, #EMP mé#! síly okusí sladkost vítězství! Vpřed, #EMP vy psi#! Vpřed! Jsme jen jedno pevné zatlačení od vítězství, jedno zatlačení od —" # todo: RETRANSLATED ENGLISH
 game_rule.1101.desc.combat.locale.lindisfarne: "Mořské příboje pálí oči, kruté větry čerstvé z Severního moře trhají látku i štít a pláč mrtvých a umírajících doléhá k mnichům v klášteře, kteří vzlykají a trhají svoje roucha nad masakrem před nimi.\n\nPokud zde padnu, pak ať už to bude vůlí [ROOT.Char.GetFaith.HighGodName], neboť jinak mě [ROOT.Char.GetFaith.HighGodNameSheHe|U] jistě podporuje v mém právu na Anglii! Kupředu, moji vojáci, kupředu a přineste mi mou korunu! Bojujte ze všech sil, jinak—"
 game_rule.1101.desc.combat.locale.lands_end: "Skalnaté křoviny a nízké, zubaté útesy zde přecházejí v ledové moře, a rozbitý terén činí bitvu nesmírně chaotickou, spíše rozptýlené šarvátky než jednotné střety čelo proti čelu.\n\nI tak můj prapor shromažďuje muže u mne a já dělám maximum, abych se probojoval do středu boje. Svolejte se ke mně! #EMP Svolejte#! Můj výkřik se odráží po celé linii, a opakuje se a opakuje dokud—"
 game_rule.1101.desc.combat.locale.stonehenge: "Teoreticky jsou tyto široké, ploché pláně ideálním místem pro vedení války. Dostatek prostoru pro střetnutí armád, a přesto... je na tom místě něco #EMP děsivého#! Něco, co není úplně v pořádku.\n\nBojujeme, umíráme a řveme náš hněv do vysokých nebes, ale něco ve vzduchu jako by nasávalo naši zlobu tak rychle, jak přichází. Přesto nemohu zpomalit, musím vést, musím—"
 game_rule.1101.desc.combat.locale.southwark: "S nejbohatším anglickým městem tak blízko je o co bojovat. Ať už domy nebo lup, sláva nebo zbožnost, obě armády se znovu a znovu srážejí.\n\nJižní břeh Temže pění naším krví, ale nevzdám se, #EMP nevzdám#! se.\n\nAnglie je už má, tato bitva to dokáže, a stačí jen jedno poslední #EMP úsilí#!, aby to dokázalo—"
 game_rule.1101.desc.combat.locale.riverside: "S málem místa pro půl tuctu vojáků stojících vedle sebe se bitva stává méně záležitostí obratné taktiky a více brutálním vybíjením, tlačenice těl sankcionuje i ztěžuje snahy o odtah raněných z čáry.\n\nPřesto, pokud se jen protlačíme skrz linii, jen rozeženeme jejich síly, budeme mít vyhráno! Zahodiv opatrnost do větru, probojuji se na samý čel, meč připraven a—"
 game_rule.1101.desc.combat.random.present.1: "Naše armády se vrhají jedna na druhou a celý svět se zmenšuje na tříštící se štíty, křičící kov a umírající muže i koně.\n\nVálka může být krutá, ale toto je méně válka a více prosté dhabnění. Veteráni i žoldnéři na obou stranách bez váhání posílají čerstvé brance ke špiritusu.\n\nNechtěje nechat tento noční můru pokračovat, vyrazím vpřed, mé družstvo těsně za mnou, a—"
 game_rule.1101.desc.combat.random.present.2: "Naše dvě síly se střetávají a víří kolem sebe, obě strany hledají slabinu. Šarvátíme, pak couváme, jen abychom se posléze vrhli na druhou část linie.\n\nZtráty jsou zatím malé, ale vzduch je těžký. Všichni víme, že tento tanec nemůže trvat věčně, že pravá bitva bude brzy zahájena.\n\nLépe ovládnout pole, než mu podléhat. Zvedám meč vysoko a křičím na [ROOT.Char.GetFaith.WarGodName], vrhám se vpřed, všechny armády [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] za mnou a—"
 game_rule.1101.desc.combat.random.present.3: "Denní světlo už slábne, hodinu za hodinou zbrojíce v zbytečném vyvražďování. Meče slábnou únavou, mysl mlží únavou, a když se slunce začíná sklánět k obzoru, hrozí, že se bitva skončí patem.\n\nNe.\n\nNedovolím to. Toto končí, zde a nyní, mým vítězstvím, a nechám to byt nebo ať mě [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself|U] zasáhne #EMP d—#!"
 game_rule.1101.desc.combat.random.absent.1: "Po většinu dne se naše armády rvou jedna s druhou. Nejdřív padají desítky, pak stovky, řeznický účet pomalu roste s každou uplynulou hodinou, zatímco muži za mou věc obětují své životy.\n\nJistě, jistě to všechno bude stát za to. Jistě musí mít tolik smrti nějakou odměnu, nějakou kompenzaci za životy poslané křičet a kopat se do chladného objetí [ROOT.Char.GetFaith.DeathDeityNamePossessive]."
 game_rule.1101.desc.combat.random.absent.2: "Konflikt je brutální. Řev tříštících se štítů a skřeky umírajících trhají vzduch, jakýkoli náznak organizace zmizel pod chaosem půltuctu zpackaných nájezdů a linií bojiště více zamotaných než ne.\n\nPřesto vojáci setrvávají, bojují za svého [ROOT.Char.GetTitleAsNameNoTooltip], bojují, aby jejich vrozená práva a výsady nebyly pošlapány, i kdyby je to mělo stát život."
 game_rule.1101.desc.combat.random.absent.3: "Životy jsou přerušeny po stovkách, padlé jako obilí pod srpem, tolik vláken uťatých pod mrzutými šklebky najatých zabijáků vykonávajících svou krvavou práci.\n\nJejich oběť bude jistě, #EMP jistě#! stát za to, nutná předpodmínka mé nadcházející slávy. Každý je to jako dlaždice na cestě osudu, položena ve službě jedinému cíli."
 game_rule.1101.desc.outro.present: "Myšlení opouští mou hlavu, svět se rozmazává do šlehání a sekání, mé dvorní družiny naskládány těsně kolem mne, zatímco drtíme [loser.GetTitledFirstNamePossessive] armádu. Pod mým mečem se nepřítel hroutí."
 game_rule.1101.desc.outro.absent: "Konečně se nepřítelova linie zlomí a [Select_CString(loser.IsFemale,'její','jeho')] síly jsou rozprášeny: tento den patří [winner.GetTitledFirstNameNicknamedNoTooltip]!"
 game_rule.1101.a: "Anglie už více nepodlehá vikingské nadvládě!"
 game_rule.1102.desc.outro.alive: "Nakonec je to všechno marné. Mé síly se zlomí, protivník vtrhne do mezery a s jejich zničením jsou mé ambice zcela zmařeny."
 game_rule.1102.desc.outro.dead: "Bolest mi vyšplíchne na hruď. Ne, ne, #BER ne#!, kdo by mohl... kde se... svět se škubne, jak padám k zemi, krev se rozlévá z rány. Pomalu mě smrt bere."
 game_rule.1102.a: "Jak se to mohlo stát!?"
 game_rule.1102.b: "Já #DIE1 jsem...#! #DIE2 ztracen...#!"
 game_rule.1103.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1103.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1103.a: "Vítězství nad tím narozdíl nemanželským pretendentem!"
 game_rule.1104.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1104.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1104.a: "Ale — Vyznavač mi slíbil Anglii!"
 game_rule.1104.b: "Ať vláda přinese... #DIE1 tobě...#! #DIE2 bídu...#!"
 game_rule.1111.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1111.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1111.a: "Další vítězství ságy!"
 game_rule.1112.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1112.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1112.a: "Ne, ne, ne, NE, #BER NE#!"
 game_rule.1112.b: "Sakra... #DIE1 tobě...#! #DIE2 Tostigu...#!"
 game_rule.1113.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1113.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1113.a: "[loser.GetSheHe|U] nebyl pravým [loser.Custom('GetDaughterSon')] severu!"
 game_rule.1114.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1114.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1114.a: "[winner.GetSheHe|U] ani nemá nárok, do prdele!"
 game_rule.1114.b: "Zatracení... #DIE1 tobě#!... #DIE2 Harald...#!"
 game_rule.1121.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1121.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1121.a: "Na tvém místě, uzurpátore."
 game_rule.1122.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1122.desc.outro.dead: "Něco sviští z nebe, mířeno, zdánlivě neodvratně, přímo na mé oko."
 game_rule.1122.a: "Sakra na toho zlodějského parchanta!"
 game_rule.1122.b: "Šípy! Štít nahoru, nadchází salva! Salva —"
 game_rule.1123.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1123.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1123.a: "Zpátky do chladu, vy severní psi!"
 game_rule.1124.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1124.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1124.a: "Mé sny jsou popel..."
 game_rule.1124.b: "Ha, nejvelkolepější #DIE1 podnik#! #DIE2 čeká...#!"
 game_rule.1131.desc.conquest_finished.die_battlefield: "$game_rule.1102.desc.outro.dead$"
 game_rule.1131.desc.conquest_finished.die_home: "Když se ke mně donesou zprávy, že jsme bitvu vyhráli, pocítím nadšení! Srdce mi vyskočí radostí, kymácí se, kroutí, #EMP škubá#!, #BER křičí!#!\n\nCo se to... se mnou děje... nemůžu... #DIE1 dýchat... nemůžu...#!"
 game_rule.1131.a: "$game_rule.1101.a$"
 game_rule.1131.b: "Byl jsem... #DIE1 tak...#! #DIE2 blízko...#!"
 game_rule.1132.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1132.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1132.a: "$game_rule.1102.a$"
 game_rule.1132.b: "$game_rule.1102.b$"
 game_rule.1133.desc.conquest_finished.die_battlefield: "$game_rule.1102.desc.outro.dead$"
 game_rule.1133.desc.conquest_finished.die_home: "$game_rule.1131.desc.conquest_finished.die_home$"
 game_rule.1133.a: "$game_rule.1103.a$"
 game_rule.1133.b: "$game_rule.1131.b$"
 game_rule.1134.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1134.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1134.a: "$game_rule.1104.a$"
 game_rule.1134.b: "$game_rule.1104.b$"
 game_rule.1141.t: "Witengamot volí: [elect.GetFirstNameNoTooltip] z [elect.GetHouse.GetNameNoTooltip]"
 game_rule.1141.intro.battlefield: "[winner.GetTitledFirstName] padl na bojišti, [Select_CString(winner.IsFemale,'zabita','zabit')] v boji s nástupnickým pretendentem [loser.GetTitledFirstNameNicknamed].\n\n"
 game_rule.1141.intro.home: "[winner.GetTitledFirstName] zemřel nečekaně, skolen infarktem při přijetí zprávy o porážce [loser.GetTitledFirstNameNicknamedPossessive].\n\n"
 game_rule.1141.choice.margaret: "Jakýmsi zmateným zázrakem se Witengamot dohodl na #EMP mě#! jako kompromisní kandidátku, opustiv očekávaného dědice [jiltee.GetFullNameNoTooltip]. Velcí hrabata zřejmě věří, že mě dokážou ovládat, považují mě za loutku svých ambicí.\n\nNic takového nejsem, ale vítám toto nečekané vhození do moci — koneckonců jsem otcova prvorozená."
 game_rule.1141.choice.edgar: "V záchvatu kompetence, jaký se v anglické politice dlouhá léta neukázal, Witengamot uznal, že #EMP já#! jsem [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive] legitimním dědicem a jmenoval mě vládnout království, opustiv očekávaného dědice [jiltee.GetFullNameNoTooltip].\n\nNemohu říct, čím jsem si zasloužil přízeň [ROOT.Char.GetFaith.FateGodNamePossessive], ale jsem nesmírně rád, že tomu tak je."
 game_rule.1141.choice.svend: "Unaven smrtí a zničením, které způsobili všichni ostatní uchazeči o trůn, se Witengamot — pro jednou rozumně — obrátil na #EMP mě#! jako na další nejpřirozenější kandidáta, který přinese pořádek, opustiv očekávaného dědice [jiltee.GetFullNameNoTooltip].\n\nDánsko opět zaujme své přirozené místo ve vládě nad Anglií."
 game_rule.1141.choice.aelfwine: "Ovládnut nějakým tajemným šílenstvím, Witengamot prosil #EMP mě#!, abych se vrátil domů a vládl království mých otce a děda, opustiv očekávaného dědice [jiltee.GetFullNameNoTooltip].\n\nJá... neměl jsem pro to ambice. Nechtěl jsem to. Vzdálil jsem se od moci, jak nejlépe jsem uměl, ale je zřejmé, že není úniku před vůlí [elect.GetFaith.HighGodNamePossessive], že se vrátím na země, které jsem šťastně navždy opustil."
 game_rule.1141.choice.cadoc: "Hádkami, jako obvykle, Witengamot dospěl k podivnému rozhodnutí. Nechtěje strávit dalšího cizího krále a podezřívaví vůči sobě navzájem, zvolili #EMP mne#! k vládě Anglie, jasně si mě představují jako slabou loutku, kterou mohou tvarovat podle své vůle.\n\nMožná mají pravdu, možná ne, mohu jen přijmout tuto nečekanou příležitost ukázat, co umím!"
 game_rule.1141.a.margaret: "První královna Anglie!"
 game_rule.1141.a.edgar: "Mé dědictví, navráceno!"
 game_rule.1141.a.svend: "Vždy jsem věděl, že to tak skončí."
 game_rule.1141.a.aelfwine: "O tohle jsem nežádal!"
 game_rule.1141.a.cadoc: "I za pět set let budou znát mé jméno!"
 game_rule.1142.t: "$game_rule.1141.t$"
 game_rule.1142.intro.battlefield: "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] padl na bojišti, [Select_CString(ROOT.Char.IsFemale,'zabita','zabit')] v boji s nástupnickým pretendentem [loser.GetTitledFirstNameNicknamed].\n\n"
 game_rule.1142.intro.home: "[winner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] zemřel nečekaně, skolen infarktem při přijetí zprávy o porážce [loser.GetTitledFirstNameNicknamedPossessive].\n\n"
 game_rule.1142.choice.preamble: "Navzdory všemu, místo [Select_CString(winner.IsFemale,'její','jeho')] zvolil Witengamot [elect.GetFirstName] z [elect.GetHouse.GetName] —"
 game_rule.1142.choice.margaret: "nevlastní neteř [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive] a dcera tuláka [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed]"
 game_rule.1142.choice.edgar: "nevlastní synovec [GetScriptedCharacterByHistoryID( '114' ).GetTitledFirstNameNicknamedPossessive], zvolený dědic předtím, než [winner.GetFirstNameNoTooltip] uchvátil moc, a syn tuláka [GetScriptedCharacterByHistoryID( '110' ).GetTitledFirstNameNicknamed]"
 game_rule.1142.choice.svend: "vnuk [GetScriptedCharacterByHistoryID( '101505' ).GetTitledFirstNameNicknamedPossessive] a [elect.GetTitleAsNameNoTooltip] z [elect.GetPrimaryTitle.GetBaseNameNoTier], který se rozhodl nezapočít do počátečních fází konfliktu"
 game_rule.1142.choice.aelfwine: "vnuk [GetScriptedCharacterByHistoryID( '101510' ).GetTitledFirstNameNicknamed], který žil v dobrovolném exilu jako chudý církevní sluha v Okcitánii"
 game_rule.1142.choice.cadoc: "cornwallský šlechtic z nějaké nevyslovitelné linie"
 game_rule.1142.outro: "— jako nový vládce království místo #EMP mě#!.\n\nZdá se, že Anglie mi právě unikla z rukou."
 game_rule.1142.a: "To je pobuřující, trůn je můj!"
 game_rule.1142.b: "Vůle rady je neústupná."
 game_rule.1142.c: "Tak blízko panování, a přesto tak daleko..."
 rule_historicity_frankokratia: "Šance na Frankokratii"
 setting_historicity_frankokratia_default: "Vyvážené"
 setting_historicity_frankokratia_default_desc: "Rozštěpená křížová výprava, odklánějící katolíky k útoku na Byzanc, je okamžitě možná od startovního data 1178. Při použití dřívějšího startu se to může stát pouze #EMP po#! první katolické [Concept('crusade','křížové výpravě')|E]." # todo: CONCEPT CASE
 setting_historicity_frankokratia_blocked: "Žádné"
 setting_historicity_frankokratia_blocked_desc: "Katoličtí křižáci nebudou odkloněni k útoku na Byzantskou říši."
 setting_historicity_frankokratia_fourth_crusade: "Čtvrtá křížová výprava"
 setting_historicity_frankokratia_fourth_crusade_desc: "U dřívějších startů musí proběhnout alespoň 3 katolické [Concept('crusades','křížové výpravy')|E], než k rozštěpené křížové výpravě dojde. Od roku 1178 mohou katolíci zaútočit na Byzanc pouze #EMP po#! 1 [Concept('crusade','křížové výpravě')|E]." # todo: CONCEPT CASE
 setting_historicity_frankokratia_high: "Vysoká"
 setting_historicity_frankokratia_high_desc: "Každá katolická [Concept('crusade','křížová výprava')|E] se může proměnit v rozštěpenou výpravu, rozpadnout se a zahájit válku proti Byzanci." # todo: CONCEPT CASE
