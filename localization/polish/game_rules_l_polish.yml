 rule_matrilineal_marriages: "Matrilineární sňatky"
 setting_default_matrilineal_marriages: "Výchozí"
 setting_default_matrilineal_marriages_desc: "Postavy ovládané AI budou sjednávat [Concept('matrilineal','matrilineární')|E] sňatky, pokud patří do hráčovy blízké rodiny, k [Concept('dynasty_prestige_level_4','vážené')|L] [Concept('dynasty','dynastii')|E], žijí v panství, kde platí [GetLaw('equal_law').GetName], nebo jsou mocnými [Concept('rulers','vládci')|E]. V panstvích, kde platí [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName], se standardně uzavírají matrilineární sňatky."
 setting_matrilineal_marriages_no_player_exception: "#high Výchozí (bez výjimky pro hráče)#!"
 setting_matrilineal_marriages_no_player_exception_desc: "Postavy ovládané AI budou sjednávat [Concept('matrilineal','matrilineární')|E] sňatky, pokud patří k [Concept('dynasty_prestige_level_4','vážené')|L] [Concept('dynasty','dynastii')|E], žijí v panství, kde platí [GetLaw('equal_law').GetName], nebo jsou mocnými [Concept('rulers','vládci')|E]. V panstvích, kde platí [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName], se standardně uzavírají matrilineární sňatky."
 setting_matrilineal_marriages_always: "#high Vždy#!"
 setting_matrilineal_marriages_always_desc: "Postavy ovládané AI budou chtít sjednávat [Concept('matrilineal','matrilineární')|E] sňatky pro všechny ženské členky [Concept('dynasty','dynastie')|E]. Stejně jako u pravidel #high $setting_default_matrilineal_marriages$#! se však mohou uzavírat i [Concept('patrilineal','patrilineární')|E] sňatky, pokud jsou považovány za dostatečně výhodné."
 setting_matrilineal_marriages_female_and_equal: "#high Nadvláda žen a rovnost#!"
 setting_matrilineal_marriages_female_and_equal_desc: "Postavy ovládané AI budou sjednávat [Concept('matrilineal','matrilineární')|E] sňatky pouze v panstvích, kde platí [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName] nebo [GetLaw('equal_law').GetName]. Stejně jako u pravidel #high $setting_default_matrilineal_marriages$#! se však mohou uzavírat i [Concept('patrilineal','patrilineární')|E] sňatky, pokud jsou považovány za dostatečně výhodné."
