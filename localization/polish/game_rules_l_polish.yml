 setting_historicity_ruler_of_munster_classic_murchad_desc: "Malému království Munster v roce 1066 vládne král Murchad, výchozí tutoriálová postava CK již od roku 2012."
 setting_historicity_ruler_of_munster_historical_toirdelbach: "#high Historický — Toirdelbach#!"
 setting_historicity_ruler_of_munster_historical_toirdelbach_desc: "Malému království Munster v roce 1066 vládne jeho historický panovník, král Toirdelbach. Pokud si jako hráčskou postavu vybereš Murchada, budeš hrát za Toirdelbacha."
 rule_historicity_norman_conquest: "Výsledek normanského dobytí Anglie"
 setting_historicity_norman_conquest_default_random: "Herní mechaniky"
 setting_historicity_norman_conquest_default_random_desc: "O výsledku boje o Anglii rozhodnou výhradně herní mechaniky."
 setting_historicity_norman_conquest_determined_harold: "#high Harold Godwin z Anglie#!"
 setting_historicity_norman_conquest_determined_harold_desc: "Boj o Anglii skončí vynuceným vítězstvím Harolda Godwina, mocichtivého válečníka sedícího na anglickém trůnu."
 setting_historicity_norman_conquest_determined_harald: "#high Haraldr Yngling z Norska#!"
 setting_historicity_norman_conquest_determined_harald_desc: "Boj o Anglii skončí vynuceným vítězstvím Haraldra Ynglinga, posledního vikinského krále, který se pokusil získat Anglii silou."
 setting_historicity_norman_conquest_determined_william: "#high Vilém Normandský#!"
 setting_historicity_norman_conquest_determined_william_desc: "Boj o Anglii skončí vynuceným vítězstvím Viléma Normandského, budoucího uchvatitele, jehož nárok se zčásti opírá o slib vynucený vydíráním."
 setting_historicity_norman_conquest_determined_edgar: "#high Eadgar z Wessexu#!"
 setting_historicity_norman_conquest_determined_edgar_desc: "Boj o Anglii skončí smrtí jeho účastníků a zvolením Eadgara Æthelinga, prasynovce a určeného dědice posledního krále."
 setting_historicity_norman_conquest_determined_margaret: "#high Markéta z Wessexu#!"
 setting_historicity_norman_conquest_determined_margaret_desc: "Boj o Anglii skončí smrtí jeho účastníků a šokujícím zvolením Markéty z Wessexu, praneteře posledního krále."
 setting_historicity_norman_conquest_determined_aelfwine: "#high Aelfwine Knytling#!"
 setting_historicity_norman_conquest_determined_aelfwine_desc: "Boj o Anglii skončí smrtí jeho účastníků a šokujícím zvolením Aelfwina Haraldsona, vnuka krále Knuta Velikého — navzdory jeho naprostému nezájmu."
 setting_historicity_norman_conquest_determined_svend: "#high Svend z Dánska#!"
 setting_historicity_norman_conquest_determined_svend_desc: "Boj o Anglii skončí smrtí jeho účastníků a šokujícím zvolením dánského krále Svenda, jehož rod již mnohokrát držel královskou korunu."
 setting_historicity_norman_conquest_determined_cadoc: "#high Cadoc z Cornwallu#!"
 setting_historicity_norman_conquest_determined_cadoc_desc: "Boj o Anglii skončí smrtí jeho účastníků a šokujícím zvolením hraběte Cadoca z Cornwallu, jehož dynastie se může pochlubit téměř tisíciletou nepřetržitou vládou na Britských ostrovech."
 rule_historicity_extra_admin_egypt: "Další [Concept('administrative','administrativní')|E] [Concept('realms','panství')|E] — Egypt"
 setting_historicity_extra_admin_egypt_gameplay_not_administrative: "Bez administrativní vlády"
 setting_historicity_extra_admin_egypt_gameplay_not_administrative_desc: "Egypt nebude mít při žádném datu zahájení hry [Concept('administrative','administrativní')|E] [Concept('government','vládu')|E], což odpovídá zamýšlenému hernímu průběhu."
 setting_historicity_extra_admin_egypt_historic_always: "#high Vždy administrativní#!"
 setting_historicity_extra_admin_egypt_historic_always_desc: "Egypt bude vždy začínat s [Concept('administrative','administrativní')|E] [Concept('government','vládou')|E], aby lépe odpovídal svému historickému uspořádání, přestože toto nastavení nemusí ve hře fungovat tak dobře."
