 setting_historicity_extra_admin_maghreb_historic_post_1066: "#high Administrativní od roku 1066#!"
 setting_historicity_extra_admin_maghreb_historic_post_1066_desc: "Maghreb bude v letech 1066 a 1178 začínat s [Concept('administrative','administrativní')|E] [Concept('government','vládou')|E], aby lépe odpovídal svému historickému uspořádání, přestože toto nastavení nemusí ve hře fungovat tak dobře."
