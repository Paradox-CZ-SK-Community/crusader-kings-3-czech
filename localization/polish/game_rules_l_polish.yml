 game_rule.1131.desc.conquest_finished.die_home: "Když ke mně dorazí zpráva, že jsme bitvu vyhráli, zaplaví mě radost! Srdce mi poskočí štěstím, zkroutí se, sevře, začne #EMP křečovitě bít#!, #BER řvát!#!\n\nCo se... to se mnou... děje... nemohu... #DIE1 dýchat... nemohu...#!"
