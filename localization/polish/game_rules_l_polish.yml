 setting_default_matrilineal_marriages_desc: "AI postavy budou dojednávat [Concept('matrilineal','matrilineární')|E] sňatky, pokud patří do blízké rodiny hráče, nebo do [dynasty_prestige_level_4|L] [Concept('dynasty','dynastie')|E], nebo do říše s [GetLaw('equal_law').GetName], nebo jsou silnými [Concept('rulers','vládci')|E]. Říše s [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName] mají standardně matrilineární pravidla." # todo: CONCEPT CASE
 setting_matrilineal_marriages_no_player_exception: "#high Default (no Player exception)#!"
 setting_matrilineal_marriages_no_player_exception_desc: "AI postavy budou dojednávat [Concept('matrilineal','matrilineární')|E] sňatky, pokud patří do [dynasty_prestige_level_4|L] [Concept('dynasty','dynastie')|E], nebo do říše s [GetLaw('equal_law').GetName], nebo jsou silnými [Concept('rulers','vládci')|E]. Říše s [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName] mají standardně matrilineární pravidla." # todo: CONCEPT CASE
 setting_matrilineal_marriages_always: "#high Always#!"
 setting_matrilineal_marriages_always_desc: "AI postavy budou chtít dojednávat [Concept('matrilineal','matrilineární')|E] sňatky pro všechny ženské členy [Concept('dynasty','dynastii')|E]. Stejně jako u pravidla #high $setting_default_matrilineal_marriages$#!, [Concept('patrilineal','patrilineární')|E] sňatky se stále uskuteční, pokud budou považovány za dostatečně výhodné." # todo: CONCEPT CASE
 setting_matrilineal_marriages_female_and_equal: "#high Female Dominated & Equal#!"
 setting_matrilineal_marriages_female_and_equal_desc: "AI postavy budou dojednávat [Concept('matrilineal','matrilineární')|E] sňatky pouze pokud jsou součástí říše s [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName] nebo s [GetLaw('equal_law').GetName]. Stejně jako u pravidla #high $setting_default_matrilineal_marriages$#!, [Concept('patrilineal','patrilineární')|E] sňatky se stále uskuteční, pokud budou považovány za dostatečně výhodné." # todo: CONCEPT CASE
 setting_matrilineal_marriages_never: "#high Never#!"
 setting_matrilineal_marriages_never_desc: "AI postavy nikdy nedohodnou [Concept('matrilineal','matrilineární')|E] sňatky, pokud nejsou součástí říše s [GetFaithDoctrine('doctrine_gender_female_dominated').GetBaseName]." # todo: CONCEPT CASE
