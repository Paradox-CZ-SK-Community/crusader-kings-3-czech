 game_rule.1101.desc.stamford_bridge: "u Stamford Bridge, na úzkém kamenném mostě sotva dost širokém, aby po něm mohl přejít vždy jen jeden člověk,"
 game_rule.1101.desc.hastings: "na návrší nedaleko Hastingsu,"
 game_rule.1101.desc.dover: "přímo na vrcholu slavných Bílých útesů u Doveru,"
 game_rule.1101.desc.isle_of_wight: "podél břehů řeky Medina na odlehlém ostrově Wight,"
 game_rule.1101.desc.forest_of_dean: "v temných hvozdech Deanovského lesa,"
 game_rule.1101.desc.london: "přímo před hradbami Londýna,"
 game_rule.1101.desc.winchester: "nedaleko Winchesteru, starého hlavního města Sasů,"
 game_rule.1101.desc.york: "nedaleko Yorku, římského pevnostního města Eboracum,"
 game_rule.1101.desc.lincoln: "nedaleko starobylého Lincolnu,"
 game_rule.1101.desc.oxford: "nedaleko tehdy ničím pozoruhodného Oxfordu,"
 game_rule.1101.desc.cirencester: "kolem hradeb starého Cirencesteru,"
 game_rule.1101.desc.guildford: "podél hřebene Hog's Back za Guildfordem,"
 game_rule.1101.desc.lindisfarne: "na pobřeží naproti ostrovnímu klášteru Lindisfarne, jednomu z nejposvátnějších míst Británie,"
 game_rule.1101.desc.lands_end: "u úpatí Land's End, téměř na samém okraji širého Atlantiku,"
 game_rule.1101.desc.stonehenge: "napříč širou Salisburskou plání ve stínu Stonehenge,"
 game_rule.1101.desc.southwark: "nedaleko ruin Londýnského mostu a přechodu ze Southwarku,"
 game_rule.1101.desc.scotland: "na nehostinné půdě sousedního Skotska,"
 game_rule.1101.desc.wales: "v kopcích a údolích Walesu,"
 game_rule.1101.desc.norway: "přímo v Norsku,"
 game_rule.1101.desc.normandy: "přímo v Normandii,"
 game_rule.1101.desc.france: "na francouzské půdě,"
 game_rule.1101.desc.riverside: "na úzkém kamenném mostě přes řeku v kraji zvaném [new_location.GetName],"
 game_rule.1101.desc.coastal: "podél pobřeží kraje zvaného [new_location.GetName],"
 game_rule.1101.desc.forest: "v lesích kraje zvaného [new_location.GetName],"
 game_rule.1101.desc.plains: "na pláních kraje zvaného [new_location.GetName],"
 game_rule.1101.desc.farmlands: "mezi úrodnými poli kraje zvaného [new_location.GetName],"
 game_rule.1101.desc.wetlands: "v páchnoucích močálech kraje zvaného [new_location.GetName],"
 game_rule.1101.desc.hills: "mezi zvlněnými kopci kraje zvaného [new_location.GetName],"
 game_rule.1101.desc.fallback: "na ničím pozoruhodném poli v kraji zvaném [new_location.GetName],"
 game_rule.1101.desc.combat.commander: "a já se ocitám přímo ve víru boje."
 game_rule.1101.desc.combat.not_present: "ačkoli u toho nemohu být osobně."
 game_rule.1101.desc.combat.locale.stamford_bridge: "Celé dopoledne se naše vojska přetlačují sem a tam přes most, zatímco menší oddíly se brodí přes Derwent, aby znovu a znovu sváděly boj s nepřítelem na protějším břehu.\n\nJsou to... jatka. Nic než křik a umírání, přerušované jen žuchnutím těl padajících do vody. Derwent teče rudý krví a jistě ještě míle po proudu. S mečem vztyčeným vysoko nad hlavou se vrhám do posledního útoku, abych prolomil patovou situaci, ženeme se s mou družinou přes most a —"
 game_rule.1101.desc.combat.locale.hastings: "Celý svět jako by hořel rachotem kovu o dřevo, tříštěním štítů, řičením koní a pravidelným #EMP svistem#! tisíců šípů klenoucích se oblohou.\n\nVšechno se smrsklo na křik, krev a cáry masa. Nářek raněných a umírajících, kletby těch, kdo touží po pomstě, šílený smích vítězů, které opojení bojem žene stále hlouběji do vřavy.\n\nOsud balancuje na ostří nože a s výkřikem #EMP KE MNĚ!#! ženu své vojáky vpřed."
 game_rule.1101.desc.combat.locale.dover: "Tak blízko nebezpečnému okraji obě vojska manévrují hlavně proto, aby soupeře srazila ze srázu — zatím bez valného úspěchu.\n\nPach krve zamořuje vzduch a řev bitvy se jistě nese na míle daleko nad moře. Nešťastný pozorovatel by možná dokonce zahlédl tu a tam postavu řítící se dolů po křídovém útesu.\n\nTakhle to nemůže pokračovat, takhle to #EMP nesmí#! pokračovat, jinak se navzájem vyčerpáme. S výkřikem ženu své vojáky vpřed, za vítězstvím, za —"
 game_rule.1101.desc.combat.locale.isle_of_wight: "Daleko od pevniny není kam utéct a obě vojska bojují se zoufalstvím těch, kteří vědí, že buď zvítězí, nebo zemřou. Koho nezaženou do přílivových vod Mediny, ten se stejně na tak malém ostrově dlouho neschová.\n\nNějak jsem se ocitl odříznutý od svých vojáků a bitevní vřavou se po mém boku prodírá jen hrstka strážců. Kdybych toho jen dokázal využít, kdybych dokázal průběh bitvy alespoň trochu zvrátit —"
 game_rule.1101.desc.combat.locale.forest_of_dean: "Pod divokými korunami těchto prastarých stromů, mezi houštinami a háji, zkrápí krev půdu snadněji než kde jinde a kvůli mizernému rozhledu nikdo nedokáže říct, jak se bitva vyvíjí.\n\nLes jako by pohlcoval zvuk i život a navzdory všemu běsnění a smrti šířícím se řadami propůjčuje našemu boji podivně tlumený ráz. Přesto mám pocit, že se snad karta obrací v náš prospěch —"
 game_rule.1101.desc.combat.locale.london: "Navzdory veškeré snaze obránců na hradbách přiklonit misky vah na jednu či druhou stranu se obě vojska dál melou v nekonečné patové situaci.\n\nVzduch páchne krví, řev umírajících i jejich vrahů přehlušuje vše ostatní a mračno prachu a potu znemožňuje poznat, kdo vítězí.\n\nPřesto nemohu své vojáky ponechat napospas tomuto #EMP chaosu#! a s výkřikem se znovu vrhám na nepřítele. Teď přišla naše chvíle, zvítězíme, zlomíme je, my —"
 game_rule.1101.desc.combat.locale.cirencester: "$game_rule.1101.desc.combat.locale.london$"
 game_rule.1101.desc.combat.locale.guildford: "Klikatý hřbet, jehož vrchol nedokáže zcela ovládnout ani jedno vojsko, je dějištěm velkolepé bitvy. Je dlouhý a úzký a obě strany se urputně snaží srazit protivníka z protějšího svahu, protože převaha výšky je pak jistě dovede k vítězství.\n\nJá však vím, že zvítězí #EMP moji#! vojáci, že právě #EMP mé#! síly okusí sladkost vítězství! Vpřed, #EMP vpřed, vy psi!#! Vpřed! Od vítězství nás dělí jediný mohutný nápor, jediný nápor a —"
 game_rule.1101.desc.combat.locale.lindisfarne: "Slaný příboj štípe do očí, krutý vítr vanoucí od Severního moře rve látku i štíty a nářek mrtvých a umírajících doléhá až k plačícím mnichům v klášteře, kteří nad jatkami před sebou bědují a rvou si roucha.\n\nPokud zde padnu, pak to tak [ROOT.Char.GetFaith.HighGodName] chce. Jenže [ROOT.Char.GetFaith.HighGodName] jistě stojí za mým právem na Anglii! Kupředu, vojáci, kupředu a přineste mi mou korunu! Bojujte ze všech sil, jinak—"
 game_rule.1101.desc.combat.locale.lands_end: "Skalnaté křoviny a nízké rozeklané útesy tu ustupují ledovému oceánu a členitý terén mění bitvu v naprostý chaos, spíš v množství drobných šarvátek než v jediný střet dvou souvislých linií.\n\nPřesto se k mému praporu stahují vojáci a já ze všech sil razím cestu do samého středu vřavy. Ke mně! #EMP Ke mně!#! Můj pokřik se rozléhá podél celé linie, znovu a znovu, dokud—"
 game_rule.1101.desc.combat.locale.stonehenge: "Teoreticky jsou tyto široké rovné pláně ideálním místem k vedení války. Místa je tu dost, aby se vojska mohla střetnout, a přece... na tom místě je něco veskrze #EMP zlověstného#!. Něco tu není v pořádku.\n\nBojujeme, umíráme a řveme svůj hněv k vysokým nebesům, ale něco ve vzduchu jako by naši zuřivost pohlcovalo stejně rychle, jako se v nás rodí. Přesto nesmím zpomalit, musím vést, musím—"
 game_rule.1101.desc.combat.locale.southwark: "S nejbohatším městem Anglie tak blízko je skutečně o co bojovat. Ať už jde o domovy či kořist, slávu či zbožnost, obě vojska se do sebe znovu a znovu zakusují.\n\nJižní břeh Temže pění naší krví, ale já se nevzdám, #EMP nevzdám#!.\n\nAnglie už je má, tato bitva to dokáže a stačí jediný poslední #EMP nápor#!, aby se to potvrdilo—"
 game_rule.1101.desc.combat.locale.riverside: "Když se vedle sebe sotva vejde půl tuctu vojáků, přestává být bitva otázkou obratné taktiky a mění se v brutální opotřebovávací boj. Tlačenice těl zároveň pomáhá i překáží těm, kdo se snaží odvléct raněné z první linie.\n\nPřesto stačí prorazit jejich řadu, rozehnat jejich vojsko a máme vyhráno! Nedbám na opatrnost, probojuji se až do samého čela, s mečem připraveným a—"
 game_rule.1101.desc.combat.random.present.1: "Naše vojska se vrhají jedno proti druhému a celý svět se smrskne na tříštící se štíty, skřípění kovu a umírající muže i koně.\n\nVálka bývá krutá, ale tohle už není válka, nýbrž obyčejná řezničina. Veteráni a žoldnéři na obou stranách bez milosti kosí mečem ječící čerstvé odvedence.\n\nNechci dopustit, aby tahle noční můra pokračovala, a tak se vrhám vpřed, má stráž těsně za mnou, a—"
 game_rule.1101.desc.combat.random.present.2: "Naše dvě vojska se střetávají a víří kolem sebe, obě strany hledají sebemenší slabinu. Podnikáme výpady, ustupujeme a vzápětí se na sebe znovu vrháme na jiném místě linie.\n\nZtráty jsou zatím malé, ale ve vzduchu visí tíseň. Všichni víme, že tento tanec nemůže trvat věčně a že skutečná bitva musí brzy začít.\n\nLépe ovládnout bojiště než se mu podřídit. Zvedám meč vysoko, vykřiknu „[ROOT.Char.GetFaith.WarGodName]!“ a vrhám se vpřed. [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] posílá za mnou do boje všechna svá vojska a—"
 game_rule.1101.desc.combat.random.present.3: "Denní světlo už pohasíná, promarněné hodinami vzájemného vraždění. Paže svírající meče těžknou únavou, mysl se kalí vyčerpáním a s klesajícím sluncem hrozí, že bitva skončí patem.\n\nNe.\n\nTo nedovolím. Skončí to tady a teď, mým vítězstvím. Dovedu to do konce, nebo ať mě [ROOT.Char.GetFaith.HighGodName] #EMP srazí k z—#!"
 game_rule.1101.desc.combat.random.absent.1: "Po většinu dne se naše vojska vrhají jedno proti druhému. Nejdřív umírají desítky, pak stovky a krvavý účet s každou další hodinou narůstá, zatímco vojáci pokládají životy za mou věc.\n\nJistě, jistě to všechno bude stát za to. Tolik smrti přece musí přinést nějakou odměnu, nějakou náhradu za životy, které byly s křikem a kopáním poslány do chladné náruče smrti, kde na ně čeká [ROOT.Char.GetFaith.DeathDeityName]."
 game_rule.1101.desc.combat.random.absent.2: "Boj je krutý. Rachot tříštících se štítů a skřeky umírajících rvou vzduch, veškerý řád mizí v chaosu půltuctu zmařených útoků a bitevních linií propletených jedna přes druhou.\n\nPřesto vojáci vytrvávají a bojují za mou věc. [ROOT.Char.GetTitleAsNameNoTooltip] má vrozená práva a výsady, které nesmějí být pošlapány, i kdyby je to mělo stát život."
 game_rule.1101.desc.combat.random.absent.3: "Životy jsou po stovkách koseny jako obilí srpem, nesčetné nitky osudu přetínají zachmuření nájemní zabijáci při své krvavé práci.\n\nJejich oběť bude jistě, #EMP jistě#! stát za to, jako nezbytný předpoklad mé nadcházející slávy. Každý z nich je dlažebním kamenem na cestě osudu, položeným ve službě jedinému cíli."
 game_rule.1101.desc.outro.present: "Myšlenky mě opouštějí a svět se mění v rozmazanou změť sekání a bodání. Moji družiníci se tisknou těsně kolem mě, zatímco drtíme vojsko, které vede [loser.GetTitledFirstName|l]. Před mým mečem se nepřítel dává na útěk."
 game_rule.1101.desc.outro.absent: "Konečně se nepřátelská linie hroutí a vojsko, které vede [loser.GetTitledFirstName|l], je rozprášeno. Dnes vítězí [winner.GetTitledFirstNameNicknamedNoTooltip|l]!"
 game_rule.1101.a: "V Anglii už Vikingové vládnout nebudou!"
 game_rule.1102.desc.outro.alive: "Nakonec je však všechno marné. Mé vojsko se láme, nepřítel se valí do vzniklé mezery a s jeho zkázou se v prach obracejí i všechny mé ambice."
 game_rule.1102.desc.outro.dead: "Hruď mi zaplaví bolest. Ne, ne, #BER ne#!, kdo mohl... odkud... svět se pode mnou podivně zhoupne a já padám k zemi, zatímco z rány vykvétá krev. Pomalu si mě bere smrt."
 game_rule.1102.a: "Jak se to mohlo stát?!"
 game_rule.1102.b: "Jsem... #DIE1 ztra...#! #DIE2 cen...#!"
 game_rule.1103.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1103.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1103.a: "Vítězství nad tím bastardím uchvatitelem!"
 game_rule.1104.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1104.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1104.a: "Ale... Vyznavač mi přece slíbil Anglii!"
 game_rule.1104.b: "Ať ti vláda přinese... #DIE1 jen...#! #DIE2 utrpení...#!"
 game_rule.1111.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1111.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1111.a: "Další vítězství hodné ság!"
 game_rule.1112.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1112.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1112.a: "Ne, ne, ne, NE, #BER NE#!"
 game_rule.1112.b: "Proklínám... #DIE1 tě...#! #DIE2 Tostigu...#!"
 game_rule.1113.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1113.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1113.a: "[Select_CString(loser.IsFemale,'Nebyla pravou dcerou Severu','Nebyl pravým synem Severu')]!"
 game_rule.1114.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1114.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1114.a: "Vždyť [winner.GetTitledFirstName|l] ani nemá nárok, zatraceně!"
 game_rule.1114.b: "Proklínám... #DIE1 tě#!... #DIE2 Haralde...#!"
 game_rule.1121.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1121.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1121.a: "Vrať se tam, kam patříš, uchvatiteli."
 game_rule.1122.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1122.desc.outro.dead: "Něco zasviští z oblohy a zdá se, že to nezadržitelně míří přímo do mého oka."
 game_rule.1122.a: "Proklatý zlodějský bastard!"
 game_rule.1122.b: "Šípy! Štíty vzhůru, přilétá salva! Salva přilé—"
 game_rule.1123.desc.outro.present: "$game_rule.1101.desc.outro.present$"
 game_rule.1123.desc.outro.absent: "$game_rule.1101.desc.outro.absent$"
 game_rule.1123.a: "Zpátky do mrazu, vy severští psi!"
 game_rule.1124.desc.outro.alive: "$game_rule.1102.desc.outro.alive$"
 game_rule.1124.desc.outro.dead: "$game_rule.1102.desc.outro.dead$"
 game_rule.1124.a: "Mé sny se obrátily v popel..."
 game_rule.1124.b: "Ha, ta největší #DIE1 výprava#! mě teprve #DIE2 čeká...#!"
