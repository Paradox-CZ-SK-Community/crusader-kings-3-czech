 rule_regional_heresy: "Regionální kacířství"
 setting_default_regional_heresy: "Výchozí"
 setting_default_regional_heresy_desc: "Vypuknutí [Concept('heresies','kacířství')|E] v určitých regionech budou s větší pravděpodobností odpovídat historickým kacířstvím, například lollardství v Anglii."
