 setting_historicity_extra_admin_tamilakam_gameplay_not_administrative_desc: "Čólové nebudou mít při žádném datu zahájení hry [Concept('administrative','administrativní')|E] [Concept('government','vládu')|E], což odpovídá zamýšlenému hernímu průběhu."
 setting_historicity_extra_admin_tamilakam_historic_1066: "#high Administrativní v roce 1066#!"
 setting_historicity_extra_admin_tamilakam_historic_1066_desc: "Čólové budou v roce 1066 začínat s [Concept('administrative','administrativní')|E] [Concept('government','vládou')|E], aby lépe odpovídali svému historickému uspořádání, přestože toto nastavení nemusí ve hře fungovat tak dobře."
