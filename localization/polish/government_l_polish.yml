 unity_search_for_administrators_decision.msg.desc: "K tvému dvoru dorazil nový správce jménem [new_administrator.GetName] a je připraven nastoupit do služby."
 unity_send_bailiffs_decision: "Vyslat rychtáře"
 unity_send_bailiffs_decision_desc: "Mohu využít ochoty členů svého rodu ke spolupráci a vyslat k nim své rychtáře, aby prosadili mé příkazy a pomohli udržet v panství pořádek."
 unity_send_bailiffs_decision_tooltip: "Spolupracuj se členy svého rodu na zvýšení kontroly v panství"
 unity_send_bailiffs_decision_confirm: "Vyslat rychtáře"
 unity_placate_vassals_decision: "Uklidnit vazaly"
 unity_placate_vassals_decision_desc: "I soudržný rod prochází těžkými zkouškami. Když využiji svého vlivu jako hlava rodu, mohu zahladit drobné spory dříve, než přerostou v hluboké rozkoly."
 unity_placate_vassals_decision_tooltip: "Připomeň členům svého rodu svou autoritu jejich lenního pána"
 unity_placate_vassals_decision_confirm: "Uklidnit vazaly"
 unity_organize_house_for_war_decision: "Připravit rod na válku"
 unity_organize_house_for_war_decision_desc: "Rozvoj panství vyžaduje odhodlání a často také rozsáhlé výboje. Vydáváním konkrétních nařízení a vedením členů našeho rodu je mohu přimět, aby ochotněji vedli války a dobývali nové země."
 unity_organize_house_for_war_decision_tooltip: "Veď členy svého rodu k častějšímu vedení válek"
 unity_organize_house_for_war_decision_confirm: "Podpořit válku a výboje!"
 unity_encourage_house_economy_decision: "Podpořit hospodářství rodu"
 unity_encourage_house_economy_decision_desc: "Panství je jen tak silné jako země, na níž stojí. Musím zajistit, aby všichni členové rodu mohli vynakládat potřebné prostředky na budování silnějšího panství."
 unity_encourage_house_economy_decision_tooltip: "Veď členy svého rodu k tomu, aby se zaměřili na hospodářství"
 unity_encourage_house_economy_decision_confirm: "Podpořit silnější hospodářství!"
 unity_promote_development_decision: "Podpořit rozvoj"
 unity_promote_development_decision_desc: "Naše kultura má dlouhou tradici vynikající správy. V našem rodě působí mnoho schopných správců a dozorců. Můžeme jejich schopností využít a dále rozvíjet panství."
 unity_promote_development_decision_tooltip: "Pobídni členy svého rodu, aby rozvíjeli a zvelebovali panství"
 unity_promote_development_decision_confirm: "Podpořit rozvoj"
 unity_improve_logistics_decision: "Vyžadovat společné zásobování vojska"
 unity_improve_logistics_decision_desc: "O válkách rozhoduje bezpočet různých faktorů. Dobrá logistika a zásobování jsou stejně důležité jako schopní vojáci. Mohu v našem rodě prosadit nová pravidla a požadovat, aby všichni sdíleli zásoby a výstroj, čímž výrazně zvýšíme schopnosti našeho vojska."
 unity_improve_logistics_decision_tooltip: "Požaduj po členech svého rodu, aby sdíleli zásoby a logistické zázemí pro potřeby vojska"
 unity_improve_logistics_decision_confirm: "Vyžadovat společné zásobování"
 unity_steer_house_direction_decision: "Usměrnit jednotu rodu"
 unity_steer_house_direction_decision_desc: "Jako hlava rodu mám mezi jeho členy značnou váhu. Pečlivě volenými slovy a činy mohu své příbuzné pobízet k určitému jednání a výrazně tak ovlivnit naši společnou jednotu."
