 unity_establish_network_decision: "Vybudovat síť intrik"
 unity_establish_network_decision_desc: "Každý člen mého rodu je svým způsobem prohnaný. Pod mým vedením můžeme utkat síť intrik, do které se chytí i ti nejmazanější vetřelci."
