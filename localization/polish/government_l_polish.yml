 msg_tributary_capital_province_development_growth_title: "Úspěšná obchodní mise"
 msg_tributary_capital_province_development_growth_desc: "Čilý obchod s císařskými trhy v [GetTitleByKey('h_china').GetDefinitiveName] zvýšil [Concept('development','rozvoj')|E] v oblasti [ROOT.Char.GetCapitalLocation.GetName]."
