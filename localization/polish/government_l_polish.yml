 investiture_trade_yes_desc: "#emphasis #bold Výsady pro [tributary|E]:#!#!\n$EFFECT_LIST_BULLET$ Roční [Concept('development_growth','růst rozvoje')|E] (až do [EmptyScope.ScriptValue('celestial_investiture_trade_bonus_max')|v0]) v [tributary_possessive|E] [Concept('capital','hlavním sídle')|E] [Concept('province','provincii')|E]\n\n#flavor Přístup k rušným trhům [GetTitleByKey('h_china').GetDefinitiveNamePossessive] prospívá blahobytu jejich privilegovaných [tributaries|E]. Efekt se zvyšuje s rozdílem v [Concept('development','rozvoji')|E] mezi hlavními sídly a množstvím [Concept('imperial_grace','císařskou přízní')|E], které si privilegovaný $game_concept_tributary$ nashromáždil.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
