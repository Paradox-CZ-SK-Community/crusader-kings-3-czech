 special_contract_scutage: "Smlouva o štítném"
 special_contract_scutage_desc: "#flavor Pokud se na [Concept('vassal','vazala')|E] vztahuje $special_contract_scutage|l$, odvádí o #high [EmptyScope.ScriptValue('scutage_contract_tax_tooltip')|0]%#! více [Concept('tax','daně')|E], než stanovuje jeho [Concept('obligation','povinnost')|E] „$feudal_government_taxes$“, a zároveň poskytuje o #high [EmptyScope.ScriptValue('scutage_contract_levies_tooltip')|0]%#! méně [Concept('levies','odvedenců')|E], než stanovuje jeho [Concept('obligation','povinnost')|E] „$feudal_government_levies$“.#!"
 special_contract_march: "Markraběcí smlouva"
 special_contract_march_desc: "#flavor Pokud se na [Concept('vassal','vazala')|E] vztahuje $special_contract_march|l$, získává bonusy k odvedencům a obranným schopnostem, ale odvádí o #high [EmptyScope.ScriptValue('march_contract_taxes_tooltip')|0]%#! méně [Concept('tax','daně')|E], než stanovuje jeho [Concept('obligation','povinnost')|E] „$feudal_government_taxes$“.#!"
 special_contract_march_border_trigger: "[vassal.GetName] nesousedí s cizím [Concept('realm','panstvím')|E]"
 special_contract_palatinate: "Palatinátní smlouva"
 special_contract_palatinate_desc: "#flavor Pokud se na [Concept('vassal','vazala')|E] vztahuje $special_contract_palatinate|l$, požívá v panství mnoha výsad, které posilují jeho postavení a politický vliv. [Concept('vassals','Vazalové')|E] se statusem „$special_contract_palatinate_short$“ zvyšují [Concept('prestige','prestiž')|E] svého [Concept('liege','lenního pána')|E], ale odvádějí o #high [EmptyScope.ScriptValue('palatinate_contract_taxes_tooltip')|0]%#! méně [Concept('tax','daně')|E] a [Concept('levies','odvedenců')|E], než stanovují jejich [Concept('obligations','povinnosti')|E] „$feudal_government_taxes$“ a „$feudal_government_levies$“.#!"
 special_contract_castellan: "Kastelánská smlouva"
 special_contract_castellan_desc: "#flavor Pokud se na [Concept('vassal','vazala')|E] vztahuje $special_contract_castellan|l$, získává bonusy k odvedencům a obranným schopnostem. Odvádí o #high [EmptyScope.ScriptValue('march_contract_taxes_tooltip')|0]%#! méně [Concept('tax','daně')|E], ale poskytuje o #high [EmptyScope.ScriptValue('castellan_contract_levies_tooltip')|0]%#! více [Concept('levy','odvedenců')|E], než stanovuje jeho [Concept('obligation','povinnost')|E] „$feudal_government_taxes$“.#!"
