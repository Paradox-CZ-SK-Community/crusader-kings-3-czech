 religious_rights: "Náboženská práva"
 religious_rights_none: "Bez náboženské ochrany"
 religious_rights_none_short: "Nechráněno"
 religious_rights_protected: "Náboženská ochrana"
 religious_rights_protected_desc: "#emphasis #bold Výsady [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ [Concept('liege','Lenní pán')|E] nemůže po [Concept('vassal','vazalovi')|E] [Concept('demand_conversion','požadovat konverzi')|E]\n[Concept('liege','Lenní pán')|E] nemůže na území [Concept('vassals','vazalů')|E] použít [Concept('convert_county','konverzi hrabství')|E]\n$EFFECT_LIST_BULLET$ [Concept('liege','Lenní pán')|E] nemůže při odebírání titulů využít [Concept('faith','víru')|E] jako důvod, aby se vyhnul [Concept('tyranny','tyranii')|E]\n\n#flavor [Concept('vassal','Vazal')|E] získává zvláštní chráněné postavení a panství oficiálně uznává jeho právo vyznávat vlastní [Concept('faith','víru')|E].#!"
 religious_rights_protected_short: "Chráněno"
 fortification_rights: "Právo na opevnění"
 fortification_rights_none: "Bez práva na opevnění"
 fortification_rights_none_short: "Žádné"
 fortification_rights_granted: "$fortification_rights$ uděleno"
 fortification_rights_granted_desc: "#flavor Vazal získává právo stavět nové hrady a opevnění s podporou svého lenního pána. Tato podpora v praxi znamená, že vazal odvádí o #high [EmptyScope.ScriptValue('fortification_rights_contract_taxes_tooltip')|0]%#! méně daní, než stanovuje jeho povinnost „$feudal_government_taxes$“.#!"
 fortification_rights_granted_short: "Uděleno"
 succession_rights: "Nástupnická práva"
 succession_rights_default: "Výchozí $succession_rights|l$"
 succession_rights_default_short: "Výchozí"
 succession_rights_forced_partition: "Vynucené dělení"
 succession_rights_forced_partition_desc: "#emphasis #bold Omezení [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ [Concept('vassal','Vazal')|E] nemůže mít jiný [Concept('succession_law','zákon nástupnictví')|E] než Dělení\n$EFFECT_LIST_BULLET$ [Concept('vassal','Vazal')|E] změní svůj [Concept('succession_law','zákon nástupnictví')|E] na Dělení\n$EFFECT_LIST_BULLET$ [Concept('vassal','Vazal')|E] platí při změně [Concept('laws','zákonů')|E] o #high [EmptyScope.ScriptValue('succession_rights_contract_law_cost_tooltip')|0]%#! více [Concept('prestige','prestiže')|E]\n\n#flavor [Concept('vassal','Vazal')|E] je nucen zachovávat ve svém [Concept('realm','panství')|E] výhradně nástupnictví formou Dělení. S tím spojená administrativní zátěž navíc zvyšuje náklady vazala na změnu zákonů o #high [EmptyScope.ScriptValue('succession_rights_contract_law_cost_tooltip')|0]%.#!#!"
 succession_rights_forced_partition_short: "Vynucené dělení"
 coinage_rights: "Mincovní právo"
 coinage_rights_none: "Bez mincovního práva"
 coinage_rights_none_short: "Žádné"
 coinage_rights_granted: "$coinage_rights$ uděleno"
 coinage_rights_granted_desc: "#flavor Vazal získává právo razit a používat nové mince, čímž posiluje svůj [Concept('development','rozvoj')|E] na úkor rozvoje svého lenního pána.#!"
 coinage_rights_granted_short: "Uděleno"
 war_declaration_rights: "Vyhlašování válek"
 war_declaration_rights_default: "Výchozí $war_declaration_rights|l$"
 war_declaration_rights_default_short: "Výchozí"
 war_declaration_rights_allowed: "Povolené $war_declaration_rights|l$"
 war_declaration_rights_allowed_desc: "#emphasis #bold Výsady [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ [Concept('vassal','Vazal')|E] může vyhlásit [Concept('war','válku')|E] bez ohledu na [Concept('crown_authority','korunní autoritu')|E] svého [Concept('liege','lenního pána')|E]\n$EFFECT_LIST_BULLET$ [Concept('vassal','Vazal')|E] platí za [Concept('casus_bellis','casus belli')|E] uvnitř [Concept('realm','panství')|E] o #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! méně\n\n#flavor Vazal nemusí použít páku, pokud mu korunní autorita jeho lenního pána brání vést válku. Toto zvláštní zacházení mu rovněž usnadňuje vyhlašování válek uvnitř [Concept('realm','panství')|E] a snižuje jejich cenu o #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!"
 war_declaration_rights_allowed_short: "Povoleno"
 council_rights: "Místo v radě"
 council_rights_none: "Bez práv v radě"
 council_rights_none_desc: "#flavor Vazal nemá v radě žádné mimořádné výsady.#!"
 council_rights_none_short: "Žádná"
 council_rights_guaranteed: "Zaručené místo v radě"
 council_rights_guaranteed_desc: "#emphasis #bold Výsada [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ [Concept('interaction','Interakci')|E] #high $force_onto_council$#! lze použít kdykoli\n\n#flavor Vazal získává výsadní postavení v radě a očekává, že v ní bude mít trvalé místo. Pokud tuto výsadu udělíš příliš mnoha vazalům, mocní vazalové v [Concept('realm','panství')|E] to nakonec ponesou nelibě.#!"
 council_rights_guaranteed_short: "Zaručeno"
 title_revocation_rights: "Odebírání titulů"
 title_revocation_rights_default: "Běžné odebírání titulů"
 title_revocation_rights_default_short: "Běžné"
 title_revocation_rights_protected: "Ochrana před odebráním titulů"
 title_revocation_rights_protected_desc: "#emphasis #bold Výsada [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ [Concept('liege','Lenní pán')|E] nemůže [Concept('vassal','vazalovi')|E] odebrat [Concept('titles','tituly')|E]\n\n#flavor Vazal má držení svých titulů zaručeno, takže mu je [Concept('liege','lenní pán')|E] nemůže odebrat bez ohledu na to, zda k tomu má oprávněný důvod, či nikoli.#!"
