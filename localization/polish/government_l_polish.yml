 unity_establish_futuwaa_lodges_decision: "Založit domy futuwwy"
 unity_establish_futuwaa_lodges_decision_desc_intro: "Mládež, konkrétně"
 unity_establish_futuwaa_lodges_decision_desc_outro: ", se bez smysluplné náplně potuluje ulicemi hlavního sídla. [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] se tak plní provizorními tlupami mladých. Mohu místo toho po hlavním sídle založit domy #italic futuwwy#!, kde by mládež ve volném čase rozvíjela válečnické schopnosti a mravnost."
 unity_establish_futuwaa_lodges_decision.tt_intro: "Všichni mladí nesezdaní lidé"
 unity_establish_futuwaa_lodges_decision.tt_outro: "žijící v tvém [Concept('capital','hlavním městě')|E] mají po následujících 20 let šanci zlepšit své [Concept('skills','dovednosti')|E], konkrétně [Concept('martial','válečnictví')|E] a [Concept('prowess','udatnost')|E], a získat [Concept('virtuous','ctnostný')|E] [Concept('trait','rys')|E]"
