 investiture_marriage_yes_desc: "#emphasis #bold Výsady pro [tributary|E]:#!#!\n$EFFECT_LIST_BULLET$ Zvýšené [Concept('marriage','sňatky')|E] Přijetí s [GetTitleByKey('h_china').GetDefinitiveNamePossessive] vládnoucí [Concept('dynasty','dynastií')|E]\n$EFFECT_LIST_BULLET$ Zrušeny tresty k přijetí [Concept('marriage','sňatku')|E] vyplývající z #BOLD $tradition_cultural_primacy_name$#!\n\n#flavor Císařská rodina [GetTitleByKey('h_china').GetDefinitiveName] je často pro cizince neproniknutelná. Formální pozvání do rodiny poskytuje bonus k Přijetí úměrný [Concept('imperial_grace','císařská přízeň')|E] a odstraňuje obvyklé tresty, které se vztahují na cizince.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
