 default_tax_collector: "Základní daně"
 default_tax_collector_desc: "Platí základní [Concept('obligations','povinnosti')|E]; jejich výše se odvíjí od [Concept('aptitude','způsobilosti')|E] osoby pověřené výběrem daní ([Concept('tax_collector','výběrčí daní')|E])"
 default_tax_collector_flavor_desc: "Běžná daň. Poplatníci odvádějí přesně tolik, kolik se od nich očekává."
 jizya_special_rights_tax_collector: "Status džizji"
 jizya_special_rights_tax_collector_desc: "#emphasis #bold Výsady [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ [Concept('liege','Lenní pán')|E] nemůže po [Concept('vassal','vazalovi')|E] [Concept('demand_conversion','požadovat konverzi')|E]\n[Concept('liege','Lenní pán')|E] nemůže na území [Concept('vassals','vazalů')|E] použít [Concept('convert_county','konverzi hrabství')|E]\n$EFFECT_LIST_BULLET$ [Concept('liege','Lenní pán')|E] nemůže při odebírání titulů použít [Concept('faith','víru')|E] jako důvod k tomu, aby se vyhnul [Concept('tyranny','tyranii')|E]\n$EFFECT_LIST_BULLET$ [Concept('liege','Lenní pán')|E] nemůže odebrat [Concept('vassals_possessive','vazalovy')|E] [Concept('titles','tituly')|E]\n\n#flavor [Concept('vassal','Vazal')|E] má držení svých [Concept('titles','titulů')|E] zaručeno, takže mu je [Concept('liege','lenní pán')|E] nemůže odebrat bez ohledu na to, zda $game_concept_liege|l$ má [Concept('revoke_title_reason','důvod k odebrání titulu')|E], či nikoli.\n\n$game_concept_vassal$ také získává zvláštní chráněné postavení a panství oficiálně uznává jeho právo vyznávat vlastní [Concept('faith','víru')|E].#!"
 jizya_special_rights_tax_collector_flavor_desc: "Džizja je zvláštní daň ukládaná #italic dhimmí#!, tedy náboženským menšinám, výměnou za právo pokojně vyznávat svou pomýlenou víru."
