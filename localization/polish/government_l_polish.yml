 unity_search_for_administrators_decision.msg.desc: "Nový administrátor jménem [new_administrator.GetName] dorazil na váš dvůr a je připraven k zaměstnání."
 unity_send_bailiffs_decision: "Poslat úředníky"
 unity_send_bailiffs_decision_desc: "Mohu využít spolupracujícího postoje členů svého rodu tím, že k nim pošlu své úředníky, aby vynucovali mé rozkazy a udržovali pořádek v celé říši."
 unity_send_bailiffs_decision_tooltip: "Spolupracujte s členy svého rodu, aby se zvýšila kontrola v říši"
 unity_send_bailiffs_decision_confirm: "Poslat pro úředníky"
 unity_placate_vassals_decision: "Uklidnit vazaly"
 unity_placate_vassals_decision_desc: "I harmonický dvůr čelí zkouškám. Využitím svého vlivu jako hlavy rodu mohu uhladit tyto společenské šrámy dříve, než se promění v trhliny."
 unity_placate_vassals_decision_tooltip: "Připomeňte členům svého rodu svou autoritu jako jejich vrchnosti"
 unity_placate_vassals_decision_confirm: "Uklidnit vazaly"
 unity_organize_house_for_war_decision: "Organizovat členy rodu k válce"
 unity_organize_house_for_war_decision_desc: "Zlepšení říše vyžaduje oddanost a často také spoustu dobyvačných válek. Vydáváním konkrétních ediktů a vedením členů rodu je mohu přimět k větší ochotě vést války a dobývat nová území."
 unity_organize_house_for_war_decision_tooltip: "Nasměrujte členy svého rodu k častějším válečným tažením"
 unity_organize_house_for_war_decision_confirm: "Podporovat válku a konflikty!"
 unity_encourage_house_economy_decision: "Povzbuďte rod ke zlepšení ekonomiky"
 unity_encourage_house_economy_decision_desc: "Říše je tak schopná, jak schopná je země, na které je postavena. Musím zajistit, aby všichni členové rodu měli možnost utrácet potřebné prostředky na vybudování silnější říše."
 unity_encourage_house_economy_decision_tooltip: "Nasměrujte členy svého rodu, aby se soustředili na ekonomiku"
 unity_encourage_house_economy_decision_confirm: "Podpořit silnější ekonomiku!"
 unity_promote_development_decision: "Podpořit rozvoj"
 unity_promote_development_decision_desc: "Naše kultura má dlouhou historii vynikajících administrativních schopností. V našem rodu působí mnoho zdatných dozorců a správců. Můžeme toho využít ve svůj prospěch a dále rozvíjet říši."
 unity_promote_development_decision_tooltip: "Podporujte členy svého rodu, aby rozvíjeli a zlepšovali říši"
 unity_promote_development_decision_confirm: "Podporovat rozvoj"
 unity_improve_logistics_decision: "Požadovat sdílenou vojenskou logistiku"
 unity_improve_logistics_decision_desc: "Války rozhoduje mnoho různých faktorů. Dobrá logistika a zásoby jsou stejně důležité jako schopní vojáci. Mohu v rámci rodu prosadit nové politiky a požadovat, aby všichni sdíleli zásoby a vybavení, čímž výrazně zvýšíme schopnosti armády."
 unity_improve_logistics_decision_tooltip: "Vyžadujte od členů svého rodu sdílení logistiky a zásob, aby lépe vyhovovaly potřebám armády"
 unity_improve_logistics_decision_confirm: "Požadovat sdílenou logistiku"
