 unity_improve_taxation_decision: "Zlepšit zdanění"
 unity_improve_taxation_decision_desc: "Můj rod má mnoho členů, kteří jsou efektivní ve vybírání daní a správě říše. Sdílením nápadů a schopných lidí můžeme všichni profitovat z vyšších příjmů."
 unity_improve_taxation_decision_tooltip: "Spolupracujte s členy svého rodu na zlepšení výběru daní a příjmů říše"
 unity_improve_taxation_decision_confirm: "Uspořádáme schůzku"
 unity_search_for_administrators_decision: "Hledat výběrčí daní"
 unity_search_for_administrators_decision_desc: "Daně jsou páteří každé říše. Stojí za to věnovat čas hledání schopných správců a bývalých vojáků, které zaměstnáme jako výběrčí daní."
