 unity_consult_house_decision: "Poradit se s členy rodu"
 unity_consult_house_decision_desc: "Jednotná rada dokáže jednat rychle a rozhodně. Stačí několik společných porad a mohu zajistit, aby členové mého rodu plnili své povinnosti rádců účinněji."
 unity_consult_house_decision.tt_house_council_bonus: "Základní postup a vliv [Concept('skill','dovednosti')|E] na [Concept('councillor_tasks','úkoly rádce')|E] se u členů [Concept('house','rodu')|E] působících v tvé [Concept('council','radě')|E] zvyšují o #P +10%#!"
