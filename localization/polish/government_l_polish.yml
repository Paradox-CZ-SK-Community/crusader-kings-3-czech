 unity_educate_youth_in_madrasas_decision.t_houses_of_worship: "[ROOT.Char.GetFaith.HouseOfWorshipPlural|U]"
 unity_educate_youth_in_madrasas_decision_desc_intro: "Mír v panství zanechal mládež, konkrétně"
 unity_educate_youth_in_madrasas_decision_desc_outro: ", bez činnosti a cíle. [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] se tak potýká s nečinností mladých. Mohu místo toho zřídit školy, jejichž zázemím by byly [ROOT.Char.GetFaith.HouseOfWorshipPlural], a mládež by se tam ve volném čase učila filozofii a lékařství."
 unity_educate_youth_in_madrasas_decision.tt_intro: "Všichni mladí lidé"
