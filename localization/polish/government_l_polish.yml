 investiture_marriage_yes: "Přijetí do císařské rodiny"
 investiture_marriage_yes_desc: "#emphasis #bold Výsady [Concept('tributary','tributáře')|E]:#!#!\n$EFFECT_LIST_BULLET$ Vyšší přijetí [Concept('marriage','sňatku')|E] u vládnoucí [Concept('dynasty','dynastie')|E] [GetTitleByKey('h_china').GetDefinitiveNamePossessive]\n$EFFECT_LIST_BULLET$ Ruší postihy k přijetí [Concept('marriage','sňatku')|E] způsobené #BOLD $tradition_cultural_primacy_name$#!\n\n#flavor Císařská rodina [GetTitleByKey('h_china').GetDefinitiveName] bývá pro cizince téměř nedostupná. Formální přijetí do rodiny poskytuje bonus k přijetí sňatku úměrný [Concept('imperial_grace','císařské přízni')|E] a odstraňuje obvyklé postihy vztahující se na cizince.#!"
