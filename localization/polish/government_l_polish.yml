 unity_steer_house_direction_decision_desc: "Jako hlava rodu má má slova velkou váhu mezi členy rodu. Pečlivými slovy a činy mohu nenápadně přimět své spolurodiny k určitému chování, což výrazně ovlivní naši společnou jednotu."
