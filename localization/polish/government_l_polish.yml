 iqta_special_rights_tax_collector_desc: "[Concept('vassal','Vazal')|E] má nižší povinnosti, ale pomáhá přispívat [Concept('men_at_arms','ozbrojenci')|E] pro [Concept('liege','lenního pána')|E]." # todo: CONCEPT CASE
 iqta_special_rights_tax_collector_flavor_desc: "Iqta je systém daňového farmářství, kde jsou místním magnátům uděleny široké pravomoci vybírat daně v zastoupení státu."
 ghazi_special_rights_tax_collector: "Status gházi"
 ghazi_special_rights_tax_collector_desc: "#emphasis #bold [Concept('vassal','Vazal')|E] Právo:#!#!\n$EFFECT_LIST_BULLET$ [Concept('vassal','Vazal')|E] platí méně [Concept('piety','zbožnost')|E] za použití [Concept('holy_war','svatou válku')|E] [Concept('casus_bellis','casus belli')|E], ale více [prestige_i][Concept('prestige','prestiž')|E] za jakýkoli jiný [Concept('casus_bellis','casus belli')|E]\n$EFFECT_LIST_BULLET$ Umožňuje [Concept('raiding','plenění')|E]\n\n#flavor [Concept('vassal','Vazal')|E] je vybrán [Concept('liege','lenní pán')|E] jako válečník [Concept('faith','víra')|E], pověřen rozšiřováním hranic skrze [Concept('holy_war','svatou válku')|E].#!" # todo: CONCEPT CASE
 ghazi_special_rights_tax_collector_flavor_desc: "Bojovníci víry a pohraničí, gházi vybírají příjmy z kořisti a zbojstva a vedou nekonečnou válku proti náboženským nepřátelům státu."
 deqhan_special_rights_tax_collector: "Dehqan"
 deqhan_special_rights_tax_collector_flavor_desc: "Perské magnáty v rámci starobylého, decentralizovaného systému výběru daní; dehqani pečlivě spravují svá území, aby podporovali produktivitu – a vlastní prestiž."
 maguh_special_rights_tax_collector: "Status maguh"
 maguh_special_rights_tax_collector_flavor_desc: "Starý sásánovský způsob okresní správy; maguh podporují místní rozvoj výměnou za snížené daně státu."
 muqata_special_rights_tax_collector: "Status muqata"
 muqata_special_rights_tax_collector_flavor_desc: "Muqata je daňový systém, kde jsou vzdáleným oblastem dána větší autonomie a nižší daně, aby se podpořila stabilita a dlouhodobý rozvoj."
 strict_taxation_tax_collector: "Zakat"
 strict_taxation_tax_collector_flavor_desc: "Zakat je daň z bohatství, obvykle uvalená na majetné jako prostředek k získání dodatečných příjmů pro stát a k pomoci potřebným."
