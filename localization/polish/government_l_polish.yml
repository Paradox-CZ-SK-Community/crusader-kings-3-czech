 unity_reinforce_army_decision: "Posílit armádu věrnými důstojníky"
 unity_reinforce_army_decision_desc: "Armáda je jen tak silná jako důstojníci, kteří ji vedou. Když požádám členy svého rodu o schopné vojáky, získám zkušené muže, které mohu povýšit do velitelských funkcí a posílit tak bojeschopnost svého vojska. Každý člen přispívá k dobru našeho rodu a prospěch z toho máme všichni!"
