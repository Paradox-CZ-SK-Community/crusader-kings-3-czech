 investiture_trade_yes_desc: "#emphasis #bold Výsady [Concept('tributary','tributáře')|E]:#!#!\n$EFFECT_LIST_BULLET$ Každoroční [Concept('development_growth','růst rozvoje')|E] (až [EmptyScope.ScriptValue('celestial_investiture_trade_bonus_max')|v0]) v [Concept('province','provincii')|E] [Concept('capital','hlavního sídla')|E] [Concept('tributary_possessive','tributáře')|E]\n\n#flavor Přístup k rušným trhům [GetTitleByKey('h_china').GetDefinitiveNamePossessive] prospívá blahobytu privilegovaných [Concept('tributaries','tributářů')|E]. Účinek roste s rozdílem v [Concept('development','rozvoji')|E] mezi $game_concept_capitals|l$ a s množstvím [Concept('imperial_grace','císařské přízně')|E], které privilegovaný $game_concept_tributary|l$ nashromáždil.#!"
