 unity_establish_network_decision_confirm: "Rozeslat a spálit výnos"
 unity_improve_taxation_decision: "Zlepšit výběr daní"
 unity_improve_taxation_decision_desc: "V mém rodě je mnoho lidí, kteří se vyznají ve výběru daní a správě panství. Když se podělíme o zkušenosti a schopné lidi, můžeme všichni těžit z vyšších příjmů."
 unity_improve_taxation_decision_tooltip: "Spolupracuj se členy svého rodu na zlepšení výběru daní a zvýšení příjmů panství"
 unity_improve_taxation_decision_confirm: "Svolejme poradu"
 unity_search_for_administrators_decision: "Hledat výběrčí daní"
 unity_search_for_administrators_decision_desc: "Daně jsou páteří každého panství. Vyplatí se věnovat čas hledání schopných správců a bývalých vojáků, které lze zaměstnat jako výběrčí daní."
 unity_search_for_administrators_decision_tooltip: "Hledej schopné správce a vojáky, kteří posílí řady mých výběrčích daní"
