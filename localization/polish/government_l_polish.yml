 default_tax_collector: "Základní daně"
 default_tax_collector_desc: "Základní [Concept('obligations','povinnosti')|E] platí, v závislosti na [Concept('aptitude','způsobilost')|E] přiděleného [Concept('tax_collector','výběrčí daní')|E]" # todo: CONCEPT CASE
 default_tax_collector_flavor_desc: "Standardní daň. Daňoví poplatníci platí ani více, ani méně, než se od nich očekává."
 jizya_special_rights_tax_collector: "Status džizji"
 jizya_special_rights_tax_collector_desc: "#emphasis #bold [Concept('vassal','Vazal')|E] Práva:#!#!\n$EFFECT_LIST_BULLET$ [Concept('liege','Lenní pán')|E] nemůže požadovat [Concept('demand_conversion','požadovat konverzi')|E] od [Concept('vassal','vazala')|E]\n[Concept('liege','Lenní pán')|E] nemůže použít [Concept('convert_county','$task_conversion$')|E] na území [Concept('vassals','vazaly')|E]\n$EFFECT_LIST_BULLET$ [Concept('liege','Lenní pán')|E] nemůže použít [Concept('faith','víra')|E] jako důvod k vyhnutí se [Concept('tyranny','tyranií')|E] při odnímání titulů\n$EFFECT_LIST_BULLET$ [Concept('liege','Lenní pán')|E] nemůže odňít [Concept('vassals_possessive','vazalů')|E] [Concept('titles','tituly')|E]\n\n#flavor [Concept('vassal','Vazal')|E] má zaručené vlastnictví svých [titles], čímž se brání [Concept('liege','lenním pánem')|E] v jejich odnětí – bez ohledu na to, zda $game_concept_liege$ má [Concept('revoke_title_reason','důvod k odebrání titulu')|E] či nikoliv.\n\nVazal je také uděleno zvláštní chráněné postavení, přičemž království oficiálně uznává jejich právo praktikovat vlastní [Concept('faith','víru')|E].#!" # todo: CONCEPT CASE
 jizya_special_rights_tax_collector_flavor_desc: "Džizja je zvláštní daň uložená #italic dhimmis#!, náboženským menšinám, výměnou za výsadu vykonávat své odlišné vyznání v míru."
