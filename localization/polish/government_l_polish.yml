 administrative_government_realm: "Administrativní panství"
 administrative_government_desc: "\n$game_concept_administrative_desc$\n\n#F Administrativní vláda je vysoce centralizovaná a moc se soustřeďuje především v hlavním městě. Dědičný nárok zůstává důležitý, ale nemá takovou váhu jako ve feudálním panství. S dostatkem schopností a ctižádosti může kdokoli, i člověk nejskromnějšího původu, vystoupat mezi vlivné guvernéry, nebo dokonce usilovat o trůn a stát se císařem.#!"
