 war_declaration_rights_allowed_desc: "#emphasis #bold [Concept('vassal','Vazal')|E] Práva:#!#!\n$EFFECT_LIST_BULLET$ [Concept('vassal','Vazal')|E] může vyhlašovat [Concept('war','válka')|E] bez ohledu na [Concept('liege','lenního pána')|E]'s [Concept('crown_authority','korunní autoritou')|E]\n$EFFECT_LIST_BULLET$ [Concept('vassal','Vazal')|E] platí #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#! méně za [Concept('casus_bellis','casus belli')|E] v rámci [Concept('realm','panství')|E]\n\n#flavor [vassal] nemusí utrácet [hook], pokud jim [lieges] [crown_authority] zabrání vést válku. Toto zvláštní zacházení také usnadňuje [vassal] vyhlašování válek uvnitř [Concept('realm','panství')|E], snižuje náklady o #high [EmptyScope.ScriptValue('war_declaration_rights_allowed_cost_reduction_tooltip')|0]%#!.#!" # todo: CONCEPT CASE
