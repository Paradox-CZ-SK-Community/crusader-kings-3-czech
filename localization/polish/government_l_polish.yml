 jizya_special_rights_granted_desc: "$jizya_special_rights_tax_collector_desc$"
 jizya_special_rights_granted_short: "Uděleno"
 iqta_special_rights_tax_collector: "Udělení iktá"
 iqta_special_rights_tax_collector_desc: "[Concept('vassal','Vazal')|E] má nižší [Concept('obligations','povinnosti')|E], ale na oplátku poskytuje [Concept('liege','lennímu pánovi')|E] [Concept('men_at_arms','ozbrojence')|E]."
 iqta_special_rights_tax_collector_flavor_desc: "Iktá je systém daňových údělů, v němž místní velmoži získávají rozsáhlé pravomoci vybírat daně jménem státu."
 ghazi_special_rights_tax_collector: "Status gházího"
 ghazi_special_rights_tax_collector_desc: "#emphasis #bold Výsada [Concept('vassal','vazala')|E]:#!#!\n$EFFECT_LIST_BULLET$ [Concept('vassal','Vazal')|E] platí méně [Concept('piety','zbožnosti')|E] za [Concept('casus_bellis','casus belli')|E] [Concept('holy_war','svaté války')|E], ale více [prestige_i][Concept('prestige','prestiže')|E] za jakákoli jiná [Concept('casus_bellis','casus belli')|E]\n$EFFECT_LIST_BULLET$ Umožňuje [Concept('raiding','plenění')|E]\n\n#flavor [Concept('liege','Lenní pán')|E] vybral [Concept('vassal','vazala')|E] za bojovníka [Concept('faith','víry')|E] a pověřil jej rozšiřováním hranic prostřednictvím [Concept('holy_war','svatých válek')|E].#!"
 ghazi_special_rights_tax_collector_flavor_desc: "Ghází jsou bojovníci víry a pohraničí, kteří získávají příjmy z kořisti a nájezdů a vedou nepřetržitou válku proti náboženským nepřátelům státu."
 deqhan_special_rights_tax_collector: "Dehkán"
 deqhan_special_rights_tax_collector_flavor_desc: "Dehkáni jsou perští velmoži působící v prastarém decentralizovaném systému výběru daní. Pečlivě spravují své državy, aby zvýšili jejich výnosnost — a zároveň i vlastní prestiž."
 maguh_special_rights_tax_collector: "Správa maguh"
 maguh_special_rights_tax_collector_flavor_desc: "Maguh je starobylá sásánovská forma okresní správy, která podporuje místní rozvoj výměnou za nižší daně odváděné státu."
 muqata_special_rights_tax_collector: "Status mukáty"
 muqata_special_rights_tax_collector_flavor_desc: "Mukáta je daňový systém, v němž vzdálená území získávají větší autonomii a odvádějí nižší daně, aby se podpořila jejich stabilita a dlouhodobý rozvoj."
 strict_taxation_tax_collector: "Zakát"
 strict_taxation_tax_collector_flavor_desc: "Zakát je majetková daň ukládaná především zámožným, která má přinášet dodatečné prostředky a zároveň pomáhat potřebným."
