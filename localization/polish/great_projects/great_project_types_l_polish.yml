 great_project_type_grand_canals: "Velké kanály"
 great_project_type_grand_canals_desc: "Dřívější správci této země vybudovali rozsáhlé sítě kanálů, které umělými vodními cestami propojují řeky a jezera a spojují sever s jihem. Rozšířením této soustavy pomocí moderních postupů můžeme dále zvýšit její účinnost a zároveň vzdát hold odkazu a dovednostem původních stavitelů."
 great_project_type_grand_canals_possessive: "Velkých kanálů"
 great_project_type_grand_canals_contribution_materials: "Materiál"
 great_project_type_grand_canals_contribution_materials_desc: "Projekt takových rozměrů bude vyžadovat obrovské množství stavebního materiálu."
