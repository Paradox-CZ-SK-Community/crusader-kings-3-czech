 great_project_type_strengthen_capital_contribution_architects: "Zkušení architekti"
 great_project_type_strengthen_capital_contribution_engineers: "Nadaní stavební mistři"
 great_project_type_strengthen_capital_contribution_sculptors: "Vynikající sochaři"
 great_project_type_strengthen_capital_contribution_forbidden_city: "Zakázané město"
 adult_education_celestial_capital_desc: "\n#P + Hlavní sídlo říše [GetTitleByKey('h_china').GetDefinitiveName|U]#!"
 adult_education_improved_celestial_capital_desc: "\n#P +++ [GetModifier('tgp_strengthen_capital_modifier').GetNameWithTooltip]#!"
 great_project_type_mandala_capital_01: "$building_type_mandala_capital_01$"
 great_project_type_mandala_capital_01_desc: "Nadešel čas zanechat svou stopu věkům. Vztyčíme mocný chrám na počest našeho dévarádži!"
 great_project_type_mandala_capital_01_possessive: "$building_type_mandala_capital_01$"
 great_project_type_mandala_capital_01_contribution_rite_of_worthiness: "Obřad způsobilosti"
 great_project_type_mandala_capital_01_contribution_rite_of_worthiness_desc: "Prokážeme, že jsme hodni práva vybudovat toto dílo: [GetBuilding('mandala_capital_01').GetTypeName]. Zároveň budeme soupeřit o oddanost obyvatel tohoto [Concept('de_jure','de iure')|E] [Concept('kingdom','království')|E]!"
 great_project_type_mandala_capital_01_contribution_slabs_of_sandstone: "Pískovcové desky"
 great_project_type_mandala_capital_01_contribution_slabs_of_sandstone_desc: "Tento chrám bude oslavovat božské, jeho výstavba však má zcela pozemské nároky. Zajištění materiálu potřebného pro tento [Concept('great_project','velký projekt')|E] patří k nejvýznamnějším možným příspěvkům."
 great_project_type_mandala_capital_01_contribution_laterite_blocks: "Lateritové bloky"
 great_project_type_mandala_capital_01_contribution_laterite_blocks_desc: "Laterit je nezbytný pro pevné základy i výzdobu."
 great_project_type_mandala_capital_01_contribution_timber: "Stavební dřevo"
 great_project_type_mandala_capital_01_contribution_timber_desc: "Použijeme tolik dřeva, kolik bude třeba na trámy, střechy a otočné dveře, a vyhradíme něco i na ozdobné obložení."
 great_project_type_mandala_capital_01_contribution_work_force: "Pracovní síla"
 great_project_type_mandala_capital_01_contribution_work_force_desc: "Kameny se samy nepohnou! Tomuto [Concept('great_project','velkému projektu')|E] zajistíme pracovní sílu potřebnou k dokončení tohoto slavného díla."
 great_project_type_mandala_capital_01_contribution_woodcarvings: "Dřevořezby"
 great_project_type_mandala_capital_01_contribution_woodcarvings_desc: "Vedle ozdobného obložení vytvoříme také řezby a rytiny oslavující božské a přivolávající požehnání našemu lidu."
 great_project_type_mandala_capital_01_contribution_sanctified_domes: "Posvěcené kupole"
 great_project_type_mandala_capital_01_contribution_sanctified_domes_desc: "Vztyčíme kupole, dílo lidských rukou, které nám připomene naši vlastní důmyslnost."
 great_project_type_mandala_capital_01_contribution_ornate_reliefs: "Zdobené reliéfy"
 great_project_type_mandala_capital_01_contribution_ornate_reliefs_desc: "Reliéfy s dévatami a apsarami, zachycující božské výjevy, zaplní toto místo a uvedou věřící v úžas."
 great_project_type_mandala_capital_01_contribution_family_shrine: "Rodová svatyně"
 great_project_type_mandala_capital_01_contribution_family_shrine_desc: "Bude vztyčena zvláštní svatyně zasvěcená potomstvu našich velkých vládců."
 great_project_mandala_capital_pick_aspect_tt: "Máš [Concept('mandala_aspect','aspekt mandaly')|E]"
 great_project_mandala_capital_has_creation_aspect_tt: "Máš [Concept('aspect_of_creation','aspekt stvoření')|E]"
 great_project_mandala_capital_has_serenity_aspect_tt: "Máš [Concept('aspect_of_serenity','aspekt klidu')|E]"
 great_project_mandala_capital_has_destruction_aspect_tt: "Máš [Concept('aspect_of_destruction','aspekt zkázy')|E]"
 great_project_mandala_capital_has_trickery_aspect_tt: "Máš [Concept('aspect_of_trickery','aspekt lstivosti')|E]"
 great_project_type_mandala_capital_02: "$building_type_mandala_capital_01$ – vylepšení"
 great_project_type_mandala_capital_02_desc: "Nyní máme možnost rozšířit náš mohutný chrám! Vytvořme div, který přetrvá věky!"
 great_project_type_mandala_capital_02_possessive: "$building_mandala_capital_02$"
 great_project_type_mandala_capital_02_contribution_rite_of_worthiness: "Obřad způsobilosti"
 great_project_type_mandala_capital_02_contribution_rite_of_worthiness_desc: "Prokážeme, že jsme hodni práva dále rozvíjet [GetBuilding('mandala_capital_01').GetTypeName], a budeme soupeřit o oddanost obyvatel tohoto [Concept('de_jure','de iure')|E] [Concept('kingdom','království')|E]!"
 great_project_type_mandala_capital_02_contribution_brick: "Cihly"
 great_project_type_mandala_capital_02_contribution_brick_desc: "Z ničeho nic nevznikne. Tomuto [Concept('great_project','velkému projektu')|E] dodáme všechny cihly potřebné k dokončení prací na stavbě $building_mandala_capital_02$."
 great_project_type_mandala_capital_02_contribution_tiles: "Hromady tašek"
 great_project_type_mandala_capital_02_contribution_tiles_desc: "Dobrá střecha musí být pokryta taškami. Tomuto [Concept('great_project','velkému projektu')|E] pošleme ty nejlepší a ochráníme jej před vlhkostí!"
 great_project_type_mandala_capital_02_contribution_shallow_pools: "Mělké nádrže"
 great_project_type_mandala_capital_02_contribution_shallow_pools_desc: "Vodní prvky jsou nezbytné nejen pro ochlazení okolí, ale také pro naše spojení s božskou sférou."
 great_project_type_mandala_capital_02_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_02_contribution_work_force_desc: "Velká díla vyžadují velké úsilí! Tomuto [Concept('great_project','velkému projektu')|E] musíme dodat více pracovní síly, aby mohla být dokončena obnova stavby $building_mandala_capital_02$."
 great_project_type_mandala_capital_02_contribution_decorative_tiles: "Ozdobné tašky"
 great_project_type_mandala_capital_02_contribution_decorative_tiles_desc: "Dopřejme si trochu okázalosti a přidejme na střechy ozdobné tašky. Zakřivené okraje. Složité řezby. Ještě více nádhery, která potěší oko i božstvo."
 great_project_type_mandala_capital_02_contribution_decorated_domes: "Zdobené kupole"
 great_project_type_mandala_capital_02_contribution_decorated_domes_desc: "Správná kupole má být dokonale oblou. Brzy budou všechny zaoblené, opatřené žebrováním a zdobené působivými motivy."
 great_project_type_mandala_capital_02_contribution_family_statues: "Posvátná socha dědice"
 great_project_type_mandala_capital_02_contribution_family_statues_desc: "Posvátné podoby dědiců naší božské linie budou vytesány do kamenných soch, aby jejich památka přetrvala navěky."
 great_project_type_mandala_capital_03: "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_03_desc: "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_03_possessive: "$building_mandala_capital_03$"
 great_project_type_mandala_capital_03_contribution_rite_of_worthiness: "Obřad způsobilosti"
 great_project_type_mandala_capital_03_contribution_rite_of_worthiness_desc: "Prokážeme, že jsme hodni práva dále rozvíjet [GetBuilding('mandala_capital_01').GetTypeName], a postoupíme tak o další krok do análů dějin!"
 great_project_type_mandala_capital_03_contribution_volcanic_stone: "Sopečný kámen"
 great_project_type_mandala_capital_03_contribution_volcanic_stone_desc: "Nejvyšší ambice potřebují nejpevnější základy. Tomuto [Concept('great_project','velkému projektu')|E] dodáme sopečný kámen potřebný k vybudování základů, které přetrvají věky."
 great_project_type_mandala_capital_03_contribution_corbel_gateways: "Konzolové brány"
 great_project_type_mandala_capital_03_contribution_corbel_gateways_desc: "S rozšiřováním chrámu potřebujeme pevné konstrukce, které unesou jeho další části. Tyto brány zároveň povedou každého, kdo se bude zdejším areálem ubírat za osvícením."
 great_project_type_mandala_capital_03_contribution_divine_statues: "Božské sochy"
 great_project_type_mandala_capital_03_contribution_divine_statues_desc: "Tyto obří hlavy mohou působit impozantně, především však posvěcují toto místo a naplňují je důstojností a ctností."
 great_project_type_mandala_capital_03_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_03_contribution_work_force_desc: "Chceme-li dosáhnout božského, musíme tvrdě pracovat. Stavba $building_mandala_capital_03$ vyžaduje další pracovní sílu a náš příspěvek bude bohatě odměněn."
 great_project_type_mandala_capital_03_contribution_creation_aspect: "Sochy stvoření"
 great_project_type_mandala_capital_03_contribution_creation_aspect_desc: "Tyto obří hlavy hledí do dáli, jako by neustále plánovaly a uspořádávaly svět a udržovaly život v této sféře i v té příští. Nápadně se podobají našemu božskému vládci."
 great_project_type_mandala_capital_03_contribution_serenity_aspect: "Sochy klidu"
 great_project_type_mandala_capital_03_contribution_serenity_aspect_desc: "Z těchto obřích hlav vyzařuje pokoj a vyrovnanost, jako by již dosáhly osvícení. Nápadně se podobají našemu božskému vládci."
 great_project_type_mandala_capital_03_contribution_destruction_aspect: "Sochy zkázy"
 great_project_type_mandala_capital_03_contribution_destruction_aspect_desc: "Tváře těchto obřích hlav svírá děsivý škleb, jako by byly připraveny vrhnout se na každého nepřítele, který se odváží vstoupit na tuto posvátnou půdu. Nápadně se podobají našemu božskému vládci."
 great_project_type_mandala_capital_03_contribution_trickery_aspect: "Sochy lstivosti"
 great_project_type_mandala_capital_03_contribution_trickery_aspect_desc: "Tyto obří hlavy se potutelně usmívají a budí dojem, že člověka vidí skrz naskrz, doslova i obrazně. Nápadně se podobají našemu božskému vládci."
 great_project_type_mandala_capital_03_contribution_gilded_domes: "Pozlacené kupole"
 great_project_type_mandala_capital_03_contribution_gilded_domes_desc: "Mají-li kupole stavby $building_mandala_capital_03$ skutečně zářit v celé své nádheře, musí být pokryty tím nejlepším zlatem, jaké lze získat."
 great_project_type_mandala_capital_03_contribution_family_temple_compound: "Rodový chrámový komplex"
 great_project_type_mandala_capital_03_contribution_family_temple_compound_desc: "Posvátný chrámový komplex zasvěcený uctívání synů a dcer božského vládce, který tyto velkolepé chrámy vybudoval."
 great_project_type_mandala_capital_04: "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_04_desc: "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_04_possessive: "$building_mandala_capital_04$"
 great_project_type_mandala_capital_04_contribution_rite_of_worthiness: "Obřad způsobilosti"
 great_project_type_mandala_capital_04_contribution_rite_of_worthiness_desc: "Prokážeme svou nepochybnou způsobilost dále rozvíjet [GetBuilding('mandala_capital_01').GetTypeName] a zanecháme tak svou stopu ve světě!"
 great_project_type_mandala_capital_04_contribution_slabs_of_granite: "Žulové desky"
 great_project_type_mandala_capital_04_contribution_slabs_of_granite_desc: "Jediný skutečně nesmrtelný obraz je ten vytesaný do kamene. Pro stavbu $building_mandala_capital_04$ zajistíme ten nejkvalitnější kámen, aby zde vznikla umělecká díla, která přetrvají věčnost."
 great_project_type_mandala_capital_04_contribution_zaungdans: "Zaungdany"
 great_project_type_mandala_capital_04_contribution_zaungdans_desc: "Posvátná schodiště jsou důležitou součástí cesty vzhůru, a tedy i přibližování se božskému. Zároveň jsou skvělým místem pro tržiště a další nezbytnosti."
 great_project_type_mandala_capital_04_contribution_gilded_shrines: "Pozlacené svatyně"
 great_project_type_mandala_capital_04_contribution_gilded_shrines_desc: "Vybudujeme svatyně s modlami a každé božstvo v nich zpodobněné nám projeví milost a bude nápomocno našemu božskému vládci."
 great_project_type_mandala_capital_04_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_04_contribution_work_force_desc: "Tak velkolepé dílo nevyžaduje jen svaly a pot, ale také bystré oči, jemné nástroje a mysl řemeslného mistra. Pracovní síla, kterou poskytneme, nebude pouze přenášet stavební materiál, ale vytvoří i složitá umělecká díla, která tento [Concept('great_project','velký projekt')|E] tolik potřebuje."
 great_project_type_mandala_capital_04_contribution_bell_stupas: "Zvonovité stúpy"
 great_project_type_mandala_capital_04_contribution_bell_stupas_desc: "Pro stavbu $building_mandala_capital_05$ bude poskytnut ten nejkvalitnější mramor, aby mohla spočívat na těch nejelegantnějších základech."
 great_project_type_mandala_capital_04_contribution_bejeweled_domes: "Kupole zdobené drahokamy"
 great_project_type_mandala_capital_04_contribution_bejeweled_domes_desc: "Nebesa musí nad stavbou $building_mandala_capital_04$ zářit. Tomuto [Concept('great_project','velkému projektu')|E] proto poskytneme drahokamy, díky nimž se bude zdát, jako by mezi sloupy tohoto božského komplexu spočívaly samotné hvězdy."
 great_project_type_mandala_capital_04_contribution_family_temple_complex: "Rodový chrámový komplex"
 great_project_type_mandala_capital_04_contribution_family_temple_complex_desc: "Potomstvo našeho velkého dévarádži bude poctěno vlastním chrámovým komplexem v královském městě. Zde bude uctíváno dlouho předtím, než samo převezme otěže moci."
 great_project_type_mandala_capital_05: "$great_project_type_mandala_capital_02$"
 great_project_type_mandala_capital_05_desc: "$great_project_type_mandala_capital_02_desc$"
 great_project_type_mandala_capital_05_possessive: "$building_mandala_capital_05$"
 great_project_type_mandala_capital_05_contribution_rite_of_worthiness: "Obřad způsobilosti"
 great_project_type_mandala_capital_05_contribution_rite_of_worthiness_desc: "Prokážeme svou nepochybnou způsobilost dále rozvíjet [GetBuilding('mandala_capital_01').GetTypeName] a proměníme jej v něco skutečně nadpozemského!"
 great_project_type_mandala_capital_05_contribution_marble_foundation: "Mramorové základy"
 great_project_type_mandala_capital_05_contribution_marble_foundation_desc: "Pro stavbu $building_mandala_capital_05$ bude poskytnut ten nejkvalitnější mramor, aby mohla spočívat na těch nejelegantnějších základech."
 great_project_type_mandala_capital_05_contribution_divine_barays: "Božské baraje"
 great_project_type_mandala_capital_05_contribution_divine_barays_desc: "Naše stavba bude obklopena hlubokými vodními nádržemi, které nás budou chránit před nepřáteli a zároveň nás spojovat s duchovní sférou."
 great_project_type_mandala_capital_05_contribution_work_force: "$great_project_type_mandala_capital_01_contribution_work_force$"
 great_project_type_mandala_capital_05_contribution_work_force_desc: "Ze všech koutů panství přivedeme pracovníky všech schopností, od nejprostších rolníků až po nejmoudřejší učence, aby pomohli s výstavbou $building_mandala_capital_05$."
 great_project_type_mandala_capital_05_contribution_bejeweled_reliefs: "Reliéfy zdobené drahokamy"
 great_project_type_mandala_capital_05_contribution_bejeweled_reliefs_desc: "Stěny zaplní nebeské tanečnice, jejichž ladné pohyby budou zachyceny spolu s nádhernými oděvy posázenými drahokamy."
 great_project_type_mandala_capital_05_contribution_bunga_mas_forest: "Les Bunga Mas"
 great_project_type_mandala_capital_05_contribution_bunga_mas_forest_desc: "Úcta k tak vznešenému a spravedlivému monumentu si žádá vytříbenější a hlubší dary. Stavbě $building_mandala_capital_05$ věnujeme celé seskupení stromů a květin ze zlata, mistrně zhotovených těmi nejlepšími řemeslníky."
 great_project_type_mandala_capital_05_contribution_dynastic_temple_complex: "Dynastický chrámový okrsek"
 great_project_type_mandala_capital_05_contribution_dynastic_temple_complex_desc: "Část chrámového komplexu hlavního města našeho dévarádži bude zasvěcena uctívání našeho rodu a jeho potomků."
 great_project_error_plan_mandala_capital: "Nesplňuješ požadavky pro plánování rozšíření hlavního města mandaly"
 only_single_great_project_type_allowed: "[Concept('great_project','Velký projekt')|E] tohoto typu se již neplánuje ani neprobíhá"
 you_are_owner_of_the_project: "Jsi vlastníkem tohoto [Concept('great_project','velkého projektu')|E]"
 great_project_type_minister_project_culture: "Asimilovat oblast"
 minister_project_culture_name_chinese: "Počínštit oblast"
 minister_project_culture_name_default: "Změnit kulturu oblasti"
 great_project_type_minister_project_culture_desc: "Jak můžeme být skutečně jednotní, pokud nesdílíme společné hodnoty? Rozdíly mohou vést ke svárům a nepokojům. Tyto problémy můžeme alespoň částečně vyřešit dlouhodobým integračním úsilím. Jedno panství, jeden lid."
 great_project_type_minister_project_culture_possessive: "$great_project_type_minister_project_culture$"
 great_project_type_minister_project_culture_contribution_cultural_liason: "Zajistit kulturního prostředníka"
 great_project_type_minister_project_culture_contribution_send_inhabitants: "Přesídlit obyvatele"
 great_project_type_minister_project_culture_contribution_send_inhabitants_2: "$great_project_type_minister_project_culture_contribution_send_inhabitants$"
