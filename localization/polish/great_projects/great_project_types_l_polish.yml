l_polish:
 great_project_type_great_wall: "Vylepšit Velkou zeď"
 great_project_type_great_wall_desc: "Velká zeď je svědectvím stavitelského umu a vynalézavosti našich předků, kteří ji vybudovali na obranu před případnými nájezdníky. Čas se však podepsal i na ní a zeď nyní naléhavě potřebuje vylepšit."
 great_project_type_great_wall_province_has_great_wall: "[province.GetNameNoTooltip] obsahuje úsek stavby [GetBuilding('the_great_wall_01').GetName]"
 great_project_type_great_wall_province_gains_great_wall: "[Concept('provinces','Provincie')|E] s financovanými [Concept('great_project_contributions','příspěvky k velkému projektu')|E] získají vylepšení svých úseků [Concept('building','stavby')|E] [GetBuilding('the_great_wall_04').GetName]"
 great_project_type_great_wall_possessive: "Velké zdi"
 great_project_type_great_wall_contribution_master_builder: "Najmout mistra stavitele a zahájit výstavbu"
