 great_project_type_great_wall_extend_to_liaodong: "Prodloužit Velkou zeď do Liao-tungu"
 great_project_type_great_wall_extend_to_liaodong_desc: "S rozšiřováním našich hranic musí růst i Velká zeď a chránit také pobřeží. Každá část našeho panství, ať už na souši či na moři, musí být zabezpečena."
