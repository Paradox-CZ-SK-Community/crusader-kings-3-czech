 great_project_type_strengthen_capital: "Posílit hlavní město"
 great_project_type_strengthen_capital_desc: "Hlavní město není jen sídlem mé vlády. Je samotným srdcem panství a mělo by být majestátním symbolem mého panování. Obnovou celého města, zvelebením ulic, financováním univerzity a vztyčením soch i dalších monumentů se toto nádherné město stane odrazem mé dynastie."
 great_project_type_strengthen_capital_possessive: "$great_project_type_strengthen_capital$"
