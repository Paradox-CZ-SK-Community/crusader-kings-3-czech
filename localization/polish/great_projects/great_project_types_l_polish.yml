 great_project_type_construct_great_barracks: "Vybudovat Velkou kasárnu"
 great_project_type_construct_great_barracks_desc: "Naši vojenskou moc můžeme dát na odiv vybudováním mohutné pevnosti schopné pojmout nesčetné množství vojáků. Vojenští velitelé budou moci verbovat více vojska a udržovat početné posádky, což výrazně posílí obranyschopnost celé oblasti."
 great_project_type_construct_great_barracks_military_governor_duchy_capital: "Je [Concept('de_jure','de iure')|E] [Concept('capital','hlavním sídlem')|E] [Concept('duchy','vévodství')|E] pod vojenskou správou ([GetPlayer.Custom('GetGovernorConcept')])"
