 great_wall_contributor_realm_tt: "Patříš do [Concept('realm','panství')|E], kterému [owner.GetShortUIName] [Select_CString(owner.IsLocalPlayer,'vládneš','vládne')], nebo mezi [Select_CString(owner.IsLocalPlayer,'své',Select_CString(owner.IsFemale,'její','jeho'))] [Concept('tributaries','tributáře')|E]"
