 great_project_walls_extend_materials_generic: "Stavební materiál"
 great_project_walls_extend_materials_generic_desc: "Každá zeď vyžaduje velké množství stavebního materiálu. Zeď takových rozměrů ho však potřebuje skutečně obrovské množství."
 great_project_type_great_wall_extend_to_shanhai_pass: "Prodloužit Velkou zeď k průsmyku Šan-chaj-kuan"
 great_project_type_great_wall_extend_to_shanhai_pass_desc: "Velká zeď je už nyní impozantní, ale může být ještě působivější a poskytovat lepší ochranu. Prodloužíme-li ji dále na východ až k průsmyku Šan-chaj-kuan a pobřeží, můžeme uzavřít veškeré přístupové cesty ze severu."
