 pam_great_projects_events.0002.desc: "Kněží mohou hledat radu v Božím slově, ale právě svaté obrazy ukazují věřícím pravdu a slávu Páně.\n\nPotřebné peníze jsou shromážděny a malíři ikon se sešli. Teď musím rozhodnout, které výjevy z Písma ozdobí klenby, stěny a stropy."
 pam_great_projects_events.0002.a: "Tři mudrci při narození Krista."
 pam_great_projects_events.0002.b: "Svatý Jeroným na poušti se svým lvem."
 pam_great_projects_events.0002.c: "Abrahám a Lot odcházející z Egypta do Kanaánu."
 pam_great_projects_events.0002.d: "Zvěstování Panně Marii."
 pam_great_projects_events.0002.e: "Srdce svatého Augustina planoucí poznáním Pána."
 pam_great_projects_events.0002.f: "Kristus omývající nohy apoštolům."
 pam_great_projects_events.0002.mystic_xp: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat více [Concept('trait_level_track_xp','zkušeností rysu')|E] postavám s [Concept('trait','rysem')|E] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 pam_great_projects_events.0002.scholar_xp: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat [Concept('trait_level_track_xp','zkušenosti rysu')|E] postavám s [Concept('trait','rysem')|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )]"
 pam_great_projects_events.0002.pilgrim_xp: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat [Concept('trait_level_track_xp','zkušenosti rysu')|E] postavám s [Concept('trait','rysem')|E] [GetTrait('pilgrim').GetName( GetNullCharacter )]"
 pam_great_projects_events.0002.piety: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat @piety_icon![Concept('piety','zbožnost')|E]"
 pam_great_projects_events.0002.learning_xp: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat věřícím [Concept('lifestyle_experience','zkušenosti životního stylu')|lE] @skill_learning_icon![Concept('learning','učenosti')|E] a [Concept('spiritual_fulfillment','duchovní naplnění')|E]"
 pam_great_projects_events.0002.stress_loss: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat @stress_loss_icon![Concept('stress_loss','úbytek stresu')|E]"
 cathedral_stained_glass_contributor_tt: "Máš [Concept('prestige_level','úroveň slávy')|E] [GetPrestigeLevelName('(int32)2')] nebo vyšší, [Concept('piety_level','úroveň oddanosti')|E] [GetPietyLevelName('(int32)3')] nebo vyšší, nebo [Concept('title','titul')|E] na úrovni [Concept('kingdom','království')|E]"
 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$: Světlo v barvách pro [province.GetNameNoTooltip]"
 pam_great_projects_events.0003.desc: "„#EMP Jasné je to, co se jasně pojí s jasným, a jasné bude vznešené dílo, jímž proniká nové světlo.#!“ pronáší [religion_buddy.GetTitledFirstName] při pohledu na vyřezané sklo zářící ve slunci.\n\n[glazier.GetTitledFirstName], [Select_CString(glazier.IsFemale,'sklenářka','sklenář')], [Select_CString(glazier.IsFemale,'rozložila','rozložil')] úlomky [Glossary('skla barveného ve hmotě','POT_METAL_GLOSS')] na bíle natřené stoly, abychom si mohli lépe prohlédnout zamýšlené vzory.\n\nProhlašuji: „Toto okno bude vidět z chrámové lodi i z celého sídla [province.GetNameNoTooltip]. Musí zobrazovat...“"
 pam_great_projects_events.0003.a: "Strom Jesse, který potvrdí oprávněnost vlády rodu [ROOT.Char.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0003.a.flavor: "[Glossary('strom Jesse','TREE_OF_JESSE_GLOSS')]"
 pam_great_projects_events.0003.a.tt: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat @dynasty_prestige_icon![Concept('dynasty_prestige','věhlas')|E] členům [Concept('dynasty','dynastie')|E], kteří ji navštíví jako vedoucí [Concept('travel','cestování')|E]"
 pam_great_projects_events.0003.b: "Okno s mou podobiznou a erbem."
 pam_great_projects_events.0003.b.tt: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat návštěvníkům @prestige_icon![Concept('prestige','prestiž')|E]"
 pam_great_projects_events.0003.c: "Výjevy zázraků při poutích, jež přivábí věřící zdaleka."
 pam_great_projects_events.0003.c.tt: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat více [Concept('trait_level_track_xp','zkušeností rysu')|E] postavám s [Concept('trait','rysem')|E] [GetTrait('pilgrim').GetName( GetNullCharacter )]"
 pam_great_projects_events.0003.d: "Mariánské okno a před ním věčné světlo."
 pam_great_projects_events.0003.d.flavor: "Před vitráží s podobiznou [blessed_mary.Custom('CZ_TitledFirstName_G')] bude udržovat rozžatou olejovou lampu a svíce."
 pam_great_projects_events.0003.d.tt: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat @stress_loss_icon![Concept('stress_loss','úbytek stresu')|E] a [Concept('spiritual_fulfillment','duchovní naplnění')|E]"
 pam_great_projects_events.0003.d.dulia.tt: "[Concept('personal_tenet','Osobní zásada')|E] [GetTenetType('tenet_dulia').GetBaseName] při návštěvě poskytuje větší [Concept('spiritual_fulfillment','duchovní naplnění')|E]"
 pam_great_projects_events.0003.e: "Cyklus mučednictví z rukou krále."
 pam_great_projects_events.0003.e.tt: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat horlivým návštěvníkům více @piety_icon![Concept('piety','zbožnosti')|E] a @stress_loss_icon![Concept('stress_loss','úbytku stresu')|E]."
 pam_great_projects_events.0003.e.owner_msg.title: "Mučednictví ve skle"
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.GetTitledFirstName|U] [Select_CString(contributor.IsFemale,'objednala','objednal')] pro [Concept('grand_cathedral','velkolepou katedrálu')|E] cyklus vitráží s výjevy mučednictví. Jejich námět v tobě probouzí hlubší oddanost."
 TREE_OF_JESSE_GLOSS: "Strom Jesse zobrazuje Kristův rodokmen vyrůstající z ležící postavy Jesseho, otce Davidova. Chrámové vitráže spojovaly biblickou královskou linii s vládnoucí dynastií a vyjadřovaly tak božský původ královské moci. Významné příklady se dochovaly v Chartres a Saint-Denis."
 POT_METAL_GLOSS: "Sklo barvené ve hmotě získává barvu přimícháním oxidů kovů do skloviny v tavicí pánvi. Barva tak prostupuje celým sklem a nezůstává jen na jeho povrchu. Mistři sklenáři, latinsky vitrearii, rozřezávali vychladlé tabule na dílky a rozkládali je na bíle natřené desky, aby posoudili průchod světla, než je zasadili do olověných spojů."
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$: První kámen položen"
 pam_great_projects_events.0005.desc.intro: "První kámen je položen! Tak jako ze žaludu vyroste dub, i sídlo [owner.Custom('CZ_TitledFirstName_G')] se promění v povznášející památník. Z každého kamene i trámu bude vyzařovat sláva, jejímž zdrojem je [ROOT.Char.GetFaith.HighGodName], a všichni [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] na území [owner.GetPrimaryTitle.GetNameNoTier] i v celém křesťanstvu ji spatří.\n\nZvony budou hlásat štědrost, s níž [Select_CString(founder.IsLocalPlayer,'stavbu financuji',founder.GetFirstName)] [Select_CString(founder.IsLocalPlayer,'já','financuje stavbu')], a každý věřící ji bude mít na rtech."
 pam_great_projects_events.0005.desc.contributor: "\n\nZejména příspěvek [contribution.GetName] od [optional_contributor.Custom('CZ_TitledFirstName_G')] ještě více zvěční naši stavbu [cathedral_building.GetName]."
 pam_great_projects_events.0005.desc.outro: "Ať velké dílo započne!"
 pam_great_projects_events.0005.a: "„Naše děti se dočkají jeho dokončení.“"
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$: Podle Božího řádu"
 pam_great_projects_events.0006.desc.intro_architect: "[architect.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))], ukazuje na"
 pam_great_projects_events.0006.desc.intro_no_architect: "Dívám se na"
 pam_great_projects_events.0006.desc.intro: "řadu dřevěných kůlů, mezi nimiž jsou napjaty provazy v obrysu obrovského kříže; předobraz budoucí stavby s křížovým půdorysem."
 pam_great_projects_events.0006.desc.steward_founder: "\n\nTento postup znám ze svých studií!\n\n„Jistě používáš $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.steward_architect: "\n\n„Jak se ale tak velkolepá stavba vůbec plánuje?“ ptám se."
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n„Používáme $pam_great_projects_events.0006.desc.ad_quadratum_ref$"
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "metodu [Glossary('ad quadratum','AD_QUADRATUM_GLOSS')]! Pán nám dal božský řád. Pomocí čtverce můžeme odvodit proporce budovy velkolepější, než je [ROOT.Char.Custom('ResidenceBuilding')].“"
 pam_great_projects_events.0006.desc.foundations: "\n\nVidím, že brzy začnou hloubit základy."
 pam_great_projects_events.0006.a: "Vyhloubit kryptu pro předky rodu [founder.GetDynastyNameNoTooltip]."
 pam_great_projects_events.0006.a.tt: "V [Concept('cathedral_complex','katedrálním komplexu')|E], který [owner.GetShortUIName] [Select_CString(owner.IsLocalPlayer,'vlastníš','vlastní')], bude postavena budova [GetDomicileBuilding('cathedral_crypt_01').GetName|V] na počest [Concept('dynasty','dynastie')|E] [founder.GetDynastyName]"
 pam_great_projects_events.0006.b: "Prodloužit loď, aby pojala poutníky."
 pam_great_projects_events.0006.b.tt: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat více [Concept('trait_level_track_xp','zkušeností rysu')|E] [GetTrait('pilgrim').GetName( GetNullCharacter )] a @piety_icon![Concept('piety','zbožnost')|E] poutníkům, kteří ji navštíví"
 pam_great_projects_events.0006.c: "Jen Bůh může vést toto dílo."
 AD_QUADRATUM_GLOSS: "#EMP Ad quadratum#! znamená latinsky „podle čtverce“. Středověcí mistři kameníci vytyčovali staveniště pomocí jednoduchých soustav poměrů. Využívali poměr strany čtverce k jeho úhlopříčce. Obdélník s těmito dvěma délkami stran pokládali za harmonický. Z této jediné základní jednotky mohl kameník odvodit řadu větších i menších čtverců a obdélníků a mít jistotu, že na sebe všechny části plánu navážou."
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$: Žebra nebes"
 pam_great_projects_events.0007.desc.intro_architect: "[architect.GetFirstName|U], [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))], mě vede rozlehlým lesem trámů. Lešení katedrály samo připomíná dřevěný kostel a nese kameníky usilovně pracující na kamenné klenbě."
 pam_great_projects_events.0007.desc.intro_no_architect: "Procházím rozlehlým lesem trámů. Lešení katedrály samo připomíná dřevěný kostel a nese kameníky pracující na klenbě."
 pam_great_projects_events.0007.desc.architect: "\n\n„Až budou tyto klenby hotové, ochrání věřící před nepřízní počasí a povedou naše modlitby vysoko do nebes,“"
 pam_great_projects_events.0007.desc.architect_says: "říká [Select_CString(architect.IsFemale,'ona','on')]."
 pam_great_projects_events.0007.desc.outro: "\n\nPři pohledu na dokončené klenební pole si vybavuji žebra velké ryby, která spolkla Jonáše. Taková je sláva Božího domu, že člověka přenese pod mořskou hladinu i vzhůru ke hvězdám."
 pam_great_projects_events.0007.a: "Ozdobit klenby noční oblohou."
 pam_great_projects_events.0007.a.tt: "Po dokončení [Concept('grand_cathedral','velkolepé katedrály')|E] bude její [Concept('point_of_interest','zajímavé místo')|E] poskytovat více [Concept('trait_level_track_xp','zkušeností rysu')|E] postavám s [Concept('trait','rysem')|E] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 pam_great_projects_events.0007.b: "Kázat o pokání jako Jonáš."
 pam_great_projects_events.0007.b.tt: "Tvoje [Concept('faith','víra')|E] získá @fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! [Concept('fervor','horlivosti')|E]"
 pam_great_projects_events.0007.c: "Ať kameníci pokračují v práci."
 fervor_gain_cathedral_jonah_sermon: "Kázání o pokání při stavbě [Concept('grand_cathedral','velkolepé katedrály')|E]"
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$: Odlévání Božího hlasu"
 pam_great_projects_events.0008.desc.intro: "Stavba dobře pokračuje, ale katedrále chybí hlas, který by svolával věřící z celého území [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName] mi říká, že musíme odlít veliký bronzový zvon!"
 pam_great_projects_events.0008.desc.no_architect: "\n\nMusíme odlít zvon!"
 pam_great_projects_events.0008.desc.need_bell: "Riskantní a nákladný podnik; pokladnice panství [founder.GetPrimaryTitle.GetNameNoTier] se dosud nevzpamatovala ani z výdajů za samotnou surovinu."
 pam_great_projects_events.0008.desc.plague_named: "\n\nZvonolitce bohužel zahubila epidemie [epidemic.GetName]."
 pam_great_projects_events.0008.desc.plague_generic: "\n\nZvonolitec bohužel podlehl nedávnému moru."
 pam_great_projects_events.0008.desc.outro: "[Select_CString(bell_maker_son.IsFemale,'Jeho dcera','Jeho syn')], [bell_maker_son.GetFirstName], mě ujišťuje, že [Select_CString(bell_maker_son.IsFemale,'jí','mu')] otec na smrtelném loži předal tajné vědění a že zvon dokáže odlít."
 pam_great_projects_events.0008.desc.ordinary_body: "\n\nPřichází [bell_maker_son.GetFirstName], [Select_CString(bell_maker_son.IsFemale,'ctižádostivá mladá slévačka bronzu, která se vyučila','ctižádostivý mladý slévač bronzu, který se vyučil')] u místního mistra. Touží prokázat své schopnosti odlitím zvonu, jímž se bude pyšnit [cathedral_building.GetName] na území [owner.GetPrimaryTitle.GetNameNoTier]."
 pam_great_projects_events.0008.a: "Jestli selže, [Select_CString(bell_maker_son.IsFemale,'zabiji ji','zabiji ho')]."
 pam_great_projects_events.0008.a.tt: "Pokud se odlití nezdaří, popravíš [Select_CString(bell_maker_son.IsLocalPlayer,'tebe',bell_maker_son.Custom('CZ_ShortUIName_A'))]"
 pam_great_projects_events.0008.belltower_may.tt: "V [Concept('cathedral_complex','katedrálním komplexu')|E], který [owner.GetShortUIName] [Select_CString(owner.IsLocalPlayer,'vlastníš','vlastní')], může být postavena budova [GetDomicileBuilding('cathedral_belltower_02').GetName|V]"
 pam_great_projects_events.0008.aa: "Jestli selže, [Select_CString(bell_maker_son.IsFemale,'stáhnu ji','stáhnu ho')] zaživa z kůže."
 pam_great_projects_events.0008.b: "[Select_CString(bell_maker_son.IsFemale,'Mohla by být','Mohl by být')] nástrojem Páně."
 pam_great_projects_events.0008.b.tt: "Svěřuješ odlití zvonu [Select_CString(bell_maker_son.IsLocalPlayer,'tobě',bell_maker_son.Custom('CZ_ShortUIName_D'))]"
 pam_great_projects_events.0008.b.flavor: "Nebyl snad David pouhým mladým pastýřem, když zabil Goliáše?"
 pam_great_projects_events.0008.c: "Najít někoho spolehlivého, i kdyby [Select_CString(bell_maker_son.IsFemale,'nešlo o mistrovu dceru','nešlo o mistrova syna')]."
 pam_great_projects_events.0008.duel.success: "Odlití se zdařilo! V [Concept('cathedral_complex','katedrálním komplexu')|E], který [owner.GetShortUIName] [Select_CString(owner.IsLocalPlayer,'vlastníš','vlastní')], bude postavena budova [GetDomicileBuilding('cathedral_belltower_02').GetName|V]"
 pam_great_projects_events.0008.duel.failure: "Odlití se nezdařilo... musíš rozhodnout, co dál"
 pam_cathedral_bell_casting_duel: "[Concept('learning',Select_CString(CHARACTER.IsLocalPlayer,'Tvoje učenost','Učenost'))|E][Select_CString(CHARACTER.IsLocalPlayer,'',Concatenate(' ',CHARACTER.Custom('CZ_ShortUIName_G')))]"
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$"
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$: A Bůh promluvil"
 pam_great_projects_events.0009.desc.body: "Sleduji, jak [bell_maker_son.GetFirstName] pobíhá sem a tam a řídí dělníky.\n\nNeustále se pře se starou partou svého otce a trvá na vlastním způsobu výběru místa pro jámu, vhodné hlíny na formu i roztápění pecí."
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName|U] a já sledujeme, jak [bell_maker_son.GetFirstName] pobíhá sem a tam a řídí dělníky.\n\nNeustále se pře se starou partou svého otce a trvá na vlastním způsobu výběru místa pro jámu, vhodné hlíny na formu i roztápění pecí."
 pam_great_projects_events.0009.desc.success_end: "\n\nRoztavený bronz hladce vtéká do formy, jako by jej vedla Boží ruka, a zvon z ní vychází neporušený. Pak jej vyzdvihnou a jeho jasný hlas svolává všechny věřící. [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] slyší jeho volání:\n\n„Pojďte do domu Páně!“"
 pam_great_projects_events.0009.a: "Ať [province.Custom('GetTerrainType')|l] kolem sídla [province.GetNameNoTooltip] slyší Boží hlas."
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$: Posel zkázy!"
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$"
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$"
 pam_great_projects_events.0010.desc.failure_end: "\n\nRoztavený bronz ve formě kvílí, ale zvon z ní vychází neporušený. Poté jej vyzdvihnou a rozhoupají. Když však srdce udeří do věnce, ozve se jen tupá rána a vzápětí prasknutí. Posel zkázy!"
 pam_great_projects_events.0010.a: "Sliby se musí plnit."
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.GetShortUIName|U] [Select_CString(bell_maker_son.IsLocalPlayer,'budeš','bude')] [Select_CString(bell_maker_son.IsFemale,'popravena','popraven')]"
 pam_great_projects_events.0010.b: "Prasklý zvon je dostatečným trestem."
 pam_great_projects_events.0010.b.faith: "Pán s [Select_CString(bell_maker_son.IsFemale,'ní','ním')] ještě má své záměry."
 pam_great_projects_events.0010.c: "Roztavit bronz. Vykovat něco ostřejšího."
 pam_great_projects_events.0010.c.tt: "Prasklý zvon bude přetaven v mučicí nástroj a jeho první obětí [Select_CString(bell_maker_son.IsLocalPlayer,'budeš','bude')] [bell_maker_son.GetShortUIName]. Budoucí řemeslníci v sídle [founder.GetCapitalLocation.GetNameNoTooltip] poznají, co je poslušnost."
 pam_great_projects_events.0010.c.intrigue_xp.tt: "Místo toho získáš [Concept('experience','zkušenosti')|E] [Concept('intrigue_lifestyle','pletichářského životního stylu')|E]"
 pam_great_projects_events.0010.d: "Ať je to lekcí pokory."
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$: Jako rukou Páně"
 pam_great_projects_events.0011.desc.intro: "Když kontroluji, jak v sídle [province.GetNameNoTooltip] vyrůstá [cathedral_building.GetName], do uší se mi zarývá skřípění ohromné otáčející se dřevěné konstrukce."
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName] ukazuje na obří šlapací kolo, uvnitř kterého kráčejí dva dělníci."
 pam_great_projects_events.0011.desc.no_architect: "\n\nOdhaluji zdroj hluku, obří šlapací kolo, uvnitř kterého kráčejí dva dělníci."
 pam_great_projects_events.0011.desc.outro: "\n\nJeho lana a kladky zvedají mohutné kusy čerstvě opracovaných [Glossary('kamenných kvádrů','ASHLAR_GLOSS')] i vědra malty k rozestavěné střeše, jako by je vedla Boží ruka. V úžasu hledím na náklad, pod nímž by se nosičům dole na nádvoří lámala záda."
 pam_great_projects_events.0011.a: "My [founder.GetCulture.GetCollectiveNounNoTooltip] se musíme z velkého kola naučit vše, co lze."
 pam_great_projects_events.0011.a.tt: "Tvoje [Concept('culture','kultura')|E] získá @culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#! pokroku v současné [Concept('cultural_fascination','kulturní fascinaci')|E]"
 pam_great_projects_events.0011.b: "To by pomohlo mnoha stavbám v sídle [founder.GetCapitalLocation.GetNameNoTooltip]!"
 pam_great_projects_events.0011.c: "Působivé, ale takové činy raději přenechám Pánu."
 ASHLAR_GLOSS: "Kamenné kvádry jsou přesně vytesané a opracované bloky kamene, hraněné a vyhlazené ještě na zemi. Aby do sebe po vyzdvižení do výšek potřebných při stavbě katedrál zapadaly, bylo nutné vše pečlivě naplánovat."
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$: Vyšší poslání"
 pam_great_projects_events.0013.desc: "Nad námi se rozléhá bušení tesařských palic, předzvěst akustiky, která brzy obklopí věřící Božím slovem.\n\n[architect.GetFirstName] vysvětluje: „Bude to skromná galerie, z níž kanovníci povedou liturgii, naše vlastní [Glossary('zpěvácká tribuna','CANTORIA_GLOSS')]! Vždyť když oslovujeme našeho Pána, musíme užívat jiný hlas než při hovoru s lidmi.“ Potom pokyne [Select_CString(choir_boy.IsFemale,'mladé sborové zpěvačce','mladému sborovému zpěvákovi')] jménem [choir_boy.GetFirstName], aby [Select_CString(choir_boy.IsFemale,'přistoupila','přistoupil')].\n\nDítě vyběhne po lešení a vypustí andělský tón. Jak zní mezi stěnami a prostupuje mým tělem, mám pocit, jako by mnou prošel sám Bůh."
 pam_great_projects_events.0013.a: "Rozšířit galerii, čím více hlasů, tím lépe."
 pam_great_projects_events.0013.b: "Tento anděl musí ozdobit můj dvůr."
 pam_great_projects_events.0013.castrato: "Zachovat tento hlas pro zpěváckou tribunu Páně."
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUIName|U] [Select_CString(choir_boy.IsLocalPlayer,'budeš','bude')] [Select_CString(choir_boy.IsFemale,'vykastrována','vykastrován')], aby se [Select_CString(choir_boy.IsFemale,'její','jeho')] hlas při mutaci nezměnil"
 pam_great_projects_events.0013.c: "Tahle komedie ze mě má jen vymámit peníze!"
 pam_great_projects_events.0013.d: "Je toho na mě příliš. Musím odejít."
 CANTORIA_GLOSS: "Zpěvácká tribuna je vyvýšená galerie v kostele, často umístěná nad chórem nebo poblíž křížení lodí. Zpěváci a později i varhany z ní doprovázeli liturgii."
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$: Jeho neochvějná láska"
 pam_great_projects_events.0012.desc: "Západní průčelí je hotové! Jeho portál je připraven vítat věřící v [Glossary('chrámové předsíni','NARTHEX_GLOSS')]. Stavba [cathedral_building.GetName] se možná dokončení dočká až za celý lidský život, ale dobří křesťané na území [owner.GetPrimaryTitle.GetNameNoTier] musí důvěřovat budoucnosti neochvějné lásky Páně. Mé kázání začíná...\n\n#EMP „[ROOT.Char.Custom('RandomBibleQuote')|U]“#!\n\n...a toto ponaučení z Písma jim zanechám."
 NARTHEX_GLOSS: "Chrámová předsíň neboli nartex leží mezi západním vchodem a chrámovou lodí. Uváděla věřící do posvátného prostoru a při přísnějších ritech oddělovala kajícníky a katechumeny od ostatních účastníků mše."
 pam_great_projects_events.0012.a: "„Blaze těm, kdo působí pokoj...“"
 pam_great_projects_events.0012.a.flavor: "„[Glossary('...neboť budou nazváni Božími dětmi.','MATTHEW_5_9_GLOSS')]“"
 pam_great_projects_events.0012.a.tt: "Každé [CZFaithAdjDecline(owner.GetFaith,'é')|l] [Concept('county','hrabství')|E] na území [owner.GetPrimaryTitle.GetNameNoTier] získá na #V 10 let#! [GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_peace_ai_behavior_tt$"
 pam_great_projects_events.0012.b: "„Jdi k mravenci, lenochu...“"
 pam_great_projects_events.0012.b.flavor: "„[Glossary('...pozoruj jeho cesty a zmoudři.','PROVERBS_6_6_GLOSS')]“"
 pam_great_projects_events.0012.b.tt: "Každé [CZFaithAdjDecline(owner.GetFaith,'é')|l] [Concept('county','hrabství')|E] na území [owner.GetPrimaryTitle.GetNameNoTier] získá na #V 10 let#! [GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_diligence_ai_behavior_tt$"
 pam_great_projects_events.0012.c: "„Vyzývám vás, bratři a sestry...“"
 pam_great_projects_events.0012.c.flavor: "„[Glossary('...ve jménu našeho Pána Ježíše Krista, abyste byli všichni zajedno a nebyly mezi vámi roztržky, abyste byli spojeni stejným smýšlením a stejným záměrem.','1_CORINTHIANS_1_10_GLOSS')]“"
 pam_great_projects_events.0012.c.tt: "Každé [CZFaithAdjDecline(owner.GetFaith,'é')|l] [Concept('county','hrabství')|E] na území [owner.GetPrimaryTitle.GetNameNoTier] získá na #V 10 let#! [GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_unity_ai_behavior_tt$"
 pam_great_projects_events.0012.d: "„Vždy se radujte, bez ustání se modlete...“"
 pam_great_projects_events.0012.d.flavor: "„[Glossary('...za všech okolností vzdávejte díky, neboť to je pro vás Boží vůle v Kristu Ježíši. Neuhášejte Ducha. Nepohrdejte proroctvími.','1_THESSALONIANS_5_16_20_GLOSS')]“"
 pam_great_projects_events.0012.d.tt: "Každé [CZFaithAdjDecline(owner.GetFaith,'é')|l] [Concept('county','hrabství')|E] na území [owner.GetPrimaryTitle.GetNameNoTier] získá na #V 10 let#! [GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$"
 pam_great_projects_events.0012.e: "„Vytrvale běžme závod, který je před námi...“"
 pam_great_projects_events.0012.e.flavor: "„[Glossary('Odložme každou přítěž i hřích, který se nás tak pevně drží, a vytrvale běžme závod, který je před námi.','HEBREWS_12_1_GLOSS')]“"
 pam_great_projects_events.0012.e.tt: "Každé [CZFaithAdjDecline(owner.GetFaith,'é')|l] [Concept('county','hrabství')|E] na území [owner.GetPrimaryTitle.GetNameNoTier] získá na #V 10 let#! [GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$"
 pam_great_projects_events.0012.f: "„Otevírá svou dlaň chudým...“"
 pam_great_projects_events.0012.f.flavor: "„[Glossary('...a své ruce vztahuje k potřebným.','PROVERBS_31_20_GLOSS')]“"
 pam_great_projects_events.0012.f.tt: "Každé [CZFaithAdjDecline(owner.GetFaith,'é')|l] [Concept('county','hrabství')|E] na území [owner.GetPrimaryTitle.GetNameNoTier] získá na #V 10 let#! [GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V]\n$pam_cathedral_sermon_charity_ai_behavior_tt$"
 pam_cathedral_sermon_peace_ai_behavior_tt: "#EMP #weak [CZFaithAdjSti(owner.GetFaith)|U] [Concept('rulers','vládci')|E] v [Concept('archdiocese','arcidiecézi')|E] se budou [Concept('behave','chovat')|E] čestněji a soucitněji#!#!"
 pam_cathedral_sermon_diligence_ai_behavior_tt: "#EMP #weak [CZFaithAdjSti(owner.GetFaith)|U] [Concept('rulers','vládci')|E] v [Concept('archdiocese','arcidiecézi')|E] se budou [Concept('behave','chovat')|E] pilněji a činoroději#!#!"
 pam_cathedral_sermon_unity_ai_behavior_tt: "#EMP #weak [CZFaithAdjSti(owner.GetFaith)|U] [Concept('rulers','vládci')|E] v [Concept('archdiocese','arcidiecézi')|E] se budou [Concept('behave','chovat')|E] družněji a čestněji#!#!"
 pam_cathedral_sermon_charity_ai_behavior_tt: "#EMP #weak [CZFaithAdjSti(owner.GetFaith)|U] [Concept('rulers','vládci')|E] v [Concept('archdiocese','arcidiecézi')|E] se budou [Concept('behave','chovat')|E] soucitněji a méně chamtivě#!#!"
 pam_cathedral_sermon_perseverance_ai_behavior_tt: "#EMP #weak [CZFaithAdjSti(owner.GetFaith)|U] [Concept('rulers','vládci')|E] v [Concept('archdiocese','arcidiecézi')|E] se budou [Concept('behave','chovat')|E] horlivěji a odvážněji ve víře#!#!"
 pam_cathedral_sermon_rejoice_ai_behavior_tt: "#EMP #weak [CZFaithAdjSti(owner.GetFaith)|U] [Concept('rulers','vládci')|E] v [Concept('archdiocese','arcidiecézi')|E] se budou [Concept('behave','chovat')|E] horlivěji a činoroději#!#!"
