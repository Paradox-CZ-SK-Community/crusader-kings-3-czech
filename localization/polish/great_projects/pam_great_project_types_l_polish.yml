 great_project_type_pam_mass_rite_conversion_desc: "[SelectLocalization( ObjectsEqual( GetPlayer.GetFaith.GetReligion.GetName, GetReligionByKey( 'christianity_religion' ).GetName ), 'great_project_type_pam_mass_rite_conversion_desc_christian', 'great_project_type_pam_mass_rite_conversion_desc_generic' )]"
 great_project_type_pam_mass_rite_conversion_desc_christian: "S dostatkem prostředků můžeme přinést světlo Páně nejen jednotlivým nevěřícím, ale celým pohanským [Concept('realms','panstvím')|E]. Pod naším vedením poznají ten nejpravověrnější [Concept('rite','ritus')|E], a tím rozšíří [Concept('christendom','křesťanstvo')|E]."
 great_project_type_pam_mass_rite_conversion_desc_generic: "S dostatkem prostředků můžeme šířit učení své víry nejen mezi jednotlivými konvertity, ale v celých [Concept('realms','panstvích')|E], kde dosud vládnou nepřátelské [Concept('faiths','víry')|E]. Pod naším vedením si jejich obyvatelé osvojí pravý [Concept('rite','ritus')|E] a posílí náš vliv v celé zemi."
