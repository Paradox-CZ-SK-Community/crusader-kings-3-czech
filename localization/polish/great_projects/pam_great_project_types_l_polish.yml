 pam_great_projects_events.0003.t: "$game_concept_grand_cathedral$: Světlo z barevného skla nad provincií [province.GetNameNoTooltip]" # todo: NEW TRANSLATION
 pam_great_projects_events.0003.desc: ""#EMP Jasné je to, co je jasně spojeno s jasným, a jasné bude vznešené dílo prostoupené novým světlem.#!" pronáší [religion_buddy.GetTitledFirstName], když spatří řezané sklo zářící na slunci.\n\nSklář [glazier.GetTitledFirstName] rozložil úlomky [Glossary('kovově zbarveného skla','POT_METAL_GLOSS')] na nabílené stoly, abychom si mohli lépe prohlédnout možné návrhy.\n\nProhlásím: „Toto okno bude vidět z hlavní lodi i z celé provincie [province.GetNameNoTooltip], musí znázorňovat...“" # todo: NEW TRANSLATION
 pam_great_projects_events.0003.a: "Jesseho strom, stvrzující legitimitu dynastie [ROOT.Char.GetDynastyNameNoTooltip]." # todo: NEW TRANSLATION
 pam_great_projects_events.0003.a.flavor: "[Glossary('Jesseho strom','TREE_OF_JESSE_GLOSS')]" # todo: NEW TRANSLATION
 pam_great_projects_events.0003.a.tt: "Po dokončení [grand_cathedral|E] bude její [point_of_interest|E] poskytovat členům [dynasty|E], kteří ji navštíví jako vedoucí [travel|E], @dynasty_prestige_icon![dynasty_prestige|E]" # todo: NEW TRANSLATION
 pam_great_projects_events.0003.b: "Donátorský panel s vaším portrétem a erbem." # todo: NEW TRANSLATION
 pam_great_projects_events.0003.b.tt: "Po dokončení [grand_cathedral|E] bude její [point_of_interest|E] poskytovat návštěvníkům @prestige_icon![prestige|E]" # todo: NEW TRANSLATION
 pam_great_projects_events.0003.c: "Výjevy poutnických zázraků, které přilákají věřící zdaleka." # todo: NEW TRANSLATION
 pam_great_projects_events.0003.c.tt: "Po dokončení [grand_cathedral|E] bude její [point_of_interest|E] poskytovat zvýšené [trait_level_track_xp|E] těm, kdo mají [trait|E] [GetTrait('pilgrim').GetName( GetNullCharacter )]" # todo: NEW TRANSLATION
 pam_great_projects_events.0003.d: "Mariánské okno s věčnou lampou před ním." # todo: NEW TRANSLATION
 pam_great_projects_events.0003.d.flavor: "Před skleněným obrazem [blessed_mary.GetTitledFirstName] bude udržovat hořící olejovou lampu a svíce." # todo: NEW TRANSLATION
 pam_great_projects_events.0003.d.tt: "Po dokončení [grand_cathedral|E] bude její [point_of_interest|E] poskytovat @stress_loss_icon![stress_loss|E] a [spiritual_fulfillment|E]" # todo: NEW TRANSLATION
 pam_great_projects_events.0003.d.dulia.tt: "Pokud máte [GetTenetType('tenet_dulia').GetBaseName] jako [personal_tenet|E], návštěva vám přinese větší [spiritual_fulfillment|E]" # todo: NEW TRANSLATION
 pam_great_projects_events.0003.e: "Cyklus mučednictví z rukou krále." # todo: NEW TRANSLATION
 pam_great_projects_events.0003.e.tt: "Po dokončení [grand_cathedral|E] bude její [point_of_interest|E] poskytovat horlivým návštěvníkům dodatečné @piety_icon![piety|E] a @stress_loss_icon![stress_loss|E]." # todo: NEW TRANSLATION
 pam_great_projects_events.0003.e.owner_msg.title: "Mučednictví ve skle" # todo: NEW TRANSLATION
 pam_great_projects_events.0003.e.owner_msg.desc: "[contributor.GetTitledFirstName] objednal/a pro [grand_cathedral|E] cyklus vitráží s výjevy mučednictví. Jejich námět vás vede k hlubší zbožnosti." # todo: NEW TRANSLATION
 TREE_OF_JESSE_GLOSS: "Jesseho strom znázorňuje Kristův rodokmen vyrůstající z ležící postavy Jesseho, otce Davida. Vitrážová okna kostelů zobrazovala biblickou královskou linii ve vztahu k vládnoucí dynastii a vyjadřovala tak božský původ královské moci. Významné příklady lze nalézt v Chartres a Saint-Denis." # todo: NEW TRANSLATION
 POT_METAL_GLOSS: "Kovově zbarvené sklo získává barvu v tavicím kotli, kde se do směsi vmíchávají oxidy kovů. Barva tak prostupuje celou tabulí, místo aby zůstávala na povrchu. Mistr sklář neboli vitrážník rozřezal vychladlé tabule na kusy a rozložil je na nabílené desky, aby zjistil, jak na ně dopadá světlo, než je zasadil do olověných rámečků." # todo: NEW TRANSLATION
 pam_great_projects_events.0005.t: "$game_concept_grand_cathedral$: Položení prvního kamene" # todo: NEW TRANSLATION
 pam_great_projects_events.0005.desc.intro: "První kámen je položen! Tak jako žalud předchází dubu, sídlo [owner.GetTitledFirstName] vyroste v úctu budící památník. Každý kámen a trám bude šířit slávu [ROOT.Char.GetFaith.HighGodName] mezi všechny [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] v [owner.GetPrimaryTitle.GetNameNoTier] i v širším křesťanském světě.\n\nVelkorysost [CharMyFirstNames(founder)|U], který financuje stavbu, se bude rozléhat zvukem zvonů a její ozvěna zazní v ústech každého věřícího." # todo: NEW TRANSLATION
 pam_great_projects_events.0005.desc.contributor: "\n\nPříspěvek [optional_contributor.GetTitledFirstNamePossessive] ve výši [contribution.GetName] navíc zajistí, že se na naši stavbu [cathedral_building.GetName] nikdy nezapomene." # todo: NEW TRANSLATION
 pam_great_projects_events.0005.desc.outro: "Velké dílo může začít!" # todo: NEW TRANSLATION
 pam_great_projects_events.0005.a: ""Naše děti se dočkají jejího dokončení."" # todo: NEW TRANSLATION
 pam_great_projects_events.0006.t: "$game_concept_grand_cathedral$: Vyměřena podle božského řádu" # todo: NEW TRANSLATION
 pam_great_projects_events.0006.desc.intro_architect: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] ukazuje na" # todo: NEW TRANSLATION
 pam_great_projects_events.0006.desc.intro_no_architect: "Dívám se na" # todo: NEW TRANSLATION
 pam_great_projects_events.0006.desc.intro: "řadu dřevěných kolíků, mezi nimiž jsou napnutá lana a vyznačují obrys obrovského kříže; představu budoucí stavby ve tvaru kříže." # todo: NEW TRANSLATION
 pam_great_projects_events.0006.desc.steward_founder: "\n\nS tímto postupem jsem se seznámil/a při studiích!\n\n„Musíte použít $pam_great_projects_events.0006.desc.ad_quadratum_ref$“" # todo: NEW TRANSLATION
 pam_great_projects_events.0006.desc.steward_architect: "\n\n„Jak se ale plánuje tak velkolepá stavba?“ ptám se." # todo: NEW TRANSLATION
 pam_great_projects_events.0006.desc.architect_explanation: "\n\n„Použijeme $pam_great_projects_events.0006.desc.ad_quadratum_ref$“" # todo: NEW TRANSLATION
 pam_great_projects_events.0006.desc.ad_quadratum_ref: "metodu [Glossary('ad quadratum','AD_QUADRATUM_GLOSS')]! Pán nám dal božský řád; pomocí čtverce můžeme vypočítat proporce stavby velkolepější než kterákoli [ROOT.Char.Custom('ResidenceBuilding')]."" # todo: NEW TRANSLATION
 pam_great_projects_events.0006.desc.foundations: "\n\nVidím, že se brzy začne kopat pro základy." # todo: NEW TRANSLATION
 pam_great_projects_events.0006.a: "Vybudujte kryptu pro předky dynastie [founder.GetDynastyNameNoTooltip]." # todo: NEW TRANSLATION
 pam_great_projects_events.0006.a.tt: "V [cathedral_complex|E] [owner.GetShortUINamePossessive] bude vybudována [GetDomicileBuilding('cathedral_crypt_01').GetName|V], která uctí [dynasty|E] [founder.GetDynastyName]" # todo: NEW TRANSLATION
 pam_great_projects_events.0006.b: "Rozšiřte hlavní loď, aby pojala poutníky." # todo: NEW TRANSLATION
 pam_great_projects_events.0006.b.tt: "Po dokončení [grand_cathedral|E] bude jeho [point_of_interest|E] poskytovat navštěvujícím poutníkům více [trait_level_track_xp|E] pro vlastnost [GetTrait('pilgrim').GetName( GetNullCharacter )] a @piety_icon![piety|E]" # todo: NEW TRANSLATION
 pam_great_projects_events.0006.c: "Nechť průběh stavby řídí sám Bůh." # todo: NEW TRANSLATION
 AD_QUADRATUM_GLOSS: "#EMP Ad quadratum#! — latinsky „podle čtverce“. Středověcí mistři kameníci vyměřovali staveniště pomocí jednoduchých proporčních soustav. Používali poměr délky strany čtverce k jeho úhlopříčce. Obdélník, jehož strany měly tyto dvě délky, považovali za harmonicky tvarovaný. Z této základní jednotky mohl kameník odvodit řadu větších i menších čtverců a obdélníků a zajistit, aby na sebe všechny části plánu navazovaly." # todo: NEW TRANSLATION
 pam_great_projects_events.0007.t: "$game_concept_grand_cathedral$: Nebeské klenby na žebrech" # todo: NEW TRANSLATION
 pam_great_projects_events.0007.desc.intro_architect: "Můj [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('architect'))] [architect.GetFirstName] mě vede obrovským lesem trámů. Lešení katedrály se tyčí jako dřevěný kostel sám o sobě a podpírá kameníky, kteří usilovně pracují na kamenných klenbách." # todo: NEW TRANSLATION
 pam_great_projects_events.0007.desc.intro_no_architect: "Procházím obrovským lesem trámů. Lešení katedrály se tyčí jako dřevěný kostel sám o sobě a podpírá kameníky pracující na klenbách." # todo: NEW TRANSLATION
 pam_great_projects_events.0007.desc.architect: "\n\n„Až budou tyto klenby dokončeny, ochrání věřící před rozmary počasí a povedou naše modlitby k nebesům.“" # todo: NEW TRANSLATION
 pam_great_projects_events.0007.desc.architect_says: "říká [architect.GetSheHe]." # todo: NEW TRANSLATION
 pam_great_projects_events.0007.desc.outro: "\n\nKdyž spočinu pohledem na dokončeném klenebním poli, připomene mi žebra obrovské ryby, která spolkla Jonáše. Taková je sláva Božího domu, že člověka může přenést pod mořskou hladinu nebo až ke hvězdám." # todo: NEW TRANSLATION
 pam_great_projects_events.0007.a: "Ozdobte klenby noční oblohou." # todo: NEW TRANSLATION
 pam_great_projects_events.0007.a.tt: "Po dokončení [grand_cathedral|E] bude její [point_of_interest|E] poskytovat zvýšené [trait_level_track_xp|E] těm, kdo mají [trait|E] [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]" # todo: NEW TRANSLATION
 pam_great_projects_events.0007.b: "Kážte o pokání v duchu Jonášova příběhu." # todo: NEW TRANSLATION
 pam_great_projects_events.0007.b.tt: "Vaše [faith|E] získá @fervor_icon!#P [EmptyScope.ScriptValue('trivial_fervor_value')|1]#! [fervor|E]" # todo: NEW TRANSLATION
 pam_great_projects_events.0007.c: "Nechte kameníky pokračovat v práci." # todo: NEW TRANSLATION
 fervor_gain_cathedral_jonah_sermon: "Pokání kázané při stavbě [grand_cathedral|E]" # todo: NEW TRANSLATION
 pam_great_projects_events.0008.t: "$game_concept_grand_cathedral$: Hlas Boží" # todo: NEW TRANSLATION
 pam_great_projects_events.0008.desc.intro: "Stavba dobře pokračuje, ale katedrála dosud nemá hlas, který by svolával věřící z celého [owner.GetPrimaryTitle.GetNameNoTier]." # todo: NEW TRANSLATION
 pam_great_projects_events.0008.desc.architect: "\n\n[architect.GetFirstName] mi říká, že musíme odlít velký bronzový zvon!" # todo: NEW TRANSLATION
 pam_great_projects_events.0008.desc.no_architect: "\n\nMusíme odlít zvon!" # todo: NEW TRANSLATION
 pam_great_projects_events.0008.desc.need_bell: "Je to riskantní a nákladný podnik; pokladna [founder.GetPrimaryTitle.GetNameNoTier] se dosud vzpamatovává už jen z ceny surovin." # todo: NEW TRANSLATION
 pam_great_projects_events.0008.desc.plague_named: "\n\nBohužel zvonař zahynul během epidemie [epidemic.GetName]." # todo: NEW TRANSLATION
 pam_great_projects_events.0008.desc.plague_generic: "\n\nBohužel zvonař zahynul při nedávném moru." # todo: NEW TRANSLATION
 pam_great_projects_events.0008.desc.outro: "Jeho syn, [bell_maker_son.GetFirstName], mě ujišťuje, že mu tajné vědomosti předal otec na smrtelné posteli a že dokáže odlít zvon." # todo: NEW TRANSLATION, CHECK FORMAT
 pam_great_projects_events.0008.desc.ordinary_body: "\n\n[bell_maker_son.GetFirstName], ctižádostivý mladý bronzotepec, který se učil u místního mistra, se přihlásil. [bell_maker_son.GetSheHe|U] touží dokázat [bell_maker_son.GetHerHis] hodnotu odlitím zvonu hodného stavby [cathedral_building.GetName] v [owner.GetPrimaryTitle.GetNameNoTier]." # todo: NEW TRANSLATION
 pam_great_projects_events.0008.a: "Jestli selže, zabiju ho." # todo: NEW TRANSLATION
 pam_great_projects_events.0008.a.tt: "Pokud se odlévání nezdaří, popravíte [bell_maker_son.GetShortUIName]" # todo: NEW TRANSLATION
 pam_great_projects_events.0008.belltower_may.tt: "V [cathedral_complex|E] [owner.GetShortUINamePossessive] může být postavena [GetDomicileBuilding('cathedral_belltower_02').GetName|V]" # todo: NEW TRANSLATION
 pam_great_projects_events.0008.aa: "Jestli selže, stáhnu mu maso z těla." # todo: NEW TRANSLATION
 pam_great_projects_events.0008.b: "Mohl by být nástrojem Páně." # todo: NEW TRANSLATION
 pam_great_projects_events.0008.b.tt: "Svěříte [bell_maker_son.GetShortUIName] odlití zvonu" # todo: NEW TRANSLATION
 pam_great_projects_events.0008.b.flavor: "Nebyl snad David ještě mladým pastýřem, když skolil Goliáše?" # todo: NEW TRANSLATION
 pam_great_projects_events.0008.c: "Najděte jistější volbu, i kdyby nebyla synem mistra." # todo: NEW TRANSLATION
 pam_great_projects_events.0008.duel.success: "Odlévání se podařilo! V [cathedral_complex|E] [owner.GetShortUINamePossessive] bude postavena [GetDomicileBuilding('cathedral_belltower_02').GetName|V]" # todo: NEW TRANSLATION
 pam_great_projects_events.0008.duel.failure: "Odlev se nezdařil... musíš se rozhodnout, jak pokračovat" # todo: NEW TRANSLATION
 pam_cathedral_bell_casting_duel: "[CHARACTER.GetShortUINamePossessive|U] [learning|E]" # todo: NEW TRANSLATION
 pam_cathedral_bell_casting_duel_first: "$pam_cathedral_bell_casting_duel$" # todo: NEW TRANSLATION
 pam_cathedral_bell_casting_duel_first_past: "$pam_cathedral_bell_casting_duel$" # todo: NEW TRANSLATION
 pam_cathedral_bell_casting_duel_third: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$" # todo: NEW TRANSLATION
 pam_cathedral_bell_casting_duel_third_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$" # todo: NEW TRANSLATION
 pam_cathedral_bell_casting_duel_global: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$" # todo: NEW TRANSLATION
 pam_cathedral_bell_casting_duel_global_past: "[CHARACTER.GetShortUIName|U]:\n $pam_cathedral_bell_casting_duel$" # todo: NEW TRANSLATION
 pam_great_projects_events.0009.t: "$game_concept_grand_cathedral$: A Bůh promluvil" # todo: NEW TRANSLATION
 pam_great_projects_events.0009.desc.body: "Sleduji, jak [bell_maker_son.GetFirstName] pobíhá sem a tam a organizuje dělníky.\n\n[bell_maker_son.GetSheHe|U] neustále zpochybňuje postupy otcova starého týmu a trvá na svém při výběru místa pro jámu, vhodné hlíny na formu i při vypalování pecí." # todo: NEW TRANSLATION, CHECK FORMAT
 pam_great_projects_events.0009.desc.body.architect: "[architect.GetFirstName] a já sledujeme, jak [bell_maker_son.GetFirstName] pobíhá sem a tam a organizuje dělníky.\n\n[bell_maker_son.GetSheHe|U] neustále zpochybňuje postupy otcova starého týmu a trvá na svém při výběru místa pro jámu, vhodné hlíny na formu i při vypalování pecí." # todo: NEW TRANSLATION, CHECK FORMAT
 pam_great_projects_events.0009.desc.success_end: "\n\nRoztavený bronz hladce vtéká do formy, jako by ho vedla Boží ruka, a vynořuje se z ní v celé své kráse. Pak je vyzdvižen a jeho jasný zvuk svolává všechny [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]:\n\n„Pojďte do domu Páně!“" # todo: NEW TRANSLATION
 pam_great_projects_events.0009.a: "Ať hlas Boží uslyší [province.Custom('GetTerrainType')|l] v [province.GetNameNoTooltip]." # todo: NEW TRANSLATION
 pam_great_projects_events.0010.t: "$game_concept_grand_cathedral$: Zvěstovatel zkázy!" # todo: NEW TRANSLATION
 pam_great_projects_events.0010.desc.body.architect: "$pam_great_projects_events.0009.desc.body.architect$" # todo: NEW TRANSLATION
 pam_great_projects_events.0010.desc.body: "$pam_great_projects_events.0009.desc.body$" # todo: NEW TRANSLATION
 pam_great_projects_events.0010.desc.failure_end: "\n\nRoztavený bronz ve formě skřípe, ale přesto se z ní vynoří v celé své kráse. Zvonec je vyzdvižen a tažen zpět, avšak když srdce udeří do věnce, ozve se jen tupá rána a po ní prasknutí. Zvěstovatel zkázy!" # todo: NEW TRANSLATION
 pam_great_projects_events.0010.a: "Sliby se musí plnit." # todo: NEW TRANSLATION
 pam_great_projects_events.0010.a.tt: "[bell_maker_son.GetShortUIName|U] je popraven" # todo: NEW TRANSLATION
 pam_great_projects_events.0010.b: "Prasklý zvon je dostatečným trestem." # todo: NEW TRANSLATION
 pam_great_projects_events.0010.b.faith: "Pán s ním má ještě své plány." # todo: NEW TRANSLATION
 pam_great_projects_events.0010.c: "Roztavte bronz. Ukovejte něco ostřejšího." # todo: NEW TRANSLATION
 pam_great_projects_events.0010.c.tt: "Z prasklého zvonu je znovu odlito mučicí zařízení; [bell_maker_son.GetShortUIName] se stává jeho první obětí. Budoucí řemeslníci v [founder.GetCapitalLocation.GetNameNoTooltip] se naučí poslušnosti." # todo: NEW TRANSLATION
 pam_great_projects_events.0010.c.intrigue_xp.tt: "Místo toho získáš [intrigue_lifestyle|E] [experience|E]" # todo: NEW TRANSLATION
 pam_great_projects_events.0010.d: "Ať je to poučení o pokoře." # todo: NEW TRANSLATION
 pam_great_projects_events.0011.t: "$game_concept_grand_cathedral$: Jako by zasáhla Pánova ruka" # todo: NEW TRANSLATION
 pam_great_projects_events.0011.desc.intro: "Při kontrole postupu stavby [cathedral_building.GetName] v [province.GetNameNoTooltip] mi uši naplňuje skřípavý zvuk mohutného otáčejícího se dřevěného mechanismu." # todo: NEW TRANSLATION
 pam_great_projects_events.0011.desc.architect: "\n\n[architect.GetFirstName] ukazuje na obrovské šlapací kolo, uvnitř kterého chodí dva dělníci." # todo: NEW TRANSLATION
 pam_great_projects_events.0011.desc.no_architect: "\n\nVšimnu si zdroje hluku: obrovského šlapacího kola, uvnitř kterého chodí dva dělníci." # todo: NEW TRANSLATION
 pam_great_projects_events.0011.desc.outro: "\n\nJako by rukou Boží jeho lana a kladky vytahovaly k rozestavěné střeše mohutné kusy čerstvě opracovaného [Glossary('kvádru','ASHLAR_GLOSS')] a vědra s maltou. S úžasem hledím na náklad, který by dole na dvoře zlomil nosičům zad." # todo: NEW TRANSLATION
 pam_great_projects_events.0011.a: "My [founder.GetCulture.GetCollectiveNounNoTooltip] musíme z velkého kola vytěžit, co se dá." # todo: NEW TRANSLATION
 pam_great_projects_events.0011.a.tt: "Tvoje [culture|E] získá @culture_icon!#P [EmptyScope.ScriptValue('pam_cathedral_treadwheel_fascination_progress_value')|0]#! pokroku směrem ke své současné [cultural_fascination|E]" # todo: NEW TRANSLATION
 pam_great_projects_events.0011.b: "Mnoho projektů v [founder.GetCapitalLocation.GetNameNoTooltip] by z toho mohlo těžit!" # todo: NEW TRANSLATION
 pam_great_projects_events.0011.c: "Působivé, ale podobné činy bych přenechal Pánu." # todo: NEW TRANSLATION
 ASHLAR_GLOSS: "Kvádry jsou přesně opracované kameny, jejichž povrch je vyhlazený a tvar upravený do pravoúhlého bloku. Bylo třeba přesně plánovat, aby kameny po vyzdvižení do výšky potřebné ke stavbě katedrály do sebe zapadly." # todo: NEW TRANSLATION
 pam_great_projects_events.0013.t: "$game_concept_grand_cathedral$: Vyšší poslání" # todo: NEW TRANSLATION
 pam_great_projects_events.0013.desc: "Nad námi se rozléhá úder kladívek tesařů, předzvěst akustiky, která brzy zahalí věřící Slovem Božím.\n\n[architect.GetFirstName] vysvětluje: „Bude to skromná galerie, odkud budou kanovníci vést liturgii, naše vlastní [Glossary('cantoria','CANTORIA_GLOSS')]! Vždyť k Pánu musíme promlouvat jiným hlasem než k lidem.“ [architect.GetSheHe|U] pak pokyne mladému sboristovi, [choir_boy.GetFirstName], aby přistoupil.\n\nChlapec vyšplhá po lešení a vydá ze sebe andělský tón; když se rozezní mezi zdmi a pronikne do mého těla, mám pocit, jako by mnou prošel Bůh." # todo: NEW TRANSLATION
 pam_great_projects_events.0013.a: "Rozšiřte galerii, čím více hlasů, tím lépe." # todo: NEW TRANSLATION
 pam_great_projects_events.0013.b: "Tento anděl musí zdobit můj dvůr." # todo: NEW TRANSLATION
 pam_great_projects_events.0013.castrato: "Zachovejte tento hlas pro cantorii Páně." # todo: NEW TRANSLATION
 pam_great_projects_events.0013.castrato.tt: "[choir_boy.GetShortUIName|U] je vykastrován, aby se [choir_boy.GetHerHis] hlas nezměnil" # todo: NEW TRANSLATION
 pam_great_projects_events.0013.c: "Tohle divadélko je jen úskok, jak mě obrat o peníze!" # todo: NEW TRANSLATION
 pam_great_projects_events.0013.d: "Jsem zdrcen a musím odejít." # todo: NEW TRANSLATION
 CANTORIA_GLOSS: "Cantoria je vyvýšená pěvecká galerie v kostele, obvykle nad chórem nebo poblíž křížení lodí, odkud zpěváci a později i varhany vedli liturgii." # todo: NEW TRANSLATION
 pam_great_projects_events.0012.t: "$game_concept_grand_cathedral$: Jeho neutuchající láska" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.desc: "Západní průčelí je hotové! Portál je připraven přivítat věřící v [Glossary('narthex','NARTHEX_GLOSS')]. Dokončení stavby [cathedral_building.GetName] může trvat celý život, ale dobří křesťané z [owner.GetPrimaryTitle.GetNameNoTier] musí věřit v budoucnost a nepomíjející lásku Páně. Začínám kázat...\n\n#EMP "[ROOT.Char.Custom('RandomBibleQuote')]"#!\n\n...a zanechám jim toto poučení z Písma." # todo: NEW TRANSLATION
 NARTHEX_GLOSS: "Narthex je vstupní síň kostela mezi západními dveřmi a hlavní lodí. Vítala věřící v posvátném prostoru a v přísnějších obřadech oddělovala kajícníky a katechumeny od shromáždění při mši." # todo: NEW TRANSLATION
 pam_great_projects_events.0012.a: "„Blahoslavení tvůrci pokoje...“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.a.flavor: "„[Glossary('...neboť oni budou nazváni syny Božími.','MATTHEW_5_9_GLOSS')]“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.a.tt: "Každá [owner.GetFaith.GetAdjective] [county|E] v [owner.GetPrimaryTitle.GetNameNoTier] získá [GetModifier('pam_cathedral_sermon_peace_county_modifier').GetNameWithTooltip|V] na #V 10 let#!\n$pam_cathedral_sermon_peace_ai_behavior_tt$" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.b: "„Jdi k mravenci, lenochu...“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.b.flavor: "„[Glossary('...pozoruj jeho počínání a zmoudři.','PROVERBS_6_6_GLOSS')]“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.b.tt: "Každá [owner.GetFaith.GetAdjective] [county|E] v [owner.GetPrimaryTitle.GetNameNoTier] získá [GetModifier('pam_cathedral_sermon_diligence_county_modifier').GetNameWithTooltip|V] na #V 10 let#!\n$pam_cathedral_sermon_diligence_ai_behavior_tt$" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.c: "„Prosím vás, bratři a sestry...“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.c.flavor: "„[Glossary('...jménem našeho Pána Ježíše Krista, abyste všichni byli svorní a neměli mezi sebou roztržky, nýbrž abyste byli pevně spojeni jednou myslí a jedním záměrem.','1_CORINTHIANS_1_10_GLOSS')]“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.c.tt: "Každá [owner.GetFaith.GetAdjective] [county|E] v [owner.GetPrimaryTitle.GetNameNoTier] získá [GetModifier('pam_cathedral_sermon_unity_county_modifier').GetNameWithTooltip|V] na #V 10 let#!\n$pam_cathedral_sermon_unity_ai_behavior_tt$" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.d: "„Radujte se stále, neustále se modlete...“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.d.flavor: "„[Glossary('...za všech okolností děkujte, neboť to je vůle Boží v Kristu Ježíši pro vás. Ducha nezhášejte. Proroctvím nepohrdejte.','1_THESSALONIANS_5_16_20_GLOSS')]“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.d.tt: "Každá [owner.GetFaith.GetAdjective] [county|E] v [owner.GetPrimaryTitle.GetNameNoTier] získá [GetModifier('pam_cathedral_sermon_rejoice_county_modifier').GetNameWithTooltip|V] na #V 10 let#!\n$pam_cathedral_sermon_rejoice_ai_behavior_tt$" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.e: "„Běžme vytrvale závod, který je před námi...“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.e.flavor: "„[Glossary('Odložme i my veškerou přítěž i hřích, který se nás tak snadno přichytí, a vytrvale běžme závod, který je před námi.','HEBREWS_12_1_GLOSS')]“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.e.tt: "Každá [owner.GetFaith.GetAdjective] [county|E] v [owner.GetPrimaryTitle.GetNameNoTier] získá [GetModifier('pam_cathedral_sermon_perseverance_county_modifier').GetNameWithTooltip|V] na #V 10 let#!\n$pam_cathedral_sermon_perseverance_ai_behavior_tt$" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.f: "„Svou dlaň otvírá chudému...“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.f.flavor: "„[Glossary('...a své ruce vztahuje k nuznému.','PROVERBS_31_20_GLOSS')]“" # todo: NEW TRANSLATION
 pam_great_projects_events.0012.f.tt: "Každá [owner.GetFaith.GetAdjective] [county|E] v [owner.GetPrimaryTitle.GetNameNoTier] získá [GetModifier('pam_cathedral_sermon_charity_county_modifier').GetNameWithTooltip|V] na #V 10 let#!\n$pam_cathedral_sermon_charity_ai_behavior_tt$" # todo: NEW TRANSLATION
