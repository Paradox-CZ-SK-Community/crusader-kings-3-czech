 pam_cathedral_sermon_diligence_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] v [archdiocese|E] se budou [behave|E] pilněji a energičtěji#!#!" # todo: NEW TRANSLATION
 pam_cathedral_sermon_unity_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] v [archdiocese|E] se budou [behave|E] společensky a čestněji#!#!" # todo: NEW TRANSLATION
 pam_cathedral_sermon_charity_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] v [archdiocese|E] se budou [behave|E] soucitněji a méně lakotně#!#!" # todo: NEW TRANSLATION
 pam_cathedral_sermon_perseverance_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] v [archdiocese|E] budou [behave|E] horlivěji a odvážněji ve víře#!#!" # todo: NEW TRANSLATION
 pam_cathedral_sermon_rejoice_ai_behavior_tt: "#EMP #weak [owner.GetFaith.GetAdjective] [rulers|E] v [archdiocese|E] budou [behave|E] horlivěji a energičtěji#!#!" # todo: NEW TRANSLATION
