l_polish:
 great_project_type_pam_cathedral_01: "Vybudovat $building_type_great_project_cathedral_01$"
 great_project_type_pam_cathedral_01_desc: "Vztyč zářící kříž nad pevnými kamennými zdmi, nad vznešenými kopulemi a vysokými věžemi! Přines na zem podivuhodné světlo nebes, ať ozáří trůn i oltář svatého preláta.\n\nPo letech ušlechtilé dřiny se rozzáří mocný maják pro věřící zblízka i zdaleka."
 great_project_type_pam_cathedral_02: "Vybudovat $building_type_great_project_cathedral_02$"
 great_project_type_pam_cathedral_02_desc: "Ať lomené oblouky stoupají k nebi a vitráže planou!\n\nTato vznešená katedrála se znovuzrodí jako Lazar a povede nás do nového věku."
 great_project_type_pam_cathedral_03: "Vybudovat $building_type_great_project_cathedral_03$"
 great_project_type_pam_cathedral_03_desc: "Ať ozdobné kružby a vinuté kamenné tvary vytvoří korunu svatého ohně, zvěstující novou éru této slavné stavby!\n\nPo dlouhém rozšiřování se z dosavadní stavby [GetBuilding('great_project_cathedral_02').GetName|V] stane [GetBuilding('great_project_cathedral_03').GetName|V] a její věže povedou věřící až do konce časů."
