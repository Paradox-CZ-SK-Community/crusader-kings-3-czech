 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$: Korunování věží"
 pam_great_projects_events.0020.desc: "Konečně jsou na věžích upevněny kříže, každý jako ten Kristův, který před dávnými časy stál na návrší zvaném [Glossary('Golgota','GOLGOTHA_GLOSS')]. Připomínají Jeho utrpení pro naši spásu a slibují Jeho krev, která bude každou neděli proudit, aby nás očistila od hříchu.\n\nOd začátku stavby se ze synů stali otcové a z otců starci, kteří už spočívají v zemi. Jejich ušlechtilá dřina, pot i krev jsou však zvěčněny v kameni.\n\nŘíše mohou padnout, ale [cathedral_building.GetName] v sídle [province.GetName] potrvá navěky jako Boží láska."
 pam_great_projects_events.0020.a: "Přijďte zblízka i zdaleka a modlete se s námi!"
 GOLGOTHA_GLOSS: "Golgota, latinsky #EMP Calvariae locus#! neboli „místo lebky“, byla návrším ve tvaru lebky v římském Jeruzalémě a místem Ježíšova ukřižování. Poprava se odehrála za městskými hradbami, nedaleko hrobu, do něhož byl uložen. Dnes toto místo zahrnuje chrám Božího hrobu, poblíž něhož stojí [GetBuilding('dome_of_the_rock_01').GetName|V]"
 poi_grand_cathedral_visit: "Návštěva katedrály v sídle [province.GetNameNoTooltip]"
