 pam_great_projects_events.0020.t: "$game_concept_grand_cathedral$: Korunování věží" # todo: NEW TRANSLATION
 pam_great_projects_events.0020.desc: "Konečně jsou na věžích vztyčeny kříže, každý jako ten Kristův před dávnými časy na pahorku v [Glossary('Golgota','GOLGOTHA_GLOSS')]. Připomínají Jeho utrpení za naši spásu a jsou příslibem Jeho krve, která každou neděli proudí, aby nás očistila od hříchu.\n\nOd začátku stavby se ze synů stali otcové a z otců starci, kteří zemřeli a spočinuli v zemi. Jejich vznešená práce, pot a krev však žijí navěky v kameni.\n\nŘíše mohou padnout, ale [cathedral_building.GetName] v [province.GetName] bude stát věčně jako Boží láska." # todo: NEW TRANSLATION
 pam_great_projects_events.0020.a: "Z blízka i z daleka, pojďte s námi uctívat Pána!" # todo: NEW TRANSLATION
 GOLGOTHA_GLOSS: "Golgota, odvozená z latinského #EMP Calvariae locus#! neboli „místo lebky“, byla pahorkem ve tvaru lebky v římském Jeruzalémě a místem Ježíšova ukřižování. Poprava se konala za městskými hradbami nedaleko hrobu, v němž byl pohřben. Toto místo se nyní nachází v Chrámu Božího hrobu nedaleko [GetBuilding('dome_of_the_rock_01').GetName|V]" # todo: NEW TRANSLATION
