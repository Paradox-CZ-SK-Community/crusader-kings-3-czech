 great_project_type_pam_mass_rite_conversion_desc_christian: "S dostatkem prostředků můžeme přinést Pánovo světlo nejen jednotlivým pohanům, ale celým pohanským [realms|E]. Pod naším vedením poznají nejsprávnější [rite|E] a rozšíří tak [christendom|E]." # todo: NEW TRANSLATION
 great_project_type_pam_mass_rite_conversion_desc_generic: "S dostatkem prostředků můžeme šířit víru za hranice roztroušených konvertitů až do celých [realms|E], v nichž stále převládají nepřátelské [faiths|E]. Pod naším vedením se jejich lid naučí správnému [rite|E], čímž posílí naši víru po celé zemi." # todo: NEW TRANSLATION
