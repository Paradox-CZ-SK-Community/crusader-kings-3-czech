l_polish:
 ARMY_AUTOMATION_FEATURE_NAME: "Automatizované armády"
 AOV_HEADING: "Nastavení automatizované armády"
 AOV_APPLY: "$BARBERSHOP_APPLY$"
 AOV_SET_TO_DEFAULT: "$CHARACTER_RESET_FILTERS$"
 AOV_SET_TO_DEFAULT_TT: "[AddLocalizationIf( ArmyAutomationOptionsView.AreDisplayedSettingsDefault, 'AOV_SET_TO_DEFAULT_TT_CONTENT' )]"
 AOV_SET_TO_DEFAULT_TT_CONTENT: "@warning_icon! #X Nastavení jsou již výchozí#!"
 AOV_COMPANION_OFF_WARNING: "@alert_icon! Tato nastavení nemají žádný účinek, dokud je funkce $ARMY_AUTOMATION_FEATURE_NAME$ vypnutá"
 AOV_AUTOMATED: "Automatizované"
 AOV_MANUAL: "Ruční"
 AOV_OPT_COMMANDERS: "Přiřazovat velitele"
 AOV_OPT_COMMANDERS_NOT_PLAYERS: "Omezeně"
 AOV_OPT_COMMANDERS_NOT_PLAYERS_TT: "#T Omezené přiřazování velitelů\n#![Concept('commanders','Velitelé')|E] jsou k tvým [Concept('armies','armádám')|E] přiřazováni automaticky, ale ty nikdy nebudeš přiřazen jako velitel"
 AOV_OPT_COMMANDERS_AUTOMATED_TT: "#T Automatizované přiřazování velitelů\n#![Concept('commanders','Velitelé')|E] jsou k tvým [Concept('armies','armádám')|E] přiřazováni automaticky"
 AOV_OPT_COMMANDERS_MANUAL_TT: "#T Ruční přiřazování velitelů\n#![Concept('commanders','Velitele')|E] ke svým [Concept('armies','armádám')|E] musíš přiřazovat ručně"
 AOV_OPT_WAR_STANCE: "Válečný postoj"
 AOV_OPT_WAR_STANCE_DEFAULT: "Přizpůsobivý"
 AOV_OPT_WAR_STANCE_DEFAULT_TT: "#T Přizpůsobivý postoj\n#!Tvé [Concept('armies','armády')|E] budou podle situace jednat útočně nebo obranně"
 AOV_OPT_WAR_STANCE_OFFENSIVE: "Útočný"
 AOV_OPT_WAR_STANCE_OFFENSIVE_TT: "#T Útočný postoj\n#!Tvé [Concept('armies','armády')|E] budou vždy jednat útočně"
 AOV_OPT_WAR_STANCE_DEFENSIVE: "Obranný"
 AOV_OPT_WAR_STANCE_DEFENSIVE_TT: "#T Obranný postoj\n#!Tvé [Concept('armies','armády')|E] budou vždy jednat obranně"
 AOV_OPT_RAIDING: "Plenění"
 AOV_OPT_RAIDING_AUTOMATED_TT: "#T Automatizované plenění\n#!Tvé [Concept('raider','nájezdnické')|E] [Concept('armies','armády')|E] se samy povolají a podniknou $game_concept_raids$"
 AOV_OPT_RAIDING_MANUAL_TT: "#T Ruční směňování\n#!Své [Concept('barterer','směnné')|E] [Concept('armies','výpravy')|E] ovládáš a povoláváš sám"
 AOV_OPT_BARTERING: "Směňování"
 AOV_OPT_BARTERING_AUTOMATED_TT: "#T Automatizované směňování\n#!Tvé [Concept('barterer','směnné')|E] [Concept('armies','výpravy')|E] se samy povolají a vydají se na mise $game_concept_barter$"
 AOV_OPT_BARTERING_MANUAL_TT: "#T Ruční směňování\n#!Své [Concept('barterer','směnné')|E] [Concept('armies','výpravy')|E] ovládáš a povoláváš sám"
 AOV_OPT_HIRING: "Najímání vojsk"
 AOV_OPT_HIRING_FULL: "Najmout a prodloužit"
 AOV_OPT_HIRING_FULL_TT: "#T Automatizované najímání\n#![Concept('mercenaries','Žoldnéři')|E], [Concept('holy_orders','svaté řády')|E] a [Concept('provincial_armies','provinční armády')|E] budou placeni automaticky a [Concept('mercenary_contracts','žoldnéřské smlouvy')|E] budou v případě potřeby pro válečné úsilí prodlouženy"
 AOV_OPT_HIRING_EXTEND: "Pouze prodloužit"
 AOV_OPT_HIRING_EXTEND_TT: "#T Automatizované prodlužování žoldnéřských smluv\n#![Concept('mercenary_contracts','Žoldnéřské smlouvy')|E] budou v případě potřeby pro válečné úsilí prodlouženy"
 AOV_OPT_HIRING_MANUAL_TT: "#T Ruční najímání\n#![Concept('mercenaries','Žoldnéře')|E], [Concept('holy_orders','svaté řády')|E] a [Concept('provincial_armies','provinční armády')|E] musíš platit ručně"
 MV_AUTOMATION_TOGGLE_TT: "[SelectLocalization( GetPlayer.HasCompanionAI, 'MV_AUTOMATION_TOGGLE_TT_ON', 'MV_AUTOMATION_TOGGLE_TT_OFF' )]"
 MV_AUTOMATION_TOGGLE_TT_ON: "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V Povoleno#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I Kliknutím automatizaci vypneš#!"
 MV_AUTOMATION_TOGGLE_TT_OFF: "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V Vypnuto#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I Kliknutím automatizaci zapneš#!"
 MV_AUTOMATION_TOGGLE_TT_DESC: "[SelectLocalization(GetPlayer.HasDefaultCompanionAISettings, 'MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC' , 'MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC')]"
 MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC: "Je-li zapnuto, tvé [Concept('armies','armády')|E] se samy povolají, bojují s nepřítelem a přiřazují si vlastní [Concept('commanders','velitele')|E].\n\nStále zodpovídáš za nákup [Concept('men_at_arms','ozbrojenců')|E], najímání [Concept('mercenaries','žoldnéřů')|E] a podnikání [Concept('raids','nájezdů')|E].\n\n#help Automatizované armády jsou určeny pro hráče, kteří nejsou obeznámeni s vedením války nebo se chtějí soustředit na něco jiného. Pokud jsi zkušený hráč, doporučujeme, abys své armády ovládal sám.#!"
 MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC: "Je-li zapnuto, tvé [Concept('armies','armády')|E] jednají samostatně, ale řídí se nastaveními, která sis zvolil."
 MV_AUTOMATION_SETTINGS_TT: "#T Otevřít $AOV_HEADING$\n#!Změnit výchozí chování funkce $ARMY_AUTOMATION_FEATURE_NAME$"
