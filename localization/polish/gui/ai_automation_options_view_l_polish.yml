l_polish:
 ARMY_AUTOMATION_FEATURE_NAME: "Automatizované armády"
 AOV_HEADING: "Nastavení automatizace armády"
 AOV_APPLY: "$BARBERSHOP_APPLY$"
 AOV_SET_TO_DEFAULT: "$CHARACTER_RESET_FILTERS$"
 AOV_SET_TO_DEFAULT_TT: "[AddLocalizationIf( ArmyAutomationOptionsView.AreDisplayedSettingsDefault, 'AOV_SET_TO_DEFAULT_TT_CONTENT' )]"
 AOV_SET_TO_DEFAULT_TT_CONTENT: "@warning_icon! #X Nastavení jsou již výchozí#!"
 AOV_COMPANION_OFF_WARNING: "@alert_icon! Tato nastavení nemá žádný účinek, pokud je automatizace armády vypnuta"
 AOV_AUTOMATED: "Automatizované"
 AOV_MANUAL: "Manuální"
 AOV_OPT_COMMANDERS: "Přiřazování velitelů"
 AOV_OPT_COMMANDERS_NOT_PLAYERS: "Omezené"
 AOV_OPT_COMMANDERS_NOT_PLAYERS_TT: "#T Omezené přiřazování $game_concept_commander$\n#![Concept('commanders','velitelé')|E] jsou automaticky přiřazováni k vašim [Concept('armies','armádám')|E], ale vám nikdy není přiřazeno být velitelem" # todo: CONCEPT CASE
 AOV_OPT_COMMANDERS_AUTOMATED_TT: "#T Automatické přiřazování $game_concept_commander$\n#![Concept('commanders','velitelé')|E] jsou automaticky přiřazováni k vašim [Concept('armies','armádám')|E]" # todo: CONCEPT CASE
 AOV_OPT_COMMANDERS_MANUAL_TT: "#T Manuální přiřazování $game_concept_commander$\n#!Musíte ručně přiřadit [Concept('commanders','velitele')|E] k vašim [Concept('armies','armádám')|E]"
 AOV_OPT_WAR_STANCE: "Válečný postoj"
 AOV_OPT_WAR_STANCE_DEFAULT: "Adaptivní"
 AOV_OPT_WAR_STANCE_DEFAULT_TT: "#T Adaptivní postoj\n#!Vaše [Concept('armies','armády')|El] se budou chovat útočně nebo obranně v závislosti na situaci" # todo: CONCEPT CASE
 AOV_OPT_WAR_STANCE_OFFENSIVE: "Útočný"
 AOV_OPT_WAR_STANCE_OFFENSIVE_TT: "#T Útočný postoj\n#!Vaše [Concept('armies','armády')|El] se budou vždy chovat útočně" # todo: CONCEPT CASE
 AOV_OPT_WAR_STANCE_DEFENSIVE: "Obranný"
 AOV_OPT_WAR_STANCE_DEFENSIVE_TT: "#T Obranný postoj\n#!Vaše [Concept('armies','armády')|El] se budou vždy chovat obranně" # todo: CONCEPT CASE
 AOV_OPT_RAIDING: "Nájezdy"
 AOV_OPT_RAIDING_AUTOMATED_TT: "#T Automatické nájezdy\n#!Vaše [Concept('raider','nájezdnícke')|E] [Concept('armies','armády')|El] se samy mobilizují a vypraví na nájezdy" # todo: CONCEPT CASE
 AOV_OPT_RAIDING_MANUAL_TT: "#T Ruční barterování\n#!Ovládáte a svoláváte své vlastní [Concept('barterer','směnnou výpravu')|E] [Concept('armies','armádu')|E]" # todo: CONCEPT CASE
 AOV_OPT_BARTERING: "Barterování" # todo: NEW TRANSLATION
 AOV_OPT_BARTERING_AUTOMATED_TT: "#T Automatické barterování\n#!Vaše [Concept('barterer','směnná výprava')|E] [Concept('armies','armády')|E] se automaticky povolají a samy vyrazí na mise $game_concept_barter$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 AOV_OPT_BARTERING_MANUAL_TT: "#T Manuální barterování\n#!Vy ovládáte a povoláváte své vlastní [Concept('barterer','směnnou výpravu')|E] [Concept('armies','armádu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 AOV_OPT_HIRING: "Najímání vojska"
 AOV_OPT_HIRING_FULL: "Najímat a prodlužovat"
 AOV_OPT_HIRING_FULL_TT: "#T Automatické najímání\n#![Concept('mercenaries','žoldnéři')|E], [Concept('holy_orders','svaté řády')|El] a [Concept('provincial_armies','provinční armády')|El] budou automaticky placeni a [Concept('mercenary_contracts','žoldnérské smlouvy')|E] budou prodlužovány podle potřeby pro válečné úsilí" # todo: CONCEPT CASE
 AOV_OPT_HIRING_EXTEND: "Pouze prodlužovat"
 AOV_OPT_HIRING_EXTEND_TT: "#T Automatické prodlužování smluv žoldáků\n#![Concept('mercenary_contracts','žoldnéřských smluv')|E] budou prodlužovány, pokud to bude potřeba pro válečné úsilí" # todo: CONCEPT CASE
 AOV_OPT_HIRING_MANUAL_TT: "#T Manuální najímání\n#!Musíte ručně platit za [Concept('mercenaries','žoldnéře')|E], [Concept('holy_orders','svaté řády')|E] a [Concept('provincial_armies','provinční armády')|E]" # todo: CONCEPT CASE
 MV_AUTOMATION_TOGGLE_TT: "[SelectLocalization( GetPlayer.HasCompanionAI, 'MV_AUTOMATION_TOGGLE_TT_ON', 'MV_AUTOMATION_TOGGLE_TT_OFF' )]"
 MV_AUTOMATION_TOGGLE_TT_ON: "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V Zapnuto#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I Klikněte pro vypnutí automatizace#!"
 MV_AUTOMATION_TOGGLE_TT_OFF: "#T $ARMY_AUTOMATION_FEATURE_NAME$: #V Vypnuto#!\n#!$MV_AUTOMATION_TOGGLE_TT_DESC$\n\n#I Klikněte pro zapnutí automatizace#!"
 MV_AUTOMATION_TOGGLE_TT_DESC: "[SelectLocalization(GetPlayer.HasDefaultCompanionAISettings, 'MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC' , 'MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC')]"
 MV_AUTOMATION_TOGGLE_TT_DEFAULT_DESC: "Pokud je zapnuto, vaše [Concept('armies','armády')|E] se samy svolávají a bojují proti nepříteli a přidělují si vlastního [Concept('commanders','velitele')|E].\n\nStále jste zodpovědní za nákup [Concept('men_at_arms','ozbrojenci')|E], najímání [Concept('mercenaries','žoldnéři')|E] a vyjíždění na [Concept('raids','nájezdy')|E].\n\n#help Automatizované armády jsou určeny hráčům, kteří nejsou obeznámeni s válčením, nebo chtějí věnovat svou pozornost něčemu jinému. Pokud jste zkušený hráč, doporučujeme ovládat své armády sami.#!" # todo: CONCEPT CASE
 MV_AUTOMATION_TOGGLE_TT_CUSTOM_DESC: "Po zapnutí se vaše [Concept('armies','armády')|El] chovají samostatně, ale jsou omezeny nastavením, které jste zvolili." # todo: CONCEPT CASE
 MV_AUTOMATION_SETTINGS_TT: "#T Otevřít $AOV_HEADING$\n#!Změňte výchozí chování pro $ARMY_AUTOMATION_FEATURE_NAME$"
