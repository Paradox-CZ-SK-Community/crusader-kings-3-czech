 theocratic_elective_pious: "Zbožný" # todo: NEW TRANSLATION
 theocratic_elective_pious_desc: "#flavor Kolegium musí předložit jméno, které nikdo nemůže označit za nehodné — kardinála, jehož život už nyní připomíná život světce.#!\n\nAbys dosáhl #EMP $theocratic_elective_pious$#!, musíš vynikat svatostí nad všemi ostatními [cardinal|E]. Největší váhu má [piety_level|E], po něm následuje [learning|E] a také to, jak daleko jsi pokročil jako [GetTrait('lifestyle_scholar').GetName( GetPlayer )], [GetTrait('pilgrim').GetName( GetPlayer )] nebo [GetTrait('lifestyle_mystic').GetName( GetPlayer )]. Každý [sin|E] na tvém jméně tě stojí víc, než ti přinese [virtue|E].[GetPlayer.Custom('GetPamPapabileOwnScorePious')]" # todo: NEW TRANSLATION
 theocratic_elective_populist: "Lidový" # todo: NEW TRANSLATION
 theocratic_elective_populist_desc: "#flavor Papež, jehož věřící nebudou následovat, není žádný papež. Kolegium proto předloží jméno, kterému už nyní provolávají slávu v ulicích.#!\n\nAbys dosáhl #EMP $theocratic_elective_populist$#!, musíš vynikat věhlasem nad všemi ostatními [cardinal|E]. Zvyšuj svou [prestige_level|E] a [diplomacy|E], udržuj si [friends|E] v rámci [college_of_cardinals|E], měj [personal_tenets|E] s vysokou [tenet_popularity|E] a využívej [decision|E] [GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName].[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]" # todo: NEW TRANSLATION
 theocratic_elective_powerful: "Mocný" # todo: NEW TRANSLATION
 theocratic_elective_powerful_desc: "#flavor Trůn svatého Petra má nepřátele stejně jako stoupence, a proto kolegium předloží jméno preláta, který má prostředky k jeho udržení.#!\n\nAbys dosáhl #EMP $theocratic_elective_powerful$#!, musíš vynikat světskou mocí nad všemi ostatními [cardinal|E]. Usiluj o rozšíření svého [rite|E] do dalších [counties|E], ovládni [holy_sites|E], zvyšuj [dynasty_prestige_level|E] — nebo využij [character_interaction|E] #V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#! a zaplať si cestu na přední příčky.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]" # todo: NEW TRANSLATION
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]" # todo: NEW TRANSLATION
