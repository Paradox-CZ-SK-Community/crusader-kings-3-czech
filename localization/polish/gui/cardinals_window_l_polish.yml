 theocratic_elective_pious: "Zbožný"
 theocratic_elective_pious_desc: "#flavor Kolegium musí předložit jméno, které nikdo nemůže označit za nehodné – kardinála, jehož život už nyní připomíná život světce.#!\n\nChceš-li se stát #EMP $theocratic_elective_pious$#!, musíš ve zbožnosti předčit všechny ostatní [Concept('cardinals','kardinály')|E]. Zdaleka největší váhu má [Concept('piety_level','úroveň oddanosti')|E], poté [Concept('learning','učenost')|E] a postup v rysech: [GetTrait('lifestyle_scholar').GetName(GetPlayer)], [GetTrait('pilgrim').GetName(GetPlayer)] a [GetTrait('lifestyle_mystic').GetName(GetPlayer)]. Jediný [Concept('sin','hřích')|E] tě poškodí více, než ti jedna [Concept('virtue','ctnost')|E] pomůže.[GetPlayer.Custom('GetPamPapabileOwnScorePious')]"
 theocratic_elective_populist: "Oblíbenec lidu"
 theocratic_elective_populist_desc: "#flavor Papež, kterého věřící nebudou následovat, není žádným papežem, a tak kolegium předkládá jméno, které už nyní oslavují ulice.#!\n\nChceš-li se stát #EMP $theocratic_elective_populist$#!, musíš ve věhlasu předčit všechny ostatní [Concept('cardinals','kardinály')|E]. Zvyšuj svou [Concept('prestige_level','úroveň slávy')|E] a [Concept('diplomacy','diplomacii')|E], udržuj si [Concept('friends','přátele')|E] v [Concept('college_of_cardinals','Kardinálském kolegiu')|E], měj [Concept('personal_tenets','osobní zásady')|E] s vysokou [Concept('tenet_popularity','rozšířeností')|E] a využívej [Concept('decision','rozhodnutí')|E]: [GetDecision('pam_promulgate_word_of_pious_deeds_decision').GetName].[GetPlayer.Custom('GetPamPapabileOwnScorePopulist')]"
 theocratic_elective_powerful: "Mocný"
 theocratic_elective_powerful_desc: "#flavor Trůn svatého Petra má nejen stoupence, ale i nepřátele, a tak kolegium předkládá preláta, který má prostředky k jeho udržení.#!\n\nChceš-li se stát #EMP $theocratic_elective_powerful$#!, musíš ve světské moci předčit všechny ostatní [Concept('cardinals','kardinály')|E]. Rozšiř svůj [Concept('rite','ritus')|E] do více [Concept('counties','hrabství')|E], ovládej [Concept('holy_sites','svatá místa')|E], zvyšuj svou [Concept('dynasty_prestige_level','úroveň věhlasu')|E] – nebo si pomocí #V #TOOLTIP:tt_increase_papabile_score_interaction [GetPlayer.GetPlayerInteractionName('increase_papabile_score_interaction')|L]#!#! [Concept('character_interaction','interakce s postavou')|E] zaplať cestu do čela.[GetPlayer.Custom('GetPamPapabileOwnScorePowerful')]"
 tt_increase_papabile_score_interaction: "[GetPlayer.GetPlayerInteractionTooltip('increase_papabile_score_interaction')]"
