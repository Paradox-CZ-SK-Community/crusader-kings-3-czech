 event_window_widget_peasant_leader_tooltip: "Místní sedláci neustále bojují proti svým pánům. Jako [Concept('adventurer','dobrodruh')|El] jste jen pozorovatelem. Pokud však chcete, můžete jednat na vlastní pěst. Rozhodněte, kdo má pravdu a kdo ne, zvolte stranu a podpořte ji." # todo: CONCEPT CASE
 event_window_widget_peasant_leader_tooltip_widget: "Připomínka, kolik [Concept('counties','hrabství')|El] jste se rozhodli podpořit nebo ovládat. Pokud dojde k válce, sedláci ze všech podporovaných hrabství se přidají pod vaše prapory!" # todo: CONCEPT CASE
