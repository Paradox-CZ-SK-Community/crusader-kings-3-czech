 event_window_widget_harrying_tooltip: "Probíhající souboj mezi novými a starými vedl k tomu, že po celé Anglii vypukla nevyhlášená válka, přičemž noví normanští vládci tvrdě reagují na provokace sesazených anglosaských šlechticů.\n\nJak se situace vyvíjí, budou činy, které oni a ostatní postavy podniknou, určovat úrovně [Concept('harrying_resistance','odporu')|E] a [Concept('harrying_pacification','pacifikace')|E] v regionu.\n\n#TS Vyšší #EMP [Concept('harrying_resistance','odpor')|E]#! bude mít za následek:#!\n$EFFECT_LIST_BULLET$Nižší [Concept('cultural_acceptance','kulturní přijetí')|E]\n$EFFECT_LIST_BULLET$Nižší [Concept('county_control','kontrola hrabství')|E]\n$EFFECT_LIST_BULLET$Vyšší šance na [Concept('claimant_factions','frakce pretendenta')|E] nebo dokonce [Concept('civil_war','občanská válka')|E].\n\n#TS Vyšší #EMP [Concept('harrying_pacification','pacifikace')|E]#! bude mít za následek:#!\n$EFFECT_LIST_BULLET$Vyšší [Concept('cultural_acceptance','kulturní přijetí')|E]\n$EFFECT_LIST_BULLET$Vyšší [Concept('county_control','kontrola hrabství')|E]\n$EFFECT_LIST_BULLET$Nižší šance na [Concept('claimant_factions','frakce pretendenta')|E]." # todo: CHANGED # todo: CONCEPT CASE
 event_window_widget_harrying_tooltip_widget: "[harrying_widget_i]Zkrocení severu sleduje hodnoty [Concept('harrying_resistance','odpor')|E] a [Concept('harrying_pacification','pacifikace')|E]. Tyto hodnoty mají dopady na dvě hlavní skupiny v regionu: normanského vládce Anglie a případné anglosaské vazaly na úrovni [Concept('duke','vévodovi')|E].\n\nVyšší [Concept('harrying_resistance','odpor')|E] představuje anglosaský odpor proti normanské okupaci, a vyšší úrovně mohou vést k nižšímu anglosaskému/normanskému [Concept('cultural_acceptance','kulturnímu přijetí')|E], nižšímu [Concept('county_control','kontrole hrabství')|E], vyšší pravděpodobnosti [Concept('claimant_factions','frakce pretendenta')|E] nebo dokonce [Concept('civil_war','občanská válka')|E].\n\nVyšší [Concept('harrying_pacification','pacifikace')|E] může vést k vyššímu anglosaskému/normanskému [Concept('cultural_acceptance','kulturnímu přijetí')|E], vyššímu [Concept('county_control','kontrole hrabství')|E] a nižší pravděpodobnosti [Concept('claimant_factions','frakce pretendenta')|E]." # todo: CONCEPT CASE
 event_window_widget_peasant_leader_support: "Neposlušná hrabství, která podporujete"
 event_window_widget_peasant_leader_control: "Hrabství pod kontrolou maršála"
