 event_window_widget_harrying: "Současný [Concept('harrying_resistance','odpor proti plenění')|E]: [Character.MakeScope.Var('resistance_gui').GetValue|1V]\nSoučasná [Concept('harrying_pacification','pacifikace plenění')|E]: [Character.MakeScope.Var('pacification_gui').GetValue|1V]"
 event_window_widget_harrying_tooltip: "Probíhající střet mezi novým a starým vyústil v Anglii v nevyhlášenou válku, v níž noví normanští vládci reagují tvrdými odvetami na provokace sesazených anglosaských šlechticů.\n\nS postupem situace budou kroky, které oni i další postavy podniknou, určovat úrovně [Concept('harrying_resistance','odporu proti plenění')|E] a [Concept('harrying_pacification','pacifikace plenění')|E] v oblasti.\n\n#TS Vyšší #EMP [Concept('harrying_resistance','odpor proti plenění')|E]#! povede k:#!\n$EFFECT_LIST_BULLET$Nižšímu [Concept('cultural_acceptance','kulturnímu přijetí')|E]\n$EFFECT_LIST_BULLET$Nižší [Concept('county_control','kontrole hrabství')|E]\n$EFFECT_LIST_BULLET$Vyšší šanci na [Concept('claimant_factions','frakce pretendentů')|E], nebo dokonce [Concept('civil_war','občanskou válku')|E].\n\n#TS Vyšší #EMP [Concept('harrying_pacification','pacifikace plenění')|E]#! povede k:#!\n$EFFECT_LIST_BULLET$Vyššímu [Concept('cultural_acceptance','kulturnímu přijetí')|E]\n$EFFECT_LIST_BULLET$Vyšší [Concept('county_control','kontrole hrabství')|E]\n$EFFECT_LIST_BULLET$Nižší šanci na [Concept('claimant_factions','frakce pretendentů')|E]."
 event_window_widget_harrying_tooltip_widget: "[harrying_widget_i]Plenění severu sleduje hodnoty [Concept('harrying_resistance','odporu proti plenění')|E] a [Concept('harrying_pacification','pacifikace plenění')|E]. Ty mají dopad na dvě hlavní skupiny zapojené v oblasti: normanského vládce Anglie a všechny anglosaské vazaly na úrovni [Concept('duke','vévody')|E], které může mít.\n\nVyšší [Concept('harrying_resistance','odpor proti plenění')|E] představuje anglosaský odpor vůči normanské okupaci a vyšší úrovně mohou vést k nižšímu anglosasko-normanskému [Concept('cultural_acceptance','kulturnímu přijetí')|E], nižší [Concept('county_control','kontrole hrabství')|E], vyšší šanci na [Concept('claimant_factions','frakce pretendentů')|E], nebo dokonce [Concept('civil_war','občanskou válku')|E].\n\nVyšší [Concept('harrying_pacification','pacifikace plenění')|E] může vést k vyššímu anglosasko-normanskému [Concept('cultural_acceptance','kulturnímu přijetí')|E], vyšší [Concept('county_control','kontrole hrabství')|E] a nižší šanci na [Concept('claimant_factions','frakce pretendentů')|E]."
 event_window_widget_peasant_leader_support: "Nepokojná hrabství, která podporuješ"
 event_window_widget_peasant_leader_control: "Hrabství pod kontrolou maršála"
 event_window_widget_peasant_leader: "$event_window_widget_peasant_leader_support$: [Character.MakeScope.Var('support_gui').GetValue|0]/[Character.MakeScope.Var('num_of_corrupt_counties_gui').GetValue|0]\n$event_window_widget_peasant_leader_control$: [Character.MakeScope.Var('control_gui').GetValue|0]/[Character.MakeScope.Var('num_of_corrupt_counties_gui').GetValue|0]"
 event_window_widget_peasant_leader_tooltip: "Místní rolníci vedou neustálý boj proti svým vládcům. Jako [Concept('adventurer','dobrodruh')|E] jsi jen přihlížející. Pokud však chceš, můžeš vzít věci do vlastních rukou. Rozhodni, kdo je v právu a kdo ne, zvol si stranu a podpoř ji."
 event_window_widget_peasant_leader_tooltip_widget: "Připomínka, kolik [Concept('counties','hrabství')|E] ses rozhodl podpořit nebo kontrolovat. Pokud dojde na válku, rolníci ze všech podporovaných hrabství se připojí pod tvé prapory!"
