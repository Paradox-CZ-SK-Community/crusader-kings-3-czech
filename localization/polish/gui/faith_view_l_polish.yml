 FAITH_CREATION_BASIC_UI_DESC: "#weak Mám jedinečnou příležitost navždy přetvořit naši víru. Musím vše pečlivě naplánovat, protože nové dogma už po svém ustanovení nebude možné změnit.\n\nKněží a učenci přicestovali na můj dvůr, aby zde rozebírali nejrůznější teologické otázky a pokusili se naše staré ústní tradice uspořádat do uceleného a pevně stanoveného nového výkladu. Právě díky mně se však tato reformace mohla uskutečnit.#!\n\nO [Concept('core_tenets','zásadách')|E] a [Concept('doctrines','doktrínách')|E] naší nové [Concept('faith','víry')|E] rozhoduji s konečnou platností."
