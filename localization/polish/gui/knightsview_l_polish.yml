 COURT_POSITIONS_TT: "Zakázat nebojové úřady.\n[GetCourtPositionType('bodyguard_court_position').GetName] a [GetCourtPositionType('garuda_court_position').GetName] jsou vyňati a vždy mají povoleno být [Concept('knights','rytíři')|e], protože mají pomáhat v bitvách"
 HBOX_DOCTRINE_FAITH_TT: "#T [FaithDoctrine.GetNameNoTooltip( Faith.Self )]#!\n[FaithDoctrine.GetEffectsDescription( Faith.Self )]\n\n[FaithDoctrine.GetDescription( Faith.Self )|F]"
 KNIGHT_RESTRICTIONS: "Platí další omezení"
 KNIGHT_RESTRICTIONS_TT: "#T Omezení rytířů#!\nJako [Concept('knights','rytíři')|e] mohou sloužit pouze tvoji přímí [Concept('vassals','vazalové')|e], [Concept('courtiers','dvořané')|e] nebo [Concept('followers','družiníci')|e].\nTvá [Concept('culture','kultura')|e] nebo [Concept('faith','víra')|e] určuje, která pohlaví mohou působit jako [Concept('knights','rytíři')|e].\n\nRytíř nesmí být:\n - hráč, [Concept('child','dítě')|e], [Concept('prisoner','vězeň')|e] ani někdo [GetTrait('incapable').GetName(GetPlayer.Self)]\n - člen [Concept('clergy','duchovenstva')|e], pokud to [Concept('faith','víra')|e] nebo [Concept('culture','kultura')|e] neumožňuje\n - [Concept('master_assassin','mistr vrah')|e] ani [GetTrait('blind').GetName(GetPlayer.Self)], pokud to [Concept('culture','kultura')|e] neumožňuje nebo pokud není [GetTrait('order_member').GetName(GetPlayer.Self)]\n - [Concept('diarch','spoluvládce')|e] ani [Concept('ceremonial_liege','ceremoniální lenní pán')|e]\n - [Concept('governor','guvernér')|e] [Concept('duchy','vévodství')|e] nebo vyššího [Concept('title','titulu')|e], ani [Concept('house_head','hlava rodu')|e] [Concept('noble_family','urozené rodiny')|e]\n\nKulturní [Concept('traditions','tradice')|e] a události mohou některá omezení zrušit"
 KP_CULTURE_MINIMUM_PROWESS: "@alert_icon! Tvá [Concept('culture','kultura')|e] vyžaduje alespoň 12 [Concept('prowess','udatnosti')|e]"
 KP_CULTURE_ADMIN_FAMILY_KNIGHTS: "@check_icon! Tvá [Concept('culture','kultura')|e] ruší některá omezení podle pohlaví pro obranné [Concept('wars','války')|e]"
 KP_CULTURE_HIGH_PROWESS: "@check_icon! Tvá [Concept('culture','kultura')|e] ruší většinu omezení pro [Concept('knights','rytíře')|e] s alespoň 10 [Concept('prowess','udatností')|e]"
