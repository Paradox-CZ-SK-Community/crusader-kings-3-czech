 KNIGHTS_VIEW_TITLE_FORBID_TT: "#T Zakažte [Character.GetShortUIName] stát se $knight_culture_player$#!\n\n[Character.GetShortUIName] se #emphasis nikdy#! nemůže připojit k vašim [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$. Tímto zůstane [Character.GetHerHim] v bezpečí před smrtí v [Concept('battle','bitvě')|E]."
 CREATE_ACCOLADE_FORBID_TT: "#T Zakázat [CreateAccoladeView.GetSelectedKnight.GetShortUIName] stát se $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] se #emphasis nesmí#! připojit k vašim [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$. Tím zajistíte, že [CreateAccoladeView.GetSelectedKnight.GetHerHim] nebude zemřít v [Concept('battle','bitvě')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 KNIGHTS_VIEW_TITLE_BY_PROWESS_TT: "#T Povolit, aby se [Character.GetShortUIName] stal $knight_culture_player$#!\n\n[Character.GetShortUIName] se může připojit k vašim [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$, pokud je [Character.GetHerHis] [Concept('prowess','udatnost')|El] jedním z nejvyšších v [Concept('realm','panství')|El]." # todo: CONCEPT CASE
 CREATE_ACCOLADE_BY_PROWESS_TT: "#T Povolit [CreateAccoladeView.GetSelectedKnight.GetShortUIName] stát se $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] se může připojit k vašim [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$, pokud je [CreateAccoladeView.GetSelectedKnight.GetHerHis] [Concept('prowess','udatnost')|E] jednou z nejvyšších v [Concept('realm','panství')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 KNIGHTS_VIEW_TITLE_FORCE_TT: "#T Přinutit [Character.GetShortUIName] stát se $knight_culture_player$#!\n\n[Character.GetShortUIName] se #emphasis musí#! připojit k vašim [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$, bez ohledu na [Select_CString(Character.IsFemale,'její','jeho')] [Concept('prowess','udatnost')|El]. Může zaujmout místo $knight_culture_player_no_tooltip$ s vyšší zdatností." # todo: CONCEPT CASE
 CREATE_ACCOLADE_FORCE_TT: "#T Vynutit [CreateAccoladeView.GetSelectedKnight.GetShortUIName] stát se $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] #emphasis musí#! připojit k vašim [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$, bez ohledu na [CreateAccoladeView.GetSelectedKnight.GetHerHis] [Concept('prowess','udatnost')|E]. [CreateAccoladeView.GetSelectedKnight.GetSheHe|U] může zaujmout místo $knight_culture_player_no_tooltip$ s vyšší bojovou zdatností." # todo: NEW TRANSLATION # todo: CONCEPT CASE
