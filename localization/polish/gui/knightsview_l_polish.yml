 KNIGHTS_VIEW_ALLOW: "Povolit"
 KNIGHTS_VIEW_FORBID: "Zakázat"
 KNIGHTS_VIEW_TITLE: "$knight_culture_player_plural_no_tooltip$"
 MAX_KNIGHT_COUNT: "$knight_culture_player_plural_no_tooltip$: #high [GetKnightCount( GetPlayer.Self )]/[GetKnightLimit( GetPlayer.Self )]#!"
 MAX_KNIGHT_TOOLTIP: "#T Maximální počet postav $knight_culture_player_plural_no_tooltip$: [knight_i][GetKnightLimit( GetPlayer.Self )|V]#!\n[GetKnightLimitBreakdown( GetPlayer.Self )]"
 KNIGHT_EFFECTIVENESS: "Účinnost postavy $knight_culture_player_no_tooltip$: #high [GetPlayer.GetKnightEffectiveness|%0]#!"
 KNIGHT_EFFECTIVENESS_TOOLTIP: "#T [Concept('knight_effectiveness','Účinnost rytířů')|E]: [GetPlayer.GetKnightEffectiveness|V%0]#!\nZáklad: #V 100%#!\n[GetPlayer.GetKnightEffectivenessBreakdown]"
 KNIGHTS_VIEW_TITLE_FORBID_TT: "#T Zakázat postavě [Character.GetShortUIName] sloužit jako $knight_culture_player$#!\n\n[Character.GetShortUIName] se #emphasis nikdy#! nesmí připojit k tvým [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$. Díky tomu bude [Character.GetHerHim] chráněn[Select_CString( Character.IsFemale, 'a', '' )] před smrtí v [Concept('battle','bitvě')|E]."
 CREATE_ACCOLADE_FORBID_TT: "#T Zakázat postavě [CreateAccoladeView.GetSelectedKnight.GetShortUIName] sloužit jako $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] se #emphasis nikdy#! nesmí připojit k tvým [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$. Díky tomu bude [CreateAccoladeView.GetSelectedKnight.GetHerHim] chráněn[Select_CString( CreateAccoladeView.GetSelectedKnight.IsFemale, 'a', '' )] před smrtí v [Concept('battle','bitvě')|E]."
 KNIGHTS_VIEW_TITLE_BY_PROWESS_TT: "#T Povolit postavě [Character.GetShortUIName] sloužit jako $knight_culture_player$#!\n\n[Character.GetShortUIName] se může připojit k tvým [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$, pokud její [Concept('prowess','udatnost')|E] patří k nejvyšším v [Concept('realm','panství')|E]"
 CREATE_ACCOLADE_BY_PROWESS_TT: "#T Povolit postavě [CreateAccoladeView.GetSelectedKnight.GetShortUIName] sloužit jako $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] se může připojit k tvým [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$, pokud její [Concept('prowess','udatnost')|E] patří k nejvyšším v [Concept('realm','panství')|E]"
 KNIGHTS_VIEW_TITLE_FORCE_TT: "#T Vynutit, aby [Character.GetShortUIName] sloužil[Select_CString( Character.IsFemale, 'a', '' )] jako $knight_culture_player$#!\n\n[Character.GetShortUIName] se #emphasis musí#! připojit k tvým [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$ bez ohledu na svou [Concept('prowess','udatnost')|E]. [Character.GetSheHe|U] může zabrat místo postavě $knight_culture_player_no_tooltip$ s vyšší udatností."
 CREATE_ACCOLADE_FORCE_TT: "#T Vynutit, aby [CreateAccoladeView.GetSelectedKnight.GetShortUIName] sloužil[Select_CString( CreateAccoladeView.GetSelectedKnight.IsFemale, 'a', '' )] jako $knight_culture_player$#!\n\n[CreateAccoladeView.GetSelectedKnight.GetShortUIName] se #emphasis musí#! připojit k tvým [Concept('armies','armádám')|E] jako $knight_culture_player_no_tooltip$ bez ohledu na svou [Concept('prowess','udatnost')|E]. [CreateAccoladeView.GetSelectedKnight.GetSheHe|U] může zabrat místo postavě $knight_culture_player_no_tooltip$ s vyšší udatností."
 KNIGHTS_CURRENT_MAX: "[GetKnightCount( GetPlayer.Self )|V]/[GetKnightLimit( GetPlayer.Self )|V]"
