 KNIGHT_RESTRICTIONS_TT: "#T Omezení rytířů#!\nPouze vaši přímí [Concept('vassals','vazalové')|e], [Concept('courtiers','dvořané')|e] nebo [Concept('followers','družiníci')|e] mohou sloužit jako [Concept('knights','rytíři')|e].\nVaše [Concept('culture','kultura')|e] nebo [Concept('faith','víra')|e] určuje, která pohlaví mohou působit jako [Concept('knights','rytíři')|e].\n\nRytíř nemůže být:\n - Hráč, [Concept('child','dítě')|e], [Concept('prisoner','vězeň')|e] nebo [GetTrait('incapable').GetName(GetPlayer.Self)]\n - člen [Concept('clergy','duchovenstvo')|e] (pokud to [Concept('faith','víra')|e] nebo [Concept('culture','kultura')|e] nedovolí)\n - [Concept('master_assassin','mistr asasínů')|e] nebo [GetTrait('blind').GetName(GetPlayer.Self)] (pokud to [Concept('culture','kultura')|e] nedovolí nebo pokud jsou [GetTrait('order_member').GetName(GetPlayer.Self)])\n - [Concept('diarch','diarcha')|e] nebo [Concept('ceremonial_liege','obřadní panovník')|e]\n - [Concept('governor','guvernér')|e] [Concept('duchy','vévodství')|e] (nebo vyšší [Concept('title','titul')|e]) nebo [Concept('house_head','hlava rodu')|e] [Concept('noble_family','šlechtická rodina')|e]\n\nKulturní [Concept('traditions','tradice')|e] a události mohou některá omezení zrušit" # todo: NEW TRANSLATION # todo: CONCEPT CASE
