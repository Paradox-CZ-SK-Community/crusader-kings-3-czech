 agent_proponent_desc: "#WEAK Někdo, kdo bude hlasitě a hrdě vychvalovat tvé úspěchy — ať už jsou skutečné, nebo ne — dokáže s pověstí divy.#!\n$EFFECT_LIST_BULLET$ Poskytuje [success_chance_max_i] [Concept('scheme_potential','potenciál intriky')|E]\n$EFFECT_LIST_BULLET$ Vyžaduje [diplomacy_i] [Concept('diplomacy','diplomacii')|E] a [intrigue_i] [Concept('intrigue','pletichářství')|E]\n$EFFECT_LIST_BULLET$ #P Těží#! z [Concept('traits','rysů')|E], jako jsou [GetTrait('deceitful').GetName( GetNullCharacter )] a [GetTrait('gregarious').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Trpí#! kvůli [Concept('traits','rysům')|E], jako jsou [GetTrait('honest').GetName( GetNullCharacter )] a [GetTrait('shy').GetName( GetNullCharacter )]"
