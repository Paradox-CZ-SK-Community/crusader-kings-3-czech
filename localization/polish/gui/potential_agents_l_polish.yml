 agent_eunuch_speed_i: "[secrecy_i]"
 agent_eunuch_speed_desc: "#WEAK Tichý jako chod měsíce prochází mramorovými síněmi, strážce tajemství v zemi, kde jsou slova platidlem. Ve stínu císařů šeptá a nejjemnějším šelestem utváří osud říše.#!\n$EFFECT_LIST_BULLET$ Poskytuje [secrecy_i] [Concept('secrecy','utajení')|E]\n$EFFECT_LIST_BULLET$ Vyžaduje [intrigue_i] [Concept('intrigue','pletichářství')|E] a [learning_i] [Concept('learning','učenost')|E]\n$EFFECT_LIST_BULLET$ #P Těží#! z [Concept('traits','rysů')|E], jako jsou [GetTrait('deceitful').GetName( GetNullCharacter )] a [GetTrait('patient').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Trpí#! kvůli [Concept('traits','rysům')|E], jako jsou [GetTrait('compassionate').GetName( GetNullCharacter )] a [GetTrait('honest').GetName( GetNullCharacter )]"
