 SUCCESSION_EVENT_WINDOW_LOST_TITLES: "Tituly ztracené při následnictví:"
 SUCCESSION_EVENT_WINDOW_CLOSE: "Pokračovat jako [SuccessionEventWindow.GetContinueAsCharacter.GetShortUINameNotMeNoTooltip]"
 SUCCESSION_EVENT_WINDOW_LEGACY: "Zobrazit rodovou linii"
 SUCCESSION_EVENT_WINDOW_OBSERVER: "Přejít do režimu pozorovatele"
 SUCCESSION_EVENT_WINDOW_MENU: "Návrat do menu"
 SUCCESSION_EVENT_WINDOW_MENU_TT: ""
 SUCCESSION_EVENT_WINDOW_END_GAME: "Ukončit hru"
 SUCCESSION_EVENT_WINDOW_END_GAME_TT: "Ukončit hru pro více hráčů"
 SUCCESSION_EVENT_WINDOW_LEAVE_GAME: "Opustit hru"
 SUCCESSION_EVENT_WINDOW_LEAVE_GAME_TT: "Opustit hru pro více hráčů"
 SUCCESSION_EVENT_WINDOW_CHANGE_CHARACTER: "Vybrat novou postavu"
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_1: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'naposledy vydechla', 'naposledy vydechl' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_2: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'opustila svou smrtelnou schránku', 'opustil svou smrtelnou schránku' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_3: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'odešla na věčnost', 'odešel na věčnost' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_4: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'opustila tento svět', 'opustil tento svět' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_DEFAULT_5: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'odešla na věčnost', 'odešel na věčnost' )] ve věku [ROOT.Char.GetAge] let. [ROOT.Char.Custom('GetAfterLifeDestination')] se [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] již nemůže dočkat."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_PIOUS: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'odešla na věčnost', 'odešel na věčnost' )] ve věku [ROOT.Char.GetAge] let. [ROOT.Char.GetFaith.PositiveAfterLife] [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] přivítá s otevřenou náručí."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WICKED: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'byla navěky zatracena', 'byl navěky zatracen' )] ve věku [ROOT.Char.GetAge] let. [ROOT.Char.GetFaith.NegativeAfterLife] čeká."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_WOUNDED: "[ROOT.Char.GetFullNameNoTooltip] konečně [Select_CString( ROOT.Char.IsFemale, 'nalezla pokoj', 'nalezl pokoj' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_CHRISTIANITY_1: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'nalezla pokoj v Kristově náruči', 'nalezl pokoj v Kristově náruči' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_CHRISTIANITY_2: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'spočinula v náruči Páně', 'spočinul v náruči Páně' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_1: "[ROOT.Char.GetFullNameNoTooltip] na volání Pravého [Select_CString( ROOT.Char.IsFemale, 'opustila pomíjivý příbytek', 'opustil pomíjivý příbytek' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_2: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'opustila tento pomíjivý svět', 'opustil tento pomíjivý svět' )] ve věku [ROOT.Char.GetAge] let. [ROOT.Char.GetFaith.PositiveAfterLife] [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] přivítá s otevřenou náručí."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_ISLAM_3: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'vstoupila do věčnosti', 'vstoupil do věčnosti' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_NORSE_1: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'se připojila k hostině mrtvých', 'se připojil k hostině mrtvých' )] ve věku [ROOT.Char.GetAge] let. [ROOT.Char.GetFaith.PositiveAfterLife] má pro takové, jako [Select_CString( ROOT.Char.IsFemale, 'byla ona', 'byl on' )], vždy místo u stolu."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_HELLENIC_1: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'překročila řeku Styx', 'překročil řeku Styx' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_EASTERN_1: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'překonala', 'překonal' )] omezení své hmotné podoby ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_INTRO_TRIBAL_1: "[ROOT.Char.GetFullNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'prošla branou do světa duchů', 'prošel branou do světa duchů' )] ve věku [ROOT.Char.GetAge] let."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_CHILD: "[Select_CString(ROOT.Char.IsFemale,'Její','Jeho')] život skončil tak brzy, že lze jen těžko říci, [Select_CString(ROOT.Char.IsFemale,'jakou vládkyní by se stala','jakým vládcem by se stal')]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_OLD: "[Select_CString(ROOT.Char.IsFemale,'Stará','Starý')] [ROOT.Char.GetWomanMan|l] [Select_CString(ROOT.Char.IsFemale,'prožila','prožil')] dlouhý a naplněný život."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_IMMORTAL: "[Select_CString(ROOT.Char.IsFemale,'Byla považována','Byl považován')] za nesmrtelnou bytost, a proto svou nečekanou smrtí mnohé [Select_CString(ROOT.Char.IsFemale,'překvapila','překvapil')]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_AGE_PREGNANT: "Zemřela ještě před porodem svého dítěte, a proto nebude na onom světě kráčet sama."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_LEPER: "[Select_CString(ROOT.Char.IsFemale,'Její','Jeho')] zahnívající tělo nakonec podlehlo zhoubě malomocenství."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_DISFIGURED: "Strašlivé zohavení [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] v posledních letech života nedovolovalo ukazovat na veřejnosti vlastní tvář."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_MANGLED: "Zmrzačení při strašlivé nehodě [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] v posledních letech života sotva dovolovalo chodit."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_HUNCHBACK: "Osud [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] od narození nepřál a pokřivená záda často budila posměch."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_GIANT: "Osud [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] od narození nepřál a obrovitá postava často budila posměch."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_DWARF: "Osud [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] od narození nepřál a drobný vzrůst často budil posměch."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_STRONG: "[ROOT.Char.GetWomanMan|U] bezpříkladné zdatnosti nakonec [Select_CString( ROOT.Char.IsFemale, 'narazila', 'narazil' )] na protivníka, kterého nedokázala přemoci."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_PRETTY_YOUNG: "[Select_CString( ROOT.Char.IsFemale, 'Zemřela', 'Zemřel' )] v rozkvětu života. [Select_CString( ROOT.Char.IsFemale, 'Její', 'Jeho' )] oslnivá krása však zůstane navždy v paměti."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_PRETTY_OLD: "Kdysi [Select_CString( ROOT.Char.IsFemale, 'proslulá', 'proslulý' )] svou krásou, ale osud [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] dopřál tak dlouhý život, že [Select_CString( ROOT.Char.IsFemale, 'mohla', 'mohl' )] sledovat, jak tato krása pomalu uvadá."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_WEAK: "[ROOT.Char.GetWomanMan|U] chatrného zdraví se často [Select_CString( ROOT.Char.IsFemale, 'stávala', 'stával' )] terčem posměchu svých vrstevníků."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_UGLY: "[Select_CString( ROOT.Char.IsFemale, 'Proslulá', 'Proslulý' )] svou ošklivostí; podle pověstí stačil jediný pohled na [Select_CString( ROOT.Char.IsFemale, 'ni', 'něj' )] a člověka pak celé dny pronásledovaly noční můry."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_BODY_INCAPABLE: "Z někdejší osobnosti zůstala jen prázdná schránka bez schopnosti mluvit či se hýbat. Nyní konečně [Select_CString( ROOT.Char.IsFemale, 'opustila', 'opustil' )] trosky svého těla."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_LUNATIC: "Kvůli choré mysli [Select_CString( ROOT.Char.IsFemale, 'proslula', 'proslul' )] po celém svém panství běsnícími záchvaty šílenství."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_POSSESSED_POSITIVE: "Po letech promlouvání skrze [Select_CString( ROOT.Char.IsFemale, 'ni', 'něj' )] [ROOT.Char.GetFaith.HighGodName] konečně volá [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] domů."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_POSSESSED_NEGATIVE: "[Select_CString( ROOT.Char.IsFemale, 'Sužována', 'Sužován' )] démony často [Select_CString( ROOT.Char.IsFemale, 'blouznila', 'blouznil' )] o blížící se záhubě."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_DEPRESSED: "[Select_CString( ROOT.Char.IsFemale, 'Utrápená', 'Utrápený' )] [ROOT.Char.GetWomanMan|l] již dlouho [Select_CString( ROOT.Char.IsFemale, 'toužila', 'toužil' )] po sladkém objetí smrti."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_GENIUS: "Ačkoli [Select_CString( ROOT.Char.IsFemale, 'proslula', 'proslul' )] bystrým intelektem, [ROOT.Char.GetFaith.DeathDeityName] se přelstít nedá."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_DUMB: "Kvůli chabému rozumu se při důležitých rozhodnutích často [Select_CString( ROOT.Char.IsFemale, 'spoléhala', 'spoléhal' )] na svou radu."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_MIND_INFIRM: "Z někdejší osobnosti zůstala jen prázdná schránka; zdravý rozum se vytratil dávno před posledním odchodem."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_EXCOMMUNICATED: "Církev nad [Select_CString( ROOT.Char.IsFemale, 'ní', 'ním' )] vyřkla ortel kacířství a za své hříchy nyní jistě trpí."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_KINSLAYER: "Ruce si [Select_CString( ROOT.Char.IsFemale, 'poskvrnila', 'poskvrnil' )] krví vlastních příbuzných. [ROOT.Char.GetFaith.NegativeAfterLife] je místem, kde nyní jistě pyká za své ohavné zločiny."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_DEVIANT: "[Select_CString( ROOT.Char.IsFemale, 'Zvrhlá', 'Zvrhlý' )] [ROOT.Char.GetWomanMan|l] odpudivých choutek jistě nenalezne útěchu ani veselí tam, kam nyní míří."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_CANNIBAL: "Podle pověstí se [Select_CString( ROOT.Char.IsFemale, 'živila', 'živil' )] lidským masem a za svou pozemskou zkaženost nyní bezpochyby pyká."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_SODOMITE: "[Select_CString( ROOT.Char.IsFemale, 'Proslulá sodomitka', 'Proslulý sodomita' )] nyní spočívá v něžné péči. [ROOT.Char.GetFaith.DevilName] [ROOT.Char.GetFaith.DevilHerselfHimself] nad [Select_CString( ROOT.Char.IsFemale, 'ní', 'ním' )] bdí."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_INCESTUOUS: "Za ochutnání zakázaného ovoce krvesmilné lásky bude v příštím životě jistě trpět."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_ADULTERER: "[Select_CString( ROOT.Char.IsFemale, 'Nestoudná cizoložnice', 'Nestoudný cizoložník' )] zůstane v paměti pro svou zradu a žádostivou povahu."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_FORNICATOR: "[Select_CString( ROOT.Char.IsFemale, 'Nestoudná smilnice', 'Nestoudný smilník' )] zůstane v paměti pro svůj nezkrotný a zhoubný chtíč."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_MURDERER: "[Select_CString( ROOT.Char.IsFemale, 'Známá vražedkyně', 'Známý vrah' )] bude v příštím životě pykat za své nevýslovné zločiny."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_SCANDAL_WITCH: "Bylo známo, že míchá kouzelné byliny a jejím společníkem je [ROOT.Char.GetFaith.DevilName]. Za své hříchy bude v posmrtném životě jistě hořet."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_SAOSHYANT: "[Select_CString( ROOT.Char.IsFemale, 'Posvátná obnovitelka', 'Posvátný obnovitel' )] Perské říše [Select_CString( ROOT.Char.IsFemale, 'dosáhla', 'dosáhl' )] slávy, kterou budou ve svých kázáních navěky připomínat všichni [ROOT.Char.GetFaith.PriestMalePlural]. Nyní jistě sedí po boku bytosti, jíž je [ROOT.Char.GetFaith.HighGodName]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_RESTORER_ROME: "Obnovením dávné moci říše [Select_CString( ROOT.Char.IsFemale, 'zajistila', 'zajistil' )], že [Select_CString( ROOT.Char.IsFemale, 'její', 'jeho' )] jméno bude až do skonání věků opředeno slávou."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_CRUSADER: "[Select_CString( ROOT.Char.IsFemale, 'Horlivá', 'Horlivý' )] [ROOT.Char.GetWomanMan|l] [Select_CString( ROOT.Char.IsFemale, 'bojovala', 'bojoval' )] v jedné z největších svatých válek nedávných dějin. [ROOT.Char.GetFaith.HighGodName] vedl [Select_CString( ROOT.Char.IsFemale, 'její', 'jeho' )] ruku, před kterou se třásli [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_DIPLOMAT: "[Select_CString( ROOT.Char.IsFemale, 'Neúnavná diplomatka dokázala', 'Neúnavný diplomat dokázal' )] pokojně urovnat každý spor."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_REVELER: "Okouzlující [ROOT.Char.GetWomanMan|l] [Select_CString( ROOT.Char.IsFemale, 'proslula', 'proslul' )] okázalými hostinami a velkolepými plesy."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_BLADEMASTER: "[Select_CString( ROOT.Char.IsFemale, 'Patřila', 'Patřil' )] k nejlepším bojovníkům své doby a v boji zblízka neměla konkurenci."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_HUNTER: "Jako nadšený a oddaný lovec [Select_CString( ROOT.Char.IsFemale, 'trávila', 'trávil' )] celé týdny v divočině hledáním té nejnepolapitelnější zvěře."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GENERAL: "[Select_CString( ROOT.Char.IsFemale, 'Proslula jako výjimečná vojevůdkyně a mnoho dní trávila', 'Proslul jako výjimečný vojevůdce a mnoho dní trávil' )] průzkumem bojišť a výcvikem svých vojsk."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_ADMINISTRATOR: "[Select_CString( ROOT.Char.IsFemale, 'Svědomitá', 'Svědomitý' )] [ROOT.Char.GetWomanMan|l] [Select_CString( ROOT.Char.IsFemale, 'proslula', 'proslul' )] vynikajícími schopnostmi ve správě i vládnutí."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_SCHEMER: "Pro svou pokřivenou a úskočnou mysl nikdy nikomu [Select_CString( ROOT.Char.IsFemale, 'neodhalila', 'neodhalil' )] své skutečné úmysly, dokonce ani nejbližším přátelům."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_SEDUCER: "[Select_CString( ROOT.Char.IsFemale, 'Prostopášnice obdařená', 'Prostopášník obdařený' )] výřečností [Select_CString( ROOT.Char.IsFemale, 'dokázala', 'dokázal' )] okouzlit kohokoli a přivést jej do svého lože."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_SCHOLAR: "Jako uznávaná učená osobnost [Select_CString( ROOT.Char.IsFemale, 'trávila', 'trávil' )] většinu dní studiem v knihovně. Místem, které jen zřídka [Select_CString( ROOT.Char.IsFemale, 'opouštěla', 'opouštěl' )], byl [ROOT.Char.Custom('ResidenceBuilding')]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_TORTURER: "Pro své sadistické sklony [Select_CString( ROOT.Char.IsFemale, 'povýšila', 'povýšil' )] mučení a mrzačení na umění."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_FAMILY_FIRST: "Blaho rodiny pro [Select_CString( ROOT.Char.IsFemale, 'ni', 'něj' )] vždy stálo nade vším ostatním a celý život [Select_CString( ROOT.Char.IsFemale, 'zasvětila', 'zasvětil' )] zajištění slavné budoucnosti svých potomků."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_MYSTIC: "Většinu nocí [Select_CString( ROOT.Char.IsFemale, 'trávila', 'trávil' )] v laboratoři a mnozí [Select_CString( ROOT.Char.IsFemale, 'ji považovali za čarodějnici', 'ho považovali za čaroděje' )]. Místem, kde v utajení vznikala bezbožná kouzla, byl [ROOT.Char.Custom('ResidenceBuilding')]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_PHYSICIAN: "Porozumění lidskému tělu a mysli [Select_CString( ROOT.Char.IsFemale, 'zasvětila', 'zasvětil' )] celý život. Těšila se úctě jako [Select_CString( ROOT.Char.IsFemale, 'lékařka', 'lékař' )] a mladí učenci ji vyhledávali pro její rozsáhlé znalosti přírody a tělesných šťáv."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_GALLANT: "[Select_CString( ROOT.Char.IsFemale, 'Byla', 'Byl' )] ztělesněním statečnosti a rytířskosti a navzdory všem protivenstvím zůstane v paměti pro svou srdečnou a spravedlivou povahu."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_LIFESTYLE_HERBALIST: "[Select_CString( ROOT.Char.IsFemale, 'Proslulá bylinkářka prý dokázala', 'Proslulý bylinkář prý dokázal' )] správnou směsí vyléčit každou chorobu."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_MALICIOUS: "[Select_CString( ROOT.Char.IsFemale, 'Úskočná', 'Úskočný' )] [ROOT.Char.GetWomanMan|l] zůstane dlouho v paměti pro svou malichernost a zášť."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_BENEVOLENT: "[Select_CString( ROOT.Char.IsFemale, 'Přívětivá', 'Přívětivý' )] [ROOT.Char.GetWomanMan|l] zůstane v paměti pro svou laskavou vládu."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_DOMINANT: "Nebylo radno si s [Select_CString( ROOT.Char.IsFemale, 'ní', 'ním' )] zahrávat. Důstojnost a moc svého titulu [Select_CString( ROOT.Char.IsFemale, 'ztělesňovala', 'ztělesňoval' )] jako málokterý vládce."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_SUBMISSIVE: "[Select_CString( ROOT.Char.IsFemale, 'Plachá a ostýchavá', 'Plachý a ostýchavý' )] [ROOT.Char.GetWomanMan|l] zůstane mnohým v paměti jako [Select_CString( ROOT.Char.IsFemale, 'poddajná a někdy rozpačitá vládkyně', 'poddajný a někdy rozpačitý vládce' )]."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_APATHETIC: "Lze-li o [Select_CString( ROOT.Char.IsFemale, 'ní', 'něm' )] něco říci, pak to, že nikdy nezanechávala výrazný dojem v nikom, koho potkala."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_LUSTFUL: "Od narození [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] spalovala neukojitelná touha a celý život [Select_CString( ROOT.Char.IsFemale, 'hledala', 'hledal' )] další milostné dobrodružství."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_GLUTTONOUS: "Jako [ROOT.Char.GetWomanMan|l] s velkou chutí k jídlu nikdy [Select_CString( ROOT.Char.IsFemale, 'neodmítla', 'neodmítl' )] příležitost ochutnat nový exotický pokrm."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_GREEDY: "[Select_CString( ROOT.Char.IsFemale, 'Proslula', 'Proslul' )] láskou ke zlatu a do hrobu si odnese některé ze svých nejmilovanějších klenotů."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_LAZY: "Nikdy [Select_CString( ROOT.Char.IsFemale, 'neudělala', 'neudělal' )] více práce, než bylo nezbytné, a vždy [Select_CString( ROOT.Char.IsFemale, 'byla připravena', 'byl připraven' )] vyhnout se svým povinnostem."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_FICKLE: "[Select_CString( ROOT.Char.IsFemale, 'Nestálá', 'Nestálý' )] [ROOT.Char.GetWomanMan|l]; téměř nikdo nikdy nevěděl, co si v danou chvíli pomyslí nebo co udělá."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_WRATHFUL: "Velice snadno [Select_CString( ROOT.Char.IsFemale, 'propadala', 'propadal' )] hněvu. [ROOT.Char.Custom('ResidenceBuilding')] – právě tam často burácela ozvěna jejích výkřiků."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_ARROGANT: "Vždy [Select_CString( ROOT.Char.IsFemale, 'byla plná', 'byl plný' )] sebe sama a neváhala uplatňovat svou moc. Její [ROOT.Char.Custom('GetSubjectPlural')] často zakoušeli její autoritu a zvuk vlastního hlasu [Select_CString( ROOT.Char.IsFemale, 'milovala', 'miloval' )] nade vše."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_CHASTE: "Věrnost pro [Select_CString( ROOT.Char.IsFemale, 'ni', 'něj' )] byla nekompromisní hodnotou a právě tak se na [Select_CString( ROOT.Char.IsFemale, 'ni', 'něj' )] bude dlouho vzpomínat."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_TEMPERATE: "Vždy se [Select_CString( ROOT.Char.IsFemale, 'vyhýbala', 'vyhýbal' )] hostinám a přemíře a nikdy [Select_CString( ROOT.Char.IsFemale, 'nedovolila', 'nedovolil' )], aby [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] ovládly nízké pudy."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_GENEROUS: "[Select_CString( ROOT.Char.IsFemale, 'Proslula', 'Proslul' )] dobročinností a štědře rozdávala peníze přátelům i rodině."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_DILIGENT: "[Select_CString( ROOT.Char.IsFemale, 'Byla', 'Byl' )] zářným příkladem píle a nikdy nezanedbávala své povinnosti."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_COMPASSIONATE: "Přátelé budou s láskou vzpomínat na [Select_CString( ROOT.Char.IsFemale, 'ni', 'něj' )] jako na laskavou a soucitnou duši."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_PATIENT: "Nikdy [Select_CString( ROOT.Char.IsFemale, 'nezvyšovala', 'nezvyšoval' )] hlas a [Select_CString( ROOT.Char.IsFemale, 'byla', 'byl' )] ztělesněním trpělivosti."
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_PERSONALITY_HUMBLE: "[Select_CString( ROOT.Char.IsFemale, 'Skromná', 'Skromný' )] [ROOT.Char.GetWomanMan|l] nikdy [Select_CString( ROOT.Char.IsFemale, 'nechtěla', 'nechtěl' )], aby se kolem jejích úspěchů dělal rozruch."
 SUCCESSION_EVENT_WINDOW_HEIR_UNDERAGE: "Ve věku pouhých [ROOT.Char.GetAge] let bude během prvních let vlády potřebovat oporu. Tou bude [ROOT.Char.GetDiarchTitle] [ROOT.Char.GetDiarchy.GetDiarch.GetTitledFirstNameNicknamedNoTooltip]."
 SUCCESSION_EVENT_WINDOW_HEIR_USELESS: "Chybějí [Select_CString( ROOT.Char.IsFemale, 'ji', 'mu' )] schopnosti potřebné k udržení celku. [ROOT.Char.Custom('GetRealmOrDomicile')] může být pod touto vládou odsouzen k rozpadu."
 SUCCESSION_EVENT_WINDOW_HEIR_MILITARY: "Vynikající vojenské nadání slibuje četná vítězství na bitevním poli. [ROOT.Char.Custom('GetRealmOrDomicile')] by pod tímto vedením mohl dosáhnout velkých úspěchů."
 SUCCESSION_EVENT_WINDOW_HEIR_LEARNING: "[Select_CString( ROOT.Char.IsFemale, 'Moudrá a učená', 'Moudrý a učený' )] [ROOT.Char.GetWomanMan|l] přináší naději na pokrok a inovace."
 SUCCESSION_EVENT_WINDOW_HEIR_STEWARDSHIP: "Šetrnost a hospodárnost jsou příslibem prosperity. [ROOT.Char.Custom('GetRealmOrDomicile')] bude pod touto vládou jistě vzkvétat."
 SUCCESSION_EVENT_WINDOW_HEIR_INTRIGUE: "[Select_CString( ROOT.Char.IsFemale, 'Vychytralá a bystrá', 'Vychytralý a bystrý' )] [ROOT.Char.GetWomanMan|l] nebude mít potíže získat potřebnou páku."
 SUCCESSION_EVENT_WINDOW_HEIR_DIPLOMACY: "Díky vytříbenému diplomatickému umění si jistě získá úctu vazalů i cizích vládců."
 SUCCESSION_EVENT_WINDOW_HEIR_STRONG_AND_SMART: "Mohutná tělesná konstituce a mimořádně bystrá mysl jsou příslibem vlády, o níž budou vznikat písně i příběhy."
 SUCCESSION_EVENT_WINDOW_HEIR_WEAK_AND_DUMB: "Bez bystré mysli i válečnické konstituce bude tato vláda jistě strastiplná."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_VARANGIAN: "Služba ve vzdáleném Miklagardu vypěstovala dobrodružného ducha. [ROOT.Char.Custom('GetSubjectPlural')] se jím pravděpodobně nechají inspirovat."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_LUNATIC: "Mysl nového vládce zachvátilo naprosté šílenství. S vládou může pomoci jedině [ROOT.Char.GetFaith.HighGodName]."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_POSSESSED_BAD: "Panuje podezření na posedlost démonem, kterého seslal [ROOT.Char.GetFaith.DevilName]. [ROOT.Char.GetFaith.PriestMalePlural] se budou ze všech sil snažit držet [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] na uzdě."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_POSSESSED_GOOD: "[ROOT.Char.GetFaith.HighGodName] [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] obdařil požehnáním. Tělo je pouhou schránkou, skrze niž se projevuje božská vůle."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_FAIR: "Krása, kterou nelze vyjádřit slovy, přiměje cizí hodnostáře plazit se u [Select_CString( ROOT.Char.IsFemale, 'jejích', 'jeho' )] nohou."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ADVENTURER: "[Select_CString( ROOT.Char.IsFemale, 'Dobrodružná', 'Dobrodružný' )] [ROOT.Char.GetWomanMan|l] má před sebou život pravděpodobně naplněný slávou a vzrušením."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_UGLY_DECEITFUL: "Prohnanost a prolhanost jsou [Select_CString( ROOT.Char.IsFemale, 'jejími', 'jeho' )] hlavními zbraněmi, ale svár [ROOT.Char.GetFirstNamePossessiveNoTooltip] se samotnou pravdou může přivodit i vlastní zkázu."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GLUTTON_GREEDY: "[Select_CString( ROOT.Char.IsFemale, 'Chamtivá a žádostivá', 'Chamtivý a žádostivý' )] [ROOT.Char.GetWomanMan|l] si mezi rolnictvem sotva získá oblibu. [ROOT.Char.Custom('GetRealmOrDomicile')] to brzy pocítí."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CYNICAL_JUST: "Spravedlnost a nestrannost ve všech záležitostech dávají mnohým naději, že každý konflikt bude řešen důstojně."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT_ARBITRARY: "[Select_CString( ROOT.Char.IsFemale, 'Zkažená a nespravedlivá', 'Zkažený a nespravedlivý' )] [ROOT.Char.GetWomanMan|l] nemůže očekávat, že vazalové budou nečinně přihlížet mrhání odkazem předchůdce."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CRAVEN_MILITARY_ED: "[ROOT.Char.GetFirstNameNoTooltip] dává přednost velení vojsku z bezpečí domova, a proto jen stěží dokáže své vojáky nadchnout."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_SHY_CONTENT: "[Select_CString( ROOT.Char.IsFemale, 'Samotářská', 'Samotářský' )] [ROOT.Char.GetWomanMan|l] ochotně přenechá většinu práce radě — ať už to dopadne dobře, či špatně."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ZEALOUS_PARANOID: "[ROOT.Char.GetFaith.DevilName] má podle [Select_CString( ROOT.Char.IsFemale, 'ní', 'něj' )] své spolčence za každým rohem. [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] by se měli mít před touto vládou na pozoru."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ZEALOUS_GENEROUS: "Zbožnost a štědrost budou určovat tuto vládu. [ROOT.Char.GetFaith.PriestMalePlural] za ní pravděpodobně zbohatnou."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARROGANT_BRAVE: "[ROOT.Char.GetFirstNameNoTooltip] vždy [Select_CString( ROOT.Char.IsFemale, 'oděná', 'oděný' )] v lesklé a honosné zbroji chce, aby [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] při útoku do bitvy všichni viděli."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CYNICAL_CRUEL: "[ROOT.Char.GetFaith.HighGodName] v [Select_CString( ROOT.Char.IsFemale, 'ní', 'něm' )] nevzbuzuje žádný strach. [ROOT.Char.Custom('GetSubject')] proto sotva unikne jakémukoli trestu, který bude považován za vhodný."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_HUMBLE_STUBBORN: "Neochvějnost ve způsobu uctívání napovídá, že za této vlády budou mít přednost víra a tradice."
