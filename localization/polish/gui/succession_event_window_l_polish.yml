 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_SPANISH_DESC: " Právě díky tvé vládě a vedení se španělské trůny sjednotily pod jediným vládcem."
 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_SLAVS_DESC: " Od chvíle, kdy jsi založil říši $e_slavia$, se Slované stali nezastavitelnou mocností."
 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_SOUTHERN_SLAVS_DESC: " Právě pod tvým vedením získali jižní Slované zpět svou svébytnost."
 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_WESTERN_SLAVS_DESC: " Právě díky tobě se západní Slované po staletích kmenové roztříštěnosti opět sjednotili. "
 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_BURGUNDY_DESC: " Pod tvým vedením a vládou překonali Burgunďané své rozbroje a sjednotili se."
 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_ITALY_DESC: " Právě díky tvé vládě a vedení se říše $e_italy$ sjednotila pod jediným vládcem."
 SUCCESSION_EVENT_WINDOW_END_DATE_UNIFICATION_AFRICA_DESC: " Právě díky tvému úsilí, píli a moudré vládě se celý africký kontinent sjednotil pod jedinou vládou."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_PORTUGAL_DESC: " Lze však skutečně mluvit o smrti, když založení království $k_portugal$ zůstane navždy v paměti?"
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_CANARIAS_DESC: " Na všech ostrovech znají tvé jméno jako jméno zakladatele království $k_canarias$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_BOSNIA_DESC: " Po založení království $k_bosnia$ není v Bosně snad ani jediný kůň, který by neznal tvé jméno."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_ARMENIA_DESC: " Tvé jméno bude navěky žít jako jméno zakladatele říše $e_armenia$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_RUM_DESC: " Tvou zásluhou vzniklo království $k_rum$ a jako jeho zakladateli ti bude svým způsobem vždy náležet."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_VIET_DESC: " Tvůj lid bude navždy uctívat tvé jméno jako jméno vzorové duše, díky níž se říše $e_viet$ stala skutečností."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_MAJAPAHIT_DESC: " Jako zakladateli říše $e_majapahit$ je tvé jméno navěky vytesáno do vrcholků hory Semeru."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_RYUKYU_DESC: " Tvou zásluhou došlo ke sjednocení ostrovních klanů a vznikla $e_ruucuu_adj$ říše."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_SIAM_DESC: " Jako zakladateli $k_siam$ království je tvé jméno navěky vepsáno do lidských dějin."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_BRUNEI_KINGDOM_DESC: " Jako zakladatel $k_brunei$ království jsi inspiroval svůj lid a sjednotil jej pod nebem Alláha."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_BRUNEI_EMPIRE_DESC: " Věřící Bornea si tě jako zakladatele $e_brunei$ říše budou pamatovat coby svého pastýře, který držel zlo v povzdálí."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_ISRAEL_DESC: " Právě díky tvému úsilí a píli vzniklo království $k_israel$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_OUTREMER_DESC: " Nikdo nevěřil, že je to možné, přesto se ti podařilo ovládnout nejspornější posvátnou oblast světa a založit říši $e_outremer$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_SWITZERLAND_DESC: " Ani z vrcholu Alp nelze dohlédnout na vše, co ti náleželo po založení království $k_switzerland$."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_AUSTRIA_DESC: " Po tvé vládě patří arcivévodství mezi nejváženější mocnosti Evropy."
 SUCCESSION_EVENT_WINDOW_END_DATE_CREATED_ARAGON_DESC: " Království $k_aragon$ se zrodilo podél klikatých břehů řeky Aragón a navždy zůstane svědectvím tvé slavné vlády."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_ROMAN_EMPIRE_DESC: " Díky tobě celý svět ví, že i kdyby Řím po tisíciletí ležel v troskách, $h_roman_empire$ se vždy vrátí."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_DUMNONIA_DESC: " Díky tobě Kornové znovu povstali a obnovili království $k_cornwall$."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_CAROLINGIAN_DESC: " To, o čem Karel Veliký jen snil, se díky tobě stalo skutečností. $e_france$ znovu povstala."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_HOLY_ROMAN_EMPIRE_DESC: " Tvá vláda byla skutečným ztělesněním ztracené slávy $e_hre$, která díky tobě znovu povstala."
 SUCCESSION_EVENT_WINDOW_END_DATE_RESTORED_OLD_VASCONIA_DESC: " Z tvé vůle Baskové pod praporem království Vasconie znovu získali svá ztracená území na Pyrenejském poloostrově."
