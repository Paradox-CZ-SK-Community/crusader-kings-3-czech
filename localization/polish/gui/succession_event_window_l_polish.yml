 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CYNICAL_ARBITRARY: "Zcela postrádá morální kompas. [ROOT.Char.Custom('GetSubjectPlural')] se budou muset rozhodnout, zda [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] mají respektovat, nebo se [Select_CString( ROOT.Char.IsFemale, 'jí', 'ho' )] obávat."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CRUEL_WRATHFUL: "[Select_CString( ROOT.Char.IsFemale, 'Skutečná sadistka', 'Skutečný sadista' )]; mnozí se obávají, že [ROOT.Char.Custom('GetRealmOrDomicile')] se za této vlády promění v místo hrůzy."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_WRATHFUL_ZEALOUS: "[Select_CString( ROOT.Char.IsFemale, 'Oslepena', 'Oslepen' )] náboženským zápalem; [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] brzy poznají [Select_CString( ROOT.Char.IsFemale, 'její', 'jeho' )] spravedlivý hněv."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_PARANOID_DECEITFUL: "Prohnanost a nedůvěra vedou mnohé k očekávání, že má připravenou dýku se jménem každého z nás."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_COMPASSIONATE: "Laskavá a soucitná duše; vazalové budou za vlády [ROOT.Char.GetFirstNamePossessiveNoTooltip] jistě vzkvétat."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARROGANT: "Bezmezně si věří. Rod [ROOT.Char.GetHouse.GetName] může za vlády [ROOT.Char.GetFirstNamePossessiveNoTooltip] čekat sláva či hanba — ukáže teprve čas."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CYNICAL: "Posvátný text této víry je [ROOT.Char.GetFaith.ReligiousText], ale jeho slov nikdy nedbá. Mnozí se obávají, že vláda [ROOT.Char.GetFirstNamePossessiveNoTooltip] skončí předčasně, neboť [ROOT.Char.GetFaith.HighGodName] [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] srazí."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GREGARIOUS: "Výřečnost a společenskost dávají mnohým jistotu, že [ROOT.Char.GetFirstNameNoTooltip] bez potíží získá dvůr na svou stranu."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ZEALOUS: "Dlouhé hodiny tráví modlitbami, a tak nehrozí, že se [ROOT.Char.GetFaith.HighGodName] rozhněvá. [ROOT.Char.Custom('GetRealmOrDomicile')] čeká za vlády [ROOT.Char.GetFirstNamePossessiveNoTooltip] požehnání."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_AMBITIOUS: "Ctižádostivost dává mnohým naději, že [ROOT.Char.Custom('GetRealmOrDomicile')] za této vlády poroste a bude vzkvétat."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_DILIGENT: "Energie a rozvaha slibují schopnou vládu. [ROOT.Char.Custom('GetRealmOrDomicile')] bude za vlády [ROOT.Char.GetFirstNamePossessiveNoTooltip] jistě vzkvétat."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_DECEITFUL: "Prohnanost a prolhanost jsou hlavními zbraněmi [ROOT.Char.GetFirstNamePossessiveNoTooltip], ale svár se samotnou pravdou může přivodit i vlastní zkázu."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_SHY: "[Select_CString( ROOT.Char.IsFemale, 'Mlčenlivá', 'Mlčenlivý' )] [ROOT.Char.GetWomanMan|l]; mnozí neočekávají, že se [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] bude dařit v diplomatických záležitostech."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_HUMBLE: "[Select_CString( ROOT.Char.IsFemale, 'Zbožná a skromná', 'Zbožný a skromný' )] [ROOT.Char.GetWomanMan|l]. Mnozí se obávají, že pro [ROOT.Char.GetFirstNameNoTooltip] nabízí vhodnější místo [ROOT.Char.GetFaith.HouseOfWorship] než trůn."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ARBITRARY: "[Select_CString( ROOT.Char.IsFemale, 'Zkažená a nespravedlivá', 'Zkažený a nespravedlivý' )] [ROOT.Char.GetWomanMan|l]; mnozí neočekávají, že vazalové budou nečinně přihlížet, pokud [ROOT.Char.Custom('GetRealmOrDomicile')] začne pod touto vládou upadat."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_TEMPERATE: "[Select_CString( ROOT.Char.IsFemale, 'Skromná a umírněná', 'Skromný a umírněný' )] [ROOT.Char.GetWomanMan|l], avšak pasivní povaha [ROOT.Char.GetFirstNamePossessiveNoTooltip] může přivodit i vlastní zkázu."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CHASTE: "Věrnost choti a rodině je nezpochybnitelná. [ROOT.Char.GetFirstNameNoTooltip] jistě postaví blaho své dynastie nad všechny osobní zájmy."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_LUSTFUL: "[Select_CString( ROOT.Char.IsFemale, 'Její', 'Jeho' )] oči již hledají další cíl. [ROOT.Char.Custom('GetRealmOrDomicile')] má vazaly, kteří udělají dobře, když po nástupu [ROOT.Char.GetFirstNameNoTooltip] na trůn ukryjí své protějšky."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CONTENT: "[Select_CString( ROOT.Char.IsFemale, 'Spokojená', 'Spokojený' )] se svým údělem; vazalové [ROOT.Char.GetFirstNamePossessiveNoTooltip] se mohou [Select_CString( ROOT.Char.IsFemale, 'její', 'jeho' )] pasivní povaze vysmívat."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_PATIENT: "[Select_CString( ROOT.Char.IsFemale, 'Trpělivá', 'Trpělivý' )] [ROOT.Char.GetWomanMan|l] ochotně čeká, až plány dozrají. Mnozí očekávají, že [ROOT.Char.Custom('GetRealmOrDomicile')] čekají velké změny — byť pomalé."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_BRAVE: "Odvaha a ochota okamžitě jednat vzbuzují naději i obavy. Mnozí doufají, že [ROOT.Char.Custom('GetRealmOrDomicile')] kvůli statečnosti [ROOT.Char.GetFirstNamePossessiveNoTooltip] neupadne do lehkomyslné zkázy."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_JUST: "Spravedlnost a nestrannost ve všech záležitostech dávají mnohým naději, že každý konflikt vyřeší s noblesou."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GLUTTONOUS: "[ROOT.Char.GetWomanMan|U] s velkou chutí k jídlu. Mnozí doufají, že před vlastním hladem dostane přednost [ROOT.Char.Custom('GetRealmOrDomicile')]."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CALLOUS: "Chladnost a bezcitnost znesnadní vazalům získat [Select_CString( ROOT.Char.IsFemale, 'její', 'jeho' )] důvěru."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CRAVEN: "Jako zbabělec sotva získá úctu těch, jimž vládne."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GREEDY: "[Select_CString( ROOT.Char.IsFemale, 'Chamtivá', 'Chamtivý' )] [ROOT.Char.GetWomanMan|l] si mezi rolnictvem sotva získá oblibu."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CRUEL: "[Select_CString( ROOT.Char.IsFemale, 'Zlomyslná', 'Zlomyslný' )] [ROOT.Char.GetWomanMan|l]. Dvůr [ROOT.Char.GetFirstNamePossessiveNoTooltip] bude podle mnohých žít ve strachu."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_TRUSTING: "Důvěřivost a samolibost mohou vést k tomu, že rada [ROOT.Char.GetFirstNamePossessiveNoTooltip] nad [Select_CString( ROOT.Char.IsFemale, 'ní', 'ním' )] získá větší moc, než je záhodno."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_HONEST: "Nedokáže lhát a mnozí se obávají, že taková přímočarost není vhodná pro spletité nástrahy politiky."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_LAZY: "Zahálčivost budí obavy, že vláda [ROOT.Char.GetFirstNamePossessiveNoTooltip] nepřinese vůbec nic."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GENEROUS: "[Select_CString( ROOT.Char.IsFemale, 'Štědrá', 'Štědrý' )] [ROOT.Char.GetWomanMan|l]. Mnozí doufají, že dobré srdce nepovede k vyprázdnění pokladnice kvůli marným záměrům."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_WRATHFUL: "Snadno propadá hněvu. Nepřátelé i vazalové [ROOT.Char.GetFirstNamePossessiveNoTooltip] budou pravděpodobně žít ve strachu."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_PARANOID: "[Select_CString( ROOT.Char.IsFemale, 'Podezíravá', 'Podezíravý' )] [ROOT.Char.GetWomanMan|l]. Paranoia [ROOT.Char.GetFirstNamePossessiveNoTooltip] se [ROOT.Char.Custom('GetSubjectPlural')] nemusí zamlouvat."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_STUBBORN: "[Select_CString( ROOT.Char.IsFemale, 'Tvrdohlavá', 'Tvrdohlavý' )] [ROOT.Char.GetWomanMan|l]. Jakmile se [ROOT.Char.GetFirstNameNoTooltip] rozhodne, [ROOT.Char.Custom('GetSubjectPlural')] se jen těžko dostanou ke slovu."
 SUCCESSION_EVENT_WINDOW_HEIR_PIETY: "[Select_CString( ROOT.Char.IsFemale, 'Zbožná', 'Zbožný' )] [ROOT.Char.GetWomanMan|l]. [ROOT.Char.GetFaith.PriestMalePlural] jistě ohromí rozsáhlé znalosti posvátného textu, jímž je [ROOT.Char.GetFaith.ReligiousText]."
 SUCCESSION_EVENT_WINDOW_HEIR_PRESTIGE: "[Select_CString( ROOT.Char.IsFemale, 'Proslulá', 'Proslulý' )] [ROOT.Char.GetWomanMan|l], před [Select_CString( ROOT.Char.IsFemale, 'níž', 'nímž' )] se jistě pokloní hodnostáři ze širokého okolí."
 SUCCESSION_EVENT_WINDOW_HEIR_FRIENDS: "Hojnost přátel je požehnáním a vláda [ROOT.Char.GetFirstNamePossessiveNoTooltip] v nich pravděpodobně nalezne pevnou oporu."
 SUCCESSION_EVENT_WINDOW_HEIR_TYRANT: "[Select_CString( ROOT.Char.IsFemale, 'Již nyní je nenáviděnou tyrankou', 'Již nyní je nenáviděným tyranem' )] a [ROOT.Char.Custom('GetRealmOrDomicile')] se před touto vládou chvěje."
 SUCCESSION_EVENT_WINDOW_HEIR_RICH: "Disponuje pohádkovým bohatstvím. Teprve čas ukáže, zda [ROOT.Char.Custom('GetRealmOrDomicile')] za této vlády rozkvete, nebo zda bude nový vládce sedět na zlatě jako drak."
 SUCCESSION_EVENT_WINDOW_HEIR_CHILDREN: "Má již mnoho potomků, a tak má [ROOT.Char.Custom('GetRealmOrDomicile')] četné možné dědice."
 SUCCESSION_EVENT_WINDOW_HEIR_RIVALS: "[Select_CString( ROOT.Char.IsFemale, 'Obklopena', 'Obklopen' )] nepřáteli a soky. Mnozí doufají, že vládu [ROOT.Char.GetFirstNamePossessiveNoTooltip] předčasně neukončí dýka vražená do zad."
 SUCCESSION_EVENT_WINDOW_HEIR_COMBAT_SKILLS: "[Select_CString( ROOT.Char.IsFemale, 'Obávaná duelantka', 'Obávaný duelant' )], od [Select_CString( ROOT.Char.IsFemale, 'níž', 'něhož' )] mnozí očekávají vynikající výsledky na turnajích i v osobním boji."
 SUCCESSION_EVENT_WINDOW_HEIR_POOR_HEALTH: "[Select_CString( ROOT.Char.IsFemale, 'Slabá a chorobná', 'Slabý a chorobný' )] [ROOT.Char.GetWomanMan|l]. [ROOT.Char.Custom('GetRealmOrDomicile')] doufá, že se [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] vrátí dobré zdraví."
 SUCCESSION_EVENT_WINDOW_HEIR_BASTARD: "Jako nemanželské dítě se [ROOT.Char.GetFirstNameNoTooltip] jistě pokusí zanechat v dějinách vlastní stopu."
 SUCCESSION_EVENT_WINDOW_HEIR_VIKING: "Po vedení mnoha nájezdů je jméno [ROOT.Char.GetFirstNamePossessiveNoTooltip] známé a obávané po celém světě."
 SUCCESSION_EVENT_WINDOW_HEIR_CRUSADER: "[ROOT.Char.GetFirstNameNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'vedla', 'vedl' )] svaté válečníky proti nevěřícím. [ROOT.Char.GetFaith.HighGodName] proto jistě hledí na jméno [ROOT.Char.GetFirstNamePossessiveNoTooltip] s přízní."
 SUCCESSION_EVENT_WINDOW_HEIR_THREE_SKILLS: "Rozmanité dovednosti jistě vzbudí obdiv. [ROOT.Char.Custom('GetSubjectPlural')] budou na novou vládu hledět s úctou."
 SUCCESSION_EVENT_WINDOW_HEIR_FIVE_SKILLS: "Ohromující znalosti všeho mezi nebem a zemí jsou příslibem, že vláda [ROOT.Char.GetFirstNamePossessiveNoTooltip] vstoupí do legend."
 SUCCESSION_EVENT_WINDOW_HEIR_DREAD: "Budí hrůzu a již nyní má pověst nelítostného a krutého vládce."
 SUCCESSION_EVENT_WINDOW_HEIR_GENDER: "Někteří se obávají, že skutečnost, že na trůn usedá [ROOT.Char.GetWomanMan|l], může být předzvěstí nejistých časů."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_REVELER: "[Select_CString( ROOT.Char.IsFemale, 'Okouzlující a společenská', 'Okouzlující a společenský' )] [ROOT.Char.GetWomanMan|l]. [ROOT.Char.Custom('GetRealmOrDomicile')|U] [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] zná jako laskavého hostitele, kterého oslavuje mnoho šlechticů."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_ADMINISTRATOR: "Díky učenosti a zkušenostem se správou patří mezi nejzpůsobilejší osoby, které mohou usednout na trůn."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_SCHOLAR: "Proslulost zájmem o metafyzické otázky může znamenat nedostatečnou připravenost na každodenní problémy světské vlády."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CALLOUS_LONER: "[Select_CString( ROOT.Char.IsFemale, 'Chladná a bezcitná', 'Chladný a bezcitný' )] [ROOT.Char.GetWomanMan|l], o [Select_CString( ROOT.Char.IsFemale, 'níž', 'němž' )] se říká, že nic necítí a na nikom [Select_CString( ROOT.Char.IsFemale, 'jí', 'mu' )] nezáleží."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_VENGEFUL: "[Select_CString( ROOT.Char.IsFemale, 'Malicherná a mstivá', 'Malicherný a mstivý' )] [ROOT.Char.GetWomanMan|l]. Vazalové budou muset v [Select_CString( ROOT.Char.IsFemale, 'její', 'jeho' )] přítomnosti našlapovat opatrně."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_DEPRESSED: "Melancholická duše toužící po útěše. [ROOT.Char.GetFirstNameNoTooltip] možná postrádá sílu potřebnou k vedení těch, jimiž jsou [ROOT.Char.Custom('GetSubjectPlural')]."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_BLIND_WEAK: "[Select_CString( ROOT.Char.IsFemale, 'Slepá a slabá', 'Slepý a slabý' )] [ROOT.Char.GetWomanMan|l]. [ROOT.Char.Custom('GetRealmOrDomicile')|U] tak zůstává v rukou [Select_CString( ROOT.Char.IsFemale, 'jejích', 'jeho' )] pomocníků."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_EXCOMMUNICATED: "Církev [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] exkomunikovala, a tak se ujímá moci se znamením kacíře. Mnozí se obávají, že [ROOT.Char.Custom('GetRealmOrDomicile')] přivede do záhuby."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_BERSERKER: "[Select_CString( ROOT.Char.IsFemale, 'Nelítostná a neúnavná válečnice', 'Nelítostný a neúnavný válečník' )], o [Select_CString( ROOT.Char.IsFemale, 'níž', 'němž' )] se říká, že vyje na měsíc a v bitvě pije krev svých nepřátel."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CANNIBAL: "Podle pověstí hoduje na lidském mase, a proto bude muset vykonat mnohé, aby si získal důvěru svých vazalů."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CRIMINAL: "Obklopuje [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] mnoho odporných pověstí, přičemž některé jsou krutější a ohavnější než jiné."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_WITCH: "Podle pověstí míchá zakázané byliny a sesílá kletby na své nepřátele. Získat důvěru těch, jimiž jsou [ROOT.Char.Custom('GetSubjectPlural')], proto může být obtížné."
 SUCCESSION_EVENT_WINDOW_HEIR_UNIMPRESSIVE: "Dosud se nemůže pochlubit mnoha úspěchy, a tak lze jen těžko odhadnout, jakým vládcem se nakonec stane."
