 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_TEMPERATE_LUSTFUL: "Svému protějšku se vždy ochotně věnuje, a proto mnozí očekávají, že královská rodina poroste a bude vzkvétat."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GENEROUS_JUST: "[Select_CString( ROOT.Char.IsFemale, 'Nestranná', 'Nestranný' )] [ROOT.Char.GetWomanMan|l] podle mnohých zajistí, aby se každému dostalo spravedlivého dílu."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_DILIGENT_GREEDY: "[Select_CString( ROOT.Char.IsFemale, 'Pracovitá', 'Pracovitý' )] [ROOT.Char.GetWomanMan|l]; [ROOT.Char.Custom('GetRealmOrDomicile')] za této vlády buď zbohatne, nebo bude přiveden k úpadku."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_CRAVEN_HONEST: "Své četné slabosti vždy ochotně přiznává. Lze však silně pochybovat, zda [ROOT.Char.Custom('GetRealmOrDomicile')] vloží důvěru do nové vlády."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_SHY_TRUSTING: "[Select_CString( ROOT.Char.IsFemale, 'Naivní', 'Naivní' )] [ROOT.Char.GetWomanMan|l]; zdráhavá povaha může zabránit tomu, aby se skutečně [Select_CString( ROOT.Char.IsFemale, 'ujala', 'ujal' )] vlády."
