 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_PATIENT_TRUSTING: "[Select_CString( ROOT.Char.IsFemale, 'Důvěřivá a trpělivá', 'Důvěřivý a trpělivý' )] [ROOT.Char.GetWomanMan|l], [ROOT.Char.GetFirstNameNoTooltip], pevně věří, že dobré věci nakonec přijdou samy."
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_PARANOID_STRESSED: "Přízraky číhající za každým rohem budou tuto vládu pravděpodobně naplňovat strachem."
