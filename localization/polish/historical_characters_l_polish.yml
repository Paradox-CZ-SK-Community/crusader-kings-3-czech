 nick_la_hire_desc: "Existuje mnoho vysvětlení, odkud přezdívka „La Hire“ pochází. Podle jedněch mu tak začali říkat Angličané jako „the Hire-God“ („Boží hněv“), podle jiných pochází ze starofrancouzského slova „hīra“, které znamená „hněv“ či „hněvivý“. Další možností je, že jeho jméno vychází z francouzského slova pro „ježka“ („hérisson“), protože měl pichlavou povahu."
