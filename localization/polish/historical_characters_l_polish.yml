l_polish:
 HISTORICAL_CHARACTER_TOOLTIP: "#T Historická postava#!\n\n#high [Character.Custom('HistoricalCharacterDesc')]#!\n\n#weak Jde o historickou postavu, která se však může oproti své skutečné předloze lišit v závislosti na [Concept('culture','kultuře')|E] a [Concept('faith','víře')|E] svého místa původu. Ve hře se také může objevit přibližně o 1 až 5 let dříve či později než v době svého historického významu.#!"
 danger_dynasty_abandon_tt: "#X @warning_icon! Opustíš svou [Concept('dynasty','dynastii')|E] a nebudeš moci pokračovat ve hře za její členy!#!"
 will_wander_tt: "[historical_character.GetFullName] se stane [Concept('wanderer',Select_CString(historical_character.IsFemale,'pocestnou','pocestným'))|E]"
 historical_char_creation_events.t: "Ozvěny historie: [historical_character.GetFullNameNicknamedNoTooltip]"
 historical_char_creation_events.desc: "[historical_character.Custom('HistoricalCharacterJobDesc')], [Select_CString(historical_character.IsFemale,'známá','známý')] jako [historical_character.GetFullNameNicknamed], údajně putuje mým panstvím a hledá službu. [Select_CString(historical_character.IsFemale,'Jejím','Jeho')] rodištěm je [birth_location.GetName] a působí [historical_character.Custom('DescriptorPositiveStandalone')], ale zároveň poněkud [historical_character.Custom('DescriptorNegativeStandalone')].\n\n\n@historical_character_icon! #weak Tato postava je historická:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_char_creation_events_alternative.desc: "[historical_character.Custom('HistoricalCharacterJobDesc')], [Select_CString(historical_character.IsFemale,'známá','známý')] jako [historical_character.GetFullNameNicknamed], se u dvora [Select_CString(historical_character.IsFemale,'proslavila','proslavil')]. Působí [historical_character.Custom('DescriptorPositiveStandalone')] a přestože nedokážu říct proč, je na [Select_CString(historical_character.IsFemale,'ní','něm')] cosi mimořádného...\n\n\n@historical_character_icon! #weak Tato postava je historická:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_char_creation_events.1.a: "Zajímalo by mě, jaký osud [Select_CString(historical_character.IsFemale,'ji','ho')] čeká..."
 historical_char_creation_events.1.b: "[Select_CString(historical_character.IsFemale,'Taková žena by mi mohla','Takový muž by mi mohl')] dobře sloužit!"
 historical_char_creation_events.1.c: "[historical_character.GetFullNameNoTooltip]? Koho to zajímá!"
 historical_char_creation_events.2.t: "Náboženská reforma: úspěch"
 historical_char_creation_events.2.desc: "[inspiration_owner.GetFullName] [Select_CString(inspiration_owner.IsFemale,'strávila','strávil')] nespočet dní a nocí zahlouban[Select_CString(inspiration_owner.IsFemale,'á','ý')] do knih a posvátných textů a [Select_CString(inspiration_owner.IsFemale,'sepsala','sepsal')] bezpočet spisů a tezí. Když čtu, co [Select_CString(inspiration_owner.IsFemale,'napsala','napsal')], o genialitě nelze pochybovat...\n\nNeuvěřitelné. Tohle by mohlo změnit #EMP všechno.#!"
 historical_char_creation_events.2.a: "Tato posvátná slova se musí šířit!"
 religious_reformer_modifier: "Náboženský reformátor"
 religious_reformer_modifier_desc: "Díky pomoci velkého myslitele je tato postava připravena vytvořit novou víru.\n\nTento modifikátor bude odstraněn, pokud bude vytvořena nová [Concept('faith','víra')|E]"
 mass_conversion_tt: "Umožní jednou použít [Concept('decision','rozhodnutí')|E] #V $legendary_conversion$#!"
 religious_inspiration: "Náboženská inspirace"
 religious_inspiration_desc: "Postavy s Náboženskou inspirací jsou [Concept('inspired','inspirovány')|E] k tomu, aby vložily srdce i duši do zkoumání složitostí a tajemství [Concept('faith','víry')|E]. Často se z nich stávají velcí reformátoři nebo vůdci náboženských hnutí. Tato inspirace je #EMP velmi vzácná.#!"
 historical_character.karunakara: "Karunakara byl proslulým vojevůdcem čólského krále Kulóttungy a drtil jak nepřátele, tak zrádce čólské věci. Karunakarův život zachycuje báseň Kalinkkattuparani, která oslavuje jeho podrobení Kalingy a následné vzdání pocty Kulóttungovi."
 historical_character.sekkilhar: "Sekkilhar byl jako geniální dítě již v útlém věku povolán rádžou Kulóttungou do služeb jako vážený ministr a státník. Nejvíce se proslavil sepsáním Periya Puranam, životopisného díla o 63 šivaistických nájanárech ve 4253 verších. Nakonec byl sám Sekkilhar prohlášen za svatého a dodnes je v oblasti uctíván při náboženských procesích."
 historical_character.omar_khayyam: "Omar Chajjám byl perský polyhistor, básník, matematik a astronom 11. století. Dnes je nejznámější svou poezií shromážděnou v díle „Rubáiját“, významně však přispěl také k rozvoji algebry a astronomie v Persii. Jeho vědecká práce na klasifikaci a řešení kubických rovnic představuje monumentální úspěch v dějinách matematiky."
 historical_character.bhaskaracharya: "Bháskaráčárja byl indický matematik a astronom 12. století, který sepsal zásadní dílo „Siddhanta Shiromani“. Toto rozsáhlé pojednání se zabývá aritmetikou, algebrou, matematikou pohybu planet i sférickou trigonometrií. Jeho práce v oblasti infinitezimálního počtu předběhla Newtona a Leibnize o více než pět století."
 historical_character.joseph_rabban: "Joseph Rabban byl významnou osobností židovské komunity v Malabaru 9. století. Čérský král mu udělil práva a výsady pro židovskou komunitu v Kóčinu a Rabbanovo vedení pomohlo upevnit židovskou přítomnost a vliv v jižní Indii. Jeho působení zajistilo komunitě autonomii a uznání jejích obchodních a kulturních přínosů."
 historical_character.atisha: "Atíša, jedno z nejvýznamnějších jmen středověkého buddhismu, byl náboženským vůdcem původem z Bengálska, úzce však spjatým s klášterem Vikramašíla v Biháru. Svým dílem přispěl k šíření mahájánového i vadžrajánového buddhismu po jihovýchodní Asii a Tibetu."
 historical_character.hemachandra: "Hémačandra byl indický učenec, polyhistor a džinistický mnich 12. století. Významně přispěl k matematice, gramatice, prozódii a filozofii. Jeho „Siddhahem“ patří ke klíčovým dílům džinistické literatury a jeho učení výrazně ovlivnilo džinistické vzdělávání i náboženskou praxi."
 historical_character.kshemendra: "Kšéméndra byl kašmírský básník a učenec 11. století, jehož všestranná literární tvorba zahrnovala satiry, parodie i náboženské texty. K jeho významným dílům patří „Samaya Matrika“ a „Darpadalana“, v nichž s humorem kritizoval mravy své doby, čímž si vydobyl jedinečné místo v klasické sanskrtské literatuře."
 historical_character.akka_mahadevi: "Akka Mahadevi byla kannadská básnířka 12. století a významná osobnost lingájatského hnutí bhakti. Proslula svými vačanami neboli básnickými skladbami a vydala se cestou duchovní oddanosti a osvobození. Zřeknutím se světského života zpochybňovala společenské normy a prosazovala rovnost žen a jejich plné uplatnění v duchovním životě."
 historical_character.namdev: "Námdév byl maráthský světec a básník 13. století, známý svými zbožnými písněmi zasvěcenými Vithobovi a jako významná osobnost hnutí bhakti v Maháráštře. Jeho díla byla oblíbená mezi prostým lidem a výrazně přispěla také k rozšíření a prestiži maráthštiny jako jazyka poezie a náboženství."
 historical_character.madhvacharya: "Madhváčárja byl indický filozof 13. století a hlavní zastánce dvaitové školy védánty. Učil, že duše (átman) a nejvyšší skutečnost (brahman) jsou od sebe odlišné, což bylo v ostrém rozporu s tehdy převládajícími nedualistickými filozofiemi. Jeho spisy a disputace výrazně utvářely hinduistickou teologii."
 historical_character.vidyapati: "Vidjápati byl básník a učenec 14. století pocházející z indického Biháru. Proslul milostnými písněmi a zbožnými hymny zasvěcenými Šivovi, které hluboce ovlivnily hnutí bhakti. Jeho díla jsou ceněna pro svou lyrickou krásu a hluboký citový výraz."
 historical_character.abhinavagupta: "Abhinavagupta byl kašmírský indický filozof a mystik přelomu 10. a 11. století. Je považován za jednoho z největších učenců nedualistického šivaismu. Abhinavaguptovo dílo výrazně ovlivnilo hinduistickou filozofii, zejména jeho teorie estetiky a spirituality obsažené v komentáři „Abhinavabharati“."
 historical_character.basava: "Basava byl indický filozof a společenský reformátor 12. století, který založil lingájatské hnutí. Jeho učení zpochybňovalo tradiční kastovní systém a zdůrazňovalo oddanost Šivovi. Basavovy vačany neboli básnické skladby hlásaly duchovní rovnost a formovaly hnutí bhakti. Jeho myšlenky výrazně ovlivnily středověkou indickou společnost i náboženství."
 historical_character.hildegard: "Hildegarda z Bingenu byla pokrokově smýšlející abatyše, mystička, spisovatelka a skladatelka proslulá svými náboženskými vizemi a učenými díly. Sepsala texty o teologii, lékařství a hudbě a přispěla tak ke středověkému křesťanskému myšlení. Hildegarda byla známá také svými liturgickými skladbami a dramaty a kladla důraz na duchovní i celostní uzdravení."
 historical_character.thomas_aquinas: "Tomáš Akvinský byl dominikánský teolog a filozof, proslulý propojením aristotelské filozofie s křesťanskou teologií ve své „Summa Theologica“. Prosazoval slučitelnost rozumu a víry a zásadně ovlivnil křesťanskou nauku, přirozené právo i etiku. Akvinského odkaz přetrvává také díky jeho svatořečení a titulu učitele církve."
 historical_character.dante_alighieri: "Dante Alighieri byl italský básník proslulý „Božskou komedií“, epickou poutí peklem, očistcem a rájem. Jeho dílo zanechalo trvalou stopu v západní literatuře i křesťanské teologii. Dantovo zkoumání morálky a lidské přirozenosti mu vyneslo označení „otec italského jazyka“."
 historical_character.thomas_becket: "Tomáš Becket byl anglický arcibiskup a mučedník, známý především svým sporem s králem Jindřichem II. o práva církve. Jeho neústupná obrana církevní autority vedla roku 1170 k jeho zavraždění v canterburské katedrále. Becketovo mučednictví upevnilo jeho postavení světce a jeho hrob v Canterbury se stal významným poutním místem."
 historical_character.maimonides: "Maimonides byl židovský filozof a učenec 12. století. Nejvíce se proslavil dílem „Mišne Tora“, kodifikací židovského práva, a „Průvodcem zbloudilých“, který se zabývá vztahem náboženství a filozofie. Je považován za jednoho z nejvlivnějších židovských myslitelů v dějinách."
 historical_character.chretien_de_troyes: "Chrétienovy příběhy psané ve staré francouzštině sehrály klíčovou úlohu ve vývoji artušovské legendy. Zavedením motivů dvorské lásky a Svatého grálu v dílech jako „Lancelot aneb Rytíř s károu“ a „Perceval aneb Příběh o grálu“ výrazně ovlivnil rytířskou literaturu. Jeho tvorba zdůrazňuje témata rytířství, hrdinství a dvorské lásky."
 historical_character.egil_skallagrimrsson: "Proslulý islandský válečník a básník Egill Skallagrímsson je ústřední postavou „Ságy o Egilovi, synu Skallagrímově“. Je známý svou prchlivou povahou a básnickým nadáním a připomínán pro své násilné činy, působivé verše i významnou úlohu při raném osídlování Islandu a vikinských nájezdech v Anglii."
 historical_character.gunnlaug_ormstunga: "Gunnlaug Hadí jazyk, hlavní postava „Ságy o Gunnlaugovi Hadím jazyku“, byl vikinský válečník a básník známý svými cestami a básnickým soupeřením. Sága vypráví jeho tragický milostný příběh a střet s básnickým sokem a zachycuje význam cti a slávy ve vikinské společnosti."
 historical_character.torbjorg_the_seeress: "Věštkyně Þorbjörg je prorockou postavou vystupující v „Sáze o Eriku Rudém“. Proslula praktikováním spá (věštění) a seiðru (severské magie) a sehrála důležitou úlohu při předpovídání budoucích událostí. Její obřadní vystoupení v sáze odráží severskou víru v moc proroctví."
 historical_character.erik_rode: "Erik Rudý byl vikinský mořeplavec a zakladatel prvních severských osad v Grónsku. Proslul dobrodružnou povahou a vedením kolonizačních výprav, které založily společenství přetrvávající několik staletí."
 historical_character.alhazen: "Hasan al-Haytham byl arabský matematik a fyzik 11. století, proslulý svým dílem v oblasti optiky. Jeho kniha „Kitab al-Manazir“ („Kniha optiky“) položila základy moderní optiky a ve středověku ovlivnila západní vědu. Je připomínán pro svůj důsledný experimentální přístup a významný přínos islámskému zlatému věku."
 historical_character.ibn_battuta: "Ibn Battúta byl marocký cestovatel 14. století, proslulý svými rozsáhlými cestami, při nichž urazil přes 120 000 kilometrů napříč islámským světem i za jeho hranicemi. Jeho cestopis „Rihla“ nabízí podrobný pohled na středověké kultury a společnosti a řadí jej mezi nejslavnější cestovatele v dějinách."
 historical_character.william_of_ockham: "Vilém z Ockhamu byl anglický filozof a teolog 14. století, proslulý „Ockhamovou břitvou“, zásadou upřednostňující jednodušší vysvětlení. Jako významná osobnost scholastiky zpochybňoval autoritu církve a prosazoval oddělení světské a duchovní moci. Jeho myšlenky ovlivnily vývoj logiky, vědy a politického myšlení."
 historical_character.geoffrey_chaucer: "Geoffrey Chaucer byl anglický básník a spisovatel 14. století, známý především „Canterburskými povídkami“, sbírkou příběhů vyprávěných během pouti do Canterbury. Jeho dílo je ceněno pro živé postavy, humor a obraz středověké společnosti. Chaucerův přínos anglické literatuře mu vynesl označení „otec anglické poezie“."
 historical_character.aaron_of_lincoln: "Aaron z Lincolnu byl anglický finančník a lichvář 12. století, známý jako jeden z nejbohatších Židů středověké Anglie. Poskytoval šlechtě i církvi značné půjčky na stavební projekty, včetně výstavby katedrál. Po jeho smrti zabavil král Jindřich II. jeho rozsáhlý majetek."
 historical_character.john_wycliffe: "Jan Viklef byl anglický teolog a reformátor 14. století, známý svou ranou kritikou praktik katolické církve. Prosazoval překlad Bible do angličtiny a připravil tak půdu pro protestantskou reformaci. Viklefovo učení, které zpochybňovalo církevní autoritu, ovlivnilo lollardské hnutí i pozdější reformátory, jako byl Martin Luther."
 historical_character.roger_bacon: "Roger Bacon byl anglický filozof a františkánský mnich 13. století, známý jako jeden z raných zastánců vědecké metody. Ve svém bádání zdůrazňoval pozorování a experimentování, čímž přispěl k rozvoji empirické vědy. Baconovy práce v oblasti optiky a alchymie ovlivnily pozdější středověké učence."
 historical_character.heloise_dargenteuil: "Heloisa z Argenteuil byla francouzská abatyše a učenka 12. století, známá především svou korespondencí s Petrem Abélardem. Její dopisy jsou proslulé vášnivým i intelektuálním obsahem a dokládají její mimořádný intelekt i citovou hloubku. Heloisa se později stala abatyší kláštera Paraklét, kde prokázala výrazné vůdčí schopnosti."
 historical_character.peter_abelard: "Petr Abélard byl francouzský filozof a teolog 12. století, proslulý svým scholastickým přístupem a kontroverzním vztahem s Heloisou. Ve svém díle „Sic et Non“ využíval dialektické uvažování ke zkoumání teologických otázek. Abélardův život a dílo výrazně ovlivnily středověkou filozofii a jeho milostný příběh s Heloisou zůstává jedním z klasických příběhů středověku."
 historical_character.petrarch: "Francesco Petrarca byl italský učenec a básník 14. století, všeobecně považovaný za „otce humanismu“. Nejvíce se proslavil svými sonety a básněmi, zejména sbírkou „Canzoniere“, věnovanou jeho neopětované lásce k Lauře. Petrarcovo dílo zásadně přispělo k rozvoji renesančního humanismu a zdůrazňovalo význam klasické vzdělanosti a jednotlivce."
 historical_character.christine_pizan: "Kristina Pisánská byla francouzská spisovatelka a básnířka 14. století, proslulá díly obhajujícími práva a vzdělávání žen. Napsala „Knihu o městě dam“, v níž se postavila proti misogynii své doby a oslavovala úspěchy žen. Kristininy spisy patřily k prvním dílům zabývajícím se rovností žen a mužů, a učinily z ní průkopnickou obhájkyni žen ve středověké Evropě."
 historical_character.giotto_di_bondone: "Giotto di Bondone byl italský malíř a architekt přelomu 13. a 14. století, proslulý průkopnickým využitím perspektivy a realismu v umění. Jeho tvorba se odklonila od stylizované byzantské tradice a položila základy renesance. Giottovy fresky v kapli Scrovegniů v Padově jsou považovány za mistrovská díla a ovlivnily celé generace umělců."
 historical_character.fibonacci: "Leonardo Pisánský zvaný Fibonacci byl italský matematik přelomu 12. a 13. století, známý především tím, že pomohl zavést hinduisticko-arabskou číselnou soustavu do Evropy. Jeho kniha „Liber Abaci“ zpopularizovala používání arabských číslic a aritmetiky v západním světě. Fibonacci je známý také díky Fibonacciho posloupnosti, matematickému konceptu popisujícímu vzorec nacházený v přírodě i různých oblastech bádání."
 historical_character.giovanni_boccaccio: "Giovanni Boccaccio byl italský spisovatel a básník 14. století, známý především svým „Dekameronem“, sbírkou příběhů vyprávěných deseti lidmi prchajícími před Černou smrtí. Boccacciovo živé vypravěčství a zkoumání lidského chování z něj učinily jednu z klíčových osobností raně renesanční literatury. Jeho díla ovlivnila pozdější autory, jako byl Chaucer, a pomohla utvářet italskou literární tradici."
 historical_character.snorri_sturluson: "Snorri Sturluson byl islandský historik, básník a politik 13. století, proslulý sepsáním „Prozaické Eddy“, základního díla severské mytologie. Jeho spisy patří k nejdůležitějším pramenům pro dnešní poznání severského kulturního dědictví. K jeho dílům patří také „Heimskringla“, kronika norských králů propojující historii s folklorem."
 historical_character.hrotsvitha: "Hrotsvita z Gandersheimu byla německá kanovnice, básnířka a dramatička 10. století, považovaná za první dramatičku křesťanské éry. V gandersheimském klášteře psala divadelní hry, básně a legendy, v nichž spojovala křesťanská témata s vlivy antické tradice a často oslavovala sílu a intelekt žen."
 historical_character.ramanuja: "Rámánudža byl indický teolog 11. století, který sehrál zásadní úlohu při utváření tradice šrí vaišnavismu. Hlásal oddanost Višnuovi a prosazoval osobní a soucitný přístup k duchovnímu životu. Jeho výklad védánty zdůrazňoval višištádvaitu neboli kvalifikovaný nedualismus, čímž se výrazně odlišoval od jiných myšlenkových škol."
 historical_character.arnaldus_de_villa_nova: "Arnald z Villanovy byl katalánský lékař, alchymista a učenec 13. století, proslulý svým přínosem medicíně a chemii. Patřil k raným zastáncům vědeckého přístupu v lékařské praxi a je mu připisována řada lékařských a alchymických spisů. Jeho dílo výrazně ovlivnilo evropské lékařské myšlení i rodící se obor chemie."
 historical_character.ibn_khaldun: "Ibn Chaldún byl arabský učenec z Tunisu 14. století, považovaný za jednoho z otců moderní sociologie, historiografie a ekonomie. Jeho nejslavnější dílo „Muqaddima“ (Úvod) představuje raný pokus oprostit výklad historických a společenských jevů od mýtů a založit jej na rozboru příčin a následků, společenských konfliktů a hospodářských faktorů."
 historical_character.rumi: "Džaláluddín Rúmí byl perský básník, teolog a súfijský mystik 13. století. Jeho hluboký duchovní odkaz je zachycen v jeho básnických dílech, především v „Masnaví“, které bývá označováno za „Korán v perštině“. Rúmího učení zdůrazňuje bezpodmínečnou lásku, snášenlivost a hledání božské pravdy prostřednictvím osobní duchovní zkušenosti."
 historical_character.avicenna: "Avicenna, známý také jako Ibn Síná, byl perský polyhistor a patří k nejvýznamnějším lékařům, astronomům, myslitelům a spisovatelům islámského zlatého věku. Nejvíce se proslavil monumentálními díly „Kniha uzdravení“ a „Kánon medicíny“, která byla po staletí používána jako základní lékařské texty v islámském světě i v Evropě."
 historical_character.averroes: "Averroes (Ibn Rušd) byl andaluský polyhistor 12. století, proslulý především svými spisy o aristotelské filozofii. Ve svém díle se snažil propojovat islámskou tradici s klasickou řeckou filozofií. Jeho snaha o racionální uchopení filozofie z něj učinila ústřední osobnost islámských i evropských intelektuálních dějin a významně přispěla k pozdějšímu rozvoji renesančního myšlení."
 historical_character.al_biruni: "Al-Bírúní byl perský učenec a polyhistor 11. století, který významně přispěl k řadě vědních oborů včetně astronomie, matematiky a geografie. Rozsáhle se zabýval výpočtem poloměru Země a po doprovodu ghaznovské invaze sestavil obsáhlou studii indických náboženství a filozofií."
 historical_character.rashi: "Raši (Šlomo Jicchaki) byl francouzský rabín a uznávaný židovský učenec 11. století, proslulý svými rozsáhlými komentáři k Talmudu a hebrejské Bibli. Jeho dílo mělo hluboký a trvalý vliv na židovské vzdělávání a právo a dodnes tvoří nedílnou součást tradičního židovského studia."
 historical_character.yehuda_halevi: "Jehuda ha-Levi byl španělský židovský básník a filozof 12. století, proslulý svou procítěnou poezií a filozofickým dialogem. V „Kuzari“ obhajuje filozofické základy judaismu a vyjadřuje svou hlubokou touhu po Siónu. Jeho tvorba spojuje náboženskou oddanost s bohatou lyrickou tradicí a řadí jej mezi ústřední postavy středověké hebrejské literatury."
 historical_character.shaprut: "Chasdai ibn Šaprút byl židovský lékař, diplomat a učenec 10. století působící v muslimském Španělsku. Jako důvěrník chalífy Abd ar-Rahmána III. sehrál klíčovou úlohu v intelektuálním a diplomatickém životě córdobského dvora a podporoval kulturní výměnu mezi židovskými a islámskými učenci."
 historical_character.gersonides: "Levi ben Geršom, známý také jako Gersonides, byl francouzský židovský filozof, astronom a matematik 14. století. Proslul svým vědeckým přístupem a sepsal několik vlivných pojednání o matematice a astronomii. Známý je také zdokonalováním konstrukce astronomických přístrojů a svými filozofickými úvahami o svobodné vůli a Božím předvědění."
 historical_character.ezra: "Abraham ibn Ezra byl španělský židovský učenec, básník a polyhistor 12. století. Proslul významným přínosem k biblické exegezi, astrologii a matematice. Ibn Ezra hojně cestoval po Středomoří a svými spisy ovlivňoval intelektuální kruhy všude, kam zavítal."
 historical_character.gabriol: "Šlomo ibn Gabirol byl židovský filozof a básník 11. století z muslimského Španělska. Proslul svými novoplatónskými díly, především „Fons Vitae“ („Pramen života“), v němž zkoumal povahu Boha a vesmíru a výrazně ovlivnil židovské i křesťanské myšlení. Ibn Gabirol byl rovněž plodným autorem hebrejské poezie."
 historical_character.nachmanides: "Nachmanides, známý také jako Moše ben Nachman či Ramban, byl židovský učenec a teolog 13. století. Proslul hlubokým komentářem k Tóře a vedoucí úlohou v židovské obci v Gironě. Roku 1263 slavně hájil židovskou víru při barcelonské disputaci. Jeho spisy a učení spojují židovské právo, mystiku a etické nauky."
 historical_character.crescas: "Chasdai Crescas byl židovský filozof 14. století, známý kritikou tehdy převládající aristotelské filozofie. Nejvíce se proslavil filozofickým dílem „Or Adonai“ („Světlo Páně“), v němž vystoupil proti aristotelským názorům a položil některé základy moderní židovské filozofie. Ovlivnil také pozdější myslitele, mezi nimi Spinozu."
 historical_character.saadia: "Sa'adja Ga'on byl židovský filozof, teolog a učenec 10. století. Působil jako hlava proslulé akademie v Súře a proslul svými díly o židovském právu i filozofickým pojednáním „Emunot ve-De'ot“ („Kniha víry a názorů“). Toto dílo představovalo první systematický pokus propojit židovskou teologii s prvky řecké filozofie."
 historical_character.awkal: "Júsuf ibn 'Awkal byl židovský obchodník a cestovatel 10. století z islámského světa, známý podrobnými zprávami o svých obchodních cestách napříč Středomořím, Blízkým východem a částmi Afriky. Jeho písemnosti poskytují cenný vhled do obchodních praktik, kulturních kontaktů a čilého života židovských komunit podél jeho obchodních tras."
 historical_character.benjamin_of_tudela: "Benjamin z Tudely byl židovský cestovatel a objevitel 12. století. Nejvíce se proslavil cestopisem zachycujícím jeho putování Evropou, Asií a Afrikou. Benjamin zanechal podrobné zprávy o židovských komunitách napříč středověkým světem."
 historical_character.marco_polo: "Marco Polo byl benátský kupec, cestovatel a spisovatel, který v letech 1271 až 1295 putoval Asií po Hedvábné stezce. Jeho rozsáhlé zprávy o cestách do Číny za vlády Kublajchána byly zveřejněny v cestopise známém jako „Cesty Marca Pola“ a poskytly Evropanům obsáhlý pohled na asijské země a kultury."
 historical_character.bridget_of_sweden: "Brigita Švédská byla mystička a světice 14. století, známá svými hlubokými náboženskými vizemi a založením řádu brigitek. Po smrti manžela zasvětila svůj život službě Bohu a podnikla několik poutí na svatá místa."
 historical_character.meister_eckhart: "Mistr Eckhart byl teolog, filozof a mystik 13. století, známý svým vlivným učením o podstatě Boha a vztahu lidské duše k božství. Jeho kázání a spisy se zabývají odpoutáním od světských věcí, zrozením Boha v duši a jednotou bytí."
 historical_character.jangar: "Džangar je legendární hrdina ojratského eposu „Džangar“. Proslul vybudováním bájného města Šambhaly a tím, že svůj lid vedl s moudrostí a odvahou. Jeho boje s nepřáteli a úsilí navrátit své zemi mír a blahobyt ztělesňují zápasy a ideály ojratského lidu."
 historical_character.zawisza: "Záviš Černý byl polský rytíř a vojevůdce 15. století, proslulý svou statečností a rytířskostí. Vyznamenal se v bitvě u Grunwaldu roku 1410 a později působil u několika královských dvorů. Roku 1428 padl hrdinskou smrtí při obléhání pevnosti Golubac během křížové výpravy proti Osmanské říši."
 historical_character.theophanes_the_greek: "Theofanés Řek byl významný byzantský malíř. Do vývoje ruské ikonografie vnesl výrazovou a citovou hloubku, čímž se odklonil od formálnějšího byzantského stylu. K jeho nejvýznamnějším dílům patří fresky v chrámu Proměnění Páně v Novgorodu a v chrámu Zvěstování v Moskvě."
 historical_character.nicetas_choniates: "Niketas Choniates byl byzantský státní úředník a historik působící na konci 12. a počátku 13. století. Ve svém proslulém díle „Kronika“ podrobně zachytil byzantský život a politiku v letech 1118 až 1207, včetně úpadku Byzantské říše a událostí čtvrté křížové výpravy."
 historical_character.michael_psellos: "Michael Psellos byl byzantský filozof, politik a historik 11. století. Jako dvořan sloužil několika císařům a sehrál zásadní úlohu při obrození řecké filozofie a věd na byzantském dvoře. Jeho nejvýznamnější dílo „Chronographia“ nabízí pronikavý a podrobný obraz byzantské politiky a dvorského života."
 historical_character.john_tzetzes: "Jan Tzetzes byl byzantský učenec 12. století, známý mimořádně rozsáhlým literárním dílem a hlubokou znalostí klasické literatury. Hojně psal o gramatice, historii a mytologii a jeho nejslavnějším dílem jsou „Chiliady“ neboli „Kniha historií“, sbírka historických a mytologických příběhů ve verších."
 historical_character.theophylact_of_ohrid: "Theofylakt Ochridský byl byzantský arcibiskup a učenec 11. století. Během svého působení v čele ochridského arcibiskupství sehrál zásadní úlohu v náboženském a kulturním životě oblasti a výrazně ovlivnil pravoslavnou teologii."
 historical_character.eustathius_of_thessalonica: "Eustathios ze Soluně byl byzantský učenec, teolog a soluňský arcibiskup 12. století. Proslul svou rozsáhlou literární tvorbou a sepsal podrobné komentáře k Homérovým dílům. Jeho působení v čele arcibiskupství se vyznačovalo snahou obnovit a reformovat úlohu církve ve společnosti po sicilské invazi do Soluně."
 historical_character.nicephorus_blemmydes: "Nikephoros Blemmydes byl byzantský učenec a teolog 13. století. Založil školu a klášter, kde vyučoval a strávil většinu svého života. Rozsáhle psal o filozofii, teologii a přírodních vědách a snažil se uvést klasické filozofické myšlenky do souladu s křesťanskou naukou."
 historical_character.georgius_pachymeres: "Georgios Pachymeres byl byzantský historik a učenec 13. století, známý svým rozsáhlým dílem „Historia Byzantina“, které zachycuje dějiny Byzantské říše v letech 1255 až 1308. Jeho spisy podrobně popisují vládu dynastie Palaiologů i důsledky latinské okupace."
 historical_character.manuel_moschopoulos: "Manuel Moschopulos byl byzantský učenec a gramatik působící na konci 13. a počátku 14. století, známý především svým podílem na obrození klasické řecké vzdělanosti a literatury. Hojně psal o gramatice a vytvářel komentáře ke klasickým autorům ve snaze zachovat a objasnit starověké texty."
 historical_character.theodore_metochites: "Theodóros Metochités byl renesančním člověkem ještě před renesancí, polyhistor, který vynikal ve filozofii, astronomii, matematice i umění a sloužil jako hlavní ministr císaře Andronika II. Palaiologa. Nejvíce proslul jako mecenáš chrámu Chora v Konstantinopoli, kde nechal vytvořit rozsáhlou výzdobu z mozaik a fresek."
 historical_character.michael_choniates: "Michael Choniates byl byzantský učenec, básník a církevní hodnostář 12. století, proslulý především jako athénský arcibiskup v letech 1182 až 1204. V době slábnoucí byzantské moci usiloval o zachování kulturních a intelektuálních tradic Athén."
 historical_character.joseph_tarchaneiotes: "Joseph Tarchaneiotes byl byzantský vojevůdce působící na konci 11. století, známý především svou účastí na byzantských taženích proti seldžuckým Turkům. Ve službách císaře Alexia I. Komnena sehrál důležitou úlohu v několika významných bojích, včetně úspěšné obrany Nikaie."
 historical_character.gemistus_pletho: "Georgios Gemistos Pléthón byl filozof 15. století a neochvějný zastánce novoplatonismu. Sehrál zásadní úlohu v intelektuálním obrození, které předcházelo pádu Konstantinopole. Významně se zapojil do florentského koncilu, kde prosazoval sjednocení pravoslavné a katolické církve."
 historical_character.arethas_of_caesarea: "Arethas z Kaisareie byl arcibiskup, učenec a horlivý sběratel starořeckých rukopisů 10. století. Jako arcibiskup kappadocké Kaisareie významně přispěl k intelektuálnímu a kulturnímu životu Byzance a pomohl uchovat klasické vědění, které později ovlivnilo renesanci."
 historical_character.basil_lekapenos: "Basileios Lakapenos byl mocný eunuch a správce, který na konci 10. století působil jako hlavní ministr za vlády několika byzantských císařů. Jako nemanželský syn císaře Romana I. získal na byzantském dvoře značný vliv díky svému úřadu parakoimomena neboli císařova osobního komorníka."
 historical_character.john_the_orphanotrophos: "Jan Orfanotrofos byl významný eunuch a vlivný dvorský úředník počátku 11. století za vlády císaře Michaela IV. Jako orphanotrofos, veřejný úředník odpovědný za péči o sirotky a chudé, nashromáždil značnou moc a vliv."
 historical_character.samonas: "Samonas byl významný eunuch a vlivný dvorský úředník působící na konci 9. a počátku 10. století za císaře Lva VI. Moudrého. Pocházel ze Samosaty a k moci se vypracoval díky úřadu parakoimomena neboli císařova osobního komorníka, v němž získal značný vliv na byzantském dvoře."
 historical_character.peter_the_eunuch: "Petr Eunuch byl významný byzantský dvorský úředník a důvěryhodný rádce císaře Michaela IV. v 11. století. Jako parakoimomenos sehrál zásadní úlohu při podpoře Michaelova nástupu na trůn a prosazoval zájmy Studijského kláštera."
 historical_character.constantine_the_paphlagonian: "Konstantin Paflagonský byl byzantský eunuch a vlivný dvorský úředník 9. století. Sloužil císaři Lvu VI. Moudrému jako parakoimomenos neboli osobní komorník. Proslul snahou udržet stabilitu dvora v době politických intrik a soupeření jednotlivých frakcí."
 historical_character.peter_the_stratopedarches: "Petr zvaný Stratopedarcha byl významný vojevůdce a eunuch 10. století, který „oplýval tělesnou silou“. Sehrál zásadní úlohu za vlády císaře Basileia II., zejména během povstání vedeného vojevůdcem Bardem Sklerem."
 historical_character.basilios_bessarion: "Basileios Bessarion byl učenec, filozof a kardinál 15. století. Bessarion přestoupil ke katolictví a během florentského koncilu prosazoval sjednocení pravoslavné a katolické církve, protože věřil, že takový krok posílí jednotu křesťanstva tváří v tvář rostoucí osmanské hrozbě."
 historical_character.demetrios_kydones: "Démétrios Kydónés byl významný učenec, překladatel a diplomat 14. století, známý svou podporou latinské a římskokatolické tradice v pravoslavné Byzantské říši. Do řečtiny přeložil řadu děl Tomáše Akvinského a dalších latinských scholastických filozofů."
 historical_character.manuel_holobolos: "Manuel Holobolos byl učenec a úředník 13. století, proslulý svými literárními a rétorickými schopnostmi. Za několika byzantských císařů zastával různé správní úřady a nejvíce je připomínán pro své výmluvné dopisy a projevy."
 historical_character.john_axuch: "Jan Axuch byl byzantský vojevůdce 12. století a hlavní ministr císaře Jana II. Komnena. Původem byl seldžucký Turek, kterého v dětství zajali a vychovali v císařské domácnosti. Axuch se nakonec stal císařovým nejdůvěryhodnějším rádcem a přítelem."
 historical_character.mkhitar_gosh: "Mchitar Goš byl arménský učenec, duchovní a právník 12. století, proslulý svým přínosem arménskému právu a literatuře. Sepsal jednu z nejstarších kodifikací arménského práva, „Datastanagirk“ („Kniha zákonů“)."
 historical_character.shota_rustaveli: "Šota Rustaveli byl gruzínský básník 12. století a jedna z nejvýznamnějších osobností gruzínské literatury. Nejvíce se proslavil epickou básní „Muž v tygří kůži“, která je považována za mistrovské dílo gruzínské národní literatury."
 historical_character.grigor_tatevatsi: "Grigor Tatevaci byl arménský filozof, teolog a učenec 14. století, proslulý jako učitel a představený školy při klášteře Tatev ve středověké Arménii."
 historical_character.sargis_pitsak: "Sargis Picak byl arménský iluminátor rukopisů a písař 14. století, proslulý svým přínosem k umění středověké arménské knižní tvorby."
 historical_character.medici: "Averardo de' Medici, známý také jako Bicci, byl jedním z raných předků proslulého rodu Medicejských, který se během renesance povznesl mezi nejvýznamnější florentské rodiny. Averardo významně přispěl k vybudování rodinného bohatství a postavení ve florentských politických a společenských kruzích."
 historical_character.borgia: "Alfons de Borja, známý také jako Alfonso Borgia, byl španělský kardinál a diplomat, který se roku 1455 stal papežem Kalixtem III. Před nástupem na papežský stolec působil jako uznávaný právník a správce a sehrál významnou úlohu při usmiřování stran sporu, který vyústil v kompromis v Caspe."
 historical_character.william_wallace: "William Wallace byl skotský rytíř a jeden z předních vůdců válek za skotskou nezávislost proti Anglii na konci 13. století. Proslul odvážnou taktikou a neochvějným vlastenectvím, roku 1297 porazil anglické vojsko v bitvě u Stirling Bridge a následně byl jmenován strážcem Skotska."
 historical_character.la_hire: "Étienne de Vignolles, proslulý jako La Hire, byl významný vojevůdce závěrečných fází stoleté války. La Hire, známý svou statečností a udatností v boji, patřil k hlavním velitelům bojujícím po boku Johanky z Arku."
 historical_character.bar_sauma: "Rabban Bar Sauma byl nestoriánský mnich původem z Číny dynastie Jüan, který se později stal diplomatem. Původně se vydal na pouť do Jeruzaléma, kam však nedorazil, a místo toho strávil řadu let v Bagdádu. Později působil jako mongolský vyslanec v Evropě, kde se setkal s evropskými panovníky, byzantským císařem i papežem a jednal o možné francouzsko-mongolské alianci."
 historical_character.hodja: "Nasreddin Hodža je lidový hrdina a ikonická literární postava tureckých kultur, často zobrazovaná jako moudrý a duchaplný stařec, který udílí záhadné rady nebo se dostává do nesnází, z nichž nakonec vyvázne díky svému bystrému důvtipu a humoru."
 historical_character.widukind_of_corvey: "Widukind z Corvey byl saský mnich a historik 10. století, proslulý dílem „Res gestae Saxonicae“, kronikou zachycující skutky Sasů se zvláštním důrazem na vládu císaře Oty I."
 historical_character.roger_de_flor: "Roger de Flor byl významný žoldnéřský velitel a dobrodruh přelomu 13. a 14. století. Původně byl templářským rytířem, později se však stal vůdcem almogávarů a vytvořil Katalánskou kompanie. Bojoval ve službách Andronika II. a Michaela IX., přičemž druhý z nich jej kvůli jeho rostoucímu vlivu v Byzantské říši nechal zavraždit."
 historical_character.regino_of_prum: "Regino z Prümu byl významný benediktinský mnich, historik a hudební teoretik 9. století. Působil jako opat prümského kláštera až do svého vyhnání roku 899, poté se uchýlil do kláštera svatého Martina v Trevíru. Nejvíce se proslavil svou kronikou „Chronicon“."
 historical_character.geoffrey_of_monmouth: "Geoffrey z Monmouthu byl velšský duchovní 12. století a jedna z nejvýznamnějších osobností ve vývoji britské historiografie a artušovské literatury. Jeho zásadní dílo „Historia Regum Britanniae“ („Dějiny britských králů“) je pseudohistorickým vyprávěním zachycujícím osudy britských králů."
 historical_character.raiktor: "Roku 1081, uprostřed nepokojů následujících po nástupu Alexia I. Komnena k moci, se mnich Raiktor falešně vydával za sesazeného císaře Michaela VII. Normanský vévoda Robert Guiscard této příležitosti využil a Raiktorovým nárokem ospravedlňoval svou invazi na Balkán. Přestože byl podvod odhalen, Guiscard ve svém tažení pokračoval a před Dyrrhachiem Raiktora předváděl, aby získal podporu. Když lest nakonec selhala, Guiscard Raiktora opustil a ten byl pravděpodobně v tichosti odstraněn, jakmile přestal být užitečný."
 historical_character.nichiren: "Radikální a neústupný reformátor japonského buddhismu $Nichiren$ prohlásil oddanost Lotosové sútře za jedinou cestu ke spáse. Ostře kritizoval soupeřící školy i politickou netečnost a kvůli svému učení čelil vyhnanství i pokusům o zavraždění. Jeho odkaz vedl ke vzniku svébytné, nacionalisticky zaměřené školy buddhismu, která přetrvává dodnes."
 historical_character.dogen: "Dógen, zakladatel školy Sótó japonského zenového buddhismu, je uctíván pro své učení o meditaci a své stěžejní dílo „Šóbógenzó“, které zásadně ovlivnilo filozofii japonského zenu."
 historical_character.kokan_shiren: "Kokan Širen byl zenový mnich školy rinzai, básník a historik období Kamakura. Sestavil „Zenrin Kokuhóki“, významný text o dějinách buddhismu, a básnické sbírky, v nichž spojoval zenový vhled s literární elegancí."
 historical_character.jeong_mong_ju: "Čong Mong-džu byl státník, učenec a básník pozdního období Korjo, uctívaný pro svou neochvějnou věrnost dynastii v jejích posledních dnech. Jako mistr neokonfuciánského myšlení a diplomacie se postavil proti vzestupu režimu Čoson a za své zásady byl zavražděn. Jeho poslední báseň, vyjadřující neochvějnou věrnost, dodnes patří k nejslavnějším korejským veršům."
 historical_character.yi_saek: "I Säk byl klíčový konfuciánský učenec pozdního období Korjo, který do Koreje uvedl neokonfucianismus Ču Siho a vychoval generaci budoucích reformátorů dynastie Čoson. Přestože podporoval reformu vzdělávání, zůstal věrný dynastii Korjo a odmítl úřad ve službách jejích nástupců. Svým vlivem překlenul dvě dynastie a po staletí formoval korejské myšlení."
 historical_character.jinul: "Vizionářský buddhistický mnich Činul z období Korjo usiloval o reformu korejského buddhismu spojením meditační praxe s naukovým studiem. Při klášteře Songgwangsa založil společenství, z něhož vzešla tradice řádu Čogje, a zdůrazňoval osobní probuzení v rámci mnišské kázně. Jeho učení položilo základy korejského sonu v podobě, v jaké se praktikuje dodnes, a spojilo zenový vhled s hlubokou učeností."
 historical_character.prapanca: "Mpu Prapanca byl dvorní básník a historiograf na jávském dvoře říše Madžapahit a autor epické básně „Nagarakretagama“ (1365), která podrobně zachycuje slávu a geografii Madžapahitu. Jeho dílo patří ke klíčovým pramenům o jávských dějinách a státnictví."
 historical_character.tantular: "Proslulý jávský básník Mpu Tantular sepsal „Kakawin Sutasoma“, v němž se poprvé objevilo rčení „Bhinneka Tunggal Ika“ („Jednota v rozmanitosti“), později přijaté za národní motto Indonésie."
 historical_character.kanwa: "Mpu Kanwa, dvorní básník za vlády krále Airlanggy, složil „Kakawin Arjunawiwaha“, epickou báseň spojující hinduistickou mytologii s jávskými ideály."
 historical_character.sedah: "Mpu Sedah začal na objednávku krále Jayabhayi skládat „Kakawin Bhāratayuddha“, adaptaci Mahábháraty, kterou později dokončil Mpu Panuluh."
 historical_character.panuluh: "Mpu Panuluh dokončil „Kakawin Bhāratayuddha“ a sepsal „Kakawin Hariwangsa“, čímž významně přispěl k jávské literární tradici."
 historical_character.dharmaja: "Mpu Dharmaja byl básník působící za vlády krále Airlanggy, známý jako autor „Kakawin Smaradahana“, básně, která ovlivnila pozdější jávskou literaturu."
 historical_character.monaguna: "Mpu Monaguna je považován za autora „Kakawin Sumanasantaka“, básnického díla odrážejícího propojení hinduistických příběhů s jávskou kulturou."
 historical_character.kuturan: "Mpu Kuturan je uctívanou osobností balijských dějin, které je připisováno sjednocení různých hinduistických směrů na Bali a zavedení systému Desa Adat, jenž propojuje náboženské a zvykové právo."
 historical_character.dwijendra: "Mpu Dwijendra byl duchovní vůdce, který sehrál významnou úlohu při šíření hinduismu na Lomboku a Bali. Proslul svým učením a zakládáním chrámů napříč oběma ostrovy."
 historical_character.kavindrarimathana: "Kavindrarimathana byl významný architekt a stavitel za vlády krále Rádžéndravarmana II. Je mu připisován návrh významných chrámů, včetně Pre Rup a Východního Mebonu, které dokládají architektonické mistrovství Khmerské říše."
 historical_character.daun_penh: "Daun Penh byla uctívaná vdova ze 14. století, která podle tradice během záplav na Tonlé Sap nalezla v plovoucím stromě koki posvátné sochy Buddhy. Vyložila si to jako božské znamení a na pahorku založila svatyni Wat Phnom, do níž posvátné předměty uložila. Z jejího zbožného činu vzešlo město Phnompenh, které dodnes nese její jméno."
 historical_character.yue_fei: "Jüe Fej, jeden z nejslavnějších čínských vojevůdců, se z prostých poměrů vypracoval v neochvějného obránce Jižní Sung proti vpádu džürčenské říše Ťin. Bezvýhradně věrný císaři a ideálu jednoty říše byl zrazen zkorumpovanými úředníky a nespravedlivě popraven. Jeho odkaz dodnes představuje symbol vlastenectví a čestnosti."
 historical_character.wen_tianxiang: "Wen Tchien-siang, uctívaný učenec a vojevůdce závěru Jižní Sung, se stal symbolem odporu proti mongolskému dobytí. Po zajetí při neúspěšné obraně dynastie odmítl vstoupit do služeb Jüanů a zemřel jako mučedník. Jeho básně složené ve vězení, zejména „Píseň spravedlnosti“, upevnily jeho odkaz jako vzoru ctnosti a věrnosti."
 historical_character.fan_zhongyan: "Fan Čung-jen byl státník, kancléř a neokonfuciánský učenec Severní Sung, známý svým slavným výrokem „Jako první se strachovat a jako poslední se radovat“. Prosazoval zásadní reformy zaměřené na zlepšení správy říše a péče o společnost."
 historical_character.li_qingzhao: "Li Čching-čao byla jednou z největších čínských básnířek, proslulá lyrickou poezií ci z doby dynastie Sung, v níž působivě zachycovala osobní ztráty i krásu nenávratně zmizelé doby."
 historical_character.qiu_chuji: "Čchiou Čchu-ťi byl uctívaný taoistický mistr, jeden ze Sedmi pravých Severu, a rádce Čingischána. Z jižní Číny se vydal až do Střední Asie, aby chánovi radil ve věcech vlády a dlouhověkosti, a přispěl tak k formování rané jüanské náboženské politiky."
 historical_character.chu_van_an: "Chu Van An byl vážený konfuciánský učitel dynastie Tran a představený Císařské akademie v Thang Longu. Proslul svou bezúhonností, reformami vzdělávání a známou peticí „Sedmi stětí“, v níž žádal krále o odstranění zkorumpovaných úředníků."
 historical_character.nguyen_thuyen: "Nguyen Thuyen byl básník a úředník 13. století, kterému se připisuje průkopnické používání písma Nôm, tedy lidového vietnamského písemnictví, v literatuře. Je připomínán také díky veršům, které podle legendy zahnaly krokodýly a staly se symbolem síly vietnamského jazyka a vzdělanosti."
 historical_character.pham_ngu_lao: "Pham Ngu Lao byl proslulý vojevůdce dynastie Tran, který ve 13. století pomohl odrazit několik mongolských vpádů. Narodil se jako prostý venkovan, ale díky své statečnosti dosáhl vysokého postavení a stal se symbolem vlastenectví. Je také námětem slavné básně vyzdvihující jeho oddanost."
 historical_character.sakata_kintoki: "Mocný válečník z hor Sagami, $dynn_Satake$ $Kin_toki$, prý sloužil $dynn_Minamoto$ $Yorimitsu$ s mimořádnou silou a věrností. K jeho legendárním činům pod jménem „Kintaró“ patří zápasy s medvědy, vytrhávání stromů i divoké útoky v bitvách."
 historical_character.takezaki_suenaga: "Neochvějně věrný samuraj kamakurského šógunátu $dynn_Takezaki$ $Suenaga$ se proslavil svou statečností během mongolských vpádů do Japonska. Odhodlán získat za svou službu náležité uznání nechal vytvořit ilustrované svitky zachycující své činy."
 historical_character.eisai: "$Eisai$ se narodil do rodiny spjaté se šintoistickou svatyní a stal se mnichem, nebyl však spokojen s převládajícími buddhistickými školami Pundarika a Tendai, a proto odcestoval do Číny studovat učení dhjány neboli čchanu. Po návratu tyto myšlenky uvedl do Japonska, založil zenovou školu Rinzai, zřídil její první chrám a znovu zpopularizoval zelený čaj."
 historical_character.ippen: "$Ippen$ od mládí studoval posvátné texty, než se vrátil ke světskému životu. Během pouti do Kumano mu kami zjevil cestu k osvícení: extatické odříkávání [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]. Božsky inspirovaný $Ippen$ znovu oblékl mnišské roucho a jako oddaný mnich a učitel Čisté země putoval Japonskem se skupinou horlivých následovníků a založil školu Dži šú."
 historical_character.myoe: "$MyO_e$ v dětství osiřel a studoval učení mnoha různých škol; mezi jeho učitele patřili $Mongaku$ a $Eisai$, žádná z nich jej však neuspokojila. Ve snaze uniknout klášterním sporům se uchýlil do ústraní a vrátil se k někdejšímu oblíbenému učení Kegon, které oživil prvky myšlení škol Šingon a Tendai, přičemž odmítal zaujetí [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]."
 historical_character.honen: "$HO_nen$ byl po zavraždění svého otce již jako dítě vysvěcen na mnicha a úspěšně postupoval hierarchií školy Tendai. Znepokojen pohodlím, v němž mniši žili v ostrém protikladu k bídě prostého lidu, rozpoznal $HO_nen$ v [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] nauku přístupnou všem a stal se předním učitelem Čisté země. Jeho radikální myšlenky vyvolaly hněv ostatních škol a během pronásledování v éře Džógen vedly k jeho vyhnanství."
 historical_character.shinran: "$Shinran$ v dětství osiřel a již v mladém věku byl vysvěcen na mnicha, v mnišském životě však obtížně hledal svou cestu. Vidění jej přivedlo k mnichovi $HO_nen$, jehož se stal předním žákem a s nímž během pronásledování v éře Džógen sdílel vyhnanství. Nadále horlivě hlásal lidu učení Čisté země založené na [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] a nakonec založil vlastní školu Džódó šinšú neboli Pravou školu Čisté země, která je dnes nejrozšířenější buddhistickou školou v Japonsku."
 historical_character.mibu_tadamine: "Navzdory prostému původu získal $Tadamine$ velkou proslulost svou poezií waka poté, co vystoupil v básnické soutěži, a následně obdržel císařské pověření i podporu rodu Fudžiwarů. Spolu se svým synem $Tadami$ je řazen mezi Třicet šest nesmrtelných básníků Japonska a má se za to, že do císařských básnických antologií bylo zařazeno více než osmdesát jedna jeho básní."
 historical_character.murasaki: "Paní Murasaki, pravnučka proslulého básníka Fudžiwary Kanesukeho, se narodila do vzdělaného rodu Jošikado a sloužila jako dvorní dáma císařovně Fudžiwaře Šóši, manželce císaře Ičidžóa. Její básnický talent byl brzy rozpoznán a byla zařazena mezi Třicet šest nesmrtelných básnířek. Dnes je známá především svým deníkem, soupeřením s básnířkou #EMP Sei Šónagon#! a dílem #EMP Příběh prince Gendžiho#!, které bývá považováno za jeden z nejstarších románů vůbec."
