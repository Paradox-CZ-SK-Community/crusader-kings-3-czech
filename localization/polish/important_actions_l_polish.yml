 action_vassal_ransom_gives_hook_HELP: "\n\n#help Získání Hooku na vazalovi může být prospěšné, zejména pokud chcete zvýšit jejich [Concept('obligations','povinnosti')|E] vůči vám změnou jejich [Concept('vassal_contract','vazalská smlouva')|E] — což v tomto případě můžete!#!" # todo: CONCEPT CASE
