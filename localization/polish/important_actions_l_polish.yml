 action_send_child_to_university_desc: "Můžeš poslat své dítě na univerzitu\n\n#help Ve tvém [Concept('realm','panství')|E] se nachází [Concept('building','budova')|E] [Concept('holy_site','svatého místa')|E], například [GetBuilding('holy_site_cathedral_01').GetName], [Concept('building','budova')|E] [GetBuilding('generic_university').GetName] nebo [Concept('realm_capital','hlavní sídlo panství')|E] [GetTitleByKey('h_china').GetName]! Poslat tam dítě za vzděláním je prospěšné, protože až dosáhne [Concept('adult','dospělého věku')|E], zlepší se jeho [Concept('education_trait','rys vzdělání')|E].\n\nMožná však již máš na mysli konkrétního [Concept('guardian','poručníka')|E].#!"
