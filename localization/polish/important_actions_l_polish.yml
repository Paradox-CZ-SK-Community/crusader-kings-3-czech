 action_can_vassalize_desc: "Sousední [Concept('ruler','vládce')|E] [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUIName] si přeje tvou ochranu a přijal by [Concept('vassalization','vazalizaci')|E].$action_can_vassalize_HELP$"
