 TLFR_FOREIGN_RULER_SUCCESSION_TIPS: "#help Pokud vazal získá v cizím panství titul s vyšší [Concept('title_rank','hodností')|E], než má jeho současný [Concept('primary_title','hlavní titul')|E], přestane být tvým vazalem.\n\nOdchodu zemí tvého vazala z tvého panství můžeš zabránit následujícími způsoby:\n$BULLET_WITH_TAB$[Concept( 'revoke', 'Odebráním' )|E] titulů svému vazalovi\n$BULLET_WITH_TAB$Udělením titulu o stejné [Concept('title_tier', 'úrovni')|E], jakou má titul, který zdědí#!"
