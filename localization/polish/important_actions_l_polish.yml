 action_primary_heir_wrong_dynasty_no_replacement_exists_desc: "$action_primary_heir_wrong_dynasty_but_replacement_exists_label$\n\n#help Tvůj [Concept('primary_title','hlavní titul')|E] má zdědit někdo mimo tvou dynastii. To znamená, že po své smrti přijdeš o značnou část území. Členové tvé dynastie však stále mohou dědit, pokud změníš současnou [Concept('line_of_succession','linii následnictví')|E] úpravou [Concept('succession_laws','zákonů nástupnictví')|E] nebo třeba vraždou...#!"
