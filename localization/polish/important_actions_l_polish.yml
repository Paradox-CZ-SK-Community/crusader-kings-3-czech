 action_can_raze_holding_click: "#I Klikněte pro výběr titulu#!"
 action_can_raze_holding_HELP: "\n\n#help Pokud neplánujete usednout pomocí $step_away_from_the_steppe_decision$ nebo $settle_people_decision$ [Concept('decisions','rozhodnutí')|E], zvažte zničení [Concept('holdings','državy')|E], aby se z nich stala [Concept('nomadic_holdings','kočovná sídliště')|E].\n\n[Concept('nomadic_holdings','Kočovná sídliště')|E] zlepšují [Concept('fertility_equilibrium','rovnováha úrodnosti')|E] a činí tato území méně atraktivními pro usedlé vládce, aby je dobyli.\n\nPro zničení držby klikněte na kulaté tlačítko v levém dolním rohu pohledu na držbu.#!" # todo: CONCEPT CASE
