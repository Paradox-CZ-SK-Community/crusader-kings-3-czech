 action_in_debt: "Ve dluhu"
 action_in_debt_label: "@debt_icon! Jste ve dluhu"
 action_in_debt_desc: "Máte méně než [Concept('gold_i','@gold_icon!')|E]#V 0#! [Concept('gold','zlato')|E] a proto jste v [Concept('debt','dluhu')|E]!\n\nBýt ve dluzích má následující efekty:\n$BULLET_WITH_TAB$Nemůžete vyhlásit [Concept('war','válka')|E]\n$BULLET_WITH_TAB$Nemůžete posílit [Concept('men_at_arms','ozbrojenci')|E], které vyžadují [Concept('gold_i','@gold_icon!')|E][Concept('gold','zlato')|E]\n$BULLET_WITH_TAB$[Concept('county_corruption','Korupce v hrabství')|E] se šíří ve vašem [Concept('domain','doméně')|E]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] mají větší pravděpodobnost připojit se k [Concept('factions','frakcím')|E]\n\nČím více jste ve dluhu, tím tvrdší budou postihy. Vaše současná úroveň dluhu má následující další efekty:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Pokud každý měsíc nevyděláváte zlato, zvažte snížení výdajů, například:\n$BULLET_WITH_TAB$Rozpuštěním vašich [Concept('armies','armád')|E]\n$BULLET_WITH_TAB$Zmenšením velikosti — nebo zničením — vašich [Concept('men_at_arms','ozbrojenců')|E]\n$BULLET_WITH_TAB$Zvýšením [Concept('control','kontrolou')|E] pomocí vašeho [Concept('marshal','maršála')|E]\n$BULLET_WITH_TAB$Odebráním [Concept('court_positions','dvorských úřadů')|E]#!" # todo: CONCEPT CASE
