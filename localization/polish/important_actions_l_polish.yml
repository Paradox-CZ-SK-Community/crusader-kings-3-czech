 action_primary_heir_wrong_dynasty_but_replacement_exists_label: "Tvůj [Concept('primary_heir','hlavní dědic')|E] nepatří k tvé [Concept('dynasty','dynastii')|E]!"
 action_primary_heir_wrong_dynasty_but_replacement_exists_desc: "Tvůj [Concept('primary_heir','hlavní dědic')|E] nepatří k tvé [Concept('dynasty','dynastii')|E]!\n\n#help Tvůj [Concept('primary_title','hlavní titul')|E] má zdědit někdo mimo tvou dynastii. To znamená, že po své smrti přijdeš o značnou část území. Dále v [Concept('line_of_succession','linii následnictví')|E] se nacházejí členové tvé [Concept('dynasty','dynastie')|E]. Zajisti, aby dědil jeden z nich, ať už změnou [Concept('succession_laws','zákonů nástupnictví')|E], nebo třeba vraždou...#!"
