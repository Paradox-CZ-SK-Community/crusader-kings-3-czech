 action_can_use_hook_to_change_contract_desc: "Jelikož máte [Concept('hook','páka')|E] na svém [GetGovernment( 'feudal_government' ).GetName] [Concept('vassal','vazalovi')|E] [recipient.GetUIName], můžete jej utratit k úpravě jejich [Concept('vassal_contract','vazalská smlouva')|E].\n\n#help Zvýšení [Concept('vassals_possessive','vazalů')|E] [Concept('obligations','povinnosti')|E] vůči vám je jedním z nejefektivnějších použití [hook].\n\nNormálně by navržení nespravedlivé změny [Concept('vassal_contract','vazalská smlouva')|E] vedlo k [Concept('tyranny','tyranii')|E] – ale tomu se vyhnete utracením [Concept('hook','pákou')|E]. Můžete navrhnout pouze jednu nespravedlivou změnu; při více návrzích stále získáte [Concept('tyranny','tyranie')|E].\n\nNezapomeňte při úpravě [Concept('vassal_contract','vazalské smlouvě')|E] #high zaškrtnout políčko 'Použít háček'#!#!" # todo: CONCEPT CASE
