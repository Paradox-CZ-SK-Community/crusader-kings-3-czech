 action_in_debt_desc: "Máš méně než [gold_i|E]#V 0#! [Concept('gold','zlata')|E], a proto máš [Concept('debt','dluh')|E]!\n\nDluh má tyto důsledky:\n$BULLET_WITH_TAB$Nelze vyhlásit [Concept('war','válku')|E]\n$BULLET_WITH_TAB$Nelze doplňovat [Concept('men_at_arms','ozbrojence')|E] vyžadující [gold_i|E][Concept('gold','zlato')|E]\n$BULLET_WITH_TAB$V tvé [Concept('domain','doméně')|E] se šíří [Concept('county_corruption','korupce v hrabství')|E]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] se častěji přidávají k [Concept('factions','frakcím')|E]\n\nČím vyšší máš dluh, tím tvrdší postihy tě čekají. Tvá současná úroveň dluhu má tyto další důsledky:\n\n[GetPlayer.GetDebtModifierDescription]\n\n#help Pokud každý měsíc nezískáváš zlato, zvaž snížení výdajů, například:\n$BULLET_WITH_TAB$Rozpuštěním svých [Concept('armies','armád')|E]\n$BULLET_WITH_TAB$Snížením počtu nebo rozpuštěním svých [Concept('men_at_arms','ozbrojenců')|E]\n$BULLET_WITH_TAB$Zvýšením [Concept('control','kontroly')|E] pomocí svého [Concept('marshal','maršála')|E]\n$BULLET_WITH_TAB$Odebráním [Concept('court_positions','dvorských úřadů')|E]#!"
 action_in_debt_click: ""
 action_in_treasury_debt: "$action_in_debt$"
 action_in_treasury_debt_label: "$action_in_debt_label$"
 action_in_treasury_debt_desc: "Stav tvé [Concept('treasury','pokladnice')|E] je nižší než [treasury_i|E]#V 0#!, a proto máš [Concept('treasury_debt','dluh pokladnice')|E]!\n\nDluh má tyto důsledky:\n$BULLET_WITH_TAB$Nelze vyhlásit [Concept('war','válku')|E]\n$BULLET_WITH_TAB$Nelze doplňovat [Concept('men_at_arms','ozbrojence')|E], jejichž doplňování se hradí z [treasury_i|E][Concept('treasury','pokladnice')|E]\n$BULLET_WITH_TAB$V tvé [Concept('domain','doméně')|E] se šíří [Concept('county_corruption','korupce v hrabství')|E]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] se častěji přidávají k [Concept('factions','frakcím')|E]\n\nČím vyšší máš dluh, tím tvrdší postihy tě čekají. Tvá současná úroveň dluhu má tyto další důsledky:\n\n[GetPlayer.GetTreasuryDebtModifierDescription]\n\n#help Pokud se tvá pokladnice každý měsíc nerozrůstá, zvaž snížení výdajů, například:\n$BULLET_WITH_TAB$Rozpuštěním svých [Concept('armies','armád')|E]\n$BULLET_WITH_TAB$Snížením počtu nebo rozpuštěním svých [Concept('men_at_arms','ozbrojenců')|E]\n$BULLET_WITH_TAB$Zvýšením [Concept('control','kontroly')|E] pomocí svého [Concept('marshal','maršála')|E]\n$BULLET_WITH_TAB$Odebráním [Concept('court_positions','dvorských úřadů')|E]#!"
