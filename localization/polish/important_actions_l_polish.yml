 action_powerful_vassal_not_on_council_HELP: "\n\n#help Měli byste zvážit udělení místa v radě mocným vazalům. Jinak se jejich [Concept('opinion','mínění')|E] sníží a mohou se přidat k [Concept('faction','frakcím')|E] proti vám.\n\nNicméně ne každý má dostatečné [Concept('skills','dovedností')|E], aby byl užitečný, a pokud je vaše [Concept('rank','hodnost')|E] dostatečně vysoké, může být prostě víc mocných vazalů, než je v radě míst.#!" # todo: CONCEPT CASE
