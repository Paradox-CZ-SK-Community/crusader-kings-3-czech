 action_can_propose_alliance_to_family_member_combined_group_name: "$action_can_propose_alliance_to_family_member_combined_group_label$"
 action_can_propose_alliance_to_family_member_desc: "Můžete vyjednat [Concept('alliance','aliance')|E] se svým [actor.Custom2('RelationToMe', recipient)] [recipient.GetUIName], protože již sdílíte krevní pouta.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nPozor! Některé [Concept('alliances','aliance')|E] jsou více starostí než užitku...\n\nUjistěte se, že tuto [Concept('alliance','alianci')|E] skutečně chcete, protože byste mohli být zataženi do jejich zbytečných konfliktů.#!" # todo: CONCEPT CASE
 action_can_propose_alliance_to_family_member_combined_group_description: "Můžete vyjednat [Concept('alliances','aliance')|E] s některými členy vaší [Concept('family','rodinu')|E] nebo s těmi, se kterými jsou sňatkem, aniž byste museli zprostředkovat nový [Concept('marriage','sňatek')|E], protože již sdílíte krevní pouta.#help \n\nPozor! Některé [Concept('alliances','aliance')|E] jsou více starostí než užitku...\n\nUjistěte se, že tuto [Concept('alliance','alianci')|E] skutečně chcete, protože byste mohli být zataženi do jejich zbytečných konfliktů.#!" # todo: CONCEPT CASE
 action_can_propose_alliance_to_family_member_label: "@alliance_icon! Můžete vyjednat alianci se svým [actor.Custom2('RelationToMe', recipient)] [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
