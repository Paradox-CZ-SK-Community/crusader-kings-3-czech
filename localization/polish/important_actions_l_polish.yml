 action_too_many_held_duchies_combined_group_description: "Držíte více než dvě [Concept('duchies','vévodství')|E] jako [Concept('king','král')|E] nebo [Concept('emperor','císař')|E], což snižuje [Concept('opinion','mínění')|E] vašich [Concept('vassals','vazalů')|E] o vás.\n\n#help Čím více $game_concept_duchies$ držíte nad prvními dvěma, tím žárlivější budou vaši vazalové. I když jejich stížnosti můžete ignorovat, zvažte udělení některých svých vévodství [Concept('titles','tituly')|E].\n\nMěli byste držet $game_concept_duchies$ tam, kde držíte mnoho hrabství, zejména vaše [Concept('realm_capital','hlavní sídlo panství')|E].#!" # todo: CONCEPT CASE
