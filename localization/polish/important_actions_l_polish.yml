 action_dying_desc: "Stojíš na prahu smrti.\n\n#help Pokud máš [Concept('player_heir','hráčského dědice')|E], budeš po své smrti pokračovat ve hře za tuto postavu. Tví [Concept('vassals','vazalové')|E] jí však nemusí být tak věrní. Proto si raději ponech dostatek [Concept('gold','zlata')|E] na [Concept('mercenaries','žoldnéře')|E] nebo [Concept( 'gift', 'dary' )|E].#!"
