 action_too_many_held_duchies_label: "$action_too_many_held_duchies_combined_group_label$"
 action_too_many_held_duchies_combined_group_name: "$action_too_many_held_duchies_combined_group_label$"
 action_too_many_held_duchies_combined_group_description: "Jako [Concept('king','král')|E] nebo [Concept('emperor','císař')|E] držíš více než dvě [Concept('duchies','vévodství')|E], což zhoršuje [Concept('opinion','mínění')|E], které o tobě mají tví [Concept('vassals','vazalové')|E].\n\n#help Čím více dalších $game_concept_duchies$ nad první dvě držíš, tím závistivější budou tví vazalové. Jejich stížnosti můžeš ignorovat, ale zvaž udělení některých ze svých [Concept('titles','titulů')|E] typu $game_concept_duchy$ jiným osobám.\n\nPonech si především $game_concept_duchies$, v nichž držíš mnoho $game_concept_counties$, zejména to, v němž se nachází tvé [Concept('realm_capital','hlavní sídlo panství')|E].#!"
 action_too_many_held_duchies: "$action_too_many_held_duchies_combined_group_label$"
