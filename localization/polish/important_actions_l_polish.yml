 action_upgrade_tribal_holding_type_HELP: "\n\n#help $game_concept_holdings$ s označením „$game_concept_tribal$“ jsou velmi užitečné pro [Concept('rulers','vládce')|E] s [Concept('government','vládou')|E] typu „$game_concept_tribal$“, nikdo jiný je však nedokáže řádně spravovat. Investuješ-li [Concept('gold','zlato')|E] do reformy místních kmenů, můžeš [Concept('holding_type','typ državy')|E] natrvalo změnit na državu typu „$game_concept_castle$“, kterou může spravovat kdokoli!#!"
