 action_wrong_holding_type_combined_group_name: "@domain_icon! Državy nesprávného typu"
 action_wrong_holding_type_combined_group_description: "Některé državy mají [Concept('holding_type','typ državy')|E] nevhodný pro tvou formu [Concept('government','vlády')|E], a poskytují ti proto jen minimum [Concept('taxes','daní')|E] a [Concept('levies','odvedenců')|E].$action_wrong_holding_type_HELP$"
 action_wrong_holding_type_label: "@domain_icon! Titul [landed_title.GetNameNoTooltip] #low ([landed_title.GetProvince.GetHolding.GetType.GetName])#! bys měl někomu udělit"
 action_wrong_holding_type_desc: "Država [landed_title.GetName] má [Concept('holding_type','typ državy')|E] nevhodný pro tvou formu [Concept('government','vlády')|E], a poskytuje ti proto jen minimum [Concept('taxes','daní')|E] a [Concept('levies','odvedenců')|E].$action_wrong_holding_type_HELP$"
 action_wrong_holding_type_click: "#I Kliknutím vybereš titul#!"
 action_wrong_holding_type_HELP: "\n\n#help Každý vládce má určitý typ vlády, který určuje, jaké typy [Concept('holdings','držav')|E] dokáže řádně spravovat. Feudální vládci například mohou řádně spravovat pouze [Concept('castles','hrady')|E]. Država nesprávného typu je prakticky bezcenná a pouze se započítává do tvého [Concept('domain_limit','limitu domény')|E].\n\nTakové državy bys měl udělit některému [Concept('unlanded','bezzemkovi')|E] ze svého [Concept('court','dvora')|E], který se poté stane tvým [Concept('vassal','vazalem')|E].#!"
