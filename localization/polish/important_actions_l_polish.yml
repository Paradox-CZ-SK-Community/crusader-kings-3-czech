 action_dying_desc: "Jste na pokraji smrti.\n\n#help Pokud máte [Concept('player_heir','hráčský dědic')|E], budete pokračovat ve hře jako oni. Vaši [Concept('vassals','vazaly')|E] jim nemusí být tak loajální. Proto je dobré neutrácet příliš mnoho [Concept('gold','zlata')|E], abyste si mohli dovolit [Concept('mercenaries','žoldnéři')|E] nebo [Concept( 'gift', 'gifts' )|E].#!" # todo: CONCEPT CASE
