 action_not_rightful_liege_desc: "Nejste [Concept('rightful_liege','právoplatný lenní pán')|E] pro svého [actor.Custom2('RelationToMe', recipient)] [recipient.GetShortUIName].\n\nZkontrolujte, zda můžete [Concept('create','vytvořit')|E] nebo [Concept('usurp','uzurpovat')|E] titul, který by vás učinil [recipient.GetHerHis] [Concept('de_jure','de iure')|E] [Concept('liege','lenní pán')|E]; tím by se zlepšil [recipient.GetHerHis] [Concept('opinion','mínění')|E] o vás a zvýšily by se [Concept('taxes','daněmi')|E] a [Concept('levies','odvedenci')|E], které od [recipient.GetHerHim] dostáváte.\n\nPokud to není možné, můžete zvážit [Concept('transferring','převádění')|E] je jinému z vašich vazalů, zejména pokud by tento vazal byl jejich [Concept('rightful_liege','právoplatný lenní pán')|E]." # todo: CONCEPT CASE
 action_not_rightful_liege_combined_group_description: "Nejste [Concept('rightful_liege','právoplatný lenní pán')|E] několika vašich vazalů.\n\nZkontrolujte, zda můžete [Concept('create','vytvořit')|E] nebo [Concept('usurp','uzurpovat')|E] tituly, které z vás udělají jejich [Concept('de_jure','de iure')|E] [Concept('liege','lenní pán')|E]; tím se zlepší jejich [Concept('opinion','mínění')|E] o vás a zvýší se [Concept('taxes','daněmi')|E] a [Concept('levies','odvedenci')|E], které od nich dostáváte.\n\nPokud to není možné, můžete zvážit [Concept('transferring','převádění')|E] je jinému z vašich vazalů, zejména pokud by tento vazal byl jejich [Concept('rightful_liege','právoplatný lenní pán')|E]." # todo: CONCEPT CASE
