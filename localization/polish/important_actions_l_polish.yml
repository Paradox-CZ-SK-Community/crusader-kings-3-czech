 action_can_usurp_title_unimportant: "@warning_icon! #X Nemáš dostatek [Concept('gold','zlata')|E] k uzurpování titulu#!"
 action_can_usurp_title_HELP: "\n\n#help Pokojná uzurpace titulu může stát [Concept('gold','zlato')|E], přináší však tyto výhody: $CREATE_USURP_TITLE_PROS_CONS$#!"
 CREATE_USURP_TITLE_PROS_CONS: "\n$BULLET_WITH_TAB$Můžeš zvýšit svou [Concept('rank','hodnost')|E]\n$BULLET_WITH_TAB$Získáš [Concept('de_jure','de iure')|E] [Concept('casus_bellis','casus belli')|E]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] tě nyní mohou považovat za svého [Concept('rightful_liege','právoplatného lenního pána')|E]\n$BULLET_WITH_TAB$Získáš [Concept('prestige','prestiž')|E]\n\nMá to však i nevýhody:\n$BULLET_WITH_TAB$Tví vazalové mohou po titulu toužit\n$BULLET_WITH_TAB$Pokud má tvé [Concept('realm','panství')|E] [Concept('succession_law','zákon nástupnictví')|E] s několika [Concept('realm_heirs','dědici panství')|E], ovlivní to, kdo zdědí které tituly."
 action_above_domain_limit: "@domain_icon! Překročen [Concept('domain_limit','limit domény')|E]"
 action_above_domain_limit_label: "@domain_icon! Překročen [Concept('domain_limit','limit domény')|E]"
 action_above_domain_limit_desc: "Máš o [actor.GetDomainLimitOverrunWithoutGracePeriod|V] [Concept('holdings','držav')|E] více, než dovoluje tvůj [Concept('domain','limit domény')|E] [actor.GetDomainLimit|V], což sníží tvé [Concept('taxes','daňové příjmy')|E] a počet [Concept('levies','odvedenců')|E].\n\n#help Jako [Concept('ruler','vládce')|E] můžeš osobně držet jen omezený počet držav. Ostatní državy ve tvém [Concept('realm','panství')|E] by měli držet tví [Concept('vassals','vazalové')|E].\n\nUděl proto některé ze svých [Concept('titles','titulů')|E] s državami jiným osobám. [Concept('courtiers','Dvořané')|E] a [Concept('guests','hosté')|E] jsou vhodnou volbou, protože budou slabí. Tituly můžeš udělit i stávajícím vazalům, ti však zesílí a v budoucnu by mohli představovat hrozbu!#!"
 action_above_domain_limit_click: "#I Kliknutím zobrazíš své tituly#!"
 action_above_vassal_limit: "Překročen [Concept('vassal_limit','limit vazalů')|E]"
 action_above_vassal_limit_label: "Překročen [Concept('vassal_limit','limit vazalů')|E]"
 action_above_vassal_limit_desc: "Máš o [actor.GetVassalLimitOverrun|V] [Concept('direct_vassals','přímých vazalů')|E] více, než dovoluje tvůj limit vazalů [actor.GetVassalLimit|V], což sníží [Concept('taxes','daňové příjmy')|E] a počet [Concept('levies','odvedenců')|E] získávaných od tvých [Concept('vassals','vazalů')|E].\n#help Každý [Concept('ruler','vládce')|E] může ovládat jen určitý počet přímých vazalů. Namísto toho, aby ti podléhali přímo, by je měl spravovat některý z tvých ostatních vazalů. Předej proto některého ze svých vazalů jinému vazalovi.#!"
 action_above_vassal_limit_click: "#I Kliknutím zobrazíš své vazaly#!"
