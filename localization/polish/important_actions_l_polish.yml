 action_empty_council_position_desc: "Jedno z míst ve tvé [Concept('council','radě')|E] není obsazeno [Concept('councillor','rádcem')|E].\n\n#help Pokud je místo v radě neobsazené, příslušný úkol rady je pozastaven. Nového rádce můžeš vybrat podle jeho příslušné [Concept('skill','dovednosti')|E] nebo proto, že jde o [Concept('powerful_vassal','mocného vazala')|E], který očekává místo v radě.#!"
