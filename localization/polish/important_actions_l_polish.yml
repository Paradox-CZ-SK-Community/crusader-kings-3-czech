 action_can_raze_holding_combined_group_description: "Můžete zničit [Concept('holdings','državy')|E], abyste získali [Concept('gold','zlato')|E] a nahradili je [Concept('nomadic_holdings','kočovná sídliště')|E], které jsou mnohem lepší pro [Concept('county_fertility','úrodnost hrabství')|E].$action_can_raze_holding_HELP$" # todo: CONCEPT CASE
