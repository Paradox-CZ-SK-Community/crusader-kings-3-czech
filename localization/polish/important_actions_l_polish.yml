 action_title_election_combined_group_name: "Probíhající volby lze zobrazit"
 action_title_election_desc: "Probíhají volby v [landed_title.Custom('GetTierIcon')][landed_title.GetName], [Concept('title','titulu')|E] spravovaném [landed_title.GetHolder.GetShortUIName]. Aktuálně vede kandidát [landed_title.GetHeir.GetUIName].\n\n#help Pokud jste [Concept('elector','volitel')|E], vyplatí se sledovat probíhající volby, i když jste již odevzdali své hlasy. Pamatujte, že svůj hlas můžete kdykoli změnit!\n\nI když nejste [Concept('elector','volitel')|E], je dobré sledovat volby. Koneckonců se může stát cokoliv... #emp to můžete být právě vy#! kdo je hlavním kandidátem!#!" # todo: CONCEPT CASE
