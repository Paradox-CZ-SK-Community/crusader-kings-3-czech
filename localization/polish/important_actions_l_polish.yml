 action_should_pay_ransom_HELP: "\n\n#help Zajisti, aby byli tví [Concept('heirs','dědici')|E] v bezpečí, zejména tvůj [Concept('player_heir','hráčský dědic')|E].\n\nTedy pokud náhodou nemají slabé [Concept('skills','dovednosti')|E] a některý z jejich mladších sourozenců není schopnější. V takovém případě je jejich nevyhnutelná smrt v cizím žaláři samozřejmě jen strašlivou tragédií...#!"
