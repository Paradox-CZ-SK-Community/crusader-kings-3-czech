 action_mega_duke_penalty_desc: "Vaše [Concept('realm_size','velikost panství')|E] je příliš velká pro [Concept('duke','vévodu')|E], což vám způsobuje [Concept('megaduke_penalty','přebujelost')|E].\n\n#help Duci nesmí příliš vyrůst a mít příliš mnoho [Concept('counties','hrabství')|E] ve svém [Concept('realm','panství')|E]. Dokud máte příliš mnoho [Concept('counties','hrabství')|E], trpíte sníženým [Concept('income','příjmům')|E]. Měli byste vytvořit titul [Concept('kingdom','království')|E].#!" # todo: CONCEPT CASE
