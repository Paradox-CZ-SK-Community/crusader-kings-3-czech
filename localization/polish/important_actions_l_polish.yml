 action_can_vassalize_HELP: "\n\n#help Slabí [Concept('independent','nezávislí')|E] vládci mohou vyhledat tvou ochranu a požádat, aby se stali tvými [Concept('vassal','vazaly')|E]. Rozšíření [Concept('realm','panství')|E] bez vedení [Concept('war','války')|E] je téměř vždy výhodné.#!"
 action_can_propose_alliance_to_family_member: "@alliance_icon! Můžeš vyjednat alianci"
 action_can_propose_alliance_to_family_member_combined_group_label: "@alliance_icon! Můžeš vyjednat aliance"
 action_can_propose_alliance_to_family_member_combined_group_name: "$action_can_propose_alliance_to_family_member_combined_group_label$"
 action_can_propose_alliance_to_family_member_desc: "Můžeš vyjednat [Concept('alliance','alianci')|E] s postavou [recipient.GetUIName] ([actor.Custom2('RelationToMe', recipient)]), protože vás již pojí pokrevní pouto.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nMěj se na pozoru! Některé [Concept('alliances','aliance')|E] přinášejí více potíží než užitku...\n\nUjisti se, že tuto [Concept('alliance','alianci')|E] skutečně chceš, protože tě může zatáhnout do zbytečných konfliktů.#!"
 action_can_propose_alliance_to_family_member_combined_group_description: "Můžeš vyjednat [Concept('alliances','aliance')|E] s některými členy své [Concept('family','rodiny')|E] nebo s jejich chotěmi, aniž bys musel sjednávat nový [Concept('marriage','sňatek')|E], protože vás již pojí pokrevní pouto.#help \n\nMěj se na pozoru! Některé [Concept('alliances','aliance')|E] přinášejí více potíží než užitku...\n\nUjisti se, že tuto [Concept('alliance','alianci')|E] skutečně chceš, protože tě může zatáhnout do zbytečných konfliktů.#!"
 action_can_propose_alliance_to_family_member_label: "@alliance_icon! Můžeš vyjednat alianci s [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip] ([actor.Custom2('RelationToMe', recipient)]), #low @soldier_icon![recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
 action_can_propose_alliance_to_family_member_combined_label: "[recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip] ([actor.Custom2('RelationToMe', recipient)]), #low @soldier_icon![recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
 action_can_propose_alliance_to_family_member_click: "#I Kliknutím vyjednáš alianci#!"
