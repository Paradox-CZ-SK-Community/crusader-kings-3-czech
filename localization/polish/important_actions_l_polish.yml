 action_can_raze_holding: "@raze_icon! [Concept('holding','Državu')|E] lze srovnat se zemí"
 action_can_raze_holding_combined_group_name: "@raze_icon! Državy lze srovnat se zemí"
 action_can_raze_holding_combined_group_description: "Můžeš srovnat [Concept('holdings','državy')|E] se zemí, získat tak [Concept('gold','zlato')|E] a nahradit je [Concept('nomadic_holdings','kočovnými sídlišti')|E], která jsou pro [Concept('county_fertility','úrodnost hrabství')|E] mnohem vhodnější.$action_can_raze_holding_HELP$"
 action_can_raze_holding_label: "@raze_icon! Můžeš srovnat [landed_title.GetNameNoTooltip] #low ([landed_title.GetProvince.GetHolding.GetType.GetName])#! se zemí"
 action_can_raze_holding_desc: "Můžeš srovnat [landed_title.GetName] se zemí, získat tak [Concept('gold','zlato')|E] a nahradit ji [Concept('nomadic_holding','kočovným sídlištěm')|E], které je pro [Concept('county_fertility','úrodnost hrabství')|E] mnohem vhodnější.$action_can_raze_holding_HELP$"
 action_can_raze_holding_click: "#I Kliknutím vybereš titul#!"
 action_can_raze_holding_HELP: "\n\n#help Pokud se neplánuješ usadit prostřednictvím [Concept('decisions','rozhodnutí')|E] $step_away_from_the_steppe_decision$ nebo $settle_people_decision$, zvaž srovnání [Concept('holdings','držav')|E] se zemí a jejich přeměnu na [Concept('nomadic_holdings','kočovná sídliště')|E].\n\n[Concept('nomadic_holdings','Kočovná sídliště')|E] zvyšují [Concept('fertility_equilibrium','rovnováhu úrodnosti')|E] a činí tato území méně lákavými pro usedlé vládce.\n\nChceš-li srovnat državu se zemí, klikni na kulaté tlačítko v levém dolním rohu zobrazení državy.#!"
