 action_can_demand_payment_combined_group_name: "$action_can_demand_payment_combined_group_label$"
 action_can_demand_payment_desc: "Můžete použít [Concept('hook','páka')|E], který máte na [recipient.GetUIName], k požadování, aby vám zaplatil [Concept('gold','zlato')|E].\n\n[recipient.GetSheHe|U] má v současnosti @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#! z [Concept('gold','zlata')|E], které můžete požadovat.$action_can_demand_payment_HELP$" # todo: CONCEPT CASE
