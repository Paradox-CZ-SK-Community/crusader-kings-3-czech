 action_nominate_successor_desc: "Nepodal jste svůj hlas pro [Concept('title_heir','dědice titulu')|E] u [landed_title.GetName].\n\n#help Některé [Concept('titles','titulů')|E] používají elektivní formu [Concept('succession','nástupnictví')|E], kde se dědic volí místo aby titul automaticky přecházel na přímého příbuzného. Měli byste někoho podpořit, ideálně jednoho z vašich [Concept('realm_heirs','dědiců panství')|E] nebo člena vaší [Concept('dynasty','dynastii')|E].#!" # todo: CONCEPT CASE
