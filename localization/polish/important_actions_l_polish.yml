 action_no_heir_desc: "Žádný z vašich [Concept('titles','titulů')|E] nepřejde na [Concept('heir','dědice')|E] z vaší [Concept('dynasty','dynastie')|E]!\n\n#help Pokud nemáte dědice z vaší dynastie, hra skončí, pokud zemřete! Vy (nebo některý z vašich blízkých dynastických příbuzných) musíte mít legitimní dítě a zajistit, aby [Concept('succession_laws','zákony nástupnictví')|E] a [Concept('gender_laws','zákony o pohlaví')|E] vašeho [Concept('realm','panství')|E] umožňovaly dědění!#!" # todo: CONCEPT CASE
