 TLFR_FOREIGN_RULER_SUCCESSION_TIPS: "#help Pokud vazal získá titul v cizí říši s vyšším [Concept('title_rank','hodností')|E], než je jeho současný [Concept('primary_title','hlavní titul')|E], přestane být vaším vazalem.\n\nMůže být možné zabránit tomu, aby vazalova země opustila vaši říši tím, že:\n$BULLET_WITH_TAB$[Concept( 'revoke', 'Revoking' )|E] jeho tituly\n$BULLET_WITH_TAB$udělíte vazalovi titul stejného [Concept('title_tier', 'Tier')|E], jaký zdědí#!" # todo: CONCEPT CASE
