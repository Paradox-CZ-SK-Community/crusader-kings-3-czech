 action_no_player_heir_but_replacement_exists_gameover_risk_desc: "Nemáš žádné hratelné [Concept('titles','tituly')|E], které by po tvé smrti zdědili členové tvé [Concept('dynasty','dynastie')|E]!\n\n#help To znamená, že tvou smrtí hra skončí! Některé tvé $game_concept_titles$ však mají dále v [Concept('line_of_succession','linii následnictví')|E] členy tvé $game_concept_dynasty$. Zajisti, aby jeden z nich zdědil $game_concept_title$ [Concept('title_rank','hodnosti')|E] [Concept('count','hraběte')|E] nebo vyšší, ať už změnou [Concept('succession_laws','zákonů nástupnictví')|E], nebo zosnováním intriky [GetScheme('murder').GetTypeName]...#!"
