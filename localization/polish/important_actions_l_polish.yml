 action_upgrade_tribal_holding_type_combined_group_name: "@building_icon! Měl bys feudalizovat [Concept('tribal','kmenové')|E] [Concept('holdings','državy')|E]"
 action_upgrade_tribal_holding_type_combined_group_description: "Jako [Concept('character','postava')|E] s jinou než [Concept('tribal','kmenovou')|E] vládou nezískáváš z [Concept('holdings','držav')|E] s označením „$game_concept_tribal$“ žádné [Concept('levies','odvedence')|E] ani [Concept('taxes','daně')|E]. Měl bys danou lokalitu typu $game_concept_holding$ reformovat a přeměnit ji na [Concept('castle','hrad')|E].$action_upgrade_tribal_holding_type_HELP$"
