 CREATE_USURP_TITLE_PROS_CONS: "\n$BULLET_WITH_TAB$Můžete zvýšit svůj [Concept('rank','hodnost')|E]\n$BULLET_WITH_TAB$Získáte [Concept('de_jure','de iure')|E] [Concept('casus_bellis','casus belli')|E]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] vás nyní mohou považovat za svého [Concept('rightful_liege','právoplatného lenního pána')|E]\n$BULLET_WITH_TAB$Získáte [Concept('prestige','prestiž')|E]\n\nNicméně existují i nevýhody:\n$BULLET_WITH_TAB$Vaši vazalové mohou titul požadovat\n$BULLET_WITH_TAB$Pokud má vaše [Concept('realm','panství')|E] [Concept('succession_law','zákon nástupnictví')|E] s více [Concept('realm_heirs','dědici panství')|E], ovlivní to, kdo dědí které tituly." # todo: CONCEPT CASE
 action_above_domain_limit: "@domain_icon! Nad [Concept('domain_limit','limitem domény')|E]" # todo: CONCEPT CASE
 action_above_domain_limit_label: "@domain_icon! Nad [Concept('domain_limit','limitem domény')|E]" # todo: CONCEPT CASE
 action_above_domain_limit_desc: "Máte o [actor.GetDomainLimitOverrunWithoutGracePeriod|V] [Concept('holdings','državy')|E] více, než je váš limit [Concept('domain','doména')|E] [actor.GetDomainLimit|V], což sníží vaše [Concept('taxes','daně')|E] a [Concept('levies','odvedenci')|E].\n\n#help Jako [Concept('ruler','vládce')|E] můžete vlastnit pouze omezené množství držeb. Zbytek držeb ve vašem [Concept('realm','panství')|E] by měli vlastnit vaši [Concept('vassals','vazaly')|E].\n\nMěli byste někomu udělit některé ze svých [Concept('titles','titulů')|E] s držbami. [Concept('courtiers','Dvořané')|E] a [Concept('guests','hosté')|E] jsou dobrou volbou, protože budou slabí. Stávající vazalové mohou tituly také přijmout, ale poté zesílí a mohli by se v budoucnu stát hrozbou#!" # todo: CONCEPT CASE
 action_above_domain_limit_click: "#I Klikněte pro zobrazení vašich titulů#!"
 action_above_vassal_limit: "Nad [Concept('vassal_limit','limitem vazalů')|E]" # todo: CONCEPT CASE
 action_above_vassal_limit_label: "Nad [Concept('vassal_limit','limitem vazalů')|E]" # todo: CONCEPT CASE
 action_above_vassal_limit_desc: "Máte o [actor.GetVassalLimitOverrun|V] [Concept('direct_vassals','přímé vazaly')|E] více nad limitem vazalů [actor.GetVassalLimit|V], což sníží [Concept('taxes','daně')|E] a [Concept('levies','odvedenci')|E] získávané od vašich [Concept('vassals','vazalů')|E].\n#help Každý [Concept('ruler','vládce')|E] může ovládat pouze určitý počet přímých vazalů. Místo toho, aby byli přímými vazaly, by je měl spravovat některý z vašich dalších vazalů. Toho dosáhnete udělením jednoho z vašich vazalů jinému vazalovi.#!" # todo: CONCEPT CASE
