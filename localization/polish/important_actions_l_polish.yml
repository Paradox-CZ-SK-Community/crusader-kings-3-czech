 action_can_potentially_propose_alliance_to_family_member: "@alliance_icon! Možné vyjednání aliance"
 action_can_potentially_propose_alliance_to_family_member_combined_group_label: "@alliance_icon! Možná vyjednání aliancí"
 action_can_potentially_propose_alliance_to_family_member_combined_group_name: "$action_can_potentially_propose_alliance_to_family_member_combined_group_label$"
 action_can_potentially_propose_alliance_to_family_member_desc: "[recipient.GetUIName] ([actor.Custom2('RelationToMe', recipient)]) by s tebou nyní [Concept('alliance','alianci')|E] #EMP nepřijal[Select_CString( recipient.IsFemale, 'a', '' )]#!, ale možná bys [Select_CString( recipient.IsFemale, 'ji', 'jej' )] dokázal přesvědčit.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nPotřebuješ-li alianci, může ti její vyjednání umožnit zlepšení [Concept('opinion','mínění')|E] nebo získání [Concept('hook','páky')|E].\n\nJak blízko je druhá strana k přijetí nabídky aliance, můžeš zjistit umístěním kurzoru na skóre přijetí v otevřené interakci.#!"
 action_can_potentially_propose_alliance_to_family_member_combined_group_description: "Tyto postavy by s tebou nyní [Concept('alliance','alianci')|E] #EMP nepřijaly#!, ale možná bys je dokázal přesvědčit.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nPotřebuješ-li alianci, může ti její vyjednání umožnit zlepšení [Concept('opinion','mínění')|E] nebo získání [Concept('hook','páky')|E].\n\nJak blízko jsou k přijetí nabídky aliance, můžeš zjistit umístěním kurzoru na skóre přijetí v otevřené interakci.#!"
 action_can_potentially_propose_alliance_to_family_member_label: "@alliance_icon! Možná můžeš vyjednat alianci s [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip] ([actor.Custom2('RelationToMe', recipient)]), #low @soldier_icon![recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
