 action_not_rightful_liege_desc: "Nejsi [Concept('rightful_liege','právoplatným lenním pánem')|E] postavy [recipient.GetShortUIName] ([actor.Custom2('RelationToMe', recipient)]).\n\nOvěř, zda můžeš [Concept('create','vytvořit')|E] nebo [Concept('usurp','uzurpovat')|E] titul, díky němuž se staneš jejím [Concept('de_jure','de iure')|E] [Concept('liege','lenním pánem')|E]. Tím zlepšíš její [Concept('opinion','mínění')|E] o tobě a zvýšíš [Concept('taxes','daně')|E] i počet [Concept('levies','odvedenců')|E], které od ní získáváš.\n\nPokud to není možné, zvaž [Concept('transferring','převedení')|E] této postavy pod jiného ze svých vazalů, zejména pokud by byl jejím [Concept('rightful_liege','právoplatným lenním pánem')|E]."
 action_not_rightful_liege_combined_group_description: "Nejsi [Concept('rightful_liege','právoplatným lenním pánem')|E] několika svých vazalů.\n\nOvěř, zda můžeš [Concept('create','vytvořit')|E] nebo [Concept('usurp','uzurpovat')|E] tituly, díky nimž se staneš jejich [Concept('de_jure','de iure')|E] [Concept('liege','lenním pánem')|E]. Tím zlepšíš jejich [Concept('opinion','mínění')|E] o tobě a zvýšíš [Concept('taxes','daně')|E] i počet [Concept('levies','odvedenců')|E], které od nich získáváš.\n\nPokud to není možné, zvaž jejich [Concept('transferring','převedení')|E] pod jiné ze svých vazalů, zejména pokud by tito vazalové byli jejich [Concept('rightful_liege','právoplatnými lenními pány')|E]."
