 action_no_heir_desc: "Žádný z tvých [Concept('titles','titulů')|E] nepřipadne [Concept('heir','dědici')|E] z tvé [Concept('dynasty','dynastie')|E]!\n\n#help Pokud nemáš dědice ze své dynastie, hra skončí! Ty nebo někdo z tvých blízkých dynastických příbuzných musíte zplodit legitimní dítě a zajistit, aby toto dítě mohlo podle [Concept('succession_laws','zákonů nástupnictví')|E] a [Concept('gender_laws','zákonů o pohlaví')|E] tvého [Concept('realm','panství')|E] dědit!#!"
