 action_can_demand_payment_combined_group_label: "@cs_weak_hook_icon! Můžeš požadovat platby"
 action_can_demand_payment_combined_group_name: "$action_can_demand_payment_combined_group_label$"
 action_can_demand_payment_desc: "Můžeš využít [Concept('hook','páku')|E], kterou máš na postavu [recipient.GetUIName], a požadovat od ní platbu v [Concept('gold','zlatu')|E].\n\n[recipient.GetSheHe|U] má v současnosti @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#! zlata, které můžeš požadovat.$action_can_demand_payment_HELP$"
 action_can_demand_payment_combined_group_description: "Můžeš využít své [Concept('hooks','páky')|E] a požadovat platby v [Concept('gold','zlatu')|E].$action_can_demand_payment_HELP$"
 action_can_demand_payment_label: "@cs_weak_hook_icon! Můžeš požadovat platbu od postavy [recipient.GetShortUINameNoTooltip] ([actor.Custom2('RelationToMe', recipient)]), @gold_icon!#V [recipient.MakeScope.ScriptValue('golden_obligation_value_check_current_situation')|0]/[recipient.MakeScope.ScriptValue('golden_obligation_value')|0]#!"
