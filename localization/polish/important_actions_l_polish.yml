 action_powerful_vassal_not_on_council_click: "#I Kliknutím zobrazíš svou radu#!"
 action_powerful_vassal_not_on_council_HELP: "\n\n#help Zvaž jmenování mocných vazalů do [Concept('councillor','funkce rádce')|E]. Jinak se jejich [Concept('opinion','mínění')|E] o tobě zhorší a mohou se připojit k [Concept('faction','frakci')|E] namířené proti tobě.\n\nNe každý však má dostatečně vysoké [Concept('skills','dovednosti')|E], aby byl užitečný, a pokud máš dostatečně vysokou [Concept('rank','hodnost')|E], může být mocných vazalů jednoduše více než míst v radě.#!"
