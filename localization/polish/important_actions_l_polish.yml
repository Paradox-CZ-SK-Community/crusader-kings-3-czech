 action_should_pay_ransom_desc: "Váš [actor.Custom2('RelationToMe', secondary_recipient)], [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUIName] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)], je v [secondary_recipient.Custom('PrisonTypeModifier')] a může mu/ji hrozit poškození zdraví nebo dokonce [Concept('executed','popravený')|E], pokud zůstane v [Concept('prison','vězení')|E]. Měli byste zaplatit [Select_CString(secondary_recipient.IsFemale,'její','jeho')] výkupné, pokud chcete ochránit [secondary_recipient.GetHerHis] [Concept('health','zdraví')|E].\n\n[Select_CString(secondary_recipient.IsFemale,'Její','Jeho')] výkupné je @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#! [Concept('gold','zlato')|E].$action_should_pay_ransom_HELP$" # todo: CONCEPT CASE
 action_should_pay_ransom_combined_group_description: "Máte důležité postavy, které jsou [Concept('imprisoned','uvězněný')|E]; měli byste zaplatit jejich výkupné, pokud chcete ochránit jejich [Concept('health','zdraví')|E].$action_vassal_ransom_gives_hook_HELP$" # todo: CONCEPT CASE
 action_should_pay_ransom_label: "@gold_icon! Měli byste zaplatit výkupné za svého [actor.Custom2('RelationToMe', secondary_recipient)] [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUINameNoTooltip] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)], @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_should_pay_ransom_combined_label: "Váš [actor.Custom2('RelationToMe', secondary_recipient)], [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUINameNoTooltip] [secondary_recipient.Custom2('GetSuccessionLinePositionCurrentSituation', actor)], @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
 action_should_pay_ransom_click: "#I Klikněte pro zaplacení výkupného#!"
 action_should_pay_ransom_HELP: "\n\n#help Měli byste zajistit, aby vaši [Concept('heirs','dědice')|E] byli v bezpečí, zejména váš [Concept('player_heir','hráčský dědic')|E].\n\nNo, pokud se #EMP náhodou stane#!, že mají špatné [Concept('skills','dovedností')|E] a některé z jejich mladších sourozenců je lepší — v takovém případě je jejich nevyhnutelná smrt v cizím žaláři ničím jiným než hroznou tragédií...#!" # todo: CONCEPT CASE
