 action_can_potentially_propose_alliance_to_family_member_combined_group_label: "@alliance_icon! Potenciální vyjednávání o alianci"
 action_can_potentially_propose_alliance_to_family_member_combined_group_name: "$action_can_potentially_propose_alliance_to_family_member_combined_group_label$"
 action_can_potentially_propose_alliance_to_family_member_desc: "Váš [actor.Custom2('RelationToMe', recipient)] [recipient.GetUIName] by #EMP not#! přijal [Concept('alliance','aliance')|E] s vámi právě teď, ale potenciálně by [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] být přesvědčen.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nPokud potřebujete [Alliance], zlepšení [Concept('opinion','mínění')|E] nebo získání [Concept('hook','páka')|E] by vám mohlo umožnit vyjednat ji.\n\nMůžete zkontrolovat, jak blízko jsou k přijetí vaší nabídky aliance, když otevřete interakci a najetím myší zjistíte skóre přijetí.#!" # todo: CONCEPT CASE
 action_can_potentially_propose_alliance_to_family_member_combined_group_description: "Tito jedinci by #EMP not#! nyní nepřijali [Concept('alliance','aliance')|E] s vámi, ale potenciálně by mohli být přesvědčeni.\n\n[actor.Custom2('GetInOrOutsideRealmAllianceInfo', recipient)]#help \n\nPokud potřebujete [Alliance], zlepšení [Concept('opinion','mínění')|E] nebo získání [Concept('hook','páka')|E] by vám mohlo umožnit ji vyjednat.\n\nMůžete zjistit, jak blízko jsou k přijetí vaší nabídky aliance, když otevřete interakci a najedete kurzorem na skóre přijetí.#!" # todo: CONCEPT CASE
 action_can_potentially_propose_alliance_to_family_member_label: "@alliance_icon! Potenciálně můžete vyjednat alianci se svým [actor.Custom2('RelationToMe', recipient)] [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetShortUINameNoTooltip], #low @soldier_icon![recipient.GetMilitaryStrengthText]#! [actor.Custom2('GetInOrOutsideRealm', recipient)]"
