 action_in_treasury_debt_desc: "Máte méně než [Concept('treasury_i','@treasury_icon!')|E]#V 0#! [Concept('treasury','pokladnice')|E] a jste proto v [Concept('treasury_debt','dluhu pokladnice')|E]!\n\nBýt v dluhu má následující účinky:\n$BULLET_WITH_TAB$Nemůžete vyhlásit [Concept('war','válka')|E]\n$BULLET_WITH_TAB$Nelze doplnit [Concept('men_at_arms','ozbrojenci')|E], kteří vyžadují [Concept('treasury_i','@treasury_icon!')|E][Concept('treasury','pokladnice')|E]\n$BULLET_WITH_TAB$[Concept('county_corruption','Korupce v hrabství')|E] se šíří ve vašem [Concept('domain','doméně')|E]\n$BULLET_WITH_TAB$[Concept('vassals','Vazalové')|E] mají větší pravděpodobnost připojení k [Concept('factions','frakcím')|E]\n\nČím hlubší dluh máte, tím tvrdší tresty budete čelit. Vaše současná úroveň dluhu má následující dodatečné účinky:\n\n[GetPlayer.GetTreasuryDebtModifierDescription]\n\n#help Pokud každý měsíc nezískáváte [Concept('treasury','pokladnice')|E], zvažte snížení výdajů, například:\n$BULLET_WITH_TAB$Rozpuštěním [Concept('armies','armádami')|E]\n$BULLET_WITH_TAB$Zmenšením velikosti nebo zničením vašich [Concept('men_at_arms','ozbrojenců')|E]\n$BULLET_WITH_TAB$Zvýšením [Concept('control','kontrolou')|E] pomocí vašeho [Concept('marshal','maršála')|E]\n$BULLET_WITH_TAB$Odvoláním [Concept('court_positions','dvorských úřadů')|E]#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
