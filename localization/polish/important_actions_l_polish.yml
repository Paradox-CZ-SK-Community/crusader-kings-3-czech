 action_can_usurp_title_desc: "V rámci titulu [landed_title.GetName] ovládáš dostatek [Concept('counties','hrabství')|E], a můžeš proto [Concept('title','titul')|E] [Concept('usurp','uzurpovat')|E].$action_can_usurp_title_HELP$"
 action_can_usurp_title_combined_group_description: "Ovládáš dostatek [Concept('counties','hrabství')|E] náležejících k některým [Concept('titles','titulům')|E], a můžeš proto tyto tituly [Concept('usurp','uzurpovat')|E].$action_can_usurp_title_HELP$"
