 action_vassal_ransom_gives_hook_combined_label: "Váš [actor.Custom2('RelationToMe', secondary_recipient)], [secondary_recipient.Custom('GetPrimaryTitleTierIcon')][secondary_recipient.GetShortUINameNoTooltip], @gold_icon!#V [secondary_recipient.MakeScope.ScriptValue('ransom_cost_value')|0]#!"
