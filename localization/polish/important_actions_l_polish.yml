 action_can_create_title_combined_group_description: "Ovládáš dostatek [Concept('counties','hrabství')|E], a můžeš proto [Concept('titles','tituly')|E], k nimž náležejí, [Concept('create','vytvořit')|E].$action_can_create_title_HELP$"
