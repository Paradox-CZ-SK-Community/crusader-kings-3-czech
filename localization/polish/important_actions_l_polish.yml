 action_can_demand_payment_click: "#I Kliknutím budeš požadovat platbu#!"
 action_can_demand_payment_HELP: "\n\n#help Můžeš to udělat díky [Concept('perk','talentu')|E] [GetPerk('golden_obligations_perk').GetName(GetPlayer)].\n\nPožadováním platby využiješ [Concept('hook','páku')|E], kterou na danou postavu máš. Ujisti se proto, že ji skutečně chceš použít tímto způsobem!#!"
 action_hook_expiring: "@cs_weak_hook_icon! Páka brzy vyprší"
 action_hook_expiring_combined_group_label: "@cs_weak_hook_icon! Páky brzy vyprší"
 action_hook_expiring_combined_group_name: "$action_hook_expiring_combined_group_label$"
 action_hook_expiring_desc: "Měl bys brzy využít [Concept('hook','páku')|E], kterou máš na postavu [recipient.GetUIName] ([actor.Custom2('RelationToMe', recipient)]), jinak [actor.GetHookOn( recipient.Self ).GetExpirationDate.GetString] vyprší."
 action_hook_expiring_combined_group_description: "Měl bys využít své [Concept('hooks','páky')|E], kterým se blíží konec platnosti, jinak jednoduše zaniknou"
 action_hook_expiring_label: "@cs_weak_hook_icon! Tvá [Concept('hook','páka')|E] na postavu [recipient.GetShortUINameNoTooltip] ([actor.Custom2('RelationToMe', recipient)]) brzy vyprší"
 action_hook_expiring_combined_label: "[recipient.GetUINameNoTooltip] ([actor.Custom2('RelationToMe', recipient)])"
 action_hook_expiring_click: "#I Kliknutím otevřeš zobrazení postavy#!"
 action_can_use_hook_to_change_contract: "@cs_weak_hook_icon! Můžeš upravit vazalskou smlouvu"
 action_can_use_hook_to_change_contract_combined_group_label: "@cs_weak_hook_icon! Můžeš upravit vazalské smlouvy"
 action_can_use_hook_to_change_contract_combined_group_name: "$action_can_use_hook_to_change_contract_combined_group_label$"
 action_can_use_hook_to_change_contract_desc: "Protože máš [Concept('hook','páku')|E] na svého [GetGovernment( 'feudal_government' ).GetName] [Concept('vassal','vazala')|E] [recipient.GetUIName], můžeš ji využít ke změně jeho [Concept('vassal_contract','vazalské smlouvy')|E].\n\n#help Zvýšení [Concept('vassals_possessive','vazalových')|E] [Concept('obligations','povinností')|E] vůči tobě je jedním z nejvýhodnějších způsobů využití [Concept('hook','páky')].\n\nNávrh nespravedlivé změny [Concept('vassal_contract','vazalské smlouvy')|E] by za běžných okolností vedl k získání [Concept('tyranny','tyranie')|E], tomu se však vyhneš využitím [Concept('hook','páky')|E]. Můžeš navrhnout pouze jednu nespravedlivou změnu. Za každou další už [Concept('tyranny','tyranii')] získáš.\n\nPři úpravě [Concept('vassal_contract','vazalské smlouvy')|E] nezapomeň #high zaškrtnout políčko „Použít páku“#!.#!"
 action_can_use_hook_to_change_contract_combined_group_description: "Protože máš [Concept('hooks','páky')|E] na [GetGovernment( 'feudal_government' ).GetName] [Concept('vassals','vazaly')|E], můžeš je využít ke změně jejich [Concept('vassal_contracts','vazalských smluv')|E].\n\n#help Zvýšení [Concept('vassals_possessive','vazalových')|E] [Concept('obligations','povinností')|E] vůči tobě je jedním z nejvýhodnějších způsobů využití [Concept('hook','páky')].\n\nNávrh nespravedlivé změny [Concept('vassal_contract','vazalské smlouvy')|E] by za běžných okolností vedl k získání [Concept('tyranny','tyranie')|E], tomu se však vyhneš využitím [Concept('hook','páky')]. Můžeš navrhnout pouze jednu nespravedlivou změnu. Za každou další už [Concept('tyranny','tyranii')] získáš.\n\nPři úpravě [Concept('vassal_contract','vazalské smlouvy')|E] nezapomeň #high zaškrtnout políčko „Použít páku“#!.#!"
 action_can_use_hook_to_change_contract_label: "@cs_weak_hook_icon! Můžeš změnit smlouvu [recipient.GetShortUINamePossessiveNoTooltip] ([actor.Custom2('RelationToMe', recipient)])"
 action_can_use_hook_to_change_contract_combined_label: "[recipient.GetUINameNoTooltip] ([actor.Custom2('RelationToMe', recipient)])"
 action_can_use_hook_to_change_contract_click: "#I Kliknutím upravíš smlouvu#!"
 action_can_ask_hof_for_money: "@gold_icon!Můžeš požádat svou hlavu víry o zlato"
 action_can_ask_hof_for_money_label: "$action_can_ask_hof_for_money$"
 action_can_ask_hof_for_money_desc: "Tvá [Concept('head_of_faith','hlava víry')|E] [recipient.GetUIName] by vyhověla tvé žádosti o [Concept('gold','zlato')|E].\n\n#help Pokud máš málo [Concept('gold','zlata')|E], můžeš tímto způsobem vynaložit [Concept('piety','zbožnost')|E] a rozšířit svou pokladnici!#!"
 action_can_ask_hof_for_money_click: "#I Kliknutím provedeš interakci $hof_ask_for_gold_interaction$#!"
 action_title_election: "@law_icon! Probíhající volba v pro[landed_title.GetBaseNameNoTooltip]"
 action_title_election_combined_group_label: "Probíhající volby"
 action_title_election_combined_group_name: "Probíhající volby lze zobrazit"
 action_title_election_desc: "Pro [landed_title.Custom('GetTierIcon')][landed_title.GetName] probíhá volba. Tomuto [Concept('title','titulu')|E] vládne [landed_title.GetHolder.GetShortUIName]. V současnosti vede [landed_title.GetHeir.GetUIName].\n\n#help Jsi-li [Concept('elector','volitelem')|E], vyplatí se sledovat probíhající volby, i když jsi již odevzdal svůj hlas. Nezapomeň, že jej můžeš kdykoli změnit!\n\nI když nejsi [Concept('elector','volitelem')|E], je dobré volby sledovat. Stát se může cokoli... hlavním kandidátem můžeš být právě #emp ty#!.#!"
 action_title_election_combined_group_description: "V tvém panství probíhají volby.\n\n#help Jsi-li [Concept('elector','volitelem')|E], vyplatí se sledovat probíhající volby, i když jsi již odevzdal své hlasy. Nezapomeň, že je můžeš kdykoli změnit!\n\nI když nejsi [Concept('elector','volitelem')|E], je dobré volby sledovat. Stát se může cokoli... hlavním kandidátem můžeš být právě #emp ty#!.#!"
 action_title_election_label: "@law_icon! Probíhající volba pro [landed_title.GetBaseNameNoTooltip]"
 action_title_election_combined_label: "[landed_title.Custom('GetTierIcon')] [landed_title.GetNameNoTooltip|U]"
 action_title_election_click: "#I Kliknutím zobrazíš volbu#!"
 action_grant_vassal_to_rightful_liege: "@vassal_icon! Můžeš převést vazala pod právoplatného lenního pána"
 action_grant_vassal_to_rightful_liege_combined_group_label: "@vassal_icon! Můžeš převést vazaly pod právoplatné lenní pány"
 action_grant_vassal_to_rightful_liege_combined_group_name: "@vassal_icon! Vazaly lze převést pod jejich právoplatné lenní pány"
 action_grant_vassal_to_rightful_liege_desc: "Převedením postavy [secondary_actor.GetNameNoTooltip] pod postavu [recipient.GetNameNoTooltip] se zbavíš postihu za to, že nejsi jejím [Concept('rightful_liege','právoplatným lenním pánem')|E].$action_grant_vassal_to_rightful_liege_HELP$"
 action_grant_vassal_to_rightful_liege_combined_group_description: "Můžeš převést [Concept('vassal','vazala')|E] pod jeho [Concept('rightful_liege','právoplatného lenního pána')|E].$action_grant_vassal_to_rightful_liege_HELP$"
 action_grant_vassal_to_rightful_liege_label: "@vassal_icon! Můžeš převést [secondary_actor.GetPrimaryTitle.Custom('GetTierIcon')][secondary_actor.GetUINameNoTooltip] pod [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip]"
 action_grant_vassal_to_rightful_liege_combined_label: "Převést [secondary_actor.GetPrimaryTitle.Custom('GetTierIcon')][secondary_actor.GetUINameNoTooltip] pod [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUINameNoTooltip]"
 action_grant_vassal_to_rightful_liege_click: "#I Kliknutím převedeš vazala#!"
 action_grant_vassal_to_rightful_liege_HELP: "\n\n#help [Concept('vassals','Vazalové')|E], jejichž právoplatným lenním pánem nejsi, ti poskytují méně prostředků a mají o tobě horší [Concept('opinion','mínění')|E]. Někdy je proto nejlepší převést je pod jejich právoplatného lenního pána, pokud je také tvým vazalem.\n\nTakovým převedením můžeš někdy snížit své příjmy, zpravidla se však přesto vyplatí. Právoplatný lenní pán bude mít vůči tobě výrazný postih k mínění, pokud si ponecháváš vazala, kterého považuje za svého.\n\nSprávné uspořádání vazalů je základem stabilního panství.#!"
 action_can_create_head_of_faith_title: "@titles_icon! Můžeš vytvořit titul [Concept('head_of_faith','hlavy víry')|E] pro [actor.GetFaith.GetName]"
 action_can_create_head_of_faith_title_desc: "$action_can_create_head_of_faith_title_spiritual_desc$\n\n#help Vytvořením titulu hlavy víry se zároveň staneš [Concept('temporal_head_of_faith','světskou hlavou víry')|E]!#!"
