 action_vassal_ransom_gives_hook_click: "#I Kliknutím zaplatíš výkupné#!"
 action_vassal_ransom_gives_hook_HELP: "\n\n#help Získání páky na vazala může být výhodné, zejména pokud chceš zvýšit jeho [Concept('obligations','povinnosti')|E] změnou [Concept('vassal_contract','vazalské smlouvy')|E], což v tomto případě můžeš učinit!#!"
