 action_wrong_holding_type_HELP: "\n\n#help Každý vladař má typ vlády, který určuje, jaké typy [Concept('holdings','državy')|E] může správně spravovat. Například feudální vládcové mohou správně spravovat pouze [Concept('castles','hrady')|E]. Jakákoli držba nesprávného typu je prakticky bezcenná a počítá se proti vašemu [Concept('domain_limit','limitu domény')|E].\n\nMěli byste tyto typy držeb udělit [Concept('unlanded','bezzemek')|E] členu vašeho [Concept('court','dvora')|E], a oni se stanou vašimi [Concept('vassal','vazalem')|E].#!" # todo: CONCEPT CASE
