 action_can_vassalize_desc: "Sousední [Concept('ruler','vládce')|E], [recipient.GetPrimaryTitle.Custom('GetTierIcon')][recipient.GetUIName], si přeje vaši ochranu a přijal by [Concept('vassalization','vazalizace')|E].$action_can_vassalize_HELP$" # todo: CONCEPT CASE
