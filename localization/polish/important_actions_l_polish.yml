 action_title_lost_from_realm_on_succession_combined_group_description: "Někteří z vašich [Concept('vassals','vazalů')|E] drží [Concept('titles','tituly')|E], které zdědí [Concept('rulers','vládci')|E], kteří nejsou vašimi [Concept('vassals','vazaly')|E].\n\n$TLFR_CROWN_AUTHORITY_TIP$" # todo: CONCEPT CASE
 TLFR_CROWN_AUTHORITY_TIP: "#help Nejspolehlivějším způsobem, jak tomu předejít, je zvýšit vaši [Concept('crown_authority','korunní autoritu')|E] na [GetLaw('crown_authority_2').GetName]. To ale může být také způsobeno tím, že dotyčný vazal nemá legitimní děti. Pokud je [Concept('married','sezdán')|E] a [Select_CString(ROOT.Char.IsFemale,'plodná','plodný')], problém se může vyřešit sám.#!" # todo: CONCEPT CASE
