l_polish:
 demand_church_succession_interaction: "Požadovat církevní nástupnictví"
 demand_church_succession_religious_head_interaction: "Nařídit církevní nástupnictví"
 demand_church_succession_interaction_desc: "Pokud [recipient.GetTitledFirstName] zemře bez právoplatného dědice, země, které ovládá, připadnou držiteli titulu [actor.GetPrimaryTitle.GetName] jako [Concept('fallback_heir','náhradnímu dědici')|E]."
 demand_church_succession_religious_head_interaction_desc: "Jako [Concept('head_of_faith','hlava')|E] [CZFaithAdjDecline(actor.GetFaith,'é')|l] [Concept('faith','víry')|E] nařiď, aby [Concept('realm','panství')|E] [recipient.Custom('CZ_TitledFirstName_G')] v případě smrti bez dědice připadlo držiteli titulu [actor.GetPrimaryTitle.GetName]."
 demand_church_succession_target_in_reach: "[Concept('realm','Panství')|E], kterému [Select_CString(recipient.IsLocalPlayer,'vládneš','vládne')] [recipient.GetShortUIName], nesousedí s [Concept('realm','panstvím')|E], kterému [Select_CString(actor.IsLocalPlayer,'vládneš','vládne')] [actor.GetShortUIName], ani neleží v [Concept('archdiocese','arcidiecézi')|E], kterou [Select_CString(actor.IsLocalPlayer,'spravuješ','spravuje')] [actor.GetShortUIName]"
 demand_church_succession_no_existing_fallback: "Nástupnictví [recipient.Custom('CZ_TitledFirstName_G')] už bylo přislíbeno jinému duchovnímu nebo [Concept('fallback_heir','náhradnímu dědici')|E]"
 demand_church_succession_no_elective: "[Concept('primary_title','Hlavní titul')|E] [recipient.Custom('CZ_TitledFirstName_G')] podléhá [Concept('elective_succession','volebnímu nástupnictví')|E] nebo [Concept('advanced_succession','pokročilému nástupnictví')|E]"
 demand_church_succession_recently_refused_tt: "Nedávné odmítnutí požadavku na církevní nástupnictví chrání [recipient.Custom('CZ_TitledFirstName_A')] před dalšími podobnými požadavky po dobu deseti let"
 DEMAND_CHURCH_SUCCESSION_SEND_NAME: "Požadovat církevní nástupnictví"
 DEMAND_CHURCH_SUCCESSION_NOTIFICATION: "[actor.GetTitledFirstName|U] požaduje, aby v případě, že [recipient.GetTitledFirstName] zemře bez dědice, [Concept('realm','panství')|E] [recipient.Custom('CZ_TitledFirstName_G')] připadlo držiteli titulu [actor.GetPrimaryTitle.GetName]."
 demand_church_succession_actor_toast: "[recipient.GetTitledFirstName|U] je [Select_CString(recipient.IsFemale,'vázána','vázán')] na [Concept('faith','víru')|E]"
 demand_church_succession_actor_toast_desc: "Pokud [recipient.GetTitledFirstName] zemře bez dědice, držitel titulu [actor.GetPrimaryTitle.GetName] zdědí [Concept('realm','panství')|E] [recipient.Custom('CZ_TitledFirstName_G')]."
 demand_church_succession_actor_toast_puppeteer: "[puppet_or_actor.GetShortUIName|U] [Select_CString(puppet_or_actor.IsLocalPlayer,'jsi ','')][Select_CString(puppet_or_actor.IsFemale,'zavázala','zavázal')] [recipient.Custom('CZ_TitledFirstName_A')] [Concept('faith','víře')|E]"
 demand_church_succession_actor_toast_desc_puppeteer: "Pokud [recipient.GetTitledFirstName] zemře bez dědice, držitel titulu [puppet_or_actor.GetPrimaryTitle.GetName] zdědí [Concept('realm','panství')|E] [recipient.Custom('CZ_TitledFirstName_G')]."
 demand_church_succession.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0001.desc.pope: "Díky milosti, kterou nám dává [actor.GetFaith.HighGodName], ti píšeme ve věci dědictví."
 demand_church_succession.0001.desc.archbishop: "Ze své arcidiecéze, která bdí nad tvými zeměmi, ti píšu ve věci dědictví."
 demand_church_succession.0001.desc.bishop: "Tvůj pastýř ti píše ve věci dědictví."
 demand_church_succession.0001.desc.head_of_faith_generic: "Jako [actor.GetTitleAsNameNoTooltip] naší víry ti píšu ve věci dědictví."
 demand_church_succession.0001.desc.theocrat_generic: "Od oltáře, kde se uctívá [actor.GetFaith.HighGodName], ti píšu ve věci dědictví."
 demand_church_succession.0001.flavour.zealous: "\n\nNenech se mýlit:"
 demand_church_succession.0001.flavour.ambitious: "\n\nBuďme k sobě upřímní:"
 demand_church_succession.0001.flavour.deceitful: "\n\nJistě tě potěší, že"
 demand_church_succession.0001.flavour.greedy: "\n\nŘeknu to bez obalu:"
 demand_church_succession.0001.flavour.compassionate: "\n\nOdpusť mi tuto nutnost, [recipient.Custom('CZ_TitledFirstName_V')], ale"
 demand_church_succession.0001.flavour.default: "\n\nDovol mi mluvit otevřeně:"
 demand_church_succession.0001.recipient.elderly_childless: "kolébka u tvého krbu zeje prázdnotou a tvá pokrevní linie končí s tebou. Věřící vyčkají a časem zdědí tvé země."
 demand_church_succession.0001.recipient.childless: "nemáš žádné žijící děti. Pokud na tom [actor.GetFaith.HighGodName] nic nezmění, tvé země budou sloužit víře."
 demand_church_succession.0001.recipient.one_child: "od konce tvé pokrevní linie tě dělí jediné dítě. Pokud si je [actor.GetFaith.HighGodName] vezme, věřící jsou připraveni ujmout se vlády."
 demand_church_succession.0001.recipient.default: "léta nepřejí žádným příslibům. Pokud ten tvůj selže, tvé země připadnou nám, abychom jim vládli z pověření, které nám dává [actor.GetFaith.HighGodName]."
 demand_church_succession.0001.a: "Tak je psáno. Tak se stane."
 demand_church_succession.0001.b: "Pak bude nejlepší postarat se o dědice."
 demand_church_succession.0001.c: "[actor.GetTitledFirstNameNoTooltip|U] zachází příliš daleko."
 demand_church_succession.0001.c.tt: "Zrušíš ujednání o [Concept('fallback_heir_title','titulu náhradního dědice')|E] a po dobu deseti let na tebe nebude možné vznášet další požadavky na církevní nástupnictví, ale [actor.GetTitledFirstName] na tuto urážku jen tak nezapomene"
 demand_church_succession.0002.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 demand_church_succession.0002.desc: "Tvůj požadavek jsem si [Select_CString(recipient.IsFemale,'přečetla a odmítla','přečetl a odmítl')]. Mé panství nikdy nepřipadne církvi. Starej se o svůj oltář, [actor.Custom('CZ_TitledFirstName_V')], a já se postarám o své země."
 demand_church_succession.0002.a: "Na takovou opovážlivost se nezapomíná."
 demand_church_succession_fertility_modifier: "Odhodlání zplodit dědice"
 demand_church_succession_fertility_modifier_desc: "Tato postava chce udržet své panství mimo ruce duchovenstva, a proto zdvojnásobila své úsilí v manželském loži."
 defied_church_succession_opinion: "Odmítnutí mého dědického nároku"
 meddling_church_opinion: "Vměšování do mého nástupnictví"
