 char_interaction.0300.desc: "V tuto chvíli nevidím žádný prospěch v tom, že bych jako své rukojmí přijal tuto osobu: tvůj [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName]."
 char_interaction.0300.a: "Takže takhle to je?"
 char_interaction.0301.desc: "Tvůj netaktní požadavek, abych ti vydal jako rukojmí tuto osobu, mohu jedině odmítnout: můj [recipient.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName]."
 char_interaction.0301.a: "Pošetilé."
 char_interaction.0311.desc: "Přestaň se prosím pokoušet sjednat mezi námi příměří. V tuto chvíli nemohu souhlasit s výměnou rukojmích."
 char_interaction.0311.a: "Budiž."
 char_interaction.0320.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient )]"
 char_interaction.0320.desc: "Nenašel se žádný důvod, proč bych měl nadále držet jako [actor.GetPrimaryTitle.GetAdjectiveNoTooltip] rukojmí tuto osobu: tvůj [recipient.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName]."
 char_interaction.0320.a: "[secondary_recipient.GetSheHe|U] se vrátil[Select_CString( secondary_recipient.IsFemale, 'a', '' )]!"
 char_interaction.0330.desc: "S radostí přijmu jako své rukojmí tuto osobu: tvůj [hostage_sender.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], [hostage.GetFirstName].\n\nTěším se na [hostage.GetHerHis] příjezd do [hostage_taker.GetCapitalLocation.GetNameNoTooltip]."
 char_interaction.0330.a: "Výborně."
 char_interaction.0331.desc: "Nezbývá mi než přijmout tvůj požadavek a vydat ti jako rukojmí tuto osobu: můj [hostage_sender.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], [hostage.GetFirstName].\n\n[hostage.GetSheHe|U] okamžitě vyrazí do [hostage_taker.GetCapitalLocation.GetNameNoTooltip]."
 char_interaction.0331.a: "Skvělé."
 char_interaction.0332.desc: "Musím přijmout tvůj návrh, abychom si jako rukojmí vyměnili mého [hostage_sender_2.Custom2('RelationToMeShort', SCOPE.sC('hostage_2'))], [hostage_2.GetTitledFirstName], a tvého [hostage_sender_1.Custom2('RelationToMeShort', SCOPE.sC('hostage_1'))], [hostage_1.GetTitledFirstName]."
 char_interaction.0332.a: "Dokonalé."
 char_interaction.0340.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 char_interaction.0340.desc: "Přijímám tvou žádost o návrat této osoby: tvůj [home_court.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], [hostage.GetFirstName].\n\nVěřím, že to nenaruší naše vztahy."
 char_interaction.0340.a: "Díky [ROOT.Char.GetFaith.HighGodNameAlternate]."
 char_interaction.0341.desc: "Obávám se, že si tuto osobu budu muset v [recipient.GetCapitalLocation.GetNameNoTooltip] ještě chvíli ponechat: tvůj [actor.Custom2('RelationToMeShort', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName]."
 char_interaction.0341.a: "Ten neotesanec..."
