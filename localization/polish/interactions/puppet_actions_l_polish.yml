 pam_interactions_events.0120.opening: "[CZReligionAdjDecline(recipient.GetFaith.GetReligion,'á')|U] hvězdo, [recipient.Custom('CZ_FirstName_V')],"
 pam_interactions_events.0120.desc_religious_head_actor: "Věru, od chvíle, kdy [recipient.GetFaith.CreatorName] přivádí na svět [Select_CString(recipient.IsFemale,'první ženu','prvního muže')], jsme nepoznali nikoho v úřadu [recipient.Custom('CZ_TitleAsName_G')], kdo by se ti vyrovnal! Jak poroučíš, je mi ctí poslechnout.\n\n"
 pam_interactions_events.0120.desc_religious_head_recipient: "Nemohu vést věřící bez pomoci. I já osobně, [recipient.GetTitleAsName], první mezi lidmi, které vede [recipient.GetFaith.HighGodName], musím ustoupit zvyklostem tohoto světa. Budu ti tedy pomáhat a poslouchat tě, ó [actor.Custom('CZ_TitleAsName_V')].\n\n"
 pam_interactions_events.0120.desc: "Služba duším je pro mne požehnáním, a mám ji vykonávat na příkaz, který mi dává [recipient.GetFaith.HighGodName] — i na tvůj? Vynasnažím se udělat vše, co bude v mých silách.\n\n"
 pam_interactions_events.0120.desc_lunacy: "Obávám se totiž, že má duše umírá... a útěchu mi nepřináší žádná rada kromě tvé...\n\n"
 pam_interactions_events.0120.desc_dread: "Zničme ty, které je třeba zničit: ty, kterým [recipient.GetFaith.HighGodName] odpírá svou přízeň... stejně jako mně.\n\n"
 pam_interactions_events.0120.desc_piety: "Neboť právě [recipient.GetFaith.HighGodName|U] nám dává svaté poslání!\n\n"
 pam_interactions_events.0120.desc_friendly: "Jsi pro mne [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))] a má láska k tobě i bezvýhradná důvěra mě provedou tím, co přijde.\n\n"
 pam_interactions_events.0120.desc_skill: "Pod tvým obratným vedením... očekávám účast na velkých činech.\n\n"
 pam_interactions_events.0120.outro: "Které z tvých modliteb mají dojít vyslyšení?"
 pam_interactions_events.0120.a: "Všechny mé modlitby, ó [recipient.Custom('CZ_TitleAsNameNoTooltip_V')]!"
 pam_interactions_events.0121.opening: "Ó [Select_CString(ROOT.Char.IsFemale,'ctihodná','ctihodný')] [ROOT.Char.Custom('CZ_TitleAsName_V')],"
 pam_interactions_events.0121.desc_honor: "Nyní odkládám pýchu spojenou s úřadem [recipient.Custom('CZ_TitleAsName_G')] [recipient.GetPrimaryTitle.Custom('CZ_Adjective_eeho')|l] panství a budu se věrně držet tvých rad.\n\n"
 pam_interactions_events.0121.desc: "[recipient.GetTitleAsName|U] [recipient.GetPrimaryTitle.Custom('CZ_Adjective_eeho')|l] panství sehraje svou roli ve tvých mocenských hrách a pomůže ti zasahovat do tohoto smrtelného světa.\n\n"
 pam_interactions_events.0121.desc_lunacy: "Je to tak, jak říkáš: můj dvůr je plný žvanilů a lhářů. Mé sny jsou temné. Jen tvá slova mi dávají smysl, jen tvé léky mohou uzdravit...\n\n"
 pam_interactions_events.0121.desc_dread: "Jsem zbraň vložená do tvé ruky. Bez pochybností, bez zábran.\n\n"
 pam_interactions_events.0121.desc_piety: "Zbav mě pochybností a ukaž mi, jak si mohu získat lásku, kterou dává [recipient.GetFaith.HighGodName]!\n\n"
 pam_interactions_events.0121.desc_friendly: "Jsi pro mne [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))] a vkládám v tebe všechnu důvěru. Přísahám, že tě nezklamu.\n\n"
 pam_interactions_events.0121.desc_skill: "Věřím, že budeš bedlivě sledovat záležitosti mého panství a nedovolíš mi selhat.\n\n"
 pam_interactions_events.0121.outro: "Pusťme se do tvých plánů."
 pam_interactions_events.0121.a: "I když zastává úřad [recipient.Custom('CZ_TitleAsNameNoTooltip_G')], slouží své církvi."
