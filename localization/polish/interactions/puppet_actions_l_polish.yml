 pam_interactions_events.0120.opening: "Náboženskému velikánovi [recipient.GetFaith.GetReligion.GetAdjective] [recipient.GetFirstName]," # todo: NEW TRANSLATION
 pam_interactions_events.0120.desc_religious_head_actor: "Vpravdě, od chvíle, kdy [recipient.GetFaith.CreatorName] stvořil prvního z [recipient.GetWomenMen], jsme nepoznali [recipient.GetTitleAsName] vašeho druhu! Je mi ctí poslouchat vaše rozkazy.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0120.desc_religious_head_recipient: "Věřící nemohu vést sám. I první z lidu [recipient.GetFaith.HighGodNamePossessive], [recipient.GetTitleAsName] [recipient.GetHerselfHimself], se musí podřídit běhu tohoto světa. Proto vám budu pomáhat a poslouchat vás, ó [actor.GetTitleAsName].\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0120.desc: "Své povinnosti se věnuji s požehnáním, neboť mám pečovat o duše na příkaz [recipient.GetFaith.HighGodNamePossessive] — i na váš? Budu se snažit udělat vše, co je v mých silách.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0120.desc_lunacy: "Obávám se totiž, že můj duch umírá... a útěchu mi přináší pouze vaše rada...\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0120.desc_dread: "Zničme ty, kdo musí být zničeni: ty, které [recipient.GetFaith.HighGodName] zavrhl... stejně jako [recipient.GetFaith.HighGodNameSheHe|U] zavrhl mě.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0120.desc_piety: "[recipient.GetFaith.HighGodName|U] [recipient.GetFaith.HighGodHerselfHimself|U] nám totiž vdechl svaté poslání!\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0120.desc_friendly: "Má láska k mé/mu [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], má naprostá důvěra mě provedou tím, co přijde.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0120.desc_skill: "Pod vaším schopným vedením... očekávám, že se budu podílet na velkých věcech.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0120.outro: "Které vaše modlitby mám vyslyšet?" # todo: NEW TRANSLATION
 pam_interactions_events.0120.a: "Všechny mé modlitby, ó [recipient.GetTitleAsNameNoTooltip]!" # todo: NEW TRANSLATION
 pam_interactions_events.0121.opening: "Ó ctihodný [ROOT.Char.GetTitleAsName]," # todo: NEW TRANSLATION
 pam_interactions_events.0121.desc_honor: "Tímto se vzdávám pýchy, kterou jsem choval jako [recipient.GetTitleAsName] z [recipient.GetPrimaryTitle.GetNameNoTier], a budu se pevně držet vašich rad.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0121.desc: "[recipient.GetTitleAsName] z [recipient.GetPrimaryTitle.GetNameNoTier] bude hrát svou roli ve vašich mocenských hrách a pomůže vám zasahovat do tohoto smrtelného světa.\n\n" # todo: NEW TRANSLATION, CHECK FORMAT
 pam_interactions_events.0121.desc_lunacy: "Jak říkáte: můj dvůr je plný žvanilů a lhářů. Mé sny jsou temné. Jen vaše slova mi dávají smysl, jen vaše léky mě mohou uzdravit...\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0121.desc_dread: "Jsem zbraň vložená do vaší ruky. Bez pochyb, bez skrupulí.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0121.desc_piety: "Zbavte mě pochybností a ukažte mi, jak si mohu získat lásku [recipient.GetFaith.HighGodNamePossessive]!\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0121.desc_friendly: "Má/můj [recipient.Custom2('RelationToMe', SCOPE.sC('actor'))], zcela vám důvěřuji a přísahám, že vás nezklamu.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0121.desc_skill: "Věřím, že když budete bedlivě dohlížet na záležitosti mé říše, nedopustíte, abych selhal.\n\n" # todo: NEW TRANSLATION
 pam_interactions_events.0121.outro: "Pusťme se do vašich plánů." # todo: NEW TRANSLATION
 pam_interactions_events.0121.a: "I když [recipient.GetSheHe] může být [recipient.GetTitleAsNameNoTooltip|U], [recipient.GetSheHe] slouží [recipient.GetHerHis] církvi." # todo: NEW TRANSLATION
