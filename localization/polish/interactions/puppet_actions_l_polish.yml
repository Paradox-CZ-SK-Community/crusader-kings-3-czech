 request_ecclesiastical_title_merger_interaction: "Požádat o sloučení duchovních titulů"
 request_ecclesiastical_title_merger_interaction_desc: "Požádej svou [Concept('head_of_faith','hlavu víry')|E], aby dovolila [Concept('clerical_region_possessive','církevní oblasti')|E] tvého [Concept('capital_possessive','hlavního sídla')|E] pohltit sousední oblast"
