 request_ecclesiastical_title_expansion_interaction_notification: "[target.GetNameNoTier] nemá duchovní vedení pro své věřící. Nechť jsou tyto země připojeny k mé arcidiecézi pro slávu, kterou požívá [actor.GetFaith.HighGodName]."
