 pardon_interaction: "Udělit milost"
 pardon_interaction_desc: "[recipient.GetName] je podle tebe zločinnou postavou ([recipient.GetImprisonmentReasons( actor.Self )]), takže můžeš tuto postavu kdykoli [Concept('imprison','uvěznit')|E] bez získání [Concept('tyranny','tyranie')|E].\n\nPokud však chceš, aby zůstala na svobodě, můžeš jí udělit milost. Tím odstraníš všechny důvody, které máš k jejímu uvěznění, a zvýšíš její [Concept('opinion','mínění')|E] o tobě."
 pardon_interaction_minister_desc: "[recipient.GetName] je podle [Select_CString(recipient.GetLiege.IsLocalPlayer,'tebe',recipient.GetLiege.Custom('CZ_ShortUIName_G'))] zločinnou postavou ([recipient.GetImprisonmentReasons( recipient.GetLiege.Self )]), takže můžeš tuto postavu kdykoli [Concept('imprison','uvěznit')|E] bez získání [Concept('tyranny','tyranie')|E].\n\nPokud však chceš, aby zůstala na svobodě, můžeš jí udělit milost. Tím odstraníš všechny důvody, které má [recipient.GetLiege.GetTitleAsNameNoTooltip] k jejímu uvěznění, a zvýšíš její [Concept('opinion','mínění')|E] o tobě."
