 pardon_interaction_desc: "Považuješ [recipient.GetName] za [Concept('criminal','zločince')|E] ([recipient.GetImprisonmentReasons( actor.Self )]), takže můžeš [recipient.GetName] kdykoli [Concept('imprison','uvěznit')|E], aniž bys získal [Concept('tyranny','tyranii')|E].\n\nPokud však dáváš přednost svobodě pro [recipient.GetName], můžeš udělit milost. Tím budou odstraněny veškeré důvody, které máš k [Concept('imprison','uvěznění')|E] [recipient.GetName], a zvýší se [Concept('opinion','mínění')|E] [recipient.GetName] o tobě."
 pardon_interaction_minister_desc: "[recipient.GetLiege.GetShortUIName] považuje [recipient.GetName] za [Concept('criminal','zločince')|E] ([recipient.GetImprisonmentReasons( recipient.GetLiege.Self )]), takže můžeš [recipient.GetName] kdykoli [Concept('imprison','uvěznit')|E], aniž bys získal [Concept('tyranny','tyranii')|E].\n\nPokud však dáváš přednost svobodě pro [recipient.GetName], můžeš udělit milost. Tím budou odstraněny veškeré důvody, které má [recipient.GetLiege.GetTitleAsNameNoTooltip] k [Concept('imprison','uvěznění')|E] [recipient.GetName], a zvýší se [Concept('opinion','mínění')|E] [recipient.GetName] o tobě."
