 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nNa důkaz našich obětí a úcty k [recipient.GetPrimaryTitle.GetNameNoTooltip] vás žádám, abyste tuto oddanost ocenil udělením [SCOPE.Custom('CelestialTributaryRequest')].\n\nKéž tato laskavost posílí harmonii mezi vaším trůnem a naším skromným královstvím." # todo: NEW TRANSLATION
