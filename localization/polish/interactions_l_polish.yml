 liege_offer_council_position_exchange: "\nRozhodl jsem, že je nutné přeuspořádat mou radu. S okamžitou platností budete místo toho sloužit jako můj [target.GetPositionName].\n"
 liege_offer_council_position_liked: "\n[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jste loajálním a oddaným poddaným a [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] bych vás za vaši službu odměnil.\n\nV uznání toho vám tímto nabízím pozici [target.GetPositionName] [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
 liege_offer_council_position_powerful: "\nJako [Select_CString(recipient.IsFemale,'vlivná','vlivná')] [recipient.GetTitleAsNameNoTooltip] je jen fér, abys [Select_CString(recipient.IsFemale,'měla','měl')] hlas v mé radě.\n\nV uznání toho ti tímto nabízím pozici [target.GetPositionName] ve [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
 liege_offer_council_position_disliked: "\nDospěl jsem k neodvratnému závěru, že jsi opravdu nejlepší kandidát, kterého mám na volné místo v mé radě.\n\nI když mě to mrzí, jsem bohužel nucen ti nabídnout pozici [target.GetPositionName] u [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
 liege_offer_council_position_skilled: "\nTvé značné talenty neunikly pozornosti, [recipient.GetFirstNameNoTooltip].\n\nV uznání tvých schopností bych ti [Select_CString(ROOT.Char.IsFemale,'ráda','rád')] nabídl pozici [target.GetPositionName] u [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
 liege_offer_council_position_fallback: "\nŠtěstěna se na tebe usmívá, [recipient.GetFirstNameNoTooltip], neboť potřebuji nového [target.GetPositionName] a ty jsi jediný kandidát, kterého mám k dispozici.\n\nVěřím, že práci přijmeš?\n"
