 CHARACTER_INTERACTION_TOGGLE_FAVORITE_OFF: "#T Odebrat z oblíbených\n#!Při příštím otevření tohoto seznamu se '[InteractionItem.GetName]' již nezobrazí mezi vašimi oblíbenými."
 CHARACTER_INTERACTION_CANT_CONTROL_MARRIAGE: "#T Zakázat sňatek\n#!#X [CHARACTER.GetUIName] je vládcem již $YEARS|V$ let a může se oženit na vlastní pěst#!"
 ASK_FOR_DIVORCE_NOTIFICATION: "Mé manželství s [secondary_recipient.GetShortUIName] očividně není požehnáno [actor.GetFaith.HighGodName]. Udělíte mi rozvod?"
 OFFER_RANSOM_PROPOSAL_PERSONAL: "Jsem ochoten(na) vás propustit, ale svoboda není zadarmo. Zvažte mou nabídku."
 OFFER_RANSOM_PROPOSAL: "Jsem ochoten(na) propustit [secondary_recipient.GetShortUIName] z mé péče, ale svoboda není zadarmo. Zvažte mou nabídku."
 PAY_RANSOM_PROPOSAL_PERSONAL: "Nemohu déle snášet toto vězení! Přijmete tuto nabídku za mou svobodu?"
 PAY_RANSOM_PROPOSAL: "[secondary_recipient.GetShortUIName|U] je mi drahý(á). Pustíte [secondary_recipient.GetHerHim] výměnou za tuto nabídku?"
 RELEASE_PRISONER_OFFER: "Ačkoliv jsem si [Select_CString(ROOT.Char.IsFemale,'užívala','užíval')] vaši společnost, [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')] jsem se vás propustit."
 RELEASE_PRISONER_OFFER_CONDITIONAL: "Jsem ochoten(na) vás propustit, ale ne bez podmínek..."
 HOUSE_HEAD_DEMAND_CONVERSION: "Jako hlava rodu vám musím skutečně nařídit, abyste přijali jedinou pravou víru: [actor.GetFaith.GetName]."
 CONVERT_TO_RELIGION: "[Select_CString(ROOT.Char.IsFemale,'Rozhodla','Rozhodl')] jsem se přijmout [recipient.GetFaith.GetName], jedinou pravou víru."
 LIEGE_DEMAND_CONVERSION: "Je čas opustit bludné cesty a přijmout jedinou pravou víru, [actor.GetFaith.GetName]!"
 GRANT_VASSAL_PROPOSAL: "Dobré zprávy! [Select_CString(ROOT.Char.IsFemale,'Rozhodla','Rozhodl')] jsem se udělat z [secondary_actor.GetFullName] vašeho vazala."
 RETRACT_VASSAL_PROPOSAL: "DospeI jsem k závěru, že pro blaho [secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip] musí být [recipient.GetFullName] umístěn jako vazal pod mou přímou autoritou."
 REVOKE_TITLE_PROPOSAL: "DospeI jsem k závěru, že vám nelze svěřit důstojnost a odpovědnost [landed_title.GetName]. Žádám vás proto, abyste tento titul okamžitě [Select_CString(ROOT.Char.IsFemale,'vzdala','vzdal')]."
 RELIGIOUS_HEAD_SEEK_INDULGENCES: "Snažím se být dobrým [actor.GetFaith.GetAdherentName], přesto občas klopýtám. [Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] bych [Select_CString(ROOT.Char.IsFemale,'darovala','daroval')] tento obnos církvi, abych [Select_CString(ROOT.Char.IsFemale,'odčinila','odčinil')] své prohřešky."
 RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE: "[Select_CString(ROOT.Char.IsFemale,'Uvědomila','Uvědomil')] jsem si své chyby a pokání za své hříchy žádám, abyste mi prosím [Select_CString(ROOT.Char.IsFemale,'zrušila','zrušil')] exkomunikaci, abych se [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] vrátit ke svým bratrům a sestrám ve víře."
 RELIGIOUS_HEAD_REQUEST_EXCOMMUNICATION: "[secondary_recipient.GetShortUIName|U] [Select_CString(secondary_recipient.IsFemale,'překročila','překročil')] hranici svými posledními skutky. Žádám vás, abyste ho/ji prosím [Select_CString(ROOT.Char.IsFemale,'exkomunikovala','exkomunikoval')], aby svět věděl, že jeho/její činy odsuzujeme."
 RELIGIOUS_HEAD_ASK_GOLD: "Jako věrný(á) [actor.GetFaith.GetAdherentName] mi chybějí prostředky k vykonávání dobrých skutků. Můžete mi prosím něco obětovat, abych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] vykonávat boží vůli?"
 RELIGIOUS_HEAD_ASK_CLAIM: "[secondary_recipient.GetShortUIName|U] neplní hodnoty naší víry a [actor.GetFaith.GetAdherentNamePlural] v [target.GetNameNoTier] tím trpí. Dáte mi požehnání osvobodit tyto země od jeho/jejího mylného panování?"
 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET: "I když je horlivost obdivuhodná, musíme být pragmatičtí, pokud chceme triumf naší víry. Nebylo by moudřejší učinit z [target.GetNameNoTier] cíl naší svaté války?"
 ASK_TO_TAKE_VOWS: "Myslím, že by bylo ve vašem nejlepším zájmu vstoupit do mnišského slibu. Nemohu vás k tomu donutit, ale opravdu byste o tom [Select_CString(ROOT.Char.IsFemale,'měla','měl')](a přemýšlet..."
 SEND_GIFT_PROPOSAL: "Přijměte prosím tento skromný dar. Není to mnoho, ale doufám, že bude užitečný. Na naše přátelství!"
 SEND_GIFT_ACCEPT: "Přijímám váš dar!"
 SEND_GIFT_REJECT: "Odmítám vaši milodar"
 call_ally.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 call_ally.0001.desc: "Žádám vás, abyste ctí naší [Concept('alliance','aliance')|E] a připojili se k [target.GetName]!" # todo: CONCEPT CASE
 call_ally.0001.a: "Do zbraně!"
 call_ally.0100.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 call_ally.0100.desc: "Samozřejmě se k vám do této války připojím! Naši nepřátelé se naučí bát [recipient.Custom('WomenMenPeople_GenderPreference')] z [recipient.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 call_ally.0101.desc: "Bohužel se nemohu do vašich válek zaplést."
 call_ally.0101.a: "Jaký [recipient.Custom2('InsultAdjective', ROOT.Char)] [recipient.Custom2('InsultNoun', ROOT.Char)]!"
 char_interaction.0001.opening: "[recipient.Custom2('AppropriateGreeting', actor )]"
 char_interaction.0001.desc: "Přijímám vaši laskavou nabídku vazalizace. Můj pane!"
 char_interaction.0002.desc: "Ochranu nepotřebuji a raději si ponechám bohatství svého království."
 char_interaction.0002.a: "Budu muset hledat jiné možnosti..."
 char_interaction.0010.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 char_interaction.0010.desc: "[actor.GetFirstName], myslím, že toto je začátek krásného vazalství!"
 char_interaction.0010.a: "Můj pane!"
 char_interaction.0011.desc: "I když si vážím vaší nabídky věrnosti, nemohu ji přijmout."
 char_interaction.0011.a: "To je škoda."
 char_interaction.0020.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 char_interaction.0020.desc: "Jako hlava dynastie vás tímto odvržuji a zbavuji dědických práv! Nezdědíte žádné tituly od žádného člena dynastie [actor.GetDynastyName]."
 char_interaction.0020.a: "Co? Proč!?"
 char_interaction.0030.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 char_interaction.0030.desc: "Jako hlava dynastie vám tímto obnovuji právo dědit tituly od členů dynastie [actor.GetDynastyName]!"
 char_interaction.0030.a: "Jsem vděčný(á)!"
 char_interaction.0040.desc: "Jako hlava dynastie vás tímto prohlašuji za hanebníka a ostudu celé dynastie [actor.GetDynastyName]!"
 char_interaction.0040.a: "Co? Proč!?"
 char_interaction.0041.desc: "[Select_CString(actor.IsFemale,'Tvoje','Tvůj')] [recipient.Custom2('InsultBehavior', SCOPE.sC('actor'))] a dekadentní chování přináší ostudu celému rodu [actor.GetHouse.GetBaseName] — a jako hlava rodu považuji za svou povinnost informovat zbytek klanu o tvých [recipient.Custom2('InsultAdjective', SCOPE.sC('actor'))] způsobech.\n\nNechť tě světlo [actor.GetFaith.HighGodNamePossessive] navede zpět na ctnostnou cestu... i když o tom pochybuji."
 char_interaction.0041.a: "Pomluva!"
 char_interaction.0042.desc: "Jste jak [recipient.Custom('FormalComplimentAdjective')], tak [recipient.Custom('ComplimentAdjective')], inspirace pro celou rodinu [actor.GetHouse.GetBaseName] — a jako hlava rodu je mojí povinností oslavovat vaše ctnosti před celým klanem!\n\nAť zůstanete v milosti [actor.GetFaith.HighGodNamePossessive]."
 char_interaction.0042.a: "Rozkošné!"
 char_interaction.0050.desc: "Jako hlava dynastie vám tímto odpouštím minulé přestupky a stahuji vaše odsouzení mezi členy dynastie [actor.GetDynastyName]!"
 char_interaction.0050.a: "Byla učiněna spravedlnost!"
 char_interaction.0060.desc: "Mně se [target.GetName] líbí, takže jako hlava dynastie jsem se [Select_CString(target.IsFemale,'rozhodla','rozhodl')] na něj uplatnit nárok. Učiňte si s tím, co chcete."
 char_interaction.0060.a: "Tohle nemůže být dobré."
 char_interaction.0070.opening: "[actor.Custom2('AppropriateGreeting', recipient )]"
 char_interaction.0070.desc: "Tyto vnitrodynastické boje jsou nevhodné a musí okamžitě skončit. Jako hlava dynastie tímto vyhlašuji bílý mír mezi vámi a vašimi nepřáteli v dynastii!"
 char_interaction.0070.a: "Jaký nesnesitelný podrazář!"
 char_interaction.0071.desc: "Tyto vnitrodynastické boje jsou nevhodné a musí okamžitě skončit. Jako hlava dynastie jsem [Select_CString(ROOT.Char.IsFemale,'nařídila','nařídil')], aby [recipient.GetFullName] [Select_CString(recipient.IsFemale,'přijala','přijal')] bílý mír s vámi."
 char_interaction.0071.a: "Jsem vděčný(á)!"
 char_interaction.0078.desc_them: "Vím, že jsme se domluvili, že [ward.GetTitledFirstName] bude [Select_CString(ward.IsFemale,'vychovávána','vychováván')] mnou, ale věc je taková... Jsem už [Select_CString(ROOT.Char.IsFemale,'zaneprázdněna','zaneprázdněn')] jinými vychovanci. Promiňte."
 char_interaction.0078.desc: "Vím, že jsme se domluvili, že [ward.GetTitledFirstName] bude [Select_CString(ward.IsFemale,'vychovávána','vychováván')] [guardian.GetTitledFirstName], ale věc je taková... [guardian.GetSheHe|U] má už plné ruce práce s jinými vychovanci. Promiňte."
 char_interaction.0078.a: "Ze všech urážek...!"
 char_interaction.0079.desc_them: "[Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že jsme se dohodli, že vy vychováte [ward.GetTitledFirstName], ale teď slyším, že máte plné ruce práce s jinými vychovanci?! Hanba."
 char_interaction.0079.desc: "[Select_CString(ROOT.Char.IsFemale,'Myslela','Myslel')] jsem, že jsme se dohodli, že [guardian.GetTitledFirstName] vychová [ward.GetTitledFirstName], ale teď slyším, že [guardian.GetSheHe] má plné ruce práce s jinými vychovanci?! Hanba."
 char_interaction.0079.a: "Možná jsem [Select_CString(ROOT.Char.IsFemale,'udělala','udělal')] chybu..."
 char_interaction.0080.desc: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] bych potěšen, kdyby [guardian.GetShortUINameNoFormat] vychovával mého [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))], [ward.GetShortUINameNoFormat] — urozené vychování pro urozeného ducha!"
 char_interaction.0080.desc_self: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] bych potěšen, kdybys vychovával mého [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))], [ward.GetShortUINameNoFormat] — urozené vychování pro urozeného ducha!"
 char_interaction.0080.desc_guardian_self_ward: "[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] tě budu vychovávat — urozené vychování pro urozeného ducha!"
 char_interaction.0080.desc_guardian_self: "[Select_CString(ROOT.Char.IsFemale,'Ráda','Rád')] vychovám vašeho [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))], [ward.GetShortUIName] — urozené vychování pro urozeného ducha!"
 char_interaction.0080.desc_guardian: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] bych potěšen, kdyby můj [guardian_liege.Custom2('RelationToMeShort', SCOPE.sC('guardian'))], [guardian.GetShortUINameNoFormat], vyučoval [ward.GetShortUINameNoFormat] — urozené vychování pro urozeného ducha!"
 char_interaction.0080.desc_ward_selfaccept: "Bude mi potěšením, když mě budete vzdělávat — ušlechtilé vychování pro ušlechtilého ducha!" # todo: NEW TRANSLATION
 char_interaction.0081.desc: "Bohužel navrhované uspořádání výchovy nám nevyhovuje."
 char_interaction.0081.a: "To je škoda."
 char_interaction.0082.t: "Můj mentor"
 char_interaction.0082.intro: "[guardian.GetTitledFirstName] konečně dorazil z [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], nese svazky a svitky."
 char_interaction.0082.desc.liege: "\n\n[guardian.GetSheHe|U] mi říká, že [ward.GetFirstNamePossessiveNoTooltip] lekce brzy začnou!"
 char_interaction.0082.desc: "\n\n[guardian.GetSheHe|U] mi říká, že mé lekce brzy začnou!"
 char_interaction.0082.a: "Výborně."
 char_interaction.0083.t: "Mysl k formování"
 char_interaction.0083.intro: "Mladý [ward.GetTitledFirstName],"
 char_interaction.0083.not_related: "[ward_liege.GetTitledFirstNamePossessive] [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))],"
 char_interaction.0083.related: "[Select_CString(SCOPE.sC('ward').IsFemale,'moje','můj')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))],"
 char_interaction.0083.outro: "konečně dorazil z [ward_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], aby se postaral o [Select_CString(ward.IsFemale,'její','jeho')] vzdělání."
 char_interaction.0083.desc.host: "\n\n[guardian.GetTitledFirstName] brzy zahájí [Select_CString(guardian.IsFemale,'její','jeho')] lekce."
 char_interaction.0083.desc: "\n\nJakmile se [ward.GetSheHe] usadí, lekce začnou."
 char_interaction.0083.a: "Výborně."
 char_interaction.0084.desc: "Váš [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))], [ward.GetTitledFirstName], bezpečně dorazil do [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip], a já zahájím [Select_CString(ward.IsFemale,'její','jeho')] lekce ihned."
 char_interaction.0084.a: "Velmi dobře."
 char_interaction.0090.from_ward.desc: "Obávám se, že mé vzdělání na vašem dvoře už mi nevyhovuje. Okamžitě se vracím do [capital.GetNameNoTierNoTooltip]."
 char_interaction.0090.two_wards.desc: "Obávám se, že výchova [ward.GetTitledFirstName] a [ward_2.GetTitledFirstName] na vašem dvoře již nevyhovuje našim potřebám. Jsou tímto povoláni zpět pod naši péči."
 char_interaction.0090.one_ward.desc: "Obávám se, že výchova [ward.GetTitledFirstName] na vašem dvoře již nevyhovuje našim potřebám. Je tímto [Select_CString(ward.IsFemale,'odvolána','odvolán')] zpět do naší péče."
 char_interaction.0090.a: "Mám se cítit uražen?"
 char_interaction.0100.desc: "Příteli, přijmi prosím tento pokorný dar jako výraz mého uznání."
 char_interaction.0100.a: "Vítaný přírůstek do mých pokladen!"
 char_interaction.0110.desc: "Tímto vám uděluji [landed_title.GetName], jeho hodnost, území a s tím spojené příjmy. Nechť jím dobře vládnete!"
 char_interaction.0110.a: "Má moc roste!"
 char_interaction.0111.desc: "Tímto vás jmenuji guvernérem [landed_title.GetName]. Prokažte, že jste hodný zástupce [actor.GetTitleAsNameNoTooltip] a dobře jím spravujte!"
 char_interaction.0120.desc: "Po pečlivém zvážení jsem se [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')] udělit vám post právoplatného dědice. Nezklamte mě, stále mohu změnit své rozhodnutí."
 char_interaction.0120.a: "To je správné!"
 char_interaction.0130.a: "Dobrý obchod."
 char_interaction.0131.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 char_interaction.0131.desc: "Považuji vaši nabídku za zcela nerozumnou. Udělejte to čestně a pusťte [secondary_recipient.GetShortUIName]."
 char_interaction.0131.desc_personal: "Raději zhniju ve vaší věznici, než abych [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] váš nepřijatelný výkup."
 char_interaction.0131.a: "Je čas snížit [Select_CString(recipient.IsFemale,'její','jeho')] příděly..."
 char_interaction.0140.desc: "Přijímám vaši nabídku výkupného. [secondary_recipient.GetShortUIName|U] vám bude neprodleně [Select_CString(secondary_recipient.IsFemale,'vrácena','vrácen')]!"
 char_interaction.0141.desc: "Vaše nabídka výkupného mne zcela nezaujala. Myslím, že si [secondary_recipient.GetShortUIName] prozatím ponechám."
 char_interaction.0141.a: "Ať je proklet ten [actor.Custom2('InsultAdjective', ROOT.Char)] [actor.Custom2('InsultNoun', ROOT.Char)]!"
 char_interaction.0150.desc: "Dobře, propustím vás, přiznávám však, že jsem si zvykl na vaši společnost."
 char_interaction.0151.desc: "Bojím se, že musím vaši nabídku na výkup odmítnout. Budete muset snášet mou pohostinnost o něco déle."
 char_interaction.0160.desc: "Nemám jinou možnost než přijmout vaše podmínky pro mé propuštění."
 char_interaction.0160.desc_demand_conversion: "Přestoupím na [actor.GetFaith.GetName]." # todo: NEW TRANSLATION
 char_interaction.0160.desc_renounce_claims: "Vzdám se všech svých nároků na vaše [recipient.Custom2('InsultAdjective', actor)] území." # todo: NEW TRANSLATION
 char_interaction.0160.desc_banish: "Odejdu a nikdy se nevrátím." # todo: NEW TRANSLATION
 char_interaction.0160.desc_gain_hook: "Budu vám zavázán." # todo: NEW TRANSLATION
 char_interaction.0160.desc_take_vows: "Připojím se k [recipient.Custom('NunMonkPlural')]." # todo: NEW TRANSLATION
 char_interaction.0160.desc_become_executioner: "Budu sloužit jako váš kat." # todo: NEW TRANSLATION
 char_interaction.0160.desc_recruit: "Připojím se k vašemu [recipient.Custom2('InsultAdjective', actor)] dvoru." # todo: NEW TRANSLATION
 char_interaction.0160.desc_demand_admin: "Stanu se součástí vaší [recipient.Custom2('InsultAdjective', actor)] správy." # todo: NEW TRANSLATION
 char_interaction.0160.a: "Sbohem, [recipient.GetFirstNameNoTooltip]..."
 char_interaction.0160.a.courtier: "Dávej si pozor na krok, [recipient.GetFirstNameNoTooltip]..."
 char_interaction.0161.desc: "Raději zhniju ve vaší věznici, než abych [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] vaše nepřijatelné požadavky."
 char_interaction.0170.t: "Těžké časy"
 char_interaction.0170.desc: "V časných ranních hodinách mě probudili dva neznámí strážci. Když mě vedli ven, neměl jsem žádné iluze o tom, co se chystá stát. Když klekám před [actor.GetShortUINamePossessive] katem, zažívám okamžik klidné a dokonalé jasnosti."
 char_interaction.0170.desc_burned: "Právě když jsem dokončil svůj chudý pokrm, dveře se s ránou otevřely a [Select_CString(ROOT.Char.IsFemale,'byla','byl')] jsem chycen a odvlečen ven. Nebude to snadná smrt — upalovací hranice je zapálena a už cítím žár na svých nohou. Dav ztichne, když spatří mé poslední chvíle s vyšinutými výrazy v tvářích."
 char_interaction.0170.desc_devoured: "Dveře se s ránou otevřely a [actor.GetShortUINamePossessive] stráže mě přitlačily k zemi a připoutaly. Pak [Select_CString(ROOT.Char.IsFemale,'vstoupila','vstoupil')] [actor.GetTitleAsNameNoTooltip] [actor.GetHerselfHimself], nůž v ruce a široký úsměv.\n\nBez ohledu na mé výkřiky [actor.GetSheHe] mi řeže maso nožem i zuby. Skrze mlhu vidím [Select_CString(actor.IsFemale,'její','jeho')] obličej pokrytý krví — pokrytý kousky #EMP mě#! — a prosím, ale když [actor.GetSheHe] žvýká a polyká s potěšením, uvědomuji si, že takto zemřu."
 char_interaction.0170.desc_public: "Na úsvitu mě hrubě probudí dva strážci a odvedou ven.\n\nKdyž mě vedou k vyvýšenému lešení uprostřed shromážděného davu, srdce mi klesá, a když se mi [actor.GetShortUINamePossessive] kat usmívá a zvedá [Select_CString(executioner.IsFemale,'její','jeho')] těžký meč, zoufám.\n\nDav ztichne, když se kat skloní nade mnou, kde jsem nucen klečet, a s chroptěním úsilí a téměř neslyšitým #EMP švihem#! vše potemní."
 char_interaction.0170.a: "Prokletá tvá černá duše, [actor.GetFirstNameNoTooltip]!!!"
 char_interaction.0170.life_is_just_a_joke.a: "Život #EMP je#! prostě vtip, že?"
 char_interaction.0180.desc: "Jako hlava rodu jsem [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')], že musíš přijmout [actor.GetFaith.GetName], jedinou pravou víru. Obávám se, že v této záležitosti nemáš na výběr."
 char_interaction.0180.desc.liege: "Jako váš vrchní pán požaduji, abyste [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')] svou falešnou víru a ihned se ke mně připojil jako [actor.GetFaith.GetAdherentName]."
 char_interaction.0180.a: "Myslím, že musím."
 char_interaction.0181.desc: "Velmi dobře, přijmu [actor.GetFaith.GetAdjective] víru, i když bude zvláštní opustit tolik známého."
 char_interaction.0182.desc: "Nikdy neopustím svou víru a místo toho založím vlastní dynastii!"
 char_interaction.0182.a: "Jak zklamující..."
 char_interaction.0190.desc: "Velmi dobře, přijmu [actor.GetFaith.GetAdjective] víru, i když bude zvláštní opustit tolik známého."
 char_interaction.0191.desc: "Má víra je jádrem mého bytí — nikdy ji neopustím."
 char_interaction.0200.desc: "Dospěl jsem k závěru, že vám nelze svěřit důstojnost a odpovědnost spojenou s [landed_title.GetName]. Proto vás tímto zbavuji tohoto titulu pro větší dobro říše."
 char_interaction.0200.a: "Nemohu tomu uvěřit!"
 char_interaction.0201.desc: "Titulu [landed_title.GetName] právem patří Dům [recipient.GetHouse.GetName]. Za žádných okolností se ho nevzdám."
 char_interaction.0201.a: "Jak si [recipient.GetSheHe] dovolí!"
 char_interaction.0199.desc: "Nevidím jinou možnost než se sklonit před vaším rozhodnutím zbavit mě titulu [landed_title.GetName]."
 char_interaction.0199.a: "Tak tedy."
 char_interaction.0211.desc: "Opravdu si vážím vaší velkorysé nabídky udělat z [secondary_recipient.GetShortUIName] mého vazala, ale obávám se, že musím odmítnout."
 char_interaction.0211.a: "Nevděčník!"
 char_interaction.0220.desc: "Přijímám vaše stažení mého vazala, [secondary_recipient.GetShortUIName], i když to považuji za nespravedlivé."
 char_interaction.0220.a: "Dobře."
 char_interaction.0221.desc: "Nemohu zradit věrnostní přísahu [secondary_recipient.GetShortUIName]. Budu chránit svého vazala, i kdyby to mělo znamenat porušení přísahy, kterou mám vůči vám."
 char_interaction.0221.a: "To je velezrada!"
 char_interaction.0230.title: "Odpadlík!"
 char_interaction.0230.desc.courtier: "[recipient.GetTitledFirstName] se podařilo uniknout zajetí a uprchl na venkov!"
 char_interaction.0230.desc.courtier_court_chaplain_stayed: "[recipient.GetTitledFirstName] se podařilo uniknout zajetí, a bylo by slabým vyjádřením říct, že je [recipient.GetSheHe] nespokojen(á) s mými činy."
 char_interaction.0230.a: "Zrádce!"
 char_interaction.0230.a_court_chaplain_stayed: "No to je... trapné."
 char_interaction.0231.title: "Spravedlnost"
 char_interaction.0231.desc_prison: "[recipient.GetTitledFirstName] [Select_CString(recipient.IsFemale,'byla zadržena','byl zadržen')] a čeká na svůj osud bezpečně [Select_CString(recipient.IsFemale,'uzamčena','uzamčen')] v mých kobkách."
 char_interaction.0231.desc_house_arrest: "Podle mých rozkazů má být nyní [recipient.GetTitledFirstName] [Select_CString(recipient.IsFemale,'uvězněna','uvězněn')] ve svém domě. Umístil jsem tam část svých stráží, aby zajistily, že [recipient.GetSheHe] dodrží domácí vězení."
 char_interaction.0231.desc_stockade: "Podle mých rozkazů má být nyní [recipient.GetTitledFirstName] [Select_CString(recipient.IsFemale,'zadržována','zadržován')] v vojenské palisádě, kde očekává svůj osud."
 char_interaction.0231.a: "Dobře."
 char_interaction.0232.desc: "Příliš dlouho jsem snášel ústrky z rukou [actor.GetTitledFirstName].\n\n"
 char_interaction.0232.liege: "Nehodlám přihlížet, zatímco náš vrchní pán zneužívá loajální vassaly [actor.GetHerHis]. Vyzývám tě, abys se ke mně přidal v boji o sesazení tohoto tyrana." # todo: NEW TRANSLATION
 char_interaction.0232.regent: "Nehodlám přihlížet, zatímco [actor.GetSheHe] zneužívá loajální vassaly [ceremonial_liege.GetTitledFirstNamePossessive]. Vyzývám tě, abys se ke mně přidal v boji o sesazení tohoto tyrana." # todo: NEW TRANSLATION
 char_interaction.0232.a: "Nebudeš stát sám!"
 char_interaction.0232.b: "Ty jsi zrádce!"
 char_interaction.0233.desc: "Z důvodu zločinů proti koruně jste tímto [Select_CString(ROOT.Char.IsFemale,'zatčena','zatčen')]."
 char_interaction.0233.a: "Cože!?! To je nehorázné!"
 marriage_interaction.0010.desc: "S radostí přijímám váš návrh na sňatek!"
 marriage_interaction.0010.b_desc: "S radostí přijímám váš návrh na zasnoubení!"
 marriage_interaction.0010.c_desc: "Přijímám váš návrh na sňatek."
 marriage_interaction.0010.d_desc: "Přijímám váš návrh na zasnoubení."
 marriage_interaction.0010.e_desc: "Já, [secondary_recipient.GetFirstName], s radostí přijímám vaši ruku v manželství!"
 marriage_interaction.0010.mid.a_desc: "\n\nVáš [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], a můj [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName], budou spojeni v [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
 marriage_interaction.0010.mid.a_no_acquaintance_desc: "\n\nVáš dvořan, [secondary_actor.GetFirstName], a můj [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName], budou spojeni v [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
 marriage_interaction.0010.mid.b_desc: "\n\nBudete spojeni s mým [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName], v [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
 marriage_interaction.0010.mid.c_desc: "\n\nS pokorou přijmu ruku vašeho [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], v [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
 marriage_interaction.0010.mid.c_no_acquaintance_desc: "\n\nS pokorou přijmu ruku vašeho dvořana, [secondary_actor.GetFirstName], v [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
 marriage_interaction.0010.mid.d_desc: "\n\nVáš [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], bude zasnouben s mým [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName]."
 marriage_interaction.0010.mid.e_desc: "\n\nBudete zasnoubeni s mým [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName]."
 marriage_interaction.0010.mid.f_desc: "\n\nS vděkem vezmu ruku vašeho [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], až nadejde čas."
 marriage_interaction.0010.mid.g_desc: "\n\nVáš [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], a já budeme ten nejlepší pár #EMP vůbec#!!"
 marriage_interaction.0010.mid.h_desc: "\n\nTy a já budeme ten nejlepší pár #EMP vůbec#!!"
 marriage_interaction.0010.gwedding.desc: "\n\nTěším se také na slíbenou [GetActivityType('activity_wedding').GetName]; snažte se mě nenechat zklamat."
