 char_interaction.0361.desc: "Tvé ubohé ponížené žadonění i skrovné dary jsou hluboko pod naši úroveň."
 char_interaction.0361.a: "Bojovná slova, na která jen tak nezapomenu."
 char_interaction.0362.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 char_interaction.0362.desc: "[actor.GetFirstName], veškeré bohatství, které dokáže [recipient.GetPrimaryTitle.GetName] shromáždit, bude zasvěceno tvé slávě!"
 char_interaction.0362.a: "Přijímám tvou velkorysou nabídku tributu."
