 char_interaction.0370.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient )]"
 char_interaction.0370.desc: "Rozhodl[Select_CString( actor.IsFemale, 'a', '' )] jsem se, že odvádění tributu už není v mém zájmu."
 char_interaction.0370.desc.herder: "Přesunul[Select_CString( recipient.IsFemale, 'a', '' )] ses daleko od místa, kde jsem tě naposledy nalezl[Select_CString( actor.IsFemale, 'a', '' )], a proto ti již nemohu odvádět tribut."
 char_interaction.0370.a: "Kéž [actor.GetShortUINameNoTooltip] nenajde pomoc, až se štěstěna odvrátí."
 char_interaction.0370.a.herder: "Mé panství mělo zůstat pohromadě."
 char_interaction.0370.b: "Pak postavu [actor.GetShortUINameNoTooltip] #EMP přimějeme#! zaplatit!"
 char_interaction.0380.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient )]"
 char_interaction.0380.desc: "Už ti nechci poskytovat ochranu. Své ubohé dary mi již nemusíš odvádět."
 char_interaction.0380.a: "Zajímalo by mě, co zamýšlí..."
