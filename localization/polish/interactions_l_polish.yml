 court_amenities_interactions.0001.t: "Obvinění z porušení zákona proti přepychu!"
 court_amenities_interactions.0001.desc_intro: "Když se ve svém obvyklém oděvu procházím chodbami [debate_locale.GetNameNoTierNoTooltip], náhle mi nezastoupí cestu nikdo jiný než [actor.GetTitledFirstName]!\n\nPrstem mě tvrdě bodne do hrudi."
 court_amenities_interactions.0001.desc_byzantine: "„Jak si můžeš myslet, že smíš nosit purpur? Této cti se dostává pouze #EMP mé#! rodině! Okamžitě jej svlékni!“"
 court_amenities_interactions.0001.desc_court_position: "„Tomuhle říkáš oděv hodný titulu [recipient.GetTitleAsNameNoTooltip]? Vypadáš jako blázen! Okamžitě se svlékni, nebo zavolám stráže!“"
 court_amenities_interactions.0001.desc.nakey: "„Ačkoli je třeba oslavovat tělo ve všech jeho podobách, alespoň o sebe můžeš pečovat! Jak dlouho ses nekoupal[Select_CString( recipient.IsFemale, 'a', '' )]?“"
 court_amenities_interactions.0001.desc: "„Za koho se vůbec považuješ, že se promenáduješ v tom směšném oděvu? Tohle je královský dvůr, ne nevěstinec! Běž a najdi si něco skromnějšího!“"
 court_amenities_interactions.0001.desc_outro: "\n\n[actor.GetTitledFirstName|U] mě obvinil[Select_CString( actor.IsFemale, 'a', '' )] z porušení [actor.GetPrimaryTitle.GetAdjective] zákonů proti přepychu. Této společenské poskvrny se jen tak nezbavím, ale v disputaci mohu postavu [actor.GetTitledFirstNameNoTooltip] ještě překonat! Možná dokonce vysoudit odškodnění..."
 court_amenities_interactions.0001.a: "„A co to vlastně máš na sobě TY?“"
 court_amenities_interactions.0001.a.tt_success: "#positive_value Úspěšně obhájíš svou volbu oděvu#!"
 court_amenities_interactions.0001.a.tt_failure: "#negative_value Tvé argumenty o odívání příliš neobstojí#!"
 court_amenities_interactions.0001.b: "Zaplatím za to svou důstojností..."
 court_amenities_interactions.0001.b.tt: "$religious_interaction.2400.b.tt$"
 court_amenities_interactions.0002.t: "Disputace o módě"
 court_amenities_interactions.0002.desc_intro: "Museli jsme celé hodiny stát a přít se o pravidlech správné péče o zevnějšek a odívání, prudce po sobě gestikulovat a dovolávat se starobylých zákonů, o nichž podle všeho věděl jen málokdo u dvora. Když se kouř tohoto divadla rozptýlil,"
 court_amenities_interactions.0002.desc_won.nakey: "ukázalo se, že jsem zvítězil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]!\n\n[actor.GetName] proto musel[Select_CString( actor.IsFemale, 'a', '' )] obléct šaty prostého člověka a skrýt své hanebně zanedbané tělo před světem."
 court_amenities_interactions.0002.desc_won: "ukázalo se, že jsem zvítězil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]!\n\n[recipient.GetName] se proto musel[Select_CString( recipient.IsFemale, 'a', '' )] svléknout až do spodního prádla! Všichni přítomní u dvora spatřili [Select_CString( recipient.IsFemale, 'ji', 'ho' )] přesně tak, jak [Select_CString( recipient.IsFemale, 'ji', 'ho' )] stvořil [ROOT.Char.GetFaith.CreatorName]!"
 court_amenities_interactions.0002.desc_lost.nakey: "S úžasem zjišťuji, že zákon skutečně porušuji!\n\nPoprvé v životě se stydím za tělo, které mi dal [ROOT.Char.GetFaith.CreatorName]. Právě když začínám svou nahotu vnímat jako neslušnou, přistupují ke mně strážní a oděvníci, aby mě oblékli do špinavých hadrů prostého lidu."
 court_amenities_interactions.0002.desc_lost: "S úžasem zjišťuji, že zákon skutečně porušuji!\n\nStrážní a oděvníci z [debate_locale.GetNameNoTierNoTooltip] ze mě přede všemi stahují oděv až na spodní prádlo, ale ani tam nepřestanou! Zcela odhalen[Select_CString( ROOT.Char.IsFemale, 'á', 'ý' )] před celým dvorem s hanbou prchám."
 court_amenities_interactions.0002.a_won: "Ha! To byla ale taškařice!"
 court_amenities_interactions.0002.a_lost.humble: "Jen ať se dívají. Nemám se za co stydět."
 court_amenities_interactions.0002.a_lost.lustful: "Této pocty se obvykle dostává jen mým milencům."
 court_amenities_interactions.0002.a_lost: "Už se možná nikdy neukážu na veřejnosti."
 court_amenities_interactions.0003.desc_won.nakey: "ukázalo se, že jsem zvítězil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]!\n\n[actor.GetName] proto musel[Select_CString( actor.IsFemale, 'a', '' )] obléct šaty prostého člověka a skrýt své hanebně zanedbané tělo před světem."
 court_amenities_interactions.0003.desc_won: "ukázalo se, že jsem zvítězil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]!\n\n[actor.GetName] se proto musel[Select_CString( actor.IsFemale, 'a', '' )] svléknout až do spodního prádla! Všichni přítomní u dvora spatřili [Select_CString( actor.IsFemale, 'ji', 'ho' )] přesně tak, jak [Select_CString( actor.IsFemale, 'ji', 'ho' )] stvořil [ROOT.Char.GetFaith.CreatorName]!"
