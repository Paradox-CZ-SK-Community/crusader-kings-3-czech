 FORCE_VOTE_INTERACTION_NOTIFICATION: "[Select_CString(ROOT.Char.IsFemale,'Rozhodla','Rozhodl')] jsem se využít svůj vliv nad vámi a přinutit vás hlasovat pro mého zvoleného nástupce v příštích volbách."
 FORCE_JOIN_FACTION_NOTIFICATION: "[Select_CString(ROOT.Char.IsFemale,'Rozhodla','Rozhodl')] jsem se využít svůj vliv nad vámi a přinutit vás připojit se k mé frakci."
 OFFER_FEALTY_INTERACTION_NOTIFICATION: "Pokorně prosím, abyste [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] mou přísahu věrnosti jako mého nového lenního pána."
 BECOME_TRIBUTARY_INTERACTION_NOTIFICATION: "Pokorně žádám, abyste [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] můj tribut a [Select_CString(ROOT.Char.IsFemale,'stala','stal')] se mým novým svazovníkem."
 DEMAND_TRIBUTARY_INTERACTION_NOTIFICATION: "Vaše říše potřebuje ochranu. Jako váš nový svazovník bych poskytl bezpečí, výměnou za tribut od [recipient.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..."
 OFFER_TRIBUTARY_STATUS_INTERACTION_NOTIFICATION: "Přijď, uzři světlo a přidej se k mému shromáždění zbožných tributářů. Společně učiníme tento svět lepším." # todo: NEW TRANSLATION
 REQUEST_ARREST_NOTIFICATION_TEXT: "Tímto jste [Select_CString(ROOT.Char.IsFemale,'zatčena','zatčen')] pro zločiny proti koruně."
 REQUEST_VOWS_NOTIFICATION_TEXT: "Žádá se, abyste [Select_CString(ROOT.Char.IsFemale,'opustila','opustil')] své postavení na dvoře a [Select_CString(ROOT.Char.IsFemale,'přijala','přijal')] sliby."
 CHARACTER_INTERACTION_ALLOWED_TO_MARRY: "Povolit sňatek"
 CHARACTER_INTERACTION_ALLOW_MARRIAGE: "#T Povolit sňatek\n#!#I Kliknutím povolíte, aby se [CHARACTER.GetUIName] [Select_CString(CHARACTER.IsFemale,'oženila','oženil')] na vlastní pěst#!"
 CHARACTER_INTERACTION_DISALLOW_MARRIAGE: "#T Zakázat sňatek\n#!#I Kliknutím zabráníte, aby se [CHARACTER.GetUIName] [Select_CString(CHARACTER.IsFemale,'oženila','oženil')] na vlastní pěst#!"
 CHARACTER_INTERACTION_TOGGLE_FAVORITE: "[SelectLocalization( InteractionItem.IsFavorite, 'CHARACTER_INTERACTION_TOGGLE_FAVORITE_OFF', 'CHARACTER_INTERACTION_TOGGLE_FAVORITE_ON' )]"
