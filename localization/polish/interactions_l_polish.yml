 ASK_FOR_DIVORCE_NOTIFICATION: "Mé manželství s postavou [secondary_recipient.GetShortUIName] zjevně nemá požehnání [actor.GetFaith.HighGodName]. Udělíš mi rozvod?"
 OFFER_RANSOM_PROPOSAL_PERSONAL: "Jsem ochoten[Select_CString( actor.IsFemale, 'ochotna', 'ochoten' )] propustit tě ze své péče, ale svoboda není zadarmo. Zvaž mou nabídku."
 OFFER_RANSOM_PROPOSAL: "Jsem ochoten[Select_CString( actor.IsFemale, 'ochotna', 'ochoten' )] propustit postavu [secondary_recipient.GetShortUIName] ze své péče, ale svoboda není zadarmo. Zvaž mou nabídku."
 PAY_RANSOM_PROPOSAL_PERSONAL: "Už toto věznění déle nesnesu! Přijmeš tuto nabídku výměnou za mou svobodu?"
 PAY_RANSOM_PROPOSAL: "Na postavě [secondary_recipient.GetShortUIName|U] mi záleží. Propustíš [Select_CString( secondary_recipient.IsFemale, 'ji', 'ho' )] výměnou za tuto nabídku?"
 RELEASE_PRISONER_OFFER: "Tvůj pobyt u mě byl příjemný, ale rozhodnutí padlo. Propouštím tě."
 RELEASE_PRISONER_OFFER_CONDITIONAL: "Jsem ochoten[Select_CString( actor.IsFemale, 'ochotna', 'ochoten' )] propustit tě z vězení, avšak nikoli bezpodmínečně..."
 HOUSE_HEAD_DEMAND_CONVERSION: "Jako hlava tvého rodu musím požadovat, abys přijal[Select_CString( recipient.IsFemale, 'a', '' )] jedinou pravou víru [actor.GetFaith.GetName]."
 CONVERT_TO_RELIGION: "Přijímám [recipient.GetFaith.GetName] jako jedinou pravou víru."
 LIEGE_DEMAND_CONVERSION: "Nastal čas, abys opustil[Select_CString( recipient.IsFemale, 'a', '' )] své bludné cesty a přijal[Select_CString( recipient.IsFemale, 'a', '' )] jedinou pravou víru [actor.GetFaith.GetName]!"
 GRANT_VASSAL_PROPOSAL: "Dobré zprávy! Rozhodl[Select_CString( actor.IsFemale, 'a', '' )] jsem se, že [secondary_actor.GetFullName] bude [Select_CString( secondary_actor.IsFemale, 'tvou vazalkou', 'tvým vazalem' )]."
 RETRACT_VASSAL_PROPOSAL: "Dospěl[Select_CString( actor.IsFemale, 'a', '' )] jsem k závěru, že v zájmu titulu [secondary_actor.GetPrimaryTitle.GetNameNoTierNoTooltip] musí být [recipient.GetFullName] převeden[Select_CString( recipient.IsFemale, 'a', '' )] pod mou přímou svrchovanost."
 REVOKE_TITLE_PROPOSAL: "Dospěl[Select_CString( actor.IsFemale, 'a', '' )] jsem k závěru, že ti nelze nadále svěřovat důstojnost a odpovědnost spojenou s titulem [landed_title.GetName]. Proto požaduji, abys mi tento titul neprodleně odevzdal[Select_CString( recipient.IsFemale, 'a', '' )]."
 RELIGIOUS_HEAD_SEEK_INDULGENCES: "Ačkoli se snažím být řádným [actor.GetFaith.GetAdherentName], stále čas od času selhávám. Proto chci tuto sumu zlata darovat církvi jako odčinění svých poklesků."
 RELIGIOUS_HEAD_DECLARATION_OF_REPENTANCE: "Uznávám své pochybení a lituji svých provinění. Žádám tě proto o zrušení mé exkomunikace, abych se mohl[Select_CString( actor.IsFemale, 'a', '' )] navrátit mezi své bratry a sestry ve víře."
 RELIGIOUS_HEAD_REQUEST_EXCOMMUNICATION: "Poslední provinění postavy [secondary_recipient.GetShortUIName|U] překročilo všechny meze. Žádám tě, abys [Select_CString( secondary_recipient.IsFemale, 'ji', 'ho' )] exkomunikoval[Select_CString( recipient.IsFemale, 'a', '' )] a dal[Select_CString( recipient.IsFemale, 'a', '' )] tak světu najevo, že [Select_CString( secondary_recipient.IsFemale, 'její', 'jeho' )] jednání odsuzujeme."
 RELIGIOUS_HEAD_ASK_GOLD: "Ačkoli jsem [actor.GetFaith.GetAdherentName], nedostatek prostředků mi brání konat dobré skutky. Můžeš mi nějaké poskytnout, abych mohl[Select_CString( actor.IsFemale, 'a', '' )] naplňovat božskou vůli?"
 RELIGIOUS_HEAD_ASK_CLAIM: "[secondary_recipient.GetShortUIName|U] dostatečně nectí hodnoty naší víry a [actor.GetFaith.GetAdherentNamePlural] v [target.GetNameNoTier] kvůli tomu trpí. Udělíš mi své požehnání, abych mohl[Select_CString( actor.IsFemale, 'a', '' )] tyto země osvobodit od [Select_CString( secondary_recipient.IsFemale, 'její', 'jeho' )] pomýlené vlády?"
 RELIGIOUS_HEAD_ASK_HOLY_WAR_TARGET: "Horlivost je sice chvályhodná, ale chceme-li, aby naše víra zvítězila, musíme jednat také pragmaticky. Nebylo by moudřejší učinit cílem naší svaté války [target.GetNameNoTier]?"
 ASK_TO_TAKE_VOWS: "Domnívám se, že vstup do řeholního společenství je v tvém nejlepším zájmu. Nemohu tě k tomu přinutit, ale měl[Select_CString( recipient.IsFemale, 'a', '' )] bys to vážně zvážit..."
 SEND_GIFT_PROPOSAL: "Přijmi prosím tento skromný dar. Není toho mnoho, ale doufám, že ti poslouží. Na naše trvalé přátelství!"
 SEND_GIFT_ACCEPT: "Přijímám tvůj dar!"
 SEND_GIFT_REJECT: "Tvou almužnu odmítám"
 call_ally.0001.opening: "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 call_ally.0001.desc: "Vyzývám tě ke splnění závazků plynoucích z našeho [Concept('alliance','spojenectví')|E] a k účasti ve válce [target.GetName]!"
 call_ally.0001.a: "Do zbraně!"
 call_ally.0100.opening: "[recipient.Custom2('AppropriateGreeting', ROOT.Char)]"
 call_ally.0100.desc: "Samozřejmě se k tobě v této válce připojím! Naši nepřátelé poznají, že [recipient.Custom('WomenMenPeople_GenderPreference')] z [recipient.GetPrimaryTitle.GetNameNoTierNoTooltip] budí hrůzu!"
 call_ally.0101.desc: "Bohužel nejsem v postavení, které by mi dovolovalo zaplést se do tvých válek."
 call_ally.0101.a: "To je ale [recipient.Custom2('InsultAdjective', ROOT.Char)] [recipient.Custom2('InsultNoun', ROOT.Char)]!"
 char_interaction.0001.opening: "[recipient.Custom2('AppropriateGreeting', actor )]"
 char_interaction.0001.desc: "Přijímám tvou velkorysou nabídku vazalství, [Select_CString( actor.IsFemale, 'má lenní paní', 'můj lenní pane' )]!"
 char_interaction.0002.desc: "Tvou ochranu nepotřebuji a bohatství svého panství si raději ponechám."
 char_interaction.0002.a: "Budu muset zvážit jiné možnosti..."
 char_interaction.0010.opening: "[recipient.Custom2('AppropriateGreetingPositive', actor )]"
 char_interaction.0010.desc: "[actor.GetFirstName], myslím, že toto je počátek krásného vazalského vztahu!"
 char_interaction.0010.a: "[Select_CString( recipient.IsFemale, 'Má lenní paní', 'Můj lenní pane' )]!"
 char_interaction.0011.desc: "Ačkoli si tvé nabídky lenní věrnosti vážím, nemohu ji přijmout."
 char_interaction.0011.a: "To je škoda."
 char_interaction.0020.opening: "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 char_interaction.0020.desc: "Jako hlava dynastie se tě tímto zříkám a vyděďuji tě! Nezdědíš žádný titul po žádném členu dynastie [actor.GetDynastyName]."
 char_interaction.0020.a: "Cože? Proč!?"
 char_interaction.0030.opening: "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 char_interaction.0030.desc: "Jako hlava dynastie tímto obnovuji tvé právo dědit tituly po členech dynastie [actor.GetDynastyName]!"
 char_interaction.0030.a: "Jsem vděčn[Select_CString( recipient.IsFemale, 'á', 'ý' )]!"
 char_interaction.0040.desc: "Jako hlava dynastie tě tímto označuji za zkaženou osobu a hanbu celé dynastie [actor.GetDynastyName]!"
 char_interaction.0040.a: "Cože? Proč!?"
 char_interaction.0041.desc: "Tvé [recipient.Custom2('InsultBehavior', SCOPE.sC('actor'))] a zhýralé chování vrhají hanbu na celý rod [actor.GetHouse.GetBaseName]. Jako hlava rodu považuji za svou povinnost zpravit celý rod o tvých [recipient.Custom2('InsultAdjective', SCOPE.sC('actor'))] způsobech.\n\nKéž tě [actor.GetFaith.HighGodNamePossessive] světlo přivede zpět na cestu ctnosti... ačkoli o tom pochybuji."
 char_interaction.0041.a: "Pomluvy!"
 char_interaction.0042.desc: "Jsi [recipient.Custom('FormalComplimentAdjective')] i [recipient.Custom('ComplimentAdjective')] a jsi vzorem pro celý rod [actor.GetHouse.GetBaseName]. Jako hlava rodu považuji za svou povinnost vychválit tvé ctnosti před celým rodem!\n\nKéž nad tebou i nadále spočívá [actor.GetFaith.HighGodNamePossessive] milost."
 char_interaction.0042.a: "Skvělé!"
 char_interaction.0050.desc: "Jako hlava dynastie ti tímto odpouštím dřívější prohřešky a odvolávám tvé odsouzení před členy dynastie [actor.GetDynastyName]!"
 char_interaction.0050.a: "Spravedlnosti bylo učiněno zadost!"
 char_interaction.0060.desc: "[target.GetName] se mi docela zamlouvá, a tak jsem se jako hlava tvé dynastie rozhodl[Select_CString( actor.IsFemale, 'a', '' )] vznést na něj nárok. Nalož s touto zprávou, jak uznáš za vhodné."
 char_interaction.0060.a: "To nevěstí nic dobrého."
 char_interaction.0070.opening: "[actor.Custom2('AppropriateGreeting', recipient )]"
 char_interaction.0070.desc: "Tyto vnitřní boje v dynastii [actor.GetDynastyName] jsou nedůstojné a musí okamžitě skončit. Jako hlava dynastie tímto vyhlašuji bílý mír mezi tebou a tvými nepřáteli z dynastie!"
 char_interaction.0070.a: "Nesnesitelné vměšování!"
 char_interaction.0071.desc: "Tyto vnitřní boje v dynastii [actor.GetDynastyName] jsou nedůstojné a musí okamžitě skončit. Jako hlava dynastie jsem přikázal[Select_CString( actor.IsFemale, 'a', '' )] postavě [recipient.GetFullName], aby s tebou uzavřela bílý mír."
 char_interaction.0071.a: "Jsem vděčn[Select_CString( ROOT.Char.IsFemale, 'á', 'ý' )]!"
 char_interaction.0078.desc_them: "Vím, že jsme se dohodli, že budu vychovávat postavu [ward.GetTitledFirstName], jenže... už mám plné ruce práce s jinými svěřenci. Omlouvám se."
 char_interaction.0078.desc: "Vím, že jsme se dohodli, že postavu [ward.GetTitledFirstName] bude vychovávat [guardian.GetTitledFirstName], jenže... [guardian.GetSheHe|U] už má plné ruce práce s jinými svěřenci. Omlouvám se."
 char_interaction.0078.a: "Taková urážka...!"
 char_interaction.0079.desc_them: "Dohodli jsme se, že budeš vychovávat postavu [ward.GetTitledFirstName], a teď se doslýchám, že máš plné ruce práce s jinými svěřenci?! Styď se."
 char_interaction.0079.desc: "Dohodli jsme se, že postavu [ward.GetTitledFirstName] bude vychovávat [guardian.GetTitledFirstName], a teď se doslýchám, že [guardian.GetSheHe] má plné ruce práce s jinými svěřenci?! Hanba."
 char_interaction.0079.a: "Možná to byla chyba..."
 char_interaction.0080.desc: "S radostí svěřím postavě [guardian.GetShortUINameNoFormat] výchovu postavy [ward.GetShortUINameNoFormat] ([ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))]). Ušlechtilé duši náleží ušlechtilá výchova!"
 char_interaction.0080.desc_self: "S radostí ti svěřím výchovu postavy [ward.GetShortUINameNoFormat] ([ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))]). Ušlechtilé duši náleží ušlechtilá výchova!"
 char_interaction.0080.desc_guardian_self_ward: "S radostí se ujmu tvé výchovy. Ušlechtilé duši náleží ušlechtilá výchova!"
 char_interaction.0080.desc_guardian_self: "S radostí se ujmu výchovy postavy [ward.GetShortUIName] ([ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))]). Ušlechtilé duši náleží ušlechtilá výchova!"
 char_interaction.0080.desc_guardian: "S radostí svěřím postavě [guardian.GetShortUINameNoFormat] ([guardian_liege.Custom2('RelationToMeShort', SCOPE.sC('guardian'))]) výchovu postavy [ward.GetShortUINameNoFormat]. Ušlechtilé duši náleží ušlechtilá výchova!"
 char_interaction.0080.desc_ward_selfaccept: "S radostí ti svěřím svou výchovu. Ušlechtilé duši náleží ušlechtilá výchova!"
 char_interaction.0081.desc: "Tvůj návrh na uspořádání výchovy nám bohužel nevyhovuje."
 char_interaction.0081.a: "Taková škoda."
 char_interaction.0082.t: "Můj nový poručník"
 char_interaction.0082.intro: "Z [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] ke mně konečně přichází [guardian.GetTitledFirstName] s nákladem svazků a svitků."
 char_interaction.0082.desc.liege: "\n\n[ward.GetFirstNamePossessiveNoTooltip] lekce prý brzy začnou!"
 char_interaction.0082.desc: "\n\nMé lekce prý brzy začnou!"
 char_interaction.0082.a: "Výborně."
 char_interaction.0083.t: "Mysl k utváření"
 char_interaction.0083.intro: "Mlad[Select_CString( ward.IsFemale, 'á', 'ý' )] [ward.GetTitledFirstName],"
 char_interaction.0083.not_related: "[ward_liege.GetTitledFirstNamePossessive] [ward_liege.Custom2('RelationToMeShort', SCOPE.sC('ward'))],"
 char_interaction.0083.related: "[Select_CString( ward.IsFemale, 'má', 'můj' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))],"
 char_interaction.0083.outro: "konečně přichází z [ward_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] za vzděláním."
 char_interaction.0083.desc.host: "\n\n[guardian.GetTitledFirstName] brzy zahájí výuku."
 char_interaction.0083.desc: "\n\nJakmile se [ward.GetSheHe] zabydlí, výuka začne."
 char_interaction.0083.a: "Skvělé."
 char_interaction.0084.desc: "[Select_CString( ward.IsFemale, 'Tvá', 'Tvůj' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('ward'))], [ward.GetTitledFirstName], bezpečně dorazil[Select_CString( ward.IsFemale, 'a', '' )] do [guardian_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] a já ihned zahájím [Select_CString( ward.IsFemale, 'její', 'jeho' )] výuku."
 char_interaction.0084.a: "Výborně."
 char_interaction.0090.from_ward.desc: "Obávám se, že vzdělávání na tvém dvoře již nevyhovuje mým potřebám. Ihned se vracím do [capital.GetNameNoTierNoTooltip]."
 char_interaction.0090.two_wards.desc: "Obávám se, že vzdělávání postav [ward.GetTitledFirstName] a [ward_2.GetTitledFirstName] na tvém dvoře již nevyhovuje našim potřebám. Tímto je povolávám zpět do naší péče."
 char_interaction.0090.one_ward.desc: "Obávám se, že vzdělávání postavy [ward.GetTitledFirstName] na tvém dvoře již nevyhovuje našim potřebám. Tímto [Select_CString( ward.IsFemale, 'ji', 'ho' )] povolávám zpět do naší péče."
 char_interaction.0090.a: "Je to snad urážka?"
 char_interaction.0100.desc: "Příteli, přijmi prosím tento skromný dar jako výraz mé vděčnosti."
 char_interaction.0100.a: "Vítaná posila mé pokladny!"
 char_interaction.0110.desc: "Tímto ti uděluji titul [landed_title.GetName], jeho hodnost, příslušné území i související příjmy. Vládni mu dobře!"
 char_interaction.0110.a: "Má moc roste!"
 char_interaction.0111.desc: "Tímto ti svěřuji správu titulu [landed_title.GetName]. Kéž se při zastupování [actor.GetTitleAsNameNoTooltip] osvědčíš a spravuješ jej dobře!"
 char_interaction.0120.desc: "Po náležité úvaze jsem se rozhodl[Select_CString( actor.IsFemale, 'a', '' )] určit tě svým zákonným dědicem. Nezklam mě, neboť na změnu názoru ještě není pozdě."
 char_interaction.0120.a: "Tak je to správně!"
 char_interaction.0130.a: "Dobrá dohoda."
 char_interaction.0131.opening: "[recipient.Custom2('AppropriateGreetingNegative', actor )]"
 char_interaction.0131.desc: "Tvou nabídku považuji za naprosto nepřiměřenou. Zachovej se čestně a propusť postavu [secondary_recipient.GetShortUIName]."
 char_interaction.0131.desc_personal: "Raději shniji ve tvém žaláři, než abych přijal[Select_CString( recipient.IsFemale, 'a', '' )] tvou nepřiměřenou nabídku výkupného."
 char_interaction.0131.a: "Je načase zkrátit [Select_CString( recipient.IsFemale, 'její', 'jeho' )] příděly..."
 char_interaction.0140.desc: "Přijímám tvou nabídku výkupného. [secondary_recipient.GetShortUIName|U] se k tobě neprodleně vrátí!"
 char_interaction.0141.desc: "Tvá nabídka výkupného je žalostně nízká. Postavu [secondary_recipient.GetShortUIName] si prozatím ponechám."
 char_interaction.0141.a: "Proklínám toho [actor.Custom2('InsultAdjective', ROOT.Char)] [actor.Custom2('InsultNoun', ROOT.Char)]!"
 char_interaction.0150.desc: "Nuže dobrá, propustím tě, ačkoli musím přiznat, že mi tvá společnost přirostla k srdci."
 char_interaction.0151.desc: "Obávám se, že tvou nabídku výkupného musím odmítnout. Budeš muset mou pohostinnost snášet ještě o něco déle."
 char_interaction.0160.desc: "Nezbývá mi než přijmout tvé podmínky pro mé propuštění."
 char_interaction.0160.desc_demand_conversion: "Přestoupím k [actor.GetFaith.GetName]."
 char_interaction.0160.desc_renounce_claims: "Vzdám se všech svých nároků na tvou [recipient.Custom2('InsultAdjective', actor)] zemi."
 char_interaction.0160.desc_banish: "Odejdu a nikdy se nevrátím."
 char_interaction.0160.desc_gain_hook: "Budu ti zavázán[Select_CString( recipient.IsFemale, 'a', '' )]."
 char_interaction.0160.desc_take_vows: "Mou novou společností budou [recipient.Custom('NunMonkPlural')]."
 char_interaction.0160.desc_become_executioner: "Budu ti sloužit jako kat."
 char_interaction.0160.desc_recruit: "Vstoupím na tvůj [recipient.Custom2('InsultAdjective', actor)] dvůr."
 char_interaction.0160.desc_demand_admin: "Stanu se součástí tvé [recipient.Custom2('InsultAdjective', actor)] správy."
 char_interaction.0160.a: "Sbohem, [recipient.GetFirstNameNoTooltip]..."
 char_interaction.0160.a.courtier: "Dávej si pozor, [recipient.GetFirstNameNoTooltip]..."
 char_interaction.0161.desc: "Raději shniji ve tvém žaláři, než abych přijal[Select_CString( recipient.IsFemale, 'a', '' )] tvé nepřiměřené požadavky."
 char_interaction.0170.t: "Těžká chvíle"
 char_interaction.0170.desc: "V časných ranních hodinách mě probudí dva neznámí strážní. Když mě odvádějí ven, nedělám si žádné iluze o tom, co bude následovat. Ve chvíli, kdy klečím před [actor.GetShortUINamePossessive] katem, zakouším okamžik pokojné a dokonalé jasnosti."
 char_interaction.0170.desc_burned: "Sotva dojím své skrovné jídlo, dveře se rozletí a strážní mě popadnou a hrubě vyvlečou ven. Nečeká mě snadná smrt... Hranice již hoří a na nohou cítím její žár. Dav náhle ztichne a s vyšinutými výrazy ve tvářích sleduje mé poslední chvíle."
 char_interaction.0170.desc_devoured: "Dveře se rozletí a [actor.GetShortUINamePossessive] strážní mě srazí na zem a pevně přitisknou k podlaze. Poté vstoupí [actor.GetTitleAsNameNoTooltip] [Select_CString( actor.IsFemale, 'sama', 'sám' )], s nožem v ruce a širokým úsměvem.\n\nNedbá mých výkřiků a nožem i zuby se zařezává do mého masa. V mrákotách spatřím tvář zalitou krví a pokrytou kusy #EMP mého vlastního těla#!. Prosím o slitování, ale když pak s požitkem žvýká a polyká, dochází mi, že právě takto zemřu."
 char_interaction.0170.desc_public: "Za rozbřesku mě hrubě probudí dva strážní a vyvlečou ven.\n\nKdyž mě vedou k vyvýšenému popravišti uprostřed shromážděného davu, svírá se mi srdce. [actor.GetShortUINamePossessive] kat se na mě usmívá a potěžkává svůj těžký meč, zatímco mě zachvacuje zoufalství.\n\nDav ztichne. Kat nade mnou stojí, zatímco mě nutí pokleknout, a po namáhavém zavrčení a téměř neslyšném #EMP zasvištění#! vše pohltí tma."
 char_interaction.0170.a: "Proklínám tvou černou duši, [actor.GetFirstNameNoTooltip]!!!"
 char_interaction.0170.life_is_just_a_joke.a: "Život #EMP je#! jen žert, že?"
 char_interaction.0180.desc: "Jako hlava tvého rodu ti přikazuji přijmout [actor.GetFaith.GetName], jedinou pravou víru. Obávám se, že v této věci nemáš na vybranou."
 char_interaction.0180.desc.liege: "[Select_CString( actor.IsFemale, 'Jako tvá lenní paní', 'Jako tvůj lenní pán' )] požaduji, abys okamžitě opustil[Select_CString( recipient.IsFemale, 'a', '' )] svou falešnou víru a připojil[Select_CString( recipient.IsFemale, 'a', '' )] se ke mně jako [actor.GetFaith.GetAdherentName]."
 char_interaction.0180.a: "Zřejmě musím."
 char_interaction.0181.desc: "Nuže dobrá, přijmu [actor.GetFaith.GetName], ačkoli bude zvláštní opustit tolik důvěrně známých věcí."
 char_interaction.0182.desc: "Svou víru nikdy neopustím. Raději založím vlastní rod!"
 char_interaction.0182.a: "Jaké zklamání..."
 char_interaction.0190.desc: "Nuže dobrá, přijmu [actor.GetFaith.GetName], ačkoli bude zvláštní opustit tolik důvěrně známých věcí."
 char_interaction.0191.desc: "Má víra je samotným jádrem mého bytí... Nikdy ji neopustím."
 char_interaction.0200.desc: "Dospěl[Select_CString( actor.IsFemale, 'a', '' )] jsem k závěru, že ti nelze nadále svěřovat důstojnost a odpovědnost spojenou s titulem [landed_title.GetName]. Proto tě v zájmu celého panství tohoto titulu zbavuji."
 char_interaction.0200.a: "Tomu nemohu uvěřit!"
 char_interaction.0201.desc: "Titul [landed_title.GetName] právem náleží rodu [recipient.GetHouse.GetName]. Za žádných okolností se jej nevzdám."
 char_interaction.0201.a: "Jak se [Select_CString( recipient.IsFemale, 'ona', 'on' )] opovažuje!"
 char_interaction.0199.desc: "Nezbývá mi než se podrobit tvému rozhodnutí zbavit mě titulu [landed_title.GetName]."
 char_interaction.0199.a: "Tak je to správně."
 char_interaction.0211.desc: "Velmi si vážím tvé velkorysé nabídky učinit postavu [secondary_recipient.GetShortUIName] [Select_CString( secondary_recipient.IsFemale, 'mou vazalkou', 'mým vazalem' )], obávám se však, že ji musím odmítnout."
 char_interaction.0211.a: "Nevděk!"
 char_interaction.0220.desc: "Souhlasím s tím, že mi odebíráš [Select_CString( secondary_recipient.IsFemale, 'mou vazalku', 'mého vazala' )] [secondary_recipient.GetShortUIName], ačkoli to považuji za nespravedlivé."
 char_interaction.0220.a: "Dobře."
 char_interaction.0221.desc: "Nemohu zradit přísahu lenní věrnosti, kterou mi složil[Select_CString( secondary_recipient.IsFemale, 'a', '' )] [secondary_recipient.GetShortUIName]. Budu [Select_CString( secondary_recipient.IsFemale, 'svou vazalku', 'svého vazala' )] chránit, i kdybych tím měl[Select_CString( recipient.IsFemale, 'a', '' )] porušit přísahu, kterou jsem složil[Select_CString( recipient.IsFemale, 'a', '' )] tobě."
 char_interaction.0221.a: "To je velezrada!"
 char_interaction.0230.title: "Na útěku!"
 char_interaction.0230.desc.courtier: "Postavě [recipient.GetTitledFirstName] se podařilo uniknout zajetí a uprchnout na venkov!"
 char_interaction.0230.desc.courtier_court_chaplain_stayed: "Postavě [recipient.GetTitledFirstName] se podařilo uniknout zajetí a [Select_CString( recipient.IsFemale, 'ona', 'on' )] dává velmi jasně najevo nelibost nad mým jednáním."
 char_interaction.0230.a: "Zrádce!"
 char_interaction.0230.a_court_chaplain_stayed: "Tohle je... trapné."
 char_interaction.0231.title: "Spravedlnost"
 char_interaction.0231.desc_prison: "[recipient.GetTitledFirstName] byl[Select_CString( recipient.IsFemale, 'a', '' )] dopaden[Select_CString( recipient.IsFemale, 'a', '' )] a nyní bezpečně zamčen[Select_CString( recipient.IsFemale, 'a', '' )] v mých žalářích očekává svůj osud."
 char_interaction.0231.desc_house_arrest: "Podle mých rozkazů je [recipient.GetTitledFirstName] nyní držen[Select_CString( recipient.IsFemale, 'a', '' )] ve svém domově. Několik mých strážných dohlíží, aby dodržoval[Select_CString( recipient.IsFemale, 'a', '' )] podmínky domácího vězení."
 char_interaction.0231.desc_stockade: "Podle mých rozkazů je [recipient.GetTitledFirstName] nyní uvězněn[Select_CString( recipient.IsFemale, 'a', '' )] v kládě, kde očekává svůj osud."
 char_interaction.0231.a: "Dobře."
 char_interaction.0232.desc: "Příliš dlouho snáším potupu z rukou postavy [actor.GetTitledFirstName].\n\n"
 char_interaction.0232.liege: "Nebudu nečinně přihlížet, jak náš lenní pán zneužívá své věrné vazaly. Vyzývám tě, abys se ke mně připojil[Select_CString( recipient.IsFemale, 'a', '' )] v boji za sesazení tohoto tyrana."
 char_interaction.0232.regent: "Nebudu nečinně přihlížet, jak [Select_CString( actor.IsFemale, 'ona', 'on' )] zneužívá věrné vazaly postavy [ceremonial_liege.GetTitledFirstName]. Vyzývám tě, abys se ke mně připojil[Select_CString( recipient.IsFemale, 'a', '' )] v boji za sesazení tohoto tyrana."
 char_interaction.0232.a: "Nebudeš bojovat sám[Select_CString( recipient.IsFemale, 'a', '' )]!"
 char_interaction.0232.b: "Zrádcem jsi ty!"
 char_interaction.0233.desc: "Za zločiny proti Koruně tě tímto zatýkám."
 char_interaction.0233.a: "Cože!?! To je nehoráznost!"
 marriage_interaction.0010.desc: "S radostí přijímám tvou nabídku sňatku!"
 marriage_interaction.0010.b_desc: "S radostí přijímám tvou nabídku zasnoubení!"
 marriage_interaction.0010.c_desc: "Přijímám tvou nabídku sňatku."
 marriage_interaction.0010.d_desc: "Přijímám tvou nabídku zasnoubení."
 marriage_interaction.0010.e_desc: "Já, [secondary_recipient.GetFirstName], s radostí přijímám tvou ruku a vstupuji s tebou do manželství!"
 marriage_interaction.0010.mid.a_desc: "\n\nTvůj [actor.Custom2('RelationToMe', SCOPE.sC('secondary_actor'))], [secondary_actor.GetFirstName], a můj [recipient.Custom2('RelationToMe', SCOPE.sC('secondary_recipient'))], [secondary_recipient.GetFirstName], budou spojeni v [secondary_actor.Custom('GetCulturallyAppropriateMarriageReference')]."
