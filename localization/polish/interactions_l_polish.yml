 char_interaction.0250.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nLituji, že vám musím oznámit, že jsem se [Select_CString(ROOT.Char.IsFemale,'rozhodla','rozhodl')] zvýšit vaše smluvní povinnosti.\n\nJistě chápete mou situaci – [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] zoufale potřebuje ochranu, a váš příspěvek je k tomu zásadní.\n\nA navíc mi #emphasis opravdu dlužíte!#!"
 char_interaction.0250.a: "Zdá se, že nemám na výběr..."
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\n[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jsem vám dobrým vazalem, ale jistě chápete, že mám také své vlastní poddané!\n\nMoje současná smlouva je velmi omezující, jistě byste uznal moudrost v jejím uvolnění?\n\nA navíc mi #emphasis opravdu dlužíte!#!"
