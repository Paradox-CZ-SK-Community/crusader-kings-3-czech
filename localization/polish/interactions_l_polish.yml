 char_interaction.0250.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nMrzí mě, že ti musím oznámit své rozhodnutí zvýšit tvé smluvní povinnosti.\n\nJistě chápeš mou svízelnou situaci. [actor.GetPrimaryTitle.GetNameNoTierNoTooltip] nutně potřebuje ochranu a tvůj příspěvek v ní hraje zásadní úlohu.\n\nA kromě toho mi #emphasis něco dlužíš!#!"
 char_interaction.0250.a: "Zdá se, že nemám příliš na vybranou..."
 char_interaction.0251.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nMé vazalské služby byly vždy příkladné, ale jistě chápeš, že i já mám vlastní poddané!\n\nMá současná smlouva je velmi svazující. Jistě uznáš, že by bylo moudré její podmínky zmírnit.\n\nA kromě toho mi #emphasis něco dlužíš!#!"
 char_interaction.0253.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nRozhodl[Select_CString( actor.IsFemale, 'a', '' )] jsem se změnit typ správy titulu [recipient.GetPrimaryTitle.GetNameNoTooltip].\n\nToto rozhodnutí slouží vyššímu dobru [actor.GetPrimaryTitle.GetNameNoTierNoTooltip].\n"
 char_interaction.0253.a: "Převezmu své nové povinnosti."
 char_interaction.0252.desc: "[actor.Custom2('PositiveSupplimentaryGreeting', recipient)]\nS ohledem na naše dary a úctu vůči [recipient.GetPrimaryTitle.GetNameNoTooltip] tě za tuto oddanost žádám o [SCOPE.Custom('CelestialTributaryRequest')].\n\nKéž tato přízeň posílí soulad mezi tvým trůnem a naším skromným panstvím."
 char_interaction.0252.a: "Otevřu ti přístup k našim tržištím."
 char_interaction.0252.b: "Ano, tvá dynastie prokázala, že je hodna spojit se s mou."
 char_interaction.0252.c: "Jen dokud mi zachováš věrnost coby [recipient.GetTitleTierName]!"
