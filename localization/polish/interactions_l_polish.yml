 char_interaction.0261.desc: "Z moci, kterou mi svěřil[Select_CString( intermediary.IsFemale, 'a', '' )] [intermediary.GetTitledFirstName], tě tímto zbavuji neoprávněné vlády nad titulem [landed_title.GetName]. S okamžitou platností mi jej odevzdáš do úschovy jménem Koruny."
 char_interaction.0261.a: "To je nehorázné zneužití moci!"
 char_interaction.0262.desc: "[intermediary.GetTitledFirstName] se o tom dozví, ale $char_interaction.0199.desc$ "
 char_interaction.0262.a: "Už o tom ví."
 char_interaction.0263.desc: "Nejsi [intermediary.GetTitleAsNameNoTooltip] a já se tvým malicherným rozmarům nepodřídím. Chceš-li titul [landed_title.GetName], budeš si jej muset vzít silou."
 char_interaction.0263.result.criminal: "Pokud [actor.GetShortUINameNoTooltip] [Select_CString(actor.IsLocalPlayer, 'ustoupíš', 'ustoupí' )]"
 char_interaction.0263.result.war: "Pokud [actor.GetShortUINameNoTooltip] [Select_CString(actor.IsLocalPlayer, 'prosadíš', 'prosadí' )] nárok"
 char_interaction.0263.a: "Pak tedy jde o zradu."
 char_interaction.0263.a.tt: "Tvé zločiny budou oznámeny postavě [intermediary.GetTitledFirstName]"
 char_interaction.0263.b: "Myslíš, že blafuji? Do války!"
 char_interaction.0271.desc: "Z moci úřadu, který mi svěřil[Select_CString( intermediary.IsFemale, 'a', '' )] [intermediary.GetTitledFirstName], napravuji několik drobných nesrovnalostí v hranicích panství.\n\nPřikazuji ti předat svrchovanost nad postavou [intermediary.GetTitledFirstName] její právoplatné lenní vrchnosti. Tedy mně."
 char_interaction.0271.a: "Nemohu odmítnout, ale kdybych #EMP mohl#!..."
 char_interaction.0272.desc: "Překračuješ meze své pravomoci, ale nemohu se vzepřít úřadu svého [intermediary.GetTitleAsName], i když jej vykonáváš právě #EMP ty#!.\n\nSouhlasím s tím, že mi odebíráš vazala."
 char_interaction.0272.a: "Nikdy jsi neměl[Select_CString( recipient.IsFemale, 'a', '' )] na vybranou, [recipient.GetFirstNameNoTooltip]."
 char_interaction.0273.desc: "Přísahal[Select_CString( recipient.IsFemale, 'a', '' )] jsem chránit své vazaly, a to i před řáděním takových, jako jsi #EMP ty#!.\n\nPostavu [intermediary.GetTitledFirstName] i její země mi můžeš vyrvat v boji, nebo se můžeš odplazit zpět do nějaké díry, kde se k tobě nehlásí ani [recipient.GetFaith.random_GoodGodNames]."
 char_interaction.0273.result.criminal: "$char_interaction.0263.result.criminal$"
 char_interaction.0273.result.war: "$char_interaction.0263.result.war$"
 char_interaction.0273.a: "Toho budeš litovat, [recipient.GetFirstNameNoTooltip]."
 char_interaction.0273.a.tt: "$char_interaction.0263.a.tt$"
 char_interaction.0273.b: "Jak #EMP milé#! pozvání!"
 char_interaction.0281.desc: "Z moci úřadu, který mi svěřil[Select_CString( intermediary.IsFemale, 'a', '' )] [intermediary.GetTitledFirstName], tě zatýkám pro podezření z nekalých činů.\n\nVzdej se mým vojákům, jinak poneseš následky."
 char_interaction.0281.a: "Nemám na vybranou."
 char_interaction.0282.desc: "Na rozdíl od mého jednání jsou tvé požadavky zločinné.\n\nV zájmu panství se podrobím, ale věz, že na tuto urážku nezapomenu."
 char_interaction.0282.a: "Kde jsi získal[Select_CString( recipient.IsFemale, 'a', '' )] dojem, že chci, abys #EMP zapomněl#!?"
 char_interaction.0283.desc: "Vydat se ti na milost? To sotva. Chceš-li mě uvrhnout do vězení, budeš si pro mě muset přijít osobně.\n\nKdyž však naléháš, možná za tebou #EMP přijdu#!... dovolíš-li mi přivést pár #EMP přátel#!."
 char_interaction.0283.a: "Jednou toho budeš litovat."
 char_interaction.0283.a.tt: "$char_interaction.0263.a.tt$"
 char_interaction.0283.b: "Myslím, že ti to nedošlo. Toto nebyla žádost."
 char_interaction.0291.desc.positive: "Samozřejmě ti důvěřuji, že budeš zastupovat mé zájmy, ale tentokrát ses zmýlil[Select_CString( actor.IsFemale, 'a', '' )]. [recipient.GetTitledFirstName] je věrným a ceněným poddaným, proto svou pozornost zaměř jinam."
 char_interaction.0291.desc.negative: "Dokážeš vůbec udělat #EMP něco#! správně? I ten nejzabedněnější prosťáček v celé zemi by poznal, že [recipient.GetTitledFirstName] si tvou pozornost nezaslouží. Přestaň šikanovat lepší vazaly a konečně dělej svou práci."
 char_interaction.0291.desc.neutral: "V současnosti není v mém zájmu tento krok povolit. Věřím, že tomu rozumíš a jinak budeš i nadále vládnout mým jménem důstojně."
 char_interaction.0291.a: "Má lenní vrchnost jistě ví nejlépe."
 char_interaction.0291.b: "Drzý spratku!"
 char_interaction.0291.c: "Slintající hlupáku!"
 char_interaction.0291.d: "Senilní idiote!"
 char_interaction.0291.e: "[Select_CString( intermediary.IsFemale, 'Tuhle ženskou', 'Toho chlapa' )]. #EMP Nenávidím.#!"
 char_interaction.0291.f: "Ten #EMP bastard#!."
 char_interaction.0291.g: "Doufám, že ve svém vězení shniješ!"
 char_interaction.0291.h: "Příště už mi jistě nezabrání..."
