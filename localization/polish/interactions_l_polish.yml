 FORCE_VOTE_INTERACTION_NOTIFICATION: "Rozhodl[Select_CString( actor.IsFemale, 'a', '' )] jsem se využít svého vlivu nad tebou a přinutit tě, abys v příští volbě hlasoval[Select_CString( recipient.IsFemale, 'a', '' )] pro mnou vybraného nástupce."
 FORCE_JOIN_FACTION_NOTIFICATION: "Rozhodl[Select_CString( actor.IsFemale, 'a', '' )] jsem se využít svého vlivu nad tebou a přinutit tě, abys vstoupil[Select_CString( recipient.IsFemale, 'a', '' )] do mé frakce."
 OFFER_FEALTY_INTERACTION_NOTIFICATION: "Pokorně tě žádám, abys přijal[Select_CString( recipient.IsFemale, 'a', '' )] mou přísahu lenní věrnosti a stal[Select_CString( recipient.IsFemale, 'a', '' )] se [Select_CString( recipient.IsFemale, 'mou novou lenní paní', 'mým novým lenním pánem' )]."
 BECOME_TRIBUTARY_INTERACTION_NOTIFICATION: "Pokorně tě žádám, abys přijal[Select_CString( recipient.IsFemale, 'a', '' )] můj tribut a ujal[Select_CString( recipient.IsFemale, 'a', '' )] se nade mnou svrchovanosti."
 DEMAND_TRIBUTARY_INTERACTION_NOTIFICATION: "Tvé panství zjevně potřebuje ochranu. Jako [Select_CString( actor.IsFemale, 'tvá nová suzerénka', 'tvůj nový suzerén' )] ti poskytnu potřebné bezpečí výměnou za tribut z [recipient.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]..."
 OFFER_TRIBUTARY_STATUS_INTERACTION_NOTIFICATION: "Pojď, spatři světlo a připoj se k mému společenství oddaných tributářů. Společně činíme tento svět lepším."
 REQUEST_ARREST_NOTIFICATION_TEXT: "Tímto tě zatýkám za zločiny proti Koruně."
 REQUEST_VOWS_NOTIFICATION_TEXT: "Žádám tě, abys opustil[Select_CString( recipient.IsFemale, 'a', '' )] svůj dvorský úřad a složil[Select_CString( recipient.IsFemale, 'a', '' )] řeholní sliby."
