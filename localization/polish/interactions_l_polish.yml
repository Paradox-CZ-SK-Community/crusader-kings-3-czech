 marriage_interaction.0010.ending.a_desc: "\n\nNechť [recipient.GetFaith.HighGodName] obdaří je dlouhým životem a mnoha dětmi!"
 marriage_interaction.0010.ending.a_actor_desc: "\n\nNechť [recipient.GetFaith.HighGodName] obdaří vás dlouhým životem a mnoha dětmi!"
 marriage_interaction.0010.ending.a_recipient_desc: "\n\nNechť [recipient.GetFaith.HighGodName] obdaří nás dlouhým životem a mnoha dětmi!"
 marriage_interaction.0010.ending.a_both_desc: "\n\nNechť [recipient.GetFaith.HighGodName] obdaří nás dlouhým životem a mnoha dětmi, můj [secondary_actor.Custom('ComplimentAdjective')] [secondary_actor.Custom('WifeHusband')]!"
