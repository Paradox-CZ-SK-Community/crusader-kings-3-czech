 end_war_attacker_victory_attacker_desc: "\nVšem je jasné, že vítězství patří mně. Proč se dále vzpírat? Přijmout svůj osud s důstojností má svou čest."
 end_war_attacker_victory_defender_desc: "\nVítězství je tvé. Již se nedokážu dále bránit, a proto se vzdávám tobě i tvým armádám. Jen mi ponech mou důstojnost."
 end_war_attacker_white_peace_attacker_desc: "\nNyní je mi jasné, že útok na tebe byl chybou. V této válce již bylo prolito dost krve. Ukončeme tento nesmyslný boj."
 end_war_attacker_white_peace_defender_desc: "\nCož už v této tvé nesmyslné válce nebylo prolito dost krve? Pokračováním v boji ani jeden z nás nic nezíská. Uzavřeme mír."
 end_war_attacker_defeat_attacker_desc: "\nNevím, co mě vedlo k přesvědčení, že se v boji mohu postavit tak obávanému nepříteli, jako jsi ty. Minulost již změnit nemohu, pouze budoucnost.\n\nVzdávám se ti. Zanechme tento konflikt za sebou."
 end_war_attacker_defeat_defender_desc: "\nMožná jsi věřil, že mě porazíš, ale ukázalo se, jak ses mýlil[Select_CString( actor.IsFemale, 'a', '' )]. Neztěžuj tuto situaci více, než je nutné. Vzdej se a ukončeme tuto válku."
