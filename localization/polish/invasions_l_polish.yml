l_polish:
 almohad.1001.t: "Vzestup Almohadů"
 almohad.1001.desc: "Zdá se, že [almohad_county.GetName] se stává ohniskem okrajového náboženského učení. Hnutí si říká Almohadé a hlásá, že je třeba očistit Maghreb od kacířů a pomýlených.\n\nMístní hodnostáři mají obavy, ale cožpak může okrajová náboženská skupina vedená zdiskreditovaným teologem představovat skutečnou hrozbu?"
 almohad.1001.a: "Proč by mě to mělo znepokojovat?"
 almohad.1001.a.flavor: "Co kdy nějaká okrajová náboženská skupina v provinciích způsobila někomu potíže?"
 almohad.1001.b: "Vykořeňme je, než stačí zapustit kořeny..."
 almohad.1001.b.conversion_tt: "Pokud už pracuješ na změně místní víry v [almohad_county.GetName], volbou této možnosti můžeš přijít o dosažený pokrok!"
 almohad.1001.player_warning: "@warning_icon! #X Pokud se ti nepodaří dost rychle odvrátit místní obyvatele od dosavadního vyznání ([masmudi.GetName]), povstanou Almohadé. Buď připraven.#!"
 almohad.1002.desc: "Náboženské hnutí známé jako Almohadé vyrazilo ze svého sídla s úmyslem „získat Maghreb zpět z rukou nevěřících“, třeba i silou!\n\nJejich vůdce [ibn_tumart.GetTitledFirstName] se kdysi nedostal do řady center vzdělanosti, protože byl — upřímně řečeno — nesnesitelně zarputilý v prosazování dogmatických zásad. Nyní však stojí v čele pevného jádra stoupenců a prohlašuje se za nikoho menšího než Mahdího!"
 almohad.1002.a: "Jako by tento ubohý [ibn_tumart.GetFaith.PriestNeuter] mohl představovat nějakou hrozbu!"
 almohad.1002.a.target.tt: "Almohadé proti tobě vytáhnou do války!"
 almohad.1002.a.not_target.tt: "Almohadé vytáhnou do války proti tvému lennímu pánovi!"
 almohad.1002.b: "[ibn_tumart.GetTitledFirstName] má vlastně několik velmi dobrých argumentů."
 almohad.1002.b.flavor: "Sotva se mohu nazývat skutečně oddaným věřícím..."
 almohad.1003.desc: "Zakladatel Almohadů [ibn_tumart.GetTitledFirstName] již není mezi živými, a tak by člověk doufal, že spolu s ním vejde do dějin i jeho hnutí. Kéž bychom měli takové štěstí.\n\nMísto toho povstal nový vůdce! [al_mumin.GetTitledFirstName] nejenže udržuje kmeny pohromadě, ale získává pro svou věc #EMP ještě více#! lidí!"
 almohad.1003.a: "Těch fanatiků snad nikdy neubude!"
 almohad.1003.a.tt: "Almohadé se vracejí silnější než kdy dřív."
 almohad.1004.t: "Ovládnutí Marrákeše"
 almohad.1004.desc: "Kdysi zde vzniklo hlavní město říše. Nyní je [marrakesh.GetTitle] po právu v mých rukou. Stále však nese nesčetné stopy, které zde zanechal [old_faith.GetName] a mí souvěrci ([masmudi.GetName]) touží, abych město přetvořil podle svých představ.\n\nByla by škoda zničit tolik dokonale zachovalých paláců a chrámů, ale možná je to nutná cena za naplnění mého cíle přinést Maghrebu osvícení."
 almohad.1004.a: "Stane se naším novým hlavním městem!"
 almohad.1004.b: "Postavme nové, ještě velkolepější město!"
 almohad.1004.c: "Možná to přece jen není nejmoudřejší cesta..."
