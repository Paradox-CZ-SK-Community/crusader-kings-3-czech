l_polish:
 court_jester_prefix: "Dvorní šašek: "
 jester.100.t: "$court_jester_prefix$[Select_CString( jester.IsFemale, 'Má sokyně', 'Můj sok' )] šaškem, od hlavy k patě ve výkalech"
 jester.100.desc: "Další stresující den... Právě se usazuji, abych si užil trochu klidu a ticha, když se náhle rozletí dveře mé komnaty.\n\nJe to snad [jester.GetTitledFirstName], [Select_CString( jester.IsFemale, 'má sokyně proměněná', 'můj sok proměněný' )] v šaška, [Select_CString( jester.IsFemale, 'oděná', 'oděný' )] do špínou nasáklého kusu oděvu [jester.Custom('GetClothingArticle')] s neuvěřitelně křiklavým doplňkem [jester.Custom('GetAccessory')|l]!? Nyní vypadá zvenčí stejně výkalovitě, jako podle mě uvnitř!\n\n„Váš nápoj [ROOT.Char.Custom('GetExpensiveDrink_Singular')]... [Select_CString( ROOT.Char.IsFemale, 'má #EMP lenní paní', 'můj #EMP lenní pane' )]#!,“ pronese [jester.GetTitledFirstName] s hluboce zamračenou tváří.\n\nNěkdy je život přece jen krásný."
 jester.100.a: "Připíjím na tebe, [Select_CString( jester.IsFemale, 'drahá', 'drahý' )] [jester.GetFirstNameNoTooltip]!"
 covered_in_feces: "Pokrytý výkaly"
 covered_in_feces_desc: "Tato postava je od hlavy k patě pokryta výkaly."
 jester.200.t: "$court_jester_prefix$Smích je nejlepší lék"
 jester.200.desc: "„Slyšel jste ten o [ROOT.Char.GetTitleTierName] a postavě [ROOT.Char.Custom('lowly_servant_type')], [ROOT.Char.Custom('FormOfAddressForLiege')]? Je to takhle!“ raduje se můj šašek [jester.GetTitledFirstName].\n\nTváře mi hoří a po lících mi stékají slzy smíchu. Kde jen bere všechny ty žerty? Je k popukání!\n\nMožná je načase vrátit se k práci, než #EMP zemřu#! smíchy!"
 jester.200.a: "Pokračuj, pověz mi ho!"
 jester.200.b: "Byla to zábava, ale je načase vrátit se k práci!"
 death_laughter: "zemřel následkem nezřízeného smíchu"
 jester.300.t: "$court_jester_prefix$Mistrovské žonglování"
 jester.300.desc: "„Pojďte do velké síně, [Select_CString( ROOT.Char.IsFemale, 'má lenní paní', 'můj lenní pane' )]! To musíte vidět!“ vykřikne náhle sluha.\n\nKdyž dorazím, spatřím uprostřed místnosti svého šaška [jester.GetTitledFirstName], jak mistrovsky žongluje s [ROOT.Char.Custom('DeviantObjectArticle')], mým [ROOT.Char.Custom('RandomPrivateObject')], lahví nápoje [ROOT.Char.Custom('GetExpensiveDrink_Singular')],"
 jester.300.desc_child: "malým dítětem [child_to_juggle.GetFirstName],"
 jester.300.desc_2: "tvorem [ROOT.Char.Custom('GetLivestockFowlIndef')] a pokrmem [ROOT.Char.Custom('GetSmallFoodIndef')].\n\nVšichni sluhové užasle zírají. A já také."
 jester.300.a: "Tak #EMP tohle#! člověk nevidí každý den!"
 jester.300.b: "Nuže, šup s [Select_CString( jester.IsFemale, 'ní', 'ním' )] do žaláře!"
 jester.400.t: "$court_jester_prefix$[Select_CString( jester.IsFemale, 'Prdířka a vznešená dáma', 'Prdíř a vznešený pán' )]"
 jester.400.desc: "„[Select_CString( ROOT.Char.IsFemale, 'Má lenní paní', 'Můj lenní pane' )], vypadáte tak zasmušile! Dovolte mi rozveselit vás básní, kterou jsem vybrousil k dokonalosti!“ praví můj šašek za cinkání rolniček.\n\n„Ehm, [jester.Custom('GeneratePoem_Title')]“\n#flatulence *Prd prd*#!, následuje uprdnutí.\n„[jester.Custom('GeneratePoem_Intro_Rhyming')]“\n#flatulence *Prd prd prd*#!, následuje další rytmické uprdnutí.\n„[jester.Custom('GeneratePoem_Outro_Rhyming')]“\n#flatulence *Prrrrrd*#!, zazní závěrečný pšouk.\n\n„Líbilo se vám to?“ zeptá se [jester.GetTitledFirstName] se škodolibým úsměvem."
 jester.400.a: "[Select_CString( jester.IsFemale, 'Básnířka #EMP i#! prdířka', 'Básník #EMP i#! prdíř' )]!? Tvé schopnosti jsou úžasné!"
 jester.400.b: "Bylo to skvělé! Naučíš mě své triky?"
 aspiring_flatulist: "Začátky ve flatulismu"
 aspiring_flatulist_desc: "Tato postava se věnuje vytříbenému a vznešenému umění prdění.\n#flatulence *Prd*#!"
 jester.500.t: "$court_jester_prefix$Zloděj šatstva"
 jester.500.desc: "Právě se chystám odebrat na noc na lůžko, když se přede mnou odehraje neuvěřitelně komická scéna – [Select_CString( courtier.IsFemale, 'má', 'můj' )] [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName], [Select_CString( courtier.IsFemale, 'nahá', 'nahý' )] jako v den svého narození, pronásleduje mého dvorního šaška se sekerou!\n\n„Pojď sem! Vrať mi moje šaty, nebo tě rozseknu vedví!“ křičí [courtier.GetFirstNameNoTooltip].\n\n„Óóó, nikdy mě nechytíš! Potřebuji tvé šaty, abych si postavil útulné šaškovské hnízdečko!“ chichotá se [jester.GetFirstName] a nese náruč ukradeného oblečení."
 jester.500.a: "Cha cha! Přesně tohle jsem potřeboval vidět!"
 jester.500.b: "Jakkoli je to zábavné, vrať postavě [courtier.GetFirstNameNoTooltip] její šaty!"
 jester.600.t: "$court_jester_prefix$Bitva jídlem"
 jester.600.desc: "„[Select_CString( ROOT.Char.IsFemale, 'Má lenní paní', 'Můj lenní pane' )], vím o něčem, co vás rozveselí – pozorně sledujte, jak se připlížím ke své kořisti...“ zašeptá mi můj šašek [jester.GetFirstName].\nCo asi chystá?\n\n„Máš hlad?“ vykřikne [jester.GetFirstNameNoTooltip] a mrští [ROOT.Char.Custom('GetExpensiveDessertInTheFace')] do tváře [Select_CString( courtier.IsFemale, 'mé', 'mého' )] [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName]!\n\nTen výraz je k nezaplacení! A zdá se, že [courtier.GetFirstNameNoTooltip] to [Select_CString( courtier.IsFemale, 'přijala', 'přijal' )] #EMP docela#! dobře. Ach, jaká radost, jaká zábava!"
 jester.600.a: "Takový klasický žert!"
 jester.600.b: "Pomohu ti očistit se, [courtier.GetFirstNameNoTooltip]!"
 jester.600.c: "To je všechno...? Teď se #EMP perte!#!"
 jester.700.t: "$court_jester_prefix$Nedělní pečínka"
 jester.700.desc: "Můj šašek [jester.GetFirstName] stojí tváří v tvář [courtier.GetFirstName], [SCOPE.sC('you').Custom2('RelationToMeShort', SCOPE.sC('courtier'))], a já přicházím právě včas, abych zaslechl #EMP obzvlášť#! zdrcující spršku urážek!\n\n„Ty [courtier.Custom2('InsultAdjective', SCOPE.sC('jester'))] [courtier.Custom2('InsultNounSexual', SCOPE.sC('jester'))] a [courtier.Custom2('InsultAdjective', SCOPE.sC('jester'))] [courtier.Custom2('InsultNoun', SCOPE.sC('jester'))], tvé [courtier.Custom2('PointOfRidicule', SCOPE.sC('jester'))] a [courtier.Custom2('InsultBehavior', SCOPE.sC('jester'))] jsou přímo legendární! [courtier.Custom2('InsultSentence', SCOPE.sC('jester'))|U], ty [courtier.Custom2('InsultNounSexual', SCOPE.sC('jester'))]!“ pronese [jester.GetFirstNameNoTooltip], jako by se [Select_CString( jester.IsFemale, 'jí', 'ho' )] zmocnil [ROOT.Char.GetFaith.DevilName]!\n\n[courtier.GetFirstNameNoTooltip] rudne v obličeji, ale ví, že se dívám, a tak ze sebe nakonec vypraví bolestný smích."
 jester.700.a: "To byla dobrá sprška urážek, opravdu #EMP velice#! dobrá!"
 jester.700.b: "Nerozčiluj se, [courtier.GetFirstNameNoTooltip]! Pořád jsi nanejvýš [courtier.Custom('ComplimentAdjective')]!"
 jester.800.t: "$court_jester_prefix$Groteska"
 jester.800.desc: "„Ale ne! Zdá se, že zase padám!“ vykřikne komickým tónem můj šašek [jester.GetFirstName], "
 jester.800.desc_2: "„Jsem tak, tak nešikovný! Opravdu doufám, že tentokrát zůstanu stát!“ pronese [jester.GetFirstNameNoTooltip], "
 jester.800.desc_3: "„[jester.Custom('CulturalCurse')|U]. Mám ale mizerné štěstí!“ zachichotá se [jester.GetFirstNameNoTooltip], "
 jester.800.desc_4: "Po tom všem nemá [jester.GetFirstNameNoTooltip] na těle ani škrábnutí!"
 jester.800.a: "Ha! Padat bez jediného zranění, působivé!"
 jester.800.b: "Pche! Bez krve to není žádná zábava. Znovu. #EMP Silněji.#!"
 fall_into_sculpture: "narazí obličejem přímo do [furniture_to_crash_into.GetName]!\n\n"
 somersault_into_sculpture: "téměř kotrmelcem dopadne na [furniture_to_crash_into.GetName]!\n\n"
 faceplant: "s hlasitým plesknutím dopadne obličejem na podlahu!\n\n"
 walk_into_wall: "s hlasitým *žuchnutím* narazí přímo do zdi!\n\n"
 weapon_pratfall: "při pádu dopadne na [weapon_pratfall.GetName]!\n\n"
 weapon_plummet: "zřítí se nebezpečně blízko [weapon_pratfall.GetName]!\n\n"
 forceful_tumble: "prudce se svalí k zemi!\n\n"
 jester.900.t: "$court_jester_prefix$Několik šašků v jednom kabátě"
 jester.900.desc: "Hmm. Nepamatuji si, že by můj [jester.Custom('ComplimentAdjective')] šašek býval tak... #EMP objemný.#!\n\n„[ROOT.Char.GetLadyLord|U]! Omluvte mě, víte... Trochu jsem se přejedl a zdá se, že s tím můj žaludek ROZHODNĚ nesouhlasí!“ pronese [jester.GetFirstName] s bolestným výrazem ve tváři.\n\n#flatulence *Próóód*#!\n\nNáhle se pestrobarevný kabát postavy [jester.GetFirstNameNoTooltip] roztrhne, "
 jester.900.cat: "a odhalí celý vrh koťat! Musí jich tam být nejméně třicet – mňoukají a rozbíhají se na všechny strany!\n\n"
 jester.900.dog: "a vyvalí se z něj nejméně dvanáct rozjařených štěňat, která se okamžitě začnou dotírat na mé dvořany čenichy i tlapkami!\n\n"
 jester.900.bird: "a odhalí [ROOT.Char.Custom('GetLivestockFowlIndef')], pak dalšího, dalšího, dalšího a #EMP ještě jednoho!#!\n\n"
 jester.900.eagle: "a odhalí majestátní orlí mládě, které nadšeně vzlétne a začne kroužit po místnosti!\n\n"
 jester.900.a: "Nikdo si nevšimne, když si nechám jen #EMP jedno#!..."
 jester.900.b: "Ach! Toto divoké štěně mě bude doprovázet na mnoha lovech!"
 jester.900.c: "To je ale podívaná! Nádhera!"
 jester.900.d: "Zkrotím si toto orlí mládě!"
 jester.1000.t: "$court_jester_prefix$Dobrý příběh"
 jester.1000.desc: "„Vypadáte unaveně, [ROOT.Char.Custom('FormOfAddressForLiege')],“ pronese můj šašek [jester.GetFirstName].\n\n„Znám na to lék – jmenuje se ‚[SCOPE.Custom('RandomEntertainmentTextName')]‘. Co říkáte? Mám začít číst?“ [jester.GetFirstNameNoTooltip] mi pokyne, abych se posadil.\n\nJe to #EMP skutečně#! zábavný text... Tuto přestávku opravdu potřebuji."
 jester.1000.a: "Dokonce mění hlasy jednotlivých postav!"
 jester.1000.b: "[jester.GetFirstNameNoTooltip], proč mi místo toho nepovíš něco o sobě?"
 jester.1000.c: "Raději bych slyšel předčítat z knihy #EMP [my_book.GetNameNoTooltip]!#!"
 jester.1000.c_flavor: "Ach, jak jen miluji [my_book.GetName]!"
 reinvigorating_reading_modifier: "Osvěžující předčítání"
 reinvigorating_reading_modifier_desc: "Této postavě byla nahlas předčítána jedna z jejích drahocenných knih, což jí dodalo novou inspiraci."
 jester.1100.t: "$court_jester_prefix$Duch skrýše [hiding_place.GetNameNoTooltip]"
 jester.1100.desc: "Proč se zevnitř [hiding_place.GetName] ozývají zvuky? Rozhlédnu se po místnosti, ale nikdo jiný zde není. Je prázdná a temná.\n\n#EMP *Vrzánííí*#!\n\nMohl by to být duch? Nějaký zlomyslný skřítek?\nNáhle se skrýš rozletí a vyskočí z ní můj šašek [jester.GetFirstName], který divoce mává rukama!\n\n„Střezte se ducha skrýše [hiding_place.GetNameNoTooltip]! Přišel jsem vás rozesmát!“ vykřikne [jester.GetFirstNameNoTooltip] radostně."
 jester.1100.a: "Ha! Téměř jsi mě dostal!"
 jester.1100.b: "Dobrotivý [ROOT.Char.GetFaith.HighGodName]... co kdybys byl vrah!?"
 jester.1100.c: "Mé ubohé srdce...!"
 jester.1100.d: "Stráže, přineste kladivo a hřebíky..."
 jester.1100.d_flavor: "Pokud je [jester.GetFirstNameNoTooltip] skutečně „duchem skrýše [hiding_place.GetNameNoTooltip]“, bude se uvnitř jistě cítit jako doma... až do konce svého života."
 death_heart_attack: "zemřel na srdeční příhodu"
 death_nailed_in_cabinet: "byl přibit do kusu nábytku a ponechán, aby zemřel hlady"
 death_nailed_in_cabinet_killer: "byl postavou [TARGET_CHARACTER.GetUIName] přibit do kusu nábytku a ponechán, aby zemřel hlady"
 suspicious_of_furniture: "Podezíravost vůči nábytku"
 suspicious_of_furniture_desc: "Tato postava vždy kope do každého většího kusu nábytku, na který narazí. Opakovaně."
 jester.1200.t: "$court_jester_prefix$Mlýn na klepy"
 jester.1200.desc: "„Ach, můj lenní pane, slyšel jste, že [vassal_1.GetTitledFirstName] včera na veřejnosti ukazoval své [vassal_1.Custom('ObjectifiedFeature')]? Neuvěřitelné, že?“ zašeptá mi do ucha [jester.GetFirstName].\nMůj šašek se toho opravdu doslechne mnoho.\n\n„A – ho ho! Je to pravda! [vassal_2.GetTitledFirstNamePossessive] [vassal_2_spouse.GetWifeHusband] označil postavu [vassal_2.GetTitledFirstNameNoTooltip] za #EMP [vassal_2.Custom2('InsultAdjectiveArticle', SCOPE.sC('jester'))] [vassal_2.Custom2('InsultNoun', SCOPE.sC('jester'))]!#! Takové drama!“ pokračuje [jester.GetFirstNameNoTooltip].\n\n„A věděli jste, že [secret_holder.GetTitledFirstName] je tajně [secret_holder.Custom('GetSecretCrimeDescIndef')]?“"
 jester.1200.a: "Tak lahodné klepy!"
 jester.1200.b: "Počkej... co jsi to říkal o [secret_holder.GetTitledFirstNameNoTooltip]!?"
 jester.1300.notification: "[jester.GetFirstName] žertuje o [jester.Custom('RandomObjectPlural')]"
 jester.1400.notification: "[jester_from_task.GetFirstName] baví tvou postavu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_de_stress_target'))|U] [first_de_stress_target.GetFirstName]"
 jester.1410.notification: "[jester_from_task.GetFirstName] baví tvou postavu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_de_stress_target'))|U] [second_de_stress_target.GetFirstName]"
 jester_entertainment_decision: "Nechat se bavit dvorním šaškem"
 jester_entertainment_decision_tooltip: "Nech se bavit svým dvorním šaškem a sniž si [Concept('stress','stres')|El]."
 jester_entertainment_decision_desc: "Žerty, akrobacie, poezie! Ať začne zábava!"
 jester_entertainment_decision_confirm: "Pobav mě!"
 jester_decision_rewards: "Předvedou před tebe tvého dvorního šaška:\n$EFFECT_LIST_BULLET$Ztratíš část [stress_loss_i] [Concept('stress','stresu')|El]\n$EFFECT_LIST_BULLET$Může se objevit událost snižující [Concept('stress','stres')|El] #weak (dvorní šašci s vyšší [Concept('aptitude','způsobilostí')|El] poskytují lepší události)#!"
