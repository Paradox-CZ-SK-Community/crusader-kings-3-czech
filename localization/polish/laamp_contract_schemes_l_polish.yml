 laamp_base_contract_schemes.2541.e.tt.employer_has_trait.diligent: "#WEAK Pravděpodobnější, protože [employer.GetTitledFirstName] je [GetTrait('diligent').GetName( GetNullCharacter )]#!"
 laamp_base_contract_schemes.2542.t.crit_win: "$laamp_base_contract_schemes.2011.t$ – mimořádný úspěch"
 laamp_base_contract_schemes.2542.t.win: "$laamp_base_contract_schemes.2011.t$ – úspěch!"
 laamp_base_contract_schemes.2542.t.fail: "$laamp_base_contract_schemes.2011.t$ – neúspěch!"
 laamp_base_contract_schemes.2542.t.crit_fail: "$laamp_base_contract_schemes.2011.t$ – mimořádný neúspěch"
 laamp_base_contract_schemes.2542.desc.intro: "Po dokončení nás v [location.GetBaseNameNoTier] přivítá zástupce postavy [employer.GetTitledFirstName] a se zájmem převezme tlustý svazek našich poznámek.\n\n"
 laamp_base_contract_schemes.2542.desc.method.own_skill.honest.win: "„Úžasná práce, [ROOT.Char.GetTitledFirstNameNoTooltip]! Už letmý pohled prozrazuje nesmírnou pečlivost a smysl pro podrobnosti. [employer.GetTitleAsNameNoTooltip] bude nadšen[Select_CString( employer.IsFemale, 'á', 'ý' )]!“ Na pochvalu nepatrně skloním hlavu a služebník pokyne, aby přinesli naši odměnu."
 laamp_base_contract_schemes.2542.desc.method.quartermasters_stressed_and_wreckt.win: "„Ať už pro tebe tuto práci dělal kdokoli, [ROOT.Char.GetTitledFirstNameNoTooltip], odvedl #EMP ohromující#! výkon,“ hvízdne služebník. „[employer.GetTitleAsNameNoTooltip] bude nadšen[Select_CString( employer.IsFemale, 'á', 'ý' )].“ Za mnou si [officer.GetTitledFirstName] mne spánek, zjevně vyčerpán[Select_CString( officer.IsFemale, 'a', '' )] vynaloženým úsilím, zatímco nám přinášejí odměnu."
 laamp_base_contract_schemes.2542.desc.method.quartermasters_skill_sans_stress.win: "„Ať už pro tebe tuto práci dělal kdokoli, [ROOT.Char.GetTitledFirstNameNoTooltip], odvedl #EMP znamenitý#! výkon,“ hvízdne služebník. „[employer.GetTitleAsNameNoTooltip] bude nanejvýš spokojen[Select_CString( employer.IsFemale, 'á', 'ý' )].“ Vedle mě se [officer.GetTitledFirstName] hrdě napřímí a mlčky září pýchou, zatímco nám přinášejí odměnu."
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_and_quartermasters.win: "„Vy dva jste ale pilní služebníci!“ zachechtá se služebník na postavu [officer.GetTitledFirstName] a na mě. „Tyto záznamy jsou pro postavu [employer.GetTitleAsNameNoTooltip] náležitě důkladné, dokonce i váš rukopis je znamenitý. Ihned vám přinesu zaslouženou odměnu.“"
 laamp_base_contract_schemes.2542.desc.method.own_skill.dishonest.win: "„Při [employer.GetFaith.KnowledgeGodName], jaké množství informací jste odhalili! A #EMP tolik#! z nich je naprosto nečekaných... Kdybych je nečetl[Select_CString( dummy_gender.IsFemale, 'a', '' )] na vlastní oči, sotva bych jim uvěřil[Select_CString( dummy_gender.IsFemale, 'a', '' )]. [employer.GetTitleAsNameNoTooltip] bude s vaším úsilím nanejvýš spokojen[Select_CString( employer.IsFemale, 'á', 'ý' )]!“"
 laamp_base_contract_schemes.2542.desc.method.own_skill.guessed.win: "„Propána, pokud jsou tyto záznamy #EMP alespoň trochu#! přesné, pak jsou naše znalosti zemí postavy [employer.GetTitleAsNameNoTooltip] tak žalostně nedostatečné, že budeme muset okamžitě zadat podrobnější soupis. Prvotřídní práce!“"
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_dishonest_and_guessed.win: "„To jsou vskutku #EMP ohromující#! skutečnosti, které jste shromáždili... Musím přiznat, že jsem o mnohém z toho neměl[Select_CString( dummy_gender.IsFemale, 'a', '' )] ani tušení. Zdá se, že země postavy [employer.GetTitleAsNameNoTooltip] jsou mnohem rozmanitější, než jsme si představovali. Každopádně jste odvedli dobrou práci a [employer.GetTitleAsNameNoTierNoTooltip] bude spokojen[Select_CString( employer.IsFemale, 'á', 'ý' )]!“"
 laamp_base_contract_schemes.2542.desc.method.mixed.win: "„Nu, ehm, vidím, že vaše... záznamy... jsou patrně v pořádku. Jsou poněkud nesourodé. Jak přesně jste je sestavili? Vlastně na tom asi nezáleží. [employer.GetTitleAsNameNoTooltip] bude spokojen[Select_CString( employer.IsFemale, 'á', 'ý' )] a jen na tom záleží.“"
 laamp_base_contract_schemes.2542.desc.method.own_skill.honest.loss: "„Nu, alespoň vidím, že jste se #EMP snažili#!, ale už při letmém pohledu je v záznamech příliš mnoho zjevných chyb, než aby je mohl[Select_CString( employer.IsFemale, 'a', '' )] [employer.GetTitleAsName] použít. Je mi líto, ale za tak nedbalou práci nic nedostanete, ať už vás stála sebevětší úsilí.“"
 laamp_base_contract_schemes.2542.desc.method.quartermasters_stressed_and_wreckt.loss: "„Nejsem si... jist[Select_CString( dummy_gender.IsFemale, 'á', 'ý' )], kdo zapisoval vaše diktování nebo vedl výslechy, ale musím se zeptat. Je výsledkem příbuzenského křížení, nebo je jen slabomyslný?“\n\nKdesi za mnou propukne [officer.GetTitledFirstName] v pláč."
 laamp_base_contract_schemes.2542.desc.method.quartermasters_skill_sans_stress.loss: "„Podívejte, vidím, že jste se snažili, ale ať už jste za pořizování těchto poznámek zaplatili komukoli... platíte mu příliš mnoho.“\n\nVedle mě se [officer.GetTitledFirstName] hlasitě ušklíbne."
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_and_quartermasters.loss: "Úředník si pochybovačně prohlíží záznamy, které jsme s postavou [officer.GetTitledFirstName] pracně sestavili. Každou další stránkou listuje se stále větším opovržením, až nakonec okázale odhodí drahý [ROOT.Char.Custom('GetWritingMaterial')] na zem a beze slova odejde."
 laamp_base_contract_schemes.2542.desc.method.own_skill.dishonest.loss: "Po krátké prohlídce [dummy_gender.GetSheHe] vzhlédne. „Myslíte si snad, že jsme v [employer.GetCapitalLocation.GetTitle.GetNameNoTier] #EMP hlupáci#!? Že nám můžete prostě lhát a my si ničeho nevšimneme, ať jsou vaše padělky sebeubožejší? Za toto šarlatánství nedostanete žádnou odměnu!“"
 laamp_base_contract_schemes.2542.desc.method.own_skill.guessed.loss: "„Co to má... Vždyť jste si #EMP naprosto zjevně#! vymysleli úplné nesmysly. Co tě to posedlo, ty pomatený [ROOT.Char.GetWomanMan], že sis myslel[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že za to dokážeš vymámit peníze?“\n\n[dummy_gender.GetWomanMan|U] ve službách postavy [employer.GetTitleAsNameNoTooltip] zmizí dříve, než vůbec stačíme začít hájit svou nevinu."
 laamp_base_contract_schemes.2542.desc.method.combi_own_skill_dishonest_and_guessed.loss: "Netrvá dlouho, než [dummy_gender.GetSheHe] odhalí naše... #EMP podnikavé#! řešení obtížných okolností. Po krátkém kázání o naší nestoudné drzosti [dummy_gender.GetWomanMan] ve službách postavy [employer.GetTitleAsNameNoTooltip] rázně odkráčí."
 laamp_base_contract_schemes.2542.desc.method.mixed.loss: "„Budu upřímný[Select_CString( dummy_gender.IsFemale, 'á', 'ý' )], tohle je... zmatek. Vůbec nedokážu pochopit, o co jste se zde #EMP pokoušeli#!, a myslím, že oba dobře víme, že si za tohle,“ [dummy_gender.GetSheHe] pohrdavě mávne rukou, „ať je #EMP tohle#! cokoli, nezasloužíte jedinou minci.“"
 laamp_base_contract_schemes.2542.desc.outro.win: "\n\n[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] obdrží, co jim náleží. Za své úsilí získáme velkou truhlu stříbrných mincí."
 laamp_base_contract_schemes.2542.desc.outro.loss: "\n\nDnes [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] odejdou s prázdnou."
 laamp_base_contract_schemes.2542.a.crit_win: "Velkolepé vítězství!"
 laamp_base_contract_schemes.2542.a.win: "Odvedli jsme dobrou práci."
 laamp_base_contract_schemes.2542.a.fail: "Pche, opusťme tyto nevděčníky."
 laamp_base_contract_schemes.2542.a.crit_fail: "Tohle byla skutečně ztráta času."
 laamp_base_contract_schemes.2661.t: "$laamp_base_contract_schemes.2031.t$ – místní mezník"
 laamp_base_contract_schemes.2661.desc: "Spor v [employer.GetPrimaryTitle.GetBaseNameNoTier] pramení z drobné místní právní pře. Náš zadavatel pošetile rozhodl, že hranice vymezená jistým přírodním mezníkem vede trochu jinudy, než stanovovala tradice.\n\nOkamžitě se vyrojily desítky sporů vedených drobnými vlastníky půdy a zámožnějšími sedláky, z nichž každý měl kvůli změně vymezení nějakou tu křivdu."
 laamp_base_contract_schemes.2661.desc.outro: "\n\n[employer.GetTitledFirstName|U] nám důrazně připomene, že svou odměnu dostaneme pouze tehdy, pokud situaci uklidníme rychle a bez rozruchu."
 laamp_base_contract_schemes.2661.a: "Tohle vypadá jako docela prostý problém..."
 laamp_base_contract_schemes.2661.b: "Myslím, že to dokážu urovnat..."
 laamp_base_contract_schemes.2661.b.tt.success: "Najdeš přijatelný kompromis"
 laamp_base_contract_schemes.2661.b.tt.failure: "Jednání ztroskotají"
 laamp_base_contract_schemes.2661.c: "Mám dojem, že zde záleží méně na přesnosti než na jednoznačnosti."
 laamp_base_contract_schemes.2661.d.sacrifice_exists: "[sacrifice.GetFirstNameNoTooltip|U] zde zůstane a spor vyřeší."
 laamp_base_contract_schemes.2661.d.sacrifice_unexists: "Bohužel nemám žádného služebníka natolik schopného, abych jej zde mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] zanechat."
 laamp_base_contract_schemes.2661.d.no_valid_char: "Nemáš k dispozici [Concept('follower','družiníka')|E] s alespoň [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] body [Concept('intrigue','pletichářské dovednosti')|E], kterého bys mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dočasně přidělit k [employer.GetFirstNamePossessive] [Concept('court','dvoru')|E]"
 laamp_base_contract_schemes.2661.d.tt.courtier_stays_here: "[sacrifice.GetFirstName|U] bude zapůjčen[Select_CString( sacrifice.IsFemale, 'a', '' )] [employer.GetTitledFirstNamePossessive] [Concept('court','dvoru')|E] a vrátí se k tobě za [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_sacrifice_loan_length_min_value')|0] až [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_sacrifice_loan_length_max_value')|0] let"
 laamp_base_contract_schemes.2661.e.officer_exists: "[officer.GetTitledFirstNameNoTooltip|U], tohle vypadá jako práce pro tebe."
 laamp_base_contract_schemes.2661.e.officer_unexists: "Hmph, nemám vhodného důstojníka, na kterého bych to mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] přenést."
 laamp_base_contract_schemes.2661.f: "Říkáte, že je to příležitost k učené rozpravě?"
 laamp_base_contract_schemes.2661.g: "Když se do toho opřu, vyřeším cokoli!"
 laamp_base_contract_schemes.2662.t: "$laamp_base_contract_schemes.2031.t$ – úspěch!"
 laamp_base_contract_schemes.2662.desc.resolution_type.stewardship: "Dobří lidé z [employer.GetPrimaryTitle.GetBaseNameNoTier] předkládají mnoho námitek, některé oprávněné a jiné nikoli, ale #EMP žádná#! není ucelená.\n\nNetrvá dlouho a jejich argumenty snadno rozmetám, když jeden po druhém odhalím jako lichý, pošetilý či obojí.\n\nBěhem pouhých několika hodin se mi podaří obrátit situaci ve prospěch našeho zadavatele, až se jeho nové rozhodnutí začne k rozhořčení a nelibosti poddaných jevit jako zcela odpovídající tradici."
 laamp_base_contract_schemes.2662.desc.resolution_type.secondary_skill: "Stačí trocha tvořivé slovní obratnosti a mezi rozhněvanými obyvateli [employer.GetPrimaryTitle.GetBaseNameNoTier] začnou klíčit pochybnosti.\n\nStačí naznačit, že někdo řekl tohle namísto tamtoho, že jedna věta ve skutečnosti znamenala něco jiného, poštvat několik lidí proti sobě a #EMP voilà#!. Nikdo si již není dost jistý tím, kdo má pravdu ani co je vůbec pravda, aby dokázal klást smysluplný odpor.\n\nSpor jsme sice skutečně nevyřešili, ale rozmělnili jsme jej natolik, že hněv místních opadne a jejich námitky se rozplynou."
 laamp_base_contract_schemes.2662.desc.resolution_type.left_sacrifice: "Zatímco [sacrifice.GetTitledFirstName] zůstane jednat s rozhněvanými místními, vydáme se s postavou [employer.GetTitledFirstName] na procházku.\n\nVýkřiky a stížnosti na nespravedlnost postupně utichají v pozadí, a když přistoupíme k malému balkonu, abychom se nadýchali chladného večerního vzduchu, [employer.GetFirstNameNoTooltip] se poprvé od našeho příjezdu usměje.\n\n„Je od tebe velmi laskavé zapůjčit nám tak schopného řečníka, [ROOT.Char.GetFirstNameNoTooltip], vskutku velmi laskavé. Postarám se, aby byla cesta zpět pro postavu [sacrifice.GetFirstNameNoTooltip] rychlá a bezpečná. Tvá odměna na tebe čeká u bran.“"
 laamp_base_contract_schemes.2662.desc.resolution_type.officer: "Díky [officer.GetTitledFirstNamePossessive] vrozenému loveckému citu je posouzení polohy mezníku rychlé, přesné a nezpochybnitelné.\n\nObyvatelům [employer.GetPrimaryTitle.GetBaseNameNoTier] to samozřejmě nezabrání, aby se je pokoušeli zpochybnit, ale [officer.GetFirstNameNoTooltip] má pro každého z nich pohotovou odpověď a jejich argumenty jeden po druhém rozebírá.\n\nNež skončí, je pozdní odpoledne, ale zástup samozvaných účastníků sporu se nakonec rozejde."
 laamp_base_contract_schemes.2662.desc.resolution_type.camp_purpose: "Dobří lidé z [employer.GetPrimaryTitle.GetBaseNameNoTier] možná své zájmy hájí se zápalem, ale nepočítali s plnou učenou zuřivostí [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].\n\nNaše rozpravy zaberou většinu dne. Mě naplňují nadšením, zatímco místní se s každou další hodinou tváří stále sklíčeněji.\n\nK žádnému skutečnému závěru se nedobereme, ale místní to nakonec prostě vzdají. Na každou otázku odpovíme další otázkou, ke každému tématu se několikrát vrátíme a každý argument se vleče dál a dál a dál..."
 laamp_base_contract_schemes.2662.desc.resolution_type.stress: "Čirá umíněnost možná není nejúčinnějším způsobem řešení každého problému a vyčerpávající křik s tolika rozhněvanými místními si na mně rozhodně vybírá svou daň, ale účinný je.\n\nPo několika málo hodinách řevu a zastrašování obyvatelé [employer.GetPrimaryTitle.GetBaseNameNoTier] nakonec zahanbeně ustoupí.\n\nPřesně jak jsem věděl[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že učiní, jakmile jim ukážu pevnost své vůle."
 laamp_base_contract_schemes.2662.desc.outro: "\n\n[employer.GetTitledFirstName] působí jednoduše vděčně, že celé fiasko skončilo."
 laamp_base_contract_schemes.2662.a: "Další spokojený $game_concept_contact_list_contact$."
 laamp_base_contract_schemes.2663.t: "$laamp_base_contract_schemes.2031.t$ – neúspěch!"
 laamp_base_contract_schemes.2663.desc.stewardship: "Zdá se, že mé správní schopnosti... nejsou #EMP takové#!, jaké jsem si představoval[Select_CString( ROOT.Char.IsFemale, 'a', '' )].\n\nMyslel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem, že zasvěcený názor významného člověka pomůže vnést do věci jasno. Mé pokusy o upřesnění hranice vymezené mezníkem však namísto toho vytvořily #EMP třetí#! výklad, který soupeří s prvními dvěma, a všechny znesvářené strany se kvůli tomu vrhnou do ještě zuřivější hádky."
 laamp_base_contract_schemes.2663.desc.officer: "Navzdory veškerému úsilí postavy [officer.GetTitledFirstName] zachvátí obyvatele [employer.GetPrimaryTitle.GetBaseNameNoTier] bouřlivý hněv.\n\nZdá se, že pokusy mého lovčího upřesnit hranici vymezenou mezníkem vedly pouze ke vzniku #EMP třetího#! výkladu, který soupeří s prvními dvěma."
 laamp_base_contract_schemes.2663.desc.outro: "\n\nPoté začnou vyplouvat na povrch snad všechny staré křivdy v [employer.GetPrimaryTitle.GetDeJureLiege.GetBaseNameNoTier]. Mezi místními se šíří nevraživost a pochybné požadavky, až hrozí, že nepokoje zachvátí celé území [employer.GetPrimaryTitle.GetDeJureLiege.GetTierAsNameNoTooltip].\n\nRozzuřen[Select_CString( employer.IsFemale, 'á', 'ý' )] [employer.GetTitledFirstName] nás vykáže z osady a za naši námahu nám nedá jedinou minci."
 laamp_base_contract_schemes.2663.a: "Udělali jsme, co jsme mohli..."
 laamp_base_contract_schemes.2666.t: "$laamp_base_contract_schemes.2031.t$ – dvojí odvody"
 laamp_base_contract_schemes.2666.desc: "V [employer.GetPrimaryTitle.GetBaseNameNoTier] panuje rozruch již dlouho před naším příjezdem. Léta chyb našeho zadavatele a jemu podobných podle všeho vedla k tomu, že mnohé místní statky a podniky byly zdaněny #EMP dvakrát či vícekrát#!, pokaždé jiným výběrčím a v rámci jiného odvodu.\n\nPo dlouhém reptání a pokusech domoci se nápravy po dobrém nyní hrozí, že situace přeroste v něco krvavějšího."
 laamp_base_contract_schemes.2666.desc.outro: "$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2666.a: "$laamp_base_contract_schemes.2661.a$"
 laamp_base_contract_schemes.2666.b: "$laamp_base_contract_schemes.2661.b$"
 laamp_base_contract_schemes.2666.b.tt.success: "$laamp_base_contract_schemes.2661.b.tt.success$"
 laamp_base_contract_schemes.2666.b.tt.failure: "$laamp_base_contract_schemes.2661.b.tt.failure$"
 laamp_base_contract_schemes.2666.c: "Tohle vypadá na nedostatek komunikace."
 laamp_base_contract_schemes.2666.d.sacrifice_exists: "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
 laamp_base_contract_schemes.2666.d.sacrifice_unexists: "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
 laamp_base_contract_schemes.2666.d.no_valid_char: "Nemáš k dispozici [Concept('follower','družiníka')|E] s alespoň [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] body [Concept('diplomacy','diplomatické dovednosti')|E], kterého bys mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dočasně přidělit k [employer.GetTitledFirstNamePossessive] [Concept('court','dvoru')|E]"
 laamp_base_contract_schemes.2666.d.tt.courtier_stays_here: "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
 laamp_base_contract_schemes.2666.e.officer_exists: "$laamp_base_contract_schemes.2661.e.officer_exists$"
 laamp_base_contract_schemes.2666.e.officer_unexists: "$laamp_base_contract_schemes.2661.e.officer_unexists$"
 laamp_base_contract_schemes.2666.f: "Musíme zkrátka překreslit hranice!"
 laamp_base_contract_schemes.2666.g: "$laamp_base_contract_schemes.2661.g$"
 laamp_base_contract_schemes.2667.t: "$laamp_base_contract_schemes.2031.t$ – úspěch!"
 laamp_base_contract_schemes.2667.desc.resolution_type.stewardship: "Daně jsou účetnictví a účetnictví je v dnešní době poněkud nedoceněným uměním.\n\nJakmile dostanu seznam místních odvodů, zabere mi většinu dne projít každý případ #EMP údajného#! nadměrného zdanění a doložit, že šlo pouze o povinnost, která nebyla uhrazena jinde. Obyvatelé [employer.GetPrimaryTitle.GetBaseNameNoTier] přirozeně reptají, ale většina se nakonec podvolí.\n\nTěm několika, kteří dokážou předložit přesvědčivé důkazy, zacpe ústa občasná úleva z odvodů na příští rok, navzdory tlumeným námitkám postavy [employer.GetTitledFirstName]."
 laamp_base_contract_schemes.2667.desc.resolution_type.secondary_skill: "Obyvatelé [employer.GetPrimaryTitle.GetBaseNameNoTier] se očividně považují za protřelé, ale nepočítali s jazykem člověka z rodu [ROOT.Char.GetHouse.GetName].\n\nObratně zamotám jejich malicherné námitky, zaseji mezi ně pochybnosti a připomenu jim všechno dobré, co pro jejich bezpečí [employer.GetTitledFirstName] činí, přičemž jim #EMP nenápadně#! připomenu i to, kdo zde drží moc vynucovat svou vůli.\n\nMožná jsem nakonec trochu přeháněl[Select_CString( ROOT.Char.IsFemale, 'a', '' )], ale... když se člověk dobře baví..."
 laamp_base_contract_schemes.2667.desc.resolution_type.left_sacrifice: "Představa, že zde zůstane, postavu [sacrifice.GetTitledFirstName] poněkud znepokojí, přesto se usadí a začne naslouchat tisíci a jedné námitce obyvatel [employer.GetPrimaryTitle.GetBaseNameNoTier].\n\n[employer.GetTitledFirstName|U] mě vděčně odvede pryč a ponechá naše podřízené jejich práci.\n\n„Je od tebe velmi laskavé zanechat nám tak nadějného služebníka. Ujišťuji tě, že o postavu [sacrifice.GetFirstNameNoTooltip] bude během pobytu dobře postaráno! Nyní tuším zbývá záležitost tvé odměny...“"
 laamp_base_contract_schemes.2667.desc.resolution_type.officer: "Naštěstí se ukáže, že [officer.GetFirstName], náš kvartýrmistr, má dostatečné organizační schopnosti, aby situaci zvládl[Select_CString( officer.IsFemale, 'a', '' )].\n\nTrvá to celé hodiny úmorných debat a slovního přezkoumávání účtů, ale podaří se mu[Select_CString( officer.IsFemale, 'jí', '' )] nalézt dost starých dluhů, nezaplacených odvodů, dosud nevybraných protislužeb a podobných položek, aby většina dodatečných poplatků vypadala jen jako nesprávně označená.\n\nZ dlouhodobého hlediska to nevyřeší odporný zvyk postavy [employer.GetTitledFirstName] vybírat nadměrné daně, ale prozatím to našemu zadavateli stačí."
 laamp_base_contract_schemes.2667.desc.resolution_type.camp_purpose: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName|U] mají zkušenosti s kartografií a pomocí napůl smyšlených příběhů a sebejistých prohlášení o #EMP novém#! způsobu vymezování hranic přimějí místní zcela ustoupit.\n\nDobří lidé z [employer.GetPrimaryTitle.GetBaseNameNoTier] cítí při vyhlídce na konec dvojího zdanění takovou úlevu, že jsou zjevně ochotni mlčky přehlédnout již vybrané dodatečné poplatky. Postavě [employer.GetTitledFirstName] důrazně vysvětlím, že jde o vítězství, které by měla jednoduše přijmout."
 laamp_base_contract_schemes.2667.desc.resolution_type.stress: "Jednání s drobnými hodnostáři z [employer.GetPrimaryTitle.GetBaseNameNoTier] je naprosto, ale naprosto vyčerpávající.\n\nVyčerpávající, nikoli však nemožné, a díky houževnatosti a odhodlání nakonec přiměji #EMP většinu#! z nich ustoupit. Není to trvalé řešení, ale zastrašit většinu k mlčení podle všeho stačí, aby byl[Select_CString( employer.IsFemale, 'a', '' )] [employer.GetTitledFirstName] spokojen[Select_CString( employer.IsFemale, 'á', 'ý' )], a právě kvůli tomu jsme sem nakonec přišli."
 laamp_base_contract_schemes.2667.desc.outro: "\n\nJeště téhož dne město opustíme s měšci naditými čerstvě získanými mincemi."
 laamp_base_contract_schemes.2667.a: "$laamp_base_contract_schemes.2662.a$"
 laamp_base_contract_schemes.2668.t: "$laamp_base_contract_schemes.2031.t$ – neúspěch!"
 laamp_base_contract_schemes.2668.desc.stewardship: "Zdá se, že problém nakonec tak prostý nebyl.\n\nMé pokusy situaci vyřešit, uklidnit místní a přislíbit jim alespoň jakousi nápravu okamžitě podkope bojovné odmítání jakékoli viny ze strany postavy [employer.GetTitledFirstName].\n\nSituace se mi poté rychle vymkne z rukou. Všechny strany na sebe křičí a město se ocitne na pokraji naprosté anarchie."
 laamp_base_contract_schemes.2668.desc.officer: "Metody kvartýrmistra [officer.GetFirstName] se ukážou jako... nedostatečné.\n\n[officer.GetSheHe|U] se pokusí poctivě a úplně vyúčtovat všechny daně, zaplacené, nezaplacené i přeplacené, ale každý krok přerušuje rozzuřen[Select_CString( employer.IsFemale, 'á', 'ý' )] [employer.GetTitledFirstName] a frustrovaní, rozrušení obyvatelé města.\n\nZanedlouho vše sklouzne jen k další ukřičené hádce a veškerá kontrola nad situací se vytratí."
 laamp_base_contract_schemes.2668.desc.outro: "\n\nJsme nuceni opustit [employer.GetPrimaryTitle.GetBaseNameNoTier] s prázdnou."
 laamp_base_contract_schemes.2668.a: "$laamp_base_contract_schemes.2663.a$"
 laamp_base_contract_schemes.2671.t: "$laamp_base_contract_schemes.2031.t$ – rozpadající se hradby"
 laamp_base_contract_schemes.2671.desc: "Hlavní problém v [employer.GetPrimaryTitle.GetBaseNameNoTier] je patrný už zvenčí za trouchnivějícími branami. Zdejší hradby jsou v žalostném stavu.\n\nPotíž nespočívá v tom, že by si toho nikdo nevšiml, ale v určení toho, kdo jejich obnovu skutečně #EMP zaplatí#!. Všichni se shodují, že tato nákladná práce je nezbytná a zároveň že je to problém #EMP někoho jiného#!."
 laamp_base_contract_schemes.2671.desc.outro: "$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2671.a: "$laamp_base_contract_schemes.2661.a$"
