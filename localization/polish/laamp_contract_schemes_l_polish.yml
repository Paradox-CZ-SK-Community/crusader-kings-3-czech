 travel.stationary_domicile.option.t: "Menší skupina cestuje rychleji."
 travel.mobile_domicile.option.t: "Táhneme jako jeden celek!"
 travel.stationary_domicile.tt: "@camp_travel_short_icon! Cestuješ bez svého [Concept('domicile','sídla')|E] #WEAK (je to rychlejší a nespotřebováváš [Concept('provisions','proviant')|E], ale budeš muset absolvovat zpáteční cestu)#!"
 travel.mobile_domicile.tt: "@camp_travel_domicile_icon! Cestuješ se svým [Concept('domicile','sídlem')|E] #WEAK (je to pomalejší a musíš cestou spotřebovávat [Concept('provisions','proviant')|E], ale nebudeš se muset vracet)#!"
 boilerplate.paragraph: "\n\n"
 option_boilerplate.tt.officer_aptitude: "#WEAK O výsledku tohoto souboje rozhodne [Concept('aptitude','způsobilost')|E] tvého [Concept('officer','důstojníka')|E]#!"
 option_boilerplate.tt.officer_aptitude.success: "Tvůj důstojník uspěje"
 option_boilerplate.tt.officer_aptitude.failure: "Tvůj důstojník tě zklame"
 gallowsbait_scum_opinion: "Šibenická pakáž"
 friendly_face_on_the_road_opinion: "Přátelská tvář na cestách"
 laamp_base_0001_contract_scheme: "Bavit dvůr"
 laamp_base_0001_contract_scheme_action: "Bavit dvůr postavy"
 laamp_base_0001_contract_scheme_desc: "Na [Concept('contractor_possessive','zadavatelově')|E] [Concept('court','dvoře')|E] docházejí při této [Concept('scheme','intrice')|E] klepy, a proto tam roste neklid. Ve snaze získat čerstvé zprávy nabízí dary a ubytování procházejícím poutníkům s dostatečným věhlasem, aby je přiměl nějaký čas pobýt.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0001_contract_scheme_desc_general: "$laamp_base_0001_contract_scheme_desc$"
 laamp_base_0001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0001_desc_title: "Hledají se zajímaví vypravěči!"
 laamp_base_0001_desc: "Vyprávějte o [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] poměrech a dění ve světě a odměna vás nemine! Všichni, kdo mají co vyprávět, jsou srdečně zváni, aby si užili pohostinnosti [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]."
 laamp_base_0011_contract_scheme: "Napravit pověst vládce"
 laamp_base_0011_contract_scheme_action: "Napravit pověst postavy"
 laamp_base_0011_contract_scheme_desc: "Pověst [Concept('contractor','zadavatele')|E] není valná. Buď je jeho jméno vláčeno blátem, nenávidí ho příliš mnoho [Concept('vassals','vazalů')|E], nebo mu jednoduše schází [Concept('prestige','prestiž')|E] potřebná k ospravedlnění jeho záměrů. Potřebuje „neutrální“ třetí stranu, která mu pomůže... #EMP posílit#! pověst.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0011_contract_scheme_desc_general: "$laamp_base_0011_contract_scheme_desc$"
 laamp_base_0011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0011_desc_title: "Hledají se výřeční poslové,"
 laamp_base_0011_desc: "Všem bezúhonným a důvěryhodným lidem se dává na vědomí, že ve službách [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] lze nalézt dobré zaměstnání. Hlaste se pouze s vážným zájmem."
 laamp_base_0021_contract_scheme: "Vetřít se k vládci"
 laamp_base_0021_contract_scheme_action: "Vetřít se k"
 laamp_base_0021_contract_scheme_desc: "Když [Concept('contractor','zadavatel')|E] zjevně prahne po pozornosti, otevírá tím dveře prospěchářům. Takovým, kteří mohou jíst jeho chléb, vypít mu sklep, vynutit si několik „půjček“ a zmizet dřív, než křik nějakého počtáře vyvolá poplach.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0021_contract_scheme_desc_general: "$laamp_base_0021_contract_scheme_desc$"
 laamp_base_0021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0021_desc_title: "Hledají se zábavní cizinci,"
 laamp_base_0021_desc: "Budiž známo, že štědrý [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] nabízí svou velkorysou pohostinnost zcestovalým a zasloužilým poutníkům."
 laamp_base_0031_contract_scheme: "Zprostředkovat smír"
 laamp_base_0031_contract_scheme_action: "Zprostředkovat smír pro"
 laamp_base_0031_contract_scheme_desc: "Když se zeměmi [Concept('contractor','zadavatele')|E] nesou hořká vzájemná obvinění a on sám je považován za příliš neschopného či zaujatého, než aby spor vyřešil, může úlohu nestranného prostředníka nabídnout vhodným poutníkům.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0031_contract_scheme_desc_general: "$laamp_base_0031_contract_scheme_desc$"
 laamp_base_0031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0031_desc_title: "Hledají se urození poutníci,"
 laamp_base_0031_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] hledá nestranné rozhodce, kteří spravedlivě urovnají místní spor. Za úplné vyřešení náleží zvláštní odměna."
 laamp_base_0041_contract_scheme: "Šejdíř"
 laamp_base_0041_contract_scheme_action: "Podvést"
 laamp_base_0041_contract_scheme_desc: "Hlupák o svůj majetek snadno přijde. Žádný [Concept('contractor','zadavatel')|E] by si o něco takového formálně #EMP neřekl#!. Místo toho udělá tu chybu, že se dá do hovoru s podvodníkem, aby po dokončení zakázky zjistil, že byl ošizen či dokonce okraden a proradný poutník je pryč.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_0041_contract_scheme_desc_general: "$laamp_base_0041_contract_scheme_desc$"
 laamp_base_0041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_0041_desc_title: "Hledají se pozoruhodné osobnosti,"
 laamp_base_0041_desc: "Moudrý, rozvážný a bystrý [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] si žádá zábavu na jistý čas. K dispozici je #EMP omezené#! ubytování, #EMP pokud#! splníte náročné požadavky."
 laamp_base_1001_contract_scheme: "Dopadnout zločince"
 laamp_base_1001_contract_scheme_action: "Dopadnout zločince pro postavu"
 laamp_base_1001_contract_scheme_desc: "Podnikavá banda zločinců může časem napáchat značné škody na majetku, [Concept('prestige','prestiži')|E] a dokonce i [Concept('legitimacy','legitimitě')|E]. Je dost početná, aby vzbuzovala obavy, ale zároveň dost malá, aby se těžko dopadala, takže je taková cháska jako stvořená pro [Concept('contract_scheme_contract','zakázku')|E].$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_1001_contract_scheme_desc_general: "$laamp_base_1001_contract_scheme_desc$"
 laamp_base_1001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_1001_desc_title: "Pocestní v okolí [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier],"
 laamp_base_1001_desc: "Měj se na pozoru před odpadlíky a ničemy, kteří řádí na odlehlých cestách!\n\nJe-li tvá paže silná a oko bystré, [TaskContract.GetEmployer.GetTitledFirstName] slibuje štědrou odměnu za hlavu jistého hrdlořeza."
 laamp_base_1011_contract_scheme: "Najatá pěst"
 laamp_base_1011_contract_scheme_action: "Prosazovat vůli postavy"
 laamp_base_1011_contract_scheme_desc: "Když [Concept('contractor','zadavatel')|E] potřebuje narychlo a v tichosti použít trochu větší sílu, může nájemný meč postupovat mnohem diskrétněji než běžní družiníci.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_1011_contract_scheme_desc_general: "$laamp_base_1011_contract_scheme_desc$"
 laamp_base_1011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_1011_desc_title: "Žoldnéři dobré pověsti,"
 laamp_base_1011_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] naléhavě hledá diskrétní žoldnéře pro krátkodobou službu. Za rychlou a čistou práci nabízí štědrou odměnu."
 laamp_base_1041_contract_scheme: "Přepadávat pocestné"
 laamp_base_1041_contract_scheme_action: "Přepadávat na území postavy"
 laamp_base_1041_contract_scheme_desc: "Jak nebezpečné mohou být země některých [Concept('contractors_possessive','zadavatelů')|E]! Vyhlásí žádost o pomoc, jenže se místo ní objeví podnikavý [Concept('adventurer','dobrodruh')|E] a začne přepadávat každého zazobaného kupce a každou lákavou karavanu, na které narazí.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_1041_contract_scheme_desc_general: "$laamp_base_1041_contract_scheme_desc$"
 laamp_base_1041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_1041_desc_title: "Důvěryhodní žoldnéři,"
 laamp_base_1041_desc: "[TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier|U] sužují lupiči, psanci a všemožní tuláci. #EMP Naléhavě#! se hledají zdatní bojovníci. Veškeré nabídky přijímá [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]."
 laamp_base_1041.tt.gold_rewards_depend_on_travellers: "#alert_trial Množství [Concept('gold','zlata')|E], které můžeš získat, zcela závisí na tom, jaké pocestné na cestě potkáš a přepadneš. Můžeš narazit na pohádkově bohaté [Concept('dukes','vévody')|E], ale i na zbídačené [Concept('courtiers','dvořany')|E] putující na pouť"
 laamp_base_1041.tt.haul_actual: "Tvůj celkový výdělek činí [gold_i][task_contract.MakeScope.Var('haul_actual').GetValue|P0]"
 laamp_base_2001_contract_scheme: "Vybírat daně"
 laamp_base_2001_contract_scheme_action: "Vybírat daně pro"
 laamp_base_2001_contract_scheme_desc: "Daně jsou mízou každého [Concept('realm','panství')|E]. Když jejich odvádění začne váznout, mohou [Concept('contractors','zadavatelé')|E] hledat důraznější výběrčí.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2001_contract_scheme_desc_general: "$laamp_base_2001_contract_scheme_desc$"
 laamp_base_2001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2001_desc_title: "Hledají se dobře vychovaní poutníci z dobrých rodin,"
 laamp_base_2001_desc: "Pro poctivou práci při vybírání [TaskContract.GetEmployer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] dávky jménem [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] se hledají neochvějní jedinci. Zkušenost s jednáním s neústupnými lidmi nízkého původu je nezbytná."
 laamp_base_2011_contract_scheme: "Provést sčítání"
 laamp_base_2011_contract_scheme_action: "Provést sčítání pro"
 laamp_base_2011_contract_scheme_desc: "Je obtížné spravovat [Concept('realm','panství')|E], když ani nevíš, kdo v něm vlastně #EMP žije#!. [Concept('contractors','Zadavatelé')|E] s tímto problémem se často obracejí na neutrální třetí strany, aby sečetly jejich poddané a především jejich majetek.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2011_contract_scheme_desc_general: "$laamp_base_2011_contract_scheme_desc$"
 laamp_base_2011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2011_desc_title: "Pozor, zeměměřiči a úředníci!"
 laamp_base_2011_desc: "V záznamech [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] zejí značné mezery. Pro provedení sčítání se hledají vzdělaní pocestní bystré mysli a silného těla, kteří budou odměněni z jeho výnosů."
 laamp_base_2021_contract_scheme: "Vystavět budovu"
 laamp_base_2021_contract_scheme_action: "Vystavět budovu pro"
 laamp_base_2021_contract_scheme_desc: "Mnozí [Concept('contractors','zadavatelé')|E] zjišťují, že jejich stavitelské ambice převyšují jejich schopnosti. Vypsat stavební práce jako zakázku je snadný způsob, jak takové... přehnané cíle napravit.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2021_contract_scheme_desc_general: "$laamp_base_2021_contract_scheme_desc$"
 laamp_base_2021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2021_desc_title: "Hledá se všímavý a rozvážný stavbyvedoucí,"
 laamp_base_2021_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] potřebuje schopné dělníky a řemeslníky k vedení stavebního projektu. Materiál i spravedlivá odměna budou zajištěny."
 laamp_base_2031_contract_scheme: "Urovnat hraniční spor"
 laamp_base_2031_contract_scheme_action: "Rozsoudit hranice pro"
 laamp_base_2031_contract_scheme_desc: "Hranice znamenají moc, a proto bývají často předmětem sporů. Když se malicherná rozepře mezi významnými lidmi vymkne kontrole, bývá pro [Concept('contractors','zadavatele')|E] účinnější najmout neutrální třetí stranu, která ověří skutečný stav věcí.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2031_contract_scheme_desc_general: "$laamp_base_2031_contract_scheme_desc$"
 laamp_base_2031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2031_desc_title: "Poutníci z dobrých rodin,"
 laamp_base_2031_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] hledá zkušeného rozhodce k urovnání hraničního sporu. Znalost [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] práva by byla... vítaná. Odměnu však obdrží i za uspokojivou pomoc."
 laamp_base_2041_contract_scheme: "Vydávat se za výběrčího daní"
 laamp_base_2041_contract_scheme_action: "Ukrást daně postavě"
 laamp_base_2041_contract_scheme_desc: "Daně financují vládce každého [Concept('realm','panství')|E], ale je to #EMP nutné#!? Když se objeví sebejistý darebák s úředně vypadající pečetí a několika najatými hromotluky, liší se snad #EMP tolik#! od skutečného úředníka?$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_2041_contract_scheme_desc_general: "$laamp_base_2041_contract_scheme_desc$"
 laamp_base_2041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_2041_desc_title: "Všem poddaným panství [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]"
 laamp_base_2041_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] všem důrazně připomíná blížící se výběr daní. Zaplaťte bez prodlení, jakmile dorazí výběrčí. Veškeré nedoplatky budou přísně potrestány."
 laamp_base_3001_contract_scheme: "Improvizovaná špionáž"
 laamp_base_3001_contract_scheme_action: "Podávat zprávy postavě"
 laamp_base_3001_contract_scheme_desc: "Čerstvé zprávy o nedávných událostech odehrávajících se mnoho mil od hlavního sídla bývají pro [Concept('contractors','zadavatele')|E] neocenitelné. Natolik, že se vyplatí koupit je od schopných poutníků.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3001_contract_scheme_desc_general: "$laamp_base_3001_contract_scheme_desc$"
 laamp_base_3001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3001_desc_title: "Důvěryhodní slídilové a podnikaví cizinci,"
 laamp_base_3001_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] dává na vědomí, že přijímá užitečné zprávy ze všech koutů [TaskContract.GetEmployer.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] i z dalekých končin."
 laamp_base_3011_contract_scheme: "Zavraždit nepřítele"
 laamp_base_3011_contract_scheme_action: "Zavraždit"
 laamp_base_3011_contract_scheme_desc: "Někdy [Concept('contractor','zadavatel')|E] potřebuje něčí smrt, ale nechce riskovat, že ji zosnuje osobně, nebo je příliš zaměstnán jinými záležitostmi. Vraždu lze naštěstí snadno zadat správnému druhu lidí.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3011_contract_scheme_desc_general: "$laamp_base_3011_contract_scheme_desc$"
 laamp_base_3011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3011_desc_title: "Čestní žoldnéři pevné vůle,"
 laamp_base_3011_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] nabízí štědrou odměnu lidem bezúhonné pověsti a prokázaných zkušeností za choulostivou a náročnou práci."
 laamp_base_3021_contract_scheme: "Unést nepřítele"
 laamp_base_3021_contract_scheme_action: "Unést"
 laamp_base_3021_contract_scheme_desc: "Vězení může být pro nespokojence a soupeře vystřízlivěním i poučením, zatímco jejich žalářníkovi může přinést zisk či zadostiučinění. Přinejmenším natolik, že se vyplatí riskovat a zaplatit třetí straně, aby jim takovou návštěvu zařídila.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3021_contract_scheme_desc_general: "$laamp_base_3021_contract_scheme_desc$"
 laamp_base_3021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3021_desc_title: "Odhodlaní chytači problémové zvěře,"
 laamp_base_3021_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] hledá diskrétní a schopné lovce, kteří polapí neobvyklou kořist a přivedou ji živou. Nabízí štědrou odměnu."
 laamp_base_3031_contract_scheme: "Podpálit majetek"
 laamp_base_3031_contract_scheme_action: "Spáchat žhářství pro"
 laamp_base_3031_contract_scheme_desc: "Na nehlídaných budovách je báječné, že při dostatečném úsilí #EMP vždy#! shoří. Jsou výtečným nástrojem pro [Concept('contractors','zadavatele')|E], kteří potřebují vyslat jasné poselství, ale chtějí jen škrtnout a dál se nestarat.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3031_contract_scheme_desc_general: "$laamp_base_3031_contract_scheme_desc$"
 laamp_base_3031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3031_desc_title: "Pilní pocestní náležité pověsti,"
 laamp_base_3031_desc: "Za naléhavé vyklizení pozemku se nabízí štědrá odměna. Mlčenlivost je nezbytná. [TaskContract.GetEmployer.GetPrimaryTitle.GetAdjectiveNoTooltip] [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l] [TaskContract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] je místem, kam máte pospíšit."
 laamp_base_3041_contract_scheme: "Vyloupit pokladnici"
 laamp_base_3041_contract_scheme_action: "Vyloupit pokladnici postavy"
 laamp_base_3041_contract_scheme_desc: "Někteří [Concept('contractors','zadavatelé')|E] jsou zkrátka hlupáci, kteří okatě dávají najevo přemíru svého bohatství. K takovému bohatství se lze dostat přímo mnohem snáze než nějakou mizernou #EMP zakázkou#!.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_3041_contract_scheme_desc_general: "$laamp_base_3041_contract_scheme_desc$"
 laamp_base_3041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_3041_desc_title: "Všem pocestným na území [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] a všem tamním poddaným"
 laamp_base_3041_desc: "[TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] připomíná #EMP všem#! tresty za krádež či spiknutí za účelem krádeže i odměny vypsané na podezřelé. Do pokladnice smím vstoupit pouze #EMP já#!."
 laamp_base_3041.tt.chance_for_more: "Můžeš se pokusit #P ukrást ještě více [Concept('gold','zlata')|E]#!"
 laamp_base_4001_contract_scheme: "Opisovat texty"
 laamp_base_4001_contract_scheme_action: "Opisovat pro"
 laamp_base_4001_contract_scheme_desc: "Umění opisovat a překládat rukopisy bývá nevděčné. Dokonce i v učených [Concept('realms','panstvích')|E] množství práce snadno převýší počet kvalifikovaných písařů. Vzdělaný poutník tak nabízí [Concept('task_contracts','zakázkám')|E] jedinečnou příležitost pořídit požadovaný opis.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4001_contract_scheme_desc_general: "$laamp_base_4001_contract_scheme_desc$"
 laamp_base_4001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4001_desc_title: "Vy, kdo chcete uchovat vědění"
 laamp_base_4001_desc: "Hledají se vzdělaní písaři k opisování textů [TaskContract.GetEmployer.GetCulture.GetNameNoTooltip] kultury. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] slibuje spravedlivou odměnu za včasnou práci."
 laamp_base_4011_contract_scheme: "Urovnat teologické spory"
 laamp_base_4011_contract_scheme_action: "Rozsoudit teologické spory pro"
 laamp_base_4011_contract_scheme_desc: "Spory o učení mohou být nesmírně konkrétní a zabývat se přesným výkladem jediného slova, ale také podivně neurčité, například když se přou o vzájemnou neslučitelnost překrývajících se starobylých tradic. Když takové posvátné rozepře vzplanou, mnozí [Concept('contractors','zadavatelé')|E] raději vyšlou třetí stranu, aby je rozsoudila místo nich.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4011_contract_scheme_desc_general: "$laamp_base_4011_contract_scheme_desc$"
 laamp_base_4011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4011_desc_title: "Věrní učedníci, jimž je [TaskContract.GetEmployer.GetFaith.KnowledgeGodName] vzorem,"
 laamp_base_4011_desc: "Učený teolog obdrží štědrou odměnu za urovnání místních náboženských sporů o [TaskContract.GetEmployer.GetFaith.GetAdjective] dogma.\n\nObraťte se na [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier], ale pouze jste-li učenci vážného ducha."
 laamp_base_4021_contract_scheme: "Sepsat učené dílo"
 laamp_base_4021_contract_scheme_action: "Bádat pro"
 laamp_base_4021_contract_scheme_desc: "Učení poutníci s sebou přinášejí jistý nádech tajemna a často i špetku cizokrajnosti. Vynalézaví [Concept('contractors','zadavatelé')|E] se často snaží zachytit něco z jejich pomíjivé moudrosti tím, že si objednají drobné knihy aforismů a mravoučných příběhů.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4021_contract_scheme_desc_general: "$laamp_base_4021_contract_scheme_desc$"
 laamp_base_4021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4021_desc_title: "Učení znalci krásného písemnictví,"
 laamp_base_4021_desc: "Spisovatelé ze všech koutů země nechť se hlásí. [TaskContract.GetEmployer.Custom('ResidenceBuilding')|U] [TaskContract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] v [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] nabízí výdělečnou písařskou práci."
 laamp_base_4031_contract_scheme: "Vyprosit milodar"
 laamp_base_4031_contract_scheme_action: "Žebrat u"
 laamp_base_4031_contract_scheme_desc: "Obdarovávání procházejících učenců dary a mincemi dodává [Concept('contractors','zadavatelům')|E] zdání štědrosti a učenosti, i když je dotyčný učenec musí nejprve trochu #EMP pobídnout#!.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4031_contract_scheme_desc_general: "$laamp_base_4031_contract_scheme_desc$"
 laamp_base_4031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4031_desc_title: "Zbožní světci a ubozí žebráci,"
 laamp_base_4031_desc: "Budiž vám známo, že [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] nabízí [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip] patronát těm, kdo jsou dostatečně zbožní, kultivovaní či učení, aby si jej zasloužili. Hlaste se tam, kde stojí [TaskContract.GetEmployer.Custom('ResidenceBuilding')|l]."
 laamp_base_4041_contract_scheme: "Vnutit talismany"
 laamp_base_4041_contract_scheme_action: "Vnutit tretky postavě"
 laamp_base_4041_contract_scheme_desc: "Kdo může rozhodnout, co je magické, co posvátné a co cizokrajné? Pokud je [Concept('contractor','zadavatel')|E] natolik pošetilý, že tomu uvěří a #EMP zaplatí#! za to, pak to stačí. Nejspíš.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_4041_contract_scheme_desc_general: "$laamp_base_4041_contract_scheme_desc$"
 laamp_base_4041_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_4041_desc_title: "[TaskContract.GetEmployer.GetWomenMen|U] učeného ducha!"
 laamp_base_4041_desc: "Dokážeš rozpoznat, který [TaskContract.GetEmployer.GetFaith.GetAdjectiveNoTooltip] předmět má skutečnou hodnotu? [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] nabízí spravedlivou odměnu, #EMP pokud#! je zboží pravé."
 laamp_base_5031_contract_scheme: "Krást dobytek"
 laamp_base_5031_contract_scheme_action: "Ukrást dobytek postavě"
 laamp_base_5031_contract_scheme_desc: "Stáda koní, skotu, koz, ba i ovcí. Ukradená zvířata přinášejí nesmírný zisk těm, kdo se jich odváží zmocnit, zvlášť když jim to někteří [Concept('contractors','zadavatelé')|E] tolik usnadňují...$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_5031_contract_scheme_desc_general: "$laamp_base_5031_contract_scheme_desc$"
 laamp_base_5031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_5031_desc_title: "Lide z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier],"
 laamp_base_5031_desc: "[TaskContract.GetEmployer.GetTitleAsNameNoTooltip] vám znovu připomíná, že krádež dobytka #EMP bude#! přísně trestána bez ohledu na počet kusů či důvod. Byli jste varováni."
 laamp_base_5051_contract_scheme: "Oloupit bohaté měšťany"
 laamp_base_5051_contract_scheme_action: "Přepadávat obyvatele panství"
 laamp_base_5051_contract_scheme_desc: "[Concept('contractors','Zadavatelé')|E] s obzvláště bohatými hlavními sídly mívají bohaté [Concept('courtiers','dvořany')|E]. Několik ran v zapadlé uličce umožní [Concept('adventurers','dobrodruhům')|E] převést jejich bohatství jinam.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_5051_contract_scheme_desc_general: "$laamp_base_5051_contract_scheme_desc$"
 laamp_base_5051_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_5051_desc_title: "Ctihodní obyvatelé [TaskContract.GetEmployer.GetCapitalLocation.GetTitle.GetBaseNameNoTier],"
 laamp_base_5051_desc: "Mějte se na pozoru, čelíme totiž #EMP záplavě#! drobných krádeží. Při cestě ulicemi si vezměte pevný kyj a po setmění zůstávejte doma. [TaskContract.GetEmployer.GetTitleAsName] se s těmito ničemy vypořádá."
 laamp_base_6001_contract_scheme: "Chránit nevinné"
 laamp_base_6001_contract_scheme_action: "Chránit poddané postavy"
 laamp_base_6001_contract_scheme_desc: "Cesty jsou plné nebezpečí. Bandité, divoká zvířata a nepříznivé počasí sužují [Concept('contractor_possessive','zadavatelovy')|E] poddané, kteří úpěnlivě žádají o pomoc.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6001_contract_scheme_desc_general: "$laamp_base_6001_contract_scheme_desc$"
 laamp_base_6001_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6001_desc_title: "Chraň slabé!"
 laamp_base_6001_desc: "Pracovitý lid z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] potřebuje pomoc. [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] nabízí štědrou odměnu nezištným dobrodruhům."
 laamp_base_contract_schemes.6001.t: "$laamp_base_6001_contract_scheme$"
 laamp_base_contract_schemes.6001.desc: "„Zvířata, násilníci a rváči!“\n\nUž pouhá představa zjevně stačí, aby se [employer.GetTitledFirstNamePossessive] mysl rozrušila.\n\n„Prostý lid [employer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] je tak rozjitřený, že se obávám, že může každou chvíli povstat se zbraní v ruce. Lidé s malými dětmi kárají mé důstojníky a ptají se, proč jsme je neochránili.“"
 laamp_base_contract_schemes.6001.a: "Musíme zajistit jejich bezpečí!"
 laamp_base_contract_schemes.6001.b: "Není času nazbyt."
 laamp_base_contract_schemes.6001.c: "Nesmíme dělat ústupky."
 laamp_base_contract_schemes.6002.t: "$laamp_base_6001_contract_scheme$ – úspěch!"
 laamp_base_contract_schemes.6002.desc: "Tři... čtyři... a právě padl pátý dnešní úlovek: [ROOT.Char.MakeScope.Var('animal_type').GetFlagName]. Pokládám mršinu do vozu právě ve chvíli, kdy přichází [employer.GetTitledFirstName] s několika sloužícími.\n\n„Skvělá práce!“ chválí mě [employer.GetTitledFirstName]. „Už žádný pobitý dobytek ani ztracené děti. Zde máš svou odměnu, a pokud si prostý lid bude znovu stěžovat, vím, koho povolat.“"
 laamp_base_contract_schemes.6002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.6003.t: "$laamp_base_6001_contract_scheme$ – neúspěch!"
 laamp_base_contract_schemes.6003.desc: "„Dost!“ zvolá [employer.GetTitledFirstName] a zavrtí hlavou. „Tak žalostná ukázka síly tu nebyla od dob, kdy jsme cvičili panoše s dřevěnými meči.“\n\n„Můj lid trpí bez ochrany. Snad si nemyslíš, že za takových podmínek bude platit daně?“ ptá se [employer.GetTitledFirstName] posměšně.\n\n„Už jsi mě připravil o dost zlata. Neplýtvej dál mým časem.“"
 laamp_base_contract_schemes.6003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_6011_contract: "$laamp_base_6011_contract_scheme$"
 laamp_base_6011_contract_scheme: "Zachránit krásného poddaného"
 laamp_base_6011_contract_scheme_action: "Zachránit krásného poddaného postavy"
 laamp_base_6011_contract_scheme_desc: "Divočina nezná slitování. Najdi bezmocnou osobu z řad [Concept('contractor_possessive','zadavatelových')|E] poddaných a zachraň ji.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6011_contract_scheme_desc_general: "$laamp_base_6011_contract_scheme_desc$"
 laamp_base_6011_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6011_desc_title: "[TaskContract.GetEmployer.Custom('KnightCulturePluralNoTooltip')|U] pravé ctnosti!"
 laamp_base_6011_desc: "[TaskContract.GetEmployer.GetTitledFirstNamePossessiveNoTooltip] dvůr postrádá jednu z nejkrásnějších osob, která se nevrátila z výpravy do lesů v [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier]. [TaskContract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] dvůr za její záchranu dychtivě nabízí odměnu."
 laamp_base_6011_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje dokončení [Concept('scheme','intriky')|E] [GetScheme('laamp_base_6011_contract_scheme').GetTypeName]"
 laamp_base_contract_schemes.6011.t: "$laamp_base_6011_contract_scheme$"
 laamp_base_contract_schemes.6011.desc: "K táboru se blíží unaveně vyhlížející [employer.GetTitledFirstName]. Doprovázejí [Select_CString( employer.IsFemale, 'ji', 'ho' )] [dummy_gender_soldier.GetWomenMen]. Koně zastavují přímo před mým stanem a já vstávám, abych příchozí přivítal.\n\n„...ta zatracená osoba,“ slyším [employer.GetTitleAsNameNoTooltip|l] zamumlat.\n\n„Dobré jitro, [ROOT.Char.GetFirstNameNoTooltip],“ zdraví mě [employer.GetTitledFirstName] a stírá si pot z čela. „Zdá se, že se v lesích ztratila nesmírně krásná osoba a mí dvořané nepřestanou naříkat, dokud ji nepřivedu zpět.“"
 laamp_base_contract_schemes.6011.a: "Krásná osoba v nesnázích? Vzhůru na pomoc!"
 laamp_base_contract_schemes.6011.b: "Musíme si pospíšit!"
 laamp_base_contract_schemes.6011.c: "Nejlepší bude vyvážený postup."
 laamp_base_contract_schemes.6012.t: "$laamp_base_6011_contract_scheme$ – úspěch!"
 laamp_base_contract_schemes.6012.desc: "„Zpátky!“ Houštinou se nese pronikavý výkřik a já se za ním vydávám.\n\nUprostřed mýtiny stojí [Select_CString( beautiful_peasant.IsFemale, 'jedna z nejkrásnějších žen', 'jeden z nejkrásnějších mužů' )], jaké jsem kdy spatřil. V ruce svírá klacek jako kopí a snaží se držet si odstup od zuřivého zvířete ([ROOT.Char.MakeScope.Var('animal_type').GetFlagName]).\n\nRychlým seknutím čepele zasazuji šelmě ránu. Z těla vystříkne krev, potřísní trávu a zvíře se zhroutí.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U]!“ volá [beautiful_peasant.GetWomanMan] a klesá na kolena."
 laamp_base_contract_schemes.6012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.6012.b: "„Nemusíme se #EMP rozcházet#!.“"
 laamp_base_contract_schemes.6012.b.tt.success: "[beautiful_peasant.GetShortUIName] se cítí poctěn"
 laamp_base_contract_schemes.6012.b.tt.failure: "[beautiful_peasant.GetShortUIName] se cítí uražen"
 laamp_base_6012_success_employer_modifier: "Nevinný zachráněn"
 laamp_base_6012_success_employer_modifier_desc: "Tato postava zaplatila rytířskému dobrodruhovi za záchranu jednoho ze svých půvabnějších poddaných před nebezpečným zvířetem."
 laamp_base_contract_schemes.6013.t: "$laamp_base_6011_contract_scheme$ – neúspěch!"
 laamp_base_contract_schemes.6013.desc: "„Vysvětlíš mi laskavě, co je tohle?“ [employer.GetTitledFirstName] vtrhne do mého stanu a hodí na stůl krví nasáklý šátek.\n\n„Stráže jej našly při hlídce v lesích a je na něm znak, který jistě poznáváš.“ [employer.GetTitledFirstName] si promne obočí. „Teď se musím vypořádat s rozrušenými dvořany a zdrcenými důstojníky. Nečekej, že dostaneš plnou odměnu.“"
 laamp_base_contract_schemes.6013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_6021_contract: "$laamp_base_6021_contract_scheme$"
 laamp_base_6021_contract_scheme: "Účinkovat v divadelní hře"
 laamp_base_6021_contract_scheme_action: "Účinkovat ve hře pro"
 laamp_base_6021_contract_scheme_desc: "Lidé touží spatřit #EMP skutečného#! rytíře. [Concept('contractor','Zadavatel')|E] potřebuje opravdového hrdinu.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6021_contract_scheme_desc_general: "$laamp_base_6021_contract_scheme_desc$"
 laamp_base_6021_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6021_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje dokončení [Concept('scheme','intriky')|E] [GetScheme('laamp_base_6021_contract_scheme').GetTypeName]"
 laamp_base_6021_desc_title: "Hledá se hrdina,"
 laamp_base_6021_desc: "Lidé z [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] připravují divadelní hru podle dávných hrdinských příběhů. [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] zoufale hledá rytířského hrdinu, který splní jejich očekávání."
 laamp_base_contract_schemes.6021.t: "$laamp_base_6021_contract_scheme$"
 laamp_base_contract_schemes.6021.desc.intro: "Tržiště v [ROOT.Char.GetCurrentLocation.GetName] je rušnější než kdy jindy a soubor zpěváků se chystá na představení.\n\n„#EMP Dřevěný#! meč?“ Jedno z dětí se nakloní přes okraj pódia a znechuceně se zašklebí.\n\n"
 laamp_base_contract_schemes.6021.desc.employer_child: "„[employer_child.GetFirstName], to stačí.“ [employer.GetTitledFirstName] pobídne dítě, aby se vrátilo k sobě. „Slíbil[Select_CString( employer.IsFemale, 'a', '' )] jsem ti, že pro hru najdu skutečného hrdinu, a... podívej, kdo právě dorazil.“ [employer.GetFirstNameNoTooltip] se zadívá přímo na mě."
 laamp_base_contract_schemes.6021.desc.random_child: "Zpozornělí sedláci se k dítěti rychle přidají. „Je tohle to nejlepší, co nám může naše vrchnost nabídnout?“\n\nReptání však ustane, jakmile [employer.GetTitledFirstName] vjede na náměstí a zastaví přede mnou koně:"
 laamp_base_contract_schemes.6021.desc.outro: "„Snadný výdělek, nemyslíš? Stačí na ty sedláky udělat dojem.“"
 laamp_base_contract_schemes.6021.a: "Udělejme z toho #EMP nejsnazší#! výdělek."
 laamp_base_contract_schemes.6021.b: "Čím dříve, tím lépe."
 laamp_base_contract_schemes.6021.c: "Tohle by mohla být zábava."
 laamp_base_contract_schemes.6022_6023.common_desc: "„...a pak [Select_CString( ROOT.Char.IsFemale, 'zabila', 'zabil' )] zuřivou šelmu ([ROOT.Char.MakeScope.Var('animal_type').GetFlagName])!“ Bubny sílí, zatímco kráčím po jevišti a snažím se rozpomenout na každou hru, kterou jsem kdy viděl. Se zbraní zdviženou nad hlavou útočím na pestrobarevnou loutku.\n\n"
 laamp_base_contract_schemes.6022.t: "$laamp_base_6021_contract_scheme$ – úspěch!"
 laamp_base_contract_schemes.6022.desc: "$laamp_base_contract_schemes.6022_6023.common_desc$Hlava se skutálí z jeviště a obecenstvo propukne v hlasitý jásot. [employer.GetTitledFirstName] sedí na vyvýšeném pódiu a souhlasně přikyvuje."
 laamp_base_contract_schemes.6022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_6021_success_employer_modifier: "Rytířská hra"
 laamp_base_6021_success_employer_modifier_desc: "Tato postava najala potulného dobrodruha, aby účinkoval v divadelní hře a uspokojil požadavky davu."
 laamp_base_contract_schemes.6023.t: "$laamp_base_6021_contract_scheme$ – neúspěch!"
 laamp_base_contract_schemes.6023.desc: "$laamp_base_contract_schemes.6022_6023.common_desc$Úder se mi nezdaří a meč uvízne ve dřevě. Obecenstvo propukne v smích, který však záhy vystřídá rozhořčení.\n\nOdvážím se pohlédnout k vyvýšenému pódiu a spatřím, jak [employer.GetTitledFirstName] vrtí hlavou."
 laamp_base_contract_schemes.6023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_6031_contract: "$laamp_base_6031_contract_scheme$"
 laamp_base_6031_contract_scheme: "Hájit průchod"
 laamp_base_6031_contract_scheme_action: "Hájit průchod pro"
 laamp_base_6031_contract_scheme_desc: "Hledá se udatný dobrodruh, který bude hájit přechod přes most. [Concept('contractor','Zadavatel')|E] nabízí štědrou odměnu.$laamp_contract_scheme_desc_general_boilerplate$"
 laamp_base_6031_contract_scheme_desc_general: "$laamp_base_6031_contract_scheme_desc$"
 laamp_base_6031_contract_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_base_6031_request: "Tato [Concept('task_contract','zakázka')|E] vyžaduje dokončení [Concept('scheme','intriky')|E] [GetScheme('laamp_base_6031_contract_scheme').GetTypeName]"
 laamp_base_6031_desc_title: "Jsi-li neochvějný, zpozorni!"
 laamp_base_6031_desc: "Most v [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] zůstává bez ochrany. K odrazení banditů je zapotřebí ukázka síly. [TaskContract.GetEmployer.GetTitledFirstNameNoTooltip] odmění každého, kdo je zažene."
 laamp_base_contract_schemes.6031.t: "$laamp_base_6031_contract_scheme$"
 laamp_base_contract_schemes.6031.desc: "[employer.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('employer'))] při průchodu táborem.\n\n„Máme tu nádherné ráno,“ začne [employer.GetTitledFirstName], „dokonalou příležitost ukázat těm ničemům, co dokáže skutečný $knight_culture_player_no_tooltip$. Přímo do [ROOT.Char.GetCurrentLocation.GetName] vede most. Poflakují se kolem něj všemožní bídáci, hlupáci a pošetilci.“\n\n„Někdo by se o ně měl postarat.“"
 laamp_base_contract_schemes.6031.a: "Zlomím tři sta kopí!"
 laamp_base_contract_schemes.6031.b: "Zabere to několik dní."
 laamp_base_contract_schemes.6031.c: "K mostu!"
 laamp_base_contract_schemes.6032.t: "$laamp_base_6031_contract_scheme$ – úspěch!"
 laamp_base_contract_schemes.6032.desc: "Zadýchaně poplácám koně po šíji. Klid, už je po všem.\n\nPoslední dva týdny bylo hlídání tohoto mostu mým jediným úkolem a má zbroj se noc co noc leskla v měsíčním světle. Moře zlomených kopí odklizených stranou svědčí o mém výkonu.\n\n„[ROOT.Char.GetFirstNameNoTooltip],“ zdraví mě [employer.GetTitledFirstName] a posílá několik svých [dummy_soldier.GetWomenMen], aby posbírali kořist, „to je ale podívaná.“"
 laamp_base_contract_schemes.6032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.6033.t: "$laamp_base_6031_contract_scheme$ – neúspěch!"
 laamp_base_contract_schemes.6033.desc: "#EMP „Áááá!“#!\n\nKlesám na kolena a po lokti mi stéká krev.\n\n„Nechte [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] tam,“ slyším jednoho z banditů zamumlat, než odejdou. „Nemá cenu bojovat s #EMP $knight_culture_player_no_tooltip$#!. Někdo už si [Select_CString( ROOT.Char.IsFemale, 'ji', 'ho' )] vyzvedne.“\n\nMá hlava... všechno pomalu pohasíná."
 laamp_base_contract_schemes.6033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0001.t: "Bavení [employer.GetTitledFirstNamePossessiveNoTooltip] dvora"
 laamp_base_contract_schemes.0001.desc: "Usedlí vládci jako [employer.GetFirstName] běžně hostí významné pocestné, jako jsem já. Za několik darů a slušné ubytování poskytují [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] jako my zábavu, zprávy i vítané rozptýlení pro četné dvořany.\n\nSamozřejmě pouze #EMP pokud#! si já a mí [ROOT.Char.Custom('GetCourtierTypePlural')|l] dokážeme svými příběhy zasloužit stravu a nocleh."
 laamp_base_contract_schemes.0001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0002.t: "$laamp_base_contract_schemes.0001.t$ – úspěch!"
 laamp_base_contract_schemes.0002.desc: "[employer.GetFirstNamePossessive] dvořané byli ze mě i mé družiny v posledních měsících téměř u vytržení.\n\nDen za dnem a noc za nocí jsme jim plnili hlavy fantastickými příběhy a sobě břicha vybranými pokrmy, takže dobrý [employer.GetTitleAsNameNoTooltip] je s naším vystoupením více než spokojen.\n\nVšechno dobré však jednou končí a nejlepší bude odejít na vrcholu."
 laamp_base_contract_schemes.0002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0003.t: "$laamp_base_contract_schemes.0001.t$ – neúspěch!"
 laamp_base_contract_schemes.0003.desc: "Tihle nevědomí psi! Pozvou nás sem, k jídlu nám nedají nic než #EMP splašky#!, ustelou nám na slámě, která byla stará už za mládí mého prarodiče, a rýpají do každého našeho příběhu z cest.\n\nZdejší pohostinnost je... vlastně jaká pohostinnost?\n\nA všechno bylo k ničemu. [employer.GetTitledFirstName] zuří a před žalářem nás zjevně chrání jen přesvědčení, že bychom nadělali víc starostí, než za kolik stojíme.\n\nNáš čas v [employer.GetCapitalLocation.GetTitle.GetNameNoTier] skončil."
 laamp_base_contract_schemes.0003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0011.t: "Napravení [employer.GetTitleAsNamePossessiveNoTooltip] pověsti"
 laamp_base_contract_schemes.0011.desc: "Není žádným tajemstvím, že [employer.GetTitledFirstNamePossessive] pověst by mohla být lepší. Nespokojení vazalové, znepokojivé řeči o tyranském jednání a nedostatek těžko uchopitelné prestiže. To vše může svědčit o méně pevném sevření moci, než by si většina [employer.Custom('LadiesLords')] přála.\n\nZaplatit někomu za vyjasnění takových nedorozumění samozřejmě nebude levné. Přinejmenším nebudu-li mít co říci k ceně."
 laamp_base_contract_schemes.0011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0012.t: "$laamp_base_contract_schemes.0011.t$ – úspěch!"
 laamp_base_contract_schemes.0012.desc: "Je až překvapivé, jak moc dokáže několik slov pronesených v tichém koutě změnit situaci. Tu něco pošeptat, onde něco poznamenat, při večeři obhájit nějaký čin...\n\nOd zeměpána by to samozřejmě neznělo ani zdaleka stejně. Příliš mnoho moci, příliš mnoho v sázce a příliš velké riziko neupřímnosti. Ale [Select_CString( ROOT.Char.IsFemale, 'skromná', 'skromný' )] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')], který se se svou družinou na chvíli zastaví u dvora během putování světem? Inu...\n\nTo je zcela jiná hra.\n\nNetřeba dodávat, že [employer.GetTitledFirstName] je s naším úsilím více než spokojen, a my se musíme vydat dál."
 laamp_base_contract_schemes.0012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0013.t: "$laamp_base_contract_schemes.0011.t$ – neúspěch!"
 laamp_base_contract_schemes.0013.desc: "Jak jsem v tomhle měl #EMP vůbec#! uspět? Jsem jen [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] na cestách, bez jakéhokoli vlivu na lid či šlechtu.\n\nByl to naprosto absurdní úkol, přesto je [employer.GetTitledFirstName] odhodlán[Select_CString( employer.IsFemale, 'a', '' )] svalit #EMP na mě#! odpovědnost za to, že jej vlastní lidé viní z domnělých křivd a teoretického zneužívání moci.\n\n[employer.GetCapitalLocation.GetTitle.GetNameNoTier] už není pro mou družinu bezpečným místem."
 laamp_base_contract_schemes.0013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0021.t: "Přátelé na vysokých místech"
 laamp_base_contract_schemes.0021.desc: "[employer.GetTitledFirstName] je [Select_CString( employer.IsFemale, 'osamělá', 'osamělý' )] [employer.GetWomanMan] v mocenském postavení, a právě proto je pro [employer.GetHerHim] paradoxně obtížné potkat někoho, kdo se nesnaží něco získat.\n\nMá společnost má být jiná, příležitostí k opravdovému vztahu. Samozřejmě není. Chci stejně mnoho jako kterýkoli jiný příživník, ne-li více, ale na nějaký čas je příjemné této představě věřit.\n\nJá a mí [ROOT.Char.Custom('GetCourtierTypePlural')|l] budeme pryč dříve, než [employer.GetSheHe] začne cokoli tušit."
 laamp_base_contract_schemes.0021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0022.t: "$laamp_base_contract_schemes.0021.t$ – úspěch!"
 laamp_base_contract_schemes.0022.desc: "Jak jsem očekával, [employer.GetTitledFirstName] podlehl[Select_CString( employer.IsFemale, 'a', '' )] mému kouzlu, volání divočiny i romantice života potulného [ROOT.Char.Custom('GetLaampDescribeTypeSelf')].\n\nKonečně se chystáme k odjezdu. [employer.GetFirstNameNoTooltip] nás nerad[Select_CString( employer.IsFemale, 'a', '' )] vidí odcházet, ale je vděčn[Select_CString( employer.IsFemale, 'á', 'ý' )] za chvíli úlevy, kterou naše společnost přinesla.\n\nSamozřejmě z toho netěží jen jedna strana. Získal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem pro nás bohatou odměnu v darech i zásobách pro družinu, která více než ospravedlňuje čas strávený zdejším prodléváním."
 laamp_base_contract_schemes.0022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0023.t: "$laamp_base_contract_schemes.0021.t$ – neúspěch!"
 laamp_base_contract_schemes.0023.desc: "Možná... možná [employer.GetTitledFirstName] nakonec není tak osaměl[Select_CString( employer.IsFemale, 'á', 'ý' )]? Mou společnost rozhodně nechce. Prý jsem „špinavý páchnoucí [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] s [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('employer'))] vzezřením zločince“.\n\nTa drzost! Nejdříve mě pozvat a potom se mnou zacházet... #EMP takhle#!. Přinejmenším nezdvořilé a rozhodně nedůstojné někoho údajně urozeného.\n\nNetřeba dodávat, že odměnu nedostanu a já i má družina musíme do soumraku opustit [employer.GetCapitalLocation.GetTitle.GetNameNoTier]."
 laamp_base_contract_schemes.0023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0031.t: "Neutrální strana"
 laamp_base_contract_schemes.0031.desc: "Nekonečné hašteření malicherných místních patří k nemnohým zkušenostem, které sdílejí světští vládci i [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] jako já.\n\nDokáže to člověka dohnat k šílenství, nebo alespoň k takovému zoufalství, že se obrátí o pomoc na cizince. Přesně to učinil[Select_CString( employer.IsFemale, 'a', '' )] i [employer.GetTitledFirstName].\n\nPokud já a mí [ROOT.Char.Custom('GetCourtierTypePlural')|l] uklidníme některé z rozhněvanějších poddaných, čeká nás štědrá odměna."
 laamp_base_contract_schemes.0031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0032.t: "$laamp_base_contract_schemes.0031.t$ – úspěch!"
 laamp_base_contract_schemes.0032.desc: "Místní problémy bývají malicherné. Pro jejich účastníky samozřejmě ne, ale člověk zvenčí, který nemá na jejich nekonečných hádkách žádný vlastní zájem, je obvykle dokáže snadno vyřešit.\n\nNemohu tvrdit, že jsem uspokojil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] #EMP všechny#!, ale to ani nebylo mým úkolem. Stačilo je uklidnit natolik, aby byl[Select_CString( employer.IsFemale, 'a', '' )] [employer.GetTitledFirstName] spokojen[Select_CString( employer.IsFemale, 'á', 'ý' )]. A spokojenost je zjevně dostatečná k otevření měšce.\n\nDobře odvedená práce."
 laamp_base_contract_schemes.0032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0033.t: "$laamp_base_contract_schemes.0031.t$ – neúspěch!"
 laamp_base_contract_schemes.0033.desc: "Tihle zabednění pekelníci jsou jednoduše nesnesitelní!\n\nŽádný živý [ROOT.Char.GetWomanMan] by nedokázal vyřešit jejich nekonečný seznam problémů, svárů a hraničních sporů. Jsem přece [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')], zatraceně, ne nějaký bezvýznamný úředníček. [employer.GetTitledFirstName] ovšem mé nesnáze vůbec nezajímají. Z jeho pohledu jde pouze o nedostatek schopností a o nic jiného.\n\n„Za větší schopnosti by přišla odměna. Jenže je nemáš, takže nedostaneš nic. A teď ven.“"
 laamp_base_contract_schemes.0033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.0034.t: "$laamp_base_contract_schemes.0031.t$ – na cestu"
 laamp_base_contract_schemes.0034.desc: "S [employer.GetTitledFirstNamePossessive] pověřovací listinou v ruce vyrážíme na cestu.\n\nNejprve zamíříme do [destination_3.GetNameNoTier], poté do [destination_2.GetNameNoTier] a nakonec se vrátíme do [destination_1.GetNameNoTier].\n\nZbývá jen rozhodnout, zda vyrazíme nalehko, nebo v plném počtu."
 laamp_base_contract_schemes.0034.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E] je třeba:\n$EFFECT_LIST_BULLET$Uspět ve zkoušce [Concept('skill','dovednosti')|E] v každém cíli\n$EFFECT_LIST_BULLET$Pro výsledek $label_success_standard$ musíš uspět ve dvou zkouškách\n$EFFECT_LIST_BULLET$Pokud uspěješ ve všech třech zkouškách, získáš výsledek $label_success_critical$\n$EFFECT_LIST_BULLET$@warning_icon! #N Neúspěch v kterékoli zkoušce okamžitě znamená neúspěch celé $game_concept_task_contract$#!\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Každou [Concept('skill','dovednost')|E] můžeš během jedné [Concept('task_contract','zakázky')|E] vyzkoušet pouze jednou#!#!"
 laamp_base_contract_schemes.0034.tt.destination_list: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_3.GetNameNoTier], poté do [destination_2.GetNameNoTier] a nakonec do [destination_1.GetNameNoTier]"
 laamp_base_contract_schemes.0034.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.0034.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.0041.t: "Věř mi"
 laamp_base_contract_schemes.0041.desc: "Ubohý, důvěřivý [employer.GetFirstName]. Možná je [employer.GetTitleAsNameNoTooltip], ale nemá o nic více rozumu než průměrný opilec z poslední zapadlé krčmy. Jen je bohatší.\n\nOtevřené pozvání významným pocestným, aby nějaký čas pobyli v jeho domácnosti, je veškerou příležitostí, kterou já a mí [ROOT.Char.Custom('GetCourtierTypePlural')|l] potřebujeme. Než [employer.GetSheHe] pochopí, co se děje, bude majetek dobrého [employer.GetTitleAsNamePossessiveNoTooltip] v mé kapse a my budeme pryč."
 laamp_base_contract_schemes.0041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.0041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.0041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.0041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.0041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.0042.t: "$laamp_base_contract_schemes.0041.t$ – úspěch!"
 laamp_base_contract_schemes.0042.desc: "Jak nádherné dary rozdává [employer.GetTitledFirstName], když má náladu! Můj čas se rozhodně vyplatil, i když pro [employer.GetHerHim] už možná #EMP tolik#! ne.\n\nCo naplat. Hlupák a jeho peníze spolu dlouho nezůstanou.\n\nBrzy na to samozřejmě přijde, nebo se někomu konečně podaří dobrému [employer.GetTitleAsNameNoTooltip|l] vysvětlit, co se stalo, ale na tom nezáleží. Své jsme dostali a před rozbřeskem budeme pryč."
 laamp_base_contract_schemes.0042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.0043.t: "$laamp_base_contract_schemes.0041.t$ – neúspěch!"
 laamp_base_contract_schemes.0043.desc: "[employer.GetTitledFirstName] má víc rozumu, než se zdá! Nevím, co nás prozradilo. Pohled špatným směrem, podezřelá věta nebo úšklebek v nevhodnou chvíli. Každopádně nás odhalil[Select_CString( employer.IsFemale, 'a', '' )].\n\nOd tohoto [employer.GetWomanMan] žádné mince nedostaneme a skončilo i naše ubytování.\n\nNa rozdíl od [employer.GetFirstNameNoTooltip] nejsem žádný hlupák a poznám, když se vítr obrátí proti mně. Já a mí [ROOT.Char.Custom('GetCourtierTypePlural')|l] zmizíme z [employer.GetCapitalLocation.GetTitle.GetNameNoTier] do hodiny."
 laamp_base_contract_schemes.0043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1001.t: "Hon na zločince"
 laamp_base_contract_schemes.1001.desc: "„Tahle banda...“ [employer.GetTitledFirstName] znechuceně nakrčí nos, „#EMP nespokojenců#! napadá má soukromá panství. Pálí, zabíjejí a kradou téměř beztrestně a vždy uniknou dříve, než je mí družiníci stačí spoutat železy, která si tak #EMP náležitě#! zaslouží.“\n\nPřikyvuji. Ta banda musí být pořádně mazaná, když na ni byla vypsána soukromá odměna.\n\n„Přiveď mi tu chátru dříve, než lehne popelem další můj majetek, a dostaneš zaplaceno.“"
 laamp_base_contract_schemes.1001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1002.t: "$laamp_base_contract_schemes.1001.t$ – úspěch!"
 laamp_base_contract_schemes.1002.desc: "„Dobře, #EMP dobře#!,“ pochechtává se [employer.GetFirstName] a bezmyšlenkovitě si pohrává s nožem. „Výtečná práce, [ROOT.Char.GetFirstNameNoTooltip]. Ty i tvá družina stojíte za každou minci v tom měšci.“\n\nV klecích za zády postavy [employer.GetTitleAsNameNoTooltip] sedí ztlučení zajatí bandité. Když byli na svobodě, muselo být vzrušující pálit majetek tak mocné osoby, krást její bohatství a vodit ji za nos, ale všechno dobré jednou končí.\n\nOdcházím s penězi v ruce. Tito nešťastní bandité brzy poznají skutečnou mzdu hříchu."
 laamp_base_contract_schemes.1002.a: "Zdá se, že [employer.GetTitleAsNameNoTooltip] dostává za své peníze plnou protihodnotu."
 laamp_base_contract_schemes.1003.t: "$laamp_base_contract_schemes.1001.t$ – neúspěch!"
 laamp_base_contract_schemes.1003.desc: "„#EMP Tys také selhal[Select_CString( ROOT.Char.IsFemale, 'a', '' )]?!#!“ křičí [employer.GetFirstName] bez sebe vzteky. „Copak mě nikdo nedokáže zbavit těch odporných banditů? Musím to udělat osobně a jako [employer.GetTitleAsNameNoTooltip] si potřísnit [employer.Custom('HandHands')] krví nějakého psaneckého ničemy?“\n\nRaději se kouckého ničemyšu do rtu. Dobře si uvědomuji, že slovní výprask mi sice nic nevynese, ale alespoň neskončí žalářem. Snad.\n\n„Nuže? Na co čekáš? Zmiz mi z očí, ty [ROOT.Char.Custom('GetLaampDescribeTypeInsult')]! Najdu si na své problémy někoho #EMP jiného#!. Někoho #EMP schopného#!.“"
 laamp_base_contract_schemes.1003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1004.t: "Přines mi [Select_CString( recidivist.IsFemale, 'její', 'jeho' )] hlavu"
 laamp_base_contract_schemes.1004.desc: "„Tahle banda...“ [employer.GetTitledFirstName] znechuceně nakrčí nos, „#EMP nespokojenců#! napadá má soukromá panství. Pálí, zabíjejí a kradou téměř beztrestně a vždy uniknou dříve, než je mí družiníci stačí spoutat železy, která si tak #EMP náležitě#! zaslouží.“\n\nPřikyvuji. Ta banda musí být pořádně mazaná, když na ni byla vypsána soukromá odměna.\n\n„Vede je [recidivist.GetFirstNameNicknamed]. Přines mi [Select_CString( recidivist.IsFemale, 'její', 'jeho' )] hlavu dříve, než nadobro unikne, a dostaneš zaplaceno.“"
 laamp_base_contract_schemes.1004.tt.destination_list: "Okamžitě se vydáš do [destination_1.GetBaseNameNoTier], poté do [destination_2.GetBaseNameNoTier] a nakonec do [destination_3.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1004.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E] je třeba:\n$EFFECT_LIST_BULLET$Získat proti postavě [recidivist.GetFirstName] #P 2#! vítězné body\n$EFFECT_LIST_BULLET$Vítězné body lze získávat po 1 až 2 těmito způsoby:\n$TAB$$EFFECT_LIST_BULLET$V [Concept('single_combat_duel','souboji')|E]\n$TAB$$EFFECT_LIST_BULLET$Zkouškou [Concept('prowess','udatnosti')|E], pokud nemůžeš bojovat osobně\n$TAB$$EFFECT_LIST_BULLET$Zkouškou [Concept('martial','válečnické dovednosti')|E]\n$TAB$$EFFECT_LIST_BULLET$Nasazením svých [Concept('men_at_arms','ozbrojenců')|E], kterých musíš mít alespoň [EmptyScope.ScriptValue('laamp_base_contract_schemes_1301_min_troops_value')|0] a žádní z nich nesmějí být povoláni, jinak tato možnost nebude dostupná\n$EFFECT_LIST_BULLET$Dostaneš #P 3 pokusy#! zabít svůj cíl. Poté uprchne a obdržíš výsledek $label_failure_standard$#!"
 laamp_base_contract_schemes.1004.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.1004.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.1011.t: "Najatá pěst"
 laamp_base_contract_schemes.1011.desc: "„Mé požadavky jsou prosté,“ vysvětluje [employer.GetFirstName]. „V růžové zahradě zvané [employer.GetCapitalLocation.GetTitle.GetNameNoTier] se najde několik trnů a chci, abys tyto... pichlavé existence odstranil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]. Nemohu se jich zbavit otevřeně, takže se o ně postaráš za mě.“\n\nTázavě si přejedu palcem po krku.\n\n„Ne, ne,“ upřesňuje zadavatel. „Žádné vážné krveprolití. Jen je drž zticha, ale nezabíjej je, dokud nepochopí, co znamená urazit [employer.GetTitleAsNameNoTooltip].“\n\nZdá se to dost jednoduché."
 laamp_base_contract_schemes.1011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1012.t: "$laamp_base_contract_schemes.1011.t$ – úspěch!"
 laamp_base_contract_schemes.1012.desc: "„Skvělá práce, [ROOT.Char.GetFirstNameNoTooltip]! Zahrada v [employer.GetCapitalLocation.GetTitle.GetNameNoTier] je nádherně, blaženě tichá a já mohu v noci o něco klidněji spát.“\n\n[employer.GetSheHe|U] mi hodí měšec stříbra.\n\n„Až budeš příště projíždět zdejším krajem, určitě se u nás zastav! Jistě najdeme vhodné ubytování, nemluvě o vhodném #EMP zaměstnání#!, pro tak [Select_CString( ROOT.Char.IsFemale, 'podnikavou', 'podnikavého' )] [ROOT.Char.Custom2('GetYoungOld',employer)] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')].“"
 laamp_base_contract_schemes.1012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.1013.t: "$laamp_base_contract_schemes.1011.t$ – neúspěch!"
 laamp_base_contract_schemes.1013.desc: "„Měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsi jediný úkol, [ROOT.Char.GetFirstNameNoTooltip],“ povzdechne si [employer.GetFirstNameNoTooltip]. „Umlčet několik hubatých trnů, udržet je pár měsíců zticha a pak se vrátit pro své stříbro.“\n\n[ROOT.Char.Custom('MaskFace')|U] zůstává bez výrazu. Je to ponižující, ale nejlepší bude nechat [employer.GetTitleAsNameNoTooltip] vyjádřit rozhořčení slovy, než riskovat, že je projeví silou zbraní.\n\n„Možná jsem blázen, když jsem od někoho, jako je [ROOT.Char.Custom('GetLaampDescribeTypeInsult')] tvého ražení, čekal něco lepšího. Nedá se nic dělat.“\n\nNastane odmlka a já čekám, zda [employer.GetWomanMan] ještě něco dodá.\n\n„Můžeš odejít. #EMP Hned#!, prosím.“"
 laamp_base_contract_schemes.1013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1021.t: "[ROOT.Char.Custom('MistressMaster')|U] výcviku"
 laamp_base_contract_schemes.1021.desc: "[employer.GetFirstNamePossessive] osobní vojsko už teď nahání hrůzu, ale jen málokterý [employer.GetTitleAsNameNoTooltip] se spokojí s tím, že nahání #EMP pouhou hrůzu#!. Páteří [employer.GetPrimaryTitle.GetDefinitiveName] je koneckonců stejně jako ve většině panství vojsko.\n\nProhlídka jeho výstroje a rozhovory s nejlepšími bojovníky jsou poučné. Přinejmenším natolik, abych poznal[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že je zde ještě mnoho práce."
 laamp_base_contract_schemes.1021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1022.t: "$laamp_base_contract_schemes.1021.t$ – úspěch!"
 laamp_base_contract_schemes.1022.desc: "Pohled na sevřené šiky [employer.GetTitledFirstNamePossessive] vojska mě naplňuje hřejivým pocitem osobního uspokojení. Ano, byli bojovníky už před mým příchodem, ale můj výcvik z nich jistě učinil hrdiny.\n\nZadavatel je očividně spokojený a se srdečným smíchem mě plácne po zádech.\n\n„Výtečná práce, [Select_CString( ROOT.Char.IsFemale, 'vznešená', 'vznešený' )] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')]! Vzal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsi surové železo a vrátil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] mi ocel. Tvá odměna čeká u brány.“"
 laamp_base_contract_schemes.1022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.1023.t: "$laamp_base_contract_schemes.1021.t$ – neúspěch!"
 laamp_base_contract_schemes.1023.desc: "Jen stěží mě lze vinit za tyhle... tyhle #EMP odpadlíky#! a jejich nekázeň!\n\nJsou to [employer.GetTitledFirstNamePossessive] vojáci, ale jakmile se jejich [employer.Custom('MistressMaster')] vyplácející žold ztratí z dohledu, veškerá kázeň se rozpadne a oni se promění v hlučnou plenící hordu kobylek, která pozře každý kousek jídla a každou kapku pití na dosah.\n\nJejich velitelé samozřejmě svádějí všechno na mě. Mé podivné metody a cizokrajné způsoby vedení války prý zmátly prosté mysli jim svěřených družiníků.\n\nHájil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem svou nevinu, jak nejlépe jsem mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )], ale [employer.GetFirstNameNoTooltip] mě nechce poslouchat. Za nic z toho nedostanu zaplaceno."
 laamp_base_contract_schemes.1023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1031.t: "Posádková služba"
 laamp_base_contract_schemes.1031.desc: "Poskytnout několik dalších mečů k ochraně [employer.GetTitledFirstNamePossessive] držav je... stěží nejzajímavější práce, ale alespoň je stálá.\n\nNavíc pokud jde o zbraně, #EMP vzrušující#! práce nebývá vždy tou nejžádanější. Na bojišti jsou postradatelní žoldnéři vždy první vrženi do vřavy, ale za hradbou? Tam se z pevných bojovníků dělá potrava pro meče jen těžko.\n\n„...samozřejmě neočekáváme žádné vážné potíže, ale přesto jste zde pro jistotu. Je všechno jasné?“ dokončí [employer.GetTitleAsNameNoTooltip]. Trhnutím se vracím k rozhovoru a přikyvuji."
 laamp_base_contract_schemes.1031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1032.t: "$laamp_base_contract_schemes.1031.t$ – úspěch!"
 laamp_base_contract_schemes.1032.desc: "„Výtečná práce, [ROOT.Char.GetFirstNameNoTooltip]!“ zajásá [employer.GetFirstName]. „Mí špehové hlásí, že tvá prvotřídní obrana této pevnosti odradila vetřelce, kterých jsem se obával[Select_CString( employer.IsFemale, 'a', '' )].“\n\n[employer.GetTitleAsNameNoTooltip] mě plácne po zádech.\n\n„Asi se jim nechtělo měřit síly s někým tak statným, jako jsi ty, co? Tvé služby oceňuji a odměna je na cestě.“\n\nVděčně přikyvuji. Dlouhý odpočinek mi přišel vhod, ale jsem rád[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že skončil."
 laamp_base_contract_schemes.1032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.1033.t: "$laamp_base_contract_schemes.1031.t$ – neúspěch!"
 laamp_base_contract_schemes.1033.desc: "„Měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsi jen hlídat tohle místo, ty nevědomý [ROOT.Char.Custom('GetLaampDescribeTypeInsult')]! Podívej se na ně! Z každého zatraceného okna se valí kouř. #EMP Připadá#! ti snad, že je to tady hlídané?“ vyje [employer.GetTitledFirstName].\n\nJá... nevím, co se stalo. Byli jsme tady, drželi jsme hlídku, byli jsme ostražití... nebo ne? Proklouzli vetřelci přes hradby, nebo branou? Ať tak či onak, rozsah požárů, které dokázali založit, je ostudný.\n\nRozzuřený [employer.GetTitleAsNameNoTooltip] nechce slyšet žádné mé výmluvy ani námitky. Bez okolků nás vystrčí z nádvoří a veškerá naděje na odměnu už dávno pohasla."
 laamp_base_contract_schemes.1033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1041.t: "Přepadávání pocestných"
 laamp_base_contract_schemes.1041.desc: "[employer.GetFirstName|U] musí být skutečně nedbalý [employer.GetTitleAsNameNoTooltip]. Jen si představ, že někdo zveřejní takovou prosbu o pomoc!\n\n[Select_CString( employer.IsFemale, 'Její', 'Jeho' )] ztráta, náš zisk. Já a má družina už prozkoumáváme nejrušnější vedlejší cesty, kde začneme chystat léčky. Obereme kupce do poslední mince a zmizíme stejně rychle, jako jsme přišli.\n\nTéměř už cítím vůni mincí."
 laamp_base_contract_schemes.1041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.1041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.1041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.1041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.1041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.1042.t: "$laamp_base_contract_schemes.1041.t$ – úspěch!"
 laamp_base_contract_schemes.1042.desc: "Přesně podle plánu. [employer.GetTitledFirstName] nedokáže ochránit své kupce ani jejich bohatství.\n\nKaždá ukořistěná mince dodává naší družině odvahu a tamní karavany jsou stále nervóznější. Nasytili jsme se zlatem této země natolik, že karavany už viditelně zpomalují, hledají jiné trasy, nebo se obchodu zde zcela vyhýbají.\n\nTo bohužel znamená konec naší zdejší činnosti. Je důležité zmizet, dokud nám štěstí přeje a [employer.GetTitleAsName] nás stále nedokáže dopadnout."
 laamp_base_contract_schemes.1042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.1043.t: "$laamp_base_contract_schemes.1041.t$ – neúspěch!"
 laamp_base_contract_schemes.1043.desc: "[employer.GetTitledFirstName] má cesty v těchto zemích pod #EMP mnohem#! pevnější kontrolou, než jsme čekali.\n\nJá a má družina jsme připravovali jednu léčku za druhou a znovu a znovu čekali v úkrytu, ale karavany buď vůbec nepřijely, nebo měly tak silnou ochranu, že nestály za útok.\n\nTěch několik střetů, do nichž se #EMP přece jen#! pustíme, je krvavých a naprosto nevýnosných.\n\nČím dříve opustíme tuto prokletou zemi, tím lépe. Zdá se, že [employer.GetFirstNameNoTooltip] s tím naprosto souhlasí."
 laamp_base_contract_schemes.1043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.1044.t: "$laamp_base_contract_schemes.1041.t$"
 laamp_base_contract_schemes.1044.desc: "[employer.GetFirstName|U] musí být skutečně nedbalý [employer.GetTitleAsNameNoTooltip]. Jen si představ, že někdo zveřejní takovou prosbu o pomoc a #EMP neočekává#!, že přiláká další potíže!\n\n[Select_CString( employer.IsFemale, 'Její', 'Jeho' )] ztráta, náš zisk. Já a má družina už prozkoumáváme nejrušnější vedlejší cesty, kde začneme chystat léčky. Nejpřirozenějším cílem se zdá být cesta mezi [destination_1.GetBaseNameNoTier] a [destination_2.GetBaseNameNoTier].\n\nObereme kupce a pocestné do poslední mince a uprchneme do noci stejně rychle, jako jsme přišli.\n\nTéměř už cítím vůni mincí."
 laamp_base_contract_schemes.1044.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.1044.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.1044.tt.destination_list: "Okamžitě se vydáš do [destination_1.GetBaseNameNoTier] a poté budeš pokračovat do [destination_2.GetBaseNameNoTier]"
 laamp_base_contract_schemes.1044.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E] je třeba:\n$EFFECT_LIST_BULLET$Docestovat do konečného cíle\n$EFFECT_LIST_BULLET$Během cesty uspět proti jiným pocestným ve [Concept('skill','zkouškách dovedností')|E] zaměřených na [Concept('prowess','udatnost')|E], [Concept('martial','válečnickou dovednost')|E] nebo [Concept('intrigue','pletichářskou dovednost')|E]\n$EFFECT_LIST_BULLET$Získat libovolné množství [Concept('gold','zlata')|E] a dosáhnout výsledku $label_success_standard$#!"
 laamp_base_contract_schemes.1044.tt.number_of_encounters: "#TUT Narazíš až na [task_contract.MakeScope.Var('encounters_max').GetValue|0] možných obětí#!"
 laamp_base_contract_schemes.1044.tt.path_warning: "#TUT Prodloužení trasy ti nepřinese více možných obětí, ale její zkrácení může snížit získanou částku#!"
 laamp_base_contract_schemes.2001.t: "Daně, desátky a mýta"
 laamp_base_contract_schemes.2001.desc: "„...a samozřejmě také mimořádnou pozemkovou daň. Je všechno jasné?“ protahuje [employer.GetTitledFirstName]. Seznam chybějících poplatků, dávek a všemožných dalších cel je dlouhý, ale jejich výběr zní dost jednoduše.\n\n„Dobře, #EMP dobře#!! Když důvěřuji tobě místo svých obvyklých výběrčích, podstupuji jisté riziko, ale doufám, že těm budižkničemům ukážeš, jak se to dělá, a připomeneš mým poddaným, že [employer.GetFaith.WealthGodName] budí bázeň. Odveď svou práci poctivě, rychle a dobře a dostaneš více než štědrou odměnu.“\n\nNa okamžik to vypadá, že budou následovat další pokyny, ale [employer.GetFirstNameNoTooltip] mě mávnutím pošle ven z pracovny."
 laamp_base_contract_schemes.2001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2002.t: "$laamp_base_contract_schemes.2001.t$ – úspěch!"
 laamp_base_contract_schemes.2002.desc: "„Výtečná práce, [ROOT.Char.GetFirstNameNoTooltip]!“ zajásá [employer.GetFirstName] a spokojeně si pohvizduje, zatímco má družina přináší jeden pytel dlouho dlužných daní za druhým.\n\n„Mince i zboží jsou samozřejmě znamenité, ale snad to mé výběrčí naučí, aby si napříště své práce #EMP vážili#!.“\n\nSpokojeně přikyvuji s vědomím, že [employer.GetTitleAsNamePossessiveNoTooltip] vděčnost znamená rychlé vyplacení odměny. Těžký měšec, který ke mně o chvíli později přiletí, přijímám s největší radostí."
 laamp_base_contract_schemes.2002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2003.t: "$laamp_base_contract_schemes.2001.t$ – neúspěch!"
 laamp_base_contract_schemes.2003.desc: "„Hlupáku! Tohle není ani polovina toho, co jsi #EMP měl#! vybrat!“ zahřmí [employer.GetTitledFirstName].\n\n„Kdybych nenechal prohledat tvůj ubohý tábůrek odshora dolů, myslel bych si, že mě okrádáš, ale je zřejmé, že jde pouze o neschopnost,“ [employer.GetSheHe] se sotva zastaví, aby popadl dech, „takže [employer.Custom('Saying_1p_SightAway')], než těch pár mincí, které se ti skutečně podařilo vybrat, utratím za [employer.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|l] nejmizernější šibenici!“\n\nTato tiráda ve mně probouzí vztek a při snaze jej potlačit mi čelist skřípe v kloubu.\n\nTeď není čas na boj. Ne dokud ještě mohu odejít s hlavou na krku."
 laamp_base_contract_schemes.2003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2004.t: "Co náleží [employer.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.2004.desc: "[employer.GetTitledFirstNamePossessive] zástupce přejde rychle k věci. Město [destination_1.GetBaseNameNoTier] podle všeho nezaplatilo mimořádnou daň, kterou uložil dobrý [employer.GetTitleAsNameNoTooltip].\n\nObyvatelé se dalším požadavkům vzepřeli, ale do otevřeného povstání se #EMP zatím#! zcela nepustili. [employer.GetFirstNameNoTooltip] chce, co mu náleží, ale obává se možných nákladů přímé vzpoury.\n\nNeutrální třetí strana poslouží jako vhodná zástěrka k tomu, aby byl vůdce vzdorujícího sídla, [person_a.GetTitledFirstName], zastrašen a přinucen k poslušnosti.\n\nZbývá už jen vydat se do [destination_1.GetBaseNameNoTierNoTooltip]."
 laamp_base_contract_schemes.2004.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.2004.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.2004.tt.destination_list: "Okamžitě se vydáš do [destination_1.GetBaseNameNoTier]"
 laamp_base_contract_schemes.2004.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E] je třeba:\n$EFFECT_LIST_BULLET$Absolvovat 4 zkoušky a odhalit důkazy:\n$TAB$$EFFECT_LIST_BULLET$2 důkazy zaručují výsledek $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$4 důkazy přinesou výsledek $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$1 důkaz může vést k výsledku $label_success_standard$, $label_success_qualified$ nebo $label_failure_standard$\n$EFFECT_LIST_BULLET$Zkoušky mohou prověřovat:\n$TAB$$EFFECT_LIST_BULLET$Tvou [Concept('stewardship','správcovskou dovednost')|E]\n$TAB$$EFFECT_LIST_BULLET$[Concept('aptitude','Způsobilost')|E] [Concept('officer','důstojníka')|E] ve funkci [GetCourtPositionType('quartermaster_camp_officer').GetName()]\n$TAB$$EFFECT_LIST_BULLET$Jednu z těchto dovedností: [Concept('diplomacy','diplomatickou dovednost')|E], [Concept('intrigue','pletichářskou dovednost')|E] nebo [Concept('learning','učenost')|E]#!"
 laamp_base_contract_schemes.2011.t: "Pořízení soupisu"
 laamp_base_contract_schemes.2011.desc: "Najmout [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] a jeho družinu k provedení sčítání je možná poněkud neobvyklé, ale když [ROOT.Char.GetFaith.random_EvilGodNames] tlačí, nouze nezná zákon, a já si sotva mohu stěžovat, že jsem dostal práci.\n\nMince se utrácejí stejně dobře a ať už má [employer.GetTitledFirstName] jakýkoli důvod nedůvěřovat svým písařům, nás se zjevně netýká. Měla by to tedy být příjemná a jednoduchá práce.\n\nNebo ne?"
 laamp_base_contract_schemes.2011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2012.t: "$laamp_base_contract_schemes.2011.t$ – úspěch!"
 laamp_base_contract_schemes.2012.desc: "Ani sčítání není bez vzrušení. Rolníci se snaží skrývat dobytek a uskladněnou úrodu, kupci zastírají své zisky a dokonce i pozemky drobné šlechty se při zapisování zdají tím menší a chudší, čím blíže se k nim dostaneme.\n\nNaštěstí nenarazíme na nic, co by [employer.GetTitledFirstNamePossessive] pečeť a náš vlastní důvtip nedokázaly poměrně snadno překonat.\n\nVýsledky možná nejsou vyčerpávající, ale na několik příštích let poslouží dostatečně, a právě to stanovovala naše smlouva.\n\nJe čas dostat zaplaceno."
 laamp_base_contract_schemes.2012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2013.t: "$laamp_base_contract_schemes.2011.t$ – neúspěch!"
 laamp_base_contract_schemes.2013.desc: "Samozřejmě že to nebyla jednoduchá práce.\n\nKdyby byla, [employer.GetTitledFirstName] by ji svěřil svým obvyklým úředníkům. Místo toho jsme já a má družina strávili, jen [ROOT.Char.GetFaith.HealthGodName] ví kolik, našeho drahocenného času na tomto světě jednáním s nejpopletenějšími, nejzatvrzelejšími a #EMP nesnesitelně tupými nevolníky#!, jaké kdy nekonečná moudrost [ROOT.Char.GetFaith.CreatorName] přivedla na svět.\n\nTato země i její lid musí být beznadějně zdegenerované příbuzenským křížením, protože nic jiného by takové tupce nedokázalo zplodit.\n\nVýsledné sčítání bohužel není ani vzdáleně věrohodné a žádnou odměnu nedostaneme."
 laamp_base_contract_schemes.2013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2021.t: "Amatérské stavitelství"
 laamp_base_contract_schemes.2021.desc: "Plány [employer.GetTitledFirstNamePossessive] stavby jsou... možná poněkud nedomyšlené. Alespoň tak působí na mě a mou družinu, takže není divu, že se jeho kresliči dostali do potíží.\n\nPro nás by to však neměl být problém. Víme, co se [employer.GetSheHe] snažil postavit, a musíme jen přijít na to, jak to skutečně #EMP provést#!. Jsme přece schopní poloprofesionálové.\n\nPřinejmenším svého druhu."
 laamp_base_contract_schemes.2021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2022.t: "$laamp_base_contract_schemes.2021.t$ – úspěch!"
 laamp_base_contract_schemes.2022.desc: "Jako vždy jsme já a má družina vzorem výkonnosti. Stavba proběhla rychle, výsledek je pevný a působivý, a přestože [employer.GetTitledFirstName] bude muset na naši dobrou práci navázat, poskytli jsme mu vše, co k tomu potřebuje.\n\nObtíženi zaslouženou odměnou se chystáme k odjezdu."
 laamp_base_contract_schemes.2022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2023.t: "$laamp_base_contract_schemes.2021.t$ – neúspěch!"
 laamp_base_contract_schemes.2023.desc: "V [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] stojí několik znamenitě vyvedených budov.\n\nTa naše mezi ně ovšem nepatří.\n\nVzhledem k tomu, jak se naklání, z jak mizerného materiálu je postavena a kolik z ní trčí trámů, nemluvě o obou požárech během výstavby, máme štěstí, že nečelíme trestnímu stíhání.\n\n[employer.GetTitledFirstName] však může kdykoli změnit názor, takže bychom měli raději odejít."
 laamp_base_contract_schemes.2023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2031.t: "Rozhodčí řízení"
 laamp_base_contract_schemes.2031.desc: "Politický pat je zajímavý jev. Dvě či tři mocné místní strany v [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] se spolu otevřeně přou, ale nejsou schopné či ochotné samy pokročit k řešení.\n\nJejich spor o přesné vedení vnitřní hranice musí vyslechnout nezaujatá osoba, která také prozkoumá dotčené území. Bude-li naše rozhodnutí dostatečně uspokojivé, dostaneme štědře zaplaceno."
 laamp_base_contract_schemes.2031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2032.t: "$laamp_base_contract_schemes.2031.t$ – úspěch!"
 laamp_base_contract_schemes.2032.desc: "Vyřešili jsme skutečně hraniční spor v [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier]?\n\nMožná ne, ale náš rozsudek #EMP přece jen#! utlumil reptání na přijatelnou úroveň. Z pohledu postavy [employer.GetTitledFirstName] je to vlastně vše, k čemu jsme byli najati, takže naše práce je právem u konce.\n\nOdměna přichází bez prodlení."
 laamp_base_contract_schemes.2032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2033.t: "$laamp_base_contract_schemes.2031.t$ – neúspěch!"
 laamp_base_contract_schemes.2033.desc: "Křik, řev, obvinění z úplatkářství a spiknutí... Snaha dovést hraniční spor v [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier] ke smírnému konci byla vskutku #EMP zážitkem#!.\n\nNetřeba dodávat, že za tuto práci zaplaceno nedostaneme, ale alespoň nám nehrozí pokuta.\n\nPřinejmenším pokud rychle zmizíme."
 laamp_base_contract_schemes.2033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2041.t: "Zvláštní daň"
 laamp_base_contract_schemes.2041.desc: "Dobří lidé žijící v zemích, jimž vládne [employer.GetTitledFirstName], jsou jistě zvyklí, že na ně bez většího varování dopadají mýta a desátky. Jeden drobný poplatek navíc, tentokrát dokonce předem oznámený jménem postavy [employer.GetTitleAsNameNoTooltip], by proto neměl vzbudit ani pozvednuté obočí.\n\nPřipravujeme falešnou úřední pečeť a ještě jednou si zkoušíme svůj příběh, než vyrazíme k první obci s truhlicemi dokořán.\n\nTohle by mělo vynést #EMP pěkný#! zisk."
 laamp_base_contract_schemes.2041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.2041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.2041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.2041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.2041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.2042.t: "$laamp_base_contract_schemes.2041.t$ – úspěch!"
 laamp_base_contract_schemes.2042.desc: "Je znepokojivě snadné připravit lidi o majetek, když věří, že na to máš právo a navíc podporu jejich [employer.GetTitleAsNameNoTooltip]. Někteří jsou zpočátku podezřívaví, ale dostatečně přísné vystupování a neurčité výhrůžky vyššími úřady nakonec zlomí každého.\n\nZprávy o našich kouscích se bezpochyby rozšíří. Důležité je, že nás neodhalili, dokud se to #EMP dělo#!.\n\nNeměli bychom se zde však zdržovat. Byla by škoda, kdyby se [employer.GetFirstName] dozvěděl[Select_CString( employer.IsFemale, 'a', '' )], že má nějaké úřední „daně“ i mimo svou pokladnici."
 laamp_base_contract_schemes.2042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.2043.t: "$laamp_base_contract_schemes.2041.t$ – neúspěch!"
 laamp_base_contract_schemes.2043.desc: "Možná... možná existuje důvod, proč se o něco takového lidé nepokoušejí častěji.\n\nMístní nás znovu a znovu vyhánějí, označují nás za cizáky a přivandrovalce, požadují další doklady totožnosti a odmítají uvěřit, že by jejich [employer.GetTitleAsNameNoTooltip] uložil mimořádnou daň bez předchozího varování či oznámení.\n\nNejlepší bude odejít i bez skutečného zisku, než se [employer.GetFirstName] dozví, co se zde stalo."
 laamp_base_contract_schemes.2043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.2044.t: "$laamp_base_contract_schemes.2041.t$"
 laamp_base_contract_schemes.2044.desc: "$laamp_base_contract_schemes.2041.desc$"
 laamp_base_contract_schemes.2044.tt.destination_list.6_destinations: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier], poté do [destination_2.GetNameNoTier], následně do [destination_3.GetNameNoTier], [destination_4.GetNameNoTier], [destination_5.GetNameNoTier] a nakonec do [destination_6.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.destination_list.5_destinations: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier], poté do [destination_2.GetNameNoTier], následně do [destination_3.GetNameNoTier], [destination_4.GetNameNoTier] a nakonec do [destination_5.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.destination_list.4_destinations: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier], poté do [destination_2.GetNameNoTier], následně do [destination_3.GetNameNoTier] a nakonec do [destination_4.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.destination_list.3_destinations: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier], poté do [destination_2.GetNameNoTier] a nakonec do [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.2044.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E] je třeba:\n$EFFECT_LIST_BULLET$V každém cíli uspět ve zkoušce [Concept('stewardship','správcovské dovednosti')|E], [Concept('intrigue','pletichářské dovednosti')|E] nebo [Concept('aptitude','způsobilosti')|E] důstojníka ve funkci [GetCourtPositionType('master_bard_camp_officer').GetName()]\n$EFFECT_LIST_BULLET$Uspět v jedné třetině zkoušek a dosáhnout výsledku $label_success_qualified$\n$EFFECT_LIST_BULLET$Uspět ve dvou třetinách zkoušek a dosáhnout běžného úspěchu\n$EFFECT_LIST_BULLET$Uspět ve všech zkouškách a dosáhnout výsledku $label_success_critical$\n$EFFECT_LIST_BULLET$@warning_icon! #N Neúspěch ve #BOL dvou#! či více zkouškách kdykoli během zakázky znamená neúspěch celé $game_concept_task_contract$#!\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Každá úspěšně dokončená zkouška mírně zvýší obtížnost všech následujících zkoušek, především zkoušek stejné [Concept('skill','dovednosti')|E] nebo $game_concept_aptitude$#!#!"
 laamp_base_contract_schemes.2044.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.2044.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.3001.t: "Aktivní průzkum"
 laamp_base_contract_schemes.3001.desc: "[employer.GetTitledFirstNamePossessive] výzva k podávání fundovaných zpráv o dění v okolí hlavního sídla přitahuje všemožné šarlatány, kteří touží po snadném výdělku za strojenou povídačku či zjevný výmysl.\n\nNaštěstí pro [employer.GetHerHim] nepatříme já a má družina k obyčejným hlupákům tlačícím se v tamní síni a můžeme nabídnout #EMP zajímavější#! příběhy ze sousedních zemí. Jak užitečné budou, však musí posoudit dobrý [employer.GetTitleAsNameNoTooltip]..."
 laamp_base_contract_schemes.3001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.3001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3002.t: "$laamp_base_contract_schemes.3001.t$ – úspěch!"
 laamp_base_contract_schemes.3002.desc: "Všímavé oči a uši během cest odhalí mnohé, aniž by to vyžadovalo více než ochotu pozorovat a dobrou paměť na podrobnosti.\n\nJe to prostá zásada, ale prchliví a ukvapení lidé ji snadno nedodrží. Jak se dalo čekat, #EMP naše#! zprávy jsou natolik poučné, že nám vynesou nejen odměnu, ale i o něco delší pohostinnost.\n\nK velké nelibosti ostatních samozvaných zvědů."
 laamp_base_contract_schemes.3002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.3003.t: "$laamp_base_contract_schemes.3001.t$ – neúspěch!"
 laamp_base_contract_schemes.3003.desc: "Když jsme vstoupili do [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier], byl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem si jist[Select_CString( ROOT.Char.IsFemale, 'á', 'ý' )], že naše příběhy jsou pravdivými, podrobnými a užitečnými zprávami... Nebyly snad? Byli jsme... byli jsme si tak jistí.\n\nNáš pobyt u postavy [employer.GetTitledFirstName] začal docela přátelsky, ale rychle se zkomplikoval. Špehové vyslaní po stopách, které jsme jim poskytli, se vraceli rozhořčení, nebo se nevrátili vůbec. Následovala obvinění z úmyslné sabotáže a zlého úmyslu a dlouhé, hlasité hádky.\n\nStačí říci, že toto místo pro nás již není bezpečné."
 laamp_base_contract_schemes.3003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.3004.t: "$laamp_base_contract_schemes.3001.t$"
 laamp_base_contract_schemes.3004.desc: "$laamp_base_contract_schemes.3001.desc$\n\nNejprve však budeme muset nenápadně navštívit několik míst, o nichž se [employer.GetFirstNameNoTooltip] chce dozvědět více."
 laamp_base_contract_schemes.3004.tt.destination_list: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier], poté do [destination_2.GetNameNoTier] a nakonec do [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.3004.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E] je třeba:\n$EFFECT_LIST_BULLET$V každém cíli uspět ve zkoušce [Concept('intrigue','pletichářské dovednosti')|E] nebo [Concept('diplomacy','diplomatické dovednosti')|E]\n$TAB$$EFFECT_LIST_BULLET$Čelit budeš tomu schopnějšímu z místního [Concept('ruler','vládce')|E] a jeho [Concept('spymaster','špehmistra')|E]\n$EFFECT_LIST_BULLET$Případně si můžeš zaručit úspěch obětováním [Concept('prestige','prestiže')|E] a zhoršením jejich [Concept('opinion','mínění')|E] o tobě\n$TAB$$EFFECT_LIST_BULLET$Náklady v [Concept('prestige','prestiži')|E] rostou úměrně [Concept('title_tier','úrovni titulu')|E] [Concept('ruler','vládce')|E]\n$EFFECT_LIST_BULLET$Žádný úspěch znamená výsledek $label_failure_standard$\n$EFFECT_LIST_BULLET$Jeden úspěch znamená výsledek $label_success_qualified$\n$EFFECT_LIST_BULLET$Dva úspěchy znamenají výsledek $label_success_standard$\n$EFFECT_LIST_BULLET$Tři úspěchy znamenají výsledek $label_success_critical$#!"
 laamp_base_contract_schemes.3004.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.3004.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.3011.t: "Kvadratura kruhu"
 laamp_base_contract_schemes.3011.desc: "„Nemusí to být pomalé. Prostě dostaň postavu [target.GetTitledFirstName] do [employer.GetFaith.DeathDeityNamePossessive] náruče, abych na ni mohl[Select_CString( employer.IsFemale, 'a', '' )] přestat myslet. Rozumíme si?“ zavrčí [employer.GetTitledFirstName].\n\nPřikyvuji. Mnohé zůstává nevyřčeno. Proč si [employer.GetSheHe] přeje smrt postavy [target.GetTitledFirstName] a co [Select_CString( employer.IsFemale, 'jí', 'mu' )] brání použít obvyklejší prostředky. Nic z toho však není mou starostí.\n\nJeden předčasně ukončený život a dostanu zaplaceno."
 laamp_base_contract_schemes.3011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3011.c: "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
 laamp_base_contract_schemes.3011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3012.t: "$laamp_base_contract_schemes.3011.t$ – úspěch!"
 laamp_base_contract_schemes.3012.desc: "„Váš důkaz, [employer.GetTitleAsNameNoTooltip],“ pronáším a pouštím vlhký pytel na [employer.GetFirstNameNicknamedPossessive] podlahu. Nasáklá látka se překlopí na bok a odhalí zplihlý chomáč vlasů postavy [target.GetTitledFirstName].\n\n„Pokyn ‚přines mi [Select_CString( target.IsFemale, 'její', 'jeho' )] hlavu‘ sis vyložil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] až příliš doslovně,“ zabručí [employer.GetSheHe]. „Odnést ji muselo být peklo. Přesto je práce dobře odvedena. Tvá odměna čeká u služebnictva venku.“\n\nUctivě skloním hlavu a odejdu."
 laamp_base_contract_schemes.3012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.3013.t: "$laamp_base_contract_schemes.3011.t$ – neúspěch!"
 laamp_base_contract_schemes.3013.desc: "„Takže [target.GetTitledFirstName] už ví, že někdo usiluje o [Select_CString( target.IsFemale, 'její', 'jeho' )] hlavu? Hlupáku!“ zavrčí [employer.GetTitledFirstName]. „Proč jsem ti #EMP věřil[Select_CString( employer.IsFemale, 'a', '' )]#!? K čertu!“\n\nPokrčím rameny a otevřu ústa, abych vysvětlil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] onu... chybu, kvůli níž naše kořist unikla svému osudu. [employer.GetFirstNamePossessiveNoTooltip] ruka však prudce vystřelí a prst ukáže ven na nádvoří.\n\n„Za nedokončenou práci nedostaneš zaplaceno. Vypadni z mého [employer.Custom('FortifiedBuilding')], než si své zklamání vybiju #EMP na tobě#!.“"
 laamp_base_contract_schemes.3013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.3021.t: "Nepřátelské převzetí"
 laamp_base_contract_schemes.3021.desc: "Pokyny postavy [employer.GetTitledFirstName] jsou jasné. Vyčkej, až bude [target.GetTitledFirstName] bez ochrany, zlikviduj případné stráže a přiveď [Select_CString( target.IsFemale, 'ji', 'ho' )] do [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] [Select_CString( target.IsFemale, 'živou', 'živého' )] a v řetězech.\n\nDost prosté. Dobrý [employer.GetTitleAsNameNoTooltip] příliš nerozváděl, #EMP proč#! chce právě tuto osobu nechat unést pokoutními hrdlořezy, ale nám nepřísluší se ptát."
 laamp_base_contract_schemes.3021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3021.c: "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
 laamp_base_contract_schemes.3021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3022.t: "$laamp_base_contract_schemes.3021.t$ – úspěch!"
 laamp_base_contract_schemes.3022.desc: "„[employer.GetTitledFirstName],“ procedí [target.GetTitledFirstName], když [Select_CString( target.IsFemale, 'jí', 'mu' )] stáhnu pytel z hlavy, „mělo mi být jasné, že za tím stojíš #EMP ty#!.“\n\n[employer.GetFirstNameNoTooltip] [employer.Custom('Saying_3p_SmilesSeems')] a gestem přikáže [Select_CString( target.IsFemale, 'zajatkyni', 'zajatci' )] pokleknout. Bez okolků kopnu [Select_CString( target.IsFemale, 'ji', 'ho' )] do kříže a [target.GetWomanMan] se zřítí na podlahu.\n\n„Výtečná práce, [ROOT.Char.GetFirstNameNoTooltip],“ zajásá zadavatel a hodí mi těžký měšec. „Stálo to za každou minci.“"
 laamp_base_contract_schemes.3022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.3023.t: "$laamp_base_contract_schemes.3021.t$ – neúspěch!"
 laamp_base_contract_schemes.3023.desc: "„Jak se rozhlížím, [target.GetFirstName] tu očividně chybí, [ROOT.Char.GetFirstNameNoTooltip],“ poznamená jízlivě [employer.GetTitledFirstName] a mávne rukou po pracovně. „Dohodli jsme se, že mi toho hlupáka přivedeš. Jenže hlupáka, kterého jsem požadoval[Select_CString( employer.IsFemale, 'a', '' )], tu nevidím. Nebo snad ano?“\n\nZatnu zuby a zavrtím hlavou.\n\n„Máš štěstí, že se soustředím na jinou kořist, ty [ROOT.Char.Custom('GetLaampDescribeTypeInsult')]. Teď odejdi, než promarníš zbytek mé dobré vůle.“"
 laamp_base_contract_schemes.3023.a: "Odejít z pracovny."
 laamp_base_contract_schemes.3031.t: "Žhavý rozhovor"
 laamp_base_contract_schemes.3031.desc: "Rozhovor s postavou [employer.GetTitledFirstName] byl... poučný. Kvůli nějaké malicherné urážce ze strany [target.GetFirstNameNoTooltip], skutečné či domnělé, [employer.GetSheHe] přímo sálá vzteky a touží ukázat [target.GetFirstNameNoTooltip], kam patří, ale zatím nechce prolít příliš mnoho krve.\n\n[employer.GetTitleAsNamePossessiveNoTooltip] plán spočívá v tom, že podpálíme nějaký méně významný majetek postavy [target.GetFirstNameNoTooltip]. Splnění tohoto požadavku bezpochyby ještě více rozdmýchá napětí, ale práce je práce."
 laamp_base_contract_schemes.3031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.3031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3032.t: "$laamp_base_contract_schemes.3031.t$ – úspěch!"
 laamp_base_contract_schemes.3032.desc: "Já i má družina s největší radostí hlásíme postavě [employer.GetTitledFirstName], že žhářství bylo úspěšné. Při poslechu našeho vyprávění o lsti a ohni [employer.Custom('PartAglow_EyesFaceBody')].\n\n„#EMP Dobře#!, dobře! Výtečná práce, [ROOT.Char.GetFirstName],“ pochechtává se [employer.GetTitleAsNameNoTooltip]. „[target.GetFirstName] na to jen tak nezapomene.“\n\nNa pokyn vstoupí služebník a přinese naši odměnu ve stříbře."
 laamp_base_contract_schemes.3032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.3033.t: "$laamp_base_contract_schemes.3031.t$ – neúspěch!"
 laamp_base_contract_schemes.3033.desc: "Náš pokus o žhářství se brzy změnil v krvavou paniku. Přistihl nás služebník a vyvolal poplach dříve, než jsme toho bastarda stačili probodnout.\n\nV následném boji jsme sice potřísnili své meče větším množstvím jejich krve než oni té naší, ale jediný skomírající plamínek, který jsme založili, byl uhašen.\n\n[employer.GetTitledFirstName] nás odmítá byť jen přijmout, abychom mohli vše vysvětlit. Na potrestání nás nemá čas, ale na odměnu můžeme také zapomenout."
 laamp_base_contract_schemes.3033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.3034.t: "$laamp_base_contract_schemes.3031.t$"
 laamp_base_contract_schemes.3034.desc: "Dopis od postavy [employer.GetTitledFirstName] byl... poučný. Kvůli nějaké malicherné urážce ze strany [target.GetFirstNameNoTooltip], skutečné či domnělé, [employer.GetSheHe] přímo sálá vzteky a touží ukázat [target.GetFirstNameNoTooltip], kam patří, ale zatím nechce prolít příliš mnoho krve.\n\n[employer.GetTitleAsNamePossessiveNoTooltip] plán spočívá v tom, že podpálíme nějaký méně významný majetek, s nímž má [target.GetFirstNameNoTooltip] co do činění, nebo jej jiným vhodným způsobem zničíme.\n\nSplnění tohoto požadavku bezpochyby ještě více rozdmýchá napětí, ale práce je práce."
 laamp_base_contract_schemes.3034.tt.destination_list: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier]"
 laamp_base_contract_schemes.3034.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E] je třeba:\n$EFFECT_LIST_BULLET$V cíli uspět ve zkoušce [Concept('intrigue','pletichářské dovednosti')|E], [Concept('martial','válečnické dovednosti')|E], [Concept('prowess','udatnosti')|E] nebo některého druhu [Concept('aptitude','způsobilosti')|E] [Concept('officer','důstojníka')|E]\n$EFFECT_LIST_BULLET$[Concept('intrigue','Pletichářská dovednost')|E] je dostupná vždy\n$EFFECT_LIST_BULLET$Možnost použít [Concept('martial','válečnickou dovednost')|E] nebo [Concept('prowess','udatnost')|E] závisí na cíli\n$EFFECT_LIST_BULLET$Podle cíle bude dostupný také tvůj nejlepší vhodný [Concept('officer','důstojník')|E]\n$EFFECT_LIST_BULLET$Pokud po příchodu usoudíš, že jsou zkoušky příliš obtížné, budeš moci ustoupit pouze s výsledkem $label_failure_qualified$#!"
 laamp_base_contract_schemes.3034.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.3034.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.3041.t: "Trocha zlodějiny"
 laamp_base_contract_schemes.3041.desc: "Předběžný průzkum okolí [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] naznačuje, že by nám to #EMP mohlo#! projít. Není to jediné místo, kde [employer.GetTitledFirstName] uchovává své mince, ale zdejší državy jich rozhodně ukrývají #EMP dostatek#! a stráže podle všeho žádný útok neočekávají.\n\nJinými slovy je to riskantní, ale proveditelné.\n\nPotřebujeme už jen mazaný plán..."
 laamp_base_contract_schemes.3041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.3041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.3041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.3041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.3041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.3042.t: "$laamp_base_contract_schemes.3041.t$ – úspěch!"
 laamp_base_contract_schemes.3042.desc: "Tu potichu vypáčený zámek, tam uvážlivě probodnutý strážný, a náhle se před námi odhalí... bohatství [employer.GetPrimaryTitle.GetNameNoTier].\n\nPlníme pytle, jak nejrychleji dokážeme, a mizíme. Ať jdou následky k čertu.\n\nJen doufejme, že na šibenici nepůjdeme my."
 laamp_base_contract_schemes.3042.a: "[employer.GetTitledFirstNameNoTooltip], to je ale prosťáček!"
 laamp_base_contract_schemes.3042.b: "Víš co... tam vzadu toho zůstalo mnohem víc..."
 laamp_base_contract_schemes.3042.b.tt.possible_haul: "Postavě [employer.GetTitledFirstName] zbývá až [gold_i][varcheck.MakeScope.Var('haul_possible').GetValue|P0] [Concept('gold','zlata')|E] a cenností, které lze krást po částech v hodnotě [gold_i][varcheck.MakeScope.Var('haul_increment').GetValue|P0]"
 laamp_base_contract_schemes.3042.b.tt.explanation: "#TUT Po návratu budeš moci:\n$EFFECT_LIST_BULLET$Vždy prověřit svou [Concept('intrigue','pletichářskou dovednost')|E] a pokusit se ukrást více\n$EFFECT_LIST_BULLET$Náhodně podstoupit jednu z následujících zkoušek:\n$TAB$$EFFECT_LIST_BULLET$[Concept('martial','Válečnické dovednosti')|E], [Concept('prowess','udatnosti')|E] nebo [Concept('stewardship','správcovské dovednosti')|E]\n$TAB$$EFFECT_LIST_BULLET$[Concept('prowess','Udatnosti')|E] nebo [Concept('intrigue','pletichářské dovednosti')|E] jednoho ze svých [Concept('agents','spolčenců')|E]\n$TAB$$EFFECT_LIST_BULLET$[Concept('aptitude','Způsobilosti')|E] důstojníka ve funkci [GetCourtPositionType('master_thief_camp_officer').GetName()] nebo [GetCourtPositionType('master_of_spoils_camp_officer').GetName()]\n$EFFECT_LIST_BULLET$Přijmout [Concept('stress','stres')|E] a automaticky uspět ve zkoušce\n$EFFECT_LIST_BULLET$Uniknout se získanou kořistí\n$EFFECT_LIST_BULLET$Pokud dvakrát neuspěješ, budeš uvězněn[Select_CString( ROOT.Char.IsFemale, 'a', '' )] a o celý výdělek přijdeš#!\n$EFFECT_LIST_BULLET$Získáš dodatečné zkušenosti s vlastností [GetTrait('gallowsbait').GetName( GetNullCharacter )] úměrně množství ukradeného majetku"
 laamp_base_contract_schemes.3042.b.tt.current_earnings: "#TUT Dosavadní výdělek ze zakázky už je v bezpečí a zůstane ti bez ohledu na výsledek#!"
 laamp_base_contract_schemes.3042.b.tt.you_go_back_for_more: "Vrať se do [employer.Custom('ResidenceBuilding')|l] a připrav se znovu loupit!"
 laamp_base_contract_schemes.3043.t: "$laamp_base_contract_schemes.3041.t$ – neúspěch!"
 laamp_base_contract_schemes.3043.desc: "K čertu s tím!\n\n[employer.GetFirstNamePossessiveNoTooltip|U] pokladnici hlídalo více strážných, než jsme čekali, a jejich obchůzky vedly jinudy, než jsme předpokládali. Dokonce nás zradil i samotný měsíc, který noc zalil jasným světlem...\n\nKrátce po překonání vnější hradby se naše proniknutí změnilo v krvavá jatka. Za své úsilí si neodnášíme žádné stříbro, jen družiníky v patách a palčivé rány."
 laamp_base_contract_schemes.3043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4001.t: "Brka na zakázku"
 laamp_base_contract_schemes.4001.desc: "„Samozřejmě, pokud to pro tebe nebude #EMP příliš#! mnoho práce,“ usměje se [employer.GetTitledFirstName] a položí na stůl svázaný stoh písemností na materiálu zvaném [ROOT.Char.Custom('GetWritingMaterial')]. „Jen tyhle.“\n\nPo chvíli přidá dva svitky z materiálu zvaného [ROOT.Char.Custom('GetWritingMaterial')]. Potom další stoh písemností na materiálu zvaném [ROOT.Char.Custom('GetWritingMaterial')]. A malou knihu.\n\nPozvednu obočí a [employer.GetTitleAsNameNoTooltip] vytáhne ze zásuvky o něco mohutnější svazek, který posadí na vrchol hromady.\n\n„Nuže, tedy jen #EMP tyhle#!.“"
 laamp_base_contract_schemes.4001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4002.t: "$laamp_base_contract_schemes.4001.t$ – úspěch!"
 laamp_base_contract_schemes.4002.desc: "V dobrém rozpoložení se vracím do [employer.GetTitledFirstNamePossessive] síně. Prsty mám potřísněné inkoustem a oči mi slzí nedostatkem spánku, ale práce je hotová.\n\nJeden člen mé družiny za mnou přináší stoh dokončených opisů a pod tíhou neuspořádané hromady se sotva šourá.\n\n„Už je hotovo? Zdá se, že jsem ti toho mohl[Select_CString( employer.IsFemale, 'a', '' )] dát o něco víc,“ utrousí [employer.GetTitleAsNameNoTooltip] a mávnutím nás pošle pryč. „Nenechávej je tady. Mé služebnictvo najde někoho, kdo plody tvé gramotnosti přečte, a postará se o tvou odměnu.“"
 laamp_base_contract_schemes.4002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4003.t: "$laamp_base_contract_schemes.4001.t$ – neúspěch!"
 laamp_base_contract_schemes.4003.desc: "„Posaď se,“ přikáže podrážděně [employer.GetTitledFirstName] a pozvedne list pergamenu potřísněný inkoustem a pokrytý nerozeznatelnými klikyháky. „Víš, co je tu napsáno?“\n\nZavrtím hlavou.\n\n„Já také ne, protože #EMP tohle nejsou slova#!. Tvá banda ničemů opisuje už jen [employer.GetFaith.KnowledgeGodName] ví jak dlouho, a #EMP tohle#! je všechno, co jste dokázali? Za ledabyle rozlitý inkoust platit nebudu. Vezmi si své ‚opisy‘ a vypadni!“"
 laamp_base_contract_schemes.4003.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4011.t: "Teologické rozuzlení"
 laamp_base_contract_schemes.4011.desc: "„...a to je zhruba vše,“ zakončí [employer.GetTitledFirstName]. „Chceš něco dodat, [chaplain.GetTitledFirstName]?“\n\n[chaplain.GetCouncilTitle|U] zavrtí hlavou. „Shrnul[Select_CString( employer.IsFemale, 'a', '' )] jsi to dobře, [employer.GetLadyLord]. Kdyby mě povinnosti nevolaly jinam, s radostí bych se ujal[Select_CString( chaplain.IsFemale, 'a', '' )] rozhodování, ale...“\n\n[employer.GetTitleAsNameNoTooltip] pozvedne ruku a zarazí [Select_CString( chaplain.IsFemale, 'ji', 'ho' )]. „Nedělej si starosti. Jistě si [ROOT.Char.GetFirstName] poradí se sporem, který vedou naši [employer.GetFaith.PriestNeuterPlural].“"
 laamp_base_contract_schemes.4011.a: "Jak špatné to asi může být?"
 laamp_base_contract_schemes.4011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4012.t: "$laamp_base_contract_schemes.4011.t$ – úspěch!"
 laamp_base_contract_schemes.4012.desc: "Nakonec se ukázalo, že spor lze vyřešit překvapivě snadno. Obě strany byly natolik zaměstnané vzájemným očerňováním, že i neurčitá výzva k jednotě, kterou má představovat [ROOT.Char.GetFaith.GetReligion.GetName], přesvědčila rozčarované mezi oběma tábory.\n\n[employer.GetFaith.PriestNeuterPlural|U], kteří stáli v centru rozpravy, na sebe stále zuří, ale protože už se o spor zajímá jen málokdo další, nehrozí, že přeroste v něco horšího.\n\n[employer.GetTitledFirstName] každopádně vypadá spokojeně."
 laamp_base_contract_schemes.4012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4013.t: "$laamp_base_contract_schemes.4011.t$ – neúspěch!"
 laamp_base_contract_schemes.4013.desc: "Na slovní disputaci při tom bylo... mnohem více krveprolití, než by mělo.\n\nRozprava přešla v křik, křik v náboženské zanícení, zanícení v urážky a pak už bylo jen otázkou času, kdy někdo zasadí první ránu. Dokonce i teď se celá pohroma za našimi zády dál vymyká veškeré kontrole.\n\nStačí říci, že za tohle žádnou odměnu nedostaneme."
 laamp_base_contract_schemes.4013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4021.t: "Plody mysli"
 laamp_base_contract_schemes.4021.desc: "Rozhovor s postavou [employer.GetTitledFirstName] se ukázal být... poučný.\n\nZdá se, že si přeje duchaplnou knížečku o tradičních průpovědích a moudrosti [ROOT.Char.GetCulture.GetName] kultury, díky níž bude působit jako skutečný mecenáš umění.\n\nJak těžké to může být?"
 laamp_base_contract_schemes.4021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4022.t: "$laamp_base_contract_schemes.4021.t$ – úspěch!"
 laamp_base_contract_schemes.4022.desc: "Další dvůr, další spokojený mecenáš!\n\nKnížečka nazvaná „O mnoha důmyslech a tajemstvích [ROOT.Char.GetCulture.GetName] kultury“ je umně stručná, ale zároveň #EMP právě#! natolik duchaplná, aby svým důrazem na tradice a úvahami zdravého rozumu rozproudila celý dvůr.\n\nNejspíš nepřetrvá dlouho, natož aby se dočkala mnoha opisů, ale prozatím nám vynesla odměnu, a to stačí."
 laamp_base_contract_schemes.4022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4023.t: "$laamp_base_contract_schemes.4021.t$ – neúspěch!"
 laamp_base_contract_schemes.4023.desc: "„Bláboly! Cos to vytvořil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] za #EMP bláboly#!, [ROOT.Char.GetFirstName]?“ vykřikne [employer.GetTitledFirstName] a listuje stránkami, které jsme s družinou připravili. „‚Skutečná hodnota lidského srdce není větší než pot jeho čela‘? Co to má #EMP znamenat#!?!“\n\nOtevřu ústa, abych odpověděl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] a průpověď vysvětlil[Select_CString( ROOT.Char.IsFemale, 'a', '' )], ale znechucený [employer.GetTitleAsNameNoTooltip] po mně hodí rukopis a pokyne mi k odchodu.\n\nZdá se, že už jsem řekl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dost."
 laamp_base_contract_schemes.4023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4031.t: "Prosba o almužnu"
 laamp_base_contract_schemes.4031.desc: "Přesvědčit stráže, aby nás pustily k postavě [employer.GetTitledFirstName], je naštěstí překvapivě snadné. Stačí jen náznak lákavého tajemství kolem účelu naší návštěvy, aby vše proběhlo hladce.\n\nJakmile získáme audienci, náš záměr se poměrně rychle vyjasní. Jako učení [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] jsme při konání svých dobrých skutků závislí na štědrosti #EMP osvícených#! vládců. [employer.GetTitleAsNameNoTooltip] nám proto neochotně dovolí nějaký čas zůstat, ale nic víc!\n\n...prozatím."
 laamp_base_contract_schemes.4031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4032.t: "$laamp_base_contract_schemes.4031.t$ – úspěch!"
 laamp_base_contract_schemes.4032.desc: "Náš pobyt u dvora, jemuž vládne [employer.GetTitledFirstName], se nakonec ukazuje jako velmi výnosný. Vytrvalé lichocení a učené úskoky postupně rozptylují [employer.GetTitleAsNamePossessive] podezření a probouzejí zvědavý zájem, načež se dary mecenášské přízně skutečně začnou hrnout.\n\nJe to bezpochyby výnosné počínání, ale tato přízeň nepotrvá věčně, takže přirozeně odejdeme dříve, než se naše přítomnost stane nevítanou.\n\nV [employer.GetCapitalLocation.GetTitle.GetName] se naše měšce vskutku štědře naplnily."
 laamp_base_contract_schemes.4032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4033.t: "$laamp_base_contract_schemes.4031.t$ – neúspěch!"
 laamp_base_contract_schemes.4033.desc: "Po celý pobyt se [employer.GetTitledFirstNamePossessive] postoj k nám jen zhoršuje. Nepomáhá tomu, že se při sebemenší příležitosti snažíme vyloudit dary a sliby.\n\n[employer.GetTitleAsNamePossessiveNoTooltip] podráždění každým dnem roste. S tím, jak vychází najevo můj omyl, se stále zřetelněji rýsuje i nevyhnutelné obvinění z tuláctví, které nás čeká, pokud se tu budeme dál potloukat."
 laamp_base_contract_schemes.4033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.4041.t: "Každá tretka je poklad"
 laamp_base_contract_schemes.4041.desc: "„A tenhle,“ pronese [employer.GetTitledFirstName] a prohlíží si malý vyřezávaný kámen modrozelené barvy, „pomáhá proti dně? Máš tu opravdu široký výběr, [ROOT.Char.GetFirstName].“\n\n„Přeje-li si [employer.GetLadyLord], mohu nechat z našich zavazadel přinést několik cizokrajnějších předmětů?“ Slova mi plynou z jazyka hladce a sebejistě. „Jak vidíte, vám i vašemu dvoru máme co nabídnout.“\n\n[employer.GetTitleAsName] přikývne a svolí, abychom nějaký čas zůstali."
 laamp_base_contract_schemes.4041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.4041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.4041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.4041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.4041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.4042.t: "$laamp_base_contract_schemes.4041.t$ – úspěch!"
 laamp_base_contract_schemes.4042.desc: "Náš pobyt v [employer.GetCapitalLocation.GetTitle.GetName] je nesmírně výnosný! [employer.GetTitledFirstNamePossessive] tichý souhlas dodává našemu zboží důvěryhodnost, jakou by mu nezajistily ani nejvýmluvnější řeči na světě.\n\nTalismany, léčiva, tretky a cetky. Dvořané i hosté kupují všechno a na nic se neptají.\n\nAlespoň zatím. Než je přepadnou pochybnosti, budeme dávno pryč."
 laamp_base_contract_schemes.4042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.4043.t: "$laamp_base_contract_schemes.4041.t$ – neúspěch!"
 laamp_base_contract_schemes.4043.desc: "[employer.GetTitledFirstNamePossessive] dvořané jsou prohnanější, než vypadají... Jednu po druhé začnou naše drobné lži prohlížet a vyvracet, čímž pomalu ničí naši pověst prodejců cizokrajných všeléků.\n\nJeště horší je, že naše zjevná nepoctivost staví [employer.GetTitleAsNameNoTooltip] do špatného světla. Buď jsme dostali svolení, nebo se nám podařilo [employer.GetHerHim] oklamat, a ani jedna možnost nám u tamní vlády přízeň nezíská.\n\nNejlepší bude odejít i bez zisku, než [employer.GetFirstNamePossessiveNoTooltip] hněv přeroste ve fyzické násilí."
 laamp_base_contract_schemes.4043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.5001.t: "[employer.Custom('GetOutOfControlAnimalTypePlural')|U] na porážku"
 laamp_base_contract_schemes.5001.desc: "Pověření od postavy [employer.GetTitledFirstName] je prosté. [employer.Custom('GetOutOfControlAnimalTypePlural')|U] jsou naším cílem a máme jich pobít co nejvíce. Bude-li náš úlovek dostatečně působivý, získáme právo nějaký čas lovit v tamních zemích.\n\nTolik území k lovu... Čeká nás maso k nasolení, kůže k vydělání, rohy a kopyta ke zpracování a všude kolem hotové bohatství.\n\nCelkově vzato to bude vzrušující a výnosné střetnutí."
 laamp_base_contract_schemes.5001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5002.t: "$laamp_base_contract_schemes.5001.t$ – úspěch!"
 laamp_base_contract_schemes.5002.desc: "Tento lov zahrnul mě i mou družinu slávou. [employer.Custom('GetOutOfControlAnimalTypePlural')|U] leží po našem zásahu v hojném počtu mrtví, což nám získalo oblibu mezi sedláky i u postavy [employer.GetTitledFirstName], a kořist, kterou jsme si odnesli z divočiny, je vskutku bohatá.\n\nNaše zavazadla jsou obtížena kožešinami a potravinami. Získali jsme více než dost, abychom nahradili ztracené šípy a roztříštěná kopí."
 laamp_base_contract_schemes.5002.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5003.t: "$laamp_base_contract_schemes.5001.t$ – neúspěch!"
 laamp_base_contract_schemes.5003.desc: "Ti [employer.Custom('GetOutOfControlAnimalTypePlural')], ti #EMP [employer.Custom('GetOutOfControlAnimalTypePlural')]!#! Noc co noc slyšíme jejich řev a noc co noc se naše lovecké výpravy vracejí o několik lidí chudší.\n\nAť těch zatracených zvířat zabijeme sebevíc, vždy se zdá, že se objeví další z těch třikrát prokletých bestií. Není divu, že si s nimi [employer.GetTitledFirstName] nedokázal[Select_CString( employer.IsFemale, 'a', '' )] poradit.\n\nJe zřejmé, že musíme omezit své ztráty, poslat tuto mizernou zakázku k čertu a zmizet dříve, než nás divočina všechny pohltí."
 laamp_base_contract_schemes.5003.a: "Ať místo nás roztrhají [employer.GetFirstNamePossessiveNoTooltip] vojáky!"
 laamp_base_contract_schemes.5011.t: "Hlídka"
 laamp_base_contract_schemes.5011.desc: "Ať už je útok na majetek tohoto kupce, který [employer.GetTitledFirstName] očekává, skutečný, či pouze domnělý, držet před ním stráž je jednotvárné, i když většinu práce obstarává družina.\n\nDostáváme však zaplaceno za to, abychom byli ostražití a dobře viditelní. Máme představovat ukázku síly a ochranu poskytovanou strážcem této země.\n\nI kdyby to znamenalo stát venku za každého počasí."
 laamp_base_contract_schemes.5011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5012.t: "$laamp_base_contract_schemes.5011.t$ – úspěch!"
 laamp_base_contract_schemes.5012.desc: "#EMP Útok#!. To slovo zní až příliš vznešeně pro několik špinavých hrdlořezů, kteří se za soumraku vyřítili vpřed v jednom nedomyšleném náporu, zvlášť když bylo během několika minut po všem. Spíše to byla šarvátka nebo rvačka v zapadlé uličce.\n\n[employer.GetTitledFirstName] však vypadá spokojeně.\n\nTamní moc zůstává neotřesena, a jen na tom záleží. To znamená, že dostaneme dobře zaplaceno."
 laamp_base_contract_schemes.5012.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5013.t: "$laamp_base_contract_schemes.5011.t$ – neúspěch!"
 laamp_base_contract_schemes.5013.desc: "„Zaplatili jsme ti za hlídání tohoto místa, a teď z něj nezbylo nic než ohořelé chrastí a zaschlá krev, [ROOT.Char.GetFirstName]!“ vyštěkne [employer.GetTitledFirstName]. „Jak vás mohla zaskočit hrstka bezvýznamných ničemů? Měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsi #EMP jediný#! úkol!“\n\nOtevřu ústa k odpovědi, ale [employer.GetTitleAsNameNoTooltip] mě zarazí.\n\n„Ticho. Tvé výmluvy mě nezajímají. Prostě vypadni.“"
 laamp_base_contract_schemes.5013.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.5021.t: "[employer.GetTitleAsNamePossessiveNoTooltip] ochranný doprovod"
 laamp_base_contract_schemes.5021.desc: "„Takže už chápeš, proč potřebuji několik... dalších párů očí rozmístěných po [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier],“ pronese [employer.GetTitledFirstName]. „Poskytneš mi dodatečnou ochranu. Pokud něco proklouzne kolem mých obvyklých družiníků, nebo jejich věrnost zakolísá, budou mi stále krýt záda dobré čepele.“\n\nPřikyvuji. Nedůvěřovat vlastní stráži je bídné postavení, ale alespoň prospívá obchodu.\n\n„Výtečně. Začneš tedy okamžitě.“"
 laamp_base_contract_schemes.5021.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5021.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5021.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5021.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5021.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5022.t: "$laamp_base_contract_schemes.5021.t$ – úspěch!"
 laamp_base_contract_schemes.5022.desc: "„Velkolepá práce, [ROOT.Char.GetFirstName], opravdu,“ zajásá [employer.GetTitledFirstName]. „Všichni ti psi byli odpraveni ladně a účinně! Ti zrádní čoklové mi nezkřivili ani vlásek.“\n\n„Ladně je možná trochu přehnané, [employer.GetLadyLord],“ poznamenám. Služebník za námi usilovně drhne lepkavou krev z malty ve zdi.\n\n„Pche, raději jejich vnitřnosti na koberci než ty mé. Tvá odměna bude doručena bez prodlení.“"
 laamp_base_contract_schemes.5022.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5023.t: "$laamp_base_contract_schemes.5021.t$ – neúspěch!"
 laamp_base_contract_schemes.5023.desc: "Jakmile kolem nás vrazi proklouzli, bylo mi jasné, že musíme uprchnout, a to rychle.\n\nNemůžeme je včas dostihnout a cokoli změnit. [employer.GetTitledFirstNamePossessive] družiníci možná svého pána zachrání, možná ne, ale tak či onak... někdo za to skončí na šibenici.\n\nČím déle se tu zdržíme, tím pravděpodobněji to budu já."
 laamp_base_contract_schemes.5023.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.5031.t: "Zloděj dobytka"
 laamp_base_contract_schemes.5031.desc: "Hromadné krádeže zvířat mají svá pravidla. Musíš vědět, kam je odvedeš, nemůžeš postupovat nenápadně, ale #EMP musíš#! působit, jako bys tam patřil, a narazíš-li na odpor, musíš jej rychle a brutálně zlomit.\n\nJinak celé počínání ohrožuje riziko splašení či pouhé ztráty kontroly nad stádem. Když se něco pokazí, zisk klesá ke dnu rychleji než loď zmítaná bouří.\n\nDoufejme, že [employer.GetTitledFirstName] svůj dobytek příliš dobře nehlídá."
 laamp_base_contract_schemes.5031.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5031.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5031.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5031.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5031.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5032.t: "$laamp_base_contract_schemes.5031.t$ – úspěch!"
 laamp_base_contract_schemes.5032.desc: "Ukázková akce! Po důkladných přípravách, plánování tras, shánění kupců a obhlížení pastvin, podniknou naši zloději dobytka řadu prudkých nočních nájezdů a během jediného týdne odvedou celá stáda zvířat.\n\n[employer.GetTitledFirstName] nemusí mít obavy. Tamní zvířata se zcela jistě dostanou do lepších domovů. Jejich noví majitelé mají koneckonců hluboko do kapes a #EMP velmi#! štědrou náturu."
 laamp_base_contract_schemes.5032.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5033.t: "$laamp_base_contract_schemes.5031.t$ – neúspěch!"
 laamp_base_contract_schemes.5033.desc: "Všechno... všechno se zdálo probíhat tak dobře.\n\nZnali jsme trasu a měli naplánované nájezdy, ale zvířata možná poplašila krev, hluk či pouhá změna zaběhnutého pořádku...\n\nJá i má družina se musíme rozprchnout s [employer.GetTitledFirstNamePossessive] psy v patách a s žalostně malým počtem ukradeného dobytka."
 laamp_base_contract_schemes.5033.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.5034.t: "Krádež dobytka"
 laamp_base_contract_schemes.5034.desc: "$laamp_base_contract_schemes.5031.desc$"
 laamp_base_contract_schemes.5034.a: "$travel.stationary_domicile.option.t$"
 laamp_base_contract_schemes.5034.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.5034.tt.destination_list.5: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier], poté do [destination_2.GetNameNoTier], následně do [destination_3.GetNameNoTier], [destination_4.GetNameNoTier] a nakonec do [destination_5.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.destination_list.4: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier], poté do [destination_2.GetNameNoTier], následně do [destination_3.GetNameNoTier] a nakonec do [destination_4.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.destination_list.3: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier], poté do [destination_2.GetNameNoTier] a nakonec do [destination_3.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.destination_list.2: "Okamžitě zahájíš [Concept('traveling','cestu')|E] do [destination_1.GetNameNoTier] a poté do [destination_2.GetNameNoTier]"
 laamp_base_contract_schemes.5034.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E] je třeba:\n$EFFECT_LIST_BULLET$V každém cíli uspět ve zkoušce [Concept('prowess','udatnosti')|E], [Concept('martial','válečnické dovednosti')|E] nebo [Concept('stewardship','správcovské dovednosti')|E]\n$EFFECT_LIST_BULLET$Pokud příslušné [Concept('officers','důstojníky')|E] máš, můžeš místo toho prověřit [Concept('aptitude','způsobilost')|E] nejlepšího z nich ve funkci [GetCourtPositionType('head_groom_camp_officer').GetName()], [GetCourtPositionType('huntperson_camp_officer').GetName()], [GetCourtPositionType('kennelperson_camp_officer').GetName()] nebo [GetCourtPositionType('master_of_spoils_camp_officer').GetName()]\n$EFFECT_LIST_BULLET$K úspěchu je třeba:\n$TAB$$EFFECT_LIST_BULLET$Uspět ve všech zkouškách a dosáhnout výsledku $label_success_critical$\n$TAB$$EFFECT_LIST_BULLET$Uspět ve více než polovině zkoušek a dosáhnout výsledku $label_success_standard$\n$TAB$$EFFECT_LIST_BULLET$Uspět alespoň v jedné zkoušce a dosáhnout výsledku $label_success_qualified$\n$TAB$$EFFECT_LIST_BULLET$Neuspět v žádné zkoušce znamená výsledek $label_failure_standard$#!"
 laamp_base_contract_schemes.5041.t: "Pytlák"
 laamp_base_contract_schemes.5041.desc: "Zdá se, že [employer.GetTitledFirstNamePossessive] země trpí nadbytkem zvěře, a to natolik, že už zde působí potíže pytláci.\n\nMy [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')], veselá družina, bychom dobrému [employer.GetTitleAsNameNoTooltip] sotva mohli nechat takové břemeno. Budeme muset pomoci ulovením jen #EMP několika#! šťavnatých ptáků a možná stažením pouhých #EMP několika#! zvířátek..."
 laamp_base_contract_schemes.5041.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5041.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5041.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_base_contract_schemes.5041.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5041.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_base_contract_schemes.5042.t: "$laamp_base_contract_schemes.5041.t$ – úspěch!"
 laamp_base_contract_schemes.5042.desc: "Ach, jak vzrušující byl lov v [employer.GetCapitalLocation.GetCounty.GetTitle.GetBaseNameNoTier]! Ať nás [employer.GetTitledFirstNamePossessive] družiníci klidně nazývají pytláky. Měli více zvěřiny, než dokázali spotřebovat, a [ROOT.Char.GetFaith.WealthGodName] nesnáší plýtvání.\n\nOdcházíme odtud s plnými žaludky a dobrou náladou, aniž by naše zápěstí svírala železa."
 laamp_base_contract_schemes.5042.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5043.t: "$laamp_base_contract_schemes.5041.t$ – neúspěch!"
 laamp_base_contract_schemes.5043.desc: "Ať jdou [employer.GetTitledFirstNamePossessive] prašiví čoklové k čertu!\n\nTolik zvěře vůbec #EMP nepotřebují#!, ale jejich vytrvalé pronásledování nám kazí jeden lov za druhým. A aby té potupy nebylo málo, několik členů mé družiny skončilo v železech.\n\nVím, kdy je načase omezit ztráty. Čím déle zde zůstaneme, tím spíše se kořistí staneme #EMP my#!, a ne ti zatracení ptáci."
 laamp_base_contract_schemes.5043.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.negative.light$"
 laamp_base_contract_schemes.5051.t: "Loupež v zapadlé uličce"
 laamp_base_contract_schemes.5051.desc: "Výstrahy, které nechal[Select_CString( employer.IsFemale, 'a', '' )] [employer.GetTitledFirstName] vyvěsit, odpovídají skutečnosti ještě více, než jsme čekali. [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] podle všeho sužuje záplava drobné zločinnosti.\n\nUž během cesty do města napočítáme tucet kapesních krádeží a jedno otevřené přepadení. Je toho příliš mnoho, než aby si s tím přetížení družiníci postavy [employer.GetTitleAsNameNoTooltip] dokázali poradit.\n\nPro podnikavé [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')], jako jsme my, je to naprosto dokonalé prostředí k získání několika #EMP mincí#!."
 laamp_base_contract_schemes.5051.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_base_contract_schemes.5051.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_base_contract_schemes.5051.c: "$laamp_base_contract_schemes.0000.generic_option.secrecy$"
 laamp_base_contract_schemes.5051.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_base_contract_schemes.5052.t: "$laamp_base_contract_schemes.5051.t$ – úspěch!"
 laamp_base_contract_schemes.5052.desc: "Díky naprosté neschopnosti postavy [employer.GetTitledFirstName] udržet pořádek v ulicích vlastního hlavního sídla mohou [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] vytřást z obyvatel [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] vše, co mají.\n\nMožná to není čestný způsob obživy, ale výnosný? Mimořádně.\n\nPrvní poučení každého začínajícího zločince však zní, že musí vědět, kdy přestat. Mince už máme, takže je nejvyšší čas odejít dříve, než se o nás doslechne [employer.GetTitleAsNameNoTooltip] a začne nás hledat."
 laamp_base_contract_schemes.5052.a: "$laamp_base_contract_schemes.0000.generic_option.proceed.neutral$"
 laamp_base_contract_schemes.5053.t: "$laamp_base_contract_schemes.5051.t$ – neúspěch!"
 laamp_base_contract_schemes.5053.desc: "Navzdory našemu nejlepšímu úsilí se zdá, že [employer.GetTitledFirstName] řeší své potíže s drobnými zločinci rychleji, než je [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] dokážou využívat.\n\n[employer.GetTitleAsNamePossessiveNoTooltip] stráže zaplavují ulice a naše příležitost se navzdory dosavadním drobným ziskům rychle vytrácí. Musím proto sebe i svou družinu tajně vyvést z [employer.GetCapitalLocation.GetTitle.GetBaseNameNoTier] dříve, než nás dostihne zákon.\n\nZdá se, že zde už žádnou další kořist nenajdeme."
 laamp_base_contract_schemes.5053.a: "Pche, jinde najdeme bohatší kořist."
 protect_minority_vassal_contract_scheme_desc_success_boilerplate: "$laamp_contract_scheme_desc_success_boilerplate$ Lenní pán [Concept('contractor','zadavatele')|E] bude muset ustoupit a přiznat mu privilegia v [Concept('vassal_contract','vazalské smlouvě')|E]."
 protect_minority_vassal_contract_scheme_desc_generic: "Menšina, kterou [Concept('contractor','zadavatel')|E] zastupuje, požaduje tváří v tvář předsudkům nezpochybnitelná práva."
 protect_minority_vassal_contract_diplomacy_scheme: "Otevřený dialog"
