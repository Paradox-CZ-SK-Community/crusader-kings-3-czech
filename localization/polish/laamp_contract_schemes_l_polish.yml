 laamp_base_contract_schemes.2321.t: "$laamp_base_contract_schemes.2004.t$ – vyhlášení rozsudku"
 laamp_base_contract_schemes.2321.desc.intro: "Shromáždíme se v komnatách postavy [person_a.GetTitledFirstName], které jsou náležitě působivým místem k vynesení mého rozsudku. Stojí za mnou slovo postavy [employer.GetTitleAsName], takže mé rozhodnutí bude závazné. Tak či onak.\n\n[person_b.GetFirstName], [person_c.GetFirstName] a [person_d.GetFirstName] se zatajeným dechem čekají, jak rozhodnu o jejich osudu, zatímco [person_a.GetFirstNameNoTooltip] poprvé od mého příjezdu působí nervózně.\n\nMůj instinkt mi říká, že"
 laamp_base_contract_schemes.2321.desc.tax_status.has_cash: "zaplatit mohou, jen se jim nechce,"
 laamp_base_contract_schemes.2321.desc.tax_status.partial_cash: "alespoň část nejspíš zaplatit mohou,"
 laamp_base_contract_schemes.2321.desc.tax_status.no_cash: "na zaplacení skutečně nemají dost mincí,"
 laamp_base_contract_schemes.2321.desc.clues_gathered.four: "a mé vyšetřování to plně potvrzuje."
 laamp_base_contract_schemes.2321.desc.clues_gathered.two_to_three: "a mé vyšetřování to z velké části potvrzuje."
 laamp_base_contract_schemes.2321.desc.clues_gathered.one_or_less: "ale nemám dost důkazů, abych to prokázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )]."
 laamp_base_contract_schemes.2321.tt.clue_total.exceptional_achievable: "Protože jsi shromáždil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] všechny možné důkazy, tvé vyšetřování bylo natolik důkladné, že pokud je přinutíš zaplatit, zaručeně dosáhneš výsledku $label_success_critical$"
 laamp_base_contract_schemes.2321.tt.clue_total.normal_achievable: "Protože jsi shromáždil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dostatek důkazů, tvé vyšetřování nejspíš skončí výsledkem $label_success_standard$, pokud je přinutíš zaplatit celou částku"
 laamp_base_contract_schemes.2321.tt.clue_total.failure_possible: "Protože jsi shromáždil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] nedostatek důkazů, může tvé neúplné vyšetřování vyvolat odpor místních, pokud je přinutíš zaplatit celou částku"
 laamp_base_contract_schemes.2321.a: "Zaplatíte celou částku."
 laamp_base_contract_schemes.2321.a.tt: "Rozhodneš ve prospěch postavy [employer.GetTitledFirstName] a proti postavě [person_a.GetTitledFirstName]"
 laamp_base_contract_schemes.2321.a.tt.success_standard: "Pokud jsi shromáždil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dostatek důkazů"
 laamp_base_contract_schemes.2321.a.tt.success_qualified: "Pokud nemáš dost důkazů, ale místní ustoupí"
 laamp_base_contract_schemes.2321.a.tt.failure_standard: "Pokud nemáš dost důkazů a místní povstanou"
 laamp_base_contract_schemes.2321.b: "Zaplatíte polovinu."
 laamp_base_contract_schemes.2321.b.tt: "Rozhodneš ve prospěch postavy [employer.GetTitledFirstName], ale přesto zmírníš daňové břemeno postavy [person_a.GetTitledFirstName]"
 laamp_base_contract_schemes.2321.c: "[destination_1.GetBaseNameNoTierNoTooltip] si to očividně skutečně nemůže dovolit."
 laamp_base_contract_schemes.2321.c.tt: "Rozhodneš ve prospěch postavy [person_a.GetTitledFirstName] a proti postavě [employer.GetTitledFirstName]"
 laamp_base_contract_schemes.2322.t.success_critical: "$laamp_base_contract_schemes.2004.t$ – zaplaceno v plné výši"
 laamp_base_contract_schemes.2322.t.success_standard: "$laamp_base_contract_schemes.2004.t$ – zaplaceno"
 laamp_base_contract_schemes.2322.t.success_qualified_insufficient_evidence: "$laamp_base_contract_schemes.2004.t$ – zaplaceno se záští"
 laamp_base_contract_schemes.2322.t.violence: "$laamp_base_contract_schemes.2004.t$ – propuká násilí"
 laamp_base_contract_schemes.2322.desc.violence: "V místnosti zavládne ticho.\n\nNapjaté a tíživé ticho, během něhož se místní navzájem pozorují a jejich nespokojené rty se křiví téměř do vrčení.\n\nNáhle zaskřípe dřevo o kámen a [aggressor.GetTitledFirstName] prudce odstrčí židli dozadu. „Chceš-li rozdávat spravedlnost tak bídně, netvore, připrav se, že okusíš tu naši!“\n\nNásledujících několik minut splývá v jedinou změť. Do místnosti vtrhnou dva mí stoupenci a za nimi hrstka vojáků postavy [person_a.GetTitledFirstName]. Čepele jsou taseny, výhrůžky létají vzduchem a město rychle zachvátí otevřené nepokoje."
 laamp_base_contract_schemes.2322.desc.success_critical: "Mé vyšetřování bylo nepopiratelně důkladné, takže jeho výsledky nemůže zpochybnit ani [person_a.GetTitledFirstName], ani žádný z tamních nohsledů.\n\nA to ani přesto, že tyto výsledky #EMP dokonale#! vyhovují postavě [employer.GetTitledFirstName], která je považuje za natolik příhodné, že mi přidá prémii."
 laamp_base_contract_schemes.2322.desc.success_standard: "Mám dostatek důkazů, abych přesvědčivě prokázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že si místní svůj nejnovější odvod #EMP mohou#! dovolit. Když vše vyložím, poraženecké a únavou naplněné povzdechy kolem mě prozradí, že [person_a.GetTitleAsNameNoTooltip] i ostatní dobře vědí, že mám pravdu.\n\n„Dost, dost, prosím,“ mávne [person_a.GetFirstName] rezignovaně rukou. „Svůj názor jsi předložil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dost jasně. Zaplatíme postavě [employer.GetTitleAsName] vše, co jí náleží.“"
 laamp_base_contract_schemes.2322.desc.success_qualified_insufficient_evidence: "Na krátký a napjatý okamžik to vypadá, že [person_a.GetFirstNameNoTooltip] a tamní nohsledi hodlají proti mému rozhodnutí protestovat, v případě potřeby i silou. Nikdo se však neodváží ujmout vedení a okamžik pomine.\n\n„Velmi... dobře... Můžeš postavě [employer.GetTitleAsName] vyřídit, že její #EMP ‚daň‘#! bude zaplacena. Dál už se bránit nebudeme. Doufejme, že tu příští rok nebudeš, až na nás dopadnou její následky.“"
 laamp_base_contract_schemes.2322.desc.tax_status.has_cash: "Ať tvrdí cokoli, [destination_1.GetBaseNameNoTier] má nepochybně dostatek bohatství nazbyt, navzdory všem námitkám místních hodnostářů."
 laamp_base_contract_schemes.2322.desc.tax_status.partial_cash: "Nějakou dobu je čekají těžké časy, ale jsou to měšťané a jistě si nějak poradí."
 laamp_base_contract_schemes.2322.desc.tax_status.no_cash: "Město kvůli tomu samozřejmě utrpí. Nejspíš značně, ale takový už je život."
 laamp_base_contract_schemes.2322.a: "[employer.GetTitledFirstNameNoTooltip] bude nadšen[Select_CString( employer.IsFemale, 'á', 'ý' )]!"
 laamp_base_contract_schemes.2322.b: "Své povinnosti jsem splnil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dobře."
 laamp_base_contract_schemes.2322.c: "To bylo docela snadné."
 laamp_base_contract_schemes.2322.d: "Nevědomí hulváti, do zbraně!"
 laamp_base_contract_schemes.2322.d.tt.need_troops: "K potlačení nepokojů potřebuješ ve městě alespoň #V 500#! dostupných vojáků"
 laamp_base_contract_schemes.2322.d.tt.success: "Tvé vojsko ve městě potlačí nepokoje"
 laamp_base_contract_schemes.2322.d.tt.failure: "Následuje masakr"
 laamp_base_contract_schemes.2322.e: "Utečte!"
 laamp_base_contract_schemes.2323.t: "$laamp_base_contract_schemes.2004.t$ – částečně zaplaceno"
 laamp_base_contract_schemes.2323.desc: "Místní z mého rozhodnutí nemají právě radost, jak jasně dokládá jejich náhlé reptání. Pochybuji však, že [employer.GetTitledFirstName] bude o mnoho nadšenější.\n\nKompromis však často znamená, že někdo, někdy dokonce všichni, odejde nespokojený, a [person_a.GetTitledFirstName] i tamní kumpáni dobře vědí, že lepšího výsledku se nejspíš nedočkají.\n\n„Tak... tím je to tedy asi uzavřené. Děkuji za tvůj čas, [ROOT.Char.GetTitledFirstNameNoTooltip],“ zabručí [person_a.GetFirstNameNoTooltip].\n\n[person_a.GetHerHis|U] ruka se natáhne k té mé."
 laamp_base_contract_schemes.2323.a: "Myslím, že je to spravedlivý závěr."
 laamp_base_contract_schemes.2323.b: "Dotkni se mé ruky a přijdeš o tu svou, chátro."
 laamp_base_contract_schemes.2323.a.tt.success: "[person_a.GetFirstNameNoTooltip] přijme rozhodnutí dobře"
 laamp_base_contract_schemes.2323.a.tt.failure: "[person_a.GetFirstNameNoTooltip] neprojeví žádnou vděčnost"
 laamp_base_contract_schemes.2323.a.tt.failure.filler: "Neobdržíš žádnou dodatečnou odměnu"
 laamp_base_contract_schemes.2324.t: "$laamp_base_contract_schemes.2004.t$ – neplatné a bezúčinné"
 laamp_base_contract_schemes.2324.desc: "Když jim oznámím, že platit nemusejí, propuknou [person_a.GetTitledFirstName], tamní pochlebovači, a dokonce i služebnictvo, které zjevně poslouchalo u klíčové dírky, v bouřlivý jásot.\n\n[employer.GetTitledFirstName|U] z toho samozřejmě nejspíš nadšen[Select_CString( employer.IsFemale, 'á', 'ý' )] nebude, takže za všechnu tu práci patrně neuvidím jedinou minci. Jakou cenu však vůbec můžeš přisoudit obdivu davu?"
 laamp_base_contract_schemes.2324.desc.second_option: "\n\nNásleduje družný večer, dokud si mě [person_a.GetFirstNameNoTooltip] neodvede stranou k tichému rozhovoru.\n\n„Zastal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] ses nás, [ROOT.Char.GetTitledFirstNameNoTooltip], přesně jak jsem věděl[Select_CString( person_a.IsFemale, 'a', '' )], že učiníš. Takového jednání si u vůdce vážím. Budeš-li chtít, mám jinde známosti, které bych mohl[Select_CString( person_a.IsFemale, 'a', '' )] využít k... #EMP upevnění#! tvého dobrého jména v [claim_duchy.GetDefinitiveName]?“"
 laamp_base_contract_schemes.2324.a: "Doufám, že na to nezapomeneš, [person_a.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.2324.b: "Kéž lidé vyslovují mé jméno s úsměvem!"
 laamp_base_contract_schemes.2331.t: "$laamp_base_contract_schemes.2004.t$ – schopný vůdce"
 laamp_base_contract_schemes.2331.desc: "„[ROOT.Char.GetTitledFirstNameNoTooltip]?“\n\nVzhlédnu od večeře a spatřím dvojici strážných, kteří přivádějí... jakéhosi povědomého člověka z [hopeful.GetCulture.GetName] kultury. Odkud jen [hopeful.GetHerHim] znám...\n\n„Jsem [hopeful.GetTitledFirstName], [ROOT.Char.Custom('MistressMaster')]. Před několika lety jsi rozhodoval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] spor v mém rodném městě [destination_1.GetBaseNameNoTier] a podle mého soudu jsi jednal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] důstojně a obratně.“\n\n„Mé podniky však před časem zkrachovaly a nyní hledám jinou práci. Napadlo mě, že bys pro mě snad... mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] najít využití...“"
 laamp_base_contract_schemes.2331.a: "Přijímám. Najděte [hopeful.GetHerHim] stan!"
 laamp_base_contract_schemes.2331.b: "Byla by tě škoda i na spotřebovanou sůl."
 laamp_base_contract_schemes.2332.t: "$laamp_base_contract_schemes.2004.t$ – krev a mrtvoly"
 laamp_base_contract_schemes.2332.desc.quelled: "Navzdory nekalým úmyslům postavy [person_a.GetTitledFirstName], tamních nohsledů a žoldnéřské domobrany se mé vojsko z [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] hravě vypořádá s jakoukoli špatně vyzbrojenou [destination_1.GetAdjective] chátrou.\n\nNepokoje jsou zakrátko potlačeny. Samozřejmě dojde i na mrtvé a menší rabování, ale způsobili si to sami, když proti mně pozvedli meče. Mrtvola postavy [aggressor.GetTitledFirstName] je toho důkazem.\n\nKdyž je situace nyní o něco více #EMP pod kontrolou#!, zdvořile, avšak důrazně doporučím postavě [person_a.GetFirstNameNoTooltip], aby zaplatila. Svou. Daň.\n\n#BOL Hned#!."
 laamp_base_contract_schemes.2332.desc.massacre: "To, co následuje, není ničím menším než masakrem.\n\nObyvatelé [destination_1.GetBaseNameNoTier] jsou houževnatí a rozzuření, ale jakmile se potulným zabijákům z [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] rozproudí krev, nemohou se jim rovnat.\n\nZanedlouho začne plenění. Noční oblohou se rozléhá křik, mrtvoly se kupí a [person_a.GetTitledFirstName], [person_b.GetTitledFirstName], [person_c.GetTitledFirstName] i [person_d.GetTitledFirstName] jsou v boji pobiti.\n\nTohle [employer.GetTitledFirstName] nenařídil[Select_CString( employer.IsFemale, 'a', '' )] a pochybuji, že za to hodlá zaplatit."
 laamp_base_contract_schemes.2332.a: "Někdy si to okolnosti žádají."
 laamp_base_contract_schemes.2332.b: "Tohle... se vymklo kontrole."
 laamp_base_contract_schemes.2332.c: "#EMP Inu.#!"
 laamp_base_contract_schemes.2332.d: "Odměna stranou, jak znamenitý závěr celé záležitosti!"
 laamp_base_contract_schemes.2541.t: "$laamp_base_contract_schemes.2011.t$ – [location.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.2541.desc.fluff_type.boredom: "Zdejší lidé nejeví o náš úkol žádný zájem, přestože pochází od jejich [employer.GetTitleAsNameNoTooltip]. Ani jméno a pečeť postavy [employer.GetFirstName] je nepřimějí k ničemu nad rámec toho, co nezbytně vyžaduje zákon a slušnost.\n\nPořizovat zde záznamy je zdlouhavé a únavné, ale odhodlání si žádá vytrvalost a my #EMP jsme#! odhodláni vydělat si své stříbro."
 laamp_base_contract_schemes.2541.desc.fluff_type.paranoia: "Obyvatelé [location.GetNameNoTier] přijmou náš příchod se stěží skrývaným nepřátelstvím.\n\nAktualizaci záznamů postavy [employer.GetTitledFirstName] zjevně považují za #EMP neklamné#! znamení blížícího se neštěstí, ať už války, nebo daně z hlavy, a naše dotazy často odmítají.\n\nMáme však práci, kterou musíme dokončit, a žádný vyhýbavý sedlák se nám mezi odměnu a nás nepostaví."
 laamp_base_contract_schemes.2541.desc.fluff_type.happiness: "V [location.GetNameNoTier] nás obyvatelé vítají jásotem, koši jídla a veškerým veselím rodiny, které se z daleké války vrátili příbuzní.\n\nZdá se, že jméno postavy [employer.GetTitledFirstName] je v těchto zemích mezi jejími poddanými opředeno legendami natolik, že každý vzkaz od milované postavy [employer.GetTitleAsNameNoTooltip] je důvodem k oslavě.\n\nNení třeba dodávat, že nám při plnění úkolu dychtivě nabízejí veškerou pomoc a podporu, kterou mohou poskytnout."
 laamp_base_contract_schemes.2541.desc.fluff_type.disgust: "Zdá se, že [location.GetNameNoTier] není služebníkům postavy [employer.GetTitledFirstName] nakloněn.\n\nNáš příchod se setká s otevřeným výsměchem a naše dotazy jsou přehlíženy nebo přímo zesměšňovány. Místní mohou být sebeotravnější, ale pokud je nedokážeme přimět k poslušnosti, ohrožujeme svou drahocennou odměnu, a to nelze dopustit."
 laamp_base_contract_schemes.2541.desc.fluff_type.admiration: "Obyvatelé [location.GetBaseNameNoTier] působí dostatečně poddajně.\n\nŽádné obavy z blížících se daní ani nové války, jen lidé, kteří si hledí svého života a přijímají svůj úděl. Když zavítá zástupce jejich [Concept('liege','lenního pána')|E], věnují mu náležitou pozornost.\n\nPečeť postavy [employer.GetTitledFirstName] nám pomáhá překonat většinu drobných místních překážek, ale lidé jsou natolik spokojení, že ji téměř nemusíme používat."
 laamp_base_contract_schemes.2541.desc.fluff_type.worry: "Obyvatelé [location.GetNameNoTier] mají z nějakého důvodu za to, že mohou oprávněně pochybovat o úmyslech postavy [employer.GetTitledFirstName], přinejmenším natolik, že s námi spolupracují jen #EMP neochotně#!.\n\nJe to únavné, ale alespoň zvládnutelné. Znamená to pouze, že získat od obyvatel údaje o každé domácnosti je jednotvárná, ne-li přímo nepříjemná dřina."
 laamp_base_contract_schemes.2541.a: "Dobrá, pusťme se do toho."
 laamp_base_contract_schemes.2541.a.tt.success: "Důkladný soupis"
 laamp_base_contract_schemes.2541.a.tt.success.tt: "+1 #P úspěšný#! soupis"
 laamp_base_contract_schemes.2541.a.tt.easier.happiness: "#WEAK Výrazně snazší díky postoji místních k jejich [Concept('liege','lennímu pánovi')|E]#!"
 laamp_base_contract_schemes.2541.a.tt.easier.easier_admiration: "#WEAK O něco snazší díky postoji místních k jejich [Concept('liege','lennímu pánovi')|E]#!"
 laamp_base_contract_schemes.2541.a.tt.failure: "Zjevné nepřesnosti"
 laamp_base_contract_schemes.2541.a.tt.failure.tt: "+1 #N neúspěšný#! soupis"
 laamp_base_contract_schemes.2541.b: "Údaje o tomto městě půjde snadno zfalšovat..."
 laamp_base_contract_schemes.2541.b.tt: "$laamp_base_contract_schemes.2541.a.tt.success.tt$ #WEAK (nepoctivost umožňuje výsledek $label_failure_critical$)#!"
 laamp_base_contract_schemes.2541.c: "Myslím, že tady se nemusíme příliš snažit..."
 laamp_base_contract_schemes.2541.c.tt.explicit_odds_note: "#WEAK Tato zkouška je celkově o něco snazší než zkouška [Concept('stewardship','správcovské dovednosti')|E]#!"
 laamp_base_contract_schemes.2541.c.tt.success: "Věrohodně zfalšuješ místní soupis"
 laamp_base_contract_schemes.2541.c.tt.success.tt: "$laamp_base_contract_schemes.2541.b.tt$"
 laamp_base_contract_schemes.2541.c.tt.failure: "Tvé výmysly jsou zjevné"
 laamp_base_contract_schemes.2541.c.tt.failure.tt: "$laamp_base_contract_schemes.2541.a.tt.failure.tt$ #WEAK (nepoctivost umožňuje výsledek $label_failure_critical$)#!"
 laamp_base_contract_schemes.2541.d.officer_exists: "[officer.GetFirstNameNoTooltip], můžeš začít."
 laamp_base_contract_schemes.2541.d.officer_unexists: "Kéž bych měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] kvartýrmistra..."
 laamp_base_contract_schemes.2541.e: "Prostě tam něco napište, koho to zajímá?"
 laamp_base_contract_schemes.2541.e.success: "Věrohodné bláboly"
 laamp_base_contract_schemes.2541.e.success.tt: "$laamp_base_contract_schemes.2541.b.tt$"
