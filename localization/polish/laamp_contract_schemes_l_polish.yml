 laamp_base_contract_schemes.0571.b: "Štědrý dar bohatě postačí."
 laamp_base_contract_schemes.0571.c: "Lepší je kozu dojit než zabít."
 laamp_base_contract_schemes.0571.d: "Neriskuj vůbec nic."
