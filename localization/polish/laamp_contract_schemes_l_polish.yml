 laamp_base_contract_schemes.0561.e: "Raději nechme věci tak, jak jsou."
 laamp_base_contract_schemes_0561_charmed_insider_modifier: "Okouzlený důvěrník"
 laamp_base_contract_schemes_0561_charmed_insider_modifier_desc: "Trocha okouzlení dokáže mnoho."
 laamp_base_contract_schemes_0561_bored_insider_modifier: "Znuděný důvěrník"
 laamp_base_contract_schemes_0561_bored_insider_modifier_desc: "Jsou horší věci než být nápadně nudný. Není jich však mnoho."
