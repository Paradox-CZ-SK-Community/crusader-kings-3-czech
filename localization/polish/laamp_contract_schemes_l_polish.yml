 laamp_base_contract_schemes.2541.e.tt.employer_has_trait.lazy: "#WEAK Pravděpodobnější, protože [employer.GetTitledFirstName] je [GetTrait('lazy').GetName( GetNullCharacter )]#!"
 laamp_base_contract_schemes.2541.e.failure: "Zjevné lži"
