 laamp_contract_scheme_desc_general_boilerplate: "\n\n#WEAK [Concept('contract_schemes','Intriky zakázek')|E] spočívají v plnění různých úkolů pro [Concept('rulers','zeměpány')|E] celého světa výměnou za odměnu. $game_concept_ruler$ se po dokončení $game_concept_task_contract$ automaticky přidá na tvůj [Concept('contact_list','seznam patronů')|E].#!"
 laamp_contract_scheme_desc_success_boilerplate: "Za úspěšné dokončení této [Concept('contract_scheme','intriky zakázky')|E] dostaneš zaplaceno, #EMP pokud#! bude [Concept('contractor','zadavatel')|E] spokojen."
