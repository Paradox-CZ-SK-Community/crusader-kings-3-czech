 laamp_base_contract_schemes.2311.t: "$laamp_base_contract_schemes.2004.t$ – [char_current.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.2311.desc.business.council_chamber: "Prostory, které [char_current.GetFirstName] užívá z titulu funkce městského [char_current.GetTitleAsNameNoTooltip], jsou překvapivě rozlehlé. [char_current.GetSheHe|U] mě zavede do místnosti, která očividně slouží k poradám nejvýznamnějších obyvatel města, a usadí mě v čele stolu."
 laamp_base_contract_schemes.2311.desc.business.armory: "[char_current.GetFirstName] nás zavede ke zdroji svého bohatství. Do dobře zásobené zbrojnice s přilehlou kovárnou, která dodává zbraně a střelivo místní domobraně i projíždějícím karavanám."
 laamp_base_contract_schemes.2311.desc.business.temple: "Zdá se, že [char_current.GetFirstName] získává většinu svého bohatství pronajímáním nocleháren návštěvníkům místní svatyně a provozováním drobné dobročinnosti. Samozřejmě si z ní ponechává malý díl pro sebe."
 laamp_base_contract_schemes.2311.desc.business.dungeon: "Zdá se, že [char_current.GetFirstName] spravuje malý žalář a vydělává na tom, že za jiné drží pod zámkem dlužníky, tuláky a zločince. Provoz navíc doplňují nemalé příjmy z poplatků a pokut ukládaných vězňům."
 laamp_base_contract_schemes.2311.desc.business.docks: "[char_current.GetFirstName] očividně získává peníze z městského přístavu, kde má dobře vybavenou kancelář s výhledem na nejrušnější mola. Dvě široké okenice umožňují občas se vyklonit a okřikovat líné nosiče."
 laamp_base_contract_schemes.2311.desc.business.study: "Učenecká obec v [destination_1.GetBaseNameNoTier] je malá, ale houževnatá. Zdá se, že většina místních písařů tak či onak pracuje pro postavu [char_current.GetFirstName], která díky téměř úplnému monopolu na písemnosti ve městě provozuje výnosný podnik."
 laamp_base_contract_schemes.2311.desc.business.physicians_study: "[char_current.GetFirstName] podle všeho obchoduje především s léčivy, poskytuje léčitelské služby a zajišťuje schopné porodní báby. Pro městského hodnostáře je to neobvyklé zaměstnání, avšak poptávka po něm rozhodně nechybí."
 laamp_base_contract_schemes.2311.desc.business.tavern: "Stejně jako u mnoha jiných proudí i [char_current.GetFirstNamePossessive] příjmy přímo z žíznivých rukou prostých dělníků z [destination_1.GetBaseNameNoTier]. Dobré jídlo pro pocestné, hudba pro místní a družná atmosféra vytvářejí výnosný podnik."
 laamp_base_contract_schemes.2311.desc.business.bp1_kitchen_western: "[char_current.GetFirstNamePossessive] podnikání se točí kolem skladování a obstarávání potravin, od cizokrajných pochoutek po běžné zásoby ve velkém. Prostý lid v časech nouze získává levné obilniny a místní elita má kam zajít pro módní pokrmy ze vzdáleného hlavního města."
 laamp_base_contract_schemes.2311.desc.business.market: "[char_current.GetFirstName] spravuje hlavní tržiště v [destination_1.GetBaseNameNoTier], prostý, ale výnosný podnik. Přiděluje místa pro stánky, vybírá poplatky, shromažďuje daně pro postavu [person_a.GetTitleAsNameNoTooltip] a obstarává vše ostatní, co se od této funkce očekává."
 laamp_base_contract_schemes.2311.desc.business.bath_house: "[char_current.GetFirstName] provozuje uvnitř hradeb [destination_1.GetBaseNameNoTier] prosperující lázně, které představují malý ostrůvek přepychu. Každý rozumný člověk dokáže ocenit dobrou koupel, jež smyje prach a špínu dnešního světa, a několik mincí za tuto výsadu stojí za zaplacení."
 laamp_base_contract_schemes.2311.desc.personality.mayor: "„Ctěný [ROOT.Char.GetTitleAsNameNoTooltip], jistě musíš uznat, že [employer.GetTitleAsNamePossessive] chamtivost je... nemístná. [employer.GetSheHe|U] tě pověřil[Select_CString( employer.IsFemale, 'a', '' )] svou pravomocí. Pomoz nám v této věci a my se postaráme, aby se svět dozvěděl o tvé štědrosti.“"
 laamp_base_contract_schemes.2311.desc.personality.ai_honor: "„Jak vidíš, mé podniky jsou úspěšné, ale sotva rozsáhlé. Odvádíme zde dobrou a poctivou práci, avšak tak prudké zvýšení [employer.GetTitleAsNamePossessive] odvodů si nemůžeme dovolit.“"
 laamp_base_contract_schemes.2311.desc.personality.ai_zeal: "„Konáme zde dílo božstva [char_current.GetFaith.HealthGodName], [ROOT.Char.GetTitledFirstNameNoTooltip], a o tom není sporu. Další desátek by nás zruinoval, to musí být zcela zřejmé.“"
 laamp_base_contract_schemes.2311.desc.personality.ai_greed: "„Dostávám svůj spravedlivý podíl? Ano, samozřejmě. Právě v tom však spočívá podstata věci. Je to #EMP můj#! podíl. Platím daně, které platit musím, ale tohle není řádná daň. Je to jen jakýsi nesmyslný rozmar postavy [employer.GetTitleAsName] a všichni to víme.“"
 laamp_base_contract_schemes.2311.desc.personality.ai_compassion: "„Působíš jako rozumný člověk, [ROOT.Char.GetTitledFirstNameNoTooltip]. Pochop prosím, že děláme vše, co můžeme, ale od nesnází, či dokonce hladomoru, nás vždy dělí jediný špatný rok.“"
 laamp_base_contract_schemes.2311.desc.personality.ai_boldness: "„Považuji se za člověka, který nemá rád vytáčky. Mluvím otevřeně a doufám, že ostatní budou mluvit stejně se mnou. [employer.GetTitleAsNamePossessive] #EMP daň#! je nespravedlivá a my ji nemůžeme zaplatit. Nic víc na tom není.“"
 laamp_base_contract_schemes.2311.desc.personality.ai_rationality: "„Vím, vím, vypadá to, že se nám daří dobře. Tohle však zdaleka není první mimořádný #EMP odvod#!, který na nás [employer.GetTitleAsName] letos uvalil[Select_CString( employer.IsFemale, 'a', '' )], a obávám se, že nebude ani poslední. Musíš pochopit naši neochotu.“"
 laamp_base_contract_schemes.2311.desc.personality.ai_vengefulness: "„Rád[Select_CString( char_current.IsFemale, 'a', '' )] jednám čestně, [ROOT.Char.GetTitledFirstNameNoTooltip], ať už v obchodě, se svými podřízenými či nadřízenými. Spravedlnost má však smysl jen tehdy, když se jí řídí všichni. Jinak... právě tak mezi #EMP některými#! lidmi vzniká zlá krev.“"
 laamp_base_contract_schemes.2311.desc.personality.ai_energy: "„Oba máme spoustu práce, takže budu mluvit přímo. Kdybychom ty peníze měli, rádi bychom je zaplatili. Nemáme je, takže je nezaplatíme. To snad stačí, ne?“"
 laamp_base_contract_schemes.2311.desc.personality.ai_sociability: "„Poslyš, nechme tuto nepříjemnou záležitost za sebou a dejme si něco k pití. Proč se tu chvíli nezdržíš? Do našeho městečka zavítají tak zajímaví hosté jen zřídka. Jistě by sis alespoň týden nemusel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dolévat vlastní pohár.“"
 laamp_base_contract_schemes.2311.desc.personality.ai_personality_fallback: "„Takže... jak při tom budeme postupovat? Nevedu si přece soupis úplně všeho. To by bylo neúnosně nákladné. Mnoho dohod se uzavírá pouhým stiskem ruky, jiné smlouvy jsou uložené jinde, však víš, jak to chodí...“"
 laamp_base_contract_schemes.2311.desc.loot.gold: "Zatímco [char_current.GetSheHe] hovoří, mé myšlenky se vracejí k velké truhle, nejspíš plné stříbra, kolem níž jsme cestou prošli..."
 laamp_base_contract_schemes.2311.desc.loot.courtier_opinion: "[char_current.GetSheHe|U] během chůze hovoří a já si nemohu nevšimnout skladiště napěchovaného přepychovým zbožím, kolem něhož procházíme..."
 laamp_base_contract_schemes.2311.desc.loot.piety: "[char_current.GetSheHe|U] dál tlachá, ale já si nemohu nevšimnout výklenku přeplněného drahocennými náboženskými předměty..."
 laamp_base_contract_schemes.2311.desc.loot.provisions: "[char_current.GetSheHe|U] dál hovoří, ale mně nejde z mysli dobře zásobená kuchyně, kolem níž jsme sem procházeli..."
