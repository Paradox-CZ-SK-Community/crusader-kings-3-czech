 laamp_extra_contract_schemes.0001.t_culture: "$ep3_contract_event.0020.t$"
 laamp_extra_contract_schemes.0001.t_faith: "$ep3_contract_event.0021.t$"
 laamp_extra_contract_schemes.0001.desc_culture: "Se svými druhy dospěji ke shodě. My z [ROOT.Char.GetPrimaryTitle.GetName] nejlépe pomůžeme lidem z [task_contract_employer.GetCulture.GetCollectiveNoun] provedením intriky [scheme.GetName].\n\n"
 laamp_extra_contract_schemes.0001.desc_faith: "Se svými druhy dospěji ke shodě. My z [ROOT.Char.GetPrimaryTitle.GetBaseName] nejlépe pomůžeme vyznavačům [task_contract_employer.GetFaith.GetAdherentNamePlural] provedením intriky [scheme.GetName].\n\n"
 laamp_extra_contract_schemes.0001.desc_diplomacy: "[task_contract_employer.GetTitledFirstName] začne pořádat řadu slyšení, během nichž budou podrobeny zkoušce mé řečnické schopnosti. Úspěšné vyjednávání se zástupci postavy [task_contract_target.GetTitledFirstName] může mému zadavateli zajistit požadovaná privilegia."
 laamp_extra_contract_schemes.0001.desc_martial: "[task_contract_target.GetTitledFirstName] působí jako docela rozumný člověk. Vzepře se, až mí otrlí stoupenci začnou bít místní úředníky? Bude se bránit, až začneme vést davy rolníků, aby provolávaly hesla a zakládaly požáry? Ne, bude lepší jednoduše přistoupit na podmínky postavy [task_contract_employer.GetTitledFirstName]..."
 laamp_extra_contract_schemes.0001.desc_intrigue: "[task_contract_target.GetTitledFirstName] nemůže být odoln[Select_CString( task_contract_target.IsFemale, 'á', 'ý' )] vůči všem světským potěšením ani natolik hrd[Select_CString( task_contract_target.IsFemale, 'á', 'ý' )] a mocn[Select_CString( task_contract_target.IsFemale, 'á', 'ý' )], aby se nestyděl[Select_CString( task_contract_target.IsFemale, 'a', '' )] za odhalení svých poklesků... Vhodně zvolené vydírání by dokonce mohlo zajistit budoucnost lidu postavy [task_contract_target.GetTitledFirstName]."
 laamp_extra_contract_schemes.0001.desc_learning: "Jako každý právní řád musí i zákoník [task_contract_target.GetPrimaryTitle.GetBaseNameNoTier] obsahovat nějaká zapomenutá pravidla a výjimky, z nichž by některou bylo možné využít ve prospěch lidu postavy [task_contract_employer.GetTitledFirstName]. Musím jen najít něco, čeho se mohou dovolávat."
 laamp_extra_contract_schemes.0001.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_extra_contract_schemes.0001.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_extra_contract_schemes.0001.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_extra_contract_schemes.0001.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_extra_contract_schemes.0001.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_extra_contract_schemes.0002.t_diplomacy: "$protect_minority_vassal_contract_diplomacy_scheme$ – úspěch"
 laamp_extra_contract_schemes.0002.t_martial: "$protect_minority_vassal_contract_martial_scheme$ – úspěch"
 laamp_extra_contract_schemes.0002.t_intrigue: "$protect_minority_vassal_contract_intrigue_scheme$ – úspěch"
 laamp_extra_contract_schemes.0002.t_learning: "$protect_minority_vassal_contract_learning_scheme$ – úspěch"
 laamp_extra_contract_schemes.0002.desc_diplomacy: "Přímo v síni postavy [task_contract_target.GetName] hájím věc postavy [task_contract_employer.GetTitledFirstName]. S dobrými zprávami a jásotem stále znějícím v uších se vracím ke svému zadavateli. \n\n„[task_contract_target.GetSheHe|U] tomu říká ‚drobnost, kterou lze snadno napravit‘!“ raduje se [task_contract_employer.GetSheHe]. „Jak znamenitě ses zastal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] oné ‚drobnosti‘, kterou je svoboda mého lidu! Naše ochranná privilegia budou brzy oficiálně vyhlášena a sotva bych mohl[Select_CString( task_contract_employer.IsFemale, 'a', '' )] být spokojenější.“"
 laamp_extra_contract_schemes.0002.desc_martial: "Jak se dalo čekat, mí otrlí stoupenci šíří strach v panství postavy [task_contract_target.GetTitledFirstName] a nakonec ji z oslabené pozice donutí zasednout k jednacímu stolu.\n\n„Způsobil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsi zkázu, na kterou utlačovatelé lidu z [task_contract_employer.GetPrimaryTitle.GetNameNoTier] dlouho nezapomenou!“ obdivuje mě [task_contract_employer.GetTitledFirstNameNoTooltip]. „O ochranná práva by měli prosit #EMP oni#!! Tak či onak budou nové povinnosti mého lenního pána brzy zavedeny. Velké vítězství!“"
 laamp_extra_contract_schemes.0002.desc_intrigue: "[task_contract_target.GetName] je velmi složitá osobnost. Myslím mravy, nikoli rozum! Nashromáždil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem bohatou zásobu vyloženě jedovatých pověstí. Několik pečlivě zvolených slov a [task_contract_target.GetTitleAsNameNoTooltip] si uvědomí, o kolik důstojnosti [task_contract_target.GetHerHe] přijde, pokud se postaví proti postavě [task_contract_employer.GetTitledFirstName].\n\n„Jak snadno by se dvůr mého lenního pána mohl proměnit v odporné hadí hnízdo!“ zajásá [task_contract_employer.GetTitledFirstName]. „Budu milosrdn[Select_CString( task_contract_employer.IsFemale, 'á', 'ý' )] a dám mu příležitost přiznat mému lidu jeho práva... dříve než uvrhnu [task_contract_employer.GetHerHis] záležitosti do naprostého chaosu.“"
 laamp_extra_contract_schemes.0002.desc_learning: "Studuji vše, co lze nalézt o [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip] právu. Kánony [task_contract_target.GetFaith.GetName], zásady [task_contract_target.GetCulture.GetName] kultury... Ano, shromáždil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem skutečný arzenál precedentů a právních nuancí.\n\n„Vysvětli mi to ještě jednou...“ žádá [task_contract_employer.GetTitledFirstName]. „Při zmínce o nedotknutelné cti se musím dovolávat božstva [task_contract_target.GetFaith.WarGodName], je to tak? Ale na tom nezáleží. Náš případ je silnější než kdy dříve! Souhlas postavy [task_contract_target.GetTitledFirstName] je už pouhou formalitou.“"
 laamp_extra_contract_schemes.0002.a: "Lid z [task_contract_employer.GetCapitalLocation.GetNameNoTooltip] se může radovat!"
 laamp_extra_contract_schemes.0003.t_diplomacy: "$protect_minority_vassal_contract_diplomacy_scheme$ – neúspěch"
 laamp_extra_contract_schemes.0003.t_martial: "$protect_minority_vassal_contract_martial_scheme$ – neúspěch"
 laamp_extra_contract_schemes.0003.t_intrigue: "$protect_minority_vassal_contract_intrigue_scheme$ – neúspěch"
 laamp_extra_contract_schemes.0003.t_learning: "$protect_minority_vassal_contract_learning_scheme$ – neúspěch"
 laamp_extra_contract_schemes.0003.desc_diplomacy: "[task_contract_target.GetNamePossessive] strana mi neposkytuje vůbec nic, žádný prostor k ústupkům ani sebemenší pochopení. Ať řeknu cokoli, [task_contract_target.GetPrimaryTitle.GetAdjective] zástupci se mi jen smějí do tváře.\n\n„Bylo mi řečeno, že můj lenní pán už má tvého #EMP naléhání plné zuby#!!“ vykřikne [task_contract_employer.GetTitledFirstNameNoTooltip]. „Tvému měkkému srdci i mému žalostnému lidu se vysmívá celé [task_contract_employerr.GetPrimaryTitle.GetNameNoTierNoTooltip]! Tvůj plán byl od počátku průhledný... a následky teď neseme #EMP my#!.“"
 laamp_extra_contract_schemes.0003.desc_martial: "Zatímco mí stoupenci řádí v [task_contract_target.GetPrimaryTitle.GetName], [task_contract_target.GetName] neustoupí. Každý útok na tamní lid je stejnou měrou oplácen lidu postavy [task_contract_employer.GetTitledFirstName].\n\n„Máme toho dost!“ prohlásí můj zadavatel. „Tyto kruté časy nás zničí! Pošli své hrdlořezy pryč, nebo se mí [task_contract_employer.Custom('KnightCulturePluralNoTooltip')|l] spojí s těmi, kteří slouží mému lennímu pánovi, a společně se postaví proti tobě!“"
 laamp_extra_contract_schemes.0003.desc_intrigue: "[task_contract_target.GetName] se ukazuje jako velmi chytrá a diskrétní osobnost. Protože se mi nepodařilo nalézt žádnou skutečně závažnou špínu, pokusil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem se šířit u tamního dvora pověsti, ale každá je okamžitě zpochybněna a potlačena.\n\n„Tví spolčenci žvatlají jako děti!“ urazí mě zadavatel. „Tvrdíš, že tvé intriky ochrání můj lid jako zbroj, ale opásal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsi nás jen stíny a šepotem, které se rozplynou, jakmile zaznějí nahlas! Tento plán byl od počátku marný...“"
 laamp_extra_contract_schemes.0003.desc_learning: "Studuji vše, co lze nalézt o [task_contract_target.GetPrimaryTitle.GetAdjectiveNoTooltip] právu. Kánony [task_contract_target.GetFaith.GetName], zásady [task_contract_target.GetCulture.GetName] kultury... Shromáždím několik chabých argumentů, ale můj tvořivý právnický žargon na postavu [task_contract_employer.GetName] příliš nezapůsobí.\n\n„#EMP Tohle#! je vše, s čím přicházíš? Myslíš si, že by se s mým lidem mělo v [task_contract_target.GetPrimaryTitle.GetName] z právního hlediska zacházet jako s #EMP dětmi#!?“ vykřikne [task_contract_employer.GetTitleAsNameNoTooltip]. „Malicherný a ponižující plán, který [task_contract_target.GetTitledFirstName] snadno prohlédne! Ne, jsme bez naděje.“"
 laamp_extra_contract_schemes.0003.a: "Postavě [task_contract_employer.GetTitledFirstNameNoTooltip] jsem situaci nezlepšil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]..."
 laamp_help_find_secrets_scheme: "Hledat tajemství"
 laamp_help_find_secrets_scheme_action: "Hledat tajemství o"
 laamp_help_find_secrets_scheme_desc: "Odhal tajemství [Concept('vassals','vazalů')|E] [Concept('contractor','zadavatele')|E], abys je mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] vydírat a získat na ně [Concept('hooks','páky')|E], nebo o nich podat zprávu svému [Concept('contractor','zadavateli')|E]."
 laamp_help_find_secrets_scheme_desc_general: "$laamp_help_find_secrets_scheme_desc$"
 laamp_help_find_secrets_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_extra_contract_schemes.0022.t: "$ep3_contract_event.0100.t$"
 laamp_extra_contract_schemes.0022.a: "Tuto páku si ponechám pro sebe."
 laamp_extra_contract_schemes.0022.b: "[councillor_liege.GetTitleAsNameNoTooltip] získá dokonalou páku."
 laamp_extra_contract_schemes.0022.c: "Tak hluboko klesnout nedokážu."
 laamp_extra_contract_schemes.0023.t: "$ep3_contract_event.0100.t$"
 laamp_extra_contract_schemes.0023.desc: "„Má vrchnost je spokojena s poznatky, které jsi získal[Select_CString( ROOT.Char.IsFemale, 'a', '' )]. Kolik že jsi toho odhalil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]? [secrets_found_value]? To není maličkost...“ [task_contract_councillor.GetName] vystoupí do světla a já si uvědomím, že je nějakým způsobem se mnou ve stanu.\n\n„Jak ses sem dostal[Select_CString( task_contract_councillor.IsFemale, 'a', '' )] bez povšimnutí?“ zeptám se zmateně, ale než stačím zavolat stráže, už tam nikdo není. Zůstal po ní jen objemný měšec mincí."
 laamp_extra_contract_schemes.0023.a: "Prostě si vezmu zlato. Raději nad tím nebudu přemýšlet."
 laamp_extra_contract_schemes.0024.t: "$ep3_contract_event.0100.t$"
 laamp_extra_contract_schemes.0024.desc: "„Čekal[Select_CString( task_contract_councillor.IsFemale, 'a', '' )] jsem na tvou zprávu, ale žádná nepřišla. Začínal[Select_CString( task_contract_councillor.IsFemale, 'a', '' )] jsem se obávat... Snad jsi na naši dohodu nezapomněl[Select_CString( ROOT.Char.IsFemale, 'a', '' )]?“ [task_contract_councillor.GetName] mi spílá právě ve chvíli, kdy se blížím k latríně! Ta drzost! Jak se sem dostal[Select_CString( task_contract_councillor.IsFemale, 'a', '' )] bez povšimnutí?\n\n„Měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem své lidi na každém rohu v [task_contract_target.GetCapitalLocation.GetName], ale bezvýsledně,“ vysvětluji. „Buď jsou [task_contract_target.GetTitledFirstNamePossessive] dvořané věrní, nebo zde zkrátka není nic, co by stálo za povídačky.“\n\n„Dětinská výmluva... Čekal[Select_CString( task_contract_councillor.IsFemale, 'a', '' )] jsem od tebe něco lepšího. Přinejmenším nějakou líbivější lež. Považuj naši dohodu za ukončenou.“ [task_contract_councillor.GetFirstNameNoTooltip] potřese [task_contract_target.GetHerHis] hlavou a zmizí stejně rychle, jako se objevil[Select_CString( task_contract_councillor.IsFemale, 'a', '' )]."
 laamp_extra_contract_schemes.0024.a: "Taková ztráta času!"
 laamp_extra_contract_schemes.0030.t: "$ep3_contract_event.0080.t$"
 laamp_extra_contract_schemes.0030.desc: "Zpráva o mém nově zfalšovaném nároku se rychle donese k postavě [task_contract_councillor.GetName].\n\n„Blahopřeji! Dobře odvedená práce,“ pronese [task_contract_councillor.GetSheHe|U], jako by se [Select_CString( task_contract_councillor.IsFemale, 'sama', 'sám' )] poplácával[Select_CString( task_contract_councillor.IsFemale, 'a', '' )] po zádech.\n\n„[task_contract_councillor_liege.GetTitledFirstName] bude mít velikou radost a jistě tě náležitě odmění. O naši drahocennou listinu se odtud postarám já... stačí, když mi ji předáš.“ [task_contract_councillor.GetFirstNameNoTooltip] začíná být rychle rozrušen[Select_CString( task_contract_councillor.IsFemale, 'á', 'ý' )]. „No tak! Dej mi ji!“ naléhá [task_contract_councillor.GetSheHe] a luská prsty."
 laamp_extra_contract_schemes.0030.a: "Jednu kopii si ponechám."
 laamp_extra_contract_schemes.0030.b: "[target.GetNameNoTooltip] se dostane do lepších rukou!"
 laamp_extra_contract_schemes.0030.c: "Už ti nevěřím..."
 laamp_prison_break_scheme: "Útěk z vězení"
 laamp_prison_break_scheme_action: "Osvobodit z vězení"
 laamp_prison_break_scheme_desc: "Naplánuj a proveď osvobození [Concept('spouse','manžela či manželky')|E], člena [Concept('family','rodiny')|E], [Concept('best_friend','nejlepšího přítele')|E] nebo [Concept('soulmate','spřízněné duše')|E] [Concept('contractor','zadavatele')|E] z [Concept('prison','vězení')|E]."
 laamp_prison_break_scheme_desc_general: "$laamp_prison_break_scheme_desc$"
 laamp_prison_break_scheme_desc_success: "$laamp_contract_scheme_desc_success_boilerplate$"
 laamp_extra_contract_schemes.0011.t: "$ep3_contract_event.0030.t$"
 laamp_extra_contract_schemes.0011.desc: "[task_contract_employer.GetTitledFirstName] se moudře obrátil[Select_CString( task_contract_employer.IsFemale, 'a', '' )] s tak pošetilým podnikem právě na mě, [ROOT.Char.GetLiege.Custom('KnightCultureNoTooltip')|l], který nemá mnoho co ztratit... Za hradby [task_contract_target.GetCapitalLocation.GetName] lze proklouznout několika způsoby, ale žádný není bez značného rizika. Pomocí nějaké chytré záminky musím dostat spolehlivé oči až k cele postavy [task_contract_object.GetTitledFirstName]...\n\n[task_contract_employer.Custom2('HerHisCharacterIntroduction', task_contract_object)|U] by sebemenším zapojením vzbudil[Select_CString( task_contract_object.IsFemale, 'a', '' )] pozornost. Ne, jedinou nadějí této osoby na svobodu zůstává [ROOT.Char.GetPrimaryTitle.GetBaseName]."
 laamp_extra_contract_schemes.0011.a: "$laamp_base_contract_schemes.0000.generic_option.success_chance$"
 laamp_extra_contract_schemes.0011.b: "$laamp_base_contract_schemes.0000.generic_option.speed$"
 laamp_extra_contract_schemes.0011.c: "$laamp_base_contract_schemes.0000.generic_option.progress$"
 laamp_extra_contract_schemes.0011.d: "$laamp_base_contract_schemes.0000.generic_option.nothing$"
 laamp_extra_contract_schemes.0011.d.tt: "$laamp_base_contract_schemes.0000.d.no_starting_bonus$"
 laamp_extra_contract_schemes.0012.t: "$laamp_prison_break_contract_contract$ – úspěch"
 laamp_extra_contract_schemes.0012.desc_thief: "$laamp_extra_contract_schemes.0013.desc_intro$ [agent_thief.GetFirstName] si obratně a rychle poradí se zámkem, který nás dělí od postavy [task_contract_object.GetTitledFirstName]."
 laamp_extra_contract_schemes.0012.desc_no_thief: "$laamp_extra_contract_schemes.0013.desc_intro$ Prsty mám kluzké nervózním potem, ale paklíč přesto spolehlivě cvakne."
 laamp_extra_contract_schemes.0012.desc_lookout: "[agent_lookout.GetFirstName] nám pozorně dává znamení, že je vzduch čistý."
 laamp_extra_contract_schemes.0012.desc_no_lookout: "Pak se horečně rozhlédnu po strážích. Zdá se, že můžeme vyrazit."
 laamp_extra_contract_schemes.0012.desc: "Gestem umlčím [task_contract_object.GetFirstNameNoTooltip] a odvádím [Select_CString( task_contract_object.IsFemale, 'ji', 'ho' )] do stínů."
 laamp_extra_contract_schemes.0012.desc_infiltrator: "Zpět se vydáváme stejnou cestou, oknem, které nám nechal[Select_CString( agent_infiltrator.IsFemale, 'a', '' )] otevřené [agent_infiltrator.GetFirstName]."
 laamp_extra_contract_schemes.0012.desc_no_infiltrator: "Zpět se vydáváme stejnou cestou, zdánlivě nestřeženou chodbou."
 laamp_extra_contract_schemes.0012.desc_free: "Proplížíme se ke koním, vyšvihneme se do sedel a prudce vyrazíme.\n\n„Skutečně ti vděčím za život!“ pronese [task_contract_object.GetNameNoTooltip], když konečně zpomalíme. „A jaké to bylo vzrušení!“"
 laamp_extra_contract_schemes.0012.a: "„Takový přístup se mi líbí... přidej se k nám!“"
 laamp_extra_contract_schemes.0012.b: "„[task_contract_employer.GetTitledFirstNameNoTooltip] tě dychtivě očekává.“"
 laamp_extra_contract_schemes.0013.t: "$laamp_prison_break_contract_contract$ – neúspěch"
 laamp_extra_contract_schemes.0013.desc_intro: "Za hluboké noci se vplížím do místa, kde vězní postavu [task_contract_object.GetTitledFirstName]."
 laamp_extra_contract_schemes.0013.desc_no_thief: "$laamp_extra_contract_schemes.0013.desc_intro$ Nějakou dobu neobratně zápolím u dveří s paklíčem. Zloděj by je možná otevřel, ale já to nedokážu. Nezbývá mi než do nich hlučně kopnout. Nedaleko se ozvou hlasy. Žalářníci!\n\n„Odpusťte, [task_contract_object.GetLadyLord], ale musím odejít. Tohle je trochu... nad mé síly,“ zašeptám na rozloučenou.\n\n„#EMP Pche!#! To mi tedy pomohlo!“ odsekne hlas, který nepochybně patří postavě [task_contract_object.GetFirstNameNoTooltip].\n\n„Cože? Kdo je tam?“ zaburácí strážný. Naštěstí jsem dobře ukryt[Select_CString( ROOT.Char.IsFemale, 'á', '' )] a mizím ve tmě."
 laamp_extra_contract_schemes.0013.desc_no_lookout: "$laamp_extra_contract_schemes.0012.desc_no_thief$ Po dřevě však přeběhne záblesk světla lampy. Stráže jsou blízko! Jak moc si přeji mít oči i vzadu! Popadnu postavu [task_contract_object.GetFirstNameNoTooltip] a vrhneme se na zběsilý útěk.\n\n„Kdo je tam?“ vykřikne žalářník. „#EMP Poplach! Poplach!#!“\n\nOzbrojení pronásledovatelé se na nás rychle dotáhnou a v nejhorší možnou chvíli [task_contract_object.GetFirstNameNoTooltip] zakopne a zřítí se na zem. Vzápětí se na [Select_CString( task_contract_object.IsFemale, 'ni', 'něj' )] sesypou. Nezbývá mi než uprchnout o samotě."
 laamp_extra_contract_schemes.0013.desc_no_infiltrator: "$laamp_extra_contract_schemes.0012.desc_no_thief$ $laamp_extra_contract_schemes.0012.desc$ Vracíme se stejnou cestou, zdánlivě nestřeženou chodbou. Její dveře jsou však nyní zahrazené!\n\nJakmile se je pokusím vypáčit, objeví se za námi strážný!\n\n„Zadržím ho!“ vykřikne [task_contract_object.GetFirstNameNoTooltip]. „Utíkej!“\n\nZ okolí se ozývají další hlasy, a tak učiním jediné rozumné rozhodnutí. Prchám. Má-li za tuto osobu někdo zemřít... neměl by to být spíše [task_contract_employer.GetTitledFirstName]...?"
 laamp_extra_contract_schemes.0013.desc: "$laamp_extra_contract_schemes.0012.desc_no_thief$ $laamp_extra_contract_schemes.0012.desc$ $laamp_extra_contract_schemes.0012.desc_no_infiltrator$\n\nStráže však sklapnou svou past. #EMP S pokusem o záchranu počítaly!#!\n\n„Při [task_contract_object.GetFaith.HighGodName]! Věděl[Select_CString( task_contract_object.IsFemale, 'a', '' )] jsem, že to bylo příliš snadné!“ vykřikne [task_contract_object.GetFirstNameNoTooltip]. „Utíkej, [ROOT.Char.GetLiege.Custom('KnightCultureNoTooltip')|l], zachraň se!“\n\nStráže se na nás vrhnou a není čas ani naděje na vítězství, takže prchám! Jakýmsi zázrakem setřesu pronásledovatele a bezpečně dorazím k vnější hradbě... [task_contract_object.GetFirstNameNoTooltip] však nikoli."
 laamp_extra_contract_schemes.0013.a: "Teď už [Select_CString( task_contract_object.IsFemale, 'ji', 'ho' )] jistě budou nepřetržitě hlídat..."
 laamp_base_0001_success_employer_modifier: "Pobavení dvořané"
 laamp_base_0001_success_employer_modifier_desc: "Dvůr této postavy žije neuvěřitelnými příběhy o cizích krajích a cizokrajném životě na cestách."
 laamp_base_0001_failure_employer_modifier: "Otravní příživníci"
 laamp_base_0001_failure_employer_modifier_desc: "Dvůr této postavy zaplavili otravní tuláci a nepoctiví darebáci, takže se zde žije nanejvýš únavně."
 laamp_base_0011.tt.success_standard.employer_reward.remove_potential_rivals: "Odstraní [THIS.Char.MakeScope.ScriptValue('laamp_base_0011_num_removable_potential_rivals_value')] potenciálních [Concept('rivals','soupeřů')|E]"
 laamp_base_0031_success_employer_modifier: "Zkušení prostředníci"
 laamp_base_0031_success_employer_modifier_desc: "Tato postava přivedla schopné prostředníky, aby urovnali spor v jejím panství."
 laamp_base_0031_failure_employer_modifier: "Zřeknutí se odpovědnosti"
 laamp_base_0031_failure_employer_modifier_desc: "Tato postava se pokusila najít obětního beránka, na němž by si poddaní vybili hněv, ale pouze všechno zhoršila."
 laamp_base_0041_success_employer_modifier: "Důvěřivost"
 laamp_base_0041_success_employer_modifier_desc: "Přes veškerou snahu tato postava věří tomu, co jí druzí tvrdí, až příliš snadno."
 laamp_base_0041_failure_employer_modifier: "Ostražitost vůči lhářům"
 laamp_base_0041_failure_employer_modifier_desc: "Tato postava ví, že nikdo nepřichází ke dvoru bez postranních úmyslů, a podle toho jedná."
 laamp_base_1001_success_employer_modifier: "Dopadení zločinci"
 laamp_base_1001_success_employer_modifier_desc: "V tomto hrabství nyní nenajdeš téměř žádné nenapravitelné zločince."
 laamp_base_1021_success_employer_modifier: "Dobře vycvičené vojsko"
 laamp_base_1021_success_employer_modifier_desc: "Zkušený cvičitel proměnil osobní vojsko této postavy v dokonale sehraný celek."
 laamp_base_1021_failure_employer_modifier: "Zanedbaná sebranka"
 laamp_base_1021_failure_employer_modifier_desc: "#EMP Vojsko?#! Domácí družina této postavy připomíná spíše opilce z příkopu než bojovníky."
 laamp_base_1031_success_employer_modifier: "Poklidná země"
 laamp_base_1031_success_employer_modifier_desc: "Toto hrabství nyní prožívá období relativního klidu."
 laamp_base_1031_failure_employer_modifier: "Země v chaosu"
 laamp_base_1031_failure_employer_modifier_desc: "Hádky a drobné šarvátky jsou zde každodenní součástí života a obyvatelé dobře vědí, koho vinit."
 laamp_base_1041_success_employer_modifier: "Přepadení pocestní"
 laamp_base_1041_success_employer_modifier_desc: "Ať už jde o výběrčího daní, poutníka či kupce, cesty tohoto hrabství nejsou bezpečné pro nikoho."
 laamp_base_1041_failure_employer_modifier: "Bezpečné cesty"
 laamp_base_1041_failure_employer_modifier_desc: "Navzdory veškerému úsilí některých profesionálních zločinců zůstávají cesty tohoto hrabství dobře střežené."
 laamp_base_2021_failure_employer_modifier: "Zpackaná výstavba"
 laamp_base_2021_failure_employer_modifier_desc: "Infrastruktura tohoto hrabství se ocitla v naprostém chaosu, takže je zde výstavba nesmírně nákladná."
 laamp_base_2031_success_employer_modifier: "Naprostý klid"
 laamp_base_2031_success_employer_modifier_desc: "Přes přetrvávající nejasnosti ohledně přesného vedení vnitřních hranic jsou obyvatelé tohoto hrabství nyní spokojení."
 laamp_base_2031_failure_employer_modifier: "Bod varu"
 laamp_base_2031_failure_employer_modifier_desc: "Napětí zde vzrostlo natolik, že lidé tráví více času hádkami než prací."
 laamp_base_2041_success_employer_modifier: "Falešní zástupci"
 laamp_base_2041_success_employer_modifier_desc: "Je všeobecně známo, že se za výběrčí daní této postavy v minulosti vydávali podvodníci, což jejich práci neustále komplikuje."
 laamp_base_2041_failure_employer_modifier: "Spolehliví úředníci"
 laamp_base_2041_failure_employer_modifier_desc: "Poddaní této postavy vědí, že bez náležitých pečetí není nikdo, kdo se vydává za úředníka, skutečně pověřen."
 laamp_base_3001_success_employer_modifier: "Důkladné zpravodajství"
 laamp_base_3001_success_employer_modifier_desc: "Tato postava obdržela podrobné zprávy o dění v jiných panstvích."
 laamp_base_3041_success_employer_modifier: "Vyloupená pokladnice"
 laamp_base_3041_success_employer_modifier_desc: "Šeptá se, že tato postava nedokáže uchránit ani vlastní mince."
 laamp_base_3041_failure_employer_modifier: "Zabezpečený poklad"
 laamp_base_3041_failure_employer_modifier_desc: "Tato postava odrazila pokus zmocnit se jejího nashromážděného stříbra."
 laamp_base_4001_success_employer_modifier: "Písemnosti v pořádku"
 laamp_base_4001_success_employer_modifier_desc: "Papír je možná drahý, ale písemnosti jsou přesto nezbytné a tato postava jich má celé stohy."
 laamp_base_4001_failure_employer_modifier: "Zpřeházené záznamy"
 laamp_base_4001_failure_employer_modifier_desc: "Nějaký neschopný hlupák se hrabal v archivech této postavy, čímž zkomplikoval jejich správu."
 laamp_base_4021_success_employer_modifier: "Módní spisek"
 laamp_base_4021_success_employer_modifier_desc: "Fantaskní drobnost, kterou si tato postava objednala, je nyní u dvora velmi oblíbená."
 laamp_base_4021_failure_employer_modifier: "Mecenáš bez vkusu"
 laamp_base_4021_failure_employer_modifier_desc: "Tato postava je známá tím, že rozhazuje peníze za ty nejzmatenější bláboly."
 laamp_base_4041_success_employer_modifier: "Falešná svatost"
 laamp_base_4041_success_employer_modifier_desc: "Od talismanů po relikvie je všeobecně známo, že si v panství této postavy můžeš koupit cokoli posvátného."
 laamp_base_4041_failure_employer_modifier: "Přísná měřítka posvátnosti"
 laamp_base_4041_failure_employer_modifier_desc: "Tato postava je známá svým nekompromisním postojem k falešným relikviím."
 laamp_base_5001_success_employer_modifier: "Zredukovaná zvěř"
 laamp_base_5001_success_employer_modifier_desc: "Stav zvěře v tomto hrabství je plně pod kontrolou."
 laamp_base_5001_failure_employer_modifier: "Nespoutaná divočina"
 laamp_base_5001_failure_employer_modifier_desc: "Zvěř se zde příliš volně množí a příliš divoce potuluje krajinou, čímž ohrožuje životy i zdraví."
 laamp_base_5011_success_employer_modifier: "Sebejistí kupci"
 laamp_base_5011_success_employer_modifier_desc: "Zdejší kupecká vrstva ví, že je její majetek v bezpečí."
 laamp_base_5011_failure_employer_modifier: "Všechno v kouři"
 laamp_base_5011_failure_employer_modifier_desc: "Zdejší investice jsou ve vážném nebezpečí, že skončí jako otop."
 laamp_base_5021_success_employer_modifier: "Dobrá ochrana"
 laamp_base_5021_success_employer_modifier_desc: "Tato postava je dobře chráněna před hrozbami všeho druhu."
 laamp_base_5021_failure_employer_modifier: "Únik o vlásek"
 laamp_base_5021_failure_employer_modifier_desc: "Poslední setkání této postavy se smrtí bylo #EMP těsné#! a příští bude nejspíš ještě těsnější."
 laamp_base_5031_success_employer_modifier: "Mizející dobytek"
 laamp_base_5031_success_employer_modifier_desc: "Vládce tohoto hrabství nedokáže zaručit ani bezpečí vlastních stád."
 laamp_base_5031_failure_employer_modifier: "Chráněná stáda"
 laamp_base_5031_failure_employer_modifier_desc: "Zdejší dobytek je v bezpečí i před těmi nejpodnikavějšími zločinci."
 laamp_base_5041_success_employer_modifier: "Něco málo ubylo"
 laamp_base_5041_success_employer_modifier_desc: "Zvířat je v tomto hrabství... z nějakého důvodu méně, než se očekávalo."
 laamp_base_5041_failure_employer_modifier: "Chráněná divočina"
 laamp_base_5041_failure_employer_modifier_desc: "Pytláci budou oběšeni."
 laamp_base_contract_schemes.0301.t: "Příběhy a sláva"
 laamp_base_contract_schemes.0301.desc: "Večeře na [target.GetTitledFirstNamePossessive] dvoře je ideální příležitostí ohromit tamní dvořany svými smělými dobrodružstvími.\n\nČím více je pobavím, tím více se mi nejspíš naplní měšec.\n\nTo samozřejmě vyžaduje méně vytříbeného důvtipu a více příběhů o velkolepých činech plných hrdinství a ničemnosti, ať už pravdivých, či nikoli."
 laamp_base_contract_schemes.0301.a: "Myslím, že několik takových příběhů znám..."
 laamp_base_contract_schemes.0301.a.tt.success: "Tvé skutky je okouzlí"
 laamp_base_contract_schemes.0301.a.tt.failure: "Tvá slova znějí prázdně"
 laamp_base_contract_schemes.0301.b: "Cožpak má pověst nemluví sama za sebe?"
 laamp_base_contract_schemes.0301.b.f: "Šance na úspěch závisí na tvé [Concept('prestige_level','úrovni slávy')|E]"
 laamp_base_contract_schemes.0301.b.tt.success: "Mluví"
 laamp_base_contract_schemes.0301.b.tt.failure: "Nemluví"
 laamp_base_contract_schemes.0301.c: "Každý příběh vyprávěním roste!"
 laamp_base_contract_schemes.0301.c.tt.success: "Neuvěřitelné příběhy jsou nejlepší"
 laamp_base_contract_schemes.0301.c.tt.failure: "Zjevná lež"
 laamp_base_contract_schemes.0301.d: "Najíst se zdarma a tím to nechat."
 laamp_base_contract_schemes.0301.e: "Nacpat si kapsy bochánky zdarma."
 laamp_base_contract_schemes_0301_doubtful_stories_modifier: "Pochybné historky"
 laamp_base_contract_schemes_0301_doubtful_stories_modifier_desc: "Na tom, co vyprávějí, zkrátka něco nesedí."
 laamp_base_contract_schemes.0311.t: "Vzdálené břehy a daleké kraje"
 laamp_base_contract_schemes.0311.desc.only_exotic_culture: "Pro [target.GetCulture.GetCollectiveNoun], jako je [target.GetTitledFirstName], je [ROOT.Char.GetWomanMan] z [exotic_culture.GetName] kultury, jako jsem já, podivnou cizokrajnou zvláštností, možná dokonce vzácným zpestřením. Kdo ví, kdy budou mít příště příležitost hovořit s někým mého druhu a vyslechnout si příběhy z mé vzdálené domoviny?"
 laamp_base_contract_schemes.0311.desc.only_exotic_faith: "Slovo božstva [exotic_faith.HighGodName], alespoň tak, jak je hlásá [exotic_faith.GetAdjective] směr, je v [target.GetTitledFirstNamePossessive] zemi žalostně opomíjeno.\n\nJe to politováníhodný stav, ale mým zvykům a obřadům #EMP skutečně#! dodává jistou cizokrajnou tajuplnost, která fascinuje mnohé u dvora."
 laamp_base_contract_schemes.0311.desc.both_exotic: "Jako [exotic_faith.GetAdherentName] z [exotic_culture.GetName] kultury svým cizokrajným způsobem života bez ustání fascinuji [target.GetTitledFirstNamePossessive] dvořany.\n\nMnozí z nich dosud nikoho jako já neviděli. Až se vydáme dál, možná už ani nikdy neuvidí, třebaže nedokážu říci, jak se budou dějiny odvíjet."
 laamp_base_contract_schemes.0311.desc.outro: "\n\nVe svých názorech nejsou zrovna... #EMP zdvořilí#!, ale o to snáze je lze popichovat, a tím bavit."
 laamp_base_contract_schemes.0311.a: "Povím vám, jak se žije v [exotic_culture.GetNameNoTooltip] kultuře!"
 laamp_base_contract_schemes.0311.a.tt.success: "Strhující příběh"
 laamp_base_contract_schemes.0311.a.tt.success.cultural_acceptance: "Dobrodruhovo vyprávění o cizokrajných divech"
 laamp_base_contract_schemes.0311.a.tt.failure: "Děsivé vyprávění"
 laamp_base_contract_schemes.0311.a.tt.failure.cultural_acceptance: "Cizincovy příběhy o vzdáleném barbarství"
 laamp_base_contract_schemes.0311.b: "Ach, [exotic_faith.GetNameNoTooltip] v sobě skrývá tolik tajemství..."
 laamp_base_contract_schemes.0311.b.tt.success: "Svůdná cizokrajnost"
 laamp_base_contract_schemes.0311.b.tt.failure: "Matoucí prostopášnost"
 laamp_base_contract_schemes.0311.c: "Vykreslím vám... #EMP obraz#!..."
 laamp_base_contract_schemes.0311.c.tt.success: "Tak sladké lži"
 laamp_base_contract_schemes.0311.c.tt.failure: "Naprosto průhledné lži"
 laamp_base_contract_schemes.0311.d: "Obávám se, že jemné rozdíly by vám unikly."
 laamp_base_contract_schemes_0311_likes_other_faiths_modifier: "Záliba v pomýlených vírách"
 laamp_base_contract_schemes_0311_likes_other_faiths_modifier_desc: "Tato postava dostala příležitost ocenit prosté radosti těch, kdo tápou v teologii."
 laamp_base_contract_schemes_0311_hates_other_faiths_modifier: "Nenávist k cizím vírám"
 laamp_base_contract_schemes_0311_hates_other_faiths_modifier_desc: "Tato postava nechápe, jak se může tolik lidí tak hluboce mýlit."
 laamp_base_contract_schemes.0321.t: "Dobrovolná posila"
 laamp_base_contract_schemes.0321.desc.intro: "Během pobytu na dvoře postavy [target.GetTitledFirstName] jsme se ze všech sil snažili plnit své poslání a bavit i zaměstnávat tamní družiníky.\n\n"
 laamp_base_contract_schemes.0321.desc.three_courtiers: "Zdá se, že jsme svou práci odvedli až #EMP příliš#! dobře, protože mě několik dvořanů v soukromí oslovilo s prosbou o přijetí do našeho tábora!\n\nNejvětší zápal projevuje [courtier_1.GetFirstName], ale [courtier_2.GetFirstName] a [courtier_3.GetFirstName] nezůstávají daleko pozadu.\n\n[target.GetTitledFirstNameNoTooltip] by nám jistě nedovolil[Select_CString( target.IsFemale, 'a', '' )] odvést si všechny tři, ale jednoho bychom snad přijmout mohli."
 laamp_base_contract_schemes.0321.desc.two_courtiers: "Zdá se, že jsme svou práci odvedli až #EMP příliš#! dobře, protože mě dva dvořané v soukromí oslovili s prosbou o přijetí do našeho tábora!\n\nNejvětší zápal projevuje [courtier_1.GetFirstName], ale [courtier_2.GetFirstName] nezůstává daleko pozadu.\n\n[target.GetTitledFirstNameNoTooltip] by nám jistě nedovolil[Select_CString( target.IsFemale, 'a', '' )] odvést si oba, ale jednoho bychom snad přijmout mohli."
 laamp_base_contract_schemes.0321.desc.one_courtier: "Zdá se, že jsme svou práci odvedli uspokojivě, protože mě [courtier_1.GetFirstName] v soukromí požádá o přijetí do našeho tábora.\n\n[target.GetTitledFirstNameNoTooltip] by nám jistě neupřel[Select_CString( target.IsFemale, 'a', '' )] jediného ze svých družiníků, pokud [courtier_1.GetFirstNameNoTooltip] přijmeme."
 laamp_base_contract_schemes.0321.a: "Přijmeme tě, [courtier_1.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.0321.b: "Co třeba [courtier_2.GetFirstNameNoTooltip]...?"
 laamp_base_contract_schemes.0321.c: "[courtier_3.GetFirstName] by se nám hodil[Select_CString( courtier_3.IsFemale, 'a', '' )]."
 laamp_base_contract_schemes.0321.d: "#EMP Ty#!? Snad žertuješ!"
 laamp_base_contract_schemes.0321.e: "Bohužel máme plno."
 laamp_base_contract_schemes.0331.t: "Co nás žene dál"
 laamp_base_contract_schemes.0331.desc: "„Nad něčím jsem přemýšlel[Select_CString( target.IsFemale, 'a', '' )], drah[Select_CString( ROOT.Char.IsFemale, 'á', 'ý' )] [ROOT.Char.GetFirstNameNoTooltip],“ protáhne [target.GetTitledFirstName] při jedné poklidné večeři. „Vyprávíš příběhy o svém životě a skutcích, přesto žiješ pod stanovým dílcem umazaným od bláta, který tě sotva chrání před přívalovým deštěm i spalujícím sluncem.“\n\nPřikývnu. Nemá smysl to popírat.\n\n„Když se musíš obejít bez tolika základních životních pohodlí, co tě ráno přiměje vstát? Proč kráčíš dál, když budeš muset příštího dne všechno podstoupit znovu?“"
 laamp_base_contract_schemes.0331.a: "Musí snad existovat jediný důvod?"
 laamp_base_contract_schemes.0331.a.tt.success: "Tvá slova jsou výmluvná"
 laamp_base_contract_schemes.0331.a.tt.failure: "Tvá slova jsou prázdná"
 laamp_base_contract_schemes.0331.b: "Po volné cestě se musí kráčet."
 laamp_base_contract_schemes.0331.b.tt.success: "Sladká svoboda"
 laamp_base_contract_schemes.0331.b.tt.failure: "Jak bezcílné"
 laamp_base_contract_schemes.0331.c: "Sláva, smrt a přátelé získaní nad prolitou krví."
 laamp_base_contract_schemes.0331.c.tt.success: "Drsné, ale spravedlivé"
 laamp_base_contract_schemes.0331.c.tt.failure: "Tuctové a přízemní"
 laamp_base_contract_schemes.0331.d: "Hledání poznání nemá konce, jen hlubší porozumění."
 laamp_base_contract_schemes.0331.d.tt.success: "Poznání je samo sobě odměnou"
 laamp_base_contract_schemes.0331.d.tt.failure: "Nesmyslné a nepraktické"
 laamp_base_contract_schemes.0331.e: "Je to prosté. Stále zbývají nepoznaná místa."
 laamp_base_contract_schemes.0331.e.tt.success: "Jak romantické"
 laamp_base_contract_schemes.0331.e.tt.failure: "Ano, ale nestojí za tu námahu"
 laamp_base_contract_schemes.0331.f: "Příležitost obchodovat a ukojit své #EMP choutky.#!"
 laamp_base_contract_schemes.0331.f.tt.success: "Bezohledná ctižádost může být působivá"
 laamp_base_contract_schemes.0331.f.tt.failure: "Loupežník, ať se nazývá jakkoli"
 laamp_base_contract_schemes.0331.g: "Opravdu se musíš ptát, [target.GetFirstNameNoTooltip]?"
 laamp_base_contract_schemes.0331.g.tt.success: "Podmanivá ctižádost"
 laamp_base_contract_schemes.0331.g.tt.failure: "Pomýlené sny"
 laamp_base_contract_schemes.0331.h: "Nimrej se v jídle a otázku ignoruj."
 laamp_base_contract_schemes.0541.t: "Šikovné ruce"
 laamp_base_contract_schemes.0541.desc: "Zapůsobit na postavu [target.GetTitledFirstName] někdy působí jako práce na celé roční období.\n\nAčkoli [target.GetSheHe] rozhodně nepatří mezi nejvýznamnější šlechtice světa, má #EMP velmi#! zvláštní představy o nárocích, které by měli ostatní splňovat.\n\nV takové situaci bude nejbezpečnější spolehnout se na to, v čem vynikám, vybrat si něco, co umím, a nechat zazářit své schopnosti.\n\nU někoho tak nevyzpytatelného, jako je [target.GetFirstNameNoTooltip], bych se však mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] pokusit uspět i v něčem, co se za mou doménu zrovna nepovažuje."
 laamp_base_contract_schemes.0541.duel.tt.success: "Působíš náležitě impozantně"
 laamp_base_contract_schemes.0541.duel.tt.failure: "Potupná podívaná"
 laamp_base_contract_schemes.0541.tt.highest_skill_weaker_results: "Prověření tvé lepší [Concept('skill','dovednosti')|E] přinese menší odměny"
 laamp_base_contract_schemes.0541.tt.lowest_skill_stronger_results: "Prověření tvé horší [Concept('skill','dovednosti')|E] přinese větší odměny"
 laamp_base_contract_schemes.0541.a: "Mé diplomatické schopnosti jistě zapůsobí!"
 laamp_base_contract_schemes.0541.b: "Mé válečnické schopnosti jistě zapůsobí!"
 laamp_base_contract_schemes.0541.c: "Mé schopnosti v peněžních záležitostech jistě zapůsobí!"
 laamp_base_contract_schemes.0541.d: "Mé umění skrytých činů obestírá svůdné tajemství!"
 laamp_base_contract_schemes.0541.e: "Má učená mysl jistě zapůsobí!"
 laamp_base_contract_schemes.0541.f: "Má udatnost s čepelí mluví sama za sebe!"
 laamp_base_contract_schemes.0541.g: "Možná bych mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] zkusit diplomacii..."
 laamp_base_contract_schemes.0541.h: "Možná bych mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] prokázat, že jsem skutečný velitel..."
 laamp_base_contract_schemes.0541.i: "S penězi rozhodně nejsem #EMP nejhorší#!..."
 laamp_base_contract_schemes.0541.j: "Mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] bych předvést svou prohnanost..."
 laamp_base_contract_schemes.0541.k: "Mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] bych předvést svou velikou učenost..."
 laamp_base_contract_schemes.0541.l: "Mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] bych předvést své umění s čepelí..."
 laamp_base_contract_schemes.0541.m: "Zachovej si odstup."
 laamp_base_contract_schemes.0551.t: "Mocní a vážení"
 laamp_base_contract_schemes.0551.desc: "U každého dvora se najdou lidé, kteří mají větší vliv než ostatní, a v síních postavy [target.GetTitledFirstName] tomu není jinak.\n\nNěkteří kráčejí chodbami hrdě, zatímco jiní jim spěšně ustupují z cesty.\n\nChci-li skutečně zapůsobit, neuškodilo by získat na svou stranu někoho z místní společenské smetánky. Koho však zvolit..."
 laamp_base_contract_schemes.0551.duel.tt.success: "Působíš impozantním dojmem"
 laamp_base_contract_schemes.0551.duel.tt.failure: "Jsi nudnější, než si myslíš"
 laamp_base_contract_schemes.0551.a: "[diplomacy_candidate.GetFirstNameNoTooltip] by se dal[Select_CString( diplomacy_candidate.IsFemale, 'a', '' )] získat."
 laamp_base_contract_schemes.0551.b: "Na postavu [martial_candidate.GetFirstNameNoTooltip] bych snadno zapůsobil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]."
 laamp_base_contract_schemes.0551.c: "S postavou [stewardship.GetFirstNameNoTooltip] máme mnoho společného."
 laamp_base_contract_schemes.0551.d: "Copak asi chystá [intrigue_candidate.GetFirstNameNoTooltip]?"
 laamp_base_contract_schemes.0551.e: "[learning_candidate.GetFirstNameNoTooltip] působí zajímavě."
 laamp_base_contract_schemes.0551.f: "Heh, vsadím se, že [prowess_candidate.GetFirstNameNoTooltip] by si dal[Select_CString( prowess_candidate.IsFemale, 'a', '' )] souboj."
 laamp_base_contract_schemes.0551.g: "To by nebylo moudré."
 laamp_base_contract_schemes_0551_impressive_at_court_modifier: "Působivý dojem u dvora"
 laamp_base_contract_schemes_0551_impressive_at_court_modifier_desc: "U každého dvora jsou lidé, kteří tahají za nitky. Zde vzhlížejí k tobě."
 laamp_base_contract_schemes_0551_pathetic_at_court_modifier: "Ubohá podívaná"
 laamp_base_contract_schemes_0551_pathetic_at_court_modifier_desc: "Je-li v politice něco horšího než smrt, pak je to ponížení."
 laamp_base_contract_schemes.0561.t: "Nejslabší článek"
 laamp_base_contract_schemes.0561.desc: "[insider.GetTitledFirstName] zjevně patří mezi nejbližší osoby postavy [target.GetTitledFirstName], zaujímá vysoké postavení ve společenském žebříčku a má na [target.GetTitleAsNameNoTooltip] #EMP značný#! vliv.\n\nKdyby mě tento člověk začal z jakéhokoli důvodu vychvalovat, mé věci by to jistě jen prospělo."
 laamp_base_contract_schemes.0561.a: "[insider.GetFirstNameNoTooltip] mému kouzlu neodolá!"
 laamp_base_contract_schemes.0561.a.tt.success: "Uhlazené a sebejisté vystupování"
 laamp_base_contract_schemes.0561.a.tt.failure: "Zpocené a nesouvislé vystupování"
 laamp_base_contract_schemes.0561.b: "Trocha zlata uhladí každé přátelství."
 laamp_base_contract_schemes.0561.c: "Možná postačí nenápadná #EMP narážka#!..."
 laamp_base_contract_schemes.0561.c.tt.success: "Tvůj záměr je pochopen"
 laamp_base_contract_schemes.0561.c.tt.failure: "Nejsi zrovna nenápadný[Select_CString( ROOT.Char.IsFemale, 'á', '' )]"
