 laamp_base_contract_schemes.2676.f: "Ba, o koních něco málo víme."
 laamp_base_contract_schemes.2676.g: "$laamp_base_contract_schemes.2661.g$"
 laamp_base_2076_success_employer_modifier: "Ušlechtilí koně"
 laamp_base_2076_success_employer_modifier_desc: "Zdejším koním závidí široké okolí."
 laamp_base_2076_failure_employer_modifier: "Vyhladovělí koně"
 laamp_base_2076_failure_employer_modifier_desc: "Toto hrabství z nějakého důvodu proslulo mimořádně bídnými koňmi všeho druhu."
 laamp_base_contract_schemes.2677.t: "$laamp_base_contract_schemes.2031.t$ – úspěch!"
 laamp_base_contract_schemes.2677.desc.resolution_type.stewardship: "Hrdá rodová zdatnost rodu [ROOT.Char.GetHouse.GetName] opět slaví vítězství!\n\nPřes všechno své naparování chce každý z hodnostářů pouze svůj díl kořisti a ještě během odpoledne dokážu navrhnout dostatečně spravedlivé rozdělení půdy, takže je každý z nich zklamán jen #EMP trochu#!.\n\nDokonce i pošetilý vlastník dostane určité odškodnění, díky čemuž hádky utichnou na snesitelnou míru."
 laamp_base_contract_schemes.2677.desc.resolution_type.secondary_skill: "Ve válečných záležitostech mám dost zkušeností, abych věděl[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že nejlepší půda nemusí vychovat nejlepší koně a že nejlepší koně ani nejlepší půdu nepotřebují.\n\nKlidně, pečlivě a jen #EMP trochu#! povýšeně vysvětlím hodnostářům z [employer.GetPrimaryTitle.GetBaseNameNoTier] chyby v jejich uvažování. Zpočátku naslouchají... neochotně, protože půda je koneckonců stále půda, ale dobrý argument nakonec vždy zvítězí."
 laamp_base_contract_schemes.2677.desc.resolution_type.left_sacrifice: "S postavou [employer.GetTitledFirstName] ponecháme [sacrifice.GetTitledFirstName] napospas laskavé péči místních hodnostářů. Ještě než stačíme odejít, začne křik a sílí rychleji, než se od něj dokážeme vzdálit.\n\n„Takové řešení jsem nečekal[Select_CString( employer.IsFemale, 'a', '' )],“ zamyšleně přikývne [employer.GetFirstNameNoTooltip], „ale tvé důkladnosti nemohu nic vytknout. Opravdu si myslíš, že to tu [sacrifice.GetSheHe] zvládne?“\n\nPovytáhnu obočí.\n\n„Ach, samozřejmě, co to povídám,“ vyhrkne [employer.GetTitleAsNameNoTooltip]. „Tímhle tempem se sám[Select_CString( employer.IsFemale, 'a', '' )] zapletu zpátky do stejného zmatku. Zde je tvá odměna za zapůjčení tak schopného [sacrifice.GetWomanMan].“"
 laamp_base_contract_schemes.2677.desc.resolution_type.officer: "[officer.GetTitledFirstNamePossessive|U] znalosti koní nám dnes znamenitě poslouží.\n\nKdyž [officer.GetHerHim] pošleme mezi místní a dovolíme hovořit o jedné z největších vášní, [officer.GetWomanMan] je postupně zahanbí vyčerpávajícím výkladem o tom, jak špatně pečují o své koně a soumary a jak lze chovat lepší a zdravější zvířata, aniž by se museli přít o nejlepší pastviny.\n\nNakonec už jen zahanbeně přikyvují každé sebemenší výtce a na všechny spory zapomenou."
 laamp_base_contract_schemes.2677.desc.resolution_type.camp_purpose: "Při způsobu obživy [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] se člověk přirozeně naučí něco o dobrých pastvinách.\n\nS nacvičenou, téměř ležérní lehkostí odsuneme námitky místních stranou a půdu rozdělíme spravedlivě a rozumně.\n\nNeuškodí ani nenucená připomínka skupiny žoldnéřů tábořících nedaleko ve službách zdejšího [employer.Custom('MistressMaster')]."
 laamp_base_contract_schemes.2677.desc.resolution_type.stress: "Se spravedlivou myslí, tvrdou prací a veškerou zatracenou houževnatostí, kterou dokáže člověk z rodu [ROOT.Char.GetHouse.GetName] projevit, je možné všechno.\n\nDospět k alespoň trochu spravedlivému rozdělení půdy vyžaduje hodiny vyčerpávajících debat. Spravedlivému pro všechny kromě hlupáka, který o ni přichází, ale i ten dostane vyšší náhradu, než by získal, kdybych zde nevyjednával[Select_CString( ROOT.Char.IsFemale, 'a', '' )].\n\nPodstatné je, že jsou hodnostáři s mým návrhem dostatečně spokojení, nebo alespoň reptají jen mírně."
 laamp_base_contract_schemes.2677.desc.outro: "\n\n[employer.GetTitledFirstName|U] působí s naším řešením více než spokojeně a radostně nám předá odměnu."
 laamp_base_contract_schemes.2677.a: "$laamp_base_contract_schemes.2662.a$"
 laamp_base_contract_schemes.2678.t: "$laamp_base_contract_schemes.2031.t$ – neúspěch!"
 laamp_base_contract_schemes.2678.desc.stewardship: "Po dlouhých hodinách vyjednávání se zdá, že máme k dohodě ještě dále než na začátku.\n\nKaždý malicherný a po moci lačnící hodnostář v [employer.GetPrimaryTitle.GetBaseNameNoTier] chce #EMP svůj#! díl půdy jen nepatrně cennější než průměr a je ochoten kvůli němu strhnout celý dům křikem.\n\n"
 laamp_base_contract_schemes.2678.desc.officer: "Myslel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem, že [officer.GetTitledFirstName] má být v podobných záležitostech #EMP dobrý[Select_CString( officer.IsFemale, 'á', 'ý' )]#!.\n\nBohužel buď [officer.GetSheHe] ví příliš mnoho a obyvatelům [employer.GetPrimaryTitle.GetBaseNameNoTier] na tom záleží příliš málo, nebo [officer.GetFirstNameNoTooltip] ví příliš málo a místním na tom záleží příliš mnoho.\n\nNásledují hádky, obvinění a zuřivé bušení do stolu."
 laamp_base_contract_schemes.2678.desc.outro: "Do večera nás silně rozrušen[Select_CString( employer.IsFemale, 'á', 'ý' )] [employer.GetTitledFirstName] hrubě vykáže, naprosto znechucen[Select_CString( employer.IsFemale, 'á', 'ý' )] tím, že jsme ničeho nedosáhli.\n\nDnes se tedy žádné odměny nedočkáme."
 laamp_base_contract_schemes.2678.a: "$laamp_base_contract_schemes.2663.a$"
 laamp_base_contract_schemes.2681.t: "$laamp_base_contract_schemes.2031.t$ – čáry na mapách"
 laamp_base_contract_schemes.2681.desc: "Náš příjezd do [employer.GetPrimaryTitle.GetBaseNameNoTier] se obejde bez většího povšimnutí. Místní se potýkají s krizí kvůli jakési objevené prastaré mapě, která #EMP zcela#! překresluje hranice mezi dvěma osadami podřízenými městu.\n\nPokud se brzy nenajde řešení, v lepším případě se přeruší výběr daní, v horším může vypuknout menší místní válka.$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2681.a: "$laamp_base_contract_schemes.2661.a$"
 laamp_base_contract_schemes.2681.b: "$laamp_base_contract_schemes.2661.b$"
 laamp_base_contract_schemes.2681.b.tt.success: "$laamp_base_contract_schemes.2661.b.tt.success$"
 laamp_base_contract_schemes.2681.b.tt.failure: "$laamp_base_contract_schemes.2661.b.tt.failure$"
 laamp_base_contract_schemes.2681.c: "Dovolte mi tu mapu prohlédnout."
 laamp_base_contract_schemes.2681.d.sacrifice_exists: "$laamp_base_contract_schemes.2661.d.sacrifice_exists$"
 laamp_base_contract_schemes.2681.d.sacrifice_unexists: "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
 laamp_base_contract_schemes.2681.d.no_valid_char: "Nemáš k dispozici [Concept('follower','družiníka')|E] s alespoň [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] body [Concept('learning','učenosti')|E], kterého bys mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dočasně přidělit k [employer.GetFirstNamePossessive] [Concept('court','dvoru')|E]"
 laamp_base_contract_schemes.2681.d.tt.courtier_stays_here: "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
 laamp_base_contract_schemes.2681.e.officer_exists: "$laamp_base_contract_schemes.2661.e.officer_exists$"
 laamp_base_contract_schemes.2681.e.officer_unexists: "$laamp_base_contract_schemes.2661.e.officer_unexists$"
 laamp_base_contract_schemes.2681.f: "Pouhá #EMP mapa?#! To je všechno, co máte?"
 laamp_base_contract_schemes.2681.g: "$laamp_base_contract_schemes.2661.g$"
 laamp_base_contract_schemes.2682.t: "$laamp_base_contract_schemes.2031.t$ – úspěch!"
 laamp_base_contract_schemes.2682.desc.resolution_type.stewardship: "Naštěstí mi [ROOT.Char.Custom('SenseObserve_SenseEye')] dobře slouží při hledání podrobností a netrvá dlouho, než poukážu na tucet známek toho, že mapa je zjevným padělkem."
 laamp_base_contract_schemes.2682.desc.resolution_type.secondary_skill: "Mapa působí dostatečně pravě, tedy pokud jste #EMP hlupák#!! Já jsem však [ROOT.Char.GetWomanMan] veliké učenosti a prokázat její pochybný původ je stejně snadné jako obléknout si tuniku."
 laamp_base_contract_schemes.2682.desc.resolution_type.left_sacrifice: "Zatímco se [sacrifice.GetTitledFirstName] unaveně připravuje na dlouhý, předlouhý, #EMP nekonečný#! proces naslouchání všem stranám sporu a hledání jakési pravdy, [employer.GetTitledFirstName] si mě odvede stranou.\n\n„Dobrá práce, [ROOT.Char.GetTitledFirstNameNoTooltip]. Kdo by si pomyslel, že máš k zapůjčení někoho tak učeného, jako je [sacrifice.GetWomanMan], a ještě k tomu pro mé skromné město!“\n\nV pozadí [sacrifice.GetFirstNameNoTooltip] utišuje pronikavý hlas vykřikující cosi o dědičném právu.\n\n„Nepochybuji, že se nám to podaří vyřešit, alespoň časem. Tvá odměna čeká venku.“"
 laamp_base_contract_schemes.2682.desc.resolution_type.officer: "[officer.GetTitledFirstNamePossessive|U] řečnické schopnosti jsou tak znamenité, že se místní podaří #EMP právě dost#! rozpálit možností, že mapa je pravá. [officer.GetSheHe|U] je vede od jednoho tématu k druhému, až většina přítomných mapu prohlašuje za zjevný padělek a vysvětluje proč."
 laamp_base_contract_schemes.2682.desc.resolution_type.camp_purpose: "Při vysvětlování, jak nicotný cár pergamenu souvisí se skutečným, krví daným právem k něčemu tak důležitému, jako je půda, jsem to... možná trochu přehnal[Select_CString( ROOT.Char.IsFemale, 'a', '' )].\n\nAsi po hodině na mě místní už jen omámeně hledí a jejich tváře jsou maskami studu, zmatku a občasného vytržení.\n\nMalicherná záležitost jejich „prastaré“ listiny je odložena stranou a místnost ovládne rozpačité ticho.\n\n[employer.GetTitledFirstName|U] mě tiše vyprovodí a zdánlivě dostatečně spokojen[Select_CString( employer.IsFemale, 'á', 'ý' )] nám předá odměnu."
 laamp_base_contract_schemes.2682.desc.resolution_type.stress: "Po dlouhých hodinách debat, obviňování a občasných výhrůžek nakonec odhalím několik zásadních známek toho, že mapa je nejspíš padělkem, a tudíž bezcenná."
 laamp_base_contract_schemes.2682.desc.outro: "\n\nNěkteří se zprvu samozřejmě přou, ale jak důkazů přibývá, jeden ze spiklenců nakonec pod tlakem #EMP povolí#! a označí za viníka místního hodnostáře.\n\nPo jediném prostém zatčení má [employer.GetPrimaryTitle.GetBaseNameNoTier] nový námět ke klepům a obě podřízené osady jsou přinuceny přestat si navzájem jít po krku.\n\nNapětí opadlo a poměry se rychle vracejí k normálu, takže nám [employer.GetTitledFirstName] vděčně předá odměnu."
 laamp_base_contract_schemes.2682.a: "$laamp_base_contract_schemes.2662.a$"
 laamp_base_contract_schemes.2683.t: "$laamp_base_contract_schemes.2031.t$ – neúspěch!"
 laamp_base_contract_schemes.2683.desc.stewardship: "Domníval[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem se, že zpochybnit pravost mapy je správný postup, ale bohužel tím vyvolám jen další potíže. Kvůli novému podezření z nekalostí se do dříve čistě místního sporu začnou zapojovat i obyvatelé samotného [employer.GetPrimaryTitle.GetBaseNameNoTier].\n\nAsi polovina považuje mé argumenty za přesvědčivé a věří, že se #EMP někdo#! dopustil závažného podvodu, zatímco druhá polovina je pokládá za naprosté výmysly. Do soumraku stojí celé město ve zbrani samo proti sobě."
 laamp_base_contract_schemes.2683.desc.officer: "Doufal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem, že [officer.GetTitledFirstNamePossessive] výřečnost postačí k uklidnění místních a vytvoření nálady, v níž by mohl snáze převládnout rozum.\n\nPokusy postavy [officer.GetFirstNameNoTooltip] zmírnit napětí však obyvatele [employer.GetPrimaryTitle.GetBaseNameNoTier] rozdělí na dva tábory a dokonce i bohatí městští hodnostáři se začnou přidávat na jednotlivé strany sporu mezi podřízenými osadami."
 laamp_base_contract_schemes.2683.desc.outro: "\n\nNa mapu už sice nikdo nemyslí, ale lidé se přou spíše #EMP více#! než méně.\n\n[employer.GetTitledFirstName] nám chladně oznámí, že žádnou odměnu nedostaneme."
 laamp_base_contract_schemes.2683.a: "$laamp_base_contract_schemes.2663.a$"
 laamp_base_contract_schemes.2781.t: "$laamp_base_contract_schemes.2044.t$ – [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.2781.desc.surroundings.alley_day: "Beze spěchu se potulujeme ulicemi osady a samozřejmě se přitom snažíme působit zaměstnaně a důležitě rozmrzele. Nějakou dobu trvá, než narazíme na nešťastn[Select_CString( local_char.IsFemale, 'ou místní ženu', 'ého místního muže' )], kter[Select_CString( local_char.IsFemale, 'á byla zvolena', 'ý byl zvolen' )] ke správě tributu."
 laamp_base_contract_schemes.2781.desc.surroundings.alley_night: "Do osady dorazíme až pozdě, ale nechci zde zůstat déle, než je nezbytné. Nešťastn[Select_CString( local_char.IsFemale, 'ou místní ženu', 'ého místního muže' )], kter[Select_CString( local_char.IsFemale, 'á byla zvolena', 'ý byl zvolen' )] ke správě tributu, zastihneme právě ve chvíli, kdy na noc zavírá svůj podnik."
 laamp_base_contract_schemes.2781.desc.surroundings.tavern: "Možná není překvapením, že nešťastn[Select_CString( local_char.IsFemale, 'ou místní ženu', 'ého místního muže' )], kter[Select_CString( local_char.IsFemale, 'á byla zvolena', 'ý byl zvolen' )] ke správě tributu, najdeme v krčmě, kde se ještě před naším příchodem snaží utopit žal v pití."
 laamp_base_contract_schemes.2781.desc.surroundings.docks: "Dbáme na to, abychom působili co nejokázaleji úředně, a vykročíme k přístavu. Podle očekávání tam nalezneme nešťastn[Select_CString( local_char.IsFemale, 'ou místní ženu', 'ého místního muže' )], kter[Select_CString( local_char.IsFemale, 'á byla zvolena', 'ý byl zvolen' )] ke správě tributu, jak pokřikuje na námořníky a řídí dnešní náklad."
 laamp_base_contract_schemes.2781.desc.surroundings.condemned_village: "Kraj sužuje nemoc a osada je přinejmenším v žalostném stavu. S látkou přitisknutou k ústům, aby nás ochránila před miazmatem, nakonec přece jen nalezneme uboh[Select_CString( local_char.IsFemale, 'ou místní ženu', 'ého místního muže' )], kter[Select_CString( local_char.IsFemale, 'á byla zvolena', 'ý byl zvolen' )] ke správě tributu."
 laamp_base_contract_schemes.2781.desc.local_mood.disapproval: "„Hmph,“ zabručí [local_char.GetFirstNameNoTooltip]. „Nejspíš si myslíte, jak jste chytří, když jste dorazili takhle brzy. Nás to ale neohromilo a za to, že vás zdržíme, žádné poplatky platit nebudeme.“"
 laamp_base_contract_schemes.2781.desc.local_mood.anger: "„To je ale drzost!“ zavrčí [local_char.GetFirstNameNoTooltip]. „Přijet takhle brzy! Své odvody platíme stejně jako sousední město, ale máme právo na přiměřené varování, než se sem přijedete přiživovat na naší práci.“"
 laamp_base_contract_schemes.2781.desc.local_mood.admiration: "„Ach! Ty musíš být [task_contract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'zástupkyně', 'zástupce' )],“ rozplývá se [local_char.GetFirstNameNoTooltip]. „Poznávám to podle tvého čestného vystupování! Dorazil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsi #EMP trochu#! dříve, než jsme čekali, ale nevadí, jsme připraveni.“"
 laamp_base_contract_schemes.2781.desc.local_mood.dismissal: "„Ach, už jste tady?“ protáhne [local_char.GetFirstNameNoTooltip]. „Nu dobrá, pojďte za mnou. Podle rozkazu jsme připravili váš... #EMP tribut#!, ale ani minci navíc.“"
 laamp_base_contract_schemes.2781.desc.local_mood.thinking: "„Ty jsi... [task_contract.GetEmployer.GetTitleAsNamePossessiveNoTooltip] [Select_CString( ROOT.Char.IsFemale, 'zástupkyně', 'zástupce' )]? Tak brzy?“ podiví se [local_char.GetFirstNameNoTooltip]. „Myslel[Select_CString( local_char.IsFemale, 'a', '' )] jsem, že tě čekáme nejdříve za měsíc... ale působíš asi důvěryhodně...“"
 laamp_base_contract_schemes.2781.desc.outro: "\n\nDalší důvěřivý hlupák mezi námi a naší odměnou."
 laamp_base_contract_schemes.2781.a: "Zahltit [Select_CString( local_char.IsFemale, 'ji', 'ho' )] čísly."
 laamp_base_contract_schemes.2781.stewardship.tt.success: "Samozřejmě, samozřejmě, všechno je v pořádku"
 laamp_base_contract_schemes.2781.stewardship.tt.failure: "O čem to k čertu mluvíš?"
 laamp_base_contract_schemes.2781.b: "Předložím „[task_contract.GetEmployer.GetTitledFirstNamePossessiveNoTooltip]“ pečeť."
 laamp_base_contract_schemes.2781.intrigue.tt.success: "Vypadá dostatečně pravě"
 laamp_base_contract_schemes.2781.intrigue.tt.failure: "Tohle je zjevný padělek!"
 laamp_base_contract_schemes.2781.c.bard_exists: "[bard.GetTitledFirstNameNoTooltip], využij svého výřečného jazyka!"
 laamp_base_contract_schemes.2781.c.bard_dnae_exist: "Kéž bychom měli nějakého výřečného darebáka..."
 laamp_base_contract_schemes.2781.d: "Co nejrychleji tohle setkání odbýt."
 laamp_base_contract_schemes.2781.tt.boost_difficulty.stewardship: "Tvá příští zkouška [Concept('stewardship','správcovské dovednosti')|E] bude ještě obtížnější"
 laamp_base_contract_schemes.2781.tt.boost_difficulty.intrigue: "Tvá příští zkouška [Concept('intrigue','pletichářské dovednosti')|E] bude ještě obtížnější"
 laamp_base_contract_schemes.2781.tt.boost_difficulty.bard: "[bard.GetFirstNamePossessive] příští zkouška způsobilosti bude ještě obtížnější"
 laamp_base_contract_schemes.2781.tt.boost_difficulty.stress: "Tato možnost tě příště bude stát ještě více [Concept('stress','stresu')|E]"
 laamp_base_contract_schemes.2781.tt.progress_towards_success: "#P +1#! bod k úspěšnému dokončení [Concept('task_contract','zakázky')|E]"
 laamp_base_contract_schemes.2781.tt.current_total.sub_t1: "#TUT Máš [task_contract.MakeScope.Var('wins_tally').GetValue] z [task_contract.MakeScope.Var('win_t1_threshold').GetValue] bodů potřebných pro výsledek $label_success_qualified$#!"
 laamp_base_contract_schemes.2781.tt.current_total.sub_t2: "#TUT Máš [task_contract.MakeScope.Var('wins_tally').GetValue] z [task_contract.MakeScope.Var('win_t2_threshold').GetValue] bodů potřebných pro výsledek $label_success_standard$ #WEAK (nyní jsi dosáhl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] výsledku $label_success_qualified$)#!#!"
 laamp_base_contract_schemes.2781.tt.current_total.sub_t3: "#TUT Máš [task_contract.MakeScope.Var('wins_tally').GetValue] z [task_contract.MakeScope.Var('win_t3_threshold').GetValue] bodů potřebných pro výsledek $label_success_critical$ #WEAK (nyní jsi dosáhl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] úspěchu)#!#!"
 laamp_base_contract_schemes.2781.tt.progress_towards_failure: "#N +1#! bod k neúspěchu [Concept('task_contract','zakázky')|E]"
 laamp_base_contract_schemes.2781.tt.contract_failed: "#N Zakázku se nepodařilo splnit#!"
 laamp_base_contract_schemes.2782.t: "$laamp_base_contract_schemes.2044.t$ – úspěch!"
 laamp_base_contract_schemes.2782.desc.success_critical: "Ha! To tedy bylo velkolepé dobrodružství. Pošetile chamtivý [task_contract.GetEmployer.GetTitleAsNameNoTooltip], oslnivě [Select_CString( ROOT.Char.IsFemale, 'krásná žena', 'pohledný muž' )] s nosem na příležitosti a desítky důvěřivých poplatníků, kteří si teď nejspíš přejí, aby se byli lépe naučili číst.\n\nTáborová pokladnice přetéká a my přemýšlíme nad další prací."
 laamp_base_contract_schemes.2782.desc.success_standard: "Náš malý výlet do světa správy nám prozatím vynesl #EMP opravdu#! mnoho.\n\nV našem malém voze falešných výběrčích daní, jehož obě strany zdobí neuměle namalované erby, leží tolik mincí postavy [task_contract.GetEmployer.GetTitledFirstName], že by ukojily touhu po zlatě většiny lidí.\n\nPřesto... se nemohu ubránit otázce, zda bychom z toho kamene nedokázali vyždímat ještě trochu krve..."
 laamp_base_contract_schemes.2782.desc.success_qualified: "Získali jsme pěknou kořist, ale z pošetilých poddaných postavy [task_contract.GetEmployer.GetTitledFirstName] lze ještě vytáhnout spoustu mincí.\n\nVyrazíme-li hned, nejspíš si udržíme slušný náskok před výběrčím, který se vleče za námi. Pokud nás však dopadnou, budeme muset všechno opustit a uprchnout s prázdnou."
 laamp_base_contract_schemes.2782.desc.nothing_yet: "Začali jsme dobře, ale ve srovnání s tím, kolik doufáme získat, je to pouhá almužna.\n\nChceme-li si skutečně neprávem ukrojit z bohatství postavy [task_contract.GetEmployer.GetTitledFirstName], musíme pokračovat a přesvědčit další poddané o našem... oprávnění."
 laamp_base_contract_schemes.2782.a: "Kdo tvrdí, že [ROOT.Char.Custom('GetLaampDescribeTypeSelfArticle')] [ROOT.Char.Custom('GetLaampDescribeTypeSelf')] potřebuje půdu, aby si vydělal mince!"
 laamp_base_contract_schemes.2782.b: "Bez odvahy není sláva ani zlato! Kupředu!"
 laamp_base_contract_schemes.2782.b.tt.travel_onwards: "Pokračuješ ve snaze dosáhnout lepšího výsledku své [Concept('task_contract','zakázky')|E]"
 laamp_base_contract_schemes.2782.c: "Nebudeme riskovat a zde skončíme."
 laamp_base_contract_schemes.2782.d: "Dobrá, prozatím už více nezmůžeme."
 laamp_base_contract_schemes.2782.d.tt: "@alert_icon! #alert_trial Tato možnost je povinná, protože jsi vzhledem k počtu dosavadních neúspěchů dosáhl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] nejlepšího možného výsledku#!"
 laamp_base_contract_schemes.2783.t: "$laamp_base_contract_schemes.2044.t$ – neúspěch!"
 laamp_base_contract_schemes.2783.desc.lost: "Ať je celé obyvatelstvo [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTier] prokleto! Jejich bezdůvodná podezíravost a nevraživost vůči cizincům všechno zmařily.\n\nChtěl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem jen #EMP trochu#! více mincí, ale ti hlupáci nejprve pojali podezření, poté se vyděsili a nakonec náš vůz v záchvatu hněvu zabavili.\n\nNezůstalo mi vůbec nic."
 laamp_base_contract_schemes.2783.desc.losing: "To bylo těsné. Možná až příliš těsné.\n\nNetušil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem, že jsou obyvatelé [ROOT.Char.GetCurrentLocation.GetTitle.GetBaseNameNoTier] tak nedůvěřiví. Ani přesně nevím, co vzbudilo jejich podezření, ale začali klást otázky a mně brzy došly odpovědi.\n\nPřinejmenším jsme unikli i se svou dosavadní kořistí, třebaže jsme z nich už nic dalšího nevymámili."
 laamp_base_contract_schemes.2783.a: "Ale můj plán byl dokonalý!"
 laamp_base_contract_schemes.2783.b: "Je to jen jeden nepatrný nezdar. Kupředu!"
 laamp_base_contract_schemes.2783.b.tt.travel_onwards: "$laamp_base_contract_schemes.2782.b.tt.travel_onwards$"
 laamp_base_contract_schemes.2783.c: "Lepší živý se stříbrem než mrtvý se zlatem."
 laamp_base_contract_schemes.2783.d: "Raději... to nechme tak..."
 laamp_base_contract_schemes.2783.d.tt: "$laamp_base_contract_schemes.2782.d.tt$"
 laamp_base_contract_schemes.3301.t: "$laamp_base_contract_schemes.3004.t$ – [current_barony.GetNameNoTierNoTooltip]"
 laamp_base_contract_schemes.3301.desc.scandal_affair: "Možná se ke dvoru [current_char.GetTitledFirstName] nedostaneme, aniž bychom vzbudili pozornost, ale podle všeho to ani nebude nutné. Místní žijí zvěstmi o nevěře.\n\nNetýkají se nikoho #EMP příliš#! významného, ale nečekaný milostný poměr přece jen trochu okoření jednotvárný každodenní život v [current_barony.GetNameNoTier].\n\nNaštěstí pro nás se tu tolik klevetí, že by nemělo být obtížné vymámit ze služebnictva a méně významných dvořanů pár užitečných střípků."
 laamp_base_contract_schemes.3301.desc.scandal_torture: "Aniž bychom získali přímý přístup ke dvoru [current_char.GetTitledFirstName], je rozruch uvnitř hlavním tématem všech hovorů v [current_barony.GetNameNoTier].\n\nJeden z místních hodnostářů se zjevně pokoušel vymoci dluhy či pomstít jakousi urážku, ale při mučení svého soupeře zašel příliš daleko a zanechal po sobě jen zlomenou lidskou trosku.\n\n[current_char.GetTitleAsNameNoTooltip|U] byl[Select_CString( current_char.IsFemale, 'a', '' )] vyzván[Select_CString( current_char.IsFemale, 'a', '' )], aby zasáhl[Select_CString( current_char.IsFemale, 'a', '' )] a viníka potrestal[Select_CString( current_char.IsFemale, 'a', '' )], ale z nějakého důvodu se k tomu nemá.\n\nPro oběť je to nešťastné, nám však tato atmosféra #EMP dokonale#! umožňuje klást choulostivé otázky, aniž bychom vzbudili podezření."
 laamp_base_contract_schemes.3301.desc.scandal_manslaughter: "V ulicích [current_barony.GetNameNoTier] tekla krev. Čepel sice netasil[Select_CString( current_char.IsFemale, 'a', '' )] [current_char.GetTitledFirstName], ale vše uvedl do pohybu právě vydaný rozkaz.\n\nMístní nařízení, zavedené přesně podle pokynů postavy [current_char.GetTitleAsNameNoTooltip], se ukázalo být děsivě neoblíbené. Prostý rychtář, jinak poměrně oblíbený pro svou spravedlivost a rozvahu, byl při pokusu o jeho prosazení před pouhými dvěma dny zabit v politováníhodném výbuchu vášně.\n\nPři všech těch vášnivých řečech a vzájemném obviňování by nemělo být obtížné vylákat z místních nějaká tajemství."
 laamp_base_contract_schemes.3301.desc.scandal_loan: "V [current_barony.GetNameNoTier] se ozývá tlumené reptání a bědování rozmrzelých obyvatel pohoršených nejnovějším skandálem.\n\nMístní věřitel podle všeho začal po celém městě vymáhat nejrůznější dluhy, což obyvatele rozčiluje ještě více než nečekaná daň. Ještě horší je, že se tak děje s mlčenlivým souhlasem postavy [current_char.GetTitledFirstName], což mnozí považují za neodpustitelnou zradu.\n\nNení to nejlepší prostředí pro kladení dotěrných otázek, ale ani zdaleka nejhorší pro hledání zahořklých služebníků s prořízlými ústy."
 laamp_base_contract_schemes.3301.desc.scandal_bribery: "V [current_barony.GetNameNoTier] všichni mluví o jakémsi úředníkovi ze služeb postavy [current_char.GetTitledFirstName], kterého přistihli při přijímání #EMP skutečně#! ohromujícího množství protichůdných úplatků.\n\nTrocha korupce tu a tam není nic neobvyklého. Pro mnoho úředníků představuje očekávanou část jejich příjmu, ale i takové věci mají své meze.\n\nZde byly tyto meze překročeny až k prasknutí.\n\nPro postavu [current_char.GetTitleAsNameNoTooltip] je to špatná zpráva, ale znamenitá pro každého, koho zajímají rozhořčení místní se spoustou příběhů."
 laamp_base_contract_schemes.3301.desc.rumblings_war: "Ulice [current_barony.GetNameNoTier] naplňují šepoty o válce a krvi. Mnoho místních je naprosto #EMP přesvědčeno#!, že [current_char.GetTitledFirstName] brzy rozpoutá konflikt.\n\nVálka samozřejmě není ničím neobvyklým, a právě proto mohou klepny a šiřitelé pověstí snadno rozdmýchávat obavy, když dlouhé večery nemají čím jiným vyplnit.\n\nAť už jsou zvěsti pravdivé, či nikoli, všude je dost hovorných lidí přímo #EMP dychtících#! podělit se s podnikavým cizincem o své názory i o to, co zaslechli."
 laamp_base_contract_schemes.3301.desc.rumblings_murder: "Nikdo sice nedokáže nic říct s jistotou, ale v [current_barony.GetNameNoTier] mají všichni na rtech jediné slovo. #EMP Vražda#!.\n\nNěkteří tvrdí, že vraždu chystá přímo [current_char.GetTitledFirstName], protože docházející trpělivost vyvolala touhu po předčasném skonu jakéhosi ubožáka. Jiní říkají, že údajné spiknutí naopak míří #EMP proti#! postavě [current_char.GetTitleAsNameNoTooltip], nebo že jde pouze o politické zápolení mezi několika bezohlednějšími dvořany.\n\nAť je pravda jakákoli, všichni teď dychtivě klevetí.\n\nTo se hodí."
 laamp_base_contract_schemes.3301.desc.rumblings_affair: "Klevety se mezi prostým lidem šíří rychleji než požár starým městem a žádné neletí tak rychle jako zvěst, že [current_char.GetTitledFirstName] z [current_barony.GetNameNoTier] někoho podezírá z cizoložství.\n\nNikdo by se samozřejmě neodvážil něco tak troufalého vyslovit zcela otevřeně, ale za zavřenými dveřmi, po jednom či dvou pohárech vína a při všech těch tajemných postavách vídaných u dvora...\n\nLidé jsou obezřetní, ale jejich touha po skandálu je stále činí zranitelnými vůči několika obratně položeným otázkám."
 laamp_base_contract_schemes.3301.desc.mundane_feast: "Veškeré vzrušení v [current_barony.GetNameNoTier] se nyní soustředí výhradně na chystanou menší hostinu, kterou hodlá uspořádat [current_char.GetTitledFirstName].\n\nBohužel má být #EMP právě#! natolik okázalá, aby zaujala každého podřadného šiřitele pověstí, užvaněnou klepnu a špehujícího uličníka v celém městě.\n\nVšichni mluví jen o tom, kdo nejspíš dostane pozvání a kdo nikoli, jaké pokrmy se budou podávat a jakou zábavu [current_char.GetTitleAsNameNoTooltip] připraví. Není to právě nejlepší prostředí pro pátrání po #EMP strategičtějších#! informacích."
 laamp_base_contract_schemes.3301.desc.mundane_nothing: "V [current_barony.GetNameNoTier] se nyní bohužel nemluví o ničem důležitém.\n\nMezi prostým lidem se samozřejmě odehrává obvyklá záplava drobných dramat, ale nic zvlášť skandálního ani zajímavého. To je problém, protože příchod cizinců kladoucích otázky pak působí neobvykle.\n\nPřesto musíme z tohoto jednotvárného města vydolovat všechny informace, které jen dokážeme."
 laamp_base_contract_schemes.3301.tt.plus_one_success: "#P +1#! získaná zpravodajská informace"
 laamp_base_contract_schemes.3301.a: "Budu pozorně naslouchat..."
 laamp_base_contract_schemes.3301.a.tt.success: "Několik užitečných střípků"
 laamp_base_contract_schemes.3301.a.tt.failure: "[intrigue_duellist.GetFirstNameNoTooltip] ti překazí plány"
 laamp_base_contract_schemes.3301.b: "Je čas využít svůj šarm!"
 laamp_base_contract_schemes.3301.b.tt.success: "Slova, která neměla zaznít"
 laamp_base_contract_schemes.3301.b.tt.failure: "[diplomacy_duellist.GetFirstNameNoTooltip] přiměje dvůr mlčet"
 laamp_base_contract_schemes.3301.c: "Vyslechněme každého, koho můžeme, a pak odjeďme."
 laamp_base_contract_schemes.3301.d: "Nebudeme si zahrávat s postavou [current_char.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.3301.d.tt.skip_the_attempt: "Nezískáš zde #N žádné#! zpravodajské informace"
 laamp_base_contract_schemes.3302.t: "$laamp_base_contract_schemes.3004.t$ – úspěch!"
 laamp_base_contract_schemes.3302.desc.intro: "Zmocněnci postavy [employer.GetTitledFirstName] se s námi setkají v [current_barony.GetNameNoTier] a dychtivě převezmou naše hlášení.\n\n"
 laamp_base_contract_schemes.3302.desc.win.critical: "A že máme připravené #EMP pořádné#! hlášení. Důkladný soupis všech jednání, pověstí a vyzrazených tajemství od [destination_1.GetNameNoTier] až po [destination_2.GetNameNoTier], více než dostatečný k tomu, aby měl špehmistr postavy [employer.GetFirstNameNoTooltip] po mnoho dalších měsíců plné ruce práce se stopami a intrikami.\n\nZmocněnci jsou vděční za naši práci,"
 laamp_base_contract_schemes.3302.desc.win.standard: "Naštěstí jsme získali dostatek poznatků, abychom je zaujali. Možná ne vše, co jsme mohli, ale dost na to, aby měl špehmistr postavy [employer.GetFirstNameNoTooltip] spoustu práce a naše kontakty spokojeně zamručely.\n\nZmocněnci jsou vděční za naši práci,"
 laamp_base_contract_schemes.3302.desc.win.qualified: "Není toho... mnoho. Shromážděných pověstí a doslechů máme tak málo, že špehmistr postavy [employer.GetFirstNameNoTooltip] nemá příliš s čím pracovat. Málo, ale přece jen ne #EMP vůbec nic#!.\n\nPo krátkém a nevrlém rozhovoru"
 laamp_base_contract_schemes.3302.desc.outro: "nám špehové postavy [employer.GetTitleAsNameNoTooltip] přinesou dohodnutou odměnu.\n\nSamozřejmě diskrétně."
 laamp_base_contract_schemes.3302.a: "Taková odměna za pár zašeptaných slov!"
 laamp_base_contract_schemes.3303.t: "$laamp_base_contract_schemes.3004.t$ – neúspěch!"
 laamp_base_contract_schemes.3303.desc: "Zmocněnci postavy [employer.GetTitledFirstName] se s námi v [current_barony.GetNameNoTier] setkají jen nakrátko. Jakmile začneme chrlit výmluvy, proč nemáme jedinou věrohodnou informaci, o kterou bychom se mohli podělit, špehové pochopí, že jsme selhali.\n\nRázně nám sdělí, abychom svými kejklemi již neztráceli čas postavy [employer.GetTitleAsNameNoTooltip] a v budoucnu neočekávali žádnou pomoc, načež bez prodlení zmizí.\n\nMožná není špionáž tou pravou hrou pro takové [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')], jako jsme my..."
 laamp_base_contract_schemes.3303.a: "Kdo obchoduje s pověstmi, mívá bídné zboží."
 laamp_base_contract_schemes.3661.t: "$laamp_base_contract_schemes.3031.t$ – [destination_1.GetBaseNameNoTierNoTooltip]"
 laamp_base_contract_schemes.3661.desc.intro: "[destination_1.GetBaseNameNoTier] působí jako příjemné místo. Škoda jen, že sem přicházíme za tak nepříjemných okolností.\n\nKrátce před setměním čekáme s malou skupinou mých stoupenců ve stínech nedaleko našeho cíle:"
 laamp_base_contract_schemes.3661.desc.business.fallback: "malé, ale prosperující dílny, před níž visí čerstvě natřený vývěsní štít ohlašující jejího patrona."
 laamp_base_contract_schemes.3661.desc.business.inn_exterior: "zájezdního hostince těsně za městem, který je mezi místními očividně oblíbený. Prozatím."
 laamp_base_contract_schemes.3661.desc.business.relaxing_room: "zámožného městského domu, snad druhého sídla nějakého pána či paní."
 laamp_base_contract_schemes.3661.desc.business.winery: "dobře zásobeného vinařství překypujícího sudy znamenitého vína. Právě ty sudy a sladké víno jsme přišli zničit."
 laamp_base_contract_schemes.3661.desc.business.tavern: "rušné krčmy plné smějících se hostů. Krčmy, která musí shořet."
 laamp_base_contract_schemes.3661.desc.business.docks: "rozlehlého dřevěného skladiště u přístavu, které je hotovou zásobárnou troudu."
 laamp_base_contract_schemes.3661.desc.business.kennels: "páchnoucího psince přeplněného štěkajícími honiči."
 laamp_base_contract_schemes.3661.desc.business.shrine: "skromného [target.GetFaith.HouseOfWorship] u cesty, očividně nedávno a s láskou vybudovaného pro vyznavače [target.GetFaith.GetName]."
 laamp_base_contract_schemes.3661.desc.business.mews: "prosperující sokolnice, v níž jsou již všichni lovečtí ptáci na noc bezpečně ukryti."
 laamp_base_contract_schemes.3661.desc.business.bridge: "mostu, na němž se vybírá mýtné a jehož kamenné věže shlížejí daleko po řece, kterou svírají."
 laamp_base_contract_schemes.3661.desc.business.market: "malého tržiště obklopeného shlukem těsně namačkaných domů."
 laamp_base_contract_schemes.3661.desc.outro: "\n\n[employer.GetTitledFirstName] nepovažoval[Select_CString( employer.IsFemale, 'a', '' )] za nutné vysvětlit, zda oběť jménem [target.GetTitledFirstName] toto místo vlastní, má v něm nějaké zájmy, nebo k němu jen chová citovou náklonnost.\n\nBrzy na tom tak jako tak nebude záležet."
 laamp_base_contract_schemes.3661.tt.duel_success: "Úkol splněn"
 laamp_base_contract_schemes.3661.tt.duel_failure: "Zakázka selhala"
 laamp_base_contract_schemes.3661.tt.stealth_maintained_no_gallowsbait: "#TUT Tato metoda #P zachová tvou anonymitu#! a sníží získanou vlastnost [GetTrait('gallowsbait').GetName( GetNullCharacter )]#!"
 laamp_base_contract_schemes.3661.tt.stealth_foregone_extra_gallowsbait: "#TUT Tato metoda #N odhalí tvou totožnost#! a zvýší získanou vlastnost [GetTrait('gallowsbait').GetName( GetNullCharacter )], ale celkově je #P snazší#!#!"
 laamp_base_contract_schemes.3661.a: "Buďte zticha. Jakmile se oheň rozhoří, zmizíme."
 laamp_base_contract_schemes.3661.b: "Utvořte obvyklé dvojice. Hlídejte východy a neztrácejte nervy."
 laamp_base_contract_schemes.3661.c: "Dva dozadu, čtyři na každou stranu. Do toho."
 laamp_base_contract_schemes.3661.d: "Připravte sekery a pojďme se #EMP zbrotit krví!#!"
 laamp_base_contract_schemes.3661.e: "Doufám, že jste všichni připraveni. #EMP Útok!#!"
 laamp_base_contract_schemes.3661.f: "[officer.GetFirstNameNoTooltip], máš něco jedovatého?"
 laamp_base_contract_schemes.3661.g: "[officer.GetFirstNameNoTooltip], dokážeš se dostat dovnitř bez povšimnutí?"
 laamp_base_contract_schemes.3661.h: "[officer.GetFirstNameNoTooltip], dokážeš tam vystřelit hořící šíp?"
 laamp_base_contract_schemes.3661.i.steal_dogs: "[officer.GetFirstNameNoTooltip], přiveď mi ty psy!"
 laamp_base_contract_schemes.3661.i.dog_on_birds: "[officer.GetFirstNameNoTooltip], pusť na ně své psy."
 laamp_base_contract_schemes.3661.i.poison_barrels: "[officer.GetFirstNameNoTooltip], máš něco, čím by šlo sudy... #EMP otrávit#!?"
 laamp_base_contract_schemes.3661.j: "[officer.GetFirstNameNoTooltip], kde to chytne nejsnáze?"
 laamp_base_contract_schemes.3661.k: "[officer.GetFirstNameNoTooltip], veď svou skupinu z druhé strany."
 laamp_base_contract_schemes.3661.l: "[officer.GetFirstNameNoTooltip], připrav svou družinu."
 laamp_base_contract_schemes.3661.m: "[officer.GetFirstNameNoTooltip], vezmi to druhou cestou. Pak budeme rabovat."
 laamp_base_contract_schemes.3661.n: "[officer.GetFirstNameNoTooltip], myslíš, že dokážeme otrávit všechny?"
 laamp_base_contract_schemes.3661.o: "Kéž bych pro to měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] vhodného důstojníka..."
 laamp_base_contract_schemes.3661.o.lacking_officers.forager_kenneler_cook: "Nemáš ani [GetCourtPositionType('chief_forager_camp_officer').GetName()], ani [GetCourtPositionType('kennelperson_camp_officer').GetName()], ani [GetCourtPositionType('camp_cook_camp_officer').GetName()]"
 laamp_base_contract_schemes.3661.o.lacking_officers.thief_huntsman_engineer: "Nemáš ani [GetCourtPositionType('master_thief_camp_officer').GetName()], ani [GetCourtPositionType('huntperson_camp_officer').GetName()], ani [GetCourtPositionType('chief_engineer_camp_officer').GetName()]"
 laamp_base_contract_schemes.3661.o.lacking_officers.moa_mos_man_haggler: "Nemáš ani [GetCourtPositionType('master_of_arms_camp_officer').GetName()], ani [GetCourtPositionType('master_of_spoils_camp_officer').GetName()], ani [GetCourtPositionType('person_haggler_camp_officer').GetName()]"
 laamp_base_contract_schemes.3661.p: "Já... myslím, že tohle dělat nechci..."
 laamp_base_3661_stole_dogs_modifier: "Nejlepší z plemene"
 laamp_base_3661_stole_dogs_modifier_desc: "Tato postava má k dispozici tolik, tolik, #EMP tolik#! znamenitých honičů."
 laamp_base_contract_schemes.3662.t: "$laamp_base_contract_schemes.3031.t$ – úspěch!"
 laamp_base_contract_schemes.3662.desc.intro: "Dobrý plán přináší rychlé vítězství a dokládá to"
 laamp_base_contract_schemes.3662.desc.business.fallback: "hořící troska malé dílny, která se před našima očima rozpadá."
 laamp_base_contract_schemes.3662.desc.business.inn_exterior: "ohořelá skořápka vypáleného hostince."
 laamp_base_contract_schemes.3662.desc.business.relaxing_room: "doutnající zřícenina městského domu."
 laamp_base_contract_schemes.3662.desc.business.winery: "zpustošené vinařství."
 laamp_base_contract_schemes.3662.desc.business.tavern: "hořící zřícenina krčmy."
 laamp_base_contract_schemes.3662.desc.business.docks: "stále hořící průčelí skladiště, které se pomalu kácí do vody."
 laamp_base_contract_schemes.3662.desc.business.kennels: "naprosté ticho panující v někdejším psinci."
 laamp_base_contract_schemes.3662.desc.business.shrine: "znesvěcený [target.GetFaith.HouseOfWorship], který líně hoří u cesty."
 laamp_base_contract_schemes.3662.desc.business.mews: "nyní ztichlá sokolnice."
 laamp_base_contract_schemes.3662.desc.business.bridge: "hořící věže mostu, na němž se vybíralo mýtné."
 laamp_base_contract_schemes.3662.desc.business.market: "tichá spoušť na tržišti."
 laamp_base_contract_schemes.3662.desc.method.intrigue: "Díky rychlosti, nenápadnosti a také nedostatku střízlivých protivníků založíme s mými stoupenci několik požárů a hbitě se stáhneme. Plameny odvedou svou práci a nám stačí ráno se vrátit a prohlédnout si výsledek.\n\nPodle všeho jej dostatečně dokládá"
 laamp_base_contract_schemes.3662.desc.method.martial: "Vraždit chladnokrevně vyžaduje silný žaludek, ale příslib stříbra činí mnohé snesitelným. Jakmile uvnitř nikoho nenecháme naživu, navršíme těla, založíme oheň a uprchneme do noci.\n\nŽádný svědek nenajde dost odvahy, aby zasáhl, a výsledek dokládá"
 laamp_base_contract_schemes.3662.desc.method.prowess: "Osobně vedu útok a se svými stoupenci rychle skoncujeme se všemi nešťastníky, kteří se nacházejí uvnitř. Bez váhání či slitování je pobijeme a jejich těla ponecháme tam, kde padla. Poté naházíme zápalné pochodně na nejsnáze hořlavá místa a přiživíme vznikající plameny vším, co dokáže hořet.\n\nŠpinavá práce, ale účinná.\n\n"
 laamp_base_contract_schemes.3662.desc.method.forager: "Jakmile se [officer.GetTitledFirstName] dostane dovnitř, vykonání odporného úkolu netrvá dlouho. Trocha jedu dokáže mnoho a tentokrát ho s sebou bylo zřejmě opravdu hodně. Možná by mě to mělo znepokojovat, ale tím se mohu zabývat jindy.\n\nČeká-li zde [target.GetTitledFirstName] nějaké zboží, přijde nemilé překvapení, což dokládá"
 laamp_base_contract_schemes.3662.desc.method.thief: "S kočičí obratností se [officer.GetTitledFirstName] protáhne dovnitř uvolněnými okenicemi v horním patře. Několik minut panuje uvnitř naprosté ticho, dokud se nám neotevřou dveře a nevynoří se [officer.GetFirstNameNoTooltip] se zkrvaveným nožem v ruce. Uvnitř budovy zjevně nenastaly #EMP příliš#! velké potíže.\n\nZaložit poté požár je dětsky snadné, jak dokládá"
 laamp_base_contract_schemes.3662.desc.method.huntperson: "Šíp vypuštěný postavou [officer.GetTitledFirstName] zasáhne přesně a pevně se zabodne do suchého, popraskaného trámu vysoko v krovu, daleko od míst, kde by bylo snadné oheň uhasit. Tiše čekáme a sledujeme, jak se plamen pomalu rozhoří, dokud nám pach kouře nepronikne hluboko do chřípí.\n\nMůžeme odejít s jistotou, kterou potvrzuje"
 laamp_base_contract_schemes.3662.desc.method.kenneler.poison_barrels: "[officer.GetTitledFirstName] bez potíží #EMP znehodnotí#! jeden sud znamenitého vína za druhým, zatímco ostatní držíme hlídku nebo podle pokynů přenášíme vše potřebné. Nakonec je to... téměř veselá práce a několik mých stoupenců si ze sudu poslouží ještě předtím, než jej zničíme. Proč také ne.\n\nZpočátku by ovšem nemuselo být nic patrné, a tak venku ponecháme čerstvě nalitý pohár s malým překvapením plovoucím uvnitř a stopou vedoucí až k jeho zdroji.\n\n"
 laamp_base_contract_schemes.3662.desc.method.kenneler.steal_dogs: "[officer.GetTitledFirstName] vklouzne do psince a vše zůstane... téměř dokonale tiché. Uplyne více než deset minut a právě když se začínáme vzdávat naděje a chystáme se místo stejně zapálit, objeví se [officer.GetFirstNameNoTooltip] a na několika vodítkách pevně svírá doslova #EMP desítky#! honičů.\n\nJe zázrak, že zvířata zůstala převážně zticha a jen funí a kňučí, jako by šlo o nějakou úžasnou hru. Každý popadne tolik vodítek, kolik unese, a uprchneme do noci –"
 laamp_base_contract_schemes.3662.desc.method.kenneler.dog_on_birds: "Metody postavy [officer.GetTitledFirstName] jsou hlučné, ale účinné. S několika vrčícími a chňapajícími honiči v rukou zmizí [officer.GetFirstNameNoTooltip] v sokolnici. Na několik minut okolí naplní štěkot, kousání a trhání. Dravci uvnitř hynou po desítkách a jen několika šťastlivcům se podaří uniknout otevřenými dveřmi.\n\nKdyž se náš $kennelperson_camp_officer$ konečně vynoří, už jsme téměř připraveni odjet a nečekat, protože zalarmovaní místní se #EMP rychle#! blíží. Několik dobře mířených šípů je zažene a my uprchneme do tmy.\n\n"
 laamp_base_contract_schemes.3662.desc.method.engineer: "[officer.GetTitledFirstName] rychle odhalí několik zásadních slabin stavby a poručí nám na každé z vybraných míst nanést smůlu a přiložit pochodeň. Budova se během několika minut rozhoří a my uprchneme dříve, než se zevnitř ozve první křik.\n\n"
 laamp_base_contract_schemes.3662.desc.method.haggler: "Moji vojáci a družina pod velením [officer.GetTitledFirstName] zaútočí náhle a každý z jiné strany, takže překvapení obránci nemají žádnou šanci. Jednoduše je pobijeme od jednoho konce ke druhému, kosíme je jako zralé obilí a poté jejich malý podnik zapálíme.\n\n"
 laamp_base_contract_schemes.3662.desc.method.armsman: "$laamp_base_contract_schemes.3662.desc.method.haggler$"
 laamp_base_contract_schemes.3662.desc.method.spoiler: "$laamp_base_contract_schemes.3662.desc.method.haggler$"
 laamp_base_contract_schemes.3662.desc.method.cook: "$laamp_base_contract_schemes.3662.desc.method.forager$"
 laamp_base_contract_schemes.3662.desc.outro: "[employer.GetTitledFirstName] nám nepochybně ochotně předá odměnu."
 laamp_base_contract_schemes.3662.a: "Za řádné vítězství náleží naditý měšec!"
 laamp_base_contract_schemes.3662.b: "Ha, stejně ať se dozvědí, že jsem to byl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] já!"
 laamp_base_contract_schemes.3663.t: "$laamp_base_contract_schemes.3031.t$ – neúspěch!"
 laamp_base_contract_schemes.3663.desc.intro: "Říká se, že žádný plán nepřežije střet s nepřítelem. Ten náš rozhodně nepřežil, protože prozatím"
 laamp_base_contract_schemes.3663.desc.business.fallback: "malá dílna stále stojí."
 laamp_base_contract_schemes.3663.desc.business.inn_exterior: "hostinec zůstal převážně neporušený."
 laamp_base_contract_schemes.3663.desc.business.relaxing_room: "městský dům stojí nedotčen."
 laamp_base_contract_schemes.3663.desc.business.winery: "zásoby vinařství zůstaly neznehodnocené."
 laamp_base_contract_schemes.3663.desc.business.tavern: "krčma nadále dobře prosperuje."
 laamp_base_contract_schemes.3663.desc.business.docks: "skladiště u přístavu zůstalo nespálené."
 laamp_base_contract_schemes.3663.desc.business.kennels: "psinec je stejně jako dříve plný psího štěkotu."
 laamp_base_contract_schemes.3663.desc.business.shrine: "malý [target.GetFaith.HouseOfWorship] stále pokojně stojí u cesty."
 laamp_base_contract_schemes.3663.desc.business.mews: "vzduchem se stále rozléhá křik a skřeky sokolnických dravců."
 laamp_base_contract_schemes.3663.desc.business.bridge: "most s mýtným nadále sklízí pravidelnou úrodu mincí pocestných."
 laamp_base_contract_schemes.3663.desc.business.market: "na tržišti pokračuje čilý a rušný obchod."
 laamp_base_contract_schemes.3663.desc.method.intrigue: "Naše pokusy nenápadně založit požár přilákaly skupinku opilých povalečů, kterým víno dodalo kuráž a kteří byli bezdůvodně a bez jediného důkazu přesvědčeni, že chystáme nějakou zločinnost. Promáčení darmošlapové se na nás vrhli s takovou zuřivostí a způsobili takový povyk, že ti zatracení hlupáci přivolali pomoc a rychle nás zahnali na útěk.\n\n"
 laamp_base_contract_schemes.3663.desc.method.martial: "Neztrácejte nervy, říkal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem svým stoupencům. Když nás však záblesk zbraní prozradil dříve, než jsme čekali, neměl to být žádný problém. Ozval se poplašný křik a brzy proti nám vyrazili místní ozbrojení vším, co měli po ruce.\n\nNa počtu záleží, ale stejně tak na přípravě, nebo by alespoň mělo. Když si uvědomím, že se mnou zůstala jen polovina družiny, nezbývá mi než zavelet k ústupu."
 laamp_base_contract_schemes.3663.desc.method.prowess: "Přes veškerou snahu se nám nepodařilo proniknout dveřmi, aniž bychom způsobili příšerný rámus. Než jsme se dostali dovnitř, z okolí se už ozývaly výkřiky a poplašné volání. Vzhledem k našemu nevelkému počtu jsme se rozhodli uprchnout, než zůstat a skončit na šibenici jako bandité.\n\n"
 laamp_base_contract_schemes.3663.desc.method.forager: "[officer.GetTitledFirstName] uvnitř nestrávil[Select_CString( officer.IsFemale, 'a', '' )] mnoho času. Na důležitých místech prostě štědře rozložil[Select_CString( officer.IsFemale, 'a', '' )] jed a odešel[Select_CString( officer.IsFemale, 'odešla', 'odešel' )]. Přesvědčeni o úspěchu jsme se vzdálili a ráno se vrátili na místo činu, abychom své dílo ověřili.\n\nVloupání sice bohužel odhalili, ale [officer.GetFirstNameNoTooltip] #EMP zjevně#! použil[Select_CString( officer.IsFemale, 'a', '' )] nesprávnou bylinu! Teď jsou ve střehu a my jsme nezískali vůbec nic."
 laamp_base_contract_schemes.3663.desc.method.thief: "Dostat se dovnitř nepředstavuje pro postavu [officer.GetTitledFirstName] žádný problém. Obtížnější je provést to bez povšimnutí. Pouhých několik okamžiků po vniknutí se zevnitř ozve poplašný výkřik a vzápětí hluk zápasu.\n\nZanedlouho se dveře prudce rozletí a [officer.GetFirstNameNoTooltip] se vykutálí ven. Pomůžeme [officer.GetFirstNameNoTooltip] na nohy a uprchneme dříve, než rozruch a sílící výkřiky #EMP STŮJ! ZLODĚJ!#! přivolají pomoc."
 laamp_base_contract_schemes.3663.desc.method.huntperson: "Šíp postavy [officer.GetTitledFirstName] nejenže mine cíl, ale ta zatracená věc místo toho zasáhne zavřenou okenici a s hlasitým #EMP žuchnutím#! se od ní odrazí. O několik vteřin později se dřevěné lamely rozletí a z přítmí nejistě vykoukne ospalá tvář.\n\nPohled na nás v nenápadném oděvu, na postavu [officer.GetFirstNameNoTooltip] stále svírající luk a na spadlý šíp, který nám u nohou tiše dohořívá, naprosto jasně prozradí naše nekalé úmysly. Jakmile se rozezní poplach, dáme se na útěk –"
 laamp_base_contract_schemes.3663.desc.method.kenneler.poison_barrels: "[officer.GetTitledFirstName] měl[Select_CString( officer.IsFemale, 'a', '' )] docela prostý úkol. Dostaneme [officer.GetFirstNameNoTooltip] dovnitř, sudy budou #EMP znehodnoceny#! a my odejdeme s několika drobnými cennostmi, aby vše vypadalo jako obyčejná krádež.\n\nTen hlupák však při otevírání hned první sud úplně převrhl, rozrazil jej a s rachotem poslal k zemi. Poplašné výkřiky z okolí jasně oznámily, že je po všem, a tak jsme uprchli."
 laamp_base_contract_schemes.3663.desc.method.kenneler.steal_dogs: "Na krátký okamžik poté, co [officer.GetTitledFirstName] vstoupí do psince, vytí uvnitř utichne. Pak se ozve... tlumená řeč? Zavrčení, další vrčení, cenění zubů, chňapání a hluk zápasu!\n\n[officer.GetFirstNameNoTooltip] vyběhne z malé budovy pronásledován[Select_CString( officer.IsFemale, 'a', '' )] dvěma mohutnými chňapajícími honiči a výkřik z nedalekého místa prozradí, že varovný štěkot psů někdo zaslechl. Stejně jako [officer.GetFirstNameNoTooltip] se dáme na útěk, ale"
 laamp_base_contract_schemes.3663.desc.method.kenneler.dog_on_birds: "[officer.GetTitledFirstName] se dovnitř skutečně dostal[Select_CString( officer.IsFemale, 'a', '' )] se dvěma psy na vodítkách, kteří se zoufale snažili vytrhnout. Jakmile však ti zatracení čoklové spatřili ptáky, začali štěkat jako pominutí. Když se z cenné sokolnice rozezní psí vytí, někdo poblíž spustí poplach a je jasné, že musíme utéct.\n\n"
 laamp_base_contract_schemes.3663.desc.method.engineer: "[officer.GetTitledFirstName] tak dlouho váhal[Select_CString( officer.IsFemale, 'a', '' )] a snažil[Select_CString( officer.IsFemale, 'a', '' )] se určit, kde #EMP přesně#! bude nejlepší založit požár, až si někdo všiml, že se tu potloukáme! Jakmile nás spatřili, věděl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem, že je po všem. Jeden zmatený výkřik vyvolal další a útěk se brzy stal jedinou možností.\n\n"
 laamp_base_contract_schemes.3663.desc.method.haggler: "Má družina a skupina postavy [officer.GetTitledFirstName] přicházejí z protilehlých směrů, ale zdá se, že jsme... podcenili odhodlání místních. Našeho útoku si všimnou a obránci namísto paniky popadnou vše, co mohou použít jako zbraň, a s oprávněným rozhořčením se na nás vrhnou za hromového volání #EMP BANDITÉ!#!\n\nNamísto masakru hrozí, že nás jejich početní převaha zcela převálcuje, a jsme nuceni uprchnout –"
 laamp_base_contract_schemes.3663.desc.method.armsman: "$laamp_base_contract_schemes.3663.desc.method.haggler$"
 laamp_base_contract_schemes.3663.desc.method.spoiler: "$laamp_base_contract_schemes.3663.desc.method.haggler$"
 laamp_base_contract_schemes.3663.desc.method.cook: "$laamp_base_contract_schemes.3663.desc.method.forager$"
 laamp_base_contract_schemes.3663.desc.outro: "[employer.GetTitledFirstName] nám za tento zpackaný útok nedá jedinou minci."
 laamp_base_contract_schemes.3663.a: "Měli bychom odejít..."
 laamp_base_contract_schemes.3663.b: "Pche, ať se [target.GetFirstNameNoTooltip] stejně dozví, že jsem za tím stál[Select_CString( ROOT.Char.IsFemale, 'a', '' )] já."
 laamp_base_contract_schemes.3781.t: "$laamp_base_contract_schemes.3041.t$ – ještě trochu"
 laamp_base_contract_schemes.3781.desc.intro.yes: "Kapsy už máme napěchované stříbrnými mincemi ukradenými přímo z pokladnice postavy [employer.GetTitledFirstName], ale v [employer.GetHerHis] [employer.Custom('FortifiedBuilding')] se skrývá ještě mnoho dalších cenností. Zlaté svícny, honosné tapiserie, oděvy z nejjemnějšího plátna, posvátné texty a mnohé další.\n\nVšechny ty četné náležitosti, které dobrý [employer.GetTitleAsNameNoTooltip] nejspíš považuje za samozřejmost, ale pro někoho, jako je [ROOT.Char.Custom('GetLaampDescribeTypeSelf')], představují #EMP zisk#!.\n\nStačí vyrabovat sídlo postavy [employer.GetTitledFirstName] dříve, než nás odhalí, a poté zmizet do noci."
 laamp_base_contract_schemes.3781.desc.ending: "A to je... všechno?\n\nAť mě [ROOT.Char.GetFaith.WealthGodName] zatratí, z [employer.GetTitledFirstNamePossessive] [employer.Custom('FortifiedBuilding')] jsme odnesli doslova #EMP všechno#!, co se dalo ukořistit. Kořist jsme rozdělili do pytlů a neuměle svázali tak, aby působila co nejméně hluku. Jen nejcennější artefakty jsme ušetřili tak hrubého zacházení.\n\nPostavu [employer.GetTitledFirstName] čeká po probuzení #EMP velmi#! nepříjemné ráno.\n\nTeď už nezbývá než odejít."
 laamp_base_contract_schemes.3781.desc.success.method.intrigue: "Podříznu hrdlo opozdilému strážnému, zachytím jeho tělo a tiše je spustím na podlahu. Poté je odkopnu do nejhlubšího stínu, jaký najdu.\n\nOtřu krev z čepele a prohledám stanoviště toho ubožáka. Trocha zdobené výšivky zde, trochu stříbra tam, všechno se počítá. Smrt pro dobrou věc.\n\nBudou-li mít ostatní obránci štěstí, najdou si k hlídkování méně příhodná místa, protože tuším, že"
 laamp_base_contract_schemes.3781.desc.success.method.prowess: "Musím se několikrát rozmách­nout, abych dveře dostatečně #EMP poničil#! a zároveň nezpůsobil příliš mnoho hluku, ale nakonec se mi podaří vyrazit je ze zvětralých závěsů. Za nimi se objeví malá místnost sloužící... převážně ke skladování všelijakých věcí.\n\nHmm. Nic úžasného, ale když už jsem uvnitř, stejně vše prohledám a nakonec najdu právě dost cenností, aby se má námaha vyplatila.\n\nPřesto"
 laamp_base_contract_schemes.3781.desc.success.method.martial: "Neschopné stráže postavy [employer.GetTitledFirstName] pobijeme rychle a tiše, pouze s #EMP minimem#! zahleněného smrtelného chroptění. Příhodný výklenek jim poslouží jako dočasné úložiště před budoucím pohřbem a my můžeme nerušeně pokračovat v drancování.\n\nUložení těl nás samozřejmě přinutí zbavit výklenek jeho ozdob a přepychového vybavení, ale tak je to pouze zdvořilé.\n\nKdyž pokračujeme dál, je zřejmé, že"
 laamp_base_contract_schemes.3781.desc.success.method.stewardship: "Pod správně odměřeným tlakem povolí závěsy uzamčené truhlice a její lesklý obsah se s hlasitým řinčením vysype ven.\n\nNa okamžik ztuhnu a čekám, zda hluk někoho přiláká, ale... nic. Tiše se zasměji, skloním se ke kořisti a sbírám jednu minci po druhé jako slepice zrní.\n\nJakmile se ujistím, že mám většinu stříbra, obrátím pozornost ven z místnosti, protože"
 laamp_base_contract_schemes.3781.desc.success.method.agent_intrigue: "Ukáže se, že [old_rollee.GetTitledFirstName] našel[Select_CString( old_rollee.IsFemale, 'a', '' )] mnoho cenností a nadšeně šeptá stručný soupis předmětů, které při horečném plenění narychlo ukradl[Select_CString( old_rollee.IsFemale, 'a', '' )].\n\nJe to pěkný úlovek a vzrušení z krádeže by nám mělo dodat sílu na celý večer. Klidně sejmu draze vyhlížející nástěnnou tapiserii a složím ji do vlastního pytle. Nemohu přece dovolit, aby mě mí stoupenci #EMP příliš#! zastínili.\n\nMožná"
 laamp_base_contract_schemes.3781.desc.success.method.agent_prowess: "Jediné pořádné strčení postavy [old_rollee.GetTitledFirstName] úplně vyrazí dveře pokladnice ze závěsů. Vrhneme se vpřed a zachytíme je dříve, než dopadnou a způsobí další hluk.\n\nKořist uvnitř za to riziko rozhodně stojí. Je to zásoba mincí a tributu, které oddaní poddaní odevzdali dobré postavě [employer.GetTitleAsNameNoTooltip] a které díky úsilí postavy [old_rollee.GetFirstNameNoTooltip] nyní úhledně přecházejí do našich rukou.\n\nTohle všechno a ještě více je naše a"
 laamp_base_contract_schemes.3781.desc.success.method.master_thief: "[old_rollee.GetTitledFirstName] nic neřekne, pouze se zazubí a zvedne [old_rollee.Custom('Hand_ArticleTwo')] [old_rollee.Custom('HandHands')] ověšené čerstvě ukořistěnými třpytivými prsteny, snad třemi či čtyřmi na každém prstu.\n\nSpokojeně přikývnu a pokynu svému $master_thief_camp_officer$, aby pokračoval[Select_CString( old_rollee.IsFemale, 'a', '' )] v plenění jinde. Prsteny by si nejspíš měl[Select_CString( old_rollee.IsFemale, 'a', '' )] sundat, protože obratnosti rozhodně nepomáhají, ale teď není čas na poučování, zvlášť když"
 laamp_base_contract_schemes.3781.desc.success.method.mos: "[old_rollee.GetTitledFirstName] s úsměvem otevře hrubě tkaný pytel a odhalí vrchovatou #EMP zásobu#! mincí, jejichž cinkání tlumí několik velmi draze vyhlížejících polštářů.\n\nMůj $master_of_spoils_camp_officer$ si znalecky poklepe na [old_rollee.Custom('ActionTaps_ForeheadNose')]. „Nejde o to všimnout si zjevné kořisti, ale zjevných míst, kam ji někdo mohl #EMP ukrýt#!.“\n\nTo je pravda a"
 laamp_base_contract_schemes.3781.desc.success.method.stress: "Soustředit se, soustředit se, #EMP soustředit se#!. Musím se soustředit.\n\nChytí-li nás zde, na oprátce skončím první a viset budu nejdéle. Není prostor pro jediný chybný krok, skutečný ani obrazný. Musíme postupovat rychle, uvážlivě a nemilosrdně od místnosti k místnosti a od budovy k budově a brát vše, co má byť jen nepatrnou hodnotu.\n\nVábivé volání dalších mincí nás však žene stále kupředu. Koneckonců"
 laamp_base_contract_schemes.3781.desc.failure.method.intrigue: "Připravené nože se ukážou jako znamenitá pojistka, protože během postupu narazíme na příliš mnoho obtížných strážných rozesetých po celém místě.\n\nNěkteří zde byli od začátku, jiné přilákal hluk při našem vniknutí. Jejich přítomnost každopádně naznačuje, že začínáme vzbuzovat pozornost. Mnohem, mnohem větší pozornost, než je zdrávo.\n\nZavrtím hlavou a znovu se soustředím na to, co je prozatím důležité:"
 laamp_base_contract_schemes.3781.desc.failure.method.prowess: "Přes veškerou snahu prorazit do místnosti, která #EMP vypadá#! jako jakési skladiště, ty zatracené dveře zkrátka nepovolí.\n\nNejsilnější úder, jaký si ještě můžeme dovolit, vyvolá pouze tupé zavrzání dřeva a zamumlání někoho, kdo se poblíž ve spánku obrací.\n\nAť už se uvnitř skrývá cokoli, za takové riziko to nestojí, ale"
 laamp_base_contract_schemes.3781.desc.failure.method.martial: "Hlídku skutečně zlikvidujeme a především ji zlikvidujeme #EMP tiše#!.\n\nJenže... zřejmě ne dostatečně tiše. Zběsilé škubání a vlhké bublání umírajících družiníků může být překvapivě hlasité. Tentokrát nás patrně nikdo neslyšel, ale příště už takové štěstí mít nemusíme.\n\nChamtivost nás přesto volá dál. Zdá se, že"
 laamp_base_contract_schemes.3781.desc.failure.method.stewardship: "Ať už je v té zatracené schráně cokoli, je to těžké, příliš těžké na přenesení holýma rukama, a zámek je #EMP protivně#! kvalitní.\n\nVypáčení by mohlo zabrat celé hodiny a jediný pokus použít sílu vyvolá tak hlasité kovové #EMP řinčení#!, že je div, že nás okamžitě nedopadli. Příští hlasitý zvuk, který vydáme, bude jistě náš poslední.\n\nI když jsme tady neuspěli,"
 laamp_base_contract_schemes.3781.desc.failure.method.agent_intrigue: "Ukáže se, že [old_rollee.GetTitledFirstName] pro nás nejen nic nenašel[Select_CString( old_rollee.IsFemale, 'a', '' )], ale navíc vyrušil[Select_CString( old_rollee.IsFemale, 'a', '' )] skupinu strážných od hry v kostky.\n\nUhodím toho hlupáka přes ucho a zamumlám příkaz, aby byl[Select_CString( old_rollee.IsFemale, 'a', '' )] příště #EMP opatrnější#!, jinak na nás přivolá hněv celého [employer.GetPrimaryTitle.GetBaseNameNoTier].\n\nAť už je to neúspěch, nebo ne,"
 laamp_base_contract_schemes.3781.desc.failure.method.agent_prowess: "Ani se vší svou silou nedokáže [old_rollee.GetTitledFirstName] prorazit dveře, které nás dělí od místnosti plné drahých přepychových předmětů.\n\nPodrážděně pokynu, ať je necháme být. Jinde se jistě najde snazší kořist a čím více se kvůli jednotlivým překážkám rozčilujeme, tím spíše uděláme chybu.\n\nUž při tomhle jsme způsobili příliš mnoho hluku, zvlášť když"
 laamp_base_contract_schemes.3781.desc.failure.method.master_thief: "[old_rollee.GetTitledFirstName] dokázal[Select_CString( old_rollee.IsFemale, 'a', '' )] rychle a tiše prohledat překvapivě rozsáhlou část [employer.Custom('FortifiedBuilding')]. Bohužel podle jeho[Select_CString( old_rollee.IsFemale, 'jejích', 'jeho' )] slov zde téměř nic nelze ukrást bez rizika spuštění poplachu.\n\nJeště horší je provinilý výraz, který naznačuje, že [old_rollee.GetFirstNameNoTooltip] už možná #EMP právě takové#! riziko bez mého vědomí podstoupil[Select_CString( old_rollee.IsFemale, 'a', '' )]. Musíme být ve střehu.\n\nBez ohledu na selhání postavy [old_rollee.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.3781.desc.failure.method.mos: "Příděl soli postavy [old_rollee.GetTitledFirstName] bude zřejmě nutné zkrátit, protože se o několik minut později vrátí úplně s prázdnýma rukama.\n\nČekal jsem, že můj $master_of_spoils_camp_officer$ dokáže sám[Select_CString( old_rollee.IsFemale, 'a', '' )] ukořistit alespoň něco, ale namísto toho musím s rostoucí hrůzou poslouchat vyprávění o málem osudném setkání s hlídkou.\n\nJeště jedna taková chyba a všichni skončíme na oprátce, přesto"
 laamp_base_contract_schemes.3781.desc.cta: "dál v chodbě stále čekají cennosti, které můžeme ukořistit..."
 laamp_base_contract_schemes.3781.tt.haul_details: "#TUT V kořisti máš nyní [gold_i][varcheck.MakeScope.Var('haul_actual').GetValue|P0] [Concept('gold','zlata')|E] z možných [gold_i][varcheck.MakeScope.Var('haul_possible').GetValue|V0]#!"
 laamp_base_contract_schemes.3781.tt.fouls_remaining: "#TUT Máš [varcheck.MakeScope.Var('heist_failures').GetValue] ze 2 prohřešků, po nichž budeš dopaden#!"
 laamp_base_contract_schemes.3781.tt.increment_haul: "Přidáš ke kořisti [gold_i][varcheck.MakeScope.Var('haul_increment').GetValue|P0]"
 laamp_base_contract_schemes.3781.tt.foul_warning.increment: "Získáš #N +1#! prohřešek"
 laamp_base_contract_schemes.3781.tt.foul_warning.pot_lost: "O dosavadní kořist přijdeš"
 laamp_base_contract_schemes.3781.tt.duel_success.skill: "Tvé schopnosti se osvědčí"
 laamp_base_contract_schemes.3781.tt.duel_failure.skill: "Vzbudíš příliš mnoho pozornosti"
 laamp_base_contract_schemes.3781.tt.duel_success.agent: "[rollee.GetFirstNameNoTooltip] uspěje"
 laamp_base_contract_schemes.3781.tt.duel_failure.agent: "Tvůj spolčenec tě zklame"
 laamp_base_contract_schemes.3781.a: "Hlavy dolů a #EMP tasit nože#!."
 laamp_base_contract_schemes.3781.b: "Ty dveře vypadají důležitě. Vyrazte je!"
 laamp_base_contract_schemes.3781.c: "Blíží se hlídka. Vezměte ji z obou stran."
 laamp_base_contract_schemes.3781.d: "Vidím uzamčenou truhlici..."
 laamp_base_contract_schemes.3781.e: "[rollee.GetFirstNameNoTooltip], co se ti podařilo najít?"
 laamp_base_contract_schemes.3781.f: "[rollee.GetFirstNameNoTooltip], opři se do toho ramenem!"
 laamp_base_contract_schemes.3781.g: "Nějaký úspěch při hledání, [rollee.GetFirstNameNoTooltip]?"
 laamp_base_contract_schemes.3781.h: "Dobrá, [rollee.GetFirstNameNoTooltip], ukaž, že si zasloužíš svůj žold."
 laamp_base_contract_schemes.3781.i: "Ještě... jen... trochu..."
 laamp_base_contract_schemes.3781.j: "Máme dost. Pryč!"
 laamp_base_contract_schemes.3781.j.stole_everything: "Pozor na pytle a jdeme!"
 laamp_base_contract_schemes.3781.j.tt.flee_with_earnings: "Vezmeš dosavadní kořist a uprchneš"
 laamp_base_contract_schemes.3782.t: "$laamp_base_contract_schemes.3041.t$ – úspěch!"
 laamp_base_contract_schemes.3782.desc.intro: "Jako stíny v noci mizíme.\n\nPrvní řev poplachu a rozhořčení k nám doléhá už jen jako vzdálená ozvěna, tlumený zvuk následků"
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_everything: "zcela zastíněný #EMP ohromnou kořistí#!, kterou máme naskládanou v klíně. Je to skutečný poklad plný lupů vhodných k prodeji překupníkům a drahých kovů."
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_most: "jejž snadno ignorujeme při pohledu na naši nádhernou kořist. Shromážděné bohatství [employer.GetPrimaryTitle.GetBaseNameNoTier], vyrvané ze síní, jimž vládne [employer.GetTitledFirstName], nám nyní leží ledabyle svázané u nohou."
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_lots: "který nás pramálo zajímá, když nám náhle spadlo do klína tolik bohatství. [employer.GetTitledFirstName] měl[Select_CString( employer.IsFemale, 'a', '' )] jistě ještě další cennosti, které jsme mohli ukořistit, ale přílišná chamtivost je první a často i poslední chybou nezkušeného zloděje.\n\nPříjemná tíha výdělku nás dostatečně obtěžkává, zatímco se v dobré náladě vracíme domů."
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_nothing: "který nám zní v uších, zatímco se zpocení vracíme na místo setkání.\n\nPřes všechny mé velkolepé řeči o dalších mincích jsme ze síní, jimž vládne [employer.GetTitledFirstName], neodnesli za podstoupené riziko ani jediný měďák navíc.\n\nDnes v noci se budeme muset spokojit s původní kořistí."
 laamp_base_contract_schemes.3782.desc.haul_amount.grabbed_some: "jenž nás varuje, že si za dodatečný výdělek možná vybereme vyšší cenu.\n\nCo se však stalo, stalo se, a za svou námahu máme slušnou hromádku stříbra, zlata a drahokamů. Dohromady by nám měla vynést pěknou sumu."
 laamp_base_contract_schemes.3782.desc.outro: "\n\nNa jednu noc to není špatné."
 laamp_base_contract_schemes.3782.a: "Heh, teď už tu kořist jen prodat..."
 laamp_base_contract_schemes.3783.t: "$laamp_base_contract_schemes.3041.t$ – neúspěch!"
 laamp_base_contract_schemes.3783.desc.intro: "Noční svět náhle ožije záplavou křiku, řevu a jekotu. Nikdy se nedozvíme, kdo spustil poplach, ale jakmile se vzchopili obránci, jimž velí [employer.GetTitledFirstName], bylo jich na nás příliš mnoho.\n\n"
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_everything: "Měli jsme všechno, #EMP úplně všechno#! cenné v celém tom zatraceném místě, kterým je [employer.Custom('FortifiedBuilding')]. Každý stříbrný talíř, každou zlatou minci, každou pozlacenou knihu, a teď je to pryč, všechno... je pryč..."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_most: "Tolik peněz, tolik #EMP kořisti#!, všechno ztraceno. Drželi jsme v rukou nashromážděné bohatství [employer.GetPrimaryTitle.GetBaseNameNoTier] a nechali jsme je jen tak... proklouznout mezi prsty..."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_lots: "Než nás chytili, nashromáždili jsme slušnou kořist. Věčná škoda... všechno to stříbro by se o město či dvě dál prodalo za znamenitou cenu..."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_nothing: "Vždyť jsme ještě ani nic neukradli."
 laamp_base_contract_schemes.3783.desc.haul_amount.grabbed_some: "Ještě jsme toho mnoho neodnesli, ale málokterý majitel při dopadení zloděje přemýšlí nad #EMP množstvím#!. Obvykle jen zvažuje, zda mu nechat useknout levou ruku, pravou, nebo obě."
 laamp_base_contract_schemes.3783.desc.outro: "\n\n[employer.GetTitledFirstName] rozzuřeně křičí, aby nás bez okolků odvlekli přímo do žaláře."
 laamp_base_contract_schemes.3783.tt.haul_lost: "O celou dodatečnou kořist přijdeš a [employer.GetTitledFirstName] ji získá zpět"
 laamp_base_contract_schemes.3783.a: "Ať jsou tyhle pekelné zdi zatraceny!"
 laamp_base_contract_schemes.3783.a.tt.a_cold_cell_awaits: "Čeká tě studená cela..."
 laamp_base_contract_schemes.5661.t: "$laamp_base_contract_schemes.5034.t$ – [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 laamp_base_contract_schemes.5661.desc.intro.constantinople: "Ocitáme se před mohutnými hradbami ctihodného města zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.plains: "Náš noční nájezd nás zavádí hluboko do plání území zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.farmlands: "Se svou družinou se prodírám hustě obdělávanou krajinou území zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.hills: "Mé síly snadno proklouznou mezi pahorky území zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.mountains: "Dnes večer stoupáme po nízkých svazích a podhůří hor v území zvaném [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.desert: "Dnes ráno vyrážíme do pouští území zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.desert_mountains: "Odhodláni nalézt #EMP cokoli#! prohledáváme s nájezdníky vyprahlé hory území zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.oasis: "Pod žhnoucím ranním sluncem se mé vojsko rozptýlí po zelené oáze v území zvaném [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.jungle: "Kryti stinnými stromy vyrážíme do džungle v území zvaném [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.forest: "Pod hustými korunami stromů v území zvaném [ROOT.Char.GetCurrentLocation.GetName] vyrážíme vpřed,"
 laamp_base_contract_schemes.5661.desc.intro.taiga: "Mé síly se rozptýlí mezi drsnými borovicemi území zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.wetlands: "V pravé poledne vstupují naši nejbystrozrací vojáci do močálů území zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.steppe: "Stejně jako v předchozích dnech pročesává mé vojsko nedozírnou step území zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.floodplains: "Jelikož nemáme příliš na výběr, musí se má družina vydat do dusných záplavových nížin území zvaného [ROOT.Char.GetCurrentLocation.GetName],"
 laamp_base_contract_schemes.5661.desc.intro.drylands: "Se svou družinou se rozptylujeme po vyprahlé krajině území zvaného [ROOT.Char.GetCurrentLocation.GetName] a víříme přitom nekonečná oblaka prachu,"
 laamp_base_contract_schemes.5661.desc.intro.postamble: "a hledáme zranitelná stáda [ROOT.Char.Custom('RegionalFarmAnimalPlural')], která bychom mohli zahnat do našeho putovního tábora."
 laamp_base_contract_schemes.5661.desc.opportunity.01: "Během nedávných výprav do tohoto kraje mi padlo do oka několik slibných cílů, ale doposud jsme prováděli pouze zběžný průzkum."
 laamp_base_contract_schemes.5661.desc.opportunity.02: "Kořist zde byla doposud poněkud skrovná a odpor příliš tuhý, než abychom dokázali ukrást významnější množství zvířat. Konečně jsme však narazili na špatně chráněné statky s početnými stády."
 laamp_base_contract_schemes.5661.desc.opportunity.03: "Tento kraj se zatím zdál poměrně snadnou obětí, přesto jsme jej ušetřili a vyčkávali, dokud nenalezneme dokonalý cíl, na němž bychom rozpoutali to nejhorší. Dnes v noci jsme objevili rozlehlé panství překypující vykrmeným skotem a náš cíl je konečně před námi."
 laamp_base_contract_schemes.5661.desc.opportunity.04: "Velkých panství je zde poskrovnu, ale menší statky v okolí působí dostatečně zámožně. Jejich vyplenění si vyžádá více námahy, konečný výnos by ji však měl stále ospravedlnit."
 laamp_base_contract_schemes.5661.desc.opportunity.05: "Místní, alespoň ti, kteří se nám odváží ukázat, tvrdí, že jsou chudí. Na jejich místě bych však tvrdil totéž, kdyby mi na dveře zaklepalo něco jako [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]. Pro naše potřeby mají každopádně stád více než dost."
 laamp_base_contract_schemes.5661.desc.opportunity.06: "Není zde místo pro lítost ani pro úvahy nad újmou, kterou těmto ubohým rolníkům způsobujeme. Buď nám vydají svá zvířata, nebo je pobijeme. Nic víc v tom není."
 laamp_base_contract_schemes.5661.desc.outro: "\n\nNyní přichází čas násilí."
 laamp_base_contract_schemes.5661.tt.encounter_tally: "#TUT Toto je [task_contract.MakeScope.Var('encounter_tally').GetValue|0]. setkání z [task_contract.MakeScope.Var('encounter_max').GetValue|0]#!"
 laamp_base_contract_schemes.5661.tt.current_successes: "#TUT Dosud máš na kontě [task_contract.MakeScope.Var('wins_tally').GetValue|0] úspěšných krádeží dobytka#!"
 laamp_base_contract_schemes.5661.tt.score_gained: "#P +1#! úspěšná krádež dobytka"
 laamp_base_contract_schemes.5661.tt.no_score_gain: "Nepodaří se ti ukrást významnější množství zvířat"
 laamp_base_contract_schemes.5661.a: "Pobijte každého hlupáka, který se nám postaví!"
 laamp_base_contract_schemes.5661.a.tt.success: "Tvá bezohlednost se vyplatí"
 laamp_base_contract_schemes.5661.a.tt.failure: "Místní se ti úspěšně postaví"
 laamp_base_contract_schemes.5661.b: "Pamatujte, držte se pohromadě a soustřeďte se na zvířata."
 laamp_base_contract_schemes.5661.b.tt.success: "Tvá kázeň se osvědčí"
 laamp_base_contract_schemes.5661.b.tt.failure: "Tvé oddíly se od sebe příliš vzdálí"
 laamp_base_contract_schemes.5661.c: "Vezměte jen ta nejlepší. Těm psům nechte průměrná."
 laamp_base_contract_schemes.5661.c.tt.success: "Ukradneš ta nejvybranější zvířata"
 laamp_base_contract_schemes.5661.c.tt.failure: "Tví nájezdníci jsou příliš vybíraví"
 laamp_base_contract_schemes.5661.d: "[officer.GetFirstNameNoTooltip], tohle... alespoň trochu spadá do tvého oboru, že?"
 laamp_base_contract_schemes.5661.d.tt.success: "$option_boilerplate.tt.officer_aptitude.success$"
 laamp_base_contract_schemes.5661.d.tt.failure: "$option_boilerplate.tt.officer_aptitude.failure$"
 laamp_base_contract_schemes.5661.e: "[officer.GetFirstNameNoTooltip], žeň ta zvířata kupředu."
 laamp_base_contract_schemes.5661.e.tt.success: "$option_boilerplate.tt.officer_aptitude.success$"
 laamp_base_contract_schemes.5661.e.tt.failure: "$option_boilerplate.tt.officer_aptitude.failure$"
 laamp_base_contract_schemes.5661.f: "[officer.GetFirstNameNoTooltip], vypusť své psy!"
 laamp_base_contract_schemes.5661.f.tt.success: "$option_boilerplate.tt.officer_aptitude.success$"
 laamp_base_contract_schemes.5661.f.tt.failure: "$option_boilerplate.tt.officer_aptitude.failure$"
 laamp_base_contract_schemes.5661.g: "[officer.GetFirstNameNoTooltip], zvládneš ta zvířata?"
 laamp_base_contract_schemes.5661.g.tt.success: "$option_boilerplate.tt.officer_aptitude.success$"
 laamp_base_contract_schemes.5661.g.tt.failure: "$option_boilerplate.tt.officer_aptitude.failure$"
 laamp_base_contract_schemes.5661.h: "Kéž bych měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] vhodného důstojníka..."
 laamp_base_contract_schemes.5661.h.tt.need_groom_hunter_kenneler_or_spoiler: "K dispozici ti není [GetCourtPositionType('head_groom_camp_officer').GetName()], [GetCourtPositionType('huntperson_camp_officer').GetName()], [GetCourtPositionType('kennelperson_camp_officer').GetName()] ani [GetCourtPositionType('master_of_spoils_camp_officer').GetName()]"
 laamp_base_contract_schemes.5661.i: "Nikdo z vás neudělá #EMP jedinou#! chybu."
 laamp_base_contract_schemes.5662.t: "$laamp_base_contract_schemes.5034.t$ – úspěch!"
 laamp_base_contract_schemes.5662.desc: "Navzdory veškerému úsilí početných pochopů, jimž velí [employer.GetTitledFirstName], získala naše družina, [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l], z potupného zajetí zpět skutečnou záplavu zvířat.\n\nMožná nám od přírody nepatří, ale co nám na tom záleží? Mečem a sekerou jsme si vzali, co jsme chtěli, a každý, kdo se nám postavil, nyní leží mrtvý na své pastvině.\n\nAť se na jejich tělech dosyta pohostí vrány."
 laamp_base_contract_schemes.5662.a: "Dnes hodujeme jako králové!"
 laamp_base_contract_schemes.5663.t: "$laamp_base_contract_schemes.5034.t$ – neúspěch!"
 laamp_base_contract_schemes.5663.desc: "Ačkoli jsme se snažili ze všech sil, vojáci, jimž velí [employer.GetTitledFirstName], nám mařili každý krok. Varování rozeslaná do odlehlých vesnic, početná stáda odvedená jinam, čerstvé hlídky a obnovené strážní věže na každém místě, kam jsme dorazili...\n\nDnes vítězí [employer.GetTitleAsNameNoTooltip]."
 laamp_base_contract_schemes.5663.a: "Pche, senilní starý hlupáku..."
 laamp_base_contract_schemes.5901.t: "$laamp_base_contract_schemes.5051.t$ – [victim.GetTitledFirstNameNoTooltip]"
 laamp_base_contract_schemes.5901.desc.intro.1: "Večerní práce je téměř u konce a se svými spolčenci zvažujeme, zda se nevrátit domů o něco dříve. Rozhodnutí za nás učiní příchod slibně vyhlížejícího cíle..."
 laamp_base_contract_schemes.5901.desc.intro.2: "Odpoledne pozvolna přechází ve večer a já potlačuji zívnutí. Zločin může dobře vynášet, ale jeho značná část spočívá v pouhém #EMP čekání#!. Okamžik, tenhle cíl vypadá slibně..."
 laamp_base_contract_schemes.5901.desc.intro.3: "Dnešní práce přinesla rozporuplnou kořist. Měšců jsme získali dost, ale jen málokterý byl zvlášť #EMP naditý#!. Podle vzhledu našeho nového cíle se to však možná brzy změní..."
 laamp_base_contract_schemes.5901.desc.intro.4: "Dnešní práce už byla velmi výnosná a několik řádných občanů laskavě věnovalo své stříbro na naši #EMP věc#!. [victim.GetTitledFirstName] možná bude dosud nejbohatší kořistí..."
 laamp_base_contract_schemes.5901.desc.intro.5: "Po téměř bezvýsledném dni, během něhož se kolem našeho loviště neobjevil ani zámožnější rolník, se na nás konečně usměje štěstí v podobě někoho očividně majetného."
 laamp_base_contract_schemes.5901.desc.victim_type.good_relation: "To je... můj [victim.Custom2('RelationToMeShort',ROOT.Char)] [victim.GetTitledFirstName]? Co si [victim.GetFirstNameNoTooltip] myslí, když se bez doprovodu potuluje těmito nebezpečnými ulicemi! Taková neopatrnost přímo vybízí k oloupení."
 laamp_base_contract_schemes.5901.desc.victim_type.bad_relation: "Ale, ale, ale, není to snad můj dávný [victim.Custom2('RelationToMeShort',ROOT.Char)] [victim.GetTitledFirstName]? A navíc bez doprovodu. Jak... #EMP příhodné#!."
 laamp_base_contract_schemes.5901.desc.victim_type.consort: "To je [victim.GetFirstName], můj #EMP [victim.Custom2('RelationToMeShort',ROOT.Char)]#!! I když už spolu nejsme, přece nemohu něco takového udělat člověku, který mi má být tak drahý?"
 laamp_base_contract_schemes.5901.desc.victim_type.family: "To není možné... [victim.GetFirstName|U], můj [victim.Custom2('RelationToMeShort',ROOT.Char)]. Bez doprovodu si bezstarostně vykračuje přímo do nebezpečí. Taková pošetilost poskvrňuje jméno rodu [ROOT.Char.GetHouse.GetName]."
 laamp_base_contract_schemes.5901.desc.victim_type.courtier: "Hmm, to #EMP vypadá#! na [victim.GetTitledFirstName] ze dvora postavy [target.GetTitledFirstName]. To však v této chvíli mnoho neznamená, když kolem nevědomky číhají [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 laamp_base_contract_schemes.5901.desc.victim_type.baron: "To je... ano, [victim.GetFirstName], [victim.GetTitleAsNameNoTooltip] z [victim.GetPrimaryTitle.GetBaseNameNoTier]! Zřejmě sem zavítal[Select_CString( victim.IsFemale, 'a', '' )] do hlavního města v osobní záležitosti. A patrně velice osobní, když cestuje bez doprovodu a volí si tak #EMP pochybné#! zkratky."
 laamp_base_contract_schemes.5901.desc.victim_type.baron_courtier: "[victim.GetFirstNameNoTooltip] mi není povědom[Select_CString( victim.IsFemale, 'á', 'ý' )], ale oděv svědčí o bohatství bez většího postavení. Snad někdo ze dvora méně významného místního vládce."
 laamp_base_contract_schemes.5901.desc.victim_type.traveller: "Oděv a nejisté vystupování jasně prozrazují, že [victim.GetFirstNameNoTooltip] nepochází z tohoto města. Nejspíš jde o krátkodobou návštěvu nebo pocestného pouze procházejícího městem."
 laamp_base_contract_schemes.5901.desc.victim_type.fallback: "Poznávám [victim.GetFirstName], [Select_CString( victim.IsFemale, 'místní hodnostářku', 'místního hodnostáře' )] s jistým majetkem a #EMP dokonale#! vhodnou kořist, třebaže možná ne tu nejbohatší."
 laamp_base_contract_schemes.5901.desc.outro.1: "Mí spolčenci se začínají vynořovat ze svých úkrytů a nedočkavě se chystají vrhnout na čerstvou kořist."
 laamp_base_contract_schemes.5901.desc.outro.2: "Stíny se nepatrně pohnou a zahalené postavy pod mým velením se připravují každým okamžikem vyrazit vpřed."
 laamp_base_contract_schemes.5901.desc.outro.3: "Téměř neslyšně se celou úzkou uličkou rozléhá zvuk dobře naolejovaných dýk vytahovaných z pochev."
 laamp_base_contract_schemes.5901.desc.outro.4: "Masky zakrývají většinu jejich tváří a odhalují pouze oči. Mí spolčenci čekají na můj signál k zahájení."
 laamp_base_contract_schemes.5901.desc.outro.5: "Stačí vydat rozkaz a ten ubohý hlupák pozná význam lítosti."
 laamp_base_contract_schemes.5901.tt.muggings_tally_and_max: "#TUT Dosud jsi provedl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [scheme.MakeScope.Var('special_muggings_tally').GetValue|0] zvláštních přepadení z možných [scheme.MakeScope.Var('special_muggings_max').GetValue|0]#!"
 laamp_base_contract_schemes.5901.tt.victim_escapes: "[victim.GetTitledFirstName] unikne"
