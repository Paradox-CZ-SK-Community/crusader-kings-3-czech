 laamp_base_contract_schemes.0661.t.preface: "Placený prostředník"
 laamp_base_contract_schemes.0661.t: "$laamp_base_contract_schemes.0661.t.preface$ – nerovné odvody"
 laamp_base_contract_schemes.0661.desc: "Zdejší problém se zdá být docela prostý. Místní na jedné straně sporu tvrdí, že musejí k vojenské službě odvádět příliš mnoho [dummy_soldier.GetWomenMen], zatímco druhá strana tvrdí pravý opak.\n\nJakmile se z nich pokusím dostat více podrobností, vše se nevyhnutelně zvrhne v křik a pozvednuté vidle. Obě strany jsou očividně ochotné navzájem se pobít kvůli sporu o to, kdo má více přispívat ke společné obraně."
 laamp_base_contract_schemes.0661.a: "Promluvme si o tom."
 laamp_base_contract_schemes.0661.b: "Takže zásobování? To půjde vyřešit."
 laamp_base_contract_schemes.0661.c: "Hmm, copak praví soupisy..."
 laamp_base_contract_schemes.0662.t: "$laamp_base_contract_schemes.0661.t.preface$ – žalobci a obvinění"
 laamp_base_contract_schemes.0662.desc: "Spor v [location.GetName] se podle všeho točí kolem skupinky drobných zločinců, která se ukrývá v divočině.\n\nObyvatelé se rozdělili asi do tuctu znepřátelených táborů a každý je #EMP přesvědčen#!, že jeden či více ostatních tajně spolupracuje s nájezdníky a poskytuje jim pomoc i útočiště.\n\nNikdo z nich není ochoten při řešení problému spolupracovat."
 laamp_base_contract_schemes.0662.a: "Tohle všechno zní jen jako zlomyslné pověsti..."
 laamp_base_contract_schemes.0662.b: "Bandité? Snadno vyřešený problém!"
 laamp_base_contract_schemes.0662.c: "Jistě poznám, kdo zde lže."
 laamp_base_contract_schemes.0662.d: "Troufám si říci, že váš problém dokážu vyřešit."
 laamp_base_contract_schemes.0663.t: "$laamp_base_contract_schemes.0661.t.preface$ – nebeské záležitosti"
 laamp_base_contract_schemes.0663.desc: "Podle toho, co se mi podařilo zjistit, dělí obyvatele [location.GetName] od vzájemného vraždění kvůli teologickému sporu tak nepatrnému, že sotva dokážou cizincům vysvětlit, proč na něm vůbec záleží, už jen #EMP malý krůček#!.\n\nNic nedokáže lidi rozvášnit tolik jako otázky víry, v dobrém i zlém. Potřebuji však, aby se zastavili, nadechli a uklidnili. Nejlépe bez krveprolití."
 laamp_base_contract_schemes.0663.a: "Zachovejme klid a vzpomeňme na své přísahy."
 laamp_base_contract_schemes.0663.b: "Mně to zní jako nepokoje. Ty dokážeme #EMP vyřešit#!."
 laamp_base_contract_schemes.0663.c: "Dovolte, abych vám všem několik věcí vysvětlil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]..."
 laamp_base_contract_schemes.0664.t: "$laamp_base_contract_schemes.0661.t.preface$ – místní krevní msta"
 laamp_base_contract_schemes.0664.desc: "Obyvatelé [location.GetName] se rozhodli vydat cestou krvežíznivosti a pomsty.\n\nNení mi jasné, co celý ten koloběh rozpoutalo. Všechny strany obviňují všechny ostatní z #EMP nejrůznějších#! vražd, krádeží a občasného žhářství, ale nyní zde nezbývá nic než zášť čekající na další prolitou krev.\n\nPro místní daňové příjmy to není právě nejlepší."
 laamp_base_contract_schemes.0664.a: "Lidé! Jste sousedé, chovejte se slušně!"
 laamp_base_contract_schemes.0664.b: "Neuklidníte-li se sami, uklidní vás síla."
 laamp_base_contract_schemes.0664.c: "Buď si podáte ruce, nebo o ně přijdete. Vyberte si."
 laamp_base_contract_schemes.0665.t: "$laamp_base_contract_schemes.0661.t.preface$ – daňové rozepře"
 laamp_base_contract_schemes.0665.desc: "Zdá se, že nějaký pošetilý hlupák nedávno přepadl několik významných místních úředníků. Nikdo neutrpěl vážnou újmu, ale než jej stačili dopadnout, utekl s křikem o daních.\n\nNetřeba dodávat, že s mým příchodem #EMP okamžitě#! vypluly na povrch všechny myslitelné malicherné křivdy a místní se v horečné snaze vyhnout společnému trestu obrátili proti sobě.\n\nJeden odvážný blázen má však alespoň dost rozumu, aby naznačil, že za tím možná stojí nedávné zvýšení daní."
 laamp_base_contract_schemes.0665.a: "Tohle skončí #EMP okamžitě#!. Rozuměli jste?"
 laamp_base_contract_schemes.0665.b: "Možná by šlo břemeno trochu zmírnit..."
 laamp_base_contract_schemes.0665.c: "Řeknete mi, kdo to udělal. Dobrovolně, či jinak."
 laamp_base_contract_schemes.0666.t: "$laamp_base_contract_schemes.0661.t.preface$ – potíže s nedoplatky"
 laamp_base_contract_schemes.0666.desc: "Z pohledu vrchnosti je nejdůležitějším příspěvkem každého společenství nejspíš pravidelná daň.\n\nJe tedy znepokojivé, že ji obyvatelé [location.GetName] nezaplatili, přinejmenším ne v plné výši.\n\nMají samozřejmě nejrůznější výmluvy a důvody, proč k tomu údajně došlo, ale ve skutečnosti jde především o spiknutí největších sídel proti bohatému městečku na vzestupu."
 laamp_base_contract_schemes.0666.a: "Jistě jde jen o nedorozumění."
 laamp_base_contract_schemes.0666.b: "Ach, myslím, že už vidím problém..."
 laamp_base_contract_schemes.0666.c: "Tato čísla mi nějak nevycházejí."
 laamp_base_contract_schemes.0667.t: "$laamp_base_contract_schemes.0661.t.preface$ – v něčí kapse"
 laamp_base_contract_schemes.0667.desc: "Každé společenství snese jistou míru krveprolití, než se do věci vloží vyšší moc. Drobná vražda, občasné loupežnictví či snad neoprávněné noční zabití cenného zvířete některého soupeře. Dokud proudí daně, místní spravedlnost si s takovými věcmi obvykle poradí.\n\nTato shovívavost však okamžitě končí, jakmile se nějaký hlupák rozhodne zatahovat do svých malicherných křivd cizí úředníky.\n\nPošetilci z [location.GetName] tuto chybu udělali a tvrdí, že místní výběrčí daní byl podplacen zapřisáhlým nepřítelem jednoho z nich. Pravda není důležitá, ale prosazení pořádku ano."
 laamp_base_contract_schemes.0667.a: "Úředníky z toho #EMP vynecháte#!."
 laamp_base_contract_schemes.0667.b: "Máte vůbec tušení, jak vysoká bude příští pokuta?"
 laamp_base_contract_schemes.0667.c: "Buď přestanete sami, nebo vás k tomu #EMP donutím#!."
 laamp_base_contract_schemes.0668.t: "$laamp_base_contract_schemes.0661.t.preface$ – mučedník všech"
 laamp_base_contract_schemes.0668.desc: "Smrt vážené místní osobnosti, jakéhosi zbožného poustevníka, vyvolala v [location.GetName] tolik nářku a skřípění zubů, že se každodenní správa zcela zastavila.\n\nZmatek pramení z toho, že chybí tělo. Několik svědků sice tvrdí, že viděli poustevníkovo poslední vydechnutí, ale mrtvola zmizela.\n\nNěkolik místních významných osobností se navzájem obviňuje z její krádeže, jiní tvrdí, že jde o božské znamení, a ti nejcyničtější nevěří celému příběhu."
 laamp_base_contract_schemes.0668.a: "Pravého [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdherentNameNoTooltip] milují všichni!"
 laamp_base_contract_schemes.0668.b: "Mrtvý? Nebo odešel podvádět jinam?"
 laamp_base_contract_schemes.0668.c: "Vaše hašteření je bezbožné."
 laamp_base_contract_schemes.0669.t: "$laamp_base_contract_schemes.0661.t.preface$ – pod něčí patou"
 laamp_base_contract_schemes.0669.desc: "Obyvatelé [location.GetName] tvrdí, že žádné potíže nemají, nevědí, proč se jejich daně opozdily, ani kdo si stěžoval jejich vládci.\n\nJen hlupák by si nevšiml strachu v jejich očích a potu na čelech. Někdo je nutí mlčet a oni se ze strachu z odvety neodvažují promluvit."
 laamp_base_contract_schemes.0669.a: "Nikdy se nebojte psance více než samotného zákona."
 laamp_base_contract_schemes.0669.b: "Já vám ukážu, co znamená strach!"
 laamp_base_contract_schemes.0669.c: "Řekněte mi, kde se ukrývají, a já to vyřeším."
 laamp_base_contract_schemes.0670.t: "$laamp_base_contract_schemes.0661.t.preface$ – krize duše"
 laamp_base_contract_schemes.0670.desc: "V [location.GetName] všichni mluví o jediném. O zvláštním místním článku [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetName], který podle všeho vzešel z primitivních teologických rozprav.\n\nPro zbožné neurozené by to bylo přijatelné, byť suchopárné téma, jenže tito pošetilci se nechali duchem rozpravy unést až příliš.\n\nUrážek každým dnem přibývá a létají stále rychleji. Je jen otázkou času, kdy jejich zaprášené teorie přivedou do ulic nože."
 laamp_base_contract_schemes.0670.a: "Prosím, nejsme snad všichni přátelé?"
 laamp_base_contract_schemes.0670.b: "Dovolte, abych vám to vysvětlil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]..."
 laamp_base_contract_schemes.0670.c: "Přestaňte. Mluvit. Nesmysly."
 laamp_base_contract_schemes.0671.t: "$laamp_base_contract_schemes.0661.t.preface$ – práce téměř hotova"
 laamp_base_contract_schemes.0671.desc: "Odvedli jsme už dost práce, abychom si zasloužili většinu odměny, kterou nám [employer.GetTitledFirstName] slíbil[Select_CString( employer.IsFemale, 'a', '' )].\n\nVyřešíme-li poslední problém, zajistíme si prémii. Pokud však věci jen zhoršíme, přijdeme o #EMP celou#! odměnu.\n\nMáme poslat zprávu, nebo ne?"
 laamp_base_contract_schemes.0671.a: "Dost dobré je dobré dost!"
 laamp_base_contract_schemes.0671.a.tt: "Odevzdáš zakázku a obdržíš běžnou odměnu"
 laamp_base_contract_schemes.0671.b: "Práce je hotová, až když je #EMP hotová#!."
 laamp_base_contract_schemes.0671.b.tt: "Podstoupíš poslední zkoušku v naději, že získáš plnou prémii – #X pokud neuspěješ, nedostaneš nic#!"
 laamp_base_contract_schemes.0781.t: "Pokušení měšce"
 laamp_base_contract_schemes.0781.desc: "Chápu, že z dlouhodobého hlediska lze získat více peněz, když je lstí vylákáš z ochotných rukou, než když je vezmeš těm neopatrným. Vím to a rozumím tomu.\n\nKdyž se však toulám dvorem postavy [target.GetTitledFirstName] a hledím na bohatství, které [target.GetSheHe] tak lehkomyslně uskladnil[Select_CString( target.IsFemale, 'a', '' )] a navíc mizerně zabezpečil[Select_CString( target.IsFemale, 'a', '' )], nemohu se ubránit úvaze, zda bychom si nemohli #EMP jen trošičku#! přivydělat jiným způsobem."
 laamp_base_contract_schemes.0781.a: "Nepochybně z toho vymámíme zálohu předem..."
 laamp_base_contract_schemes.0781.a.tt.success: "Přesvědčíš postavu [target.GetFirstNameNoTooltip] ke štědrému daru"
 laamp_base_contract_schemes.0781.a.tt.failure: "Tvá vychytralost tě zklame"
 laamp_base_contract_schemes.0781.b: "[target.GetSheHe|U] nemůže uhlídat #EMP všechno#!."
 laamp_base_contract_schemes.0781.b.tt.success: "Lepivé prsty, nadité měšce"
 laamp_base_contract_schemes.0781.b.tt.failure: "Téměř tě dopadli"
 laamp_base_contract_schemes.0781.c: "Svalit nestydatou krádež na postavu [stooge.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes.0781.c.tt.success: "Dokonalý zločin"
 laamp_base_contract_schemes.0781.c.tt.failure: "Průhledný podvod"
 laamp_base_contract_schemes.0781.d: "Hradby jistě půjde snadno přelézt?"
 laamp_base_contract_schemes.0781.d.tt.success: "Vrátíš se po setmění"
 laamp_base_contract_schemes.0781.d.tt.failure: "Stráže tě zaženou"
 laamp_base_contract_schemes.0781.e: "Zůstaňme u toho relativně poctivého."
 laamp_base_contract_schemes.0791.t: "Umění delegovat"
 laamp_base_contract_schemes.0791.desc: "[target.GetTitledFirstName] má svůj dvůr a já mám ten svůj.\n\nRozdíl spočívá v tom, že zatímco [target.GetFirstNamePossessiveNoTooltip] družiníci se spokojeně živí štědrostí svého pána, #EMP mí#! stoupenci jsou odhodláni pomoci mi trochu z onoho bohatství získat pro sebe.\n\nJá budu pracovat na naší konečné odměně a oni mezitím mohou postavu [target.GetFirstNameNoTooltip] obrat do poslední mince, dokud bude zaměstnána něčím jiným. Vždy potěší vědomí, že máš lidi, na které se můžeš spolehnout."
 laamp_base_contract_schemes.0791.tt.success: "Tvůj důstojník uspěje"
 laamp_base_contract_schemes.0791.tt.failure: "Tvůj důstojník tě zklame"
 laamp_base_contract_schemes.0791.a: "Se mnou, [second.GetFirstNameNoTooltip]. Musíme postavu [target.GetFirstNameNoTooltip] zaměstnat."
 laamp_base_contract_schemes.0791.b: "Do skladiště, [quartermaster.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.0791.c: "[armourer.GetFirstNameNoTooltip] se nejspíš dostane do zbrojnice!"
 laamp_base_contract_schemes.0791.d: "[chief_forager.GetFirstNameNoTooltip], vydej se do zahrad."
 laamp_base_contract_schemes.0791.e: "[master_thief.GetFirstNameNoTooltip] ví #EMP přesně#!, co dělat."
 laamp_base_contract_schemes.0791.f: "[head_groom.GetFirstNameNoTooltip], do stájí."
 laamp_base_contract_schemes.0791.g: "[huntperson.GetFirstNameNoTooltip] může vyplenit lovecké zámečky."
 laamp_base_contract_schemes.0791.h: "[witness.GetFirstNameNoTooltip] může šířit mou dobrou pověst, zatímco já..."
 laamp_base_contract_schemes.0791.i: "[camp_cook.GetFirstNameNoTooltip], do spižíren, #EMP honem#!."
 laamp_base_contract_schemes.0791.j: "[master_bard.GetFirstNameNoTooltip] dokáže skvěle odvést pozornost."
 laamp_base_contract_schemes.0791.k: "Dokud vinu ponese [stooge.GetFirstNameNoTooltip]..."
 laamp_base_contract_schemes.0791.l: "[master_of_spoils.GetFirstNameNoTooltip], ukořisti všechno, co není přibité."
 laamp_base_contract_schemes.0791.m: "Je to příliš riskantní. Raději ne."
 laamp_base_contract_schemes_0791_suspicious_officers_modifier: "Podezřelí důstojníci"
 laamp_base_contract_schemes_0791_suspicious_officers_modifier_desc: "Podivní příživníci a úskočné postavy v pozadí důvěryhodnosti zpravidla nepřidají."
 laamp_base_contract_schemes_0791_plentiful_horses_modifier: "Hojnost ořů"
 laamp_base_contract_schemes_0791_plentiful_horses_modifier_desc: "Ach, jak podivuhodně mnoho přebytečných jezdeckých koní!"
 laamp_base_contract_schemes.0801.t: "Pochlebování pro zisk"
 laamp_base_contract_schemes.0801.desc: "Naším konečným cílem je samozřejmě připravit postavu [target.GetTitledFirstName] o co největší bohatství tím, že ji přimějeme nám je dobrovolně vydat. Do té doby však platí, že čím lepší mínění o nás má, tím větší budou naše konečné vyhlídky.\n\nNemusíme dělat nic #EMP příliš#! okatého. Několik upřímně znějících lichotek, smích ve správnou chvíli a občasné náležitě pohoršené zalapání po dechu postačí, aby se [target.GetFirstNameNoTooltip] v naší přítomnosti cítil[Select_CString( target.IsFemale, 'a', '' )] mocně."
 laamp_base_contract_schemes.0801.a: "Dokážeme mnohem více, pokud nás bude mít v oblibě."
 laamp_base_contract_schemes.0801.a.tt.success: "Vetřeš se do přízně"
 laamp_base_contract_schemes.0801.a.tt.failure: "Musíš odejít"
 laamp_base_contract_schemes.0801.b: "Trocha společenského vlivu nemůže uškodit..."
 laamp_base_contract_schemes.0801.c: "[bard.GetFirstNameNoTooltip] se o to postará!"
 laamp_base_contract_schemes.0801.c.tt.success: "[bard.GetFirstNameNoTooltip] okouzlí postavu [target.GetFirstName]"
 laamp_base_contract_schemes.0801.c.tt.failure: "Otravný břídil"
 laamp_base_contract_schemes.0801.d: "Tohle je pod mou úroveň."
 laamp_base_contract_schemes_0801_target_good_graces_modifier: "V přízni"
 laamp_base_contract_schemes_0801_target_good_graces_modifier_desc: "Když tě mají rádi ti správní lidé, na ostatních záleží méně."
 laamp_base_contract_schemes_0801_target_irritated_modifier: "Podráždění"
 laamp_base_contract_schemes_0801_target_irritated_modifier_desc: "Někteří lidé jsou jako mouchy, které kolem tebe neustále bzučí."
 laamp_base_contract_schemes.0811.t: "Vedlejší kšeft"
 laamp_base_contract_schemes.0811.desc: "Zdá se, že [agent.GetFirstName] pracuje i na #EMP jiných#! cílech, než je ten náš s postavou [target.GetTitledFirstName].\n\nČas u dvora využívá k přípravě podvodu, kterým hodlá z postavy [target.GetFirstNameNoTooltip] vylákat slušnou částku. Mně se o tom ovšem nezmínil[Select_CString( agent.IsFemale, 'a', '' )] a já se vše dozvěděl[Select_CString( ROOT.Char.IsFemale, 'a', '' )], až když jsem zaslechl[Select_CString( ROOT.Char.IsFemale, 'a', '' )], jak se tím chlubí jednomu z táborových pomocníků."
 laamp_base_contract_schemes.0811.a: "Jak podnikavé! O zisk se samozřejmě podělíme."
 laamp_base_contract_schemes.0811.a.tt.success: "Oba si přijdete na několik mincí"
 laamp_base_contract_schemes.0811.a.tt.failure: "Zoufalí podvodníci"
 laamp_base_contract_schemes.0811.b: "Jen pokračuj."
 laamp_base_contract_schemes.0811.c.tt.success: "[agent.GetFirstNameNoTooltip] si přijde na několik mincí"
 laamp_base_contract_schemes.0811.c.tt.failure: "Zoufalý podvodník"
 laamp_base_contract_schemes.0811.c: "Přestaň, hlupáku! Ohrožuješ mou práci!"
 laamp_base_contract_schemes.1301.t: "$laamp_base_contract_schemes.1004.t$"
 laamp_base_contract_schemes.1301.desc.intro.preamble.first: "Poprvé se s postavou [recidivist.GetFirstNameNicknamed] střetneme v"
 laamp_base_contract_schemes.1301.desc.intro.preamble: "Postavu [recidivist.GetFirstNameNicknamed] dostihneme v"
 laamp_base_contract_schemes.1301.desc.intro.plains: "zvlněných pláních [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.farmlands: "úrodných polích [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.hills: "rozeklaných kopcích [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.mountains: "vysokých horách [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.desert: "spalujících pouštích [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.desert_mountains: "nemilosrdně vyprahlých horách [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.oasis: "bujné oáze v [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.jungle: "hustých džunglích [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.forest: "temných lesích [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.taiga: "rozlehlých jehličnatých lesích [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.wetlands: "páchnoucích močálech [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.steppe: "nekonečné stepi [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.floodplains: "vlhkých záplavových oblastech [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.drylands: "prašných suchopárech [current_county.GetBaseNameNoTier]."
 laamp_base_contract_schemes.1301.desc.intro.postamble: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] se rozvinou proti malé bandě ničemů, kterou si [recidivist.GetSheHe] vydržuje, a všichni napjatě očekáváme krveprolití."
 laamp_base_contract_schemes.1301.desc.encounters.first.relation.good: "„[ROOT.Char.GetFirstNameNoTooltip], můj [recidivist.Custom2('RelationToMeShort',ROOT.Char)],“ prolomí [recidivist.GetFirstNameNoTooltip] ticho. „Tebe... jsem nečekal[Select_CString( recidivist.IsFemale, 'a', '' )]. Ze všech lidí, kteří po mně mohli přijít, zrovna někdo tak drahý...“"
 laamp_base_contract_schemes.1301.desc.encounters.first.relation.bad: "„Á, [ROOT.Char.GetFirstNameNoTooltip], který jiný hlupák s hlavou plnou hnoje by se za mnou hnal tak dychtivě?“ začne [recidivist.GetFirstNameNoTooltip] a vykročí vpřed. „Popravdě se mi ulevilo. Zabíjet většinu [ROOT.Char.GetWomenMen] je nuda, ale rozpárat tebe bude #EMP potěšení#!.“"
 laamp_base_contract_schemes.1301.desc.encounters.first.family: "„[ROOT.Char.GetFirstNameNoTooltip], můj [recidivist.Custom2('RelationToMeShort',ROOT.Char)], má vlastní krev. Proč mě pronásleduješ až sem? Doufáš, že pomstíš urážky, kterými jsem poskvrnil[Select_CString( recidivist.IsFemale, 'a', '' )] jméno rodu [ROOT.Char.GetHouse.GetName]?“"
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.angry: "„Ty ufňukaný, nevědomý čokle!“ vyštěkne [recidivist.GetFirstNameNoTooltip]. „Přišel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsi sem plnit vůli postavy [employer.GetTitledFirstName], že ano? Tak pojď, pse. Postav se mi a dokaž, že nejsi nic víc než uštěkaný psík!“"
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.haughty: "„Nuže, podívejme se... Ach, #EMP tady [ROOT.Char.GetSheHe] je#!,“ zahřmí [recidivist.GetFirstNameNoTooltip] a lokty si razí cestu do čela zástupu. „Ztracený[Select_CString( ROOT.Char.IsFemale, 'á', '' )] [ROOT.Char.GetLadyLord], který[Select_CString( ROOT.Char.IsFemale, 'á', '' )] si myslí, že mě srazí na kolena! Tak pojď, [ROOT.Char.GetFirstNameNoTooltip]! Tady mě máš!“"
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.doleful: "„Kéž bychom se nesetkali za tak neblahých okolností, [ROOT.Char.GetFirstNameNoTooltip], neboť proti tobě nic nemám,“ povzdechne si [recidivist.GetFirstNameNoTooltip]. „Obávám se však, že hodláš svou povinnost splnit až do hořkého konce.“"
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.merry: "„Ha!“ zasměje se [recidivist.GetFirstNameNoTooltip]. „To je všechno, co sis přivedl[Select_CString( ROOT.Char.IsFemale, 'a', '' )]? Výtečně, #EMP výtečně#!. Konečně trochu pořádné zábavy! A dokonce jsi přišel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] osobně. S chutí tě zarazím do země, [ROOT.Char.GetFirstNameNoTooltip].“"
 laamp_base_contract_schemes.1301.desc.encounters.first.general_reaction.taciturn: "„Hmm,“ zamumlá [recidivist.GetFirstNameNoTooltip] a pohladí si bradu. „Upřímně... čekal[Select_CString( recidivist.IsFemale, 'a', '' )] jsem víc. Rozpočet dobrého [employer.GetTitleAsNamePossessive] zjevně strádá. Tak tedy začneme?“"
 laamp_base_contract_schemes.1301.desc.encounters.second: "„Tak brzy zase zpátky, [ROOT.Char.GetFirstNameNoTooltip]? Po našem posledním setkání jsem si myslel[Select_CString( recidivist.IsFemale, 'a', '' )], že ses poučil[Select_CString( ROOT.Char.IsFemale, 'a', '' )], ale zdá se, že ti tu lekci budeme muset vštípit po zlém.“"
 laamp_base_contract_schemes.1301.desc.encounters.third: "„Ať je tvá pekelná vytrvalost prokleta, [ROOT.Char.GetFirstNameNoTooltip]. Přestaneš nás už konečně štvát? Najdi si práci někde jinde, protože z naší krve žádné stříbro nevytěžíš!“"
 laamp_base_contract_schemes.1301.desc.outro.1: "Okamžik balancuje na ostří nože. Pokud nezasáhnu já, udělá to někdo jiný a všechno se mi zcela vymkne z rukou."
 laamp_base_contract_schemes.1301.desc.outro.2: "[recidivist.GetFirstNamePossessiveNoTooltip] skupina je zjevně v početní nevýhodě, přesto působí odhodlaně. Její členové jsou připraveni bránit svého vůdce, nebo při tom zemřít."
 laamp_base_contract_schemes.1301.desc.outro.3: "Na shromážděná vojska padne hrozivé ticho. Nikdo se neodvažuje prolomit je ze strachu z toho, co by následovalo."
 laamp_base_contract_schemes.1301.desc.outro.4: "Oba zástupy čekají se zatajeným dechem, nejisté tím, co řeknu, a proti vší naději doufají, že to nebude rozkaz k zabíjení."
 laamp_base_contract_schemes.1301.desc.outro.5: "[recidivist.GetFirstNameNoTooltip] zde nemůže zvítězit a [recidivist.GetSheHe] to ví, alespoň ne v otevřeném boji. Pokud se však dokáže dostat z mého dosahu..."
 laamp_base_contract_schemes.1301.tt.insta_win: "#P +2#! vítězné body a okamžitý výsledek $label_success_standard$"
 laamp_base_contract_schemes.1301.tt.score_increased: "#P +1#! vítězný bod"
 laamp_base_contract_schemes.1301.tt.success_score_and_threshold: "#TUT Máš [task_contract.MakeScope.Var('wins_tally').GetValue|0] ze 2 vítězných bodů potřebných pro výsledek $label_success_standard$#!"
 laamp_base_contract_schemes.1301.tt.chances_remaining: "#TUT Toto je [task_contract.MakeScope.Var('encounters_tally').GetValue|0]. z nejvýše 3 střetnutí#!"
 laamp_base_contract_schemes.1301.a: "Do toho, ty [recidivist.Custom2('InsultNoun', ROOT.Char)]!"
 laamp_base_contract_schemes.1301.a.tt.duel_begins: "#X @warning_icon! Okamžitě se utkáš s postavou [recidivist.GetFirstName] v souboji na [Concept('character_death_death','smrt')|E]#!"
 laamp_base_contract_schemes.1301.b: "Stráže, srazte [Select_CString( recidivist.IsFemale, 'ji', 'ho' )] k zemi!"
 laamp_base_contract_schemes_1301.b.tt.success_crit: "[recidivist.GetHerHis|U] válečná družina je zničena"
 laamp_base_contract_schemes_1301.b.tt.success: "[recidivist.GetHerHis|U] válečná družina je zdecimována"
 laamp_base_contract_schemes_1301.b.tt.failure: "[recidivist.GetFirstNameNoTooltip] unikne oprátce"
 laamp_base_contract_schemes.1301.b.tt.failure.tt: "[recidivist.GetFirstName] unikne"
 laamp_base_contract_schemes.1301.c: "Dej znamení záloze, aby zaútočila zezadu."
 laamp_base_contract_schemes_1301.c.tt.success_crit: "Rozprášíš celé vojsko postavy [recidivist.GetFirstNameNoTooltip]"
 laamp_base_contract_schemes_1301.c.tt.success: "Dobrá strategie zvítězí"
 laamp_base_contract_schemes_1301.c.tt.failure: "$laamp_base_contract_schemes_1301.b.tt.failure$"
 laamp_base_contract_schemes.1301.d: "Nech vojsko tyto bandity převálcovat."
 laamp_base_contract_schemes.1301.d.tt.not_enough_troops: "Potřebuješ alespoň [EmptyScope.ScriptValue('laamp_base_contract_schemes_1301_min_troops_value')|0] [Concept('men_at_arms','ozbrojenců')|E]"
 laamp_base_contract_schemes.1301.e: "Víš, [recidivist.GetWomanMan] pevné vůle má můj obdiv..."
 laamp_base_contract_schemes.1301.e.tt.success: "[recidivist.GetFirstNameNoTooltip] se přidá k [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]"
 laamp_base_contract_schemes.1301.e.tt.failure: "[recidivist.GetFirstNameNoTooltip] s tebou nechce mít nic společného"
 laamp_base_contract_schemes.1301.e.tt.failure.tt: "[recidivist.GetSheHe|U] využije tvého otálení k útěku"
 laamp_base_contract_schemes.1301.f: "Víš, [recidivist.GetWomanMan|l] tvého ražení by se mi hodil[Select_CString( recidivist.IsFemale, 'a', '' )]..."
 laamp_base_contract_schemes.1302.t: "$laamp_base_contract_schemes.1004.t$ – úspěch!"
 laamp_base_contract_schemes.1302.desc.intro: "Hodím uťatou hlavu postavy [recidivist.GetFirstNameNicknamed] k nohám zmocněnce postavy [employer.GetTitledFirstName] a rudofialová masa vedle něj s mokrým plesknutím dopadne na zem.\n\n"
 laamp_base_contract_schemes.1302.desc.method.prowess_sce: "„Tys [recidivist.GetHerHim] zabil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] v osobním souboji? Jak #EMP divoké#!,“"
 laamp_base_contract_schemes.1302.desc.method.prowess_non_sce: "„Bylo rozumné nechat stráže, aby [recidivist.GetHerHim] rozsekaly, [ROOT.Char.Custom('FormOfAddressForLiege')]. Kdo ví, co by se stalo, kdyby se [recidivist.GetSheHe] dostal[Select_CString( recidivist.IsFemale, 'a', '' )] blíž?“"
 laamp_base_contract_schemes.1302.desc.method.martial: "„Mistrovský tah, zbavit se té stvůry bez vážnějších ztrát, [ROOT.Char.Custom('FormOfAddressForLiege')]. Pochybuji, že by něco takového dokázal vymyslet jen tak někdo,“"
 laamp_base_contract_schemes.1302.desc.method.meat: "„Bylo velmi moudré nechat vojsko, aby se o tu špínu postaralo, [ROOT.Char.GetLadyLord]. [recidivist.GetSheHe|U] byl[Select_CString( recidivist.IsFemale, 'a', '' )] příliš vychytral[Select_CString( recidivist.IsFemale, 'á', 'ý' )], než aby mohl[Select_CString( recidivist.IsFemale, 'a', '' )] dostat sebemenší příležitost k útěku,“"
 laamp_base_contract_schemes.1302.desc.outro: "poznamená [employer.GetTitleAsNamePossessiveNoTooltip] služebník a zároveň nám opatrně předá odměnu.\n\nNa jeho slovech příliš nezáleží, ale lahodná tíha naditého měšce plného stříbra činí naši malou štvanici více než výnosnou."
 laamp_base_contract_schemes.1302.a: "Dobře odvedená práce."
 laamp_base_contract_schemes.1302.a.tt: "$laamp_base_contract_schemes.0000.f.contract_concluded$"
 laamp_base_contract_schemes.1303.t: "$laamp_base_contract_schemes.1004.t$ – neúspěch!"
 laamp_base_contract_schemes.1303.desc.intro: "Tím se postavě [recidivist.GetFirstNameNicknamed] konečně podaří setřást naše pronásledování,"
 laamp_base_contract_schemes.1303.desc.method.prowess_non_sce: "navzdory veškerému úsilí mých stráží, které se [recidivist.GetHerHim] pokoušejí zadržet."
 laamp_base_contract_schemes.1303.desc.method.martial: "když prorazí přímo skrze léčku a hbitě uprchne."
 laamp_base_contract_schemes.1303.desc.method.diplo_bandit: "když nenápadně uprchne pod záminkou, že zvažuje připojení své bandy k nám, [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')]."
 laamp_base_contract_schemes.1303.desc.method.diplo_non_bandit: "když vyklouzne pod záminkou, že si potřebuje promyslet mou velkorysou nabídku."
 laamp_base_contract_schemes.1303.desc.outro: "Když mě dostihnou zmocněnci postavy [employer.GetTitledFirstName], jsou zklamaní, ale sotva překvapení. Přestože projevují pochopení, bez hlavy k odevzdání pro [employer.Custom('MistressMaster')] nám odměnu rozhodně vyplatit nehodlají."
 laamp_base_contract_schemes.1303.a: "Ať jde ten lidský vřed k čertu!"
 laamp_base_contract_schemes.1303.a.tt: "$laamp_base_contract_schemes.0000.f.contract_concluded$"
 laamp_base_contract_schemes.1304.t: "$laamp_base_contract_schemes.1004.t$ – zvláštní neúspěch!"
 laamp_base_contract_schemes.1304.desc: "[recidivist.GetFirstNameNicknamed] reaguje na mou nabídku... překvapivě příznivě. Jakmile se dáme do řeči, podaří se mi [recidivist.GetHerHim] přesvědčit nejen o upřímnosti mých úmyslů, ale také o tom, že mohu nabídnout lepší a světlejší budoucnost jak [recidivist.GetHerHim], tak celé tamní bandě.\n\nVšichni se proto přidali k [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l].\n\n[employer.GetTitledFirstName] mi samozřejmě nemusí odpustit, že jsem zradil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] projevenou důvěru, ale nakonec jsem problém vyřešil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] po svém, nebo snad ne?"
 laamp_base_contract_schemes.1304.a: "[employer.GetFirstNameNoTooltip] se může jít třeba oběsit."
 laamp_base_contract_schemes.1304.a.tt: "$laamp_base_contract_schemes.0000.f.contract_concluded$"
 laamp_base_contract_schemes.1782.t: "$laamp_base_contract_schemes.1041.t$ – [victim.GetTitledFirstNameNoTooltip]"
 laamp_base_contract_schemes.1782.desc.intro.1: "Dnes ráno zahlédneme v dálce dlouhý zástup lidí –"
 laamp_base_contract_schemes.1782.desc.intro.2: "Několik hodin před západem slunce narazíme na skupinu pocestných –"
 laamp_base_contract_schemes.1782.desc.intro.3: "Kolem poledne dostihneme karavanu, kterou už několik dní sledujeme –"
 laamp_base_contract_schemes.1782.desc.intro.4: "Krátce po úsvitu se na obzoru objeví malá skupinka pocestných –"
 laamp_base_contract_schemes.1782.desc.intro.5: "Těsně před soumrakem se začneme přibližovat k zadní části dlouhého zástupu –"
 laamp_base_contract_schemes.1782.desc.connection.negative: "zdá se, že je vede [victim.GetTitledFirstName], můj [victim.Custom2('RelationToMeShort',ROOT.Char)]."
 laamp_base_contract_schemes.1782.desc.connection.positive: "vede je [victim.GetTitledFirstName], můj [victim.Custom2('RelationToMeShort',ROOT.Char)], kterému bych nerad[Select_CString( ROOT.Char.IsFemale, 'a', '' )] ublížil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]."
 laamp_base_contract_schemes.1782.desc.connection.family_or_consort: "podle všeho je nevede nikdo jiný než [victim.GetTitledFirstName], můj [victim.Custom2('RelationToMeShort',ROOT.Char)]!"
 laamp_base_contract_schemes.1782.desc.connection.none: "v jejich čele podle mých zvědů stojí [victim.GetTitledFirstName] a vede ostatní po jejich klikaté cestě."
 laamp_base_contract_schemes.1782.desc.victim_type.pool: "Podle vzhledu nejsou ničím víc než potulnými pocestnými. Jejich jediným bohatstvím je to, co unesou, a dary, které jim může vynést jejich dobré jméno."
 laamp_base_contract_schemes.1782.desc.victim_type.baron: "S postavou [victim.GetTitleAsNameNoTooltip] v čele skupina očividně #EMP nějaké#! bohatství má, ale mincemi zrovna neoplývá. Přesto by mohla být hodnotnou kořistí, pokud se pro ni rozhodneme."
 laamp_base_contract_schemes.1782.desc.victim_type.travelling_ruler: "Skupinu vede [Select_CString( victim.IsFemale, 'vznešená', 'vznešený' )] [victim.GetTitleAsNameNoTooltip], [Select_CString( victim.IsFemale, 'cestující', 'cestující' )] mimo [victim.GetHerHis] [victim.Custom('FortifiedBuilding')]. Naštěstí ji doprovází mnohem méně stráží, než by se u někoho [victim.GetFirstNamePossessiveNoTooltip] postavení dalo očekávat. Tato skupina má #EMP nepochybně#! spoustu bohatství, kterého se můžeme zmocnit."
 laamp_base_contract_schemes.1782.desc.victim_type.travelling_nobody: "Skupina postrádá jak přepychové odznaky vlády, tak ošlehanou houževnatost skutečných tuláků, a zdá se proto být... na cestu velmi špatně připravená. Kolik mincí vůbec mají, může jen hádat."
 laamp_base_contract_schemes.1782.desc.victim_type.laamp: "Je naprosto zřejmé, že jde stejně jako v našem případě o dobrodružnou družinu, která hledá nové místo k přenocování. Mohou být bohatší než králové nebo chudší než rolníci, což je stav, který sami známe až příliš dobře."
 laamp_base_contract_schemes.1782.desc.victim_type.fallback: "Ačkoli [victim.GetWomanMan] v čele skupiny nosí jemnější oděv než většina ostatních, je zřejmé, že [victim.GetSheHe] nakonec není nikým významným. Mince, které má [victim.GetSheHe] u sebe, nejspíš představují veškeré [victim.GetHerHis] bohatství."
 laamp_base_contract_schemes.1782.desc.outro: "[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] už jen čekají na můj signál k útoku."
 laamp_base_contract_schemes.1782.tt.victim_escapes: "[victim.GetTitledFirstNameNoTooltip] v nastalém chaosu unikne"
 laamp_base_contract_schemes.1782.a: "Na ty hlupáky!"
 laamp_base_contract_schemes.1782.a.tt.success: "Rozprášíš zástup a ukořistíš jeho zavazadla"
 laamp_base_contract_schemes.1782.a.tt.failure: "$laamp_base_contract_schemes.1782.c.tt.failure$"
 laamp_base_contract_schemes.1782.b: "Obkličte je a uvidíme, kolik zaplatí."
 laamp_base_contract_schemes.1782.b.tt.success: "Přelstění pocestní se vzdají"
 laamp_base_contract_schemes.1782.b.tt.failure: "$laamp_base_contract_schemes.1782.c.tt.failure$"
 laamp_base_contract_schemes.1782.c: "Zadržte, zaútočíme po setmění..."
 laamp_base_contract_schemes.1782.c.tt.easier_against_most_but_less_rewards: "#TUT Tento postup je obvykle snazší, ale přinese méně [Concept('gold','zlata')|E]#!"
 laamp_base_contract_schemes.1782.c.tt.success: "Úspěšná léčka"
 laamp_base_contract_schemes.1782.c.tt.failure: "Tvé vojsko nic nezmůže"
 laamp_base_contract_schemes.1782.d: "Tyhle necháme na pokoji."
 laamp_base_contract_schemes.1782.d.tt: "Vzdáš se příležitosti připravit postavu [victim.GetTitledFirstName] o její bohatství"
 laamp_base_contract_schemes.1783.t: "$laamp_base_contract_schemes.1041.t$ – úspěch!"
 laamp_base_contract_schemes.1783.desc: "Kdo tvrdí, že je cestování namáhavé, obtížné a nebezpečné?\n\nZ pohledu [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive|l] se zdá být docela snadným a poměrně výnosným počínáním. Se sedlovými brašnami obtíženými mincemi dorazíme s radostí, byť i s jistou ostražitostí, do [destination_2.GetBaseNameNoTier]. Náladu máme výbornou a měšce nadité.\n\nDoufejme jen, že nás žádná z našich obětí nedostihne dříve, než odjedeme."
 laamp_base_contract_schemes.1783.a: "Cesty jsou vskutku pramenem veškerého bohatství..."
 laamp_base_contract_schemes.1784.t: "$laamp_base_contract_schemes.1041.t$ – neúspěch!"
 laamp_base_contract_schemes.1784.desc: "Běda, někdy se [ROOT.Char.GetWomanMan] dočká úsměvu božstva [ROOT.Char.GetFaith.FateGodName] a jindy [ROOT.Char.GetFaith.FateGodSheHe] svou přízeň neprojeví.\n\nDnes jsme si zjevně přízeň osudu nezasloužili, protože [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] během celého tohoto podniku nezískali jedinou lesklou minci.\n\nNaše cesta je u konce, a tak nám nezbývá než přiznat neúspěch a pokračovat dál."
 laamp_base_contract_schemes.1784.a: "Tehdy se všechno zdálo tak snadné..."
