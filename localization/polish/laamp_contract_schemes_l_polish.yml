 protect_minority_vassal_contract_diplomacy_scheme_desc_success: "$protect_minority_vassal_contract_scheme_desc_success_boilerplate$"
 protect_minority_vassal_contract_martial_scheme: "Taktika zastrašování"
 protect_minority_vassal_contract_martial_scheme_action: "Použít zastrašování proti"
 protect_minority_vassal_contract_martial_scheme_desc: "$protect_minority_vassal_contract_scheme_desc_generic$ Hrozivá ukázka síly přiměje lenního pána mého [Concept('contractor','zadavatele')|E], aby peticím vyhověl.$laamp_contract_scheme_desc_general_boilerplate$"
 protect_minority_vassal_contract_martial_scheme_desc_general: "$protect_minority_vassal_contract_martial_scheme_desc$"
 protect_minority_vassal_contract_martial_scheme_desc_success: "$protect_minority_vassal_contract_scheme_desc_success_boilerplate$"
 protect_minority_vassal_contract_intrigue_scheme: "Využití informací"
 protect_minority_vassal_contract_intrigue_scheme_action: "Využít informace proti"
 protect_minority_vassal_contract_intrigue_scheme_desc: "$protect_minority_vassal_contract_scheme_desc_generic$ Zranitelní nejsou pouze slabí. Mocní mají #EMP vždy#! slabiny, které lze využít ve prospěch jiných...$laamp_contract_scheme_desc_general_boilerplate$"
 protect_minority_vassal_contract_intrigue_scheme_desc_general: "$protect_minority_vassal_contract_intrigue_scheme_desc$"
 protect_minority_vassal_contract_intrigue_scheme_desc_success: "$protect_minority_vassal_contract_scheme_desc_success_boilerplate$"
 protect_minority_vassal_contract_learning_scheme: "Výklad práva"
 protect_minority_vassal_contract_learning_scheme_action: "Uplatnit výklad práva vůči"
 protect_minority_vassal_contract_learning_scheme_desc: "$protect_minority_vassal_contract_scheme_desc_generic$ Tato [Concept('scheme','intrika')|E] pátrá po právních precedentech, jejichž uplatněním lze chránit utlačované poddané před krutými pány.$laamp_contract_scheme_desc_general_boilerplate$"
 protect_minority_vassal_contract_learning_scheme_desc_general: "$protect_minority_vassal_contract_learning_scheme_desc$"
