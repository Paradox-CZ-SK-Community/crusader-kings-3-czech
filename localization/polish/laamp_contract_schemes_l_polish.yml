 laamp_base_contract_schemes.2014.b: "$travel.mobile_domicile.option.t$"
 laamp_base_contract_schemes.2301.t: "$laamp_base_contract_schemes.2004.t$ – městské brány"
 laamp_base_contract_schemes.2301.desc.intro: "„[ROOT.Char.GetTitledFirstNameNoTooltip], vítej!“ zvolá [person_a.GetTitledFirstName], když se svou družinou vstoupím do města, které této postavě náleží."
 laamp_base_contract_schemes.2301.desc.intro.has_quartermaster: "Hned za mnou kráčí [quartermaster.GetFirstName], [GetCourtPositionType('quartermaster_camp_officer').GetName()] mého tábora, ostražitě připraven[Select_CString( quartermaster.IsFemale, 'á', 'ý' )] pomoci."
 laamp_base_contract_schemes.2301.desc.midtro: "\n\nZanedlouho mě představí dalším městským hodnostářům, kterými jsou [person_b.GetFirstName], [person_c.GetFirstName] a [person_d.GetFirstName].\n\n„Jsme si #EMP jisti#!, že s námi budete souhlasit"
 laamp_base_contract_schemes.2301.desc.liar.honest_or_good: "v tom, že si zkrátka nemůžeme dovolit dodatečné poplatky, které na nás chce uvalit náš lenní pán, [person_a.GetLadyLord] [person_a.GetTitledFirstName],“ protáhne [person_a.GetFirstNameNoTooltip].\n\nMluví plynule a vyrovnaně. Tak může znít poctivý člověk, ale také velmi zkušený lhář."
 laamp_base_contract_schemes.2301.desc.liar.not_lying: "když protestujeme proti této nespravedlivé dani. Jsme jen prostí měšťané a postavě [employer.GetTitledFirstName] jsme již dávno odevzdali vše, co jsme mohli.“\n\nMožná je to pravda, možná ne. Brzy se ukáže."
 laamp_base_contract_schemes.2301.desc.liar.poor_liar_lying: "k-když říkáme, že bychom před postavou [employer.GetTitledFirstName] zkrátka n-nemohli, ba #EMP nechtěli#! cokoli skrývat!“ blábolí [person_a.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.2301.desc.liar.other_liars_lying: "$laamp_base_contract_schemes.2301.desc.liar.not_lying$"
