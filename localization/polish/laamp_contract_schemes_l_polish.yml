 laamp_base_contract_schemes.2014.tt.explanation: "#TUT K dokončení [Concept('task_contract','zakázky')|E]:\n$EFFECT_LIST_BULLET$V každém cíli uspěj ve zkoušce [Concept('stewardship','správcovské dovednosti')|E], [Concept('intrigue','pletichářské dovednosti')|E] nebo [Concept('aptitude','způsobilosti')|E] postavy ve funkci [GetCourtPositionType('quartermaster_camp_officer').GetName()]\n$EFFECT_LIST_BULLET$Vyhraj každou zkoušku a dosáhneš výsledku $label_success_critical$\n$EFFECT_LIST_BULLET$Pokud budeš prověřovat pouze [Concept('stewardship','správcovskou dovednost')|E] nebo postavu ve funkci [GetCourtPositionType('quartermaster_camp_officer').GetName()], můžeš až dvakrát neuspět a přesto dosáhnout výsledku $label_success_standard$, pokud vyhraješ alespoň polovinu zkoušek\n$EFFECT_LIST_BULLET$Pokud podstoupíš zkoušku [Concept('intrigue','pletichářské dovednosti')|E] nebo výsledky jednoduše a bez námahy zfalšuješ, můžeš neuspět pouze jednou a stále dosáhnout výsledku $label_success_standard$. Pokud však neuspěješ, dosáhneš výsledku $label_failure_critical$#!"
