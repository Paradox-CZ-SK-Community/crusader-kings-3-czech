 laamp_base_contract_schemes.0000.generic_option.speed: "Čím dřív skončíme, tím dřív budeme zpátky na cestě!"
 laamp_base_contract_schemes.0000.generic_option.progress: "Tohle by mělo být snadné..."
 laamp_base_contract_schemes.0000.generic_option.secrecy: "Ať #EMP nikdo#! z vás nic nepokazí."
 laamp_base_contract_schemes.0000.generic_option.nothing: "Prostě se dejme do práce."
