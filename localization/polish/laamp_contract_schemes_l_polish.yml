 protect_minority_vassal_contract_diplomacy_scheme_desc: "$protect_minority_vassal_contract_scheme_desc_generic$ Přátelský dialog podpoří vzájemné porozumění a pomůže nám překonat i ty nejzapeklitější otázky.$laamp_contract_scheme_desc_general_boilerplate$"
