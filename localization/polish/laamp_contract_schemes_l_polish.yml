 laamp_base_contract_schemes.2671.e.officer_unexists: "$laamp_base_contract_schemes.2661.e.officer_unexists$"
 laamp_base_contract_schemes.2671.f: "Kde jsou podle vás hradby... #EMP nejslabší#!?"
 laamp_base_contract_schemes.2671.g: "$laamp_base_contract_schemes.2661.g$"
 laamp_base_2071_success_employer_modifier: "Zpevněné hradby"
 laamp_base_2071_success_employer_modifier_desc: "Významná zdejší osada nedávno věnovala čas opětovnému opevnění svých hradeb."
 laamp_base_2071_failure_employer_modifier: "Zpackaná oprava"
 laamp_base_2071_failure_employer_modifier_desc: "Hradby významné osady v tomto hrabství zpustly a při pokusu o opravu byly navíc ještě více poškozeny."
 laamp_base_contract_schemes.2672.t: "$laamp_base_contract_schemes.2031.t$ – úspěch!"
 laamp_base_contract_schemes.2672.desc.resolution_type.stewardship: "Několik drobných výjimek, tu úleva, onde povolení s pečetí postavy [employer.GetTitleAsNameNoTooltip], a všichni jsou náhle #EMP mnohem#! ochotnější přijmout lehký mimořádný odvod na opravu hradeb.\n\nNevadí, že po přesunutí jejich daní a povinností nakonec zaplatí stejnou částku, jaká po nich byla původně požadována. Nyní je nejdůležitější, aby dobří lidé z [employer.GetPrimaryTitle.GetBaseNameNoTier] měli pocit, že v této hře obstáli."
 laamp_base_contract_schemes.2672.desc.resolution_type.secondary_skill: "Dobří lidé z [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] se zastydí a můj příklad je přiměje k činu, takže se s pomocí několika stoupenců z [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] společně pustíme do opravy jejich opevnění.\n\nNaštěstí hradby vypadají podstatně hůře, než na tom ve skutečnosti jsou. Dosáhneme značného pokroku a stojí nás to jen několik dní práce, které snadno vyváží menší odměna."
 laamp_base_contract_schemes.2672.desc.resolution_type.left_sacrifice: "Už nyní zjevně unaven[Select_CString( sacrifice.IsFemale, 'á', 'ý' )] [sacrifice.GetTitledFirstName] se snaží usměrnit hádající se obyvatele [employer.GetPrimaryTitle.GetBaseNameNoTier], když s postavou [employer.GetTitledFirstName] opouštíme místnost.\n\n„Neměj obavy, [ROOT.Char.GetTitledFirstNameNoTooltip]. O tvého [sacrifice.GetWomanMan] se dobře postaráme a vrátíme ti [sacrifice.GetHerHim] vcelku.“\n\nVždyť jde jen o skládání několika kamenů na sebe. Jak těžké to může být? Vděčně přijmu odměnu a vydám se k odchodu."
 laamp_base_contract_schemes.2672.desc.resolution_type.officer: "[officer.GetTiledFirstNamePossessive|U] postavení mého $head_porter_camp_officer$"
 laamp_base_contract_schemes.2672.desc.resolution_type.camp_purpose: "Město [employer.GetPrimaryTitle.GetBaseNameNoTier] hoří.\n\nTedy jeho většina. Nikoli části, které mí stoupenci odnášejí do tábora [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]. Ty zůstanou v mém opatrování #EMP pěkně v bezpečí#!.\n\nBylo ode mě čestné vyplenit osadu, která mě požádala o pomoc, jen proto, že jsem mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )]? Patrně ne.\n\nTím větší jsou však hlupáci, když nabídli takovou odměnu někomu, koho vůbec neznají..."
 laamp_base_contract_schemes.2672.desc.resolution_type.stress: "Přinutit obyvatele [employer.GetPrimaryTitle.GetBaseNameNoTier] k poslušnosti vyžaduje vydatnou směs křiku, přemlouvání a vyvolávání pocitu viny.\n\nJe to únavná a vyčerpávající práce, která doléhá na mysl, ale místní hodnostáři se jeden po druhém podvolí a s hořkostí souhlasí, že zaplatí svůj spravedlivý díl. Možná to není elegantní řešení, ale když funguje, tak funguje."
 laamp_base_contract_schemes.2672.desc.outro: "\n\n[employer.GetTitledFirstName] je s naším řešením dostatečně spokojen[Select_CString( employer.IsFemale, 'á', 'ý' )] a ochotně nám předá odměnu."
 laamp_base_contract_schemes.2672.a: "$laamp_base_contract_schemes.2662.a$"
 laamp_base_contract_schemes.2672.a.city_sacked: "Kupující, měj se na pozoru."
 laamp_base_contract_schemes.2673.t: "$laamp_base_contract_schemes.2031.t$ – neúspěch!"
 laamp_base_contract_schemes.2673.desc.stewardship: "Můj plán mi připadal dostatečně rozumný. Náklady nejprve rovnoměrně rozdělit mezi místní a poté je trochu upravit podle majetku a příjmů. Hodnostáři však reagovali zděšením a hrůzou.\n\nKaždý z nich byl nějakým způsobem přesvědčen, že platí příliš mnoho, dokonce i za toto společné dobro, bez ohledu na své bohatství či postavení."
 laamp_base_contract_schemes.2673.desc.officer: "Možná [officer.GetTitledFirstName] není tak znamenitý[Select_CString( officer.IsFemale, 'á', 'ý' )] $head_porter_camp_officer$, jak jsem si představoval[Select_CString( ROOT.Char.IsFemale, 'a', '' )].\n\nNeuplyne ani půl hodiny od chvíle, kdy [officer.GetSheHe] předloží návrh na obnovu hradeb, a obyvatelé [employer.GetPrimaryTitle.GetBaseNameNoTier] si již jdou po krku. Křičí, ječí, kopou a koušou, zcela #EMP zoufalí#! ve snaze vyhnout se úkolu, který před nimi stojí."
 laamp_base_contract_schemes.2673.desc.outro: "\n\nZdrcen[Select_CString( employer.IsFemale, 'á', 'ý' )] [employer.GetTitledFirstName] se mnou po tomto fiasku odmítne byť jen promluvit.\n\nVyženou nás z města a za naši námahu nedostaneme jedinou minci."
 laamp_base_contract_schemes.2673.a: "$laamp_base_contract_schemes.2663.a$"
 laamp_base_contract_schemes.2676.t: "$laamp_base_contract_schemes.2031.t$ – výhodné pastviny"
 laamp_base_contract_schemes.2676.desc: "Ulice [employer.GetPrimaryTitle.GetBaseNameNoTier] zachvátila horečka klepů a pohoršení. Spletitá záležitost nepovedeného sňatku, dědictví a obchodních dohod způsobila, že rozsáhlý díl nejlepší zdejší půdy pro pastvu koní připadl jakémusi hlupákovi bez peněz i schopností.\n\nMístní hodnostáři nyní hrozí, že se navzájem rozsápou kvůli tomu, jak a mezi koho půdu rozdělit."
 laamp_base_contract_schemes.2676.desc.outro: "$laamp_base_contract_schemes.2661.desc.outro$"
 laamp_base_contract_schemes.2676.a: "$laamp_base_contract_schemes.2661.a$"
