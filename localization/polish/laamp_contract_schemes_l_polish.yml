 laamp_base_contract_schemes.2312.desc.method.stewardship: "Dlouze se probíráme poznámkami a účtenkami postavy [char_current.GetTitledFirstName] i výpověďmi svědků, které dokáže narychlo obstarat ohledně svých obchodů."
 laamp_base_contract_schemes.2312.desc.method.diplomacy: "Náš rozhovor trvá hodně přes hodinu a znovu a znovu probíráme každý sebemenší detail obchodů postavy [char_current.GetTitledFirstName] v [destination_1.GetBaseNameNoTier], kde proběhly, s kým, kolik vynesly a tak dále."
 laamp_base_contract_schemes.2312.desc.method.intrigue: "Vedou rozhovor všemi obvyklými směry a dávám si záležet, abych ponechal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dostatek odmlk i nedokončených myšlenek, při nichž se [char_current.GetTitledFirstName] může snadno prořeknout."
 laamp_base_contract_schemes.2312.desc.method.learning: "Hovoříme snad #EMP většinu#! dne a probíráme každý představitelný aspekt podnikání postavy [char_current.GetTitledFirstName] v [destination_1.GetBaseNameNoTier]. Nevynecháme jedinou podrobnost ani otázku."
 laamp_base_contract_schemes.2312.desc.method.quartermaster: "Rozhovor vede [quartermaster.GetFirstName] a [char_current.GetTitledFirstName] usedne, aby čelil[Select_CString( char_current.IsFemale, 'a', '' )] zdánlivě nekonečné záplavě otázek. Zpočátku odpovídá trpělivě, ale s postupujícím časem stále méně."
 laamp_base_contract_schemes.2312.desc.method.thief.gold: "[char_current.GetTitledFirstName] samozřejmě běduje a zuří kvůli ztracenému stříbru, ale jakmile se ho zmocní mí stoupenci, mnoho už s tím nezmůže."
 laamp_base_contract_schemes.2312.desc.method.thief.courtier_opinion: "[char_current.GetTitledFirstName|U] z mého #EMP nabytí#! rozhodně nemá radost, ale to je tamní problém. Mí vděční stoupenci své nové přepychové předměty jistě jen tak nevrátí."
 laamp_base_contract_schemes.2312.desc.method.thief.piety: "[char_current.GetTitledFirstName|U] může do omrzení bědovat a žvanit o kletbách božstva [char_current.GetFaith.FateGodName] sesílaných na zloděje a podobně, ale myslím, že teď dobře vím, kdo z nás je zbožnější."
 laamp_base_contract_schemes.2312.desc.method.thief.provisions: "[char_current.GetTitledFirstName|U] na nás huláká a chrlí urážky, ale nakonec projeví dost rozumu, aby se nestavěl[Select_CString( char_current.IsFemale, 'a', '' )] mezi hladovou družinu [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] a její čerstvě získané jídlo."
 laamp_base_contract_schemes.2312.desc.result.outro.all_done: "Tím jsme prověřili všechny stopy, které máme. Zbývá už jen jediné."
 laamp_base_contract_schemes.2312.desc.result.success: "Dostat z postavy [char_current.GetFirstNameNoTooltip] pravdu nevyžaduje příliš úsilí, což ji podle všeho téměř smrtelně překvapí."
 laamp_base_contract_schemes.2312.desc.result.failure: "Přes veškeré naše úsilí se zdá být [char_current.GetSheHe] naprosto bez úhony, což si až příliš samolibě vychutnává."
 laamp_base_contract_schemes.2312.desc.result.ignored: "Lepší vrabec v hrsti než holub na střeše a nejspíš nečestně nabytý majetek tohoto člověka se mi v dlani drží až příliš příjemně, třebaže jeho zabavením jsme se připravili o možnost [char_current.GetHerHim] dále vyšetřovat."
 laamp_base_contract_schemes.2312.desc.result.outro.success: "Snad nám štěstí vydrží i u dalšího."
 laamp_base_contract_schemes.2312.desc.result.outro.failure: "Snad se nám u dalšího povede lépe."
 laamp_base_contract_schemes.2312.desc.result.outro.ignored: "Kéž je další stejně výnosný."
 laamp_base_contract_schemes.2312.a: "Další bude [person_a.GetFirstNameNoTooltip]."
 laamp_base_contract_schemes.2312.b: "Dál k majetku postavy [person_b.GetFirstNamePossessiveNoTooltip]."
 laamp_base_contract_schemes.2312.c: "Stále zbývá [person_c.GetFirstNameNoTooltip]..."
 laamp_base_contract_schemes.2312.d: "Uvidíme, zda [person_d.GetFirstNameNoTooltip] něco neskrývá."
 laamp_base_contract_schemes.2312.e: "Rozhodl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem se."
