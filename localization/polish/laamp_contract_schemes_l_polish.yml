 laamp_base_contract_schemes.0571.t: "Zaplaceno předem"
 laamp_base_contract_schemes.0571.desc: "Nemám žádnou záruku, že mi [target.GetTitledFirstName] nakonec skutečně dá dary, po nichž toužím, ať se u tamních nohou podbízím sebevíc.\n\nJe zřejmé, že musím jednat a vyvinout veškerý možný nátlak, abych získal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] zálohu předem. Pokud mě pak [target.GetSheHe] obdaruje ještě více, tím lépe. Pokud ne, mé úsilí už bude zaplaceno."
