 laamp_base_contract_schemes.2671.d.sacrifice_unexists: "$laamp_base_contract_schemes.2661.d.sacrifice_unexists$"
 laamp_base_contract_schemes.2671.d.no_valid_char: "Nemáš k dispozici [Concept('follower','družiníka')|E] s alespoň [EmptyScope.ScriptValue('laamp_base_contract_schemes_2661_other_skill_threshold_value')|0] body [Concept('prowess','udatnosti')|E], kterého bys mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] dočasně přidělit k [employer.GetFirstNamePossessive] [Concept('court','dvoru')|E]"
 laamp_base_contract_schemes.2671.d.tt.courtier_stays_here: "$laamp_base_contract_schemes.2661.d.tt.courtier_stays_here$"
