 LAW_CHANGE_WINDOW_POWERFUL_APPROVE_TT: "#T Souhlasí se změnou zákona nástupnictví#!\n[Character.GetShortUIName] podporuje změnu jakéhokoli [Concept('succession_law','zákona nástupnictví')|E], nebo se jí přinejmenším nemůže postavit.\n\n[Character.GetSheHe|U] souhlasí z jednoho z těchto důvodů:\n$BULLET_WITH_TAB$Má k vám kladné [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Je vámi [Concept('cowed','vyděšeným')|E]\n$BULLET_WITH_TAB$Je [Concept('imprisoned','uvězněný')|E] (kýmkoli)" # todo: NEW TRANSLATION # todo: CONCEPT CASE
