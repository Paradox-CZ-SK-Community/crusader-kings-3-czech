 camp_purpose_mercenaries: "Žoldnéři"
 camp_purpose_mercenaries_effects: "$EFFECT_LIST_BULLET$Nalézá více [Concept('mercenary_task_contracts','žoldnéřských zakázek')|E]\n$EFFECT_LIST_BULLET$Nalézá více [Concept('task_contracts','zakázek')|E] zaměřených na [Concept('prowess','zdatnost')|E] a [Concept('martial','vojenství')|E]\n$EFFECT_LIST_BULLET$Odemkne [Concept('camp_buildings','vylepšení tábora')|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_palisade').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_ditch').GetName]#!\n$EFFECT_LIST_BULLET$Zpřístupňuje některé zvláštní [Concept('officers','důstojníky')|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Odemkne se díky $baggage_train_siege_engineers_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Odemkne se díky $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK Žoldnéři si vydělávají především ostřím svých zbraní. Obvykle v souladu se zákonem, ale když jsou časy zlé a jediné, co máš, je sekera...#!"
 camp_purpose_wanderers: "Pocestní"
 camp_purpose_wanderers_effects: "$EFFECT_LIST_BULLET$Stejná šance nalézt [Concept('task_contracts','zakázky')|E] libovolného typu\n$EFFECT_LIST_BULLET$Lze přejít na jakýkoli jiný $camp_purpose$ bez zaplacení vysoké [Concept('prestige','prestiže')|E]\n\n#WEAK Otevřená cesta nabízí svobodu, jakou jinde nenajdeš: proč ji kazit zbytečnou specializací?#!"
 camp_purpose_scholars: "Učenci"
 camp_purpose_scholars_effects: "$EFFECT_LIST_BULLET$Nalézá více [Concept('task_contracts','zakázek')|E] zaměřených na [Concept('learning','učenost')|E] a [Concept('stewardship','správu')|E]\n$EFFECT_LIST_BULLET$Nalézá o něco více [Concept('task_contracts','zakázek')|E] zaměřených na [Concept('diplomacy','diplomacii')|E]\n$EFFECT_LIST_BULLET$Odemkne [Concept('camp_buildings','vylepšení tábora')|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_reference_corpus').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_siege_engineers').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_scribes').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ascetics').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_nightly_debates').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_martial_study').GetName]#!\n$EFFECT_LIST_BULLET$Zpřístupňuje některé zvláštní [Concept('officers','důstojníky')|E]:\n$BULLET_WITH_TAB$[GetCourtPositionType('chief_engineer_camp_officer').GetName()] #weak (Odemkne se díky $baggage_train_siege_engineers_domicile_building$)#!\n\n#WEAK Kniha, která zůstává v jediné knihovně, nemá klidu; myšlenka ukrytá v jediné mysli přichází vniveč.#!"
