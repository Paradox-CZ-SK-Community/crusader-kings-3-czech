l_polish:
 LOADING_TIP_0: "#T Právoplatný lenní pán#!\n\n$game_concept_rightful_liege$ [Concept('vassal','vazala')|El] je [Concept('ruler','vládce')|El], který drží přímý [Concept('de_jure','de iure')|El] [Concept('liege','lenní')|El] [Concept('title','titul')|El] vůči [Concept('primary_title','hlavnímu titulu')|El] daného $game_concept_vassal$. Pokud $game_concept_vassal$ nespadá pod svého $game_concept_rightful_liege$, odvádí méně [Concept('taxes','daní')|El] a [Concept('levies','odvedenců')|El] a zároveň trpí postihem k [Concept('opinion','mínění')|El] vůči svému $game_concept_liege$. Držení $game_concept_title$ vyšší [Concept('title_tier','úrovně titulu')|El] v rámci téhož $game_concept_de_jure$ vede ke snížení těchto postihů.\n\nVýjimkou jsou [Concept('dukes','vévodové')|El], kteří jsou součástí $game_concept_de_jure$ hierarchie některé [Concept('empire','říše')|El] a jsou přímo vazalizováni svému $game_concept_emperor$; ti stále odvádějí plnou výši, přesně jako kdyby $game_concept_emperor$ držel jejich $game_concept_de_jure$ [Concept('kingdom','královský')|El] $game_concept_title$." # todo: CONCEPT CASE
 LOADING_TIP_1: "#T De iure posun#!\n\nPomalý proces, při němž se může změnit [Concept('de_jure','de iure')|El] [Concept('liege','lenní pán')|El] [Concept('title','titulu')|El]. Nastává přirozeně, když je [Concept('duchy','vévodství')|El] nebo [Concept('kingdom','království')|El] zcela ovládáno [Concept('ruler','vládcem')|El], který nedrží de iure lenní titul daného území.\n\nTento proces lze urychlit přidělením tvého [Concept('chancellor','kancléře')|El] k příslušnému [Concept('councillor_task','úkolu rádce')|El] #weak ($task_integrate_title$)#!. Vévodství se mohou $game_concept_de_jure_drift$ pouze do království a království se mohou posouvat pouze do [Concept('empires','říší')|El].\n\nNechat tituly de iure posouvat do tvého [Concept('primary_title','hlavního titulu')|El] je dobrý způsob, jak se zbavit postihu za [Concept('rightful_liege','právoplatného lenního pána')|El]." # todo: CONCEPT CASE
