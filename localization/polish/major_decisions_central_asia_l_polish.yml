l_polish:
 become_greatest_of_khans_decision: "Stát se největším z chánů"
 become_greatest_of_khans_decision_desc: "#F Jsem připraven svolat vůdce všech klanů svého rozlehlého panství na shromáždění. Prohlásí mě chánem chánů, vládcem všeho pod Nebesy.\nA pak se vydáme dobývat.#!"
 become_greatest_of_khans_decision_tooltip: "Založ Mongolskou říši a staň se Čingischánem, vládcem světa"
 become_greatest_of_khans_decision_confirm: "Svolat velký kurultaj"
 become_greatest_of_khans_decision_gain_mongol_empire: "Tvé panství se stane [Concept('mongol_empire','Mongolskou říší')|E]"
 become_greatest_of_khans_decision_enable_mongol_invasion_cb: "Získáš přístup k [Concept('mongol_invasion_casus_belli','casus belli mongolské invaze')|E]"
 GREATEST_OF_KHANS_TITLE_REQUIREMENT: "Musíš mít hodnost [Concept('king','krále')|E] nebo [Concept('emperor','císaře')|E]"
 establish_bactrian_supremacy_decision: "Ustanovit baktrijskou nadvládu"
 establish_bactrian_supremacy_decision_desc: "#F Baktrijští králové po celé generace vládli křižovatce civilizací. Nastal čas navázat na jejich odkaz a nechat od karavanseráje k oáze šířit zprávu, že zde pod čtyřmi kouty nebes vládneme my.#!"
 establish_bactrian_supremacy_decision_tooltip: "Prokaž svou nadvládu nad cestami spojujícími východ se západem a sever s jihem"
 establish_bactrian_supremacy_decision_confirm: "Vznést nárok na dávné země!"
 establish_yamagate_in_samarkand_decision: "Ustanovit $manichean_religious_head_title_name$ v Samarkandu"
 establish_yamagate_in_samarkand_decision_desc: "#F Stejně jako kdysi Mar Sisin vedl víru ze Svatého stolce v Babylónu, vede nás nynější $manichean_religious_head_title$ zde v Turánu a Persii. Formálním stvrzením božského poslání církve v Samarkandu se manichejská víra znovu zrodí a rozšíří mezi nový lid!#!"
 establish_yamagate_in_samarkand_decision_tooltip: "Získej novou svatou zemi na východě"
 establish_yamagate_in_samarkand_decision_confirm: "$manichean$ se zrodí znovu!"
 hof_exists_tt: "Tvá [Concept('head_of_faith','hlava víry')|E] existuje"
 samarkand_held_by_you_or_vassal_tt: "$c_samarkand$ musí být v držení tvém nebo některého [Concept('vassal','vazala')|E]"
 