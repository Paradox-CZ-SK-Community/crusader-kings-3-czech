l_polish:
 east_europe.0001.t: "Sjednocení západních Slovanů"
 east_europe.0001.desc: "Dávné kmeny opět stojí pospolu. Sjednotil jsem nás stejně jako před staletími Sámo. Jeho říše zemřela spolu s ním, ale jsem přesvědčen, že [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] čeká zářná budoucnost. To je teprve začátek!"
 east_europe.0001.a: "Sláva [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 east_europe.0002.desc: "Stejně jako Sámo před staletími sjednotil vendické kmeny, [western_slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)] [Select_CString( western_slav_uniter.IsFemale, 'shromáždila', 'shromáždil' )] západoslovanské národy pod jedním praporem. Obstojí toto spojení ve zkoušce času, nebo se rozpadne stejně jako Sámova říše? To ví jen [ROOT.Char.GetFaith.FateGodName]."
 east_europe.0005.t: "Sjednocení jižních Slovanů"
 east_europe.0005.desc: "Sjednotil jsem dávné kmeny pod jedním praporem. Společně jsme silnější než kdy dříve. Nikdo si nás nepodmaní! Nikdo nás nevymaže!"
 east_europe.0006.desc: "[southern_slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString( southern_slav_uniter.IsFemale, 'shromáždila', 'shromáždil' )] jihoslovanské národy pod jedním praporem. Obstojí toto spojení ve zkoušce času, nebo je rozervou dávné sváry a zvyklosti? To ví jen [ROOT.Char.GetFaith.FateGodName]."
 east_europe.0010.t: "Zrození Slavie"
 east_europe.0010.desc: "Dokázal jsem nemožné. Dnes všichni Slované stojí sjednoceni pod jedním praporem. Má nová říše se rozprostírá od srdce Evropy na západě až po zmrzlé tundry na východě!\n\nJen hrstce hrdinů v dějinách se podařil takový čin! Nyní patřím mezi ně a mé jméno bude žít navěky."
 east_europe.0010.a: "Sláva Slavii!"
 east_europe.0011.desc: "[slav_uniter.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString( slav_uniter.IsFemale, 'dokázala', 'dokázal' )] nemožné a sjednotil všechny slovanské národy pod jedním praporem. Bude tato rozlehlá říše nadále vzkvétat, nebo ji rozervou dávné sváry a zvyklosti? To ví jen [ROOT.Char.GetFaith.FateGodName]."
 east_europe.0015.t: "Obránci [defender_of_highgod.GetFaith.HighGodName]"
 east_europe.0015.desc: "Síň hrdinů byla vystavěna v..."
 east_europe.0015.a: "... [target_list_member_a.GetNameNoTierNoTooltip]."
 east_europe.0015.b: "... [target_list_member_b.GetNameNoTierNoTooltip]."
 east_europe.0015.c: "... [target_list_member_c.GetNameNoTierNoTooltip]."
 east_europe.0015.d: "... [target_list_member_d.GetNameNoTierNoTooltip]."
 east_europe.0015.tooltip: "Država získá [Concept('special_building','zvláštní budovu')|E] [GetBuilding('hall_of_heroes_01').GetName]"
 east_europe.0016.desc: "Pod mým vedením se klany sjednotily, aby v [holy_site.GetNameNoTierNoTooltip] vybudovaly velkolepou válečnou síň. Za jejími mohutnými kamennými zdmi se připravujeme na válku...\n\nPo celé generace si cizáčtí mrchožrouti brousí zuby na naše země. Jen ať přijdou! Ať změří svou sílu s našimi statečnými [defender_of_highgod.GetFaith.GetAdjectiveNoTooltip] hrdiny! Ať jejich krev vsákne do země a zbarví řeky rudě!"
 east_europe.0016.a: "Sláva [defender_of_highgod.GetFaith.WarGodName]!"
 east_europe.0017.desc: "[defender_of_highgod.Custom2('MyCharacterIntroduction', ROOT.Char)|U] [Select_CString( defender_of_highgod.IsFemale, 'sjednotila', 'sjednotil' )] klany ve svém panství k obraně před cizími nájezdníky. V [holy_site.GetNameNoTierNoTooltip] byla vybudována velká válečná síň, v níž se již shromáždili hrdí [defender_of_highgod.GetFaith.GetAdjectiveNoTooltip] hrdinové."
 east_europe.0030.t: "Nový začátek"
 east_europe.0030.desc: "Přijetím zkušených obchodníků, rolníků a řemeslníků ze západních a jižních panství se [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] brzy stane vzkvétajícím střediskem obchodu a konečně se zbaví svých kmenových kořenů.\n\nSnad tito noví křesťanští osadníci také pomohou uklidnit poslední nespokojené pohanské zatvrzelce mezi mými poddanými a upevní [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] jako řádné [scoped_ruler.GetFaith.GetAdjective] panství."
 east_europe.0030.a: "Všichni jste vítáni!"
 east_europe.0031.t: "Noví osadníci"
 east_europe.0031.desc.vassals: "[scoped_ruler.GetTitledFirstName] [Select_CString( scoped_ruler.IsFemale, 'se rozhodla', 'se rozhodl' )] přivítat cizí osadníky ze sousedních [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip] panství.\n\nDoufá, že nově příchozí pomohou rychleji osídlit naše země a rozšířit obchod s našimi spojenci."
 east_europe.0031.desc.others: "[scoped_ruler.GetTitledFirstName] [Select_CString( scoped_ruler.IsFemale, 'se rozhodla', 'se rozhodl' )] přivítat cizí osadníky z [scoped_ruler.GetFaith.GetReligion.GetAdjectiveNoTooltip] panství sousedících s [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nDoufá, že nově příchozí pomohou rychleji osídlit tamní země a rozšířit obchod se spojenci."
 east_europe.0031.a: "Já jim tedy nevěřím!"
 east_europe.0031.b: "Chápu..."
 east_europe.0032.t: "Staré obřady"
 east_europe.0032.desc: "Mí předchůdci přijali [old_faith.GetNameNoTooltip] v pomýlené snaze přivést [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] do moderní doby, ale přinesli nám pouze vzpoury, bídu a sváry.\n\nDíky nesmírné světské i duchovní moci, kterou nyní nad svým panstvím třímám, tuto křivdu napravím a navrátím nás k pravé víře $magyar_pagan$.\n\nToto je však přelomový okamžik. Návrat ke Starým cestám zoufale potřebujeme, ale možná bychom jejich přesnou podobu mohli trochu pozměnit?"
 east_europe.0032.a: "Vrátíme se k neposkvrněným Starým cestám."
 east_europe.0032.b: "Možná... možná bychom si mohli ponechat několik nových nauk..."
 east_europe.0032.c: "[ROOT.Char.GetFaith.WarGodName] žádá nové lebky!"
 east_europe.0032.d: "Naše zarputilé lpění na starých tradicích všeho druhu je slabostí."
 east_europe.0034.t: "Obrození [scoped_ruler.GetFaith.GetAdherentNameNoTooltip]"
 east_europe.0034.desc.vassals: "Poté, co v panství [Select_CString( scoped_ruler.IsFemale, 'nashromáždila', 'nashromáždil' )] téměř neomezenou moc,"
 east_europe.0034.desc.outsiders: "Poté, co v [scoped_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip] [Select_CString( scoped_ruler.IsFemale, 'nashromáždila', 'nashromáždil' )] téměř neomezenou moc,"
 east_europe.0034.desc.intro: "[scoped_ruler.GetTitledFirstName] [Select_CString( scoped_ruler.IsFemale, 'se ukázala být odpadlicí', 'se ukázal být odpadlíkem' )]!\n\nVe veřejném projevu vzdoru [Select_CString( scoped_ruler.IsFemale, 'zavrhla', 'zavrhl' )] [old_faith.HighGodName], vyhnala vysoce postavené [old_faith.GetAdherentNameNoTooltip] [old_faith.PriestNeuterPlural] a zbavila [old_faith.GetNameNoTooltip] postavení státní víry. Již nyní se k [scoped_ruler.GetTitledFirstNameNoTooltip] houfně přidávají mnozí venkovští [scoped_ruler.GetCulture.GetCollectiveNounNoTooltip].\n\n"
 east_europe.0034.desc.conversion_vanilla: "Ačkoli byla víra $magyar_pagan$ po jistou dobu politicky bezvýznamná, na venkově si uchovala mnoho stoupenců, takže [scoped_ruler.GetTitledFirstNameNoTooltip] neměla s obnovením Starých cest velké obtíže."
 east_europe.0034.desc.conversion_syncretic: "Navzdory tomu si nová víra [scoped_ruler.GetFaith.GetAdherentNameNoTooltip] zjevně zachovává mnoho osobitých prvků [old_faith.GetNameNoTooltip] a viditelně spojuje Staré cesty s novými."
 east_europe.0034.desc.conversion_bloodthirsty: "Ještě horší je, že [scoped_ruler.GetTitledFirstNameNoTooltip] tvrdí, že rozhněvaní bohové odpustí [scoped_ruler.GetCulture.GetNameNoTooltip] lidu slabost, s níž přestoupil na jinou víru, jedině za cenu častých lidských obětí!"
 east_europe.0034.desc_conversion_adaptive: "Po všech změnách, jimiž [scoped_ruler.GetCulture.GetNameNoTooltip] lid a jeho víra během posledních staletí prošly, působí toto obrození Starých cest pozoruhodně otevřeně a pragmaticky."
 east_europe.0034.a: "Konečně! Ať je s námi [ROOT.Char.GetFaith.HighGodName] navěky!"
 east_europe.0034.b: "Možná vítr vane směrem k [scoped_ruler.GetFaith.HighGodName]..."
 east_europe.0034.c: "Co je to za odporné pohanství?!"
 east_europe.0034.d: "Není to má věc ani můj problém."
 east_europe.0101.t: "První [founder.GetTitleAsNameNoTooltip] celé Bosny"
 east_europe.0101.desc: "Hornatá Bosna byla po staletí zmítána mezi všemi soupeřícími mocnostmi Balkánu. Slovany ze severu i jihu, právě vládnoucími karpatskými pány koní, císaři z Bulharska či Konstantinopole, a dokonce i kupeckými knížaty z Jadranu.\n\nOde dneška je tomu konec.\n\nMou korunovací se Bosna stává samostatným královstvím a čeká ji síla a sláva!"
 east_europe.0101.a: "Na můj odkaz se bude vzpomínat po staletí!"
 east_europe.0101.b: "[founder.GetFaith.HighGodName] nám žehná!"
 east_europe.0101.c: "Upřímně, hlavně že jsem někde #EMP [founder.GetTitleAsNameNoTooltip]#!..."
 east_europe.0102.t: "$east_europe.0101.t$"
 east_europe.0102.desc: "Mí poslové přinášejí zprávy z údolí Dinárských Alp. [founder.GetShortUIName] [Select_CString( founder.IsFemale, 'byla provolána', 'byl provolán' )] [founder.GetTitleAsNameNoTooltip] [founder.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nDíky snadno bránitelným horským údolím a temným lesům bosenské vrchoviny pod vládou [founder.GetShortUINameNoTooltip] i podpoře místního lidu se [founder.GetTitledFirstNamePossessiveNoTooltip] království zdá být pevně zajištěno.\n\nProzatím."
 east_europe.0102.a: "Přinejlepším ubohý povýšenec."
 east_europe.0102.b: "Ať žije [founder.GetShortUINameNoTooltip]!"
 east_europe.0102.c: "Uvidíme, jak dlouho to vydrží..."
 east_europe.0111.t.setup: "Kacíři mezi námi"
 east_europe.0111.tt.announce_failure: "Tvůj pokus obvinit $bosnian_church$ z kacířství selže!"
 east_europe.0111.tt.cancellation_cooldown: "$bosnian_church$ nebude možné znovu obvinit z kacířství po dobu [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_cancellation_cooldown_value')|0] let"
 east_europe.0111.tt.regular_cooldown: "$bosnian_church$ nebude možné znovu obvinit z kacířství po dobu [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_failure_cooldown_value')|0] let"
 east_europe.0111.tt.critical_cooldown: "$bosnian_church$ nebude možné znovu obvinit z kacířství po dobu [EmptyScope.ScriptValue('accuse_the_krstjani_of_heresy_critical_failure_cooldown_value')|0] let"
 east_europe.0111.t: "$east_europe.0111.t.setup$: Dopis pro [hof.GetTitledFirstNameNoTooltip]"
 east_europe.0111.desc: "Kdo ví, jak dlouho tito takzvaní [heretic.GetFaith.GetAdherentNamePluralNoTooltip] unikali pozornosti? Desetiletí? Století? Už od návštěvy blahoslaveného svatého Martina?\n\nAť už bylo tomuto kacířství dovoleno bujet v bosenské divočině jakkoli dlouho, shovívavost našich předků přinesla trpké plody a já to nemohu snášet! Vidět, jak takový [heretic.Custom2('InsultNoun', ROOT.Char)] jako [heretic.GetTitledFirstName] otevřeně pohrdá [accuser.GetFaith.HighGodName]!\n\nSvět si ve své nevědomosti myslí, že jde v zásadě o dobré, byť venkovské [accuser.GetFaith.GetAdherentNamePluralNoTooltip]. Několik tvořivě zvolených slov pro [hof.GetTitledFirstName] by to však mohlo změnit..."
 east_europe.0111.a: "Přineste mi [ROOT.Char.Custom('WritingInstrument')] a [ROOT.Char.Custom('GetWritingMaterial')]!"
 east_europe.0111.a.tt: "Je sepsán dopis"
 east_europe.0111.b: "Mám na práci důležitější věci..."
 east_europe.0112.t: "[hof.Custom2('AppropriateGreeting',accuser)]"
 east_europe.0112.desc.intro: "Tvé tvrzení, že [heretic.GetFaith.GetAdherentNamePluralNoTooltip] jsou kacíři, je směšné."
 east_europe.0112.desc.culture: "[accuser.GetTitledFirstName] pochází ze stejné země jako já a ty jen neznáš naše zvyklosti."
 east_europe.0112.desc.rival: "Upřímně, pokud je #EMP někdo#! pravděpodobně vinen kacířstvím, pak jsi to ty, ty [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))], [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))], [accuser.Custom2('InsultAdjective', SCOPE.sC('hof'))] [accuser.Custom2('InsultNoun', SCOPE.sC('hof'))]!"
 east_europe.0112.desc.sinful: "Tvých hříchů je prakticky tolik, že je nelze ani spočítat, a přesto máš tu drzost kritizovat ostatní?"
 east_europe.0112.desc.negative_opinion: "Možná bych tvým myšlenkám přikládal váhu, kdybych si tvého názoru alespoň trochu vážil. Bohužel tomu tak není."
 east_europe.0112.desc.fallback: "Taková nepodložená obvinění se k osobě tvého postavení nehodí."
 east_europe.0112.desc.outro: "\n\nDoufám, že tímto celá záležitost skončí a příště se před psaním zamyslíš."
 east_europe.0112.a: "Jaký zaslepený hlupák!"
 east_europe.0113.t: "[hof.Custom2('AppropriateGreeting',accuser)]"
 east_europe.0113.desc: "Tvá slova mě hluboce znepokojují. Pomyšlení, že by se tak hluboká zkaženost mohla skrývat tak blízko samotného srdce křesťanstva!\n\nPoradím se s [heretic.GetTitledFirstNameNoTooltip] a zjistím pravdu."
 east_europe.0113.a: "Kola božské spravedlnosti se roztáčejí!"
 east_europe.0113.a.tt: "[hof.GetTitledFirstNameNoTooltip] píše [heretic.GetTitledFirstNameNoTooltip]..."
 east_europe.0114.t: "$east_europe.0111.t.setup$: [hof.GetFaith.GetAdjectiveNoTooltip] inkvizice"
 east_europe.0114.desc: "Dopis od [hof.GetTitledFirstName] se chvěje v tvých prstech, ale nedokážeš říci, zda se třeseš strachy, nebo vztekem. Kvůli úkladům proradné postavy [accuser.GetName] hrozí [hof.GetTitledFirstNameNoTooltip], že všechny [heretic.GetFaith.GetAdherentNamePluralNoTooltip] prohlásí za kacíře!\n\nTento strašlivý čin by proti tobě nepochybně poštval ostatní křesťany a rozpoutal záplavu svatých válek, pokud [hof.GetTitledFirstNameNoTooltip] nepřesvědčíš o opaku.\n\nMusíš sepsat odpověď."
 east_europe.0114.a: "Možná pomůže vychytralé teologické pojednání?"
 east_europe.0114.a.tt_success: "[hof.GetTitledFirstNameNoTooltip] je přesvědčen"
 east_europe.0114.a.tt_success.tt: "Obvinění z kacířství jsou odvrácena!"
 east_europe.0114.a.tt_failure: "Tvá argumentace vyzní naprázdno"
 east_europe.0114.a.tt_failure.tt: "Obvinění z kacířství znějí pravdivě..."
 east_europe.0114.b: "Myslím, že postačí krátká připomínka..."
 east_europe.0114.b.tt: "[hof.GetTitledFirstName] bude nucen postavit se na tvou stranu!"
 east_europe.0114.c: "Kdyby se na to [Select_CString( hof.IsFemale, 'dokázala', 'dokázal' )] podívat politicky..."
 east_europe.0114.c.tt_success: "Celá záležitost získá nádech politického cynismu"
 east_europe.0114.c.tt_failure: "Argumentace zůstane teologická"
 east_europe.0114.d: "Nemůžeme vzdorovat celé církvi. #EMP Musím#! konvertovat."
 east_europe.0114.d.tt: "Budeš se muset rozhodnout, zda konvertovat upřímně, nebo jen z vypočítavosti"
 east_europe.0114.e: "Naše víra je stejně pravá jako jejich! Sepíšu vzdorný dopis!"
 east_europe.0114.e.tt: "[hof.GetTitledFirstName] zcela jistě prohlásí $bosnian_church$ za kacířskou!"
 east_europe.0115.t: "$east_europe.0116.t$"
 east_europe.0115.desc.intro: "K čertu s [Select_CString( heretic.IsFemale, 'jejíma zatracenýma očima', 'jeho zatracenýma očima' )], [heretic.GetTitledFirstName] [Select_CString( heretic.IsFemale, 'konvertovala', 'konvertoval' )]!\n\n"
 east_europe.0115.desc.political: "Ačkoli se [hof.GetTitledFirstName] zdá být zcela přesvědčen, mně je jasné, že jde pouze o vlažné politické gesto. Jen [heretic.GetFirstNameNoTooltip] #EMP sama#! potvrdila svou věrnost víře [hof.GetFaith.GetNameNoTooltip]. Nepřidal se jediný vazal ani člen rodiny."
 east_europe.0115.desc.wholehearted: "Tento krok působí upřímně a [heretic.GetTitledFirstName] spolu se sebou přivedla k [hof.GetFaith.GetAdjective] vyznání i svou nejbližší rodinu a několik významných velmožů. Tím je to snad ještě nesnesitelnější."
 east_europe.0115.desc.outro: "\n\nProzatím je záležitost uzavřena. Ať už jsou kacíři, nebo ne, [hof.GetTitledFirstNameNoTooltip] je přesvědčen, že má $bosnian_church$ dostatečně pod kontrolou."
 east_europe.0115.a: "Ach, vzdávám to!"
 east_europe.0115.b: "Jednou kacířem, #EMP navždy#! kacířem!"
 east_europe.0115.b.toast: "Tvůj úskok rozhněval [accuser.GetShortUIName]"
 east_europe.0116.t: "$east_europe.0111.t.setup$: Změna smýšlení"
 east_europe.0116.desc: "[hof.GetTitledFirstName] požaduje úplný akt pokání a konverzi, při níž plně přijmu víru [hof.GetFaith.GetNameNoTooltip].\n\nVím však, že mí druhové [heretic.GetFaith.GetAdherentNamePluralNoTooltip] jsou silní. Možná by stačilo, kdyby konvertovala pouze #EMP má osoba#!.\n\nTím bych však problém jen odložila. Možná bude nejlepší tuto změnu přijmout nyní, dokud tak můžeme učinit pokojně?"
 east_europe.0116.a: "Ne, postačí má osobní konverze."
 east_europe.0116.b: "Už toho bylo dost. Všichni se staneme zbožnými [hof.GetFaith.GetAdherentNamePluralNoTooltip]!"
 east_europe.0117.t: "$east_europe.0111.t.setup$: Dočasný odklad"
 east_europe.0117.desc.intro: "[hof.GetTitledFirstName] se bohužel [Select_CString( hof.IsFemale, 'rozhodla', 'rozhodl' )] $bosnian_church$ z kacířství #EMP neobvinit#!.\n\n"
 east_europe.0117.desc.critical_success: "A co hůř, [heretic.GetTitledFirstName] nějakým způsobem [Select_CString( heretic.IsFemale, 'přesvědčila', 'přesvědčil' )] [hof.GetFaith.ReligiousHeadName], aby mě exkomunikoval! Jaké odporné čarodějnictví či temné tajemství k tomu vedlo, ví jen [heretic.GetFirstNameNoTooltip], ale nyní na mě všichni křesťanští páni hledí s odporem obvykle vyhrazeným pohanům a rozkolníkům."
 east_europe.0117.desc.theological_debate: "Po několika týdnech intenzivních učených debat mezi [hof.GetTitledFirstName] a [heretic.GetTitledFirstName] se [hof.GetFaith.ReligiousHeadName] postupně přiklonil k názoru [heretic.GetFirstNameNoTooltip] a uznal, že [heretic.GetFaith.GetAdherentNamePluralNoTooltip] jsou pouze poněkud zaostalí [hof.GetFaith.GetAdherentNamePluralNoTooltip]."
 east_europe.0117.desc.political_leverage: "Okolnosti tohoto rozhodnutí jsou přinejmenším pochybné, protože závěry inkvizitorů vyslaných do [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] jsou veřejně známé a naprosto zdrcující. Zdá se, že názor postavy [hof.GetFaith.ReligiousHeadName] ovlivnil nějaký #EMP jiný#! faktor."
 east_europe.0117.desc.political_manoeuvrings: "Několik týdnů usilovného dopisování, padělaných svědectví a uplácení inkvizitorů vyslaných vyšetřit [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] přesvědčilo [hof.GetFaith.ReligiousHeadName], že má obvinění byla motivována výhradně možným politickým ziskem a jsou zcela nepodložená."
 east_europe.0117.desc.outro: "\n\nKacíři si prozatím vydobyli trochu prostoru k nadechnutí. Budoucí [hof.GetFaith.ReligiousHeadName] k nim však nemusí být tak shovívaví..."
 east_europe.0117.a: "Ach, tolik promarněného času a úsilí."
 east_europe.0117.b: "To je skandál!"
 east_europe.0117.c: "[accuser.GetFaith.HighGodName] možná odpouští, ale já ne!"
 east_europe.0117.c.toast: "$east_europe.0115.b.toast$"
 east_europe.0117.d: "Odmítáte #EMP mně#! svaté přijímání? Pak si založím vlastní #EMP zatracenou#! církev!"
 east_europe.0118.t: "$east_europe.0111.t.setup$: Prostor k nadechnutí"
 east_europe.0118.desc.intro: "Vyjednávání a pečlivě formulované dopisy zabraly několik týdnů, ale nakonec se mi podařilo přivést [hof.GetTitledFirstName] na svou stranu.\n\n"
 east_europe.0118.desc.critical_success: "Dokonce jsem díky svému až příliš silnému vlivu na [hof.GetFaith.ReligiousHeadTitleName] dokázala obrátit situaci proti [accuser.Custom2('InsultAdjective', ROOT.Char)] postavě [accuser.GetTitledFirstName].\n\nZa falešná obvinění věrných křesťanů souhlasil [hof.GetTitledFirstNameNoTooltip] s exkomunikací postavy [accuser.GetTitledFirstNameNoTooltip]!"
 east_europe.0118.desc.theological_debate: "Ačkoli nás [hof.GetFaith.ReligiousHeadTitleName] stále považuje za zaostalé divochy, uznává, že jsme sice pomýlení, ale nikoli kacíři."
 east_europe.0118.desc.political_leverage: "Celá zkouška mě stála veškerý vliv, který jsem na [hof.GetFaith.ReligiousHeadTitleName] měla, ale [hof.GetTitledFirstNameNoTooltip] neochotně uznal, že nejsme kacíři, nýbrž pouze nevzdělaní."
 east_europe.0118.desc.political_manoeuvrings: "Vyžádalo si to nemálo protiobvinění, padělaných dopisů od [accuser.GetTitledFirstName] a obezřetně rozdávaných úplatků hostujícím inkvizitorům, ale [hof.GetFaith.ReligiousHeadTitleName] nás nakonec oficiálně prohlásil za nevinné a celou záležitost označil za místní spor."
 east_europe.0118.desc.outro: "\n\nVěrní [heretic.GetFaith.GetAdherentNamePluralNoTooltip] si všude mohou úlevně oddechnout."
 east_europe.0118.a: "[heretic.GetFaith.FateGodName] se na nás usmívá!"
 east_europe.0118.b: "Jsem jen rád, že je tato záležitost snad konečně uzavřena."
 east_europe.0119.t: "$east_europe.0111.t.setup$: Konec tolerance"
 east_europe.0119.desc.intro: "Jak se dalo čekat, sotva se [hof.GetTitledFirstName] začal záležitostí vážně zabývat, odhalil mezi [heretic.GetFaith.GetAdherentNamePluralNoTooltip] #EMP množství#! důkazů o kacířství.\n\n"
 east_europe.0119.desc.theological_debate: "[heretic.GetTitledFirstName] se přirozeně pokusila z celé věci vykroutit, ale [hof.GetFaith.ReligiousHeadName] její ubohé teologické argumenty s opovržením smetl ze stolu."
 east_europe.0119.desc.political_manoeuvrings: "[heretic.GetTitledFirstName] se pokusila vykreslit můj dopis jako projev cynického sobectví, ale toto hrubé politické divadlo nenašlo u postavy [hof.GetFaith.ReligiousHeadName] žádné pochopení a bylo odsouzeno jen jako další odvádění pozornosti od podstaty věci."
 east_europe.0119.desc.unrepentant_heretics: "Když byla [heretic.GetTitledFirstName] konfrontována, ani se nepokusila skrývat své opovržení postavou ve funkci [hof.GetFaith.ReligiousHeadTitleName]. Otevřeně se vysmívala [hof.GetFaith.ReligiousHeadName] a přitom hájila pravost své zvrhlé víry!"
 east_europe.0119.desc.outro: "\n\nVšem okolním křesťanům každého pravověrného vyznání byly rozeslány oficiální listiny odsuzující [heretic.GetFirstNameNoTooltip] a její rouhačskou víru."
 east_europe.0119.a: "Bylo mi dáno za pravdu!"
 east_europe.0120.t: "[hof.Custom2('AppropriateGreeting',heretic)]"
 east_europe.0120.desc.intro: "S bolestí ti oznamuji, že tvou víru považuji za krajně zvrácenou, nikoli pouze za zaostalou a napravitelnou, jak jsem doufal.\n\n"
 east_europe.0120.desc.theological_debate: "Tvým neobratně formulovaným výmluvám nikdo nenaslouchá. Tyto nepodložené teologické argumenty tvou vinu pouze #EMP dokazují#! a takové nepravověrné smýšlení nemohu strpět."
 east_europe.0120.desc.political_manoeuvrings: "Tvá snaha označit celou záležitost za čistě cynický politický tah je zjevně jen zoufalou lží zvrhlého kacířského vůdce. Zpochybňování pohnutek dobrých [hof.GetFaith.GetAdherentNamePluralNoTooltip] nebudu trpět."
 east_europe.0120.desc.unrepentant_heretics: "To, že svou vinu tak otevřeně přiznáváš, mě mate a rmoutí, neboť tím dokazuješ, že pro tebe není naděje na vykoupení. Modlím se za zaslepené duše tvých zbloudilých poddaných, ale jinak to být nemůže."
 east_europe.0120.desc.outro: "\n\nOde dneška budou všichni pravověrní křesťané považovat [heretic.GetFaith.GetAdherentNamePluralNoTooltip] za kacíře. Ať tvá zkaženost shnije v pekle!"
 east_europe.0120.a: "To je pohroma!"
 east_europe.0120.a.tt: "Hladoví [hof.GetFaith.GetAdherentNameNoTooltip] obracejí pozornost k tvým zemím..."
 east_europe.0121.t: "$east_europe.0119.t$"
 east_europe.0121.desc.intro: "V posledních týdnech zuří mezi [accuser.GetFullName], [heretic.GetFullName] a [hof.GetTitledFirstName] prudká trojstranná slovní válka o ekumenické postavení $bosnian_church$.\n\n"
 east_europe.0121.desc.theological_debate: "Většina sporů měla teologickou povahu. [heretic.GetFirstNameNoTooltip] se snažila přesvědčit [hof.GetTitledFirstNameNoTooltip], že [heretic.GetFaith.GetAdherentNamePluralNoTooltip] jsou dobří [hof.GetFaith.GetAdherentNamePluralNoTooltip], jen mají venkovské způsoby.\n\nTato snaha však selhala."
 east_europe.0121.desc.political_manoeuvrings: "Navzdory veškerému úsilí [heretic.GetFirstNameNoTooltip] vykreslit obvinění [accuser.GetFirstNameNoTooltip] jako čistě politický úskok se [hof.GetFaith.ReligiousHeadName] přiklonil proti [heretic.GetTitledFirstNameNoTooltip].\n\n"
 east_europe.0121.desc.unrepentant_heretics: "Nakonec se zdá, že postavení [heretic.GetFirstNameNoTooltip] bylo od počátku beznadějné. [Select_CString( heretic.IsFemale, 'Rozhodla', 'Rozhodl' )] se totiž přiznat k obviněním z nepravověrnosti a zároveň hájit svou víru jako zcela platnou.\n\n"
 east_europe.0121.desc.outro: "Na příkaz [hof.GetTitledFirstNameNoTooltip] budou ode dneška všichni ekumeničtí křesťané považovat [heretic.GetFaith.GetAdherentNamePluralNoTooltip] za kacíře!"
 east_europe.0121.a: "Kacíři? Mezi námi?!"
 east_europe.0121.b: "Upřímně je mi to jedno."
 east_europe.0121.c: "Chtěli jsme jen, aby nás nechali na pokoji!"
 east_europe.0123.t: "$east_europe.0124.t$"
 east_europe.0123.desc.intro: "$east_europe.0124.desc.intro$"
 east_europe.0123.desc.hof_died: "Smrtí [hof.GetTitledFirstName] zmizela hlavní církevní síla stojící za inkvizicí v [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 east_europe.0123.desc.heretic_died: "Po smrti [heretic.GetTitledFirstName] se [hof.GetTitledFirstName] spokojil s domněnkou, že spolu s [Select_CString( heretic.IsFemale, 'ní', 'ním' )] zemřelo i veškeré závažné kacířství, a inkvizice v [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] byla odvolána."
 east_europe.0123.desc.hof_no_longer_hof: "$east_europe.0124.desc.hof_no_longer_hof$"
 east_europe.0123.desc.heretic_not_independent_ruler: "Jelikož [heretic.GetTitledFirstName] již není nezávislým křesťanským vládcem, [hof.GetTitledFirstName] už [Select_CString( heretic.IsFemale, 'ji', 'jej' )] nepovažuje za dostatečně významný zdroj kacířství hodný dalšího vyšetřování."
 east_europe.0123.desc.heretic_now_ecumenical_christian: "Konverze [heretic.GetTitledFirstName] k víře [heretic.GetFaith.GetName] přesvědčila [hof.GetTitledFirstName] o upřímné oddanosti [heretic.GetTitledFirstNameNoTooltip] bohu [hof.GetFaith.HighGodName]."
 east_europe.0123.desc.heretic_now_different_heresy: "Konverzí [heretic.GetTitledFirstName] k víře [heretic.GetFaith.GetName] se otázka změnila z „zda“ na „které“. Inkvizitoři postavy [hof.GetFaith.ReligiousHeadName] nemohou pátrat po nepravověrnosti v panství, kterému otevřeně vládne kacíř."
 east_europe.0123.desc.heretic_now_infidel: "Konverzí [heretic.GetTitledFirstName] k víře [heretic.GetFaith.GetName] se z možného kacíře stal nepochybný nevěřící. Inkvizitoři postavy [hof.GetFaith.ReligiousHeadName] byli z [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] samozřejmě bez okolků vyhnáni."
 east_europe.0123.desc.heretic_now_heathen: "Konverzí [heretic.GetTitledFirstName] k víře [heretic.GetFaith.GetName] se z možného kacíře stal otevřený pohan. Po této nestoudné urážce boha [hof.GetFaith.HighGodName] se ekumenické postavení $bosnian_church$ zdá být poněkud nepodstatné."
 east_europe.0123.desc.fallback: "$east_europe.0124.desc.fallback$"
 east_europe.0123.desc.outro: "$east_europe.0124.desc.outro$"
 east_europe.0123.a: "Takto to skončit nemělo!"
 east_europe.0124.t: "$east_europe.0111.t.setup$: Obvinění se hroutí"
 east_europe.0124.desc.intro: "Zdá se, že štěstěna přeje $bosnian_church_adherent_plural$.\n\n"
 east_europe.0124.desc.hof_died: "Po smrti [hof.GetTitledFirstName] se inkvizice v [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] rozpadla, neboť mnoho významných církevních hodnostářů bylo odvoláno, aby řešili nástupnictví v čele církve."
 east_europe.0124.desc.heretic_died: "Po smrti [heretic.GetTitledFirstName] se [hof.GetTitledFirstName] zjevně spokojil s tím, že veškeré závažné odchylky mezi $bosnian_church_adherent_plural$ brzy vymizí, neboť podezřelý vůdce kacířů již nepochybně odešel do [hof.GetFaith.NegativeAfterLife|U]."
 east_europe.0124.desc.hof_no_longer_hof: "Sesazení bývalé postavy ve funkci [absolute_faith.ReligiousHeadName] [hof.GetFirstName] uvrhlo inkvizici v [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip] do zmatku a veškerá naděje na použitelný rozsudek se rozplynula."
 east_europe.0124.desc.heretic_not_independent_ruler: "Nyní, když [Select_CString(heretic.IsLocalPlayer,'již nejsem',heretic.GetShortUIName)][Select_CString(heretic.IsLocalPlayer,'',' již není')] nezávislým křesťanským vládcem, [hof.GetTitledFirstName] již nepovažuje další vyšetřování [Select_CString(heretic.IsLocalPlayer,'mé osoby',heretic.GetShortUIName)] za smysluplné."
 east_europe.0124.desc.heretic_now_ecumenical_christian: "Po mé nedávné konverzi k víře [heretic.GetFaith.GetName] již [hof.GetTitledFirstName] nemá důvod pochybovat o mé víře v [hof.GetFaith.HighGodName]."
 east_europe.0124.desc.heretic_now_different_heresy: "Po mé nedávné konverzi k víře [heretic.GetFaith.GetName] mě [hof.GetTitledFirstName] #EMP již#! považuje za kacíře a je příliš zaneprázdněn odsuzováním mé podlé nevěrnosti, než aby vážně podporoval vlastní inkvizici vyšetřující nějaké méně závažné možné kacířství."
 east_europe.0124.desc.heretic_now_infidel: "Po mé nedávné konverzi k víře [heretic.GetFaith.GetName] mě [hof.GetTitledFirstName] prohlásil za [hof.Custom('GetDerogatoryNonbeliever')] a zrádce před [hof.GetFaith.HighGodName]. Možné prohřešky $bosnian_church_adherent_plural$ musí ve srovnání s tím působit zcela nepatrně."
 east_europe.0124.desc.heretic_now_heathen: "Po mé nedávné konverzi k víře [heretic.GetFaith.GetName] mě [hof.GetTitledFirstName] prohlásil za bezduchého [hof.Custom('GetDerogatoryNonbeliever')] a odpadlíka nejodpornějšího druhu. Kdyby mi na jeho mrtvém bohu ještě alespoň trochu záleželo, možná by se mě to dotklo."
 east_europe.0124.desc.fallback: "Okolnosti, které nemůžeme ovlivnit, zmařily veškerou naději na úspěch inkvizice v [heretic.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 east_europe.0124.desc.outro: "\n\n[absolute_faith.ReligiousHeadTitleName] prozatím případ odložil s tím, že se musí věnovat naléhavějším záležitostem."
 east_europe.0124.a: "Alespoň je to vyřešeno."
 east_europe.0141.t: "Poslední ozvěna stěhování národů"
 east_europe.0141.desc: "Život ve stepi bývá krutý i v těch nejlepších časech. V poslední době je však ještě krutější, neboť nás mnoho jiných závistivých kočovných kmenů pronásleduje kvůli našim úspěchům. Pečeněhové, Chazaři a další přicházejí z dalekých zemí, aby sužovali naši konfederaci.\n\nV minulých staletích celé národy opustily tento život a zamířily na úrodná pole a do slabých království Evropy.\n\nDnes jsem se rozhodl napodobit úspěch dávných kočovníků, vybojovat $mogyer_collective_noun$ nový domov ve vzdálené Panonii a přitom vykořenit celé své panství.\n\nBrzy společně překročíme Karpaty a otevřeme novou kapitolu dějin našeho lidu."
 east_europe.0141.a: "Do Panonie!"
 east_europe.0141.a.tt: "Můžeš jednou použít zvláštní [Concept('hungarian_invasion_casus_belli','casus belli maďarské invaze')|E] proti libovolnému vládci v Panonii"
 east_europe.0142.t: "$east_europe.0141.t$"
 east_europe.0142.desc: "Můj vazal [mogyer_invader.GetShortUIName] učinil nečekaný krok a vyslal posly se zprávou, že hodlá odvést svůj lid ze současného panství a celý se přesunout do Panonie.\n\nPokud uspěje, má vláda v této oblasti se pravděpodobně rozpadne."
 east_europe.0142.a: "Pošetilý podnik!"
 east_europe.0142.a.tt: "$mogyer_collective_noun$ zahájí [Concept('hungarian_invasion','maďarskou invazi')|E]"
 east_europe.0143.t: "$east_europe.0141.t$"
 east_europe.0143.desc.pannonian_capital: "Hrozné zprávy ze stepi! Obchodníci a špehové hlásí"
 east_europe.0143.desc.pannonian_territory: "Znepokojivé zprávy ze stepi! Místní páni tvrdí"
 east_europe.0143.desc.fallback: "Zlé zprávy ze stepi! Znepokojení vazalové přeposlali hlášení"
 east_europe.0143.desc.outro: "že [mogyer_invader.GetShortUIName], $mogyer$ vojevůdce, svolává veškerou sílu svého panství k ničivé invazi do Panonie.\n\n$mogyer$ hordy se již shromažďují a chystají se zaplavit rovinu na svých démonických ořích a rozvrátit celý zdejší řád!"
 east_europe.0143.a: "Přece nikdy nepřekročí Karpaty?"
 east_europe.0143.a.tt: "$east_europe.0142.a.tt$"
 east_europe.0200.t: "[founder.GetTitleAsNameNoTooltip] Livonska"
 east_europe.0200.desc.christian: "Pobaltí bylo po staletí primitivní a nezkrocené, domovem rozličných kacířských vyznání a uctívačů ďábla. Korunovací [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] postavy s titulem [founder.GetTitleAsNameNoTooltip] Livonska zahřívá moc [founder.GetFaith.HighGodName] tuto mokrou a mrazivou zemi.\n\nMisie víry [ROOT.Char.GetFaith.GetReligion.GetNameNoTooltip] v Pobaltí uspěla, a tak mohu vyhlásit Livonsko, titul, který sjednotí všechny obyvatele Pobaltí za naším společným posláním šířit slovo [founder.GetFaith.random_GoodGodNames]."
 east_europe.0200.desc.nonchristian: "Baltové po staletí postrádali vlastní království, zatímco vikingové plenili naše pobřežní vesnice a cizí misionáři ze vzdálených zemí nás označovali za primitivní a nezkrocené. Tomu je však konec. Rozptýlené baltské národy nyní společně poklekají před livonskou korunou.\n\nSvou korunovací v roli [founder.GetTitleAsNameNoTooltip] zahájím zlatý věk nejen pro [founder.GetCulture.GetName] lid, ale pro všechny Balty žijící podél pobřeží."
 east_europe.0200.desc.outro: "\n\nOsud Pobaltí spočívá v mých rukou a založením tohoto království zahájím nový zlatý věk víry a slávy pod ochranou [founder.GetFaith.HighGodName]."
 east_europe.0200.a: "Můj odkaz mě přežije!"
 east_europe.0200.b: "Za [founder.GetFaith.HighGodName] a slávu!"
 east_europe.0201.t: "$east_europe.0101.t$"
 east_europe.0201.desc: "Poslové přinášejí zprávy z chladných livonských břehů. [founder.GetShortUIName] [Select_CString( founder.IsFemale, 'byla prohlášena', 'byl prohlášen' )] [founder.GetTitleAsNameNoTooltip] [founder.GetPrimaryTitle.GetNameNoTier].\n\nNyní, když jsou všichni Baltové sjednoceni pod jediným praporem, mají obyvatelé Livonska konečně společnou identitu, kolem níž se mohou semknout, a při obraně své vlasti již nejsou rozptýlení a bezradní.\n\nPo tomto sjednocení se zdá, že je Livonsko v bezpečných rukou... prozatím."
 east_europe.0201.a: "Stále jsou to barbaři."
 east_europe.0201.b: "Sláva [founder.GetShortUINameNoTooltip]!"
 east_europe.0201.c: "Sjednocení či rozdělení, Baltové stejně nepřežijí."
 