l_polish:
 iberia_north_africa.0005.t: "Sjednocené Španělsko"
 iberia_north_africa.0005.desc: "Španělské trůny byly opět sjednoceny pod vládou jediného [ROOT.Char.GetTitleAsNameNoTooltip]. Falešní panovníci přišli o své koruny, zatímco hrdé [ROOT.Char.GetPrimaryTitle.GetNameNoTier] je silnější než kdy dříve.\n\nJednoho dne opustím tento svět a odejdu do [ROOT.Char.GetFaith.DivineRealm], ale můj odkaz zůstane na zemi navěky. Budou mi říkat „[ROOT.Char.GetTitledFirstNameNoTooltip], [ROOT.Char.GetMotherFather|U] Španělska“."
 iberia_north_africa.0005.a: "Nastává úsvit nové éry."
 iberia_north_africa.0006.start.desc: "Jedno španělské království za druhým padlo pod vládu [spain_uniter.GetPrimaryTitle.GetNameNoTier]."
 iberia_north_africa.0006.relation_former.desc: "Má postava ve vztahu [ROOT.Char.Custom2('RelationToMe', spain_uniter)] [spain_uniter.GetTitledFirstName]"
 iberia_north_africa.0006.former.desc: "[spain_uniter.GetTitledFirstName]"
 iberia_north_africa.0006.end.desc: "[Select_CString( spain_uniter.IsFemale, 'se prohlásila', 'se prohlásil' )] „[spain_uniter.GetMotherFather|U] Španělska“.\n\nJméno [spain_uniter.GetTitledFirstNameNoTooltip] bude jistě žít po celá staletí, ale bude se na [Select_CString( spain_uniter.IsFemale, 'ni', 'něj' )] vzpomínat jako na hrdinku, nebo tyranku? To ví jen [ROOT.Char.GetFaith.FateGodName]."
 iberia_north_africa.0010.t: "Jednotná Afrika"
 iberia_north_africa.0010.start.desc: "Nikdo nevěřil, že je to možné, a přece zde stojím jako [ROOT.Char.GetTitleAsNameNoTooltip] celé Afriky."
 iberia_north_africa.0010.vassals.desc: "Od pobřeží Atlantiku až po Východní oceán přede mnou nyní sklání hlavu každý kmen, [vassal_1.GetTitleAsNameNoTooltip] i [vassal_2.GetTitleAsNameNoTooltip]."
 iberia_north_africa.0010.spirits.desc: "\n\n[africa_uniter.Custom('DefaultPriestTitlePlural')] mi říkají, že duchové jsou spokojeni. Naše země jsou konečně osvobozeny! Stále nás čeká mnoho práce, ale dnes budeme slavit!"
 iberia_north_africa.0010.ancestors.desc: "\n\n[africa_uniter.Custom('DefaultPriestTitlePlural')] mi říkají, že předkové jsou spokojeni. Naše země jsou konečně osvobozeny! Stále nás čeká mnoho práce, ale dnes budeme slavit!"
 iberia_north_africa.0010.generic.desc: "\n\nMí poddaní pocházejí ze všech vrstev společnosti, ale já nás sjednotím a vytyčím novou cestu. Ode dneška jsme jediným lidem pod ochranou [ROOT.Char.GetFaith.HighGodName]."
 iberia_north_africa.0010.a: "Sláva Africe!"
 iberia_north_africa.0011.start.desc: "Všechny africké národy, od nejmenšího kmene až po nejmocnějšího panovníka, nyní podléhají vládě [africa_uniter.GetPrimaryTitle.GetNameNoTier]."
 iberia_north_africa.0011.relation_former.desc: "Má postava ve vztahu [ROOT.Char.Custom2('RelationToMe', africa_uniter)] [africa_uniter.GetTitledFirstName]"
 iberia_north_africa.0011.former.desc: "[africa_uniter.GetTitledFirstName]"
 iberia_north_africa.0011.end.desc: "[Select_CString( africa_uniter.IsFemale, 'je všechny sjednotila', 'je všechny sjednotil' )] pod [africa_uniter.GetFaith.GetAdjective] praporem.\n\nObstojí tak rozlehlé [africa_uniter.GetPrimaryTitle.GetTierAsNameNoTooltip] ve zkoušce času, nebo se toto spojení nakonec rozpadne? To ví jen [ROOT.Char.GetFaith.FateGodName]."
 decision_unite_africa_confirm: "Sjednotit Afriku"
 iberia_north_africa.0015.t: "Pomsta za mučedníky"
 iberia_north_africa.0015.part1.desc: "Tisíce a tisíce statečných muslimů zemřely na cestě k Tours, na Stezce mučedníků. Bojovali za lepší budoucnost a nový zlatý věk pravověrných. Dnes tato budoucnost konečně nastala."
 iberia_north_africa.0015.part2.desc: "\n\nS pevným předmostím v Evropě mé slavné dobývání teprve začíná..."
 iberia_north_africa.0015.a: "Alláhu akbar."
 iberia_north_africa.0016.t: "Ozvěny minulosti"
 iberia_north_africa.0016.relation_former.desc: "\n\nMá postava ve vztahu [ROOT.Char.Custom2('RelationToMe', avenger)] [avenger.GetTitledFirstName]"
 iberia_north_africa.0016.former.desc: "\n\n[avenger.GetTitledFirstName]"
 iberia_north_africa.0015.islam.desc: "[Select_CString( avenger.IsFemale, 'vedla', 'vedl' )] svá vojska do srdce starého franského království a rozdrtila veškerý odpor. Díky pevnému předmostí v Evropě vypadá budoucnost islámu zářivěji než kdy dříve."
 iberia_north_africa.0016.christianity.a: "Kéž se Pán smiluje nad našimi dušemi."
 iberia_north_africa.0016.generic.desc: "Před mnoha lety ukončila křesťanská franská vojska na cestě k Tours umajjovskou invazi do Evropy. Karel Martel a jeho muži změnili běh dějin.\n\nNic však netrvá věčně. [avenger.GetName] [Select_CString( avenger.IsFemale, 'zavedla', 'zavedl' )] svá vojska hluboko do starého franského království a přivlastnila si je. Díky tomuto pevnému předmostí v Evropě ví jen [ROOT.Char.GetFaith.FateGodName], co [avenger.GetTitledFirstNameNoTooltip] podnikne dál..."
 iberia_north_africa.0001.t: "Portugalské království"
 iberia_north_africa.0001.start.desc: "Na tento den se bude navždy vzpomínat jako na úsvit velkého Portugalského království."
 iberia_north_africa.0001.christian.desc: "Náš lid po staletí trpěl pod muslimskou nadvládou, ale tomu je konec. Díky slavnému dobývání ve jménu [ROOT.Char.GetFaith.WarGodName] jsme konečně svobodným [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] národem!\n\n"
 iberia_north_africa.0001.muslim.desc: "Mocí [ROOT.Char.GetFaith.WarGodName] jsme dobyli tyto země a nyní můžeme hrdě nazývat západní pobřeží Pyrenejského poloostrova svým domovem. Kéž zde [ROOT.Char.GetFaith.GetAdjective] vzkvétají po mnoho dalších let!\n\n"
 iberia_north_africa.0001.end.desc: "V průběhu tisíciletí vládlo těmto zemím mnoho civilizací. Každá přispěla ke složité spletitosti našeho kulturního dědictví. Dnes máme vlastní jedinečnou identitu a se založením tohoto nového království se hrdě nazýváme Portugalci!"
 iberia_north_africa.0001.a: "Nyní začíná naše doba!"
 iberia_north_africa.0002.start.desc: "Na Pyrenejském poloostrově nastala nová éra!"
 iberia_north_africa.0002.relation_former.desc: "Má postava ve vztahu [ROOT.Char.Custom2('RelationToMe', portugal_former)] [portugal_former.GetTitledFirstName]"
 iberia_north_africa.0002.former.desc: "[portugal_former.GetTitledFirstName]"
 iberia_north_africa.0002.end.desc: "[Select_CString( portugal_former.IsFemale, 'založila', 'založil' )] na jeho západním pobřeží Portugalské království. Po staletích migrace a válek povstal hrdý portugalský lid, v jehož čele stojí [portugal_former.GetTitledFirstNameNoTooltip].\n\nDosáhne tento mladý národ slávy, nebo jej pohltí další dobyvačná válka? To ukáže až čas."
 iberia_north_africa.0002.a1: "Ať žije [ROOT.Char.GetFaith.WarGodName]!"
 name_alas: "Běda."
 name_i_see: "Chápu."
 iberia_north_africa.0002.b: "Kéž [ROOT.Char.GetFaith.WarGodName] žehná Portugalsku!"
 iberia_north_africa.0002.c: "Stále jsem [ROOT.Char.GetCulture.GetNameNoTooltip], ať si myslí cokoli."
 iberia_north_africa.9101.t: "Království Kanárských ostrovů"
 iberia_north_africa.9101.desc.intro: "Od nepaměti se každý z ostrovů nazýval „královstvím“, ale nyní, když všem ostrovům svědomitě vládne [canarias_former.GetTitledFirstName], nastal čas sjednotit jejich koruny v jedinou.\n\n"
 iberia_north_africa.9101.desc.iberian: "Po konečné porážce pohanských guančských králů již téměř nic nebrání šíření víry [canarias_former.GetFaith.GetName] mezi obyvateli ostrovů ani upevnění vlády [canarias_former.GetTitledFirstNameNoTooltip]. [title_k_canarias.GetNameNoTierNoTooltip] bylo nyní vyhlášeno jako [title_k_canarias.GetTierAsNameNoTooltip] a [canarias_former.GetName] se [Select_CString( canarias_former.IsFemale, 'stala jeho první', 'stal jeho prvním' )] [canarias_former.GetTitleAsNameNoTooltip]!"
 iberia_north_africa.9101.desc.guanche: "Jak se před námi rozšiřují obzory, vidíme vznik mocných království mnohem větších než kterékoli z našich. Chceme-li odolat cizím nájezdníkům, musíme si sami vybudovat vlastní osud i vlastní korunu. Korunovací [canarias_former.GetName] jako [Select_CString( canarias_former.IsFemale, 'první', 'prvního' )] [canarias_former.GetTitleAsNameNoTooltip] [title_k_canarias.GetNameNoTierNoTooltip] získali obyvatelé ostrovů konečně symbol, který je sjednocuje, i společný cíl zachovat náš způsob života."
 iberia_north_africa.9101.desc.outro: "\n\nBudoucnost [title_k_canarias.GetNameNoTierNoTooltip] zůstává nejistá, ale vyhlášení nového [title_k_canarias.GetTierAsNameNoTooltip] nepochybně zahájí zcela novou éru ostrovů i celé severní Afriky."
 iberia_north_africa.9101.a: "Zrodilo se nové království!"
 iberia_north_africa.9101.b: "Budoucnost [title_k_canarias.GetNameNoTierNoTooltip] leží na Pyrenejském poloostrově!"
 iberia_north_africa.0101.t: "Věrnost stolci svatého Petra"
 iberia_north_africa.0101.desc: "Nebyl to malý úkol, ale mé rodině se podařilo shromáždit dostatek [religious_leader.GetFaith.GetAdjective] zemí i duchovní autority, abychom mohli svolat konkláve našich nejvyšších duchovních. Naše krev, pot a námaha konečně přinesly plody.\n\nShromáždění [religious_leader.GetFaith.PriestNeuterPlural] v [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] se horlivě přou o další směřování. Chodby a síně mé pevnosti zaplňují desítky návrhů a občas i pěstní souboj vyvolaný teologickým sporem. Víme, že chceme zůstat věrní Římu a [pope.GetTitledFirstName], ale na ničem dalším se neshodneme.\n\nPo týdnech bezvýchodných sporů připadá úloha rozhodce mně jako hostiteli a jejich [religious_leader.GetTitleAsNameNoTooltip]."
 iberia_north_africa.0101.a: "Jeden lid, jedna víra!"
 iberia_north_africa.0101.a.tt: "Prosazuješ směřování blíže k $doctrine_pluralism_righteous_name$"
 iberia_north_africa.0101.b: "Při obraně vlastních lidí se #EMP nesmíme#! bát chopit moci."
 iberia_north_africa.0101.b.tt: "Prosazuješ směřování blíže k $doctrine_pluralism_fundamentalist_name$"
 iberia_north_africa.0101.c: "[religious_leader.GetFaith.ReligiousText] bude stále třeba vykládat..."
 iberia_north_africa.0101.c.tt: "Prosazuješ ještě výrazněji $doctrine_pluralism_pluralistic_name$ směřování"
 iberia_north_africa.0102.t: "[religious_leader.GetFaith.GetAdjectiveNoTooltip] $iberia_north_africa.0101.t$"
 iberia_north_africa.0102.desc.intro: "Po celoživotním budování náboženské a politické autority se [religious_leader.GetTitledFirstName] podařilo svolat do hlavního sídla [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] velké konkláve [religious_leader.GetFaith.GetAdjective] duchovních, aby projednali budoucnost víry.\n\nPo týdnech vášnivých debat se shromážděné duchovenstvo rozhodlo znovu potvrdit svou věrnost [pope.GetTitledFirstName], byť s několika... #EMP úpravami#! církevního směřování.\n\nTyto změny se zaměřují především na"
 iberia_north_africa.0102.desc.fundamentalist: "vnímaná příkoří páchaná na věřících a přesvědčení, že jim lze zabránit jedině získáním světské moci všemi dostupnými prostředky."
 iberia_north_africa.0102.desc.righteous: "obrat dovnitř a zajištění náboženské jednoty mezi hlavními kulturami hlásícími se k církvi."
 iberia_north_africa.0102.desc.pluralist: "zavedení přísných zvyklostí a postupů pro studium [religious_leader.GetFaith.ReligiousText] a formálních způsobů, jak zpochybňovat jeho výklad."
 iberia_north_africa.0102.a.same_faith: "Musíme se bránit!"
 iberia_north_africa.0102.a.same_religion: "Považují za hrozbu i #EMP nás#!?"
 iberia_north_africa.0102.a.misc: "To jsou znepokojiví fanatici!"
 iberia_north_africa.0102.b.same_faith: "Víra pro náš vlastní lid!"
 iberia_north_africa.0102.b.same_religion: "Jak sebestředné..."
 iberia_north_africa.0102.b.misc: "Dokud si to nechají pro sebe."
 iberia_north_africa.0102.c.same_faith: "Důkladné studium [religious_leader.GetFaith.ReligiousText] prospívá všem."
 iberia_north_africa.0102.c.same_religion: "Jak zbytečné. Tolik studia, a přesto se stále mýlí..."
 iberia_north_africa.0102.c.misc: "Jejich řešením odklonu od nauky je slovíčkaření o nauce?"
 iberia_north_africa.0111.t: "Osvobození z římských pout"
 iberia_north_africa.0111.desc: "Vybudovat politickou a duchovní jednotu potřebnou ke svolání tohoto konkláve trvalo celé roky, ale konečně jsem pod své prapory získal dostatek prostého lidu i duchovenstva, abych mohl skutečně zavrhnout falešného [pope.GetTitledFirstName].\n\nChodby a pokoje pro hosty v [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] již nyní zaplňují hádaví duchovní a rozvášnění biskupové. Mé síně ucpává každý ukřivděný mnich a bezvýznamný [religious_leader.GetFaith.PriestNeuter], kterého kdy Řím odmítl.\n\nVšechny tyto debaty jsou nezbytné pro naši legitimitu, ale jako nejvýznamnější [religious_leader.GetFaith.GetAdjective] vládce nakonec rozhodnu #EMP já#!."
 iberia_north_africa.0111.a: "Syn Boží učil míru a my jej budeme následovat."
 iberia_north_africa.0111.a.tt: "$iberia_north_africa.0101.a.tt$"
 iberia_north_africa.0111.b: "I bez Říma víme, jak důležité je bránit vlastní lid!"
 iberia_north_africa.0111.b.tt: "$iberia_north_africa.0101.b.tt$"
 iberia_north_africa.0111.c: "Není snad islám také náboženstvím Knihy?"
 iberia_north_africa.0111.c.tt: "$iberia_north_africa.0101.c.tt$"
 mozarabic_break_with_rome_decision.tt.you_gain_a_hof: "Pro víru [religious_leader.GetFaith.GetName] bude vytvořen nový [Concept('title','titul')|E] [Concept('head_of_faith','hlavy víry')|E] stejné [Concept('faith','víry')|E]"
 mozarabic_break_with_rome_decision.tt.new_hof_id: "[new_religious_head.GetTitledFirstName] je tvou novou [Concept('head_of_faith','hlavou víry')|E]"
 iberia_north_africa.0112.t: "[religious_leader.GetFaith.GetAdjectiveNoTooltip] církev se odštěpila od [pope.GetFaith.GetNameNoTooltip]"
 iberia_north_africa.0112.desc.intro: "S velkým úsilím [religious_leader.GetTitledFirstName] konečně završil celoživotní dílo a získal dostatek politické i duchovní autority, aby sjednotil [religious_leader.GetFaith.GetAdjective] církev za jediným cílem, kterým je rozchod s nařízeními [pope.GetTitledFirstName].\n\nDoprovodný církevní koncil provázely bouřlivé debaty o tom, jak zaplnit prázdnotu po římské nadvládě. Někteří duchovní se údajně otevřeně prali v síních [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier].\n\nPatovou situaci prolomil až zásah postavy [religious_leader.GetTitledFirstNameNoTooltip], po němž se koncil rozhodl zaměřit na"
 iberia_north_africa.0112.desc.fundamentalist: "násilné převzetí úlohy ochránce poutí k [religious_leader.GetFaith.GetAdjectiveNoTooltip] svatým místům."
 iberia_north_africa.0112.desc.righteous: "ústup od hříšného násilí, které podle [religious_leader.GetTitledFirstNameNoTooltip] zachvátilo značnou část náboženství [religious_leader.GetFaith.GetReligion.GetName].\n\nPodle [religious_leader.GetTitledFirstNameNoTooltip] by se [religious_leader.GetFaith.GetAdherentNamePluralNoTooltip] měli soustředit na zbožnost pramenící z řádného života, nikoli dláždit cestu do [religious_leader.GetFaith.PositiveAfterLife] krví nevěřících."
 iberia_north_africa.0112.desc.pluralist: "uvolnění omezení a zákazů, které brání snadnějšímu soužití s muslimskými sousedy, a podporu ekumenického přístupu k mezináboženským vztahům."
 iberia_north_africa.0112.a.same_faith: "Při [religious_leader.GetFaith.HighGodName] a našem právu!"
 iberia_north_africa.0112.a.same_religion: "Raději ať nám nezakazují přístup k #EMP našim#! svatým místům."
 iberia_north_africa.0112.a.misc: "Zdá se, že se přou o slovíčka..."
 iberia_north_africa.0112.b.same_faith: "Síla skrze mír!"
 iberia_north_africa.0112.b.same_religion: "Nejspíš si myslí, že jsou lepší než my..."
 iberia_north_africa.0112.b.misc: "Jsem zvědavý, jak #EMP tohle#! dopadne..."
 iberia_north_africa.0112.c.same_faith: "Máme toho společného mnohem více, než nás rozděluje."
 iberia_north_africa.0112.c.same_religion: "Znepokojivé..."
 iberia_north_africa.0112.c.islam: "Snad je to první krok ke skutečné konverzi..."
 iberia_north_africa.0112.c.misc: "Je to tedy hybridní víra?"
 iberia_north_africa.0121.t: "Návrat na venkov"
 iberia_north_africa.0121.desc.intro: "Není žádným tajemstvím, že jsem měl se svou [old_faith.GetAdjective] vírou... potíže."
 iberia_north_africa.0121.desc.excommunicated: "Exkomunikace mě těžce zasáhla, nespravedlivě zatížila mou duši a přinesla nekonečné spory s ostatními [old_faith.GetAdherentNamePluralNoTooltip] v mém životě."
 iberia_north_africa.0121.desc.rivalry_with_hof: "Neustálé spory s [old_faith.GetReligiousHead.GetTitledFirstName] mě připravily o iluze. Jde přitom o malicherný světský spor, nad který by se [old_faith.GetReligiousHead.GetTitledFirstNameNoTooltip] #EMP měl#! povznést."
 iberia_north_africa.0121.desc.negative_piety_level: "Mé skutky ze mě učinily hříšníka, kterého je jeho vlastní víra ochotna ponechat stranou duchovního života. Nelze popřít, jak osaměle jsem se kvůli tomu cítil."
 iberia_north_africa.0121.desc.lorgar: "Přestože oheň mé víry plane stejně jasně jako Slunce, nedokážu se zbavit pocitu, že ve vesmíru musí být něco #EMP víc#! než jen [old_faith.HighGodName]. Nějaká prapůvodnější pravda."
 iberia_north_africa.0121.desc.sinful_traits: "Mám pocit, že každý můj skutek, každá myšlenka i samotný způsob mého života jsou považovány za neodmyslitelně hříšné."
 iberia_north_africa.0121.desc.virtuous_basque_pagan_traits: "Někdy přemýšlím, jak jsem tuto víru vůbec mohl milovat, když se zdá, že celá má povaha byla #EMP stvořena#! pro něco jiného."
 iberia_north_africa.0121.desc.naked_cynicism: "Připadá mi nezajímavá a co hůř, zcela podřízená silám, nad nimiž nemám téměř žádnou kontrolu."
 iberia_north_africa.0121.desc.outro: "\n\nNakonec jsem však nalezl útěchu ve víře [basque_faith.GetName]. Venkovští synkretisté této malé sekty mě neodsuzují. Naopak překypují nadšením z možnosti stát se něčím víc než jen strážci místních pověstí.\n\nNadšením, díky němuž by možná mohli být otevření... návrhům."
 iberia_north_africa.0121.a: "[basque_faith.GetNameNoTooltip] se opět stane vírou válečníků!"
 iberia_north_africa.0121.a.tt: "Prosazuješ směřování blíže k $doctrine_pluralism_fundamentalist_name$"
 iberia_north_africa.0121.b: "Soulad s přírodou je lepší než soulad se sousedy."
 iberia_north_africa.0121.b.tt: "Prosazuješ směřování blíže k $doctrine_pluralism_righteous_name$"
 iberia_north_africa.0121.c: "Existují hodnotnější náboženství, s nimiž můžeme sdílet tradice."
 iberia_north_africa.0121.c.tt: "Prosazuješ jinou podobu $doctrine_pluralism_pluralistic_name$ směřování"
 iberia_north_africa.0121.d: "Když se pokusím změnu vynutit, budu snad méně zkažený než [old_faith.GetNameNoTooltip]?"
 iberia_north_africa.0121.d.tt: "Ponecháš víru v její současné podobě"
 iberia_north_africa.0122.t: "$iberia_north_africa.0121.t$"
 iberia_north_africa.0122.desc.intro: "Zdá se, že [religious_leader.GetTitledFirstName]"
 iberia_north_africa.0122.desc.excommunicated: "už nedokáže snášet exkomunikaci z víry [old_faith.GetName]."
 iberia_north_africa.0122.desc.rivalry_with_hof: "[Select_CString( religious_leader.IsFemale, 'dovedla', 'dovedl' )] svůj spor s [old_faith.GetReligiousHead.GetTitledFirstName] k nevyhnutelnému bodu varu."
 iberia_north_africa.0122.desc.negative_piety_level: "se chystá svým příštím proviněním zastínit všechny předchozí prohřešky proti víře [old_faith.GetName]."
 iberia_north_africa.0122.desc.lorgar: "[Select_CString( religious_leader.IsFemale, 'podlehla', 'podlehl' )] příliš silné touze věřit v něco více... #EMP prapůvodního#!, která [Select_CString( religious_leader.IsFemale, 'ji', 'jej' )] svedla na cestu kacířství."
 iberia_north_africa.0122.desc.sinful_traits: "nakonec zcela [Select_CString( religious_leader.IsFemale, 'podlehla', 'podlehl' )] svým hříšným sklonům na úkor [old_faith.GetAdjective] víry."
 iberia_north_africa.0122.desc.virtuous_basque_pagan_traits: "nakonec zcela [Select_CString( religious_leader.IsFemale, 'podlehla', 'podlehl' )] pozvolnému vábení ctností venkovského života."
 iberia_north_africa.0122.desc.naked_cynicism: "už vůbec nedokáže ovládat svou očividnou touhu získat větší moc nad duchovním životem svého panství."
 iberia_north_africa.0122.desc.midtro: "\n\nV záchvatu nepochybného šílenství [religious_leader.GetTitleAsNameNoTooltip|U] [Select_CString( religious_leader.IsFemale, 'povýšila', 'povýšil' )] neznámou synkretickou lidovou víru z Pyrenejí, [basque_faith.GetName], na hlavní náboženství [religious_leader.GetPrimaryTitle.GetNameNoTier].\n\n"
 iberia_north_africa.0122.desc.fundamentalist: "Ačkoli byla tato mladá sekta původně mírumilovná, [religious_leader.GetTitledFirstNameNoTooltip] ji [Select_CString( religious_leader.IsFemale, 'vybičovala', 'vybičoval' )] k zuřivému fanatismu a slíbila jejím stoupencům válečnickou odměnu v podobě kořisti a plenění, podpoří-li její fundamentalistické tažení."
 iberia_north_africa.0122.desc.righteous: "Ve snaze odpoutat malou sektu od jejího těsného spojení s křesťanstvím [religious_leader.GetTitledFirstNameNoTooltip] prosazuje návrat k těm částem jejích mýtů, které považuje za prokazatelně pohanštější."
 iberia_north_africa.0122.desc.pluralist: "Přestože sekta po staletí přejímala prvky křesťanství, [religious_leader.GetTitledFirstNameNoTooltip] využívá svůj značný vliv k zavádění soupeřících prvků islámu a všude, kde může, maže, nahrazuje a upravuje nazaretské obřady."
 iberia_north_africa.0122.desc.unchanged: "Navzdory náhlému přívalu nové teologické pozornosti zůstala sekta v podstatě nezměněná a nadále spojuje převzatá křesťanská dogmata s tradiční vaskonskou mytologií."
 iberia_north_africa.0122.a: "Vlastně si myslím, že možná má pravdu..."
 iberia_north_africa.0122.b.same_faith: "To je zatracené kacířství!"
 iberia_north_africa.0122.b.same_religion: "To může skončit jedině jejich zkázou."
 iberia_north_africa.0122.b.respects_fellow_warmongers: "Alespoň se nebojí pořádného boje."
 iberia_north_africa.0122.b.misc: "Dokud budou bojovat daleko odsud."
 iberia_north_africa.0122.c.same_faith: "[religious_leader.GetFirstNameNoTooltip] [Select_CString( religious_leader.IsFemale, 'opustila', 'opustil' )] [old_faith.HighGodName] kvůli nějakým trouchnivějícím hájům?!"
 iberia_north_africa.0122.c.same_religion: "Myslí si snad [religious_leader.GetFirstNameNoTooltip], že je #EMP lepší#! než my?"
 iberia_north_africa.0122.c.believes_in_harmony_with_nature: "Alespoň chápou krásu přírody."
 iberia_north_africa.0122.c.misc: "Takže teď mluví za stromy?"
 iberia_north_africa.0122.d.muslim: "Alespoň mají [basque_faith.GetAdherentNamePluralNoTooltip] blíže k náboženství [islam_religion.GetNameNoTooltip]."
 iberia_north_africa.0122.d.same_faith: "Opustili nás hned dvakrát!"
 iberia_north_africa.0122.d.same_religion: "Neslýchané!"
 iberia_north_africa.0122.d.syncretised_with_islam: "Alespoň zcela nepřišli o rozum."
 iberia_north_africa.0122.d.misc: "Nu, není to můj svátek ani moji tančící medvědi."
 iberia_north_africa.0122.e.same_faith: "Tak #EMP takhle#! vypadá tolerance."
 iberia_north_africa.0122.e.same_religion: "Znepokojivé..."
 iberia_north_africa.0122.e.syncretised_with_christianity: "$iberia_north_africa.0122.d.syncretised_with_islam$"
 iberia_north_africa.0122.e.misc: "Upřímně řečeno jde o docela všední změnu."
 iberia_north_africa.0131.t: "Děti řeky Ebro"
 iberia_north_africa.0131.desc.intro: "Založením [k_aragon.GetDefinitiveName] jsem podnítil bouřlivé šíření [aragonese_culture.GetName] kultury v městech a městečkách svého panství. Nejen v našem srdci v $d_aragon$, ale také v"
 iberia_north_africa.0131.desc.duchy.one: "[duchy_a.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.duchy.two: "[duchy_a.GetBaseNameNoTier] a [duchy_b.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.duchy.three: "[duchy_a.GetBaseNameNoTier], [duchy_b.GetBaseNameNoTier] a [duchy_c.GetBaseNameNoTier]"
 iberia_north_africa.0131.desc.outro: " se vliv mého nově vzniklého lidu šíří široko daleko.\n\nPřesto... nemohu si pomoci a některé zvyky [founder_culture.GetName] kultury mi chybějí. Její ústřední úloha v mém životě možná skončila, ale díky mému vlivu a postavení nemusí zmizet úplně."
 form_the_kingdom_of_aragon_decision.tt.x_random_counties_in_d_aragon: "3 náhodná [Concept('counties','hrabství')|E] v $d_aragon$:"
 iberia_north_africa.0131.a: "Tito lidé jsou mým lidem a to mi stačí."
 iberia_north_africa.0131.b: "Ne všechny zvyklosti [founder_culture.GetNameNoTooltip] kultury jsou tak špatné..."
 iberia_north_africa.0131.c: "To, na čem nám skutečně záleží, se nezměnilo."
 iberia_north_africa.0131.d: "Ať se svět mění jakkoli, nesmíme zapomenout na své kořeny!"
 iberia_north_africa.2105.t: "Vládci Středomoří"
 iberia_north_africa.2105.desc: "Dobytím [mallorca.GetNameNoTier], [sardinas.GetNameNoTier] a [sicily.GetNameNoTier] jsme se prohlásili za právoplatné vládce Středozemního moře. Poslové vypluli do všech koutů světa, aby oznámili méně významným vládcům náš slavný úspěch.\n\nToto moře i vše, čeho se dotýká, patří nám!"
 iberia_north_africa.2105.a: "Nikdo se nám nemůže postavit!"
 iberia_north_africa.fp2_golden_age_generic_title_intro: "Věda zlatého věku:"
 iberia_north_africa.2001.t: "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Zapomenuté vědění"
 iberia_north_africa.2001.desc: "Po zprávě, že podporuji vědy, ke mému dvoru [Select_CString( generated_actor.IsFemale, 'dorazila proslulá překladatelka', 'dorazil proslulý překladatel' )] [generated_actor.GetFullName]. [generated_actor.GetFirstNameNoTooltip] prohlásí: „Pokud hledáš poznání, to nejlepší nalezneš ve starých knihách. Přestože bylo zapomenuto, není o nic méně pravdivé.“\n\n„Mám s sebou mnoho dosud nepřeložených knih. Když mě podpoříš, jistě z toho budeš mít prospěch i ty!“"
 iberia_north_africa.2001.a: "Nebudu šetřit na"
 iberia_north_africa.2001.a.learning: "filozofických"
 iberia_north_africa.2001.a.martial: "vojenských"
 iberia_north_africa.2001.a.stewardship: "hospodářských"
 iberia_north_africa.2001.a.diplointrigue: "rétorických"
 iberia_north_africa.2001.a.end: "spisech."
 iberia_north_africa.2001.a.a: "Požádáš o knihu, která ti pomůže zlepšit tvou nejnižší [Concept('skill','dovednost')|E]."
 iberia_north_africa.2001.b: "Získáváš mou záštitu. Přines mi něco užitečného."
 iberia_north_africa.2001.b.a: "[generated_actor.GetFirstNameNoTooltip] ti dá náhodnou knihu zlepšující některou [Concept('skill','dovednost')|E]"
 iberia_north_africa.2001.c: "K čemu by mi byly staré knihy? Historie nemá ve vědě místo!"
 iberia_north_africa.2002.t: "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Operace podle hvězd"
 iberia_north_africa.2002.desc: "„Můj lenní pane, prosím, přiměj toho blázna, aby mě vyslechl! Tento ranhojič mi operoval šedý zákal na pravém oku, ale teď odmítá napravit levé!“ zvolá [patientzero.GetTitledFirstName]. „Operace uspěla jen proto, že postavení hvězd bylo dokonalé. Na další úspěšný zákrok #italic musíš#! počkat dvanáct let!“ podrážděně odpoví [generated_actor.GetFirstName].\n\nJako vládce musím takové spory rozhodovat. Mám astrologii pominout a riskovat zpackanou operaci?"
 iberia_north_africa.2002.a: "Tohle je skvělá příležitost, aby se [child_offering.GetFirstNameNoTooltip] [Select_CString( child_offering.IsFemale, 'přiučila', 'přiučil' )] lékařství!"
 iberia_north_africa.2002.a.flavor: "Nabídneš své dítě [child_offering.GetFirstName] jako pomocníka při operaci šedého zákalu metodou odsátí, kterou podstoupí [patientzero.GetFirstName]."
 iberia_north_africa.2002.a.a: "[child_offering.GetFirstName] pomáhá při operaci"
 iberia_north_africa.2002.a.b: "Výsledek operace šedého zákalu"
 iberia_north_africa.2002.b: "Hvězdy nemají na tvé schopnosti žádný vliv. Operuj!"
 iberia_north_africa.2002.b.a: "Nařídíš provést operaci, přestože znáš její rizika."
 iberia_north_africa.2002.c: "Vskutku, možná bude nejlepší počkat na příznivé podmínky."
 iberia_north_africa.2002.d: "#italic Vlastně#!, když se na to podíváš #italic takhle#!, hvězdy stojí dokonale!"
 iberia_north_africa.2003.t: "$iberia_north_africa.fp2_golden_age_generic_title_intro$ Neslučitelné povahy"
 iberia_north_africa.2003.desc: "Od udělení mé záštity prošlo [playerprovince.GetNameNoTooltip] mnoho učenců, zvláště mě však zaujala jedna dvojice. Možná díky mimořádnému intelektu obou, možná proto, že #italic nedokážou zavřít ústa#! a neustále se přímo uprostřed mého dvora přou o nepatrné rozdíly ve svém přesvědčení. „#italic Odmítám#! pracovat s někým tak pošetilým, jako je [generated_actor_r.GetFirstName]!“ zvolá [generated_actor_k.GetFirstName], načež [generated_actor_r.GetFirstName] odpoví: „Mně to vyhovuje. Nikdy bych nepracoval s někým tak umíněným jako #italic ty!#!“\n\n„[ROOT.Char.GetTitledFirstName], čemu věříš ty? Je úkolem filozofa vysvětlovat přírodní svět, nebo to spadá pod autoritu proroka?“"
 iberia_north_africa.2003.a: "Ve skutečnosti to spadá pod #ber mou#! autoritu. A teď se dejte do práce."
 iberia_north_africa.2003.a.flavor: "Urazíš oba učence a jejich pohrdání obrátíš proti sobě namísto proti nim navzájem."
 iberia_north_africa.2003.b: "Samozřejmě filozofům. Poslední slovo mají mít moudří mužové jako Aristoteles."
 iberia_north_africa.2003.c: "Jak můžeš věřit filozofům, když nevěříš Ezechielovi?"
 iberia_north_africa.fp2_pilgrim_roads_generic_title_intro: "Poutnické cesty:"
 iberia_north_africa.2011.t: "$iberia_north_africa.fp2_pilgrim_roads_generic_title_intro$ Bloudící válečník"
 iberia_north_africa.2011.desc: "Při putování krajem [chosen_location_for_pilgrim_roads.GetName] narazím na mohutný strom, který mě svým chladivým stínem tiše láká k odpočinku. Pod jeho korunou již odpočívá [generated_actor.GetWomanMan], a tak se posadím poblíž. „Jsi poutník?“ zeptám se."
 iberia_north_africa.2011.desc_merge_into: "Zpod stromu zazní odpověď."
 iberia_north_africa.2011.desc_soldier: "$iberia_north_africa.2011.desc_merge_into$ „Jsem jen [Select_CString( generated_actor.IsFemale, 'zbloudilá válečnice', 'zbloudilý válečník' )] jménem [generated_actor.GetName]. Přicházím navštívit [chosen_holy_site_for_pilgrim_roads.GetNameNoTier], abych zjistil, proč mě [generated_actor.GetFaith.HighGodName] opustil a kam mám příště obrátit své ostří.“"
 iberia_north_africa.2011.desc_captain: "$iberia_north_africa.2011.desc_merge_into$ „Možná ano. Spíše se však považuji za ztracenou duši. Jmenuji se [generated_actor.GetName] a dříve jsem [Select_CString( generated_actor.IsFemale, 'velela', 'velel' )] svatému řádu. Nyní bloudím světem a hledám [generated_actor.GetFaith.HighGodName] i vyšší poslání, jemuž bych [Select_CString( generated_actor.IsFemale, 'mohla', 'mohl' )] sloužit.“"
 iberia_north_africa.2011.a: "[generated_actor.GetFaith.HighGodName] tě jistě volá do mých řad, [generated_actor.GetFirstNameNoTooltip]."
 iberia_north_africa.2011.b: "[generated_actor.GetFaith.HighGodName] nepochybně chce, abys dál putoval světem a hledal nepřátele."
 iberia_north_africa.2011.b.flavor: "Povzbudíš [generated_actor.GetFirstNameNoTooltip], aby [Select_CString( generated_actor.IsFemale, 'pokračovala', 'pokračoval' )] v osamělém boji za [generated_actor.GetFaith.HighGodName] a šířil dobrou pověst o tvé povaze."
 iberia_north_africa.2011.c: "Na konci pouti jistě najdeš [generated_actor.GetFaith.HighGodName]."
 iberia_north_africa.2011.c.flavor: "Necháš [generated_actor.GetFirstNameNoTooltip], aby bez vyrušení [Select_CString( generated_actor.IsFemale, 'pokračovala', 'pokračoval' )] ve své službě [generated_actor.GetFaith.HighGodName]."
 iberia_north_africa.2012.t: "$iberia_north_africa.fp2_pilgrim_roads_generic_title_intro$ Zchudlý student"
 iberia_north_africa.2012.desc: "Při putování po nově vybudovaných cestách v [chosen_location_for_pilgrim_roads.GetName] spatřím, že na milníku sedí mladý [generated_actor.GetWomanMan] se zachmuřenou tváří a prázdným měšcem v ruce. Otočí se ke mně a zeptá se: „[ROOT.Char.Custom2('RelationToMeAddress', generated_actor)], nedal bys minci studentovi na pouti? "
 iberia_north_africa.2012.desc_student: "Studuji teologii a toužím lépe porozumět světu, který nám daroval [generated_actor.GetFaith.HighGodName]. Za tvou pomoc ti jako druhovi ve víře [generated_actor.GetFaith.GetAdjective] mohu dokonce darovat své cestovní zápisky!“"
 iberia_north_africa.2012.desc_architect: "Studuji architekturu a přicházím z veliké dálky, abych spatřil zachovalá díla v [chosen_holy_site_for_pilgrim_roads.GetNameNoTier] a poučil se z nich. Tomuto řemeslu jsem zcela oddán. Když mi dáš nějaké mince, daruji ti své spisy o architektuře!“"
 iberia_north_africa.2012.a: "Ty znalosti by se mi hodily. Dobrá, souhlasím s výměnou."
 iberia_north_africa.2012.b: "Možná by sis měl najít práci."
 iberia_north_africa.2012.b.flavor: "Nabídneš studentovi dobré místo u svého dvora a zcela jej tím překvapíš."
 iberia_north_africa.2012.c: "Žádné smlouvání. Jako [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] mám povinnost ti pomoci."
 iberia_north_africa.2013.t: "[Select_CString( ROOT.Char.IsFemale, 'Té', 'Tomu' )], kdo vydláždil cestu poutníkům"
 iberia_north_africa.2013.desc: "Odvedl jsi příkladnou práci na doslovných základech potřebných ke zpřístupnění svatého místa [chosen_holy_site_for_pilgrim_roads.GetNameNoTierNoTooltip]. Za to tě musím odměnit.\n\nŘekni mi, po čem toužíš?"
 iberia_north_africa.2013.a: "Tvá chvála mi sama stačí, [fp2_iberia_north_africa_2013_head_of_faith.GetFaith.ReligiousHeadName]."
 iberia_north_africa.2013.b: "Rozhlaš mé skutky vykonané ve jménu [ROOT.Char.GetFaith.HighGodName]."
 iberia_north_africa.2013.c: "Ať se každý válečník dozví o mé oddanosti víře [ROOT.Char.GetFaith.GetNameNoTooltip]."
 iberia_north_africa.2013.d: "Daruj mi artefakt hodný vystavení v [chosen_holy_site_for_pilgrim_roads.GetNameNoTierNoTooltip]."
 iberia_north_africa.2013.d.tooltip: "[fp2_iberia_north_africa_2013_head_of_faith.GetTitledFirstName] ti daruje požehnaný [Concept('artifact','artefakt')|E]"
 iberia_north_africa.2013.notif.t: "Stezky zbožnosti"
 struggle_iberia_form_portugal_decision_correct_phase_tt: "Současnou [Concept('struggle_phase','fází sváru')|E] je [struggle_phase_iberia_opportunity|E]"
 iberia_north_africa.2100.t: "Obnovení staré Vaskonie"
 iberia_north_africa.2100.desc: "Po celá staletí jsme my Baskové s odhodláním a houževnatostí neústupně snášeli své útrapy. Jako bychom byli vytesáni z prastaré pyrenejské skály, odolávali jsme nesčetným invazím a čekali na vhodný okamžik k úderu.\n\nTyto temné časy jsou za námi a konečně se nám podařilo získat zpět země našich předků, které jsou nyní srdcem nového svobodného království [GetTitleByKey('k_navarra').GetNameNoTier].\n\nPo těch nejkrutějších lekcích dějin přísahám, že se již nikdy nenecháme vyhnat ze svých domovů."
 iberia_north_africa.2100.a: "Pod mým vedením dokážeme cokoli!"
 iberia_north_africa.2100.b: "Už se nikdy nenecháme zastrašit!"
 iberia_north_africa.2101.desc: "Baskové byli po celá staletí postupně zatlačováni do Pyrenejí a ze všech stran sužováni postupujícími nájezdníky.\n\nNyní, když byla získána zpět značná část domoviny předků [founder.GetTitledFirstNameRegnal], se [founder.GetTitledFirstNameRegnal] [Select_CString( founder.IsFemale, 'prohlásila', 'prohlásil' )] za „[founder.Custom('QueenKing')] [GetTitleByKey('k_navarra').GetNameNoTier]“ a nárokuje si ztracená území jako součást nového baskického království.\n\nSousední národy považují tento obrat osudu jen za odchylku v dějinách oblasti a jistě vyhlížejí první příležitost, jak tuto potupu napravit..."
 iberia_north_africa.2101.b: "Měli zůstat v horách!"
 iberia_north_africa.2101.c: "To je vskutku překvapení."
