l_polish:
 major_decisions.1001.t: "Božské maso"
 major_decisions.1001.desc: "„Byli jsme sesláni na tento svět, abychom sloužili bližním,“ pronese přes celou jídelní síň [court_chaplain.GetCouncilTitle] [court_chaplain.GetName]."
 major_decisions.1001.desc_landless: "„Sloužit bližním... Co to vlastně obnáší?“ zeptám se řečnicky a ostrým pohledem přejíždím po tvářích svých stoupenců u stolu překypujícího jídlem. „Neznamená to snad milovat člověka a pečovat o každý kousek jeho bytosti?“"
 major_decisions.1001.desc_outro: "\n\n„Přijetím daru masa přijímáte také [ROOT.Char.GetFaith.HighGodHerHis|U] lásku.“\n\nSlužebnictvo, tedy ti, kteří jsou ještě mezi námi, odvedlo znamenitou práci. Hodujeme dlouho do noci a opájíme se [ROOT.Char.Custom('RegionalDrink')] i chutí lidského božství."
 major_decisions.1001.a: "Podejte mi ruku a další [ROOT.Char.Custom('RegionalDrink')]!"
 major_decisions.1002.t: "Hrůzná hostina"
 major_decisions.1002.desc: "Nemohu uvěřit tomu, co slyším. Celý dvůr [cannibal.GetName], dokonce i [cannibal.GetHerHis] [court_chaplain.GetCouncilTitle], propadl kanibalismu!\n\nUlice rudnou krví, zatímco [cannibal.GetHerHis] pekelná družina hoduje."
 major_decisions.1002.desc_landless: "Nemohu uvěřit tomu, co slyším. Celý [cannibal.Custom('GetCourt')|l] [cannibal.GetName] propadl kanibalismu!\n\nVenkov zrudne krví, zatímco [cannibal.GetHerHis] pekelná družina hoduje."
 major_decisions.1002.desc_cannibal: "[cannibal.GetName] [Select_CString( cannibal.IsFemale, 'přesvědčila', 'přesvědčil' )] svého [court_chaplain.GetCouncilTitle], aby se veřejně přihlásil ke kanibalismu.\n\nTěší mě, že se záliba v lidském mase šíří dál než kdy dříve!"
 major_decisions.1002.desc_cannibal_landless: "[cannibal.GetName] se svým [cannibal.Custom('GetCourt')|l] veřejně přijali zázrak kanibalismu.\n\nNeobracejme se k [cannibal.GetTitledFirstNameNoTooltip] zády. Těší mě, že se záliba v lidském mase šíří dál než kdy dříve!"
 major_decisions.1002.a: "Nemohu se dočkat, až spolu povečeříme!"
 major_decisions.1002.b: "Kéž se [ROOT.Char.GetFaith.HighGodName] smiluje nad jejich zkaženými dušemi!"
 major_decisions.1101.t: "Panství překované"
 major_decisions.1101.opening_duchies: "Dokázal jsem to, co nikdo jiný. Sjednotil jsem země [duchy_1.GetNameNoTierNoTooltip] se zeměmi [duchy_2.GetNameNoTierNoTooltip] a [duchy_3.GetNameNoTierNoTooltip]."
 major_decisions.1101.desc: "Celý život jsem pracoval pro tento okamžik. Svolám své vazaly a nechám je znovu přísahat věrnost.\n\nNyní i navěky mi budou vzdávat hold nejen jako svému lennímu pánovi, ale také jako [ROOT.Char.GetTitleAsNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip] [new_title.GetNameNoTier]!"
 major_decisions.1101.a: "Mé panství přetrvá navěky."
 major_decisions.1101.i_have_become_royal: "[Select_CString( founder.IsFemale, 'Stala ses', 'Stal ses' )] [founder.GetTitleAsNameNoTooltip] [new_title.GetNameNoTier]"
 major_decisions.1102.desc: "[founder.GetTitledFirstName] [Select_CString( founder.IsFemale, 'svolala', 'svolal' )] své vazaly i všechny služebníky panství. Víme, že nadešel čas, a nikdo tento nárok nezpochybní.\n\n[founder.GetFirstName] bude vládnout jako [new_title.GetTierAsNameNoTooltip] velkolepému panství [new_title.GetNameNoTier]!"
 major_decisions.1102.a: "Ať žije [founder.GetTitleAsNameNoTooltip]!"
 major_decisions.1102.a.dislike: "Ať žije [founder.GetTitleAsNameNoTooltip]..."
 major_decisions.1102.has_become_royal: "[founder.GetFirstName] se [Select_CString( founder.IsFemale, 'stala', 'stal' )] [founder.GetTitleAsNameNoTooltip] [new_title.GetNameNoTier]"
 major_decisions.1103.opening_kingdoms: "Dokázal jsem to, co nikdo jiný. Sjednotil jsem země [kingdom_1.GetNameNoTierNoTooltip] se zeměmi [kingdom_2.GetNameNoTierNoTooltip] a [kingdom_3.GetNameNoTierNoTooltip]."
 major_decisions.1103.opening: "Všichni mí vazalové a [ROOT.Char.GetFaith.PriestNeuterPlural] se konečně shromáždili před mým trůnem. Tento okamžik jsem si zasloužil v jejich očích, a co je důležitější, také v očích [ROOT.Char.GetFaith.PantheonTerm]."
 major_decisions.1103.i_am_religious_head: "\n\nJe jen správné, abych si korunu [Select_CString( ROOT.Char.IsFemale, 'nasadila sama', 'nasadil sám' )], zatímco se přede mnou sklánějí mí světští i duchovní služebníci."
 major_decisions.1103.blessed_by_religious_head: "\n\nKdyž mi [religious_figure.GetTitledFirstName] vkládá korunu na hlavu, vyhlašuji svou novou říši. Mí vazalové se přišli stát svědky tohoto okamžiku a jakmile má slova zaznějí, veškerá světská i duchovní moc mého panství přede mnou poklekne."
 major_decisions.1103.a: "[new_title.GetNameNoTierNoTooltip] bude vládnout všem!"
 major_decisions.1104.opening: "[founder.GetFirstName], náš [founder.GetLadyLord] a vládce, svolává všechny vazaly a [founder.GetFaith.PriestNeuterPlural] panství. Nemohu zpochybnit, že si tento okamžik právem zaslouží v očích [ROOT.Char.GetFaith.PantheonTerm]."
 major_decisions.1104.i_am_religious_head: "\n\nKdyž [Select_CString( founder.IsFemale, 'jí', 'mu' )] vkládám novou korunu na hlavu,"
 major_decisions.1104.religious_head_empire: "\n\nKdyž si [founder.GetTitledFirstName] vkládá novou korunu na hlavu,"
 major_decisions.1104.blessed_by_religious_head: "\n\n\n\nKdyž [religious_figure.GetTitledFirstName] vkládá [Select_CString( founder.IsFemale, 'jí', 'mu' )] novou korunu na hlavu,"
 major_decisions.1104.end: "[founder.GetFirstName] prohlašuje tento okamžik za počátek svého nového panství. Všichni služebníci se před [Select_CString( founder.IsFemale, 'ní', 'ním' )] uctivě sklánějí."
 major_decisions.1104.a: "[new_title.GetNameNoTierNoTooltip] bude žít navěky!"
 major_decisions.1105.t: "Panství uzurpátora"
 major_decisions.1105.desc: "„[founder.GetTitleAsNameNoTooltip]“ [founder.GetFirstName] z [new_title.GetNameNoTierNoTooltip] [Select_CString( founder.IsFemale, 'vyhlásila', 'vyhlásil' )] nové království a tvrdí, že jeho součástí je i část #EMP mého#! právoplatného území!"
 major_decisions.1105.a: "Ten samozvanec dlouho nevydrží..."
 major_decisions.2001.t: "Univerzita"
 major_decisions.2001.desc_first: "Nastává nový věk poznání! Setkávám se s nepřetržitým proudem stavitelů a učenců a plány na velkolepou univerzitu začínají nabývat podoby.\n\n"
 major_decisions.2001.desc_more: "Stavitel mě informuje, že cihly pro univerzitu jsou připraveny k položení. Zbývá rozhodnout už jen o místě a názvu!"
 major_decisions.2001.desc: "Stavitel mě informuje, že cihly pro univerzitu jsou připraveny k položení. Zbývá rozhodnout už jen o názvu!"
 major_decisions.2001.b_fes: "Založím univerzitu al-Karavijín!"
 major_decisions.2001.b_cairo: "Založím univerzitu al-Azhar!"
 major_decisions.2001.b_bologna: "Založím Boloňskou univerzitu!"
 major_decisions.2001.b_salamanca: "Založím Salamanskou univerzitu!"
 major_decisions.2001.b_madrid: "Založím Madridskou univerzitu Complutense!"
 major_decisions.2001.b_oxford: "Založím Oxfordskou univerzitu!"
 major_decisions.2001.b_cambridge: "Založím Cambridgeskou univerzitu!"
 major_decisions.2001.b_padua: "Založím Padovskou univerzitu!"
 major_decisions.2001.b_siena: "Založím Sienskou univerzitu!"
 major_decisions.2001.b_coimbra: "Založím Coimberskou univerzitu!"
 major_decisions.2001.b_napoli: "Založím Svatou římskou univerzitu v Neapoli!"
 major_decisions.2001.b_tirakka: "Založím univerzitu Sankoré!"
 major_decisions.2001.fallback: "Dnes tedy... žádnou univerzitu nezaložím."
 major_decisions.2001.fallback.tt: "Hrabství má příliš nízký rozvoj nebo již obsahuje slot pro zvláštní budovu"
 major_decisions.2002.desc: "Nastává nový věk poznání. V panství [founder.GetName] byla založena univerzita, která se rychle stává centrem učenců a dalších vzdělaných lidí. Je vychvalována jako nejlepší místo, kde se mohou mladí lidé učit trivium, kvadrivium i vše ostatní potřebné k porozumění světu."
 major_decisions.2002.a: "Kéž jejich vědění prospěje nám všem!"
 major_decisions.2011.t: "Moudrý [new_courtier.GetWomanMan|U]"
 major_decisions.2011.desc: "[new_courtier.GetName], [new_courtier.GetWomanMan] [ROOT.Char.Custom2('DescriptorPositive', SCOPE.sC('new_courtier') )] a moudrý, mě zdvořile pozdraví.\n\n„Doslechl jsem se o tvé nové univerzitě! [ROOT.Char.GetTitleAsNameNoTooltip], který si tolik cení vědění... Bylo by mi ctí ti sloužit.“"
 major_decisions.2011.a: "Vítej, vítej!"
 major_decisions.2011.b: "Pro tebe zde není místo."
 major_decisions.3001.t: "Dům zeleně"
 major_decisions.3001.desc: "Kolem mě bují záplava rostlin, na tabulkách skla nade mnou se sráží voda a sluneční paprsky pronikají dovnitř a dopadají na mou vzhůru obrácenou tvář. Roztočím se stále rychleji, radostně odhodím plášť na zem a propuknu v smích.\n\n„Slunce je tu s námi. Stálo to celé jmění, ale vyplatilo se to!“"
 major_decisions.3001.a: "Zkrotil jsem sluneční světlo!"
 major_decisions.3002.desc: "[builder.GetName] je skutečně [Select_CString( builder.IsFemale, 'šílená', 'šílený' )]! [Select_CString( builder.IsFemale, 'Utratila', 'Utratil' )] celé jmění za stavbu tvořenou výhradně sklem a prohlásila, že slunce zkrotila a polapila.\n\nZprávy o bujících rostlinách jsou jistě jen výplodem [Select_CString( builder.IsFemale, 'jejích', 'jeho' )] bludů. Skončí vůbec někdy fraška té [Select_CString( builder.IsFemale, 'šílené ženy', 'šíleného muže' )]?!"
 major_decisions.3002.a: "To už začíná být směšné!"
 major_decisions.3100.t: "Otázka nástupnictví"
 major_decisions.3100.desc: "V poslední době mě neustále sužuje otázka, kdo po mé smrti nastoupí na mé místo, a nepřestávám myslet na hrozbu rozdělení panství.\n\nPřesvědčit panství, aby přijalo nový nástupnický řád, bývá samozřejmě obtížné. Návrat ke starému však může být #EMP mnohem#! snazší..."
 major_decisions.3100.a: "Dávné zvyklosti mého lidu byly nejlepší!"
 major_decisions.3100.d: "Hm, po zralé úvaze je rozdělení spravedlivější."
 major_decisions.3100.tt_opinion_witengamot: "Vazalové [Concept('cultures','kultur')|E] s [Concept('culture_tradition','kulturní tradicí')|E] $tradition_the_witenagemot_name$"
 major_decisions.3100.tt_opinion_thing: "Vazalové [Concept('cultures','kultur')|E] s [Concept('heritage','dědictvím')|E] $heritage_north_germanic_name$"
 major_decisions.3100.tt_opinion_tanistry: "Vazalové, jejichž [Concept('cultures','kultury')|E] mají [Concept('heritage','dědictví')|E] $heritage_goidelic_name$"
 major_decisions.3100.tt_opinion_jirga: "Vazalové [Concept('cultures','kultur')|E] s [Concept('culture_tradition','kulturní tradicí')|E] $tradition_fp3_jirga_name$"
