 MERIT_RANK_CAP_CELESTIAL_METROPOLITAN_EXAMINATION_TT: "K dosažení následující hodnosti je nutné absolvovat Metropolitní zkoušku (nebo vyšší): @merit_level_5_icon![GetModifier( 'merit_level_5' ).GetNameWithTooltip|L]"
