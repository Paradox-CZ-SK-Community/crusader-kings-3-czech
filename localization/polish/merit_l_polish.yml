l_polish:
 TOTAL_MERIT: "Celkové [Concept('merit','zásluhy')|E]: $VALUE|V0$"
 MERIT_EFFECTS_BREAKDOWN: "#S Účinky:#![AddTextIf( Not( StringIsEmpty(GetMeritLevelEffects( Character.GetMeritLevel )) ), '\n' )][GetMeritLevelEffects( Character.GetMeritLevel )]"
 MERIT_PROGRESSBAR_MARKER_TOOLTIP: "#T [GetMeritLevelNameNoTooltip( ComplexBarItem.GetIndex )]#!\n$game_concept_merit$: alespoň [GetMeritLevelThreshold( ComplexBarItem.GetIndex )|V^]\n\n[GetMeritModifierByLevel( ComplexBarItem.GetIndex ).GetDescWithBulletPointEffects][AddTextIf( GreaterThan_int32( ComplexBarItem.GetIndex, '(int32)1' ), '\n' )]$BULLET$[Concept('movement_power','Síla hnutí')|E]: [movement_power_i] [Multiply_int32( ComplexBarItem.GetIndex, '(int32)10' )|+=0]\n[GetMaxAppointmentRankDescription( 'merit', ComplexBarItem.GetIndex )][Character.GetMeritLevelDescription( ComplexBarItem.GetIndex )]"
 MERIT_TOOLTIP_COMPLETED_EXAMINATIONS: "Absolvované [Concept('imperial_examinations','úřednické zkoušky')|E]"
 MERIT_TOOLTIP_EXAMINATION_DISCLAIMER: "[Concept('governors','Guvernéři')|E] musí odejít do výslužby, aby mohli absolvovat další zkoušky"
 MERIT_TOOLTIP_EXAMINATION_PASSED_CHILD_EXAM: "@child_exam_icon! #T Dětská zkouška#!\n$CHILDRENS_EXAMINATION_PASSED_FAIL$\n\nLze absolvovat prostřednictvím [Concept('decision','rozhodnutí')|E] $tgp_china_attend_child_exam_decision$"
 MERIT_TOOLTIP_EXAMINATION_PASSED_PROVINCIAL_EXAM: "@provincial_exam_icon! #T Provinční zkouška#!\n[SelectLocalization( HasPassedProvincialExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedProvincialExamination(Character),'EXAMINATION_FAILED','EXAMINATION_NOT_TAKEN') )]\n\n#S Po úspěšném složení:#!\n[GetModifier( 'tgp_passed_provincial_exam_modifier' ).GetDescWithBulletPointEffects]\n\nPořádají ji vládní úředníci v rámci [Concept('activity','aktivity')|E] [GetActivityType('activity_local_examination').GetName]"
 MERIT_TOOLTIP_EXAMINATION_PASSED_METROPOLITAN_EXAM: "@metropolitan_exam_icon! #T Metropolitní zkouška#!\n[SelectLocalization( HasPassedMetropolitanExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedMetropolitanExamination(Character),'EXAMINATION_FAILED','EXAMINATION_NOT_TAKEN') )]\n\n#S Po úspěšném složení:#!\n[GetModifier( 'tgp_passed_metropolitan_exam_modifier' ).GetDescWithBulletPointEffects]\n\nPořádá ji [GetGovernment('celestial_government').GetName|E] [Concept('government','vláda')|E] v rámci [Concept('activity','aktivity')|E] [GetActivityType('activity_imperial_examination').GetName]"
 MERIT_TOOLTIP_EXAMINATION_PASSED_PALACE_EXAM: "@palace_exam_icon! #T Palácová zkouška#!\n[SelectLocalization( HasPassedPalaceExamination(Character), 'EXAMINATION_PASSED', 'EXAMINATION_NOT_TAKEN' )]\n\n#S Po úspěšném složení:#!\n[GetModifier( 'tgp_passed_palace_exam_modifier' ).GetDescWithBulletPointEffects]\n\nKoná se před [Concept('son_of_heaven','Synem Nebes')|E] v rámci [Concept('activity','aktivity')|E] [GetActivityType('activity_imperial_examination').GetName]"
 CHILDRENS_EXAMINATION_PASSED_FAIL: "[SelectLocalization( HasPassedChildrenExamination(Character), 'EXAMINATION_PASSED', SelectLocalization(HasFailedChildrenExamination(Character), SelectLocalization(Character.IsAdult, 'EXAMINATION_FAILED_NO_RETAKE' , 'EXAMINATION_FAILED') ,'EXAMINATION_NOT_TAKEN') )]"
 EXAMINATION_PASSED: "@passed_examination!#P Úspěšně složena#!"
 EXAMINATION_FAILED_NO_RETAKE: "@failed_examination!#N Nesložena#!"
 EXAMINATION_FAILED: "$EXAMINATION_FAILED_NO_RETAKE$ #weak (lze opakovat)#![AddLocalizationIf(And(And(Character.IsMeritCapped, Character.IsAdult), Or(ObjectsEqual(GetPlayer, Character.GetWarden.Self), Character.IsLocalPlayer)), 'EXAMINATION_WOULD_TAKE')]"
 EXAMINATION_NOT_TAKEN: "#weak Neabsolvována#![AddLocalizationIf(And(And(And(Character.IsMeritCapped, Character.CanImproveMeritRank), Character.IsAdult), Or(ObjectsEqual(GetPlayer, Character.GetWarden.Self), Character.IsLocalPlayer)), 'EXAMINATION_WOULD_TAKE')]"
 EXAMINATION_WOULD_TAKE: "\n\n[Character.GetShortUINamePossessive|U] maximální [Concept('merit_level','hodnost zásluh')|E] je omezena, protože tato [Concept('examination','zkouška')|E] nebyla úspěšně složena. [SelectLocalization(Character.IsLocalPlayer, 'EXAMINATION_WOULD_TAKE_ME', 'EXAMINATION_WOULD_TAKE_OTHER')]"
 EXAMINATION_WOULD_TAKE_ME: "Zúčastni se některé."
 EXAMINATION_WOULD_TAKE_OTHER: "Pokud se některé zúčastníš a [Character.GetShortUIName] bude k dispozici, připojí se k tobě."
 MERIT_GOVERNOR_APPOINTMENT_SCORE_POSITIVE: "$BULLET$[Concept('candidate_score','Skóre kandidáta')|E]: @appointment_score!#P +[Character.GetGovernorAppointmentScoreByMerit]#!"
 MERIT_GOVERNOR_APPOINTMENT_SCORE_NEGATIVE: "$BULLET$[Concept('candidate_score','Skóre kandidáta')|E]: @appointment_score!#N [Character.GetGovernorAppointmentScoreByMerit]#!"
 MERIT_MOVEMENT_POWER: "$BULLET$[Concept('movement_power','Síla hnutí')|E]: [movement_power_i] [Character.GetMovementPowerByMerit|+=0]"
 MERIT_PROGRESS_HEADING: "$game_concept_merit_level$: postup k další úrovni"
 MAX_MERIT_RANK_BREAKDOWN_TOOLTIP: "#T Maximální [Concept('merit_level','hodnost zásluh')|E]#!\n[PlayerValueItem.GetMaxLevelBreakdown( Character.Self )]"
