l_polish:
 ach_how_to_lose_a_war_listener_modifier: "Příběhy prohraných válek: Posluchač"
 ach_how_to_lose_a_war_listener_modifier_desc: "Tato postava vyslechla strastiplný příběh o prohrané válce a poučila se, čeho se v životě i ve válce vyvarovat."
 ach_how_to_lose_a_war_talker_modifier: "Příběhy prohraných válek: Vypravěč"
 ach_how_to_lose_a_war_talker_modifier_desc: "Tato postava stále dokola vyprávěla svůj strastiplný příběh. Přehnaná sdílnost a neustálé opakování jí však poskytly jistou duševní útěchu."
 ach_peace_broker_modifier: "Výřečný strůjce míru"
 ach_peace_broker_modifier_desc: "V předvečer své korunovace tato postava zabránila opakování revanšistické války, druhé krvavé chyby."
 ach_neutered_revanchist_modifier: "Zkrocený pomstychtivý revanšista"
 ach_neutered_revanchist_modifier_desc: "Tato postava během korunovačního obřadu vedla rozhovor, který jí změnil život a přiměl ji přehodnotit svůj přístup k životu i vlastní minulosti."
 ach_partners_in_revanchism_passive_modifier: "Partneři v revanšismu: Příprava"
 ach_partners_in_revanchism_passive_modifier_desc: "Tato postava se připravuje na úzkou spolupráci s jiným vládcem při vedení války z pomsty.\n\n#weak Jakmile bude zamýšlenému cíli vyhlášena válka, získá tento modifikátor další účinky. Vládce, který tento modifikátor sdílí, bude povolán do války a pokud to bude možné, připojí se k ní. Nový válečný modifikátor bude aktivní po dobu jednoho roku.#!"
 ach_partners_in_revanchism_active_modifier: "Partneři v revanšismu: Válka"
 ach_partners_in_revanchism_active_modifier_desc: "Tato postava úzce spolupracuje s jiným vládcem ve válce z pomsty."
 ach_hof_visit_modifier: "Návštěva hlavy víry"
 ach_hof_visit_modifier_desc: "Tyto země překypují ruchem kvůli návštěvě hlavy své víry a ohromného doprovodu, který ji následuje. Věřící proudí do provincie a místní jsou štědře zahrnováni požehnáním i almužnami."
 ach_beat_peasants_modifier: "Bití sedláků"
 ach_beat_peasants_modifier_desc: "Tato postava si získala pověst někoho, kdo osobně sráží své poddané, když překročí meze."
 ach_positive_rumors_modifier: "Příznivé zvěsti"
 ach_positive_rumors_modifier_desc: "Prostý lid v panství si vzrušeně vypráví nepodložené příběhy o slávě této postavy."
 ach_negative_rumors_modifier: "Nepříznivé zvěsti"
 ach_negative_rumors_modifier_desc: "Kolující zvěsti této postavě v poslední době nijak neprospěly."
 ach_arrested_rumormongers_modifier: "Nedávno zatčení šiřitelé zvěstí"
 ach_arrested_rumormongers_modifier_desc: "Místní šiřitelé zvěstí nedávno zmlkli ze strachu před útlakem ze strany svého pána."
 ach_arrested_rumormongers_character_modifier: "$ach_arrested_rumormongers_modifier$"
 ach_arrested_rumormongers_character_modifier_desc: "Tato postava si získala pověst někoho, kdo neváhá zatýkat klevetící sedláky, což je známkou obávanosti i jisté míry nejistoty."
 ach_imperious_modifier: "Panovačný"
 ach_imperious_modifier_desc: "Tato postava si získala pověst někoho, kdo se nezabývá malichernými starostmi."
 ach_coronation_treated_wound_modifier: "Ošetřená zranění"
 ach_coronation_treated_wound_modifier_desc: "Zranění této postavy byla obratně ošetřena."
 ach_coronation_crackdown_modifier: "Korunovační zásah"
 ach_coronation_crackdown_modifier_desc: "Na obyvatelstvo tohoto kraje se vrhly zástupy strážných, aby obnovily pořádek. Mnohé bylo zničeno, ale pořádek byl obnoven."
 ach_coronation_crackdown_character_modifier: "$ach_coronation_crackdown_modifier$"
 ach_coronation_crackdown_character_modifier_desc: "Tato postava prokázala ochotu poštvat vlastní vojáky proti svému lidu, aby obnovila pořádek, čímž si u mnohých získala respekt, u jiných však vyvolala odpor."
 ach_awed_peasantry_modifier: "Ohromení sedláci"
 ach_awed_peasantry_modifier_desc: "Tato postava pronesla řeč, která uklidnila rozbouřený dav a svou výmluvností dohnala stovky lidí k slzám."
 ach_coronation_blissful_ignorance_modifier: "Blažená nevědomost"
 ach_coronation_blissful_ignorance_modifier_desc: "Tato postava ví, že některé možné problémy je nejlepší spokojeně přehlížet."
 ach_coronation_trusts_nobody_modifier: "Nikomu nevěří"
 ach_coronation_trusts_nobody_modifier_desc: "Tato postava se leká každého stínu a stále pevněji věří, že její vazalové osnují její pád."
 ach_coronation_stampede_modifier: "Korunovační tlačenice"
 ach_coronation_stampede_modifier_desc: "Nešťastný sled událostí vedl k tomu, že byly desítky lidí, převážně prostých obyvatel, ušlapány k smrti."
 ach_declarations_of_loyalty_modifier: "Prohlášení věrnosti"
 ach_declarations_of_loyalty_modifier_desc: "Zdá se, že tato postava se svými spoluvazaly nedokáže hovořit o ničem jiném než o spravedlivosti jejich lenního pána."
 ach_coronation_theocratic_allies_modifier: "Teokratičtí spojenci"
 ach_coronation_theocratic_allies_modifier_desc: "Tato postava měla značný prospěch z přímluv jednoho vazala u duchovenstva."
 ach_coronation_little_birds_modifier: "Ptáčci"
 ach_coronation_little_birds_modifier_desc: "Tuto postavu podporuje špionážní síť jednoho z jejích vazalů - jaká úleva!"
 ach_coronation_expended_resources_modifier: "Vyčerpané zdroje"
 ach_coronation_expended_resources_modifier_desc: "Tato postava nedávno vynaložila značné množství zdrojů na podporu jiného vládce."
 ach_coronation_expended_resources_martial_modifier: "$ach_coronation_expended_resources_modifier$"
 ach_coronation_expended_resources_martial_modifier_desc: "$ach_coronation_expended_resources_modifier_desc$ Vyčerpána byla dokonce i její vlastní vojska."
 ach_coronation_expended_resources_martial_nomad_modifier: "$ach_coronation_expended_resources_modifier$"
 ach_coronation_expended_resources_martial_nomad_modifier_desc: "$ach_coronation_expended_resources_modifier_desc$ Vyčerpána byla dokonce i její vlastní vojska."
 ach_coronation_expended_resources_intrigue_modifier: "$ach_coronation_expended_resources_modifier$"
 ach_coronation_expended_resources_intrigue_modifier_desc: "$ach_coronation_expended_resources_modifier_desc$ Její vlastní špionážní síť je proto značně přetížená."
 ach_focusing_on_prayer_modifier: "Soustředění na modlitbu"
 ach_focusing_on_prayer_modifier_desc: "Tato postava v sobě dusí značnou frustraci tím, že se soustředí na záležitosti víry."
 ach_familial_support_modifier: "Podpora rodiny"
 ach_familial_support_modifier_desc: "Tato dynastie je známá tím, že její členové spolupracují jako jeden celek."
 ach_reign_of_terror_modifier: "Hrůzovláda"
 ach_reign_of_terror_modifier_desc: "Tato provincie trpí krutou odvetou uraženého pána."
 ach_reign_of_terror_character_modifier: "Hrůzovláda"
 ach_reign_of_terror_character_modifier_desc: "Tato postava odpověděla na zvěsti šířené sedláky řadou krutých a nelítostných odvetných opatření."
 ach_useful_crowds_modifier: "Užitečné davy"
 ach_useful_crowds_modifier_desc: "Spolčenci této postavy se nepozorovaně pohybují mezi místními davy."
 ach_coronation_good_listener_modifier: "Dobrý posluchač"
 ach_coronation_good_listener_modifier_desc: "Tato postava se začala věnovat pozorování lidí a dozvídá se díky tomu opravdu mnoho..."
 ach_coronation_studying_ceremony_modifier: "Studium korunovačního obřadu"
 ach_coronation_studying_ceremony_modifier_desc: "Tato postava se mnohému učí pozorováním obtíží spojených s pořádáním korunovačního obřadu."
 ach_coronation_gossips_with_servants_modifier: "Klevetění se služebnictvem"
 ach_coronation_gossips_with_servants_modifier_desc: "Tato postava si oblíbila výměnu klepů se služebnictvem."
 ach_social_distancing_modifier: "Udržování odstupu"
 ach_social_distancing_modifier_desc: "Tato postava si od všech ostatních udržuje značný odstup. Překvapivě účinně si tak chrání zdraví, avšak nutnost pokřikovat přes celé místnosti, aby ji bylo slyšet, zdaleka není ideální."
 ach_favored_minority_modifier: "Zvýhodněná menšina"
 ach_favored_minority_modifier_desc: "Vládce této provincie se rozhodl zvýhodňovat její obyvatele, přestože jsou jiné kultury."
 ach_drunk_province_1_modifier: "Opilé obyvatelstvo"
 ach_drunk_province_1_modifier_desc: "Místní si během nedávné korunovace dosyta užili pití."
 ach_drunk_province_2_modifier: "Zpitomělé obyvatelstvo"
 ach_drunk_province_2_modifier_desc: "Nestoudná dostupnost alkoholu během nedávné korunovace vedla k míře opilství, jakou tato provincie dosud nezažila."
 ach_generous_coronation_drinks_modifier: "Štědré korunovační pohoštění"
 ach_generous_coronation_drinks_modifier_desc: "Tato postava zajistila, aby si prostý lid během její korunovace užil hojnost pití, a dodnes na její počest provolává přiopilé přípitky."
 ach_secret_stash_modifier: "Tajná zásoba"
 ach_secret_stash_modifier_desc: "Tato postava získala zásobu exotického hašiše.\n\nUmožňuje jednou použít [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('stress_loss_hashishiyah_decision').GetName]"
 ach_liege_subsidies_modifier: "Královské podpory"
 ach_liege_subsidies_modifier_desc: "Místní vládce se těší přízni svého lenního pána a spolu s ním i jeho država."
