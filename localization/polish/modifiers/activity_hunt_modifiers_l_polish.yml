l_polish:
 held_hunt_modifier: "Nedávný lov"
 held_hunt_modifier_desc: "Tato postava nedávno uspořádala lov a až do uvedeného data jej nemůže uspořádat znovu."
 hunt_punished_locals_modifier: "Potrestaní pytláci"
 hunt_punished_locals_modifier_desc: "Obyvatelé tohoto hrabství nesou břemeno náhrady škod způsobených pytláky v lesích.\n#weak $hunt_modifier_success_slightly_improved_location_tt$#!\n"
 hunt_poacher_training_modifier: "Pytlácký výcvik"
 hunt_poacher_training_modifier_desc: "Tato postava byla pytláky vycvičena v lovu."
 hunt_upset_hunting_county_modifier: "Pobouření kvůli pytláctví"
 hunt_upset_hunting_county_modifier_desc: "Toto hrabství je pobouřeno tím, jak s ním bylo naloženo kvůli činům hrstky pytláků."
 modifier_hunt_hunting_trophy: "Lovecká trofej"
 modifier_hunt_hunting_trophy_desc: "Ve velkém sále této postavy visí působivá lovecká trofej, která připomíná její úspěchy."
 modifier_hunt_friend_of_animal: "Přítel zvířat"
 modifier_hunt_friend_of_animal_desc: "Tato postava má neobyčejnou schopnost zacházet se zvířaty."
 hunt_guide_local_madman_modifier: "Místní průvodce"
 hunt_guide_local_madman_modifier_desc: "Tuto postavu během lovu provedl bažinou její vlastník.\n#weak $hunt_modifier_success_slightly_improved_location_tt$#!\n"
 hunt_guide_local_madman_modifier_custom_desc: "Tuto postavu během lovu provedl bažinou její vlastník.\n#weak Dokud je tento modifikátor aktivní, bude tvá [Concept('hunt_success_chance','šance na úspěch lovu')|E] v [SCOPE.sTitle('activity_place').GetNameNoTier] #positive_value o něco vyšší#!.#!\n"
 hunt_killed_local_madman_modifier: "Zabitý místní"
 hunt_killed_local_madman_modifier_desc: "Známý obyvatel bažin tohoto hrabství byl zabit přehnaně horlivým lovcem."
 hunt_talked_to_madman_modifier: "Vyslyšené starosti místních"
 hunt_talked_to_madman_modifier_desc: "Místní obyvatelé tohoto hrabství jsou potěšeni, že šlechta během lovu vyslechla jejich trápení."
 hunt_peasants_denied_forest_modifier: "Odepřený přístup sedláků do lesa"
 hunt_peasants_denied_forest_modifier_desc: "Sedlákům tohoto hrabství bylo odepřeno právo sbírat v lesích plody."
 hunt_peasants_hunted_modifier: "Lov na sedláky"
 hunt_peasants_hunted_modifier_desc: "Sedláci se bojí usazovat v tomto hrabství kvůli nevyslovitelným věcem, které se zde odehrály."
 hunt_aided_peasants_modifier: "Podpoření sedláci"
 hunt_aided_peasants_modifier_desc: "Nejchudším obyvatelům tohoto hrabství se dostalo značné dobročinné pomoci."
 hunt_falconry_practiced_modifier: "Nácvik sokolnictví"
 hunt_falconry_practiced_modifier_desc: "Tato postava před svým lovem cvičila sokolnictví."
 hunt_poet_romance_aptitude_modifier: "Milostné vzplanutí při sokolnictví"
 hunt_poet_romance_aptitude_modifier_desc: "Tato postava během lovu prožila milostné setkání, které inspirovalo její poezii."
 hunt_faith_desecrated_place_of_worship: "Znesvěcené místo uctívání"
 hunt_faith_desecrated_place_of_worship_desc: "Tato postava znesvětila místo uctívání."
 tgp_hunt_burnt_local_crops: "Spálená úroda sedláků"
 tgp_hunt_burnt_local_crops_desc: "Tato postava při pokusu vyhnat zvěř spálila pole místních sedláků."
 hunt_fresh_air_and_exercise_modifier: "Čerstvý vzduch a pohyb"
 hunt_fresh_air_and_exercise_modifier_desc: "Tato postava si během svých lovů užila náročného pohybu."
 hunt_focused_attention_modifier: "Soustředěná pozornost"
 hunt_focused_attention_modifier_desc: "Tato postava se umí soustředit na věci, které vyžadují okamžitou pozornost."
 modifier_hunt_dog_trophy_modifier: "Lovecká trofej"
 modifier_hunt_dog_trophy_modifier_desc: "Ve velkém sále této postavy visí působivá lovecká trofej, která připomíná její úspěchy."
 modifier_hunt_dog_fighting_modifier: "Vyšší udatnost"
 modifier_hunt_dog_fighting_modifier_desc: "Tato postava během svých lovů předvedla působivý čin udatnosti."
 modifier_hunt_resisted_advances: "Odolání svodům"
 modifier_hunt_resisted_advances_desc: "Tato postava odolala vábivému volání pokušení."
 hunt_mediated_fight_modifier: "Prostředník"
 hunt_mediated_fight_modifier_desc: "Tato postava úspěšně vyjednávala mezi dvěma znepřátelenými lidmi, což pro ni bylo cenným ponaučením."
 hunt_protected_peasants_modifier: "Chránění sedláci"
 hunt_protected_peasants_modifier_desc: "Sedláci tohoto hrabství se cítí v bezpečí."
 hunt_disturbed_locals_modifier: "Vyrušení místní"
 hunt_disturbed_locals_modifier_desc: "Místní obyvatelé tohoto hrabství si pouze přejí, aby je všichni nechali na pokoji."
 hunt_focused_effort_modifier: "Soustředěné lovecké úsilí"
 hunt_focused_effort_modifier_desc: "Tato postava se na lov velmi soustředí."
 hunt_treated_injury_modifier: "Nácvik polní chirurgie"
 hunt_treated_injury_modifier_desc: "Tato postava má čerstvou zkušenost s mimořádně náročnými léčebnými zákroky."
 hunt_tasted_the_belt_modifier: "Ochutnávka řemene"
 hunt_tasted_the_belt_modifier_desc: "Tato postava trpí pohmožděným pozadím."
 hunt_treated_wound_modifier: "Ošetřená zranění"
 hunt_treated_wound_modifier_desc: "Zranění této postavy byla obratně ošetřena."
 hunt_chose_truth_modifier: "Pokorná upřímnost"
 hunt_chose_truth_modifier_desc: "Tato postava řekla pravdu ve svůj vlastní neprospěch."
 hunt_mystical_animal_modifier: "Uloveno mystické zvíře"
 hunt_mystical_animal_modifier_desc: "Tato postava ulovila a zabila mystické zvíře."
 hunt_protected_their_secret_modifier: "Ostražité střežení tajemství"
 hunt_protected_their_secret_modifier_desc: "Tato postava si své úmysly nechává pro sebe."
 hunt_sighting_standard_modifier: "Spatřená zvěř"
 hunt_sighting_standard_modifier_desc: "V tomto hrabství bylo spatřeno množství slibné zvěře.\n#weak [Concept('hunt_success_chance','Šance na úspěch lovu')|E] je v tomto [Concept('county','hrabství')|E] vyšší.#!"
 hunt_sighting_standard_modifier_custom_desc: "V tomto hrabství bylo údajně spatřeno mnoho [SCOPE.sTitle('sighting_county').Custom('GetAnimalPlural')].\n#weak Zvyšuje [Concept('hunt_success_chance_no_prefix','šanci na úspěch')|E] lovů na [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|U].#!"
 hunt_sighting_dangerous_modifier: "Spatřená šelma"
 hunt_sighting_dangerous_modifier_desc: "Toto hrabství údajně sužuje zuřivá šelma.\n#weak [Concept('hunt_success_chance','Šance na úspěch lovu')|E] je v tomto [Concept('county','hrabství')|E] vyšší.#!"
 hunt_sighting_dangerous_modifier_custom_desc: "Toto hrabství údajně sužuje zuřivý [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')].\n#weak Zvyšuje [Concept('hunt_success_chance_no_prefix','šanci na úspěch')|E] lovů na [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|U].#!"
 hunt_sighting_legendary_modifier: "Spatřená legendární zvěř"
 hunt_sighting_legendary_modifier_desc: "V tomto hrabství bylo údajně spatřeno bájné zvíře.\n#weak V tomto [Concept('county','hrabství')|E] lze uspořádat $hunt_type_legendary$ [GetActivityType('activity_hunt').GetTextIcon][GetActivityType('activity_hunt').GetName].#!"
 hunt_sighting_legendary_modifier_custom_desc: "V tomto hrabství byl údajně spatřen bájný [SCOPE.sTitle('sighting_county').Custom('GetLegendaryColor')] [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')].\n#weak V tomto [Concept('county','hrabství')|E] lze lovit legendárního [SCOPE.sTitle('sighting_county').Custom('GetLegendaryColor')|UV] [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|UV].#!"
 hunt_sighting_falconry_modifier: "Spatření ptáci"
 hunt_sighting_falconry_modifier_desc: "Nedávná pozorování hnízdících či migrujících ptáků činí z tohoto hrabství ideální místo pro provozování sokolnictví.\n#weak $hunt_type_falconry$ [Concept('hunt_success_chance','šance na úspěch lovu')|E] je v tomto [Concept('county','hrabství')|E] vyšší.#!"
 hunt_sighting_falconry_modifier_custom_desc: "Pozorování hnízdících či migrujících [SCOPE.sTitle('sighting_county').Custom('GetAnimalPlural')] činí z tohoto hrabství ideální místo pro provozování sokolnictví.\n#weak Zvyšuje [Concept('hunt_success_chance_no_prefix','šanci na úspěch')|E] lovů na [SCOPE.sTitle('sighting_county').Custom('GetAnimalType')|U].#!"
 hunt_heir_murder_exposed_modifier: "Selská spravedlnost"
 hunt_heir_murder_exposed_modifier_desc: "Tato postava dala spravedlnosti přednost před pověstí jednoho dvořana."
 hunt_disrespected_locals_modifier: "Zneuctění místní"
 hunt_disrespected_locals_modifier_desc: "Lovci pošlapali city prostého lidu tohoto hrabství."
 hunt_happy_hounds_modifier: "Spokojení lovečtí psi"
 hunt_happy_hounds_modifier_desc: "Lovečtí psi této postavy jsou náležitě odměňováni.\n#weak $hunt_modifier_success_slightly_improved_tt$#!\n\n"
 hunt_savage_hounds_modifier: "Divocí lovečtí psi"
 hunt_savage_hounds_modifier_desc: "Lovečtí psi této postavy jsou proslulí tím, že dokážou skolit i mohutnou zvěř.\n#weak $hunt_modifier_success_slightly_improved_tt$#!\n\n"
 hunt_savaged_hounds_modifier: "Zdecimovaní lovečtí psi"
 hunt_savaged_hounds_modifier_desc: "Psinec této postavy se vyprázdnil poté, co byli lovečtí psi poštváni proti šelmám.\n#weak $hunt_modifier_success_slightly_worse_tt$#!\n\n"
 crushed_by_boulder_modifier: "Rozdrcení balvanem"
 crushed_by_boulder_modifier_desc: "Okázalá smělost této postavy se jí vymstila, když ji rozdrtil valící se balvan, který se pokoušela přeskočit."
 hunt_blooming_garden_modifier: "Rozkvetlá zahrada"
 hunt_blooming_garden_modifier_desc: "Zahrada této postavy byla bohatě osázena divokými květinami nalezenými během nedávného lovu."
 hunt_stocked_medicus_modifier: "Dobře zásobený lékař"
 hunt_stocked_medicus_modifier_desc: "Lékař této postavy má bohaté zásoby vzácných i běžných léčivých bylin."
 hunt_witch_protector_modifier: "Starostlivý pastýř"
 hunt_witch_protector_modifier_desc: "Tato postava projevila prozíravý zájem o ochranu svých bratří a sester."
 hunt_left_in_trap_modifier: "Ponechání v pasti"
 hunt_left_in_trap_modifier_desc: "Tato postava byla ponechána v lovecké pasti mnohem déle, než bylo pro její zdraví bezpečné."
 hunt_punished_trappers_modifier: "Potrestaní čihaři"
 hunt_punished_trappers_modifier_desc: "Lovecké pasti sedláků tohoto hrabství přivolaly hněv jeho pána."
 hunt_witch_suspicion_modifier: "Nařčení z čarodějnictví"
 hunt_witch_suspicion_modifier_desc: "Zájem této postavy o přírodu vyvolal pochybnosti o její věrnosti pravému bohu."
 hunt_mismanaged_game_modifier: "Špatná péče o zvěř"
 hunt_mismanaged_game_modifier_desc: "Lov laní zmenšil stavy zvěře v tomto hrabství.\n#weak Budoucí [Concept('hunt_success_chance','šance na úspěch lovu')|E] tohoto zvířete bude v tomto [Concept('county','hrabství')|E] #negative_value o něco nižší#!.#!"
 hunt_mismanaged_game_modifier_custom_desc: "Tato postava odchytila koloucha a ochočila jej, aby s jeho pomocí oklamala jeho divoké příbuzné.\n#weak Budoucí [Concept('hunt_success_chance','šance na úspěch lovu')|E] [ROOT.Char.Custom('GetAnimalTypeMismanaged')|UV] bude v tomto [Concept('county','hrabství')|E] #negative_value o něco nižší#!.#!"
 hunt_tame_deer_modifier: "Ochočený kolouch"
 hunt_tame_deer_modifier_desc: "Tato postava odchytila koloucha a ochočila jej, aby s jeho pomocí oklamala jeho divoké příbuzné.\n#weak Budoucí [Concept('hunt_success_chance','šance na úspěch lovu')|E] tohoto druhu zvířete bude #positive_value o něco vyšší#!.#!\n"
 hunt_tame_deer_modifier_custom_desc: "Tato postava odchytila koloucha a ochočila jej, aby s jeho pomocí oklamala jeho divoké příbuzné.\n#weak [Concept('hunt_success_chance','Šance na úspěch lovu')|E] [ROOT.Char.Custom('GetAnimalTypeTame')|UV] je #P o něco vyšší#!.#!"
 hunt_captive_beast_modifier: "Zajatá šelma"
 hunt_captive_beast_modifier_desc: "Tato postava zajala nebezpečnou šelmu živou, aby ji mohla vystavovat a využívat k zábavě.\n#weak Lze ji použít k [GetActivityType('activity_hunt').GetName] tohoto zvířete s #P vysokou#! [Concept('hunt_success_chance_no_prefix','šancí na úspěch')|E].\n"
 hunt_captive_beast_modifier_custom_desc: "Tato postava chová [ROOT.Char.Custom('GetAnimalAdjectiveCaptive')] [ROOT.Char.Custom('GetAnimalTypeCaptive')] k vystavování a zábavě.\n#weak Lze jej použít k [GetActivityType('activity_hunt').GetName] [ROOT.Char.Custom('GetAnimalTypeCaptive')|UV] s #P vysokou#! [Concept('hunt_success_chance_no_prefix','šancí na úspěch')|E]."
 dog_story_scenthound_modifier: "Stopařský pes"
 dog_story_scenthound_modifier_desc: "Tuto postavu všude doprovází věrný pes vycvičený ke stopování divoké zvěře.\n#weak Mírně zvyšuje [Concept('hunt_success_chance','šanci na úspěch lovu')|E].#!"
 dog_story_beasthound_modifier: "Pes na šelmy"
 dog_story_beasthound_modifier_desc: "Tuto postavu všude doprovází věrný pes vycvičený k boji s nebezpečnými šelmami.\n#weak Mírně zvyšuje [Concept('hunt_success_chance','šanci na úspěch lovu')|E] proti [Concept('hunt_dangerous','nebezpečným')|E] šelmám.#!"
