 hunt_carving_into_bark_modifier_desc: "Tato postava vyryla iniciály své milované osoby do kůry majestátního stromu."
 hunt_ending_dog_suffering_modifier: "Přátelé až do konce"
 hunt_ending_dog_suffering_modifier_desc: "Tato postava učinila těžké rozhodnutí ukončit život svého věrného společníka, který stál na prahu smrti."
