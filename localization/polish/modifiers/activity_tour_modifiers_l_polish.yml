l_polish:
 liege_respected_fighter_modifier: "Ponížený selský vůdce"
 liege_respected_fighter_modifier_desc: "Místní selský vůdce z tohoto hrabství byl nedávno ponížen v pěstním souboji se svým lenním pánem."
 reduced_taxes_modifier: "Snížené daně"
 reduced_taxes_modifier_desc: "Toto hrabství úspěšně vyjednalo snížení daní."
 scared_of_liege_modifier: "Nedávné mučení"
 scared_of_liege_modifier_desc: "Místní sedlák, který svého lenního pána neoslovil náležitým způsobem, byl za trest brutálně mučen, což místní pobouřilo a naplnilo strachem."
 terrified_of_liege_modifier: "Brutální mučení"
 terrified_of_liege_modifier_desc: "Místnímu sedlákovi, který svého lenního pána neoslovil náležitým způsobem, byly vnitřnosti rozmetány po krajině."
 sacred_touch: "Posvátný dotek"
 sacred_touch_desc: "Tomuto hrabství se nedávno dostalo požehnání dotekem významného člena panovnického rodu."
 alms_distributed: "Rozdané almužny"
 alms_distributed_desc: "Chudým tohoto hrabství se nedávno dostalo velké dobročinnosti."
 chastised_tyrant_modifier: "Pokáraný tyran"
 chastised_tyrant_modifier_desc: "Vládce panství byl nedávno pokárán za tyranii páchanou na tomto hrabství."
 locals_terrorised_modifier: "Terorizovaní místní"
 locals_terrorised_modifier_desc: "Drobní zločinci byli v tomto hrabství nedávno bezdůvodně terorizováni."
 sacred_site_vandalised_modifier: "Znesvěcené posvátné místo"
 sacred_site_vandalised_modifier_desc: "Místo, které je obyvatelům tohoto hrabství nanejvýš posvátné, bylo nedávno znesvěceno místním vládcem."
 kings_carving_modifier: "Urozená rytina"
 kings_carving_modifier_desc: "Vysoce postavený šlechtic zanechal v tomto kraji svou stopu, díky čemuž se místní cítí doceněni."
 tutored_by_landless_modifier: "Urozené doučování"
 tutored_by_landless_modifier_desc: "Tato postava nedávno obdržela výuku v obtížném tématu."
 healed_by_wise_woman_modifier: "Mystická léčba"
 healed_by_wise_woman_modifier_desc: "O tuto postavu nedávno pečoval tajemný duchovní léčitel."
 tended_by_wise_woman_modifier: "Mystické ošetření"
 tended_by_wise_woman_modifier_desc: "Zranění této postavy nedávno ošetřoval tajemný duchovní léčitel."
 balanced_by_wise_woman_modifier: "Vyvážené tělesné šťávy"
 balanced_by_wise_woman_modifier_desc: "Tělesné šťávy této postavy byly nedávno vyváženy pomocí podivných mystických praktik."
 makeover_from_wise_woman_modifier: "Bylinná kosmetika"
 makeover_from_wise_woman_modifier_desc: "Této postavě nedávno poskytl duchovní léčitel kosmetické ošetření."
 hurt_by_wise_woman_modifier: "Bezbožná léčba"
 hurt_by_wise_woman_modifier_desc: "Tato postava nedávno navštívila duchovního léčitele a odcházela v mnohem horším stavu, než v jakém přišla."
 bad_makeover_from_wise_woman_modifier: "Ohyzdná kosmetika"
 bad_makeover_from_wise_woman_modifier_desc: "$makeover_from_wise_woman_modifier_desc$"
 full_of_dessert_modifier: "Přejedení sladkostmi"
 full_of_dessert_modifier_desc: "Tato postava si nedávno dopřála velkou hostinu plnou moučníků, po níž zůstala spokojená a sytá."
 stomach_ache_modifier: "Bolest žaludku"
 stomach_ache_modifier_desc: "Tato postava nedávno snědla příliš mnoho jídla a rozbolel ji žaludek."
 ate_human_heart: "Statečný žaludek"
 ate_human_heart_desc: "Tato postava nedávno snědla něco, o čem věří, že jí propůjčilo sílu mocného válečníka."
 ate_human_heart_bad: "Neklidný žaludek"
 ate_human_heart_bad_desc: "Tato postava nedávno snědla něco, o čem věří, že jí propůjčilo sílu mocného válečníka, ale její tělo na to zareagovalo špatně."
 succesful_food_experiment_modifier: "Úspěšný pokus s jídlem"
 succesful_food_experiment_modifier_desc: "Tato postava experimentovala s jídlem a zakusila vjemy, o nichž si ostatní mohou nechat jen zdát."
 well_rested_modifier: "Dobře odpočatý"
 well_rested_modifier_desc: "Této postavě se podařilo dopřát si zasloužený odpočinek."
 tour_sleep_deprived_modifier: "Nevyspalý"
 tour_sleep_deprived_modifier_desc: "Tato postava zůstala vzhůru celou noc a posedle prohledávala své obydlí při pátrání po tajemstvích."
 highwaymen_eliminated_modifier: "Zlikvidovaní lapkové"
 highwaymen_eliminated_modifier_desc: "Oblíbená cestovní trasa v tomto hrabství byla nedávno zbavena lapků, čímž se zvýšila bezpečnost cestujících i obchodníků."
 courtier_cook_modifier: "Dvořan kuchař"
 courtier_cook_modifier_desc: "Tato postava si opatřila nadaného kuchaře."
 drunken_stupor: "Opilecké mrákoty"
 drunken_stupor_desc: "Tato postava se nedávno opila až do mrákot. O trapných činech, kterých se mohla dopustit, se už možná nikdy nebude mluvit."
 boozeless_modifier: "Vyčerpané zásoby piva"
 boozeless_modifier_desc: "Zásoby alkoholu této postavy zcela vyschly, takže je nyní mizerným hostitelem."
 tour_liege_extra_taxation_county_modifier: "Daně lenního pána"
 tour_liege_extra_taxation_county_modifier_desc: "Vlastník tohoto hrabství nahrazuje dodatečné zdanění ze strany svého lenního pána tím, že zdaňuje vlastní lid."
 tours_grounds_luxury_dining_modifier: "Přepychové stolování"
 tours_grounds_luxury_dining_modifier_desc: "Tato postava zabavila vazalovi velké množství luxusního zboží a nyní si ho užívá."
 tours_grounds_hunting_companions_modifier: "Lovečtí společníci"
 tours_grounds_hunting_companions_modifier_desc: "Tato postava zabavila vazalovi několik vynikajících loveckých zvířat."
 tours_grounds_excellent_horses_modifier: "Zabavení koně"
 tours_grounds_excellent_horses_modifier_desc: "Tato postava zabavila vazalovi několik vynikajících koní."
 tours_grounds_sharing_tips_with_friend_modifier: "Sdílení rad s přítelem"
 tours_grounds_sharing_tips_with_friend_modifier_desc: "Tato postava si s přítelem pravidelně vyměňuje rady týkající se jejich společných zájmů."
 tour_grounds_hidden_assets_modifier: "Skrytý majetek"
 tour_grounds_hidden_assets_modifier_desc: "Této postavě se podařilo ukrýt část cenného majetku před zdaněním ze strany jejího lenního pána."
 embarassing_performance_modifier: "Trapné vystoupení"
 embarassing_performance_modifier_desc: "Tato postava urazila svého lenního pána trapným vystoupením."
 skirmisher_learnings: "Inovace lehké pěchoty"
 skirmisher_learnings_desc: "Tato postava nedávno pozorovala, jak cizí panství spravuje svou lehkou pěchotu."
 heavy_infantry_learnings: "Inovace těžké pěchoty"
 heavy_infantry_learnings_desc: "Tato postava nedávno pozorovala, jak cizí panství spravuje svou těžkou pěchotu."
 archers_learnings: "Inovace lukostřelby"
 archers_learnings_desc: "Tato postava nedávno pozorovala, jak cizí panství spravuje své lučištníky."
 cavalry_learnings: "Inovace jezdectva"
 cavalry_learnings_desc: "Tato postava nedávno pozorovala, jak cizí panství spravuje svou jízdu."
 general_maa_learning: "Efektivní správa"
 general_maa_learning_desc: "Tato postava se nedávno naučila efektivnějšímu způsobu rozmísťování svých ozbrojenců."
 clearing_crime_modifier: "Potírání zločinnosti"
 clearing_crime_modifier_desc: "V tomto hrabství byl nedávno podniknut vojenský zásah proti zločinnosti. Přestože jde o účinný projev moci nad krajem, místní obyvatelé těmito násilnými opatřeními trpí."
 liege_bad_micromanagement: "Špatná správa"
 liege_bad_micromanagement_desc: "Místní šlechtic se domníval, že dokáže zlepšit ozbrojence této postavy. Mýlil se."
 totally_lost_modifier: "Naprosto ztracený"
 liesurely_studies: "Poklidné studium"
 liesurely_stroll: "Poklidná procházka"
 guarded_garden: "Střežená zahrada"
 military_studies: "Vojenská studia"
 festival_disruption: "Narušení slavnosti"
 liege_judged_festival: "Slavnost posouzená šlechticem"
 pious_liege: "Zbožný lenní pán"
 tolerant_liege: "Tolerantní lenní pán"
 recent_cultural_festival: "Nedávná kulturní slavnost"
 ep2_popular_liege: "Oblíbený lenní pán"
