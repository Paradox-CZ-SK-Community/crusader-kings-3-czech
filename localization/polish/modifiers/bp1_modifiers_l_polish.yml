l_polish:
 bp1_1000_time_with_bf_modifier: "Příjemné chvíle s nejlepším přítelem"
 bp1_1000_time_with_bf_modifier_desc: "Tato postava tráví příjemné chvíle se svým nejlepším přítelem."
 bp1_1000_focus_on_work_modifier: "Soustředění na práci"
 bp1_1000_focus_on_work_modifier_desc: "Tato postava zanedbává svého přítele, aby se mohla soustředit na své povinnosti."
 bp1_1020_friend_with_modifier: "Starostlivý přítel"
 bp1_1020_friend_with_modifier_desc: "U lůžka této postavy sedí starostlivý přítel."
 bp1_superstition_modifier: "Pověrčivý"
 bp1_superstition_modifier_desc: "Život této postavy je ovládán vírou v nadpřirozené vlivy přinášející štěstí či neštěstí."
 bp1_1070_unlucky_charm_modifier: "Nešťastný talisman"
 bp1_1070_unlucky_charm_modifier_desc: "Zlý rival seslal na tuto postavu smůlu."
 bp1_well_fed_pigs_modifier: "Dobře vykrmená prasata"
 bp1_well_fed_pigs_modifier_desc: "Tato postava má podezřele vykrmený dobytek..."
 humiliated_by_rival_modifier: "Ponížený"
 humiliated_by_rival_modifier_desc: "Tuto postavu veřejně zostudil rival a dosud se nedokázala zbavit pocitu hanby."
 triumphant_over_rival_modifier: "Triumfující"
 triumphant_over_rival_modifier_desc: "Tato postava veřejně porazila rivala a od té doby kráčí s nově nabytým elánem."
 dead_best_friend_modifier: "Přetrvávající žal"
 dead_best_friend_modifier_desc: "Nejlepší přítel této postavy zemřel a ona se z této ztráty dosud plně nevzpamatovala."
 linguistically_challenged_modifier: "Jazykově neobratný"
 linguistically_challenged_modifier_desc: "Tato postava vyslovuje některá slova jinak, než velí ustálené normy, a je kvůli tomu terčem posměchu."
 descriptivist_modifier: "Deskriptivista"
 descriptivist_modifier_desc: "Tato postava trvá na vlastním přístupu k jazyku, čímž dává najevo zřetelný nedostatek vzdělání v jazykových záležitostech."
 sneaking_suspicion_modifier: "Vtíravé podezření"
 sneaking_suspicion_modifier_desc: "Tato postava působí zdánlivě bezstarostně, protože vytěsnila z mysli několik znepokojivých událostí. Nebo se o to alespoň #EMP pokusila#!..."
 busy_guards_modifier: "Zaneprázdněné stráže"
 busy_guards_modifier_desc: "Tato postava odvedla pozornost svých stráží k malicherným záležitostem namísto vlastní ochrany."
 lacking_supplies_modifier: "Nedostatek zásob"
 lacking_supplies_modifier_desc: "Tato postava ponechala hanebné činy ostatních bez vyšetření, a v důsledku toho nyní trpí nedostatkem potravinových zásob."
 optimist_modifier: "Optimista"
 optimist_modifier_desc: "Pro tuto postavu je korbel vždy napůl plný."
 lacking_poultry_modifier: "Nedostatek drůbežích produktů"
 lacking_poultry_modifier_desc: "V tomto hrabství je nedostatek potravin a dalších produktů získávaných z kuřat."
 obsessively_neurotic_modifier: "Chorobně neurotický"
 obsessively_neurotic_modifier_desc: "Tato postava vidí nebezpečí za každým rohem a žije svůj život ve strachu."
 unhappy_spouse_modifier: "Nešťastné manželství"
 unhappy_spouse_modifier_desc: "Neurózy této postavy narušily její manželství, možná nenapravitelně."
 disdained_modifier: "Opovrhovaný"
 disdained_modifier_desc: "Je známo, že tato postava je pod nadvládou vlastních vazalů, kteří se otevřeně vysmívají jejím pokusům udržet je na uzdě."
 cat_revenge_modifier: "Pomsta za kočku"
 cat_revenge_modifier_desc: "Úhlavní nepřítel této postavy zavraždil její kočku a ona je nyní zcela pohlcena myšlenkami na pomstu."
 cat_survived_modifier: "Kočičí překvapení"
 cat_survived_modifier_desc: "Kočka této postavy nějakým způsobem přežila pokus o vraždu zosnovaný jejím úhlavním nepřítelem."
 sated_modifier: "Ukojený"
 sated_modifier_desc: "Tato postava strávila se svým milencem několik #EMP příjemných chvil#!."
 family_troubles_modifier: "Rodinné potíže"
 family_troubles_modifier_desc: "Někteří členové širší rodiny této postavy se ocitli v nesnázích."
 skinned_pet_modifier: "Stažený mazlíček"
 skinned_pet_modifier_desc: "Milovaný mazlíček této postavy byl kvůli úkladům rivala stažen z kůže a proměněn v oděv."
