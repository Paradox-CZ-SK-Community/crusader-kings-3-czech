l_polish:
 bp2_stranger_at_home_modifier: "Cizincem doma"
 bp2_stranger_at_home_modifier_desc: "Po pobytu v roli rukojmí tato postava přijala své odcizení od rodné země."
 bp2_stranger_no_more_modifier: "Opětovné začlenění"
 bp2_stranger_no_more_modifier_desc: "Po pobytu v roli rukojmí se tato postava snaží znovu přivyknout své rodné zemi."
 bp2_uni_bad_encounters_modifier: "Špatná setkání"
 bp2_uni_bad_encounters_modifier_desc: "Během studia v dospělosti se tato postava dostala do potíží kvůli špatné společnosti."
 bp2_dialogue_with_the_masters_modifier: "Rozprava s mistry"
 bp2_dialogue_with_the_masters_modifier_desc: "Během univerzitního studia dokázala tato postava rozmlouvat s mistry tváří v tvář v jejich liturgickém jazyce."
 foolish_endeavor_modifier: "Zesnění sebe sama"
 foolish_endeavor_modifier_desc: "Pošetilý pokus této postavy rozmlouvat s univerzitními učiteli jako rovný s rovnými žalostně selhal."
 bp2_uni_connections_modifier: "Univerzitní kontakty"
 bp2_uni_connections_modifier_desc: "Během univerzitního studia se tato postava dobře začlenila do místního studentského společenství."
 bp2_uni_isolation_modifier: "Studijní izolace"
 bp2_uni_isolation_modifier_desc: "Během univerzitního studia se této postavě nepodařilo navázat vztahy se spolužáky."
 bp2_understanding_modifier: "Porozumění"
 bp2_understanding_modifier_desc: "Tato postava intuitivně pozná, když ostatní nejsou z něčeho zdaleka tak nadšení jako ona."
 bp2_careful_modifier: "Ostražitost vůči majetku"
 bp2_careful_modifier_desc: "Po nehodě s míčem v mládí si tato postava nyní dává velký pozor na svůj majetek."
 bp2_cowardly_modifier: "Zbabělý"
 bp2_cowardly_modifier_desc: "Bez ohledu na svou současnou povahu si tato postava nese poskvrnu z toho, že v mládí nechala jiné dítě napospas šikaně."
 bp2_disrespects_elderly_modifier: "Neúcta ke starším"
 bp2_disrespects_elderly_modifier_desc: "Tato postava již od mládí projevuje zdravé opovržení vůči starším a údajně moudřejším, čímž si alespoň získává jistou oblibu mezi mladými."
 bp2_guilt_ridden_modifier: "Sžíraný vinou"
 bp2_guilt_ridden_modifier_desc: "Tuto postavu traumatizuje vlastní nečinnost během hry s míčem, kdy pouze přihlížela, jak jiné dítě ušlapal dav."
 bp2_ringing_ears_modifier: "Zvonění v uších"
 bp2_ringing_ears_modifier_desc: "Této postavě stále zvoní v uších poté, co příliš horlivý rodič během hry s míčem dlouze peskoval skupinu dětí."
 bp2_self_preserving_modifier: "Pud sebezáchovy"
 bp2_self_preserving_modifier_desc: "Pud sebezáchovy této postavě v minulosti dobře posloužil."
 imaginary_friend_modifier: "Imaginární přítel"
 imaginary_friend_modifier_desc: "Tato postava má imaginárního přítele."
 imaginary_friend_murder_scheme_modifier: "$imaginary_friend_modifier$"
 imaginary_friend_murder_scheme_modifier_desc: "Pod vlivem svého imaginárního přítele je tato postava přesvědčena o vlastním úspěchu v této intrice."
 imaginary_friend_mad_modifier: "Naprostý šílenec"
 imaginary_friend_mad_modifier_desc: "Tuto postavu něco zvláštně svrbí... a jediný způsob, jak se poškrábat, je #EMP vražda#!."
 bp2_stifled_potential_modifier: "Potlačený potenciál"
 bp2_stifled_potential_modifier_desc: "Tato postava má obrovské zásoby nevyužitého potenciálu, k nimž jí přístup znemožňují úklady ostatních."
 bp2_destined_modifier: "Předurčený ke slávě"
 bp2_destined_modifier_desc: "Tato postava v sobě má něco zvláštního, co mnohé vede k přesvědčení, že je předurčena k velikosti."
 bp2_destiny_tutor_modifier: "Vojenská rada"
 bp2_destiny_tutor_modifier_desc: "Tato postava obdržela rozumnou strategickou radu, kterou si bude dlouho pamatovat."
 bp2_tool_of_fate_modifier: "Nástroj osudu"
 bp2_tool_of_fate_modifier_desc: "Přirozené charisma tuto postavu od mládí odlišovalo a pěstované nadání ji vyzdvihlo nad její vrstevníky."
 rock_story_modifier: "Kamenný mazlíček"
 rock_story_modifier_desc: "Tato postava si užívá společnost kamenného společníka."
 sated_stone_modifier: "Spokojený kámen"
 sated_stone_modifier_desc: "Tato postava se cítí lépe poté, co svému kamennému mazlíčkovi dopřála, po čem toužil."
 rock_dopey_modifier: "Popletený kámen"
 rock_dopey_modifier_desc: "Kamenný mazlíček této postavy je, řekněme, trochu nemotorný."
 lost_rock_modifier: "Ztracený kámen"
 lost_rock_modifier_desc: "Kamenný mazlíček této postavy byl někam založen a následně navždy ztracen. Tato postava se z toho dosud nevzpamatovala."
 bp2_bed_rock_modifier: "Ložní kámen"
 bp2_bed_rock_modifier_desc: "Tato postava svého kamenného mazlíčka miluje natolik, že mu dovoluje dřímat v pohodlí své postele, k nemalé nelibosti každého partnera."
 bp2_sore_thumb_modifier: "Bolavý palec"
 bp2_sore_thumb_modifier_desc: "Pokus této postavy o ruční práci jí způsobil menší újmu."
 bp2_valued_friendship_modifier: "Kamenitý vztah"
 bp2_valued_friendship_modifier_desc: "Tato postava odmítla možnost zazdít svého kamenného mazlíčka ve svém domě a místo toho jej nosí všude s sebou."
 bp2_solid_foundations_modifier: "Pevné základy"
 bp2_solid_foundations_modifier_desc: "Tato postava si natolik cení konstrukční pevnosti, že dokonce zazdila svého kamenného mazlíčka do zdí svého domu."
 bp2_one_upper_modifier: "Věčný trumfovač"
 bp2_one_upper_modifier_desc: "Tato postava se proslavila únavnou potřebou v běžném hovoru neustále trumfovat ostatní."
 bp2_trusted_parent_modifier: "Důvěryhodný rodič"
 bp2_trusted_parent_modifier_desc: "Rodiče této postavy si získali její důvěru a ona si to bude pamatovat ještě mnoho let."
 bp2_tight_knit_modifier: "Pevné rodinné pouto"
 bp2_tight_knit_modifier_desc: "Tato postava vzpomíná na mládí v bezpečném a hřejivém náručí své rodiny a dodnes s ní udržuje blízké vztahy."
 bp2_listened_elders_modifier: "Rady starších"
 bp2_listened_elders_modifier_desc: "Tato postava vyhledává rady starších a naslouchá jejich moudrosti, aby z ní získala cenné poznatky."
 bp2_foreign_influences_modifier: "Cizí vlivy"
 bp2_foreign_influences_modifier_desc: "Zájem této postavy o jiné kultury vzbuzuje podezření u jejích nejbližších."
 bp2_parental_heartbreak_modifier: "Rodičovské zklamání"
 bp2_parental_heartbreak_modifier_desc: "Tato postava se stále vyrovnává s citovými ranami, které jí způsobil jeden z rodičů."
 bp2_culturally_adventurous_modifier: "Kulturně dobrodružný"
 bp2_culturally_adventurous_modifier_desc: "Ochota této postavy přijímat neznámé jí přinesla více moudrosti a širší uznání."
 bp2_expanded_horizons_modifier: "Rozšířené obzory"
 bp2_expanded_horizons_modifier_desc: "Obzory této postavy se rozšířily již v mládí díky styku s příslušníky jiných kultur."
 parent_helped_grief_modifier: "Pomoc se zármutkem"
 parent_helped_grief_modifier_desc: "Rodič této postavě pomohl vyrovnat se se zármutkem nad milovanou kojnou."
 wet_nurse_bonding_modifier: "Sblížení s kojnou"
 wet_nurse_bonding_modifier_desc: "Tato postava se sblížila se svou kojnou díky společné víře a kultuře."
 wet_nurse_faith_bonding_modifier: "$wet_nurse_bonding_modifier$"
 wet_nurse_faith_bonding_modifier_desc: "Tato postava se sblížila se svou kojnou díky společné víře."
 wet_nurse_cultural_bonding_modifier: "$wet_nurse_bonding_modifier$"
 wet_nurse_cultural_bonding_modifier_desc: "Tato postava se sblížila se svou kojnou díky společné kultuře."
 bp2_good_parent_modifier: "Soucitný rodič"
 bp2_good_parent_modifier_desc: "Tato postava je soucitná a zajímá se o pocity a činy svých dětí."
 under_childs_boot_modifier: "Pod pantoflem vlastních dětí"
 under_childs_boot_modifier_desc: "Tato postava jedná podle rozmarů a přání svých dětí."
 bp2_strong_willed_modifier: "Silná vůle"
 bp2_strong_willed_modifier_desc: "Tvrdohlavost a domýšlivost této postavy v dětství jí způsobovaly mnoho trápení se staršími, ale zároveň jí vynesly značné uznání mezi mladými vrstevníky."
 bp2_sweet_treat_modifier: "Sladká pochoutka"
 bp2_sweet_treat_modifier_desc: "Této postavě se podařilo ukořistit z kuchyně sladkou pochoutku. Její oblíbenou!"
 bp2_empathetic_modifier: "Empatický"
 bp2_empathetic_modifier_desc: "Tato postava při jednání s ostatními prokázala značnou míru emoční inteligence."
 bp2_joust_prodigy_modifier: "Turnajový zázrak"
 bp2_joust_prodigy_modifier_desc: "Tato postava již v mládí prokázala přirozené nadání pro rytířské klání."
 bp2_afterlife_citer_modifier: "Víra v posmrtný život"
 bp2_afterlife_citer_modifier_desc: "Veřejná jistota této postavy v existenci posmrtného života jí vynesla pověst mimořádně bezstarostného člověka."
 bp2_numbed_to_death_modifier: "Otupělost vůči smrti"
 bp2_numbed_to_death_modifier_desc: "Rané zkušenosti této postavy se smrtelností jí v těchto záležitostech vtiskly pochmurné vystupování."
 shaven_bald_modifier: "Brutálně oholený"
 shaven_bald_modifier_desc: "Vlasy této postavy byly během obřadu dospělosti zcela ostříhány a zůstala po nich jen odřená pokožka hlavy."
 scorched_soles_modifier: "Spálená chodidla"
 scorched_soles_modifier_desc: "Po bolestivě obřadní chůzi po žhavém uhlí tato postava našlapuje opatrně na strašlivě popálených chodidlech."
 tough_and_confident_modifier: "Houževnatý a sebevědomý příslušník kmene"
 tough_and_confident_modifier_desc: "Během náročných obřadů dospělosti se tato postava naučila zanícení, odhodlání a soběstačnosti."
 peace_over_honor_modifier: "Mír nad patosem"
 peace_over_honor_modifier_desc: "Když byl ohrožen dvůr, který držel příbuzného této postavy jako rukojmí, odmítla tato postava poskytnout pomoc."
 a_noble_fight_modifier: "Urozený boj"
 a_noble_fight_modifier_desc: "Tato postava vyslyšela prosby sužovaného rukojmí, a tím se zavázala k vojenskému dobrodružství."
 aggressive_unpredictable_modifier: "Agresivní a nepředvídatelný"
 aggressive_unpredictable_modifier_desc: "Tento válečný štváč je znám tím, že i při sebemenší provokaci přechází od příměří k násilnému útoku."
