l_polish:
 fp2_smooth_market_oversight_modifier: "Plynulý dohled nad trhem"
 fp2_smooth_market_oversight_modifier_desc: "Bdělost místního muḥtasiba pomáhá zajistit snadné a důvěryhodné obchodování."
 fp2_inefficient_market_oversight_modifier: "Neúčinný dohled nad trhem"
 fp2_inefficient_market_oversight_modifier_desc: "Místní muḥtasibové nejsou schopni řešit problémy na trhu, čímž zatěžují qāḍího."
 fp2_free_market_boom_modifier: "Trh bez hisby"
 fp2_free_market_boom_modifier_desc: "Trhy tohoto města se neřídí hisbou ani nepodléhají dohledu muḥtasibů."
 fp2_ruthless_market_oversight_modifier: "Nelítostný dohled nad trhem"
 fp2_ruthless_market_oversight_modifier_desc: "Místní muḥtasibové spoléhají na vojáky, kteří násilím vynucují i ta nejmenší nařízení."
 fp2_forsaken_turned_levies_modifier: "Rostoucí militarismus"
 fp2_forsaken_turned_levies_modifier_desc: "Vznikají malé selské milice, které loví zrádné frakce a získávají přízeň svého lenního pána."
 fp2_veteran_mercenaries_as_instructors_modifier: "Najmutí veteránští žoldnéři jako instruktoři"
 fp2_veteran_mercenaries_as_instructors_modifier_desc: "Toto hrabství využívá kapitány žoldnéřů zocelené bojem k výcviku místních odvedenců."
 fp2_mercenary_acquaintances_modifier: "Známí mezi žoldnéři"
 fp2_mercenary_acquaintances_modifier_desc: "Tato postava zná mnoho bývalých žoldnéřských kapitánů a díky jejich rozhovorům se mnoho naučila."
 fp2_mercs_slaughtered_populance_modifier: "Žoldnéři pobili obyvatelstvo"
 fp2_mercs_slaughtered_populance_modifier_desc: "Skupina ozbrojených vojáků zpustošila tuto zemi, vzala místním obyvatelům vše a nenechala nikoho, kdo by mohl vyprávět."
 fp2_local_garrison_slaughtered_modifier: "Místní posádka zničena"
 fp2_local_garrison_slaughtered_modifier_desc: "Místní posádka tohoto hrabství byla téměř zcela vyhlazena, takže oblast zůstala bez obrany."
 fp2_elite_tactics_for_civil_guards_modifier: "Místní posádka používá elitní taktiky"
 fp2_elite_tactics_for_civil_guards_modifier_desc: "Vojáci této místní posádky jsou zkušenými strážci pořádku schopnými provádět účinné zásahy proti porušovatelům zákona."
 fp2_mercs_turned_farmers_modifier: "Žoldnéři se stali zemědělci"
 fp2_mercs_turned_farmers_modifier_desc: "Nebezpečná skupina žoldnéřů přišla do této země... obdělávat půdu. Ačkoli jsou nyní mírumilovní, jejich nový lenní pán je může v případě potřeby povolat do služby."
 fp2_lenient_towards_foreign_merchants_modifier: "Shovívavost vůči zahraničním kupcům"
 fp2_lenient_towards_foreign_merchants_modifier_desc: "Tato postava je ochotna přehlížet náboženskou nesnášenlivost kvůli obchodu, čímž získává velké bohatství i opovržení svých druhů."
 fp2_2001_promise_reminder: "Příslib osvobození"
 fp2_2001_promise_reminder_desc: "Tato postava založila svou čest na příslibu osvobodit během několika let sužovanou vesnici."
 fp2_inexplicable_accounting_modifier: "Nevysvětlitelné účetnictví"
 fp2_inexplicable_accounting_modifier_desc: "Účetnictví tohoto hrabství nesedí, zlato mizí."
 fp2_improved_administrative_checks_modifier: "Vylepšené správní kontroly"
 fp2_improved_administrative_checks_modifier_desc: "Toto hrabství má přísné kontroly, které zajišťují odhalení i té nejmenší hospodářské zpronevěry úřady."
 fp2_mozarab_quarter_modifier: "Mozarabské čtvrti"
 fp2_mozarab_quarter_modifier_desc: "Města tohoto hrabství mají zvláštní čtvrti pro Mozaráby."
 fp2_mozarab_church_modifier: "Přijímá Mozaráby"
 fp2_mozarab_church_modifier_desc: "Tato postava dovolila výstavbu mozarabských kostelů ve svých zemích."
 fp2_mozarab_rejected_modifier: "Diskriminace Mozarabů"
 fp2_mozarab_rejected_modifier_desc: "Tato postava nedovoluje Mozarabům stavět kostely ve svých zemích."
 fp2_multifaith_county_modifier: "Náboženská tolerance"
 fp2_multifaith_county_modifier_desc: "Tato postava prokázala shovívavost vůči příslušníkům jiných vyznání ve svém panství."
 fp2_religious_strife_modifier: "Náboženské spory"
 fp2_religious_strife_modifier_desc: "Nucené konverze v tomto hrabství vedly k rozsáhlým náboženským sporům."
 fp2_camino_santiago_ho_protected_modifier: "Ochrana svatého řádu"
 fp2_camino_santiago_ho_protected_modifier_desc: "Cesta do Santiaga, která vede tímto hrabstvím, je chráněna [Concept('holy_order','svatým řádem')|E]."
 fp2_camino_santiago_protected_modifier: "Najmutí strážci"
 fp2_camino_santiago_protected_modifier_desc: "Cesta do Santiaga, která vede tímto hrabstvím, je chráněna najatými strážci."
 fp2_horchata_colonialism_modifier: "Vykořisťování pro horchatu"
 fp2_horchata_colonialism_modifier_desc: "Toto hrabství je nuceno vyrábět pouze zemní mandle pro přípravu horchaty."
 fp2_funded_agriculture_modifier: "Financované zemědělství"
 fp2_funded_agriculture_modifier_desc: "Toto hrabství obdrželo prostředky potřebné k rozšíření své zemědělské půdy."
 fp2_vow_against_conscription_modifier: "Slib proti odvodům"
 fp2_vow_against_conscription_modifier_desc: "Tomuto hrabství bylo uděleno právo odmítnout požadavky na shromáždění vojska. Díky tomu se může soustředit na občanské záležitosti."
 fp2_monument_to_war_modifier: "Památník dobytí"
 fp2_monument_to_war_modifier_desc: "Památník dobyvateli této říše stojí na hromadě trosek obklopené vyhořelými budovami."
 fp2_village_rebuiling_efforts_modifier: "Obnova vesnice"
 fp2_village_rebuiling_efforts_modifier_desc: "Toto hrabství se snaží obnovit po velké katastrofě a jeho lenní pán poskytl prostředky potřebné k urychlení procesu."
 fp2_border_encampments_modifier: "Hraniční tábory"
 fp2_border_encampments_modifier_desc: "Toto hrabství je pokryto stany a hlídkovými stanovišti, která ubytovávají malé skupiny hlídek chránících to málo, co zde zůstalo."
 fp2_scallop_shell_artifact: "Svatojakubská mušle"
 fp2_scallop_shell_artifact_desc: "Tato mušle označuje svého majitele za někoho, kdo absolvoval namáhavou pouť po Svatojakubské cestě."
 fp2_fake_scallop_shell_artifact: "Pochybná svatojakubská mušle"
 fp2_fake_scallop_shell_artifact_desc: "Takovou mušli obvykle vlastní člověk, který absolvoval celou pouť do Santiaga. Tahle je však očividně kradená."
 fp2_malato_bark_artifact: "Kůra stromu Malato"
 fp2_malato_bark_artifact_desc: "Malý kus kůry odříznutý ze slavného baskického stromu Malato."
 fp2_dismantling_verracos_modifier: "Rozebírání kamenných kanců"
 fp2_dismantling_verracos_modifier_desc: "Starověké sochy kanců rozeseté po tomto hrabství jsou rozebírány a měněny na stavební materiál, k velké nelibosti místních úředníků."
 fp2_saints_tombs_modifier: "Hroby světců"
 fp2_saints_tombs_modifier_desc: "Kamenné sochy kanců rozeseté po tomto hrabství jsou považovány za hroby křesťanských světců."
 fp2_controls_the_mediterranean_house_modifier: "Páni Středomoří"
 fp2_controls_the_mediterranean_house_modifier_desc: "Tento rod proslul ovládnutím Středozemního moře a obchodu, který přes něj proudí."
 fp2_aragon_title_reward_house_modifier: "Zakladatelé Aragonie"
 fp2_aragon_title_reward_house_modifier_desc: "Tento rod založil království Aragonie v zemi drsné krajiny a ještě drsnějších válečníků."
 fp2_sponsored_golden_age_modifier: "Patron zlatého věku"
 fp2_sponsored_golden_age_modifier_desc: "Tato postava podpořila zrod dalšího významného zlatého věku vzdělanosti v tomto regionu."
 fp2_part_of_golden_age_modifier: "U zrodu zlatého věku"
 fp2_part_of_golden_age_modifier_desc: "Tato postava byla přítomna u počátku zlatého věku vzdělanosti."
 fp2_epicenter_of_golden_age_modifier: "Epicentrum zlatého věku"
 fp2_epicenter_of_golden_age_modifier_desc: "Toto místo je centrem vzdělanosti, kde žijí a působí největší myslitelé zlatého věku."
 fp2_translated_skill_book_diplomacy_modifier: "Starověké diplomatické zápisky"
 fp2_translated_skill_book_diplomacy_modifier_desc: "Tato postava vlastní překlady starověkých zápisků, které podrobně popisují, jak si poradit s nejrůznějšími diplomatickými situacemi."
 fp2_translated_skill_book_martial_modifier: "Knihy o vojenské historii"
 fp2_translated_skill_book_martial_modifier_desc: "Tato postava přečetla mnoho knih o vojenské historii a poznala různé taktiky a úskoky, které používaly národy dávných časů."
 fp2_translated_skill_book_stewardship_modifier: "Knihy o hospodářské teorii"
 fp2_translated_skill_book_stewardship_modifier_desc: "Tato postava vlastní řadu knih pojednávajících o tom, jak se starověké říše spravovaly a organizovaly, aby dokázaly udržovat rozsáhlé hospodářství."
 fp2_translated_skill_book_intrigue_modifier: "Příběhy intrik"
 fp2_translated_skill_book_intrigue_modifier_desc: "Tato postava vlastní mnoho knih o intrikách, z nichž čerpá spoustu tvořivých nápadů pro své úklady."
 fp2_translated_skill_book_learning_modifier: "Přeložená filosofická díla"
 fp2_translated_skill_book_learning_modifier_desc: "Tato postava si nechala přeložit starověká filosofická díla, díky nimž může dosáhnout hlubšího porozumění."
 fp2_rejection_of_old_thoughts_modifier: "Odmítnutí starých myšlenek"
 fp2_rejection_of_old_thoughts_modifier_desc: "Toto hrabství přitahuje myslitele, kteří odmítají nutnost učit se z minulosti. Vykvete zde mnoho nových myšlenek, ale žádná dlouho nevydrží."
 fp2_removed_cataracts_modifier: "Úspěšné odstranění šedého zákalu"
 fp2_removed_cataracts_modifier_desc: "Této postavě byl úspěšně odstraněn šedý zákal. Z téměř úplné slepoty se tak její zrak zlepšil alespoň natolik, že rozeznává rozmazané barvy a tvary."
 fp2_religious_riots_modifier: "Zuřící náboženské nepokoje"
 fp2_religious_riots_modifier_desc: "Ulice hlavních sídel tohoto hrabství zmítají náboženské rozbroje."
 fp2_religious_riots_suppressed_modifier: "Potlačené náboženské nepokoje"
 fp2_religious_riots_suppressed_modifier_desc: "Náboženské rozbroje v tomto hrabství sice nadále doutnají pod povrchem, ale byly brutálně potlačeny."
 fp2_religious_riots_defused_modifier: "Odvrácené náboženské nepokoje"
 fp2_religious_riots_defused_modifier_desc: "Někteří stále reptají, ale náboženské střety se v tomto hrabství nedávno podařilo odvrátit."
 fp2_pilgrim_roads_modifier: "Poutnické cesty"
 fp2_pilgrim_roads_modifier_desc: "Toto hrabství má rozsáhlou síť cest, které poutníky vedou k jeho svatému místu."
 fp2_trusted_by_pilgrim_warriors_modifier: "Dobrá pověst mezi svatými válečníky"
 fp2_trusted_by_pilgrim_warriors_modifier_desc: "Tato postava je známá svou vstřícností k bojovníkům víry, a ti se k ní proto chovají příznivěji."
 fp2_kept_accused_traitor_in_court_modifier: "Šeptanda o slabosti"
 fp2_kept_accused_traitor_in_court_modifier_desc: "Jeden čin této postavy rozpoutal nejrůznější neuctivé pomluvy na její adresu."
 fp2_kept_op_knight_in_court_modifier: "Sklíčení rytíři"
 fp2_kept_op_knight_in_court_modifier_desc: "Rytíři pod velením této postavy propadají trudomyslnosti, protože je zastiňuje schopnější válečník."
 fp2_kept_upstart_knight_in_court_modifier: "Povýšenečtí rytíři"
 fp2_kept_upstart_knight_in_court_modifier_desc: "Příslušníci šlechty proti této postavě kují pikle, aby zajistili, že se u jejího dvora neobjeví další ctižádostiví válečníci nízkého původu."
 fp2_kept_godless_mercenary_in_court_modifier: "Černá srdce žoldnéřů"
 fp2_kept_godless_mercenary_in_court_modifier_desc: "Vnější vlivy způsobily, že všichni rytíři ve službách této postavy získali špatnou pověst bezvěrců, kteří bojují pouze z chamtivosti."
