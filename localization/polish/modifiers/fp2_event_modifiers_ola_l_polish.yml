l_polish:
 tolerance_gospel_modifier: "Evangelium tolerance"
 tolerance_gospel_modifier_desc: "Tato postava vyzvala svůj lid, aby přijal trpělivost a jednotu."
 fanatical_recruits_modifier: "Fanatičtí rekruti"
 fanatical_recruits_modifier_desc: "Tato postava má stálý přísun horlivých rekrutů."
 tensions_eased_province_modifier: "Uvolněné napětí"
 tensions_eased_province_modifier_desc: "Náboženské napětí v této provincii ustupuje."
 riots_and_murders_province_modifier: "Nepokoje a vraždy"
 riots_and_murders_province_modifier_desc: "Toto hrabství bylo otřeseno masakry a vyháněním takzvaných nežádoucích osob."
 hate_monger_modifier: "Štváč nenávisti"
 hate_monger_modifier_desc: "Tato postava je známým šiřitelem rozbrojů a nenávisti."
 nursing_salaries_for_single_mothers_modifier: "Mzdy za kojení"
 nursing_salaries_for_single_mothers_modifier_desc: "Tato postava zavedla systém, v němž jsou svobodné matky po určitou dobu placeny za kojení svých dětí."
 widows_and_widowers_amazing_funds_modifier: "Fondy pro vdovy"
 widows_and_widowers_amazing_funds_modifier_desc: "Tato postava vytvořila fond pro ty, kdo ovdověli kvůli válce nebo neštěstí — lidé s dětmi narozenými mimo manželství však nic nedostanou."
 starving_single_mothers_and_children_modifier: "Hladovějící matky"
 starving_single_mothers_and_children_modifier_desc: "Vdovy, svobodní rodiče a jejich děti jsou v zemích této postavy ponecháni hladovění."
 destitute_single_mothers_modifier: "Bědný zvěřinec"
 destitute_single_mothers_modifier_desc: "Dvůr této postavy je plný zbídačených svobodných matek a jejich dětí v různých stavech ubohosti."
 anti_innovation_muslim_modifier: "Nizámíja"
 anti_innovation_muslim_modifier_desc: "Tato postava projevila zájem o nové náboženské hnutí, které odmítá racionalismus a vědu."
 rolling_in_filth_modifier: "Válející se v nečistotě"
 rolling_in_filth_modifier_desc: "Tato postava se nestará o čistotu a takzvanou hygienu."
 cannot_read_greek_modifier: "Tvrdí, že umí řecky"
 cannot_read_greek_modifier_desc: "Tato postava tvrdí, že ovládá jazyk učenců starověkého světa, ale důkazy ukazují opak."
 misread_medicine_incompetence_modifier: "Nepochopení Kánonu lékařství"
 misread_medicine_incompetence_modifier_desc: "Tato postava četla Kánon lékařství a další velká díla o zdraví a hygieně, ale zcela je nepochopila."
 inspired_medicine_modifier: "Inspirován lékařskými objevy"
 inspired_medicine_modifier_desc: "Tato postava se začala zajímat o nedávné inovace v lékařství perských a andaluských učenců."
 medical_insights_modifier: "Lékařské poznatky"
 medical_insights_modifier_desc: "Tato postava četla Hippokrata a Galéna a nyní trvá na tom, aby si lidé u dvora myli ruce."
 fp2_advanced_maritime_technology_modifier: "Pokročilá námořní technologie"
 fp2_advanced_maritime_technology_modifier_desc: "Tato postava disponuje námořní technologií, která daleko předčí zbytek světa."
 fp2_successful_shipyards_modifier: "Mistři stavitelé lodí"
 fp2_successful_shipyards_modifier_desc: "Toto místo je domovem zkušených námořních řemeslníků schopných sestavit i nejsložitější plavidla."
 foreboding_visions_modifier: "Zlověstná proroctví budoucnosti"
 foreboding_visions_modifier_desc: "V horečnatých snech a záchvatech, které mohou být posedlostí, tato postava prožívá zlověstná vidění budoucích událostí."
 mysterious_prophetess_illness_modifier: "Nemoc sibyl"
 mysterious_prophetess_illness_modifier_desc: "Tato postava trpí chřadnoucí nemocí zdánlivě spojenou s prorockými sny."
 frightened_by_portent_modifier: "Vyděšený znamením"
 frightened_by_portent_modifier_desc: "Tato postava obdržela znamení strašlivých událostí, které mají přijít."
 cortes_modifier: "Cortes"
 cortes_modifier_desc: "Tato postava umožňuje zvoleným zástupcům svobodných obcí účastnit se zasedání rady."
 extra_large_cortes_modifier: "Lidový sněm"
 extra_large_cortes_modifier_desc: "Tato postava umožňuje #italic komukoli#! účastnit se zasedání rady."
 vineyards_burnt_county_modifier: "Spálené vinice"
 vineyards_burnt_county_modifier_desc: "Toto hrabství kdysi hostilo nádherné vinice, ale všechny byly zničeny."
 vineyards_protected_county_modifier: "Chráněné vinice"
 vineyards_protected_county_modifier_desc: "Vinice tohoto hrabství jsou chráněny před náboženskými fanatiky, kteří je chtějí vypálit."
 crusading_against_iberian_wine_modifier: "Tažení proti vínu"
 crusading_against_iberian_wine_modifier_desc: "Tato postava je odhodlána ukončit rouhačské pití vína svých iberských poddaných."
 wine_supply_secure_modifier: "Zajištěné zásoby vína"
 wine_supply_secure_modifier_desc: "Tato postava zajistila, že nic nemůže ohrozit zásoby kvalitního místního vína jejího dvora."
 toledo_steel_armaments_modifier: "Ozbrojeni jako Římané"
 toledo_steel_armaments_modifier_desc: "Vojáci této postavy nosí čepele z výjimečné iberské oceli, stejně jako kdysi římské legie."
 toledo_steel_county_modifier: "Toledská ocel"
 toledo_steel_county_modifier_desc: "Toto hrabství vyrábí silný druh oceli, který je proslulý již od starověku."
 tortured_smith_spilling_secrets_modifier: "Tajemství výroby mečů"
 tortured_smith_spilling_secrets_modifier_desc: "Tato postava se od mučeného mistra kováře dozvěděla tajemství výroby mečů."
 guild_rights_protected_modifier: "Chráněná práva cechu"
 guild_rights_protected_modifier_desc: "Kovářský cech tohoto hrabství byl ochráněn před vnějším zásahem."
 master_smith_npc_modifier: "Mistr kovář"
 master_smith_npc_modifier_desc: "Kovářské schopnosti této postavy téměř nemají obdoby."
 great_translation_school_modifier: "Velká překladatelská škola"
 great_translation_school_modifier_desc: "Tato postava založila překladatelskou školu, kde jsou zpřístupňována velká zahraniční díla ku prospěchu celé civilizace."
 mediocre_translation_school_modifier: "Průměrná překladatelská škola"
 mediocre_translation_school_modifier_desc: "Tato postava financovala překladatelskou školu, ale zúčastnění mají poněkud pochybné schopnosti."
 translation_effort_modifier: "Překladatelské úsilí"
 translation_effort_modifier_desc: "Tato postava zaměstnala schopného učence, aby přeložil důležitá díla."
 dusty_libraries_modifier: "Zaprášené knihovny"
 dusty_libraries_modifier_desc: "Kdysi nádherné knihovny v panství této postavy zpustly a zaprášily se. Přesto se v nich nachází zvláštní klid."
