 piety_level_5: "Náboženská ikona"
 piety_level_5_desc: "$piety_level_5$ je pátá a nejvyšší možná [Concept('piety_level','úroveň oddanosti')|E] pro [Concept('governments','vlády')|E], které nejsou [Concept('mandala','mandalou')|E]. Další úrovní je [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L].\nÚčinky:\n[GetPietyLevelDesc('(int32)5')|=+]"
 piety_level_6: "Božský"
 piety_level_6_desc: "$piety_level_6$ je šestá [Concept('piety_level','úroveň oddanosti')|E]. Další úrovní je [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L].\n\nKdyž [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E] zemře způsobem přijatelným pro jeho [Concept('aspect','aspekt')|E] poté, co dosáhl [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], získá jeho [Concept('heir','dědic')|E] možnost postoupit na tuto úroveň oddanosti.\n\nÚčinky:\n[GetPietyLevelDesc('(int32)6')|=+]"
 piety_level_7: "Polobůh"
 piety_level_7_desc: "$piety_level_7$ je sedmá [Concept('piety_level','úroveň oddanosti')|E]. Další úrovní je [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L].\n\nKdyž [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E] zemře způsobem přijatelným pro jeho [Concept('aspect','aspekt')|E] poté, co dosáhl [GetModifier( 'piety_level_6' ).GetNameWithTooltip|L], získá jeho [Concept('heir','dědic')|E] možnost postoupit na tuto úroveň oddanosti.\n\nÚčinky:\n[GetPietyLevelDesc('(int32)7')|=+]"
 piety_level_8: "Božská bytost"
 piety_level_8_desc: "$piety_level_8$ je osmá a nejvyšší možná [Concept('piety_level','úroveň oddanosti')|E] pro [Concept('mandala','mandalovou')|E] [Concept('government','vládu')|E].\n\nKdyž [Concept('ruler','vládce')|E] [Concept('mandala','mandaly')|E] zemře způsobem přijatelným pro jeho [Concept('aspect','aspekt')|E] poté, co dosáhl [GetModifier( 'piety_level_7' ).GetNameWithTooltip|L], získá jeho [Concept('heir','dědic')|E] možnost postoupit na tuto konečnou úroveň oddanosti.\n\nÚčinky:\n[GetPietyLevelDesc('(int32)8')|=+]"
