 prestige_level_3_laamp_desc: "Odemkne následující:\n\t#weak $EP3_LAAMP_INVASION_CB_DUCHY_NAME$ a nižší [Concept('casus_bellis','casus belli')|e]\n\t$purchase_land_interaction$ [Concept('interaction','interakce')|E] pro [Concept('counties','hrabství')|E] a [Concept('duchies','vévodství')|E]\n\t$hire_laamp_mercenaries_interaction$ [Concept('interaction','interakci')|E] odměny pro [Concept('county','hrabství')|E] a [Concept('duchy','vévodství')|E]\n\t$seize_realm$ [Concept('scheme','intriku')|E] pro [Concept('duchies','vévodství')|E] a [Concept('counties','hrabství')|E]\n\t$request_laamp_invasion_sponsorship_interaction$ [Concept('interaction','interakce')|E]#!" # todo: CONCEPT CASE
 prestige_level_4_laamp_desc: "Odemkne následující:\n\t#weak $EP3_LAAMP_INVASION_CB_KINGDOM_NAME$ a nižší [Concept('casus_bellis','casus belli')|e]\n\t$purchase_land_interaction$ [Concept('interaction','interakce')|E] pro [Concept('duchies','vévodství')|E] a [Concept('counties','hrabství')|E] s vyšší akceptací\n\t$hire_laamp_mercenaries_interaction$ odměny pro [Concept('county','hrabství')|E] a [Concept('duchy','vévodství')|E]\n\t$seize_realm$ [Concept('scheme','intriku')|E] pro [Concept('kingdoms','království')|E] a nižší\n\t$request_laamp_invasion_sponsorship_interaction$ [Concept('interaction','interakce')|E] #!" # todo: CONCEPT CASE
