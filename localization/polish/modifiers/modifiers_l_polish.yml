 fertile_desert_mountains_modifier_desc: "Již od starověku je jižní část Arábie známa jako úrodná neboli šťastná Arábie. Tento region je lidnatější a úrodnější než okolní části poloostrova.\nLze postavit [GetBuilding('cereal_fields_01').GetName]"
 dodekapolis_modifier: "Dodekapolis"
