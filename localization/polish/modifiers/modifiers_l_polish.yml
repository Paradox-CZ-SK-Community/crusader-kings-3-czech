 prestige_level_2_laamp_desc: "Odemyká následující možnosti:\n\t#weak $EP3_LAAMP_INVASION_CB_COUNTY_NAME$ [Concept('casus_belli','casus belli')|e]\n\t$purchase_land_interaction$ – [Concept('interaction','interakci')|E] pro [Concept('counties','hrabství')|E]\n\t$hire_laamp_mercenaries_interaction$ – odměnu v podobě [Concept('county','hrabství')|E]\n\t$procure_estate_interaction$ – [Concept('interaction','interakci')|E] #!"
 prestige_level_3_laamp_desc: "Odemyká následující možnosti:\n\t#weak $EP3_LAAMP_INVASION_CB_DUCHY_NAME$ a nižší [Concept('casus_bellis','casus belli')|e]\n\t$purchase_land_interaction$ – [Concept('interaction','interakci')|E] pro [Concept('counties','hrabství')|E] a [Concept('duchies','vévodství')|E]\n\t$hire_laamp_mercenaries_interaction$ – [Concept('interaction','interakci')|E] s odměnami v podobě [Concept('county','hrabství')|E] a [Concept('duchy','vévodství')|E]\n\t$seize_realm$ – [Concept('scheme','intriku')|E] zaměřenou na [Concept('duchies','vévodství')|E] a [Concept('counties','hrabství')|E]\n\t$request_laamp_invasion_sponsorship_interaction$ – [Concept('interaction','interakci')|E]#!"
 prestige_level_4_laamp_desc: "Odemyká následující možnosti:\n\t#weak $EP3_LAAMP_INVASION_CB_KINGDOM_NAME$ a nižší [Concept('casus_bellis','casus belli')|e]\n\t$purchase_land_interaction$ – [Concept('interaction','interakci')|E] pro [Concept('duchies','vévodství')|E] a [Concept('counties','hrabství')|E] s vyšší šancí na přijetí\n\t$hire_laamp_mercenaries_interaction$ – odměny v podobě [Concept('county','hrabství')|E] a [Concept('duchy','vévodství')|E]\n\t$seize_realm$ – [Concept('scheme','intriku')|E] zaměřenou na [Concept('kingdoms','království')|E] a nižší tituly\n\t$request_laamp_invasion_sponsorship_interaction$ – [Concept('interaction','interakci')|E] #!"
 prestige_level_5_laamp_desc: "Odemyká následující možnosti:\n\t#weak $EP3_LAAMP_INVASION_CB_EMPIRE_NAME$ a nižší\n\t$purchase_land_interaction$ – [Concept('interaction','interakci')|E] pro [Concept('duchies','vévodství')|E] a [Concept('counties','hrabství')|E] s vyšší šancí na přijetí\n\t$hire_laamp_mercenaries_interaction$ – odměny v podobě [Concept('county','hrabství')|E] a [Concept('duchy','vévodství')|E]\n\t$seize_realm$ – [Concept('scheme','intriku')|E] zaměřenou na [Concept('empires','říše')|E] a nižší tituly\n\t$request_laamp_invasion_sponsorship_interaction$ – [Concept('interaction','interakci')|E] #!"
