 merit_level_0: "Bez hodnosti" # todo: NEW TRANSLATION
 merit_level_0_desc: "Nemít [Concept('merit_level','hodnost zásluh')|E] znamená být vědecky bezcenný a nevhodný do úřadu.\n\nPrvní a nejnižší hodností je [GetModifier( 'merit_level_1' ).GetNameWithTooltip|L]. Účastněte se [Concept('imperial_examinations','úřednickými zkouškami')|E], abyste postoupili v hodnosti.\n\n#S Účinky:#!\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merit_level_1: "9. hodnost" # todo: NEW TRANSLATION
 merit_level_1_desc: "Vstupní úroveň [Concept('merit_level','hodnost zásluh')|E] pro uchazeče zkoušek. Účastněte se [Concept('imperial_examinations','úřednickými zkouškami')|E], abyste postoupili na [GetModifier( 'merit_level_2' ).GetNameWithTooltip|L].\n\n#S Účinky:#!\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merit_level_2: "8. hodnost" # todo: NEW TRANSLATION
 merit_level_2_desc: "$merit_level_2$ je sotva významná úroveň [Concept('merit_level','hodnost zásluh')|E]. Účastněte se [Concept('imperial_examinations','úřednickými zkouškami')|E], abyste postoupili na [GetModifier( 'merit_level_3' ).GetNameWithTooltip|L].\n\n#S Účinky:#!\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merit_level_3: "7. hodnost" # todo: NEW TRANSLATION
 merit_level_3_desc: "$merit_level_3$ je méně významná úroveň [Concept('merit_level','hodnost zásluh')|E].\n\nPro [GetGovernment('celestial_government').GetName] [Concept('government','vládu')|E]: Aby bylo možné dosáhnout této hodnosti, očekává se, že učenci dokončí [Concept('provincial_examination','provinční zkouška')|E]. Postup na [GetModifier( 'merit_level_4' ).GetNameWithTooltip|L] vyžaduje složení vyšších [Concept('examinations','zkoušek')|E].\n\n#S Účinky:#!\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merit_level_4: "6. hodnost" # todo: NEW TRANSLATION
 merit_level_4_desc: "$merit_level_4$ je poměrně významná úroveň [Concept('merit_level','hodnost zásluh')|E].\n\nPro [GetGovernment('celestial_government').GetName] [Concept('government','vládu')|E]: Aby bylo možné dosáhnout této hodnosti, očekává se, že učenci dokončí [Concept('provincial_examination','provinční zkouška')|E]. Postup na [GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] vyžaduje složení [Concept('metropolitan_examination','metropolitní zkouška')|E].\n\n#S Účinky:#!\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merit_level_5: "5. hodnost" # todo: NEW TRANSLATION
 merit_level_5_desc: "$merit_level_5$ je střední bod z devíti hodností a označuje „hodného úředníka“.\n\nPro [GetGovernment('celestial_government').GetName] [Concept('government','vládu')|E]: Úředníci na této úrovni [Concept('merit_level','hodnosti zásluh')|E] by měli dokončit [Concept('metropolitan_examination','metropolitní zkouška')|E]. Další hodnost je [GetModifier( 'merit_level_6' ).GetNameWithTooltip|L].\n\n#S Účinky:#!\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merit_level_6: "4. hodnost" # todo: NEW TRANSLATION
 merit_level_6_desc: "$merit_level_6$ je významná úroveň [Concept('merit_level','hodnost zásluh')|E].\n\nPro [GetGovernment('celestial_government').GetName] [Concept('government','vládu')|E]: Úředníci této hodnosti musí dokončit [Concept('metropolitan_examination','metropolitní zkouška')|E]. Další hodnost je [GetModifier( 'merit_level_7' ).GetNameWithTooltip|L].\n\n#S Účinky:#!\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merit_level_7: "3. hodnost" # todo: NEW TRANSLATION
 merit_level_7_desc: "$merit_level_7$ je výrazně významná úroveň [Concept('merit_level','hodnost zásluh')|E] schopných administrátorů, jejichž schopnosti převyšují běžné.\n\nPro [GetGovernment('celestial_government').GetName] [Concept('government','vládu')|E]: Úředníci této hodnosti by měli dokončit [Concept('palace_examination','palácová zkouška')|E]. Další hodnost je [GetModifier( 'merit_level_8' ).GetNameWithTooltip|L].\n\n#S Účinky:#!\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merit_level_8: "2. hodnost" # todo: NEW TRANSLATION
 merit_level_8_desc: "$merit_level_8$ je vysoce významná úroveň [Concept('merit_level','hodnost zásluh')|E], která uznává úředníka vysoké ctnosti a talentu.\n\nPro [GetGovernment('celestial_government').GetName] [Concept('government','vládu')|E]: Úředníci této hodnosti by měli dokončit [Concept('palace_examination','palácová zkouška')|E]. Další hodnost je [GetModifier( 'merit_level_9' ).GetNameWithTooltip|L].\n\n#S Účinky:#!\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 merit_level_9: "1. hodnost" # todo: NEW TRANSLATION
