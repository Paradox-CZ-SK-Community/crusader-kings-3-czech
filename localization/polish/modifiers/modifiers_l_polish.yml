 backwater_county_modifier: "Okrajová oblast"
 backwater_county_modifier_desc: "Čím větší jsou, tím tvrději padají. Toto hrabství, kdysi území neúprosných vládců Hellady, bohužel postihl neslavný úpadek. Ač je nyní pouhým stínem své někdejší slávy, může opět dosáhnout velikosti.\n\n#X @warning_icon! Tento modifikátor lze odstranit pomocí [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('restore_backwater_counties_decision').GetName], jakmile [Concept('development','rozvoj')|E] tohoto [Concept('county','hrabství')|E] dosáhne hodnoty #V 50#! nebo vyšší!#!\n\n"
