l_polish:
 tgp_natural_disaster_recovery_tax_burden: "Daňové břemeno obnovy přeživších"
 tgp_natural_disaster_recovery_tax_burden_desc: "Výběrčí daní této postavy dostali pokyn přesměrovat daně na obnovu po katastrofě."
 tgp_natural_disaster_recovery_tax_burden_reduced: "$tgp_natural_disaster_recovery_tax_burden$"
 tgp_natural_disaster_recovery_tax_burden_reduced_desc: "$tgp_natural_disaster_recovery_tax_burden_desc$"
 tgp_natural_disaster_recovery_popular_hero: "Hrdina pomoci po katastrofě"
 tgp_natural_disaster_recovery_popular_hero_desc: "Tato postava je všeobecně chválena za financování obnovy po katastrofě, čímž si získala úctu v celém panství."
 tgp_natural_disaster_memorial_fortifications: "Pamětní opevnění"
 tgp_natural_disaster_memorial_fortifications_desc: "Opevnění v tomto kraji bylo nejen obnoveno, ale také zdokonaleno, a nyní slouží jako památník padlým i připomínka vítězství nad katastrofou."
 tgp_natural_disaster_built_memorial_fortifications: "Budovatel památníku"
 tgp_natural_disaster_built_memorial_fortifications_desc: "Tato postava štědře financovala výstavbu zdokonaleného opevnění na místě katastrofy, čímž vytvořila trvalý doklad oddanosti své dynastie blahobytu tohoto kraje."
 tgp_natural_disaster_memorial_fortifications_wierdijks: "$tgp_natural_disaster_memorial_fortifications$"
 tgp_natural_disaster_memorial_fortifications_wierdijks_desc: "$tgp_natural_disaster_memorial_fortifications_desc$"
 tgp_natural_disaster_keeper_of_order: "Strážce pořádku"
 tgp_natural_disaster_keeper_of_order_desc: "Rozhodný dohled této postavy nad odklízecími pracemi — rychlé odstranění trosek a obnovení pořádku — jí vynesl úctu vazalů."
 tgp_natural_disaster_cleanup_material_recovery: "Získávání materiálu po katastrofě"
 tgp_natural_disaster_cleanup_material_recovery_desc: "Materiál získaný při organizovaném odklízení následků katastrofy byl znovu využit, což výrazně snížilo náklady na výstavbu."
 tgp_natural_disaster_reconstruction_economic_activity: "Hospodářský rozmach obnovy"
 tgp_natural_disaster_reconstruction_economic_activity_desc: "Obnova podnítila v tomto hrabství značnou hospodářskou činnost, jelikož rekonstrukční práce přinesly nové obchodní příležitosti."
 tgp_natural_disaster_reconstruction_development_growth: "Rozvojový vzestup díky obnově"
 tgp_natural_disaster_reconstruction_development_growth_desc: "Rozsáhlá obnova přinesla nové postupy, materiály a infrastrukturu, které urychlují růst rozvoje v tomto hrabství."
 tgp_natural_disaster_resettlement_domain_burden: "Zátěž domény přesídlováním po katastrofě"
 tgp_natural_disaster_resettlement_domain_burden_desc: "Správa obyvatel vysídlených z oblastí postižených katastrofou přetížila správní aparát, což snižuje účinnost správy domény."
 tgp_natural_disaster_resettlement_taxation_loss: "Daňové ztráty způsobené přesídlením"
 tgp_natural_disaster_resettlement_taxation_loss_desc: "Chaotické vysídlení obyvatelstva vedlo k poklesu výběru daní."
 tgp_natural_disaster_resettlement_levy_growth: "Uprchlické odvody"
 tgp_natural_disaster_resettlement_levy_growth_desc: "Mnoho přeživších vysídlených nedávnou katastrofou se ochotně hlásí k vojenské službě."
 tgp_natural_disaster_aid_monthly_expense: "Výdaje na pomoc po katastrofě"
 tgp_natural_disaster_aid_monthly_expense_desc: "Pravidelné měsíční náklady na poskytování humanitární pomoci obětem katastrofy, včetně potravin, přístřeší a léčiv."
 tgp_natural_disaster_relief_savior: "Spasitel obětí katastrofy"
 tgp_natural_disaster_relief_savior_desc: "Tato postava je všeobecně uctívána za soucitnou pomoc obětem katastrofy, čímž si získala trvalou duchovní úctu a uznání."
 tgp_natural_disaster_aid_control_recovery: "Obnova kontroly díky pomoci"
 tgp_natural_disaster_aid_control_recovery_desc: "Humanitární pomoc přispěla k obnovení pořádku a stability v oblastech postižených katastrofou, čímž urychlila obnovu místní správní kontroly."
 tgp_natural_disaster_drainage_reduce_levies: "Odvodňovací práce: Snížené odvody"
 tgp_natural_disaster_drainage_reduce_levies_desc: "Místní odvedenci byli převeleni na pomoc s odvodňovacími pracemi, což na čas výrazně snížilo počet dostupných vojenských sil."
 tgp_natural_disaster_drainage_work_levy_shortage: "Nedostatek odvedenců kvůli odvodňování"
 tgp_natural_disaster_drainage_work_levy_shortage_desc: "Mnoho našich odvedenců je zaměstnáno odvodňováním zaplavených oblastí, což výrazně omezuje naši schopnost doplňovat vojenské síly."
 tgp_natural_disaster_recovery_minister_chancellor: "Velký kancléř pomáhá s obnovou po katastrofě"
 tgp_natural_disaster_recovery_minister_chancellor_desc: "Úsilí této postavy o obnovu po přírodní katastrofě podporuje velký kancléř."
 tgp_natural_disaster_recovery_minister_of_personnel: "Ministr personálu pomáhá s obnovou po katastrofě"
 tgp_natural_disaster_recovery_minister_of_personnel_desc: "Úsilí této postavy o obnovu po přírodní katastrofě podporuje ministr personálu."
 tgp_natural_disaster_recovery_minister_of_rites: "Ministr obřadů pomáhá s obnovou po katastrofě"
 tgp_natural_disaster_recovery_minister_of_rites_desc: "Úsilí této postavy o obnovu po přírodní katastrofě podporuje ministr obřadů."
 tgp_natural_disaster_recovery_minister_of_war: "Ministr války pomáhá s obnovou po katastrofě"
 tgp_natural_disaster_recovery_minister_of_war_desc: "Úsilí této postavy o obnovu po přírodní katastrofě podporuje ministr války."
