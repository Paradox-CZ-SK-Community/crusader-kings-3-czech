 industrious_junior_members_modifier: "Pilní novicové"
 foolish_convert_modifier: "Pošetilá konverze"
 foolish_convert_modifier_desc: "Tato pošetilá postava ukvapeně přestoupila k [Concept('rite','ritu')|E] se zcela odlišnou soustavou věrouky a jen velmi obtížně si zvyká na nový duchovní život."
 reckless_convert_modifier: "Neuvážená konverze"
 reckless_convert_modifier_desc: "Tato postava přestoupila k [Concept('rite','ritu')|E] s odlišnou soustavou věrouky bez náležité přípravy a jen obtížně si zvyká na nový duchovní život."
 informed_convert_modifier: "Poučená konverze"
 informed_convert_modifier_desc: "Tato postava přestoupila k [Concept('rite','ritu')|E] s odlišnou soustavou věrouky, plně připravena na nové výzvy, které toto rozhodnutí přinese."
 study_faith_learning_mannerism: "Osvojování zvyklostí"
 study_faith_learning_mannerism_desc: "Osvojování zvyklostí a vnějších obřadů spojených s [Concept('rite','ritem')|E] je sice méně účinné, ale z dlouhodobého hlediska může přinést hmatatelné výsledky."
 study_faith_newfound_coherence: "Nově nalezený soulad"
 study_faith_newfound_coherence_desc: "Nesrovnalosti dosud objevené při studiu tohoto [Concept('rite','ritu')|E] se ukázaly být přínosem, nikoli překážkou. Propojování rozdílů mezi dvěma soustavami věrouky ti pomáhá lépe pochopit pravý význam [Concept('core_tenets','zásad')|E] a [Concept('doctrines','doktrín')|E] studovaného ritu."
 study_faith_cautious_studies: "Obezřetné studium"
 study_faith_cautious_studies_desc: "Tento [Concept('rite','ritus')|E] je lepší studovat pomaleji a věnovat dostatek času rozebrání nepříjemných názorů do srozumitelnějších částí i přivykání jeho cizímu způsobu uvažování."
 study_faith_slow_and_steady: "Pomalé učení"
 study_faith_slow_and_steady_desc: "Množství neznámých praktik tuto postavu zahltilo a snaha vstřebat nové poznatky vyčerpává její duševní síly."
 study_faith_cramming_side_studies: "Hodiny studia navíc"
 study_faith_cramming_side_studies_desc: "Tato postava je natolik ponořena do vnitřního fungování tohoto [Concept('rite','ritu')|E], že si často zapisuje poznámky ke studiu... i když se právě věnuje něčemu jinému."
 followers_of_dead_faith_scheme_modifier: "Vědění ztracené v čase"
 followers_of_dead_faith_scheme_modifier_desc: "Tato [Concept('faith','víra')|E] se už nevyznává otevřeně, a najít její vyznavače je proto nesmírně obtížné."
 appealing_theology_modifier: "Poutavá teologie"
 appealing_theology_modifier_desc: "Tato postava objevila cizí teologický spis, který ji obzvlášť zaujal."
 suspicions_of_heresy_modifier: "Podezření z kacířství"
 suspicions_of_heresy_modifier_desc: "Tato postava často čte cizí teologické spisy, a ostatní vyznavači její víry proto pochybují o její oddanosti."
 monastic_onslaught_modifier: "Klášterní základy"
 monastic_onslaught_modifier_desc: "Mnišský řád s vydatnou podporou světského patrona podněcuje místní hospodářskou činnost."
 pam_monastic_order_improvement_modifier: "Pomoc mnišského řádu"
 pam_monastic_order_improvement_modifier_desc: "Mnišský řád pomáhá tomuto hrabství prací i radami."
 pam_military_order_improvement_modifier: "Požehnané zbraně"
 pam_military_order_improvement_modifier_desc: "Bojovníci svatého řádu cvičí místní odvedence a upevňují kázeň v tomto hrabství."
 pam_tithes_or_mercy_harsh_tithes_modifier: "Vynucené desátky"
 pam_tithes_or_mercy_harsh_tithes_modifier_desc: "Tvrdé vymáhání desátků naplnilo místní obyvatele záští vůči jejich vrchnosti."
 pam_tithes_or_mercy_show_mercy_modifier: "Milosrdné desátky"
 pam_tithes_or_mercy_show_mercy_modifier_desc: "Shovívavost při výběru daní posílila důvěru a přízeň místních obyvatel."
 pam_blissful_harmony_gospel_modifier: "Evangelium dobrého života"
 pam_blissful_harmony_gospel_modifier_desc: "Kázání vládce oslavuje mír, zbožnost a spořádaný život."
 pam_blissful_harmony_restless_ambition_modifier: "Neutuchající ctižádost"
 pam_blissful_harmony_restless_ambition_modifier_desc: "Chvíle blaženosti probudila v této postavě neklidnou touhu dosáhnout ještě víc."
 pam_stone_for_god_estate_build_discount_modifier: "Kámen pro dům Boží"
 pam_stone_for_god_estate_build_discount_modifier_desc: "Bystré oko architekta umožnilo této postavě získat přístup ke kameni."
 pam_relocating_faithfuls_to_frontiers: "Přesídlení věřících do pohraničí"
 pam_relocating_faithfuls_to_frontiers_desc: "Toto hrabství podněcuje vyznavače stejného [Concept('rite','ritu')|E] k přesídlení do jiného [Concept('realm','panství')|E], aby tam šířili svou víru."
 pam_moving_faithfuls_to_frontiers: "Příchod věřících"
 pam_moving_faithfuls_to_frontiers_desc: "Do tohoto hrabství se stěhují lidé odlišné [Concept('faith','víry')|E] a obracejí ostatní na svou víru.\n#weak Zlevňuje [Concept('interaction','interakci')|E] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#!.#!"
 pam_building_new_shrines: "Výstavba nových svatyní"
 pam_building_new_shrines_desc: "Do tohoto hrabství se stěhují lidé odlišné [Concept('faith','víry')|E] a staví nové svatyně.\n #weak Zlevňuje [Concept('interaction','interakci')|E] #V [GetPlayer.GetPlayerInteractionName('feudalize_holding_interaction')]#!.#!"
 pam_grand_cathedral_started_modifier: "Zahájení výstavby velkolepé katedrály"
 pam_grand_cathedral_started_modifier_desc: "Tato postava shromáždila prostředky potřebné k zahájení výstavby velkolepé katedrály. Tento projekt, jehož uskutečnění trvá celé generace, už nyní svědčí o její oddanosti Bohu."
 pam_grand_cathedral_completed_modifier: "Dokončení výstavby velkolepé katedrály"
 pam_grand_cathedral_completed_modifier_desc: "Tato postava shromáždila prostředky potřebné k dokončení výstavby velkolepé katedrály. Tento projekt, jehož uskutečnění trvá celé generace, svědčí o její oddanosti Bohu."
 pam_grand_cathedral_02_started_modifier: "Rozšíření výstavby velkolepé katedrály"
 pam_grand_cathedral_02_started_modifier_desc: "Tato postava shromáždila prostředky k dalšímu zvelebení stávající velkolepé katedrály. Tento projekt, jehož uskutečnění trvá celé generace, svědčí o její oddanosti Bohu."
 pam_grand_cathedral_02_completed_modifier: "Dokončení rozšíření velkolepé katedrály"
 pam_grand_cathedral_02_completed_modifier_desc: "Tato postava dohlížela na rozšíření velkolepé katedrály."
 pam_grand_cathedral_family_contributed_south_modifier: "Financování kaple velkolepé katedrály"
 pam_grand_cathedral_family_contributed_south_modifier_desc: "Příspěvek z řad této dynastie umožnil výstavbu kaple velkolepé katedrály. Tento projekt, jehož uskutečnění trvá celé generace, je velkým dokladem oddanosti dárce Bohu."
 pam_grand_cathedral_family_contributed_north_modifier: "$pam_grand_cathedral_family_contributed_south_modifier$"
 pam_grand_cathedral_family_contributed_north_modifier_desc: "$pam_grand_cathedral_family_contributed_south_modifier_desc$"
 pam_cathedral_founder_crypt_modifier: "Patronát nad katedrální kryptou"
 pam_cathedral_founder_crypt_modifier_desc: "Tato postava financovala kryptu pro svou dynastii pod velkolepou katedrálou."
 pam_cathedral_bell_cracked_lesson_modifier: "Poučení z prasklého zvonu"
 pam_cathedral_bell_cracked_lesson_modifier_desc: "Zedníci v tomto hrabství pracují obezřetněji, aby napravili ostudu způsobenou nezdařeným odlitím zvonu."
 pam_cathedral_bell_bronze_torture_implements_modifier: "Bronzové mučicí nástroje"
 pam_cathedral_bell_bronze_torture_implements_modifier_desc: "Odpadní bronz z nepovedeného katedrálního zvonu byl přetaven v nástroje hrůzy a jejich první obětí se stal zvonař."
 pam_cathedral_treadwheel_crane_modifier: "Šlapací jeřáb"
 pam_cathedral_treadwheel_crane_modifier_desc: "Mohutný šlapací jeřáb ze staveniště katedrály byl vztyčen v hlavním městě."
 pam_cathedral_cantoria_scam_modifier: "Odhalený podvod"
 pam_cathedral_cantoria_scam_modifier_desc: "Po odhalení podvodu pracují stavitelé s obnovenou šetrností a pílí."
 pam_cathedral_famed_choir_boy_modifier: "Andělský hlas u dvora"
 pam_cathedral_famed_choir_boy_modifier_desc: "Chlapec z pěveckého sboru obdařený nadpozemským hlasem přináší tomuto dvoru půvab."
 pam_cathedral_sermon_peace_county_modifier: "Kázání o míru"
 pam_cathedral_sermon_peace_county_modifier_desc: "Kázání vládce u nového portálu katedrály přineslo tomuto hrabství větší spokojenost a poutníci mohou po jeho cestách putovat bezpečněji."
 pam_cathedral_sermon_peace_ruler_modifier: "Vedení k míru"
 pam_cathedral_sermon_peace_ruler_modifier_desc: "Kázání v katedrále o Kristově míru hluboce zapůsobilo na zdejšího vládce."
 pam_cathedral_sermon_diligence_county_modifier: "Kázání o píli"
 pam_cathedral_sermon_diligence_county_modifier_desc: "Kázání vládce u nového portálu katedrály podnítilo stavitele kostelů a zedníky k pilné práci."
 pam_cathedral_sermon_diligence_ruler_modifier: "Vedení k píli"
 pam_cathedral_sermon_diligence_ruler_modifier_desc: "Kázání v katedrále o bohulibé práci hluboce zapůsobilo na zdejšího vládce."
 pam_cathedral_sermon_unity_county_modifier: "Kázání o jednotě"
 pam_cathedral_sermon_unity_county_modifier_desc: "Kázání vládce u nového portálu katedrály upevnilo poslušnost obyvatel tohoto hrabství."
 pam_cathedral_sermon_unity_ruler_modifier: "Vedení ke svornosti"
 pam_cathedral_sermon_unity_ruler_modifier_desc: "Kázání v katedrále o křesťanském společenství hluboce zapůsobilo na zdejšího vládce."
 pam_cathedral_sermon_charity_county_modifier: "Kázání o dobročinnosti"
 pam_cathedral_sermon_charity_county_modifier_desc: "Kázání vládce u nového portálu katedrály otevřelo měšce i srdce obyvatel tohoto hrabství."
 pam_cathedral_sermon_charity_ruler_modifier: "Vedení k dobročinnosti"
 pam_cathedral_sermon_charity_ruler_modifier_desc: "Kázání v katedrále o štědrém milosrdenství hluboce zapůsobilo na zdejšího vládce."
 pam_cathedral_sermon_perseverance_county_modifier: "Kázání o vytrvalosti"
 pam_cathedral_sermon_perseverance_county_modifier_desc: "Kázání vládce u nového portálu katedrály obnovilo zbožné úsilí a spořádaný rozvoj tohoto hrabství."
 pam_cathedral_sermon_perseverance_ruler_modifier: "Vedení k horlivosti"
 pam_cathedral_sermon_perseverance_ruler_modifier_desc: "Kázání v katedrále o vytrvalosti na cestě víry hluboce zapůsobilo na zdejšího vládce."
 pam_cathedral_sermon_rejoice_county_modifier: "Kázání o radosti"
 pam_cathedral_sermon_rejoice_county_modifier_desc: "Kázání vládce u nového portálu katedrály povzbudilo věřící nadějí v Pánovu neochvějnou lásku."
 pam_cathedral_sermon_rejoice_ruler_modifier: "Vedení k radosti"
 pam_cathedral_sermon_rejoice_ruler_modifier_desc: "Kázání v katedrále o radosti v Pánu hluboce zapůsobilo na zdejšího vládce."
 pam_cardinal_order_improve_development_modifier: "Kardinálův příkaz k rozvoji"
 pam_cardinal_order_improve_development_modifier_desc: "Na příkaz svého nadřízeného kardinál podporuje rozvoj místní arcidiecéze."
 pam_cardinal_order_convert_faith_modifier: "Kardinálův příkaz k obracení na víru"
 pam_cardinal_order_convert_faith_modifier_desc: "Na příkaz svého nadřízeného kardinál podporuje obracení na víru v místní arcidiecézi i v sousedních zemích.\n\n$EFFECT_LIST_BULLET$[Concept('convert_county','Obracení na víru')|E] v tomto [Concept('county','hrabství')|E]: #P +25%#!"
 pam_cardinal_order_increase_control_modifier: "Kardinálův příkaz k posílení kontroly hrabství"
 pam_cardinal_order_increase_control_modifier_desc: "Na příkaz svého nadřízeného kardinál uklidňuje obyvatelstvo místní arcidiecéze."
 pam_cardinal_order_accelerate_cultural_fascination_modifier: "Příkaz k urychlení kulturní fascinace"
 pam_cardinal_order_accelerate_cultural_fascination_modifier_desc: "Na příkaz svého nadřízeného kardinál urychluje výzkum nových technologií."
 pam_cardinal_order_improve_epidemic_resistance_modifier: "Kardinálův příkaz k posílení odolnosti vůči moru"
 pam_cardinal_order_improve_epidemic_resistance_modifier_desc: "Na příkaz svého nadřízeného kardinál shromažďuje církevní prostředky na zmírnění následků moru."
 pam_cardinal_order_improve_legitimacy_modifier: "Kardinálův příkaz k posílení legitimity"
 pam_cardinal_order_improve_legitimacy_modifier_desc: "Na příkaz svého nadřízeného kardinál posiluje legitimitu vládců místní arcidiecéze."
 pam_cardinal_order_undermine_legitimacy_modifier: "Kardinálův příkaz k podkopání legitimity"
 pam_cardinal_order_undermine_legitimacy_modifier_desc: "Na příkaz svého nadřízeného kardinál podkopává legitimitu vládců místní arcidiecéze."
 heathen_mandate_modifier: "Pohanská kázání o legitimitě"
 heathen_mandate_modifier_desc: "Svatí muži pohanského vládce si činí nárok na duše této země. Tyto odporné nároky podpírají svou falešnou vírou."
 pam_recently_baptized_at_domicile_modifier: "Nedávný křest"
 pam_recently_baptized_at_domicile_modifier_desc: "Tato postava přijala křest v baptisteriu katedrálního komplexu své arcidiecéze."
 pam_khachkar_ancestral_county: "Chačkar předka"
 pam_khachkar_ancestral_county_custom_desc: "[SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.GetTitledFirstNameNicknamed] zde má chačkar, za jehož vztyčením stojí [Select_CString(SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.IsFemale,'její','jeho')] [SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_ancestor').Char.Custom2('RelationToMeShort', SCOPE.sTitle('khachkar_location').MakeScope.Var('pam_khachkar_commissioner').Char)]"
 pam_denied_new_pope_modifier: "Odmítnutí nového papeže"
 pam_denied_new_pope_modifier_desc: "Tato postava odmítla uznat nově zvoleného papeže."
 pam_dulia_relic_piety_level_impact_modifier: "Posvěcené postavení"
 pam_dulia_relic_piety_per_dread_modifier: "Zář mučedníka"
 pam_dulia_relic_piety_per_knight_modifier: "Požehnání zástupu"
 pam_dulia_relic_stress_loss_per_piety_modifier: "Útěšná milost"
 pam_dulia_relic_piety_per_legitimacy_modifier: "Pomazání svatými"
 pam_dulia_relic_learning_per_piety_modifier: "Osvícená oddanost"
 pam_dulia_relic_monthly_piety_modifier: "Pramen milosti"
 pam_ecumenical_council_creed_arbiter_modifier: "Rozsouzení sporu o vyznání víry"
 pam_ecumenical_council_creed_arbiter_modifier_desc: "Tato postava urovnala spor o znění vyznání víry ještě před zahájením rozprav ekumenického koncilu."
 pam_ecumenical_council_primacy_upheld_modifier: "Obhájený primát"
 pam_ecumenical_council_primacy_upheld_modifier_desc: "Na veřejném zasedání koncilu dostala tato postava otázku, čí autoritě podléhají církve její víry, a z předsednického stolce ji rozhodla."
 pam_dulia_new_saint_modifier: "Nový přímluvce"
 pam_dulia_new_saint_modifier_desc: "Tuto postavu inspiruje nedávné vyhlášení nového světce."
 pam_pilgrim_of_every_holy_site_modifier: "Pouť ke všem svatým místům"
 pam_pilgrim_of_every_holy_site_modifier_desc: "Tato postava držela modlitební bdění na každém svatém místě své víry."
 tenet_harmonious_society_five_bonds_modifier: "Zachované pouto"
 tenet_harmonious_society_five_bonds_modifier_desc: "Vládce a poddaný, rodič a dítě, manžel a manželka, starší a mladší, přítel a přítel. Tato postava náležitě pečuje o jeden z těchto pěti vztahů."
 tenet_apostolic_succession_episcopate_modifier: "Posloupnost svěcení"
 tenet_apostolic_succession_episcopate_modifier_desc: "Ve víře této postavy je každý biskup svěcen prostřednictvím nepřerušené posloupnosti předchozích biskupů, která je historickým zdrojem uznávané legitimity."
 modifier_definition_value_per_theocratic_vassal: "\t#weak Zvýšení za každého [Concept('theocratic_vassal','teokratického vazala')|E] (max. [EmptyScope.ScriptValue('pam_apostolic_succession_bishop_cap_value')])#!"
 tenet_divine_liturgy_choirs_modifier: "Sbory věřících"
 tenet_divine_liturgy_choirs_modifier_desc: "V kostelech této postavy se ve stejných hodinách zpívají stejná slova, nezměněná po celé generace."
 modifier_definition_value_per_held_temple: "\t#weak Zvýšení za každou drženou [Concept('temple_holding','chrámovou državu')|E] (max. [EmptyScope.ScriptValue('pam_divine_liturgy_temple_cap_value')])#!"
 tenet_divine_liturgy_officiant_modifier: "Důstojné sloužení liturgie"
 tenet_divine_liturgy_officiant_modifier_desc: "Tato postava přistupuje k božské liturgii své víry s nejvyšší vážností."
 tenet_divine_liturgy_schola_cantorum_modifier: "Schola cantorum"
 tenet_divine_liturgy_schola_cantorum_modifier_desc: "Lenní pán, který udržuje školu posvátného zpěvu, má i liturga, jemuž stojí za to naslouchat."
 tenet_pentarchy_holy_site_modifier: "Patriarchální stolec"
 tenet_pentarchy_holy_site_modifier_desc: "Svaté místo tohoto hrabství vzkvétá pod správou věřících."
 tenet_polyamory_new_beloved_modifier: "Záře nové lásky"
 tenet_polyamory_new_beloved_modifier_desc: "Nová láska naplnila tuto postavu nevýslovnou radostí."
 modifier_definition_value_per_chaplain_learning: "\t#weak Zvýšení za každý bod [Concept('learning','učenosti')|E] [Concept('court_chaplain','dvorního kaplana')|E] (max. [EmptyScope.ScriptValue('pam_divine_liturgy_chaplain_learning_cap_value')])#!"
 tenet_purgatory_sin_penalty_modifier: "Dluh trestu"
 tenet_purgatory_sin_penalty_modifier_desc: "Vyznaný hřích je odpuštěný hřích, ale dluh trestu, který z něj vzešel, tím nezaniká. Co není splaceno v tomto životě, bude vymáháno v příštím. Věřící dobře vidí, kterou z těchto cest si tato postava zvolila."
 tenet_original_sin_sinners_insight_modifier: "Vhled hříšníka"
 tenet_original_sin_sinners_insight_modifier_desc: "Kdo nese tíhu hříchu, dobře ví, kde se skrývá v ostatních."
 pam_holy_weapon_1_artifact_modifier: "Křest krví"
 pam_holy_weapon_1_artifact_modifier_desc: "Tato [Concept('holy_relic','svatá relikvie')|E] doprovázela vítězné tažení proti nepřátelům své [Concept('faith','víry')|E]. Zbožní si jí začínají všímat."
 pam_holy_weapon_2_artifact_modifier: "Osvědčení v boji"
