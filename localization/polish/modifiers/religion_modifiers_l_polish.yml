l_polish:
 VIRTUE_MODIFIER: "[TRAIT.GetName( GetPlayer )|L] ([virtue|E])"
 SIN_MODIFIER: "[TRAIT.GetName( GetPlayer )|L] ([sin|E])"
 recent_excommunication: "Nedávná exkomunikace"
 recent_excommunication_desc: "Tato postava byla nedávno [Concept('excommunicated','exkomunikována')|E], což poškodilo její postavení v očích příslušníků její víry."
 excommunication_recently_lifted: "Nedávno zrušená exkomunikace"
 excommunication_recently_lifted_desc: "Bude nějakou dobu trvat, než poskvrna někdejší [Concept('excommunication','exkomunikace')|E] této postavy zcela vybledne."
 vow_of_poverty_modifier: "Slib chudoby"
 vow_of_poverty_modifier_desc: "Tato postava složila posvátný slib, že se vzdá značné části svého bohatství."
 temporal_condemnation_modifier: "Světské odsouzení"
 temporal_condemnation_modifier_desc: "Náboženské autority odsoudily tuto postavu jako nezpůsobilou vést věřící."
 scorned_theocrats_modifier: "Pohrdání duchovenstvem"
 scorned_theocrats_modifier_desc: "Tato postava veřejně urazila člena duchovenstva a vyhrožovala mu."
 known_non_believer: "Nevěřící"
 known_non_believer_desc: "Nevíra této postavy byla odhalena."
 dynasty_beneficiary_won_ghw: "Horlivá dynastie"
 dynasty_beneficiary_won_ghw_desc: "Nikdo nemůže popřít horlivost a statečnost, s nimiž se členové této dynastie znovu a znovu vyznamenávali ve válce, zejména v záležitostech víry."
 house_beneficiary_won_ghw_crusade: "Křižácký rod"
 house_beneficiary_won_ghw_crusade_desc: "Když nastal čas prokázat oddanost církvi, členové tohoto rodu ochotně vyslyšeli volání do zbraně a vyznamenali se v boji proti pohanům."
 house_beneficiary_won_ghw_jihad: "Rod mudžáhidů"
 house_beneficiary_won_ghw_jihad_desc: "Není pochyb o tom, že v členech tohoto rodu stále mocně plane duch posvátného boje."
 house_beneficiary_won_ghw: "Svatí válečníci"
 house_beneficiary_won_ghw_desc: "Členové tohoto rodu se znovu a znovu vyznamenávali v boji proti nepřátelům víry, čímž nade vši pochybnost prokázali svou horlivost."
 resurging_saoshyant: "Návrat Saošjanta"
 resurging_saoshyant_desc: "Z této dynastie vzešel prorokovaný Saošjant, jenž se navrátil, aby vyvedl svět z temnoty."
 wind_spirit_blessing: "Požehnání duchů větru"
 wind_spirit_blessing_desc: "Proslýchá se, že této postavě požehnali duchové."
 water_spirit_blessing: "Požehnání duchů vod"
 water_spirit_blessing_desc: "$wind_spirit_blessing_desc$"
 rock_spirit_blessing: "Požehnání duchů skal"
 rock_spirit_blessing_desc: "$wind_spirit_blessing_desc$"
 tree_spirit_blessing: "Požehnání duchů stromů"
 tree_spirit_blessing_desc: "$wind_spirit_blessing_desc$"
 bush_spirit_blessing: "Požehnání duchů keřů"
 bush_spirit_blessing_desc: "$wind_spirit_blessing_desc$"
 bhakti_hinduism_ganga: "Oddanost Ganze"
 bhakti_hinduism_ganga_desc: "Bhakti této postavy náleží Ganze, bohyni čistoty, odčinění a mókši."
 bhakti_hinduism_saraswati: "Oddanost Sarasvatí"
 bhakti_hinduism_saraswati_desc: "Bhakti této postavy náleží Sarasvatí, bohyni učenosti, hudby, umění a moudrosti."
 bhakti_hinduism_kali: "Oddanost Kálí"
 bhakti_hinduism_kali_desc: "Bhakti této postavy náleží Kálí, bohyni ničící síly zla."
 bhakti_hinduism_kubera: "Oddanost Kubérovi"
 bhakti_hinduism_kubera_desc: "Bhakti této postavy náleží Kubérovi, znetvořenému bohu bohatství, spravedlnosti a hmotných statků."
 bhakti_vaishnavism_lakishmi: "Oddanost Lakšmí"
 bhakti_vaishnavism_lakishmi_desc: "Bhakti této postavy náleží Lakšmí, bohyni bohatství, štěstěny a blahobytu."
 bhakti_vaishnavism_jagganath: "Oddanost Džagannáthovi"
 bhakti_vaishnavism_jagganath_desc: "Bhakti této postavy náleží Džagannáthovi, Pánu vesmíru."
 bhakti_vaishnavism_hayagriva: "Oddanost Hajagrívovi"
 bhakti_vaishnavism_hayagriva_desc: "Bhakti této postavy náleží Hajagrívovi, bohu vědění a moudrosti s koňskou hlavou."
 bhakti_shaivism_parvati: "Oddanost Párvatí"
 bhakti_shaivism_parvati_desc: "Bhakti této postavy náleží Párvatí, bohyni plodnosti, lásky, krásy, manželství, dětí a oddanosti."
 bhakti_shaivism_virabhadra: "Oddanost Vírabhadrovi"
 bhakti_shaivism_virabhadra_desc: "Bhakti této postavy náleží Vírabhadrovi, mimořádně divoké a děsivé podobě Šivy, která ztělesňuje zuřivost a spravedlivý hněv."
 bhakti_shaivism_munishwarar: "Oddanost Muníšvararovi"
 bhakti_shaivism_munishwarar_desc: "Bhakti této postavy náleží Muníšvararovi, světecké podobě Šivy, která ztělesňuje rodinnou lásku."
 bhakti_shaivism_dakshinamoorthy: "Oddanost Dakšinamúrtimu"
 bhakti_shaivism_dakshinamoorthy_desc: "Bhakti této postavy náleží Dakšinamúrtimu, bohu učenosti ve všech jejích podobách."
 bhakti_smartism_ganesha: "Oddanost Ganéšovi"
 bhakti_smartism_ganesha_desc: "Bhakti této postavy náleží Ganéšovi, bohu vědění, písma, moudrosti a nových počátků se sloní hlavou."
 bhakti_smartism_vishnu: "Oddanost Višnuovi"
 bhakti_smartism_vishnu_desc: "Bhakti této postavy náleží Višnuovi, bohu, který bdí nad stvořením a chrání je."
 bhakti_smartism_shiva: "Oddanost Šivovi"
 bhakti_smartism_shiva_desc: "Bhakti této postavy náleží Šivovi, bohu, který vyhledává a ničí zlo ve všech jeho podobách."
 bhakti_germanic_generic_odin: "Oddanost Odinovi"
 bhakti_germanic_generic_odin_desc: "Oblíbeným bohem této postavy je Odin, bůh války, čarodějnictví, smrti a poezie."
 bhakti_germanic_not_danish_ullr: "Oddanost Ullrovi"
 bhakti_germanic_not_danish_ullr_desc: "Oblíbeným bohem této postavy je Ullr, bůh války a cti."
 bhakti_germanic_danish_tyr: "Oddanost Týrovi"
 bhakti_germanic_danish_tyr_desc: "Oblíbeným bohem této postavy je Týr, bůh války a statečnosti."
 bhakti_germanic_generic_thor: "Oddanost Thorovi"
 bhakti_germanic_generic_thor_desc: "Oblíbeným bohem této postavy je Thor, bůh ochrany, bouří, lidstva a síly."
 bhakti_germanic_generic_freyr: "Oddanost Freyrovi"
 bhakti_germanic_generic_freyr_desc: "Oblíbeným bohem této postavy je Freyr, bůh míru, sklizně a laskavé vlády."
 meditating_in_seclusion_modifier: "Rozjímání v ústraní"
 meditating_in_seclusion_modifier_desc: "Tato postava se vydala na vnitřní pouť a věnuje jen málo pozornosti hmotným věcem."
 astrology_great_battle: "Příprava na velkou bitvu"
 astrology_great_battle_desc: "Tato postava očekává velkou bitvu a připravuje se na ni."
 astrology_new_friends: "Navazování nových přátelství"
 astrology_new_friends_desc: "Tato postava urovnává stará nepřátelství a navazuje nová přátelství."
 astrology_hard_work: "Neúnavná práce"
 astrology_hard_work_desc: "Tato postava hodlá dokázat, že tvrdá práce a odhodlání přinášejí ovoce."
 astrology_betrayal: "Podezřívavost vůči ostatním"
 astrology_betrayal_desc: "Něco v této postavě vzbudilo podezřívavost a nedůvěru vůči ostatním."
 astrology_new_beginnings: "Otevřená mysl"
 astrology_new_beginnings_desc: "Tato postava se aktivně snaží zachovat si otevřenou mysl."
 feud_with_the_church_modifier: "Spor s církví"
 feud_with_the_church_modifier_desc: "Je známo, že tato postava vede s církví ostrý spor a mohla by se uchýlit k něčemu krajnímu."
 sun_trial_suspicious_modifier: "Podezřelý sluneční soud"
 sun_trial_suspicious_modifier_desc: "Tato postava podle všeho vedla sluneční soud, který skončil za poněkud podezřelých okolností, což poškodilo její pověst."
