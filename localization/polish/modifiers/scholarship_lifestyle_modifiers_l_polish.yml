 rebuked_the_heathen_modifier_desc: "Tato postava nechce mít nic společného s jinověrci, kacíři, odpadlíky ani jinými osobami #EMP pochybného#! charakteru."
 refused_heathen_knowledge_modifier: "Odmítání vědění jinověrců"
