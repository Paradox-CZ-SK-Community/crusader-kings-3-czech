l_polish:
 cat_story_modifier: "Domácí kočka"
 cat_story_modifier_desc: "Tato postava si užívá společnost kočičího společníka."
 dog_story_modifier: "Domácí pes"
 dog_story_modifier_desc: "Věrný pes následuje tuto postavu, kamkoli se vydá."
 dog_story_walking_modifier: "Venčení psa"
 dog_story_walking_modifier_desc: "Tato postava si užívá časté procházky se svým psem."
 dog_story_fur_carpet_modifier: "Kožešinový koberec"
 dog_story_fur_carpet_modifier_desc: "Tato postava vlastní nádherný kožešinový koberec."
 cat_story_allergy_modifier: "Přecitlivělost na kočky"
 cat_story_allergy_modifier_desc: "Přítomnost kočky způsobuje této postavě nepříjemné obtíže."
 cat_killing_rodents_modifier: "Bez krys"
 cat_killing_rodents_modifier_desc: "Sídlo této postavy je téměř zcela prosté krys."
 cat_story_fur_mittens_modifier: "Kožešinové palčáky"
 cat_story_fur_mittens_modifier_desc: "Tato postava má pár kožešinových palčáků, které jí v chladu zahřívají ruce."
 rat_hunting_dog_modifier: "Krysařský pes"
 rat_hunting_dog_modifier_desc: "Pes této postavy je neobyčejně zdatným lovcem hlodavců."
 rat_hunting_cat_modifier: "Kočka lovící krysy"
 rat_hunting_cat_modifier_desc: "Kočka této postavy je neobyčejně zdatným lovcem hlodavců."
 cat_dopey_modifier: "Popletená kočka"
 cat_dopey_modifier_desc: "Kočka této postavy je, řekněme, poněkud nešikovná."
 cat_wrangler_modifier: "Krotitel koček"
 cat_wrangler_modifier_desc: "Tato postava se osvědčila jako odborník na záludné umění zacházení s kočkami."
 cat_coitus_interrupted_modifier: "Kočičí narušitel"
 cat_coitus_interrupted_modifier_desc: "Milostná dostaveníčka této postavy narušovala přítomnost až příliš přítulné kočky."
 cat_rejection_modifier: "Kočičí odmítnutí"
 cat_rejection_modifier_desc: "Tato postava ke své velké nelibosti zjistila, že její kočka dává přednost společnosti jiných."
 cat_ill_modifier: "Kočičí ošetřovatel"
 cat_ill_modifier_desc: "Během zotavování dělala této postavě společnost její přítulná kočka."
 cat_lover_modifier: "Milovník koček"
 cat_lover_modifier_desc: "Tato postava je svému chlupatému společníkovi naprosto oddaná, až tím poněkud rozčiluje svou radu."
 eagle_story_modifier: "Lovecký orel"
 eagle_story_modifier_desc: "Tuto postavu při lovu a výpravách po stepi doprovází majestátní orel.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 brave_eagle_story_modifier: "Odvážný orel"
 brave_eagle_story_modifier_desc: "Lovecký orel této postavy je obzvláště odvážný a nezalekne se žádného domnělého nebezpečí.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!."
 curious_eagle_story_modifier: "Zvědavý orel"
 curious_eagle_story_modifier_desc: "Lovecký orel této postavy je zvědavý jako dítě a často zkoumá vše, co upoutá jeho pozornost.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 loyal_eagle_story_modifier: "Věrný orel"
 loyal_eagle_story_modifier_desc: "Lovecký orel této postavy je bezmezně věrný a nikdy neopustí svého majitele.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 calm_eagle_story_modifier: "Klidný orel"
 calm_eagle_story_modifier_desc: "Lovecký orel této postavy je klidný a vyrovnaný a nikdy se příliš nerozruší ani nevyděsí.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 wise_eagle_story_modifier: "Moudrý orel"
 wise_eagle_story_modifier_desc: "Lovecký orel této postavy je na svůj věk neobyčejně moudrý a často činí rozhodnutí, která jeho majitele překvapí.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!"
 cunning_eagle_story_modifier: "Vychytralý orel"
 cunning_eagle_story_modifier_desc: "Lovecký orel této postavy je vychytralý a často svou kořist přelstí.\n$hunt_type_falconry$ [hunt_success_chance|E]: #P +10%#!."
 weak_eagle_modifier: "Slabý orel"
 weak_eagle_modifier_desc: "Lovecký orel této postavy je slabý a často má potíže ulovit svou kořist."
 very_weak_eagle_modifier: "Neduživý orel"
 very_weak_eagle_modifier_desc: "Lovecký orel této postavy chřadne a je na pokraji smrti."
 strong_eagle_modifier: "Statný orel"
 strong_eagle_modifier_desc: "Lovecký orel této postavy vyniká mimořádným zdravím a silou."
 skilled_eagle_modifier: "Zkušený sokolník"
 skilled_eagle_modifier_desc: "Tato postava je zkušeným sokolníkem a její lovecký orel je obzvláště dobře vycvičený."
 eagle_personality_level_desc: "Bez výcviku"
 observant_eagle_story_modifier: "Všímavý orel"
 observant_eagle_story_modifier_desc: "Lovecký orel této postavy je obzvláště všímavý a často zahlédne věci, které by jeho majitel mohl přehlédnout."
 protective_eagle_story_modifier: "Ochranitelský orel"
 protective_eagle_story_modifier_desc: "Lovecký orel této postavy chrání svého majitele a často zasáhne, aby zabránil jeho újmě."
 aggressive_eagle_story_modifier: "Útočný orel"
 aggressive_eagle_story_modifier_desc: "Lovecký orel této postavy je obzvláště bojovný a často bez varování napadá vše, co považuje za hrozbu."
 eagle_hunter_childhood_modifier: "Rozený sokolník"
 eagle_hunter_childhood_modifier_desc: "Tato postava cvičí s orly již od dětství a má předpoklady stát se zkušeným sokolníkem.\n[hunt_success_chance|E]: #P +5%#!"
 hunt_success_chance.eagle_hunter_childhood_modifier: "[GetModifier('eagle_hunter_childhood_modifier').GetNameWithTooltip]"
