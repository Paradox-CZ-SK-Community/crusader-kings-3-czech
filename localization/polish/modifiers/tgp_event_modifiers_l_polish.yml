l_polish:
 tgp_doddering_magistrate_modifier: "Senilní správce"
 tgp_doddering_magistrate_modifier_desc: "Je vskutku působivé, kolik úředního chaosu může způsobit jediný člověk."
 tgp_disrespected_elderly_modifier: "Zneuctění starších"
 tgp_disrespected_elderly_modifier_desc: "Jediný nespokojený stařec dokáže vyvolat překvapivé množství potíží."
 tgp_reduced_taxes_modifier: "Snížené daňové břemeno"
 tgp_reduced_taxes_modifier_desc: "Snížení daní sice státní pokladnu neobohatí, ale nepochybně činí divy s oblibou vlády."
 tgp_imprisoned_poor_modifier: "Uvěznění chudiny"
 tgp_imprisoned_poor_modifier_desc: "Zdá se, že věznění chudých je překvapivě nepopulární."
 tgp_compelled_labor_modifier: "Nucené práce"
 tgp_compelled_labor_modifier_desc: "Lid byl povolán k práci, a přestože z toho není právě nadšený, plní své úkoly účinně."
 tgp_appreciative_populace_modifier: "Vděčný lid"
 tgp_appreciative_populace_modifier_desc: "Prostý lid si vždy váží ctnostných správců."
 tgp_pardoned_prisoners_modifier: "Propuštění vězni"
 tgp_pardoned_prisoners_modifier_desc: "I ti nejméně provinilí se něčeho dopustili a někteří se rychle vrátili ke starým návykům."
 tgp_convict_labor_modifier: "Práce trestanců"
 tgp_convict_labor_modifier_desc: "Při stavebních pracích představují vězni odvěké řešení nedostatku pracovních sil."
 tgp_enforced_justice_on_official_modifier: "Neúprosná spravedlnost"
 tgp_enforced_justice_on_official_modifier_desc: "Správa, která zachází s vlastními lidmi stejně přísně jako s ostatními, si zaslouží úctu."
 tgp_potent_physick: "Účinný lék"
 tgp_potent_physick_desc: "Mastičkářův lektvar se ukázal být #EMP povzbuzující#! ve více ohledech."
 tgp_expelled_popular_peddler_modifier: "Vyhnání oblíbeného mastičkáře"
 tgp_expelled_popular_peddler_modifier_desc: "Tržiště truchlí nad ztrátou tak účinného elixíru."
 tgp_delayed_taxes_modifier: "Odložené daně"
 tgp_delayed_taxes_modifier_desc: "Obyvatelům této provincie bylo dovoleno odložit placení daní – ke škodě správní pokladny, avšak k radosti lidu."
 tgp_reassured_populace: "Uklidněný lid"
 tgp_reassured_populace_desc: "Důvěryhodný vůdce je pro ustaraný lid velkým zdrojem útěchy."
 tgp_state_annexed_land: "Půda zabraná státem"
 tgp_state_annexed_land_desc: "Co stát chce, to si také často vezme, a jen málokdo se může odvážit protestovat."
 tgp_empowered_merchants_association: "Posílené sdružení obchodníků"
 tgp_empowered_merchants_association_desc: "Udělení zvláštních výsad určité skupině obchodníků může vyřešit mnoho problémů tržiště, ale také vytvořit nebezpečný precedens."
 tgp_army_reconstruction: "Obnova za pomoci vojska"
 tgp_army_reconstruction_desc: "Vojáci mohou reptat, že byli nasazeni na pracovní projekty, jejich účinnost však nelze popřít."
 tgp_well_planned_bridge: "Dobře navržený most"
 tgp_well_planned_bridge_desc: "Nedávno zde byl vystavěn pozoruhodný most."
 tgp_settled_caravans: "Usazené kupecké karavany"
 tgp_settled_caravans_desc: "Přesvědčit kupecké karavany k trvalému usazení se ukázalo být přínosem pro místní hospodářství."
 tgp_suppressed_popular_storyteller: "Umlčený oblíbený vypravěč"
 tgp_suppressed_popular_storyteller_desc: "Umlčení otevřeného hlasu může nepokoje potlačit, ale také je vyvolat."
 tgp_state_sponsored_storytellers: "Státem podporovaní vypravěči"
 tgp_state_sponsored_storytellers_desc: "Zdejší lid je pravidelně obveselován příběhy o laskavých správcích a hrdinných vojácích."
 tgp_converted_storyteller: "Přeběhlý vypravěč"
 tgp_converted_storyteller_desc: "Málokdo káže s takovou horlivostí jako konvertita a zdá se, že to platí pro vypravěče stejně jako pro kněze."
 tgp_consolidated_population: "Soustředěné obyvatelstvo"
 tgp_consolidated_population_desc: "Soustředění obyvatel rozptýlených vesnic na jednom místě výrazně podpořilo rozvoj tohoto kraje."
 tgp_market_regulation: "Dobře regulované tržiště"
 tgp_market_regulation_desc: "Přísná ruka státu zajišťuje, že obchod probíhá řádně a v souladu s nařízeními."
 tgp_purchased_land: "Nákupy půdy"
 tgp_purchased_land_desc: "Kariéra ve státní správě často nabízí hojné příležitosti k osobnímu obohacení."
 tgp_hastily_rebuilt_bridge: "Narychlo obnovený most"
 tgp_hastily_rebuilt_bridge_desc: "Spěch není při stavbě vždy nejmoudřejším postupem, ale někdy je potřeba příliš naléhavá, než aby bylo možné čekat."
 tgp_ferry_crossing: "Přívoz"
 tgp_ferry_crossing_desc: "Obtížné problémy často vyžadují novátorská řešení a přívoz může most dobře nahradit."
 tgp_harem_medical_treatment_modifier: "Péče v harému"
 tgp_harem_medical_treatment_modifier_desc: "Květy harému jsou stejně křehké jako půvabné a jejich zdraví musí být střeženo stejně jistě a přísně jako jejich věrnost."
 tgp_emperors_notice_modifier: "Pozornost Syna nebes"
 tgp_emperors_notice_modifier_desc: "Navzdory svému nízkému původu byla tato postava během metropolitní zkoušky objevena Synem nebes mezi davy."
 tgp_harsh_cultivation_modifier: "Tvrdá průprava"
 tgp_harsh_cultivation_modifier_desc: "Nelítostné soupeření s ostatními učedníky svého mentora vytváří náročné studijní prostředí, ale také přináší mnoho pozornosti."
 tgp_strict_supervision_modifier: "Přísný dohled"
 tgp_strict_supervision_modifier_desc: "Nesčetní hledí k nebesům. Jen na málokoho hledí nebesa zpět. A pouze tuto postavu sledují s obzvláštní pozorností."
