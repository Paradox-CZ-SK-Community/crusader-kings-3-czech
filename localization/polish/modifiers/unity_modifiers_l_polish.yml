 unity_house_focused_on_diplomacy_modifier: "Diplomatické úsilí"
 unity_house_focused_on_diplomacy_modifier_desc: "Členové tohoto rodu spolupracují, aby mohli účinněji uplatňovat svůj vliv."
 fp3_unity_promoted_development_modifier: "Podpora rozvoje"
 fp3_unity_promoted_development_modifier_desc: "Členové tohoto rodu spolupracují na rozvoji svých zemí."
 fp3_unity_improved_logistics_modifier: "Sdílená vojenská logistika"
 fp3_unity_improved_logistics_modifier_desc: "Členové tohoto rodu společně využívají vojenskou logistiku a zásoby."
