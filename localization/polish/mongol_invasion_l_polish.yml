l_polish:
 submit_to_the_great_khan_decision: "Poddat se Velkému chánovi"
 submit_to_the_great_khan_decision_confirm: "Budu se plazit, jen abych si zachránil život"
 submit_to_the_great_khan_decision_opening_desc: "Mé panství lehne popelem, z mých lidí budou mrtvoly a mé tělo se stane terčem tisíce ran a úderů... pokud nebudu prosit o milost velkého jezdce, který dobývá svět."
 submit_to_the_great_khan_decision_tooltip: "Staneš se vazalem Největšího z chánů"
 mongol_invasion.1001.title: "Smrt chána!"
 mongol_invasion.1001.generic.desc: "[ROOT.Char.GetFaith.HighGodName] stojí při nás a [ROOT.Char.GetFaith.DeathDeityName] skolí i nejmocnější! Zprávy jsou dobré: [old_khan.GetTitledFirstNameNicknamed] — [Select_CString(old_khan.IsFemale, 'paní koní a plenitelka', 'pán koní a plenitel')] — [old_khan.GetDeathReasonHideKiller|l].\n\nUž teď se strachem mluvíme o novém děsivém vládci [new_khan.GetPrimaryTitle.GetNameNoTier]... ale [new_khan.GetTitledFirstNameNicknamed] přece #EMP nemůže#! nahánět takovou hrůzu jako [old_khan.GetTitledFirstNameNicknamed]...\n\nMožná tím dokonce končí [new_khan.GetPrimaryTitle.GetAdjectiveNoTooltip] dobývání?"
 mongol_invasion.1001.sympathetic.desc: "#EMP Ach, ten nářek! To bědování!#! [Select_CString(old_khan.IsFemale, 'Velká', 'Velký')] [old_khan.GetTitledFirstNameNicknamed] [Select_CString(old_khan.IsFemale, 'byla Nebesy vyvolena', 'byl Nebesy vyvolen')] dobýt celou Zemi a nyní už není mezi námi. Říká se, že [old_khan.GetTitleAsNameNoTooltip] [old_khan.GetDeathReasonHideKiller|l].\n\nPo smrti svého pána svolává [new_khan.GetPrimaryTitle.GetDefinitiveName] velký #EMP kurultaj#! a [Select_CString(new_khan.IsFemale, 'je prohlášena nová', 'je prohlášen nový')] [new_khan.GetTitleAsNameNoTooltip].\n\nA tak zatímco [old_khan.GetFirstNameNoTooltip] bude navěky cválat po nebi, [new_khan.GetTitledFirstNameNicknamed] bude mít celou Zemi!"
 mongol_invasion.1001.a: "Přesto se mi ruce stále třesou..."
 mongol_invasion.1001.b: "Velká [new_khan.GetPrimaryTitle.GetTierAsNameNoTooltip] trvá dál."
 mongol_invasion.1001.c: "[old_khan.GetFirstNameNoTooltip] má čestné místo: [ROOT.Char.GetFaith.NegativeAfterLife]."
 mongol_invasion.1002.t: "Povstávají [genghis_khan.GetCulture.GetCollectiveNounNoTooltip]"
 mongol_invasion.1002.desc.close: "Ze znesvářených klanů"
 mongol_invasion.1002.desc.close_mongolia: "Mongolska"
 mongol_invasion.1002.desc.close_steppes: "stepí"
 mongol_invasion.1002.desc.close.mid: "povstává obávaný vůdce [genghis_khan.GetTitledFirstName]. Na velkolepém #EMP kurultaji#! mudrci lidu vyhlašují: je to "
 mongol_invasion.1002.desc.genghis: "[Glossary( 'Čingischán', 'GENGHIS_KHAN_GLOSS' )]."
 mongol_invasion.1002.desc.gok: "Největší ze všech chánů!"
 mongol_invasion.1002.desc.close.end: "Všem čtyřem koutům světa má po právu vládnout právě [genghis_khan.GetTitledFirstName].\n\nPod [Select_CString(genghis_khan.IsFemale, 'její', 'jeho')] korouhví se shromažďují nesčetní nomádští jezdci. Z vůle svého Největšího z chánů zpřetrhávají staré kmenové svazky, znovu se řadí k válce a s hromovým dusotem vyrážejí dobýt celou step, celý svět — vše pod Velkým modrým nebem!"
 GENGHIS_KHAN_GLOSS: "Pouze jediný velký panovník kdy nesl mongolský čestný titul #G Čingis#! neboli #G Čingischán#!. Jeho význam není jistý; snad označoval sílu, spravedlnost či „univerzální“ nebo „oceánskou“ vládu. A vskutku, držitel tohoto titulu daleko převýšil #EMP gürchána#! své doby a vytvořil největší stepní říši, jakou svět kdy spatřil."
 mongol_invasion.1002.desc.far_intro: "Přichází zpráva... mezi barbarskými kmeny vzdálených stepí nastoluje krutovládu [genghis_khan.GetTitledFirstName] a prohlašuje se za Vládce vesmíru —"
 mongol_invasion.1002.desc.far: "\n\nZatímco se mí rádci nervózně smějí, tvrdí mi, že [genghis_khan.GetTitledFirstName] přísahá, že dobude celý svět, rozdrtí města pod koňskými kopyty a rozervá hradby luky a šípy.\n\nTakové řeči už z úst nomádů zazněly... ale také prý [genghis_khan.GetTitleAsNameNoTooltip] jede v čele tisícové hordy nezničitelných jezdců, které nelze zabít."
 mongol_invasion.1002.a: "Jaká drzost! [genghis_khan.GetCulture.GetCollectiveNounNoTooltip] se pomátli."
 mongol_invasion.1002.b: "Za našimi hradbami... tady jsme přece v bezpečí."
 mongol_invasion.1002.craven: "A [Select_CString(genghis_khan.IsFemale, 'ta', 'ten')] [genghis_khan.GetTitledFirstName] míří sem?!"
 mongol_invasion.1002.genghis_khan_tt: "@warning_icon! #X [genghis_khan.GetCulture.GetCollectiveNoun] při obsazování [Concept('counties','hrabství')|E] připraví tato území o značnou část jejich [Concept('development','rozvoje')|E]#!"
 genghis_khan_mongol_empire_tt: "Získáno: [GetTitleByKey('e_mongol_empire').GetName]"
 genghis_khan_mongol_troops_tt: "Získána mohutná [Concept('special_troops','vojska z událostí')|E]"
 mongol_invasion_submission_reminder_tt: "Zkáze se můžeš vyhnout pomocí #high $submit_to_the_great_khan_decision$#! [Concept('decision','rozhodnutí')|E]"
 gok_threatening_powers_tt: "@warning_icon! #X Bude [Concept('rulers','vládcům')|E] vyhrožovat zničením [Concept('holdings','držav')|E], povražděním [Concept('courtiers','dvořanů')|E] a zabavením [Concept('title','titulu')|E], pokud odmítnou [Concept('vassalization','vazalizaci')|E]#!"
 mongol_invasion.1003.t: "Dům moudrosti v plamenech"
 mongol_invasion.1003.desc: "Slavný bagdádský Dům moudrosti, centrum vzdělanosti a poznání, padl za oběť požáru a zkáze během mongolského obléhání města.\n\nZůstaly po něm jen trosky, jako by měly ukázat, jakou cenu má staré poznání v novém světě Mongolů."
 mongol_invasion.1003.a: "Tolik toho bylo ztraceno..."
 mongol_invasion.1003.b: "Jsou to jen pohané, kteří dostali, co si zaslouží!"
 mongol_invasion.1003.c: "Pokud Mongoly nezastavíme, zničí celý svět!"
 mongol_invasion.1004.t: "Rozpad Velkého chanátu"
 mongol_invasion.1004.desc: "Se smrtí mocného [old_mongol_emperor.GetFirstName] — pána všech zemí podrobených Mongoly — se několik nástupců dožaduje místa Velkého chána. Nikdo z nich neuznává legitimitu ostatních.\n\nA tímto končí jednotná mongolská říše.\n\nTito potomci prvního velkého dobyvatele si stále uchovávají jistou sílu. Volají po válce. Ale ani jeden z nich, ani [successor_1.GetName], ani [successor_2.GetName], nevyniká nad ostatní jako vládce celého vesmíru."
 mongol_invasion.1004.a: "Říše jednoho dne znovu povstane..."
 mongol_invasion.1004.b: "[ROOT.Char.GetFaith.HighGodName] konečně prokazuje své milosrdenství..."
 mongol_invasion.1005.t: "Chán je mrtev"
 mongol_invasion.1005.desc: "Když [new_khan.GetPrimaryTitle.GetAdjective] trůn přechází z [old_khan.GetTitledFirstName] na [new_khan.GetTitledFirstName], mí rádci se škodolibě pochechtávají a s úlevou oddechují... neboť [new_khan.GetFirstNameNoTooltip] si netroufá nazývat se „[Select_CString(new_khan.IsFemale, 'vládkyní vesmíru', 'vládcem vesmíru')]“.\n\nKdysi nomádi ze stepi ohrožovali celý svět a shromažďovali obrovské hordy. Teď konečně uznávají, že jejich cíle byly nad jejich síly."
 mongol_invasion.1005.a: "Éra strachu je u konce."
 mongol_invasion.1005.a.tt: "[GetTitleByKey('e_mongol_empire').GetName] přijde o své hlavní prostředky k dobývání a nebude už tolik usilovat o další výboje"
 mongol_invasion.2001.opening: "Ty, kdo mi máš podle osudu sloužit,"
 mongol_invasion.2001.desc: "Jako vládci vesmíru je mi jasné, že přede mnou nakonec skloníš hlavu. Ať se tak stane přísahou lenní věrnosti, a ne úderem katovy sekery na tvůj krk."
 mongol_invasion.2001.a: "Se ctí se podrobuji. Mým panovníkem bude [mongol_emperor.GetTitleAsNameNoTooltip]."
 mongol_invasion.2001.a.tt: "Přísaháš lenní věrnost: [mongol_emperor.GetShortUIName]"
 mongol_invasion.2001.b: "Pro mě nejsi žádnou hrozbou, ty arogantní hlupáku!"
 mongol_invasion.2001.b.tt: "[mongol_emperor.GetShortUIName|U] ti vyhlásí válku"
 mongol_invasion.2002.opening: "[Select_CString(ROOT.Char.IsFemale, 'Ctěná vládkyně vesmíru,', 'Ctěný vládce vesmíru,')]"
 mongol_invasion.2002.desc: "Podrobuji se tvé oprávněné a milosrdné vládě. Budu stát při tobě proti každému, kdo se postaví tvému osudu."
 mongol_invasion.2002.a: "Moudrá volba, [Select_CString(demand_recipient.IsFemale, 'má služebnice', 'můj služebníku')]."
 mongol_invasion.2003.opening: "[mongol_emperor.GetTitleAsNameNoTooltip]? Ty [mongol_emperor.Custom2('InsultAdjective', SCOPE.sC('demand_recipient'))|l] stíne,"
 mongol_invasion.2003.desc: "Opovažuješ se myslet, že mě výhrůžkami donutíš k poslušnosti? Ukážu ti, jak naložím s tvými takzvaně neporazitelnými jezdci!"
 mongol_invasion.2003.a: "Tak tedy válka a smrt."
 mongol_invasion.2101.desc: "Dosud mi dobře sloužíš a stojíš při mně. Je načase dát tvé službě oficiální podobu a stvrdit ji přísahou lenní věrnosti tomu, kdo vládne vesmíru."
 mongol_invasion.2101.a: "Samozřejmě, [Select_CString(mongol_emperor.IsFemale, 'má lenní paní', 'můj lenní pane')]."
 mongol_invasion.2101.b: "Ty si myslíš, že ti sloužím? Směšné!"
 mongol_invasion.2101.b.tt: "@warning_icon! [mongol_emperor.GetShortUIName] ruší spojenectví s tebou a místo toho ti může vyhlásit válku!"
 mongol_invasion.2103.a: "Teď přede mnou skloníš hlavu, tak či onak!"
 mongol_invasion.2103.b: "Jen počkej, ty drzý pse..."
 mongol_invasion.2111.b: "Považuješ mě za někoho sobě nerovného? To je nehorázné!"
 mongol_invasion.2111.b.tt: "@warning_icon! [mongol_emperor.GetShortUIName] ruší spojenectví s tebou"
 mongol_invasion.2112.desc: "Ty si vážně myslíš, že nade mnou stojíš? Vždyť se mi ani nemůžeš měřit! Je jasné, že má velkorysá nabídka přátelství nebyla ničím jiným než házením perel sviním."
 mongol_invasion.2112.a: "Ach, těch slov a činů budeš litovat..."
 temujin_horde_gathers_tt: "@alert_icon! #alert_trial Kočovní válečníci se pod tvou korouhví budou dál shromažďovat, neboť Nebesa si tě zvolila, a získáš tak více @herd_icon![Concept('herd','stáda')|E], @prestige_icon![Concept('prestige','prestiže')|E] a @gold_icon![Concept('gold','zlata')|E] — pokud tvá [Concept('dominance','dominance')|E] zůstane vyšší než [GetLaw('nomadic_authority_3').GetName]#!"
 mpo_greatest_of_khans.1010_title: "Menší klany se přidávají k hordě"
 mpo_greatest_of_khans.1010_desc: "Jezdci bez pána přísahají věrnost! Dychtiví válečníci nabízejí své luky! Nesčetné rodiny proudí do tvého velkého tábora!"
 cadet_name_great_yuan: "Bordžigin"
