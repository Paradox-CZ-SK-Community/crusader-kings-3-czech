l_polish:
 DEFAULT_NICKNAME_DESC: "Přátelé i nepřátelé po celé zemi [Select_CString( CHARACTER.IsLocalPlayer, 'tě znají', Concatenate( 'znají ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] pod přízviskem „[CHARACTER.GetNicknameNoTooltip]“."
 nick_tiny: "[Select_CString( CHARACTER.IsFemale, 'Malá', 'Malý' )]"
 nick_tiny_desc: "O [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_L') )] se ví, že [Select_CString( CHARACTER.IsLocalPlayer, 'máš', 'má' )]... vysoké ambice."
 nick_bluetooth: "[Select_CString( CHARACTER.IsFemale, 'Modrozubá', 'Modrozubý' )]"
 nick_bluetooth_desc: "Jediný zčernalý zub [Select_CString( CHARACTER.IsLocalPlayer, 'ti propůjčuje', Concatenate( 'propůjčuje ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] nezaměnitelný a proslulý úsměv."
 nick_canmore: "[Select_CString( CHARACTER.IsFemale, 'Velkohlavá', 'Velkohlavý' )]"
 nick_canmore_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'považována', 'považován' )] za mocnou sílu sjednocující panství a [Select_CString( CHARACTER.IsLocalPlayer, 'říká se ti', Select_CString( CHARACTER.IsFemale, 'říká se jí', 'říká se mu' ) )] také „Velký náčelník“."
 nick_tanglehair: "[Select_CString( CHARACTER.IsFemale, 'Rozcuchaná', 'Rozcuchaný' )]"
 nick_tanglehair_desc: "[CZProDropNF(CHARACTER,'složila','složil')|U] přísahu, že si nebude[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] česat, stříhat ani mýt vlasy, dokud nesjednotí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] znesvářené norské pány."
 nick_fairhair: "[Select_CString( CHARACTER.IsFemale, 'Krásnovlasá', 'Krásnovlasý' )]"
 nick_fairhair_desc: "Poté, co [CZProDropSubNF(CHARACTER)] pod svou korouhví [Select_CString( CHARACTER.IsFemale, 'sjednotila', 'sjednotil' )] Norsko, [Select_CString( CHARACTER.IsFemale, 'získala', 'získal' )][Select_CString( CHARACTER.IsLocalPlayer, ' jsi', '' )] znovu právo ostříhat si, upravit a navonět vlasy. Žádné vlasy nejsou krásnější než ty, které si člověk vydobyl dřinou a svárem."
 nick_haardraade: "[Select_CString( CHARACTER.IsFemale, 'Krutá', 'Krutý' )]"
 nick_haardraade_desc: "Do očí [Select_CString( CHARACTER.IsLocalPlayer, 'tě lidé oslovují', Concatenate( 'lidé oslovují ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] přízviskem $nick_haardraade$. Za zády však kvůli bezútěšné povaze a tvrdé spravedlnosti používají přízvisko $nick_the_tyrant$."
 nick_hardeknud: "Hardiknut"
 nick_hardeknud_desc: "Mnozí poddaní se nedokážou shodnout na přesné výslovnosti [Select_CString( CHARACTER.IsLocalPlayer, 'tvého jména', Concatenate( 'jména ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )], a proto je známo v mnoha podobách."
 nick_hildetand: "Válečný zub"
 nick_hildetand_desc: "Koluje bezpočet legend o tom, jak [CZProDropSubNF(CHARACTER)] v bitvě dramaticky [Select_CString( CHARACTER.IsFemale, 'přišla', 'přišel' )] o zuby, načež [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] zázračně vyrostly dva nové."
 nick_lodbrok: "Loðbrók"
 nick_lodbrok_desc: "Ustrašené davy světa [Select_CString( CHARACTER.IsLocalPlayer, 'ti říkají', Concatenate( 'říkají ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] „Chlupaté nohavice“, neboť se traduje, že nosí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] nohavice z kůže stažené z mrtvoly mocného draka. Samozřejmě draka, kterého [CZProDropSubNF(CHARACTER)] #EMP [Select_CString( CHARACTER.IsFemale, 'sama zabila', 'sám zabil' )]#!."
 nick_ring: "Prsten"
 nick_ring_desc: "Nikdo vlastně neví, proč [Select_CString( CHARACTER.IsLocalPlayer, 'ti svět říká', Concatenate( 'svět říká ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] „$nick_ring$“, dychtiví rolníci však doufají, že je to kvůli štědrosti, s níž sahá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] do měšce."
 nick_snake_in_the_eye: "Hadí oko"
 nick_snake_in_the_eye_desc: "Pocestní si šeptají, že [Select_CString( CHARACTER.IsLocalPlayer, 'máš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' má' ) )] v oku skvrnu ve tvaru uroboru, věčného symbolu hada zakusujícího se do vlastního ocasu. Málokdo je ochoten přiblížit se natolik, aby pravdivost těchto tvrzení ověřil."
 nick_the_affable: "[Select_CString( CHARACTER.IsFemale, 'Přívětivá', 'Přívětivý' )]"
 nick_the_affable_desc: "Klidná povaha, bezstarostné vystupování a příjemné způsoby. [Select_CString( CHARACTER.IsLocalPlayer, 'nelámeš si', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' si neláme' ) )|U] hlavu s tím, jakým přízviskem [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] lidé nazývají, ale naštěstí je to téměř vždy něco #EMP milého#!."
 nick_the_apostle: "[Select_CString( CHARACTER.IsFemale, 'Apoštolka', 'Apoštol' )]"
 nick_the_apostle_desc: "[CZProDropNF(CHARACTER,'patřila','patřil')|U] mezi osobní druhy Ježíše Krista, [Select_CString( CHARACTER.IsFemale, 'doprovázela', 'doprovázel' )] ho po celý život a po jeho mučednické smrti [Select_CString( CHARACTER.IsFemale, 'hlásala', 'hlásal' )] jeho učení."
 nick_the_apostle_paul: "apoštol"
 nick_the_apostle_paul_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'za života jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' za života' ) )|U] nikdy [Select_CString( CHARACTER.IsFemale, 'nekráčela', 'nekráčel' )] po boku Ježíše Krista, ale po jeho ukřižování [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'byla povolána', 'byl povolán' )] na jeho cestu a [Select_CString( CHARACTER.IsFemale, 'šířila', 'šířil' )] ji mezi pohany po celém světě."
 nick_theophorus: "Theoforos"
 nick_theophorus_desc: "[CZProDropNF(CHARACTER,'byla','byl')|U] [Select_CString( CHARACTER.IsFemale, 'nazývána Theoforou, Boží nositelkou', 'nazýván Theoforem, Božím nositelem' )]: [Select_CString( CHARACTER.IsFemale, 'biskupkou antiochijskou, která v okovech kráčela', 'biskupem antiochijským, který v okovech kráčel' )] vstříc římské mučednické smrti."
 nick_the_avenger: "[Select_CString( CHARACTER.IsFemale, 'Mstitelka', 'Mstitel' )]"
 nick_the_avenger_desc: "Nepřátelé dobře vědí, že[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] neúprosně a neúnavně vykonává[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] spravedlnost za každou cenu."
 nick_the_bald: "[Select_CString( CHARACTER.IsFemale, 'Plešatá', 'Plešatý' )]"
 nick_the_bald_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'trpíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' trpí' ) )|U] ochromujícím nedostatkem vlasů a nikdo [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] to nedovolí zapomenout."
 nick_the_bald_ironic: "$nick_the_bald$"
 nick_the_bald_ironic_desc: "[CZProDropNF(CHARACTER,'strávila','strávil')|U] většinu života bez náležité koruny na hlavě a dvůr [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] to nedovolí zapomenout."
 nick_the_bastard: "Bastard"
 nick_the_bastard_desc: "[CZProDropSeNF(CHARACTER,'narodila','narodil')|U] mimo manželství a nedokáže[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] na to zapomenout. Zbytek světa na to rozhodně nezapomene."
 nick_the_betrayer: "[Select_CString( CHARACTER.IsFemale, 'Zrádkyně', 'Zrádce' )]"
 nick_the_betrayer_desc: "Každý ví, čeho [Select_CString( CHARACTER.IsLocalPlayer, 'ses', Concatenate( 'se ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] [Select_CString( CHARACTER.IsFemale, 'dopustila', 'dopustil' )]."
 nick_the_black: "[Select_CString( CHARACTER.IsFemale, 'Černá', 'Černý' )]"
 nick_the_black_desc: "Krutá povaha, pověstně nečestné jednání a veskrze prokletý přístup k bližním [Select_CString( CHARACTER.IsLocalPlayer, 'ti vynesly', Concatenate( 'vynesly ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] špatnou pověst."
 nick_the_blessed: "[Select_CString( CHARACTER.IsFemale, 'Blahoslavená', 'Blahoslavený' )]"
 nick_the_blessed_desc: "Když se mluví o [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_L') )], všichni zmiňují především spravedlivou povahu a neochvějnou obhajobu víry."
 nick_the_blind: "[Select_CString( CHARACTER.IsFemale, 'Slepá', 'Slepý' )]"
 nick_the_blind_desc: "Zdá se, že svět na [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] nevidí nic jiného než [Select_CString( CHARACTER.IsLocalPlayer, 'tvou', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] slepotu."
 nick_the_bold: "[Select_CString( CHARACTER.IsFemale, 'Smělá', 'Smělý' )]"
 nick_the_bold_desc: "Odvaha, neohroženost, smělost, statečnost a hrdinství. [Select_CString( CHARACTER.IsLocalPlayer, 'Tvé jméno', Concatenate( 'Jméno ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] je synonymem pro rychlé a rozhodné jednání. I nepřátelé používají přízvisko „$nick_the_bold$“. Alespoň tak zarazí záplavu synonym."
 nick_the_boneless: "[Select_CString( CHARACTER.IsFemale, 'Bezkostná', 'Bezkostný' )]"
 nick_the_boneless_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá křehká kostra', Concatenate( 'Křehká kostra ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] zastírá zuřivost [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] mysli a ducha."
 nick_the_brave: "[Select_CString( CHARACTER.IsFemale, 'Statečná', 'Statečný' )]"
 nick_the_brave_desc: "Ani roztřesená kolena, ani chvějící se zápěstí [Select_CString( CHARACTER.IsLocalPlayer, 'tě neodradí', Concatenate( 'neodradí ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] od [Select_CString( CHARACTER.IsLocalPlayer, 'tvých', Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' ) )] cílů."
 nick_the_chaste: "[Select_CString( CHARACTER.IsFemale, 'Cudná', 'Cudný' )]"
 nick_the_chaste_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] zálibou v pořádném nočním spánku."
 nick_the_confessor: "[Select_CString( CHARACTER.IsFemale, 'Vyznavačka', 'Vyznavač' )]"
 nick_the_confessor_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] lítostí i nad sebemenšími hříchy."
 nick_the_conqueror: "[Select_CString( CHARACTER.IsFemale, 'Dobyvatelka', 'Dobyvatel' )]"
 nick_the_conqueror_desc: "Jaký mocnější čin lze zapsat do análů než podmanění #EMP celého#! panství? [Select_CString( CHARACTER.IsLocalPlayer, 'rozhodně nedovolíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' rozhodně nedovolí' ) )|U], aby lidé na tento úspěch zapomněli."
 nick_the_cruel: "[Select_CString( CHARACTER.IsFemale, 'Krutá', 'Krutý' )]"
 nick_the_cruel_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'namlouváš si', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' si namlouvá' ) )|U] [Select_CString( CHARACTER.IsFemale, 'ráda', 'rád' )], že [Select_CString( CHARACTER.IsLocalPlayer, 'máš', 'má' )] vlastně docela slunnou povahu. Lidé jen nechápou [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] smysl pro #EMP humor#!."
 nick_the_child_of_devilgod: "[Select_CString( CHARACTER.IsFemale, 'Zplozenkyně', 'Zplozenec' )] [CHARACTER.GetFaith.DevilName|U]"
 nick_the_child_of_devilgod_desc: "Zlé jazyky tvrdí, že [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )] nepodařeným potomkem [CHARACTER.GetFaith.DevilName|U]. Alespoň dokud jim[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] ty jazyky nevytrhne[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]."
 nick_the_crusader: "[Select_CString( CHARACTER.IsFemale, 'Křižačka', 'Křižák' )]"
 nick_the_crusader_desc: "Nevěřící, odpadlíci i kacíři padají před [Select_CString( CHARACTER.IsLocalPlayer, 'tvou čepelí', Concatenate( 'čepelí ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )]."
 nick_the_destroyer: "[Select_CString( CHARACTER.IsFemale, 'Ničitelka', 'Ničitel' )]"
 nick_the_destroyer_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] vypalováním držav a budov a zanecháváním země poseté solí a kostmi mrtvých."
 nick_the_destroyer_prophecy: "$nick_the_destroyer$"
 nick_the_destroyer_prophecy_desc: "Významné proroctví [Select_CString( CHARACTER.IsLocalPlayer, 'ti přisuzuje', Concatenate( 'přisuzuje ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] toto přízvisko. Zda je [Select_CString( CHARACTER.IsLocalPlayer, 'tvým', Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' ) )] osudem svrhnout zkažený řád, nebo spálit ten spravedlivý, zůstává předmětem sporů."
 nick_the_devil: "[Select_CString( CHARACTER.IsFemale, 'Ďáblice', 'Ďábel' )]"
 nick_the_devil_desc: "Zlé úmysly zahalují [Select_CString( CHARACTER.IsLocalPlayer, 'tvé činy', Concatenate( 'činy ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] jako plášť a celá země v nich vidí to nejhorší."
 nick_the_drunkard: "[Select_CString( CHARACTER.IsFemale, 'Opilkyně', 'Opilec' )]"
 nick_the_drunkard_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'trávíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' tráví' ) )|U] život hledáním jasnosti na dně korbelu. Každý ví, že ji nikdy nenajde[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]."
 nick_the_fair: "[Select_CString( CHARACTER.IsFemale, 'Sličná', 'Sličný' )]"
 nick_the_fair_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá tvář', Concatenate( 'Tvář ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] je považována za mimořádně líbeznou."
 nick_the_fat: "[Select_CString( CHARACTER.IsFemale, 'Tlustá', 'Tlustý' )]"
 nick_the_fat_desc: "Říká se, že z [Select_CString( CHARACTER.IsLocalPlayer, 'tvého podbradku', Concatenate( 'podbradku ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] občas vypadnou celá kuřecí stehna."
 nick_the_fearless: "[Select_CString( CHARACTER.IsFemale, 'Neohrožená', 'Neohrožený' )]"
 nick_the_fearless_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tví vojáci', Concatenate( 'Vojáci ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] tvrdí, že [Select_CString( CHARACTER.IsLocalPlayer, 'tě nikdy neviděli', Concatenate( 'nikdy neviděli ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] ucuknout před člověkem, koněm ani střelou. Většina lidí jim věří."
 nick_the_fowler: "[Select_CString( CHARACTER.IsFemale, 'Ptáčnice', 'Ptáčník' )]"
 nick_the_fowler_desc: "U dvora se povídá, že[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] tráví[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] lovem divokého ptactva stejně času jako vládnutím."
 nick_the_gentle: "[Select_CString( CHARACTER.IsFemale, 'Mírná', 'Mírný' )]"
 nick_the_gentle_desc: "Když[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] jedná[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] správně, lidé si ani nejsou jistí, zda [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )]vůbec něco [Select_CString( CHARACTER.IsFemale, 'udělala', 'udělal' )]."
 nick_the_german: "[Select_CString( CHARACTER.IsFemale, 'Němka', 'Němec' )]"
 nick_the_german_desc: "Lidé z [Select_CString( CHARACTER.IsLocalPlayer, 'tvého', Select_CString( CHARACTER.IsFemale, 'jejího', 'jeho' ) )] panství [Select_CString( CHARACTER.IsLocalPlayer, 'ti říkají', Concatenate( 'říkají ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] „$nick_the_german$“, ale[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] vlastně nechápe[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] proč."
 nick_the_german_post_mortem: "$nick_the_german$"
 nick_the_german_post_mortem_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá smrt', Concatenate( 'Smrt ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] symbolizovala nejasný přechod, během něhož se Východní Francii začalo říkat Německo."
 nick_the_good: "[Select_CString( CHARACTER.IsFemale, 'Dobrá', 'Dobrý' )]"
 nick_the_good_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá spravedlivá povaha', Concatenate( 'Spravedlivá povaha ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] a oddanost hodnotám [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] víry vedou ostatní [CZAdherentPl_A(CHARACTER.GetFaith)|l] k tomu, aby k [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', Select_CString( CHARACTER.IsFemale, 'ní', 'němu' ) )] vzhlíželi s úctou."
 nick_the_gouty: "[Select_CString( CHARACTER.IsFemale, 'Dnavá', 'Dnavý' )]"
 nick_the_gouty_desc: "Zanícené a oteklé klouby spolu s bolestivě zkroucenými údy [Select_CString( CHARACTER.IsLocalPlayer, 'tě řadí', Concatenate( 'řadí ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] mezi přepychem hýčkané vyšší vrstvy společnosti. Možná hýčkané až #EMP příliš#!."
 nick_the_great: "[Select_CString( CHARACTER.IsFemale, 'Veliká', 'Veliký' )]"
 nick_the_great_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé úspěchy', Concatenate( 'Úspěchy ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] jsou legendární. Prostý lid o [Select_CString( CHARACTER.IsLocalPlayer, 'tvých', Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' ) )] činech zpívá písně a šlechta reptá nad nespravedlivými očekáváními."
 nick_the_hammer: "Kladivo"
 nick_the_hammer_desc: "Kdo chce vědět, proč [Select_CString( CHARACTER.IsLocalPlayer, 'ti říkají', Concatenate( 'říkají ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] „$nick_the_hammer$“, stačí se zeptat [Select_CString( CHARACTER.IsLocalPlayer, 'tvých', Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' ) )] nešťastných nepřátel."
 nick_the_handsome: "[Select_CString( CHARACTER.IsFemale, 'Pohledná', 'Pohledný' )]"
 nick_the_handsome_desc: "#EMP Ach, můj ty světe#!. Jen málokdo se může pochlubit tak ostře řezanou čelistí, rovnými rameny či tak podmanivým pohledem, za nímž stojí [CHARACTER.Custom('Eye_ArticleBlank')][CHARACTER.Custom('EyeEyes')]."
 nick_the_heathen: "[Select_CString( CHARACTER.IsFemale, 'Pohanka', 'Pohan' )]"
 nick_the_heathen_desc: "Při skutečně zásadním obrácení [CZProDropSubNF(CHARACTER)] [Select_CString( CHARACTER.IsFemale, 'opustila', 'opustil' )] nejen svou víru a náboženství, ale celou svou #EMP náboženskou tradici#! a [Select_CString( CHARACTER.IsFemale, 'přijala', 'přijal' )] zcela odlišný pohled na božský řád."
 nick_the_heathen_rebel: "$nick_the_heathen$"
 nick_the_heathen_rebel_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] vzpourou proti tomu, co považuje[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] za modlářské zvyklosti svých krajanů a jejich falešnou teologii."
 nick_the_holy: "[Select_CString( CHARACTER.IsFemale, 'Svatá', 'Svatý' )]"
 nick_the_holy_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvůj Bohem ustanovený život', Concatenate( 'Bohem ustanovený život ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] neposkvrňuje žádná neřest, hřích, svatokrádež ani bezbožnost."
 nick_the_hunchback: "[Select_CString( CHARACTER.IsFemale, 'Hrbatá', 'Hrbatý' )]"
 nick_the_hunchback_desc: "Nikdo, kdo pohlédne na [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )], nemůže přehlédnout výrazný hrb na zádech ani předsunutou hlavu. Někdy se zdá, že lidé nic jiného ani nevidí."
 nick_the_hunter: "[Select_CString( CHARACTER.IsFemale, 'Lovkyně', 'Lovec' )]"
 nick_the_hunter_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá pohotová střelba a ještě pohotovější zrak', Concatenate( 'Pohotová střelba a ještě pohotovější zrak ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] jsou proslulé na mnoho mil všemi směry. Někteří tvrdí, že [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] luk dostřelí stejně daleko, jako sahá věhlas [Select_CString( CHARACTER.IsLocalPlayer, 'tvého', Select_CString( CHARACTER.IsFemale, 'jejího', 'jeho' ) )] jména."
 nick_the_ironside: "Železný bok"
 nick_the_ironside_desc: "Kopí, sekera, meč či šíp. O [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_L') )] se říká, že dokáže[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] odrazit každý úder, od nejmocnějšího rozmachu až po čepel vraha."
 nick_the_just: "[Select_CString( CHARACTER.IsFemale, 'Spravedlivá', 'Spravedlivý' )]"
 nick_the_just_desc: "Zákon a řád jsou základem všeho dobrého v životě. Bez zákona se řád mění v tyranii a bez řádu je zákon bezmocný."
 nick_the_kind: "[Select_CString( CHARACTER.IsFemale, 'Laskavá', 'Laskavý' )]"
 nick_the_kind_desc: "Klidné slovo, konejšivý úsměv či pozvání za chladného dne. [Select_CString( CHARACTER.IsLocalPlayer, 'věříš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' věří' ) )|U], že světem lze pohnout trochou soucitu."
 nick_the_lame: "[Select_CString( CHARACTER.IsFemale, 'Chromá', 'Chromý' )]"
 nick_the_lame_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Sužuje tě chromá noha', Concatenate( CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A'), ' sužuje chromá noha' ) )] a svět se tomu nejen odmítá přizpůsobit, ale navíc [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] to nedovolí zapomenout."
 nick_the_lawgiver: "[Select_CString( CHARACTER.IsFemale, 'Zákonodárkyně', 'Zákonodárce' )]"
 nick_the_lawgiver_desc: "Pravidla, řád a řádný postup patří mezi mnohé dary, které[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] přináší[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] svému lidu."
 nick_the_liberator: "[Select_CString( CHARACTER.IsFemale, 'Osvoboditelka', 'Osvoboditel' )]"
 nick_the_liberator_desc: "Ostřím nabroušené oceli či obratně volenými slovy [CZProDropSubNF(CHARACTER)] [Select_CString( CHARACTER.IsFemale, 'vydobyla', 'vydobyl' )] zotročeným veliké svobody."
 nick_the_lion: "[Select_CString( CHARACTER.IsFemale, 'Lvice', 'Lev' )]"
 nick_the_lion_desc: "Vznešenost, divokost a majestátnost. Je-li lev králem zvířat, pak [Select_CString( CHARACTER.IsLocalPlayer, 'tvá zjevná podobnost', Concatenate( 'zjevná podobnost ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] s touto šelmou naznačuje zářný osud."
 nick_the_lionheart: "Lví srdce"
 nick_the_lionheart_desc: "Odvaha hraničící s pošetilostí, zdrcující síla v bitvě a smrtící obratnost v souboji. Kdo přemýšlí, jak [CZProDropSubNF(CHARACTER)] k tomuto přízvisku [Select_CString( CHARACTER.IsFemale, 'přišla', 'přišel' )], zjevně se s [Select_CString( CHARACTER.IsLocalPlayer, 'tebou', Select_CString( CHARACTER.IsFemale, 'ní', 'ním' ) )] nikdy nesetkal."
 nick_the_lisp_and_lame: "[Select_CString( CHARACTER.IsFemale, 'Šišlavá a chromá', 'Šišlavý a chromý' )]"
 nick_the_lisp_and_lame_desc: "[CHARACTER.GetFaith.HealthGodName] se nespokojil s tím, že [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] obdařil pomalou a nemotornou chůzí, a navíc [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] proklel příšerným šišláním."
 nick_the_magnificent: "[Select_CString( CHARACTER.IsFemale, 'Nádherná', 'Nádherný' )]"
 nick_the_magnificent_desc: "Příběhy o [Select_CString( CHARACTER.IsLocalPlayer, 'tvých velkolepých činech', Concatenate( 'velkolepých činech ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] se vyprávějí od Irska až po Čínu."
 nick_the_martyr: "[Select_CString( CHARACTER.IsFemale, 'Mučednice', 'Mučedník' )]"
 nick_the_martyr_desc: "[CZProDropNF(CHARACTER,'zemřela','zemřel')|U] za [CHARACTER.GetFaith.HighGodName] a [CHARACTER.GetFaith.GetAdherentNamePlural] po celém světě vzpomínají na [Select_CString( CHARACTER.IsLocalPlayer, 'tvou', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] oběť."
 nick_the_merry: "[Select_CString( CHARACTER.IsFemale, 'Veselá', 'Veselý' )]"
 nick_the_merry_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] dobrou náladou, znamenitými žerty a výtečnými hostinami."
 nick_the_honorable: "[Select_CString( CHARACTER.IsFemale, 'Čestná', 'Čestný' )]"
 nick_the_honorable_desc: "Jakmile je dohoda uzavřena a[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] dá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] své slovo, lze se spolehnout, že je dodrží[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] s pevností oceli."
 nick_the_greedy: "[Select_CString( CHARACTER.IsFemale, 'Chamtivá', 'Chamtivý' )]"
 nick_the_greedy_desc: "Co je lepší než jeden měšec stříbra? Dva měšce stříbra!"
 nick_the_monk: "[Select_CString( CHARACTER.IsFemale, 'Jeptiška', 'Mnich' )]"
 nick_the_monk_desc: "Zbožné vystupování a zdrženlivý způsob života činí z [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') )] v očích mnoha lidí ideální [Select_CString( CHARACTER.IsFemale, 'jeptišku', 'mnicha' )]."
 nick_the_noble: "[Select_CString( CHARACTER.IsFemale, 'Ušlechtilá', 'Ušlechtilý' )]"
 nick_the_noble_desc: "Ačkoli je na světě mnoho šlechticů, jen málokdo ztělesňuje ideály ušlechtilosti tak dokonale jako [Select_CString( CHARACTER.IsLocalPlayer, 'ty', CHARACTER.GetShortUINameNoTooltipNoFormat )]."
 nick_the_old: "[Select_CString( CHARACTER.IsFemale, 'Stará', 'Starý' )]"
 nick_the_old_desc: "Lidé [Select_CString( CHARACTER.IsLocalPlayer, 'tě nezřídka vítají', Concatenate( 'nezřídka vítají ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] s údivem, že [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', 'je' )] stále naživu."
 nick_the_pious: "[Select_CString( CHARACTER.IsFemale, 'Pobožná', 'Pobožný' )]"
 nick_the_pious_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá horlivost', Concatenate( 'Horlivost ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] a oddanost [CHARACTER.GetFaith.GetName] jsou považovány za známku hluboké a inspirující zbožnosti."
 nick_the_proud: "[Select_CString( CHARACTER.IsFemale, 'Pyšná', 'Pyšný' )]"
 nick_the_proud_desc: "Většina šlechticů se naučí za všech okolností držet záda zpříma, málokdo je na to však tak pyšný jako [Select_CString( CHARACTER.IsLocalPlayer, 'ty', CHARACTER.GetShortUINameNoTooltipNoFormat )]."
 nick_the_quarreller: "[Select_CString( CHARACTER.IsFemale, 'Svárlivá', 'Svárlivý' )]"
 nick_the_quarreller_desc: "Za moudré se považuje nezačínat rozhovor s [Select_CString( CHARACTER.IsLocalPlayer, 'tebou', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_I') )], nemáš-li několik hodin nazbyt. Někdy i několik dní."
 nick_the_restorer: "[Select_CString( CHARACTER.IsFemale, 'Obnovitelka', 'Obnovitel' )]"
 nick_the_restorer_desc: "Když se zdálo, že panství navždy pohltila temnota, #EMP [CZProDropNF(CHARACTER,'vystoupila','vystoupil')]#! a [Select_CString( CHARACTER.IsFemale, 'přivedla', 'přivedl' )] je zpět na světlo."
 nick_the_saint: "[Select_CString( CHARACTER.IsFemale, 'Svatá', 'Svatý' )]"
 nick_the_saint_desc: "[CZProDropNF(CHARACTER,'vešla','vešel')|U] do dějin [CHARACTER.GetFaith.GetName] jako jeden z vůbec nejpožehnanějších příslušníků této víry."
 nick_the_scholar: "[Select_CString( CHARACTER.IsFemale, 'Učená', 'Učený' )]"
 nick_the_scholar_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá moudrost a vědomosti', Concatenate( 'Moudrost a vědomosti ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] jsou součástí učení nejedné věhlasné akademie."
 nick_the_silent: "[Select_CString( CHARACTER.IsFemale, 'Mlčenlivá', 'Mlčenlivý' )]"
 nick_the_silent_desc: "Mlčení je zlato a [Select_CString( CHARACTER.IsLocalPlayer, 'máš ho', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' ho má' ) )] na rozdávání."
 nick_the_stammerer: "[Select_CString( CHARACTER.IsFemale, 'Koktavá', 'Koktavý' )]"
 nick_the_stammerer_desc: "Slova, která přednáší[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )][Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )], mohou být výmluvná, jejich přednes však zanechává mnoho otázek."
 nick_the_stranger: "[Select_CString( CHARACTER.IsFemale, 'Cizinka', 'Cizinec' )]"
 nick_the_stranger_desc: "[CZProDropNF(CHARACTER,'přišla','přišel')|U] do svého panství zdaleka a mnohé [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] způsoby dodnes působí podivně a cize."
 nick_the_strong: "[Select_CString( CHARACTER.IsFemale, 'Silná', 'Silný' )]"
 nick_the_strong_desc: "Širý svět věří, že[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] dokáže[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] drtit kameny. Vlastními zuby."
 nick_the_troubadour: "[Select_CString( CHARACTER.IsFemale, 'Trubadúrka', 'Trubadúr' )]"
 nick_the_troubadour_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] krásným zpěvem a zálibou v hudbě. Alespoň mezi těmi, kteří [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] mají rádi."
 nick_the_unready: "[Select_CString( CHARACTER.IsFemale, 'Nerozhodná', 'Nerozhodný' )]"
 nick_the_unready_desc: "Jen málokterý konflikt či rozhovor [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] zcela nezaskočí."
 nick_the_unready_anglo_saxon: "$nick_the_unready$"
 nick_the_unready_anglo_saxon_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé jméno', Concatenate( 'Jméno ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] lze doslova přeložit jako „Urozená rada“. Proto [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] nemálo rozčiluje přízvisko $E_thelrE_d$-Unræd neboli „Urozená rada bez rady“. Patrně někomu připadala tato slovní hříčka vtipná."
 nick_the_usurper: "[Select_CString( CHARACTER.IsFemale, 'Uchvatitelka', 'Uchvatitel' )]"
 nick_the_usurper_desc: "[CZProDropNF(CHARACTER,'svrhla','svrhl')|U] právoplatného lenního pána svého panství a ostřím meče [Select_CString( CHARACTER.IsLocalPlayer, 'ses', 'se' )] [Select_CString( CHARACTER.IsFemale, 'zmocnila', 'zmocnil' )] vlády, která [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] nenáležela."
 nick_the_victorious: "[Select_CString( CHARACTER.IsFemale, 'Vítězná', 'Vítězný' )]"
 nick_the_victorious_desc: "Vítězství přichází k [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )] zcela přirozeně a svět s tím souhlasí."
 nick_the_viking: "[Select_CString( CHARACTER.IsFemale, 'Vikingka', 'Viking' )]"
 nick_the_viking_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'vždy jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' vždy' ) )|U] [Select_CString( CHARACTER.IsFemale, 'považovala', 'považoval' )] vlastnictví za poněkud tvárnější pojem než většina lidí."
 nick_the_young: "[Select_CString( CHARACTER.IsFemale, 'Mladá', 'Mladý' )]"
 nick_the_young_desc: "Už v mládí [Select_CString( CHARACTER.IsLocalPlayer, 'sis', Concatenate( 'si ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] [Select_CString( CHARACTER.IsFemale, 'vydobyla', 'vydobyl' )] věhlas a uznání. Bez ohledu na to, kolik let uplyne, toto přízvisko [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] už nejspíš zůstane."
 nick_the_younger: "Mladší"
 nick_the_younger_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'máš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' má' ) )|U] tu smůlu, že [Select_CString( CHARACTER.IsLocalPlayer, 'sdílíš', 'sdílí' )] jméno s jinou významnou osobou, a navždy tak [Select_CString( CHARACTER.IsLocalPlayer, 'poneseš', 'ponese' )] jméno [CHARACTER.GetFirstName] #EMP $nick_the_younger$#!."
 nick_whiteshirt: "Bílá košile"
 nick_whiteshirt_desc: "Lidé se [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') )] často ptají, proč [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] říkají $nick_whiteshirt$. [Select_CString( CHARACTER.IsLocalPlayer, 'jen se usměješ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se jen usměje' ) )|U]."
 nick_the_cannibal: "[Select_CString( CHARACTER.IsFemale, 'Lidožroutka', 'Lidožrout' )]"
 nick_the_cannibal_desc: "Jen málokdo snese [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj úsměv', Concatenate( 'úsměv ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] s odhalenými zuby, zvláště když po nich stéká čerstvá krev."
 nick_the_dragon: "[Select_CString( CHARACTER.IsFemale, 'Dračice', 'Drak' )]"
 nick_the_dragon_desc: "$nick_the_dragoness_desc$"
 nick_the_devourer: "[Select_CString( CHARACTER.IsFemale, 'Požíračka', 'Požírač' )]"
 nick_the_devourer_desc: "Svět se chvěje při pomyšlení, kolik životů již zmizelo v [Select_CString( CHARACTER.IsLocalPlayer, 'tvém bezedném chřtánu', Concatenate( 'bezedném chřtánu ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )]..."
 nick_the_bewitched: "[Select_CString( CHARACTER.IsFemale, 'Očarovaná', 'Očarovaný' )]"
 nick_the_bewitched_desc: "Přízeň [CHARACTER.GetFaith.HighGodName] je pryč a kletba [CHARACTER.GetFaith.WitchGodName] dopadla na [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )]. Lidé proto o [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', Select_CString( CHARACTER.IsFemale, 'ní', 'něm' ) )] často mluví s lítostí."
 nick_the_witch: "[Select_CString( CHARACTER.IsFemale, 'Čarodějnice', 'Čaroděj' )]"
 nick_the_witch_desc: "O [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_L') )] se soudí, že se stýká[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] s podivnými silami za závojem všednosti."
 nick_the_unfaithful: "[Select_CString( CHARACTER.IsFemale, 'Nevěrná', 'Nevěrný' )]"
 nick_the_unfaithful_desc: "Manželské sliby jsou podle [Select_CString( CHARACTER.IsLocalPlayer, 'tvého', Select_CString( CHARACTER.IsFemale, 'jejího', 'jeho' ) )] názoru spíše... manželskými doporučeními."
 nick_the_unchaste: "[Select_CString( CHARACTER.IsFemale, 'Necudná', 'Necudný' )]"
 nick_the_unchaste_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'máš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' má' ) )|U] pověst [Select_CString( CHARACTER.IsFemale, 'chlípné smilnice oddávající', 'chlípného smilníka oddávajícího' )] se rozkoším mimo manželství."
 nick_the_beguiling: "Okouzlující"
 nick_the_beguiling_desc: "Říká se, že jediný [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj nesmělý pohled', Concatenate( 'nesmělý pohled ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] dokáže vyvolat... podlamování kolen."
 nick_the_temptress: "[Select_CString( CHARACTER.IsFemale, 'Pokušitelka', 'Pokušitel' )]"
 nick_the_temptress_desc: "Na jediný pokyn [Select_CString( CHARACTER.IsLocalPlayer, 'tvého křivého prstu', Concatenate( 'křivého prstu ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] se chytí šlechtic i nuzák."
 nick_the_seductress: "Svůdnice"
 nick_the_seductress_desc: "Úsměv vydá za tisíc slov, nejspíš takových, která by ve slušné společnosti ani nešlo vyslovit."
 nick_the_lewd: "[Select_CString( CHARACTER.IsFemale, 'Chlípná', 'Chlípný' )]"
 nick_the_lewd_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé poznámky, vystupování a občasná prudká gesta', Concatenate( 'Poznámky, vystupování a občasná prudká gesta ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] jsou přinejlepším nepokrytá."
 nick_the_lecher: "[Select_CString( CHARACTER.IsFemale, 'Smilnice', 'Smilník' )]"
 nick_the_lecher_desc: "Lidé, po kterých[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] touží[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )], si buď zvyknou na [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] slintání, nebo odejdou."
 nick_the_seducer: "Svůdce"
 nick_the_seducer_desc: "$nick_the_seductress_desc$"
 nick_the_shadow: "Stín"
 nick_the_shadow_desc: "Povídá se, že kamkoli padne tma, tam [Select_CString( CHARACTER.IsLocalPlayer, 'máš své ucho', Concatenate( 'má ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' své ucho' ) ) )]."
 nick_the_whisperer: "[Select_CString( CHARACTER.IsFemale, 'Našeptávačka', 'Našeptávač' )]"
 nick_the_whisperer_desc: "Toto přízvisko [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'získala', 'získal' )] proto, že tráví[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] šeptáním více času, než se sluší."
 nick_the_spider: "[Select_CString( CHARACTER.IsFemale, 'Pavoučice', 'Pavouk' )]"
 nick_the_spider_desc: "U dvora se měj na pozoru, říkají lidé. Kamkoli se vydáš, všude najdeš $nick_the_spider$."
 nick_the_fox: "[Select_CString( CHARACTER.IsFemale, 'Liška', 'Lišák' )]"
 nick_the_fox_desc: "Lstivost, bystrost a ctižádost možná nejsou rytířskými ctnostmi, ale #EMP účinné#! rozhodně jsou."
 nick_the_shrewd: "[Select_CString( CHARACTER.IsFemale, 'Prozíravá', 'Prozíravý' )]"
 nick_the_shrewd_desc: "Je moudré nikdy nehrát s [Select_CString( CHARACTER.IsLocalPlayer, 'tebou', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_I') )] karty. Jen málokdo si může být jistý, co skrývá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] v rukávu."
 nick_the_gracious: "[Select_CString( CHARACTER.IsFemale, 'Milostivá', 'Milostivý' )]"
 nick_the_gracious_desc: "Dobré způsoby, vznešené vystupování a důstojná shovívavost činí z [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') )] vítaného hosta u většiny stolů."
 nick_the_magnanimous: "[Select_CString( CHARACTER.IsFemale, 'Velkomyslná', 'Velkomyslný' )]"
 nick_the_magnanimous_desc: "Nikdo nemůže tvrdit, že [Select_CString( CHARACTER.IsLocalPlayer, 'bys', Concatenate( 'by ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] [Select_CString( CHARACTER.IsFemale, 'nechala', 'nechal' )] slíbený dar nevěnovaný."
 nick_the_architect: "[Select_CString( CHARACTER.IsFemale, 'Stavitelka', 'Stavitel' )]"
 nick_the_architect_desc: "Většina lidí vidí v hromadě cihel a trámů jen práci pro nádeníky. [Select_CString( CHARACTER.IsLocalPlayer, 'v ní vidíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' v ní vidí' ) )|U] #EMP možnosti#!."
 nick_the_wise: "[Select_CString( CHARACTER.IsFemale, 'Moudrá', 'Moudrý' )]"
 nick_the_wise_desc: "Za rozumné se považuje požádat [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] o názor, podaří-li se [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] přesvědčit, [Select_CString( CHARACTER.IsLocalPlayer, 'abys', 'aby' )] jej [Select_CString( CHARACTER.IsFemale, 'vyslovila', 'vyslovil' )]."
 nick_the_impaler: "[Select_CString( CHARACTER.IsFemale, 'Napichovačka', 'Napichovač' )]"
 nick_the_impaler_desc: "Způsoby, jimiž[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] vykonává[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] spravedlnost, mohou být kruté, ale míra opakování zločinů je #EMP skutečně#! nízká."
 nick_the_tormentor: "[Select_CString( CHARACTER.IsFemale, 'Trýznitelka', 'Trýznitel' )]"
 nick_the_tormentor_desc: "Většina lidí by raději zemřela na čepeli biřice, než aby se nechala odvést do [Select_CString( CHARACTER.IsLocalPlayer, 'tvých kobek', Concatenate( 'kobek ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )]."
 nick_the_depraved: "[Select_CString( CHARACTER.IsFemale, 'Zvrhlá', 'Zvrhlý' )]"
 nick_the_depraved_desc: "Slušní lidé si šeptají, že [Select_CString( CHARACTER.IsLocalPlayer, 'tvé touhy', Concatenate( 'touhy ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] jsou nepřirozené. [Select_CString( CHARACTER.IsLocalPlayer, 'považuješ je', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je považuje' ) )|U] pouze za #EMP vytříbené#!."
 nick_the_monster: "Netvor"
 nick_the_monster_desc: "Rolníci [Select_CString( CHARACTER.IsLocalPlayer, 'tě považují', Concatenate( 'považují ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] za ghúla, krvežíznivou noční můru, která přišla vysávat morek z kostí jejich dětí. Snad se mýlí."
 nick_the_wicked: "[Select_CString( CHARACTER.IsFemale, 'Ničemná', 'Ničemný' )]"
 nick_the_wicked_desc: "[CHARACTER.GetFaith.GetName] ukládá mnoho omezení a[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] je obvykle porušuje[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] jedno za druhým."
 nick_the_accursed: "[Select_CString( CHARACTER.IsFemale, 'Prokletá', 'Prokletý' )]"
 nick_the_accursed_desc: "Jen málokterý [CHARACTER.GetFaith.PriestNeuter] dokáže vyslovit [Select_CString( CHARACTER.IsLocalPlayer, 'tvé jméno', Concatenate( 'jméno ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )], aniž by je vyplivl do prachu."
 nick_priest_hater: "[Select_CString( CHARACTER.IsFemale, 'Nepřítelkyně kněží', 'Nepřítel kněží' )]"
 nick_priest_hater_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvůj odpor', Concatenate( 'Odpor ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] k duchovenstvu je všeobecně známý a díky gramotnosti kněží také důkladně zaznamenaný."
 nick_priest_eater: "[Select_CString( CHARACTER.IsFemale, 'Požíračka kněží', 'Požírač kněží' )]"
 nick_priest_eater_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'nemáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' nemá' ) )|U] na duchovenstvu [Select_CString( CHARACTER.IsFemale, 'ráda', 'rád' )] vůbec nic kromě jeho chuti."
 nick_the_able: "[Select_CString( CHARACTER.IsFemale, 'Schopná', 'Schopný' )]"
 nick_the_able_desc: "Vládnout panství? Vést bitvu? Uvařit jídlo? Utišit dítě? Navrhnout stavbu? Vytrhnout zub? Když [Select_CString( CHARACTER.IsLocalPlayer, 'se', Concatenate( 'se ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] do něčeho pustí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )], jen máloco nezvládne[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]. Specializace je koneckonců pro hmyz."
 nick_the_mad: "[Select_CString( CHARACTER.IsFemale, 'Šílená', 'Šílený' )]"
 nick_the_mad_desc: "Kdyby ostatní věděli to, co [Select_CString( CHARACTER.IsLocalPlayer, 'víš', Concatenate( 'ví ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )], smáli by se také. Celý tento život je jen hrou jakéhosi šíleného boha."
 nick_the_ruthless: "[Select_CString( CHARACTER.IsFemale, 'Nelítostná', 'Nelítostný' )]"
 nick_the_ruthless_desc: "Ne každý má sílu udělat to, co je třeba. Ne každý, ale [Select_CString( CHARACTER.IsLocalPlayer, 'ty', CHARACTER.GetShortUINameNoTooltipNoFormat )] ano."
 nick_the_simple: "[Select_CString( CHARACTER.IsFemale, 'Prostá', 'Prostý' )]"
 nick_the_simple_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé myšlenky', Concatenate( 'Myšlenky ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] lze nejlépe popsat jako „blaženě nezatížené“."
 nick_the_leper: "[Select_CString( CHARACTER.IsFemale, 'Malomocná', 'Malomocný' )]"
 nick_the_leper_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'nikdy nemůžeš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' nikdy nemůže' ) )|U] zapomenout na zhoubnou nemoc, která pomalu požírá [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] tělo. Svět [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] ji však stejně rád připomíná."
 nick_half_hand: "[Select_CString( CHARACTER.IsFemale, 'Poloruká', 'Poloruký' )]"
 nick_half_hand_desc: "Některé příběhy tvrdí, že [Select_CString( CHARACTER.IsLocalPlayer, 'ti', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )] chybí prst, jiné celá polovina ruky a další, že [Select_CString( CHARACTER.IsLocalPlayer, 'máš', 'má' )] paži podélně rozťatou až k lokti. [Select_CString( CHARACTER.IsLocalPlayer, 'k tomu se vyjadřuješ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se k tomu vyjadřuje' ) )|U] [Select_CString( CHARACTER.IsFemale, 'nerada', 'nerad' )]."
 nick_the_hideous: "[Select_CString( CHARACTER.IsFemale, 'Ohyzdná', 'Ohyzdný' )]"
 nick_the_hideous_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'máš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' má' ) )|U] tvář, kterou snad dokáže milovat alespoň vlastní matka."
 nick_the_frog: "[Select_CString( CHARACTER.IsFemale, 'Žába', 'Žabák' )]"
 nick_the_frog_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé rysy', Concatenate( 'Rysy ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] mají cosi obojživelného. Méně #EMP zdvořilá#! přirovnání se obvykle pronášejí jen mimo doslech."
 nick_the_repulsive: "[Select_CString( CHARACTER.IsFemale, 'Odpudivá', 'Odpudivý' )]"
 nick_the_repulsive_desc: "Když [Select_CString( CHARACTER.IsLocalPlayer, 'jsi nablízku', Concatenate( 'je nablízku ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )], přelidnění bývá problémem jen málokdy."
 nick_the_frail: "[Select_CString( CHARACTER.IsFemale, 'Křehká', 'Křehký' )]"
 nick_the_frail_desc: "O [Select_CString( CHARACTER.IsLocalPlayer, 'tvých kostech', Concatenate( 'kostech ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] se často říká, že jsou ze skla. Přinejmenším se stejně snadno lámou."
 nick_the_weak: "[Select_CString( CHARACTER.IsFemale, 'Slabá', 'Slabý' )]"
 nick_the_weak_desc: "Některé vychloubačné děti tvrdí, že by dokázaly [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] porazit v zápase. [Select_CString( CHARACTER.IsLocalPlayer, 'tuto domněnku bys', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' by tuto domněnku' ) )|U] raději [Select_CString( CHARACTER.IsFemale, 'neověřovala', 'neověřoval' )]."
 nick_the_brute: "[Select_CString( CHARACTER.IsFemale, 'Surovkyně', 'Surovec' )]"
 nick_the_brute_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'násilí se nikdy nevyhýbáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se násilí nikdy nevyhýbá' ) )|U] a mezi tělesnou, společenskou a duševní újmou příliš nerozlišuje[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]. Nakonec přece všechno bolí stejně."
 nick_the_bear: "[Select_CString( CHARACTER.IsFemale, 'Medvědice', 'Medvěd' )]"
 nick_the_bear_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá chlupatá a hřmotná postava', Concatenate( 'Chlupatá a hřmotná postava ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] může nahánět strach, třebaže nepochybně ne #EMP každému#!."
 nick_the_terrible: "[Select_CString( CHARACTER.IsFemale, 'Hrozná', 'Hrozný' )]"
 nick_the_terrible_desc: "Když kolem [Select_CString( CHARACTER.IsLocalPlayer, 'procházíš', Concatenate( 'prochází ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )], děti pláčou, rolníci se chvějí a mléko kysne. Alespoň se to tvrdí."
 nick_the_tyrant: "[Select_CString( CHARACTER.IsFemale, 'Tyranka', 'Tyran' )]"
 nick_the_tyrant_desc: "[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' ' ) )]#EMP [Select_CString( CHARACTER.IsLocalPlayer, 'Jsi', 'je' )]#! panstvím a každý, kdo nesouhlasí, pozná, jak panství nakládá se zrádci."
 nick_the_wolf: "[Select_CString( CHARACTER.IsFemale, 'Vlčice', 'Vlk' )]"
 nick_the_wolf_desc: "Lstivost, zuřivost a vznešenost, ale jen málokdy čestnost. [Select_CString( CHARACTER.IsLocalPlayer, 'Tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] by bylo možné popsat i hůře."
 nick_the_benevolent: "[Select_CString( CHARACTER.IsFemale, 'Dobrotivá', 'Dobrotivý' )]"
 nick_the_benevolent_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'dbáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' dbá' ) )|U] na to, aby [Select_CString( CHARACTER.IsLocalPlayer, 'ses', 'se' )] při každé příležitosti [Select_CString( CHARACTER.IsFemale, 'věnovala', 'věnoval' )] mecenášství a dobročinnosti."
 nick_the_philosopher: "[Select_CString( CHARACTER.IsFemale, 'Filozofka', 'Filozof' )]"
 nick_the_philosopher_desc: "Příroda je plná zvláštností, tajemství a hádanek a[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] o nich s oblibou rozmlouvá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]. Velmi dlouze."
 nick_the_compassionate: "[Select_CString( CHARACTER.IsFemale, 'Soucitná', 'Soucitný' )]"
 nick_the_compassionate_desc: "Co je podle [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') )] v životě nejlepší? Spřátelit se s nepřítelem, sledovat, jak jeho nenávist ustupuje, a pocítit radost ze smíření."
 nick_the_theologian: "[Select_CString( CHARACTER.IsFemale, 'Teoložka', 'Teolog' )]"
 nick_the_theologian_desc: "K čemu je život, ne-li ke zkoumání skutečné podstaty [CHARACTER.GetFaith.CreatorName]?"
 nick_the_enlightened: "[Select_CString( CHARACTER.IsFemale, 'Osvícená', 'Osvícený' )]"
 nick_the_enlightened_desc: "Vyšší vzdělání je odměnou samo o sobě, ale být jím proslul[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] je také docela příjemné."
 nick_the_stalwart: "[Select_CString( CHARACTER.IsFemale, 'Neochvějná', 'Neochvějný' )]"
 nick_the_stalwart_desc: "Bez ohledu na bouři, čepele svištící vzduchem či hroby pokrývající zem[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] vytrvá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]. Musí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]."
 nick_the_merciless: "[Select_CString( CHARACTER.IsFemale, 'Nemilosrdná', 'Nemilosrdný' )]"
 nick_the_merciless_desc: "Milost se nenabízí ani neočekává. Přátelé [Select_CString( CHARACTER.IsLocalPlayer, 'tě považují', Concatenate( 'považují ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] za [Select_CString( CHARACTER.IsFemale, 'pragmatickou', 'pragmatického' )], nepřátelé za [Select_CString( CHARACTER.IsFemale, 'bezectnou', 'bezectného' )]."
 nick_the_imperious: "[Select_CString( CHARACTER.IsFemale, 'Panovačná', 'Panovačný' )]"
 nick_the_imperious_desc: "Moc dává právo, a jelikož [Select_CString( CHARACTER.IsLocalPlayer, 'máš', Concatenate( 'má ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] vždy pravdu, musí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] dbát na to, [Select_CString( CHARACTER.IsLocalPlayer, 'abys', 'aby' )] [Select_CString( CHARACTER.IsFemale, 'byla považována', 'byl považován' )] za mocného vládce."
 nick_the_poet: "[Select_CString( CHARACTER.IsFemale, 'Básnířka', 'Básník' )]"
 nick_the_poet_desc: "Kamkoli [Select_CString( CHARACTER.IsLocalPlayer, 'se vydáš', Concatenate( 'se ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' vydá' ) ) )], brzy se ozve rozpačité škrábání brku skládajícího rýmy a verše."
 nick_the_cosmic_poet: "[Select_CString( CHARACTER.IsFemale, 'Kosmická básnířka', 'Kosmický básník' )]"
 nick_the_cosmic_poet_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá hlava', Concatenate( 'Hlava ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] je v oblacích a [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] myšlenky mezi hvězdami."
 nick_the_gardener: "[Select_CString( CHARACTER.IsFemale, 'Zahradnice', 'Zahradník' )]"
 nick_the_gardener_desc: "Pro [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] je celý svět zahradou. Pečuj o ni a ona poroste."
 nick_the_mindbreaker: "[Select_CString( CHARACTER.IsFemale, 'Lamačka myslí', 'Lamač myslí' )]"
 nick_the_mindbreaker_desc: "Lidé si s hrůzou šeptají o tom, co se stává těm, kteří zakusí [Select_CString( CHARACTER.IsLocalPlayer, 'tvé mučitelské úmysly', Concatenate( 'mučitelské úmysly ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )]."
 nick_the_flayer: "[Select_CString( CHARACTER.IsFemale, 'Stahovačka kůží', 'Stahovač kůží' )]"
 nick_the_flayer_desc: "Díky [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )] celé panství důvěrně poznalo pravdivost rčení o tajemstvích člověka staženého z kůže."
 nick_the_meticulous: "[Select_CString( CHARACTER.IsFemale, 'Pečlivá', 'Pečlivý' )]"
 nick_the_meticulous_desc: "Pozornost věnovaná detailům je důležitá a její nedostatek svědčí o vadném charakteru. Alespoň podle [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') )]."
 nick_the_heartbreaker: "[Select_CString( CHARACTER.IsFemale, 'Lamačka srdcí', 'Lamač srdcí' )]"
 nick_the_heartbreaker_desc: "Říká se, že [Select_CString( CHARACTER.IsLocalPlayer, 'máš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' má' ) )] [Select_CString( CHARACTER.IsFemale, 'ráda', 'rád' )] trochu nebezpečí."
 nick_the_bully: "[Select_CString( CHARACTER.IsFemale, 'Ukrutnice', 'Ukrutník' )]"
 nick_the_bully_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'vybíráš si', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' si vybírá' ) )|U] [Select_CString( CHARACTER.IsFemale, 'ráda', 'rád' )] ty, které považuje[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] za sobě podřadné."
 nick_the_foolish: "[Select_CString( CHARACTER.IsFemale, 'Pošetilá', 'Pošetilý' )]"
 nick_the_foolish_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] svým... #EMP jedinečným#! přístupem k rozhodování."
 nick_the_gullible: "[Select_CString( CHARACTER.IsFemale, 'Důvěřivá', 'Důvěřivý' )]"
 nick_the_gullible_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'důvěřuješ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' důvěřuje' ) )|U] ostatním poněkud více, než je pro [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] vlastní dobro zdrávo."
 nick_the_undefeated: "[Select_CString( CHARACTER.IsFemale, 'Neporažená', 'Neporažený' )]"
 nick_the_undefeated_desc: "[CZProDropNF(CHARACTER,'nebyla','nebyl')|U] v bitvě nikdy a za žádných okolností [Select_CString( CHARACTER.IsFemale, 'poražena', 'poražen' )] a dosud [Select_CString( CHARACTER.IsFemale, 'neokusila', 'neokusil' )] hořkost potupné prohry."
 nick_the_triumphant: "[Select_CString( CHARACTER.IsFemale, 'Vítězoslavná', 'Vítězoslavný' )]"
 nick_the_triumphant_desc: "Když svět zrodil bojovníka, který se prohlašoval za neporaženého, [Select_CString( CHARACTER.IsLocalPlayer, Select_CString( CHARACTER.IsFemale, 'svrhla jsi jej', 'svrhl jsi jej' ), Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, Select_CString( CHARACTER.IsFemale, ' jej svrhla', ' jej svrhl' ) ) )] a [Select_CString( CHARACTER.IsFemale, 'rozmetala', 'rozmetal' )] jeho legendu."
 nick_the_fury: "Běs"
 nick_the_fury_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvůj hněv', 'Hněv' )], zášť a #EMP pomsta#![Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] jsou považovány za strašlivou nevyhnutelnost. A skutečně jsou #EMP nevyhnutelné#!."
 nick_feareater: "[Select_CString( CHARACTER.IsFemale, 'Požíračka strachu', 'Požírač strachu' )]"
 nick_feareater_desc: "Strach, nenávist a #EMP hrůza#! nepřátel pohánějí [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] k činům krvežíznivosti a krutosti. K velmi, velmi účinným činům."
 nick_the_hawk: "Jestřáb"
 nick_the_hawk_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvému pronikavému zraku', Concatenate( 'Pronikavému zraku ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] unikne jen máloco a zostřeným pařátům vůbec nic."
 nick_the_trustworthy: "[Select_CString( CHARACTER.IsFemale, 'Důvěryhodná', 'Důvěryhodný' )]"
 nick_the_trustworthy_desc: "Pevnost, spolehlivost a sympatická upřímnost patří k [Select_CString( CHARACTER.IsLocalPlayer, 'tvým přednostem', Concatenate( 'přednostem ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )], třebaže nepřátelům [Select_CString( CHARACTER.IsLocalPlayer, 'připadáš', 'připadá' )] až překvapivě důvěřiv[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )]."
 nick_the_trustworthy_ironic: "$nick_the_trustworthy$"
 nick_the_trustworthy_ironic_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'za celý svůj život jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' za celý svůj život' ) )|U] doslova nikdy [Select_CString( CHARACTER.IsFemale, 'nevyslovila', 'nevyslovil' )] jedinou lež."
 nick_the_unrelenting: "[Select_CString( CHARACTER.IsFemale, 'Neústupná', 'Neústupný' )]"
 nick_the_unrelenting_desc: "Když [Select_CString( CHARACTER.IsLocalPlayer, 'si', Concatenate( 'si ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] něco vezme[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] do hlavy, dosáhne[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] toho bez ohledu na to, jak dlouho to potrvá."
 nick_the_glorious: "[Select_CString( CHARACTER.IsFemale, 'Slavná', 'Slavný' )]"
 nick_the_glorious_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'nepochybně se zapíšeš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se nepochybně zapíše' ) )|U] do dějin jako jedna z nejmajestátnějších osobností, které kdy kráčely po světě."
 nick_the_ecumenist: "[Select_CString( CHARACTER.IsFemale, 'Ekumenistka', 'Ekumenista' )]"
 nick_the_ecumenist_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé úsilí', Concatenate( 'Úsilí ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] o sjednocení a usmíření křesťanského světa z [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', Select_CString( CHARACTER.IsFemale, 'ní', 'něj' ) )] činí pro mnohé hrdinu, třebaže pro jiné také kacíře."
 nick_the_unifier_of_africa: "[Select_CString( CHARACTER.IsFemale, 'Sjednotitelka Afriky', 'Sjednotitel Afriky' )]"
 nick_the_unifier_of_africa_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jako první člověk v dějinách jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' jako první člověk v dějinách' ) )|U] [Select_CString( CHARACTER.IsFemale, 'sjednotila', 'sjednotil' )] známou Afriku pod svou korouhví."
 nick_the_motherfather_of_spain: "[Select_CString( CHARACTER.IsFemale, 'Matka Španělska', 'Otec Španělska' )]"
 nick_the_motherfather_of_spain_desc: "[CZProDropNF(CHARACTER,'spojila','spojil')|U] několik nesourodých iberských království v jeden pevný celek, Španělsko."
 nick_the_ladylord_of_the_ganges: "[Select_CString( CHARACTER.IsFemale, 'Paní Gangy', 'Pán Gangy' )]"
 nick_the_ladylord_of_the_ganges_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] posvátným ochráncem #EMP nejposvátnější#! řeky světa."
 nick_the_wend: "[Select_CString( CHARACTER.IsFemale, 'Vendka', 'Vend' )]"
 nick_the_wend_desc: "Poté, co [CZProDropSubNF(CHARACTER)] [Select_CString( CHARACTER.IsFemale, 'sjednotila', 'sjednotil' )] nesourodá západoslovanská království, [Select_CString( CHARACTER.IsFemale, 'stala', 'stal' )] [Select_CString( CHARACTER.IsLocalPlayer, 'ses', 'se' )] legendou už za svého života."
 nick_the_crowned: "[Select_CString( CHARACTER.IsFemale, 'Korunovaná', 'Korunovaný' )]"
 nick_the_crowned_desc: "Koruny samozřejmě existovaly i před [Select_CString( CHARACTER.IsLocalPlayer, 'tvou korunou', Concatenate( 'korunou ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )], ale #EMP ty#! se sotva počítají."
 nick_the_bogatyr: "Bohatýr"
 nick_the_bogatyr_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] úspěšným sjednocením všech slovanských národů."
 nick_the_polyanitsa: "Poljanice"
 nick_the_polyanitsa_desc: "$nick_the_bogatyr_desc$"
 nick_the_dane: "[Select_CString( CHARACTER.IsFemale, 'Dánka', 'Dán' )]"
 nick_the_dane_desc: "Svět [Select_CString( CHARACTER.IsLocalPlayer, 'tě zná', Concatenate( 'zná ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] jako [Select_CString( CHARACTER.IsFemale, 'nechvalně proslulou Skandinávku', 'nechvalně proslulého Skandinávce' )]. [Select_CString( CHARACTER.IsFemale, 'O jakou', 'O jakého' )] #EMP přesně#!, to už nikoho příliš nezajímá."
 nick_pendragon: "Pendragon"
 nick_pendragon_desc: "[CZProDropSeNF(CHARACTER,'opřela','opřel')|U] při prosazování svého nároku na Británii o... #EMP prastaré#! legendy."
 nick_the_tuatha_de_danann: "Tuatha Dé Danann"
 nick_the_tuatha_de_danann_desc: "[CZProDropSeNF(CHARACTER,'opřela','opřel')|U] při prosazování svého nároku na Británii o prastaré legendy."
 nick_the_sword_of_god: "Meč Boží"
 nick_the_sword_of_god_desc: "Jako vyvolená zbraň spravedlivého Pána [Select_CString( CHARACTER.IsFemale, 'vytesala', 'vytesal' )][Select_CString( CHARACTER.IsLocalPlayer, ' jsi', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] $e_outremer$ ze zemí nevěřících."
 nick_the_messenger_of_christ: "[Select_CString( CHARACTER.IsFemale, 'Poselkyně Kristova', 'Posel Kristův' )]"
 nick_the_messenger_of_christ_desc: "[CZProDropNF(CHARACTER,'přinesla','přinesl')|U] slovo Beránka Božího všem obyvatelům $e_outremer$."
 nick_the_maiden_of_virgin: "Dívka Panny Marie"
 nick_the_maiden_of_virgin_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá čistota', Concatenate( 'Čistota ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] je stejně proslulá jako čistota samotné blahoslavené Matky Boží."
 nick_the_knight_of_gabriel: "[Select_CString( CHARACTER.IsFemale, 'Rytířka Gabrielova', 'Rytíř Gabrielův' )]"
 nick_the_knight_of_gabriel_desc: "Jako planoucí meč Božího anděla pomsty [Select_CString( CHARACTER.IsFemale, 'vybudovala', 'vybudoval' )][Select_CString( CHARACTER.IsLocalPlayer, ' jsi', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] $e_outremer$ cihlu po krvavé cihle."
 nick_the_shepherd: "[Select_CString( CHARACTER.IsFemale, 'Pastýřka', 'Pastýř' )]"
 nick_the_shepherd_desc: "Ať už vyvolení božstva [CHARACTER.GetFaith.HighGodName] zabloudí kamkoli, [Select_CString( CHARACTER.IsLocalPlayer, 'pomůžeš jim', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' jim pomůže' ) )] bezpečně nalézt cestu domů."
 nick_the_judge: "[Select_CString( CHARACTER.IsFemale, 'Soudkyně', 'Soudce' )]"
 nick_the_judge_desc: "$k_israel$ v průběhu dějin volal po spravedlivých a poctivých soudcích. Někdy [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', 'je' )] mezi nimi [Select_CString( CHARACTER.IsFemale, 'připomínána', 'připomínán' )][Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' také ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )]."
 nick_the_saoshyant: "Saošjant"
 nick_the_saoshyant_desc: "Když se zdálo, že celý svět pohltil [CHARACTER.GetFaith.DevilName], [CZProDropNF(CHARACTER,'povstala','povstal')], [Select_CString( CHARACTER.IsLocalPlayer, 'abys', 'aby' )] [Select_CString( CHARACTER.IsFemale, 'navrátila', 'navrátil' )] Světlo."
 nick_the_timely_rain: "Déšť v pravý čas"
 nick_the_timely_rain_desc: "Štědrost ducha a úctyhodné vystupování [Select_CString( CHARACTER.IsLocalPlayer, 'ti slouží', Concatenate( 'slouží ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] ke cti."
 nick_the_jade_unicorn: "Nefritový jednorožec"
 nick_the_jade_unicorn_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'považována', 'považován' )] za nepřemožitelného bojovníka s holí."
 nick_the_wizard: "[Select_CString( CHARACTER.IsFemale, 'Čarodějka', 'Čaroděj' )]"
 nick_the_wizard_desc: "Lidé se často natolik soustředí na [Select_CString( CHARACTER.IsLocalPlayer, 'tvé podivné vnímání času', Concatenate( 'podivné vnímání času ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )], že zapomínají na [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] ďábelské triky."
 nick_the_big_halberd: "Velká halapartna"
 nick_the_panther_head: "Panteří hlava"
 nick_the_panther_head_desc: "Kruté pronikavé oči, ježaté vousy a kočičí vrčení [Select_CString( CHARACTER.IsLocalPlayer, 'ti vynesly', Concatenate( 'vynesly ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] toto přízvisko více než zaslouženě."
 nick_the_thunderbolt: "Hromoklín"
 nick_the_thunderbolt_desc: "Říká se, že nepřátelé [Select_CString( CHARACTER.IsLocalPlayer, 'tě zaslechnou', Concatenate( 'zaslechnou ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] teprve poté, co už [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'udeřila', 'udeřil' )]."
 nick_the_whirlwind: "Vichřice"
 nick_the_whirlwind_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'útočíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' útočí' ) )|U] tvrdě, rychle a především nepředvídatelně."
 nick_the_beautiful_beard: "Krásnovous"
 nick_the_beautiful_beard_desc: "Ta bohatost, ty kadeře, ta omamná vůně. Může se snad někdo na světě pochlubit tak majestátním vousem jako [Select_CString( CHARACTER.IsLocalPlayer, 'ty', CHARACTER.GetShortUINameNoTooltipNoFormat )]?"
 nick_the_tattooed_monk: "[Select_CString( CHARACTER.IsFemale, 'Tetovaná jeptiška', 'Tetovaný mnich' )]"
 nick_the_tattooed_monk_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá ohromná síla', Concatenate( 'Ohromná síla ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] může být legendární, ale [Select_CString( CHARACTER.IsLocalPlayer, 'těší tě', Select_CString( CHARACTER.IsFemale, 'těší ji', 'těší ho' ) )], že si lidé nejprve vybaví [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] vkusné tetování."
 nick_the_pilgrim: "[Select_CString( CHARACTER.IsFemale, 'Poutnice', 'Poutník' )]"
 nick_the_pilgrim_desc: "Jen málokdo putuje tak daleko a tolika směry jako [Select_CString( CHARACTER.IsLocalPlayer, 'ty', CHARACTER.GetShortUINameNoTooltipNoFormat )]. Dobře však [Select_CString( CHARACTER.IsLocalPlayer, 'víš', 'ví' )], že chce[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]-li skutečně porozumět [CHARACTER.GetFaith.GetName], musí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] poznat jeho nejsvětější místa i nesčetné podoby."
 nick_the_black_whirlwind: "Černá vichřice"
 nick_the_black_whirlwind_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvůj pohled', Concatenate( 'Pohled ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] zasévá strach do lidských srdcí."
 nick_the_unrestrained: "[Select_CString( CHARACTER.IsFemale, 'Nezkrotná', 'Nezkrotný' )]"
 nick_the_unrestrained_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé přízvisko', Concatenate( 'Přízvisko ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] odkazuje stejnou měrou na [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] nevázaný jazyk i schopnost uniknout věznitelům."
 nick_the_winged_tiger: "Okřídlený tygr"
 nick_the_winged_tiger_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé divokosti', Concatenate( 'Divokosti ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] se vyrovná jedině výška [Select_CString( CHARACTER.IsLocalPlayer, 'tvých', Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' ) )] skoků."
 nick_khatam_an_nabiyyin: "Chátam an-nabíjín"
 nick_khatam_an_nabiyyin_desc: "V přímém překladu „Pečeť proroků“ — označení, kterým Alláh v Koránu popisuje [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )]."
 nick_the_turbulent_river_dragon: "Drak bouřlivých řek"
 nick_the_turbulent_river_dragon_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 've vodách a mokřadech se pohybuješ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se ve vodách a mokřadech pohybuje' ) )|U] jako... drak."
 nick_the_wild: "[Select_CString( CHARACTER.IsFemale, 'Divoká', 'Divoký' )]"
 nick_the_wild_desc: "Šílený pohled, pomatené skutky a běsnění na bojišti."
 nick_the_ferocious_giant: "[Select_CString( CHARACTER.IsFemale, 'Zuřivá obryně', 'Zuřivý obr' )]"
 nick_the_ferocious_giant_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé přízvisko', Concatenate( 'Přízvisko ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] možná není poetické, jeho výstižnost však může zpochybnit jen málokdo."
 nick_the_prodigy: "Génius"
 nick_the_prodigy_desc: "Jako proslulý polyhistor projevuje[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )][Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] mimořádné nadání téměř ve všem, do čeho se pustí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]."
 nick_the_defender_of_highgod: "Štít [CHARACTER.GetFaith.HighGodName]"
 nick_the_defender_of_highgod_desc: "[CHARACTER.GetFaith.GetName] má ve smrtelném světě jen málo ochránců, kteří by se vyrovnali [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )]."
 nick_the_blood_motherfather: "[Select_CString( CHARACTER.IsFemale, 'Krvavá matka', 'Krvavý otec' )]"
 nick_the_blood_motherfather_desc: "Lidé vyslovují [Select_CString( CHARACTER.IsLocalPlayer, 'tvé přízvisko', Concatenate( 'přízvisko ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] se strachem a úžasem. Jen zvláštní druh [CHARACTER.Custom('MatriarchPatriarch')] dokáže zacházet se svou rodinou tak jako [Select_CString( CHARACTER.IsLocalPlayer, 'ty', CHARACTER.GetShortUINameNoTooltipNoFormat )]."
 nick_the_divine: "[Select_CString( CHARACTER.IsFemale, 'Božská', 'Božský' )]"
 nick_the_divine_desc: "Jen málokdo, kdo slyšel o [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_L') )], si může myslet něco jiného. Vždyť se [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'jí', 'ho' ) )] božství přinejmenším muselo dotknout."
 nick_the_anointed: "[Select_CString( CHARACTER.IsFemale, 'Pomazaná', 'Pomazaný' )]"
 nick_the_anointed_desc: "Rolníci si šeptají, že [CHARACTER.GetFaith.HighGodName] [Select_CString( CHARACTER.IsLocalPlayer, 'tě vybral', Concatenate( 'vybral ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )], [Select_CString( CHARACTER.IsLocalPlayer, 'abys', 'aby' )] ve smrtelném světě [Select_CString( CHARACTER.IsFemale, 'vykonala', 'vykonal' )] jeho dílo."
 nick_the_stupor_mundi: "Stupor Mundi"
 nick_the_stupor_mundi_desc: "Možná je to trochu domýšlivé, ale... čím jiným [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( 'je ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )], ne-li Divem světa?"
 nick_the_glass: "[Select_CString( CHARACTER.IsFemale, 'Skleněná žena', 'Skleněný muž' )]"
 nick_the_glass_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá posedlost', Concatenate( 'Posedlost ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] stavbou podivných skleněných přístřešků je stejně často probíraná jako nepochopitelná."
 nick_the_trojan: "[Select_CString( CHARACTER.IsFemale, 'Trójanka', 'Trójan' )]"
 nick_the_trojan_desc: "[CZProDropSeNF(CHARACTER,'vyrovnala','vyrovnal')|U] činům dávného Corinea a [Select_CString( CHARACTER.IsFemale, 'obnovila', 'obnovil' )] pravého dědice Tróje, Dumnonii."
 nick_the_butcher: "[Select_CString( CHARACTER.IsFemale, 'Řeznice', 'Řezník' )]"
 nick_the_butcher_desc: "Maso jako maso. Nakonec všechno přestane křičet."
 nick_the_fishy: "Rybí"
 nick_the_fishy_desc: "[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se ' ) )]#EMP [Select_CString( CHARACTER.IsLocalPlayer, 'Zkrátka se nedokážeš', 'zkrátka nedokáže' )]#! zbavit řečí o rybím zápachu, který se kolem [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', Select_CString( CHARACTER.IsFemale, 'ní', 'něj' ) )] občas vznáší."
 nick_blue_snake: "Modrý had"
 nick_blue_snake_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'na otázky ohledně svého přízviska neodpovídáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' na otázky ohledně svého přízviska neodpovídá' ) )|U]."
 nick_the_loyal: "[Select_CString( CHARACTER.IsFemale, 'Věrná', 'Věrný' )]"
 nick_the_loyal_desc: "Ať prší, či svítí slunce a ať se stane cokoli, přátelé vědí, že[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] bude[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] stát při nich."
 nick_troublemaker: "[Select_CString( CHARACTER.IsFemale, 'Potížistka', 'Potížista' )]"
 nick_troublemaker_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] svými názory, postřehy a hlasitostí."
 nick_the_seer: "[Select_CString( CHARACTER.IsFemale, 'Věštkyně', 'Věštec' )]"
 nick_the_seer_desc: "Vidět znamená věřit, ale kdo sám vidět nedokáže, musí vyhledat někoho, jako [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ty', Concatenate( 'je ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )]."
 nick_the_timid: "[Select_CString( CHARACTER.IsFemale, 'Bázlivá', 'Bázlivý' )]"
 nick_the_timid_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] mírné, až lekavé povahy a přímé střety nesnáší[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] dobře."
 nick_the_red: "[Select_CString( CHARACTER.IsFemale, 'Rudá', 'Rudý' )]"
 nick_the_red_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvých ohnivě rudých vlasů', Concatenate( 'Ohnivě rudých vlasů ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] si všimne téměř každý. Podle [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] zkušenosti až únavně často."
 nick_the_truthspeaker: "[Select_CString( CHARACTER.IsFemale, 'Pravdomluvná', 'Pravdomluvný' )]"
 nick_the_truthspeaker_desc: "Bez ohledu na závažnost věci každý ví, že se může spolehnout na [Select_CString( CHARACTER.IsLocalPlayer, 'tvou čestnost a zásadovost', Concatenate( 'čestnost a zásadovost ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )]."
 nick_the_curthose: "Krátké kalhoty"
 nick_the_curthose_desc: "V dětství [Select_CString( CHARACTER.IsLocalPlayer, 'ti říkal otec', Concatenate( 'říkal otec ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] „Krátké kalhoty“. Ani v dospělosti [Select_CString( CHARACTER.IsLocalPlayer, 'nedokážeš', Concatenate( 'nedokáže ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] přimět lidi, aby [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] #EMP přestali#! říkat Krátké kalhoty."
 nick_the_deep_minded: "[Select_CString( CHARACTER.IsFemale, 'Hloubavá', 'Hloubavý' )]"
 nick_the_deep_minded_desc: "Lidé hovoří o [Select_CString( CHARACTER.IsLocalPlayer, 'tvých hlubokých myšlenkách a závažných názorech', Concatenate( 'hlubokých myšlenkách a závažných názorech ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )]. [Select_CString( CHARACTER.IsLocalPlayer, 'nejraději však sedíš a přemýšlíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' však nejraději sedí a přemýšlí' ) )|U]."
 nick_the_white: "[Select_CString( CHARACTER.IsFemale, 'Bílá', 'Bílý' )]"
 nick_the_white_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'nejsi si', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' si není' ) )|U] [Select_CString( CHARACTER.IsFemale, 'jistá', 'jistý' )], zda [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] říkají $nick_the_white$ kvůli bledé pleti, nebo ještě světlejším vlasům. Jsou i horší přízviska."
 nick_wang_khan: "Ongchán"
 nick_wang_khan_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá velká vítězství', Concatenate( 'Velká vítězství ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] nad Tatary vedla k tomu, že [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'byla provolána', 'byl provolán' )] králem chánů. Po takovém úspěchu [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] jistě čeká dlouhá a zářná budoucnost."
 nick_the_bard: "[Select_CString( CHARACTER.IsFemale, 'Pěvkyně', 'Pěvec' )]"
 nick_the_bard_desc: "Krásný hlas a obratné prsty činí z [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') )] celebritu u každého dvora, který poctí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] svou návštěvou."
 nick_the_bard_ironic: "$nick_the_bard$"
 nick_the_bard_ironic_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Říkají ti', Concatenate( CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D'), ' říkají' ) )] „$nick_the_bard$“, protože [Select_CString( CHARACTER.IsLocalPlayer, 'bys', 'by' )] [Select_CString( CHARACTER.IsFemale, 'byla', 'byl' )] zábavnější [Select_CString( CHARACTER.IsFemale, 'přivázaná', 'přivázaný' )] k boku cválajícího koně než při pokusu zpívat."
 nick_hotspur: "Divous"
 nick_hotspur_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tví nepřátelé', Concatenate( 'Nepřátelé ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] si šeptají, že při tažení se [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] ostruhy ani nedotknou země, tolik času tráví[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] v sedle a tak zuřivé jsou [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] útoky. Do jisté míry se to projevuje i průměrnou dovedností ve fotbale."
 nick_the_black_adder: "Černá zmije"
 nick_the_black_adder_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'máš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' má' ) )|U] v zásobě nejeden vychytralý plán, přestože [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] nepřátelé považují za odpornou malou osobu."
 nick_the_inevitable: "[Select_CString( CHARACTER.IsFemale, 'Nevyhnutelná', 'Nevyhnutelný' )]"
 nick_the_inevitable_desc: "Nakonec se vše vždy obrátí [Select_CString( CHARACTER.IsLocalPlayer, 've tvůj prospěch', Concatenate( 've prospěch ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )]. Lidé to pochopí sami, nebo je o tom[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] přesvědčí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]."
 nick_the_plump: "[Select_CString( CHARACTER.IsFemale, 'Baculka', 'Baculáč' )]"
 nick_the_plump_desc: "Většina lidí [Select_CString( CHARACTER.IsLocalPlayer, 'ti říká', Concatenate( 'říká ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] $nick_the_plump$, protože je na [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', Select_CString( CHARACTER.IsFemale, 'ní', 'něm' ) )] zkrátka tolik k milování."
 nick_the_diseased: "[Select_CString( CHARACTER.IsFemale, 'Chorá', 'Chorý' )]"
 nick_the_diseased_desc: "První, co lidé o [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_L') )] obvykle zaslechnou, je [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] kašel."
 nick_the_flash: "Blesk [CHARACTER.GetFaith.HighGodName]"
 nick_the_flash_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'snažíš se', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se snaží' ) )|U] nevnímat sebe sama jako Hněv [CHARACTER.GetFaith.HighGodName]. „Blesk“ zní mnohem diplomatičtěji."
 nick_hand: "Nešťastná ruka"
 nick_hand_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvůj nedostatek štěstí a sklon', Concatenate( 'Nedostatek štěstí a sklon ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] k rozhodnutím, která se později ukážou jako katastrofální, již občas neušly pozornosti."
 nick_bloody: "[Select_CString( CHARACTER.IsFemale, 'Krvavá', 'Krvavý' )]"
 nick_bloody_desc: "Není neobvyklé, aby šlechtic za svůj život zabil několik nepřátel. Někteří se však s obavami ptají, kolik jich [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'musela', 'musel' )] #EMP zabít[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )]#!, když [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] proslavilo právě to."
 nick_the_oathbreaker: "[Select_CString( CHARACTER.IsFemale, 'Křivopřísežnice', 'Křivopřísežník' )]"
 nick_the_oathbreaker_desc: "Člověk má takovou cenu jako jeho slovo."
 nick_little: "[Select_CString( CHARACTER.IsFemale, 'Malá', 'Malý' )]"
 nick_little_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] možná malé postavy, ale [Select_CString( CHARACTER.IsLocalPlayer, 'ukrýváš', 'ukrývá' )] v sobě všechen hněv a zuřivost vzteklého rosomáka."
 nick_the_honest: "[Select_CString( CHARACTER.IsFemale, 'Upřímná', 'Upřímný' )]"
 nick_the_honest_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'považuješ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' považuje' ) )|U] upřímnost za #EMP vždy#! nejlepší cestu."
 nick_the_passionate: "[Select_CString( CHARACTER.IsFemale, 'Vášnivá', 'Vášnivý' )]"
 nick_the_passionate_desc: "Přátelé a spojenci milují [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj zápal', Concatenate( 'zápal ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )], odpůrci si však myslí, že [Select_CString( CHARACTER.IsLocalPlayer, 'by ses', 'by se' )] [Select_CString( CHARACTER.IsFemale, 'měla', 'měl' )] uklidnit."
 nick_the_silly: "[Select_CString( CHARACTER.IsFemale, 'Pošetilá', 'Pošetilý' )]"
 nick_the_silly_desc: "Ať už si o tom ostatní myslí cokoli,[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] nikdy nebere[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] život #EMP příliš#! vážně."
 nick_one_eyed: "[Select_CString( CHARACTER.IsFemale, 'Jednooká', 'Jednooký' )]"
 nick_one_eyed_desc: "$nick_monophthalmos_desc$"
 nick_the_trembling: "[Select_CString( CHARACTER.IsFemale, 'Třesavá', 'Třesavý' )]"
 nick_the_trembling_desc: "O [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_L') )] se bohužel nedá říct, že [Select_CString( CHARACTER.IsLocalPlayer, 'bys', 'by' )] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] podmanivým šarmem nebo odvážnými výpady."
 nick_the_rash: "[Select_CString( CHARACTER.IsFemale, 'Zbrklá', 'Zbrklý' )]"
 nick_the_rash_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'považuješ se', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se považuje' ) )|U] za přímočarou osobu, širý svět však vidí někoho bezmyšlenkovitého a ukvapeného."
 nick_moneybags: "Měšec"
 nick_moneybags_desc: "[Select_CString( CHARACTER.IsLocalPlayer, Select_CString( CHARACTER.IsFemale, 'možná bys raději nosila', 'možná bys raději nosil' ), Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, Select_CString( CHARACTER.IsFemale, ' by možná raději nosila', ' by možná raději nosil' ) ) )|U] přízvisko „Bohatá“, ale lidé mají na [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] majetek bohužel velmi konkrétní názor."
 nick_the_elegant: "[Select_CString( CHARACTER.IsFemale, 'Elegantní', 'Elegantní' )]"
 nick_the_elegant_desc: "Jemný dotek přináší půvabný výsledek a vytříbený postup buduje kultivovanou pověst."
 nick_the_eager: "[Select_CString( CHARACTER.IsFemale, 'Horlívá', 'Horlívý' )]"
 nick_the_eager_desc: "Nadšení je [Select_CString( CHARACTER.IsLocalPlayer, 'tvým heslem', Concatenate( 'heslem ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] a elán [Select_CString( CHARACTER.IsLocalPlayer, 'tvým', Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' ) )] krédem."
 nick_the_insane: "[Select_CString( CHARACTER.IsFemale, 'Pomatená', 'Pomatený' )]"
 nick_the_insane_desc: "Lidé kolem [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') )] našlapují po špičkách. Možná oprávněně, možná ne, ale proč riskovat, že urazí šílence?"
 nick_the_sleeper: "[Select_CString( CHARACTER.IsFemale, 'Spáčka', 'Spáč' )]"
 nick_the_sleeper_desc: "Lidé často poznamenávají, že [Select_CString( CHARACTER.IsLocalPlayer, 'bys', Concatenate( 'by ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] možná [Select_CString( CHARACTER.IsFemale, 'byla', 'byl' )] šťastnější jako domácí kočka."
 nick_the_quick: "[Select_CString( CHARACTER.IsFemale, 'Hbitá', 'Hbitý' )]"
 nick_the_quick_desc: "Rychlá mysl, rychlé tělo."
 nick_the_quick_ironic: "$nick_the_quick$"
 nick_the_quick_ironic_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'lidem tvrdíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' lidem tvrdí' ) )|U], že přízvisko [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'získala', 'získal' )] díky bystrému úsudku. [Select_CString( CHARACTER.IsFemale, 'Nezískala', 'Nezískal' )]."
 nick_the_selfish: "[Select_CString( CHARACTER.IsFemale, 'Sobecká', 'Sobecký' )]"
 nick_the_selfish_desc: "Celý svět ví, že[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] nemyslí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] na nikoho jiného než #EMP na sebe#!."
 nick_the_worthy: "[Select_CString( CHARACTER.IsFemale, 'Hodná', 'Hodný' )]"
 nick_the_worthy_desc: "Kdo takto [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] posoudil, je předmětem sporů, všichni se však shodují, že jde o skutečně znamenitou osobu."
 nick_the_unworthy: "[Select_CString( CHARACTER.IsFemale, 'Nehodná', 'Nehodný' )]"
 nick_the_unworthy_desc: "Naprosté zklamání jako člověk v teorii i v praxi."
 nick_the_traitor: "[Select_CString( CHARACTER.IsFemale, 'Zrádkyně', 'Zrádce' )]"
 nick_the_traitor_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé slovo', Concatenate( 'Slovo ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] má přibližně stejnou cenu jako vzduch, který je nese."
 nick_the_courageous: "[Select_CString( CHARACTER.IsFemale, 'Odvážná', 'Odvážný' )]"
 nick_the_courageous_desc: "Ohněm i plameny [Select_CString( CHARACTER.IsLocalPlayer, 'budeš', Concatenate( 'bude ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] spolehlivě pokračovat dál."
 nick_the_brilliant: "[Select_CString( CHARACTER.IsFemale, 'Brilantní', 'Brilantní' )]"
 nick_the_brilliant_desc: "Jen málokdo se vyrovná [Select_CString( CHARACTER.IsLocalPlayer, 'tvému intelektuálnímu nadání', Concatenate( 'intelektuálnímu nadání ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] a ještě méně lidí má odvahu se o to pokusit."
 nick_the_demon: "Démon"
 nick_the_demon_desc: "[CHARACTER.GetFaith.DevilName|U] by [Select_CString( CHARACTER.IsLocalPlayer, 'ti', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )] jistě vystavil příznivé doporučení před sněmem [CHARACTER.GetFaith.random_NegativeAfterLife]."
 nick_the_immortal: "[Select_CString( CHARACTER.IsFemale, 'Nesmrtelná', 'Nesmrtelný' )]"
 nick_the_immortal_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'vypadáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' vypadá' ) )|U] na svůj věk pozoruhodně mladě."
 nick_the_generous: "[Select_CString( CHARACTER.IsFemale, 'Štědrá', 'Štědrý' )]"
 nick_the_generous_desc: "[Select_CString( CHARACTER.IsLocalPlayer, Select_CString( CHARACTER.IsFemale, 'druhému bys darovala', 'druhému bys daroval' ), Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, Select_CString( CHARACTER.IsFemale, ' by druhému darovala', ' by druhému daroval' ) ) )|U] i košili z vlastních zad, kdyby si ji už nevzal někdo před ním."
 nick_the_diplomat: "[Select_CString( CHARACTER.IsFemale, 'Diplomatka', 'Diplomat' )]"
 nick_the_diplomat_desc: "Mírové řešení lze nalézt pomocí slov a[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] se slovy zachází[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] #EMP velmi#! dobře."
 nick_the_peacemaker: "[Select_CString( CHARACTER.IsFemale, 'Mírotvůrkyně', 'Mírotvůrce' )]"
 nick_the_peacemaker_desc: "Mír stojí za každou cenu."
 nick_the_tactician: "[Select_CString( CHARACTER.IsFemale, 'Taktička', 'Taktik' )]"
 nick_the_tactician_desc: "Strategie může vyžadovat vychytralost, ale taktika vyžaduje důvtip."
 nick_the_overseer: "[Select_CString( CHARACTER.IsFemale, 'Dohlížitelka', 'Dohlížitel' )]"
 nick_the_overseer_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] svou... bedlivou pozorností."
 nick_the_guardian: "[Select_CString( CHARACTER.IsFemale, 'Ochránkyně', 'Ochránce' )]"
 nick_the_guardian_desc: "Za deště i slunce, proti příteli či nepříteli stojí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )][Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] vždy při těch, které [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'přísahala', 'přísahal' )] chránit."
 nick_the_chivalrous: "[Select_CString( CHARACTER.IsFemale, 'Rytířská', 'Rytířský' )]"
 nick_the_chivalrous_desc: "Pro někoho může být čest bezcenná, ale pro [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] není na světě nic drahocennějšího."
 nick_the_valiant: "[Select_CString( CHARACTER.IsFemale, 'Chrabrá', 'Chrabrý' )]"
 nick_the_valiant_desc: "Vůdce, který nekráčí v čele, není žádným vůdcem."
 nick_the_deceiver: "[Select_CString( CHARACTER.IsFemale, 'Klamářka', 'Klamář' )]"
 nick_the_deceiver_desc: "Proč plýtvat drahou ocelí a krví, když jsou slova zadarmo?"
 nick_the_crow: "Vrána"
 nick_the_crow_desc: "Ti, kteří [Select_CString( CHARACTER.IsLocalPlayer, 'tě mají', Concatenate( 'mají ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] rádi, tvrdí, že přízvisko odkazuje na bystrou mysl a pronikavý zrak. Ostatní říkají, že se kolem [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', Select_CString( CHARACTER.IsFemale, 'ní', 'něj' ) )] drží smrt."
 nick_the_trickster: "[Select_CString( CHARACTER.IsFemale, 'Šibalka', 'Šibal' )]"
 nick_the_trickster_desc: "[Select_CString( CHARACTER.IsFemale, 'Vyprávěla', 'Vyprávěl' )] [Select_CString( CHARACTER.IsLocalPlayer, 'bys', 'by' )] snad[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] opravdu tak nestydaté lži, jaké o [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', Select_CString( CHARACTER.IsFemale, 'ní', 'něm' ) )] vyprávějí ostatní?"
 nick_the_chronicler: "[Select_CString( CHARACTER.IsFemale, 'Kronikářka', 'Kronikář' )]"
 nick_the_chronicler_desc: "Budoucí pokolení budou jistě vděčná za pečlivost, s níž[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] vše zaznamenává[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]."
 nick_the_truthseeker: "[Select_CString( CHARACTER.IsFemale, 'Hledačka pravdy', 'Hledač pravdy' )]"
 nick_the_truthseeker_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'známá', 'známý' )] neúnavným hledáním pravdy bez ohledu na to, kam vede a jakou cenu si vyžádá."
 nick_the_sage: "[Select_CString( CHARACTER.IsFemale, 'Mudrkyně', 'Mudrc' )]"
 nick_the_sage_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'učená', 'učený' )] a ochotně předává[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] své znalosti mladým."
 nick_the_historian: "[Select_CString( CHARACTER.IsFemale, 'Historička', 'Historik' )]"
 nick_the_historian_desc: "Kdo se z dějin ani nepokusí poučit, je odsouzen je opakovat."
 nick_the_sly: "[Select_CString( CHARACTER.IsFemale, 'Prohnaná', 'Prohnaný' )]"
 nick_the_sly_desc: "Hmm? Ten pohled? To nic není. Nedělej si s tím starosti."
 nick_the_cucumber_king: "[Select_CString( CHARACTER.IsFemale, 'Okurková královna', 'Okurkový král' )]"
 nick_the_cucumber_king_desc: "Jen málokdo může tvrdit, že uchvátil království. Ještě méně lidí může říct, že při tom sehrála klíčovou úlohu strategicky odcizená hlíza."
 nick_the_peaceful: "[Select_CString( CHARACTER.IsFemale, 'Mírumilovná', 'Mírumilovný' )]"
 nick_the_peaceful_desc: "Nemůžeme spolu prostě všichni vycházet?"
 nick_the_whetstone: "Brousek"
 nick_the_whetstone_desc: "Jako každý dobrý brousek [Select_CString( CHARACTER.IsLocalPlayer, 'se podvolíš', Concatenate( 'se ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' podvolí' ) ) )] i tupým čepelím."
 nick_the_slayer_of_the_snake: "[Select_CString( CHARACTER.IsFemale, 'Hadobijkyně', 'Hadobijec' )]"
 nick_the_slayer_of_the_snake_desc: "[CZProDropNF(CHARACTER,'pocházela','pocházel')|U] z Bagdádu a [Select_CString( CHARACTER.IsFemale, 'zabila', 'zabil' )] mocného hada Sarkiho, zlého původce ničivého sucha, [Select_CString( CHARACTER.IsLocalPlayer, 'abys', 'aby' )] [Select_CString( CHARACTER.IsFemale, 'získala', 'získal' )] ruku královny Daury."
 nick_the_illuminator: "[Select_CString( CHARACTER.IsFemale, 'Osvětitelka', 'Osvětitel' )]"
 nick_the_illuminator_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'oslavována', 'oslavován' )] jako první, kdo svému lidu přinesl světlo #EMP pravé#! víry a stal se počátkem jeho spásy."
 nick_the_builder: "[Select_CString( CHARACTER.IsFemale, 'Stavitelka', 'Stavitel' )]"
 nick_the_builder_desc: "Většina vládců mluví o budování svého panství pouze obrazně. [Select_CString( CHARACTER.IsLocalPlayer, 'Ty', CHARACTER.GetShortUINameNoTooltipNoFormat )] nikoli."
 nick_the_martyrophile: "[Select_CString( CHARACTER.IsFemale, 'Milovnice mučedníků', 'Milovník mučedníků' )]"
 nick_the_martyrophile_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] ve své víře všeobecně [Select_CString( CHARACTER.IsFemale, 'oceňována', 'oceňován' )] za zaznamenání životů jejích svatých mučedníků."
 nick_the_campeador: "Campeador"
 nick_the_campeador_desc: "Mnozí tvrdí, že nikdy neexistovalo dokonalejší ztělesnění válečnické ctnosti a rytířské ušlechtilosti. [Select_CString( CHARACTER.IsLocalPlayer, 'chválou však pohrdáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' však chválou pohrdá' ) )|U] a [Select_CString( CHARACTER.IsLocalPlayer, 'spokojuješ', 'spokojuje' )] se s naplňováním ideálů, které [Select_CString( CHARACTER.IsLocalPlayer, 'sis', 'si' )] [Select_CString( CHARACTER.IsFemale, 'sama stanovila', 'sám stanovil' )]."
 nick_the_girthy: "[Select_CString( CHARACTER.IsFemale, 'Mohutná', 'Mohutný' )]"
 nick_the_girthy_desc: "O [Select_CString( CHARACTER.IsLocalPlayer, 'tvé nesmírné váze, rozložité postavě a mohutnosti', Concatenate( 'nesmírné váze, rozložité postavě a mohutnosti ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] se mluví v každém městě, které navštíví[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]."
 nick_the_missionary: "[Select_CString( CHARACTER.IsFemale, 'Misionářka', 'Misionář' )]"
 nick_the_missionary_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'nespočineš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' nespočine' ) )|U], dokud zbývá jediná duše, kterou dosud nespasilo světlo [CHARACTER.GetFaith.GetName]."
 nick_the_hotspur: "Divous"
 nick_the_hotspur_desc: "Říká se, že[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] činí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] rozhodnutí tak rychle, že se ostruhy na [Select_CString( CHARACTER.IsLocalPlayer, 'tvých', Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' ) )] patách sotva dotknou země."
 nick_the_vanquisher: "[Select_CString( CHARACTER.IsFemale, 'Přemožitelka', 'Přemožitel' )]"
 nick_the_vanquisher_desc: "Ať se proti [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )] postaví kdokoli. [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] kosou [CHARACTER.GetFaith.DeathDeityName]."
 nick_the_bloody: "[Select_CString( CHARACTER.IsFemale, 'Krvavá', 'Krvavý' )]"
 nick_the_bloody_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'trochou nepořádku se nenecháš odradit', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se trochou nepořádku nenechá odradit' ) )|U] bez ohledu na to, kolika lidmi tento nepořádek býval."
 nick_the_shy: "[Select_CString( CHARACTER.IsFemale, 'Plachá', 'Plachý' )]"
 nick_the_shy_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'objevuješ se', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se objevuje' ) )|U] tak zřídka, že většina lidí o [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', Select_CString( CHARACTER.IsFemale, 'ní', 'něm' ) )] zná jen přízvisko."
 nick_the_giant: "[Select_CString( CHARACTER.IsFemale, 'Obryně', 'Obr' )]"
 nick_the_giant_desc: "Povídá se, že [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )] [Select_CString( CHARACTER.IsFemale, 'velká', 'velký' )] jako dům. Podle [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] zkušenosti záleží na tom, o jaký dům jde."
 nick_bad_hand: "Špatná ruka"
 nick_bad_hand_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'tvrdíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' tvrdí' ) )|U], že přízvisko odkazuje na [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] tvrdý pravý hák, ale většina lidí ví, že [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', 'je' )] pouze beznadějným hráčem karet."
 nick_the_little: "[Select_CString( CHARACTER.IsFemale, 'Malá', 'Malý' )]"
 nick_the_little_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] všeobecně [Select_CString( CHARACTER.IsFemale, 'považována', 'považován' )] za osobu nevelkého vzrůstu."
 nick_the_one_eyed: "[Select_CString( CHARACTER.IsFemale, 'Jednooká', 'Jednooký' )]"
 nick_the_one_eyed_desc: "$nick_monophthalmos_desc$"
 nick_the_oppressor: "[Select_CString( CHARACTER.IsFemale, 'Utlačovatelka', 'Utlačovatel' )]"
 nick_the_oppressor_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'rozhodně nejsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' rozhodně není' ) )|U] nejslavnějším vládcem, jakého kdy [Select_CString( CHARACTER.IsLocalPlayer, 'tví', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] poddaní měli."
 nick_the_apostate: "[Select_CString( CHARACTER.IsFemale, 'Odpadlice', 'Odpadlík' )]"
 nick_the_apostate_desc: "[CZProDropSeNF(CHARACTER,'postavila','postavil')|U] proti přílivu úspěchů jiné víry a namísto ní [Select_CString( CHARACTER.IsFemale, 'vyznala', 'vyznal' )] lásku a věrnost [CHARACTER.GetFaith.HighGodName]."
 nick_the_pagan: "[Select_CString( CHARACTER.IsFemale, 'Pohanka', 'Pohan' )]"
 nick_the_pagan_desc: "Většina lidí se tímto označením snaží [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] zesměšnit. Jen ať se snaží. [Select_CString( CHARACTER.IsLocalPlayer, 'znáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' zná' ) )|U] pravdu."
 nick_the_heretic: "[Select_CString( CHARACTER.IsFemale, 'Kacířka', 'Kacíř' )]"
 nick_the_heretic_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé obrácení', Concatenate( 'Obrácení ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] k [CHARACTER.GetFaith.GetName] bylo tak dramatické, že patří mezi věci, které si o [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', Select_CString( CHARACTER.IsFemale, 'ní', 'něm' ) )] lidé pamatují nejlépe."
 nick_the_savage: "[Select_CString( CHARACTER.IsFemale, 'Divoška', 'Divoký' )]"
 nick_the_savage_desc: "Neexistuje nic ani nikdo, koho [Select_CString( CHARACTER.IsLocalPlayer, 'bys', Concatenate( 'by ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] [Select_CString( CHARACTER.IsFemale, 'váhala', 'váhal' )] roztrhat na kusy. Muž, žena, dítě či pes, zabije[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] všechny a nechá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] [CHARACTER.GetFaith.HighGodName], ať je rozsoudí."
 nick_the_defiant: "[Select_CString( CHARACTER.IsFemale, 'Vzdorovitá', 'Vzdorovitý' )]"
 nick_the_defiant_desc: "Jen ať přijdou, ať přijdou všichni! [Select_CString( CHARACTER.IsLocalPlayer, 'Tvá cesta', Concatenate( 'Cesta ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] je správná a[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] zabije[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] tolik lidí, kolik bude třeba, [Select_CString( CHARACTER.IsLocalPlayer, 'abys', 'aby' )] to [Select_CString( CHARACTER.IsFemale, 'dokázala', 'dokázal' )]!"
 nick_the_sea_king: "[Select_CString( CHARACTER.IsFemale, 'Mořská královna', 'Mořský král' )]"
 nick_the_sea_king_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvým způsobem', Concatenate( 'Způsobem ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] je loupit a plenit a brát si, co chce[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )], od koho chce[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]. [Select_CString( CHARACTER.IsLocalPlayer, 'odmítáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' odmítá' ) )|U] změnit své způsoby i dovolit vlastnímu lidu, aby změnil ty své."
 nick_the_great_and_terrible: "[Select_CString( CHARACTER.IsFemale, 'Veliká a Hrozná', 'Veliký a Hrozný' )]"
 nick_the_great_and_terrible_desc: "Pirát bez sobě rovného, vládce krve a zlata a ztělesnění zářícího meče vztyčeného nad zpěněnými vlnami slaného moře. [Select_CString( CHARACTER.IsLocalPlayer, Select_CString( CHARACTER.IsFemale, 'zasloužila sis', 'zasloužil sis' ), Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, Select_CString( CHARACTER.IsFemale, ' si zasloužila', ' si zasloužil' ) ) )|U] označení Veliký a [Select_CString( CHARACTER.IsFemale, 'vytesala', 'vytesal' )][Select_CString( CHARACTER.IsLocalPlayer, ' sis', ' si' )] pověst hodnou přízviska #EMP Hrozný#!."
 nick_the_stonefaced: "Kamenná tvář"
 nick_the_stonefaced_desc: "Usměj se. Prosím? Alespoň jednou?"
 nick_the_dry: "[Select_CString( CHARACTER.IsFemale, 'Suchá', 'Suchý' )]"
 nick_the_dry_desc: "Nelze poznat, zda [Select_CString( CHARACTER.IsLocalPlayer, 'se neustále směješ', Concatenate( 'se ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' neustále směje' ) ) )] uvnitř, aniž [Select_CString( CHARACTER.IsLocalPlayer, 'bys', 'by' )] to [Select_CString( CHARACTER.IsFemale, 'dala', 'dal' )] najevo, nebo zkrátka vůbec nechápe[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] samotný pojem #EMP zábava#!."
 nick_the_joyless: "[Select_CString( CHARACTER.IsFemale, 'Zachmuřená', 'Zachmuřený' )]"
 nick_the_joyless_desc: "Každý, kdo s [Select_CString( CHARACTER.IsLocalPlayer, 'tebou', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_I') )] jedná denně, se brzy naučí vyjadřovat přesně a jednoznačně, protože ani [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] porozumění nikdy nebude méně přesné."
 nick_lacks_laughs: "Nesmějící se"
 nick_lacks_laughs_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'pověstná', 'pověstný' )] takovou vážností, že prý lidský smích [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'neslyšela', 'neslyšel' )] až do dospělosti. [Select_CString( CHARACTER.IsFemale, 'Domnívala', 'Domníval' )] [Select_CString( CHARACTER.IsLocalPlayer, 'ses', 'se' )], že dotyčný dostal záchvat."
 nick_the_dull: "[Select_CString( CHARACTER.IsFemale, 'Tupá', 'Tupý' )]"
 nick_the_dull_desc: "Nikdo si už přesně nepamatuje, proč [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] poprvé nazvali $nick_the_dull$. Všichni se shodují, že ani nestojí za to si to pamatovat."
 nick_the_snorer: "[Select_CString( CHARACTER.IsFemale, 'Chrápačka', 'Chrápač' )]"
 nick_the_snorer_desc: "Zda[Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] skutečně chrápe[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )], je jen předmětem planých dohadů, ale když pobývá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] doma, [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] dvůr je chrápáním rozhodně prosycen."
 nick_troll_slayer: "[Select_CString( CHARACTER.IsFemale, 'Trolobijkyně', 'Trolobijec' )]"
 nick_troll_slayer_desc: "Prostý lid se hrdě chlubí ochrannou mocí [Select_CString( CHARACTER.IsLocalPlayer, 'tvého doteku', Concatenate( 'doteku ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] a vypráví, jak [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )]v jeho jménu [Select_CString( CHARACTER.IsFemale, 'zabila', 'zabil' )] trolla."
 nick_the_bane_of_danes: "Zkáza Dánů"
 nick_the_bane_of_danes_desc: "Podle všeobecného mínění není ve Skandinávii jediná rodina, která by [Select_CString( CHARACTER.IsLocalPlayer, 'tvým ostřím', Concatenate( 'ostřím ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] nepřišla o některého příbuzného."
 nick_the_culture_wall: "[CHARACTER.GetCulture.GetNameNoTooltip] zeď"
 nick_the_culture_wall_desc: "Po [Select_CString( CHARACTER.IsLocalPlayer, 'tvých vodách', Concatenate( 'vodách ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] nepluje žádný cizí nájezdník, vikinský otrokář ani hladový plenitel a nikdo z nich neloví mezi [Select_CString( CHARACTER.IsLocalPlayer, 'tvým', Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' ) )] lidem."
 nick_nord_foe: "[Select_CString( CHARACTER.IsFemale, 'Nepřítelkyně Seveřanů', 'Nepřítel Seveřanů' )]"
 nick_nord_foe_desc: "Někteří hlupáci tvrdí, že Seveřany nelze zastrašit, protože jim v žilách koluje led. [Select_CString( CHARACTER.IsLocalPlayer, 'víš však', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' však ví' ) )|U], že umírají s křikem a krvácejí jako každý jiný."
 nick_the_scourge_of_the_northerners: "Metla Seveřanů"
 nick_the_scourge_of_the_northerners_desc: "Přicházejí do [Select_CString( CHARACTER.IsLocalPlayer, 'tvých zemí', Concatenate( 'zemí ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] za otroky a kořistí. Dánové, Norové i Švédové. [Select_CString( CHARACTER.IsLocalPlayer, 'nabízíš jim', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' jim nabízí' ) )|U] jen rychlou smrt a věčnost v [CHARACTER.GetFaith.random_NegativeAfterLife]."
 nick_the_burner_of_ash: "[Select_CString( CHARACTER.IsFemale, 'Palička jasanu', 'Palič jasanu' )]"
 nick_the_burner_of_ash_desc: "Nic nevoní tak krásně jako hořící drakkar za jarního rána."
 nick_the_garlic: "Česnekový král"
 nick_the_garlic_desc: "[CZProDropSeNF(CHARACTER,'stala','stal')|U] terčem posměšné dětské říkanky."
 nick_garlic_queen: "Česneková královna"
 nick_garlic_queen_desc: "$nick_the_garlic_desc$"
 nick_gajapati: "Gadžapati"
 nick_gajapati_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé novátorské využívání válečných slonů', Concatenate( 'Novátorské využívání válečných slonů ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] se jistě zapíše do dějin."
 nick_the_transcriber: "[Select_CString( CHARACTER.IsFemale, 'Opisovačka', 'Opisovač' )]"
 nick_the_transcriber_desc: "Poznání závisí na předávání a co může sloužit lépe než knihy a svitky, které budou číst celá pokolení?"
 nick_of_clairvaux: "z Clairvaux"
 nick_of_clairvaux_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvůj původ', Concatenate( 'Původ ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] je důležitý, protože umožňuje odlišit [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] od upřímně směšného množství dalších Bernardů."
 nick_the_headless: "[Select_CString( CHARACTER.IsFemale, 'Bezhlavá', 'Bezhlavý' )]"
 nick_the_headless_desc: "Rychlé a přímočaré. Stejně jako [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj konec', Concatenate( 'konec ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )]."
 nick_the_footstool: "Podnožka"
 nick_the_footstool_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé povinnosti', Concatenate( 'Povinnosti ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] jsou... tíživé. A často probírané."
 nick_father_of_the_baltic: "Otec Pobaltí"
 nick_father_of_the_baltic_desc: "[CZProDropNF(CHARACTER,'přivedla','přivedl')|U] Livonsko na svět krví, potem a dřinou."
 nick_mother_of_the_baltic: "Matka Pobaltí"
 nick_mother_of_the_baltic_desc: "$nick_father_of_the_baltic_desc$"
 nick_scourge_of_the_baltic: "Metla Pobaltí"
 nick_scourge_of_the_baltic_desc: "Díky [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )] Livonsko jistě přetrvá na pevných základech z kostí a utrpení."
 nick_the_mountain_king: "[Select_CString( CHARACTER.IsFemale, 'Horská královna', 'Horský král' )]"
 nick_the_mountain_king_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé vznešené síně', Concatenate( 'Vznešené síně ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] jsou široko daleko proslulé."
 nick_beth_nahrain: "[Select_CString( CHARACTER.IsFemale, 'Vládkyně dvou řek', 'Vládce dvou řek' )]"
 nick_beth_nahrain_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá pouhá přítomnost', Concatenate( 'Pouhá přítomnost ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] vysílá davem přívalovou vlnu, která všechny strhává úžasem nad [Select_CString( CHARACTER.IsLocalPlayer, 'tvými', Select_CString( CHARACTER.IsFemale, 'jejími', 'jeho' ) )] sjednotitelskými úspěchy."
 nick_the_child_killer: "[Select_CString( CHARACTER.IsFemale, 'Vražedkyně dětí', 'Vrah dětí' )]"
 nick_the_child_killer_desc: "Znalci Bible se obecně shodují, že [CZProDropSubNF(CHARACTER)] [Select_CString( CHARACTER.IsFemale, 'nepochopila', 'nepochopil' )] podstatu Šalomounova rozsudku."
 nick_the_anathema: "Klatba"
 nick_the_anathema_desc: "Chaos smrtelného světa před [Select_CString( CHARACTER.IsLocalPlayer, 'tebou', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_I') )] ustupuje."
 nick_the_angel_of_death: "Anděl [CHARACTER.GetFaith.DeathDeityName|U]"
 nick_the_angel_of_death_desc: "Podle [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') )] šlo o ukončení jejich utrpení. Zbytek světa to však vidí jinak."
 nick_monophthalmos: "Monofthalmos"
 nick_monophthalmos_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvému jedinému zbývajícímu oku', Concatenate( 'Jedinému zbývajícímu oku ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] se dostává mnohem více pozornosti, než jaké se kdy těšila obě."
 nick_health_god_mercy: "[CHARACTER.GetFaith.HealthGodNamePossessive|U] milost"
 nick_health_god_mercy_desc: "Navzdory pochybným začátkům [Select_CString( CHARACTER.IsLocalPlayer, 'sis', Concatenate( 'si ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] [Select_CString( CHARACTER.IsFemale, 'našla', 'našel' )] cestu k lékařství a [Select_CString( CHARACTER.IsFemale, 'získala', 'získal' )] věhlas péčí o chudé."
 nick_genghis_khan: "Čingischán"
 nick_genghis_khan_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] trestem seslaným [CHARACTER.GetFaith.HighGodName] za všechny hříchy světa. Kdyby svět nebyl plný hříšníků, proč by na něj [CHARACTER.GetFaith.HighGodName] seslal někoho jako #EMP [Select_CString( CHARACTER.IsLocalPlayer, 'ty', CHARACTER.GetShortUINameNoTooltipNoFormat )]#!?"
 nick_cengiz_khan: "Čingischán"
 nick_cengiz_khan_desc: "$nick_genghis_khan_desc$"
 nick_yekhe_khagan: "Jeke kagán"
 nick_yekhe_khagan_desc: "Veliký a vznešený vládce travnatého moře i všech usedlých zemí! [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] hřebcem, který osedlal svět."
 nick_dort_yonlug_khagan: "Dört Yönlüg kagán"
 nick_dort_yonlug_khagan_desc: "Země se rozprostírá do čtyř nesmírných směrů a až do posledních temných a nepoznaných končin po právu náleží [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )]! Celý vesmír je uspořádán pro [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] pohodlí a podléhá [Select_CString( CHARACTER.IsLocalPlayer, 'tvým', Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' ) )] rozkazům."
 nick_tengri_khagan: "Tengri kagán"
 nick_tengri_khagan_desc: "Za dávných časů mocných gökturkských kagánů byl tento titul vytesán do kamene! Tengri kagán, zrozený z nebes a moudrý. [CZProDropNF(CHARACTER,'byla','byl')|U] [Select_CString( CHARACTER.IsFemale, 'stvořena', 'stvořen' )] Velkým modrým nebem, [Select_CString( CHARACTER.IsLocalPlayer, 'abys', 'aby' )] [Select_CString( CHARACTER.IsFemale, 'vládla', 'vládl' )] světu."
 nick_xormuzta: "Xormuzta"
 nick_xormuzta_desc: "Prastaré čestné označení bylo kdysi spojováno se staroíránským „nebeským božstvem“ a dnes je východní křesťané a jim podobní používají k uctění legendárních zakladatelů, jako [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ty', Concatenate( 'je ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )]."
 nick_mar_sargis: "Mar Sargis"
 nick_mar_sargis_desc: "Říká se, že [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] vedla ke zbožné vládě svatá vidění a že [Select_CString( CHARACTER.IsLocalPlayer, 'tvým', Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' ) )] patronem je mučedník svatý Sargis."
 nick_cihangir: "Džihangír"
 nick_cihangir_desc: "Z božské vůle Alláhovy [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( 'je ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] dobyvatelem celého světa. Dár al-islám ani země nevěřících dosud neslyšely tak mocné dunění kopyt!"
 nick_culture_khagan: "[CHARACTER.GetCulture.GetNameNoTooltip] kagán"
 nick_culture_khagan_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'uctívána', 'uctíván' )] jako největší ze všech [CHARACTER.GetCulture.GetCollectiveNounNoTooltip] a [Select_CString( CHARACTER.IsLocalPlayer, 'tví', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] [CHARACTER.GetCulture.GetCollectiveNounNoTooltip] jsou dětmi osudu, jezdci, kteří drtí města a třímají meče i biče říše!"
 nick_akhshunwar: "Achšunvar"
 nick_akhshunwar_desc: "Vládci Hedvábné stezky odedávna nosili vznešené tituly jako #EMP ichšíd#!, #EMP šáhanšáh#! a #EMP Achšunvar#!, ale nikdo před [Select_CString( CHARACTER.IsLocalPlayer, 'tebou', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_I') )] nebyl hoden čestného označení „nositel moci“!"
 nick_fabulous_she_he: "[Select_CString( CHARACTER.IsFemale, 'Úžasná', 'Úžasný' )] [CHARACTER.GetFirstNameNoTooltip|U]"
 nick_fabulous_she_he_desc: "Není neobvyklé, že náhodní kolemjdoucí při průchodu této osoby pokleknou na jedno koleno na znamení úcty."
 nick_the_wary: "[Select_CString( CHARACTER.IsFemale, 'Ostražitá', 'Ostražitý' )]"
 nick_the_wary_desc: "Těkavé [CHARACTER.Custom('EyeEyes')] a podezíravý výraz jsou tím, co si lidé na [Select_CString( CHARACTER.IsLocalPlayer, 'tobě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_L') )] pamatují nejlépe."
 nick_the_black_sheep: "Černá ovce"
 nick_the_black_sheep_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 's většinou své rodiny vůbec nemluvíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' s většinou své rodiny vůbec nemluví' ) )|U]."
 nick_sisyphus: "[Select_CString( CHARACTER.IsFemale, 'Sisyfovská', 'Sisyfovský' )]"
 nick_sisyphus_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] především pokusy přesouvat těžké předměty po nemožných drahách."
 nick_blue_lion: "Modrý lev"
 nick_blue_lion_desc: "Každý ví, že s příchodem zimy řve $nick_blue_lion$ #EMP pouze#! o půlnoci."
 nick_the_hairy: "[Select_CString( CHARACTER.IsFemale, 'Chlupatá', 'Chlupatý' )]"
 nick_the_hairy_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Jsi', Concatenate( 'Je ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] člověkem, nebo spíše [CHARACTER.Custom('GetGenderAlliteratingAnimal')]? Na první pohled se to těžko poznává."
 nick_the_child: "Dítě"
 nick_the_child_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvůj život', Concatenate( 'Život ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] bohužel skončil příliš brzy na to, aby [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] proslavilo něco jiného než jeho náhlý konec."
 nick_the_wake: "[Select_CString( CHARACTER.IsFemale, 'Bdělá', 'Bdělý' )]"
 nick_the_wake_desc: "[Select_CString( CHARACTER.IsLocalPlayer, Concatenate( 'tvé ', CHARACTER.Custom('EyeEyes') ), Concatenate( CHARACTER.Custom('EyeEyes'), Concatenate( ' ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) ) )|U] neustále vyhlížejí bezpráví a při pouhé zmínce o [Select_CString( CHARACTER.IsLocalPlayer, 'tvém', Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' ) )] jméně se zachvějí cizí dobyvatelé i domácí přeběhlíci!"
 nick_the_bearded: "[Select_CString( CHARACTER.IsFemale, 'Vousatá', 'Vousatý' )]"
 nick_the_bearded_desc: "Stejně jako mnoho mužů [Select_CString( CHARACTER.IsLocalPlayer, 'máš', Concatenate( 'má ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] vousy. Opravdu netuší[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )], proč na to lidé neustále poukazují."
 nick_the_mountain_dweller: "[Select_CString( CHARACTER.IsFemale, 'Horalka', 'Horalan' )]"
 nick_the_mountain_dweller_desc: "Spatřit [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] mimo [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] horský domov je vzácností."
 nick_the_honest_hipped: "Poctivé boky"
 nick_the_honest_hipped_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Přiměješ', Concatenate( CHARACTER.GetSheHe, ' přiměje' ) )|U] muže zatoužit promluvit $language_iberian_name$."
 nick_the_legend_riad: "Legenda"
 nick_the_legend_riad_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá temná legenda', Concatenate( 'Temná legenda ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] vrhá stín na celý svět."
 nick_the_shadow_riad: "$nick_the_shadow$"
 nick_the_shadow_riad_desc: "$nick_the_legend_riad_desc$"
 nick_the_convicted: "Odsouzený"
 nick_the_convicted_desc: "[CZProDropNF(CHARACTER,'byla','byl')|U] [Select_CString( CHARACTER.IsFemale, 'zajata', 'zajat' )] během vikinského nájezdu a [Select_CString( CHARACTER.IsFemale, 'obviněna', 'obviněn' )] z vlastních nevhodných návrhů. [Select_CString( CHARACTER.IsLocalPlayer, 'Vypadáš', 'Vypadá' )] zoufale a [Select_CString( CHARACTER.IsLocalPlayer, 'toužíš', 'touží' )] vrátit se domů."
 nick_the_justicar: "[Select_CString( CHARACTER.IsFemale, 'Justiciárka', 'Justiciár' )]"
 nick_the_justicar_desc: "Lidé se většinou shodují, že [Select_CString( CHARACTER.IsLocalPlayer, 'tvé rozsudky', Concatenate( 'rozsudky ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] jsou spravedlivé a vyvážené."
 nick_the_green: "[Select_CString( CHARACTER.IsFemale, 'Zelená', 'Zelený' )]"
 nick_the_green_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'považována', 'považován' )] za velmi obratného zahradníka."
 nick_saltfish: "Solená ryba"
 nick_saltfish_desc: "[Select_CString( CHARACTER.IsLocalPlayer, Select_CString( CHARACTER.IsFemale, 'osvojila sis', 'osvojil sis' ), Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, Select_CString( CHARACTER.IsFemale, ' si osvojila', ' si osvojil' ) ) )|U] pohodlný a spokojený způsob života, ale kdo ví, co bude dál?"
 nick_king_of_fashion: "[CHARACTER.GetTitleAsNameNoTooltip] módy"
 nick_king_of_fashion_desc: "Ve světě hedvábí a soboliny [Select_CString( CHARACTER.IsLocalPlayer, 'sis', Concatenate( 'si ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] [Select_CString( CHARACTER.IsFemale, 'vydobyla', 'vydobyl' )] moc a vliv."
 nick_prince_of_fashion: "[CHARACTER.Custom('GetPrincessPrince')] módy"
 nick_prince_of_fashion_desc: "[CZProDropSeNF(CHARACTER,'stala','stal')|U] terčem posměchu kvůli svému vkusu v oblékání."
 nick_the_foreigner: "[Select_CString( CHARACTER.IsFemale, 'Cizinka', 'Cizinec' )]"
 nick_the_foreigner_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'pocházíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' pochází' ) )|U] z dalekých zemí."
 nick_the_culture: "z [CHARACTER.MakeScope.Var('nick_the_culture_var').Culture.GetNameNoTooltip] kultury"
 nick_the_culture_desc: "Obyvatelé panství [Select_CString( CHARACTER.IsLocalPlayer, 'tě označují', Concatenate( 'označují ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] podle kultury, k níž podle nich náleží[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )]."
 nick_the_linguist: "[Select_CString( CHARACTER.IsFemale, 'Polyglotka', 'Polyglot' )]"
 nick_the_linguist_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'ovládáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' ovládá' ) )|U] více jazyků, než mají někteří poddaní zubů."
 nick_the_clumsy: "[Select_CString( CHARACTER.IsFemale, 'Nešikovná', 'Nešikovný' )]"
 nick_the_clumsy_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'rozhodně jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' rozhodně' ) )|U] [Select_CString( CHARACTER.IsFemale, 'neproslula', 'neproslul' )] obratností."
 nick_the_stumbler: "[Select_CString( CHARACTER.IsFemale, 'Klopýtavá', 'Klopýtavý' )]"
 nick_the_stumbler_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'často klopýtáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' často klopýtá' ) )|U] o slova i o vlastní nohy."
 nick_the_graceful: "[Select_CString( CHARACTER.IsFemale, 'Půvabná', 'Půvabný' )]"
 nick_the_graceful_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá chůze', 'Chůze' )], mluva a především #EMP vytříbené vystupování#![Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] uvádějí přihlížející v úžas."
 nick_the_heart_throb: "[Select_CString( CHARACTER.IsFemale, 'Lamačka srdcí', 'Lamač srdcí' )]"
 nick_the_heart_throb_desc: "Jen málokteré srdce zůstane po setkání s [Select_CString( CHARACTER.IsLocalPlayer, 'tebou', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_I') )] klidné."
 nick_the_beautiful: "[Select_CString( CHARACTER.IsFemale, 'Krásná', 'Krásný' )]"
 nick_the_beautiful_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'působíš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' působí' ) )|U] božsky, bere[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] dech a neustále se těší[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] něčí přízni."
 nick_the_beautiful_generous: "[Select_CString( CHARACTER.IsFemale, 'Krásná', 'Krásný' )]"
 nick_the_beautiful_desc_generous: "[Select_CString( CHARACTER.IsLocalPlayer, 'možná nejsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' možná není' ) )|U] [Select_CString( CHARACTER.IsFemale, 'krásná', 'krásný' )] v tradičním slova smyslu, toto přízvisko [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )]však [Select_CString( CHARACTER.IsFemale, 'získala', 'získal' )] díky svým skutkům."
 nick_the_blushing: "[Select_CString( CHARACTER.IsFemale, 'Zardělá', 'Zardělý' )]"
 nick_the_blushing_desc: "Ve společnosti se [Select_CString( CHARACTER.IsLocalPlayer, 'tvé tváře', Concatenate( 'tváře ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] snadno zalijí ruměncem."
 nick_the_stutterer: "[Select_CString( CHARACTER.IsFemale, 'Koktavá', 'Koktavý' )]"
 nick_the_stutterer_desc: "Lidé [Select_CString( CHARACTER.IsLocalPlayer, 'ti', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )] s oblibou připomínají několik zakoktaných slov."
 nick_the_slow: "[Select_CString( CHARACTER.IsFemale, 'Pomalá', 'Pomalý' )]"
 nick_the_slow_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'rozhodně nepatříš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' rozhodně nepatří' ) )|U] mezi nejbystřejší osobnosti, které kdy dvůr poznal."
 nick_the_eloquent: "[Select_CString( CHARACTER.IsFemale, 'Výřečná', 'Výřečný' )]"
 nick_the_eloquent_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá řeč', Concatenate( 'Řeč ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] je stejně vytříbená jako [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] vystupování."
 nick_the_stud: "[Select_CString( CHARACTER.IsFemale, 'Klisna', 'Hřebec' )]"
 nick_the_stud_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvůj vzhled', Concatenate( 'Vzhled ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] dokáže v lidech probouzet všelijaké #EMP představy#!."
 nick_the_bell_keeper: "[Select_CString( CHARACTER.IsFemale, 'Strážkyně zvonu', 'Strážce zvonu' )]"
 nick_the_bell_keeper_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé názory', Concatenate( 'Názory ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] na zvonění jsou... poněkud neortodoxní."
 nick_the_requiem: "Rekviem"
 nick_the_requiem_desc: "A jaká to byla melodie."
 nick_the_King_of_Thieves: "Král zlodějů"
 nick_the_King_of_Thieves_desc: "Pán banditů, hrdlořezů, lupičů a další chátry."
 nick_the_Queen_of_Thieves: "Královna zlodějů"
 nick_the_Queen_of_Thieves_desc: "$nick_the_King_of_Thieves_desc$"
 nick_the_Thief_Slayer: "[Select_CString( CHARACTER.IsFemale, 'Zlodějobijkyně', 'Zlodějobijec' )]"
 nick_the_Thief_Slayer_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'nemáš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' nemá' ) )|U] se zloději žádné slitování."
 nick_the_flying: "Létající"
 nick_the_flying_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé vynálezy', Concatenate( 'Vynálezy ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] dokázaly něco, co dosud patřilo jen do legend."
 nick_the_flightless: "Nelétající"
 nick_the_flightless_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé vynálezy', Concatenate( 'Vynálezy ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] nedokázaly téměř nic kromě působivého vyvrcholení."
 nick_the_cid_campeador: "El Cid Campeador"
 nick_the_cid_campeador_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá legenda', Concatenate( 'Legenda ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] je plná obdivu, rytířskosti, zrady a cti."
 nick_benavert: "Benavert"
 nick_the_pragmatic: "[Select_CString( CHARACTER.IsFemale, 'Pragmatická', 'Pragmatický' )]"
 nick_the_pragmatic_desc: "Nejlepší řešení je to, které je v danou chvíli nejvhodnější."
 nick_the_equitable: "[Select_CString( CHARACTER.IsFemale, 'Nestranná', 'Nestranný' )]"
 nick_the_equitable_desc: "Ve všem dává[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] přednost spravedlivému a nestrannému rozdělení."
 nick_the_crownless: "[Select_CString( CHARACTER.IsFemale, 'Bezkorunná', 'Bezkorunný' )]"
 nick_the_crownless_desc: "Ačkoli není nijak básnické, [Select_CString( CHARACTER.IsLocalPlayer, 'tvé přízvisko', Concatenate( 'přízvisko ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] je výmluvné, přímočaré a pokaždé [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] pálí v uších."
 nick_the_real: "[Select_CString( CHARACTER.IsFemale, 'Pravá', 'Pravý' )]"
