 nick_wolf_father_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] po celé zemi [Select_CString( CHARACTER.IsFemale, 'známá', 'známý' )] tím, že [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'pomohla', 'pomohl' )] březí vlčici porodit a odchovat vrh vlčat."
