l_polish:
 DEFAULT_NICKNAME_DESC: "Přátelé i nepřátelé po celé zemi znají [CHARACTER.GetShortUINameNoTooltipNoFormat] pod přízviskem „[CHARACTER.GetNicknameNoTooltip]“."
 nick_tiny: "[Select_CString( CHARACTER.IsFemale, 'Malá', 'Malý' )]"
 nick_tiny_desc: "O [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ví, že má... vysoké ambice."
 nick_bluetooth: "[Select_CString( CHARACTER.IsFemale, 'Modrozubá', 'Modrozubý' )]"
 nick_bluetooth_desc: "Jediný zčernalý zub propůjčuje [CHARACTER.GetShortUINameNoTooltipNoFormat] nezaměnitelný a proslulý úsměv."
 nick_canmore: "[Select_CString( CHARACTER.IsFemale, 'Velkohlavá', 'Velkohlavý' )]"
 nick_canmore_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U], [Select_CString( CHARACTER.IsFemale, 'zvaná', 'zvaný' )] také „Velký náčelník“, je [Select_CString( CHARACTER.IsFemale, 'považována', 'považován' )] za mocnou sílu sjednocující panství."
 nick_tanglehair: "[Select_CString( CHARACTER.IsFemale, 'Rozcuchaná', 'Rozcuchaný' )]"
 nick_tanglehair_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'složila', 'složil' )] přísahu, že si nebude česat, stříhat ani mýt vlasy, dokud nesjednotí znesvářené norské pány."
 nick_fairhair: "[Select_CString( CHARACTER.IsFemale, 'Krásnovlasá', 'Krásnovlasý' )]"
 nick_fairhair_desc: "Poté, co [CHARACTER.GetShortUINameNoTooltipNoFormat] pod svou korouhví [Select_CString( CHARACTER.IsFemale, 'sjednotila', 'sjednotil' )] Norsko, [Select_CString( CHARACTER.IsFemale, 'získala', 'získal' )] znovu právo ostříhat si, upravit a navonět vlasy. Žádné vlasy nejsou krásnější než ty, které si člověk vydobyl dřinou a svárem."
 nick_haardraade: "[Select_CString( CHARACTER.IsFemale, 'Krutá', 'Krutý' )]"
 nick_haardraade_desc: "Do očí lidé [CHARACTER.GetShortUINameNoTooltipNoFormat] oslovují přízviskem $nick_haardraade$. Za zády však kvůli bezútěšné povaze a tvrdé spravedlnosti používají přízvisko $nick_the_tyrant$."
 nick_hardeknud: "Hardiknut"
 nick_hardeknud_desc: "Mnozí poddaní se nedokážou shodnout na přesné výslovnosti jména [CHARACTER.GetShortUINameNoTooltipNoFormat], a proto je známo v mnoha podobách."
 nick_hildetand: "Válečný zub"
 nick_hildetand_desc: "Koluje bezpočet legend o tom, jak [CHARACTER.GetShortUINameNoTooltipNoFormat] v bitvě dramaticky [Select_CString( CHARACTER.IsFemale, 'přišla', 'přišel' )] o zuby, načež [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] zázračně vyrostly dva nové."
 nick_lodbrok: "Loðbrók"
 nick_lodbrok_desc: "Ustrašené davy světa [CHARACTER.GetShortUINameNoTooltipNoFormat] říkají „Chlupaté nohavice“, neboť se traduje, že nosí nohavice z kůže stažené z mrtvoly mocného draka. Samozřejmě draka, kterého [CHARACTER.GetShortUINameNoTooltipNoFormat] #EMP [Select_CString( CHARACTER.IsFemale, 'sama zabila', 'sám zabil' )]#!."
 nick_ring: "Prsten"
 nick_ring_desc: "Nikdo vlastně neví, proč svět [CHARACTER.GetShortUINameNoTooltipNoFormat] říká „$nick_ring$“, dychtiví rolníci však doufají, že je to kvůli štědrosti, s níž sahá do měšce."
 nick_snake_in_the_eye: "Hadí oko"
 nick_snake_in_the_eye_desc: "Pocestní si šeptají, že [CHARACTER.GetShortUINameNoTooltipNoFormat] má v oku skvrnu ve tvaru uroboru, věčného symbolu hada zakusujícího se do vlastního ocasu. Málokdo je ochoten přiblížit se natolik, aby pravdivost těchto tvrzení ověřil."
 nick_the_affable: "[Select_CString( CHARACTER.IsFemale, 'Přívětivá', 'Přívětivý' )]"
 nick_the_affable_desc: "Klidná povaha, bezstarostné vystupování a příjemné způsoby. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] si neláme hlavu s tím, jakým přízviskem [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] lidé nazývají, ale naštěstí je to téměř vždy něco #EMP milého#!."
 nick_the_apostle: "[Select_CString( CHARACTER.IsFemale, 'Apoštolka', 'Apoštol' )]"
 nick_the_apostle_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'patřila', 'patřil' )] mezi osobní druhy Ježíše Krista, [Select_CString( CHARACTER.IsFemale, 'doprovázela', 'doprovázel' )] ho po celý život a po jeho mučednické smrti [Select_CString( CHARACTER.IsFemale, 'hlásala', 'hlásal' )] jeho učení."
 nick_the_avenger: "[Select_CString( CHARACTER.IsFemale, 'Mstitelka', 'Mstitel' )]"
 nick_the_avenger_desc: "Nepřátelé dobře vědí, že [CHARACTER.GetShortUINameNoTooltipNoFormat] neúprosně a neúnavně vykonává spravedlnost za každou cenu."
 nick_the_bald: "[Select_CString( CHARACTER.IsFemale, 'Plešatá', 'Plešatý' )]"
 nick_the_bald_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] trpí ochromujícím nedostatkem vlasů a nikdo [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] to nedovolí zapomenout."
 nick_the_bald_ironic: "$nick_the_bald$"
 nick_the_bald_ironic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] strávil[Select_CString( CHARACTER.IsFemale, 'a', '' )] většinu života bez náležité koruny na hlavě a dvůr [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] to nedovolí zapomenout."
 nick_the_bastard: "Bastard"
 nick_the_bastard_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se [Select_CString( CHARACTER.IsFemale, 'narodila', 'narodil' )] mimo manželství a nedokáže na to zapomenout. Zbytek světa na to rozhodně nezapomene."
 nick_the_betrayer: "[Select_CString( CHARACTER.IsFemale, 'Zrádkyně', 'Zrádce' )]"
 nick_the_betrayer_desc: "Každý ví, čeho se [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString( CHARACTER.IsFemale, 'dopustila', 'dopustil' )]."
 nick_the_black: "[Select_CString( CHARACTER.IsFemale, 'Černá', 'Černý' )]"
 nick_the_black_desc: "Krutá povaha, pověstně nečestné jednání a veskrze prokletý přístup k bližním vynesly [CHARACTER.GetShortUINameNoTooltipNoFormat] špatnou pověst."
 nick_the_blessed: "[Select_CString( CHARACTER.IsFemale, 'Blahoslavená', 'Blahoslavený' )]"
 nick_the_blessed_desc: "Když se mluví o [CHARACTER.GetShortUINameNoTooltipNoFormat], všichni zmiňují především spravedlivou povahu a neochvějnou obhajobu víry."
 nick_the_blind: "[Select_CString( CHARACTER.IsFemale, 'Slepá', 'Slepý' )]"
 nick_the_blind_desc: "Zdá se, že svět na [CHARACTER.GetShortUINameNoTooltipNoFormat] nevidí nic jiného než [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] slepotu."
 nick_the_bold: "[Select_CString( CHARACTER.IsFemale, 'Smělá', 'Smělý' )]"
 nick_the_bold_desc: "Odvaha, neohroženost, smělost, statečnost a hrdinství. Jméno [CHARACTER.GetShortUINameNoTooltipNoFormat] je synonymem pro rychlé a rozhodné jednání. I nepřátelé používají přízvisko „$nick_the_bold$“. Alespoň tak zarazí záplavu synonym."
 nick_the_boneless: "[Select_CString( CHARACTER.IsFemale, 'Bezkostná', 'Bezkostný' )]"
 nick_the_boneless_desc: "Křehká kostra [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] zastírá zuřivost [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] mysli a ducha."
 nick_the_brave: "[Select_CString( CHARACTER.IsFemale, 'Statečná', 'Statečný' )]"
 nick_the_brave_desc: "Ani roztřesená kolena, ani chvějící se zápěstí neodradí [CHARACTER.GetShortUINameNoTooltipNoFormat] od [Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' )] cílů."
 nick_the_chaste: "[Select_CString( CHARACTER.IsFemale, 'Cudná', 'Cudný' )]"
 nick_the_chaste_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] zálibou v pořádném nočním spánku."
 nick_the_confessor: "[Select_CString( CHARACTER.IsFemale, 'Vyznavačka', 'Vyznavač' )]"
 nick_the_confessor_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] lítostí i nad sebemenšími hříchy."
 nick_the_conqueror: "[Select_CString( CHARACTER.IsFemale, 'Dobyvatelka', 'Dobyvatel' )]"
 nick_the_conqueror_desc: "Jaký mocnější čin lze zapsat do análů než podmanění #EMP celého#! panství? [CHARACTER.GetShortUINameNoTooltipNoFormat|U] rozhodně nedovolí, aby lidé na tento úspěch zapomněli."
 nick_the_cruel: "[Select_CString( CHARACTER.IsFemale, 'Krutá', 'Krutý' )]"
 nick_the_cruel_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] si [Select_CString( CHARACTER.IsFemale, 'ráda', 'rád' )] namlouvá, že má vlastně docela slunnou povahu. Lidé jen nechápou [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] smysl pro #EMP humor#!."
 nick_the_child_of_devilgod: "[Select_CString( CHARACTER.IsFemale, 'Zplozenkyně', 'Zplozenec' )] [CHARACTER.GetFaith.DevilName|U]"
 nick_the_child_of_devilgod_desc: "Zlé jazyky tvrdí, že [CHARACTER.GetShortUINameNoTooltipNoFormat] je nepodařeným potomkem [CHARACTER.GetFaith.DevilName|U]. Alespoň dokud jim [CHARACTER.GetShortUINameNoTooltipNoFormat] ty jazyky nevytrhne."
 nick_the_crusader: "[Select_CString( CHARACTER.IsFemale, 'Křižačka', 'Křižák' )]"
 nick_the_crusader_desc: "Nevěřící, odpadlíci i kacíři padají před čepelí [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_destroyer: "[Select_CString( CHARACTER.IsFemale, 'Ničitelka', 'Ničitel' )]"
 nick_the_destroyer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] vypalováním držav a budov a zanecháváním země poseté solí a kostmi mrtvých."
 nick_the_destroyer_prophecy: "$nick_the_destroyer$"
 nick_the_destroyer_prophecy_desc: "Významné proroctví přisuzuje [CHARACTER.GetShortUINameNoTooltipNoFormat] toto přízvisko. Zda je [Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' )] osudem svrhnout zkažený řád, nebo spálit ten spravedlivý, zůstává předmětem sporů."
 nick_the_devil: "[Select_CString( CHARACTER.IsFemale, 'Ďáblice', 'Ďábel' )]"
 nick_the_devil_desc: "Zlé úmysly zahalují činy [CHARACTER.GetShortUINameNoTooltipNoFormat] jako plášť a celá země v nich vidí to nejhorší."
 nick_the_drunkard: "[Select_CString( CHARACTER.IsFemale, 'Opilkyně', 'Opilec' )]"
 nick_the_drunkard_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tráví život hledáním jasnosti na dně korbelu. Každý ví, že ji nikdy nenajde."
 nick_the_fair: "[Select_CString( CHARACTER.IsFemale, 'Sličná', 'Sličný' )]"
 nick_the_fair_desc: "Tvář [CHARACTER.GetShortUINameNoTooltipNoFormat] je považována za mimořádně líbeznou."
 nick_the_fat: "[Select_CString( CHARACTER.IsFemale, 'Tlustá', 'Tlustý' )]"
 nick_the_fat_desc: "Říká se, že z podbradku [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] občas vypadnou celá kuřecí stehna."
 nick_the_fearless: "[Select_CString( CHARACTER.IsFemale, 'Neohrožená', 'Neohrožený' )]"
 nick_the_fearless_desc: "Vojáci [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] tvrdí, že nikdy neviděli [CHARACTER.GetShortUINameNoTooltipNoFormat] ucuknout před člověkem, koněm ani střelou. Většina lidí jim věří."
 nick_the_fowler: "[Select_CString( CHARACTER.IsFemale, 'Ptáčnice', 'Ptáčník' )]"
 nick_the_fowler_desc: "U dvora se povídá, že [CHARACTER.GetShortUINameNoTooltipNoFormat] tráví lovem divokého ptactva stejně času jako vládnutím."
 nick_the_gentle: "[Select_CString( CHARACTER.IsFemale, 'Mírná', 'Mírný' )]"
 nick_the_gentle_desc: "Když [CHARACTER.GetShortUINameNoTooltipNoFormat] jedná správně, lidé si ani nejsou jistí, zda vůbec něco [Select_CString( CHARACTER.IsFemale, 'udělala', 'udělal' )]."
 nick_the_german: "[Select_CString( CHARACTER.IsFemale, 'Němka', 'Němec' )]"
 nick_the_german_desc: "Lidé z [Select_CString( CHARACTER.IsFemale, 'jejího', 'jeho' )] panství říkají [CHARACTER.GetShortUINameNoTooltipNoFormat] „$nick_the_german$“, ale [CHARACTER.GetShortUINameNoTooltipNoFormat] vlastně nechápe proč."
 nick_the_german_post_mortem: "$nick_the_german$"
 nick_the_german_post_mortem_desc: "Smrt [CHARACTER.GetShortUINameNoTooltipNoFormat] symbolizovala nejasný přechod, během něhož se Východní Francii začalo říkat Německo."
 nick_the_good: "[Select_CString( CHARACTER.IsFemale, 'Dobrá', 'Dobrý' )]"
 nick_the_good_desc: "Spravedlivá povaha [CHARACTER.GetShortUINameNoTooltipNoFormat] a oddanost hodnotám [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] víry vedou ostatní [CHARACTER.GetFaith.GetAdherentNamePluralNoTooltip] k tomu, aby k [Select_CString( CHARACTER.IsFemale, 'ní', 'němu' )] vzhlíželi s úctou."
 nick_the_gouty: "[Select_CString( CHARACTER.IsFemale, 'Dnavá', 'Dnavý' )]"
 nick_the_gouty_desc: "Zanícené a oteklé klouby spolu s bolestivě zkroucenými údy řadí [CHARACTER.GetShortUINameNoTooltipNoFormat] mezi přepychem hýčkané vyšší vrstvy společnosti. Možná hýčkané až #EMP příliš#!."
 nick_the_great: "[Select_CString( CHARACTER.IsFemale, 'Veliká', 'Veliký' )]"
 nick_the_great_desc: "Úspěchy [CHARACTER.GetShortUINameNoTooltipNoFormat] jsou legendární. Prostý lid o [Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' )] činech zpívá písně a šlechta reptá nad nespravedlivými očekáváními."
 nick_the_hammer: "Kladivo"
 nick_the_hammer_desc: "Kdo chce vědět, proč [CHARACTER.GetShortUINameNoTooltipNoFormat] říkají „$nick_the_hammer$“, stačí se zeptat [Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' )] nešťastných nepřátel."
 nick_the_handsome: "[Select_CString( CHARACTER.IsFemale, 'Pohledná', 'Pohledný' )]"
 nick_the_handsome_desc: "#EMP Ach, můj ty světe#!. Jen málokdo se může pochlubit tak ostře řezanou čelistí, rovnými rameny či tak podmanivým pohledem, za nímž stojí [CHARACTER.Custom('Eye_ArticleBlank')][CHARACTER.Custom('EyeEyes')]."
 nick_the_heathen: "[Select_CString( CHARACTER.IsFemale, 'Pohanka', 'Pohan' )]"
 nick_the_heathen_desc: "Při skutečně zásadním obrácení [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString( CHARACTER.IsFemale, 'opustila', 'opustil' )] nejen svou víru a náboženství, ale celou svou #EMP náboženskou tradici#! a [Select_CString( CHARACTER.IsFemale, 'přijala', 'přijal' )] zcela odlišný pohled na božský řád."
 nick_the_heathen_rebel: "$nick_the_heathen$"
 nick_the_heathen_rebel_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] vzpourou proti tomu, co považuje za modlářské zvyklosti svých krajanů a jejich falešnou teologii."
 nick_the_holy: "[Select_CString( CHARACTER.IsFemale, 'Svatá', 'Svatý' )]"
 nick_the_holy_desc: "Bohem ustanovený život [CHARACTER.GetShortUINameNoTooltipNoFormat] neposkvrňuje žádná neřest, hřích, svatokrádež ani bezbožnost."
 nick_the_hunchback: "[Select_CString( CHARACTER.IsFemale, 'Hrbatá', 'Hrbatý' )]"
 nick_the_hunchback_desc: "Nikdo, kdo pohlédne na [CHARACTER.GetShortUINameNoTooltipNoFormat], nemůže přehlédnout výrazný hrb na zádech ani předsunutou hlavu. Někdy se zdá, že lidé nic jiného ani nevidí."
 nick_the_hunter: "[Select_CString( CHARACTER.IsFemale, 'Lovkyně', 'Lovec' )]"
 nick_the_hunter_desc: "Pohotová střelba a ještě pohotovější zrak [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] jsou proslulé na mnoho mil všemi směry. Někteří tvrdí, že [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] luk dostřelí stejně daleko, jako sahá věhlas [Select_CString( CHARACTER.IsFemale, 'jejího', 'jeho' )] jména."
 nick_the_ironside: "Železný bok"
 nick_the_ironside_desc: "Kopí, sekera, meč či šíp. O [CHARACTER.GetShortUINameNoTooltipNoFormat] se říká, že dokáže odrazit každý úder, od nejmocnějšího rozmachu až po čepel vraha."
 nick_the_just: "[Select_CString( CHARACTER.IsFemale, 'Spravedlivá', 'Spravedlivý' )]"
 nick_the_just_desc: "Zákon a řád jsou základem všeho dobrého v životě. Bez zákona se řád mění v tyranii a bez řádu je zákon bezmocný."
 nick_the_kind: "[Select_CString( CHARACTER.IsFemale, 'Laskavá', 'Laskavý' )]"
 nick_the_kind_desc: "Klidné slovo, konejšivý úsměv či pozvání za chladného dne. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] věří, že světem lze pohnout trochou soucitu."
 nick_the_lame: "[Select_CString( CHARACTER.IsFemale, 'Chromá', 'Chromý' )]"
 nick_the_lame_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] sužuje chromá noha a svět se tomu nejen odmítá přizpůsobit, ale navíc [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] to nedovolí zapomenout."
 nick_the_lawgiver: "[Select_CString( CHARACTER.IsFemale, 'Zákonodárkyně', 'Zákonodárce' )]"
 nick_the_lawgiver_desc: "Pravidla, řád a řádný postup patří mezi mnohé dary, které [CHARACTER.GetShortUINameNoTooltipNoFormat] přináší svému lidu."
 nick_the_liberator: "[Select_CString( CHARACTER.IsFemale, 'Osvoboditelka', 'Osvoboditel' )]"
 nick_the_liberator_desc: "Ostřím nabroušené oceli či obratně volenými slovy [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString( CHARACTER.IsFemale, 'vydobyla', 'vydobyl' )] zotročeným veliké svobody."
 nick_the_lion: "[Select_CString( CHARACTER.IsFemale, 'Lvice', 'Lev' )]"
 nick_the_lion_desc: "Vznešenost, divokost a majestátnost. Je-li lev králem zvířat, pak zjevná podobnost [CHARACTER.GetShortUINameNoTooltipNoFormat] s touto šelmou naznačuje zářný osud."
 nick_the_lionheart: "Lví srdce"
 nick_the_lionheart_desc: "Odvaha hraničící s pošetilostí, zdrcující síla v bitvě a smrtící obratnost v souboji. Kdo přemýšlí, jak [CHARACTER.GetShortUINameNoTooltipNoFormat] k tomuto přízvisku [Select_CString( CHARACTER.IsFemale, 'přišla', 'přišel' )], zjevně se s [Select_CString( CHARACTER.IsFemale, 'ní', 'ním' )] nikdy nesetkal."
 nick_the_lisp_and_lame: "[Select_CString( CHARACTER.IsFemale, 'Šišlavá a chromá', 'Šišlavý a chromý' )]"
 nick_the_lisp_and_lame_desc: "[CHARACTER.GetFaith.HealthGodName] se nespokojil s tím, že [CHARACTER.GetShortUINameNoTooltipNoFormat] obdařil pomalou a nemotornou chůzí, a navíc [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] proklel příšerným šišláním."
 nick_the_magnificent: "[Select_CString( CHARACTER.IsFemale, 'Nádherná', 'Nádherný' )]"
 nick_the_magnificent_desc: "Příběhy o velkolepých činech [CHARACTER.GetShortUINameNoTooltipNoFormat] se vyprávějí od Irska až po Čínu."
 nick_the_martyr: "[Select_CString( CHARACTER.IsFemale, 'Mučednice', 'Mučedník' )]"
 nick_the_martyr_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'zemřela', 'zemřel' )] za [CHARACTER.GetFaith.HighGodName] a [CHARACTER.GetFaith.GetAdherentNamePlural] po celém světě vzpomínají na [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] oběť."
 nick_the_merry: "[Select_CString( CHARACTER.IsFemale, 'Veselá', 'Veselý' )]"
 nick_the_merry_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] dobrou náladou, znamenitými žerty a výtečnými hostinami."
 nick_the_honorable: "[Select_CString( CHARACTER.IsFemale, 'Čestná', 'Čestný' )]"
 nick_the_honorable_desc: "Jakmile je dohoda uzavřena a [CHARACTER.GetShortUINameNoTooltipNoFormat] dá své slovo, lze se spolehnout, že je dodrží s pevností oceli."
 nick_the_greedy: "[Select_CString( CHARACTER.IsFemale, 'Chamtivá', 'Chamtivý' )]"
 nick_the_greedy_desc: "Co je lepší než jeden měšec stříbra? Dva měšce stříbra!"
 nick_the_monk: "[Select_CString( CHARACTER.IsFemale, 'Jeptiška', 'Mnich' )]"
 nick_the_monk_desc: "Zbožné vystupování a zdrženlivý způsob života činí z [CHARACTER.GetShortUINameNoTooltipNoFormat] v očích mnoha lidí ideální [Select_CString( CHARACTER.IsFemale, 'jeptišku', 'mnicha' )]."
 nick_the_noble: "[Select_CString( CHARACTER.IsFemale, 'Ušlechtilá', 'Ušlechtilý' )]"
 nick_the_noble_desc: "Ačkoli je na světě mnoho šlechticů, jen málokdo ztělesňuje ideály ušlechtilosti tak dokonale jako [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_old: "[Select_CString( CHARACTER.IsFemale, 'Stará', 'Starý' )]"
 nick_the_old_desc: "Lidé nezřídka vítají [CHARACTER.GetShortUINameNoTooltipNoFormat] s údivem, že je stále naživu."
 nick_the_pious: "[Select_CString( CHARACTER.IsFemale, 'Pobožná', 'Pobožný' )]"
 nick_the_pious_desc: "Horlivost [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] a oddanost [CHARACTER.GetFaith.GetName] jsou považovány za známku hluboké a inspirující zbožnosti."
 nick_the_proud: "[Select_CString( CHARACTER.IsFemale, 'Pyšná', 'Pyšný' )]"
 nick_the_proud_desc: "Většina šlechticů se naučí za všech okolností držet záda zpříma, málokdo je na to však tak pyšný jako [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_quarreller: "[Select_CString( CHARACTER.IsFemale, 'Svárlivá', 'Svárlivý' )]"
 nick_the_quarreller_desc: "Za moudré se považuje nezačínat rozhovor s [CHARACTER.GetShortUINameNoTooltipNoFormat], nemáš-li několik hodin nazbyt. Někdy i několik dní."
 nick_the_restorer: "[Select_CString( CHARACTER.IsFemale, 'Obnovitelka', 'Obnovitel' )]"
 nick_the_restorer_desc: "Když se zdálo, že panství navždy pohltila temnota, #EMP [CHARACTER.GetShortUINameNoTooltipNoFormat]#! [Select_CString( CHARACTER.IsFemale, 'vystoupila', 'vystoupil' )] a přivedl[Select_CString( CHARACTER.IsFemale, 'a', '' )] je zpět na světlo."
 nick_the_saint: "[Select_CString( CHARACTER.IsFemale, 'Svatá', 'Svatý' )]"
 nick_the_saint_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'vešla', 'vešel' )] do dějin [CHARACTER.GetFaith.GetName] jako jeden z vůbec nejpožehnanějších příslušníků této víry."
 nick_the_scholar: "[Select_CString( CHARACTER.IsFemale, 'Učená', 'Učený' )]"
 nick_the_scholar_desc: "Moudrost a vědomosti [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] jsou součástí učení nejedné věhlasné akademie."
 nick_the_silent: "[Select_CString( CHARACTER.IsFemale, 'Mlčenlivá', 'Mlčenlivý' )]"
 nick_the_silent_desc: "Mlčení je zlato a [CHARACTER.GetShortUINameNoTooltipNoFormat] ho má na rozdávání."
 nick_the_stammerer: "[Select_CString( CHARACTER.IsFemale, 'Koktavá', 'Koktavý' )]"
 nick_the_stammerer_desc: "Slova, které přednáší [CHARACTER.GetShortUINameNoTooltipNoFormat] mohou být výmluvná, jejich přednes však zanechává mnoho otázek."
 nick_the_stranger: "[Select_CString( CHARACTER.IsFemale, 'Cizinka', 'Cizinec' )]"
 nick_the_stranger_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'přišla', 'přišel' )] do svého panství zdaleka a mnohé [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] způsoby dodnes působí podivně a cize."
 nick_the_strong: "[Select_CString( CHARACTER.IsFemale, 'Silná', 'Silný' )]"
 nick_the_strong_desc: "Širý svět věří, že [CHARACTER.GetShortUINameNoTooltipNoFormat] dokáže drtit kameny. Vlastními zuby."
 nick_the_troubadour: "[Select_CString( CHARACTER.IsFemale, 'Trubadúrka', 'Trubadúr' )]"
 nick_the_troubadour_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] krásným zpěvem a zálibou v hudbě. Alespoň mezi těmi, kteří [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] mají rádi."
 nick_the_unready: "[Select_CString( CHARACTER.IsFemale, 'Nerozhodná', 'Nerozhodný' )]"
 nick_the_unready_desc: "Jen málokterý konflikt či rozhovor [CHARACTER.GetShortUINameNoTooltipNoFormat] zcela nezaskočí."
 nick_the_unready_anglo_saxon: "$nick_the_unready$"
 nick_the_unready_anglo_saxon_desc: "Jméno [CHARACTER.GetShortUINameNoTooltipNoFormat] lze doslova přeložit jako „Urozená rada“. Proto [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] nemálo rozčiluje přízvisko $E_thelrE_d$-Unræd neboli „Urozená rada bez rady“. Patrně někomu připadala tato slovní hříčka vtipná."
 nick_the_usurper: "[Select_CString( CHARACTER.IsFemale, 'Uchvatitelka', 'Uchvatitel' )]"
 nick_the_usurper_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'svrhla', 'svrhl' )] právoplatného lenního pána svého panství a ostřím meče se [Select_CString( CHARACTER.IsFemale, 'zmocnila', 'zmocnil' )] vlády, která [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] nenáležela."
 nick_the_victorious: "[Select_CString( CHARACTER.IsFemale, 'Vítězná', 'Vítězný' )]"
 nick_the_victorious_desc: "Vítězství přichází k [CHARACTER.GetShortUINameNoTooltipNoFormat] zcela přirozeně a svět s tím souhlasí."
 nick_the_viking: "[Select_CString( CHARACTER.IsFemale, 'Vikingka', 'Viking' )]"
 nick_the_viking_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] vždy [Select_CString( CHARACTER.IsFemale, 'považovala', 'považoval' )] vlastnictví za poněkud tvárnější pojem než většina lidí."
 nick_the_young: "[Select_CString( CHARACTER.IsFemale, 'Mladá', 'Mladý' )]"
 nick_the_young_desc: "Už v mládí si [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString( CHARACTER.IsFemale, 'vydobyla', 'vydobyl' )] věhlas a uznání. Bez ohledu na to, kolik let uplyne, toto přízvisko [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] už nejspíš zůstane."
 nick_the_younger: "Mladší"
 nick_the_younger_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] má tu smůlu, že sdílí jméno s jinou významnou osobou, a navždy tak [Select_CString( CHARACTER.IsFemale, 'zůstala odsunuta', 'zůstal odsunut' )] do role [CHARACTER.GetFirstName] #EMP $nick_the_younger$#!."
 nick_whiteshirt: "Bílá košile"
 nick_whiteshirt_desc: "Lidé se [CHARACTER.GetShortUINameNoTooltipNoFormat] často ptají, proč [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] říkají $nick_whiteshirt$. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se jen usměje."
 nick_the_cannibal: "[Select_CString( CHARACTER.IsFemale, 'Lidožroutka', 'Lidožrout' )]"
 nick_the_cannibal_desc: "Jen málokdo snese úsměv [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] s odhalenými zuby, zvláště když po nich stéká čerstvá krev."
 nick_the_dragon: "[Select_CString( CHARACTER.IsFemale, 'Dračice', 'Drak' )]"
 nick_the_dragon_desc: "$nick_the_dragoness_desc$"
 nick_the_devourer: "[Select_CString( CHARACTER.IsFemale, 'Požíračka', 'Požírač' )]"
 nick_the_devourer_desc: "Svět se chvěje při pomyšlení, kolik životů již zmizelo v bezedném chřtánu [CHARACTER.GetShortUINameNoTooltipNoFormat]..."
 nick_the_bewitched: "[Select_CString( CHARACTER.IsFemale, 'Očarovaná', 'Očarovaný' )]"
 nick_the_bewitched_desc: "Přízeň [CHARACTER.GetFaith.HighGodName] je pryč a kletba [CHARACTER.GetFaith.WitchGodName] dopadla na [CHARACTER.GetShortUINameNoTooltipNoFormat]. Lidé proto o [Select_CString( CHARACTER.IsFemale, 'ní', 'něm' )] často mluví s lítostí."
 nick_the_witch: "[Select_CString( CHARACTER.IsFemale, 'Čarodějnice', 'Čaroděj' )]"
 nick_the_witch_desc: "O [CHARACTER.GetShortUINameNoTooltipNoFormat] se soudí, že se stýká s podivnými silami za závojem všednosti."
 nick_the_unfaithful: "[Select_CString( CHARACTER.IsFemale, 'Nevěrná', 'Nevěrný' )]"
 nick_the_unfaithful_desc: "Manželské sliby jsou podle [Select_CString( CHARACTER.IsFemale, 'jejího', 'jeho' )] názoru spíše... manželskými doporučeními."
 nick_the_unchaste: "[Select_CString( CHARACTER.IsFemale, 'Necudná', 'Necudný' )]"
 nick_the_unchaste_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] má pověst [Select_CString( CHARACTER.IsFemale, 'chlípné smilnice', 'chlípného smilníka' )] oddávajícího se rozkoším mimo manželství."
 nick_the_beguiling: "Okouzlující"
 nick_the_beguiling_desc: "Říká se, že jediný nesmělý pohled [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] dokáže vyvolat... podlamování kolen."
 nick_the_temptress: "[Select_CString( CHARACTER.IsFemale, 'Pokušitelka', 'Pokušitel' )]"
 nick_the_temptress_desc: "Na jediný pokyn křivého prstu [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] se chytí šlechtic i nuzák."
 nick_the_seductress: "Svůdnice"
 nick_the_seductress_desc: "Úsměv vydá za tisíc slov, nejspíš takových, která by ve slušné společnosti ani nešlo vyslovit."
 nick_the_lewd: "[Select_CString( CHARACTER.IsFemale, 'Chlípná', 'Chlípný' )]"
 nick_the_lewd_desc: "Poznámky, vystupování a občasná prudká gesta [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] jsou přinejlepším nepokrytá."
 nick_the_lecher: "[Select_CString( CHARACTER.IsFemale, 'Smilnice', 'Smilník' )]"
 nick_the_lecher_desc: "Lidé, po kterých [CHARACTER.GetShortUINameNoTooltipNoFormat] touží, si buď zvyknou na [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] slintání, nebo odejdou."
 nick_the_seducer: "Svůdce"
 nick_the_seducer_desc: "$nick_the_seductress_desc$"
 nick_the_shadow: "Stín"
 nick_the_shadow_desc: "Povídá se, že kamkoli padne tma, tam má [CHARACTER.GetShortUINameNoTooltipNoFormat] své ucho."
 nick_the_whisperer: "[Select_CString( CHARACTER.IsFemale, 'Našeptávačka', 'Našeptávač' )]"
 nick_the_whisperer_desc: "Toto přízvisko získal[Select_CString( CHARACTER.IsFemale, 'a', '' )] proto, že tráví šeptáním více času, než se sluší."
 nick_the_spider: "[Select_CString( CHARACTER.IsFemale, 'Pavoučice', 'Pavouk' )]"
 nick_the_spider_desc: "U dvora se měj na pozoru, říkají lidé. Kamkoli se vydáš, všude najdeš $nick_the_spider$."
 nick_the_fox: "[Select_CString( CHARACTER.IsFemale, 'Liška', 'Lišák' )]"
 nick_the_fox_desc: "Lstivost, bystrost a ctižádost možná nejsou rytířskými ctnostmi, ale #EMP účinné#! rozhodně jsou."
 nick_the_shrewd: "[Select_CString( CHARACTER.IsFemale, 'Prozíravá', 'Prozíravý' )]"
 nick_the_shrewd_desc: "Je moudré nikdy nehrát s [CHARACTER.GetShortUINameNoTooltipNoFormat] karty. Jen málokdo si může být jistý, co skrývá v rukávu."
 nick_the_gracious: "[Select_CString( CHARACTER.IsFemale, 'Milostivá', 'Milostivý' )]"
 nick_the_gracious_desc: "Dobré způsoby, vznešené vystupování a důstojná shovívavost činí z [CHARACTER.GetShortUINameNoTooltipNoFormat] vítaného hosta u většiny stolů."
 nick_the_magnanimous: "[Select_CString( CHARACTER.IsFemale, 'Velkomyslná', 'Velkomyslný' )]"
 nick_the_magnanimous_desc: "Nikdo nemůže tvrdit, že by [CHARACTER.GetShortUINameNoTooltipNoFormat] nechal[Select_CString( CHARACTER.IsFemale, 'a', '' )] slíbený dar nevěnovaný."
 nick_the_architect: "[Select_CString( CHARACTER.IsFemale, 'Stavitelka', 'Stavitel' )]"
 nick_the_architect_desc: "Většina lidí vidí v hromadě cihel a trámů jen práci pro nádeníky. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] v ní vidí #EMP možnosti#!."
 nick_the_wise: "[Select_CString( CHARACTER.IsFemale, 'Moudrá', 'Moudrý' )]"
 nick_the_wise_desc: "Za rozumné se považuje požádat [CHARACTER.GetShortUINameNoTooltipNoFormat] o názor, podaří-li se [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] přesvědčit, aby jej vyslovil[Select_CString( CHARACTER.IsFemale, 'a', '' )]."
 nick_the_impaler: "[Select_CString( CHARACTER.IsFemale, 'Napichovačka', 'Napichovač' )]"
 nick_the_impaler_desc: "Způsoby, jimiž [CHARACTER.GetShortUINameNoTooltipNoFormat] vykonává spravedlnost, mohou být kruté, ale míra opakování zločinů je #EMP skutečně#! nízká."
 nick_the_tormentor: "[Select_CString( CHARACTER.IsFemale, 'Trýznitelka', 'Trýznitel' )]"
 nick_the_tormentor_desc: "Většina lidí by raději zemřela na čepeli biřice, než aby se nechala odvést do kobek [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_depraved: "[Select_CString( CHARACTER.IsFemale, 'Zvrhlá', 'Zvrhlý' )]"
 nick_the_depraved_desc: "Slušní lidé si šeptají, že touhy [CHARACTER.GetShortUINameNoTooltipNoFormat] jsou nepřirozené. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] je považuje pouze za #EMP vytříbené#!."
 nick_the_monster: "Netvor"
 nick_the_monster_desc: "Rolníci považují [CHARACTER.GetShortUINameNoTooltipNoFormat] za ghúla, krvežíznivou noční můru, která přišla vysávat morek z kostí jejich dětí. Snad se mýlí."
 nick_the_wicked: "[Select_CString( CHARACTER.IsFemale, 'Ničemná', 'Ničemný' )]"
 nick_the_wicked_desc: "[CHARACTER.GetFaith.GetName] ukládá mnoho omezení a [CHARACTER.GetShortUINameNoTooltipNoFormat] je obvykle porušuje jedno za druhým."
 nick_the_accursed: "[Select_CString( CHARACTER.IsFemale, 'Prokletá', 'Prokletý' )]"
 nick_the_accursed_desc: "Jen málokterý [CHARACTER.GetFaith.PriestNeuter] dokáže vyslovit jméno [CHARACTER.GetShortUINameNoTooltipNoFormat], aniž by je vyplivl do prachu."
 nick_priest_hater: "[Select_CString( CHARACTER.IsFemale, 'Nepřítelkyně kněží', 'Nepřítel kněží' )]"
 nick_priest_hater_desc: "Odpor [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] k duchovenstvu je všeobecně známý a díky gramotnosti kněží také důkladně zaznamenaný."
 nick_priest_eater: "[Select_CString( CHARACTER.IsFemale, 'Požíračka kněží', 'Požírač kněží' )]"
 nick_priest_eater_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nemá na duchovenstvu [Select_CString( CHARACTER.IsFemale, 'ráda', 'rád' )] vůbec nic kromě jeho chuti."
 nick_the_able: "[Select_CString( CHARACTER.IsFemale, 'Schopná', 'Schopný' )]"
 nick_the_able_desc: "Vládnout panství? Vést bitvu? Uvařit jídlo? Utišit dítě? Navrhnout stavbu? Vytrhnout zub? Když se [CHARACTER.GetShortUINameNoTooltipNoFormat] do něčeho pustí, jen máloco nezvládne. Specializace je koneckonců pro hmyz."
 nick_the_mad: "[Select_CString( CHARACTER.IsFemale, 'Šílená', 'Šílený' )]"
 nick_the_mad_desc: "Kdyby ostatní věděli to, co ví [CHARACTER.GetShortUINameNoTooltipNoFormat], smáli by se také. Celý tento život je jen hrou jakéhosi šíleného boha."
 nick_the_ruthless: "[Select_CString( CHARACTER.IsFemale, 'Nelítostná', 'Nelítostný' )]"
 nick_the_ruthless_desc: "Ne každý má sílu udělat to, co je třeba. Ne každý, ale [CHARACTER.GetShortUINameNoTooltipNoFormat] ano."
 nick_the_simple: "[Select_CString( CHARACTER.IsFemale, 'Prostá', 'Prostý' )]"
 nick_the_simple_desc: "Myšlenky [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] lze nejlépe popsat jako „blaženě nezatížené“."
 nick_the_leper: "[Select_CString( CHARACTER.IsFemale, 'Malomocná', 'Malomocný' )]"
 nick_the_leper_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nikdy nemůže zapomenout na zhoubnou nemoc, která pomalu požírá [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] tělo. Svět [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] ji však stejně rád připomíná."
 nick_half_hand: "[Select_CString( CHARACTER.IsFemale, 'Poloruká', 'Poloruký' )]"
 nick_half_hand_desc: "Některé příběhy tvrdí, že [CHARACTER.GetShortUINameNoTooltipNoFormat] chybí prst, jiné celá polovina ruky a další, že má paži podélně rozťatou až k lokti. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] se k tomu nerad[Select_CString( CHARACTER.IsFemale, 'a', '' )] vyjadřuje."
 nick_the_hideous: "[Select_CString( CHARACTER.IsFemale, 'Ohyzdná', 'Ohyzdný' )]"
 nick_the_hideous_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] má tvář, kterou snad dokáže milovat alespoň vlastní matka."
 nick_the_frog: "[Select_CString( CHARACTER.IsFemale, 'Žába', 'Žabák' )]"
 nick_the_frog_desc: "Rysy [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] mají cosi obojživelného. Méně #EMP zdvořilá#! přirovnání se obvykle pronášejí jen mimo doslech."
 nick_the_repulsive: "[Select_CString( CHARACTER.IsFemale, 'Odpudivá', 'Odpudivý' )]"
 nick_the_repulsive_desc: "Když je nablízku [CHARACTER.GetShortUINameNoTooltipNoFormat], přelidnění bývá problémem jen málokdy."
 nick_the_frail: "[Select_CString( CHARACTER.IsFemale, 'Křehká', 'Křehký' )]"
 nick_the_frail_desc: "O kostech [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] se často říká, že jsou ze skla. Přinejmenším se stejně snadno lámou."
 nick_the_weak: "[Select_CString( CHARACTER.IsFemale, 'Slabá', 'Slabý' )]"
 nick_the_weak_desc: "Některé vychloubačné děti tvrdí, že by dokázaly [CHARACTER.GetShortUINameNoTooltipNoFormat] porazit v zápase. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] by tuto domněnku raději neověřoval[Select_CString( CHARACTER.IsFemale, 'a', '' )]."
 nick_the_brute: "[Select_CString( CHARACTER.IsFemale, 'Surovkyně', 'Surovec' )]"
 nick_the_brute_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se násilí nikdy nevyhýbá a mezi tělesnou, společenskou a duševní újmou příliš nerozlišuje. Nakonec přece všechno bolí stejně."
 nick_the_bear: "[Select_CString( CHARACTER.IsFemale, 'Medvědice', 'Medvěd' )]"
 nick_the_bear_desc: "Chlupatá a hřmotná postava [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] může nahánět strach, třebaže nepochybně ne #EMP každému#!."
 nick_the_terrible: "[Select_CString( CHARACTER.IsFemale, 'Hrozná', 'Hrozný' )]"
 nick_the_terrible_desc: "Když kolem prochází [CHARACTER.GetShortUINameNoTooltipNoFormat], děti pláčou, rolníci se chvějí a mléko kysne. Alespoň se to tvrdí."
 nick_the_tyrant: "[Select_CString( CHARACTER.IsFemale, 'Tyranka', 'Tyran' )]"
 nick_the_tyrant_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] #EMP je#! panstvím a každý, kdo nesouhlasí, pozná, jak panství nakládá se zrádci."
 nick_the_wolf: "[Select_CString( CHARACTER.IsFemale, 'Vlčice', 'Vlk' )]"
 nick_the_wolf_desc: "Lstivost, zuřivost a vznešenost, ale jen málokdy čestnost. [CHARACTER.GetShortUINameNoTooltipNoFormat] by bylo možné popsat i hůře."
 nick_the_benevolent: "[Select_CString( CHARACTER.IsFemale, 'Dobrotivá', 'Dobrotivý' )]"
 nick_the_benevolent_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] dbá na to, aby se při každé příležitosti věnoval[Select_CString( CHARACTER.IsFemale, 'a', '' )] mecenášství a dobročinnosti."
 nick_the_philosopher: "[Select_CString( CHARACTER.IsFemale, 'Filozofka', 'Filozof' )]"
 nick_the_philosopher_desc: "Příroda je plná zvláštností, tajemství a hádanek a [CHARACTER.GetShortUINameNoTooltipNoFormat] o nich s oblibou rozmlouvá. Velmi dlouze."
 nick_the_compassionate: "[Select_CString( CHARACTER.IsFemale, 'Soucitná', 'Soucitný' )]"
 nick_the_compassionate_desc: "Co je podle [CHARACTER.GetShortUINameNoTooltipNoFormat] v životě nejlepší? Spřátelit se s nepřítelem, sledovat, jak jeho nenávist ustupuje, a pocítit radost ze smíření."
 nick_the_theologian: "[Select_CString( CHARACTER.IsFemale, 'Teoložka', 'Teolog' )]"
 nick_the_theologian_desc: "K čemu je život, ne-li ke zkoumání skutečné podstaty [CHARACTER.GetFaith.CreatorName]?"
 nick_the_enlightened: "[Select_CString( CHARACTER.IsFemale, 'Osvícená', 'Osvícený' )]"
 nick_the_enlightened_desc: "Vyšší vzdělání je odměnou samo o sobě, ale být jím proslul[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] je také docela příjemné."
 nick_the_stalwart: "[Select_CString( CHARACTER.IsFemale, 'Neochvějná', 'Neochvějný' )]"
 nick_the_stalwart_desc: "Bez ohledu na bouři, čepele svištící vzduchem či hroby pokrývající zem [CHARACTER.GetShortUINameNoTooltipNoFormat] vytrvá. Musí."
 nick_the_merciless: "[Select_CString( CHARACTER.IsFemale, 'Nemilosrdná', 'Nemilosrdný' )]"
 nick_the_merciless_desc: "Milost se nenabízí ani neočekává. Přátelé považují [CHARACTER.GetShortUINameNoTooltipNoFormat] za [Select_CString( CHARACTER.IsFemale, 'pragmatickou', 'pragmatického' )], nepřátelé za [Select_CString( CHARACTER.IsFemale, 'bezectnou', 'bezectného' )]."
 nick_the_imperious: "[Select_CString( CHARACTER.IsFemale, 'Panovačná', 'Panovačný' )]"
 nick_the_imperious_desc: "Moc dává právo, a jelikož má [CHARACTER.GetShortUINameNoTooltipNoFormat] vždy pravdu, musí dbát na to, aby byl[Select_CString( CHARACTER.IsFemale, 'a', '' )] považován[Select_CString( CHARACTER.IsFemale, 'a', '' )] za mocného vládce."
 nick_the_poet: "[Select_CString( CHARACTER.IsFemale, 'Básnířka', 'Básník' )]"
 nick_the_poet_desc: "Kamkoli se [CHARACTER.GetShortUINameNoTooltipNoFormat] vydá, brzy se ozve rozpačité škrábání brku skládajícího rýmy a verše."
 nick_the_cosmic_poet: "[Select_CString( CHARACTER.IsFemale, 'Kosmická básnířka', 'Kosmický básník' )]"
 nick_the_cosmic_poet_desc: "Hlava [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] je v oblacích a [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] myšlenky mezi hvězdami."
 nick_the_gardener: "[Select_CString( CHARACTER.IsFemale, 'Zahradnice', 'Zahradník' )]"
 nick_the_gardener_desc: "Pro [CHARACTER.GetShortUINameNoTooltipNoFormat] je celý svět zahradou. Pečuj o ni a ona poroste."
 nick_the_mindbreaker: "[Select_CString( CHARACTER.IsFemale, 'Lamačka myslí', 'Lamač myslí' )]"
 nick_the_mindbreaker_desc: "Lidé si s hrůzou šeptají o tom, co se stává těm, kteří zakusí mučitelské úmysly [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_flayer: "[Select_CString( CHARACTER.IsFemale, 'Stahovačka kůží', 'Stahovač kůží' )]"
 nick_the_flayer_desc: "Díky [CHARACTER.GetShortUINameNoTooltipNoFormat] celé panství důvěrně poznalo pravdivost rčení o tajemstvích člověka staženého z kůže."
 nick_the_meticulous: "[Select_CString( CHARACTER.IsFemale, 'Pečlivá', 'Pečlivý' )]"
 nick_the_meticulous_desc: "Pozornost věnovaná detailům je důležitá a její nedostatek svědčí o vadném charakteru. Alespoň podle [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_heartbreaker: "[Select_CString( CHARACTER.IsFemale, 'Lamačka srdcí', 'Lamač srdcí' )]"
 nick_the_heartbreaker_desc: "Říká se, že [CHARACTER.GetShortUINameNoTooltipNoFormat] má [Select_CString( CHARACTER.IsFemale, 'ráda', 'rád' )] trochu nebezpečí."
 nick_the_bully: "[Select_CString( CHARACTER.IsFemale, 'Ukrutnice', 'Ukrutník' )]"
 nick_the_bully_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] si rád[Select_CString( CHARACTER.IsFemale, 'a', '' )] vybírá ty, které považuje za sobě podřadné."
 nick_the_foolish: "[Select_CString( CHARACTER.IsFemale, 'Pošetilá', 'Pošetilý' )]"
 nick_the_foolish_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] svým... #EMP jedinečným#! přístupem k rozhodování."
 nick_the_gullible: "[Select_CString( CHARACTER.IsFemale, 'Důvěřivá', 'Důvěřivý' )]"
 nick_the_gullible_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] důvěřuje ostatním poněkud více, než je pro [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] vlastní dobro zdrávo."
 nick_the_undefeated: "[Select_CString( CHARACTER.IsFemale, 'Neporažená', 'Neporažený' )]"
 nick_the_undefeated_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nebyl[Select_CString( CHARACTER.IsFemale, 'a', '' )] v bitvě nikdy a za žádných okolností poražen[Select_CString( CHARACTER.IsFemale, 'a', '' )] a dosud neokusil[Select_CString( CHARACTER.IsFemale, 'a', '' )] hořkost potupné prohry."
 nick_the_triumphant: "[Select_CString( CHARACTER.IsFemale, 'Vítězoslavná', 'Vítězoslavný' )]"
 nick_the_triumphant_desc: "Když svět zrodil bojovníka, který se prohlašoval za neporaženého, [CHARACTER.GetShortUINameNoTooltipNoFormat] jej svrhl[Select_CString( CHARACTER.IsFemale, 'a', '' )] a rozmetal[Select_CString( CHARACTER.IsFemale, 'a', '' )] jeho legendu."
 nick_the_fury: "Běs"
 nick_the_fury_desc: "Hněv, zášť a #EMP pomsta#! [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] jsou považovány za strašlivou nevyhnutelnost. A skutečně jsou #EMP nevyhnutelné#!."
 nick_feareater: "[Select_CString( CHARACTER.IsFemale, 'Požíračka strachu', 'Požírač strachu' )]"
 nick_feareater_desc: "Strach, nenávist a #EMP hrůza#! nepřátel pohánějí [CHARACTER.GetShortUINameNoTooltipNoFormat] k činům krvežíznivosti a krutosti. K velmi, velmi účinným činům."
 nick_the_hawk: "Jestřáb"
 nick_the_hawk_desc: "Pronikavému zraku [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] unikne jen máloco a zostřeným pařátům vůbec nic."
 nick_the_trustworthy: "[Select_CString( CHARACTER.IsFemale, 'Důvěryhodná', 'Důvěryhodný' )]"
 nick_the_trustworthy_desc: "Pevnost, spolehlivost a sympatická upřímnost patří k přednostem [CHARACTER.GetShortUINameNoTooltipNoFormat], třebaže nepřátelům připadá až překvapivě důvěřiv[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )]."
 nick_the_trustworthy_ironic: "$nick_the_trustworthy$"
 nick_the_trustworthy_ironic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] za celý svůj život doslova nikdy [Select_CString( CHARACTER.IsFemale, 'nevyslovila', 'nevyslovil' )] jedinou lež."
 nick_the_unrelenting: "[Select_CString( CHARACTER.IsFemale, 'Neústupná', 'Neústupný' )]"
 nick_the_unrelenting_desc: "Když si [CHARACTER.GetShortUINameNoTooltipNoFormat] něco vezme do hlavy, dosáhne toho bez ohledu na to, jak dlouho to potrvá."
 nick_the_glorious: "[Select_CString( CHARACTER.IsFemale, 'Slavná', 'Slavný' )]"
 nick_the_glorious_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se nepochybně zapíše do dějin jako jedna z nejmajestátnějších osobností, které kdy kráčely po světě."
 nick_the_ecumenist: "[Select_CString( CHARACTER.IsFemale, 'Ekumenistka', 'Ekumenista' )]"
 nick_the_ecumenist_desc: "Úsilí [CHARACTER.GetShortUINameNoTooltipNoFormat] o sjednocení a usmíření křesťanského světa z [Select_CString( CHARACTER.IsFemale, 'ní', 'něj' )] činí pro mnohé hrdinu, třebaže pro jiné také kacíře."
 nick_the_unifier_of_africa: "[Select_CString( CHARACTER.IsFemale, 'Sjednotitelka Afriky', 'Sjednotitel Afriky' )]"
 nick_the_unifier_of_africa_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] jako první člověk v dějinách sjednotil[Select_CString( CHARACTER.IsFemale, 'a', '' )] známou Afriku pod svou korouhví."
 nick_the_motherfather_of_spain: "[Select_CString( CHARACTER.IsFemale, 'Matka Španělska', 'Otec Španělska' )]"
 nick_the_motherfather_of_spain_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] spojil[Select_CString( CHARACTER.IsFemale, 'a', '' )] několik nesourodých iberských království v jeden pevný celek, Španělsko."
 nick_the_ladylord_of_the_ganges: "[Select_CString( CHARACTER.IsFemale, 'Paní Gangy', 'Pán Gangy' )]"
 nick_the_ladylord_of_the_ganges_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je posvátným ochráncem #EMP nejposvátnější#! řeky světa."
 nick_the_wend: "[Select_CString( CHARACTER.IsFemale, 'Vendka', 'Vend' )]"
 nick_the_wend_desc: "Poté, co [CHARACTER.GetShortUINameNoTooltipNoFormat] sjednotil[Select_CString( CHARACTER.IsFemale, 'a', '' )] nesourodá západoslovanská království, stal[Select_CString( CHARACTER.IsFemale, 'a', '' )] se legendou už za svého života."
 nick_the_crowned: "[Select_CString( CHARACTER.IsFemale, 'Korunovaná', 'Korunovaný' )]"
 nick_the_crowned_desc: "Koruny samozřejmě existovaly i před korunou [CHARACTER.GetShortUINameNoTooltipNoFormat], ale #EMP ty#! se sotva počítají."
 nick_the_bogatyr: "Bohatýr"
 nick_the_bogatyr_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] úspěšným sjednocením všech slovanských národů."
 nick_the_polyanitsa: "Poljanice"
 nick_the_polyanitsa_desc: "$nick_the_bogatyr_desc$"
 nick_the_dane: "[Select_CString( CHARACTER.IsFemale, 'Dánka', 'Dán' )]"
 nick_the_dane_desc: "Svět zná [CHARACTER.GetShortUINameNoTooltipNoFormat] jako nechvalně proslulého Skandinávce. O jakého #EMP přesně#!, to už nikoho příliš nezajímá."
 nick_pendragon: "Pendragon"
 nick_pendragon_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se při prosazování svého nároku na Británii opřel[Select_CString( CHARACTER.IsFemale, 'a', '' )] o... #EMP prastaré#! legendy."
 nick_the_tuatha_de_danann: "Tuatha Dé Danann"
 nick_the_tuatha_de_danann_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se při prosazování svého nároku na Británii opřel[Select_CString( CHARACTER.IsFemale, 'a', '' )] o prastaré legendy."
 nick_the_sword_of_god: "Meč Boží"
 nick_the_sword_of_god_desc: "Jako vyvolená zbraň spravedlivého Pána vytesal[Select_CString( CHARACTER.IsFemale, 'a', '' )] [CHARACTER.GetShortUINameNoTooltipNoFormat] $e_outremer$ ze zemí nevěřících."
 nick_the_messenger_of_christ: "[Select_CString( CHARACTER.IsFemale, 'Poselkyně Kristova', 'Posel Kristův' )]"
 nick_the_messenger_of_christ_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] přinesl[Select_CString( CHARACTER.IsFemale, 'a', '' )] slovo Beránka Božího všem obyvatelům $e_outremer$."
 nick_the_maiden_of_virgin: "Dívka Panny Marie"
 nick_the_maiden_of_virgin_desc: "Čistota [CHARACTER.GetShortUINameNoTooltipNoFormat] je stejně proslulá jako čistota samotné blahoslavené Matky Boží."
 nick_the_knight_of_gabriel: "[Select_CString( CHARACTER.IsFemale, 'Rytířka Gabrielova', 'Rytíř Gabrielův' )]"
 nick_the_knight_of_gabriel_desc: "Jako planoucí meč Božího anděla pomsty vybudoval[Select_CString( CHARACTER.IsFemale, 'a', '' )] [CHARACTER.GetShortUINameNoTooltipNoFormat] $e_outremer$ cihlu po krvavé cihle."
 nick_the_shepherd: "[Select_CString( CHARACTER.IsFemale, 'Pastýřka', 'Pastýř' )]"
 nick_the_shepherd_desc: "Ať už Boží vyvolení zabloudí kamkoli, [CHARACTER.GetShortUINameNoTooltipNoFormat] jim pomůže bezpečně nalézt cestu domů."
 nick_the_judge: "[Select_CString( CHARACTER.IsFemale, 'Soudkyně', 'Soudce' )]"
 nick_the_judge_desc: "$k_israel$ v průběhu dějin volal po spravedlivých a poctivých soudcích. Někdy je mezi nimi připomínán[Select_CString( CHARACTER.IsFemale, 'a', '' )] také [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_saoshyant: "Saošjant"
 nick_the_saoshyant_desc: "Když se zdálo, že celý svět pohltil [CHARACTER.GetFaith.DevilName], [CHARACTER.GetShortUINameNoTooltipNoFormat] povstal[Select_CString( CHARACTER.IsFemale, 'a', '' )], aby navrátil[Select_CString( CHARACTER.IsFemale, 'a', '' )] Světlo."
 nick_the_timely_rain: "Déšť v pravý čas"
 nick_the_timely_rain_desc: "Štědrost ducha a úctyhodné vystupování slouží [CHARACTER.GetShortUINameNoTooltipNoFormat] ke cti."
 nick_the_jade_unicorn: "Nefritový jednorožec"
 nick_the_jade_unicorn_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je považován[Select_CString( CHARACTER.IsFemale, 'a', '' )] za nepřemožitelného bojovníka s holí."
 nick_the_wizard: "[Select_CString( CHARACTER.IsFemale, 'Čarodějka', 'Čaroděj' )]"
 nick_the_wizard_desc: "Lidé se často natolik soustředí na podivné vnímání času [CHARACTER.GetShortUINameNoTooltipNoFormat], že zapomínají na [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] ďábelské triky."
 nick_the_big_halberd: "Velká halapartna"
 nick_the_panther_head: "Panteří hlava"
 nick_the_panther_head_desc: "Kruté pronikavé oči, ježaté vousy a kočičí vrčení vynesly [CHARACTER.GetShortUINameNoTooltipNoFormat] toto přízvisko více než zaslouženě."
 nick_the_thunderbolt: "Hromoklín"
 nick_the_thunderbolt_desc: "Říká se, že nepřátelé zaslechnou [CHARACTER.GetShortUINameNoTooltipNoFormat] teprve poté, co už udeřil[Select_CString( CHARACTER.IsFemale, 'a', '' )]."
 nick_the_whirlwind: "Vichřice"
 nick_the_whirlwind_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] útočí tvrdě, rychle a především nepředvídatelně."
 nick_the_beautiful_beard: "Krásnovous"
 nick_the_beautiful_beard_desc: "Ta bohatost, ty kadeře, ta omamná vůně. Může se snad někdo na světě pochlubit tak majestátním vousem jako [CHARACTER.GetShortUINameNoTooltipNoFormat]?"
 nick_the_tattooed_monk: "[Select_CString( CHARACTER.IsFemale, 'Tetovaná jeptiška', 'Tetovaný mnich' )]"
 nick_the_tattooed_monk_desc: "Ohromná síla [CHARACTER.GetShortUINameNoTooltipNoFormat] může být legendární, ale [Select_CString( CHARACTER.IsFemale, 'těší ji', 'těší ho' )], že si lidé nejprve vybaví [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] vkusné tetování."
 nick_the_pilgrim: "[Select_CString( CHARACTER.IsFemale, 'Poutnice', 'Poutník' )]"
 nick_the_pilgrim_desc: "Jen málokdo putuje tak daleko a tolika směry jako [CHARACTER.GetShortUINameNoTooltipNoFormat]. Dobře však ví, že chce-li skutečně porozumět [CHARACTER.GetFaith.GetName], musí poznat jeho nejsvětější místa i nesčetné podoby."
 nick_the_black_whirlwind: "Černá vichřice"
 nick_the_black_whirlwind_desc: "Pohled [CHARACTER.GetShortUINameNoTooltipNoFormat] zasévá strach do lidských srdcí."
 nick_the_unrestrained: "[Select_CString( CHARACTER.IsFemale, 'Nezkrotná', 'Nezkrotný' )]"
 nick_the_unrestrained_desc: "Přízvisko [CHARACTER.GetShortUINameNoTooltipNoFormat] odkazuje stejnou měrou na [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] nevázaný jazyk i schopnost uniknout věznitelům."
 nick_the_winged_tiger: "Okřídlený tygr"
 nick_the_winged_tiger_desc: "Divokosti [CHARACTER.GetShortUINameNoTooltipNoFormat] se vyrovná jedině výška [Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' )] skoků."
 nick_the_turbulent_river_dragon: "Drak bouřlivých řek"
 nick_the_turbulent_river_dragon_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se ve vodách a mokřadech pohybuje jako... drak."
 nick_the_wild: "[Select_CString( CHARACTER.IsFemale, 'Divoká', 'Divoký' )]"
 nick_the_wild_desc: "Šílený pohled, pomatené skutky a běsnění na bojišti."
 nick_the_ferocious_giant: "[Select_CString( CHARACTER.IsFemale, 'Zuřivá obryně', 'Zuřivý obr' )]"
 nick_the_ferocious_giant_desc: "Přízvisko [CHARACTER.GetShortUINameNoTooltipNoFormat] možná není poetické, jeho výstižnost však může zpochybnit jen málokdo."
 nick_the_prodigy: "Génius"
 nick_the_prodigy_desc: "Jako proslulý polyhistor projevuje [CHARACTER.GetShortUINameNoTooltipNoFormat] mimořádné nadání téměř ve všem, do čeho se pustí."
 nick_the_defender_of_highgod: "Štít [CHARACTER.GetFaith.HighGodName]"
 nick_the_defender_of_highgod_desc: "[CHARACTER.GetFaith.GetName] má ve smrtelném světě jen málo ochránců, kteří by se vyrovnali [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_blood_motherfather: "[Select_CString( CHARACTER.IsFemale, 'Krvavá matka', 'Krvavý otec' )]"
 nick_the_blood_motherfather_desc: "Lidé vyslovují přízvisko [CHARACTER.GetShortUINameNoTooltipNoFormat] se strachem a úžasem. Jen zvláštní druh [CHARACTER.Custom('MatriarchPatriarch')] dokáže zacházet se svou rodinou tak jako [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_divine: "[Select_CString( CHARACTER.IsFemale, 'Božská', 'Božský' )]"
 nick_the_divine_desc: "Jen málokdo, kdo slyšel o [CHARACTER.GetShortUINameNoTooltipNoFormat], si může myslet něco jiného. Vždyť se [Select_CString( CHARACTER.IsFemale, 'jí', 'ho' )] božství přinejmenším muselo dotknout."
 nick_the_anointed: "[Select_CString( CHARACTER.IsFemale, 'Pomazaná', 'Pomazaný' )]"
 nick_the_anointed_desc: "Rolníci si šeptají, že [CHARACTER.GetFaith.HighGodName] vybral [CHARACTER.GetShortUINameNoTooltipNoFormat], aby ve smrtelném světě vykonal[Select_CString( CHARACTER.IsFemale, 'a', '' )] jeho dílo."
 nick_the_stupor_mundi: "Stupor Mundi"
 nick_the_stupor_mundi_desc: "Možná je to trochu domýšlivé, ale... čím jiným je [CHARACTER.GetShortUINameNoTooltipNoFormat], ne-li Divem světa?"
 nick_the_glass: "[Select_CString( CHARACTER.IsFemale, 'Skleněná žena', 'Skleněný muž' )]"
 nick_the_glass_desc: "Posedlost [CHARACTER.GetShortUINameNoTooltipNoFormat] stavbou podivných skleněných přístřešků je stejně často probíraná jako nepochopitelná."
 nick_the_trojan: "[Select_CString( CHARACTER.IsFemale, 'Trójanka', 'Trójan' )]"
 nick_the_trojan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se vyrovnal[Select_CString( CHARACTER.IsFemale, 'a', '' )] činům dávného Corinea a obnovil[Select_CString( CHARACTER.IsFemale, 'a', '' )] pravého dědice Tróje, Dumnonii."
 nick_the_butcher: "[Select_CString( CHARACTER.IsFemale, 'Řeznice', 'Řezník' )]"
 nick_the_butcher_desc: "Maso jako maso. Nakonec všechno přestane křičet."
 nick_the_fishy: "Rybí"
 nick_the_fishy_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se #EMP zkrátka nedokáže#! zbavit řečí o rybím zápachu, který se kolem [Select_CString( CHARACTER.IsFemale, 'ní', 'něj' )] občas vznáší."
 nick_blue_snake: "Modrý had"
 nick_blue_snake_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] na otázky ohledně svého přízviska neodpovídá."
 nick_the_loyal: "[Select_CString( CHARACTER.IsFemale, 'Věrná', 'Věrný' )]"
 nick_the_loyal_desc: "Ať prší, či svítí slunce a ať se stane cokoli, přátelé vědí, že [CHARACTER.GetShortUINameNoTooltipNoFormat] bude stát při nich."
 nick_troublemaker: "[Select_CString( CHARACTER.IsFemale, 'Potížistka', 'Potížista' )]"
 nick_troublemaker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] svými názory, postřehy a hlasitostí."
 nick_the_seer: "[Select_CString( CHARACTER.IsFemale, 'Věštkyně', 'Věštec' )]"
 nick_the_seer_desc: "Vidět znamená věřit, ale kdo sám vidět nedokáže, musí vyhledat někoho, jako je [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_timid: "[Select_CString( CHARACTER.IsFemale, 'Bázlivá', 'Bázlivý' )]"
 nick_the_timid_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je mírné, až lekavé povahy a přímé střety nesnáší dobře."
 nick_the_red: "[Select_CString( CHARACTER.IsFemale, 'Rudá', 'Rudý' )]"
 nick_the_red_desc: "Ohnivě rudých vlasů [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] si všimne téměř každý. Podle [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] zkušenosti až únavně často."
 nick_the_truthspeaker: "[Select_CString( CHARACTER.IsFemale, 'Pravdomluvná', 'Pravdomluvný' )]"
 nick_the_truthspeaker_desc: "Bez ohledu na závažnost věci každý ví, že se může spolehnout na čestnost a zásadovost [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_curthose: "Krátké kalhoty"
 nick_the_curthose_desc: "V dětství říkal otec [CHARACTER.GetShortUINameNoTooltipNoFormat] „Krátké kalhoty“. Ani v dospělosti nedokáže [CHARACTER.GetShortUINameNoTooltipNoFormat] přimět lidi, aby [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] #EMP přestali#! říkat Krátké kalhoty."
 nick_the_deep_minded: "[Select_CString( CHARACTER.IsFemale, 'Hloubavá', 'Hloubavý' )]"
 nick_the_deep_minded_desc: "Lidé hovoří o hlubokých myšlenkách a závažných názorech [CHARACTER.GetShortUINameNoTooltipNoFormat]. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] však nejraději sedí a přemýšlí."
 nick_the_white: "[Select_CString( CHARACTER.IsFemale, 'Bílá', 'Bílý' )]"
 nick_the_white_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] si není jist[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )], zda [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] říkají $nick_the_white$ kvůli bledé pleti, nebo ještě světlejším vlasům. Jsou i horší přízviska."
 nick_wang_khan: "Ongchán"
 nick_wang_khan_desc: "Velká vítězství [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] nad Tatary vedla k tomu, že byl[Select_CString( CHARACTER.IsFemale, 'a', '' )] provolán[Select_CString( CHARACTER.IsFemale, 'a', '' )] králem chánů. Po takovém úspěchu [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] jistě čeká dlouhá a zářná budoucnost."
 nick_the_bard: "[Select_CString( CHARACTER.IsFemale, 'Pěvkyně', 'Pěvec' )]"
 nick_the_bard_desc: "Krásný hlas a obratné prsty činí z [CHARACTER.GetShortUINameNoTooltipNoFormat] celebritu u každého dvora, který poctí svou návštěvou."
 nick_the_bard_ironic: "$nick_the_bard$"
 nick_the_bard_ironic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] říkají „$nick_the_bard$“, protože by [Select_CString( CHARACTER.IsFemale, 'byla', 'byl' )] zábavnější přivázan[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] k boku cválajícího koně než při pokusu zpívat."
 nick_hotspur: "Divous"
 nick_hotspur_desc: "Nepřátelé [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] si šeptají, že při tažení se [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] ostruhy ani nedotknou země, tolik času tráví v sedle a tak zuřivé jsou [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] útoky. Do jisté míry se to projevuje i průměrnou dovedností ve fotbale."
 nick_the_black_adder: "Černá zmije"
 nick_the_black_adder_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] má v zásobě nejeden vychytralý plán, přestože [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] nepřátelé považují za odpornou malou osobu."
 nick_the_inevitable: "[Select_CString( CHARACTER.IsFemale, 'Nevyhnutelná', 'Nevyhnutelný' )]"
 nick_the_inevitable_desc: "Nakonec se vše vždy obrátí ve prospěch [CHARACTER.GetShortUINameNoTooltipNoFormat]. Lidé to pochopí sami, nebo je o tom [CHARACTER.GetShortUINameNoTooltipNoFormat] přesvědčí."
 nick_the_plump: "[Select_CString( CHARACTER.IsFemale, 'Baculka', 'Baculáč' )]"
 nick_the_plump_desc: "Většina lidí říká [CHARACTER.GetShortUINameNoTooltipNoFormat] $nick_the_plump$, protože je na [Select_CString( CHARACTER.IsFemale, 'ní', 'něm' )] zkrátka tolik k milování."
 nick_the_diseased: "[Select_CString( CHARACTER.IsFemale, 'Chorá', 'Chorý' )]"
 nick_the_diseased_desc: "První, co lidé o [CHARACTER.GetShortUINameNoTooltipNoFormat] obvykle zaslechnou, je [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] kašel."
 nick_the_flash: "Blesk [CHARACTER.GetFaith.HighGodName]"
 nick_the_flash_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se snaží nevnímat sebe sama jako Hněv [CHARACTER.GetFaith.HighGodName]. „Blesk“ zní mnohem diplomatičtěji."
 nick_hand: "Nešťastná ruka"
 nick_hand_desc: "Nedostatek štěstí a sklon [CHARACTER.GetShortUINameNoTooltipNoFormat] k rozhodnutím, která se později ukážou jako katastrofální, již občas neušly pozornosti."
 nick_bloody: "[Select_CString( CHARACTER.IsFemale, 'Krvavá', 'Krvavý' )]"
 nick_bloody_desc: "Není neobvyklé, aby šlechtic za svůj život zabil několik nepřátel. Někteří se však s obavami ptají, kolik jich musel[Select_CString( CHARACTER.IsFemale, 'a', '' )] zabít #EMP [CHARACTER.GetShortUINameNoTooltipNoFormat]#!, když [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] proslavilo právě to."
 nick_the_oathbreaker: "[Select_CString( CHARACTER.IsFemale, 'Křivopřísežnice', 'Křivopřísežník' )]"
 nick_the_oathbreaker_desc: "Člověk má takovou cenu jako jeho slovo."
 nick_little: "[Select_CString( CHARACTER.IsFemale, 'Malá', 'Malý' )]"
 nick_little_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je možná malé postavy, ale ukrývá v sobě všechen hněv a zuřivost vzteklého rosomáka."
 nick_the_honest: "[Select_CString( CHARACTER.IsFemale, 'Upřímná', 'Upřímný' )]"
 nick_the_honest_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] považuje upřímnost za #EMP vždy#! nejlepší cestu."
 nick_the_passionate: "[Select_CString( CHARACTER.IsFemale, 'Vášnivá', 'Vášnivý' )]"
 nick_the_passionate_desc: "Přátelé a spojenci milují zápal [CHARACTER.GetShortUINameNoTooltipNoFormat], odpůrci si však myslí, že by se měl[Select_CString( CHARACTER.IsFemale, 'a', '' )] uklidnit."
 nick_the_silly: "[Select_CString( CHARACTER.IsFemale, 'Pošetilá', 'Pošetilý' )]"
 nick_the_silly_desc: "Ať už si o tom ostatní myslí cokoli, [CHARACTER.GetShortUINameNoTooltipNoFormat] nikdy nebere život #EMP příliš#! vážně."
 nick_one_eyed: "[Select_CString( CHARACTER.IsFemale, 'Jednooká', 'Jednooký' )]"
 nick_one_eyed_desc: "$nick_monophthalmos_desc$"
 nick_the_trembling: "[Select_CString( CHARACTER.IsFemale, 'Třesavá', 'Třesavý' )]"
 nick_the_trembling_desc: "O [CHARACTER.GetShortUINameNoTooltipNoFormat] se bohužel nedá říct, že by [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] podmanivým šarmem nebo odvážnými výpady."
 nick_the_rash: "[Select_CString( CHARACTER.IsFemale, 'Zbrklá', 'Zbrklý' )]"
 nick_the_rash_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se považuje za přímočarou osobu, širý svět však vidí někoho bezmyšlenkovitého a ukvapeného."
 nick_moneybags: "Měšec"
 nick_moneybags_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] by možná raději nosil[Select_CString( CHARACTER.IsFemale, 'a', '' )] přízvisko „Bohatá“, ale lidé mají na [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] majetek bohužel velmi konkrétní názor."
 nick_the_elegant: "[Select_CString( CHARACTER.IsFemale, 'Elegantní', 'Elegantní' )]"
 nick_the_elegant_desc: "Jemný dotek přináší půvabný výsledek a vytříbený postup buduje kultivovanou pověst."
 nick_the_eager: "[Select_CString( CHARACTER.IsFemale, 'Horlívá', 'Horlívý' )]"
 nick_the_eager_desc: "Nadšení je heslem [CHARACTER.GetShortUINameNoTooltipNoFormat] a elán [Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' )] krédem."
 nick_the_insane: "[Select_CString( CHARACTER.IsFemale, 'Pomatená', 'Pomatený' )]"
 nick_the_insane_desc: "Lidé kolem [CHARACTER.GetShortUINameNoTooltipNoFormat] našlapují po špičkách. Možná oprávněně, možná ne, ale proč riskovat, že urazí šílence?"
 nick_the_sleeper: "[Select_CString( CHARACTER.IsFemale, 'Spáčka', 'Spáč' )]"
 nick_the_sleeper_desc: "Lidé často poznamenávají, že by [CHARACTER.GetShortUINameNoTooltipNoFormat] možná byl[Select_CString( CHARACTER.IsFemale, 'a', '' )] šťastnější jako domácí kočka."
 nick_the_quick: "[Select_CString( CHARACTER.IsFemale, 'Hbitá', 'Hbitý' )]"
 nick_the_quick_desc: "Rychlá mysl, rychlé tělo."
 nick_the_quick_ironic: "$nick_the_quick$"
 nick_the_quick_ironic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] lidem tvrdí, že přízvisko získal[Select_CString( CHARACTER.IsFemale, 'a', '' )] díky bystrému úsudku. Nezískal[Select_CString( CHARACTER.IsFemale, 'a', '' )]."
 nick_the_selfish: "[Select_CString( CHARACTER.IsFemale, 'Sobecká', 'Sobecký' )]"
 nick_the_selfish_desc: "Celý svět ví, že [CHARACTER.GetShortUINameNoTooltipNoFormat] nemyslí na nikoho jiného než #EMP na sebe#!."
 nick_the_worthy: "[Select_CString( CHARACTER.IsFemale, 'Hodná', 'Hodný' )]"
 nick_the_worthy_desc: "Kdo takto [CHARACTER.GetShortUINameNoTooltipNoFormat] posoudil, je předmětem sporů, všichni se však shodují, že jde o skutečně znamenitou osobu."
 nick_the_unworthy: "[Select_CString( CHARACTER.IsFemale, 'Nehodná', 'Nehodný' )]"
 nick_the_unworthy_desc: "Naprosté zklamání jako člověk v teorii i v praxi."
 nick_the_traitor: "[Select_CString( CHARACTER.IsFemale, 'Zrádkyně', 'Zrádce' )]"
 nick_the_traitor_desc: "Slovo [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] má přibližně stejnou cenu jako vzduch, který je nese."
 nick_the_courageous: "[Select_CString( CHARACTER.IsFemale, 'Odvážná', 'Odvážný' )]"
 nick_the_courageous_desc: "Ohněm i plameny bude [CHARACTER.GetShortUINameNoTooltipNoFormat] spolehlivě pokračovat dál."
 nick_the_brilliant: "[Select_CString( CHARACTER.IsFemale, 'Brilantní', 'Brilantní' )]"
 nick_the_brilliant_desc: "Jen málokdo se vyrovná intelektuálnímu nadání [CHARACTER.GetShortUINameNoTooltipNoFormat] a ještě méně lidí má odvahu se o to pokusit."
 nick_the_demon: "Démon"
 nick_the_demon_desc: "[CHARACTER.GetFaith.DevilName|U] by [CHARACTER.GetShortUINameNoTooltipNoFormat] jistě vystavil příznivé doporučení před sněmem [CHARACTER.GetFaith.random_NegativeAfterLife]."
 nick_the_immortal: "[Select_CString( CHARACTER.IsFemale, 'Nesmrtelná', 'Nesmrtelný' )]"
 nick_the_immortal_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] vypadá na svůj věk pozoruhodně mladě."
 nick_the_generous: "[Select_CString( CHARACTER.IsFemale, 'Štědrá', 'Štědrý' )]"
 nick_the_generous_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] by druhému daroval[Select_CString( CHARACTER.IsFemale, 'a', '' )] i košili z vlastních zad, kdyby si ji už nevzal někdo před ním."
 nick_the_diplomat: "[Select_CString( CHARACTER.IsFemale, 'Diplomatka', 'Diplomat' )]"
 nick_the_diplomat_desc: "Mírové řešení lze nalézt pomocí slov a [CHARACTER.GetShortUINameNoTooltipNoFormat] se slovy zachází #EMP velmi#! dobře."
 nick_the_peacemaker: "[Select_CString( CHARACTER.IsFemale, 'Mírotvůrkyně', 'Mírotvůrce' )]"
 nick_the_peacemaker_desc: "Mír stojí za každou cenu."
 nick_the_tactician: "[Select_CString( CHARACTER.IsFemale, 'Taktička', 'Taktik' )]"
 nick_the_tactician_desc: "Strategie může vyžadovat vychytralost, ale taktika vyžaduje důvtip."
 nick_the_overseer: "[Select_CString( CHARACTER.IsFemale, 'Dohlížitelka', 'Dohlížitel' )]"
 nick_the_overseer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] svou... bedlivou pozorností."
 nick_the_guardian: "[Select_CString( CHARACTER.IsFemale, 'Ochránkyně', 'Ochránce' )]"
 nick_the_guardian_desc: "Za deště i slunce, proti příteli či nepříteli stojí [CHARACTER.GetShortUINameNoTooltipNoFormat] vždy při těch, které [Select_CString( CHARACTER.IsFemale, 'přísahala', 'přísahal' )] chránit."
 nick_the_chivalrous: "[Select_CString( CHARACTER.IsFemale, 'Rytířská', 'Rytířský' )]"
 nick_the_chivalrous_desc: "Pro někoho může být čest bezcenná, ale pro [CHARACTER.GetShortUINameNoTooltipNoFormat] není na světě nic drahocennějšího."
 nick_the_valiant: "[Select_CString( CHARACTER.IsFemale, 'Chrabrá', 'Chrabrý' )]"
 nick_the_valiant_desc: "Vůdce, který nekráčí v čele, není žádným vůdcem."
 nick_the_deceiver: "[Select_CString( CHARACTER.IsFemale, 'Klamářka', 'Klamář' )]"
 nick_the_deceiver_desc: "Proč plýtvat drahou ocelí a krví, když jsou slova zadarmo?"
 nick_the_crow: "Vrána"
 nick_the_crow_desc: "Ti, kteří mají [CHARACTER.GetShortUINameNoTooltipNoFormat] rádi, tvrdí, že přízvisko odkazuje na bystrou mysl a pronikavý zrak. Ostatní říkají, že se kolem [Select_CString( CHARACTER.IsFemale, 'ní', 'něj' )] drží smrt."
 nick_the_trickster: "[Select_CString( CHARACTER.IsFemale, 'Šibalka', 'Šibal' )]"
 nick_the_trickster_desc: "Vyprávěl[Select_CString( CHARACTER.IsFemale, 'a', '' )] by snad #EMP [CHARACTER.GetShortUINameNoTooltipNoFormat]#! opravdu tak nestydaté lži, jaké o [Select_CString( CHARACTER.IsFemale, 'ní', 'něm' )] vyprávějí ostatní?"
 nick_the_chronicler: "[Select_CString( CHARACTER.IsFemale, 'Kronikářka', 'Kronikář' )]"
 nick_the_chronicler_desc: "Budoucí pokolení budou jistě vděčná za pečlivost, s níž [CHARACTER.GetShortUINameNoTooltipNoFormat] vše zaznamenává."
 nick_the_truthseeker: "[Select_CString( CHARACTER.IsFemale, 'Hledačka pravdy', 'Hledač pravdy' )]"
 nick_the_truthseeker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je znám[Select_CString( CHARACTER.IsFemale, 'á', '' )] neúnavným hledáním pravdy bez ohledu na to, kam vede a jakou cenu si vyžádá."
 nick_the_sage: "[Select_CString( CHARACTER.IsFemale, 'Mudrkyně', 'Mudrc' )]"
 nick_the_sage_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je učen[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] a ochotně předává své znalosti mladým."
 nick_the_historian: "[Select_CString( CHARACTER.IsFemale, 'Historička', 'Historik' )]"
 nick_the_historian_desc: "Kdo se z dějin ani nepokusí poučit, je odsouzen je opakovat."
 nick_the_sly: "[Select_CString( CHARACTER.IsFemale, 'Prohnaná', 'Prohnaný' )]"
 nick_the_sly_desc: "Hmm? Ten pohled? To nic není. Nedělej si s tím starosti."
 nick_the_cucumber_king: "[Select_CString( CHARACTER.IsFemale, 'Okurková královna', 'Okurkový král' )]"
 nick_the_cucumber_king_desc: "Jen málokdo může tvrdit, že uchvátil království. Ještě méně lidí může říct, že při tom sehrála klíčovou úlohu strategicky odcizená hlíza."
 nick_the_peaceful: "[Select_CString( CHARACTER.IsFemale, 'Mírumilovná', 'Mírumilovný' )]"
 nick_the_peaceful_desc: "Nemůžeme spolu prostě všichni vycházet?"
 nick_the_whetstone: "Brousek"
 nick_the_whetstone_desc: "Jako každý dobrý brousek se [CHARACTER.GetShortUINameNoTooltipNoFormat] podvolí i tupým čepelím."
 nick_the_slayer_of_the_snake: "[Select_CString( CHARACTER.IsFemale, 'Hadobijkyně', 'Hadobijec' )]"
 nick_the_slayer_of_the_snake_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] pocházel[Select_CString( CHARACTER.IsFemale, 'a', '' )] z Bagdádu a zabil[Select_CString( CHARACTER.IsFemale, 'a', '' )] mocného hada Sarkiho, zlého původce ničivého sucha, aby získal[Select_CString( CHARACTER.IsFemale, 'a', '' )] ruku královny Daury."
 nick_the_illuminator: "[Select_CString( CHARACTER.IsFemale, 'Osvětitelka', 'Osvětitel' )]"
 nick_the_illuminator_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je oslavován[Select_CString( CHARACTER.IsFemale, 'a', '' )] jako první, kdo svému lidu přinesl světlo #EMP pravé#! víry a stal[Select_CString( CHARACTER.IsFemale, 'a', '' )] se počátkem jeho spásy."
 nick_the_builder: "[Select_CString( CHARACTER.IsFemale, 'Stavitelka', 'Stavitel' )]"
 nick_the_builder_desc: "Většina vládců mluví o budování svého panství pouze obrazně. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] nikoli."
 nick_the_martyrophile: "[Select_CString( CHARACTER.IsFemale, 'Milovnice mučedníků', 'Milovník mučedníků' )]"
 nick_the_martyrophile_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je ve své víře všeobecně oceňován[Select_CString( CHARACTER.IsFemale, 'a', '' )] za zaznamenání životů jejích svatých mučedníků."
 nick_the_campeador: "Campeador"
 nick_the_campeador_desc: "Mnozí tvrdí, že nikdy neexistovalo dokonalejší ztělesnění válečnické ctnosti a rytířské ušlechtilosti. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] však chválou pohrdá a spokojuje se s naplňováním ideálů, které si sám[Select_CString( CHARACTER.IsFemale, 'a', '' )] stanovil[Select_CString( CHARACTER.IsFemale, 'a', '' )]."
 nick_the_girthy: "[Select_CString( CHARACTER.IsFemale, 'Mohutná', 'Mohutný' )]"
 nick_the_girthy_desc: "O nesmírné váze, rozložité postavě a mohutnosti [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] se mluví v každém městě, které navštíví."
 nick_the_missionary: "[Select_CString( CHARACTER.IsFemale, 'Misionářka', 'Misionář' )]"
 nick_the_missionary_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nespočine, dokud zbývá jediná duše, kterou dosud nespasilo světlo [CHARACTER.GetFaith.GetName]."
 nick_the_hotspur: "Divous"
 nick_the_hotspur_desc: "Říká se, že [CHARACTER.GetShortUINameNoTooltipNoFormat] činí rozhodnutí tak rychle, že se ostruhy na [Select_CString( CHARACTER.IsFemale, 'jejích', 'jeho' )] patách sotva dotknou země."
 nick_the_vanquisher: "[Select_CString( CHARACTER.IsFemale, 'Přemožitelka', 'Přemožitel' )]"
 nick_the_vanquisher_desc: "Ať se proti [CHARACTER.GetShortUINameNoTooltipNoFormat] postaví kdokoli. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] je kosou [CHARACTER.GetFaith.DeathDeityName]."
 nick_the_bloody: "[Select_CString( CHARACTER.IsFemale, 'Krvavá', 'Krvavý' )]"
 nick_the_bloody_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se trochou nepořádku nenechá odradit bez ohledu na to, kolika lidmi tento nepořádek býval."
 nick_the_shy: "[Select_CString( CHARACTER.IsFemale, 'Plachá', 'Plachý' )]"
 nick_the_shy_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se objevuje tak zřídka, že většina lidí o [Select_CString( CHARACTER.IsFemale, 'ní', 'něm' )] zná jen přízvisko."
 nick_the_giant: "[Select_CString( CHARACTER.IsFemale, 'Obryně', 'Obr' )]"
 nick_the_giant_desc: "Povídá se, že [CHARACTER.GetShortUINameNoTooltipNoFormat] je velký[Select_CString( CHARACTER.IsFemale, 'á', '' )] jako dům. Podle [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] zkušenosti záleží na tom, o jaký dům jde."
 nick_bad_hand: "Špatná ruka"
 nick_bad_hand_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tvrdí, že přízvisko odkazuje na [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] tvrdý pravý hák, ale většina lidí ví, že je pouze beznadějným hráčem karet."
 nick_the_little: "[Select_CString( CHARACTER.IsFemale, 'Malá', 'Malý' )]"
 nick_the_little_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je všeobecně považován[Select_CString( CHARACTER.IsFemale, 'a', '' )] za osobu nevelkého vzrůstu."
 nick_the_one_eyed: "[Select_CString( CHARACTER.IsFemale, 'Jednooká', 'Jednooký' )]"
 nick_the_one_eyed_desc: "$nick_monophthalmos_desc$"
 nick_the_oppressor: "[Select_CString( CHARACTER.IsFemale, 'Utlačovatelka', 'Utlačovatel' )]"
 nick_the_oppressor_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] rozhodně není nejslavnějším vládcem, jakého kdy [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] poddaní měli."
 nick_the_apostate: "[Select_CString( CHARACTER.IsFemale, 'Odpadlice', 'Odpadlík' )]"
 nick_the_apostate_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se postavil[Select_CString( CHARACTER.IsFemale, 'a', '' )] proti přílivu úspěchů jiné víry a namísto ní vyznal[Select_CString( CHARACTER.IsFemale, 'a', '' )] lásku a věrnost [CHARACTER.GetFaith.HighGodName]."
 nick_the_pagan: "[Select_CString( CHARACTER.IsFemale, 'Pohanka', 'Pohan' )]"
 nick_the_pagan_desc: "Většina lidí se tímto označením snaží [CHARACTER.GetShortUINameNoTooltipNoFormat] zesměšnit. Jen ať se snaží. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] zná pravdu."
 nick_the_heretic: "[Select_CString( CHARACTER.IsFemale, 'Kacířka', 'Kacíř' )]"
 nick_the_heretic_desc: "Obrácení [CHARACTER.GetShortUINameNoTooltipNoFormat] k [CHARACTER.GetFaith.GetName] bylo tak dramatické, že patří mezi věci, které si o [Select_CString( CHARACTER.IsFemale, 'ní', 'něm' )] lidé pamatují nejlépe."
 nick_the_savage: "[Select_CString( CHARACTER.IsFemale, 'Divoška', 'Divoký' )]"
 nick_the_savage_desc: "Neexistuje nic ani nikdo, koho by [CHARACTER.GetShortUINameNoTooltipNoFormat] váhal[Select_CString( CHARACTER.IsFemale, 'a', '' )] roztrhat na kusy. Muž, žena, dítě či pes, zabije všechny a nechá [CHARACTER.GetFaith.HighGodName], ať je rozsoudí."
 nick_the_defiant: "[Select_CString( CHARACTER.IsFemale, 'Vzdorovitá', 'Vzdorovitý' )]"
 nick_the_defiant_desc: "Jen ať přijdou, ať přijdou všichni! Cesta [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] je správná a [CHARACTER.GetShortUINameNoTooltipNoFormat] zabije tolik lidí, kolik bude třeba, aby to dokázal[Select_CString( CHARACTER.IsFemale, 'a', '' )]!"
 nick_the_sea_king: "[Select_CString( CHARACTER.IsFemale, 'Mořská královna', 'Mořský král' )]"
 nick_the_sea_king_desc: "Způsobem [CHARACTER.GetShortUINameNoTooltipNoFormat] je loupit a plenit a brát si, co chce, od koho chce. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] odmítá změnit své způsoby i dovolit vlastnímu lidu, aby změnil ty své."
 nick_the_great_and_terrible: "[Select_CString( CHARACTER.IsFemale, 'Veliká a Hrozná', 'Veliký a Hrozný' )]"
 nick_the_great_and_terrible_desc: "Pirát bez sobě rovného, vládce krve a zlata a ztělesnění zářícího meče vztyčeného nad zpěněnými vlnami slaného moře. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] si zasloužil[Select_CString( CHARACTER.IsFemale, 'a', '' )] označení Veliký a vytesal[Select_CString( CHARACTER.IsFemale, 'a', '' )] si pověst hodnou přízviska #EMP Hrozný#!."
 nick_the_stonefaced: "Kamenná tvář"
 nick_the_stonefaced_desc: "Usměj se. Prosím? Alespoň jednou?"
 nick_the_dry: "[Select_CString( CHARACTER.IsFemale, 'Suchá', 'Suchý' )]"
 nick_the_dry_desc: "Nelze poznat, zda se [CHARACTER.GetShortUINameNoTooltipNoFormat] neustále směje uvnitř, aniž by to dal[Select_CString( CHARACTER.IsFemale, 'a', '' )] najevo, nebo zkrátka vůbec nechápe samotný pojem #EMP zábava#!."
 nick_the_joyless: "[Select_CString( CHARACTER.IsFemale, 'Zachmuřená', 'Zachmuřený' )]"
 nick_the_joyless_desc: "Každý, kdo s [CHARACTER.GetShortUINameNoTooltipNoFormat] jedná denně, se brzy naučí vyjadřovat přesně a jednoznačně, protože ani [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] porozumění nikdy nebude méně přesné."
 nick_lacks_laughs: "Nesmějící se"
 nick_lacks_laughs_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je pověstn[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] takovou vážností, že prý lidský smích neslyšel[Select_CString( CHARACTER.IsFemale, 'a', '' )] až do dospělosti. Domníval[Select_CString( CHARACTER.IsFemale, 'a', '' )] se, že dotyčný dostal záchvat."
 nick_the_dull: "[Select_CString( CHARACTER.IsFemale, 'Tupá', 'Tupý' )]"
 nick_the_dull_desc: "Nikdo si už přesně nepamatuje, proč [CHARACTER.GetShortUINameNoTooltipNoFormat] poprvé nazvali $nick_the_dull$. Všichni se shodují, že ani nestojí za to si to pamatovat."
 nick_the_snorer: "[Select_CString( CHARACTER.IsFemale, 'Chrápačka', 'Chrápač' )]"
 nick_the_snorer_desc: "Zda [CHARACTER.GetShortUINameNoTooltipNoFormat] skutečně chrápe, je jen předmětem planých dohadů, ale když pobývá doma, [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] dvůr je chrápáním rozhodně prosycen."
 nick_troll_slayer: "[Select_CString( CHARACTER.IsFemale, 'Trolobijkyně', 'Trolobijec' )]"
 nick_troll_slayer_desc: "Prostý lid se hrdě chlubí ochrannou mocí doteku [CHARACTER.GetShortUINameNoTooltipNoFormat] a vypráví, jak v jeho jménu zabil[Select_CString( CHARACTER.IsFemale, 'a', '' )] trolla."
 nick_the_bane_of_danes: "Zkáza Dánů"
 nick_the_bane_of_danes_desc: "Podle všeobecného mínění není ve Skandinávii jediná rodina, která by ostřím [CHARACTER.GetShortUINameNoTooltipNoFormat] nepřišla o některého příbuzného."
 nick_the_culture_wall: "[CHARACTER.GetCulture.GetNameNoTooltip] zeď"
 nick_the_culture_wall_desc: "Po vodách [CHARACTER.GetShortUINameNoTooltipNoFormat] nepluje žádný cizí nájezdník, vikinský otrokář ani hladový plenitel a nikdo z nich neloví mezi [Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' )] lidem."
 nick_nord_foe: "[Select_CString( CHARACTER.IsFemale, 'Nepřítelkyně Seveřanů', 'Nepřítel Seveřanů' )]"
 nick_nord_foe_desc: "Někteří hlupáci tvrdí, že Seveřany nelze zastrašit, protože jim v žilách koluje led. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] však ví, že umírají s křikem a krvácejí jako každý jiný."
 nick_the_scourge_of_the_northerners: "Metla Seveřanů"
 nick_the_scourge_of_the_northerners_desc: "Přicházejí do zemí [CHARACTER.GetShortUINameNoTooltipNoFormat] za otroky a kořistí. Dánové, Norové i Švédové. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] jim nabízí jen rychlou smrt a věčnost v [CHARACTER.GetFaith.random_NegativeAfterLife]."
 nick_the_burner_of_ash: "[Select_CString( CHARACTER.IsFemale, 'Palička jasanu', 'Palič jasanu' )]"
 nick_the_burner_of_ash_desc: "Nic nevoní tak krásně jako hořící drakkar za jarního rána."
 nick_the_garlic: "Česnekový král"
 nick_the_garlic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se stal[Select_CString( CHARACTER.IsFemale, 'a', '' )] terčem posměšné dětské říkanky."
 nick_garlic_queen: "Česneková královna"
 nick_garlic_queen_desc: "$nick_the_garlic_desc$"
 nick_gajapati: "Gadžapati"
 nick_gajapati_desc: "Novátorské využívání válečných slonů [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] se jistě zapíše do dějin."
 nick_the_transcriber: "[Select_CString( CHARACTER.IsFemale, 'Opisovačka', 'Opisovač' )]"
 nick_the_transcriber_desc: "Poznání závisí na předávání a co může sloužit lépe než knihy a svitky, které budou číst celá pokolení?"
 nick_of_clairvaux: "z Clairvaux"
 nick_of_clairvaux_desc: "Původ [CHARACTER.GetShortUINameNoTooltipNoFormat] je důležitý, protože umožňuje odlišit [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] od upřímně směšného množství dalších Bernardů."
 nick_the_headless: "[Select_CString( CHARACTER.IsFemale, 'Bezhlavá', 'Bezhlavý' )]"
 nick_the_headless_desc: "Rychlé a přímočaré. Stejně jako konec [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_footstool: "Podnožka"
 nick_the_footstool_desc: "Povinnosti [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] jsou... tíživé. A často probírané."
 nick_father_of_the_baltic: "Otec Pobaltí"
 nick_father_of_the_baltic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] přivedl[Select_CString( CHARACTER.IsFemale, 'a', '' )] Livonsko na svět krví, potem a dřinou."
 nick_mother_of_the_baltic: "Matka Pobaltí"
 nick_mother_of_the_baltic_desc: "$nick_father_of_the_baltic_desc$"
 nick_scourge_of_the_baltic: "Metla Pobaltí"
 nick_scourge_of_the_baltic_desc: "Díky [CHARACTER.GetShortUINameNoTooltipNoFormat] Livonsko jistě přetrvá na pevných základech z kostí a utrpení."
 nick_the_mountain_king: "[Select_CString( CHARACTER.IsFemale, 'Horská královna', 'Horský král' )]"
 nick_the_mountain_king_desc: "Vznešené síně [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] jsou široko daleko proslulé."
 nick_beth_nahrain: "[Select_CString( CHARACTER.IsFemale, 'Vládkyně dvou řek', 'Vládce dvou řek' )]"
 nick_beth_nahrain_desc: "Pouhá přítomnost [CHARACTER.GetShortUINameNoTooltipNoFormat] vysílá davem přívalovou vlnu, která všechny strhává úžasem nad [Select_CString( CHARACTER.IsFemale, 'jejími', 'jeho' )] sjednotitelskými úspěchy."
 nick_the_child_killer: "[Select_CString( CHARACTER.IsFemale, 'Vražedkyně dětí', 'Vrah dětí' )]"
 nick_the_child_killer_desc: "Znalci Bible se obecně shodují, že [CHARACTER.GetShortUINameNoTooltipNoFormat] nepochopil[Select_CString( CHARACTER.IsFemale, 'a', '' )] podstatu Šalomounova rozsudku."
 nick_the_anathema: "Klatba"
 nick_the_anathema_desc: "Chaos smrtelného světa před [CHARACTER.GetShortUINameNoTooltipNoFormat] ustupuje."
 nick_the_angel_of_death: "Anděl [CHARACTER.GetFaith.DeathDeityName|U]"
 nick_the_angel_of_death_desc: "Podle [CHARACTER.GetShortUINameNoTooltipNoFormat] šlo o ukončení jejich utrpení. Zbytek světa to však vidí jinak."
 nick_monophthalmos: "Monofthalmos"
 nick_monophthalmos_desc: "Jedinému zbývajícímu oku [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] se dostává mnohem více pozornosti, než jaké se kdy těšila obě."
 nick_health_god_mercy: "[CHARACTER.GetFaith.HealthGodNamePossessive|U] milost"
 nick_health_god_mercy_desc: "Navzdory pochybným začátkům si [CHARACTER.GetShortUINameNoTooltipNoFormat] našel[Select_CString( CHARACTER.IsFemale, 'a', '' )] cestu k lékařství a získal[Select_CString( CHARACTER.IsFemale, 'a', '' )] věhlas péčí o chudé."
 nick_genghis_khan: "Čingischán"
 nick_genghis_khan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je trestem seslaným [CHARACTER.GetFaith.HighGodName] za všechny hříchy světa. Kdyby svět nebyl plný hříšníků, proč by na něj [CHARACTER.GetFaith.HighGodName] seslal někoho jako #EMP [CHARACTER.GetShortUINameNoTooltipNoFormat]#!?"
 nick_cengiz_khan: "Čingischán"
 nick_cengiz_khan_desc: "$nick_genghis_khan_desc$"
 nick_yekhe_khagan: "Jeke kagán"
 nick_yekhe_khagan_desc: "Veliký a vznešený vládce travnatého moře i všech usedlých zemí! [CHARACTER.GetShortUINameNoTooltipNoFormat|U] je hřebcem, který osedlal svět."
 nick_dort_yonlug_khagan: "Dört Yönlüg kagán"
 nick_dort_yonlug_khagan_desc: "Země se rozprostírá do čtyř nesmírných směrů a až do posledních temných a nepoznaných končin po právu náleží [CHARACTER.GetShortUINameNoTooltipNoFormat]! Celý vesmír je uspořádán pro [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] pohodlí a podléhá [Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' )] rozkazům."
 nick_tengri_khagan: "Tengri kagán"
 nick_tengri_khagan_desc: "Za dávných časů mocných gökturkských kagánů byl tento titul vytesán do kamene! Tengri kagán, zrozený z nebes a moudrý. [CHARACTER.GetShortUINameNoTooltipNoFormat|U] byl[Select_CString( CHARACTER.IsFemale, 'a', '' )] stvořen[Select_CString( CHARACTER.IsFemale, 'a', '' )] Velkým modrým nebem, aby vládl[Select_CString( CHARACTER.IsFemale, 'a', '' )] světu."
 nick_xormuzta: "Xormuzta"
 nick_xormuzta_desc: "Prastaré čestné označení bylo kdysi spojováno se staroíránským „nebeským božstvem“ a dnes je východní křesťané a jim podobní používají k uctění legendárních zakladatelů, jako je [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_mar_sargis: "Mar Sargis"
 nick_mar_sargis_desc: "Říká se, že [CHARACTER.GetShortUINameNoTooltipNoFormat] vedla ke zbožné vládě svatá vidění a že [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] patronem je mučedník svatý Sargis."
 nick_cihangir: "Džihangír"
 nick_cihangir_desc: "Z božské vůle Alláhovy je [CHARACTER.GetShortUINameNoTooltipNoFormat] dobyvatelem celého světa. Dár al-islám ani země nevěřících dosud neslyšely tak mocné dunění kopyt!"
 nick_culture_khagan: "[CHARACTER.GetCulture.GetNameNoTooltip] kagán"
 nick_culture_khagan_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je uctíván[Select_CString( CHARACTER.IsFemale, 'a', '' )] jako největší ze všech [CHARACTER.GetCulture.GetCollectiveNounNoTooltip] a [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] [CHARACTER.GetCulture.GetCollectiveNounNoTooltip] jsou dětmi osudu, jezdci, kteří drtí města a třímá meče i biče říše!"
 nick_akhshunwar: "Achšunvar"
 nick_akhshunwar_desc: "Vládci Hedvábné stezky odedávna nosili vznešené tituly jako #EMP ichšíd#!, #EMP šáhanšáh#! a #EMP Achšunvar#!, ale nikdo před [CHARACTER.GetShortUINameNoTooltipNoFormat] nebyl hoden čestného označení „nositel moci“!"
 nick_fabulous_she_he: "[Select_CString( CHARACTER.IsFemale, 'Úžasná', 'Úžasný' )] [CHARACTER.GetFirstNameNoTooltip|U]"
 nick_fabulous_she_he_desc: "Není neobvyklé, že náhodní kolemjdoucí při průchodu této osoby pokleknou na jedno koleno na znamení úcty."
 nick_the_wary: "[Select_CString( CHARACTER.IsFemale, 'Ostražitá', 'Ostražitý' )]"
 nick_the_wary_desc: "Těkavé [CHARACTER.Custom('EyeEyes')] a podezíravý výraz jsou tím, co si lidé na [CHARACTER.GetShortUINameNoTooltipNoFormat] pamatují nejlépe."
 nick_the_black_sheep: "Černá ovce"
 nick_the_black_sheep_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] s většinou své rodiny vůbec nemluví."
 nick_sisyphus: "[Select_CString( CHARACTER.IsFemale, 'Sisyfovská', 'Sisyfovský' )]"
 nick_sisyphus_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] především pokusy přesouvat těžké předměty po nemožných drahách."
 nick_blue_lion: "Modrý lev"
 nick_blue_lion_desc: "Každý ví, že s příchodem zimy řve $nick_blue_lion$ #EMP pouze#! o půlnoci."
 nick_the_hairy: "[Select_CString( CHARACTER.IsFemale, 'Chlupatá', 'Chlupatý' )]"
 nick_the_hairy_desc: "Je [CHARACTER.GetShortUINameNoTooltipNoFormat] člověkem, nebo spíše [CHARACTER.Custom('GetGenderAlliteratingAnimal')]? Na první pohled se to těžko poznává."
 nick_the_child: "Dítě"
 nick_the_child_desc: "Život [CHARACTER.GetShortUINameNoTooltipNoFormat] bohužel skončil příliš brzy na to, aby [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] proslavilo něco jiného než jeho náhlý konec."
 nick_the_wake: "[Select_CString( CHARACTER.IsFemale, 'Bdělá', 'Bdělý' )]"
 nick_the_wake_desc: "[CHARACTER.Custom('EyeEyes')|U] [CHARACTER.GetShortUINameNoTooltipNoFormat] neustále vyhlížejí bezpráví a při pouhé zmínce o [Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' )] jméně se zachvějí cizí dobyvatelé i domácí přeběhlíci!"
 nick_the_bearded: "[Select_CString( CHARACTER.IsFemale, 'Vousatá', 'Vousatý' )]"
 nick_the_bearded_desc: "Stejně jako mnoho mužů má [CHARACTER.GetShortUINameNoTooltipNoFormat] vousy. Opravdu netuší, proč na to lidé neustále poukazují."
 nick_the_mountain_dweller: "[Select_CString( CHARACTER.IsFemale, 'Horalka', 'Horalan' )]"
 nick_the_mountain_dweller_desc: "Spatřit [CHARACTER.GetShortUINameNoTooltipNoFormat] mimo [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] horský domov je vzácností."
 nick_the_honest_hipped: "Poctivé boky"
 nick_the_honest_hipped_desc: "[CHARACTER.GetSheHe|U] přiměje muže zatoužit promluvit $language_iberian_name$."
 nick_the_legend_riad: "Legenda"
 nick_the_legend_riad_desc: "Temná legenda [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] vrhá stín na celý svět."
 nick_the_shadow_riad: "$nick_the_shadow$"
 nick_the_shadow_riad_desc: "$nick_the_legend_riad_desc$"
 nick_the_justicar: "[Select_CString( CHARACTER.IsFemale, 'Justiciárka', 'Justiciár' )]"
 nick_the_justicar_desc: "Lidé se většinou shodují, že rozsudky [CHARACTER.GetShortUINameNoTooltipNoFormat] jsou spravedlivé a vyvážené."
 nick_the_green: "[Select_CString( CHARACTER.IsFemale, 'Zelená', 'Zelený' )]"
 nick_the_green_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je považován[Select_CString( CHARACTER.IsFemale, 'a', '' )] za velmi obratného zahradníka."
 nick_king_of_fashion: "[CHARACTER.GetTitleAsNameNoTooltip] módy"
 nick_king_of_fashion_desc: "Ve světě hedvábí a soboliny si [CHARACTER.GetShortUINameNoTooltipNoFormat] vydobyl[Select_CString( CHARACTER.IsFemale, 'a', '' )] moc a vliv."
 nick_prince_of_fashion: "[CHARACTER.Custom('GetPrincessPrince')] módy"
 nick_prince_of_fashion_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se stal[Select_CString( CHARACTER.IsFemale, 'a', '' )] terčem posměchu kvůli svému vkusu v oblékání."
 nick_the_foreigner: "[Select_CString( CHARACTER.IsFemale, 'Cizinka', 'Cizinec' )]"
 nick_the_foreigner_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] pochází z dalekých zemí."
 nick_the_culture: "z [CHARACTER.MakeScope.Var('nick_the_culture_var').Culture.GetNameNoTooltip] kultury"
 nick_the_culture_desc: "Obyvatelé panství označují [CHARACTER.GetShortUINameNoTooltipNoFormat] podle kultury, k níž podle nich náleží."
 nick_the_linguist: "[Select_CString( CHARACTER.IsFemale, 'Polyglotka', 'Polyglot' )]"
