 nick_old_man_of_the_mountain: "Stařec z hor"
 nick_old_man_of_the_mountain_desc: "S dlouhým bílým vousem a křivou holí nahání[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )][Select_CString( CHARACTER.IsLocalPlayer, '', Concatenate( ' ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] nevěřícím strach jako organizátor a vůdce obávaných asasínů ze své horské pevnosti."
 nick_barbarossa: "Barbarossa"
 nick_barbarossa_desc: "Na pochybnou počest kdysi rudého porostu zdobícího [Select_CString( CHARACTER.IsLocalPlayer, 'tvou', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] bradu [Select_CString( CHARACTER.IsLocalPlayer, 'ti udělili italští nepřátelé', Concatenate( 'udělili italští nepřátelé ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') ) )] přízvisko #italic Barbarossa#! neboli Rudovous."
