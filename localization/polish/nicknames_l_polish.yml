 nick_the_pirate_king_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] postrachem moří a zasévá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] strach do srdcí všech, kdo se odváží vyplout."
 nick_the_pirate_queen: "Pirátská královna"
 nick_the_pirate_queen_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] postrachem moří a zasévá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] strach do srdcí všech, kdo se odváží vyplout."
 nick_the_rhymer: "[Select_CString( CHARACTER.IsFemale, 'Rýmotepkyně', 'Rýmotepec' )]"
 nick_the_rhymer_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'vládneš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' vládne' ) )|U] aliterací i souzvučnými dvojveršími a druhové obdivují obratnost, s níž zachází[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] s verši."
 nick_the_elegist: "[Select_CString( CHARACTER.IsFemale, 'Elegička', 'Elegik' )]"
 nick_the_elegist_desc: "Truchlivé a melancholické verše, jimiž [CZProDropSubNF(CHARACTER)] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )], vhánějí slzy do očí i těm nejzatvrzelejším posluchačům."
 nick_the_poetaster: "[Select_CString( CHARACTER.IsFemale, 'Veršotepkyně', 'Veršotepec' )]"
 nick_the_poetaster_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá poezie', Concatenate( 'Poezie ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] je proslulá, patrně však nikoli z důvodu, který by [Select_CString( CHARACTER.IsLocalPlayer, 'sis', 'si' )] [Select_CString( CHARACTER.IsFemale, 'přála', 'přál' )]."
 nick_the_elysian_muse: "Elysejská múza"
 nick_the_elysian_muse_desc: "[CZProDropNF(CHARACTER,'proslula','proslul')|U] v této i mnoha dalších zemích nadpozemskou schopností tvořit velkolepé verše a dokonale ovládá[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] mluvené slovo ve všech jeho podobách."
 nick_iscariot: "[Select_CString( CHARACTER.IsFemale, 'Iškariotská', 'Iškariotský' )]"
 nick_iscariot_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'známá', 'známý' )] tím, že [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )]pro vlastní prospěch [Select_CString( CHARACTER.IsFemale, 'zradila', 'zradil' )] nejpevnější a nejdražší zásady svého srdce."
 nick_the_foreign_mother: "z [CHARACTER.GetMother.GetCulture.GetNameNoTooltip] kultury"
 nick_the_foreign_mother_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'nedokážeš se', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se nedokáže' ) )|U] zbavit hanby plynoucí z cizího původu své matky a musí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] snášet záplavu laciných urážek namířených proti jejímu etniku."
 nick_the_foreign_father: "z [CHARACTER.GetFather.GetCulture.GetNameNoTooltip] kultury"
 nick_the_foreign_father_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'nedokážeš se', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' se nedokáže' ) )|U] zbavit hanby plynoucí z cizího původu svého otce a musí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] snášet záplavu laciných urážek namířených proti jeho etniku."
 nick_the_corpulent: "[Select_CString( CHARACTER.IsFemale, 'Otylá', 'Otylý' )]"
 nick_the_corpulent_desc: "Koně i podlahy se chvějí pod rosolovitou horou masa, kterou [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( 'je ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )]."
 nick_the_insubordinate: "[Select_CString( CHARACTER.IsFemale, 'Neposlušná', 'Neposlušný' )]"
 nick_the_insubordinate_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] vždy [Select_CString( CHARACTER.IsFemale, 'připravena', 'připraven' )] klást odpor a oplácet každou křivdu, takže [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', 'je' )] příšerným služebníkem a nevěrným vazalem."
 nick_the_backstabber: "[Select_CString( CHARACTER.IsFemale, 'Zákeřnice', 'Zákeřník' )]"
 nick_the_backstabber_desc: "Na [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj příkaz', Concatenate( 'příkaz ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] skončil mezi lopatkami nejeden nůž, skutečný i obrazný."
 nick_the_corrupt: "[Select_CString( CHARACTER.IsFemale, 'Zkorumpovaná', 'Zkorumpovaný' )]"
 nick_the_corrupt_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] vychytralým tvorem usazeným na zlatém pokladu pochybného původu."
 nick_the_incompetent: "[Select_CString( CHARACTER.IsFemale, 'Neschopná', 'Neschopný' )]"
 nick_the_incompetent_desc: "[CZProDropNF(CHARACTER,'nebyla','nebyl')|U] [Select_CString( CHARACTER.IsFemale, 'stvořena', 'stvořen' )] pro moc a odpovědnost, které [Select_CString( CHARACTER.IsLocalPlayer, 'ti', Select_CString( CHARACTER.IsFemale, 'jí', 'mu' ) )] byly vloženy do rukou."
 nick_the_gambler: "[Select_CString( CHARACTER.IsFemale, 'Hazardérka', 'Hazardér' )]"
 nick_the_gambler_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvé sázky', Concatenate( 'Sázky ', CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat ) )] jsou ohromné i při mizivé naději na úspěch... a #EMP obzvláště#! tehdy, když je ve hře mnoho."
 nick_the_obscene: "[Select_CString( CHARACTER.IsFemale, 'Nestoudná', 'Nestoudný' )]"
 nick_the_obscene_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] nechvalně [Select_CString( CHARACTER.IsFemale, 'známá', 'známý' )] otevřenou a sprostou vulgaritou. Nevinnost v doslechu dlouho nepřežije."
 nick_the_miser: "[Select_CString( CHARACTER.IsFemale, 'Lakomice', 'Lakomec' )]"
 nick_the_miser_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] chorobně [Select_CString( CHARACTER.IsFemale, 'lakomá', 'lakomý' )], k velké nelibosti služebnictva i příbuzných."
 nick_the_unfortunate: "[Select_CString( CHARACTER.IsFemale, 'Nešťastnice', 'Nešťastník' )]"
 nick_the_unfortunate_desc: "Na samotné [Select_CString( CHARACTER.IsLocalPlayer, 'tvé existenci', Concatenate( 'existenci ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] je cosi... neblahého. Stát ve stínu [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] korouhve znamená zakoušet neklid."
 nick_brown_cheeks: "Hnědé půlky"
 nick_brown_cheeks_desc: "[CZProDropSeNF(CHARACTER,'pokusila','pokusil')|U] rozpoutat vzpouru proti svému vůdci... a pořádně [Select_CString( CHARACTER.IsLocalPlayer, 'ses', 'se' )] [Select_CString( CHARACTER.IsFemale, 'podělala', 'podělal' )] strachy."
 nick_the_drunkard_michael_iii: "Opilec"
 nick_the_drunkard_michael_iii_desc: "Litujme Michaela, mladého císaře, kterého srazila jeho nanejvýš #EMP nekřesťanská#! nestřídmost v pití. Je poučením pro nás všechny, že urozený původ může naznačovat nadání, ale nezaručuje je."
 nick_the_pious_michael_iii: "Pobožný"
 nick_the_pious_michael_iii_desc: "Přestože Michaelův život ukončila tragická nehoda pozoruhodně záhy, za svou #EMP zásadní#! úlohu při ukončení obrazoborectví jistě požívá vysoké přízně nebes."
 nick_the_young_michael_iii: "Mladý"
 nick_the_young_michael_iii_desc: "Michael vládl od útlého dětství, a proto působí jako krutý žert, že jeho vláda trvala tak dlouho, zatímco on zemřel tak mladý. Nešťastnou náhodou."
 nick_the_exile: "[Select_CString( CHARACTER.IsFemale, 'Vyhnankyně', 'Vyhnanec' )]"
 nick_the_exile_desc: "[CZProDropNF(CHARACTER,'byla','byl')|U] [Select_CString( CHARACTER.IsFemale, 'vyhnána', 'vyhnán' )] z vlasti nebo [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )]ji [Select_CString( CHARACTER.IsFemale, 'opustila', 'opustil' )], [Select_CString( CHARACTER.IsLocalPlayer, 'abys', 'aby' )] [Select_CString( CHARACTER.IsFemale, 'unikla', 'unikl' )] nepředvídanému břemenu a [Select_CString( CHARACTER.IsFemale, 'nalezla', 'nalezl' )] útočiště v cizině."
 nick_lackland_young: "Bezzemek"
 nick_lackland_young_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Ubohý ty', Concatenate( 'Ubohý ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )], narozený jako mladší syn po boku zástupu znamenitých bratrů. Jak [Select_CString( CHARACTER.IsLocalPlayer, 'bys', 'by' )] vůbec mohl očekávat, že někdy [Select_CString( CHARACTER.IsLocalPlayer, 'budeš', 'bude' )] vládnout něčemu významnému?"
 nick_lackland_ironic: "$nick_lackland_young$"
 nick_lackland_ironic_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'možná kdysi jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' možná kdysi' ) )|U] [Select_CString( CHARACTER.IsFemale, 'bývala', 'býval' )] bezvýznamným potomkem významnějších předků, navzdory nepřízni osudu a nepokrytému pochechtávání [Select_CString( CHARACTER.IsLocalPlayer, 'sis', 'si' )] však [Select_CString( CHARACTER.IsFemale, 'dokázala', 'dokázal' )] vydobýt úctyhodnou doménu."
 nick_lackland_old: "$nick_lackland_young$"
 nick_lackland_old_desc: "Jak potupné musí být pro [Select_CString( CHARACTER.IsLocalPlayer, 'tebe', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') )] získat tak rozsáhlé državy a následně o značnou část z nich přijít. A jak prorocké se ukázalo [Select_CString( CHARACTER.IsLocalPlayer, 'tvé', Select_CString( CHARACTER.IsFemale, 'její', 'jeho' ) )] přízvisko."
 nick_curtmantle: "Krátký plášť"
 nick_curtmantle_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Jako praktický člověk dáváš', Concatenate( 'Praktický člověk ', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' dává' ) ) )] před okázalými a zdobenými oděvy přednost kratším cestovním plášťům."
 nick_pauper_king: "Žebrácký král"
 nick_pauper_king_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'známá', 'známý' )] tím, že často popíjí[Select_CString( CHARACTER.IsLocalPlayer, 'š', '' )] s obyvateli svých měst."
 nick_the_mapmaker: "[Select_CString( CHARACTER.IsFemale, 'Kartografka', 'Kartograf' )]"
 nick_the_mapmaker_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'známá', 'známý' )] dalekými cestami i značným množstvím času stráveného kreslením map navštívených krajů."
 nick_the_ploughman: "[Select_CString( CHARACTER.IsFemale, 'Oráčka', 'Oráč' )]"
 nick_the_ploughman_desc: "[CZProDropNF(CHARACTER,'byla','byl')|U] tehdy pouhým prostým rolníkem a poslové, kteří [Select_CString( CHARACTER.IsLocalPlayer, 'tě', Select_CString( CHARACTER.IsFemale, 'ji', 'ho' ) )] přišli povolat na trůn, [Select_CString( CHARACTER.IsLocalPlayer, 'tě nalezli', Select_CString( CHARACTER.IsFemale, 'ji nalezli', 'ho nalezli' ) )] u pluhu."
 nick_the_dreadful: "[Select_CString( CHARACTER.IsFemale, 'Hrůzná', 'Hrůzný' )]"
 nick_the_dreadful_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'věříš', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' věří' ) )|U], že úctu lze získat jedině strachem."
 nick_shinno: "Šinnó"
 nick_shinno_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'známá', 'známý' )] tím, že [Select_CString( CHARACTER.IsLocalPlayer, 'ses', 'se' )] [Select_CString( CHARACTER.IsFemale, 'prohlásila', 'prohlásil' )] za „nového císaře“ Japonska a [Select_CString( CHARACTER.IsFemale, 'vedla', 'vedl' )] povstání proti ústřední vládě."
 nick_murasaki_shikibu: "Murasaki Šikibu"
 nick_murasaki_shikibu_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi známá', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je známá' ) )|U] pod přízviskem #EMP Murasaki Šikibu#!, odvozeným od purpurové barvy #EMP murasaki#! květu vistárie zvaného #EMP fudžiwara#!, podle něhož získal jméno [Select_CString( CHARACTER.IsLocalPlayer, 'tvůj', 'její' )] rod, a od postavení [Select_CString( CHARACTER.IsLocalPlayer, 'tvého', 'jejího' )] otce v #EMP Šikibušó#!, ministerstvu obřadních záležitostí."
 nick_izumi_shikibu: "Izumi Šikibu"
 nick_izumi_shikibu_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi známá', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je známá' ) )|U] pod přízviskem #EMP Izumi Šikibu#!, odvozeným od úřadu [Select_CString( CHARACTER.IsLocalPlayer, 'tvého', 'jejího' )] manžela jako správce provincie #EMP Izumi#! a od postavení [Select_CString( CHARACTER.IsLocalPlayer, 'tvého', 'jejího' )] otce v #EMP Šikibušó#!, ministerstvu obřadních záležitostí."
 nick_sei_shonagon: "Sei Šónagon"
 nick_sei_shonagon_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi známá', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je známá' ) )|U] pod přízviskem #EMP Sei Šónagon#!, odvozeným od #EMP Sei#!, čínského čtení [Select_CString( CHARACTER.IsLocalPlayer, 'tvého', 'jejího' )] rodového jména #EMP Kijohara#!, a od úřadu jednoho z [Select_CString( CHARACTER.IsLocalPlayer, 'tvých', 'jejích' )] mužských příbuzných jako #EMP šónagona#!, nižšího státního rady."
 nick_the_fierce: "[Select_CString( CHARACTER.IsFemale, 'Urputná', 'Urputný' )]"
 nick_the_fierce_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'Tvá pověstná houževnatost', Concatenate( 'Pověstná houževnatost ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') ) )] kráčí daleko před [Select_CString( CHARACTER.IsLocalPlayer, 'tebou', Select_CString( CHARACTER.IsFemale, 'ní', 'ním' ) )]."
 nick_tenjin: "Tendžin"
 nick_tenjin_desc: "Věří se, že [Select_CString( CHARACTER.IsLocalPlayer, 'ses', Concatenate( 'se ', CHARACTER.GetShortUINameNoTooltipNoFormat ) )] po nespravedlivém zacházení [Select_CString( CHARACTER.IsFemale, 'stala', 'stal' )] pomstychtivým duchem a nyní [Select_CString( CHARACTER.IsLocalPlayer, 'jsi', 'je' )] [Select_CString( CHARACTER.IsFemale, 'uctívána', 'uctíván' )] jako nebeská bytost."
 nick_ushiwakamaru: "Ušiwakamaru"
 nick_ushiwakamaru_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'známá', 'známý' )] silou a houževnatostí mladého býka a lidé v okolí se [Select_CString( CHARACTER.IsLocalPlayer, 'tě', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_G') )] obávají."
 nick_ho_seung: "Hosung"
 nick_ho_seung_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'opředena', 'opředen' )] legendou o tygrovi, který zahynul po pádu do jámy, znovuzrodil se jako člověk a stal se mnichem. Podle této legendy není oním mnichem nikdo jiný než [Select_CString( CHARACTER.IsLocalPlayer, 'ty', CHARACTER.GetShortUINameNoTooltipNoFormat )]."
 nick_the_virgin: "Panna"
 nick_the_virgin_desc: "[CZProDropNF(CHARACTER,'byla','byl')|U] matkou Ježíše Krista a Královnou nebes. $pam_luke_1_42_default_short$"
 nick_the_angelic: "Andělský"
 nick_the_angelic_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'zahalena', 'zahalen' )] do skutečně mystické, nadpozemské svatosti."
 nick_blotsven: "Blót-Sven"
 nick_blotsven_desc: "[CZProDropNF(CHARACTER,'ukamenovala','ukamenoval')|U] misionáře."
 nick_the_rich: "Bohatý"
 nick_the_rich_desc: "Pověsti o nesmírném bohatství a okázalém utrácení [Select_CString( CHARACTER.IsLocalPlayer, 'tě předcházejí', Concatenate( 'předcházejí ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )]."
 nick_the_wonderful: "Podivuhodný"
 nick_the_wonderful_desc: "[CZProDropNF(CHARACTER,'získala','získal')|U] svými činy vážené postavení mezi lidmi."
 nick_the_springer: "Skokan"
 nick_the_springer_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'známá', 'známý' )] dramatickým útěkem, při němž [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'vyskočila', 'vyskočil' )] z vysokého okna, [Select_CString( CHARACTER.IsLocalPlayer, 'abys', 'aby' )] [Select_CString( CHARACTER.IsFemale, 'unikla', 'unikl' )] věznění."
 nick_the_childless: "Bezdětný"
 nick_the_childless_desc: "Navzdory veškerému úsilí se [Select_CString( CHARACTER.IsLocalPlayer, 'ti', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_D') )] nepodařilo stát se [Select_CString( CHARACTER.IsFemale, 'matkou', 'otcem' )] dítěte."
 nick_the_prisoner: "Vězeň"
 nick_the_prisoner_desc: "Potupné zajetí a uvěznění z rukou nepřátel [Select_CString( CHARACTER.IsLocalPlayer, 'tě poznamenaly', Concatenate( 'poznamenaly ', CHARACTER.Custom('CZ_ShortUINameNoTooltipNoFormat_A') ) )] na celý život."
 nick_the_harvester: "Skliditel"
 nick_the_harvester_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' je' ) )|U] [Select_CString( CHARACTER.IsFemale, 'obdivována', 'obdivován' )] za bohatou úrodu, kterou [Select_CString( CHARACTER.IsLocalPlayer, 'jsi ', '' )][Select_CString( CHARACTER.IsFemale, 'nashromáždila', 'nashromáždil' )] ve svém náručí a [Select_CString( CHARACTER.IsFemale, 'rozdělila', 'rozdělil' )] se o ni s lidmi."
 nick_the_scribe: "Písař"
 nick_the_scribe_desc: "[Select_CString( CHARACTER.IsLocalPlayer, 'vlastní rukou jsi', Concatenate( CHARACTER.GetShortUINameNoTooltipNoFormat, ' vlastní rukou' ) )|U] [Select_CString( CHARACTER.IsFemale, 'opisovala, překládala a zapisovala', 'opisoval, překládal a zapisoval' )] moudrosti, které jsou ctěny po celé zemi."
