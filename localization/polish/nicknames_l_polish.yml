 nick_samsam_al_dawla: "Samsám ad-Dawla"
 nick_samsam_al_dawla_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Samsám ad-Dawla, tedy Meč státu."
 nick_sharaf_al_dawla: "Šaraf ad-Dawla"
 nick_sharaf_al_dawla_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Šaraf ad-Dawla, tedy Čest státu."
 nick_baha_al_dawla: "Bahá ad-Dawla"
 nick_baha_al_dawla_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Bahá ad-Dawla, tedy Lesk státu."
 nick_sultan_al_dawla: "Sultán ad-Dawla"
 nick_sultan_al_dawla_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Sultán ad-Dawla, tedy Sultán státu."
 nick_musharraf_al_dawla: "Mušarraf ad-Dawla"
 nick_musharraf_al_dawla_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Mušarraf ad-Dawla, tedy Povznesený státem."
 nick_ala_al_dawla: "Alá ad-Dawla"
 nick_ala_al_dawla_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Alá ad-Dawla, tedy Vznešenost státu."
 nick_nizam_al_din: "Nizám ad-Dín"
 nick_nizam_al_din_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Nizám ad-Dín, tedy Řád víry."
 nick_mubaraz_al_din: "Mubáraz ad-Dín"
 nick_mubaraz_al_din_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Mubáraz ad-Dín, tedy Válečník víry."
 nick_qasim_al_dawla: "Kásim ad-Dawla"
 nick_qasim_al_dawla_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Kásim ad-Dawla, tedy Rozdělovatel státu."
 nick_sad_al_dawla: "Sád ad-Dawla"
 nick_sad_al_dawla_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Sád ad-Dawla, tedy Štěstí státu."
 nick_sayf_al_dawla: "Sajf ad-Dawla"
 nick_sayf_al_dawla_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Sajf ad-Dawla, tedy Meč státu."
 nick_nizam_al_mulk: "Nizám al-Mulk"
 nick_nizam_al_mulk_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nese čestné jméno Nizám al-Mulk, tedy Řád říše."
 nick_the_stylite: "[Select_CString( CHARACTER.IsFemale, 'Stylitka', 'Stylita' )]"
 nick_the_stylite_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] asketickým životem na vrcholu sloupu."
 nick_the_grazer: "[Select_CString( CHARACTER.IsFemale, 'Spásačka', 'Spásač' )]"
 nick_the_grazer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] asketickým životem po způsobu divoké zvěře."
 nick_the_iron_wearer: "[Select_CString( CHARACTER.IsFemale, 'Nositelka železa', 'Nositel železa' )]"
 nick_the_iron_wearer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] asketickým umrtvováním těla, při němž se halí do těžkých řetězů."
 nick_wolf_slayer: "[Select_CString( CHARACTER.IsFemale, 'Vlkobijkyně', 'Vlkobijec' )]"
 nick_wolf_slayer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je po celé zemi znám[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] jako ten, kdo v táboře statečně skolil zuřivého vlka."
 nick_wolf_father: "Otec vlků"
 nick_wolf_father_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je po celé zemi znám[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] tím, že pomohl[Select_CString( CHARACTER.IsFemale, 'a', '' )] březí vlčici porodit a odchovat vrh vlčat."
 nick_wolf_mother: "Matka vlků"
 nick_wolf_mother_desc: "$nick_wolf_father_desc$"
 nick_old_man_of_the_mountain: "Stařec z hor"
 nick_old_man_of_the_mountain_desc: "S dlouhým bílým vousem a křivou holí nahání [CHARACTER.GetShortUINameNoTooltipNoFormat] nevěřícím strach jako organizátor a vůdce obávaných asasínů ze své horské pevnosti."
 nick_barbarossa: "Barbarossa"
 nick_barbarossa_desc: "Na pochybnou počest kdysi rudého porostu zdobícího jeho bradu udělili italští nepřátelé [CHARACTER.GetShortUINameNoTooltipNoFormat] přízvisko #italic Barbarossa#! neboli Rudovous."
 nick_danishmend: "Danišmend"
 nick_danishmend_desc: "Hluboké vědomosti [CHARACTER.GetShortUINamePossessiveNoFormat] jsou všeobecně známé a těší se úctě mnoha lidí."
 nick_protosebastos: "Protosebastos"
 nick_protosebastos_desc: "Vysoká byzantská dvorská hodnost vyhrazená nemnohým. Titul „první Augustus“ propůjčuje [CHARACTER.GetShortUINameNoTooltipNoFormat] císařskou vážnost."
 nick_protosebaste: "Protosebasté"
 nick_protosebaste_desc: "Vysoká byzantská dvorská hodnost vyhrazená nemnohým. Titul „první Augusta“ propůjčuje [CHARACTER.GetShortUINameNoTooltipNoFormat] císařskou vážnost."
 nick_the_narrow_minded: "[Select_CString( CHARACTER.IsFemale, 'Úzkoprsá', 'Úzkoprsý' )]"
 nick_the_narrow_minded_desc: "Všechno známé považuje [CHARACTER.GetShortUINameNoTooltipNoFormat] za dobré a všechno neznámé za špatné."
 nick_the_bandit_king: "Loupežnický král"
 nick_the_bandit_king_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] budí po celé zemi hrůzu jako násilný a proradný nájezdník."
 nick_the_bandit_queen: "Loupežnická královna"
 nick_the_bandit_queen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] budí po celé zemi hrůzu jako násilná a proradná nájezdnice."
 nick_the_pirate_king: "Pirátský král"
 nick_the_pirate_king_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je postrachem moří a zasévá strach do srdcí všech, kdo se odváží vyplout."
 nick_the_pirate_queen: "Pirátská královna"
 nick_the_pirate_queen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je postrachem moří a zasévá strach do srdcí všech, kdo se odváží vyplout."
 nick_the_rhymer: "[Select_CString( CHARACTER.IsFemale, 'Rýmotepkyně', 'Rýmotepec' )]"
 nick_the_rhymer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] vládne aliterací i souzvučnými dvojveršími a druhové obdivují obratnost, s níž zachází s verši."
 nick_the_elegist: "[Select_CString( CHARACTER.IsFemale, 'Elegička', 'Elegik' )]"
 nick_the_elegist_desc: "Truchlivé a melancholické verše, jimiž [CHARACTER.GetShortUINameNoTooltipNoFormat] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )], vhánějí slzy do očí i těm nejzatvrzelejším posluchačům."
 nick_the_poetaster: "[Select_CString( CHARACTER.IsFemale, 'Veršotepkyně', 'Veršotepec' )]"
 nick_the_poetaster_desc: "Poezie [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] je proslulá, patrně však nikoli z důvodu, který by si [Select_CString( CHARACTER.IsFemale, 'přála', 'přál' )]."
 nick_the_elysian_muse: "Elysejská múza"
 nick_the_elysian_muse_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsFemale, 'proslula', 'proslul' )] v této i mnoha dalších zemích nadpozemskou schopností tvořit velkolepé verše a dokonale ovládá mluvené slovo ve všech jeho podobách."
 nick_iscariot: "[Select_CString( CHARACTER.IsFemale, 'Iškariotská', 'Iškariotský' )]"
 nick_iscariot_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je znám[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] tím, že pro vlastní prospěch zradil[Select_CString( CHARACTER.IsFemale, 'a', '' )] nejpevnější a nejdražší zásady svého srdce."
 nick_the_foreign_mother: "z [CHARACTER.GetMother.GetCulture.GetNameNoTooltip] kultury"
 nick_the_foreign_mother_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se nedokáže zbavit hanby plynoucí z cizího původu své matky a musí snášet záplavu laciných urážek namířených proti jejímu etniku."
 nick_the_foreign_father: "z [CHARACTER.GetFather.GetCulture.GetNameNoTooltip] kultury"
 nick_the_foreign_father_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se nedokáže zbavit hanby plynoucí z cizího původu svého otce a musí snášet záplavu laciných urážek namířených proti jeho etniku."
 nick_the_corpulent: "[Select_CString( CHARACTER.IsFemale, 'Otylá', 'Otylý' )]"
 nick_the_corpulent_desc: "Koně i podlahy se chvějí pod rosolovitou horou masa, kterou je [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_insubordinate: "[Select_CString( CHARACTER.IsFemale, 'Neposlušná', 'Neposlušný' )]"
 nick_the_insubordinate_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je vždy připraven[Select_CString( CHARACTER.IsFemale, 'a', '' )] klást odpor a oplácet každou křivdu, takže je příšerným služebníkem a nevěrným vazalem."
 nick_the_backstabber: "[Select_CString( CHARACTER.IsFemale, 'Zákeřnice', 'Zákeřník' )]"
 nick_the_backstabber_desc: "Na příkaz [CHARACTER.GetShortUINameNoTooltipNoFormat] skončil mezi lopatkami nejeden nůž, skutečný i obrazný."
 nick_the_corrupt: "[Select_CString( CHARACTER.IsFemale, 'Zkorumpovaná', 'Zkorumpovaný' )]"
 nick_the_corrupt_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je vychytralým tvorem usazeným na zlatém pokladu pochybného původu."
 nick_the_incompetent: "[Select_CString( CHARACTER.IsFemale, 'Neschopná', 'Neschopný' )]"
 nick_the_incompetent_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nebyl[Select_CString( CHARACTER.IsFemale, 'a', '' )] stvořen[Select_CString( CHARACTER.IsFemale, 'a', '' )] pro moc a odpovědnost, které [Select_CString( CHARACTER.IsFemale, 'jí', 'mu' )] byly vloženy do rukou."
 nick_the_gambler: "[Select_CString( CHARACTER.IsFemale, 'Hazardérka', 'Hazardér' )]"
 nick_the_gambler_desc: "Sázky [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] jsou ohromné i při mizivé naději na úspěch... a #EMP obzvláště#! tehdy, když je ve hře mnoho."
 nick_the_obscene: "[Select_CString( CHARACTER.IsFemale, 'Nestoudná', 'Nestoudný' )]"
 nick_the_obscene_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je nechvalně znám[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] otevřenou a sprostou vulgaritou. Nevinnost v doslechu dlouho nepřežije."
 nick_the_miser: "[Select_CString( CHARACTER.IsFemale, 'Lakomice', 'Lakomec' )]"
 nick_the_miser_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je chorobně lakom[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )], k velké nelibosti služebnictva i příbuzných."
 nick_the_unfortunate: "[Select_CString( CHARACTER.IsFemale, 'Nešťastnice', 'Nešťastník' )]"
 nick_the_unfortunate_desc: "Na samotné existenci [CHARACTER.GetShortUINameNoTooltipNoFormat] je cosi... neblahého. Stát ve stínu [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] korouhve znamená zakoušet neklid."
 nick_brown_cheeks: "Hnědé půlky"
 nick_brown_cheeks_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se pokusil[Select_CString( CHARACTER.IsFemale, 'a', '' )] rozpoutat vzpouru proti svému vůdci... a pořádně se podělal[Select_CString( CHARACTER.IsFemale, 'a', '' )] strachy."
 nick_the_drunkard_michael_iii: "Opilec"
 nick_the_drunkard_michael_iii_desc: "Litujme Michaela, mladého císaře, kterého srazila jeho nanejvýš #EMP nekřesťanská#! nestřídmost v pití. Je poučením pro nás všechny, že urozený původ může naznačovat nadání, ale nezaručuje je."
 nick_the_pious_michael_iii: "Pobožný"
 nick_the_pious_michael_iii_desc: "Přestože Michaelův život ukončila tragická nehoda pozoruhodně záhy, za svou #EMP zásadní#! úlohu při ukončení obrazoborectví jistě požívá vysoké přízně nebes."
 nick_the_young_michael_iii: "Mladý"
 nick_the_young_michael_iii_desc: "Michael vládl od útlého dětství, a proto působí jako krutý žert, že jeho vláda trvala tak dlouho, zatímco on zemřel tak mladý. Nešťastnou náhodou."
 nick_the_exile: "[Select_CString( CHARACTER.IsFemale, 'Vyhnankyně', 'Vyhnanec' )]"
 nick_the_exile_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] byl[Select_CString( CHARACTER.IsFemale, 'a', '' )] vyhnán[Select_CString( CHARACTER.IsFemale, 'a', '' )] z vlasti nebo ji opustil[Select_CString( CHARACTER.IsFemale, 'a', '' )], aby unikl[Select_CString( CHARACTER.IsFemale, 'a', '' )] nepředvídanému břemenu a nalezl[Select_CString( CHARACTER.IsFemale, 'a', '' )] útočiště v cizině."
 nick_lackland_young: "Bezzemek"
 nick_lackland_young_desc: "Ubohý [CHARACTER.GetShortUINameNoTooltipNoFormat], narozený jako mladší syn po boku zástupu znamenitých bratrů. Jak by vůbec mohl očekávat, že někdy bude vládnout něčemu významnému?"
 nick_lackland_ironic: "$nick_lackland_young$"
 nick_lackland_ironic_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] možná kdysi býval[Select_CString( CHARACTER.IsFemale, 'a', '' )] bezvýznamným potomkem významnějších předků, navzdory nepřízni osudu a nepokrytému pochechtávání si však dokázal[Select_CString( CHARACTER.IsFemale, 'a', '' )] vydobýt úctyhodnou doménu."
 nick_lackland_old: "$nick_lackland_young$"
 nick_lackland_old_desc: "Jak potupné musí být pro [CHARACTER.GetShortUINameNoTooltipNoFormat] získat tak rozsáhlé državy a následně o značnou část z nich přijít. A jak prorocké se ukázalo [Select_CString( CHARACTER.IsFemale, 'její', 'jeho' )] přízvisko."
 nick_curtmantle: "Krátký plášť"
 nick_curtmantle_desc: "Praktický člověk [CHARACTER.GetShortUINameNoTooltipNoFormat] dává před okázalými a zdobenými oděvy přednost kratším cestovním plášťům."
 nick_pauper_king: "Žebrácký král"
 nick_pauper_king_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je znám[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] tím, že často popíjí s obyvateli svých měst."
 nick_the_mapmaker: "[Select_CString( CHARACTER.IsFemale, 'Kartografka', 'Kartograf' )]"
 nick_the_mapmaker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je znám[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] dalekými cestami i značným množstvím času stráveného kreslením map navštívených krajů."
 nick_the_ploughman: "[Select_CString( CHARACTER.IsFemale, 'Oráčka', 'Oráč' )]"
 nick_the_ploughman_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] byl[Select_CString( CHARACTER.IsFemale, 'a', '' )] tehdy pouhým prostým rolníkem a poslové, kteří [Select_CString( CHARACTER.IsFemale, 'ji', 'ho' )] přišli povolat na trůn, [Select_CString( CHARACTER.IsFemale, 'ji nalezli', 'ho nalezli' )] u pluhu."
 nick_the_dreadful: "[Select_CString( CHARACTER.IsFemale, 'Hrůzná', 'Hrůzný' )]"
 nick_the_dreadful_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] věří, že úctu lze získat jedině strachem."
 nick_shinno: "Šinnó"
 nick_shinno_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je znám[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] tím, že se prohlásil[Select_CString( CHARACTER.IsFemale, 'a', '' )] za „nového císaře“ Japonska a vedl[Select_CString( CHARACTER.IsFemale, 'a', '' )] povstání proti ústřední vládě."
 nick_murasaki_shikibu: "Murasaki Šikibu"
 nick_murasaki_shikibu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] je známá pod přízviskem #EMP Murasaki Šikibu#!, odvozeným od purpurové barvy #EMP murasaki#! květu vistárie zvaného #EMP fudžiwara#!, podle něhož získal jméno její rod, a od postavení jejího otce v #EMP Šikibušó#!, ministerstvu obřadních záležitostí."
 nick_izumi_shikibu: "Izumi Šikibu"
 nick_izumi_shikibu_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] je známá pod přízviskem #EMP Izumi Šikibu#!, odvozeným od úřadu jejího manžela jako správce provincie #EMP Izumi#! a od postavení jejího otce v #EMP Šikibušó#!, ministerstvu obřadních záležitostí."
 nick_sei_shonagon: "Sei Šónagon"
 nick_sei_shonagon_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] je známá pod přízviskem #EMP Sei Šónagon#!, odvozeným od #EMP Sei#!, čínského čtení jejího rodového jména #EMP Kijohara#!, a od úřadu jednoho z jejích mužských příbuzných jako #EMP šónagona#!, nižšího státního rady."
 nick_the_fierce: "[Select_CString( CHARACTER.IsFemale, 'Urputná', 'Urputný' )]"
 nick_the_fierce_desc: "Pověstná houževnatost [CHARACTER.GetShortUINameNoTooltipNoFormat] kráčí daleko před [Select_CString( CHARACTER.IsFemale, 'ní', 'ním' )]."
 nick_tenjin: "Tendžin"
 nick_tenjin_desc: "Věří se, že se [CHARACTER.GetShortUINameNoTooltipNoFormat] po nespravedlivém zacházení stal[Select_CString( CHARACTER.IsFemale, 'a', '' )] pomstychtivým duchem a nyní je uctíván[Select_CString( CHARACTER.IsFemale, 'a', '' )] jako nebeská bytost."
 nick_ushiwakamaru: "Ušiwakamaru"
 nick_ushiwakamaru_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je znám[Select_CString( CHARACTER.IsFemale, 'á', 'ý' )] silou a houževnatostí mladého býka a lidé v [Select_CString( CHARACTER.IsFemale, 'jejím', 'jeho' )] okolí se [Select_CString( CHARACTER.IsFemale, 'jí', 'ho' )] obávají."
 nick_ho_seung: "Hosung"
 nick_ho_seung_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] je opředen[Select_CString( CHARACTER.IsFemale, 'a', '' )] legendou o tygrovi, který zahynul po pádu do jámy, znovuzrodil se jako člověk a stal se mnichem. Podle této legendy není oním mnichem nikdo jiný než [CHARACTER.GetShortUINameNoTooltipNoFormat]."
