 party_baron_friendly_enough_modifier: "Dostatečná přívětivost"
 party_baron_friendly_enough_modifier_desc: "Je docela dobře možné mít až příliš mnoho „přátel“"
 party_baron_if_you_cannot_be_loved_modifier: "Když tě nemohou milovat"
 party_baron_accommodating_modifier: "Vycházení vstříc ostatním"
 party_baron_condemned_pb_modifier: "Neoblíbené odsouzení"
 party_baron_condemned_pb_modifier_desc: "Tato postava se špatně vyjádřila o někom velmi oblíbeném"
 party_baron_praised_pb_modifier: "Neochotná chvála"
 party_baron_praised_pb_modifier_desc: "Tato postava neochotně pochválila někoho velmi oblíbeného"
 party_baron_murdered_the_joy_of_life_modifier: "Zabití radosti ze života"
 party_baron_murdered_the_joy_of_life_modifier_desc: "Proč by někdo něco takového dělal?"
 party_baron_great_mercenary_deal_modifier: "Výhodné žoldnéřské smlouvy"
 party_baron_ended_the_party_modifier: "Ukončení oslavy"
 party_baron_ended_the_party_modifier_desc: "Tato postava připravila nejvelkolepější hostiny všech dob o jejich hodovní síň"
 party_baron_subversive_tactics_modifier: "Podvratná taktika"
 party_baron_reflection_modifier: "Osobní rozjímání"
 party_baron_beloved_by_all_except_modifier: "Obliba u všech kromě..."
 party_baron_endorsed_successor_modifier: "Podpořený nástupce"
 party_baron_endorsed_successor_modifier_desc: "Nejoblíbenější člověk na světě vyjádřil tomuto novému vládci svou podporu"
 party_baron_header: "Hostina bez konce"
 party_baron_negative_attitude_counter_stress_tt: "Kvůli svému #V negativnímu postoji#! vůči [TARGET_CHARACTER.GetShortUIName]:"
 party_baron_positive_attitude_counter_stress_tt: "Kvůli svému #V pozitivnímu postoji#! vůči [TARGET_CHARACTER.GetShortUIName]:"
 party_baron_move_towards_positive_tt: "Posun k #V pozitivnímu postoji#! vůči [party_baron.GetShortUIName]"
 party_baron_move_towards_negative_tt: "Posun k #V negativnímu postoji#! vůči [party_baron.GetShortUIName]"
 party_baron.1001.t: "$party_baron_header$"
 party_baron.1001.desc: "Zdá se, že jméno jednoho z nižších šlechticů mají všichni neustále na jazyku. Pořád poslouchám, jak úžasná je společnost [party_baron.GetTitledFirstName], jak se v [Select_CString( party_baron.IsFemale, 'její', 'jeho' )] přítomnosti každý cítí příjemně a jak pořádá ty #EMP nejlepší#! hostiny.\n\nKaždý [party_baron.GetShortUIName] zná a může dosvědčit [Select_CString( party_baron.IsFemale, 'její', 'jeho' )] přívětivost a štědrost. Alespoň to všichni dychtivě tvrdí."
 party_baron.1001.a: "Možná bych se mohl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] z obliby [party_baron.GetShortUIName] něčemu přiučit..."
 party_baron.1001.b: "Ale chválou by měli zahrnovat především #EMP mě#!!"
 party_baron.1001.c: "S tímto člověkem bych se měl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] seznámit!"
 party_baron.1001.c.tt: "Napiš dopis [party_baron.GetTitleAsName]"
 party_baron.1002.opening: "[party_baron.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 party_baron.1002.desc: "Děkuji ti za laskavá slova na pozdrav! Je příjemné slyšet někoho, kdo skutečně chápe, že pravá radost je ta, kterou přinášíš ostatním.\n\nDoufám, že tě jednoho dne budu moci přivítat jako vzácného hosta. Ačkoli je ode mě troufalé něco takového říkat, doufám také, že mě jednou začneš považovat za [Select_CString( party_baron.IsFemale, 'přítelkyni', 'přítele' )]."
 party_baron.1002.a: "Působí velmi příjemně, dokonce i v dopise!"
 party_baron.1003.desc: "Připadá mi, jako bych na okamžik zamhouřil[Select_CString( ROOT.Char.IsFemale, 'a', '' )] oči a všechno zmeškal[Select_CString( ROOT.Char.IsFemale, 'a', '' )]. Ještě před chvílí [party_baron.GetFirstName] vládl[Select_CString( party_baron.IsFemale, 'a', '' )] bezvýznamné baronii a nyní nade mnou vládne jako [party_baron_header.GetTitleAsName]...\n\nSvět se obrátil vzhůru nohama rychleji, než jsem si dokázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] představit."
 party_baron.1003.a: "Alespoň se můj nový [party_baron.GetTitleAsName] chová štědře."
 party_baron.1003.b: "Raději zapomeňme na všechno, co jsem řekl[Select_CString( ROOT.Char.IsFemale, 'a', '' )]..."
 party_baron.2001.t: "$party_baron_header$"
 party_baron.2001.negative: "Zdá se, že se [party_baron.GetTitledFirstName] bez jakéhokoli pobízení či svolení z vlastní iniciativy rozhodl[Select_CString( party_baron.IsFemale, 'a', '' )] promluvit si s [vassal.Custom2('RelationToMe', ROOT.Char )] o mně!\n\nÚdajně mě bez ustání vychvaloval[Select_CString( party_baron.IsFemale, 'a', '' )], ale kvůli tomu jsem vůči [Select_CString( party_baron.IsFemale, 'jejím', 'jeho' )] pohnutkám jen #EMP ještě#! podezíravější!"
 party_baron.2001.positive: "Zdá se, že [party_baron.GetShortUIName] zcela z vlastní iniciativy promluvil[Select_CString( party_baron.IsFemale, 'a', '' )] s [vassal.Custom2('MyCharacterIntroduction', ROOT.Char )] o mně.\n\nMohlo by mě to znepokojovat, kdyby se [vassal.GetFirstNameNoTooltip] nyní nechoval[Select_CString( vassal.IsFemale, 'a', '' )] mnohem přátelštěji a vstřícněji!"
 party_baron.2001.a_positive: "Působivá snaha!"
 party_baron.2001.a_negative: "Dokud je zatím všechno pod kontrolou..."
 party_baron.2001.b_negative: "Především mě by měli obdivovat a naslouchat mi!"
 party_baron.2001.b_positive: "Tak je to správně. Za něco přece stojím."
 party_baron.2002.t: "$party_baron_header$"
 party_baron.2002.desc: "Na hostině se můj pohled střetne s pohledem [party_baron.GetTitledFirstName], když právě hovoří s [new_friend.Custom2('MyCharacterIntroduction', ROOT.Char )]. Navzdory zjevnému porušení dvorských mravů na mě [party_baron.GetSheHe] pokyne, abych přišel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] blíž.\n\n„[ROOT.Char.GetFirstNameNoTooltip]! [new_friend.GetFirstNameNoTooltip] přece znáš, ale myslím, že byste spolu měli trávit více času. Máte toho tolik společného!“"
 party_baron.2002.a: "Zdá se, že [new_friend.GetTitledFirstNameNoTooltip] přece jen neznám dost dobře."
 party_baron.2002.b: "Ale kdepak, známých už mám víc než dost."
 party_baron.2003.desc: "Zjistil[Select_CString( party_baron.IsFemale, 'a', '' )] jsem, že [owner.Custom2('YourCharacterIntroduction', ROOT.Char)] zosnoval[Select_CString( owner.IsFemale, 'a', '' )] plán na tvou vraždu!\n\nNeměj však obavy. Promluvil[Select_CString( party_baron.IsFemale, 'a', '' )] jsem s [Select_CString( owner.IsFemale, 'ní', 'ním' )] a přiměl[Select_CString( party_baron.IsFemale, 'a', '' )] [Select_CString( owner.IsFemale, 'ji', 'ho' )] pochopit, že se vydal[Select_CString( owner.IsFemale, 'a', '' )] špatnou cestou. Vražda je přece skutečně odporná, nemyslíš?"
 party_baron.2003.a: "Děkuji ti za... záchranu života?"
 party_baron.2003.repentant_cannot_scheme: "Dokud [owner.GetShortUIName] činí pokání, nemůže proti tobě zahájit [hostile_schemes|E]"
 party_baron.2003.b: "[owner.GetShortUIName|U] se chystal[Select_CString( owner.IsFemale, 'a', '' )] udělat #EMP co?!#!"
 party_baron.2003.c: "Jak přesně se o tomto spiknutí [party_baron.GetShortUIName] jen tak „dozvěděl[Select_CString( party_baron.IsFemale, 'a', '' )]“...?"
 party_baron.2004.t: "$party_baron_header$"
 party_baron.2004.desc: "Nelze poznat, zda je [party_baron.GetTitledFirstName] opil[Select_CString( party_baron.IsFemale, 'á', 'ý' )], nebo pouze omámen[Select_CString( party_baron.IsFemale, 'á', 'ý' )] duchem oslav, které kolem [Select_CString( party_baron.IsFemale, 'ní', 'něj' )] probíhají. Ať už je příčinou cokoli, pocítím to také, jakmile mě obejme.\n\n„Víš,“ říká [party_baron.GetSheHe], „opravdu si myslím, že jsi jeden z mých nejlepších přátel.“\n\nPo zbytek večera většinou sleduji, jak se baví. Začínám věřit, že [Select_CString( party_baron.IsFemale, 'jí', 'mu' )] možná rozumím lépe než kdokoli z lidí, kteří připíjejí na [Select_CString( party_baron.IsFemale, 'její', 'jeho' )] počest."
 party_baron.2004.a: "Ty pro mě také, [party_baron.GetFirstNameNoTooltip]..."
 party_baron.2005.t: "$party_baron_header$"
 party_baron.2005.desc: "Překvapí mě, ale zároveň potěší, když [party_baron.GetTitledFirstName] dorazí ke mému dvoru. Ještě více mě překvapí, když si přeje promluvit si se mnou o samotě.\n\n„Nechtěl[Select_CString( party_baron.IsFemale, 'a', '' )] jsem, aby to zaznělo na hostině nebo oslavě.“ [party_baron.GetSheHe|U] působí nezvykle vážně a pro jednou [Select_CString( party_baron.IsFemale, 'jí', 'mu' )] chybí obvyklý bezstarostný úsměv. „Nedokážu vyjádřit, kolik pro mě znamenáš. Mám mnoho přátel, ale nikoho jako tebe. Doufám, že nám naše přátelství vydrží až do konce našich dnů.“"
 party_baron.2005.a: "„Já také, [party_baron.GetFirstNameNoTooltip]. Já také.“"
 party_baron.2006.desc: "Když jsem obdržel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] pozvání na hostinu pořádanou při „velmi zvláštní příležitosti“, musel[Select_CString( ROOT.Char.IsFemale, 'a', '' )] jsem oslavu [party_baron.GetTitledFirstNamePossessive] spatřit na vlastní oči. A jaká to byla noc!\n\nSotva si vzpomínám, kdy jsem byl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] šťastnější, a nyní mám pocit, jako by se mi vrátila část chuti do života!"
 party_baron.2006.a: "Světe, měj se na pozoru!"
 party_baron.2006.b: "Nebylo to nic zvláštního."
 party_baron.2007.desc: "Dokonce i uprostřed války si [party_baron.GetTitledFirstName] najde způsob, jak provádět své obvyklé kousky. Zatímco přehlížím své vojsko, přijíždí ke mně v čele vlastního malého zástupu!\n\n„Řekl[Select_CString( party_baron.IsFemale, 'a', '' )] jsem si, že se nám bude hodit každá pomocná ruka, a tak jsem promluvil[Select_CString( party_baron.IsFemale, 'a', '' )] s několika lidmi. Ukázalo se, že se k nám touží přidat jako dobrovolníci!“\n\nDobrovolníci...? Neměl[Select_CString( ROOT.Char.IsFemale, 'a', '' )] bych se raději zeptat, odkud se tito vojáci vzali?"
 party_baron.2007.a: "Přesně tohle potřebuji!"
 party_baron.2007.b: "Kdybys chtěl[Select_CString( party_baron.IsFemale, 'a', '' )] skutečně #EMP pomoci#!, přivedl[Select_CString( party_baron.IsFemale, 'a', '' )] bys mi #EMP profesionály!#!"
 party_baron.2007.b_flavor: "Ach. Ty je opravdu přivedeš...?"
 party_baron.3001.t: "$party_baron_header$"
 party_baron.3001.desc: "Lidé jsou do [party_baron.GetTitledFirstName] celí zbláznění a já zkrátka nechápu proč! Vždyť není zase tak úžasn[Select_CString( party_baron.IsFemale, 'á', 'ý' )]. Jen se ke všem chová přátelsky a vyzdvihuje dobré vlastnosti lidí, které potká! Ano, dokonce i neshody s [Select_CString( party_baron.IsFemale, 'ní', 'ním' )] bývají příjemné a přátelské a při obhajobě vlastního přesvědčení se snaží pochopit i to tvoje, ale to přece stále není...\n\nJde mi o to, proč [Select_CString( party_baron.IsFemale, 'ji', 'ho' )] všichni tolik milují?!"
 party_baron.3001.a: "Ukážu jim, kdo si zaslouží obdiv!"
 party_baron.3001.b: "Možná jsem trochu příliš přísn[Select_CString( ROOT.Char.IsFemale, 'á', 'ý' )]..."
 party_baron.3002.t: "$party_baron_header$"
 party_baron.3002.desc: "Nestačí snad, že [party_baron.GetTitledFirstName] všichni milují? Teď musím [Select_CString( party_baron.IsFemale, 'ji', 'ho' )] milovat i #EMP já#!?\n\nNěkolik mých vazalů podepsalo žádost, abych přestal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] pronášet hanlivé výroky o tom neužitečném [party_baron.GetTitleAsName]!"
 party_baron.3002.a: "Já těm drzým hlupákům ukážu pár „hanlivých výroků“."
 party_baron.3002.b: "Trocha mírnosti neuškodí. Alespoň na veřejnosti."
 party_baron.3003.desc: "Ani po všem, co jsem o [Select_CString( party_baron.IsFemale, 'ní', 'něm' )] řekl[Select_CString( ROOT.Char.IsFemale, 'a', '' )], se [party_baron.GetTitledFirstName] nenechá odradit. Dokonce se ke mně na hostině odváží přijít bez doprovodu.\n\n„Mám pocit, že mě příliš nemáš v oblibě.“ Odfrknu si. To tedy vystihl[Select_CString( party_baron.IsFemale, 'a', '' )]. Jenže místo toho, aby přestal[Select_CString( party_baron.IsFemale, 'a', '' )], pokračuje bez zaváhání. „Mohli bychom si na chvíli promluvit?“\n\nVšechno, co následovalo, mi splývá, nakonec se však z hostiny stala jedna z nejlepších v mém životě. Musím připustit, že jsem se možná v [party_baron.GetTitleAsName] přece jen mýlil[Select_CString( ROOT.Char.IsFemale, 'a', '' )]..."
 party_baron.3003.a: "Kdo by si pomyslel, že si mě nakonec získáš, [party_baron.GetFirstNameNoTooltip]!"
 party_baron.3003.b: "Ne! Nic se nezměnilo!"
 party_baron.3004.desc: "Tohle už zašlo příliš daleko! Skutečnost, že [party_baron.GetTitledFirstName] je neustále vyzdvihován[Select_CString( party_baron.IsFemale, 'a', '' )] jako zářný vzor všeho dobrého v lidstvu, mě dohání k šílenství!\n\nAť už panství ovládá jakýmkoli manipulativním kouzlem, toto kouzlo je třeba zlomit."
 party_baron.3004.a: "Zlomit je třeba #EMP [Select_CString( party_baron.IsFemale, 'ji', 'ho' )]#!!"
 party_baron.3004.b: "Nezacházím už... příliš daleko?"
 party_baron.4001.desc: "Se ztrátou [previous_character.Custom2('YourCharacterIntroduction', ROOT.Char)] je těžké se smířit. [Select_CString( previous_character.IsFemale, 'Byla dobrou přítelkyní', 'Byl dobrým přítelem' )] a na to, jakým člověkem [Select_CString( previous_character.IsFemale, 'byla', 'byl' )], můžeš být právem hrd[Select_CString( ROOT.Char.IsFemale, 'á', 'ý' )].\n\nMusí to pro tebe být těžké období, ale věz, že máš mou podporu!"
 party_baron.4001.a: "Děkuji ti za laskavá slova."
 party_baron.4002.opening: "[party_baron.Custom2('AppropriateGreeting', ROOT.Char)]"
 party_baron.4002.desc: "Chápu, že mě nemáš v oblibě. Máš na to právo. Nechápu však, proč se ke mně stále chováš zlomyslně a nepřátelsky, když se k tobě snažím být co nejpřívětivější a nejzdvořilejší.\n\nMěli jsme mnoho příležitostí to urovnat, ale nyní tě žádám naposledy. Prosím, buďme prostě... přátelé."
 party_baron.4002.a: "Jak se opovažuje? Jak se jen opovažuje!"
 party_baron.9001.t: "Konec hostiny"
 party_baron.9001.desc: "[party_baron.GetTitledFirstName] je bolestnou připomínkou, že bez ohledu na to, jak si užíváme života a kolik radosti přinášíme světu, všechno jednou skončí."
 party_baron.9001.a: "Bez [Select_CString( party_baron.IsFemale, 'ní', 'něj' )] bude tento svět chudší."
 party_baron.9001.a.tt: "[party_baron.GetShortUIName] slaví v [party_baron.GetFaith.PositiveAfterLife]"
 party_baron.9001.b: "Zdá se, že falešný úsměv [party_baron.GetShortUIName] na [ROOT.Char.GetFaith.DeathDeityName] nezapůsobil."
 party_baron.9001.b.tt: "[party_baron.GetShortUIName] je konečně nadobro pryč."
 party_baron.9003.t: "$party_baron_header$"
 party_baron.9003.desc_positive: "Nemohu uvěřit, jaké mám štěstí, že mám tohoto člověka po svém boku. Nikdy jsem si nemyslel[Select_CString( ROOT.Char.IsFemale, 'a', '' )], že budu znovu tak šťastn[Select_CString( ROOT.Char.IsFemale, 'á', 'ý' )] jako ve svatební den, jako [Select_CString( ROOT.Char.IsFemale, 'rozechvělá venkovská', 'rozechvělý venkovský' )] [ROOT.Char.Custom('GirlBoy')]. A [party_baron.GetFirstName] přímo zářil[Select_CString( party_baron.IsFemale, 'a', '' )].\n\nKdyž se mi [party_baron.GetShortUINameNoTooltipNoFormat] zadívá do očí a řekne, že si nedokáže představit větší radost než být se mnou navěky, věřím [Select_CString( party_baron.IsFemale, 'jí', 'mu' )]."
 party_baron.9003.desc_negative: "Možná to takhle mělo skončit od samého počátku. Přes všechnu svou nenávist a závist jsem nakonec nedokázal[Select_CString( ROOT.Char.IsFemale, 'a', '' )] odolat kouzlu [party_baron.GetShortUIName].\n\n[party_baron.GetFirstName] zřejmě nikdy nepochyboval[Select_CString( party_baron.IsFemale, 'a', '' )], že k tomu dojde. A nyní, když jsme svoji, působí šťastněji než kdy dříve."
 party_baron.9003.a_positive: "Patřím ti, má lásko!"
 party_baron.9003.a_negative: "Tak sis mě nakonec přece jen získal[Select_CString( party_baron.IsFemale, 'a', '' )], ty okouzlující potvoro!"
