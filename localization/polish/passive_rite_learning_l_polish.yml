l_polish:
 msg_passive_learned_rite: "Poznaný ritus: [LEFT_CHARACTER.GetRite.GetNameNoTooltip]"
 msg_passive_learned_rite_desc: "Po dlouhém pozorování [Select_CString(passive_learn_source.IsFemale,'své','svého')] [GetPlayer.Custom2('CZ_RelationToMeShort_G', passive_learn_source.Self)] [passive_learn_source.Custom('CZ_TitledFirstNameNoTooltip_G')] získáváš [Concept('agnostic_knowledge','znalosti')|E] o [Concept('core_tenets','zásadách')|E] a [Concept('doctrines','doktrínách')|E], které tvoří [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E].
 msg_passive_learned_tenet: "Poznaná zásada: [RIGHT_TENET.GetBaseNameNoTooltip]"
 msg_passive_learned_tenet_desc: "Pozorováním [Select_CString(passive_learn_source.IsFemale,'své','svého')] [GetPlayer.Custom2('CZ_RelationToMeShort_G', passive_learn_source.Self)] [passive_learn_source.Custom('CZ_TitledFirstNameNoTooltip_G')], jak praktikuje [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName], kterou obsahuje [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E], získáváš o této zásadě [Concept('agnostic_knowledge','znalosti')|E].
 msg_passive_learned_tenet_special: "$msg_passive_learned_tenet$"
 msg_passive_learned_tenet_special_desc: "$msg_passive_learned_tenet_desc$"
 msg_passive_learned_tenet_cranial_trophies_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a řídí se [Concept('core_tenet','zásadou')|E] [passive_learn_tenet.GetBaseName]. Díky tomu získáváš [Concept('agnostic_knowledge','znalosti')|E] o jejím pochmurném účelu."
 msg_passive_learned_tenet_ritual_cannibalism_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a ctí [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName]. Díky tomu získáváš [Concept('agnostic_knowledge','znalosti')|E] o této zásadě tak, jak ji tento ritus chápe."
 msg_passive_learned_tenet_human_sacrifice_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a [Select_CString(passive_learn_source.IsFemale,'vykonala','vykonal')] před tebou obřad spojený s [Concept('core_tenet','zásadou')|E] [passive_learn_tenet.GetBaseName]. Získáváš tak o této zásadě [Concept('agnostic_knowledge','znalosti')|E]."
 msg_passive_learned_tenet_warmonger_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a žije podle [Concept('core_tenet','zásady')|E] [passive_learn_tenet.GetBaseName]. Díky tomu získáváš [Concept('agnostic_knowledge','znalosti')|E] o její logice."
 msg_passive_learned_tenet_takamin_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a každý den praktikuje [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName]. Díky tomu získáváš [Concept('agnostic_knowledge','znalosti')|E] o jejích každodenních rytmech."
 msg_passive_learned_tenet_exaltation_of_pain_desc: "Pozorováním [Select_CString(passive_learn_source.IsFemale,'své','svého')] [GetPlayer.Custom2('CZ_RelationToMeShort_G', passive_learn_source.Self)] [passive_learn_source.Custom('CZ_TitledFirstNameNoTooltip_G')], která vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E], získáváš [Concept('agnostic_knowledge','znalosti')|E] o [Concept('core_tenet','zásadě')|E] [passive_learn_tenet.GetBaseName] — ať je jakkoli znepokojivá."
 msg_passive_learned_tenet_sacrificial_ceremonies_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a krok za krokem tě provádí [Concept('core_tenet','zásadou')|E] [passive_learn_tenet.GetBaseName]. Získáváš tak o této zásadě [Concept('agnostic_knowledge','znalosti')|E]."
 msg_passive_learned_tenet_gruesome_festivals_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a ukazuje ti [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName] v celé její okázalosti. Získáváš tak o této zásadě [Concept('agnostic_knowledge','znalosti')|E]."
 msg_passive_learned_tenet_adorcism_desc: "Pozorováním [Select_CString(passive_learn_source.IsFemale,'své','svého')] [GetPlayer.Custom2('CZ_RelationToMeShort_G', passive_learn_source.Self)] [passive_learn_source.Custom('CZ_TitledFirstNameNoTooltip_G')], která vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E], získáváš [Concept('agnostic_knowledge','znalosti')|E] o [Concept('core_tenet','zásadě')|E] [passive_learn_tenet.GetBaseName] tak, jak je v tomto ritu praktikována."
 msg_passive_learned_tenet_hedonistic_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a oddává se [Concept('core_tenet','zásadě')|E] [passive_learn_tenet.GetBaseName]. Díky tomu získáváš [Concept('agnostic_knowledge','znalosti')|E] o její přitažlivosti."
 msg_passive_learned_doctrine: "Poznaná doktrína: [RIGHT_DOCTRINE.GetDescriptiveNameNoTooltip( GetPlayer.GetFaith )]"
 msg_passive_learned_doctrine_desc: "Pozoruješ, jak [Select_CString(passive_learn_source.IsFemale,'tvá','tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] žije podle [Concept('doctrine','doktríny')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )], kterou obsahuje [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E]. Získáváš tak o této doktríně [Concept('agnostic_knowledge','znalosti')|E]."
 msg_passive_learned_doctrine_polygamy_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a žije podle [Concept('doctrine','doktríny')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]. Díky tomu získáváš [Concept('agnostic_knowledge','znalosti')|E] o jejím fungování."
 msg_passive_learned_doctrine_concubines_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a řídí se [Concept('doctrine','doktrínou')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]. Díky tomu získáváš [Concept('agnostic_knowledge','znalosti')|E] o jejím odůvodnění."
 msg_passive_learned_doctrine_consanguinity_unrestricted_desc: "Pozorováním toho, jak [Select_CString(passive_learn_source.IsFemale,'tvá','tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E], získáváš [Concept('agnostic_knowledge','znalosti')|E] o [Concept('doctrine','doktríně')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]. Už ti nepřipadá tak podivná jako kdysi."
 msg_passive_learned_doctrine_deviancy_virtuous_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a otevřeně praktikuje [Concept('doctrine','doktrínu')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]. Získáváš tak [Concept('agnostic_knowledge','znalosti')|E] o této doktríně tak, jak ji její stoupenci chápou."
 msg_passive_learned_doctrine_kinslaying_accepted_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a seznamuje tě s [Concept('doctrine','doktrínou')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]. Je to mrazivé poučení, ale získáváš tak o této doktríně [Concept('agnostic_knowledge','znalosti')|E]."
 msg_passive_learned_doctrine_witchcraft_virtuous_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a pevně se drží [Concept('doctrine','doktríny')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]. Díky tomu získáváš [Concept('agnostic_knowledge','znalosti')|E] o této doktríně."
 msg_passive_learned_doctrine_funeral_sky_burial_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a dodržuje [Concept('doctrine','doktrínu')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]. Získáváš tak [Concept('agnostic_knowledge','znalosti')|E] o jejím významu."
 msg_passive_learned_doctrine_funeral_mummification_desc: "[Select_CString(passive_learn_source.IsFemale,'Tvá','Tvůj')] [GetPlayer.Custom2('RelationToMeShort', passive_learn_source.Self)] [passive_learn_source.GetTitledFirstNameNoTooltip] vyznává [passive_learn_source.GetRite.GetName] [Concept('rite','ritus')|E] a dodržuje [Concept('doctrine','doktrínu')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]. Získáváš tak [Concept('agnostic_knowledge','znalosti')|E] o jejích praktikách."
 message_filter_passive_religious_learning: "@religious_icon! Pasivní náboženské poznávání"
 message_filter_passive_religious_learning_desc: "Pasivně poznáváš [Concept('core_tenet','zásadu')|E], [Concept('doctrine','doktrínu')|E] nebo celý [Concept('rite','ritus')|E] od blízké osoby či [Concept('courtier','dvořana')|E] cizí [Concept('faith','víry')|E]"
 clerical_justifications_perk_passive_learning_effect: "Dvakrát častěji pasivně poznáváš [Concept('core_tenets','zásady')|E], [Concept('doctrines','doktríny')|E] a celé [Concept('rites','rity')|E] od blízkých osob #weak (manželé, přátelé apod.)#! a během [Concept('traveling','cestování')|E]"
 apa_passive_religious_learning_host_title: "[first.GetShortUINameNoTooltip] praktikuje svůj [Concept('rite','ritus')|E]"
 apa_passive_religious_learning_host_tt: "Pozoruješ [first.Custom('CZ_ShortUIName_A')], jak praktikuje [first.GetRite.GetName] [Concept('rite','ritus')|E]"
 apa_passive_religious_learning_guest_title: "[first.GetShortUINameNoTooltip] praktikuje svůj [Concept('rite','ritus')|E]"
 apa_passive_religious_learning_guest_tt: "Pozoruješ [first.Custom('CZ_ShortUIName_A')], jak praktikuje [first.GetRite.GetName] [Concept('rite','ritus')|E]"
 apa_passive_religious_learning_pilgrimage_pool_title: "Učení [first.Custom('CZ_ShortUINameNoTooltip_G')]"
 apa_passive_religious_learning_pilgrimage_pool_tt: "Pozoruješ [first.Custom('CZ_ShortUIName_A')], jak jako místní praktikuje [first.GetRite.GetName] [Concept('rite','ritus')|E]"
 apa_passive_religious_learning_pilgrimage_rite_title: "Místní [Concept('rite','ritus')|E]"
 apa_passive_religious_learning_pilgrimage_rite_tt: "Pozoruješ místní obyvatele, jak praktikují [passive_learn_rite.GetName] [Concept('rite','ritus')|E]"
 msg_hor_learned_tenet_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi studiem sousední [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E] získal [Concept('agnostic_knowledge','znalosti')|E] o [Concept('core_tenet','zásadě')|E] [passive_learn_tenet.GetBaseName]."
 msg_hor_learned_doctrine_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi studiem sousední [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E] získal [Concept('agnostic_knowledge','znalosti')|E] o [Concept('doctrine','doktríně')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]."
 msg_hor_learned_tenet_cranial_trophies_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi prostudoval [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName] [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E] a zaznamenal její pochmurný účel. Získal jsi tak o ní [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_tenet_ritual_cannibalism_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi pozoroval [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName] [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E] tak, jak ji její stoupenci sami praktikují. Získal jsi tak o ní [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_tenet_human_sacrifice_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi zaznamenal praktiky spojené s [Concept('core_tenet','zásadou')|E] [passive_learn_tenet.GetBaseName], kterou uznává [CZFaithAdjDecline(passive_learn_source_faith,'á')] [Concept('faith','víra')|E]. Získal jsi tak o této zásadě [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_tenet_warmonger_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi studoval, jak [CZFaithAdjDecline(passive_learn_source_faith,'á')] [Concept('faith','víra')|E] uplatňuje [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName] v praxi. Získal jsi tak o této zásadě [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_tenet_takamin_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi od [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E] poznal každodenní rytmus [Concept('core_tenet','zásady')|E] [passive_learn_tenet.GetBaseName]. Získal jsi tak o této zásadě [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_tenet_exaltation_of_pain_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] ses při studiu [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E] seznámil s [Concept('core_tenet','zásadou')|E] [passive_learn_tenet.GetBaseName] — jakkoli je znepokojivá — a získal jsi o ní [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_tenet_sacrificial_ceremonies_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi krok za krokem zmapoval [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName] [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E]. Získal jsi tak o ní [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_tenet_gruesome_festivals_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi na vlastní oči spatřil [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName] [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E] v celé její okázalosti. Získal jsi tak o ní [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_tenet_adorcism_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi pozoroval, jak [CZFaithAdjDecline(passive_learn_source_faith,'á')] [Concept('faith','víra')|E] uvádí [Concept('core_tenet','zásadu')|E] [passive_learn_tenet.GetBaseName] do každodenního života. Získal jsi tak o této zásadě [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_tenet_hedonistic_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi při studiu [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E] poznal přitažlivost [Concept('core_tenet','zásady')|E] [passive_learn_tenet.GetBaseName]. Získal jsi tak o této zásadě [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_doctrine_polygamy_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi studoval, jak [CZFaithAdjDecline(passive_learn_source_faith,'á')] [Concept('faith','víra')|E] podle [Concept('doctrine','doktríny')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )] uspořádává své domácnosti. Získal jsi tak o této doktríně [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_doctrine_concubines_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi poznal, jak [CZFaithAdjDecline(passive_learn_source_faith,'á')] [Concept('faith','víra')|E] odůvodňuje [Concept('doctrine','doktrínu')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]. Získal jsi tak o této doktríně [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_doctrine_consanguinity_unrestricted_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] ses při studiu [CZFaithAdjDecline(passive_learn_source_faith,'é')] [Concept('faith','víry')|E] seznámil s [Concept('doctrine','doktrínou')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )], takže ti už nepřipadá cizí. Získal jsi tak o ní [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_doctrine_deviancy_virtuous_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi pozoroval, jak otevřeně [CZFaithAdjDecline(passive_learn_source_faith,'á')] [Concept('faith','víra')|E] praktikuje [Concept('doctrine','doktrínu')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]. Získal jsi tak o této doktríně [Concept('agnostic_knowledge','znalosti')|E] tak, jak ji její stoupenci chápou."
 msg_hor_learned_doctrine_kinslaying_accepted_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi s nemalým znepokojením rozebral, jak [CZFaithAdjDecline(passive_learn_source_faith,'á')] [Concept('faith','víra')|E] ospravedlňuje [Concept('doctrine','doktrínu')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]. Získal jsi tak o této doktríně [Concept('agnostic_knowledge','znalosti')|E]."
 msg_hor_learned_doctrine_witchcraft_virtuous_desc: "Jako hlava [Concept('rite','ritu')|E] [passive_learn_hor.GetRite.GetName] jsi studoval, jak pevně se [CZFaithAdjDecline(passive_learn_source_faith,'á')] [Concept('faith','víra')|E] drží [Concept('doctrine','doktríny')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source_faith.Self )]. Získal jsi tak o této doktríně [Concept('agnostic_knowledge','znalosti')|E]."
