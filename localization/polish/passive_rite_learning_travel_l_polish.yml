l_polish:
 msg_passive_learned_tenet_abroad_desc: "Na místě zvaném [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] pozoruješ [passive_learn_source.Custom('CZ_TitledFirstName_A')], jak vyznává [passive_learn_source.GetRite.GetAdjective] [Concept('rite','ritus')|E]. Získáváš tak [Concept('agnostic_knowledge','znalosti')|E] o [Concept('core_tenet','zásadě')|E] [passive_learn_tenet.GetBaseName]."
 msg_passive_learned_doctrine_abroad_desc: "Na místě zvaném [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] pozoruješ [passive_learn_source.Custom('CZ_TitledFirstName_A')], jak vyznává [passive_learn_source.GetRite.GetAdjective] [Concept('rite','ritus')|E]. Získáváš tak [Concept('agnostic_knowledge','znalosti')|E] o [Concept('doctrine','doktríně')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )]."
 msg_passive_learned_rite_abroad_desc: "Díky [passive_learn_source.Custom('CZ_TitledFirstNameNoTooltip_D')] získáváš [Concept('agnostic_knowledge','znalosti')|E] o [Concept('core_tenets','zásadách')|E] a [Concept('doctrines','doktrínách')|E], které tvoří [passive_learn_source.GetRite.GetAdjective] [Concept('rite','ritus')|E]."
 msg_passive_learned_tenet_pilgrimage_rite_desc: "Na místě zvaném [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] získáváš [Concept('agnostic_knowledge','znalosti')|E] o [Concept('core_tenet','zásadě')|E] [passive_learn_tenet.GetBaseName]. Tuto zásadu obsahuje [passive_learn_rite.GetAdjective] [Concept('rite','ritus')|E]."
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "Na místě zvaném [passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTier] získáváš [Concept('agnostic_knowledge','znalosti')|E] o [Concept('doctrine','doktríně')|E] [passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )]. Tuto doktrínu obsahuje [passive_learn_rite.GetAdjective] [Concept('rite','ritus')|E]."
 rite_travel_events.1000.t: "[passive_learn_rite.GetAdjective] ritus na cestách"
 rite_travel_events.1000.desc: "Padá soumrak a k ohni se k nám přidává někdo, kdo vyznává [passive_learn_rite.GetAdjective] ritus.\n\nS postupující nocí se dělíme o [passive_learn_source.Custom('RegionalDrink')], [passive_learn_source.Custom('RegionalEdibleMeat')] a příběhy. [passive_learn_source.GetTitledFirstName] začne vyprávět o posvátném učení svého lidu a o tom, jak tento ritus utváří každodenní život a obřady. Z každého slova čiší hluboké přesvědčení."
 rite_travel_events.1000.a: "Velmi poučné."
 rite_travel_events.1000.b: "[Select_CString(passive_learn_source.IsFemale,'Měla by se ke mně přidat.','Měl by se ke mně přidat.')]"
 rite_travel_events.1000.c: "Takovému kacířství nehodlám naslouchat."
 rite_travel_events.2000.t: "Zjevení"
 rite_travel_events.2000.desc: "Putování mě vede oblastí zvanou [location.GetName], přes krajinu typu [location.GetTerrain.GetNameNoTooltip], když narazím na shromážděný dav.\n\nZ davu zazní kázání o něčem, čemu se říká [passive_learn_tenet.GetBaseName]. Je to pro mě něco zcela nového, a přesto mě ta slova zasahují.\n\nMým úmyslem bylo projít kolem. Místo toho naslouchám.\n\nTohle... tohle je pravda."
 rite_travel_events.2000.a: "[ROOT.Char.GetFaith.HighGodName] to ode mě očekává."
 rite_travel_events.2000.b: "[Select_CString(ROOT.Char.IsFemale,'Nejsem žádná pohanka!','Nejsem žádný pohan!')]"
