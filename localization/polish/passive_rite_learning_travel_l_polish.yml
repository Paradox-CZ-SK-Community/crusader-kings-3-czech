 msg_passive_learned_tenet_abroad_desc: "Pozorováním [passive_learn_source.GetTitledFirstName] z [passive_learn_source.GetRite.GetAdjective] [rite|E] [CZPrepV(passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip)] [passive_learn_learner.GetCurrentLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')] jste získali [agnostic_knowledge|E] o [passive_learn_tenet.GetBaseName], [core_tenet|E]." # todo: NEW TRANSLATION
 msg_passive_learned_doctrine_abroad_desc: "Pozorováním [passive_learn_source.GetTitledFirstName] z [passive_learn_source.GetRite.GetAdjective] [rite|E] [CZPrepV(passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip)] [passive_learn_learner.GetCurrentLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')] jste získali [agnostic_knowledge|E] o [passive_learn_doctrine.GetDescriptiveName( passive_learn_source.GetFaith.Self )], [doctrine|E]." # todo: NEW TRANSLATION
 msg_passive_learned_rite_abroad_desc: "Díky [passive_learn_source.GetTitledFirstNameNoTooltip] jste získali [agnostic_knowledge|E] o [core_tenets|E] a [doctrines|E] [passive_learn_source.GetRite.GetAdjective] [rite|E]." # todo: NEW TRANSLATION
 msg_passive_learned_tenet_pilgrimage_rite_desc: "[CZPrepV(passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip)|U] [passive_learn_learner.GetCurrentLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')] jste získali [agnostic_knowledge|E] o [passive_learn_tenet.GetBaseName], [core_tenet|E] [passive_learn_rite.GetAdjective] [rite|E]." # todo: NEW TRANSLATION
 msg_passive_learned_doctrine_pilgrimage_rite_desc: "[CZPrepV(passive_learn_learner.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip)|U] [passive_learn_learner.GetCurrentLocation.GetTitle.Custom('CZ_LandedNameNoTier_L')] jste získali [agnostic_knowledge|E] o [passive_learn_doctrine.GetDescriptiveName( passive_learn_rite.GetFaith.Self )], [doctrine|E] [passive_learn_rite.GetAdjective] [rite|E]." # todo: NEW TRANSLATION
 rite_travel_events.1000.t: "Putující [passive_learn_rite.GetAdherentNameNoTooltip]" # todo: NEW TRANSLATION
 rite_travel_events.1000.desc: "Padá soumrak a u ohně se k nám připojí putující [passive_learn_rite.GetAdherentName].\n\nS přibývající nocí sdílíme [passive_learn_source.Custom('RegionalDrink')], [passive_learn_source.Custom('RegionalEdibleMeat')] a příběhy. [passive_learn_source.GetSheHe|U] vypráví o posvátném učení [passive_learn_source.GetHerHis] lidu a o tom, jak se žije a praktikuje [passive_learn_rite.GetNameNoTooltip]. Z každého slova čiší přesvědčení." # todo: NEW TRANSLATION
 rite_travel_events.1000.a: "Velmi poučné." # todo: NEW TRANSLATION
 rite_travel_events.1000.b: "[passive_learn_source.GetSheHe|U] by se měl přidat ke mně." # todo: NEW TRANSLATION
 rite_travel_events.1000.c: "Na takové kacířství nemám náladu." # todo: NEW TRANSLATION
 rite_travel_events.2000.t: "Zjevení" # todo: NEW TRANSLATION
 rite_travel_events.2000.desc: "Při cestě přes [CZTerrain(location,'A')|l] [CZPrepV(location.GetNameNoTooltip)] [CZProvName(location,'L')] narazím na shromážděný dav.\n\nKazatel hovoří o něčem, čemu říká [passive_learn_tenet.GetBaseName]. Nikdy jsem o tom neslyšel, a přesto cítím pravdivost [passive_learn_source.GetHerHis] slov.\n\nChtěl jsem projít kolem. Místo toho naslouchám.\n\nTohle... tohle je pravda." # todo: NEW TRANSLATION
 rite_travel_events.2000.a: "[ROOT.Char.GetFaith.HighGodName] to ode mne očekává." # todo: NEW TRANSLATION
 rite_travel_events.2000.b: "Nejsem žádný pohan!" # todo: NEW TRANSLATION
