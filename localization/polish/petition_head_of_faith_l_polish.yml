l_polish:
 petition_head_of_faith_decision: "Žádost o přízeň: [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 petition_head_of_faith_decision_desc: "Vydej se ke dvoru své [Concept('head_of_faith','hlavy víry')|E] a předlož formální žádost."
 petition_head_of_faith_decision_tooltip: "Vydej se za svou [Concept('head_of_faith','hlavou víry')|E] a požádej o laskavost"
 petition_head_of_faith_decision_head_of_faith_exists: "Tvá [Concept('faith','víra')|E] má v současnosti [Concept('head_of_faith','hlavu víry')|E]"
 NOT_petition_head_of_faith_decision_head_of_faith_exists: "Tvá [Concept('faith','víra')|E] v současnosti nemá [Concept('head_of_faith','hlavu víry')|E]"
 petition_antipope_decision: "Žádost o přízeň: $anti_religious_head_name$"
 petition_antipope_decision_desc: "Vydej se ke dvoru své konkurenční hlavy víry ($anti_religious_head_name$) a předlož formální žádost. [ROOT.Char.GetFaith.ReligiousHeadTitleName] [CZPrepV(ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip)] [CZProvName(ROOT.Char.GetFaith.GetReligiousHead.GetCapitalLocation,'L')] už není tím, koho můžeš žádat o přízeň."
 petition_antipope_decision_tooltip: "Vydej se za svou [Concept('challenger_hof','konkurenční hlavou víry')|E] a požádej o laskavost"
 petition_antipope_decision_confirm: "Připrav žádost"
 petition_head_of_faith_decision_effects_major_piety: "Při přípravě žádosti utratíš [piety_i][EmptyScope.ScriptValue('major_piety_value')|V0] [Concept('piety','zbožnosti')|E]. Částka se ti vrátí, pokud žádost stáhneš, zrušíš [Concept('travel','cestování')|E] nebo bude žádost opuštěna. O tuto částku #EMP přijdeš#!, pokud předneseš své argumenty a nepodaří se ti přesvědčit [petition_recipient.Custom('CZ_ShortUINameNoTooltip_A')]."
 petition_head_of_faith_decision_effects_massive_piety: "Při přípravě žádosti utratíš [piety_i][EmptyScope.ScriptValue('massive_piety_value')|V0] [Concept('piety','zbožnosti')|E]. Částka se ti vrátí, pokud žádost stáhneš, zrušíš [Concept('travel','cestování')|E] nebo bude žádost opuštěna. O tuto částku #EMP přijdeš#!, pokud předneseš své argumenty a nepodaří se ti přesvědčit [petition_recipient.Custom('CZ_ShortUINameNoTooltip_A')]."
 petition_head_of_faith_decision_receptive_favorable: "[petition_recipient.GetShortUIName] tuto žádost #P velmi pravděpodobně přijme#! #weak (Podle [Concept('opinion','mínění')|E], které o tobě má; výsledek můžeš ovlivnit během audience)#!"
 petition_head_of_faith_decision_receptive_neutral: "[petition_recipient.GetShortUIName] tuto žádost #P možná přijme#! #weak (Podle [Concept('opinion','mínění')|E], které o tobě má; výsledek můžeš ovlivnit během audience)#!"
 petition_head_of_faith_decision_receptive_skeptical: "[petition_recipient.GetShortUIName] tuto žádost #N možná odmítne#! #weak (Podle [Concept('opinion','mínění')|E], které o tobě má; výsledek můžeš ovlivnit během audience)#!"
 petition_head_of_faith_decision_receptive_hostile: "[petition_recipient.GetShortUIName] tuto žádost #N velmi pravděpodobně odmítne#! #weak (Podle [Concept('opinion','mínění')|E], které o tobě má, a vašich vzájemných vztahů; výsledek můžeš ovlivnit během audience)#!"
 petition_head_of_faith_decision_excommunication_target_hint: "#weak [Concept('traits','Rysy')|E] tvého cíle, které [petition_recipient.GetFaith.GetName] považuje za [Concept('sinful','hříšné')|E] či [Concept('virtuous','ctnostné')|E], ovlivňují možnosti argumentace během audience.#!"
 petition_head_of_faith_decision_hook_available: "Využij svou [Concept('hook','páku')|E] na [petition_recipient.Custom('CZ_TitledFirstName_A')] a nebude tě to stát [Concept('piety','zbožnost')|E]"
 petition_head_of_faith_decision_cost_major_piety: "Vyžaduje [piety_i][EmptyScope.ScriptValue('major_piety_value')|V0] [Concept('piety','zbožnosti')|E] nebo [Concept('hook','páku')|E]"
 NOT_petition_head_of_faith_decision_cost_major_piety: "$petition_head_of_faith_decision_cost_major_piety$"
 petition_head_of_faith_decision_cost_massive_piety: "Vyžaduje [piety_i][EmptyScope.ScriptValue('massive_piety_value')|V0] [Concept('piety','zbožnosti')|E] nebo [Concept('hook','páku')|E]"
 NOT_petition_head_of_faith_decision_cost_massive_piety: "$petition_head_of_faith_decision_cost_massive_piety$"
 petition_head_of_faith_decision_confirm: "Připrav žádost"
 petition_head_of_faith_excommunication_setup_interaction: "Požádat o exkomunikaci"
 petition_head_of_faith_excommunication_setup_interaction_extra_icon: "$hook_extra_icon$"
 recipient_secondary_petition_head_of_faith_excommunication_setup_interaction: "Cíl"
 petition_head_of_faith_excommunication_setup_interaction_accept_tt: "Cílem tvé cesty bude [recipient.GetCapitalLocation.GetName]. Tam [recipient.Custom('CZ_TitledFirstName_A')] požádáš, ať [Concept('excommunicate','exkomunikuje')|E] [secondary_recipient.Custom('CZ_TitledFirstName_A')]."
 petition_head_of_faith_decision_option_repentance: "Zrušit exkomunikaci"
 petition_head_of_faith_decision_option_excommunication: "Požádat o exkomunikaci"
 petition_head_of_faith_decision_option_repentance_desc: "Požádej o zrušení své [Concept('excommunication','exkomunikace')|E]."
 petition_head_of_faith_decision_option_excommunication_desc: "Požádej o [Concept('excommunication','exkomunikaci')|E] jiného [Concept('ruler','vládce')|E] své [Concept('faith','víry')|E]."
 petition_head_of_faith_repentance_tooltip: "$petition_head_of_faith_decision_option_repentance_desc$"
 petition_head_of_faith_excommunication_tooltip: "$petition_head_of_faith_decision_option_excommunication_desc$"
 petition_head_of_faith_costs_refunded: "Náklady na žádost vráceny"
 unavailable_petition_head_of_faith: "čeká na formální žádost"
 petition_head_of_faith_reclaim_offering_tt: "#weak Prostředky vyhrazené na tuto žádost se ti vrátí:#!"
 petition_head_of_faith.0601.t: "Žádost zmařena"
 petition_head_of_faith.0601.desc.no_head: "Než jsem připraven přednést svou žádost, není už žádného vhodného duchovního pastýře, který by ji mohl vyslyšet."
 petition_head_of_faith.0601.desc.head_dead: "Smrt [recipient.Custom('CZ_TitledFirstName_G')] přišla dříve, než mohla být má žádost vyslyšena."
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.GetTitledFirstName] je ve vězení a nemůže přijímat formální žádosti."
 petition_head_of_faith.0601.desc.head_changed: "Hlava mé víry se změnila a svou žádost už nemohu předložit [recipient.Custom('CZ_TitledFirstName_D')]."
 petition_head_of_faith.0601.desc.at_war: "Formální žádost nemohu předložit, dokud vedu válku proti [recipient.Custom('CZ_TitledFirstName_D')]."
 petition_head_of_faith.0601.desc.repentance_resolved: "Má exkomunikace už neplatí, takže není co rušit."
 petition_head_of_faith.0601.desc.repentance_too_soon: "Od mého posledního pokárání uplynulo příliš málo času, než aby mé pokání bylo vyslyšeno."
 petition_head_of_faith.0601.desc.target_dead: "Smrt [petition_target.Custom('CZ_TitledFirstName_G')] přišla dříve, než mohla být žádost vyslyšena."
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.GetTitledFirstName] už nepatří k mé víře, takže o formální exkomunikaci už nemohu požádat."
 petition_head_of_faith.0601.desc.target_too_low: "Nejvyšší titul [petition_target.Custom('CZ_TitledFirstName_G')] už nedosahuje královské úrovně, takže tento případ nespadá do rámce formální žádosti."
 petition_head_of_faith.0601.desc.target_already_excommunicated: "Exkomunikace [petition_target.Custom('CZ_TitledFirstName_G')] už byla vyhlášena."
 petition_head_of_faith.0601.desc.fallback: "V mé žádosti už nelze pokračovat a celá cesta přichází vniveč."
 petition_head_of_faith.0601.desc.refund.piety: "Zbožný dar vyčleněný na tuto žádost se mi vrací."
 petition_head_of_faith.0601.desc.refund.none: "Alespoň zatím nic nezměnilo majitele."
 petition_head_of_faith.0601.a: "Budiž."
 petition_head_of_faith.1000.t.repentance: "Žádost: Pokání"
 petition_head_of_faith.1000.t.excommunication: "Žádost: Exkomunikace"
 petition_head_of_faith.1000.desc.court_low_grandeur: "Kdysi velkolepý palác kolem mě chátrá v troskách. Modlím se, aby tento úpadek nebyl odrazem duchovní bídy, kterou zosobňuje [recipient.GetFaith.ReligiousHeadName].\n\n"
 petition_head_of_faith.1000.desc.court_high_grandeur: "Palác proslulý velkolepými sály ve mně při vstupu vzbuzuje opravdovou pokoru. Modlím se, aby jeho nebeský lesk odrážel spravedlnost a duchovní bohatství, které sídlí uvnitř.\n\n"
 petition_head_of_faith.1000.desc.intro: "Tam přede mnou sedí Boží místodržící na zemi. "
 petition_head_of_faith.1000.desc.recipient_sinful: "Ačkoli je všeobecně známo, že [recipient.GetTitledFirstName] je [petition_hof_gravest_sin.GetName(recipient)], nějakým ďábelským úskokem se přesto [Select_CString(recipient.IsFemale,'dostala','dostal')] na stolec svatého Petra."
 petition_head_of_faith.1000.desc.recipient_virtuous: "Jistě bude [Select_CString(recipient.IsFemale,'její','jeho')] úsudek veden ctností, vždyť je [petition_hof_gravest_virtue.GetName(recipient)]."
 petition_head_of_faith.1000.desc.health_noble: "\n\nPodlomené zdraví [recipient.Custom('CZ_TitledFirstName_G')] je zjevně plodem života zasvěceného ušlechtilé službě."
 petition_head_of_faith.1000.desc.health_excess: "\n\nPodlomené zdraví [recipient.Custom('CZ_TitledFirstName_G')] je zjevně důsledkem života plného zhoubných požitků."
 petition_head_of_faith.1000.desc.address: "\n\nObracím se se svou žádostí na [recipient.Custom('CZ_TitledFirstName_A')]: „[Select_CString(recipient.IsFemale,'Svatá matko','Svatý otče')], "
 petition_head_of_faith.1000.desc.repentance: "přicházím v pokoře a prosím o zproštění trestu uvaleného na mou duši a o návrat do společenství věřících.“"
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.GetTitledFirstName] má na svědomí zločiny proti Bohu. Přicházím v pokoře pouze přednést obvinění; samozřejmě vám náleží právo vynést soud nad nesmrtelnou duší [petition_target.Custom('CZ_TitledFirstName_G')].“"
 petition_head_of_faith.1000.a.argue: "Přednesu své argumenty."
 petition_head_of_faith.1000.a.argue_tt: "Pokus se během audience přesvědčit [recipient.Custom('CZ_ShortUINameNoTooltip_A')]"
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n„Slyšíme tě, dítě mé. Přednes podrobnosti své žádosti a přijmeme ji s přízní.“"
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n„Tvá žádost je před námi. Posoudíme ji tak, jak vyžadují kanonické právo a svatá církev.“"
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n„Líbivá slova se pronášejí snadno. Tvou žádost přijímáme se skepsí, jakou vyžaduje Pán.“"
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n„Dovoluješ si mnoho, když sem přicházíš. Dobře zvaž svá další slova.“"
 petition_head_of_faith.1000.desc.conclusion: "[recipient.GetTitledFirstName] zmlkne a očekává mou odpověď."
 petition_head_of_faith.1310.t: "Žádost: Pokání [actor.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 petition_head_of_faith.1310.desc.intro: "„[Select_CString(ROOT.Char.IsFemale,'Svatá matko','Svatý otče')], exkomunikace mě zbavila přístupu ke svátostem a odloučila od společenství věřících. Prosím tě, sejmi z mé duše tento trest a navrať mě do společenství,“ pronáší na kolenou [actor.GetTitledFirstName].\n\n„Nejprve ať [ROOT.Char.GetFaith.HighGodName] spatří tvou lítost,“ odpovídám."
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n„Vždy [Select_CString(ROOT.Char.IsFemale,'jsi mi prokazovala','jsi mi prokazoval')] milosrdenství, [Select_CString(ROOT.Char.IsFemale,'Svatá matko','Svatý otče')]. Nežádám o světskou přízeň, jen aby Bůh a svatá církev poznali upřímnost mé lítosti.“"
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n„Před Bohem stojím jako každý, kdo činí pokání, a žádám jen o spravedlnost podle kanonického práva.“"
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n„Neměj mě za [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )] a nemysli si, že tě líbivými slovy chci svést z cesty. [ROOT.Char.GetFaith.HighGodName] i pozemský místodržící božské vůle jsou mi svědky, že činím pokání.“"
 petition_head_of_faith.1310.serpent.christian: "hada v zahradě"
 petition_head_of_faith.1310.serpent.generic: "hada"
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n„Ve světských záležitostech mezi námi panovalo nepřátelství. Nežádám o dobré slovo v pozemských věcech, ale uznej mé pokání a nevydávej mou duši v nebezpečí.“"
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n„Známe tě jako [petition_gravest_sin.GetName(actor)]. Líbivá slova nemohou očistit poskvrněnou duši. Jak napravíš své provinění?“"
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n„S tvým jménem se pojí jen málo neřesti. Možná už exkomunikace splnila svůj nápravný účel. Uvidíme, zda tvá duše odpovídá tomu, jak se jevíš.“"
 petition_head_of_faith.1310.a: "„Povstaň, mé dítě. Navracím tě do společenství věřících.“"
 petition_head_of_faith.1310.b: "„Trest zůstává v platnosti. Vrať se, až bude tvé pokání zjevné.“"
 petition_head_of_faith.1320.t: "Žádost: Exkomunikace [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')]"
 petition_head_of_faith.1320.desc.intro: "„[Select_CString(ROOT.Char.IsFemale,'Svatá matko','Svatý otče')], [petition_target.GetTitledFirstName] má na svědomí zločiny proti Bohu. Pokud tuto hnilobu nevyřízneme, budou ohroženy duše nás všech,“ říká [actor.GetTitledFirstName].\n\n„Exkomunikace není soukromou zbraní světských vládců. Přednes před Bohem jasné obvinění,“ odpovídám."
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n„Vždy [Select_CString(ROOT.Char.IsFemale,'jsi ke mně byla spravedlivá','jsi ke mně byl spravedlivý')], [Select_CString(ROOT.Char.IsFemale,'Svatá matko','Svatý otče')]. Nežádám o světskou přízeň, jen aby Bůh a svatá církev poznali pravdu o proviněních [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')].“"
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n„Před Boha předkládám toto obvinění jako [Select_CString(actor.IsFemale,'prostá poddaná','prostý poddaný')] Pána Ježíše Krista a žádám pouze to, co vyžaduje spravedlnost svaté církve.“"
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n„Neměj mě za hada v zahradě, který líbivými slovy urovnává osobní spor. [ROOT.Char.GetFaith.HighGodName] i pozemský místodržící božské vůle jsou mi svědky, že toto obvinění je spravedlivé.“"
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n„Ve světských záležitostech mezi námi panovalo nepřátelství, ale prosím tě, posuď duši [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')] tak, jak vyžaduje kanonické právo.“"
 petition_head_of_faith.1320.desc.target_sinful: "„Hniloba hříchu [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')] pramení z toho, že [petition_target.GetTitledFirstName] je [petition_gravest_sin.GetName(petition_target)].“"
 petition_head_of_faith.1320.desc.finish: "dodává [actor.GetTitledFirstName]."
 petition_head_of_faith.1320.desc.target_clean: "„[petition_target.GetTitledFirstName] dobře skrývá svou zkaženost, ale věřím, že pokud požádáš Pána o vedení, hřích [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')] vyjde najevo.“"
 petition_head_of_faith.1320.a: "„Vylučuji [petition_target.Custom('CZ_TitledFirstName_A')] ze společenství věřících.“"
 petition_head_of_faith.1320.b: "„Tvá obžaloba není přesvědčivá. Na [petition_target.Custom('CZ_TitledFirstName_A')] žádný církevní trest neuvalím.“"
 petition_head_of_faith.2020.t: "Exkomunikace vyhlášena"
 petition_head_of_faith.2020.desc: "[recipient.GetFaith.ReligiousHeadName] povstává a pronáší Pánův spravedlivý soud:\n\n„Na [petition_target.Custom('CZ_TitledFirstName_A')] uvaluji exkomunikaci a vylučuji [petition_target.Custom('CZ_TitledFirstName_A')] ze společenství věřících. Duše [petition_target.Custom('CZ_TitledFirstName_G')] zůstane v ohrožení, dokud nepřijde opravdové pokání.“"
 petition_head_of_faith.2020.a: "Skrze svého služebníka promlouvá [recipient.GetFaith.HighGodName]."
 petition_head_of_faith.2030.t: "Žádost zamítnuta"
 petition_head_of_faith.2030.desc.intro: "[recipient.GetFaith.ReligiousHeadName] povstává a pronáší Pánův spravedlivý soud:\n\n"
 petition_head_of_faith.2030.desc.cite_sins: "„Hříchy, které uvádíš, nejsou natolik závažné, aby si zasloužily tak strašný trest. Na [petition_target.Custom('CZ_TitledFirstName_A')] exkomunikaci neuvalím.“"
 petition_head_of_faith.2030.desc.finesse: "„Nevylučujeme věřící jen proto, že nám vládce zaplatí. To, co náleží císaři, si nemůže koupit rozsudek, který vynáší [recipient.GetFaith.HighGodName].“"
 petition_head_of_faith.2030.desc.learning_duel: "„Chceš snad [petition_target.Custom('CZ_TitleAsNameNoTooltip_A')] lapit do záměrného překrucování kanonického práva? Na základě... síly tvé učenosti exkomunikaci neuvalím.“"
 petition_head_of_faith.2030.desc.fallback: "„To si dovoluješ příliš! Nevidím žádný důvod uvalit na [petition_target.Custom('CZ_TitledFirstName_A')] exkomunikaci.“"
 petition_head_of_faith.2030.a: "Zřejmě skrze svého služebníka promlouvá [recipient.GetFaith.HighGodName]."
 petition_head_of_faith.2000.t: "Argumentace"
 petition_head_of_faith.2000.desc.atmosphere_aniconism: "„Chceš dokázat provinění [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')] Písmem a církevními kánony? [Select_CString(petition_target.IsFemale,'Poklonila','Poklonil')] se snad rytým modlám?“"
 petition_head_of_faith.2000.desc.atmosphere_khachkar: "„A tak chceš obvinit [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')] pod kamenným křížem, který místní lid uctívá?“"
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: "„Copak [petition_target.GetTitledFirstNameNoTooltip] nezasluhuje milosrdenství Matky Boží? Může snad kdokoli, byť ty, tvrdit, že zůstal neposkvrněn lidským hříchem?“"
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: "„Chceš, abychom kvůli žáru osobního sváru, a ne na základě důkazu těžkého hříchu, vyloučili [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')] z posvátné liturgie?“"
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: "„Chceš [petition_target.Custom('CZ_TitledFirstNameNoTooltip_D')] zapovědět Kristův oltář? Odepřít [petition_target.Custom('CZ_TitledFirstNameNoTooltip_D')] pokrm těla našeho Pána? Nemá už [petition_target.GetTitledFirstNameNoTooltip] pít z krve Páně?“"
 petition_head_of_faith.2000.desc.atmosphere_communion: "„Považuješ za správné vyloučit [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')] ze společenství věřících?“"
 petition_head_of_faith.2000.desc.atmosphere_confession: "„Chceš, abychom proti [petition_target.Custom('CZ_TitledFirstNameNoTooltip_D')] zasáhli na základě toho, co zaznělo pod zpovědním tajemstvím?“"
 petition_head_of_faith.2000.desc.atmosphere_purgatory: "„Chceš, abychom [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')] vyloučili, když mírnější prostředky ještě mohou [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')] odvrátit od hříchu?“"
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: "„Dovoláváš se autority apoštolů a chceš, abychom [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')] odsoudili na zemi i na nebi?“"
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: "„Vyrušuješ nás od studia kánonů, abychom odsoudili [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')]. Je snad tvá argumentace opřena o spisy církevních otců a Písmo?“"
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: "„Chceš nás pohnout proti [petition_target.Custom('CZ_TitledFirstNameNoTooltip_D')] kvůli krvi prolité ve svatém čase či násilí na církevní půdě? [Select_CString(petition_target.IsFemale,'Porušila','Porušil')] snad [petition_target.GetTitledFirstNameNoTooltip] Boží mír a příměří?“"
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: "„Je opravdu nejlepší soudit tvou křivdu vůči [petition_target.Custom('CZ_TitledFirstNameNoTooltip_D')] právě zde? Nebylo by lepší přijmout kříž a společně vytáhnout do války proti nepřátelům Krista?“"
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: "„Přicházíš za námi, abychom vyloučili [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')], zatímco se pět patriarchálních stolců snaží udržet pohromadě rozhádané křesťanstvo? Myslíš, že za tvým obviněním bude stát [Glossary( 'oikoumene', 'OIKOUMENE_GLOSS' )] jako celek?“"
 petition_head_of_faith.2000.desc.atmosphere_dulia: "„[Select_CString(petition_target.IsFemale,'Znevážila','Znevážil')] snad [petition_target.GetTitledFirstNameNoTooltip] otevřeným opovržením úctu k mučedníkům?“"
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: "„Chceš, abychom [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')] vyloučili. Dokaž nám tedy, že [petition_target.GetTitledFirstNameNoTooltip] žije v neposlušnosti a zahálce, neboť právě zahálka je nepřítelem duše.“"
 petition_head_of_faith.2000.desc.atmosphere_original_sin: "„Chceš, abychom [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')] odsoudili, jako by Adamova vina přešla pouze na [petition_target.Custom('CZ_TitledFirstNameNoTooltip_A')]? Každá duše přichází na svět zraněná Pádem a církev vylučuje jen ty, kdo se oddávají své hříšné náklonnosti.“"
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: "„Přicházíš v celé své nádheře a hlasitě žádáš spravedlnost proti [petition_target.Custom('CZ_TitledFirstNameNoTooltip_D')], zatímco naši bratři putují mezi chudými jen v šatech, které mají na sobě. Neradil by žebravý mnich spíše trpělivost, nebo je ten hřích opravdu tak závažný?“"
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: "„Chceš [petition_target.Custom('CZ_TitledFirstNameNoTooltip_D')] odepřít svátosti. Chceš ohrozit podíl [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')] na bohatství věčného života s Kristem v nebi? Vždyť slib chudoby skládáme na zemi.“"
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: "„Chceš, abychom vyloučili [Select_CString(petition_target.IsFemale,'Kristovu bojovnici','Kristova bojovníka')] na základě svědectví nepřítele [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')]?“"
 petition_head_of_faith.2000.desc.atmosphere_fallback: "„Jak má podle tebe svatá církev urovnat tvůj spor s [petition_target.Custom('CZ_TitledFirstNameNoTooltip_I')]?“"
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n„Musíš vědět, že exkomunikaci nepoužíváme jako soukromou zbraň světského vládce. Sami posoudíme, jaké spravedlnosti má být učiněno zadost. Přednes svůj případ před Bohem!“ požaduje [Select_CString(recipient.IsFemale,'Svatá matka','Svatý otec')]."
 petition_head_of_faith.2000.desc.target_sinful: "\n\nAčkoli slova, jež pronáší [recipient.GetFaith.GetReligiousHeadTitle.GetName], musí působit nestranně, je zřejmé, že zvěsti o hříšné povaze [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')] už dorazily do těchto posvátných síní. Stačí, když potvrdím provinění [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')]."
 petition_head_of_faith.2000.desc.target_clean: "\n\nZdá se, že [recipient.GetTitledFirstName] ví, že [petition_target.GetTitledFirstNameNoTooltip] [Select_CString(petition_target.IsFemale,'není poskvrněna','není poskvrněn')] hříchem. Když nemám žádný důkaz zkaženosti, který bych mohl předložit dvoru, musím najít jinou cestu ke spravedlnosti, kterou hledám."
 OIKOUMENE_GLOSS: "Řecky „obydlený svět“. Ve východořímském prostředí označovala #bold oikoumene#! civilizovaný svět: říši a širší křesťanský řád, nad nímž bděla její církev."
 petition_head_of_faith.2000.a.cite_sins: "Prohlaš před Bohem, že [petition_target.GetTitledFirstNameNoTooltip] je [petition_gravest_sin.GetName(petition_target)]."
 petition_head_of_faith.2000.a.cite_sins_fallback: "Před Bohem vyjmenuj hříchy [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')]."
 petition_head_of_faith.2000.b.finesse: "„Církev má mnoho potřeb. Dovolte mi postarat se alespoň o některé.“"
 petition_head_of_faith.2000.c.learning_duel: "Odvolám se na méně známé pasáže Písma a lapím tak [Select_CString(petition_target.IsFemale,'zlovolnou','zlovolého')] [petition_target.Custom('CZ_TitleAsNameNoTooltip_A')]."
 petition_head_of_faith.2000.d.hook: "Možná [recipient.GetFaith.ReligiousHeadName] potřebuje připomenout jisté... soukromé záležitosti."
 petition_head_of_faith.2000.e.withdraw: "...možná to musí vyřešit [petition_target.GetFaith.HighGodName] společně s [petition_target.Custom('CZ_TitledFirstNameNoTooltip_I')]."
 petition_head_of_faith.5000.e.withdraw: "...možná na to [Select_CString(ROOT.Char.IsFemale,'ještě nejsem připravena','ještě nejsem připraven')]."
 petition_head_of_faith_hook_committed_tt: "K prosazení tohoto výsledku používáš [Concept('hook','páku')|E]"
 petition_head_of_faith_target_cite_sins_unavailable_tt: "U [petition_target.Custom('CZ_TitledFirstNameNoTooltip_G')] převažují ctnosti nad hříchy"
 petition_head_of_faith_duel_success: "[recipient.GetFaith.ReligiousHeadName] přijímá tvé argumenty"
 petition_head_of_faith_cite_sins_success_desc: "[recipient.GetFaith.ReligiousHeadName] považuje tvá obvinění za přesvědčivá"
 petition_head_of_faith_cite_sins_failure_desc: "[recipient.GetFaith.ReligiousHeadName] nepovažuje tvá obvinění za přesvědčivá"
 petition_head_of_faith_argument_affronted: "[recipient.GetFaith.ReligiousHeadName] reaguje pohoršeně"
 petition_head_of_faith_argument_dismissed: "[recipient.GetFaith.ReligiousHeadName] odmítá tvou argumentaci"
 petition_head_of_faith_affronted_opinion: "Pohoršení nad úplatkem"
 petition_head_of_faith_affronted_opinion_desc: "Tuto postavu urazila troufalost někoho, kdo se pokusil koupit si zlatem náboženský rozsudek."
 petition_head_of_faith_dismissed_debate_opinion: "Argumentace bez účinku"
 petition_head_of_faith_dismissed_debate_opinion_desc: "Tato postava odmítla argumentaci, která překrucovala kanonické právo a nedokázala ji přesvědčit."
 petition_head_of_faith_repentance_setup_interaction: "Požádat o rozhřešení"
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$"
 petition_head_of_faith_repentance_setup_interaction_desc: "Vydej se za svou [Concept('head_of_faith','hlavou víry')|E] a pros o zrušení své [Concept('excommunication','exkomunikace')|E]."
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "Vydáš se do [CZProvName(recipient.GetCapitalLocation,'G')] a formálně požádáš [recipient.Custom('CZ_TitledFirstName_D')] o zrušení své [Concept('excommunication','exkomunikace')|E]"
 petition_head_of_faith.5000.t: "Zpověď"
 petition_head_of_faith.5000.desc.atmosphere_aniconism: "„Přicházíš pro rozhřešení. [Select_CString(ROOT.Char.IsFemale,'Klaněla ses','Klaněl ses')] rytým modlám s vědomím, že tě může očistit jen Písmo a pokání?“"
 petition_head_of_faith.5000.desc.atmosphere_khachkar: "„Doufám, že přicházíš prosit o rozhřešení k patě vytesaného kamenného kříže.“"
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: "„Matka Boží oplývá milosrdenstvím, ale jen kvůli ní tě tohoto trestu zprostit nemůžeme.“"
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: "„Znovu toužíš po božské liturgii. Zamysli se nad tím, co tě vzdálilo od oltáře a společenství věřících.“"
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: "„Kristův oltář i pokrm jeho těla a krve jsou ti zapovězeny.“"
 petition_head_of_faith.5000.desc.atmosphere_communion: "„Stojíš mimo společenství věřících.“"
 petition_head_of_faith.5000.desc.atmosphere_confession: "„Svátost zpovědi vyžaduje úplné a pravdivé vyznání.“"
 petition_head_of_faith.5000.desc.atmosphere_purgatory: "„Exkomunikace je lékem církve. Darem, který ti umožňuje napravit svůj život a zkrátit svůj pobyt v očistci.“"
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: "„Držíme klíče Petrovy. Tato pravomoc tě může zprostit trestu, pokud skutečně činíš pokání.“"
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: "„Usiluješ o smíření. Dokaž podle kapitol a distinkcí Dekretu, že bylo právu učiněno zadost.“"
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: "„Bylo tvým hříchem porušení Božího míru a příměří? Došlo z tvé ruky k prolití krve ve svatém čase?“"
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: "„Pokud [Select_CString(ROOT.Char.IsFemale,'jsi přijala','jsi přijal')] kříž jen podle jména a přesto [Select_CString(ROOT.Char.IsFemale,'škodila','škodil')] křesťanstvu, dobře víš, že došlo k porušení zákona.“"
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: "„Pět patriarchálních stolců přihlíží. Nezlehčíme rozhřešení, zatímco nás sleduje celá [Glossary( 'oikoumene', 'OIKOUMENE_GLOSS' )].“"
 petition_head_of_faith.5000.desc.atmosphere_dulia: "„Mučedníci si své místo v nebi vydobyli vlastní krví.“"
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: "„Zahálka je nepřítelem duše. Nekleč jen v lítosti, ale i v připravenosti k pokání, modlitbě a práci.“"
 petition_head_of_faith.5000.desc.atmosphere_original_sin: "„Stejně jako my všichni [Select_CString(ROOT.Char.IsFemale,'jsi přišla','jsi přišel')] na svět v hříchu. Proč k tomuto dědictví přidávat další zkaženost?“"
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: "„Naši bratři putují mezi chudými a nemají nic než obnošené hábity.“"
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: "„Ctíme sliby chudoby: přepych tvého postavení ti svátosti nevrátí.“"
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: "„Kříž na tvé hrudi ti nezabránil urážet křesťanstvo.“"
 petition_head_of_faith.5000.desc.atmosphere_fallback: "„Samotná dlouhá pouť ti rozhřešení nezajistí.“"
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n„Musíš vědět, že trest nerušíme kvůli okázalosti ani lichotkám. Dokaž před Bohem upřímnost svého pokání!“ požaduje [Select_CString(recipient.IsFemale,'Svatá matka','Svatý otec')]."
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\nZvěsti o tom, že jsem [petition_gravest_sin.GetName(actor)], jistě dorazily až do těchto posvátných síní."
 petition_head_of_faith.5000.desc.penitent_clean: "\n\nNení mnoho neřestí, které lze odhalit, takže dvůr by měl poznat, že exkomunikace už splnila svůj nápravný účel."
 petition_head_of_faith.5000.a.confess: "Vyznám všechny své hříchy bez jediné výjimky."
 petition_head_of_faith.5000.b.canon_law: "Dokážu, že církevní právo vyžaduje mé smíření."
 petition_head_of_faith.5000.c.weep: "Budu prosit dvůr o milosrdenství."
 petition_head_of_faith_repentance_duel_success: "[recipient.GetFaith.ReligiousHeadName] se nechává obměkčit"
 petition_head_of_faith_repentance_duel_failure: "[recipient.GetFaith.ReligiousHeadName] se nenechává obměkčit"
 petition_head_of_faith_repentance_confess_duel_success: "[recipient.GetFaith.ReligiousHeadName] přijímá tvou zpověď"
 petition_head_of_faith_repentance_confess_duel_failure: "[recipient.GetFaith.ReligiousHeadName] odmítá uvěřit tvým slovům"
 petition_head_of_faith_repentance_weep_duel_success: "[recipient.GetFaith.ReligiousHeadName] se nechává obměkčit tvou pokorou"
 petition_head_of_faith_repentance_weep_duel_failure: "[recipient.GetFaith.ReligiousHeadName] se tvým projevem nenechává obměkčit"
 petition_head_of_faith.5020.t: "Rozhřešení uděleno"
 petition_head_of_faith.5020.desc: "[recipient.GetFaith.ReligiousHeadName] povstává, aby udělil Pánovo milosrdenství:\n\n„Povstaň, mé dítě. Navracím tě do společenství věřících. Trest uvalený na tvou duši je zrušen.“"
 petition_head_of_faith.5020.a: "[recipient.GetFaith.HighGodName] — díky!"
 petition_head_of_faith.5030.t: "Bez rozhřešení"
 petition_head_of_faith.5030.desc.intro: "[recipient.GetFaith.ReligiousHeadName] povstává, aby vynesl Pánův spravedlivý soud:\n\n"
 petition_head_of_faith.5030.desc.confess: "„Tvá zpověď zní prázdně."
 petition_head_of_faith.5030.desc.canon_law: "„Tvá chabá učenost je odrazem tvé duše."
 petition_head_of_faith.5030.desc.weep: "„Slzy nejsou pokáním."
 petition_head_of_faith.5030.desc.fallback: "„Dovoluješ si příliš."
 petition_head_of_faith.5030.desc.conclusion: " Trest zůstává v platnosti.“"
 petition_head_of_faith.5030.a: "Zřejmě skrze [Select_CString(recipient.IsFemale,'svou služebnici','svého služebníka')] promlouvá [recipient.GetFaith.HighGodName]."
