 petition_head_of_faith_decision_receptive_favorable: "[petition_recipient.GetShortUIName] tuto žádost #P s velkou pravděpodobností přijme#! #weak (Záleží na [petition_recipient.GetHerHis] [opinion|E] o vás; během audience ji lze ovlivnit)#!" # todo: NEW TRANSLATION
 petition_head_of_faith_decision_receptive_neutral: "[petition_recipient.GetShortUIName] tuto žádost #P může přijmout#! #weak (Záleží na [petition_recipient.GetHerHis] [opinion|E] o vás; během audience ji lze ovlivnit)#!" # todo: NEW TRANSLATION
 petition_head_of_faith_decision_receptive_skeptical: "[petition_recipient.GetShortUIName] tuto žádost #N může odmítnout#! #weak (Záleží na [petition_recipient.GetHerHis] [opinion|E] o vás; během audience ji lze ovlivnit)#!" # todo: NEW TRANSLATION
 petition_head_of_faith_decision_receptive_hostile: "[petition_recipient.GetShortUIName] tuto žádost #N s velkou pravděpodobností odmítne#! #weak (Záleží na [petition_recipient.GetHerHis] [opinion|E] o vás a vašich vztazích; během audience ji lze ovlivnit)#!" # todo: NEW TRANSLATION
 petition_head_of_faith_decision_excommunication_target_hint: "#weak [petition_recipient.GetFaith.GetName] posuzuje [sinful|E] a [virtuous|E] [traits|E] vašeho cíle. Ty ovlivní, jaké argumenty můžete při audienci použít.#!" # todo: NEW TRANSLATION
