 petition_head_of_faith.0601.t: "Žádost opuštěna" # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.no_head: "Když jsem připraven přednést svůj případ, už tu není žádný vhodný duchovní pastýř, který by mou žádost přijal." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.head_dead: "[recipient.GetTitledFirstName] zemřel dříve, než mohl mou žádost vyslechnout." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.head_imprisoned: "[recipient.GetTitledFirstName] je uvězněn a nemůže přijímat formální žádosti." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.head_changed: "Hlava mé víry se změnila a svou žádost už nemohu předložit [recipient.GetTitledFirstName]." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.at_war: "Nemohu podat formální žádost, když jsem ve válce s [recipient.GetTitledFirstName]." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.repentance_resolved: "Už není třeba, aby mi byla zrušena exkomunikace." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.repentance_too_soon: "Tak brzy po posledním pokárání by mé pokání nebylo vyslyšeno." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.target_dead: "[petition_target.GetTitledFirstName] zemřel dříve, než mohla být žádost vyslyšena." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.target_wrong_faith: "[petition_target.GetTitledFirstName] už nevyznává mou víru, a proto nelze žádat o jeho formální exkomunikaci." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.target_too_low: "[petition_target.GetTitledFirstName] už není králem ani mocnějším vládcem, a proto se na něj tato formální žádost nevztahuje." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.target_already_excommunicated: "[petition_target.GetTitledFirstName] už je exkomunikován." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.fallback: "V mé žádosti už nelze pokračovat a cesta přijde nazmar." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.refund.piety: "Zbožný dar, který jsem vyhradil pro tuto žádost, mi byl vrácen." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.desc.refund.none: "Alespoň zatím ještě nedošlo k žádné výměně." # todo: NEW TRANSLATION
 petition_head_of_faith.0601.a: "Budiž." # todo: NEW TRANSLATION
 petition_head_of_faith.1000.t.repentance: "Žádost: Pokání" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.t.excommunication: "Žádost: Exkomunikace" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.court_low_grandeur: "Kdysi velkolepý palác kolem mě leží v troskách. Modlím se, aby to nebyl odraz duchovní chudoby [recipient.GetFaith.ReligiousHeadName].\n\n" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.court_high_grandeur: "Vstoupit do paláce proslulého svými velkolepými sály je skutečně pokořující. Modlím se, aby jeho nebeské pozlátko odráželo spravedlnost a duchovní bohatství, které skrývá.\n\n" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.intro: "Zde sedí Boží místodržící na zemi. " # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.recipient_sinful: "Ačkoli je dobře známo, že [recipient.GetSheHe] je [petition_hof_gravest_sin.GetName(recipient)], nějakým ďábelským úskokem si [recipient.GetSheHe] našel cestu k trůnu svatého Petra." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis]
 petition_head_of_faith.1000.desc.recipient_virtuous: "Jeho/její úsudek se jistě bude řídit jeho/její [petition_hof_gravest_virtue.GetName(recipient)] povahou." # todo: NEW TRANSLATION, CHECK FORMAT # todo: FORMAT chýba [recipient.GetHerHis], [recipient.GetHerHis]
 petition_head_of_faith.1000.desc.health_noble: "\n\n[recipient.GetHerHis|U] podlomené zdraví je zjevně plodem života plného ušlechtilé dřiny." # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.health_excess: "\n\n[recipient.GetHerHis|U] podlomené zdraví je zjevně důsledkem života plného zhoubných výstřelků." # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.address: "\n\nPředkládám svou žádost [recipient.GetHerHim]: „Svatý [recipient.GetMotherFather|U], " # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.repentance: "přicházím v pokoře a prosím o zproštění pokárání, které tíží mou duši, a modlím se, abych byl znovu přijat do společenství věřících.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.excommunication: "[petition_target.GetTitledFirstName] se dopustil zločinů proti Bohu. Přicházím jako pokorný posel; samozřejmě je na vás, abyste vynesl soud nad [petition_target.GetHerHis] nesmrtelnou duší.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.a.argue: "Přednesu své důvody." # todo: NEW TRANSLATION
 petition_head_of_faith.1000.a.argue_tt: "Pokusíte se během audience přesvědčit [recipient.GetShortUINameNoTooltip]" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.disposition_favorable: "\n\n„Vyslechli jsme vás, dítě mé. Sdělte nám podrobnosti své žádosti a přijmeme ji příznivě.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.disposition_neutral: "\n\n„Vaše žádost je před námi. Rozhodneme podle toho, co žádají církevní zákony a svatá církev.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.disposition_skeptical: "\n\n„Lichotivá slova se říkají snadno. Vaši žádost přijímáme se skepsí, jakou vyžaduje Pán,“" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.disposition_hostile: "\n\n„Příliš si dovolujete, když sem přicházíte. Dobře zvažte svá další slova.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1000.desc.conclusion: "říká [recipient.GetSheHe] a očekává odpověď." # todo: NEW TRANSLATION
 petition_head_of_faith.1310.t: "Žádost: Pokání [actor.GetTitledFirstNamePossessiveNoTooltip]" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.desc.intro: "„Svatý [ROOT.Char.GetMotherFather|U], jsem exkomunikován, zbaven svátostí a odříznut od věřících. Prosím vás, sejměte toto pokárání z mé duše a přijměte mě zpět do společenství,“ říká klečící [actor.GetTitledFirstName].\n\n„Nejprve prokažte [ROOT.Char.GetFaith.HighGodName] svou lítost,“ odpovídám." # todo: NEW TRANSLATION
 petition_head_of_faith.1310.desc.disposition_favorable: "\n\n„Vždy jste mi prokazoval laskavost, svatý [ROOT.Char.GetMotherFather|U]. Nežádám o světskou přízeň, jen aby Bůh a svatá církev poznali upřímnost mého pokání.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.desc.disposition_neutral: "\n\n„Stojím před Bohem jako každý kajícník a žádám pouze spravedlnost podle církevního práva.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.desc.disposition_skeptical: "\n\n„Nepovažujte mě za [SelectLocalization( ROOT.Char.GetFaith.HasDoctrineByKey( 'special_doctrine_ecumenical_christian' ), 'petition_head_of_faith.1310.serpent.christian', 'petition_head_of_faith.1310.serpent.generic' )], který vás líbeznými řečmi svádí na scestí. Přísahám při [ROOT.Char.GetFaith.HighGodName] i jeho místodržiteli na zemi, že činím pokání.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.serpent.christian: "hada v zahradě" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.serpent.generic: "hada" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.desc.disposition_hostile: "\n\n„Byli jsme ve světě nepřáteli. Nežádám vás, abyste o mně mluvil dobře ve světských záležitostech, ale uznejte mé pokání a neohrožujte mou duši.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.desc.penitent_sinful: "\n\n„Znají vás jako [petition_gravest_sin.GetName(actor)]. Lichotivá slova neposkvrněnou duši neočistí. Jak napravíte své hříchy?“" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.desc.penitent_clean: "\n\n„Vaše jméno není příliš poskvrněno neřestmi. Snad zákaz splnil svůj očistný účel. Uvidíme, zda vaše duše odpovídá vašemu vystupování.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.a: "„Vstaň, dítě mé. Jsi znovu přijat do společenství věřících.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1310.b: "„Pokárání trvá. Vrať se, až bude tvé pokání zřejmé.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1320.t: "Žádost: Exkomunikace [petition_target.GetTitledFirstNamePossessiveNoTooltip]" # todo: NEW TRANSLATION
 petition_head_of_faith.1320.desc.intro: "„Svatý [ROOT.Char.GetMotherFather|U], [petition_target.GetTitledFirstName] se dopustil zločinů proti Bohu. Pokud tuto hnilobu nevyřízneme, budou ohroženy duše nás všech,“ říká [actor.GetTitledFirstName].\n\n„Exkomunikaci nepoužíváme jako soukromou zbraň knížete. Jasně před Bohem uveďte, z čeho ho viníte,“ odpovídám." # todo: NEW TRANSLATION
 petition_head_of_faith.1320.desc.disposition_favorable: "\n\n„Vždy jste se ke mně choval spravedlivě, svatý [ROOT.Char.GetMotherFather|U]. Nežádám o světskou přízeň, jen aby Bůh a svatá církev poznali pravdu o proviněních [petition_target.GetTitledFirstNamePossessiveNoTooltip].“" # todo: NEW TRANSLATION
 petition_head_of_faith.1320.desc.disposition_neutral: "\n\n„Před Bohem vznáším toto obvinění jako prostý poddaný Pána Ježíše Krista a žádám pouze spravedlnost, jakou vyžaduje svatá církev.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1320.desc.disposition_skeptical: "\n\n„Nepovažujte mě za hada v zahradě, který líbeznými slovy řeší osobní spor. Přísahám před [ROOT.Char.GetFaith.HighGodName] i jeho místodržícím na zemi, že toto obvinění je spravedlivé.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1320.desc.disposition_hostile: "\n\n„Byli jsme ve světě nepřáteli, ale prosím, važte duši [petition_target.GetTitledFirstNamePossessiveNoTooltip] podle církevního práva.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1320.desc.target_sinful: "Hniloba hříchu [petition_target.GetTitledFirstNamePossessiveNoTooltip] pramení z [petition_target.GetHerHis] povahy: [petition_gravest_sin.GetName(petition_target)].“" # todo: NEW TRANSLATION
 petition_head_of_faith.1320.desc.finish: "uzavírá [actor.GetTitledFirstName]." # todo: NEW TRANSLATION
 petition_head_of_faith.1320.desc.target_clean: "[petition_target.GetTitledFirstNamePossessiveNoTooltip] dobře skrývá [petition_target.GetHerHis] ničemnost, ale věřím, že když požádáte Pána o vedení, [petition_target.GetHerHis] hřích vyjde najevo.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1320.a: "„Vylučuji [petition_target.GetHerHim] ze společenství věřících.“" # todo: NEW TRANSLATION
 petition_head_of_faith.1320.b: "„Vaše důvody nejsou přesvědčivé, [petition_target.GetHerHim] žádné pokárání nestihne.“" # todo: NEW TRANSLATION
 petition_head_of_faith.2020.t: "Vyhlášení exkomunikace" # todo: NEW TRANSLATION
 petition_head_of_faith.2020.desc: "[recipient.GetFaith.ReligiousHeadName] povstane, aby vykonal spravedlnost Páně:\n\n"[petition_target.GetTitledFirstName] je exkomunikován, vyčleněn z těla věřících a [petition_target.GetHerHis] duše je odsouzena k nebezpečí, dokud nebude konat opravdové pokání."" # todo: NEW TRANSLATION
 petition_head_of_faith.2020.a: "[recipient.GetFaith.HighGodName] promluvil skrze svého služebníka." # todo: NEW TRANSLATION
 petition_head_of_faith.2030.t: "Žádost zamítnuta" # todo: NEW TRANSLATION
 petition_head_of_faith.2030.desc.intro: "[recipient.GetFaith.ReligiousHeadName] povstane, aby vykonal Pánovu spravedlnost:\n\n" # todo: NEW TRANSLATION
 petition_head_of_faith.2030.desc.cite_sins: "„Hříchy, které uvádíte, nejsou dost závažné na tak strašný trest. [petition_target.GetTitledFirstName] nebude exkomunikován.“" # todo: NEW TRANSLATION
 petition_head_of_faith.2030.desc.finesse: "„Nevylučujeme věřící jen proto, že nám kníže zaplatí. Za peníze císařovy si nelze koupit soudy [recipient.GetFaith.HighGodName].“" # todo: NEW TRANSLATION
 petition_head_of_faith.2030.desc.learning_duel: ""Chtěl byste [petition_target.GetTitleAsNameNoTooltip] chytit do pasti záměrnými překrucováními kanonického práva? [petition_target.GetTitledFirstName] nebude exkomunikován na základě... vašich učených výkladů."" # todo: NEW TRANSLATION
 petition_head_of_faith.2030.desc.fallback: ""Máte o sobě příliš vysoké mínění! Nevidím důvod, proč by měl být [petition_target.GetTitledFirstName] exkomunikován."" # todo: NEW TRANSLATION
 petition_head_of_faith.2030.a: "Zdá se, že [recipient.GetFaith.HighGodName] promluvil ústy svého služebníka." # todo: NEW TRANSLATION
 petition_head_of_faith.2000.t: "Spor" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_aniconism: ""Chcete dokázat zločiny [petition_target.GetTitledFirstNamePossessiveNoTooltip] pomocí Písma a církevních kánonů? Klekal [petition_target.GetSheHe] před vyřezávanými obrazy?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_khachkar: ""A tak chcete obvinit [petition_target.GetTitledFirstNameNoTooltip] pod kamenným křížem, který místní lidé uctívají?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_hyperdulia: ""Nezaslouží si [petition_target.GetTitledFirstNameNoTooltip] milosrdenství Matky Boží? Může kdokoli, dokonce i vy, tvrdit, že je neposkvrněn lidským hříchem?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_divine_liturgy: ""Chcete, abychom vyloučili [petition_target.GetTitledFirstNameNoTooltip] ze svaté liturgie kvůli vášni osobního sporu, a ne na základě důkazu těžkého hříchu?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_transubstantiation: ""Chcete [petition_target.GetTitledFirstNameNoTooltip] zakázat přístup ke Kristovu oltáři? Odepřít [petition_target.GetHerHim] pokrm v podobě těla našeho Pána? Neměl [petition_target.GetSheHe] už pít z Jeho krve?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_communion: ""Považujete za vhodné vyloučit [petition_target.GetTitledFirstNameNoTooltip] ze společenství věřících?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_confession: ""Chcete, abychom zakročili proti [petition_target.GetTitledFirstNameNoTooltip] na základě toho, co bylo řečeno pod pečetí zpovědi?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_purgatory: ""Chcete, abychom vyobcovali [petition_target.GetTitledFirstNameNoTooltip], když by [petition_target.GetHerHim] od hříchu mohly ještě odvrátit mírnější prostředky?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_apostolic_succession: ""Chcete se dovolávat autority apoštolů a nechat nás odsoudit [petition_target.GetTitledFirstNameNoTooltip] na zemi i v nebi?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_scholasticism: ""Vyrušujete nás od studia kánonů, abychom odsoudili [petition_target.GetTitledFirstNameNoTooltip]. Opírá se vaše rétorika o spisy církevních otců a Písmo?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_peace_of_god: ""Chcete nás poštvat proti [petition_target.GetTitledFirstNameNoTooltip] kvůli krveprolití během svatého období či násilí na církevní půdě? Porušil [petition_target.GetSheHe] Boží mír a příměří?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_armed_pilgrimages: ""Je nejlepší soudit váš spor s [petition_target.GetTitledFirstNameNoTooltip] právě zde? Nebylo by lepší, kdybyste oba přijali kříž a vyrazili do války proti nepřátelům Krista?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_pentarchy: ""Přicházíte za námi, abychom vyobcovali [petition_target.GetTitledFirstNameNoTooltip], zatímco se my, pět patriarchálních stolců, snažíme udržet jednotu rozděleného křesťanstva? Myslíte, že by celé [Glossary( 'oikoumene', 'OIKOUMENE_GLOSS' )] stálo za vaším obviněním?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_dulia: ""Urazil [petition_target.GetTitledFirstNameNoTooltip] otevřeným pohrdáním úctu k mučedníkům?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_ora_et_labora: ""Chcete, abychom vyobcovali [petition_target.GetTitledFirstNameNoTooltip]. Dejte nám alespoň nějaký důkaz, že [petition_target.GetSheHe] žil v neposlušnosti a zahálce, neboť zahálka je nepřítelem duše."" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_original_sin: ""Chcete, abychom odsoudili [petition_target.GetTitledFirstNameNoTooltip], jako by [petition_target.GetSheHe] jediný zdědil Adamovu vinu? Každá duše vstupuje na svět poznamenaná pádem a církev vyhání jen ty, kdo se oddávají svým hříšným sklonům."" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_mendicant_preachers: ""Přicházíte a hlasitě žádáte spravedlnost pro [petition_target.GetTitledFirstNameNoTooltip], oděni do přepychu, zatímco naši mniši žebravých řádů putují mezi chudými jen v šatech, které mají na sobě. Doporučil by žebravý mnich spíše trpělivost, nebo je ten hřích tak velký?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_vows_of_poverty: ""Chcete [petition_target.GetTitledFirstNameNoTooltip] odepřít svátosti. Chcete [petition_target.GetHerHis] ohrozit podíl na bohatství věčného života s Kristem v nebi? Sliby chudoby skládáme na zemi."" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_miles_christi: ""Chcete, abychom vyobcovali Kristova vojáka na základě svědectví [petition_target.GetHerHis] nepřítele?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.atmosphere_fallback: ""Jak by podle vás měla svatá církev urovnat váš spor s [petition_target.GetTitledFirstNameNoTooltip]?"" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.judgment_seat: "\n\n"Musíte vědět, že exkomunikaci nepoužíváme jako soukromou zbraň knížete. Rozhodneme, jaký trest si spravedlnost žádá. Předložte svůj případ před Bohem!" žádá svatý [recipient.GetMotherFather|U]." # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.target_sinful: "\n\nAčkoli se slova [recipient.GetFaith.GetReligiousHeadTitle.GetNamePossessive] musí zdát nestranná, je zřejmé, že zprávy o hříšné povaze [petition_target.GetTitledFirstNamePossessiveNoTooltip] již dorazily do těchto svatých síní. Musím jen potvrdit [petition_target.GetHerHis] provinění." # todo: NEW TRANSLATION
 petition_head_of_faith.2000.desc.target_clean: "\n\nZdá se, že [recipient.GetTitledFirstName] ví, že [petition_target.GetTitledFirstNameNoTooltip] není zahalen hříchem. Nemám-li soudu předložit důkazy o zkaženosti, musím najít jinou cestu ke spravedlnosti, o niž usiluji." # todo: NEW TRANSLATION
 OIKOUMENE_GLOSS: "Řecky „obydlený svět“. Ve východořímském pojetí označovalo #bold oikoumene#! civilizovaný svět: říši a širší křesťanský řád, nad nímž dohlížela její církev." # todo: NEW TRANSLATION
 petition_head_of_faith.2000.a.cite_sins: "Vyhlašte před Bohem, že [petition_target.GetTitledFirstNameNoTooltip] se dopustil [petition_gravest_sin.GetName(petition_target)]." # todo: NEW TRANSLATION
 petition_head_of_faith.2000.a.cite_sins_fallback: "Vyjmenujte před Bohem hříchy [petition_target.GetTitledFirstNamePossessiveNoTooltip]." # todo: NEW TRANSLATION
 petition_head_of_faith.2000.b.finesse: ""Církev má mnoho potřeb. Dovolte mi několik z nich naplnit."" # todo: NEW TRANSLATION
 petition_head_of_faith.2000.c.learning_duel: "Uvedu málo známé pasáže Písma a polapím tak zlovolného [petition_target.GetTitleAsNameNoTooltip]." # todo: NEW TRANSLATION
 petition_head_of_faith.2000.d.hook: "Připomeňte [recipient.GetFaith.ReligiousHeadName] jisté... soukromé záležitosti." # todo: NEW TRANSLATION
 petition_head_of_faith.2000.e.withdraw: "...možná je to záležitost mezi [petition_target.GetFaith.HighGodName] a [petition_target.GetTitledFirstNameNoTooltip]." # todo: NEW TRANSLATION
 petition_head_of_faith.5000.e.withdraw: "...možná na to ještě nejsem připraven." # todo: NEW TRANSLATION
 petition_head_of_faith_hook_committed_tt: "Vynaložíte [hook|E], abyste to zařídili" # todo: NEW TRANSLATION
 petition_head_of_faith_target_cite_sins_unavailable_tt: "[petition_target.GetTitledFirstNameNoTooltip] je spíše ctnostný než hříšný" # todo: NEW TRANSLATION
 petition_head_of_faith_duel_success: "[recipient.GetFaith.ReligiousHeadName] je přesvědčen" # todo: NEW TRANSLATION
 petition_head_of_faith_cite_sins_success_desc: "[recipient.GetFaith.ReligiousHeadName] je přesvědčen" # todo: NEW TRANSLATION
 petition_head_of_faith_cite_sins_failure_desc: "[recipient.GetFaith.ReligiousHeadName] zůstává nepřesvědčen" # todo: NEW TRANSLATION
 petition_head_of_faith_argument_affronted: "[recipient.GetFaith.ReligiousHeadName] je uražen" # todo: NEW TRANSLATION
 petition_head_of_faith_argument_dismissed: "[recipient.GetFaith.ReligiousHeadName] odmítá váš argument" # todo: NEW TRANSLATION
 petition_head_of_faith_affronted_opinion: "Uražen úplatkem" # todo: NEW TRANSLATION
 petition_head_of_faith_affronted_opinion_desc: "Tato postava se urazila, když se prosebník domníval, že si může zlatem koupit náboženský rozsudek." # todo: NEW TRANSLATION
 petition_head_of_faith_dismissed_debate_opinion: "Argumenty ho nepřesvědčily" # todo: NEW TRANSLATION
 petition_head_of_faith_dismissed_debate_opinion_desc: "Tato postava odmítla prosebníka, jehož překrucování kanonického práva ji nepřesvědčilo." # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_setup_interaction: "Požádat o rozhřešení" # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_setup_interaction_extra_icon: "$hook_extra_icon$" # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_setup_interaction_desc: "Vydejte se za svou [head_of_faith|E] a proste o zrušení své [excommunication|E]." # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_setup_interaction_accept_tt: "Vydáte se do [CZProvName(recipient.GetCapitalLocation,'G')] a formálně požádáte [recipient.GetTitledFirstName] o zrušení své [excommunication|E]" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.t: "Zpověď" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_aniconism: ""Přicházíte pro rozhřešení. Klaněl jste se vyřezávaným obrazům, přestože víte, že vás očistí jen Písmo a pokání?"" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_khachkar: ""Doufám, že přicházíte prosit o rozhřešení u paty kamenného kříže s reliéfní výzdobou."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_hyperdulia: ""Matka Boží oplývá milosrdenstvím, ale nemůžeme vám zrušit církevní trest jen kvůli Ní."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_divine_liturgy: ""Znovu hledáte cestu k božské liturgii. Zamyslete se nad tím, co vás odloučilo od oltáře a věřících."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_transubstantiation: ""Máte zakázán přístup ke Kristovu oltáři i k pokrmu v podobě Jeho těla a krve."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_communion: ""Jste odříznuti od společenství věřících."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_confession: ""Svátost zpovědi vyžaduje úplné a pravdivé vyznání."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_purgatory: ""Exkomunikace je lékem církve. Darem, který vám má pomoci napravit váš život a zkrátit vaše očišťování."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_apostolic_succession: ""Držíme Petrovy klíče. Tato autorita vás může rozvázat, pokud skutečně činíte pokání."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_scholasticism: ""Hledáte smíření. Uspokojte zákon uvedením příslušné kapitoly a rozlišení z Dekretu."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_peace_of_god: ""Spočíval váš hřích v porušení Božího míru a příměří? Prolil jste krev během svatého období?"" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_armed_pilgrimages: ""Pokud jste nosil kříž jen na oko a přesto škodil křesťanstvu, víte, že jste porušil zákon."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_pentarchy: ""Pět patriarchálních stolců vás sleduje. Rozhřešení nezlehčíme, když se dívá celé [Glossary( 'oikoumene', 'OIKOUMENE_GLOSS' )]."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_dulia: ""Mučedníci si svým prolitým krví zasloužili místo v nebi."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_ora_et_labora: ""Zahálka je nepřítelem duše. Neklekejte jen v pokání, ale i připraveni k odčinění, modlitbě a práci."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_original_sin: ""Narodil jste se v hříchu, stejně jako my všichni. Proč k tomuto dědictví přidávat další zlovolnost?"" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_mendicant_preachers: ""Naši mniši žebravých řádů putují mezi chudými a nemají nic než obnošené hábity."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_vows_of_poverty: ""Vážíme si slibů chudoby: přepych spojený s vaším postavením vám svátosti nevrátí."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_miles_christi: ""Nosil jste kříž na hrudi, a přesto jste urazil křesťanstvo."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.atmosphere_fallback: ""Rozhřešení si nevysloužíte jen dlouhou poutí."" # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.judgment_seat: "\n\n"Jistě víte, že cenzuru nezrušíme kvůli okázalosti či lichocení. Projevte před Bohem své pokání!" požaduje svatý [recipient.GetMotherFather|U]." # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.penitent_sinful: "\n\nZprávy o mé povaze poznamenané [petition_gravest_sin.GetName(actor)] jistě již dorazily do těchto svatých síní." # todo: NEW TRANSLATION
 petition_head_of_faith.5000.desc.penitent_clean: "\n\nNení toho mnoho, co bych mohl odhalit jako zlovolné, a tak by soud měl vidět, že zákaz splnil svůj léčivý účel." # todo: NEW TRANSLATION
 petition_head_of_faith.5000.a.confess: "Vyznat své hříchy a nic nezamlčet." # todo: NEW TRANSLATION
 petition_head_of_faith.5000.b.canon_law: "Argumentovat, že církevní zákon vyžaduje mé smíření." # todo: NEW TRANSLATION
 petition_head_of_faith.5000.c.weep: "Svěřit se milosrdenství soudu." # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_duel_success: "[recipient.GetFaith.ReligiousHeadName] je dojat" # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_duel_failure: "[recipient.GetFaith.ReligiousHeadName] zůstává netečný" # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_confess_duel_success: "[recipient.GetFaith.ReligiousHeadName] přijímá vaši zpověď" # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_confess_duel_failure: "[recipient.GetFaith.ReligiousHeadName] vašim slovům nevěří" # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_weep_duel_success: "[recipient.GetFaith.ReligiousHeadName] je dojat vaší pokorou" # todo: NEW TRANSLATION
 petition_head_of_faith_repentance_weep_duel_failure: "[recipient.GetFaith.ReligiousHeadName] zůstává netečný k vašemu projevu" # todo: NEW TRANSLATION
 petition_head_of_faith.5020.t: "Rozhřešení uděleno" # todo: NEW TRANSLATION
 petition_head_of_faith.5020.desc: "[recipient.GetFaith.ReligiousHeadName] povstane, aby vám udělil milosrdenství Páně:\n\n"Vstaň, dítě mé. Jsi znovu přijat do společenství věřících. Zákaz tížící tvou duši je zrušen."" # todo: NEW TRANSLATION
 petition_head_of_faith.5020.a: "Díky [recipient.GetFaith.HighGodName]." # todo: NEW TRANSLATION
 petition_head_of_faith.5030.t: "Rozhřešení odepřeno" # todo: NEW TRANSLATION
 petition_head_of_faith.5030.desc.intro: "[recipient.GetFaith.ReligiousHeadName] povstane, aby vám udělil spravedlnost Páně:\n\n" # todo: NEW TRANSLATION
 petition_head_of_faith.5030.desc.confess: ""Vaše zpověď zní falešně." # todo: NEW TRANSLATION
 petition_head_of_faith.5030.desc.canon_law: ""Vaše chabé znalosti odrážejí stav vaší duše." # todo: NEW TRANSLATION
 petition_head_of_faith.5030.desc.weep: ""Slzy nejsou pokáním." # todo: NEW TRANSLATION
 petition_head_of_faith.5030.desc.fallback: ""Máte o sobě příliš vysoké mínění." # todo: NEW TRANSLATION
 petition_head_of_faith.5030.desc.conclusion: " Církevní trest zůstává v platnosti."" # todo: NEW TRANSLATION
 petition_head_of_faith.5030.a: "Zdá se, že [recipient.GetFaith.HighGodName] promluvil ústy svého služebníka." # todo: NEW TRANSLATION
