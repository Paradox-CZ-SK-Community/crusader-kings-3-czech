 petition_head_of_faith_decision_effects_major_piety: "Při přípravě žádosti zaplatíte [piety_i][EmptyScope.ScriptValue('major_piety_value')|V0] [piety|E]. Pokud žádost stáhnete, zrušíte [travel|E] nebo bude žádost opuštěna, zbožnost vám bude vrácena. Pokud přednesete své důvody a nepodaří se vám přesvědčit [petition_recipient.GetShortUINameNoTooltip], #EMP propadne#!." # todo: NEW TRANSLATION
