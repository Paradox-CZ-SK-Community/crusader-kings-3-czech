 house_guard_flavor: "#F Tento elitní pluk slouží určité dynastii. Válečníci jsou pečlivě vybíráni z nejvěrnějších poddaných.#!"
 bowmen_flavor: "#F Profesionální lučištníci zaplní vzduch šípy a zdecimují přední řady nepřítele.#!"
 light_footmen_flavor: "#F Zkušení harcovníci jsou při obtěžování nepřítele neocenitelní, narušují jeho křídla a postupně podlamují morálku.#!"
 light_horsemen_flavor: "#F Tito lehcí a rychlí jezdci vynikají v obchvatech a při pronásledování prchajících nepřátel dokážou rozsévat zkázu.#!"
 armored_footmen_flavor: "#F Tito těžce vyzbrojení a dobře vycvičení vojáci se specializují na drcení sevřených řad pěchoty.#!"
 pikemen_unit_flavor: "#F Dlouhé píky umožňují těmto plukům vytvořit hradbu hrotů, která dokáže rázem zastavit jezdecký útok.#!"
 armored_horsemen_flavor: "#F Tito těžce vyzbrojení a obrnění jezdci vládnou boji na otevřených pláních.#!"
 crossbowmen_flavor: "#F Ačkoli se kuše pomalu nabíjejí, snadno se používají a jejich šipky dokážou na značnou vzdálenost prorazit většinu zbrojí.#!"
 handgunners_flavor: "#F Tyto primitivní palné zbraně jsou nákladné a výbušné, ale také nesmírně účinné.#!\n#help Zpřístupní [GetBuilding('powder_magazine_01').GetName].#!"
 fire_lancers_flavor: "#F Díky pokusným recepturám dokážou muži vyzbrojení podivnými tyčovými zbraněmi zasypat vyděšené nepřátele ohněm.#!\n#help Zpřístupní [GetBuilding('powder_magazine_01').GetName].#!"
 gakgung_archers_flavor: "#F Tito lučištníci jsou vybaveni silnými reflexními luky a prsteny na palec, které jim umožňují napínat tětivu větší silou a střílet na neuvěřitelnou vzdálenost.#!"
 pesilat_warriors_flavor: "#F Přestože často bojují #italic krisem#!, #italic golokem#! či nesčetnými dalšími zbraněmi pro boj zblízka, mistři silatu jsou stejně zběhlí i v boji beze zbraně.#!"
 samurai_flavor: "#F Družiníci #italic buši#! slouží šlechtě a nejvyšším vrstvám společnosti, ozbrojeni mečem a chráněni lakovanou koženou či kovovou zbrojí.#!"
 zhanmadao_infantry_flavor: "#F Tito vojáci jsou vyzbrojeni obrovskými obouručními meči a vycvičeni k boji proti jízdě pomocí oslnivé škály bodnutí, seků a klamných výpadů.#!"
 black_armor_cavalry_flavor: "#F Elitní jednotka císařské gardy proslulá tmavou zbrojí z oxidovaného železa.#!"
 tiefutu_flavor: "#F Tyto těžce vyzbrojené jezdce známé jako Železné pagody přivedla do Číny džürčenská dynastie Ťin. Spojují jezdecké umění s těžkou zbrojí a na každém bojišti představují hrozivého nepřítele.#!"
 burenjia_flavor: "#F Tato pěchota nasazovaná ve velkých počtech a sevřených formacích tvoří páteř císařských armád. Její těžká zbroj složená až z tisíce lamel jí umožňuje odolat téměř každému útočníkovi.#!"
 rocket_carts_flavor: "#F Hrstka mužů dokáže jedinou jiskrou zasáhnout nepřítele silou stovky lučištníků, i když by možná stálo za to dávat pozor na muže, kteří jsou ochotni s podobným zařízením dobrovolně zacházet.#!"
 ordo_riders_horse_archers_flavor: "#F Step zrodila otužilé válečníky, kteří slouží svému chánovi a vybírají tribut od okolních sousedů. Tito jezdci sdružení v ordu tvoří páteř každého elitního nomádského vojska.#!"
 onager_flavor: "#F Tyto malé torzní katapulty dokážou bořit nepřátelská opevnění vrháním kamenných střel na dálku.#!"
 mangonel_flavor: "#F Mangonel poháněný tahem lan se obsluhuje snáze než onager a zároveň se může pochlubit vyšší rychlostí střelby.#!"
 trebuchet_flavor: "#F Trebuchet s protizávažím dokáže vrhat velké střely mnohem větší silou než mangonely či onagry.#!"
 bombard_flavor: "#F Tyto kanóny už nejsou omezeny možnostmi pák a kladek a snadno prorážejí opevnění.#!"
 ballista_flavor: "#F Velké kuše upevněné na kolovém podvozku dokážou vystřelovat šipky s ocelovými hroty do působivé vzdálenosti.#!"
 cloud_ladder_flavor: "#F Kloubový skládací žebřík s jednoduchým tažným mechanismem, který jej rozloží, jakmile se dostane na dosah nepřátelských hradeb.#!"
 siege_tower_flavor: "#F Velká dřevěná věž na kolech, kterou lze přisunout k nepřátelským hradbám a která poskytuje větší ochranu a stabilitu než obléhací žebříky.#!"
 cannon_flavor: "#F Tyto poměrně malé, ale smrtící kanóny byly u přední části hlavně podepřeny a připevněny k zemi, aby se zmírnil zpětný ráz.#!"
 war_elephant_flavor: "#F Útočícího slona je téměř nemožné zastavit, a proto jsou sloni vynikajícím úderným vojskem.#!"
 ballista_elephant_flavor: "#F Řítící se slon je sám o sobě děsivý, ale řítící se slon s mocnou balistou na hřbetě jistě vyvede z míry i ty nejostřílenější nepřátele.#!"
 camel_rider_flavor: "#F Tito jezdci jsou pro pouštní boj vhodnější než tradiční jízda a vládnou písečným pláním.#!"
 huscarl_flavor: "#F Germánští huskarlové mistrně používají štítové hradby, které je chrání před přilétajícími salvami šípů.#!"
 landsknecht_flavor: "#F Němečtí lancknechti dokážou svými mohutnými zweihandery rozmetat sevřené řady nepřátelských kopiníků.#!"
 longbowmen_flavor: "#F Ačkoli jejich skutečné ovládnutí vyžaduje celoživotní výcvik, anglické a velšské dlouhé luky mají dostatečnou sílu k proražení plátové zbroje a dokážou chrlit salvy téměř bezkonkurenční rychlostí.#!"
 goedendag_flavor: "#F Vlámský goedendag je kyj opatřený hrotem, který lze zapřít proti útoku jízdy.#!"
 gendarme_flavor: "#F Francouzští žandarmové představují zářivý vrchol těžké jízdy a budí úžas po celém světě.#!"
 chasseur_flavor: "#F Rytíři z Outremeru ovládají jak evropské jezdecké umění, tak pouštní taktiku Levanty.#!"
 picchieri_flavor: "#F Pohyblivé formace latinských Picchieri z nich činí smrtonosnější vojáky, než jsou tradiční pikenýři.#!"
 praetorian_flavor: "#F Palatini jsou ti nejlepší z nejlepších, elitní římští vojáci sloužící přímo císaři.#!"
 caballero_flavor: "#F Na rozdíl od většiny jízdních vojsk se iberští caballerové cítí jako doma jak na rovinatých pláních, tak v členité kopcovité krajině.#!"
 cataphract_flavor: "#F Řečtí kataphraktoi odění v železe dokážou svým útokem prolomit téměř jakoukoli obrannou linii.#!"
 monaspa_flavor: "#F Monaspové, zformovaní z jádra osobní stráže gruzínských králů, jsou obávanou těžkou jízdou, které zvlněná krajina Kavkazu dokonale vyhovuje.#!"
 hobelar_flavor: "#F Rychlí a obratní keltští hobelaři mohou bez obtíží podnikat nájezdy v lesích a kopcích, jimž se ostatní jízda vyhýbá.#!"
 schiltron_flavor: "#F Neobyčejná kázeň skotských pikenýrů jim umožňuje snadno odrážet nepřátelské útoky, a to i na otevřených pláních.#!"
 metsanvartija_flavor: "#F Uralští Metsänvartija mohou přepadnout nájezdníky krupobitím šípů a poté se opět ztratit mezi stromy.#!"
 horse_archers_flavor: "#F Kočovné kmeny využívají jízdní lučištníky k zasypávání nepřítele šípy, zatímco sami zůstávají téměř nedostižní.#!"
 ayyar_flavor: "#F Mladí a horliví členové bojových spolků Ajjárů jsou ochotní a schopní vojáci, které lze kdykoli povolat do boje.#!"
 mubarizun_flavor: "#F Arabští Mubárizún, vycvičení k boji ve formaci i k soubojům muže proti muži, dokážou v bitvě rozdrtit většinu ostatní pěchoty.#!"
 druzhina_flavor: "#F Ruská družina se skládá ze zkušených osobních strážců, kteří zasvětili své životy ochraně spojenců.#!"
 hussar_flavor: "#F $hussar$ jsou nechvalně proslulí mistři nájezdů z východní Evropy, kteří se prchající nepřátelskou armádou rychle vypořádají.#!"
 horn_warrior_flavor: "#F Válečníky z Afrického rohu, zocelené bojem v horách, není radno podceňovat.#!"
 bush_hunter_flavor: "#F Tito západoafričtí lučištníci dokážou využít obtížný terén buše ve svůj prospěch.#!"
 shomer_flavor: "#F Židovští šomerové, oddaní ochraně svých soukmenovců, výtečně kryjí své druhy v boji.#!"
 khandayat_flavor: "#F Indičtí khandajatové jsou mistři šermu, kteří dokážou stejně snadno srazit člověka i koně.#!"
 garudas_flavor: "#F Garudští válečníci jsou proslulí svou věrností a odhodláním bojovat až do smrti. Padne-li garudský válečník, očekává se, že s ním zemře celá jeho družina lenků.#!"
 mountaineer_flavor: "#F Náročný výcvik ve vysokých nadmořských výškách činí z tibetských vojáků nezpochybnitelné vládce jejich domoviny.#!"
 sahel_horsemen_flavor: "#F Sahelští jezdci jsou jízdní válečníci, kteří své nepřátele ničí oštěpy a přitom se chrání lehkou prošívanou zbrojí.#!"
 guinea_warrior_flavor: "#F Válečníci z guinejských vysočin se pohybují rychle a jejich oštěpy jsou přesné a smrtící.#!"
 sarawit_flavor: "#F Sarawitové jsou dobře vycvičené vojsko, které se v etiopských vysočinách cítí jako doma.#!"
 zbrojnosh_flavor: "#F Zbrojnoši se cítí jako doma v kopcích a lesích střední Evropy a jejich pověst budí strach široko daleko.#!"
 abudrar_flavor: "#F Abudrarští horalé znají každou soutěsku a každé vádí své domoviny.#!"
 palace_guards_flavor: "#F Tito všestranní válečníci obvykle střeží palác a udržují pořádek, ale mohou také tvořit páteř jakékoli armády.#!"
 shenbigong_flavor: "#F Tito elitní kušníci jsou vyzbrojeni mocným Šen-pi-kungem, „Božskou pažní kuší“. Každá vypuštěná šipka dokáže se znepokojivou přesností prorazit zbroj i nepřátelské řady.#!"
 mulaththamun_flavor: "#F Tito jezdci zdokonalovali své dovednosti po celý život v těsném sepětí s pouští a tváře si zahalují lithámem, který je chrání před pískem i před rozpoznáním nepřítelem.#!"
 archers_of_the_nile_flavor: "#F Núbijci po tisíce let chrání svou domovinu tím, že se již od mládí učí mistrovsky ovládat luk a odrážejí nájezdy okolních pouštních národů i cizích dobyvatelů.#!"
 paiks_flavor: "#F Pěšáci tvoří po staletí základ indických armád a žádná zbraň není rozšířenější než prostý bambusový luk, s nímž se mnozí indičtí prostí lidé učí zacházet při lovu již od mládí.#!"
 guanch_vaulter_flavor: "#F Tito obratní válečníci vyzbrojení dlouhými tyčemi ke skoku se snadno pohybují ve skalnaté horské krajině a dokážou skokem překonat i některá opevnění.#!"
 teulu_flavor: "#F Tito brythonští jezdci, zavázaní dávnými přísahami, vyrážejí do boje jako věrné kopí a štít svého pána.#!"
 ayrudzi_flavor: "#F Tito divocí šlechtici jsou rychlými jezdci, obratně využívají nehostinný terén a zároveň je chrání pevná zbroj, takže mohou sloužit jako obtěžující jízda i hrozivý předvoj.#!"
 conrois_flavor: "#F Tito bezohlední normanští jezdci se sklopenými kopími prudce vyrážejí proti každé slabině nepřátelských řad a snaží se vydobýt vítězství drtivým útokem a hrůzou.#!"
 akritai_flavor: "#F Tito zkušení venkovští odvedenci střeží skalnaté průsmyky a díky správnému načasování a znalosti krajiny dokážou obtěžovat i ta nejmocnější vojska.#!"
 ballistrai_flavor: "#F Z těchto torzních strojů létají šipky dlouhé jako kopí do obléhaných sídel i nepřátelských formací, kde vyvolávají strach a zmatek.#!"
 skoutatoi_flavor: "#F Jméno této pěchoty pochází z vysokých štítů #EMP skouton#!, s nimiž se řadí proti nepříteli. Její hlavní předností v boji je však kázeň, díky níž zachovává spořádané řady při postupu i ústupu.#!"
 varangian_guards_flavor: "#F Tito proslulí germánští žoldnéři vyzbrojení sekerami tvoří neochvějné jádro císařského vojska.\n\n@warning_icon! #X Po smrti Basilea si vyžádají část [Concept('gold','zlata')|E].#!"
 handpicked_faithful_flavor: "#F Každý z těchto bojovníků vyniká statečností, věrností a nadáním a je připraven položit život za ochranu svého vůdce.#!"
 emishi_horse_archers_flavor: "#F Jízdní lučištníci Emiši, nucení bránit se silnějším nepřátelům, mistrně ovládají taktiku udeř a uteč, nájezdy i léčky.#!"
 japanese_horse_archers_flavor: "#F Samurajové přejali bojové postupy severních Emiši, ale používají těžší zbroj. S yumi v ruce vyrážejí v sedle a zasypávají nepřátele šípy.#!"
 warrior_monks_flavor: "#F Tito mniši brání věřící a slouží svým patronům. Život zasvěcený víře jim poskytuje dostatek času k výcviku a propůjčuje jim pevné přesvědčení.#!"
 pikemen_militia_flavor: "#F Jsou připraveni bojovat za svou půdu a důstojnost. Dohání-li je zoufalství až na pokraj sil, obrátí své zbraně proti každému urozenému zeměpánovi a vezmou si, co jim náleží.#!"
 teutonic_knights: "Řádoví rytíři"
 teutonic_knights_flavor: "#F Těžce obrnění a horliví rytíři, kteří vedle útoků těžké jízdy vynikají i v bitvách sevřených pěších šiků.#!"
