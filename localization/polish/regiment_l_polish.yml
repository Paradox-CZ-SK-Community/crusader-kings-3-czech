 accolade_maa_outriders_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Na rychlých koních mohou tito elitní jezdci předběhnout jakéhokoli nepřítele a udeřit tam, kde je nejméně očekáván.#!" # todo: CONCEPT CASE
