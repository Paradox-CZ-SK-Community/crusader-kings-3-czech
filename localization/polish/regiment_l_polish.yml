 accolade_maa_vanguards_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Uctěni čestným místem v samém středu boje, tito disciplinovaní a honosní těžcí pěšáci jsou silou, kterou málokterý nepřítel snese.#!" # todo: CONCEPT CASE
