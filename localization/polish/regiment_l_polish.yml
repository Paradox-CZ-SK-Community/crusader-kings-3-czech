 accolade_maa_archers: "Elitní lučišníci"
 accolade_maa_archers_flavor: "[retinue_maa|E]\n#F Tito elitní lučišníci nejsou banda pytláků: jsou důkladně cvičeni k přesnému a rychlému dešti šípů.#!"
 accolade_maa_skirmishers: "Elitní skirmisheři"
 accolade_maa_skirmishers_flavor: "[retinue_maa|E]\n#F Směs lehce vybavených elitních válečníků a zkušených žoldnéřských nájezdníků, děsí svými dovednostmi v přepadech a nekonvenční válce.#!"
 accolade_maa_pikes: "Elitní pikenýři"
 accolade_maa_pikes_flavor: "[retinue_maa|E]\n#F Ozdobeni výborným brněním a nesoucí dlouhé píky, tito pěšáci tvoří nezlomné jádro armády svého pána.#!"
 accolade_maa_outriders: "Elitní předvoj"
 accolade_maa_outriders_flavor: "[retinue_maa|E]\n#F Na rychlých koních mohou tito elitní jezdci přeběhnout jakéhokoli nepřítele a udeřit tam, kde je nejméně očekáván.#!"
 accolade_maa_vanguards: "Elitní přední linie"
 accolade_maa_vanguards_flavor: "[retinue_maa|E]\n#F Uctěni čestným místem v samém středu boje, tito disciplinovaní a honosní těžcí pěšáci jsou silou, kterou málokterý nepřítel snese.#!"
 accolade_maa_lancers: "Elitní kopiníci"
 accolade_maa_lancers_flavor: "[retinue_maa|E]\n#F Vrhnou se do boje s hromovým rachotem a pravou urozeností; jejich řady budí hrozivý respekt na bojišti.#!"
 accolade_maa_crossbowers: "Elitní kušníci"
 accolade_maa_crossbowers_flavor: "[retinue_maa|E]\n#F Ať rytíř či zloděj: pečlivě umístěný železný šíp těchto zkušených kušníků prolomí každého.#!"
 accolade_maa_cameliers: "Elitní jezdci na velbloudech"
 accolade_maa_cameliers_flavor: "[retinue_maa|E]\n#F Během staletí obávaní na Středním Východě a severní Africe, taková schopná kavalérie je vzácná.#!"
 accolade_maa_elephantiers: "Elitní jezdci na slonech"
 accolade_maa_elephantiers_flavor: "[retinue_maa|E]\n#F Z vysokých křesel mahoutů je jediné, co je těžší zastavit než nabíhajícího slona, další, #EMP větší#! slon.#!"
 accolade_maa_horse_archers: "Elitní jízdní lučišníci"
 accolade_maa_horse_archers_flavor: "[retinue_maa|E]\n#F Běžní stepní jezdci mají celoživotní dovednost: tito veteráni ještě větší. Postavit se jim je bolestné, pronásledovat je znamená smrt.#!"
 accolade_maa_handgunners: "Prachostřelecké družiny"
 accolade_maa_handgunners_flavor: "[retinue_maa|E]\n#F Postupujíce klidně skrz dým střelného prachu, tito vysoce vycvičení prachostřeleci mohou svými mistrně odlitými píšťalami prorazit linie nepřítele.#!"
 nomadic_riders: "Jezdci hordy"
 nomadic_riders_flavor: "#F Narozeni v sedle, $nomadic_riders$ jsou od dětství cvičeni k boji na koni.#!"
 kheshig: "Kheshig"
 kheshig_flavor: "#F Elitní stráž nomádního vládce, $kheshig$ zaručuje bezpečnost svého pána den co den. #EMP khorchin#!, jejich bojová oddělení, rozšiřuje tuto stráž i na bitevní pole.#!"
 nomadic_horde: "[horde|E]"
 steppe_raiders: "Stepní nájezdníci"
 steppe_raiders_flavor: "#F Ač nasazeni jako hlídky, tito odřídci se zřídka zdráhají zaútočit na izolované cíle a pustošit neopatrné.#!"
 torch_bearers: "Nositelé pochodní"
 torch_bearers_flavor: "#F Na nekonečné stepi nejsou potřeba obléhací věže ani katapulty — stačí plápolající pochodeň a svižný kůň, aby každou jurtu zapálili.#!"
 heavy_horse_archers: "Těžcí jezdečtí lučišníci"
 heavy_horse_archers_flavor: "#F Obrnění jezdci nesoucí silné luky. Každý vede skupinu kvalitních koní a tito nomádi mohou vytrvale bojovat na otevřeném poli.#!"
 nomad_lancers: "Nomádští kopiníci"
 nomad_lancers_flavor: "#F Kopí s hákem a koninaté prapory zvedají tuto zářivou linii elitního divokého nomádského jezdectva.#!"
 mangudai: "Mangudaj"
 mangudai_flavor: "#F Odvážní dobrovolní jezdci — 'ti už mrtví' — jsou ti první, kdo vrazí do nepřítele a svou zkázu vtáhnou protivníka do bezhlavého chaosu.#!"
 cataphract_archers: "Katafraktí lučišníci"
 cataphract_archers_flavor: "#F Šípy a čepele se odrážejí od lamelových brnění těchto jezdců i jejich koní. Mezitím jejich luky přinášejí smrt a utrpení.#!"
 maturkan_warriors: "Maturćanští válečníci"
 maturkan_warriors_flavor: "#F Tito váleční princové jsou obránci chladné tajgy a dobře bojují tam, kde koně a nájezdnické družiny sotva stačí.#!"
