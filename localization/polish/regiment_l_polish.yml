 accolade_maa_skirmishers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Tito lehce vyzbrojení elitní válečníci a ostřílení žoldnéřští nájezdníci jsou obáváni pro své umění léček a nekonvenčního boje.#!"
 accolade_maa_pikes: "Elitní pikenýři"
 accolade_maa_pikes_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Oděni v kvalitní zbroji a vyzbrojeni dlouhými píkami tvoří tito pěšáci nezlomné jádro vojska svého pána.#!"
 accolade_maa_outriders: "Elitní předjezdci"
 accolade_maa_outriders_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Na rychlých ořích dokážou tito elitní jezdci ujet každému nepříteli a udeřit vždy tam, kde je nikdo nečeká ani nevítá.#!"
 accolade_maa_vanguards: "Družinový předvoj"
 accolade_maa_vanguards_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Tato ukázněná a skvostně oděná těžká pěchota zaujímá čestné místo v nejprudší vřavě a jen málokterý nepřítel jí dokáže odolat.#!"
 accolade_maa_lancers: "Elitní lancíři"
 accolade_maa_lancers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Sevřené řady těchto urozených jezdců se s ohlušujícím rachotem ženou do boje a na každém bojišti vzbuzují děsivý úžas.#!"
 accolade_maa_crossbowers: "Elitní kušníci"
 accolade_maa_crossbowers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Rytíře i ničemu mohou provrtat pečlivě mířené železné šipky těchto znamenitě vycvičených kušníků.#!"
 accolade_maa_cameliers: "Elitní jezdci na velbloudech"
 accolade_maa_cameliers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Na celém Blízkém východě a v severní Africe budí strach a jen málokde na světě se najdou tak zdatní jezdci na velbloudech.#!"
 accolade_maa_elephantiers: "Elitní váleční sloni"
 accolade_maa_elephantiers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Z vysokých nástaveb na hřbetech těchto zvířat zkušení mahútové dokazují, že jediná věc, kterou lze zastavit hůře než útočícího slona, je jiný, #EMP větší#! slon.#!"
 accolade_maa_horse_archers: "Elitní jízdní lučištníci"
 accolade_maa_horse_archers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Běžní stepní jezdci získávají své umění po celý život, tito veteráni však umějí ještě víc. Postavit se jim znamená bolest, pronásledovat je smrt.#!"
 accolade_maa_handgunners: "Elitní střelci z ručnic"
 accolade_maa_handgunners_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Tito znamenitě vycvičení střelci postupují klidně kouřem střelného prachu a svými mistrovsky zhotovenými ručnicemi dokážou rozmetat nepřátelské řady.#!"
 nomadic_riders: "Jezdci hordy"
 nomadic_riders_flavor: "#F $nomadic_riders$ se rodí v sedle a od narození jsou cvičeni k jízdě do boje.#!"
 kheshig: "Kešig"
 kheshig_flavor: "#F $kheshig$ je elitní stráž nomádského vládce, která dnem i nocí zajišťuje bezpečí svého pána. Její bojová část zvaná #EMP chorčin#! rozšiřuje tuto ochranu i na bojiště.#!"
 nomadic_horde: "[Concept('horde','Nomádská horda')|E]"
 steppe_raiders: "Stepní nájezdníci"
 steppe_raiders_flavor: "#F Ačkoli jsou vybaveni jako průzkumníci, tito předjezdci málokdy zaváhají před útokem na osamocené nepřátele a rychle ztrestají každého, koho zastihnou nepřipraveného.#!"
 torch_bearers: "Nosiči pochodní"
 torch_bearers_flavor: "#F Na bezmezné stepi nejsou třeba obléhací věže ani katapulty. Stačí hořící pochodeň a rychlý kůň, aby každá jurta lehla popelem.#!"
 heavy_horse_archers: "Těžcí jízdní lučištníci"
 heavy_horse_archers_flavor: "#F Obrnění jezdci vyzbrojení silnými luky. Každý z nich vede několik znamenitých koní, takže tito nomádi mohou na otevřeném bojišti bojovat bez oddechu.#!"
 nomad_lancers: "Nomádští kopiníci"
 nomad_lancers_flavor: "#F Nad třpytivou bitevní řadou elitní a divoké nomádské jízdy se tyčí kopí opatřená háky a praporce z koňských žíní.#!"
 mangudai: "Mangudajové"
 mangudai_flavor: "#F Stateční dobrovolní jezdci zvaní „ti, kteří již zemřeli“ se jako první vrhají na nepřítele a svou zkázou jej strhávají do bezhlavého zmatku.#!"
 cataphract_archers: "Kataphraktní lučištníci"
 cataphract_archers_flavor: "#F Šípy i čepele neškodně odskakují od lamelové zbroje těchto jezdců i jejich koní. Jejich luky mezitím rozdávají smrt a utrpení.#!"
 maturkan_warriors: "Maturkanští válečníci"
 maturkan_warriors_flavor: "#F Tato válečná knížata brání chladnou tajgu a dobře bojují tam, kam se koně a nájezdní družiny sotva dostanou.#!"
