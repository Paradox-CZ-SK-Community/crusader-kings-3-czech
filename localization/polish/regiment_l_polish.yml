 house_guard_flavor: "#F Tento elitní oddíl slouží konkrétní dynastii. Bojovníci jsou osobně vybráni z nejvěrnějších poddaných.#!"
 bowmen_flavor: "#F Profesionální lukostřelci zahalí vzduch šípy a zničí přední linie nepřátel.#!"
 light_footmen_flavor: "#F Lehcí pěšáci jsou neocenitelní v obtěžování a rozrušování nepřítelovi linie a oslabování jeho morálky.#!"
 light_horsemen_flavor: "#F Lehcí a svižní, tito jezdci jsou výborní na obcházení a ničení ustupujících nepřátel při jejich pronásledování.#!"
 armored_footmen_flavor: "#F Těžce ozbrojení a důkladně cvičení, tito vojáci se specializují na rozbíjení hromadné pěchoty.#!"
 pikemen_unit_flavor: "#F Dlouhé oštěpy umožňují těmto jednotkám vytvořit zdi hrotů, které zastaví jízdu.#!"
 armored_horsemen_flavor: "#F Těžce vyzbrojení a obrnění, tito jezdci dominují boji na otevřených pláních.#!"
 crossbowmen_flavor: "#F Ač pomalí při nabíjení, kuše jsou snadné k použití a jejich šípy prorážejí většinu zbroje na dobrou vzdálenost.#!"
 handgunners_flavor: "#F Zbraně drahé a výbušné v rovné míře, tyto hrubé palné zbraně jsou neobyčejně účinné.#!\n#help Umožněno budovou [GetBuilding('powder_magazine_01').GetName].#!"
 fire_lancers_flavor: "#F Díky experimentálním směsím dokážou muži ozbrojení podivnými kopími sypat oheň na vyděšené nepřátele.#!\n#help Umožněno budovou [GetBuilding('powder_magazine_01').GetName].#!"
 gakgung_archers_flavor: "#F Vybaveni silnými kompozitními luky z rohoviny bůvola a prstenci na palcích pro zesílení nátažení, tito lučištníci dokážou střílet šípy na neuvěřitelnou vzdálenost."
 pesilat_warriors_flavor: "#F Ačkoliv jsou často vyzbrojeni #italic kris#!, #italic golok#! nebo nesčetným množstvím dalších zbraní na blízko, praktikanti silatu jsou stejně zběhlí v boji bez zbraní.#!"
 samurai_flavor: "#F #italic Bushi#! vazalové pečují o potřeby šlechty a nejvyšších vrstev společnosti, ozbrojeni mečem a chráněni lakovaným koženým či kovovým brněním.#!"
 zhanmadao_infantry_flavor: "#F Vybaveni obrovskými dvouručními meči jsou tito vojáci cvičeni používat své čepele proti jízdě pomocí oslnivé škály bodnutí, sečných úderů a fint.#!"
 black_armor_cavalry_flavor: "#F Elitní jednotka císařské gardy, známá svými tmavými, zoxidovanými železnými brněními.#!" # todo: NEW TRANSLATION
 tiefutu_flavor: "#F Elitní jednotka císařské gardy známá svým tmavým, zoxidovaným železným brněním.#!"
 burenjia_flavor: "#F Nasazováni ve velkém počtu a v těsných formacích, tato pěchota je páteří císařských armád. Skládají se až z 1000 lamel, jejichž těžké brnění jim umožňuje vzdorovat téměř každému vetřelci.#!"
 rocket_carts_flavor: "#F Skupinka mužů může jedním jiskřením zasáhnout nepřítele silou stovky lučištníků, ač by možná stálo za to dávat pozor na typ mužů, kteří by ochotně pracovali s tímto druhem zařízení.#!"
 ordo_riders_horse_archers_flavor: "#F Step tvořila zocelené válečníky, sloužící svému chánovi a vybírající tributy od různých sousedů. Tito jezdci, organizovaní v Ordu, tvoří páteř každé elitní kočovné síly.#!"
 onager_flavor: "#F Tyto malé torzní katapulty mohou svrhnout pevnosti házením kamenných projektilů na vzdálenost.#!"
 mangonel_flavor: "#F Tažný mangonel je snazší na obsluhu než onager a má rychlejší kadenci palby.#!"
 trebuchet_flavor: "#F Protikladný trebuchet dokáže vrhnout velké projektily s mnohem větší silou než mangonely nebo onagry.#!"
 bombard_flavor: "#F Nebývají již omezeny silou pák a kladek — tyto děla prorážejí opevnění s lehkostí.#!"
 ballista_flavor: "#F Velké kuše namontované na kolovém podstavci, které dokážou vystřelovat šipky s ocelovými hroty na impozantní vzdálenosti.#!"
 cloud_ladder_flavor: "#F Závěsný skládací žebřík s jednoduchým tažným mechanismem, který se rozloží, jakmile je v dosahu nepřátelských hradeb.#!"
 siege_tower_flavor: "#F Velká dřevěná věž na kolech, kterou lze přitlačit k nepřátelským hradbám, nabízí větší ochranu a stabilitu než obléhací žebříky.#!"
 cannon_flavor: "#F Tyto relativně malé, ale smrtící děla byla podepřena u ústí a připíchnuta do země, aby se tlumil zpětný ráz.#!"
 war_elephant_flavor: "#F Nabíhající sloni jsou téměř nezastavitelní, což z nich činí vynikající šokové jednotky.#!"
 ballista_elephant_flavor: "#F Nabíhající sloni jsou samy o sobě dost znepokojivý, ovšem nabíhající sloni vybavení na svém hřbetu silnou balistou dokáže znervóznit i ty nejzkušenejší válečníky.#!"
 camel_rider_flavor: "#F Vhodnější pro pouštní válčení než tradiční jezdectvo, tito jezdci dominují pískům.#!"
 huscarl_flavor: "#F Germánští huskarlové vládnou používáním štítových hradeb k zastavení šípových salv.#!"
 landsknecht_flavor: "#F Němečtí landsknechti používají své masivní zweihandery k prosekávání se masami oštěpařů.#!"
 longbowmen_flavor: "#F Ač vyžaduje celoživotní výcvik, Angličtí lučišníci s dlouhým lukem proráží i plátovou zbroj a vymršťují salvy rychlostí málo srovnatelnou.#!"
 goedendag_flavor: "#F Flámský goedendag je ostnatá palice, kterou lze zapřít proti jízdě.#!"
 gendarme_flavor: "#F Francouzští gendarmové jsou vrcholem těžkého jezdectva, budí úctu po celém světě.#!"
 chasseur_flavor: "#F Rytíři z Outremer ovládli jak evropské jezdecké dovednosti, tak levantské pouštní taktiky.#!"
 picchieri_flavor: "#F Mobilní formace latinských picchieri je činí smrtelnějšími než tradiční oštěpaři.#!"
 praetorian_flavor: "#F Ti nejlepší z nejlepších, Palatini jsou elitní římské jednotky sloužící přímo císaři.#!"
 caballero_flavor: "#F Na rozdíl od většiny jezdectva jsou iberscí caballerové doma na rovinách i v kopcovitém terénu.#!"
 cataphract_flavor: "#F Obrnění ze železa dovoluje řeckým kataphraktům prorazit téměř jakoukoli obrannou linii nájezdem.#!"
 monaspa_flavor: "#F Vzniklí z jádra královských stráží gruzínských králů, Monaspa jsou hrozivou těžkou jízdou zvyklou na kopcovitý Kavkaz.#!"
 hobelar_flavor: "#F Rychlí a obratní, keltscí hobelaři snadno pustoší lesy a hory, jimž se ostatní jezdectvo vyhýbá.#!"
 schiltron_flavor: "#F Neuvěřitelná disciplína skotských oštěpařů jim dovoluje zlomit nepřátelské nájezdy i na otevřených pláních.#!"
 metsanvartija_flavor: "#F Uralští metsanvartijové mohou přepadnout vetřelce salvou šípů a pak splynout s lesem.#!"
 horse_archers_flavor: "#F Jezdečtí lučišníci dominuji kočovným kmenům, vystřelují deště šípů a jsou téměř nedostižní.#!"
 ayyar_flavor: "#F Mladí a horliví, členové bojových klubů Ayyar jsou připraveni sloužit jako ochotní a schopní vojáci.#!"
 mubarizun_flavor: "#F Cvičeni v boji ve formacích i v souboji, arabští mubarizun mohou drtit většinu pěchoty soupeře.#!"
 druzhina_flavor: "#F Ruská druzhina jsou zkušení tělesní strážci oddaní ochraně svých spojenců.#!"
 hussar_flavor: "#F Mistři nájezdů, proslulí $hussar$ lehcí jezdci východní Evropy rychle rozbijí utíkající armádu.#!"
 horn_warrior_flavor: "#F Zkušení v horských bojích, válečníci z Rohu Afriky nejsou k podcenění.#!"
 bush_hunter_flavor: "#F Tito západoafričtí lučišníci využívají těžký křovinatý terén ve svůj prospěch.#!"
 shomer_flavor: "#F Oddaní ochraně své rodiny, židovští shomerové jsou zruční při krytí svých spolubojovníků.#!"
 khandayat_flavor: "#F Indičtí Khandayatové jsou mistři meče, snadno skácí muže i koně.#!"
 garudas_flavor: "#F Garuda bojovníci jsou proslulí svou oddaností a bojem až na smrt. Když padne Garuda bojovník, celý jeho svaz Lenkas se očekává zemřít s ním.#!"
 mountaineer_flavor: "#F Intenzivní výcvik ve vysoké nadmořské výšce dělá tibetské vojáky nezpochybnitelnými mistry svého terénu.#!"
 sahel_horsemen_flavor: "#F Jezdci Sahelu jsou jezdci v lehkém prošívaném brnění a s oštěpy, schopní zničit své nepřátele.#!"
 guinea_warrior_flavor: "#F Bojovníci vysočin Guineje se pohybují rychle a jejich oštěpy jsou přesné a smrtící.#!"
 sarawit_flavor: "#F Sarawit je dobře vycvičená armáda zvyklá na etiopské vysočiny.#!"
 zbrojnosh_flavor: "#F Doma v kopcích a lesích střední Evropy, Zbrojnoši jsou obávaní široko daleko.#!"
 abudrar_flavor: "#F Abudrar horalé znají každý soutěsku a údolí své vlasti.#!"
 palace_guards_flavor: "#F Obvykle hlídají a udržují pořádek, tito všestranní bojovníci mohou tvořit páteř jakékoli armády.#!"
 shenbigong_flavor: "#F Tito elitní kušníci jsou ozbrojeni mocným Shenbigongem, zvaným „Božím lukem“. Každá vystřelená šipka dokáže prorazit brnění i formace s znepokojující přesností.#!"
 mulaththamun_flavor: "#F Tito jezdci pilují své dovednosti celý život v těsném spojení s pouští a skrývají tvář Litham závojem, chránícím se před pískem i rozpoznáním nepřítelem.#!"
 archers_of_the_nile_flavor: "#F Po tisíce let Nubií chránili svou zemi mistrovstvím luku od útlého věku, odhánějí nájezdy i vetřelce.#!"
 paiks_flavor: "#F Pěchota byla základem indických armád po staletí, a žádná zbraň není tak běžná jako bambusový luk, který si mnozí obvykle cvičí lovem od mládí.#!"
 guanch_vaulter_flavor: "#F Ozbrojeni dlouhými tyčemi dokáží tito obratní válečníci snadno překonávat zrádný horský terén a dokonce přeskakovat některá opevnění.#!"
 teulu_flavor: "#F Svěřeni starodávnými přísahami, tito brythonscí jezdci jezdí jako věrné kopí a štít svého pána.#!" # todo: NEW TRANSLATION
 ayrudzi_flavor: "#F Rychlí a chytří v užívání drsného terénu, zároveň těžce obrnění, tito zuřiví šlechtici mohou sloužit jak jako obtěžující jízda, tak hrozivý předvoj.#!"
 conrois_flavor: "#F Kopaté k nájezdům s lancemi v zápřahu, ti bezohlední normanští jezdci se vrhají do jakéhokoliv slabého místa v nepřátelských formacích, dychtiví vykřísnout vítězství prostřednictvím šoku a hrůzy.#!"
 akritai_flavor: "#F Veteráni z venkova, obránci skalnatých průsmyků, kteří používají pečlivé načasování a místní znalosti k obtěžování i nejsilnějších vojsk.#!"
 ballistrai_flavor: "#F Šípy o velikosti kopí vyletují z těchto torzních strojů do obléhaných sídel i nepřátelských formací, způsobují strach a zmatek.#!"
 skoutatoi_flavor: "#F Vysoké #EMP skouton#! štíty těchto pěšáků je odlišují. Jejich hlavní ctností v boji je disciplína, která jim umožňuje dobrý pořádek jak v postupu, tak při ústupu.#!"
 varangian_guards_flavor: "#F Tito proslulí nájezdníci se sekyrami jsou neochvějným jádrem císařského vojska.\n\n@warning_icon! #X Po smrti Basilea si nárokují část [gold|E].#!"
 handpicked_faithful_flavor: "#F Jednotlivě vynikající statečností, loajalitou a talentem, tito bojovníci jsou připraveni obětovat životy k ochraně svého vůdce.#!"
 emishi_horse_archers_flavor: "#F Přinuceni bránit se silnějším hrozbám, Emiští jízdní lučištníci jsou mistry taktiky úder-ústup, nájezdů a přepadů.#!"
 japanese_horse_archers_flavor: "#F Převzali techniky severních Emišů, ale používajíce těžší brnění, samurajové nasednou do sedla s yumi v ruce a sužují své nepřátele šípy."
 warrior_monks_flavor: "#F Bránící, věřící a sloužící svým patronům, životy těchto mnichů zasvěcené oddanosti poskytují mnoho času k výcviku a silná přesvědčení.#!"
 pikemen_militia_flavor: "#F Připravení bojovat za svou zemi a důstojnost. Dotlačeni na pokraj zoufalství, zaměří se na jakéhokoli šlechtického statkáře, aby si vzali, co jim náleží.#!"
 teutonic_knights: "Řádoví rytíři"
 teutonic_knights_flavor: "#F Těžce obrnění a zbožní rytíři, specializovaní na bitvy proti hromadné pěchotě i těžké jízdní nájezdy.#!"
