 accolade_maa_crossbowers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Ať rytíř či zloděj: pečlivě umístěný železný šíp těchto zkušených kušníků prolomí každého.#!" # todo: CONCEPT CASE
 accolade_maa_cameliers: "Elitní jezdci na velbloudech"
 accolade_maa_cameliers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Během staletí obávaní na Středním Východě a severní Africe, taková schopná kavalérie je vzácná.#!" # todo: CONCEPT CASE
 accolade_maa_elephantiers: "Elitní jezdci na slonech"
 accolade_maa_elephantiers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Z vysokých křesel mahoutů je jediné, co je těžší zastavit než nabíhajícího slona, další, #EMP větší#! slon.#!" # todo: CONCEPT CASE
 accolade_maa_horse_archers: "Elitní jízdní lučištníci"
 accolade_maa_horse_archers_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Běžní stepní jezdci mají celoživotní dovednost: tito veteráni ještě větší. Postavit se jim je bolestné, pronásledovat je znamená smrt.#!" # todo: CONCEPT CASE
 accolade_maa_handgunners: "Elitní střelci z ručnic"
 accolade_maa_handgunners_flavor: "[Concept('retinue_maa','Družina ozbrojenců')|E]\n#F Postupujíce klidně skrze dým střelného prachu, tito vysoce vycvičení střelci z ručnic mohou svými mistrně odlitými píšťalami snadno prorážet linie nepřátel.#!" # todo: CONCEPT CASE
 nomadic_riders: "Jezdci hordy"
 nomadic_riders_flavor: "#F Narozeni v sedle, $nomadic_riders$ jsou od dětství cvičeni k boji na koni.#!"
 kheshig: "Kešig"
 kheshig_flavor: "#F Elitní stráž nomádního vládce, $kheshig$ zaručuje bezpečnost svého pána den co den. #EMP khorchin#!, jejich bojová oddělení, rozšiřuje tuto stráž i na bitevní pole.#!"
 nomadic_horde: "[Concept('horde','Nomádská horda')|E]" # todo: CONCEPT CASE
 steppe_raiders: "Stepní nájezdníci"
 steppe_raiders_flavor: "#F Ač nasazeni jako hlídky, tito odřídci se zřídka zdráhají zaútočit na izolované cíle a pustošit neopatrné.#!"
 torch_bearers: "Nositelé pochodní"
 torch_bearers_flavor: "#F Na nekonečné stepi nejsou potřeba obléhací věže ani katapulty — stačí plápolající pochodeň a svižný kůň, aby každou jurtu zapálili.#!"
 heavy_horse_archers: "Těžcí jízdní lučištníci"
 heavy_horse_archers_flavor: "#F Obrnění jezdci nesoucí silné luky. Každý vede skupinu kvalitních koní a tito nomádi mohou vytrvale bojovat na otevřeném poli.#!"
 nomad_lancers: "Nomádští kopiníci"
 nomad_lancers_flavor: "#F Kopí s hákem a praporce z koňských žíní zvedají tuto zářivou linii elitního divokého nomádského jezdectva.#!"
 mangudai: "Mangudaj"
 mangudai_flavor: "#F Odvážní dobrovolní jezdci — 'ti už mrtví' — jsou ti první, kdo vrazí do nepřítele a svou zkázu vtáhnou protivníka do bezhlavého chaosu.#!"
 cataphract_archers: "Katafraktí lučištníci"
 cataphract_archers_flavor: "#F Šípy a čepele se odrážejí od lamelových brnění těchto jezdců i jejich koní. Mezitím jejich luky přinášejí smrt a utrpení.#!"
 maturkan_warriors: "Maturkanští válečníci"
 maturkan_warriors_flavor: "#F Tito váleční princové jsou obránci chladné tajgy a dobře bojují tam, kde koně a nájezdnické družiny sotva stačí.#!"
