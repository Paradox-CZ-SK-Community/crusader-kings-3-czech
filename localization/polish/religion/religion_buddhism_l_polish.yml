 ari_desc: "Víra ari spojuje prvky tantrického buddhismu, uctívání duchů, tradičního kultu nágů a hinduismu. Vyznavači ari jsou považováni za buddhisty, přestože jejich praktiky jsou pokládány za poněkud neortodoxní."
 theravada: "Théraváda"
 theravada_adj: "Théravádový"
 theravada_adherent: "Théravádový buddhista"
 theravada_adherent_plural: "Théravádoví buddhisté"
 theravada_desc: "Cesta k osvícení vede skrze osobní zkušenost, rozjímání a uvažování. Gautama Buddha nalezl svou vlastní cestu k nirváně a podobnou cestu lze nalézt jedině prožíváním, poznáváním a zkoumáním vlastní existence."
 mahayana: "Mahájána"
 mahayana_adj: "Mahájánový"
 mahayana_adherent: "Mahájánový buddhista"
 mahayana_adherent_plural: "Mahájánoví buddhisté"
 mahayana_desc: "Vysvobození ze sansáry není pouze individuálním úsilím, nýbrž zkušeností sdílenou všemi cítícími bytostmi. Dosažení buddhovství je jedním krokem na dlouhé cestě k vysvobození všech cítících bytostí do nirvány, což je ctnostným cílem sansáry."
 vajrayana: "Vadžrajána"
 vajrayana_adj: "Vadžrajánový"
 vajrayana_adherent: "Vadžrajánový buddhista"
 vajrayana_adherent_plural: "Vadžrajánoví buddhisté"
 vajrayana_desc: "Pohnutka k dosažení buddhovství má zásadní význam a pravého osvícení lze dosáhnout jedině tehdy, je-li hledáno ku prospěchu všech cítících bytostí. Všechny bytosti se rodí s osvícenou myslí, kterou však zastírá jejich existence. Cvičení ve vnímání pravdy světa a vesmíru proto odhaluje vrozené osvícení každého člověka."
