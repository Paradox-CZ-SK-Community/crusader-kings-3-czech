 dhyana: "Dhjána"
 dhyana_adj: "Dhjánový"
 dhyana_adherent: "Dhjánový buddhista"
 dhyana_adherent_plural: "Dhjánoví buddhisté"
 dhyana_desc: "Dhjánový buddhismus klade silný důraz na hlubokou meditaci jako jedinou schůdnou cestu k osvícení – pravého porozumění lze dosáhnout pouze vnitřním rozjímáním a kontemplací, nikoli studiem posvátných textů."
 vinaya: "Vinaja"
 vinaya_adj: "Vinajový"
 vinaya_adherent: "Vinajový buddhista"
 vinaya_adherent_plural: "Vinajoví buddhisté"
 vinaya_desc: "Vyznavači vinajového buddhismu podřizují sebe i ostatní přísným mravním a etickým zásadám, neboť sebekázeň je nezbytným základem pro hledání hluboké moudrosti."
 pundarika: "Pundaríka"
 pundarika_adj: "Pundaríkový"
 pundarika_adherent: "Pundaríkový buddhista"
 pundarika_adherent_plural: "Pundaríkoví buddhisté"
 pundarika_desc: "Pundaríkový buddhismus ctí Lotosovou sútru nade všechny ostatní texty, klade důraz na mantry a složité obřady a vznikl spojením tantrických a esoterických prvků, které se do Číny dostaly po Hedvábné stezce."
 sukhavati: "Sukhávatí"
 sukhavati_adj: "Sukhávatíský"
 sukhavati_adherent: "Sukhávatíský buddhista"
 sukhavati_adherent_plural: "Sukhávatíští buddhisté"
 sukhavati_desc: "Sukhávatí neboli buddhismus Čisté země učí, že tradičními cestami již nelze dosáhnout osvícení. Vzýváním Amitábhova soucitu skrze opakování jeho jména se však může každý po smrti znovuzrodit v jeho Čisté zemi, ať už je mnichem, nebo laikem."
 yogacara: "Jógačára"
 yogacara_adj: "Jógačárový"
 yogacara_adherent: "Jógačárový buddhista"
 yogacara_adherent_plural: "Jógačároví buddhisté"
 yogacara_desc: "Jógačároví buddhisté zpochybňují vše, co ostatní po celý život jednoduše považují za samozřejmé, a hmotný svět pokládají pouze za projev vlastního vědomí."
 avatamsaka: "Avatamsaka"
 avatamsaka_adj: "Avatamsakový"
 avatamsaka_adherent: "Avatamsakový buddhista"
 avatamsaka_adherent_plural: "Avatamsakoví buddhisté"
 avatamsaka_desc: "Avatamsakoví buddhisté považují Sútru květinového věnce za nejvyšší zdroj pravdy. Ta pojednává o nekonečném množství světů a celých vesmírech obsažených v jediném zrnku prachu."
 mantrayana: "Mantrajána"
 mantrayana_adj: "Mantrajánový"
 mantrayana_adherent: "Mantrajánový buddhista"
 mantrayana_adherent_plural: "Mantrajánoví buddhisté"
 mantrayana_desc: "Mantrajánoví buddhisté prohlubují své porozumění nejhlubším pravdám a urychlují svou duchovní cestu pomocí mnoha esoterických obřadů a mystických pomůcek."
 maitreya: "Maitréja"
 maitreya_adj: "Maitréjský"
 maitreya_adherent: "Maitréjista"
 maitreya_adherent_plural: "Maitréjisté"
 maitreya_desc: "Věk Buddhy Šákjamuniho skončil a Buddha Maitréja sestoupil na svět – alespoň tomu věří ti, kteří Maitréju oslavují a přijímají jako svého prorokovaného spasitele. Svět může být zachráněn pouze zničením starého řádu."
 maitreya_religious_head_title: "Hierarcha"
 maitreya_religious_head_title_name: "Náboženské řády"
 acharya: "Áčárja"
 acharya_adj: "Áčárjský"
 acharya_adherent: "Áčárjista"
 acharya_adherent_plural: "Áčárjisté"
 acharya_desc: "Áčárja, odvozená od vadžrajánového buddhismu, se zformovala v 9. století prolnutím a spojením čínských obřadů s tibetskými tantrickými praktikami, čímž vznikla jedinečná místní podoba buddhistické praxe a uctívání."
