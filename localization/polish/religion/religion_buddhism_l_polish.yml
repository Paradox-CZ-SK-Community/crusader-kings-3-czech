 buddhism_religion_desc: "Buddhismus následuje učení Gautamy Buddhy a pozdějších „osvícených“, aby překonal utrpení existence působené nekonečným koloběhem proměn skrze smrt a znovuzrození. Dosažení osvícení je cestou k vysvobození ze sansáry a přechodu do nebytí nirvány."
