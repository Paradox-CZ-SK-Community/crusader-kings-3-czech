 GLOSS_NEMBUTSU: "Opakování Amitábhova jména je starobylá buddhistická praxe bdělé pozornosti, která si získala značnou oblibu ve východoasijských školách. V Číně je známá jako nianfo a v Japonsku jako nembucu. Některé školy ji považují za přímé vzývání Amitábhova milosrdenství, díky jehož milosti může být mnich i laik přijat do Čisté země."
