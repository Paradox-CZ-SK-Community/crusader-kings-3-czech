 lamaism_desc: "Buddhismus je v Tibetu znám jako nangčhö neboli Dharma zasvěcených. V Tibetské říši se víra a praktiky vadžrajány a mahájány propojily s tradičními tibetskými představami, obřady a božstvy, zatímco jednotlivé školy mezi sebou soupeřily také o světskou moc."
