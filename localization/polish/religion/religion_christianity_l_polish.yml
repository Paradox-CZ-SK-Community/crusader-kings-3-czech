 bosnian_church_adj: "Krstjanský"
 bosnian_church_adherent: "Krstjan"
 bosnian_church_adherent_plural: "Krstjani"
 bosnian_church_desc: "Katolíci i pravoslavní na Krstjany z bosenské vysočiny již dávno zapomněli. Jsou shovívavější než jejich známější souvěrci, postrádají však formální uspořádání. Zachovávají mnohé archaické prvky křesťanství a ostatní souvěrci jimi často pohrdají, vzpomenou-li si na ně vůbec."
