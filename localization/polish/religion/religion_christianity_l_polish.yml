 mozarabic_church: "Mozarabismus"
 mozarabic_church_adj: "Mozarabský"
 mozarabic_church_adherent: "Mozarab"
 mozarabic_church_adherent_plural: "Mozarabové"
 mozarabic_church_desc: "Mozarabské křesťanství vychází z raných iberských obřadů a díky staletím pod islámskou nadvládou si zachovalo značnou nezávislost na Římu. Dlouhé soužití s jinými vírami vedlo jeho stoupence k větší snášenlivosti vůči odlišnostem, než jakou projevují fundamentalističtější sekty."
 adoptionist: "Adopcianismus"
 adoptionist_adj: "Adopcianistický"
 adoptionist_adherent: "Adopcianista"
 adoptionist_adherent_plural: "Adopcianisté"
 adoptionist_desc: "Iberská větev adopcianismu má kořeny v souběhu nezávislého myšlení v toledském arcibiskupství a okolních biskupských stolcích, severoafrického puritanismu předchozích staletí a působení několika mimořádně charismatických hereziarchů z počátku 9. století.\n\nAčkoli nabývá mnoha podob, od nanejvýš rafinovaných až po zcela přímočaré, jeho společným věroučným bodem je zpochybňování věčného božství Syna."
 adoptionist_religious_head_title: "Arcibiskup"
 adoptionist_religious_head_title_name: "Arcibiskupství"
 conversos: "Conversos"
 conversos_adj: "Converso"
 conversos_adherent: "Converso"
 conversos_adherent_plural: "Conversos"
 conversos_desc: "Conversos vznikli násilným obracením židovských obcí na křesťanství. Přestože přijali svou novou víru, stále si pamatují staré tradice a chovají pochopení pro ty, kteří je dosud následují."
 orthodox: "Pravoslaví"
 orthodox_adj: "Pravoslavný"
 orthodox_adherent: "Pravoslavný"
 orthodox_adherent_plural: "Pravoslavní"
 orthodox_desc: "Východní pravoslavná církev tvrdí, že její biskupové jsou pravými a přímými nástupci Kristových apoštolů, a pokládá se proto za původní křesťanskou víru předávanou prostřednictvím posvátné liturgické tradice."
 orthodox_religious_head_title: "Patriarcha"
 orthodox_religious_head_title_name: "Patriarchát"
 bogomilist: "Bogomilství"
 bogomilist_adj: "Bogomilský"
 bogomilist_adherent: "Bogomil"
 bogomilist_adherent_plural: "Bogomilové"
 bogomilist_desc: "Bogomilové si volí duchovní vůdce z řad prostého lidu, odmítají veškerou světskou okázalost a mocenské instituce a místo nich prosazují návrat k původním způsobům duchovního učení, jež používali Kristus a jeho učedníci."
 bogomilist_priest: "Vyvolený"
 bogomilist_priest_plural: "Vyvolení"
 paulician: "Paulikiánství"
 paulician_adj: "Paulikiánský"
 paulician_adherent: "Paulikián"
 paulician_adherent_plural: "Paulikiáni"
 paulician_desc: "Paulikiáni odmítají Kristovo božství a uctívání kříže považují za pohanské. Usilují proto o obnovení toho, co pokládají za pravou podobu křesťanství, jak ji vyložil Pavel z Tarsu."
 paulician_religious_text: "Klíč pravdy"
 paulician_religious_text_2: "$paulician_religious_text$"
 paulician_religious_text_3: "$paulician_religious_text$"
 iconoclast: "Ikonoklasmus"
 iconoclast_adj: "Ikonoklastický"
 iconoclast_adherent: "Ikonoklasta"
 iconoclast_adherent_plural: "Ikonoklasté"
 iconoclast_desc: "Ikonoklasté věří, že jakékoli používání duchovních symbolů porušuje druhé přikázání zakazující vytváření rytin. Usilují proto o zničení existujících náboženských vyobrazení a odmítají tvorbu nových."
 coptic: "Koptské křesťanství"
 coptic_adj: "Koptský"
 coptic_adherent: "Kopt"
 coptic_adherent_plural: "Koptové"
 coptic_desc: "Koptská církev odvozuje svůj původ od svatého Marka Evangelisty a proslula jako kolébka křesťanského mnišství i svou dlouhou tradicí podpory vzdělanosti a filozofie."
 coptic_religious_head_title: "$christianity_religious_head_title$"
 coptic_religious_head_title_name: "$christianity_religious_head_title_name$"
