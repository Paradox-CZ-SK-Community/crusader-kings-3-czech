 east_christian_household_god_name_possessive: "Sv. Josefa"
 east_christian_knowledge_god_name: "Sv. Marek"
 east_christian_knowledge_god_name_possessive: "Sv. Marka"
 east_christian_war_god_name: "Sv. Mořic"
 east_christian_war_god_name_possessive: "Sv. Mořice"
 armenian_apostolic: "Arménská apoštolská církev"
 armenian_apostolic_adj: "Apoštolský"
 armenian_apostolic_adherent: "Apoštolský křesťan"
 armenian_apostolic_adherent_plural: "Apoštolští křesťané"
 armenian_apostolic_desc: "Arménská apoštolská církev, založená apoštoly Bartolomějem a Tadeášem, si v oblasti rychle získala stoupence a přivedla Arménské království k tomu, že se stalo prvním státem v dějinách, který přijal křesťanství za své oficiální náboženství."
 apostolic_religious_head_title: "Katolikos"
 apostolic_religious_head_title_plural: "Katolikové"
 apostolic_religious_head_title_name: "Církev"
 nestorian: "Nestoriánství"
 nestorian_adj: "Nestoriánský"
 nestorian_adherent: "Nestorián"
 nestorian_adherent_plural: "Nestoriáni"
 nestorian_desc: "Nestoriánství učí, že Ježíš Kristus má dvě přirozenosti, jednu božskou a jednu lidskou, a většina křesťanských vyznání je proto prohlásila za kacířské. Navzdory tomu si jeho osobitý pohled získal stoupence až v daleké Číně, Indii, a dokonce i Mongolsku."
 nestorian_religious_head_title: "Patriarcha"
 nestorian_religious_head_title_name: "Patriarchát"
 messalian: "Messalianismus"
 messalian_adj: "Messaliánský"
 messalian_adherent: "Messalián"
 messalian_adherent_plural: "Messaliáni"
 messalian_desc: "Messaliáni věří, že Boží podstatu lze vnímat tělesnými smysly. Odmítají proto tradiční křesťanské svátosti a místo nich se snaží zakoušet Boha přímo prostřednictvím méně obvyklých způsobů uctívání."
 messalian_priest: "Perfectus"
 messalian_priest_plural: "Perfecti"
 adamites: "Adamitství"
 adamites_adj: "Adamitský"
 adamites_adherent: "Adamita"
 adamites_adherent_plural: "Adamité"
 adamites_desc: "Adamité tvrdí, že odložením oděvu znovu dosáhli původního stavu nevinnosti Adama a Evy. Jejich skupiny často žijí v naprosté bezzákonnosti a prohlašují, že díky této nevinnosti nemohou být jejich činy ani dobré, ani zlé."
