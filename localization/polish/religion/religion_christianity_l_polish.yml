 waldensian_adj: "Valdenský"
 waldensian_adherent: "Valdenský"
 waldensian_adherent_plural: "Valdenští"
 waldensian_desc: "Valdenští považují hromadění bohatství za ohavnost neslučitelnou s dosažením spásy, a proto hlásají apoštolskou chudobu jako cestu k dokonalosti a věří, že kněží nemají vlastnit žádné tituly ani pozemky."
 lollard: "Lollardství"
 lollard_adj: "Lollardský"
 lollard_adherent: "Lollard"
 lollard_adherent_plural: "Lollardi"
 lollard_desc: "Lollardi odmítají mnohé běžné křesťanské svátosti, například křest a zpověď, a tvrdí, že Písmo svaté je jediným platným pramenem křesťanské nauky a že každé učení, které z něj přímo nevychází, je ze své podstaty nelegitimní."
 insular_celtic: "Insularismus"
 insular_celtic_adj: "Insulární"
 insular_celtic_adherent: "Insularista"
 insular_celtic_adherent_plural: "Insularisté"
 insular_celtic_desc: "Tato venkovská církev se před několika staletími odchýlila od římskokatolické ortodoxie a na nátlak své mateřské církve přišla o mnohé ze svých někdejších osobitých rysů. Nadále však klade větší důraz na pokání a mnišství a zachovává mnohé tradiční keltské sňatkové zvyky, které jsou širšímu křesťanskému světu cizí."
