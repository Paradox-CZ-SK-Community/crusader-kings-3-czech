 tenet_gruesome_festivals_name: "Hrůzné slavnosti"
 tenet_gruesome_festivals_desc: "Všichni se rodíme v krvi. Přežíváme díky krvi našeho dobytka, naší rodiny a našich nepřátel. Je jen přirozené, že [ROOT.Faith.PantheonTerm] požadují svůj spravedlivý díl."
 gruesome_festivals_active_name: "Možnost pořádat velkolepé oběti"
 doctrine_parameter_gruesome_festivals_active: "Přibližně jednou za desetiletí lze pořádat velkolepé oběti ovlivňující poddané stejné [Concept('faith','víry')|E] a [Concept('county_opinion','lidové mínění')|E]"
 tenet_volcanic_veneration_name: "Uctívání sopek"
 tenet_volcanic_veneration_desc: "Sotva může být něco božštějšího než nově zrozená země tryskající z ohnivých hlubin našeho domova. Celý život trávíme na pokraji pohromy, navždy vydáni na milost [ROOT.Faith.PantheonTerm]."
 tenet_cthonic_redoubts_name: "Chtonické bašty"
 tenet_cthonic_redoubts_desc: "Není lepšího úkrytu než v kořenech Země, pevnější tvrze než mezi jejími vyčnívajícími hřbety ani posvátnější pouti než po jejích skrytých stezkách. Z těchto vysokých vrcholů shlížíme na Stvoření a pociťujeme skutečnou tíhu božství."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "Rychlost [Concept('convert_county','obracení hrabství na víru')|E] v hornatém [Concept('terrain','terénu')|E]: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
