 doctrine_parameter_divine_marriage_opinion: "Vyznavači sezdaní s [Concept('close_family','členem blízké rodiny')|E] získávají od [Concept('vassals','vazalů')|E] stejné [Concept('faith','víry')|E] $VALUE|0+=$ [Concept('opinion','mínění')|E]"
 doctrine_parameter_divine_marriage_piety_gain_active: "Manželský bonus [GetFaithDoctrine('doctrine_monogamy').GetBaseName] rovněž poskytne velké množství [Concept('piety','zbožnosti')|E], pokud uzavíráš sňatek s [Concept('close_family','členem blízké rodiny')|E]"
