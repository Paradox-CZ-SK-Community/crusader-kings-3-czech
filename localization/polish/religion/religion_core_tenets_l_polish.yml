 tenet_christian_syncretism_name: "Křesťanský synkretismus"
 tenet_christian_syncretism_desc: "Ježíš Nazaretský možná nebyl skutečným božstvem, přesto však byl čestnou a ctnostnou osobností. Měli bychom ctít a respektovat jeho učení."
