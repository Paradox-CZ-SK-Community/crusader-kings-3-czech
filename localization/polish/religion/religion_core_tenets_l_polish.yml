 doctrine_parameter_tenet_harmonious_society_five_bonds: "Za vztahy s [opinion|E] #V 50#! nebo vyšším získáte [piety_i][piety|E] a [prestige_i][prestige|E]: [liege|E] nebo [vassal|E], rodič nebo dospělé dítě, manžel či manželka, dospělý sourozenec a [friend|E]" # todo: NEW TRANSLATION
