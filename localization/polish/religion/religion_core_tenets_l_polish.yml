 tenet_pentarchy_name: "Církevní hierarchie"
 tenet_pentarchy_alternate_name: "Pentarchie"
 tenet_pentarchy_desc: "Naše svatá místa nejsou pouhými posvátnými místy – jsou samotnými sídly moci, z nichž vládnou naši náboženští představitelé."
 tenet_aniconism_name: "Anikonismus"
 tenet_aniconism_desc: "Uctívání tesaných obrazů zaslepilo před božskou pravdou již příliš mnoho lidí. Odstraníme ze svých svatých míst všechny ikony, aby naši věřící neupadli do stejné pasti."
