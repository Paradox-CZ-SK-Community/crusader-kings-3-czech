 tenet_pursuit_of_knowledge_desc: "Ti, kteří se narodili s vrozeným nadáním pro vědění, jsou nadřazení. Ti, kteří vědomě hledají poznání, jsou druzí. Ti, kdo jsou tupí a nevyhledávají učení, patří k nejnižším lidem." # todo: NEW TRANSLATION
