 tenet_eastern_syncretism_name: "$rf_eastern$ synkretismus"
 tenet_eastern_syncretism_desc: "Ze způsobu, jakým se různá dharmická náboženství navzájem tolerují, se můžeme mnohému naučit. Možná nenásledují pravou víru, to z nich však nečiní zlo."
