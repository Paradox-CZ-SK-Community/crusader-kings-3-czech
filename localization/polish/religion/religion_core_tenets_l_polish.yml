 tenet_carnal_exaltation_desc: "Tělesné rozkoše jsou vznešené způsobem, který přesahuje ostatní pozemské prožitky a přibližuje nás božství. Měli bychom oslavovat své sexuální touhy a vyhledávat příležitosti k jejich naplnění."
