l_polish:
 doctrine_core_tenets_name: "Zásady"
 tenets_name: "Zásady"
 tenet_communion_name: "Společenství"
 tenet_communion_desc: "Naše obřady nejsou pouhými symboly – přivolávají samotnou přítomnost božství. Ti, kdo se k nám při jejich vykonávání nemohou nebo nechtějí připojit, nemohou být pravými věřícími."
 doctrine_parameter_seek_indulgences_active: "Postavy mohou u své [Concept('head_of_faith','hlavy víry')|E] #V žádat o odpustky#! a zaplatit [Concept('gold','zlatem')|E] výměnou za [Concept('piety','zbožnost')|E]"
 doctrine_parameter_seek_indulgences_active_2: "Postavy, které se dopustily [Concept('criminal','zločinných')|E] činů, mohou místo toho #V žádat o odpustky#!, aby jim bylo odpuštěno"
 doctrine_parameter_excommunication_active: "Duchovní [Concept('heads_of_faith','hlavy víry')|E] mohou [Concept('excommunicate','exkomunikovat')|E] jiné postavy své [Concept('faith','víry')|E]"
 tenet_excommunicated: "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 tenet_armed_pilgrimages_name: "Ozbrojené poutě"
 tenet_armed_pilgrimages_desc: "Naši poutníci cestují napříč světem, aby navštívili naše posvátná místa – rádi se chopíme meče, abychom je ochránili před každým, kdo by jim chtěl ublížit."
 doctrine_parameter_cheaper_holy_wars_active: "Náklady na [Concept('piety','zbožnost')|E] při vyhlášení [Concept('holy_wars','svatých válek')|E] jsou pro [Concept('rulers','vládce')|E] této [Concept('faith','víry')|E] o #P -20%#! nižší"
 doctrine_parameter_great_holy_wars_active: "Pokud existuje [Concept('head_of_faith','hlava víry')|E], může při vysoké [Concept('fervor','horlivosti')|E] [Concept('faith','víry')|E] vyhlásit [Concept('great_holy_war','velkou svatou válku')|E]"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "Pokud neexistuje žádná [Concept('head_of_faith','hlava víry')|E], získávají vyznavači za každé ovládané [Concept('holy_site','svaté místo')|E] bonus k [Concept('councillor_task','úkolu rádce')|E] [Concept('convert_county','Obracení hrabství na víru')|E]"
 doctrine_parameter_pilgrimage_decision_active: "Postavy této [Concept('faith','víry')|E] získají po úspěšném dokončení [Concept('pilgrimage','pouti')|E] další bonus"
 tenet_monasticism_name: "Mnišství"
 tenet_monasticism_desc: "Požitky z vybraného jídla a pití nás pouze odvádějí od služby božství. Nejlepším způsobem, jak se těmto pokušením vyhnout, je uchýlit se do odlehlých klášterů."
 doctrine_parameter_take_vows_active: "[courtiers|E] mohou složit řeholní sliby a stát se [GetTrait('devoted').GetName( GetNullCharacter )]"
 tenet_divine_marriage_name: "Božský sňatek"
 tenet_divine_marriage_xwedodah: "Chvétódáh"
 tenet_divine_marriage_desc: "Sňatky mezi blízkými příbuznými napodobujeme posvátné svazky prvních stvořených bytostí. Dobré vlastnosti se budou předávat naší rodovou linií, čímž získáme čistotu a přízeň ve věčném boji proti zlu."
 doctrine_parameter_divine_marriage_opinion: "Vyznavači sezdaní s [Concept('close_family','členem blízké rodiny')|E] získávají od [Concept('vassals','vazalů')|E] stejné [Concept('faith','víry')|E] $VALUE|0+=$ [Concept('opinion','mínění')|E]"
 doctrine_parameter_divine_marriage_piety_gain_active: "Manželský bonus [GetFaithDoctrine('doctrine_monogamy').GetBaseName] rovněž poskytne velké množství [Concept('piety','zbožnosti')|E], pokud uzavíráš sňatek s [Concept('close_family','členem blízké rodiny')|E]"
 tenet_pacifism_name: "Pacifismus"
 tenet_pacifism_desc: "Násilí je odporný čin, který vede pouze k utrpení, bolesti a lítosti. Budeme-li se mu vyhýbat, kdykoli je to možné, můžeme pro věřící vybudovat silnější a bezpečnější společnost."
 doctrine_parameter_holy_wars_forbidden: "Nelze vyhlašovat [Concept('holy_wars','svaté války')|E] ani podnikat [Concept('raid','nájezdy')|E]"
 doctrine_parameter_pacifist_opinion_active: ""
 pacifist_opinion_active_opinion_name: "Spřízněný pacifista"
 pacifist_opinion_active_county_opinion_name: "Hrabství spřízněných pacifistů"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "[Concept('opinion','Mínění')|E] o ostatních pacifistech: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "Měsíční změna [Concept('piety','zbožnosti')|E] [Concept('rulers','vládců')|E], kteří žijí v míru alespoň dva roky: $VALUE|+$"
 PIETY_LONG_PEACE: "Dlouhý mír"
 tenet_vows_of_poverty_name: "Sliby chudoby"
 tenet_vows_of_poverty_desc: "Peníze kazí lidská srdce a odvádějí je od pravé víry. Chceme-li se soustředit na to, na čem skutečně záleží, musíme se zříci hromadění hmotného bohatství."
 doctrine_parameter_vows_of_poverty_active: "[rulers|E] se mohou [Concept('decide','rozhodnout')|E] složit slib chudoby, čímž sníží měsíční příjem z [Concept('tax','daní')|E], ale zvýší měsíční přírůstek [Concept('piety','zbožnosti')|E]"
 tenet_human_sacrifice_name: "Lidské oběti"
 tenet_human_sacrifice_desc: "Nejlepším způsobem, jak prokázat svou oddanost, je přinést oběť. Nejcennější obětí, jakou můžeme nabídnout, je lidský život."
 doctrine_parameter_human_sacrifice_active: "[executions|E] přinášejí [Concept('piety','zbožnost')|E], místo aby ji stály\n$EFFECT_LIST_BULLET$[executions|E] při [Concept('sharing_power','sdílení moci')|E] nikdy nestojí [Concept('prestige','prestiž')|E]"
 doctrine_parameter_flower_war_cb_active: "Zpřístupňuje [Concept('casus_belli','casus belli')|E] [Concept('flowery_war','Nájezd za zajatci')|E] proti sousedním panstvím"
 tenet_gruesome_festivals_blot_name: "Blót"
 tenet_gruesome_festivals_name: "Hrůzné slavnosti"
 tenet_gruesome_festivals_desc: "Všichni se rodíme v krvi. Přežíváme díky krvi našeho dobytka, naší rodiny a našich nepřátel. Je jen přirozené, že [ROOT.Faith.PantheonTerm] požadují svůj spravedlivý díl."
 gruesome_festivals_active_name: "Možnost pořádat velkolepé oběti"
 doctrine_parameter_gruesome_festivals_active: "Přibližně jednou za desetiletí lze pořádat velkolepé oběti ovlivňující poddané stejné [Concept('faith','víry')|E] a [Concept('county_opinion','lidové mínění')|E]"
 tenet_volcanic_veneration_name: "Uctívání sopek"
 tenet_volcanic_veneration_desc: "Sotva může být něco božštějšího než nově zrozená země tryskající z ohnivých hlubin našeho domova. Celý život trávíme na pokraji pohromy, navždy vydáni na milost [ROOT.Faith.PantheonTerm]."
 tenet_cthonic_redoubts_name: "Chtonické bašty"
 tenet_cthonic_redoubts_desc: "Není lepšího úkrytu než v kořenech Země, pevnější tvrze než mezi jejími vyčnívajícími hřbety ani posvátnější pouti než po jejích skrytých stezkách. Z těchto vysokých vrcholů shlížíme na Stvoření a pociťujeme skutečnou tíhu božství."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "Rychlost [Concept('convert_county','obracení hrabství na víru')|E] v hornatém [Concept('terrain','terénu')|E]: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "Rychlost [Concept('promote_culture','prosazování kultury')|E] v hornatém [Concept('terrain','terénu')|E] stejné [Concept('faith','víry')|E]: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "Rychlost nepřátelského [Concept('convert_county','obracení hrabství na víru')|E] v hornatém [Concept('terrain','terénu')|E]: #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"
 tenet_consolamentum_name: "Endura"
 tenet_consolamentum_name_alternate: "Rituální sebevražda"
 tenet_consolamentum_desc: "Když zestárneme nebo onemocníme, podstoupíme obřad, který očistí naše duše od hříchu. Poté rychle a rozhodně ukončíme svůj život, aby nás hřích již nemohl znovu poskvrnit."
 doctrine_parameter_consolamentum_active: "Vyznavači se mohou ve stáří, při nezpůsobilosti nebo blížící se smrti [Concept('decide','rozhodnout')|E] ukončit svůj život, aniž by tím utrpěli obvyklé postihy za sebevraždu"
 tenet_gnosticism_name: "Gnosticismus"
 tenet_gnosticism_desc: "Poznání může osvobodit božskou jiskru spočívající v každém člověku a navrátit ji k jejímu nebeskému zdroji v říši duchů."
 doctrine_parameter_hostility_override_tenet_gnosticism: "Ostatní gnostické a dualistické [Concept('faiths','víry')|E] považuje za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] namísto $hostility_hostile_tooltippable$ nebo $hostility_evil_tooltippable$"
 doctrine_parameter_hostility_override_special_doctrine_is_gnostic_faith: ""
 doctrine_parameter_granting_titles_gives_stress: "Rozdávání [Concept('titles','titulů')|E] snižuje úměrné množství [Concept('stress','stresu')|E]"
 tenet_mendicant_preachers_name: "Žebraví kazatelé"
 tenet_mendicant_preachers_desc: "Naši misionáři putují do dalekých krajů jen v šatech, které mají na sobě. Žijí ze štědrosti těch, jež navštěvují, a na oplátku se s nimi dělí o poznání pravé víry."
 doctrine_parameter_mendicant_preachers_conversion_active: "Rychlost obracení hrabství: #P +33#!"
 tenet_communal_identity_name: "Pospolitá identita"
 tenet_communal_identity_desc: "Naše víra a kultura jsou od sebe neoddělitelné. Tato tradice posiluje pouta našeho společenství, má však sklon vylučovat cizince."
 doctrine_parameter_same_communal_identity_opinion_active: "[Concept('opinion','Mínění')|E] u postav stejné [Concept('faith','víry')|E]: #P +10#!"
 doctrine_parameter_same_culture_conversion_bonus_active: "Rychlost obracení v [Concept('counties','hrabstvích')|E] mé [Concept('culture','kultury')|E]: #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active: "Rychlost prosazování kultury v [Concept('counties','hrabstvích')|E] mé [Concept('faith','víry')|E]: #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active: "Rychlost obracení v [Concept('counties','hrabstvích')|E] jiné [Concept('culture','kultury')|E]: #N -50%#!"
 tenet_pentarchy_name: "Církevní hierarchie"
 tenet_pentarchy_alternate_name: "Pentarchie"
 tenet_pentarchy_desc: "Naše svatá místa nejsou pouhými posvátnými místy – jsou samotnými sídly moci, z nichž vládnou naši náboženští představitelé."
 tenet_aniconism_name: "Anikonismus"
 tenet_aniconism_desc: "Uctívání tesaných obrazů zaslepilo před božskou pravdou již příliš mnoho lidí. Odstraníme ze svých svatých míst všechny ikony, aby naši věřící neupadli do stejné pasti."
 doctrine_parameter_reforging_artifacts_costs_piety: "[Concept('rulers','Vládci')|E] této [Concept('faith','víry')|E] musí vynaložit [Concept('piety','zbožnost')|E], aby mohli [Concept('reforge','překovat')|E] nebo [Concept('repair','opravit')|E] [Concept('artifacts','artefakty')|E]"
 doctrine_parameter_destroying_artifacts_is_pious: "[Concept('rulers','Vládci')|E] této [Concept('faith','víry')|E] mohou ničit [Concept('artifacts','artefakty')|E] a získávat za ně [Concept('piety','zbožnost')|E]"
 destroying_artifacts_is_not_pious_tt: "Tvá [Concept('faith','víra')|E] nemůže ničit [Concept('artifacts','artefakty')|E] výměnou za [Concept('piety','zbožnost')|E]"
 artifact_is_rarer_than_masterwork_tt: "Tento [Concept('artifact','artefakt')|E] svou [Concept('rarity','vzácností')|E] převyšuje mistrovské dílo"
 tenet_alexandrian_catechism_name: "Alexandrijský katechismus"
 tenet_alexandrian_catechism_desc: "Alexandrijská katechetická škola měla dlouhou tradici, která povzbuzovala teology ke kritickému myšlení a zpochybňování zavedeného stavu.\n\nPřestože byla škola fyzicky zničena, v těchto tradicích pokračujeme."
 tenet_islamic_rationalism_name: "Islámský racionalismus"
 tenet_islamic_rationalism_desc: "Spravedlnost a moudrost [ROOT.Faith.HighGodNameAlternate] znamenají, že [ROOT.Faith.HighGodNameSheHe|U] nemůže jednat proti rozumu ani přehlížet blaho [ROOT.Faith.HighGodHerHis|U] stvoření. Pouze vlastním rozumem můžeme doufat, že pochopíme svou úlohu ve [ROOT.Faith.HighGodHerHis|U] velkém díle a rozeznáme dobro od zla."
 tenet_hedonistic_name: "Hédonismus"
 tenet_hedonistic_desc: "Božství naplnilo tento svět hojností rozkoší, které si máme dopřávat a užívat – odmítat je znamená pohrdat samotným dílem stvoření."
 doctrine_parameter_piety_from_feasts_active: "[GetActivityType('activity_feast').GetName] přináší [Concept('piety','zbožnost')|E]"
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]"
 doctrine_parameter_piety_from_festivals_active_auh: "[GetActivityType('activity_festival').GetName] přináší [Concept('piety','zbožnost')|E]"
 tenet_carnal_exaltation_name: "Tělesné povznesení"
 tenet_carnal_exaltation_desc: "Tělesné rozkoše jsou vznešené způsobem, který přesahuje ostatní pozemské prožitky a přibližuje nás božství. Měli bychom oslavovat své sexuální touhy a vyhledávat příležitosti k jejich naplnění."
 tenet_polyamory_name: "Polyamorie"
 tenet_polyamory_desc: "Naše vzájemná láska by měla být stejně bezpodmínečná jako láska [ROOT.Faith.FertilityGodNamePossessive] k nám. Musíme zavrhnout zastaralou představu, že jeden člověk může vlastnit náklonnost druhého."
 doctrine_parameter_no_unfaithfulness_penalty_active: "Za mimomanželské vztahy nezískávají vyznavači vůči svému manželskému protějšku ani jeho milencům postihy k [Concept('opinion','mínění')|E] či [Concept('imprisonment_reasons','důvody k uvěznění')|E]"
 tenet_unrelenting_faith_name: "Neochvějná víra"
 tenet_unrelenting_faith_desc: "Naše přesvědčení je pevné a za svou víru budeme ochotně bojovat i umírat. Bez ohledu na to, jak beznadějně budou okolnosti stát proti nám, se nevzdáme."
 tenet_unrelenting_faith_zandik_name: "Spravedlivá vzpoura"
 tenet_unrelenting_faith_zandik_desc: "Nechceme ublížit žádné duši ani žádné bytosti, budou-li však naše zvyklosti ohroženy, budeme je bránit s neutuchající zuřivostí."
 tenet_rite_name: "Ritus"
 tenet_rite_desc: "Naše přesvědčení se od přesvědčení naší mateřské víry tolik neliší… Proč bychom se měli přít o podrobnosti, když se shodujeme na hlavních bodech učení, a především na nejvyšší autoritě, která rozhoduje naše spory?"
 doctrine_parameter_maintains_head_of_faith_on_creation: "Nově vytvořené [Concept('faiths','víry')|E] si zachovají svou původní [Concept('head_of_faith','hlavu víry')|E]"
 doctrine_parameter_ecumenical_christians_keep_ecumenism: "[GetPlayer.Custom('GetRiteEcumenismFullOrEmpty')]"
 GetRiteEcumenismFullOrEmpty_full: "Křesťanské [Concept('faiths','víry')|E] s [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName] si tuto doktrínu při vytvoření zachovají"
 GetRiteEcumenismFullOrEmpty_empty: ""
 tenet_struggle_submission_name: "Boj a odevzdání"
 tenet_struggle_submission_desc: "Božská vůle je zdrojem všeho dobra, a proto dobrý život spočívá v odevzdání se této vůli, vyjádřeném úsilím o její naplnění."
 doctrine_parameter_bonus_holy_war_piety_active: "Zisk [Concept('piety','zbožnosti')|E] a [Concept('piety_experience','oddanosti')|E] za vítězství ve [Concept('holy_wars','svatých válkách')|E] je zvýšen o #P 50%#!"
 tenet_religious_legal_pronouncements_name: "Náboženské právo"
 tenet_religious_legal_pronouncements_hisbah: "Hisba"
 tenet_religious_legal_pronouncements_fatwa: "Fatva"
 tenet_religious_legal_pronouncements_halakha: "Halacha"
 tenet_religious_legal_pronouncements_desc: "Hranice mezi teologickými a právními spory je tenká a při světském rozhodování lze a je třeba přihlížet k duchovním vlastnostem."
 doctrine_parameter_temporal_condemnation_enabled: "Vládci s vysokou [Concept('learning','učeností')|E] mohou odsoudit své [Concept('sinful','hříšné')|E] vazaly. Čím hříšnější vazal je, tím méně učenosti jeho vládce k odsouzení potřebuje.\n$EFFECT_LIST_BULLET$Odsouzení vazalové jsou považováni za [Concept('criminals','zločince')|E] a mohou jim být odňaty tituly"
 doctrine_parameter_religious_legal_pronouncements_law_cost_reduction: "Náklady na zákony: #P -10%#!"
 tenet_religious_legal_pronouncements_cost_tooltip: "Náboženské právo: #P -10%#!"
 tenet_religious_fatwa_cost_tooltip: "Fatva: #P -10%#!"
 tenet_religious_halakha_cost_tooltip: "Halacha: #P -10%#!"
 tenet_false_conversion_sanction_name: "Povolené předstírané konverze"
 tenet_temporal_condemnation_taqiya: "Takíja"
 tenet_anusim: "Anusim"
 tenet_false_conversion_sanction_desc: "Je-li tvůj život v ohrožení, je přípustné předstírat vyznávání jiné víry, pokud si pravdu uchováš v srdci."
 doctrine_parameter_sanctioned_false_conversion: "Odolnost vůči konverzi: #P +30%#!\n$EFFECT_LIST_BULLET$[Concept('characters','Postavy')|E] a [Concept('counties','hrabství')|E] se mohou někdy vrátit k této [Concept('faith','víře')|E], pokud byly svedeny na scestí"
 tenet_tax_nonbelievers_name: "Zdanění nevěřících"
 tenet_tax_nonbelievers_desc: "Vojenská služba je určena pouze věřícím, zatímco od nevěřících je za poskytovanou ochranu vybírána daň."
 tenet_tax_nonbelievers_jizya_name: "Džizja"
 tenet_literalism_name: "Literalismus"
 tenet_literalism_desc: "Naše svaté texty jasně vyjadřují božský záměr a lidský výklad má jen omezenou hodnotu."
 doctrine_parameter_literalist_debate_enabled: "Lze vést rozpravu s ostatními pány panství za cenu zhoršení [Concept('opinion','mínění')|E] a získat či ztratit [Concept('piety','zbožnost')|E]"
 tenet_legalism_name: "Legalismus"
 tenet_legalism_desc: "Naše zákony jsou výsledkem moudrosti a zbožnosti mnoha generací a jejich dodržování je samo o sobě zbožné. Žádný hříšník, ať je jím kdokoli, nebude stát nad zákonem."
 doctrine_parameter_legalism_reduced_faction_virtues: "[Concept('vassals','Vazalové')|E] a [Concept('counties','hrabství')|E] se s menší pravděpodobností připojí k [Concept('factions','frakcím')|E] proti [Concept('virtuous','ctnostnému')|E] vládci"
 doctrine_parameter_legalism_increased_faction_sins: "[Concept('vassals','Vazalové')|E] a [Concept('counties','hrabství')|E] se s větší pravděpodobností připojí k [Concept('factions','frakcím')|E] proti [Concept('sinful','hříšnému')|E] vládci"
 doctrine_parameter_legalism_modified_law_costs: "Náklady na zákony se za každou [Concept('virtue','ctnost')|E] vládce snižují o #P -10%#!"
 doctrine_parameter_legalism_modified_law_costs_2: "Náklady na zákony se za každý [Concept('sin','hřích')|E] vládce zvyšují o #N 10%#!"
 doctrine_parameter_legalism_trust_just_leader_active: "[Concept('electors','Volitelé')|E] při volitelných typech [Concept('succession','nástupnictví')|E] s větší pravděpodobností podpoří volbu svého [Concept('liege','lenního pána')|E], pokud je jejich lenní pán $trait_just$"
 tenet_legalism_law_cost_tooltip: "[Concept('legalism','Legalismus')|E]:\n   Vliv mých hříchů a ctností: [SCOPE.ScriptValue('legalism_law_cost_modifier')|-0%]"
 tenet_reincarnation_name: "Reinkarnace"
 tenet_reincarnation_desc: "Před tímto životem jsme již prožili mnoho jiných a po něm budeme žít v mnoha dalších. Každá smrt je pouze počátkem něčeho nového."
 tenet_reincarnation_zoroastrian_name: "Radž'a"
 tenet_reincarnation_zoroastrian_desc: "Stejně jako se bohové mohou vtělit do lidských těl, můžeme se znovu narodit i my. Dobří jsou odměněni krásnými a čistými podobami a nakonec se mohou stát anděly z čirého světla."
 doctrine_parameter_reincarnation_resistance_to_conversion: "Odolnost hrabství vůči konverzi: #P +20%#!"
 doctrine_parameter_reincarnation_events_active: "Děti mohou být považovány za převtělení předka, což jim poskytne bonusy ke [Concept('piety','zbožnosti')|E] a [Concept('opinion','mínění')|E]"
 tenet_esotericism_name: "Esoterismus"
 tenet_esotericism_kabbalah: "Kabala"
 tenet_esotericism_desc: "Velká tajemství božství mohou přesahovat chápání smrtelníků, to však není omluvou pro nevědomost. Už jejich samotná existence nás nutí usilovat o poznání a porozumění okolnímu světu."
 doctrine_parameter_tenet_esotericism_mystic_education: "Děti se [Concept('education_focus','zaměřením vzdělání')|E] na [Concept('learning','učenost')|E] mohou při dobrých studijních výsledcích získat rys [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 tenet_esotericism_kabbalah_desc: "Učení kabaly zpřístupňuje smrtelnému chápání vztah mezi věčným Bohem, podstatou nekonečna známou jako Ein Sof a Božím stvořením. Kabala tvoří základ veškeré židovské mystiky a její stoupenci často udržují styky s jinými židovskými školami."
 tenet_religious_kabbalah_cost_tooltip: "Kabala: #P -10%#!"
 tenet_adaptive_name: "Přizpůsobivost"
 tenet_adaptive_desc: "Dogmatické lpění na starých omezeních věřícím pouze škodí. Dokud zůstaneme věrni základním přesvědčením své víry, můžeme své zákony přizpůsobovat okolnímu světu."
 doctrine_parameter_tenet_adaptive_conversion_resistance: "Odolnost hrabství vůči konverzi: #P +30%#!"
 doctrine_parameter_reduced_vassal_religion_discontent: "Nevěřící [Concept('vassals','vazalové')|E] se s menší pravděpodobností připojí k separatistickým a populistickým [Concept('factions','frakcím')|E]"
 doctrine_parameter_immaterial_harmony_conversion_cost_reduced: "[piety_i|E]Náklady na [Concept('piety','zbožnost')|E] při konverzi k jiné [Concept('faith','víře')|E] s touto [Concept('doctrine','doktrínou')|E]: #P -50%#!"
 doctrine_parameter_immaterial_harmony_buddhist_take_vows: "[GetReligionByKey('buddhism_religion').GetAdjective] [Concept('faiths','víry')|E] mohou používat [Concept('interaction','interakci')|E] #V $take_vows_interaction$#!"
 tenet_inner_journey_name: "Vnitřní cesta"
 tenet_inner_journey_desc: "Pouze pochopením sebe sama můžeme porozumět světu. Cesta sebepoznání je stejně důležitá jako dlouhá a obtížná."
 doctrine_parameter_meditation_mechanics_active: "Postavy se mohou [Concept('decide','rozhodnout')|E] meditovat v ústraní, čímž sníží [Concept('stress','stres')|E] a mohou získat teologické poznatky"
 tenet_dharmic_pacifism_name: "Dharmický pacifismus"
 tenet_dharmic_pacifism_desc: "Všichni jsme součástí kosmického řádu. Násilí vůči čemukoli je násilím vůči všemu, včetně nás samotných."
 tenet_bhakti_name: "Bhakti"
 tenet_bhakti_patron_god_name: "Patronští bohové"
 tenet_bhakti_desc: "Smrtelníci se nemohou vyrovnat plné nádheře božství, ale zvolíme-li si jediný jeho aspekt, který budeme napodobovat, uctívat a jemuž se oddáme, můžeme se mu přiblížit více, než by jinak bylo možné."
 doctrine_parameter_select_personal_god_active: "[Concept('rulers','Vládci')|E] se mohou [Concept('decide','rozhodnout')|E] zvolit si osobního avatára, jehož budou uctívat, a získat odpovídající bonus"
 tenet_asceticism_name: "Asketismus"
 tenet_asceticism_desc: "Usilování o hmotné statky nás zaslepuje vůči božské pravdě. Duchovního osvícení můžeme dosáhnout pouze tím, že se oddáme prostému životu bez přepychu."
 tenet_ritual_hospitality_name: "Rituální pohostinnost"
 tenet_ritual_hospitality_alternate_name: "Púdža"
 tenet_ritual_hospitality_desc: "Pohostinnost je jednou z největších ctností, jaké může lidstvo projevovat. S hosty v našich domovech, ať už smrtelnými, či božskými, je třeba vždy zacházet s nejvyšší úctou a respektem."
 doctrine_parameter_host_honored_guests_active: "[Concept('rulers','Vládci')|E] mohou hostit jiné postavy jako čestné hosty a vynaložit [Concept('piety','zbožnost')|E] výměnou za zvýšení [Concept('opinion','mínění')|E]"
 tenet_warmonger_name: "Válečnictví"
 tenet_warmonger_desc: "Víra a válka kráčejí ruku v ruce. Kdo odmítá bojovat ve jménu božství, nemůže být nazýván pravým věřícím."
 doctrine_parameter_conquest_cb_enabled: "[Concept('rulers','Vládci')|E] mají proti sousedním vládcům dobyvačný [Concept('casus_belli','casus belli')|E]"
 doctrine_parameter_faith_can_raid: "Umožňuje podnikat [Concept('raiding','nájezdy')|E] do cizích [Concept('counties','hrabství')|E] za účelem kořisti"
 doctrine_parameter_invasion_cb_enabled: "Prestižní [Concept('rulers','vládci')|E] mohou jednou za život použít invazní [Concept('casus_belli','casus belli')|E]"
 doctrine_parameter_great_holy_wars_active_if_reformed: "Pokud existuje [Concept('head_of_faith','hlava víry')|E], může vyhlašovat [Concept('great_holy_wars','velké svaté války')|E], je-li tato [Concept('faith','víra')|E] [Concept('organized','organizovaná')|E]"
 tenet_ancestor_worship_name: "Uctívání předků"
 tenet_ancestor_worship_desc: "Naši předkové nad námi bdí ze záhrobí, vedou nás a ukazují nám cestu vpřed. Proto jim musíme prokazovat úctu a čest."
 tenet_adorcism_name: "Adorcismus"
 tenet_adorcism_desc: "Duchové tohoto světa mohou konat veliké skutky dobra i zla. Budeme-li je ctít a prokazovat jim úctu, můžeme jen doufat, že nám prospějí svými dobrými skutky a našim nepřátelům uškodí těmi zlými."
 doctrine_parameter_spirit_possession_active: "Zpřístupňuje [Concept('decision','rozhodnutí')|E] „Požádat duchy o pomoc“"
 tenet_ritual_celebrations_name: "Rituální oslavy"
 tenet_ritual_celebrations_desc: "Uctívání božství je třeba oslavovat a sdílet s naším společenstvím. Pořádání velkolepých slavností na počest a oslavu božství nás všechny stmeluje."
 doctrine_parameter_mandatory_feast_attendance: "[Concept('vassals','Vazalové')|E] se s větší pravděpodobností zúčastní tvých hostin. Ti, kteří přesto odmítnou přijít, za to ztratí [Concept('piety','zbožnost')|E]."
 tenet_sky_burials_name: "Nebeské pohřby"
 tenet_sky_burials_desc: "Mrtví by neměli být vězněni pod zemí – je mnohem lepší nechat jejich těla pozřít mrchožravými ptáky, aby svým posledním štědrým skutkem nasytili svět, který živil je."
 doctrine_parameter_sky_burials_active: "[Concept('rulers','Vládci')|E] mohou dopřát svým předkům nebeský pohřeb, čímž získají [Concept('piety','zbožnost')|E] a potěší své [Concept('vassals','vazaly')|E]\n$EFFECT_LIST_BULLET$Lze postavit [Concept('duchy_building','vévodskou budovu')|E] [GetBuilding('charnel_grounds_01').GetName]"
 can_build_towers_of_silence_active_name: "Možnost používat [Concept('duchy_building','vévodskou budovu')|E] [GetBuilding('tower_of_silence_01').GetName]"
 doctrine_parameter_can_build_towers_of_silence_active: "[Concept('vassals','Vazalové')|E] mohou postavit [Concept('duchy_building','vévodskou budovu')|E] [GetBuilding('tower_of_silence_01').GetName], která posílí náboženskou horlivost [Concept('county','hrabství')|E] – #EMP pokud#! [Concept('faith','víra')|E] jejich [Concept('liege','lenního pána')|E] nepraktikuje $tenet_sky_burials_name$"
 tenet_sacred_childbirth_name: "Posvátný porod"
 tenet_sacred_childbirth_alternate_name: "Kūdikis Lemti"
 tenet_sacred_childbirth_desc: "Lázně, v nichž matky rodí, musí být očištěny a připraveny náležitými obřady, aby nám božství při porodu udělilo své požehnání."
 doctrine_parameter_safer_childbirths_active: "Matky mají #P nižší pravděpodobnost#! úmrtí při porodu"
 doctrine_parameter_healthier_children_active: "Děti mají #P nižší pravděpodobnost#!, že budou churavé nebo se narodí mrtvé"
 doctrine_parameter_piety_from_childbirth_active: "Matky a otcové získají při narození svého dítěte [Concept('piety','zbožnost')|E]"
 piety_from_childbirth_toast: "Posvátný porod"
 tenet_sanctity_of_nature_name: "Posvátnost přírody"
 tenet_sanctity_of_nature_desc: "Přírodní svět je dílem božství a my jsme v něm pouhými hosty. Musíme ctít každý strom, každé zvíře, a dokonce i samotnou půdu."
 doctrine_parameter_believes_in_harmony_with_nature_invisible: ""
 tenet_mystical_birthright_name: "Požehnané zrození"
 tenet_mystical_birthright_alternate: "Táltos Születés"
 tenet_mystical_birthright_desc: "Každý z nás se rodí s určitým osudem, přičemž nejvýznamnější je osud táltose – člověka, který je již od narození vyvolen k ovládání magických sil a k tomu, aby se stal velkým duchovním vůdcem."
 doctrine_parameter_mystic_birthright_active: "Děti se mohou vzácně narodit s rysem [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 tenet_astrology_name: "Astrologie"
 tenet_astrology_desc: "Noční obloha je naším oknem do božské říše. Jsou v ní zapsána veliká tajemství a záhady světa, které může poznat každý, kdo ví, kam se dívat."
 doctrine_parameter_divine_the_stars_active: "Umožňuje vyznavačům věštit z hvězd a předpovídat svou budoucnost"
 tenet_divination_name: "Věštění"
 tenet_divination_desc: "Osud smrtelníků i budoucnost světa jsou zapsány ve hvězdách a skrytých znameních. Zkušení vykladači mohou prostřednictvím obřadů, snů a předzvěstí tato tajemství vyzvědět od duchů ze záhrobí."
 tenet_sun_worship_name: "Uctívání slunce"
 tenet_sun_worship_desc: "Nositel světla, dárce života a věčně planoucí plamen – vládne vysoko na obloze jako skutečný svrchovaný pán světa."
 doctrine_parameter_summer_festivals_active: "Pořádání hostin v letních měsících přináší [Concept('piety','zbožnost')|E]"
 doctrine_parameter_trial_by_sun_active: "Uvěznění [Concept('criminals','zločinci')|E] mohou být odsouzeni ke zkoušce sluncem"
