 tenet_reincarnation_name: "Reinkarnace"
 tenet_reincarnation_desc: "Prožili jsme mnoho životů před tímto a budeme pokračovat v dalších. Každá smrt je jen začátkem něčeho nového."
 tenet_reincarnation_zoroastrian_name: "Raj'a"
 tenet_reincarnation_zoroastrian_desc: "Stejně jako se bohové mohou inkarnovat v lidských tělech, i my můžeme být znovuzrozeni. Dobří jsou odměněni formami krásy a čistoty a mohou se nakonec stát anděly čistého světla."
 doctrine_parameter_reincarnation_resistance_to_conversion: "Odolnost hrabství vůči konverzi: #P +20%#!"
 doctrine_parameter_reincarnation_events_active: "Děti mají šanci být považovány za reinkarnaci předka, což dává bonusy k [Concept('piety','zbožnosti')|E] a [Concept('opinion','mínění')|E]" # todo: CONCEPT CASE
 tenet_esotericism_name: "Esoterika"
 tenet_esotericism_kabbalah: "Kabbalah"
 tenet_esotericism_desc: "Velká tajemství božstva mohou být nad lidské chápání, ale to není výmluva k nevědomosti. Jejich existence nás nutí usilovat o poznání a porozumění světu kolem nás."
 doctrine_parameter_tenet_esotericism_mystic_education: "Děti s [Concept('learning','učeností')|E] [Concept('education_focus','zaměřením vzdělání')|E] mohou získat rys [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )], pokud se jim podaří dobře ve studiu." # todo: CONCEPT CASE
 tenet_esotericism_kabbalah_desc: "Učení Kabbalah přináší do lidského chápání vztah mezi věčným Bohem, povahou nekonečna známou jako Ein Sof, a Božím stvořením. Kabbalah tvoří základ veškerého židovského mysticismu a praktikanti Kabbalah často spolupracují s jinými židovskými školami."
 tenet_religious_kabbalah_cost_tooltip: "Kabbalah: #P -10%#!"
 tenet_adaptive_name: "Přizpůsobivý"
 tenet_adaptive_desc: "Dogmatické lpění na starých omezeních škodí věřícím. Dokud zůstaneme věrní jádru naší víry, můžeme naše zákony přizpůsobit okolnímu světu."
 doctrine_parameter_tenet_adaptive_conversion_resistance: "Odolnost okresu vůči konverzi: #P +30%#!"
 doctrine_parameter_reduced_vassal_religion_discontent: "Nevěřící [Concept('vassals','vazalové')|E] mají menší pravděpodobnost, že se připojí k separatistickým a populistickým [Concept('factions','frakcemi')|E]" # todo: CONCEPT CASE
 doctrine_parameter_immaterial_harmony_conversion_cost_reduced: "[Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E][Concept('piety','Zbožnost')|E] náklady na konverzi na jinou [Concept('faith','víru')|E] s tímto [Concept('doctrine','doktrínou')|E]: #P -50%#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 doctrine_parameter_immaterial_harmony_buddhist_take_vows: "[GetReligionByKey('buddhism_religion').GetAdjective] [Concept('faiths','Víry')|E] mohou použít #V $take_vows_interaction$#! [Concept('interaction','interakce')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tenet_inner_journey_name: "Vnitřní cesta"
 tenet_inner_journey_desc: "Pouze porozuměním vlastnímu já můžeme pochopit svět. Cesta sebepoznání je důležitá, protože je dlouhá a obtížná."
 doctrine_parameter_meditation_mechanics_active: "Postavy se mohou [Concept('decide','rozhodnout')|E] rozhodnout meditovat v odloučení, snižovat [Concept('stress','stres')|E] a možná získat teologické vhledy" # todo: CONCEPT CASE
 tenet_dharmic_pacifism_name: "Dharmický pacifismus"
 tenet_dharmic_pacifism_desc: "Jsme součástí kosmického řádu. Násilí proti čemukoli je násilím proti všemu, včetně sebe."
 tenet_bhakti_name: "Bhakti"
 tenet_bhakti_patron_god_name: "Patronální bohové"
 tenet_bhakti_desc: "Smrtelníci nemohou dosáhnout plné slávy božstva, ale tím, že si zvolíme jeden aspekt božství k napodobování, uctívání a oddanosti, se mu můžeme přiblížit více, než by jinak bylo možné."
 doctrine_parameter_select_personal_god_active: "Vládci se mohou [Concept('decide','rozhodnout')|E] rozhodnout vybrat osobního avatara k uctívání, čímž získají související bonus" # todo: CONCEPT CASE
 tenet_asceticism_name: "Asketismus"
 tenet_asceticism_desc: "Materiální úsilí nás oslepují před božskou pravdou. Jen oddáním se jednoduchému životu bez luxusu můžeme dosáhnout duchovního osvícení."
 tenet_ritual_hospitality_name: "Rituální pohostinnost"
 tenet_ritual_hospitality_alternate_name: "Pūjā"
 tenet_ritual_hospitality_desc: "Pohostinnost je jednou z největších ctností, které lidstvo může projevit. Hosté v našich domovech, ať už smrtelní či božští, by měli být vždy přijímáni s nejvyšší ctí a úctou."
 doctrine_parameter_host_honored_guests_active: "[Concept('rulers','Vládci')|E] mohou hostit jiné postavy jako Ctěného hosta, utrácet [Concept('piety','zbožnost')|E] výměnou za zvýšené [Concept('opinion','mínění')|E]" # todo: CONCEPT CASE
 tenet_warmonger_name: "Milovník válek"
 tenet_warmonger_desc: "Víra a válka jdou ruku v ruce. Ten, kdo odmítá bojovat ve jménu božstva, nemůže být pravým věřícím."
 doctrine_parameter_conquest_cb_enabled: "[Concept('rulers','Vládci')|E] mají Conquest [Concept('casus_belli','casus belli')|E] vůči sousedním vládcům" # todo: CONCEPT CASE
 doctrine_parameter_faith_can_raid: "Umožňuje [Concept('raiding','plenění')|E] cizích [Concept('counties','hrabství')|E] za účelem kořisti" # todo: CONCEPT CASE
 doctrine_parameter_invasion_cb_enabled: "Prestižní [Concept('rulers','vládci')|E] mohou použít Invasion [Concept('casus_belli','casus belli')|E] jednou za život" # todo: CONCEPT CASE
 doctrine_parameter_great_holy_wars_active_if_reformed: "Pokud existuje, [Concept('head_of_faith','hlava víry')|E] může vyhlásit [Concept('great_holy_wars','velké svaté války')|E], pokud je tato [Concept('faith','víra')|E] [Concept('organized','organizovaná')|E]" # todo: CONCEPT CASE
 tenet_ancestor_worship_name: "Uctívání předků"
 tenet_ancestor_worship_desc: "Naši předkové nás sledují ze záhrobí, vedou nás a ukazují cestu. Za to je musíme respektovat a ctít."
 tenet_adorcism_name: "Adorcismus"
 tenet_adorcism_desc: "Duchové tohoto světa mohou konat velké skutky dobré i zlé. Tím, že je ctíme a respektujeme, můžeme doufat, že pro nás vykonají dobro a pro naše nepřátele zlo."
 doctrine_parameter_spirit_possession_active: "Umožňuje [Concept('decision','rozhodnutí')|E] 'Obrátit se na duchy o pomoc'" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 tenet_ritual_celebrations_name: "Rituální oslavy"
 tenet_ritual_celebrations_desc: "Uctívání božstva je třeba oslavovat a sdílet s naší komunitou. Pořádání velkých slavností na počest a chválu božstva nás všechny sbližuje."
 doctrine_parameter_mandatory_feast_attendance: "[Concept('vassals','Vazalové')|E] jsou více náchylní zúčastnit se vašich hostin. Ti, kteří se přesto odmítnou dostavit, ztratí za to [Concept('piety','zbožnost')|E]." # todo: CONCEPT CASE
 tenet_sky_burials_name: "Nebeské pohřby"
 tenet_sky_burials_desc: "Mrtví by neměli být vězněni pod zemí — je mnohem lepší nechat je být spotřebováni mrchožrouty, kde mohou v závěrečném aktu štědrosti nakrmit svět, který je živil."
 doctrine_parameter_sky_burials_active: "[Concept('rulers','Vládci')|E] mohou svým předkům zajistit Nebeský pohřeb, čímž získají [Concept('piety','zbožnost')|E] a potěší své [Concept('vassals','vazaly')|E]\n$EFFECT_LIST_BULLET$Lze postavit [GetBuilding('charnel_grounds_01').GetName] [Concept('duchy_building','vévodská budova')|E]" # todo: CONCEPT CASE
 can_build_towers_of_silence_active_name: "schopnost používat [GetBuilding('tower_of_silence_01').GetName] [Concept('duchy_building','vévodská budova')|E]" # todo: CONCEPT CASE
 doctrine_parameter_can_build_towers_of_silence_active: "[Concept('vassals','Vazalové')|E] mohou postavit [GetBuilding('tower_of_silence_01').GetName] [Concept('duchy_building','vévodská budova')|E] pro posílení [Concept('county','hrabství')|E] zbožnosti — #EMP pokud#! víra jejich [Concept('liege','lenní pán')|E] neprovádí $tenet_sky_burials_name$" # todo: CONCEPT CASE
 tenet_sacred_childbirth_name: "Posvátné porodnictví"
 tenet_sacred_childbirth_alternate_name: "Kūdikis Lemti"
 tenet_sacred_childbirth_desc: "Koupele, kde rodičky rodí, musí být očištěny a připraveny vhodnými rituály, aby božstvo udělilo své požehnání při porodu."
 doctrine_parameter_safer_childbirths_active: "Matky mají #P menší pravděpodobnost#!, že zemřou při porodu"
 doctrine_parameter_healthier_children_active: "Děti mají #P menší pravděpodobnost#!, že budou choré nebo mrtvě narozené"
 doctrine_parameter_piety_from_childbirth_active: "Matky a otcové získají [Concept('piety','zbožnost')|E], když se jim narodí dítě" # todo: CONCEPT CASE
 piety_from_childbirth_toast: "Posvátné porodnictví"
 tenet_sanctity_of_nature_name: "Svatost přírody"
 tenet_sanctity_of_nature_desc: "Přírodní svět je dílem božstva a my jsme v něm pouze hosté. Musíme respektovat a ctít každý strom, každé zvíře a dokonce i zemi samotnou."
 doctrine_parameter_believes_in_harmony_with_nature_invisible: ""
 tenet_mystical_birthright_name: "Příznivé narození"
 tenet_mystical_birthright_alternate: "Táltos Születés"
 tenet_mystical_birthright_desc: "Každý z nás se rodí s osudem, jeho nejdůležitějším je Táltos — ti, kdo jsou od narození vyvoleni k ovládání magických sil a stát se velkými duchovními vůdci."
 doctrine_parameter_mystic_birthright_active: "Děti se vzácně mohou narodit s rysem [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )]"
 tenet_astrology_name: "Astrologie"
 tenet_astrology_desc: "Noční obloha je naším oknem do říše božstva. Velká tajemství a záhady světa jsou na ní napsány, otevřené pro všechny, kteří vědí, kde hledat."
 doctrine_parameter_divine_the_stars_active: "Umožňuje stoupencům vykládat hvězdy a předpovídat svou budoucnost"
 tenet_divination_name: "Věštění"
 tenet_divination_desc: "Osud smrtelníků a budoucnost světa jsou zapsány ve hvězdách a skrytých znameních, a skrze rituály, sny a znamení mohou zkušení praktikanti od duchů za nimi tyto tajemství vyvěštit."
 tenet_sun_worship_name: "Uctívání slunce"
 tenet_sun_worship_desc: "Nositel světla, dávající život, věčně hořící plamen — vládne vysoko na obloze jako pravý vládce světa."
 doctrine_parameter_summer_festivals_active: "Pořádání hostin v letních měsících přináší [Concept('piety','zbožnost')|E]" # todo: CONCEPT CASE
