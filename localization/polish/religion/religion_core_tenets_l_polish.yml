 PIETY_LONG_PEACE: "Dlouhý mír"
 tenet_vows_of_poverty_name: "Sliby chudoby"
 tenet_vows_of_poverty_desc: "Peníze kazí lidská srdce a odvádějí je od pravé víry. Chceme-li se soustředit na to, na čem skutečně záleží, musíme se zříci hromadění hmotného bohatství."
 doctrine_parameter_vows_of_poverty_active: "[rulers|E] se mohou [Concept('decide','rozhodnout')|E] složit slib chudoby, čímž sníží měsíční příjem z [Concept('tax','daní')|E], ale zvýší měsíční přírůstek [Concept('piety','zbožnosti')|E]"
 tenet_human_sacrifice_name: "Lidské oběti"
 tenet_human_sacrifice_desc: "Nejlepším způsobem, jak prokázat svou oddanost, je přinést oběť. Nejcennější obětí, jakou můžeme nabídnout, je lidský život."
 doctrine_parameter_human_sacrifice_active: "[executions|E] přinášejí [Concept('piety','zbožnost')|E], místo aby ji stály\n$EFFECT_LIST_BULLET$[executions|E] při [Concept('sharing_power','sdílení moci')|E] nikdy nestojí [Concept('prestige','prestiž')|E]"
