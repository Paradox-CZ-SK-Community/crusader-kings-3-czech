l_polish:
 doctrine_core_tenets_name: "Zásady"
 tenets_name: "Zásady"
 tenet_communion_name: "Společenství"
 tenet_communion_desc: "Naše rituály nejsou pouze symbolické — vyvolávají samotnou přítomnost božstva. Ti, kteří se nemohou nebo se nepřipojí k našim praktikám, nemohou být pravými věřícími."
 doctrine_parameter_seek_indulgences_active: "Postavy mohou #V Žádat o odpustky#! u svého [Concept('head_of_faith','hlavy víry')|E] a zaplatit [Concept('gold','zlato')|E] výměnou za [Concept('piety','zbožnost')|E]" # todo: CONCEPT CASE
 doctrine_parameter_seek_indulgences_active_2: "Postavy, které spáchaly [Concept('criminal','zločinné')|E] činy, mohou #V žádat o odpustky#!, aby za ně získaly odpuštění" # todo: CONCEPT CASE
 doctrine_parameter_excommunication_active: "Duchovní [Concept('heads_of_faith','hlavy víry')|E] mohou [Concept('excommunicate','exkomunikovat')|E] jiné postavy své [Concept('faith','víru')|E]" # todo: CONCEPT CASE
 tenet_excommunicated: "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 tenet_armed_pilgrimages_name: "Ozbrojené poutě"
 tenet_armed_pilgrimages_desc: "Naši poutníci cestují světem, aby navštívili naše posvátné svatyně — rádi vezmeme do ruky meč, abychom je ochránili před každým, kdo by jim chtěl ublížit"
 doctrine_parameter_cheaper_holy_wars_active: "Vyhlášení [Concept('holy_wars','svaté války')|E] stojí [Concept('rulers','vládci')|E] této [Concept('faith','víře')|E] o #P -20%#! méně [Concept('piety','zbožnost')|E]" # todo: CONCEPT CASE
 doctrine_parameter_great_holy_wars_active: "Pokud existuje, [Concept('head_of_faith','hlava víry')|E] může vyhlásit [Concept('great_holy_war','velká svatá válka')|E], když má [Concept('faith','víra')|E] vysoké [Concept('fervor','horlivostí')|E]" # todo: CONCEPT CASE
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "Pokud neexistuje žádný [Concept('head_of_faith','hlava víry')|E], stoupenci získají bonus k úkolu [convert_county|E] [Concept('councillor_task','úkolu rádce')|E] za každé ovládané [Concept('holy_site','svaté místo')|E]" # todo: CONCEPT CASE
 doctrine_parameter_pilgrimage_decision_active: "Postavy této [Concept('faith','víře')|E] získají dodatečný bonus po úspěšném dokončení [Concept('pilgrimage','pouti')|E]" # todo: CONCEPT CASE
 tenet_monasticism_name: "Mnišství"
 tenet_monasticism_desc: "Požitky z dobrého jídla a pití nás jen odvádějí od služby božstvu. Izolace v odlehlých klášterech je nejlepší způsob, jak se těmto pokušením vyhnout."
 doctrine_parameter_take_vows_active: "[Concept('courtiers','Dvořané')|E] mohou složit sliby a stát se [GetTrait('devoted').GetName( GetNullCharacter )]" # todo: CONCEPT CASE
 tenet_divine_marriage_name: "Božské manželství"
 tenet_divine_marriage_xwedodah: "Xwedodah"
 tenet_divine_marriage_desc: "Sňatkem s blízkým příbuzným napodobujeme posvátná spojení prvních bytostí ve stvoření. Dobré vlastnosti se přenesou na naši rodovou linii, a tak získáváme čistotu a přízeň v věčném boji proti zlu."
 doctrine_parameter_divine_marriage_opinion: "Stoupenci, kteří jsou v manželství s členem [Concept('close_family','blízkou rodinou')|E], mají $VALUE|0+=$ [Concept('opinion','mínění')|E] od [Concept('vassals','vazalů')|E] stejné [Concept('faith','víry')|E]" # todo: CONCEPT CASE
 doctrine_parameter_divine_marriage_piety_gain_active: "Manželský bonus [GetFaithDoctrine('doctrine_monogamy').GetBaseName] rovněž uděluje velké množství [Concept('piety','zbožnost')|E], pokud uzavíráte sňatek s členem [Concept('close_family','blízkou rodinou')|E]" # todo: CONCEPT CASE
 tenet_pacifism_name: "Pacifismus"
 tenet_pacifism_desc: "Násilí je odpudivý čin, který vede jen k utrpení, bolesti a lítosti. Tím, že se mu kdykoli jen lze vyhýbáme, můžeme pro věřící vybudovat silnější a bezpečnější společnosti."
 doctrine_parameter_holy_wars_forbidden: "Nelze vyhlašovat [Concept('holy_wars','svaté války')|E] ani [Concept('raid','nájezd')|E]" # todo: CONCEPT CASE
 doctrine_parameter_pacifist_opinion_active: ""
 pacifist_opinion_active_opinion_name: "Spolupacifista"
 pacifist_opinion_active_county_opinion_name: "Okres spolupacifisty"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "[Concept('opinion','Mínění')|E] ostatních pacifistů: $VALUE|+=0$" # todo: CONCEPT CASE
 doctrine_parameter_piety_from_long_peace: "Vládci, kteří jsou v míru alespoň dva roky, získávají měsíčně změnu [Concept('piety','zbožnost')|E] o $VALUE|+$" # todo: CONCEPT CASE
 PIETY_LONG_PEACE: "Dlouhý mír"
 tenet_vows_of_poverty_name: "Sliby chudoby"
 tenet_vows_of_poverty_desc: "Peníze korumpují srdce lidí a odvádějí je od pravé víry. Musíme se zříct hromadění materiálního bohatství, pokud se chceme soustředit na to, co je skutečně důležité."
 doctrine_parameter_vows_of_poverty_active: "[Concept('rulers','Vládci')|E] se mohou [Concept('decide','rozhodnout')|E] rozhodnout složit slib chudoby, což sníží měsíční příjem z [Concept('tax','daně')|E], ale zvýší měsíční zisk [Concept('piety','zbožnost')|E]" # todo: CONCEPT CASE
 tenet_human_sacrifice_name: "Lidské oběti"
 tenet_human_sacrifice_desc: "Nejlepší způsob, jak prokázat svou oddanost, je skrze akt oběti. Nejhodnotnější obětí, kterou můžeme nabídnout, je lidský život."
 doctrine_parameter_human_sacrifice_active: "[Concept('executions','Popravy')|E] přinášejí [Concept('piety','zbožnost')|E] místo toho, aby stály [Concept('piety','zbožnost')|E]\n$EFFECT_LIST_BULLET$[Concept('executions','Popravy')|E] nikdy nestojí [Concept('prestige','prestiž')|E], když [Concept('sharing_power','sdílení moci')|E]" # todo: CONCEPT CASE
 doctrine_parameter_flower_war_cb_active: "Uděluje [Concept('flowery_war','nájezd za zajatci')|E] [Concept('casus_belli','casus belli')|E] proti sousedním říším" # todo: CONCEPT CASE
 tenet_gruesome_festivals_blot_name: "Blót"
 tenet_gruesome_festivals_name: "Krvavé slavnosti"
 tenet_gruesome_festivals_desc: "Všichni se rodíme v krvi. Přežíváme krví našeho dobytka, naší rodiny, našich nepřátel. Je přirozené, že [ROOT.Faith.PantheonTerm] požadují svůj spravedlivý podíl."
 gruesome_festivals_active_name: "schopnost konat velké oběti"
 doctrine_parameter_gruesome_festivals_active: "Možnost pořádat velké oběti zhruba jednou za dekádu pro poddané stejné [Concept('faith','víru')|E] a ovlivnit [Concept('county_opinion','lidové mínění')|E]" # todo: CONCEPT CASE
 tenet_volcanic_veneration_name: "Uctívání sopek"
 tenet_volcanic_veneration_desc: "Není mnoho věcí božštějších než novorozená země tryskající z ohnivých hlubin naší domoviny. Trávíme životy na pokraji katastrofy, navždy na milosti [ROOT.Faith.PantheonTerm]."
 tenet_cthonic_redoubts_name: "Chthónské reduty"
 tenet_cthonic_redoubts_desc: "Neexistuje lepší úkryt než kořeny Země, žádná pevnost není pevnější než její vystupující hřeby, žádná pouť není posvátnější než její ukryté stezky. Z těchto vysokých vrcholů hledíme na Stvoření a cítíme skutečnou váhu Božského."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "[Concept('convert_county','$task_conversion$')|E] rychlost v horském [Concept('terrain','teréně')|E]: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!" # todo: CONCEPT CASE
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "[Concept('promote_culture','$task_promote_culture$')|E] rychlost v horském [Concept('terrain','teréně')|E] u stejné [Concept('faith','víry')|E]: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!" # todo: CONCEPT CASE
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "Rychlost hostilního [convert_county|E] v horském [Concept('terrain','teréně')|E]: #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!" # todo: CONCEPT CASE
 tenet_consolamentum_name: "Endura"
 tenet_consolamentum_name_alternate: "Ritual Suicide"
 tenet_consolamentum_desc: "Když zestárneme nebo onemocníme, vykonáme rituál, který očistí naše duše od hříchu. Poté rychle a definitivně ukončíme své životy, aby hřích neměl příležitost nás opět infikovat."
 doctrine_parameter_consolamentum_active: "Stoupenci se mohou [Concept('decide','rozhodnout')|E] rozhodnout ukončit svůj život, když jsou staří, neschopní nebo blízko smrti; tímto nebudou uplatněny žádné běžné tresty za sebevraždu" # todo: CONCEPT CASE
 tenet_gnosticism_name: "Gnosticismus"
 tenet_gnosticism_desc: "Prostřednictvím poznání může být božská jiskra v každém člověku osvobozena a navrácena svému nebeskému zdroji ve světě duchů."
 doctrine_parameter_hostility_override_tenet_gnosticism: "Považuje jiné gnostické a dualistické [Concept('faiths','víry')|E] za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] místo $hostility_hostile_tooltippable$ nebo $hostility_evil_tooltippable$" # todo: CONCEPT CASE
 doctrine_parameter_hostility_override_special_doctrine_is_gnostic_faith: ""
 doctrine_parameter_granting_titles_gives_stress: "Darováním [Concept('titles','tituly')|E] se uleví úměrnému množství [Concept('stress','stresem')|E]" # todo: CONCEPT CASE
 tenet_mendicant_preachers_name: "Žebraví kazatelé"
 tenet_mendicant_preachers_desc: "Naši misionáři cestují daleko a široko s ničím jiným než oděvem, který mají na sobě. Žijí z štědrosti těch, které navštěvují, a za to sdílejí znalost pravé víry."
 doctrine_parameter_mendicant_preachers_conversion_active: "Rychlost konverze okresu: #P +33#!"
 tenet_communal_identity_name: "Komunitní identita"
 tenet_communal_identity_desc: "Naše víra a naše kultura jsou neoddělitelně spjaty. Tato praxe posiluje vazby naší komunity, i když obvykle vylučuje cizince."
 doctrine_parameter_same_communal_identity_opinion_active: "#P +10#! [Concept('opinion','mínění')|E] s postavami stejné [Concept('faith','víra')|E]" # todo: CONCEPT CASE
 doctrine_parameter_same_culture_conversion_bonus_active: "Rychlost konverze v [Concept('counties','hrabství')|E] mé [Concept('culture','kultuře')|E]: #P +50%#!" # todo: CONCEPT CASE
 doctrine_parameter_same_faith_promote_culture_bonus_active: "Rychlost prosazování kultury v [Concept('counties','hrabství')|E] mé [Concept('faith','víře')|E]: #P +50%#!" # todo: CONCEPT CASE
 doctrine_parameter_other_culture_conversion_penalty_active: "Rychlost konverze v [Concept('counties','hrabství')|E] jiné [Concept('culture','kultuře')|E]: #N -50%#!" # todo: CONCEPT CASE
 tenet_pentarchy_name: "Církevní správa"
 tenet_pentarchy_alternate_name: "Pentarchie"
 tenet_pentarchy_desc: "Naše svatá místa nejsou jen posvátná — jsou to přímo sídla moci, odkud naši duchovní vůdci vládnou."
 tenet_aniconism_name: "Anikonismus"
 tenet_aniconism_desc: "Uctívání vytesaných obrazů příliš mnohé oslepuje před božskou pravdou. Vyhnáme všechny ikony z našich posvátných míst, aby se naši věřící do této pasti nezavlekli."
 doctrine_parameter_reforging_artifacts_costs_piety: "[Concept('rulers','Vládci')|E] této [Concept('faith','víře')|E] musí utratit [Concept('piety','zbožnost')|E] za [Concept('reforge','překování')|E] nebo [Concept('repair','oprava')|E] [Concept('artifacts','artefakty')|E]" # todo: CONCEPT CASE
 doctrine_parameter_destroying_artifacts_is_pious: "[Concept('rulers','Vládci')|E] této [Concept('faith','víře')|E] mohou zničit [Concept('artifacts','artefakty')|E] za [Concept('piety','zbožnost')|E]" # todo: CONCEPT CASE
 destroying_artifacts_is_not_pious_tt: "Vaše [Concept('faith','víra')|E] nemůže ničit [Concept('artifacts','artefakty')|E] za [Concept('piety','zbožnost')|E]" # todo: CONCEPT CASE
 artifact_is_rarer_than_masterwork_tt: "Tento [Concept('artifact','artefakt')|E] má vyšší [Concept('rarity','vzácnosti')|E] než Masterwork" # todo: CONCEPT CASE
 tenet_alexandrian_catechism_name: "Alexandrijský katechismus"
 tenet_alexandrian_catechism_desc: "Katechetická škola v Alexandrii měla dlouhou tradici povzbuzování teologů k kritickému myšlení a zpochybňování statusu quo.\n\nPřes fyzické zničení školy neseme tyto tradice dál."
 tenet_islamic_rationalism_name: "Islámský racionalismus"
 tenet_islamic_rationalism_desc: "Jelikož [ROOT.Faith.HighGodNameAlternate] je spravedlivý a moudrý, [ROOT.Faith.HighGodNameSheHe|U] nemůže jít proti rozumu nebo ignorovat blaho [ROOT.Faith.HighGodHerHis|U] stvoření. Pouze skrze nepodvržený rozum můžeme doufat, že pochopíme naše místo v [ROOT.Faith.HighGodHerHis|U] velkém díle a oddělíme dobro od zla."
 tenet_hedonistic_name: "Hedonistický"
 tenet_hedonistic_desc: "Božstvo naplnilo tento svět množstvím požitků, jichž bychom se měli užívat — neúčastnit se takových věcí je urážkou samotného díla stvoření."
 doctrine_parameter_piety_from_feasts_active: "Pořádání [GetActivityType('activity_feast').GetName] přináší [Concept('piety','zbožnost')|E]" # todo: CONCEPT CASE
 doctrine_parameter_piety_from_festivals_active: "[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'doctrine_parameter_piety_from_festivals_active_auh')]" # todo: NEW TRANSLATION
 doctrine_parameter_piety_from_festivals_active_auh: "Pořádáním [GetActivityType('activity_festival').GetName] získáte [Concept('piety','zbožnost')|E] zbožnosti." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tenet_carnal_exaltation_name: "Oslava tělesnosti"
 tenet_carnal_exaltation_desc: "Požitky těla jsou vznešené způsobem, který přesahuje jiné pozemské zkušenosti, přibližují nás k božstvu. Měli bychom oslavovat naše sexuální touhy a hledat příležitosti je naplnit."
 tenet_polyamory_name: "Polyamorie"
 tenet_polyamory_desc: "Naše láska k sobě by měla být stejně bezpodmínečná jako láska [ROOT.Faith.FertilityGodNamePossessive] k nám. Musíme zahodit zastaralé představy, že jeden člověk vlastní náklonnost jiného."
 doctrine_parameter_no_unfaithfulness_penalty_active: "Stoupenci nedostávají [Concept('opinion','mínění')|E] penalizace ani [Concept('imprisonment_reasons','důvody k uvěznění')|E] vůči svému manželovi/manželce nebo jejich milencům za mimomanželské vztahy" # todo: CONCEPT CASE
 tenet_unrelenting_faith_name: "Neústupná víra"
 tenet_unrelenting_faith_desc: "Naše přesvědčení jsou silná a rádi budeme za svou víru bojovat a zemřít. Bez ohledu na to, jak jsou šance proti nám, nevzdáme se."
 tenet_unrelenting_faith_zandik_name: "Righteous Rebellion"
 tenet_unrelenting_faith_zandik_desc: "Nechceme ublížit žádné duši ani věci, ale pokud jsou naše způsoby ohroženy, budeme je bránit s neúprosnou zuřivostí."
 tenet_rite_name: "Obřad"
 tenet_rite_desc: "Naše přesvědčení se od mateřské víry příliš neliší... proč bychom se přeli o detaily, když se shodneme na hlavních bodech doktríny, a, co je nejdůležitější, na konečné autoritě pro rozhodování?"
 doctrine_parameter_maintains_head_of_faith_on_creation: "Nové [Concept('faiths','víry')|E] si při založení ponechají svého starého [Concept('head_of_faith','hlavy víry')|E]" # todo: CONCEPT CASE
 doctrine_parameter_ecumenical_christians_keep_ecumenism: "[GetPlayer.Custom('GetRiteEcumenismFullOrEmpty')]"
 GetRiteEcumenismFullOrEmpty_full: "Christian [Concept('faiths','víry')|E] with [GetFaithDoctrine('special_doctrine_ecumenical_christian').GetBaseName] keep it on creation" # todo: CONCEPT CASE
 GetRiteEcumenismFullOrEmpty_empty: ""
 tenet_struggle_submission_name: "Boj a odevzdání"
 tenet_struggle_submission_desc: "Božská vůle je zdrojem všeho dobra, takže dobrá existence spočívá v podrobení se této vůli, vyjádřené bojem za její uskutečnění."
 doctrine_parameter_bonus_holy_war_piety_active: "[Concept('piety','Zbožnost')|E] a [Concept('piety_experience','oddanost')|E] z vítězství v [Concept('holy_wars','svatých válkách')|E] jsou zvýšeny o #P 50%#!" # todo: CONCEPT CASE
 tenet_religious_legal_pronouncements_name: "Náboženské právo"
 tenet_religious_legal_pronouncements_hisbah: "Hisbah"
 tenet_religious_legal_pronouncements_fatwa: "Fatwa"
 tenet_religious_legal_pronouncements_halakha: "Halakha"
 tenet_religious_legal_pronouncements_desc: "Hranice mezi teologickými a právními argumenty je tenká a duchovní kvality mohou a měly by být brány v potaz při světských rozhodnutích."
 doctrine_parameter_temporal_condemnation_enabled: "Vládci s vysokým [Concept('learning','učeností')|E] mohou odsoudit své [Concept('sinful','hříšné')|E] vazaly. Čím hříšnější je vazal, tím méně Learning jejich vládce potřebuje k jeho odsouzení.\n$EFFECT_LIST_BULLET$Odsouzení vazalové jsou považováni za [Concept('criminals','zločince')|E] a mohou jim být odebrány jejich tituly" # todo: CONCEPT CASE
 doctrine_parameter_religious_legal_pronouncements_law_cost_reduction: "Náklady na zákony: #P -10%#!"
 tenet_religious_legal_pronouncements_cost_tooltip: "Religious Law: #P -10%#!"
 tenet_religious_fatwa_cost_tooltip: "Fatwa: #P -10%#!"
 tenet_religious_halakha_cost_tooltip: "Halakha: #P -10%#!"
 tenet_false_conversion_sanction_name: "Schvářené falešné konverze"
 tenet_temporal_condemnation_taqiya: "Taqiya"
 tenet_anusim: "Anusim"
 tenet_false_conversion_sanction_desc: "Pokud je ohrožen váš život, je přijatelné vyznat falešnou víru, pokud si pravdu uchováte v srdci."
 doctrine_parameter_sanctioned_false_conversion: "Conversion Resistance: #P +30%#!\n$EFFECT_LIST_BULLET$[Concept('characters','Postavy')|E] a [Concept('counties','hrabství')|E] se někdy mohou při svádění vrátit zpět ke této [Concept('faith','víře')|E]" # todo: CONCEPT CASE
 tenet_tax_nonbelievers_name: "Zdanění nevěřících"
 tenet_tax_nonbelievers_desc: "Vojenská služba je pouze pro věřící, zatímco nevěřícím je uvalena daň za ochranu, kterou jim poskytujeme."
 tenet_tax_nonbelievers_jizya_name: "Jizya"
 tenet_literalism_name: "Literalismus"
 tenet_literalism_desc: "Naše svaté texty jasně uvádějí božský záměr a lidská interpretace má omezenou hodnotu."
 doctrine_parameter_literalist_debate_enabled: "Může diskutovat s jinými pány říše za cenu [Concept('opinion','mínění')|E], za účelem získání nebo ztráty [Concept('piety','zbožnost')|E]" # todo: CONCEPT CASE
 tenet_legalism_name: "Legalismus"
 tenet_legalism_desc: "Naše zákony jsou výsledkem generací moudrosti a zbožnosti, a jejich dodržování je samo o sobě zbožné. Hříšník, kýmkoli je, nebude nikdy nad zákonem."
 doctrine_parameter_legalism_reduced_faction_virtues: "[Concept('vassals','Vazalové')|E] a [Concept('counties','hrabství')|E] mají menší pravděpodobnost, že se připojí k [Concept('factions','frakcím')|E] proti [Concept('virtuous','ctnostnému')|E] vládci" # todo: CONCEPT CASE
 doctrine_parameter_legalism_increased_faction_sins: "[Concept('vassals','Vazalové')|E] a [Concept('counties','hrabství')|E] mají větší pravděpodobnost, že se připojí k [Concept('factions','frakcím')|E] proti [Concept('sinful','hříšnému')|E] vládci" # todo: CONCEPT CASE
 doctrine_parameter_legalism_modified_law_costs: "Snižuje náklady na zákony o #P -10%#! za každou [Concept('virtue','ctnost')|E], kterou vládce má" # todo: CONCEPT CASE
 doctrine_parameter_legalism_modified_law_costs_2: "Zvyšuje náklady na zákony o #N 10%#! za každý [Concept('sin','hřích')|E], který vládce má" # todo: CONCEPT CASE
