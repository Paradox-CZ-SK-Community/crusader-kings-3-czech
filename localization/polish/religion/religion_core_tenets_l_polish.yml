 tenet_sacred_shadows_name: "Posvátné lži"
 tenet_sacred_shadows_desc: "Lhaní je nejhlubší umění. Ti, kdo dokážou přesvědčit ostatní o svých lžích, jsou svatí. Ti, kdo dokážou úspěšně klamat sami sebe, jsou nepřemožitelní."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Věřící získávají [Concept('piety','zbožnost')|E] za úspěšné dokončení [Concept('intrigue','pletichářství')|E] [Concept('schemes','intriky')|E]" # todo: CONCEPT CASE
 doctrine_parameter_adherents_more_likely_to_join_schemes: "Věřící jsou ochotnější stát se agenty v [Concept('schemes','intrikách')|E] jiných postav" # todo: CONCEPT CASE
 tenet_pursuit_of_power_name: "Honba za mocí"
 tenet_pursuit_of_power_desc: "Co je spravedlivé a co ne, je pomíjivé, určují to ti, kdo mají moc. Proto je honba za mocí jedinou skutečně spravedlivou záležitostí."
 tenet_pastoral_isolation_name: "Pastýřská izolace"
 tenet_pastoral_isolation_desc: "Vše, co chceme, je být ponecháni na pokoji. Naše praktiky jsou naše záležitost a nikomu jinému by do nich nemělo být co vidět."
 doctrine_parameter_unattractive_for_character_conversions: "[Concept('characters','Postavy')|E], nikoli však [Concept('counties','hrabství')|E], jsou ochotnější nechat se konvertovat z této [Concept('faith','víry')|E]" # todo: CONCEPT CASE
 tenet_natural_primitivism_name: "Přirozený primitivismus"
 tenet_natural_primitivism_desc: "Civilizace je nenapodobitelná, marný a rouhavý pokus člověka vnutit řád přirozeně neřádnému stvoření. Přijímáme naturismus a žijeme tak, jak zamýšlel [ROOT.Faith.PantheonTerm]: divoce a svobodně."
 doctrine_parameter_naked_adherents_active: "Věřící nenosí oblečení"
 doctrine_parameter_natural_primitivism_law_cost_increase: "Náklady na zákony: #N +50%#!"
 doctrine_parameter_unlock_jizya_contract: "Odemkne Jizya [Concept('vassal_contract','vazalská smlouva')|E] a [Concept('tax_decree','daňové nařízení')|E]" # todo: CONCEPT CASE
 tenet_communal_possessions_name: "Společné vlastnictví"
 tenet_communal_possessions_desc: "[ROOT.Faith.HighGodName] nám určil rovný podíl na zdrojích země. Měli bychom držet vše společně a přerozdělit ukradené bohatství mocných."
 doctrine_parameter_piety_from_gifts_active: "Věřící získávají [Concept('piety','zbožnost')|E] za posílání [Concept('gifts','dary')|E] a rozdávání [Concept('artifacts','artefakty')|E]" # todo: CONCEPT CASE
 doctrine_parameter_piety_from_marrying_lowborn_active: "Vládci získávají [Concept('piety','zbožnost')|E] za sňatek s [Concept('lowborn','neurozeným')|E] [Concept('characters','postavami')|E]" # todo: CONCEPT CASE
 tenet_sacrificial_ceremonies_name: "Obětní ceremonie"
 tenet_sacrificial_ceremonies_desc: "Lidské oběti, dobrovolné i nedobrovolné, nás přibližují k božskému. Je běžné a ctnostné dobrovolně se v obřadu obětovat, stejně jako je ctnostné obětovat ty, kteří spáchali bohům neodpustitelné zločiny."
 tenet_megaliths_name: "Megalitické stavby"
 tenet_megaliths_desc: "Uctívání by nemělo probíhat jen v rámci chrámu; to jsou primitivní stavby člověka, které ho odvádějí od božských stvoření kolem nás. Přijímáme kámen a otevřené nebe, uspořádáváme kameny, které nám stvořitel dal, tak, aby ho potěšily a přiblížily nás k božství."
 doctrine_parameter_can_build_megaliths: "Umožňuje stavbu Megalitů v [Concept('temple','chrámu')|E] držbách a Velkých Megalitů v hlavních městech vévodství." # todo: CONCEPT CASE
 province_is_of_a_megalith_faith_tt: "Tento [Concept('county','hrabství')|E] musí náležet víře, která přikládá megalitům význam." # todo: CONCEPT CASE
 tenet_fp3_fedayeen_name: "Fedayeen"
 tenet_fp3_sacred_murder_name: "Posvátná vražda"
 tenet_fp3_fedayeen_desc: "Když běžná válka nestačí, je naším povinností před [ROOT.Faith.HighGodNameAlternate] zničit [ROOT.Faith.HighGodHerHis|U] nepřátele infiltrace a klamem. Nesmíme se bát ani smrti, ani bolesti, a ochotně obětujeme své životy pro vyšší věc."
 doctrine_parameter_master_assassin_court_position_unlocked: "Odemkne #V [GetCourtPositionType( 'master_assassin_court_position' ).GetName()]#! [Concept('court_position','dvorský úřad')|E]" # todo: CONCEPT CASE
 doctrine_parameter_death_is_glory: "Pravděpodobnost smrti nebo zranění v [Concept('battle','bitvě')|E]: #N +10%#!" # todo: CONCEPT CASE
 doctrine_parameter_sanctioned_assassinations: "Žádná ztráta [Concept('piety','zbožnost')|e] za zabití postav jiné [Concept('faith','víra')|E] prostřednictvím [GetScheme('murder').GetTypeName] [Concept('schemes','intrik')|E]" # todo: CONCEPT CASE
 tenet_household_gods_name: "Domácí bohové"
 tenet_household_gods_desc: "Uctíváme naše #EMP Lares#! a #EMP Genii#! — ochrané duchy, kteří bdí nad našimi obydlími. Především ctíme našeho slavného císaře, jehož duše je pověřena ochranou celého království."
 doctrine_parameter_allows_brewery: "$allows_brewery$ pro [Concept('temple_holdings','chrámové državy')|E]" # todo: CONCEPT CASE
 immaterial_harmony_name: "Nehmotná harmonie" # todo: NEW TRANSLATION
 special_doctrine_immaterial_harmony_name: "Nehmotná harmonie" # todo: NEW TRANSLATION
 special_doctrine_immaterial_harmony_desc: "Mezi našimi tradicemi a učením Buddhy či mudrců není žádný rozpor. Lze praktikovat kteroukoliv z nich, nebo i všechny současně, bez duchovních potíží." # todo: NEW TRANSLATION
 doctrine_parameter_hostility_override_special_doctrine_immaterial_harmony: "Považuje [Concept('faiths','víry')|E] s $special_doctrine_immaterial_harmony_name$ a je jimi také považována za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] místo $hostility_astray_tooltippable$, $hostility_hostile_tooltippable$ nebo $hostility_evil_tooltippable$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tenet_extinction_of_dharma_name: "Vyhasnutí Dharmy" # todo: NEW TRANSLATION
 tenet_extinction_of_dharma_desc: "Démoni kráčejí po zemi v převlecích zbožných a oddaných; kdo zabije jednoho, postoupí o jeden krok k buddhovství; kdo zabije deset, postoupí o deset kroků." # todo: NEW TRANSLATION
 tenet_cranial_trophies_name: "Lebkové trofeje" # todo: NEW TRANSLATION
 tenet_cranial_trophies_desc: "Hlava je nádobou své podstaty. Odříznutím hlavy a vyjmutím jejího obsahu si můžeme přivlastnit silnou duchovní energii." # todo: NEW TRANSLATION
 doctrine_parameter_killing_bestows_heads: "Je možné získat Lebkovou trofej [Concept('artifact','artefakt')|E], když [Concept('executing','popravování')|E] jinou postavu, zabijete ji v [Concept('single_combat_duel','duelu')|E] nebo v [Concept('battle','bitvě')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 doctrine_parameter_decapitation_steals_prestige_as_piety: "Při získání Lebkové trofeje [Concept('artifact','artefakt')|E] navíc zabiják získá [Concept('piety','zbožnost')|E] v poměru k [Concept('prestige','prestiži')|E] zemřelého" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tenet_benevolent_governance_name: "Dobrotivé panování" # todo: NEW TRANSLATION
 tenet_benevolent_governance_desc: "Ti, kdo vládnou masám, mají morální povinnost podporovat to, co je dobré, a zříkat se toho, co je zlé. Pouze dodržováním tohoto principu může vládce být skutečně spravedlivý." # todo: NEW TRANSLATION
 tenet_filial_piety_name: "Úcta k rodičům" # todo: NEW TRANSLATION
 tenet_filial_piety_desc: "Úcta k rodičům a poslušnost starším jsou základem uskutečnění lidské dobroty. Když jsou naši rodiče naživu, sloužíme jim náležitě; když zemřou, pohřbíme je náležitě a pak je uctíváme náležitě." # todo: NEW TRANSLATION
 tenet_harmonious_society_name: "Harmonická společnost" # todo: NEW TRANSLATION
 tenet_harmonious_society_desc: "Všechno musí být v rovnováze: jednotlivci, příroda, společnost. Syn nebes nastavuje tempo a my následujeme jeho zpěv." # todo: NEW TRANSLATION
 doctrine_parameter_sway_scheme_better: "[GetScheme('sway').GetTypeName] [Concept('scheme_success_chance','Šance na úspěch intriky')|E]: [success_chance_i]#P +15%#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 doctrine_parameter_sway_scheme_piety: "Úspěšné [GetScheme('sway').GetTypeName] [Concept('schemes','intriky')|E] zaměřené na vašeho [Concept('liege','lenního pána')|E] nebo [Concept('vassals','vazalové')|E] poskytují [piety_i][Concept('piety','zbožnost')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
