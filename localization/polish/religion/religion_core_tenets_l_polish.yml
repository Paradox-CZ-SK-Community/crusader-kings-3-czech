 tenet_ritual_cannibalism_name: "Rituální kanibalismus"
 tenet_ritual_cannibalism_desc: "Lidstvo je požehnáno jiskrou božského. Lidské maso je tedy posvátné, jeho přítomnost je něco, co se má vychutnávat, ne pohřbívat či pálit."
 doctrine_parameter_cannibalism_legal: "Vlastnost [GetTrait('cannibal').GetName( GetNullCharacter )] se již nepovažuje za [Concept('criminal','zločinného')|E]" # todo: CONCEPT CASE
 tenet_exaltation_of_pain_name: "Zbožštění bolesti"
 tenet_exaltation_of_pain_desc: "Bolest je univerzální emoce, násilí univerzální jazyk. Ublížením druhému mu daruješ požehnání; přijmout bolest znamená obdržet milost."
