 tenet_sacred_shadows_name: "Posvátné lži"
 tenet_sacred_shadows_desc: "Lhaní je nejhlubším uměním, jaké existuje. Ti, kdo dokážou přesvědčit ostatní o svých lžích, jsou svatí. Ti, kdo dokážou úspěšně obelhat sami sebe, jsou nezastavitelní."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Vyznavači získávají zbožnost za úspěšně dokončené [Concept('schemes','intriky')|E] zaměřené na [Concept('intrigue','pletichaření')|E]"
