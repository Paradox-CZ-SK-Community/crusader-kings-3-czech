 tenet_exaltation_of_pain_name: "Povznesení bolesti"
 tenet_exaltation_of_pain_desc: "Bolest je univerzální pocit a násilí univerzální řeč. Způsobit druhému bolest znamená udělit mu požehnání a zakusit ji na vlastní kůži znamená přijmout milost."
