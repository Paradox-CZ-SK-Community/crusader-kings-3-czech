 tenet_communal_possessions_name: "Společné vlastnictví"
 tenet_communal_possessions_desc: "[ROOT.Faith.HighGodName] zamýšlel pro nás všechny rovný podíl na pozemských zdrojích. Vše bychom měli vlastnit společně a přerozdělit bohatství, které si mocní přivlastnili."
 doctrine_parameter_piety_from_gifts_active: "Vyznavači získávají [Concept('piety','zbožnost')|E] za posílání [Concept('gifts','darů')|E] a rozdávání [Concept('artifacts','artefaktů')|E]"
 doctrine_parameter_piety_from_marrying_lowborn_active: "[Concept('rulers','Vládci')|E] získávají [Concept('piety','zbožnost')|E] za sňatky s [Concept('lowborn','neurozenými')|E] [Concept('characters','postavami')|E]"
 doctrine_parameter_tenet_communal_possessions_redistribution_event: "Odemkne [decision|E] $redistribute_realm_wealth_decision$" # todo: NEW TRANSLATION
 tenet_sacrificial_ceremonies_name: "Obětní obřady"
 tenet_sacrificial_ceremonies_desc: "Dobrovolné i nedobrovolné lidské oběti nás přibližují božství. Dobrovolně se nabídnout jako oběť při obřadu je obvyklé a ctnostné, stejně jako je ctnostné obětovat ty, kdo se dopustili neodpustitelných zločinů proti bohům."
 tenet_megaliths_name: "Megalitické stavby"
 tenet_megaliths_desc: "Uctívání by nemělo probíhat pouze ve zdech chrámu. Tyto primitivní lidské stavby odvádějí pozornost od božského stvoření, které nás obklopuje. Obracíme se ke kameni a otevřenému nebi a uspořádáváme kameny darované stvořitelem tak, abychom se mu zalíbili a přiblížili božství."
 doctrine_parameter_can_build_megaliths: "Umožňuje stavbu megalitů v [Concept('temple','chrámových')|E] državách a velkých megalitů v hlavních sídlech vévodství."
