l_polish:
 doctrine_core_tenets_name: "Zásady"
 tenets_name: "Zásady"
 tenet_communion_name: "Společenství"
 tenet_communion_desc: "Naše obřady nejsou pouhými symboly – přivolávají samotnou přítomnost božství. Ti, kdo se k nám při jejich vykonávání nemohou nebo nechtějí připojit, nemohou být pravými věřícími."
 doctrine_parameter_tenet_communion_denied_sacrament: "[Concept('excommunicated','Exkomunikované')|E] [Concept('characters','postavy')|E] tohoto [Concept('rite','ritu')|E] mají #N -25%#! k zisku @piety_icon![Concept('piety','zbožnosti')|E] a #N -10#! k [Concept('opinion','mínění')|E] postav stejné víry"
 doctrine_parameter_tenet_communion_shared_table: "Za pořádání aktivity [GetActivityType('activity_feast').GetName] získáš #P +10#! [Concept('opinion','mínění')|E] u každého hosta stejné [Concept('faith','víry')|E]"
 doctrine_parameter_excommunication_active: "Duchovní [Concept('heads_of_faith','hlavy víry')|E] mohou [Concept('excommunicate','exkomunikovat')|E] jiné postavy své [Concept('faith','víry')|E]"
 tenet_excommunicated: "[GetTrait('excommunicated').GetName( GetNullCharacter )]"
 doctrine_parameter_last_rites_active: "Postavy tohoto [Concept('rite','ritu')|E] mají přístup k [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('pam_decision_last_rites').GetName]"
 doctrine_parameter_seek_indulgences_active: "Postavy mohou u své [Concept('head_of_faith','hlavy víry')|E] #V žádat o odpustky#! a zaplatit [Concept('gold','zlatem')|E] výměnou za [Concept('piety','zbožnost')|E]"
 tenet_armed_pilgrimages_name: "Ozbrojené poutě"
 tenet_armed_pilgrimages_desc: "Naši poutníci cestují napříč světem, aby navštívili naše posvátná místa – rádi se chopíme meče, abychom je ochránili před každým, kdo by jim chtěl ublížit."
 doctrine_parameter_cheaper_holy_wars_active: "Náklady na [Concept('piety','zbožnost')|E] při vyhlášení [Concept('holy_wars','svatých válek')|E] jsou pro [Concept('rulers','vládce')|E] této [Concept('faith','víry')|E] o #P -20%#! nižší"
 doctrine_parameter_great_holy_wars_active: "Pokud existuje [Concept('head_of_faith','hlava víry')|E], může při vysoké [Concept('fervor','horlivosti')|E] [Concept('faith','víry')|E] vyhlásit [Concept('great_holy_war','velkou svatou válku')|E]"
 doctrine_parameter_ghw_no_hof_conversion_buffs_active: "Pokud neexistuje žádná [Concept('head_of_faith','hlava víry')|E], získávají vyznavači za každé ovládané [Concept('holy_site','svaté místo')|E] bonus k [Concept('councillor_task','úkolu rádce')|E] [Concept('convert_county','Obracení hrabství na víru')|E]"
 doctrine_parameter_pilgrimage_decision_active: "Postavy této [Concept('faith','víry')|E] získají po úspěšném dokončení [Concept('pilgrimage','pouti')|E] další bonus"
 doctrine_parameter_leasing_to_military_order_give_spiritual_fulfillment_personal: "[Concept('leasing','Pronájem')|E] [Concept('holdings','držav')|E] [Concept('holy_orders','svatým řádům')|E] poskytuje dodatečné @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovní naplnění')|E]"
 leasing_to_military_order_give_spiritual_fulfillment_personal_toast: "$tenet_armed_pilgrimages_name$"
 tenet_monasticism_name: "Mnišství"
 tenet_monasticism_desc: "Požitky z vybraného jídla a pití nás pouze odvádějí od služby božství. Nejlepším způsobem, jak se těmto pokušením vyhnout, je uchýlit se do odlehlých klášterů."
 doctrine_parameter_take_vows_active: "[courtiers|E] mohou složit řeholní sliby a stát se [GetTrait('devoted').GetName( GetNullCharacter )]"
 doctrine_parameter_devoted_trait_criminal: "Rys [GetTrait('devoted').GetName(GetNullCharacter)] je [Concept('criminal','zločinný')|E]"
 doctrine_parameter_cannot_take_the_vows: "Postavy tohoto [Concept('rite','ritu')|E] nemohou použít [Concept('character_interaction','interakci s postavou')|E] #high $take_vows_interaction$#!"
 tenet_divine_marriage_name: "Božský sňatek"
 tenet_divine_marriage_xwedodah: "Chvétódáh"
 tenet_divine_marriage_desc: "Sňatky mezi blízkými příbuznými napodobujeme posvátné svazky prvních stvořených bytostí. Dobré vlastnosti se budou předávat naší rodovou linií, čímž získáme čistotu a přízeň ve věčném boji proti zlu."
 doctrine_parameter_divine_marriage_opinion: "Vyznavači sezdaní s [Concept('close_family','členem blízké rodiny')|E] získávají od [Concept('vassals','vazalů')|E] stejné [Concept('faith','víry')|E] $VALUE|0+=$ [Concept('opinion','mínění')|E]"
 doctrine_parameter_divine_marriage_piety_gain_active: "Manželský bonus [GetFaithDoctrine('doctrine_monogamy').GetBaseName] rovněž poskytne velké množství [Concept('piety','zbožnosti')|E], pokud uzavíráš sňatek s [Concept('close_family','členem blízké rodiny')|E]"
 doctrine_parameter_tenet_divine_marriage_spouse_contribution: "Příspěvek [Concept('skills','dovedností')|E] z [Concept('councillor_tasks','úkolů rádce')|E] [Concept('spouse','choti')|E]: #P +25%#!"
 doctrine_parameter_tenet_divine_marriage_incestuous_liege_faction_reluctance: "Vyznavači mají výrazně menší sklon vytvářet [Concept('factions','frakce')|E] nebo se k nim připojovat proti [Concept('liege','lennímu pánovi')|E], jehož choť patří do jejich [Concept('close_family','blízké rodiny')|E] nebo [Concept('extended_family','širší rodiny')|E]"
 tenet_pacifism_name: "Pacifismus"
 tenet_pacifism_desc: "Násilí je odporný čin, který vede pouze k utrpení, bolesti a lítosti. Budeme-li se mu vyhýbat, kdykoli je to možné, můžeme pro věřící vybudovat silnější a bezpečnější společnost."
 doctrine_parameter_holy_wars_forbidden: "Nelze vyhlašovat [Concept('holy_wars','svaté války')|E] ani podnikat [Concept('raid','nájezdy')|E]"
 doctrine_parameter_pacifist_opinion_active: ""
 pacifist_opinion_name: "Také pacifista"
 pacifist_county_opinion_name: "Pacifistické hrabství stejné víry"
 doctrine_parameter_opinion_of_pacifist_opinion_active: "[Concept('opinion','Mínění')|E] o ostatních pacifistech: $VALUE|+=0$"
 doctrine_parameter_piety_from_long_peace: "Měsíční změna [Concept('piety','zbožnosti')|E] [Concept('rulers','vládců')|E], kteří žijí v míru alespoň dva roky: $VALUE|+$"
 PIETY_LONG_PEACE: "Dlouhý mír"
 tenet_vows_of_poverty_name: "Sliby chudoby"
 tenet_vows_of_poverty_desc: "Peníze kazí lidská srdce a odvádějí je od pravé víry. Chceme-li se soustředit na to, na čem skutečně záleží, musíme se zříci hromadění hmotného bohatství."
 doctrine_parameter_vows_of_poverty_active: "[rulers|E] se mohou [Concept('decide','rozhodnout')|E] složit slib chudoby, čímž sníží měsíční příjem z [Concept('tax','daní')|E], ale zvýší měsíční přírůstek [Concept('piety','zbožnosti')|E]"
 tenet_human_sacrifice_name: "Lidské oběti"
 tenet_human_sacrifice_desc: "Nejlepším způsobem, jak prokázat svou oddanost, je přinést oběť. Nejcennější obětí, jakou můžeme nabídnout, je lidský život."
 doctrine_parameter_human_sacrifice_active: "[executions|E] přinášejí [Concept('piety','zbožnost')|E], místo aby ji stály\n$EFFECT_LIST_BULLET$[executions|E] při [Concept('sharing_power','sdílení moci')|E] nikdy nestojí [Concept('prestige','prestiž')|E]"
 doctrine_parameter_human_sacrifice_sharing_power_prestige: "[Concept('executions','Popravy')|E] při [Concept('sharing_power','sdílení moci')|E] nikdy nestojí @prestige_icon![Concept('prestige','prestiž')|E]"
 doctrine_parameter_flower_war_cb_active: "Zpřístupňuje [Concept('casus_belli','casus belli')|E] [Concept('flowery_war','Nájezd za zajatci')|E] proti sousedním panstvím"
 doctrine_parameter_tenet_human_sacrifice_execution_piety_bonus: "[Concept('executions','Popravy')|E] poskytují dodatečnou @piety_icon![Concept('piety','zbožnost')|E] a @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovní naplnění')|E] podle toho, k jaké [Concept('nobility','šlechtě')|E] oběť patří, a podle její [Concept('rank','hodnosti')|E]"
 doctrine_parameter_tenet_human_sacrifice_siege_capture_chance: "Výrazně vyšší šance zajmout postavy během [Concept('sieges','obléhání')|E]"
 doctrine_parameter_tenet_human_sacrifice_courtier_imprisonment_chance: "Vyšší šance [Concept('imprison','uvěznit')|E] bezzemské postavy"
 tenet_gruesome_festivals_blot_name: "Blót"
 tenet_gruesome_festivals_name: "Hrůzné slavnosti"
 tenet_gruesome_festivals_desc: "Všichni se rodíme v krvi. Přežíváme díky krvi našeho dobytka, naší rodiny a našich nepřátel. Je jen přirozené, že [ROOT.Faith.PantheonTerm] požadují svůj spravedlivý díl."
 gruesome_festivals_active_name: "Možnost pořádat velkolepé oběti"
 doctrine_parameter_gruesome_festivals_active: "Přibližně jednou za desetiletí lze pořádat velkolepé oběti ovlivňující poddané stejné [Concept('faith','víry')|E] a [Concept('county_opinion','lidové mínění')|E]"
 tenet_volcanic_veneration_name: "Uctívání sopek"
 tenet_volcanic_veneration_desc: "Sotva může být něco božštějšího než nově zrozená země tryskající z ohnivých hlubin našeho domova. Celý život trávíme na pokraji pohromy, navždy vydáni na milost [ROOT.Faith.PantheonTerm]."
 tenet_cthonic_redoubts_name: "Chtonické bašty"
 tenet_cthonic_redoubts_desc: "Není lepšího úkrytu než v kořenech Země, pevnější tvrze než mezi jejími vyčnívajícími hřbety ani posvátnější pouti než po jejích skrytých stezkách. Z těchto vysokých vrcholů shlížíme na Stvoření a pociťujeme skutečnou tíhu božství."
 doctrine_parameter_easier_to_convert_faith_in_mountains: "Rychlost [Concept('convert_county','obracení hrabství na víru')|E] v hornatém [Concept('terrain','terénu')|E]: #P +[EmptyScope.ScriptValue('easier_to_convert_faith_in_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_easier_to_convert_culture_in_same_faith_mountains: "Rychlost [Concept('promote_culture','prosazování kultury')|E] v hornatém [Concept('terrain','terénu')|E] stejné [Concept('faith','víry')|E]: #P +[EmptyScope.ScriptValue('promote_culture_easier_to_convert_culture_in_same_faith_mountains_bonus_loc_control')|0]%#!"
 doctrine_parameter_harder_to_convert_faith_away_in_mountains: "Rychlost nepřátelského [Concept('convert_county','obracení hrabství na víru')|E] v hornatém [Concept('terrain','terénu')|E]: #P [EmptyScope.ScriptValue('harder_to_convert_faith_away_in_mountains_malus_loc_control')|0]%#!"
 tenet_consolamentum_name: "Endura"
 tenet_consolamentum_name_alternate: "Rituální sebevražda"
 tenet_consolamentum_desc: "Když zestárneme nebo onemocníme, podstoupíme obřad, který očistí naše duše od hříchu. Poté rychle a rozhodně ukončíme svůj život, aby nás hřích již nemohl znovu poskvrnit."
 doctrine_parameter_consolamentum_active: "Vyznavači se mohou ve stáří, při nezpůsobilosti nebo blížící se smrti [Concept('decide','rozhodnout')|E] ukončit svůj život, aniž by tím utrpěli obvyklé postihy za sebevraždu"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing: "Když vyznavač zemře v důsledku [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('initiate_consolamentum_decision').GetName], jeho dědic získá #P [EmptyScope.ScriptValue('medium_piety_gain')|0]#! @piety_icon![Concept('piety','zbožnosti')|E]"
 doctrine_parameter_tenet_sacrificial_ceremonies_blessed_passing_personal: "Tvůj dědic získá navíc #P [EmptyScope.ScriptValue('monumental_piety_gain')|0]#! @piety_icon![Concept('piety','zbožnosti')|E] a $pam_blessed_passing_modifier$ na #P 10#! let, pokud zemřeš v důsledku [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('initiate_consolamentum_decision').GetName]"
 tenet_gnosticism_name: "Gnosticismus"
 tenet_gnosticism_desc: "Poznání může osvobodit božskou jiskru spočívající v každém člověku a navrátit ji k jejímu nebeskému zdroji v říši duchů."
 doctrine_parameter_granting_titles_gives_stress: "Rozdávání [Concept('titles','titulů')|E] snižuje úměrné množství [Concept('stress','stresu')|E]"
 tenet_mendicant_preachers_name: "Žebraví kazatelé"
 tenet_mendicant_preachers_desc: "Naši misionáři putují do dalekých krajů jen v šatech, které mají na sobě. Žijí ze štědrosti těch, jež navštěvují, a na oplátku se s nimi dělí o poznání pravé víry."
 doctrine_parameter_mendicant_preachers_conversion_active: "Rychlost obracení hrabství: #P +33#!"
 doctrine_parameter_tenet_mendicant_preachers_conversion_fulfillment: "Konverze [Concept('character','postavy')|E] poskytuje dodatečné @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovní naplnění')|E]"
 doctrine_parameter_tenet_mendicant_preachers_sway_acceptance: "Ovlivňování [Concept('characters','postav')|E] jiné [Concept('faith','víry')|E] má vyšší šanci na úspěch"
 doctrine_parameter_tenet_mendicant_preachers_activity_guest_conversion: "Hosté jiné [Concept('faith','víry')|E] na tvých [Concept('activities','aktivitách')|E] mohou konvertovat k tvé víře"
 doctrine_parameter_tenet_mendicant_preachers_local_conversion: "Zpřístupní #V $attempt_conversion_of_local_ruler_interaction$#! [Concept('interaction','interakci')|E] s [Concept('rulers','vládci')|E] v tvé aktuální [Concept('location','poloze')|E]"
 doctrine_parameter_tenet_mendicant_preachers_proselytize_travel_option: "Zpřístupní [Concept('travel_option','možnost cesty')|E] [GetTravelOption('adventurers_proselytize_zealously_option').GetName] bez [Concept('perk','talentu')|E] [GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)]"
 apa_pam_mendicant_preachers_conversion_title: "[second.GetShortUINameNoTooltip|U] konvertuje k víře [first.GetFaith.GetName]"
 must_be_in_same_county_tt: "Musíš být ve stejném [Concept('county','hrabství')|E], které drží"
 tenet_communal_identity_name: "Pospolitá identita"
 tenet_communal_identity_desc: "Naše víra a kultura jsou od sebe neoddělitelné. Tato tradice posiluje pouta našeho společenství, má však sklon vylučovat cizince."
 doctrine_parameter_same_communal_identity_opinion_active: "[Concept('opinion','Mínění')|E] u postav stejné [Concept('faith','víry')|E]: #P +10#!"
 doctrine_parameter_tenet_communal_identity_free_council_sway: "Ovlivňování frakce na [Concept('ecumenical_council','ekumenickém koncilu')|E] nestojí žádnou @prestige_icon![Concept('prestige','prestiž')|E]"
 doctrine_parameter_tenet_communal_identity_sway_piety: "[piety_i]#P [EmptyScope.ScriptValue('miniscule_piety_gain')|0]#! [Concept('piety','zbožnosti')|E] pokaždé, když úspěšně dokončíš [GetScheme('sway').GetTypeName] proti někomu, kdo vyznává tvůj [Concept('rite','ritus')|E]"
 doctrine_parameter_tenet_communal_identity_language_devotion: "[Concept('scheme_success_chance','Šance na úspěch intriky')|E] [GetScheme('learn_language').GetTypeName] proti cílům, které vyznávají tvůj [Concept('rite','ritus')|E]: [success_chance_i]#P +20%#!"
 doctrine_parameter_tenet_communal_identity_language_reward: "Osvojení [Concept('language','jazyka')|E] někoho, kdo vyznává tvůj [Concept('rite','ritus')|E], přináší @piety_icon![Concept('piety','zbožnost')|E] a @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovní naplnění')|E]"
 doctrine_parameter_same_culture_conversion_bonus_active: "Rychlost obracení v [Concept('counties','hrabstvích')|E] mé [Concept('culture','kultury')|E]: #P +50%#!"
 doctrine_parameter_same_faith_promote_culture_bonus_active: "Rychlost prosazování kultury v [Concept('counties','hrabstvích')|E] mé [Concept('faith','víry')|E]: #P +50%#!"
 doctrine_parameter_other_culture_conversion_penalty_active: "Rychlost obracení v [Concept('counties','hrabstvích')|E] jiné [Concept('culture','kultury')|E]: #N -50%#!"
 tenet_pentarchy_name: "Církevní hierarchie"
 tenet_pentarchy_alternate_name: "Pentarchie"
 tenet_pentarchy_desc: "Naše svatá místa nejsou pouhými posvátnými místy – jsou samotnými sídly moci, z nichž vládnou naši náboženští představitelé."
 tenet_aniconism_name: "Anikonismus"
 tenet_aniconism_desc: "Uctívání tesaných obrazů zaslepilo před božskou pravdou již příliš mnoho lidí. Odstraníme ze svých svatých míst všechny ikony, aby naši věřící neupadli do stejné pasti."
 doctrine_parameter_reforging_artifacts_costs_piety: "[Concept('rulers','Vládci')|E] této [Concept('faith','víry')|E] musí vynaložit [Concept('piety','zbožnost')|E], aby mohli [Concept('reforge','překovat')|E] nebo [Concept('repair','opravit')|E] [Concept('artifacts','artefakty')|E]"
 doctrine_parameter_destroying_artifacts_is_pious: "[Concept('rulers','Vládci')|E] této [Concept('faith','víry')|E] mohou ničit [Concept('artifacts','artefakty')|E] a získávat za ně [Concept('piety','zbožnost')|E]"
 doctrine_parameter_destroying_artifacts_is_pious_personal: "Můžeš ničit [Concept('artifacts','artefakty')|E] a získávat tím @piety_icon![Concept('piety','zbožnost')|E]"
 doctrine_parameter_tenet_aniconism_siege_destruction_bonus: "Obléhání [Concept('rulers','vládců')|E], jejichž [Concept('faith','víra')|E] nemá tuto [Concept('core_tenet','zásadu')|E], více snižuje [Concept('development','rozvoj')|E], častěji poškozuje [Concept('artifacts','artefakty')|E] a přináší @piety_icon![Concept('piety','zbožnost')|E]"
 tenet_aniconism_siege_destruction_toast: "$tenet_aniconism_name$"
 doctrine_parameter_tenet_aniconism_destruction_fulfillment: "Získáváš @spiritual_fulfillment_icon![Concept('spiritual_fulfillment','duchovní naplnění')|E] za ničení [Concept('artifacts','artefaktů')|E] a za obléhání stoupenců [Concept('faith','víry')|E], která nemá tuto [Concept('core_tenet','zásadu')|E]"
 pam_aniconism_siege_toast: "Díky tvé [Concept('personal_tenet','osobní zásadě')|E] [GetTenetType('tenet_aniconism').GetName( GetPlayer.GetRite )]"
 destroying_artifacts_is_not_pious_tt: "Tvá [Concept('faith','víra')|E] nemůže ničit [Concept('artifacts','artefakty')|E] výměnou za [Concept('piety','zbožnost')|E]"
 artifact_is_rarer_than_masterwork_tt: "Tento [Concept('artifact','artefakt')|E] svou [Concept('rarity','vzácností')|E] převyšuje mistrovské dílo"
 tenet_alexandrian_catechism_name: "Alexandrijský katechismus"
 tenet_alexandrian_catechism_desc: "Alexandrijská katechetická škola měla dlouhou tradici, která povzbuzovala teology ke kritickému myšlení a zpochybňování zavedeného stavu.\n\nPřestože byla škola fyzicky zničena, v těchto tradicích pokračujeme."
 tenet_islamic_rationalism_name: "Islámský racionalismus"
 tenet_islamic_rationalism_desc: "Spravedlnost a moudrost [ROOT.Faith.HighGodNameAlternate] znamenají, že [ROOT.Faith.HighGodNameSheHe|U] nemůže jednat proti rozumu ani přehlížet blaho [ROOT.Faith.HighGodHerHis|U] stvoření. Pouze vlastním rozumem můžeme doufat, že pochopíme svou úlohu ve [ROOT.Faith.HighGodHerHis|U] velkém díle a rozeznáme dobro od zla."
 doctrine_parameter_scholasticism_is_holy: "[Concept('trait','Rys')|E] [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] přináší další bonusy"
 doctrine_parameter_tenet_alexandrian_catechism_catechetical_school: "Děti se [Concept('education_focus','zaměřením vzdělání')|E] na [Concept('learning','učenost')|E] mohou při dosažení dospělosti získat [Concept('experience','zkušenosti')|E] pro [Concept('learning_lifestyle','učený životní styl')|E]; častěji, pokud máš i ty kvalitní vzdělání"
