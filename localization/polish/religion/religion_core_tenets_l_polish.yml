 tenet_unreformed_syncretism_name: "Synkretické lidové tradice"
 tenet_unreformed_syncretism_desc: "Kdo jsme, abychom ostatním tvrdili, že jejich tradice nejsou pravdivé? Nepřísluší nám poučovat je o zvycích, které praktikují po staletí. Místo toho bychom se měli v tichosti učit jejich způsobům."
