 tenet_pacifism_name: "Pacifismus"
 tenet_pacifism_desc: "Násilí je odporný čin, který vede pouze k utrpení, bolesti a lítosti. Budeme-li se mu vyhýbat, kdykoli je to možné, můžeme pro věřící vybudovat silnější a bezpečnější společnost."
