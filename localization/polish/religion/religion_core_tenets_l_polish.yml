 tenet_sacred_shadows_name: "Posvátné lži"
 tenet_sacred_shadows_desc: "Lhaní je nejhlubším uměním, jaké existuje. Ti, kdo dokážou přesvědčit ostatní o svých lžích, jsou svatí. Ti, kdo dokážou úspěšně obelhat sami sebe, jsou nezastavitelní."
 doctrine_parameter_piety_gain_from_successful_intrigue_schemes: "Vyznavači získávají zbožnost za úspěšně dokončené [Concept('schemes','intriky')|E] zaměřené na [Concept('intrigue','pletichaření')|E]"
 doctrine_parameter_adherents_more_likely_to_join_schemes: "Vyznavači jsou ochotnější stát se spolčenci v [Concept('schemes','intrikách')|E] jiných postav"
 tenet_pursuit_of_power_name: "Usilování o moc"
 tenet_pursuit_of_power_desc: "To, co je a není spravedlivé, je pomíjivé a určují to ti, kteří právě drží moc. Usilování o moc je proto jedinou skutečně spravedlivou věcí."
 tenet_pastoral_isolation_name: "Pastýřská odloučenost"
 tenet_pastoral_isolation_desc: "Chceme pouze, aby nás ostatní nechali na pokoji. Naše zvyklosti jsou jen naší věcí, stejně jako nám nepřísluší zasahovat do zvyků ostatních."
 doctrine_parameter_unattractive_for_character_conversions: "[Concept('characters','Postavy')|E], nikoli však [Concept('counties','hrabství')|E], jsou ochotnější od této [Concept('faith','víry')|E] konvertovat"
 tenet_natural_primitivism_name: "Přírodní primitivismus"
 tenet_natural_primitivism_desc: "Civilizace je nepřirozeným, marným a rouhavým pokusem člověka vnutit řád stvoření, které je ze své podstaty neuspořádané. Přijímáme naturismus a žijeme divoce a svobodně, jak [ROOT.Faith.PantheonTerm] zamýšleli."
 doctrine_parameter_naked_adherents_active: "Vyznavači nenosí oděv"
 doctrine_parameter_natural_primitivism_law_cost_increase: "Náklady na zákony: #N +50%#!"
 doctrine_parameter_unlock_jizya_contract: "Zpřístupňuje džizjovú [Concept('vassal_contract','vazalskou smlouvu')|E] a [Concept('tax_decree','daňové nařízení')|E]"
 tenet_communal_possessions_name: "Společné vlastnictví"
 tenet_communal_possessions_desc: "[ROOT.Faith.HighGodName] zamýšlel pro nás všechny rovný podíl na pozemských zdrojích. Vše bychom měli vlastnit společně a přerozdělit bohatství, které si mocní přivlastnili."
 doctrine_parameter_piety_from_gifts_active: "Vyznavači získávají [Concept('piety','zbožnost')|E] za posílání [Concept('gifts','darů')|E] a rozdávání [Concept('artifacts','artefaktů')|E]"
 doctrine_parameter_piety_from_marrying_lowborn_active: "[Concept('rulers','Vládci')|E] získávají [Concept('piety','zbožnost')|E] za sňatky s [Concept('lowborn','neurozenými')|E] [Concept('characters','postavami')|E]"
 tenet_sacrificial_ceremonies_name: "Obětní obřady"
 tenet_sacrificial_ceremonies_desc: "Dobrovolné i nedobrovolné lidské oběti nás přibližují božství. Dobrovolně se nabídnout jako oběť při obřadu je obvyklé a ctnostné, stejně jako je ctnostné obětovat ty, kdo se dopustili neodpustitelných zločinů proti bohům."
 tenet_megaliths_name: "Megalitické stavby"
 tenet_megaliths_desc: "Uctívání by nemělo probíhat pouze ve zdech chrámu. Tyto primitivní lidské stavby odvádějí pozornost od božského stvoření, které nás obklopuje. Obracíme se ke kameni a otevřenému nebi a uspořádáváme kameny darované stvořitelem tak, abychom se mu zalíbili a přiblížili božství."
 doctrine_parameter_can_build_megaliths: "Umožňuje stavbu megalitů v [Concept('temple','chrámových')|E] državách a velkých megalitů v hlavních sídlech vévodství."
 province_is_of_a_megalith_faith_tt: "Toto [Concept('county','hrabství')|E] musí vyznávat [Concept('faith','víru')|E], která věří ve význam megalitů."
 tenet_fp3_fedayeen_name: "Fedajíni"
 tenet_fp3_sacred_murder_name: "Posvátná vražda"
 tenet_fp3_fedayeen_desc: "Když běžná válka nestačí, je naší povinností vůči [ROOT.Faith.HighGodNameAlternate] zničit [ROOT.Faith.HighGodHerHis|U] nepřátele pomocí infiltrace a lsti. Nesmíme se bát smrti ani bolesti a musíme ochotně položit své životy za vyšší věc."
 doctrine_parameter_master_assassin_court_position_unlocked: "Zpřístupňuje [Concept('court_position','dvorský úřad')|E] #V [GetCourtPositionType( 'master_assassin_court_position' ).GetName()]#!"
 doctrine_parameter_death_is_glory: "Pravděpodobnost smrti nebo zranění v [Concept('battle','bitvě')|E]: #N +10%#!"
 doctrine_parameter_sanctioned_assassinations: "Za zabití postav jiné [Concept('faith','víry')|E] prostřednictvím [Concept('schemes','intrik')|E] typu [GetScheme('murder').GetTypeName] se neztrácí [Concept('piety','zbožnost')|E]"
 tenet_household_gods_name: "Domácí bohové"
 tenet_household_gods_desc: "Ctíme své #EMP lary#! a #EMP génie#! – ochranné duchy, kteří bdí nad našimi příbytky. Především ctíme svého slavného císaře, jehož duši byla svěřena ochrana celého panství."
 doctrine_parameter_allows_brewery: "$allows_brewery$ pro [Concept('temple_holdings','chrámové državy')|E]"
 immaterial_harmony_name: "Nehmotná harmonie"
 special_doctrine_immaterial_harmony_name: "Nehmotná harmonie"
 special_doctrine_immaterial_harmony_desc: "Mezi našimi tradicemi a učením Buddhy či mudrců není žádný rozpor. Člověk může následovat kterékoli z nich, nebo dokonce všechna současně, aniž by tím duchovně strádal."
 doctrine_parameter_hostility_override_special_doctrine_immaterial_harmony: "Považuje [Concept('faiths','víry')|E] se zvláštní doktrínou $special_doctrine_immaterial_harmony_name$ za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] a tyto víry ji považují za totéž namísto $hostility_astray_tooltippable$, $hostility_hostile_tooltippable$ nebo $hostility_evil_tooltippable$"
 tenet_extinction_of_dharma_name: "Zánik dharmy"
 tenet_extinction_of_dharma_desc: "Démoni kráčejí po zemi v podobě zbožných a oddaných. Kdokoli jednoho z nich zabije, učiní krok k buddhovství, a kdokoli jich zabije deset, učiní k buddhovství deset kroků."
 tenet_cranial_trophies_name: "Lebkové trofeje"
 tenet_cranial_trophies_desc: "Hlava je schránkou kvintesence svého vlastníka. Jejím oddělením a vyjmutím jejího obsahu si můžeme přivlastnit mocnou duchovní energii."
 doctrine_parameter_killing_bestows_heads: "Při [Concept('executing','popravě')|E] jiné postavy, jejím zabití v [Concept('single_combat_duel','duelu')|E] nebo v [Concept('battle','bitvě')|E] lze získat [Concept('artifact','artefakt')|E] lebkové trofeje"
 doctrine_parameter_decapitation_steals_prestige_as_piety: "Při získání [Concept('artifact','artefaktu')|E] lebkové trofeje získá vrah navíc [Concept('piety','zbožnost')|E] úměrnou [Concept('prestige','prestiži')|E] zemřelého"
 tenet_benevolent_governance_name: "Laskavá vláda"
 tenet_benevolent_governance_desc: "Ti, kdo vládnou lidu, mají mravní povinnost podporovat dobro a zavrhovat zlo. Pouze dodržováním této zásady může být vládce skutečně spravedlivý."
 tenet_filial_piety_name: "Synovská úcta"
 tenet_filial_piety_desc: "Synovská úcta a poslušnost vůči starším jsou základem uskutečnění lidského dobra. Dokud naši rodiče žijí, sloužíme jim náležitým způsobem; když zemřou, náležitým způsobem je pohřbíme a poté je náležitým způsobem uctíváme."
 tenet_harmonious_society_name: "Harmonická společnost"
 tenet_harmonious_society_desc: "Vše musí být v rovnováze: jednotlivci, příroda i společnost. Syn nebes udává rytmus a my následujeme jeho zpěv."
 doctrine_parameter_sway_scheme_better: "[Concept('scheme_success_chance','Šance na úspěch intriky')|E] [GetScheme('sway').GetTypeName]: [success_chance_i]#P +15%#!"
 doctrine_parameter_sway_scheme_piety: "Úspěšné [Concept('schemes','intriky')|E] [GetScheme('sway').GetTypeName] zaměřené na tvého [Concept('liege','lenního pána')|E] nebo [Concept('vassals','vazaly')|E] přinášejí [piety_i][Concept('piety','zbožnost')|E]"
 doctrine_parameter_more_often_zealots: "[Concept('vassals','Vazalové')|E] s větší pravděpodobností zaujímají [Concept('vassal_stance','vazalský postoj')|E] [GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]"
 tenet_harmonious_society_sway_boon: "Tvá [Concept('faith','víra')|E] má [GetFaithDoctrine('tenet_harmonious_society').GetBaseName]: $VALUE|+0=$"
 tenet_pursuit_of_knowledge_name: "Usilování o poznání"
 tenet_pursuit_of_knowledge_desc: "Nejvýše stojí ti, kdo byli poznáním nadáni již od narození. Na druhém místě jsou ti, kdo poznání dobrovolně vyhledávají. Nejníže stojí lidé, kteří jsou nechápaví a nesnaží se učit."
 doctrine_parameter_inspections_unlocked_and_costs_piety: "Zpřístupňuje [Concept('activity','aktivitu')|E] [GetActivityType('activity_survey').GetName] za cenu [Concept('piety','zbožnosti')|E]"
 doctrine_parameter_inspection_gives_devotion: "Dokončení [Concept('activity','aktivity')|E] [GetActivityType('activity_survey').GetName] přináší [Concept('piety_experience','oddanost')|E]"
 doctrine_parameter_better_study_scheme: "[Concept('scheme_success_chance','Šance na úspěch intriky')|E] [GetScheme('study_confucian_classics').GetTypeName]: [success_chance_i]#P +15%#!"
 doctrine_parameter_parents_get_hooks_on_children: "Rodiče automaticky získají [Concept('perpetual_hooks','trvalé páky')|E] vůči svým [Concept('children','dětem')|E]"
 tgp_local_shrines_patronized: "Podpora místních svatyní"
 tenet_sacred_destruction_name: "Posvátná zkáza"
 tenet_sacred_destruction_desc: "Bez zkázy nemůže být stvoření. Má-li začít něco nového, musí něco starého skončit."
 doctrine_parameter_successful_sieges_give_piety: "Vítězství při útočném [Concept('siege','obléhání')|E] přináší [Concept('piety','zbožnost')|E] a způsobuje větší ztrátu [Concept('development','rozvoje')|E] [Concept('county','hrabství')|E]"
 successful_sieges_give_piety_toast: "Zásada $tenet_sacred_destruction_name$"
 tenet_preservation_name: "Zachování"
 tenet_preservation_desc: "Stvoření, ochrana, proměna. Ctnost pramení z výstavby, z vybudování něčeho a sledování, jak to vzkvétá."
 building_temples_gives_development_toast: "Zásada $tenet_preservation_name$"
 doctrine_parameter_building_temples_gives_development: "Výstavba v [Concept('church_holding','církevní državě')|E] nebo [Concept('temple_citadel_holding','državě chrámové citadely')|E] zvyšuje [Concept('development','rozvoj')|E] [Concept('county','hrabství')|E]"
 doctrine_parameter_monastic_schools_allowed_in_every_holding_type: "Umožňuje ve všech [Concept('holding_types','typech držav')|E] stavět řadu [Concept('buildings','budov')|E] #V $building_type_monastic_schools_01$#!"
 doctrine_parameter_mountain_trait_bonuses: "Některé [Concept('commander_traits','velitelské rysy')|E] a [Concept('personality_traits','osobnostní rysy')|E] poskytují dodatečné bonusy v horách"
