 doctrine_parameter_self_mutilation_active: "Může se [Concept('decide','rozhodnout')|E] rozhodnout provést sebepoškození, získat [Concept('piety','zbožnost')|E] za cenu získání [GetTrait('wounded_1').GetName( GetPlayer )] [Concept('trait','rys')|E]" # todo: CONCEPT CASE
