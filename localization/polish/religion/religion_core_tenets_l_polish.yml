 doctrine_parameter_self_mutilation_active: "Lze se [Concept('decide','rozhodnout')|E] provést sebepoškození, které přinese [Concept('piety','zbožnost')|E] za cenu získání [GetTrait('wounded_1').GetName( GetPlayer )] [Concept('trait','rysu')|E]"
