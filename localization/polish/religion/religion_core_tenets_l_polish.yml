 tenet_ritual_cannibalism_name: "Rituální kanibalismus"
 tenet_ritual_cannibalism_desc: "Lidstvo bylo požehnáno božskou jiskrou. Lidské maso je proto posvátné a jeho přítomnost je třeba vychutnat, nikoli pohřbít či spálit."
 doctrine_parameter_cannibalism_legal: "Rys [GetTrait('cannibal').GetName( GetNullCharacter )] již není považován za [Concept('criminal','zločinný')|E]"
 tenet_exaltation_of_pain_name: "Povznesení bolesti"
 tenet_exaltation_of_pain_desc: "Bolest je univerzální pocit a násilí univerzální řeč. Způsobit druhému bolest znamená udělit mu požehnání a zakusit ji na vlastní kůži znamená přijmout milost."
 doctrine_parameter_torturing_prisoners_grants_piety: "Mučení [Concept('prisoners','vězňů')|E] přináší [Concept('piety','zbožnost')|E], místo aby ji stálo"
