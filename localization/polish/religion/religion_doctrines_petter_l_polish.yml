 muhammad_succession_zandaqa_doctrine_name: "Zandaq"
 muhammad_succession_zandaqa_doctrine_desc: "Ať už podle ostatních muslimů odvozujeme Prorokovu linii správně, či nikoli, naše víra nás tak jako tak činí vyděděnci. Ať nás hříšníci nazývají zindíqy – my známe pravdu!"
