l_polish:
 doctrine_muhammad_succession_name: "Mohamedovo nástupnictví"
 doctrine_muhammad_succession_desc: "Otázka, kdo je Mohamedovým právoplatným nástupcem v úloze duchovního vůdce muslimské obce, má zásadní význam."
 muhammad_succession_sunni_doctrine_name: "Sunna"
 muhammad_succession_sunni_doctrine_desc: "Umma si zvolila Abú Bakra za svého právoplatného světského i duchovního vůdce."
