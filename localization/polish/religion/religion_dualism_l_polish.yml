 sethianism_desc: "Neznámý Bůh vyzářil veškeré bytí do dokonalého plérómatu naplněného milostivými eóny, z nichž první byla Barbelo, Matka-Otec.\nPorušení tohoto řádu vedlo ke vzniku Jaldabaotha, který odcizil zlomek božství a stvořil hmotný svět. Když však stvořil lidstvo, neúmyslně mu předal svou ukradenou jiskru božství. Jaldabaoth se bude po celou věčnost pokoušet získat svou moc zpět, zatímco lidstvo musí usilovat o návrat k Barbelo a Neznámému Bohu."
