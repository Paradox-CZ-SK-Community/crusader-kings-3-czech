 cainitism: "Kainitství"
 cainitism_adj: "Kainitský"
 cainitism_adherent: "Kainita"
 cainitism_adherent_plural: "Kainité"
 cainitism_desc: "Kain byl první obětí zla Demiurga, stvořitele veškeré hmoty. Jelikož jsou hmota i těla zlé, musí být těla poskvrněna a zničena hříchem, aby mohla být osvobozena pravá lidská duše, která je v nich uvězněna."
