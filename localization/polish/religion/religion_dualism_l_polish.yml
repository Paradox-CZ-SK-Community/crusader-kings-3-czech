 mingism_adj: "Mingistický"
 mingism_adherent: "Mingista"
 mingism_adherent_plural: "Mingisté"
 mingism_desc: "Podle učení Buddhy Móního je nebeské Království světla obléháno Královstvím temnoty a všichni očekávají den, kdy Zářivý pán, jemuž vzdávají hold slunce a měsíc, vyšle své posly na zem, aby šířili osvícení a vysvobodili lid z utrpení."
