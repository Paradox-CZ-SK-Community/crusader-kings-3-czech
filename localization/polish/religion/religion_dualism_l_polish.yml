 priscillianism: "Priscillianismus"
 priscillianism_adj: "Priscillianistický"
 priscillianism_adherent: "Priscillianista"
 priscillianism_adherent_plural: "Priscillianisté"
 priscillianism_desc: "Existují dvě království, jedno Světla a druhé Temnoty. Lidské duše měly dobýt Království temnoty, ale padly a uvízly v hmotném světě. Mezi lidmi bylo dvanáct patriarchů světla, kteří nedokázali překonat Temnotu, neboť byli rozpolceni mezi tělem a duší. Bůh proto seslal na zem Spasitele, který svou smrtí opět umožnil osvobození lidských duší."
