 smartism_adherent: "Smárta"
 smartism_adherent_plural: "Smártové"
 smartism_desc: "Tradice Smárta odmítá výlučné uctívání jednotlivých bohů. Brahman je jediný a věčný a Višnu, Déví, Šiva, Ganéša a Súrja jsou uctíváni jako rovnocenné projevy Nejvyšší bytosti. Uctívání kteréhokoli z nich je krokem k dosažení poznání a jednoty s brahmanem."
