 sadr_al_islam: "Sadr al-Islám" # todo: NEW TRANSLATION
 sadr_al_islam_adj: "muslimský" # todo: NEW TRANSLATION
 sadr_al_islam_adherent: "muslim" # todo: NEW TRANSLATION
 sadr_al_islam_adherent_plural: "muslimové" # todo: NEW TRANSLATION
 sadr_al_islam_desc: "Ve své nejčistší podobě, před vznikem myšlenkových škol, vedl muslimy sám Prorok prostřednictvím božského zjevení. Jeho sunnu následovali společníci a tábi'ún prvních několika generací." # todo: NEW TRANSLATION
 sunni: "Sunnismus" # todo: NEW TRANSLATION
 sunni_adj: "sunnitský" # todo: NEW TRANSLATION
 sunni_adherent: "sunnita" # todo: NEW TRANSLATION
 sunni_adherent_plural: "sunnité" # todo: NEW TRANSLATION
 sunni_desc: "Sunnismus označuje následovníky Muhammadovy praxe, známé jako sunna. Sunnitská islámská jurisprudence vychází především z Koránu, hadísů a idžmá (odborného konsenzu) jakožto svých základních pramenů." # todo: NEW TRANSLATION
 shia: "Šíismus" # todo: NEW TRANSLATION
 shia_adj: "šíitský" # todo: NEW TRANSLATION
 shia_adherent: "šíita" # todo: NEW TRANSLATION
 shia_adherent_plural: "šíité" # todo: NEW TRANSLATION
 shia_desc: "Větev islámu, která věří, že vedení má zůstat v rodině Proroka Muhammada a předávat se prostřednictvím božsky vedených imámů. Zaměřuje se na oddanost Prorokově rodině." # todo: NEW TRANSLATION
 islam_shia_priest: "Mulla"
 islam_shia_priest_plural: "Mullové"
 islam_shia_religious_head_title: "Imám"
 islam_shia_religious_head_title_name: "Imámát"
 kharijite: "Cháridžismus" # todo: NEW TRANSLATION
 kharijite_adj: "cháridžitský" # todo: NEW TRANSLATION
 kharijite_adherent: "cháridžita" # todo: NEW TRANSLATION
 kharijite_adherent_plural: "cháridžité" # todo: NEW TRANSLATION
 kharijite_desc: "Raně islámské hnutí, které věřilo, že vedení má vycházet z zbožnosti, nikoli z původu, a že hříšné vládce lze sesadit. Vzniklo během šíitských nepokojů, odmítlo obě strany a prohlásilo těžké hříšníky za osoby stojící mimo islám." # todo: NEW TRANSLATION
 masmudi: "Almohadismus"
 masmudi_adj: "Almohadský"
 masmudi_adherent: "Almohad"
 masmudi_adherent_plural: "Almohadové"
 masmudi_desc: "Almohadské hnutí, reformní větev sunnitského islámu, vzniklo mezi berberskými kmeny severní Afriky. Jeho stoupenci se považovali za zastánce Boží jednoty a hlásali učení očištěného monoteismu."
 masmudi_religious_head_title: "Chalífa"
 masmudi_religious_head_title_name: "Chalífát"
 quranist: "Koránismus"
 quranist_adj: "Koránistický"
 quranist_adherent: "Koránista"
 quranist_adherent_plural: "Koránisté"
 quranist_desc: "Doslovný výklad islámu, který zdůrazňuje, že Korán je jediným zdrojem božské moudrosti a musí být dodržován do posledního písmene bez ohledu na hadísy a fatvy."
 druze: "Drúzství"
 druze_adj: "Drúzský"
 druze_adherent: "Drúz"
 druze_adherent_plural: "Drúzové"
 druze_desc: "Drúzská víra pocházející z Drúzské hory se řídí mnoha zásadami ismá'ílíje, zároveň však zahrnuje gnostické nauky v rámci esoterické teologie soustředěné na pravdu bytí."
 druze_religious_text: "Listy moudrosti"
 druze_religious_text_2: "$druze_religious_text$"
 druze_religious_text_3: "$druze_religious_text$"
 ashari: "Aš'arismus" # todo: NOT IN ENGLISH
 ashari_adj: "Aš'aritský" # todo: NOT IN ENGLISH
 ashari_adherent: "Aš'arita" # todo: NOT IN ENGLISH
 ashari_adherent_plural: "Aš'arité" # todo: NOT IN ENGLISH
 ashari_desc: "Ortodoxní teologická škola, podle níž Alláh stvořil každý okamžik času, lidé však mají svobodnou vůli volit mezi dobrem – tím, co Bůh přikázal – a zlem – tím, co Bůh zakázal." # todo: NOT IN ENGLISH
 muwalladi: "Muladíjství" # todo: NOT IN ENGLISH
 muwalladi_adj: "Muladíjský" # todo: NOT IN ENGLISH
 muwalladi_adherent: "Muladí" # todo: NOT IN ENGLISH
 muwalladi_adherent_plural: "Muladíové" # todo: NOT IN ENGLISH
 muwalladi_desc: "Pyrenejští muslimové, vzdálení od středu arabského světa, se přizpůsobili skutečnosti, že vládnou oblasti s početným křesťanským a židovským obyvatelstvem, jehož tradice jim připadaly podivné a cizí." # todo: NOT IN ENGLISH
 mutazila: "Mu'tazila" # todo: NOT IN ENGLISH
 mutazila_adj: "Mu'tazilský" # todo: NOT IN ENGLISH
 mutazila_adherent: "Mu'tazilita" # todo: NOT IN ENGLISH
 mutazila_adherent_plural: "Mu'tazilité" # todo: NOT IN ENGLISH
 mutazila_desc: "Racionalistická teologická škola, podle níž Korán #EMP není#! věčný a souvěčný s Bohem, neboť Bůh musel předcházet vlastnímu slovu." # todo: NOT IN ENGLISH
 maturidi: "Maturidismus" # todo: NOT IN ENGLISH
 maturidi_adj: "Maturidovský" # todo: NOT IN ENGLISH
 maturidi_adherent: "Maturidita" # todo: NOT IN ENGLISH
 maturidi_adherent_plural: "Maturidité" # todo: NOT IN ENGLISH
 maturidi_desc: "Racionalistická teologie, podle níž má etika objektivní existenci odvozenou z věčných Božích vlastností, a lidé proto musí usilovat o mravné jednání." # todo: NOT IN ENGLISH
 ismaili: "Ismá'ílíja" # todo: NOT IN ENGLISH
 ismaili_adj: "Ismá'ílíjský" # todo: NOT IN ENGLISH
 ismaili_adherent: "Ismá'ílita" # todo: NOT IN ENGLISH
 ismaili_adherent_plural: "Ismá'ílité" # todo: NOT IN ENGLISH
 ismaili_desc: "Ší'itská víra, podle níž linie pravých imámů – obdařených božským poznáním a neomylností – pokračuje skrze Ismá'íla ibn Dža'fara. Její stoupenci jsou rovněž známi jako Sedmíci, neboť Ismá'íl byl sedmým imámem po Mohamedovi." # todo: NOT IN ENGLISH
 qarmatian: "Karmatství" # todo: NOT IN ENGLISH
 qarmatian_adj: "Karmatský" # todo: NOT IN ENGLISH
 qarmatian_adherent: "Karmat" # todo: NOT IN ENGLISH
 qarmatian_adherent_plural: "Karmaté" # todo: NOT IN ENGLISH
 qarmatian_desc: "Větev ismá'ílíje, která přijala prvky zoroastrismu. Bůh předurčil počet imámů na sedm, a proto se před návratem sedmého imáma Mohameda ibn Ismá'íla, jenž má opět vést věřící, nemohl objevit žádný další imám." # todo: NOT IN ENGLISH
 nizari: "Nizáríja" # todo: NOT IN ENGLISH
 nizari_adj: "Nizárijský" # todo: NOT IN ENGLISH
 nizari_adherent: "Nizárijec" # todo: NOT IN ENGLISH
 nizari_adherent_plural: "Nizárijci" # todo: NOT IN ENGLISH
 nizari_desc: "Racionalistická víra, která při výkladu Koránu a hadísů zdůrazňuje rozumové uvažování. Úřad imáma je dědičný a jeho nástupnickou linii odvozuje od Alího." # todo: NOT IN ENGLISH
 zayidi: "Zajdíja" # todo: NOT IN ENGLISH
 zayidi_adj: "Zajdíjský" # todo: NOT IN ENGLISH
 zayidi_adherent: "Zajdíjec" # todo: NOT IN ENGLISH
 zayidi_adherent_plural: "Zajdíjci" # todo: NOT IN ENGLISH
 zayidi_desc: "Pravý imám není neomylný, ale prokazuje se bojem proti zkaženosti a zlu. Zajdíjci proto věří, že Zajd ibn Alí byl díky svému povstání proti Umajjovcům právoplatným nástupcem imámátu." # todo: NOT IN ENGLISH
 imami: "Isná ašaríja" # todo: NOT IN ENGLISH
 imami_adj: "Dvanáctnický" # todo: NOT IN ENGLISH
 imami_adherent: "Dvanáctník" # todo: NOT IN ENGLISH
 imami_adherent_plural: "Dvanáctníci" # todo: NOT IN ENGLISH
 imami_desc: "Dvanáctníci věří, že bylo předpovězeno dvanáct imámů, kteří povedou ummu, a že dvanáctý imám, imám Zamán, čeká na svůj návrat, aby přivedl muslimy ke dni posledního soudu." # todo: NOT IN ENGLISH
 islam_ayatollah: "Ajatolláh" # todo: NOT IN ENGLISH
 islam_ayatollah_plural: "Ajatolláhové" # todo: NOT IN ENGLISH
 ghulat: "Ichtiláfismus" # todo: NOT IN ENGLISH
 ghulat_adj: "Ichtiláfijský" # todo: NOT IN ENGLISH
 ghulat_adherent: "Ichtiláfita" # todo: NOT IN ENGLISH
 ghulat_adherent_plural: "Ichtiláfité" # todo: NOT IN ENGLISH
 ghulat_desc: "Ichtiláfité věří v božskou podstatu neomylných imámů počínaje Alím. Bůh je nejen ustanovil a obdařil vnuknutím, ale také v nich částečně přebývá, aby vedl jejich činy, a jejich prostřednictvím i celou ummu." # todo: NOT IN ENGLISH
 alawite: "Alávitství" # todo: NOT IN ENGLISH
 alawite_adj: "Alávitský" # todo: NOT IN ENGLISH
 alawite_adherent: "Alávita" # todo: NOT IN ENGLISH
 alawite_adherent_plural: "Alávité" # todo: NOT IN ENGLISH
 alawite_desc: "Alávitské náboženské učení je tajné a Korán je pouze jedním z jeho posvátných textů. Vedle víry v následnictví imámů skrze Alího věří alávité také v převtělování a v to, že všechny bytosti byly původně hvězdami svrženými z nebes, které si musí opakovanými dobrými a zbožnými životy znovu zasloužit své místo." # todo: NOT IN ENGLISH
 alevi: "Alevitství" # todo: NOT IN ENGLISH
 alevi_adj: "Alevitský" # todo: NOT IN ENGLISH
 alevi_adherent: "Alevita" # todo: NOT IN ENGLISH
 alevi_adherent_plural: "Alevité" # todo: NOT IN ENGLISH
 alevi_desc: "Alevité věří v následnictví dvanácti imámů, ale řídí se také mnoha dalšími tradicemi zachycenými ve sbírce posvátných textů zvané Buyruky. Podle alevitské tradice je Bůh Pravdou a Mohamed s Alím jsou jeho projevy ve světě." # todo: NOT IN ENGLISH
 alevi_house_of_worship: "Cemevi" # todo: NOT IN ENGLISH
 alevi_house_of_worship_2: "$alevi_house_of_worship$" # todo: NOT IN ENGLISH
 alevi_house_of_worship_3: "$alevi_house_of_worship$" # todo: NOT IN ENGLISH
 alevi_house_of_worship_plural: "Cemevi" # todo: NOT IN ENGLISH
 alevi_religious_text: "Buyruky" # todo: NOT IN ENGLISH
 alevi_religious_text_2: "$alevi_religious_text$" # todo: NOT IN ENGLISH
 alevi_religious_text_3: "$alevi_religious_text$" # todo: NOT IN ENGLISH
 ibadi: "Ibádíja" # todo: NOT IN ENGLISH
 ibadi_adj: "Ibádíjský" # todo: NOT IN ENGLISH
 ibadi_adherent: "Ibádí" # todo: NOT IN ENGLISH
 ibadi_adherent_plural: "Ibádíové" # todo: NOT IN ENGLISH
 ibadi_desc: "Ibádíové nevěří, že musí být celý islám spravován chalífou nebo imámem, pokud neexistuje vhodný kandidát. Patří proto k muhakkimě a za důstojné vůdce nepovažují ani Alího linii, ani nástupce Abú Bakra." # todo: NOT IN ENGLISH
 azariqa: "Azrakismus" # todo: NOT IN ENGLISH
 azariqa_adj: "Azrakitský" # todo: NOT IN ENGLISH
 azariqa_adherent: "Azrakita" # todo: NOT IN ENGLISH
 azariqa_adherent_plural: "Azrakité" # todo: NOT IN ENGLISH
 azariqa_desc: "Azrakité neuznávají žádného důstojného Mohamedova nástupce a považují za své právo i povinnost bojovat proti každému vůdci, který nedodržuje zásady jejich víry. Jakákoli odlišnost ve výkladu víry podle nich člověka činí nevěřícím." # todo: NOT IN ENGLISH
 najdat: "Nadždátismus" # todo: NOT IN ENGLISH
 najdat_adj: "Nadždátský" # todo: NOT IN ENGLISH
 najdat_adherent: "Nadždáta" # todo: NOT IN ENGLISH
 najdat_adherent_plural: "Nadždátové" # todo: NOT IN ENGLISH
 najdat_desc: "Stoupenci nadždátské větve cháridžovců pevně věří, že muslimská vláda musí být ustavena shodou věřících. Vůdce není neomylný, ale Bůh jej vybírá prostřednictvím obce." # todo: NOT IN ENGLISH
 sufri: "Sufríja" # todo: NOT IN ENGLISH
 sufri_adj: "Sufríjský" # todo: NOT IN ENGLISH
 sufri_adherent: "Sufrí" # todo: NOT IN ENGLISH
 sufri_adherent_plural: "Sufríové" # todo: NOT IN ENGLISH
 sufri_desc: "Sufríové věří v božské vedení a vládu založenou na výkladu Božího slova, nikoli na dědičnosti. Boží vůle se projevuje skrze vůli ummy, pokud její lid dobře zná Korán." # todo: NOT IN ENGLISH
 hafizi: "Hafízíja" # todo: NOT IN ENGLISH
 hafizi_adj: "Hafízíjský" # todo: NOT IN ENGLISH
 hafizi_adherent: "Hafízí" # todo: NOT IN ENGLISH
 hafizi_adherent_plural: "Hafízíové" # todo: NOT IN ENGLISH
 hafizi_desc: "Hafízíové staví podporu toho, koho považují za pravého chalífu, nade vše ostatní a vzdorují každému pokusu sesadit jej nebo zbavit moci. V porážce je určuje vzpoura za spravedlivou věc a ve vítězství hrdá oddanost vůli jejich vůdce." # todo: NOT IN ENGLISH
