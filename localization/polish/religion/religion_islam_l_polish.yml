 sadr_al_islam: "Sadr al-islám"
 sadr_al_islam_adj: "Muslimský"
 sadr_al_islam_adherent: "Muslim"
 sadr_al_islam_adherent_plural: "Muslimové"
 sadr_al_islam_desc: "V jeho nejčistší podobě, ještě před vznikem jednotlivých myšlenkových škol, vedl muslimy sám Prorok prostřednictvím božského zjevení. Jeho sunnu následovali druhové a tábi'ún prvních několika generací."
 sunni: "Sunnismus"
 sunni_adj: "Sunnitský"
 sunni_adherent: "Sunnita"
 sunni_adherent_plural: "Sunnité"
 sunni_desc: "Sunnité jsou stoupenci Muhammadových zvyklostí, známých jako sunna. Sunnitská islámská právní věda se opírá především o Korán, hadísy a idžmá, tedy shodu učenců."
 shia: "Šíismus"
 shia_adj: "Šíitský"
 shia_adherent: "Šíita"
 shia_adherent_plural: "Šíité"
 shia_desc: "Větev islámu, podle níž má vedení zůstat v rodině proroka Muhammada a přecházet na božsky vedené imámy. Klade důraz na oddanost Prorokově rodině."
 islam_shia_priest: "Mulla"
 islam_shia_priest_plural: "Mullové"
 islam_shia_religious_head_title: "Imám"
 islam_shia_religious_head_title_name: "Imámát"
 kharijite: "Cháridža"
 kharijite_adj: "Cháridžovský"
 kharijite_adherent: "Cháridžovec"
 kharijite_adherent_plural: "Cháridžovci"
 kharijite_desc: "Rané islámské hnutí, které věřilo, že vedení má vycházet ze zbožnosti, nikoli z původu, a že hříšné vládce lze sesadit. Vzniklo za nepokojů spojených se šíity, odmítlo obě strany a prohlásilo těžké hříšníky za lidi stojící mimo islám."
 masmudi: "Almohadismus"
 masmudi_adj: "Almohadský"
 masmudi_adherent: "Almohad"
 masmudi_adherent_plural: "Almohadové"
 masmudi_desc: "Almohadské hnutí, reformní větev sunnitského islámu, vzniklo mezi berberskými kmeny severní Afriky. Jeho stoupenci se považovali za zastánce Boží jednoty a hlásali učení očištěného monoteismu."
 masmudi_religious_head_title: "Chalífa"
 masmudi_religious_head_title_name: "Chalífát"
 quranist: "Koránismus"
 quranist_adj: "Koránistický"
 quranist_adherent: "Koránista"
 quranist_adherent_plural: "Koránisté"
 quranist_desc: "Doslovný výklad islámu, který zdůrazňuje, že Korán je jediným zdrojem božské moudrosti a musí být dodržován do posledního písmene bez ohledu na hadísy a fatvy."
 druze: "Drúzství"
 druze_adj: "Drúzský"
 druze_adherent: "Drúz"
 druze_adherent_plural: "Drúzové"
 druze_desc: "Drúzská víra pocházející z Drúzské hory se řídí mnoha zásadami ismá'ílíje, zároveň však zahrnuje gnostické nauky v rámci esoterické teologie soustředěné na pravdu bytí."
 druze_religious_text: "Listy moudrosti"
 druze_religious_text_2: "$druze_religious_text$"
 druze_religious_text_3: "$druze_religious_text$"
 ashari: "Aš'arismus" # todo: NOT IN ENGLISH
 ashari_adj: "Aš'aritský" # todo: NOT IN ENGLISH
 ashari_adherent: "Aš'arita" # todo: NOT IN ENGLISH
 ashari_adherent_plural: "Aš'arité" # todo: NOT IN ENGLISH
 ashari_desc: "Ortodoxní teologická škola, podle níž Alláh stvořil každý okamžik času, lidé však mají svobodnou vůli volit mezi dobrem – tím, co Bůh přikázal – a zlem – tím, co Bůh zakázal." # todo: NOT IN ENGLISH
 muwalladi: "Muladíjství" # todo: NOT IN ENGLISH
 muwalladi_adj: "Muladíjský" # todo: NOT IN ENGLISH
 muwalladi_adherent: "Muladí" # todo: NOT IN ENGLISH
 muwalladi_adherent_plural: "Muladíové" # todo: NOT IN ENGLISH
 muwalladi_desc: "Pyrenejští muslimové, vzdálení od středu arabského světa, se přizpůsobili skutečnosti, že vládnou oblasti s početným křesťanským a židovským obyvatelstvem, jehož tradice jim připadaly podivné a cizí." # todo: NOT IN ENGLISH
 mutazila: "Mu'tazila" # todo: NOT IN ENGLISH
 mutazila_adj: "Mu'tazilský" # todo: NOT IN ENGLISH
 mutazila_adherent: "Mu'tazilita" # todo: NOT IN ENGLISH
 mutazila_adherent_plural: "Mu'tazilité" # todo: NOT IN ENGLISH
 mutazila_desc: "Racionalistická teologická škola, podle níž Korán #EMP není#! věčný a souvěčný s Bohem, neboť Bůh musel předcházet vlastnímu slovu." # todo: NOT IN ENGLISH
 maturidi: "Maturidismus" # todo: NOT IN ENGLISH
 maturidi_adj: "Maturidovský" # todo: NOT IN ENGLISH
 maturidi_adherent: "Maturidita" # todo: NOT IN ENGLISH
 maturidi_adherent_plural: "Maturidité" # todo: NOT IN ENGLISH
 maturidi_desc: "Racionalistická teologie, podle níž má etika objektivní existenci odvozenou z věčných Božích vlastností, a lidé proto musí usilovat o mravné jednání." # todo: NOT IN ENGLISH
 ismaili: "Ismá'ílíja"
 ismaili_adj: "Ismá'ílitský"
 ismaili_adherent: "Ismá'ílita"
 ismaili_adherent_plural: "Ismá'ílité"
 ismaili_desc: "Šíitský ritus, který odvozuje posloupnost pravých imámů, obdařených božským poznáním a neomylností, od Ismá'íla ibn Dža'fara. Jeho stoupenci jsou také známí jako sedmíci, protože Ismá'íl byl sedmým imámem po Muhammadovi."
 qarmatian: "Karmatské učení"
 qarmatian_adj: "Karmatský"
 qarmatian_adherent: "Karmat"
 qarmatian_adherent_plural: "Karmaté"
 qarmatian_desc: "Větev ismá'ílíje, která přijala prvky zoroastrismu. Bůh předurčil počet imámů na sedm, a proto nemohou přijít další, dokud se sedmý imám, Muhammad ibn Ismá'íl, nevrátí, aby vedl věřící."
 nizari: "Nizáríja"
 nizari_adj: "Nizárský"
 nizari_adherent: "Nizárita"
 nizari_adherent_plural: "Nizárité"
 nizari_desc: "Racionalistický ritus, který klade důraz na rozumové usuzování při výkladu Koránu a hadísů. Úřad imáma je dědičný a posloupnost se odvozuje od Alího."
 zayidi: "Zajdíja"
 zayidi_adj: "Zajdovský"
 zayidi_adherent: "Zajdovec"
 zayidi_adherent_plural: "Zajdovci"
 zayidi_desc: "Pravý imám není neomylný, nýbrž se vyznačuje bojem proti zkaženosti a zlu. Zajdovce proto spojuje víra, že Zajd ibn Alí byl právoplatným nástupcem v imámátu díky své vzpouře proti Umajjovcům."
 imami: "Imámíja"
 imami_adj: "Imámovský"
 imami_adherent: "Imámovec"
 imami_adherent_plural: "Imámovci"
 imami_desc: "Imámovci věří, že podle proroctví má ummu vést dvanáct imámů a že dvanáctý z nich, imám Zamán, čeká na svůj návrat, aby přivedl muslimy ke dni posledního soudu."
 islam_ayatollah: "ajatolláh"
 islam_ayatollah_plural: "ajatolláhové"
 ghulat: "Ichtiláfismus"
 ghulat_adj: "Ichtiláfský"
 ghulat_adherent: "Stoupenec ichtiláfismu"
 ghulat_adherent_plural: "Stoupenci ichtiláfismu"
 ghulat_desc: "Stoupenci ichtiláfismu věří v božskou přirozenost neomylných imámů, počínaje Alím. Bůh je nejen ustanovil a inspiroval, ale také v nich částečně přebývá, aby vedl jejich činy, a jejich prostřednictvím i celou ummu."
 alawite: "Alavitské učení"
 alawite_adj: "Alavitský"
 alawite_adherent: "Alavita"
 alawite_adherent_plural: "Alavité"
 alawite_desc: "Alavitské náboženské učení je tajné a Korán je pouze jedním z jeho posvátných textů. Vedle víry v posloupnost imámů od Alího věří alavité také v reinkarnaci a v to, že všechny bytosti byly hvězdami svrženými z nebe, které si nyní musejí znovu zasloužit své místo řadou dobrých a zbožných životů."
 alevi: "Alevitské učení"
 alevi_adj: "Alevitský"
 alevi_adherent: "Alevita"
 alevi_adherent_plural: "Alevité"
 alevi_desc: "Alevité věří v posloupnost dvanácti imámů, ale řídí se také mnoha dalšími tradicemi popsanými ve své sbírce posvátných textů, bujrucích. V alevitské tradici je Bůh Pravdou a Muhammad i Alí jsou jeho projevy ve světě."
 alevi_house_of_worship: "cemevi"
 alevi_house_of_worship_2: "$alevi_house_of_worship$"
 alevi_house_of_worship_3: "$alevi_house_of_worship$"
 alevi_house_of_worship_plural: "cemevi"
 alevi_religious_text: "bujruky"
 alevi_religious_text_2: "$alevi_religious_text$"
 alevi_religious_text_3: "$alevi_religious_text$"
 ibadi: "Muhakkima"
 ibadi_adj: "Muhakkimský"
 ibadi_adherent: "Stoupenec muhakkimy"
 ibadi_adherent_plural: "Stoupenci muhakkimy"
 ibadi_desc: "Stoupenci muhakkimy věří, že islámská obec nepotřebuje chalífu ani imáma, pokud neexistuje vhodný kandidát. Odmítají představu, že posloupnost nástupců Alího a Abú Bakra sama o sobě zaručuje jejich způsobilost k vedení, a kladou důraz na spravedlivé jednání a shodu obce."
 azariqa: "Azrakíja"
 azariqa_adj: "Azrakovský"
 azariqa_adherent: "Azrakovec"
 azariqa_adherent_plural: "Azrakovci"
 azariqa_desc: "Azrakovci neuznávají žádného způsobilého Muhammadova nástupce a považují za své právo i povinnost bojovat proti každému vůdci, který nedodržuje hodnoty jejich víry. Jakýkoli rozdíl ve výkladu víry podle nich stačí k označení člověka za nevěřícího."
 najdat: "Nadždát"
 najdat_adj: "Nadždátský"
 najdat_adherent: "Stoupenec nadždátu"
 najdat_adherent_plural: "Stoupenci nadždátu"
 najdat_desc: "Stoupenci nadždátské větve cháridži pevně věří, že muslimské vedení má být ustaveno shodou věřících. Vůdce není neomylný, ale Bůh jej vybírá prostřednictvím společenství."
 sufri: "Sufríja"
 sufri_adj: "Sufríský"
 sufri_adherent: "Sufríjec"
 sufri_adherent_plural: "Sufríjci"
 sufri_desc: "Sufríjci věří v božské vedení prostřednictvím výkladu Božího slova, nikoli dědičnosti. Boží vůle se projevuje jako vůle ummy, pokud se její členové dobře vyznají v Koránu."
 hafizi: "Háfizíja"
 hafizi_adj: "Háfizovský"
 hafizi_adherent: "Háfizovec"
 hafizi_adherent_plural: "Háfizovci"
 hafizi_desc: "Háfizovci nade vše staví podporu toho, koho považují za pravého chalífu, a odpor proti všem pokusům o jeho sesazení či svržení. V porážce je spojuje vzpoura za spravedlivou věc a ve vítězství hrdá oddanost vůli svého vůdce."
