 islam_shia_priest_plural: "Mullové"
 islam_shia_religious_head_title: "Imám"
 islam_shia_religious_head_title_name: "Imámát"
 ashari: "Aš'arismus"
 ashari_adj: "Aš'aritský"
 ashari_adherent: "Aš'arita"
 ashari_adherent_plural: "Aš'arité"
 ashari_desc: "Ortodoxní teologická škola, podle níž Alláh stvořil každý okamžik času, lidé však mají svobodnou vůli volit mezi dobrem – tím, co Bůh přikázal – a zlem – tím, co Bůh zakázal."
 muwalladi: "Muladíjství"
 muwalladi_adj: "Muladíjský"
 muwalladi_adherent: "Muladí"
 muwalladi_adherent_plural: "Muladíové"
 muwalladi_desc: "Pyrenejští muslimové, vzdálení od středu arabského světa, se přizpůsobili skutečnosti, že vládnou oblasti s početným křesťanským a židovským obyvatelstvem, jehož tradice jim připadaly podivné a cizí."
 masmudi: "Almohadismus"
 masmudi_adj: "Almohadský"
 masmudi_adherent: "Almohad"
 masmudi_adherent_plural: "Almohadové"
 masmudi_desc: "Almohadské hnutí, reformní větev sunnitského islámu, vzniklo mezi berberskými kmeny severní Afriky. Jeho stoupenci se považovali za zastánce Boží jednoty a hlásali učení očištěného monoteismu."
 masmudi_religious_head_title: "Chalífa"
 masmudi_religious_head_title_name: "Chalífát"
 mutazila: "Mu'tazila"
 mutazila_adj: "Mu'tazilský"
 mutazila_adherent: "Mu'tazilita"
 mutazila_adherent_plural: "Mu'tazilité"
 mutazila_desc: "Racionalistická teologická škola, podle níž Korán #EMP není#! věčný a souvěčný s Bohem, neboť Bůh musel předcházet vlastnímu slovu."
 maturidi: "Maturidismus"
 maturidi_adj: "Maturidovský"
 maturidi_adherent: "Maturidita"
 maturidi_adherent_plural: "Maturidité"
 maturidi_desc: "Racionalistická teologie, podle níž má etika objektivní existenci odvozenou z věčných Božích vlastností, a lidé proto musí usilovat o mravné jednání."
 quranist: "Koránismus"
 quranist_adj: "Koránistický"
 quranist_adherent: "Koránista"
 quranist_adherent_plural: "Koránisté"
 quranist_desc: "Doslovný výklad islámu, který zdůrazňuje, že Korán je jediným zdrojem božské moudrosti a musí být dodržován do posledního písmene bez ohledu na hadísy a fatvy."
 ismaili: "Ismá'ílíja"
 ismaili_adj: "Ismá'ílíjský"
 ismaili_adherent: "Ismá'ílita"
 ismaili_adherent_plural: "Ismá'ílité"
 ismaili_desc: "Ší'itská víra, podle níž linie pravých imámů – obdařených božským poznáním a neomylností – pokračuje skrze Ismá'íla ibn Dža'fara. Její stoupenci jsou rovněž známi jako Sedmíci, neboť Ismá'íl byl sedmým imámem po Mohamedovi."
 qarmatian: "Karmatství"
 qarmatian_adj: "Karmatský"
 qarmatian_adherent: "Karmat"
 qarmatian_adherent_plural: "Karmaté"
 qarmatian_desc: "Větev ismá'ílíje, která přijala prvky zoroastrismu. Bůh předurčil počet imámů na sedm, a proto se před návratem sedmého imáma Mohameda ibn Ismá'íla, jenž má opět vést věřící, nemohl objevit žádný další imám."
 nizari: "Nizáríja"
 nizari_adj: "Nizárijský"
 nizari_adherent: "Nizárijec"
 nizari_adherent_plural: "Nizárijci"
 nizari_desc: "Racionalistická víra, která při výkladu Koránu a hadísů zdůrazňuje rozumové uvažování. Úřad imáma je dědičný a jeho nástupnickou linii odvozuje od Alího."
 zayidi: "Zajdíja"
 zayidi_adj: "Zajdíjský"
 zayidi_adherent: "Zajdíjec"
 zayidi_adherent_plural: "Zajdíjci"
 zayidi_desc: "Pravý imám není neomylný, ale prokazuje se bojem proti zkaženosti a zlu. Zajdíjci proto věří, že Zajd ibn Alí byl díky svému povstání proti Umajjovcům právoplatným nástupcem imámátu."
 imami: "Isná ašaríja"
 imami_adj: "Dvanáctnický"
 imami_adherent: "Dvanáctník"
 imami_adherent_plural: "Dvanáctníci"
 imami_desc: "Dvanáctníci věří, že bylo předpovězeno dvanáct imámů, kteří povedou ummu, a že dvanáctý imám, imám Zamán, čeká na svůj návrat, aby přivedl muslimy ke dni posledního soudu."
 islam_ayatollah: "Ajatolláh"
 islam_ayatollah_plural: "Ajatolláhové"
 ghulat: "Ichtiláfismus"
 ghulat_adj: "Ichtiláfijský"
 ghulat_adherent: "Ichtiláfita"
 ghulat_adherent_plural: "Ichtiláfité"
 ghulat_desc: "Ichtiláfité věří v božskou podstatu neomylných imámů počínaje Alím. Bůh je nejen ustanovil a obdařil vnuknutím, ale také v nich částečně přebývá, aby vedl jejich činy, a jejich prostřednictvím i celou ummu."
 alawite: "Alávitství"
 alawite_adj: "Alávitský"
 alawite_adherent: "Alávita"
 alawite_adherent_plural: "Alávité"
 alawite_desc: "Alávitské náboženské učení je tajné a Korán je pouze jedním z jeho posvátných textů. Vedle víry v následnictví imámů skrze Alího věří alávité také v převtělování a v to, že všechny bytosti byly původně hvězdami svrženými z nebes, které si musí opakovanými dobrými a zbožnými životy znovu zasloužit své místo."
 alevi: "Alevitství"
 alevi_adj: "Alevitský"
 alevi_adherent: "Alevita"
 alevi_adherent_plural: "Alevité"
 alevi_desc: "Alevité věří v následnictví dvanácti imámů, ale řídí se také mnoha dalšími tradicemi zachycenými ve sbírce posvátných textů zvané Buyruky. Podle alevitské tradice je Bůh Pravdou a Mohamed s Alím jsou jeho projevy ve světě."
 alevi_house_of_worship: "Cemevi"
 alevi_house_of_worship_2: "$alevi_house_of_worship$"
 alevi_house_of_worship_3: "$alevi_house_of_worship$"
 alevi_house_of_worship_plural: "Cemevi"
 alevi_religious_text: "Buyruky"
 alevi_religious_text_2: "$alevi_religious_text$"
 alevi_religious_text_3: "$alevi_religious_text$"
 druze: "Drúzství"
 druze_adj: "Drúzský"
 druze_adherent: "Drúz"
 druze_adherent_plural: "Drúzové"
 druze_desc: "Drúzská víra pocházející z Drúzské hory se řídí mnoha zásadami ismá'ílíje, zároveň však zahrnuje gnostické nauky v rámci esoterické teologie soustředěné na pravdu bytí."
 druze_religious_text: "Listy moudrosti"
 druze_religious_text_2: "$druze_religious_text$"
 druze_religious_text_3: "$druze_religious_text$"
 ibadi: "Ibádíja"
 ibadi_adj: "Ibádíjský"
 ibadi_adherent: "Ibádí"
 ibadi_adherent_plural: "Ibádíové"
 ibadi_desc: "Ibádíové nevěří, že musí být celý islám spravován chalífou nebo imámem, pokud neexistuje vhodný kandidát. Patří proto k muhakkimě a za důstojné vůdce nepovažují ani Alího linii, ani nástupce Abú Bakra."
 azariqa: "Azrakismus"
 azariqa_adj: "Azrakitský"
 azariqa_adherent: "Azrakita"
 azariqa_adherent_plural: "Azrakité"
 azariqa_desc: "Azrakité neuznávají žádného důstojného Mohamedova nástupce a považují za své právo i povinnost bojovat proti každému vůdci, který nedodržuje zásady jejich víry. Jakákoli odlišnost ve výkladu víry podle nich člověka činí nevěřícím."
 najdat: "Nadždátismus"
 najdat_adj: "Nadždátský"
 najdat_adherent: "Nadždáta"
 najdat_adherent_plural: "Nadždátové"
 najdat_desc: "Stoupenci nadždátské větve cháridžovců pevně věří, že muslimská vláda musí být ustavena shodou věřících. Vůdce není neomylný, ale Bůh jej vybírá prostřednictvím obce."
 sufri: "Sufríja"
 sufri_adj: "Sufríjský"
 sufri_adherent: "Sufrí"
 sufri_adherent_plural: "Sufríové"
 sufri_desc: "Sufríové věří v božské vedení a vládu založenou na výkladu Božího slova, nikoli na dědičnosti. Boží vůle se projevuje skrze vůli ummy, pokud její lid dobře zná Korán."
 hafizi: "Hafízíja"
 hafizi_adj: "Hafízíjský"
 hafizi_adherent: "Hafízí"
 hafizi_adherent_plural: "Hafízíové"
 hafizi_desc: "Hafízíové staví podporu toho, koho považují za pravého chalífu, nade vše ostatní a vzdorují každému pokusu sesadit jej nebo zbavit moci. V porážce je určuje vzpoura za spravedlivou věc a ve vítězství hrdá oddanost vůli jejich vůdce."
