 sadr_al_islam_adj: "Muslimský"
 sadr_al_islam_adherent: "Muslim"
 sadr_al_islam_adherent_plural: "Muslimové"
 sadr_al_islam_desc: "V jeho nejčistší podobě, ještě před vznikem jednotlivých myšlenkových škol, vedl muslimy sám Prorok prostřednictvím božského zjevení. Jeho sunnu následovali druhové a tábi'ún prvních několika generací."
 sunni: "Sunnismus"
 sunni_adj: "Sunnitský"
 sunni_adherent: "Sunnita"
 sunni_adherent_plural: "Sunnité"
 sunni_desc: "Sunnité jsou stoupenci Muhammadových zvyklostí, známých jako sunna. Sunnitská islámská právní věda se opírá především o Korán, hadísy a idžmá, tedy shodu učenců."
 shia: "Šíismus"
 shia_adj: "Šíitský"
 shia_adherent: "Šíita"
 shia_adherent_plural: "Šíité"
 shia_desc: "Větev islámu, podle níž má vedení zůstat v rodině proroka Muhammada a přecházet na božsky vedené imámy. Klade důraz na oddanost Prorokově rodině."
 islam_shia_priest: "Mulla"
 islam_shia_priest_plural: "Mullové"
 islam_shia_religious_head_title: "Imám"
 islam_shia_religious_head_title_name: "Imámát"
 kharijite: "Cháridža"
 kharijite_adj: "Cháridžovský"
 kharijite_adherent: "Cháridžovec"
 kharijite_adherent_plural: "Cháridžovci"
 kharijite_desc: "Rané islámské hnutí, které věřilo, že vedení má vycházet ze zbožnosti, nikoli z původu, a že hříšné vládce lze sesadit. Vzniklo za nepokojů spojených se šíity, odmítlo obě strany a prohlásilo těžké hříšníky za lidi stojící mimo islám."
 masmudi: "Almohadismus"
 masmudi_adj: "Almohadský"
 masmudi_adherent: "Almohad"
 masmudi_adherent_plural: "Almohadové"
 masmudi_desc: "Almohadské hnutí, reformní větev sunnitského islámu, vzniklo mezi berberskými kmeny severní Afriky. Jeho stoupenci se považovali za zastánce Boží jednoty a hlásali učení očištěného monoteismu."
 masmudi_religious_head_title: "Chalífa"
 masmudi_religious_head_title_name: "Chalífát"
 quranist: "Koránismus"
 quranist_adj: "Koránistický"
 quranist_adherent: "Koránista"
 quranist_adherent_plural: "Koránisté"
 quranist_desc: "Doslovný výklad islámu, který zdůrazňuje, že Korán je jediným zdrojem božské moudrosti a musí být dodržován do posledního písmene bez ohledu na hadísy a fatvy."
 druze: "Drúzství"
 druze_adj: "Drúzský"
 druze_adherent: "Drúz"
 druze_adherent_plural: "Drúzové"
 druze_desc: "Drúzská víra pocházející z Drúzské hory se řídí mnoha zásadami ismá'ílíje, zároveň však zahrnuje gnostické nauky v rámci esoterické teologie soustředěné na pravdu bytí."
 druze_religious_text: "Listy moudrosti"
 druze_religious_text_2: "$druze_religious_text$"
 druze_religious_text_3: "$druze_religious_text$"
