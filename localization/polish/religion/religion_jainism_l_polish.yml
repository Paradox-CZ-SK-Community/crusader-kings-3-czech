 digambara: "Digambara"
 digambara_adj: "Digambarský"
 digambara_adherent: "Digambara"
 digambara_adherent_plural: "Digambarové"
 digambara_desc: "Kévala džňána osvobozuje tělo od všech tělesných potřeb. Duše však může být osvobozena pouze v naprosté nahotě, a digambarští mniši proto musí žít bez oděvu."
 svetambara: "Švétámbara"
 svetambara_adj: "Švétámbarský"
 svetambara_adherent: "Švétámbara"
 svetambara_adherent_plural: "Švétámbarové"
 svetambara_desc: "Kévala džňána je stavem duše, nikoli tělesné schránky. Řádným životem lze dosáhnout vševědoucnosti a opustit nekonečný koloběh. Samotné mókši je však možné dosáhnout teprve smrtí, kdy se člověk stává siddhou."
