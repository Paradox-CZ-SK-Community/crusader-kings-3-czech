 yapaniya: "Jápaníja"
 yapaniya_adj: "Jápaníjský"
 yapaniya_adherent: "Jápaníja"
 yapaniya_adherent_plural: "Jápaníjové"
 yapaniya_desc: "Víra jápaníjských džinistů se v některých ohledech podobá švétámbarské i digambarské tradici, čímž dráždí stoupence obou směrů. Od jápaníjských žebravých mnichů se stejně jako od digambarských očekává nahota, nedodržují však jejich přísná pravidla. Tato víra rovněž učí, že ženy mohou dosáhnout mókši, a řeholnice jsou v ní běžné."
