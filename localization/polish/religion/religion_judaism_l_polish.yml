 rabbinism: "Rabínský judaismus"
 rabbinism_adj: "Rabínský"
 rabbinism_adherent: "Rabínský Žid"
 rabbinism_adherent_plural: "Rabínští Židé"
 rabbinism_desc: "Rabínský judaismus zdůrazňuje úlohu rabínů jako vykladačů náboženského práva zvaného halacha. Zákony a tradice zajišťují dodržování smlouvy s Pánem a rabíni tyto zákony střeží."
 karaism: "Karaitský judaismus"
 karaism_adj: "Karaitský"
 karaism_adherent: "Karaita"
 karaism_adherent_plural: "Karaité"
 karaism_desc: "V otázkách náboženského práva je jedinou nejvyšší a svrchovanou autoritou Tanach. Úlohou rabínů není pravidla smlouvy přehodnocovat a přizpůsobovat, nýbrž vykládat jejich doslovný význam."
 haymanot: "Hajmanot"
 haymanot_adj: "Hajmanotský"
 haymanot_adherent: "Vyznavač hajmanotu"
 haymanot_adherent_plural: "Vyznavači hajmanotu"
 haymanot_desc: "Rabíni neboli kahenové rozhodují v otázkách náboženského práva, spolupracují však s radou starších, která rozhoduje v otázkách tradic a každodenního života."
 haymanot_religious_text: "Orit"
 haymanot_religious_text_2: "$haymanot_religious_text$"
 haymanot_religious_text_3: "$haymanot_religious_text$"
 haymanot_religious_head_title: "Liqa kahnet"
 haymanot_devotee: "Monkosa"
 haymanot_devotee_plural: "Monkosové"
 haymanot_priest: "Kahen"
 haymanot_priest_plural: "Kahenové"
 haymanot_bishop: "Šmagle"
 haymanot_bishop_plural: "Šmagleové"
 malabarism: "Malabarský judaismus"
 malabarism_adj: "Malabarský"
 malabarism_adherent: "Malabarský Žid"
 malabarism_adherent_plural: "Malabarští Židé"
 malabarism_desc: "Když se potomci izraelských kmenů rozptýlili po světě, zakládali od západu k východu menší obce, které se samy staly svébytnými kmeny. Tito Židé, známí také jako kočínští Židé, nalezli nový domov v Kočínském království v jižní Indii, kde se mísili s místním obyvatelstvem a vzájemně si předávali své kultury."
 samaritan: "Samaritánství"
 samaritan_adj: "Samaritánský"
 samaritan_adherent: "Samaritán"
 samaritan_adherent_plural: "Samaritáni"
 samaritan_desc: "Samaritáni pocházejí z kmenů, které osídlily Samaří, a řídí se původní, nezměněnou podobou Tóry. Tím zachovávají pravé Mojžíšovo náboženství a plní povinnosti uložené přímo Bohem."
 kabarism: "Chazarský judaismus"
 kabarism_adj: "Chazarský"
 kabarism_adherent: "Chazarský Žid"
 kabarism_adherent_plural: "Chazarští Židé"
 kabarism_desc: "Chazarští Židé jsou obcí konvertitů, která se řídí běžným rabínským výkladem halachy. I dlouho po přijetí judaismu nadále s náboženskou úctou zachovávají některé místní víry a tradice."
 merkabah: "Merkava"
 merkabah_adj: "Merkavský"
 merkabah_adherent: "Merkavista"
 merkabah_adherent_plural: "Merkavisté"
 merkabah_desc: "Merkavská mystika je směr židovské mystiky částečně ovlivněný gnostickým učením. Tato víra se soustředí na vidění a její stoupenci přijímají asketický způsob života, aby mohli stanout u Božího trůnu."
 doctrine_temple_authority_name: "Autorita halachy"
 doctrine_temple_authority_desc: "Halacha je souborem zákonů a pravidel, podle nichž má Žid vést svůj život. Po staletích diaspory se židovské obce rozdělily do četných myšlenkových škol, které se liší v názoru na správný výklad halachy."
 temple_authority_rabbinic_doctrine_name: "Rabínská"
 temple_authority_rabbinic_doctrine_desc: "Rabínští Židé věří, že halachu mohou vykládat pouze rabíni. Uznávají psanou i ústní Tóru, předávanou prostřednictvím rabínů. Veškerá rabínská nauka je kodifikována v Babylónském talmudu, který je pokládán za hlavní pramen pro výklad a uplatňování halachy."
 temple_authority_toric_doctrine_name: "Tórická"
 temple_authority_toric_doctrine_desc: "Tórický judaismus odmítá Talmud a ústní Tóru a přiznává autoritu pouze psané Tóře. Rabíni nesmějí halachu měnit ani přizpůsobovat a jejich jedinou povinností je vykládat doslovný význam Tóry."
 temple_authority_kohanim_doctrine_name: "Kohenská"
 temple_authority_kohanim_doctrine_desc: "Kohenský judaismus tvrdí, že kohenové jsou nejvyšší autoritou ve všech náboženských otázkách včetně halachy. Každý kohen musí po otcovské linii pocházet z rodu Árona, Mojžíšova bratra."
 temple_authority_samaritan_torah_doctrine_name: "Samaritánská"
 temple_authority_samaritan_torah_doctrine_desc: "Samaritáni odmítají autoritu židovské Tóry a namísto ní přiznávají nejvyšší autoritu Samaritánské Tóře. Kvůli tomuto odmítnutí jsou ostatními souvěrci všeobecně považováni za kacíře."
