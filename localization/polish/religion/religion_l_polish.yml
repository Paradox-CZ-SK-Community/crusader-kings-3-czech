 doctrine_pilgrimage_local_rites_name: "Místní obřady"
 doctrine_pilgrimage_local_rites_desc: "Vyznavači této víry dávají před nebezpečím a námahou dlouhých poutí přednost pohodlí a stálosti pravidelných obřadů v místních svatyních."
