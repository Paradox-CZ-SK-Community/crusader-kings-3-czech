 doctrine_pilgrimage_forbidden_name: "Zakázané"
 doctrine_pilgrimage_forbidden_desc: "Přítomnost [ROOT.Faith.HighGodName] lze pocítit všude a představa, že některá místa jsou božštější než jiná, není ničím menším než kacířstvím."
 doctrine_pilgrimage_encouraged_name: "Podporované"
 doctrine_pilgrimage_encouraged_desc: "Tato víra vybízí své členy, aby navštěvovali pozemská místa považovaná za duchovně významná a projevovali tak úctu k [ROOT.Faith.PantheonTerm]."
 doctrine_pilgrimage_mandatory_name: "Povinné"
 doctrine_pilgrimage_mandatory_desc: "Od všech tělesně způsobilých [ROOT.Faith.GetAdherentNamePlural] se očekává, že vykonají duchovní cestu na svaté místo, jakmile toho budou schopni. Nesplnění této povinnosti znamená odmítnutí podřídit se [ROOT.Faith.HighGodName]."
 doctrine_pilgrimage_mandatory_hajj_name: "Hadždž"
 doctrine_pilgrimage_mandatory_hajj_desc: "Od všech tělesně způsobilých muslimů se očekává, že během svého života vykonají hadždž do Mekky. Ačkoli jsou často udělovány zvláštní výjimky, na každého [ROOT.Faith.GetAdherentNameNoTooltip], který hadždž nevykoná, bude pohlíženo s nedůvěrou."
 forbidden_from_pilgrimage_name: "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_forbidden_name$"
 doctrine_parameter_forbidden_from_pilgrimage: "Nemá přístup k [Concept('activity','aktivitě')|E] [Concept('pilgrimage','Pouť')|E][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_pilgrimage_warning')]"
 doctrine_parameter_can_go_on_pilgrimage: "Má přístup k [Concept('activity','aktivitě')|E] [Concept('pilgrimage','Pouť')|E]"
 mandatory_pilgrimage_name: "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
 doctrine_parameter_mandatory_pilgrimage: "[Concept('trait','Rys')|E] [GetTrait('pilgrim').GetName( GetNullCharacter )] poskytuje další bonusy a dokončení [Concept('activity','aktivity')|E] [Concept('pilgrimage','Pouť')|E] přináší dodatečnou [Concept('piety','zbožnost')|E]"
 mandatory_hajj_name: "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
 doctrine_parameter_mandatory_hajj: "[Concept('trait','Rys')|E] [GetTrait('hajjaj').GetName( GetNullCharacter )] poskytuje další bonusy a dokončení [Concept('activity','aktivity')|E] [Concept('hajj','Hadždž')|E] přináší dodatečnou [Concept('piety','zbožnost')|E]"
 doctrine_parameter_basic_pilgrimage_rewards: ""
 mandala_pilgrimage_warning: "\n@alert_icon! #alert_trial Konverze k $forbidden_from_pilgrimage_name$ [Concept('faith','víře')|E] ti znemožní postupovat jako [Concept('ruler','vládce')|E] s [Concept('mandala_government','mandalovým zřízením')|E]#!\n"
 special_doctrine_has_jizya_doctrine_name: "$tenet_tax_nonbelievers_jizya_name$"
 special_doctrine_jizya_name: "$tenet_tax_nonbelievers_jizya_name$"
 special_doctrine_jizya_desc: "$tenet_tax_nonbelievers_desc$"
 has_jizya_doctrine_name: "$tenet_tax_nonbelievers_jizya_name$"
 doctrine_funeral_name: "Pohřební tradice"
 doctrine_funeral_stoic_name: "Stoický pohřeb"
 doctrine_funeral_stoic_desc: "Tělo zemřelo, duše však žije dál. Smrt není časem zármutku a nářku. Pohřeb má naopak uctít mrtvého tím, že je jeho tělo v tichém a skromném obřadu svěřeno zemi."
 doctrine_funeral_bewailment_name: "Pohřeb s nářkem"
 doctrine_funeral_bewailment_desc: "Duše započala svou dlouhou cestu do [ROOT.Faith.PositiveAfterLife] a ve světě živých ji již nikdy neuvidíme. Všichni, kdo zemřelého znali, se musí shromáždit a veřejným nářkem projevit svůj zármutek. Tím uctí mrtvého a očistí své duše od žalu způsobeného jeho odchodem."
 doctrine_funeral_cremation_name: "Kremace"
 doctrine_funeral_cremation_desc: "Z popela jsme vzešli a v popel se navrátíme. Tělo zemřelého je spáleno na velké pohřební hranici a vzniklý popel je rozptýlen po zemi, aby mrtvý mohl pokračovat ve své cestě."
 doctrine_funeral_sky_burial_name: "$tenet_sky_burials_name$"
 doctrine_funeral_sky_burial_desc: "$tenet_sky_burials_desc$"
 doctrine_funeral_mummification_name: "Mumifikace"
 mummification_funeral_name: "Mumifikace"
 doctrine_funeral_mummification_desc: "Tělo přestalo fungovat, stále je však schránkou, v níž duch vykoná cestu do [ROOT.Faith.PositiveAfterLife]. Tělesná podoba proto musí zůstat stejně neměnná jako duše a očekávat soud [ROOT.Faith.FateGodName]."
 doctrine_family_rites_name: "Rodinné obřady"
 doctrine_family_rites_desc: "Smrt je pro živé obdobím smutku a obřadů. Hierarchie a pořadí podle věku jsou ve smrti stejně důležité jako za života. Starší je nutné ctít i po jejich odchodu a tuto úctu dávat náležitým způsobem veřejně najevo."
 doctrine_parameter_burial_funeral: ""
 doctrine_parameter_stoic_funeral: "Při [Concept('activity','aktivitě')|E] [Concept('funeral','Pohřeb')|E] je více příležitostí získat [Concept('piety','zbožnost')|E]"
 doctrine_parameter_bewailment_funeral: "Při [Concept('activity','aktivitě')|E] [Concept('funeral','Pohřeb')|E] je více příležitostí snížit [Concept('stress','stres')|E]"
 doctrine_parameter_cremation_funeral: "[Concept('activity','Aktivita')|E] [Concept('funeral','Pohřeb')|E] stojí výrazně méně [Concept('gold','zlata')|E]"
 doctrine_parameter_mummification_funeral: "[Concept('activity','Aktivita')|E] [Concept('funeral','Pohřeb')|E] stojí více [Concept('gold','zlata')|E] a na svém konci přináší mocné [Concept('artifacts','artefakty')|E]"
 doctrine_parameter_family_rites: "Při [Concept('activity','aktivitě')|E] [Concept('funeral','Pohřeb')|E] jsou příležitosti získat [Concept('merit','zásluhy')|E]"
