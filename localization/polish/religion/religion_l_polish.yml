 global_religion.1000.t: "Vyhnaní [local_character.GetFaith.GetAdherentNamePluralNoTooltip]"
 global_religion.1000.desc_same_faith_counties: "Více než [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] [local_character.GetFaith.GetAdherentNamePlural], vyhnaných z [target_faith_associated_county.GetName], si přeje vstoupit do mého panství. Jejich jménem přichází [local_character.GetFirstName] požádat o audienci: „Hledáme lepší a bezpečnější život, [ROOT.Char.GetTitleAsNameNoTooltip],“ [local_character.GetSheHe] říká. „Dovol nám usadit se v [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].“"
 global_religion.1000.desc_same_faith_counties_alt: "V [target_faith_associated_county.GetName] řádí náboženské pronásledování a [target_faith_associated_county_faith.GetAdjective] šlechta násilně obrací [local_character.GetFaith.GetAdherentNamePlural].\n\nNyní si více než [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] vyhnanců přeje vstoupit do mého panství. Jejich jménem přichází [local_character.GetFirstName] požádat o audienci: „Hledáme lepší a bezpečnější život, [ROOT.Char.GetTitleAsNameNoTooltip],“ [local_character.GetSheHe] říká. „Dovol nám usadit se v [ROOT.Char.GetPrimaryTitle.GetDefinitiveName].“"
 global_religion.1000.desc_any_counties: "V [target_faith_associated_county.GetName] řádí náboženské pronásledování a [target_faith_associated_county_faith.GetAdjective] šlechta násilně obrací [local_character.GetFaith.GetAdherentNamePlural].\n\nNyní si více než [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] vyhnanců přeje vstoupit do mého panství. Jejich jménem přichází [local_character.GetFirstName] požádat o audienci: „Hledáme lepší a bezpečnější život, [ROOT.Char.GetTitleAsNameNoTooltip],“ [local_character.GetSheHe] prosí. „Dovol nám usadit se v okolí [initial_county_target.GetNameNoTier].“\n\nPokud jim to dovolím, [local_character.GetFaith.GetAdjective] víra se rozšíří po [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.desc_any_counties_alt: "Více než [local_character.MakeScope.Var( 'loc_number' ).GetValue|0] [local_character.GetFaith.GetAdherentNamePlural], vyhnaných z [target_faith_associated_county.GetName], si přeje vstoupit do mého panství. Jejich jménem přichází [local_character.GetFirstName] požádat o audienci: „Hledáme lepší a bezpečnější život, [ROOT.Char.GetTitleAsNameNoTooltip],“ [local_character.GetSheHe] prosí. „Dovol nám usadit se v okolí [initial_county_target.GetNameNoTier].“\n\nPokud jim to dovolím, [local_character.GetFaith.GetAdjective] víra se rozšíří po [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 global_religion.1000.special: "Přijmu [local_character.GetFaith.GetAdjectiveNoTooltip] víru!"
