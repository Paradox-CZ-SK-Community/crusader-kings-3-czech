 special_doctrine_fire_worship_name: "Posvátný oheň"
 fire_worship_name: "$special_doctrine_fire_worship_name$"
 special_doctrine_fire_worship_desc: "Všechny nás spojuje úcta k ohni, nejčistšímu živlu a prostředku božské slávy. Naší posvátnou povinností je udržovat věčné ohně světa a jejich září zahánět lež a zlo."
 doctrine_parameter_same_hof_hostility_override: "Ostatní [Concept('faiths','víry')|E], které sdílejí stejnou [Concept('head_of_faith','hlavu víry')|E], považuje za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
