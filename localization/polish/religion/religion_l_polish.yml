 doctrine_homosexuality_name: "Vztahy osob stejného pohlaví"
 doctrine_homosexuality_crime_name: "Zločinné"
 doctrine_homosexuality_crime_desc: "Hříšné touhy sodomitů představují nebezpečí pro samotnou společnost, a proto budou za své provinění potrestáni a uvězněni."
 doctrine_homosexuality_shunned_name: "Zavrhované"
 doctrine_homosexuality_shunned_desc: "Je nepřirozené, aby spolu dva muži udržovali sexuální vztah, bez ohledu na okolnosti."
 doctrine_homosexuality_accepted_name: "Přijímané"
 doctrine_homosexuality_accepted_desc: "Láska překračuje tělesnost a stává se něčím natolik hlubokým a podivuhodným, že ji nelze omezovat pouhým pohlavím."
 doctrine_parameter_homosexuality_illegal: "Muži s [Concept('trait','rysem')|E] [GetTrait('sodomite').GetName( GetNullCharacter )] jsou považováni za [Concept('criminals','zločince')|E]"
 doctrine_parameter_homosexuality_shunned: "Muži s [Concept('trait','rysem')|E] [GetTrait('sodomite').GetName( GetNullCharacter )] jsou [Concept('shunned','zavrhováni')|E]"
 doctrine_parameter_homosexuality_accepted: "Vztahy osob stejného pohlaví jsou plně přijímány"
 doctrine_deviancy_name: "Deviace"
 doctrine_deviancy_crime_name: "Zločinná"
 doctrine_deviancy_crime_desc: "Je zřejmé, že existuje pouze jediný správný způsob, jak milovat druhého člověka. Jakékoli odchylky od této podoby jsou hříšné a měly by být trestány."
 doctrine_deviancy_shunned_name: "Zavrhovaná"
 doctrine_deviancy_shunned_desc: "Některé sexuální praktiky jsou jednoduše nepřirozené a podivné. Je proto pochopitelné, že lidé s takovými touhami jsou stejně nepřirození a podivní."
 doctrine_deviancy_accepted_name: "Přijímaná"
 doctrine_deviancy_accepted_desc: "Láska je krásná a posvátná bez ohledu na podobu, kterou nabývá. Každému by mělo být dovoleno milovat a jednat podle své vůle."
 doctrine_deviancy_virtuous_name: "Ctnostná"
 doctrine_deviancy_virtuous_desc: "Tělesné rozkoše nás přibližují božství, a proto jsou ti, kdo nejsou spoutáni běžnými touhami, v naší víře vrcholem ctnosti."
 doctrine_parameter_deviancy_illegal: "Postavy s [Concept('trait','rysem')|E] [GetTrait('deviant').GetName( GetPlayer )] jsou [Concept('criminals','zločinci')|E]"
 doctrine_parameter_deviancy_shunned: "Postavy s [Concept('trait','rysem')|E] [GetTrait('deviant').GetName( GetPlayer )] jsou [Concept('shunned','zavrhovány')|E]"
 doctrine_parameter_deviancy_accepted: "Postavy s [Concept('trait','rysem')|E] [GetTrait('deviant').GetName( GetPlayer )] jsou plně přijímány"
 doctrine_witchcraft_name: "Čarodějnictví"
 doctrine_witchcraft_crime_name: "Zločinné"
 doctrine_witchcraft_crime_desc: "Pouze božstva mají právo konat na tomto světě zázraky. Každý, kdo se rouhavě pokusí činit totéž, bude za svou pýchu a domýšlivost potrestán."
 doctrine_witchcraft_shunned_name: "Zavrhované"
 doctrine_witchcraft_shunned_desc: "Božstva mají právoplatnou moc nad nadpřirozenými silami tohoto světa, a proto je každý pokus přimět tyto síly, aby se podřídily vůli smrtelníka, ze své podstaty pomýlený."
 doctrine_witchcraft_accepted_name: "Přijímané"
 doctrine_witchcraft_accepted_desc: "Magie naplňuje svět kolem nás a je naším právem i výsadou zacházet s ní tak, jak to činili naši předkové."
 doctrine_witchcraft_virtuous_name: "Ctnostné"
 doctrine_witchcraft_virtuous_desc: "Provozovat čarodějnictví znamená vystavovat vlastní duši nebezpečí zlých duchů. Za odvahu, s níž vykonávají tuto nezbytnou službu při zachovávání čistoty našich duší, si čarodějnice zasluhují úctu."
 doctrine_parameter_witchcraft_illegal: "Postavy s [Concept('trait','rysem')|E] [GetTrait('witch').GetName( GetPlayer )] jsou [Concept('criminals','zločinci')|E]"
 doctrine_parameter_witchcraft_shunned: "Postavy s [Concept('trait','rysem')|E] [GetTrait('witch').GetName( GetPlayer )] jsou [Concept('shunned','zavrhovány')|E]"
 doctrine_parameter_witchcraft_accepted: "Postavy s [Concept('trait','rysem')|E] [GetTrait('witch').GetName( GetPlayer )] jsou plně přijímány"
 witchcraft_illegal_name: "Doktrína zločinného čarodějnictví"
 witchcraft_shunned_name: "Doktrína zavrhovaného čarodějnictví"
 doctrine_head_of_faith_name: "Hlava víry"
 doctrine_head_of_faith_desc: "[Concept('head_of_faith','Hlava víry')|E] je vůdcem [Concept('faith','víry')|E]"
 doctrine_no_head_name: "Žádná"
 doctrine_no_head_desc: "Je naprostým bláznovstvím domnívat se, že jediný člověk může skutečně pochopit vůli [ROOT.Faith.HighGodName]. Musíme následovat vlastní srdce, abychom odhalili [ROOT.Faith.HighGodHerHis] záměr s námi."
 doctrine_parameter_no_head_of_faith: "Nemá [Concept('head_of_faith','hlavu víry')|E]"
 no_head_of_faith_name: "[Concept('doctrine','Doktrína')|E] bez [Concept('head_of_faith','hlavy víry')|E]"
 doctrine_parameter_minimum_fervor: "[Concept('fervor','Horlivost')|E] nemůže klesnout pod #V $VALUE|0$%#!"
 doctrine_spiritual_head_name: "Duchovní"
 doctrine_spiritual_head_desc: "Hmotný a duchovní svět nejsou stejné. Musíme zajistit, aby měl duchovní svět vlastního vůdce, který nás bude vést a chránit naši víru před poskvrněním tělesnými touhami."
 doctrine_parameter_spiritual_head_of_faith: "Úřad [Concept('head_of_faith','hlavy víry')|E] připadá významnému členu duchovenstva"
 doctrine_parameter_spiritual_head_of_faith_claims: "[Concept('head_of_faith','Hlava víry')|E] může zbožným vyznavačům udělovat [Concept('claims','nároky')|E] na zeměpanské tituly"
 doctrine_parameter_spiritual_head_of_faith_gold: "[Concept('head_of_faith','Hlava víry')|E] může zbožným vyznavačům udělovat [Concept('gold','zlato')|E]"
 doctrine_temporal_head_name: "Světská"
 doctrine_parameter_temporal_head_of_faith: "Úřad [Concept('head_of_faith','hlavy víry')|E] připadá zakladateli [Concept('faith','víry')|E] a po jeho smrti přechází na jeho [Concept('primary_heir','hlavního dědice')|E]"
 doctrine_parameter_temporal_head_of_faith_directed_holy_wars: "Pokud má víra přístup k [Concept('great_holy_wars','velkým svatým válkám')|E], může hlava víry válku řídit a zvolit její cíl"
 doctrine_temporal_head_desc: "Duchovní a hmotné jsou neodmyslitelně propojené, tvoří jeden celek a nelze je oddělit. Je pošetilé mít pro jedno panství dva různé vůdce."
 doctrine_marriage_type_name: "Druh manželství"
 doctrine_monogamy_name: "Monogamní"
 doctrine_monogamy_desc: "Manželství je posvátným svazkem dvou lidí. Pokoušet se vytvořit takový svazek s více lidmi současně je svatokrádež."
 doctrine_polygamy_name: "Polygamní"
 doctrine_polygamy_desc: "Jelikož je manželství posvátným svazkem, je několik manželství očividně posvátnějších než jediné – pokud je ovšem každé z nich samo o sobě posvátné."
 doctrine_concubines_name: "Konkubíny"
 doctrine_concubines_desc: "Manželství je posvátným svazkem, avšak dokud má manželský protějšek přednost, může být člověku dovoleno udržovat vztahy také s konkubínami."
 hostility_group_name: "Skupina nepřátelství"
 abrahamic_hostility_doctrine_name: "Abrahámovská"
 abrahamic_hostility_doctrine_desc: "Následující náboženství jsou abrahámovská:\n[GetReligionFamily('rf_abrahamic').GetReligions]"
 pagan_hostility_doctrine_name: "Pohanská"
 pagan_hostility_doctrine_desc: "Následující náboženství jsou pohanská:\n[GetReligionFamily('rf_pagan').GetReligions]"
 eastern_hostility_doctrine_name: "Dharmická"
 eastern_hostility_doctrine_desc: "Následující náboženství jsou dharmická:\n[GetReligionFamily('rf_eastern').GetReligions]"
 sinitic_hostility_doctrine_name: "Sinitská"
 sinitic_hostility_doctrine_desc: "Následující náboženství jsou sinitská:\n[GetReligionFamily('rf_eastern').GetReligions]"
 special_tolerance_name: "Zvláštní tolerance"
 special_doctrine_ecumenical_christian_name: "Ekumenismus"
 special_doctrine_ecumenical_christian_desc: "Naši náboženští představitelé se v průběhu dějin účastnili mezináboženských dialogů, aby posílili spolupráci mezi různými křesťanskými vyznáními."
 special_doctrine_full_tolerance_name: "Úplná tolerance"
 full_tolerance_name: "$special_doctrine_full_tolerance_name$"
 doctrine_parameter_hostility_override_special_doctrine_full_tolerance: "Všechny [Concept('faiths','víry')|E] jsou považovány za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 special_doctrine_full_tolerance_desc: "Každý si může svobodně zvolit vlastní víru. Naše rozdíly nás nerozdělují, nýbrž posilují."
 nudity_doctrine_name: "Postoj k nahotě"
 special_doctrine_naked_priests_name: "Nazí kněží"
 special_doctrine_naked_priests_desc: "Naši kněží vědí, že oděv spoutává ducha a brání nám dosáhnout skutečného osvícení. Pouze odložením šatů můžeme probudit své duše a zakusit lásku [ROOT.Faith.HighGodNamePossessive]."
 doctrine_parameter_naked_priests_active: "Kněží a horlivé postavy nenosí oděv."
 doctrine_gender_name: "Postoj k pohlaví"
 doctrine_gender_male_dominated_name: "Nadvláda mužů"
 doctrine_gender_male_dominated_desc: "Muži jsou silnější a lépe vybavení k tomu, aby nás vedli v tomto drsném a nemilosrdném světě, a proto jim svěříme správu naší společnosti."
 doctrine_gender_equal_name: "Rovnost"
 doctrine_gender_equal_desc: "Je pošetilé upírat schopným lidem podíl na vládě pouze kvůli jejich pohlaví. Spravovat naši společnost dovolíme všem, kdo jsou toho schopni."
 doctrine_gender_female_dominated_name: "Nadvláda žen"
 doctrine_gender_female_dominated_desc: "Ženy znovu a znovu dokazují, že pouze ony mají moudrost a rozvážnost nezbytnou ke správnému řízení naší společnosti."
 doctrine_divorce_name: "Rozvod"
 doctrine_divorce_disallowed_name: "Zakázaný"
 doctrine_divorce_disallowed_desc: "Manželské sliby jsou konečné a závazné. Rozdělit nás může pouze smrt."
 doctrine_divorce_approval_name: "Vyžaduje schválení"
 doctrine_divorce_approval_desc: "Ačkoli by manželský svazek neměl být brán na lehkou váhu, mimořádné okolnosti mohou někdy učinit rozvod nezbytným."
 doctrine_divorce_allowed_name: "Vždy povolený"
 doctrine_divorce_allowed_desc: "Manželství je pouhým svazkem dvou lidí a stejně jako každý jiný svazek může být kdykoli ukončeno."
 doctrine_parameter_divorce_disallowed: "Postavy se nikdy nemohou [Concept('divorce','rozvést')|E] se svým [Concept('spouse','manželským protějškem')|E]"
 doctrine_parameter_divorce_approval: "Postavy se mohou [Concept('divorce','rozvést')|E] se svým [Concept('spouse','manželským protějškem')|E], pokud to schválí jejich duchovní [Concept('head_of_faith','hlava víry')|E], nebo [Concept('house_head','hlava rodu')|E], pokud duchovní hlava víry neexistuje"
 doctrine_parameter_divorce_allowed: "Postavy se mohou vždy [Concept('divorce','rozvést')|E] se svým [Concept('spouse','manželským protějškem')|E] za cenu [Concept('piety','zbožnosti')|E]"
 doctrine_bastardry_name: "Levobočství"
 doctrine_bastardry_none_name: "Žádní levobočci"
 doctrine_bastardry_none_desc: "Rodovou linii určuje krev, nikoli manželství. Děti narozené mimo manželství jsou stejně legitimní jako všechny ostatní."
 doctrine_bastardry_legitimization_name: "Legitimizace"
 doctrine_bastardry_legitimization_desc: "Manželství je posvátné, a proto musí být děti narozené mimo ně požehnány jiným způsobem, mají-li být považovány za legitimní."
 doctrine_bastardry_all_name: "Bez legitimizace"
 doctrine_bastardry_all_desc: "Manželský svazek je nedotknutelný a děti narozené mimo manželství budou vždy nelegitimní."
 doctrine_parameter_bastards_none: "Nic takového jako [Concept('bastard','levoboček')|E] neexistuje. Všechny děti jsou stejně [Concept('legitimate','legitimní')|E]"
 doctrine_parameter_bastards_legitimize: "[Concept('bastards','Levobočci')|E] mohou být legitimizováni se souhlasem své [Concept('house_head','hlavy rodu')|E] nebo [Concept('dynast','hlavy dynastie')|E]"
 doctrine_parameter_bastards_always: "[Concept('bastards','Levobočci')|E] nemohou být nikdy legitimizováni"
 doctrine_adultery_men_name: "Nevěra mužů"
 doctrine_adultery_men_crime_name: "Zločinná"
 doctrine_adultery_men_crime_desc: "Pohlavní styk mužů mimo manželství je zločinem a provinilci budou náležitě potrestáni."
 doctrine_adultery_men_shunned_name: "Zavrhovaná"
 doctrine_adultery_men_shunned_desc: "Pohlavní styk mužů mimo manželství je hříšný, ale stejně jako u všech hříchů přísluší soudit jejich provinění božstvu."
 doctrine_adultery_men_accepted_name: "Přijímaná"
 doctrine_adultery_men_accepted_desc: "Na rozhodnutí muže mít pohlavní styk mimo manželství není samo o sobě nic špatného, a proto záleží pouze na něm."
 doctrine_parameter_adultery_male_crime: "Muži s [Concept('trait','rysem')|E] [GetTrait('adulterer').GetName( GetNullCharacter )] nebo [GetTrait('fornicator').GetName( GetNullCharacter )] jsou [Concept('criminals','zločinci')|E]"
 doctrine_parameter_adultery_male_shunned: "Muži s [Concept('trait','rysem')|E] [GetTrait('adulterer').GetName( GetNullCharacter )] nebo [GetTrait('fornicator').GetName( GetNullCharacter )] jsou [Concept('shunned','zavrhováni')|E]"
 doctrine_parameter_adultery_male_accepted: "Muži s [Concept('trait','rysem')|E] [GetTrait('adulterer').GetName( GetNullCharacter )] nebo [GetTrait('fornicator').GetName( GetNullCharacter )] jsou plně přijímáni"
 doctrine_adultery_women_name: "Nevěra žen"
 doctrine_adultery_women_crime_name: "Zločinná"
 doctrine_adultery_women_crime_desc: "Pohlavní styk žen mimo manželství je zločinem a provinilkyně budou náležitě potrestány."
 doctrine_adultery_women_shunned_name: "Zavrhovaná"
 doctrine_adultery_women_shunned_desc: "Pohlavní styk žen mimo manželství je hříšný, ale stejně jako u všech hříchů přísluší soudit jejich provinění božstvu."
 doctrine_adultery_women_accepted_name: "Přijímaná"
 doctrine_adultery_women_accepted_desc: "Na rozhodnutí ženy mít pohlavní styk mimo manželství není samo o sobě nic špatného, a proto záleží pouze na ní."
 doctrine_parameter_adultery_female_crime: "Ženy s [Concept('trait','rysem')|E] [GetTrait('adulterer').GetName( GetNullCharacter )] nebo [GetTrait('fornicator').GetName( GetNullCharacter )] jsou [Concept('criminals','zločinci')|E]"
 doctrine_parameter_adultery_female_shunned: "Ženy s [Concept('trait','rysem')|E] [GetTrait('adulterer').GetName( GetNullCharacter )] nebo [GetTrait('fornicator').GetName( GetNullCharacter )] jsou [Concept('shunned','zavrhovány')|E]"
 doctrine_parameter_adultery_female_accepted: "Ženy s [Concept('trait','rysem')|E] [GetTrait('adulterer').GetName( GetNullCharacter )] nebo [GetTrait('fornicator').GetName( GetNullCharacter )] jsou plně přijímány"
 doctrine_kinslaying_name: "Rodovražda"
 doctrine_kinslaying_any_dynasty_member_crime_name: "Vražda člena dynastie je zločinem"
 doctrine_kinslaying_any_dynasty_member_crime_desc: "Všichni příbuzní jsou spojeni krví a zabití byť jen vzdáleného příbuzného je těžkým zločinem proti celé dynastii. Na taková provinění se nezapomíná."
 doctrine_parameter_kinslaying_any_dynasty_member_crime: "[Concept('kinslayers','Rodovrazi')|E] s [Concept('trait','rysem')|E] [GetTrait('kinslayer_1').GetName( GetPlayer )] nebo horším jsou v očích své [Concept('dynasty','dynastie')|E] [Concept('criminals','zločinci')|E]"
 doctrine_parameter_kinslaying_extended_family_crime: "[Concept('kinslayers','Rodovrazi')|E] s [Concept('trait','rysem')|E] [GetTrait('kinslayer_2').GetName( GetPlayer )] nebo horším jsou v očích své [Concept('dynasty','dynastie')|E] [Concept('criminals','zločinci')|E]"
 doctrine_parameter_kinslaying_close_kin_crime: "[Concept('kinslayers','Rodovrazi')|E] s [Concept('trait','rysem')|E] [GetTrait('kinslayer_3').GetName( GetPlayer )] jsou v očích své [Concept('dynasty','dynastie')|E] [Concept('criminals','zločinci')|E]"
 doctrine_parameter_kinslaying_shunned: "[Concept('kinslayers','Rodovrazi')|E] jsou [Concept('shunned','zavrhováni')|E]"
 doctrine_parameter_kinslaying_accepted: "Postavy, které zabijí příbuzného, nejsou považovány za [Concept('kinslayers','rodovrahy')|E]"
 doctrine_kinslaying_extended_family_crime_name: "Vražda člena rodiny je zločinem"
 doctrine_kinslaying_extended_family_crime_desc: "Vražda člena vlastní rodiny je jedním z nejohavnějších zločinů, jakých se lze dopustit. Každý, kdo takový čin spáchá, bude přísně potrestán."
 doctrine_kinslaying_close_kin_crime_name: "Vražda blízkého příbuzného je zločinem"
 doctrine_kinslaying_close_kin_crime_desc: "Bratrovraždu ani podobné činy nelze ve spravedlivé a řádné společnosti tolerovat. Ti, kdo se takových provinění dopustí, budou potrestáni."
 doctrine_consanguinity_name: "Pokrevní příbuzenství"
 doctrine_consanguinity_dynastic_name: "Zákaz sňatků v rodové linii"
 doctrine_consanguinity_dynastic_desc: "Je přísně zakázáno uzavřít sňatek s osobou stejného příjmení a společného původu bez ohledu na vzdálenost příbuzenství. Stejně tak není přípustné uzavírat sňatek s pokrevně blízkými osobami jiného příjmení."
 doctrine_consanguinity_restricted_name: "Tabu blízkého příbuzenství"
 doctrine_consanguinity_restricted_desc: "Dovolit dvěma příbuzným, aby uzavřeli sňatek nebo spolu udržovali sexuální vztah, je hříchem proti [ROOT.Faith.HighGodName]."
 doctrine_parameter_consanguinity_restricted_marriage: "Manželství mezi kterýmikoli [Concept('extended_family_members','členy širší rodiny')|E] nebo [Concept('close_family_members','členy blízké rodiny')|E] je zakázáno"
 doctrine_parameter_consanguinity_restricted_close_kin_incest: "Sexuální vztah mezi kterýmikoli [Concept('extended_family_members','členy širší rodiny')|E] nebo [Concept('close_family_members','členy blízké rodiny')|E] vytvoří [Concept('secret','tajemství')|E] incestu"
 doctrine_consanguinity_cousins_name: "Sňatky mezi bratranci a sestřenicemi"
 doctrine_consanguinity_cousins_desc: "Bratranci a sestřenice jsou sice příbuzní, avšak dostatečně vzdálení na to, aby spolu mohli uzavřít sňatek a zachovat tak svou rodovou linii."
 doctrine_parameter_consanguinity_cousins_marriage: "Manželství mezi bratranci a sestřenicemi je povoleno"
 doctrine_parameter_consanguinity_cousins_incest: "Sexuální vztah mezi bratranci a sestřenicemi nevytvoří [Concept('secret','tajemství')|E] incestu"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_name: "Avunkulátní sňatky"
 doctrine_consanguinity_aunt_nephew_and_uncle_niece_desc: "Pokud nejsou v přímé příbuzenské linii, mohou členové rodiny uzavírat vzájemné sňatky pro dobro dynastie."
 doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_marriage: "Manželství mezi bratranci a sestřenicemi, tetami a synovci nebo strýci a neteřemi je povoleno"
 doctrine_parameter_consanguinity_aunt_nephew_and_uncle_niece_incest: "Sexuální vztah mezi bratranci a sestřenicemi, tetami a synovci nebo strýci a neteřemi nevytvoří [Concept('secret','tajemství')|E] incestu"
 doctrine_consanguinity_unrestricted_name: "Neomezené sňatky"
 doctrine_consanguinity_unrestricted_desc: "Je přirozené a zdravé, aby se členové rodiny milovali, a ti, kdo tvrdí, že by se jejich láska měla omezovat pouze na nesexuální vztahy, jsou pošetilci."
 doctrine_parameter_consanguinity_unrestricted_marriage: "Manželství mezi všemi členy rodiny je povoleno"
 doctrine_parameter_consanguinity_unrestricted_incest: "Sexuální vztah mezi kterýmikoli členy rodiny nevytvoří [Concept('secret','tajemství')|E] incestu"
 doctrine_parameter_consanguinity_restricted_dynastic_marriage: "Manželství mezi členy stejné [Concept('dynasty','dynastie')|E] je zakázáno"
 doctrine_parameter_allows_cousin_marriage: ""
 doctrine_parameter_allows_aunt_nephew_and_uncle_niece_marriage: ""
 doctrine_parameter_allows_unrestricted_marriage: ""
 doctrine_pluralism_name: "Náboženský postoj"
 doctrine_parameter_hostility_towards_us_mult: "Vyznavači jiných [Concept('faiths','věr')|E] budou mít postih k mínění ve výši $VALUE|%V0$"
 doctrine_pluralism_fundamentalist_name: "Fundamentalistický"
 doctrine_pluralism_fundamentalist_desc: "Naše víra je jedinou pravou vírou a naše slovo jediným pravým slovem. Jakákoli odchylka od [ROOT.Faith.ReligiousText] je ze své podstaty rouhavá."
 doctrine_parameter_pluralism_fundamentalist_proselytization_bonus: "Rychlost obracení hrabství: #P +20%#!"
 doctrine_parameter_pluralism_fundamentalist_revocation_tyranny_minimal: "Může #P odebrat zeměpanské tituly#! $hostility_hostile_tooltippable$ a $hostility_evil_tooltippable$ nevěřícím, aniž by tím vznikla [Concept('tyranny','tyranie')|E]"
 doctrine_parameter_pluralism_fundamentalist_faction_join_chance: "[Concept('counties','Hrabství')|E] jiných [Concept('faiths','věr')|E] se #N s větší pravděpodobností#! připojí k [Concept('factions','frakcím')|E]"
 doctrine_parameter_pluralism_fundamentalist_vulnerable_to_heresy: "#N Zvýšené nebezpečí#! herezí při nízké [Concept('fervor','horlivosti')|E]"
 doctrine_pluralism_righteous_name: "Spravedlivý"
 doctrine_pluralism_righteous_desc: "Jako smrtelníci nedokážeme plně pochopit vůli [ROOT.Faith.HighGodNamePossessive], naši [ROOT.Faith.PriestNeuterPlural] však mají poměrně dobrou představu o tom, co je posvátné a co rouhavé."
 doctrine_parameter_pluralism_righteous_revocation_tyranny_reduced: "Může #P odebrat zeměpanské tituly#! $hostility_evil_tooltippable$ nevěřícím, aniž by tím vznikla [Concept('tyranny','tyranie')|E]"
 doctrine_pluralism_pluralistic_name: "Pluralistický"
 doctrine_pluralism_pluralistic_desc: "Tvrdit, že existuje pouze jediný správný výklad božské vůle a všechny ostatní názory jsou mylné, je naprosté bláznovství. Každý z nás uctívá [ROOT.Faith.HighGodName] vlastním způsobem."
 doctrine_parameter_pluralism_pluralistic_proselytization_penalty: "Rychlost obracení hrabství: #N -20%#!"
 doctrine_parameter_pluralism_pluralistic_faction_join_chance: "Hrabství jiných [Concept('faiths','věr')|E] se #P s menší pravděpodobností#! připojí k [Concept('factions','frakcím')|E]"
 doctrine_parameter_pluralism_pluralistic_resistant_to_heresy: "#P Snížené nebezpečí#! herezí při nízké [Concept('fervor','horlivosti')|E]"
 doctrine_parameter_pluralism_pluralistic_holy_wars_preserve_vassals: "Vítězství ve [Concept('holy_war','svaté válce')|E] učiní z nevěřících [Concept('rulers','vládců')|E] v cílové oblasti vazaly namísto zabrání jejich země"
 doctrine_theocracy_name: "Tradice duchovenstva"
 doctrine_theocracy_temporal_name: "Teokratická"
 doctrine_theocracy_temporal_desc: "Pouze schválení [ROOT.Faith.PriestNeuterPlural] mohou být pověřeni zachováváním doktrín naší víry, a tím i správou a péčí o naše posvátná místa."
 doctrine_parameter_theocracy_temple_lease: "Chrámové [Concept('holdings','državy')|E] jsou pronajaty [Concept('realm_priest','vrchnímu duchovnímu')|E] svého držitele, který mu poté slouží jako [Concept('theocratic','teokratický')|E] [Concept('vassal','vazal')|E]"
 doctrine_theocracy_lay_clergy_name: "Laické duchovenstvo"
 doctrine_theocracy_lay_clergy_desc: "Každý oddaný vyznavač je více než schopný chápat, následovat a hlásat doktríny naší víry."
 doctrine_parameter_theocracy_temple_ownership: "Světští [Concept('rulers','vládci')|E] přímo ovládají své chrámové [Concept('holdings','državy')|E] a získávají všechny související výhody."
 doctrine_parameter_lay_clergy: ""
 doctrine_parameter_allowed_holding_type_church_holding: ""
 doctrine_clerical_function_name: "Úloha duchovenstva"
 doctrine_clerical_function_taxation_name: "Kontrola"
 doctrine_clerical_function_taxation_desc: "[ROOT.Faith.AltPriestTermPlural] odvozují svou autoritu od samotného [ROOT.Faith.HighGodName] [ROOT.Faith.HighGodHerselfHimself] a to platí i zde na zemi."
 doctrine_clerical_function_alms_and_pacification_name: "Almužny a usmiřování"
 doctrine_clerical_function_alms_and_pacification_desc: "Našim [ROOT.Faith.PriestNeuterPlural] je svěřeno zajistit chudým a utlačovaným dostatek jídla a přístřeší, pokud si je nedokážou opatřit sami."
 doctrine_clerical_function_recruitment_name: "Nábor"
 doctrine_clerical_function_recruitment_desc: "Naši [ROOT.Faith.PriestNeuterPlural] mohou pozvednout zbraně a bránit naši víru. Odpovědnost jít ostatním příkladem jim dodává v boji větší sílu."
 doctrine_parameter_clergy_can_fight: "Členové [Concept('clergy','duchovenstva')|E] mohou sloužit jako [Concept('commanders','velitelé')|E] nebo $knight_culture_player_plural$"
 doctrine_clerical_gender_name: "Pohlaví duchovenstva"
 doctrine_clerical_gender_male_only_name: "Pouze muži"
 doctrine_clerical_gender_male_only_desc: "Pouze muži mohou nést velkou odpovědnost služby jako [ROOT.Faith.PriestMalePlural] naší víry."
 doctrine_parameter_clergy_must_be_male: "Pouze mužům lze udělit chrámové [Concept('holdings','državy')|E] nebo mohou sloužit jako [Concept('court_chaplains','dvorní kaplani')|E]"
 doctrine_clerical_gender_female_only_name: "Pouze ženy"
 doctrine_clerical_gender_female_only_desc: "Pouze ženy jsou natolik moudré, aby dokázaly vykládat vůli [ROOT.Faith.HighGodNamePossessive] a sloužit jako [ROOT.Faith.PriestFemalePlural] naší víry."
 doctrine_parameter_clergy_must_be_female: "Pouze ženám lze udělit chrámové [Concept('holdings','državy')|E] nebo mohou sloužit jako [Concept('court_chaplains','dvorní kaplanky')|E]"
 doctrine_clerical_gender_either_name: "Kterékoli"
 doctrine_clerical_gender_either_desc: "Každý, kdo pocítil božské volání, by měl mít možnost sloužit jako [ROOT.Faith.PriestNeuterPlural] bez ohledu na své pohlaví."
 doctrine_parameter_clergy_can_be_either_gender: "Pohlaví nemá vliv na to, komu lze udělit chrámové [Concept('holdings','državy')|E] nebo kdo může sloužit jako [Concept('court_chaplains','dvorní kaplan')|E]"
 doctrine_clerical_marriage_name: "Manželství duchovních"
 doctrine_clerical_marriage_allowed_name: "Povolené"
 doctrine_clerical_marriage_allowed_desc: "Manželství je posvátnou institucí a [ROOT.Faith.PriestNeuterPlural] by se na něm měli moci podílet stejně jako kterýkoli jiný věrný vyznavač."
 doctrine_parameter_clergy_can_marry: "Členové [Concept('clergy','duchovenstva')|E] mohou uzavírat [Concept('marry','manželství')|E]"
 doctrine_clerical_marriage_disallowed_name: "Zakázané"
 doctrine_clerical_marriage_disallowed_desc: "Stát se [ROOT.Faith.PriestNeuter] znamená zasvětit svůj život [ROOT.Faith.HighGodName]. Pomýšlet vedle toho na přijetí smrtelného manželského protějšku je ze své podstaty nevěrné."
 doctrine_parameter_clergy_can_marry_disabled: "Členům [Concept('clergy','duchovenstva')|E] je zakázáno uzavírat [Concept('marrying','manželství')|E]"
 doctrine_clerical_succession_name: "Jmenování duchovních"
 doctrine_clerical_succession_temporal_appointment_name: "Světské, odvolatelné"
 doctrine_clerical_succession_temporal_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U] jsou v konečném důsledku služebníky panství, a proto by je jejich lenní pán měl moci s nevelkými omezeními jmenovat i odvolávat."
 doctrine_clerical_succession_spiritual_appointment_name: "Duchovní, odvolatelné"
 doctrine_clerical_succession_spiritual_appointment_desc: "Ačkoli by všechny [ROOT.Faith.BishopNeuterPlural] měli jmenovat [ROOT.Faith.AltPriestTermPlural], světští vládci by stále měli mít možnost odvolat ty, kteří je zklamou."
 doctrine_clerical_succession_temporal_fixed_appointment_name: "Světské, doživotní"
 doctrine_clerical_succession_temporal_fixed_appointment_desc: "Vládce by sice měl mít možnost vybrat si vlastní [ROOT.Faith.BishopNeuterPlural], jejich povinnosti jsou však svaté a posvátné, a jejich jmenování by proto nemělo být možné odvolat."
 doctrine_clerical_succession_spiritual_fixed_appointment_name: "Duchovní, doživotní"
 doctrine_clerical_succession_spiritual_fixed_appointment_desc: "[ROOT.Faith.BishopNeuterPlural|U] jsou služebníky božství a jako jeho zástupci jsou jmenováni konečným a nezpochybnitelným rozhodnutím, které učiní [ROOT.Faith.AltPriestTermPlural]."
 doctrine_parameter_clerical_appointment_ruler: "[Concept('rulers','Vládci')|E] jmenují vlastního [Concept('realm_priest','vrchního duchovního')|E] nebo [Concept('court_chaplain','dvorního kaplana')|E]"
 doctrine_parameter_clerical_appointment_head_of_faith: "[Concept('head_of_faith','Hlava víry')|E] nebo duchovenstvo jmenuje všechny [Concept('realm_priests','vrchní duchovní')|E] či [Concept('court_chaplains','dvorní kaplany')|E]"
 doctrine_parameter_clerical_appointment_fixed_disabled: "[Concept('realm_priest','Vrchní duchovní')|E] nebo [Concept('court_chaplain','dvorní kaplan')|E] může být odvolán a nahrazen nově jmenovanou osobou"
 doctrine_parameter_clerical_appointment_fixed: "[Concept('realm_priest','Vrchní duchovní')|E] nebo [Concept('court_chaplain','dvorní kaplan')|E] zastává svůj úřad doživotně"
 doctrine_theism_name: "Teismus"
 doctrine_monotheist_name: "Monoteismus"
 doctrine_monotheist_desc: "Uctíván je pouze jediný bůh. Ostatní takzvaní „bohové“ jsou v lepším případě prázdné modly a v horším pokusy jakéhosi zlovolného podvodníka odvést věřící od řádného uctívání [ROOT.Faith.HighGodName].[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning: "\n\n$FAITH_MANDALA_MONOTHEIST_WARNING$"
 mandala_monotheist_warning_tt_global: "[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'mandala_monotheist_warning')]"
 mandala_monotheist_warning_tt_first: "$mandala_monotheist_warning_tt_global$"
 mandala_monotheist_warning_tt_third: "$mandala_monotheist_warning_tt_global$"
 doctrine_polytheist_name: "Polyteismus"
 doctrine_polytheist_desc: "Kosmos je plný mocných božstev a duchů. Může existovat jasně uspořádaný panteon bohů, ale duchovní svět může být také nespočetný, prostupovat vším kolem nás a dokonce postrádat pojmenovaná božstva."
 unreformed_faith_doctrine_name: "Nereformovaná"
 unreformed_faith_name: "doktrína"
 unreformed_faith_doctrine_desc: "Nereformovaná víra postrádá organizované duchovenstvo a ustálené kanonické doktríny. Různá společenství tak mohou formálně následovat stejnou víru, přestože se jejich náboženské praktiky a přesvědčení zásadně liší."
 doctrine_parameter_unreformed: "Brání kmenovým [Concept('rulers','vládcům')|E] změnit typ [Concept('government','zřízení')|E] \n$EFFECT_LIST_BULLET$Poskytuje [Concept('unreformed_pagan_combat_bonus','bojový bonus nereformovaných pohanů')|E]"
 doctrine_parameter_hostility_override_tenet_unreformed_syncretism: "Nepohanské [Concept('faiths','víry')|E] se zásadou $tenet_unreformed_syncretism_name$ jsou považovány za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] namísto $hostility_evil_tooltippable$"
 west_african_unreformed_faith_doctrine_name: "$unreformed_faith_doctrine_name$"
 west_african_unreformed_faith_doctrine_desc: "$unreformed_faith_doctrine_desc$"
 heresy_hostility_name: "Postoj ke kacířství"
 heresy_hostility_doctrine_name: "Kacířství"
 heresy_hostility_doctrine_desc: "Střezte se falešného proroka, který by překrucoval a rozvracel víru pro vlastní cíle. Ti, kdo tak činí, jsou kacíři a musí být zničeni."
 divine_destiny_name: "Božský osud"
 divine_destiny_doctrine_name: "Právoplatní vládci světa"
 divine_destiny_doctrine_desc: "Jsme těmi, kdo všem národům přinesou věk míru a blahobytu. Jsme právoplatnými vládci světa."
 doctrine_parameter_divine_destiny_holy_war_cost_reduction: "Náklady svaté války na [Concept('piety','zbožnost')|E]: #P -50%#!"
 adoptionist_school_name: "Adopcianistické vyznání"
 special_doctrine_adoptionist_school_elipandic_doctrine_name: "Elipandská škola"
 special_doctrine_adoptionist_school_elipandic_doctrine_desc: "Elipandská varianta $adoptionist$ se zaměřuje na jemné christologické rozdíly a zdůrazňuje význam #EMP přesného#! vymezení vůči trojičnímu dogmatu. Dobře formulované složité rozlišení je považováno za nesrovnatelně lepší než jednoduché, avšak chabě odůvodněné vysvětlení."
 special_doctrine_adoptionist_school_felicitous_doctrine_name: "Feliciánská škola"
 special_doctrine_adoptionist_school_felicitous_doctrine_desc: "Feliciánský $adoptionist$ upřednostňuje praktičnost před čistotou a chápe, že musí působit uvnitř nepřátelských systémů, aby je mohl rozvrátit. Ohavná lež pronesená ve jménu ušlechtilého cíle má podle něj větší cenu než tisíc neomalených pravd."
 special_doctrine_adoptionist_school_radical_doctrine_name: "Radikální škola"
 special_doctrine_adoptionist_school_radical_doctrine_desc: "Radikální $adoptionist_adherent_plural$ neuznávají jiného Boha než Otce, nepřipouštějí žádné božství smrtelného těla a za $christianity_religion_adherent_plural$ nepovažují nikoho kromě sebe. Přijmout Krista bez souhlasu s každým #EMP písmenem#! kánonu znamená přiznat odpadlictví."
 special_doctrine_is_christian_faith_name: "Ježíšovo učení"
 is_christian_faith_name: "$special_doctrine_is_christian_faith_name$"
 special_doctrine_is_christian_faith_desc: "Na světě žijí lidé, kteří následují Ježíšovo učení, aniž by uznávali jeho božství. Ačkoli je to rouhavé, měli bychom těmto pomýleným duším projevovat soucit, neboť se jednoho dne mohou obrátit k pravé víře."
 doctrine_parameter_hostility_override_tenet_christian_syncretism: "Nekřesťanské [Concept('faiths','víry')|E] se zásadou $tenet_christian_syncretism_name$ jsou považovány za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] namísto $hostility_evil_tooltippable$"
 special_doctrine_is_islamic_faith_name: "Prorokovo učení"
 is_islamic_faith_name: "$special_doctrine_is_islamic_faith_name$"
 special_doctrine_is_islamic_faith_desc: "Ačkoli nedodržují všechny Prorokovy zákony, někteří lidé na tomto světě se řídí vůlí Alláha více, než si sami uvědomují. Časem mohou tito částeční konvertité dokonce opustit své zavrženíhodné způsoby a stát se skutečnými členy ummy!"
 doctrine_parameter_hostility_override_tenet_islamic_syncretism: "Neislámské [Concept('faiths','víry')|E] se zásadou $tenet_islamic_syncretism_name$ jsou považovány za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] namísto $hostility_evil_tooltippable$"
 special_doctrine_is_jewish_faith_name: "Mojžíšovo učení"
 is_jewish_faith_name: "$special_doctrine_is_jewish_faith_name$"
 special_doctrine_is_jewish_faith_desc: "Ne všichni nežidé žijí v hříchu. Někteří respektují Boží vyvolený lid a na oplátku si zaslouží jistou míru naší úcty."
 doctrine_parameter_hostility_override_tenet_jewish_syncretism: "Nežidovské [Concept('faiths','víry')|E] se zásadou $tenet_jewish_syncretism_name$ jsou považovány za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] namísto $hostility_evil_tooltippable$"
 prophecy_of_malachi_name: "Malachiášovo proroctví"
 special_doctrine_not_allowed_to_hof_name: "Rozvrácené kněžstvo"
 not_allowed_to_hof_name: "$special_doctrine_not_allowed_to_hof_name$"
 prophecy_of_malachi_desc: "Podle tradiční židovské doktríny může být nový velekněz jmenován pouze s příchodem Proroka nebo tehdy, bude-li nalezen Áronův potomek způsobilý ke kněžské službě."
 special_doctrine_not_allowed_to_hof_desc: "Velekněžství této víry bylo zcela rozvráceno. Jakýkoli pokus jmenovat velekněze by nejprve vyžadoval důkladnou obnovu tradičního náboženského uspořádání."
 doctrine_parameter_block_from_create_hof_parameter: "Tato víra nemůže za běžných okolností obnovit svou [Concept('head_of_faith','hlavu víry')|E]."
 special_doctrine_is_eastern_faith_name: "Mnohonáboženské prolínání"
 is_eastern_faith_name: "$special_doctrine_is_eastern_faith_name$"
 special_doctrine_is_eastern_faith_desc: "Nespojuje nás jediná víra, nýbrž množství věr, které tvoří náboženskou strukturu naší společnosti. Ačkoli se nazýváme různými jmény a kráčíme rozdílnými cestami, někteří lidé mimo náš vlastní systém přesvědčení se naučili žít v naší společnosti, jako by byli jedněmi z nás."
 doctrine_parameter_hostility_override_tenet_eastern_syncretism: "Nedharmické [Concept('faiths','víry')|E] se zásadou $tenet_eastern_syncretism_name$ jsou považovány za [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] namísto $hostility_evil_tooltippable$"
