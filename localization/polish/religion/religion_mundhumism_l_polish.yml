 mundhum_religion_desc: "Mundhumismus je náboženskou tradicí kirátských národů Himálaje, která se soustředí na prastaré příběhy a písně zvané mundhum, jež její vyznavači považují za svá posvátná písma. Jde o synkretické náboženství, které spojuje uctívání předků s mnoha božstvy a praktikami převzatými z hinduismu."
