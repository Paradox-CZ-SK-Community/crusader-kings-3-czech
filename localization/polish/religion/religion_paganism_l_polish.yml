 pulugaism: "Pūlugaismus"
 pulugaism_desc: "$pulugaism_adherent_plural$ věří, že svět vytvořil ještěří bůh $pulugaism_high_god_name$, než se rozhněval na lidstvo a seslal na ně velkou potopu. Přežili pouze dva muži a dvě ženy a $pulugaism_high_god_name$ jim pomohl znovu utvořit svět: lidstvo znovu objevilo oheň a $pulugaism_high_god_name$ obnovil všechny přírodní věci. Stoupenci udržují s $pulugaism_high_god_name$ složitý a často svárlivý vztah. Činy, které vzbudí hněv $pulugaism_high_god_name_possessive$, vyvolávají přírodní pohromy, těm však lze zabránit náležitou obětí."
