 biliku_religion_desc: "Tato víra uctívá panteon bohů, jejichž vztah k lidstvu je složitý. Mnoho nakkavarských příběhů vypráví o velkých předcích, kteří bojovali s hlavními božstvy své víry. Někteří lidé ztělesňují hlavní božstvo jako pavoučí bohyni, jiní jako ještěřího boha. Ve všech podobách příběhu stvořitel vrhl hořící pochodeň po velkém předkovi, který ukradl oheň, a poté, unaven lidstvem, zmizel z hmotného světa. Zanechal po sobě své syny, kteří na sebe vzali podobu větru a přinášejí lidem odměnu i trest."
