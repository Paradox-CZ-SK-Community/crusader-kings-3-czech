 rrmeaism_desc: "Náboženství Rrmeů neboli Čchiangů soustředí značnou část svého uctívání na bílé kameny zvané vvluphi. Šamanští kněží známí jako xbi nosí čapky z opičí kožešiny a při obřadech bubnují na bubny potažené ovčí kůží."
