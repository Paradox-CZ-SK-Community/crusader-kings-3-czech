 melieism_adherent: "Melieista"
 melieism_adherent_plural: "Melieisté"
 melieism_desc: "Původní víra Tangutů považovala bílého jeřába za nebeský mužský projev božství, zatímco rudá opice představovala jeho pozemský ženský projev. Nebuddhistická tangutská společnost se podle těchto zásad dělila na dvě vrstvy: kněžské „černohlavé“ a prosté „rudolící“."
