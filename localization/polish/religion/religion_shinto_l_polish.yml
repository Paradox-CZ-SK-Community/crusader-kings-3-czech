 shugendo_desc: "Cesta k duchovní moci vede skrze kázeň. Vyznavači šugendó se snaží porozumět duchovnímu světu pomocí mnoha obřadů a vyhledávají nejposvátnější místa, kde je hranice mezi lidským a duchovním světem nejtenčí."
