 shinto_adherent: "Šintoista"
 shinto_adherent_plural: "Šintoisté"
 shinto_desc: "Duchovní svět je všude kolem nás a duchové obývají všechny části světa. Nadpřirozená bytost může přebývat v čemkoli – v lůžku, hoře, a dokonce i v dešťové bouři. Je důležité zachovávat s duchovním světem soulad a prokazovat mu náležitou úctu a uznání."
