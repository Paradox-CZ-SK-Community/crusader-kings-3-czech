 quanzhen_adj: "Čchüan-čenský"
 quanzhen_adherent: "Vyznavač Čchüan-čenu"
 quanzhen_adherent_plural: "Vyznavači Čchüan-čenu"
 quanzhen_desc: "Stoupenci taoismu Čchüan-čen praktikují vnitřní alchymii, aby zdokonalili svá těla a dosáhli souladu s tao. Tímto procesem získávají tělesnou dlouhověkost a duchovní nesmrtelnost."
