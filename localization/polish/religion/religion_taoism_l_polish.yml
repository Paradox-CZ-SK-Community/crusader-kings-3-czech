 shangqing_adherent: "Vyznavač Šang-čchingu"
 shangqing_adherent_plural: "Vyznavači Šang-čchingu"
 shangqing_desc: "Taoismus Šang-čching byl za dynastie Tchang převládající podobou taoismu. Jeho stoupenci usilují o soulad s vesmírem prostřednictvím meditace a tělesných cvičení, nikoli talismanů a alchymie používaných jinými větvemi taoismu."
