 zhengyi_desc: "Na rozdíl od ostatních taoistických škol zachovává Čeng-i přísnou teokratickou hierarchii pod vedením Nebeského mistra. Její stoupenci vyrábějí a prodávají ochranné talismany, které mají zabránit úbytku čchi, životní energie udržující všechny živé bytosti."
