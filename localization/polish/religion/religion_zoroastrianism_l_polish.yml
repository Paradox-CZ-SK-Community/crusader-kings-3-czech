 khurmazta_fate_god_name_possessive: "Parnův"
 khurmazta_devil_name: "Shimnu"
 khurmazta_devil_name_possessive: "Shimnuův"
 mazdakism: "Mazdakismus"
 mazdakism_adj: "Mazdakovský"
 mazdakism_adherent: "Mazdakovec"
 mazdakism_adherent_plural: "Mazdakovci"
 mazdakism_desc: "Radikální proroci Zardušt Churagán a Mazdak byli ovlivněni esoterickými náboženstvími pozdní antiky a hlásali společné vlastnictví zdrojů a všeobecnou spolupráci mezi lidmi, aby překonali pět démonů chamtivosti, hněvu, závisti, majetnictví a pomstychtivosti."
 khurramism: "Churramismus"
 khurramism_adj: "Churramitský"
 khurramism_adherent: "Churramita"
 khurramism_adherent_plural: "Churramité"
 khurramism_desc: "Ve světě Světla a Temnoty musí být nespravedliví vládci svrženi, aby mohlo zvítězit dobro. Churramité se podle proroků, jako byli Mazdak, Abú Muslim a al-Mukanna, domnívají, že božství se rodí v lidstvu a jednoho dne se vrátí, aby je vedlo jako Mesiáš."
 urartuism: "Arewordik"
 urartuism_adj: "Arewordský"
 urartuism_adherent: "Arewordi"
 urartuism_adherent_plural: "Arewordiové"
 urartuism_high_god_name: "Aramazd"
 urartuism_high_god_name_2: "$urartuism_high_god_name$"
 urartuism_high_god_name_possessive: "Aramazdův"
 urartuism_fertility_god_name: "Anahit"
 urartuism_fertility_god_name_possessive: "Anahitina"
 urartuism_death_deity_name: "Spandaramet"
 urartuism_death_deity_name_possessive: "Spandarametin"
 urartu_good_god_the_sun: "Arew"
 urartu_good_god_mithra: "Mihr"
 urartu_good_god_zoroaster: "Zradašt"
 urartuism_desc: "Ve víře Arewordik, směru skrytých zoroastriánů, stále doznívá mnoho starověkých představ. Ohrmazd, uctívaný jako Aramazd, vládne společenství bohů, mezi něž patří i samotné Slunce a kteří společně řídí svět."
 urartu_good_god_vanatur: "Vanatur"
 urartuism_priest_male: "Hazarpet"
 urartuism_priest_male_plural: "Hazarpetové"
 afridunism: "Afridunismus"
 afridunism_adj: "Afridunský"
 afridunism_adherent: "Afridunista"
 afridunism_adherent_plural: "Afridunisté"
 afridunism_desc: "Afridunismus, hluboce zakořeněný v dajlamských tradicích a perském pohanství, v mnoha ohledech předchází dokonce i starobylému zoroastrijskému vyznání. Jeho stoupenci se snaží žít podle pravidel stanovených bájným hrdinou Farídúnem, která zdůrazňují svrchovanou moc vůdců rodin a nezkrotného ducha nezávislosti."
 afridunism_good_god_mithra: "Mithra"
 afridunism_good_god_hvar_khshaita: "Hvar Chšaita"
 afridunism_war_god_name: "Verethragna"
 afridunism_war_god_name_possessive: "Verethragnův"
 afridunism_priest_male: "Zautar"
 afridunism_priest_male_plural: "Zautarové"
 doctrine_zoroastrian_branches_name: "Dobro a zlo"
 doctrine_zoroastrian_branches_desc: "Máme podporovat zavedené kněžstvo a jeho učení, aby chránilo naši víru před kacířstvím, nebo jsou ve skutečnosti pomýlení a zkažení právě oni?"
 doctrine_major_branch_behdin_name: "Behdín"
 doctrine_major_branch_behdin_desc: "Přestože se můžeme lišit v některých podrobnostech obřadů, neshodneme se snad my, zoroastriáni hlavního proudu, na základních zásadách oddanosti Ahurovi Mazdovi?"
 doctrine_heretic_branch_zandik_name: "Korramdín"
 doctrine_heretic_branch_zandik_desc: "$doctrine_major_branch_behdin_name$ nás nazývají kacíři, vyděděnci a rozvraceči. Ačkoli nás kromě jejich opovržení nic nespojuje, spravedlnost nám velí vzdorovat a jejich pohrdání zatvrzuje naše srdce."
 doctrine_parameter_hostility_override_doctrine_major_branch_behdin: "Postoj k ostatním behdínským [Concept('faiths','vírám')|E]: [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]."
 doctrine_parameter_hostility_override_doctrine_heretic_branch_zandik: "Postoj k ostatním korramdínským [Concept('faiths','vírám')|E]: [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
