 mazdayasna_adherent: "Mazdajasna"
 mazdayasna_adherent_plural: "Mazdajasnové"
 mazdayasna_desc: "Lidé pomáhají v boji proti #italic Aka Manahovi#! dobrými myšlenkami a řádným životem. Činí tak zachováváním rituální čistoty, ochranou přírody a ničením zlých tvorů."
 zurvanism: "Beháfarídismus"
 zurvanism_adj: "Beháfarídský"
 zurvanism_adherent: "Beháfarídovec"
 zurvanism_adherent_plural: "Beháfarídovci"
 zurvanism_desc: "Stoupenci Beháfarídova učení, $zurvanism_adherent_plural$, usilují o spolupráci s islámským světem a v reakci na muslimskou kritiku hlavního proudu zoroastrismu zavádějí do své víry četné reformy. Patří mezi ně zákaz požívání alkoholu, přísný odpor k příbuzenským sňatkům a podpora dobročinnosti jako způsobu využívání vlastního bohatství ve prospěch společnosti."
 tenet_zurvanism_name: "Zurvanismus"
 tenet_zurvanism_desc: "Zurvanisté věří, že Ohrmazd a Ahriman byli rovnocenná, avšak protikladná dvojčata zrozená ze Zurvána, stvořitele všeho. Zurvanismus klade velký důraz na pomoc Ahurovi Mazdovi prostřednictvím vymýcení zla a klamu."
 zurvanism_creator_god_name: "Zurván"
 zurvanism_creator_god_name_possessive: "Zurvánův"
 gayomarthianism: "Gajómartismus"
 gayomarthianism_adj: "Gajómartský"
 gayomarthianism_adherent: "Gajómartovec"
 gayomarthianism_adherent_plural: "Gajómartovci"
 gayomarthianism_desc: "Gajómartovci vycházejí z představy, že Ahura Mazda svými myšlenkami neúmyslně stvořil zlé duchy. Odmítají proto neomylnost Pána moudrosti a místo ní zdůrazňují rituální praxi, jejímž prostřednictvím poznávají Pravdu ve společenství s Ahurou Mazdou."
 khurmazta: "Churmaztismus"
 khurmazta_adj: "Churmaztský"
 khurmazta_adherent: "Churmazta"
 khurmazta_adherent_plural: "Churmaztové"
 khurmazta_desc: "Churmaztismus má hluboké kořeny v náboženském prolínání Sogdiany a jeho vyznavači uctívají široké společenství rodových i všeobecných bohů a duchů. Uctívají také posvátná vyobrazení, což je pro mnohé jiné zoroastriány zavrženíhodné. Přestože jsou některé stránky jejich víry jedinečné, v jiných ohledech zůstávají součástí hlavního proudu zoroastrijského učení, vykonávají obřady čistoty a s neutuchající oddaností pečují o věčné ohně."
 khurmazta_good_god_zravan: "Zravan"
 khurmazta_good_god_weshparkar: "Weshparkar"
 khurmazta_good_god_adbad: "Adbad"
