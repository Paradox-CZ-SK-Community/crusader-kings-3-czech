 zoroastrianism_religion_desc: "Zoroastriáni se řídí učením Zarathuštry a věří v Pána moudrosti Ahuru Mazdu, zdroj veškerého dobra, který bojuje proti klamství ztělesněnému Ahrimanem. Zoroastrián kráčí cestou Pravdy skrze dobré myšlenky, dobrá slova a dobré skutky."
