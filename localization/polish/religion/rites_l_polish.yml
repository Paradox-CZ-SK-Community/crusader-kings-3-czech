 rite_no_name_adherent: "$rite_no_name_adj$" # todo: NEW TRANSLATION
 rite_no_name_adherent_plural: "$rite_no_name_adj$" # todo: NEW TRANSLATION
 rite_no_name_desc: "#D Tento obřad by měl mít název #!" # todo: NEW TRANSLATION
 generic_rite_description: "[Rite.GetNameNoTooltip] založil [Character.GetFullName] v [Character.GetCurrentLocation.GetTitle.GetAdjective] dne [GetCurrentDate.GetStringLong] jako obřad v rámci [Faith.GetAdjective] víry. [Rite.Custom('GetGenericRiteTenetSentence')]" # todo: NEW TRANSLATION
 generic_rite_no_location_description: "[Rite.GetNameNoTooltip] založil [Character.GetFullName] dne [GetCurrentDate.GetStringLong] jako obřad v rámci [Faith.GetAdjective] víry. [Rite.Custom('GetGenericRiteTenetSentence')]" # todo: NEW TRANSLATION
 generic_rite_focus_fallback: "Tento obřad zachovává v rámci své mateřské víry osobitý důraz na zbožnost." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_aniconism: "Tento obřad odmítá posvátné obrazy a hledá úctu v jejich nepřítomnosti, zdrženlivosti a svatosti nezobrazovaného božstva." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_alexandrian_catechism: "Tento obřad si cení vzdělaného učení, jemných naukových rozlišení a trpělivého poučování věřících." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_armed_pilgrimages: "Tento obřad považuje svatou válku a ozbrojenou pouť za posvátné povinnosti zbožných." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_carnal_exaltation: "Tento obřad ctí touhu a tělesné potěšení jako dary dotčené posvátnem." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_communal_identity: "Tento obřad pevně spojuje bohoslužbu se sdílenými zvyky, společným životem a střeženou komunitní identitou." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_communion: "Tento obřad drží pohromadě společná zbožnost, almužny a společenství s duchovní hlavou." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_consolamentum: "Tento obřad usiluje o konečné očištění skrze odříkání a neúnavnou přípravu na smrt." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_divine_marriage: "Tento obřad posvěcuje svazek i vládu a chápe svaté manželství jako odraz božského řádu." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_gnosticism: "Tento obřad hledá skryté pravdy za závojem světa a důvěřuje, že spásu přinese posvátné poznání." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_mendicant_preachers: "Tento obřad šíří víru prostřednictvím potulných kazatelů, pokorného svědectví a neúnavného poučování." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_pacifism: "Tento obřad vyzdvihuje zdrženlivost a mír a považuje zbytečné krveprolití za závažné selhání duše." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_pentarchy: "Tento obřad si váží starobylých sídel autority a řádné správy širší víry." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_unrelenting_faith: "Tento obřad chválí neochvějnou horlivost, pevné odhodlání a ochotu bojovat za to, co je svaté." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_vows_of_poverty: "Tento obřad ctí svatou chudobu a vybízí věřící, aby odložili přebytek a žili skromněji." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_pastoral_isolation: "Tento obřad dává přednost chráněnému stádu a upřednostňuje odloučení od širšího světa před kompromisem." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_rite: "Tento obřad klade velký důraz na liturgii, církevní řád a zachování posvátné tradice." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_adaptive: "Tento obřad se dokáže přizpůsobit, aniž by ztratil svou podstatu, a přijímá místní zvyky při zachování svého posvátného jádra." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_esotericism: "Tento obřad si cení skryté moudrosti, zasvěcení a pravd zjevovaných pouze připraveným." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_legalism: "Tento obřad zakládá svatost na jasných zákonech, řádném soudu a ukázněném uspořádání života." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_literalism: "Tento obřad se pevně drží posvátných slov a nedůvěřuje volnému výkladu ani kompromisům zděděným z minulosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_reincarnation: "Tento obřad chápe cestu duše jako cyklickou, přičemž každý život utváří ten následující." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_religious_legal_pronouncements: "Tento obřad přikládá posvátnému právu a formálním výrokům trvalou duchovní autoritu." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_struggle_submission: "Tento obřad učí, že víra se prokazuje bojem, dobýváním a podrobením bezbožných." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_false_conversion_sanction: "Tento obřad toleruje skrytou přizpůsobivost a předstíranou zbožnost, pokud si to žádá přežití či výhoda." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_tax_nonbelievers: "Tento obřad považuje nevíru za břemeno splácené tributem a světskými poplatky upevňuje posvátnou hierarchii." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_asceticism: "Tento obřad usiluje o svatost skrze sebezapření, disciplínu a trpělivé ovládnutí tužeb." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_bhakti: "Tento obřad staví do středu vroucí oddanost a učí, že láskyplné odevzdání přibližuje duši božstvu nejvíce." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_dharmic_pacifism: "Tento obřad si cení neubližování a sebeovládání a považuje mír za vyšší disciplínu než hněv." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_inner_journey: "Tento obřad obrací pozornost dovnitř a hledá probuzení skrze rozjímání, disciplínu a proměnu sebe sama." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_ritual_hospitality: "Tento obřad považuje pohostinnost za svatou povinnost, která pod posvátnými zvyklostmi svazuje hostitele s hostem." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_adorcism: "Tento obřad si uctivě nakloní duchy a doufá, že získá jejich přízeň a odvrátí jejich hněv." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_ancestor_worship: "Tento obřad hledá uctívané zesnulé, aby od nich získal vedení, požehnání a spojení se živými." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_astrology: "Tento obřad čte význam v nebesích a důvěřuje hvězdám, že odhalí řád, osud i správný čas." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_hedonistic: "Tento obřad přijímá bujaré oslavy, přemíru a posvěcení potěšení při společném uctívání." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_human_sacrifice: "Tento obřad považuje krvavou oběť za děsivou, avšak posvátnou dohodu mezi smrtelníkem a božstvem." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_mystical_birthright: "Tento obřad věří, že osud už od narození označí některé duše za nositele posvátné moci a duchovní velikosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_ritual_celebrations: "Tento obřad vyzdvihuje společné veselí a sváteční slavnosti jako nejplnější výraz uctívání." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_sacred_childbirth: "Tento obřad obklopuje porod úctou a považuje mateřství i nový život za posvátné." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_sanctity_of_nature: "Tento obřad spatřuje posvátno v živém světě a ctí růst, plodnost i nespoutané stvoření." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_sun_worship: "Tento obřad uctívá slunce jako zdroj života a znamení řádu, záře a božské přízně." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_warmonger: "Tento obřad velebí dobývání a bojovnou sílu a očekává, že věřící prokážou svou hodnotu ve válce." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_gruesome_festivals: "Tento obřad přijímá děsivé slavnosti a proměňuje strach, krev a podívanou v posvátné představení." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_cthonic_redoubts: "Tento obřad uctívá výšiny a skrytá útočiště země jako místa neobyčejné svatosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_household_gods: "Tento obřad klade důraz na domov a svěřuje krb, rodinu i každodenní zbožnost pod božskou ochranu." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_sinitic_syncretism: "Tento obřad proplétá svou tradici se sinickým myšlením a hledá soulad namísto rozkolu." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_eastern_syncretism: "Tento obřad ochotně přijímá východní učení a ve cizí moudrosti spatřuje ozvěny posvátné pravdy." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_unreformed_syncretism: "Tento obřad volně čerpá ze starších praktik a začleňuje dávné obřady do nového posvátného celku." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_christian_syncretism: "Tento obřad začleňuje křesťanské učení do svého posvátného rámce, místo aby je zcela odmítal." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_islamic_syncretism: "Tento obřad přejímá prvky islámské víry a zvyků a nachází využitelnou pravdu v sousedním zjevení." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_jewish_syncretism: "Tento obřad začleňuje židovskou tradici, zákon i paměť do svého chápání posvátna." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_exaltation_of_pain: "Tento obřad považuje bolest za očišťující a ve vytrvalosti i přijatém utrpení spatřuje projev oddanosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_natural_primitivism: "Tento obřad nedůvěřuje přebujelé civilizaci a ctí drsnější a prvotnější způsob života." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_pursuit_of_power: "Tento obřad žehná ctižádosti a světskému vlivu a považuje moc za vhodný nástroj svatosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_ritual_cannibalism: "Tento obřad začleňuje pojídání lidského masa do tabuizovaného uctívání a posvátné hrůzy." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_sacred_shadows: "Tento obřad se halí do tajemství a posvěcuje skrytost, soumrak i to, co zůstává většině utajeno." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_polyamory: "Tento obřad žehná více milostným vztahům současně a odmítá omezovat posvátnou intimitu na jediné pouto." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_sacrificial_ceremonies: "Tento obřad klade slavnostní oběť do středu uctívání a spojuje ji se smlouvou i přízní." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_megaliths: "Tento obřad vyznačuje posvátná místa trvalými kameny a důvěřuje, že památníky ukotví vzpomínky i zbožnost." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_fp3_fedayeen: "Tento obřad posvěcuje skrytost, pronikání mezi nepřátele a násilí spojené se sebeobětováním ve službě vyššímu cíli." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_communal_possessions: "Tento obřad klade menší důraz na soukromé bohatství a vybízí věřící ke společnému vlastnictví zdrojů." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_pure_land: "Tento obřad upíná naději k požehnané říši za hranicemi utrpení, do níž lze dojít skrze důvěru, vzpomínání a oddanost." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_no_mind: "Tento obřad hledá jasnost přesahující svazující myšlení a cvičí sebe sama k prázdnému a jasnému vědomí." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_mountain_worship: "Tento obřad se obrací k vysokým místům, která jsou blíže božstvu, a uctívá vrcholky i výšiny." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_extinction_of_dharma: "Tento obřad chápe svět jako zachvácený zkažeností a ospravedlňuje nelítostné násilí na obranu pravdy." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_cranial_trophies: "Tento obřad považuje ostatky nepřátel za posvátný důkaz vítězství a děsivé prestiže." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_pursuit_of_knowledge: "Tento obřad vyzdvihuje vzdělávání jako posvátnou práci a hledá pravdu studiem, debatou a ukázněným bádáním." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_benevolent_governance: "Tento obřad měří svatost také spravedlivou vládou, řádnou správou a péčí o říši." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_filial_piety: "Tento obřad učí, že úcta k rodičům a starším je základem mravního i posvátného řádu." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_harmonious_society: "Tento obřad si cení rovnováhy, slušnosti a společenského souladu jako odrazů kosmického řádu." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_sacred_destruction: "Tento obřad chápe svaté ničení jako očišťující a činí ze zkázy samotné nástroj posvátné obnovy." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_preservation: "Tento obřad si cení vytrvalosti, kontinuity a pečlivé ochrany toho, co mu bylo svěřeno." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_takamin: "Tento obřad uctivě a s bázní zachází s medvědem i spřízněnými silami divočiny." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_peace_of_god: "Tento obřad se snaží omezit násilí a stanovuje posvátné meze, kdy je správné prolít krev." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_dulia: "Tento obřad ctí světce a svaté vzory a uctívá jejich památku, aniž by je ztotožňoval s božstvem." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_transubstantiation: "Tento obřad považuje svatá tajemství za skutečně proměňující a staví svátost do středu božské přítomnosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_ora_et_labora: "Tento obřad spojuje modlitbu s prací a učí, že ukázněná práce se může sama stát projevem zbožnosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_hyperdulia: "Tento obřad vyzdvihuje výjimečnou úctu k nejposvátnější přímluvkyni nad běžné řady světců." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_simony: "Tento obřad přijímá, že posvátný úřad, patronát a světské bohatství nelze snadno oddělit." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_monophysitism: "Tento obřad hlásá jednotu Kristovy přirozenosti a odmítá příliš ostře rozdělovat božské tajemství." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_acts_of_apostles: "Tento obřad se řídí vzorem apoštolské obce, její dobročinnosti a společného života prvních věřících." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_purgatory: "Tento obřad učí, že mnoho duší je po smrti očišťováno, než mohou dosáhnout dokonalé blaženosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_be_fruitful_and_multiply: "Tento obřad vyzdvihuje rodinu, plození a přivádění nového života na svět jako svaté povinnosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_apostolic_succession: "Tento obřad zakládá autoritu na nepřerušeném řetězci předávání sahajícím až k apoštolům." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_confession: "Tento obřad si cení otevřeného pokání a rozhřešení a věří, že vyslovení hříchu může být počátkem uzdravení." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_original_sin: "Tento obřad považuje lidskou slabost za prvotní a trvá na tom, že žádná duše nevstupuje na svět nedotčena." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_celestial_hierarchy: "Tento obřad si představuje kosmos uspořádaný do posvátných řádů, z nichž každý odráží božský záměr." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_miles_christi: "Tento obřad představuje věřící jako vojáky posvátna, povolané k obraně pravdy s ukázněnou horlivostí." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_scholasticism: "Tento obřad prohlubuje víru argumentací, komentáři a smiřováním rozumu s vírou." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_adoptionism: "Tento obřad zdůrazňuje oslavení a božské synovství způsobem, který potlačuje věčné rozlišení." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_love_thy_neighbour: "Tento obřad staví milosrdenství a lásku k bližnímu do středu každodenního náboženského života." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_divine_liturgy: "Tento obřad vyzdvihuje slavnostní liturgii a považuje řádnou bohoslužbu za nejjasnější okno k božství." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_miaphysitism: "Tento obřad učí o neoddělitelném spojení božství a lidství v jediném tajemství Krista." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_hesychasm: "Tento ritus usiluje o sjednocení prostřednictvím ticha, nehybnosti a vnitřního opakování svaté modlitby." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_anachoresis: "Tento ritus ctí odvrácení se od světa a hledá svatost v samotě, strádání a odloučení." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_mortification_of_the_flesh: "Tento ritus usiluje o svatost prostřednictvím tělesného strádání a podřizuje tělo duchovním cílům." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_holy_myron: "Tento ritus klade zvláštní důraz na svaté pomazání a považuje posvátný olej za pečeť boží milosti." # todo: NEW TRANSLATION
 generic_rite_focus_tenet_khachkar: "Tento ritus posvěcuje tesané kamenné kříže a trvalé památníky jako veřejná svědectví o posvátném." # todo: NEW TRANSLATION
