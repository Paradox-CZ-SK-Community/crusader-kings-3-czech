 roman_rite_desc: "Římský ritus je liturgickou tradicí římské církve, utvářenou latinskou teologií, právní autoritou a důrazem na svátostnou kázeň, církevní hierarchii a institucionální jednotu." # todo: NEW TRANSLATION
