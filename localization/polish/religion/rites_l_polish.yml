 mozarabic_church_adherent_plural: "Mozarabové" # todo: NEW TRANSLATION
 mozarabic_church_desc: "Mozarabský ritus, který vychází z raných iberských ritů, si po staletích islámské nadvlády zachovává jistou nezávislost na Římu. Dlouhé soužití s jinými vyznáními vedlo k toleranci vůči odlišnostem, kterou přísnější sekty postrádají." # todo: NEW TRANSLATION
 ambrosian_rite: "Ambrosiánský ritus" # todo: NEW TRANSLATION
 ambrosian_rite_adj: "Ambrosiánský" # todo: NEW TRANSLATION
 ambrosian_rite_adherent: "Ambrosiánský křesťan" # todo: NEW TRANSLATION
 ambrosian_rite_adherent_plural: "Ambrosiánští křesťané" # todo: NEW TRANSLATION
 ambrosian_rite_desc: "Ambrosiánský ritus je vlastní milánské arcidiecézi již od dob jejího slavného biskupa sv. Ambrože. Zachovává si vlastní liturgii a zpěvy i teologickou tradici, která si cení myšlenek sv. Augustina z Hippo." # todo: NEW TRANSLATION
 beneventan_rite: "Beneventský ritus" # todo: NEW TRANSLATION
 beneventan_rite_adj: "Beneventský" # todo: NEW TRANSLATION
 beneventan_rite_adherent: "Beneventský křesťan" # todo: NEW TRANSLATION
 beneventan_rite_adherent_plural: "Beneventští křesťané" # todo: NEW TRANSLATION
 beneventan_rite_desc: "Liturgická tradice lombardského jihu, jejímž střediskem je Benevento a velké opatství v Montecassinu. Její charakteristické zpěvy a obřady ji odlišují od římské praxe, která na tento ritus hledí se stále větším podezřením." # todo: NEW TRANSLATION
 carolingian_christianity: "Karolinské křesťanství" # todo: NEW TRANSLATION
 carolingian_christianity_adj: "Karolinské" # todo: NEW TRANSLATION
 carolingian_christianity_adherent: "Karolinec" # todo: NEW TRANSLATION
 carolingian_christianity_adherent_plural: "Karolinci" # todo: NEW TRANSLATION
 carolingian_christianity_desc: "Podoba křesťanství, která se rozvinula za vlády karolinské dynastie a vyznačuje se důrazem na mnišství a misijní činnost." # todo: NEW TRANSLATION
 byzantine_rite: "Řecký ritus" # todo: NEW TRANSLATION
 byzantine_rite_adj: "Řecký ritus" # todo: NEW TRANSLATION
 byzantine_rite_adherent: "Řecký křesťan" # todo: NEW TRANSLATION
 byzantine_rite_adherent_plural: "Řečtí křesťané" # todo: NEW TRANSLATION
 byzantine_rite_desc: "Konstantinopolský patriarchát je jedním z nejvýznamnějších center východního pravoslavného křesťanství, proslulým bohatou teologickou tradicí a historickým vlivem. Řecký ritus vychází přímo z tamního patriarchátu." # todo: NEW TRANSLATION
 antiochian_rite: "Antiochijský ritus" # todo: NEW TRANSLATION
 antiochian_rite_adj: "Antiochijský" # todo: NEW TRANSLATION
 antiochian_rite_adherent: "Antiochijský křesťan" # todo: NEW TRANSLATION
 antiochian_rite_adherent_plural: "Antiochijští křesťané" # todo: NEW TRANSLATION
 antiochian_rite_desc: "Antiochijský patriarchát je jedním z nejstarších křesťanských společenství, založeným sv. Petrem a sv. Pavlem. Jeho západosyrská tradice, nazývaná „jakobitská“ podle Jakuba Baradaia, který církev reorganizoval, zastává miafyzitské učení a starobylou liturgii sv. Jakuba." # todo: NEW TRANSLATION
 slavic_rite: "Slovanský ritus" # todo: NEW TRANSLATION
 slavic_rite_adj: "Slovanský" # todo: NEW TRANSLATION
 slavic_rite_adherent: "Slovanský křesťan" # todo: NEW TRANSLATION
 slavic_rite_adherent_plural: "Slovanští křesťané" # todo: NEW TRANSLATION
 slavic_rite_desc: "Tento ritus přinesli slovanským národům Cyril a Metoděj. Zahrnuje prvky byzantské liturgie přizpůsobené slovanským jazykům a kultuře prostřednictvím hlaholice." # todo: NEW TRANSLATION
 georgian_rite: "Gruzínský ritus" # todo: NEW TRANSLATION
 georgian_rite_adj: "Gruzínský" # todo: NEW TRANSLATION
 georgian_rite_adherent: "Gruzínský" # todo: NEW TRANSLATION
 georgian_rite_adherent_plural: "Gruzínci" # todo: NEW TRANSLATION
 georgian_rite_desc: "Gruzínský ritus představuje křesťanské tradice Gruzie, pro něž je charakteristická svébytná liturgie, církevní dědictví a úzké vazby na východní ortodoxní teologii a praxi." # todo: NEW TRANSLATION
 coptic_rite: "Koptský" # todo: NEW TRANSLATION
 coptic_rite_adj: "Koptský" # todo: NEW TRANSLATION
 coptic_rite_adherent: "Kopt" # todo: NEW TRANSLATION
 coptic_rite_adherent_plural: "Koptové" # todo: NEW TRANSLATION
 coptic_rite_desc: "Koptská církev, jejíž počátky sahají ke svatému Markovi Evangelistovi, je proslulá tím, že byla kolébkou křesťanského mnišství a zároveň udržuje dlouhou tradici podpory vzdělanosti a filozofie." # todo: NEW TRANSLATION
 ethiopian_rite: "Ge'ez" # todo: NEW TRANSLATION
 ethiopian_rite_adj: "Ge'ez" # todo: NEW TRANSLATION
 ethiopian_rite_adherent: "Ge'ez" # todo: NEW TRANSLATION
 ethiopian_rite_adherent_plural: "Křesťané Ge'ez" # todo: NEW TRANSLATION
 ethiopian_rite_desc: "Tato starobylá křesťanská tradice, soustředěná na etiopské vysočině a zakořeněná v dědictví Aksúmu, se od ostatních alexandrijských církví liší širším biblickým kánonem, silnou mnišskou tradicí a smlouvou utvářenou solomonským královským dědictvím." # todo: NEW TRANSLATION
 armenian_rite: "Apoštolský" # todo: NEW TRANSLATION
 armenian_rite_adj: "Apoštolský" # todo: NEW TRANSLATION
 armenian_rite_adherent: "Apoštolský" # todo: NEW TRANSLATION
 armenian_rite_adherent_plural: "Apoštolští" # todo: NEW TRANSLATION
 armenian_rite_desc: "Arménská apoštolská církev, založená apoštoly Bartolomějem a Tadeášem, rychle získala v oblasti stoupence a dovedla Arménské království k tomu, aby se stalo vůbec prvním státem, který přijal křesťanství za své oficiální náboženství." # todo: NEW TRANSLATION
 apostolic_religious_head_title: "Katolikos" # todo: NEW TRANSLATION
 apostolic_religious_head_title_plural: "Katolikové" # todo: NEW TRANSLATION
 apostolic_religious_head_title_name: "Církev" # todo: NEW TRANSLATION
 nabi: "Nabi" # todo: NEW TRANSLATION
 nabi_adj: "Nabi" # todo: NEW TRANSLATION
 nabi_adherent: "Nabi" # todo: NEW TRANSLATION
 nabi_adherent_plural: "Nabiové" # todo: NEW TRANSLATION
 nabi_desc: "Jak je výslovně uvedeno ve svatém Koránu, nabi je člověk vyvolený Všemohoucím, aby předával Jeho poselství a připomínal lidem Den, kdy předstoupí před Něj a budou se zodpovídat za své činy. Podle základní víry byl prorok Muhammad posledním z nich." # todo: NEW TRANSLATION
 sahabah: "Sahábové" # todo: NEW TRANSLATION
 sahabah_adj: "Sahábský" # todo: NEW TRANSLATION
 sahabah_adherent: "Saháb" # todo: NEW TRANSLATION
 sahabah_adherent_plural: "Sahábové" # todo: NEW TRANSLATION
 sahabah_desc: "Byli také známí jako Muhammadovi druhové a šlo o muslimské stoupence, kteří se s ním během jeho života setkali nebo ho spatřili. Druhové hráli významnou roli v raném boji muslimů, jejich společnosti, předávání hadísů i správě." # todo: NEW TRANSLATION
 tabiun: "Tábi'ún" # todo: NEW TRANSLATION
 tabiun_adj: "Tábi'únský" # todo: NEW TRANSLATION
 tabiun_adherent: "Tábi'" # todo: NEW TRANSLATION
 tabiun_adherent_plural: "Tábi'úni" # todo: NEW TRANSLATION
 tabiun_desc: "Takto se označuje generace muslimů, která následovala druhy (saháby) proroka Muhammada a přijala jejich učení z druhé ruky ještě před vznikem sunnitských škol v pozdějších staletích." # todo: NEW TRANSLATION
 hanafi: "Hanafí" # todo: NEW TRANSLATION
 hanafi_adj: "Hanafí" # todo: NEW TRANSLATION
 hanafi_adherent: "Hanafí" # todo: NEW TRANSLATION
 hanafi_adherent_plural: "Hanafíové" # todo: NEW TRANSLATION
 hanafi_desc: "Tento směr vychází z učení právníka a teologa Abú Hanífy, který systematizoval využívání rozumového úsudku. Hanafíjská právní nauka čerpá zákony především z Koránu, sunny, učenecké shody a analogického úsudku." # todo: NEW TRANSLATION
 hanbali: "Hanbalí" # todo: NEW TRANSLATION
 hanbali_adj: "Hanbalí" # todo: NEW TRANSLATION
 hanbali_adherent: "Hanbalí" # todo: NEW TRANSLATION
 hanbali_adherent_plural: "Hanbalíové" # todo: NEW TRANSLATION
 hanbali_desc: "Hanbalíjská škola je nejmenší ze čtyř hlavních škol sunnitského islámského práva a vychází z učení Ahmada ibn Hanbala. Na rozdíl od ostatních hanbalíjci odmítají kodifikovat právo do uceleného systému a za nejvyšší zdroje považují Korán a hadísy." # todo: NEW TRANSLATION
 maliki: "Málikí" # todo: NEW TRANSLATION
 maliki_adj: "Málikí" # todo: NEW TRANSLATION
 maliki_adherent: "Málikí" # todo: NEW TRANSLATION
 maliki_adherent_plural: "Málikíové" # todo: NEW TRANSLATION
 maliki_desc: "Jedna ze čtyř hlavních škol islámského práva v rámci sunnitského islámu. V 8. století ji založil Málik ibn Anas. Málikíjská právní škola se od ostatních sunnitských škol liší především zdroji, z nichž odvozuje svá právní rozhodnutí." # todo: NEW TRANSLATION
 shafii: "Šáfi'í" # todo: NEW TRANSLATION
 shafii_adj: "Šáfi'í" # todo: NEW TRANSLATION
 shafii_adherent: "Šáfi'í" # todo: NEW TRANSLATION
 shafii_adherent_plural: "Šáfi'íové" # todo: NEW TRANSLATION
 shafii_desc: "Škola al-Šáfi'ího, muslimského učence a právníka z počátku 9. století, známého jako „otec muslimského práva“. Základem šáfi'íjského myšlení je, že každý čin věřícího podléhá ustanovení zjeveného zákona, šarí'y." # todo: NEW TRANSLATION
 ismaili: "Ismá'ílismus" # todo: NEW TRANSLATION
 ismaili_adj: "Ismá'ílí" # todo: NEW TRANSLATION
 ismaili_adherent: "Ismá'ílí" # todo: NEW TRANSLATION
 ismaili_adherent_plural: "Ismá'ílíové" # todo: NEW TRANSLATION
 ismaili_desc: "Ší'itský ritus, který považuje za pravou linii imámů — těch obdařených božským poznáním a neomylností — posloupnost vedoucí přes Ismá'íla ibn Dža'fara. Jeho příslušníci jsou známí také jako sedmistoví, protože Ismá'íl byl po Muhammadovi sedmým imámem." # todo: NEW TRANSLATION
 qarmatian: "Karmatské učení" # todo: NEW TRANSLATION
 qarmatian_adj: "Karmatský" # todo: NEW TRANSLATION
 qarmatian_adherent: "Karmat" # todo: NEW TRANSLATION
 qarmatian_adherent_plural: "Karmaté" # todo: NEW TRANSLATION
 qarmatian_desc: "Větev ismá'ílismu, která začlenila prvky zoroastrismu. Bůh předurčil počet imámů na sedm, a proto nemohl být žádný další imám, dokud se sedmý imám — Muhammad ibn Ismá'íl — nevrátí, aby vedl věřící." # todo: NEW TRANSLATION
 nizari: "Nizárismus" # todo: NEW TRANSLATION
 nizari_adj: "Nizárí" # todo: NEW TRANSLATION
 nizari_adherent: "Nizárí" # todo: NEW TRANSLATION
 nizari_adherent_plural: "Nizáríové" # todo: NEW TRANSLATION
 nizari_desc: "Racionalistický ritus, který klade důraz na rozum při výkladu Koránu a hadísů. Imámát se dědí a jeho příslušníci odvozují linii nástupnictví od Alího." # todo: NEW TRANSLATION
 zayidi: "Zajdismus" # todo: NEW TRANSLATION
 zayidi_adj: "Zajdí" # todo: NEW TRANSLATION
 zayidi_adherent: "Zajdí" # todo: NEW TRANSLATION
 zayidi_adherent_plural: "Zajdíové" # todo: NEW TRANSLATION
 zayidi_desc: "Pravý imám není neomylný, nýbrž je vymezen bojem proti korupci a zlu. Zajdíové proto věří, že Zajd ibn Alí byl právoplatným nástupcem v imámátu, neboť se vzbouřil proti Umajjovcům." # todo: NEW TRANSLATION
 imami: "Imámismus" # todo: NEW TRANSLATION
 imami_adj: "Imámí" # todo: NEW TRANSLATION
 imami_adherent: "Imámí" # todo: NEW TRANSLATION
 imami_adherent_plural: "Imámíové" # todo: NEW TRANSLATION
 imami_desc: "Imámíové věří, že bylo prorokováno, že ummu povede dvanáct imámů, a že dvanáctý imám, imám Zaman, čeká na svůj návrat, aby vedl muslimy do Soudného dne." # todo: NEW TRANSLATION
 islam_ayatollah: "ajatolláh" # todo: NEW TRANSLATION
 islam_ayatollah_plural: "ajatolláhové" # todo: NEW TRANSLATION
 ghulat: "Ichtíláfismus" # todo: NEW TRANSLATION
 ghulat_adj: "Ichtíláfí" # todo: NEW TRANSLATION
 ghulat_adherent: "Ichtíláfí" # todo: NEW TRANSLATION
 ghulat_adherent_plural: "Ichtíláfíové" # todo: NEW TRANSLATION
 ghulat_desc: "Ichtíláfíové věří v božskou podstatu neomylných imámů, počínaje Alím. Bůh je nejen ustanovil a inspiroval, ale také v nich částečně přebývá, aby vedl jejich činy a jejich prostřednictvím celou ummu." # todo: NEW TRANSLATION
 alawite: "Alavismus" # todo: NEW TRANSLATION
 alawite_adj: "Alavitský" # todo: NEW TRANSLATION
 alawite_adherent: "Alavita" # todo: NEW TRANSLATION
 alawite_adherent_plural: "Alavité" # todo: NEW TRANSLATION
 alawite_desc: "Alavitské náboženské učení je tajné a Korán je pouze jedním z jejich posvátných textů. Kromě víry v posloupnost imámů skrze Alího věří alavité také v reinkarnaci a v to, že všechny bytosti byly hvězdami svrženými z nebe, které si nyní musí znovu zasloužit své místo tím, že budou žít po sobě jdoucí dobré a věrné životy." # todo: NEW TRANSLATION
 alevi: "Alevitismus" # todo: NEW TRANSLATION
 alevi_adj: "Alevi" # todo: NEW TRANSLATION
 alevi_adherent: "Alevi" # todo: NEW TRANSLATION
 alevi_adherent_plural: "Aleviové" # todo: NEW TRANSLATION
 alevi_desc: "Alevité věří v následnictví Dvanácti imámů, ale řídí se také mnoha dalšími tradicemi popsanými ve sbírce jejich posvátných textů, Buyrucích. Podle alevitské tradice je Bůh Pravdou a Muhammad s Alím jsou jeho projevy ve světě." # todo: NEW TRANSLATION
 alevi_house_of_worship: "cemvi" # todo: NEW TRANSLATION
 alevi_house_of_worship_2: "$alevi_house_of_worship$" # todo: NEW TRANSLATION
 alevi_house_of_worship_3: "$alevi_house_of_worship$" # todo: NEW TRANSLATION
 alevi_house_of_worship_plural: "cemvi" # todo: NEW TRANSLATION
 alevi_religious_text: "Buyruky" # todo: NEW TRANSLATION
 alevi_religious_text_2: "$alevi_religious_text$" # todo: NEW TRANSLATION
 alevi_religious_text_3: "$alevi_religious_text$" # todo: NEW TRANSLATION
 ibadi: "Muhakkima" # todo: NEW TRANSLATION
 ibadi_adj: "Muhakkima" # todo: NEW TRANSLATION
 ibadi_adherent: "Muhakkima" # todo: NEW TRANSLATION
 ibadi_adherent_plural: "Muhakkimové" # todo: NEW TRANSLATION
 ibadi_desc: "Muhakkimové věří, že islámská obec nepotřebuje chalífu ani imáma, pokud se nenajde vhodný kandidát. Odmítají uznávat rodovou linii Alího i nástupce Abú Bakra jako vůdce, kteří by měli nárok na vedení už ze své podstaty, a zdůrazňují spravedlivé jednání a konsenzus." # todo: NEW TRANSLATION
 azariqa: "Azraqismus" # todo: NEW TRANSLATION
 azariqa_adj: "Azariqa" # todo: NEW TRANSLATION
 azariqa_adherent: "Azariqa" # todo: NEW TRANSLATION
 azariqa_adherent_plural: "Azarikové" # todo: NEW TRANSLATION
 azariqa_desc: "Azarikové neuznávají žádného důstojného nástupce Muhammada a považují za své právo i povinnost bojovat proti každému vůdci, který se neřídí hodnotami jejich víry. Jakýkoli rozdíl ve výkladu víry totiž podle nich z člověka činí nevěřícího." # todo: NEW TRANSLATION
 najdat: "Najdatismus" # todo: NEW TRANSLATION
 najdat_adj: "Najdat" # todo: NEW TRANSLATION
 najdat_adherent: "Najdati" # todo: NEW TRANSLATION
 najdat_adherent_plural: "Najdatové" # todo: NEW TRANSLATION
 najdat_desc: "Stoupenci najdatské větve cháridžovců pevně věří, že muslimské vůdce má vybírat obec věřících na základě konsenzu. Vůdce není neomylný, ale prostřednictvím obce je vyvolen Bohem." # todo: NEW TRANSLATION
 sufri: "Sufrismus" # todo: NEW TRANSLATION
 sufri_adj: "Sufri" # todo: NEW TRANSLATION
 sufri_adherent: "Sufri" # todo: NEW TRANSLATION
 sufri_adherent_plural: "Sufriové" # todo: NEW TRANSLATION
 sufri_desc: "Sufriové věří v božské vedení a vůdcovství založené na výkladu Božího slova, nikoli na dědičném nároku. Boží vůle se projevuje jako vůle ummy, pokud její příslušníci dobře znají Korán." # todo: NEW TRANSLATION
 hafizi: "Hafizi" # todo: NEW TRANSLATION
 hafizi_adj: "Hafizi" # todo: NEW TRANSLATION
 hafizi_adherent: "Hafizi" # todo: NEW TRANSLATION
 hafizi_adherent_plural: "Hafizové" # todo: NEW TRANSLATION
 hafizi_desc: "Hafizové dávají přednost podpoře toho, koho považují za pravého chalífu, a zároveň odolávají jakýmkoli pokusům o jeho sesazení či svržení. V porážce je definuje povstání za spravedlivou věc, ve vítězství pak hrdé následování vůle jejich vůdce." # todo: NEW TRANSLATION
