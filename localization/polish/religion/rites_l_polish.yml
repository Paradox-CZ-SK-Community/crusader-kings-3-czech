 insular_celtic_desc: "Venkovská církev, která se před několika staletími odchýlila od římskokatolické ortodoxie. Ostrovní ritus na naléhání své mateřské církve ztratil mnoho ze svých kdysi charakteristických rysů. Stále však klade větší důraz na pokání a mnišství a zachovává mnoho tradičních keltských manželských zvyků, které jsou zbytku křesťanstva cizí." # todo: NEW TRANSLATION
