 generic_tenet_focus_tenet_esotericism: "Zásada [GetTenetType('tenet_esotericism').GetName( GetPlayer.GetRite )] si cení skryté moudrosti, zasvěcení a pravd odhalených pouze připraveným."
 generic_tenet_focus_tenet_legalism: "Zásada [GetTenetType('tenet_legalism').GetName( GetPlayer.GetRite )] zakládá svatost na jasných předpisech, spravedlivém soudu a ukázněném uspořádání života."
 generic_tenet_focus_tenet_literalism: "Zásada [GetTenetType('tenet_literalism').GetName( GetPlayer.GetRite )] se pevně drží posvátných slov a nedůvěřuje volnému výkladu ani zděděným kompromisům."
 generic_tenet_focus_tenet_reincarnation: "Zásada [GetTenetType('tenet_reincarnation').GetName( GetPlayer.GetRite )] chápe pouť duše jako koloběh, v němž každý život utváří ten následující."
 generic_tenet_focus_tenet_religious_legal_pronouncements: "Zásada [GetTenetType('tenet_religious_legal_pronouncements').GetName( GetPlayer.GetRite )] přisuzuje posvátným rozhodnutím a slavnostním soudům trvalou duchovní autoritu."
 generic_tenet_focus_tenet_struggle_submission: "Zásada [GetTenetType('tenet_struggle_submission').GetName( GetPlayer.GetRite )] učí, že víra se prokazuje strádáním, dobýváním a podrobením bezbožných."
 generic_tenet_focus_tenet_false_conversion_sanction: "Zásada [GetTenetType('tenet_false_conversion_sanction').GetName( GetPlayer.GetRite )] připouští skrývání skutečného přesvědčení a vnější přetvářku, vyžaduje-li to přežití nebo vlastní prospěch."
 generic_tenet_focus_tenet_tax_nonbelievers: "Zásada [GetTenetType('tenet_tax_nonbelievers').GetName( GetPlayer.GetRite )] považuje nevíru za závazek odvádět tribut a upevňuje posvátnou hierarchii světskými odvody."
 generic_tenet_focus_tenet_asceticism: "Zásada [GetTenetType('tenet_asceticism').GetName( GetPlayer.GetRite )] hledá svatost v odříkání, kázni a trpělivém ovládání touhy."
 generic_tenet_focus_tenet_bhakti: "Zásada [GetTenetType('tenet_bhakti').GetName( GetPlayer.GetRite )] staví do středu upřímnou oddanost a učí, že odevzdání z lásky přivádí duši nejblíže k božství."
 generic_tenet_focus_tenet_dharmic_pacifism: "Zásada [GetTenetType('tenet_dharmic_pacifism').GetName( GetPlayer.GetRite )] si cení neubližování a sebeovládání a považuje mír za vyšší projev kázně než hněv."
 generic_tenet_focus_tenet_inner_journey: "Zásada [GetTenetType('tenet_inner_journey').GetName( GetPlayer.GetRite )] obrací pozornost do nitra a hledá probuzení v rozjímání, kázni a proměně vlastního já."
 generic_tenet_focus_tenet_ritual_hospitality: "Zásada [GetTenetType('tenet_ritual_hospitality').GetName( GetPlayer.GetRite )] považuje přijímání cizinců za posvátnou povinnost, která spojuje hostitele s hostem pod ochranou posvátného zvyku."
 generic_tenet_focus_tenet_adorcism: "Zásada [GetTenetType('tenet_adorcism').GetName( GetPlayer.GetRite )] se s úctou obrací k duchům v naději, že získá jejich přízeň a odvrátí jejich hněv."
 generic_tenet_focus_tenet_ancestor_worship: "Zásada [GetTenetType('tenet_ancestor_worship').GetName( GetPlayer.GetRite )] hledá u ctěných zesnulých vedení, požehnání a pouto mezi mrtvými a živými."
 generic_tenet_focus_tenet_astrology: "Zásada [GetTenetType('tenet_astrology').GetName( GetPlayer.GetRite )] vyčítá smysl z nebes a důvěřuje hvězdám, že odhalí řád, osud i vhodný okamžik."
 generic_tenet_focus_tenet_hedonistic: "Zásada [GetTenetType('tenet_hedonistic').GetName( GetPlayer.GetRite )] přijímá veselí, přemíru a posvěcení rozkoše při společných bohoslužbách."
 generic_tenet_focus_tenet_human_sacrifice: "Zásada [GetTenetType('tenet_human_sacrifice').GetName( GetPlayer.GetRite )] chápe krvavou oběť jako děsivou, avšak posvátnou úmluvu mezi smrtelníky a božstvem."
 generic_tenet_focus_tenet_mystical_birthright: "Zásada [GetTenetType('tenet_mystical_birthright').GetName( GetPlayer.GetRite )] věří, že osud již od narození předurčuje některé duše k posvátné moci a duchovní velikosti."
 generic_tenet_focus_tenet_ritual_celebrations: "Zásada [GetTenetType('tenet_ritual_celebrations').GetName( GetPlayer.GetRite )] vyzdvihuje společné veselí a posvátné slavnosti jako nejplnější projev uctívání."
 generic_tenet_focus_tenet_sacred_childbirth: "Zásada [GetTenetType('tenet_sacred_childbirth').GetName( GetPlayer.GetRite )] obklopuje zrození úctou a přikládá mateřství i novému životu posvátný význam."
 generic_tenet_focus_tenet_sanctity_of_nature: "Zásada [GetTenetType('tenet_sanctity_of_nature').GetName( GetPlayer.GetRite )] nachází posvátno v živém světě a uctívá růst, plodnost a nespoutané stvoření."
 generic_tenet_focus_tenet_sun_worship: "Zásada [GetTenetType('tenet_sun_worship').GetName( GetPlayer.GetRite )] ctí planoucí nebeský kotouč jako životodárné znamení řádu, záře a božské přízně."
 generic_tenet_focus_tenet_warmonger: "Zásada [GetTenetType('tenet_warmonger').GetName( GetPlayer.GetRite )] oslavuje dobývání a válečnou zdatnost a očekává, že věřící svou hodnotu prokáží v boji."
 generic_tenet_focus_tenet_gruesome_festivals: "Zásada [GetTenetType('tenet_gruesome_festivals').GetName( GetPlayer.GetRite )] přijímá hrůzné slavnosti a proměňuje strach, krev a podívanou v posvátný obřad."
 generic_tenet_focus_tenet_cthonic_redoubts: "Zásada [GetTenetType('tenet_cthonic_redoubts').GetName( GetPlayer.GetRite )] uctívá výšiny a skrytá útočiště země jako místa mimořádné svatosti."
 generic_tenet_focus_tenet_household_gods: "Zásada [GetTenetType('tenet_household_gods').GetName( GetPlayer.GetRite )] staví do středu domov a svěřuje krb, rodinu i každodenní zbožnost do božské ochrany."
 generic_tenet_focus_tenet_sinitic_syncretism: "Zásada [GetTenetType('tenet_sinitic_syncretism').GetName( GetPlayer.GetRite )] proplétá svou tradici se sinickým myšlením a hledá soulad namísto rozkolu."
 generic_tenet_focus_tenet_eastern_syncretism: "Zásada [GetTenetType('tenet_eastern_syncretism').GetName( GetPlayer.GetRite )] ochotně přijímá vzdálené nauky a v cizí moudrosti spatřuje ozvěnu posvátné pravdy."
 generic_tenet_focus_tenet_unreformed_syncretism: "Zásada [GetTenetType('tenet_unreformed_syncretism').GetName( GetPlayer.GetRite )] volně čerpá ze starších praktik a začleňuje dávné obřady do nového posvátného celku."
 generic_tenet_focus_tenet_christian_syncretism: "Zásada [GetTenetType('tenet_christian_syncretism').GetName( GetPlayer.GetRite )] začleňuje Kristovo učení do svého posvátného rámce, místo aby je zcela odmítala."
 generic_tenet_focus_tenet_islamic_syncretism: "Zásada [GetTenetType('tenet_islamic_syncretism').GetName( GetPlayer.GetRite )] přejímá islámskou víru a zvyky a nachází užitečnou pravdu ve zjevení sousedního náboženství."
 generic_tenet_focus_tenet_jewish_syncretism: "Zásada [GetTenetType('tenet_jewish_syncretism').GetName( GetPlayer.GetRite )] začleňuje hebrejskou tradici, právo a paměť do svého chápání posvátna."
 generic_tenet_focus_tenet_exaltation_of_pain: "Zásada [GetTenetType('tenet_exaltation_of_pain').GetName( GetPlayer.GetRite )] považuje bolest za očistnou a prokazuje oddanost vytrvalostí a dobrovolným přijetím utrpení."
 generic_tenet_focus_tenet_natural_primitivism: "Zásada [GetTenetType('tenet_natural_primitivism').GetName( GetPlayer.GetRite )] nedůvěřuje přebujelé civilizaci a ctí drsnější, prostší způsob života."
 generic_tenet_focus_tenet_pursuit_of_power: "Zásada [GetTenetType('tenet_pursuit_of_power').GetName( GetPlayer.GetRite )] žehná ctižádosti a světské nadvládě a považuje moc za náležitý nástroj posvátna."
 generic_tenet_focus_tenet_ritual_cannibalism: "Zásada [GetTenetType('tenet_ritual_cannibalism').GetName( GetPlayer.GetRite )] začleňuje požívání lidského masa do zapovězeného uctívání a posvátné hrůzy."
 generic_tenet_focus_tenet_sacred_shadows: "Zásada [GetTenetType('tenet_sacred_shadows').GetName( GetPlayer.GetRite )] se zahaluje tajemstvím a posvěcuje utajení, soumrak a to, co je většině skryto."
 generic_tenet_focus_tenet_polyamory: "Zásada [GetTenetType('tenet_polyamory').GetName( GetPlayer.GetRite )] žehná několika láskám současně a odmítá omezovat posvátnou důvěrnost na jediný svazek."
 generic_tenet_focus_tenet_sacrificial_ceremonies: "Zásada [GetTenetType('tenet_sacrificial_ceremonies').GetName( GetPlayer.GetRite )] staví slavnostní obětování do středu bohoslužby a spojuje je s úmluvou a přízní."
 generic_tenet_focus_tenet_megaliths: "Zásada [GetTenetType('tenet_megaliths').GetName( GetPlayer.GetRite )] vyznačuje posvátná místa trvalým kamenem a důvěřuje památníkům, že uchovají paměť i zbožnost."
 generic_tenet_focus_tenet_fp3_fedayeen: "Zásada [GetTenetType('tenet_fp3_fedayeen').GetName( GetPlayer.GetRite )] posvěcuje nenápadnost, pronikání mezi nepřátele a sebeobětující násilí ve službách vyššího cíle."
 generic_tenet_focus_tenet_communal_possessions: "Zásada [GetTenetType('tenet_communal_possessions').GetName( GetPlayer.GetRite )] upozaďuje soukromé bohatství a vybízí věřící ke společnému vlastnictví prostředků."
 generic_tenet_focus_tenet_pure_land: "Zásada [GetTenetType('tenet_pure_land').GetName( GetPlayer.GetRite )] upíná naději k blažené říši prosté utrpení, do níž vede důvěra, připomínání a oddanost."
 generic_tenet_focus_tenet_no_mind: "Zásada [GetTenetType('tenet_no_mind').GetName( GetPlayer.GetRite )] hledá jasnost za hranicemi ulpívajícího myšlení a kázní vede vlastní já k prázdnému, čistému vědomí."
 generic_tenet_focus_tenet_mountain_worship: "Zásada [GetTenetType('tenet_mountain_worship').GetName( GetPlayer.GetRite )] se obrací k výšinám jako místům bližším božství a činí z vrcholů a hor předměty úcty."
 generic_tenet_focus_tenet_extinction_of_dharma: "Zásada [GetTenetType('tenet_extinction_of_dharma').GetName( GetPlayer.GetRite )] spatřuje svět zaplavený zkažeností a ospravedlňuje nelítostné násilí na obranu pravdy."
 generic_tenet_focus_tenet_cranial_trophies: "Zásada [GetTenetType('tenet_cranial_trophies').GetName( GetPlayer.GetRite )] považuje ostatky nepřátel za posvátný důkaz vítězství a bázeň vzbuzující prestiže."
 generic_tenet_focus_tenet_pursuit_of_knowledge: "Zásada [GetTenetType('tenet_pursuit_of_knowledge').GetName( GetPlayer.GetRite )] vyzdvihuje učenost jako posvátnou práci a hledá pravdu studiem, debatou a ukázněným bádáním."
 generic_tenet_focus_tenet_benevolent_governance: "Zásada [GetTenetType('tenet_benevolent_governance').GetName( GetPlayer.GetRite )] posuzuje svatost také podle spravedlivého panování, řádné správy a péče o panství."
 generic_tenet_focus_tenet_filial_piety: "Zásada [GetTenetType('tenet_filial_piety').GetName( GetPlayer.GetRite )] učí úctě k rodičům a starším jako základu mravního a posvátného řádu."
 generic_tenet_focus_tenet_harmonious_society: "Zásada [GetTenetType('tenet_harmonious_society').GetName( GetPlayer.GetRite )] si cení rovnováhy, náležitého chování a společenského souladu jako odrazů kosmického řádu."
 generic_tenet_focus_tenet_sacred_destruction: "Zásada [GetTenetType('tenet_sacred_destruction').GetName( GetPlayer.GetRite )] spatřuje v posvátném ničení očistu a činí ze samotné zkázy nástroj posvátné obnovy."
 generic_tenet_focus_tenet_preservation: "Zásada [GetTenetType('tenet_preservation').GetName( GetPlayer.GetRite )] si cení vytrvalosti, návaznosti a pečlivého opatrování všeho, co bylo svěřeno do péče."
 generic_tenet_focus_tenet_takamin: "Zásada [GetTenetType('tenet_takamin').GetName( GetPlayer.GetRite )] přistupuje k medvědovi a spřízněným silám divočiny s úctou, bázní a obezřetným respektem."
 generic_tenet_focus_tenet_peace_of_god: "Zásada [GetTenetType('tenet_peace_of_god').GetName( GetPlayer.GetRite )] usiluje o omezení násilí a stanovuje posvátné meze toho, kdy lze právem prolévat krev."
 generic_tenet_focus_tenet_dulia: "Zásada [GetTenetType('tenet_dulia').GetName( GetPlayer.GetRite )] ctí blažené zesnulé a svaté vzory, uchovává jejich památku, ale nestaví je na roveň božství."
 generic_tenet_focus_tenet_transubstantiation: "Zásada [GetTenetType('tenet_transubstantiation').GetName( GetPlayer.GetRite )] přisuzuje svatým tajemstvím skutečnou proměňující moc a staví svátost do středu božské přítomnosti."
 generic_tenet_focus_tenet_ora_et_labora: "Zásada [GetTenetType('tenet_ora_et_labora').GetName( GetPlayer.GetRite )] spojuje zbožnost s námahou a učí, že poctivá práce se sama může stát bohoslužbou."
 generic_tenet_focus_tenet_hyperdulia: "Zásada [GetTenetType('tenet_hyperdulia').GetName( GetPlayer.GetRite )] povyšuje mimořádnou úctu k nejsvětější přímluvkyni nad běžnou úctu ke světcům."
 generic_tenet_focus_tenet_simony: "Zásada [GetTenetType('tenet_simony').GetName( GetPlayer.GetRite )] připouští, že posvátný úřad, patronát a světské bohatství od sebe nelze snadno oddělit."
 generic_tenet_focus_tenet_monophysitism: "Zásada [GetTenetType('tenet_monophysitism').GetName( GetPlayer.GetRite )] hlásá jednotu Kristovy přirozenosti a odmítá příliš ostře rozdělovat božské tajemství."
 generic_tenet_focus_tenet_acts_of_apostles: "Zásada [GetTenetType('tenet_acts_of_apostles').GetName( GetPlayer.GetRite )] si bere za vzor apoštolské společenství, dobročinnost a společný život prvních věřících."
 generic_tenet_focus_tenet_purgatory: "Zásada [GetTenetType('tenet_purgatory').GetName( GetPlayer.GetRite )] učí, že mnoho duší po smrti prochází očistou, než mohou dosáhnout dokonalé blaženosti."
 generic_tenet_focus_tenet_be_fruitful_and_multiply: "Zásada [GetTenetType('tenet_be_fruitful_and_multiply').GetName( GetPlayer.GetRite )] vyzdvihuje rodinu, plození a přivádění nového života na svět jako posvátné povinnosti."
 generic_tenet_focus_tenet_apostolic_succession: "Zásada [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )] zakládá autoritu na nepřerušené posloupnosti předávání sahající až k prvním učedníkům."
 generic_tenet_focus_tenet_confession: "Zásada [GetTenetType('tenet_confession').GetName( GetPlayer.GetRite )] si cení otevřeného pokání a rozhřešení a věří, že vyslovený hřích může být počátkem uzdravení."
 generic_tenet_focus_tenet_original_sin: "Zásada [GetTenetType('tenet_original_sin').GetName( GetPlayer.GetRite )] chápe lidskou slabost jako prvotní a trvá na tom, že žádná duše nepřichází na svět nedotčená."
 generic_tenet_focus_tenet_celestial_hierarchy: "Zásada [GetTenetType('tenet_celestial_hierarchy').GetName( GetPlayer.GetRite )] si představuje vesmír uspořádaný do posvátných stupňů, v nichž každé postavení odráží božský záměr."
 generic_tenet_focus_tenet_miles_christi: "Zásada [GetTenetType('tenet_miles_christi').GetName( GetPlayer.GetRite )] vidí ve věřících vojáky posvátna, povolané bránit pravdu s ukázněnou horlivostí."
 generic_tenet_focus_tenet_scholasticism: "Zásada [GetTenetType('tenet_scholasticism').GetName( GetPlayer.GetRite )] tříbí víru argumentací, výkladem a smiřováním rozumu s vírou."
 generic_tenet_focus_tenet_adoptionism: "Zásada [GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )] zdůrazňuje povýšení a božské synovství způsobem, který upozaďuje věčné rozlišení."
 generic_tenet_focus_tenet_love_thy_neighbour: "Zásada [GetTenetType('tenet_love_thy_neighbour').GetName( GetPlayer.GetRite )] staví milosrdenství a dobročinnost do středu každodenního náboženského života."
 generic_tenet_focus_tenet_divine_liturgy: "Zásada [GetTenetType('tenet_divine_liturgy').GetName( GetPlayer.GetRite )] vyzdvihuje slavnostní obřady a spatřuje v řádné bohoslužbě nejjasnější průhled k posvátnu."
 generic_tenet_focus_tenet_miaphysitism: "Zásada [GetTenetType('tenet_miaphysitism').GetName( GetPlayer.GetRite )] učí o neoddělitelném spojení božství a lidství v jediném tajemství Krista."
 generic_tenet_focus_tenet_hesychasm: "Zásada [GetTenetType('tenet_hesychasm').GetName( GetPlayer.GetRite )] hledá sjednocení v tichu, klidu a vnitřním opakování posvátné modlitby."
 generic_tenet_focus_tenet_anachoresis: "Zásada [GetTenetType('tenet_anachoresis').GetName( GetPlayer.GetRite )] ctí odchod ze světa a hledá svatost v samotě, strádání a odloučení."
 generic_tenet_focus_tenet_mortification_of_the_flesh: "Zásada [GetTenetType('tenet_mortification_of_the_flesh').GetName( GetPlayer.GetRite )] hledá svatost v tělesném strádání a podřizuje nízké pudy duchovnímu cíli."
 generic_tenet_focus_tenet_holy_myron: "Zásada [GetTenetType('tenet_holy_myron').GetName( GetPlayer.GetRite )] přikládá zvláštní význam obřadu pomazání a považuje posvátný olej za pečeť božské milosti."
 generic_tenet_focus_tenet_khachkar: "Zásada [GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )] posvěcuje vytesané kamenné kříže a trvalé památníky jako veřejné svědectví posvátna."
