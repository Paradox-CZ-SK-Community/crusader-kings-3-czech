l_polish:
 rite_no_name: "#D Název ritu#!"
 rite_no_name_adj: "#D Bezejmenný#!"
 rite_no_name_adherent: "$rite_no_name_adj$"
 rite_no_name_adherent_plural: "$rite_no_name_adj$"
 rite_no_name_desc: "#D Tento ritus by měl mít název #!"
 generic_rite_description: "Dne [GetCurrentDate.GetStringLong] zakládá [Character.GetFullName] na [Character.GetCurrentLocation.GetTitle.Custom('CZ_Adjective_eem')|l] území ritus [Rite.GetNameNoTooltip] v rámci [Faith.Custom('CZ_Adjective_ee')|l] víry. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_no_location_description: "Dne [GetCurrentDate.GetStringLong] zakládá [Character.GetFullName] [Rite.GetNameNoTooltip] v rámci [Faith.Custom('CZ_Adjective_ee')|l] víry. [Rite.Custom('GetGenericRiteTenetSentence')]"
 generic_rite_focus_fallback: "Tento ritus zachovává v rámci své mateřské víry osobitý důraz na určitou podobu zbožnosti."
 generic_rite_focus_tenet_aniconism: "Tento ritus odmítá posvátná vyobrazení a hledá cestu k úctě ve zdrženlivosti, absenci obrazů a svatosti nezobrazeného božství."
 generic_rite_focus_tenet_alexandrian_catechism: "Tento ritus si cení učeného výkladu, propracované doktríny a trpělivého vzdělávání věřících."
 generic_rite_focus_tenet_armed_pilgrimages: "Tento ritus považuje svatou válku a ozbrojenou pouť za posvátné povinnosti zbožných."
 generic_rite_focus_tenet_carnal_exaltation: "Tento ritus ctí touhu a tělesné potěšení jako dary nesoucí dotek posvátna."
 generic_rite_focus_tenet_communal_identity: "Tento ritus úzce spojuje bohoslužbu se sdílenými zvyky, společným životem a pečlivě střeženou identitou společenství."
 generic_rite_focus_tenet_communion: "Tento ritus nachází oporu ve společné zbožnosti, almužnách a společenství s duchovní hlavou."
 generic_rite_focus_tenet_consolamentum: "Tento ritus hledá konečnou očistu v odříkání a neochvějné přípravě na smrt."
 generic_rite_focus_tenet_divine_marriage: "Tento ritus posvěcuje manželský svazek i panování a v posvátném manželství spatřuje odraz božského řádu."
 generic_rite_focus_tenet_gnosticism: "Tento ritus hledá skryté pravdy za závojem světa a cestu ke spáse spatřuje v posvátném poznání."
 generic_rite_focus_tenet_mendicant_preachers: "Tento ritus šíří víru prostřednictvím putujících kazatelů, pokorného svědectví a neúnavného vyučování."
 generic_rite_focus_tenet_pacifism: "Tento ritus vyzdvihuje zdrženlivost a mír a zbytečné krveprolití považuje za těžké selhání duše."
 generic_rite_focus_tenet_pentarchy: "Tento ritus si váží starobylých sídel autority a řádné správy širšího společenství víry."
 generic_rite_focus_tenet_unrelenting_faith: "Tento ritus velebí neochvějnou horlivost, pevné odhodlání a připravenost bojovat za to, co je svaté."
 generic_rite_focus_tenet_vows_of_poverty: "Tento ritus ctí posvátnou chudobu a vybízí věřící, aby se vzdali nadbytku a žili skromněji."
 generic_rite_focus_tenet_pastoral_isolation: "Tento ritus dává přednost chráněnému stádu a volí odloučení od okolního světa před kompromisy."
 generic_rite_focus_tenet_rite: "Tento ritus přikládá velkou váhu liturgii, řádu duchovenstva a zachování posvátné tradice."
 generic_rite_focus_tenet_adaptive: "Tento ritus se přizpůsobuje, aniž by ustupoval v základech, a přijímá místní zvyky při zachování svého posvátného jádra."
 generic_rite_focus_tenet_esotericism: "Tento ritus si cení skryté moudrosti, zasvěcení a pravd odhalených pouze připraveným."
 generic_rite_focus_tenet_legalism: "Tento ritus zakládá svatost na jasném zákonu, spravedlivém soudu a ukázněném uspořádání života."
 generic_rite_focus_tenet_literalism: "Tento ritus se pevně drží posvátných slov a nedůvěřuje volnému výkladu ani zděděným kompromisům."
 generic_rite_focus_tenet_reincarnation: "Tento ritus chápe pouť duše jako koloběh, v němž každý život utváří ten následující."
 generic_rite_focus_tenet_religious_legal_pronouncements: "Tento ritus přisuzuje posvátnému právu a formálním rozhodnutím trvalou duchovní autoritu."
 generic_rite_focus_tenet_struggle_submission: "Tento ritus učí, že víra se prokazuje bojem, dobýváním a podrobením bezbožných."
 generic_rite_focus_tenet_false_conversion_sanction: "Tento ritus připouští skrývání skutečného přesvědčení a vnější přetvářku, vyžaduje-li to přežití nebo vlastní prospěch."
 generic_rite_focus_tenet_tax_nonbelievers: "Tento ritus považuje nevíru za závazek odvádět tribut a upevňuje posvátnou hierarchii světskými odvody."
 generic_rite_focus_tenet_asceticism: "Tento ritus hledá svatost v odříkání, kázni a trpělivém ovládání touhy."
 generic_rite_focus_tenet_bhakti: "Tento ritus staví do středu upřímnou oddanost a učí, že odevzdání z lásky přivádí duši nejblíže k božství."
 generic_rite_focus_tenet_dharmic_pacifism: "Tento ritus si cení neubližování a sebeovládání a považuje mír za vyšší projev kázně než hněv."
 generic_rite_focus_tenet_inner_journey: "Tento ritus obrací pozornost do nitra a hledá probuzení v rozjímání, kázni a proměně vlastního já."
 generic_rite_focus_tenet_ritual_hospitality: "Tento ritus považuje pohostinnost za posvátnou povinnost, která spojuje hostitele s hostem pod ochranou posvátného zvyku."
 generic_rite_focus_tenet_adorcism: "Tento ritus se s úctou obrací k duchům v naději, že získá jejich přízeň a odvrátí jejich hněv."
 generic_rite_focus_tenet_ancestor_worship: "Tento ritus hledá u ctěných zesnulých vedení, požehnání a pouto mezi mrtvými a živými."
 generic_rite_focus_tenet_astrology: "Tento ritus vyčítá smysl z nebes a důvěřuje hvězdám, že odhalí řád, osud i vhodný okamžik."
 generic_rite_focus_tenet_hedonistic: "Tento ritus přijímá veselí, přemíru a posvěcení rozkoše při společných bohoslužbách."
 generic_rite_focus_tenet_human_sacrifice: "Tento ritus chápe krvavou oběť jako děsivou, avšak posvátnou úmluvu mezi smrtelníky a božstvem."
 generic_rite_focus_tenet_mystical_birthright: "Tento ritus věří, že osud již od narození předurčuje některé duše k posvátné moci a duchovní velikosti."
 generic_rite_focus_tenet_ritual_celebrations: "Tento ritus vyzdvihuje společné veselí a posvátné slavnosti jako nejplnější projev uctívání."
 generic_rite_focus_tenet_sacred_childbirth: "Tento ritus obklopuje zrození úctou a přikládá mateřství i novému životu posvátný význam."
 generic_rite_focus_tenet_sanctity_of_nature: "Tento ritus nachází posvátno v živém světě a uctívá růst, plodnost a nespoutané stvoření."
 generic_rite_focus_tenet_sun_worship: "Tento ritus ctí slunce jako životodárné znamení řádu, záře a božské přízně."
 generic_rite_focus_tenet_warmonger: "Tento ritus oslavuje dobývání a válečnou zdatnost a očekává, že věřící svou hodnotu prokáží ve válce."
 generic_rite_focus_tenet_gruesome_festivals: "Tento ritus přijímá hrůzné slavnosti a proměňuje strach, krev a podívanou v posvátný obřad."
 generic_rite_focus_tenet_cthonic_redoubts: "Tento ritus uctívá výšiny a skrytá útočiště země jako místa mimořádné svatosti."
 generic_rite_focus_tenet_household_gods: "Tento ritus staví do středu domov a svěřuje krb, rodinu i každodenní zbožnost do božské ochrany."
 generic_rite_focus_tenet_sinitic_syncretism: "Tento ritus proplétá svou tradici se sinickým myšlením a hledá soulad namísto rozkolu."
 generic_rite_focus_tenet_eastern_syncretism: "Tento ritus ochotně přijímá východní nauky a v cizí moudrosti spatřuje ozvěnu posvátné pravdy."
 generic_rite_focus_tenet_unreformed_syncretism: "Tento ritus volně čerpá ze starších praktik a začleňuje dávné obřady do nového posvátného celku."
 generic_rite_focus_tenet_christian_syncretism: "Tento ritus začleňuje křesťanské učení do svého posvátného rámce, místo aby je zcela odmítal."
 generic_rite_focus_tenet_islamic_syncretism: "Tento ritus přejímá islámskou víru a zvyky a nachází užitečnou pravdu ve zjevení sousedního náboženství."
 generic_rite_focus_tenet_jewish_syncretism: "Tento ritus začleňuje židovskou tradici, právo a paměť do svého chápání posvátna."
 generic_rite_focus_tenet_exaltation_of_pain: "Tento ritus považuje bolest za očistnou a prokazuje oddanost vytrvalostí a dobrovolným přijetím utrpení."
 generic_rite_focus_tenet_natural_primitivism: "Tento ritus nedůvěřuje přebujelé civilizaci a ctí drsnější, prostší způsob života."
 generic_rite_focus_tenet_pursuit_of_power: "Tento ritus žehná ctižádosti a světské nadvládě a považuje moc za náležitý nástroj posvátna."
 generic_rite_focus_tenet_ritual_cannibalism: "Tento ritus začleňuje požívání lidského masa do zapovězeného uctívání a posvátné hrůzy."
 generic_rite_focus_tenet_sacred_shadows: "Tento ritus se zahaluje tajemstvím a posvěcuje utajení, soumrak a to, co je většině skryto."
 generic_rite_focus_tenet_polyamory: "Tento ritus žehná několika láskám současně a odmítá omezovat posvátnou důvěrnost na jediný svazek."
 generic_rite_focus_tenet_sacrificial_ceremonies: "Tento ritus staví slavnostní obětování do středu bohoslužby a spojuje oběť s úmluvou a přízní."
 generic_rite_focus_tenet_megaliths: "Tento ritus vyznačuje posvátná místa trvalým kamenem a důvěřuje památníkům, že uchovají paměť i zbožnost."
 generic_rite_focus_tenet_fp3_fedayeen: "Tento ritus posvěcuje nenápadnost, pronikání mezi nepřátele a sebeobětující násilí ve službách vyššího cíle."
 generic_rite_focus_tenet_communal_possessions: "Tento ritus upozaďuje soukromé bohatství a vybízí věřící ke společnému vlastnictví prostředků."
 generic_rite_focus_tenet_pure_land: "Tento ritus upíná naději k blažené říši prosté utrpení, do níž vede důvěra, připomínání a oddanost."
 generic_rite_focus_tenet_no_mind: "Tento ritus hledá jasnost za hranicemi ulpívajícího myšlení a kázní vede vlastní já k prázdnému, čistému vědomí."
 generic_rite_focus_tenet_mountain_worship: "Tento ritus se obrací k výšinám jako místům bližším božství a činí z vrcholů a hor předměty úcty."
 generic_rite_focus_tenet_extinction_of_dharma: "Tento ritus spatřuje svět zaplavený zkažeností a ospravedlňuje nelítostné násilí na obranu pravdy."
 generic_rite_focus_tenet_cranial_trophies: "Tento ritus považuje ostatky nepřátel za posvátný důkaz vítězství a bázeň vzbuzující prestiže."
 generic_rite_focus_tenet_pursuit_of_knowledge: "Tento ritus vyzdvihuje učenost jako posvátnou práci a hledá pravdu studiem, debatou a ukázněným bádáním."
 generic_rite_focus_tenet_benevolent_governance: "Tento ritus posuzuje svatost také podle spravedlivého panování, řádné správy a péče o panství."
 generic_rite_focus_tenet_filial_piety: "Tento ritus učí úctě k rodičům a starším jako základu mravního a posvátného řádu."
 generic_rite_focus_tenet_harmonious_society: "Tento ritus si cení rovnováhy, náležitého chování a společenského souladu jako odrazů kosmického řádu."
 generic_rite_focus_tenet_sacred_destruction: "Tento ritus spatřuje v posvátném ničení očistu a činí ze samotné zkázy nástroj posvátné obnovy."
 generic_rite_focus_tenet_preservation: "Tento ritus si cení vytrvalosti, návaznosti a pečlivého opatrování všeho, co bylo svěřeno do péče."
 generic_rite_focus_tenet_takamin: "Tento ritus přistupuje k medvědovi a spřízněným silám divočiny s úctou, bázní a obezřetným respektem."
 generic_rite_focus_tenet_peace_of_god: "Tento ritus usiluje o omezení násilí a stanovuje posvátné meze toho, kdy lze právem prolévat krev."
 generic_rite_focus_tenet_dulia: "Tento ritus ctí světce a svaté vzory, uctívá jejich památku, ale nestaví je na roveň božství."
 generic_rite_focus_tenet_transubstantiation: "Tento ritus přisuzuje svatým tajemstvím skutečnou proměňující moc a staví svátost do středu božské přítomnosti."
 generic_rite_focus_tenet_ora_et_labora: "Tento ritus spojuje modlitbu s prací a učí, že ukázněná práce se sama může stát projevem zbožnosti."
 generic_rite_focus_tenet_hyperdulia: "Tento ritus povyšuje mimořádnou úctu k nejsvětější přímluvkyni nad běžnou úctu ke světcům."
 generic_rite_focus_tenet_simony: "Tento ritus připouští, že posvátný úřad, patronát a světské bohatství od sebe nelze snadno oddělit."
 generic_rite_focus_tenet_monophysitism: "Tento ritus hlásá jednotu Kristovy přirozenosti a odmítá příliš ostře rozdělovat božské tajemství."
 generic_rite_focus_tenet_acts_of_apostles: "Tento ritus si bere za vzor apoštolské společenství, dobročinnost a společný život prvních věřících."
 generic_rite_focus_tenet_purgatory: "Tento ritus učí, že mnoho duší po smrti prochází očistou, než mohou dosáhnout dokonalé blaženosti."
 generic_rite_focus_tenet_be_fruitful_and_multiply: "Tento ritus vyzdvihuje rodinu, plození a přivádění nového života na svět jako posvátné povinnosti."
 generic_rite_focus_tenet_apostolic_succession: "Tento ritus zakládá autoritu na nepřerušené posloupnosti předávání sahající až k apoštolům."
 generic_rite_focus_tenet_confession: "Tento ritus si cení otevřeného pokání a rozhřešení a věří, že vyslovený hřích může být počátkem uzdravení."
 generic_rite_focus_tenet_original_sin: "Tento ritus chápe lidskou slabost jako prvotní a trvá na tom, že žádná duše nepřichází na svět nedotčená."
 generic_rite_focus_tenet_celestial_hierarchy: "Tento ritus si představuje vesmír uspořádaný do posvátných stupňů, v nichž každé postavení odráží božský záměr."
 generic_rite_focus_tenet_miles_christi: "Tento ritus vidí ve věřících vojáky posvátna, povolané bránit pravdu s ukázněnou horlivostí."
 generic_rite_focus_tenet_scholasticism: "Tento ritus tříbí víru argumentací, výkladem a smiřováním rozumu s vírou."
 generic_rite_focus_tenet_adoptionism: "Tento ritus zdůrazňuje povýšení a božské synovství způsobem, který upozaďuje věčné rozlišení."
 generic_rite_focus_tenet_love_thy_neighbour: "Tento ritus staví milosrdenství a lásku k bližnímu do středu každodenního náboženského života."
 generic_rite_focus_tenet_divine_liturgy: "Tento ritus vyzdvihuje slavnostní liturgii a spatřuje v řádné bohoslužbě nejjasnější průhled k božství."
 generic_rite_focus_tenet_miaphysitism: "Tento ritus učí o neoddělitelném spojení božství a lidství v jediném tajemství Krista."
 generic_rite_focus_tenet_hesychasm: "Tento ritus hledá sjednocení v tichu, klidu a vnitřním opakování posvátné modlitby."
 generic_rite_focus_tenet_anachoresis: "Tento ritus ctí odchod ze světa a hledá svatost v samotě, strádání a odloučení."
 generic_rite_focus_tenet_mortification_of_the_flesh: "Tento ritus hledá svatost v tělesném strádání a podřizuje tělo duchovnímu cíli."
 generic_rite_focus_tenet_holy_myron: "Tento ritus přikládá zvláštní význam svatému pomazání a považuje posvátný olej za pečeť božské milosti."
 generic_rite_focus_tenet_khachkar: "Tento ritus posvěcuje vytesané kamenné kříže a trvalé památníky jako veřejné svědectví posvátna."
 generic_tenet_focus_fallback: "Tato zásada zachovává v rámci své mateřské víry osobitý důraz na určitou podobu zbožnosti."
