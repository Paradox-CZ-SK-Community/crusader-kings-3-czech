 insular_celtic_fate_god_name_possessive: "sv. Ruadhána"
 insular_celtic_knowledge_god_name: "sv. Finian"
 insular_celtic_knowledge_god_name_possessive: "sv. Finiana"
 insular_celtic_war_god_name: "sv. Cainnech"
 insular_celtic_war_god_name_possessive: "sv. Cainnecha"
