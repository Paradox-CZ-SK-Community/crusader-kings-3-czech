 roman_rite: "Římský ritus"
 roman_rite_adj: "Římský"
 roman_rite_adherent: "Římský křesťan"
 roman_rite_adherent_plural: "Římští křesťané"
 roman_rite_desc: "Římský ritus je liturgickou tradicí římské církve, utvářenou latinskou teologií, právní autoritou a důrazem na svátostnou kázeň, hierarchii duchovenstva a jednotu církevních institucí."
 insular_celtic: "Insulární křesťanství"
 insular_celtic_adj: "Insulární"
 insular_celtic_adherent: "Insulární křesťan"
 insular_celtic_adherent_plural: "Insulární křesťané"
 insular_celtic_desc: "Insulární ritus je venkovskou církevní tradicí, která se před několika staletími odchýlila od římskokatolické pravověrnosti. Na naléhání své mateřské církve ztratila mnohé z někdejších zvláštností. Přesto si uchovává větší důraz na pokání a mnišství a zahrnuje řadu tradičních keltských sňatkových zvyklostí, které jsou širšímu křesťanstvu cizí."
 insular_celtic_religious_head_title: "Arciopat"
 insular_celtic_religious_head_title_female: "Arciabatyše"
 insular_celtic_religious_head_title_name: "Církevní rada"
 insular_celtic_fertility_god_name: "sv. Brigita"
 insular_celtic_fertility_god_name_possessive: "sv. Brigity"
 insular_celtic_wealth_god_name: "sv. Kolumba"
 insular_celtic_wealth_god_name_possessive: "sv. Kolumby"
 insular_celtic_household_god_name: "sv. Ciarán"
 insular_celtic_household_god_name_possessive: "sv. Ciarána"
