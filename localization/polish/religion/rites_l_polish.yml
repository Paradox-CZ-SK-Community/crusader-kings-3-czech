 insular_celtic_priest_male: "převor"
 insular_celtic_priest_plural_male: "převoři"
 insular_celtic_priest_female: "převorka"
 insular_celtic_priest_plural_female: "převorky"
 insular_celtic_bishop_male: "opat"
 insular_celtic_bishop_plural_male: "opati"
 insular_celtic_bishop_female: "abatyše"
 insular_celtic_bishop_plural_female: "abatyše"
 mozarabic_church: "Mozarabské křesťanství"
 mozarabic_church_adj: "Mozarabský"
 mozarabic_church_adherent: "Mozarab"
 mozarabic_church_adherent_plural: "Mozarabové"
 mozarabic_church_desc: "Mozarabský ritus navazuje na rané iberské rity a po staletích islámské nadvlády si uchovává jistou nezávislost na Římu. Dlouhé soužití s jinými vírami v něm vypěstovalo toleranci k odlišnostem, která přísnějším sektám chybí."
 ambrosian_rite: "Ambroziánský ritus"
 ambrosian_rite_adj: "Ambroziánský"
 ambrosian_rite_adherent: "Ambroziánský křesťan"
 ambrosian_rite_adherent_plural: "Ambroziánští křesťané"
 ambrosian_rite_desc: "Ambroziánský ritus náleží milánské arcidiecézi od dob jejího velkého biskupa sv. Ambrože. Uchovává vlastní liturgii a zpěv i teologickou tradici, která si cení myšlení sv. Augustina z Hippo."
 beneventan_rite: "Beneventský ritus"
 beneventan_rite_adj: "Beneventský"
 beneventan_rite_adherent: "Beneventský křesťan"
 beneventan_rite_adherent_plural: "Beneventští křesťané"
 beneventan_rite_desc: "Liturgická tradice langobardského jihu, soustředěná kolem Beneventa a velkého opatství Montecassino. Svým osobitým zpěvem a obřady se liší od římské praxe, která na tento ritus hledí s rostoucím podezřením."
 carolingian_christianity: "Karolinské křesťanství"
 carolingian_christianity_adj: "Karolinský"
 carolingian_christianity_adherent: "Karolinský křesťan"
 carolingian_christianity_adherent_plural: "Karolinští křesťané"
 carolingian_christianity_desc: "Podoba křesťanství, která se rozvinula za vlády karolinské dynastie a vyznačuje se důrazem na mnišství a misijní činnost."
 byzantine_rite: "Řecký ritus"
 byzantine_rite_adj: "Řecký"
 byzantine_rite_adherent: "Řecký křesťan"
 byzantine_rite_adherent_plural: "Řečtí křesťané"
 byzantine_rite_desc: "Konstantinopolský patriarchát je jedním z nejvýznamnějších středisek východního pravoslavného křesťanství, známým bohatou teologickou tradicí a historickým vlivem. Řecký ritus z tohoto patriarchátu přímo vychází."
 antiochian_rite: "Antiochijský ritus"
 antiochian_rite_adj: "Antiochijský"
 antiochian_rite_adherent: "Antiochijský křesťan"
 antiochian_rite_adherent_plural: "Antiochijští křesťané"
 antiochian_rite_desc: "Antiochijský patriarchát je jedním z nejstarších křesťanských společenství, založeným apoštoly svatým Petrem a svatým Pavlem. Jeho západosyrská tradice, zvaná „jakobitská“ podle Jakuba Baradaia, který církev reorganizoval, zachovává miafyzitské učení a starobylou liturgii sv. Jakuba."
 slavic_rite: "Slovanský ritus"
 slavic_rite_adj: "Slovanský"
 slavic_rite_adherent: "Slovanský křesťan"
 slavic_rite_adherent_plural: "Slovanští křesťané"
 slavic_rite_desc: "Tento ritus přinesli Slovanům Cyril a Metoděj. Zahrnuje prvky byzantské liturgie přizpůsobené slovanským jazykům a kultuře prostřednictvím hlaholice."
 georgian_rite: "Gruzínský ritus"
 georgian_rite_adj: "Gruzínský"
 georgian_rite_adherent: "Gruzínský křesťan"
 georgian_rite_adherent_plural: "Gruzínští křesťané"
 georgian_rite_desc: "Gruzínský ritus představuje křesťanské tradice Gruzie, které se vyznačují osobitou liturgií, církevním dědictvím a pevnými vazbami na východní pravoslavnou teologii i praxi."
 coptic_rite: "Koptský ritus"
 coptic_rite_adj: "Koptský"
 coptic_rite_adherent: "Kopt"
 coptic_rite_adherent_plural: "Koptové"
 coptic_rite_desc: "Koptská církev odvozuje svůj původ od sv. Marka Evangelisty a je proslulá jak tím, že se stala kolébkou křesťanského mnišství, tak dlouhou tradicí podpory vzdělanosti a filozofie."
 ethiopian_rite: "Ge'ezský ritus"
 ethiopian_rite_adj: "Ge'ezský"
 ethiopian_rite_adherent: "Ge'ezský křesťan"
 ethiopian_rite_adherent_plural: "Ge'ezští křesťané"
 ethiopian_rite_desc: "Tato starobylá křesťanská tradice se soustředí v etiopské vysočině a navazuje na dědictví Aksúmu. Od ostatních alexandrijských církví se liší širším kánonem posvátných písem, silnou mnišskou tradicí a pojetím smlouvy s Bohem utvářeným šalomounským královským dědictvím."
 armenian_rite: "Apoštolský ritus"
 armenian_rite_adj: "Apoštolský"
 armenian_rite_adherent: "Apoštolský křesťan"
 armenian_rite_adherent_plural: "Apoštolští křesťané"
 armenian_rite_desc: "Arménská apoštolská církev, založená apoštoly Bartolomějem a Tadeášem, si v kraji rychle získala stoupence a přivedla Arménské království k tomu, aby se jako první stát v dějinách přihlásilo ke křesťanství jako oficiálnímu náboženství."
 apostolic_religious_head_title: "Katholikos"
 apostolic_religious_head_title_plural: "Katholikové"
 apostolic_religious_head_title_name: "Církev"
 nabi: "Nabí"
 nabi_adj: "Prorocký"
 nabi_adherent: "Prorok"
 nabi_adherent_plural: "Proroci"
 nabi_desc: "Jak výslovně uvádí svatý Korán, nabí je člověk vyvolený Všemohoucím, aby předával jeho poselství a připomínal lidem den, kdy před něj budou předvoláni a budou se zodpovídat ze svých činů. Podle základního přesvědčení byl prorok Muhammad posledním z nich."
 sahabah: "Sahába"
 sahabah_adj: "Sahábský"
 sahabah_adherent: "Prorokův druh"
 sahabah_adherent_plural: "Prorokovi druhové"
 sahabah_desc: "Sahába neboli Muhammadovi druhové jsou muslimští stoupenci, kteří se s ním za jeho života setkali nebo jej viděli. Sehráli významnou roli v raných muslimských bojích, společnosti, předávání hadísů i správě."
 tabiun: "Tábi'ún"
 tabiun_adj: "Tábi'únský"
 tabiun_adherent: "Tábi'"
 tabiun_adherent_plural: "Tábi'ún"
 tabiun_desc: "Generace muslimů, která následovala po druzích proroka Muhammada, sahábě, a přijímala tak jejich učení z druhé ruky, ještě před vznikem sunnitských škol v pozdějších staletích."
 hanafi: "Hanafíjská škola"
 hanafi_adj: "Hanafíjský"
 hanafi_adherent: "Hanafíjec"
 hanafi_adherent_plural: "Hanafíjci"
 hanafi_desc: "Vychází z učení právníka a teologa Abú Hanífy, který systematizoval používání rozumových úvah. Hanafíjská právní teorie odvozuje právo především z Koránu, sunny, shody učenců a analogického usuzování."
 hanbali: "Hanbalovská škola"
 hanbali_adj: "Hanbalovský"
 hanbali_adherent: "Hanbalovec"
 hanbali_adherent_plural: "Hanbalovci"
 hanbali_desc: "Hanbalovská škola je nejmenší ze čtyř hlavních sunnitských škol islámské právní vědy a vychází z učení Ahmada ibn Hanbala. Na rozdíl od ostatních se hanbalovci staví proti kodifikaci práva do uceleného systému a zdůrazňují Korán a hadísy jako nejvyšší prameny."
 maliki: "Málikovská škola"
 maliki_adj: "Málikovský"
 maliki_adherent: "Málikovec"
 maliki_adherent_plural: "Málikovci"
 maliki_desc: "Jedna ze čtyř hlavních škol islámské právní vědy v sunnitském islámu. Založil ji Málik ibn Anas v 8. století. Od ostatních sunnitských právních škol se liší především prameny, z nichž odvozuje svá rozhodnutí."
 shafii: "Šáfiovská škola"
 shafii_adj: "Šáfiovský"
 shafii_adherent: "Šáfiovec"
 shafii_adherent_plural: "Šáfiovci"
 shafii_desc: "Škola aš-Šáfi'ího, muslimského učence a právníka z počátku 9. století, známého jako „otec muslimské právní vědy“. Jádrem šáfiovského myšlení je přesvědčení, že každý čin věřícího podléhající právu odpovídá některému ustanovení zjeveného práva, šaríe."
 ismaili: "Ismá'ílíja"
 ismaili_adj: "Ismá'ílitský"
 ismaili_adherent: "Ismá'ílita"
 ismaili_adherent_plural: "Ismá'ílité"
 ismaili_desc: "Šíitský ritus, který odvozuje posloupnost pravých imámů, obdařených božským poznáním a neomylností, od Ismá'íla ibn Dža'fara. Jeho stoupenci jsou také známí jako sedmíci, protože Ismá'íl byl sedmým imámem po Muhammadovi."
 qarmatian: "Karmatské učení"
 qarmatian_adj: "Karmatský"
 qarmatian_adherent: "Karmat"
 qarmatian_adherent_plural: "Karmaté"
 qarmatian_desc: "Větev ismá'ílíje, která přijala prvky zoroastrismu. Bůh předurčil počet imámů na sedm, a proto nemohou přijít další, dokud se sedmý imám, Muhammad ibn Ismá'íl, nevrátí, aby vedl věřící."
 nizari: "Nizáríja"
 nizari_adj: "Nizárský"
 nizari_adherent: "Nizárita"
 nizari_adherent_plural: "Nizárité"
 nizari_desc: "Racionalistický ritus, který klade důraz na rozumové usuzování při výkladu Koránu a hadísů. Úřad imáma je dědičný a posloupnost se odvozuje od Alího."
 zayidi: "Zajdíja"
 zayidi_adj: "Zajdovský"
 zayidi_adherent: "Zajdovec"
 zayidi_adherent_plural: "Zajdovci"
 zayidi_desc: "Pravý imám není neomylný, nýbrž se vyznačuje bojem proti zkaženosti a zlu. Zajdovce proto spojuje víra, že Zajd ibn Alí byl právoplatným nástupcem v imámátu díky své vzpouře proti Umajjovcům."
 imami: "Imámíja"
 imami_adj: "Imámovský"
 imami_adherent: "Imámovec"
 imami_adherent_plural: "Imámovci"
 imami_desc: "Imámovci věří, že podle proroctví má ummu vést dvanáct imámů a že dvanáctý z nich, imám Zamán, čeká na svůj návrat, aby přivedl muslimy ke dni posledního soudu."
 islam_ayatollah: "ajatolláh"
 islam_ayatollah_plural: "ajatolláhové"
 ghulat: "Ichtiláfismus"
 ghulat_adj: "Ichtiláfský"
 ghulat_adherent: "Ichtiláfista"
 ghulat_adherent_plural: "Ichtiláfisté"
 ghulat_desc: "Stoupenci ichtiláfismu věří v božskou přirozenost neomylných imámů, počínaje Alím. Bůh je nejen ustanovil a inspiroval, ale také v nich částečně přebývá, aby vedl jejich činy, a jejich prostřednictvím i celou ummu."
 alawite: "Alavitské učení"
 alawite_adj: "Alavitský"
 alawite_adherent: "Alavita"
 alawite_adherent_plural: "Alavité"
 alawite_desc: "Alavitské náboženské učení je tajné a Korán je pouze jedním z jeho posvátných textů. Vedle víry v posloupnost imámů od Alího věří alavité také v reinkarnaci a v to, že všechny bytosti byly hvězdami svrženými z nebe, které si nyní musejí znovu zasloužit své místo řadou dobrých a zbožných životů."
 alevi: "Alevitské učení"
 alevi_adj: "Alevitský"
 alevi_adherent: "Alevita"
 alevi_adherent_plural: "Alevité"
 alevi_desc: "Alevité věří v posloupnost dvanácti imámů, ale řídí se také mnoha dalšími tradicemi popsanými ve své sbírce posvátných textů, bujrucích. V alevitské tradici je Bůh Pravdou a Muhammad i Alí jsou jeho projevy ve světě."
 alevi_house_of_worship: "cemevi"
 alevi_house_of_worship_2: "$alevi_house_of_worship$"
 alevi_house_of_worship_3: "$alevi_house_of_worship$"
 alevi_house_of_worship_plural: "cemevi"
 alevi_religious_text: "bujruky"
 alevi_religious_text_2: "$alevi_religious_text$"
 alevi_religious_text_3: "$alevi_religious_text$"
 ibadi: "Muhakkima"
 ibadi_adj: "Muhakkimský"
 ibadi_adherent: "Muhakkima"
 ibadi_adherent_plural: "Muhakkimové"
 ibadi_desc: "Stoupenci muhakkimy věří, že islámská obec nepotřebuje chalífu ani imáma, pokud neexistuje vhodný kandidát. Odmítají představu, že posloupnost nástupců Alího a Abú Bakra sama o sobě zaručuje jejich způsobilost k vedení, a kladou důraz na spravedlivé jednání a shodu obce."
 azariqa: "Azrakíja"
 azariqa_adj: "Azrakovský"
 azariqa_adherent: "Azrakovec"
 azariqa_adherent_plural: "Azrakovci"
 azariqa_desc: "Azrakovci neuznávají žádného způsobilého Muhammadova nástupce a považují za své právo i povinnost bojovat proti každému vůdci, který nedodržuje hodnoty jejich víry. Jakýkoli rozdíl ve výkladu víry podle nich stačí k označení člověka za nevěřícího."
 najdat: "Nadždát"
 najdat_adj: "Nadždátský"
 najdat_adherent: "Nadždátista"
 najdat_adherent_plural: "Nadždátisté"
 najdat_desc: "Stoupenci nadždátské větve cháridži pevně věří, že muslimské vedení má být ustaveno shodou věřících. Vůdce není neomylný, ale Bůh jej vybírá prostřednictvím společenství."
 sufri: "Sufríja"
 sufri_adj: "Sufríský"
 sufri_adherent: "Sufríjec"
 sufri_adherent_plural: "Sufríjci"
 sufri_desc: "Sufríjci věří v božské vedení prostřednictvím výkladu Božího slova, nikoli dědičnosti. Boží vůle se projevuje jako vůle ummy, pokud se její členové dobře vyznají v Koránu."
 hafizi: "Háfizíja"
 hafizi_adj: "Háfizovský"
 hafizi_adherent: "Háfizovec"
 hafizi_adherent_plural: "Háfizovci"
 hafizi_desc: "Háfizovci nade vše staví podporu toho, koho považují za pravého chalífu, a odpor proti všem pokusům o jeho sesazení či svržení. V porážce je spojuje vzpoura za spravedlivou věc a ve vítězství hrdá oddanost vůli svého vůdce."
