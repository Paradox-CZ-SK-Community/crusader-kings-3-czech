l_polish:
 scheme_countermeasure_type_bounties_for_whispers: "Odměny za šepoty"
 scheme_countermeasure_type_bounties_for_whispers_desc: "#WEAK Peníze často stačí, aby se špína rozpovídala — i když to *opravdu* vyžaduje, abyste naslouchali.#!"
 scheme_countermeasure_type_arbitrary_arrests: "Arbitrární zatýkání"
 scheme_countermeasure_type_arbitrary_arrests_desc: "#WEAK Připoutat pouty každého služebníka, družiníka a vyslance, který jen pohnul víčkem, je jistě účinné donucení. Jen není příliš oblíbené.#!"
 scheme_countermeasure_type_strengthen_sentries: "Posílit stráže"
 scheme_countermeasure_type_strengthen_sentries_desc: "#WEAK Bdělé oči udrží bloumající nápadníky daleko, ale mají potíže s dobře organizovanými a dobře vyzbrojenými spiklenci.#!"
 scheme_countermeasure_type_redouble_guards: "Zdvojnásobit stráže"
 scheme_countermeasure_type_redouble_guards_desc: "#WEAK Ozbrojení družiníci vynikají v odražení těch se skutečně zlými úmysly, ale nezastaví tajný dopis vklouznuvší pod dveře ani rozhovor v tmavém koutě.#!"
 scheme_countermeasure_type_withdraw_from_view: "Stáhnout se z očí veřejnosti"
 scheme_countermeasure_type_withdraw_from_view_desc: "#WEAK Když je bezpečnost vážnou starostí, ale hrozba je neznámá, je možné se prostě zříci všech povinností.#!"
 calculating_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('murder').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('overthrow_regent').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('steal_back_artifact').GetTypeName]"
 opportunistic_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('convert_to_witchcraft').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]"
 indirect_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('claim_throne').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('fabricate_hook').GetTypeName][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'tgp_disbelieve_mandala_boilerplate.tt' )]"
