l_polish:
 scheme_countermeasure_type_bounties_for_whispers: "Odměny za šeptandu"
 scheme_countermeasure_type_bounties_for_whispers_desc: "#WEAK Mince dokážou přimět spodinu, aby promluvila – i když to skutečně znamená, že ji musíš poslouchat.#!"
 scheme_countermeasure_type_arbitrary_arrests: "Svévolné zatýkání"
 scheme_countermeasure_type_arbitrary_arrests_desc: "#WEAK Nasadit pouta každému sluhovi, družiníkovi či vyslanci, který byť jen mrkne, je bezpochyby účinným donucovacím prostředkem. Oblibu ti to však nezíská.#!"
 scheme_countermeasure_type_strengthen_sentries: "Posílit hlídky"
 scheme_countermeasure_type_strengthen_sentries_desc: "#WEAK Bdělým očím se daří držet dotěrné nápadníky v patřičné vzdálenosti, proti dobře organizovaným a ozbrojeným spiklencům však mnoho nezmohou.#!"
 scheme_countermeasure_type_redouble_guards: "Zdvojnásobit stráže"
 scheme_countermeasure_type_redouble_guards_desc: "#WEAK Ozbrojení družiníci výtečně maří plány těch vzdálenosti, proti dobře organizovaným a ozbrojeným spiklencům však, kdo mají skutečně zlovolné úmysly, nedokážou však zastavit tajný dopis podstrčený pod dveřmi ani rozhovor ve stinném koutě.#!"
 scheme_countermeasure_type_withdraw_from_view: "Stáhnout se do ústraní"
 scheme_countermeasure_type_withdraw_from_view_desc: "#WEAK Když je bezpečí vážně ohroženo, ale povaha nebezpečí zůstává neznámá, můžeš se jednoduše zříci všech povinností.#!"
 calculating_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('murder').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('overthrow_regent').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('steal_back_artifact').GetTypeName]"
 opportunistic_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('convert_to_witchcraft').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]"
 indirect_schemes_boilerplate.tt: "\n$BULLET_WITH_TAB$[GetScheme('claim_throne').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('fabricate_hook').GetTypeName][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'tgp_disbelieve_mandala_boilerplate.tt' )]"
