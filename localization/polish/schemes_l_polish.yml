 scheme_apa_positive_0001_modifier: "$scheme_apa_positive.0001.t$"
 scheme_apa_positive_0001_modifier_desc: "Meč, sekera či dýka – trocha kovu dokáže mnoho, když se někdo domnívá, že je v bezpečí."
 scheme_apa_positive_0011_modifier: "$scheme_apa_positive.0011.t$"
 scheme_apa_positive_0011_modifier_desc: "Pro úspěch je nezbytné přesně vědět, kde se bude každá figurka v danou chvíli nejspíše nacházet."
 scheme_apa_positive_0021_modifier: "$scheme_apa_positive.0021.t$"
 scheme_apa_positive_0021_modifier_desc: "Taková maličkost, nechat západku nedovřenou, a přece..."
 scheme_apa_positive_0031_modifier: "$scheme_apa_positive.0031.t$"
 scheme_apa_positive_0031_modifier_desc: "Trocha stříbra dokáže mnoho a její účinek přetrvá dlouho."
 scheme_apa_positive_0041_modifier: "$scheme_apa_positive.0041.t$"
 scheme_apa_positive_0041_modifier_desc: "Je překvapivé, jak málo slov stačí, aby byl někdo ochoten zpronevěřit se vlastním zásadám."
 scheme_apa_positive_0051_modifier: "$scheme_apa_positive.0051.t$"
 scheme_apa_positive_0051_modifier_desc: "Vyžaduje to trochu obratnosti, špetku štěstí a bystré oko, ale příležitostem lze #EMP pomoci#! na svět."
 scheme_apa_positive_0061_modifier: "$scheme_apa_positive.0061.t$"
 scheme_apa_positive_0061_modifier_desc: "Srdce ví, po čem touží, bez ohledu na to, co říká rozum či útroby."
 scheme_apa_positive_0071_modifier: "$scheme_apa_positive.0071.t$"
 scheme_apa_positive_0071_modifier_desc: "U některých lidí lze lichotkami dosáhnout čehokoli."
 scheme_apa_positive_0081_modifier: "$scheme_apa_positive.0081.t$"
 scheme_apa_positive_0081_modifier_desc: "Čas věnovaný tomu, abys dal najevo svou náklonnost, má větší cenu než zlato. Většinou."
 scheme_apa_positive_0091_modifier: "$scheme_apa_positive.0091.t$"
 scheme_apa_positive_0091_modifier_desc: "Čilá výměna dopisů nabízí tolik vzrušujících příležitostí k projevení důvtipu a šarmu."
 scheme_apa_positive_0111_modifier: "$scheme_apa_positive.0111.t$"
 scheme_apa_positive_0111_modifier_desc: "Naučit se někomu rozumět může být obtížné, ale #EMP dát najevo#!, že mu rozumíš, je docela snadné."
 scheme_apa_positive_0121_modifier: "$scheme_apa_positive.0121.t$"
 scheme_apa_positive_0121_modifier_desc: "Pomocná ruka, rameno k vyplakání či chvilka úlevy – pomoc je o to cennější, když přichází nečekaně."
 scheme_apa_positive_0131_modifier: "$scheme_apa_positive.0131.t$"
 scheme_apa_positive_0131_modifier_desc: "Vskutku vzácné učené dílo, které se dokonale shoduje se záměry spiknutí."
 scheme_apa_positive_0141_modifier: "$scheme_apa_positive.0141.t$"
 scheme_apa_positive_0141_modifier_desc: "Znamení vyšší moci je podivuhodně tvárná věc."
 scheme_apa_positive_0151_modifier: "$scheme_apa_positive.0151.t$"
 scheme_apa_positive_0151_modifier_desc: "Chytlavá, snadno zapamatovatelná a nejlepší ze všeho: sepsaná samotnými spiklenci."
 scheme_apa_positive_0161_modifier: "$scheme_apa_positive.0161.t$"
 scheme_apa_positive_0161_modifier_desc: "Poklona prodchnutá opravdovým významem září o to jasněji."
 scheme_apa_positive_0171_modifier: "$scheme_apa_positive.0171.t$"
 scheme_apa_positive_0171_modifier_desc: "Vyhradit si čas na rozhovor, návštěvu nebo pouhé naslouchání může být až znepokojivě účinné."
 scheme_apa_positive_0181_modifier: "$scheme_apa_positive.0181.t$"
 scheme_apa_positive_0181_modifier_desc: "Najdi společnou řeč a chop se jí."
 scheme_apa_positive_0191_modifier: "$scheme_apa_positive.0191.t$"
 scheme_apa_positive_0191_modifier_desc: "Poznat, kdy nejde o tebe, je jen polovina úspěchu."
 scheme_apa_positive_0201_modifier: "$scheme_apa_positive.0201.t$"
 scheme_apa_positive_0201_modifier_desc: "Vzpomínky na zašlé časy dokážou mysl podivuhodně snadno spoutat."
 scheme_apa_positive_0211_modifier: "$scheme_apa_positive.0211.t$"
 scheme_apa_positive_0211_modifier_desc: "Když na to přijde, inkoust, pergamen a čas lze jen stěží něčím nahradit."
 scheme_apa_positive_0221_modifier: "$scheme_apa_positive.0221.t$"
 scheme_apa_positive_0221_modifier_desc: "Jiní by je mohli označit za čmáranice šílence, ale pro jejich autora představují osobní poklad."
 scheme_apa_positive_0231_modifier: "$scheme_apa_positive.0231.t$"
 scheme_apa_positive_0231_modifier_desc: "Některé prameny jsou natolik zásadní, že mohou zcela změnit naše chápání daného tématu."
 scheme_apa_positive_0241_modifier: "$scheme_apa_positive.0241.t$"
 scheme_apa_positive_0241_modifier_desc: "Učení je osobní zkušenost a každému vyhovuje jiný způsob."
 scheme_apa_positive_0251_modifier: "$scheme_apa_positive.0251.t$"
 scheme_apa_positive_0251_modifier_desc: "Je nádherné, když vše náhle zapadne na své místo."
 scheme_apa_positive_0261_modifier: "$scheme_apa_positive.0261.t$"
 scheme_apa_positive_0261_modifier_desc: "Polovinou úspěchu je přesvědčit ostatní. Co tedy znamená, když už jsou dávno rozhodnuti?"
 scheme_apa_positive_0271_modifier: "$scheme_apa_positive.0271.t$"
 scheme_apa_positive_0271_modifier_desc: "Zástup písařů dokáže přemístit hory užitečných písemností."
 scheme_apa_positive_0281_modifier: "$scheme_apa_positive.0281.t$"
 scheme_apa_positive_0281_modifier_desc: "Záložní plány, úklady a tahy pro každou představitelnou podobu spiknutí."
 scheme_apa_positive_0291_modifier: "$scheme_apa_positive.0291.t$"
 scheme_apa_positive_0291_modifier_desc: "Nejdůležitější částí hry je správně rozestavit figurky."
 scheme_apa_positive_0301_modifier: "$scheme_apa_positive.0301.t$"
 scheme_apa_positive_0301_modifier_desc: "Když je vše předem zařízeno, odpor chřadne."
 scheme_apa_positive_0311_modifier: "$scheme_apa_positive.0311.t$"
 scheme_apa_positive_0311_modifier_desc: "Módní výstřelky se dvory šíří jako mor mezi chudinou a právě teď to intrice vyhovuje."
 scheme_apa_positive_0321_modifier: "$scheme_apa_positive.0321.t$"
 scheme_apa_positive_0321_modifier_desc: "Nestačí mít po ruce dobrého řečníka. Nejlépe poslouží takový, kvůli němuž lidé ruší jiné závazky."
 scheme_apa_positive_0331_modifier: "$scheme_apa_positive.0331.t$"
 scheme_apa_positive_0331_modifier_desc: "Nezáleží na tom, zda je to pravda. Záleží na tom, kolik lidí o tom #EMP mluví#!."
 scheme_apa_positive_0341_modifier: "$scheme_apa_positive.0341.t$"
 scheme_apa_positive_0341_modifier_desc: "Když lidé někomu důvěřují, že zůstane rozumný a umírněný, mají jeho přesná slova větší váhu než obvykle."
 scheme_apa_positive_0351_modifier: "$scheme_apa_positive.0351.t$"
 scheme_apa_positive_0351_modifier_desc: "Každý má své předsudky, liší se jen jejich počet a podoba."
 scheme_apa_positive_0361_modifier: "$scheme_apa_positive.0361.t$"
 scheme_apa_positive_0361_modifier_desc: "Úctu není o mnoho snazší využít než lásku či nenávist, je však mnohem všestrannější."
