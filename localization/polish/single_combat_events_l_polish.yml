 single_combat.0031.desc.opponent_response.technique_from_legend: "[sc_victor.GetFirstNameNoTooltip] na okamžik zaváhá, poté zaujme dramatický postoj a [sc_victor.Custom('signature_weapon')] na mě [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')].\n\n"
