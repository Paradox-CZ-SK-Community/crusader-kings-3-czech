 single_combat.0031.desc.opponent_response.attempt_disarm: "[sc_victor.GetFirstNameNoTooltip] zasadí mé [sc_loser.Custom('signature_weapon')] útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Prudká rána mi ji skutečně vyrazí z rukou.\n\n"
