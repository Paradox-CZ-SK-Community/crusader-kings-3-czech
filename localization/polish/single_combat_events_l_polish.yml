 single_combat.0031.desc.opponent_response.desert_warrior: "[sc_victor.GetFirstNameNoTooltip] využije vedra, nechá mě zcela se vyčerpat a poté"
 single_combat.0031.desc.opponent_response.jungle_stalker: "[sc_victor.GetFirstNameNoTooltip] obratně využívá džungli a vyčká, dokud se nezapletu do liány, načež"
