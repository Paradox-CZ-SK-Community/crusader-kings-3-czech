 single_combat.0001.desc.sc_defender.intro: "[sc_attacker.GetTitledFirstName] a já kolem sebe obezřetně kroužíme a každý zvažujeme své možnosti. [sc_attacker.GetSheHe|U] [sc_attacker.Custom('SignatureWeaponActionThirdPerson')] [sc_attacker.Custom('SignatureWeaponNameOrType')], zatímco já pevně svírám [sc_defender.Custom('SignatureWeaponNameOrType')]. Smrtící zbraň v mé dlani studí a příjemně tíží.\n\n"
 single_combat.0001.desc.capstone.intro.first_blood: "Tento boj sice potrvá jen do první krve, ale mé nervy to neuklidňuje."
 single_combat.0001.desc.capstone.intro.deadly: "Dnes odsud odejde jen jeden z nás a hodlám to být já."
 single_combat.0001.desc.sc_attacker.intro: "Na několik krátkých okamžiků [sc_defender.GetTitledFirstName] a já zvolna opisujeme půlkruhy a oba vyhlížíme příležitost. [sc_attacker.Custom('SignatureWeaponAction')] [sc_attacker.Custom('SignatureWeaponNameOrType')] a připravuji se bránit, zatímco [sc_defender.GetSheHe|l] pevně svírá [sc_defender.Custom('SignatureWeaponNameOrType')]."
 single_combat.0001.desc.sc_attacker.intro.epilogue: "\n\nNáhlým pohybem začíná náš souboj.\n\n"
