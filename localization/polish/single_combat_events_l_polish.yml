 single_combat.0031.desc.opponent_response.special_fallback: "[sc_victor.GetFirstNameNoTooltip] na zlomek vteřiny přimhouří oči a poté mě surově kopne do holeně.\n\nZakopnu a náhle hledím přímo na"
 single_combat.0031.desc.opponent_response.something_to_hide: "[sc_victor.GetFirstNameNoTooltip] zasyčí jedno z mých #EMP nejhanebnějších#! tajemství. Rozrušený a rozptýlený nechám příští úder zasáhnout,"
 single_combat.0031.desc.opponent_response.wait_and_hope.injury: "který mě zasáhne přímo do kloubů ruky svírající [sc_loser.Custom('signature_weapon')].\n\nPrsty se mi reflexivně rozevřou a zbraň s řinčením dopadne na zem.\n\nNěkolik vteřin na sebe oba #EMP nevěřícně#! hledíme, než [sc_victor.GetFirstNameNoTooltip] váhavě pozvedne [sc_victor.Custom('signature_weapon')].\n\n„V-vzdej se, nebo zemři!“"
 single_combat.0031.desc.opponent_response.unsure_attack.injury: "a navzdory váhavosti úderu mě nešťastně zasáhne a já se svalím na bok.\n\nNež se vyškrábu na nohy, nadšený protivník [sc_victor.GetFirstNameNoTooltip] už drží [sc_victor.Custom('signature_weapon')] v pohotovosti a jediným pohybem může [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.enthusiastic_onslaught.injury: "které mi málem useknou ruku svírající [sc_loser.Custom('signature_weapon')] přímo v zápěstí.\n\nJediný další úder stačí, abych klesl na kolena. Než stačím znovu zvednout kryt, [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('signature_weapon')] se mi dychtivě tlačí proti hrdlu."
 single_combat.0031.desc.opponent_response.hail_mary.injury: "Na okamžik mě pobaví protivníkova troufalost, ale pak ucítím, jak se mi cosi zahákne za nohu.\n\nVzápětí ležím na zemi a [sc_victor.GetFirstNameNoTooltip] stojí nade mnou stejně překvapeně jako já. Ruka svírající [sc_victor.Custom('signature_weapon')] však zůstává pevná a výhružná."
 single_combat.0031.desc.opponent_response.pocket_sand.injury: "něco těžkého mi podrazí kolena.\n\nRychle mrkám a snažím se znovu zaostřit. Z mlhavého obrazu přede mnou se vynoří [sc_victor.GetFirstNameNoTooltip] se [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] a chystá se [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.nut_em.injury: "a já padnu jako podťatý.\n\nPři #EMP [sc_loser.GetFaith.HighGodName]#!, [sc_victor.GetWomanMan|l] má #EMP absurdně#! tvrdou lebku.\n\nSvět se mi stále točí a bílé záblesky bolesti trhají můj zrak na kusy, když spatřím, jak [sc_victor.GetFirstNameNoTooltip] připravuje [sc_victor.Custom('signature_weapon')], aby mě jediným rychlým úderem [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.guard.injury: "a pak mi #EMP bleskovou#! kombinací krytu a riposty vykroutí [sc_loser.Custom('signature_weapon')] přímo z ruky.\n\nSotva stačím mrknout.\n\nProtivník překypuje sebejistotou, přechází do útočného postoje a chystá se [sc_loser.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.probing_attack.injury: "pokaždé nahlodává mé odhodlání pečlivě vedeným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nZe všech sil se bráním, ale nakonec mi protivník vyrazí [sc_loser.Custom('signature_weapon')] čistě z ruky.\n\nZbývá mi jen několik vteřin, než budu [sc_loser.Custom('SignatureWeaponKillTypePastParticiple')]."
 single_combat.0031.desc.opponent_response.onslaught.injury: "a znovu a znovu mě tlačí dozadu.\n\nBrzy se zhroutím a s rachotem dopadnu na záda. [sc_victor.GetFirstNameNoTooltip] nade mnou naposledy [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.Custom('signature_weapon')], připraven v jediném okamžiku vše ukončit."
 single_combat.0031.desc.opponent_response.surprise_attack.injury: "a zcela mě překvapí. Úder mě napůl otočí a málem srazí k zemi.\n\nNež se vzpamatuji, [sc_victor.GetSheHe|l] už znovu připraví [sc_victor.Custom('signature_weapon')] ke smrtícímu úderu. Oba znehybníme a zvažujeme další pohyb. Je zřejmé, že úder postavy [sc_victor.GetFirstNameNoTooltip] mě [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')] dříve, než stačím uhnout nebo jej odrazit."
 single_combat.0031.desc.opponent_response.taunt.injury: "neodhodím [sc_loser.Custom('signature_weapon')] a nepokusím se protivníka vlastnoručně uškrtit.\n\nTeprve když přede mnou [sc_victor.GetFirstNameNoTooltip] zamává [sc_victor.Custom('signature_weapon')], uvědomím si, co jsem provedl."
 single_combat.0031.desc.opponent_response.put_the_boot_in.injury: "Snažím se ze všech sil, ale protivník okamžitě spustí přehlídku útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')]. Zanedlouho ležím na zemi, omráčený a lapající po dechu.\n\nPřestože mám [sc_loser.Custom('signature_weapon')] stále po ruce, [sc_victor.GetFirstNameNoTooltip] už drží [sc_victor.Custom('signature_weapon')] připravený, aby mě [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.strict_guard.injury: "mě neodhodí dozadu.\n\nNež znovu získám rovnováhu, [sc_victor.GetFirstNameNoTooltip] je opět u mě. [sc_victor.Custom('signature_weapon')] letí koncem [sc_victor.Custom('SignatureWeaponEndType')] přímo proti mé hlavě a můj [sc_loser.Custom('MaskFace')] schytá plnou ránu tupým [sc_victor.Custom('SignatureWeaponEndMaterial')].\n\nAni si nevšimnu, jak mi [sc_loser.Custom('signature_weapon')] vyklouzne z ruky."
 single_combat.0031.desc.opponent_response.confident_attack.injury: "a postupně mě zpracovává, dokud můj kryt nepovolí natolik, že se otevře #EMP dokonalá#! příležitost.\n\nJediným mohutným úderem mě [sc_victor.GetWomanMan|l] pošle vrávorat dozadu a [sc_loser.Custom('signature_weapon')] mi vyletí z ruky.\n\nJediný chybný krok teď znamená smrt."
 single_combat.0031.desc.opponent_response.expert_onslaught.injury: "mě s každým úderem sráží a při každém krytu mi drtí kosti, dokud se téměř rozlámaný nezhroutím na zem.\n\nJe mi taková zima a hlava se mi točí. Jako by mi bušila lebka, ale mysl byla někde úplně jinde. Co se... točíme se? Točím se já?\n\nPři chrčivém zakašlání mi z úst vyletí chuchvalec krvavého hlenu a křeč mi vyrazí [sc_loser.Custom('signature_weapon')] z ruky. [sc_victor.GetFirstNameNoTooltip] zbraň odkopne z dosahu a přitiskne mi chladný kov [sc_victor.Custom('signature_weapon')] k hrdlu."
 single_combat.0031.desc.opponent_response.attempt_disarm.injury: "Chvíli na sebe hledíme. Panuje mezi námi napjaté a rozpačité ticho a oba čekáme, kdo se pohne první.\n\n[sc_victor.GetFirstNameNoTooltip] výhružně [sc_victor.Custom('SignatureWeaponFlourishThirdPersonPresentParticiple')] [sc_victor.Custom('signature_weapon')] a pozvedne obočí."
 single_combat.0031.desc.opponent_response.tire_opponent.injury: "mi nezačne slábnout sevření [sc_loser.Custom('signature_weapon')].\n\nProtivník si zřejmě něčeho všimne v mém postoji, protože pevným rozmachem [sc_victor.Custom('signature_weapon')] pošle mou zbraň do vzduchu.\n\nJsem vydán na milost."
 single_combat.0031.desc.opponent_response.reason_you_suck_speech.injury: "mi z čirého vzteku nepovolí kryt.\n\nV #EMP přesně tom#! okamžiku protivník udeří a nacvičeným pohybem mi útok [sc_victor.Custom('SignatureWeaponAttemptedLight')] vyrve [sc_loser.Custom('signature_weapon')] z ruky.\n\n„Neboj se, [sc_victor.GetFirstNameNoTooltip]. [sc_loser.Custom('signature_weapon')] pořád držíš pevněji než své [sc_loser.GetPrimaryTitle.GetTierAsNameNoTooltip].“"
 single_combat.0031.desc.opponent_response.technique_from_legend.injury: "Ve výjevu jako vystřiženém z legendy protivník smete můj kryt, vyrve mi [sc_loser.Custom('signature_weapon')] z ruky a drtivým útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] mě srazí na zem.\n\n[sc_victor.Custom('signature_weapon')|U] drží vysoko a mého ohromeného výrazu si vůbec nevšímá. [sc_victor.GetSheHe|U] se chystá [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.like_a_viper.injury: "Pokusím se úder zmije odrazit, ale marně. Protivník využije příležitosti, zachytí mou [sc_loser.Custom('signature_weapon')], zkroutí ji nepřirozeným směrem a odmrští žalostně daleko z mého dosahu.\n\n[sc_victor.Custom('signature_weapon')] spočine na mé hrudi těsně před prudce bušícím srdcem."
 single_combat.0031.desc.opponent_response.pocket_silver.injury: "[sc_victor.GetSheHe|U] už pronikl se [sc_victor.Custom('signature_weapon')] #EMP dovnitř#! mého krytu, přímo pod mé hrdlo.\n\nReflexivně pohnu [sc_loser.Custom('signature_weapon')] a v rozpačitém tichu zvažuji své možnosti.\n\n[sc_victor.GetFirstNameNoTooltip] se na mě zamračí a napne svaly k úderu."
 single_combat.0031.desc.opponent_response.martial_voice.injury: "Uskočím dozadu tak rychle, až málem vyskočím z vlastní kůže. Teprve po zlomku vteřiny si uvědomím, že [sc_loser.Custom('signature_weapon')] neuskočil se mnou, ale po vyklouznutí z ruky rotuje vzduchem. Zůstávám bezbranný, zatímco [sc_victor.GetFirstNameNoTooltip] se napřahuje k druhému úderu."
 single_combat.0031.desc.opponent_response.mocking_boast.injury: "mi koncem [sc_victor.Custom('SignatureWeaponEndType')] vlastní [sc_loser.Custom('signature_weapon')] zasadí pořádnou ránu do ruky svírající [sc_loser.Custom('signature_weapon')] a vyrazí mi ji z ruky.\n\nProtivník se s okázalým pohybem a úšklebkem připravuje [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')].\n\n„Tak co říká poražený?“"
 single_combat.0031.desc.opponent_response.desert_warrior.injury: "mě sérií přesně mířených útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] vyčerpaného srazí do [sc_defender.Custom('GroundType')].\n\nPřevalím se a spatřím, jak se [sc_victor.GetFirstNameNoTooltip] chystá [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]. [sc_victor.Custom('signature_weapon')|U] už drží vysoko."
 single_combat.0031.desc.opponent_response.jungle_stalker.injury: "mě #EMP tvrdě#! kopne do rozkroku a s výkřikem mě srazí k zemi.\n\nNěkolik vteřin sebou na zemi zmítám, snažím se vyprostit ze spárů té prokleté ďábelské rostliny a proklínám spalující bolest v slabinách. Náhle znehybním, když na čele ucítím chladný kov [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')], konkrétně její [sc_victor.Custom('SignatureWeaponTipType')]."
 single_combat.0031.desc.opponent_response.open_terrain_expert.injury: "Zanedlouho vyčerpaně zavrávorám a protivník mě jediným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] pošle k zemi.\n\nPokusím se vstát, ale na hrudi mi přistane bota postavy [sc_victor.GetFirstNameNoTooltip]. [sc_victor.GetSheHe|U] pozvedne [sc_victor.Custom('signature_weapon')] a chystá se [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.rough_terrain_expert.injury.rocky: "nepřepadnu dozadu přes malý sráz a tvrdě nedopadnu mezi kameny, jen těsně vedle vlastní [sc_loser.Custom('signature_weapon')].\n\nJak nejlépe dovedu, vyškrábu se na nohy, ale chladný kov [sc_victor.Custom('signature_weapon')] už se mi tiskne k zátylku."
 single_combat.0031.desc.opponent_response.rough_terrain_expert.injury.boggy: "nespadnu pozpátku přímo do kalné bažinaté vody.\n\n[sc_loser.Custom('signature_weapon')|U] mi okamžitě vyklouzne z ruky a já sebou zmítám, snažím se dostat hlavu nad hladinu, nadechnout se a vyplivnout páchnoucí bahno.\n\nNa můj [sc_loser.Custom('MaskFace')] lehce došlápne bota, drží mě jen těsně nad hladinou a hrozí, že mě zatlačí dolů."
 single_combat.0031.desc.opponent_response.forest_fighter.injury: "pařez, do kterého mě [sc_victor.GetSheHe|l] strčí zády.\n\nPřevalím se přes hlavu a [sc_loser.Custom('signature_weapon')] odletí do podrostu. Než se vzpamatuji, těžký kop mě srazí mezi listí a chladný kov [sc_victor.Custom('signature_weapon')] se mi pevně přitiskne k hrdlu."
 single_combat.0031.desc.opponent_response.raaargh.injury: "cloumá se mnou jako s hadrovou panenkou.\n\nPřepadnu dozadu a ztratím [sc_victor.Custom('signature_weapon')]. [sc_victor.GetSheHe|U] se nade mnou tyčí a v [sc_victor.Custom('EyeEyes')] má vražednou zvířecí #EMP nenávist#!. Takhle... takhle zemřu.\n\nStejně rychle, jako zuřivost přišla, zase zmizí. [sc_victor.GetFirstNameNoTooltip] se lehce kolébá, ale i během krátkého uklidnění je stále připraven [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.hard_grit.injury: "S profesionální obratností mě [sc_victor.GetFirstNameNoTooltip] žene ze strany na stranu. Každý úder mě postrčí tam, kam potřebuje, dokud mi [sc_loser.Custom('signature_weapon')] nevykroutí přímo z [sc_loser.Custom('HandHands')].\n\nNa okamžik zůstanu ohromeně stát."
 single_combat.0031.desc.opponent_response.feint_and_stab.injury: "Pokusím se přejít ke správnému krytu, ale už je pozdě a hlavice dýky mě tvrdě zasáhne do tváře.\n\nSevření zbraně povolí a já slyším, jak mi s rachotem vypadne z ruky. Po úderu se mi všechno rozmazává před očima."
 single_combat.0031.desc.opponent_response.butchery.injury: "Téměř cítím, jak se lámou drobné kosti a krev se dere pohmožděnými tepnami proti zničenému masu. Zrak se mi kalí a svět se houpe. Jak dlouho už bojujeme? Kdy jsem se ocitl na zemi?\n\n[sc_victor.GetFirstNameNoTooltip] se nade mnou tyčí s vysoko zdviženou [sc_victor.Custom('signature_weapon')] a chystá se [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.stoic_veteran.injury: "z nichž každý se zakusuje do materiálu [sc_loser.Custom('SignatureWeaponEndMaterial')] mé [sc_loser.Custom('signature_weapon')], dokud [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nPak už je pro [sc_victor.GetFirstNameNoTooltip] hračka vyrvat mi rozbitou [sc_loser.Custom('signature_weapon')] z ruky. Zůstávám bezbranný a vydaný napospas dalšímu úderu."
 single_combat.0031.desc.opponent_response.blade_dance.injury: "tančí vstříc mým úderům, ale vždy na poslední okamžik ustoupí.\n\nTéměř mě to okouzlí a pak je [sc_loser.Custom('signature_weapon')] náhle pryč. Zbraň s řinčením odletí a já zůstanu bezbranný, zatímco se [sc_victor.GetFirstNameNoTooltip] chystá [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.wrath_of_highgod.injury: "nečekaný útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který mě zcela vyvede z rovnováhy.\n\n[sc_victor.GetFirstNameNoTooltip] vyrazí vpřed a zastaví [sc_victor.Custom('signature_weapon')] sotva palec od mého [sc_loser.Custom('MaskFace')].\n\n„Ve jménu [sc_victor.GetFaith.WarGodName] se vzdej, nebo zemři!“"
 single_combat.0031.desc.opponent_response.hurt_me_better.injury: "vydá hrdelní řev a spustí příval útoků [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')], který mě srazí na kolena.\n\nPokusím se pozvednout [sc_loser.Custom('signature_weapon')] a odrazit další ničivý úder, ale místo toho dostanu prudké koleno přímo do [sc_loser.Custom('MaskFace')].\n\nZhroutím se pozpátku do [sc_defender.Custom('GroundType')]. Všechno se mi rozmazává a před očima se mi zaostří lesk [sc_victor.Custom('signature_weapon')], konkrétně její [sc_victor.Custom('SignatureWeaponTipType')]."
 single_combat.0031.desc.opponent_response.special_fallback.injury: "[sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('signature_weapon')], který se mi neúnosně blízko tiskne proti [sc_loser.Custom('MaskFace')]."
 single_combat.0031.desc.opponent_response.something_to_hide.injury: "a ten mě bolestivě vrátí do skutečnosti.\n\nNež znovu zvednu kryt, následný úder postavy [sc_victor.GetFirstNameNoTooltip] mi vyrve [sc_loser.Custom('signature_weapon')] z ruky a zanechá mě bezbranného."
 single_combat.0031.desc.opponent_response.wait_and_hope.fatality: "který mi jakýmsi způsobem pronikne přímo skrz kryt a [sc_victor.Custom('SignatureWeaponKillTypeTorsoThirdPersonActive')].\n\nZavrávorám dozadu a protivníkova [sc_victor.Custom('signature_weapon')] se ze mě s mokrým mlasknutím vysune. Z rány začne proudit krev, smáčí zem u mých nohou a má ústa se beze slov otevírají.\n\n[sc_victor.GetFirstNameNoTooltip] vypadá stejně šokovaně jako já."
 single_combat.0031.desc.opponent_response.unsure_attack.fatality: "a já zavrávorám dozadu.\n\n[sc_victor.GetSheHe|U] mě musel někde zasáhnout, ale náhlá bolest je příliš silná, než abych poznal kde. Z hrudi mi vytéká horká krev a bolest rozkvétá v uzlech, které se šíří horní částí těla.\n\n[sc_victor.GetFirstNameNoTooltip] okázale mávne [sc_victor.Custom('signature_weapon')] a vyrazí vpřed, aby mě [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.enthusiastic_onslaught.fatality: "které působí směšně. Alespoň dokud jeden nezasáhne ruku svírající [sc_loser.Custom('signature_weapon')] a nevyrazí mi zbraň.\n\nStačím jen zvednout ruku k obraně, když [sc_victor.GetFirstNameNoTooltip] přistoupí blíž a [sc_victor.Custom('signature_weapon')] mě [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')].\n\nÚsta se mi beze slov otevírají. Bolest je tak silná, že ze sebe vydám jen přidušené zachrčení."
 single_combat.0031.desc.opponent_response.hail_mary.fatality: "[sc_victor.GetHerHis|U] útok míří na takovou taktiku příliš vysoko. Jaký amatér! Skoro je mi ho líto. Vždyť taková rána by mě zasáhla nanejvýš do če-"
 single_combat.0031.desc.opponent_response.pocket_sand.fatality: "mě vzápětí do útrob zasáhne výbuch čirého utrpení.\n\nPřepadnu dozadu a cosi mě zachytí pod bradou a hluboko se zakousne do čelisti. Z rány volně tryská tepenná krev a můj život vytéká do [sc_defender.Custom('GroundType')], zatímco se hroutím k zemi."
 single_combat.0031.desc.opponent_response.nut_em.fatality: "a všechno zčerná. [sc_loser.Custom('EyeEyes')|U] mi prostě... přestanou sloužit. Zoufale kolem sebe máchám [sc_loser.Custom('signature_weapon')] a snažím se zahnat nepřátelského [sc_victor.GetWomanMan|l], který mě chce zabít.\n\nMarně. Ucítím, jak se mi cosi [sc_victor.Custom('SignatureWeaponWoundVerb1')] hluboko do ramene a vyrývá si krvavou cestu tělem.\n\nVrávorám, kolébám se a vykašlávám kovově chutnající hlen. [sc_victor.GetFirstNameNoTooltip] mi musel zasáhnout plíci."
 single_combat.0031.desc.opponent_response.guard.fatality: "dokud mi chybný pohyb vlastní [sc_loser.Custom('signature_weapon')] nevykroutí zbraň z ruky.\n\n[sc_victor.GetFirstNameNoTooltip] neztrácí čas a spustí sérii útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], z nichž každý mi z těla strhává krvavé cáry masa.\n\nKlesnu na kolena, sípu a vykašlávám husté rudé provazce slin. [sc_victor.GetFirstNameNoTooltip] má [sc_victor.Custom('MaskFace')] bez jediného náznaku emocí a připravuje se k poslednímu úderu."
 single_combat.0031.desc.opponent_response.probing_attack.fatality: "a nenápadně mě vyvádí stále více z rovnováhy, dokud mě jeden nepovedený úder nesrazí k zemi.\n\nUž se nezvednu. [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] mě jediným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoPresentParticiple')]."
 single_combat.0031.desc.opponent_response.onslaught.fatality: "je jich příliš mnoho, než abych je dokázal odrazit. První dva nebo tři vykryji, ale čtvrtý úder mi vyrazí [sc_loser.Custom('signature_weapon')] z [sc_loser.Custom('HandHands')] a pátý mi vyrazí dech.\n\nSotva stačím pochopit, co se děje, když se mi [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] hluboko do hrudního koše, drtí kosti a trhá maso.\n\nPadám dozadu, lapám po dechu a umírám. Hruď mi hoří a končetiny už chladnou. Zdá se, jako by samotné vědomí vytékalo z zející rány."
 single_combat.0031.desc.opponent_response.surprise_attack.fatality: "a [sc_loser.Custom('signature_weapon')] mi vyletí z ruky.\n\nRychle ustupuji, ale ne tak rychle, aby [sc_victor.GetFirstNameNoTooltip] nestačil vyrazit vpřed a jediným pohybem mě [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonPresentParticiple')].\n\nŽivot ze mě vytéká a já se hroutím. Zbývá mi jen tolik vědomí, abych se svému vrahovi podíval do očí."
 single_combat.0031.desc.opponent_response.taunt.fatality: "neopustím kryt a nevrhnu se na protivníka.\n\nNení divu, že můj bezhlavý útok poskytne postavě [sc_victor.GetFirstNameNoTooltip] volnou cestu přímo k mému břichu."
 single_combat.0031.desc.opponent_response.put_the_boot_in.fatality: "Otevřenou příležitost [sc_victor.GetFirstNameNoTooltip] dokonale využije. Plynule přejde do útoku [sc_victor.Custom('SignatureWeaponAttemptedLight')], který mi vyrve [sc_loser.Custom('signature_weapon')] z ruky.\n\nNež stačím uhnout, [sc_victor.GetSheHe|l] už vede zpětný úder a [sc_victor.Custom('signature_weapon')] se mi [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] smrtelně do hrudi."
 single_combat.0031.desc.opponent_response.strict_guard.fatality: "neroztrhne můj kryt. Další mi vyšle hrudí záchvěv mrazivé bolesti a paže svírající [sc_loser.Custom('signature_weapon')] mi bezvládně klesne k boku.\n\nKončetinu necítím, nohy se odmítají pohnout a nemohu nic dělat.\n\nDalší útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] mi [sc_victor.Custom('SignatureWeaponCriticalPresent')] hruď a já zavrávorám na místě.\n\n[sc_victor.GetFirstNameNoTooltip] připraví [sc_victor.Custom('signature_weapon')] k poslednímu úderu."
 single_combat.0031.desc.opponent_response.confident_attack.fatality: "dokud mě nečekaný úder ze strany nerozpáře přímo v útrobách.\n\nRána mě odhodí dozadu a při pádu do [sc_defender.Custom('GroundType')] mi z rány vyklouzne cosi masitého a temně rudého.\n\nBolest mě zcela pohltí. Krvácel jsem někdy tolik? [sc_loser.Custom('signature_weapon')|U] odletí po kopnutí stranou, ale už mi na tom nezáleží.\n\nNade mnou [sc_victor.GetFirstNameNoTooltip] připravuje poslední úder [sc_victor.Custom('signature_weapon')]."
 single_combat.0031.desc.opponent_response.expert_onslaught.fatality: "mě srazí k zemi a zanechá ze mě křičící, rozlámanou hromadu.\n\nZrak se mi kalí a mizí pod náporem bolesti, ale stále rozeznám zkrvavené cáry vlastního masa ulpívající na [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip].\n\nDalší úder mě zasáhne do hrdla a mé výkřiky ukončí krvavým milosrdenstvím."
 single_combat.0031.desc.opponent_response.attempt_disarm.fatality: "Než stačím protestovat, [sc_victor.GetFirstNameNoTooltip] mi pošle útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] přímo do hrudního koše a všechno se smrskne na spalující bolest.\n\nDalší dva údery ještě cítím, ale jen vzdáleně, jako skrze mlhu nebo těžký závoj. Zrak se mi zúží do jediného bodu."
 single_combat.0031.desc.opponent_response.tire_opponent.fatality: "se v mém krytu neotevře dostatečná mezera.\n\nDalší úder mi rozpáře břicho a na boty se mi vyvalí krev, žluč i napůl strávené jídlo.\n\nKřičím v nepředstavitelné bolesti a svírám obnažené vnitřnosti. Možná si to jen namlouvám, ale zdá se mi, že se na [sc_victor.GetFirstNameNoTooltip] na okamžik objeví záblesk lítosti, když pozvedne [sc_victor.Custom('signature_weapon')] a chystá se ukončit mé utrpení."
 single_combat.0031.desc.opponent_response.reason_you_suck_speech.fatality: "nevykřiknu vzteky.\n\nPrávě na to [sc_victor.GetFirstNameNoTooltip] #EMP přesně#! čekal. Krátkého rozptýlení využije k prolomení mého krytu a [sc_victor.Custom('signature_weapon')] mi [sc_victor.Custom('SignatureWeaponWoundVerb5')] do hrdla.\n\nOkamžitě se začnu dávit a dusit, ale vzduch nepřichází. Jen krev. Husté chuchvalce krve smíšené se slinami, které mi stoupají hrdlem a vytékají z úst."
 single_combat.0031.desc.opponent_response.technique_from_legend.fatality: "Pokusím se úder odrazit, ale něco... špatně odhadnu. Svět se roztočí a zmocní se mě závratný, odporný pohyb, dokud má hlava s masitým #EMP žuchnutím#! do něčeho nenarazí.\n\nNic necítím. Nemohu mluvit. Já... vidím své tělo ležet o několik kroků dál a z pahýlu krku tryská krev.\n\nJsem..."
 single_combat.0031.desc.opponent_response.like_a_viper.fatality: "Čas se jako by zpomalí. Cítím, jak se paže se [sc_loser.Custom('signature_weapon')] pohybuje příliš pomalu, než aby zasáhla. Můj pohled však zůstává upřený na smrtící zbraň, která se chystá [sc_victor.Custom('SignatureWeaponWoundVerb3')] mou hruď.\n\nPak udeří.\n\nMaso se trhá. Kosti praskají a následně se tříští. Cítím, jak mi něco pronikne zády ven, ale nedokážu poznat, zda je to část mě, nebo kov. Nemohu... nemohu dýchat. Nic necítím. Nemohu."
 single_combat.0031.desc.opponent_response.pocket_silver.fatality: "proti mně už stoupá [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')].\n\nZbraň mě zasáhne přímo do úst v explozi zubů a krvavých kusů masa. Čelist mi bezvládně visí a je k ničemu. Vrávorám a snažím se křičet, ale vycházejí ze mě jen přidušené vzlyky.\n\nMilosrdný úder postavy [sc_victor.GetFirstNameNoTooltip] už ani nespatřím."
 single_combat.0031.desc.opponent_response.martial_voice.fatality: "Na tom hlasu je cosi, co mě zmrazí jako jelena při zaznění loveckého rohu. Úder by měl být snadné odrazit, uhnout mu nebo... udělat cokoli.\n\nAle já neudělám nic.\n\nMísto toho se mi [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] hluboko do ramene, rozestoupí kosti a postříká nás oba tepennou krví."
 single_combat.0031.desc.opponent_response.mocking_boast.fatality: "mi vyrazí [sc_loser.Custom('signature_weapon')] z ruky, jako by šlo o dětskou hračku.\n\n[sc_loser.Custom('EyeEyes')|U] se mi rozšíří strachem a propadnu panice, ale už je pozdě. [sc_victor.Custom('signature_weapon')|U] se řítí vpřed, připravený mě jediným rychlým úderem [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.is_that_a_crocodile.fatality: "se do mě vřítí a srazí mě k zemi.\n\n[sc_loser.Custom('signature_weapon')|U] odletí stranou. Na zlomek vteřiny hledím přímo do rozevřené tlamy děsivého plaza.\n\nPak všechno zahalí tma, vlhko a bolest. Zmítám se, dusím se a snažím se křičet, ale z tlamy šelmy se neozývá nic kromě praskání drcených kostí a vystřikujícího morku."
 single_combat.0031.desc.opponent_response.desert_warrior.fatality: "mi obratně podkopne kolena.\n\nOdhozen do [sc_defender.Custom('GroundType')] se marně snažím vstát a vůbec nemohu popadnout dech.\n\n[sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] se mi shora [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] do hrudi a v jediném okamžiku je po všem. Končetiny sebou žalostně škubají, ale boj už mé tělo opustil."
 single_combat.0031.desc.opponent_response.jungle_stalker.fatality: "mě zasáhne koncem [sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] přímo do oka.\n\nPřekvapený a už tak zápasící s porostem pustím vlastní [sc_loser.Custom('signature_weapon')].\n\nBez obrany jsem pro [sc_victor.GetFirstNameNoTooltip] snadnou kořistí a série útoků [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] mě postupně vykuchá."
 single_combat.0031.desc.opponent_response.open_terrain_expert.fatality: "Teprve když se příliš natáhnu, pochopím, co [sc_victor.GetSheHe|l] zamýšlí. [sc_loser.Custom('signature_weapon')|U] mám příliš daleko před sebou, zatímco [sc_victor.GetFirstNameNoTooltip] obloukem vrátí [sc_victor.Custom('signature_weapon')] zpět a v boku mi vybuchne do běla rozpálená bolest.\n\nZhroutím se, sípu, kašlu a hltám přidušené doušky vzduchu. Je to k ničemu.\n\n[sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.Custom('signature_weapon')] k poslednímu úderu."
 single_combat.0031.desc.opponent_response.rough_terrain_expert.fatality.rocky: "nezakopnu, neuklouznu a nesvalím se ze svahu s končetinami rozházenými do všech stran.\n\nCosi ostrého, kámen nebo zbraň, mě zasáhne do páteře. Dolní polovina těla znecitliví, zatímco horní křičí bolestí. Svět se náhle přestane otáčet. Paže se mi ohýbá nesprávným směrem, oko se plní krví a je mi taková zima.\n\n[sc_victor.GetFirstNameNoTooltip] se nade mnou tyčí, připraven ukončit mé utrpení."
 single_combat.0031.desc.opponent_response.rough_terrain_expert.fatality.boggy: "neuklouznu a nespadnu do hluboké tůně brakické vody.\n\n[sc_loser.Custom('signature_weapon')|U] okamžitě zmizí a při mém zmítání mi na zátylek došlápne těžká bota a drží mě pod páchnoucí hladinou.\n\nNa každý můj pokus o odpor odpoví [sc_victor.GetFirstNameNoTooltip] ledabylým rozmachem [sc_victor.Custom('signature_weapon')], dokud mi nezbude síla ani na to, abych se jej pokusil odstrčit."
 single_combat.0031.desc.opponent_response.forest_fighter.fatality: "větev, o kterou zakopnu a zřítím se do podrostu.\n\nTrny a ostružiní mi rozdírají [sc_loser.Custom('MaskFace')] a cosi pevného mi málem vyrve [sc_loser.Custom('signature_weapon')] z ruky. V předklonu na zemi se snažím zbraň uvolnit, když se mi něco chladného jako smrt [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')].\n\nOkamžitě se zhroutím a ústa se mi naplní hlínou a hnijícím rostlinstvem. Nohy necítím a paže mám jako z rosolu.\n\n[sc_victor.GetFirstNameNoTooltip] mě kopnutím obrátí na záda a připraví se k poslednímu úderu."
 single_combat.0031.desc.opponent_response.raaargh.fatality: "[sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')] mou [sc_loser.Custom('signature_weapon')] jediným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\n[sc_victor.GetFirstNameNoTooltip] vyrazí vpřed a udeří mě pěstí do [sc_loser.Custom('MaskFace')] tak silně, že spolknu několik zubů a odletím dozadu s hlavou jako bodem otáčení.\n\nTvrdě narazím do [sc_defender.Custom('GroundType')] a vůbec nedokážu pochopit, co se děje. Než se vzpamatuji, řítí se proti mému [sc_loser.Custom('MaskFace')] surově rychlá bota.\n\nA znovu a znovu a znovu..."
 single_combat.0031.desc.opponent_response.hard_grit.fatality: "Brzy musím čelit skutečnosti. [sc_victor.GetSheHe|U] mě zatlačil do obrany, nemám žádnou příležitost získat zpět půdu a nemohu krýt věčně.\n\nKdyž smrt přijde, je alespoň rychlá. [sc_victor.Custom('signature_weapon')] mi [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] krk v krvavou změť."
 single_combat.0031.desc.opponent_response.feint_and_stab.fatality: "Úder se mi zařízne do hrudi a z rány vytryskne hotová fontána krve.\n\nMožná bylo pošetilé postavit se proti [sc_victor.GetWomanMan|l], který zabíjí pro zábavu tak často. Možná ano a možná ne. Rychle se šířící necitlivost končetin mi každopádně napovídá, že mi na litování vlastních chyb nezbývá mnoho času."
 single_combat.0031.desc.opponent_response.butchery.fatality: "Zanedlouho ze mě zbude jen chvějící se troska a [sc_loser.Custom('EyeEyes')] šílí bolestí. Přál bych si necítit nic, ale každý úder [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] utrpení jen zesiluje.\n\nKdyž mě nakonec [sc_victor.GetSheHe|l] popadne zezadu za hlavu a [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')], působí to téměř jako milosrdenství. Alespoň zemřu rychleji."
 single_combat.0031.desc.opponent_response.stoic_veteran.fatality: "dokud poslední prudký tlak proti mé [sc_loser.Custom('signature_weapon')] nezpůsobí, že [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent2')].\n\nNemám mnoho času přemýšlet nad svým neštěstím. Další úder mě zasáhne přímo do hrudi a [sc_victor.Custom('SignatureWeaponKillTypeTorsoThirdPersonActive')].\n\nZhroutím se k zemi a život ze mě s každou vteřinou odtéká. Ústa se mi pohybují spíše náhodou než z vlastní vůle. [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] ve mně stále vězí."
 single_combat.0031.desc.opponent_response.blade_dance.fatality: "a vykresluje krvavé tahy do mého předloktí a horní části hrudi. Krev ze mě čerpá jako vodu ze studny.\n\nŽe jsem pro protivníka pouhou hračkou, pochopím až ve chvíli, kdy si [sc_victor.GetSheHe|l] dohraje.\n\nVykrvácený a umírající klesnu na kolena. Louže vlastní krve mě hřeje, zatímco se snažím vzhlédnout ke svému vrahovi.\n\n[sc_victor.GetFirstNameNoTooltip] mi pohled oplatí s prázdným nezájmem. [sc_victor.Custom('signature_weapon')|U] začíná děsivě klesat."
 single_combat.0031.desc.opponent_response.wrath_of_highgod.fatality: "útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který zasáhne tak tvrdě, až [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')] mé [sc_loser.Custom('signature_weapon')].\n\nOhromeně ztuhnu a bezcennou zbraň upustím do [sc_defender.Custom('GroundType')]. Trvá to jen vteřinu, ale právě tolik [sc_victor.GetFirstNameNoTooltip] potřebuje, aby mě [sc_loser.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.opponent_response.hurt_me_better.fatality: "přijde série útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], které se mnou smýkají jako s novorozeným štěnětem.\n\nKaždý můj protiútok je k ničemu. Protivník snese absurdní množství ran, pokud mi je může vrátit i s úroky.\n\nSmrtící úder nevidím, jen cítím, jak se mi [sc_victor.Custom('SignatureWeaponWoundVerb2PresentParticiple')] do boku. Horká krev mi začne pulzovat po pase, zatímco se hroutím do [sc_defender.Custom('GroundType')]."
 single_combat.0031.desc.opponent_response.special_fallback.fatality: "[sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip], který se řítí přímo proti mé [sc_loser.Custom('MaskFace')]. S vyraženým dechem padnu na záda a [sc_loser.Custom('signature_weapon')] při pádu odskočí stranou. Protivník mě kopnutím obrátí na záda.\n\nNež stačím protestovat, [sc_victor.GetSheHe|l] mě [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')]. Mé břicho #EMP zpívá#! bolestí, končetiny znecitliví a tvář mi chladne.\n\nTohle... tohle je konec."
 single_combat.0031.desc.sc_attacker.wait_and_hope: "Doufat, že se protivník porazí vlastní chybou, nebyl dobrý nápad.\n\nNerozhodností úplně ztuhnu a stanu se snadnou kořistí pro útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který"
 single_combat.0031.desc.sc_attacker.unsure_attack: "Spíše s nadějí než s obratností se pokusím o váhavý útok [sc_loser.Custom('SignatureWeaponAttemptedLight')], ale ničeho tím nedosáhnu. Protivník před mým úderem bez potíží ustoupí a vzápětí"
 single_combat.0031.desc.sc_attacker.enthusiastic_onslaught: "Vrhnout se na protivníka se [sc_loser.Custom('signature_weapon')] divoce [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] a zasypávat ho útoky, dokud nepadne, mi připadá jako skvělý plán.\n\n"
 single_combat.0031.desc.sc_attacker.hail_mary: "Někdy v boji jednoduše poznáš, že na protivníka nestačíš. Přesně tak je tomu i nyní a můj zoufalý příval útoků [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] se rychle mění v"
 single_combat.0031.desc.sc_attacker.pocket_sand: "Popadnu hrst [sc_defender.Custom('GritType')] a mrštím ji po protivníkovi. Poryv větru mi však zhatí záměr a pošle [sc_defender.Custom('GritType')] přímo do #EMP mého#! [sc_loser.Custom('MaskFace')].\n\n"
 single_combat.0031.desc.sc_attacker.nut_em: "Přísahal bych, že jsem v protivníkově krytu zahlédl mezeru. Když však vyrazím vpřed a snažím se udeřit hlavou do [sc_victor.GetHerHis|l] [sc_loser.Custom('MaskFace')], něco mě zasáhne"
 single_combat.0031.desc.sc_attacker.guard: "Ze všech sil se snažím udržet pevný obranný postoj, ale není mi to nic platné. Nápadná mezera v mém krytu umožní protivníkovi využít"
 single_combat.0031.desc.sc_attacker.probing_attack: "Pokus šetřit síly rychle ztroskotá, když protivník jeden z mých zkušebních útoků odrazí tak prudce, že"
 single_combat.0031.desc.sc_attacker.onslaught: "Vedu proti protivníkovi útok [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] za útokem [sc_loser.Custom('SignatureWeaponAttemptedHeavy')]. Nekonečný příval ran drtivě zasahuje. Dokud náhle nezasáhne jen prázdný vzduch.\n\n"
 single_combat.0031.desc.sc_attacker.surprise_attack: "Ačkoli svůj záměr skrývám, jak nejlépe dovedu, protivník můj překvapivý útok prohlédne. Nečekaně jej odrazí a zatlačí mě do obrany.\n\n"
 single_combat.0031.desc.sc_attacker.taunt: "Ustoupím a připravuji se zasypat protivníka zdrcujícími urážkami, jenže se na okamžik nechám rozptýlit.\n\nAni nezahlédnu, jak se na mě řítí útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který"
 single_combat.0031.desc.sc_attacker.put_the_boot_in.peg_leg: "Můj útok [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] sice protivníka přiměje zavrávorat, ale [sc_victor.GetSheHe|l] odpoví ještě dříve, než dopadne můj kop. Tak surový útok [sc_victor.Custom('SignatureWeaponAttemptedLight')] mi urazí umělou nohu a pošle mě k zemi.\n\n"
 single_combat.0031.desc.sc_attacker.put_the_boot_in.fallback: "Můj útok [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] sice protivníka přiměje zavrávorat, ale následný kop mine. Po jediném protiútoku [sc_victor.Custom('SignatureWeaponAttemptedLight')] ležím na zemi a lapám po dechu.\n\n"
 single_combat.0031.desc.sc_attacker.strict_guard: "Jen málokdo by popřel, že můj kryt je téměř nemožné prolomit. Protivníkovi se to však přece jen podaří, možná díky schopnostem a možná pouhým štěstím.\n\n"
 single_combat.0031.desc.sc_attacker.confident_attack: "[sc_loser.Custom('signature_weapon')] vládnu zkušeně a elegantně, ale i mistr se někdy zmýlí. Uprostřed promyšleně riskantního útoku [sc_loser.Custom('SignatureWeaponAttemptedLight')] protivník"
 single_combat.0031.desc.sc_attacker.expert_onslaught: "Se smrtící obratností zasypávám protivníka hotovou záplavou útoků [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] a krok za krokem jej zatlačuji. Vítězství je tak blízko, že je téměř cítím!\n\n"
 single_combat.0031.desc.sc_attacker.attempt_disarm: "Usoudím, že právě nyní mám nejlepší příležitost ke snadnému vítězství, a jediným mohutným útokem [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] se pokusím vyrazit protivníkovi [sc_victor.Custom('signature_weapon')] z ruky. Téměř mě překvapí, když [sc_victor.GetSheHe|l] zachytí mou [sc_loser.Custom('signature_weapon')] ve špatném úhlu a"
 single_combat.0031.desc.sc_attacker.tire_opponent: "Hraji o čas, ustupuji před protivníkem a proplétám se mezi jeho údery v naději, že se vyčerpá. Tato strategie je nebezpečná i za nejlepších okolností a brzy mě zasáhne několik útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], které"
 single_combat.0031.desc.sc_attacker.reason_you_suck_speech: "Někdo by mě mohl považovat za hlupáka, když během souboje se smrtícími zbraněmi kritizuji způsob protivníkova života. Takoví lidé by se cítili oprávněně ve chvíli, kdy"
 single_combat.0031.desc.sc_attacker.technique_from_legend: "Často přemýšlím, zda má větší moc slovo, které napíše [sc_loser.GetLadyLord|l], nebo ostrý meč. Alespoň v případě mého protivníka je odpovědí zřejmě [sc_victor.Custom('signature_weapon')], protože mou nápodobu legendárního chvatu promění ve frašku.\n\n"
 single_combat.0031.desc.sc_attacker.like_a_viper: "Prudce vyrazím proti mezeře v protivníkově krytu. [sc_loser.Custom('SignatureWeaponTipType')] [sc_loser.Custom('signature_weapon')] se zaleskne a je připraven vše ukončit. Nepočítám však s"
 single_combat.0031.desc.sc_attacker.pocket_silver: "S veškerou obratností, kterou dokážu sebrat, utrhnu od pasu měšec s mincemi a mrštím jej přímo po protivníkovi. [sc_victor.GetSheHe|U] však instinktivně zareaguje rychleji, než čekám, a reflexivním útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] měšec roztrhne. Zasype mě tak sprškou těžkých stříbrných mincí.\n\nNavzdory překvapení však"
 single_combat.0031.desc.sc_attacker.martial_voice: "Velení chátrám a velení urozeným vojákům jsou k mému zklamání dvě odlišné dovednosti. Můj řev protivníka spíše rozzuří než zaskočí. Vyčká, dokud mi nedojde dech, a poté"
 single_combat.0031.desc.sc_attacker.mocking_boast: "„Víš, jak si lze snadno získat věhlas?“ zeptá se protivník a při mých posměšných chvástavých řečech přimhouří [my_foe.Custom('EyeEyes')]. „Zabít někoho slavného.“\n\nJá... [sc_victor.GetSheHe|l] se nemýlí. Mé zaváhání poskytne protivníkovi #EMP přesně#! tu správnou příležitost."
 single_combat.0031.desc.sc_attacker.is_that_a_crocodile: "Divokým úskokem se snažím dostat z dosahu šelmy. Jenže ona se ani nepohne.\n\nJe to kámen. Jen zatracený #EMP kámen#!, žádný zatracený krokodýl. Protivník mě teď zastihl bez rovnováhy a zcela rozhozeného.\n\n"
 single_combat.0031.desc.sc_attacker.desert_warrior: "Čekám a čekám, až protivníka vyčerpá pouštní žár. [sc_victor.GetSheHe|U] se však stále potí a stále bojuje a mé rozčarování oslabí můj kryt.\n\n"
 single_combat.0031.desc.sc_attacker.jungle_stalker: "Džungle ztěžuje mnoho částí boje, ale i trpělivý amatér dokáže překonat nejhorší překážky, pokud zachová chladnou hlavu. Zatímco čekám, až protivník ztratí trpělivost, ucítím, jak se mi cosi ovíjí kolem nohy. Pohlédnu dolů a zjistím, že mě zachytila silná liána.\n\n"
 single_combat.0031.desc.sc_attacker.open_terrain_expert: "Na rozlehlém bojišti ustupuji stále dál a vyměňuji půdu za rostoucí protivníkovu frustraci. Teprve když zakopnu, pochopím, že mě [sc_victor.GetSheHe|l] celou dobu zaháněl k překážce. Kámen spatřím až ve chvíli, kdy padám dozadu.\n\n"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.rocky: "Protivník má s bojem v tak nerovném a skalnatém terénu mnohem méně zkušeností než já, přesto si udržuje mimořádně pevný postoj. Mými strčeními tak narušuji jen #EMP vlastní#! rovnováhu.\n\n"
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.boggy: "I pro zkušeného bojovníka skrývají bažiny a močály mnoho těžko odhadnutelných nástrah. Každá tůň, k níž protivníka zatlačím, je neškodně mělká. Jakmile však do vody poprvé vstoupím já, propadnu se až po koleno!\n\n"
 single_combat.0031.desc.sc_attacker.forest_fighter: "Některé lesy jsou tak husté a hrozivé, že by se do nich sám vydal jen hlupák. Jiné působí tak idylicky, že by si v nich toužily hrát i děti.\n\nTento les patří spíše k druhému druhu. Zatímco se marně rozhlížím po nějaké přírodní nástraze, kterou bych mohl využít, protivník"
 single_combat.0031.desc.sc_attacker.raaargh: "S vražedným řevem se vrhám na protivníka. Máchám kolem sebe, tluču, koušu a kopu v bouři vzteku a násilí, která jako by neměla konce.\n\nPo jejím odeznění zjišťuji"
 single_combat.0031.desc.sc_attacker.hard_grit: "V boji snadno využívám protivníkovy domýšlivosti. Nezasloužená sebejistota si žádá rychlou porážku. Tento protivník mi však tvrdošíjně oplácí jen ránu za ránu a mezery nechává pouze proto, aby mě vylákal k příliš odvážnému útoku.\n\n"
 single_combat.0031.desc.sc_attacker.feint_and_stab: "Rozdělit pozornost mezi dva údery se ukáže být... příliš smělým plánem. Že mi protivník vyrval [sc_loser.Custom('signature_weapon')] z ruky, pochopím teprve ve chvíli, kdy dýka v druhé ruce samovolně škubne jejím směrem"
 single_combat.0031.desc.sc_attacker.butchery: "Ukáže se, že vraždit vyděšené rolníky v čele vojska profesionálních nájezdníků je poněkud jiné než bojovat v souboji s jediným odhodlaným protivníkem.\n\nPostupy, které děsí děti, nemocné a starce, na mého protivníka nezabírají. Využije mé přehnané sebejistoty a"
 single_combat.0031.desc.sc_attacker.stoic_veteran: "V gardě jsme císaře chránili především před vrahy, ale většina vrahů prchá už při pohledu na těžce ozbrojeného Varjaga. Ke své cti se můj protivník zastrašit nenechá a na každý můj stoický sek odpovídá dalším odhodlaným krytem.\n\n"
 single_combat.0031.desc.sc_attacker.blade_dance: "V boji jsem umělec. Každý úder je tahem štětce, každý padlý nepří- #EMP do hajzlu#!, au, sakra, má ruka se [sc_loser.Custom('signature_weapon')]! [sc_victor.GetSheHe|U] mě zasáhl #EMP přímo#! do ruky se [sc_loser.Custom('signature_weapon')], to se nemělo stát!\n\n"
 single_combat.0031.desc.sc_attacker.wrath_of_highgod: "Nepochybuji, že [sc_loser.GetFaith.HighGodName] si přeje mé vítězství, a ve své hlasité modlitbě to dávám jasně najevo. Protivník však využije mé rozptýlené pozornosti a"
 single_combat.0031.desc.sc_attacker.hurt_me_better: "Bolest mi není cizí a ze zranění, která mi protivník zasadil, se snažím čerpat sílu. Tentokrát je jich však příliš i na mě. Má mysl se méně soustředí na sladké bodání agonie a více na docela obyčejnou nepříjemnost rozervaného masa.\n\nS ochabující pozorností se můj nadšený nápor mění v žalostnou přehlídku útoků [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')].\n\n"
 single_combat.0031.desc.sc_attacker.special_fallback: "S veškerou zuřivostí, kterou dokážu sebrat, vyšlu prudký kop proti protivníkově holeni. Jenže #EMP úplně#! minu, ztratím rovnováhu a celé tělo letí za zbloudilou nohou.\n\n"
 single_combat.0031.desc.sc_attacker.something_to_hide: "Sotva se dostanu do poloviny nenápadné narážky na protivníkovy dluhy, když mě [sc_victor.GetHerHis|l] zbraň koncem [sc_victor.Custom('SignatureWeaponEndType')] zasáhne přímo do čelisti. Zavrávorám dozadu a"
 single_combat.0031.desc.sc_attacker.wait_and_hope.injury: "mě odhodí do [sc_defender.Custom('GroundType')]. Vyškrábu se zpět, ale než se zorientuji, [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('signature_weapon')] se mi už pevně tiskne k hrdlu.\n\nZnovu úplně ztuhnu."
 single_combat.0031.desc.sc_attacker.unsure_attack.injury: "vyrazí útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který mě zcela vyvede z rovnováhy.\n\nNež se stačím vzpamatovat, následný kop mě pošle k zemi a já hledím vzhůru na [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')], připravenou dopadnout na můj krk."
 single_combat.0031.desc.sc_attacker.enthusiastic_onslaught.injury: "Úder koncem [sc_victor.Custom('SignatureWeaponEndType')] do spánku ani tak nezahlédnu, jako spíše ucítím. Hlavou mi exploduje do běla rozpálená bolest a při pádu na bok se mi náhle změní pohled na svět.\n\nPřede mnou se objeví [sc_victor.GetFirstNamePossessiveNoTooltip] nohy, které se po soucitném zaváhání přesunou do bojového postoje.\n\nZbývá mi právě dost sil, abych zachraptěl jedinou větu."
 single_combat.0031.desc.sc_attacker.hail_mary.injury: "přehlídku naprostých průšvihů.\n\nÚdery míjejí, odrážejí se od krytů postavy [sc_victor.GetFirstNameNoTooltip] a zasahují mě. Ztratím rovnováhu a dokonce se vlastní zmítající rukou udeřím do [sc_loser.Custom('MaskFace')].\n\nKdyž mi protivník téměř jemně vyrazí [sc_loser.Custom('signature_weapon')] z ruky, působí to skoro jako milosrdenství."
 single_combat.0031.desc.sc_attacker.pocket_sand.injury: "Dusím se a prskám, takže se stanu snadnou kořistí postavy [sc_victor.GetFirstNameNoTooltip]. [sc_victor.GetSheHe|U] mě koncem [sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] udeří přímo do hrdla a odmrští do [sc_defender.Custom('GroundType')].\n\nSotva znovu popadnu dech, ucítím, jak se mi protivníkova zbraň opře o odhalené břicho."
 single_combat.0031.desc.sc_attacker.nut_em.injury: "tvrdě do břicha a pošle mě vzduchem tváří napřed k zemi.\n\nSnažím se vyškrábat na nohy, ale několik surových kopanců mě rychle přesvědčí, že to není dobrý nápad. Nepomáhá ani [sc_victor.Custom('signature_weapon')], která se mi lehce tiskne k zátylku."
 single_combat.0031.desc.sc_attacker.guard.injury: "několika přesně mířených útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], přičemž poslední úder mi vyrazí zbraň.\n\n[sc_victor.GetFirstNameNoTooltip] neztrácí čas a připravuje vlastní [sc_victor.Custom('signature_weapon')] ke smrtícímu úderu."
 single_combat.0031.desc.sc_attacker.probing_attack.injury: "ztratím úchop.\n\n[sc_loser.Custom('signature_weapon')] ladným obloukem odletí a ve vzduchu se přetáčí z jednoho konce na druhý. V těsné blízkosti protivníka zůstanu beze zbraně.\n\nAby bylo zřejmé, kdo souboj vyhrál, stačí postavě [sc_victor.GetFirstNameNoTooltip] pouze [sc_victor.Custom('SignatureWeaponAction')] vlastní [sc_victor.Custom('signature_weapon')]."
 single_combat.0031.desc.sc_attacker.onslaught.injury: "[sc_loser.Custom('signature_weapon')] však prosekne jen prázdný vzduch. Něco těžkého se mi zahákne za podkolenní jamku a trhne. Neohrabaně se napůl otočím ve snaze znovu namířit zbraň, ale odměnou mi je pěst plná do [sc_loser.Custom('MaskFace')].\n\nKdyž zavrávorám, pevný úder mi vyrve [sc_loser.Custom('signature_weapon')] z ruky a okamžitě pochopím, že jsem prohrál."
 single_combat.0031.desc.sc_attacker.surprise_attack.injury: "Než stačím otočit [sc_loser.Custom('signature_weapon')] a bránit se nevyhnutelné odvetě, nečekané koleno mě zasáhne do břicha. Když se v bolesti předkloním, schytám ještě loket do zátylku a téměř oslepený bolestí se zhroutím k zemi."
 single_combat.0031.desc.sc_attacker.taunt.injury: "mě zasáhne a s těžkým #EMP žuchnutím#! srazí k zemi.\n\nTváří zabořenou do [sc_defender.Custom('GroundType')] ze sebe dokážu sotva zamumlat jednu či dvě věty."
 single_combat.0031.desc.sc_attacker.put_the_boot_in.injury: "Převalím se na bok a snažím se rychle vstát, ale krutý úder [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] mě zasáhne do páteře a přitlačí k zemi.\n\nNěkde za sebou a nad sebou slyším, jak se [sc_victor.GetSheHe|l] s pohrdavým odfrknutím napřahuje ke smrtícímu úderu."
 single_combat.0031.desc.sc_attacker.strict_guard.injury: "Důležité je jen to, že po několika úderech [sc_victor.Custom('signature_weapon')] spočívá protivníkova zbraň chladně na mém hrdle a [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('SignatureWeaponTipType')] se mi tiskne k tepně.\n\nZatímco zvažuji své možnosti, [sc_victor.GetFirstNameNoTooltip] netrpělivě škubne zbraní."
 single_combat.0031.desc.sc_attacker.confident_attack.injury: "mi přesně provedeným krytem odrazí vlastní zbraň zpět proti tělu.\n\nPři úhybu před [sc_loser.Custom('signature_weapon')] se dostanu přímo do dráhy protivníkovy [sc_victor.Custom('signature_weapon')]. Úder se sice zastaví dříve, než způsobí smrtelné zranění, přesto mě odmrští k zemi. Má zbraň při pádu odletí stranou."
 single_combat.0031.desc.sc_attacker.expert_onslaught.injury: "Když si však na okamžik vychutnávám sladký pocit blížícího se vítězství, zničehonic mě do spánku tvrdě zasáhne útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Omráčeně zavrávorám a další rána mě zbaví zbraně. Jsem zcela vydán na milost postavě [sc_victor.GetFirstNameNoTooltip].\n\nVyčerpaný, ale vítězný protivník [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.Custom('signature_weapon')] ke smrtícímu úderu."
 single_combat.0031.desc.sc_attacker.attempt_disarm.injury: "vyrazí ji do vzduchu.\n\nZůstanu bezbranně stát a předtím, než mě [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')], mám jen okamžik na přiznání porážky."
 single_combat.0031.desc.sc_attacker.tire_opponent.injury: "mě tak prudce vyvedou z rovnováhy, že se jednoduše svalím.\n\n[sc_victor.GetFirstNameNoTooltip] nepolevuje a brzy stojí nade mnou, připraven [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]."
 single_combat.0031.desc.sc_attacker.reason_you_suck_speech.injury: "[sc_victor.GetSheHe|l] mě zpětným úderem konce [sc_victor.Custom('SignatureWeaponEndType')] zasáhne do krku.\n\nDusím se, prskám a snažím se dostat vzduch přes pohmožděné hrdlo. [sc_victor.GetFirstNameNoTooltip] má mezitím všechen čas světa na přípravu dokonalého úderu.\n\nZa jediný okamžik mě [sc_victor.GetSheHe|l] jistě [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.sc_attacker.technique_from_legend.injury: "Místo mistrovského chvatu, který by ukončil souboj, zaujmu dramatický postoj a zcela ztratím úchop [sc_loser.Custom('signature_weapon')]! Zbraň ladným obloukem odletí do dálky.\n\nPobavený a spokojený [sc_victor.GetFirstNameNoTooltip] jen neurčitě zamává vlastní [sc_victor.Custom('signature_weapon')] mým směrem."
 single_combat.0031.desc.sc_attacker.like_a_viper.injury: "naprostou #EMP houževnatostí#! protivníka.\n\n[sc_victor.GetFirstNameNoTooltip] se proti úderu nakloní místo toho, aby před ním ustoupil, a odkloní mě právě natolik, abych #EMP těsně#! minul. Tím se vystavím rychlému kolenu do břicha.\n\nKlesnu k zemi a dříve, než vůbec pomyslím na další pohyb, se mi [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] tiskne k hrdlu."
 single_combat.0031.desc.sc_attacker.pocket_silver.injury: "[sc_victor.GetFirstNameNoTooltip] využije výhody a vyrve mi [sc_loser.Custom('signature_weapon')] z ruky. Zcela bezbranný pak tiše vyplivnu stříbrnou minci."
 single_combat.0031.desc.sc_attacker.martial_voice.injury: "provede prudký útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\nZaskočený a bez dechu se bez odporu svalím. [sc_victor.GetFirstNameNoTooltip] mě překročí a připraví [sc_victor.Custom('signature_weapon')], aby mě [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.sc_attacker.mocking_boast.injury: "[sc_victor.GetSheHe|U] mě zasáhne do hrudi útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')]. Zaskočený a bez dechu nedokážu klást odpor dalšímu úderu, který mi vyrazí [sc_loser.Custom('signature_weapon')]. [sc_victor.GetFirstNameNoTooltip] se už připravuje, aby mě příštím útokem [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]."
 single_combat.0031.desc.sc_attacker.desert_warrior.injury: "Po několika nečekaných útocích [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] postavy [sc_victor.GetFirstNameNoTooltip] zakopnu a padnu tváří napřed do [sc_defender.Custom('GroundType')]. [sc_victor.Custom('signature_weapon')] mi okamžitě spočine na zátylku."
 single_combat.0031.desc.sc_attacker.jungle_stalker.injury: "Pokusím se vyprostit [sc_loser.Custom('signature_weapon')], ale nejsem dost rychlý. [sc_victor.GetFirstNameNoTooltip] mě zasáhne útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] a zarazí mou zbraň do země džungle.\n\nDo konce souboje mi zbývá nanejvýš několik vteřin."
 single_combat.0031.desc.sc_attacker.open_terrain_expert.injury: "[sc_loser.Custom('signature_weapon')] mi vyletí z ruky a dříve, než vůbec zahlédnu, kam dopadla, mi protivníkova noha došlápne na krk."
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.injury.rocky: "Nešťastný útok [sc_victor.Custom('SignatureWeaponAttemptedLight')] mě srazí proti svahu. Na zdejší poměry dopadnu měkce, ale postavě [sc_victor.GetFirstNameNoTooltip] to poskytne dostatečnou příležitost, aby mě [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')], pokud jí v tom nic nezabrání."
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.injury.boggy: "Poté už je pro [sc_victor.GetFirstNameNoTooltip] hračka mě odzbrojit a ponechat zcela na [sc_victor.GetHerHis|l] milost."
 single_combat.0031.desc.sc_attacker.forest_fighter.injury: "mě zasáhne ničivým útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který mě málem připraví o vědomí.\n\nNež se vzpamatuji, [sc_loser.Custom('signature_weapon')] je pryč a u hrdla se mi pevně tiskne jiná."
 single_combat.0031.desc.sc_attacker.raaargh.injury: "že jsem dokázal [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] vlastní [sc_loser.Custom('signature_weapon')]!\n\n[sc_victor.GetFirstNameNoTooltip] stojí opodál a proti stavu před mým záchvatem zuřivosti nevypadá o mnoho hůře. Obezřetně mě sleduje. Především však stále drží zbraň a stojí dostatečně blízko k pořádnému výpadu."
 single_combat.0031.desc.sc_attacker.hard_grit.injury: "Je to napjatý boj, ale nakonec na jeden z klamných pohybů naletím příliš důkladně, než abych se dokázal vzpamatovat. Zůstanu ležet na zemi beze zbraně."
 single_combat.0031.desc.sc_attacker.feint_and_stab.injury: "jen aby mi #EMP tuto#! zbraň protivník zpětným rozmachem vyrazil z ruky.\n\nNemám zbraň ani záložní dýku a protivník se připravuje, aby mě [sc_victor.Custom('SignatureWeaponKillTypeGroinFirstPersonFuture')]. Zbývá mi jediné."
 single_combat.0031.desc.sc_attacker.butchery.injury: "mě se znepokojivou lehkostí odzbrojí.\n\nMé pózy a zastrašování nyní znějí naprázdno. Každý dramatický postoj snadno překoná vířící [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip]."
 single_combat.0031.desc.sc_attacker.stoic_veteran.injury: "Snažím se ze všech sil, ale dříve či později se muselo něco pokazit. [sc_victor.GetFirstNameNoTooltip] nakonec provede ripostu, která mi vykroutí [sc_loser.Custom('signature_weapon')] přímo z ruky.\n\nTím je souboj rozhodnut."
 single_combat.0031.desc.sc_attacker.blade_dance.injury: "Musím se soustředit. Musím se vzpamatovat. Mohu vyhrát, jen musím... musím... Já... Přede mnou stojí zjevně samolibý [sc_victor.GetFirstNameNoTooltip] a s promyšleně výhružným výrazem [sc_victor.Custom('SignatureWeaponActionThirdPerson')] [sc_victor.Custom('signature_weapon')], kterou #EMP stále pevně#! drží v [sc_victor.GetHerHis|l] [sc_victor.Custom('HandHands')]."
 single_combat.0031.desc.sc_attacker.wrath_of_highgod.injury: "namíří prudký kop do mého rozkroku a já se zhroutím jako pytel zelí.\n\nSípotem vyjadřuji hněv nad [sc_victor.GetHerHis|l] rouháním, ale není mi to nic platné. Než se vzpamatuji, hledím z [sc_loser.Custom('MaskFace')] přímo na [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('signature_weapon')]."
 single_combat.0031.desc.sc_attacker.hurt_me_better.injury: "V této chvíli mě rozptylují vlastní myšlenky, takže [sc_victor.GetFirstNameNoTooltip] snadno odrazí mé údery, odzbrojí mě a přinutí ke kapitulaci."
 single_combat.0031.desc.sc_attacker.special_fallback.injury: "[sc_victor.GetFirstNameNoTooltip] snadno využije příležitosti. Nechá mě proletět vpřed a poté mi podkopne zbývající nohu. Dopadnu v zamotané hromadě a několik zlomyslných kopanců mě v ní udrží."
 single_combat.0031.desc.sc_attacker.something_to_hide.injury: "vyplivuji chuchvalce krve z důkladně roztrženého rtu.\n\nDalší úder mě zasáhne do břicha a těžce srazí k zemi. Bez dechu lapám po vzduchu a dávím se. Teprve v posledním okamžiku ucítím, jak mi [sc_loser.Custom('signature_weapon')] opouští ruku."
 single_combat.0031.desc.sc_attacker.wait_and_hope.fatality: "se mi [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] přímo do hrdla. V hrůze několik vteřin sleduji, jak ze mě v mokrých proudech stříká životodárná krev, než proud zeslábne v tlumené pulzování a rychle mi smáčí hruď.\n\nKlesnu na kolena. Svět je tak temný. Byl vždycky tak temný?\n\nNic necítím."
 single_combat.0031.desc.sc_attacker.unsure_attack.fatality: "nečekaně vyrazí proti mně.\n\nÚtok [sc_victor.Custom('SignatureWeaponAttemptedLight')] ze strany zasáhne měkké místo v mé hrudi a [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')] ji šikmo napříč. Ochromující bolest se mísí s naprostou necitlivostí, zatímco mé tělo okamžitě selhává kvůli půl tuctu smrtelně poškozených orgánů.\n\nNa nohou mě drží pouze [sc_victor.Custom('signature_weapon')] vězící v hrudní dutině."
 single_combat.0031.desc.sc_attacker.enthusiastic_onslaught.fatality: "Nestačím zasadit ani několik úderů, když se mi cosi [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] hluboko do hrudi. Otočím se, zcela ztratím rovnováhu a spatřím, jak se [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] uvolní z mého těla ve spršce krve a úlomků kostí.\n\nBolest přijde zlomek vteřiny poté, co pomine nevěřícnost. Křičící, do běla rozpálenou agónii rychle pohltí všudypřítomná necitlivost, která se neúprosně šíří ze smrtelné rány v hrudi."
 single_combat.0031.desc.sc_attacker.hail_mary.fatality: "tak rychlou porážku, že ani nevím, zda můj první úder vůbec zasáhl.\n\nV jednu chvíli útočím na [sc_victor.GetFirstNameNoTooltip] ze všech sil a vzápětí necítím ruku svírající [sc_loser.Custom('signature_weapon')]. Něco... něco se stalo s mou páteří? Nemohu pohnout jediným svalem a padám do [sc_defender.Custom('GroundType')].\n\nKopnutí mě obrátí na záda, takže alespoň mohu svému vrahovi pohlédnout do očí.\n\nPak se [sc_victor.Custom('signature_weapon')] prudce spustí."
 single_combat.0031.desc.sc_attacker.pocket_sand.fatality: "Rozptýlení umožní [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] narazit do mého trupu a [sc_victor.Custom('SignatureWeaponKillTypeTorsoPresentParticiple')] jej s brutální účinností.\n\nTělem mi vybuchne agónie a zavrávorám dozadu. C-cože? Jak se to... Já...\n\nZ hrudi mi v horkých, mokrých obloucích stříká krev. Zničenými plícemi zachrčím cosi nesrozumitelného. Ani #EMP já#! netuším co. Rána z milosti přichází příliš pomalu."
 single_combat.0031.desc.sc_attacker.nut_em.fatality: "pod bradou a [sc_victor.Custom('SignatureWeaponKillTypeHead2PresentParticiple')].\n\n[sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] se odtáhne celá smáčená mou krví. Napůl vykřiknu a napůl zachrčím hrůzou, ale paže mi stále slouží příliš dobře, než aby protivník zvažoval ránu z milosti.\n\nMísto toho se v mukách potácím a reflexivně svírám vlastní [sc_loser.Custom('signature_weapon')], dokud už nedokážu udělat ani krok."
 single_combat.0031.desc.sc_attacker.guard.fatality: "útoku [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který se mi hluboko zakousne do stehna.\n\nVyměníme si ještě několik úderů, než ucítím kolem pasu znepokojivé vlhko. Na okamžik si myslím, že mě uprostřed boje zradila odvaha, ale pohled dolů odhalí nohu #EMP zalitou#! krví.\n\nNáhle mě vše dožene a já se stále škubající zhroutím k zemi."
 single_combat.0031.desc.sc_attacker.probing_attack.fatality: "se [sc_loser.Custom('signature_weapon')] [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nMám právě dost času pochopit, jak zlá je situace, než mě [sc_victor.GetFirstNameNoTooltip] sérií útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] [sc_victor.Custom('SignatureWeaponKillTypeThirdPersonActive')].\n\nZ rozervaného masa vytéká krev a já se potácím. Sevřu si rány, ale ruka se vrátí mokrá od vlastní krve.\n\nTohle... tohle je konec."
 single_combat.0031.desc.sc_attacker.onslaught.fatality: "Něco mi praskne přes koleno a já se zhroutím. Co nejrychleji se převalím a divoce máchám [sc_loser.Custom('signature_weapon')], abych od sebe odehnal [sc_victor.GetFirstNameNoTooltip]. Jenže protivníka nikde #EMP nevidím#!. Kam [sc_victor.GetSheHe|l] zmizel? Musí tu někde bý-"
 single_combat.0031.desc.sc_attacker.surprise_attack.fatality: "Snažím se znovu získat kontrolu, ale další úder mi vyrve [sc_loser.Custom('signature_weapon')] z ruky. Na okamžik vše pohltí panika a poté je souboj rozhodnut.\n\n[sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] se mi [sc_victor.Custom('SignatureWeaponWoundVerb2ThirdPersonPresent')] hluboko do ramene, prosekne klíční kost a vyrve cosi životně důležitého. Necitlivost přijde okamžitě. Panika, bolest, úplně všechno... přestává mít význam."
 single_combat.0031.desc.sc_attacker.taunt.fatality: "mě zasáhne.\n\nCítím jen bolest odrážející se celým tělem a tisíce nervových zakončení křičících v agónii, zatímco vrávorám a umírám."
 single_combat.0031.desc.sc_attacker.put_the_boot_in.fatality: "[sc_victor.GetFirstNameNoTooltip] mi nedá čas na vzpamatování a útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] mě [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')]. Krev mi vyrazí hrdlem a ústy a v lepkavých skvrnách dopadá zpět na [sc_loser.Custom('MaskFace')].\n\nNěkde pod nesčetnými vrstvami bolesti stále cítím tlukot srdce, které žene krev rozervanými žilami a ven z roztříštěných tepen. Z tohoto se už nevzpamatuji."
 single_combat.0031.desc.sc_attacker.strict_guard.fatality: "Nakonec na tom nezáleží. Rozervané trosky mého hrdla dostatečně dokazují, že se to stalo. Na způsobu už nezáleží.\n\nZakolísám a život ze mě odtéká. V jednu chvíli jsem a v další..."
 single_combat.0031.desc.sc_attacker.confident_attack.fatality: "mě tvrdě zasáhne útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] do břicha, roztrhne křehké maso a nedbale vysype mé vnitřnosti na zem.\n\nUklouznu ve změti vlastních střev, s výkřikem padám dozadu a celé tělo mi hoří utrpením.\n\nRána z milosti nemůže přijít dost rychle."
 single_combat.0031.desc.sc_attacker.expert_onslaught.fatality: "Dokud nečekaný kryt neodrazí úder přímo do [sc_loser.Custom('MaskFace')], [sc_loser.Custom('SignatureWeaponWoundVerb6PresentParticiple')] ránu až na kost a nepošle mě vrávorat dozadu. Vykřiknu překvapenou bolestí a ucuknu od střetu zbraní, když mi někdo podrazí nohy.\n\nStačím jen vykřiknout na protest, než mě [sc_victor.GetSheHe|l] [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')].\n\nSmrt je vysvobozením."
 single_combat.0031.desc.sc_attacker.attempt_disarm.fatality: "skutečně ji [sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')].\n\nPoté už je pro [sc_victor.GetFirstNameNoTooltip] hračka mě [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')]. Můj svět se zúží na drobné body světla a bolesti."
 single_combat.0031.desc.sc_attacker.tire_opponent.fatality: "mě zcela vyvedou z rovnováhy.\n\nKlopýtám a vrávorám, než mě pevný útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] odhodí přímo do [sc_defender.Custom('GroundType')]. I s poškozenou zbraní odrazím další úder postavy [sc_victor.GetFirstNameNoTooltip], ale ten následující mě [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')].\n\nMé děsivé výkřiky netrvají dlouho. Bolest mě zbaví vědomí dříve, než mě smrt zbaví života."
 single_combat.0031.desc.sc_attacker.reason_you_suck_speech.fatality: "[sc_victor.GetFirstNameNoTooltip] využije mé rozptýlené pozornosti a připraví si pevný útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který mě [sc_victor.Custom('SignatureWeaponKillTypeHead2ThirdPersonActive')].\n\nOdletím dozadu a krev ze mě tryská jako z hrůzné fontány. Tohle nemůže být konec. Takhle to nemělo skončit. Mohl jsem... Stále bych mohl... Dokážu...\n\nNedokážu nic. Potácím se ke svému krví zmáčenému hrobu."
 single_combat.0031.desc.sc_attacker.technique_from_legend.fatality: "Místo okamžitého vítězství jsem tváří napřed odmrštěn k zemi. Sotva se stačím zavrtět, než mě [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')].\n\nAdrenalin potlačí velkou část bolesti, ale ne všechnu. Křičím, když mě kopnutím obrátí na záda před nevyhnutelnou smrtící ranou."
 single_combat.0031.desc.sc_attacker.like_a_viper.fatality: "obloukem [sc_victor.Custom('signature_weapon')] postavy [sc_victor.GetFirstNameNoTooltip], která mi ze strany projede hrudí a jediným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] ji [sc_victor.Custom('SignatureWeaponKillTypeTorsoPresentParticiple')].\n\nProtiútok spolu s vlastní hybností mě odhodí do [sc_defender.Custom('GroundType')]. Paže mi ještě slouží, ale už jsou... tak slabé. Tak těžké. Sotva se dokážu otočit, zatímco mi z hrudi proudí lepkavá rudá krev."
 single_combat.0031.desc.sc_attacker.pocket_silver.fatality: "[sc_victor.GetFirstNameNoTooltip] se pohne rychle a srazí mě k zemi dříve, než pochopím, co se děje. O jediný děsivý okamžik později mě [sc_victor.GetSheHe|l] [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive')], [sc_victor.Custom('SignatureWeaponKillTypeGroinThirdPersonActive_Aftermath')].\n\nNejprve křičím, ale plíce mě zradí rychleji, než bych čekal. Brzy dokážu utrpení jen beze slov #EMP snášet#!."
 single_combat.0031.desc.sc_attacker.martial_voice.fatality: "vykročí vpřed a jediným rychlým pohybem mi zcela klidně [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] hrdlo.\n\nKonec působí téměř... bezvýznamně. Žádná okázalá gesta, žádné výkřiky ani znamení nadpřirozených sil přicházejících si pro mou duši.\n\nJen rozkvétající bolest, mé vlhké chrčení a netečné [my_foe.Custom('EyeEyes')] postavy [sc_victor.GetFirstNameNoTooltip], které sledují mou smrt."
 single_combat.0031.desc.sc_attacker.mocking_boast.fatality: "[sc_victor.GetSheHe|U] provede lstivý klamný útok a já se při krytu otočím zády k postavě [sc_victor.GetFirstNameNoTooltip] špatným směrem.\n\nO necelou vteřinu později mě protivníkova [sc_victor.Custom('signature_weapon')] útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')]. Zhroutím se, nepřirozeně přehnutý přes vlastní nohy, zatímco zbytky vykuchaného masa a kostí vedou vlny agónie k roztříštěným nervům."
 single_combat.0031.desc.sc_attacker.is_that_a_crocodile.fatality: "Pohotový výpad postavy [sc_victor.GetFirstNameNoTooltip] pronikne přímo skrz můj kryt a umožní [sc_victor.GetHerHim] mocným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] [sc_victor.Custom('SignatureWeaponWoundVerb3')] horní polovinu mého těla.\n\nZhroutím se dozadu a při vytažení zbraně ze mě odlétají cáry masa a krvavé pruhy. Co se to... Já jsem... Tohle nemůže... Pomoc.\n\n#EMP Pomoc.#!"
 single_combat.0031.desc.sc_attacker.desert_warrior.fatality: "Vše se začne kazit až ve chvíli, kdy se zastavím a vytřu si z #EMP vlastních#! [sc_loser.Custom('EyeEyes')] kapku potu. [sc_victor.GetFirstNameNoTooltip] si vybere #EMP přesně#! tento okamžik a zasáhne mě útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Než se stačím vzpamatovat, ležím na zemi a další úder se mi [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] do krku.\n\nZničeným hrdlem chrčím a při snaze cokoli říci vyfukuji bubliny krvavých slin. Přes všechen žár je mi taková zima."
 single_combat.0031.desc.sc_attacker.jungle_stalker.fatality: "Jediný pohled stranou rozhodne o mém osudu. [sc_victor.GetFirstNameNoTooltip] se s radostí chopí příležitosti a když o zlomek vteřiny později zvednu oči, [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] se mi právě chystá [sc_victor.Custom('SignatureWeaponWoundVerb1')] do břicha.\n\nVykřiknu bolestí, ale je příliš pozdě. I kdyby první rána nebyla smrtelná, [sc_victor.GetFirstNameNoTooltip] se příštím úderem chystá zasáhnout přesněji."
 single_combat.0031.desc.sc_attacker.open_terrain_expert.fatality: "Dopad je měkký, ale noha postavy [sc_victor.GetFirstNameNoTooltip] v mém rozkroku nikoli. Na rozhodující okamžik zůstanu omráčený a to stačí, aby mě [sc_victor.GetSheHe|l] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeTorsoFirstPersonFuture')].\n\nKrev ze srdce mi prudce tryská z hrudi, stéká po žebrech a hromadí se v [sc_defender.Custom('GroundType')] kolem mě.\n\nAlespoň umírám pod otevřeným nebem."
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.fatality.rocky: "Nakonec se mi to stane osudným. Jedno strčení navíc mě pošle přes malý sráz. Tvrdě dopadnu na jedinou nohu a zcela si ji znetvořím.\n\nNež se [sc_victor.GetFirstNameNoTooltip] seškrábe ze srázu za mnou, bolest mě téměř připraví o vědomí. V tomto stavu nelze bojovat. Protivník pozvedne [sc_victor.Custom('signature_weapon')]. Alespoň mé utrpení rychle skončí."
 single_combat.0031.desc.sc_attacker.rough_terrain_expert.fatality.boggy: "Jen nejzoufalejším zápasem svého života se dokážu vyprostit, ale štěstí mi dlouho nevydrží. Jakmile se vypotácím z jedné tůně, padnu tváří napřed do další. Něco nade mnou mě [sc_victor.Custom('SignatureWeaponKillTypeRearTorsoThirdPersonActive')].\n\nNemohu se pohnout ani zápasit. Pokusím se vykřiknout, ale plíce mi zaplní zelená voda a já klesám hlouběji do bažinaté propasti."
 single_combat.0031.desc.sc_attacker.forest_fighter.fatality: "spustí smršť útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')].\n\nNevím, který přesně a kde zasáhne tepnu, ale brzy zpomalím a od ramene po zápěstí mě smáčí vlastní krev. Bez jakékoli okázalosti se svalím dozadu. Jsem tak unavený. Už nemohu... nemohu..."
 single_combat.0031.desc.sc_attacker.raaargh.fatality: "že [sc_victor.GetFirstNameNoTooltip] stojí znepokojivě blízko.\n\nPřinutím paže, aby se po [sc_victor.GetHerHim] natáhly, a jen okrajově si všimnu, že jsem upustil [sc_loser.Custom('signature_weapon')]. Jenže... nic. Odkud se vzala všechna ta krev? Je ten kus masa můj? Proč nic... necítím?\n\nAha."
 single_combat.0031.desc.sc_attacker.hard_grit.fatality: "Trvá dlouho, než jeden z nás udělá chybu, kterou druhý dokáže využít, ale nakonec k ní dojde. Vložím příliš mnoho sil do útoku [sc_loser.Custom('SignatureWeaponAttemptedLight')] a než stačím uhnout, vězí mi [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] v útrobách.\n\nTak už to chodí."
 single_combat.0031.desc.sc_attacker.feint_and_stab.fatality: "a rozptýlí mě právě na tak dlouho, že si nevšimnu následného útoku [sc_victor.Custom('SignatureWeaponAttemptedLight')], dokud mě [sc_victor.Custom('SignatureWeaponKillTypeTorso2PresentParticiple')].\n\nZavrávorám a v křečích padnu dozadu do [sc_defender.Custom('GroundType')]. Snažím se křičet, ale dokážu ze sebe vydat jen chraplavý šepot. Jak může někdo přežít tolik #EMP bolesti#!?\n\nNemůže."
 single_combat.0031.desc.sc_attacker.butchery.fatality: "pronikne do mého krytu a [sc_victor.Custom('SignatureWeaponKillTypeHead2FirstPersonFuture')].\n\nBeze slova klopýtám vpřed a dávím se vlastní krví. Upustím dokonce [sc_loser.Custom('signature_weapon')], abych se oběma rukama pokusil ucpat ránu, z níž má životodárná krev tryská do [sc_defender.Custom('GroundType')].\n\nT-takové to bylo? Tolikrát... tolikrát..."
 single_combat.0031.desc.sc_attacker.stoic_veteran.fatality: "Musím schytat několik úspěšných ripost, než nakonec zaváhám. Z půl tuctu rozervaných podlitin a roztřepených ran po celém trupu mi vytéká krev. Nikdo alespoň nemůže tvrdit, že jsem padl snadno, ale každý [sc_loser.GetWomanMan|l] má své meze.\n\nKlesnu na kolena a čekám na smrtící úder postavy [sc_victor.GetFirstNameNoTooltip]. Zdá se, že já jsem právě dosáhl těch svých."
 single_combat.0031.desc.sc_attacker.blade_dance.fatality: "Co si ten drzý skrček myslí, že [sc_victor.GetSheHe|l] dělá? Já...\n\nV hrudi mi vězí [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')]. Jak se... Kde se... Ale já jsem... umělec."
 single_combat.0031.desc.sc_attacker.wrath_of_highgod.fatality: "mě koncem [sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] srazí přímo do [sc_loser.Custom('MaskFace')].\n\nZavrávorám dozadu a slepě zuřím nad tímto rouháním. Můj hněv však rychle skončí, když mi [sc_victor.GetFirstNameNoTooltip] [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] zbraň do plíce. Prskám a dusím se a sotva dokážu vydat zvuk, když mi hrudní dutinu začne zaplavovat krev."
 single_combat.0031.desc.sc_attacker.hurt_me_better.fatality: "Každý [sc_loser.GetWomanMan|l] může ztratit jen určité množství krve a já jí zřejmě ztratil příliš mnoho.\n\n[sc_victor.GetFirstNameNoTooltip] připraví [sc_victor.Custom('signature_weapon')], aby mě [sc_victor.Custom('SignatureWeaponKillTypeHeadFirstPersonFuture')]."
 single_combat.0031.desc.sc_attacker.special_fallback.fatality: "Když má protivník volný přístup k mým zádům, je pro [sc_victor.GetFirstNameNoTooltip] snadné mě smrští útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')].\n\nPadnu na bok do [sc_defender.Custom('GroundType')], kašlu a sípu přes zlomené kosti a rozervané orgány. Tolik bolesti. Tolik bolesti. Přechází v chlad, přechází v necitlivost, přechází v... mizí..."
 single_combat.0031.a.scream: "#EMP ÁÁÁRGH!#!"
 single_combat.0031.a.wordless: "..."
 single_combat.0031.a.muffled: "Mrrm! #EMP MRRRMMM!#! #DIE2 Mrrrm#!..."
 single_combat.0031.a.choking: "Chrr-chrr-#EMP CHRRRR#!-#DIE1 chrr#!..."
 single_combat.0031.a.pleading: "Ne, ne, #EMP ne, NE! Pro-#! #BOL ÁÁÁRGH!#!"
 single_combat.0031.a.soulmate: "[sc_loser_soulmate.GetFirstNameNoTooltip], #DIE1 odpusť#! #DIE2 mi#!..."
 single_combat.0031.a.sinner: "[sc_loser.GetFaith.NegativeAfterLife] tě bude čekat, bastarde, i se mnou!"
 single_combat.0031.a.saint: "[sc_loser.GetFaith.PositiveAfterLife]! #DIE1 Jaká nádhera#!..."
 single_combat.0031.a.legend: "V legendách #DIE1 budu žít#! #DIE2 navěky#!..."
 single_combat.0031.a.valhalla: "Valhalla #DIE1 čeká...#!"
 single_combat.0031.a.best_friend: "[sc_loser_best_friend.GetFirstNameNoTooltip], #DIE1 pomsti#! #DIE2 mě#!..."
 single_combat.0031.a.killed_by_rival: "Vždycky jsem tě... #DIE1 nenáviděl#! #DIE2 [sc_victor.GetFirstNameNoTooltip]#!..."
 single_combat.0031.a.killed_by_nemesis: "Proklínám tě, [sc_victor.GetFirstNameNoTooltip]. Tebe #DIE1 i celý#! #DIE2 tvůj rod#!..."
 single_combat.0031.a.killed_by_spouse: "Dokud nás smrt... #DIE1 nerozdělí,#! #DIE2 viď?#!"
 single_combat.0031.a.killed_by_your_head_of_faith:0 "Je tohle #DIE1 [sc_victor.GetFaith.HighGodNamePossessive]#! #DIE2 vůle?#!"
 single_combat.0031.a.killed_by_another_head_of_faith: "[sc_loser.GetFaith.HighGodName] #DIE1 se na mě usmívá,#! #DIE2 [sc_victor.GetTitleAsNameNoTooltip]. Můžeš říct totéž?#!..."
 single_combat.0031.a.killed_by_cultural_head: "K #DIE1 [sc_loser.GetCulture.GetNameNoTooltip]#! #DIE2 kultuře ve skutečnosti nepatříš#!..."
 single_combat.0031.a.killed_by_house_head: "Přivedeš #DIE1 rod [sc_loser.GetHouse.GetName]#! #DIE2 do záhuby#!..."
 single_combat.0031.a.killed_by_dynasty_head: "Raději #DIE1 [sc_loser.GetHouse.GetName]#! #DIE1 než [sc_loser.GetDynasty.GetBaseNameNoTooltip]#!..."
 single_combat.0031.a.killed_by_close_or_extended_family: "Ty nejsi #DIE1 má rodina#! #DIE2...#!"
 single_combat.0031.a.killed_by_friend_or_lover: "Ale #DIE1 [sc_victor.GetFirstNameNoTooltip]#!... #DIE2 proč#!..."
 single_combat.0031.a.killed_by_soulmate: "Naše láska... #DIE1 měla trvat#!... #DIE2 navěky#!..."
 single_combat.0031.a.killed_by_best_friend: "[Select_CString(sc_victor.IsFemale,'Byla jsi mi sestrou','Byl jsi mi bratrem')], #DIE1 [sc_victor.GetFirstNameNoTooltip]#!... #DIE2 Miloval jsem tě#!..."
 single_combat.0031.b: "Vzdávám se! Vzdávám se!"
 single_combat.0031.c: "Ještě budeš litovat dne, kdy jsi [Select_CString(sc_victor.IsFemale,'porazila','porazil')] [sc_loser.GetTitledFirstNameNoTooltip]!"
 single_combat.0041.desc.sc_defender.wait_and_hope: "Vyčkat, až protivník zaútočí první, se překvapivě vyplatí."
 single_combat.0041.desc.sc_defender.unsure_attack: "Nakonec se ukáže, že mé váhavé útoky ani nebyly potřeba."
 single_combat.0041.desc.sc_defender.enthusiastic_onslaught: "Zdá se, že mé horlivé [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')] zabralo."
 single_combat.0041.desc.sc_defender.hail_mary: "Můj zoufalý útok všemi silami nakonec přece jen stačil."
 single_combat.0041.desc.sc_defender.pocket_sand: "Hrst [sc_defender.Custom('GritType')] protivníka rozptýlí právě dostatečně."
 single_combat.0041.desc.sc_defender.nut_em: "Hlavička protivníka očividně vyvede z míry."
 single_combat.0041.desc.sc_defender.guard: "Můj kryt pevně drží a chrání mě před protivníkem."
 single_combat.0041.desc.sc_defender.probing_attack: "Zkušebními útoky odhalím několik slabin."
 single_combat.0041.desc.sc_defender.onslaught: "Příval útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] se ukáže jako účinný."
 single_combat.0041.desc.sc_defender.surprise_attack: "V boji často rozhoduje překvapení a tentokrát tomu není jinak."
 single_combat.0041.desc.sc_defender.taunt: "Zdá se, že mé posměšky protivníka přece jen vyvedly z míry."
 single_combat.0041.desc.sc_defender.put_the_boot_in: "Kopnout protivníka je podlé, ale účinné."
 single_combat.0041.desc.sc_defender.strict_guard: "Můj kryt dosud nic neprolomilo a dnes tomu není jinak."
 single_combat.0041.desc.sc_defender.confident_attack: "Říká se, že sebejistota dává schopnostem vyniknout, a mé údery to potvrzují."
 single_combat.0041.desc.sc_defender.expert_onslaught: "Málokdo dokáže odolat mé záplavě útoků [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] a můj protivník není výjimkou."
 single_combat.0041.desc.sc_defender.attempt_disarm: "Doufal jsem, že protivníka alespoň vyvedu z rovnováhy, ale pokus o odzbrojení dopadne mnohem lépe."
 single_combat.0041.desc.sc_defender.tire_opponent: "Vylákat protivníka k útokům a nechat jej vyčerpat se ukáže jako účinné."
 single_combat.0041.desc.sc_defender.reason_you_suck_speech: "Zdá se, že má řeč protivníka rozzuřila ještě víc než [sc_victor.Custom('signature_weapon')]."
 single_combat.0041.desc.sc_defender.technique_from_legend: "Porazit protivníka je stejně snadné jako převyprávět starou legendu."
 single_combat.0041.desc.sc_defender.like_a_viper: "Vyrazím přímo k protivníkovu srdci a málem vše ukončím jediným úderem."
 single_combat.0041.desc.sc_defender.pocket_silver: "Pořádná dávka stříbra do [sc_loser.Custom('MaskFace')] dokáže divy."
 single_combat.0041.desc.sc_defender.martial_voice: "Mé řvané nadávky protivníka očividně #EMP vyděsily#!."
 single_combat.0041.desc.sc_defender.mocking_boast: "Protivník při mých poznámkách #EMP zuřivě#! skřípe zuby."
 single_combat.0041.desc.sc_defender.is_that_a_crocodile: "Protivník jen taktak odrazí útok rozzuřeného plaza."
 single_combat.0041.desc.sc_defender.desert_warrior: "Vedro si na protivníkovi vybírá krutou daň."
 single_combat.0041.desc.sc_defender.jungle_stalker: "Džungle protivníka znovu a znovu zrazuje."
 single_combat.0041.desc.sc_defender.open_terrain_expert: "Rozlehlé bojiště mi umožňuje snadno ovládat průběh souboje."
 single_combat.0041.desc.sc_defender.rough_terrain_expert: "Nerovný terén působí protivníkovi při boji značné potíže."
 single_combat.0041.desc.sc_defender.forest_fighter: "Les protivníka příjemně zpomaluje."
 single_combat.0041.desc.sc_defender.raaargh: "Mému berserkergangu dokáže čelit jen málokdo a můj protivník není výjimkou."
 single_combat.0041.desc.sc_defender.hard_grit: "Těžce nabyté zkušenosti se při správném využití vyplácejí a já je využívám dokonale."
 single_combat.0041.desc.sc_defender.feint_and_stab: "Protivník sice na poslední chvíli ucukne, ale bodnutí dýkou v druhé ruce málem souboj ukončí."
 single_combat.0041.desc.sc_defender.butchery: "Mé nelítostné útoky si vybírají strašlivou daň."
 single_combat.0041.desc.sc_defender.stoic_veteran: "Garda neustupuje. Ani tady, ani nikdy."
 single_combat.0041.desc.sc_defender.blade_dance: "Bojuji jako tekoucí voda. Pružně, ale neodvratně."
 single_combat.0041.desc.sc_defender.wrath_of_highgod: "[sc_victor.GetFaith.HighGodName] mi zjevně přeje."
 single_combat.0041.desc.sc_defender.hurt_me_better: "Bolest je v boji tím nejlepším spojencem a tentokrát stojí na #EMP mé#! straně."
 single_combat.0041.desc.sc_defender.special_fallback: "Taktický kop do holeně čeká jen málokterý protivník."
 single_combat.0041.desc.sc_defender.something_to_hide: "Mé narážky protivníka očividně vyděsily."
 single_combat.0041.desc.opponent_response.wait_and_hope: "Když [sc_loser.GetFirstNameNoTooltip] jednoduše ztuhne na místě, málem to zaskočí i mě! Jestli však nehodlá bojovat, já se tím zastavit nenechám a vyrazím vpřed s útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\n"
 single_combat.0041.desc.opponent_response.unsure_attack: "[sc_loser.GetFirstNameNoTooltip] se pokusí o několik ledabylých útoků [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')], ale všem se snadno vyhnu.\n\n"
 single_combat.0041.desc.opponent_response.enthusiastic_onslaught: "[sc_loser.GetFirstNameNoTooltip] se na mě vrhne, nesrozumitelně řve a se zoufalým nadšením naprostého amatéra divoce [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] [sc_loser.Custom('signature_weapon')].\n\n"
 single_combat.0041.desc.opponent_response.hail_mary: "[sc_loser.GetFirstNameNoTooltip] vsadí vše na jediný útok a se [sc_loser.Custom('signature_weapon')] v pohotovosti se mě pokusí porazit, nebo zemřít pod přívalem vlastních útoků [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')].\n\nNaneštěstí pro [sc_loser.GetHerHim]"
 single_combat.0041.desc.opponent_response.pocket_sand: "[sc_loser.GetFirstNameNoTooltip] popadne ze země hrst [sc_defender.Custom('GritType')], ale když ji po mně hodí, poryv větru ji obrátí přímo proti [sc_loser.GetHerHis|l] [sc_loser.Custom('MaskFace')].\n\n"
 single_combat.0041.desc.opponent_response.nut_em: "[sc_loser.GetFirstNameNoTooltip] se na mě bezhlavě vrhne s volně spuštěnou [sc_loser.Custom('signature_weapon')] a zjevně se mě pokouší pořádně udeřit hlavou.\n\n"
 single_combat.0041.desc.opponent_response.guard: "[sc_loser.GetFirstNameNoTooltip] drží slušný kryt, ale neproniknutelný není. Dá mi to práci, ale nakonec se mi podaří"
 single_combat.0041.desc.opponent_response.probing_attack: "[sc_loser.GetFirstNameNoTooltip] se mě snaží držet v odstupu opatrnými útoky [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')]. Chvíli je to chytré, ale z dlouhodobého hlediska pošetilé, protože mi tím přenechává kontrolu nad tempem souboje.\n\nNakonec jeden z útoků odrazím tak prudce, že"
 single_combat.0041.desc.opponent_response.onslaught: "[sc_loser.GetFirstNameNoTooltip] přejde do mohutného útoku a zasypává mě ranami [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')], z nichž každou je nesmírně obtížné odrazit.\n\nZe záplavy úderů uniknu jen díky šťastnému úkroku stranou ve chvíli, kdy mrknu,"
 single_combat.0041.desc.opponent_response.surprise_attack: "[sc_loser.GetFirstNameNoTooltip] se uprostřed úderu pokusí změnit jeho dráhu a zjevně doufá, že mě překvapí. Já však útok pevně odrazím a protivník zavrávorá."
 single_combat.0041.desc.opponent_response.taunt: "[sc_loser.GetFirstNameNoTooltip] ustoupí a na tváři se už začíná rodit krutý úsměv. Ať se chystá pronést jakoukoli urážku, slyšet ji nechci, a téměř bezmyšlenkovitě zaútočím útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')].\n\n"
 single_combat.0041.desc.opponent_response.put_the_boot_in.peg_leg: "[sc_loser.GetFirstNameNoTooltip] mě zasáhne prudkým útokem [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] a po úspěšném úderu se mě pokusí kopnout umělou nohou.\n\nBez přemýšlení udeřím koncem [sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] tak tvrdě, že umělou nohu urazím a protivník se svalí k zemi."
 single_combat.0041.desc.opponent_response.put_the_boot_in.fallback: "[sc_loser.GetFirstNameNoTooltip] mě zasáhne prudkým útokem [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] a po úspěšném úderu se mě pokusí kopnout. Uskočím stranou a při průchodu zasadím protivníkovi do zad útok [sc_victor.Custom('SignatureWeaponAttemptedLight')], po němž se zhroutí na zem.\n\n"
 single_combat.0041.desc.opponent_response.strict_guard: "Ať už je [sc_loser.GetFirstNameNoTooltip] jakýkoli protivník, kryt drží zatraceně dobře. Když se mi jej konečně podaří"
 single_combat.0041.desc.opponent_response.confident_attack: "[sc_loser.GetFirstNameNoTooltip] umí se [sc_loser.Custom('signature_weapon')] zacházet, ale každý bojovník musí pro vítězství riskovat. Právě uprostřed jednoho obzvlášť nebezpečného útoku [sc_loser.Custom('SignatureWeaponAttemptedLight')] se mi podaří"
 single_combat.0041.desc.opponent_response.expert_onslaught: "[sc_loser.GetFirstNameNoTooltip] bojuje, jako by v něm běsnil démon, a nekonečnou bouří útoků [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] mě tlačí stále dál a dál.\n\nTeprve když si [sc_loser.GetSheHe|l] dopřeje okamžik k oslavě blížícího se vítězství,"
 single_combat.0041.desc.opponent_response.attempt_disarm: "[sc_loser.GetFirstNameNoTooltip] se na mě vrhne a jediným ohromným útokem [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] mi málem vyrve [sc_victor.Custom('signature_weapon')] z ruky. Pevně ji však udržím a zatlačím proti úderu.\n\nZjevně zachytím protivníkovu zbraň pod špatným úhlem, protože"
 single_combat.0041.desc.opponent_response.tire_opponent: "[sc_loser.GetFirstNameNoTooltip] opakovaně naznačuje výpad, jako by mi nabízel příležitost zaútočit, ale pokaždé uskočí. Vycítím šanci a s každým útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] přitlačím o něco tvrději, až protivníka několikrát zasáhnu.\n\n"
 single_combat.0041.desc.opponent_response.reason_you_suck_speech: "Každý ví, že [sc_loser.GetFirstNameNoTooltip] umí řečnit, a z postoje je jasné, že hodlá této příležitosti využít k dalšímu kázání. Je načase ukázat, jak si obratný jazyk poradí s ocelovou [sc_victor.Custom('signature_weapon')].\n\n"
 single_combat.0041.desc.opponent_response.technique_from_legend: "[sc_loser.GetFirstNameNoTooltip] zaujme nepřirozeně dramatický postoj."
 single_combat.0041.desc.opponent_response.like_a_viper: "[sc_loser.GetFirstNameNoTooltip] se pohne tak rychle, že sotva stačím pochopit záměr, a pronikne #EMP dovnitř#! mého krytu. [sc_loser.Custom('signature_weapon')] míří přímo na mé srdce a do jisté smrti mi zbývá sotva okamžik.\n\n"
 single_combat.0041.desc.opponent_response.pocket_silver: "[sc_loser.GetFirstNameNoTooltip] cosi strhne od pasu a mrští to po mně. Než vůbec pochopím, co to je, reflexivně předmět rozmetám útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] a protivníka zasype hotová sprška těžkých stříbrných mincí.\n\nZatímco protivník na okamžik oslepne,"
 single_combat.0041.desc.opponent_response.martial_voice: "[sc_loser.GetFirstNameNoTooltip] se do mě pustí a ze vzteku či domýšlivosti mi spílá, jako bych byl obyčejný prosťáček umazaný od hlíny. Začíná ve mně vřít krev, ale ovládnu se, dokud se [sc_loser.GetSheHe|l] nezastaví, aby se zhluboka nadechl.\n\n"
 single_combat.0041.desc.opponent_response.mocking_boast: "[sc_loser.GetFirstNameNoTooltip] si udržuje odstup a ustupuje před každým mým úderem. Místo boje pronáší jednu jízlivou poznámku za druhou o mém věhlasu, až mi zcela dojde trpělivost.\n\n„Víš, jak si lze snadno získat věhlas?“ ptám se bez odpovědi. „Zabít někoho slavného.“\n\nKrátké ohromení postavy [sc_loser.GetFirstNameNoTooltip] mi stačí, abych"
 single_combat.0041.desc.opponent_response.is_that_a_crocodile: "[sc_loser.GetFirstNameNoTooltip] začne bez varování překotně ustupovat, jako by spatřil ducha. Tuším lest, ale příležitosti přesto neochvějně využiji."
 single_combat.0041.desc.opponent_response.desert_warrior: "To vedro, to #EMP vysilující#!, #EMP spalující#! vedro! Pomalu mě zabíjí, ale pouhou silou vůle vytrvám. [sc_loser.GetFirstNameNoTooltip] působí téměř nedotčeně, přesto jej má houževnatost stále více zneklidňuje.\n\nKdyž protivníkův kryt jen nepatrně povolí,"
 single_combat.0041.desc.opponent_response.jungle_stalker: "Přestože je boj v džungli hotové utrpení, [sc_loser.GetFirstNameNoTooltip] působí, jako by jej zvládal #EMP bez námahy#!. Alespoň dokud se mu noha nezachytí do liány.\n\n"
 single_combat.0041.desc.opponent_response.open_terrain_expert: "[sc_loser.GetFirstNameNoTooltip] bojuje nejlépe na otevřeném prostranství a dobře to ví. Ustupuje, kdykoli se mu to hodí, a souboj je kvůli tomu nesmírně únavný. Pak si však všimnu nedalekého velkého ostrého kamene, který sahá #EMP přesně#! do výše holeně.\n\nTrpělivě k němu protivníka zaháním a spoléhám na jeho domýšlivé přeskupování."
 single_combat.0041.desc.opponent_response.rough_terrain_expert.rocky: "[sc_loser.GetFirstNameNoTooltip] je zkušený v boji na svazích, kopcích i horách a dává mi to jasně najevo. Znovu a znovu se musím zapírat proti prudkým strčením, která mě mají poslat ze svahu,\n\n"
 single_combat.0041.desc.opponent_response.rough_terrain_expert.boggy: "V bažinách bojuje [sc_loser.GetFirstNameNoTooltip] jako samotný [sc_victor.GetFaith.DevilName] a znovu a znovu mě zahání do páchnoucí vody. Naštěstí není žádná z tůní příliš hluboká.\n\nJe proto téměř ironické, že první bahnitá voda, do níž se [sc_loser.GetSheHe|l] odváží vstoupit, pohltí jeho nohu až po koleno.\n\n"
 single_combat.0041.desc.opponent_response.forest_fighter: "Přestože je [sc_loser.GetFirstNameNoTooltip] pověstný schopností bojovat v lesích, ne každý les nabízí skutečnou výhodu.\n\nTento háj působí přímo idylicky a snaha najít způsob, jak zde své zkušenosti využít, protivníka očividně velmi rozptyluje."
 single_combat.0041.desc.opponent_response.raaargh: "[sc_loser.GetFirstNameNoTooltip] se rozechvěje a na několik napjatých vteřin znehybní, než náhle #EMP vybuchne#! vzteky.\n\nBěsnící protivník zcela zapomene na vlastní bezpečí a vrhne se na mě ve víru nezkrotných útoků [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')], pěstí, kopanců a skřípajících zubů.\n\n"
 single_combat.0041.desc.opponent_response.hard_grit: "[sc_loser.GetFirstNameNoTooltip] bojuje dobře, neustupuje a neodpouští žádnou chybu. Každou mezeru využije a za každou slabinu si vybere daň v bolesti a námaze.\n\nDržet krok dokážu jen opatrným bojem, kdy oplácím ránu za ránu a nic víc. Vyčkávám, dokud chybu neudělá #EMP [sc_loser.GetSheHe|l]#!, a poté"
 single_combat.0041.desc.opponent_response.feint_and_stab: "[sc_loser.GetFirstNameNoTooltip] proti mně vede [sc_loser.Custom('signature_weapon')] útok [sc_loser.Custom('SignatureWeaponAttemptedLight')], ale působí nesoustředěně.\n\nVyrazit protivníkovi zbraň z ruky není příliš obtížné. Teprve poté zahlédnu v druhé pěsti záblesk dýky."
 single_combat.0041.desc.opponent_response.butchery: "Navzdory děsivé pověsti postavy [sc_loser.GetFirstNameNoTooltip] působí útoky [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] poněkud... neobratně, nenapadá mě lepší slovo. Snadno je odrážím, a přestože každý úder pálí jako [sc_victor.GetFaith.NegativeAfterLife], se zbraní v ruce je obávaný plenitel mnohem zvladatelnější.\n\n"
 single_combat.0041.desc.opponent_response.stoic_veteran: "[sc_loser.GetFirstNameNoTooltip] ovládá [sc_loser.Custom('signature_weapon')] s obratností typickou pro Varjaga a vede proti mně dlouhé, rovnoměrné seky. Odrazit je není snadné, ale zvládám to dostatečně dobře.\n\n"
 single_combat.0041.desc.opponent_response.blade_dance: "[sc_loser.GetFirstNameNoTooltip] může být proslulý schopnostmi se [sc_loser.Custom('SignatureWeaponArticle')] [sc_loser.Custom('signature_weapon')], ale vlastní umění jej očividně okouzluje až příliš.\n\nStačí jediný příhodně načasovaný útok [sc_victor.Custom('SignatureWeaponAttemptedLight')] na ruku svírající zbraň a protivníkův postoj se rozpadne,"
 single_combat.0041.desc.opponent_response.wrath_of_highgod: "[sc_loser.GetFirstNameNoTooltip] vykřikuje svou oddanost vůči [sc_loser.GetFaith.HighGodName] a zcela přestane věnovat pozornost našemu souboji.\n\nKrátkým pokrčením ramen ocením protivníkovu absurdní domýšlivost, vykročím vpřed a"
 single_combat.0041.desc.opponent_response.hurt_me_better: "Jedině [sc_victor.GetFaith.HealthGodName] ví, jaký výraz má právě [sc_loser.GetFirstNameNoTooltip] ve tváři. Strach? Bolest? Chtíč? Zmatek? Nejspíš se to nikdy nedozvím.\n\nAť už je to cokoli, promění se to v sérii krotkých a neškodných útoků [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')],"
 single_combat.0041.desc.opponent_response.special_fallback: "[sc_loser.GetFirstNameNoTooltip] zničehonic vyrazí vpřed a prudce kopne přesně tam, kde byla má holeň ještě před okamžikem. Nečekaný úkrok protivníka překvapí a ten kolem mě proletí zcela bez rovnováhy.\n\n"
 single_combat.0041.desc.opponent_response.something_to_hide: "[sc_loser.GetFirstNameNoTooltip] je právě v polovině žalostně strojeného pokusu mě znejistit, doplněného zlověstným hlasem a květnatými výhrůžkami, když mi dojde trpělivost a koncem [sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] jej udeřím do čelisti.\n\n[sc_loser.GetSheHe|U] okamžitě zavrávorá dozadu,"
 single_combat.0041.desc.opponent_response.wait_and_hope.fatality: "Úder zasáhne protivníka do hrdla a zanechá v něm krvavou, pohmožděnou ránu. Z ní začne proudit rudá krev a [sc_loser.GetFirstNameNoTooltip] v hrůze skloní hlavu, aby sledoval, jak život vytéká z krku a stéká po hrudi.\n\n[sc_loser.GetFirstNameNoTooltip] klesne na kolena. Zanedlouho se přestane hýbat."
 single_combat.0041.desc.opponent_response.unsure_attack.fatality: "Protože [sc_loser.GetFirstNameNoTooltip] stále tápe, zariskuji rychlý výpad. Útok [sc_victor.Custom('SignatureWeaponAttemptedLight')] zasáhne měkké místo v hrudi a [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] ji šikmo hluboko do hrudního koše.\n\n[sc_loser.GetFirstNameNoTooltip] okamžitě ztuhne a v návalu spalující bolesti ztratí vládu nad tělem.\n\nNež uvolním [sc_victor.Custom('signature_weapon')], je po všem a bezvládné tělo se neohrabaně svalí do [sc_defender.Custom('GroundType')]."
 single_combat.0041.desc.opponent_response.enthusiastic_onslaught.fatality: "Výpadu čelím dobře vypočítaným útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')], který protivníka zasáhne do hrudi, [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))] ji a vytrhne se ven ve spršce úlomků kostí a krvavých cárů masa.\n\n[sc_loser.GetFirstNameNoTooltip] se vlivem vlastní setrvačnosti otočí a zhroutí se v pokroucené hromadě. V zoufalých křečích se stále mísí šok s bolestí a každý trhavý pohyb jako by hledal cestu k záchraně, zatímco srdce odbíjí poslední údery."
 single_combat.0041.desc.opponent_response.hail_mary.fatality: "Nic neriskuji. Hned prvnímu úderu se otočkou vyhnu a [sc_victor.Custom('signature_weapon')] provedu útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], abych [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nOchrnutí přijde okamžitě. Nohy protivníka vypovědí službu a tělo se svalí do [sc_defender.Custom('GroundType')]. Kopnutím jej obrátím na záda, na rozloučenou uznale kývnu a poté [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.opponent_response.pocket_sand.fatality: "Takovou příležitost si nenechám ujít. Vrazím [sc_victor.Custom('signature_weapon')] protivníkovi do hrudi a jediným rychlým pohybem [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\nProtivník zavrávorá dozadu a ze zničeného trupu nepravidelně tryská krev.\n\nVytrhnu zbraň z těla postavy [sc_loser.GetFirstNameNoTooltip], abych zasadil ránu z milosti. Už je však mrtvá a není důvod cokoli protahovat."
 single_combat.0041.desc.opponent_response.nut_em.fatality: "Odvážné, ale [sc_victor.GetFaith.WarGodName] odměňuje obezřetnost. Pozvednu [sc_victor.Custom('signature_weapon')] a útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] protivníka [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\nVýsledný #EMP výbuch#! krve a masa doprovodí děsivý zvuk na půli cesty mezi výkřikem a klokotáním, ale [sc_loser.GetFirstNameNoTooltip] se stále potácí vpřed.\n\nDokud svírá [sc_loser.Custom('signature_weapon')], nemohu riskovat ránu z milosti. Jen na sebe hledíme, dokud unikající krev neuhasí světlo v [my_foe.Custom('EyeEyes')]."
 single_combat.0041.desc.opponent_response.guard.fatality: "zasadit útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který roztrhne vnitřní stranu stehna a přeřízne tepnu.\n\nAdrenalin udrží postavu [sc_loser.GetFirstNameNoTooltip] v boji ještě dvacet či třicet vteřin, než se projeví ztráta krve.\n\nZpočátku si ničeho nevšimne. Teprve při pohledu dolů spatří, jak ji stále více smáčí vlastní krev. Nevěřícnost vystřídá malátnost a protivník se bez okolků zhroutí k zemi. Ukončit jeho utrpení je rychlé a bezbolestné."
 single_combat.0041.desc.opponent_response.probing_attack.fatality: "se [sc_loser.Custom('signature_weapon')] [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')].\n\nPak už stačí příval útoků [sc_loser.Custom('SignatureWeaponAttemptedLightPlural')], dokud se mi nepodaří [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nSmrt nepřijde rychle."
 single_combat.0041.desc.opponent_response.onslaught.fatality: "a instinktivně navážu útokem [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] zezadu do kolena, který protivníka srazí k zemi.\n\nObratnou prací nohou zůstanu za ním, i když se potácivě zvedá, a přesně vedeným úderem jej [sc_victor.Custom2('SignatureWeaponKillTypeRearHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] zemře okamžitě."
 single_combat.0041.desc.opponent_response.surprise_attack.fatality: "\n\nMá riposta vyrve [sc_loser.Custom('signature_weapon')] protivníkovi z ruky a [sc_loser.GetFirstNameNoTooltip] v panice ztuhne.\n\nTím je osud zpečetěn. [sc_loser.Custom('signature_weapon')] vrazím do ramene a [sc_victor.Custom('SignatureWeaponWoundVerb5')] ji dovnitř. Cosi životně důležitého se přetrhne a [sc_loser.GetFirstNameNoTooltip] okamžitě ochabne.\n\nSmrt přijde ještě před dopadem do [sc_defender.Custom('GroundType')]."
 single_combat.0041.desc.opponent_response.taunt.fatality: "Úder zasáhne protivníka do trupu mnohem tvrději, než jsem čekal, a zasype mě sprškou vnitřností a roztříštěných žeber.\n\n[sc_loser.GetFirstNameNoTooltip] se k posměškům vůbec nedostane. Jen přenese váhu, zavrávorá několik kroků a mrtvý se zhroutí."
 single_combat.0041.desc.opponent_response.put_the_boot_in.fatality: "Nepolevím v útoku a pevným úderem [sc_victor.Custom('signature_weapon')] protivníka [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] okamžitě vyzvrací hustý proud krve a žaludečních šťáv. Dusí se, prská a naposledy lapá po dechu, zatímco směs dopadá zpět na tělo a zatéká do úst i nosu. Zanedlouho dušení ustane."
 single_combat.0041.desc.opponent_response.strict_guard.fatality: "proklouznout zdí krytů s útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\nJediný úder se ukáže jako dostačující a [sc_victor.Custom('signature_weapon')] protivníka [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] zřejmě nedokáže pochopit krev tryskající z rozervané krční tepny, protože ještě reflexivně odrazí můj další úder.\n\nStačím jen užasnout nad takovou #EMP houževnatostí#!, než světlo v [my_foe.Custom('EyeEyes')] navždy pohasne."
 single_combat.0041.desc.opponent_response.confident_attack.fatality: "zasadit pevný úder přímo do břicha.\n\nRána protrhne kůži, tuk i svaly a provazce střev se vyvalí do krví smáčeného [sc_defender.Custom('GroundType')]. [sc_loser.GetFirstNameNoTooltip] po nich uklouzne a s výkřikem přepadne dozadu.\n\nVykročím vpřed se zdviženou [sc_victor.Custom('signature_weapon')], abych ukončil protivníkovo utrpení."
 single_combat.0041.desc.opponent_response.expert_onslaught.fatality: "se mi podaří překvapivě pevný kryt. [sc_loser.Custom('signature_weapon')] se odrazí zpět do [sc_loser.Custom('MaskFace')] a [sc_loser.Custom('SignatureWeaponWoundVerb6PresentParticiple')] ránu až na kost.\n\nNeztrácím čas. Zaháknutou nohou podrazím postavě [sc_loser.GetFirstNameNoTooltip] nohy a plynule přejdu k tomu, že ji [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))], [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered_Aftermath',SCOPE.sC('sc_loser'))].\n\nVýkřiky doznívají až příliš dlouho."
 single_combat.0041.desc.opponent_response.attempt_disarm.fatality: "se [sc_loser.Custom('signature_weapon')] [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')].\n\nS nepoužitelnou zbraní je [sc_loser.GetFirstNameNoTooltip] snadno [sc_victor.Custom('SignatureWeaponKillTypePastTense')]."
 single_combat.0041.desc.opponent_response.tire_opponent.fatality: "Jakmile začne [sc_loser.GetFirstNameNoTooltip] ztrácet stabilitu, spustím útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který protivníka zcela srazí.\n\nKe své cti ještě odrazí následující úder. Ten další jej však [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))]. Přidušený jekot rychle vystřídá naprosté ticho."
 single_combat.0041.desc.opponent_response.reason_you_suck_speech.fatality: "Vykročím vpřed a provedu útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který protivníka [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] odletí dozadu a ze zničeného hrdla stříká krev. Na okamžik se zdá, že znovu získá rovnováhu a snad bude dokonce pokračovat v boji.\n\nPak se zhroutí."
 single_combat.0041.desc.opponent_response.technique_from_legend.fatality: "\n\nNetuším, #EMP proč#! [sc_loser.GetFirstNameNoTooltip] tak stojí, ale podivný postoj odměním rychlým podražením nohou a [sc_victor.Custom('signature_weapon')], která protivníka [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\nŽádný mistrovský chvat ani skrytá léčka nepřijdou, takže ten postoj byl zřejmě jen... podivný.\n\nPokrčím rameny a kopnutím obrátím postavu [sc_loser.GetFirstNameNoTooltip] na záda, abych zasadil smrtící úder."
 single_combat.0041.desc.opponent_response.like_a_viper.fatality: "Bleskově stáhnu [sc_victor.Custom('signature_weapon')] zpět a vedu ji přímo proti postavě [sc_loser.GetFirstNameNoTooltip]. Jediným mocným pohybem ji [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))] a odhodí tělo do [sc_defender.Custom('GroundType')].\n\nProtivník se zpočátku zmítá, snaží se vstát, pohnout nebo bránit. Dokáže se jen překulit na záda, než jej přemůže ztráta krve."
 single_combat.0041.desc.opponent_response.pocket_silver.fatality: "Jednám rychle a srazím protivníka k zemi.\n\nNež se vzpamatuje, připravím se na krutý konec a začnu jej [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\nVýkřiky utichnou dlouho předtím, než [sc_loser.GetFirstNameNoTooltip] zemře."
 single_combat.0041.desc.opponent_response.martial_voice.fatality: "Pak jednoduše vykročím a jediným úderem [sc_victor.Custom('signature_weapon')] protivníkovi [sc_victor.Custom('SignatureWeaponWoundVerb4')] hrdlo.\n\n[sc_loser.GetFirstNameNoTooltip] působí... zmateně. Vyděšeně. Rozzlobeně. Když je krk krvavou změtí, lze jen těžko vyjádřit jedinou emoci.\n\nJen přihlížím, jak se pomalu dusí vlastní krví."
 single_combat.0041.desc.opponent_response.mocking_boast.fatality: "naznačil útok, přiměl protivníka otočit se ke mně zády a poté jej [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nProtivník se okamžitě zhroutí a šok jej brzy následuje."
 single_combat.0041.desc.opponent_response.is_that_a_crocodile.fatality: "\n\nÚtok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] proletí přímo skrz kryt postavy [sc_loser.GetFirstNameNoTooltip] a zasáhne horní část hrudi. Síla, náhoda a narušené soustředění učiní ránu #EMP ničivou#! a všude kolem létá krev i úlomky kostí.\n\n[sc_loser.GetFirstNameNoTooltip] se zhroutí dozadu, zmítá se v křečích a zůstává z něj jen troska. Trvá až příliš dlouho, než skutečně zemře."
 single_combat.0041.desc.opponent_response.desert_warrior.fatality: "Vyrazím do útoku [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který protivníka srazí přímo k zemi. Následný úder se mu [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] do krku.\n\nNení to příjemná ani důstojná smrt, ale alespoň je rychlá."
 single_combat.0041.desc.opponent_response.jungle_stalker.fatality: "Rozptýlení mi poskytne dost času, abych vedl útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] přímo proti nechráněnému břichu a s výkřikem srazil protivníka k zemi.\n\nNásledující zápas je krátký, ale krvavý. Alespoň pro postavu [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.opponent_response.open_terrain_expert.fatality: "Když [sc_loser.GetFirstNameNoTooltip] zakopne, dopadne tvrdě a já jsem v jediném okamžiku u něj.\n\nRychlý kop do rozkroku jej udrží na zemi dost dlouho, abych jej [sc_victor.Custom('signature_weapon')] [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))].\n\nChvíli se ještě zmítá, ale nakonec se položí na záda a nechá smrt, aby si jej odnesla."
 single_combat.0041.desc.opponent_response.rough_terrain_expert.fatality.rocky: "ale zůstanu stát.\n\nKdyž si [sc_loser.GetFirstNameNoTooltip] nevšimne malého srázu za zády, strčím do něj a zkušený bojovník na svazích tvrdě přepadne dozadu.\n\nPři pádu přes okraj zaslechnu prasknutí a výkřik. Když seběhnu dolů, naleznu protivníka napůl nabodnutého na vlastní roztříštěnou stehenní kost. Rána z milosti netrvá dlouho."
 single_combat.0041.desc.opponent_response.rough_terrain_expert.fatality.boggy: "Kroužím kolem a hledám vhodné místo k úderu. [sc_loser.GetFirstNameNoTooltip] se dokáže vyškrábat ven, ale vzápětí padne tváří napřed do jiné, hlubší tůně. Vycítím svou chvíli a jediným rychlým úderem jej [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nOchrnutí přijde okamžitě a [sc_loser.GetFirstNameNoTooltip] klesá hlouběji do páchnoucí bažiny. Trvá dlouho, než bubliny ustanou."
 single_combat.0041.desc.opponent_response.forest_fighter.fatality: "\n\nVrhneme se na protivníka přívalem útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')]. Zpočátku se zdá, že je dobře odráží, ale pak začne zpomalovat a odněkud proudí krev. Zřejmě jsem zasáhl tepnu.\n\nDo minuty [sc_loser.GetFirstNameNoTooltip] ztratí vědomí. Ukončit vše je pak snadné."
 single_combat.0041.desc.opponent_response.raaargh.fatality: "Udržuji si odstup a vyrážím vpřed jen ve chvílích, kdy zuřivost postavy [sc_loser.GetFirstNameNoTooltip] vrcholí, abych odsekával kusy masa. Nějakou dobu takto tančíme.\n\nNakonec však běsnění poleví a přede mnou se již nekymácí berserker, ale pouhý [sc_loser.GetWomanMan|l]. Množství a závažnost ran jej postupně dohánějí, dokud..."
 single_combat.0041.desc.opponent_response.hard_grit.fatality: "proklouznout s útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')], který se zaboří do břicha postavy [sc_victor.GetFirstNameNoTooltip].\n\nBolestivou smrt přijímá [sc_loser.GetFirstNameNoTooltip] důstojně a navzdory utrpení bojuje až do samého konce."
 single_combat.0041.desc.opponent_response.feint_and_stab.fatality: "\n\nNež [sc_loser.GetFirstNameNoTooltip] dokáže použít druhou zbraň, obrátím proti němu vlastní [sc_victor.Custom('signature_weapon')] a [sc_victor.Custom2('SignatureWeaponKillTypeTorso2ThirdPersonSimplePresentGendered',SCOPE.sC('sc_loser'))]. Zbité tělo odletí dozadu, zmítá se a krvácí do [sc_defender.Custom('GroundType')].\n\nBěhem minuty ustane veškerý pohyb."
 single_combat.0041.desc.opponent_response.butchery.fatality: "Obezřetně a s podezřením na léčku proniknu zjevnou mezerou v krytu a zaútočím útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')], který protivníka hrůzně [sc_victor.Custom2('SignatureWeaponKillTypeHead2ThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] se okamžitě začne dávit proudem krve, upustí [sc_loser.Custom('signature_weapon')] a sevře si ránu.\n\nRánu stále svírá i ve chvíli, kdy o celou minutu později zemře."
 single_combat.0041.desc.opponent_response.stoic_veteran.fatality: "Upadneme do napjatého rytmu útoků, krytů a ripost. Pomalu získávám převahu a úder za úderem postavu [sc_loser.GetFirstNameNoTooltip] vyčerpávám, dokud neutrpí tolik podlitin a ran, že by většinu [sc_loser.GetWomenMen|l] zahubily dvakrát.\n\nI [sc_loser.GetSheHe|l] však má své meze. Když Varjag klesne na kolena a čeká na smrtící úder, je zřejmé, že to oba víme."
 single_combat.0041.desc.opponent_response.blade_dance.fatality: "zatímco já už vedu zpětný úder.\n\nVe tváři postavy [sc_loser.GetFirstNameNoTooltip] se objeví pobouření, zřejmě nad mou drzostí, ale nehodlám nechat souboj pokračovat.\n\n[sc_victor.Custom('signature_weapon')] se [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] smrtelně hluboko do hrudi mistra čepelí."
 single_combat.0041.desc.opponent_response.wrath_of_highgod.fatality: "vrazím konec [sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] přímo do [sc_loser.Custom('MaskFace')].\n\n[sc_loser.GetFirstNameNoTooltip] s výkřikem vzteku nad rouháním zavrávorá dozadu a na rtech má kletbu až do okamžiku, kdy mu [sc_victor.Custom('SignatureWeaponWoundVerb5')] do plíce.\n\nPak už se ozývá jen prskání, dávení a nakonec ticho."
 single_combat.0041.desc.opponent_response.hurt_me_better.fatality: "a oba zřejmě víme, že [sc_loser.GetFirstNameNoTooltip] už nepředstavuje skutečnou hrozbu ani mi nedokáže zabránit v odvetě.\n\nJediným pevným úderem jej [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.opponent_response.special_fallback.fatality: "Když mám zcela volný přístup k zádům protivníka, spustím na postavu [sc_loser.GetFirstNameNoTooltip] déšť útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] a srazím ji k zemi.\n\nTvrdě dopadne na bok a chvíli vykašlává chuchvalce krve, než ze sebe vyrazí vyčerpaný smrtelný chropot."
 single_combat.0041.desc.sc_attacker.wait_and_hope: "Trpělivě vyčkávám na dokonalou příležitost.\n\nKdyž žádná nepřijde, zkusím vyloženě #EMP vlažný#! útok [sc_victor.Custom('SignatureWeaponAttemptedLight')], který"
 single_combat.0041.desc.sc_attacker.unsure_attack: "Nejlepší obranou je pořádný útok, ale i ten váhavý je lepší než nic. S touto myšlenkou opatrně zkusím útok [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\n"
 single_combat.0041.desc.sc_attacker.enthusiastic_onslaught: "S bojovým řevem se naplno vrhnu do záplavy útoků [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] a zasypávám protivníka jednou ranou za druhou.\n\n"
 single_combat.0041.desc.sc_attacker.hail_mary: "Neočekávám, že tento souboj vyhraji. Nemá tedy smysl šetřit se a vrhnu se vpřed se [sc_victor.Custom('signature_weapon')] napřaženou před sebou.\n\n"
 single_combat.0041.desc.sc_attacker.pocket_sand: "Sehnu se, popadnu hrst [sc_defender.Custom('GritType')] a mrštím ji protivníkovi přímo do [sc_loser.Custom('MaskFace')]. [sc_loser.GetSheHe|U] je naprosto zaskočen,"
 single_combat.0041.desc.sc_attacker.nut_em: "V protivníkově krytu zahlédnu #EMP dokonalou#! mezeru, vykročím vpřed a #EMP tvrdě#! jej udeřím hlavou."
 single_combat.0041.desc.sc_attacker.guard: "Se [sc_victor.Custom('signature_weapon')] obezřetně připravenou před sebou postupuji vpřed a odrážím jeden protivníkův úder za druhým,"
 single_combat.0041.desc.sc_attacker.probing_attack: "Bojuji takticky, většinu útoků pouze naznačuji a naplno vedu jen ty, které mohou zasáhnout nejtvrději."
 single_combat.0041.desc.sc_attacker.onslaught: "Rozmáchnu se [sc_victor.Custom('signature_weapon')] a zasypu protivníka přívalem útoků [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')]."
 single_combat.0041.desc.sc_attacker.surprise_attack: "Okázale vedu [sc_victor.Custom('signature_weapon')] jedním směrem, ale uprostřed pohybu změním dráhu a útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] protivníka překvapím.\n\n"
 single_combat.0041.desc.sc_attacker.taunt: "S ledabylým pohrdáním zasypávám protivníka urážkami, posměšky a opovržením.\n\nNení proto divu, že"
 single_combat.0041.desc.sc_attacker.put_the_boot_in.peg_leg: "Jsem odhodlán protivníka srazit k zemi bez ohledu na riziko, a proto vložím celou svou váhu do útoku [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], po němž zavrávorá. Vzápětí jej surově kopnu umělou nohou.\n\n"
 single_combat.0041.desc.sc_attacker.put_the_boot_in.fallback: "Jsem odhodlán protivníka srazit k zemi, a proto vložím celou svou váhu do útoku [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], po němž zavrávorá. Vzápětí jej surově kopnu.\n\n"
 single_combat.0041.desc.sc_attacker.strict_guard: "Můj kryt neprolomí žádný protivník a ani ten dnešní není výjimkou. Sérií dokonalých krytů jej znovu a znovu nutím ustupovat a ničivý útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] vedu až ve chvíli, kdy je zcela vyčerpaný.\n\n"
 single_combat.0041.desc.sc_attacker.confident_attack: "Sebejistota je polovinou úspěchu a já s jistotou zkušeného mistra plynule vedu jeden útok [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] za druhým."
 single_combat.0041.desc.sc_attacker.expert_onslaught: "Paže svírající [sc_victor.Custom('signature_weapon')] se pohybuje rychle jako blesk a údery dopadají tvrdě jako tříštící se skála."
 single_combat.0041.desc.sc_attacker.attempt_disarm: "Jakmile spatřím dokonalou příležitost k odzbrojení, vedu [sc_victor.Custom('signature_weapon')] útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který protivníkovi vyrve [sc_loser.Custom('signature_weapon')] z ruky.\n\n"
 single_combat.0041.desc.sc_attacker.tire_opponent: "Nespěchám, zachovávám klid a neúnavné kryty střídám s rozčilujícími úskoky, dokud protivníka nevyhnutelně nepřipravím o síly.\n\n"
 single_combat.0041.desc.sc_attacker.reason_you_suck_speech: "Na každý úder protivníkovy [sc_loser.Custom('signature_weapon')] odpovím jízlivou poznámkou a úskokem dozadu.\n\n"
 single_combat.0041.desc.sc_attacker.technique_from_legend: "Přinutím tělo napodobit živou představu legendárního chvatu, zaujmu nepřirozený postoj a [sc_victor.Custom('SignatureWeaponFlourishPresentParticiple')] [sc_victor.Custom('signature_weapon')].\n\n"
 single_combat.0041.desc.sc_attacker.like_a_viper: "S neomylnou přesností se vrhnu se [sc_victor.Custom('signature_weapon')] napřaženou před sebou přímo do slepého místa v protivníkově krytu."
 single_combat.0041.desc.sc_attacker.pocket_silver: "Strhnu od pasu těžký měšec se stříbrem a mrštím jej protivníkovi přímo do [sc_loser.Custom('MaskFace')]."
 single_combat.0041.desc.sc_attacker.martial_voice: "Velení nevzdělané chátře je poněkud jiné umění než velení urozeným, ale získané dovednosti se přesto osvědčí, když z plných plic hřmím urážky a výhrůžky."
 single_combat.0041.desc.sc_attacker.mocking_boast: "Je to vlastně nádherné, využít protivníkova studu nad vlastní neschopností k tomu, abych"
 single_combat.0041.desc.sc_attacker.is_that_a_crocodile: "Ustupuji a protivník se mi drží v patách, celou dobu pokračuje v útoku. Za jeho zády se plazí netvor"
 single_combat.0041.desc.sc_attacker.desert_warrior: "Tuto hru dobře znám. Kdykoli se protivník přiblíží, lehce mu uniknu, stále dost blízko, abych mohl udeřit, ale nikdy ne natolik, aby zasáhl on mě. Zanedlouho za mě všechnu práci odvede poušť,"
 single_combat.0041.desc.sc_attacker.jungle_stalker: "Džungle je v boji spolehlivým spojencem a mně stačí počkat, až protivníka nějak polapí. Jakmile se mu noha zachytí v liáně, udeřím.\n\n"
 single_combat.0041.desc.sc_attacker.open_terrain_expert: "Prostor patří v souboji k tomu nejcennějšímu, přesto před protivníkem ustupuji jako voda před skálou. A stejně jako voda skálu jej jedním úderem za druhým postupně obrušuji.\n\n"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.rocky: "Na kopcích a v horách se bojuje obtížně i za nejlepších okolností, ale díky mým zkušenostem s takovým terénem je tento souboj pro protivníka hotovým utrpením.\n\n"
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.boggy: "V bažinách a močálech se bojuje obtížně i za nejlepších okolností, ale díky mým zkušenostem s takovým terénem je tento souboj pro protivníka hotovým utrpením.\n\n"
 single_combat.0041.desc.sc_attacker.forest_fighter: "Boj v lese je umění, v němž se jemná obratnost prolíná se surovostí a které přinášejí jen trpké zkušenosti. Protivníkovi velmi rád pomohu nějaké získat,"
 single_combat.0041.desc.sc_attacker.raaargh: "Vztek, zuřivost a neukojitelná potřeba #BER zabíjet#! se ve mně vzdouvají a rvou mi do mysli #BER krvavou díru#!. Cítím, jak mě #EMP berserkergang#! #BER pohlcuje#!, #EMP ale je to#! #BER slastná bolest! RÁÁÁRGH!#!\n\n"
 single_combat.0041.desc.sc_attacker.hard_grit: "V zápalu boje není místo pro odpuštění. Za každou chybu protivník zaplatí desetinásobně a každý neobratný pohyb se mu vrátí i s úroky. Mé útoky [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] jej postupně ničí a každý jej přibližuje k samému okraji porážky.\n\n"
 single_combat.0041.desc.sc_attacker.feint_and_stab: "Téměř líně naznačím útok [sc_victor.Custom('signature_weapon')]. Dýku v druhé ruce protivník spatří příliš pozdě, až když už"
 single_combat.0041.desc.sc_attacker.butchery: "Rty se mi zkřiví v ponurém úsměvu a spustím prudkou sérii útoků [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')]. Každý je veden spíše snahou působit bolest než zvítězit.\n\n"
 single_combat.0041.desc.sc_attacker.stoic_veteran: "Se [sc_victor.Custom('signature_weapon')] v ruce vedu proti protivníkovi dlouhé, rovnoměrné seky, které jej znovu a znovu nutí ustupovat."
 single_combat.0041.desc.sc_attacker.blade_dance: "Smrtícím rozmachem roztočím [sc_victor.Custom('signature_weapon')] a každým úderem na protivníkově těle skládám píseň bolesti."
 single_combat.0041.desc.sc_attacker.wrath_of_highgod: "Hromovým hlasem vyznávám svou oddanost vůči [sc_victor.GetFaith.HighGodName] a [sc_victor.Custom('signature_weapon')] pozvedám jako obětní dar."
 single_combat.0041.desc.sc_attacker.hurt_me_better: "Protivník si zřejmě myslí, že mi svými nicotnými údery působí bolest, ale každé její bodnutí mě pouze nutí bojovat tvrději a rychleji.\n\n"
 single_combat.0041.desc.sc_attacker.special_fallback: "V protivníkově krytu zahlédnu krátké zaváhání a prudce jej kopnu do holeně."
 single_combat.0041.desc.sc_attacker.something_to_hide: "Hlasem jen o málo silnějším než skřípavý šepot zasyčím nezaměnitelnou připomínku moci, kterou nad protivníkem mám. Okamžitě ztuhne.\n\n"
 single_combat.0041.desc.sc_attacker.wait_and_hope.injury: "přesto zasáhne [sc_loser.GetFirstNameNoTooltip] přes klouby ruky svírající [sc_loser.Custom('signature_weapon')]. Prsty se reflexivně rozevřou a zbraň s řinčením dopadne na zem.\n\n[sc_loser.GetFirstNameNoTooltip] a já na sebe nevěřícně hledíme. Je zřejmé, že výsledek překvapil nás oba.\n\nTrvá snad celou věčnost, než si vzpomenu vyzvat protivníka ke kapitulaci."
 single_combat.0041.desc.sc_attacker.unsure_attack.injury: "Světe div se, úder skutečně zasáhne [sc_loser.GetFirstNameNoTooltip] pod nešťastným úhlem a srazí protivníka k zemi!\n\nNež se [sc_loser.GetWomanMan|l] vyškrábe zpět na nohy, nastavím [sc_victor.Custom('signature_weapon')] tak, abych [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Kapitulace následuje okamžitě."
 single_combat.0041.desc.sc_attacker.enthusiastic_onslaught.injury: "Podle očekávání netrvá dlouho, než donutím [sc_loser.GetFirstNameNoTooltip] klesnout na kolena. Pak už stačí jediný dlouhý, líný oblouk, abych přiblížil [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('signature_weapon')] k protivníkovu hrdlu.\n\nKapitulace zazní v okamžiku, kdy se chladný kov dotkne krku."
 single_combat.0041.desc.sc_attacker.hail_mary.injury: "[sc_loser.GetFirstNameNoTooltip] mě sleduje s pohrdáním v [my_foe.Custom('EyeEyes')], ani se nepokusí uhnout a mou zbraň bez námahy odrazí vlastní [sc_loser.Custom('signature_weapon')].\n\nTéměř instinktivně zaháknu nohu za protivníkovo koleno a trhnu. A ono to skutečně zabere! Protivník se svalí a já se rychle připravím ke smrtícímu úderu.\n\nPrávě když se začínám rozmáchávat [sc_victor.Custom('signature_weapon')], ozve se překvapená a vyděšená kapitulace."
 single_combat.0041.desc.sc_attacker.pocket_sand.injury: "kašle a prská, protože mu část uvízla v průdušnici.\n\nNeztrácím čas a útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] podrazím postavě [sc_loser.GetFirstNameNoTooltip] kolena. [sc_loser.GetWomanMan|U] se zhroutí, stále se zmítá a snaží se dostat [sc_defender.Custom('GritType')] z [sc_defender.Custom('EyeEyes')].\n\nNež se mu to podaří, už se připravuji, abych [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nKapitulace přijde velmi rychle."
 single_combat.0041.desc.sc_attacker.nut_em.injury: "Někdo by takový pohyb nazval riskantním či pošetilým, ale lebka vražená do tváře připraví většinu kritiků o nejlepší argumenty. I mě však hlava pořádně bolí.\n\nAť už se cítím jakkoli špatně, [sc_loser.GetFirstNameNoTooltip] je na tom zjevně hůř. Zmítá se na zemi, lapá po dechu a svírá si [sc_loser.Custom('MaskFace')].\n\nMusím se trochu vzpamatovat, ale stále dokážu připravit [sc_victor.Custom('signature_weapon')], abych [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], a vynutit si kapitulaci."
 single_combat.0041.desc.sc_attacker.guard.injury: "dokud se mi nenaskytne #EMP dokonalá#! příležitost.\n\nBleskovým krytem a ripostou vykroutím [sc_loser.Custom('signature_weapon')] z ruky postavy [sc_loser.GetFirstNameNoTooltip] a pošlu ji vzduchem.\n\nProtivník zděšeně sleduje, jak se chystám k dalšímu, tentokrát smrtícímu úderu. Další násilí není třeba. Jakmile [sc_loser.GetFirstNameNoTooltip] pochopí, jak málo možností zbývá, vzdá se."
 single_combat.0041.desc.sc_attacker.probing_attack.injury: "\n\nVýsledkem je nepříjemná opotřebovací bitva, alespoň z pohledu postavy [sc_loser.GetFirstNameNoTooltip], která nakonec skončí tím, že z unavené ruky vyrazím [sc_loser.Custom('signature_weapon')].\n\nNaštěstí pro [sc_loser.GetFirstNameNoTooltip] jsme oba už nějakou dobu tušili, jak souboj skončí, takže po odzbrojení kapitulace přijde bez váhání."
 single_combat.0041.desc.sc_attacker.onslaught.injury: "Každý úder si vybírá strašlivou daň a vyžaduje tak tvrdé kryty, že se [sc_loser.GetWomanMan|l] už jen při obraně potí po celém [sc_loser.Custom('MaskFace')].\n\nTakové vypětí nelze snášet dlouho a [sc_loser.GetFirstNameNoTooltip] se nakonec zhroutí do [sc_defender.Custom('GroundType')].\n\n[sc_victor.Custom('SignatureWeaponAction')|U] [sc_victor.Custom('signature_weapon')] a odměnou mi je vyčerpaná kapitulace."
 single_combat.0041.desc.sc_attacker.surprise_attack.injury: "Útok zasáhne tvrději, než jsem čekal. [sc_loser.GetFirstNameNoTooltip] se téměř celý otočí a jen o vlásek se nesvalí k zemi.\n\nNa poslední chvíli znovu získá rovnováhu, ale já už mám [sc_victor.Custom('signature_weapon')] připravenou, abych [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))] [sc_loser.GetHerHim].\n\nNastane napjatá patová situace, zatímco [sc_loser.GetFirstNameNoTooltip] zvažuje své možnosti. Nakonec ze sebe přece jen vypraví hořkou kapitulaci."
 single_combat.0041.desc.sc_attacker.taunt.injury: "že se [sc_loser.GetSheHe|l] nakonec rozzuří natolik, až zapomene na veškeré zásady rozumného boje, odhodí [sc_loser.Custom('signature_weapon')] na zem a pokusí se mě zabít holýma [sc_loser.Custom('HandHands')].\n\nStačí lehce zamávat [sc_victor.Custom('signature_weapon')], aby si [sc_loser.GetFirstNameNoTooltip] uvědomil svou situaci. Mezi zatnutými zuby pak rychle zazní kapitulace."
 single_combat.0041.desc.sc_attacker.put_the_boot_in.injury: "[sc_loser.GetFirstNameNoTooltip] zavrávorá a já příležitost nepromarním. Vrhneme se vpřed s přívalem útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')], které protivníka s výkřiky srazí do [sc_defender.Custom('GroundType')].\n\nProtivník slabě pohne rukou svírající [sc_loser.Custom('signature_weapon')] a snaží se sebrat vůli k dalšímu odporu.\n\nPouze připravím vlastní zbraň, abych [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Pak však uslyším rozechvělou kapitulaci."
 single_combat.0041.desc.sc_attacker.strict_guard.injury: "Když [sc_loser.GetFirstNameNoTooltip] odletí dozadu, vyrazím za ním a koncem [sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] jej udeřím do [sc_loser.Custom('MaskFace')]. Jen málo #EMP křupnutí#! dokáže potěšit tak niterně jako právě #EMP toto#!.\n\nOmráčený a vyčerpaný protivník se zhroutí k zemi a zbraň mu vypadne z ruky. Je však tak otupělý, že z něj musím oficiální kapitulaci vykopat několika pečlivě mířenými kopanci."
 single_combat.0041.desc.sc_attacker.confident_attack.injury: "[sc_loser.GetFirstNameNoTooltip] se mě ze všech sil snaží držet od těla, ale zůstává zcela v obraně a kryt s každým úderem slábne a ztrácí přesnost.\n\nJakmile se naskytne příležitost, jediným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] vyrazím [sc_loser.Custom('signature_weapon')] do vzduchu. Tím je souboj rozhodnut.\n\nProtivník se vzdá ještě dříve, než dokončím zpětný nápřah."
 single_combat.0041.desc.sc_attacker.expert_onslaught.injury: "Úder za úderem protivníka krvavě a bezohledně nutím ke kapitulaci. S veškerou zuřivostí, kterou mi může propůjčit [sc_victor.GetFaith.WarGodName], jej zatloukám do země.\n\nKdyž přede mnou zbude jen chvějící se a krvácející [sc_loser.GetWomanMan|l], napadne mě, zda jsem nezašel příliš daleko. Pak [sc_loser.GetFirstNameNoTooltip] prudce zakašle, ztratí sevření [sc_loser.Custom('signature_weapon')] a já si s úlevou oddechnu.\n\nObavy pominuly. Odkopnu protivníkovu zbraň a vlastní mu přiložím k hrdlu. Musí se pokusit několikrát, ale nakonec ze sebe kapitulaci dostane."
 single_combat.0041.desc.sc_attacker.attempt_disarm.injury: "To... proběhlo překvapivě hladce. [sc_loser.GetFirstNameNoTooltip] a já na sebe jen rozpačitě hledíme. Protivník neví, zda se vrhnout za zbraní, nebo se vzdát, a já nejsem připraven na tak dokonalé provedení.\n\nVeškeré úvahy o pokračování v boji ukončím pozvednutým obočím a tím, že [sc_victor.Custom('SignatureWeaponAction')] [sc_victor.Custom('signature_weapon')].\n\nKapitulace je rozpačitá, ale rychlá."
 single_combat.0041.desc.sc_attacker.tire_opponent.injury: "Ke cti postavy [sc_loser.GetFirstNameNoTooltip] trvá souboj déle, než jsem čekal, ale nakonec se jeho délka začne na protivníkovi viditelně podepisovat.\n\nJeště chvíli počkám, abych si byl jistý, a občasnými útoky [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] jej pobízím k dalším výpadům. Poté jediným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] vyrazím [sc_loser.Custom('signature_weapon')] z ruky.\n\nVyčerpaný [sc_loser.GetFirstNameNoTooltip] se vzdá a vzápětí se zřítí [sc_loser.Custom('MaskFace')] napřed do [sc_defender.Custom('GroundType')]."
 single_combat.0041.desc.sc_attacker.reason_you_suck_speech.injury: "Větu za větou pronikám do protivníkova sebevědomí a přiživuji se na jeho nejistotách, dokud se kryt vlivem čirého rozčilení nezačne rozpadat.\n\nTeprve když rozmrzelost postavy [sc_loser.GetFirstNameNoTooltip] dosáhne vrcholu, vyrazím vpřed a útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] jí vyrvu [sc_loser.Custom('signature_weapon')].\n\nJeště poslední poznámka o protivníkově odolnosti vůči tlaku a pak už čekám na hořkou, přehořkou kapitulaci. Slané slzy nikdy nechutnaly sladčeji."
 single_combat.0041.desc.sc_attacker.technique_from_legend.injury: "Pak najednou všechno prostě... funguje. Bez námahy smetu kryt postavy [sc_loser.GetFirstNameNoTooltip], vyrazím [sc_loser.Custom('signature_weapon')] z ruky a pošlu protivníka k zemi.\n\nNež si to uvědomím, už se připravuji, abych [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Překvapený, zmatený a stále vyděšenější [sc_loser.GetFirstNameNoTooltip] ze sebe dokáže jen vykoktat kapitulaci."
 single_combat.0041.desc.sc_attacker.like_a_viper.injury: "[sc_loser.GetFirstNameNoTooltip] zřejmě spatří celý svůj život před očima, když se má zbraň řítí k jeho srdci, a zoufale se pokusí úder odrazit.\n\nKřivě se usměji, zachytím protivníkovu zbraň v nepříznivém úhlu a prudkým škubnutím změním smrtící úder v odzbrojení. [sc_loser.Custom('signature_weapon')] postavy [sc_loser.GetFirstNameNoTooltip] odletí vzduchem.\n\nSouboj je rozhodnut. Okázale přiložím [sc_victor.Custom('SignatureWeaponTipType')] své zbraně k protivníkovu srdci. Kapitulace přijde téměř stejně rychle jako můj první úder [sc_victor.Custom('signature_weapon')]."
 single_combat.0041.desc.sc_attacker.pocket_silver.injury: "\n\nPřestože se [sc_loser.GetFirstNameNoTooltip] vrženému předmětu vyhne, získaný okamžik využiji k proniknutí [sc_victor.Custom('signature_weapon')] #EMP dovnitř#! krytu a přitisknu její [sc_victor.Custom('SignatureWeaponTipAdjective')] [sc_victor.Custom('SignatureWeaponTipType')] k hrdlu postavy [sc_loser.GetWomanMan].\n\n[sc_loser.GetFirstNameNoTooltip] se nevzdá okamžitě. Na zlomek vteřiny to dokonce vypadá, že se pokusí něco provést vlastní zbraní, ale můj zamračený výraz a přenesení váhy jasně ukážou, že to může skončit jediným způsobem.\n\nKapitulace zazní."
 single_combat.0041.desc.sc_attacker.martial_voice.injury: "[sc_loser.GetFirstNameNoTooltip] je naprosto zaskočen, když z hromového řevu plynule přejdu k útoku [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], a v reflexivním strachu uskočí dozadu.\n\nInstinkt je rychlý, ale postrádá přesnost. Protivník to dokáže tím, že při úskoku upustí [sc_loser.Custom('signature_weapon')].\n\nUž jsem v polovině přípravy smrtícího úderu, když se [sc_loser.GetFirstNameNoTooltip] spěšně vzdá."
 single_combat.0041.desc.sc_attacker.mocking_boast.injury: "otevřel mezeru v krytu. Dokonalý příklad sebenaplňujícího se proroctví, byť s trochou mé pomoci.\n\nPak už stačí jediný pevný úder do ruky, v níž [sc_loser.GetFirstNameNoTooltip] svírá [sc_loser.Custom('signature_weapon')], a zbraň se uvolní. Okázale roztočím vlastní [sc_victor.Custom('signature_weapon')] a připravím se, abych [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. Neodolám ještě poslednímu rýpnutí.\n\n„Tak co říká poražený?“\n\nJak se ukáže, říká, že se vzdává. Znovu a znovu."
 single_combat.0041.desc.sc_attacker.desert_warrior.injury: "a ponechá [sc_loser.GetFirstNameNoTooltip] na samém pokraji vyčerpání.\n\nZaútočím až ve chvíli, kdy protivníka úmorné vedro téměř zcela zlomí. Sérií útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] jej odhodím do [sc_defender.Custom('GroundType')].\n\nNež se [sc_loser.GetFirstNameNoTooltip] překulí na záda, už mám [sc_victor.Custom('signature_weapon')] připravenou, abych [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]. [sc_loser.GetSheHe|U] vyplivne plná ústa [sc_defender.Custom('GroundType')] a vzdá se."
 single_combat.0041.desc.sc_attacker.jungle_stalker.injury: "Rychlý kop do rozkroku srazí protivníka s výkřikem do podrostu. [sc_loser.GetFirstNameNoTooltip] se nejprve zmítá, ale rychle znehybní, když mu přiložím [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('signature_weapon')] přímo k [sc_loser.Custom('MaskFace')].\n\nKapitulace přijde okamžitě."
 single_combat.0041.desc.sc_attacker.open_terrain_expert.injury: "Nakonec [sc_loser.GetFirstNameNoTooltip] vyčerpáním zakopne a já okamžitě zaútočím útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který protivníka odhodí k zemi.\n\nPokusí se zvednout, ale snaha se změní v paniku, když mu přišlápnu hlavu botou.\n\nPozvednu [sc_victor.Custom('signature_weapon')], abych [sc_victor.Custom2('SignatureWeaponKillTypeHeadThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], a odměnou mi je omámená kapitulace."
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.injury.rocky: "Znovu a znovu tlačím [sc_loser.GetFirstNameNoTooltip] dozadu a protivník pokaždé na poslední chvíli získá rovnováhu. Až do okamžiku, kdy se mu to nepodaří a přepadne přes malý svah.\n\nVrhneme se za ním a přitisknu [sc_victor.Custom('signature_weapon')] k jeho zátylku dříve, než se stačí vzpamatovat. Poněkud otlučená kapitulace přijde bez zaváhání."
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.injury.boggy: "Vyžaduje to několik pokusů, ale nakonec se mi podaří zatlačit [sc_loser.GetFirstNameNoTooltip] do tůně páchnoucí bažinaté vody hluboké po kolena. [sc_loser.GetSheHe|U] uklouzne, při pádu ztratí [sc_loser.Custom('signature_weapon')] a s odporným šplouchnutím zmizí pod hladinou.\n\nZ pevné země stačí podržet botu nad [sc_loser.Custom('MaskFace')]. Hrozba udušení v páchnoucí bažině mi rychle vynese kapitulaci, byť částečně vybublanou."
 single_combat.0041.desc.sc_attacker.forest_fighter.injury: "a bezhlavě se proplétám mezi trním a stromy.\n\n[sc_loser.GetFirstNameNoTooltip] si vůbec nevšimne shnilého pařezu, k němuž jej zaháním. S překvapeným výkřikem přes něj přepadne dozadu a [sc_loser.Custom('signature_weapon')] odletí podrostem.\n\nPak už ke kapitulaci stačí silný kop do hrudi a poslední útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]."
 single_combat.0041.desc.sc_attacker.raaargh.injury: "Vyrazím vpřed jako posedlý [sc_victor.GetWomanMan|l], rozmetám protivníkův kryt a útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] vyrvu [sc_loser.Custom('signature_weapon')] z ruky.\n\nRychleji, než dokážu vnímat, a tak tvrdě, až se chvějí #EMP mé#! vlastní kosti, spustím nenávistný příval úderů, který protivníka snadno srazí k zemi.\n\nStejně rychle, jako mě zuřivost pohltila, také zmizí. Zůstávám otřesený, ale opět při smyslech. [sc_loser.GetFirstNameNoTooltip] prakticky vykřikne kapitulaci, dokud ještě může."
 single_combat.0041.desc.sc_attacker.hard_grit.injury: "Zanedlouho přesně mířeným útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] vyrazím [sc_loser.Custom('signature_weapon')] z protivníkova sevření.\n\n[sc_loser.GetFirstNameNoTooltip] na okamžik ztuhne, ale vykoktá kapitulaci dříve, než jej [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.sc_attacker.feint_and_stab.injury: "letí hlavicí napřed proti [sc_loser.Custom('MaskFace')].\n\nÚder zasáhne [sc_loser.GetFirstNameNoTooltip] #EMP tvrdě#!. Hlavice se zaboří tak hluboko, až bych přísahal, že cítím pohmožděnou kost, a protivník omámeně zavrávorá dozadu.\n\nJakmile [sc_loser.Custom('signature_weapon')] vypadne z ruky, [sc_loser.GetFirstNameNoTooltip] ze sebe vykoktá kapitulaci, aniž bych musel cokoli dalšího udělat."
 single_combat.0041.desc.sc_attacker.butchery.injury: "[sc_loser.GetFirstNameNoTooltip] po každém úderu zavrávorá a ochabne, ale každá slastná vlna bolesti, která protivníkem projede, mě pouze nutí bojovat ještě tvrději.\n\nKdyž se nakonec zhroutí, lapá po dechu a vyplivuje husté provazce krve.\n\nLíně se připravím, abych jej [sc_victor.Custom2('SignatureWeaponKillTypeRearHeadThirdPersonPresentGendered',SCOPE.sC('sc_loser'))]. Téměř mě zklame, když mučená kapitulace zazní dříve, než dopadne má [sc_victor.Custom('signature_weapon')]."
 single_combat.0041.desc.sc_attacker.stoic_veteran.injury: "[sc_loser.GetFirstNameNoTooltip] se mnou sotva drží krok, dokud jeden z mých úderů nezasáhne [sc_loser.Custom('signature_weapon')] tak tvrdě, až se skutečně [sc_loser.Custom('SignatureWeaponBreaksThirdPersonSingularPresent2')].\n\nProtivník bez zbraně koktavě ustoupí o několik kroků, zatímco mu dochází skutečnost.\n\nKapitulace přijde rychle."
 single_combat.0041.desc.sc_attacker.blade_dance.injury: "Skutečný boj je umění a já jsem především umělec.\n\nTeprve když je [sc_loser.GetFirstNameNoTooltip] téměř v mrákotách, zasadím poslední úder. Jediným plynulým útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] protivníka odzbrojím a jeho [sc_loser.Custom('signature_weapon')] odletí vzduchem.\n\nTělem i duší se připravím, abych [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))], a dokonale se zastavím přesně ve chvíli, kdy zazní kapitulace."
 single_combat.0041.desc.sc_attacker.wrath_of_highgod.injury: "Protivník zřejmě očekává delší modlitbu, protože jej naprosto zaskočí, když plynule přejdu k útoku [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který jej málem srazí k zemi.\n\nZatímco [sc_loser.GetFirstNameNoTooltip] znovu získává rovnováhu, vyrazím vpřed a zastavím [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('signature_weapon')] sotva palec od [sc_loser.Custom('MaskFace')].\n\nŽádná kapitulace nechutná lépe než ta zasvěcená postavě [sc_victor.GetFaith.HighGodName]."
 single_combat.0041.desc.sc_attacker.hurt_me_better.injury: "Agonie a adrenalin pomalu vrcholí. Vydám ohlušující řev a vrhnu se do vlny útoků [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')], které srazí [sc_loser.GetFirstNameNoTooltip] na kolena.\n\nProtivník se snaží krýt a vůbec si nevšimne mého kolena, které mu vletí přímo do [sc_loser.Custom('MaskFace')]. [sc_loser.GetSheHe|U] se zhroutí dozadu a lapá po dechu.\n\nPořád ještě sípe, když o několik vteřin později vychraptí kapitulaci a oči má upřené na mou klesající [sc_victor.Custom('signature_weapon')]."
 single_combat.0041.desc.sc_attacker.special_fallback.injury: "Kop protivníka zřejmě zaskočí a [sc_loser.GetSheHe|l] tvrdě zavrávorá.\n\nVyužiji příležitosti a jemně přiložím [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('signature_weapon')] k tváři postavy [sc_loser.GetFirstNameNoTooltip].\n\nJakmile překvapení pomine, zazní kapitulace."
 single_combat.0041.desc.sc_attacker.something_to_hide.injury: "Zatímco [sc_loser.GetFirstNameNoTooltip] stojí pohroužený do myšlenek, zasadím útok [sc_victor.Custom('SignatureWeaponAttemptedLight')], který jej odhodí dozadu. Druhým úderem mu vyrvu [sc_loser.Custom('signature_weapon')] z ruky.\n\nBeze zbraně, v snadném dosahu [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] a pouhé vteřiny od smrti z mých rukou se [sc_loser.GetFirstNameNoTooltip] vzdá."
 single_combat.0041.desc.sc_attacker.wait_and_hope.fatality: "přesto pronikne přímo skrz kryt postavy [sc_loser.GetFirstNameNoTooltip] a [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\nProtivník neohrabaně zavrávorá dozadu a s odporným mlasknutím ze sebe vytrhne mou [sc_victor.Custom('signature_weapon')]. Z rány nejprve vyvěrá a poté proudí krev, která smáčí zem kolem něj. Ústa postavy [sc_loser.GetWomanMan] sebou škubou a ochable se pohybují, jako by se navzdory bolesti snažila utvořit slova.\n\n[sc_loser.GetFirstNameNoTooltip] vypadá stejně ohromeně jako já."
 single_combat.0041.desc.sc_attacker.unsure_attack.fatality: "Za nic na světě bych nedokázal říct, #EMP kam přesně#! útok postavu [sc_loser.GetFirstNameNoTooltip] zasáhl, ale zasáhnout musel, protože po něm zavrávorá dozadu. Odkudsi z hrudi proudí krev, na kterou nevěřícně hledí.\n\nVím, jak tohle skončí, a nehodlám riskovat, že mě protivník vezme do hrobu s sebou. Pozvednu [sc_victor.Custom('signature_weapon')] a vyrazím vpřed ke smrtícímu úderu."
 single_combat.0041.desc.sc_attacker.enthusiastic_onslaught.fatality: "Nadšení dokáže nahradit mnoho nedostatků a tentokrát zcela zastoupí i obratnost. Pouhou hrubou silou vyrvu [sc_loser.Custom('signature_weapon')] z ruky postavy [sc_loser.GetFirstNameNoTooltip].\n\nNeztrácím čas a vykročím k odzbrojenému protivníkovi, který se již kryje holýma [sc_loser.Custom('HandHands')]. S nelítostnou účinností se chystám [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nVýkřiky ustanou mnohem dříve než proud krve."
 single_combat.0041.desc.sc_attacker.hail_mary.fatality: "Až po zahájení výpadu si uvědomím, že mířím příliš vysoko. V panice se pokusím strhnout zbraň níž a nečekané škubnutí pronikne kolem krytu postavy [sc_loser.GetFirstNameNoTooltip] přímo do lebky.\n\nÚder se [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] skrz kost až do mozku a protivníka okamžitě zabije.\n\nMrtvé tělo postavy [sc_loser.GetFirstNameNoTooltip] ještě chvíli vrávorá, podepřené mou paží se [sc_victor.Custom('signature_weapon')], než se neohrabaně zhroutí do [sc_defender.Custom('GroundType')]."
 single_combat.0041.desc.sc_attacker.pocket_sand.fatality: "a krátkého zaváhání využiji k tomu, abych vší silou vrazil [sc_victor.Custom('signature_weapon')] protivníkovi do břicha.\n\nKdyž [sc_loser.GetFirstNameNoTooltip] oslepený a krvácející padá dozadu, vyrazím vpřed a smrtícím úderem se hluboko proseknu do jeho krku. Maso se trhá jako na řeznickém špalku a oba nás potřísní teplá krev.\n\nDo minuty po dopadu na zem je po všem."
 single_combat.0041.desc.sc_attacker.nut_em.fatality: "Jako každá hlavička bolí téměř stejně mě jako protivníka, ale [sc_loser.GetFirstNameNoTooltip] poté působí... podivně. Jako by mu úder zpřeházel myšlenky.\n\nNěkolika útoky [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] vyzkouším jeho kryt a poté zariskuji útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Rána se [sc_victor.Custom('SignatureWeaponWoundVerb1ThirdPersonPresent')] hluboko do ramene a pronikne až k životně důležitým orgánům v hrudním koši.\n\nKdyž [sc_victor.Custom('signature_weapon')] vytáhnu, z rány vystříkne krev a úlomky kostí. [sc_loser.GetFirstNameNoTooltip] zavrávorá, zakolísá, zhroutí se a znehybní."
 single_combat.0041.desc.sc_attacker.guard.fatality: "dokud mi jeden špatně odhadnutý úder neumožní odrazit [sc_loser.Custom('signature_weapon')] stranou.\n\nNež stačí [sc_loser.GetFirstNameNoTooltip] cokoli namítnout, spustím sérii útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')] a za chybu si vyberu daň v krvi a bolesti.\n\nZanedlouho protivník klesne na kolena a [sc_loser.Custom('MaskFace')] má pokrytý krvavými slinami. S chladnou rozvahou kata jej nakonec [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.sc_attacker.probing_attack.fatality: "Postupně narušuji postoj postavy [sc_loser.GetFirstNameNoTooltip], dokud ji útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] neodhodím do vzduchu.\n\nJakmile se protivník ocitne ve vzduchu, vložím veškerou váhu do útoku [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. Ten zasáhne přesně při dopadu a jediným prudkým úderem jej [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] zemře rychle."
 single_combat.0041.desc.sc_attacker.onslaught.fatality: "Každý úder protivníka o něco připraví. O pevný postoj, vzduch v plicích, [sc_loser.Custom('signature_weapon')] či kus masa.\n\nTeprve když už je téměř zcela bezmocný, nechám [sc_victor.Custom('SignatureWeaponWoundVerb2')] smrtelně hluboko do hrudi postavy [sc_loser.GetFirstNameNoTooltip].\n\nMé milosrdenství zřejmě nedokáže ocenit. Při pádu do rozpínající se kaluže vlastní krve sebou slabě škube v křečích."
 single_combat.0041.desc.sc_attacker.surprise_attack.fatality: "Útok je zřejmě tak silný, že [sc_loser.GetFirstNameNoTooltip] ztratí sevření [sc_loser.Custom('signature_weapon')], která odletí do [sc_defender.Custom('GroundType')]. Takovou výhodu nepromarním. Vyrazím vpřed a jediným plynulým pohybem protivníka [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\n[sc_loser.GetFirstNameNoTooltip] se zhroutí k zemi a život z něj rychle uniká. Až do úplného konce mi hledí přímo do [sc_victor.Custom('EyeEyes')]."
 single_combat.0041.desc.sc_attacker.taunt.fatality: "že se [sc_loser.GetFirstNameNoTooltip] rozzuří natolik, až se celý kryt v návalu vzteku rozpadne.\n\nOtevřenou cestu k protivníkovu břichu odměním pomalou smrtí."
 single_combat.0041.desc.sc_attacker.put_the_boot_in.fatality: "Dvojitý útok rozmetá kryt postavy [sc_loser.GetFirstNameNoTooltip]. Nejprve ji útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] odzbrojím a poté plynule přejdu ke smrtícímu úderu do hrudi, který vyhloubí krvavou cestu až k srdci.\n\nExistují i pomalejší způsoby smrti."
 single_combat.0041.desc.sc_attacker.strict_guard.fatality: "První úder prorazí v krytu postavy [sc_loser.GetFirstNameNoTooltip] obrovskou mezeru a druhý jí vyřadí paži svírající [sc_loser.Custom('signature_weapon')]. Protivník zavrávorá a pod lavinou bolesti ztrácí vědomí.\n\nS dalším úderem nespěchám. [sc_victor.Custom('signature_weapon')] se [sc_victor.Custom('SignatureWeaponWoundVerb1PresentParticiple')] hluboko do hrudi postavy [sc_loser.GetWomanMan].\n\nNásledující útok už pouze ukončí bolest."
 single_combat.0041.desc.sc_attacker.confident_attack.fatality: "Jakmile nadejde správný okamžik, změním rytmus boje a nečekaným úderem ze strany zasáhnu postavu [sc_loser.GetFirstNameNoTooltip] přímo do břicha.\n\nRána protivníka odhodí dozadu a při pádu mu z nového otvoru bezvládně vyklouzne cosi rudého a nepochybně životně důležitého.\n\nObezřetně se přiblížím, ale brzy je zřejmé, že nastupuje šok. Pro jistotu odkopnu [sc_loser.Custom('signature_weapon')] a připravím se ukončit utrpení postavy [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.sc_attacker.expert_onslaught.fatality: "Upřímně obdivuji, kolik úderů [sc_victor.Custom('signature_weapon')] dokáže [sc_loser.GetFirstNameNoTooltip] vydržet, když na něj dopadám s veškerou zuřivostí burácející bouře.\n\nTrvá to minutu či dvě, ale nakonec z protivníka vytluču krvavou, pokroucenou a #EMP křičící#! hromadu.\n\nSmrtící úder zasadím až ve chvíli, kdy mám jistotu, že už nemůže přijít žádná poslední odveta."
 single_combat.0041.desc.sc_attacker.attempt_disarm.fatality: "Bez jediného zaváhání se vrhnu do útoku [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], který se [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] přímo skrz protivníkův hrudní koš.\n\nNa postavu [sc_loser.GetFirstNameNoTooltip] útočím dál, i když se malátně a bezvládně hroutí k zemi. Přestanu teprve tehdy, když mrtvé tělo rozhýbávají už jen mé údery."
 single_combat.0041.desc.sc_attacker.tire_opponent.fatality: "Trvá dlouho, než se v krytu postavy [sc_loser.GetFirstNameNoTooltip] otevře vhodná mezera, ale když se objeví, víc nepotřebuji. Jediným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] vedeným [sc_victor.Custom('signature_weapon')] roztrhnu břicho a proniknu až do žaludku.\n\nKrev, žluč a poslední jídlo protivníka se vyvalí ven, potřísní mi dolní polovinu těla a [sc_loser.GetSheHe|l] vydá pronikavý výkřik.\n\nKdyž utrpení postavy [sc_loser.GetFirstNameNoTooltip] předčasně ukončím, je to snad projev milosrdenství."
 single_combat.0041.desc.sc_attacker.reason_you_suck_speech.fatality: "Protivníkovy údery jsou stále ukvapenější a rostoucí frustrace je jasně patrná z jejich neobratnosti, dokud [sc_loser.GetFirstNameNoTooltip] nevykřikne vzteky.\n\nPrávě v tom okamžiku proniknu skrz kryt a [sc_victor.Custom('SignatureWeaponWoundVerb5PresentParticiple')] [sc_victor.Custom('signature_weapon')] hluboko do protivníkova hrdla.\n\nPohled na krvavou rozervanou změť, která po úderu zůstane, působí bolestivě sám o sobě. [sc_loser.GetFirstNameNoTooltip] se naštěstí zhroutí mrtvý tváří k zemi a ušetří nám oběma další trápení."
 single_combat.0041.desc.sc_attacker.technique_from_legend.fatality: "Spíše s nadějí než přesvědčením vyrazím proti postavě [sc_loser.GetFirstNameNoTooltip]. [sc_victor.Custom('signature_weapon')] držím přesně jako hrdinové z příběhů a reflexivně zavřu oči.\n\nNáhle ucítím odpor tvrdý jako kámen, zaslechnu zvuk mokrého masa rozťatého vedví a paží mi projede škubnutí. Otevřu oči v přesvědčení, že spatřím vlastní zkázu, ale místo toho přede mnou z rozervaného pahýlu krku postavy [sc_loser.GetFirstNameNoTooltip] bezhlavě tryská krev.\n\nNež naleznu hlavu, světlo v [sc_loser.Custom('EyeEyes')] postavy [sc_loser.GetWomanMan] už dávno pohaslo."
 single_combat.0041.desc.sc_attacker.like_a_viper.fatality: "[sc_loser.GetFirstNameNoTooltip] se pokusí útok odrazit, ale k jeho zastavení se ani nepřiblíží.\n\nBez potíží proletím kolem chabého krytu a [sc_victor.Custom('SignatureWeaponTipType')] [sc_victor.Custom('signature_weapon')] se zaboří protivníkovi do hrudi.\n\nPraskání kostí a vlhké pukání propichovaných orgánů zní jako celou věčnost, dokud zbraň neprojde tělem až na druhou stranu.\n\nNelze téměř poznat, v které chvíli úderu [sc_loser.GetFirstNameNoTooltip] zemřel."
 single_combat.0041.desc.sc_attacker.pocket_silver.fatality: "[sc_loser.GetFirstNameNoTooltip] se měšci vyhne, ale následný úder už nezahlédne.\n\nÚtok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] zasáhne přímo čelist a vyrve maso, zuby i kost. Protivník se pokusí vykřiknout, ale zničená ústa mu to nedovolí.\n\nKdyž jeho utrpení ukončím, lze to považovat za milosrdenství."
 single_combat.0041.desc.sc_attacker.martial_voice.fatality: "\n\nBez jakéhokoli varování přejdou mé řvané nadávky v útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]. [sc_loser.GetFirstNameNoTooltip] je stále natolik zděšen mými slovy, že se úder ani nepokusí odrazit.\n\nKov narazí do masa a kostí a [sc_victor.Custom('SignatureWeaponWoundVerb2PresentParticiple')] se hluboko do protivníkova ramene. Oba víme, že tak silné krvácení nelze přežít."
 single_combat.0041.desc.sc_attacker.mocking_boast.fatality: "je zabít. Mé poznámky postavu [sc_loser.GetFirstNameNoTooltip] natolik ohromí, že mi nedokáže zabránit vyrvat [sc_loser.Custom('signature_weapon')] z jejího sevření.\n\nProtivník má právě dost času pochopit, jak vše skončí, než jej [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.sc_attacker.is_that_a_crocodile.fatality: "se přibližuje, dokud protivníka nesrazí k zemi a [sc_loser.Custom('signature_weapon')] neodletí stranou.\n\nČas se rozevře stejně pomalu a široce jako tlama šelmy. [sc_loser.GetFirstNameNoTooltip] hledí do páchnoucí tlamy zdánlivě celou věčnost.\n\nPak čas i krokodýlí čelisti zaklapnou.\n\nZdá se mi, že panické výkřiky postavy [sc_loser.GetFirstNameNoTooltip] slyším z útrob netvora ještě dlouho poté, co tesáky oddělí její končetiny."
 single_combat.0041.desc.sc_attacker.desert_warrior.fatality: "a mně už stačí pouze podkopnout postavě [sc_loser.GetFirstNameNoTooltip] kolena.\n\nJakmile dopadne do [sc_defender.Custom('GroundType')], je rozhodnuto. Jediný útok [sc_victor.Custom('SignatureWeaponAttemptedLight')] ji [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonActiveGendered',SCOPE.sC('sc_loser'))].\n\nPak už postavě [sc_loser.GetFirstNameNoTooltip] nezbývá nic jiného než zemřít."
 single_combat.0041.desc.sc_attacker.jungle_stalker.fatality: "Konec [sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] vrazím postavě [sc_loser.GetFirstNameNoTooltip] do oka a až příliš snadno odrazím její [sc_loser.Custom('signature_weapon')].\n\nBez možnosti bránit se je s postavou [sc_loser.GetFirstNameNoTooltip] rychle konec."
 single_combat.0041.desc.sc_attacker.open_terrain_expert.fatality: "[sc_loser.GetFirstNameNoTooltip] se nevyhnutelně natáhne příliš daleko a já okamžitě využiji příležitosti bleskovým útokem [sc_victor.Custom('SignatureWeaponAttemptedLight')] do boku.\n\n[sc_victor.Custom('SignatureWeaponTipType')|U] [sc_victor.Custom('signature_weapon')] se vrátí smáčený krví a ověšený vnitřnostmi. Protivník se během několika vteřin zhroutí pod náporem nesnesitelné bolesti.\n\nPozvednu zbraň k ráně z milosti."
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.fatality.rocky: "Vyžaduje to více námahy, než by se mi líbilo, ale nakonec zatlačím postavu [sc_loser.GetFirstNameNoTooltip] přes malý sráz. Protivník se s rachotem náhle lámaných končetin skutálí po svahu.\n\nNež jej dostihnu, je zásah [sc_victor.Custom('signature_weapon')] spíše vítaným vysvobozením než čímkoli jiným."
 single_combat.0041.desc.sc_attacker.rough_terrain_expert.fatality.boggy: "Po dostatečném počtu strčení se mi nakonec podaří poslat postavu [sc_loser.GetFirstNameNoTooltip] tváří napřed do hluboké tůně páchnoucí vody.\n\nZbraň je okamžitě ztracena a já zkušeně přišlápnu postavě [sc_loser.GetWomanMan] zátylek.\n\nAť se [sc_loser.GetSheHe|l] zmítá jakkoli, mezi mou [sc_victor.Custom('signature_weapon')] a nohou nedokáže dostat hlavu nad hladinu. Netrvá dlouho a veškerý odpor ustane."
 single_combat.0041.desc.sc_attacker.forest_fighter.fatality: "a jako démon pronásleduji protivníka mezi stromy.\n\nKdyž [sc_loser.GetFirstNameNoTooltip] zakopne, naskytne se mi nejlepší příležitost k vítězství a vyrazím vpřed. [sc_victor.Custom('signature_weapon')] se [sc_victor.Custom('SignatureWeaponWoundVerb5ThirdPersonPresent')] dolů a jediným útokem [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] protivníka [sc_victor.Custom2('SignatureWeaponKillTypeRearTorsoThirdPersonPresentParticipleGendered',SCOPE.sC('sc_loser'))].\n\nKopnutím jej obrátím na záda. [sc_loser.GetFirstNameNoTooltip] je ještě právě natolik naživu, aby mi pohlédl do [sc_victor.Custom('EyeEyes')], když jej zabiji."
 single_combat.0041.desc.sc_attacker.raaargh.fatality: "Zrak mi zahalí rudý opar natolik hustý, že své činy vnímám spíše jako téměř nehybné výjevy. Zbraň postavy [sc_loser.GetFirstNameNoTooltip] je k ničemu, když se [sc_victor.Custom('SignatureWeaponBreaksThirdPersonSingularPresent')]. [sc_loser.Custom('ArmArms')|U] téměř prasknou vedví, když je odmrštím stranou. Tvář se mění v krvavou změť roztříštěných zubů a rozervaných dásní, zatímco znovu napřahuji pěst.\n\nKdyž se proberu, cítím pod patou cosi lepkavého a vlhkého. Jediný pohled potvrdí, že jde o zbytek lebky postavy [sc_loser.GetFirstNameNoTooltip]."
 single_combat.0041.desc.sc_attacker.hard_grit.fatality: "Bez možnosti znovu získat kontrolu nad soubojem je smrt postavy [sc_loser.GetFirstNameNoTooltip] otázkou času.\n\nNakonec protivník udělá rozhodující chybu a kryt se na okamžik otevře. Víc nepotřebuji. Jediný další úder mu [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] krk.\n\n[sc_loser.GetFirstNameNoTooltip] se zanedlouho udusí."
 single_combat.0041.desc.sc_attacker.feint_and_stab.fatality: "proletí skrz kryt a přímo do hrudi.\n\n[sc_loser.GetFirstNameNoTooltip] zavrávorá dozadu a dýka v mé druhé ruce se uvolní z těla. Podlahu přitom zasype krev a úlomky kostí.\n\nProtivník rychle vykrvácí, avšak nikoli bez bolesti."
 single_combat.0041.desc.sc_attacker.butchery.fatality: "Kousek po kousku se odhodlání postavy [sc_loser.GetFirstNameNoTooltip] láme a každé olíznutí agonie ničí zbytky statečnosti, které se snaží zachovat. Proměním protivníka v chvějící se trosku, která křičí a vypouští krev do [sc_defender.Custom('GroundType')].\n\nNakonec už je toho dost i na mě. Poslední útok [sc_victor.Custom('SignatureWeaponAttemptedLight')] výrazně urychlí smrt postavy [sc_loser.GetFirstNameNoTooltip], ale ne #EMP příliš#! výrazně."
 single_combat.0041.desc.sc_attacker.stoic_veteran.fatality: "\n\nBystré oko v boji odhaluje příležitosti a to mé mi umožní [sc_loser.Custom('SignatureWeaponBreaksVerbPastTense')] [sc_loser.Custom('signature_weapon')] postavy [sc_loser.GetFirstNameNoTooltip]. Odzbrojený protivník už nepředstavuje velkou hrozbu a příštím úderem jej mohu [sc_victor.Custom2('SignatureWeaponKillTypeTorsoThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nTím je [sc_loser.GetFirstNameNoTooltip] mrtvý, jen ještě zcela nedozemřel.\n\nNechám budoucí mrtvolu přepadnout dozadu, zatímco má [sc_victor.Custom('signature_weapon')] stále vězí v její hrudi."
 single_combat.0041.desc.sc_attacker.blade_dance.fatality: "Úder za úderem získává má symfonie bolesti tvar na každém nervu postavy [sc_loser.GetFirstNameNoTooltip]. Z protivníkových výkřiků vytváří sborový zpěv doprovázený řinčením oceli o ocel.\n\nKdyž mi začne docházet inspirace, tanec ukončím a nechám protivníka klesnout na kolena. Krev z něj proudí natolik silně, že [sc_loser.GetFirstNameNoTooltip] sotva nalezne sílu ke mně vzhlédnout.\n\nZe zdvořilosti pohled opětuji a připravím [sc_victor.Custom('signature_weapon')] k závěrečnému tónu symfonie."
 single_combat.0041.desc.sc_attacker.wrath_of_highgod.fatality: "Než [sc_loser.GetFirstNameNoTooltip] dokáže využít mého zbožného okamžiku, vyrazím do útoku [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] a [sc_loser.Custom('SignatureWeaponBreaksVerbPresentParticiple')] protivníkovu [sc_loser.Custom('signature_weapon')].\n\nTento důkaz ochrany, kterou mi poskytuje [sc_victor.GetFaith.WarGodNamePossessive], připraví protivníka o řeč. Trvá to pouze vteřinu, ale právě tolik potřebuji, abych jej [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.desc.sc_attacker.hurt_me_better.fatality: "Když mě pohltí bojové vytržení, spustím příval útoků [sc_victor.Custom('SignatureWeaponAttemptedLightPlural')]. Bezchybně střídám nelítostné kryty s téměř smrtícími ranami a svou odolností vůči bolesti ničím veškeré výpočty postavy [sc_loser.GetFirstNameNoTooltip].\n\nZanedlouho zasadím smrtící úder, který v protivníkově boku vyhloubí strašlivou díru.\n\nDo minuty vykrvácí."
 single_combat.0041.desc.sc_attacker.special_fallback.fatality: "[sc_loser.GetFirstNameNoTooltip] zavrávorá právě na tak dlouho, abych koncem [sc_victor.Custom('SignatureWeaponEndType')] [sc_victor.Custom('signature_weapon')] zasáhl protivníka do tváře.\n\nZavrávorání se změní v pád a zbraň při něm odletí stranou. Omráčenou postavu [sc_loser.GetWomanMan] kopnutím obrátím na záda a jediným nelítostným úderem ji [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
 single_combat.0041.a: "Sbohem, [sc_loser.GetTitledFirstNameNoTooltip]."
 single_combat.0041.b: "Vítězství je mé!"
 single_combat.1004.t: "Je č-č-č-č-č-č-č-čas na souboj"
 single_combat.1004.desc: "Být [recipient.GetFirstName] teď musí stát za houby. Nebo tebou, hádám."
 single_combat.1004.a: "Jsi útočník, výchozí nastavení"
 single_combat.1004.b: "Jsi obránce, výchozí nastavení"
 single_combat.1004.c: "Jsi útočník, smrtící souboj"
 single_combat.1004.d: "Jsi obránce, smrtící souboj"
 single_combat.1004.e: "Jsi útočník, nesmrtící souboj"
 single_combat.1004.f: "Jsi obránce, nesmrtící souboj"
 single_combat.1004.g: "Vlastně nic"
 debug_log.single_combat_setup.attacker_and_defender_same_person: "Došlo k pokusu spustit souboj, v němž jsou útočník a obránce tatáž postava. Obsah, který souboj nastavuje, musí tuto možnost vyloučit, jinak může dojít k pádu hry. Scopy jsou zaznamenány v souboru debug.log pod označením „$debug_log.single_combat_setup.attacker_and_defender_same_person.notice$“."
 debug_log.single_combat_setup.attacker_and_defender_same_person.notice: "Souboj až příliš o samotě"
