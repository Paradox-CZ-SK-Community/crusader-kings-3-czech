 single_combat.0031.desc.opponent_response.enthusiastic_onslaught: "[sc_victor.GetFirstNameNoTooltip] vykřikne cosi nesrozumitelného a spustí sérii neobratných útoků [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')]"
 single_combat.0031.desc.opponent_response.hail_mary: "[sc_victor.GetFirstNameNoTooltip] si uvědomuje svou nevýhodu a zoufale se vrhne vpřed, připraven [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponKillTypeFirstPersonFuture')].\n\n"
