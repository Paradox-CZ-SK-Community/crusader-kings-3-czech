 single_combat.0031.desc.opponent_response.taunt: "[sc_victor.GetFirstNameNoTooltip] mě zasype řadou nesmírně osobních urážek, dokud"
 single_combat.0031.desc.opponent_response.put_the_boot_in: "[sc_victor.GetFirstNameNoTooltip] zasadí [sc_victor.Custom('signature_weapon')] prudký útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')] a vzápětí mě silně kopne do hrudi. Zavrávorám.\n\n"
 single_combat.0031.desc.opponent_response.strict_guard: "[sc_victor.GetFirstNameNoTooltip] postupuje vpřed a [sc_victor.Custom('signature_weapon')] vytváří neproniknutelnou bariéru, dokud jeden útok [sc_victor.Custom('SignatureWeaponAttemptedHeavy')]"
