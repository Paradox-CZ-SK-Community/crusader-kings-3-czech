 single_combat.result.tt.temporary_modifiers_removed: "Všechny dočasné bojové [Concept('character_modifiers','modifikátory postavy')|E] byly odstraněny"
 single_combat.result.tt.practice_no_wounds: "Protože šlo o umírněný souboj, nikdo z vás neutrpěl zranění"
 single_combat.0001.desc.injury_check.personal.very_unlikely: "\n\nMá forma je vynikající a téměř nechybím,"
 single_combat.0001.desc.injury_check.personal.unlikely: "\n\nMá forma je dobrá a dopouštím se jen drobných chyb,"
 single_combat.0001.desc.injury_check.personal.moderate: "\n\nMá forma je obstojná, přesto však občas zaváhám,"
 single_combat.0001.desc.injury_check.personal.likely: "\n\nMá forma se rychle rozpadá a nechávám v obraně mnoho využitelných mezer,"
 single_combat.0001.desc.injury_check.personal.very_likely: "\n\nMá forma je žalostná a můj další riskantní pohyb může znamenat porážku,"
 single_combat.0001.desc.injury_check.opponent.very_unlikely: "zatímco [my_foe.GetFirstNamePossessiveNoTooltip] postoj je neuvěřitelný."
 single_combat.0001.desc.injury_check.opponent.unlikely: "zatímco [my_foe.GetFirstNamePossessiveNoTooltip] postoj budí respekt."
 single_combat.0001.desc.injury_check.opponent.moderate: "zatímco [my_foe.GetFirstNamePossessiveNoTooltip] postoj je obstojný."
 single_combat.0001.desc.injury_check.opponent.likely: "zatímco [my_foe.GetFirstNamePossessiveNoTooltip] postoj začíná selhávat."
 single_combat.0001.desc.injury_check.opponent.very_likely: "zatímco [my_foe.GetFirstNamePossessiveNoTooltip] postoj je naprostá pohroma."
 single_combat.0001.desc.success_check.almost_impossible: "\n\nStále se mi nepodařilo ani trochu prolomit obranu protivníka a zatím nevidím žádnou cestu k vítězství."
 single_combat.0001.desc.success_check.very_unlikely: "\n\nProtivník se urputně brání a vítězství je stále v nedohlednu."
 single_combat.0001.desc.success_check.unlikely: "\n\nProtivník stále dobře odráží mé údery, ale zdá se, že [my_foe.GetSheHe|l] brzy zaváhá."
 single_combat.0001.desc.success_check.moderate: "\n\nNaše síly jsou vyrovnané a vítězství visí na vlásku."
 single_combat.0001.desc.success_check.likely: "\n\nZatlačuji protivníka do ústupu, ale vítězství ještě musím zpečetit."
 single_combat.0001.desc.success_check.very_likely: "\n\nProtivník se pod mými útoky potácí a vítězství je tak blízko, že je téměř cítím."
 single_combat.0001.desc.success_check.almost_certain: "\n\nOd vítězství mě nemůže dělit víc než jediný dobře mířený úder."
 single_combat.0001.wait_and_hope: "Možná když počkám, [my_foe.GetSheHe|l] zakopne o [my_foe.Custom('signature_weapon')]?"
 single_combat.0001.unsure_attack: "Ehm, braň se! Prostě #EMP zemři#!!"
 single_combat.0001.unsure_attack_non_fatal: "Ehm, braň se! Prostě se #EMP vzdej#!!"
 single_combat.0001.enthusiastic_onslaught.banned_house: "#EMP [myself.GetFullNameNoTooltip]!#!"
 single_combat.0001.enthusiastic_onslaught.own_house: "Jsi ostudou rodu [myself.GetHouse.GetNameNoTooltip]!"
 single_combat.0001.enthusiastic_onslaught.motto: "#EMP [myself.GetHouse.GetMotto]#!, špíno!"
 single_combat.0001.hail_mary: "Proti někomu tak schopnému nemám co ztratit!"
 single_combat.0001.pocket_sand: "Co takhle trochu #EMP [sc_defender.Custom('GritType')]#! přímo na [my_foe.Custom('EyeEyes')]? #EMP Hjá!#!"
 single_combat.0001.nut_em: "Tak schválně, jak se ti bude líbit rána do lebky!"
 single_combat.0001.guard: "Mou obranu nikdy neprorazíš, [my_foe.GetFirstNameNoTooltip]!"
 single_combat.0001.probing_attack: "Jednou přece musíš v obraně polevit, zbabělče!"
 single_combat.0001.onslaught: "Okus hněv [myself.GetFaith.WarGodName]!"
 single_combat.0001.surprise_attack: "[my_foe.GetSheHe|U] tohle nečeká!"
 single_combat.0001.taunt: "[my_foe.Custom2('InsultNoun', ROOT.Char)], to nic lepšího neumíš?"
 single_combat.0001.put_the_boot_in: "Jedna rána [myself.Custom('signature_weapon')] a kopanec do břicha!"
 single_combat.0001.strict_guard: "Lepší [my_foe.GetWomenMen|l] než ty zemřeli při pokusu prolomit mou obranu!"
 single_combat.0001.confident_attack: "Ukážu ti, jak #EMP já#! [myself.Custom('SignatureWeaponAction')] [myself.Custom('SignatureWeaponArticle')] [myself.Custom('signature_weapon')]!"
 single_combat.0001.expert_onslaught: "Útok! #EMP Kryt!#! #BER Riposta!#!"
 single_combat.0001.attempt_disarm: "Uvidíme, jak si povedeš, až [my_foe.Custom('signature_weapon')] skončí na zemi!"
 single_combat.0001.lightning_assault: "Zaútočit první a tvrdě! #EMP En garde!#!"
 single_combat.0001.tire_opponent: "To je všechno? Ani mě netrefíš!"
 single_combat.0001.reason_you_suck_speech: "Víš, v čem je tvůj problém, [my_foe.GetFirstNameNoTooltip]? Ne? Tak tedy..."
 single_combat.0001.technique_from_legend: "Tohle bude fungovat stejně jako v legendách, že ano?"
 single_combat.0001.like_a_viper: "Mezera v obraně! Ochutnej mou ocel, [my_foe.Custom2('InsultNoun', ROOT.Char)]!"
 single_combat.0001.pocket_silver: "Ochutnej stříbro, [my_foe.Custom2('InsultNoun', ROOT.Char)]!"
 single_combat.0001.martial_voice: "#EMP Červe!#! Myslíš, že se můžeš postavit #EMP mně#!?"
 single_combat.0001.mocking_boast: "#EMP Ty#! si myslíš, že porazíš někoho tak slavného, jako jsem #EMP já#!?"
 single_combat.0001.is_that_a_crocodile: "J-je to #EMP krokodýl#!?"
 single_combat.0001.desert_warrior: "Vedro ti nesvědčí, [my_foe.GetFirstNameNoTooltip]? Slabochu!"
 single_combat.0001.jungle_stalker: "Splývám se stíny džungle!"
 single_combat.0001.open_terrain_expert: "S tolika prostorem k pohybu nemáš šanci, [my_foe.GetFirstNameNoTooltip]!"
 single_combat.0001.rough_terrain_expert: "Kopce, močály, hory... to všechno je #EMP mé#! území!"
 single_combat.0001.forest_fighter: "Tohle jsou #EMP mé#! lesy, [my_foe.GetFirstNameNoTooltip]!"
 single_combat.0001.raaargh: "#BER RÁÁÁÁRGH!#!"
 single_combat.0001.hard_grit: "Ukážu ti, jak se bojuje #EMP profesionálně#!!"
 single_combat.0001.feint_and_stab: "#EMP Hlupáku!#! Tady máš!"
 single_combat.0001.butchery: "Zdá se, že z tebe musím udělat #EMP odstrašující příklad#!..."
 single_combat.0001.stoic_veteran.general: "V gardě jsme čelili horším nepřátelům, než jsi #EMP ty#!!"
 single_combat.0001.stoic_veteran.other_varangian: "Je škoda [my_foe.Custom('SignatureWeaponKillType')] někoho z věrné gardy, [my_foe.Custom('SisterBrother')]."
 single_combat.0001.blade_dance: "Jsem nejrychlejší čepel v [myself.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 single_combat.0001.blade_dance_unlanded: "Jsem nejrychlejší čepel [myself.GetCulture.GetCollectiveNounNoTooltip]!"
 single_combat.0001.wrath_of_highgod: "Ve jménu [myself.GetFaith.HighGodNameAlternate] a [myself.GetFaith.WarGodName] trp, rouhači!"
 single_combat.0001.hurt_me_better: "#EMP Mmmmm#!, myslíš, že #EMP tohle#! bolí? Ukážu ti, co je bolest!"
 single_combat.0001.special_fallback: "K zemi s tebou!"
 single_combat.0001.something_to_hide: "Snad nezapomínáš na svůj #EMP dluh#! vůči mně, [my_foe.GetFirstNameNoTooltip]?"
 single_combat.0001.tt.wait_and_hope: "#BOL Vyčkávat a doufat:#! zůstaneš nehybně stát a trpělivě čekáš, až [my_foe.GetFirstNameNoTooltip] udělá chybu"
 single_combat.0001.tt.unsure_attack: "#BOL Nejistý útok:#! neobratně se pokusíš zaútočit"
 single_combat.0001.tt.enthusiastic_onslaught: "#BOL Zbrklý nápor:#! bezhlavě se vrhneš vpřed a divoce kolem sebe mácháš"
 single_combat.0001.tt.hail_mary: "#BOL Sázka na zázrak:#! nezbývá než se pomodlit a vrhnout se do bezhlavého útoku"
 single_combat.0001.tt.pocket_sand: "#BOL Zastřený zrak:#! hodíš hrst [sc_defender.Custom('GritType')] přímo na [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('MaskFace')]"
 single_combat.0001.tt.nut_em: "#BOL Hlavička:#! pokusíš se proniknout za [my_foe.GetFirstNamePossessiveNoTooltip] kryt a vrazit [Select_CString( my_foe.IsFemale, 'jí', 'mu' )] hlavou do [my_foe.Custom('MaskFace')]"
 single_combat.0001.tt.guard: "#BOL Kryt:#! soustředíš se na obranu a držíš [my_foe.GetFirstNameNoTooltip] od těla"
 single_combat.0001.tt.probing_attack: "#BOL Zkušební útok:#! opatrně, ale důrazně útočíš na [my_foe.GetFirstNamePossessiveNoTooltip] kryt a zkoušíš jeho pevnost"
 single_combat.0001.tt.onslaught: "#BOL Nápor:#! zuřivým náporem nedáš [my_foe.GetFirstNameNoTooltip] vydechnout"
 single_combat.0001.tt.surprise_attack: "#BOL Útok znenadání:#! zaútočíš z nečekaného směru"
 single_combat.0001.tt.taunt: "#BOL Provokace:#! snažíš se vyprovokovat [my_foe.GetFirstNameNoTooltip], aby [Select_CString( my_foe.IsFemale, 'udělala', 'udělal' )] chybu"
 single_combat.0001.tt.put_the_boot_in: "#BOL Kopanec navrch:#! zasadíš těžký úder a nečekaným kopancem trefíš [my_foe.GetFirstNamePossessiveNoTooltip] podbřišek"
 single_combat.0001.tt.strict_guard: "#BOL Pevný kryt:#! zcela se soustředíš na obranu před útoky, které vede [my_foe.GetFirstNameNoTooltip]"
 single_combat.0001.tt.confident_attack: "#BOL Sebejistý útok:#! s rozvahou a obratností zasadíš sérii přesně mířených úderů"
 single_combat.0001.tt.expert_onslaught: "#BOL Mistrovský nápor:#! spustíš smršť rychlých útoků a protiútoků"
 single_combat.0001.tt.attempt_disarm: "#BOL Pokus o odzbrojení:#! mocným úderem narušíš [my_foe.GetFirstNamePossessiveNoTooltip] úchop a pokusíš se vyrazit zbraň"
 single_combat.0001.tt.lightning_assault: "#BOL Bleskový útok:#! hned na začátku souboje se pokusíš [my_foe.GetFirstNameNoTooltip] zahltit útoky"
 single_combat.0001.tt.tire_opponent: "#BOL Vyčerpání protivníka:#! šetříš síly a necháváš [my_foe.GetFirstNameNoTooltip], aby se [Select_CString( my_foe.IsFemale, 'sama vyčerpávala', 'sám vyčerpával' )]"
 single_combat.0001.tt.reason_you_suck_speech: "#BOL Zdeptávající řeč:#! spustíš zdrcující tirádu o tom, jak žalostný je [my_foe.GetFirstNamePossessiveNoTooltip] výkon"
 single_combat.0001.tt.technique_from_legend: "#BOL Legendární technika:#! pokusíš se napodobit slavný chvat ze své oblíbené knihy"
 single_combat.0001.tt.like_a_viper: "#BOL Jako zmije:#! bleskově udeříš ve chvíli, kdy [my_foe.GetFirstNamePossessiveNoTooltip] kryt na okamžik povolí"
 single_combat.0001.tt.pocket_silver: "#BOL Stříbrné mžitky:#! [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('MaskFace')] zasáhne těžký měšec se stříbrem"
 single_combat.0001.tt.martial_voice: "#BOL Velitelský hlas:#! pokusíš se zastrašit [my_foe.GetFirstNameNoTooltip] velitelským hlasem, jako by [Select_CString( my_foe.IsFemale, 'patřila', 'patřil' )] k tvým vojákům"
 single_combat.0001.tt.mocking_boast: "#BOL Posměšné vychloubání:#! vysmíváš se tomu, jak nízký je [my_foe.GetFirstNamePossessiveNoTooltip] [Concept('prestige_level','stupeň věhlasu')|E]"
 single_combat.0001.tt.is_that_a_crocodile: "#BOL Nečekaný spojenec:#! [my_foe.GetFirstNameNoTooltip] si nevšimne šupinatého netvora, který za [Select_CString( my_foe.IsFemale, 'ní', 'ním' )] vyrazí z vody a pokusí se [Select_CString( my_foe.IsFemale, 'ji', 'ho' )] stáhnout do vody"
 single_combat.0001.tt.terrain_expert: "#BOL Pán terénu:#! dokonalá znalost místního terénu ti dává výhodu"
 single_combat.0001.tt.desert_warrior: "$single_combat.0001.tt.terrain_expert$"
 single_combat.0001.tt.jungle_stalker: "$single_combat.0001.tt.terrain_expert$"
 single_combat.0001.tt.open_terrain_expert: "$single_combat.0001.tt.terrain_expert$"
 single_combat.0001.tt.rough_terrain_expert: "$single_combat.0001.tt.terrain_expert$"
 single_combat.0001.tt.forest_fighter: "$single_combat.0001.tt.terrain_expert$"
 single_combat.0001.tt.raaargh: "#BOL Berserkergang:#! rvi a trhej! RVI A TRHEJ! #BER RVI A TRHEJ!#!"
 single_combat.0001.tt.hard_grit: "#BOL Otrlost:#! zužitkuješ své zkušenosti a zasypeš protivníka sérií odhodlaných útoků"
 single_combat.0001.tt.feint_and_stab: "#BOL Klam a bodnutí:#! nalevo zaútočí [myself.Custom('signature_weapon')] jen naoko, zatímco dýkou v druhé ruce bodneš zprava"
 single_combat.0001.tt.butchery: "#BOL Řezničina:#! předvedeš své kruté nájezdnické umění"
 single_combat.0001.tt.stoic_veteran: "#BOL Stoický veterán:#! využiješ varjažské zkušenosti a [my_foe.GetFirstNameNoTooltip] musí čelit tvým mocným sekům"
 single_combat.0001.tt.blade_dance: "#BOL Tanec čepelí:#! okázalá série mistrovských pohybů zajistí, že se o tvém soubojovém umění bude mluvit ještě léta"
 single_combat.0001.tt.wrath_of_highgod: "#BOL Boží hněv:#! [myself.GetFaith.HighGodName] vyslechne tvou hlasitou modlitbu, zatímco se pokorně skláníš"
 single_combat.0001.tt.hurt_me_better: "#BOL Síla z bolesti:#! vychutnáváš si bolest a obracíš [my_foe.GetFirstNamePossessiveNoTooltip] nápor ve svou výhodu"
 single_combat.0001.tt.special_fallback: "#BOL Nepevný postoj:#! [my_foe.GetFirstNameNoTooltip] schytá kopanec do holeně"
 single_combat.0001.tt.something_to_hide: "#BOL Má co skrývat:#! připomeneš protivníkovi [Concept('hook','páku')|E], kterou na [Select_CString( my_foe.IsFemale, 'ni', 'něj' )] máš"
 single_combat.0001.desc.my_feedback.wait_and_hope.will_die: "Ztuhnu. Tady můžu zemřít. Jestli něco neudělám, #EMP zemřu#!. Nedokážu se přimět k pohybu. Jen se třesu a modlím, aby [my_foe.GetFirstNameNoTooltip] [Select_CString( my_foe.IsFemale, 'zakopla a upadla', 'zakopl a upadl' )] a poskytl se mi prostor k útoku."
 single_combat.0001.desc.my_feedback.wait_and_hope.will_live: "Vyčkávám na správný okamžik. Možná nejsem nejlepší bojovník, ale když dostane [my_foe.GetFirstNameNoTooltip] dostatek prostoru, třeba se o porážku postará bez mé pomoci."
 single_combat.0001.desc.my_feedback.unsure_attack: "Zkusím několik ledabylých útoků, samé [myself.Custom('SignatureWeaponAttemptedLightPlural')], přičemž se hlavně snažím neztratit [myself.Custom('signature_weapon')]. Žádný z nich se však k protivníkovi ani pořádně nepřiblíží."
 single_combat.0001.desc.my_feedback.enthusiastic_onslaught: "Mám [myself.Custom('SignatureWeaponArticle')] [myself.Custom('signature_weapon')], proti mně stojí nepřítel a já jsem odhodlán obojí za každou cenu seznámit. Divoké rozmáchávání, údery hřbetem i bezhlavé rány koncem zbraně, tedy [myself.Custom('SignatureWeaponEndType')]. Cokoli, čím protivníka ubiji."
 single_combat.0001.desc.my_feedback.hail_mary: "[myself.Custom('SignatureWeaponFlourishPresentParticiple')|U] [myself.Custom('signature_weapon')] se vrhám přímo na [my_foe.GetFirstNameNoTooltip]. Jestli mám zemřít, nedám svou kůži lacino. Mé zoufalé odhodlání nutí [my_foe.GetFirstNameNoTooltip] ustupovat."
 single_combat.0001.desc.my_feedback.pocket_sand: "Popadnu hrst [sc_defender.Custom('GritType')] a mrštím ji přímo na [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('MaskFace')]. [my_foe.GetFirstNameNoTooltip] se s prskáním potácí dozadu."
 single_combat.0001.desc.my_feedback.nut_em: "Na rozhodující okamžik odrazím [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('signature_weapon')], proniknu za kryt a s odporným křupnutím udeřím čelem do [Select_CString( my_foe.IsFemale, 'její', 'jeho' )] lebky."
 single_combat.0001.desc.my_feedback.guard: "Obratnými pohyby [myself.Custom('signature_weapon')] odrazím několik útoků a držím [my_foe.GetFirstNameNoTooltip] mimo dosah."
 single_combat.0001.desc.my_feedback.probing_attack: "Pečlivě si vybírám vhodné okamžiky a zasazuji několik rychlých úderů. [my_foe.GetFirstNameNoTooltip] pod nimi klopýtá ze strany na stranu a v obraně se postupně otevírají stále větší mezery."
 single_combat.0001.desc.my_feedback.onslaught: "Se [myself.Custom('signature_weapon')] v ruce zasypávám [my_foe.GetFirstNameNoTooltip] útoky, samými [myself.Custom('SignatureWeaponAttemptedLightPlural')], a mezi jednotlivými ranami nedopřávám ani okamžik oddechu."
 single_combat.0001.desc.my_feedback.surprise_attack: "Jakmile spatřím slabinu, vrhnu se na [my_foe.GetFirstNameNoTooltip], [myself.Custom('SignatureWeaponActionPresentParticiple')] [myself.Custom('signature_weapon')]. Jediný mohutný útok, [my_foe.Custom('SignatureWeaponAttemptedHeavy')], zažene protivníka zpět."
 single_combat.0001.desc.my_feedback.taunt: "„A navíc,“ křičím, „jsi [my_foe.Custom2('InsultAdjectiveArticle', ROOT.Char)] [my_foe.Custom2('InsultAdjective', ROOT.Char)] [my_foe.Custom2('InsultNoun', ROOT.Char)] a [my_foe.Custom2('PointOfRidicule', ROOT.Char)] je celé zemi k smíchu!“"
 single_combat.0001.desc.my_feedback.put_the_boot_in: "Útokem [myself.Custom('SignatureWeaponAttemptedHeavy')] vedeným [myself.Custom('signature_weapon')] pošlu [my_foe.GetFirstNameNoTooltip] vrávorat dozadu. Vzápětí vykročím vpřed a kopnu protivníka přímo do hrudi."
 single_combat.0001.desc.my_feedback.strict_guard: "[myself.Custom('signature_weapon')] mě chrání lépe než jakýkoli štít. Odráží, oplácí a zastavuje každý pohyb, o který se [my_foe.GetFirstNameNoTooltip] pokusí. Kamkoli zamíří [my_foe.Custom('signature_weapon')], má [myself.Custom('signature_weapon')] už čeká."
 single_combat.0001.desc.my_feedback.confident_attack: "[myself.Custom('signature_weapon')] obtéká [my_foe.GetFirstNameNoTooltip] jako voda. Každý úder plynule přechází v další a všechny přicházejí v dokonale načasovaném sledu."
 single_combat.0001.desc.my_feedback.expert_onslaught: "Vrhnu se do útoku a spustím smršť ran, samé [myself.Custom('SignatureWeaponAttemptedLightPlural')]. Tvrdě tlačím proti [my_foe.GetFirstNamePossessiveNoTooltip] krytu a každým dokonale načasovaným úderem protivníka vyčerpávám."
 single_combat.0001.desc.my_feedback.attempt_disarm: "Jediný kolosální útok, [myself.Custom('SignatureWeaponAttemptedHeavy')], vedený [myself.Custom('signature_weapon')] málem vyrve [my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('signature_weapon')] z rukou. [my_foe.GetFirstNameNoTooltip] se však #EMP na poslední chvíli#! vzpamatuje."
 single_combat.0001.desc.my_feedback.lightning_assault: "Do prvního úderu vložím veškerou sílu a vrhnu se přímo na [my_foe.GetFirstNameNoTooltip], [myself.Custom('SignatureWeaponActionPresentParticiple')] [myself.Custom('signature_weapon')] vysoko. Následuje mohutný útok, [myself.Custom('SignatureWeaponAttemptedHeavy')], po němž protivník zavrávorá."
 single_combat.0001.desc.my_feedback.tire_opponent: "Znovu a znovu ustupuji, uhýbám a proplétám se útoky, ale zůstávám lákavě blízko. Netrvá dlouho a [my_foe.GetFirstNameNoTooltip] začíná jevit známky vyčerpání."
 single_combat.0001.desc.my_feedback.reason_you_suck_speech: "Někdo by mě mohl považovat za šílence, když během útoku podrobně rozebírám každou chybu v životě postavy [my_foe.GetFirstNameNoTooltip]. Takoví lidé však neznají #EMP potěšení#! z posluchače, který nemůže odejít."
 single_combat.0001.desc.my_feedback.technique_from_legend: "Ve víru boje se ze všech sil snažím vybavit si staré legendy a [myself.Custom('signature_weapon')] [myself.Custom('SignatureWeaponAction')] stejně jako dávní hrdinové. Překvapenému protivníkovi zasadím alespoň jeden pořádný úder."
 single_combat.0001.desc.my_feedback.like_a_viper: "Veškerou silou prorazím [my_foe.GetFirstNamePossessiveNoTooltip] kryt a zaníceně udeřím [myself.Custom('signature_weapon')]. Mířím tak, abych [myself.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('my_foe'))]. Od krvavého vítězství mě dělí jen nepatrný kousek."
 single_combat.0001.desc.my_feedback.pocket_silver: "Od pasu utrhnu těžký měšec s mincemi a mrštím jej po [my_foe.GetFirstNameNoTooltip]. Zasáhne [my_foe.GetHerHim] přímo do [my_foe.Custom('MaskFace')] a poskytne mi krátkou příležitost k útoku [myself.Custom('SignatureWeaponAttemptedLight')] [myself.Custom('signature_weapon')]."
 single_combat.0001.desc.my_feedback.martial_voice: "Velení chátrám v bitvě spočívá hlavně v řevu a zastrašování. [my_foe.GetFirstNameNoTooltip] to názorně předvedu, když z plných plic spustím příval těch nejhorších nadávek."
 single_combat.0001.desc.my_feedback.mocking_boast: "Má slova tvrdě zasáhnou [my_foe.GetFirstNamePossessiveNoTooltip] sebevědomí. #EMP Každý#! zná mou slávu a prestiž, zatímco pověst mého protivníka vedle nich #EMP bledne#!."
 single_combat.0001.desc.my_feedback.is_that_a_crocodile: "Šelma s řevem vyrazí z vody přímo proti nám. Uskočím dozadu a nechám [my_foe.GetFirstNameNoTooltip], [myself.Custom('SignatureWeaponFlourishPresentParticiple')] na ni v panice [my_foe.Custom('signature_weapon')]. Než krokodýl ustoupí, už se protivníkovi blížím zezadu."
 single_combat.0001.desc.my_feedback.desert_warrior: "Bojovat v takovém žáru dokáže jen skutečně odolný [myself.GetWomanMan]. Z [my_foe.GetFirstNameNoTooltip] #EMP lije#! pot a dech je zcela přerývaný. Občasnými útoky, samými [myself.Custom('SignatureWeaponAttemptedLightPlural')], protivníka snadno vyčerpám."
 single_combat.0001.desc.my_feedback.jungle_stalker: "Husté porosty džungle pohyb přinejlepším zpomalují a přinejhorším zcela znemožňují. Do stínů přitom stačí jediný rychlý krok. Zatímco [my_foe.GetFirstNameNoTooltip] zápasí s okolím, já mizím a znovu se vynořuji s útokem [myself.Custom('SignatureWeaponAttemptedHeavy')]."
 single_combat.0001.desc.my_feedback.open_terrain_expert: "Na otevřeném prostranství kolem [my_foe.GetFirstNameNoTooltip] lehce kroužím. Před každým úderem bez námahy ustoupím o bezcenný kus půdy a po každém vlastním útoku se opět vzdálím."
 single_combat.0001.desc.my_feedback.rough_terrain_expert.rocky: "Skalnatá krajina, v níž bojujeme, je zrádná. Kdokoli z nás může zakopnout a zřítit se vstříc smrti a prudké strčení je tu stejně nebezpečné jako hrot meče. S velkým potěšením to znovu a znovu předvádím postavě [my_foe.GetFirstNameNoTooltip]."
 single_combat.0001.desc.my_feedback.rough_terrain_expert.boggy: "Bažiny jsou zrádné i za nejlepších okolností a tato není výjimkou. Zatím se mi nepodařilo shodit [my_foe.GetFirstNameNoTooltip] do brakické vody, ale několikrát k tomu bylo #EMP velmi#! blízko."
 single_combat.0001.desc.my_feedback.forest_fighter: "Les nabízí mnoho příležitostí, jak získat výhodu. Uskočím dozadu a mezi sebe a [my_foe.GetFirstNameNoTooltip] dostanu houštinu trní. Pak změním směr a zasadím zákeřný útok [myself.Custom('SignatureWeaponAttemptedLight')]."
 single_combat.0001.desc.my_feedback.raaargh: "S odletujícími slinami, [myself.Custom('signature_weapon')] v ruce a [myself.Custom('SignatureWeaponFlourishPresentParticiple')] jako šílenec se vrhám na protivníka. Mysl mi zahalí rudý opar a zbývá jen vztek, krev a slastné uvolnění."
 single_combat.0001.desc.my_feedback.hard_grit: "S nacvičenou lehkostí se vyhnu úderu postavy [my_foe.GetFirstNameNoTooltip], vkročím protivníkovi do pohybu a zvednu [myself.Custom('signature_weapon')] k útoku [myself.Custom('SignatureWeaponAttemptedHeavy')]. Pak rychle odskočím zpět do bezpečné vzdálenosti."
 single_combat.0001.desc.my_feedback.feint_and_stab: "[myself.Custom('signature_weapon')] naznačím útok [myself.Custom('SignatureWeaponAttemptedLight')] na jednu stranu. Jakmile se jej [my_foe.GetFirstNameNoTooltip] pokusí odrazit, druhou rukou tasím čerstvou dýku a bodnu přímo vpřed."
 single_combat.0001.desc.my_feedback.butchery: "Nespočítám, kolik lidí už jsem [myself.Custom('SignatureWeaponKillTypePastParticiple')] [myself.Custom('signature_weapon')]. Možná bude [my_foe.GetFirstName] další a možná ne, ale příval mých surových úderů jistě nutí protivníka o této možnosti přemýšlet."
 single_combat.0001.desc.my_feedback.stoic_veteran: "Varjažská garda netrpí nedbalost. Kdo chce vyniknout mezi císařovými tělesnými strážci, potřebuje bystrý zrak a pevnou paži. Každým úderem ukazuji postavě [my_foe.GetFirstNameNoTooltip], jak bojují Nositelé seker."
 single_combat.0001.desc.my_feedback.blade_dance: "V boji jsem umělec. Každý úder je tahem štětce a každý padlý nepřítel či výtrysk krve skvrnou barvy. [myself.Custom('signature_weapon')] střídám okázalé pohyby s údery a na protivníkovi maluji obraz utrpení."
 single_combat.0001.desc.my_feedback.wrath_of_highgod: "[myself.GetFaith.HighGodName] je moudrý a [myself.GetFaith.HighGodHerHis|l] hněv stojí na #EMP mé#! straně. Vykřikuji svou oddanost k nebesům, aby se [my_foe.GetFirstNameNoTooltip] třásl před mou vírou."
 single_combat.0001.desc.my_feedback.hurt_me_better: "Nic nerozproudí krev tak jako bodnutí sladké agonie a nikdo nerozumí bolesti tak jako já. Posílen zraněními se vrhám na [my_foe.GetFirstNameNoTooltip] a [myself.Custom('signature_weapon')] spouštím příval surových útoků, samé [myself.Custom('SignatureWeaponAttemptedLightPlural')]."
 single_combat.0001.desc.my_feedback.special_fallback: "Jakmile se naskytne příležitost, prudce kopnu [my_foe.GetFirstNameNoTooltip] přímo do holeně a málem protivníka ochromím."
 single_combat.0001.desc.my_feedback.something_to_hide: "[my_foe.GetFirstNameNoTooltip] se na okamžik zastaví. Pak jako by protivníkovi něco došlo a při vzpomínce na moc, kterou nad [my_foe.GetHerHim] mám, viditelně poklesne celé tělo."
 single_combat.0001.desc.opponent_response.wait_and_hope: "[my_foe.GetFirstNameNoTooltip] stojí bez hnutí a zřejmě doufá, že jednoduše odhodím [myself.Custom('signature_weapon')]."
 single_combat.0001.desc.opponent_response.unsure_attack: "[my_foe.GetFirstNameNoTooltip] se váhavě pokusí zasadit mi útok [myself.Custom('SignatureWeaponAttemptedLight')], ale ránu snadno odrazím."
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.banned_house: "„#EMP [my_foe.GetFullNameNoTooltip]!#!“ $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.own_house: "„Jsi ostudou rodu [my_foe.GetHouse.GetNameNoTooltip]!“ $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.motto: "„#EMP [my_foe.GetHouse.GetMotto]#!, špíno!“ $single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue$"
 single_combat.0001.desc.opponent_response.enthusiastic_onslaught.epilogue: "řve můj protivník a zuřivě [my_foe.Custom('SignatureWeaponFlourishPresentParticiple')] [my_foe.Custom('signature_weapon')] směrem ke mně, kolem mě i zcela mimo mě."
 single_combat.0001.desc.opponent_response.hail_mary: "[my_foe.GetFirstNameNoTooltip] si dobře uvědomuje naprostou převahu na mé straně, přesto se na mě vrhne celým tělem a se zoufalstvím odsouzence mě nutí ustupovat."
 single_combat.0001.desc.opponent_response.pocket_sand: "V jednu chvíli bojujeme a v další se ozve výkřik „#EMP Hjá!#!“. [myself.Custom('EyeEyes')] mě pálí, zrak se rozmazává a v ústech cítím mrštěnou [sc_defender.Custom('GritType')]."
 single_combat.0001.desc.opponent_response.nut_em: "[my_foe.GetFirstNameNoTooltip] vycítí příležitost, vyrazí vpřed a tvrdě mě udeří hlavou do [myself.Custom('MaskFace')]. Ztratím rovnováhu a zapotácím se dozadu."
 single_combat.0001.desc.opponent_response.guard: "[my_foe.GetFirstNameNoTooltip] zaujme obranný postoj a ze všech sil mě drží od těla. [my_foe.GetWomanMan|U] přitom upírá [my_foe.Custom('EyeEyes')] na každý můj pohyb."
 single_combat.0001.desc.opponent_response.probing_attack: "[my_foe.GetFirstNamePossessiveNoTooltip] odveta je pečlivě vypočítaná. Protivník čeká na přesný okamžik, kdy odpoví několika útoky [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] vedenými [my_foe.Custom('signature_weapon')]."
 single_combat.0001.desc.opponent_response.onslaught: "[my_foe.GetFirstNameNoTooltip] zakroutí krkem a začne zasypávat můj kryt údery. Nekonečný sled útoků [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')] mě svou neutuchající zuřivostí téměř zlomí."
 single_combat.0001.desc.opponent_response.surprise_attack: "[my_foe.GetFirstNameNoTooltip] náhle změní směr, vrhne se stranou a přejde do útoku [my_foe.Custom('SignatureWeaponAttemptedHeavy')], kterému se jen taktak vyhnu."
 single_combat.0001.desc.opponent_response.taunt: "[my_foe.GetFirstNameNoTooltip] skutečný boj zjevně nepovažuje za důležitý a raději pronáší řadu zraňujících osobních poznámek o mně, mé rodině a způsobu, jakým jím chřest."
 single_combat.0001.desc.opponent_response.put_the_boot_in: "[my_foe.GetFirstNameNoTooltip] vyrazí vpřed, útokem [my_foe.Custom('SignatureWeaponAttemptedLight')] mě zatlačí dozadu a vzápětí mě vysokým kopem zasáhne do hrudi. Málem se svalím."
 single_combat.0001.desc.opponent_response.strict_guard: "[my_foe.GetFirstNameNoTooltip] zaujme obranný postoj. [my_foe.Custom('signature_weapon')] mezi námi vytváří téměř neproniknutelnou stěnu dokonale provedených krytů."
 single_combat.0001.desc.opponent_response.confident_attack: "[my_foe.GetFirstNameNoTooltip] odpoví plynulou sérií útoků [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] a [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')]. Každý úder mě zatlačí o něco dál."
 single_combat.0001.desc.opponent_response.expert_onslaught: "[my_foe.GetFirstNameNoTooltip] odpoví prudkým přívalem útoků [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] a znovu a znovu mě málem [my_foe.Custom('SignatureWeaponKillTypeFirstPersonPresentParticiple')]."
 single_combat.0001.desc.opponent_response.attempt_disarm: "[my_foe.GetFirstNameNoTooltip] s překvapivou rychlostí zasadí [my_foe.Custom('signature_weapon')] útok [my_foe.Custom('SignatureWeaponAttemptedHeavy')] a málem mi vyrazí [myself.Custom('signature_weapon')] z rukou."
 single_combat.0001.desc.opponent_response.lightning_assault: "[my_foe.GetFirstNameNoTooltip] neztrácí čas a přivítá mě prudkou sérií útoků [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')], které mě krok za krokem tlačí dozadu."
 single_combat.0001.desc.opponent_response.tire_opponent: "[my_foe.GetFirstNameNoTooltip] ustupuje před každým mým úderem a nechává mě útočit, aniž bych znovu pořádně zasáhl. Brzy začínám pociťovat únavu."
 single_combat.0001.desc.opponent_response.reason_you_suck_speech: "[my_foe.GetFirstNameNoTooltip] se mě snaží ponížit tím, že pokaždé ustoupí, jakmile se přiblížím, a přitom podrobně rozebírá všechny mé nedostatky. #EMP Velmi dobře#! ví, že takové urážky nedokážu ignorovat."
 single_combat.0001.desc.opponent_response.technique_from_legend: "[my_foe.GetFirstNameNoTooltip] podivně povědomým způsobem [my_foe.Custom('SignatureWeaponActionThirdPerson')] [my_foe.GetHerHis|l] [my_foe.Custom('signature_weapon')] a poté provede téměř dokonalý útok [my_foe.Custom('SignatureWeaponAttemptedHeavy')]. Přísahal bych, že už jsem jej někde viděl."
 single_combat.0001.desc.opponent_response.like_a_viper: "Než se vzpamatuji, [my_foe.GetFirstNameNoTooltip] se nějak dostane #EMP dovnitř#! mého krytu a [my_foe.Custom('signature_weapon')] míří přímo k mému srdci. Dozadu uskočím jen o vlásek včas."
 single_combat.0001.desc.opponent_response.pocket_silver: "[my_foe.GetFirstNameNoTooltip] zničehonic mrští těžký měšec přímo na můj [myself.Custom('MaskFace')]. Ozve se #EMP křupnutí#! a než se vzpamatuji, protivník už proti mně využívá získanou výhodu."
 single_combat.0001.desc.opponent_response.martial_voice: "[my_foe.GetFirstNamePossessiveNoTooltip] [my_foe.Custom('signature_weapon')] líně sklouzne do obranné polohy a [my_foe.GetSheHe|l] na mě začne křičet tónem určeným neposlušnému nevolníkovi, nikoli postavě s titulem [myself.GetTitleAsNameNoTooltip]."
 single_combat.0001.desc.opponent_response.mocking_boast: "[my_foe.GetFirstNameNoTooltip] ustoupí a vytvoří krátkou přestávku. Dočasné ticho vyplní vychloubání vlastní slávou a útoky na mou hodnotu, které mě přivádějí k zuřivosti."
 single_combat.0001.desc.opponent_response.is_that_a_crocodile: "Nečekané plazí syčení odhalí rozzuřeného krokodýla, který právě vyrazil z nedalekého toku. Odeženu jej až několika útoky [my_foe.Custom('SignatureWeaponAttemptedHeavyPlural')]."
 single_combat.0001.desc.opponent_response.desert_warrior: "Zatímco mě boj v tomto vedru vyčerpává, [my_foe.GetFirstNameNoTooltip] zůstává svěží a pohyblivý a spokojí se jen s občasným útokem [my_foe.Custom('SignatureWeaponAttemptedLight')]."
 single_combat.0001.desc.opponent_response.jungle_stalker: "[my_foe.GetFirstNameNoTooltip] je nepolapitelný protivník. Mizí před mými útoky a hustým podrostem se pohybuje s lehkostí, které se nedokážu ani přiblížit."
 single_combat.0001.desc.opponent_response.open_terrain_expert: "[my_foe.GetFirstNameNoTooltip] výborně využívá otevřeného prostranství, zasadí několik útoků [my_foe.Custom('SignatureWeaponAttemptedLightPlural')] a poté ustoupí do volného prostoru."
 single_combat.0001.desc.opponent_response.rough_terrain_expert.rocky: "[my_foe.GetFirstNameNoTooltip] umí dokonale bojovat na skalnatých svazích a okamžitě obsadí vyvýšenou pozici. Díky této výhodě mě [my_foe.GetSheHe|l] #EMP málem#! připraví o několik končetin."
 single_combat.0001.desc.opponent_response.rough_terrain_expert.boggy: "[my_foe.GetFirstNameNoTooltip] je na boj v bažinaté krajině zvyklý lépe než já a znovu a znovu se mě pokouší zatlačit do brakické vody. Několikrát se mu to téměř podaří."
 single_combat.0001.desc.opponent_response.forest_fighter: "[my_foe.GetWomanMan|U] jménem [my_foe.GetFirstNameNoTooltip] se v lese vyzná a bez potíží prochází trním i křovím. Mně nezbývá než se těmito nástrahami prodírat za [my_foe.GetHerHim]."
 single_combat.0001.desc.opponent_response.raaargh: "[my_foe.GetFirstNameNoTooltip] se na okamžik celý rozechvěje a pak vybuchne vzteky. Řve tak hlasitě, až se otřásá země, a vrhá se na mě s neobyčejnou #EMP zuřivostí#!."
 single_combat.0001.desc.opponent_response.hard_grit: "[my_foe.GetFirstNameNoTooltip] je znepokojivě schopný bojovník. Znovu a znovu uhýbá i dobře mířeným úderům nebo je odráží a vzápětí je obrací proti mně."
 single_combat.0001.desc.opponent_response.feint_and_stab: "[my_foe.GetFirstNameNoTooltip] se [my_foe.GetHerHis|l] [my_foe.Custom('signature_weapon')] pokusí naznačit útok zleva, ale druhou rukou tasí ukrytou dýku a bodne mi po srdci."
 single_combat.0001.desc.opponent_response.butchery: "Na [my_foe.GetFirstNamePossessiveNoTooltip] rtech se objeví krutý úsměv. Než stačím upravit kryt, téměř se hroutím pod surovým přívalem útoků [my_foe.Custom('SignatureWeaponAttemptedLightPlural')]."
 single_combat.0001.desc.opponent_response.stoic_veteran: "Služba ve Varjažské gardě učinila z [my_foe.GetFirstNameNoTooltip] stoického, brutálního a smrtícího bojovníka s [my_foe.Custom('SignatureWeaponArticle')] [my_foe.Custom('signature_weapon')]. Jeden útok [my_foe.Custom('SignatureWeaponAttemptedHeavy')] za druhým míří na můj trup."
 single_combat.0001.desc.opponent_response.blade_dance: "[my_foe.GetFirstNameNoTooltip] proslul schopnostmi s [my_foe.Custom('SignatureWeaponArticle')] [my_foe.Custom('signature_weapon')] a nyní mi je připomíná dokonale plynulým sledem útoků [my_foe.Custom('SignatureWeaponAttemptedLightPlural')], které občas přeruší děsivý útok [my_foe.Custom('SignatureWeaponAttemptedHeavy')]."
 single_combat.0001.desc.opponent_response.wrath_of_highgod: "„Ve jménu [my_foe.GetFaith.HighGodNameAlternate] a [my_foe.GetFaith.WarGodName] trp, rouhači!“ ječí [my_foe.GetFirstNameNoTooltip], [my_foe.Custom('SignatureWeaponActionPresentParticiple')] [my_foe.GetHerHis|l] [my_foe.Custom('signature_weapon')] k nebesům."
 single_combat.0001.desc.opponent_response.hurt_me_better: "Z [my_foe.GetFirstNamePossessiveNoTooltip] hlavy stéká pramínek krve. Když dosáhne horního rtu, [my_foe.GetSheHe|l] jej s ďábelským úsměvem slízne."
 single_combat.0001.desc.opponent_response.special_fallback: "[my_foe.GetFirstNameNoTooltip] nečekaně vyšvihne prudký kop proti mé holeni a na okamžik mě téměř ochromí."
 single_combat.0001.desc.opponent_response.something_to_hide: "„Snad jsi nezapomněl na svůj #EMP dluh#! vůči mně, [myself.GetFirstNameNoTooltip]?“ usmívá se [my_foe.GetFirstNameNoTooltip]. Jakmile pochopím, o čem mluví, svěsím ramena."
 single_combat.0031.desc.sc_defender.wait_and_hope: "Vyčkávání, až protivník zaútočí první, mi nijak nepomůže a pouze mu poskytne výhodu."
 single_combat.0031.desc.sc_defender.unsure_attack: "Mé chabé útoky nevedou vůbec k ničemu."
 single_combat.0031.desc.sc_defender.enthusiastic_onslaught: "Mé divoké [sc_loser.Custom('SignatureWeaponFlourishPresentParticiple')] je k ničemu a pouze mě vyčerpává."
 single_combat.0031.desc.sc_defender.hail_mary: "Můj zoufalý útok všemi silami zcela selže."
 single_combat.0031.desc.sc_defender.pocket_sand: "Protivník se bez námahy vyhne hrsti [sc_defender.Custom('GritType')], kterou po něm mrštím."
 single_combat.0031.desc.sc_defender.nut_em: "Nezdařenou hlavičkou poskytnu protivníkovi obrovskou příležitost."
 single_combat.0031.desc.sc_defender.guard: "Protivník si násilím prorazí cestu skrz můj kryt."
 single_combat.0031.desc.sc_defender.probing_attack: "Protivník mé pečlivě načasované údery snadno odráží."
 single_combat.0031.desc.sc_defender.onslaught: "Ani mé [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] nic nezmohou."
 single_combat.0031.desc.sc_defender.surprise_attack: "Protivník můj překvapivý útok prohlédne."
 single_combat.0031.desc.sc_defender.taunt: "Mé posměšky zůstávají bez odezvy."
 single_combat.0031.desc.sc_defender.put_the_boot_in: "První [sc_loser.Custom('SignatureWeaponAttemptedHeavy')] zasáhne, ale následný kop mě vyvede z rovnováhy."
 single_combat.0031.desc.sc_defender.strict_guard: "Navzdory veškeré snaze protivník můj kryt rozbije."
 single_combat.0031.desc.sc_defender.confident_attack: "Protivník mé údery tvrdě odráží."
 single_combat.0031.desc.sc_defender.expert_onslaught: "Ani mé nejlepší [sc_loser.Custom('SignatureWeaponAttemptedHeavyPlural')] nemají žádný účinek."
 single_combat.0031.desc.sc_defender.attempt_disarm: "Při pokusu o odzbrojení málem vyrazím do vzduchu #EMP vlastní#! [sc_loser.Custom('signature_weapon')]."
 single_combat.0031.desc.sc_defender.tire_opponent: "Můj pokus vylákat protivníka k útoku selže, protože mé okázalé úskoky zcela ignoruje."
 single_combat.0031.desc.sc_defender.reason_you_suck_speech: "Protivník zatne zuby a mou řeč ignoruje."
 single_combat.0031.desc.sc_defender.technique_from_legend: "Hrdinské činy z legend jsou ve skutečnosti obtížné a mně se nepodaří téměř nic."
 single_combat.0031.desc.sc_defender.like_a_viper: "Vyrazím k domnělé mezeře v obraně, ale zasáhnu jen prázdný vzduch."
 single_combat.0031.desc.sc_defender.pocket_silver: "Protivník se bez námahy a beze stopy pobavení vyhne mému měšci."
 single_combat.0031.desc.sc_defender.martial_voice: "Můj pokus protivníka zastrašit okamžitě ztroskotá."
 single_combat.0031.desc.sc_defender.mocking_boast: "Mé vychloubání zůstane bez odezvy a protivník si z mých posměšků nic nedělá."
 single_combat.0031.desc.sc_defender.is_that_a_crocodile: "Krokodýl se v polovině výpadu zastaví a svůj útok si rozmyslí."
 single_combat.0031.desc.sc_defender.desert_warrior: "Přestože z protivníka lije pot, únava na něm není znát."
 single_combat.0031.desc.sc_defender.jungle_stalker: "V džungli se obvykle bojuje obtížně, ale protivník se nevzdává."
 single_combat.0031.desc.sc_defender.open_terrain_expert: "Ani veškerý prostor kolem mě nestačí na neúnavného protivníka."
 single_combat.0031.desc.sc_defender.rough_terrain_expert: "Navzdory nehostinnému okolí protivník drží krok s mými útoky."
 single_combat.0031.desc.sc_defender.forest_fighter: "Ne každý umí bojovat v lese, ale protivník mi oplácí ránu za ranou."
 single_combat.0031.desc.sc_defender.raaargh: "Můj záchvat zuřivosti náhle ochabne a zanechá mě téměř bezvládného. Protivník neutrpěl újmu, zatímco já sotva popadám dech."
 single_combat.0031.desc.sc_defender.hard_grit: "Přes všechny mé zkušenosti protivník zmaří každý můj úder."
 single_combat.0031.desc.sc_defender.feint_and_stab: "Protivník můj klamný útok prohlédne a následné bodnutí dýkou přijde vniveč."
 single_combat.0031.desc.sc_defender.butchery: "Možná jsem zkušený řezník, ale tady mi to není nic platné."
 single_combat.0031.desc.sc_defender.stoic_veteran: "Ať už jsem se v Miklagarðru naučil cokoli, nestačí to. Protivník mé útoky jeden po druhém odráží."
 single_combat.0031.desc.sc_defender.blade_dance: "Mé okázalé výpady jsou chybou a protivník každý z nich pohotově odrazí."
 single_combat.0031.desc.sc_defender.wrath_of_highgod: "Hlasitou modlitbou pouze poskytnu protivníkovi příležitost."
 single_combat.0031.desc.sc_defender.hurt_me_better: "Bolest mi bývala spojencem, ale dnes mě opouští."
 single_combat.0031.desc.sc_defender.special_fallback: "Protivník před mým kopem bez potíží ustoupí."
 single_combat.0031.desc.sc_defender.something_to_hide: "Protivník mé skryté výhrůžky buď neslyší, nebo mu na nich nezáleží."
