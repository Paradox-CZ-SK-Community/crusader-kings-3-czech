 cycle_history_key_rise_of_the_qin: "Území někdejších Sedmi válčících států sjednocuje dynastie Čchin, první skutečně císařská dynastie"
 cycle_history_key_collapse_of_the_qin: "Dynastie Čchin, sužovaná vnitřními povstáními, se záhy rozpadá na osmnáct soupeřících království"
 cycle_history_key_rise_of_the_han: "Vítězství dynastie Chan nad jejími soupeři obnovuje v zemi pořádek"
 cycle_history_key_yellow_turban_rebellion: "Nespokojený lid, inspirovaný revolučním proroctvím, povstává proti dynastii Chan, čímž začínají desetiletí vnitřních svárů"
 cycle_history_key_three_kingdoms_period: "Vynucenou abdikací posledního císaře dynastie Chan oficiálně začíná období rozdělení mezi tři říše Wej, Šu a Wu"
 cycle_history_key_rise_of_the_jin: "Období Tří říší ukončuje regent říše Wej, který přiměje císaře k abdikaci a zakládá dynastii Ťin"
 cycle_history_key_war_of_the_eight_princes: "Vládu císaře Chueje z dynastie Ťin provázejí časté sváry, neboť knížata císařského rodu válčí o kontrolu nad císařem"
 cycle_history_key_sixteen_kingdoms: "Vznik odtrženého království v S'-čchuanu předznamenává rozpad severu na roztříštěné soupeřící státy"
 cycle_history_key_northern_southern_dynasties: "Chaos období Šestnácti království postupně ustupuje upevněnějším Severním a jižním dynastiím, ačkoli sjednocení zůstává pouhým snem"
 cycle_history_key_rise_of_the_sui: "Po smrti nestabilního císaře Süana ze Severní Čou se moci zmocňuje jeho tchán a zakládá dynastii Suej"
 cycle_history_key_decline_of_the_sui: "Nákladné stavební projekty a neúspěšná vojenská tažení srážejí dynastii Suej na kolena; císař je zavražděn a na jeho místo je dosazeno dítě"
 cycle_history_key_rise_of_the_tang: "Císařský regent přiměje dětského císaře dynastie Suej k abdikaci a nastupuje na trůn jako první císař dynastie Tchang"
 cycle_history_key_an_lushan_rebellion: "Generál An Lu-šan vede neúspěšné povstání proti dynastii Tchang, které má katastrofální následky pro miliony lidí"
 cycle_history_key_collapse_of_the_tang: "Vražda posledního císaře dynastie Tchang znamená její konec a více než tucet vojevůdců soupeří o uznání za jejího nástupce"
 cycle_history_key_rise_of_the_song: "Geniální vojevůdce sjednocuje válčící království a jako zakladatel dynastie Sung zahajuje novou éru míru a prosperity"
 cycle_history_key_sack_of_kaifeng_by_jin: "Dynastie Sung utrpí těžkou porážku, když džürčenská dynastie Ťin vyplení císařské hlavní město Kchaj-feng a zajme samotného císaře"
