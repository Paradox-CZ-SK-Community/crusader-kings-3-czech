 guelph_ghibelline_participant_group_ghibelline_leader_desc_prelude: "Vůdce [Concept('ghibellines','ghibellini')|E] v rámci [Concept('situation','situace')|E] [GetSituation('guelph_ghibelline').GetName].\n\nBěhem [Concept('situation_phase','fáze situace')|E] přípravného období [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] a [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] vede [ghibellines|E] vládce [GetTitleByKey('e_hre').GetName] a konflikt se vyvíjí podle historických událostí. Vlastní [Concept('decisions','rozhodnutí')|E] vůdce budou k dispozici, až přípravné období přejde v otevřený konflikt.$gg_leader_group_help$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
