 situation_guelph_ghibelline_phase_dictatus_papae_desc_short: "Tato [Concept('situation_phase','fáze situace')|E] situace [GetSituation('guelph_ghibelline').GetName] představuje vyhrocení předchozí fáze [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName].\n\nVztahy mezi panovníky a jejich církevními vazaly se nyní vyostřují, protože vazalové jsou rozpolceni mezi $religiousheadname_pope$, který si činí nárok na univerzální moc, a svými lenními pány, kteří chtějí zachovat svou svrchovanost.\n\n$precursor_situation_leader_help$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
