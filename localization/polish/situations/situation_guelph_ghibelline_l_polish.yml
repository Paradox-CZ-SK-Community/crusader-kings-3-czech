 guelph_ghibelline_participant_group_guelph_leader_desc_prelude: "Vůdce [Concept('guelphs','guelfové')|E] v rámci [Concept('situation','situace')|E] [GetSituation('guelph_ghibelline').GetName].\n\nBěhem [Concept('situation_phase','fáze situace')|E] přípravného období [GetSituationType('guelph_ghibelline').GetPhaseType('in_nomine_domini').GetName] a [GetSituationType('guelph_ghibelline').GetPhaseType('dictatus_papae').GetName] vede [Concept('guelphs','guelfů')|E] $religiousheadname_pope$ a konflikt se vyvíjí podle historických událostí. Vlastní [Concept('decisions','rozhodnutí')|E] vůdce budou k dispozici, až přípravné období přejde v otevřený konflikt.$gg_leader_group_help$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 guelph_ghibelline_participant_group_guelph_leader_desc_main: "Vůdce [Concept('guelphs','guelfové')|E] v rámci [Concept('situation','situace')|E] [GetSituation('guelph_ghibelline').GetName].\n\nTento vůdce může konflikt ovlivňovat jedinečnými [Concept('decisions','rozhodnutí')|E]:\n$BULLET_WITH_TAB$#V $guelph_ghibelline_peace_decision$#! a #V $guelph_ghibelline_conflict_decision$#! přesouvají [Concept('situation','situace')|E] mezi klidnějšími a konfliktnějšími [Concept('situation_phase','fáze situace')|E]\n$BULLET_WITH_TAB$#V $guelph_victory_decision$#! ukončí situaci ve prospěch [Concept('guelphs','guelfů')|E], pokud mají převahu\n$BULLET_WITH_TAB$Rozhodnutí odstoupit a předat vedení vhodnému přívrženci$gg_leader_group_help$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
