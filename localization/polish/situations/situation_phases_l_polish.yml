l_polish:
 situation_steppe_abundant_grazing_season: "Bohatá pastva"
 situation_steppe_abundant_grazing_season_desc: "$situation_steppe_abundant_grazing_season$ je období, kdy pastviny poskytují dostatek obživy a dobytek se může volně pást."
 situation_steppe_severe_drought_season: "Kruté sucho"
 situation_steppe_severe_drought_season_desc: "$situation_steppe_severe_drought_season$ způsobuje vysychání pastvin a úbytek zásob krmiva.\n\n#weak V tomto období dochází častěji k válkám.#!"
 situation_steppe_white_zud_season: "Bílý dzud"
 situation_steppe_white_zud_season_desc: "Během období $situation_steppe_white_zud_season$ pokryje pastviny sníh, jehož vrstva může dosahovat výšky několika stop. Dobytek se nedostane k trávě, a proto hyne hladem.#weak $situation_steppe_zud_effect$#!"
 situation_steppe_zud_effect: "\n\nBěhem dzudu jsou kočovníci nuceni v zájmu přežití přísahat věrnost mocnějším vládcům."
 situation_steppe_cold_zud_season: "Mrazivý dzud"
 situation_steppe_cold_zud_season_desc: "$situation_steppe_cold_zud_season$ přináší silný vítr a sněhové bouře. Kvůli mimořádně nízkým teplotám musí dobytek vynakládat většinu energie na udržení tepla a nemůže se pást.#weak $situation_steppe_zud_effect$#!"
 situation_steppe_warm_nights_season: "Věčné léto"
 situation_steppe_warm_nights_season_desc: "$situation_steppe_warm_nights_season$ je obdobím radosti a hojnosti. Teploty jsou pro dobytek ideální a příznivé podmínky umožňují trávě snadno znovu dorůstat."
 situation_steppe_sky_blessing_season: "Požehnání Modrého nebe"
 situation_steppe_sky_blessing_season_desc: "Jen jednou za život může mít člověk to štěstí, že spatří $situation_steppe_sky_blessing_season$. Je to čas, kdy nikdo nepozná nedostatek a země vzkvétá."
 situation_steppe_havsarsan_zud_season: "Chavsarsan dzud"
 situation_steppe_havsarsan_zud_season_desc: "$situation_steppe_havsarsan_zud_season$ je spojením dvou či více druhů dzudu. Trávu pokrývá led a sníh, krajinou se ženou bouře, třeskutý mráz brání zvířatům i v pohybu a tráva je mrtvá.\n\n#weak Během období $situation_steppe_havsarsan_zud_season$ nezbývá než odejít.#!"
 the_great_steppe_situation_steppe_abundant_grazing_season_situation_phase: "$situation_steppe_abundant_grazing_season$"
 the_great_steppe_situation_steppe_severe_drought_season_situation_phase: "$situation_steppe_severe_drought_season$"
