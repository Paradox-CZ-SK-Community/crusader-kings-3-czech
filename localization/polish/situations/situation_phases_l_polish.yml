l_polish:
 situation_steppe_abundant_grazing_season: "Hojná pastva"
 situation_steppe_abundant_grazing_season_desc: "$situation_steppe_abundant_grazing_season$ je období, kdy jsou pastviny spolehlivé a dobytek se může volně pásnout."
 situation_steppe_severe_drought_season: "Těžké sucho"
 situation_steppe_severe_drought_season_desc: "$situation_steppe_severe_drought_season$ způsobuje vysychání pastvin a úbytek zásob krmiva.\n\n#weak Během této doby je válčení častější.#!"
 situation_steppe_white_zud_season: "Bílý zud"
 situation_steppe_white_zud_season_desc: "V době $situation_steppe_white_zud_season$ se sníh usazuje na pastevních polích a pokrývá je vrstvou, která může být i několik stop hluboká. Dobytek nedosáhne na trávu a hynou tak hlady.#weak $situation_steppe_zud_effect$#!" # todo: RETRANSLATED ENGLISH
 situation_steppe_zud_effect: "\n\nBěhem zudu jsou nomádi nuceni přisáhnout věrnost silnějším vládcům, aby přežili."
 situation_steppe_cold_zud_season: "Chladný zud"
 situation_steppe_cold_zud_season_desc: "Během $situation_steppe_cold_zud_season$ přicházejí silné větry a sněhové bouře. Extrémně nízké teploty nutí dobytek vynakládat většinu své energie na udržení tepla, a nemohou tak spásat.#weak $situation_steppe_zud_effect$#!" # todo: RETRANSLATED ENGLISH
 situation_steppe_warm_nights_season: "Nekonečné léto"
 situation_steppe_warm_nights_season_desc: "Období $situation_steppe_warm_nights_season$ je čas radosti a hojnosti. Teploty jsou ideální pro dobytek a podmínky umožňují trávě se snadno obnovovat." # todo: RETRANSLATED ENGLISH
 situation_steppe_sky_blessing_season: "Požehnání modré oblohy"
 situation_steppe_sky_blessing_season_desc: "Jednou za život se může člověku poštěstit být svědkem $situation_steppe_sky_blessing_season$. Čas, kdy nedostatek není znám a země vzkvétá." # todo: RETRANSLATED ENGLISH
 situation_steppe_havsarsan_zud_season: "Havsarsan Zud"
 situation_steppe_havsarsan_zud_season_desc: "Období $situation_steppe_havsarsan_zud_season$ je kombinací dvou nebo více typů zud. Tráva je pokrytá ledem a sněhem, bouře pustoší krajinu, mrazivé teploty brání zvířatům i v pohybu a tráva je mrtvá.\n\n#weak Během $situation_steppe_havsarsan_zud_season$ je jediná cesta ven.#!" # todo: RETRANSLATED ENGLISH
 the_great_steppe_situation_steppe_abundant_grazing_season_situation_phase: "$situation_steppe_abundant_grazing_season$"
