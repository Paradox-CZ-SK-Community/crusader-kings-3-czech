l_polish:
 the_great_steppe_sub_region_steppe_west: "Západní step"
 the_great_steppe_sub_region_steppe_west_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Západní stepi jsou místem, kde se step setkává s velkými řekami Donem, Dněprem, Dněstrem a Volhou. V průběhu dějin sloužily jako výchozí bod mnoha kočovných vpádů do usedlých zemí Evropy.#!"
 the_great_steppe_sub_region_steppe_central: "Centrální step"
 the_great_steppe_sub_region_steppe_central_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Centrální stepi se rozkládají mezi Uralem na západě, Altajem na východě a Chorásánem na jihu. Po celé věky jimi kočovníci putovali na západ i na východ, aby dosáhli velkých říší na obou okrajích stepi.#!"
 the_great_steppe_sub_region_steppe_east: "Východní step"
 the_great_steppe_sub_region_steppe_east_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak Na východ od Altaje a severně od pouště Gobi leží východní stepi. Tyto nesmírné pláně plodí silné válečníky, kteří se nakonec vydávají na západ nebo usilují o bohatství svých jihovýchodních sousedů.#!"
 SITUATION_SUB_REGION_TOOLTIP_DESC: "Tato [Concept('situation_sub_region','oblast situace')|El] náleží k situaci [SituationSubRegion.GetSituation.GetName]\n\nAktuální fáze: [SituationSubRegion.GetCurrentPhase.GetName|V]"
 