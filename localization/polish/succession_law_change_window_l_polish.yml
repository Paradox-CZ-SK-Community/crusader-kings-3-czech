 SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_VASSALS_DESC: "Ke změně #bold jakéhokoli#! [Concept('succession_law','zákona nástupnictví')|E] je nutný souhlas všech mocných vazalů"
 SUCCESSION_LAW_CHANGE_WINDOW_CHANGE: "Změnit zákon"
 SUCCESSION_LAW_CHANGE_WINDOW_CHOOSE_NEW: "Dostupné možnosti: [SuccessionLawChangeWindow.AccessLawGroup.GetLawGroup.GetName]"
 SUCCESSION_LAW_CHANGE_WINDOW_PARTITION_LAWS: "Více [Concept('realm_heirs','dědiců panství')|E]"
 SUCCESSION_LAW_CHANGE_WINDOW_APPOINTMENT_LAWS: "Nástupnictví jmenováním"
 SUCCESSION_LAW_CHANGE_WINDOW_SINGLE_HEIR_LAWS: "Jediný [Concept('realm_heir','dědic panství')|E]"
 SUCCESSION_LAW_CHANGE_WINDOW_ENACT_COST: "Cena: [SuccessionLawChangeWindow.GetSelectedLaw.GetShortCostString]"
 SUCCESSION_LAW_CHANGE_WINDOW_ENACT_COST_TOOLTIP: "#T Cena#!\n [SuccessionLawChangeWindow.GetSelectedLaw.GetCostDescription]"
 SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_APPROVE: "#weak Souhlasí#!"
 SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_OPPOSE: "#X Nesouhlasí#!"
 SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_APPROVE_TT: "#T Souhlasí se změnou zákona nástupnictví#!\n[Character.GetShortUIName] podporuje každou změnu [Concept('succession_law','zákona nástupnictví')|E], nebo jí alespoň nemůže odporovat.\n\nSouhlas je dán alespoň jedním z těchto důvodů:\n$BULLET_WITH_TAB$Má o tobě kladné [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Pociťuje vůči tobě [Concept('cowed','bázeň')|E]\n$BULLET_WITH_TAB$Je [Concept('imprisoned','ve vězení')|E] (u kohokoli)"
 SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_OPPOSE_TT: "#T Nesouhlasí se změnou zákona nástupnictví#!\n[Character.GetShortUIName] zabrání jakékoli změně [Concept('succession_law','zákona nástupnictví')|E].\n\nAby vyslovil souhlas, musí splňovat alespoň jednu z těchto podmínek:\n$BULLET_WITH_TAB$Mít o tobě kladné [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Pociťovat vůči tobě [Concept('cowed','bázeň')|E]\n$BULLET_WITH_TAB$Být [Concept('imprisoned','ve vězení')|E] (u kohokoli)"
 SUCCESSION_LAW_CHANGE_WINDOW_CLAN_TITLE: "Změna klanových [Concept('succession_laws','zákonů nástupnictví')|E]"
 SUCCESSION_LAW_CHANGE_WINDOW_CLAN_DESC: "Ve [Concept('government','vládě')|E] typu [GetGovernment('clan_government').GetName] určuje [Concept('succession_laws','zákony nástupnictví')|E] současná hodnota [Concept('house_unity','jednoty rodu')|E]. Každá [Concept('house_unity_level','úroveň jednoty rodu')|E] aktivuje odpovídající [Concept('succession_law','zákon nástupnictví')|E], pokud vládce nepoužívá zákon z kategorie $SUCCESSION_LAW_CHANGE_WINDOW_SINGLE_HEIR_LAWS$, například $single_heir_succession_law$."
 SUCCESSION_LAW_CHANGE_WINDOW_CLAN_CHANGE_LAW_BUTTON_TOOLTIP: "Máš [Concept('clan','klanovou vládu')|E], a proto tímto způsobem nemůžeš měnit [Concept('succession_laws','zákony nástupnictví')|E]. Klanové zákony nástupnictví určuje [Concept('house_unity_level','úroveň jednoty rodu')|E]."
 LAW_CHOICE_TOOLTIP: "#T [Law.GetNameNoTooltip]\n#![Law.GetEffectDescription]"
