 SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_APPROVE_TT: "#T Schvaluje změnu zákona o následnictví#!\n[Character.GetShortUIName] podporuje, nebo alespoň nemůže oponovat žádné změně [Concept('succession_law','zákon nástupnictví')|E].\n\n[Character.GetSheHe|U] schvaluje z jednoho z následujících důvodů:\n$BULLET_WITH_TAB$Má na vás pozitivní [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Je vámi [Concept('cowed','vyděšeným')|E]\n$BULLET_WITH_TAB$Je [Concept('imprisoned','uvězněný')|E] (kýmkoli)" # todo: CONCEPT CASE
 SUCCESSION_LAW_CHANGE_WINDOW_POWERFUL_OPPOSE_TT: "#T Oponuje změně zákona o následnictví#!\n[Character.GetShortUIName] zamezí jakékoli změně [Concept('succession_law','zákon nástupnictví')|E].\n\nAby schválil, [Character.GetShortUIName] musí buď:\n$BULLET_WITH_TAB$Mít na vás pozitivní [Concept('opinion','mínění')|E]\n$BULLET_WITH_TAB$Být vámi [Concept('cowed','vyděšeným')|E]\n$BULLET_WITH_TAB$Být [Concept('imprisoned','uvězněný')|E] (kýmkoli)" # todo: CONCEPT CASE
 SUCCESSION_LAW_CHANGE_WINDOW_CLAN_TITLE: "Změna klanových [Concept('succession_laws','zákonů nástupnictví')|E]" # todo: CONCEPT CASE
 SUCCESSION_LAW_CHANGE_WINDOW_CLAN_DESC: "Ve [GetGovernment('clan_government').GetName] [Concept('government','vládě')|E] jsou [Concept('succession_laws','zákonech nástupnictví')|E] určovány aktuálním skóre [Concept('house_unity','jednota rodu')|E]. Každá úroveň [Concept('house_unity_level','úroveň jednoty rodu')|E] aktivuje odpovídající [Concept('succession_law','zákon nástupnictví')|E], pokud vládce nepoužívá zákon $SUCCESSION_LAW_CHANGE_WINDOW_SINGLE_HEIR_LAWS$, jako například $single_heir_succession_law$." # todo: CONCEPT CASE
 SUCCESSION_LAW_CHANGE_WINDOW_CLAN_CHANGE_LAW_BUTTON_TOOLTIP: "Jste [Concept('clan','klan')|E] a tímto způsobem nemůžete měnit [Concept('succession_laws','zákony nástupnictví')|E]. [Succession_laws|E] u [Concept('clan','klanu')|E] jsou určovány jejich úrovní jednoty rodu [Concept('house_unity_level','úrovni jednoty rodu')|E]." # todo: CONCEPT CASE
