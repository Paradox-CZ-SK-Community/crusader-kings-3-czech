 law_of_the_land_succession_law_effects: "Tento [Concept('county','hrabství')|E] vyžaduje pro dědění konkrétní [Concept('government','vládu')|E] v závislosti na [Concept('holding_type','typ državy')|E] hlavní [Concept('barony','baronství')|E]. Bude udělen postavě v [Concept('realm','panství')|E] [Concept('line_of_succession','liniích následnictví')|E], která tuto podmínku splňuje.\n\nPokud nikdo požadavek nesplní, zdědí [Concept('title','titul')|E] místní postava a stane se [Concept('independent','nezávislým')|E]." # todo: CONCEPT CASE
 succession_law_changed: "Změněn zákon o nástupnictví titulu"
 confederation_elective_succession_law: "Konfederační volba"
 confederation_elective_succession_law_subname: "[vassals] drží skutečnou moc"
 confederation_elective_candidates: "Blízká rodina, vnoučata a vazalové"
 confederation_elective_candidates_tooltip: "Aby byla postava platným kandidátem v rámci feudální volby, musí splňovat jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$Být legitimním členem [Concept('close_family','blízkou rodinou')|E] současného vládce\n$EFFECT_LIST_BULLET$Být [Concept('vassal','vazal')|E]" # todo: CONCEPT CASE
 confederation_elective_succession_law_effects: "[Concept('ruler','Vládce')|E] a všichni přímí [Concept('vassals','vazalové')|E] mohou nominovat [Concept('title_heir','dědic titulu')|E] z řad sebe a [Concept('close_family','blízká rodina')|E] vládce. [Concept('voting_strength','Síla hlasu')|E] je převážně určena [Concept('prestige_level','úroveň slávy')|E], [Concept('piety_level','úroveň oddanosti')|E] a počtem [Concept('count','hrabětem')|E]-[Concept('title_tier','úrovní')|E] [Concept('vassals','vazaly')|E]." # todo: CONCEPT CASE
 confederation_elective_electors: "$feudal_elective_electors$"
 confederation_elective_electors_tooltip: "Aby byl [Concept('elector','volitel')|E] platný v rámci Konfederační volby, musí vazal splňovat všechny následující podmínky:\n$EFFECT_LIST_BULLET$Být [Concept('count','hrabě')|E]-[Concept('rank','hodnost')|E] nebo vyšší\n$EFFECT_LIST_BULLET$Být přímým [Concept('vassal','vazalem')|E] držitele [Concept('title','titul')|E]\n$EFFECT_LIST_BULLET$Mít kmenové nebo nomádské [Concept('government','vláda')|E]\n$EFFECT_LIST_BULLET$Nemít [GetTrait('incapable').GetName( GetNullCharacter )] [Concept('trait','rys')|E]\n$EFFECT_LIST_BULLET$Nebýt ve [Concept('war','válce')|E] s držitelem [Concept('title','titulem')|E]" # todo: CONCEPT CASE
