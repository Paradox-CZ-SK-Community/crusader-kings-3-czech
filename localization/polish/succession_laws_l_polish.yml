 saxon_elective_candidates_tooltip: "Aby byla postava platným kandidátem ve Witenagemotu, musí splňovat jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$Být legitimním dítětem současného vladaře, které není v pořadí pro dědění Theokracie nebo Republiky\n$EFFECT_LIST_BULLET$Být [Concept('claimant','pretendent')|E] k titulu, který není v pořadí pro dědění Theokracie nebo Republiky. Děti kandidáta nemohou být nominovány\n$EFFECT_LIST_BULLET$Být [Concept('powerful_vassal_powerful','mocný')|E] [de_jure] feudálním vazalem tohoto titulu" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
