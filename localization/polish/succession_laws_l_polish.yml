 succession_laws_must_not_be_temporal: "Nesmí být [Concept('temporal_head_of_faith','světská hlava víry')|E] [Concept('title','titul')|E]." # todo: CONCEPT CASE
 holy_order_succession_law: "Svatý řád"
 holy_order_succession_law_effects: "Při nástupu na trůn budou všechny [Concept('titles','tituly')|e] Velmistra uděleny jeho následníkovi, kterým je obecně [Concept('knight','rytíř')|E] s nejvyšší dovedností v [Concept('martial','válečnictví')|E]." # todo: CONCEPT CASE
 mercenary_company_succession_law: "Žoldnéřská společnost"
 mercenary_company_succession_law_effects: "Při nástupu na trůn budou všechny [Concept('titles','tituly')|e] Kapitána uděleny jeho následníkovi, kterým je obecně [Concept('knight','rytíř')|E] s nejvyšší dovedností v [Concept('martial','válečnictví')|E]." # todo: CONCEPT CASE
