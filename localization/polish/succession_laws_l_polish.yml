 celestial_appointment_succession_law_effects: "\n[Concept('succession','Nástupnictví')|E] je založeno na [Concept('merit_level','hodnost zásluh')|E] a [Concept('merit_pools','seznamy kandidátů')|E]\n\n#high Typ [Concept('appointment_succession_law','zákon nástupnictví jmenováním')|E]. Pod $celestial_appointment_succession_law$ budou [Concept('title','titulem')|E] a jeho přidružené [Concept('holdings','državy')|E] zděděny kandidátem s nejvyšším [Concept('candidate_score','skórem kandidáta')|E]. Jakýkoli [Concept('adult','dospělý')|E] v [Concept('realm','panství')|E] se může snažit získat [Concept('governorship','guvernérství')|E] různými způsoby, například dosažením vysokého [Concept('merit_level','hodnosti zásluh')|E] nebo utrácením [Concept('influence','vlivem')|E].#!\n\n" # todo: NEW TRANSLATION # todo: CONCEPT CASE
