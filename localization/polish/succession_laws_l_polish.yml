 feudal_elective_succession_law: "Feudální volba"
 princely_elective_succession_law: "Volba princů"
 feudal_elective_succession_law_effects: "[Concept('ruler','Vládce')|E] a všichni přímí [Concept('de_jure','de iure')|E] [Concept('vassals','vazalové')|E] o jeden nebo dva [Concept('ranks','hodnosti')|E] pod [Concept('title','titulem')|E] mohou nominovat [Concept('title_heir','dědic titulu')|E] z vlastních řad nebo z [Concept('close_family','blízké rodiny')|E] vládce." # todo: CONCEPT CASE
 princely_elective_succession_law_effects: "Císař a sedm kurfiřtů mohou nominovat [Concept('title_heir','dědic titulu')|E] z vlastních řad, z [Concept('legitimate','legitimních')|E] dětí a sourozenců [Concept('ruler','vládce')|E], stejně jako z významných [Concept('de_jure','de iure')|E] [Concept('vassal','vazalů')|E] říše. Pokud je některý historický kurfiřtský [Concept('title','titul')|E] držen nevěřícími nebo neexistuje, jeho místo zaujme jiný [Concept('de_jure','de iure')|E] vazal. Toto [Concept('succession_law','zákon nástupnictví')|E] klade velký důraz na [Concept('faith','víru')|E] a [Concept('piety','zbožnost')|E].\n\nKurfiřtské tituly pro tuto říši jsou hrabství Kolín, Mohuč a Trevír a vévodství Čechy, Východní Franky, Ostfálsko a Ostmarka." # todo: CONCEPT CASE
 gaelic_elective_succession_law: "Tanistická volba"
 gaelic_elective_succession_law_effects: "[Concept('ruler','Vládce')|E] a všichni [Concept('vassals','vazalové')|E] nad [Concept('rank','hodností')|E] [Concept('baron','baronem')|E] a o jeden či dva stupně pod [Concept('title','titulem')|E] mohou nominovat [Concept('title_heir','dědic titulu')|E] — tanistu — z řad členů [Concept('dynasty','dynastie')|E] vládce. Vazalové mají tendenci upřednostňovat starší, vzdálenější příbuzné před [Concept('close_family','blízkou rodinou')|E]." # todo: CONCEPT CASE
 saxon_elective_succession_law: "Saská volba"
 saxon_elective_succession_law_subname: "Witenagemot"
 saxon_elective_succession_law_effects: "[Concept('ruler','Vládce')|E] a všichni přímí dospělí [Concept('de_jure','de iure')|E] vazalové o jeden či dva [Concept('ranks','hodnosti')|E] pod [Concept('title','titulem')|E] mohou nominovat [Concept('title_heir','dědic titulu')|E] z nejmocnějších [Concept('powerful_vassal','mocného vazala')|E] mezi nimi, z [Concept('legitimate','legitimních')|E] dětí vládce a z jiných platných [Concept('claimant','pretendentů')|E]." # todo: CONCEPT CASE
 scandinavian_elective_succession_law: "Skandinávská volba"
 scandinavian_elective_succession_law_subname: "Thing"
 scandinavian_elective_succession_law_effects: "[Concept('ruler','Vládce')|E] a všichni [Concept('de_jure','de iure')|E] [Concept('vassals','vazalové')|E] (s výjimkou baronů) mohou nominovat [Concept('title_heir','dědic titulu')|E] z řad [Concept('extended_family','širší rodina')|E] vládce a dostupných [Concept('claimants','pretendentů')|E]. [Concept('voting_power','Hlasovací moc')|E] v tomto [Concept('succession_law','zákoně nástupnictví')|E] je ovlivněna celkovým [Concept('county_development','rozvoji')|E] [Concept('domain','doménami')|E] a [Concept('county_opinion','lidové mínění')|E] [Concept('capital','hlavní sídlo')|E] každého [Concept('elector','volitele')|E]." # todo: CONCEPT CASE
 feudal_elective_candidates: "Blízká rodina, uchazeči o titul a voliči"
 feudal_elective_candidates_tooltip: "Aby byla postava platným kandidátem v rámci feudálního volení, musí splňovat jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$Být legitimním [Concept('close_family','blízkou rodinou')|E] členem současného vladaře, který není v pořadí pro dědění Theokracie nebo Republiky. Děti kandidáta nemohou být nominovány\n$EFFECT_LIST_BULLET$Být [Concept('claimant','pretendent')|E] k titulu, který není v pořadí pro dědění Theokracie nebo Republiky\n$EFFECT_LIST_BULLET$Být platným feudálním [Concept('elector','volitelem')|E] pro tento titul" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 feudal_elective_electors: "Vládce a vazalové"
 feudal_elective_electors_tooltip: "Aby byl platným [Concept('elector','volitelem')|E] v rámci feudálního volení, musí vazal splnit všechny následující podmínky:\n$EFFECT_LIST_BULLET$Být [Concept('de_jure','de iure')|E] vazalem tohoto titulu\n$EFFECT_LIST_BULLET$Být přímým vazalem tohoto titulu\n$EFFECT_LIST_BULLET$Být pouze o jeden nebo dva [Concept('ranks','hodnosti')|E] nižší než titul" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
