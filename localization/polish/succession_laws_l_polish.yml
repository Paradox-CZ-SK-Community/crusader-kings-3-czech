 succession_order_laws: "[Concept('succession_laws','Zákony nástupnictví')|E]" # todo: CONCEPT CASE
 succession_order_laws_singular: "[Concept('succession_law','Zákon nástupnictví')|E]" # todo: CONCEPT CASE
 partition_succession_law: "Dělení"
 partition_succession_law_subname: "Všechny děti dědí rovným dílem"
 partition_succession_law_effects: "\n#V Pod $partition_succession_law$ [succession] budou vaše [titles] rovnoměrně rozděleny mezi vaše děti.#!\n\n#weak $partition_base_desc$#!"
 partition_base_desc: "#weak Po nástupu na trůn budou všechny [Concept('titles','tituly')|E] držené zesnulým [Concept('ruler','vládci')|E] rozděleny mezi jejich [Concept('eligible_children','způsobilé děti')|E], přičemž [Concept('player_heir','hráčský dědic')|E] vždy obdrží [Concept('primary_title','hlavní titul')|E], [Concept('realm_capital','hlavní sídlo panství')|E] a všechny přidružené přímé [Concept('de_jure','de iure')|E] tituly.\n\nMladším dětem budou přiděleny tituly počínaje těmi se stejným [Concept('rank','hodností')|E] jako Hlavní titul; pokud žádné nejsou dostupné, budou jim přiděleny tituly nižšího [Concept('rank','hodnosti')|E]. Vašemu [Concept('player_heir','hráčskému dědici')|E] nelze předem udělit tituly, které po něm nejsou děděny.\n#!" # todo: CONCEPT CASE
 high_partition_succession_law: "Vysoké dělení"
 high_partition_succession_law_subname: "Všechny děti dědí"
 high_partition_succession_law_effects: "\n#V Pod $high_partition_succession_law$ [succession] většina [titles] připadne vašemu [player_heir] – zbytek bude rozdělen mezi vaše děti.#!\n\n#weak $partition_base_desc$\nVašemu [Concept('player_heir','hráčskému dědici')|E] #emp always#! připadne nejméně polovina titulů zesnulého vladaře.\n#!" # todo: CONCEPT CASE
 confederate_partition_succession_law: "Konfederátní dělení"
 confederate_partition_succession_law_subname: "Všechny děti dědí rovným dílem"
 confederate_partition_succession_law_effects: "\n#V Pod $confederate_partition_succession_law$ budou vaše [titles] rozděleny rovnoměrně mezi vaše děti. Pro mladší [realm_heirs] mohou být vytvořeny nové [titles].#!\n\n#weak $partition_base_desc$\nMladším dětem budou vytvořeny tituly, pokud je držen dostatek země.\n\n#!#X Kmenoví vládci jsou vázáni na tento typ nástupnictví.#!\n"
 single_heir_succession_law: "Primogenitura"
 single_heir_succession_law_subname: "Nejstarší dítě dědí"
 single_heir_succession_law_effects: "\n#V Pod $single_heir_succession_law$ [succession] vaše nejstarší dítě zdědí všechny vaše [titles].#!\n\n#weak Při nástupu na trůn budou všechny [Concept('titles','tituly')|e] zesnulého vladaře uděleny [Concept('player_heir','hráčský dědic')|E], což je jejich nejstarší [Concept('eligible_child','způsobilé dítě')|E]. Mladší děti nic nedostanou.\n#!" # todo: CONCEPT CASE
 single_heir_succession_law_youngest: "Ultimogenitura"
 single_heir_succession_law_youngest_subname: "Nejmladší dítě dědí"
 single_heir_succession_law_youngest_effects: "\n#V Pod $single_heir_succession_law_youngest$ [succession] vaše nejmladší dítě zdědí všechny vaše [titles].#!\n\n#weak Při nástupu na trůn budou všechny [Concept('titles','tituly')|e] zesnulého vladaře uděleny [Concept('player_heir','hráčský dědic')|E], což je jejich nejmladší [Concept('eligible_child','způsobilé dítě')|E]. Starší děti nic nedostanou.\n#!" # todo: CONCEPT CASE
 single_heir_dynasty_house: "Seniority rodu"
 single_heir_dynasty_house_subname: "Nejstarší člen [house] dědí"
 single_heir_dynasty_house_effects: "\n#V Pod $single_heir_dynasty_house$ [succession] nejstarší člen vašeho [house] zdědí všechny vaše tituly.#!\n\n#weak Při nástupu na trůn budou všechny [Concept('titles','tituly')|e] zesnulého vladaře uděleny nejstaršímu oprávněnému členu jejich [Concept('house','rod')|E]. Vaše děti nic nedostanou, pokud některé z nich není nejstarším členem rodu.\n#!" # todo: CONCEPT CASE
 same_faith_theocratic_succession_law: "Stejná víra"
 same_faith_theocratic_succession_law_effects: "Dědit mohou pouze postavy se stejnou [Concept('faith','vírou')|E] jako současný [Concept('ruler','vládce')|E]." # todo: CONCEPT CASE
