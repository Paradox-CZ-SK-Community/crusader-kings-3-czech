 scandinavian_elective_candidates_tooltip: "Aby byla postava způsobilým kandidátem při thingu, musí splňovat alespoň jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$Být legitimním členem [Concept('extended_family','širší rodiny')|E] vládce, který není v pořadí nástupnictví teokracie ani republiky. Děti kandidáta nelze navrhnout\n$EFFECT_LIST_BULLET$Být [Concept('claimant','pretendentem')|E] o titul, který není v pořadí nástupnictví teokracie ani republiky"
