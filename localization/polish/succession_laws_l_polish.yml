 confederation_elective_electors_tooltip: "Aby byl vazal způsobilým [Concept('elector','volitelem')|E] při konfederační volbě, musí splňovat všechny následující podmínky:\n$EFFECT_LIST_BULLET$Mít [Concept('rank','hodnost')|E] [Concept('count','hraběte')|E] nebo vyšší\n$EFFECT_LIST_BULLET$Být přímým [Concept('vassal','vazalem')|E] [Concept('title','titulu')|E]\n$EFFECT_LIST_BULLET$Mít kmenovou nebo kočovnou [Concept('government','vládu')|E]\n$EFFECT_LIST_BULLET$Nemít [Concept('trait','rys')|E] [GetTrait('incapable').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Nebýt ve [Concept('war','válce')|E] s držitelem [Concept('title','titulu')|E]"
 mandala_succession_law: "Nástupnictví mandaly"
 mandala_succession_law_subname: "Nástupnictví mandaly"
 mandala_succession_law_effects: "#high Zákon $mandala_succession_law$ umožňuje, aby tvé nejstarší dítě zdědilo tvé [Concept('titles','tituly')|E].\n\nPo nástupnictví musí nový vládce projít [Concept('mandala_trials','zkouškami mandaly')|E], aby si udržel kontrolu nad celým panstvím a jeho [Concept('tributaries','tributáři')|E]#!.\n\n"
 celestial_appointment_succession_law: "Nebeské nástupnictví jmenováním"
 celestial_appointment_succession_law_subname: "Dědí kandidát s nejvyšším skóre"
 celestial_appointment_succession_law_effects: "\n[Concept('succession','Nástupnictví')|E] se zakládá na [Concept('merit_level','hodnosti zásluh')|E] a [Concept('merit_pools','seznamech kandidátů')|E]\n\n#high Jde o typ [Concept('appointment_succession_law','zákona nástupnictví jmenováním')|E]. Při zákonu $celestial_appointment_succession_law$ zdědí [Concept('title','titul')|E] a s ním spojené [Concept('holdings','državy')|E] kandidát s nejvyšším [Concept('candidate_score','skóre kandidáta')|E]. O [Concept('governorship','guvernérství')|E] může usilovat každý [Concept('adult','dospělý')|E] v [Concept('realm','panství')|E] různými způsoby, například získáním vysoké [Concept('merit_level','hodnosti zásluh')|E] nebo utrácením [Concept('influence','vlivu')|E].#!\n\n"
