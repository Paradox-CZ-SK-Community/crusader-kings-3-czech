l_polish:
 succession_order_laws: "[Concept('succession_laws','Zákony nástupnictví')|E]"
 succession_order_laws_singular: "[Concept('succession_law','Zákon nástupnictví')|E]"
 partition_succession_law: "Rozdělení"
 partition_succession_law_subname: "Všechny děti dědí rovným dílem"
 partition_succession_law_effects: "\n#V Při [Concept('succession','nástupnictví')|E] podle zákona $partition_succession_law$ budou tvé [Concept('titles','tituly')|E] rozděleny rovným dílem mezi tvé děti.#!\n\n#weak $partition_base_desc$#!"
 partition_base_desc: "#weak Při [Concept('succession','nástupnictví')|E] budou všechny [Concept('titles','tituly')|E] rozděleny mezi [Concept('eligible_children','způsobilé děti')|E], přičemž [Concept('player_heir','hráčský dědic')|E] vždy obdrží [Concept('primary_title','hlavní titul')|E], [Concept('realm_capital','hlavní sídlo panství')|E] a všechny přímé [Concept('de_jure','de iure')|E] tituly, které s nimi souvisejí.\n\nMladší děti nejprve obdrží tituly stejné [Concept('rank','hodnosti')|E] jako hlavní titul. Pokud žádné takové tituly nejsou dostupné, obdrží tituly nižší hodnosti. Hráčskému dědici nelze předem udělit tituly, které nemá zdědit.\n#!"
 high_partition_succession_law: "Vysoké rozdělení"
 high_partition_succession_law_subname: "Dědí všechny děti"
 high_partition_succession_law_effects: "\n#V Při [Concept('succession','nástupnictví')|E] podle zákona $high_partition_succession_law$ připadne lví podíl [Concept('titles','titulů')|E] tvému [Concept('player_heir','hráčskému dědici')|E] a zbytek bude rozdělen mezi tvé děti.#!\n\n#weak $partition_base_desc$\nHráčský dědic #emp vždy#! zdědí alespoň polovinu titulů.\n#!"
 confederate_partition_succession_law: "Konfederační rozdělení"
 confederate_partition_succession_law_subname: "Všechny děti dědí rovným dílem"
 confederate_partition_succession_law_effects: "\n#V Při zákonu $confederate_partition_succession_law$ budou tvé [Concept('titles','tituly')|E] rozděleny rovným dílem mezi tvé děti. Pro mladší [Concept('realm_heirs','dědice panství')|E] mohou být vytvořeny nové [Concept('titles','tituly')|E].#!\n\n#weak $partition_base_desc$\nPokud držíš dostatek země, budou pro mladší děti vytvořeny nové tituly.\n\n#!#X Kmenoví vládci jsou omezeni na tento typ nástupnictví.#!\n"
 single_heir_succession_law: "Primogenitura"
 single_heir_succession_law_subname: "Dědí nejstarší dítě"
 single_heir_succession_law_effects: "\n#V Při [Concept('succession','nástupnictví')|E] podle zákona $single_heir_succession_law$ zdědí všechny tvé [Concept('titles','tituly')|E] nejstarší dítě.#!\n\n#weak Při nástupnictví připadnou všechny [Concept('titles','tituly')|E] [Concept('player_heir','hráčskému dědici')|E], jímž je nejstarší [Concept('eligible_child','způsobilé dítě')|E]. Mladší děti nedostanou nic.\n#!"
 single_heir_succession_law_youngest: "Ultimogenitura"
 single_heir_succession_law_youngest_subname: "Dědí nejmladší dítě"
 single_heir_succession_law_youngest_effects: "\n#V Při [Concept('succession','nástupnictví')|E] podle zákona $single_heir_succession_law_youngest$ zdědí všechny tvé [Concept('titles','tituly')|E] nejmladší dítě.#!\n\n#weak Při nástupnictví připadnou všechny [Concept('titles','tituly')|E] [Concept('player_heir','hráčskému dědici')|E], jímž je nejmladší [Concept('eligible_child','způsobilé dítě')|E]. Starší děti nedostanou nic.\n#!"
 single_heir_dynasty_house: "Rodový seniorát"
 single_heir_dynasty_house_subname: "Dědí nejstarší člen [Concept('house','rodu')|E]"
 single_heir_dynasty_house_effects: "\n#V Při [Concept('succession','nástupnictví')|E] podle zákona $single_heir_dynasty_house$ zdědí všechny tvé tituly nejstarší člen tvého [Concept('house','rodu')|E].#!\n\n#weak Při nástupnictví připadnou všechny [Concept('titles','tituly')|E] nejstaršímu způsobilému členu [Concept('house','rodu')|E]. Tvé děti nedostanou nic, ledaže je některé z nich nejstarším členem rodu.\n#!"
 same_faith_theocratic_succession_law: "Stejná víra"
 same_faith_theocratic_succession_law_effects: "Dědit mohou pouze postavy stejné [Concept('faith','víry')|E] jako současný [Concept('ruler','vládce')|E]."
 same_faith_only_law: "$same_faith_theocratic_succession_law$"
 same_faith_only_law_effects: "$same_faith_theocratic_succession_law_effects$"
 bishop_theocratic_succession_law: "Teokratické"
 bishop_theocratic_succession_law_effects: "Při nástupnictví připadnou všechny [Concept('titles','tituly')|E] [Concept('realm_priest_possessive','vrchního duchovního')|E] jeho nástupci. O tom, kdo se jím stane, rozhodují doktríny jeho [Concept('faith','víry')|E]."
 temporal_head_of_faith_succession_law: "Světské teokratické"
 temporal_head_of_faith_succession_law_effects: "[Concept('title','Titul')|E] [Concept('temporal_head_of_faith','světské hlavy víry')|E] připadne [Concept('player_heir','hráčskému dědici')|E] současné [Concept('head_of_faith','hlavy víry')|E]."
 succession_laws_must_not_be_temporal: "Nesmí jít o [Concept('title','titul')|E] [Concept('temporal_head_of_faith','světské hlavy víry')|E]."
 holy_order_succession_law: "Svatý řád"
 holy_order_succession_law_effects: "Při nástupnictví připadnou všechny [Concept('titles','tituly')|E] velmistra jeho nástupci, kterým bývá zpravidla [Concept('knight','rytíř')|E] s nejvyšší [Concept('martial','dovedností ve vojenství')|E]."
 mercenary_company_succession_law: "Žoldnéřská společnost"
 mercenary_company_succession_law_effects: "Při nástupnictví připadnou všechny [Concept('titles','tituly')|E] kapitána jeho nástupci, kterým bývá zpravidla [Concept('knight','rytíř')|E] s nejvyšší [Concept('martial','dovedností ve vojenství')|E]."
 city_succession_law: "Republikánské"
 city_succession_law_effects: "Při nástupnictví připadnou všechny [Concept('titles','tituly')|E] vládce jeho nástupci."
 herder_succession_law: "Pastevecké nástupnictví"
 herder_succession_law_effects: "Při nástupnictví připadnou všechny [Concept('titles','tituly')|E] vládce jeho nástupci."
 succession_rel_head: "[Concept('religious_head_succession_law_short','Zákon hlavy víry')|E]"
