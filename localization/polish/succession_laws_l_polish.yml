 single_heir_succession_kurultai_law: "Kurultaj"
 single_heir_succession_kurultai_subname: "Dědí nejstarší dítě"
 single_heir_succession_kurultai_law_effects: "Při nástupnictví podle kurultaje hraje [Concept('council','rada')|E] důležitou roli při rozhodování o tom, kdo bude další v pořadí. Pokud se v [Concept('kurultai','kurultaji')|E] ozvou nesouhlasné hlasy, povede to k chaotickému nástupnictví.\n\nPři chaotickém nástupnictví je pořadí nejasné a [Concept('heir','dědice')|E] na počátku vlády postihnou některé negativní účinky.\n\nPokud se celý kurultaj sjednotí, panství zažije stabilní nástupnictví, při němž dědic usedne na trůn s podporou všech svých nejmocnějších stoupenců."
