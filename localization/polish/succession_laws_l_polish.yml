 male_only_law_effects: "$EFFECT_LIST_BULLET$Ženy jsou vyloučeny z dědictví\n$EFFECT_LIST_BULLET$Ženy nemohou dědit [Concept('claims','nároky')|E]\n$EFFECT_LIST_BULLET$Mužští [Concept('rulers','vládci')|E] mohou mít [Concept('concubines','konkubíny')|E] nebo více [Concept('spouses','chotí')|E], pokud jejich [Concept('faith','víra')|E] obsahuje [Concept('doctrine','doktrínu')|E] [GetFaithDoctrine('doctrine_concubines').GetBaseName] nebo [GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
 male_preference_law_effects: "$EFFECT_LIST_BULLET$Muži mají při nástupnictví přednost před ženami\n$EFFECT_LIST_BULLET$Mužští [Concept('rulers','vládci')|E] mohou mít [Concept('concubines','konkubíny')|E] nebo více [Concept('spouses','chotí')|E], pokud jejich [Concept('faith','víra')|E] obsahuje [Concept('doctrine','doktrínu')|E] [GetFaithDoctrine('doctrine_concubines').GetBaseName] nebo [GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
 equal_law_effects: "$EFFECT_LIST_BULLET$Muži a ženy jsou si při nástupnictví rovni\n$EFFECT_LIST_BULLET$Všichni [Concept('rulers','vládci')|E] mohou mít [Concept('concubines','konkubíny')|E] nebo více [Concept('spouses','chotí')|E], pokud jejich [Concept('faith','víra')|E] obsahuje [Concept('doctrine','doktrínu')|E] [GetFaithDoctrine('doctrine_concubines').GetBaseName] nebo [GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
 female_preference_law_effects: "$EFFECT_LIST_BULLET$Ženy mají při nástupnictví přednost před muži\n$EFFECT_LIST_BULLET$Ženské [Concept('rulers','vládkyně')|E] mohou mít [Concept('concubines','konkubíny')|E] nebo více [Concept('spouses','chotí')|E], pokud jejich [Concept('faith','víra')|E] obsahuje [Concept('doctrine','doktrínu')|E] [GetFaithDoctrine('doctrine_concubines').GetBaseName] nebo [GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
 female_only_law_effects: "$EFFECT_LIST_BULLET$Muži jsou vyloučeni z dědictví\n$EFFECT_LIST_BULLET$Muži nemohou dědit [Concept('claims','nároky')|E]\n$EFFECT_LIST_BULLET$Ženské [Concept('rulers','vládkyně')|E] mohou mít [Concept('concubines','konkubíny')|E] nebo více [Concept('spouses','chotí')|E], pokud jejich [Concept('faith','víra')|E] obsahuje [Concept('doctrine','doktrínu')|E] [GetFaithDoctrine('doctrine_concubines').GetBaseName] nebo [GetFaithDoctrine('doctrine_polygamy').GetBaseName]"
 SUCCESSION_FORM_NAME: "[Character.GetActiveLawInGroupWithFlag('succession_gender_laws').GetName] [Character.GetActiveLawInGroupWithFlag('succession_order_laws').GetName]"
 feudal_elective_succession_law: "Feudální volba"
 princely_elective_succession_law: "Knížecí volba"
 feudal_elective_succession_law_effects: "[Concept('ruler','Vládce')|E] a všichni přímí [Concept('de_jure','de iure')|E] [Concept('vassals','vazalové')|E] o jednu či dvě [Concept('ranks','hodnosti')|E] níže než [Concept('title','titul')|E] mohou ze svých řad nebo z [Concept('close_family','blízké rodiny')|E] vládce navrhnout [Concept('title_heir','dědice titulu')|E]."
 princely_elective_succession_law_effects: "Císař a sedm kurfiřtů mohou navrhnout [Concept('title_heir','dědice titulu')|E] ze svých řad, z legitimních dětí a sourozenců [Concept('ruler','vládce')|E] nebo z ostatních významných [Concept('de_jure','de iure')|E] [Concept('vassals','vazalů')|E] říše. Pokud historický kurfiřtský [Concept('title','titul')|E] drží nevěřící nebo tento titul neexistuje, jeho místo zaujme jiný de iure vazal. Tento [Concept('succession_law','zákon nástupnictví')|E] klade značný důraz na [Concept('faith','víru')|E] a [Concept('piety','zbožnost')|E].\n\nVolebními tituly tohoto panství jsou hrabství Kolín nad Rýnem, Mohuč a Trevír a vévodství Čechy, Východní Franky, Ostfálsko a Východní marka."
 gaelic_elective_succession_law: "Tanistry"
 gaelic_elective_succession_law_effects: "[Concept('ruler','Vládce')|E] a všichni [Concept('vassals','vazalové')|E] s vyšší [Concept('rank','hodností')|E] než [Concept('baron','baron')|E], kteří jsou o jednu či dvě hodnosti níže než [Concept('title','titul')|E], mohou z členů [Concept('dynasty','dynastie')|E] vládce navrhnout [Concept('title_heir','dědice titulu')|E] – tanista. Vazalové obvykle upřednostňují starší vzdálené příbuzné před [Concept('close_family','blízkou rodinou')|E]."
 saxon_elective_succession_law: "Saská volba"
 saxon_elective_succession_law_subname: "Witenagemot"
 saxon_elective_succession_law_effects: "[Concept('ruler','Vládce')|E] a všichni přímí dospělí [Concept('de_jure','de iure')|E] vazalové o jednu či dvě [Concept('ranks','hodnosti')|E] níže než [Concept('title','titul')|E] mohou navrhnout [Concept('title_heir','dědice titulu')|E] z řad nejmocnějších vazalů, legitimních dětí vládce a ostatních způsobilých [Concept('claimants','pretendentů')|E]."
 scandinavian_elective_succession_law: "Skandinávská volba"
 scandinavian_elective_succession_law_subname: "Thing"
 scandinavian_elective_succession_law_effects: "[Concept('ruler','Vládce')|E] a všichni [Concept('de_jure','de iure')|E] [Concept('vassals','vazalové')|E] kromě baronů mohou navrhnout [Concept('title_heir','dědice titulu')|E] z [Concept('extended_family','širší rodiny')|E] vládce nebo z dostupných [Concept('claimants','pretendentů')|E]. [Concept('voting_power','Hlasovací moc')|E] [Concept('elector','volitele')|E] v tomto [Concept('succession_law','zákoně nástupnictví')|E] ovlivňuje celkový [Concept('county_development','rozvoj')|E] jeho [Concept('domain','domény')|E] a [Concept('county_opinion','lidové mínění')|E] v [Concept('capital','hlavním sídle')|E]."
 feudal_elective_candidates: "Blízká rodina, pretendenti a volitelé"
 feudal_elective_candidates_tooltip: "Aby byla postava způsobilým kandidátem při feudální volbě, musí splňovat alespoň jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$Být legitimním členem [Concept('close_family','blízké rodiny')|E] současného vládce, který není v pořadí nástupnictví teokracie ani republiky. Děti kandidáta nelze navrhnout\n$EFFECT_LIST_BULLET$Být [Concept('claimant','pretendentem')|E] o titul, který není v pořadí nástupnictví teokracie ani republiky\n$EFFECT_LIST_BULLET$Být způsobilým feudálním [Concept('elector','volitelem')|E] daného titulu"
 feudal_elective_electors: "Vládce a vazalové"
 feudal_elective_electors_tooltip: "Aby byl vazal způsobilým [Concept('elector','volitelem')|E] při feudální volbě, musí splňovat všechny následující podmínky:\n$EFFECT_LIST_BULLET$Být [Concept('de_jure','de iure')|E] vazalem titulu\n$EFFECT_LIST_BULLET$Být přímým vazalem titulu\n$EFFECT_LIST_BULLET$Být pouze o jednu či dvě [Concept('ranks','hodnosti')|E] níže než titul"
 princely_elective_candidates: "$feudal_elective_candidates$"
 princely_elective_candidates_tooltip: "Aby byla postava způsobilým kandidátem při knížecí volbě, musí splňovat alespoň jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$Být legitimním členem [Concept('close_family','blízké rodiny')|E] současného vládce, který není v pořadí nástupnictví teokracie ani republiky. Děti kandidáta nelze navrhnout\n$EFFECT_LIST_BULLET$Být [Concept('claimant','pretendentem')|E] o titul, který není v pořadí nástupnictví teokracie ani republiky\n$EFFECT_LIST_BULLET$Být způsobilým feudálním [Concept('elector','volitelem')|E] daného titulu"
 princely_elective_electors: "Kurfiřti"
 princely_elective_electors_tooltip: "Kromě [SuccessionElectionWindow.GetTitle.GetHolder.GetTitleAsNameNoTooltip] jsou při zákonu [SuccessionElectionWindow.GetSuccessionLaw.GetName] jako [Concept('electors','volitelé')|E] upřednostňováni držitelé následujících [Concept('titles','titulů')|E]:[SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector1')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector2')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector3')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector4')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector5')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector6')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector7')]\n\nPokud některý z výše uvedených titulů nebyl vytvořen, nedrží jej [Concept('de_jure','de iure')|E] císařský [Concept('vassal','vazal')|E], drží jej již jiný volitel nebo se [Concept('faith','víra')|E] jeho držitele liší od víry císaře, bude podle následujících kritérií vybrán jiný de iure titul držený přímým císařským vazalem nebo [Concept('independent_ruler','nezávislým vládcem')|E]:\n$EFFECT_LIST_BULLET$Upřednostňováni jsou vládci císařovy [Concept('faith','víry')|E] a [Concept('culture','kultury')|E]\n$EFFECT_LIST_BULLET$Upřednostňováni jsou [Concept('theocratic','teokratičtí')|E] a [Concept('feudal','feudální')|E] vládci"
 gaelic_elective_candidates: "Členové dynastie"
