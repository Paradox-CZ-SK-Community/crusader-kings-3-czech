 saxon_elective_candidates_tooltip: "Aby byla postava způsobilým kandidátem při Witenagemotu, musí splňovat alespoň jednu z následujících podmínek:\n$EFFECT_LIST_BULLET$Být legitimním dítětem současného vládce, které není v pořadí nástupnictví teokracie ani republiky\n$EFFECT_LIST_BULLET$Být [Concept('claimant','pretendentem')|E] o titul, který není v pořadí nástupnictví teokracie ani republiky. Děti kandidáta nelze navrhnout\n$EFFECT_LIST_BULLET$Být [Concept('powerful_vassal_powerful','mocným')|E] [Concept('de_jure','de iure')|E] feudálním [Concept('vassal','vazalem')|E] titulu"
