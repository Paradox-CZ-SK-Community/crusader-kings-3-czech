 princely_elective_electors: "Princové-elektoři"
 princely_elective_electors_tooltip: "Kromě [SuccessionElectionWindow.GetTitle.GetHolder.GetTitleAsNameNoTooltip] jsou držitelé následujících [Concept('titles','titulů')|E] preferováni jako [Concept('electors','volitelé')|E] v rámci [SuccessionElectionWindow.GetSuccessionLaw.GetName]:[SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector1')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector2')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector3')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector4')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector5')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector6')][SuccessionElectionWindow.GetTitle.Custom('GetPrincelyElector7')]\n\nPokud některé z výše uvedených nejsou vytvořeny, nejsou drženy [Concept('de_jure','de iure')|E] císařským [Concept('vassal','vazalům')|E], jsou již drženy jiným Electorem, nebo se držitelova [Concept('faith','víra')|E] liší od císařovy, bude vybrán jiný de jure titul držený přímým císařským vazalem nebo [Concept('independent_ruler','nezávislý vládce')|E] na základě těchto kritérií:\n$EFFECT_LIST_BULLET$Vládci se stejnou [Concept('faith','vírou')|E] a [Concept('culture','kultura')|E] jako císař jsou preferováni\n$EFFECT_LIST_BULLET$[Concept('theocratic','Teokratický')|E] a [Concept('feudal','feudální')|E] vládci jsou preferováni" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 gaelic_elective_candidates: "Členové dynastie"
 gaelic_elective_candidates_tooltip: "Všichni legitimní členové [Concept('dynasty','dynastie')|E] současného vládce, kteří nejsou v linii dědění teokracie či republiky, jsou platnými kandidáty podle tanistrie. Děti kandidáta nemohou být nominovány." # todo: CONCEPT CASE
