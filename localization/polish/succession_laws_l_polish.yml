 male_preference_law_effects: "$EFFECT_LIST_BULLET$Muži mají přednost před ženami v nástupnictví\n$EFFECT_LIST_BULLET$Muži [Concept('rulers','vládci')|E] mohou mít [Concept('concubines','konkubíny')|E] nebo více [Concept('spouses','choti')|E] pokud jejich [Concept('faith','víra')|E] má [GetFaithDoctrine('doctrine_concubines').GetBaseName] nebo [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [Concept('doctrine','doktrína')|E]" # todo: CONCEPT CASE
 equal_law_effects: "$EFFECT_LIST_BULLET$Muži a ženy jsou v nástupnictví rovnoprávní\n$EFFECT_LIST_BULLET$Všichni [Concept('rulers','vládci')|E] mohou mít [Concept('concubines','konkubíny')|E] nebo více [Concept('spouses','choti')|E] pokud jejich [Concept('faith','víra')|E] má [GetFaithDoctrine('doctrine_concubines').GetBaseName] nebo [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [Concept('doctrine','doktrína')|E]" # todo: CONCEPT CASE
 female_preference_law_effects: "$EFFECT_LIST_BULLET$Ženy mají přednost před muži v nástupnictví\n$EFFECT_LIST_BULLET$Ženy [Concept('rulers','vládci')|E] mohou mít [Concept('concubines','konkubíny')|E] nebo více [Concept('spouses','choti')|E] pokud jejich [Concept('faith','víra')|E] má [GetFaithDoctrine('doctrine_concubines').GetBaseName] nebo [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [Concept('doctrine','doktrína')|E]" # todo: CONCEPT CASE
 female_only_law_effects: "$EFFECT_LIST_BULLET$Muži jsou diskvalifikováni z dědění\n$EFFECT_LIST_BULLET$Muži nemohou dědit [Concept('claims','nároky')|E]\n$EFFECT_LIST_BULLET$Ženy [Concept('rulers','vládci')|E] mohou mít [Concept('concubines','konkubíny')|E] nebo více [Concept('spouses','choti')|E] pokud jejich [Concept('faith','víra')|E] má [GetFaithDoctrine('doctrine_concubines').GetBaseName] nebo [GetFaithDoctrine('doctrine_polygamy').GetBaseName] [Concept('doctrine','doktrína')|E]" # todo: CONCEPT CASE
