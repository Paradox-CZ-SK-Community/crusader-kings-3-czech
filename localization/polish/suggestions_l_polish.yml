l_polish:
 SUGGESTION_TITLE: "#T $NAME$#!"
 suggestion_recruit_maa_label: "Naverbovat ozbrojence"
 suggestion_recruit_maa: "Doporučení: Naverbuj pluk ozbrojenců"
 suggestion_recruit_maa_desc: "Máš méně [Concept('men_at_arms','ozbrojenců')|E], než se očekává od [Concept('ruler','vládce')|E] tvé [Concept('rank','hodnosti')|E].\n\nNaverbování dalších posílí tvé [Concept('armies','armády')|E], což odradí potenciální nepřátele a pomůže ti bojovat s těmi, kteří se přesto rozhodnou zaútočit."
 suggestion_recruit_maa_click: "#I Kliknutím zobrazíš vojsko#!"
 suggestion_declare_war_label: "Vyhlásit válku"
 suggestion_declare_war: "Doporučení: Vyhlas válku postavě [recipient.GetShortUINameNoTooltip]"
 suggestion_declare_war_desc: "Vítězství ve válce proti [recipient.GetShortUIName] ti umožní dobýt další země a rozšířit tvé [Concept('realm','panství')|E], čímž pomůžeš zajistit dlouhodobý úspěch svého [Concept('house','rodu')|E]."
 suggestion_declare_war_click: "#I Kliknutím vyhlásíš válku#!"
 suggestion_construct_building_label: "Postavit budovu"
 suggestion_construct_building: "Doporučení: Postav budovu na území [landed_title.GetNameNoTierNoTooltip]"
 suggestion_construct_building_desc: "Výstavba budov na území [landed_title.GetNameNoTooltip] ti přinese různé výhody a z dlouhodobého hlediska ti výrazně prospěje."
 suggestion_construct_building_click: "#I Kliknutím zobrazíš državu#!"
 suggestion_fabricate_claim_label: "Zfalšovat nárok"
 suggestion_fabricate_claim: "Doporučení: Zfalšuj nárok na [landed_title.GetNameNoTierNoTooltip]"
 suggestion_fabricate_claim_desc: "Území sousedního titulu [landed_title.GetName] je bohaté a vzkvétá, ale bez [Concept('casus_belli','casus belli')|E] je nemůžeš dobýt.\n\nKdyž pošleš svého [Concept('court_chaplain','dvorního kaplana')|E] nebo [Concept('realm_priest','vrchního duchovního')|E], aby na ně zfalšoval [Concept('claim','nárok')|E], získáš ospravedlnění potřebné k zahájení [Concept('war','války')|E] a budeš si je moci přivlastnit!"
 suggestion_fabricate_claim_click: "#I Kliknutím zobrazíš titul#!"
 suggestion_create_title_label: "Vytvořit titul"
 suggestion_create_title: "Doporučení: Vytvoř titul [landed_title.GetNameNoTooltip]"
 suggestion_create_title_desc: "Vlastníš dostatek území, jež [Concept('de_jure','de iure')|E] náleží k titulu [landed_title.GetName], abys jej mohl [Concept('create','vytvořit')|E]. Tím výrazně zvýšíš svou [Concept('prestige','prestiž')|E] a staneš se [Concept('rightful_liege','právoplatným lenním pánem')|E] všech titulů, které pod něj spadají."
 suggestion_create_title_click: "#I Kliknutím zobrazíš titul#!"
 SUGGESTIONS_DEBUG: "#D LADĚNÍ DOPORUČENÍ:#!"
 suggestion_convert_county_label: "Obrátit hrabství na víru"
 suggestion_convert_county: "Doporučení: Obrať obyvatele [landed_title.GetNameNoTierNoTooltip] na svou víru"
 suggestion_convert_county_desc: "Oblast se stabilizuje, když [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|E] přesvědčí obyvatele [landed_title.GetName], aby přijali pravou víru."
 suggestion_convert_county_click: "#I Kliknutím zobrazíš svou radu#!"
 suggestion_increase_control_label: "Zvýšit kontrolu"
 suggestion_increase_control: "Doporučení: Zvyš kontrolu v [landed_title.GetNameNoTierNoTooltip]"
 suggestion_increase_control_desc: "Když [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )|E] zvýší kontrolu na území [landed_title.GetName], omezí tím [Concept('county_corruption','korupci v hrabství')|E] a může přinést i další prospěšné účinky."
 suggestion_increase_control_click: "#I Kliknutím zobrazíš svou radu#!"
 suggestion_increase_opinion_label: "Zlepšit mínění"
 suggestion_increase_opinion: "Doporučení: Zlepši [recipient.GetShortUINamePossessiveNoTooltip] mínění o tobě"
 suggestion_increase_opinion_desc: "[recipient.GetShortUIName] ([actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))]) má o tobě nízké [Concept('opinion','mínění')|E]. Když je zlepšíš pomocí [Concept('personal_scheme','osobní intriky')|E], usnadníš si život."
 suggestion_increase_opinion_click: "#I Kliknutím zahájíš intriku Přesvědčování#!"
 suggestion_raid_label: "Podniknout nájezd"
 suggestion_raid: "Doporučení: Podnikni nájezd na [landed_title.GetNameNoTierNoTooltip]"
 suggestion_raid_desc: "Když vyšleš svou armádu na [Concept('raid','nájezd')|E] proti [landed_title.GetNameNoTierNoTooltip], získáš [Concept('loot','kořist')|E]."
 suggestion_raid_click: "#I Kliknutím zobrazíš své vojsko#!"
 suggestion_grant_title_label: "Udělit titul"
 suggestion_grant_title: "Doporučení: Uděl titul [landed_title.GetNameNoTierNoTooltip] postavě [recipient.GetShortUINameNoTooltip]"
 suggestion_grant_title_desc: "Titul [landed_title.GetName] [Concept('de_jure','de iure')|E] náleží postavě [recipient.GetShortUIName]. Čím důsledněji bude uspořádání tvého panství odpovídat struktuře de iure, tím bude stabilnější a tím nižší budou postihy k mínění."
 suggestion_grant_title_click: "#I Kliknutím udělíš titul#!"
 suggestion_can_hire_court_positions: "Obsadit dvorské úřady"
 suggestion_can_hire_court_positions_label: "Doporučení: Obsaď další dvorské úřady"
 suggestion_can_hire_court_positions_desc: "Měl bys investovat část zlata do obsazení dalších [Concept('court_positions','dvorských úřadů')|E], abys získal jejich bonusy."
 suggestion_can_hire_court_positions_click: "#I Kliknutím zobrazíš dostupné dvorské úřady#!"
 suggestion_request_war_aid_petition: "Požádat o vojenskou pomoc"
 suggestion_request_war_aid_petition_label: "Doporučení: Požádej o vojenskou pomoc"
 suggestion_request_war_aid_petition_desc: "Můžeš požádat svého [Concept('liege','lenního pána')|E] o pomoc ve své [Concept('war','válce')|E]. Může se k ní připojit nebo ti zaplatit vojáky."
 suggestion_request_war_aid_petition_click: "#I Kliknutím zobrazíš [Concept('royal_court','královský dvůr')|E] svého [Concept('lieges','lenního pána')|E]#!"
 suggestion_create_nation_fracturing_faction: "Vytvořit $nation_fracturing_faction$"
 suggestion_create_nation_fracturing_faction_label: "Doporučení: $suggestion_create_nation_fracturing_faction$"
 suggestion_create_nation_fracturing_faction_desc: "Můžeš se vzepřít svému [Concept('liege','lennímu pánovi')|E] a pokusit se rozpustit panství, čímž zajistíš nezávislost sobě i všem ostatním [Concept('vassals','vazalům')|E]."
 suggestion_create_nation_fracturing_faction_click: "#I Kliknutím zobrazíš frakce namířené proti svému [Concept('liege','lennímu pánovi')|E]#!"
