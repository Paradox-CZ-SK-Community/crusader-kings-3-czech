l_polish:
 SUGGESTION_TITLE: "#T $NAME$#!"
 suggestion_recruit_maa_label: "Najmout oddíl ozbrojených mužů"
 suggestion_recruit_maa: "Doporučení: Najmout oddíl ozbrojených mužů"
 suggestion_recruit_maa_desc: "Máte méně [Concept('men_at_arms','ozbrojenci')|E] než je očekáváno u [Concept('ruler','vládce')|E] vaší [Concept('rank','hodnosti')|E].\n\nNajmutí několika posílí vaše [Concept('armies','armády')|E], což odradí potenciální nepřátele a zároveň pomůže v boji proti těm, kteří se i přesto rozhodnou bojovat." # todo: CONCEPT CASE
 suggestion_recruit_maa_click: "#I Klikněte pro zobrazení vašich vojsk#!"
 suggestion_declare_war_label: "Vyhlásit válku"
 suggestion_declare_war: "Doporučení: Vyhlásit válku [recipient.GetShortUINameNoTooltip]"
 suggestion_declare_war_desc: "Vítězství ve válce proti [recipient.GetShortUIName] vám umožní ovládnout více území a rozšířit své [Concept('realm','panství')|E], což pomůže zajistit dlouhodobý úspěch vaší [Concept('house','rod')|E]." # todo: CONCEPT CASE
 suggestion_declare_war_click: "#I Klikněte pro vyhlášení války#!"
 suggestion_construct_building_label: "Postavit budovu"
 suggestion_construct_building: "Doporučení: Postavit budovu v [landed_title.GetNameNoTierNoTooltip]"
 suggestion_construct_building_desc: "Výstavba budov v [landed_title.GetNameNoTooltip] vám přinese různé výhody a dary, které vám v dlouhodobém horizontu značně prospějí."
 suggestion_construct_building_click: "#I Klikněte pro zobrazení državy#!"
 suggestion_fabricate_claim_label: "Vytvořit nárok"
 suggestion_fabricate_claim: "Doporučení: Vytvořit nárok na [landed_title.GetNameNoTierNoTooltip]"
 suggestion_fabricate_claim_desc: "Sousední [landed_title.GetName] je bohatý a prosperující, ale bez [Concept('casus_belli','casu belli')|E] ho nemůžete dobýt.\n\nPoslání vašeho [Concept('court_chaplain','dvorního kaplana')|E] nebo [Concept('realm_priest','vrchní duchovní')|E] k vyhotovení [Concept('claim','nároku')|E] na něj vám poskytne záminku potřebnou k vedení [Concept('war','válce')|E] a získání titulu pro sebe!" # todo: CONCEPT CASE
 suggestion_fabricate_claim_click: "#I Klikněte pro zobrazení titulu#!"
 suggestion_create_title_label: "Vytvořit titul"
 suggestion_create_title: "Doporučení: Vytvořit [landed_title.GetNameNoTooltip]"
 suggestion_create_title_desc: "Vlastníte dostatek [Concept('de_jure','de iure')|E] půdy, abyste [Concept('create','vytvořit')|E] [landed_title.GetName]. Učinění toho by výrazně zvýšilo vaše [Concept('prestige','prestiž')|E] a udělalo by z vás [Concept('rightful_liege','právoplatného lenního pána')|E] všech titulů pod ním." # todo: CONCEPT CASE
 suggestion_create_title_click: "#I Klikněte pro zobrazení titulu#!"
 SUGGESTIONS_DEBUG: "#D LADĚNÍ NÁVRHŮ:#!"
 suggestion_convert_county_label: "Převést hrabství"
 suggestion_convert_county: "Doporučení: Převést víru v [landed_title.GetNameNoTierNoTooltip]"
 suggestion_convert_county_desc: "Poslání vašeho [Concept( 'realm_priest', GetPlayer.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName )|E], aby přesvědčil obyvatele [landed_title.GetName] k přijetí pravé víry, stabilizuje oblast."
 suggestion_convert_county_click: "#I Klikněte pro zobrazení vaší rady#!"
 suggestion_increase_control_label: "Zvýšit kontrolu"
 suggestion_increase_control: "Doporučení: Zvýšit kontrolu v [landed_title.GetNameNoTierNoTooltip]"
 suggestion_increase_control_desc: "Poslání vašeho [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )|E] pro zvýšení kontroly v [landed_title.GetName] povede k menšímu [Concept('county_corruption','korupcím v hrabství')|E] v hrabství a možná i k dalším příznivým efektům." # todo: CONCEPT CASE
 suggestion_increase_control_click: "#I Klikněte pro zobrazení vaší rady#!"
 suggestion_increase_opinion_label: "Zlepšit názor"
 suggestion_increase_opinion: "Doporučení: Zlepšit názor [recipient.GetShortUINamePossessiveNoTooltip] na vás"
 suggestion_increase_opinion_desc: "Váš [actor.Custom2('RelationToMeShort', SCOPE.sC('recipient'))] [recipient.GetShortUIName] má o vás nízké [Concept('opinion','mínění')|E]. Zlepšení pomocí [Concept('personal_scheme','osobní intriky')|E] vám usnadní život." # todo: CONCEPT CASE
 suggestion_increase_opinion_click: "#I Klikněte pro zahájení kampaně ovlivnění#!"
 suggestion_raid_label: "Přepad"
 suggestion_raid: "Doporučení: Přepadnout [landed_title.GetNameNoTierNoTooltip]"
 suggestion_raid_desc: "Poslání vaší armády na [Concept('raid','nájezd')|E] [landed_title.GetNameNoTierNoTooltip] by vám přineslo [Concept('loot','kořist')|E]." # todo: CONCEPT CASE
 suggestion_raid_click: "#I Klikněte pro zobrazení vašich vojsk#!"
 suggestion_grant_title_label: "Přidělit titul"
 suggestion_grant_title: "Doporučení: Přidělit [landed_title.GetNameNoTierNoTooltip] [recipient.GetShortUINameNoTooltip]"
 suggestion_grant_title_desc: "[recipient.GetShortUIName] je [Concept('de_jure','de iure')|E] držitelem [landed_title.GetName]. Dbání na to, aby vaše říše co nejvíce odpovídala de jure struktuře, vede ke stabilitě a menším názorovým penalizacím." # todo: CONCEPT CASE
 suggestion_grant_title_click: "#I Klikněte pro přidělení titulu#!"
 suggestion_can_hire_court_positions: "Obsadit dvorní funkce"
 suggestion_can_hire_court_positions_label: "Doporučení: Obsadit více dvorských funkcí"
 suggestion_can_hire_court_positions_desc: "Měli byste investovat zlato do obsazení více [Concept('court_positions','dvorské úřady')|E], abyste získali jejich bonusy." # todo: CONCEPT CASE
 suggestion_can_hire_court_positions_click: "#I Klikněte pro zobrazení dostupných dvorských funkcí#!"
 suggestion_request_war_aid_petition: "Požádat o vojenskou pomoc"
 suggestion_request_war_aid_petition_label: "Doporučení: Požádat o vojenskou pomoc"
 suggestion_request_war_aid_petition_desc: "Můžete požádat svého [Concept('liege','lenního pána')|E] o pomoc ve vaší [Concept('war','válce')|E]. Mohou se přidat nebo zaplatit za vojáky." # todo: CONCEPT CASE
 suggestion_request_war_aid_petition_click: "#I Klikněte pro zobrazení [lieges|E]'s [Concept('royal_court','královským dvorem')|E]#!" # todo: CONCEPT CASE
 suggestion_create_nation_fracturing_faction: "Vytvořit $nation_fracturing_faction$"
 suggestion_create_nation_fracturing_faction_label: "Doporučení: $suggestion_create_nation_fracturing_faction$"
 suggestion_create_nation_fracturing_faction_desc: "Můžete se vzepřít svému [Concept('liege','lennímu pánovi')|E] a pokusit se rozložit říši, abyste získali nezávislost pro sebe a všechny své [Concept('vassals','vazaly')|E]." # todo: CONCEPT CASE
 suggestion_create_nation_fracturing_faction_click: "#I Klikněte pro zobrazení frakcí proti vašemu [liege]#!"
