 TRAIT_LEVEL_TRACK_ENTRY_DESC: "#V Úroveň [TraitLevelTrackEntry.GetLevel]#!\n$TRAIT_LEVEL_TRACK_ENTRY_DESC_BASE$"
 TRAIT_LEVEL_TRACK_ENTRY_DESC_TT: "\n\n#S Úroveň [TraitLevelTrackEntry.GetLevel]#!\n$TRAIT_LEVEL_TRACK_ENTRY_DESC_BASE$"
 TRAIT_LEVEL_TRACK_TT: "#T [TraitLevelTrack.GetName]#!\nAktuální úroveň: [Character.GetTraitTrackLevel( Trait.Self, TraitLevelTrack.Self )|V] #weak ([ComplexBar.GetCurrentValue] [Concept('trait_level_track_xp','zkušeností rysu')|E])#!\n#flavor [TraitLevelTrack.GetDescription]#![AddLocalizationIf( GreaterThan_int32( TraitLevelTrackEntry.GetLevel, '(int32)0' ), 'TRAIT_LEVEL_TRACK_ENTRY_DESC_TT' )]"
