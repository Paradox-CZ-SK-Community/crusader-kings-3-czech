 ALREADY_HAS_TRAIT_IN_GROUP: "@warning_icon! #X Rys [TRAIT.GetName( CHARACTER.Self )] nelze přidat, protože $CHARACTER_NAME$ již má rys ze skupiny [TRAIT_GROUP.GetName] #weak ([TRAIT_2.GetName( CHARACTER.Self )])#!#!"
 SEX_MALE: "Muž"
 SEX_FEMALE: "Žena"
 trait_education_intrigue_1: "Neobratný pletichář"
 trait_education_intrigue_1_desc: "Neobratný pletichář získal jisté vzdělání v umění pletichaření, ale veškeré skutečné znalosti mu zůstaly utajeny."
 trait_education_intrigue_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] má za sebou jisté vzdělání v umění pletichaření, ale veškeré skutečné znalosti zůstaly nedosažitelné."
 trait_education_intrigue_2: "Okázalý šejdíř"
 trait_education_intrigue_2_desc: "Okázalý šejdíř získal vzdělání v umění pletichaření, ale stále se musí mnohému naučit, než se chyby a přehmaty stanou výjimkou namísto pravidla."
 trait_education_intrigue_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] získal[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] vzdělání v umění pletichaření, ale stále se musí mnohému naučit, než se chyby a přehmaty stanou výjimkou namísto pravidla."
 trait_education_intrigue_3: "Tkadlec intrik"
 trait_education_intrigue_3_desc: "Tkadlec intrik je mistrem pletichaření, manipulace a utajení."
 trait_education_intrigue_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] mistrně ovládá pletichaření, manipulaci a utajení."
 trait_education_intrigue_4: "Neuchopitelný stín"
 trait_education_intrigue_4_desc: "Neuchopitelný stín vyniká v umění pletichaření a rouška tajemství, která jej obklopuje, nemá obdoby."
 trait_education_intrigue_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] vyniká v umění pletichaření a rouška tajemství obklopující toto jméno nemá obdoby."
 trait_education_intrigue_5: "Úskočný loutkovodič"
 trait_education_intrigue_5_desc: "Úskočný loutkovodič je šeptem ve větru a stínem na zdi. Tam, kde slova nestačí, poslouží nůž."
 trait_education_intrigue_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] je šeptem ve větru a stínem na zdi. Tam, kde slova nestačí, poslouží nůž."
 trait_education_diplomacy_1: "Naivní usmiřovač"
 trait_education_diplomacy_1_desc: "Naivní usmiřovač získal jisté vzdělání v umění diplomacie, přesto však častěji přivádí do rozpaků sebe i své okolí, než aby dosáhl úspěchu."
 trait_education_diplomacy_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] má jisté vzdělání v umění diplomacie, přesto však častěji přivádí do rozpaků sebe i své okolí, než aby dosáhl[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] úspěchu."
 trait_education_diplomacy_2: "Obstojný vyjednavač"
 trait_education_diplomacy_2_desc: "Okolnosti často hrají ve prospěch obstojného vyjednavače, ale zda je to zásluhou diplomatického umu, nebo štěstí, zůstává sporné."
 trait_education_diplomacy_2_character_desc: "Okolnosti často hrají ve prospěch [ROOT.GetCharacter.GetFirstNameNoTooltip], ale zda je to zásluhou diplomatického umu, nebo štěstí, zůstává sporné."
 trait_education_diplomacy_3: "Charismatický vyjednavač"
 trait_education_diplomacy_3_desc: "Charismatický vyjednavač mistrně ovládá přesvědčivou rétoriku i jemné nuance diplomacie a je vynikajícím diplomatem."
 trait_education_diplomacy_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] mistrně ovládá přesvědčivou rétoriku i jemné nuance diplomacie a v diplomatickém umění skutečně vyniká."
 trait_education_diplomacy_4: "Šedá eminence"
 trait_education_diplomacy_4_desc: "Šedá eminence zná nuance diplomacie jako své boty a toto umění ovládá k dokonalosti."
 trait_education_diplomacy_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] zná nuance diplomacie jako své boty a toto umění ovládá k dokonalosti."
 trait_education_diplomacy_5: "Mistrný smírce"
 trait_education_diplomacy_5_desc: "Stříbrný jazyk mistrného smírce dokáže obměkčit i nejtvrdší srdce a otevřít i ty nejpevněji zatarasené dveře."
 trait_education_diplomacy_5_character_desc: "Stříbrný jazyk [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] dokáže obměkčit i nejtvrdší srdce a otevřít i ty nejpevněji zatarasené dveře."
 trait_education_stewardship_1: "Rozmařilý marnotratník"
 trait_education_stewardship_1_desc: "Rozmařilý marnotratník získal vzdělání ve správě, aby porozuměl toku peněz, ale ten bohužel jako by směřoval pouze jedním směrem..."
 trait_education_stewardship_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] má vzdělání ve správě a měl[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] se naučit rozumět toku peněz, ale ten bohužel jako by směřoval pouze jedním směrem..."
 trait_education_stewardship_2: "Spořivý písař"
 trait_education_stewardship_2_desc: "Spořivý písař si vede obstojně v investicích a správních záležitostech, ale přehmaty v umění správy jsou stále pravidlem."
 trait_education_stewardship_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] si vede obstojně v investicích a správních záležitostech, ale přehmaty v umění správy jsou stále pravidlem."
 trait_education_stewardship_3: "Strůjce jmění"
 trait_education_stewardship_3_desc: "Strůjce jmění má vytříbený cit pro veškeré záležitosti správy a představuje správní sílu, se kterou je nutné počítat."
 trait_education_stewardship_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] má vytříbený cit pro veškeré záležitosti správy a představuje správní sílu, se kterou je nutné počítat."
 trait_education_stewardship_4: "Midasův dotek"
 trait_education_stewardship_4_desc: "Koho obdařil Midasův dotek, toho v umění správy provází jeden úspěch za druhým a jeho mistrovství nelze zpochybnit."
 trait_education_stewardship_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] v umění správy provází jeden úspěch za druhým a dosažené mistrovství nelze zpochybnit."
 trait_education_stewardship_5: "Zlatý panovník"
 trait_education_stewardship_5_desc: "Zlatý panovník dokáže pouhým zlomkem pozornosti dovést upadající podnik k rozkvětu a přivést bohatství tam, kde dříve vládla platební neschopnost."
 trait_education_stewardship_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] dokáže pouhým zlomkem pozornosti dovést upadající podnik k rozkvětu a přivést bohatství tam, kde dříve vládla platební neschopnost."
 trait_education_martial_1: "Pomýlený válečník"
 trait_education_martial_1_desc: "Pomýlený válečník získal vzdělání ve válečném umění, ale spíše ublíží sobě než svým nepřátelům."
 trait_education_martial_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] má vzdělání ve válečném umění, ale spíše ublíží sobě než svým nepřátelům."
 trait_education_martial_2: "Otrlý voják"
 trait_education_martial_2_desc: "Otrlý voják prokázal jisté nadání ve válečnictví, ale stále se musí mnohému naučit."
 trait_education_martial_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] prokazuje jisté nadání ve válečnictví, ale stále se musí mnohému naučit."
 trait_education_martial_3: "Zkušený taktik"
 trait_education_martial_3_desc: "Zkušený taktik je spolehlivý velitel a obávaný válečník proslulý svým válečnickým umem."
 trait_education_martial_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] spolehlivě velí, v boji nahání hrůzu a svým válečnickým umem si získal[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] věhlas."
 trait_education_martial_4: "Brilantní stratég"
 trait_education_martial_4_desc: "Bojiště je doménou brilantního stratéga a žádná válečnická záležitost nepřesahuje jeho znalosti."
 trait_education_martial_4_character_desc: "Na bojišti je [ROOT.GetCharacter.GetFirstNameNoTooltip] jako doma a vyzná se ve všech válečnických záležitostech."
 trait_education_martial_5: "Věhlasný vojevůdce"
 trait_education_martial_5_desc: "Věhlasný vojevůdce s naprostou lehkostí překonává na bojišti zdánlivě nepřekonatelnou přesilu a jediným obratným manévrem zvrací průběh celého tažení."
 trait_education_martial_5_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] s naprostou lehkostí překonává na bojišti zdánlivě nepřekonatelnou přesilu a jediným obratným manévrem zvrací průběh celého tažení."
 trait_education_martial_prowess_1: "Nešikovný panoš"
 trait_education_martial_prowess_1_desc: "Nešikovný panoš je rytířem spíše jen podle jména a ze svého řádného výcviku si pamatuje pramálo."
 trait_education_martial_prowess_1_character_desc: "U [ROOT.GetCharacter.GetFirstNameNoTooltip] je rytířství spíše pouhou formalitou a z řádného výcviku si pamatuje pramálo."
 trait_education_martial_prowess_2: "Sebejistý rytíř"
 trait_education_martial_prowess_2_desc: "Sebejistý rytíř zná tradiční bojové postupy své kultury a už v dospívání se dokonce účastnil několika střetů se vzpurnými sedláky."
 trait_education_martial_prowess_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] zná tradiční bojové postupy své kultury a už v dospívání se dokonce účastnil[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] několika střetů se vzpurnými sedláky."
 trait_education_martial_prowess_3: "Obávaný korouhevník"
 trait_education_martial_prowess_3_desc: "Obávaný korouhevník vedl vojsko a bojoval s bandity už před dosažením dospělosti a bitevní zkušenosti z něj učinily odhodlaného bojovníka."
 trait_education_martial_prowess_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] získal[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] už před dosažením dospělosti zkušenosti s velením vojsku i bojem proti banditům a bitevní zkoušky zocelily bojového ducha."
 trait_education_martial_prowess_4: "Proslulý šampion"
 trait_education_martial_prowess_4_desc: "Proslulý šampion je v celém panství známý, vážený a možná i obávaný jako zosobnění válečnických tradic své kultury."
 trait_education_martial_prowess_4_character_desc: "Po celém panství budí [ROOT.GetCharacter.GetFirstNameNoTooltip] obdiv, úctu a možná i strach jako zosobnění válečnických tradic, jimiž se vyznačuje [ROOT.Char.GetCulture.GetName] kultura."
 trait_education_martial_prowess_5: "Rtuťová čepel"
 trait_education_martial_prowess_5_desc: "O bojovém mistrovství Rtuťové čepele se mluví šeptem; už pouhé jméno přiměje i nejzkušenějšího veterána zaváhat."
 trait_education_martial_prowess_5_character_desc: "O [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] bojovém mistrovství se mluví šeptem; už pouhé jméno přiměje i nejzkušenějšího veterána zaváhat."
 trait_education_learning_1: "Svědomitý písař"
 trait_education_learning_1_desc: "Navzdory vzdělání zaměřenému na učenost projevuje Svědomitý písař pro tento obor jen malé nadání — alespoň umí číst..."
 trait_education_learning_1_character_desc: "Navzdory vzdělání zaměřenému na učenost projevuje [ROOT.GetCharacter.GetFirstNameNoTooltip] pro tento obor jen malé nadání — alespoň umí číst..."
 trait_education_learning_2: "Vnímavý myslitel"
 trait_education_learning_2_desc: "Vnímavý myslitel se vyzná ve většině teologických otázek, ale skutečné schopnosti i píle mu bohužel scházejí."
 trait_education_learning_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se vyzná ve většině teologických otázek, ale skutečné schopnosti i píle bohužel scházejí."
 trait_education_learning_3: "Důvtipný učenec"
 trait_education_learning_3_desc: "Důvtipný učenec hluboce rozumí teologii, filozofii i všem oborům vyššího vědění."
 trait_education_learning_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] hluboce rozumí teologii, filozofii i všem oborům vyššího vědění."
 trait_education_learning_4: "Geniální filozof"
 trait_education_learning_4_desc: "Geniální filozof má až neobyčejně pronikavý vhled do všech oblastí vyššího vědění."
 trait_education_learning_4_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] má až neobyčejně pronikavý vhled do všech oblastí vyššího vědění."
 trait_education_learning_5: "Všeznalý mudrc"
 trait_education_learning_5_desc: "Znalosti Všeznalého mudrce o božském i světském nemají obdoby a jeho rady vyhledávají nejvýznamnější osobnosti učených kruhů."
 trait_education_learning_5_character_desc: "Rozsah [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] znalostí božského i světského nemá obdoby; o radu žádají nejvýznamnější osobnosti učených kruhů."
 trait_diplomat: "Diplomat"
 trait_diplomat_desc: "Diplomat obratně proplouvá nebezpečnými vodami společenských vztahů a při vyjednávání mezi nejmocnějšími vládci země dosahuje svých cílů díky oslnivému charismatu a přesvědčivosti."
 trait_diplomat_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] obratně proplouvá nebezpečnými vodami společenských vztahů a při vyjednávání mezi nejmocnějšími vládci země dosahuje svých cílů díky oslnivému charismatu a přesvědčivosti."
 trait_family_first: "Rodina na prvním místě"
 trait_family_first_neutral: "Hlava rodiny"
 trait_family_first_male: "Patriarcha"
 trait_family_first_female: "Matriarcha"
 trait_family_first_desc: "Člověk, který je skutečně oddán své rodině a rozkvětu svého rodu."
 trait_family_first_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] je skutečně [Select_CString( ROOT.Char.IsFemale, 'oddaná', 'oddaný' )] své rodině a rozkvětu svého rodu."
 trait_august: "Vznešenost"
 trait_august_desc: "Této postavě se dostává úcty jako pravému vládci hodnému dávných říší!"
 trait_august_character_desc: "[ROOT.Char.GetFirstNameNoTooltip] se těší úctě jako pravý vládce hodný dávných říší!"
 trait_reveler_1: "Dychtivý hýřil"
 trait_reveler_1_desc: "Dychtivý hýřil okusil opojný život plný radovánek a prostopášností a touží po dalších."
 trait_reveler_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] okusil[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] opojný život plný radovánek a prostopášností a touží po dalších."
 trait_reveler_2: "Proslulý hýřil"
 trait_reveler_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] je duší každého shromáždění a přitahuje prostopášnost i lesk."
 trait_reveler_3: "Legendární hýřil"
 trait_reveler_3_character_desc: "Jídlo, pití, opojení těla i mysli — [ROOT.GetCharacter.GetFirstNameNoTooltip] si nic neodpírá a je středem každé hostiny."
 trait_blademaster_1: "Ctižádostivý šermíř"
 trait_blademaster_1_desc: "Ctižádostivý šermíř je obratný v osobním boji a dobře ví, kterým koncem čepele bodat."
 trait_blademaster_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] je obratný[Select_CString( ROOT.GetCharacter.IsFemale, 'á', '' )] v osobním boji a dobře ví, kterým koncem čepele bodat."
 trait_blademaster_2: "Mistr čepele"
 trait_blademaster_2_character_desc: "V každém druhu boje budí [ROOT.GetCharacter.GetFirstNameNoTooltip] respekt i obavy."
 trait_blademaster_3: "Legendární mistr čepele"
 trait_blademaster_3_character_desc: "O [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] zdatnosti se vyprávějí příběhy."
 trait_hunter_1: "Začínající lovec"
 trait_hunter_1_desc: "Začínající lovec obratně odpovídá na volání divočiny i luku."
 trait_hunter_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] obratně odpovídá na volání divočiny i luku."
 trait_hunter_2: "Lovec"
 trait_hunter_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se pohybuje divočinou s neobyčejnou přesností a znalostí."
 trait_hunter_3: "Mistr lovu"
 trait_hunter_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] žije pro okamžik skolení kořisti."
 trait_strategist: "Stratég"
 trait_strategist_desc: "Oddaný znalec válečného umění, který dokáže obrátit každou situaci ve svůj prospěch."
 trait_strategist_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se oddaně věnuje válečnému umění a dokáže obrátit každou situaci ve svůj prospěch."
 trait_overseer: "Dohlížitel"
 trait_overseer_desc: "Vedení, pevná ruka a autorita potřebné k tomu, aby byly problémy náležitě vyřešeny."
 trait_gallant: "Šlechetný"
 trait_gallant_desc: "Pravá ušlechtilost nepochází pouze z krve, ale také z činů vedených duchem kaleným jako zářivá ocel."
 trait_architect: "Architekt"
 trait_architect_desc: "Díla zkušeného stavitele přetrvají celá staletí."
 trait_administrator: "Správce"
 trait_administrator_desc: "Organizovat, spravovat a zvyšovat efektivitu – správce vše zařídí."
 trait_administrator_character_desc: "Organizovat, spravovat a zvyšovat efektivitu – [ROOT.GetCharacter.GetFirstNameNoTooltip] vše zařídí."
 trait_avaricious: "Hrabivý"
