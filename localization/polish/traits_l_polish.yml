 trait_track_open_terrain_expert: "Specialista na otevřený terén"
 trait_track_open_terrain_expert_desc: "#help Zkušenosti na této cestě získáváš bojem na pláních, zemědělské půdě nebo ve stepi.#!\n\nOtevřené bojiště nabízí neomezené možnosti k obchvatu a přemožení nepřítele."
 trait_rough_terrain_expert: "Znalec členitého terénu"
 trait_rough_terrain_expert_1: "Průkopník"
 trait_rough_terrain_expert_2: "Taktik vysočin"
 trait_rough_terrain_expert_3: "Mistr vrcholů"
 trait_rough_terrain_expert_desc: "Obtížný terén může být mocným nástrojem pro ty, kteří jej dokážou využít a získat v bitvě převahu."
 trait_rough_terrain_expert_character_desc: "Obtížný terén může být mocným nástrojem pro ty, kteří jej dokážou využít a získat v bitvě převahu."
 trait_track_rough_terrain_expert: "Specialista na členitý terén"
 trait_track_rough_terrain_expert_desc: "#help Zkušenosti na této cestě získáváš bojem v kopcích, horách nebo mokřadech.#!\n\nV nejdrsnějším terénu vítězí ti, kteří se dokážou postavit každé výzvě."
 trait_forest_fighter: "Lesní bojovník"
 trait_forest_fighter_1: "Stopař hvozdů"
 trait_forest_fighter_2: "Strážce lesa"
 trait_forest_fighter_3: "Mistr hvozdů"
 trait_forest_fighter_desc: "Kde jiní vidí v lesích překážky, tato postava spatřuje příležitosti."
 trait_forest_fighter_character_desc: "Kde jiní vidí v lesích překážky, [ROOT.GetCharacter.GetFirstNameNoTooltip] spatřuje příležitosti."
 trait_track_forest_fighter: "Specialista na les"
 trait_track_forest_fighter_desc: "#help Zkušenosti na této cestě získáváš bojem v lesích nebo tajze.#!\n\nMezi stromy se každý stín stává štítem a každá větev spojencem."
 trait_cautious_leader: "Opatrný velitel"
 trait_cautious_leader_1: "Trpělivý stratég"
 trait_cautious_leader_2: "Obezřetný velitel"
 trait_cautious_leader_3: "Mistr trpělivosti"
 trait_cautious_leader_desc: "Opatrný velitel se v bitvách vyhýbá veškerým zbytečným rizikům, avšak za cenu možných zisků."
 trait_cautious_leader_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se v bitvách vyhýbá veškerým zbytečným rizikům, avšak za cenu možných zisků."
 trait_track_cautious_leader: "Tradiční velitel"
 trait_track_cautious_leader_desc: "#help Zkušenosti na této cestě získáváš bojem proti armádám větším než ta tvá.#!\n\nTrpělivost a přesnost zajišťují, že každý tah má význam a každá ztráta je co nejmenší."
 trait_organizer: "Organizátor"
 trait_organizer_1: "Taktik"
 trait_organizer_2: "Plánovač tažení"
 trait_organizer_3: "Mistr tažení"
 trait_organizer_desc: "V schopných rukou může dobře uspořádaná armáda v každé situaci rychle vymanévrovat nepřítele."
 trait_organizer_character_desc: "V rukou [ROOT.GetCharacter.GetFirstNameNoTooltip] může dobře uspořádaná armáda v každé situaci rychle vymanévrovat nepřítele."
 trait_track_organizer: "Velitel pochodu"
 trait_track_organizer_desc: "#help Zkušenosti na této cestě získáváš vedením armády při pohybu po mapě.#!\n\nDobře koordinované vojsko se pohybuje rychle a útočí přesně."
 trait_winter_soldier: "Zimní voják"
 trait_winter_soldier_1: "Strážce mrazu"
 trait_winter_soldier_2: "Mrazem zocelený veterán"
 trait_winter_soldier_3: "Mistr chladu"
 trait_winter_soldier_desc: "Tuto postavu zocelil krutý chlad a ona jej dokáže obrátit ve svůj prospěch."
 trait_winter_soldier_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] je zocelen[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] krutým chladem a dokáže jej obrátit ve svůj prospěch."
 trait_track_winter_soldier: "Zimní stopař"
 trait_track_winter_soldier_desc: "#help Zkušenosti na této cestě získáváš bojem v provinciích zasažených zimou.#!\n\nMrazivý chlad není nepřítelem – pro ty, kteří vydrží a vytrvají, se stává spojencem."
 trait_sea_raider: "Mořský nájezdník"
 trait_sea_raider_desc: "Mořský nájezdník se nebojí drsných živlů na moři a díky odvaze a obratné plavbě dokáže bez varování udeřit na nechráněné pobřeží."
 trait_sea_raider_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se nebojí drsných živlů na moři a díky odvaze a obratné plavbě dokáže bez varování udeřit na nechráněné pobřeží."
 trait_disinherited: "Vyděděný"
 trait_disinherited_desc: "Tato postava byla vyděděna [Concept('dynast','hlavou dynastie')|E] a nemůže zdědit žádný titul po jiném členu dynastie."
 trait_disinherited_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] přišel rozhodnutím [Concept('dynast','hlavy dynastie')|E] o dědická práva a nemůže zdědit žádný titul po jiném členu dynastie."
 trait_denounced: "Odsouzený"
 trait_denounced_desc: "Tato postava byla odsouzena [Concept('dynast','hlavou dynastie')|E] a nyní ji může uvěznit kterýkoli jiný člen dynastie."
 trait_denounced_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] byl[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] odsouzen[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [Concept('dynast','hlavou dynastie')|E] a nyní může být uvězněn[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] kterýmkoli jiným členem dynastie."
 trait_decadent: "Obviněný z dekadence"
 trait_decadent_desc: "Tuto postavu obvinila [Concept('house_head','hlava jejího rodu')|E] z dekadence. Ať už jsou tato obvinění pravdivá, či nikoli, její pověst a důvěryhodnost značně utrpěly."
 trait_decadent_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] byl[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] [Concept('house_head','hlavou rodu')|E] obviněn[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] z dekadence. Ať už jsou tato obvinění pravdivá, či nikoli, pověst a důvěryhodnost této postavy značně utrpěly."
 trait_extolled: "Oslavovaný rodem"
 trait_extolled_desc: "[Concept('house_head','Hlava rodu')|E] vyzdvihla ctnosti této postavy. Ať už je tato pozornost zasloužená, či nikoli, před zvědavými zraky veřejnosti nyní uniká jen obtížně."
 trait_extolled_character_desc: "[Concept('house_head','Hlava rodu')|E] vyzdvihla ctnosti [ROOT.GetCharacter.GetFirstNameNoTooltip]. Ať už je tato pozornost zasloužená, či nikoli, před zvědavými zraky veřejnosti nyní tato postava uniká jen obtížně."
 trait_gallivanter: "Zahaleč"
 trait_gallivanter_desc: "Tato postava se vyhýbá všem povinnostem nad rámec těch, které již má – její čas je drahocenný a nechce jím plýtvat na zbytečné závazky a bezvýznamné ambice."
 trait_gallivanter_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se vyhýbá všem povinnostem nad rámec těch, které již má – čas této postavy je drahocenný a nemá být promarněn zbytečnými závazky a bezvýznamnými ambicemi."
