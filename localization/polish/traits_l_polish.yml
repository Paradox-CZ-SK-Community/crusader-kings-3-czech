 game_concept_clouded_eyes_mitigation: "Zmírnění zakalených očí"
 game_concept_clouded_eyes_mitigation_desc: "Zhoršování rysu [GetTrait('clouded_eyes').GetName( GetNullCharacter )] nelze zastavit, ale lze je zpomalit:\n$EFFECT_LIST_BULLET$Vyhýbáním se [Concept('travel','cestování')|E]\n$EFFECT_LIST_BULLET$Vyhýbáním se lokalitám s typem [Concept('terrain','terénu')|E] [GetTerrain( 'desert' ).GetName] nebo [GetTerrain( 'desert_mountains' ).GetName]\n$EFFECT_LIST_BULLET$Vyhýbáním se lokalitám s [Concept('winter_severity_normal','běžnou zimou')|E] nebo [Concept('winter_severity_harsh','krutou zimou')|E]"
 game_concept_fragile_bones_mitigation: "Zmírnění křehkých kostí"
 game_concept_fragile_bones_mitigation_desc: "Zhoršování rysu [GetTrait('fragile_bones').GetName( GetNullCharacter )] nelze zastavit, ale výraznému postupu po [Concept('trait_level_track','cestě rysu')|E] lze zabránit:\n$EFFECT_LIST_BULLET$Vyhýbáním se [Concept('travel','cestování')|E] a [Concept('activities','aktivitám')|E]\n$EFFECT_LIST_BULLET$Vyhýbáním se [Concept( 'commander', 'velení armádám' )|E]"
 game_concept_withering_mind_mitigation: "Zmírnění chřadnoucí mysli"
 game_concept_withering_mind_mitigation_desc: "Zhoršování rysu [GetTrait('withering_mind').GetName( GetNullCharacter )] nelze zastavit, ale lze je zpomalit:\n$EFFECT_LIST_BULLET$Mít [Concept('friends','přátele')|E] #weak (čím více, tím lépe)#!\n$EFFECT_LIST_BULLET$Mít [Concept('lovers','milence')|E] #weak (čím více, tím lépe)#!\n$EFFECT_LIST_BULLET$Udržovat nízkou úroveň [Concept('stress','stresu')|E]\n$EFFECT_LIST_BULLET$Mít [Concept('traits','rysy')|E] [GetTrait('family_first').GetName( GetNullCharacter )] nebo [GetTrait('seducer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[Concept('traveling','Cestováním')|E] a účastí na [Concept('activities','aktivitách')|E]\n\nMnohé z těchto faktorů také snižují pravděpodobnost, že tento [Concept('trait','rys')|E] vůbec získáš."
 game_concept_infirm_mitigation: "Zmírnění neduživosti"
 game_concept_infirm_mitigation_desc: "Hlavním způsobem, jak oddálit neduživost, je udržovat si dobré zdraví.\n\n[Concept('trait','Rys')|E] [GetTrait('infirm').GetName( GetNullCharacter )] postoupí o celou úroveň při onemocnění [Concept('illness','nemocí')|E] a každý rok postupuje o malou část.\n\nPokud nemoc trvá delší dobu, bude [Concept('trait_level_track','cesta rysu')|E] každý rok postupovat mnohem rychleji. Její postup se výrazně zrychlí také po dosažení věku 65 let."
 game_concept_elder_traits: "Zdravotní rysy stáří"
 game_concept_elder_traits_desc: "Jak [Concept('characters','postavy')|E] stárnou, mohou získávat věkem podmíněné [Concept('traits','rysy')|E], jako jsou [GetTrait('faltering_heart').GetName( GetNullCharacter )] nebo [GetTrait('fragile_bones').GetName( GetNullCharacter )]. Obvykle se objevují kolem #V 50#! let, ale mohou se projevit i dříve.\n\nJejich získání je méně pravděpodobné, pokud máš:\n$BULLET_WITH_TAB$Dobré [Concept('health','zdraví')|E]\n$BULLET_WITH_TAB$[GetTrait('athletic').GetName( GetNullCharacter )], [GetTrait('physique_good_1').GetName( GetNullCharacter )] nebo [GetTrait('whole_of_body').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$#indent_newline:6 V případě rysu [GetTrait('withering_mind').GetName( GetNullCharacter )]: [GetTrait('family_first').GetName( GetNullCharacter )], [GetTrait('seducer').GetName( GetNullCharacter )], znalost [Concept('languages','jazyků')|E] a mnoho [Concept('friends','přátel')|E] a [Concept('lovers','milenců')|E]#!\n\nJejich získání je pravděpodobnější, pokud máš:\n$BULLET_WITH_TAB$Špatné [Concept('health','zdraví')|E]\n$BULLET_WITH_TAB$[GetTrait('drunkard').GetName( GetNullCharacter )] nebo [GetTrait('reclusive').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetModifier( 'obese_modifier' ).GetNameWithTooltip] nebo [GetModifier( 'malnourished_modifier' ).GetNameWithTooltip]\n$BULLET_WITH_TAB$Vysokou úroveň [Concept('stress','stresu')|E]\n$BULLET_WITH_TAB$Rodiče či prarodiče s těmito rysy"
