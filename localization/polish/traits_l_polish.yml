 trait_tourney_participant_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] má díky bojovým hrám vytříbené dovednosti ve válečnictví a osobním boji."
 trait_track_foot: "Pěší boj"
 trait_track_foot_desc: "Lidské tělo je tím nejdokonalejším nástrojem a jeho ovládnutí ti otevře cestu k celému světu."
 trait_track_horse: "Jízda"
 trait_track_horse_desc: "Kůň a jezdec v dokonalém souladu, velkolepí a svobodní pod nekonečnou modrou oblohou."
 trait_track_bow: "Lukostřelba"
 trait_track_bow_desc: "Napětí tětivy a síla lučištníka se spojí, aby vyslaly šíp přímo do cíle."
 trait_track_wit: "Důvtip"
 trait_track_wit_desc: "Síla slábne a krása uvadá, ale bystrá mysl tě provede i těmi nejtemnějšími situacemi."
 trait_lifestyle_hunter_desc: "Tato postava vyslyšela volání divočiny."
 trait_lifestyle_hunter_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] neodolá volání divočiny."
 trait_track_hunter: "Lovec"
 trait_track_hunter_desc: "Zvuk rohů, psi, kořist! Ať už s lukem, nebo ze sedla, nic se nevyrovná vzrušení ze skolení divoké zvěře!"
 trait_track_falconer: "Sokolník"
 trait_track_falconer_desc: "Není vznešenější kratochvíle než lov s jestřábem či sokolem."
 trait_track_lifestyle_mystic: "Mystik"
 trait_track_lifestyle_mystic_desc: "Při dostatečném rozjímání se odhalí všechna tajemství světa, hmotná i nehmotná."
 trait_track_pilgrim: "Poutník"
 trait_track_pilgrim_desc: "Mozolnatá chodidla, bolavé údy, ošlehaná tvář. To vše je malá cena za splnění svaté povinnosti."
 trait_track_lifestyle_reveler: "Hýřil"
 trait_track_lifestyle_reveler_desc: "Pohár a smích v dobré společnosti. Co víc si od života přát?"
 trait_track_lifestyle_blademaster: "Mistr čepele"
 trait_track_lifestyle_blademaster_desc: "Roky života strávené mistrovstvím se zbraní, jejíž ladnost může jednoho dne zachránit jeden život a jiný ukončit."
 trait_track_lifestyle_physician: "Lékař"
 trait_track_lifestyle_physician_desc: "Tady zastavit krvácení, tam otevřít žílu. Tělesné šťávy budou brzy opět v rovnováze!"
 trait_track_lifestyle_poet: "Poezie"
 trait_track_lifestyle_poet_desc: "Slova mohou přinést věčnou slávu a pero dokáže tnout hlouběji než nejostřejší čepel."
 trait_governor: "Guvernér"
 trait_track_governor: "$trait_governor$"
 trait_track_governor_desc: "Daně. Půda. Vojsko. Vše lze a mělo by být spravováno k dokonalosti.\n\n#weak Úroveň tohoto [Concept('trait','rysu')|E] lze zvyšovat činnostmi, které zvelebují držená [Concept('counties','hrabství')|E] nebo prospívají [Concept('realm','panství')|E], například řešením [Concept('governance_issues','správních záležitostí')|E], výstavbou [Concept('buildings','budov')|E] nebo volbou určitých možností v událostech.#!"
 trait_governor_desc: "Tato postava získala při výkonu úřadu guvernéra cenné dovednosti."
 trait_governor_3_byz: "Ostřílený $duke_administrative_male_byzantine_group|l$"
 trait_governor_3: "Ostřílený guvernér"
 trait_governor_2_byz: "Zkušený $duke_administrative_male_byzantine_group|l$"
 trait_governor_2: "Zkušený guvernér"
 trait_governor_1_byz: "$duke_administrative_male_byzantine_group$"
 trait_governor_1_byz_female: "$duke_administrative_female_byzantine_group$"
 trait_governor_1: "Guvernér"
 trait_governor_3_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] vyniká ve správě i soudnictví, a proto se pro úřad guvernéra dokonale hodí."
 trait_governor_2_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] má bohaté zkušenosti se správou zemí a v úřadu guvernéra si vede dobře."
 trait_governor_1_character_desc: "Působení v úřadu guvernéra poskytlo [ROOT.GetCharacter.GetFirstNameNoTooltip] cenné dovednosti."
 trait_gallowsbait: "Šibeniční ptáček"
 trait_gallowsbait_desc: "Ne každý zločin se týká mocných a urozených – tato postava si začíná získávat pověst drobného zločince."
 trait_gallowsbait_character_desc: "Ne každý zločin se týká mocných a urozených — [ROOT.GetCharacter.GetFirstNameNoTooltip] se mezi drobnými zločinci nechvalně proslavil[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )]."
 trait_track_bandit: "Loupežník"
 trait_track_bandit_desc: "Světlo zákona nedosahuje daleko za městské hradby; tady venku platí právo silnějšího."
 trait_track_trickster: "Šejdíř"
 trait_track_trickster_desc: "Cizí mdlý rozum není jen neštěstí — pro bystré je to #EMP příležitost#!."
 trait_track_thief: "Zloděj"
 trait_track_thief_desc: "Držba koneckonců tvoří devět desetin práva."
 trait_track_poacher: "Pytlák"
 trait_track_poacher_desc: "Když jde jen o zvíře, nikomu se nic nestalo. Že?"
 trait_track_marauder: "Pustošitel"
 trait_track_marauder_desc: "Unášet a vraždit mimo vysokou společnost je méně okouzlující, ale nemusí to být méně výnosné."
 trait_despoiler_of_byzantium: "Plenitel Byzance"
 trait_despoiler_of_byzantium_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] patřil[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] mezi obávané latinské pány, kteří dobyli a zpustošili starobylou křesťanskou říši."
 trait_campeador: "Campeador"
 trait_campeador_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] si díky svému mistrovství na bojišti vysloužil[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] titul „Šampion bojiště“."
 trait_violet_poet: "Fialový básník"
 trait_violet_poet_desc: "Co rozezpívá srdce a rozezní hlas mocněji než sama láska? [ROOT.GetCharacter.GetFirstNameNoTooltip] to ví a ovládá její sílu jako nikdo jiný."
 trait_track_violet_poet: "Rapsód"
 trait_track_violet_poet_desc: "Nejpravdivější básníkovo vyjádření nemůže spočívat pouze ve slovech, ale také v duši a těle.\n\n#weak Úroveň tohoto [Concept('trait','rysu')|E] lze zvyšovat dvěma způsoby: skládáním poezie nebo poněkud #UND milostnějšími#! metodami."
 trait_knight_errant: "Potulný rytíř"
 trait_knight_errant_character: "$knight_culture_player_no_tooltip$ na cestách"
 trait_knight_errant_desc: "Tato postava si získala rytířský věhlas obranou slabých, ochranou neozbrojených a porážením zlosynů."
 trait_knight_errant_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] je proslul[Select_CString( ROOT.GetCharacter.IsFemale, 'á', 'ý' )] jako $knight_culture_player_no_tooltip_lowercase$, který brání slabé, chrání neozbrojené a poráží zlosyny."
 trait_track_knight_errant: "Konatel dobra"
 trait_track_knight_errant_desc: "Nestačí prohlašovat se za spravedlivého, je třeba to také dokázat.\n\n#weak Úroveň tohoto [Concept('trait','rysu')|E] lze zvyšovat plněním [Concept('task_contracts','smluvních úkolů')|E] zaměřených na výkon spravedlnosti, zdatnost nebo vojenství, které prokazují čestné vlastnosti."
 the_wake: "Bdělý"
 trait_track_the_wake: "Slídil močálů"
 trait_track_the_wake_desc: "Osud spřádá svou jemnou síť. Co mi právem náleží, získám zpět silou.\n\n#weak Úroveň tohoto rysu lze zvyšovat porážením [Concept('characters','postav')|E], jejichž [Concept('culture','kultura')|E] je #BOL $norman$#!, v [Concept('battle','bitvě')|E] nebo v [Concept('single_combat_duel_plural','soubojích')|E].#!"
 the_wake_1: "Vyhnanec"
 the_wake_2: "Psanec"
 the_wake_3: "Řezník"
 the_wake_4: "Ankou"
 the_wake_5: "$the_wake$"
 the_wake_1_desc: "Litujte mladého Herewarda, vyhnaného šlechtice. Muže bez cíle, netečného tuláka. Tolik možností, a přece zůstávají nenaplněny."
 the_wake_2_desc: "Cíl byl nalezen, ale zbývá vykonat mnoho práce. Krvavé práce, dokud kalné močály nezrudnou krví cizinců."
 the_wake_3_desc: "Slabší muži se zmítají a tonou v lepkavých, páchnoucích bažinách, odkud tento muž pochází. Někteří dokonce šeptají, že dokáže kráčet po hladině každého močálu, tak dokonale ovládá zdejší tůně."
 the_wake_4_desc: "Vyděšeným dětem se vyprávějí příběhy o šelmě slídící v močálech, aby se příliš nevzdalovaly z bezpečí."
 the_wake_5_desc: "Temný stín za soumraku slídí krajinou, stále bdělý, stále ve střehu. Hereward Krvavý, Hereward Obávaný. Hereward Bdělý."
 norman_opinion: "Mínění Normanů"
 TRAIT_FLAG_DESC_can_raid: "Umožňuje podnikat [Concept('raiding','nájezdy')|E]"
 trait_immortal: "Nesmrtelný"
 trait_immortal_desc: "Tato postava se vymyká zbytku lidstva a nepodléhá strastem věku, chátrání ani času."
 trait_immortal_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se vymyká zbytku lidstva a nepodléhá strastem věku, chátrání ani času."
 trait_lifestyle_wayfarer: "Pocestný"
 trait_lifestyle_wayfarer_desc: "Pro [ROOT.GetCharacter.GetFirstNameNoTooltip] je cestování něčím víc než pouhým prostředkem k dosažení cíle. Někdy na celé dny zmizí, ale vždy se vrátí s fantastickými příběhy o dalekých krajích, vysokých horách, temných jeskyních či hlubokých lesích."
 trait_lifestyle_voyager: "Světoběžník"
 trait_lifestyle_voyager_desc: "Nejvelkolepější města, dávné ruiny, králové a královny vzdálených panství. [ROOT.GetCharacter.GetFirstNameNoTooltip] viděl[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] vše a rád[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] se o své zážitky dělí s ostatními."
 trait_lifestyle_surveyor: "Inspektor"
 trait_lifestyle_surveyor_desc: "Pod bdělým dohledem [ROOT.GetCharacter.GetFirstNameNoTooltip] panství vzkvétá. Záliba v cestování je pevně vetkána do způsobu vlády této postavy, která osobně dohlíží na vazaly, čelí nástrahám správy a zajišťuje prosperující a řádně opečovávanou doménu."
 trait_lifestyle_surveyor_adventurer_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] je znám[Select_CString( ROOT.GetCharacter.IsFemale, 'á', 'ý' )] svými zkušenostmi s cestováním krajinou. Divočinu zná jako vlastní dlaň, takže dokáže obejít nepřátelské armády, připravovat děsivé léčky nebo jednoduše zajistit bezpečnou cestu z jednoho města do druhého."
 trait_nomadic_philosophy: "Cesta kočovníka"
 trait_nomadic_philosophy_desc: "Tuto postavu od narození utvářel drsný život ve stepi. Její zvyky, jakkoli podivné se mohou zdát změkčilým usedlým národům, jí propůjčují nepřekonatelnou sílu a důvtip.\n\n#weak $nomadic_philosophy_ender$#!"
 trait_nomadic_philosophy_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] je od narození formován[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] drsným životem ve stepi. Zvyky této postavy, jakkoli podivné se mohou zdát změkčilým usedlým národům, jí propůjčují nepřekonatelnou sílu a důvtip.\n\n#weak $nomadic_philosophy_ender$#!"
 nomadic_philosophy_ender: "Já proti svým bratrům – moji bratři a já proti našim bratrancům – moji bratři, naši bratranci a já proti ostatním kmenům – všechny kmeny proti světu."
 trait_lifestyle_seasoned_pastor: "Zkušený pastevec"
 trait_lifestyle_seasoned_pastor_desc: "Tato postava se stala odborníkem na chov dobytka a dokáže zajistit, aby její stáda co nejlépe využívala pastviny."
 trait_lifestyle_seasoned_pastor_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] se stal[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] odborníkem na chov dobytka a dokáže zajistit, aby stáda co nejlépe využívala pastviny."
 unlock_maa_steppe_raiders: "Může verbovat [GetMaA('steppe_raiders').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 unlock_maa_heavy_horse_archers: "Může verbovat [GetMaA('heavy_horse_archers').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 unlock_maa_nomad_lancers: "Může verbovat [GetMaA('nomad_lancers').GetName] jako [Concept('men_at_arms','ozbrojence')|E]"
 TRAIT_FLAG_DESC_gok_obedience_flag: "Výrazně zvýšená @obedience_icon![Concept('obedience','poslušnost')|E] [Concept('subjects','poddaných')|E]"
 trait_golden_lineage: "Zlatý rod"
 trait_golden_lineage_desc: "Na to, čeho pokrevní linie této postavy ve světě dosáhla, nelze zapomenout. Tato postava je zlatým potomkem ohně a dobývání."
 trait_golden_lineage_character_desc: "Na to, čeho pokrevní linie [ROOT.GetCharacter.GetFirstNameNoTooltip] ve světě dosáhla, nelze zapomenout. [ROOT.GetCharacter.GetFirstNameNoTooltip] je zlatým potomkem ohně a dobývání."
 descendants_gain_golden_lineage_female: "Všechny ženské potomkyně postavy [golden_lineage.GetShortUIName] a jejich děti"
 descendants_gain_golden_lineage_male: "Všichni mužští potomci postavy [golden_lineage.GetShortUIName] a jejich děti"
 trait_track_confucian_education: "Konfucianismus"
 trait_track_confucian_education_desc: "Střídmostí a laskavostí společně budujeme lepší společnost.\n\n#weak Úroveň tohoto [Concept('trait','rysu')|E] lze zvyšovat pomocí [Concept('character_interaction','interakce')|E] #V $request_mentoring_interaction$#! nebo plněním [Concept('court_position_tasks','úkolů dvorského úřadu')|E] #V $grand_mentor_court_position$#! či #V $court_tutor_court_position$#! mezi [Concept('court_positions','dvorskými úřady')|E]"
 trait_confucian_education_character_desc: "Tato postava právě vykročila na cestu k moudrosti."
 trait_confucian_education: "Konfuciánské vzdělání"
 trait_confucian_education_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] právě vykročil[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] na cestu k moudrosti."
 trait_confucian_education_1: "Pravý konfucián"
 trait_confucian_education_1_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] zahlédl[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] nesmírnou moudrost konfuciánské cesty."
 trait_confucian_education_2: "Pilný znalec klasiků"
 trait_confucian_education_2_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] skromně uplatňuje Konfuciovo učení v každodenním životě."
 trait_confucian_education_3: "Ctnostný etik"
 trait_confucian_education_3_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] začíná chápat, co znamená být ctnostným konfuciánem."
 trait_confucian_education_4: "Mravní vzor"
 trait_confucian_education_4_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] žije v souladu s Cestou a je skutečným vzorem pro ostatní."
 trait_confucian_education_5: "Bezúhonný mudrc"
 trait_confucian_education_5_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] je v konfuciánských kruzích považován[Select_CString( ROOT.GetCharacter.IsFemale, 'a', '' )] téměř za světce. Konfuciáni z širokého okolí slyšeli o mravní a etické zdatnosti této postavy."
