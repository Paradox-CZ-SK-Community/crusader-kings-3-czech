 ALREADY_CONTAINTS_TRAIT: "@warning_icon! #X $CHARACTER_NAME$ již má rys [TRAIT.GetName( CHARACTER.Self )]#!"
 CONTAINTS_OPPOSITE_TRAIT: "@warning_icon! #X Rys [TRAIT.GetName( CHARACTER.Self )] nelze přidat, protože $CHARACTER_NAME$ již má protikladný rys [TRAIT_2.GetName( CHARACTER.Self )]#!"
 IS_POTENTIAL_TRAIT_FALSE: "@warning_icon! #X Rys [TRAIT.GetName( CHARACTER.Self )] nelze přidat, protože jej $CHARACTER_NAME$ nemůže mít#!"
 TRAIT_AGE_NOT_IN_RANGE_TOO_YOUNG: "@warning_icon! #X Rys [TRAIT.GetName( CHARACTER.Self )] nelze přidat, protože $CHARACTER_NAME$ je mladší než $TRAIT_AGE|V$ #weak (věk: $CHARACTER_AGE|V$)#!#!"
 TRAIT_AGE_NOT_IN_RANGE_TOO_OLD: "@warning_icon! #X Rys [TRAIT.GetName( CHARACTER.Self )] nelze přidat, protože $CHARACTER_NAME$ je starší než $TRAIT_AGE|V$ #weak (věk: $CHARACTER_AGE|V$)#!#!"
