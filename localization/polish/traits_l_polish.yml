 inheritable_desc: "Lze zdědit"
 trait_crusader_king: "Křižácký král"
 trait_crusader_king_male_desc: "Mocný král-válečník, který si v zemích nevěřících vybojoval vlastní království."
 trait_crusader_king_female_desc: "Mocná královna-válečnice, která si v zemích nevěřících vybojovala vlastní království."
 trait_crusader_king_fallback_desc: "Mocný panovník-válečník, který si v zemích nevěřících vybojoval vlastní království."
 trait_augustus: "Augustus"
 trait_augustus_desc: "Tato postava je současným vládcem obnovené Římské říše a požívá úcty náležející tak významnému úřadu."
 trait_augustus_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] vládne obnovené Římské říši a požívá úcty náležející tak významnému úřadu."
