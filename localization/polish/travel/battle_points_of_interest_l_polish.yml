 BattlePoiDescriptionLocPikemenKnight: "Vítězství zajistili pikenýři z $BattlePoiCommanderCulture$ kultury pod vedením $BattlePoiBraveKnight$, kteří odrazili nepřátelský útok,"
 BattlePoiDescriptionLocVarangian: "Bitva skončila, když Varjagové pod vedením $BattlePoiBraveKnight$ prorazili řady a pronikli hluboko do nepřátelské sestavy,"
 BattlePoiDescriptionLocBerserker: "Bitva nabrala nečekaný obrat, když se $BattlePoiBraveKnight$ podařilo prorazit řadami vojska z $BattlePoiEnemyCommanderCulture$ kultury"
