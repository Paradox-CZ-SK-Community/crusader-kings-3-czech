 TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical: "#T $TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical_name$#!\n$TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical_desc$\n\n"
 TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical_name: "[Province.Custom('BattlePoiNameHistorical')]"
 TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical_desc: "[Province.Custom('BattlePoIDescriptionHistorical')]"
 travel_point_historical_name_visit_message: "[ROOT.Char.GetCurrentLocation.Custom('BattlePoiNameHistorical')]"
 BattlePoIHistoricalNameTours: "Bitva u Tours"
 BattlePoIHistoricalDescTours: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '131721' ).GetFirstNameNicknamed]\nPoražený: Abd al-Rahman al-Ghafiqi\nDatum: 10. října 732 n.l.#!\n#weak Bitva, při níž Karel Martel odrazil umajjovskou invazi do Francie u řek Clain a Vienne. Říká se, že Karlovi muži stáli nehybní jako zeď a stříhali do nabíhající umajjovské těžké jízdy. Poté, co dopadli na nepřátelského velitele a strhli ho ze sedla, jejich protivníci prchli z bojiště.#!"
 BattlePoIHistoricalNameLechfeld: "Bitva u Lechfeldu"
 BattlePoIHistoricalDescLechfeld: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '1282' ).GetTitledFirstName]\nPoražený: [GetScriptedCharacterByHistoryID( '460' ).GetFirstName] [GetScriptedCharacterByHistoryID( '460' ).GetDynastyName]\nDatum: 10. srpna 955 n.l.#!\n#weak Krvavá bitva mezi vojsky saského krále Otty a uherskými silami. Po devastujících ztrátách na obou stranách Uhři ustoupili, když se jim hrozilo obklíčení a tok bitvy se obrátil proti nim.\n\nPo skončení bitvy bylo mnoho uherských velitelů zajato a popraveno a trvající maďarská hrozba pro západní Evropu byla konečně zlomena.#!"
 BattlePoIHistoricalNameHastings: "Bitva u Hastingsu"
 BattlePoIHistoricalDescHastings: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '140' ).GetFirstName] [GetScriptedCharacterByHistoryID( '140' ).GetDynastyName]\nPoražený: [GetScriptedCharacterByHistoryID( '122' ).GetFullName]\nDatum: 14. října 1066 n.l.#!\n#weak Bitva u Hastingsu byla jednou z klíčových bitev při vzestupu Viléma k moci v Anglii. Donuceni bojovat do kopce, normandští vojáci se obtížně probíjeli kupředu a dokonce se v určitém okamžiku začali stahovat, ale Vilém dokázal zorganizovat protiútok proti anglickým jednotkám.\n\nPřemožen Harold padl spolu se svými dvěma bratry [GetScriptedCharacterByHistoryID( '132' ).GetFirstNameNoTooltip] a [GetScriptedCharacterByHistoryID( '130' ).GetFirstNameNoTooltip], čímž anglický trůn zůstal neobsazen.#!"
 BattlePoIHistoricalNameStamfordBridge: "Bitva u Stamford Bridge"
 BattlePoIHistoricalDescStamfordBridge: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '122' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '102531' ).GetNameNicknamed]\nDatum: 25. září 1066 n.l.#!\n#weak Bitva u Stamford Bridge byla jedním z klíčových střetnutí mezi třemi uchazeči o anglický trůn: Vilémem z Normandie, Haraldem z Norska a Haroldu z Anglie. Harold se s muži hnul na sever a překvapil norská vojska, která nebyla připravena k boji.\n\nHarald byl [Select_CString(ROOT.Char.IsFemale,'zabita','zabit')] šípem do průdušnice a jeho anglický spojenec [GetScriptedCharacterByHistoryID( '124' ).GetFirstNameNoTooltip], Haroldův bratr, byl také [Select_CString(ROOT.Char.IsFemale,'zabita','zabit')]. Norská armáda byla po bitvě bez velitelů téměř zničena.#!"
 BattlePoIHistoricalNameManzikert: "Bitva u Manzikertu"
 BattlePoIHistoricalDescManzikert: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '3040' ).GetFirstName] [GetScriptedCharacterByHistoryID( '3040' ).GetDynastyName]\nPoražený: [GetScriptedCharacterByHistoryID( '1734' ).GetFullName]\nDatum: 26. srpna 1071 n.l.#!\n#weak Romanos, korunovaný císařem Byzantské říše v roce 1068, vedl tažení proti tureckým vpádům do Anatolie. Po omezených úspěších se pokusil dosáhnout rozhodujícího vítězství v bitvě proti Alp Arslanu z seldžucké říše u Manzikertu.\n\nZrazen jedním ze svých velitelů, který ustoupil s velkou částí armády, Romanos skončil v zajetí muslimských vojsk. Ač byl později propuštěn, byl svržen, očním zákrokem oslepen, vyhnán do exilu a zemřel na následky zranění.#!"
 BattlePoIHistoricalNameYarmuk: "Bitva u Yarmuku"
 BattlePoIHistoricalDescYarmuk: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '163015' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '145071' ).GetFullName]\nDatum: 20. srpna 636 n.l.#!\n#weak Bitva u Yarmuku je jednou z nejdůležitějších bitev byzantské historie. Rozhodující porážka vedla ke ztrátě Sýrie a Egypta a k velkému rozšíření arabského (muslimského) impéria.\n\nBitva trvala šest dní; původní průběh se nejprve přiklonil proti muslimským útočníkům, ale pátý den přešli z obranné do ofenzivní strategie. Šestého dne nasadili odvážnou jízdu, která zlomila byzantskou armádu.\n\nZlomené morálky se byzantští vojáci hroutili do kaňonů, topili se nebo byli dohoněni a pobiti, když prchali z bojiště.#!"
 BattlePoIHistoricalNameDandanaqan: "Bitva u Dandanaqanu"
 BattlePoIHistoricalDescDandanaqan: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '3036' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '144129' ).GetFullName]\nDatum: 23. května 1040 n.l.#!\n#weak Důležitá bitva mezi rostoucí seldžuckou mocí v severní Persii a Ghaznavidskou říší. Po úspěších proti seldžuckým silám v počátečních střetnutích začali Ghaznavidové pospolitě hádat o kořist.\n\nZmateni a nepřipraveni k boji byli překvapeni návratem seldžuckých sil. Pronásledovaní, hladovějící a demoralizovaní, ghaznavidské vojsko bylo svými protivníky rozprášeno.#!"
 BattlePoIHistoricalNameAror: "Bitva u Aroru"
 BattlePoIHistoricalDescAror: "#emp Vítěz: Muhammad ibn al-Qasim\nPoražený: Raja Dahir\nDatum: 711 n.l.#!\n#weak Bitva při umajjovské invazi do Indie, mezi radžou Sinhdu a Umajjovskou říší.\n\nAčkoliv jejich protivníci měli původně početní převahu, umajjovský velitel si dokázal zajistit lepší postavení před rozhodujícím střetem. Během konfliktu mu to postupně umožnilo převzít iniciativu a s smrtí radži Dahira bylo vítězství zajištěno.#!"
 BattlePoIHistoricalNameSvolder: "Bitva u Svolderu"
 BattlePoIHistoricalDescSvolder: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '101505' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '144004' ).GetFullName]\nDatum: 9. září 999 n.l.#!\n#weak Bitva mezi norskými silami Olafa Tryggvasona na jedné straně a koalicí dánských a švédských sil vedených králem Sveinnem z Dánska na straně druhé.\n\nI přes značnou přesilu norský král odmítl ustoupit před nepřátelskou koalicí a pustil se do boje se Švédy a Dány, přičemž je urážel jako 'jídelníky koní' a 'lesní kozy'.\n\nNakonec, přestože ponesl těžké rány svému protivníkovi, byla norská armáda poražena. Olaf v bitvě zmizel a pravděpodobně zahynul.#!"
 BattlePoIHistoricalNameCivitate: "Bitva u Civitate"
 BattlePoIHistoricalDescCivitate: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '1126' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '1338' ).GetFullName]\nDatum: 18. června 1053 n.l.#!\n#weak Bitva mezi Normany na jedné straně a koalicí vedenou papežem na straně druhé, včetně německých a místních italských sil.\n\nI přes početní převahu papežská koalice nedokázala prorazit normanská centra pěchoty a jejich jízdní křídla prohrála s normanskou jízdou.\n\nKrátce po bitvě byl papež zajat Normany, což vedlo k ukončení konfliktu.#!"
 BattlePoIHistoricalNameTalas: "Bitva u Talasu"
 BattlePoIHistoricalDescTalas: "#emp Vítěz: Abbásovský chalífát\nPoražený: dynastie Tang\nDatum: 751 n.l.#!\n#weak Dlouhotrvající střet mezi Abbásovským chalífátem expandujícím do Transoxanie od jihozápadu a dynastií Tang expandující z východu.\n\nPůvodně sehrála důležitou roli těžká pěchota Tang a jejich tюркští žoldnéři při odražení Abbásovských sil, ale když žoldnéři přešli na druhou stranu a mnozí jejich spojenci je zradili, byli Tangové zatlačeni.\n\nTento konflikt ukončil západní expanzi dynastie Tang a Transoxiana byla na dlouhou dobu v rukou muslimských vládců.#!"
 BattlePoIHistoricalNameSufuku: "Bitva u Subushi" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescSufuku: "#emp Victor: The Emishi of Isawa\nDefeated: [GetScriptedCharacterByHistoryID( 'japanese_iruma_1' ).GetFullName]\nDate: 789 AD#!\n#weak Důležitá bitva v rámci japonského podrobení Emishi.\n\nJaponské síly se nejprve rozdělily na dvě, postupujíc po obou březích řeky Kitakami za ustupujícími Emishi. Emishiští střelci zabránili Japoncům přejít řeku a zatlačili velkou část jejich jednotek mezi řeku a hory.\n\nNásledující kolaps japonských sil byl velkou potupou; mnoho vojáků prchalo plavbou nahých přes řeku, aby unikli smrti. Armáda byla rozpuštěna a [GetScriptedCharacterByHistoryID( 'japanese_yamato_24' ).GetFullName] přísně pokáral své velitele.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameBaekgang: "Bitva u Baekgangu" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescBaekgang: "#emp Victor: Kingdom of Silla & Tang China\nDefeated: [GetScriptedCharacterByHistoryID( 'japanese_abe_36' ).GetFullName]\nDate: 663 AD#!\n#weak Rozhodující námořní bitva, ve které se síly dynastie Tchang a království Silla střetly s vojáky obnoveneckého hnutí Baekje a jejich japonskými spojenci.\n\nBitva se odehrávala především na řece Baengma. I když byli Japonci početně silnější, tchangské loďstvo obstálo a nakonec přešlo do protiútoku, obklíčilo a porazilo japonskou flotilu.\n\nRozhodující vítězství Silla–Tchang donutilo Japonsko plně se stáhnout z korejských záležitostí a rozdrtilo obnovenecké hnutí Baekje.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNamePalembang: "Útok Čola na Palembang" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescPalembang: "#emp Victor: [GetScriptedCharacterByHistoryID( '189038' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( 'javanese_sailendra_25' ).GetFullName]\nDate: 1025 AD#!\n#weak Náhlý útok vojsk Čola na hlavní město Srivijaya v Palembangu.\n\nSíly Čola připluly přes moře a rychle potlačily hlavní město Srivijaya, přičemž ho vyrabovaly a zničily.\n\nPád Palembangu vedl k úplnému kolapsu říše Srivijaya a vliv Čola v regionu přetrval po desetiletí.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameAngkor: "Obléhání Angkoru" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescAngkor: "#emp Victor: [GetScriptedCharacterByHistoryID( 'cham_panduranga_04' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( 'khmer_tribhuvanaditya_01' ).GetFullName]\nDate: 1177 AD#!\n#weak Období vnitřních sporů a převratů v království Kambuja vedlo k tomu, že se k moci dostal Tribhuvanaditya, osoba mimo královský rod. Zatímco čelil královským rebelům podporujícím jiné nároky, království Champa vpadlo do Kambujy.\n\nSíly Champy postupovaly po Mekongu a Tonle Sapu, vyplenily hlavní město Angkor a zabily Tribhuvanadityu.\n\nPo obléhání se království Kambuja rozpadlo a kořist byla rozptýlena po okolí nebo odvezena domů Chamami.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameSongping: "Obléhání Songpingu" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescSongping: "#emp Victor: Yang Sijin\nDefeated: Cai Xi\nDate: 863 AD#!\n#weak Nevole v tchangském protektorátu Annan přiměla sousední království Nanzhao, aby se spojilo s místními kmeny a s převahou vtrhlo do regionu.\n\nArmáda Nanzhao a její spojenci měly město v obležení nějaký čas, než se jim podařilo proniknout do vnitřního města; obránci učinili poslední odpor u východní brány, kde nastražili léčku na jízdní vojsko útočníků a mnoho z nich pobili, než byli poraženi.\n\nAčkoliv je původně vítalo vietské obyvatelstvo, jednotky Nanzhao region vyplenily a tchangský protiútok v roce 864 nakonec území znovu získal.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameMuye: "Bitva u Muye" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescMuye: "#emp Victor: King Wu\nDefeated: Emperor Zhou of Shang\nDate: 1046 BCE#!\n#weak Bitva u Muye se odehrála mezi povstaleckým králem Wu a šangským císařem Zhou.\n\nSíly Wu byly zpočátku početně méně, ale šangské jednotky, které byly z velké části vojenskými otroky, se ukázaly být nespolehlivé a z bojiště uprchly. Výsledkem byla krvavá výhra povstaleckých sil vedených králem Wu.\n\nBitva vedla k pádu dynastie Šang a k uchopení Nebeského mandátu králem Wu, který založil novou dynastii Zhou.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameRedCliffs: "Bitva u Rudých útesů" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescRedCliffs: "#emp Victor: Sun Quan\nDefeated: Cao Cao\nDate: 208 AD#!\n#weak Bitva u Rudých útesů byla říční střetnutí mezi koalicí válečníků a severním vůdcem Cao Caem na konci éry dynastie Chan. Cao Cao se pokoušel vytvořit předmostí přes řeku Jang-c’-ťiang do jižní Číny.\n\nPředstíraje kapitulaci dokázaly spojené síly přilákat Cao Caovy lodě do pasti, zapálit je a mnoho vojáků i koní shořelo zaživa. Severní armáda se potom dostala do zmatku a byla poražena.\n\nPorážka zabránila Cao Caovi postoupit za Jang-c’-ťiang a připravila půdu pro následující období Tří království.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameGuandu: "Bitva u Guandu" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescGuandu: "#emp Victor: Cao Cao\nDefeated: Yuan Shao\nDate: 200 AD#!\n#weak Bitva u Guandu se odehrála mezi válečnými vůdci Cao Caem a Yuan Shaem za pozdní východochanovské éry; oba dosáhli značné moci a byli hlavní překážkou jeden druhému v kontrole Číny.\n\nCao Caovy síly byly v bitvě početně slabší, ale použily taktiky jako překvapivý nájezd na zásobovací sklad Yuana Shaa, čímž oslabily protivníkovu armádu.\n\nBitva byla zlomovým bodem období, po níž Cao Cao vystoupil jako vítěz a otevřel cestu pro budoucí stát Cao Wei v době Tří království.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameYiling: "Bitva u Yilingu" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescYiling: "#emp Victor: Lu Xun - Eastern Wu\nDefeated: Liu Bei - Shu Han\nDate: 221 AD#!\n#weak Snažíc se získat zpět ztracená území v provincii Jing vedl Liu Bei osobně své armády do útoku proti Východnímu Wu a dosáhl počátečních úspěchů.\n\nBěhem bitvy byly Liu Beiovy síly vylákány do pasti generálem Lu Xunem, který zapálil tábor Shu Han, čímž přinutil Liu Beie k ústupu. Nakonec se Liu Bei osobně zachránil tím, že nařídil svým mužům zapálit si zbroje, vytvořili tak ohnivou bariéru proti útočníkům.\n\nBitva znamenala rozhodnou porážku pro Liu Beie, ukončila jeho tažení a následně vedla i k jeho smrti.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameFeiRiver: "Bitva u řeky Fei" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescFeiRiver: "#emp Victor: Xie An - Jin\nDefeated: Fu Jian - Former State of Qin\nDate: 383 AD#!\n#weak Bitva byla kulminací delší kampaně, kdy bývalý stát Qin, jenž sjednotil řadu cizích kmenů, ovládl značné části území Jin. Qinská vojska byla početně mnohem silnější než Jin, kteří se postavili na obranu u řeky Fei.\n\nBěhem bitvy disciplinované a dobře vycvičené jednotky Jin rozprášily početně daleko větší, ale neorganizované a demotivované síly pozdního Qinu.\n\nPorážka Qin s minimálními ztrátami výrazně změnila rovnováhu sil a zajistila, že jižní Čína zůstala nezávislá více než sto let.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameCanheSlope: "Bitva na svahu Canhe" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescCanheSlope: "#emp Victor: Touba Gui - Northern Wei\nDefeated: Murong Bao - Later Yan\nDate: 395 AD#!\n#weak Bitva byla důsledkem konfliktu, kdy dynastie Later Yan podnikla trestnou výpravu proti severní dynastii Wei.\n\nKdyž se oddíly Later Yan přiblížily ke svahu Canhe, zahnala je náhlá bouře a jejich vojska byla napadena nepřáteli. Armáda Later Yan byla zaskočena a mnozí uprchli přímo do Žluté řeky.\n\nBitva nakonec obrátila mocenské poměry v regionu ve prospěch severní Wei, která převzala většinu území Later Yan.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameXiangji: "Bitva u chrámu Xiangji" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescXiangji: "#emp Victor: [GetScriptedCharacterByHistoryID( 'han_1528' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( 'an_qingxu' ).GetFullName]\nDate: 757 AD#!\n#weak Tato bitva byla vyvrcholením tchangského protiútoku proti povstaleckým silám, které ovládly většinu severní Číny, a patřila mezi nejkrvavější střety povstání An Lušana. Obrovská vojska se střetla na sever od Chang'anu u chrámu Xiangji.\n\nK poledni tchangská armáda obsadila vyvýšeniny, zatímco armáda Yan se nacházela přímo před Chang'anem. Po několika manévrech se bitva proměnila v vleklé patové postavení, kdy disciplinované jednotky proti sobě bez ústupků bojovaly, než přední linie Yan nakonec zkolabovala vlivem extrémních ztrát.\n\nBrutalita střetu zdecimovala obě armády, ale zlomila páteř povstání. Tchangské síly byly schopny následující den znovu dobýt Chang'an.#!" # todo: NEW TRANSLATION
 BattlePoIHistoricalNameGaoliang: "Bitva u řeky Gaoliang" # todo: NEW TRANSLATION
 BattlePoIHistoricalDescGaoliang: "#emp Victor: [GetScriptedCharacterByHistoryID( '194330' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullName]\nDate: 979 AD#!\n#weak Bitva následovala po pokusu Songů znovu získat 16 prefektur, které dynastie Liao dobyla v roce 960, a byla vedena osobně císařovým bratrem (budoucím císařem [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullNameNoTooltip]).\n\nMěsto Youzhou bylo tři měsíce v obležení, než dorazila liaoiská posila a ulevila obráncům; ačkoliv Songové měli počáteční úspěch, byli pak v noci překvapeni útokem ze tří směrů.\n\nBitva skončila tím, že [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullNameNoTooltip] utekl z bojiště v oslí káře. Šlo o první velkou porážku Songů po jejich vzestupu k moci.#!" # todo: NEW TRANSLATION
