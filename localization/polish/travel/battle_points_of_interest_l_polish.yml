 TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical: "#T $TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical_name$#!\n$TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical_desc$\n\n"
 TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical_name: "[Province.Custom('BattlePoiNameHistorical')]"
 TRAVEL_POINT_OF_INTEREST_TT_poi_battles_historical_desc: "[Province.Custom('BattlePoIDescriptionHistorical')]"
 travel_point_historical_name_visit_message: "[ROOT.Char.GetCurrentLocation.Custom('BattlePoiNameHistorical')]"
 BattlePoIHistoricalNameTours: "Bitva u Tours"
 BattlePoIHistoricalDescTours: "#emp Vítěz: [GetScriptedCharacterByHistoryID('131721').GetFirstNameNicknamed]\nPoražený: Abd ar-Rahmán al-Gháfikí\nDatum: 10. října 732 n. l.#!\n#weak V této bitvě Karel Martel odrazil umajjovský vpád do Franské říše u řek Clain a Vienne. Karlovi muži prý stáli nehybně jako zeď a sekali do útočící umajjovské těžké jízdy. Když dostihli nepřátelského velitele a strhli jej ze sedla, protivníci uprchli z bojiště.#!"
 BattlePoIHistoricalNameLechfeld: "Bitva na Lechu"
 BattlePoIHistoricalDescLechfeld: "#emp Vítěz: [GetScriptedCharacterByHistoryID('1282').GetTitledFirstName]\nPoražený: [GetScriptedCharacterByHistoryID('460').GetFirstName] [GetScriptedCharacterByHistoryID('460').GetDynastyName]\nDatum: 10. srpna 955 n. l.#!\n#weak Krvavá bitva mezi vojsky saského krále Oty a staromaďarskými silami. Po zdrcujících ztrátách na obou stranách Uhři ustoupili, když jim začalo hrozit obklíčení a průběh bitvy se obrátil proti nim.\n\nPo skončení bitvy bylo mnoho uherských velitelů zajato a popraveno. Dlouhotrvající maďarská hrozba pro západní Evropu tak byla konečně zlomena.#!"
 BattlePoIHistoricalNameHastings: "Bitva u Hastingsu"
 BattlePoIHistoricalDescHastings: "#emp Vítěz: [GetScriptedCharacterByHistoryID('140').GetFirstName] [GetScriptedCharacterByHistoryID('140').GetDynastyName]\nPoražený: [GetScriptedCharacterByHistoryID('122').GetFullName]\nDatum: 14. října 1066 n. l.#!\n#weak Bitva u Hastingsu byla jedním z klíčových střetnutí při Vilémově vzestupu k moci v Anglii. Normanští vojáci museli bojovat do kopce, a proto se jen obtížně probíjeli vpřed. V jednu chvíli dokonce začali ustupovat, Vilém však dokázal zorganizovat protiútok proti anglickým jednotkám.\n\nPoražený Harold padl spolu se svými dvěma bratry [GetScriptedCharacterByHistoryID( '132' ).GetFirstNameNoTooltip] a [GetScriptedCharacterByHistoryID( '130' ).GetFirstNameNoTooltip], takže anglický trůn zůstal neobsazen.#!"
 BattlePoIHistoricalNameStamfordBridge: "Bitva u Stamfordského mostu"
 BattlePoIHistoricalDescStamfordBridge: "#emp Vítěz: [GetScriptedCharacterByHistoryID('122').GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '102531' ).GetNameNicknamed]\nDatum: 25. září 1066 n. l.#!\n#weak Bitva u Stamfordského mostu byla jedním z klíčových střetnutí mezi třemi uchazeči o anglický trůn: Vilémem Normandským, Haraldem Norským a Haroldem Anglickým. Harold se se svými muži rychle vydal na sever a překvapil norské vojsko, které nebylo připraveno k boji.\n\nHarald padl po zásahu šípem do hrdla a zahynul také jeho anglický spojenec [GetScriptedCharacterByHistoryID( '124' ).GetFirstNameNoTooltip], Haroldův bratr. Norská armáda, která tak přišla o své velitele, byla téměř zničena.#!"
 BattlePoIHistoricalNameManzikert: "Bitva u Manzikertu"
 BattlePoIHistoricalDescManzikert: "#emp Vítěz: [GetScriptedCharacterByHistoryID('3040').GetFirstName] [GetScriptedCharacterByHistoryID('3040').GetDynastyName]\nPoražený: [GetScriptedCharacterByHistoryID('1734').GetFullName]\nDatum: 26. srpna 1071 n. l.#!\n#weak Romanos, jenž byl roku 1068 korunován císařem Byzantské říše, vedl tažení proti tureckým vpádům do Anatolie. Po několika dílčích úspěších se pokusil dosáhnout rozhodujícího vítězství nad Alp Arslanem ze Seldžucké říše u Manzikertu.\n\nJeden z jeho velitelů jej zradil a ustoupil s velkou částí armády, takže Romanos padl do zajetí muslimského vojska. Přestože byl později propuštěn, byl svržen, oslepen, poslán do vyhnanství a nakonec zemřel na následky svých zranění.#!"
 BattlePoIHistoricalNameYarmuk: "Bitva u Jarmúku"
 BattlePoIHistoricalDescYarmuk: "#emp Vítěz: [GetScriptedCharacterByHistoryID('163015').GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '145071' ).GetFullName]\nDatum: 20. srpna 636 n. l.#!\n#weak Bitva u Jarmúku patří k nejvýznamnějším střetnutím byzantských dějin. Rozhodující porážka vedla ke ztrátě Sýrie a Egypta a k mohutnému rozmachu arabské muslimské říše.\n\nBitva trvala šest dní. Zpočátku se její průběh obracel proti muslimským útočníkům, pátého dne však přešli z obrany do útoku. Šestého dne nasadili odvážný jezdecký výpad, který zlomil byzantskou armádu.\n\nByzantští vojáci se zhroucenou morálkou padali do roklí, topili se nebo byli při útěku z bojiště dohoněni a pobiti.#!"
 BattlePoIHistoricalNameDandanaqan: "Bitva u Dandánkánu"
 BattlePoIHistoricalDescDandanaqan: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '3036' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '144129' ).GetFullName]\nDatum: 23. května 1040 n. l.#!\n#weak Významná bitva mezi vzmáhající se seldžuckou mocí v severní Persii a Ghaznovskou říší. Po úspěších proti seldžuckým silám v úvodních střetnutích se Ghaznovci začali mezi sebou přít o kořist.\n\nZmatené a k boji nepřipravené vojsko překvapil návrat seldžuckých sil. Pronásledovaní, hladovějící a demoralizovaní Ghaznovci byli svými protivníky rozprášeni.#!"
 BattlePoIHistoricalNameAror: "Bitva u Aróru"
 BattlePoIHistoricalDescAror: "#emp Vítěz: Muhammad ibn al-Kásim\nPoražený: Rádža Dáhir\nDatum: 711 n. l.#!\n#weak Bitva se odehrála během umajjovského vpádu do Indie mezi vojskem sindhského rádži a Umajjovskou říší.\n\nPřestože měl protivník zpočátku početní převahu, umajjovský velitel si před rozhodujícím střetnutím dokázal zajistit výhodnější postavení. Díky tomu postupně převzal iniciativu a smrt rádži Dáhira zpečetila jeho vítězství.#!"
 BattlePoIHistoricalNameSvolder: "Bitva u Svolderu"
 BattlePoIHistoricalDescSvolder: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '101505' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '144004' ).GetFullName]\nDatum: 9. září 999 n. l.#!\n#weak Na jedné straně stála norská vojska Olafa Tryggvasona, na druhé koalice dánských a švédských sil vedená dánským králem Sveinem.\n\nNavzdory značné přesile odmítl norský král před nepřátelskou koalicí ustoupit a pustil se do boje se Švédy a Dány, které přitom urážel jako „koňožrouty“ a „lesní kozy“.\n\nNorská armáda nakonec podlehla, přestože protivníkovi zasadila těžké rány. Olaf během bitvy zmizel a pravděpodobně zahynul.#!"
 BattlePoIHistoricalNameCivitate: "Bitva u Civitate"
 BattlePoIHistoricalDescCivitate: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '1126' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( '1338' ).GetFullName]\nDatum: 18. června 1053 n. l.#!\n#weak Na jedné straně stáli Normané, na druhé papežem vedená koalice německých a místních italských sil.\n\nNavzdory početní převaze nedokázala papežská koalice prorazit střed normanské pěchoty a její jezdecká křídla podlehla normanské jízdě.\n\nKrátce po bitvě Normané zajali papeže, čímž konflikt skončil.#!"
 BattlePoIHistoricalNameTalas: "Bitva u Talasu"
 BattlePoIHistoricalDescTalas: "#emp Vítěz: Abbásovský chalífát\nPoražený: Dynastie Tchang\nDatum: 751 n. l.#!\n#weak Dlouhotrvající střet svedl Abbásovský chalífát, jenž expandoval do Transoxanie od jihozápadu, s dynastií Tchang postupující z východu.\n\nTchangská těžká pěchota a její turkičtí žoldnéři zpočátku sehráli významnou roli při odrážení abbásovských sil. Když však žoldnéři přešli na druhou stranu a řada spojenců dynastii Tchang zradila, její vojsko bylo zatlačeno.\n\nStřet ukončil západní expanzi dynastie Tchang a Transoxanie zůstala na dlouhou dobu v rukou muslimských vládců.#!"
 BattlePoIHistoricalNameSufuku: "Bitva u Subuši"
 BattlePoIHistoricalDescSufuku: "#emp Vítěz: Emiši z Isawy\nPoražený: [GetScriptedCharacterByHistoryID( 'japanese_iruma_1' ).GetFullName]\nDatum: 789 n. l.#!\n#weak Významná bitva během japonského podmaňování lidu Emiši.\n\nJaponské síly se nejprve rozdělily na dvě části a postupovaly po obou březích řeky Kitakami za ustupujícími Emiši. Emišští lučištníci zabránili Japoncům překročit řeku a zatlačili velkou část jejich jednotek do úzkého prostoru mezi řekou a horami.\n\nNásledný rozklad japonského vojska byl velkou potupou. Mnoho vojáků prchalo před smrtí tak, že nazí přeplavali řeku. Armáda byla rozpuštěna a [GetScriptedCharacterByHistoryID( 'japanese_yamato_24' ).GetFullName] své velitele přísně pokáral.#!"
 BattlePoIHistoricalNameBaekgang: "Bitva u Pekgangu"
 BattlePoIHistoricalDescBaekgang: "#emp Vítěz: Království Silla a tchangská Čína\nPoražený: [GetScriptedCharacterByHistoryID( 'japanese_abe_36' ).GetFullName]\nDatum: 663 n. l.#!\n#weak Rozhodující námořní bitva, v níž se síly dynastie Tchang a království Silla střetly s vojsky hnutí usilujícího o obnovu Pekče a s jejich japonskými spojenci.\n\nBoj probíhal především na řece Pekma. Přestože měli Japonci početní převahu, tchangské loďstvo odolalo a nakonec přešlo do protiútoku, při němž japonské loďstvo obklíčilo a porazilo.\n\nRozhodující vítězství Silly a dynastie Tchang přinutilo Japonsko zcela se stáhnout z korejských záležitostí a rozdrtilo hnutí za obnovu Pekče.#!"
 BattlePoIHistoricalNamePalembang: "Čólský útok na Palembang"
 BattlePoIHistoricalDescPalembang: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '189038' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( 'javanese_sailendra_25' ).GetFullName]\nDatum: 1025 n. l.#!\n#weak Náhlý útok čólských vojsk na Palembang, hlavní město Šrívidžaji.\n\nČólské síly připluly přes moře, rychle město přemohly, vyplenily je a zničily.\n\nPád Palembangu vedl k úplnému zhroucení říše Šrívidžaja a čólský vliv v oblasti přetrval po několik desetiletí.#!"
 BattlePoIHistoricalNameAngkor: "Obléhání Angkoru"
 BattlePoIHistoricalDescAngkor: "#emp Vítěz: [GetScriptedCharacterByHistoryID( 'cham_panduranga_04' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( 'khmer_tribhuvanaditya_01' ).GetFullName]\nDatum: 1177 n. l.#!\n#weak Období vnitřních sporů a převratů v Kambudžském království vyneslo k moci Tribhuvanadityu, muže stojícího mimo královský rod. Zatímco čelil povstalcům podporujícím jiné nároky na trůn, vpadlo do Kambudži království Čampa.\n\nČamská vojska postupovala po Mekongu a jezeře Tonlé Sap, vyplenila hlavní město Angkor a Tribhuvanadityu zabila.\n\nPo obléhání se Kambudžské království rozpadlo a kořist byla rozptýlena po okolí nebo odvezena Čamy do jejich vlasti.#!"
 BattlePoIHistoricalNameSongping: "Obléhání Sung-pchingu"
 BattlePoIHistoricalDescSongping: "#emp Vítěz: Jang S’-ťin\nPoražený: Cchaj Si\nDatum: 863 n. l.#!\n#weak Nespokojenost v tchangském protektorátu Annam přiměla sousední království Nan-čao, aby se spojilo s místními kmeny a vpadlo do oblasti s drtivou převahou.\n\nVojska Nan-čaa a jeho spojenců město nějakou dobu obléhala, než se jim podařilo proniknout do vnitřního města. Obránci kladli poslední odpor u východní brány, kde vlákali útočnou jízdu do léčky a mnoho jezdců pobili, než sami podlehli.\n\nPřestože je vietské obyvatelstvo zpočátku vítalo, jednotky Nan-čaa oblast vyplenily. Tchangský protiútok nakonec území roku 864 znovu získal.#!"
 BattlePoIHistoricalNameMuye: "Bitva u Mu-jie"
 BattlePoIHistoricalDescMuye: "#emp Vítěz: Král Wu\nPoražený: Šangský císař Čou\nDatum: 1046 př. n. l.#!\n#weak Bitva u Mu-jie se odehrála mezi povstaleckým králem Wu a šangským císařem Čou.\n\nVojska krále Wu byla zpočátku početně slabší, avšak šangské jednotky, tvořené z velké části ozbrojenými otroky, se ukázaly jako nespolehlivé a z bojiště uprchly. Výsledkem bylo krvavé vítězství povstaleckých sil vedených králem Wu.\n\nBitva vedla k pádu dynastie Šang a k získání Nebeského mandátu králem Wu, jenž založil novou dynastii Čou.#!"
 BattlePoIHistoricalNameRedCliffs: "Bitva u Rudých útesů"
 BattlePoIHistoricalDescRedCliffs: "#emp Vítěz: Sun Čchüan\nPoražený: Cchao Cchao\nDatum: 208 n. l.#!\n#weak Bitva u Rudých útesů byla říčním střetnutím mezi koalicí válečníků a severním vojevůdcem Cchao Cchaoem na sklonku dynastie Chan. Cchao Cchao se pokoušel získat předmostí na jižním břehu Jang-c’-ťiangu.\n\nSpojenecké síly předstíraly kapitulaci, čímž vlákaly Cchao Cchaoovy lodě do pasti a zapálily je. Mnoho vojáků i koní uhořelo a severní armáda zachvátila panika, po níž byla poražena.\n\nPorážka zabránila Cchao Cchaoovi v postupu za Jang-c’-ťiang a připravila půdu pro následující období Tří říší.#!"
 BattlePoIHistoricalNameGuandu: "Bitva u Kuan-tu"
 BattlePoIHistoricalDescGuandu: "#emp Vítěz: Cchao Cchao\nPoražený: Jüan Šao\nDatum: 200 n. l.#!\n#weak Bitva u Kuan-tu se odehrála mezi vojevůdci Cchao Cchaoem a Jüan Šaoem na sklonku Východní dynastie Chan. Oba získali značnou moc a navzájem si byli hlavní překážkou v ovládnutí Číny.\n\nCchao Cchaoovy síly byly početně slabší, využily však mimo jiné překvapivý nájezd na zásobovací sklad Jüan Šaoa, čímž protivníkovu armádu oslabily.\n\nBitva se stala zlomovým bodem celé epochy. Cchao Cchao z ní vyšel vítězně a otevřel cestu budoucímu státu Cchao Wej v období Tří říší.#!"
 BattlePoIHistoricalNameYiling: "Bitva u I-lingu"
 BattlePoIHistoricalDescYiling: "#emp Vítěz: Lu Sün – Východní Wu\nPoražený: Liou Pej – Šu Chan\nDatum: 221 n. l.#!\n#weak Liou Pej se pokoušel znovu získat ztracená území v provincii Ťing, a proto osobně vedl své armády do útoku proti Východnímu Wu. Zpočátku dosáhl několika úspěchů.\n\nBěhem bitvy vlákal generál Lu Sün Liou Pejovy síly do pasti a zapálil tábory Šu Chan, čímž donutil Liou Peje k ústupu. Ten nakonec unikl jen díky tomu, že svým mužům nařídil zapálit zbroje a vytvořit ohnivou bariéru proti útočníkům.\n\nBitva skončila Liou Pejovou rozhodující porážkou, ukončila jeho tažení a nepřímo přispěla k jeho smrti.#!"
 BattlePoIHistoricalNameFeiRiver: "Bitva u řeky Fej"
 BattlePoIHistoricalDescFeiRiver: "#emp Vítěz: Sie An – Ťin\nPoražený: Fu Ťien – Rané Čchin\nDatum: 383 n. l.#!\n#weak Bitva završila dlouhé tažení, během něhož stát Rané Čchin, jenž sjednotil řadu cizích kmenů, ovládl značnou část území říše Ťin. Čchinská vojska měla výraznou početní převahu nad silami Ťin, které zaujaly obranné postavení u řeky Fej.\n\nDisciplinované a dobře vycvičené jednotky Ťin během bitvy rozprášily mnohem početnější, avšak neorganizované a demoralizované síly Raného Čchinu.\n\nPorážka Čchinu, dosažená s minimálními ztrátami, výrazně změnila rovnováhu sil a zajistila jižní Číně nezávislost na více než sto let.#!"
 BattlePoIHistoricalNameCanheSlope: "Bitva na svahu Cchan-che"
 BattlePoIHistoricalDescCanheSlope: "#emp Vítěz: Tchu-pa Kuej – Severní Wej\nPoražený: Mu-žung Pao – Pozdní Jen\nDatum: 395 n. l.#!\n#weak Bitva byla důsledkem konfliktu, v němž dynastie Pozdní Jen podnikla trestnou výpravu proti Severní Wej.\n\nKdyž se vojska Pozdní Jen přiblížila ke svahu Cchan-che, zastihla je náhlá bouře a vzápětí na ně zaútočil nepřítel. Armáda Pozdní Jen byla zaskočena a mnozí její vojáci uprchli přímo do Žluté řeky.\n\nBitva nakonec obrátila mocenské poměry v oblasti ve prospěch Severní Wej, která ovládla většinu území Pozdní Jen.#!"
 BattlePoIHistoricalNameXiangji: "Bitva u chrámu Siang-ťi"
 BattlePoIHistoricalDescXiangji: "#emp Vítěz: [GetScriptedCharacterByHistoryID( 'han_1528' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( 'an_qingxu' ).GetFullName]\nDatum: 757 n. l.#!\n#weak Tato bitva završila tchangský protiútok proti povstaleckým silám, které ovládly většinu severní Číny, a patřila k nejkrvavějším střetnutím povstání An Lu-šana. Obrovská vojska se střetla severně od Čchang-anu poblíž chrámu Siang-ťi.\n\nKolem poledne obsadila tchangská armáda vyvýšeniny, zatímco vojsko Jen stálo přímo před Čchang-anem. Po několika manévrech se bitva změnila ve vleklou patovou situaci, v níž proti sobě disciplinované jednotky neústupně bojovaly, dokud se přední linie Jen pod tíhou krajních ztrát nezhroutila.\n\nBrutalita střetu zdecimovala obě armády, zlomila však páteř povstání. Tchangské síly následujícího dne znovu dobyly Čchang-an.#!"
 BattlePoIHistoricalNameGaoliang: "Bitva u řeky Kao-liang"
 BattlePoIHistoricalDescGaoliang: "#emp Vítěz: [GetScriptedCharacterByHistoryID( '194330' ).GetFullName]\nPoražený: [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullName]\nDatum: 979 n. l.#!\n#weak Bitva následovala po pokusu dynastie Sung znovu získat šestnáct prefektur, které v roce 960 ovládla dynastie Liao. Tažení osobně vedl císařův bratr, budoucí císař [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullNameNoTooltip].\n\nMěsto Jou-čou bylo tři měsíce obléháno, než dorazily liaoské posily a obránce vyprostily. Přestože Sungové zpočátku slavili úspěchy, v noci je překvapil útok ze tří směrů.\n\nBitva skončila, když [GetScriptedCharacterByHistoryID( 'han_4801' ).GetFullNameNoTooltip] uprchl z bojiště na oslí káře. Byla to první velká porážka dynastie Sung po jejím vzestupu k moci.#!"
