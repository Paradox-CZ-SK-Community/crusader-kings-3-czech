 travel_events_oltner_2.1150.b.failure: "Bandité zvítězí"
 travel_events_oltner_2.1150.c.success: "[retinue_member.GetFirstName] zabije vůdce banditů"
 travel_events_oltner_2.1150.c.failure: "[retinue_member.GetFirstName] „tragicky“ zahyne"
 travel_events_oltner_2.1160.t: "Přátelství na stezce"
 travel_events_oltner_2.1160.desc: "Při zdolávání náročné stezky v oblasti [location.GetName] zaslechnu před sebou smích. Přede mnou se [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] a [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] společně snaží překonat [location.Custom('GetRandomCrossingToBridge')].\n\n„[entourage_member_1.GetFirstNameNoTooltip], tvůj nápad postavit provizorní most byl skvělý!“ zvolá [entourage_member_2.GetFirstNameNoTooltip]. [entourage_member_1.GetFirstNameNoTooltip] se zasměje a odpoví: „A tvůj pohotový nápad použít [location.Custom('GetRandomImprovisedBridgeMaterial')] vše dokonale spojil!“\n\nZdá se, že tato překážka vedla ke vzniku nového přátelství."
 travel_events_oltner_2.1160.a: "„Vaše vynalézavost si zaslouží chválu!“"
 travel_events_oltner_2.1160.b: "„Nestýkejte se s lidmi pod svou úroveň!“"
 travel_events_oltner_2.1160.c: "„Tohle nám cestu skutečně urychlí.“"
