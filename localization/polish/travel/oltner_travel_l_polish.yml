 i_saw_nothing: "Ne. Nic jsem neviděl. Vůbec #EMP nic#!. Nejlepší bude na to všechno zapomenout."
 travel_events_oltner_2.1190.t: "Ukradená památka"
 travel_events_oltner_2.1190.desc: "Ticho našeho tábora poblíž oblasti [location.GetName] náhle prolomí pronikavý křik. [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] výhružně čelí osobě [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] a v ruce svírá vzácný předmět: [entourage_member_1.Custom('GetRandomSmallPreciousItem')].\n\n„Zloději! To patřilo mé matce!“ vykřikne [entourage_member_1.GetFirstNameNoTooltip] s očima planoucíma hněvem. [entourage_member_2.GetFirstNameNoTooltip] obvinění prudce odmítá: „Ty prolhaný [entourage_member_1.Custom2('InsultNoun', SCOPE.sC('entourage_member_2'))], vždycky to patřilo mně!“"
 travel_events_oltner_2.1190.a: "„Patří to osobě [entourage_member_1.GetFirstNameNoTooltip].“"
 travel_events_oltner_2.1190.b: "„Ponechá si to [entourage_member_2.GetFirstNameNoTooltip].“"
 travel_events_oltner_2.1190.c: "„Chováte se jako děti. Dejte mi to!“"
 travel_events_oltner_2.1190.d: "„Na tohle opravdu #EMP nemáme#! čas!“"
 travel_events_oltner_2.1190.d.1: "[entourage_member_2.GetName] si předmět vezme"
 travel_events_oltner_2.1190.d.2: "[entourage_member_1.GetName] si předmět vezme"
