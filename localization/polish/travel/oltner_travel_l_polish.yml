 travel_events_oltner_2.1180.t: "Vyznání za svitu měsíce"
 travel_events_oltner_2.1180.desc: "Za měsíčního svitu v oblasti [location.GetName] zaslechnu důvěrný rozhovor mezi [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] a [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName].\n\n„Ach, [entourage_member_1.GetFirstNameNoTooltip], můj [entourage_member_1.Custom('RomanticComplimentAdjective')] [entourage_member_1.Custom('RomanticComplimentNoun')], díky tobě jsou tyto hvězdné noci nezapomenutelné,“ vyznává se chvějícím se hlasem [entourage_member_2.GetFirstNameNoTooltip]. [entourage_member_1.GetFirstNameNoTooltip] tiše odpovídá: „Nikdy bych nečekal, že najdu někoho, kdo mi tak dobře rozumí.“\n\nZdá se, že v mém doprovodu rozkvétá láska..."
 travel_events_oltner_2.1180.a: "Roztomilé, ale [seduced_entourage.GetFirstNameNoTooltip] nedokáže odolat #EMP mně#!."
 travel_events_oltner_2.1180.b: "„Zdravím! O čem si povídáte? Mohu se přidat!?“"
 travel_events_oltner_2.1180.c: "Takové drama... Byla by #EMP opravdová škoda#!, kdyby se o tom někdo dozvěděl..."
 travel_events_oltner_2.1180.d: "Tolik něhy... Nechám je o samotě."
 lover_moonlit_evening_on_the_road: "Mezi [CHARACTER.GetShortUIName] a [TARGET_CHARACTER.GetShortUIName] vzplála láska při společném pozorování hvězd v oblasti [PROVINCE.GetName] během cesty s doprovodem postavy [TARGET_CHARACTER_2.GetFirstName]."
