l_polish:
 travel_events_oltner_2.1000.t: "Zúrodněné písky"
 travel_events_oltner_2.1000.desc: "Slunce spaluje duny oblasti [location.GetName] a každý krok je zkouškou vytrvalosti. Uprostřed této vyprahlé pustiny však rozkvétá oáza zeleně – zemědělský div v samotném srdci pouště.\n\nZatímco tento neobvyklý výjev obdivujeme, přichází správce zdejších pozemků s úsměvem ve tváři ošlehané sluncem. „Poutníci,“ volá [local_character.GetFirstNameNoTooltip], „pojďte se podívat na plody naší práce. Snad do svých domovin odnesete zprávy o našem vítězství nad pískem!“"
 travel_events_oltner_2.1000.option.a: "„Ukažte nám, jak jste si podmanili poušť.“"
 travel_events_oltner_2.1000.option.b: "„Děkujeme, ale musíme odmítnout.“"
 travel_events_oltner_2.1000.option.c: "„Nemohli bychom dostat něco z vaší úrody na cestu?“"
 travel_events_oltner_2.1000.option.d: "„Rád si vyslechnu více o vašem zdejším životě.“"
 cultural_acceptance_gain_travel_stories: "Sdílení příběhů během [Concept('travel','cestování')|E]"
 travel_events_oltner_2.1010.t: "Pohostinné špitály"
 travel_events_oltner_2.1010.desc: "Při cestě krajinou [location.Custom('TerrainTypeProvince')] v oblasti [location.GetName] se u cesty objeví špitál zdobený nádherným uměním z [location.GetCulture.GetNameNoTooltip] kultury.\n\n„Poutníci, vypadáte unaveně. Naše dveře jsou otevřené všem, kdo potřebují odpočinek a péči,“ nabízí lékař s vlídným úsměvem. Uvnitř panuje klid a vzduch naplňuje konejšivá vůně bylin.\n\n„Ochutnejte můj proslulý #EMP ‚Odvar z rostliny [location.Custom('get_region_flower_type')|U]‘#!. Znovu vám vlije sílu do duše!“"
 travel_events_oltner_2.1010.b: "„Nuže, rád ten odvar ochutnám!“"
 travel_events_oltner_2.1010.c: "„Na mém [ROOT.Char.Custom('GetCourtType')] by se lékař hodil. Proč se k nám nepřidáte?“"
 travel_events_oltner_2.1010.d: "„Přijměte tento dar a použijte jej na pomoc nemocným.“"
 well_funded_hospices_modifier: "Dobře financované špitály"
 well_funded_hospices_modifier_desc: "Zdejší špitály vzkvétají díky štědrým darům poutníků."
 local_character_aptitude_physician: "[Concept('aptitude','Způsobilost')|E] postavy [local_character.GetUINamePossessive] ve funkci [GetCourtPositionType('court_physician_court_position').GetName()] je [local_character.GetCourtPositionAptitude( GetCourtPositionType( 'court_physician_court_position' ) )]"
 travel_events_oltner_2.1020.t: "Hostina chovatele velbloudů"
 travel_events_oltner_2.1020.desc: "Když se se svým doprovodem prodírám krajinou [location.GetName], spatřím nezaměnitelné obrysy velbloudí farmy. S příchodem večera k nám přistupuje pastevec.\n\n„Vítejte, vzácní hosté,“ září [local_character.GetFirstNameNoTooltip]. „Velbloudi z oblasti [location.GetName] nás živí a dnes večer vzdáváme těmto ušlechtilým zvířatům čest. Připojíte se k nám pod hvězdami při hostině a vyprávění příběhů z pouště?“"
 travel_events_oltner_2.1020.a: "„Nechť veselí této noci posílí naše duše!“"
 travel_events_oltner_2.1020.b: "„Zajímá mě velbloudí vytrvalost.“"
 travel_events_oltner_2.1020.c: "„Chci pro svou armádu koupit vašeho nejlepšího velblouda.“"
 travel_events_oltner_2.1020.d: "„Cesta mě bohužel volá dál, a proto musím odmítnout.“"
 travel_hardy_camels_modifier: "Odolní velbloudi"
 travel_hardy_camels_modifier_desc: "Tuto výpravu doprovází skupina mimořádně odolných a spolehlivých velbloudů."
 war_camel_modifier: "Statný válečný velbloud"
 war_camel_modifier_desc: "Tato postava vlastní mimořádně působivého válečného velblouda."
 travel_events_oltner_2.1030.t: "Naložená karavana"
 travel_events_oltner_2.1030.desc: "Při cestě přes písky oblasti [location.GetName] nám zkříží cestu karavana velbloudů obtěžkaných nákladem. Vůdce karavany si všimne našeho doprovodu a zastaví průvod.\n\n„Vznešení poutníci,“ volá [local_character.GetFirstNameNoTooltip] s vychytralým zábleskem v očích, „nechcete si prohlédnout poklady, které tato houževnatá zvířata nesou? Za správnou cenu vás mohou divy pouště doprovázet na vašich cestách.“"
 travel_events_oltner_2.1030.a: "„Rád si prohlédnu vaše zboží. Pojďme smlouvat.“"
 travel_events_oltner_2.1030.b: "„Není třeba, ale mohli bychom nějakou dobu cestovat společně.“"
 travel_events_oltner_2.1030.c: "„Ukažte mi něco jedinečného, skutečný poklad oblasti [location.GetNameNoTooltip].“"
 travel_events_oltner_2.1030.d: "„Už tak neseme dost břemen...“"
 traveling_with_camel_merchants_modifier: "Cestování s obchodníky s velbloudy"
 traveling_with_camel_merchants_modifier_desc: "Tento doprovod se připojil ke skupině pouštních obchodníků, díky čemuž je cesta bezpečnější."
 artifact_purchased: "Zakoupený artefakt"
 purchase_artifact_trinket_tt: "Získáš náhodnou cetku, která je [Concept('artifact','artefaktem')|E]"
 purchase_artifact_famed_tt: "Získáš náhodný proslulý [Concept('artifact','artefakt')|E]"
 travel_events_oltner_2.1040.t: "Oáza klidu"
 travel_events_oltner_2.1040.desc: "Při cestě vyprahlými pláněmi oblasti [location.GetName] spatříme poklidnou oázu obklopenou množstvím velbloudů.\n\nMoudrý stařešina odpočívající u vody si všimne našeho příchodu a přívětivě nám pokyne. „Unavení poutníci,“ začíná [local_character.GetFirstNameNoTooltip] hlasem měkkým jako večerní vánek, „duch pouště umí být krutý. Odpočiňte si u našich vod a nechte se posílit tichou silou velbloudů.“"
 travel_events_oltner_2.1040.a: "„Při [ROOT.Char.GetFaith.HighGodName], zůstaňme zde několik dní!“"
 travel_events_oltner_2.1040.b: "„Zdáte se být moudrý člověk. Proč se k nám nepřidáte?“"
 travel_events_oltner_2.1040.c: "„Možná bychom mohli obchodovat.“"
 travel_events_oltner_2.1040.d: "„Pohled na vaši oázu je hotovým balzámem pro oči, ale čas nás tlačí.“"
 travel_events_oltner_2.1050.t: "Vyslanci na koních"
 travel_events_oltner_2.1050.desc: "Při cestě okrajem oblasti [location.GetName] prolomí ticho hromový dusot kopyt. Blíží se skupina jezdců na nádherných koních, majestátní výjev s [location.Custom('TerrainTypeProvincePrefix')] [location.Custom('TerrainTypeProvince')] v pozadí.\n\n„Buďte zdrávi, poutníci!“ volá jejich vůdce. „Jsme vyslanci z titulu [location.GetTitle.GetName]. Nechcete na vlastní oči spatřit zdatnost našich ořů?“"
 travel_events_oltner_2.1050.a: "„S radostí!“"
 travel_events_oltner_2.1050.b: "„Kolik zlata chcete za toho nejsilnějšího?“"
 travel_events_oltner_2.1050.c: "„Více mě zajímá #EMP vaše#! zdatnost coby $knight_culture_player_plural_no_tooltip_lowercase$!“"
 travel_events_oltner_2.1050.d: "„Jsou to nádherná zvířata, ale musím dát přednost své cestě.“"
 prefix_verdant: "zelenající se"
 prefix_rolling: "vlnící se"
 prefix_mighty: "majestátní"
 prefix_endless: "do dáli se táhnoucí"
 prefix_lush: "bujně zarůstající"
 prefix_rich: "oplývající hojností"
 travel_events_oltner_2.1060.t: "Správce stájí"
 travel_events_oltner_2.1060.desc: "Vůně sena a zvuk řehtání nás dovedou k proslulým stájím v oblasti [location.GetName]. Vřele nás uvítá správce stájí, který se v kraji těší značné úctě.\n\n„Vítejte,“ prohlašuje [local_character.GetFirstNameNoTooltip], „mí koně patří k nejrychlejším, jaké lze najít. Nechtěli byste si takového ušlechtilého společníka na své cesty zakoupit?“"
 travel_events_oltner_2.1060.a: "„Ukažte mi svého nejrychlejšího koně.“"
 travel_events_oltner_2.1060.b: "„Požaduji všechny vaše nejlepší koně!“"
 travel_events_oltner_2.1060.c: "„Nechtěli byste koupit naše přebytečné klisny?“"
 travel_events_oltner_2.1060.d: "„Bohužel musíme #EMp rychle#! pokračovat dál...“"
 swift_horse_modifier: "Rychlý kůň"
 swift_horse_modifier_desc: "Vedoucí této výpravy má mimořádně rychlého koně."
 swift_horses_modifier: "Rychlí koně"
 swift_horses_modifier_desc: "Tento doprovod používá pouze ty nejrychlejší oře."
 sold_horses_modifier: "Prodaní koně"
 sold_horses_modifier_desc: "Tento doprovod prodal své přebytečné jezdecké koně."
 travel_events_oltner_2.1070.t: "Léčitel koní"
 travel_events_oltner_2.1070.desc: "Uprostřed poklidných pastvin oblasti [location.GetName] spatříme člověka ošetřujícího koně s poraněnou nohou. Když přijdeme blíže, léčitel vzhlédne a v jeho očích se zračí dlouholeté zkušenosti.\n\n„Jen nešťastně došlápla,“ vysvětluje [local_character.GetFirstNameNoTooltip], „ale znovu poběží.“ Péče věnovaná zvířeti nás přiměje na chvíli přerušit cestu."
 travel_events_oltner_2.1070.a: "„Můžeme vám pomoci toto ušlechtilé zvíře vyléčit?“"
 travel_events_oltner_2.1070.b: "„Měl byste se stát mým správcem koní!“"
 travel_events_oltner_2.1070.c: "„Nemohl byste mě tomuto řemeslu naučit?“"
 travel_events_oltner_2.1070.d: "„Doufám, že se brzy uzdraví. Sbohem.“"
 free_court_position: "Pracuje zdarma"
 master_of_the_horse_free: "[local_character.GetFirstName] bude vykonávat úřad [GetCourtPositionType('master_of_horse_court_position').GetName()] bez nároku na plat"
 excellent_horse_care_modifier: "Vynikající péče o koně"
 excellent_horse_care_modifier_desc: "Tato postava dokonale ovládá umění péče o koně."
 travel_events_oltner_2.1080.t: "Páchnoucí náhrada"
 travel_events_oltner_2.1080.desc: "Když procházíme velbloudími farmami oblasti [location.GetName], zaútočí na naše smysly pronikavý zápach. Velbloudi jsou sice nepostradatelní, ale jejich pach prostupuje každým koutem.\n\nJeden z našich koní se náhle splaší a prchá do dáli, zjevně vyděšený tím zápachem.\n\n„Omlouvám se, [ROOT.Char.Custom('FormOfAddressForLiege')]!“ zvolá chovatel. „Jako náhradu za vaši ztrátu si můžete vybrat jednoho z mých nejlepších velbloudů.“"
 travel_events_oltner_2.1080.a: "„Vyberu si vašeho nejmajestátnějšího velblouda.“"
 travel_events_oltner_2.1080.b: "„Chci toho nejodolnějšího jedince.“"
 travel_events_oltner_2.1080.c: "„Postačí mi vaše nejrychlejší zvíře.“"
 travel_events_oltner_2.1080.d: "„Raději mi prostě zaplaťte zlatem...“"
 exchange_camel_fast_modifier: "Rychlý velbloud"
 exchange_camel_fast_modifier_desc: "Jeden z koní této cestovní družiny utekl a byl nahrazen rychlým velbloudem."
 exchange_camel_sturdy_modifier: "Houževnatý velbloud"
 exchange_camel_sturdy_modifier_desc: "Jeden z koní této cestovní družiny utekl a byl nahrazen houževnatým velbloudem."
 travel_events_oltner_2.1090.t: "Strážce tichých dun"
 travel_events_oltner_2.1090.desc: "V tichu oblasti [location.GetName], kde horký vítr tvaruje písek, osamoceně bdí strážní věž. Její přísný strážce nás vřele vítá.\n\n„Vážení hosté!“ volá [local_character.GetWomanMan] z vrcholu věže. „Mohu pro vás něco udělat? Třeba byste se ke mně chtěli připojit a společně hledět na poklidnou krajinu [location.Custom('TerrainTypeProvince')]?“"
 travel_events_oltner_2.1090.a: "„Příteli, dovol nám odpočinout si pod tvou ochranou.“"
 travel_events_oltner_2.1090.b: "„Povězte nám, jdeme správnou cestou?“"
 travel_events_oltner_2.1090.c: "„Nemohl byste nás zdejší krajinou provést?“"
 travel_events_oltner_2.1090.d: "„Musíme rychle pokračovat dál.“"
 watchtower_guidance_modifier: "Pokyny ze strážní věže"
 watchtower_guidance_modifier_desc: "Tento doprovod obdržel pokyny od bystrozrakého strážce."
 watchman_guidance_modifier: "Pouštní strážce"
 watchman_guidance_modifier_desc: "Tento doprovod provází zkušený strážce, který dokonale zná zdejší krajinu."
 travel_events_oltner_2.1100.t: "Bohatství stád"
 travel_events_oltner_2.1100.desc: "Cesta oblastí [location.GetName] před námi odhalí rozlehlé pastviny poseté dobytkem. Když se můj doprovod zastaví na okraji zelenajícího se pole, přichází pastevec. Vesele brnká na svou loutnu a vítá nás širokým úsměvem.\n\n„[ROOT.Char.Custom('FormOfAddressForLiege')|U],“ začíná [local_character.GetFirstNameNoTooltip], „tato zvířata jsou pýchou naší provincie! Chcete se podívat na naši práci, doplnit zásoby, nebo snad ochutnat náš proslulý modrý sýr z oblasti [location.GetTitle.GetNameNoTierNoTooltip]?“"
 travel_events_oltner_2.1100.a: "„Ukažte mi, jak pečujete o svá stáda.“"
 travel_events_oltner_2.1100.b: "„Doplňme zásoby i naše žaludky!“"
 travel_events_oltner_2.1100.c: "„Modrý sýr z oblasti [location.GetTitle.GetNameNoTierNoTooltip] zní #EMP lahodně!#!“"
 travel_events_oltner_2.1100.d: "„Musíme si pospíšit.“"
 extra_supplies_modifier: "Dodatečné zásoby"
 extra_supplies_modifier_desc: "Tato cestovní družina veze hojné zásoby."
 herding_insights_modifier: "Poznatky o pastevectví"
 herding_insights_modifier_desc: "Na těchto územích se uplatňují pokročilé pastevecké postupy získané během cestování."
 travel_events_oltner_2.1110.t: "Řinčení kovárny"
 travel_events_oltner_2.1110.desc: "Naše cesta nás přivádí do oblasti [location.GetName], kde pravidelné údery kovářských kladiv udávají rytmus místnímu obchodu. Z komínů se valí kouř a kováři zalití potem a pokrytí sazemi mění surový kov v obdivuhodná díla.\n\nJeden z kovářů si otře čelo a pokyne mi, abych přistoupil blíže. „Vítejte, [ROOT.Char.Custom('FormOfAddressForLiege')],“ prohlašuje [local_character.GetFirstNameNoTooltip]. „Jsme mistři kováři z [local_character.GetCulture.GetNameNoTooltip] kultury a nikdo se nám nevyrovná! Račte si prohlédnout naše zboží.“"
 travel_events_oltner_2.1110.a: "„Nová zbroj by se mi hodila.“"
 travel_events_oltner_2.1110.b: "„Hledám nějakou zbraň.“"
 travel_events_oltner_2.1110.c: "„Vyrábíte také štíty?“"
 travel_events_oltner_2.1110.d: "„Dávám přednost vlastním kovářům. Sbohem.“"
 purchase_artifact_common_armor_tt: "Zakoupíš artefakt v podobě zbroje neznámé [Concept('rarity','vzácnosti')|E]"
 purchase_artifact_common_weapon_tt: "Zakoupíš artefakt v podobě zbraně neznámé [Concept('rarity','vzácnosti')|E]"
 purchase_artifact_common_shield_tt: "Zakoupíš [Concept('artifact','artefakt')|E] v podobě nástěnného štítu neznámé [Concept('rarity','vzácnosti')|E]"
 travel_events_oltner_2.1120.t: "Kovář v nesnázích"
 travel_events_oltner_2.1120.desc: "Při pomalém průjezdu oblastí [location.GetName] narazí náš doprovod na zpustošenou kovářskou dílnu. Kovář pokrytý sazemi zoufale naříká nad rozbitou výhní.\n\n„Ach, [local_character.GetFaith.HighGodName] proklel nebohého člověka jménem [local_character.GetTitledFirstName]! Neštěstí dopadlo na mou kovadlinu!“ vysvětluje [local_character.GetFirstNameNoTooltip]. „Bez opravy upadne mé řemeslo i má obživa. Běda mi!“"
 travel_events_oltner_2.1120.a: "„Vezměte si toto zlato, ať se můžete znovu postavit na nohy.“"
 travel_events_oltner_2.1120.b: "„Přidejte se k nám. Kovář by se nám hodil.“"
 travel_events_oltner_2.1120.c: "„To je strašné. Nu což!“"
 becomes_inspired: "Získá [Concept('inspired','inspiraci')|E]"
 travel_events_oltner_2.1130.t: "Strážce krajiny [location.Custom('TerrainTypeProvince')|U]"
 travel_events_oltner_2.1130.desc: "Když se před námi vynoří silueta oblasti [location.GetName], krajině dominují drsné obrysy opevněných hradišť.\n\nPřichází skupina surově vyhlížejících bojovníků, jejichž vůdce působí nejhruběji ze všech. „[ROOT.Char.Custom('FormOfAddressForLiege')],“ kývne [local_character.GetFirstNameNoTooltip], „jsme [local_character.GetWomenMen] z posádky vládce [location.GetTitle.GetHolder.GetTitledFirstName]. Za nevelký poplatek vás můžeme během cesty ochránit. Co vy na to?“"
 travel_events_oltner_2.1130.a: "„Proveďte nás bezpečně krajinou [location.Custom('TerrainTypeProvince')].“"
 travel_events_oltner_2.1130.b: "„Vypadáte silně. Nechcete se ke mně přidat?“"
 travel_events_oltner_2.1130.c: "„Všichni vypadáte obávaně. Zaplatím vám dvojnásobek toho, co [location.GetTitle.GetHolder.GetFirstNameNoTooltip]!“"
 travel_events_oltner_2.1130.d: "„Není třeba, ale děkuji vám.“"
 hill_fort_guards_modifier: "Strážci posádky hradiště"
 hill_fort_guards_modifier_desc: "Tento doprovod zaměstnává ostřílené strážce hradišť."
 toll_payed: "Zaplacené cestovní mýto"
 travel_events_oltner_2.1140.t: "Malí obránci"
 travel_events_oltner_2.1140.desc: "U paty obzvláště působivého hradiště v oblasti [location.GetName] si skupina dětí hraje na bojovníky a jejich smích ostře kontrastuje s vážností kamenných hradeb.\n\nJedno smělé dítě s jasnýma očima přichází s dřevěným mečem. „Stát! Nikdo nesmí projít kolem pevnosti [local_character.GetFirstName] a družiny, která je [local_character.Custom('ComplimentAdjective')]!“ vykřikne dítě radostně. „Počkat, vy... vy jste [ROOT.Char.GetTitleAsNameNoTooltip]!?“"
 travel_events_oltner_2.1140.a: "„Přesně tak! A teď běžte a povězte o mně celé vesnici!“"
 travel_events_oltner_2.1140.b: "„Stateční obránci, ukažte nám nejrychlejší cestu přes krajinu [location.Custom('TerrainTypeProvince')].“"
 travel_events_oltner_2.1140.c: "„#EMP *Tas zbraň a zažeň děti*#!“"
 travel_events_oltner_2.1140.d: "„Užívej si svých her, dítě. My musíme pokračovat.“"
 travel_hastened: "Cesta urychlena"
 travel_delayed: "Cesta zdržena"
 famous_visit_modifier: "Slavná návštěva"
 famous_visit_modifier_desc: "Vesnice po celém okolí žijí zprávami o návštěvě urozených hostů. Přitahuje to návštěvníky a obchodníky ze širokého okolí, ale také lapky pátrající po zlatem obtížených šlechticích."
 child_scouts_modifier: "Dětští zvědové"
 child_scouts_modifier_desc: "Tento doprovod vede skupina dětí s těmi nejlepšími úmysly."
 extra_patrols_modifier: "Posílené hlídky"
 extra_patrols_modifier_desc: "Poté, co poutníci vyhrožovali místním dětem, byly hlídky v tomto baronství zdvojnásobeny."
 travel_events_oltner_2.1150.t: "Ozvěna rohů"
 travel_events_oltner_2.1150.desc: "Při průchodu krajinou [location.Custom('TerrainTypeProvince')] poblíž oblasti [location.GetName] naplní vzduch ozvěna rohů. Jejich zvuk se odráží od hradišť jako výzva do zbraně, která zde zaznívá po celé generace.\n\nPouhých několik okamžiků po prvním zatroubení vyrazí z nejbližšího opevnění zástup bojovníků z [local_character.GetCulture.GetName] kultury a vrhne se na vyděšenou skupinu lupičů a banditů."
 travel_events_oltner_2.1150.a: "„Musíme jim pomoci. Do útoku!“"
 travel_events_oltner_2.1150.b: "„Počkáme a potom obereme mrtvoly.“"
 travel_events_oltner_2.1150.c: "„[retinue_member.GetFirstNameNoTooltip], pomoz jim! My... zůstaneme tady.“"
 travel_events_oltner_2.1150.d: "„Tohle není naše bitva.“"
 cultural_acceptance_gain_assisted_battle: "Pomoc v bitvách proti banditům během [Concept('travel','cestování')|E]"
