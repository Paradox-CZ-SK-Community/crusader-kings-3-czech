 trap_scenario_thorny_brush: "se téměř zaplete do trnitého křoví ukrytého v trávě, ale zachrání jej ostražitost osoby"
 trap_scenario_snow_laden_branch: "se chystá projít pod oslabenou větví obtíženou sněhem, ale rychle jej stáhne zpět"
 trap_scenario_water_covered_ditch: "téměř klopýtne do hlubokého příkopu zakrytého vodou, ale zpět jej strhne"
