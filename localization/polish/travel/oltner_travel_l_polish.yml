 friend_praised_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] veřejně chválí pohotovou reakci postavy [CHARACTER.GetShortUIName]."
 avoiding_traps_modifier: "Vyhýbání se pastem"
 avoiding_traps_modifier_desc: "Tento doprovod se za každou cenu vyhýbá všem pastem."
 travel_events_oltner_2.1210.t: "Noční serenáda"
 travel_events_oltner_2.1210.desc: "Pod hvězdnou oblohou oblasti [location.GetName] se tábor dočká nečekaného vystoupení. [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] všechny překvapí procítěnou melodií a zpěvem plným chvály na osobu [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName].\n\n[entourage_member_1.GetFirstName] pozorně naslouchá a je viditelně vyveden z míry. Když píseň skončí, oba si beze slov vymění chápavý pohled."
 travel_events_oltner_2.1210.a: "Jestli mezi těmi dvěma něco je, zjistím to..."
 travel_events_oltner_2.1210.b: "„[entourage_member_2.GetFirstNameNoTooltip], celý svět by měl slyšet tvou hru a zpěv!“"
 travel_events_oltner_2.1210.c: "„Mohl... mohl bys mě naučit takto hrát?“"
 travel_events_oltner_2.1210.d: "„Ach, jak nádherná melodie.“"
 travel_events_oltner_2.1210.a.success: "Něco zjistíš"
 travel_events_oltner_2.1210.a.failure: "Není co zjistit"
 something_happens: "Něco se stane"
