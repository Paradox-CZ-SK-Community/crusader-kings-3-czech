 travel_events_oltner_2.1200.t: "Anděl strážný"
 travel_events_oltner_2.1200.desc: "Při průchodu krajinou [location.Custom('TerrainTypeProvince')] v oblasti [location.GetName] vidím, jak [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] [location.Custom('GetRandomHazardAndRescue')] [ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName].\n\n„[entourage_member_2.GetFirstNameNoTooltip], musíš být opatrnější,“ napomíná se zřetelnou starostí v hlase [entourage_member_1.GetFirstNameNoTooltip]. [entourage_member_2.GetFirstNameNoTooltip] odpoví rozpačitým, vděčným úsměvem. „Díky, jsem tvým dlužníkem!“"
 travel_events_oltner_2.1200.a: "To byla pohotová reakce, [entourage_member_1.GetFirstNameNoTooltip]!"
 travel_events_oltner_2.1200.b: "[entourage_member_2.GetFirstNameNoTooltip], nic osobě [entourage_member_1.GetFirstNameNoTooltip] nedlužíš."
 travel_events_oltner_2.1200.c: "Nějakou dobu postupujme s nejvyšší opatrností."
 travel_events_oltner_2.1200.d: "Ach, musíme si pospíšit!"
