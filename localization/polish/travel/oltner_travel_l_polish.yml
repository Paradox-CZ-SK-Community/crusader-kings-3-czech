 travel_events_oltner_2.1170.t: "Stezka soupeření"
 travel_events_oltner_2.1170.desc: "Při cestě drsnou krajinou oblasti [location.GetName] vyvstane problém, protože [location.Custom('GetPrecariousTerrainFeature')].\n\n[ROOT.Char.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] a [ROOT.Char.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] se začnou hádat o nejlepší způsob překonání nebezpečné stezky. „[entourage_member_1.GetFirstNameNoTooltip], tvůj návrh je bezohledný!“ zvolá viditelně rozčilený [entourage_member_2.GetFirstNameNoTooltip]. [entourage_member_1.GetFirstNameNoTooltip] odsekne: „A ten tvůj je zbabělý!“\n\nZdá se, že můj doprovod uvízl na mrtvém bodě..."
 travel_events_oltner_2.1170.a: "„Poslouchejte mě, musíte #EMP spolupracovat#!.“"
 travel_events_oltner_2.1170.b: "„[entourage_member_1.GetFirstNameNoTooltip] má pravdu. Nemůžeme si dovolit otálet.“"
 travel_events_oltner_2.1170.c: "„Buďme opatrní, jak navrhuje [entourage_member_2.GetFirstNameNoTooltip].“"
 travel_events_oltner_2.1170.d: "„Ach, [ROOT.Char.GetFaith.HighGodName], chovají se jako děti...“"
 rival_conflict_on_the_road: "Mezi [CHARACTER.GetShortUIName] a [TARGET_CHARACTER.GetShortUIName] došlo k vážnému sporu o volbu trasy při průchodu krajinou [PROVINCE.Custom('TerrainTypeProvince')] v oblasti [PROVINCE.GetName] s doprovodem postavy [TARGET_CHARACTER_2.GetFirstName]."
 rival_conflict_on_the_road_corresponding: "Mezi [CHARACTER.GetShortUIName] a [TARGET_CHARACTER.GetShortUIName] došlo k vážnému sporu o volbu trasy při průchodu krajinou [PROVINCE.Custom('TerrainTypeProvince')] v oblasti [PROVINCE.GetName] s doprovodem postavy [TARGET_CHARACTER_2.GetFirstName]."
