 lover_serenaded_on_the_road_corresponding: "[TARGET_CHARACTER.GetShortUIName|U] během cesty oblastí [PROVINCE.GetName] s doprovodem postavy [TARGET_CHARACTER_2.GetFirstName] zazpívá romantickou serenádu postavě [CHARACTER.GetShortUIName]."
 travel_events_oltner_2.1220.t: "Konec rivala"
 travel_events_oltner_2.1220.desc: "V hluboké noci tiše vyjdu z našeho tábora poblíž oblasti [location.GetName]. Co to bylo za zvuk?\n\nTehdy to spatřím: [location.Custom('GetTerrainMurderMethod')|U]\n\n[entourage_member_1.GetFirstNameNoTooltip] rychle přehlédne okolí a netuší, že jsem vše viděl."
 travel_events_oltner_2.1220.a: "Hm. Pozoruhodná technika."
 travel_events_oltner_2.1220.b: "„#EMP STRÁŽE!#!“"
 travel_events_oltner_2.1220.c: "Nic... jsem neviděl..."
 assassination_scenario_desert: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] tiše přistupuje k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí pod palmou. Náhle [entourage_member_1.GetFirstNameNoTooltip] zahrne krk postavy [entourage_member_2.GetFirstNameNoTooltip] pískem a v naprostém tichu ji udusí."
 assassination_scenario_desert_mountains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se plíží k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí poblíž okraje útesu. Jediným prudkým strčením pošle [entourage_member_1.GetFirstNameNoTooltip] postavu [entourage_member_2.GetFirstNameNoTooltip] dolů po strmém horském svahu."
 assassination_scenario_drylands: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se přikrádá k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která odpočívá u uschlého keře. [entourage_member_1.GetFirstNameNoTooltip] uchopí kámen a smrtící silou udeří postavu [entourage_member_2.GetFirstNameNoTooltip] do hlavy. Na zemi zůstane pouze tmavá skvrna."
 assassination_scenario_farmlands: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] přistupuje k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí poblíž pluhu. Náhlým násilným pohybem [entourage_member_1.GetFirstNameNoTooltip] nabodne postavu [entourage_member_2.GetFirstNameNoTooltip] na ostré hroty pluhu a rychle ukončí její život."
 assassination_scenario_floodplains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se přikrádá k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName] na říčním břehu. Náhlým strčením [entourage_member_1.GetFirstNameNoTooltip] utopí postavu [entourage_member_2.GetFirstNameNoTooltip] v kalné a prudce proudící vodě."
 assassination_scenario_forest: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] tiše přistupuje k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí pod stromem. [entourage_member_1.GetFirstNameNoTooltip] ji rychle uškrtí provazem a nechá její bezvládné tělo viset z větve."
 assassination_scenario_hills: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se po špičkách přiblíží k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která podřimuje na svahu. [entourage_member_1.GetFirstNameNoTooltip] svalí postavu [entourage_member_2.GetFirstNameNoTooltip] ze svahu, kde jí ostré kameny zajistí rychlý a bolestivý konec."
 assassination_scenario_jungle: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] tiše postupuje k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí pod hustým listovím. [entourage_member_1.GetFirstNameNoTooltip] ji uškrtí liánou a zanechá bezvládně zapletenou v porostu."
 assassination_scenario_mountains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se přikrádá k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která odpočívá u kolmého srázu. Náhlé prudké strčení pošle postavu [entourage_member_2.GetFirstNameNoTooltip] do hluboké propasti."
 assassination_scenario_oasis: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] tiše přistupuje k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí u břehu. [entourage_member_1.GetFirstNameNoTooltip] rychle ponoří její hlavu pod vodu a v tichosti ji utopí."
 assassination_scenario_plains: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se tiše blíží k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí na otevřeném poli. [entourage_member_1.GetFirstNameNoTooltip] jí těžkým kamenem rozdrtí lebku a zanechá trávu potřísněnou krví."
 assassination_scenario_steppe: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] sleduje osobu [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí pod širým nebem. [entourage_member_1.GetFirstNameNoTooltip] jí rychle zlomí vaz a zanechá ji bezvládně ležet na rozlehlé stepi."
 assassination_scenario_taiga: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] přistupuje k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí mezi borovicemi. [entourage_member_1.GetFirstNameNoTooltip] ji probodne rampouchem a krev rozpustí led do zasněžené půdy."
 assassination_scenario_wetlands: "[player_scope.Custom2('RelationToMeShort', entourage_member_1 )] [entourage_member_1.GetFirstName] se tiše brodí k osobě [player_scope.Custom2('RelationToMeShort', entourage_member_2 )] [entourage_member_2.GetFirstName], která spí na bažinaté zemi. [entourage_member_1.GetFirstNameNoTooltip] ji udusí bahnem a zanechá bezvládně ležet v močálu."
 travel_events_oltner_2.1230.t: "Hrůzné ráno"
 travel_events_oltner_2.1230.desc: "„Při [ROOT.Char.GetFaith.HighGodName], došlo k #EMP vraždě!#!“\n\n„Kdo by si přál smrt našeho [entourage_member_2.Custom('ComplimentAdjective')] člověka jménem [entourage_member_2.GetFirstName]? A proč musel být pachatel tak #EMP krutý?!#!“ pokračuje [player_scope.Custom2('RelationToMeShort', corpse_finder )] [corpse_finder.GetFirstName].\n\n„Ano, skutečně... Kdo by si #EMP vůbec dokázal představit#!, že by něco takového provedl nebohé a nevinné postavě [entourage_member_2.GetFirstNameNoTooltip],“ pronese [entourage_member_1.GetFirstName]. Koutkem oka vidím, jak se snaží potlačit smích."
 travel_events_oltner_2.1230.a: "„Byl to [corpse_finder.GetFirstNameNoTooltip]. [entourage_member_1.GetFirstNameNoTooltip], #EMP zabij [corpse_finder.GetFirstNameNoTooltip]!#!“"
 travel_events_oltner_2.1230.b: "„Viděl jsem [corpse_finder.GetFirstNameNoTooltip], jak se v noci plíží. Chopte se [corpse_finder.GetFirstNameNoTooltip]!“"
 travel_events_oltner_2.1230.c: "„Tohle je nepochybně dílo zvířete zvaného [ROOT.Char.Custom('RegionalFerociousAnimal')].“"
 travel_events_oltner_2.1230.d: "„Měli... měli bychom pokračovat dál...“"
 might_strike_again: "[entourage_member_1.GetFirstName] může udeřit znovu... Znám však [Concept('secret','tajemství')|E] postavy [entourage_member_1.GetFirstNameNoTooltip] a mohu je kdykoli odhalit."
 travel_events_oltner_2.1240.t: "Potulná kejklířská družina"
 travel_events_oltner_2.1240.desc: "Při vstupu na území titulu [location.GetTitle.GetName] nás vítá družina kejklířů. Nechybí loutková představení, tanec ani zpěv!\n\n[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('entourage_member_1'))] [entourage_member_1.GetFirstName] si hudbu očividně užívá a obzvlášť jej okouzlil jeden šašek. Tento šašek je mimořádný umělec – během hry žongluje s několika nástroji zároveň!"
 travel_events_oltner_2.1240.a: "Možná bych měl strávit nějaký čas s osobou [entourage_member_1.GetFirstNameNoTooltip]."
 travel_events_oltner_2.1240.b: "Hodil by se mi šašek a přítomnost postavy [local_character.GetFirstNameNoTooltip] by jistě potěšila i osobu [entourage_member_1.GetFirstNameNoTooltip]!"
 travel_events_oltner_2.1240.c: "Zasloužený odpočinek pro nás všechny."
