 trap_scenario_cliff_edge: "se téměř zřítí přes skrytý okraj útesu, ale na poslední chvíli jej zachytí"
 trap_scenario_water_hole: "téměř spadne do rákosím zakryté vodní jámy, ale rychle jej podepře"
