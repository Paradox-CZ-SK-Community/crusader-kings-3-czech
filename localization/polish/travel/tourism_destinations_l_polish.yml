l_polish:
 building_holy_site_mahabodhi_temple_destination_desc: "Při putování posvátným areálem stavby [GetBuilding('holy_site_mahabodhi_temple_01').GetName] na mě doléhá její pokojná atmosféra. Místo, kde Buddha pod stromem bódhi dosáhl osvícení, je naplněno hlubokým mírem. Složité reliéfy zachycující jeho cestu k osvícení mi připomínají duchovní stezku, po níž musí kráčet každý z nás."
 building_goguryeo_tomb_destination_desc: "Krajině již z dálky dominuje obrovská pyramida. Přestože se jí říká [GetBuilding('goguryeo_tomb_01').GetName], nikdo zřejmě nedokáže přesně určit, který král je zde pohřben. Samotná velikost a jedinečná architektura hrobky spolu s nástěnnými malbami působivých jezdců přesto vyprávějí o slavné minulosti tohoto kraje."
 building_buddha_kamakura_destination_desc: "Když vstoupím do velké síně, v níž se nachází [GetBuilding('buddha_kamakura_01').GetName], okamžitě mě ohromí jeho nesmírná velikost. Přestože Buddha sedí v lotosové pozici, stále převyšuje několik mužů stojících na sobě. Obrovská bronzová socha vzbuzuje duchovní úctu i obdiv k mimořádnému řemeslnému umění, které bylo k vytvoření tohoto bronzového kolosu zapotřebí."
 building_pyramid_lingapura_destination_desc: "Stavba [GetBuilding('pyramid_lingapura_01').GetName] je nejvýraznější dominantou města. Když vstoupím do jejího ohrazeného areálu, nemohu se ubránit úžasu nad obrovskou pyramidou tyčící se nade mnou. Schodiště vedoucí k vrcholu lemují malé kaple a svatyně a nahoře stojí velký chrám se zlatým lingamem na mohutném podstavci."
 building_maijishan_grottoes_destination_desc: "Hora Maj-ťi-šan se již z dálky zvedá nad okolní krajinu. Čím více se přibližuji, tím větší část stavby [GetBuilding('maijishan_grottoes_01').GetName], vytesané do úbočí rudé hory, se přede mnou odhaluje. Jeskyní je tolik, že je nelze spočítat, a každý otvor zdobí množství hliněných soch."
 building_three_pagodas_dali_destination_desc: "Stavba [GetBuilding('three_pagodas_dali_01').GetName], tyčící se před chrámovým komplexem Čchung-šeng, je hlavní dominantou Ta-li i největší památkou celého království. Hlavní šestnáctipatrová pagoda připomíná, jak nepatrný je jediný člověk v širším řádu světa. Okolí je plné poutníků a mnichů; někteří kolem velkolepých staveb procházejí bez povšimnutí, zatímco jiní je očividně spatřují poprvé."
 building_iron_lion_cangzhou_destination_desc: "Mohutná stavba [GetBuilding('iron_lion_cangzhou_01').GetName], odlitá ze železa, přečkala zemětřesení i povodně. Místní obchodníci mi během rozhovoru vyprávějí, že tato veliká šelma má údajně střežit kraj dokonce i před stoupajícími mořskými vodami."
 building_dengfeng_observatory_destination_desc: "Při vstupu do města je již z dálky vidět velkolepá stavba [GetBuilding('dengfeng_observatory_01').GetName]. Toto místo je považováno za střed země a čínští astronomové zde po staletí pozorují oblohu. Ve dne stavba slouží jako obrovské sluneční hodiny a v noci jako hvězdárna k mapování hvězd."
 building_muara_takus_destination_desc: "Stavba [GetBuilding('muara_takus_01').GetName] připomíná moc Šrívidžajské říše a zároveň představuje významné středisko bohoslužeb. Při příchodu mě obklopují poutníci ze všech okolních ostrovů. Zdejší chrámový komplex je po staletí centrem duchovní i světské moci."
 building_stone_pagoda_destination_desc: "O stavbě [GetBuilding('stone_pagoda_01').GetName] se říká, že je nejstarší svého druhu v tomto kraji. Při pohledu na její neposkvrněné bílé zdivo odrážející ostré sluneční světlo je tomu však těžké uvěřit. Dozvídám se, že byla na příkaz dávného krále vybudována ve vypuštěném rybníku a že se na její stavbě podíleli řemeslníci ze všech korejských království."
 building_thuriang_kilns_destination_desc: "Nemohu se ubránit obdivu ke kráse chrámů a vodou naplněných příkopů v Suchothaji. Město však očividně není pouze centrem víry. Při průchodu rušnou čtvrtí spatřím proslulou stavbu [GetBuilding('thuriang_kilns_01').GetName], kde mistři svého řemesla vyrábějí nádherné kusy seladonové keramiky určené na vývoz do celého okolí."
 building_yuelu_academy_destination_desc: "Když procházím hlavním nádvořím stavby [GetBuilding('yuelu_academy_01').GetName], naplňuje mě úcta k učencům a Konfuciovým žákům, kteří sem přicházejí vyučovat a vést rozpravy. Snadno lze pochopit, jak nesčetní učení úředníci těží z toho, co se na těchto nádvořích odehrává."
 building_chocolate_hills_destination_desc: "Stavba [GetBuilding('chocolate_hills_01').GetName] představuje neobvyklou podívanou. Po většinu roku jsou kopce pokryty bujnou zelení, ale během období sucha získávají sytě hnědou až téměř oranžovou barvu. Nic podobného jsem dosud neviděl a tato podivuhodná krajina mě zcela uchvacuje."
 building_fanfang_guangzhou_destination_desc: "Minarety nejsou v této části světa běžným výjevem, ve čtvrti [GetBuilding('fanfang_guangzhou_01').GetName] je však minaret zdejší mešity ze silnice viditelný na první pohled. Při procházení čtvrtí slyším jazyky z celé Asie i islámského světa. V této části říše žijí a pracují cizinci všeho druhu."
 building_wilwatikta_palace_destination_desc: "Městská část chrámového města je stejně působivá jako rozlehlá. Když procházím obytnými čtvrtěmi a blížím se ke stavbě [GetBuilding('wilwatikta_palace_01').GetName], nemohu nepřemýšlet o nesmírném bohatství a politické moci ostrova Jáva a jeho obyvatel."
 building_ha_long_bay_destination_desc: "Stavbu [GetBuilding('ha_long_bay_01').GetName] je nejlepší pozorovat z moře, a tak se ocitám na malé lodi v Tonkinském zálivu. Když vplouváme do samotné zátoky, veškeré hovory umlkají. V naprostém tichu proplouváme krasovou krajinou. Mohutné hory obklopující nás ze všech stran jsou snad tím nejkrásnějším, co jsem kdy spatřil."
 building_my_son_sanctuary_destination_desc: "Stavba [GetBuilding('my_son_sanctuary_01').GetName] je po staletí centrem čamské civilizace. Každý další král rozšiřoval tento nyní mimořádně poklidný kraj o nové chrámy a památky. Při pohledu na čamské kněze, poutníky a úředníky, kteří všude kolem plní své poslání, mě naplňuje hluboká úcta."
 building_gunung_api_destination_desc: "O stavbě [GetBuilding('gunung_api_01').GetName] se říká, že je posvátnou horou, a její vzhled se skutečně nepodobá ničemu, co jsem během svých cest spatřil. Ostré úzké skalní věže se prudce zvedají vysoko k nebi a okolní stromy vedle nich vypadají nepatrně."
 building_suwalesi_megaliths_destination_desc: "Po celém údolí lze spatřit jedinečný druh megalitů. Obklopují nás mohutné kamenné postavy s jednoduchými stylizovanými tvářemi. Vesničan, kterého jsem cestou potkal, tvrdil, že některým přinášejí oběti, zatímco účel jiných neznají ani místní obyvatelé."
 building_izumo_taisha_destination_desc: "Do tohoto kraje přicházím právě v době slavnosti. Všude kolem lidé oslavují božstvo manželství Kotoamacuikami. Když se prodírám davy, konečně dorazím ke stavbě [GetBuilding('izumo_taisha_01').GetName], prastaré svatyni, která je prý starší než kterákoli jiná na těchto ostrovech."
 building_confucius_temple_destination_desc: "Ve stavbě [GetBuilding('confucius_temple_01').GetName] je téměř nemožné necítit hlubokou úctu. Jde o nejstarší svatyni velkého učitele a vzoru, jenž tak zásadně utvářel svět. Zanedlouho se tiše řadím k ostatním poutníkům, abych navštívil jeho hrobku i hrobky jeho žáků."
 building_citadel_linan_destination_desc: "Na úbočí Fénixova vrchu stojí stavba [GetBuilding('citadel_linan_01').GetName], která je centrem správní moci nejen tohoto města, ale i celého okolního kraje. Po průchodu branou mě obklopují hodnostáři a učení úředníci vykonávající obřadní povinnosti spojené se svými úřady."
 building_sanchi_stupa_destination_desc: "Kupole stavby [GetBuilding('sanchi_stupa_01').GetName] je hlavní dominantou kopce za samotnou osadou Sáňčí. Mezi množstvím poutníků a mnichů, které zde potkávám, mnozí tvrdí, že chrámový komplex slouží svému účelu již po tisíce let."
 building_boudhanath_destination_desc: "Obrovská kupole stúpy [GetBuilding('boudhanath_01').GetName] ukrývá ostatky a relikvie spojené s mnoha historickými buddhy a zároveň jde o zdaleka nejvyšší stavbu v Káthmándú. Vysoko nad zbytkem města jasně dokládá význam buddhismu v jeho dějinách. Při příchodu mě obklopují poutníci, pocestní i obchodníci, kteří se zde zastavují, aby si odpočinuli a pomodlili se."
 building_mont_st_michel_destination_desc: "Když se za odlivu blížím k přílivovému ostrovu [GetBuilding('mont_st_michel_01').GetName], jeho nádherný kostel a hradby se tyčí na obzoru jako připomínka Boží moci nad nebem i zemí. Toto místo je významným náboženským centrem i opevněnou baštou místních mnichů a rybářů."
 building_holy_site_st_peters_basilica_destination_desc: "Stavba [GetBuilding('holy_site_st_peters_basilica_01').GetName], tyčící se nad Vatikánským pahorkem na místě hrobu svatého Petra, připomíná moc západní církve a jejích papežů. V této části věčného města jsou všude vidět kněží a řeholnice, ale také žebráci doufající v almužny od početných poutníků."
 building_holy_site_imam_ali_mosque_destination_desc: "Při vstupu do města září zlatá kupole stavby [GetBuilding('holy_site_imam_ali_mosque_01').GetName] jako maják. Toto posvátné místo, kde odpočívá imám [ali.GetFirstName], je plné poutníků vzdávajících mu úctu. Vzduch je prodchnut oddaností a složitá kaligrafie na zdech svědčí o hluboké úctě k božskému."
 building_yazd_mosque_destination_desc: "Když vzhlížím k minaretům nad velkolepým portálem stavby [GetBuilding('yazd_mosque_01').GetName], zmocňuje se mě hluboká úcta. Jeden místní mi cestou připomněl, že město je náboženským centrem déle, než kam sahá lidská paměť. Ulice jsou dodnes plné poutníků, kněží a věřících, kteří urazili dlouhou cestu, aby toto nádherné místo navštívili."
 building_holy_site_great_mosque_of_mecca_destination_desc: "Při pohledu na stavbu [GetBuilding('holy_site_great_mosque_of_mecca_01').GetName] mě naplňuje posvátná bázeň. Kaaba, posvátná svatyně od nepaměti, je dokladem trvalosti náboženství [GetReligionByKey('islam_religion').GetName]. Davy poutníků hledajících blízkost božského se ve své oddanosti pohybují jako jediná bytost."
 building_holy_site_great_mosque_of_cordoba_destination_desc: "Při procházení rozlehlými síněmi stavby [GetBuilding('holy_site_great_mosque_of_cordoba_01').GetName] mě uchvacuje les sloupů a červenobílých oblouků, mistrovské dílo stavitelské vynalézavosti. Propojení islámských a [visigothic_culture.GetName] prvků vypovídá o zemi oplývající bohatými dějinami a kulturou."
 building_holy_site_great_mosque_of_djenne_destination_desc: "Stavba [GetBuilding('holy_site_great_mosque_of_djenne_01').GetName], majestátně se zvedající v samotném srdci města, nabízí nezapomenutelný pohled. Jedinečná hliněná architektura, odrážející ráz sahelské krajiny, je hrdým symbolem víry i dovednosti svých stavitelů."
 building_holy_site_great_mosque_of_samarra_destination_desc: "Když stojím před stavbou [GetBuilding('holy_site_great_mosque_of_samarra_01').GetName], její jedinečný spirálovitý minaret se vypíná vysoko nad krajinou. Nezaměnitelný architektonický styl z ní činí klenot islámského světa."
 building_holy_site_cologne_cathedral_destination_desc: "Při příchodu ke stavbě [GetBuilding('holy_site_cologne_cathedral_01').GetName] její nedokončené věže a pokračující stavební práce svědčí o nesmírných ambicích této doby. Mezi lešením a kamením se přede mnou rodí vidina velkoleposti, symbol víry, který má přetrvat po celá staletí."
 building_holy_site_canterbury_cathedral_destination_desc: "Při procházení posvátnými síněmi stavby [GetBuilding('holy_site_canterbury_cathedral_01').GetName] kolem sebe cítím tíhu dějin. Tento základní kámen křesťanské víry je prodchnut příběhy mučedníků a světců. Složité řezby a slavnostní atmosféra nesou ozvěnu modliteb nesčetných poutníků."
 building_holy_site_prophetic_mosque_destination_desc: "Stavba [GetBuilding('holy_site_prophetic_mosque_01').GetName] se svými pokojnými nádvořími a elegantními oblouky je místem mimořádného duchovního významu. Zde, kde prorok Muhammad kráčel a kázal, jako by byl vzduch naplněn klidem. Věřící se shromažďují v hluboké úctě a jejich modlitby znějí pod širým nebem jako tiché ševelení."
 building_doges_palace_destination_desc: "Velkolepost stavby [GetBuilding('doges_palace_01').GetName] mi bere dech. Zdobené průčelí a přepychové komnaty jsou symbolem benátské moci a prosperity. Složitá umělecká díla a bohatá výzdoba vypovídají o moci a bohatství zdejších vládců."
 building_walls_of_genoa_destination_desc: "Mohutná stavba [GetBuilding('walls_of_genoa_01').GetName], tvořící impozantní bariéru chránící město, je dokladem vojenské zdatnosti a strategického důvtipu jeho vládců."
 building_visby_ringmur_destination_desc: "Stavba [GetBuilding('visby_ringmur_01').GetName] obepíná celé město jako kamenný doklad jeho obchodního a obranného významu. Při chůzi po hradbách obdivuji dovednost stavitelů i prozíravost vládců, kteří zajistili bezpečí a blahobyt svých obyvatel."
 building_walls_of_benin_destination_desc: "Velkolepá stavba [GetBuilding('walls_of_benin_01').GetName] se táhne, kam až oko dohlédne, a představuje monumentální dílo místních obyvatel. Toto obrovské zemní opevnění, rozlehlejší než mnohé jiné, které jsem spatřil, je hrdým symbolem síly a vynalézavosti této země."
 building_theodosian_walls_destination_desc: "Impozantní stavba [GetBuilding('theodosian_walls_01').GetName], chránící Konstantinopol, je divem stavitelského umění. Vysoké hradby a několik obranných pásem svědčí o městě připraveném na jakékoli obléhání. Prozíravost, s níž bylo toto opevnění vybudováno, je zřejmá na první pohled."
 building_aurelian_walls_destination_desc: "Stavba [GetBuilding('aurelian_walls_01').GetName], obepínající věčné město, odolává času i nepokojům. Tyto starobylé hradby, v průběhu let rozšiřované a zesilované, uzavírají bohaté a složité dějiny a jsou baštou trvalého římského odkazu."
 building_the_colosseum_destination_desc: "Přede mnou stojí stavba [GetBuilding('the_colosseum_01').GetName], kolosální ruina z dávno minulé doby. Kdysi byla místem okázalých představení a slávy, dnes se však částečně rozpadá a připomíná moc i dosah území [GetTitleByKey('h_roman_empire').GetNameNoTier]. Její kameny nesou ozvěny minulosti plné velkoleposti i krutých svárů."
 building_iron_pillar_of_delhi_destination_desc: "Stavba [GetBuilding('iron_pillar_of_delhi_01').GetName] vzdoruje ničivému působení času a její odolnost vůči korozi je divem hutnictví. Byla vztyčena na počest krále Čandragupty II. a svědčí o pokročilých znalostech a dovednostech řemeslníků své doby."
 building_iron_pillar_of_dhar_destination_desc: "Stavba [GetBuilding('iron_pillar_of_dhar_01').GetName] je méně známým, ale neméně fascinujícím protějškem sloupu v Dillí. Tento doklad vynalézavosti dávných řemeslníků zůstává předmětem zvědavosti mnoha poutníků a učenců."
 building_the_pyramids_destination_desc: "Stavba [GetBuilding('the_pyramids_01').GetName], starobylá a majestátní, se již po tisíciletí zvedá z písku. Hrobky faraonů, dnes zbavené hladkého vápencového obložení, stále vzbuzují úžas a úctu jako přetrvávající památka kdysi velkolepé civilizace."
 building_stonehenge_destination_desc: "Tajemná stavba [GetBuilding('stonehenge_01').GetName] stojí na Salisburské pláni a její účel se ztratil v běhu času. Obrovské kameny uspořádané do složitého útvaru vypovídají o dávných znalostech a spojení s nebesy z dob dávno předcházejících té naší."
 building_offas_dyke_destination_desc: "Při průchodu krajinou se přede mnou objevuje pozoruhodná zemní stavba [GetBuilding('offas_dyke_01').GetName], hranice vytvořená za vlády krále [offa.GetFirstName]. Tento mohutný val, dnes částečně zvětralý, ale stále rozeznatelný, vyznačuje dávnou obrannou a hraniční linii a připomíná mocenské zápasy své doby."
 building_hadrians_wall_destination_desc: "Při chůzi podél pozůstatků stavby [GetBuilding('hadrians_wall_01').GetName] přemýšlím o moci předků z [roman_culture.GetName] kultury. Tato kdysi obávaná bariéra, dnes rozpadlá v řadu ruin, sloužila jako severní hranice a dokládala rozsah i meze jejich říše."
 building_petra_destination_desc: "Starobylé město [GetBuilding('petra_01').GetName], vytesané do růžově rudých skal, nabízí nezapomenutelný pohled. Jeho proslulá pokladnice Al-Chazna, třebaže její někdejší sláva vybledla, stále připomíná prosperitu minulé doby a zůstává divem stavitelství i umění."
 building_buddhas_of_bamian_destination_desc: "Kolosální stavba [GetBuilding('buddhas_of_bamian_01').GetName], vytesaná do skalní stěny, je tichým svědectvím náboženských a kulturních dějin této země. Navzdory opotřebení časem je na nádherných sochách stále patrné umění i oddanost dávných řemeslníků."
 building_alhambra_destination_desc: "Stavba [GetBuilding('alhambra_01').GetName] se svou složitou maurskou architekturou a bujnými zahradami je klenotem Granady. Palácový komplex spojující krásu a účelnost odráží vytříbený vkus a moc zdejších vládců."
 building_citadel_of_aleppo_destination_desc: "Impozantní stavba [GetBuilding('citadel_of_aleppo_01').GetName], pevnost na vrcholu kopce, dominuje celému městu. Mohutné hradby a robustní budovy, po staletí přestavované, byly svědky nesčetných obléhání i houževnatosti tohoto starobylého sídla."
 building_house_of_wisdom_destination_desc: "Stavba [GetBuilding('house_of_wisdom_01').GetName] v Bagdádu září jako maják vědění a učenosti. Tato velkolepá knihovna a vzdělanecké centrum založené abbásovskými chalífy přitahuje učence ze všech zemí, kteří touží studovat rozsáhlé sbírky textů a účastnit se zdejších rozprav."
 building_the_tower_of_london_destination_desc: "Mohutná stavba [GetBuilding('the_tower_of_london_01').GetName] slouží jako královský palác i vězení. Vzduch mezi jejími zdmi je obtížen dějinami a do kamenů jsou vepsány příběhy králů, královen i vězňů."
 building_london_bridge_destination_desc: "Stavba [GetBuilding('london_bridge_01').GetName] se svými pevnými oblouky a rušnými krámky překonává mohutnou Temži jako tepna vedoucí srdcem Londýna. Není pouze místem přechodu, ale také živým střediskem obchodu a ruchu, kde se setkávají kupci, poutníci a měšťané."
 building_notre_dame_destination_desc: "Majestátní stavba [GetBuilding('notre_dame_01').GetName] se svými vysokými věžemi a velkolepým průčelím je mistrovským dílem gotické architektury. Uvnitř se vzduchem nesou ozvěny zbožnosti a každé vitrážové okno i socha vyprávějí posvátný příběh."
 building_brihadeeswarar_temple_destination_desc: "Monumentální žulová stavba [GetBuilding('brihadeeswarar_temple_01').GetName] se majestátně tyčí nad Taňčávúrem. Vysoká vimána a složité reliéfy vypovídají o velkoleposti dynastie [chola_dynasty.GetName], období, v němž umění a oddanost dosáhly vznešeného výrazu."
 building_shwedagon_pagoda_destination_desc: "Stavba [GetBuilding('shwedagon_pagoda_01').GetName] se zlatou věží sahající k nebesům je podivuhodným výjevem. Toto posvátné místo, které má údajně ukrývat Buddhovy relikvie, je cílem poutí a projevů oddanosti a představuje duchovní srdce Barmy."
 building_ananda_temple_destination_desc: "Stavba [GetBuilding('ananda_temple_01').GetName] se svou třpytivou šikharou a nádhernými terasami svědčí o stavitelském umění dynastie [pagan_dynasty.GetName]. Tento překrásný chrám zdobený složitými řezbami a nástěnnými malbami je majákem théravádového buddhismu."
 building_the_friday_mosque_destination_desc: "Mohutná stavba [GetBuilding('the_friday_mosque_01').GetName] s elegantními minarety je hlavním místem bohoslužeb. Každý týden se mění v rušné centrum modliteb, kde se shromažďují zástupy věřících a znovu potvrzují sílu a jednotu společenství náboženství [GetReligionByKey('islam_religion').GetName]."
 building_khajuraho_destination_desc: "Stavba [GetBuilding('khajuraho_01').GetName] se svými nádhernými a odvážnými sochami oslavuje život, lásku a bohoslužbu. Tyto architektonické divy vybudované vládci Čandéla svědčí o umělecké a duchovní představivosti své doby."
 building_palace_of_aachen_destination_desc: "Stavba [GetBuilding('palace_of_aachen_01').GetName] je odkazem postavy [charlemagne.GetFirstNameNicknamed]. Velkolepá kaple s osmibokým půdorysem a klenutou střechou odráží císařovu touhu obnovit slávu území [GetTitleByKey('h_roman_empire').GetNameNoTier]."
 building_hagia_sophia_christian_destination_desc: "Při procházení velkolepou stavbou [GetBuilding('hagia_sophia_01').GetName] mě její nádhera naplňuje úžasem. Rozlehlá kupole jako by se dotýkala nebes a složité mozaiky se třpytí ve světle. Cítím hlubokou duchovní sílu tohoto místa, v němž se ozývají staletí křesťanských bohoslužeb a byzantské vznešenosti."
 building_hagia_sophia_islamic_destination_desc: "Když vstoupím do stavby [GetBuilding('hagia_sophia_02').GetName], nyní velkolepé mešity, uchvátí mě její proměna. Vysoké minarety míří k obloze a doplňují majestátní kupoli. Islámská kaligrafie a výzdoba se uvnitř harmonicky prolínají s byzantskou architekturou a vytvářejí atmosféru hluboké úcty a kulturního splynutí."
 building_dome_of_the_rock_destination_desc: "Stavba [GetBuilding('dome_of_the_rock_01').GetName] se zlatou kupolí třpytící se ve slunečním světle je uctívanou dominantou Jeruzaléma. Tato svatyně ukrývající posvátnou skálu má hluboký duchovní význam a ctí ji muslimové i židé."
 building_temple_in_jerusalem_destination_desc: "Pozůstatky stavby [GetBuilding('temple_in_jerusalem_01').GetName], posvátné pro židy i křesťany, vyvolávají hluboký pocit dějinnosti a duchovna. Západní zeď, jediný zbytek kdysi nádherného chrámu, je dojemnou připomínkou bouřlivé minulosti města."
 building_rammelsberg_mines_destination_desc: "Stavba [GetBuilding('rammelsberg_mines_01').GetName] je úlem plným činnosti, jehož chodby se noří hluboko do země za drahocennými rudami. Vynalézavost a vytrvalost zdejších horníků jsou nezbytné pro prosperitu a řemeslnou výrobu celého kraje."
 building_guiyang_mines_destination_desc: "Stavba [GetBuilding('guiyang_mines_01').GetName] během staletí zanechala na zdejší osadě jasnou stopu. Mince ražené v tomto místě obíhají po celé Číně již od časů dynastie Západní Chan."
 building_kaibao_mines_destination_desc: "Stavba [GetBuilding('kaibao_mines_01').GetName] zásobuje císařskou pokladnici stříbrem již více než tisíc let a při cestě krajem je to zcela zřejmé. Stříbro a mince přitahují bohatství. Obchodníci a řemeslníci zde prosperují díky tomu, co horníci přinášejí do hutí."
 building_zijinshan_mines_destination_desc: "Nebýt stavby [GetBuilding('zijinshan_mines_01').GetName] a jejího zlata, tento kraj by pravděpodobně nebyl tak rozvinutý jako dnes. Osada je zřetelně utvářena hornictvím a množstvím techniků a řemeslníků, které přilákalo z okolních oblastí."
 building_liangzhe_mines_destination_desc: "Stavba [GetBuilding('liangzhe_mines_01').GetName] a zdejší obchod se stříbrem jsou základem prosperity celého kraje. Stříbro přilákalo řemeslníky a horníky a místní ražené mince lákají obchodníky ze všech stran."
 building_hanxing_mines_destination_desc: "Stavba [GetBuilding('hanxing_mines_01').GetName]."
 building_kutna_hora_mines_destination_desc: "Stavba [GetBuilding('kutna_hora_mines_01').GetName] je životně důležitým zdrojem stříbra, které pohání obchod i ražbu mincí. Síť štol a šachet vyhloubených odhodlanými horníky je dokladem vynalézavosti a práce, jež udržují zdejší hospodářství."
 building_kremnica_mines_destination_desc: "Stavba [GetBuilding('kremnica_mines_01').GetName] je proslulá bohatými ložisky zlata. Těžba tohoto drahocenného kovu, symbolu bohatství a moci, podporuje ražbu mincí i nádheru panovnických dvorů."
 building_baofeng_mines_destination_desc: "Hornictví je hlavním zdrojem obživy v tomto kraji a většina obytných budov se soustředí poblíž stavby [GetBuilding('baofeng_mines_01').GetName]. Podél řeky se táhnou ulice plné stříbrnických dílen poháněných vodními koly."
 building_jiaodong_mines_destination_desc: "Stavba [GetBuilding('jiaodong_mines_01').GetName], často nazývaná Zlatým městem nebes, je všeobecně proslulá množstvím vytěženého zlata. Samotné město se rozrostlo ve významné obchodní centrum zaměřené na zpracování a další prodej tohoto drahocenného kovu."
 building_chihu_mines_destination_desc: "O stavbě [GetBuilding('chihu_mines_01').GetName] se říká, že je v provozu již od období Tří říší a po více než tisíc let poskytuje železo a zbraně čínským dynastiím. V samotném městě je to patrné na každém kroku. Ulice lemují mincovny a kovárny a vozy naložené železnou rudou potkávám dlouho předtím, než spatřím samotnou osadu."
 building_zigong_mines_destination_desc: "Stavba [GetBuilding('zigong_mines_01').GetName] zásobuje Čínu solí již po tisíce let. Městské krajině dominují typická vrtná zařízení, odpařovací nádrže a další stavby určené k získávání soli."
 building_falun_mines_destination_desc: "Stavba [GetBuilding('falun_mines_01').GetName] je bludištěm štol vyhloubených při dobývání mědi. Sytě červený pigment známý jako falunská červeň, vyráběný z materiálu získaného v dolech, zdobí mnoho místních budov a živě připomíná význam dolu pro zdejší společenství."
 building_konasamudram_mines_destination_desc: "Stavba [GetBuilding('konasamudram_mines_01').GetName] je známá půdou bohatou na diamanty. Třpyt drahocenných kamenů odráží nejen bohatství, které přinášejí, ale také dovednost a námahu těch, kdo je ze země dobývají."
 building_dean_mines_destination_desc: "Stavba [GetBuilding('dean_mines_01').GetName] je významným zdrojem železa. Neustále zde zní údery kladiv a září výhně, zatímco horníci a kováři bez ustání připravují materiál pro vojsko i stavitelství."
 building_phnom_dek_mines_destination_desc: "Stavba [GetBuilding('phnom_dek_mines_01').GetName], známá také jako „Železná hora“, je významným zdrojem železa v tomto kraji. Při cestě k městu se nelze vyhnout mnoha těžce naloženým vozům směřujícím do nížin kolem Angkoru."
 building_schwaz_mines_destination_desc: "Stavba [GetBuilding('schwaz_mines_01').GetName] je střediskem těžby stříbra. Bohatství získávané v jejích hlubinách proměnilo město v prosperující centrum obchodu, které přitahuje kupce a řemeslníky ze širokého okolí."
 building_argentiera_mines_destination_desc: "Stavba [GetBuilding('argentiera_mines_01').GetName] je proslulá bohatými žilami olova a stříbra. Drsné podmínky, jimž zdejší horníci čelí, zdůrazňují neúnavnou honbu za těmito cennými surovinami."
 building_srebrenica_mines_destination_desc: "Stavba [GetBuilding('srebrenica_mines_01').GetName] je klíčovým zdrojem stříbra. Neustálá dřina horníků pronikajících do hlubin země živí prosperitu kraje a činí z něj významné středisko obchodu."
 building_kollur_mines_destination_desc: "Stavba [GetBuilding('kollur_mines_01').GetName], ukrytá v hustých lesích Kollúru, je proslulá nádhernými diamanty. Drahokamy z těchto dolů nejen zdobí koruny králů, ale také symbolizují bohatství země a dovednost těch, kdo je dobývají."
 building_siderokausia_mines_destination_desc: "Stavba [GetBuilding('siderokausia_mines_01').GetName] překypuje činností a poskytuje železo nezbytné pro potřeby celého kraje. Horníci zde neúnavně pracují, aby využili bohatství ukryté v zemi."
 building_zawar_mines_destination_desc: "Stavba [GetBuilding('zawar_mines_01').GetName] je starobylým zdrojem zinku a olova. Vynalézavost horníků pronikajících do hlubin za těmito kovy má zásadní význam pro růst a rozvoj kraje."
 building_pansjhir_mines_destination_desc: "Stavba [GetBuilding('pansjhir_mines_01').GetName] je známá drahocenným lazuritem. Tento sytě modrý kámen, vyhledávaný pro svou krásu a vzácnost, je pokladem zdejší země a touží po něm řemeslníci i obchodníci."
 building_nishapur_mines_destination_desc: "Stavba [GetBuilding('nishapur_mines_01').GetName] je proslulá nádherným tyrkysem. Tento zářivý drahokam ceněný ve šperkařství a výzdobě odráží bohatství a řemeslné umění [persian_culture.GetName] kultury."
 building_ratnapura_mines_destination_desc: "Stavba [GetBuilding('ratnapura_mines_01').GetName] se třpytí příslibem safírů a rubínů. Tyto drahokamy pohřbené hluboko v zemi jsou žádané po celém světě a svědčí o bohatství zdejších území."
 building_mogok_mines_destination_desc: "Stavba [GetBuilding('mogok_mines_01').GetName] se třpytí příslibem rubínů a safírů. Tyto drahokamy pohřbené hluboko v zemi jsou vyhledávány po celém světě a jejich lesk prý nemá obdoby."
 building_allaq_mines_destination_desc: "Stavba [GetBuilding('allaq_mines_01').GetName], ukrytá v horách Allaku, je klíčovým zdrojem mědi. Vzduchem se rozléhá zvuk krumpáčů dopadajících na skálu, zatímco horníci neúnavně pracují, aby zajistili dodávky tohoto nepostradatelného kovu."
 building_takkeda_mines_destination_desc: "Rušná stavba [GetBuilding('takkeda_mines_01').GetName] je proslulá bohatými stříbrnými žilami. Zde vytěžený kov nejen podporuje místní řemesla, ale také významně přispívá do pokladnice celého kraje."
 building_turda_mines_destination_desc: "Stavba [GetBuilding('turda_mines_01').GetName] je životně důležitým zdrojem soli. Toto „bílé zlato“, nezbytné pro uchovávání potravin i obchod, proměnilo doly ve významné hospodářské centrum."
 building_taghaza_mines_destination_desc: "V samotném srdci Sahary je stavba [GetBuilding('taghaza_mines_01').GetName] drsným, ale nepostradatelným zdrojem soli. Karavany putují na toto pusté místo z velkých vzdáleností za solí, která je v těchto zemích cennější než zlato."
 building_phocaea_mines_destination_desc: "Stavba [GetBuilding('phocaea_mines_01').GetName] je známá kamencem. Získávání tohoto důležitého nerostu používaného při barvení a činění vyžaduje dovednosti a znalosti předávané po mnoho generací."
 building_verespatak_mines_destination_desc: "Stavba [GetBuilding('verespatak_mines_01').GetName] je bohatým zdrojem zlata. Hojnost tohoto kovu proměnila kraj v rušné centrum těžby a přitahuje dobrodruhy i kupce vábené vidinou bohatství."
 building_suvarnadvipa_mines_destination_desc: "Podél úpatí pohoří Barisan nabízí stavba [GetBuilding('suvarnadvipa_mines_01').GetName] dělníkům náročnou, ale uspokojivou práci a zároveň rozmnožuje bohatství místních řemeslníků a obchodníků."
 building_khetri_mines_destination_desc: "Stavba [GetBuilding('khetri_mines_01').GetName] je známá rozsáhlými ložisky mědi. Pilná práce místních horníků a kovářů, kteří tento nepostradatelný kov těží a zpracovávají, udržuje obživu celého kraje."
 building_trepca_mines_destination_desc: "Stavba [GetBuilding('trepca_mines_01').GetName] je významným zdrojem olova a stříbra. Místní hornická komunita, zkušená v pohybu náročným terénem, sehrává zásadní roli v prosperitě celého kraje."
 building_rudnik_mines_destination_desc: "Stavba [GetBuilding('rudnik_mines_01').GetName] překypuje činností při těžbě drahocenného stříbra. Pilní místní horníci a bohatství, které přinášejí, učinili z oblasti centrum hospodářské činnosti a růstu."
 building_ijil_mines_destination_desc: "Rozlehlá stavba [GetBuilding('ijil_mines_01').GetName] ukrývá bohatá ložiska soli. Zkušení horníci učinili z kraje významný pilíř obchodu a rozvoje celé oblasti."
 building_cevennes_mines_destination_desc: "Místní doly v oblasti [GetBuilding('cevennes_mines_01').GetName] jsou nepostradatelným zdrojem stříbra. Neúnavná práce horníků a výsledné bohatství mají zásadní význam pro obživu celého kraje."
 building_hetian_mines_destination_desc: "Doly v oblasti [GetBuilding('hetian_mines_01').GetName] poskytují nejcennější nefrit na světě. Místní hospodářství je na tomto obchodu z velké části závislé a horníky i zpracovatele nefritu lze spatřit po celém městě."
 building_xiuyan_mines_destination_desc: "Druh nefritu těžený ve stavbě [GetBuilding('xiuyan_mines_01').GetName] po staletí zdobí běžné řemeslné výrobky svým nezaměnitelným zeleným odstínem."
 building_itoigawa_mines_destination_desc: "Nefrit dobývaný ve stavbě [GetBuilding('itoigawa_mines_01').GetName] je po dlouhá staletí ceněn mnichy a mystiky celého kraje. Jeho krása vždy přitahovala karavany ze všech koutů ostrova, které jím zásobovaly své řemeslníky."
 building_lantian_mines_destination_desc: "Stavba [GetBuilding('lantian_mines_01').GetName] je významným zdrojem nefritu. Okolní kopce, rozryté vytesanými lomy a poseté třpytivými zelenými kameny, nabízejí podivuhodný pohled."
 building_fengtian_mines_destination_desc: "Horníci ve stavbě [GetBuilding('fengtian_mines_01').GetName] od dávných dob mávají krumpáči, rozšiřují jámy a shromažďují nefrit k prohlídce. Obchodníci ostrova si mezitím plní truhlice."
 building_hpakant_mines_destination_desc: "Stavba [GetBuilding('hpakant_mines_01').GetName], ukrytá mezi lesy a širokými řekami, je prosperujícím zdrojem nefritu pro místní řemeslníky. Jeho těžba jim umožňuje lépe vyjadřovat vlastní kulturu."
 building_dushan_mines_destination_desc: "Stavba [GetBuilding('dushan_mines_01').GetName] zcela ovládá zdejší hospodářství. Místní nefrit patří k nejcennějším a údajně má sytější barvu než kterýkoli jiný."
 building_mali_mines_destination_desc: "V rozlehlých končinách Mali je stavba [GetBuilding('mali_mines_01').GetName] bohatá na drahocennou rudu, zdroj nesmírného bohatství a hrdosti. Zkušení horníci a řemeslníci tohoto kraje tato ložiska využívají po mnoho generací a podporují tak místní hospodářství i obchod."
 building_al_azhar_university_destination_desc: "Stavba [GetBuilding('al_azhar_university').GetName] v Káhiře je majákem učenosti a vzdělanosti v islámském světě. Posvátné síně této instituce vychovaly celé generace učenců a výrazně přispěly k intelektuálnímu a kulturnímu bohatství kraje."
 building_sankore_university_destination_desc: "V bájném městě Timbuktu je stavba [GetBuilding('sankore_university').GetName] centrem vzdělání a učenosti. Shromažďují se zde učenci a studenti, kteří se věnují širokému spektru oborů od teologie po astronomii."
 building_siena_university_destination_desc: "Sienská univerzita, zasazená do srdce Toskánska a představovaná stavbou [GetBuilding('siena_university').GetName], je významným centrem vzdělání a myšlení. Proslulí učitelé a dychtiví studenti vytvářejí živé akademické společenství, které sehrává klíčovou roli v intelektuálním životě místního obyvatelstva."
 building_nalanda_university_destination_desc: "Stavba [GetBuilding('nalanda_university').GetName] je velkým centrem védské učenosti. Tato starobylá instituce přitahuje učence z celé Asie a místní lidé si její odkaz hýčkají jako symbol vlastního historického a kulturního dědictví."
 building_hotin_fort_destination_desc: "Impozantní stavba [GetBuilding('hotin_fort_01').GetName] shlíží na řeku Dněstr. Mohutné hradby a strategická poloha pevnosti svědčí o odhodlání místních obyvatel chránit svou zemi před nájezdníky."
 building_heddal_stave_church_destination_desc: "V poklidné norské krajině stojí stavba [GetBuilding('heddal_stave_church_01').GetName] jako nádherný příklad středověkého řemeslného umění. Složité dřevořezby a vysoká konstrukce odrážejí oddanost i dovednost místních řemeslníků."
 building_temple_of_uppsala_destination_desc: "Stavba [GetBuilding('temple_of_uppsala_01').GetName], zahalená posvátnou aurou, je uctívaným místem, kde se dávné severské tradice prolínají se současností. Tato ctihodná síň je odedávna střediskem shromáždění a jejími počátky se nesou rozmanité hlasy poutníků."
 building_lund_cathedral_destination_desc: "Stavba [GetBuilding('lund_cathedral_01').GetName] se svou působivou románskou architekturou dominuje obzoru. Toto duchovní centrum, proslulé kryptou a astronomickými hodinami, je ústředním bodem náboženského života místní křesťanské obce."
 building_danevirke_destination_desc: "Stavba [GetBuilding('danevirke_01').GetName], mohutné zemní opevnění, se táhne napříč Jutským poloostrovem. Tato starobylá obrana budovaná a rozšiřovaná místním lidem symbolizuje jeho odhodlání chránit svou zemi a zachovat si nezávislost."
 building_roman_wall_of_lugo_destination_desc: "Stavba [GetBuilding('roman_wall_of_lugo_01').GetName], obepínající staré město, je pozoruhodným svědectvím stavitelského umění [roman_culture.GetName] kultury. Místní obyvatelé jsou na tuto historickou památku hrdí a dodnes stojí jako pevný symbol dávné minulosti jejich města."
 building_rock_of_gibraltar_destination_desc: "Stavba [GetBuilding('rock_of_gibraltar_01').GetName], majestátně se zvedající nad mořem, je strategickou i symbolickou dominantou. Místní obyvatelé si uvědomují její vojenský význam a po staletí ji opevňují, čímž z ní učinili baštu u brány mezi dvěma světy."
 building_aljaferia_palace_destination_desc: "Stavba [GetBuilding('aljaferia_palace_01').GetName] v Zaragoze je klenotem islámské architektury v samotném srdci Aragonu. Zdobené oblouky a pokojná nádvoří odrážejí bohaté kulturní splynutí Maurů a křesťanů, jehož odkaz si místní obyvatelé hýčkají."
 building_tower_of_hercules_destination_desc: "Nedaleko pobřeží se vysoko tyčí stavba [GetBuilding('tower_of_hercules_01').GetName], starobylý maják, který po staletí vedl námořníky. Tato stavba z [roman_culture.GetName] kultury, opředená mýty a dějinami, je symbolem vytrvalosti a vedení pro místní námořnické společenství."
 building_city_wall_of_toledo_destination_desc: "Impozantní stavba [GetBuilding('city_wall_of_toledo_01').GetName], obepínající historické město, svědčí o jeho pohnuté minulosti. Hradby spojující prvky [roman_culture.GetName], [visigothic_culture.GetName] a maurského stavitelství jsou zdrojem hrdosti i bezpečí pro obyvatele ukryté uvnitř."
 building_alcazar_of_segovia_destination_desc: "Stavba [GetBuilding('alcazar_of_segovia_01').GetName], posazená na skalnatém ostrohu nad městem, působí jako pohádkový hrad, který ožil. Pevnost s nezaměnitelným tvarem a bohatou historií podněcuje představivost místních i návštěvníků."
 building_holy_site_basilica_santiago_destination_desc: "Stavba [GetBuilding('holy_site_basilica_santiago_01').GetName] je majákem pro poutníky z celého křesťanstva. Tato nádherná katedrála, konečný cíl Svatojakubské cesty, je uctívána pro své svaté relikvie a ohromující románskou architekturu."
 building_cilician_gates_destination_desc: "Stavba [GetBuilding('cilician_gates').GetName] je po staletí strategickou křižovatkou. Tento přírodní průchod využívaný obchodníky i vojsky má nesmírný význam pro místní společenství, která těmito stezkami odedávna procházejí."
 building_fairy_chimneys_destination_desc: "Stavbu [GetBuilding('fairy_chimneys').GetName] v Kappadokii vytvarovaly vítr a voda. Podivuhodné skalní útvary s jedinečnými tvary nejen přitahují zvědavé poutníky, ale slouží místním obyvatelům také jako obydlí a místa bohoslužeb."
 building_sofia_ohrid_destination_desc: "Když se přede mnou objeví stavba [GetBuilding('sofia_ohrid').GetName], uchvátí mě její pokojná krása. Každá freska a mozaika vypráví příběh víry a umění, odkaz, který obstál ve zkoušce času a nadále inspiruje věřící i návštěvníky."
 building_hosios_loukas_destination_desc: "Stavba [GetBuilding('hosios_loukas').GetName], ukrytá v horách středního Řecka, je klenotem byzantského umění. Nádherná architektura a překrásné fresky kláštera jsou uctívány místními věřícími a slouží jako maják pravoslavného křesťanství."
 building_cattolica_stilo_destination_desc: "Stavba [GetBuilding('cattolica_stilo').GetName] je pozoruhodným příkladem byzantské architektury v Itálii. Tento malý, ale fascinující kostel s charakteristickým křížovým půdorysem zaujímá zvláštní místo v srdcích místního společenství."
 building_etchmiadzin_cathedral_destination_desc: "Stavba [GetBuilding('etchmiadzin_cathedral').GetName] je posvátným místem ve Vagharšapatu a je považována za duchovní centrum Arménů z celého světa. Tato starobylá katedrála s bohatými dějinami a náboženským významem je zdrojem hrdosti a duchovní útěchy pro místní arménské společenství."
 building_jvari_monastery_destination_desc: "Stavba [GetBuilding('jvari_monastery').GetName], posazená na vrcholu kopce, shlíží na soutok řek v údolí. Tento gruzínský pravoslavný klášter s harmonickou architekturou je poklidným útočištěm a symbolem trvalé křesťanské víry v kraji."
 building_saint_catherine_destination_desc: "Na úpatí hory Sinaj stojí stavba [GetBuilding('saint_catherine').GetName] jako pevnost víry. Tento starobylý klášter s nedocenitelnými rukopisy a posvátnými relikviemi je místem rozjímání pro místní pravoslavné společenství i návštěvníky."
 building_apollinare_nuovo_destination_desc: "V historickém městě Ravenna stojí stavba [GetBuilding('apollinare_nuovo').GetName] jako svědectví raně křesťanského umění a architektury. Nádherné mozaiky kostela zachycující biblické výjevy jsou zdrojem úžasu a inspirace pro místní věřící i milovníky dějin."
 building_mount_athos_destination_desc: "Stavba [GetBuilding('mount_athos_01').GetName], poloostrov v severním Řecku, je jedinečným mnišským společenstvím. Tato svatá hora s množstvím klášterů je duchovním útočištěm prodchnutým pravoslavnou křesťanskou tradicí a uctívaným mnichy i poutníky."
 building_meteora_destination_desc: "V Thesálii nabízejí kláštery stavby [GetBuilding('meteora_01').GetName] úchvatný pohled, neboť jsou posazeny na vrcholcích vysokých skalních pilířů. Svatyně zdánlivě zavěšené mezi zemí a nebem symbolizují snahu místních mnichů o duchovní povznesení."
 building_despot_palace_destination_desc: "Nádhera stavby [GetBuilding('despot_palace').GetName] nabízí velkolepý pohled. Rozlehlé síně a vytříbená nádvoří překypují ruchem dvořanů a melodiemi pěvců. Palác, centrum politického a uměleckého života, je hrdým symbolem moci a vytříbenosti."
 building_maiden_tower_destination_desc: "Stavba [GetBuilding('maiden_tower').GetName] střeží ústí Bosporu. Její zdi opředené legendami sledovaly vzestupy a pády říší. Nyní bděle dohlíží na strategické místo ovládající průjezd lodí těmito vodami plnými dějin."
 building_patras_castle_destination_desc: "Stavba [GetBuilding('patras_castle').GetName] po staletí bdí nad krajem jako strážce. Mohutné hradby a věže nesoucí stopy rozličných epoch svědčí o historickém významu a strategické hodnotě města."
 building_sumela_monastery_destination_desc: "Stavba [GetBuilding('sumela_monastery_01').GetName], vytesaná do skalních stěn u Trapezuntu, je divem klášterního stavitelství. Toto odlehlé útočiště přimknuté k horskému úbočí nabízí dechberoucí výhledy a hluboký pocit klidu."
 building_saint_lazarus_destination_desc: "V samotném srdci Larnaky stojí stavba [GetBuilding('saint_lazarus').GetName] jako ctihodné místo bohoslužeb. Nádherná budova se složitou ikonografií a posvátnými relikviemi zaujímá zvláštní místo v duchovním životě místního pravoslavného společenství."
 building_kassiopi_castle_destination_desc: "Stavba [GetBuilding('kassiopi_castle').GetName], majestátně posazená nad Jónským mořem, je majákem bdělosti. Hrad je střediskem námořních a vojenských činností a sehrává zásadní roli v bezpečnosti a prosperitě okolních zemí. Jeho dějiny jsou neoddělitelně spjaty se vzestupy a pády samotné Východořímské říše."
 building_hagios_demetrios_destination_desc: "Kostel [GetBuilding('hagios_demetrios').GetName] v Soluni je duchovní svatyní zasvěcenou patronovi města. Posvátnými síněmi zdobenými nádhernými mozaikami znějí modlitby a zpěvy oddaného místního společenství."
 building_church_of_the_theotokos_destination_desc: "Ve stínu konstantinopolských hradeb stojí stavba [GetBuilding('church_of_the_theotokos').GetName] jako maják víry. Tento starobylý kostel s pokojnou atmosférou a posvátnými ikonami je základním kamenem náboženského a kulturního života místního společenství."
 building_parthenon_destination_desc: "Stavba [GetBuilding('parthenon').GetName] na vrcholu athénské Akropole je trvalým symbolem starověké řecké civilizace. Tento majestátní chrám, třebaže částečně zničený, stále uvádí návštěvníky v úžas svou architektonickou dokonalostí a historickým významem."
 building_imam_reza_shrine_destination_desc: "Stavba [GetBuilding('imam_reza_shrine_01').GetName] je místem nesmírného duchovního významu. Velkolepý komplex se zlatou kupolí a minarety přitahuje nesčetné poutníky, kteří v tomto posvátném prostoru hledají útěchu a duchovní obnovu."
 building_soltaniyeh_destination_desc: "Stavba [GetBuilding('soltaniyeh_01').GetName] je architektonickým mistrovským dílem z doby Ílchanátu. Inovativní konstrukce a nádherné modré dlaždice z ní činí skutečně nezaměnitelnou dominantu."
 building_palace_of_ctesiphon_destination_desc: "Stavba [GetBuilding('palace_of_ctesiphon_01').GetName] připomíná velkolepost Sásánovské říše. Oblouk Ták Kesrá, který navzdory ničivému působení času stále stojí, je dojemnou připomínkou stavitelského mistrovství této dávné civilizace."
 building_falak_ol_aflak_citadel_destination_desc: "Stavba [GetBuilding('falak_ol_aflak_citadel_01').GetName], shlížející na město Chorramábád, je pevností pozoruhodné síly a krásy. Historická citadela s vysokými cimbuřími a strategickou polohou je symbolem bohatého dědictví a nezlomného ducha celého kraje."
 building_minarets_and_remains_of_jam_destination_desc: "Když se blížím ke stavbě [GetBuilding('minarets_and_remains_of_jam_01').GetName], zaplavuje mě pocit úžasu. Tyto vysoké stavby, pozůstatky Ghúridské dynastie, stojí jako osamělí strážci v drsné krajině a jejich složité cihlové zdivo svědčí o zapomenuté době."
 building_great_wall_of_gorgan_destination_desc: "Při průchodu krajinou mě pokořuje nesmírný rozsah stavby [GetBuilding('great_wall_of_gorgan_01').GetName]. Toto kolosální opevnění, táhnoucí se dál, než oko dohlédne, je mocnou připomínkou potřeby dávného království chránit své hranice před nájezdníky."
 building_maharloo_lake_destination_desc: "Pohled na stavbu [GetBuilding('maharloo_lake_01').GetName] poblíž Šírázu je okouzlující. Růžová voda vytváří téměř neskutečnou krajinu. Tento jedinečný přírodní jev mě uchvacuje neobvyklou krásou a pokojem."
 building_rainbow_mountains_destination_desc: "Při pohledu na stavbu [GetBuilding('rainbow_mountains_01').GetName] mě ohromují její zářivé pestrobarevné vrstvy. Tyto nádherné přírodní útvary, skutečný geologický div, ve mně vzbuzují úžas nad uměním samotné země."
 building_mount_damavand_destination_desc: "Majestátní stavba [GetBuilding('mount_damavand_01').GetName], tyčící se nad okolní krajinou, vzbuzuje úžas i hlubokou úctu. Jako nejvyšší vrchol oblasti [GetGeographicalRegion('world_persian_empire').GetName] mě zasněženým temenem a bájnými příběhy podněcuje k představám."
 building_tomb_of_cyrus_destination_desc: "Když stojím před stavbou [GetBuilding('tomb_of_cyrus_01').GetName] v Pasargadách, naplňuje mě hluboký pocit dějinnosti. Tento prostý, ale elegantní památník zasvěcený matce krále Šalomouna v sobě nese mocný odkaz."
 building_ark_of_bukhara_destination_desc: "Při průchodu mohutnými branami stavby [GetBuilding('ark_of_bukhara_01').GetName] na mě doléhá tíha staletí. Tato starobylá pevnost je již od svého založení sídlem místních emírů a její silné zdi přivítaly nesčetné karavany putující po Hedvábné stezce."
 building_shah_i_zinda_destination_desc: "Procházení nekropolí [GetBuilding('shah_i_zinda_01').GetName] v Samarkandu je cestou časem i uměním. Každé mauzoleum se svými nádhernými obklady vypráví vlastní příběh a vzbuzuje hlubokou úctu k bohatému kulturnímu a duchovnímu dědictví kraje."
 building_alamut_castle_destination_desc: "Stavba [GetBuilding('alamut_castle_01').GetName], ukrytá na vrcholu hory v Alamútském údolí, vyvolává pocit tajemství a intrik. Kdysi byla pevností asasínů a její strategická poloha i pohnuté dějiny dodnes fascinují mě i místní návštěvníky."
 building_golden_gate_of_kiev_destination_desc: "Když se blížím ke stavbě [GetBuilding('golden_gate_of_kiev_01').GetName], uchvacuje mě její zářivá velkolepost. Brána sloužící jako vstup do města se ozývá ruchem obchodu. Mohutná architektura, svědectví síly města, nadále vzbuzuje úctu a pocit spojení se slavnou minulostí Kyjeva."
 building_sar_i_sang_mines_01_destination_desc: "Ve stavbě [GetBuilding('sar_i_sang_mines_01').GetName] je vzduch naplněn prachem z lazuritu. Zkušení horníci pečlivě dobývají temně modrý kámen ceněný pro svou sytou barvu. Doly nesou ozvěnu dějin obchodu a přepychu, neboť zdejší lazurit zdobil nejvzácnější poklady celých říší."
 building_drassanes_01_destination_desc: "Velkolepý arsenál stavby [GetBuilding('drassanes_01').GetName] připravuje flotilu válečných galér a umožňuje svému majiteli prosazovat vlastní vůli ve Středomoří. Pod lomenými kamennými klenbami neúnavně pracují zástupy dělníků."
 building_kyz_kala_01_destination_desc: "Stavba [GetBuilding('kyz_kala_01').GetName] se tyčí nad bujnou oázou Mervu a vrhá dlouhý stín na vyprahlou krajinu. Její základy spočívají na mohutném podstavci a žebrované zdi obklopují dílny, zbrojnice i rozlehlé síně, jimiž spěšně procházejí vyslanci a úředníci."
 building_cluny_abbey_01_destination_desc: "Dar země a práv výměnou za věčnou spásu. Taková je úmluva uzavřená mezi mnišským společenstvím stavby [GetBuilding('cluny_abbey_01').GetName] a místním pánem."
 building_cluny_abbey_02_destination_desc: "Stavba [GetBuilding('cluny_abbey_02').GetName] je největším kostelem, jaký si kdo dokázal představit. Pět lodí je delších než ve Vatikánu a mohutné kamenné klenby představují architektonický triumf plný věží a střech. Toto je skutečně nový Řím."
 building_york_walls_01_destination_desc: "Rozlehlá stavba [GetBuilding('york_walls_01').GetName], táhnoucí se několik mil, chrání město již od časů císařů. Poloha nebyla zvolena kvůli vyvýšenému terénu, nýbrž aby opevnění využívalo dvě řeky vinoucí se okolními loukami."
 building_damascus_mosque_01_destination_desc: "Stavba [GetBuilding('damascus_mosque_01').GetName] je jedním z nejsvětějších míst islámu a vypráví úctyhodný příběh. Její základy spočívají na starověkém římském chrámu a raně křesťanské bazilice, takže se zde jedna nad druhou vrství celá staletí duchovnosti a podivuhodné vynalézavosti."
 building_jokhang_01_destination_desc: "Stavba [GetBuilding('jokhang_01').GetName] je spletitým komplexem nádvoří a mnišských obydlí propojených rozlehlými chodbami a síněmi pokrytými jačím máslem. Hm, jačí máslo... Možná bych měl nějaké ochutnat."
 building_wartburg_01_destination_desc: "Mohutná pevnost [GetBuilding('wartburg_01').GetName], ukrytá v Durynském lese a posazená na velikém skalnatém srázu, ovládá veškerý pohyb zboží i lidí v kraji. Rozlehlou síň ze studeného kamene zahřívají četná ohniště."
 building_beta_giyorgis_01_destination_desc: "Stavba [GetBuilding('beta_giyorgis_01').GetName] je celá vytesaná z teplé rudé sopečné horniny. Hlavní chrámová síň, zahloubená hluboko do skály, je bohatě vymalována nádhernými freskami a její stěny zdobí svaté ikony."
 building_holy_wisdom_01_destination_desc: "Velkolepá stavba [GetBuilding('holy_wisdom_01').GetName] byla vytvořena po vzoru Hagie Sofie, aby i do mrazivých severních zemí přinesla stejné světlo, bohatství a moc. Strohá podoba bílého vápence zvenčí vůbec nenaznačuje ohromující záplavu barev na freskách uvnitř."
 building_kano_walls_01_destination_desc: "Stavba [GetBuilding('kano_walls_01').GetName], vysoká mnoho stop, obklopuje starobylé město Kano a směřuje životně důležité obchodní cesty kraje skrze své mohutné brány."
 building_somapura_university_01_destination_desc: "Stavba [GetBuilding('somapura_university_01').GetName] je již po staletí jedním z nejvýznamnějších vzdělaneckých center Indie. Díky množství vazeb na buddhistické, džinistické a hinduistické kláštery přitahuje učence ze vzdálených zemí."
 building_duomo_florence_01_destination_desc: "Stavba [GetBuilding('duomo_florence_01').GetName], stojící u starověkých římských hradeb poblíž severní brány, slouží křesťanům již od časů před Konstantinem. Během staletí zažila požáry a drancování, obnovu i nová vysvěcení."
 building_duomo_florence_02_destination_desc: "Stavba [GetBuilding('duomo_florence_02').GetName] je kolosální osmiboká křtitelnice v samotném středu města zasvěcená jeho patronovi svatému Janovi.\nJe obložena drahocenným mramorem a zdobena mistrovskými sochami a zlatými mozaikami, které skutečně svědčí o bohatství města."
 building_duomo_florence_03_destination_desc: "Stavba [GetBuilding('duomo_florence_03').GetName] je katedrálou hodnou bohaté Florencie. Průčelí zaplňují lidské postavy proroků, bohů a patronů a vysoká zvonice vrhá dlouhý stín, zatímco měšťanům a návštěvníkům odměřuje hodiny práce a modliteb."
 building_duomo_florence_04_destination_desc: "Stavba [GetBuilding('duomo_florence_04').GetName] je největším úspěchem florentských stavitelů a proti modré obloze působí štíhle a téměř beztížně. Je vyšší a širší, než si kdo kdy dokázal představit, a bez podpůrné konstrukce ji před zřícením chrání důmyslné použití dvojitého pláště z cihel a zdiva."
 building_konark_temple_01_destination_desc: "Na mohutné stavbě [GetBuilding('konark_temple_01').GetName], zasvěcené slunečnímu bohu Súrjovi, pracovaly tisíce řemeslníků. Celý komplex je vybudován tak, aby připomínal božský válečný vůz nesoucí světlo od moře směrem k východu."
 building_al_qarawiyyin_university_01_destination_desc: "Stavba [GetBuilding('al_qarawiyyin_university_01').GetName], založená obchodníky a přistěhovalci z afrického Kajruánu, je jedním z nejprestižnějších center vyššího vzdělání v celém západním islámském světě a přitahuje učence ze vzdálených zemí."
 building_kairouan_basins_01_destination_desc: "Stavba [GetBuilding('kairouan_basins_01').GetName] byla vybudována, aby městu v dobách nouze poskytovala sladkou vodu. Mohutné nádrže čistí dešťovou vodu tím, že slouží jako usazovací jímky a zachycují sedimenty."
 building_ghana_palace_01_destination_desc: "Stavbu [GetBuilding('ghana_palace_01').GetName], sídlo královských náčelníků města, obklopuje posvátný háj.\nKomplex tvoří budovy z pískovce a nepálených cihel chráněné ohrazením s branou. Tento mohutný palác dominuje celému okolnímu městu."
 building_visegrad_castle_01_destination_desc: "Stavba [GetBuilding('visegrad_castle_01').GetName] je velkolepým a nedobytným systémem hradeb a věží, který chrání ohyb Dunaje a ovládá zdejší bohatý obchod."
 building_wawel_cathedral_01_destination_desc: "Tato velká kamenná katedrála, vybudovaná s pomocí řemeslníků z celého křesťanstva, je první svého druhu v polských zemích. Z vrcholu návrší stavby [GetBuilding('wawel_cathedral_01').GetName] svolávají zvony dvou věží měšťany na mši do dlouhých lodí osvětlených svícemi."
 building_vatapi_caves_01_destination_desc: "Stavba [GetBuilding('building_vatapi_caves_01').GetName], vybudovaná ranou dynastií Čálukjů, je vytesána hluboko do majestátního pískovcového útvaru. Uvnitř se skrývá mimořádně posvátný a tichý svět. Triumfální brána vede poutníky do jednolitého skalního masivu hory."
 building_jaisalmer_fort_01_destination_desc: "Když slunce začíná klesat k obzoru, mohutné hradby stavby [GetBuilding('jaisalmer_fort_01').GetName] získávají teplou barvu sladkého medu a jasně září uprostřed pouště. Pevnost byla vybudována, aby chránila město uvnitř před každou hrozbou."
 building_pleasure_dome_01_destination_desc: "Stavba [GetBuilding('pleasure_dome').GetName] vyrůstá ze země jako uskutečněný sen. Obklopená zahradami a potoky nabízí mramorové síně a otevřené pavilony určené k odpočinku a rozjímání, zahalené oparem hudby a provoněného vzduchu."
 building_burkhan_khaldun_01_destination_desc: "Stavba [GetBuilding('burkhan_khaldun_01').GetName], zahalená mlhou a úctou, stojí jako posvátné místo mezi vrcholy pohoří Chentej. Je cílem modliteb a poutí a věří se, že její tiché svahy chrání duši země i jejího lidu."
 building_nanhua_temple_01_destination_desc: "Stavba [GetBuilding('nanhua_temple_01').GetName] stojí mezi bujnými kopci a poklidnými řekami a její taškové střechy se třpytí v ranní mlze. Stezku lemují starobylé cypřiše a poutníci se klanějí před síněmi, v nichž se ozývají staletí oddanosti a tiché učenosti."
 building_jizu_shan_temples_01_destination_desc: "Stavba [GetBuilding('jizu_shan_temples_01').GetName], rozložená v terasách na horských svazích, shlíží na oblaka proudící jako příliv. Bronzové modlitební mlýnky se otáčejí ve větru, zatímco mniši mezi starými stromy pečují o kadidlo. Poutníci trpělivě stoupají po kamenných schodech a hledají ozvěnu dávného osvícení."
 building_tiantai_monasteries_01_destination_desc: "Stavba [GetBuilding('tiantai_monasteries_01').GetName] se drží mlhavých útesů vysoko nad hlubokými údolími. Potoky ševelí mezi mechem porostlými kameny a mniši nesoucí svitky rozprávějí o písmu na místě, kde jejich mistři kdysi učili meditaci, nauku i podstatu světa."
 building_maoshan_academy_01_destination_desc: "Stavba [GetBuilding('maoshan_academy_01').GetName] se zvedá mezi smaragdovými vrcholy zahalenými proudící mlhou a její nádvoří voní borovicemi a inkoustem. Učenci při světle lamp opisují texty a spojují lékařství s mystikou, zatímco nad hřebeny korunovanými svatyněmi krouží jeřábi."
 building_lize_academy_01_destination_desc: "Když dokončím svou cestu, stojí přede mnou stavba [GetBuilding('maoshan_academy_01').GetName] u tichého jezera, v němž se odrážejí vrby a taškové střechy. Jak se přibližuji, slyším v dálce učence v prostých rouchách přednášející konfuciánské klasiky."
 building_culai_academy_01_destination_desc: "Když se přede mnou objeví stavba [GetBuilding('culai_academy_01').GetName], stále více mě uchvacuje její duši očišťující krása. Mlhy sestupující z vrcholů hory Cu-laj proudí nádvořími, kde uchazeči o vědění naplňují své učené ambice."
 building_shigu_academy_01_destination_desc: "Mé cesty mě konečně přivádějí ke stavbě [GetBuilding('shigu_academy_01').GetName], ukryté na zahalených kopcích a obklopené bujnými lesy. Při výstupu po schodech mě vítá její proslulá brána se složitými nápisy, zastíněná nově obnovenou střechou."
 building_white_deer_grotto_academy_01_destination_desc: "Když se blížím ke stavbě [GetBuilding('white_deer_grotto_academy_01').GetName], ohromuje mě, jak dokonale splývá s okolními kopci. Kamenné budovy jsou ukryty mezi bambusovými háji a připomínají místo, kde učenci kdysi hledali pravdu a soulad."
 building_gongsanseong_fortress_01_destination_desc: "Když se přede mnou objeví stavba [GetBuilding('gongsanseong_fortress_01').GetName], ohromí mě její impozantní postavení nad říčním údolím. Starobylé hradby nesou ozvěny dávno zapomenutých bitev, věrných králů a nezlomného ducha hrdého království."
 building_besakih_temple_01_destination_desc: "Navzdory skromnému názvu stavby [GetBuilding('besakih_temple_01').GetName] zde nenacházím jediný chrám, nýbrž celý rozlehlý komplex veřejných i soukromých svatyní sloužících k modlitbám a obřadům. Právě proto se mu přezdívá „Matka chrámů“."
 building_mount_apo_01_destination_desc: "Když se na obzoru objeví stavba [GetBuilding('mount_apo_01').GetName], pokořuje mě její velkolepá a tichá majestátnost. Drsné svahy objímají mraky a ve vzduchu se zvolna drží vůně deště a popela. Uctívaný vrchol střeží duchy země a ohně."
 building_dieng_plateau_01_destination_desc: "Nadpozemský klid stavby [GetBuilding('dieng_plateau_01').GetName] působí na lidské oko mimořádně silně. Ze smaragdových kráterů stoupá pára a z mlhy se zvedají starobylé kamenné svatyně. Je to dechberoucí kraj, kde příroda a božství jako by sdílely jediný dech."
 building_plain_of_jars_01_destination_desc: "Stavba [GetBuilding('plain_of_jars_01').GetName] se přede mnou rozprostírá jako rozlehlá a tichá země pod bledou oblohou. Po kopcích jsou rozesety mohutné tajemné nádoby napůl pohřbené v trávě a stínech. Jejich zapomenutý účel šeptá o civilizaci, která dávno zmizela, ale nikdy nebyla zcela zapomenuta."
 building_pagoda_of_fogong_temple_01_destination_desc: "Stavba [GetBuilding('pagoda_of_fogong_temple_01').GetName] stojí přede mnou a její dřevěná patra stoupají jako modlitba vepsaná do oblohy. Každá úroveň voní dávným kadidlem a téměř tisíc let svědčí o trvalé oddanosti a řemeslném mistrovství."
 building_hanging_temple_01_destination_desc: "Stavba [GetBuilding('hanging_temple_01').GetName] visí na útesu jako pomíjivá vidina mezi zemí a nebem. Dřevěné síně vybíhají ze skalní stěny a jejich trámy zdánlivě vzdorují tíži světa. Mniši se zde modlí obklopeni větrem, tichem a neochvějnou oddaností."
 building_muaro_jambi_01_destination_desc: "Stavba [GetBuilding('muaro_jambi_01').GetName] se rozprostírá podél říčního břehu jako bludiště cihlových svatyní pohlcených džunglí. Liány se vinou kolem elegantně vybudovaných stúp a vzduch je naplněn věkem. Všude přetrvávají ozvěny učenců a poutníků, kteří se zde zastavovali kvůli obchodu i víře."
 building_liuhe_pagoda_01_destination_desc: "Stavba [GetBuilding('liuhe_pagoda_01').GetName] mě na stezce podél řeky vítá svou majestátní vrstevnatou elegancí, světlou nahoře a temnou dole. Při výstupu se na každé úrovni střídají vnější zdi, klikaté chodby, vnitřní stěny a malé komnaty plné oddaných učenců."
 building_dau_temple_01_destination_desc: "Stavba [GetBuilding('dau_temple_01').GetName] stojí v místě, kde se pláně Rudé řeky dotýkají oblohy, a její nádvoří ožívají kadidlem a modlitbami. Starobylé svatyně se třpytí ve slunečním světle a připomínají zrození buddhismu v tomto kraji i staletí trvalé duchovní oddanosti."
 building_mount_baekdu_01_destination_desc: "Když se přede mnou objeví stavba [GetBuilding('mount_baekdu_01').GetName], její zasněžený vrchol září proti obzoru. Říká se, že na temeni hory leží rozlehlé kráterové jezero jako zrcadlo obrácené k nebesům, v němž se odráží nebeská blaženost."
 building_byeokran_port_01_destination_desc: "Z útesů nahoře se stavba [GetBuilding('byeokran_port_01').GetName] táhne podél třpytivé zátoky. Na pobřeží stojí skladiště vedle dřevěných stěžňů a křik racků se mísí s řinčením kotev."
 building_hwangnyongsa_01_destination_desc: "Stojím před stavbou [GetBuilding('hwangnyongsa_01').GetName], jejíž devítipatrová pagoda se třpytí ve slunečním světle. Mniši zpívají na rozlehlých nádvořích a v každém kameni i zlatém trámu cítím víru a nezlomnost."
 building_hakata_port_01_destination_desc: "Stavba [GetBuilding('hakata_port_01').GetName] překypuje obchodníky a námořníky ze vzdálených zemí a doky jsou plné hedvábí, keramiky a koření. Přístav zaplňují vrzající dřevěné lodě, jejichž plachty zachycují mořský vánek. Je živým centrem obchodu, kultury a císařského vlivu."
 building_chinjufu_01_destination_desc: "Stavba [GetBuilding('chinjufu_01').GetName] žije ukázněným řádem. Kasárnami a loděnicemi se rozléhá řinčení zbroje a volání námořníků. Podél zátoky stojí strážní věže sledující severní moře panství, kde každý úder srdce určuje obrana a povinnost."
 building_dazaifu_01_destination_desc: "Stavba [GetBuilding('dazaifu_01').GetName] je ukrytá mezi zvlněnými kopci a švestkovými háji a překypuje písaři, vyslanci a úředníky. Jde o centrum, odkud jsou do vzdálených provincií rozesílány správní příkazy a nařízení pečetěná inkoustem, kadidlem a nenápadnou autoritou."
 building_enryaku_ji_01_destination_desc: "Stavba [GetBuilding('enryaku_ji_01').GetName] korunuje horu Hiei a její síně jsou zahaleny mlhou. Poutníci stoupají klikatými cestami kolem zpívajících mnichů a zvonících zvonů, zatímco učení postavy $SaichO_$ nadále utváří víru a kázeň celého národa."
 building_kofuku_ji_01_destination_desc: "Stavba [GetBuilding('kofuku_ji_01').GetName] se zvedá u vod kalného rybníka a její pětipatrová pagoda vrhá dlouhé stíny na starobylé ulice. Dvořané a mniši procházejí pod pevnými branami, zatímco učenci rozjímají v pokojné buddhistické oddanosti."
 building_ise_jingu_01_destination_desc: "Stavba [GetBuilding('ise_jingu_01').GetName] se zvedá u vod kalného rybníka a její pětipatrová pagoda vrhá dlouhé stíny na starobylé ulice. Dvořané a mniši procházejí pod pevnými branami, zatímco učenci rozjímají v pokojné buddhistické oddanosti."
 building_heian_palace_01_destination_desc: "Stavba [GetBuilding('heian_palace_01').GetName] se zvedá podél široké třídy a její rumělkové brány se otevírají do rozlehlých nádvoří pokrytých pečlivě uhrabaným bílým štěrkem. Navonění dvořané proplouvají lakovanými síněmi, v nichž zlaté zástěny a vzdálené citery připomínají vytříbenost císařského života."
 building_itsukushima_jinja_01_destination_desc: "Stavba [GetBuilding('itsukushima_jinja_01').GetName] stojí nad přílivovými vodami a její rumělková brána torii jako by plula mezi mořem a nebem. Pod dřevěnými okapy se houpají lucerny a mniši vykonávají posvátné obřady, jejichž zpěvy se mísí s rytmem vln."
 building_mount_fuji_01_destination_desc: "Stavba [GetBuilding('mount_fuji_01').GetName] se majestátně zvedá nad pláněmi a její zasněžený vrchol září proti jasné obloze. Vesničané i poutníci k ní hledí s úctou, neboť je spojována se svou bohyní a zároveň představuje zrcadlo věčné krásy."
 building_sunday_bazaar_01_destination_desc: "Stavba [GetBuilding('sunday_bazaar_01').GetName] překypuje životem a její prosluněné ulice jsou plné hedvábí, koření a dobytka. Obchodníci ze vzdálených zemí smlouvají v mnoha jazycích a vytvářejí živou mozaiku hlasů a zboží ztělesňující ducha Hedvábné stezky."
 building_dunhuang_market_01_destination_desc: "Stavba [GetBuilding('dunhuang_market_01').GetName] bzučí pod pouštním sluncem, zatímco obchodníci ze všech krajů směňují cizokrajné i nezbytné zboží. U bran odpočívají velbloudi a poutníci s místními obyvateli si vyměňují svitky a příběhy určené pro vzdálené oázy."
 building_hamadan_bazaar_01_destination_desc: "Stavba [GetBuilding('hamadan_bazaar_01').GetName] se vine klenutými uličkami naplněnými vůní šafránu a kůže. Obchodníci volají ze zastíněných stánků a jejich zboží čeká na nové majitele, zatímco poutníci a měšťané proudí tímto historickým centrem obchodu."
 building_lahur_bazaar_01_destination_desc: "Stavba [GetBuilding('lahur_bazaar_01').GetName] překypuje zářivými barvami a zvuky. Úzké uličky zaplňují prodejci koření, barvíři látek a šperkaři. Ze stánků s jídlem stoupá voňavý kouř a každý kout pulzuje velkolepostí a čilým obchodem."
 building_changan_market_01_destination_desc: "Stavba [GetBuilding('changan_market_01').GetName] překypuje obchodníky z celého světa pod pestrými praporci. Cizokrajné zboží dodává trhu barvy a pouliční umělci se mezi rušným obchodem mísí s učenci."
 building_khiva_bazaar_01_destination_desc: "Stavba [GetBuilding('khiva_bazaar_01').GetName] se vine prosluněnými uličkami pod tyrkysovými věžemi a je naplněna vůní kmínu a vlny. Obchodníci smlouvají o koberce a slonovinu a jejich hlasy se rozléhají pod kupolemi připomínajícími dávný pouštní obchod a moc říše."
 building_lhasa_market_01_destination_desc: "Stavba [GetBuilding('lhasa_market_01').GetName] se rozprostírá pod třepotajícími se modlitebními praporky. Stánky přetékají máslovými lampami, barevnými korálky a jačí vlnou. Mniši, kočovníci a kupci se setkávají v řídkém horském vzduchu a jejich smlouvání zjemňuje vzdálené zvonění chrámových zvonů."
 building_dvin_shuka_01_destination_desc: "Při procházení stavbou [GetBuilding('dvin_shuka_01').GetName] zní vzduchem hlasy ze vzdálených zemí. Pod tkanými přístřešky se leskne bronz a obchodníci mě pobízejí, abych ochutnal jejich sladkosti a prohlédl si pestré hedvábí. Každá směna odhaluje další část živé energie města."
 building_herat_bazaar_01_destination_desc: "Procházím klenutými síněmi stavby [GetBuilding('herat_bazaar_01').GetName], kde se nad zastíněnými stánky třpytí dlaždice. Kamennými kanálky zurčí voda a pod nepřetržitým šumem obchodu se drží vůně barviv a prachu."
 building_hoshi_ryokan_01_destination_desc: "Přicházím ke stavbě [GetBuilding('hoshi_ryokan_01').GetName], jejíž dřevěné trámy vyleštila staletí tiché pohostinnosti. Chodbami pokrytými tatami září lucerny a z lázní vane vůně cedru a pramenité vody. Zdá se, že samotný čas se zde pohybuje pomaleji."
 building_borobudur_01_destination_desc: "Za úsvitu stojím před stavbou [GetBuilding('borobudur_01').GetName], jejíž terasy vystupují z mlhy jako kamenná mandala. Vytesaní buddhové hledí, jak se sluneční světlo dotýká stúp představujících cestu od země k osvícení, vytesanou do sopečného kamene."
 building_krakatoa_01_destination_desc: "Ze své lodi v průlivu pozoruji stavbu [GetBuilding('krakatoa_01').GetName], která se rýsuje na obzoru se svahy zahalenými proměnlivým kouřem. Moře neklidně šeptá a vzduch nese ostrou vůni popela, připomínku neklidného nitra hory ukrytého pod vlnami."
 building_po_klong_garai_01_destination_desc: "Pod spalujícím sluncem přicházím ke stavbě [GetBuilding('po_klong_garai_01').GetName], jejíž červené cihlové věže se zvedají ze suchých kopců jako uhlíky oddanosti. Zvětralé reliéfy božstev a hadů střeží svatyni, kde kadidlo a ticho vzdávají čest králi proměněnému v legendu."
 building_citadel_thang_long_01_destination_desc: "Kráčím po hradbách stavby [GetBuilding('citadel_thang_long_01').GetName], jejíž zemní valy sahají až k řece. Strážní věže shlížejí na lotosové rybníky a taškové střechy, zatímco vojáci a dvořané procházejí oparem kadidla a ranní mlhou a střeží rostoucí hlavní město."
 building_citadel_thang_long_02_destination_desc: "Procházím branami stavby [GetBuilding('citadel_thang_long_02').GetName], kde se po starobylých kamenných zdech vinou dračí vzory. Nádvořími znějí kroky stráží a vůně deště na cihlách se mísí s tíhou staleté autority."
 building_angkor_wat_01_destination_desc: "Přecházím po pískovcové cestě ke stavbě [GetBuilding('angkor_wat_01').GetName], jejíž věže připomínají lotosová poupata nad zrcadlovými vodními příkopy. Vytesané sloupy a galerie jsou uspořádány v dokonalé souměrnosti a každý kámen nese obrazy božstev, tanečnic a věčného rytmu."
 building_quanzhou_seaport_01_destination_desc: "Stavba [GetBuilding('quanzhou_seaport_01').GetName] překypuje loděmi vykládajícími obchodní zboží v rušných docích. Námořníci křičí přes hluk provazů a vozíků a úředníci pečlivě zapisují každý náklad. Toto živé pobřežní centrum udává pravidelný rytmus obchodu."
 building_qianling_mausoleum_01_destination_desc: "Přicházím ke stavbě [GetBuilding('qianling_mausoleum_01').GetName], kde kamenné cesty stoupají na kopec s královskými hrobkami. Sochy koní a vyslanců stojí v tichých řadách a střeží císaře Kao-cunga a císařovnu Wu pod slavnostním objetím země."
 building_forbidden_city_01_destination_desc: "Vstupuji do stavby [GetBuilding('forbidden_city_01').GetName] vysokými rumělkovými branami a glazované střechy se třpytí jako sluneční světlo na vodě. Nádvoří lemovaná vytesanými draky jsou uspořádána v dokonalé souměrnosti a síně se řadí podle osy císařského trůnu."
 building_kaifeng_palace_01_destination_desc: "Ranní opar nad stavbou [GetBuilding('kaifeng_palace_01').GetName] odhaluje císařský palác s půvabně malovanými trámy. Vedle dlážděných nádvoří se kouří z bronzových kotlů a kaligrafové s úředníky procházejí pod vyřezávanými mřížemi, které odrážejí autoritu dynastie Sung."
 building_giant_wild_goose_pagoda_01_destination_desc: "Stojím před stavbou [GetBuilding('giant_wild_goose_pagoda_01').GetName], sedmipatrovým centrem vědění vybudovaným z okrových cihel a korunovaným bronzovým zakončením. Pagoda chrání buddhistické sútry a je symbolem oddanosti, učenosti i kulturní výměny."
 building_lingyin_temple_01_destination_desc: "Když se mlhavými údolími Chang-čou blížím ke stavbě [GetBuilding('lingyin_temple_01').GetName], ze skal vrcholu Fej-laj na mě hledí kamenní buddhové. V hlavní síni září uprostřed kadidla a mnišských zpěvů mohutná pozlacená socha Šákjamuniho."
 building_shaolin_monastery_01_destination_desc: "Přicházím ke stavbě [GetBuilding('shaolin_monastery_01').GetName] poblíž hory Sung, kde mniši cvičí uprostřed vůně borovic a kadidla a spojují meditaci s bojovým uměním v jedinou rytmickou kázeň."
 building_wudang_mountain_temples_01_destination_desc: "Stoupám klikatými stezkami stavby [GetBuilding('wudang_mountain_temples_01').GetName], jejíž chrámy se drží mlhavých útesů. Bronzové střechy se třpytí mezi mraky a mniši tiše procházejí mezi svatyněmi a borovicemi. Je to posvátné místo, kde stavitelství splývá s přírodou."
 building_yungang_grottoes_01_destination_desc: "Stavba [GetBuilding('yungang_grottoes_01').GetName] je komplexem jeskyní, v němž byly medově zbarvené útesy přetvořeny v rozlehlé kamenné svatyně. V chladných stínech hledí ven řady mohutných buddhů a jejich pokojné tváře stále nesou slabé stopy dávných barev."
 building_leshan_giant_buddha_01_destination_desc: "Stojím před stavbou [GetBuilding('leshan_giant_buddha_01').GetName], vytesanou do rudých útesů nad soutokem řek. Kolem nesmírných kolen se shromažďuje mlha a nedalecí mniši tiše zpívají. Jejich modlitby unáší stejný vítr, který utvářel tuto posvátnou horu."
 building_wulingyuan_01_destination_desc: "Má cesta mě vede mlhou zahalenými údolími stavby [GetBuilding('wulingyuan_01').GetName], kde se vysoké pískovcové pilíře tyčí jako dávní strážci nad bujnými zelenými lesy. Po útesech stékají neskutečné vodopády a na skalních římsách se ukrývají chrámy."
 building_swahili_port_lamu_destination_desc: "Přicházím ke stavbě [GetBuilding('swahili_port_lamu').GetName], kde domy z korálového kamene hledí k moři a lodě se pohybují s přílivem. Vzduch zní jazyky celého kraje a úzké prosluněné uličky naplňuje vůně hřebíčku a soli."
 building_swahili_port_pate_destination_desc: "Pobřeží stavby [GetBuilding('swahili_port_pate').GetName] jasně září pod poledním sluncem a rušná kamenná nábřeží zaplňují obchodníci překřikující bedny se slonovinou a obilím. Za přístavními hradbami se houpají datlové palmy a celý ostrov pulzuje zvukem vzdálených moří."
 building_swahili_port_mombasa_destination_desc: "Stavba [GetBuilding('swahili_port_mombasa').GetName] se rozprostírá podél srpovité zátoky, jejíž vody ožívají plachtami a pokřiky. Kamenné opevnění střeží přístav a tržiště se rozlévají až k pobřeží, prosycená vůní palmového oleje, mědi a neklidným příslibem širého moře."
 building_swahili_port_zanzibar_destination_desc: "Když přicházím, stavba [GetBuilding('swahili_port_zanzibar').GetName] překypuje činností pod plujícími mraky. Vyřezávané dřevěné dveře vedou do uliček plných stánků s kořením a v přístavu kotví cizokrajné lodě."
 building_swahili_port_pemba_destination_desc: "Stavba [GetBuilding('swahili_port_pemba').GetName] tiše a účelně pulzuje a vzduch je těžký vůní hřebíčku. Neznámí obchodníci ze severního pobřeží směňují stříbrné mince, zatímco malé lodě vykládají pytle koření určené pro vzdálená tržiště."
 building_koganeyama_mines_destination_desc: "Ostrov Kinka je poset pilnými horníky ze stavby [GetBuilding('koganeyama_mines_01').GetName], kteří hledají proslulý zlatý prach ukrytý božstvem hornictví Kanajamou."
 building_tsushima_mines_destination_desc: "Proslulost stavby [GetBuilding('tsushima_mines_01').GetName] přivádí na celý ostrov nepřetržitý proud horníků, kteří zpracovávají černou rudu a hledají nové žíly."
 building_sado_mines_destination_desc: "Na pohled nenápadné, pusté a odlehlé místo, pod zemí však horníci ve stavbě [GetBuilding('sado_mines_01').GetName] pilně dobývají skryté bohatství ostrova."
 building_tada_mines_destination_desc: "Uprostřed zalesněných hor Seccu zní stavba [GetBuilding('tada_mines_01').GetName] rušnou prací horníků dobývajících měď a odhalujících bohatství ukryté v zemi."
 building_mozu_tombs_destination_desc: "Stavba [GetBuilding('mozu_tombs').GetName] je podivuhodným divem. Působivé mohylové hrobky, v nichž mají údajně odpočívat dávní císařové a jejichž příkopy mají tvar klíčové dírky, utvářejí fyzickou krajinu stejně výrazně jako tu duchovní."
 building_trosky_castle_01_destination_desc: "Mohutná stavba [GetBuilding('trosky_castle_01').GetName] je vybudována mezi dvěma obrovskými čedičovými skalami, o nichž stařešinové tvrdí, že jsou spícími sopkami. Přestože se její název podle vzhledu skal paradoxně překládá jako „trosky“, samotná pevnost troskou rozhodně není."
 legendary_watchtower_destination_desc: "Stavba [GetBuilding('legendary_watchtower').GetName] se tyčí vysoko a neochvějným pohledem sleduje okolní zemi. Její impozantní konstrukce, viditelná jako maják na míle daleko, svědčí o bdělosti svých tvůrců. Neslouží pouze jako pozorovatelna, ale také jako symbol ochrany před každým, kdo by se odvážil ohrozit mír panství."
 legendary_hunting_ground_destination_desc: "Stavba [GetBuilding('legendary_hunting_lodge').GetName] je místem, kde vládne divočina. Rozlehlé pozemky plné rozmanitého rostlinstva a zvěře poskytují nedotčené útočiště pro ušlechtilé umění lovu. Tradice se zde prolíná s přírodou a nabízí náročnou, ale odměňující zkušenost všem, kdo chtějí poměřit své schopnosti s divočinou."
 legendary_palace_destination_desc: "Stavba [GetBuilding('legendary_palace').GetName], zahalená velkolepostí, je architektonickým mistrovským dílem, které uchvátí každého návštěvníka. Přepychové síně a zahrady svědčí o vrcholu uměleckého úsilí. Tento palác, centrum moci a krásy, naplňuje srdce návštěvníků úžasem."
 legendary_statue_destination_desc: "Stavba [GetBuilding('legendary_statue').GetName] stojí jako nesmrtelná pocta hrdinství a ctnostem, které představuje. Byla vytesána z kamene, ale prostupuje jí duch legendy a přitahuje pohled každého kolemjdoucího. Je středobodem hrdosti a inspirace a ztělesňuje společnou paměť i touhy lidu."
 legendary_shrine_destination_desc: "Stavba [GetBuilding('legendary_shrine').GetName], ukrytá v poklidném prostředí, je posvátnou oázou přitahující věřící i zvědavce. Je místem rozjímání a oddanosti, kde obřady a modlitby znějí na pozadí plynoucího času. Svatyně nabízí útěchu a spojení s božským a slouží jako most mezi pozemským a nadpozemským."
 building_generic_destination_desc: "Když dorazím na místo, okamžitě vnímám jeho jedinečný ráz a dějiny, jimiž je prodchnuto. Je svědectvím trvalého odkazu této země a každý jeho kout vypráví příběh čekající na odhalení."
 building_castle_arrival_01_desc: "Když se blížím k titulu [location.GetTitle.GetName], mé nadšení roste. Představa, že spatřím jeho nádheru, mě naplňuje očekáváním."
 building_castle_arrival_02_desc: "Při příchodu k titulu [location.GetTitle.GetName] mi srdce buší vzrušením při pomyšlení, že prozkoumám legendy ukryté v jeho zdech."
 building_castle_arrival_03_desc: "Když se přede mnou objeví titul [location.GetTitle.GetName], probouzí se ve mně touha po dobrodružství."
 building_castle_arrival_04_desc: "Pohled na titul [location.GetTitle.GetName] mě naplňuje úžasem a dychtivou zvědavostí na příběhy, které ukrývá."
 building_castle_arrival_05_desc: "Když se blížím k titulu [location.GetTitle.GetName], toužím odhalit příběhy, jejichž svědkem byl v průběhu věků."
 building_city_arrival_01_desc: "Při příchodu k titulu [location.GetTitle.GetName] mě vzrušuje představa objevování skrytých pokladů a živé kultury."
 building_city_arrival_02_desc: "Ruch titulu [location.GetTitle.GetName] mě naplňuje energií a těším se, až se ponořím do jeho živých ulic."
 building_city_arrival_03_desc: "Když vstupuji do titulu [location.GetTitle.GetName], zmocňuje se mě úžas a touha prozkoumat jeho kulturní poklady a uličky plné dějin."
 building_city_arrival_04_desc: "Při vstupu do titulu [location.GetTitle.GetName] se nemohu dočkat rušných tržišť a historických památek."
 building_city_arrival_05_desc: "Energie titulu [location.GetTitle.GetName] mě obklopuje a probouzí ve mně zvědavost poznat jeho živý život a bohatou minulost."
 building_temple_arrival_01_desc: "Při vstupu do titulu [location.GetTitle.GetName] dychtivě očekávám duchovní divy ukryté uvnitř."
 building_temple_arrival_02_desc: "Poklidná aura titulu [location.GetTitle.GetName] mě láká a slibuje cestu do světa míru a dávné moudrosti."
 building_temple_arrival_03_desc: "Když se blížím k titulu [location.GetTitle.GetName], zmocňuje se mě hluboká úcta a očekávání posvátného poznání, které nabízí."
 building_temple_arrival_04_desc: "Při vstupu do titulu [location.GetTitle.GetName] jsem připraven poznat duchovní hloubku a krásu, které ukrývá."
 building_temple_arrival_05_desc: "Přede mnou stojí titul [location.GetTitle.GetName], svatyně víry, a já toužím ponořit se do jeho posvátné atmosféry."
 building_tribal_holding_arrival_01_desc: "Když se blížím k titulu [location.GetTitle.GetName], vítá mě silný duch soudržného společenství."
 building_tribal_holding_arrival_02_desc: "Živá atmosféra titulu [location.GetTitle.GetName] mě vítá zářivými barvami a bohatými kulturními projevy."
 building_tribal_holding_arrival_03_desc: "Při příchodu k titulu [location.GetTitle.GetName] je okamžitě patrné harmonické spojení přírody a tradice."
 building_tribal_holding_arrival_04_desc: "Prosté kouzlo titulu [location.GetTitle.GetName] mě naplňuje očekáváním a touhou dozvědět se více."
 building_tribal_holding_arrival_05_desc: "Při vstupu do titulu [location.GetTitle.GetName] mě zasáhne prostota a srdečnost místního společenství."
 building_religious_learning_outro_01_desc: "Tato návštěva prohloubila mé porozumění duchovní víře a obřadům, které utvářely celé civilizace."
 building_religious_learning_outro_02_desc: "Průzkum tohoto posvátného místa obohatil mé chápání hlubokého vlivu víry na lidské dějiny a kulturu."
 building_religious_learning_outro_03_desc: "Má cesta sem mi odhalila rozmanité způsoby, jimiž lidé v průběhu času vyjadřovali a uctívali náboženskou oddanost."
 building_diplomatic_learning_outro_01_desc: "Tato zkušenost rozšířila můj pohled na složitosti a jemné odstíny diplomatických vztahů a státnictví."
 building_diplomatic_learning_outro_02_desc: "Odcházím s větším pochopením složitého umění diplomacie a jemných nuancí politických spojenectví."
 building_diplomatic_learning_outro_03_desc: "Čas strávený na tomto místě prohloubil mé porozumění křehké rovnováze moci a zásadní úloze diplomacie při utváření dějin."
 building_martial_learning_outro_01_desc: "Vojenská zdatnost a strategické poznatky získané během této návštěvy výrazně rozšířily mé porozumění válčení."
 building_martial_learning_outro_02_desc: "Tento průzkum mi přinesl cenné lekce z vojenské taktiky a válečného umění, které jsou nezbytné pro každého vůdce."
 building_martial_learning_outro_03_desc: "Získané vědomosti o bitevních strategiích a významu vojenské dovednosti mi ukázaly, jak zásadně mohou utvářet běh dějin."
 building_economic_learning_outro_01_desc: "Návštěva prohloubila mé chápání hospodářských zásad a klíčové úlohy obchodu v prosperitě zemí."
 building_economic_learning_outro_02_desc: "Průzkum tohoto místa prohloubil mé porozumění složitostem hospodářského rozvoje."
 building_economic_learning_outro_03_desc: "Odcházím s hlubším pochopením zásadního významu hospodářské obratnosti pro udržení mocných panství."
 building_man_made_wonder_learning_outro_01_desc: "Zdejší vynalézavost a řemeslné mistrovství ve mně zanechaly trvalý dojem z lidské tvořivosti a ctižádosti."
 building_man_made_wonder_learning_outro_02_desc: "Tento stavitelský div rozšířil mé uznání k výšinám, jichž může dosáhnout lidské úsilí."
 building_man_made_wonder_learning_outro_03_desc: "Odcházím inspirován pozoruhodným odkazem stavitelského mistrovství, které svědčí o lidských možnostech."
 building_natural_wonder_learning_outro_01_desc: "Dechberoucí krása a majestátnost tohoto přírodního divu výrazně prohloubily mé uznání k nádherám světa."
 building_natural_wonder_learning_outro_02_desc: "Tato návštěva ve mně probudila hluboký úžas nad přírodním světem a jeho nesčetnými divy."
 building_natural_wonder_learning_outro_03_desc: "Odcházím s obnovenou úctou k ohromující síle a kráse přírody i k její schopnosti utvářet náš svět a naše vnímání."
 building_exploration_01_desc: "S dychtivým očekáváním začínám svůj průzkum!"
 building_exploration_02_desc: "S očima doširoka otevřenýma zvědavostí se dychtivě vydávám vpřed!"
 building_exploration_03_desc: "Plný nadšení vyrážím prozkoumat divy tohoto místa!"
 building_exploration_04_desc: "S pocitem úžasu se vydávám prozkoumat každý kout!"
 building_exploration_05_desc: "Vykračuji vpřed s radostí z objevování a touhou vstřebat vědomosti, které toto místo slibuje!"
 building_exploration_06_desc: "S nadšením zahajuji svůj průzkum!"
 building_exploration_07_desc: "S radostí v srdci začínám putovat tímto místem!"
 building_exploration_08_desc: "Naplněn touhou po dobrodružství se vydávám prozkoumat toto místo!"
 building_exploration_09_desc: "Dychtivě začínám průzkum a každý krok je plný očekávání!"
 building_exploration_10_desc: "S neutuchajícím nadšením procházím tímto místem!"
 building_exploration_11_desc: "Vykračuji vpřed s dobrodružným duchem a touhou prozkoumat bohaté dějiny tohoto místa!"
 building_exploration_12_desc: "S radostným krokem se pouštím do průzkumu!"
 building_exploration_13_desc: "Dychtivě vyrážím na cestu kolem tohoto místa a očekávám objevy, které na mě čekají!"
 building_exploration_14_desc: "Plný nadšení vstupuji na toto místo a těším se na výjevy, které slibuje!"
 building_exploration_15_desc: "Začínám průzkum s úžasem a touhou poučit se z dědictví tohoto místa!"
 building_exploration_16_desc: "S dychtivým očekáváním procházím tímto místem a jsem připraven nechat se uchvátit jeho krásou!"
 building_exploration_17_desc: "Začínám svůj průzkum s pocitem vzrušení!"
 building_exploration_18_desc: "Vydávám se na cestu tímto místem plný dychtivé zvědavosti!"
 building_exploration_19_desc: "S nadšením v srdci vyrážím na průzkum!"
 building_exploration_20_desc: "Začínám svůj průzkum s touhou poznat nádheru, kterou toto místo ztělesňuje!"
 travel_destinations.1000.t: "Pamětihodnosti oblasti [location.GetNameNoTooltip]"
 travel_destinations.1000.desc: "[location.Custom('GetTouristHoldingIntro')]\n\n[location.Custom('GetSpecialBuildingTouristDescriptor')]\n\n[location.Custom('GetTouristStartEventOutro')]"
 the_with_space: ""
 travel_start_event.1090.t_activity_roaming: "$activity_roaming$: Znovu na cestě"
 travel_start_event.1090.t_activity_journey: "Výprava: Vzhůru ke stavbě [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip]!"
 travel_start_event.1090.t_activity_survey: "$activity_survey$: Dohled nad zemí"
 travel_start_event.1000.norwegian: "Ut på tur, aldri sur!"
 travel_start_event.1090.desc_activity_roaming: "Konečně se přede mnou otevírá svobodná cesta! Brzy vstoupím do [location.Custom('TerrainTypeProvincePrefix')] krajiny [location.Custom('TerrainTypeProvince')] nádherné oblasti [location.GetName].\n\nAch, jak toužím spatřit zdejší [location.Custom('GetProvinceFoliageDesc')] a sladce vonící rostliny [location.Custom('get_region_flower_type_plural')]. Vidět ptáky [location.Custom('GetRandomRegionalWildDaytimeBirdProvince')] poletovat otevřeným nebem nade mnou!\n\nMusím už vyrazit!"
 travel_start_event.1090.desc_activity_journey: "Cesta do oblasti [location.GetName] je dlouhá, ale nemohu se dočkat, až odhalím tajemství stavby [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetName] a poznám [location.GetTitle.GetHolder.Custom('ComplimentAdjective')] lid z [location.GetCounty.GetTitle.GetAdjective] [location.GetCulture.GetCollectiveNoun] kultury, který zde žije! [ROOT.Char.Custom('IntentInitialEventDesc')]\n\nKéž už bych byl na místě. Musíme si pospíšit!"
 knowledge_hoarding_1: "Budu si pořizovat nekonečné množství poznámek a pohltím každý kousek vědění, který naleznu."
 knowledge_hoarding_2: "Sepíšu vyčerpávající poznámky a vstřebám každý dostupný zlomek moudrosti."
 knowledge_hoarding_3: "Shromáždím podrobné záznamy a pohltím každý dostupný poznatek."
 curiosity_1: "Dychtivě očekávám setkání s místními obyvateli a doufám, že se ponořím do jejich příběhů a tradic."
 curiosity_2: "Představa, že navážu spojení s místním společenstvím a poučím se z jeho zkušeností, mě naplňuje radostí."
 curiosity_3: "Mé nadšení roste při pomyšlení, že poznám obyvatele tohoto místa a budu s nimi sdílet příběhy a moudrost."
 spread_legend_1: "Vetkám příběh legendy [ROOT.Char.GetPromotedLegend.GetName] do samotné podstaty tohoto místa a zanechám její stopu v dějinách."
 spread_legend_2: "Má cesta je také posláním: rozšířit věhlas legendy [ROOT.Char.GetPromotedLegend.GetName] a učinit z ní součást místních pověstí."
 spread_legend_3: "Mým cílem je, aby lidé, které potkám, oslavovali legendu [ROOT.Char.GetPromotedLegend.GetName] a aby s každým vyprávěním dále rostla."
 travel_start_event.1090.desc_activity_survey: "Je čas vzít záležitosti do vlastních rukou. Osobně dohlédnu na chod oblasti [location.GetName] a spočítám každé zvíře [root_scope.Custom('RegionalFarmAnimal')], každé opevnění, každý meč i každý pytel obilí!\n\nMé panství bude spravováno lépe než kterékoli jiné – do sedel!"
