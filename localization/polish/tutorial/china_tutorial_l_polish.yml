l_polish:
 lesson_china_introduction: "$lesson_basics_welcome$"
 lesson_china_introduction_desc: "@tutorial_screenshot_1_china!\nJsi mladý učenec v Číně; tvé postavení je skromné, avšak plné příslibů. Díky učenosti, lstivosti a záslužným činům můžeš stoupat císařskými hodnostmi.\n\nAčkoli je tvůj život pomíjivý, tvoji dědicové mohou jméno tvého rodu dovést k trvalé slávě.\n\nZa pevné vlády dynastie Song nabízejí císařské zkoušky cestu ke guvernérství – a snad i k samotnému císařskému trůnu." 
 lesson_china_camera: "$lesson_basics_quick_camera$"
 lesson_china_camera_desc: "$lesson_basics_quick_camera_desc$" 
 lesson_china_zoom: "$lesson_basics_quick_zoom$"
 lesson_china_zoom_desc: "$lesson_basics_quick_zoom_desc$" 
 lesson_china_nested_tooltips: "Vnořené nápovědy"
 lesson_china_nested_tooltips_desc: "$lesson_basics_tooltips_in_tooltips_desc$"
 lesson_china_nested_tooltips_hover_word: "$lesson_basics_tooltips_in_tooltips_hover_word$"
 lesson_china_nested_tooltips_hover_word_deeper: "$lesson_basics_tooltips_in_tooltips_hover_word_deeper$" 
 lesson_china_nested_tooltips_complete: "$lesson_china_nested_tooltips$"
 lesson_china_nested_tooltips_complete_desc: "$lesson_china_nested_tooltips_desc$"  
 lesson_china_characters: "Postavy"
 lesson_china_characters_desc: "Hraješ za [GetPlayer.GetShortUINameNotMeNoTooltip], jednu z mnoha [Concept('characters','postav')|E] v tomto světě, znázorněnou avatarem postavy.\n\nJsi nadějný byrokrat v [GetTitleByKey('h_china').GetDefinitiveName]!" 
 lesson_china_this_is_you_1: "$lesson_basics_quick_this_is_you_1$"
 lesson_china_this_is_you_1_desc: "Zde uvidíš sebe a svou nejbližší [Concept('family','rodinu')|e].\n\nVpravo vidíš svého [Concept('player_heir','hráčského dědice')|e], za něhož budeš hrát, až tvoje současná [character|E] zemře.\n\n#TUT Pokud se na mapě někdy ztratíš, můžeš kliknout na svou postavu a kamera se znovu vycentruje na tvé [Concept('realm','panství')|e].#!" 
 lesson_china_this_is_you_2: "$lesson_basics_quick_this_is_you_2$"
 lesson_china_this_is_you_2_desc: "Obvykle je dobré mít [Concept('spouse','choť')|E]. Pomůže ti vládnout tvému [Concept('realm','panství')|e] a zajistit budoucnost tvé [Concept('dynasty','dynastie')|e].\n\nMomentálně nejsi sezdaný. Co kdybychom s tím něco udělali?"
 lesson_china_find_spouse_tt: "$lesson_basics_quick_find_spouse_tt$" 
 lesson_china_marriage_window: "$lesson_basics_quick_this_is_you_2$"
 lesson_china_marriage_window_desc: "Najít vhodnou [Concept('spouse','choť')|E] není snadné, ale měj na paměti několik věcí:\n\n$EFFECT_LIST_BULLET$Schopnosti: Její [skills|E] se přičtou k tvým\n$EFFECT_LIST_BULLET$Dědičnost: [congenital_traits|E], například [GetTrait('lisping').GetName( GetNullCharacter )], mohou zdědit tvé [children|E]\n$EFFECT_LIST_BULLET$Urozenost: Sňatek s [Concept('lowborn','neurozenou postavou')|E] tě bude stát [prestige|E]" 
 lesson_china_married_great_job: "$lesson_basics_quick_married_great_job$"
 lesson_china_married_great_job_desc: "Blahopřeji ke sňatku!\n\nPokud po smrti tvé postavy nezůstane naživu žádný další člen tvé [Concept('dynasty','dynastie')|e], prohraješ hru. $game_concept_spouse$ ti může pomoci tomu zabránit." 
 lesson_china_this_is_you_3: "$lesson_basics_quick_this_is_you_3$"
 lesson_china_this_is_you_3_desc:  "Toto jsou [Concept('traits','rysy')|e] tvé postavy! Jak vidíš, má @ambitious_icon_tutorial![Nbsp][GetTrait('ambitious').GetName( GetNullCharacter )], @compassionate_icon_tutorial![Nbsp][GetTrait('compassionate').GetName( GetNullCharacter )] a @gregarious_icon_tutorial![Nbsp][GetTrait('gregarious').GetName( GetNullCharacter )].\n\n#TUT $game_concept_traits$ ovlivňují, jak tvoje postava reaguje na události v herním světě. Během hraní můžeš získat i nové rysy.#!" 
 lesson_china_skills: "$lesson_basics_quick_skills$"
 lesson_china_skills_desc: "$lesson_basics_quick_skills_desc$" 
 lesson_china_house: "$game_concept_house$"
 lesson_china_house_desc: "Toto je tvůj [Concept('house','rod')|E], #V rod [GetPlayer.GetHouse.GetNameNoTooltip]#!; rodina čínských [Concept('nobles','urozených')|E].\n\nJako [Concept('house_head_head','hlava')|E] svého $game_concept_house$ máš vést členy svého $game_concept_house$ k úspěchu v čínské správě.\n\nTvůj $game_concept_house$ je malý, ale časem poroste, až se do něj budou rodit [children|E].\n\n#TUT Každý [house|E] náleží k [Concept('dynasty','dynastii')|E]. Rod [GetPlayer.GetHouse.GetNameNoTooltip] je však tak malý, že $game_concept_house$ a $game_concept_dynasty$ jsou jedno a totéž.#!" 
 lesson_china_realm: "$game_concept_realm$"
 lesson_china_realm_desc: "Tato oblast zobrazuje tvé [Concept('realm','panství')|E], zjednodušeně řečeno zemi a zdroje, které ovládáš.\n\nJsi však jen skromný džentlmen, a proto nemáš žádnou [Concept('land','půdu')|e], což znamená, že tvůj $game_concept_realm$ je omezený. Chceš-li získat půdu, můžeš se pokusit stát [Concept('governor','guvernérem')|e]. O tom si povíme později."
 lesson_china_titles: "$game_concept_titles$"
 lesson_china_titles_desc: "Držíš jediný [Concept('title','titul')|E]. $game_concept_titles$ představují vlastnictví půdy.\n\nTvůj jediný $game_concept_title$, [GetPlayer.GetPrimaryTitle.GetName], ti dává do vlastnictví soukromý [Concept('estate','statek')|E] tvé rodiny. K tomuto $game_concept_estate$ se brzy vrátíme.\n\n#TUT Když budeš jako [Concept('governor','guvernér')|E] vládnout [Concept('province','provincii')|E], zobrazí se v této oblasti také jako $game_concept_title$.#!"
 lesson_china_relationships: "$lesson_basics_quick_relationships$"
 lesson_china_relationships_desc: "V této části uvidíš různé další [Concept('characters','postavy')|e], s nimiž máš nějaké spojení. Patří sem tvá [Concept('family','rodina')|e], kdokoli, s kým máš [Concept('relationship','zvláštní vztah')|e], tvoji [Concept('courtiers','dvořané')|e] a tvoji [Concept('subjects','subjekti')|E]."
 lesson_china_liege_introduction: "$game_concept_liege$"
 lesson_china_liege_introduction_desc: "Tvůj [Concept('liege','lenní pán')|e] je [Concept('son_of_heaven','Syn Nebes')|e], císař Číny. Jedním ze způsobů, jak s ním můžeš jednat, je kliknout na něj pravým tlačítkem.\n\nTím otevřeš nabídku interakcí, která ti umožní například #high najít staršího#! nebo #high požádat o mentorství#!."
 lesson_china_find_elder_tt: "Klikni pravým tlačítkem na svého $game_concept_liege$"
 lesson_china_liege_introduction_good_job: "Další postavy"
 lesson_china_liege_introduction_good_job_desc: "Dobrá práce! S většinou [Concept('characters','postav')|e] můžeš jednat tak, že na ně klikneš pravým tlačítkem.\n\nMožná bys rád použil [GetScheme('seduce').GetTypeName] na svou [Concept('spouse','choť')|e] nebo #high vzdělával #! své mladší sourozence?"
 lesson_china_resources_1: "$lesson_basics_quick_resources_1$"
 lesson_china_resources_1_desc: "Nyní se podívejme na lištu v pravém horním rohu obrazovky.\n\nNajdeš zde několik zdrojů, které lze různými způsoby využít k jednání se světem."
 lesson_china_resources_gold: "$lesson_basics_quick_resources_gold$"
 lesson_china_resources_gold_desc: "$lesson_basics_quick_resources_gold_desc$"
 lesson_china_resources_prestige: "$lesson_basics_quick_resources_prestige$"
 lesson_china_resources_prestige_desc: "$lesson_basics_quick_resources_prestige_desc$"
 lesson_china_resources_piety: "$lesson_basics_quick_resources_piety$"
 lesson_china_resources_piety_desc: "[piety_i|e] [Concept('piety','zbožnost')|e] je zdroj, který odráží, jak ctnostná je tvá postava.\n\nS tvou nashromážděnou $game_concept_piety$ roste také tvá [Concept('piety_level','úroveň oddanosti')|e]. Zaměřit se na [learning_i|e][Concept('learning','učenost')|e] může být pro obzvlášť oddanou postavu dobrý nápad."
 lesson_china_resources_influence: "@influence_icon! $game_concept_influence$"
 lesson_china_resources_influence_desc: "[influence_i] [Concept('influence','vliv')|e] je tvá schopnost přimět ostatní, aby naslouchali tomu, co říkáš. Když získáváš $game_concept_influence$, zvyšuje se také tvá [Concept('influence_level','úroveň vlivu')|e].\n\nJako zdroj se $game_concept_influence$ využívá hlavně k prosazení tebou vybraného kandidáta na [Concept('governor','guvernéra')|E] [Concept('province','provincie')|E]."
 lesson_china_resources_renown: "$lesson_basics_quick_resources_renown$"
 lesson_china_resources_renown_desc: "$lesson_basics_quick_resources_renown_desc$"
 lesson_china_estate_heading: "Tvůj rodový statek"
 lesson_china_open_estate: "$lesson_china_estate_heading$"
 lesson_china_open_estate_desc: "Jako [Concept('house_head_head','hlava')|E] svého [Concept('house','rodu')|E] máš [Concept('estate','statek')|E].\n\nJe to tvé soukromé mocenské sídlo a všechny investice, které do něj vložíš, ti zůstanou po celou hru.\n\nNachází se v [GetPlayer.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] a zůstane zde, i když se staneš [Concept('governor','guvernérem')|E] jinde."
 lesson_china_open_estate_prompt: "Otevři svůj statek (zvýrazněno)"
 lesson_china_estate_intro: "$lesson_china_estate_heading$"
 lesson_china_estate_intro_desc: "Výhody, které získáváš ze svého [Concept('estate','statku')|E], pocházejí z [Concept('estate_buildings','budov statku')|E], takže jednu z nich nyní postavme!"
 lesson_china_estate_intro_prompt: "Vyber prázdné stavební místo (zvýrazněno)"
 lesson_china_estate_build_list: "$lesson_china_estate_heading$"
 lesson_china_estate_build_list_desc: "[Concept('estate_building','Budova statku')|E], která zvyšuje tvůj příjem [Concept('gold','zlata')|E], například $rice_field_01_domicile_building|V$, by byla dobrým začátkem.\n\nMůžeš si však vybrat libovolnou budovu, která se ti líbí."
 lesson_china_estate_build_list_prompt: "Postav libovolnou $game_concept_estate_building$"
 lesson_china_estate_manor: "$lesson_china_estate_heading$"
 lesson_china_estate_manor_desc: "Stavba probíhá, výborně!\n\nMožná sis všiml, že počet míst, na kterých můžeš stavět [Concept('estate_buildings','budovy statku')|E], je omezený. Aby vznikl prostor pro další budovy, budeš muset časem vylepšit svou ústřední budovu #V sídla#!."
 lesson_china_estate_manor_prompt: "Vyber své sídlo (zvýrazněno)"
 lesson_china_estate_manor_selected: "$lesson_china_estate_heading$"
 lesson_china_estate_manor_selected_desc: "Všechny [Concept('estate_buildings','budovy statku')|E] lze vylepšovat a tvé sídlo není výjimkou.\n\nDůležité je, že vylepšením svého sídla získáš místa pro další $game_concept_estate_buildings$.\n\nVylepšení sídla je poměrně drahé, takže to teď dělat nebudeme."
 lesson_china_estate_close: "$lesson_china_estate_heading$"
 lesson_china_estate_close_desc: "Prozatím svůj statek opusťme.\n\nNejprve musíš zavřít své sídlo a poté okno statku."
 lesson_china_estate_close_prompt: "Zavři okno statku"
 lesson_china_estate_summary: "$lesson_china_estate_heading$"
 lesson_china_estate_summary_desc: "Jak již bylo řečeno, tvůj [Concept('estate','statek')|E] je tvým soukromým majetkem.\n\nBude tě provázet, až časem začneš hrát za svého [Concept('player_heir','dědice')|E].\n\nAčkoli se můžeš časem stát [Concept('governor','guvernérem')|E] bohaté [Concept('province','provincie')|E], veškeré investice učiněné tam náleží státu.\n\nProto je dobrý nápad utrácet vydělané [Concept('gold','zlato')|E] za vylepšení svého [Concept('estate','statku')|E]!"
 lesson_china_admin_intro: "Úřednická kariéra"
 lesson_china_admin_intro_desc: "Jakkoli by to bylo příjemné, neměl bys celý život trávit ve svém [Concept('estate','statku')|E].\n\nJako úředník máš prokázat své [Concept('merit','zásluhy')|E], stoupat v hodnostech, stát se [Concept('governor','guvernérem')|E] a možná dokonce [Concept('minister','ministrem')|E]."
 lesson_china_admin_merit: "$lesson_china_admin_intro$"
 lesson_china_admin_merit_desc: "Toto je tvá současná [Concept('merit_level','hodnost zásluh')|E].\n\nTvá $game_concept_merit_level$ měří tvou způsobilost a postavení v císařské byrokracii. Nejnižší hodnost je #V 9.#! a nejzáslužnější je #V 1.#!\n\nV tuto chvíli ses ještě vůbec neprokázal, takže nemáš žádnou $game_concept_merit_level$ a nejsi způsobilý stát se [Concept('governor','guvernérem')|E]."
 lesson_china_admin_open: "$lesson_china_admin_intro$"
 lesson_china_admin_open_desc: "Zvyšme svou [Concept('merit_level','hodnost zásluh')|E]!"
 lesson_china_admin_open_prompt: "Otevři panel „$ADMINISTRATIVE_GOVERNMENT_HEADER$“ (zvýrazněno)"
 lesson_china_exam: "$lesson_china_admin_intro$"
 lesson_china_exam_desc: "Říše je meritokracií a [Concept('imperial_examinations','úřednické zkoušky')|E] zajišťují, že [Concept('provinces','provincie')|E] budou jako [Concept('governors','guvernéři')|E] spravovat jen ti nejschopnější a nejctnostnější.\n\nSvou [Concept('merit_level','hodnost zásluh')|E] můžeš zvýšit účastí na [Concept('activities','aktivitách')|E] $activity_local_examination|V$ a $activity_imperial_examination|V$.\n\n$game_concept_examinations$ pořádají jak [governors|E], tak sám [son_of_heaven|E].\n\nJakmile se budou konat, obdržíš pozvánku."
 lesson_china_STUDY_SCHEME_SEGMENT: "Studium"
 TUTORIAL_OPEN_DECISION_PANEL_PROMPT: "Otevři panel „$DECISIONS_VIEW_TITLE$“"
 lesson_china_decisions_open: "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_decisions_open_desc: "Jakmile se rozhodneš zúčastnit [Concept('imperial_examination','úřednické zkoušky')|E], pomůže ti, když budeš dobře připraven.\n\nNa $game_concept_examinations$ se můžeš připravit studiem konfuciánských klasik."
 lesson_china_decisions_open_prompt: "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$"
 lesson_china_decisions: "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_decisions_desc: "Toto jsou rozhodnutí, různé osobní kroky, které můžeš podniknout.\n\nProzatím zvolme $tgp_china_study_confucian_classics_decision|V$."
 lesson_china_decisions_prompt: "Zahaj rozhodnutí „$tgp_china_study_confucian_classics_decision$“"
 lesson_china_stress: "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_stress_desc: "Výborně, zahájil jsi svá studia!\n\nStudium zvýší tvůj [stress_i][Concept('stress','stres')|E]. Kromě toho se $game_concept_stress$ obvykle získává nebo ztrácí podle toho, jak jednáš v souladu se svými [Concept('personality_traits','osobnostními rysy')|E].\n\nPokud získáš [GetDefine('NCharacter', 'STRESS_PER_LEVEL')|0V] $game_concept_stress$, tvá [Concept('stress_level','úroveň stresu')|E] se zvýší a tvé duševní zdraví utrpí.\n\n#I Sleduj zvýrazněný ukazatel $game_concept_stress$, abys předešel duševním zhroucením#!"
 lesson_china_schemes_open: "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_schemes_open_desc: "Studium je [Concept('scheme','intrika')|E]: dlouhodobý osobní projekt. Pojďme se krátce podívat na stav tvé $game_concept_scheme$."
 lesson_china_schemes_open_prompt: "Otevři panel „Pletichaření“"
 lesson_china_schemes_list: "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_schemes_list_desc: "Toto je tvá [scheme|E] $study_confucian_classics$.\n\nJde o opakující se $game_concept_scheme$. Po dokončení se vyhodnotí podle své [Concept('scheme_success_chance','šance na úspěch intriky')|E] a poté začne znovu.\n\nProtože tato $game_concept_scheme$ zvyšuje tvůj [Concept('stress','stres')|E], budeš ji časem muset opustit.\n\n#I Chceš-li $game_concept_scheme$ opustit, použij tlačítko v pravém horním rohu $game_concept_scheme$."
 lesson_china_unpause: "$lesson_basics_quick_resources_time$"
 lesson_china_unpause_desc: "Hra je nyní pozastavena. Rychlost plynutí času ve světě můžeš ovládat v pravém dolním rohu.\n\n#TUT Crusader Kings III je hra, která se odehrává v průběhu stovek let, takže si klidně dej načas.#!\n\nDokud je hra pozastavená, nikdo neuspořádá [Concept('imperial_examination','úřednickou zkoušku')|E], které by ses mohl zúčastnit, a nebude postupovat ani tvá [scheme|E] $study_confucian_classics$. Odpozastavme tedy hru a počkejme na pozvánku!"
 lesson_china_unpause_tt: "$lesson_basics_quick_unpause_tt$"
 lesson_china_done: "$lesson_basics_quick_done$"
 lesson_china_done_desc: "Hra už není pozastavená a čas plyne. Od této chvíle můžeš svobodně utvářet budoucnost jména rodu [GetPlayer.GetHouse.GetName].\n\n#TUT Dávej pozor na @reactive_advice_icon! reaktivní rady, které se budou zobrazovat v horní části obrazovky s dalšími pokyny!#!\n\nProzatím je tvým nejdůležitějším cílem vyčkat na další [Concept('imperial_examination','úřednickou zkoušku')|E] a zúčastnit se jí."
 action_reactive_advice_china_council: "Rada: $ra_china_council_1$"
 action_reactive_advice_china_council_desc: "Jako $game_concept_governor$ se můžeš spolehnout na svou $game_concept_council$, která ti pomůže se správou tvé $game_concept_province$. Otevři toto a získáš úvod do fungování rady."
 action_reactive_advice_china_council_click: "$click_to_open_lesson$"
 ra_china_council_1: "Guvernérova rada"
 ra_china_council_1_desc: "Jako [Concept('governor','guvernér')|E] nemusíš svou [Concept('province','provincii')|E] spravovat úplně sám. Podívejme se na tvou [Concept('council','radu')|e], která se od doby, než ses stal $game_concept_governor$, rozšířila."
 ra_china_council_1_prompt: "$lesson_basics_council_view_tt$"
 ra_china_council_2: "$ra_china_council_1$"
 ra_china_council_2_desc: "Toto je tvá [Concept('council','rada')|e], která se skládá ze šesti [Concept('councillors','rádců')|e], včetně tvé [Concept('spouse','choti')|e].\n\nMohou například $task_collect_taxes|V$ nebo $task_find_secrets|V$ prostřednictvím [Concept('councillor_tasks','úkolů rádců')|e].\n\nTeď, když jsi [Concept('governor','guvernérem')|E], mohou kromě jiného také $task_develop_county|V$ nebo $task_conversion|V$."
