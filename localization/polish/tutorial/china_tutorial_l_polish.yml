 ra_china_council_1: "Guvernorská rada" # todo: NEW TRANSLATION
 ra_china_council_1_desc: "Jako [Concept('governor','guvernér')|E] nemusíte spravovat svou [Concept('province','provincii')|E] sami. Podívejme se na vaši [Concept('council','radu')|e], která se rozrostla od doby předtím, než jste se [Select_CString(ROOT.Char.IsFemale,'stala','stal')] guvernérem." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_china_council_1_prompt: "$lesson_basics_council_view_tt$" # todo: NEW TRANSLATION
 ra_china_council_2: "$ra_china_council_1$" # todo: NEW TRANSLATION
 ra_china_council_2_desc: "Toto je vaše [Concept('council','rada')|e], která se skládá ze šesti [Concept('councillors','rádci')|e], včetně vašeho [Concept('spouse','chotě')|e].\n\nMůžou například vykonávat $task_collect_taxes|V$ nebo $task_find_secrets|V$ prostřednictvím [Concept('councillor_tasks','úkolů rádce')|e].\n\nNyní, když jste [Concept('governor','guvernér')|E], mohou také provádět $task_develop_county|V$ nebo $task_conversion|V$ a další úkoly." # todo: NEW TRANSLATION # todo: CONCEPT CASE
