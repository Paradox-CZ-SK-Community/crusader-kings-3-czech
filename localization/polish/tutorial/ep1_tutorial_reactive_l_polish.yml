l_polish:
 reactive_advice_should_form_hybrid_culture: "Hybridní kultury"
 action_reactive_advice_should_form_hybrid_culture: "$open_tutorial_lesson$$reactive_advice_should_form_hybrid_culture$"
 action_reactive_advice_should_form_hybrid_culture_desc: "Pracuj na vytvoření [Concept('hybrid_culture','hybridní kultury')|E] s [culture.GetCollectiveNoun]."
 action_reactive_advice_should_form_hybrid_culture_click: "$click_to_open_lesson$"
 lessons_ep1_form_hybrid_culture: "$reactive_advice_should_form_hybrid_culture$"
 lessons_ep1_should_form_hybrid_culture_desc: "S touto [Concept('culture','kulturou')|E] bys mohl vytvořit [Concept('hybrid_culture','hybridní kulturu')|E], pokud je [Concept('cultural_acceptance','kulturní přijetí')|E] dostatečně vysoké a tvá kultura je starší než 50 let!\n\nTo znamená, že vytvoříš novou kulturu, která bude mít prvky jak tvé kultury, tak té druhé.\n\nKulturní přijetí můžeš získat takto:\n$EFFECT_LIST_BULLET$Udělováním [Concept('counties','hrabství')|E] této kultury [Concept('characters','postavám')|E] této kultury\n$EFFECT_LIST_BULLET$Používáním [accept_culture|E] jako [Concept('councillor_task','úkolu rádce')|E]\n$EFFECT_LIST_BULLET$Zvyšováním [Concept('culture_intermingling','mísení kultur')|E]\n$EFFECT_LIST_BULLET$Tím, že máš [Concept('vassals','vazaly')|E] této kultury\n\nPokud máš vysoké kulturní přijetí a v rámci tvého [Concept('realm','panství')|E] leží alespoň jedno hrabství této kultury, můžeš vytvořit hybridní kulturu!"
 lessons_ep1_hybrid_culture_benefits: "Výhody hybridních kultur"
 lessons_ep1_hybrid_culture_benefits_desc: "Vytvoření hybridní kultury přináší řadu výhod:\n\n$EFFECT_LIST_BULLET$Budeš si moci zvolit [Concept('culture_pillars','kulturní pilíře')|E] a [Concept('culture_traditions','kulturní tradice')|E] z kterékoli rodičovské kultury\n$EFFECT_LIST_BULLET$Tvá nová kultura zdědí všechny [Concept('innovations','inovace')|E] obou rodičovských kultur\n$EFFECT_LIST_BULLET$Tvá nová kultura bude mít vysoké kulturní přijetí u obou rodičovských kultur\n$EFFECT_LIST_BULLET$Hybridní kultura dokáže několik let po svém vytvoření mnohem rychleji obracet země svých rodičovských kultur"
 action_reactive_advice_royal_court: "$open_tutorial_lesson$$ra_rc_intro$"
 action_reactive_advice_royal_court_desc: "Otevři toto a získáš úvod do svého královského dvora"
 action_reactive_advice_royal_court_click: "$click_to_open_lesson$"
 reactive_advice_royal_court: "$ra_rc_intro$"
 ra_rc_intro: "Královský dvůr"
 ra_rc_intro_desc: "Nyní máš přístup ke svému vlastnímu [Concept('royal_court','královskému dvoru')|E]!\n\nKrálovský dvůr je zvláštní typ dvora, který představuje tvůj velkolepý vstup na světovou scénu a zpřístupňuje mnoho nových možností a výhod.\n\nJe dostupný [Concept('kings','králům')|E] a [Concept('emperors','císařům')|E] s [Concept('government','vládou')|E] typu [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName], [GetGovernment( 'tribal_government' ).GetName] nebo [GetGovernment( 'administrative_government' ).GetName]."
 ra_rc_open: "$ra_rc_intro$"
 ra_rc_open_desc: "Ve svém [Concept('royal_court','královském dvoru')|E] můžeš dělat mnoho věcí, takže si tyto možnosti klidně prozkoumej sám!\n\nProzatím si udělejme krátkou prohlídku všech nových akcí, které máš k dispozici."
 ra_rc_open_prompt: "Otevři královský dvůr (zvýrazněno)"
 ra_rc_throne_room_open: "$ra_rc_intro$"
 ra_rc_throne_room_open_desc: "Abychom mohli pokračovat, vraťme se do trůnního sálu"
 ra_rc_throne_room_open_prompt: "Otevři záložku trůnního sálu (zvýrazněno)"
 ra_rc_throne_room: "$ra_rc_intro$"
 ra_rc_throne_room_desc: "Toto je tvůj trůnní sál. Čas od času se zde mohou odehrávat různé situace a [Concept('court_events','dvorské události')|E] a ty se můžeš rozhodnout zasáhnout do toho, co se právě děje."
 ra_rc_hold_court: "Uspořádat audienci"
 ra_rc_hold_court_desc: "Pokud máš pocit, že tvůj trůnní sál není dost živý, můžeš [Concept('hold_court','uspořádat audienci')|E]. Tím pozveš prosebníky z celého svého [Concept('realm','panství')|E], aby své záležitosti předložili tvému moudrému soudu."
 ra_rc_grandeur_open: "$ra_rc_grandeur$"
 ra_rc_grandeur_open_desc: "Nikdo však nemusí chtít přijít ke tvému [Concept('royal_court','královskému dvoru')|E], pokud není dostatečně proslulý! Dále se podívejme na velkolepost dvora!"
 ra_rc_grandeur_open_prompt: "Otevři záložku velkoleposti dvora (zvýrazněno)"
 ra_rc_grandeur: "Velkolepost dvora"
 ra_rc_grandeur_desc: "Tvá [Concept('grandeur_level','úroveň velkoleposti')|E] je měřítkem toho, jak proslulý je tvůj [Concept('royal_court','královský dvůr')|E].\n\nK tvé [Concept('grandeur','velkoleposti')|E] přispívají různé faktory, ale hlavními zdroji jsou [Concept('amenities','komfort')|E] a [Concept('court_artifacts','dvorské artefakty')|E].\n\nJak se tvé [Concept('realm','panství')|E] zvětšuje, bude se od tebe očekávat dosažení vyšší úrovně velkoleposti: tomu se říká [Concept('grandeur_expectations','očekávaná velkolepost')|E]."
 ra_rc_amenities: "Dvorský komfort"
 ra_rc_amenities_desc: "[Concept('amenities','Komfort')|E] představuje různé služby a pohodlí, které poskytuješ každému, kdo navštíví tvůj [Concept('royal_court','královský dvůr')|E]. Každý z nich přináší vlastní výhody a všechny přispívají k [Concept('grandeur','velkoleposti')|E].\n\nKaždý měsíc stojí [Concept('gold','zlato')|E], proto si dej pozor, abys neutrácel příliš!"
 ra_rc_court_types_and_language: "Typy dvora a dvorní jazyk"
 ra_rc_court_types_and_language_desc: "Pokud se chceš do [Concept('grandeur','velkoleposti')|E] ponořit hlouběji, můžeš prozkoumat [Concept('court_types','typy dvora')|E] a [Concept('court_language','dvorní jazyk')|E].\n\nTypy dvora ovlivňují, co ti určité [Concept('grandeur_levels','úrovně velkoleposti')|E] poskytují, zatímco změna tvého dvorního jazyka může zvýšit tvou celkovou [Concept('grandeur','velkolepost')|E]."
 ra_rc_artifacts_open: "$ra_rc_artifacts$"
 ra_rc_artifacts_open_desc: "Nakonec se podívejme na dvorské artefakty, další zdroj [Concept('grandeur','velkoleposti')|E] i jiných výhod."
 ra_rc_artifacts_open_prompt: "Otevři záložku dvorských artefaktů (zvýrazněno)"
 ra_rc_artifacts: "Dvorské artefakty"
 ra_rc_artifacts_desc: "Zde si můžeš zvolit, které [Concept('court_artifacts','dvorské artefakty')|E] budou vystaveny ve tvém [Concept('royal_court','královském dvoru')|E].\n\nDvorské artefakty jsou zvláštní [Concept('artifacts','artefakty')|E], například sochy a tapiserie, které můžeš vystavit. Poskytují různé bonusy a mnohé ti také dávají [Concept('grandeur','velkolepost')|E].\n\nNyní se vraťme do trůnního sálu."
 ra_rc_conclusion: "$ra_rc_intro$"
 ra_rc_conclusion_desc: "Tím končí naše prohlídka tvého [Concept('royal_court','královského dvora')|E].\n\nProzatím si klidně vyzkoušej cokoli, co se ti zalíbí. Doporučujeme ti [Concept('hold_court','uspořádat audienci')|E] na oslavu tvého nového postavení!"
 lessons_ep1_fund_inspiration: "Financování inspirací"
 ra_inspiration_open_desc: "Nyní můžeš financovat svou první [Concept('inspiration','inspiraci')|E]. Inspirace je touha postavy vytvořit [Concept('artifact','artefakt')|E].\n\n[Concept('inspired','Inspirované')|E] [Concept('characters','postavy')|E] přicházejí a odcházejí z nejprestižnějších [Concept('royal_courts','královských dvorů')|E] světa; když se některá zastaví u tvého dvora, budeš upozorněn a vyzván, abys [Concept('sponsor','sponzoroval')|E] [Concept('project','projekt')|E] této postavy.\n\nZaplacením různého množství [Concept('gold','zlata')|E] si můžeš zajistit služby této postavy a po nějakém čase i nový artefakt!"
 ra_inspiration_open: "Inspirace"
 ra_inspiration_court_view: "Hledání inspirací"
 ra_inspiration_court_view_desc: "Ve svém [Concept('royal_court','královském dvoru')|E] vlevo vidíš všechny [Concept('inspirations','inspirace')|E], které se právě nacházejí u tvého dvora.\n\nJejich stav můžeš zkontrolovat kliknutím na jejich ikonu (zvýrazněno)."
 ra_inspiration_court_view_prompt: "Klikni na ikonu inspirace (zvýrazněno)"
 ra_inspiration_funding: "Financování inspirací"
 ra_inspiration_funding_desc: "Zde vidíš inspirovanou postavu, co zamýšlí vytvořit, jak dobrá je její dovednost, zda si můžeš dovolit inspiraci financovat a kolik tě to bude stát.\n\nPokud už inspirace probíhá, vidíš, jak dlouho potrvá do dokončení; pokud neprobíhá, můžeš ji zahájit."
 reactive_advice_fund_inspiration: "$lessons_ep1_fund_inspiration$"
