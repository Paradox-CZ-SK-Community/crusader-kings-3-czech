l_polish:
 action_reactive_advice_welcome_to_japan: "Rada: Japonsko"
 action_reactive_advice_welcome_to_japan_desc: "V období Heian Japonsko balancuje mezi císařskými úředníky a místními válečníky. Otevři toto a získáš úvod do této jedinečné politické struktury."
 action_reactive_advice_welcome_to_japan_click: "$click_to_open_lesson$"
 reactive_advice_welcome_to_japan_step_intro: "Japonsko"
 reactive_advice_welcome_to_japan_step_intro_desc: "Vítej v období Heian!\n\nV této éře Japonsko balancuje mezi tradicí a násilím. Ctižádostivé [Concept('houses','rody')|E] soupeří o moc a kontrolu nad císařským trůnem.\n\n#TUT Předpokládáme, že už máš s hraním Crusader Kings 3 nějaké zkušenosti.#!"
 reactive_advice_welcome_to_japan_step_government: "Vláda"
 reactive_advice_welcome_to_japan_step_government_desc: "Japonsko je [Concept('realm','panství')|E] rozdělené mezi dva typy pánů.\n\n[Concept('rulers','Vládci')|E] mají jednu z těchto forem [Concept('government','vlády')|E]:\n$EFFECT_LIST_BULLET$[ritsuryo_i][ritsuryo|E] #weak (císařští úředníci)#!\n$EFFECT_LIST_BULLET$[soryo_i][soryo|E] #weak (feudální válečníci)#!\n\nHistoricky válečníci $game_concept_soryo$ sílili, což nakonec v Japonsku vedlo k vládě [Concept('shogun','šóguna')|E]."
 reactive_advice_welcome_to_japan_step_open_families_tab: "$reactive_advice_welcome_to_japan_step_emperor_and_regent$"
 reactive_advice_welcome_to_japan_step_open_families_tab_desc: "V Japonsku není totéž, kdo údajně vládne, a kdo #EMP skutečně#! vládne. Podívejme se na to nyní."
 reactive_advice_welcome_to_japan_step_open_families_tab_prompt: "Otevři záložku „$administraction_tab_families|V$“ v panelu „$ADMINISTRATIVE_GOVERNMENT_HEADER|V$“ (zvýrazněno)"
 reactive_advice_welcome_to_japan_step_emperor_and_regent: "Císař a jeho regent"
 reactive_advice_welcome_to_japan_step_emperor_and_regent_desc: "Toto je [Concept('japanese_emperor','japonský císař')|E], známý také jako $king_tenno_male_japanese$.\n\nAčkoli by jeho titul naznačoval, že vládne Japonsku, je znám jako [Concept('ceremonial_liege','obřadní panovník')|E] a nemá žádnou skutečnou moc.\n\nSňatek do jeho rodiny však stále přináší mnoho [Concept('prestige','prestiže')|E] a ctižádostivý $king_tenno_male_japanese$ se může pokusit chopit moci."
 reactive_advice_welcome_to_japan_step_emperor_and_regent_2: "Císař a jeho regent"
 reactive_advice_welcome_to_japan_step_emperor_and_regent_2_desc: "Skutečnou moc v Japonsku má místo něj zde zobrazený [Concept('ceremonial_regent','vládnoucí regent')|E].\n\nTen je skutečným [Concept('independent','nezávislým')|E] [Concept('ruler','vládcem')|E] Japonska. Kromě běžných pravomocí každého $game_concept_independent$ $game_concept_ruler$ také určuje [Concept('imperial_policy','císařskou politiku')|E] jako [Concept('law','zákon')|E], který ovlivňuje celé [Concept('realm','panství')|E]."
 reactive_advice_welcome_to_japan_step_manor: "$japanese_manor_domicile_type$"
 reactive_advice_welcome_to_japan_step_manor_desc: "Každá [Concept('house_head','hlava rodu')|E] v Japonsku má $japanese_manor_domicile_type$, který může rozšiřovat a rozvíjet za vydělané [Concept('gold','zlato')|E].\n\nNa rozdíl od [Concept('holdings','držav')|E] ve tvé [Concept('domain','doméně')|E] zůstává tvůj $japanese_manor_domicile_type$ u [Concept('house_head','hlavy rodu')|E] a neztratí se, pokud je tvá [Concept('domain','doména')|E] dobyta.\n\n#I Pokud jsi $game_concept_house_head$, můžeš svůj $japanese_manor_domicile_type$ zobrazit a rozvíjet pomocí zvýrazněného tlačítka#!."
 reactive_advice_welcome_to_japan_step_house_aspirations: "Aspirace rodu"
 reactive_advice_welcome_to_japan_step_house_aspirations_desc: "Všechny japonské [Concept('houses','rody')|E] mají [Concept('house_aspiration','aspiraci rodu')|E].\n\nTento atribut ovlivňuje všechny členy $game_concept_house$ a může jej časem vylepšovat [Concept('house_head','hlava rodu')|E] utrácením [prestige_i|E][Concept('prestige','prestiže')|E].\n\n#I Jako $game_concept_house_head$ můžeš svou $game_concept_house_aspiration$ zobrazit a vylepšit pomocí zvýrazněného tlačítka."
 reactive_advice_welcome_to_japan_step_blocs: "Rodové bloky"
 reactive_advice_welcome_to_japan_step_blocs_desc: "Většina [Concept('vassals','vazalů')|E] v Japonsku vládne pouze jednomu [Concept('county','hrabství')|E].\n\nAby upevnily svou moc, patří většina [Concept('houses','rodů')|E] do [Concept('house_bloc','rodového bloku')|E], obranného spojenectví [Concept('houses','rodů')|E].\n\nČlenové $game_concept_house_bloc$ mají zpravidla stejnou [Concept('house_aspiration','aspiraci rodu')|E] a dobré [Concept('house_relations','vztahy rodů')|E] mezi sebou. Pokud tomu tak není, [Concept('bloc_cohesion','soudržnost bloku')|E] se sníží a [Concept('leading_house','vůdčí rod')|E] se může rozhodnout sporné $game_concept_houses$ z $game_concept_bloc$ vyloučit.\n\n#I Pokud jsi součástí $game_concept_bloc$, můžeš stav svého $game_concept_bloc$ zobrazit kliknutím na zvýrazněné tlačítko.#!"
 reactive_advice_welcome_to_japan_step_end: "Japonsko"
 reactive_advice_welcome_to_japan_step_end_desc: "V Japonsku je politika vždy svárem dvou stran. Veď svůj [Concept('house','rod')|E] moudře a určíš budoucnost Japonska."
 action_reactive_advice_soryo_intro: "Rada: vládce typu $japan_feudal_government$"
 action_reactive_advice_soryo_intro_desc: "Jsi vládce typu Sórjó, místní válečník. Otevři toto a získáš úvod do tohoto typu vlády."
 action_reactive_advice_soryo_intro_click: "$click_to_open_lesson$"
 reactive_advice_soryo_intro_NAME: "Vláda $japan_feudal_government$"
 ra_soryo_intro: "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_intro_desc: "Jsi [Concept('ruler','vládce')|E] s vládou [GetGovernment('japan_feudal_government').GetName]: válečník, který vládne silou zbraní, nikoli zákonnou vládou císařské byrokracie."
 ra_soryo_basics: "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_basics_desc: "[Concept('government','Vláda')|E] [GetGovernment('japan_feudal_government').GetName] je velmi podobná $game_concept_government$ [GetGovernment('feudal_government').GetName], kterou najdeš mimo Japonsko.\n\nV Japonsku období Heian se však rozšiřování tvého [Concept('realm','panství')|E] prostřednictvím [Concept('war','války')|E] považuje za [Concept('crime','zločin')|E]. Tvůj [Concept('top_liege','nejvyšší lenní pán')|E] ti proto může volně odebrat [Concept('titles','tituly')|E].\n\nAby ti tvůj $game_concept_top_liege$ nevzal, co sis právem vydobyl, měl by ses ujistit, že jsi součástí [Concept('house_bloc','rodového bloku')|E]. Pokud ti tvůj $game_concept_top_liege$ vyhlásí $game_concept_war$, [Concept('houses','rody')|E] tvého $game_concept_bloc$ se k tobě připojí jako [Concept('allies','spojenci')|E].\n\n#I Pokud už jsi součástí $game_concept_bloc$, můžeš jej vybrat zvýrazněným tlačítkem#!."
 ra_soryo_open_decisions: "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_open_decisions_desc: "Nejvyšší touhou každého [Concept('ruler','vládce')|E] s vládou [GetGovernment('japan_feudal_government').GetName] je stát se [Concept('shogun','šógunem')|E], vojenským a dědičným $game_concept_ruler$ Japonska.\n\nK dosažení tohoto cíle můžeš přijmout dvě klíčová [Concept('decisions','rozhodnutí')|E]. Podívejme se na ně nyní."
 ra_soryo_open_decisions_prompt: "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$"
 ra_soryo_regional_dominion: "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_regional_dominion_desc: "První [Concept('decision','rozhodnutí')|E], o které bys měl usilovat, je „$tgp_japan_assert_regional_dominion_government_decision|V$“.\n\nUmožní ti dobýt [Concept('duchy','vévodství')|E] tvého místního regionu. Ačkoli není nutné k tomu, aby ses stal [Concept('shogun','šógunem')|E], je to užitečný mezikrok.\n\n#TUT Pokud už máš [Concept('rank','hodnost')|E] [Concept('duke','vévody')|E], toto $game_concept_decision$ není dostupné.#!"
 ra_soryo_shogunate: "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_shogunate_desc: "Skutečné [Concept('decision','rozhodnutí')|E], kterým se staneš [Concept('shogun','šógunem')|E], je „$tgp_japan_become_shogun_decision_TUTORIAL|V$“.\n\nAby ses tím však vůbec mohl začít zabývat, musíš být nejprve [Concept('ceremonial_regent','vládnoucím regentem')|E]."
 ra_soryo_intro_open_factions: "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_intro_open_factions_desc: "Abys dosadil sám sebe jako [Concept('ceremonial_regent','vládnoucího regenta')|E], musíš založit [Concept('faction','frakci')|E]."
 ra_soryo_intro_open_factions_prompt: "Otevři záložku „$factions_tab_my_factions|V$“ v panelu „$FACTIONS_WINDOW|V$“"
 ra_soryo_intro_install_regent_faction: "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_intro_install_regent_faction_desc: "Aby ses stal [Concept('ceremonial_regent','vládnoucím regentem')|E], musíš vytvořit [Concept('faction','frakci')|E] $replace_ceremonial_regent_faction_name|V$ a úspěšně prosadit své požadavky.\n\nJako [Concept('leading_house','vůdčí rod')|E] se k tobě ve $game_concept_faction$ připojí všechny [Concept('houses','rody')|E] tvého $game_concept_bloc$. Čím silnější je vojenská síla tvého $game_concept_bloc$, tím pravděpodobněji $game_concept_faction$ uspěje.\n\nMusíš také zajistit, aby byla [Concept('cohesion','soudržnost')|E] dostatečně vysoká, jinak $game_concept_faction$ ani nemůžeš vytvořit."
 ra_soryo_end: "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_end_desc: "Jako [Concept('ruler','vládce')|E] s vládou [GetGovernment('japan_feudal_government').GetName] si cestu k titulu [Concept('shogun','šóguna')|E] prosekáš mečem.\n\nUpevni místní moc, vytvoř [Concept('faction','frakci')|E] se svým [Concept('house_bloc','rodovým blokem')|E] a jednoho dne možná budeš vládnout jako $game_concept_shogun$."
 action_reactive_advice_lead_your_soryo_bloc_NAME: "Vedení: $game_concept_house_bloc$"
 action_reactive_advice_lead_your_soryo_bloc: "Rada: $action_reactive_advice_lead_your_soryo_bloc_NAME$"
 action_reactive_advice_lead_your_soryo_bloc_desc: "Jsi $game_concept_house_head$ $game_concept_leading_house$ ve svém $game_concept_bloc$. Otevři toto a dozvíš se, jak svůj $game_concept_bloc$ spravovat."
 action_reactive_advice_lead_your_soryo_bloc_click: "$click_to_open_lesson$"
 ra_soryo_bloc_leader_intro: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_intro_desc: "Jsi [Concept('house_head','hlavou rodu')|E] [Concept('leading_house','vůdčího rodu')|E] ve svém [Concept('house_bloc','rodovém bloku')|E], výborně!\n\nJako vůdce svého $game_concept_bloc$ už pro tebe není pouze štítem, ale také způsobem, jak vytvořit mocnou [Concept('faction','frakci')|E], která tě dosadí jako [Concept('ceremonial_regent','vládnoucího regenta')|E]!"
 ra_soryo_bloc_leader_open_bloc: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_open_bloc_desc: "Podívejme se na tvůj [Concept('house_bloc','rodový blok')|E]."
 ra_soryo_bloc_leader_open_bloc_prompt: "Vyber svůj $game_concept_bloc$ (zvýrazněno)"
 ra_soryo_bloc_leader_strength_intro: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_strength_intro_desc: "[Concept('houses','Rody')|E] ve tvém [Concept('bloc','bloku')|E] se připojí k [Concept('leading_house','vůdčímu rodu')|E], když zahájí [Concept('factions','frakce')|E].\n\nPokud se chceš stát [Concept('ceremonial_regent','vládnoucím regentem')|E] a časem i [Concept('shogun','šógunem')|E], připojí se k tvé $game_concept_faction$ $replace_ceremonial_regent_faction_name|V$!"
 ra_soryo_bloc_leader_strength_details: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_strength_details_desc: "Zde je zobrazena síla všech členů [Concept('bloc','bloku')|E].\n\nČím silnější je tvůj $game_concept_bloc$, tím pravděpodobněji bude tvá [Concept('faction','frakce')|E] schopna prosadit své požadavky a dosadit tě jako [Concept('ceremonial_regent','vládnoucího regenta')|E]."
 ra_soryo_bloc_leader_expanding: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_expanding_desc: "Silný [Concept('bloc','blok')|E] je takový, který má mnoho mocných [Concept('houses','rodů')|E].\n\nNa mapě vidíš rozsah všech $game_concept_blocs$ a můžeš najít [Concept('house_heads','hlavy rodů')|E] bez $game_concept_bloc$. Můžeš se je pokusit přesvědčit, aby se připojily k tvému $game_concept_bloc$, pomocí [Concept('character_interaction','interakce s postavou')|E] $invite_to_house_bloc_interaction|V$.\n\nNemusí však vždy přijmout... Místo toho můžeš jako [Concept('ruler','vládce')|E] s vládou [GetGovernment('japan_feudal_government').GetName] rozšířit svůj $game_concept_bloc$ prostřednictvím [Concept('war','války')|E].\n\nMáš dvě různé možnosti:\n$EFFECT_LIST_BULLET$[Concept('bloc_expansion','Rozšíření bloku')|E] ti umožňuje dobýt zemi, která se dostane pod kontrolu tvého $game_concept_bloc$.\n$EFFECT_LIST_BULLET$[Concept('bloc_supremacy','Nadvláda bloku')|E] je otevřená válka mezi dvěma $game_concept_blocs$, v níž se členové poraženého $game_concept_bloc$ mohou připojit k vítězi."
 ra_soryo_bloc_leader_cohesion: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_cohesion_desc: "Snaha sjednotit rozdílné [Concept('houses','rody')|E] do velkého [Concept('bloc','bloku')|E] s sebou přináší náročné výzvy, protože každý $game_concept_house$ přispívá k celkové [Concept('cohesion','soudržnosti')|E] $game_concept_bloc$.\n\nKromě bonusů poskytovaných vysokou $game_concept_cohesion$ potřebuješ určité množství $game_concept_cohesion$ už jen k vytvoření [Concept('faction','frakce')|E]."
 ra_soryo_bloc_leader_cohesion_2: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_cohesion_2_desc: "Chceš-li zlepšit [Concept('cohesion','soudržnost')|E] určitého [Concept('house','rodu')|E], nejprve zajisti, že sdílíte stejnou [Concept('house_aspiration','aspiraci rodu')|E], a to použitím [Concept('character_interaction','interakce s postavou')|E] $demand_aspiration_change_interaction|V$ na jeho [Concept('house_head','hlavu rodu')|E].\n\nI tak však $game_concept_cohesion$ vychází hlavně z dobrých [Concept('house_relations','vztahů rodů')|E] mezi všemi $game_concept_houses$ v [Concept('bloc','bloku')|E]. $game_concept_house_relations$ lze zlepšit například domlouváním sňatků se členy $game_concept_house$.\n\nPokud všechno ostatní selže, možná budeš muset prostě použít $game_concept_character_interaction$ $kick_from_house_bloc_interaction|V$."
 ra_soryo_bloc_end: "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_end_desc: "Jako vůdce svého [Concept('bloc','bloku')|E] zajisti, aby se časem rozrůstal získáváním další země prostřednictvím [Concept('war','války')|E].\n\nSe silným $game_concept_bloc$ s vysokou [Concept('cohesion','soudržností')|E] budeš připraven vytvořit svou [Concept('faction','frakci')|E] $replace_ceremonial_regent_faction_name|V$!"
 reactive_advice_soryo_regent_become_shogun_NAME: "Vytvořit $empire_shogunate_japanese$"
 action_reactive_advice_soryo_regent_become_shogun: "Rada: $reactive_advice_soryo_regent_become_shogun_NAME$"
 action_reactive_advice_soryo_regent_become_shogun_desc: "Jsi $game_concept_ceremonial_regent$. Otevři toto a dozvíš se, jak dále upevnit svou moc a stát se $game_concept_shogun$."
 action_reactive_advice_soryo_regent_become_shogun_click: "$click_to_open_lesson$"
 ra_become_shogun_intro: "Rada: $reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_intro_desc: "Jsi [Concept('ceremonial_regent','vládnoucí regent')|E] Japonska a jeho faktický [Concept('ruler','vládce')|E]. Jako [Concept('shogun','šógun')|E] bys však měl ještě větší moc a kontrolu!"
 ra_become_shogun_open_decisions: "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_open_decisions_desc: "Abys se stal [Concept('shogun','šógunem')|E], musíš splnit několik požadavků. Podívejme se na ně nyní."
 ra_become_shogun_open_decisions_prompt: "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$"
 ra_become_shogun_decision: "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_decision_desc: "„$tgp_japan_become_shogun_decision_TUTORIAL|V$“ je [Concept('decision','rozhodnutí')|E], které musíš přijmout, aby ses stal [Concept('shogun','šógunem')|E].\n\nNež to však bude možné, musíš překonat tři zásadní překážky:\n$EFFECT_LIST_BULLET$Přijmout [Concept('law','zákon')|E] [GetLaw('japanese_bureaucracy_2').GetName]\n$EFFECT_LIST_BULLET$Tvá [Concept('prestige_level','úroveň slávy')|E] je [prestige_i][GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L] nebo vyšší\n$EFFECT_LIST_BULLET$Tvá [Concept('legitimacy_level','úroveň legitimity')|E] je větší nebo rovna #V 4#!"
 ra_become_shogun_open_laws: "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_open_laws_desc: "Nejprve se podívejme na stav tvých [Concept('laws','zákonů')|E]."
 ra_become_shogun_open_laws_prompt: "Otevři záložku „$MY_REALM_WINDOW_BODY_TITLE_LAWS|V$“ v panelu „#V Panství#!“ (zvýrazněno)"
 ra_become_shogun_laws: "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_laws_desc: "Zde můžeš postupně zavádět přísnější správu. Abys se stal [Concept('shogun','šógunem')|E], potřebuješ alespoň [Concept('law','zákon')|E] [GetLaw('japanese_bureaucracy_2').GetName].\n\nMěj na paměti, že to stojí [Concept('prestige','prestiž')|E] a snižuje [Concept('opinion','mínění')|E], které o tobě mají [Concept('vassals','vazalové')|E]."
 ra_become_shogun_open_subjects: "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_open_subjects_desc: "Dále bychom se měli podívat na tvé [Concept('vassals','vazaly')|E] s vládou [GetGovernment('japan_administrative_government').GetNameWithIcon]"
 ra_become_shogun_open_subjects_prompt: "Otevři záložku „$MY_REALM_WINDOW_BODY_TITLE_SUBJECTS|V$“ v panelu „#V Panství#!“ (zvýrazněno)"
 ra_become_shogun_subjects: "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_subjects_desc: "Nemůžeš se stát [Concept('shogun','šógunem')|E], dokud neodstraníš všechny zastaralé pozůstatky [Concept('government','vlády')|E] [GetGovernment('japan_administrative_government').GetNameWithIcon].\n\nPokud jsou někteří z tvých [Concept('vassals','vazalů')|E] $japan_administrative_government$, najdeš je zde a můžeš jim odebrat [Concept('titles','tituly')|E] pomocí [Concept('character_interaction','interakce s postavou')|E] $revoke_title_interaction|V$."
 ra_become_shogun_end: "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_end_desc: "Otěže moci už spočívají ve tvých rukou; stačí je jen pevně uchopit a stát se [Concept('shogun','šógunem')|E].\n\nPřijmi [GetLaw('japanese_bureaucracy_2').GetName] a země bude tvá!"
