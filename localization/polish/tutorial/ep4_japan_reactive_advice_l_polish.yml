l_polish:
 action_reactive_advice_welcome_to_japan: "Rada: Japonsko" # todo: NEW TRANSLATION
 action_reactive_advice_welcome_to_japan_desc: "V období Heianu se Japonsko vyrovnává mezi císařskými úředníky a místními válečníky. Otevřete toto pro úvod do této jedinečné politické struktury." # todo: NEW TRANSLATION
 action_reactive_advice_welcome_to_japan_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_intro: "Japonsko" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_intro_desc: "Vítejte v období Heian!\n\nV této době se Japonsko pohybuje na pomezí tradice a násilí. Ambiciózní [Concept('houses','rody')|E] soupeří o moc a kontrolu nad císařským trůnem.\n\n#TUT Předpokládáme, že už máte s hraním Crusader Kings 3 nějaké zkušenosti.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_welcome_to_japan_step_government: "Vláda" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_government_desc: "Japonsko je [Concept('realm','panství')|E] rozdělené mezi dva typy pánů.\n\n[Concept('rulers','Vládci')|E] mají jednu z těchto [Concept('government','vlády')|E] forem:\n$EFFECT_LIST_BULLET$[ritsuryo_i][Concept('ritsuryo','$japan_administrative_government$')|E] #weak (císařští úředníci)#!\n$EFFECT_LIST_BULLET$[soryo_i][Concept('soryo','$japan_feudal_government$')|E] #weak (feudální pánové)#!\n\nHistoricky váleční pánové $game_concept_soryo$ sílili, což nakonec vedlo k vládě [Concept('shogun','šógunovi')|E] v Japonsku." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_welcome_to_japan_step_open_families_tab: "$reactive_advice_welcome_to_japan_step_emperor_and_regent$" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_open_families_tab_desc: "V Japonsku se liší, kdo je považován za vládce a kdo #EMP ve skutečnosti#! vládne. Podívejme se na to teď." # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_open_families_tab_prompt: "Otevřete kartu '$administraction_tab_families|V$' v panelu '$ADMINISTRATIVE_GOVERNMENT_HEADER|V$' (zvýrazněno)" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_emperor_and_regent: "Císař a jeho regent" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_emperor_and_regent_desc: "Toto je [Concept('japanese_emperor','japonský císař')|E], známý také jako $king_tenno_male_japanese$.\n\nJeho název by naznačoval, že vládne Japonsku, ale je považován za [Concept('ceremonial_liege','obřadního panovníka')|E] a nemá skutečnou moc.\n\nNicméně sňatek do jeho rodiny stále přináší značné [Concept('prestige','prestiže')|E] a ambiciózní $king_tenno_male_japanese$ se může pokusit uchopit moc." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_welcome_to_japan_step_emperor_and_regent_2: "Císař a jeho regent" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_emperor_and_regent_2_desc: "Skutečná moc v Japonsku ale náleží [Concept('ceremonial_regent','vládnoucí regent')|E], zobrazenému zde.\n\nTato osoba je skutečným [Concept('independent','nezávislého')|E] [Concept('ruler','vládcem')|E] Japonska. Kromě běžných pravomocí jakéhokoli nezávislého vládce také určuje [Concept('imperial_policy','císařská politika')|E] [Concept('law','zákon')|E], která ovlivňuje celé [Concept('realm','panství')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_welcome_to_japan_step_manor: "$japanese_manor_domicile_type$" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_manor_desc: "Každý [Concept('house_head','hlava rodu')|E] v Japonsku má $japanese_manor_domicile_type$, který můžete rozšířit a rozvíjet pomocí [Concept('gold','zlata')|E], které vyděláte.\n\nNa rozdíl od [Concept('holdings','držav')|E] ve vašem [Concept('domain','doméně')|E] zůstává váš $japanese_manor_domicile_type$ u [Concept('house_head','hlavy rodu')|E] a není ztracen, pokud je váš [Concept('domain','doména')|E] dobyt.\n\n#I Pokud jste $game_concept_house_head$, zobrazujete a rozvíjíte svůj $japanese_manor_domicile_type$ pomocí zvýrazněného tlačítka#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_welcome_to_japan_step_house_aspirations: "Ambice rodu" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_house_aspirations_desc: "Všechny japonské [Concept('houses','rody')|E] mají [Concept('house_aspiration','aspirace rodu')|E].\n\nTento atribut ovlivňuje všechny členy rod a může být časem zlepšen tím, že [Concept('house_head','hlava rodu')|E] utratí [Concept('prestige_i','@prestige_icon!')|E][Concept('prestige','prestiž')|E].\n\n#I Jako $game_concept_house_head$ můžete své aspiraci rodu zobrazit a vylepšit pomocí zvýrazněného tlačítka." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_welcome_to_japan_step_blocs: "Bloky rodů" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_blocs_desc: "Většina [Concept('vassals','vazalů')|E] v Japonsku vládne pouze jednomu [Concept('county','hrabství')|E].\n\nAby konsolidovaly moc, většina [Concept('houses','rodů')|E] patří do [house_bloc|E], obranného spojenectví [Concept('houses','rodů')|E].\n\nČlenové $game_concept_house_bloc$ obvykle sdílejí stejnou [Concept('house_aspiration','aspiraci rodu')|E] a mají mezi sebou dobré [Concept('house_relations','vztahy rodů')|E]. Pokud tomu tak není, klesá [bloc_cohesion|E] a [leading_house|E] může rozhodnout o vyloučení kontroverzních rodů z $game_concept_bloc$.\n\n#I Pokud jste součástí $game_concept_bloc$, můžete stav svého $game_concept_bloc$ zobrazit kliknutím na zvýrazněné tlačítko.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_welcome_to_japan_step_end: "Japonsko" # todo: NEW TRANSLATION
 reactive_advice_welcome_to_japan_step_end_desc: "V Japonsku je politika vždy soubojem dvou stran. Veďte svůj [Concept('house','rod')|E] moudře a určíte budoucnost Japonska." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 action_reactive_advice_soryo_intro: "Rada: $japan_feudal_government$ Vládce" # todo: NEW TRANSLATION
 action_reactive_advice_soryo_intro_desc: "Jste vládce Soryo, místní válečný pán. Otevřete toto pro úvod do tohoto typu vlády." # todo: NEW TRANSLATION
 action_reactive_advice_soryo_intro_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 reactive_advice_soryo_intro_NAME: "$japan_feudal_government$ vláda" # todo: NEW TRANSLATION
 ra_soryo_intro: "$reactive_advice_soryo_intro_NAME$" # todo: NEW TRANSLATION
 ra_soryo_intro_desc: "Jste [GetGovernment('japan_feudal_government').GetName] [Concept('ruler','vládce')|E]: válečný pán, který vládne silou zbraní spíše než legitimní vládou císařské byrokracie." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_basics: "$reactive_advice_soryo_intro_NAME$" # todo: NEW TRANSLATION
 ra_soryo_basics_desc: "[GetGovernment('japan_feudal_government').GetName] [Concept('government','Vláda')|E] je velmi podobný [GetGovernment('feudal_government').GetName] $game_concept_government$, který se nachází mimo Japonsko.\n\nNicméně v Heian Japonsku je rozšiřování vašeho [Concept('realm','panství')|E] prostřednictvím [Concept('war','války')|E] považováno za [Concept('crime','zločin')|E]. V důsledku toho vám může váš [Concept('top_liege','nejvyšší lenní pán')|E] svobodně odejmout vaše [Concept('titles','tituly')|E].\n\nAby vám váš $game_concept_top_liege$ neodňal, co jste si právem vydobyli, měli byste se ujistit, že jste součástí [house_bloc|E]. Pokud váš $game_concept_top_liege$ vyhlásí $game_concept_war$ proti vám, [Concept('houses','rodům')|E] vašeho $game_concept_bloc$ se k vám připojí jako [Concept('allies','spojenci')|E].\n\n#I Pokud jste již součástí $game_concept_bloc$, můžete jej vybrat pomocí zvýrazněného tlačítka.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_open_decisions: "$reactive_advice_soryo_intro_NAME$" # todo: NEW TRANSLATION
 ra_soryo_open_decisions_desc: "Vrcholným cílem každého [GetGovernment('japan_feudal_government').GetName] [Concept('ruler','vládce')|E] je stát se [Concept('shogun','šógunem')|E], vojenským a dědičným vládcem Japonska.\n\nK dosažení toho existují dva klíčové [Concept('decisions','rozhodnutí')|E], které můžete podniknout. Podívejme se na ně nyní." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_open_decisions_prompt: "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$" # todo: NEW TRANSLATION
 ra_soryo_regional_dominion: "$reactive_advice_soryo_intro_NAME$" # todo: NEW TRANSLATION
 ra_soryo_regional_dominion_desc: "Prvním [Concept('decision','rozhodnutím')|E], na který byste se měli zaměřit, je '$tgp_japan_assert_regional_dominion_government_decision|V$'.\n\nTo vám umožní dobýt [Concept('duchy','vévodství')|E] vaší místní oblasti. Ačkoliv to není nutné k tomu, abyste se stal [Concept('shogun','šógun')|E], je to užitečný mezikrok.\n\n#TUT Pokud jste již [Concept('duke','vévoda')|E] [Concept('rank','hodnost')|E], toto $game_concept_decision$ není dostupné.#!" # todo: CONCEPT CASE
 ra_soryo_shogunate: "$reactive_advice_soryo_intro_NAME$" # todo: NEW TRANSLATION
 ra_soryo_shogunate_desc: "Skutečným [Concept('decision','rozhodnutími')|E] pro stát se [Concept('shogun','šógunem')|E] je '$tgp_japan_become_shogun_decision_TUTORIAL|V$'.\n\nNicméně abyste o tom mohli vůbec začít uvažovat, musíte být nejprve [Concept('ceremonial_regent','vládnoucí regent')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_intro_open_factions: "$reactive_advice_soryo_intro_NAME$" # todo: NEW TRANSLATION
 ra_soryo_intro_open_factions_desc: "Abyste se stal [Concept('ceremonial_regent','vládnoucí regent')|E], musíte založit [Concept('faction','frakce')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_intro_open_factions_prompt: "Otevřete kartu '$factions_tab_my_factions|V$' v panelu '$FACTIONS_WINDOW|V$'" # todo: NEW TRANSLATION
 ra_soryo_intro_install_regent_faction: "$reactive_advice_soryo_intro_NAME$" # todo: NEW TRANSLATION
 ra_soryo_intro_install_regent_faction_desc: "Aby se stal [Concept('ceremonial_regent','vládnoucí regent')|E], musíte vytvořit $replace_ceremonial_regent_faction_name|V$ [Concept('faction','frakce')|E] a úspěšně vynutit svá požadavky.\n\nJako [leading_house|E] se k vám připojí všechny [Concept('houses','rody')|E] vašeho $game_concept_bloc$ v frakcích. Čím silnější je vojenská moc vašeho $game_concept_bloc$, tím pravděpodobněji $game_concept_faction$ uspěje.\n\nTaké musíte zajistit, aby [cohesion|E] byla dostatečně vysoká, jinak nemůžete $game_concept_faction$ ani založit." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_end: "$reactive_advice_soryo_intro_NAME$" # todo: NEW TRANSLATION
 ra_soryo_end_desc: "Jako [GetGovernment('japan_feudal_government').GetName] [Concept('ruler','vládce')|E] vede vaše cesta k [Concept('shogun','šógunovi')|E] skrze meč.\n\nKonsolidujte místní moc, vytvořte s vaším [house_bloc|E] [Concept('faction','frakcemi')|E] a možná jednoho dne budete vládnout jako $game_concept_shogun$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 action_reactive_advice_lead_your_soryo_bloc_NAME: "Vedení vašeho $game_concept_house_bloc$" # todo: NEW TRANSLATION
 action_reactive_advice_lead_your_soryo_bloc: "Rada: $action_reactive_advice_lead_your_soryo_bloc_NAME$" # todo: NEW TRANSLATION
 action_reactive_advice_lead_your_soryo_bloc_desc: "Jste $game_concept_house_head$ $game_concept_leading_house$ ve vašem $game_concept_bloc$. Otevřete toto, abyste se naučili řídit svůj $game_concept_bloc$." # todo: NEW TRANSLATION
 action_reactive_advice_lead_your_soryo_bloc_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_intro: "$action_reactive_advice_lead_your_soryo_bloc_NAME$" # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_intro_desc: "Jste [Concept('house_head','hlava rodu')|E] [leading_house|E] ve svém [house_bloc|E], výborně!\n\nJako vůdce vašeho $game_concept_bloc$ již není jen štítem, ale také cestou k vytvoření mocné [Concept('faction','frakci')|E], která vás dosadí jako [Concept('ceremonial_regent','vládnoucí regent')|E]!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_bloc_leader_open_bloc: "$action_reactive_advice_lead_your_soryo_bloc_NAME$" # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_open_bloc_desc: "Pojďme si prohlédnout váš [house_bloc|E]." # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_open_bloc_prompt: "Vyberte svůj $game_concept_bloc$ (zvýrazněno)" # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_strength_intro: "$action_reactive_advice_lead_your_soryo_bloc_NAME$" # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_strength_intro_desc: "[Concept('houses','Rody')|E] ve vašem [bloc|E] se připojí k [leading_house|E], když zahájí [Concept('factions','frakce')|E].\n\nPokud si přejete stát se [Concept('ceremonial_regent','vládnoucím regentem')|E], a nakonec [Concept('shogun','šógun')|E], připojí se k vašemu $replace_ceremonial_regent_faction_name|V$ $game_concept_faction$!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_bloc_leader_strength_details: "$action_reactive_advice_lead_your_soryo_bloc_NAME$" # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_strength_details_desc: "Síla všech členů [bloc|E] je zde zobrazena.\n\nČím silnější je váš $game_concept_bloc$, tím pravděpodobněji bude vaše [Concept('faction','frakce')|E] schopna vynutit své požadavky a dosadit vás jako [Concept('ceremonial_regent','vládnoucí regent')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_bloc_leader_expanding: "$action_reactive_advice_lead_your_soryo_bloc_NAME$" # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_expanding_desc: "Silný [bloc|E] má mnoho a mocných [Concept('houses','rodů')|E].\n\nNa mapě můžete vidět rozsah všech $game_concept_blocs$ a najít jakékoliv [Concept('house_heads','hlavy rodu')|E], které nemají $game_concept_bloc$. Můžete se je pokusit přesvědčit, aby se přidali do vašeho $game_concept_bloc$, pomocí $invite_to_house_bloc_interaction|V$ [Concept('character_interaction','interakce s postavou')|E].\n\nNicméně nemusí vždy souhlasit... Místo toho, jako [GetGovernment('japan_feudal_government').GetName] [Concept('ruler','vládce')|E], můžete rozšířit svůj $game_concept_bloc$ prostřednictvím [Concept('war','války')|E].\n\nMáte dvě různé možnosti:\n$EFFECT_LIST_BULLET$[Concept('bloc_expansion','Rozšíření bloku')|E] vám umožní dobýt území, které se dostane pod kontrolu vašeho $game_concept_bloc$.\n$EFFECT_LIST_BULLET$[Concept('bloc_supremacy','Nadvláda bloku')|E] je totální válka mezi dvěma $game_concept_blocs$, kde se členové poraženého $game_concept_bloc$ mohou přidat k vítězi." # todo: CONCEPT CASE
 ra_soryo_bloc_leader_cohesion: "$action_reactive_advice_lead_your_soryo_bloc_NAME$" # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_cohesion_desc: "Snahy o sjednocení různorodých [Concept('houses','rody')|E] do velkého [bloc|E] přinášejí výzvy, protože každý $game_concept_house$ přispívá k celkové [cohesion|E] $game_concept_bloc$.\n\nKromě bonusů, které poskytuje vysoké $game_concept_cohesion$, potřebujete určité množství $game_concept_cohesion$, abyste vůbec mohli vytvořit [Concept('faction','frakce')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_bloc_leader_cohesion_2: "$action_reactive_advice_lead_your_soryo_bloc_NAME$" # todo: NEW TRANSLATION
 ra_soryo_bloc_leader_cohesion_2_desc: "Chcete-li zlepšit [cohesion|E] určitého [Concept('house','rodu')|E], nejprve zajistěte, že sdílíte stejnou [Concept('house_aspiration','aspiraci rodu')|E], použitím $demand_aspiration_change_interaction|V$ [Concept('character_interaction','interakce s postavou')|E] na jeho [Concept('house_head','hlavu rodu')|E].\n\nI tak $game_concept_cohesion$ hlavně vychází z dobrých [Concept('house_relations','vztahů rodů')|E] mezi všemi rody v [bloc|E]. Vztahy rodů lze zlepšit například zařizováním sňatků s členy rod.\n\nPokud všechny ostatní možnosti selžou, můžete prostě použít $kick_from_house_bloc_interaction|V$ interakce s postavou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_soryo_bloc_end: "$action_reactive_advice_lead_your_soryo_bloc_NAME$" # todo: NEW TRANSLATION
 ra_soryo_bloc_end_desc: "Jako vůdce vašeho [bloc|E] zajistěte, aby rostl v čase dobýváním více území prostřednictvím [Concept('war','války')|E].\n\nSe silným $game_concept_bloc$ s vysokou [cohesion|E] budete připraveni vytvořit své $replace_ceremonial_regent_faction_name|V$ [Concept('faction','frakce')|E]!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_soryo_regent_become_shogun_NAME: "Založit $empire_shogunate_japanese$" # todo: NEW TRANSLATION
 action_reactive_advice_soryo_regent_become_shogun: "Rada: $reactive_advice_soryo_regent_become_shogun_NAME$" # todo: NEW TRANSLATION
 action_reactive_advice_soryo_regent_become_shogun_desc: "Jste $game_concept_ceremonial_regent$. Otevřete toto, abyste se naučili, jak dále konsolidovat svou moc a stát se šógunem." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 action_reactive_advice_soryo_regent_become_shogun_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 ra_become_shogun_intro: "Rada: $reactive_advice_soryo_regent_become_shogun_NAME$" # todo: NEW TRANSLATION
 ra_become_shogun_intro_desc: "Jste [Concept('ceremonial_regent','vládnoucí regent')|E] Japonska a jeho de facto [Concept('ruler','vládce')|E]. Jako [Concept('shogun','šógun')|E] byste však měli ještě větší moc a kontrolu!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_become_shogun_open_decisions: "$reactive_advice_soryo_regent_become_shogun_NAME$" # todo: NEW TRANSLATION
 ra_become_shogun_open_decisions_desc: "Abyste se stal [Concept('shogun','šógun')|E], existují určité požadavky, které musíte splnit. Podívejme se na ně nyní." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_become_shogun_open_decisions_prompt: "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$" # todo: NEW TRANSLATION
 ra_become_shogun_decision: "$reactive_advice_soryo_regent_become_shogun_NAME$" # todo: NEW TRANSLATION
 ra_become_shogun_decision_desc: "'$tgp_japan_become_shogun_decision_TUTORIAL|V$' je [Concept('decision','rozhodnutí')|E], kterou musíte vykonat, abyste se stal [Concept('shogun','šógun')|E].\n\nK tomu je však potřeba překonat tři hlavní překážky:\n$EFFECT_LIST_BULLET$Schválit [GetLaw('japanese_bureaucracy_2').GetName] [Concept('law','zákon')|E]\n$EFFECT_LIST_BULLET$Vaše [Concept('prestige_level','úroveň slávy')|E] je [prestige_i][GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L] nebo vyšší\n$EFFECT_LIST_BULLET$Vaše [Concept('legitimacy_level','úroveň legitimity')|E] je větší nebo rovna #V 4#!" # todo: CONCEPT CASE
 ra_become_shogun_open_laws: "$reactive_advice_soryo_regent_become_shogun_NAME$" # todo: NEW TRANSLATION
 ra_become_shogun_open_laws_desc: "Nejprve si prohlédneme stav vašich [Concept('laws','zákonů')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_become_shogun_open_laws_prompt: "Otevřete kartu '$MY_REALM_WINDOW_BODY_TITLE_LAWS|V$' v panelu '#V Realm#!' (zvýrazněno)" # todo: NEW TRANSLATION
 ra_become_shogun_laws: "$reactive_advice_soryo_regent_become_shogun_NAME$" # todo: NEW TRANSLATION
 ra_become_shogun_laws_desc: "Zde můžete postupně zavést přísnější administrativu. Abyste se stal [Concept('shogun','šógun')|E], potřebujete minimálně [GetLaw('japanese_bureaucracy_2').GetName] [Concept('law','zákon')|E].\n\nMějte na paměti, že to stojí [Concept('prestige','prestiž')|E] a snižuje [Concept('opinion','mínění')|E], které k vám mají [Concept('vassals','vazalové')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_become_shogun_open_subjects: "$reactive_advice_soryo_regent_become_shogun_NAME$" # todo: NEW TRANSLATION
 ra_become_shogun_open_subjects_desc: "Dále bychom se měli podívat na vaše [GetGovernment('japan_administrative_government').GetNameWithIcon] [Concept('vassals','vazalové')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_become_shogun_open_subjects_prompt: "Otevřete kartu '$MY_REALM_WINDOW_BODY_TITLE_SUBJECTS|V$' v panelu '#V Realm#!' (zvýrazněno)" # todo: NEW TRANSLATION
 ra_become_shogun_subjects: "$reactive_advice_soryo_regent_become_shogun_NAME$" # todo: NEW TRANSLATION
 ra_become_shogun_subjects_desc: "Nemůžete se stát [Concept('shogun','šógun')|E], pokud nezbavíte zbytky zastaralého [GetGovernment('japan_administrative_government').GetNameWithIcon] [Concept('government','vlády')|E].\n\nPokud jsou někteří z vašich [Concept('vassals','vazalů')|E] $japan_administrative_government$, můžete je zde najít a odebrat jim jejich [Concept('titles','tituly')|E] pomocí $revoke_title_interaction|V$ [Concept('character_interaction','interakce s postavou')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_become_shogun_end: "$reactive_advice_soryo_regent_become_shogun_NAME$" # todo: NEW TRANSLATION
 ra_become_shogun_end_desc: "Otěže moci již spočívají ve vašich rukou; stačí je pevně uchopit a stanete se [Concept('shogun','šógunem')|E].\n\nVyžeňte slabé [GetGovernment('japan_administrative_government').GetName] [Concept('rulers','vládci')|E] a schválíte [GetLaw('japanese_bureaucracy_2').GetName] a země bude vaše!„" # todo: NEW TRANSLATION # todo: CONCEPT CASE
