l_polish:
 action_lesson_tgp_playtest_intro_mandala: "Vláda mandaly"
 action_lesson_tgp_playtest_intro_mandala_desc: "Mandala je zvláštní vláda zaměřená na zbožnost a tributáře. Otevři toto a získáš úvod do této vlády."
 action_lesson_tgp_playtest_intro_mandala_click: "$click_to_open_lesson$"
 lesson_tgp_playtest_intro_mandala_step_intro: "Mandala"
 lesson_tgp_playtest_intro_mandala_step_intro_desc: "Jsi [Concept('mandala','mandalový')|E] [Concept('ruler','vládce')|E]!\n\n$game_concept_mandala$ je zvláštní [Concept('government','vláda')|E] v jihovýchodní Asii zaměřená na víru a [Concept('piety','zbožnost')|E]."
 lesson_tgp_playtest_intro_mandala_step_government: "Vláda mandaly"
 lesson_tgp_playtest_intro_mandala_step_government_desc: "Tvá mocenská základna vychází z proměnlivější sítě [Concept('tributaries','tributářů')|E] a jen několika trvalejších [Concept('vassals','vazalů')|E].\n\nTo znamená, že můžeš „krást“ tributáře jiným [Concept('mandala','mandalovým')|E] [Concept('ruler','vládcům')|E], například použitím [Concept('character_interaction','interakce s postavou')|E] $offer_tributary_status_interaction|V$.\n\nNáboženství hraje ve [Concept('mandala_government','vládě mandaly')|E] také ústřední roli. Abys mohl provádět mnoho úkonů zásadních pro tuto vládu, musíš utrácet [Concept('piety','zbožnost')|E]."
 lesson_tgp_playtest_intro_mandala_step_temple_complex: "Chrámový komplex"
 lesson_tgp_playtest_intro_mandala_step_temple_complex_desc: "Kromě toho musíš ve svém [Concept('capital','hlavním sídle')|E] vylepšovat [Concept('great_building','velkolepou budovu')|E] chrámového komplexu, abys zvýšil omezení velikosti svého [Concept('realm','panství')|E].\n\nTo se provádí zahájením [Concept('great_project','velkého projektu')|E]. Může to být poměrně drahé, ale pokud tvoji [Concept('subjects','subjekti')|E] přidají vlastní [Concept('great_project_contributions','příspěvky')|E], nemusíš platit plnou cenu.\n\n#I Velké projekty můžeš zahájit na záložce velkých projektů v panelu „$DECISIONS_VIEW_TITLE$“.#!"
 lesson_tgp_playtest_intro_mandala_step_mandala_aspect: "Aspekt mandaly"
 lesson_tgp_playtest_intro_mandala_step_mandala_aspect_desc: "Jako [Concept('mandala','mandalová')|E] [Concept('house_head','hlava rodu')|E] má tvůj [Concept('house','rod')|E] [Concept('mandala_aspect','aspekt mandaly')|E], který se podobá [Concept('powerful_family_attribute','atributu mocné rodiny')|E] v Byzantské říši.\n\nTento atribut neovlivňuje tvého [Concept('liege','lenního pána')|E], pokud nějakého máš, a časem jej lze vylepšovat utrácením [Concept('piety','zbožnosti')|E] a [Concept('prestige','prestiže')|E]."
 lesson_tgp_playtest_intro_mandala_step_end: "Vláda mandaly"
 lesson_tgp_playtest_intro_mandala_step_end_desc: "Velký [Concept('mandala','mandalový')|E] [Concept('ruler','vládce')|E] spoléhá na [Concept('piety','zbožnost')|E], [Concept('tributaries','tributáře')|E] a sílu svého [Concept('mandala_aspect','aspektu mandaly')|E]. Ovládni je a tvůj vliv se rozšíří po celé jihovýchodní Asii."
