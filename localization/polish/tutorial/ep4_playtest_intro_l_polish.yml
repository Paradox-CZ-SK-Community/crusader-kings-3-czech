l_polish:
 action_lesson_tgp_playtest_intro_mandala: "Mandalská vláda" # todo: NEW TRANSLATION
 action_lesson_tgp_playtest_intro_mandala_desc: "Mandala je speciální vláda zaměřená na zbožnost a tributáře. Otevřete toto pro úvod do této vlády." # todo: NEW TRANSLATION
 action_lesson_tgp_playtest_intro_mandala_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 lesson_tgp_playtest_intro_mandala_step_intro: "Mandala" # todo: NEW TRANSLATION
 lesson_tgp_playtest_intro_mandala_step_intro_desc: "Jste [Concept('mandala','mandala')|E] [Concept('ruler','vládce')|E]!\n\nMandala je speciální [Concept('government','vláda')|E] v jihovýchodní Asii zaměřený na víru a [Concept('piety','zbožnost')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_tgp_playtest_intro_mandala_step_government: "Mandalská vláda" # todo: NEW TRANSLATION
 lesson_tgp_playtest_intro_mandala_step_government_desc: "Vaše moc vychází z pružnější sítě [Concept('tributaries','tributáři')|E], s pouze několika trvalejšími [Concept('vassals','vazaly')|E].\n\nTo znamená, že můžete 'ukrást' tributáře jiného mandalového [Concept('ruler','vládce')|E], například použitím $offer_tributary_status_interaction|V$ [Concept('character_interaction','interakce s postavou')|E].\n\nNáboženství také hraje centrální roli v [Concept('mandala_government','vládě mandaly')|E]. K provedení mnoha akcí zásadních pro vládu musíte utrácet [Concept('piety','zbožnost')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_tgp_playtest_intro_mandala_step_temple_complex: "Chrámový komplex" # todo: NEW TRANSLATION
 lesson_tgp_playtest_intro_mandala_step_temple_complex_desc: "Kromě toho, abyste zvýšili limity velikosti svého [Concept('realm','panství')|E], musíte v hlavním městě [Concept('capital','hlavním sídle')|E] vylepšit svůj Chrámový komplex [Concept('great_building','velkolepá budova')|E].\n\nTo se provádí zahájením [Concept('great_project','velkým projektem')|E]. To může být poměrně drahé, ale pokud vaši [subjects|E] přidají své vlastní [Concept('great_project_contributions','příspěvky')|E], nemusíte platit celou částku.\n\n#I Velké projekty můžete zahájit na kartě Velké projekty v panelu '$DECISIONS_VIEW_TITLE$'.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_tgp_playtest_intro_mandala_step_mandala_aspect: "Aspekt Mandaly" # todo: NEW TRANSLATION
 lesson_tgp_playtest_intro_mandala_step_mandala_aspect_desc: "Jako [Concept('mandala','mandala')|E] [Concept('house_head','hlava rodu')|E] má váš [Concept('house','rod')|E] [Concept('mandala_aspect','aspekt mandaly')|E], což je podobné [Concept('powerful_family_attribute','atribut mocné rodiny')|E] v Byzantské říši.\n\nTento atribut neovlivňuje vašeho [Concept('liege','lenního pána')|E], pokud ho máte, a lze ho vylepšovat v průběhu času utrácením [Concept('piety','zbožností')|E] a [Concept('prestige','prestiž')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_tgp_playtest_intro_mandala_step_end: "Mandalská vláda" # todo: NEW TRANSLATION
 lesson_tgp_playtest_intro_mandala_step_end_desc: "Velký [Concept('mandala','mandala')|E] [Concept('ruler','vládce')|E] spoléhá na [Concept('piety','zbožnost')|E], [tributaries|E] a sílu svého [Concept('mandala_aspect','aspektu mandaly')|E]. Ovládněte to a váš vliv se rozšíří po jihovýchodní Asii." # todo: NEW TRANSLATION # todo: CONCEPT CASE
