l_polish:
 reactive_advice_struggle: "Sváry"
 action_reactive_advice_struggle: "Rada: Sváry"
 action_reactive_advice_struggle_desc: "Můžeš se účastnit sváru. Otevři toto a dozvíš se více o tom, co to pro tebe znamená."
 action_reactive_advice_struggle_click: "$click_to_open_lesson$"
 lessons_struggle_introduction: "Sváry"
 lessons_struggle_introduction_desc: "Nyní jsi součástí [Concept('struggle','sváru')|E]!\n\n[struggle_struggles|E] jsou vleklé konflikty v rámci [Concept('region','oblasti')|E], kde činy všech účastníků mění stav dané oblasti a určují různé [struggle_phase_phases|E]. Změny stavu oblasti s sebou přinesou účinky na [war|E], [faith|E] a [culture|E].\n\nNakonec všichni účastníci soupeří o to, kdo rozhodne, jak [struggle|E] skončí, což ovlivní všechny účastníky v oblasti."
 reactive_advice_struggle_introduction: "$lessons_struggle_introduction$"
 lessons_struggle_region_open: "Oblast sváru"
 lessons_struggle_region_open_desc: "[Concept('struggle_region','Oblast sváru')|E] je vyznačena novou hranicí, která se zvýrazní, když najedeš na tlačítko sváru. [Concept('struggle','Sváru')|E] se účastní pouze postavy vlastnící zemi v této oblasti.\n\n#TUT [characters|E] mimo oblast se mohou připojit ke [Concept('struggle','sváru')|E] tím, že získají země v [Concept('struggle_region','oblasti sváru')|E] a přesunou své [Concept('capital','hlavní sídlo')|E] do této oblasti.#!"
 lessons_struggle_view_open: "Otevření přehledu sváru"
 lessons_struggle_view_open_desc: "Zde můžeš otevřít přehled [Concept('struggle','sváru')|E], místo, kde si můžeš prohlédnout všechny informace týkající se [Concept('struggle','sváru')|E]."
 lessons_struggle_view_open_prompt: "Otevři přehled [Concept('struggle','sváru')|E]"
 lessons_struggle_view: "Přehled sváru"
 lessons_struggle_view_desc: "V přehledu sváru se můžeš dozvědět více o současné [Concept('struggle_phase','fázi sváru')|E] a jejích účincích. Můžeš si také prohlédnout možné další fáze a [struggle_catalyst_catalysts|E], které musíš dokončit, abys [Concept('struggle','svár')|E] posunul k nim."
 lessons_struggle_current_phases_and_effects: "Současné fáze a účinky"
 lessons_struggle_current_phases_and_effects_desc: "Současná [Concept('struggle_phase','fáze sváru')|E] ovlivňuje celou [Concept('struggle_region','oblast sváru')|E] a uplatňuje zvláštní účinky na [struggle_involved|E], [struggle_interloper|E] a [struggle_uninvolved|E] účastníky.\n\nV této části si můžeš prohlédnout účinky fáze na [war|E], [faith|E], [culture|E] a další účinky."
 lessons_next_struggle_phases: "Další fáze sváru"
 lessons_next_struggle_phases_desc: "Současná [Concept('struggle_phase','fáze sváru')|E] skončí, jakmile jedna z možných dalších fází dosáhne pokroku [GetDefine('NStruggle', 'POINT_BASED_PHASE_DEFAULT_DURATION')]. Chceš-li zvýšit pokrok kterékoli z možných dalších fází, musíš dokončit některý z [Concept('struggle_catalyst_catalysts','katalyzátorů sváru')|E] uvedených pod nimi.\n\n#TUT Prozkoumej kteroukoli z možných dalších fází a dozvíš se o ní více, včetně jejích účinků a nedávného pokroku [Concept('struggle_catalyst','katalyzátorů sváru')|E]. Jejich výběrem otevřeš seznam [Concept('struggle_catalyst','katalyzátorů sváru')|E], které můžeš ty nebo jiní [Concept('struggle_involved','zapojení')|E] účastníci [Concept('struggle','sváru')|E] dokončovat neomezeněkrát.#!"
 lessons_ending_struggle_open: "Ukončení sváru"
 lessons_ending_struggle_open_desc: "[Concept('struggle','Svár')|E] bude měnit fáze, dokud některý účastník nespustí jedno z rozhodnutí o ukončení a [Concept('struggle','svár')|E] neukončí. Rozhodnutí o ukončení si můžeš kdykoli prohlédnout a zkontrolovat jejich požadavky a účinky."
 lessons_ending_struggle_open_prompt: "Otevři rozhodnutí o ukončení"
 lessons_ending_struggle: "Ukončení sváru"
 lessons_ending_struggle_desc: "Zde vidíš všechna rozhodnutí o ukončení [Concept('struggle','sváru')|E].\n\nMěj na paměti, že každé rozhodnutí o ukončení vyžaduje, abys byl v určité fázi, než je bude možné spustit. Pokud bude některé z nich dostupné, budeš upozorněn."
 lessons_explore_struggle_open: "Prozkoumat svár"
 lessons_explore_struggle_open_desc: "Nyní znáš všechny základy a jsi připraven na svůj první [Concept('struggle','svár')|E].\n\nDobrým začátkem je prohlédnout si účinky současné fáze a možné další fáze, k nimž bys mohl chtít směřovat."
 lessons_struggle_involvement_view_open: "Zapojení do sváru"
 lessons_struggle_involvement_view_open_desc: "Ve [Concept('struggle','sváru')|E] mohou všechny [Concept('characters','postavy')|E] v oblasti spouštět [Concept('struggle_catalyst_catalysts','katalyzátory sváru')|E]. Proto je důležité vědět, kdo jsou [Concept('struggle_involved','zapojení')|E] a [Concept('struggle_interloper','vměšující se')|E] účastníci. Přehled zapojení do [Concept('struggle','sváru')|E] o tom poskytuje informace."
 lessons_struggle_involvement_view_open_prompt: "Otevři přehled zapojení do sváru"
 lessons_struggle_involvement_view: "Zapojení do sváru"
 lessons_struggle_involvement_view_desc: "Zde vidíš informace o svém zapojení spolu s rozpisem toho, co z tebe činí [Concept('struggle_involved','zapojeného')|E], [Concept('struggle_interloper','vměšujícího se')|E] nebo [Concept('struggle_uninvolved','nezapojeného')|E].\n\nKromě svého osobního zapojení zde vidíš seznam účastníků [Concept('struggle','sváru')|E] a jejich zapojení. Najdeš zde také [Concept('struggle_involved_cultures','zapojené kultury')|E] a [Concept('struggle_involved_faiths','zapojené víry')|E].\n\n#TUT Znát zapojení ostatních hráčů je důležité při plánování, které katalyzátory budeš chtít sledovat, protože katalyzátory tě mohou vést k tomu, abys zacílil na jiného účastníka [Concept('struggle','sváru')|E], [Concept('faith','víru')|E] nebo [Concept('culture','kulturu')|E].#!"
