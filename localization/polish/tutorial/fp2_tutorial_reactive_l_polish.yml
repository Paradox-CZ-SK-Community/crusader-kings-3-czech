l_polish:
 reactive_advice_struggle: "Konflikty"
 action_reactive_advice_struggle: "Rada: Konflikty"
 action_reactive_advice_struggle_desc: "Můžete se zapojit do [Concept('struggle','sváru')|E]. Otevřete toto, abyste se dozvěděli více o tom, co to pro vás znamená." # todo: CONCEPT CASE
 action_reactive_advice_struggle_click: "$click_to_open_lesson$"
 lessons_struggle_introduction: "Konflikty"
 lessons_struggle_introduction_desc: "Nyní jste součástí [Concept('struggle','svárem')|E]!\n\n[Concept('struggle_struggles','Sváry')|E] jsou dlouhotrvající konflikty v rámci [Concept('region','regionu')|E], kde činy všech účastníků změní stav oblasti a nastaví různé [Concept('struggle_phase_phases','fáze')|E]. Změny stavu regionu přinesou dopady na [Concept('war','válku')|E], [Concept('faith','víru')|E] a [Concept('culture','kultura')|E].\n\nNakonec všichni účastníci soupeří o to, kdo rozhodne, jak [Concept('struggle','svár')|E] skončí, což ovlivní všechny účastníky v regionu." # todo: CONCEPT CASE
 reactive_advice_struggle_introduction: "$lessons_struggle_introduction$"
 lessons_struggle_region_open: "Region konfliktu"
 lessons_struggle_region_open_desc: "[Concept('struggle_region','Oblast sváru')|E] je vyznačen novým obrysem, který se zvýrazní, když najeďte myší na tlačítko Struggle. Do [Concept('struggle','sváru')|E] se zapojují pouze postavy, které vlastní půdu v regionu.\n\n#TUT [Concept('characters','Postavy')|E] mimo region se mohou k [Concept('struggle','sváru')|E] připojit získáním pozemků v [Concept('struggle_region','oblasti sváru')|E] a přemístěním svého [Concept('capital','hlavního sídla')|E] do oblasti.#!" # todo: CONCEPT CASE
 lessons_struggle_view_open: "Přístup do zobrazení konfliktu"
 lessons_struggle_view_open_desc: "Zde můžete otevřít zobrazení [Concept('struggle','svár')|E], místo, kde můžete prohlédnout všechny informace týkající se [Concept('struggle','svárem')|E]." # todo: CONCEPT CASE
 lessons_struggle_view_open_prompt: "Otevřít zobrazení [Concept('struggle','svár')|E]" # todo: CONCEPT CASE
 lessons_struggle_view: "Zobrazení konfliktu"
 lessons_struggle_view_desc: "Ve Zobrazení konfliktu se můžete dozvědět více o aktuální [Concept('struggle_phase','fázi sváru')|E] a jejích účincích. Můžete také zobrazit možné následující fáze a [Concept('struggle_catalyst_catalysts','katalyzátory')|E], které musíte dokončit, aby se [Concept('struggle','svárem')|E] posunul směrem k nim." # todo: CONCEPT CASE
 lessons_struggle_current_phases_and_effects: "Aktuální fáze a účinky"
 lessons_struggle_current_phases_and_effects_desc: "Současná [Concept('struggle_phase','fáze sváru')|E] ovlivňuje celý [Concept('struggle_region','oblast sváru')|E] a uplatňuje speciální účinky na účastníky, kteří jsou [Concept('struggle_involved','zapojený')|E], [Concept('struggle_interloper','vetřelec')|E] a [Concept('struggle_uninvolved','nezapojený')|E].\n\nV této sekci můžete zkontrolovat účinky fáze na [Concept('war','válku')|E], [Concept('faith','víru')|E], [Concept('culture','kulturu')|E] a další dopady." # todo: CONCEPT CASE
 lessons_next_struggle_phases: "Následující fáze konfliktu"
 lessons_next_struggle_phases_desc: "Aktuální [Concept('struggle_phase','fáze sváru')|E] skončí, když jedna z potenciálních následujících fází dosáhne [GetDefine('NStruggle', 'POINT_BASED_PHASE_DEFAULT_DURATION')] postupu. Pro zvýšení postupu kterékoliv z potenciálních následujících fází musíte dokončit některé [Concept('struggle_catalyst_catalysts','katalyzátory')|E] uvedené pod nimi.\n\n#TUT Prohlédněte si jakékoli potenciální následující fáze, abyste se dozvěděli více o nich, jejich účincích a nedávném postupu [Concept('struggle_catalyst','katalyzátoru sváru')|E]. Výběrem se otevře seznam [Concept('struggle_catalyst','katalyzátor sváru')|E], které můžete vy nebo jiní [Concept('struggle_involved','zapojení')|E] účastníci v [Concept('struggle','sváru')|E] dokončit neomezeněkrát.#!" # todo: CONCEPT CASE
 lessons_ending_struggle_open: "Ukončení konfliktu"
 lessons_ending_struggle_open_desc: "[Concept('struggle','Svár')|E] bude nadále procházet fázemi, dokud některý účastník nespustí jedno z Konečných rozhodnutí a [Concept('struggle','svár')|E] neukončí. Vždy můžete zkontrolovat Konečná rozhodnutí, abyste zjistili požadavky a účinky." # todo: CONCEPT CASE
 lessons_ending_struggle_open_prompt: "Otevřít Konečná rozhodnutí"
 lessons_ending_struggle: "Ukončení konfliktu"
 lessons_ending_struggle_desc: "Zde můžete vidět všechna Konečná rozhodnutí pro [Concept('struggle','svár')|E].\n\nMějte na paměti, že každé Konečné rozhodnutí vyžaduje, abyste byli v určité fázi, abyste ho mohli spustit. Budete upozorněni, pokud bude některé z nich dostupné." # todo: CONCEPT CASE
 lessons_explore_struggle_open: "Prozkoumejte konflikt"
 lessons_explore_struggle_open_desc: "Nyní znáte všechny základy a jste připraveni na svůj první [Concept('struggle','svár')|E].\n\nDobré místo, kde začít, je prohlédnout účinky aktuální fáze a potenciální následující fáze, na které byste se mohli zaměřit." # todo: CONCEPT CASE
 lessons_struggle_involvement_view_open: "Zapojení do konfliktu"
 lessons_struggle_involvement_view_open_desc: "V [Concept('struggle','sváru')|E] mohou všichni [Concept('characters','postavy')|E] v regionu spouštět [Concept('struggle_catalyst_catalysts','katalyzátory')|E]. Proto je důležité vědět, kdo jsou účastníci [struggle_involved] a [struggle_interloper]. Zobrazení zapojení do [Concept('struggle','sváru')|E] nabízí informace o tom." # todo: CONCEPT CASE
 lessons_struggle_involvement_view_open_prompt: "Otevřít zobrazení zapojení do konfliktu"
 lessons_struggle_involvement_view: "Zapojení do konfliktu"
 lessons_struggle_involvement_view_desc: "Zde uvidíte informace o vašem zapojení a rozpis toho, co vás činí [Concept('struggle_involved','zapojený')|E], [Concept('struggle_interloper','vetřelec')|E] nebo [Concept('struggle_uninvolved','nezapojený')|E].\n\nKromě vašeho osobního zapojení můžete vidět seznam účastníků [Concept('struggle','sváru')|E] a jejich zapojení. Zde také naleznete [Concept('struggle_involved_cultures','zapojené kultury')|E] a [Concept('struggle_involved_faiths','zapojené víry')|E].\n\n#TUT Znalost zapojení ostatních hráčů je důležitá při plánování, které katalyzátory byste mohli sledovat, protože katalyzátory mohou vyzvat k zacílení na jiného účastníka [Concept('struggle','svár')|E], [Concept('faith','víru')|E] nebo [Concept('culture','kultura')|E].#!" # todo: CONCEPT CASE
