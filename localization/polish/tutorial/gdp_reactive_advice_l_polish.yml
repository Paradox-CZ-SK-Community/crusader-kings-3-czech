 reactive_advice_company_direction_intro: "$REACTIVE_ADVICE_COMPANY_DIRECTION$" # todo: NEW TRANSLATION
 reactive_advice_company_direction_intro_desc: "Ne všichni [Concept('merchants','kupci')|E] mají stejné cíle. [Concept('gold','Zlato')|E] sice samo o sobě znamená moc, ale někteří dávají přednost rodině a urozenosti." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_company_direction_open_house: "$REACTIVE_ADVICE_COMPANY_DIRECTION$" # todo: NEW TRANSLATION
 reactive_advice_company_direction_open_house_desc: "Vaše [Concept('company_direction','$game_concept_company_sentiment$')|E] je součástí vašeho [Concept('house','rodu')|E], pojďme se na něj tedy podívat." # todo: NEW TRANSLATION # todo: CONCEPT CASE
