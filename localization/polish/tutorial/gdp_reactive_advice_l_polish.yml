 reactive_advice_sponsor_construction_select_holding: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$" # todo: NEW TRANSLATION
 reactive_advice_sponsor_construction_select_holding_desc: "Nyní můžeš sponzorovat vylepšení [Concept('buildings','budovy')|E] v [Concept('holdings','državách')|E] jiných [Concept('characters_possessive','postavách')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_sponsor_construction_select_holding_prompt: "Vyber na mapě libovolnou državu" # todo: NEW TRANSLATION
 reactive_advice_sponsor_construction_open_district: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$" # todo: NEW TRANSLATION
 reactive_advice_sponsor_construction_open_district_desc: "Nyní vyber jeden z jejích [districts|E]." # todo: NEW TRANSLATION
 reactive_advice_sponsor_construction_open_district_prompt: "Vyber obvod (zvýrazněný)" # todo: NEW TRANSLATION
 reactive_advice_sponsor_construction_button: "$REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$" # todo: NEW TRANSLATION
 reactive_advice_sponsor_construction_button_desc: "Zde můžeš sponzorovat výstavbu! Měj na paměti, že můžeš pouze #EMP vylepšovat#! [Concept('buildings','budovy')|E], a to jen ve standardních [Concept('districts','čtvrtí')|E].\n\nHlavním důvodem pro sponzorování je zvýšit buď [Concept('surplus','přebytek')|E], nebo [Concept('need','potřeba')|E] určitého [Concept('trade_good','obchodního zboží')|E] na [Concept('market','trh')|E] dané [Concept('holding_possessive','državy')|E]. Tímto způsobem můžeš propojit $game_concept_market$ s jednou ze svých [Concept('profit_routes','výnosných tras')|E] a zvýšit množství [Concept('gold','zlato')|E], které vyděláš." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 REACTIVE_ADVICE_REPUBLICAN_POLITICS: "Republikánská politika" # todo: NEW TRANSLATION
 action_reactive_advice_republican_politics: "Rada: $REACTIVE_ADVICE_REPUBLICAN_POLITICS$" # todo: NEW TRANSLATION
 action_reactive_advice_republican_politics_desc: "Jsi součástí [Concept('republic','republikou')|E]. Otevři tuto lekci a seznam se se spletitostmi její politiky." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 action_reactive_advice_republican_politics_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_intro: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_intro_desc: "Jako [Concept('house_head','hlava rodu')|E] jsi součástí ctnostné [Concept('republic','republiky')|E]!\n\nJako vůdce [Concept('patrician_family','patricijský rod')|E] vládneš společně s ostatními patricijskými rody v do jisté míry demokratickém procesu. I když právě nejsi [Concept('ruler','vládce')|E] republiky, můžeš se vždy zapojit, pokud máš dostatek [Concept('gold','zlato')|E] a vlivu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_republican_politics_intro_prompt: "Otevři záložku Přehled v panelu republiky (zvýrazněnou)" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_overview: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_overview_desc: "Stejně jako její občané si ani všechny [Concept('republics','republiky')|E] nejsou rovny. Každá $game_concept_republic$ má [Concept('title_tier','úroveň')|E] a [Concept('republic_administration','správa republiky')|E], jak vidíš zde.\n\nUtrácením [Concept('prestige','prestiží')|E] a [Concept('treasury','pokladnice')|E] může [Concept('ruler','vládce')|E] zvýšit $game_concept_title_tier$ $game_concept_republic$, a tím i její moc.\n\nSoučasný $game_concept_ruler$ může také změnit $game_concept_republic_administration$, která určuje celkové směřování $game_concept_republic$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_republican_politics_election: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_election_desc: "A když už mluvíme o [Concept('ruler','vládce')|E], tady ho máme!\n\nNa rozdíl od tyranie jiných [Concept('governments','vlád')|E] je $game_concept_ruler$ [Concept('republic','republika')|E] volen, a to pouze na omezené funkční období.\n\nStejný $game_concept_ruler$ však může být zvolen znovu, takže není neobvyklé, že vede mezi kandidáty." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_republican_politics_open_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_open_assembly_desc: "Moc [Concept('ruler','vládce')|E] je omezena [Concept('assembly','shromáždění')|E]. Podívejme se na ni." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_republican_politics_open_assembly_prompt: "Otevři záložku Shromáždění (zvýrazněnou)" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_assembly: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_assembly_desc: "[Concept('ruler','Vládce')|E] nemá neomezenou moc: každou změnu [Concept('law','zákon')|E] či [Concept('republic_decree_short','výnos')|E] musí schválit [Concept('assembly','shromáždění')|E]. Členové $game_concept_assembly$ mohou dokonce navrhovat vlastní změny $game_concept_law$.\n\nShromáždění obvykle tvoří [Concept('patrician_families','patricijské rody')|E] [Concept('republic','republiky')|E]. Ačkoli nemají ideologii v moderním slova smyslu, každá z nich má [Concept('house_ambition','ambice rodu')|E], která ovlivňuje, jak hlasuje.\n\nRepublika se nemusí podvolovat různorodosti a nepořádku demokracie. Jak se schvalují zákony, může se měnit rovnováha moci mezi shromážděním a vládcem." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_republican_politics_open_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_open_families_desc: "Protože [Concept('assembly','shromáždění')|E] často tvoří [Concept('patrician_families','patricijské rody')|E], podívejme se na ně." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_republican_politics_open_families_prompt: "Otevři záložku Rodiny (zvýrazněnou)" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_families: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_families_desc: "Toto jsou [Concept('patrician_families','patricijské rody')|E] [Concept('republic','republiky')|E].\n\nKaždá rodina, včetně té tvé, má [Concept('patrician_rating','hodnocení patricije')|E]. Čím vyšší příjmy získáváš z [Concept('trade','obchodu')|E] a čím více křesel obsadíš v [Concept('assembly','shromáždění')|E] nebo [Concept('council','radě')|E] [Concept('ruler','vládci')|E], tím vyšší je tvůj $game_concept_patrician_rating$.\n\nVysoký $game_concept_patrician_rating$ zesiluje účinky tvé [Concept('house_ambition','ambice rodu')|E] a může ti dokonce umožnit svrhnout vládu!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_republican_politics_summary: "$REACTIVE_ADVICE_REPUBLICAN_POLITICS$" # todo: NEW TRANSLATION
 reactive_advice_republican_politics_summary_desc: "Osud [Concept('republic','republika')|E] je ve tvých rukou.\n\nZáleží na tobě, jak se rozhodneš ji utvářet. Ponecháš si moc jen pro svou rodinu, nebo se o ni podělíš s ostatními?\n\nJak tvůj [Concept('patrician_rating','hodnocení patricije')|E] roste díky tvým [Concept('trade_routes','obchodním trasám')|E], roste i tvá moc a vliv." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_distribution_route_planner: "Zásobovací trasy" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_distribution_route_planner_intro: "$reactive_advice_distribution_route_planner$" # todo: NEW TRANSLATION
 reactive_advice_distribution_route_planner_intro_desc: "Zde můžeš vytvářet vlastní [Concept('distribution_routes','zásobovací trasy')|E].\n\nDistribuční trasy umožňují přepravovat [Concept('trade_goods','obchodní zboží')|E] a uspokojovat [Concept('needs','potřeby')|E] na [Concept('markets','trhy')|E] ve tvém vlastním [Concept('realm','panství')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_distribution_route_planner_basic_goods: "$reactive_advice_distribution_route_planner$" # todo: NEW TRANSLATION
 reactive_advice_distribution_route_planner_basic_goods_desc: "[Concept('distribution_route','Zásobovací trasa')|E] může přepravovat libovolné množství [Concept('trade_goods','obchodní zboží')|E], ale pouze zboží považované za [Concept('basic_trade_goods','základní obchodní zboží')|E], které vidíš zde.\n\nNemusíš tedy vybírat, který $game_concept_trade_good$ chceš přepravovat.\n\n#I Výběrem libovolného základního zboží můžeš zobrazit jeho [Concept('market_balance','bilance trhu')|E] na mapě#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_distribution_route_planner_accessible_surpluses: "$reactive_advice_distribution_route_planner$" # todo: NEW TRANSLATION
 reactive_advice_distribution_route_planner_accessible_surpluses_desc: "Na mapě pod názvem každého [Concept('market','trhu')|E] vidíš, které [Concept('basic_trade_goods','základní obchodní zboží')|E] jsou v [Concept('surplus','přebytku')|E]. To znamená, že odtud můžeš zboží přepravovat jinam." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_distribution_route_planner_unmet_needs: "$reactive_advice_distribution_route_planner$" # todo: NEW TRANSLATION
 reactive_advice_distribution_route_planner_unmet_needs_desc: "Zobrazují se také všechny neuspokojené [Concept('needs','potřebami')|E]. To znamená, že můžeš na tento [Concept('market','trh')|E] přepravovat [Concept('basic_trade_goods','základní obchodní zboží')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_distribution_route_planner_needs: "$reactive_advice_distribution_route_planner$" # todo: NEW TRANSLATION
 reactive_advice_distribution_route_planner_needs_desc: "[Concept('distribution_route','Zásobovací trasa')|E] může spojovat pouze dva [Concept('markets','trhy')|E] a [Concept('goods','zboží')|E] se přepravuje oběma směry.\n\nJakmile do trasy přidáš dva trhy, můžeš ve zvýrazněném okně sledovat, jak jsou uspokojovány [Concept('needs','potřeby')|E].\n\nProtože trasa vede tvým vlastním [Concept('realm','panství')|E], nemusíš platit [Concept('buy_price','nákupní cena')|E] ani žádné [Concept('tolls','cla')|E].\n\n#I Trh do trasy přidáš nebo z ní odebereš kliknutím na něj na mapě#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
