 reactive_advice_company_direction_open_direction_tab: "$REACTIVE_ADVICE_COMPANY_DIRECTION$" # todo: NEW TRANSLATION
 reactive_advice_company_direction_open_direction_tab_desc: "Pokračuj na záložku [Concept('sentiment','směřování')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_company_direction_open_direction_tab_prompt: "Otevři záložku Směr (zvýrazněnou)" # todo: NEW TRANSLATION
 reactive_advice_company_direction_panel: "$REACTIVE_ADVICE_COMPANY_DIRECTION$" # todo: NEW TRANSLATION
 reactive_advice_company_direction_panel_desc: "Toto je tvůj [Concept('company_direction','$game_concept_company_sentiment$')|E]. Zpočátku je [Concept('company_sentiment_independent','vyvážený')|E], ale může se přiklonit buď k [Concept('company_sentiment_divided','dravému')|E], nebo k [Concept('company_sentiment_concerted','povýšenému do šlechtickému stavu')|E].\n\nSňatky mezi [Concept('noble','urozeným')|E] [Concept('houses','rody')|E] jej přikloní k povýšenému do šlechtickému stavu, zatímco sňatky s jinými [Concept('merchants','kupci')|E] jej přikloní k dravému." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 REACTIVE_ADVICE_SPONSOR_CONSTRUCTION: "Sponzorování staveb" # todo: NEW TRANSLATION
 action_reactive_advice_sponsor_construction: "Rada: $REACTIVE_ADVICE_SPONSOR_CONSTRUCTION$" # todo: NEW TRANSLATION
 action_reactive_advice_sponsor_construction_desc: "Můžeš sponzorovat [Concept('buildings','budovy')|E] v [Concept('holdings','državách')|E] jiných [Concept('characters_possessive','postavách')|E]. Otevři tuto lekci a zjisti, jak na to." # todo: NEW TRANSLATION # todo: CONCEPT CASE
