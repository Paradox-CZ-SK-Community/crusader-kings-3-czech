l_polish:
 REACTIVE_ADVICE_BUILDING_NEEDS: "Potřeby budov" # todo: NEW TRANSLATION
 action_reactive_advice_building_needs: "Rada: $REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 action_reactive_advice_building_needs_desc: "Vaše [Concept('buildings','budovy')|E] mají [Concept('needs','potřeby')|E] na [Concept('trade_goods','obchodní zboží')|E], které dodává místní [Concept('market','trh')|E]. Otevřete tuto lekci a zjistěte, jak tyto potřeby naplnit." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 action_reactive_advice_building_needs_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_intro: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_intro_desc: "Chcete-li ze [Concept('buildings','budov')|E] ve své [Concept('domain','doméně')|E] vytěžit maximum, měli byste zajistit, aby měly přístup k potřebným [Concept('trade_goods','obchodnímu zboží')|E].\n\nPodívejme se, jak na to!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_step_open_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_step_open_domain_tab_desc: "Nejprve se podíváme na vaši [Concept('domain','doménu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_step_open_domain_tab_prompt: "Otevřete kartu Doména v panelu Panství (zvýrazněno)" # todo: NEW TRANSLATION
 reactive_advice_building_needs_domain_tab: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_domain_tab_desc: "Tohle jsou všechny vaše [Concept('holdings','državy')|E] ve vaší [Concept('domain','doméně')|E].\n\n[Concept('county','Hrabství')|E] každé državy je součástí [Concept('market','trhem')|E]. Na těchto trzích se směňuje veškeré [Concept('goods','zboží')|E], které [Concept('buildings','budovy')|E] vyrábějí a spotřebovávají." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_step_open_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_step_open_county_view_desc: "Teď se podíváme na jednu z vašich [Concept('holdings','držav')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_step_open_county_view_prompt: "Klikněte na jednu ze svých držav (zvýrazněno)" # todo: NEW TRANSLATION
 reactive_advice_building_needs_county_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_county_view_desc: "Tohle jsou [Concept('districts','čtvrti')|E] vaší [Concept('holding','državu')|E]. V každém okrese se nacházejí [Concept('buildings','budovami')|E], které vyrábějí a spotřebovávají [Concept('goods','zboží')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_step_open_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_step_open_district_view_desc: "Jako příklad se můžeme podívat na [Concept('needs','potřeby')|E] vašeho [Concept('holding_district','čtvrť državy')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_step_open_district_view_prompt: "Klikněte na čtvrť državy (zvýrazněno)#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_district_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_district_view_desc: "Zde vidíte účinky jednotlivých [Concept('building','budov')|E] v [Concept('district','čtvrti')|E].\n\nNěkteré účinky vyžadují ke své aktivaci spotřebu [Concept('trade_goods','obchodní zboží')|E] z [Concept('market','trhu')|E] daného [Concept('county','hrabství')|E].\n\nNapříklad [Concept('holding_district','čtvrť državy')|E] poskytuje [Concept('food_supply','zásoby potravin')|E] [Concept('holding','državu')|E], pokud může spotřebovávat [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon] a [GetTradeGoodCategory('trade_category_meat').GetNameWithIcon].\n\nNenaplnění [Concept('need','potřeba')|E] nemá žádné negativní účinky a všechny budovy poskytují určitý užitek, i když nemají přístup k potřebným obchodnímu zboží." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_district_view_2: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_district_view_2_desc: "Často není potřeba konkrétní [Concept('trade_good','obchodní zboží')|E], ale stačí libovolná kombinace $game_concept_goods$ z určité [Concept('trade_category_short','kategorie')|E]. Například [Concept('building','budova')|E] může potřebovat [GetTradeGoodCategory('trade_category_cereals').GetNameWithIcon], což znamená, že vyhoví [GetTradeGoodType('trade_good_grain').GetNameWithIcon], [GetTradeGoodType('trade_good_millet').GetNameWithIcon] nebo [GetTradeGoodType('trade_good_rice').GetNameWithIcon].\n\nNěkteré [Concept('needs','potřeby')|E] lze navíc naplnit opakovaně; pokaždé, když je naplníte, se účinek uplatní znovu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_step_open_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_step_open_market_view_desc: "[Concept('buildings','Budovy')|E] tedy potřebují [Concept('trade_goods','obchodní zboží')|E], ale odkud pocházejí?\n\nKaždé obchodní zboží spotřebované v [Concept('county','hrabství')|E] pochází z jeho [Concept('market','trhu')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_step_open_market_view_prompt: "Otevřete trh hrabství (zvýrazněno)#!" # todo: NEW TRANSLATION
 reactive_advice_building_needs_market_view: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_market_view_desc: "Tohle je [Concept('market','trh')|E] daného [Concept('county','hrabství')|E]. Trh obvykle zahrnuje stejná [Concept('counties','hrabství')|E] jako [Concept('duchy','vévodství')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_market_view_balances: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_market_view_balances_desc: "Zde vidíte jednotlivá [Concept('trade_good','obchodní zboží')|E] a také to, zda je ho [Concept('surplus','přebytek')|E], nebo zda jeho [Concept('need','potřeba')|E] není naplněna.\n\nPokud nějaká potřeba není naplněna (#N záporná bilance#!), ne všechny [Concept('buildings','budovy')|E] na [Concept('market','trh')|E] dostávají potřebné [Concept('needs','potřeby')|E].\n\nPokud je přebytek (#P kladná bilance#!), všechny [Concept('buildings','budovy')|E] na trhu mají svou potřebu daného obchodního zboží naplněnou a zboží lze vyvážet prostřednictvím [Concept('trade_routes','obchodních tras')|E].\n\n#I Kliknutím na obchodní zboží zobrazíte jeho stav na trhu a na mapě.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_building_needs_market_view_unmet_need: "$REACTIVE_ADVICE_BUILDING_NEEDS$" # todo: NEW TRANSLATION
 reactive_advice_building_needs_market_view_unmet_need_desc: "Pokud nějaká [Concept('need','potřeba')|E] není naplněna, můžete se o to pokusit několika způsoby:\n\n$BULLET_WITH_TAB$Postavte na [Concept('market','trh')|E] [Concept('buildings','budovy')|E], které dané [Concept('trade_good','obchodní zboží')|E] vyrábějí.\n$BULLET_WITH_TAB$Zřiďte [Concept('distribution_route','zásobovací trasa')|E] mezi dvěma trhům ve svém [Concept('realm','panství')|E].\n$BULLET_WITH_TAB$Pověřte některého ze svých [Concept('client_merchants','závislých kupců')|E] dovozem daného obchodního zboží.\n\nNe všechny potřeby se však dají snadno naplnit a někdy je nejlepší nechat $game_concept_need$ nenaplněnou." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 REACTIVE_ADVICE_CONSTRUCTION_QUEUE: "Fronta výstavby" # todo: NEW TRANSLATION
 action_reactive_advice_construction_queue: "Rada: $REACTIVE_ADVICE_CONSTRUCTION_QUEUE$" # todo: NEW TRANSLATION
 action_reactive_advice_construction_queue_desc: "Zařadili jste stavbu do fronty. Otevřete tuto lekci a zjistěte, jak spravovat všechny stavby." # todo: NEW TRANSLATION
 action_reactive_advice_construction_queue_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 reactive_advice_construction_queue_intro: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$" # todo: NEW TRANSLATION
 reactive_advice_construction_queue_intro_desc: "Zařadili jste stavbu do fronty!\n\nI když si [Concept('building','budově')|E] právě nemůžete dovolit, můžete ho zařadit do fronty a postavit, jakmile na něj budete mít prostředky.\n\nPodívejme se na vaši frontu." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_construction_queue_intro_prompt: "Otevřete panel $BUILD_QUEUE_WINDOW_TITLE$ (zvýrazněno)" # todo: NEW TRANSLATION
 reactive_advice_construction_queue_queue: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$" # todo: NEW TRANSLATION
 reactive_advice_construction_queue_queue_desc: "Tohle jsou všechny stavby, které jste dosud zařadili do fronty ve všech svých [Concept('holdings','držav')|E].\n\nAž budete mít na stavbu dostatek prostředků a splníte všechny ostatní požadavky, její cena se automaticky zaplatí a začne výstavba.\n\nStavby se zahajují v pořadí, v jakém jste je zařadili do fronty, ale jejich pořadí můžete změnit přetažením." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_construction_queue_reserve: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$" # todo: NEW TRANSLATION
 reactive_advice_construction_queue_reserve_desc: "Pokud si chcete odložit část [Concept('gold','zlata')|E] nebo jiného zdroje, můžete si ho zde vyhradit.\n\nTato částka se nepoužije na zahájení staveb ve frontě, takže vám vždy zůstane rezerva pro případ nouze." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_construction_queue_summary: "$REACTIVE_ADVICE_CONSTRUCTION_QUEUE$" # todo: NEW TRANSLATION
 reactive_advice_construction_queue_summary_desc: "To je vše, co potřebujete vědět o řazení staveb do fronty. Hodně štěstí při výstavbě!" # todo: NEW TRANSLATION
 REACTIVE_ADVICE_TRADE_ROUTE_PLANNER: "Obchodní trasy" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner_intro: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner_intro_desc: "Zatímco ostatní dřou na polích nebo zdaňují chudé, vy vyděláváte na toku [Concept('goods','zboží')|E].\n\n[Concept('trade_routes','Obchodní trasy')|E] jsou hlavním zdrojem [Concept('gold','zlatem')|E] pro [Concept('merchants','kupce')|E] a [Concept('republics','republiky')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_trade_route_planner_recommended_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner_recommended_goods_desc: "Nejprve se musíte rozhodnout, s jakým [Concept('trade_good','obchodním zbožím')|E] budete obchodovat.\n\nTato doporučená zboží by vás mohla zajímat, ale můžete si prohlédnout také všechna ostatní, pokud hledáte něco konkrétního." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_trade_route_planner_adding_markets: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner_adding_markets_desc: "Na mapě vidíte všechny [Concept('markets','trhy')|E], na nichž se obchoduje s vybraným [Concept('trade_good','obchodním zbožím')|E].\n\nChcete-li obchodovat, musíte propojit trh s [Concept('surplus','přebytkem')|E] zboží (#trade_surplus tyrkysově#!) s místem, kde je po něm [Concept('need','potřeba')|E] (#trade_need zlatě#!).\n\nPokud je o trh velký zájem ze strany ostatních [Concept('merchants','kupců')|E], můžete obchodovat jen s částí tamního zboží, a to v závislosti na své [Concept('competitiveness','konkurenceschopnost')|E].\n\nLevně nakupujte a draze prodávejte, abyste dosáhli většího zisku.\n\n#I Kliknutím na trhy je přidáte do trasy nebo z ní odeberete.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_trade_route_planner_carried_goods: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner_carried_goods_desc: "Když do své [Concept('route','trasy')|E] přidáte [Concept('markets','trhy')|E], bude se po trase převážet vybrané [Concept('good','zboží')|E], které se zobrazí zde.\n\nZcela vlevo je hlavní [Concept('primary_good','hlavní komodita')|E]; obchodováním s ním získáváte [Concept('trade_expertise','obchodní zkušenost')|E]. Postupem času vám to přinese různé výhody podle jeho [Concept('trade_category','kategorie zboží')|E].\n\n#I Pokud převážíte více než 1 zboží, můžete jiné přetáhnout na první pozici a nastavit ho jako $game_concept_primary_good$.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_trade_route_planner_capacity: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner_capacity_desc: "Můžete převážet jen omezený počet druhů [Concept('goods','zboží')|E] a jejich celkové [Concept('capacity','kapacita')|E] je také omezené.\n\nTyto limity můžete zvýšit výstavbou [Concept('company_buildings_short','budovami')|E] ve své [Concept('company','společnosti')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_trade_route_planner_path: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner_path_desc: "Podobně je délka tras omezena [Concept('trade_route_length','délka obchodní trasy')|E] a zastavíte jen na omezeném počtu [Concept('markets','trhy')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_trade_route_planner_trader: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner_trader_desc: "Nakonec můžete jednoho ze svých [Concept('associates','společníků')|E] pověřit rolí [Concept('trader','obchodníkem')|E]. Podle zadaného úkolu bude zlepšovat různé stránky [Concept('route','trasa')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_trade_route_planner_summary: "$REACTIVE_ADVICE_TRADE_ROUTE_PLANNER$" # todo: NEW TRANSLATION
 reactive_advice_trade_route_planner_summary_desc: "Rozvojem své [Concept('company','společnosti')|E] získáte přístup k dalším [Concept('routes','trasám')|E] a zlepšíte jejich dosah i množství zboží, se kterým můžete obchodovat.\n\nDíky tomu budete vydělávat stále více [Concept('gold','zlato')|E]!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 REACTIVE_ADVICE_MERCHANT_INTRODUCTION: "Život obchodníka" # todo: NEW TRANSLATION
 action_reactive_advice_merchant_introduction: "Rada: $REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 action_reactive_advice_merchant_introduction_desc: "Jste [Concept('merchant','kupec')|E]! Otevřete tuto lekci a seznamte se se základy obchodování." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 action_reactive_advice_merchant_introduction_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_intro: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_intro_desc: "Jste [Concept('merchant','kupec')|E]!\n\nAčkoli je [Concept('trade','obchod')|E] životní mízou vaší [Concept('company','společnost')|E], podnikání není jen o vydělávání peněz." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merchant_introduction_open_overview: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_open_overview_desc: "Začneme tím, že se podíváme, jak může vaše [Concept('company','společnost')|E] dlouhodobě růst." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merchant_introduction_open_overview_prompt: "Otevřete kartu Přehled v panelu Panství (zvýrazněno)" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_company_size: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_company_size_desc: "Tohle je velikost vaší [Concept('company_size','velikost společnosti')|E], hlavní měřítko moci $game_concept_company_possessive$.\n\nJak vaše $game_concept_company$ poroste, všimnou si vás i [Concept('rulers','vládci')|E] vyšší [Concept('rank','hodnost')|E], například [Concept('kings','králové')|E] a [Concept('emperors','císaři')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merchant_introduction_domicile: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_domicile_desc: "Tohle je [Concept('domicile','domicil')|E] vaší [Concept('company','společnost')|E], vaše základna.\n\nZde můžete utrácet [Concept('gold','zlato')|E] a [Concept('prestige','prestiž')|E] za výstavbu [Concept('domicile_buildings','budovy domicilu')|E], které vaši společnost dále posílí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merchant_introduction_company_purpose: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_company_purpose_desc: "Tohle je [Concept('company_purpose','zaměření společnosti')|E], který určuje zaměření vaší společnost.\n\nÚčel obchodníka je výchozí, ale můžete ho změnit a zaměřit se místo toho na [Concept('artifacts','artefakty')|E], luxusní zboží nebo půjčování peněz." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merchant_introduction_open_patronage: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_open_patronage_desc: "Ani jako [Concept('merchant','kupec')|E] však nejste osvobozeni od nadvlády místních pánů." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merchant_introduction_open_patronage_prompt: "Otevřete kartu $MY_REALM_WINDOW_BODY_TITLE_PATRONAGE$ (zvýrazněno)" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_patron: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_patron_desc: "Tohle je váš [Concept('merchant_patron','patron')|E], [Concept('ruler','vládce')|E] [Concept('holding','državy')|E], kde se nachází váš [Concept('domicile','domicil')|E].\n\nMusíte sice svému patronovi platit daně, ale tento vztah vám může přinést i výhody.\n\nMůžete například změnit svou [Concept('client_contract','klientskou smlouvu')|E] a požádat $game_concept_merchant_patron$ o podporu obchodních aktivit nebo si usnadnit sjednávání [Concept('marriages','sňatky')|E] s urozenými." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merchant_introduction_clients: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_clients_desc: "Obvykle nejste jediným [Concept('client','klientem')|E] [Concept('merchant','kupce')|E] svého [Concept('merchant_patron','patrona')|E].\n\nOstatní $game_concept_clients$ budou obchodovat ze stejného místa jako vy a zvláštní [Concept('charter','listina')|E] může mít pouze jeden $game_concept_client$. Držení $game_concept_charter$ vám díky zvláštním [Concept('decisions','rozhodnutím')|E] zlepší obchodní možnosti." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merchant_introduction_open_trade: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_open_trade_desc: "A konečně se podíváme na zlatého slona v místnosti: vydělávání peněz." # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_open_trade_prompt: "Otevřete kartu Obchodní trasy v obchodním panelu (zvýrazněno)" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_create_route: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_create_route_desc: "Tohle jsou vaše [Concept('trade_routes','obchodní trasy')|E], hlavní způsob, jak vyděláváte [Concept('gold','zlato')|E].\n\nRozvojem své společnosti budete moci provozovat více $game_concept_routes$, které povedou dál a přepraví více [Concept('goods','zboží')|E]. Tím si vyděláte více $game_concept_gold$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merchant_introduction_succeed: "$REACTIVE_ADVICE_MERCHANT_INTRODUCTION$" # todo: NEW TRANSLATION
 reactive_advice_merchant_introduction_succeed_desc: "Takový je úděl [Concept('merchant','kupec')|E]: vydělávat [Concept('gold','zlato')|E] prostřednictvím [Concept('trade_routes','obchodních tras')|E] a utrácet ho na zvýšení své [Concept('prestige','prestiže')|E] a [Concept('company_size','velikost společnosti')|E].\n\nPodniky zodpovědných a organizovaných kupců nakonec předčí podniky bohatých [Concept('rulers','vládců')|E]!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 REACTIVE_ADVICE_COMPANY_DIRECTION: "Směřování společnosti" # todo: NEW TRANSLATION
 action_reactive_advice_company_direction: "Rada: $REACTIVE_ADVICE_COMPANY_DIRECTION$" # todo: NEW TRANSLATION
 action_reactive_advice_company_direction_desc: "Vaše [Concept('company_direction','$game_concept_company_sentiment$')|E] se může časem změnit. Otevřete tuto lekci a zjistěte více." # todo: NEW TRANSLATION # todo: CONCEPT CASE
