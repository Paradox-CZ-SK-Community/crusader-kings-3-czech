 lesson_basics_welcome: "Vítejte v Crusader Kings III"
 lesson_welcome_desc: "@tutorial_screenshot_1!\nJste středověký vládce! Vaše vláda může být krátká, ale skrze své dědice můžete pozvednout svou dynastii do významu.\n\nZemě jsou vám k mání mečem nebo sňatkem, zatímco bystrá diplomacie může rozšířit váš dosah daleko za nejdivočejší sny jakéhokoli dobyvatele..."
 full_tutorial_explanation_desc: "\n#TUT 2 hodiny#!"
 quick_tutorial_explanation_desc: "\n#TUT 13 minut#!"
 lesson_basics_quick_camera: "Kamera"
 lesson_basics_quick_camera_desc: "Pomocí kláves W, A, S a D posunete kameru po mapě.\n\nTaké můžete přesunout kurzor na okraj obrazovky pro posun zobrazení.\n\nStisknutím klávesy '#V Home#!' na klávesnici se vrátíte na své sídlo v [GetPlayer.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 lesson_basics_quick_zoom: "Přibližování"
 lesson_basics_quick_zoom_desc: "K přibližování a oddalování mapy použijte kolečko myši.\n\nPři maximálním přiblížení uvidíte $game_concept_detail_zoom$. Pokud trochu oddálíte, budete na $game_concept_political_zoom$. Nakonec, při úplném oddálení se zobrazí $game_concept_paper_zoom$."
 lesson_basics_quick_nested_tooltips: "Vnořené nápovědy" # todo: NEW TRANSLATION
 lesson_basics_quick_nested_tooltips_desc: "$lesson_basics_tooltips_in_tooltips_desc$" # todo: NEW TRANSLATION
 lesson_basics_quick_nested_tooltips_hover_word: "$lesson_basics_tooltips_in_tooltips_hover_word$" # todo: NEW TRANSLATION
 lesson_basics_quick_nested_tooltips_hover_word_deeper: "$lesson_basics_tooltips_in_tooltips_hover_word_deeper$" # todo: NEW TRANSLATION
 lesson_basics_quick_nested_tooltips_complete: "$lesson_basics_quick_nested_tooltips$" # todo: NEW TRANSLATION
 lesson_basics_quick_nested_tooltips_complete_desc: "$lesson_basics_quick_nested_tooltips_desc$" # todo: NEW TRANSLATION
 lesson_basics_quick_characters: "Postavy"
 lesson_basics_quick_characters_desc: "Hrajete za [GetPlayer.GetShortUINameNotMeNoTooltip], jednoho z mnoha [Concept('characters','postavám')|E] v tomto světě, který je zde reprezentován avatary postav.\n\nJste [Concept('ruler','vládce')|E] feudálního [Concept('realm','panství')|E]!" # todo: CONCEPT CASE
 lesson_basics_quick_this_is_you_1: "To jste vy"
 lesson_basics_quick_this_is_you_1_desc: "Zde uvidíte sebe a svoji nejbližší [Concept('family','rodina')|e].\n\nNa pravé straně vidíte svého [Concept('heir','dědice')|e], který je určen k dědění vašeho panství po vaší smrti.\n\n#TUT Pokud se někdy na mapě ztratíte, můžete kliknout na svou postavu a znovu vycentrovat kameru na vaše [Concept('realm','panství')|e].#!" # todo: CONCEPT CASE
 lesson_basics_quick_this_is_you_2: "Váš choť"
 lesson_basics_quick_this_is_you_2_desc: "Obvykle je dobrý nápad mít [Concept('spouse','choť')|E]. Pomohou vám vládnout vašemu [Concept('realm','panství')|e] a zajistit budoucnost vaší [Concept('dynasty','dynastii')|e].\n\nPrávě teď jste [Select_CString(ROOT.Char.IsFemale,'svobodná','svobodný')]. Co kdybychom to napravili?" # todo: CONCEPT CASE
 lesson_basics_quick_find_spouse_tt: "Uzavřít manželství"
 lesson_basics_quick_marriage_window: "$lesson_basics_quick_this_is_you_2$" # todo: NEW TRANSLATION
 lesson_basics_quick_marriage_window_desc: "Nalezení vhodného [Concept('spouse','chotě')|E] není snadné, ale je dobré mít na paměti:\n\n$EFFECT_LIST_BULLET$Politika: [Concept('marriages','sňatky')|E] jsou hlavním způsobem, jak vytvořit [Concept('alliance','aliance')|E]\n$EFFECT_LIST_BULLET$Schopnosti: Její [Concept('skills','dovednosti')|E] budou přidány k vašim\n$EFFECT_LIST_BULLET$Genetika: [Concept('congenital_traits','vrozené rysy')|E], jako například [GetTrait('intellect_good_2').GetName( GetNullCharacter )], mohou být zděděny vašimi [Concept('children','dětmi')|E]\n$EFFECT_LIST_BULLET$Šlechta: Sňatek s [Concept('lowborn','neurozeným')|E] vám sníží [Concept('prestige','prestiž')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 lesson_basics_quick_married_great_job: "Váš choť"
 lesson_basics_quick_married_great_job_desc: "Gratulujeme k sňatku!\n\nSvazek mezi vámi a vaším [Concept('spouse','chotí')|e] vytvořil [Concept('alliance','aliance')|e] mezi vámi a [Concept('ruler','vládce')|e] [Concept('realm','panství')|e], odkud váš $game_concept_spouse$ pochází. To znamená, že se můžete navzájem požádat o pomoc a vstoupit do [Concept('wars','válek')|e]!\n\n#TUT Pokud po smrti vaší postavy nezůstane žádný další žijící člen vaší [Concept('dynasty','dynastii')|e], prohrajete hru. Mít $game_concept_spouse$ vám v tom může pomoci.#!" # todo: CONCEPT CASE
 lesson_basics_quick_this_is_you_3: "Rysy"
 lesson_basics_quick_this_is_you_3_desc: "Toto jsou [Concept('traits','rysy')|e] vaší postavy! Jak vidíte, je @temperate_icon_tutorial! [GetTrait('temperate').GetName( GetNullCharacter )], @gregarious_icon_tutorial! [GetTrait('gregarious').GetName( GetNullCharacter )], a @impatient_icon_tutorial! [GetTrait('impatient').GetName( GetNullCharacter )].\n\n#TUT Rysy ovlivňují, jak vaše postava reaguje na události ve světě hry. Během hraní si také můžete osvojit nové vlastnosti.#!" # todo: CONCEPT CASE
 lesson_basics_quick_skills: "Dovednosti"
 lesson_basics_quick_skills_desc: "Postavy mají také [Concept('skills','dovedností')|e]! Podívejme se na ně.\n\nPět hlavních dovedností, které definují schopnosti vaší postavy, jsou [Concept('diplomacy_i','@skill_diplomacy_icon!')|e][Concept('diplomacy','diplomacie')|e], [Concept('martial_i','@skill_martial_icon!')|e][Concept('martial','válečnictví')|e], [Concept('stewardship_i','@skill_stewardship_icon!')|e][Concept('stewardship','správcovství')|e], [Concept('intrigue_i','@skill_intrigue_icon!')|e][Concept('intrigue','pletichářství')|e], a [Concept('learning_i','@skill_learning_icon!')|e][Concept('learning','učenost')|e].\n\n#TUT Dovednosti se mohou v průběhu hry měnit v závislosti na vašich činech.#!" # todo: CONCEPT CASE
 lesson_basics_quick_your_domain_1: "Vaše panství"
 lesson_basics_quick_your_domain_desc_1: "@tutorial_screenshot_2! Nyní se podívejme na vaše [Concept('domain','doména')|e], která se skládá ze všech pozemků, které osobně vlastníte. Přehled vašeho domény je zobrazen ve zvýrazněné části." # todo: CONCEPT CASE
 lesson_basics_quick_your_domain_2: "Váš erb"
 lesson_basics_quick_your_domain_desc_2: "Toto je erb [GetPlayer.GetPrimaryTitle.GetName]. Slouží k reprezentaci vašeho [Concept('realm','panství')|e] na různých místech. Například ho můžete vidět plovoucí nad vaším [Concept('capital','hlavním sídlem')|e], $cn_luimneach$.\n\n#TUT Vidíte malou korunu nad vaším erbem? Ta značí jeho [Concept('title_tier','úrovně')|e]. S rostoucím pořadím úrovní bude koruna nad příslušným erbem čím dál honosnější!#!" # todo: CONCEPT CASE
 lesson_basics_quick_your_domain_3: "Vaše tituly"
 lesson_basics_quick_your_domain_desc_3: "Momentálně držíte celkem tři [Concept('titles','tituly')|e], které všechny představují území na mapě. Vaším primárním a nejdůležitějším titulem je ten nejvlevo. Určuje název vašeho [Concept('realm','panství')|e]. Také vlastníte $game_concept_titles$ $c_thomond$ a $c_ennis$.\n\n#TUT Když najedete myší na tituly v panelu postavy, ukáže se vám, jaké území na mapě představují.#!" # todo: CONCEPT CASE
 lesson_basics_quick_relationships: "Další postavy"
 lesson_basics_quick_relationships_desc: "@tutorial_screenshot_3!\nV této sekci můžete vidět různé další [Concept('characters','postavy')|e], s nimiž máte spojení. Patří sem vaše [Concept('family','rodina')|e], kdokoli, s kým máte [Concept('relationship','zvláštní vztah')|e], vaši [Concept('courtiers','dvořany')|e] a vaši [subjects|e]." # todo: CONCEPT CASE
 lesson_basics_quick_realm: "Panství"
 lesson_basics_quick_realm_desc: "Podívejme se na panel na pravé straně obrazovky. Je zde několik tlačítek, ale nejdřív chceme nahlédnout do vašeho [Concept('realm','panství')|e]." # todo: CONCEPT CASE
 lesson_basics_quick_realm_great_job: "Hrabství & majetky"
 lesson_basics_quick_realm_great_job_desc: "Pamatujete na [Concept('titles','tituly')|e], které jsme viděli dříve? V tomto zobrazení můžete prohlédnout území, která reprezentují, podrobněji. Jsou to [Concept('counties','hrabství')|e], ale kvůli vaší irské [Concept('culture','kultuře')|e] nesou jiný, specifický název.\n\nHrabství (v tomto případě earldomy) se skládají z menších částí zvaných [Concept('holdings','držav')|e]. Država může obsahovat několik [Concept('buildings','budov')|e], které poskytují různé výhody." # todo: CONCEPT CASE
 lesson_basics_quick_vassals: "Vazalové"
 lesson_basics_quick_vassals_desc: "Všimněte si, že $c_ormond$ je zahrnuto v obrysu vašeho [Concept('realm','panství')|e] na mapě, přestože se neobjevuje v zobrazení [Concept('domain','doméně')|e]? Abychom vysvětlili proč, musíme se podívat na vaše [Concept('vassals','vazalové')|e]." # todo: CONCEPT CASE
 lesson_basics_quick_vassals_2: "Vazalové"
 lesson_basics_quick_council_1: "Rada"
 lesson_basics_quick_council_1_desc: "Naštěstí nemusíte spravovat své [Concept('realm','panství')|e] sami. Podívejme se na vaši [Concept('council','radu')|e], další zobrazení přístupné v panelu vpravo." # todo: CONCEPT CASE
 lesson_basics_quick_council_2: "Rada"
 lesson_basics_quick_council_2_desc: "@tutorial_screenshot_4! Toto je vaše [Concept('council','rada')|e], která se skládá ze šesti [Concept('councillors','rádci')|e], včetně vašeho [Concept('spouse','chotě')|e]. Mohou například vykonávat $task_collect_taxes$ nebo $task_find_secrets$ pomocí [Concept('councillor_tasks','úkolů rádce')|e]." # todo: CONCEPT CASE
 lesson_basics_quick_council_3: "Úkoly rádců"
 lesson_basics_quick_council_3_desc: "Zkusme použít [Concept('councillor_task','úkol rádce')|e]! Nebylo by hezké mít další [Concept('county','hrabství')|e] ve vašem [Concept('realm','panství')|e]? K tomu budete potřebovat [Concept('claim','nárok')|e]. Nechte svého [Concept('realm_priest','duchovního panství')|e], aby ho vymyslel." # todo: CONCEPT CASE
 lesson_basics_council_fabricate_claim_tt: "Vytvořit $game_concept_claim$ na hrabství mimo vaše hranice" # todo: CONCEPT CASE
 lesson_basics_quick_vassals_great_job: "Vazalové"
 lesson_basics_quick_vassals_great_job_desc: "@tutorial_screenshot_5! Toto je [Concept('vassal','vazal')|e], další [Concept('ruler','vládce')|e], který pomáhá spravovat vaše [Concept('realm','panství')|e] tím, že vládne nad [Concept('county','hrabstvím')|e] mimo vaše [Concept('domain','doména')|e].\n\nJako [Concept('liege','lenní pán')|e] vůči vazalovi dostáváte platbu ve formě daním (@gold_icon![Concept('gold','zlato')|e]) a @soldier_icon! [Concept('levies','odvedenci')|e]." # todo: CONCEPT CASE
 lesson_basics_quick_vassals_great_job_2: "Doména & panství"
 lesson_basics_quick_vassals_great_job_2_desc: "Mezi vaším [Concept('domain','doménou')|e] a [Concept('realm','panství')|e] je důležitý rozdíl. Váš $game_concept_domain$ jsou pozemky, které osobně vlastníte, zatímco $game_concept_realm$ zahrnuje i všechna území držená vašimi [Concept('vassals','vazaly')|e].\n\n#TUT Váš [Concept('domain_limit','limit domény')|e] vám výrazně brání v držení neomezeného množství [Concept('titles','titulech')|e] přímo, takže budete muset spoléhat na vazaly, abyste mohli rozšiřovat své hranice.#!" # todo: CONCEPT CASE
 lesson_basics_quick_holdings: "Majetky"
 lesson_basics_quick_holdings_desc: "Momentálně se vaše [Concept('domain','doména')|E] skládá z [Concept('counties','hrabství')|E] (kvůli vaší irské [Concept('culture','kultuře')|E] nazývaných 'Earldom') $c_thomond$ a $c_ennis$. Protože $c_ormond$ je držen vaším [Concept('vassal','vazalem')|e], není součástí vašeho domény.\n\nTyto [Concept('counties','hrabství')|E] se skládají z menších pozemků — [Concept('baronies','baronství')|E], jednotlivých [Concept('holdings','držav')|E] [Concept('realm','panství')|E].\n\n#TUT Majetky představují osady na vašem území!#!" # todo: CONCEPT CASE
 lesson_basics_quick_resources_1: "Zdroje"
 lesson_basics_quick_resources_1_desc: "Dobrá práce! Váš [Concept('councillor','rádce')|e] teď pracuje na získání [Concept('claim','nárok')|e].\n\nDále se podívejme na panel v pravém horním rohu obrazovky. Zde najdete několik zdrojů, které lze použít k interakci se světem různými způsoby." # todo: CONCEPT CASE
 lesson_basics_quick_resources_gold: "@gold_icon! Zlato" # todo: CONCEPT CASE
 lesson_basics_quick_resources_gold_desc: "[Concept('gold_i','@gold_icon!')|e] [Concept('gold','Zlato')|e] je měřítkem vašeho osobního bohatství a lze jej použít k placení mnoha věcí, včetně budov, armád a úplatků. \n\nObecně platí, že dobrý [Concept('stewardship_i','@skill_stewardship_icon!')|e][Concept('stewardship','správcovství')|e] [Concept('skill','dovednost')|e] vám pomůže při vydělávání zlatu." # todo: CONCEPT CASE
 lesson_basics_quick_resources_prestige: "@prestige_icon! Prestiž" # todo: CONCEPT CASE
 lesson_basics_quick_resources_prestige_desc: "[Concept('prestige_i','@prestige_icon!')|e] [Concept('prestige','Prestiž')|e] představuje vaši osobní slávu a proslulost. Jak získáte $game_concept_prestige$, zvýší se také vaše [Concept('prestige_level','úroveň slávy')|e].\n\nJako zdroj lze $game_concept_prestige$ utrácet za světská rozhodnutí ve vašem [Concept('realm','panství')|e]. Vysoká [Concept('diplomacy_i','@skill_diplomacy_icon!')|e][Concept('diplomacy','diplomacie')|e] vám pomůže získat více $game_concept_prestige$." # todo: CONCEPT CASE
 lesson_basics_quick_resources_piety: "[Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|e] Zbožnost" # todo: CONCEPT CASE
 lesson_basics_quick_resources_piety_desc: "[Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|e] [Concept('piety','Zbožnost')|e] je zdroj, který odráží, jak zbožná vaše postava je. Lze jej utrácet pro interakce s vaší [Concept('faith','vírou')|e] různými způsoby, například vyhlášením [Concept('holy_wars','svatými válkami')|e].\n\nVaše [Concept('piety_level','úroveň oddanosti')|e] se také zvyšuje s nasbíraným zbožností. Zaměření se na [learning_i|e][Concept('learning','učenost')|e] může být dobrý nápad pro obzvlášť oddanou postavu." # todo: CONCEPT CASE
 lesson_basics_quick_resources_renown: "@dynasty_prestige_icon! Věhlas" # todo: CONCEPT CASE
 lesson_basics_quick_resources_renown_desc: "[Concept('dynasty_prestige_i','@dynasty_prestige_icon!')|e] [Concept('dynasty_prestige','Věhlas')|e] představuje, jak vlivná vaše [Concept('dynasty','dynastie')|e] je, a lze jej utratit na rozhodnutí, která ovlivní budoucnost vaší rodiny.\n\nVěhlas je vázán na váš [Concept('dynasty_prestige_level','úroveň věhlasu')|e], což je celkové měřítko toho, jak slavná vaše $game_concept_dynasty$ je." # todo: CONCEPT CASE
 lesson_basics_quick_resources_time: "Čas"
 lesson_basics_quick_resources_time_desc: "Teď, když jsme si řekli o zdrojích, zakončíme to několika posledními radami. Hra je nyní pozastavená. Rychlost plynutí času ve světě můžete ovládat v pravém dolním rohu.\n\n#TUT Crusader Kings III se odehrává přes stovky let, takže si klidně dejte na čas.#!"
 lesson_basics_quick_unpause_tt: "Obnovit běh hry stisknutím mezerníku nebo kliknutím na tlačítko vpravo dole"
 lesson_basics_quick_done: "Hodně štěstí!"
 lesson_basics_quick_done_desc: "Gratulujeme k dokončení Rychlého tutoriálu! Hra je nyní odpausovaná a čas plyne. Od tohoto bodu je na vás, jak utvoříte budoucnost rodu [GetPlayer.GetHouse.GetName].\n\n#TUT Můžete dělat, co chcete, ale mějte na očích @reactive_advice_icon! Reaktivní rady, které se objeví v horní části obrazovky.\n\nKdo ví, možná se stanete i králem Irska?!#!"
 lesson_basics_camera: "Kamera ($lesson_basics$)"
 lesson_basics_camera_desc: "K pohybu kamery po mapě použijte klávesy W, A, S a D. Také můžete posunout kurzor k okraji obrazovky pro posun. Stisk klávesy 'Home' vás přenese na váš [Concept('realm_capital','hlavní sídlo panství')|E].\n\nPro přibližování a oddalování mapy použijte kolečko myši.\n\n#TUT Různé informace se zobrazují na různých úrovních přiblížení: [Concept('detail_zoom','$ZOOM_LEVEL_DETAILS$')|E], [Concept('political_zoom','$ZOOM_LEVEL_POLITICAL$')|E] a [Concept('paper_zoom','$ZOOM_LEVEL_PAPER_MAP$')|E].\n\nPři přiblížení můžete vybírat a spravovat své [Concept('holdings','državy')|E]. Oddálením získáte přehled všech [Concept('realms','panství')|E].#!" # todo: CONCEPT CASE
 lesson_basics_paused_intro: "Pozastavení ($lesson_basics$)"
 lesson_basics_paused_intro_desc: "Crusader Kings III zasahuje stovky let a mnoho generací. Právě teď čas stojí, protože hra je #EMP pozastavena#!.\n\n#TUT Pro tuto část tutoriálu ponecháme hru pozastavenou, zatímco vás provedeme některými herními koncepty.#!"
 lesson_basics_tooltips_in_tooltips: "Tooltipy uvnitř tooltipů ($lesson_basics$)"
 lesson_basics_tooltips_in_tooltips_desc: "Klíčové pojmy jsou označeny modrým [Concept('highlighted_text','zvýrazněným textem')|E]. To znamená, že nad těmito slovy můžete podržet kurzor, aby se otevřela informační nápověda.\n\nTyto nápovědy mohou také obsahovat zvýrazněná klíčová slova, nad kterými lze také podržet kurzor.\n\nTrvá to #bold několik sekund#!, než se nápověda při najetí myší 'zafixuje'." # todo: CONCEPT CASE
 lesson_basics_tooltips_in_tooltips_hover_word: "Umístěte kurzor nad tento [Concept('highlighted_text','zvýrazněný text')|E], aby se otevřela nápověda" # todo: CONCEPT CASE
 lesson_basics_tooltips_in_tooltips_hover_word_deeper: "Najetěte kurzorem na slovo 'neat' uvnitř otevřené nápovědy"
 lesson_basics_tooltips_in_tooltips_complete: "$lesson_basics_tooltips_in_tooltips$"
 lesson_basics_tooltips_in_tooltips_complete_desc: "$lesson_basics_tooltips_in_tooltips_desc$"
 lesson_basics_web_of_titles: "Vládci území ($lesson_basics_map$)"
 lesson_basics_web_of_titles_desc: "Teď si promluvíme o #EMP hře#!! Všechno se odehrává na mapě před vámi. Svět se skládá z velkých i malých území — pozemských [Concept('titles','titulů')|E] držených různými [Concept('rulers','vládci')|E].\n\n#TUT Tituly jsou na mapě zobrazovány jako složité erby, které se ukazují jako ikony.\n\nIkona představující vaše [Concept('realm','panství')|E] je erb vašeho [Concept('primary_title','hlavního titulu')|E], nejdůležitějšího a nejprestižnějšího titulu, který vlastníte.#!" # todo: CONCEPT CASE
 lesson_basics_realm: "Hranice ($lesson_basics_map$)"
 lesson_basics_realm_desc: "Když najedete myší na portrét vaší postavy, erb nad vaším [Concept('realm_capital','hlavním sídlem panství')|E] ($cn_luimneach$) zabliká a celé vaše [Concept('realm','panství')|E] bude zvýrazněno. Munster je vaším [Concept('primary_title','hlavním titulem')|E], proto se vaše $game_concept_realm$ jmenuje podle něj.\n\nTaké držíte earldom Thomond jako samostatný $game_concept_title$.\n\n#TUT Pokud oddálíte zobrazení, na této části mapy se objeví nápis 'Munster', protože jste hlavní vládce oblasti.#!" # todo: CONCEPT CASE
 lesson_basics_map_modes: "Vládnutí nad ostatními ($lesson_basics_map$)"
 lesson_basics_map_modes_desc: "Jako [Concept('ruler','vládce')|E] můžete držet jen určité množství země — často budete mít jiné $game_concept_rulers$, kteří vám pomáhají s administrací [Concept('realm','panstvím')|E] tím, že drží pozemky ([Concept('titles','tituly')|E]) uvnitř vašich hranic, čímž se stávají vašimi [Concept('vassals','vazaly')|E].\n\n#TUT Pro nalezení vlastních pozemků, vašeho [Concept('domain','domény')|E], stiskněte 'Home' a přibližte zobrazení. Po přiblížení uvidíte modré štítky na [Concept('baronies','baronství')|E], které patří vám (v tomto případě $cn_luimneach$ a $cn_inis$).\n\nEarldom $c_ormond$ drží váš vazal.#!" # todo: CONCEPT CASE
 lesson_basics_characters: "Postavy ($lesson_basics_character$)"
 lesson_basics_characters_desc: "Hrajete za jednu z mnoha [Concept('characters','postavám')|E] v tomto světě, zastoupenou avatary postav. Vaše postava je [Concept('ruler','vládce')|E] [Concept('realm','panství')|E]!\n\n#TUT Musíte zajistit, aby vaše [Concept('dynasty','dynastie')|E] přežila a vzkvétala skrze věky. Vaše [Concept('titles','tituly')|E] vám dávají moc a kontrolu nad územím i nad ostatními postavami (které mohou mít vlastní tituly a pozemky).#!" # todo: CONCEPT CASE
 lesson_basics_characters_click_on_character: "Klikněte na svou postavu"
 lesson_basics_skills: "Dovednosti ($lesson_basics_character$)"
 lesson_basics_skills_desc: "[Concept('characters','Postavy')|E] mají [Concept('skills','dovednosti')|E], které udávají jejich zdatnost v určité oblasti. Někteří jsou skvělí řečníci, zatímco jiní raději dávají najevo záměry na bojišti.\n\n#TUT Hlavní dovednosti jsou:\n#![Concept('diplomacy_i','@skill_diplomacy_icon!')|E] [Concept('diplomacy','diplomacie')|E]\n#weak Zvyšování sympatií ostatních k vám#!\n[Concept('martial_i','@skill_martial_icon!')|E] [Concept('martial','Válečnictví')|E]\n#weak Svolávání a velení armádám#!\n[Concept('stewardship_i','@skill_stewardship_icon!')|E] [Concept('stewardship','Správcovství')|E]\n#weak Správa vašich osobních panství#!\n[Concept('intrigue_i','@skill_intrigue_icon!')|E] [Concept('intrigue','Pletichářství')|E]\n#weak Intriky a hledání tajemství#!\n[Concept('learning_i','@skill_learning_icon!')|E] [Concept('learning','Učenost')|E]\n#weak Studium teologie a technologií#!" # todo: CONCEPT CASE
 lesson_basics_traits_1: "Rysy ($lesson_basics_character$)"
 lesson_basics_traits_1_desc: "[Concept('characters','Postavy')|E] také mají [Concept('traits','rysy')|E], které mohou ovlivnit [Concept('skills','dovednosti')|E] i to, jak na věci reagují. Jsou znázorněny ikonami v zobrazení postavy.\n\nNěkteré rysy popisují povahu postavu, jako [GetTrait('fickle').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )] nebo [GetTrait('generous').GetName( GetNullCharacter )]. Jiné rysy jsou specifické pro to, jak $game_concept_character$ vedl svůj život, například [Concept('tutorial_education_trait','rys vzdělání')|E] nebo [Concept('commander_traits','velitelské rysy')|E].\n\n#TUT Vy jste:\n$EFFECT_LIST_BULLET$@temperate_icon! [GetTrait('temperate').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$@wrathful_icon! [GetTrait('wrathful').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$@impatient_icon! [GetTrait('impatient').GetName( GetNullCharacter )]\nZ toho lze vyčíst, že váš $game_concept_character$ obvykle vede skromný život a očekává, že ostatní budou dělat totéž, a rychle se rozčílí, když tak nečiní.\n\nKdyž se postava chová v rozporu se svými osobnostními rysy, může jí to způsobit [Concept('stress','stres')|E].#!" # todo: CONCEPT CASE
 lesson_basics_traits_2: "Rysy ($lesson_basics_character$)"
 lesson_basics_traits_2_desc: "[Concept('traits','Rysy')|E] mohou také ovlivnit, jak ostatní [Concept('characters','postavy')|E] reagují na #EMP vás#!.\n\nNěkteří lidé jsou ohromeni rysem @brave_icon! [GetTrait('brave').GetName( GetNullCharacter )], zatímco postava s rysem @lustful_icon! [GetTrait('lustful').GetName( GetNullCharacter )] je náchylnější k pikantním drbům...\n\n#TUT Rysy ovlivňují morálku a chamtivost ostatních postav, což může mít dopad jak na jejich přátelské, tak nepřátelské činy.#!" # todo: CONCEPT CASE
 lesson_basics_opinion: "Názor ($lesson_basics_character$)"
 lesson_basics_opinion_desc: "Všechny [Concept('characters','postavy')|E] (ano, #EMP všechny#!) mají jeden o druhém [Concept('opinion','mínění')|E], který ovlivňuje jejich chování.\n\n#N Nízký#! $game_concept_opinion$ může způsobit, že se lidé vzbouří proti vám nebo vám nebudou ochotni pomoci. #P Vysoký#! $game_concept_opinion$ může naopak způsobit, že $game_concept_characters$ budou více nakloněni připojit se k vašim [Concept('schemes','intrikám')|E]...\n\n#TUT Způsob, jakým se rozhodnete komunikovat s ostatními postavami, často ovlivní jejich názor na vás.#!" # todo: CONCEPT CASE
 lesson_basics_resources_1: "[Concept('gold_i','@gold_icon!')|E] Zlato ($lesson_basics_resources$)" # todo: CONCEPT CASE
 lesson_basics_resources_1_desc: "K dosažení svých cílů budete potřebovat [Concept('gold','zlato')|E]. Mimo jiné zlata platí za [Concept('buildings','budovy')|E], [Concept('armies','armády')|E] a úplatky. Zlato se pasivně sbírá z vašich [Concept('holdings','držav')|E] i z vašich [Concept('vassals','vazalů')|E] jako [Concept('tax','daň')|E]. Větší $game_concept_vassals$ a důležitější $game_concept_holdings$ obvykle dávají více $game_concept_tax$.\n\nNicméně peníze nemohou koupit vše — některé věci lze dosáhnout pouze utracením správného množství [Concept('prestige','prestiž')|E] nebo, u náboženských záležitostí, [Concept('piety','zbožnosti')|E].\n\n#TUT Stav vašeho Zlata, Prestiže a Zbožnosti vidíte v panelu vpravo nahoře.#!\n" # todo: CONCEPT CASE
 lesson_basics_resources_2: "[Concept('prestige_i','@prestige_icon!')|E] Prestiž ($lesson_basics_resources$)" # todo: CONCEPT CASE
 lesson_basics_resources_2_desc: "Vaše [Concept('prestige','prestiž')|E] říká, jak jste vážení. Lze ji získávat pasivně v průběhu času (například držením mnoha [Concept('titles','titulům')|E]) nebo aktivně (například [Concept('marrying','uzavírání sňatku')|E] do prestižních [Concept('dynasties','dynastií')|E] nebo bojem jako [Concept('ally','spojenec')|E] ve [Concept('wars','válkách')|E]).\n\nKdykoli získáte $game_concept_prestige$, postupujete k další úrovni [Concept('prestige_level','úrovni slávy')|E]. Vyšší $game_concept_prestige_levels$ způsobí, že si vás ostatní [Concept('characters','postavy')|E] budou vážit více a otevřou mocné způsoby vedení $game_concept_war$.\n\n#TUT Některé akce #EMP stojí#! $game_concept_prestige$, například vyhlášení $game_concept_war$. Tyto akce vám umožní využít vaší slávy ve svůj prospěch, a $game_concept_characters$ si o vás nebudou myslet hůř za jejich použití.\n\nUtrácení $game_concept_prestige$ neovlivní postup k [Concept('prestige_level','úrovni slávy')|E], pouze vaše aktuální $game_concept_prestige$.#!" # todo: CONCEPT CASE
 lesson_basics_resources_3: "[Concept('piety_i','[GetLocalPlayerPietyTextIcon]')|E] Zbožnost ($lesson_basics_resources$)" # todo: CONCEPT CASE
 lesson_basics_resources_3_desc: "S velkým množstvím [Concept('piety','zbožností')|E] budete mít snazší komunikaci se svým [Concept('head_of_faith','hlavou víry')|E]. Jako $catholic_adherent$ je to papež.\n\nZbožnost lze získávat pasivně přes [Concept('learning','učenost')|E] [Concept('skill','dovednost')|E] a [Concept('virtuous','ctnostný')|E] [Concept('traits','rysy')|E] nebo aktivně skrze zbožné činy, jako je pouť ([Concept('pilgrimage','pouť')|E]).\n\nMáte také [Concept('piety_level','úrovně oddanosti')|E], který se buduje postupně, kdykoli získáte $game_concept_piety$ a může mít pro vaši postavu pozitivní efekty.\n\n#TUT Podobně jako u Prestiže některé akce vyžadují, abyste #EMP utratili#! $game_concept_piety$, jako vyhlášení [Concept('holy_wars','svaté války')|E] nebo vytvoření novou [Concept('faith','víru')|E].\n\nUtrácení $game_concept_piety$ je normální a ostatní [Concept('characters','postavy')|E] si o vás kvůli tomu nebudou myslet hůř.#!" # todo: CONCEPT CASE
 lesson_basics_lifestyles_1: "Životní styly ($lesson_basics_lifestyles$)"
 lesson_basics_lifestyles_1_desc: "Kromě [Concept('traits','rysů')|E] si váš [Concept('character','postava')|E] může vybrat i [Concept('lifestyle','životní styl')|E]. Existuje [SelectLocalization( HasDlcFeature( 'wandering_nobles' ), 'number_six', 'number_five' )] $game_concept_lifestyles$, po jednom pro každou dovednost.\n\nŽivotní styly představují, čemu věnujete nejvíce snahy v každodenním životě, a každý z nich obsahuje několik souvisejících [Concept('focuses','zaměření')|E].\n\nKaždý $game_concept_focus$ vám dává jedinečnou výhodu a zvyšuje pravděpodobnost výskytu událostí spojených s tímto zaměřením." # todo: CONCEPT CASE
 lesson_basics_lifestyle_open_window_tt: "Klikněte na tlačítko Životní styl (zvýrazněno)"
 lesson_basics_lifestyles_2: "Zaměření ($lesson_basics_lifestyles$)"
 lesson_basics_lifestyles_no_GUI_highlight: "$lesson_basics_lifestyles_2$"
 lesson_basics_lifestyles_2_desc: "Klikněte na libovolný [Concept('lifestyle','životní styl')|E], abyste viděli jeho [Concept('focuses','zaměření')|E].\n\nS postupem času váš [Concept('character','postava')|E] získává [Concept('lifestyle_experience','zkušenosti životního stylu')|E] za zachovávání konkrétního životní styl. Když získáte dostatek $game_concept_lifestyle_experience$, můžete si vybrat jeden z [Concept('perks','talentů')|E] toho životního stylu z #EMP kterýkoliv#! z jeho stromů.\n\nTalenty představují vaši praxi a rozvoj v průběhu času a nabízejí jedinečné bonusy (například speciální rysy) nebo odemykají mechaniky a obsah specifické pro životní styl (například možnost zahájit [GetScheme('abduct').GetTypeName] [Concept('schemes','intriky')|E]).$lesson_basics_lifestyles_2_reuse$" # todo: CONCEPT CASE
 lesson_basics_lifestyles_2_reuse: "\n\n#TUT Například, $martial_strategy_focus_short$, $martial_authority_focus_short$ a $martial_chivalry_focus_short$ zaměření všechna udělují Válečné zkušenosti, které lze použít k získání kteréhokoli z [Concept('perks','talentů')|E] válečného životního stylu.\n\nDokončení stromů Perků vede k různým rysům životního stylu!#!" # todo: CONCEPT CASE
 lesson_basics_lifestyle_choose_focus_tt: "Vyberte zaměření"
 lesson_basics_lifestyles_2_b: "$lesson_basics_lifestyles_2$"
 lesson_basics_lifestyles_2_b_desc: "Po výběru [Concept('focus','zaměření')|E] jste si možná už uhodli, že váš [Concept('character','postava')|E] bude s časem získávat [Concept('lifestyle_experience','zkušenosti životního stylu')|E]. $lesson_basics_lifestyles_2_reuse$" # todo: CONCEPT CASE
 lesson_basics_interacting_1: "Ostatní postavy ($lesson_basics_interacting$)"
 lesson_basics_interacting_1_desc: "Nyní, když jste si vybrali [Concept('focus','zaměření')|E], můžeme přejít k ostatním lidem! Interakce s ostatními [Concept('characters','postavami')|E] jsou v Crusader Kings III klíčové a máte mnoho možností, jak na ně reagovat.\n\n#TUT Na portrét postavy (včetně vašeho vlastního) můžete kliknout pravým tlačítkem a zobrazit seznam možných [Concept('interactions','interakcí')|E], jako je domluvení [Concept('marriage','sňatek')|E] nebo zahájení [Concept('scheme','intrika')|E]. Zde také začínáte [Concept('wars','války')|E], ale to si necháme na později.#!" # todo: CONCEPT CASE
 lesson_basics_open_character_view_tt: "Otevřete zobrazení své postavy"
 lesson_basics_open_interactions_tt: "Klikněte pravým tlačítkem na portrét $game_concept_character$ vašeho [Concept('player_heir','hráčského dědice')|E], abyste viděli dostupné interakce" # todo: CONCEPT CASE
 lesson_basics_interacting_2: "Poslat dar ($lesson_basics_interacting$)"
 lesson_basics_interacting_2_desc: "Začněme základy — každý má rád zlato! Zkuste poslat úplatek svému [Concept('player_heir','hráčskému dědici')|E].\n\n#TUT Většina [Concept('interactions','interakce')|E] po výběru otevře druhé okno s podrobnostmi. V tomto okně můžete akci potvrdit nebo zrušit.#!" # todo: CONCEPT CASE
 lesson_basics_send_gift_tt: "Potvrďte interakci #TUT_KW Poslat dar#! s vaším dědicem" # todo: CONCEPT CASE
 lesson_basics_interacting_3: "Dar odeslán ($lesson_basics_interacting$)"
 lesson_basics_interacting_3_desc: "Skvěle! Úspěšně jste #P zvýšil#! něčí [Concept('opinion','mínění')|E] na vás.\n\n#TUT Všimněte si #bold feed message#! v pravém dolním rohu — zde se zobrazují #EMP mírně zajímavé, ale neklíčové#! informace, a po chvíli, když se pozastavení ukončí, zmizí.#!\n\nNěkteré modifikátory Názoru vydrží navždy, například rodinné vazby. Jiné časem slábnou, například blednoucí paměť na obdržení peněžitého daru...\n\n#TUT Pokud najedete kurzorem na číslo Názoru u jiné Postavy, uvidíte přesně, odkud jednotlivá čísla pocházejí. Je to kvůli manželské alianci, daru zlata, nebo prostě proto, že oceňují vaši upřímnou povahu?#!" # todo: CONCEPT CASE
 lesson_basics_many_lives_1: "Vedení rodiny ($lesson_basics_succession$)"
 lesson_basics_many_lives_1_desc: "Teď si promluvme o vaší [Concept('dynasty','dynastii')|E]. Jak hra pokračuje, pokud se váš [Concept('character','postava')|E] nesetká s nečekanou „nehodou“ nebo děsivou nemocí, zestárne a nakonec zemře.\n\n#TUT Příběh tím nekončí — jedná se o [Concept('game_over','konec hry')|E] jen pokud nemáte dědice ze své vlastní dynastie!#!" # todo: CONCEPT CASE
 lesson_basics_many_lives_2: "Dědic ($lesson_basics_succession$)"
 lesson_basics_many_lives_2_no_GUI_highlight: "$lesson_basics_many_lives_2$"
 lesson_basics_many_lives_2_desc: "Pokud mají vaše [Concept('titles','tituly')|E] [Concept('heirs','dědici')|E] z vaší [Concept('dynasty','dynastie')|E], vaše dědictví bude pokračovat. Když váš současný [Concept('character','postava')|E] zemře, jednoduše začnete hrát novou postavu: [Concept('player_heir','hráčského dědice')|E].\n\nV závislosti na typu [Concept('succession','nástupnictví')|E], které má vaše [Concept('realm','panství')|E], to pravděpodobně bude jedno z vašich dětí — možná to, které jste připravovali, aby [Concept( 'ruler', 'Rule' )|E]?\n\n#TUT Vaše $game_concept_dynasty$ má svůj vlastní erb, který je nyní zvýrazněný, a lze na něj kliknout pro více informací.\n\nNyní s tím nemusíte nic dělat, ale pokud se později chcete podívat na podrobnosti své dynastii, najdete je zde.\n\n#!" # todo: CONCEPT CASE
 lesson_basics_succession_laws: "Zákony následnictví ($lesson_basics_succession$)"
 lesson_basics_succession_laws_desc: "[Concept('succession_laws','Zákony nástupnictví')|E] určují, jak jsou všechny [Concept('titles','tituly')|E] a zdroje rozděleny mezi [Concept('heirs','dědici')|E], když [Concept('character','postava')|E] zemře. V současnosti máte jen jednoho dědice, ale podívejme se na to i tak!\n\n#TUT V některých případech, když převezmete svou novou postavu, můžete dokonce zjistit, že je odpovědná za předčasný konec vašeho předchozího vládce...#!" # todo: CONCEPT CASE
 lesson_basics_succession_tab_tt: "Prohlédněte si záložku Nástupnictví"
 lesson_basics_succession_laws_complete_2: "$lesson_basics_succession_laws$"
 lesson_basics_succession_laws_complete_2_desc: "$lesson_basics_succession_laws_desc$"
 lesson_basics_renown: "Sláva ($lesson_basics_succession$)"
 lesson_basics_renown_no_GUI_highlight: "$lesson_basics_renown$"
 lesson_basics_renown_no_GUI_highlight_2: "$lesson_basics_renown$"
 lesson_basics_renown_desc: "Jako člen [Concept('dynasty','dynastie')|E] máte také [Concept('dynasty_prestige','věhlasu')|E]. Sdílené všemi ve vaší dynastii se věhlasem zvyšuje různými způsoby a odráží, jak (ne)slavná je vaše #EMP dynastie#!, místo pouze vás.\n\nZvýšení $game_concept_dynasty_prestige$ bude mít dopad do generací vašich potomků a zvýší váš [Concept('dynasty_prestige_level','úroveň věhlasu')|E]. Jako [Concept('dynast','hlava dynastie')|E] (nejmocnější člen vaší dynastii) vám Sláva umožní odemknout [Concept('dynasty_perks','dynastické odkazy')|E], které prospějí všem vašim příbuzným.\n\n#TUT Pro zobrazení dynastický odkaz dynastie klikněte na její erb.#!" # todo: CONCEPT CASE
 lesson_basics_marriage_concept_1: "Manželství ($lesson_basics_marriage$)"
 lesson_basics_marriage_concept_1_desc: "Pro zajištění budoucnosti vaší [Concept('dynasty','dynastii')|E] potřebujete členy rodiny. Vstup do [Concept('marriage','sňatku')|E] je dobrý začátek, ale nemůžeme slíbit, že se vezmete z lásky. @arrange_marriage_icon!" # todo: CONCEPT CASE
 lesson_basics_marriage_concept_2: "Hledání manžela ($lesson_basics_marriage$)"
 lesson_basics_marriage_concept_2_b: "$lesson_basics_marriage_concept_2$"
 lesson_basics_marriage_concept_2_desc: "Vezměme se!\n\nPro svobodné postavy ve vaší [Concept('domain','doméně')|E] můžete zařídit [Concept('marriages','sňatky')|E] (nebo [Concept('betrothals','zasnoubení')|E]) kliknutím pravým tlačítkem na postavu a výběrem #TUT_KW Najít partnera#! nebo #TUT_KW Domluvit sňatek#!.\n\n#TUT Obě možnosti fungují odlišně, projdeme si je obě...#!" # todo: CONCEPT CASE
 lesson_basics_marriage_concept_2_b_desc: "I když je vaše postava již v manželství, provedeme vás kroky.\n\nPro svobodné postavy ve vašem [Concept('domain','doméně')|E] můžete sjednat [Concept('marriages','sňatky')|E] (nebo [Concept('betrothals','zasnoubení')|E]) kliknutím pravým tlačítkem na postavu a výběrem #TUT_KW Najít partnera#! nebo #TUT_KW Domluvit sňatek#!.\n\n#TUT Nemusíte se ženit s nikým jiným, ale výběr #TUT_KW Najít partnera#! otevře pro nás zobrazení Sňatků.#!" # todo: CONCEPT CASE
 lesson_basics_marriage_instruction_open_window: "$lesson_basics_marriage_concept_1$"
 lesson_basics_marriage_instruction_open_window_desc: "Najděme někoho, za koho se vaše postava provdá!"
 lesson_basics_open_interactions_marriage_tt: "Klikněte pravým tlačítkem na svou postavu"
 lesson_basics_open_interactions_marriage_alt_tt: "Klikněte pravým tlačítkem na #EMP svobodnou#! postavu"
 lesson_basics_marriage_view_tt: "Vyberte #TUT_KW Najít partnera#!"
 lesson_basics_find_spouse_concept: "Výběr partnera ($lesson_basics_marriage$)"
 lesson_basics_find_spouse_concept_desc: "Výběr #TUT_KW Najít partnera#! otevře seznam potenciálních [spouses|E] — pocházejí z [Concept('courts','dvorů')|E] po celém světě!\n\nVýběr #TUT_KW Domluvit sňatek#! také otevře seznam potenciálních [spouses|E], ale pouze s lidmi z [Concept('court','dvora')|E] postavy, na kterou jste klikli.\n\n#TUT Vaše postava je viditelná vlevo, protože tento sňatek potřebuje #EMP váš#! souhlas. Kdokoli, kdo je [Concept('liege','lenní pán')|E] druhého partnera, se zobrazí napravo, protože i tento souhlas bude potřeba.\n\n#TUT_KW Domluvit sňatek#! může být užitečné pro zprostředkování mezi vašimi [Concept('courtiers','dvořany')|E] nebo pro zajištění konkrétní sňatkové [Concept('alliance','aliance')|E]. Prozatím je pro naše účely vhodnější #TUT_KW Najít partnera#!.#!" # todo: CONCEPT CASE
 lesson_basics_arrange_marriage_concept: "Domluvit sňatek ($lesson_basics_marriage$)"
 lesson_basics_arrange_marriage_concept_desc: "\n\n#TUT Toto může být užitečné pro zprostředkování mezi vašimi [Concept('courtiers','dvořany')|E] nebo pro zajištění konkrétní sňatkové [Concept('alliance','aliance')|E].#!" # todo: CONCEPT CASE
 lesson_basics_choosing_a_spouse: "Filtr postav ($lesson_basics_marriage$)"
 lesson_basics_choosing_a_spouse_no_GUI_highlight: "$lesson_basics_choosing_a_spouse$"
 lesson_basics_choosing_a_spouse_desc: "Existuje mnoho faktorů, které je třeba zvážit při výběru [Concept('spouse','choti')|E]. Abychom vám pomohli, je k dispozici funkce filtru (zvýrazněná), která zúží seznam kandidátů. Mezi aspekty, které stojí za zvážení, patří potenciální [Concept('alliances','alianci')|E], [Concept('skills','dovednosti')|E], osobnostní [Concept('traits','rysy')|E], očekávaná [Concept('fertility','plodnost')|E] a další.\n\nNěkteré Traits jsou [Concept('congenital','vrozený')|E], což znamená, že je mohou dědit vaše děti — možná je někdo s takovým rysem dobrým výchozím bodem?\n\n#TUT Výběr můžete změnit kliknutím na tlačítko #TUT_KW Vymazat postavy#! mezi postavami, které chcete vzít. Nic se nestane, dokud nekliknete na #TUT_KW Odeslat nabídku#!.#!" # todo: CONCEPT CASE
 send_marriage_proposal_button_name: "Odeslat nabídku"
 lesson_basics_say_yes: "Odeslat nabídku ($lesson_basics_marriage$)"
 lesson_basics_said_yes: "$lesson_basics_say_yes$"
 lesson_basics_say_yes_desc: "Když vyberete dvě postavy pro vaše [Concept('marriage','sňatek')|E], zobrazí se vám podrobnosti o spojení spolu s dalšími možnostmi, jako je [Concept('matrilineal','matrilineární')|E] manželství.\n\n#TUT Pokud jste se sňatkem spokojeni, pokračujte a pošlete nabídku. Tato akce obvykle trvá několik dní, ale pro tutoriál ji uděláme okamžitou.#!" # todo: CONCEPT CASE
 lesson_basics_get_married_tt: "Vezměte se — vyberte partnera pro svou postavu a klikněte na #TUT_KW Odeslat nabídku #!, abyste navrhli svazek"
 lesson_basics_already_married: "$lesson_basics_marriage_concept_1$"
 lesson_basics_already_married_desc: "Kdykoli sjednáváte [Concept('marriage','sňatek')|E] mezi [Concept('characters','postavami')|E], posledním krokem před odesláním návrhu jsou podrobnosti o spojení spolu s dalšími možnostmi, například [Concept('matrilineal','matrilineárním')|E] manželstvím.\n\n#TUT Vaše postava je již v manželství — dobrá práce!#!" # todo: CONCEPT CASE
 lesson_basics_marriage_final_notes: "Gratulujeme! ($lesson_basics_marriage$)"
 lesson_basics_marriage_final_notes_desc: "Výborně! Přeji, ať spolu žijete dlouho a šťastně!\n\n#TUT Možná jste si všimli #bold Toast zprávy#! v horní části obrazovky — toast zprávy poskytují rychlé informace, které se týkají vás nebo vaší postavy. [Concept('marriages','Sňatky')|E] jsou obvykle také doprovázeny #bold událostí#!, kdy [Concept('liege','lenní pán')|E] vašeho potenciálního [Concept('spouse','chotě')|E] přijme (nebo odmítne) vaši nabídku dopisem. Existují různé druhy událostí a jsou zásadní pro formování vašeho osudu, takže na ně dávejte pozor!#!\n\nPro tento tutoriál doporučujeme použít #TUT_KW Najít partnera#! i pro vašeho syna.\n\n#TUT Jakmile se váš syn ožení, může začít mít děti (a [Concept('heirs','dědici')|E] pro vaše [Concept('titles','tituly')|E], kteří budou z vaší [Concept('dynasty','dynastie')|E]).#!" # todo: CONCEPT CASE
 lesson_basics_dynasty_and_house: "Dynastie a rod ($lesson_basics_titles$)"
 lesson_basics_dynasty_and_house_desc: "Rodina je důležitá! [Concept('player_heir','hráčský dědic')|E] bude vždy pocházet z vaší [Concept('dynasty','dynastie')|E], a nejčastěji z vašeho [Concept('house','rodu')|E].\n\n#TUT V budoucnu neuškodí sledovat svou rodinu — a #EMP jejich #! [Concept('line_of_succession','linie následnictví')|E]. V závislosti na jejich [Concept('succession_laws','zákony nástupnictví')|E] můžete zdědit [Concept('titles','tituly')|E] (spolu se zemí a [Concept('vassals','vazalové')|E]) od svých příbuzných.#!" # todo: CONCEPT CASE
 lesson_basics_landed_titles: "Země a tituly ($lesson_basics_titles$)"
 lesson_basics_landed_titles_desc: "Ne každý ve vaší [Concept('dynasty','dynastii')|E] bude vlastníkem pozemků, ale každý pozemek na mapě #EMP má#! vlastníka.\n\nNěkdy je tím vlastníkem vy, jindy jeden z vašich [Concept('vassals','vazalů')|E], a někdy je to zcela jiné [Concept('realm','panství')|E] (mnozí z nich také mají, nebo jsou, $game_concept_vassals$)." # todo: CONCEPT CASE
 lesson_basics_de_jure_titles: "Tituly ($lesson_basics_titles$)"
 lesson_basics_de_jure_titles_desc: "Většina [Concept('titles','titulů')|E] patří do pyramidové hierarchie podle jejich $game_concept_title$ [Concept('title_tier','úroveň')|E]:\n\n[Concept('barony','Baronství')|E] — vládne baron nebo baronka\n[Concept('county','Hrabství')|E] — vládne hrabě nebo hraběnka\n[Concept('duchy','Vévodství')|E] — vládne vévoda nebo vévodkyně\n[Concept('kingdom','Království')|E] — vládne král nebo královna\n[Concept('empire','Říše')|E] — vládne císař nebo císařovna\n\nKaždý $game_concept_title$ je právně součástí titulem jednoho úrovně výše v řetězci, například každý $game_concept_county$ je tedy součástí vévodstvím.\n\n#TUT Poznámka: Pro tyto tituly existuje mnoho dynamických názvů — váš současný [Concept('ruler','vládce')|E] řídí „Petty Kingdom“, které odpovídá úrovni [Concept('duchy','vévodství')|E].#!" # todo: CONCEPT CASE
 lesson_basics_de_jure_cbs: "De jure $lesson_basics_de_jure_titles$"
 lesson_basics_de_jure_cbs_desc: "Říkáme 'legálně', protože Crusader Kings III vám dovoluje zasahovat do historie, a není zaručeno, že [Concept('king','král')|E] je #EMP skutečně#! v kontrole všech [Concept('titles','titulů')|E], které má jeho [Concept('kingdom','království')|E] 'správně' obsahovat v rámci svých hranic.\n\nTuto hierarchii titul nazýváme [Concept('de_jure','de iure')|E], a pokud byla struktura rozbita, často je možné vyhlásit válku kvůli odpadlým územím.\n\n#TUT Pokud přepnete do mapového režimu Tituly vévodství, uvidíte, že jako vládce [Concept('duchy','vévodství')|E] $d_munster$ by měl právně být [Concept('county','hrabství')|E] $c_desmond$ součástí vašeho panství.#!" # todo: CONCEPT CASE
 lesson_basics_de_jure_cbs_complete_1: "$lesson_basics_de_jure_cbs$"
 lesson_basics_de_jure_cbs_complete_2: "$lesson_basics_de_jure_cbs$"
 lesson_basics_change_map_mode_1_tt: "Přepněte do mapového režimu Tituly vévodství"
 lesson_basics_change_map_mode_2_tt: "Vraťte se do mapového režimu Panství"
 lesson_basics_holdings_and_buildings: "Vaše državy ($lesson_basics_holdings$)"
 lesson_basics_holdings_and_buildings_desc: "De jure titul Munster se skládá ze čtyř [Concept('counties','hrabství')|E]. Jejich jména by měla být viditelná na mapě: $c_thomond$ a $c_ennis$ (držené vámi), $c_desmond$ (držený sousedním [Concept('ruler','vládci')|E]) a $c_ormond$ (držený vaším [Concept('vassal','vazalem')|E]).\n\nTyto [Concept('counties','hrabství')|E] se skládají z menších částí země — [Concept('baronies','baronství')|E], jednotlivých [Concept('holdings','držav')|E] v rámci [Concept('realm','panství')|E].\n\n#TUT Državy představují osady na vašem území!#!" # todo: CONCEPT CASE
 lesson_basics_buildings: "Vaše budovy ($lesson_basics_holdings$)"
 lesson_basics_buildings_no_GUI_highlight: "Budovy ($lesson_basics_holdings$)"
 lesson_basics_buildings_desc: "[Concept('holdings','Državy')|E] poskytují různé úrovně [Concept('taxes','daní')|E] a [Concept('levies','odvedenci')|E], stejně jako [Concept('buildings','budovy')|E], které můžete postavit a vylepšit v závislosti na [Concept('holding_type','typ državy')|E].\n\n#TUT Doporučujeme začít vylepšením #TUT_KW $building_curtain_walls_01$.#!#!" # todo: CONCEPT CASE
 lesson_basics_start_construction_tt: "Klikněte na své hlavní držení ($cn_luimneach$), vyberte mezi jeho budovami #TUT_KW $building_curtain_walls_01$#! a #TUT_KW Vylepšit#! tuto stavbu"
 lesson_basics_buildings_complete: "$lesson_basics_holdings_and_buildings$"
 lesson_basics_buildings_complete_desc: "Výborně! [Concept('building','budova')|E] však bude potřebovat nějaký čas, než bude připraven — $cn_luimneach$ nebyl postaven za den... Klidně zavřete okno výstavby #EMP $building_type_curtain_walls_01$#!.\n\n#TUT Jakmile bude vaše výstavba dokončena, obdržíte výhody vybrané budovy nebo vylepšení.#!" # todo: CONCEPT CASE
 lesson_basics_taxes: "Zdanění ($lesson_basics_holdings$)"
 lesson_basics_taxes_desc: "Každé [Concept('holding','država')|E] poskytuje [Concept('taxes','daně')|E] svému [Concept('holder','držiteli')|E]. Pokud je tím držitelem [Concept('vassal','vazalem')|E], ten zase zaplatí daně svému [Concept('liege','lennímu pánovi')|E].\n\nDaně jsou váš hlavní zdroj [gold_i] [Concept('gold','zlato')|E] [Concept('income','příjem')|E]!\n\n#TUT [Concept('obligations','Povinnosti')|E] mohou ovlivnit, jak vysoké nebo nízké tyto daně jsou. Být ve [Concept('war','válce')|E] může ovlivnit úroveň [Concept('control','kontrola')|E] v [Concept('county','hrabství')|E], což následně ovlivňuje daně.#!" # todo: CONCEPT CASE
 lesson_basics_vassals_concept: "Vazalové ($lesson_basics_vassals$)"
 lesson_basics_realm_view_tt: "Otevřete zobrazení říše vpravo na obrazovce (zvýrazněno)"
 lesson_basics_vassals_tab_tt: "Prohlédněte si záložku Vazalové"
 lesson_basics_vassals_concept_desc: "Jako [Concept('ruler','vládce')|E] pravděpodobně budete [Concept('liege','lenní pán')|E] alespoň jednoho [Concept('vassal','vazala')|E]. Jsou to $game_concept_rulers$, kteří vám složili věrnost a jsou tak součástí vašeho [Concept('realm','panství')|E].\n\n#TUT Vazalové vám dodávají [Concept('gold','zlato')|E] ([Concept('taxes','daně')|E]) a vojáky ([Concept('levies','odvedence')|E]).\n\nJe možné být současně $game_concept_liege$ i $game_concept_vassal$.#!" # todo: CONCEPT CASE
 lesson_basics_vassals_concept_complete_2: "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_great_job: "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_great_job_desc: "Zde je seznam vašich současných [Concept('vassals','vazalů')|E], spolu s dalšími informacemi o nich.\n\nNa vrcholu seznamu je [Concept('ruler','vládce')|E] z $c_ormond$, jehož území můžete vidět na mapě — jedná se o Earldom (titulu [Concept('county','hrabství')|E]-[Concept('title_tier','úrovni')|E] [Concept('title','titulu')|E]) ve vašem [Concept('realm','panství')|E].\n\n#TUT Zde získáte přehled věcí, jako je aktuální [Concept('opinion','mínění')|E] vašich vazalů vůči vám, zda jsou považováni za [Concept('powerful_vassal','mocného vazala')|E] nebo ne, a úrovně [Concept('taxes','daní')|E] a [Concept('levies','odvedenci')|E], které vám momentálně poskytují.#!" # todo: CONCEPT CASE
 lesson_basics_vassals_concept_greyed_out: "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_greyed_out_desc: "Zde také můžete změnit [Concept('vassal_contracts','vazalské smlouvy')|E], které určují, kolik (nebo málo) [Concept('levies','odvedenci')|E] a [Concept('taxes','daně')|E] vám feudální [Concept('vassal','vazal')|E] poskytne." # todo: CONCEPT CASE
 lesson_basics_happy_vassals: "$lesson_basics_vassals_concept$"
 lesson_basics_happy_vassals_desc: "Vyplatí se udržovat své [Concept('vassals','vazaly')|E] spokojené — to je drží mimo [Concept('schemes','intrik')|E] a [Concept('factions','frakce')|E] proti vám.\n\nNezáleží na tom, jak mocným [Concept('ruler','vládci')|E] je váš [Concept('character','postava')|E], pokud se vaše [Concept('realm','panství')|E] sjednotí proti vám, buď aby vás [Concept('depose','sesadit')|E] prostřednictvím [Concept('war','války')|E], nebo prostě aby se vás pokusili [GetScheme('murder').GetTypeName], zatímco spíte, vaše vláda bude jistě ukončena dříve.\n\n#TUT Někteří z vašich vazalů mohou sloužit ve vašem [Concept('council','radě')|E], což dělá jejich [Concept('opinion','mínění')|E] obzvlášť důležitou, protože jim budou svěřeny [Concept('councillor_tasks','úkoly rádce')|E].#!" # todo: CONCEPT CASE
 lesson_basics_vassal_limit: "Limit vazalů ($lesson_basics_vassals$)"
 lesson_basics_vassal_limit_desc: "Existuje limit, kolika [Concept('vassals','vazalům')|E] můžete pohodlně řídit, než se vaše [Concept('realm','panství')|E] stane neudržitelným. Překročení tohoto [Concept('vassal_limit','limitu vazalů')|E] ovlivní [Concept('taxes','daně')|E] a [Concept('levies','odvedenci')|E], které vám poskytují.\n\nTo pro tutoriál není důležité, ale až začnete budovat své vlastní království, dejte si pozor, abyste příliš rychle nerostli.\n\n#TUT Pokud nakonec překročíte svůj limit vazalů, můžete udělit nižší tituly svým vazalům. Někdy můžete dokonce [Concept('create','vytvořit')|E] #EMP nové#! vysoce-[Concept('title_tier','úroveň')|E] tituly, abyste konsolidovali svou moc v regionu a posílili svou kontrolu nad nižšími tituly [Concept('de_jure','de iure')|E], podřízenými vašemu novému titulu.#!" # todo: CONCEPT CASE
 lesson_basics_domain_1: "Říše a doména ($lesson_basics_domain$)"
 lesson_basics_domain_1_desc: "Vaše #EMP [Concept('realm','panství')|E]#! je kompletní soubor země a [Concept('titles','tituly')|E], které ovládáte, včetně oblastí držených vašimi [Concept('vassals','vazaly')|E]. Pro vás to nyní znamená [Concept('counties','hrabství')|E] (nazývané 'Earldoms', kvůli vaší irské [Concept('culture','kultuře')|E]) $c_ennis$, $c_thomond$ a $c_ormond$.\n\nKdyž je použito #EMP [Concept('domain','doména')|E]#!, odkazujeme na zemi, kterou vlastníte osobně, bez vazalů: $c_ennis$ a $c_thomond$.\n\n#TUT Některé události budou ovlivňovat pouze vaši [Concept('domain','doménu')|E] ($c_ennis$ a $c_thomond$), zatímco jiné ovlivní celou vaši [Concept('realm','panství')|E], [Concept('duchy','vévodství')|E] (nebo 'Petty Kingdom') Munster.#!" # todo: CONCEPT CASE
 lesson_basics_domain_1_b: "Říše a doména ($lesson_basics_domain$)"
 lesson_basics_domain_1_b_desc: "Příklad: [Concept('county','hrabství')|E] Essex zaznamenává pokles počtu dostupných vojáků, protože oblast je zaplavena #EMP kanibaly#!. [Concept('holder','Držitel')|E] Essexu bude o této události informován, protože se nachází uvnitř hranic jeho [Concept('domain','domény')|E]. Jeho [Concept('liege','lenního pána')|E] nebude. \n\n#TUT #EMP Pán#! hraběte z Essexu má Essex ve svém [Concept('realm','panství')|E] a dozví se, co se děje, jen pokud klikne na hrabství na mapě a uvidí modifikátor. Nebo pokud si všimne, že jeho vazal dodává méně [Concept('levies','odvedenci')|E].#!" # todo: CONCEPT CASE
 lesson_basics_domain_2: "$lesson_basics_domain_1$"
 lesson_basics_domain_2_desc: "Všimněte si, že existuje limit, kolik země můžete osobně držet, než začnete dostávat tresty: [Concept('domain_limit','limit domény')|E].\n\n#TUT Když překročíte svůj limit domény, může být dobré použít interakci #TUT_KW Udělit titul#! na [Concept('characters','postavy')|E], s nimiž jste v přátelském vztahu, a učinit je svými [Concept('vassals','vazaly')|E].\n\nProtože nyní nemáte žádné volné tituly k rozdělení, nemůžete to momentálně udělat, ale jinak byste tuto možnost našli v menu $game_concept_character$, které je viditelné po kliknutí pravým tlačítkem na postavu.#!" # todo: CONCEPT CASE
 lesson_basics_council_concept: "Rada ($lesson_basics_council$)"
 lesson_basics_council_concept_desc: "Správa [Concept('realm','panství')|E] je hodně práce. Jako [Concept('ruler','vládce')|E] máte pomoc své [Concept('council','radu')|E] — ti mohou být buď [Concept('vassals','vazalové')|E] nebo členové vašeho [Concept('court','dvora')|E] a slouží jako vaši důvěryhodní poradci.\n\n#TUT Existuje místo v radě odpovídající každému [Concept('skill','dovednosti')|E] a ženatí/vdaní [Concept('rulers','vládci')|E] budou mít také svého [Concept('spouse','chotě')|E], který jim bude pomáhat.#!" # todo: CONCEPT CASE
 lesson_basics_council_view_tt: "Otevřete zobrazení Rady (zvýrazněno)"
 lesson_basics_council_tasks: "Úkoly rady ($lesson_basics_council$)"
 lesson_basics_council_tasks_desc: "[Concept('councillors','Rádci')|E] lze přiřadit do práce a každý dělá různé věci!\n\nÚkol radního můžete změnit kliknutím na tlačítko vedle jejich portrétu v zobrazení Rady.\n\n#TUT Být radním je prestižní pozice — [Concept('powerful_vassals','mocní vazalové')|E] očekávají jmenování a budou nespokojeni, pokud budou vynecháni.#!" # todo: CONCEPT CASE
 lesson_basics_schemes_concept: "Intriky ($lesson_basics_schemes$)"
 lesson_basics_schemes_concept_complete: "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_concept_desc: "[Concept('schemes','Intriky')|E] jsou dlouhodobé cíle, zacílené na jinou postavu. Mohou mít nepřátelské cíle, například snažit se [GetScheme('murder').GetTypeName] nebo [GetScheme('abduct').GetTypeName] vašeho cíle, nebo být příjemnější, jako [GetScheme('befriend').GetTypeName] intrika." # todo: CONCEPT CASE
 lesson_basics_intrigue_view_tt: "Otevřete zobrazení Intrik (zvýrazněno)"
 lesson_basics_schemes_tab_tt: "Prohlédněte si záložku Intriky (měla by být otevřená ve výchozím nastavení)"
 lesson_basics_hooks_and_secrets_tab_tt: "Prohlédněte si záložku Páky a tajemství"
 lesson_basics_schemes_murder: "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_murder_desc: "Vhodný čas použít [Concept('scheme','intrika')|E] může nastat, když zjistíte, že [Concept('line_of_succession','linie následnictví')|E] není tak jasný a příznivý, jak byste chtěli — jedním způsobem, jak se posunout vpřed, je jednoduše #EMP odstranit#! konkurenci.\n\nPotichu, bez svědků.\n\n#TUT Pokus o [GetScheme('murder').GetTypeName] nese riziko odhalení. Pokud se pokus nezdaří, učiní to vaši postavu nepopulární — zvláště u vašeho zamýšleného cíle.#!" # todo: CONCEPT CASE
 lesson_basics_schemes_sway: "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_sway_desc: "Sway [Concept('scheme','intrika')|E] slouží ke zvýšení [Concept('opinion','mínění')|E], kterou má někdo o vaší postavě. Zkusme to!" # todo: CONCEPT CASE
 lesson_basics_schemes_sway_complete: "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_sway_complete_desc: "Výborně! Jakmile je váš [Concept('scheme','intrika')|E] uveden do pohybu, bude pomalu postupovat v čase. Doba do dosažení závěru se liší podle [Concept('success_chance','šancí na úspěch')|E] Plánu, na kterou mohou mít vliv příslušné [Concept('skills','dovednost')|E] — v tomto případě ji ovlivňuje vaše [Concept('diplomacy','diplomacie')|E].\n\n#TUT Pokud nejste s plánem spokojeni, můžete ho kdykoli zrušit kliknutím na #bold Opustit plán#! (#TUT_KW X#!) tlačítka vedle plánu.#!" # todo: CONCEPT CASE
 tutorial_basic_schemes_start_swaying_tt: "Pravým tlačítkem klikněte na svého [Concept('court_chaplain','dvorního kaplana')|E] (váš „$councillor_court_chaplain_theocrat_duchy$“) a zvolte #TUT_KW Ovlivnit (plán)#!" # todo: CONCEPT CASE
 lesson_basics_hooks: "Tajemství ($lesson_basics_schemes$)"
 lesson_basics_hooks_desc: "Někdy z [Concept('schemes','intrik')|E] vzejdou [Concept('secrets','tajemství')|E] — pokud chytíte někoho při pokusu spáchat [GetScheme('murder').GetTypeName], je v jeho zájmu zajistit, aby to zůstalo tiché.\n\nMůžete je také [Concept('blackmail','vydírání')|E], abyste získali [Concept('hook','páka')|E]! $game_concept_hooks$ představují laskavost, kterou můžete uplatnit, nebo páku, kterou nad konkrétním [Concept('character','postavou')|E] máte, a umožňují vám je povzbuzovat (nebo nutit) k tomu, aby dělali, co chcete.\n\nBěhem hraní najdete mnoho různých způsobů, jak získávat a používat $game_concept_hooks$. Experimentujte s nimi!\n\n#TUT Nyní si představme, že se vám podařilo získat [Concept('hook','páka')|E] na jednom z vašich [Concept('vassals','vazalů')|E]...#!" # todo: CONCEPT CASE
 lesson_basics_hooks_complete: "Páky ($lesson_basics_schemes$)"
 lesson_basics_hooks_complete_desc: "Tento [Concept('weak_hook','slabá páka')|E] lze použít k řadě věcí. Například můžete zvýšit [Concept('obligations','povinnosti')|E] stanovené [Concept('vassal_contract','vazalskou smlouvu')|E], který máte s [GetGovernment('feudal_government').GetName] [Concept('vassal','vazalem')|E].\n\n#TUT Pro přístup k nabídce pro změnu Vassal Contract přejděte do seznamu vazalů v zobrazení Říše, nebo na jeho portrét klikněte pravým tlačítkem a zvolte #TUT_KW Upravit smlouvu s vazalem.#!\n\nMůžete si všimnout, že některé interakce nejsou okamžitě viditelné. Když máte k dispozici mnoho interakcí, nabídka interakcí [Concept('character','postavy')|E] zobrazuje pouze nejběžnější z nich.\n\nChcete‑li zobrazit chybějící interakce, klikněte v kategorii na tlačítko „Více...“.#!" # todo: CONCEPT CASE
 lesson_basics_culture_open_view: "Kultury"
 lesson_basics_culture_open_view_desc: "Každý [Concept('character','postava')|E] a [Concept('county','hrabství')|E] patří do [Concept('culture','kultury')|E]. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_open_view_desc_INGAME', '' )]" # todo: CONCEPT CASE
 lesson_basics_culture_open_view_desc_INGAME: "\n\nVáš současný [Concept('ruler','vládce')|E] je součástí kultury [GetPlayer.GetCulture.GetNameNoTooltip], která je zobrazena v levém dolním rohu." # todo: CONCEPT CASE
 lesson_basics_culture_open_view_trigger: "Otevřete přehled kultury (zvýrazněno)"
 lesson_basics_culture_elements: "Kultury"
 lesson_basics_culture_elements_desc: "Kulturu ([Concept('culture','kulturu')|E]) definuje její [Concept('ethos','étos')|E], [Concept('culture_pillars','kulturní pilíře')|E] a [Concept('traditions','tradice')|E]. Každá z těchto položek určuje různé výhody nebo nevýhody pro všechny členy kultury.\n\n#V Etos#! popisuje základní hodnoty kultury. Je hlavním určujícím faktorem toho, které tradice jsou pro kulturu dostupné. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_elements_desc_INGAME', '' )]\n\n#V Kulturní pilíře#! odrážejí původ kultury a také je nelze změnit. Silně ovlivňují [Concept('cultural_acceptance','kulturní přijetí')|E] vůči jiným kulturám, ale jinak mají menší význam než Etos.\n\n#V Tradice#! kultury jsou flexibilnější, ale stále mohou být mimořádně důležité pro kulturu. Na rozdíl od Etosu a pilířů lze tradice měnit Hlavy kultury, což bude naše další téma." # todo: CONCEPT CASE
 lesson_basics_culture_elements_desc_INGAME: "Etos vaší kultury, [GetPlayer.GetCulture.GetCollectiveNounNoTooltip], je [GetPlayer.GetCulture.GetEthos.GetName]."
 lesson_basics_culture_culture_head: "Kultury (hlava kultury)"
 lesson_basics_culture_culture_head_desc: "[Concept('culture_head','Hlava kultury')|E] je [Concept('ruler','vládce')|E] kultury s největším [Concept('realm','panstvím')|E]. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_culture_head_desc_INGAME', '' )]\n\nHlava kultury může pro svou kulturu zavádět nové tradice.\n\nHrají také důležitou roli v technologickém a společenském rozvoji své kultury, na což se nyní podíváme." # todo: CONCEPT CASE
 lesson_basics_culture_culture_head_desc_INGAME: "[SelectLocalization(ObjectsEqual(GetPlayer, GetPlayer.GetCulture.GetCultureHead), 'lesson_basics_culture_culture_head_desc_YOU', 'lesson_basics_culture_culture_head_desc_OTHER' )]"
 lesson_basics_culture_culture_head_desc_YOU: "Jste hlava své kultury."
 lesson_basics_culture_culture_head_desc_OTHER: "[GetPlayer.GetCulture.GetCultureHead.GetName] je hlava vaší kultury."
 lesson_basics_culture_innovations_open: "Kultury (inovace)"
 lesson_basics_culture_innovations_open_desc: "Vaše [Concept('culture','kultura')|E] určuje, ke kterým [Concept('innovations','inovaci')|E] máte přístup, které jsou zobrazeny na záložce Inovace." # todo: CONCEPT CASE
 lesson_basics_culture_open_innovations_tab_trigger: "Otevřete záložku Inovace (zvýrazněno)"
 lesson_basics_culture_innovations: "Kultury (inovace)"
 lesson_basics_culture_innovations_desc: "[Concept('innovations','Inovace')|E] jsou vynálezy a adaptace, které může [Concept('culture','kultura')|E] v průběhu času objevit. Inovace poskytují nové bonusy, [Concept('buildings','budovy')|E] a [Concept('men_at_arms','ozbrojenci')|E] pro všechny členy kulturu.\n\nInovace jsou seskupeny do [Concept('eras','ér')|E], takže většina inovací jednoduše není dostupná v raných částech hry. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_innovations_desc_INGAME', '' )]" # todo: CONCEPT CASE
 lesson_basics_culture_innovations_desc_INGAME: "Vaše kultura je aktuálně v éře [GetPlayer.GetCulture.GetCultureEra.GetName]."
 lesson_basics_culture_innovations_spread: "Kultury (inovace)"
 lesson_basics_culture_innovations_spread_desc: "[Concept('innovations','Inovace')|E] jsou obvykle objevovány velmi pomalu. Hlava kultury ale může také urychlit objevení inovace pro svoji kulturu tím, že ji zvolí jako kulturní [Concept('fascination','fascinace')|E] (zvýrazněno).\n\n#I Když jste hlavou kultury, můžete kliknout na inovaci a nastavit ji jako nové Fascinace.#!\n\nKultury také objevují inovace rychleji, pokud je již objevily sousední kultury." # todo: CONCEPT CASE
 lesson_basics_religion_1: "Vyznání a náboženství"
 lesson_basics_religion_1_read_only: "$lesson_basics_religion_1$"
 lesson_basics_religion_1_desc: "Všichni [Concept('characters','postavy')|E] vyznávají nějaké [Concept('faith','víra')|E], které patří do určitého [Concept('religion','náboženství')|E]. Například katolicismus je $game_concept_faith$, který náleží k $christianity_religion$.\n\nKaždé víře se liší od jiného víry — podívejme se blíže." # todo: CONCEPT CASE
 lesson_basics_religion_click_religion_tt: "Otevřete přehled vyznání (zvýrazněno)"
 lesson_basics_religion_2: "Doktríny ($lesson_basics_religion$)"
 lesson_basics_religion_2_desc: "Vaše [Concept('faith','víra')|E] má řadu [Concept('doctrines','doktríny')|E]. Tyto $game_concept_doctrines$ nastavují pravidla pro členy víru a určují mnoho věcí, jako jsou dostupné Gender [Concept('succession_laws','zákony nástupnictví')|E] nebo které postavy mohou vlastnit [Concept('temple_holdings','chrámové državy')|E].\n\n[Concept('core_tenets','Zásady')|E], nahoře, jsou speciální $game_concept_doctrines$, které poskytují bonusy nebo možnosti vaší postavě, jako schopnost meditovat nebo účastnit se [Concept('great_holy_wars','velkými svatými válkami')|E].\n\n#TUT Všechny vyznání také mají [Concept('sins','hříchy')|E] a [Concept('virtues','ctnosti')|E], které označují chování, jež je buď odsuzováno, nebo oslavováno vašimi vrstevníky.#!" # todo: CONCEPT CASE
 lesson_basics_religion_3: "@fervor_icon! Horlivost ($lesson_basics_religion$)"
 lesson_basics_religion_3_desc: "Všechna [Concept('faiths','víry')|E] mají [Concept('fervor','horlivost')|E], které v čase kolísá v závislosti na počtu stoupenců daného víry, na tom, jak se daří [Concept('holy_wars','svatými válkami')|E], a dalších faktorech. Horlivost představuje, jak fanaticky se v současnosti chová většina členů víry, včetně mnoha neupravených rolníků po celém světě.\n\nKdyž je $game_concept_fervor$ vašeho víry vysoké, je snazší převádět [Concept('counties','hrabství')|E] (pomocí [convert_county|E]) k vašemu víře, a $game_concept_counties$ vašeho víry #EMP odolávají#! konverzi na jiné víry.\n\nKdyž je však $game_concept_fervor$ nízké, mohou se vládci rozhodnout opustit své současné $game_concept_faith$ ve prospěch jiného z téže [Concept('religion','náboženství')|E], čímž vznikne [Concept('heresy','kacířství')|E]. \n\n#TUT Heretické $game_concept_rulers$ se spolu se svým nejbližším územím a vazaly převádějí a jsou svobodní šířit své nové víru místo toho starého.#!" # todo: CONCEPT CASE
 lesson_basics_religion_4: "Nové vyznání ($lesson_basics_religion$)"
 lesson_basics_religion_4_no_GUI_highlight: "$lesson_basics_religion_4$"
 lesson_basics_religion_4_desc: "V zobrazení [Concept('faith','víře')|E] je možné vytvořit nové víry. [Concept('doctrines','Doktríny')|E] a [Concept('core_tenets','zásady')|E] budou stát určité množství [Concept('piety','zbožnost')|E] v závislosti na tom, jaké zásady má vaše současné $game_concept_faith$.\n\nTo není něco, čím byste se měli trápit u své první postavy, ale může to být velmi zábavný první cíl, na který se zaměříte, až budete jistější!\n\n#TUT [Concept('family_members','Členové rodiny')|E] a [Concept('vassals','vazalové')|E], kteří mají na vás vysoký [Concept('opinion','mínění')|E], se pravděpodobně připojí k vašemu novému víře, a vysoká dovednost [Concept('learning','učenost')|E] může přesvědčit mnohem více, ale kdokoli z vašeho starého víry, kdo se nepřevádí, vás bude považovat za kacíře.#!" # todo: CONCEPT CASE
 lesson_basics_warfare: "Válka ($lesson_basics_war$)"
 lesson_basics_warfare_desc: "[Concept('war','Válka')|E] je zásadní část Crusader Kings III. Existuje mnoho pojmů, které je třeba pokrýt, ale teď se jen stručně dotkneme některých z nich.\n\n#TUT Ostatní detaily si nechte objevovat při hraní.#!" # todo: CONCEPT CASE
 lesson_basics_levies: "Válka ($lesson_basics_war$)"
 lesson_basics_levies_complete: "$lesson_basics_levies$"
 lesson_basics_levies_desc: "Nejdůležitější události v jakékoli válce jsou [Concept('battles','bitvy')|E], které se bojují mezi [Concept('armies','armádami')|E]. Většina vašich vojáků pochází z [Concept('levies','odvedenců')|E], ale můžete rozšířit své armády najmutím [Concept('men_at_arms','ozbrojenci')|E].\n\n#TUT Pokud to bude opravdu těžké, můžete si také najmout [Concept('mercenaries','žoldnéři')|E] — pokud máte dost [Concept('gold','zlato')|E].#!" # todo: CONCEPT CASE
 lesson_basics_military_view_tt: "Otevřete vojenský přehled (zvýrazněno)"
 lesson_basics_rally_points: "Válka ($lesson_basics_war$)"
 lesson_basics_rally_points_desc: "Když začne [Concept('war','válka')|E], můžete svolat svá [Concept('armies','armády')|E] jediným kliknutím na velké červené „$RAISE_ALL$“ tlačítko, které se zobrazí spolu s ikonou válečným skórem vpravo dole na obrazovce — samozřejmě můžete také $RAISE_ALL$ z tohoto vojenského přehledu.\n\nKdyž $game_concept_war$ skončí, musíte své vojsko rozpustit, než začnete další $game_concept_war$.\n\n#TUT [Concept('rally_points','Shromaždiště')|E] jsou sběrná stanoviště pro [Concept('levies','odvedence')|E] a [Concept('men_at_arms','ozbrojenci')|E] pod vaším velením; tam se objeví, když je povoláte do války.#!" # todo: CONCEPT CASE
 lesson_basics_casus_belli: "Válka ($lesson_basics_war$)"
 lesson_basics_casus_belli_desc: "K vyhlášení [Concept('war','válce')|E] budete potřebovat legitimní důvod, $game_concept_casus_belli$, proti jinému [Concept('ruler','vládci')|E].\n\nExistuje mnoho způsobů, jak získat $game_concept_casus_belli$: můžete mít [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E], které dělají z vašeho cíle [Concept('rightful_liege','právoplatný lenní pán')|E], můžete zdědit [Concept('claims','nároky')|E], nebo můžete vést [Concept('holy_wars','svaté války')|E] proti blízkým nevěřícím.\n\nAčkoliv jsou to nejběžnější způsoby, existují desítky různých typů casu belli, které můžete objevovat a využívat během hry!\n\n#TUT Nejsnazší a nejpřímější způsob, jak získat $game_concept_claims$, je použít #EMP [Concept('fabricate_claim','$task_fabricate_claim$')|E]#!. O to se postará váš [Concept('court_chaplain','dvorní kaplan')|E] prostřednictvím jednoho ze svých [Concept('councillor_tasks','úkolů rádce')|E].#!" # todo: CONCEPT CASE
 lesson_basics_pausing_2: "Téměř hotovo ($lesson_basics_unpause$)"
 lesson_basics_pausing_2_desc: "Brzy vám dovolíme hru odpauznout! Ještě je pár věcí, které je třeba projít.\n\nZa prvé, je důležité vědět, že máte k dispozici pět různých rychlostí hraní (stisknutím kláves 1-5 je snadno přepnete), a můžete kdykoli pozastavit nebo změnit tempo.\n\n#BOLD Za druhé, při určitých důležitých událostech se hra automaticky pozastaví za vás.#!\n\n#TUT Není nic špatného na hraní nižšími rychlostmi — zvyšujte rychlost, když je klid, nebo ji zpomalte, když jdete do války.\n\nObecně doporučujeme hru pozastavit při prohlížení menu nebo když stojíte před těžkými rozhodnutími.#!"
 lesson_basics_pausing_3: "Zahájení hry ($lesson_basics_unpause$)"
 lesson_basics_pausing_3_desc: "Chcete‑li spustit plynutí času, odpauzněte hru (pomocí #EMP mezerníku#! nebo kliknutím na tlačítko Přehrát vpravo dole).\n\nTímto začnou plynout dny, měsíce a roky. Armády, kterým jste zadali pochod, se začnou pohybovat, události se objeví na obrazovce, dopisy budou odesílány a [Concept('characters','postavy')|E] budou stárnout.\n\n#TUT Najděte rychlost, která vám vyhovuje — můžete ji kdykoli změnit.#!" # todo: CONCEPT CASE
 lesson_declare_war_step_1: "Co teď?"
 lesson_declare_war_step_1_complete: "$lesson_declare_war_step_1$"
 lesson_declare_war_step_1_desc: "Jako první úkol připomeňme vašemu sousedovi, hraběti $c_desmond$, kdo je jeho skutečný [Concept('rightful_liege','právoplatný lenní pán')|E]... Pokud to rozšíří váš [Concept('realm','panství')|E], tím lépe!\n\nPomocí systému interakcí s postavami, který jsme probírali dříve, a výběrem ho přes mapu, vyhlaste válku [Concept('ruler','vládce')|E] z $c_desmond$. Měli byste již mít platný $game_concept_casus_belli$, protože jeho [Concept('title','titulu')|E] je [Concept('de_jure','de iure')|E] součástí vašeho panství.\n\n#TUT Pro praktičtější zkušenost vám nyní ukážeme, co se děje v průběhu války.#!" # todo: CONCEPT CASE
 lesson_declare_war_tt: "#TUT_KW Vyhlásit válku#! hraběti Muiredachovi z $c_desmond$"
 lesson_raise_troops_step_1: "Svolat vojska"
 lesson_raise_troops_step_2: "$lesson_raise_troops_step_1$"
 lesson_raise_troops_step_1_desc: "Nyní jste zapojeni do [Concept('war','války')|E]! Dále byste měli svolat své [Concept('armies','armády')|E]. Na spodní části obrazovky se objevilo tlačítko, které vám pomůže, ale můžete to udělat i z vojenského zobrazení.\n\n#TUT Kdekoliv je váš [Concept('rally_point','shromaždiště')|E], tam se váš [Concept('army','armáda')|E] shromáždí a bude čekat na vaše rozkazy.\n\nPoznámka: budete muset zrušit pauzu hry (stiskněte 'mezerník'!), aby se váš $game_concept_army$ shromáždil více než jen několik mužů. Nechte to pár dní a armáda bude na plné síle!#!" # todo: CONCEPT CASE
 lesson_declare_war_step_2: "$lesson_declare_war_step_1$"
 lesson_raise_troops_tt: "Svolejte svá vojska"
 lesson_army_movement_step_1: "Pohyb armády"
 lesson_army_movement_step_1_desc: "Chcete-li přesunout svůj [Concept('army','armádu')|E], klikněte na armádu (na mapě) a pravým tlačítkem myši klikněte na oblast, kam je chcete poslat.\n\nAbyste vyhráli [Concept('war','válka')|E], obvykle musíte obsadit nepřátelské [Concept('realm_capital','hlavní sídlo panství')|E] v [Concept('siege','obléhání')|E]. Proto by to obvykle mělo být vaším cílem při útoku.\n\n#TUT Pokud svému armádě nařídíte přeplout vodu, [Concept('embark','nalodit')|E], promění se v [Concept('fleet','loďstvu')|E]. Prozatím zůstaneme na suchu.#!" # todo: CONCEPT CASE
 lesson_army_purpose_step_1: "Armáda"
 lesson_army_purpose_step_1_desc: "Teď když se vaše [Concept('army','armáda')|E] pohybuje, pravděpodobně směřuje do bitvy s nepřátelskými silami. Může to být přímé setkání s jinými armádami, nebo začátek [Concept('siege','obléhání')|E].\n\n#TUT [Concept('battles','Bitvy')|E] se odehrají automaticky, pokud se protichůdná armádou potkají. Stejně tak $game_concept_sieges$ nastanou, když umístíte své armádu na nepřátelskou [Concept('holding','državu')|E].\n\nTeď je dobrý čas #EMP odpauznout hru#!, pokud jste to ještě neudělali. Jinak čas stojí a vaše $game_concept_armies$ se nepohybují!#!" # todo: CONCEPT CASE
 lesson_battle_mechanics_step_1: "Bitva!"
 lesson_battle_mechanics_step_1_desc: "Výsledek [Concept('battle','bitva')|E] mezi dvěma [Concept('armies','armádám')|E] závisí na mnoha věcech: počtu [Concept('levies','odvedenci')|E], které obě strany mají, které (pokud vůbec) [Concept('men_at_arms','ozbrojenci')|E] která strana nasadila, na zapojených [Concept('commanders','velitele')|E] a dokonce i na [Concept('terrain','terén')|E], ve kterém bojujete.\n\n#TUT Více podrobností získáte ve Zobrazení boje — klikněte na bojující armádu, abyste ho otevřeli.#!" # todo: CONCEPT CASE
 lesson_siege_mechanics_step_1: "Obléhání!"
 lesson_siege_mechanics_step_1_desc: "Jeden [Concept('army','armáda')|E] útočí na [Concept('holding','državu')|E]! Klikněte na zvýrazněnou ikonu (kopí!) a zjistěte, jak to probíhá.\n\nKaždá strana musí vyhrát $game_concept_sieges$, aby vyhrála většinu válek, protože zvyšují váš [Concept('war_score','válečné skóre')|E].\n\nKdykoli je $game_concept_siege$ vyhrán (trvá to několik kol útoku), oblast se stane [Concept('occupied','obsazeno')|E], což při oddálení mapy změní její běžný vzhled z plné barvy na pruhovaný." # todo: CONCEPT CASE
 lesson_warscore_step_1: "Válečné skóre"
 lesson_warscore_step_1_desc: "Pro představu, kdo v [Concept('war','válce')|E] vede, se můžete vždy podívat na [Concept('war_score','válečné skóre')|E] vpravo dole. Pohybuje se od #N -100#! do #P +100#! a mění se v závislosti na vyhraných nebo prohraných [Concept('battles','bitev')|E] a [Concept('sieges','obléhání')|E], stejně jako obsazeném území.\n\n#TUT Při #P +100#! válečném skóru můžete druhou stranu donutit přijmout vaši [Concept('peace_offer','mírovou nabídku')|E].\n\nNaopak při #N -100#! válečném skóru mohou oni donutit #EMP vás#! přijmout #EMP jejich#! [Concept('peace_offer','mírová nabídka')|E].#!" # todo: CONCEPT CASE
 lesson_warscore_step_2: "Výsledky války"
 lesson_warscore_step_2_desc: "Všechny [Concept('wars','války')|E] končí jedním ze tří způsobů:\n$EFFECT_LIST_BULLET$[Concept('victory','Vítězství')|E]\n$EFFECT_LIST_BULLET$[Concept('white_peace','Bílý mír')|E]\n$EFFECT_LIST_BULLET$[Concept('defeat','Porážka')|E]\n\nPřesné důsledky každého z nich se liší v závislosti na [Concept('casus_belli','casus belli')|E].\n\n#TUT Podrobnosti o konkrétní válce najdete pravým kliknutím na nepřátelského [Concept('ruler','vládce')|E] a výběrem #TUT_KW Nabídnout mír#!, nebo kliknutím na ikonu válečné skóre vpravo dole a následným výběrem jedné z karet ve spodní části obrazovky.#!" # todo: CONCEPT CASE
 lesson_winning_wars_step_1: "Vítězství je na dosah"
 lesson_winning_wars_step_1_desc: "Vaše [war_score] je na #P +100%#!!\n\nNyní můžete vymoci své požadavky kliknutím na ikonu válečné skóre pro otevření zobrazení války a následným výběrem karty #TUT_KW Vynutit požadavky#! ve spodní části obrazovky.\n\n#TUT Můžete také pravým tlačítkem kliknout na nepřátelského [Concept('ruler','vládce')|E] a zvolit #TUT_KW Nabídnout mír#!.#!" # todo: CONCEPT CASE
 lesson_losing_wars_step_1: "Blížící se porážka"
 lesson_losing_wars_step_1_desc: "Tato [Concept('war','válka')|E] nejde dobře! Možná je čas žádat o [Concept('white_peace','bílý mír')|E].\n\nI když je #EMP tato#! $game_concept_war$ možná ztracená záležitost, není nic špatného na tom přijmout porážku a přežít pro další den — pravým tlačítkem klikněte na nepřítele a v zobrazení interakcí zvolte #TUT_KW Bílý mír#! (nebo #TUT_KW Kapitulovat#!, pokud není Bílý mír dostupný)." # todo: CONCEPT CASE
 lesson_war_final_notes_reuse: "\n\n#TUT Výukové lekce zde končí. Nicméně, rady se budou občas objevovat jako upozornění v horní části obrazovky. Klikněte na tato upozornění Rady a dozvíte se více o určitých situacích nebo systémech, se kterými se potýkáte!\n\nDěkujeme, že jste s námi vydrželi — a hodně štěstí!#!"
 lesson_war_final_notes_victory_step_1: "Válka vyhrána!"
 lesson_war_final_notes_victory_step_1_desc: "Gratulujeme k vašemu [Concept('victory','vítězství')|E]!\n\nNyní jste si prošli tím, jak projít zásadní částí hry.$lesson_war_final_notes_reuse$" # todo: CONCEPT CASE
 lesson_war_final_notes_defeat_step_1: "Válka prohrána"
 lesson_war_final_notes_defeat_step_1_desc: "Litujeme vaší [Concept('defeat','porážku')|E], ale buďte si jisti, že jste právě zvládli náročný aspekt hry — od nynějška to bude jen snazší.$lesson_war_final_notes_reuse$" # todo: CONCEPT CASE
 lesson_war_final_notes_white_peace_step_1: "Bílý mír"
 lesson_war_final_notes_white_peace_step_1_desc: "Naučili jste se mnoho lekcí! Tyto poznatky si vezmete s sebou do budoucna!$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_invalidated_step_1: "Válka zrušena"
 lesson_war_final_notes_invalidated_step_1_desc: "Stále tu jste! Výborně! Je však podivné, že válka přestala být platná.$lesson_war_final_notes_reuse$"
 lesson_guided_final_notes_mission_step_1: "Co teď?"
 lesson_guided_final_notes_mission_step_1_desc: "Existuje mnoho věcí, které můžete dělat nyní, když jste si osahali některé ze základních systémů — Crusader Kings III je o určování vlastních cílů.\n\nPokud chcete návrh, doporučujeme se pokusit stát se králem nebo královnou celého $k_ireland$! [Concept('war','válka')|E] ale není jediná cesta...\n\nNebo můžete kliknout na tlačítko #bold Aktuální situace#! nahoře a podívat se, jestli vás některá položka v Návrzích nebo Aktuální situaci nezaujme!" # todo: CONCEPT CASE
 lesson_open_war_overview_tt: "Otevřete přehled války (zvýrazněno)"
