 lesson_basics_welcome: "Vítej v Crusader Kings III"
 lesson_welcome_desc: "@tutorial_screenshot_1!\nJsi středověký vládce! Tvá vláda může být krátká, ale skrze své dědice můžeš dovést svou dynastii k věhlasu.\n\nZemě čeká, až se jí chopíš – mečem nebo sňatkem – zatímco obratná diplomacie může rozšířit tvůj vliv dál, než by se kterémukoli dobyvateli vůbec snilo..."
 full_tutorial_explanation_desc: "\n#TUT 2 hodiny#!"
 quick_tutorial_explanation_desc: "\n#TUT 13 minut#!"
 lesson_basics_quick_camera: "Kamera"
 lesson_basics_quick_camera_desc: "Pomocí kláves W, A, S a D můžeš pohybovat kamerou po mapě.\n\nKameru můžeš posouvat také přesunutím kurzoru k okraji obrazovky.\n\nStisknutím klávesy #V Home#! na klávesnici se vrátíš domů, do [GetPlayer.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 lesson_basics_quick_zoom: "Přibližování"
 lesson_basics_quick_zoom_desc: "K přibližování a oddalování mapy použij kolečko myši.\n\nPři plném přiblížení uvidíš $game_concept_detail_zoom$. Když trochu oddálíš, budeš se dívat na $game_concept_political_zoom$. Nakonec při úplném oddálení uvidíš $game_concept_paper_zoom$."
 lesson_basics_quick_nested_tooltips: "Vnořené popisky"
 lesson_basics_quick_nested_tooltips_desc: "$lesson_basics_tooltips_in_tooltips_desc$"
 lesson_basics_quick_nested_tooltips_hover_word: "$lesson_basics_tooltips_in_tooltips_hover_word$"
 lesson_basics_quick_nested_tooltips_hover_word_deeper: "$lesson_basics_tooltips_in_tooltips_hover_word_deeper$"
 lesson_basics_quick_nested_tooltips_complete: "$lesson_basics_quick_nested_tooltips$"
 lesson_basics_quick_nested_tooltips_complete_desc: "$lesson_basics_quick_nested_tooltips_desc$"
 lesson_basics_quick_characters: "Postavy"
 lesson_basics_quick_characters_desc: "Hraješ za [GetPlayer.GetShortUINameNotMeNoTooltip], jednu z mnoha [Concept('characters','postav')|E] v tomto světě, znázorněných avatary postav.\n\nJsi [Concept('ruler','vládcem')|E] feudálního [Concept('realm','panství')|E]!"
 lesson_basics_quick_this_is_you_1: "To jsi ty"
 lesson_basics_quick_this_is_you_1_desc: "Zde uvidíš sebe a svou nejbližší [Concept('family','rodinu')|E].\n\nVpravo vidíš svého [Concept('heir','dědice')|E], který má po tvé smrti zdědit tvé $game_concept_realm$.\n\n#TUT Pokud se někdy na mapě ztratíš, můžeš kliknout na svou postavu a kamera se znovu vystředí na tvé [Concept('realm','panství')|E].#!"
 lesson_basics_quick_this_is_you_2: "Tvoje choť"
 lesson_basics_quick_this_is_you_2_desc: "Obvykle je dobré mít [Concept('spouse','chotě')|E]. Pomůže ti vládnout tvému [Concept('realm','panství')|E] a zajistit budoucnost tvé [Concept('dynasty','dynastie')|E].\n\nPrávě teď nejsi v manželství. Co kdybychom s tím něco udělali?"
 lesson_basics_quick_find_spouse_tt: "Uzavřít sňatek"
 lesson_basics_quick_marriage_window: "$lesson_basics_quick_this_is_you_2$"
 lesson_basics_quick_marriage_window_desc: "Najít vhodného [Concept('spouse','chotě')|E] není snadné, ale je dobré mít na paměti několik věcí:\n\n$EFFECT_LIST_BULLET$Politika: [Concept('marriages','sňatky')|E] jsou hlavním způsobem, jak vytvořit [Concept('alliance','alianci')|E]\n$EFFECT_LIST_BULLET$Schopnosti: její [Concept('skills','dovednosti')|E] se přičtou k tvým\n$EFFECT_LIST_BULLET$Genetika: [Concept('congenital_traits','vrozené rysy')|E], jako je [GetTrait('intellect_good_2').GetName( GetNullCharacter )], mohou zdědit tvé [Concept('children','děti')|E]\n$EFFECT_LIST_BULLET$Urozenost: sňatek s [Concept('lowborn','neurozenou')|E] tě bude stát [Concept('prestige','prestiž')|E]"
 lesson_basics_quick_married_great_job: "Tvoje choť"
 lesson_basics_quick_married_great_job_desc: "Gratuluji ke sňatku!\n\nSvazek mezi tebou a tvým [Concept('spouse','chotěm')|E] vytvořil [Concept('alliance','alianci')|E] mezi tebou a [Concept('ruler','vládcem')|E] [Concept('realm','panství')|E], z něhož tvůj $game_concept_spouse$ pochází. To znamená, že se můžete navzájem povolat do [Concept('wars','válek')|E]!\n\n#TUT Pokud po smrti tvé postavy nezůstane naživu žádný další člen tvé [Concept('dynasty','dynastie')|E], prohraješ hru. $game_concept_spouse$ ti tomu může pomoci zabránit.#!"
 lesson_basics_quick_this_is_you_3: "Rysy"
 lesson_basics_quick_this_is_you_3_desc: "Toto jsou [Concept('traits','rysy')|E] tvé postavy! Jak vidíš, je @temperate_icon_tutorial! [GetTrait('temperate').GetName( GetNullCharacter )], @gregarious_icon_tutorial! [GetTrait('gregarious').GetName( GetNullCharacter )] a @impatient_icon_tutorial! [GetTrait('impatient').GetName( GetNullCharacter )].\n\n#TUT $game_concept_traits$ ovlivňují, jak tvá postava reaguje na události v herním světě. Během hraní můžeš získat také nové rysy.#!"
 lesson_basics_quick_skills: "Dovednosti"
 lesson_basics_quick_skills_desc: "Postavy mají také [Concept('skills','dovednosti')|E]! Pojďme se na ně podívat.\n\nPět hlavních $game_concept_skills$, které určují schopnosti tvé postavy, jsou [diplomacy_i|e][Concept('diplomacy','diplomacie')|E], [martial_i|e][Concept('martial','válečnictví')|E], [stewardship_i|e][Concept('stewardship','správcovství')|E], [intrigue_i|e][Concept('intrigue','pletichářství')|E] a [learning_i|e][Concept('learning','učenost')|E].\n\n#TUT $game_concept_skills$ se mohou v průběhu hry měnit podle tvých činů.#!"
 lesson_basics_quick_your_domain_1: "Tvá doména"
 lesson_basics_quick_your_domain_desc_1: "@tutorial_screenshot_2! Dále se podívejme na tvou [Concept('domain','doménu')|E], kterou tvoří veškerá země, kterou osobně vlastníš. Přehled tvé $game_concept_domain$ je zobrazen ve zvýrazněné části."
 lesson_basics_quick_your_domain_2: "Tvůj erb"
 lesson_basics_quick_your_domain_desc_2: "Toto je erb titulu [GetPlayer.GetPrimaryTitle.GetName]. Slouží k označení tvého [Concept('realm','panství')|E] na různých místech. Můžeš jej například vidět vznášet se nad svým [Concept('capital','hlavním sídlem')|E], $cn_luimneach$.\n\n#TUT Vidíš malou korunu nad svým erbem? Ta představuje jeho [Concept('title_tier','úroveň')|E]. Jak $game_concept_title_tiers$ postupují v hodnosti, koruna nad jejich příslušným erbem bude čím dál okázalejší!#!"
 lesson_basics_quick_your_domain_3: "Tvé tituly"
 lesson_basics_quick_your_domain_desc_3: "Momentálně držíš celkem tři [Concept('titles','tituly')|E], které všechny představují území na mapě. Tvůj primární a nejdůležitější $game_concept_title$ je ten úplně vlevo. Určuje název tvého [Concept('realm','panství')|E]. Vlastníš také $game_concept_titles$ $c_thomond$ a $c_ennis$. \n\n#TUT Když najedeš kurzorem na $game_concept_titles$ v panelu postavy, uvidíš, jaké území na mapě představují.#!"
 lesson_basics_quick_relationships: "Ostatní postavy"
 lesson_basics_quick_relationships_desc: "@tutorial_screenshot_3!\nV této části vidíš různé další [Concept('characters','postavy')|E], s nimiž máš nějaké spojení. Patří sem tvá [Concept('family','rodina')|E], kdokoli, s kým máš [Concept('relationship','zvláštní vztah')|E], tvoji [Concept('courtiers','dvořané')|E] a tvoji [Concept('subjects','subjekti')|E]."
 lesson_basics_quick_realm: "Panství"
 lesson_basics_quick_realm_desc: "Podívejme se na lištu na pravé straně obrazovky. Je tu několik tlačítek, ale pro začátek nás zajímá pohled na tvé [Concept('realm','panství')|E]."
 lesson_basics_quick_realm_great_job: "Hrabství a državy"
 lesson_basics_quick_realm_great_job_desc: "Pamatuješ si [Concept('titles','tituly')|E], které jsme viděli dříve? V tomto zobrazení si můžeš podrobněji prohlédnout zemi, kterou představují. Jsou to [Concept('counties','hrabství')|E], ale kvůli tvé irské [Concept('culture','kultuře')|E] mají jiný, jedinečný název.\n\n$game_concept_counties$ — nebo v tvém případě earldomy — se skládají z menších částí země zvaných [Concept('holdings','državy')|E]. $game_concept_holding$ může podporovat několik [Concept('buildings','budov')|E], které poskytují různé výhody."
 lesson_basics_quick_vassals: "Vazalové"
 lesson_basics_quick_vassals_desc: "Všimni si, že $c_ormond$ je na mapě zahrnuto do obrysu tvého [Concept('realm','panství')|E], přestože se nezobrazuje v přehledu [Concept('domain','domény')|E]. Abychom vysvětlili proč, musíme se podívat na tvé [Concept('vassals','vazaly')|E]."
 lesson_basics_quick_vassals_2: "Vazalové"
 lesson_basics_quick_council_1: "Rada"
 lesson_basics_quick_council_1_desc: "Naštěstí nemusíš své [Concept('realm','panství')|E] spravovat úplně sám. Podívejme se na tvou [Concept('council','radu')|E], další zobrazení dostupné na liště vpravo."
 lesson_basics_quick_council_2: "Rada"
 lesson_basics_quick_council_2_desc: "@tutorial_screenshot_4! Toto je tvá [Concept('council','rada')|E], kterou tvoří šest [Concept('councillors','rádců')|E] včetně tvé [Concept('spouse','choti')|E]. Mohou například $task_collect_taxes$ nebo $task_find_secrets$ prostřednictvím [Concept('councillor_tasks','úkolů rádce')|E]."
 lesson_basics_quick_council_3: "Úkoly rádce"
 lesson_basics_quick_council_3_desc: "Zkusme použít [Concept('councillor_task','úkol rádce')|E]! Nebylo by hezké mít ve svém [Concept('realm','panství')|E] další [Concept('county','hrabství')|E]? K tomu budeš potřebovat [Concept('claim','nárok')|E]. Tvůj [Concept('realm_priest','vrchní duchovní')|E] jej může zfalšovat."
 lesson_basics_council_fabricate_claim_tt: "Zfalšovat $game_concept_claim$ na $game_concept_county$ za tvými hranicemi"
 lesson_basics_quick_vassals_great_job: "Vazalové"
 lesson_basics_quick_vassals_great_job_desc: "@tutorial_screenshot_5! Toto je [Concept('vassal','vazal')|E], další [Concept('ruler','vládce')|E], který pomáhá se správou tvého [Concept('realm','panství')|E] tím, že vládne [Concept('county','hrabství')|E] mimo tvou [Concept('domain','doménu')|E].\n\nJako [Concept('liege','lenní pán')|E] $game_concept_vassal$ dostáváš platby v podobě $game_concept_taxes$ (@gold_icon![gold|e]) a @soldier_icon! [Concept('levies','odvedenců')|E]."
 lesson_basics_quick_vassals_great_job_2: "Doména a panství"
 lesson_basics_quick_vassals_great_job_2_desc: "Mezi tvou [Concept('domain','doménou')|E] a tvým [Concept('realm','panstvím')|E] je důležitý rozdíl. Tvá $game_concept_domain$ je země, kterou osobně držíš, zatímco tvé $game_concept_realm$ zahrnuje také veškerou zemi drženou tvými [Concept('vassals','vazaly')|E].\n\n#TUT Tvůj [Concept('domain_limit','limit domény')|E] tě výrazně odrazuje od toho, abys sám držel neomezené množství [Concept('titles','titulů')|E], takže se při dalším rozšiřování svých hranic budeš muset spoléhat na $game_concept_vassals$.#!"
 lesson_basics_quick_holdings: "Državy"
 lesson_basics_quick_holdings_desc: "V současnosti se tvá [Concept('domain','doména')|E] skládá z [Concept('counties','hrabství')|E] — kvůli tvé irské [Concept('culture','kultuře')|E] nazývaných „Earlství“ — $c_thomond$ a $c_ennis$. Jelikož $c_ormond$ drží tvůj [Concept('vassal','vazal')|E], není součástí tvé $game_concept_domain$.\n\nTato [Concept('counties','hrabství')|E] se skládají z menších částí země — [Concept('baronies','baronství')|E], jednotlivých [Concept('holdings','držav')|E] [Concept('realm','panství')|E].\n\n#TUT Državy představují osídlení ve tvé zemi!#!"
 lesson_basics_quick_resources_1: "Zdroje"
 lesson_basics_quick_resources_1_desc: "Dobrá práce! Tvůj [Concept('councillor','rádce')|E] nyní pracuje na získání [Concept('claim','nároku')|E] pro tebe.\n\nDále se podívejme na lištu v pravé horní části obrazovky. Najdeš zde řadu zdrojů, které můžeš různými způsoby využít k interakci se světem."
 lesson_basics_quick_resources_gold: "@gold_icon! $game_concept_gold$"
 lesson_basics_quick_resources_gold_desc: "[gold_i|e] [Concept('gold','zlato')|E] je měřítkem tvého osobního bohatství a můžeš jím platit za řadu věcí, včetně budov, armád a úplatků. \n\nObecně řečeno, dobrá [stewardship_i|e][Concept('stewardship','správcovství')|E] [Concept('skill','dovednost')|E] ti pomůže ve snaze získávat $game_concept_gold$."
 lesson_basics_quick_resources_prestige: "@prestige_icon! $game_concept_prestige$"
 lesson_basics_quick_resources_prestige_desc: "[prestige_i|e] [Concept('prestige','prestiž')|E] představuje tvou osobní slávu a pověst. Jak získáváš $game_concept_prestige$, zvyšuje se také tvá [Concept('prestige_level','úroveň slávy')|E].\n\nJako zdroj lze $game_concept_prestige$ utrácet za světská rozhodnutí v rámci tvého [Concept('realm','panství')|E]. Vysoká [diplomacy_i|e][Concept('diplomacy','diplomacie')|E] ti pomůže získávat více $game_concept_prestige$."
 lesson_basics_quick_resources_piety: "[piety_i|e] $game_concept_piety$"
 lesson_basics_quick_resources_piety_desc: "[piety_i|e] [Concept('piety','zbožnost')|E] je zdroj, který odráží, jak ctnostná je tvá postava. Lze jej utrácet za různé způsoby interakce s tvou [Concept('faith','vírou')|E], například za vyhlašování [Concept('holy_wars','svatých válek')|E].\n\nS nashromážděnou $game_concept_piety$ roste také tvá [Concept('piety_level','úroveň oddanosti')|E]. Zaměření na [learning_i|e][Concept('learning','učenost')|E] může být pro obzvlášť oddanou postavu dobrý nápad."
 lesson_basics_quick_resources_renown: "@dynasty_prestige_icon! $game_concept_dynasty_prestige$"
 lesson_basics_quick_resources_renown_desc: "[dynasty_prestige_i|e] [Concept('dynasty_prestige','věhlas')|E] představuje, jak vlivná je tvá [Concept('dynasty','dynastie')|E], a lze jej utrácet za rozhodnutí, která utvářejí budoucnost tvé rodiny.\n\n$game_concept_dynasty_prestige$ je spojen s tvou [Concept('dynasty_prestige_level','úrovní věhlasu')|E], která je celkovým měřítkem toho, jak slavná je tvá $game_concept_dynasty$."
 lesson_basics_quick_resources_time: "Čas"
 lesson_basics_quick_resources_time_desc: "Když už jsme skončili s povídáním o zdrojích, uzavřeme to několika posledními radami. Právě teď je hra pozastavena. V pravém dolním rohu můžeš ovládat, jak rychle ve světě plyne čas.\n\n#TUT Crusader Kings III je hra, která se odehrává v průběhu stovek let, takže si klidně dej načas.#!"
 lesson_basics_quick_unpause_tt: "Spusť hru stisknutím mezerníku nebo kliknutím na tlačítko v pravém dolním rohu"
 lesson_basics_quick_done: "Hodně štěstí!"
 lesson_basics_quick_done_desc: "Gratuluji k dokončení rychlého tutoriálu! Hra už není pozastavená a čas plyne. Od této chvíle je na tobě, abys utvářel budoucnost rodu [GetPlayer.GetHouse.GetName].\n\n#TUT Můžeš dělat, co chceš, ale dávej pozor na @reactive_advice_icon! Reaktivní rady, které se objevují v horní části obrazovky.\n\nKdo ví, možná se dokonce staneš králem Irska?#!"
 lesson_basics_camera: "Kamera ($lesson_basics$)"
 lesson_basics_camera_desc: "Pomocí kláves W, A, S a D můžeš pohybovat kamerou po mapě. Kameru můžeš posouvat také přesunutím kurzoru k okraji obrazovky. Stisknutím klávesy „Home“ se přesuneš do svého [Concept('realm_capital','hlavního sídla panství')|E].\n\nK přibližování a oddalování mapy použij kolečko myši.\n\n#TUT Na různých úrovních přiblížení se zobrazují různé informace: [detail_zoom|E], [political_zoom|E] a [paper_zoom|E].\n\nPři přiblížení můžeš vybírat a spravovat své [Concept('holdings','državy')|E]. Oddálení ti poskytne přehled všech [Concept('realms','panství')|E].#!"
 lesson_basics_paused_intro: "Pozastavení ($lesson_basics$)"
 lesson_basics_paused_intro_desc: "Crusader Kings III zahrnuje stovky let a mnoho generací. Právě teď čas stojí, protože hra je #EMP pozastavená#!.\n\n#TUT V této části tutoriálu necháme hru pozastavenou, zatímco tě provedeme několika herními koncepty.#!"
 lesson_basics_tooltips_in_tooltips: "Vnořené popisky ($lesson_basics$)"
 lesson_basics_tooltips_in_tooltips_desc: "Klíčové pojmy jsou označeny modrým [Concept('highlighted_text','zvýrazněným textem')|E]. To znamená, že na ně můžeš najet kurzorem a otevřít informativní popisek.\n\nTyto popisky mohou obsahovat také zvýrazněná klíčová slova, na která lze rovněž najet kurzorem.\n\nU najetí myší trvá #bold několik sekund#!, než se popisek „uzamkne“."
 lesson_basics_tooltips_in_tooltips_hover_word: "Umísti kurzor na tento [Concept('highlighted_text','zvýrazněný text')|E] a otevřeš popisek"
 lesson_basics_tooltips_in_tooltips_hover_word_deeper: "Najeď na slovo „pěkné“ uvnitř otevřeného popisku"
 lesson_basics_tooltips_in_tooltips_complete: "$lesson_basics_tooltips_in_tooltips$"
 lesson_basics_tooltips_in_tooltips_complete_desc: "$lesson_basics_tooltips_in_tooltips_desc$"
 lesson_basics_web_of_titles: "Vládci země ($lesson_basics_map$)"
 lesson_basics_web_of_titles_desc: "Nyní si promluvme o samotné #EMP hře#!! Vše se odehrává na mapě před tebou. Svět se skládá z velkých i malých území — zemských [Concept('titles','titulů')|E] držených různými [Concept('rulers','vládci')|E].\n\n#TUT $game_concept_titles$ jsou znázorněny propracovanými erby, které se na mapě zobrazují jako ikony.\n\nIkona představující tvé [Concept('realm','panství')|E] je ikonou tvého [Concept('primary_title','hlavního titulu')|E], nejdůležitějšího a nejprestižnějšího $game_concept_title$, který držíš.#!"
 lesson_basics_realm: "Hranice ($lesson_basics_map$)"
 lesson_basics_realm_desc: "Když najedeš kurzorem na portrét své postavy, erb nad tvým [Concept('realm_capital','hlavním sídlem panství')|E] ($cn_luimneach$) zazáří a celé tvé [Concept('realm','panství')|E] se zvýrazní. Munster je tvůj [Concept('primary_title','hlavní titul')|E], a proto je tvé $game_concept_realm$ pojmenováno po něm.\n\nSamostatně držíš také earlství Thomond jako další $game_concept_title$.\n\n#TUT Když oddálíš mapu, bude se na této její části zobrazovat „Munster“, protože jsi nejvyšším vládcem této oblasti.#!"
 lesson_basics_map_modes: "Vláda nad ostatními ($lesson_basics_map$)"
 lesson_basics_map_modes_desc: "Jako [Concept('ruler','vládce')|E] můžeš sám držet jen určité množství země — často ti se správou [Concept('realm','panství')|E] budou pomáhat jiní $game_concept_rulers$ tím, že budou v rámci tvých hranic držet zemi ([Concept('titles','tituly')|E]), čímž se stanou tvými [Concept('vassals','vazaly')|E].\n\n#TUT Chceš-li najít vlastní zemi, svou [Concept('domain','doménu')|E], stiskni klávesu „Home“ a přibliž mapu. Jakmile budeš blíž, uvidíš modré popisky na [Concept('baronies','baronstvích')|E], která ti patří — v tomto případě to budou $cn_luimneach$ a $cn_inis$.\n\nEarlství $c_ormond$ drží tvůj vazal.#!"
 lesson_basics_characters: "Postavy ($lesson_basics_character$)"
 lesson_basics_characters_desc: "Hraješ za jednu z mnoha [Concept('characters','postav')|E] v tomto světě, znázorněných avatary postav. Tvá postava je [Concept('ruler','vládcem')|E] [Concept('realm','panství')|E]!\n\n#TUT Budeš muset zajistit, aby tvá [Concept('dynasty','dynastie')|E] přežila a vzkvétala napříč věky. Tvé [Concept('titles','tituly')|E] ti dávají moc a kontrolu nad územím i nad dalšími postavami, které mohou držet vlastní tituly a zemi.#!"
 lesson_basics_characters_click_on_character: "Klikni na svou postavu"
 lesson_basics_skills: "Dovednosti ($lesson_basics_character$)"
 lesson_basics_skills_desc: "[Concept('characters','Postavy')|E] mají [Concept('skills','dovednosti')|E], které vyjadřují jejich způsobilost v určité oblasti. Některé jsou skvělými řečníky, jiné dávají své záměry raději najevo na bitevním poli.\n\n#TUT Hlavní dovednosti jsou:\n#![diplomacy_i|E] [Concept('diplomacy','diplomacie')|E]\n#weak Zlepšování mínění ostatních o tobě#!\n[martial_i|E] [Concept('martial','válečnictví')|E]\n#weak Povolávání armád a velení jim#!\n[stewardship_i|E] [Concept('stewardship','správcovství')|E]\n#weak Správa tvých osobních držav#!\n[intrigue_i|E] [Concept('intrigue','pletichářství')|E]\n#weak Osnování intrik a odhalování tajemství#!\n[learning_i|E] [Concept('learning','učenost')|E]\n#weak Studium teologie a technologie#!"
 lesson_basics_traits_1: "Rysy ($lesson_basics_character$)"
 lesson_basics_traits_1_desc: "[Concept('characters','Postavy')|E] mají také [Concept('traits','rysy')|E], které mohou ovlivňovat [Concept('skills','dovednosti')|E] i to, jak reagují na různé věci. V zobrazení postavy jsou znázorněny ikonami.\n\nNěkteré rysy vypovídají o osobnosti [Concept('character','postavy')|E], například [GetTrait('fickle').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )] nebo [GetTrait('generous').GetName( GetNullCharacter )]. Jiné rysy souvisejí s tím, jak [Concept('character','postava')|E] prožila svůj život, například [Concept('tutorial_education_trait','rys vzdělání')|E] nebo [Concept('commander_traits','velitelské rysy')|E].\n\n#TUT Jsi:\n@temperate_icon_tutorial! [GetTrait('temperate').GetName( GetNullCharacter )]\n@gregarious_icon_tutorial! [GetTrait('gregarious').GetName( GetNullCharacter )]\n@impatient_icon_tutorial! [GetTrait('impatient').GetName( GetNullCharacter )]\n\nKdyž se postava rozhodne jednat proti svým osobnostním rysům, může jí to způsobit [Concept('stress','stres')|E].#!"
 lesson_basics_traits_2: "Rysy ($lesson_basics_character$)"
 lesson_basics_traits_2_desc: "[Concept('traits','Rysy')|E] mohou také ovlivnit, jak ostatní [Concept('characters','postavy')|E] reagují na #EMP tebe#!.\n\nNěkteré lidi ohromí rys @brave_icon! [GetTrait('brave').GetName( GetNullCharacter )], zatímco postava s rysem @lustful_icon! [GetTrait('lustful').GetName( GetNullCharacter )] se pravděpodobněji objeví v lechtivých klepech...\n\n#TUT Rysy ovlivňují morálku a chamtivost ostatních postav, což může mít dopad na jejich přátelské i nepřátelské činy.#!"
 lesson_basics_opinion: "Mínění ($lesson_basics_character$)"
 lesson_basics_opinion_desc: "Všechny [Concept('characters','postavy')|E] — ano, #EMP všechny#! — mají vůči sobě navzájem [Concept('opinion','mínění')|E], které řídí jejich chování.\n\n#N Nízké#! $game_concept_opinion$ může způsobit, že se proti tobě lidé vzbouří nebo ti nebudou ochotni pomoci. #P Vysoké#! $game_concept_opinion$ naopak může přimět $game_concept_characters$, aby se ochotněji připojily k tvým [Concept('schemes','intrikám')|E]...\n\n#TUT To, jak se rozhodneš jednat s ostatními $game_concept_characters$, bude často ovlivňovat jejich mínění o tobě.#!"
 lesson_basics_resources_1: "[gold_i|E] Zlato ($lesson_basics_resources$)"
 lesson_basics_resources_1_desc: "K dosažení svých cílů budeš potřebovat [Concept('gold','zlato')|E]. $game_concept_gold$ mimo jiné platí za [Concept('buildings','budovy')|E], [Concept('armies','armády')|E] a úplatky. $game_concept_gold$ se pasivně vybírá z tvých [Concept('holdings','držav')|E] i od tvých [Concept('vassals','vazalů')|E] jako [Concept('tax','daň')|E]. Větší $game_concept_vassals$ a významnější $game_concept_holdings$ obvykle odvádějí více $game_concept_tax$.\n\nPeníze však nekoupí všechno — některých věcí lze dosáhnout jen utracením správného množství [Concept('prestige','prestiže')|E] nebo, v náboženských záležitostech, [Concept('piety','zbožnosti')|E].\n\n#TUT Aktuální stav svého zlata, prestiže a zbožnosti vidíš na liště vpravo nahoře.#!\n"
 lesson_basics_resources_2: "[prestige_i|E] Prestiž ($lesson_basics_resources$)"
 lesson_basics_resources_2_desc: "Tvá [Concept('prestige','prestiž')|E] ukazuje, jak velké úctě se těšíš. Lze ji získávat pasivně v průběhu času, například držením mnoha [Concept('titles','titulů')|E], nebo aktivně, například [Concept('marrying','sňatkem')|E] s prestižními [Concept('dynasties','dynastiemi')|E] či bojem jako [Concept('ally','spojenec')|E] ve [Concept('wars','válkách')|E].\n\nKdykoli získáš $game_concept_prestige$, přiblížíš se ke své další [Concept('prestige_level','úrovni slávy')|E]. Vyšší $game_concept_prestige_levels$ zlepšují mínění ostatních [Concept('characters','postav')|E] o tobě a přinášejí mocné způsoby vedení $game_concept_war$.\n\n#TUT Některé akce #EMP stojí#! $game_concept_prestige$, například vyhlášení $game_concept_war$. Tyto akce ti umožňují využít svůj věhlas ve vlastní prospěch a $game_concept_characters$ si o tobě kvůli jejich použití nebudou myslet nic horšího.\n\nUtrácení $game_concept_prestige$ neovlivňuje tvůj postup k $game_concept_prestige_level$, pouze tvou aktuální $game_concept_prestige$.#!"
 lesson_basics_resources_3: "[piety_i|E] Zbožnost ($lesson_basics_resources$)"
 lesson_basics_resources_3_desc: "S velkou [Concept('piety','zbožností')|E] bude pro tebe snazší jednat se svou [Concept('head_of_faith','hlavou víry')|E]. Jelikož jsi $catholic_adherent$, je jí papež.\n\n$game_concept_piety$ lze získávat pasivně z [Concept('learning','učenosti')|E], [Concept('skill','dovednosti')|E] a [Concept('virtuous','ctnostných')|E] [Concept('traits','rysů')|E], nebo aktivně zbožnými činy, například vykonáním [Concept('pilgrimage','pouti')|E].\n\nMáš také [Concept('piety_level','úroveň oddanosti')|E], která se v průběhu času zvyšuje, kdykoli získáš $game_concept_piety$, a může mít pro tvou postavu pozitivní účinky.\n\n#TUT Podobně jako u prestiže některé akce vyžadují, abys $game_concept_piety$ #EMP utratil#!, například vyhlašování [Concept('holy_wars','svatých válek')|E] nebo vytvoření nové [Concept('faith','víry')|E].\n\nTakové utrácení $game_concept_piety$ je běžné a ostatní [Concept('characters','postavy')|E] si o tobě kvůli němu nebudou myslet nic horšího.#!"
 lesson_basics_lifestyles_1: "Životní styly ($lesson_basics_lifestyles$)"
 lesson_basics_lifestyles_1_desc: "Kromě [Concept('traits','rysů')|E] si tvá [Concept('character','postava')|E] může vybrat také [Concept('lifestyle','životní styl')|E]. Existuje [SelectLocalization( HasDlcFeature( 'wandering_nobles' ), 'number_six', 'number_five' )] $game_concept_lifestyles$, jeden pro každou dovednost.\n\n$game_concept_lifestyles$ představují to, do čeho každodenně vkládáš nejvíce úsilí, a každý z nich obsahuje několik souvisejících [Concept('focuses','zaměření')|E].\n\nKaždé $game_concept_focus$ ti dává jedinečný bonus a zvyšuje pravděpodobnost událostí spojených s daným $game_concept_focus$."
 lesson_basics_lifestyle_open_window_tt: "Klikni na zvýrazněné tlačítko životního stylu"
 lesson_basics_lifestyles_2: "Zaměření ($lesson_basics_lifestyles$)"
 lesson_basics_lifestyles_no_GUI_highlight: "$lesson_basics_lifestyles_2$"
 lesson_basics_lifestyles_2_desc: "Kliknutím na libovolný [Concept('lifestyle','životní styl')|E] zobrazíš jeho [Concept('focuses','zaměření')|E].\n\nJak čas plyne, tvá [Concept('character','postava')|E] bude získávat [Concept('lifestyle_experience','zkušenosti životního stylu')|E] za udržování konkrétního $game_concept_lifestyle$. Jakmile získáš dostatek $game_concept_lifestyle_experience$, můžeš si vybrat jeden z [Concept('perks','talentů')|E] daného $game_concept_lifestyle$ z #EMP libovolného#! jeho stromu.\n\n$game_concept_perks$ představují, jak se postupem času procvičuješ a rozvíjíš, a nabízejí jedinečné bonusy, například zvláštní rysy, nebo odemykají mechaniky a obsah specifické pro daný $game_concept_lifestyle$, například schopnost zahájit [GetScheme('abduct').GetTypeName] [Concept('schemes','intriky')|E].$lesson_basics_lifestyles_2_reuse$"
 lesson_basics_lifestyles_2_reuse: "\n\n#TUT Například zaměření $martial_strategy_focus_short$, $martial_authority_focus_short$ a $martial_chivalry_focus_short$ všechna poskytují válečnické zkušenosti, které lze použít k získání libovolného z [Concept('perks','talentů')|E] válečnického životního stylu.\n\nDokončení stromů talentů vede k různým rysům životního stylu!#!"
 lesson_basics_lifestyle_choose_focus_tt: "Zvol zaměření"
 lesson_basics_lifestyles_2_b: "$lesson_basics_lifestyles_2$"
 lesson_basics_lifestyles_2_b_desc: "Když sis vybral [Concept('focus','zaměření')|E], možná už tušíš, že tvá [Concept('character','postava')|E] bude postupem času získávat [Concept('lifestyle_experience','zkušenosti životního stylu')|E]. $lesson_basics_lifestyles_2_reuse$"
 lesson_basics_interacting_1: "Ostatní postavy ($lesson_basics_interacting$)"
 lesson_basics_interacting_1_desc: "Nyní, když sis vybral [Concept('focus','zaměření')|E], můžeme přejít k ostatním lidem! Interakce s dalšími [Concept('characters','postavami')|E] je v Crusader Kings III klíčová a máš mnoho možností, jak na to.\n\n#TUT Kliknutím pravým tlačítkem na portrét postavy, včetně tvého vlastního, získáš seznam možných [Concept('interactions','interakcí')|E], například sjednání [Concept('marriage','sňatku')|E] nebo zahájení [Concept('scheme','intriky')|E]. Právě zde také zahajuješ [Concept('wars','války')|E], ale to si nechme na později.#!"
 lesson_basics_open_character_view_tt: "Otevři zobrazení své postavy"
 lesson_basics_open_interactions_tt: "Klikni pravým tlačítkem na portrét $game_concept_character$ svého [Concept('player_heir','hráčského dědice')|E] a zobraz dostupné interakce"
 lesson_basics_interacting_2: "Poslat dar ($lesson_basics_interacting$)"
 lesson_basics_interacting_2_desc: "Začněme od základů — zlato má rád každý! Zkus poslat úplatek svému [Concept('player_heir','hráčskému dědici')|E].\n\n#TUT Většina [Concept('interactions','interakcí')|E] po výběru otevře druhé okno s podrobnostmi. V tomto okně můžeš akci potvrdit nebo zrušit.#!"
 lesson_basics_send_gift_tt: "Potvrď interakci #TUT_KW Poslat dar#! se svým $game_concept_heir$"
 lesson_basics_interacting_3: "Dar odeslán ($lesson_basics_interacting$)"
 lesson_basics_interacting_3_desc: "Výborně! Úspěšně jsi #P zvýšil#! něčí [Concept('opinion','mínění')|E] o tobě.\n\n#TUT Všimni si #bold zprávy v kanálu#! vpravo dole — zde se objevují #EMP mírně zajímavé, ale ne zásadní#! informace, které po krátké chvíli při spuštěném čase zmizí.#!\n\nNěkteré modifikátory mínění trvají navždy, například rodinná pouta. Jiné časem slábnou, například blednoucí vzpomínka na přijetí peněžitého daru...\n\n#TUT Když najedeš kurzorem na číslo mínění u jiné postavy, uvidíš přesně, odkud jednotlivé hodnoty pocházejí. Je to kvůli sňatkové alianci, daru zlata, nebo prostě proto, že oceňuje tvou čestnou povahu?#!"
 lesson_basics_many_lives_1: "Hra za rodinu ($lesson_basics_succession$)"
 lesson_basics_many_lives_1_desc: "Dále si promluvme o tvé [Concept('dynasty','dynastii')|E]. Jak hra postupuje, tvá [Concept('character','postava')|E] zestárne a nakonec zemře — pokud ji dříve nepotká předčasná „nehoda“ nebo hrozná nemoc.\n\n#TUT Tím však příběh nekončí — [Concept('game_over','konec hry')|E] nastane pouze tehdy, pokud nemáš dědice z vlastní dynastie!#!"
 lesson_basics_many_lives_2: "Dědic ($lesson_basics_succession$)"
 lesson_basics_many_lives_2_no_GUI_highlight: "$lesson_basics_many_lives_2$"
 lesson_basics_many_lives_2_desc: "Dokud mají tvé [Concept('titles','tituly')|E] [Concept('heirs','dědice')|E] z tvé [Concept('dynasty','dynastie')|E], tvůj odkaz bude žít dál. Když tvá současná [Concept('character','postava')|E] zemře, jednoduše začneš hrát za novou: [Concept('player_heir','hráčského dědice')|E].\n\nPodle typu [Concept('succession','nástupnictví')|E], který tvé [Concept('realm','panství')|E] má, to pravděpodobně bude jedno z tvých dětí — možná takové, které jsi vychovával k [Concept( 'ruler', 'vládnutí' )|E]?\n\n#TUT Tvá $game_concept_dynasty$ má svůj vlastní erb, který je nyní zvýrazněn a na který lze kliknout pro více informací.\n\nTeď s tím nemusíš nic dělat, ale pokud si později budeš chtít prohlédnout podrobnosti o své $game_concept_dynasty$, najdeš je zde.\n\n#!"
 lesson_basics_succession_laws: "Zákony nástupnictví ($lesson_basics_succession$)"
 lesson_basics_succession_laws_desc: "[Concept('succession_laws','Zákony nástupnictví')|E] určují, jak se po smrti [Concept('character','postavy')|E] rozdělí všechny [Concept('titles','tituly')|E] a zdroje mezi [Concept('heirs','dědice')|E]. Momentálně máš jen jednoho dědice, ale i tak se na ně pojďme podívat!\n\n#TUT V některých případech můžeš po převzetí nové postavy dokonce zjistit, že je zodpovědná za předčasný skon tvého předchozího vládce...#!"
 lesson_basics_succession_tab_tt: "Prohlédni si záložku nástupnictví"
 lesson_basics_succession_laws_complete_2: "$lesson_basics_succession_laws$"
 lesson_basics_succession_laws_complete_2_desc: "$lesson_basics_succession_laws_desc$"
 lesson_basics_renown: "Věhlas ($lesson_basics_succession$)"
 lesson_basics_renown_no_GUI_highlight: "$lesson_basics_renown$"
 lesson_basics_renown_no_GUI_highlight_2: "$lesson_basics_renown$"
 lesson_basics_renown_desc: "Jako člen [Concept('dynasty','dynastie')|E] máš také [Concept('dynasty_prestige','věhlas')|E]. $game_concept_dynasty_prestige$ sdílený všemi členy tvé $game_concept_dynasty$ roste několika různými způsoby a odráží, jak proslulá — či nechvalně známá — je tvá #EMP dynastie#!, nikoli jen ty sám.\n\nZvyšování tvého $game_concept_dynasty_prestige$ se ponese generacemi tvých potomků a bude zvyšovat tvou [Concept('dynasty_prestige_level','úroveň věhlasu')|E]. Jako [Concept('dynast','hlava dynastie')|E] — nejmocnější člen tvé $game_concept_dynasty$ — můžeš za věhlas odemykat [Concept('dynasty_perks','dynastické odkazy')|E], které prospějí celému tvému příbuzenstvu.\n\n#TUT Chceš-li si prohlédnout $game_concept_dynasty_perk$ dynastie, klikni na její dynastický erb.#!"
 lesson_basics_marriage_concept_1: "Sňatek ($lesson_basics_marriage$)"
 lesson_basics_marriage_concept_1_desc: "Aby byla budoucnost tvé [Concept('dynasty','dynastie')|E] zajištěna, potřebuješ členy rodiny. Být [Concept('married','sezdán')|E] je dobrý začátek, ale nemůžeme slíbit, že se oženíš z lásky. @arrange_marriage_icon!"
 lesson_basics_marriage_concept_2: "Hledání choti ($lesson_basics_marriage$)"
 lesson_basics_marriage_concept_2_b: "$lesson_basics_marriage_concept_2$"
 lesson_basics_marriage_concept_2_desc: "Pojďme tě oženit!\n\nU nesezdaných postav ve tvé [Concept('domain','doméně')|E] můžeš sjednat [Concept('marriages','sňatky')|E] nebo [Concept('betrothals','zasnoubení')|E] kliknutím pravým tlačítkem na postavu a volbou #TUT_KW Najít chotě#! nebo #TUT_KW Sjednat sňatek#!.\n\n#TUT Obě možnosti fungují odlišně, takže si je projdeme jednu po druhé...#!"
 lesson_basics_marriage_concept_2_b_desc: "I když je tvá postava už v manželství, provedeme tě jednotlivými kroky.\n\nU nesezdaných postav ve tvé [Concept('domain','doméně')|E] můžeš sjednat [Concept('marriages','sňatky')|E] nebo [Concept('betrothals','zasnoubení')|E] kliknutím pravým tlačítkem na postavu a volbou #TUT_KW Najít chotě#! nebo #TUT_KW Sjednat sňatek#!.\n\n#TUT Nemusíš si brát nikoho dalšího, ale výběrem #TUT_KW Najít chotě#! nám otevřeš zobrazení sňatku.#!"
 lesson_basics_marriage_instruction_open_window: "$lesson_basics_marriage_concept_1$"
 lesson_basics_marriage_instruction_open_window_desc: "Najděme někoho, koho si tvá postava může vzít!"
 lesson_basics_open_interactions_marriage_tt: "Klikni pravým tlačítkem na svou vlastní postavu"
 lesson_basics_open_interactions_marriage_alt_tt: "Klikni pravým tlačítkem na #EMP nesezdanou#! postavu"
 lesson_basics_marriage_view_tt: "Vyber #TUT_KW Najít chotě#!"
 lesson_basics_find_spouse_concept: "Výběr choti ($lesson_basics_marriage$)"
 lesson_basics_find_spouse_concept_desc: "Volba #TUT_KW Najít chotě#! otevře seznam potenciálních [Concept('spouses','chotí')|E] — pocházejí z [Concept('courts','dvorů')|E] z celého světa!\n\nVolba #TUT_KW Sjednat sňatek#! také otevře seznam potenciálních [Concept('spouses','chotí')|E], ale jen s lidmi ze [Concept('court','dvora')|E] postavy, na kterou jsi klikl.\n\n#TUT Tvá vlastní postava je vidět vlevo, protože tento sňatek vyžaduje #EMP tvůj#! souhlas. Ten, kdo je [Concept('liege','lenním pánem')|E] druhé choti, se zobrazí napravo, protože svazek bude vyžadovat také jeho souhlas.\n\n#TUT_KW Sjednat sňatek#! se může hodit při dohazování mezi tvými [Concept('courtiers','dvořany')|E] nebo při domlouvání konkrétní sňatkové [Concept('alliance','aliance')|E]. Prozatím je však pro naše účely důležitější #TUT_KW Najít chotě#!.#!"
 lesson_basics_arrange_marriage_concept: "Sjednat sňatek ($lesson_basics_marriage$)"
 lesson_basics_arrange_marriage_concept_desc: "\n\n#TUT To se může hodit při dohazování mezi tvými [Concept('courtiers','dvořany')|E] nebo při domlouvání konkrétní sňatkové [Concept('alliance','aliance')|E].#!"
 lesson_basics_choosing_a_spouse: "Filtr postav ($lesson_basics_marriage$)"
 lesson_basics_choosing_a_spouse_no_GUI_highlight: "$lesson_basics_choosing_a_spouse$"
 lesson_basics_choosing_a_spouse_desc: "Při výběru [Concept('spouse','choti')|E] je třeba zvážit mnoho faktorů. Abychom ti pomohli, je k dispozici zvýrazněná funkce filtrování, která zúží seznam kandidátů. Mezi důležité aspekty patří možné [Concept('alliances','aliance')|E], [Concept('skills','dovednosti')|E], osobnostní [Concept('traits','rysy')|E], očekávaná [Concept('fertility','plodnost')|E] a další.\n\nNěkteré rysy jsou [Concept('congenital','vrozené')|E], což znamená, že je mohou zdědit tvé děti — možná je dobré začít někým s takovým rysem?\n\n#TUT Svůj výběr můžeš změnit kliknutím na tlačítko #TUT_KW Vymazat postavy#! mezi postavami, kterým sjednáváš sňatek. Nic se nestane, dokud neklikneš na #TUT_KW Odeslat návrh#!.#!"
 send_marriage_proposal_button_name: "Odeslat návrh"
 lesson_basics_say_yes: "Odeslat návrh ($lesson_basics_marriage$)"
 lesson_basics_said_yes: "$lesson_basics_say_yes$"
 lesson_basics_say_yes_desc: "Když vybereš dvě postavy pro [Concept('marriage','sňatek')|E], zobrazí se ti podrobnosti svazku spolu s dalšími možnostmi, například zda má být sňatek [Concept('matrilineal','matrilineární')|E].\n\n#TUT Pokud jsi se sňatkem spokojený, pošli nabídku. Tato akce obvykle trvá několik dní, ale pro tutoriál ji provedeme okamžitě.#!"
 lesson_basics_get_married_tt: "Ožeň se — vyber pro svou postavu choť a kliknutím na #TUT_KW Odeslat návrh #! navrhni svazek"
 lesson_basics_already_married: "$lesson_basics_marriage_concept_1$"
 lesson_basics_already_married_desc: "Kdykoli sjednáváš [Concept('marriage','sňatek')|E] mezi [Concept('characters','postavami')|E], poslední krok před odesláním návrhu ti ukáže podrobnosti svazku spolu s dalšími možnostmi, například zda má být sňatek [Concept('matrilineal','matrilineární')|E].\n\n#TUT Tvá postava už je v manželství — dobrá práce!#!"
 lesson_basics_marriage_final_notes: "Gratulujeme! ($lesson_basics_marriage$)"
 lesson_basics_marriage_final_notes_desc: "Výborně! Ať spolu žijete dlouho a šťastně!\n\n#TUT Možná sis všiml #bold vyskakovací zprávy#! v horní části obrazovky — vyskakovací zprávy přinášejí rychlé informace, které se týkají tebe nebo tvé postavy. [Concept('marriages','Sňatky')|E] jsou také obvykle doprovázeny #bold událostí#!, když [Concept('liege','lenní pán')|E] tvé potenciální [Concept('spouse','choti')|E] přijme nebo odmítne tvou nabídku dopisem. Existují různé druhy událostí a jsou zásadní pro utváření tvého osudu, takže si jich všímej!#!\n\nPro tento tutoriál doporučujeme, abys použil #TUT_KW Najít choť#! také pro svého syna.\n\n#TUT Jakmile bude tvůj syn ženatý, může začít plodit členy tvé rodiny — a [Concept('heirs','dědice')|E] tvých [Concept('titles','titulů')|E], kteří budou z tvé [Concept('dynasty','dynastie')|E].#!"
 lesson_basics_dynasty_and_house: "Dynastie a rod ($lesson_basics_titles$)"
 lesson_basics_dynasty_and_house_desc: "Rodina je důležitá! [Concept('player_heir','Hráčský dědic')|E] bude vždy pocházet z tvé [Concept('dynasty','dynastie')|E] a nejčastěji také z tvého [Concept('house','rodu')|E].\n\n#TUT Do budoucna se vyplatí sledovat svou rodinu — a #EMP jejich#! [Concept('line_of_succession','linii následnictví')|E]. V závislosti na jejich [Concept('succession_laws','zákonech nástupnictví')|E] můžeš od svých příbuzných zdědit [Concept('titles','tituly')|E] spolu se zemí a [Concept('vassals','vazaly')|E].#!"
 lesson_basics_landed_titles: "Země a tituly ($lesson_basics_titles$)"
 lesson_basics_landed_titles_desc: "Ne každý člen tvé [Concept('dynasty','dynastie')|E] bude vlastníkem půdy, ale každý kus země na mapě #EMP má#! vlastníka.\n\nNěkdy jsi tím vlastníkem ty, někdy jeden z tvých [Concept('vassals','vazalů')|E] a někdy úplně jiné [Concept('realm','panství')|E] — z nichž mnohá také mají $game_concept_vassals$ nebo jimi sama jsou."
 lesson_basics_de_jure_titles: "Tituly ($lesson_basics_titles$)"
 lesson_basics_de_jure_titles_desc: "Většina [Concept('titles','titulů')|E] patří do pyramidové hierarchie podle [Concept('title_tier','úrovně')|E] svého $game_concept_title$:\n\n[Concept('barony','Baronství')|E] — vládne mu baron nebo baronka\n[Concept('county','Hrabství')|E] — vládne mu hrabě nebo hraběnka\n[Concept('duchy','Vévodství')|E] — vládne mu vévoda nebo vévodkyně\n[Concept('kingdom','Království')|E] — vládne mu král nebo královna\n[Concept('empire','Říše')|E] — vládne jí císař nebo císařovna\n\nKaždý $game_concept_title$ je právně součástí $game_concept_title$ o jednu $game_concept_title_tier$ výše, takže například každé $game_concept_county$ je součástí $game_concept_duchy$.\n\n#TUT Poznámka: Tyto tituly mají mnoho dynamických názvů — tvůj současný [Concept('ruler','vládce')|E] stojí v čele „malého království“, které odpovídá [Concept('duchy','vévodské')|E] úrovni.#!"
 lesson_basics_de_jure_cbs: "$lesson_basics_de_jure_titles$ de iure"
 lesson_basics_de_jure_cbs_desc: "Říkáme „právně“, protože Crusader Kings III ti umožňuje hrát si s dějinami, a tak nelze zaručit, že [Concept('king','král')|E] #EMP skutečně#! ovládá všechny [Concept('titles','tituly')|E], které by jeho [Concept('kingdom','království')|E] „mělo“ obsahovat ve svých hranicích.\n\nTuto hierarchii $game_concept_title$ nazýváme [Concept('de_jure','de iure')|E], a pokud byla narušena, často je možné kvůli odtrženým územím vyhlásit válku.\n\n#TUT Pokud přepneš na režim mapy vévodských titulů, uvidíš, že jako vládce [Concept('duchy','vévodství')|E] $d_munster$ by [Concept('county','hrabství')|E] $c_desmond$ mělo být právně součástí tvého panství.#!"
 lesson_basics_de_jure_cbs_complete_1: "$lesson_basics_de_jure_cbs$"
 lesson_basics_de_jure_cbs_complete_2: "$lesson_basics_de_jure_cbs$"
 lesson_basics_change_map_mode_1_tt: "Přepni na režim mapy vévodských titulů"
 lesson_basics_change_map_mode_2_tt: "Vrať se do režimu mapy panství"
 lesson_basics_holdings_and_buildings: "Tvé državy ($lesson_basics_holdings$)"
 lesson_basics_holdings_and_buildings_desc: "[Concept('de_jure','De iure')|E] titul Munster se skládá ze čtyř [Concept('counties','hrabství')|E]. Jejich názvy by měly být viditelné na mapě: $c_thomond$ a $c_ennis$, které držíš ty, $c_desmond$, které drží sousední [Concept('ruler','vládce')|E], a $c_ormond$, které drží tvůj [Concept('vassal','vazal')|E].\n\nTato [Concept('counties','hrabství')|E] se skládají z menších částí země — [Concept('baronies','baronství')|E], jednotlivých [Concept('holdings','držav')|E] [Concept('realm','panství')|E].\n\n#TUT Državy představují osídlení ve tvé zemi!#!"
 lesson_basics_buildings: "Tvé budovy ($lesson_basics_holdings$)"
 lesson_basics_buildings_no_GUI_highlight: "Budovy ($lesson_basics_holdings$)"
 lesson_basics_buildings_desc: "[Concept('holdings','Državy')|E] poskytují různé úrovně [Concept('taxes','daní')|E] a [Concept('levies','odvedenců')|E] i [Concept('buildings','budovy')|E], které můžeš stavět a vylepšovat v závislosti na [Concept('holding_type','typu državy')|E].\n\n#TUT Doporučujeme začít vylepšením #TUT_KW $building_curtain_walls_01$.#!#!"
 lesson_basics_start_construction_tt: "Klikni na svou hlavní državu ($cn_luimneach$), mezi jejími budovami vyber #TUT_KW $building_curtain_walls_01$#! a #TUT_KW vylepši#! stavbu"
 lesson_basics_buildings_complete: "$lesson_basics_holdings_and_buildings$"
 lesson_basics_buildings_complete_desc: "Výborně! Než bude [Concept('building','budova')|E] hotová, chvíli to potrvá — $cn_luimneach$ nebylo postaveno za den... Okno výstavby #EMP $building_type_curtain_walls_01$#! můžeš klidně zavřít.\n\n#TUT Jakmile bude výstavba dokončena, získáš výhody zvolené budovy nebo vylepšení.#!"
 lesson_basics_taxes: "Zdanění ($lesson_basics_holdings$)"
 lesson_basics_taxes_desc: "Každá [Concept('holding','država')|E] poskytuje svému [Concept('holder','držiteli')|E] [Concept('taxes','daně')|E]. Pokud je tento držitel [Concept('vassal','vazalem')|E], bude následně platit daně svému [Concept('liege','lennímu pánu')|E].\n\nDaně jsou tvým hlavním zdrojem [gold_i] [Concept('gold','zlatého')|E] [Concept('income','příjmu')|E]!\n\n#TUT [Concept('obligations','Povinnosti')|E] mohou ovlivnit, jak vysoké či nízké tyto daně jsou. Stav [Concept('war','války')|E] může ovlivnit úroveň [Concept('control','kontroly')|E] v [Concept('county','hrabství')|E], což následně ovlivňuje daně.#!"
 lesson_basics_vassals_concept: "Vazalové ($lesson_basics_vassals$)"
 lesson_basics_realm_view_tt: "Otevři zobrazení panství na pravé straně obrazovky (zvýrazněno)"
 lesson_basics_vassals_tab_tt: "Prohlédni si záložku vazalů"
 lesson_basics_vassals_concept_desc: "Jako [Concept('ruler','vládce')|E] budeš pravděpodobně [Concept('liege','lenním pánem')|E] alespoň jednoho [Concept('vassal','vazala')|E]. Jsou to $game_concept_rulers$, kteří ti přísahali věrnost, a proto jsou součástí tvého [Concept('realm','panství')|E].\n\n#TUT Vazalové ti poskytují [Concept('gold','zlato')|E] ([Concept('taxes','daně')|E]) a vojáky ([Concept('levies','odvedence')|E]).\n\nJe možné být zároveň $game_concept_liege$ i $game_concept_vassal$.#!"
 lesson_basics_vassals_concept_complete_2: "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_great_job: "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_great_job_desc: "Zde je seznam tvých současných [Concept('vassals','vazalů')|E] spolu s dalšími informacemi o nich.\n\nNa vrcholu seznamu je [Concept('ruler','vládce')|E] $c_ormond$, jehož zemi vidíš na mapě — jde o earlství ([Concept('title','titul')|E] [Concept('title_tier','úrovně')|E] [Concept('county','hrabství')|E]) uvnitř tvého [Concept('realm','panství')|E].\n\n#TUT Sem se vrať pro přehled věcí, jako je aktuální [Concept('opinion','mínění')|E] tvých vazalů o tobě, zda jsou považováni za [Concept('powerful_vassal','mocného vazala')|E], a jaké úrovně [Concept('taxes','daní')|E] a [Concept('levies','odvedenců')|E] ti právě poskytují.#!"
 lesson_basics_vassals_concept_greyed_out: "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_greyed_out_desc: "Zde také můžeš měnit [Concept('vassal_contracts','vazalské smlouvy')|E], které určují, kolik [Concept('levies','odvedenců')|E] a [Concept('taxes','daní')|E] ti feudální [Concept('vassal','vazal')|E] poskytuje."
 lesson_basics_happy_vassals: "$lesson_basics_vassals_concept$"
 lesson_basics_happy_vassals_desc: "Vyplatí se udržovat své [Concept('vassals','vazaly')|E] spokojené — drží je to stranou [Concept('schemes','intrik')|E] a [Concept('factions','frakcí')|E] namířených proti tobě.\n\nAť je tvá [Concept('character','postava')|E] jakkoli mocným [Concept('ruler','vládcem')|E], pokud se tvé [Concept('realm','panství')|E] sjednotí proti tobě — ať už aby tě [Concept('depose','sesadilo')|E] skrze [Concept('war','válku')|E], nebo aby proti tobě prostě zahájilo [GetScheme('murder').GetTypeName], zatímco spíš — tvá vláda bude odsouzena ke zkrácení.\n\n#TUT Někteří z tvých vazalů mohou zasedat ve tvé [Concept('council','radě')|E], takže jejich [Concept('opinion','mínění')|E] je obzvlášť důležité, protože jim budou svěřeny [Concept('councillor_tasks','úkoly rádce')|E].#!"
 lesson_basics_vassal_limit: "Limit vazalů ($lesson_basics_vassals$)"
 lesson_basics_vassal_limit_desc: "Existuje omezení, kolika [Concept('vassals','vazalům')|E] můžeš pohodlně vládnout, než se tvé [Concept('realm','panství')|E] stane těžkopádným. Překročení tohoto [Concept('vassal_limit','limitu vazalů')|E] ovlivní [Concept('taxes','daně')|E] a [Concept('levies','odvedence')|E], které ti poskytují.\n\nPro tutoriál na tom nezáleží, ale až začneš budovat vlastní království, dávej si pozor, abys nerostl příliš rychle.\n\n#TUT Pokud nakonec překročíš svůj limit vazalů, můžeš svým vazalům udělit tituly nižší [Concept('title_tier','úrovně')|E]. Někdy můžeš dokonce [Concept('create','vytvořit')|E] #EMP nové#! tituly vysoké [Concept('title_tier','úrovně')|E], abys upevnil svou moc v oblasti a posílil svou kontrolu nad nižšími tituly, které jsou tvému novému titulu [Concept('de_jure','de iure')|E] podřízeny.#!"
 lesson_basics_domain_1: "Panství a doména ($lesson_basics_domain$)"
 lesson_basics_domain_1_desc: "Tvé #EMP [Concept('realm','panství')|E]#! je veškerá země a [Concept('titles','tituly')|E], které ovládáš, včetně oblastí držených tvými [Concept('vassals','vazaly')|E]. Právě teď to pro tebe znamená [Concept('counties','hrabství')|E] — kvůli tvé irské [Concept('culture','kultuře')|E] nazývaná „earlství“ — $c_ennis$, $c_thomond$ a $c_ormond$.\n\nKdyž se používá #EMP [Concept('domain','doména')|E]#!, máme naopak na mysli zemi, kterou osobně vlastníš bez $game_concept_vassals$: $c_ennis$ a $c_thomond$.\n\n#TUT Některé události ovlivní pouze tvou [Concept('domain','doménu')|E] ($c_ennis$ a $c_thomond$), zatímco jiné zasáhnou celé tvé [Concept('realm','panství')|E], [Concept('duchy','vévodství')|E] — nebo „malé království“ — Munster.#!"
 lesson_basics_domain_1_b: "Panství a doména ($lesson_basics_domain$)"
 lesson_basics_domain_1_b_desc: "Příklad: v [Concept('county','hrabství')|E] Essex dochází k poklesu počtu dostupných vojáků, protože oblast zaplavili #EMP kanibalové#!. [Concept('holder','Držitel')|E] Essexu bude o této události informován, protože se odehrává uvnitř hranic jeho [Concept('domain','domény')|E]. Jeho [Concept('liege','lenní pán')|E] nikoli. \n\n#TUT #EMP Lenní pán#! hraběte z Essexu má Essex ve svém [Concept('realm','panství')|E] a zjistí, co se děje, jen pokud klikne na hrabství na mapě a všimne si modifikátoru. Nebo pokud si všimne, že mu jeho vazal poskytuje méně odvedenců.#!"
 lesson_basics_domain_2: "$lesson_basics_domain_1$"
 lesson_basics_domain_2_desc: "Pamatuj, že množství země, kterou můžeš osobně držet, je omezené. Po překročení této hranice začneš dostávat postihy: jde o [Concept('domain_limit','limit domény')|E].\n\n#TUT Když překročíš svůj limit domény, může být dobrý nápad použít interakci #TUT_KW Udělit titul#! na [Concept('characters','postavy')|E], s nimiž máš dobré vztahy, a udělat z nich své [Concept('vassals','vazaly')|E].\n\nProtože nemáš žádné volné tituly k rozdání, momentálně to udělat nemůžeš, ale jinak bys tuto možnost našel v nabídce $game_concept_character$, viditelné po kliknutí pravým tlačítkem na $game_concept_character$.#!"
 lesson_basics_council_concept: "Rada ($lesson_basics_council$)"
 lesson_basics_council_concept_desc: "Správa [Concept('realm','panství')|E] je spousta práce. Jako [Concept('ruler','vládce')|E] máš pomoc své [Concept('council','rady')|E] — mohou ji tvořit buď [Concept('vassals','vazalové')|E], nebo členové tvého [Concept('court','dvora')|E], kteří působí jako tvoji důvěryhodní rádci.\n\n#TUT Každé [Concept('skill','dovednosti')|E] odpovídá jedna pozice v radě a sezdaným [Concept('rulers','vládcům')|E] bude pomáhat také jejich [Concept('spouse','choť')|E].#!"
 lesson_basics_council_view_tt: "Otevři zobrazení rady (zvýrazněno)"
 lesson_basics_council_tasks: "Úkoly rady ($lesson_basics_council$)"
 lesson_basics_council_tasks_desc: "[Concept('councillors','Rádce')|E] lze pověřit prací a každý z nich dělá něco jiného!\n\nÚkol rádce můžeš změnit kliknutím na tlačítko poblíž jeho portrétu v zobrazení rady.\n\n#TUT Být rádcem je prestižní postavení — [Concept('powerful_vassals','mocní vazalové')|E] očekávají, že budou jmenováni, a budou nespokojení, pokud zůstanou stranou.#!"
 lesson_basics_schemes_concept: "Intriky ($lesson_basics_schemes$)"
 lesson_basics_schemes_concept_complete: "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_concept_desc: "[Concept('schemes','Intriky')|E] jsou dlouhodobé záměry namířené proti jiné postavě. Mohou mít nepřátelské cíle, například pokus [GetScheme('murder').GetTypeName] nebo [GetScheme('abduct').GetTypeName] proti tvému cíli, anebo mohou být mnohem vlídnější, jako třeba intrika [GetScheme('befriend').GetTypeName]."
 lesson_basics_intrigue_view_tt: "Otevři zobrazení pletichaření (zvýrazněno)"
 lesson_basics_schemes_tab_tt: "Prohlédni si záložku intrik (měla by být ve výchozím stavu otevřená)"
 lesson_basics_hooks_and_secrets_tab_tt: "Prohlédni si záložku pák a tajemství"
 lesson_basics_schemes_murder: "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_murder_desc: "Vhodná chvíle použít [Concept('scheme','intriku')|E] může nastat tehdy, když zjistíš, že [Concept('line_of_succession','linie následnictví')|E] není tak jasná a příznivá, jak by sis přál — jedním ze způsobů, jak se dostat kupředu, je prostě #EMP odstranit#! konkurenci.\n\nPotichu a beze svědků.\n\n#TUT Pokus [GetScheme('murder').GetTypeName] s sebou nese riziko odhalení. Pokud se tvůj pokus zvrtne, tvá [Concept('character','postava')|E] ztratí oblibu — obzvlášť u zamýšleného cíle.#!"
 lesson_basics_schemes_sway: "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_sway_desc: "Intrika Získat přízeň slouží ke zvýšení [Concept('opinion','mínění')|E], které má někdo o tvé postavě. Zkusme ji!"
 lesson_basics_schemes_sway_complete: "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_sway_complete_desc: "Výborně! Jakmile je tvá [Concept('scheme','intrika')|E] uvedena do pohybu, bude se postupem času pomalu rozvíjet. Doba do jejího završení se liší podle [Concept('success_chance','šance na úspěch')|E] intriky, kterou mohou ovlivnit příslušné [Concept('skills','dovednosti')|E] — v tomto případě ji ovlivňuje tvá [Concept('diplomacy','diplomacie')|E].\n\n#TUT Pokud se svou intrikou nejsi spokojený, můžeš ji kdykoli zrušit kliknutím na tlačítko #bold Opustit intriku#! (#TUT_KW X#!) vedle intriky.#!"
 tutorial_basic_schemes_start_swaying_tt: "Klikni pravým tlačítkem na svého [Concept('court_chaplain','dvorního kaplana')|E] — svého „$councillor_court_chaplain_theocrat_duchy$“ — a zvol #TUT_KW Získat přízeň (intrika)#!"
 lesson_basics_hooks: "Tajemství ($lesson_basics_schemes$)"
 lesson_basics_hooks_desc: "Někdy mohou [Concept('schemes','intriky')|E] vést ke vzniku [Concept('secrets','tajemství')|E] — pokud někoho přistihneš při pokusu [GetScheme('murder').GetTypeName], pravděpodobně bude v jeho nejlepším zájmu zajistit, abys o tom mlčel.\n\nMůžeš ho také [Concept('blackmail','vydírat')|E] a získat tak [Concept('hook','páku')|E]! $game_concept_hooks$ představují laskavost, kterou si můžeš vyžádat, nebo moc, kterou nad určitou [Concept('character','postavou')|E] držíš, což ti umožňuje ji pobídnout — nebo donutit — aby jednala podle tvé vůle.\n\nBěhem hraní najdeš mnoho různých způsobů, jak $game_concept_hooks$ získávat a využívat. Experimentuj s nimi!\n\n#TUT Dále budeme předstírat, že se ti podařilo získat [Concept('hook','páku')|E] na jednoho z tvých [Concept('vassals','vazalů')|E]...#!"
 lesson_basics_hooks_complete: "Páky ($lesson_basics_schemes$)"
 lesson_basics_hooks_complete_desc: "Tuto [Concept('weak_hook','slabou páku')|E] lze využít k řadě věcí. Například můžeš zvýšit [Concept('obligations','povinnosti')|E] stanovené [Concept('vassal_contract','vazalskou smlouvou')|E], kterou máš s [GetGovernment('feudal_government').GetName] [Concept('vassal','vazalem')|E].\n\n#TUT Do nabídky pro změnu vazalské smlouvy se dostaneš přes seznam vazalů v zobrazení panství nebo kliknutím pravým tlačítkem na jeho portrét a volbou #TUT_KW Upravit vazalskou smlouvu#!.#!\n\nMožná si všimneš, že některé interakce nejsou okamžitě viditelné. Když máš k dispozici mnoho interakcí, nabídka interakcí [Concept('character','postavy')|E] zobrazuje jen ty nejběžnější.\n\nChybějící interakce zobrazíš kliknutím na tlačítko „Více...“ v příslušné kategorii.#!"
 lesson_basics_culture_open_view: "Kultury"
 lesson_basics_culture_open_view_desc: "Každá [Concept('character','postava')|E] a každé [Concept('county','hrabství')|E] patří k určité [Concept('culture','kultuře')|E]. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_open_view_desc_INGAME', '' )]"
 lesson_basics_culture_open_view_desc_INGAME: "\n\nTvůj současný [Concept('ruler','vládce')|E] je součástí kultury [GetPlayer.GetCulture.GetNameNoTooltip], která je zobrazena vlevo dole."
 lesson_basics_culture_open_view_trigger: "Otevři zobrazení kultury (zvýrazněno)"
 lesson_basics_culture_elements: "Kultury"
 lesson_basics_culture_elements_desc: "[Concept('culture','Kulturu')|E] určuje její [Concept('ethos','étos')|E], [Concept('culture_pillars','kulturní pilíře')|E] a [Concept('traditions','tradice')|E]. Každý z těchto prvků přináší všem členům kultury různé výhody nebo postihy.\n\n#V Étos#! popisuje základní hodnoty kultury. Je hlavním určujícím faktorem toho, jaké tradice jsou pro kulturu dostupné. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_elements_desc_INGAME', '' )]\n\n#V Kulturní pilíře#! odrážejí původ kultury a také je nelze měnit. Mají silný vliv na [Concept('cultural_acceptance','kulturní přijetí')|E] ostatních kultur, jinak jsou však méně důležité než étos.\n\n#V Tradice#! kultury jsou pružnější, ale přesto mohou být pro kulturu mimořádně důležité. Na rozdíl od étosu a pilířů je může měnit hlava kultury, což je naše další téma."
 lesson_basics_culture_elements_desc_INGAME: "Étos tvé kultury, [GetPlayer.GetCulture.GetCollectiveNounNoTooltip], je [GetPlayer.GetCulture.GetEthos.GetName]."
 lesson_basics_culture_culture_head: "Kultury (hlava kultury)"
 lesson_basics_culture_culture_head_desc: "[Concept('culture_head','Hlava kultury')|E] je [Concept('ruler','vládce')|E] dané [Concept('culture','kultury')|E] s největším [Concept('realm','panstvím')|E]. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_culture_head_desc_INGAME', '' )]\n\nHlava kultury může své kultuře zavádět nové tradice.\n\nTaké hraje důležitou roli v technologickém a společenském rozvoji své kultury, na který se nyní podíváme."
 lesson_basics_culture_culture_head_desc_INGAME: "[SelectLocalization(ObjectsEqual(GetPlayer, GetPlayer.GetCulture.GetCultureHead), 'lesson_basics_culture_culture_head_desc_YOU', 'lesson_basics_culture_culture_head_desc_OTHER' )]"
 lesson_basics_culture_culture_head_desc_YOU: "Jsi hlavou své kultury."
 lesson_basics_culture_culture_head_desc_OTHER: "[GetPlayer.GetCulture.GetCultureHead.GetName] je hlavou tvé kultury."
 lesson_basics_culture_innovations_open: "Kultury (inovace)"
 lesson_basics_culture_innovations_open_desc: "Tvá [Concept('culture','kultura')|E] určuje, ke kterým [Concept('innovations','inovacím')|E] máš přístup; jsou zobrazeny na záložce inovací."
 lesson_basics_culture_open_innovations_tab_trigger: "Otevři záložku inovací (zvýrazněno)"
 lesson_basics_culture_innovations: "Kultury (inovace)"
 lesson_basics_culture_innovations_desc: "[Concept('innovations','Inovace')|E] jsou vynálezy a přizpůsobení, které může [Concept('culture','kultura')|E] postupem času objevit. $game_concept_innovations$ poskytují nové bonusy, [Concept('buildings','budovy')|E] a [Concept('men_at_arms','ozbrojence')|E] všem členům $game_concept_culture$.\n\nInovace jsou seskupeny do [Concept('eras','ér')|E], takže většina inovací v raných částech hry jednoduše není dostupná. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_innovations_desc_INGAME', '' )]"
 lesson_basics_culture_innovations_desc_INGAME: "Tvá kultura se momentálně nachází v éře [GetPlayer.GetCulture.GetCultureEra.GetName]."
 lesson_basics_culture_innovations_spread: "Kultury (inovace)"
 lesson_basics_culture_innovations_spread_desc: "[Concept('innovations','Inovace')|E] se obvykle objevují velmi pomalu. [Concept('culture_head','Hlava kultury')|E] však může také urychlit objevování určité inovace svou [Concept('culture','kulturou')|E] tím, že ji zvolí jako [Concept('fascination','fascinaci')|E] kultury (zvýrazněno).\n\n#I Když jsi hlavou kultury, můžeš kliknutím na inovaci nastavit novou fascinaci.#!\n\nKultury také objevují inovace rychleji, pokud je už objevily sousední kultury."
 lesson_basics_religion_1: "Víry a náboženství"
 lesson_basics_religion_1_read_only: "$lesson_basics_religion_1$"
 lesson_basics_religion_1_desc: "Všechny [Concept('characters','postavy')|E] věří v nějakou [Concept('faith','víru')|E], která zase patří k určitému [Concept('religion','náboženství')|E]. Například katolicismus je $game_concept_faith$, která patří ke $christianity_religion$.\n\nKaždá $game_concept_faith$ se liší od každé jiné $game_concept_faith$ — podívejme se na to blíže."
 lesson_basics_religion_click_religion_tt: "Otevři zobrazení víry (zvýrazněno)"
 lesson_basics_religion_2: "Doktríny ($lesson_basics_religion$)"
 lesson_basics_religion_2_desc: "Tvá [Concept('faith','víra')|E] má řadu [Concept('doctrines','doktrín')|E]. Tyto $game_concept_doctrines$ stanovují pravidla pro členy $game_concept_faith$ a určují mnoho věcí, například dostupné zákony nástupnictví podle pohlaví nebo to, jaké postavy mohou držet [Concept('temple_holdings','chrámové državy')|E].\n\n[Concept('core_tenets','Zásady')|E] nahoře jsou zvláštní $game_concept_doctrines$, které tvé postavě poskytují bonusy nebo možnosti, například schopnost meditovat nebo účastnit se [Concept('great_holy_wars','velkých svatých válek')|E].\n\n#TUT Všechny víry mají také [Concept('sins','hříchy')|E] a [Concept('virtues','ctnosti')|E], které označují chování, na něž se tví vrstevníci dívají buď s nelibostí, nebo s obdivem.#!"
 lesson_basics_religion_3: "@fervor_icon! Horlivost ($lesson_basics_religion$)"
 lesson_basics_religion_3_desc: "Všechny [Concept('faiths','víry')|E] mají [Concept('fervor','horlivost')|E], která v průběhu času stoupá a klesá podle počtu stoupenců $game_concept_faith$, průběhu [Concept('holy_wars','svatých válek')|E] a dalších okolností. $game_concept_fervor$ představuje, jak fanaticky se většina členů $game_concept_faith$ právě cítí, včetně nesčetných nemytých sedláků po celém světě.\n\nKdyž má tvá $game_concept_faith$ vysoký $game_concept_fervor$, je snazší obracet [Concept('counties','hrabství')|E] pomocí [Concept('convert_county','obrácení hrabství')|E] na tvou $game_concept_faith$ a $game_concept_counties$ tvé $game_concept_faith$ #EMP odolávají#! konverzi k jiným $game_concept_faiths$.\n\nKdyž je však $game_concept_fervor$ nízká, $game_concept_rulers$ se mohou rozhodnout opustit svou současnou $game_concept_faith$ ve prospěch jiné víry ze stejného [Concept('religion','náboženství')|E], čímž vznikne [Concept('heresy','kacířství')|E]. \n\n#TUT Kacířští $game_concept_rulers$ konvertují spolu se svým nejbližším územím a vazaly a mohou svobodně šířit svou novou $game_concept_faith$ namísto té staré.#!"
 lesson_basics_religion_4: "Nová víra ($lesson_basics_religion$)"
 lesson_basics_religion_4_no_GUI_highlight: "$lesson_basics_religion_4$"
 lesson_basics_religion_4_desc: "Ze zobrazení [Concept('faith','víry')|E] je možné vytvořit vlastní novou $game_concept_faith$. [Concept('doctrines','Doktríny')|E] a [Concept('core_tenets','zásady')|E] budou stát určité množství [Concept('piety','zbožnosti')|E] podle toho, jaké $game_concept_core_tenets$ má tvá současná $game_concept_faith$.\n\nU své první [Concept('character','postavy')|E] si s tím nemusíš dělat starosti, ale až se budeš cítit jistěji, může to být velmi zábavný první cíl!\n\n#TUT [Concept('family_members','Členové rodiny')|E] a [Concept('vassals','vazalové')|E], kteří o tobě mají vysoké [Concept('opinion','mínění')|E], se pravděpodobně přidají k tvé nové $game_concept_faith$ a vysoká [Concept('learning','učenost')|E] dokáže přesvědčit ještě mnohem víc lidí. Každý příslušník tvé staré $game_concept_faith$, který nekonvertuje, tě však bude považovat za kacíře.#!"
 lesson_basics_warfare: "Válka ($lesson_basics_war$)"
 lesson_basics_warfare_desc: "[Concept('war','Válka')|E] je zásadní součástí Crusader Kings III. Je potřeba probrat mnoho pojmů, ale prozatím se jen krátce dotkneme některých z nich.\n\n#TUT Zbytek i podrobnosti tě necháme objevit, až začneš hrát.#!"
 lesson_basics_levies: "Válka ($lesson_basics_war$)"
 lesson_basics_levies_complete: "$lesson_basics_levies$"
 lesson_basics_levies_desc: "Nejdůležitějšími událostmi v každé válce jsou [Concept('battles','bitvy')|E], v nichž bojují [Concept('armies','armády')|E]. Většina tvých vojáků bude pocházet z [Concept('levies','odvedenců')|E], ale svou $game_concept_army$ můžeš rozšířit najímáním [Concept('men_at_arms','ozbrojenců')|E].\n\n#TUT Pokud půjde opravdu do tuhého, můžeš také najmout [Concept('mercenaries','žoldnéře')|E] — pokud na ně máš [Concept('gold','zlato')|E].#!"
 lesson_basics_military_view_tt: "Otevři zobrazení vojska (zvýrazněno)"
 lesson_basics_rally_points: "Válka ($lesson_basics_war$)"
 lesson_basics_rally_points_desc: "Když začne [Concept('war','válka')|E], můžeš své [Concept('armies','armády')|E] povolat jediným kliknutím na velké červené tlačítko „$RAISE_ALL$“, které se objeví spolu s ikonou $game_concept_war_score$ v pravém dolním rohu obrazovky — samozřejmě můžeš použít $RAISE_ALL$ i z tohoto zobrazení vojska.\n\nKdyž $game_concept_war$ skončí, musíš své vojáky rozpustit, než začneš další $game_concept_war$.\n\n#TUT [Concept('rally_points','Shromaždiště')|E] jsou místa shromáždění [Concept('levies','odvedenců')|E] a [Concept('men_at_arms','ozbrojenců')|E] pod tvým velením; právě zde se objeví, když budou povoláni do války.#!"
 lesson_basics_casus_belli: "Válka ($lesson_basics_war$)"
 lesson_basics_casus_belli_desc: "K zahájení [Concept('war','války')|E] budeš potřebovat legitimní důvod, [Concept('casus_belli','casus belli')|E], proti jinému [Concept('ruler','vládci')|E].\n\nExistují různé způsoby, jak získat $game_concept_casus_belli$: můžeš mít [Concept('de_jure','de iure')|E] [Concept('titles','tituly')|E], které z tebe činí [Concept('rightful_liege','právoplatného lenního pána')|E] tvého cíle, můžeš zdědit [Concept('claims','nároky')|E] nebo můžeš vést [Concept('holy_wars','svaté války')|E] proti okolním nevěřícím.\n\nAčkoli jde o nejběžnější možnosti, existují desítky různých typů $game_concept_casus_belli$, které můžeš během hraní objevit a využít!\n\n#TUT Nejjednodušší a nejpřímočařejší způsob, jak získat $game_concept_claims$, je použít #EMP [Concept('fabricate_claim','zfalšování nároku')|E]#!. O to se stará tvůj [Concept('court_chaplain','dvorní kaplan')|E] prostřednictvím jednoho ze svých [Concept('councillor_tasks','úkolů rádce')|E].#!"
 lesson_basics_pausing_2: "Už skoro začínáme ($lesson_basics_unpause$)"
 lesson_basics_pausing_2_desc: "Brzy ti dovolíme hru spustit! Nejprve je ale třeba projít ještě několik věcí.\n\nZaprvé je důležité vědět, že máš k dispozici pět různých rychlostí hry — mezi nimi můžeš snadno přepínat klávesami 1–5 — a kdykoli budeš chtít, můžeš hru pozastavit nebo změnit její tempo.\n\n#BOLD Zadruhé se hra při některých důležitých událostech automaticky pozastaví.#!\n\n#TUT Není nic špatného na hraní při nižších rychlostech, zrychlení, když je klid, nebo zpomalení, když jdeš do války.\n\nObecně doporučujeme hru pozastavit při prohlížení nabídek nebo když stojíš před těžkými rozhodnutími.#!"
 lesson_basics_pausing_3: "Spuštění hry ($lesson_basics_unpause$)"
 lesson_basics_pausing_3_desc: "Aby se čas začal odvíjet, spusť hru — pomocí #EMP mezerníku#! nebo kliknutím na tlačítko přehrávání v pravém dolním rohu.\n\nDíky tomu začnou plynout dny, měsíce a roky. Armády, kterým bylo nařízeno pochodovat, se pohnou, na obrazovce se objeví události, budou odesílány dopisy a [Concept('characters','postavy')|E] budou stárnout.\n\n#TUT Najdi si rychlost, která ti vyhovuje — později ji můžeš kdykoli změnit.#!"
 lesson_declare_war_step_1: "Co teď?"
 lesson_declare_war_step_1_complete: "$lesson_declare_war_step_1$"
 lesson_declare_war_step_1_desc: "Nyní si jako první úkol připomeňme tvému sousedovi, earlovi z $c_desmond$, kdo je skutečně jeho [Concept('rightful_liege','právoplatným lenním pánem')|E]... Pokud se tím náhodou rozšíří tvé [Concept('realm','panství')|E], tak budiž!\n\nPomocí systému interakcí s postavami, který jsme si prošli dříve, a výběrem postavy přes mapu vyhlaš válku [Concept('ruler','vládci')|E] $c_desmond$. Už bys měl mít platný [Concept('casus_belli','casus belli')|E], protože jeho [Concept('title','titul')|E] je [Concept('de_jure','de iure')|E] součástí tvého $game_concept_realm$.\n\n#TUT Aby sis to vyzkoušel praktičtěji, nyní tě provedeme tím, co se během války děje.#!"
 lesson_declare_war_tt: "#TUT_KW Vyhlásit válku#! earlovi Muiredachovi z $c_desmond$"
 lesson_raise_troops_step_1: "Povolat armády"
 lesson_raise_troops_step_2: "$lesson_raise_troops_step_1$"
 lesson_raise_troops_step_1_desc: "Nyní jsi ve [Concept('war','válce')|E]! Dále bys měl shromáždit své [Concept('armies','armády')|E]. Ve spodní části obrazovky se objevilo tlačítko, které ti s tím pomůže, ale můžeš to udělat také ze zobrazení vojska.\n\n#TUT Ať už je tvé [Concept('rally_point','shromaždiště')|E] kdekoli, právě tam se tvá [Concept('army','armáda')|E] shromáždí a bude čekat na tvé rozkazy.\n\nPoznámka: Aby se tvá $game_concept_army$ shromáždila ve větším počtu než jen hrstce mužů, budeš muset spustit hru — stiskni „mezerník“! Nech uběhnout několik dní a armáda bude v plné síle!#!"
 lesson_declare_war_step_2: "$lesson_declare_war_step_1$"
 lesson_raise_troops_tt: "Povolej své armády"
 lesson_army_movement_step_1: "Pohyb armády"
 lesson_army_movement_step_1_desc: "Chceš-li přesunout svou [Concept('army','armádu')|E], klikni na $game_concept_army$ na mapě a poté klikni pravým tlačítkem na oblast, kam ji chceš poslat.\n\nK vítězství ve [Concept('war','válce')|E] obvykle musíš dobýt nepřátelské [Concept('realm_capital','hlavní sídlo panství')|E] během [Concept('siege','obléhání')|E]. Proto by ses při útoku měl obvykle zaměřit právě na to.\n\n#TUT Pokud své $game_concept_army$ nařídíš přesun přes vodu, [Concept('embark','nalodí se')|E] a promění se ve [Concept('fleet','flotilu')|E]. Prozatím zůstaňme na souši.#!"
 lesson_army_purpose_step_1: "Armáda"
 lesson_army_purpose_step_1_desc: "Teď, když je tvá [Concept('army','armáda')|E] v pohybu, pravděpodobně míří do boje s nepřátelskými silami. Může jít o přímý střet s jinými $game_concept_armies$, nebo o začátek [Concept('siege','obléhání')|E].\n\n#TUT [Concept('battles','Bitvy')|E] se odehrají automaticky, pokud se dvě nepřátelské $game_concept_armies$ střetnou. Podobně vznikají $game_concept_sieges$, když umístíš svou $game_concept_army$ na nepřátelskou [Concept('holding','državu')|E].\n\nPokud jsi to ještě neudělal, teď je vhodná chvíle #EMP spustit hru#!. Jinak čas stojí a tvé $game_concept_armies$ se nebudou pohybovat!#!"
 lesson_battle_mechanics_step_1: "Bitva!"
 lesson_battle_mechanics_step_1_desc: "Výsledek [Concept('battle','bitvy')|E] mezi dvěma [Concept('armies','armádami')|E] závisí na řadě věcí: počtu [Concept('levies','odvedenců')|E] na obou stranách, na tom, jaké [Concept('men_at_arms','ozbrojence')|E] která strana případně používá, na zapojených [Concept('commanders','velitelích')|E] a dokonce i na [Concept('terrain','terénu')|E], v němž bojuješ.\n\n#TUT Další podrobnosti lze vyčíst ze zobrazení boje — otevřeš ho kliknutím na svou bojující $game_concept_army$.#!"
 lesson_siege_mechanics_step_1: "Obléhání!"
 lesson_siege_mechanics_step_1_desc: "[Concept('army','Armáda')|E] útočí na [Concept('holding','državu')|E]! Klikni na zvýrazněnou ikonu — hroty kopí! — a zjisti, jak se jí daří.\n\nVětšinu válek lze vyhrát jen tehdy, když každá strana vyhrává $game_concept_sieges$, protože ta zvyšují tvé [Concept('war_score','válečné skóre')|E].\n\nKdykoli je $game_concept_siege$ vyhráno — což trvá několik kol útoku — oblast bude [Concept('occupied','obsazena')|E] a při oddálení se její běžné jednobarevné zobrazení na mapě změní na pruhované."
 lesson_warscore_step_1: "Válečné skóre"
 lesson_warscore_step_1_desc: "Chceš-li získat představu, kdo ve [Concept('war','válce')|E] vítězí, můžeš se kdykoli podívat na [Concept('war_score','válečné skóre')|E] v pravém dolním rohu. Pohybuje se od #N -100#! do #P +100#! a mění se podle vyhraných či prohraných [Concept('battles','bitev')|E] a [Concept('sieges','obléhání')|E] i podle obsazeného území.\n\n#TUT Při #P 100#! $game_concept_war_score$ můžeš druhou stranu donutit přijmout svou [Concept('peace_offer','mírovou nabídku')|E].\n\nNaopak při #N -100#! $game_concept_war_score$ mohou #EMP oni#! donutit #EMP tebe#! přijmout #EMP jejich#! [Concept('peace_offer','mírovou nabídku')|E].#!"
 lesson_warscore_step_2: "Výsledky války"
 lesson_warscore_step_2_desc: "Všechny [Concept('wars','války')|E] končí jedním ze tří způsobů:\n$EFFECT_LIST_BULLET$[Concept('victory','vítězstvím')|E]\n$EFFECT_LIST_BULLET$[Concept('white_peace','bílým mírem')|E]\n$EFFECT_LIST_BULLET$[Concept('defeat','porážkou')|E]\n\nPřesné důsledky každé z těchto možností se liší podle [Concept('casus_belli','casus belli')|E].\n\n#TUT Podrobnosti konkrétní války najdeš kliknutím pravým tlačítkem na nepřátelského [Concept('ruler','vládce')|E] a výběrem #TUT_KW Nabídnout mír#!, nebo kliknutím na ikonu $game_concept_war_score$ vpravo dole a následným výběrem jedné ze záložek ve spodní části obrazovky.#!"
 lesson_winning_wars_step_1: "Vítězství je blízko"
 lesson_winning_wars_step_1_desc: "Tvé [Concept('war_score','válečné skóre')|E] je na #P +100 %#!\n\nNyní můžeš prosadit své požadavky kliknutím na ikonu $game_concept_war_score$, čímž otevřeš zobrazení války, a poté výběrem záložky #TUT_KW Prosadit požadavky#! ve spodní části obrazovky.\n\n#TUT Můžeš také kliknout pravým tlačítkem na nepřátelského [Concept('ruler','vládce')|E] a zvolit #TUT_KW Nabídnout mír#!.#!"
 lesson_losing_wars_step_1: "Hrozící porážka"
 lesson_losing_wars_step_1_desc: "Tato [Concept('war','válka')|E] se nevyvíjí dobře! Možná nastal čas požádat o [Concept('white_peace','bílý mír')|E].\n\nI když může být #EMP tato#! $game_concept_war$ ztracená, není na škodu přijmout porážku a žít, abys mohl bojovat jindy — klikni pravým tlačítkem na svého nepřítele a v zobrazení interakcí zvol #TUT_KW Bílý mír#! nebo #TUT_KW Vzdát se#!, pokud bílý mír není dostupný."
 lesson_war_final_notes_reuse: "\n\n#TUT Výukové lekce zde končí. Rady se však budou i nadále občas objevovat jako výstražné ikony v horní části obrazovky. Kliknutím na tyto výstrahy rad se dozvíš více o určitých situacích nebo systémech, s nimiž se právě potýkáš!\n\nDěkujeme, že jsi s námi zůstal — a hodně štěstí!#!"
 lesson_war_final_notes_victory_step_1: "Válka vyhrána!"
 lesson_war_final_notes_victory_step_1_desc: "Gratulujeme k tvému [Concept('victory','vítězství')|E]!\n\nNyní sis vyzkoušel, jaké to je projít jednou ze zásadních částí hry.$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_defeat_step_1: "Válka prohrána"
 lesson_war_final_notes_defeat_step_1_desc: "Truchlíme nad tvou [Concept('defeat','porážkou')|E] spolu s tebou, ale buď si jistý, že jsi nyní prošel náročnou částí hry, a odtud už to bude jen snazší.$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_white_peace_step_1: "Bílý mír"
 lesson_war_final_notes_white_peace_step_1_desc: "Tolika věcem ses naučil! A kolik si toho odneseš do budoucna!$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_invalidated_step_1: "Válka zneplatněna"
 lesson_war_final_notes_invalidated_step_1_desc: "Pořád jsi tady! Výborně! I když je zvláštní, že válka přestala být platná.$lesson_war_final_notes_reuse$"
 lesson_guided_final_notes_mission_step_1: "Co teď?"
 lesson_guided_final_notes_mission_step_1_desc: "Teď, když ses krátce seznámil s některými zásadními systémy, můžeš dělat spoustu věcí — Crusader Kings III je o stanovování vlastních cílů.\n\nPokud chceš doporučení, zkus se stát králem nebo královnou celého $k_ireland$! [Concept('war','Válka')|E] navíc není jedinou cestou...\n\nNebo můžeš kliknout nahoře na tlačítko #bold Tipy#! a podívat se, jestli tě některá z položek zaujme!"
 lesson_open_war_overview_tt: "Otevři zobrazení války (zvýrazněno)"
