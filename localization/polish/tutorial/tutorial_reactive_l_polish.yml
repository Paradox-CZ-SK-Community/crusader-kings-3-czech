 ra_contracts_1_desc: "$game_concept_task_contract_desc$"
 ra_landless_adventurer_1: "Bezdomovský dobrodruh"
 ra_landless_adventurer_2: "Váš tábor"
 ra_landless_adventurer_3: "Vaši následovníci"
 ra_landless_adventurer_4: "Smlouvy"
 ra_landless_adventurer_5: "Účel tábora"
 ra_landless_adventurer_6: "Na cestě k moci"
 ra_landless_adventurer_1_desc: "@ra_landless_adventurer_2! \nJste [Concept('adventurer','dobrodruh')|e]! Cestujte světem, navštěvujte [Concept('courts','dvory')|e] [Concept('rulers','vládci')|e], abyste našli práci, a plňte [Concept('task_contracts','zakázky')|e] za odměny. Můžete vylepšovat svůj [Concept('camp','tábor')|e], náborovat [Concept('followers','družiníci')|e] a budovat rozsáhlý [Concept('contact_list','seznam patronů')|e]." # todo: CONCEPT CASE
 ra_landless_adventurer_2_desc: "Jako [Concept('adventurer','dobrodruh')|e] nejste vázáni na žádný kus země a máte svobodu cestovat po světě. Vaším základním působištěm jako $game_concept_adventurer$ je váš [Concept('camp','tábor')|e], který můžete během své dobrodružné kariéry vylepšovat a rozšiřovat pomocí [Concept('camp_buildings','vylepšení tábora')|e]." # todo: CONCEPT CASE
 ra_landless_adventurer_3_desc: "Během svých cest můžete shromažďovat [Concept('followers','družiníci')|e], kteří slouží podobnému účelu jako [Concept('courtiers','dvořané')|e] pozemských [Concept('rulers','vládců')|e]. Při [Concept('traveling','cestování')|e] jako [Concept('adventurer','dobrodruh')|e] budete mít možnost využít [GetTravelOption('adventurers_scout_for_talent_option').GetName] [Concept('travel_option','možnost cesty')|e].\n\nKromě toho můžete získat nové družiníky i rozhodnutím Visit Holding [Concept('decision','rozhodnutí')|e]. Ve svém táboru můžete své družiníky zobrazit pomocí tlačítka v levém horním rohu panelu." # todo: CONCEPT CASE
 ra_landless_adventurer_4_desc: "Jako [Concept('adventurer','dobrodruh')|e] bude vaším hlavním zdrojem příjmů [Concept('task_contracts','zakázek')|e]. Vidíte je na mapě jako svitky. Zakázky jsou roztroušeny po celém světě a vyžadují, abyste splnili konkrétní úkol pro zadavatele.\n\nVáš [Concept('prestige_level','úroveň slávy')|E] určuje [Concept('task_contract_tier','úroveň $TASK_CONTRACT_CONTRACT$')|e] $game_concept_task_contracts$, které obdržíte. Získání úrovně [GetPrestigeLevelName('(int32)2')] nebo vyšší odemkne možnost koupit nebo dobýt [Concept('land','pozemek')|E], pokud se chcete stát [Concept('landed','zeměpán')|E] [Concept('ruler','vládce')|E]. Vyšší úrovně odemykají silnější možnosti.\n\nNové zakázku můžete získat přesunem svého [Concept('camp','táboru')|e], což bude stát určité množství [provisions_i][Concept('provisions','proviant')|e] podle vzdálenosti." # todo: CONCEPT CASE
 ra_landless_adventurer_5_desc: "Detaily o vašem [Concept('camp','táboru')|e] si můžete prohlédnout na kartě panství (zvýrazněno). Odtud můžete změnit [Concept('camp_purpose','účel tábora')|e] a otevřít přehled $game_concept_camp$.\n\nÚčel vašeho táboru určuje typ [Concept('task_contracts','zakázky')|e], které budete nacházet, může odemknout určité [Concept('decisions','rozhodnutí')|e] a [Concept('camp_buildings','vylepšení tábora')|e] a poskytne řadu dalších výhod." # todo: CONCEPT CASE
 ra_landless_adventurer_6_desc: "@ra_landless_adventurer!\nPřijímejte [Concept('task_contracts','zakázky')|e], přesouvejte svůj [Concept('camp','tábor')|e], objevujte různé části světa a rozšiřujte své [Concept('following','družiny')|e].\n\nJako [Concept('adventurer','dobrodruh')|e] máte svobodu zvolit budoucí cestu své [Concept('dynasty','dynastii')|e]. Zůstanete na cestě, pokusíte se získat [Concept('title','titul')|e] v daleké zemi, nebo se budete plést do záležitostí [Concept('rulers','vládců')|e] po celém světě?" # todo: CONCEPT CASE
 reactive_advice_admin_gov: "Administrativní vláda"
 ra_admin_gov_1: "$reactive_advice_admin_gov$"
 ra_admin_gov_1b: "$reactive_advice_admin_gov$"
 ra_admin_gov_2: "$reactive_advice_admin_gov$"
 ra_admin_gov_2b: "$reactive_advice_admin_gov$"
 ra_admin_gov_3: "Přehled provincie"
 ra_admin_gov_4: "Nástupnictví a vliv"
 ra_admin_gov_5: "Správa provincie"
 ra_admin_gov_5b: "Správa provincie"
 ra_admin_gov_6: "Silné rodiny"
 ra_admin_gov_7: "Usedlosti"
 ra_admin_gov_8: "Na cestě k moci"
 ra_admin_gov_1_desc: "@ra_admin_gov_1!Nacházíte se v [Concept('administrative_government','administrativní vládě')|e]. Skládá se z $TUTORIAL_GOVERNORS$, kteří spravují a dohlížejí na půdu pro svého [Concept('top_liege','nejvyššího lenního pána')|e], i když tu půdu ve skutečnosti nevlastní." # todo: CONCEPT CASE
 ra_open_admin_gov_panel_prompt: "Otevřete kartu '$TUTORIAL_PROVINCES_NO_TOOLTIP$' v panelu administrativní vlády (zvýrazněno)"
 ra_admin_gov_2_desc: "Zde jsou všechny $TUTORIAL_PROVINCES$ přítomné v rámci [Concept('top_realm','nejvyšších říší')|e].\n\nJeden $TUTORIAL_GOVERNOR$ může držet pouze jednu $TUTORIAL_PROVINCE_NO_TOOLTIP$; sílit znamená rozdělovat vládu nad $TUTORIAL_PROVINCES_NO_TOOLTIP$ mezi členy jeho [Concept('house','rodu')|e].\n\nProtože $TUTORIAL_GOVERNORS_NO_TOOLTIP$ nevlastní svou $TUTORIAL_PROVINCE_NO_TOOLTIP$, budou si muset své pozice zajistit pomocí [Concept('schemes','intrik')|e] a politických akcí.\n\n#I Můžete prohlédnout $TUTORIAL_PROVINCES_NO_TOOLTIP$ buď kliknutím na mapě, nebo v seznamu.#!" # todo: CONCEPT CASE
 ra_open_admin_gov_theme_detail_prompt: "Prohlédněte si $TUTORIAL_PROVINCE_NO_TOOLTIP$"
 ra_admin_gov_3_desc: "Dovednosti [Concept('skills','dovednosti')|e] $TUTORIAL_GOVERNOR_NO_TOOLTIP$ a jejich hodnost v [GetTrait('governor').GetName( GetNullCharacter )] [Concept('trait','ryse')|e] určí jejich [Concept('governor_efficiency','efektivita guvernéra')|e], což měří, kolik [Concept('levies','odvedence')|e] a [Concept('taxes','daně')|e] budou schopni vybrat pro svého nejvyššího lenního pána.\n\nVysoká $game_concept_governor_efficiency$ rovněž posiluje $TUTORIAL_PROVINCIAL_ARMIES$ [Concept('province','provincie')|E].\n\nPokud jste [Concept('top_liege','nejvyšší lenní pán')|e], měli byste usilovat o to, aby $game_concept_provinces$ byly drženy $TUTORIAL_GOVERNORS_NO_TOOLTIP$ s vysokou efektivitou guvernéra." # todo: CONCEPT CASE
 ra_admin_gov_3_prompt: "Otevřete kartu '$TUTORIAL_GOVERNOR_NO_TOOLTIP$ Jmenování'" # todo: NEW TRANSLATION
 ra_admin_gov_4_desc: "Nástupnictví [Concept('succession','nástupnictví')|e] $TUTORIAL_PROVINCE$ v [Concept('administrative_government','administrativní vládě')|e] je určeno volbami, při nichž utrácíte @influence_icon![Concept('influence','vliv')|e] za zvýšení [Concept('candidate_score','skóre kandidáta')|E] kandidáta. \n\nPokud se snažíte rozšířit svou moc v [Concept('realm','panství')|e], měli byste zajistit, aby členové vaší [Concept('house','rod')|e] byli $TUTORIAL_GOVERNORS$, nebo dokonce drželi sami $game_concept_top_realm$ [Concept('title','titul')|e]." # todo: CONCEPT CASE
 ra_admin_gov_5_desc: "Každá $TUTORIAL_PROVINCE$ je [Concept('governed','spravovaný')|e] [Concept('family','rodina')|e]. Vedle každé $TUTORIAL_PROVINCE_NO_TOOLTIP$ je zobrazen erb [Concept('house','rod')|e].\n\nJakmile se vaše $game_concept_house$ dostane k více [Concept('titles','tituly')|e], stanete se významnějšími a potenciálně se můžete stát [Concept('powerful_family','mocná rodina')|e]." # todo: CONCEPT CASE
 ra_open_admin_gov_powerful_families_intro: "Otevřete kartu Šlechtických rodin (zvýrazněno)"
 ra_admin_gov_6_desc: "[Concept('powerful_family','Mocná rodina')|e] je vlivná [Concept('house','rod')|e] v rámci [Concept('administrative_government','administrativní vlády')|e]. Rodina [Concept('top_liege','nejvyšší lenní pán')|e] je vždy považována za vlivnou, bez ohledu na jejich [Concept('powerful_family_rating_mid','hodnocení rodiny')|e]. Kromě toho může existovat dalších pět $game_concept_powerful_families$.\n\nAčkoli jakákoli $game_concept_house$ může nastavit [Concept('powerful_family_attribute','atribut mocné rodiny')|E], platí to pouze tehdy, pokud je její přidružená Family považována za Powerful." # todo: CONCEPT CASE
 ra_open_admin_gov_open_estate_prompt: "Zobrazit vaši usedlost"
 ra_admin_gov_7_desc: "[Concept('estate','Statek')|e] je typ [Concept('domicile','domicil')|e], který představuje soukromé držení půdy, jež není vázáno na žádné konkrétní [Concept('landed','zeměpána')|e] [Concept('titles','tituly')|e]. V [Concept('administrative_government','administrativní vládě')|e] slouží jako základna pro vaši [Concept('family','rodinu')|e] a bude děděna uvnitř vaší [Concept('house','rod')|e].\n\nVe svém statku můžete vylepšovat a stavět nové [Concept('estate_buildings','budovy statků')|e], abyste zvýšili svůj [Concept('influence','vliv')|e] a politický vliv v rámci [Concept('realm','panství')|e].\n\n#TUT Pozor: [Concept('feudal','feudálního')|e] [Concept('rulers','vládce')|e] v rámci administrativní vlády nebudou mít přístup k statku.#!" # todo: CONCEPT CASE
 ra_admin_gov_8_desc: "@ra_admin_gov_8! [Concept('administrative_government','Administrativní vláda')|e] je vše o rodině, politickém vlivu, intrikách a jmenování správné osoby na správné místo.\n\nBudete využívat [Concept('influence','vliv')|e] ke zlepšení svého postavení v rámci [Concept('realm','panství')|e], zatímco budete členy své [Concept('dynasty','dynastii')|e] nasměrovávat na mocenské pozice.\n\n[Concept('scheme','Intrika')|e] proti svým rivalům a podrývejte jejich autoritu prostřednictvím politických intrik. Cesta k moci je dlouhá a klikatá, ale hrajete-li své karty správně, můžete ji úspěšně projít." # todo: CONCEPT CASE
 ra_agent_scheme_rework_1: "Komplexní schémata"
 ra_agent_scheme_rework_1_desc: "Věnujme chvíli probrání komplexních [Concept('schemes','intrik')|e]. Tato $game_concept_schemes$ se skládají ze tří hlavních parametrů: [Concept('success_chance','šancí na úspěch')|e], [Concept('scheme_speed_single','délky fáze')|e] a [Concept('secrecy','utajení')|e].\n\nAbychom vám v dokončení intrice pomohli, existují různé typy [Concept('agents','spolčenci')|e], které jsou při zahájení komplexního intrice obvykle předvybrány ve skupinách po pěti." # todo: CONCEPT CASE
 reactive_advice_agent_scheme_rework: "$ra_agent_scheme_rework_1$"
 ra_agent_scheme_rework_2: "Detaily komplexního schématu"
 ra_agent_scheme_rework_2_desc: "Komplexní [Concept('scheme','intriku')|e] probíhá přes několik [Concept('scheme_phases','fáze intriky')|e]. Každá $game_concept_scheme_phase$ má určitý počet dní, po nichž se vaše [Concept('success_chance','šance na úspěch')|e] zvýší.\n\nPo každé fázi intriky existuje šance, že získáte [Concept('scheme_opportunity_opportunity','výhoda')|e], kterou můžete utratit za přesvědčení [Concept('agents','spolčence')|e], aby se přidali, nebo za vykonání intriku s vyšším šancemi na úspěch." # todo: CONCEPT CASE
 ra_agent_scheme_rework_3: "Potenciál komplexního schématu"
 ra_agent_scheme_rework_3_desc: "Každé [Concept('scheme','intrika')|e] má přidružený [Concept('scheme_potential','potenciál intriky')|e]. Tento potenciál lze zvýšit použitím [Concept('agents','spolčenci')|e] a slouží jako tvrdý limit pro maximální [Concept('success_chance','šance na úspěch')|e], kterou můžete nasbírat.\n\nPotenciál intriky nikdy nemůže přesáhnout 95 %, což znamená, že všechna $game_concept_schemes$, bez ohledu na počet utracených [Concept('scheme_opportunity_opportunities','výhod')|e], budou mít vždy šanci na neúspěch." # todo: CONCEPT CASE
 ra_agent_scheme_rework_4: "Komplexní tajnost"
 ra_agent_scheme_rework_4_desc: "Složitý [Concept('scheme','intrika')|e] má přiřazen určitý stupeň [Concept('secrecy','utajení')|e]. Jedná se o hodnotu, která udává, jak pravděpodobné je, že bude $game_concept_scheme$ odhaleno.\n\nPři zahájení intrice má několik měsíců ochranné období, během kterého nemůže být za žádných okolností odhaleno. Po uplynutí tohoto období je $game_concept_scheme$ vystaveno riziku odhalení prostřednictvím [Concept('scheme_breaches','narušení intriky')|e].\n\nSchemu můžete spustit i když má $game_concept_scheme_breaches$, ale bude mít snížené [Concept('success_chance','šance na úspěch')|e]. Pokud se vašemu intrice nasbírá sedm $game_concept_scheme_breaches$, bude zrušeno.\n\n#TUT Dále mohou být některá základní schémata, jako například [GetScheme('seduce').GetTypeName], také považována za tajná a mít k nim přiřazené ochranné období.#!" # todo: CONCEPT CASE
 ra_agent_scheme_rework_5: "Agenti ve složitých spiknutích"
 ra_agent_scheme_rework_5_desc: "Komplexní [Concept('schemes','intriky')|e] mají pět [Concept('agent','spolčenec')|e] slotů, které lze obsadit potenciálními spolukonspirátory. Obecně je dobré obsadit co nejvíce $game_concept_agent$ slotů, protože mohou poskytovat užitečné bonusy k [Concept('scheme_speed','délce fáze intriky')|e], [Concept('secrecy','utajení')|e] nebo [Concept('scheme_potential','potenciál intriky')|e].\n\nRůzné typy $game_concept_agent$ preferují různé [Concept('skills','dovednosti')|e]. Například [GetAgentSlotType( 'agent_infiltrator' ).GetName] těží z [intrigue_i|e] [Concept('intrigue','pletichářství')|e] a [Concept('diplomacy_i','@skill_diplomacy_icon!')|e] [Concept('diplomacy','diplomacie')|e] kromě určitých [Concept('traits','rysů')|e]." # todo: CONCEPT CASE
 ra_agent_scheme_rework_6: "Provádění spiknutí"
 ra_agent_scheme_rework_6_desc: "Jakmile budete mít pocit, že jste dostatečně intrikovali, může nastat čas zvážit provedení vašeho [Concept('scheme','intriky')|e]. K tomu můžete využít [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t1_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t2_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t3_value')] nebo [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t4_value')] z nasbíraných [Concept('scheme_opportunity_opportunities','výhod')|e].\n\nDále, pokud tušíte, že proti vám někdo intrikuje, může být rozumné změnit vaši aktivní [Concept('scheme_countermeasure','zaměření protiopatření')|e], abyste předešli možným komplikacím.\n\nHodně štěstí a ať se vám v intrikách daří!" # todo: CONCEPT CASE
