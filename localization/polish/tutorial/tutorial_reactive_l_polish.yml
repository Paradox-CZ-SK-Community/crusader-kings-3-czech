 ra_natural_disasters_2: "$reactive_advice_natural_disasters$" # todo: NEW TRANSLATION
 ra_natural_disasters_2_desc: "[Concept('natural_disaster','Přírodní pohroma')|e] má tři [Concept('situation_phases','fáze situace')|e].\n\n#high Warning#!: $game_concept_natural_disaster$ je na spadnutí.\n#high Impact#!: Katastrofa je v účinku.\n#high Recovery#!: Můžete začít obnovu.\n\nJako [Concept('ruler','vládce')|e] vaši [subjects|e] očekávají, že se postaráte o následky $game_concept_natural_disaster$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
