 reactive_advice_army_automation: "$ARMY_AUTOMATION_FEATURE_NAME$"
 ra_army_auto_intro: "$reactive_advice_army_automation$"
 ra_army_auto_intro_desc: "Pokud se chcete soustředit na jiné věci než řízení svých [Concept('armies','armád')|E], můžete nechat jejich ovládání na hře." # todo: CONCEPT CASE
 ra_army_auto_open: "$reactive_advice_army_automation$"
 ra_army_auto_open_desc: "Zapnout nebo vypnout $ARMY_AUTOMATION_FEATURE_NAME$ můžete ve vojenském zobrazení."
 ra_army_auto_open_prompt: "Otevřete vojenské zobrazení"
 ra_army_auto_explain: "$reactive_advice_army_automation$"
 ra_army_auto_explain_desc: "Zde se rozhodnete, zda mají být vaše [Concept('armies','armády')|E] automatizovány či nikoli. Můžete to udělat kdykoli, i uprostřed [Concept('war','války')|E].\n\nStále kupujete ručně [Concept('men_at_arms','ozbrojenci')|E], najímáte [Concept('mercenaries','žoldnéři')|E] a podnikáte [Concept('raids','nájezdy')|E]. Toto chování můžete upravit zde, kliknutím na tlačítko Nastavení $ARMY_AUTOMATION_FEATURE_NAME$." # todo: CONCEPT CASE
