l_polish:
 open_tutorial_lesson: "Rada: "
 click_to_open_lesson: "#I Kliknutím se dozvíš více#!"
 reactive_advice_mercenaries: "$reactive_advice_mercenaries_step_1$"
 action_reactive_advice_mercenaries: "$open_tutorial_lesson$$reactive_advice_mercenaries_step_1$"
 action_reactive_advice_mercenaries_desc: "Žoldnéři jsou vojáci k najmutí, kteří mohou ve válce zvrátit misky vah.\nOtevři toto a získáš několik rad a tipů, jak je nejlépe využít!"
 action_reactive_advice_mercenaries_click: "$click_to_open_lesson$"
 reactive_advice_mercenaries_step_1: "Žoldnéři"
 reactive_advice_mercenaries_desc: "Pokud prohráváš válku, můžeš zvrátit misky vah ve svůj prospěch najmutím [Concept('mercenaries','žoldnéřů')|E].\n\nŽoldnéři stojí [Concept('gold','zlato')|E], ale poskytnou ti značnou [Concept('army','armádu')|E]. Jakmile je najmeš, budeš je moci ovládat stejně jako kteroukoli jinou armádu.\n\n#TUT Pro svou současnou válku možná budeš chtít najmout oddíl žoldnéřů. Přestože se kvůli jejich najmutí můžeš zadlužit, doporučujeme najít cenově dostupný oddíl, pokud válku neprohráváš opravdu výrazně.#!"
 reactive_advice_mercenaries_task: "Přejdi do přehledu $HIRE_TROOPS$ a vyber libovolnou žoldnéřskou družinu"
 reactive_advice_succession: "$reactive_advice_succession_step_1$"
 action_reactive_advice_succession: "$open_tutorial_lesson$$reactive_advice_succession_step_1$"
 action_reactive_advice_succession_desc: "Co se právě stalo? Zemřel jsi a došlo k následnictví!\nOtevři toto a získáš přehled o tom, co se stalo, i několik rad, jak plánovat budoucí následnictví."
 action_reactive_advice_succession_click: "$click_to_open_lesson$"
 reactive_advice_succession_step_1: "Následnictví"
 reactive_advice_succession_desc: "Král je mrtev, ať žije král!\n\nNeboj se — ačkoli tvá stará postava zemřela, Crusader Kings III je hra dynastií. Protože tvůj [Concept('ruler','vládce')|E] měl [Concept('player_heir','hráčského dědice')|E], nyní budeš ovládat jeho!\n\n#TUT Smrt je přirozenou součástí hry a často budeš pokračovat jako své nejstarší [Concept('eligible_child','způsobilé dítě')|E] (v závislosti na [Concept('succession_laws','zákonech následnictví')|E] svého panství). Pro bezpečné následnictví doporučujeme mít alespoň dvě děti — druhé jako zálohu pro případ, že první zemře.\n\nPři následnictví můžeš přijít o některé [Concept('titles','tituly')|E], které držela tvá předchozí postava. Neboj se, na všechny ztracené tituly si ponecháš [Concept('claims','nároky')|E].#!\n\n#weak Doporučujeme, aby sis před pokračováním vyhradil chvíli a seznámil se se svou novou postavou.#!"
 reactive_advice_domain_limit: "$reactive_advice_domain_limit_step_1$"
 reactive_advice_domain_limit_step_1: "Limit domény"
 reactive_advice_domain_limit_desc: "Momentálně držíš ve své [Concept('domain','doméně')|E] více země, než je tvá postava schopna sama spravovat — je čas vytvořit nové [Concept('vassals','vazaly')|E]!\n\nProtože si budeš chtít ve své doméně ponechat cenné tituly, doporučujeme přejít na záložku Doména v přehledu Panství, kde uvidíš, jakou hodnotu pro tebe každý titul má. Zvaž také, které tituly jsou ve tvém [de_jure|E].\n\n#TUT Zůstat příliš dlouho nad [Concept('domain_limit','limitem domény')|E] je třeba se vyvarovat, protože to bude mít následky.\n\nAbys zůstal pod limitem, měl bys přebytečné [Concept('titles','tituly')|E] udělit novým vazalům. Tituly sice můžeš udělit svým stávajícím vazalům, ale často je lepší najít někoho bezzemého a dát je jemu.\n\nVzdálení členové [Concept('dynasty','dynastie')|E] nebo [Concept('courtiers','dvořané')|E] s [Concept('trait','rysem')|E] [GetTrait('content').GetName( GetPlayer )] jsou vynikajícími vazaly. [Concept('claimants','Žadatelé')|E] o tvé tituly nebo [GetTrait('ambitious').GetName( GetPlayer )] dvořané už méně.#!"
 reactive_advice_vassal_limit: "$reactive_advice_vassal_limit_step_1$"
 reactive_advice_vassal_limit_step_1: "Limit vazalů"
 reactive_advice_vassal_limit_desc: "Nikdo nedokáže spravovat zástup hrabat — ctižádostiví dobyvatelé se musí spoléhat na [Concept('vassals','vazaly')|E] vyššího stupně, například vévody, aby za ně spravovali jejich zemi!\n\nSvůj současný limit vazalů uvidíš v přehledu Doména.\n\n#TUT Stejně jako u limitu domény nechceš překročit svůj [Concept('vassal_limit','limit vazalů')|E]. Aby ses této penalizaci vyhnul, měl bys své vazaly konsolidovat.\n\nNejlepším způsobem je udělovat svým vazalům [Concept('duchies','vévodství')|E]; díky tomu budou vládnout větší oblasti, takže to nebudeš muset dělat ty! Aby to však fungovalo, musíš sám držet [Concept('kingdom','království')|E] nebo [Concept('empire','říši')|E] — nedopusť se chyby a nerozdej některý ze svých [Concept('primary_titles','primárních titulů')|E]!\n\nPokud jako vévoda překračuješ limit vazalů, doporučujeme ti co nejdříve vytvořit království.#!"
 reactive_advice_megaduke_penalty: "$reactive_advice_megaduke_penalty_step_1$"
 reactive_advice_megaduke_penalty_step_1: "Vévodství je příliš velké!"
 reactive_advice_megaduke_penalty_desc: "Tvé [Concept('duchy','vévodství')|E] se hroutí pod tíhou příliš rozsáhlého území. Měl bys [create|E] nebo [usurp|E] [Concept('kingdom','království')|E]!\n\n#TUT Možná už můžeš vytvořit království? Pokud ano, otevři přehled tipů a podívej se, zda tam nějaké můžeš vytvořit. Pokud ne, máš k dispozici [Concept('decision','rozhodnutí')|E], kterým můžeš založit vlastní království — měj však na paměti, že tituly, které založíš sám, bývají obvykle slabší než existující [de_jure|E] tituly.\n\nPokud jsi [Concept('vassal','vazal')|E] a tvůj [Concept('liege','lenní pán')|E] je král, musíš nejprve požadovat nezávislost, než se sám budeš moci stát králem. Prvním krokem je buď se připojit k [Concept('independence_faction','frakci za nezávislost')|E], nebo ji založit.#!"
 reactive_advice_bastards: "$reactive_advice_bastards_step_1$"
 action_reactive_advice_bastards: "$open_tutorial_lesson$$reactive_advice_bastards_step_1$"
 action_reactive_advice_bastards_desc: "Nemanželské dítě může být požehnáním i prokletím, ale co to vlastně znamená?\nOtevři toto a získáš přehled o nemanželském původu i o tom, jak ti může posloužit!"
 action_reactive_advice_bastards_click: "$click_to_open_lesson$"
 reactive_advice_bastards_step_1: "Nemanželské děti"
 reactive_advice_bastards_desc: "Jejda! Zdá se, že máš [Concept('bastard','nemanželské')|E] dítě! To může být hrozba, nebo příležitost...\n\n#TUT Mít nemanželské děti není jen špatné; můžeš je provdat či oženit kvůli [Concept('alliances','spojenectvím')|E], aniž by představovaly přímou hrozbu pro tvé [Concept('succession','následnictví')|E], protože nejsou považovány za [Concept('legitimate','legitimní')|E].\n\nDokonce může být dobrý nápad ponechat si několik nemanželských dětí po ruce, aby mohly být [Concept('legitimized','legitimizovány')|E], pokud se ti bude nedostávat dětí narozených v manželství. Nezapomeň však sledovat [Concept('opinion','mínění')|E], které o tobě má tvá [Concept('spouse','choť')|E]...\n\nPokud chceš mít nemanželské děti, doporučujeme použít [GetScheme('seduce').GetTypeName] jako [Concept('scheme','intriku')|E] na nesezdané postavy. Pokud svedeš vdanou ženu, její manžel si může myslet, že dítě je jeho — pokud se to stane, nemůžeš dítě legitimizovat.#!"
 reactive_advice_protecting_against_hostile_schemes: "$reactive_advice_protecting_against_hostile_schemes_step_1$"
 action_reactive_advice_protecting_against_hostile_schemes: "$open_tutorial_lesson$$reactive_advice_protecting_against_hostile_schemes_step_1$"
 action_reactive_advice_protecting_against_hostile_schemes_desc: "Ve stínech číhá mnoho nebezpečí a hrozba intriky není nikdy daleko.\nOtevři toto a získáš přehled o intrikách i o tom, jak se chránit!"
 action_reactive_advice_protecting_against_hostile_schemes_click: "$click_to_open_lesson$"
 reactive_advice_protecting_against_hostile_schemes_step_1: "Ochrana před intrikami"
 reactive_advice_protecting_against_hostile_schemes_step_2: "$reactive_advice_protecting_against_hostile_schemes_step_1$"
 reactive_advice_protecting_against_hostile_schemes_desc: "Dávej si pozor! Jako vládce máš mnoho nepřátel, kteří by mohli [Concept('scheme','intrikovat')|E], aby tě viděli mrtvého...\n\nSnaž se zajistit, aby o tobě tví poddaní měli vysoké [Concept('opinion','mínění')|E] — ale hlavně si #emphasis vždy#! udrž svého [Concept('spymaster','špehmistra')|E] loajálního.\n\n#TUT Možná ani nevíš, že existují, ale [Concept('hostile_schemes','nepřátelské intriky')|E] na tebe mohou kdykoli cílit. K zabránění intrikám doporučujeme udržovat své [Concept('vassals','vazaly')|E] a [Concept('courtiers','dvořany')|E] spokojené.#!"
 reactive_advice_protecting_against_hostile_schemes_2_desc: "Mít špehmistra s velmi nízkým míněním o tobě může být rozsudek smrti, protože pak nemáš žádný způsob, jak odhalit [Concept('secret_schemes','tajné intriky')|E]!\n\n#TUT Zvaž to všechno, pokud plánuješ hrát jako [Concept('tyrant','tyran')|E], protože i když můžeš své poddané potlačovat pomocí [Concept('dread','děsu')|E], stále proti tobě mohou kout intriky.\n\nNakonec si dej pozor na [Concept('claimants','žadatele')|E] o tvůj trůn s rysem [GetTrait('sadistic').GetName( GetPlayer )] nebo [GetTrait('ambitious').GetName( GetPlayer )]...#!"
 reactive_advice_protect_against_factions: "$reactive_advice_protect_against_factions_step_1$"
 action_reactive_advice_protect_against_factions: "$open_tutorial_lesson$$reactive_advice_protect_against_factions_step_1$"
 action_reactive_advice_protect_against_factions_desc: "Frakce je nebezpečná věc, pokud ji necháš bez dozoru.\nOtevři toto a získáš přehled o frakcích i o tom, jak s nimi nejlépe naložit!"
 action_reactive_advice_protect_against_factions_click: "$click_to_open_lesson$"
 reactive_advice_protect_against_factions_step_1: "Ochrana před frakcemi"
 reactive_advice_protect_against_factions_desc: "Proti tobě vznikla [Concept('faction','frakce')|E], ale nepanikař — stále máš čas dát věci do pořádku!\n\n[Concept('vassals','Vazalové')|E] a [Concept('counties','hrabství')|E] se přidávají k frakcím, když jsou nespokojeni s tvou vládou. Tomu můžeš čelit tím, že zvýšíš jejich [Concept('opinion','mínění')|E] o tobě, nebo se pokusíš stát [Concept('dreaded','obávaným')|E].\n\n#TUT Chceš-li se vyhnout frakcím, doporučujeme zvýšit [Concept('opinion','mínění')|E] svých vazalů o tobě, postupovat při výbojích opatrně a pokusit se pomocí [GetScheme('murder').GetTypeName] odstranit všechny [Concept('claimants','žadatele')|E], kteří jsou oblíbenější než ty.\n\nČasto budeš mít čas své vazaly uklidnit, než frakce předloží své požadavky — využij tento čas moudře.#!"
 reactive_advice_protect_against_factions_2_desc: "Hrabství s nízkým [Concept('county_opinion','míněním hrabství')|E] mají sklon připojit se k [Concept('peasant_faction','selské frakci')|E]. Na rozdíl od jiných frakcí tato frakce povstane bez ohledu na to, zda má šanci zvítězit či nikoli!\n\nNěkdy je prostě nutné ukázat sedlákům jejich místo...\n\n#TUT Selské frakce bys měl vždy sledovat. Pokud udeří, zatímco jsi ve válce, mohou tvé [Concept('control','kontrole')|E] způsobit značné škody.#!"
 reactive_advice_protect_against_factions_step_2: "$reactive_advice_protect_against_factions_step_1$"
 reactive_advice_imprisoned: "$reactive_advice_imprisoned_step_1$"
 action_reactive_advice_imprisoned: "$open_tutorial_lesson$$reactive_advice_imprisoned_step_1$"
 action_reactive_advice_imprisoned_desc: "Někdo tě uvěznil! To není dobré...\nOtevři toto a získáš několik rad, co se stane a co můžeš dělat, pokud jsi uvězněn."
 action_reactive_advice_imprisoned_click: "$click_to_open_lesson$"
 reactive_advice_imprisoned_step_1: "Byl jsi uvězněn!"
 reactive_advice_imprisoned_desc: "Tvá postava byla zajata a nyní je vydána na milost někomu jinému. S tím mnoho nenaděláš.\n\nPřejdi na postavu, která tě drží jako [Concept('prisoner','vězně')|E], a použij #TUT_KW „Vykoupit sebe sama“#! jako [Concept('interaction','interakci')|E] — pokud budeš mít štěstí, budeš se moci vykoupit! Pokud budeš mít smůlu, může se rozhodnout tě [Concept('execute','popravit')|E].\n\n#TUT Pokud jsi ve [Concept('war','válce')|E] s tím, kdo tě uvěznil, může si vynutit [Concept('victory','vítězství')|E]. S tím nemůžeš nic dělat, jen být v budoucnu opatrnější!\n\nPokud jsi byl zajat při [Concept('commanding','velení')|E] [Concept('army','armádě')|E], je možné, že se to stalo proto, že jsi měl nízkou [prowess_i][Concept('prowess','udatnost')|E]. Někdy je dobrý nápad toto riziko zmírnit tím, že armády nebudeš vést osobně.\n\nPokud jsi byl zajat při [Concept('siege','obléhání')|E], pak to bylo proto, že nepřítel [Concept('occupied','obsadil')|E] tvé [Concept('realm_capital','hlavní sídlo panství')|E]. Vždy by ses měl snažit držet nepřátele dál od svého hlavního sídla!#!"
 reactive_advice_county_control: "$reactive_advice_county_control_step_1$"
 action_reactive_advice_county_control: "$open_tutorial_lesson$$reactive_advice_county_control_step_1$"
 action_reactive_advice_county_control_desc: "Pokud je [Concept('control','kontrola')|E] v [Concept('county','hrabství')|E] nízká, získáš z něj méně.\nOtevři toto a získáš přehled o tom, jak spravovat kontrolu hrabství!"
 action_reactive_advice_county_control_click: "$click_to_open_lesson$"
 reactive_advice_county_control_step_1: "Kontrola hrabství"
 reactive_advice_county_control_desc: "Jedno z tvých [Concept('counties','hrabství')|E] má nízkou [Concept('control','kontrolu')|E], což znamená, že z něj získáš méně [Concept('taxes','daní')|E] a [Concept('levies','odvedenců')|E]. Existují však způsoby, jak kontrolu znovu zvýšit!\n\n#TUT Kontrolu můžeš vidět na mnoha místech: na záložce Doména v přehledu Panství, v přehledu tipů i v přehledu hrabství.\n\nChceš-li zvýšit kontrolu, přejdi do přehledu Rady a pověř svého [Concept('marshal','maršálka')|E] úkolem [increase_control|E]. Kontrola také časem roste sama, ale tento proces je velmi pomalý — doporučujeme místo toho použít vysoce schopného maršálka.\n\nPokud ponecháš hrabství s nízkou kontrolou dlouho bez nápravy, může získat [Concept('county_corruption','korupci hrabství')|E]. Abys tomu předešel, doporučujeme nedobývat příliš mnoho země naráz.#!"
 reactive_advice_looming_game_over: "$reactive_advice_looming_game_over_step_1$"
 reactive_advice_looming_game_over_step_1: "Jak se vyhnout konci hry"
 reactive_advice_looming_game_over_desc: "Jejda! Zdá se, že nemáš [Concept('player_heir','hráčského dědice')|E]. Pokud nyní zemřeš, nastane [game_over|E] — zkusme se tomu vyhnout!\n\n#TUT Pokud jsi v této situaci, pravděpodobně to znamená, že jsi posledním členem své dynastie. Odtud vede jen jediná platná cesta — zplodit [Concept('legitimate','legitimního')|E] dědice!\n\nPokud žiješ ve společnosti, která dovoluje dědit pouze jednomu pohlaví, můžeš zkusit změnit svůj [Concept('gender_law','zákon pohlaví')|E] na méně omezující. Pokud máš nějaké [Concept('bastards','nemanželské děti')|E], teď je čas je legitimizovat!\n\nKromě toho se ujisti, že jsi [Concept('married','sezdaný')|E] s postavou s vysokou [Concept('fertility','plodností')|E] (obecně platí, že ženy starší 45 let bývají plodné jen zřídka). Pokud ani to nezabírá, [Concept('divorce','rozveď se')|E] nebo se pokus pomocí [GetScheme('murder').GetTypeName] odstranit svou [Concept('spouse','choť')|E] a znovu se oženit či vdát za někoho jiného — anebo se pokus použít [GetScheme('seduce').GetTypeName] jako [Concept('scheme','intriku')|E] ke zplození nemanželského dítěte.\n\nČas je zásadní, nepodstupuj žádná zbytečná rizika!#!"
 reactive_advice_bankruptcy: "$reactive_advice_bankruptcy_step_1$"
 action_reactive_advice_bankruptcy: "$open_tutorial_lesson$$reactive_advice_bankruptcy_step_1$"
 action_reactive_advice_bankruptcy_desc: "Nemáš žádné [gold_i]zlato, jsi zadlužený!\nOtevři toto a získáš přehled o dluhu i o tom, jak se z něj dostat."
 action_reactive_advice_bankruptcy_click: "$click_to_open_lesson$"
 reactive_advice_bankruptcy_step_1: "Dluh"
 reactive_advice_bankruptcy_desc: "Došlo ti [gold_i][Concept('gold','zlato')|E] — to je velmi špatné, musíš omezit výdaje a co nejdříve znovu naplnit svou pokladnici!\n\n#TUT Být v [Concept('debt','dluhu')|E] ti brání dělat mnoho věcí, například vyhlašovat [Concept('wars','války')|E] nebo doplňovat [Concept('men_at_arms','ozbrojence')|E], a přinese ti [Concept('county_corruption','korupci hrabství')|E]. Nenech svůj dluh vymknout se kontrole!\n\nNejzřejmější je ukončit všechny [Concept('wars','války')|E], které možná vedeš — když jsi totiž v míru, nemusíš platit žold svým [Concept('armies','armádám')|E]. Pokud přicházíš o mnoho zlata, možná budeš chtít zvážit i rozpuštění části ozbrojenců.\n\nPokud to tvá [Concept('faith','víra')|E] dovoluje, můžeš použít #TUT_KW $hof_ask_for_gold_interaction$#! jako [Concept('interaction','interakci')|E] na svou [Concept('head_of_faith','hlavu víry')|E] nebo rozhodnutí #TUT_KW $borrow_from_holy_order_decision$#!.\n\nTaké může být dobrý nápad přejít na [Concept('focus','zaměření')|E] $stewardship_wealth_focus_short$, pokud ho ještě nemáš.#!"
 reactive_advice_rightful_liege: "$reactive_advice_rightful_liege_step_1$"
 action_reactive_advice_rightful_liege: "$open_tutorial_lesson$$reactive_advice_rightful_liege_step_1$"
 action_reactive_advice_rightful_liege_desc: "Struktura de jure je pro tvé vazaly velmi důležitá; pokud nejsi jejich #emphasis právoplatným#! lenním pánem, může to poškodit vaše vztahy.\nOtevři toto a získáš přehled o tom, co znamená být právoplatným lenním pánem!"
 action_reactive_advice_rightful_liege_click: "$click_to_open_lesson$"
 reactive_advice_rightful_liege_step_1: "Právoplatný lenní pán"
 reactive_advice_rightful_liege_step_2: "$reactive_advice_rightful_liege_step_1$"
 reactive_advice_rightful_liege_desc: "Nejsi [Concept('rightful_liege','právoplatným lenním pánem')|E] některého [Concept('vassal','vazala')|E]. To sníží jeho [Concept('opinion','mínění')|E] o tobě a způsobí, že ti bude odvádět méně [Concept('taxes','daní')|E] a [Concept('levies','odvedenců')|E].\n\nMěl by ses snažit být právoplatným lenním pánem všech svých vazalů!\n\n#TUT K tomu musíš držet [Concept('title','titul')|E], který je o jeden stupeň nad nimi v [de_jure|E]. Vazal na úrovni [Concept('county','hrabství')|E] chce být pod svým de jure [Concept('duchy','vévodstvím')|E]. Například hrabě z $c_madrid$ chce být pod vévodou z $d_toledo$.\n\nJe velmi běžné mít některé vazaly, jejichž právoplatným lenním pánem #emphasis nejsi#! — nedá se s tím mnoho dělat a je to naprosto normální! Pamatuj však na používání #TUT_KW $grant_vassal_interaction$#! jako [Concept('interaction','interakce')|E] k uspořádání svých vazalů; nemůžeš držet každý titul sám.#!"
 reactive_advice_rightful_liege_2_desc: "Při dobývání nových zemí často získáš nové vazaly, jejichž právoplatným lenním pánem nejsi. Správné plánování výbojů může tento problém zmírnit.\n\n#TUT Chceš-li se vyhnout příliš mnoha vazalům, kteří tě nemají rádi, doporučujeme soustředit své výboje vždy na jednu de jure oblast. Tak se můžeš #emphasis časem#! stát jejich právoplatným lenním pánem. Nezapomeň často kontrolovat, zda můžeš [create|E] nové tituly!\n\nPři plánování výbojů nezapomeň používat mapové režimy de jure!#!"
 reactive_advice_bishop_endorsement: "$reactive_advice_bishop_endorsement_step_1$"
 action_reactive_advice_bishop_endorsement: "$open_tutorial_lesson$$reactive_advice_bishop_endorsement_step_1$"
 action_reactive_advice_bishop_endorsement_desc: "Tvůj biskup tě nepodporuje!\nOtevři toto a získáš přehled o tom, co to pro tebe znamená a jak to můžeš napravit."
 action_reactive_advice_bishop_endorsement_click: "$click_to_open_lesson$"
 reactive_advice_bishop_endorsement_step_1: "Podpora biskupa"
 reactive_advice_bishop_endorsement_desc: "[Concept('faith','Víra')|E] tvé postavy způsobuje, že máš ve své [Concept('council','radě')|E] [Concept('realm_priest','vrchního duchovního')|E].\n\nTito biskupové drží nesmírnou moc a jsou více než ochotni se o ni s tebou podělit — pokud si je udržíš na své straně...\n\n#TUT Tvůj biskup ti poskytuje [Concept('taxes','daně')|E] a [Concept('levies','odvedence')|E] ze všech [Concept('temple_holdings','chrámových držav')|E] ve tvém [Concept('realm','panství')|E] a množství, které ti dávají, závisí na jejich [Concept('opinion','mínění')|E] o tobě.\n\nPokud tě nemají rádi, nedostaneš nic a biskup ti dokonce může ztrpčovat život! Může tě například donutit rozvést se se svou [Concept('spouse','chotí')|E]...\n\nMěl by ses co nejvíce snažit zlepšit jeho mínění o tobě. Použití [Concept('interaction','interakce')|E] #TUT_KW $gift_interaction$#! nebo zahájení [Concept('scheme','intriky')|E] [GetScheme('sway').GetTypeName] jsou dvě dobré možnosti, které stojí za zvážení.\n\nPokud všechno ostatní selže, [GetScheme('murder').GetTypeName] je vždy možnost... Třeba bude jeho nástupce vstřícnější?#!"
 reactive_advice_encyclopedia: "$reactive_advice_encyclopedia_step_1$"
 action_reactive_advice_encyclopedia: "$open_tutorial_lesson$$reactive_advice_encyclopedia_step_1$"
 action_reactive_advice_encyclopedia_desc: "Chceš se dozvědět více o některých pojmech ve hře? Otevři toto a získáš úvod do encyklopedie."
 action_reactive_advice_encyclopedia_click: "$click_to_open_lesson$"
 reactive_advice_encyclopedia_step_1: "Encyklopedie"
 reactive_advice_encyclopedia_desc: "Crusader Kings III má mnoho konceptů a pojmů, o kterých se můžeš dozvědět více. Pokud si někdy nebudeš jistý některým herním konceptem, můžeš otevřít encyklopedii.\n\nPostupuj podle zvýrazněného rozhraní a uvidíš, jak na to.\n\n#TUT Kategorie „Výukové lekce“ v encyklopedii obsahuje mnoho částí výuky pro případ, že si budeš někdy potřebovat osvěžit paměť.#!"
 reactive_advice_religion: "$lesson_basics_religion_1$"
 action_reactive_advice_religion: "$open_tutorial_lesson$$lesson_basics_religion_1$"
 action_reactive_advice_religion_desc: "Chceš se dozvědět více o víře a náboženství? Otevři toto a získáš úvod do svého náboženství."
 action_reactive_advice_religion_click: "$click_to_open_lesson$"
 reactive_advice_dynamic_culture: "Kultura"
 action_reactive_advice_dynamic_culture: "$open_tutorial_lesson$$reactive_advice_dynamic_culture$"
 action_reactive_advice_dynamic_culture_desc: "Chceš se dozvědět více o kulturách? Otevři toto a získáš úvod do kultur."
 action_reactive_advice_dynamic_culture_click: "$click_to_open_lesson$"
 reactive_advice_fabricate_claim: "$reactive_advice_fabricate_claim_step_1$"
 action_reactive_advice_fabricate_claim: "$open_tutorial_lesson$$reactive_advice_fabricate_claim_step_1$"
 action_reactive_advice_fabricate_claim_desc: "Nemůžeš vyhlásit válku? Můžeš vykonstruovat nárok!\nOtevři toto a získáš přehled o tom, jak využít svou radu k vykonstruování nároků."
 action_reactive_advice_fabricate_claim_click: "$click_to_open_lesson$"
 reactive_advice_fabricate_claim_step_1: "Vykonstruování nároků"
 reactive_advice_fabricate_claim_desc: "Bez [Concept('casus_belli','casus belli')|E] nemůžeš vyhlásit válku. Nejběžnějším zdrojem casus belli jsou [Concept('claims','nároky')|E], ale někdy je těžké získat nárok, který chceš.\n\nPrávě tehdy přicházejí na řadu [Concept('fabricated_claims_short','vykonstruované nároky')|E]!\n\n#TUT Svého [Concept('court_chaplain','dvorního kaplana')|E] můžeš pověřit vykonstruováním nároku na libovolné blízké [Concept('county','hrabství')|E], což lze provést v přehledu [Concept('council','rady')|E]. Vždy můžeš vykonstruovat pouze jeden nárok a každý z nich bude nějakou dobu trvat.\n\nTento nástroj je obzvlášť užitečný, když hraješ za malého [Concept('ruler','vládce')|E], protože čím větší je tvé [Concept('realm','panství')|E], tím snáze se casus belli získávají.\n\nDoporučujeme vykonstruovat nároky na své bezprostřední sousedy — ideálně na ty, kteří jsou slabší než ty! Pokud hraješ za hraběte, zaměř se na získávání nároků na tituly ve stejném [de_jure|E] [Concept('duchy','vévodství')|E] jako tvé [Concept('realm_capital','hlavní sídlo panství')|E].#!"
 reactive_advice_education: "$reactive_advice_education_step_1$"
 action_reactive_advice_education: "$open_tutorial_lesson$$reactive_advice_education_step_1$"
 action_reactive_advice_education_desc: "Z tvého dědice se bez vzdělání velký vládce nestane!\nOtevři toto a získáš přehled o poručnictví i o tom, jak svého dědice správně připravit na moc."
 action_reactive_advice_education_click: "$click_to_open_lesson$"
 reactive_advice_education_step_1: "Vzdělání"
 reactive_advice_education_desc: "Vypadá to, že tvůj [Concept('player_heir','hráčský dědic')|E] nemá [Concept('guardian','poručníka')|E]! Bez řádného [Concept('education','vzdělání')|E] získá slabé [Concept('skills','dovednosti')|E] a náhodné [Concept('traits','rysy')|E].\n\n#TUT Použij [Concept('interaction','interakci')|E] #TUT_KW $educate_child_interaction$#! na svého dědice a najdi vhodnou postavu, která se stane jeho [Concept('guardian','poručníkem')|E].\n\nChceš najít postavu, která se vyzná v oblasti, v níž má její [Concept('ward','svěřenec')|E] vynikat. Doporučujeme hledat poručníka s vysokým stupněm [Concept('education_trait','vzdělávacího rysu')|E] (např. [GetTrait('education_martial_4').GetName( GetPlayer )]) nebo s rysem jako [GetTrait('intellect_good_1').GetName( GetPlayer )] či [GetTrait('intellect_good_3').GetName( GetPlayer )]. Pokud nechceš riskovat, že někdo jiný bude utvářet osobnost tvého dítěte, můžeš svého dědice vzdělávat sám!\n\nObecně chceš, aby všechny tvé děti měly dobré vzdělání. Pokud však máš děti, na kterých ti nijak zvlášť nezáleží (například čtvrté či páté dítě), můžeš je vždy svěřit svým [Concept('vassals','vazalům')|E] a získat tak bonus k [Concept('opinion','mínění')|E]. Nejjednodušší způsob, jak najít možného učitele, je použít interakci #TUT_KW $offer_ward_interaction$#! přímo na vazala.#!"
 reactive_advice_tooltip_modes: "$reactive_advice_tooltip_modes_step_1$"
 action_reactive_advice_tooltip_modes: "$open_tutorial_lesson$$reactive_advice_tooltip_modes_step_1$"
 action_reactive_advice_tooltip_modes_desc: "Crusader Kings III má různé režimy nápověd!\nOtevři toto a získáš přehled o jednotlivých režimech i o tom, který nejlépe odpovídá tvému hernímu stylu."
 action_reactive_advice_tooltip_modes_click: "$click_to_open_lesson$"
 reactive_advice_tooltip_modes_step_1: "Režimy nápověd"
 reactive_advice_tooltip_modes_step_2: "Pokročilé režimy nápověd"
 reactive_advice_tooltip_modes_desc: "Režimy nápověd určují, #EMP jak#! přistupuješ ke [Concept('highlighted_text','zvýrazněnému textu')|E] a informacím v nápovědách #weak (jinými slovy, jak nápovědy uzamknout, aby do nich bylo možné přesunout kurzor)#!.\n\nVýchozí režim nápověd se nazývá #V uzamčení časovačem#!. V tomto režimu se nápovědy po určené době, znázorněné malým ukazatelem průběhu, uzamknou na místě."
 reactive_advice_tooltip_modes_2_desc: "Pokud jsi zkušený hráč nebo jen nechceš, aby se ti nápovědy automaticky uzamykaly, doporučujeme vyzkoušet #V uzamčení akcí#!. V tomto režimu nápovědy uzamkneš stisknutím #V prostředního tlačítka myši#!.\n\n#I Režimy nápověd změníš tak, že přejdeš do #V herní nabídky#!, poté do #V nastavení#! a potom do části #V Hra#! — tam najdeš nastavení #V Režim nápověd#!.#!"
 action_perk_bonus_cap_modes: "Dosažen maximální bonus perku"
 action_perk_bonus_cap_modes_desc: "Dosáhl jsi maximální výše bonusu, který může perk poskytovat. Některé perky, například [GetPerk('sound_foundations_perk').GetName(GetPlayer)], mají maximální množství bodů dovedností, které mohou udělit."
 action_perk_bonus_cap_modes_click: "$click_to_open_lesson$"
 reactive_advice_perk_bonus_cap: "$action_perk_bonus_cap_modes$"
 reactive_advice_perk_bonus_cap_desc: "$action_perk_bonus_cap_modes_desc$ Dokud budeš nad limitem, bonus se už nebude zvyšovat a nesníží se, dokud se nedostaneš pod limit."
 reactive_advice_perk_bonus_cap_step_1: "$action_perk_bonus_cap_modes$"
 action_reactive_advice_varangian_adventure: "$open_tutorial_lesson$$reactive_advice_varangian_adventure_step_1$"
 action_reactive_advice_varangian_adventure_desc: "Můžeš zahájit varjažské dobrodružství.\nOtevři toto a dozvíš se více o tomto zvláštním druhu války."
 action_reactive_advice_varangian_adventure_click: "$click_to_open_lesson$"
 reactive_advice_varangian_adventure: "$game_concept_varangian_adventures$"
 reactive_advice_varangian_adventure_step_1: "$game_concept_varangian_adventures$"
 reactive_advice_varangian_adventure_desc: "Můžeš vyhlásit [Concept('varangian_adventure','varjažské dobrodružství')|E].\n\nPo dobu [Concept('era','éry')|E] $culture_era_tribal$ je tento typ války dostupný, aby ti umožnil začít nový život ve vzdálené zemi, daleko od chladných břehů tvé domoviny.\n\nÚspěšná $game_concept_varangian_adventures$ nejen přesunou tvé panství na cizí místo, ale také zanechají všechny tvé dosavadní země nezávislé, včetně tvých vazalů.\n\nTvé první [Concept('varangian_adventure','varjažské dobrodružství')|E] podniknuté jako vládce skupiny $north_germanic_group$ také povolá další vojsko z vlastněných hrabství se stejnou [Concept('faith','vírou')|E] a stejnou [Concept('culture','kulturou')|E] v oblasti [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName], aby ti pomohlo dobýt nový domov."
 action_reactive_advice_court_positions: "$open_tutorial_lesson$$ra_court_pos_open_view$"
 action_reactive_advice_court_positions_desc: "Otevři toto a získáš úvod do dvorských úřadů"
 action_reactive_advice_court_positions_click: "$click_to_open_lesson$"
 reactive_advice_court_positions: "$ra_court_pos_open_view$"
 ra_court_pos_open_view: "Dvorské úřady"
 ra_court_pos_open_view_desc: "Toto je vhodná chvíle projít si [Concept('court_positions','dvorské úřady')|E]. Jsou to pověření a pocty, které můžeš udělit svým [Concept('courtiers','dvořanům')|E] a [Concept('vassals','vazalům')|E].\n\nKaždý ti poskytuje určitou výhodu za cenu měsíční mzdy. Například [GetCourtPositionType('court_physician_court_position').GetName()] udrží tebe i tvůj [Concept('court','dvůr')|E] zdravé."
 ra_court_pos_open_view_trigger: "Otevři záložku dvorských úřadů (zvýrazněno)"
 ra_court_pos_appointing: "$ra_court_pos_open_view$"
 ra_court_pos_appointing_desc: "Nové [Concept('court_positions','dvorské úřady')|E] můžeš obsadit kliknutím na jeden z prázdných portrétů u neobsazeného dvorského úřadu. Postava s vysokou [Concept('aptitude','způsobilostí')|E] pro daný úřad ti poskytne větší bonus.\n\n#TUT Když někoho jmenuješ do úřadu, ovlivní to také jeho [Concept('opinion','mínění')|E] o tobě. Proto může být výhodné jmenovat i někoho s nedostatečnou $game_concept_aptitude$, jen aby tě měl raději.#!"
 ra_court_pos_salary: "$ra_court_pos_open_view$"
 action_reactive_advice_artifact_inventory: "$open_tutorial_lesson$$ra_artifact_inventory_general$"
 action_reactive_advice_artifact_inventory_desc: "Otevři toto a získáš úvod do artefaktů v inventáři"
 action_reactive_advice_artifact_inventory_click: "$click_to_open_lesson$"
 reactive_advice_artifact_inventory: "$ra_artifact_inventory_general$"
 ra_artifact_inventory_general: "Inventář"
 ra_artifact_inventory_general_desc: "Získal jsi svůj první [Concept('inventory_artifact','artefakt v inventáři')|E]. Tyto [Concept('artifacts','artefakty')|E] nosíš u sebe a poskytují různé výhody."
 ra_artifact_inventory_open_step: "$ra_artifact_inventory_general$"
 ra_artifact_inventory_open_step_desc: "[Concept('inventory_artifacts','Artefakty v inventáři')|E] jsou uloženy v tvém inventáři, pojďme ho nyní otevřít."
 ra_artifact_inventory_open_step_open: "Otevři inventář (zvýrazněno)"
 ra_artifact_inventory_welcome: "$ra_artifact_inventory_general$"
 ra_artifact_inventory_welcome_desc: "Ve svém inventáři můžeš vybavit [Concept('inventory_artifacts','artefakty v inventáři')|E], abys získal různé výhody, například zvýšení určité [Concept('skill','dovednosti')|E] nebo zvýšení své [Concept('prestige','prestiže')|E].\n\n[Concept('inventory_artifacts','Artefakty v inventáři')|E] můžeš také [repair|E] nebo [reforge|E], čímž obnovíš jejich [Concept('durability','trvanlivost')|E] a zabráníš tomu, aby byly časem zničeny.\n\nTaké zde vidíš, jaké [Concept('artifact_claims','nároky na artefakty')|E] máš, a můžeš se pokusit získat tyto [Concept('artifacts','artefakty')|E] pro sebe!"
 ra_maa_stationing_open_card_step: "Umístění ozbrojenců"
 ra_maa_stationing_open_card_step_desc: "Máš [Concept('men_at_arms','ozbrojence')|E], které jsi dosud [Concept('stationed','neumístil')|E].\n\nUmístěním svých [Concept('regiments','pluků')|E] je učiníš silnějšími a lepšími v boji, což může být zásadní pro vítězství v [Concept('battles','bitvách')|E].\n\nUmístěme nyní jeden pluk!"
 ra_maa_stationing_open_card_step_tt: "Klikni na některé ze svých ozbrojenců označených textem „#X $MAA_UNSTATIONED$#!“ (zvýrazněno)"
 ra_maa_stationing_click_station_button: "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_click_station_button_desc: "V každé [Concept('holding','državě')|E] ve své [Concept('domain','doméně')|E] můžeš umístit jeden [Concept('regiment','pluk')|E] [Concept('men_at_arms','ozbrojenců')|E].\n\nVšechny državy jsou platné pro každý typ pluku, ale některé poskytují větší bonusy než jiné.\n\nVyberme državu, do níž tento pluk umístíme."
 ra_maa_stationing_click_station_button_tt: "Klikni na tlačítko „Změnit umístěnou državu“ (zvýrazněno)"
 ra_maa_stationing_select_station: "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_select_station_desc: "Různé [Concept('holdings','državy')|E] dávají různě velké bonusy podle toho, které [Concept('buildings','budovy')|E] se rozhodneš postavit.\n\nV tomto přehledu přesně vidíš, o kolik by se tvůj [Concept('men_at_arms','ozbrojenecký')|E] [Concept('regiment','pluk')|E] zlepšil, kdyby byl umístěn v dané državě.\n\nKlikni na mapě na #P zelenou#! državu, o níž si myslíš, že tvému pluku poskytne nejlepší bonus."
 ra_maa_stationing_select_station_tt: "Klikni na libovolnou #P zelenou#! državu na mapě"
 ra_maa_stationing_finished: "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_finished_desc: "[Concept('men_at_arms','Ozbrojenecký')|E] [Concept('regiment','pluk')|E] je nyní [Concept('stationed','umístěn')|E] a pod jeho portrétem vidíš, o kolik se zlepšil (zvýrazněná část).\n\nNezapomeň se čas od času podívat, zda jsou tvé pluky umístěny v optimálních [Concept('holdings','državách')|E].\n\nTo je obzvlášť důležité, pokud dobudeš nebo zdědíš nová území, případně pokud se rozhodneš specializovat državu pomocí [Concept('buildings','budov')|E], jako jsou [GetBuilding('smiths_01').GetName] nebo [GetBuilding('stables_01').GetName]."
 reactive_advice_station_maa: "$ra_maa_stationing_open_card_step$"
 REACTIVE_ADVICE_TOURS: "Turné"
 action_reactive_advice_tours_picking_vassals: "$open_tutorial_lesson$$REACTIVE_ADVICE_TOURS$"
 action_reactive_advice_tours_picking_vassals_desc: "Nyní plánuješ, které vazaly navštívíš během svého velkého turné. Otevři toto a dozvíš se více o plánování turné."
 action_reactive_advice_tours_picking_vassals_click: "$click_to_open_lesson$"
 reactive_advice_tours_picking_vassals: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_intro: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_intro_desc: "Chystáš se vydat na [GetActivityType( 'activity_tour' ).GetName()] svého [Concept('realm','panství')|E].\n\nBěhem turné budeš [travel|E] za svými [Concept('vassals','vazaly')|E] a investovat [Concept('gold','zlato')|E], abys získal odměny jako [Concept('county_control','kontrolu hrabství')|E], [Concept('opinion','mínění')|E], [Concept('cultural_acceptance','kulturní přijetí')|E] a mnoho dalšího!"
 ra_tours_picking_vassals_add: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_add_desc: "Nejprve musíš vybrat, které [Concept('vassals','vazaly')|E] navštívíš.\n\nKoho navštívit závisí na typu [GetActivityType( 'activity_tour' ).GetName()]. Například při [Concept('majesty_tour','turné majestátu')|E] každá [Concept('stop','zastávka')|E] zvyšuje [Concept('opinion','mínění')|E] daného vazala, takže můžeš vybrat vazaly, kteří o tobě mají nízké mínění.\n\nCestování na velkou vzdálenost mezi zastávkami zvyšuje cenu každé zastávky v [Concept('gold','zlatě')|E]."
 ra_tours_picking_vassals_add_prompt: "Přidej alespoň jednoho vazala k návštěvě kliknutím na mapu"
 ra_tours_picking_vassals_stops: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_stops_desc: "Na každé [Concept('stop','zastávce')|E] turné můžeš buď:\n$BULLET_WITH_TAB$[tour_the_grounds|E], čímž zvýšíš [Concept('county_control','kontrolu hrabství')|E]\n$BULLET_WITH_TAB$Požádat o [hosted_dinner|E], čímž vytvoříš [Concept('hooks','páky')|E] a [Concept('relations','vztahy')|E]\n$BULLET_WITH_TAB$Požádat svého [Concept('vassal','vazala')|E], aby uspořádal [cultural_festival|E], čímž zvýšíš [Concept('county_opinion','mínění hrabství')|E] a [Concept('cultural_acceptance','kulturní přijetí')|E]"
 ra_tours_picking_vassals_conclusion: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_conclusion_desc: "Jakmile budeš spokojený se [Concept('stops','zastávkami')|E] a jejich pořadím, můžeš přejít k dalšímu kroku plánování."
 REACTIVE_ADVICE_REGENCY_TERM: "Regentství"
 REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT: "Otevři přehled regentství (zvýrazněno)"
 REACTIVE_ADVICE_YOU_REGENCY_REASONS: "Ke [Concept('regency','regentství')|E] může dojít z mnoha důvodů, například:\n$BULLET_WITH_TAB$Když [Concept('travel','cestuješ')|E] mimo své [Concept('realm','panství')|E]\n$BULLET_WITH_TAB$Když jsi [Concept('child','dítě')|E]\n$BULLET_WITH_TAB$Když se staneš [GetTrait('incapable').GetName( GetPlayer )]"
 reactive_advice_regency_for_liege: "$action_reactive_advice_regency_for_liege$"
 action_reactive_advice_regency_for_liege: "$open_tutorial_lesson$$REACTIVE_ADVICE_REGENCY_TERM$"
 action_reactive_advice_regency_for_liege_desc: "Nyní máš regenta. Otevři toto a získáš úvod do regentství."
 action_reactive_advice_regency_for_liege_click: "$click_to_open_lesson$"
 ra_regency_liege_intro: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_intro_desc: "Nyní máš [Concept('regent','regenta')|E].\n\n$REACTIVE_ADVICE_YOU_REGENCY_REASONS$"
 ra_regency_liege_effects: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_effects_desc: "V [Concept('regency','regentství')|E] můžeš stále provádět jakékoli akce jako obvykle.\n\n[Concept('regent','Regent')|E] však získává zvláštní [Concept('diarch_powers','propůjčené pravomoci')|E], které může použít na tebe nebo na tvé [Concept('vassals','vazaly')|E]. Nad těmito $game_concept_diarch_powers$ máš vždy právo [Concept('veto','veta')|E]."
 ra_regency_liege_open_UI: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_open_UI_desc: "Nyní se podívejme na tvé [Concept('regency','regentství')|E]!"
 ra_regency_liege_open_UI_prompt: "$REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT$"
 ra_regency_liege_open_tab: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_open_tab_desc: "Tvůj [Concept('regent','regent')|E] je zobrazen na záložce „$DIARCHY_WINDOW_YOUR_TAB$“."
 ra_regency_liege_open_tab_prompt: "Otevři záložku „$DIARCHY_WINDOW_YOUR_TAB$“ (zvýrazněno)"
 ra_regency_liege_scales_of_power: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_scales_of_power_desc: "Toto jsou [Concept('scales_of_power','misky vah moci')|E].\n\nČím více se misky vah přiklánějí ve prospěch tvého [Concept('regent','regenta')|E], tím více [Concept('diarch_powers','propůjčených pravomocí')|E] bude mít k dispozici a tím obtížnější bude [Concept('regency','regentství')|E] ukončit.\n\nPomocí tlačítka „$DIARCHY_WINDOW_SWING_SCALES$“ můžeš misky vah přímo vychýlit ve svůj prospěch."
 ra_regency_liege_mandate: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_mandate_desc: "Svému [Concept('regent','regentovi')|E] můžeš udělit [Concept('mandate','mandát')|E], který zaměří jeho úsilí daným směrem.\n\nTento mandát můžeš později kdykoli změnit podle svých priorit."
 ra_regency_liege_ending: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_ending_desc: "Pokud podmínky, které [Concept('regency','regentství')|E] vyvolaly, už neplatí, můžeš se jej pokusit ukončit.\n\n[Concept('regent','Regent')|E] s tím musí souhlasit, ale můžeš mu nabídnout věci jako [Concept('gold','zlato')|E] nebo [Concept('favor','laskavost')|E], aby bylo pravděpodobnější, že přijme. \n\nPokud odmítne, může ti vyhlásit [Concept('war','válku')|E]!"
 ra_regency_liege_conclusion: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_conclusion_desc: "Regentství je převážně reaktivní záležitost. Prozatím sleduj [Concept('scales_of_power','misky vah moci')|E].\n\nKdyž tvůj [Concept('regent','regent')|E] použije některou ze svých [Concept('diarch_powers','propůjčených pravomocí')|E], dozvíš se o tom a budeš se moci rozhodnout, co s tím uděláš."
 reactive_advice_regency_for_regent: "$action_reactive_advice_regency_for_regent$"
 action_reactive_advice_regency_for_regent: "$open_tutorial_lesson$Regent"
 action_reactive_advice_regency_for_regent_desc: "Nyní jsi regentem svého lenního pána. Otevři toto a získáš úvod do regentství."
 action_reactive_advice_regency_for_regent_click: "$click_to_open_lesson$"
 ra_regency_regent_intro: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_intro_desc: "Působíš jako [Concept('regent','regent')|E] svého [Concept('liege','lenního pána')|E].\n\nKe [Concept('regency','regentství')|E] může dojít z mnoha důvodů, například:\n$BULLET_WITH_TAB$Když tvůj lenní pán [travels|E] mimo tvé [Concept('realm','panství')|E]\n$BULLET_WITH_TAB$Když je tvůj lenní pán [Concept('child','dítě')|E]\n$BULLET_WITH_TAB$Když se tvůj lenní pán stane [GetTrait('incapable').GetName( GetPlayer )]"
 ra_regency_regent_powers: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_powers_desc: "Jako [Concept('regent','regent')|E] získáváš zvláštní [Concept('diarch_powers','propůjčené pravomoci')|E], které můžeš použít na svého [Concept('liege','lenního pána')|E] nebo na ostatní [Concept('vassals','vazaly')|E]. Tvůj lenní pán má nad těmito $game_concept_diarch_powers$ vždy právo [Concept('veto','veta')|E].\n\nPoužívání těchto pravomocí na ostatní vazaly může být vnímáno jako překročení moci a přinést ti postih k [Concept('opinion','mínění')|E] ze [Concept('strife','sporu')|E]."
 ra_regency_regent_open_UI: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_open_UI_desc: "Nyní se podívejme na tvé [Concept('regency','regentství')|E]!"
 ra_regency_regent_open_UI_prompt: "$REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT$"
 ra_regency_regent_open_tab: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_open_tab_desc: "Tvé postavení [Concept('regent','regenta')|E] je zobrazeno na záložce „$DIARCHY_WINDOW_LIEGE_TAB$“."
 ra_regency_regent_open_tab_prompt: "Otevři záložku „$DIARCHY_WINDOW_LIEGE_TAB$“ (zvýrazněno)"
 ra_regency_regent_scales_of_power: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_scales_of_power_desc: "Toto jsou [Concept('scales_of_power','misky vah moci')|E].\n\nČím více se misky vah přiklánějí ve tvůj prospěch, tím více [Concept('diarch_powers','propůjčených pravomocí')|E] budeš mít k dispozici a tím obtížnější bude [Concept('regency','regentství')|E] ukončit.\n\nPomocí tlačítka „$DIARCHY_WINDOW_SWING_SCALES$“ můžeš misky vah přímo vychýlit ve svůj prospěch."
 ra_regency_regent_mandate: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_mandate_desc: "Tvůj [Concept('liege','lenní pán')|E] ti může udělit [Concept('mandate','mandát')|E], který ti dá příležitosti ke zlepšení [Concept('realm','panství')|E].\n\nPokud tyto příležitosti dobře zvládneš, vychýlíš [Concept('scales_of_power','misky vah moci')|E] ve svůj prospěch."
 ra_regency_regent_ending: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_ending_desc: "Pokud podmínky, které [Concept('regency','regentství')|E] vyvolaly, už neplatí, tvůj [Concept('liege','lenní pán')|E] se jej může pokusit ukončit.\n\nPokud jsou [Concept('scales_of_power','misky vah moci')|E] výrazně ve tvůj prospěch, můžeš být dokonce schopen jejich pokusu o ukončení regentství vzdorovat, možná i rozpoutat [Concept('war','válku')|E] o jejich [Concept('primary_title','hlavní titul')|E]!"
 ra_regency_regent_conclusion: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_conclusion_desc: "Jako [Concept('regent','regent')|E] můžeš zkusit použít své [Concept('diarch_powers','propůjčené pravomoci')|E] na svého [Concept('liege','lenního pána')|E] nebo na ostatní [Concept('vassals','vazaly')|E].\n\nPokud si svého lenního pána nechceš znepřátelit, můžeš jednoduše reagovat na příležitosti, které se objeví, a tvůj lenní pán tě možná za loajalitu odmění!"
 REACTIVE_ADVICE_FUTURE_REGENT: "Budoucí regent"
 action_reactive_advice_set_future_regent: "$open_tutorial_lesson$$REACTIVE_ADVICE_FUTURE_REGENT$"
 action_reactive_advice_set_future_regent_desc: "Pokud nebudeš schopen vládnout, bude místo tebe vládnout regent. Otevři toto a dozvíš se, jak ovlivnit, kdo tvým regentem bude."
 action_reactive_advice_set_future_regent_click: "$click_to_open_lesson$"
 reactive_advice_set_future_regent: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_intro: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_intro_desc: "V budoucnu se může stát, že nebudeš schopen sám vládnout svému [Concept('realm','panství')|E]; v takovém případě začne [Concept('regency','regentství')|E].\n\nNež k tomu dojde, můžeš vidět svého budoucího [Concept('regent','regenta')|E] a dokonce jej sám určit!\n\n$REACTIVE_ADVICE_YOU_REGENCY_REASONS$"
 ra_regency_future_regent_open_realm_panel: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_open_realm_panel_desc: "Podívejme se na náhled tvého budoucího [Concept('regency','regentství')|E]! Uvidíš jej v přehledu panství."
 ra_regency_future_regent_open_realm_panel_prompt: "Otevři přehled panství (zvýrazněno)"
 ra_regency_future_regent_open_UI: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_open_UI_desc: "Tvůj stav [Concept('regency','regentství')|E] je zobrazen zde, v horní části přehledu panství."
 ra_regency_future_regent_open_UI_prompt: "Otevři přehled regentství (zvýrazněno)"
 ra_regency_future_regent_open_tab: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_open_tab_desc: "Tvůj budoucí [Concept('regent','regent')|E] je zobrazen na záložce „$DIARCHY_WINDOW_YOUR_TAB$“."
 ra_regency_future_regent_open_tab_prompt: "$ra_regency_liege_open_tab_prompt$"
 ra_regency_future_regent_current_regent: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_current_regent_desc: "Tvůj budoucí [Concept('regent','regent')|E] je zobrazen zde.\n\nPokud žádného neurčíš, bude vybrán kandidát s nejvyšším [Concept('regent_succession_score','skóre následnictví regenta')|E]."
 ra_regency_future_regent_swap_regent: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_swap_regent_desc: "Pomocí tohoto tlačítka můžeš určit [Concept('regent','regenta')|E].\n\nMěl by ses pokusit najít regenta s vysokou [Concept('diarch_loyalty','loajalitou spoluvládce')|E] a vysokou [Concept( 'diarch_aptitude', 'způsobilostí' )|E]."
 ra_regency_future_regent_succession: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_succession_desc: "Pokud tvůj současný [Concept('regent','regent')|E] zemře nebo nebude jinak schopen působit jako [Concept('regent','regent')|E], jeho místo zaujme další postava v pořadí následnictví."
 ra_regency_future_regent_conclusion: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_conclusion_desc: "Prozatím zvaž určení [Concept('regent','regenta')|E], pokud chceš mít větší kontrolu nad tím, kdo bude vládnout místo tebe."
 REACTIVE_ADVICE_TRAVEL_PLANNING: "Plánování cesty"
 action_reactive_advice_travel_planning: "$open_tutorial_lesson$$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 action_reactive_advice_travel_planning_desc: "Chystáš se cestovat. Otevři toto a dozvíš se více o plánování své cesty."
 action_reactive_advice_travel_planning_click: "$click_to_open_lesson$"
 reactive_advice_travel_planning: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_intro: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_intro_desc: "Chystáš se [Concept('travel','cestovat')|E] pryč ze své současné polohy. Než vyrazíš, měl bys svou cestu naplánovat."
 ra_travel_planning_entourage: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_entourage_desc: "Jen zřídka [Concept('travel','cestuješ')|E] sám; [Concept('characters','postavy')|E], které cestují s tebou, tvoří tvůj [Concept('entourage','doprovod')|E].\n\nTyto postavy se k tobě často připojí i v cíli."
 ra_travel_planning_speed_safety: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_speed_safety_desc: "Při plánování [Concept('travel','cesty')|E] je třeba zvážit dva hlavní faktory: [Concept('travel_speed','rychlost cestování')|E] a [Concept('travel_safety','bezpečnost cestování')|E].\n\nZákladní rychlost je 100 % a vysoká rychlost znamená, že do svého cíle dorazíš rychleji.\n\nBezpečnost působí proti jakémukoli [Concept('travel_danger','nebezpečí na cestě')|E], na které můžeš po trase narazit. Vysoká bezpečnost znamená, že ty i tvůj [Concept('entourage','doprovod')|E] můžete cestovat nebezpečnými oblastmi s menším rizikem."
 ra_travel_planning_caravan_master: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_caravan_master_desc: "Můžeš jmenovat postavu do úřadu [GetCourtPositionType('travel_leader_court_position').GetName()]; zvláštního [Concept('court_position','dvorského úřadu')|E], který tě bude doprovázet na všech tvých [Concept('travels','cestách')|E].\n\nMá velký vliv na tvou [Concept('travel_speed','rychlost cestování')|E] a [Concept('travel_safety','bezpečnost cestování')|E], takže na delších cestách obvykle budeš chtít mít někoho v tomto úřadu."
 ra_travel_planning_travel_options: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_travel_options_desc: "Pro tuto konkrétní cestu můžeš také zvolit až dvě [Concept('travel_options','možnosti cestování')|E].\n\nMožnosti cestování obvykle stojí [Concept('gold','zlato')|E] a poskytují různé výhody, převážně k [Concept('travel_speed','rychlosti cestování')|E] a [Concept('travel_safety','bezpečnosti cestování')|E].\n\nMnoho možností snižuje [Concept('travel_danger','nebezpečí na cestě')|E] pro konkrétní typy [Concept('terrain','terénu')|E] na tvé trase. Každý typ nebezpečí v určité lokalitě je na mapě zobrazen jedinečnou barvou. Všechna tato nebezpečí, na která můžeš narazit, se zobrazují také jako ikony na tvé trase."
 ra_travel_planning_custom_route: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_custom_route_desc: "Nakonec můžeš svou trasu upravit tak, aby ses cestou vyhnul [Concept('travel_danger','nebezpečí na cestě')|E], místo abys šel přímo ke svému cíli."
 ra_travel_planning_conclusion: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_conclusion_desc: "Než vyrazíš, zkontroluj celkový čas cesty a ověř, že je na tvé trase jen málo možností [Concept('travel_danger','nebezpečí na cestě')|E].\n\nŠťastnou cestu!"
 REACTIVE_ADVICE_CREATE_ACCOLADE: "Vyznamenání"
 reactive_advice_create_accolade: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_knights_panel: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_knights_panel_desc: "Nyní můžeš udělit [Concept('accolade','vyznamenání')|E] jednomu ze svých [Concept('knights','rytířů')|E]!\n\nKaždý rytíř, který drží vyznamenání, se stane [Concept('acclaimed_knight','uznávaným rytířem')|E] a poskytne bonusy tobě i tvým [Concept('armies','armádám')|E].\n\nVyznamenání zůstane, dokud jej nezrušíš, a bude přecházet na budoucí rytíře prostřednictvím [Concept('accolade_succession','nástupnictví vyznamenání')|E]."
 ra_create_accolade_knights_panel_prompt: "Vyber nepřiřazené vyznamenání (zvýrazněno)"
 ra_create_accolade_candidates: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_candidates_desc: "Když vytváříš [Concept('accolade','vyznamenání')|E], vybereš ze seznamu jednoho ze svých platných [Concept('knights','rytířů')|E]."
 ra_create_accolade_candidates_prompt: "Vyber kandidáta ze seznamu (zvýrazněno)"
 ra_create_accolade_attributes: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_attributes_desc: "Každý [Concept('acclaimed_knight','uznávaný rytíř')|E] má dva [Concept('accolade_types','atributy vyznamenání')|E] (zvýrazněno), jeden primární a jeden sekundární. Než [Concept('accolade','vyznamenání')|E] vytvoříš, zobrazují se tyto atributy u každého kandidáta.\n\nKaždý atribut poskytuje tobě i tvým [Concept('armies','armádám')|E] různé bonusy, jak vyznamenání získává [Concept('glory','slávu')|E]. Sláva se získává účastí v [Concept('contests','soutěžích')|E] [GetActivityType( 'activity_tournament' ).GetName()] a [Concept('battles','bitvách')|E].\n\nPrimární atribut je vždy součástí [Concept('accolade','vyznamenání')|E] a při [Concept('accolade_succession','nástupnictví vyznamenání')|E] jej nelze změnit."
 ra_create_accolade_conclusion: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_conclusion_desc: "Nyní můžeš toto [Concept('accolade','vyznamenání')|E] vytvořit, pokud chceš.\n\nDalší vyznamenání budou dostupná, jakmile tvá [Concept('culture','kultura')|E] objeví [Concept('innovations','inovace')|E]."
 reactive_advice_house_unity: "Jednota rodu"
 action_reactive_advice_house_unity: "Rada: $reactive_advice_house_unity$"
 action_reactive_advice_house_unity_desc: "Seznam se s [Concept('house_unity','jednotou rodu')|E] u [Concept('clans','klanů')|E] a s tím, jak ji můžeš ovlivňovat, abys získal výhody a přístup k různým [Concept('succession_laws','zákonům následnictví')|E]."
 action_reactive_advice_house_unity_click: "$click_to_open_lesson$"
 ra_house_unity_1: "$reactive_advice_house_unity$"
 ra_house_unity_1_desc: "Jako [Concept('clan','klan')|E] máš přístup k [Concept('house_unity','jednotě rodu')|E]!\n\nJednota rodu představuje stav vnitřních vztahů ve tvém [Concept('house','rodu')|E], které sahají od nepřátelských až po harmonické. Každá [Concept('house_unity_level','úroveň jednoty rodu')|E] přináší řadu účinků pro všechny členy rodu a určuje aktivní [Concept('succession_law','zákon následnictví')|E].\n\nVědět, jak jednotu rodu ovlivňovat, se ukáže jako užitečné při dosahování tvých cílů."
 ra_house_unity_2: "$reactive_advice_house_unity$"
 ra_house_unity_2_desc: "Nejprve musíš vědět, jak [Concept('house_unity','jednotu rodu')|E] zobrazit. Uděláš to otevřením přehledu svého [Concept('house','rodu')|E]."
 ra_house_unity_panel_prompt: "Otevři přehled [Concept('house','rodu')|E]"
 ra_house_unity_3: "$reactive_advice_house_unity$"
 ra_house_unity_3_desc: "Záložka jednoty rodu obsahuje všechny informace a interakce, které potřebuješ, abys jednotu rodu využil naplno. Vidíš zde své současné skóre jednoty rodu, současnou úroveň a přehled vyšších i nižších úrovní jednoty rodu.\n\nKromě toho zde vidíš nedávné změny jednoty. To je důležité, protože všichni členové rodu mohou provádět [Concept('house_unity_unifying_actions','sjednocující kroky jednoty rodu')|E] nebo [Concept('house_unity_devisive_actions','rozdělující kroky jednoty rodu')|E], které jednotu rodu ovlivňují."
 ra_house_unity_4: "$reactive_advice_house_unity$"
 ra_house_unity_4_desc: "Jak již bylo řečeno, každá [Concept('house_unity_level','úroveň jednoty rodu')|E] má své vlastní účinky. V této části vidíš seznam aktivních účinků.\n\nPamatuj, že tyto účinky platí pro všechny členy [Concept('house','rodu')|E]. Mezi účinky najdeš i aktivní [Concept('succession_law','zákon následnictví')|E] svého rodu."
 ra_house_unity_5: "$reactive_advice_house_unity$"
 ra_house_unity_5_desc: "Nakonec má každý klanový rod přístup k rozhodnutím jednoty rodu. Tato [Concept('decisions','rozhodnutí')|E] udělí různé výhody všem členům rodu. Většinou je však může přijímat pouze [Concept('house_head','hlava rodu')|E].\n\n#weak Můžeš se pokusit stát hlavou rodu pomocí interakce „Vyzvat hlavu rodu“ na svou současnou hlavu rodu.#!"
 ra_house_unity_6: "$reactive_advice_house_unity$"
 ra_house_unity_6_desc: "Nyní víš vše, co potřebuješ vědět o jednotě rodu!\n\nVyužij tyto znalosti k tomu, aby tvůj rod zanechal v dějinách trvalou stopu."
 action_reactive_advice_tax_collector: "Rada: Výběr daní"
 action_reactive_advice_tax_collector_desc: "Otevři toto a získáš úvod do [Concept('tax_jurisdictions','daňových jurisdikcí')|E] a [Concept('tax_collectors','výběrčích daní')|E]."
 action_reactive_advice_tax_collector_click: "$click_to_open_lesson$"
 reactive_advice_tax_collector: "Výběr daní"
 ra_tax_collector_1: "$reactive_advice_tax_collector$"
 ra_tax_collector_1_desc: "Máš [Concept('tax_collectors','výběrčí daní')|E]!\n\nPomohou ti vybírat [Concept('gold','zlato')|E] a [Concept('levies','odvedence')|E] od tvých klanových vazalů. Výběrčí daní ti také pomohou spravovat [Concept('tax_jurisdictions','daňové jurisdikce')|E] a budou vymáhat daňová nařízení.\n\n#weak Způsobilost tvých výběrčích daní ovlivní příspěvek, který získáš od svých poplatníků.#!"
 ra_tax_collector_2: "$reactive_advice_tax_collector$"
 ra_tax_collector_2_desc: "Nejprve musíš vědět, kde najdeš své [Concept('tax_jurisdictions','daňové jurisdikce')|E], jak jmenovat [Concept('tax_collectors','výběrčí daní')|E] a jak přiřazovat poplatníky."
 ra_tax_collector_panel_prompt: "Otevři panel [Concept('tax_jurisdictions','daňových jurisdikcí')|E]"
 ra_tax_collector_3: "$reactive_advice_tax_collector$"
 ra_tax_collector_3_desc: "Vítej v přehledu své [Concept('tax_jurisdiction','daňové jurisdikce')|E]!\n\nZde si můžeš zobrazit a spravovat vše, co se týká tvých jurisdikcí.\n\nNahoře vidíš, kolik [Concept('tax_collectors','výběrčích daní')|E] máš jmenováno a kolik celkem [Concept('gold','zlata')|E] a [Concept('levies','odvedenců')|E] získáváš od svých poplatníků."
 ra_tax_collector_4: "$reactive_advice_tax_collector$"
 ra_tax_collector_4_desc: "Toto jsou tvé [Concept('tax_jurisdictions','daňové jurisdikce')|E], v nichž můžeš své klanové vazaly přiřazovat jako poplatníky a pro každou jurisdikci vybírat daňová nařízení. Ke správě každé své daňové jurisdikce a k vymáhání daňových nařízení budeš také muset jmenovat [Concept('tax_collector','výběrčího daní')|E].\n\n#weak Jurisdikce s poplatníky, ale bez výběrčího daní, zůstane nezdaněná, což znamená, že z ní nezískáš žádné [Concept('gold','zlato')|E] ani [Concept('levies','odvedence')|E].#!"
 ra_tax_collector_5: "$reactive_advice_tax_collector$"
 ra_tax_collector_5_desc: "Blahopřeji!\n\nZnáš všechny základy výběru daní. Nezapomeň nastavit daňová nařízení [Concept('tax_jurisdictions','daňových jurisdikcí')|E], abys [Concept('vassal_obligations','vazalské povinnosti')|E] přizpůsobil svým současným potřebám.\n\nAť tvůj [Concept('clan','klan')|E] zanechá v dějinách trvalou stopu."
 action_reactive_advice_legitimacy: "Rada: Legitimita"
 action_reactive_advice_legitimacy_desc: "Otevři toto a získáš úvod do [Concept('legitimacy','legitimity')|E]."
 action_reactive_advice_legitimacy_click: "$click_to_open_lesson$"
 reactive_advice_legitimacy: "Legitimita"
 ra_legitimacy_1: "$reactive_advice_legitimacy$"
 ra_legitimacy_1_desc: "[Concept('legitimacy','Legitimita')|E] představuje tvé „právo vládnout“. Tvoji [Concept('vassals','vazalové')|E] vytvářejí [Concept('legitimacy_expectations','očekávání legitimity')|E] a od tebe se očekává, že je naplníš.\n\nVyšší $game_concept_legitimacy$ ti poskytuje řadu výhod, zatímco nízká $game_concept_legitimacy$ nepříznivě ovlivní, jak snadno se ti bude vládnout.\n\n#weak $game_concept_legitimacy$ má 5 [Concept('legitimacy_levels','úrovní legitimity')|E] a jednu nejnižší úroveň „nelegitimní“, přičemž určitý podíl [Concept('legitimacy','legitimity')|E] předchozího vládce zdědí jeho [Concept('heir','dědic')|E]. $game_concept_legitimacy$ získáváš mnoha různými způsoby, včetně vítězství ve válkách, vytváření [Concept('legends','legend')|E] nebo účasti na [Concept('activities','aktivitách')|E]. Stejně tak ji můžeš ztratit prohráváním válek a titulů nebo kvůli nekontrolovaným [Concept('epidemics','epidemiím')|E], které pustoší zemi.#!"
 ra_legitimacy_2: "$reactive_advice_legitimacy$"
 ra_legitimacy_2_desc: "Přehled [Concept('legitimacy','legitimity')|E] najdeš vlevo dole. Obsahuje informace o tvé [Concept('legitimacy_level','úrovni legitimity')|E], tvých [Concept('legitimacy_expectations','očekáváních legitimity')|E], o tom, kolik [Concept('legitimacy','legitimity')|E] momentálně máš, a také o současných účincích všeho výše uvedeného.\n\n#weak Nevýhody a výhody určitého skóre [Concept('legitimacy','legitimity')|E] zahrnují postihy a bonusy k mínění, postihy a bonusy k [Concept('dynasty_prestige','věhlasu dynastie')|E], zvýšené či snížené ceny [Concept('casus_belli','casus belli')|E] a proměnlivé prahy pro připojení k [Concept('alliances','spojenectvím')|E] a [Concept('faction','frakci')|E].#!"
 action_reactive_advice_epidemics: "Rada: Morové rány"
 action_reactive_advice_epidemics_desc: "Otevři toto a získáš úvod do [Concept('epidemics','epidemií')|E]."
 action_reactive_advice_epidemics_click: "$click_to_open_lesson$"
 reactive_advice_epidemics: "Morové rány"
 ra_epidemics_panel_prompt: "Otevři panel [Concept('epidemics','epidemií')|E]"
 ra_specific_epidemics_panel_prompt: "Otevři panel „Zobrazit morové rány“"
 ra_epidemics_1: "$reactive_advice_epidemics$"
 ra_epidemics_1_desc: "[Concept('epidemics','Epidemie')|E] jsou propuknutí nemocí, které se šíří po mapě a postihují [Concept('characters','postavy')|E] i [Concept('holdings','državy')|E]. Když se v oblasti vyskytuje morová rána, zasažená [Concept('baronies','baronství')|E] mají [Concept('infection_rate','míru nákazy')|E], která určuje, jak závažný bude její dopad.\n\nPřehled [Concept('epidemics','epidemií')|E] najdeš vpravo dole."
 ra_epidemics_2: "$reactive_advice_epidemics$"
 ra_epidemics_2_desc: "Každá [Concept('epidemic','epidemie')|E] na mapě je v panelu $reactive_advice_epidemics$ rozdělena do sekcí.\n\nSekce morových ran v panství poskytuje informace o $reactive_advice_epidemics$ ve tvém panství, světové $reactive_advice_epidemics$ tě informují o $reactive_advice_epidemics$ ve zbytku světa a blízké $reactive_advice_epidemics$ sledují postup $reactive_advice_epidemics$, které ještě nejsou ve tvém panství, ale jsou dostatečně blízko, aby v budoucnu mohly představovat hrozbu."
 ra_epidemics_3: "$reactive_advice_epidemics$"
 ra_epidemics_3_desc: "V tomto panelu jsou u každé morové rány uloženy příslušné informace. Sleduje se zde její závažnost — malá, velká nebo apokalyptická — kdy a kde začala, kolik [Concept('characters','postav')|E] zabila a také [Concept('modifiers','modifikátory')|E] postav i míst pro [Concept('baronies','baronství')|E] a [Concept('counties','hrabství')|E].\n\nTlačítko „Zobrazit morovou ránu“ tě zavede k podrobnějším informacím."
 ra_epidemics_4: "$reactive_advice_epidemics$"
 ra_epidemics_4_desc: "Tento panel obsahuje informace o [Concept('infection_rate','míře nákazy')|E] každého [Concept('barony','baronství')|E] zasaženého morovou ranou. [Concept('infection_rate','Míra nákazy')|E] bude postupovat ke své maximální hodnotě různou rychlostí podle intenzity morové rány a lze ji zmírnit pomocí $game_concept_epidemic_resistance$.\n\n#weak Způsob, jakým budeš $reactive_advice_epidemics$ zvládat a řešit, určí nejen to, jak se tvé [Concept('realm','panství')|E] zotaví a následně bude vzkvétat, ale také kolik [Concept('legitimacy','legitimity')|E] jako vládce ztratíš.#!"
 action_reactive_advice_legends: "Rada: Legendy"
 action_reactive_advice_legends_desc: "Otevři toto a získáš úvod do [Concept('legends','legend')|E]."
 action_reactive_advice_legends_click: "$click_to_open_lesson$"
 reactive_advice_legends: "Legendy"
 ra_legends_panel_prompt: "Otevři panel [Concept('legends','legend')|E]"
 ra_legends_view_panel_prompt: "Otevři panel vytváření legendy"
 ra_legends_1: "$action_reactive_advice_legends$"
 ra_legends_1_desc: "[Concept('legends','Legendy')|E] jsou příběhy o slavných činech, které [Concept('character','postava')|E] vykonala během svého života. Každá legenda má vlastní [Concept('legend_type','typ legendy')|E]: legitimizující, hrdinský nebo svatý.\n\nPřehled [Concept('legends','legend')|E] najdeš vlevo dole."
 ra_legends_2: "$action_reactive_advice_legends$"
 ra_legends_2_desc: "Zde vidíš každou [Concept('legend','legendu')|E], která je ti dostupná, i všechny její informace.\n\nNahoře jsou [Concept('legend_seeds','zárodky legend')|E], základ legendy. Lze je buď získat, nebo je v některých případech už můžeš vlastnit díky tomu, že tvá postava splňuje určitá kritéria. Pod nimi jsou světové $action_reactive_advice_legends$, které sledují jiné $action_reactive_advice_legends$ ve světě, jež aktivně nepropaguješ.\n\n#weak „Propagátoři“ jsou postavy, které danou legendu aktivně podporují.#!"
 ra_legends_3: "$action_reactive_advice_legends$"
 ra_legends_3_desc: "Informace uvedené v panelu $action_reactive_advice_legends$ zahrnují základní cenu, udržování, aktivní účinky a kvalitu legendy.\n\nZvýrazněno je tlačítko používané k výběru legendy z tvého seznamu."
 ra_legends_4: "$action_reactive_advice_legends$"
 ra_legends_4_desc: "Tento panel obsahuje informace o legendě, kterou se chystáš vytvořit, a zároveň ti nabízí výběr [Concept('characters','postav')|E]. Tyto postavy jsou možnými volbami pro [Concept('legend_protagonists','protagonisty legendy')|E].\n\n#weak Zahájení legendy spustí kroniku legendy, z níž můžeš zvýšit [Concept('legend_quality','kvalitu legendy')|E] nebo legendu dokončit.#!"
 action_reactive_advice_plague_resistance: "Rada: Odolnost vůči moru"
 action_reactive_advice_plague_resistance_desc: "Otevři toto a získáš úvod do [Concept('epidemic_resistance','odolnosti vůči epidemiím')|E]."
 action_reactive_advice_plague_resistance_click: "$click_to_open_lesson$"
 reactive_advice_plague_resistance: "Odolnost vůči moru"
 ra_plague_resistance_1: "$reactive_advice_plague_resistance$"
 ra_plague_resistance_1_desc: "Při potýkání se s morovými ranami máš několik možností, jak omezit jejich šíření po svých zemích.\n\nHlavním určujícím faktorem je [Concept('epidemic_resistance','odolnost vůči epidemiím')|E]. Čím vyšší je odolnost vůči moru ve tvých [Concept('baronies','baronstvích')|E] a [Concept('counties','hrabstvích')|E], tím lépe dokážeš morovou ránu zadržet.\n\n#weak Přestože můžeš s morovými ranami bojovat, je důležité mít na paměti, že je pravděpodobně nedokážeš zcela zastavit. Buď připraven na to, že se větší morové rány budou šířit navzdory tvému nejlepšímu úsilí.#!"
 ra_plague_resistance_2: "$reactive_advice_plague_resistance$"
 ra_plague_resistance_2_desc: "$reactive_advice_plague_resistance$ lze zvýšit několika způsoby. Budovy jako $building_type_hospices_01$ a $building_type_charnel_grounds_01$ dávají vrozené bonusy k $reactive_advice_plague_resistance$ pro [Concept('county','hrabství')|E] nebo [Concept('barony','baronství')|E], v němž jsou postaveny.\n\nJiné, méně trvalé možnosti zahrnují [Concept('court_position_tasks','úkoly dvorských úřadů')|E] vykonávané $court_physician_court_position$, [Concept('decisions','rozhodnutí')|E] nebo události."
 ra_plague_resistance_3: "$reactive_advice_plague_resistance$"
 ra_plague_resistance_3_desc: "Jak se $reactive_advice_plague_resistance$ zvyšuje, [Concept('infection_rate','míra nákazy')|E] příslušných [Concept('baronies','baronství')|E] klesá.\n\nAčkoli je nepravděpodobné, že se ti podaří velkou morovou ránu zcela vymýtit pouze těmito opatřeními, snížení [Concept('infection_rate','míry nákazy')|E] pomůže omezit celkové zpustošení tvého [Concept('realm','panství')|E]."
 action_reactive_advice_tutorial_schemes: "Rada: $game_concept_schemes$"
 action_reactive_advice_tutorial_schemes_desc: "Otevři toto a získáš úvod do [Concept('schemes','intrik')|e]."
 action_reactive_advice_tutorial_schemes_click: "$click_to_open_lesson$"
 reactive_advice_tutorial_schemes: "$ra_tutorial_schemes_1$"
 ra_tutorial_schemes_1: "$game_concept_schemes$"
 ra_tutorial_schemes_1_desc: "Právě jsi zahájil [Concept('scheme','intriku')|E]! $game_concept_schemes$ jsou dlouhodobé cíle zaměřené na jinou postavu. Mohou mít nepřátelské cíle, například pokusit se svůj cíl [GetScheme('murder').GetTypeName] nebo [GetScheme('abduct').GetTypeName], nebo mohou být příznivější, jako například $game_concept_scheme$ [GetScheme('befriend').GetTypeName]."
 ra_tutorial_schemes_2: "$game_concept_schemes$"
 ra_tutorial_schemes_2_desc: "Právě jsi zahájil [Concept('scheme','intriku')|E]! $game_concept_schemes$ jsou dlouhodobé cíle zaměřené na jinou postavu. Mohou mít nepřátelské cíle, například pokusit se svůj cíl [GetScheme('murder').GetTypeName] nebo [GetScheme('abduct').GetTypeName], nebo mohou být příznivější, jako například $game_concept_scheme$ [GetScheme('befriend').GetTypeName]."
 ra_tutorial_schemes_3: "$game_concept_schemes$"
 ra_tutorial_schemes_3_desc: "Zde uvidíš všechny své aktivní intriky. Současně můžeš mít aktivní jednu [Concept('personal_scheme','osobní intriku')|e] a jednu [Concept('hostile_scheme','nepřátelskou intriku')|e].\n\n#TUT Intriky používej, kdykoli chceš, ale měj na paměti, že tvá postava bude v určitých intrikách lepší nebo horší podle svých [Concept('traits','rysů')|e] a [Concept('skills','dovedností')|e]. Některé [Concept('lifestyle','životní styly')|e] a [Concept('perks','perky')|e] mohou tvé postavě odemknout další $game_concept_schemes$.#!"
 action_reactive_advice_favorite_child: "Rada: Oblíbené dítě"
 action_reactive_advice_favorite_child_desc: "Nyní můžeš zvolit [Concept('favorite_child','oblíbené dítě')|E]. Otevři toto a dozvíš se o něm více i o tom, jak je vybrat."
 action_reactive_advice_favorite_child_click: "$click_to_open_lesson$"
 reactive_advice_favorite_child: "Oblíbené dítě"
 ra_favorite_child_1: "$reactive_advice_favorite_child$"
 ra_favorite_child_1_desc: "Nyní si můžeš zvolit, kdo je tvé [Concept('favorite_child','oblíbené dítě')|E]. To znamená, že o tobě bude mít vyšší [Concept('opinion','mínění')|E] a až zemřeš, můžeš se rozhodnout pokračovat v odkazu jako ono místo svého dědice.\n\nTvým oblíbeným dítětem mohou být:\n$BULLET_WITH_TAB$Děti\n$BULLET_WITH_TAB$Vnoučata\n$BULLET_WITH_TAB$Pravnoučata\nPokud jsou ve tvé [Concept('dynasty','dynastii')|E]."
 ra_favorite_child_1_prompt: "Otevři přehled své postavy (zvýrazněno)"
 ra_favorite_child_2: "$reactive_advice_favorite_child$"
 ra_favorite_child_2_desc: "V přehledu postavy najdi dítě, které chceš označit za své oblíbené.\n\nKlikni na dítě pravým tlačítkem, aby ses s ním mohl jednat, a vyhledej možnost Zvolit oblíbené dítě. Případně klikni na některé ze svých dětí.\n\nPamatuj, že zvolit $game_concept_favorite_child$ také znamená, že ostatní děti o tobě mohou mít nižší mínění."
 ra_favorite_child_2_prompt: "Klikni pravým tlačítkem na jedno ze svých dětí a zobraz dostupné interakce (zvýrazněno)"
 ra_favorite_child_3: "$reactive_advice_favorite_child$"
 ra_favorite_child_3_desc: "Po zvolení oblíbeného dítěte se na jeho portrétu objeví ikona. A i když nebude tvým dědicem, po své smrti budeš moci pokračovat jako ono.\n\nPokud budeš chtít své oblíbené dítě někdy změnit, vrať se do přehledu postavy a vyber jiné."
 action_reactive_advice_army_automation: "Rada: $ARMY_AUTOMATION_FEATURE_NAME$"
 action_reactive_advice_army_automation_desc: "Pokud nechceš každou [Concept('war','válku')|E] ovládat ručně, můžeš zapnout $ARMY_AUTOMATION_FEATURE_NAME$. Otevři toto a dozvíš se, jak na to."
 action_reactive_advice_army_automation_click: "$click_to_open_lesson$"
 reactive_advice_army_automation: "$ARMY_AUTOMATION_FEATURE_NAME$"
 ra_army_auto_intro: "$reactive_advice_army_automation$"
 ra_army_auto_intro_desc: "Pokud se chceš soustředit na jiné věci než ovládání svých [Concept('armies','armád')|E], můžeš je nechat ovládat hrou."
 ra_army_auto_open: "$reactive_advice_army_automation$"
 ra_army_auto_open_desc: "$ARMY_AUTOMATION_FEATURE_NAME$ můžeš přepnout v přehledu vojenství."
 ra_army_auto_open_prompt: "Otevři přehled vojenství"
 ra_army_auto_explain: "$reactive_advice_army_automation$"
 ra_army_auto_explain_desc: "Zde můžeš rozhodnout, zda mají být tvé [Concept('armies','armády')|E] automatizované, nebo ne. Můžeš to udělat kdykoli, dokonce i uprostřed [Concept('war','války')|E].\n\nStále ručně nakupuješ [Concept('men_at_arms','ozbrojence')|E], najímáš [Concept('mercenaries','žoldnéře')|E] a vyrážíš na [Concept('raids','nájezdy')|E]. Toto chování můžeš upravit zde kliknutím na tlačítko nastavení $ARMY_AUTOMATION_FEATURE_NAME$."
 action_reactive_advice_admin_gov: "Rada: Správní vláda"
 action_reactive_advice_admin_gov_desc: "Hraješ v rámci [Concept('administrative_government','správní vlády')|e]. Otevři toto a dozvíš se více."
 action_reactive_advice_admin_gov_click: "$click_to_open_lesson$"
 action_reactive_advice_landless_adventurer: "Rada: Bezzemský dobrodruh"
 action_reactive_advice_landless_adventurer_desc: "Hraješ za [Concept('adventurer','dobrodruha')|e]. Otevři toto a dozvíš se více."
 action_reactive_advice_landless_adventurer_click: "$click_to_open_lesson$"
 reactive_advice_landless_adventurer: "Bezzemský dobrodruh"
 action_reactive_advice_agent_scheme_rework: "Rada: Intriky se spolčenci"
 action_reactive_advice_agent_scheme_rework_desc: "Otevři toto a získáš úvod do [Concept('schemes','intrik')|e] se [Concept('agents','spolčenci')|e]."
 action_reactive_advice_agent_scheme_rework_click: "$click_to_open_lesson$"
 action_reactive_advice_admin_gov_troops: "Rada: Správní vojenství"
 action_reactive_advice_admin_gov_troops_desc: "Otevři toto a získáš úvod do správy vojska v [Concept('administrative_government','správní vládě')|e]."
 action_reactive_advice_admin_gov_troops_click: "$click_to_open_lesson$"
 reactive_advice_admin_gov_troops: "Správní vojenství"
 ra_contracts_1_desc: "$game_concept_task_contract_desc$"
 ra_landless_adventurer_1: "Bezzemský dobrodruh"
 ra_landless_adventurer_2: "Tvůj tábor"
 ra_landless_adventurer_3: "Tvoji stoupenci"
 ra_landless_adventurer_4: "Zakázky"
 ra_landless_adventurer_5: "Účel tábora"
 ra_landless_adventurer_6: "Na cestě k moci"
 ra_landless_adventurer_1_desc: "@ra_landless_adventurer_2! \nJsi [Concept('adventurer','dobrodruh')|e]! Cestuj po světě, navštěvuj [Concept('courts','dvory')|e] [Concept('rulers','vládců')|e], hledej práci a plň [Concept('task_contracts','zakázky')|e] za výnosné odměny. Můžeš vylepšovat svůj [Concept('camp','tábor')|e], najímat [Concept('followers','stoupence')|e] a budovat rozsáhlý [Concept('contact_list','seznam kontaktů')|e]."
 ra_landless_adventurer_2_desc: "Jako [Concept('adventurer','dobrodruh')|e] nejsi vázán na žádný kus země, a máš tak svobodu cestovat po světě. Tvou základnou jako $game_concept_adventurer$ je tvůj [Concept('camp','tábor')|e], který můžeš během své dobrodružné kariéry vylepšovat a rozšiřovat pomocí [Concept('camp_buildings','táborových budov')|e]. "
 ra_landless_adventurer_3_desc: "Během svých cest můžeš shromažďovat [Concept('followers','stoupence')|e], kteří plní podobnou úlohu jako [Concept('courtiers','dvořané')|e] zeměpánských [Concept('rulers','vládců')|e]. Když [Concept('traveling','cestuješ')|e] jako [Concept('adventurer','dobrodruh')|e], budeš mít možnost využít [Concept('travel_option','možnost cestování')|e] [GetTravelOption('adventurers_scout_for_talent_option').GetName].\n\nNové $game_concept_followers$ můžeš navíc získat také přijetím [Concept('decision','rozhodnutí')|e] Navštívit državu. Ve svém $game_concept_camp$ můžeš své $game_concept_followers$ zobrazit pomocí tlačítka v levém horním rohu panelu."
 ra_landless_adventurer_4_desc: "Jako [Concept('adventurer','dobrodruh')|e] bude tvým hlavním zdrojem příjmů plnění [Concept('task_contracts','zakázek')|e]. Na mapě jsou znázorněny jako svitky. $game_concept_task_contracts$ lze najít po celém světě a vyžadují splnění konkrétního úkolu pro zadavatele.\n\nTvá [Concept('prestige_level','úroveň slávy')|E] určuje [Concept('task_contract_tier','stupeň zakázek')|e], které dostáváš. Získání úrovně slávy [GetPrestigeLevelName('(int32)2')] nebo vyšší odemkne nákup či dobývání [Concept('land','půdy')|E], pokud se budeš chtít stát [Concept('landed','zeměpánským')|E] [Concept('ruler','vládcem')|E]. Vyšší úrovně odemykají mocnější možnosti.\n\nK novým $game_concept_task_contracts$ se dostaneš přesunem svého [Concept('camp','tábora')|e], což je akce, která bude stát určité množství [provisions_i][Concept('provisions','zásob')|e] podle vzdálenosti přesunu."
 ra_landless_adventurer_5_desc: "Podrobnosti o svém [Concept('camp','táboře')|e] si můžeš zobrazit na záložce $game_concept_realm$ (zvýrazněno). Odtud můžeš změnit [Concept('camp_purpose','účel svého tábora')|e] a otevřít přehled $game_concept_camp$.\n\nÚčel tvého $game_concept_camp$ určí, jaký typ [Concept('task_contracts','zakázek')|e] budeš moci nacházet, může odemknout určitá [Concept('decisions','rozhodnutí')|e] a [Concept('camp_buildings','táborové budovy')|e] i řadu dalších výhod."
 ra_landless_adventurer_6_desc: "@ra_landless_adventurer!\nPřijímej [Concept('task_contracts','zakázky')|e], přesouvej svůj [Concept('camp','tábor')|e], abys prozkoumal různé části světa, a rozšiřuj své [Concept('following','stoupenectvo')|e].\n\nJako [Concept('adventurer','dobrodruh')|e] máš svobodu zvolit budoucí cestu své [Concept('dynasty','dynastie')|e]. Zůstaneš na cestách, pokusíš se získat [Concept('title','titul')|e] v daleké zemi, nebo se budeš vměšovat do záležitostí [Concept('rulers','vládců')|e] po celém světě?"
 reactive_advice_admin_gov: "Správní vláda"
 ra_admin_gov_1: "$reactive_advice_admin_gov$"
 ra_admin_gov_1b: "$reactive_advice_admin_gov$"
 ra_admin_gov_2: "$reactive_advice_admin_gov$"
 ra_admin_gov_2b: "$reactive_advice_admin_gov$"
 ra_admin_gov_3: "Přehled provincie"
 ra_admin_gov_4: "Následnictví a vliv"
 ra_admin_gov_5: "Správa provincie"
 ra_admin_gov_5b: "Správa provincie"
 ra_admin_gov_6: "Mocné rodiny"
 ra_admin_gov_7: "Statky"
 ra_admin_gov_8: "Na cestě k moci"
 ra_admin_gov_1_desc: "@ra_admin_gov_1!Nacházíš se v [Concept('administrative_government','správní vládě')|e]. Tvoří ji $TUTORIAL_GOVERNORS$, kteří spravují zemi pro svého [Concept('top_liege','nejvyššího lenního pána')|e] a předsedají jí, i když tuto zemi sami ve skutečnosti nevlastní."
 ra_open_admin_gov_panel_prompt: "Otevři záložku „$TUTORIAL_PROVINCES_NO_TOOLTIP$“ v panelu správní vlády (zvýrazněno)"
 ra_admin_gov_2_desc: "Toto jsou všechny $TUTORIAL_PROVINCES$ přítomné v rámci [Concept('top_realm','nejvyššího panství')|e].\n\n$TUTORIAL_GOVERNOR$ může držet pouze jednu $TUTORIAL_PROVINCE_NO_TOOLTIP$; sílit znamená rozdělovat vládu nad $TUTORIAL_PROVINCES_NO_TOOLTIP$ mezi členy svého [Concept('house','rodu')|e].\n\nProtože $TUTORIAL_GOVERNORS_NO_TOOLTIP$ své $TUTORIAL_PROVINCE_NO_TOOLTIP$ nevlastní, musí si své postavení zajistit pomocí [Concept('schemes','intrik')|e] a politického jednání.\n\n#I $TUTORIAL_PROVINCES_NO_TOOLTIP$ si můžeš prohlédnout buď kliknutím na mapě, nebo v seznamu.#!"
 ra_open_admin_gov_theme_detail_prompt: "Prohlédni si $TUTORIAL_PROVINCE_NO_TOOLTIP$"
 ra_admin_gov_3_desc: "[Concept('skills','Dovednosti')|e] $TUTORIAL_GOVERNOR_NO_TOOLTIP$ a jeho stupeň v [Concept('trait','rysu')|e] [GetTrait('governor').GetName( GetNullCharacter )] určují jeho [Concept('governor_efficiency','efektivitu guvernéra')|e], která měří, kolik [Concept('levies','odvedenců')|e] a [Concept('taxes','daní')|e] bude schopen vybírat pro svého $game_concept_top_liege$.\n\nVysoká $game_concept_governor_efficiency$ také posiluje $TUTORIAL_PROVINCIAL_ARMIES$ [Concept('province','provincie')|E].\n\nPokud jsi [Concept('top_liege','nejvyšší lenní pán')|e], měl by ses snažit zajistit, aby $game_concept_provinces drželi $TUTORIAL_GOVERNORS_NO_TOOLTIP$ s vysokou $game_concept_governor_efficiency$."
 ra_admin_gov_3_prompt: "Otevři záložku „Jmenování $TUTORIAL_GOVERNOR_NO_TOOLTIP$“"
 ra_admin_gov_4_desc: "[Concept('succession','Následnictví')|e] $TUTORIAL_PROVINCE$ ve [Concept('administrative_government','správní vládě')|e] je určováno volbou, v níž utrácíš @influence_icon![Concept('influence','vliv')|e] ke zvýšení [Concept('candidate_score','skóre kandidáta')|E]. \n\nPokud chceš rozšířit svou moc v rámci [Concept('realm','panství')|e], budeš chtít zajistit, aby členové tvého [Concept('house','rodu')|e] byli $TUTORIAL_GOVERNORS$, nebo dokonce drželi samotný [Concept('title','titul')|e] $game_concept_top_realm$."
 ra_admin_gov_5_desc: "Každou $TUTORIAL_PROVINCE$ [Concept('governed','spravuje')|e] určitá [Concept('family','rodina')|e]. Vedle každé $TUTORIAL_PROVINCE_NO_TOOLTIP$ vidíš znak [Concept('house','rodu')|e].\n\nJak tvůj $game_concept_house$ získává další [Concept('titles','tituly')|e], staneš se významnějším a můžeš se případně stát [Concept('powerful_family','mocnou rodinou')|e]."
 ra_open_admin_gov_powerful_families_intro: "Otevři záložku šlechtických rodin (zvýrazněno)"
 ra_admin_gov_6_desc: "[Concept('powerful_family','Mocná rodina')|e] je vlivný [Concept('house','rod')|e] ve [Concept('administrative_government','správní vládě')|e]. Rodina [Concept('top_liege','nejvyššího lenního pána')|e] je vždy považována za mocnou bez ohledu na její [powerful_family_rating_mid|e]. Kromě ní může existovat pět dalších $game_concept_powerful_families$.\n\nAčkoli si každý $game_concept_house$ může nastavit [Concept('powerful_family_attribute','atribut mocné rodiny')|E], jeho účinek platí pouze tehdy, pokud je příslušná rodina považována za mocnou."
 ra_open_admin_gov_open_estate_prompt: "Zobraz svůj statek"
 ra_admin_gov_7_desc: "[Concept('estate','Statek')|e] je typ [Concept('domicile','obydlí')|e], který představuje soukromou držbu půdy nevázanou na žádné konkrétní [Concept('landed','zeměpánské')|e] [Concept('titles','tituly')|e]. Ve [Concept('administrative_government','správní vládě')|e] slouží jako základna tvé [Concept('family','rodiny')|e] a bude se dědit v rámci tvého [Concept('house','rodu')|e].\n\nVe svém $game_concept_estate$ můžeš vylepšovat a stavět nové [Concept('estate_buildings','budovy statku')|e], abys zvýšil svůj [Concept('influence','vliv')|e] a politickou váhu v rámci [Concept('realm','panství')|e].\n\n#TUT Je třeba poznamenat, že [Concept('feudal','feudální')|e] [Concept('rulers','vládci')|e] v rámci $game_concept_administrative_government$ nebudou mít přístup k $game_concept_estate$.#!"
 ra_admin_gov_8_desc: "@ra_admin_gov_8! [Concept('administrative_government','Správní vláda')|e] je především o rodině, politickém vlivu, intrikách a dosazení správné osoby na správné místo.\n\nBudeš využívat [Concept('influence','vliv')|e] ke zlepšení svého postavení v rámci [Concept('realm','panství')|e] a zároveň směrovat členy své [Concept('dynasty','dynastie')|e] k mocenským pozicím.\n\n[Concept('scheme','Intrikuj')|e] proti svým soupeřům a podrývej jejich autoritu politickým pletichařením. Cesta k moci je dlouhá a klikatá, ale pokud správně zahraješ své karty, možná jí dokážeš projít."
 ra_agent_scheme_rework_1: "Složité intriky"
 ra_agent_scheme_rework_1_desc: "Na chvíli si projděme složité [Concept('schemes','intriky')|e]. Tyto $game_concept_schemes$ se skládají ze tří hlavních parametrů: [Concept('success_chance','šance na úspěch')|e], [Concept('scheme_speed_single','rychlosti intriky')|e] a [Concept('secrecy','utajení')|e].\n\nPři dokončování $game_concept_scheme$ ti pomáhají různé typy [Concept('agents','spolčenců')|e], kteří se při zahájení složité $game_concept_scheme$ obvykle objevují v předem vybraných skupinách po pěti."
 reactive_advice_agent_scheme_rework: "$ra_agent_scheme_rework_1$"
 ra_agent_scheme_rework_2: "Podrobnosti složité intriky"
 ra_agent_scheme_rework_2_desc: "Složitá [Concept('scheme','intrika')|e] probíhá v průběhu několika [Concept('scheme_phases','fází intriky')|e]. Každá $game_concept_scheme_phase$ trvá určitý počet dní, po jejichž uplynutí se zvýší tvá [Concept('success_chance','šance na úspěch')|e].\n\nPo každé $game_concept_scheme_phase$ existuje šance, že získáš [Concept('scheme_opportunity_opportunity','příležitost intriky')|e], kterou můžeš využít k přesvědčení [Concept('agents','spolčenců')|e], aby se přidali, nebo k provedení $game_concept_scheme$ s vyšší $game_concept_success_chance$."
 ra_agent_scheme_rework_3: "Potenciál složité intriky"
 ra_agent_scheme_rework_3_desc: "Každá [Concept('scheme','intrika')|e] má přidružený [Concept('scheme_potential','potenciál intriky')|e]. Tento potenciál lze zvýšit využitím [Concept('agents','spolčenců')|e] a slouží jako pevný limit pro maximální [Concept('success_chance','šanci na úspěch')|e], kterou můžeš nashromáždit.\n\n$game_concept_scheme_potential$ nikdy nemůže překročit 95 %, což znamená, že všechny $game_concept_schemes$ budou mít vždy šanci selhat bez ohledu na počet [Concept('scheme_opportunity_opportunities','výhod')|e] vynaložených na zvýšení $game_concept_success_chance$."
 ra_agent_scheme_rework_4: "Utajení složité intriky"
 ra_agent_scheme_rework_4_desc: "Složitá [Concept('scheme','intrika')|e] má určitou úroveň [Concept('secrecy','utajení')|e]. Je to hodnota, která vyjadřuje, jak pravděpodobné je, že bude $game_concept_scheme$ odhalena.\n\nPo zahájení má $game_concept_scheme$ odkladnou dobu několika měsíců, během níž nemůže být za žádných okolností odhalena. Po uplynutí této doby hrozí, že bude $game_concept_scheme$ odhalena prostřednictvím [Concept('scheme_breaches','prolomení intriky')|e].\n\nIntriku můžeš provést, i když má $game_concept_scheme_breaches$, ale bude mít sníženou [Concept('success_chance','šanci na úspěch')|e]. Pokud tvá $game_concept_scheme$ nashromáždí sedm $game_concept_scheme_breaches$, bude zrušena.\n\n#TUT Některé základní intriky, například [GetScheme('seduce').GetTypeName], mohou být navíc také považovány za tajné a mít přidruženou odkladnou dobu.#!"
 ra_agent_scheme_rework_5: "Spolčenci ve složitých intrikách"
 ra_agent_scheme_rework_5_desc: "Složité [Concept('schemes','intriky')|e] mají pět míst pro [Concept('agent','spolčence')|e], která lze obsadit možnými spiklenci. Obecně je dobré obsadit co nejvíce míst pro $game_concept_agent$, protože mohou poskytovat užitečné bonusy k [Concept('scheme_speed','rychlosti intriky')|e], [Concept('secrecy','utajení')|e] nebo [Concept('scheme_potential','potenciálu intriky')|e].\n\nRůzné typy $game_concept_agent$ upřednostňují různé [Concept('skills','dovednosti')|e]. Například [GetAgentSlotType( 'agent_infiltrator' ).GetName] těží kromě určitých [Concept('traits','rysů')|e] také z [intrigue_i|e] [Concept('intrigue','pletichaření')|e] a [diplomacy_i|e] [Concept('diplomacy','diplomacie')|e]."
 ra_agent_scheme_rework_6: "Provedení intriky"
 ra_agent_scheme_rework_6_desc: "Jakmile budeš mít pocit, že jsi zosnoval dost, může nastat čas zvážit provedení své [Concept('scheme','intriky')|e]. K tomu můžeš využít [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t1_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t2_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t3_value')] nebo [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t4_value')] ze svých nashromážděných [Concept('scheme_opportunity_opportunities','výhod')|e].\n\nPokud navíc tušíš, že proti tobě někdo osnuje intriku, může se vyplatit změnit své aktivní [Concept('scheme_countermeasure','protiopatření intriky')|e], abys předešel možným nehodám.\n\nHodně štěstí a šťastné intrikaření!"
