l_polish:
 open_tutorial_lesson: "Rada: "
 click_to_open_lesson: "#I Klikněte pro více informací#!"
 reactive_advice_mercenaries: "$reactive_advice_mercenaries_step_1$"
 action_reactive_advice_mercenaries: "$open_tutorial_lesson$$reactive_advice_mercenaries_step_1$"
 action_reactive_advice_mercenaries_desc: "Žoldnéři jsou najatí vojáci, kteří mohou rozhodnout válku.\nOtevřete toto pro několik tipů a triků, jak je nejlépe využít!"
 action_reactive_advice_mercenaries_click: "$click_to_open_lesson$"
 reactive_advice_mercenaries_step_1: "Žoldnéři"
 reactive_advice_mercenaries_desc: "Pokud prohráváte válku, můžete vyrovnat poměry najmutím [Concept('mercenaries','žoldnéři')|E].\n\nŽoldnéři stojí [Concept('gold','zlato')|E], ale poskytnou vám významný [Concept('army','armáda')|E]. Po jejich najmutí je budete moci ovládat stejně jako kteroukoliv jinou armádu.\n\n#TUT Můžete chtít najmout jednotku žoldnéřů pro svou současnou válku. I když se při jejich najímání můžete dostat do [Concept('debt','dluhu')|E], doporučujeme najít cenově dostupné, pokud válku výslovně neprohráváte.#!" # todo: CONCEPT CASE
 reactive_advice_mercenaries_task: "Přejděte do zobrazení $HIRE_TROOPS$ a vyberte jakoukoli žoldnéřskou skupinu"
 reactive_advice_succession: "$reactive_advice_succession_step_1$"
 action_reactive_advice_succession: "$open_tutorial_lesson$$reactive_advice_succession_step_1$"
 action_reactive_advice_succession_desc: "Co se právě stalo? Zemřel jste a došlo k nástupnictví!\nOtevřete toto pro přehled toho, co se stalo, a tipy, jak plánovat budoucí nástupnictví."
 action_reactive_advice_succession_click: "$click_to_open_lesson$"
 reactive_advice_succession_step_1: "Nástupnictví"
 reactive_advice_succession_desc: "Král je mrtev, ať žije král!\n\nNebojte se — přestože váš předchozí charakter zemřel, Crusader Kings III je hra o dynastiích. Protože váš [Concept('ruler','vládce')|E] měl [Concept('player_heir','hráčský dědic')|E], nyní je ovládáte vy!\n\n#TUT Smrt je přirozenou součástí hry a často budete pokračovat jako váš nejstarší [Concept('eligible_child','způsobilé dítě')|E] (v závislosti na [Concept('succession_laws','zákony nástupnictví')|E] vašeho panství). Pro bezpečné nástupnictví doporučujeme mít alespoň dvě děti — druhé jako rezervu, pokud by to první zemřelo.\n\nPři nástupnictví můžete přijít o některé z [Concept('titles','titulů')|E], které váš předchozí charakter držel. Nebojte se, uchováte si [Concept('claims','nárokům')|E] na všechny tituly, které ztratíte.#!\n\n#weak Doporučujeme si před pokračováním chvíli prohlédnout svého nového charaktera.#!" # todo: CONCEPT CASE
 reactive_advice_domain_limit: "$reactive_advice_domain_limit_step_1$"
 reactive_advice_domain_limit_step_1: "Limit domény"
 reactive_advice_domain_limit_desc: "V současnosti držíte více půdy ve své [Concept('domain','doméně')|E], než je váš charakter schopen spravovat sám — je čas vytvořit nové [Concept('vassals','vazaly')|E]!\n\nProtože budete chtít mít cenné tituly ve své doméně, doporučujeme přejít na kartu Doména v pohledu Říše, kde můžete vidět, kolik každý titul pro vás znamená. Také zvažte, které tituly jsou ve vašem [Concept('de_jure','de iure')|E].\n\n#TUT Dlouhé překračování [Concept('domain_limit','limit domény')|E] byste se měli vyhnout, protože to bude mít následky.\n\nAbyste zůstali pod limitem, měli byste přidělit přebytečné [Concept('titles','tituly')|E] novým vazalům. I když můžete udělovat tituly svým stávajícím vazalům, často je lepší najít někoho bez půdy, komu je udělíte.\n\nVzdálení členové [Concept('dynasty','dynastie')|E] nebo [Concept('courtiers','dvořané')|E] s [GetTrait('content').GetName( GetPlayer )] [Concept('trait','rysem')|E] jsou výborní vazalové. Méně vhodní jsou [Concept('claimants','pretendenti')|E] na vaše tituly nebo dvořané s [GetTrait('ambitious').GetName( GetPlayer )].#!" # todo: CONCEPT CASE
 reactive_advice_vassal_limit: "$reactive_advice_vassal_limit_step_1$"
 reactive_advice_vassal_limit_step_1: "Limit vazalů"
 reactive_advice_vassal_limit_desc: "Nikdo nezvládne hordu hrabat — ambiciózní dobyvatelé se musí spoléhat na vyšší úroveň [Concept('vassals','vazalové')|E], jako jsou vévodové, aby spravovali jejich území!\n\nAktuální limit vazalů vidíte v zobrazení Doména.\n\n#TUT Stejně jako u limitu domény, nechcete překročit svůj [Concept('vassal_limit','limit vazalů')|E]. Abyste se vyhnuli postihu, měli byste konsolidovat své vazaly.\n\nNejlepší způsob je udělovat [Concept('duchies','vévodství')|E] svým vazalům — tím budou vládnout větší oblasti, takže vy je spravovat nemusíte! Aby to fungovalo, musíte však držet [Concept('kingdom','království')|E] nebo [Concept('empire','říše')|E]; nedělejte tu chybu, že byste dali pryč jeden ze svých [Concept('primary_titles','hlavních titulů')|E]!\n\nPokud jako vévoda překročíte limit vazalů, doporučujeme co nejdříve vytvořit království.#!" # todo: CONCEPT CASE
 reactive_advice_megaduke_penalty: "$reactive_advice_megaduke_penalty_step_1$"
 reactive_advice_megaduke_penalty_step_1: "Vévodství příliš rozsáhlé!"
 reactive_advice_megaduke_penalty_desc: "Vaše [Concept('duchy','vévodství')|E] se pod tíhou příliš mnoha zemí hroutí. Měli byste [Concept('create','vytvořit')|E] nebo [Concept('usurp','uzurpovat')|E] [Concept('kingdom','království')|E]!\n\n#TUT Možná už můžete vytvořit království? Pokud ano, otevřete pohled Aktuální situace a zjistěte, jestli některé můžete založit. Pokud ne, existuje [Concept('decision','rozhodnutí')|E] pro založení vlastního království — mějte však na paměti, že tituly, které si založíte sami, jsou často slabší než stávající [Concept('de_jure','de iure')|E] tituly.\n\nPokud jste [Concept('vassal','vazal')|E] a váš [Concept('liege','lenní pán')|E] je král, musíte nejprve požadovat nezávislost, než se sami stanete králem. Prvním krokem je připojit se k nebo založit [Concept('independence_faction','frakce za nezávislost')|E].#!" # todo: CONCEPT CASE
 reactive_advice_bastards: "$reactive_advice_bastards_step_1$"
 action_reactive_advice_bastards: "$open_tutorial_lesson$$reactive_advice_bastards_step_1$"
 action_reactive_advice_bastards_desc: "Nevlastní dítě může být požehnáním i prokletím — co to ale ve skutečnosti znamená?\nOtevřete toto pro přehled o nelegitimních potomcích a jak vám mohou pomoci!"
 action_reactive_advice_bastards_click: "$click_to_open_lesson$"
 reactive_advice_bastards_step_1: "Nelegitimní děti"
 reactive_advice_bastards_desc: "Jejda! Zdá se, že máte [Concept('bastard','bastard')|E] dítě! To může být hrozba i příležitost...\n\n#TUT Mít nelegitimní děti není vždy špatné; lze je provdat nebo provdat pro [Concept('alliances','alianci')|E], aniž by přímo ohrožovaly vaše [Concept('succession','nástupnictví')|E], protože nejsou považovány za [Concept('legitimate','legitimní')|E].\n\nMůže být rozumné mít pár [Concept('bastard','bastard')|E] dětí v záloze, abyste je v případě potřeby mohli [Concept('legitimized','legitimizovaný')|E], pokud vám chybí legitimní potomci. Nicméně pozorně sledujte [Concept('opinion','mínění')|E] vašeho [Concept('spouse','chotě')|E]...\n\nPokud chcete mít [Concept('bastard','bastard')|E] děti, doporučujeme použít [GetScheme('seduce').GetTypeName] [Concept('scheme','intrika')|E] na svobodné postavy. Pokud získáte zájem vdané ženy, její manžel si může myslet, že dítě je jeho — v tom případě nemůžete dítě [Concept('legitimized','legitimizovaný')|E].#!" # todo: CONCEPT CASE
 reactive_advice_protecting_against_hostile_schemes: "$reactive_advice_protecting_against_hostile_schemes_step_1$"
 action_reactive_advice_protecting_against_hostile_schemes: "$open_tutorial_lesson$$reactive_advice_protecting_against_hostile_schemes_step_1$"
 action_reactive_advice_protecting_against_hostile_schemes_desc: "Mnoho nebezpečí se skrývá ve stínech a hrozba spiknutí není nikdy daleko.\nOtevřete toto pro přehled o intrikách a jak se proti nim bránit!"
 action_reactive_advice_protecting_against_hostile_schemes_click: "$click_to_open_lesson$"
 reactive_advice_protecting_against_hostile_schemes_step_1: "Ochrana před intrikami"
 reactive_advice_protecting_against_hostile_schemes_step_2: "$reactive_advice_protecting_against_hostile_schemes_step_1$"
 reactive_advice_protecting_against_hostile_schemes_desc: "Dávejte si pozor! Jako vládce je mnoho, kteří by [Concept('scheme','intrika')|E] usilovali o vaši smrt...\n\nSnažte se zajistit, aby měli vaši poddaní vysoké [Concept('opinion','mínění')|E] — ale nejdůležitější je #emphasis vždycky#! udržet [Concept('spymaster','špehmistr')|E] loajálního.\n\n#TUT Možná o nich nevíte, ale [Concept('hostile_schemes','nepřátelské intriky')|E] vás mohou kdykoliv cílit. Aby se jim zabránilo, doporučujeme udržovat své [Concept('vassals','vazaly')|E] a [Concept('courtiers','dvořané')|E] spokojené.#!" # todo: CONCEPT CASE
 reactive_advice_protecting_against_hostile_schemes_2_desc: "Mít špióna s velmi nízkým [Concept('opinion','míněními')|E] vůči vám může znamenat rozsudek smrti, protože pak není způsob, jak odhalit [Concept('secret_schemes','tajné intriky')|E]!\n\n#TUT Vezměte to v úvahu, pokud plánujete hrát jako [Concept('tyrant','tyran')|E], protože i když můžete své poddané potlačovat pomocí [Concept('dread','hrůzy')|E], stále proti vám mohou [Concept('scheme','intrika')|E].\n\nA konečně, dejte si pozor na [GetTrait('sadistic').GetName( GetPlayer )] nebo [GetTrait('ambitious').GetName( GetPlayer )] [Concept('claimants','pretendenti')|E] na váš trůn...#!" # todo: CONCEPT CASE
 reactive_advice_protect_against_factions: "$reactive_advice_protect_against_factions_step_1$"
 action_reactive_advice_protect_against_factions: "$open_tutorial_lesson$$reactive_advice_protect_against_factions_step_1$"
 action_reactive_advice_protect_against_factions_desc: "Frakce je nebezpečná věc, pokud se ponechá bez dozoru.\nOtevřete toto pro přehled o frakcích a jak je nejlépe řešit!"
 action_reactive_advice_protect_against_factions_click: "$click_to_open_lesson$"
 reactive_advice_protect_against_factions_step_1: "Ochrana před frakcemi"
 reactive_advice_protect_against_factions_desc: "Vznikla proti vám [Concept('faction','frakcím')|E], ale nepanikařte — stále máte čas situaci napravit!\n\n[Concept('vassals','Vazalové')|E] a [Concept('counties','hrabství')|E] se připojují k frakcím, když jsou nespokojeni s vaší vládou. Proti tomu můžete bojovat zvýšením jejich [Concept('opinion','mínění')|E] vůči vám, nebo se snažit stát [Concept('dreaded','obávaný')|E].\n\n#TUT Abyste se vyhnuli frakcím, doporučujeme zvyšovat [Concept('opinion','mínění')|E] vašich vazalů, zpomalit své dobytí a snažit se [GetScheme('murder').GetTypeName] jakékoli [Concept('claimants','pretendenti')|E], kteří jsou populárnější než vy.\n\nČasto budete mít čas své vazaly uklidnit dříve, než frakce uplatní svá požadavky — využijte tento čas moudře.#!" # todo: CONCEPT CASE
 reactive_advice_protect_against_factions_2_desc: "Hrabství s nízkým [Concept('county_opinion','lidovým míněním')|E] mají tendenci připojovat se k [peasant_faction|E]. Na rozdíl od jiných frakcí, tahle frakce povstane bez ohledu na to, zda má šanci zvítězit či nikoli!\n\nNěkdy je prostě nutné dát sedlákům najevo, kdo je pán...\n\n#TUT Vždy byste měli sledovat rolnické frakce. Pokud udeří, zatímco jste ve válce, mohou způsobit značné škody vašemu [Concept('control','kontrole')|E].#!" # todo: CONCEPT CASE
 reactive_advice_protect_against_factions_step_2: "$reactive_advice_protect_against_factions_step_1$"
 reactive_advice_imprisoned: "$reactive_advice_imprisoned_step_1$"
 action_reactive_advice_imprisoned: "$open_tutorial_lesson$$reactive_advice_imprisoned_step_1$"
 action_reactive_advice_imprisoned_desc: "Někdo vás uvěznil! To není dobré...\nOtevřete toto pro pár tipů, co se stane a co můžete dělat, když jste vězněni."
 action_reactive_advice_imprisoned_click: "$click_to_open_lesson$"
 reactive_advice_imprisoned_step_1: "[Select_CString(ROOT.Char.IsFemale,'Byla','Byl')] jste uvězněn!"
 reactive_advice_imprisoned_desc: "Váš charakter [Select_CString(ROOT.Char.IsFemale,'byla','byl')] zajat a je nyní v moci někoho jiného. N moc s tím nenaděláte.\n\nPřejděte na postavu, která vás drží jako [Concept('prisoner','vězeň')|E], a použijte #TUT_KW 'Ransom Yourself'#! [Concept('interaction','interakce')|E] — pokud budete mít štěstí, zaplatíte si svobodu! Pokud ne, mohou se rozhodnout vás [Concept('execute','popravit')|E].\n\n#TUT Pokud jste ve [Concept('war','válce')|E] s tím, kdo vás vězní, může uplatnit [Concept('victory','vítězství')|E]. Proti tomu nic nezmůžete, kromě toho, že v budoucnu budete opatrnější!\n\nPokud jste byli zajati při [Concept('commanding','velení')|E] [Concept('army','armádě')|E], může se to stát, protože jste měli nízké [prowess_i][Concept('prowess','udatností')|E]. Někdy je dobré toto riziko snížit tím, že armády nevedete osobně.\n\nPokud jste byli zajati při [Concept('siege','obléhání')|E], stalo se to proto, že nepřítel [Concept('occupied','obsazeno')|E] vaše [Concept('realm_capital','hlavní sídlo panství')|E]. Vždy se snažte, aby se nepřátelé drželi dál od vaší metropole!#!" # todo: CONCEPT CASE
 reactive_advice_county_control: "$reactive_advice_county_control_step_1$"
 action_reactive_advice_county_control: "$open_tutorial_lesson$$reactive_advice_county_control_step_1$"
 action_reactive_advice_county_control_desc: "Pokud je v [Concept('county','hrabství')|E] nízké [Concept('control','kontrole')|E], dostanete z něj méně výnosů.\nOtevřete toto pro přehled, jak spravovat kontrolu v hrabství!" # todo: CONCEPT CASE
 action_reactive_advice_county_control_click: "$click_to_open_lesson$"
 reactive_advice_county_control_step_1: "Kontrola hrabství"
 reactive_advice_county_control_desc: "Jedno z vašich [Concept('counties','hrabství')|E] má nízkou [Concept('control','kontroly')|E], což znamená, že z něj budete dostávat snížené [Concept('taxes','daně')|E] a [Concept('levies','odvedenci')|E]. Existují však způsoby, jak Kontrolu znovu zvýšit!\n\n#TUT Kontrolu vidíte na mnoha místech: v kartě Doména v pohledu Říše, v pohledu Aktuální situace a v pohledu Hrabství.\n\nPro zvýšení kontroly přejděte do zobrazení Rady a přiřaďte svému [Concept('marshal','maršálovi')|E] úkol [Concept('increase_control','$task_increase_control$')|E]. Kontrola se také zvyšuje časem, ale tento proces je velmi pomalý — doporučujeme místo toho použít vysoce schopného maršála.\n\nPokud necháte hrabství s nízkou Kontrolou dlouho, může získat [Concept('county_corruption','korupce v hrabství')|E]. Abyste se tomu vyhnuli, doporučujeme nezískávat příliš mnoho země najednou.#!" # todo: CONCEPT CASE
 reactive_advice_looming_game_over: "$reactive_advice_looming_game_over_step_1$"
 reactive_advice_looming_game_over_step_1: "Vyhnout se konci hry"
 reactive_advice_looming_game_over_desc: "Jejda! Zdá se, že nemáte [Concept('player_heir','hráčský dědic')|E]. Pokud nyní zemřete, bude to [Concept('game_over','konec hry')|E] — pokusme se tomu zabránit!\n\n#TUT Pokud jste v této situaci, pravděpodobně jste posledním členem své dynastie. Odtud je jediný platný postup — vytvořit [Concept('legitimate','legitimní')|E] dědice!\n\nPokud jste ve společnosti, kde může dědit jen jedno pohlaví, můžete se pokusit změnit [Concept('gender_law','zákon o pohlaví')|E], aby byla méně restriktivní. Pokud máte nějaké [bastards|E], je nyní čas je [Concept('legitimized','legitimizovaný')|E]!\n\nKromě toho se ujistěte, že jste [Concept('married','sezdán')|E] s postavou s vysokou [Concept('fertility','plodností')|E] (obecně platí, že ženy starší 45 let jsou zřídka plodné). Pokud ani to nepomůže, [Concept('divorce','rozvod')|E] nebo se pokuste [GetScheme('murder').GetTypeName] svého [Concept('spouse','chotě')|E] a znovu se oženit — nebo zkuste použít [GetScheme('seduce').GetTypeName] [Concept('scheme','intrika')|E] k počatí bastarda.\n\nČas je nyní klíčový, neberte žádná zbytečná rizika!#!" # todo: CONCEPT CASE
 reactive_advice_bankruptcy: "$reactive_advice_bankruptcy_step_1$"
 action_reactive_advice_bankruptcy: "$open_tutorial_lesson$$reactive_advice_bankruptcy_step_1$"
 action_reactive_advice_bankruptcy_desc: "Nemáte žádné [gold_i]Zlato, jste v dluhu!\nOtevřete toto pro přehled o dluhu a jak se z něj dostat."
 action_reactive_advice_bankruptcy_click: "$click_to_open_lesson$"
 reactive_advice_bankruptcy_step_1: "Dluh"
 reactive_advice_bankruptcy_desc: "Došly vám [gold_i][Concept('gold','zlatu')|E] — to je velmi špatné, musíte snížit výdaje a co nejdříve naplnit pokladnu!\n\n#TUT Být v [Concept('debt','dluhu')|E] vám brání v mnoha věcech, například ve vyhlašování [Concept('wars','válkách')|E] nebo doplňování [Concept('men_at_arms','ozbrojenci')|E], a způsobí vám [Concept('county_corruption','korupcím v hrabství')|E]. Nenechte svůj dluh vymknout kontrole!\n\nNejjednodušší je ukončit jakékoli [Concept('wars','války')|E], které vedete — když jste v míru, neplatíte udržovací náklady na své [Concept('armies','armády')|E]. Pokud ztrácíte hodně Zlata, můžete zvážit i rozpuštění některých Men-at-Arms.\n\nPokud to vaše [Concept('faith','víra')|E] povoluje, můžete použít #TUT_KW $hof_ask_for_gold_interaction$#! [Concept('interaction','interakce')|E] na vašeho [Concept('head_of_faith','hlavu víry')|E], nebo rozhodnutí #TUT_KW $borrow_from_holy_order_decision$#!\n\nMůže být také dobrý nápad přepnout na $stewardship_wealth_focus_short$ [Concept('focus','zaměření')|E], pokud ho ještě nemáte.#!" # todo: CONCEPT CASE
 reactive_advice_rightful_liege: "$reactive_advice_rightful_liege_step_1$"
 action_reactive_advice_rightful_liege: "$open_tutorial_lesson$$reactive_advice_rightful_liege_step_1$"
 action_reactive_advice_rightful_liege_desc: "De Jure struktura je pro vaše vazaly velmi důležitá — nebýt jejich #emphasis právoplatným#! pánem může poškodit vaše vztahy.\nOtevřete toto pro přehled, co znamená být Správným pánem!"
 action_reactive_advice_rightful_liege_click: "$click_to_open_lesson$"
 reactive_advice_rightful_liege_step_1: "Právoplatný pán"
 reactive_advice_rightful_liege_step_2: "$reactive_advice_rightful_liege_step_1$"
 reactive_advice_rightful_liege_desc: "Nejste [Concept('rightful_liege','právoplatný lenní pán')|E] jednoho z vašich [Concept('vassal','vazala')|E]. To sníží jejich [Concept('opinion','mínění')|E] o vás a způsobí, že vám budou platit méně [Concept('taxes','daně')|E] a odevzdávat méně [Concept('levies','odvedenci')|E].\n\nMěli byste usilovat o to, být Správným pánem všech svých vazalů!\n\n#TUT K tomu musíte držet [Concept('title','titul')|E], který je o krok nad nimi v rámci [Concept('de_jure','de iure')|E]. Vazal na úrovni [Concept('county','hrabství')|E] chce být pod svým de jure [Concept('duchy','vévodství')|E]. Například hrabě z $c_madrid$ chce být pod vévodou z $d_toledo$.\n\nJe běžné mít některé vazaly, jejichž Správným pánem nejste — s tím nelze vždy nic dělat a je to zcela normální! Nezapomeňte ale používat #TUT_KW $grant_vassal_interaction$#! [Concept('interaction','interakci')|E] k organizaci svých vazalů; nemůžete držet všechny tituly sami.#!" # todo: CONCEPT CASE
 reactive_advice_rightful_liege_2_desc: "Při dobývání nových zemí často získáte nové vazaly, jejichž Správným pánem nejste. Plánování dobytí může tento problém zmírnit.\n\n#TUT Abyste se vyhnuli přílišnému množství vazalů, kteří vás nemají za Správného pána, doporučujeme soustředit dobytí na jedno De Jure území po dobu. Tím se můžete #emphasis postupně#! stát jejich Správným pánem. Často kontrolujte, zda můžete [Concept('create','vytvořit')|E] nové tituly!\n\nNezapomeňte při plánování dobývání používat De Jure mapové režimy!#!" # todo: CONCEPT CASE
 reactive_advice_bishop_endorsement: "$reactive_advice_bishop_endorsement_step_1$"
 action_reactive_advice_bishop_endorsement: "$open_tutorial_lesson$$reactive_advice_bishop_endorsement_step_1$"
 action_reactive_advice_bishop_endorsement_desc: "Váš biskup vás nepodporuje!\nOtevřete toto pro přehled, co to pro vás znamená a jak to napravit."
 action_reactive_advice_bishop_endorsement_click: "$click_to_open_lesson$"
 reactive_advice_bishop_endorsement_step_1: "Podpora biskupa"
 reactive_advice_bishop_endorsement_desc: "Vyznání vašeho charakteru způsobuje, že máte na své [Concept('council','radu')|E] [Concept('realm_priest','duchovní panství')|E].\n\nTito biskupové drží obrovskou moc a jsou ochotni ji s vámi sdílet — pokud zůstanete na jejich dobré straně...\n\n#TUT Váš biskup vám poskytuje [Concept('taxes','daně')|E] a [Concept('levies','odvedenci')|E] ze všech [Concept('temple_holdings','chrámových držav')|E] ve vašem [Concept('realm','panství')|E], a kolik toho dá, závisí na jeho [Concept('opinion','mínění')|E] o vás.\n\nKdyž vás nemá rád, nedostanete nic a biskup vám může dokonce znepříjemnit život! Může vás například donutit k [Concept('divorce','rozvodu')|E]...\n\nDělejte vše pro zlepšení jeho opinion vůči vám. Použití #TUT_KW $gift_interaction$#! [Concept('interaction','interakce')|E] nebo zahájení [GetScheme('sway').GetTypeName] [Concept('scheme','intrika')|E] jsou dvě dobré možnosti.\n\nPokud nic nepomůže, vždy je možnost [GetScheme('murder').GetTypeName]... Možná bude jeho nástupce přívětivější?#!" # todo: CONCEPT CASE
 reactive_advice_encyclopedia: "$reactive_advice_encyclopedia_step_1$"
 action_reactive_advice_encyclopedia: "$open_tutorial_lesson$$reactive_advice_encyclopedia_step_1$"
 action_reactive_advice_encyclopedia_desc: "Chcete se dozvědět více o některých pojmech ve hře? Otevřete toto pro úvod do Encyklopedie."
 action_reactive_advice_encyclopedia_click: "$click_to_open_lesson$"
 reactive_advice_encyclopedia_step_1: "Encyklopedie"
 reactive_advice_encyclopedia_desc: "Crusader Kings III má mnoho konceptů a pojmů, které se můžete naučit. Pokud si nejste jisti nějakým herním konceptem, můžete otevřít Encyklopedii.\n\nPostupujte podle zvýrazněného rozhraní, abyste viděli, jak to udělat.\n\n#TUT Kategorie 'Tutorial Lessons' v Encyklopedii obsahuje mnoho sekcí tutoriálu, pokud si budete chtít někdy osvěžit paměť. #!"
 reactive_advice_religion: "$lesson_basics_religion_1$"
 action_reactive_advice_religion: "$open_tutorial_lesson$$lesson_basics_religion_1$"
 action_reactive_advice_religion_desc: "Chcete se dozvědět více o víře a náboženství? Otevřete toto pro úvod do vašeho vyznání."
 action_reactive_advice_religion_click: "$click_to_open_lesson$"
 reactive_advice_dynamic_culture: "Kultura"
 action_reactive_advice_dynamic_culture: "$open_tutorial_lesson$$reactive_advice_dynamic_culture$"
 action_reactive_advice_dynamic_culture_desc: "Chcete se dozvědět více o kulturách? Otevřete toto pro úvod do kultur."
 action_reactive_advice_dynamic_culture_click: "$click_to_open_lesson$"
 reactive_advice_fabricate_claim: "$reactive_advice_fabricate_claim_step_1$"
 action_reactive_advice_fabricate_claim: "$open_tutorial_lesson$$reactive_advice_fabricate_claim_step_1$"
 action_reactive_advice_fabricate_claim_desc: "Nemůžete vyhlásit válku bez casus belli? Můžete si vymyslet nárok!\nOtevřete toto pro přehled, jak použít radu k vygenerování nároků."
 action_reactive_advice_fabricate_claim_click: "$click_to_open_lesson$"
 reactive_advice_fabricate_claim_step_1: "Tvorba nároků"
 reactive_advice_fabricate_claim_desc: "Nemůžete vyhlásit válku bez [Concept('casus_belli','casu belli')|E]. Nejčastějším zdrojem casus belli jsou [Concept('claims','nároky')|E], ale někdy se vám požadovaný nárok těžko získává.\n\nK tomu slouží [Concept('fabricated_claims_short','vykonstruované nároky')|E]!\n\n#TUT Můžete přiřadit svého [Concept('court_chaplain','dvorního kaplana')|E] ke tvorbě nároku na jakékoli blízké [Concept('county','hrabství')|E], což lze provést v pohledu [Concept('council','radě')|E]. Můžete mít najednou jen jeden tvořený nárok a každý trvá nějaký čas.\n\nTento nástroj je obzvlášť užitečný, když hrajete za malého [Concept('ruler','vládce')|E], protože casus belli se s rozšiřováním vašeho [Concept('realm','panstvím')|E] stávají snazšími.\n\nDoporučujeme vytvářet nároky na bezprostřední sousedy — ideálně ty, kteří jsou slabší než vy! Pokud hrajete hraběte, zaměřte se na nároky v rámci stejného [Concept('de_jure','de iure')|E] [Concept('duchy','vévodství')|E] jako vaše [Concept('realm_capital','hlavní sídlo panství')|E].#!" # todo: CONCEPT CASE
 reactive_advice_education: "$reactive_advice_education_step_1$"
 action_reactive_advice_education: "$open_tutorial_lesson$$reactive_advice_education_step_1$"
 action_reactive_advice_education_desc: "Váš dědic se sám nestane skvělým vládcem bez vzdělání!\nOtevřete toto pro přehled o opatrovnictví a jak správně vychovat dědice."
 action_reactive_advice_education_click: "$click_to_open_lesson$"
 reactive_advice_education_step_1: "Vzdělávání"
 reactive_advice_education_desc: "Zdá se, že váš [Concept('player_heir','hráčský dědic')|E] nemá [Concept('guardian','poručník')|E]! Bez správného [Concept('education','vzdělání')|E] získá slabé [Concept('skills','dovedností')|E] a náhodné [Concept('traits','rysy')|E].\n\n#TUT Použijte #TUT_KW $educate_child_interaction$#! [Concept('interaction','interakce')|E] na svého dědice a najděte vhodnou postavu jako jeho [Concept('guardian','poručníka')|E].\n\nChcete najít charakter, který je znalý v oblasti, v níž chcete, aby váš [Concept('ward','svěřenec')|E] vynikal. Doporučujeme hledat opatrovníka s vysokou úrovní [Concept('education_trait','rysem vzdělání')|E] (např. [GetTrait('education_martial_4').GetName( GetPlayer )]) nebo vlastnostmi jako [GetTrait('intellect_good_1').GetName( GetPlayer )] či [GetTrait('intellect_good_3').GetName( GetPlayer )]. Pokud nechcete riskovat, že někdo jiný formuje povahu vašeho dítěte, můžete svého dědice vychovat sami!\n\nObecně chcete, aby všechno vaše děti měly dobré vzdělání. Přesto, pokud máte děti, o které příliš nestojíte (například čtvrté nebo páté dítě), můžete je klidně svěřit svým [Concept('vassals','vazaly')|E] a získat tím zvýšení [Concept('opinion','mínění')|E]. Nejsnazší způsob, jak najít vhodného učitele, je použít #TUT_KW $offer_ward_interaction$#! Interaction přímo na vazala.#!" # todo: CONCEPT CASE
 reactive_advice_tooltip_modes: "$reactive_advice_tooltip_modes_step_1$"
 action_reactive_advice_tooltip_modes: "$open_tutorial_lesson$$reactive_advice_tooltip_modes_step_1$"
 action_reactive_advice_tooltip_modes_desc: "Crusader Kings III má různé režimy nápovědy!\nOtevřete toto pro přehled různých režimů a najděte ten, který vám vyhovuje."
 action_reactive_advice_tooltip_modes_click: "$click_to_open_lesson$"
 reactive_advice_tooltip_modes_step_1: "Režimy nápovědí"
 reactive_advice_tooltip_modes_step_2: "Pokročilé režimy nápovědí"
 reactive_advice_tooltip_modes_desc: "Režimy nápovědí určují #EMP jak#! přistupujete k [Concept('highlighted_text','zvýrazněnému textu')|E] a informacím v nápovědách #weak (jinými slovy, jak je zamknout tak, abyste do nich mohli přesunout myš)#!.\n\nVýchozí režim nápovědy se nazývá #V Timer Lock#!. V tomto režimu se nápovědy zamknou na místě po uplynutí nastaveného času, který je indikovaný malým ukazatelem průběhu." # todo: CONCEPT CASE
 reactive_advice_tooltip_modes_2_desc: "Pokud jste zkušený hráč nebo preferujete, aby se nápovědy nezamykaly automaticky, doporučujeme vyzkoušet #V Action Lock#!. V tomto režimu stisknete #V střední tlačítko myši#! pro zamknutí nápovědí.\n\n#I Změníte režim nápovědí v #V herním menu#!, potom v #V nastaveních#!, v sekci #V Hra#! — tam najdete nastavení #V Režim nápovědí#!.#!"
 action_perk_bonus_cap_modes: "Dosaženo maximálního bonusu perku"
 action_perk_bonus_cap_modes_desc: "Dosáhli jste maximálního bonusu, který perk může udělit. Některé perky, jako [GetPerk('sound_foundations_perk').GetName(GetPlayer)], mají maximální množství bodů dovedností, které mohou udělit."
 action_perk_bonus_cap_modes_click: "$click_to_open_lesson$"
 reactive_advice_perk_bonus_cap: "$action_perk_bonus_cap_modes$"
 reactive_advice_perk_bonus_cap_desc: "$action_perk_bonus_cap_modes_desc$ Když jste nad limitem, bonus se už nebude zvyšovat a nebude se snižovat, dokud nebudete pod limitem."
 reactive_advice_perk_bonus_cap_step_1: "$action_perk_bonus_cap_modes$"
 action_reactive_advice_varangian_adventure: "$open_tutorial_lesson$$reactive_advice_varangian_adventure_step_1$"
 action_reactive_advice_varangian_adventure_desc: "Můžete zahájit Varjagské dobrodružství.\nOtevřete toto, abyste se dozvěděli více o tomto speciálním typu války."
 action_reactive_advice_varangian_adventure_click: "$click_to_open_lesson$"
 reactive_advice_varangian_adventure: "Varjažské výpravy" # todo: CONCEPT CASE
 reactive_advice_varangian_adventure_step_1: "Varjažské výpravy" # todo: CONCEPT CASE
 reactive_advice_varangian_adventure_desc: "Můžete vyhlásit [Concept('varangian_adventure','varjažská výprava')|E].\n\nBěhem $culture_era_tribal$ [Concept('era','éra')|E] je tento typ války dostupný a umožní vám začít nový život v daleké zemi, daleko od studených břehů vaší vlasti.\n\nÚspěšné $game_concept_varangian_adventures$ nejen přemístí vaše panství na cizí místo, ale také nechají všechna vaše stávající území nezávislá, včetně vašich vazalů.\n\nVaše první [Concept('varangian_adventure','varjažská výprava')|E], kterou podniknete jako vládce $north_germanic_group$, také přivolá dodatečné vojáky z vlastněných stejnoférových a stejno kulturních hrabství v [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName] k tomu, aby vám pomohli dobýt nový domov." # todo: CONCEPT CASE
 action_reactive_advice_court_positions: "$open_tutorial_lesson$$ra_court_pos_open_view$"
 action_reactive_advice_court_positions_desc: "Otevřete toto pro úvod do pozic na dvoře."
 action_reactive_advice_court_positions_click: "$click_to_open_lesson$"
 reactive_advice_court_positions: "$ra_court_pos_open_view$"
 ra_court_pos_open_view: "Dvorní pozice"
 ra_court_pos_open_view_desc: "Je nyní vhodná chvíle probrat [Concept('court_positions','dvorské úřady')|E]. Jsou to úkoly a pocty, které můžete udělit svým [Concept('courtiers','dvořany')|E] a [Concept('vassals','vazalové')|E].\n\nKaždá z nich vám poskytuje výhodu za cenu měsíčního platu. Například [GetCourtPositionType('court_physician_court_position').GetName()] udrží vás a váš [Concept('court','dvůr')|E] zdravé." # todo: CONCEPT CASE
 ra_court_pos_open_view_trigger: "Otevřete kartu Dvorských pozic (zvýrazněno)"
 ra_court_pos_appointing: "$ra_court_pos_open_view$"
 ra_court_pos_appointing_desc: "Nové [Concept('court_positions','dvorské úřady')|E] můžete jmenovat kliknutím na jeden z prázdných portrétů u volné pozice. Postava s vysokým [Concept('aptitude','způsobilostí')|E] pro danou pozici vám poskytne větší bonus.\n\n#TUT Když někoho do funkce jmenujete, ovlivní to i jeho [Concept('opinion','mínění')|E] o vás. Z tohoto důvodu může být výhodné jmenovat někoho s nízkým způsobilostí jen proto, aby vás měl rád více.#!" # todo: CONCEPT CASE
 ra_court_pos_salary: "$ra_court_pos_open_view$"
 action_reactive_advice_artifact_inventory: "$open_tutorial_lesson$$ra_artifact_inventory_general$"
 action_reactive_advice_artifact_inventory_desc: "Otevřete toto pro úvod do inventárních artefaktů."
 action_reactive_advice_artifact_inventory_click: "$click_to_open_lesson$"
 reactive_advice_artifact_inventory: "$ra_artifact_inventory_general$"
 ra_artifact_inventory_general: "Inventář"
 ra_artifact_inventory_general_desc: "Získali jste svůj první [Concept('inventory_artifact','osobní artefakt')|E]. Tyto [Concept('artifacts','artefakty')|E] nosíte u sebe a poskytují různé výhody." # todo: CONCEPT CASE
 ra_artifact_inventory_open_step: "$ra_artifact_inventory_general$"
 ra_artifact_inventory_open_step_desc: "[Concept('inventory_artifacts','Osobní artefakty')|E] jsou uloženy ve vašem Inventáři, otevřeme ho nyní." # todo: CONCEPT CASE
 ra_artifact_inventory_open_step_open: "Otevřete Inventář (zvýrazněno)"
 ra_artifact_inventory_welcome: "$ra_artifact_inventory_general$"
 ra_artifact_inventory_welcome_desc: "Ve svém Inventáři můžete vybavit [Concept('inventory_artifacts','osobní artefakty')|E], abyste získali různé výhody, například zvýšení určitého [Concept('skill','dovednosti')|E] nebo [Concept('prestige','prestiž')|E].\n\nTaké můžete [Concept('repair','oprava')|E] nebo [Concept('reforge','překování')|E] [Concept('inventory_artifacts','osobní artefakty')|E], čímž obnovíte jejich [Concept('durability','trvanlivost')|E] a zabráníte jejich zničení v průběhu času.\n\nTaké můžete vidět, jaké [Concept('artifact_claims','nároky na artefakt')|E] máte, a pokusit se dané [Concept('artifacts','artefakty')|E] získat pro sebe!" # todo: CONCEPT CASE
 ra_maa_stationing_open_card_step: "Umístění mužů zbraní"
 ra_maa_stationing_open_card_step_desc: "Máte [Concept('men_at_arms','ozbrojenci')|E], které nemáte [Concept('stationed','umístěno')|E].\n\nUmístěním svých [Concept('regiments','pluků')|E] je učiníte silnějšími a lepšími v boji, což může být zásadní pro vítězství v [Concept('battles','bitvách')|E].\n\nUmístěme nyní jeden [Concept('regiment','pluk')|E]!" # todo: CONCEPT CASE
 ra_maa_stationing_open_card_step_tt: "Klikněte na jednoho z vašich Men-at-Arms označeného textem '#X $MAA_UNSTATIONED$#!' (zvýrazněno)"
 ra_maa_stationing_click_station_button: "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_click_station_button_desc: "Můžete umístit jeden [Concept('regiment','pluk')|E] [Concept('men_at_arms','ozbrojenci')|E] na každé [Concept('holding','državu')|E] ve vašem [Concept('domain','doméně')|E].\n\nVšechny Holdings jsou platné pro každý typ [Concept('regiment','pluk')|E], ale některé dávají větší bonusy než jiné.\n\nVyberme nyní [Concept('holding','država')|E], do kterého tento [Concept('regiment','pluk')|E] umístíme." # todo: CONCEPT CASE
 ra_maa_stationing_click_station_button_tt: "Klikněte na tlačítko 'Změnit umístěné držení' (zvýrazněno)"
 ra_maa_stationing_select_station: "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_select_station_desc: "Různá [Concept('holdings','državy')|E] dávají různé bonusy v závislosti na tom, které [Concept('buildings','budovy')|E] zvolíte.\n\nV tomto zobrazení můžete přesně vidět, jak moc by se váš [Concept('men_at_arms','ozbrojenci')|E] [Concept('regiment','pluk')|E] zlepšil, kdyby [Select_CString(ROOT.Char.IsFemale,'byla','byl')] umístěn v konkrétní [Concept('holding','državě')|E].\n\nKlikněte na #P Green#! [Concept('holding','država')|E] na mapě, o kterou si myslíte, že poskytne vašemu [Concept('regiment','pluku')|E] nejlepší bonus." # todo: CONCEPT CASE
 ra_maa_stationing_select_station_tt: "Klikněte na jakékoli #P Green#! [Concept('holding','država')|E] na mapě" # todo: CONCEPT CASE
 ra_maa_stationing_finished: "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_finished_desc: "[Concept('men_at_arms','Ozbrojenci')|E] [Concept('regiment','Pluk')|E] je nyní [Concept('stationed','umístěno')|E], pod jeho portrétem vidíte, o kolik se zlepšil (zvýrazněná část).\n\nNezapomeňte čas od času zkontrolovat, zda jsou vaše [Concept('regiments','pluky')|E] umístěny v optimálních [Concept('holdings','držav')|E].\n\nTo je obzvlášť důležité, pokud dobyjete nebo zdědíte nová území, nebo pokud se rozhodnete specializovat nějaké [Concept('holding','država')|E] pomocí [Concept('buildings','budov')|E] jako [GetBuilding('smiths_01').GetName] nebo [GetBuilding('stables_01').GetName]." # todo: CONCEPT CASE
 reactive_advice_station_maa: "$ra_maa_stationing_open_card_step$"
 REACTIVE_ADVICE_TOURS: "Turné"
 action_reactive_advice_tours_picking_vassals: "$open_tutorial_lesson$$REACTIVE_ADVICE_TOURS$"
 action_reactive_advice_tours_picking_vassals_desc: "Právě plánujete, které vazaly navštívíte během svého velkého turné. Otevřete toto, abyste se dozvěděli více o plánování turné."
 action_reactive_advice_tours_picking_vassals_click: "$click_to_open_lesson$"
 reactive_advice_tours_picking_vassals: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_intro: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_intro_desc: "Chystáte se vydat na [GetActivityType( 'activity_tour' ).GetName()] ve vašem [Concept('realm','panství')|E].\n\nBěhem turné budete [Concept('travel','cestování')|E] navštěvovat své [Concept('vassals','vazaly')|E], investovat [Concept('gold','zlato')|E] a získávat odměny jako [Concept('county_control','kontrola hrabství')|E], [Concept('opinion','mínění')|E], [Concept('cultural_acceptance','kulturní přijetí')|E] a mnohé další!" # todo: CONCEPT CASE
 ra_tours_picking_vassals_add: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_add_desc: "Nejprve musíte vybrat, které [Concept('vassals','vazalové')|E] navštívíte.\n\nKoho navštívit závisí na typu [GetActivityType( 'activity_tour' ).GetName()]. Například při [majesty_tour|E] každá [Concept('stop','zastávce')|E] zvyšuje [Concept('opinion','mínění')|E] toho vazala, takže můžete vybrat vazaly s nízkým názorem na vás.\n\nCestování daleko mezi zastávkami zvyšuje cenu v [Concept('gold','zlatu')|E] za každou zastávku." # todo: CONCEPT CASE
 ra_tours_picking_vassals_add_prompt: "Přidejte alespoň jednoho vazala k návštěvě kliknutím na mapu"
 ra_tours_picking_vassals_stops: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_stops_desc: "Na každé [Concept('stop','zastávku')|E] turné můžete buď:\n$BULLET_WITH_TAB$[Concept('tour_the_grounds','Obhlédnout državy')|E], čímž zvýšíte [Concept('county_control','kontrola hrabství')|E]\n$BULLET_WITH_TAB$požádat o [Concept('hosted_dinner','pořádanou hostinu')|E], čímž získáte [Concept('hooks','páky')|E] a [Concept('relations','zvláštní vztahy')|E]\n$BULLET_WITH_TAB$požádat svého [Concept('vassal','vazala')|E], aby uspořádal [Concept('cultural_festival','kulturní slavnost')|E], čímž zvýšíte [Concept('county_opinion','lidové mínění')|E] a [Concept('cultural_acceptance','kulturní přijetí')|E]" # todo: CONCEPT CASE
 ra_tours_picking_vassals_conclusion: "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_conclusion_desc: "Jakmile budete spokojeni s [Concept('stops','zastávkami')|E] a jejich pořadím, můžete přejít k dalšímu kroku plánování." # todo: CONCEPT CASE
 REACTIVE_ADVICE_REGENCY_TERM: "Regentství"
 REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT: "Otevřete zobrazení regentství (zvýrazněno)"
 REACTIVE_ADVICE_YOU_REGENCY_REASONS: "K [Concept('regency','regentství')|E] může dojít z mnoha důvodů, včetně:\n$BULLET_WITH_TAB$Když [Concept('travel','cestování')|E] mimo své [Concept('realm','panství')|E]\n$BULLET_WITH_TAB$Když jste [Concept('child','dítě')|E]\n$BULLET_WITH_TAB$Když se stanete [GetTrait('incapable').GetName( GetPlayer )]" # todo: CONCEPT CASE
 reactive_advice_regency_for_liege: "$action_reactive_advice_regency_for_liege$"
 action_reactive_advice_regency_for_liege: "$open_tutorial_lesson$$REACTIVE_ADVICE_REGENCY_TERM$"
 action_reactive_advice_regency_for_liege_desc: "Nyní máte regenta. Otevřete toto pro úvod do regentství."
 action_reactive_advice_regency_for_liege_click: "$click_to_open_lesson$"
 ra_regency_liege_intro: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_intro_desc: "Nyní máte [Concept('regent','regent')|E].\n\n$REACTIVE_ADVICE_YOU_REGENCY_REASONS$" # todo: CONCEPT CASE
 ra_regency_liege_effects: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_effects_desc: "Během [Concept('regency','regentství')|E] můžete stále vykonávat jakoukoli akci, kterou byste normálně mohli.\n\nNicméně [Concept('regent','regent')|E] získává speciální [Concept('diarch_powers','propůjčené pravomoci')|E], které může použít proti vám nebo vašim [Concept('vassals','vazalům')|E]. Vždy máte [Concept('veto','veto')|E] práva nad těmito propůjčenými pravomocemi." # todo: CONCEPT CASE
 ra_regency_liege_open_UI: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_open_UI_desc: "Pojďme se podívat na vaše [Concept('regency','regentství')|E]!" # todo: CONCEPT CASE
 ra_regency_liege_open_UI_prompt: "$REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT$"
 ra_regency_liege_open_tab: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_open_tab_desc: "Váš [Concept('regent','regent')|E] je zobrazen na záložce '$DIARCHY_WINDOW_YOUR_TAB$'." # todo: CONCEPT CASE
 ra_regency_liege_open_tab_prompt: "Otevřete záložku '$DIARCHY_WINDOW_YOUR_TAB$' (zvýrazněno)"
 ra_regency_liege_scales_of_power: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_scales_of_power_desc: "Toto jsou [Concept('scales_of_power','misky vah moci')|E].\n\nČím více Váhy nakloní ve prospěch vašeho [Concept('regent','regenta')|E], tím více [Concept('diarch_powers','propůjčené pravomoci')|E] bude mít k dispozici a ukončení [Concept('regency','regentství')|E] bude obtížnější.\n\nPřímo můžete Váhy přehodit ve svůj prospěch tlačítkem '$DIARCHY_WINDOW_SWING_SCALES$'." # todo: CONCEPT CASE
 ra_regency_liege_mandate: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_mandate_desc: "Můžete svému [Concept('regent','regentovi')|E] udělit [Concept('mandate','mandát')|E], které zaměří jeho úsilí v dané oblasti.\n\nTento Mandát můžete později změnit podle vašich priorit." # todo: CONCEPT CASE
 ra_regency_liege_ending: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_ending_desc: "Pokud podmínky, které zahájily [Concept('regency','regentství')|E], již neplatí, můžete se pokusit ji ukončit.\n\n[Concept('regent','Regent')|E] to musí přijmout, ale můžete mu nabídnout věci jako [Concept('gold','zlato')|E] nebo [Concept('favor','laskavost')|E], aby to zvýšilo pravděpodobnost, že souhlasí. \n\nPokud odmítne, může proti vám vyhlásit [Concept('war','válka')|E]!" # todo: CONCEPT CASE
 ra_regency_liege_conclusion: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_conclusion_desc: "Regentství je většinou reaktivní záležitost. Prozatím mějte na paměti [Concept('scales_of_power','misky vah moci')|E].\n\nKdyž váš [Concept('regent','regent')|E] použije některou ze svých [Concept('diarch_powers','propůjčených pravomocí')|E], budete o tom informováni a můžete rozhodnout, jak na to reagovat." # todo: CONCEPT CASE
 reactive_advice_regency_for_regent: "$action_reactive_advice_regency_for_regent$"
 action_reactive_advice_regency_for_regent: "$open_tutorial_lesson$Regent"
 action_reactive_advice_regency_for_regent_desc: "Nyní jste [Concept('regent','regent')|E] pro svého [Concept('liege','lenního pána')|E]. Otevřete toto pro úvod do [Concept('regency','regentství')|E]." # todo: CONCEPT CASE
 action_reactive_advice_regency_for_regent_click: "$click_to_open_lesson$"
 ra_regency_regent_intro: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_intro_desc: "Působíte jako [Concept('regent','regent')|E] pro svého [Concept('liege','lenního pána')|E].\n\nK [Concept('regency','regentství')|E] může dojít z mnoha důvodů, včetně:\n$BULLET_WITH_TAB$Když se váš [Concept('liege','lenní pán')|E] [Concept('travels','cesty')|E] mimo vaše [Concept('realm','panství')|E]\n$BULLET_WITH_TAB$Když je váš [Concept('liege','lenní pán')|E] [Concept('child','dítě')|E]\n$BULLET_WITH_TAB$Když se váš [Concept('liege','lenní pán')|E] stane [GetTrait('incapable').GetName( GetPlayer )]" # todo: CONCEPT CASE
 ra_regency_regent_powers: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_powers_desc: "Jako [Concept('regent','regent')|E] získáte speciální [Concept('diarch_powers','propůjčené pravomoci')|E], které můžete použít na svého [Concept('liege','lenního pána')|E] nebo na své spoluvazaly [Concept('vassals','vazalové')|E]. Váš [Concept('liege','lenní pán')|E] vždy má [Concept('veto','veto')|E] práva nad těmito propůjčenými pravomocemi.\n\nPoužití těchto pravomocí na své spoluvazaly může být považováno za překročení moci, což vám udělí penalizaci [Concept('opinion','mínění')|E] za [Concept('strife','svár')|E]." # todo: CONCEPT CASE
 ra_regency_regent_open_UI: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_open_UI_desc: "Pojďme se podívat na vaše [Concept('regency','regentství')|E]!" # todo: CONCEPT CASE
 ra_regency_regent_open_UI_prompt: "$REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT$"
 ra_regency_regent_open_tab: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_open_tab_desc: "Váš status jako [Concept('regent','regent')|E] je zobrazen na záložce '$DIARCHY_WINDOW_LIEGE_TAB$'." # todo: CONCEPT CASE
 ra_regency_regent_open_tab_prompt: "Otevřete záložku '$DIARCHY_WINDOW_LIEGE_TAB$' (zvýrazněno)"
 ra_regency_regent_scales_of_power: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_scales_of_power_desc: "Toto jsou [Concept('scales_of_power','misky vah moci')|E].\n\nČím více Váhy nakloní ve váš prospěch, tím více [Concept('diarch_powers','propůjčené pravomoci')|E] budete mít k dispozici a ukončení [Concept('regency','regentství')|E] bude obtížnější.\n\nMůžete přímo přehodit Váhy ve svůj prospěch tlačítkem '$DIARCHY_WINDOW_SWING_SCALES$'." # todo: CONCEPT CASE
 ra_regency_regent_mandate: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_mandate_desc: "Váš [Concept('liege','lenní pán')|E] vám může udělit [Concept('mandate','mandát')|E], které vám dá příležitosti zlepšit [Concept('realm','panství')|E].\n\nPokud tyto příležitosti zvládnete dobře, přehodíte [Concept('scales_of_power','misky vah moci')|E] ve svůj prospěch." # todo: CONCEPT CASE
 ra_regency_regent_ending: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_ending_desc: "Pokud podmínky, které zahájily [Concept('regency','regentství')|E], již neplatí, může se váš [Concept('liege','lenní pán')|E] pokusit o její ukončení.\n\nPokud jsou [Concept('scales_of_power','misky vah moci')|E] výrazně ve váš prospěch, můžete se jejich pokusu o ukončení regentství dokonce postavit, možná i vyhlásit [Concept('war','válka')|E] o jejich [Concept('primary_title','hlavní titul')|E]!" # todo: CONCEPT CASE
 ra_regency_regent_conclusion: "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_conclusion_desc: "Jako [Concept('regent','regent')|E] můžete zkusit použít své [Concept('diarch_powers','propůjčené pravomoci')|E] na svého [Concept('liege','lenního pána')|E] nebo na své spoluvazaly [Concept('vassals','vazalové')|E].\n\nPokud nechcete svého [Concept('liege','lenního pána')|E] rozeštvat, můžete prostě reagovat na příležitosti, které se objeví, a váš [Concept('liege','lenní pán')|E] vás může odměnit za vaši loajalitu!" # todo: CONCEPT CASE
 REACTIVE_ADVICE_FUTURE_REGENT: "Budoucí regent"
 action_reactive_advice_set_future_regent: "$open_tutorial_lesson$$REACTIVE_ADVICE_FUTURE_REGENT$"
 action_reactive_advice_set_future_regent_desc: "Pokud se stanete neschopným vládnout, bude za vás vládnout regent. Otevřete toto a naučte se, jak ovládat, kdo bude vaším regentem."
 action_reactive_advice_set_future_regent_click: "$click_to_open_lesson$"
 reactive_advice_set_future_regent: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_intro: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_intro_desc: "V budoucnu se může stát, že nebudete schopni sami vládnout svému [Concept('realm','panství')|E], v takovém případě začne [Concept('regency','regentství')|E].\n\nNež se to stane, můžete vidět svého budoucího [Concept('regent','regenta')|E] a dokonce ho sami určit!\n\n$REACTIVE_ADVICE_YOU_REGENCY_REASONS$" # todo: CONCEPT CASE
 ra_regency_future_regent_open_realm_panel: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_open_realm_panel_desc: "Pojďme si prohlédnout vaše budoucí [Concept('regency','regentství')|E]! Můžete ji vidět v Přehledu říše." # todo: CONCEPT CASE
 ra_regency_future_regent_open_realm_panel_prompt: "Otevřete Přehled říše (zvýrazněno)"
 ra_regency_future_regent_open_UI: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_open_UI_desc: "Váš stav [Concept('regency','regentství')|E] je zde zobrazen nahoře v Přehledu říše." # todo: CONCEPT CASE
 ra_regency_future_regent_open_UI_prompt: "Otevřete zobrazení regentství (zvýrazněno)"
 ra_regency_future_regent_open_tab: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_open_tab_desc: "Váš budoucí [Concept('regent','regent')|E] je zobrazen na záložce '$DIARCHY_WINDOW_YOUR_TAB$'." # todo: CONCEPT CASE
 ra_regency_future_regent_open_tab_prompt: "$ra_regency_liege_open_tab_prompt$"
 ra_regency_future_regent_current_regent: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_current_regent_desc: "Váš budoucí [Concept('regent','regent')|E] je zde zobrazen.\n\nPokud jej neurčíte vy, bude vybrán kandidát s nejvyšším [Concept('regent_succession_score','skórem regentským nástupnictví')|E]." # todo: CONCEPT CASE
 ra_regency_future_regent_swap_regent: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_swap_regent_desc: "Tímto tlačítkem můžete určit [Concept('regent','regent')|E].\n\nMěli byste hledat regenta s vysokým [Concept('diarch_loyalty','loajalitou')|E] a vysokým [Concept( 'diarch_aptitude', 'Aptitude' )|E]." # todo: CONCEPT CASE
 ra_regency_future_regent_succession: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_succession_desc: "Pokud váš současný [Concept('regent','regent')|E] zemře nebo jinak nebude schopen vykonávat funkci [Concept('regent','regenta')|E], převezme jeho místo další postava dle pořadí nástupnictví." # todo: CONCEPT CASE
 ra_regency_future_regent_conclusion: "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_conclusion_desc: "Zatím zvažte určení [Concept('regent','regent')|E], pokud chcete mít větší kontrolu nad tím, kdo bude vládnout místo vás." # todo: CONCEPT CASE
 REACTIVE_ADVICE_TRAVEL_PLANNING: "Plánování cesty"
 action_reactive_advice_travel_planning: "$open_tutorial_lesson$$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 action_reactive_advice_travel_planning_desc: "Chystáte se cestovat, otevřete toto a dozvíte se více o plánování cesty."
 action_reactive_advice_travel_planning_click: "$click_to_open_lesson$"
 reactive_advice_travel_planning: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_intro: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_intro_desc: "Chystáte se [Concept('travel','cestováním')|E] opustit své současné místo. Než odejdete, měli byste naplánovat svou cestu." # todo: CONCEPT CASE
 ra_travel_planning_entourage: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_entourage_desc: "Zřídka [Concept('travel','cestování')|E] sami; [Concept('characters','postavy')|E], kteří s vámi cestují, tvoří vaše [Concept('entourage','doprovod')|E].\n\nTyto postavy se vám často připojí i na cíli cesty." # todo: CONCEPT CASE
 ra_travel_planning_speed_safety: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_speed_safety_desc: "Při plánování svého [Concept('travel','cestování')|E] je třeba zvážit dva hlavní faktory: [Concept('travel_speed','rychlost')|E] a [Concept('travel_safety','bezpečnost')|E].\n\nZákladní rychlost je 100 %; vysoká rychlost znamená, že dorazíte do cíle rychleji.\n\nBezpečnost kompenzuje případné [Concept('travel_danger','nebezpečí')|E], na které můžete na trase narazit. Pokud máte vysokou [Concept('travel_safety','bezpečnosti')|E], vy a vaše [Concept('entourage','doprovod')|E] můžete projet nebezpečnými oblastmi s menším rizikem." # todo: CONCEPT CASE
 ra_travel_planning_caravan_master: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_caravan_master_desc: "Můžete jmenovat [GetCourtPositionType('travel_leader_court_position').GetName()]; speciální [Concept('court_position','dvorský úřad')|E], která se k vám připojí na všech vašich [Concept('travels','cest')|E].\n\nTato postava má velký vliv na [Concept('travel_speed','rychlost')|E] a [Concept('travel_safety','bezpečnost')|E], takže na delších cestách obvykle chcete, aby někdo tuto pozici zastával." # todo: CONCEPT CASE
 ra_travel_planning_travel_options: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_travel_options_desc: "Pro tuto konkrétní cestu si můžete také vybrat až dvě [Concept('travel_options','možnosti cesty')|E].\n\nCestovní možnosti obvykle stojí [Concept('gold','zlato')|E] a poskytují různé výhody, především pro [Concept('travel_speed','rychlost')|E] a [Concept('travel_safety','bezpečnost')|E].\n\nMnoho možností snižuje [Concept('travel_danger','nebezpečí')|E] pro konkrétní typy [Concept('terrain','terén')|E] na vaší trase. Každý typ nebezpečí na daném místě je zobrazen na mapě unikátní barvou. Jakákoli z těchto nebezpečí, na která můžete narazit, jsou také zobrazena jako ikony na vaší trase." # todo: CONCEPT CASE
 ra_travel_planning_custom_route: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_custom_route_desc: "Nakonec můžete přizpůsobit svou trasu tak, aby se vyhnula [Concept('travel_danger','nebezpečí')|E] na cestě, namísto přímého směru do cíle." # todo: CONCEPT CASE
 ra_travel_planning_conclusion: "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_conclusion_desc: "Před odjezdem zkontrolujte celkový čas cesty a to, že na vaší trase není mnoho šancí na [Concept('travel_danger','nebezpečí')|E].\n\nŠťastnou cestu!" # todo: CONCEPT CASE
 REACTIVE_ADVICE_CREATE_ACCOLADE: "Pocty"
 reactive_advice_create_accolade: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_knights_panel: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_knights_panel_desc: "Nyní můžete jednomu ze svých [Concept('knights','rytířů')|E] udělit [Concept('accolade','vyznamenání')|E]!\n\nKaždý rytíř, který drží [Concept('accolade','vyznamenání')|E], se stane [Concept('acclaimed_knight','uznávaný rytíř')|E] a poskytuje vám a vašim [Concept('armies','armádám')|E] bonusy.\n\n[Concept('accolade','Vyznamenání')|E] zůstane, dokud ji nezničíte, a bude přecházet na budoucí rytíře prostřednictvím [Concept('accolade_succession','nástupnictví vyznamenání')|E]." # todo: CONCEPT CASE
 ra_create_accolade_knights_panel_prompt: "Vyberte nepřiřazenou [Concept('accolade','vyznamenání')|E] (zvýrazněno)" # todo: CONCEPT CASE
 ra_create_accolade_candidates: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_candidates_desc: "Když vytvoříte [Concept('accolade','vyznamenání')|E], vyberete z listu jednoho ze svých platných [Concept('knights','rytířů')|E]." # todo: CONCEPT CASE
 ra_create_accolade_candidates_prompt: "Vyberte kandidáta v seznamu (zvýrazněno)"
 ra_create_accolade_attributes: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_attributes_desc: "Každý [Concept('acclaimed_knight','uznávaný rytíř')|E] má dvě [Concept('accolade_types','atributy vyznamenání')|E] (zvýrazněno), jednu primární a jednu sekundární. Než vytvoříte [Concept('accolade','vyznamenání')|E], jsou tyto atributy zobrazeny u každého kandidáta.\n\nKaždý atribut dává vám a vašim [Concept('armies','armádám')|E] různé bonusy, jakmile [Concept('accolade','vyznamenání')|E] získává [Concept('glory','sláva')|E]. Slávu získává účastí na [GetActivityType( 'activity_tournament' ).GetName()] [Concept('contests','soutěže')|E] a v [Concept('battles','bitvách')|E].\n\nPrimární atribut je vždy součástí [Concept('accolade','vyznamenáním')|E] a nelze jej změnit při [Concept('accolade_succession','nástupnictví vyznamenání')|E]." # todo: CONCEPT CASE
 ra_create_accolade_conclusion: "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_conclusion_desc: "Nyní můžete tento [Concept('accolade','vyznamenání')|E] vytvořit, pokud chcete.\n\nDalší [Concept('accolades','vyznamenání')|E] se stanou dostupnými, jakmile vaše [Concept('culture','kultura')|E] objeví [Concept('innovations','inovace')|E]." # todo: CONCEPT CASE
 reactive_advice_house_unity: "Jednota rodu" # todo: NEW TRANSLATION
 action_reactive_advice_house_unity: "Rada: $reactive_advice_house_unity$"
 action_reactive_advice_house_unity_desc: "Dozvíte se o [Concept('house_unity','jednotu rodu')|E] pro [Concept('clans','klany')|E] a jak ji ovlivnit, abyste získali výhody a přístup k různým [Concept('succession_laws','zákonům nástupnictví')|E]." # todo: CONCEPT CASE
 action_reactive_advice_house_unity_click: "$click_to_open_lesson$"
 ra_house_unity_1: "$reactive_advice_house_unity$"
 ra_house_unity_1_desc: "Jako [Concept('clan','klan')|E] máte přístup k [Concept('house_unity','jednotě rodu')|E]!\n\nHouse Unity představuje stav vnitřních vztahů ve vašem [Concept('house','rodě')|E], které se pohybují od antagonistického po harmonické. Každá úroveň [Concept('house_unity_level','úroveň jednoty rodu')|E] přináší řadu efektů pro všechny členy domu a určuje aktivní [Concept('succession_law','zákon nástupnictví')|E].\n\nVědět, jak ovlivnit House Unity, se ukáže jako užitečné pro dosažení vašich cílů." # todo: CONCEPT CASE
 ra_house_unity_2: "$reactive_advice_house_unity$"
 ra_house_unity_2_desc: "Nejprve musíte vědět, jak vizualizovat [Concept('house_unity','jednota rodu')|E]. K tomu otevřete zobrazení svého [Concept('house','rodu')|E]." # todo: CONCEPT CASE
 ra_house_unity_panel_prompt: "Otevřete zobrazení [Concept('house','rod')|E]" # todo: CONCEPT CASE
 ra_house_unity_3: "$reactive_advice_house_unity$"
 ra_house_unity_3_desc: "Záložka Jednoty rodu obsahuje všechny informace a interakce, které potřebujete, abyste z House Unity vytěžili co nejvíce. Můžete zde vidět své aktuální skóre House Unity, aktuální úroveň a přehled vyšších a nižších úrovní House Unity.\n\nNavíc zde můžete vidět nedávné změny jednoty. To je důležité, protože všichni členové rodu mohou podnikat [Concept('house_unity_unifying_actions','sjednocující činy')|E] nebo [Concept('house_unity_devisive_actions','rozdělující činy')|E], které ovlivní House Unity." # todo: CONCEPT CASE
 ra_house_unity_4: "$reactive_advice_house_unity$"
 ra_house_unity_4_desc: "Jak již bylo zmíněno, každá [Concept('house_unity_level','úroveň jednoty rodu')|E] má své vlastní efekty. V této sekci můžete vidět seznam aktivních efektů.\n\nPamatujte, že tyto efekty platí pro všechny členy [Concept('house','rod')|E]. Mezi efekty najdete i aktivní [Concept('succession_law','zákon nástupnictví')|E] vašeho rodu." # todo: CONCEPT CASE
 ra_house_unity_5: "$reactive_advice_house_unity$"
 ra_house_unity_5_desc: "Nakonec má každý klanový dům přístup k rozhodnutím House Unity. Tato [Concept('decisions','rozhodnutí')|E] udělí různá požehnání pro všechny členy rodu. Nicméně většinou je může vyhlásit pouze [Concept('house_head','hlava rodu')|E].\n\n#weak Můžete se pokusit stát hlavou rodu pomocí akce „Challenge House Head“ proti současnému [Concept('house_head','hlavě rodu')|E].#!" # todo: CONCEPT CASE
 ra_house_unity_6: "$reactive_advice_house_unity$"
 ra_house_unity_6_desc: "Nyní víte vše, co potřebujete o House Unity!\n\nVyužijte tyto znalosti, aby váš rod zanechal trvalou stopu v dějinách."
 action_reactive_advice_tax_collector: "Rada: Výběr daní"
 action_reactive_advice_tax_collector_desc: "Otevřete pro úvod do [Concept('tax_jurisdictions','daňových jurisdikcí')|E] a [Concept('tax_collectors','výběrčí daní')|E]." # todo: CONCEPT CASE
 action_reactive_advice_tax_collector_click: "$click_to_open_lesson$"
 reactive_advice_tax_collector: "Výběr daní"
 ra_tax_collector_1: "$reactive_advice_tax_collector$"
 ra_tax_collector_1_desc: "Máte [Concept('tax_collectors','výběrčí daní')|E]!\n\nPomohou vám vybírat [Concept('gold','zlato')|E] a [Concept('levies','odvedenci')|E] od vašich klanových vazalů. [Concept('tax_collectors','Výběrčí daní')|E] vám také pomohou spravovat [Concept('tax_jurisdictions','daňové jurisdikce')|E] a budou vymáhat daňová nařízení.\n\n#weak Schopnosti (aptitude) vašich taxátorů ovlivní příspěvek, který obdržíte od svých daňových poplatníků.#!" # todo: CONCEPT CASE
 ra_tax_collector_2: "$reactive_advice_tax_collector$"
 ra_tax_collector_2_desc: "Nejdříve musíte vědět, kde najít své [Concept('tax_jurisdictions','daňové jurisdikce')|E], jak jmenovat [Concept('tax_collectors','výběrčí daní')|E] a přiřadit plátce daní." # todo: CONCEPT CASE
 ra_tax_collector_panel_prompt: "Otevřete panel [Concept('tax_jurisdictions','daňové jurisdikce')|E]" # todo: CONCEPT CASE
 ra_tax_collector_3: "$reactive_advice_tax_collector$"
 ra_tax_collector_3_desc: "Vítejte v přehledu [Concept('tax_jurisdiction','daňové jurisdikce')|E]!\n\nZde můžete zobrazit a spravovat vše, co se týká vašich jurisdikcí.\n\nNahoře vidíte, kolik [Concept('tax_collectors','výběrčí daní')|E] jste jmenovali a celkové množství [Concept('gold','zlato')|E] a [Concept('levies','odvedenci')|E], které získáváte od svých daňových poplatníků." # todo: CONCEPT CASE
 ra_tax_collector_4: "$reactive_advice_tax_collector$"
 ra_tax_collector_4_desc: "Toto jsou vaše [Concept('tax_jurisdictions','daňové jurisdikce')|E], kde můžete přiřazovat své klanové vasaly jako plátce daní a vybírat daňové dekrety pro každou jurisdikci. Pro každou daňovou jurisdikci také musíte jmenovat [Concept('tax_collector','výběrčí daní')|E], který ji bude spravovat a vynucovat daňové dekrety.\n\n#weak Jurisdikce s plátci daní, ale bez [Concept('tax_collector','výběrčích daní')|E], bude nezdaněná, což znamená, že z ní neobdržíte žádné [Concept('gold','zlato')|E] ani [Concept('levies','odvedenci')|E].#!" # todo: CONCEPT CASE
 ra_tax_collector_5: "$reactive_advice_tax_collector$"
 ra_tax_collector_5_desc: "Gratulujeme!\n\nZnáte základy výběru daní. Nezapomeňte nastavit Daňové dekrety [Concept('tax_jurisdictions','daňové jurisdikce')|E], aby [Concept('vassal_obligations','vazalské povinnosti')|E] vyhovovaly vašim aktuálním potřebám.\n\nAť váš [Concept('clan','klan')|E] zanechá trvalou stopu v historii." # todo: CONCEPT CASE
 action_reactive_advice_legitimacy: "Rada: Legitimita"
 action_reactive_advice_legitimacy_desc: "Otevřete pro úvod do [Concept('legitimacy','legitimity')|E]." # todo: CONCEPT CASE
 action_reactive_advice_legitimacy_click: "$click_to_open_lesson$"
 reactive_advice_legitimacy: "Legitimita"
 ra_legitimacy_1: "$reactive_advice_legitimacy$"
 ra_legitimacy_1_desc: "[Concept('legitimacy','Legitimita')|E] představuje vaše 'právo vládnout'. Vaši [Concept('vassals','vazaly')|E] vytvářejí [Concept('legitimacy_expectations','očekávání legitimity')|E], které se od vás očekávají.\n\nVyšší $game_concept_legitimacy$ vám přináší řadu výhod, zatímco nízká $game_concept_legitimacy$ ztěžuje, jak snadno vládnete.\n\n#weak Legitimita má 5 [Concept('legitimacy_levels','úrovně legitimity')|E] a jednu spodní úroveň 'Nelegitimní', přičemž určitá část [Concept('legitimacy','legitimity')|E] předchozího vládce je děděna jeho [Concept('heir','dědice')|E]. Legitimita získáváte mnoha různými způsoby, včetně vítězství ve válkách, vytváření [legends|E] nebo účasti na [Concept('activities','aktivity')|E]. Stejně tak ji můžete ztratit prohranými válkami a tituly, nebo nekontrolovanými [epidemics|E], které pustoší zemi.#!" # todo: CONCEPT CASE
 ra_legitimacy_2: "$reactive_advice_legitimacy$"
 ra_legitimacy_2_desc: "Zobrazení [Concept('legitimacy','legitimita')|E] najdete vlevo dole. Obsahuje informace o vaší [Concept('legitimacy_level','úroveň legitimity')|E], vašich [Concept('legitimacy_expectations','očekávání legitimity')|E], kolik [Concept('legitimacy','legitimitu')|E] aktuálně máte a také aktuální efekty všeho výše uvedeného.\n\n#weak Nevýhody a výhody určité hodnoty [Concept('legitimacy','legitimita')|E] zahrnují sankce a bonusy k názorům, záporné i kladné efekty k [Concept('dynasty_prestige','věhlasu')|E], zvýšené a snížené náklady [Concept('casus_belli','casus belli')|E], a proměnlivé prahy pro [Concept('alliances','alianci')|E] a vstup do [Concept('faction','frakcí')|E].#!" # todo: CONCEPT CASE
 action_reactive_advice_epidemics: "Rada: Mory"
 action_reactive_advice_epidemics_desc: "Otevřete pro úvod do [epidemics|E]."
 action_reactive_advice_epidemics_click: "$click_to_open_lesson$"
 reactive_advice_epidemics: "Mory"
 ra_epidemics_panel_prompt: "Otevřete panel [epidemics|E]"
 ra_specific_epidemics_panel_prompt: "Otevřete panel 'Zobrazit mory'"
 ra_epidemics_1: "$reactive_advice_epidemics$"
 ra_epidemics_1_desc: "[epidemics|E] jsou propuknutí nemocí, které se šíří po mapě a ovlivňují jak [Concept('characters','postavy')|E], tak [Concept('holdings','državy')|E]. Když je v oblasti mor, zasažené [Concept('baronies','baronství')|E] mají [infection_rate|E], která určuje, jak silný bude její dopad.\n\nZobrazení [epidemics|E] najdete vpravo dole." # todo: CONCEPT CASE
 ra_epidemics_2: "$reactive_advice_epidemics$"
 ra_epidemics_2_desc: "Každý [epidemic|E] na mapě je rozdělen do sekcí v panelu $reactive_advice_epidemics$.\n\nRealm $reactive_advice_epidemics$ poskytují informace o $reactive_advice_epidemics$ ve vašem království, World $reactive_advice_epidemics$ vás informují o $reactive_advice_epidemics$ v ostatním světě a Nearby $reactive_advice_epidemics$ sledují průběh $reactive_advice_epidemics$, které ještě nejsou ve vašem království, ale jsou natolik blízko, že by v budoucnu mohly představovat hrozbu."
 ra_epidemics_3: "$reactive_advice_epidemics$"
 ra_epidemics_3_desc: "V tomto panelu jsou uloženy relevantní informace o každém moru. Sleduje, jaké má mor závažnosti — Minor, Major nebo Apocalyptic — kdy a kde začal, kolik [Concept('characters','postavy')|E] [Select_CString(ROOT.Char.IsFemale,'zabila','zabil')] a jaké aplikuje modifikátory na postavy i lokace, pro [Concept('baronies','baronství')|E] i [Concept('counties','hrabství')|E].\n\nTlačítko 'Zobrazit mor' vás pustí do podrobností." # todo: CONCEPT CASE
 ra_epidemics_4: "$reactive_advice_epidemics$"
 ra_epidemics_4_desc: "Tento panel obsahuje informace o [infection_rate|E] každé [Concept('barony','baronství')|E] postižené morem. [infection_rate|E] bude postupovat směrem k své maximální hodnotě různými rychlostmi v závislosti na intenzitě moru a lze ji zmírnit pomocí $game_concept_epidemic_resistance$.\n\n#weak To, jak budete $reactive_advice_epidemics$ řešit a zvládat, ovlivní nejen to, jak se vaše [Concept('realm','panství')|E] zotaví a následně prosperuje, ale také kolik [Concept('legitimacy','legitimitu')|E] ztratíte jako vládce.#!" # todo: CONCEPT CASE
 action_reactive_advice_legends: "Rada: Legendy"
 action_reactive_advice_legends_desc: "Otevřete pro úvod do [legends|E]."
 action_reactive_advice_legends_click: "$click_to_open_lesson$"
 reactive_advice_legends: "Legendy"
 ra_legends_panel_prompt: "Otevřete panel [legends|E]"
 ra_legends_view_panel_prompt: "Otevřete panel tvorby legendy"
 ra_legends_1: "$action_reactive_advice_legends$"
 ra_legends_1_desc: "[legends|E] jsou příběhy o slavných skutcích, které [Concept('character','postava')|E] vykonal během svého života. Každá legenda má svůj [legend_type|E]: Legitimizační, Hrdinskou nebo Svatou.\n\nZobrazení [legends|E] najdete vlevo dole." # todo: CONCEPT CASE
 ra_legends_2: "$action_reactive_advice_legends$"
 ra_legends_2_desc: "Každá [legend|E], která je vám k dispozici, je zde viditelná spolu se všemi informacemi.\n\nNahoře jsou [legend_seeds|E], základy legendy. Ty lze získat nebo je v některých případech už vlastnit, pokud vaše postava splní určitá kritéria. Pod nimi jsou World $action_reactive_advice_legends$, které sledují ostatní $action_reactive_advice_legends$ ve světě, které aktivně nepropagujete vy.\n\n#weak 'Promotéři' jsou postavy, které danou legendu aktivně podporují.#!"
 ra_legends_3: "$action_reactive_advice_legends$"
 ra_legends_3_desc: "Informace zahrnuté v panelu $action_reactive_advice_legends$ obsahují základní cenu, údržbu, aktivní efekty a kvalitu legendy.\n\nZvýrazněné je tlačítko používané k výběru legendy ze seznamu."
 ra_legends_4: "$action_reactive_advice_legends$"
 ra_legends_4_desc: "Tento panel obsahuje informace o legendě, kterou se chystáte vytvořit, a zároveň vám dává výběr [Concept('characters','postavy')|E]. Tito jedinci jsou potenciální volby pro [legend_protagonists|E].\n\n#weak Zahájení legendy spustí Legendární kroniku, během níž můžete zvyšovat [legend_quality|E] nebo legendu dokončit.#!" # todo: CONCEPT CASE
 action_reactive_advice_plague_resistance: "Rada: Odolnost proti moru"
 action_reactive_advice_plague_resistance_desc: "Otevřete pro úvod do [epidemic_resistance|E]."
 action_reactive_advice_plague_resistance_click: "$click_to_open_lesson$"
 reactive_advice_plague_resistance: "Odolnost proti moru"
 ra_plague_resistance_1: "$reactive_advice_plague_resistance$"
 ra_plague_resistance_1_desc: "Při řešení morů máte několik možností, jak omezit jejich šíření po vašich zemích.\n\nHlavním řídícím faktorem je [epidemic_resistance|E]. Čím vyšší odolnost proti moru mají vaše [Concept('baronies','baronství')|E] a [Concept('counties','hrabství')|E], tím lépe dokážete mor zadržet.\n\n#weak I když můžete mor bojovat, je důležité si uvědomit, že je nepravděpodobné, že ho zcela zastavíte. Připravte se na to, že se větší mory mohou rozšířit i přes vaše nejlepší snahy.#!" # todo: CONCEPT CASE
 ra_plague_resistance_2: "$reactive_advice_plague_resistance$"
 ra_plague_resistance_2_desc: "$reactive_advice_plague_resistance$ lze zvýšit několika způsoby. Budovy jako $building_type_hospices_01$ a $building_type_charnel_grounds_01$ dávají vrozené bonusy k $reactive_advice_plague_resistance$ pro [Concept('county','hrabství')|E] nebo [Concept('barony','baronství')|E], ve kterých jsou postaveny.\n\nDalší, méně trvalé možnosti zahrnují [Concept('court_position_tasks','úkoly dvorských úřadů')|E] prováděné $court_physician_court_position$, [Concept('decisions','rozhodnutí')|E] nebo události." # todo: CONCEPT CASE
 ra_plague_resistance_3: "$reactive_advice_plague_resistance$"
 ra_plague_resistance_3_desc: "S růstem $reactive_advice_plague_resistance$ se snižuje [infection_rate|E] postižených [Concept('baronies','baronství')|E].\n\nI když je nepravděpodobné, že velký mor úplně vymýtíte jen opatřeními tohoto druhu, snížení [infection_rate|E] pomůže omezit obecné zkázy ve vašem [Concept('realm','panství')|E]." # todo: CONCEPT CASE
 action_reactive_advice_tutorial_schemes: "Rada: $game_concept_schemes$"
 action_reactive_advice_tutorial_schemes_desc: "Otevřete pro úvod do [Concept('schemes','intrik')|e]." # todo: CONCEPT CASE
 action_reactive_advice_tutorial_schemes_click: "$click_to_open_lesson$"
 reactive_advice_tutorial_schemes: "$ra_tutorial_schemes_1$"
 ra_tutorial_schemes_1: "Intriky" # todo: CONCEPT CASE
 ra_tutorial_schemes_1_desc: "Právě jste zahájili [Concept('scheme','intrika')|E]! $game_concept_schemes$ jsou dlouhodobé cíle zaměřené na jinou postavu. Mohou mít nepřátelské cíle, jako se pokusit [GetScheme('murder').GetTypeName] nebo [GetScheme('abduct').GetTypeName] váš cíl, nebo být přívětivější, například [GetScheme('befriend').GetTypeName] $game_concept_scheme$." # todo: CONCEPT CASE
 ra_tutorial_schemes_2: "Intriky" # todo: CONCEPT CASE
 ra_tutorial_schemes_2_desc: "Právě jste zahájili [Concept('scheme','intrika')|E]! $game_concept_schemes$ jsou dlouhodobé cíle zaměřené na jinou postavu. Mohou mít nepřátelské cíle, jako se pokusit [GetScheme('murder').GetTypeName] nebo [GetScheme('abduct').GetTypeName] váš cíl, nebo být přívětivější, například [GetScheme('befriend').GetTypeName] $game_concept_scheme$." # todo: CONCEPT CASE
 ra_tutorial_schemes_3: "Intriky" # todo: CONCEPT CASE
 ra_tutorial_schemes_3_desc: "Zde uvidíte všechny své aktivní schémata. Můžete mít současně jedno [Concept('personal_scheme','osobní intrika')|e] a jedno [Concept('hostile_scheme','nepřátelská intrika')|e].\n\n#TUT Používejte schémata kdykoli chcete, ale mějte na paměti, že vaše postava bude v některých schématech lepší nebo horší v závislosti na svých [Concept('traits','rysy')|e] a [Concept('skills','dovednosti')|e]. Některé [Concept('lifestyle','životní styl')|e] [Concept('perks','talenty')|e] mohou vaší postavě odemknout další $game_concept_schemes$.#!" # todo: CONCEPT CASE
 action_reactive_advice_favorite_child: "Rada: Oblíbené dítě"
 action_reactive_advice_favorite_child_desc: "Nyní můžete zvolit [Concept('favorite_child','oblíbené dítě')|E]. Otevřete toto pro více informací o tom, jak ho vybrat." # todo: CONCEPT CASE
 action_reactive_advice_favorite_child_click: "$click_to_open_lesson$"
 reactive_advice_favorite_child: "Oblíbené dítě"
 ra_favorite_child_1: "$reactive_advice_favorite_child$"
 ra_favorite_child_1_desc: "Nyní můžete vybrat, kdo je vaše [Concept('favorite_child','oblíbené dítě')|E]. To znamená, že budou mít na vás vyšší [Concept('opinion','mínění')|E] a po vaší smrti můžete pokračovat ve svém odkazu jako oni, místo jako váš dědic.\n\nVaše oblíbené dítě může být:\n$BULLET_WITH_TAB$Děti\n$BULLET_WITH_TAB$Vnoučata\n$BULLET_WITH_TAB$Pravnukové\nPokud jsou v rámci vaší [Concept('dynasty','dynastii')|E]." # todo: CONCEPT CASE
 ra_favorite_child_1_prompt: "Otevřete zobrazení vaší postavy (zvýrazněno)"
 ra_favorite_child_2: "$reactive_advice_favorite_child$"
 ra_favorite_child_2_desc: "Ve zobrazení postavy najděte dítě, které chcete označit jako oblíbené.\n\nKlikněte na dítě pravým tlačítkem pro interakci a hledejte možnost Zvolit oblíbené dítě. Nebo klikněte na děti z vašeho seznamu dětí.\n\nPamatujte, že volba $game_concept_favorite_child$ také znamená, že ostatní děti mohou mít na vás nižší názory."
 ra_favorite_child_2_prompt: "Klikněte pravým tlačítkem na jedno z vašich dětí a zobrazte dostupné interakce (zvýrazněno)"
 ra_favorite_child_3: "$reactive_advice_favorite_child$"
 ra_favorite_child_3_desc: "Po výběru oblíbeného dítěte se na jeho portrétu objeví ikona. A i když nejsou vaším dědicem, bude možné po vaší smrti pokračovat jako oni.\n\nPokud budete chtít oblíbené dítě někdy změnit, vraťte se do zobrazení postavy a vyberte jiné."
 action_reactive_advice_army_automation: "Rada: $ARMY_AUTOMATION_FEATURE_NAME$"
 action_reactive_advice_army_automation_desc: "Pokud nechcete ručně ovládat každou [Concept('war','válku')|E], můžete zapnout $ARMY_AUTOMATION_FEATURE_NAME$. Otevřete toto a naučte se, jak na to." # todo: CONCEPT CASE
