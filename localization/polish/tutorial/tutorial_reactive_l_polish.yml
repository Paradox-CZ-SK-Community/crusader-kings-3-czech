 ra_natural_disasters_1_desc: "Ach ne! [Concept('natural_disaster','přírodní pohroma')|e] zasáhla vaše [Concept('realm','panství')|e].\n\nPodívejme se, co s tím můžete udělat." # todo: NEW TRANSLATION # todo: CONCEPT CASE
