 ra_women_in_china: "Ženy v Číně" # todo: NEW TRANSLATION
 ra_women_in_china_desc: "Aby žena v Číně mohla být [Concept('governor','guvernér')|e], musíte změnit Gender Laws [Concept('hegemony','hegemonie')|e]. K tomu se musíte nejprve stát [Concept('hegemon','hegemon')|e].\n\nPokud vás taková zkušenost zajímá, doporučujeme buď změnit pravidla týkající se Gender Law při nastavení hry, nebo si vytvořit vlastní postavu, která bude $game_concept_hegemon$ na obrazovce záložek.„" # todo: NEW TRANSLATION # todo: CONCEPT CASE
