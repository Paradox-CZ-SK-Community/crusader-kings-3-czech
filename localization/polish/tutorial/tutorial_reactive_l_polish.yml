 ra_gp_1: "Velké projekty" # todo: NEW TRANSLATION
 ra_gp_1_desc: "Můžete zahájit nebo přispět k [Concept('great_project','velkému projektu')|e]! Pojďme si o nich chvíli promluvit." # todo: NEW TRANSLATION # todo: CONCEPT CASE
