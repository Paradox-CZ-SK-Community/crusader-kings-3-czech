 ra_admin_gov_troops_1: "Vojsko v administrativní vládě"
 ra_admin_gov_troops_1b: "Vojsko v administrativní vládě"
 ra_admin_gov_troops_1_desc: "@ra_admin_troops_1! V [Concept('administrative_government','administrativní vládě')|El] funguje správa vojska a jednotek jinak než u jiných typů $game_concept_government$.\n\nI když nadále máte přístup ke svým vlastním jednotkám a plnou kontrolu nad nimi, máte také přístup k $TUTORIAL_PROVINCIAL_ARMIES$. V rámci $game_concept_administrative_government$ může mít každá [Concept('province','provincie')|El] vlastní [Concept('army','armádu')|El], která je majetkem daného [Concept('title','titulu')|El].\n\n[Concept('governors','Guvernéři')|E] zastávají úlohu civilních i vojenských úředníků, zatímco [Concept('top_liege','nejvyšší lenní pán')|El] má možnost spravovat jednotky $game_concept_governors$, převzít nad nimi kontrolu nebo je přidělit jiným $game_concept_governors$ napříč [Concept('realm','panstvím')|El]."
 ra_admin_gov_troops_1_prompt: "Otevřete záložku $TUTORIAL_PROVINCIAL_ARMIES_NO_TOOLTIP$ (zvýrazněnou)"
 ra_admin_gov_troops_2: "Vojsko v administrativní vládě"
 ra_admin_gov_troops_2b: "Vojsko v administrativní vládě"
 ra_admin_gov_troops_2_desc: "[Concept('governors','Guvernéři')|E] mohou vytvářet [Concept('men_at_arms','ozbrojence')|El] jako součást $game_concept_governorship$, za které odpovídají. Tyto jednotky náleží [Concept('title','titulu')|El] a mohou si je vypůjčit jiní $game_concept_governors$ v [Concept('realm','panství')|El].\n\n[Concept('top_liege','Nejvyšší lenní pán')|E] má k dispozici $TUTORIAL_PROVINCIAL_ARMIES$ a může spravovat jednotky $game_concept_governors$. Může nad nimi převzít kontrolu ve svých [Concept('wars','válkách')|El], nebo je znovu přidělit těm $game_concept_governors$, kteří je mohou potřebovat.\n\nTo mu umožňuje je povolat a využít, čímž zlepšuje obranu podél hranic $game_concept_realm$."
 ra_admin_gov_troops_2_prompt: "Prohlédněte si [GetPlayer.Custom('GetProvincialArmyConceptNoTooltip')]"
 ra_admin_gov_troops_3: "Získávání dalších armád"
 ra_admin_gov_troops_3_desc: "Jako [Concept('governor','guvernér')|El] můžete využít svůj [Concept('influence','vliv')|El] a povolat si na pomoc $game_concept_army$ z jiné [Concept('province','provincie')|El].\n\n[Concept('top_liege','Nejvyšší lenní pán')|E] může kteréhokoli $game_concept_governor$ přinutit, aby svou $game_concept_army$ přeřadil jinam, nebo nad ní sám převzít kontrolu."
 ra_admin_gov_troops_4: "Podrobnosti o armádě"
 ra_admin_gov_troops_4_desc: "Pokud [Concept('governor','guvernér')|El] povolá jednotky ve [Concept('war','válce')|El], [Concept('top_liege','nejvyšší lenní pán')|El] je nemůže znovu přidělit, dokud nebudou rozpuštěny.\n\nV případě vzpour $game_concept_governors$ proti [Concept('liege','lennímu pánovi')|El] si $game_concept_governor$ bere zpět všechny jednotky pocházející z jeho [Concept('governorship','guvernérství')|El].\n\nSledujte situaci v celém panství, abyste jejich využití optimalizovali."
 ra_admin_gov_troops_5: "Na cestě k moci"
 ra_admin_gov_troops_5_desc: "@ra_admin_troops_5! Přestože [Concept('administrative','administrativní')|El] [Concept('realm','panství')|El] pohání politické jednání a intriky, silné a dobře spravované vojsko nejen posílí vaši obranu, ale také vám pomůže v diplomatických snahách.\n\nVojenská moc je koneckonců jen jednou z mnoha cest k moci..."
 action_reactive_advice_laamp_contract_move: "$open_tutorial_lesson$ Hledání zakázek"
 action_reactive_advice_laamp_contract_move_desc: "Chybí ti v okolí příležitosti k [Concept('task_contract','zakázkám')|El]? Otevři tuto lekci a seznámíš se s hledáním nových zakázek."
 action_reactive_advice_laamp_contract_move_click: "$click_to_open_lesson$"
 reactive_advice_laamp_contract_move: "$ra_laamp_contract_move_1$"
 ra_laamp_contract_move_1: "Hledání zakázek"
 ra_laamp_contract_move_1_desc: "Pokud ve tvém okolí došla práce nebo hledáš zajímavější zaměstnání, přesunutí tvého [Concept('camp','tábora')|El] je nejsnazší způsob, jak najít spoustu čerstvých [Concept('task_contracts','zakázek')|El].\n\nMusíš [Concept('travel','cestovat')|El] dostatečně daleko od místa, kde stával tvůj starý tábor, aby sis po příjezdu zajistil nové příležitosti."
 ra_domicile_camp_task: "Přejdi do okna tábora"
 ra_laamp_contract_move_2: "Přesun tábora"
 ra_laamp_contract_move_2_desc: "Zde je příklad cíle ležícího v přiměřené vzdálenosti od současné polohy tvého [Concept('camp','tábora')|El].\n\n[Concept('travel','Cestu')|E] můžeš naplánovat přímo ze zobrazení [Concept('county','hrabství')|El] do libovolného vybraného [Concept('barony','baronství')|El] v daném hrabství.\n\n#weak Poznámka: Cestování tábora můžeš zahájit také z okna tábora pomocí tlačítka Přesunout domicil ve spodní části.#!"
 ra_domicile_travel_task: "Přejdi do zobrazení $relocate_camp_to_interaction$"
 ra_laamp_contract_move_3: "Cestování s táborem"
 ra_laamp_contract_move_3_desc: "[Concept('traveling','Cestování')|E] s tvým [Concept('camp','táborem')|El] funguje stejně jako běžné cestování, ale bereš s sebou všechna [Concept('camp_buildings','vylepšení tábora')|El] i [Concept('followers','družiníky')|El] a musíš spotřebovávat [Concept('provisions','proviant')|El]."
 ra_domicile_depart_task: "Zahaj cestování tábora"
 ra_laamp_contract_move_4: "$ra_laamp_contract_move_3$"
 ra_laamp_contract_move_4_desc: "$ra_laamp_contract_move_3_desc$"
 ra_domicile_arrive_task: "Dokonči cestování tábora"
 ra_laamp_contract_move_5: "Nové zakázky"
 ra_laamp_contract_move_5_desc: "Nyní jsi dorazil a v oblasti ti bude k dispozici několik nových [Concept('task_contracts','zakázek')|El]!\n\nPamatuj, že svůj [Concept('camp','tábor')|El] můžeš kdykoli přesunout, abys našel nové [Concept('task_contracts','zakázky')|El], a nové příležitosti se objeví, pokud budeš [Concept('travel','cestovat')|El] dostatečně daleko — dobrým minimálním pravidlem je vzdálenost alespoň dvou [Concept('de_jure','de iure')|El] [Concept('duchies','vévodství')|El] od tvého starého tábořiště."
 reactive_advice_tutorial_war: "Válka"
 reactive_advice_lesson_army_movement: "$lesson_army_movement$"
 reactive_advice_lesson_army_purpose: "Bitvy a obléhání"
 reactive_advice_lesson_battle_mechanics: "$lesson_battle_mechanics$"
 reactive_advice_lesson_siege_mechanics: "$lesson_siege_mechanics$"
 reactive_advice_lesson_warscore: "$lesson_warscore$"
 reactive_advice_lesson_winning_wars: "$lesson_winning_wars$"
 reactive_advice_lesson_losing_wars: "$lesson_losing_wars$"
 reactive_advice_migration: "Migrace"
 action_reactive_advice_migration: "Rada: $reactive_advice_migration$"
 action_reactive_advice_migration_desc: "Jako [Concept('nomad','nomád')|El] ve [Concept('the_great_steppe','Velké stepi')|El] můžeš migrovat do nových zemí. Otevři tuto lekci a dozvíš se více o migraci."
 action_reactive_advice_migration_click: "$click_to_open_lesson$"
 ra_migration_1: "$reactive_advice_migration$"
 ra_migration_1_desc: "Když hraješ za [Concept('nomad','nomáda')|El] ve [Concept('the_great_steppe','Velké stepi')|El], máš možnost [Concept('migrate','migrovat')|El].\nMigrace je pro nomády důležitá, protože je skvělým způsobem, jak najít nové země, kde se tvé [Concept('herd','stádo')|El] může pást a růst.\n\nStádo představuje tvůj lid a jeho zvířata a tvé stádo potřebuje země s dobrou [Concept('county_fertility','úrodností hrabství')|El], aby mělo dostatek potravy.\nPodívejme se, jak ve stepi najít nejlepší místa, jejichž úrodnost prospěje tobě i tvému [Concept('realm','panství')|El]."
 ra_migration_1_prompt: "Klikni na tlačítko migrace (zvýrazněné)"
 ra_migration_1b: "$ra_migration_1$"
 ra_migration_2: "$reactive_advice_migration$"
 ra_migration_2_desc: "Volba nového místa pro tebe a tvé [Concept('herd','stádo')|El] by měla vycházet hlavně z [Concept('county_fertility','úrodnosti hrabství')|El]. Úrodnost země se měří na stupnici od 0 do 100 a bude se postupně vyčerpávat, jak budeš dané země obývat. Jakmile se vyčerpá, musíš [Concept('migrate','migrovat')|El] na nové místo, abys mohl dále růst."
 ra_migration_2_prompt: "Klikni na mapový režim a zobraz režim mapy úrodnosti (zvýrazněný)"
 ra_migration_3: "$reactive_advice_migration$"
 ra_migration_3_desc: "Vzdálenost, na kterou můžeš [Concept('migrate','migrovat')|El], závisí na tvých [Concept('title_tiers','úrovních titulů')|El] a zákonu [Concept('dominance','dominance')|El], který momentálně uplatňuješ. Panství s velkou doménou a vysokou dominancí budou mít při migraci jiné potřeby a v určité chvíli už kvůli růstu tvého [Concept('herd','stáda')|El] nemusí potřebovat migrovat vůbec. Chceš-li vybrat místo, na které bys případně chtěl migrovat, klikni na mapě na [Concept('de_jure','de iure')|El] titul."
 ra_migration_3_prompt: "Klikni na libovolné místo v dosahu na mapě"
 ra_migration_4: "$reactive_advice_migration$"
 ra_migration_4_desc: "V závislosti na zvoleném místě uvidíš na mapě značky informující o konkrétní [Concept('county_fertility','úrodnosti hrabství')|El], nebo součet celé [Concept('domain_fertility','úrodnosti domény')|El] vybraného [Concept('de_jure','de iure')|El] titulu."
 ra_migration_5: "$reactive_advice_migration$"
 ra_migration_5_desc: "Vybrané místo tvé [Concept('migration','migrace')|El] vždy drží alespoň jeden [Concept('nomad','nomád')|El] nebo [Concept('herder','pastevec')|El], s nímž budeš muset vyjednat povolení vstupu. Můžeš jim nabídnout [Concept('herd','stádo')|El], [Concept('gold','zlato')|El], nebo použít [Concept('hook','páku')|El], abys je přesvědčil přijmout tvůj návrh na migraci do jejich oblasti."
 ra_migration_6: "$reactive_advice_migration$ (přijetí vyjednávání)"
 ra_migration_6_desc: "V cílové oblasti tvé migrace může být několik [Concept('nomads','nomádů')|El]. Pokud bys [Concept('migrate','migroval')|El] nepřátelským způsobem, zareagovali by všichni, ale pokud přesvědčíš nejsilnější postavu v oblasti, že se tam přesouváš, přivítají tě všichni.\n\nPokud bude vyjednávání o migraci přijato, opustíš svůj současný titul a možná i své [Concept('subjects','subjekty')|El]."
 ra_migration_7: "$reactive_advice_migration$ (odmítnuté vyjednávání)"
 ra_migration_7_desc: "Pokud [Concept('nomad','nomád')|El] s největším [Concept('herd','stádem')|El] v oblasti tvůj návrh nepřijme, budeš mu a všem ostatním nomádům obývajícím zvolené místo muset vyhlásit [Concept('war','válku')|El]. V takových případech uvidíš v okně celkovou sílu stáda.\n\nStejně jako při přijetí vyjednávání povede odmítnutý návrh k tomu, že opustíš svůj současný [Concept('title','titul')|El] a možná i své [Concept('subjects','subjekty')|El]. Budeš také považován za [Concept('unlanded','bezzemka')|El], což znamená, že nemáš žádnou [Concept('county_fertility','úrodnost hrabství')|El], a tvé stádo proto nebude růst.\n\nBude pro tebe nanejvýš důležité buď válku vyhrát, nebo si poté najít jiné místo, kam bys se svým stádem mohl migrovat."
 ra_migration_8: "$reactive_advice_migration$"
 ra_migration_8_desc: "Pokud s [Concept('migration','migrací')|El] vše dopadne dobře, získáš spoustu nových zemí k pastvě a nové možnosti, jak řešit [Concept('settlement_issue','záležitost osídlení')|El], která ti dá příležitost zvládat konflikty a zvýšit místní [Concept('county_control','kontrolu hrabství')|El] v nové [Concept('domain','doméně')|El].\n\nZemě ve [Concept('the_great_steppe','Velké stepi')|El] často mění majitele, proto dobře vyvažuj svou [Concept('dread','hrůzu')|El] s [Concept('opinion','míněním')|El], aby sis nechal otevřené všechny možnosti. Jeden ztracený titul pro [Concept('nomad','nomáda')|El] znamená, že tři další jsou na dosah, dokud budeš dál rozvíjet své [Concept('herd','stádo')|El] a [Concept('dominance','dominanci')|El]."
 reactive_advice_great_steppe: "Velká step"
 action_reactive_advice_great_steppe: "Rada: $reactive_advice_great_steppe$"
 action_reactive_advice_great_steppe_desc: "Velká step je situace, v níž musíš brát v úvahu úrodnost zemí. Otevři tuto lekci a dozvíš se více o tom, co ovlivňuje."
 action_reactive_advice_great_steppe_click: "$click_to_open_lesson$"
 ra_great_steppe_1: "$reactive_advice_great_steppe$"
 ra_great_steppe_1_desc: "Vítej ve [Concept('the_great_steppe','Velké stepi')|El]!\n\nPři hraní za [GetGovernment( 'nomad_government' ).GetName] [Concept('ruler','vládce')|El] je tvým hlavním úkolem zajistit, aby tvé [Concept('herd','stádo')|El] mohlo růst. Stádo roste díky úrodným zemím, kde se může pást, takže se budeš muset přesouvat a hledat bohaté pastviny, na nichž se tobě i tvému stádu bude dařit.\n\nVe stepní oblasti vládnou nomádi, kde se budeš účastnit [Concept('situation','situace')|El]. Step je rozdělena do tří oblastí, v nichž hraje hlavní roli [Concept('county_fertility','úrodnost hrabství')|El] dané země."
 ra_great_steppe_1_prompt: "Pokračuj kliknutím na tlačítko situací (zvýrazněné)"
 ra_great_steppe_1b: "$reactive_advice_great_steppe$"
 ra_great_steppe_2: "$reactive_advice_great_steppe$"
 ra_great_steppe_2_desc: "Každou ze tří oblastí ovlivní [Concept('steppe_season','stepní období')|El]. Tato období nejsou obyčejnou zimou nebo létem, ale dlouhodobě působí na [Concept('county_fertility','úrodnost hrabství')|El] dané země.\n\nKde a jak tě tyto účinky ovlivní, uvidíš prostřednictvím účinků období. Například život v oblasti s hojnou pastvou bude mít vliv na úrodnost, na níž se tvé [Concept('herd','stádo')|El] pase, ale ovlivní také mínění lidí, kteří tě následují."
 ra_great_steppe_3: "$reactive_advice_great_steppe$"
 ra_great_steppe_3_desc: "Abys mohl plánovat dopředu, můžeš využít pomoc svého [GetCourtPositionType('court_astrologer_court_position').GetName()]. Ten předpoví pravděpodobnost, že v oblasti nastanou dvě možná příští období.\n\nDíky těmto informacím se můžeš rozhodnout, zda bude nejlepší zůstat na místě, nebo se pokusit [Concept('migrate','migrovat')|El] do sousední oblasti.\n\nČím déle dokážeš zůstat v úrodné zemi, tím větší bude tvé [Concept('herd','stádo')|El] a tím spokojenější bude tvůj lid."
 ra_great_steppe_4: "$reactive_advice_great_steppe$"
 ra_great_steppe_4_desc: "Přehled o tom, jak si vedou ostatní [Concept('nomads','nomádi')|El] ve [Concept('the_great_steppe','Velké stepi')|El], najdeš ve spodní části panelu. Nomád s největším [Concept('herd','stádem')|El] drží titul [Concept('gurkhan','Gürkhana')|El] a síla jeho stáda může být buď největší hrozbou, nebo největším spojencem, na něhož ve stepi narazíš. Pokud tento titul držíš, můžeš si potenciálně také zvýšit [Concept('dominance','dominanci')|El] v panelu panství až na pátou a poslední úroveň, neomezenou dominanci.\n\nSíla stáda se používá během válek a nájezdů, ale v podobě [Concept('horde','nomádské hordy')|El]. Horda je část tvého stáda způsobilá k boji, takže si ji představ jako své koně, velbloudy a lidi schopné držet luk a šíp, zatímco zbytek stáda tvoří ovce, krávy, děti a podobně."
 ra_great_steppe_5: "$reactive_advice_great_steppe$"
 ra_great_steppe_5_desc: "Další oblasti si v tomto zobrazení můžeš prohlédnout tak, že na ně klikneš, ale ovlivňuje tě ta, v níž se právě nacházíš.\n\nA nyní — jsi připraven vést své stádo v časech hojnosti i zkoušek? Hledání nových zemí prostřednictvím [Concept('war','války')|El] nebo [Concept('migrating','migrace')|El] je pro silného [GetGovernment( 'nomad_government' ).GetName] [Concept('ruler','vládce')|El] vždy možností, jak svému lidu ukázat cestu k bohatým zemím, zlatému jablku stepi."
 reactive_advice_kurultai: "Kurultajská rada"
 action_reactive_advice_kurultai: "Rada: $reactive_advice_kurultai$"
 action_reactive_advice_kurultai_desc: "Otevři tuto lekci a dozvíš se více o nomádské radě, kurultaji."
 action_reactive_advice_kurultai_click: "$click_to_open_lesson$"
 ra_kurultai_1: "$reactive_advice_kurultai$"
 ra_kurultai_1_desc: "Jako vládce ve [Concept('the_great_steppe','Velké stepi')|El] máš [Concept('kurultai','kurultaj')|El] jako svou [Concept('council','radu')|El]. \n\nMožná už znáš fungování rady, ale při hraní za [Concept('nomad','nomáda')|El] budeš mít nový typ správců, kteří se více zaměřují na podporu růstu [Concept('county_fertility','úrodnosti hrabství')|El] nebo tvého [Concept('herd','stáda')|El]."
 ra_kurultai_1_prompt: "Pokračuj kliknutím na panel rady (zvýrazněný)"
 ra_kurultai_1b: "$ra_kurultai_1$"
 ra_kurultai_2: "$reactive_advice_kurultai$"
 ra_kurultai_2_desc: "Ve své [Concept('council','radě')|El] můžeš mít 4 členy [Concept('kurultai','kurultaje')|El], spolu se svou [Concept('spouse','chotí')|El] a [Concept('spymaster','špehmistrem')|El]. Kurultaj může mít různé úkoly navázané na různé [Concept('skills','dovednosti')|El]; například Správa úrodnosti bude vycházet ze [Concept('stewardship','správcovství')|El] tvého člena kurultaje. Pokud máš kurultaj přiřazený, můžeš kliknout na tlačítko v levém dolním rohu a úkol vyměnit."
 ra_kurultai_3: "$reactive_advice_kurultai$"
 ra_kurultai_3_desc: "[Concept('kurultai','Kurultaj')|E] bude pracovat na svých přiřazených úkolech, ale jeho největší vliv se projeví na [Concept('succession','nástupnictví')|El] tvého [Concept('realm','panství')|El].\n\nKaždá postava ve [Concept('the_great_steppe','Velké stepi')|El] může být [Concept('obedient','poslušná')|El] jednomu [Concept('ruler','vládci')|El] a poslušnost je velmi důležitá zejména u členů tvého kurultaje a jejich slova v tom, kdo se stane tvým [Concept('heir','dědicem')|El]."
 ra_kurultai_3_prompt: "Pokračuj kliknutím na záložku panství (zvýrazněnou)"
 ra_kurultai_4: "$reactive_advice_kurultai$"
 ra_kurultai_4_desc: "V horní části tohoto panelu vidíš, zda je tvé [Concept('succession','nástupnictví')|El] považováno za stabilní, nebo chaotické. To ti ukáže, zda tvůj [Concept('heir','dědic')|El] zdědí celé tvé [Concept('realm','panství')|El], nebo zda bude rozděleno mezi jiné, mocnější postavy."
 ra_kurultai_4_prompt: "Pokračuj kliknutím na záložku nástupnictví (zvýrazněnou)"
 ra_kurultai_5: "$reactive_advice_kurultai$"
 ra_kurultai_5_desc: "Ve zvýrazněné liště získáš představu o tom, zda tvůj [Concept('kurultai','kurultaj')|El] a nejstarší děti [Concept('succession','nástupnictví')|El] schválí, nebo se proti němu postaví.\n\nAby ses dostal ke stabilnímu nástupnictví, musíš si udržet kurultaj [Concept('obedient','poslušný')|El], ale také potřebuješ, aby ti [Concept('steppe_seasons','stepní období')|El] hrála do karet. Pokud současné období působí na tvé země nepříznivě, jako například zud, tvůj lid si bude myslet, že jsi trestán, a začne zpochybňovat tvou vládu i rozhodnutí o tom, kdo po tobě nastoupí. \n\nChceš-li si udržet kontrolu nad nástupnictvím, udržuj svůj lid poslušný a [Concept('migrate','migruj')|El] do zemí, které ti přejí."
 reactive_advice_tributaries: "Tributáři"
 action_reactive_advice_tributaries: "Rada: $reactive_advice_tributaries$"
 action_reactive_advice_tributaries_desc: "Tributáři jsou typem subjektu, který může vládce mít. Otevři tuto lekci a získáš úvod do toho, co tributáři jsou."
 action_reactive_advice_tributaries_click: "$click_to_open_lesson$"
 ra_tributaries_1: "$reactive_advice_tributaries$"
 ra_tributaries_1_desc: "[Concept('tributaries','Tributáři')|E] jsou typem [Concept('subject','subjektu')|El], tedy vztahem mezi dvěma [Concept('rulers','vládci')|El], v němž je uzavřena dohoda o [Concept('truce','příměří')|El] výměnou za pravidelnou platbu. Jakmile je dohoda uzavřena, tributář poskytuje druhé straně, svému [Concept('suzerain','suzerénovi')|El], buď [Concept('herd','stádo')|El], [Concept('taxes','daně')|El], nebo [Concept('prestige','prestiž')|El]."
 ra_tributaries_1_prompt: "Pokračuj kliknutím na panel panství (zvýrazněný)"
 ra_tributaries_2: "$reactive_advice_tributaries$"
 ra_tributaries_2_desc: "Ve srovnání s obvyklým typem [Concept('subject','subjektu')|El], tedy [Concept('vassals','vazaly')|El], mají [Concept('tributaries','tributáři')|El] vůči svému [Concept('suzerain','suzerénovi')|El] o něco větší svobodu. Mohou se osvobodit, pokud jejich vlastní požadavky na vůdce nejsou splněny, a hledat štěstí jinde."
 ra_tributaries_2_prompt: "Pokračuj kliknutím na záložku subjektů (zvýrazněnou)"
 ra_tributaries_3: "$reactive_advice_tributaries$"
 ra_tributaries_3_desc: "Všechny typy [Concept('subjects','subjektů')|El] se zobrazí v panelu panství. V seznamu subjektů uvidíš šanci svých [Concept('tributaries','tributářů')|El], že se budou chtít osvobodit, a zvláštní [Concept('tributary_contract','tributární smlouvu')|El], v níž jako [Concept('suzerain','suzerén')|El] můžeš například zvýšit nebo snížit jejich platby či válečnou podporu, kterou si budete poskytovat v nadcházejících sporech."
 ra_tributaries_4: "$reactive_advice_tributaries$"
 ra_tributaries_4_desc: "Protože [Concept('migration','migrace')|El] je pro [Concept('nomads','nomády')|El] běžným jednáním, vzdálení se od zemí tvých [Concept('tributaries','tributářů')|El] má velký vliv na jejich ochotu zůstat tvým tributem. Pokud nemohou být svědky tvé velikosti, brzy začnou hledat ochranu a příměří u jiných [Concept('rulers','vládců')|El] poblíž."
 ra_tributaries_5: "$reactive_advice_tributaries$"
 ra_tributaries_5_desc: "Pokud máš roli [Concept('tributary','tributáře')|El] ty sám, může ti to umožnit rozvíjet tvé [Concept('herd','stádo')|El] v míru pod ochranou většího [Concept('suzerain','suzeréna')|El], ale moc ve [Concept('the_great_steppe','Velké stepi')|El] může rychle přecházet z ruky do ruky. Dbej na to, abyste si ty a ti, které považuješ za přátele, v nouzi pomáhali růst, ale neboj se osvobodit a přidat se na stranu většího chána, když si to situace vyžádá."
 reactive_advice_meritocratic_governor: "Guvernér"
 action_reactive_advice_meritocratic_governor: "Rada: $reactive_advice_meritocratic_governor$"
 action_reactive_advice_meritocratic_governor_desc: "Jako $game_concept_governor$ máš zvláštní pravomoci, ale také odpovědnost. Otevři tuto lekci a získáš úvod do toho, co znamená být $game_concept_governor$."
 action_reactive_advice_meritocratic_governor_click: "$click_to_open_lesson$"
 ra_merit_governor_intro: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_intro_desc: "Zastáváš úřad [Concept('governor','guvernéra')|El]!\n\nV této vážené úřednické roli máš přístup ke zdrojům vlády, ale musíš je využívat rozumně."
 ra_merit_governor_advancing: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_advancing_desc: "Každý [Concept('governor','guvernér')|El] vládne [Concept('province','provincii')|El] určité [Concept('title_tier','úrovně')|El].\n\nOd nejnižší po nejvyšší to jsou:\n$EFFECT_LIST_BULLET$$county_celestial_chinese_vassal$ #weak (titul [Concept('county','hrabství')|El])#!\n$EFFECT_LIST_BULLET$$duchy_celestial_chinese_vassal$ #weak (titul [Concept('duchy','vévodství')|El])#!\n$EFFECT_LIST_BULLET$$kingdom_celestial_chinese_vassal$ #weak (titul [Concept('kingdom','království')|El])#!\n\nAbys postoupil v hierarchii a dosáhl vyšší $game_concept_title_tier$, musíš zvýšit svou [Concept('merit_level','hodnost zásluh')|El] získáváním [Concept('merit','zásluh')|El] a nakonec odejít z úřadu, abys mohl absolvovat [Concept('imperial_examinations','úřednické zkoušky')|El]."
 ra_merit_governor_treasury_1: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_treasury_1_desc: "$ra_treasury_1_desc$"
 ra_merit_governor_treasury_2: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_treasury_2_desc: "$ra_treasury_2_desc$"
 ra_merit_governor_treasury_3: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_treasury_3_desc: "$ra_treasury_3_desc$"
 ra_merit_governor_realm_open: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_realm_open_desc: "Když tedy máš přístup k [Concept('treasury','pokladnici')|El], bylo by dobré ji využít.\n\nV roli [Concept('governor','guvernéra')|El] vládneš zemi a lidem ve své [Concept('province','provincii')|El]. Využití $game_concept_treasury$ k investicím do ní by bylo dobrým nápadem."
 ra_merit_governor_realm_open_prompt: "Otevři panel „Panství“"
 ra_merit_governor_domain_tab_open: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_domain_tab_open_desc: "[Concept('holdings','Državy')|E], kterým vládneš, jsou uvedeny v záložce „Doména“."
 ra_merit_governor_domain_tab_open_prompt: "Otevři záložku „Doména“"
 ra_merit_governor_holdings_list: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_holdings_list_desc: "Zde vidíš každou [Concept('holding','državu')|El], které vládneš a která je také známa jako tvá [Concept('domain','doména')|El].\n\nKaždá [Concept('holding','država')|El] je ústřední osada, kde se vybírají [Concept('taxes','daně')|El] a svolávají [Concept('levy','odvedenci')|El]."
 ra_merit_governor_holdings_list_prompt: "Vyber jednu ze svých $game_concept_holdings$"
 ra_merit_governor_holding_view: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_holding_view_desc: "Zde jsou pozice, kde lze ve vybrané [Concept('holding','državě')|El] stavět [Concept('buildings','budovy')|El].\n\nProtože tyto $game_concept_buildings$ náležejí [Concept('province','provincii')|El], platíš za jejich výstavbu pomocí [Concept('treasury','pokladnice')|El], nikoli svým osobním [Concept('gold','zlatem')|El].\n\nStavba $game_concept_buildings$ v roli [Concept('governor','guvernéra')|El] ti přinese [Concept('merit','zásluhy')|El], což ti časem umožní vládnout [Concept('provinces','provinciím')|El] vyšší [Concept('title_tier','úrovně')|El].\n\n#I Klidně můžeš zahájit stavbu, než budeme pokračovat.#!"
 ra_merit_governor_activities_open: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_activities_open_desc: "V roli [Concept('governor','guvernéra')|El] můžeš svou [Concept('treasury','pokladnici')|El] využít také k provedení aktivity $activity_survey|V$."
 ra_merit_governor_activities_open_prompt: "Otevři panel „Aktivity“"
 ra_merit_governor_inspection: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_inspection_desc: "Aktivita $activity_survey|V$ odečte prostředky z [Concept('treasury','pokladnice')|El] tvé [Concept('province','provincie')|El], ale také tuto $game_concept_province$ zlepší a dá ti šanci získat [Concept('merit','zásluhy')|El]."
 ra_merit_governor_advancing_retire: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_advancing_retire_desc: "Bez ohledu na to, kolik [Concept('merit','zásluh')|El] získáš, musíš pro odemknutí vyšších [Concept('merit_levels','hodností zásluh')|El] také absolvovat [Concept('imperial_examinations','úřednické zkoušky')|El].\n\n[Concept('governors','Guvernéři')|E] se však k [Concept('imperial_examinations','úřednickým zkouškám')|El] přihlásit nesmějí.\n\nJakmile tedy dosáhneš své současné maximální [Concept('merit_level','hodnosti zásluh')|El], je odchod z úřadu a účast na $game_concept_examinations$ jediným způsobem, jak postoupit k [Concept('province','provincii')|El] vyšší [Concept('title_tier','úrovně')|El].\n\n#I Z úřadu $game_concept_governor$ můžeš odejít pomocí rozhodnutí $renounce_governorship_decision|V$ v panelu „$DECISIONS_VIEW_TITLE$“."
 ra_merit_governor_finish: "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_finish_desc: "To je prozatím vše, co je třeba říci o úřadu [Concept('governor','guvernéra')|El]. Časem se mohou objevit další rady, až narazíš na konkrétnější situace.\n\nStavba [Concept('buildings','budov')|El] v [Concept('holdings','državách')|El] [Concept('province','provincie')|El] a provádění aktivity $activity_survey|V$ je dobrý začátek, protože ti přinese [Concept('merit','zásluhy')|El]."
 reactive_advice_treasury: "$game_concept_treasury$"
 action_reactive_advice_treasury: "Rada: $ra_treasury_1$"
 action_reactive_advice_treasury_desc: "Pokladnice představuje peníze, k nimž máš přístup v roli $game_concept_governor$ nebo $game_concept_hegemon$. Otevři tuto lekci a získáš úvod do toho, jak pokladnice funguje."
 action_reactive_advice_treasury_click: "$click_to_open_lesson$"
 ra_treasury_1: "$reactive_advice_treasury$"
 ra_treasury_1_desc: "V tomto [Concept('realm','panství')|El] má [Concept('top_liege','nejvyšší lenní pán')|El] i každý [Concept('governor','guvernér')|El] [treasury_i] [Concept('treasury','pokladnici')|El].\n\nZatímco [Concept('gold','zlato')|El] je tvé osobní bohatství, $game_concept_treasury$ se smí používat pouze k vládním účelům, například ke zlepšování tvé [Concept('province','provincie')|El], pokud zastáváš úřad $game_concept_governor$.\n\n$game_concept_treasury$ je vázána na tvůj současný [Concept('title','titul')|El], takže pokud se tvé postavení v [Concept('realm','panství')|El] změní, ke své staré $game_concept_treasury$ už nebudeš mít přístup."
 ra_treasury_2: "$ra_treasury_1$"
 ra_treasury_2_desc: "Můžeš svobodně darovat vlastní [Concept('gold','zlato')|El] na doplnění [Concept('treasury','pokladnice')|El], pokud v ní docházejí prostředky.\n\nMěj však na paměti, že neexistuje žádný legální způsob, jak získat darované $game_concept_gold$ zpět!\n\n#I Pokud to někdy budeš chtít udělat, můžeš použít zvýrazněné tlačítko#!"
 ra_treasury_3: "$ra_treasury_1$"
 ra_treasury_3_desc: "Pokud ti dochází [Concept('gold','zlato')|El], můžeš použít intriku $celestial_siphon_treasury_interaction_without_scheme_suffix|V$ na sebe nebo na kteréhokoli [Concept('governor','guvernéra')|El] v [Concept('realm','panství')|El]. Tím převedeš [Concept('treasury','pokladnici')|El] cílové [Concept('character_possessive','postavy')|El] na své vlastní $game_concept_gold$.\n\nRozhodně bys však nechtěl být přistižen při zpronevěře státního majetku..."
 reactive_advice_dynastic_cycle: "$game_concept_dynastic_cycle$"
 action_reactive_advice_dynastic_cycle: "Rada: $game_concept_dynastic_cycle$"
 action_reactive_advice_dynastic_cycle_desc: "$game_concept_dynastic_cycle$ je cyklem vzestupu a pádu čínských dynastií a jejich představ o říši."
 action_reactive_advice_dynastic_cycle_click: "$click_to_open_lesson$"
 ra_dynastic_cycle_intro: "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_effects: "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_open_groups: "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_open_eras: "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_groups: "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_group_leader: "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_actions: "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_intro_desc: "#F Říše, dlouho rozdělená, se musí sjednotit;\ndlouho sjednocená, se musí rozdělit.\nTak tomu vždy bylo.\n\n — #italic Luo Kuan-čung\nPříběhy Tří říší#!#!\n\nČíně historicky vládlo mnoho různých [Concept('dynasties','dynastií')|El], oddělených obdobími válek a rozdělení.\n\n[Concept('dynastic_cycle','Dynastický cyklus')|E] představuje tento proces i boj o vliv a reformy uvnitř říše."
 ra_dynastic_cycle_open: "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_open_desc: "[Concept('dynastic_cycle','Dynastický cyklus')|E] je [Concept('situation','situace')|El], která zahrnuje všechny [Concept('rulers','vládce')|El] v Číně a jejím okolí.\n\nNyní se na něj podívejme."
 ra_dynastic_cycle_open_trigger: "Otevři zobrazení $game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_open_eras_desc: "Nejprve se podívejme na [Concept('dynastic_cycle_era_short','éru')|El], v níž se dynastický cyklus nachází."
 ra_dynastic_cycle_era_open_eras_trigger: "Otevři záložku „$dynastic_cycle_tab_dynastic_cycle$“"
 ra_dynastic_cycle_era_effects_desc: "Čína se nachází v [Concept('dynastic_cycle_era_short','éře')|El] pokroku.\n\nPokud jsi nízko postavený úředník, nejdůležitější je pochopit, jak tě ovlivňuje, což je zobrazeno zde.\n\nExistuje mnoho různých $game_concept_dynastic_cycle_eras_short$, z nichž každá povede Čínu jiným směrem."
 ra_dynastic_cycle_era_open_groups_desc: "Stav říše se nemůže změnit sám od sebe, ale ovlivňují jej mocné skupiny [Concept('characters','postav')|El] uvnitř hranic Číny. Nyní se na tyto $game_concept_characters$ podívejme."
 ra_dynastic_cycle_era_open_groups_trigger: "Otevři záložku „$dynastic_cycle_tab_movements$“"
 ra_dynastic_cycle_era_groups_desc: "Mnoho [Concept('characters','postav')|El] v Číně a jejím okolí má vliv na její budoucnost. Tyto $game_concept_characters$ náleží k [Concept('movements','hnutím')|El], z nichž každé chce Čínu vést jiným směrem.\n\nNapříklad $dynastic_cycle_participant_group_advancement_movement|V$ chce zlepšit říši pohledem dovnitř prostřednictvím [Concept('dynastic_cycle_era_short','éry')|El] pokroku, zatímco $dynastic_cycle_participant_group_expansion_movement|V$ si přeje, aby Čína rostla a rozšiřovala se vojenskou silou prostřednictvím éry expanze."
 ra_dynastic_cycle_era_group_leader_desc: "Každé [Concept('movement','hnutí')|El] má [Concept('movement_leader','vůdce hnutí')|El], který může předkládat žádosti, aby podpořil věc svého $game_concept_movement$.\n\nAbys se stal $game_concept_movement_leader$, musíš mít ve svém $game_concept_movement$ nejvyšší [Concept('movement_power','sílu hnutí')|El]."
 ra_dynastic_cycle_era_actions_desc: "Můžeš také provádět akce, jimiž ovlivníš [Concept('dynastic_cycle','dynastický cyklus')|El], buď sám, nebo prostřednictvím svého [Concept('movement','hnutí')|El].\n\nTyto akce najdeš ve spodní části okna.\n\nPokud jsi stále $dynastic_cycle_participant_group_undecided_movement|V$, měl by ses připojit k některému $game_concept_movement$."
 reactive_advice_merit_candidacy: "Kandidáti na guvernéra"
 action_reactive_advice_merit_candidacy: "Rada: $reactive_advice_merit_candidacy$"
 action_reactive_advice_merit_candidacy_desc: "Podívejme se, co je třeba k tomu, aby se člověk stal $game_concept_governor$."
 action_reactive_advice_merit_candidacy_click: "$click_to_open_lesson$"
 ra_merit_candidacy_intro: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_intro_desc: "Pouze ti s nejvyšší [Concept('merit_level','hodností zásluh')|El] se stanou [Concept('governors','guvernéry')|El].\n\nPokaždé, když $game_concept_governor$ opustí svůj úřad, je na jeho místo automaticky jmenován někdo jiný.\n\nDíky tomu budeš nakonec jmenován [Concept('governor','guvernérem')|El] už jen tím, že budeš mít dobrou $game_concept_merit_level$, pokud to [Concept('law','zákon')|El] tvého [Concept('realm','panství')|El] dovoluje."
 ra_merit_candidacy_open: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_open_desc: "Podívejme se, jak si ty a tvůj [Concept('house','rod')|El] vedete v byrokracii!"
 ra_merit_candidacy_open_prompt: "Otevři panel „$ADMINISTRATIVE_GOVERNMENT_HEADER$“ (zvýrazněný)"
 ra_merit_candidacy_house_members: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_house_members_desc: "Tento seznam ukazuje, jak dobře si každý člen tvého [Concept('house','rodu')|El] vede v byrokracii.\n\nProtože ty osobně můžeš být [Concept('governor','guvernérem')|El] pouze jedné [Concept('province','provincie')|El], je důležité podporovat v kariéře i svou širší rodinu."
 ra_merit_candidacy_merit: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_merit_desc: "Každá [Concept('character','postava')|El] má [Concept('merit_level','hodnost zásluh')|El]. Čím lepší je $game_concept_merit_level$, tím vyšší [Concept('title_tier','úrovně')|El] [Concept('provinces','provinciím')|El] mohou vládnout jako [Concept('governor','guvernér')|El].\n\nJak se tvá $game_concept_merit_level$ zvyšuje, zpřístupňují se vlivnější jmenování:\n$BULLET_WITH_TAB$#V 9. až 8.#!: $game_concept_governor$ $county_celestial_chinese_vassal$ #weak (titul [Concept('county','hrabství')|El])#!\n$BULLET_WITH_TAB$#V 7. až 6.#!: $game_concept_governor$ $duchy_celestial_chinese_vassal$ #weak (titul [Concept('duchy','vévodství')|El])#!\n$BULLET_WITH_TAB$#V 5. až 4.#!: $game_concept_governor$ $kingdom_celestial_chinese_vassal$ #weak (titul [Concept('kingdom','království')|El])#!\n$BULLET_WITH_TAB$#V 3. až 1.#!: [Concept('minister','ministr')|El] pro [Concept('son_of_heaven','Syna Nebes')|El] #weak (titul [Concept('empire','říše')|El])#!\n\n$game_concept_characters$ bez $game_concept_merit_level$ se nemohou stát $game_concept_governor$."
 ra_merit_candidacy_score: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_score_desc: "Ačkoli je [Concept('merit_level','hodnost zásluh')|El] důležitá, pokud mají dva kandidáti stejnou [Concept('merit_level','hodnost zásluh')|El], [Concept('province','provincii')|El] získá jako první ten s nejvyšším @appointment_score![Concept('candidate_score','skóre kandidáta')|El].\n\nZvýšení tvého $game_concept_candidate_score$ tedy znamená, že na to, než se staneš [Concept('governor','guvernérem')|El], nebudeš muset čekat tak dlouho.\n\nKe zvýšení $game_concept_candidate_score$ člena [Concept('house','rodu')|El] utratíš [influence_i][Concept('influence','vliv')|El] pomocí $influence_meritorious_career_interaction|V$, nebo zahájíš [Concept('scheme','intriku')|El] $promote|V$ #weak (obojí je zvýrazněno).#!"
 ra_merit_candidacy_exams: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_exams_desc: "Každá dokončená [Concept('imperial_examination','úřednická zkouška')|El] zvyšuje [Concept('merit','zásluhy')|El] a odemyká vyšší [Concept('merit_levels','hodnosti zásluh')|El].\n\nOstatní členové $game_concept_house$ se k tobě připojí, pokud půjdeš na $game_concept_examinations$, a pokusí se je dokončit.\n\nNávrat k $game_concept_examination$, kterou už jsi dokončil, tedy přináší výhody nejen tobě."
 ra_merit_candidacy_child_exams: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_child_exams_desc: "Pokud jsou někteří členové [Concept('house','rodu')|El] ještě [Concept('children','dětmi')|El], můžeš jim s kariérou pomoci také tím, že je pošleš na @child_exam_icon!#V Dětskou zkoušku#!.\n\nPokud uspějí, urychlí to jejich postup k dalším $game_concept_examinations$."
 ra_merit_candidacy_summary: "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_summary_desc: "Tím, že si zajistíš stále lepší [Concept('merit_level','hodnost zásluh')|El], budeš se účastnit [Concept('imperial_examinations','úřednických zkoušek')|El] a dobře spravovat svou [Concept('province','provincii')|El], postoupíš až na vrchol byrokracie.\n\nNa vrcholu hierarchie můžeš být dokonce jmenován [Concept('minister','ministrem')|El] a sloužit přímo [Concept('son_of_heaven','Synu Nebes')|El]!"
 action_reactive_advice_great_projects: "Rada: Velké projekty"
 reactive_advice_great_projects: "$action_reactive_advice_great_projects$"
 action_reactive_advice_great_projects_desc: "Můžeš naplánovat $game_concept_great_project$ nebo na něj přispět."
 action_reactive_advice_great_projects_click: "$click_to_open_lesson$"
 ra_gp_1: "Velké projekty"
 ra_gp_1_desc: "Můžeš zahájit [Concept('great_project','velký projekt')|El] nebo na něj přispět! Udělejme si chvíli a promluvme si o nich."
 ra_gp_1_prompt: "Otevři záložku projektů v panelu rozhodnutí (zvýrazněnou)"
 ra_gp_2: "$ra_gp_1$"
 ra_gp_2_desc: "[Concept('great_projects','Velké projekty')|E] jsou rozsáhlé podniky, které lze dokončit s pomocí několika [Concept('characters','postav')|El].\n\nPoužívají se mimo jiné ke stavbě [Concept('great_buildings','velkolepých budov')|El] a k zotavení z [Concept('natural_disasters','přírodních pohrom')|El].\n\nPodívejme se na jeden $game_concept_great_project$."
 ra_gp_2_prompt: "Otevři velký projekt (zvýrazněný)"
 ra_gp_3: "$ra_gp_1$"
 ra_gp_3_desc: "[Concept('great_projects','Velké projekty')|E] mají místo a náklady, které musí být zaplaceny, než mohou být zahájeny.\n\nJakmile jsou zahájeny, zakladatel a jeho [Concept('subjects','subjekti')|El] budou moci poskytovat [Concept('great_project_contributions','příspěvky')|El], aby pomohli s jeho dokončením, což znamená, že zakladatel obvykle nebude muset všechny $game_concept_great_project_contributions$ platit sám.\n\n$game_concept_great_projects$ obvykle vyžadují mnoho času a úsilí."
 reactive_advice_natural_disasters: "Přírodní pohromy"
 action_reactive_advice_natural_disasters: "Rada: $reactive_advice_natural_disasters$"
 action_reactive_advice_natural_disasters_desc: "Ve tvém $game_concept_realm$ došlo k $game_concept_natural_disaster$. Můžeš podniknout kroky ke zmírnění jejích následků."
 action_reactive_advice_natural_disasters_click: "$click_to_open_lesson$"
 ra_natural_disasters_1: "$reactive_advice_natural_disasters$"
 ra_natural_disasters_1_desc: "Ach ne! Tvé [Concept('realm','panství')|El] zasáhla [Concept('natural_disaster','přírodní pohroma')|El].\n\nPodívejme se, co s tím můžeš udělat."
 ra_natural_disasters_1_prompt: "Otevři situaci přírodní pohromy"
 ra_natural_disasters_2: "$reactive_advice_natural_disasters$"
 ra_natural_disasters_2_desc: "[Concept('natural_disaster','Přírodní pohroma')|E] má tři [Concept('situation_phases','fáze situace')|El].\n\n#high Varování#!: $game_concept_natural_disaster$ se blíží.\n#high Dopad#!: pohroma právě působí.\n#high Obnova#!: můžeš začít s obnovou.\n\nJako [Concept('ruler','vládce')|El] máš [Concept('subjects','subjekty')|El], kteří od tebe očekávají, že se vypořádáš s následky $game_concept_natural_disaster$."
 reactive_advice_women_in_china: "Ženy v Číně"
 action_reactive_advice_women_in_china: "Rada: Ženy v Číně"
 action_reactive_advice_women_in_china_desc: "Genderový $game_concept_law$ tvého $game_concept_realm$ ti nedovoluje stát se $game_concept_governor$."
 action_reactive_advice_women_in_china_click: "$click_to_open_lesson$"
 ra_women_in_china: "Ženy v Číně"
 ra_women_in_china_desc: "Aby ses jako žena v Číně mohla stát [Concept('governor','guvernérkou')|El], musíš změnit genderové zákony [Concept('hegemony','hegemonie')|El]. K tomu se musíš nejprve stát [Concept('hegemon','hegemonkou')|El].\n\nPokud tě takový zážitek zajímá, doporučujeme buď během nastavení změnit herní pravidla genderového zákona, nebo si na obrazovce záložek vytvořit vlastní postavu, která bude $game_concept_hegemon$."
