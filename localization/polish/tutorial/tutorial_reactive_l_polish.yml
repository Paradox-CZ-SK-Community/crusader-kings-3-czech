 ra_gp_2: "$ra_gp_1$" # todo: NEW TRANSLATION
 ra_gp_2_desc: "[Concept('great_projects','Velké projekty')|e] jsou rozsáhlé podniky, které lze dokončit za pomoci několika [Concept('characters','postavami')|e].\n\nSlouží k výstavbě [Concept('great_buildings','velkolepým budovám')|e], k obnově po [Concept('natural_disasters','přírodních pohromách')|e] a dalším věcem.\n\nPodívejme se na velký projekt." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_gp_2_prompt: "Otevřete Velký projekt (zvýrazněno)" # todo: NEW TRANSLATION
 ra_gp_3: "$ra_gp_1$" # todo: NEW TRANSLATION
 ra_gp_3_desc: "[Concept('great_projects','Velké projekty')|e] mají lokaci a Náklady, které musí být zaplaceny, než mohou být zahájeny.\n\nPo zahájení může Zakladatel a jeho [subjects|e] poskytovat [Concept('great_project_contributions','příspěvky')|e] k dokončení, takže Zakladatel obvykle nemusí platit všechny příspěvky sám.\n\nVelké projekty obvykle vyžadují mnoho času a úsilí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
