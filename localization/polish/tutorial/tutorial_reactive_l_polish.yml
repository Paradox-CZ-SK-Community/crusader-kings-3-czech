 ra_admin_gov_troops_1: "Vojenské síly v administrativní vládě"
 ra_admin_gov_troops_1b: "Vojenské síly v administrativní vládě"
 ra_admin_gov_troops_1_desc: "@ra_admin_troops_1! V [Concept('administrative_government','administrativní vládě')|e] funguje správa armády a jednotek odlišně než u jiných typů vlády.\n\nZatímco nadále máte přístup a plnou kontrolu nad svými vlastními jednotkami, máte také přístup k $TUTORIAL_PROVINCIAL_ARMIES$. V administrativní vládě může mít každá [Concept('province','provincie')|e] svou vlastní [Concept('army','armádu')|e], která je majetkem konkrétního [Concept('title','titulu')|e].\n\n[Concept('governors','Guvernéři')|e] zastávají roli jak civilního, tak vojenského úředníka, zatímco [Concept('top_liege','nejvyšší lenní pán')|e] má možnost spravovat jednotky $game_concept_governors$, převzít nad nimi kontrolu nebo je přidělit jiným guvernéry napříč [Concept('realm','panství')|e]." # todo: CONCEPT CASE
 ra_admin_gov_troops_1_prompt: "Otevřete kartu $TUTORIAL_PROVINCIAL_ARMIES_NO_TOOLTIP$ (zvýrazněno)"
 ra_admin_gov_troops_2: "Vojenské síly v administrativní vládě"
 ra_admin_gov_troops_2b: "Vojenské síly v administrativní vládě"
 ra_admin_gov_troops_2_desc: "[Concept('governors','Guvernéři')|e] mohou vytvářet [Concept('men_at_arms','ozbrojenci')|e] jako součást guvernérství, za který jsou odpovědní. Tyto jednotky patří [Concept('title','titul')|e] a mohou je půjčovat jiným guvernéry v [Concept('realm','panství')|e].\n\n[Concept('top_liege','Nejvyšší lenní pán')|e] má k dispozici $TUTORIAL_PROVINCIAL_ARMIES$ a může spravovat jednotky $game_concept_governors$. Může je použít ve svých vlastních [Concept('wars','válkách')|e] nebo je přidělit $game_concept_governors$, kteří je potřebují.\n\nTo jim umožňuje je povolat a využít, zlepšujíc obranu podél hranic panství." # todo: CONCEPT CASE
 ra_admin_gov_troops_2_prompt: "Prohlédněte si [GetPlayer.Custom('GetProvincialArmyConceptNoTooltip')]"
 ra_admin_gov_troops_3: "Získávání dalších armád"
 ra_admin_gov_troops_3_desc: "Jako [Concept('governor','guvernér')|E] můžete využít svůj [Concept('influence','vliv')|e] k přivolání pomoci $game_concept_army$ z jiné [Concept('province','provincie')|e].\n\n[Concept('top_liege','Nejvyšší lenní pán')|e] může donutit libovolného guvernéra, aby přesměroval své armádu, nebo převzít jejich kontrolu sám." # todo: CONCEPT CASE
 ra_admin_gov_troops_4: "Detaily armády"
 ra_admin_gov_troops_4_desc: "Pokud [Concept('governor','guvernér')|e] povolá jednotky v [Concept('war','válce')|e], [Concept('top_liege','nejvyšším lenním pánovi')|e] je nemůže přerozdělit, dokud nejsou rozpuštěny.\n\nV případě povstání $game_concept_governors$ proti [Concept('liege','lennímu pánovi')|e] si guvernérovi vezme zpět všechny jednotky, které pocházejí z jeho [Concept('governorship','guvernérství')|e].\n\nSledujte situaci v celém panství, abyste optimalizovali jejich využití." # todo: CONCEPT CASE
 ra_admin_gov_troops_5: "Na cestě k moci"
 ra_admin_gov_troops_5_desc: "@ra_admin_troops_5! Zatímco [Concept('administrative','administrativní')|e] [Concept('realm','panství')|e] je poháněn politickými kroky a intrikami, silná a dobře řízená armáda nejen zlepší vaši obranu, ale také pomůže ve vašich diplomatických snahách.\n\nKoneckonců vojenská moc je jen jedna z mnoha cest k moci..." # todo: CONCEPT CASE
 action_reactive_advice_laamp_contract_move: "$open_tutorial_lesson$ Nalezení kontraktů"
 action_reactive_advice_laamp_contract_move_desc: "Chybí vám místní příležitosti [Concept('task_contract','zakázku')|E]? Otevřete toto pro úvod do hledání nových kontraktů." # todo: CONCEPT CASE
 action_reactive_advice_laamp_contract_move_click: "$click_to_open_lesson$"
 reactive_advice_laamp_contract_move: "$ra_laamp_contract_move_1$"
 ra_laamp_contract_move_1: "Hledání kontraktů"
 ra_laamp_contract_move_1_desc: "Pokud ve vaší oblasti došlo k nedostatku práce nebo hledáte zajímavější zaměstnání, nejjednodušší způsob, jak najít spoustu nových [Concept('task_contracts','zakázek')|E], je přesunout svůj [Concept('camp','tábor')|E].\n\nMusíte se [Concept('travel','cestováním')|E] přemístit dostatečnou vzdálenost od místa, kde [Select_CString(ROOT.Char.IsFemale,'byla','byl')] váš starý tábor, abyste při příjezdu našli nové příležitosti." # todo: CONCEPT CASE
 ra_domicile_camp_task: "Přejděte do okna tábora"
 ra_laamp_contract_move_2: "Přesun tábora"
 ra_laamp_contract_move_2_desc: "Zde je příklad cíle, který je poměrně daleko od vašeho aktuálního umístění [Concept('camp','táboru')|E].\n\nPlánovat [Concept('travel','cestování')|E] můžete přímo z pohledu [Concept('county','hrabství')|E], na jakoukoli vybranou [Concept('barony','baronství')|E] v okrese.\n\n#weak Poznámka: Můžete také začít přesun tábora z okna tábora pomocí tlačítka Move Domicile v dolní části.#!" # todo: CONCEPT CASE
 ra_domicile_travel_task: "Přejděte do zobrazení $relocate_camp_to_interaction$"
 ra_laamp_contract_move_3: "Cestování s táborem"
 ra_laamp_contract_move_3_desc: "[Concept('traveling','Cestování')|E] s vaším [Concept('camp','táborem')|E] funguje stejně jako běžné cestování, ale vezmete s sebou všechna [Concept('camp_buildings','vylepšením tábora')|E] a [Concept('followers','družiníci')|E] a musíte utratit [Concept('provisions','proviant')|E]." # todo: CONCEPT CASE
 ra_domicile_depart_task: "Začněte přesun tábora"
 ra_laamp_contract_move_4: "$ra_laamp_contract_move_3$"
 ra_laamp_contract_move_4_desc: "$ra_laamp_contract_move_3_desc$"
 ra_domicile_arrive_task: "Dokončete přesun tábora"
 ra_laamp_contract_move_5: "Nové kontrakty"
 ra_laamp_contract_move_5_desc: "Nyní, když jste dorazili, bude vám v regionu k dispozici několik nových [Concept('task_contracts','zakázek')|E]!\n\nPamatujte, že můžete kdykoli přesunout svůj [Concept('camp','tábor')|E], abyste našli nové [Concept('task_contracts','zakázky')|E], a nové příležitosti se objeví, pokud se [Concept('travel','cestováním')|E] dostatečně daleko — jako dobré pravidlo se jeví aspoň dva [Concept('de_jure','de iure')|E] [Concept('duchies','vévodství')|E] od vašeho starého tábora." # todo: CONCEPT CASE
 reactive_advice_tutorial_war: "Válka"
 reactive_advice_lesson_army_movement: "$lesson_army_movement$"
 reactive_advice_lesson_army_purpose: "Bitvy a obléhání" # todo: NEW TRANSLATION
 reactive_advice_lesson_battle_mechanics: "$lesson_battle_mechanics$"
 reactive_advice_lesson_siege_mechanics: "$lesson_siege_mechanics$"
 reactive_advice_lesson_warscore: "$lesson_warscore$"
 reactive_advice_lesson_winning_wars: "$lesson_winning_wars$"
 reactive_advice_lesson_losing_wars: "$lesson_losing_wars$"
 reactive_advice_migration: "Migrace" # todo: NEW TRANSLATION
 action_reactive_advice_migration: "Rada: $reactive_advice_migration$"
 action_reactive_advice_migration_desc: "Jako [Concept('nomad','nomád')|E] v [Concept('the_great_steppe','velké stepi')|E] se můžete [Concept('migrate','migrovat')|E]. Otevřete toto, abyste se dozvěděli více o migraci." # todo: CONCEPT CASE
 action_reactive_advice_migration_click: "$click_to_open_lesson$"
 ra_migration_1: "$reactive_advice_migration$"
 ra_migration_1_desc: "Když hrajete jako [Concept('nomad','nomád')|E] v [Concept('the_great_steppe','velké stepi')|E], máte možnost se [Concept('migrate','migrovat')|E].\nMigrace je pro Nomády důležitá, protože je to skvělý způsob, jak najít nová území, kde může váš [Concept('herd','stádo')|E] pasouc a růst.\n\nHerd představuje vaše lidi a jejich dobytek, a váš herd potřebuje země s dobrou [Concept('county_fertility','úrodností hrabství')|E], aby měl co jíst.\nPojďme se podívat, jak najít nejlepší místa ve stepi, kde vám plodnost bude prospívat a vašemu [Concept('realm','panství')|E] pomůže růst." # todo: CONCEPT CASE
 ra_migration_1_prompt: "Klikněte na tlačítko Migrace (zvýrazněno)"
 ra_migration_1b: "$ra_migration_1$"
 ra_migration_2: "$reactive_advice_migration$"
 ra_migration_2_desc: "Výběr nového místa pro vás a váš [Concept('herd','stádo')|E] by měl být založen především na [Concept('county_fertility','úrodnost hrabství')|E]. Plodnost půdy se měří na škále od 0 do 100 a s postupem času se postupně vyčerpává, jak půdu obýváte. Když je vyčerpána, musíte se [Concept('migrate','migrovat')|E] na nové místo, abyste dál rostli." # todo: CONCEPT CASE
 ra_migration_2_prompt: "Klikněte na režim mapy pro zobrazení režimu plodnosti (zvýrazněno)"
 ra_migration_3: "$reactive_advice_migration$"
 ra_migration_3_desc: "Vzdálenost, do které se můžete [Concept('migrate','migrovat')|E], závisí na vašich [Concept('title_tiers','úrovně')|E] a na zákoně [dominance|E], který právě uplatňujete. Různé říše s velkou doménou a vysokou Dominancí budou mít odlišné potřeby ohledně migrace a v určitý okamžik už migrace možná nebude potřeba vůbec pro růst vašeho [Concept('herd','stáda')|E]. Chcete-li vybrat místo, kam byste se mohli přestěhovat, klikněte na [Concept('de_jure','de iure')|E] titul na mapě." # todo: CONCEPT CASE
 ra_migration_3_prompt: "Klikněte na libovolné místo v dosahu na mapě"
 ra_migration_4: "$reactive_advice_migration$"
 ra_migration_4_desc: "Podle vybraného místa uvidíte na mapě pinové značky, které vám ukážou konkrétní [Concept('county_fertility','úrodnost hrabství')|E], nebo součet celé [Concept('domain_fertility','úrodnost domény')|E] vybraného [Concept('de_jure','de iure')|E] titulu." # todo: CONCEPT CASE
 ra_migration_5: "$reactive_advice_migration$"
 ra_migration_5_desc: "Vybraná lokalita vaší [Concept('migration','migraci')|E] vždy obsahuje alespoň jednoho [Concept('nomad','nomáda')|E] nebo [Concept('herder','pastevec')|E], s nímž budete muset vyjednávat, aby vám umožnil přestěhovat se. Můžete jim nabídnout [Concept('herd','stádo')|E], [Concept('gold','zlato')|E] nebo použít [Concept('hook','páka')|E], abyste je přesvědčili přijmout váš návrh." # todo: CONCEPT CASE
 ra_migration_6: "$reactive_advice_migration$ (Vyjednávání přijato)"
 ra_migration_6_desc: "V cílové lokalitě může být několik [nomads|E]. Pokud byste migrovali násilně, všichni by reagovali, ale pokud dokážete přesvědčit nejsilnější postavu v oblasti, budete přijati všemi.\n\nPokud je vyjednávání o migraci přijato, opustíte svůj současný titul a možná i své [subjects|E]."
 ra_migration_7: "$reactive_advice_migration$ (Vyjednávání zamítnuto)"
 ra_migration_7_desc: "Pokud [Concept('nomad','nomád')|E] s největším [Concept('herd','stádem')|E] v oblasti váš návrh nepřijme, budete je muset vyhlásit [Concept('war','válka')|E] a bojovat proti nim i proti všem dalším nomádům, kteří dané území obývají. Celková síla hejna je zobrazena v okně pro tyto případy.\n\nPodobně jako v případě přijaté dohody, i odmítnutí povede k tomu, že opustíte svůj současný [Concept('title','titul')|E] a možná i své [subjects|E]. Budete také považováni za [Concept('unlanded','bezzemka')|E], což znamená, že nemáte žádnou [Concept('county_fertility','úrodnost hrabství')|E] a proto váš herd nebude růst.\n\nBude v nejvyšším zájmu buď válku vyhrát, nebo poté najít jiné místo, kam vy a vaše stádo migrovat." # todo: CONCEPT CASE
 ra_migration_8: "$reactive_advice_migration$"
 ra_migration_8_desc: "Pokud vše proběhne dobře s [Concept('migration','migracemi')|E], získáte spoustu nových zemí k pasení, nové možnosti řešit [Concept('settlement_issue','záležitost osídlení')|E], které vám poskytnou příležitost řešit konflikty a zvýšit místní [Concept('county_control','kontrola hrabství')|E] v nové [Concept('domain','doméně')|E].\n\nÚzemí se ve [Concept('the_great_steppe','velké stepi')|E] často mění, takže pečlivě vyvažujte svůj [Concept('dread','hrůzu')|E] a [Concept('opinion','mínění')|E], abyste si udrželi všechny dveře otevřené. Ztráta titulu pro [Concept('nomad','nomáda')|E] může znamenat trojnásobné zisky, pokud budete dále zvětšovat svůj [Concept('herd','stádo')|E] a [Concept('dominance','$game_concept_nomadic_authority$')|E]." # todo: CONCEPT CASE
 reactive_advice_great_steppe: "Velká stepa" # todo: NEW TRANSLATION
 action_reactive_advice_great_steppe: "Rada: $reactive_advice_great_steppe$"
 action_reactive_advice_great_steppe_desc: "The Great Steppe je situace, kde musíte brát v úvahu plodnost země. Otevřete toto a dozvíte se více o tom, co to ovlivňuje."
 action_reactive_advice_great_steppe_click: "$click_to_open_lesson$"
 ra_great_steppe_1: "$reactive_advice_great_steppe$"
 ra_great_steppe_1_desc: "Vítejte v [Concept('the_great_steppe','velké stepi')|E]!\n\nKdyž hrajete jako [GetGovernment( 'nomad_government' ).GetName] [Concept('ruler','vládce')|E], zajištění růstu jejich [Concept('herd','stádo')|E] je hlavní prioritou. Herd roste tím, že má úrodné pastviny k pasení, takže se budete muset stěhovat za bohatými travnatými oblastmi, aby váš stádo prosperovalo.\n\nNomádi vládnou v oblasti Steppe, kde se zúčastníte [Concept('situation','situace')|E]. Steppe je rozdělená na tři regiony, kde je kladen důraz na [Concept('county_fertility','úrodnost hrabství')|E] země." # todo: CONCEPT CASE
 ra_great_steppe_1_prompt: "Klikněte na tlačítko Situace, abyste pokračovali (zvýrazněno)"
 ra_great_steppe_1b: "$reactive_advice_great_steppe$"
 ra_great_steppe_2: "$reactive_advice_great_steppe$"
 ra_great_steppe_2_desc: "Každý ze tří regionů bude ovlivněn [Concept('steppe_season','stepní období')|E]. Tyto sezóny nejsou běžné zimy nebo léta, ale dlouhodobé efekty na [Concept('county_fertility','úrodnost hrabství')|E] krajiny.\n\nKde a jak se tyto efekty projeví, můžete vidět skrze efekty sezón. Například žití v regionu s bohatými pastvinami ovlivní plodnost pro váš [Concept('herd','stádo')|E], ale také to ovlivní názory lidí, kteří vám následují." # todo: CONCEPT CASE
 ra_great_steppe_3: "$reactive_advice_great_steppe$"
 ra_great_steppe_3_desc: "Pro plánování dopředu můžete pomoci využít svého [GetCourtPositionType('court_astrologer_court_position').GetName()]. Hvězdář předpoví šanci, které dvě sezóny budou v regionu následovat.\n\nS těmito informacemi se můžete rozhodnout, zda je lepší zůstat na místě nebo se pokusit [Concept('migrate','migrovat')|E] do sousedního regionu.\n\nČím déle zůstanete na úrodné půdě, tím větší bude váš [Concept('herd','stádo')|E] a tím šťastnější budou vaši lidé." # todo: CONCEPT CASE
 ra_great_steppe_4: "$reactive_advice_great_steppe$"
 ra_great_steppe_4_desc: "Pro přehled o tom, jak si ostatní [Concept('nomads','nomádi')|E] v [Concept('the_great_steppe','velké stepi')|E] vedou, se podívejte dolů v panelu. Nomád s největším [Concept('herd','stádem')|E] drží titul [Concept('gurkhan','gürkhan')|E], přičemž síla jejich stáda může být buď největší hrozbou, nebo největším spojencem, na kterého v stepi narazíte. Pokud tento titul držíte, můžete potenciálně zvýšit svou [dominance|E] (v panelu říše) až na pátou a poslední úroveň, Neporušenou dominanci.\n\nSíla stád se použije během válek a nájezdů, ale ve formě [Concept('horde','nomádské hordě')|E]. Horde je ta část vašeho stáda, která je schopná bojovat, takže ji vnímejte jako vaše koně, velbloudy a lidi, kteří umí střílet z luku, zatímco zbytek stáda jsou ovce, krávy a děti." # todo: CONCEPT CASE
 ra_great_steppe_5: "$reactive_advice_great_steppe$"
 ra_great_steppe_5_desc: "Pro zobrazení ostatních regionů na ně můžete kliknout v tomto zobrazení, ale ten, který na vás působí, je ten, ve kterém se právě nacházíte.\n\nTeď — jste připraveni vést své stádo v bohatých i těžkých časech? Najít nová území prostřednictvím [Concept('war','války')|E] nebo [Concept('migrating','migrující')|E] je vždy možností pro silného [GetGovernment( 'nomad_government' ).GetName] [Concept('ruler','vládce')|E], který chce ukázat svému lidu cestu k bohatým krajinám, Zlatému jablku stepi." # todo: CONCEPT CASE
 reactive_advice_kurultai: "Rada kurultaje" # todo: NEW TRANSLATION
 action_reactive_advice_kurultai: "Rada: $reactive_advice_kurultai$"
 action_reactive_advice_kurultai_desc: "Otevřete toto, abyste se dozvěděli více o nomádské radě Kurultai."
 action_reactive_advice_kurultai_click: "$click_to_open_lesson$"
 ra_kurultai_1: "$reactive_advice_kurultai$"
 ra_kurultai_1_desc: "Jako vládce v [Concept('the_great_steppe','velké stepi')|E] máte [Concept('kurultai','kurultaj')|E] [Concept('council','rady')|E].\n\nMožná už znáte fungování rady, ale když hrajete jako [Concept('nomad','nomád')|E], budete mít nový typ úředníků, kteří se zaměří více na podporu růstu [Concept('county_fertility','úrodnosti hrabství')|E] nebo [Concept('herd','stádo')|E]." # todo: CONCEPT CASE
 ra_kurultai_1_prompt: "Klikněte na panel Rady, abyste pokračovali (zvýrazněno)"
 ra_kurultai_1b: "$ra_kurultai_1$"
 ra_kurultai_2: "$reactive_advice_kurultai$"
 ra_kurultai_2_desc: "Na své [Concept('council','radu')|E] můžete mít 4 členy [kurultai|E], spolu se svým [Concept('spouse','chotí')|E] a [Concept('spymaster','špehmistr')|E]. Kurultai mohou mít různé úkoly navázané na různé [Concept('skills','dovednosti')|E], například Manage Fertility bude založený na [Concept('stewardship','správcovství')|E] vašeho kurultai. Pokud máte přiřazeného kurultai, můžete kliknout na tlačítko v levém dolním rohu pro změnu úkolu." # todo: CONCEPT CASE
 ra_kurultai_3: "$reactive_advice_kurultai$"
 ra_kurultai_3_desc: "Kurultai bude pracovat na svých přiřazených úkolech, ale jeho největší dopad bude na [Concept('succession','nástupnictví')|E] vaší [Concept('realm','panství')|E].\n\nKaždá postava v [Concept('the_great_steppe','velké stepi')|E] může být [Concept('obedient','poslušný')|E] vůči jednomu [Concept('ruler','vládci')|E], a poslušnost má velký význam zejména pro členy kurultai a jejich vliv při rozhodování o tom, kdo bude váš [Concept('heir','dědic')|E]." # todo: CONCEPT CASE
 ra_kurultai_3_prompt: "Klikněte na kartu říší, abyste pokračovali (zvýrazněno)"
 ra_kurultai_4: "$reactive_advice_kurultai$"
 ra_kurultai_4_desc: "V horní části tohoto panelu uvidíte, zda je váš [Concept('succession','nástupnictví')|E] považován za stabilní nebo chaotický. To ukáže, zda váš [Concept('heir','dědic')|E] zdědí celou vaši [Concept('realm','panství')|E], nebo zda bude rozdělena mezi jiné mocné postavy." # todo: CONCEPT CASE
 ra_kurultai_4_prompt: "Klikněte na kartu následnictví, abyste pokračovali (zvýrazněno)"
 ra_kurultai_5: "$reactive_advice_kurultai$"
 ra_kurultai_5_desc: "V zvýrazněném pruhu získáte indikaci toho, zda váš [Concept('kurultai','kurultaj')|E] a nejstarší děti schvalují [Concept('succession','nástupnictví')|E] nebo mu budou odporovat.\n\nAby bylo následnictví stabilní, musíte udržet kurultai [Concept('obedient','poslušný')|E] vám, ale také potřebujete, aby vám [Concept('steppe_seasons','stepnímu období')|E] hrály do karet. Pokud současná sezóna negativně ovlivní vaše země, jako by to udělal Zud, lidé budou mít pocit, že jste potrestáni, a budou zpochybňovat vaše rozhodnutí, kdo vás následovat. \n\nAbyste udrželi kontrolu nad následnictvím, udržujte lidi poslušné a [Concept('migrate','migrovat')|E] do zemí, které vám vyhovují." # todo: CONCEPT CASE
 reactive_advice_tributaries: "Tributáři" # todo: NEW TRANSLATION
 action_reactive_advice_tributaries: "Rada: $reactive_advice_tributaries$"
 action_reactive_advice_tributaries_desc: "Tributaries jsou typem subjektu, kterého může mít vládce. Otevřete toto, abyste získali úvod do toho, co tributáři jsou."
 action_reactive_advice_tributaries_click: "$click_to_open_lesson$"
 ra_tributaries_1: "$reactive_advice_tributaries$"
 ra_tributaries_1_desc: "[Concept('tributaries','Tributáři')|E] jsou typ [Concept('subject','subjekt')|E], vztah mezi dvěma [Concept('rulers','vládcům')|e], kde je uzavřena dohoda o [Concept('truce','příměří')|E] výměnou za pravidelné platby. Když je dohoda uzavřena, tributář poskytuje buď [Concept('herd','stádo')|E], [Concept('taxes','daně')|E] nebo [Concept('prestige','prestiž')|E] svému [suzerain|E]." # todo: CONCEPT CASE
 ra_tributaries_1_prompt: "Klikněte na panel říší, abyste pokračovali (zvýrazněno)"
 ra_tributaries_2: "$reactive_advice_tributaries$"
 ra_tributaries_2_desc: "Ve srovnání s obvyklým typem [Concept('subject','subjektem')|E], [Concept('vassals','vazaly')|E], mají [Concept('tributaries','tributáři')|E] o něco větší svobodu vůči svému [suzerain|E]. Mohou se osvobodit, pokud nejsou spokojené se svým vůdcem, a hledat štěstí jinde." # todo: CONCEPT CASE
 ra_tributaries_2_prompt: "Klikněte na kartu Subjekty, abyste pokračovali (zvýrazněno)"
 ra_tributaries_3: "$reactive_advice_tributaries$"
 ra_tributaries_3_desc: "Všechny typy [Concept('subjects','subjekti')|E] se zobrazí v panelu říší. V seznamu subjektů uvidíte, jak pravděpodobné je, že se vaši [tributaries|E] budou chtít osvobodit, a speciální [Concept('tributary_contract','tributární smlouva')|E], kde vy jako [Concept('suzerain','suzerén')|E] můžete například zvýšit nebo snížit jejich platby, nebo upravit válečnou podporu, kterou někdo z vás bude mít v nadcházejících sporech." # todo: CONCEPT CASE
 ra_tributaries_4: "$reactive_advice_tributaries$"
 ra_tributaries_4_desc: "Jelikož je [Concept('migration','migrace')|E] běžnou činností pro [nomads|E], přesun z území vašich [tributaries|E] zásadně ovlivňuje jejich ochotu zůstat vašimi tributáři. Pokud nemohou být svědky vaší moci, brzy začnou hledat ochranu a dohody s jinými [Concept('rulers','vládci')|e] blíže k nim." # todo: CONCEPT CASE
 ra_tributaries_5: "$reactive_advice_tributaries$"
 ra_tributaries_5_desc: "Pokud sami zastáváte roli [tributary|E], může vám to umožnit klidně zvětšovat svůj [Concept('herd','stádo')|E] pod ochranou většího [suzerain|E], ale moc se ve [Concept('the_great_steppe','velké stepi')|E] může rychle měnit; ujistěte se, že vy a lidé, které považujete za přátele, si v potřebě pomáháte, abyste rostli, ale nebojte se také osvobodit a přidat se na stranu většího Chána, když to situace vyžaduje." # todo: CONCEPT CASE
 reactive_advice_meritocratic_governor: "Guvernér" # todo: NEW TRANSLATION
 action_reactive_advice_meritocratic_governor: "Rada: $reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 action_reactive_advice_meritocratic_governor_desc: "Jako $game_concept_governor$ máte zvláštní pravomoci, ale i povinnosti. Otevřete toto pro úvod do role $game_concept_governor$." # todo: NEW TRANSLATION
 action_reactive_advice_meritocratic_governor_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 ra_merit_governor_intro: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_intro_desc: "Jste [Concept('governor','guvernér')|E]!\n\nJako vážený státní úředník máte přístup ke zdrojům vlády, ale musíte je dobře využívat." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_governor_advancing: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_advancing_desc: "Každý [Concept('governor','guvernér')|E] spravuje [Concept('province','provincie')|E] určitého [Concept('title_tier','úrovně')|E].\n\nOd nejnižšího po nejvyšší jsou to:\n$EFFECT_LIST_BULLET$$county_celestial_chinese_vassal$ #weak (titulu [Concept('county','hrabství')|E])#!\n$EFFECT_LIST_BULLET$$duchy_celestial_chinese_vassal$ #weak (titulu [Concept('duchy','vévodství')|E])#!\n$EFFECT_LIST_BULLET$$kingdom_celestial_chinese_vassal$ #weak (titulu [Concept('kingdom','království')|E])#!\n\nAby jste postoupili v hierarchii a dosáhli vyššího úrovně, musíte zvýšit svůj [Concept('merit_level','hodnost zásluh')|E] získáváním [Concept('merit','zásluhami')|E] a nakonec odejít do výslužby a dokončit [Concept('imperial_examinations','úřednické zkoušky')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_governor_treasury_1: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_treasury_1_desc: "$ra_treasury_1_desc$" # todo: NEW TRANSLATION
 ra_merit_governor_treasury_2: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_treasury_2_desc: "$ra_treasury_2_desc$" # todo: NEW TRANSLATION
 ra_merit_governor_treasury_3: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_treasury_3_desc: "$ra_treasury_3_desc$" # todo: NEW TRANSLATION
 ra_merit_governor_realm_open: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_realm_open_desc: "Takže vzhledem k přístupu k [Concept('treasury','pokladnici')|E] by bylo dobré jej využít.\n\nJako [Concept('governor','guvernér')|E] spravujete zemi a lidi ve své [Concept('province','provincii')|E]. Bylo by vhodné investovat do ní pomocí pokladnice." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_governor_realm_open_prompt: "Otevřete panel 'Říše'" # todo: NEW TRANSLATION
 ra_merit_governor_domain_tab_open: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_domain_tab_open_desc: "V kartě 'Doména' jsou uvedena [Concept('holdings','državy')|E], kterými vládnete." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_governor_domain_tab_open_prompt: "Otevřete kartu 'Doména'" # todo: NEW TRANSLATION
 ra_merit_governor_holdings_list: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_holdings_list_desc: "Zde vidíte všechny [Concept('holding','država')|E], kterými vládnete, známá také jako vaše [Concept('domain','doména')|E].\n\nKaždé [Concept('holding','država')|E] je centrální osada, kde se vybírají [Concept('taxes','daněmi')|E] a shromažďují [Concept('levy','odvedenec')|E] jednotky." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_governor_holdings_list_prompt: "Vyberte jedno z vašich držav" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_governor_holding_view: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_holding_view_desc: "Zde jsou pozice, kam lze ve vybraném [Concept('holding','državě')|E] stavět [Concept('buildings','budovy')|E].\n\nJelikož tyto $game_concept_buildings$ patří [Concept('province','provincie')|E], jejich výstavbu platíte z [Concept('treasury','pokladnice')|E], nikoli ze svého osobního [Concept('gold','zlata')|E].\n\nVýstavba $game_concept_buildings$ jako [Concept('governor','guvernér')|E] vám přinese [Concept('merit','zásluhy')|E], které vám nakonec umožní vládnout [Concept('provinces','provincie')|E] s vyšším [Concept('title_tier','úrovní')|E].\n\n#Neváhejte zahájit výstavbu dříve, než budeme pokračovat.#!" # todo: CONCEPT CASE
 ra_merit_governor_activities_open: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_activities_open_desc: "Jako [Concept('governor','guvernér')|E] můžete [Concept('treasury','pokladnice')|E] využít také provedením $activity_survey|V$ [Concept('activity','aktivita')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_governor_activities_open_prompt: "Otevřete panel 'Aktivity'" # todo: NEW TRANSLATION
 ra_merit_governor_inspection: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_inspection_desc: "Aktivita $activity_survey|V$ odečte z [Concept('province','provincie')|E] [Concept('treasury','pokladnice')|E], ale také zlepší $game_concept_province$ a dá vám šanci získat [Concept('merit','zásluhy')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_governor_advancing_retire: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_advancing_retire_desc: "Bez ohledu na to, kolik [Concept('merit','zásluhy')|E] získáte, k odemknutí vyšších [Concept('merit_levels','hodností zásluh')|E] musíte také dokončit [Concept('imperial_examinations','úřednické zkoušky')|E].\n\nNicméně [Concept('governors','guvernéři')|E] se nesmí přihlašovat do [Concept('imperial_examinations','úřednických zkoušek')|E].\n\nProto jakmile dosáhnete svého současného maxima [Concept('merit_level','hodnost zásluh')|E], odchod do výslužby a účast na zkoušky je jediný způsob, jak postoupit k [Concept('province','provincii')|E] vyššího [Concept('title_tier','úrovni')|E].\n\n#I Ze guvernéra můžete odejít do výslužby pomocí rozhodnutí $renounce_governorship_decision|V$ v panelu '$DECISIONS_VIEW_TITLE$'." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_governor_finish: "$reactive_advice_meritocratic_governor$" # todo: NEW TRANSLATION
 ra_merit_governor_finish_desc: "To je prozatím vše k tomu, jak být [Concept('governor','guvernér')|E]. Postupem času se může objevit více rad v konkrétnějších situacích.\n\nStavba [Concept('buildings','budovy')|E] v [Concept('holdings','državách')|E] [Concept('province','provincii')|E] a provádění aktivity $activity_survey|V$ je dobrý začátek, protože to přinese [Concept('merit','zásluhy')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_treasury: "Pokladnice" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 action_reactive_advice_treasury: "Rada: $ra_treasury_1$" # todo: NEW TRANSLATION
 action_reactive_advice_treasury_desc: "Pokladna představuje peníze, ke kterým máte přístup jako $game_concept_governor$ nebo $game_concept_hegemon$. Otevřete toto pro úvod, jak pokladna funguje." # todo: NEW TRANSLATION
 action_reactive_advice_treasury_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 ra_treasury_1: "$reactive_advice_treasury$" # todo: NEW TRANSLATION
 ra_treasury_1_desc: "V této [Concept('realm','panství')|E] má [Concept('top_liege','nejvyšším lenním pánovi')|E] i každý [Concept('governor','guvernér')|E] [treasury_i] [Concept('treasury','pokladnice')|E].\n\nZatímco [Concept('gold','zlato')|E] jsou vaše osobní bohatství, $game_concept_treasury$ má být používáno pouze pro vládní účely (např. pro zlepšení vaší [Concept('province','provincii')|E], pokud jste $game_concept_governor$).\n\nPokladnice je vázáno na váš aktuální [Concept('title','titul')|E], takže pokud se vaše postavení v [Concept('realm','panství')|E] změní, ztratíte přístup ke své staré pokladnicím." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_treasury_2: "$ra_treasury_1$" # todo: NEW TRANSLATION
 ra_treasury_2_desc: "Můžete věnovat své vlastní [Concept('gold','zlato')|E] do [Concept('treasury','pokladnice')|E], pokud dochází k nedostatku.\n\nBuďte varováni, že neexistuje žádný legální způsob, jak získat zpět darované $game_concept_gold$!\n\n#I Pokud to chcete udělat, můžete použít zvýrazněné tlačítko#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_treasury_3: "$ra_treasury_1$" # todo: NEW TRANSLATION
 ra_treasury_3_desc: "Pokud vám dochází [Concept('gold','zlato')|E], můžete použít $celestial_siphon_treasury_interaction_without_scheme_suffix|V$ [Concept('scheme','intriku')|E] na sebe nebo na kterékoliho [Concept('governor','guvernéra')|E] v [Concept('realm','panství')|E]. Tím převedete cílové [Concept('character_possessive','postavy')|E] [Concept('treasury','pokladnice')|E] na vaše vlastní zlato.\n\nNicméně byste nechtěli být přistiženi při zpronevěře státních prostředků..." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_dynastic_cycle: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 action_reactive_advice_dynastic_cycle: "Rada: $game_concept_dynastic_cycle$" # todo: NEW TRANSLATION
 action_reactive_advice_dynastic_cycle_desc: "Dynastický cyklus je cyklus vzestupu a pádu čínských dynastií a jejich vize říše." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 action_reactive_advice_dynastic_cycle_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 ra_dynastic_cycle_intro: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_effects: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_open_groups: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_open_eras: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_groups: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_group_leader: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_actions: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_intro_desc: "#F Říše, dlouho rozdělená, musí se spojit;\ndlouho sjednocená, musí se rozdělit.\nTak tomu vždy bylo.\n\n — #italic Luo Kuan-čung\nRomán tří království#!#!\n\nČína byla v historii vládnuta mnoha různými [Concept('dynasties','dynastiemi')|E], oddělenými érami válek a rozdělení.\n\n[Concept('dynastic_cycle','Dynastický cyklus')|E] představuje tento proces, stejně jako boj o vliv a reformu uvnitř říše." # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 ra_dynastic_cycle_open: "Dynastický cyklus" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_open_desc: "[Concept('dynastic_cycle','Dynastický cyklus')|E] je [Concept('situation','situace')|E], který zahrnuje všechny [Concept('rulers','vládce')|e] v a kolem Číny.\n\nPojďme se na něj nyní podívat." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_open_trigger: "Otevřete zobrazení $game_concept_dynastic_cycle$" # todo: NEW TRANSLATION
 ra_dynastic_cycle_era_open_eras_desc: "Nejprve se podívejme na [Concept('dynastic_cycle_era_short','éru')|e], ve které se dynastický cyklus nachází." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_open_eras_trigger: "Otevřete kartu '$dynastic_cycle_tab_dynastic_cycle$'" # todo: NEW TRANSLATION
 ra_dynastic_cycle_era_effects_desc: "Čína je v [Concept('dynastic_cycle_era_short','éře')|e] pokroku.\n\nPokud jste úředník nižšího stupně, nejdůležitější je pochopit, jak vás to ovlivní — to je zobrazeno zde.\n\nExistuje mnoho různých ér, z nichž každá nasměruje Čínu jiným směrem." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_open_groups_desc: "Stav říše se nemůže změnit sám od sebe, ale je ovlivňován mocnými skupinami [Concept('characters','postavami')|E] v hranicích Číny. Podívejme se nyní na tyto $game_concept_characters$." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_open_groups_trigger: "Otevřete kartu '$dynastic_cycle_tab_movements$'" # todo: NEW TRANSLATION
 ra_dynastic_cycle_era_groups_desc: "Mnoho [Concept('characters','postav')|E] v a kolem Číny má vliv na její budoucnost. Tito $game_concept_characters$ patří k [Concept('movements','hnutí')|e], z nichž každé chtějí nasměrovat Čínu jiným směrem.\n\nNapříklad $dynastic_cycle_participant_group_advancement_movement|V$ chce zlepšit říši zaměřením dovnitř skrze éru Advancement ([Concept('dynastic_cycle_era_short','éra')|e]), zatímco $dynastic_cycle_participant_group_expansion_movement|V$ přeje, aby Čína rostla a expandovala vojenskou silou prostřednictvím éry Expansion." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_group_leader_desc: "Každé [Concept('movement','hnutí')|E] má [Concept('movement_leader','vůdce hnutí')|E], který může podávat petice za prosazení věci svého hnutí.\n\nPouze nejsilnější $game_concept_characters$ v Číně se mohou stát $game_concept_movement_leader$, protože musíte mít nejvyšší [Concept('movement_power','síla hnutí')|E] v hnutí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_dynastic_cycle_era_actions_desc: "Také můžete podniknout Akce k ovlivnění [Concept('dynastic_cycle','dynastickému cyklu')|e], buď sami, nebo prostřednictvím svého [Concept('movement','hnutí')|e].\n\nTyto Akce najdete ve spodní části okna.\n\nPokud jste stále $dynastic_cycle_participant_group_undecided_movement|V$, měli byste se přidat k některému hnutí. Každé hnutí vám dává různé výhody nebo penalizace." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 reactive_advice_merit_candidacy: "Kandidáti na guvernéra" # todo: NEW TRANSLATION
 action_reactive_advice_merit_candidacy: "Rada: $reactive_advice_merit_candidacy$" # todo: NEW TRANSLATION
 action_reactive_advice_merit_candidacy_desc: "Pojďme se podívat, co je potřeba k tomu, aby se stal někdo $game_concept_governor$." # todo: NEW TRANSLATION
 action_reactive_advice_merit_candidacy_click: "$click_to_open_lesson$" # todo: NEW TRANSLATION
 ra_merit_candidacy_intro: "$reactive_advice_merit_candidacy$" # todo: NEW TRANSLATION
 ra_merit_candidacy_intro_desc: "Pouze ti s nejvyšším [Concept('merit_level','hodností zásluh')|E] se stanou [Concept('governors','guvernéry')|E].\n\nKdyž $game_concept_governor$ opustí svůj úřad, je jeho místo automaticky obsazeno jiným.\n\nTím pádem, pokud budete mít dobrý $game_concept_merit_level$, budete nakonec jmenováni [Concept('governor','guvernér')|E], pokud to [Concept('law','zákon')|e] vaší [Concept('realm','panství')|e] dovolí." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_candidacy_open: "$reactive_advice_merit_candidacy$" # todo: NEW TRANSLATION
 ra_merit_candidacy_open_desc: "Podívejme se, jak vy a vaše [Concept('house','rod')|E] postupujete v byrokracii!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_candidacy_open_prompt: "Otevřete panel '$ADMINISTRATIVE_GOVERNMENT_HEADER$' (zvýrazněno)" # todo: NEW TRANSLATION
 ra_merit_candidacy_house_members: "$reactive_advice_merit_candidacy$" # todo: NEW TRANSLATION
 ra_merit_candidacy_house_members_desc: "Tento seznam ukazuje, jak si každý člen vaší [Concept('house','rod')|E] vede v byrokracii.\n\nProtože vy osobně můžete být [Concept('governor','guvernér')|E] jen jedné [Concept('province','provincii')|E], je důležité pomáhat i širší rodině v jejich kariéře." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_candidacy_merit: "$reactive_advice_merit_candidacy$" # todo: NEW TRANSLATION
 ra_merit_candidacy_merit_desc: "Každý [Concept('character','postava')|E] má [Concept('merit_level','hodnost zásluh')|E]. Čím vyšší je $game_concept_merit_level$, tím vyšší [Concept('title_tier','úroveň')|E] [Concept('provinces','provincie')|E] mohou spravovat jako [Concept('governor','guvernér')|E].\n\nS rostoucím hodností zásluh se otevírají vlivnější funkce:\n$BULLET_WITH_TAB$#V 9th to 8th#!: $game_concept_governor$ u $county_celestial_chinese_vassal$ #weak (titulu [Concept('county','hrabství')|E])#!\n$BULLET_WITH_TAB$#V 7th to 6th#!: $game_concept_governor$ u $duchy_celestial_chinese_vassal$ #weak (titulu [Concept('duchy','vévodství')|E])#!\n$BULLET_WITH_TAB$#V 5th to 4th#!: $game_concept_governor$ u $kingdom_celestial_chinese_vassal$ #weak (titulu [Concept('kingdom','království')|E])#!\n$BULLET_WITH_TAB$#V 3rd to 1st#!: [Concept('minister','ministr')|E] pro [Concept('son_of_heaven','syna Nebes')|E] #weak (titulu [Concept('empire','říši')|E])#!\n\nPostavy, kteří nemají $game_concept_merit_level$, se nemohou stát $game_concept_governor$." # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 ra_merit_candidacy_score: "$reactive_advice_merit_candidacy$" # todo: NEW TRANSLATION
 ra_merit_candidacy_score_desc: "Ačkoliv je [Concept('merit_level','hodnost zásluh')|E] důležitá, pokud mají dva kandidáti stejné [Concept('merit_level','hodnost zásluh')|E], první dostane [Concept('province','provincie')|E] ten s nejvyšším @appointment_score![Concept('candidate_score','skórem kandidáta')|E].\n\nZvýšení vašeho skórem kandidáta proto znamená, že nebudete muset tak dlouho čekat, než se stanete [Concept('governor','guvernér')|E].\n\nChcete-li zvýšit $game_concept_candidate_score$ člena [Concept('house','rod')|E], utratíte [influence_i][Concept('influence','vliv')|E] pomocí $influence_meritorious_career_interaction|V$, nebo zahájíte $promote|V$ [Concept('scheme','intrika')|E] #weak (oba zvýrazněné).#!" # todo: CONCEPT CASE
 ra_merit_candidacy_exams: "$reactive_advice_merit_candidacy$" # todo: NEW TRANSLATION
 ra_merit_candidacy_exams_desc: "Každé dokončené [Concept('imperial_examination','úřednická zkouška')|E] zvyšuje [Concept('merit','zásluhy')|E] a odemyká vyšší [Concept('merit_levels','hodnosti zásluh')|E].\n\nDalší členové $game_concept_house$ se k vám připojí, pokud půjdete na zkoušky a pokusí se je dokončit.\n\nNavrácení se k zkoušce, které jste již dokončili, má přínosy i pro ostatní." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_candidacy_child_exams: "$reactive_advice_merit_candidacy$" # todo: NEW TRANSLATION
 ra_merit_candidacy_child_exams_desc: "Pokud jsou v [Concept('house','rodě')|E] členové, kteří jsou stále [Concept('children','děti')|E], můžete také podpořit jejich kariéru tím, že je pošlete na @child_exam_icon!#V Dětskou zkoušku#!.\n\nPokud budou úspěšní, urychlí to jejich postup k dalším zkouškám." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 ra_merit_candidacy_summary: "$reactive_advice_merit_candidacy$" # todo: NEW TRANSLATION
 ra_merit_candidacy_summary_desc: "Zajištěním stále lepšího [Concept('merit_level','hodnosti zásluh')|E], účastí na [Concept('imperial_examinations','úřednické zkoušky')|E] a dobrým vládnutím vaší [Concept('province','provincii')|E] postoupíte na vrchol byrokracie.\n\nNa vrcholu hierarchie můžete být dokonce jmenováni [Concept('minister','ministr')|E], sloužícími přímo [Concept('son_of_heaven','syn Nebes')|E]!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
