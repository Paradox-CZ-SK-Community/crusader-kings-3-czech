l_polish:
 unify_region_decision: "Sjednotit region hlavního sídla"
 unify_region_decision_desc: "Sjednocení všech národů v #EMP mém#! regionu je záslužným a spravedlivým počinem!"
 unify_region_decision_tooltip: "Upevni svou vládu nad regionem svého hlavního sídla"
 unify_region_decision_confirm: "Sjednotit region"
 tutorial_event_prefix: "Cíle vládce:"
 tutorial.1001.t: "$tutorial_event_prefix$ $unify_region_decision$"
 tutorial.1001.desc: "[councillor.GetName] mě zastihne na [ROOT.Char.Custom('GetCourtyard')]:\n\n„[councillor.Custom2('AppropriateGreetingPositive', ROOT.Char)] konáš velkou službu všem lidem v naší doméně.“ Začne mi mazat med kolem úst a zjevně za to něco chce.\n\n„Napadlo tě někdy vládnout celému regionu [region.GetName]? Mám plány, velké plány!“"
 tutorial.1001.a: "Ano, veď mě, [councillor.GetNameNoTooltip]!"
 opted_into_tutorial_objectives_tt: "#EMP Přijmout cíle vládce#!"
 enable_unify_region_decision_tt: "Zpřístupní [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('unify_region_decision').GetName]"
 tutorial.1001.b: "Je snad [Select_CString( councillor.IsFemale, 'opilá', 'opilý' )]? [Select_CString( councillor.IsFemale, 'Její', 'Jeho' )] pomoc nepotřebuji."
 tutorial.1002.t: "$tutorial_event_prefix$ Region dobyt"
 tutorial.1002.desc: "Sedím na trůnu a oknem hledím daleko do dáli, jako by přede mnou ležely všechny mé země v [region.GetName] — a jsou nedozírné."
 tutorial.1002.desc_alive: "Nechám zavolat [councillor.GetName].\n\n„Dokázali jsme to, [councillor.GetFirstNameNoTooltip], ale stále tomu nemohu uvěřit! Tvé smělé plány #EMP skutečně#! vyšly.“ Seskočím z trůnu a obejmu [Select_CString( councillor.IsFemale, 'ji', 'jej' )].\n\n„Vždycky mi bylo jasné, že to dokážeš!“ řekne [councillor.GetFirstNameNoTooltip] a obejme mě. „Dokázali jsme to pro lid.“"
 tutorial.1002.desc_dead: "\n\n[Select_CString( councillor.IsFemale, 'Ta mrcha', 'Ten parchant' )] [councillor.GetName] — [Select_CString( councillor.IsFemale, 'její', 'jeho' )] smělé plány #EMP skutečně#! vyšly."
 tutorial.1002.a: "Kéž by to [councillor.GetNameNoTooltip] [Select_CString( councillor.IsFemale, 'mohla', 'mohl' )] vidět."
 tutorial.1002.a_councillor: "Ano, dokázali jsme to pro ně!"
 ruler_objective_region_conquered_modifier: "Děti rodné země"
 ruler_objective_region_conquered_modifier_desc: "Tato dynastie získala ve svém domovském regionu drtivou převahu a hodlá mu vládnout po celá příští staletí."
 EVENT_WINDOW_OPTION_AVAILABLE_RULER_OBJECTIVES: "Tato možnost je dostupná díky aktivním cílům vládce"
 custom_ireland_development_growth: "$MOD_MONTHLY_DEVELOPMENT_GROWTH_FACTOR$ v [Concept('region','regionu')|E] [GetGeographicalRegion('custom_ireland').GetName]"
 hint_dev_example_summary: "#D Krátké shrnutí rady#!"
 hint_dev_example_description: "#D Výrazně delší popis toho, co by měl hráč dělat nebo co již možná dělá, a především proč.#!"
 hint_summary_get_succession: "Získej [title.GetNameNoTier] prostřednictvím nástupnictví"
 hint_murder_successors: "Zavraždi dědice, kteří jsou v pořadí před tebou nebo tvým dítětem"
 hint_marry_into_succession: "Pomocí #HIGH $arrange_marriage_interaction$#! [Concept('character_interaction','interakce s postavou')|E] sjednej sňatek mezi [holder.GetName] či [Select_CString( holder.IsFemale, 'jejími', 'jeho' )] [Concept('heirs','dědici')|E] a tebou či některým z tvých [Concept('dynasty_members','členů dynastie')|E], aby děti z tohoto svazku v budoucnu zdědily [Concept('title','titul')|E].\n\n#help Dávej pozor na [Concept('succession_laws','zákony nástupnictví')|E] titulu [title.GetName] a na možnost [Concept('matrilineal','matrilineárního')|E] [Concept('marriage','sňatku')|E] v #HIGH $arrange_marriage_interaction$#!, aby titul zdědily děti z tvé dynastie. Jakmile se dítě narodí, můžeš dědění urychlit použitím #HIGH $start_murder_interaction$#! [Concept('scheme','intriky')|E] proti všem, kdo jsou v pořadí nástupnictví před tvým dítětem.#!"
 hint_summary_get_title: "Vytvoř de iure titul [title.GetNameNoTier]"
 hint_summary_fabricate_claim: "Vykonstruuj nárok na [title.GetNameNoTier]"
 hint_summary_ask_for_claim: "Požádej o nárok na [title.GetNameNoTier]"
 hint_claim_benefits: "\n\nZískání nároku zpřístupní #HIGH nárokový [Concept('casus_belli','casus belli')|E]#!, s nímž můžeš ve válce získat [title.GetName]."
 hint_ask_for_claim: "Použij na svou [Concept('head_of_faith','hlavu víry')|E] [hof.GetFullName] #HIGH $hof_ask_for_claim_interaction$#! [Concept('character_interaction','interakci s postavou')|E] a výměnou za [Concept('piety','zbožnost')|E] získej [Concept('claim','nárok')|E] na tento [Concept('title','titul')|E].\n\n#help Půjde o [Concept('pressed_claim','uplatněný nárok')|E], takže jej zdědí tvé [Concept('children','děti')|E] a budou moci použít stejný casus belli.$hint_claim_benefits$#!"
 hint_fabricate_claim: "Vykonstruuj [Concept('claim','nárok')|E] pomocí #HIGH $task_fabricate_claim$#! [Concept('councillor_task','úkolu rádce')|E], který vykonává [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [chaplain.GetFirstNamePossessive].\n\n#help Čím vyšší [Concept('learning_skill','učenost')|E] má [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], tím vyšší je šance na získání nároku na [title_duchy.GetName]. Vždy půjde o [Concept('unpressed_claim','neuplatněný nárok')|E], takže jej tvé [Concept('children','děti')|E] nezdědí a musíš jednat rychle. $hint_claim_benefits$#!"
 hint_summary_get_war: "Dobuď [title.GetNameNoTier] ve válce"
 hint_declare_war_intro: "Vyhlas [Concept('war','válku')|E] pomocí [Concept('casus_belli','casus belli')|E] #HIGH [cb.GetName]#!. Vítězství ve válce ti"
 hint_declare_war_outro: "\n\n#help Prohlédni si [Concept('alliances','aliance')|E], [Concept('levies','odvedence')|E], [Concept('knights','rytíře')|E] a [Concept('men_at_arms','ozbrojence')|E] postavy [holder.GetName] a porovnej je se svými, abys měl jistotu, že zvítězíš.#!"
 hint_conquest_war: "$hint_declare_war_intro$ přidá [title.GetName] do tvé [Concept('domain','domény')|E]. $hint_declare_war_outro$"
 hint_create_title: "Vytvoř vyšší [Concept('de_jure','de iure')|E] [Concept('title','titul')|E]: [de_jure_title.GetName].\n\n#help Tím zpřístupníš [Concept('de_jure','de iure')|E] [Concept('casus_bellis','casus belli')|E] nebo zvýšíš ochotu přijmout #HIGH $offer_vassalization_interaction$#! [Concept('character_interaction','interakci s postavou')|E].#!"
 hint_summary_conquer_vassal: "Přinuť [holder.GetTitledFirstName] stát se tvým vazalem"
 hint_summary_offer_vassal: "Požádej [holder.GetTitledFirstName], aby se stal tvým vazalem"
 hint_offer_vassalization: "Proveď mírovou [Concept('vassalize','vazalizaci')|E] pomocí #HIGH $offer_vassalization_interaction$#! [Concept('character_interaction','interakce s postavou')|E].\n\n#help Tím se [holder.GetTitledFirstName] stane tvým [Concept('vassal','vazalem')|E]."
 hint_vassalization_war: "$hint_declare_war_intro$ dá [holder.GetName] za [Concept('vassal','vazala')|E]. $hint_declare_war_outro$"
 hint_summary_help_offer_vassal: "Zlepši vztahy s [holder.GetTitledFirstName] pomocí intrik"
 hint_help_offer_vassalization: "Použij na [holder.GetName] některou z následujících [Concept('character_interaction','interakcí s postavou')|E]: #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! nebo #HIGH $seduce_interaction$#!, a zlepši tak [Concept('opinion','mínění')|E], které o tobě tato postava má.\n\n#help Díky tomu bude [holder.GetTitledFirstNameNoTooltip] ochotněji přijímat #HIGH $offer_vassalization_interaction$#! [Concept('character_interaction','interakci s postavou')|E].$hint_opinion_schemes_benefits$#!"
 hint_summary_help_offer_vassal_interactions: "Zlepši vztahy s [holder.GetTitledFirstName] pomocí interakcí"
 hint_help_offer_vassalization_interactions: "Použij na [holder.GetName] některou z následujících [Concept('character_interaction','interakcí s postavou')|E]: #HIGH $gift_interaction$#!, #HIGH $offer_ward_interaction$#! nebo #HIGH $gift_artifact_interaction$#!, a zlepši tak [Concept('opinion','mínění')|E], které o tobě tato postava má.\n\n#help Díky tomu bude [holder.GetTitledFirstNameNoTooltip] ochotněji přijímat #HIGH $offer_vassalization_interaction$#! [Concept('character_interaction','interakci s postavou')|E]. $hint_opinion_interaction_benefits$#!"
 hint_summary_murder_top_liege: "Zavraždi [holder.GetTitledFirstName]"
 hint_murder_top_liege: "Použij na [holder.GetName] [Concept('character_interaction','interakci')|E] #HIGH $start_murder_interaction$#! a připrav tak tuto postavu o život.\n\n#help Tím se [title_heir.GetName], [Concept('heir','dědic')|E] titulu [title.GetName], stane novým [Concept('holder','držitelem')|E]. Noví vládci mívají slabší panství, protože se panství může rozdělit mezi další [Concept('heirs','dědice')|E] nebo protože postih za [Concept('short_reign','krátkou vládu')|E] snižuje mínění jejich vazalů, a tím i [Concept('taxes','daně')|E] a [Concept('levies','odvedence')|E].#!"
 hint_summary_get_knights: "Najmi [ROOT.Char.Custom('KnightCulturePluralNoTooltip')]"
 hint_get_knights: "Použij [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('invite_knights_decision').GetName], abys získal nové [Concept('guests','hosty')|E], které můžeš pomocí [Concept('character_interaction','interakce')|E] #HIGH $recruit_guest_interaction$#! najmout jako [Concept('knights','rytíře')|E].\n\nPoužij [Concept('character_interaction','interakci')|E] #HIGH $invite_to_court_interaction$#! na libovolnou [Concept('unlanded','bezzemskou')|E] postavu s vysokou [Concept('prowess','zdatností')|E], kterou najdeš na [Concept('courts','dvorech')|E] jiných [Concept('rulers','vládců')|E].\n\nPoužij [Concept('character_interaction','interakci')|E] #HIGH $arrange_marriage_interaction$#! a sjednávej [Concept('marry','sňatky')|E] svých [Concept('courtiers','dvořanů')|E] s jinými bezzemskými dvořany s vysokou zdatností.\n\n#help Podle svých [Concept('martial_custom','válečných zvyklostí')|E] možná budeš muset použít [Concept('matrilineal','matrilineární')|E] [Concept('marriage','sňatek')|E], aby přišli na tvůj [Concept('court','dvůr')|E]. Můžeš použít vyhledávač postav a seřadit výsledky podle zdatnosti.#!"
 hint_summary_marry_allies: "Sjednej sňatky s mocnými vládci"
 hint_marry_allies: "Použij [Concept('character_interaction','interakci')|E] #HIGH $arrange_marriage_interaction$#! a sjednej [Concept('marry','sňatek')|E] mezi sebou či členem své [Concept('close_family','nejbližší rodiny')|E] a jinými [Concept('rulers','vládci')|E] nebo členy jejich nejbližších rodin s velkou vojenskou silou, abys získal mocné [Concept('alliances','aliance')|E] (v okně interakce použij řazení podle síly aliance).$hint_allies_benefits$"
 hint_summary_perk_negotiate_allies: "Získej výhodu $defensive_negotiations_perk_name$"
 hint_allies_benefits: "\n\n#help Když budeš ve [Concept('war','válce')|E] s [holder.GetName], použij na své spojence [Concept('character_interaction','interakci')|E] #HIGH $call_ally_interaction$#!. Mohou se připojit a svými armádami ti pomoci válku vyhrát.#!"
 hint_perk_negotiate_allies: "Zvol si [Concept('diplomacy_lifestyle','diplomatický životní styl')|E] a získej dostatek bodů [Concept('experience','zkušeností')|E] k odemčení [Concept('perk','výhody')|E] [GetPerk('defensive_negotiations_perk').GetName(GetPlayer)].\n\n#help Tím odemkneš [Concept('character_interaction','interakci')|E] #HIGH $perk_alliance_interaction$#!, která ti umožní uzavírat [Concept('ally','spojenectví')|E] s jinými [Concept('rulers','vládci')|E] bez nutnosti [Concept('marrying','sňatku')|E].$hint_allies_benefits$#!"
 hint_summary_negotiate_allies: "Vyjednej aliance"
 hint_negotiate_allies: "Použij [Concept('character_interaction','interakci')|E] #HIGH $perk_alliance_interaction$#! a uzavři [Concept('ally','spojenectví')|E] s jiným [Concept('ruler','vládcem')|E] bez nutnosti [Concept('marrying','sňatku')|E].$hint_allies_benefits$"
 hint_summary_help_ask_for_claim_interactions: "Zlepši vztahy s [hof.GetTitledFirstName] pomocí interakcí"
 hint_help_help_ask_for_claim_interactions: "Použij na [hof.GetName] [Concept('character_interaction','interakce')|E] #HIGH $gift_interaction$#!, #HIGH $seek_indulgences_interaction$#!, #HIGH $offer_ward_interaction$#! nebo #HIGH $gift_artifact_interaction$#! a zlepši tak [Concept('opinion','mínění')|E], které o tobě má.\n\n#help Díky tomu bude [hof.GetTitledFirstNameNoTooltip] ochotněji přijímat [Concept('character_interaction','interakci')|E] #HIGH $hof_ask_for_claim_interaction$#!.\n\n#HIGH $seek_indulgences_interaction$#! a další možnosti: $hint_opinion_interaction_benefits$#!"
 hint_opinion_interaction_benefits: "Interakci #HIGH $gift_interaction$#! lze použít vždy, pokud máš dostatek [gold_i][Concept('gold','zlata')|E]. Interakci #HIGH $offer_ward_interaction$#! lze použít pouze tehdy, pokud máš nezletilé [Concept('child','dítě')|E] bez [Concept('guardian','poručníka')|E]. Interakci #HIGH $gift_artifact_interaction$#! lze použít pouze tehdy, pokud vlastníš [Concept('artifact','artefakt')|E]."
 hint_summary_help_ask_for_claim: "Zlepši vztahy s [hof.GetTitledFirstName] pomocí intrik"
 hint_help_help_ask_for_claim: "Použij na [hof.GetName] [Concept('character_interaction','interakce')|E] #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! nebo #HIGH $seduce_interaction$#! a zlepši tak [Concept('opinion','mínění')|E], které o tobě má.\n\n#help Díky tomu bude [hof.GetTitledFirstNameNoTooltip] ochotněji přijímat [Concept('character_interaction','interakci')|E] #HIGH $hof_ask_for_claim_interaction$#!.$hint_opinion_schemes_benefits$#!"
 hint_opinion_schemes_benefits: "\n\nInterakci #HIGH $sway_interaction$#! lze použít vždy a na kohokoli ve tvém [Concept('diplomatic_range','diplomatickém dosahu')|E]. Interakci #HIGH $befriend_interaction$#! lze použít pouze tehdy, pokud máš [Concept('perk','výhodu')|E] [GetPerk('befriend_perk').GetName(GetPlayer)] nebo [Concept('tradition','tradici')|E] [GetCultureTradition('tradition_fp2_ritualised_friendship').GetName]. Interakci #HIGH $seduce_interaction$#! lze použít pouze tehdy, pokud jsou vaše [Concept('sexuality','sexuální orientace')|E] slučitelné."
 hint_summary_recruit_maa: "Naverbuj ozbrojence"
 hint_recruit_maa: "Za [gold_i][Concept('gold','zlato')|E] vytvoř [Concept('regiments','pluky')|E] dobře vybavených a vycvičených [Concept('men_at_arms','ozbrojenců')|E], abys posílil svou [Concept('army','armádu')|E]. Otevři okno vojenství a vyber typ ozbrojenců.\n\n#help Vyber typ, který je nejlepší [Concept('counter','protijednotkou')|E] proti [Concept('men_at_arms','ozbrojencům')|E] postavy [holder.GetName]. Tuto informaci najdeš v okně postavy [holder.GetName] v popisku vojenské síly.#!"
 hint_summary_recruit_mercenaries: "Najmi žoldnéře"
 hint_recruit_mercenaries: "Za [gold_i][Concept('gold','zlato')|E] najmi [Concept('mercenaries','žoldnéře')|E], kteří posílí tvou [Concept('army','armádu')|E]. Otevři okno vojenství a vyber kartu žoldnéřů.\n\n#help [Concept('mercenaries','Žoldnéři')|E] pro tebe budou na základě [Concept('mercenary_contract','žoldnéřské smlouvy')|E] sloužit 3 roky. Smlouvu můžeš kdykoli prodloužit o další 3 roky zaplacením stejného množství zlata jako při jejich najmutí.\n\nDružinu vybírej podle množství [Concept('gold','zlata')|E], které máš k dispozici (kvůli jejímu najmutí se můžeš [Concept('debt','zadlužit')|E], zadlužení však snižuje [Concept('advantage','výhodu')|E] a zastavuje doplňování [Concept('men_at_arms','ozbrojenců')|E]), a podle toho, která je nejlepší [Concept('counter','protijednotkou')|E] proti ozbrojencům postavy [holder.GetName]. Tuto informaci najdeš v okně postavy [holder.GetName] v popisku vojenské síly.#!"
 hint_summary_take_decision: "Dokonči cíl vládce"
 hint_take_decision: "Splňuješ všechny požadavky [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('unify_region_decision').GetName]. Proveď toto rozhodnutí a dokonči tak cíl vládce."
 advice_become_house_head_summary: "Staň se [Concept('house_head','hlavou rodu')|E] svého rodu"
 advice_become_house_head_description: "[Concept('house_head','Hlava rodu')|E] si obvykle tuto roli ponechá po zbytek života. Přestože hromadné vraždění členů vlastní rodiny je vždy jednou z možností, rychlejší může být založit nový rod.\n\n#help $EFFECT_LIST_BULLET$ Napravo otevři „$DECISIONS_AND_CONTRACTS_BUTTON$“.\n$EFFECT_LIST_BULLET$ V části „#S $DECISIONS_VIEW_MAJOR_DECISIONS$#!“ najdeš [Concept('decision','rozhodnutí')|E] „#S $create_cadet_branch_decision$#!“#!"
