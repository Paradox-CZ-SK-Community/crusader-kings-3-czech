l_polish:
 unify_region_decision: "Ujednotit hlavní region" # todo: NEW TRANSLATION
 unify_region_decision_desc: "Ujednocení všech národů v #EMP mém#! regionu je cenné a spravedlivé úsilí!" # todo: NEW TRANSLATION
 unify_region_decision_tooltip: "Upevněte své panství nad regionem svého hlavního města" # todo: NEW TRANSLATION
 unify_region_decision_confirm: "Ujednotit region" # todo: NEW TRANSLATION
 tutorial_event_prefix: "Cíle panovníka:" # todo: NEW TRANSLATION
 tutorial.1001.t: "$tutorial_event_prefix$ $unify_region_decision$" # todo: NEW TRANSLATION
 tutorial.1001.desc: "[councillor.GetName] mě zastihne v [ROOT.Char.Custom('GetCourtyard')]:\n\n„[councillor.Custom2('AppropriateGreetingPositive', ROOT.Char)] [Select_CString(ROOT.Char.IsFemale,'odváděla','odváděl')] jste skvělou službu všem lidem v našem panství.“ [councillor.GetSheHe|U] mi začne lichotit, zjevně chce něco na oplátku.\n\n„[Select_CString(ROOT.Char.IsFemale,'Uvažovala','Uvažoval')] jste někdy o vládnutí nad celým regionem [region.GetName]? Mám plány, velké plány!“" # todo: NEW TRANSLATION
 tutorial.1001.a: "Ano, veď mě, [councillor.GetNameNoTooltip]!" # todo: NEW TRANSLATION
 opted_into_tutorial_objectives_tt: "#EMP Přihlásit se k cílům panovníka#!" # todo: NEW TRANSLATION
 enable_unify_region_decision_tt: "Umožní [Concept('decision','rozhodnutí')|E] [GetDecisionWithKey('unify_region_decision').GetName]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 tutorial.1001.b: "Je [Select_CString(councillor.IsFemale,'opilá','opilý')]? Nepotřebuji [Select_CString(councillor.IsFemale,'její','jeho')] pomoc." # todo: NEW TRANSLATION
 tutorial.1002.t: "$tutorial_event_prefix$ Region dobyt" # todo: NEW TRANSLATION
 tutorial.1002.desc: "Sedíc na svém trůnu hledím z okna daleko do krajiny, jako bych [Select_CString(ROOT.Char.IsFemale,'mohla','mohl')] spatřit všechna svá území v [region.GetName] — a jsou rozlehlá." # todo: NEW TRANSLATION
 tutorial.1002.desc_alive: "Zavolám [councillor.GetName].\n\n„Dokázali jsme to, [councillor.GetFirstNameNoTooltip], ale stále tomu nemohu uvěřit! Tvé ambiciózní plány se #EMP skutečně#! vydařily.“ Skočím z trůnu a obejmu [councillor.GetHerHim].\n\n„Vždycky jsem [Select_CString(ROOT.Char.IsFemale,'věděla','věděl')], že to dokážeš!“ říká [councillor.GetFirstNameNoTooltip], objímající mě. „Udělali jsme to pro lidi.“" # todo: NEW TRANSLATION
 tutorial.1002.desc_dead: "\n\nTen hajzl [councillor.GetName], [Select_CString(councillor.IsFemale,'její','jeho')] ambiciózní plány se #EMP skutečně#! vydařily." # todo: NEW TRANSLATION
 tutorial.1002.a: "Kéž by [councillor.GetNameNoTooltip] to [Select_CString(councillor.IsFemale,'mohla','mohl')] vidět." # todo: NEW TRANSLATION
 tutorial.1002.a_councillor: "Ano, udělali jsme to pro ně!" # todo: NEW TRANSLATION
 ruler_objective_region_conquered_modifier: "Děti půdy" # todo: NEW TRANSLATION
 ruler_objective_region_conquered_modifier_desc: "Tato dynastie získala drtivou převahu ve svém domovském regionu a plánuje nad ním vládnout po staletí." # todo: NEW TRANSLATION
 EVENT_WINDOW_OPTION_AVAILABLE_RULER_OBJECTIVES: "Tato možnost je dostupná kvůli aktivním cílům panovníka" # todo: NEW TRANSLATION
 custom_ireland_development_growth: "$MOD_MONTHLY_DEVELOPMENT_GROWTH_FACTOR$ v [GetGeographicalRegion('custom_ireland').GetName] [Concept('region','regionu')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_dev_example_summary: "#D Stručné shrnutí rady #!" # todo: NEW TRANSLATION
 hint_dev_example_description: "#D Podstatně delší popis toho, co by hráč měl dělat, nebo co už možná dělá, a hlavně proč.#!" # todo: NEW TRANSLATION
 hint_summary_get_succession: "Získat [title.GetNameNoTier] děděním" # todo: NEW TRANSLATION
 hint_murder_successors: "Zabijte následníky v pořadí před vámi nebo před vaším dítětem" # todo: NEW TRANSLATION
 hint_marry_into_succession: "Použijte #HIGH $arrange_marriage_interaction$#! [Concept('character_interaction','interakce s postavou')|E] k zajištění sňatku mezi [holder.GetName] nebo [holder.GetHerHis] [Concept('heirs','dědici')|E] a vámi nebo členy vaší [Concept('dynasty_members','členy dynastie')|E], aby jejich [Concept('children','děti')|E] v budoucnu zdědili [Concept('title','titul')|E].\n\n#help Dbejte na [Concept('succession_laws','zákony nástupnictví')|E] [title.GetName] a volbu [Concept('matrilineal','matrilineární')|E] [Concept('marriage','sňatek')|E] v #HIGH $arrange_marriage_interaction$#!, aby se zajistilo, že titul zdědí děti vaší dynastie. Po narození dítěte můžete dědictví urychlit použitím #HIGH $start_murder_interaction$#! [Concept('scheme','intrika')|E] na všechny v linii následnictví před vaším dítětem.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_get_title: "Vytvořit de jure titul [title.GetNameNoTier]" # todo: NEW TRANSLATION
 hint_summary_fabricate_claim: "Vytvořit nárok na [title.GetNameNoTier]" # todo: NEW TRANSLATION
 hint_summary_ask_for_claim: "Požádejte o nárok na [title.GetNameNoTier]" # todo: NEW TRANSLATION
 hint_claim_benefits: "\n\nMít nárok odemkne #HIGH Claim [Concept('casus_belli','casus belli')|E]#!, který vám umožní získat [title.GetName] ve válce." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_ask_for_claim: "Použijte #HIGH $hof_ask_for_claim_interaction$#! [Concept('character_interaction','interakce s postavou')|E] na vašeho [Concept('head_of_faith','hlavu víry')|E] [hof.GetFullName], abyste zaplatili [Concept('piety','zbožnost')|E] za [Concept('claim','nárok')|E] na tento [Concept('title','titul')|E].\n\n#help Bude to [Concept('pressed_claim','uplatněný nárok')|E], takže vaše [Concept('children','děti')|E] zdědí nárok a budou moci použít stejný casus belli.$hint_claim_benefits$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_fabricate_claim: "Vytvořte [Concept('claim','nárok')|E] pomocí vašeho [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] [chaplain.GetFirstNamePossessive] #HIGH $task_fabricate_claim$#! [Concept('councillor_task','úkol rádce')|E].\n\n#help [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName] s vyšším [Concept('learning_skill','učeností')|E] mají větší šanci získat nárok na [title_duchy.GetName]. Vždy to bude [Concept('unpressed_claim','neuplatněný nárok')|E], takže vaše [Concept('children','děti')|E] ho nezdědí — musíte jednat rychle. $hint_claim_benefits$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_get_war: "Dobýt [title.GetNameNoTier] válkou" # todo: NEW TRANSLATION
 hint_declare_war_intro: "Vyhlaste [Concept('war','válka')|E] použitím #HIGH [cb.GetName]#! [Concept('casus_belli','casem belli')|E]. Vyhrát válku bude" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_declare_war_outro: "\n\n#help Podívejte se na [Concept('alliances','alianci')|E], [Concept('levies','odvedence')|E], [Concept('knights','rytíře')|E] a [Concept('men_at_arms','ozbrojenci')|E] [holder.GetName] a porovnejte je s vašimi, abyste zajistili vítězství.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_conquest_war: "$hint_declare_war_intro$ přidělí [title.GetName] vašemu [Concept('domain','doméně')|E]. $hint_declare_war_outro$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_create_title: "Vytvořte vyšší [Concept('de_jure','de iure')|E] [Concept('title','titul')|E]: [de_jure_title.GetName].\n\n#help To odemkne [Concept('de_jure','de iure')|E] [Concept('casus_bellis','casus belli')|E] nebo zvýší ochotu přijmout #HIGH $offer_vassalization_interaction$#! [Concept('character_interaction','interakce s postavou')|E].#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_conquer_vassal: "Přinutit [holder.GetTitledFirstName] stát se vaším vazalem" # todo: NEW TRANSLATION
 hint_summary_offer_vassal: "Požádejte [holder.GetTitledFirstName], aby se stal vaším vazalem" # todo: NEW TRANSLATION
 hint_offer_vassalization: "Pokojně [Concept('vassalize','vazalizovat')|E] pomocí #HIGH $offer_vassalization_interaction$#! [Concept('character_interaction','interakce s postavou')|E].\n\n#help Tím se [holder.GetTitledFirstName] stane vaším [Concept('vassal','vazalem')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_vassalization_war: "$hint_declare_war_intro$ vám přidělí [holder.GetName] jako [Concept('vassal','vazal')|E]. $hint_declare_war_outro$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_help_offer_vassal: "Zlepšete vztahy s [holder.GetTitledFirstName] pomocí intrik" # todo: NEW TRANSLATION
 hint_help_offer_vassalization: "Použijte #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! nebo #HIGH $seduce_interaction$#! [Concept('character_interaction','interakce s postavou')|E] na [holder.GetName], abyste zlepšili jejich [Concept('opinion','mínění')|E] o vás.\n\n#help Tímto způsobem bude [holder.GetTitledFirstNameNoTooltip] ochotnější přijmout #HIGH $offer_vassalization_interaction$#! [Concept('character_interaction','interakce s postavou')|E].$hint_opinion_schemes_benefits$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_help_offer_vassal_interactions: "Zlepšete vztahy s [holder.GetTitledFirstName] pomocí interakcí" # todo: NEW TRANSLATION
 hint_help_offer_vassalization_interactions: "Použijte #HIGH $gift_interaction$#!, #HIGH $offer_ward_interaction$#! nebo #HIGH $gift_artifact_interaction$#! [Concept('character_interaction','interakce s postavou')|E] na [holder.GetName], abyste zlepšili jejich [Concept('opinion','mínění')|E] o vás.\n\n#help Tímto způsobem bude [holder.GetTitledFirstNameNoTooltip] ochotnější přijmout #HIGH $offer_vassalization_interaction$#! [Concept('character_interaction','interakce s postavou')|E]. $hint_opinion_interaction_benefits$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_murder_top_liege: "Zabijte [holder.GetTitledFirstName]" # todo: NEW TRANSLATION
 hint_murder_top_liege: "Použijte #HIGH $start_murder_interaction$#! [Concept('character_interaction','interakce s postavou')|E] na [holder.GetName], abyste je zabili.\n\n#help Tím se [Concept('heir','dědicem')|E] titulu [title.GetName], [title_heir.GetName], stane novým [Concept('holder','držiteli')|E]. Noví vládci mají obvykle slabší panství kvůli rozdělení dědictví mezi další [Concept('heirs','dědici')|E] nebo kvůli [Concept('short_reign','krátké vládě')|E] penalizaci, která snižuje názory jejich vazalů, a tím i [Concept('taxes','daně')|E] a [Concept('levies','odvedenci')|E].#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_get_knights: "Najmout [ROOT.Char.Custom('KnightCulturePluralNoTooltip')]" # todo: NEW TRANSLATION
 hint_get_knights: "Použijte [GetDecisionWithKey('invite_knights_decision').GetName] [Concept('decision','rozhodnutí')|E], abyste získali nové [Concept('guests','hosty')|E], které můžete najmout jako [Concept('knights','rytíři')|E] pomocí #HIGH $recruit_guest_interaction$#! [Concept('character_interaction','interakce s postavou')|E].\n\nPoužijte #HIGH $invite_to_court_interaction$#! [Concept('character_interaction','interakce s postavou')|E] na jakoukoli [Concept('unlanded','bezzemka')|E] postavu s vysokou [Concept('prowess','udatností')|E], kterou najdete, tím, že prohlédnete [Concept('courts','dvory')|E] ostatních [Concept('rulers','vládců')|E].\n\nPoužijte #HIGH $arrange_marriage_interaction$#! [Concept('character_interaction','interakce s postavou')|E], aby se vaši [Concept('courtiers','dvořany')|E] oženili/vydali za jiné nepozemské dvořany s vysokou zdatností.\n\n#help Na základě vašeho [Concept('martial_custom','válečnického zvyku')|E] možná budete muset použít [Concept('matrilineal','matrilineární')|E] sňatek, aby přicestovali na váš [Concept('court','dvůr')|E]. Můžete použít vyhledávač postav a seřadit podle Prowess.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_marry_allies: "Sňatky s mocnými vládci" # todo: NEW TRANSLATION
 hint_marry_allies: "Použijte #HIGH $arrange_marriage_interaction$#! [Concept('character_interaction','interakce s postavou')|E], abyste vy nebo vaše [Concept('close_family','blízká rodina')|E] uzavřeli manželství s jinými [Concept('rulers','vládci')|E] nebo členy jejich rodin s vysokou vojenskou silou a získali tak mocné [Concept('alliances','aliance')|E] (v okně interakcí použijte řazení podle: Síla aliance).$hint_allies_benefits$" # todo: RETRANSLATED ENGLISH # todo: CONCEPT CASE
 hint_summary_perk_negotiate_allies: "Získat perk $defensive_negotiations_perk_name$" # todo: NEW TRANSLATION
 hint_allies_benefits: "\n\n#help Když jste ve [Concept('war','válce')|E] proti [holder.GetName], použijte na své spojence #HIGH $call_ally_interaction$#! [Concept('character_interaction','interakce s postavou')|E]. Mohou vstoupit a použít své armády, aby vám pomohli vyhrát válku.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_perk_negotiate_allies: "Zvolte [Concept('diplomacy_lifestyle','diplomatický životní styl')|E] a získejte dostatek [Concept('experience','zkušenosti')|E] bodů k odemknutí [GetPerk('defensive_negotiations_perk').GetName(GetPlayer)] [Concept('perk','talentu')|E].\n\n#help Tímto odemknete #HIGH $perk_alliance_interaction$#! [Concept('character_interaction','interakci s postavou')|E], který vám umožní [Concept('ally','spojenec')|E] jiné [Concept('rulers','vládci')|E] bez potřeby [Concept('marrying','uzavírání sňatku')|E]. $hint_allies_benefits$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_negotiate_allies: "Vyjednat spojenectví" # todo: NEW TRANSLATION
 hint_negotiate_allies: "Použijte #HIGH $perk_alliance_interaction$#! [Concept('character_interaction','interakci s postavou')|E], abyste se spojili s jiným [Concept('ruler','vládcem')|E] bez potřeby [Concept('marrying','uzavírání sňatku')|E].$hint_allies_benefits$" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_help_ask_for_claim_interactions: "Zlepšit vztah [hof.GetTitledFirstName] pomocí interakcí" # todo: NEW TRANSLATION
 hint_help_help_ask_for_claim_interactions: "Použijte #HIGH $gift_interaction$#!, #HIGH $seek_indulgences_interaction$#!, #HIGH $offer_ward_interaction$#! nebo #HIGH $gift_artifact_interaction$#! [Concept('character_interaction','interakce s postavou')|E] na [hof.GetName], abyste zlepšili jejich [Concept('opinion','mínění')|E] o vás.\n\n#help Tímto způsobem bude [hof.GetTitledFirstNameNoTooltip] ochotnější přijmout #HIGH $hof_ask_for_claim_interaction$#! [Concept('character_interaction','interakce s postavou')|E].\n\n#HIGH $seek_indulgences_interaction$#! a $hint_opinion_interaction_benefits$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_opinion_interaction_benefits: "#HIGH $gift_interaction$#! lze použít vždy, pokud máte dost [gold_i][Concept('gold','zlato')|E]. #HIGH $offer_ward_interaction$#! pouze pokud máte nezletilé [Concept('child','dítěte')|E] bez [Concept('guardian','poručníka')|E]. #HIGH $gift_artifact_interaction$#! pouze pokud máte [Concept('artifact','artefakt')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_help_ask_for_claim: "Zlepšit vztah [hof.GetTitledFirstName] pomocí intrik" # todo: NEW TRANSLATION
 hint_help_help_ask_for_claim: "Použijte #HIGH $sway_interaction$#!, #HIGH $befriend_interaction$#! nebo #HIGH $seduce_interaction$#! [Concept('character_interaction','interakce s postavou')|E] na [hof.GetName], abyste zlepšili jejich [Concept('opinion','mínění')|E] o vás.\n\n#help Tímto způsobem bude [hof.GetTitledFirstNameNoTooltip] ochotnější přijmout #HIGH $hof_ask_for_claim_interaction$#! [Concept('character_interaction','interakce s postavou')|E].$hint_opinion_schemes_benefits$#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_opinion_schemes_benefits: "\n\n#HIGH $sway_interaction$#! lze použít vždy a na kohokoli ve vašem [Concept('diplomatic_range','diplomatickém dosahu')|E]. #HIGH $befriend_interaction$#! pouze pokud máte [GetPerk('befriend_perk').GetName(GetPlayer)] [Concept('perk','talentu')|E] nebo [GetCultureTradition('tradition_fp2_ritualised_friendship').GetName] [Concept('tradition','tradice')|E]. #HIGH $seduce_interaction$#! pouze pokud máte kompatibilní [Concept('sexuality','sexuální orientace')|E]." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_recruit_maa: "Vytvořit [Concept('men_at_arms','ozbrojenci')|E]" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_recruit_maa: "Použijte [gold_i][Concept('gold','zlato')|E] k vytvoření [Concept('regiments','plukům')|E] dobře vybavených a vycvičených [Concept('men_at_arms','ozbrojenců')|E], abyste posílili své [Concept('army','armádu')|E]. Přejděte do vojenského okna a vyberte typ [Concept('men_at_arms','ozbrojenci')|E].\n\n#help Vyberte typ podle toho, který je nejlepším [Concept('counter','kontrovat')|E] na [holder.GetNamePossessive] [Concept('men_at_arms','ozbrojence')|E]. To zjistíte v okně charakteru [Select_CString(holder.IsFemale,'jejím','jeho')] v náhledu vojenské síly.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_recruit_mercenaries: "Najmout žoldnéře" # todo: NEW TRANSLATION
 hint_recruit_mercenaries: "Použijte [gold_i][Concept('gold','zlato')|E] k najmutí [Concept('mercenaries','žoldnéřům')|E], abyste posílili své [Concept('army','armádu')|E]. Přejděte do vojenského okna a vyberte kartu žoldnéřů.\n\n#help [Concept('mercenaries','Žoldnéři')|E] budou pracovat podle [Concept('mercenary_contract','žoldnéřské smlouvy')|E] po dobu 3 let. Smlouvu můžete kdykoli prodloužit o další 3 roky zaplacením stejné částky zlata při najmutí.\n\nVyberte typ dle toho, kolik máte [Concept('gold','zlato')|E] (můžete jít do [Concept('debt','dluhu')|E] kvůli jejich najmutí; být v dluhu však snižuje [Concept('advantage','výhoda')|E] a blokuje posily [Concept('men_at_arms','ozbrojenci')|E]) a podle toho, který je nejlepším [Concept('counter','kontrovat')|E] na [holder.GetNamePossessive] [Concept('men_at_arms','ozbrojence')|E]. To zjistíte v okně charakteru [Select_CString(holder.IsFemale,'jejím','jeho')] v náhledu vojenské síly.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 hint_summary_take_decision: "Dokončit cíl panovníka" # todo: NEW TRANSLATION
 hint_take_decision: "Splňujete všechny požadavky [GetDecisionWithKey('unify_region_decision').GetName] [Concept('decision','rozhodnutí')|E], přijměte ho k dokončení cíle panovníka." # todo: NEW TRANSLATION # todo: CONCEPT CASE
 advice_become_house_head_summary: "Stát se [Concept('house_head','hlavou rodu')|E] svého rodu" # todo: NEW TRANSLATION # todo: CONCEPT CASE
 advice_become_house_head_description: " [Concept('house_head','Hlava rodu')|E] obvykle tuto roli zastává po zbytek svého života. Ačkoliv je hromadné zabíjení vlastních členů rodiny vždy možností, může být rychlejší vytvořit nový rod. \n\n#help $EFFECT_LIST_BULLET$ Otevřete '$DECISIONS_AND_CONTRACTS_BUTTON$' vpravo.\n$EFFECT_LIST_BULLET$ Pod '#S $DECISIONS_VIEW_MAJOR_DECISIONS$#!' najdete rozhodnutí '#S $create_cadet_branch_decision$#!' rozhodnutí.#!" # todo: NEW TRANSLATION # todo: CONCEPT CASE
