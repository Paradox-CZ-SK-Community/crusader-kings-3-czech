 glory_hound_tax_contribution_mult: "[Concept('modifier_contribution','Příspěvek')|E] na [Concept('tax','daních')|E] slávychtivého [Concept('vassal','vazala')|E]"
 glory_hound_levy_contribution_add: "[Concept('modifier_base_contribution','Základní příspěvek')|E] [Concept('levy','odvedenců')|E] slávychtivého [Concept('vassal','vazala')|E]"
