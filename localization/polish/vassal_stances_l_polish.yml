 minority: "Příslušník menšiny"
 minority_desc: "$minority$ označuje [Concept('vassals','vazaly')|E], kteří mají pocit, že jejich [Concept('liege','lenní pán')|E] znevýhodňuje jejich [Concept('faith','víru')|E] nebo [Concept('culture','kulturu')|E]. Vazalové znepřátelených [Concept('faiths','vír')|E] nebo vazalové [Concept('cultures','kultur')|E] s [Concept('cultural_acceptance','kulturním přijetím')|E] nižším než 30 % často přijímají tento [Concept('vassal_stance','vazalský postoj')|E].\n\n#low Vazalové typu $minority$ mají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Používá [Concept('councillor_task','úkol rádce')|E] $task_accept_culture$\n#weak (protože při kulturním přijetí nad 30 % často změní postoj)#!\n\n#low Vazalové typu $minority$ nemají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Mění [Concept('faith','víru')|E] nebo [Concept('culture','kulturu')|E] [Concept('county','hrabství')|E]\n$EFFECT_LIST_BULLET$Má vysokou [Concept('crown_authority','korunní autoritu')|E]\n\nUpřednostňují čestné a soucitné [Concept('heirs','dědice')|E], ideálně jiné víry nebo kultury než jejich současný lenní pán."
