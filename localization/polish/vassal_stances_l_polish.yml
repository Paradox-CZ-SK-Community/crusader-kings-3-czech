 parochial: "Hospodář"
 parochial_desc: "$parochial$ označuje [Concept('vassals','vazaly')|E], kteří si přejí stabilitu, decentralizaci a mír a chtějí, aby se panství nevměšovalo do vnějších záležitostí. Čestní nebo zdrženliví vazalové často přijímají tento [Concept('vassal_stance','vazalský postoj')|E].\n\n#low Vazalové typu $parochial$ mají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Staví nebo vylepšuje [Concept('holdings','državy')|E]\n$EFFECT_LIST_BULLET$Jmenuje je [Concept('guardians','poručníky')|E] členů své [Concept('close_family','nejbližší rodiny')|E]\n$EFFECT_LIST_BULLET$Používá [Concept('councillor_task','úkol rádce')|E] $task_domestic_affairs$\n\n#low Vazalové typu $parochial$ nemají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Má vysokou [Concept('crown_authority','korunní autoritu')|E]\n$EFFECT_LIST_BULLET$Vyhlašuje významnější [Concept('wars','války')|E]\n\nUpřednostňují čestné a rozumné [Concept('heirs','dědice')|E] s vysokou úrovní [stewardship_i][Concept('stewardship','správy')|E]."
 parochial_filter_option: "$parochial$"
 parochial_filter_option_desc: "Zobrazit pouze postavy s [Concept('vassal_stance','vazalským postojem')|E] typu [GetVassalStance( 'parochial' ).GetName]"
