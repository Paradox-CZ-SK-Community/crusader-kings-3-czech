 zealot: "Horlivec"
 zealot_desc: "$zealot$ označuje [Concept('vassals','vazaly')|E], kteří se zaměřují na otázky víry a oceňují zbožné činy. Horliví nebo pomstychtiví vazalové často přijímají tento [Concept('vassal_stance','vazalský postoj')|E], stejně jako [Concept('clergy','duchovenstvo')|E].\n\n#low Vazalové typu $zealot$ mají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Staví nebo vylepšuje [Concept('temple','chrámové')|E] [Concept('holdings','državy')|E]\n$EFFECT_LIST_BULLET$Uspěje v [Concept('scheme','intrice')|E] [GetScheme('learn_language').GetTypeName]\n$EFFECT_LIST_BULLET$Má [Concept('virtuous','ctnostné')|E] [Concept('traits','rysy')|E]\n$EFFECT_LIST_BULLET$Vydá se na [Concept('pilgrimage','pouť')|E] v rámci [Concept('activities','aktivity')|E]\n\n#low Vazalové typu $zealot$ nemají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Požádá [Concept('head_of_faith','hlavu víry')|E] o [gold_i][Concept('gold','zlato')|E]\n$EFFECT_LIST_BULLET$Má [Concept('sinful','hříšné')|E] [Concept('traits','rysy')|E]\n\nUpřednostňují horlivé a ctnostné [Concept('heirs','dědice')|E] s vysokou úrovní [learning_i][Concept('learning','učenosti')|E]."
