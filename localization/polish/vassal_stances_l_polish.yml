 courtly_desc: "$courtly$ [Concept('vassals','Vazalové')|E] věří v šlechtu a tradici a chtějí zachovat stávající hierarchie. Společenské nebo soucitné [Concept('vassals','vazalové')|E] často zaujmou tuto [Concept('vassal_stance','vazalský postoj')|E].\n\n#low $courtly$ [Concept('vassals','Vazalové')|E] mají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Dá jim [Concept('court_positions','dvorským úřadům')|E]\n$EFFECT_LIST_BULLET$Vytvoří nové [Concept('titles','tituly')|E]\n$EFFECT_LIST_BULLET$Pozve je na [GetActivityType('activity_feast').GetName] [Concept('activities','aktivity')|E]\n\n#low $courtly$ [Concept('vassals','Vazalové')|E] nemají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Dá [Concept('titles','tituly')|E] [Concept('lowborn','neurozeným')|E] postavám\n$EFFECT_LIST_BULLET$[Concept('marries','Uzavírá sňatek')|E] [Concept('lowborn','Neurozenou')|E] postavu jako [Concept('primary_spouse','hlavní choť')|E]\n$EFFECT_LIST_BULLET$[Concept('disinherits','Vyděďuje')|E] nesporné [Concept('heirs','dědici')|E]\n\nUpřednostňují společenské a soucitné [Concept('heirs','dědici')|E] s vysokou dovedností v [diplomacy_i][Concept('diplomacy','diplomacii')|E]." # todo: CONCEPT CASE
