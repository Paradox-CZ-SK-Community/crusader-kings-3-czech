 barons_and_minor_landholders: "Drobný zeměpán"
 barons_and_minor_landholders_desc: "$barons_and_minor_landholders$ označuje [Concept('vassals','vazaly')|E], kteří si přejí svobodu a nízké daně. Tento [Concept('vassal_stance','vazalský postoj')|E] přijímají všichni [Concept('rulers','vládci')|E] baronské úrovně.\n\n#low Vazalové typu $barons_and_minor_landholders$ mají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Má nízkou [Concept('crown_authority','korunní autoritu')|E]\n\n#low Vazalové typu $barons_and_minor_landholders$ nemají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Odnímá [Concept('baronies','baronství')|E]\n$EFFECT_LIST_BULLET$Má vysokou [Concept('crown_authority','korunní autoritu')|E]\n\nUpřednostňují štědré a soucitné [Concept('heirs','dědice')|E]."
