 zealot: "Fanatik"
 zealot_desc: "$zealot$ [Concept('vassals','Vazalové')|E] se zaměřují na záležitosti víry a jsou ovlivněni zbožnými činy. Zbožní nebo mstiví [Concept('vassals','vazalové')|E] a také [Concept('clergy','duchovenstvo')|E] často zaujmou tuto [Concept('vassal_stance','vazalský postoj')|E].\n\n#low $zealot$ [Concept('vassals','Vazalové')|E] mají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Staví nebo vylepšuje [Concept('temple','chrám')|E] [Concept('holdings','državy')|E]\n$EFFECT_LIST_BULLET$Uspěje s [GetScheme('learn_language').GetTypeName] [Concept('scheme','intrikou')|E]\n$EFFECT_LIST_BULLET$Má [Concept('virtuous','ctnostným')|E] [Concept('traits','rysů')|E]\n$EFFECT_LIST_BULLET$Vypraví se na [Concept('pilgrimage','pouť')|E] [Concept('activities','aktivity')|E]\n\n#low $zealot$ [Concept('vassals','Vazalové')|E] nemají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Požádá [Concept('head_of_faith','hlava víry')|E] o [gold_i][Concept('gold','zlato')|E]\n$EFFECT_LIST_BULLET$Má [Concept('sinful','hříšného')|E] [Concept('traits','rysů')|E]\n\nUpřednostňují horlivé a ctnostné [Concept('heirs','dědice')|E] s vysokou dovedností v [learning_i][Concept('learning','učenosti')|E]." # todo: CONCEPT CASE
