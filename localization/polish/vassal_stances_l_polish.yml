 courtly: "Dvorský šlechtic"
 courtly_desc: "$courtly$ označuje [Concept('vassals','vazaly')|E], kteří věří ve vznešenost a tradice a chtějí zachovat stávající hierarchii. Společenští nebo soucitní vazalové často přijímají tento [Concept('vassal_stance','vazalský postoj')|E].\n\n#low Vazalové typu $courtly$ mají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Svěří jim [Concept('court_positions','dvorské úřady')|E]\n$EFFECT_LIST_BULLET$Vytváří nové [Concept('titles','tituly')|E]\n$EFFECT_LIST_BULLET$Pozve je na [Concept('activities','aktivitu')|E] [GetActivityType('activity_feast').GetName]\n\n#low Vazalové typu $courtly$ nemají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Uděluje [Concept('titles','tituly')|E] postavám [Concept('lowborn','neurozeného původu')|E]\n$EFFECT_LIST_BULLET$Uzavře [Concept('marries','sňatek')|E] s postavou [Concept('lowborn','neurozeného původu')|E], která se stane [Concept('primary_spouse','hlavní chotí')|E]\n$EFFECT_LIST_BULLET$[Concept('disinherits','Vydědí')|E] nezpochybněné [Concept('heirs','dědice')|E]\n\nUpřednostňují společenské a soucitné [Concept('heirs','dědice')|E] s vysokou úrovní [diplomacy_i][Concept('diplomacy','diplomacie')|E]."
