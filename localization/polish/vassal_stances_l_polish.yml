l_polish:
 glory_hound: "Slávychtivec"
 glory_hound_desc: "$glory_hound$ označuje [Concept('vassals','vazaly')|E], kterým záleží na postavení a [Concept('prestige','prestiži')|E] a kteří chtějí světu ukázat sílu [Concept('realm','panství')|E], jehož jsou součástí. Smělí nebo bezcitní vazalové často přijímají tento [Concept('vassal_stance','vazalský postoj')|E].\n\n#low Vazalové typu $glory_hound$ mají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Má některý [Concept('succession_law','zákon nástupnictví')|E] s dělením\n$EFFECT_LIST_BULLET$Dosáhne [Concept('victory','vítězství')|E] v útočných [Concept('wars','válkách')|E]\n$EFFECT_LIST_BULLET$Pozve je na [Concept('activities','aktivitu')|E] [GetActivityType('activity_hunt').GetName]\n\n#low Vazalové typu $glory_hound$ nemají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Má vysokou [Concept('crown_authority','korunní autoritu')|E]\n$EFFECT_LIST_BULLET$Ukončí válku [Concept('defeat','porážkou')|E] nebo [Concept('white_peace','bílým mírem')|E]\n$EFFECT_LIST_BULLET$Uzavře [Concept('marries','sňatek')|E] s postavou [Concept('lowborn','neurozeného původu')|E], která se stane [Concept('primary_spouse','hlavní chotí')|E]\n\nUpřednostňují smělé a odvážné [Concept('heirs','dědice')|E] s vysokou úrovní [martial_i][Concept('martial','vojenství')|E]."
 glory_hound_filter_option: "$glory_hound$"
 glory_hound_filter_option_desc: "Zobrazit pouze postavy s [Concept('vassal_stance','vazalským postojem')|E] typu [GetVassalStance( 'glory_hound' ).GetName]"
 glory_hound_vassal: "[GetVassalStance( 'glory_hound' ).GetTextIcon]Slávychtivý [Concept('vassal','vazal')|E]"
 glory_hound_vassals: "[GetVassalStance( 'glory_hound' ).GetTextIcon]Slávychtiví [Concept('vassals','vazalové')|E]"
 glory_hound_opinion: "Mínění slávychtivého [Concept('vassal','vazala')|E]"
 glory_hound_same_faith_opinion: "$glory_hound_opinion$ #weak (Stejná [Concept('faith','víra')|E])#!"
 glory_hound_different_faith_opinion: "$glory_hound_opinion$ #weak (Odlišná [Concept('faith','víra')|E])#!"
 glory_hound_same_culture_opinion: "$glory_hound_opinion$ #weak (Stejná [Concept('culture','kultura')|E])#!"
 glory_hound_different_culture_opinion: "$glory_hound_opinion$ #weak (Odlišná [Concept('culture','kultura')|E])#!"
