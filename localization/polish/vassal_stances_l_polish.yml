 belligerent_desc: "[SelectLocalization(GetPlayer.GetGovernment.IsType('nomad_government'), 'belligerent_nomad_desc', 'belligerent_general_desc')]"
 belligerent_nomad_desc: "$belligerent$ [Concept('vassals','Vazalové')|E] hledají příklady autority u svého [Concept('liege','lenního pána')|E]. Často se účastní turnajů, aby viděli na vlastní oči panovníkova [Concept('prowess','udatnost')|E] předvedení. [Concept('nomads','Nomádi')|E] mají větší šanci zaujmout tuto [Concept('vassal_stance','vazalský postoj')|E].\n\n#low $belligerent$ [Concept('vassals','Vazalové')|E] mají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Má vysoké [Concept('nomadic_authority','dominancí')|E]\n$EFFECT_LIST_BULLET$Organizuje [GetActivityType( 'activity_tournament' ).GetName] a vyhrává [Concept('contests','soutěže')|E]\n$EFFECT_LIST_BULLET$Organizuje [GetActivityType( 'activity_hunt' ).GetName] [Concept('activities','aktivity')|E]\n$EFFECT_LIST_BULLET$Vyhrává [Concept('single_combat_duel_plural','duely')|E]\n$EFFECT_LIST_BULLET$Požaduje [Concept('obedience','poslušnost')|E]\n\n#low $belligerent$ [Concept('vassals','Vazalové')|E] nemají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Prohraje [Concept('single_combat_duel_plural','duely')|E]\n$EFFECT_LIST_BULLET$Má nízké [Concept('obedience','poslušností')|E]\n$EFFECT_LIST_BULLET$Má některé dělení [Concept('succession_laws','zákony nástupnictví')|E]\n\nUpřednostňují odvážné a rozzuřené [Concept('heirs','dědice')|E] s vysokou dovedností v [prowess_i][Concept('prowess','udatnosti')|E]." # todo: CONCEPT CASE
 belligerent_general_desc: "$belligerent$ [Concept('vassals','Vazalové')|E] hledají příklady autority u svého [Concept('liege','lenního pána')|E]. Často se účastní turnajů, aby viděli na vlastní oči panovníkova [Concept('prowess','udatnost')|E] předvedení. [Concept('nomads','Nomádi')|E] mají větší šanci zaujmout tuto [Concept('vassal_stance','vazalský postoj')|E].\n\n#low $belligerent$ [Concept('vassals','Vazalové')|E] mají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Má vysokou [Concept('crown_authority','korunní autority')|E]\n$EFFECT_LIST_BULLET$Organizuje [GetActivityType( 'activity_tournament' ).GetName] a vyhrává [Concept('contests','soutěže')|E]\n$EFFECT_LIST_BULLET$Organizuje [GetActivityType( 'activity_hunt' ).GetName] [Concept('activities','aktivity')|E]\n$EFFECT_LIST_BULLET$Vyhrává [Concept('single_combat_duel_plural','duely')|E]\n\n#low $belligerent$ [Concept('vassals','Vazalové')|E] nemají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Prohraje [Concept('single_combat_duel_plural','duely')|E]\n$EFFECT_LIST_BULLET$Má nízkou [Concept('crown_authority','korunní autority')|E]\n$EFFECT_LIST_BULLET$Má některé dělicí [Concept('succession_laws','zákony nástupnictví')|E]\n\nUpřednostňují odvážné a rozzuřené [Concept('heirs','dědice')|E] s vysokou dovedností v [prowess_i][Concept('prowess','udatnosti')|E]." # todo: CONCEPT CASE
