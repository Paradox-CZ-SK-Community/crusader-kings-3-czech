l_polish:
 glory_hound: "Hledač slávy"
 glory_hound_desc: "$glory_hound$ [Concept('vassals','Vazalové')|E] dbají na postavení a prestiž a chtějí světu ukázat sílu říše, jejímž jsou součástí. Odvážní nebo necitliví [Concept('vassals','vazalové')|E] často zaujmou tuto [Concept('vassal_stance','vazalský postoj')|E].\n\n#low $glory_hound$ [Concept('vassals','Vazalové')|E] mají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Používá některé dělicí [Concept('succession_law','zákon nástupnictví')|E]\n$EFFECT_LIST_BULLET$Dosáhne [Concept('victory','vítězství')|E] v útočných [Concept('wars','válkách')|E]\n$EFFECT_LIST_BULLET$Pozve je na [GetActivityType('activity_hunt').GetName] [Concept('activities','aktivity')|E]\n\n#low $glory_hound$ [Concept('vassals','Vazalové')|E] nemají rádi, když jejich panovník:#!\n$EFFECT_LIST_BULLET$Má vysokou [Concept('crown_authority','korunní autority')|E]\n$EFFECT_LIST_BULLET$Podepíše [Concept('defeat','porážka')|E] nebo [Concept('white_peace','bílý mír')|E] ve [Concept('wars','válkách')|E]\n$EFFECT_LIST_BULLET$[Concept('marries','Uzavírá sňatek')|E] [Concept('lowborn','Neurozenou')|E] postavu jako [Concept('primary_spouse','hlavní choť')|E]\n\nUpřednostňují odvážné a statečné [Concept('heirs','dědici')|E] s vysokou dovedností v [martial_i][Concept('martial','válečnictví')|E]." # todo: CONCEPT CASE
