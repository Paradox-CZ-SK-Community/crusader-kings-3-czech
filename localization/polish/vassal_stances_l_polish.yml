 belligerent: "Bojechtivec"
 belligerent_desc: "[SelectLocalization(GetPlayer.GetGovernment.IsType('nomad_government'), 'belligerent_nomad_desc', 'belligerent_general_desc')]"
 belligerent_nomad_desc: "$belligerent$ označuje [Concept('vassals','vazaly')|E], kteří od svého [Concept('liege','lenního pána')|E] očekávají projevy autority. Často se účastní turnajů, aby na vlastní oči viděli jeho činy dokazující [Concept('prowess','udatnost')|E]. [Concept('nomads','Nomádi')|E] častěji přijímají tento [Concept('vassal_stance','vazalský postoj')|E].\n\n#low Vazalové typu $belligerent$ mají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Má vysokou [Concept('nomadic_authority','dominanci')|E]\n$EFFECT_LIST_BULLET$Uspořádá [GetActivityType( 'activity_tournament' ).GetName] a vyhrává [Concept('contests','soutěže')|E]\n$EFFECT_LIST_BULLET$Pořádá [Concept('activities','aktivitu')|E] [GetActivityType( 'activity_hunt' ).GetName]\n$EFFECT_LIST_BULLET$Vyhrává [Concept('single_combat_duel_plural','duely')|E]\n$EFFECT_LIST_BULLET$Vyžaduje [Concept('obedience','poslušnost')|E]\n\n#low Vazalové typu $belligerent$ nemají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Prohrává [Concept('single_combat_duel_plural','duely')|E]\n$EFFECT_LIST_BULLET$Má nízkou [Concept('obedience','poslušnost')|E]\n$EFFECT_LIST_BULLET$Má některý [Concept('succession_laws','zákon nástupnictví')|E] založený na dělení\n\nUpřednostňují smělé a hněvivé [Concept('heirs','dědice')|E] s vysokou [prowess_i][Concept('prowess','udatností')|E]."
 belligerent_general_desc: "$belligerent$ označuje [Concept('vassals','vazaly')|E], kteří od svého [Concept('liege','lenního pána')|E] očekávají projevy autority. Často se účastní turnajů, aby na vlastní oči viděli jeho činy dokazující [Concept('prowess','udatnost')|E]. [Concept('nomads','Nomádi')|E] častěji přijímají tento [Concept('vassal_stance','vazalský postoj')|E].\n\n#low Vazalové typu $belligerent$ mají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Má vysokou [Concept('crown_authority','korunní autoritu')|E]\n$EFFECT_LIST_BULLET$Uspořádá [GetActivityType( 'activity_tournament' ).GetName] a vyhrává [Concept('contests','soutěže')|E]\n$EFFECT_LIST_BULLET$Pořádá [Concept('activities','aktivitu')|E] [GetActivityType( 'activity_hunt' ).GetName]\n$EFFECT_LIST_BULLET$Vyhrává [Concept('single_combat_duel_plural','duely')|E]\n\n#low Vazalové typu $belligerent$ nemají rádi, když jejich lenní pán:#!\n$EFFECT_LIST_BULLET$Prohrává [Concept('single_combat_duel_plural','duely')|E]\n$EFFECT_LIST_BULLET$Má nízkou [Concept('crown_authority','korunní autoritu')|E]\n$EFFECT_LIST_BULLET$Má některý [Concept('succession_laws','zákon nástupnictví')|E] založený na dělení\n\nUpřednostňují smělé a hněvivé [Concept('heirs','dědice')|E] s vysokou [prowess_i][Concept('prowess','udatností')|E]."
