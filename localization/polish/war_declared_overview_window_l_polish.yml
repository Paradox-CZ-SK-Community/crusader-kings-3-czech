l_polish:
 WAR_DECLARED_OVERVIEW_DISMISS: "Shromážděte vojsko!"
 WAR_DECLARED_OVERVIEW_FLAVOR: "[WAR.Custom('WarDeclaredOpening')][WAR.Custom('WarDeclaredFlavor')]"
 war_declared_opening.neutral: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreeting',ROOT.War.GetActiveCB.GetDefender)]\n\n"
 war_declared_opening.negative: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateGreetingNegative',ROOT.War.GetActiveCB.GetDefender)]\n\n"
 war_declared_flavor.zealous: "Tvé hanebné skutky zůstávaly bez trestu už příliš dlouho. Dnes se to změní, neboť jsem [Select_CString( ROOT.War.GetActiveCB.GetAttacker.IsFemale, 'přišla', 'přišel' )], abych na tebe seslal[Select_CString( ROOT.War.GetActiveCB.GetAttacker.IsFemale, 'a', '' )] svatou odplatu! [ROOT.War.GetActiveCB.GetAttacker.Custom('ZealousDoW')]"
 war_declared_flavor.zealous.mercifulgod: "Kéž se nad tebou [ROOT.Char.GetFaith.HighGodName] smiluje, neboť ode mě se milosti nedočkáš!"
 war_declared_flavor.zealous.reincarnation: "Kéž je tvůj příští život méně ubohý než tento."
 war_declared_flavor.zealous.fallback: "Nemohu prohrát, neboť [ROOT.Char.GetFaith.HighGodName] stojí při mně!"
 war_declared_flavor.naughty: "Byl[Select_CString( ROOT.War.GetActiveCB.GetDefender.IsFemale, 'a', '' )] jsi velmi zlobiv[Select_CString( ROOT.War.GetActiveCB.GetDefender.IsFemale, 'á holka', 'ý kluk' )]. Takové chování nelze přehlédnout! Připrav se, neboť na bojišti ti uštědřím trest, který si po zásluze zasloužíš!"
 war_declared_flavor.holy_war: "Tvé falešné náboženství drželo tvé poddané v temnotě už příliš dlouho. [ROOT.War.GetActiveCB.GetAttacker.GetFaith.HighGodName] jim přinese skrze mé ruce pravou víru a vysvobodí je z tvého rouhačství!"
 war_declared_flavor.greedy: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Dlouho jsem prahl[Select_CString( ROOT.War.GetActiveCB.GetAttacker.IsFemale, 'a', '' )] po tvých zemích, ale jejich držení mi bylo odpíráno. Dost! Nastal čas, abych konečně získal[Select_CString( ROOT.War.GetActiveCB.GetAttacker.IsFemale, 'a', '' )], co mi náleží!"
 war_declared_flavor.dejure: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Již nemohu snášet, že okupuješ země, které mi právem náleží. Nastal čas, aby se vrátily do mého držení!"
 war_declared_flavor.subjugation: "Rozhodl[Select_CString( ROOT.War.GetActiveCB.GetAttacker.IsFemale, 'a', '' )] jsem se začlenit tvé země do svého panství. Podrob se nyní a projevím ti milost... Vzdoruj a donutím tě přede mnou pokleknout a poníženě žadonit!"
 war_declared_flavor.subjugation.tribal: "Ty jsi slab[Select_CString( ROOT.War.GetActiveCB.GetDefender.IsFemale, 'á', 'ý' )] a já jsem siln[Select_CString( ROOT.War.GetActiveCB.GetAttacker.IsFemale, 'á', 'ý' )]. K tomu, abych si [Select_CString( ROOT.War.GetActiveCB.GetAttacker.IsFemale, 'přišla', 'přišel' )] vzít, co se mi zachce, nepotřebuji žádné jiné ospravedlnění!"
 war_declared_flavor.subjugation.arrogant: "Jaká opovážlivost předstírat, že jsi mi [Select_CString( ROOT.War.GetActiveCB.GetDefender.IsFemale, 'rovna', 'roven' )], když tě tak očividně převyšuji! Rozdrtím tvá ubohá vojska na bojišti a donutím tě přede mnou pokleknout!"
 war_declared_flavor.conquest: "Jsi slab[Select_CString( ROOT.War.GetActiveCB.GetDefender.IsFemale, 'á vládkyně', 'ý vládce' )] a nezasloužíš si země, které držíš. Ukážu ti, jak vypadá skutečný panovník, až ti tyto země vyrvu!"
 war_declared_flavor.peasant: "Tvá domýšlivost nezná mezí. Neměj obavy, brzy dostaneš lekci z pokory!"
 war_declared_flavor.populist: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Chceš-li válku, budeš ji mít! Nedovolíme nikomu, aby nám zabránil vytvořit si vlastní panství!"
 war_declared_flavor.independence: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Pod tvou vládou jsme žili příliš dlouho. Už to nebudeme snášet. Krví a ocelí si vybojujeme svobodu!"
 war_declared_flavor.liberty: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Už nemůžeme snášet kruté zákony, které porušují naše odvěká práva. Mečem je skoncujeme!"
 war_declared_flavor.claimant: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('NegativeSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Jsi samozvanec a tyran. Nastal čas vrátit na trůn právoplatného panovníka!"
 war_declared_flavor.retraction_refused: "$char_interaction.0221.desc$"
 war_declared_flavor.revocation_refused: "$char_interaction.0201.desc$"
 war_declared_flavor.imprisonment_refused: "Prohlašuji tě za tyrana a odmítám se podřídit tvé moci! Panství povstane proti tvé zhoubné vládě!"
 war_declared_flavor.fallback: "[ROOT.War.GetActiveCB.GetAttacker.Custom2('AppropriateSupplimentaryGreeting',ROOT.War.GetActiveCB.GetDefender)] Zdá se, že nám nezbývá než náš spor rozhodnout na bojišti."
 is_war_overview_tab_open_trigger: "Má otevřenou záložku s přehledem války"
