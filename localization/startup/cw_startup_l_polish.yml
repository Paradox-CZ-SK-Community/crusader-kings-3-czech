 CW_STARTUP_PERMISSION_TITLE: "Je vyžadováno oprávnění" # todo: NEW TRANSLATION
 CW_STARTUP_PERMISSION_BODY_OSX: "$GAME_NAME$ potřebuje oprávnění k přístupu ke složce Dokumenty, aby mohl ukládat vaše nastavení a hry.\n\nPovolte přístup v části Nastavení systému > Soukromí a zabezpečení > Soubory a složky (nebo Úplný přístup k disku) a poté hru znovu spusťte." # todo: NEW TRANSLATION
 CW_STARTUP_PERMISSION_BODY_GENERIC: "$GAME_NAME$ nemohl zapisovat do vaší uživatelské složky, což je nutné k ukládání nastavení a her.\n\nPříčinou bývá blokování přístupu antivirem nebo bezpečnostním softwarem, případně omezená oprávnění ke složce. Povolte $GAME_NAME$ přístup (nebo zkontrolujte oprávnění ke složce) a poté hru znovu spusťte." # todo: NEW TRANSLATION
 CW_STARTUP_PERMISSION_OPEN_SETTINGS: "Otevřít nastavení soukromí" # todo: NEW TRANSLATION
 CW_STARTUP_PERMISSION_QUIT: "Ukončit" # todo: NEW TRANSLATION
